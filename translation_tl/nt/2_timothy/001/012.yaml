id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: tl
  text: Dahil dito, dinaranas ko rin ang mga paghihirap na ito. Ngunit hindi ako nahihiya, sapagkat kilala ko ang aking pinananaligan[a], at natitiyak kong kaya niyang ingatan ang aking deposito[b] hanggang sa araw na iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang sinampalatayanan ko” o “ang pinagkatiwalaan ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “deposito” rito ay isang bagay na inilagak sa pangangalaga ng iba upang maingatan. Maaaring tumukoy ito sa ipinagkatiwala ni Pablo sa Diyos, o sa ipinagkatiwala kay Pablo.
    reason: alternative_reading
  - marker: c
    text: Tumutukoy ito sa darating na araw ng pangwakas na paghatol at pagbibigay-katarungan ng Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Dahil dito
  rationale: Natural na pananalitang sanhi sa modernong Tagalog na malinaw na nag-uugnay sa naunang sinabi.
- source_word: ταῦτα πάσχω
  choice: dinaranas ko rin ang mga paghihirap na ito
  rationale: Ipinahahayag ng πάσχω ang pagdurusa o pagdanas ng hirap. Nililinaw ng “mga paghihirap” ang negatibong diwa sa natural na Tagalog habang pinananatili ng “ito” ang demonstratibo.
- source_word: οὐκ ἐπαισχύνομαι
  choice: hindi ako nahihiya
  rationale: Ito ang karaniwan at tuwirang katumbas ng pagkapahiya o pagkadama ng hiya sa kontekstong ito.
- source_word: οἶδα
  choice: kilala ko
  rationale: Dahil tao ang layon ng kaalaman, mas natural sa Tagalog ang “kilala ko” kaysa “alam ko,” habang pinananatili ang kasalukuyang statibong diwa.
- source_word: ᾧ πεπίστευκα
  choice: ang aking pinananaligan
  rationale: Natural na inilalarawan ang personal na pinagtitiwalaan o sinasampalatayanan ni Pablo at hindi tahasang pinapangalanan ang tinutukoy na persona.
- source_word: πέπεισμαι
  choice: natitiyak ko
  rationale: Ipinahahayag nito ang matatag at nananatiling katiyakan ng perfect passive form sa malinaw na modernong Tagalog.
- source_word: δυνατός ἐστιν
  choice: kaya niya
  rationale: Maikli at natural na pagpapahayag ng kakayahan nang hindi binabawasan ang bigat ng pahayag.
- source_word: τὴν παραθήκην μου
  choice: ang aking deposito
  rationale: Pinananatili ng “deposito” ang larawan ng isang bagay na inilagak sa pangangalaga ng iba at hindi agad nilulutas kung ito ba ay ipinagkatiwala ni Pablo o ipinagkatiwala kay Pablo. Ipinaliliwanag sa talababa ang di-karaniwang gamit at ang dalawang pagbasa.
- source_word: φυλάξαι
  choice: ingatan
  rationale: Ang “ingatan” ay natural na Tagalog para sa pagbabantay at pagpapanatiling ligtas ng isang bagay na ipinagkatiwala.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: hanggang sa araw na iyon
  rationale: Pinananatili nito ang temporal at eskatolohikal na pagtukoy nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Ang tinutukoy ng ᾧ at ang di-binanggit na simuno ng δυνατός ἐστιν
  choice: Pinanatiling di-pinangalanan sa pangunahing teksto sa pamamagitan ng “aking pinananaligan” at “niya.”
  alternative: Tahasang tukuyin bilang Diyos o bilang Cristo Jesus.
  rationale: Hindi pinapangalanan ng sugnay sa Griyego ang tinutukoy, bagaman malinaw na personal ito at itinuturo ng konteksto ang Diyos na nakilala kay Cristo. Hindi dapat dagdagan ng salin ang antas ng katiyakan ng orihinal.
- issue: Kahulugan ng παραθήκη μου
  choice: Isinaling “aking deposito” upang mapanatili ang metapora at ang posibleng dalawang direksiyon ng pagkakatiwala.
  alternative: “Ang ipinagkatiwala ko sa kanya” o “ang ipinagkatiwala sa akin.”
  rationale: Maaaring tumukoy ang parirala sa inilagak ni Pablo sa pangangalaga ng Diyos, gaya ng kanyang buhay, o sa inilagak sa pangangalaga ni Pablo, gaya ng ebanghelyo o ministeryo. Hindi sapilitang nilulutas ng Griyego ang usapin, kaya inilalahad sa talababa ang dalawang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “deposito” sa mas lumang/legal na diwa ng isang bagay na inilagak upang maingatan; dahil hindi ito ang pinakakaraniwang gamit ngayon, nilinaw ito sa talababa. Pinanatiling maliit ang “araw” at hindi tahasang pinangalanan ang Diyos o si Cristo sa pangunahing teksto, alinsunod sa antas ng pagiging tiyak ng Griyego.
