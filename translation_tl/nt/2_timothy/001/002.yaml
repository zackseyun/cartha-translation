id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: tl
  text: 'Kay Timoteo, minamahal na anak: Biyaya, awa, at kapayapaan mula sa Diyos Ama at sa Mesiyas na si Jesus[a], na ating Panginoon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo Jesus.” Ang titulong Griyego na Χριστός ay isinaling “Mesiyas” dito upang maipahayag ang kahulugan nito sa halip na gamitin lamang ang nakaugaliang transliterasyong “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: minamahal
  rationale: Ipinapahayag nito ang taimtim na pagmamahal sa magaan at likas na modernong Tagalog.
- source_word: τέκνῳ
  choice: anak
  rationale: Pinananatili nito ang talinghaga ng ugnayang tulad ng mag-ama nang hindi ginagawang mas tiyak kaysa sa pangkalahatang salitang Griyego.
- source_word: χάρις
  choice: biyaya
  rationale: Ito ang kinikilalang katumbas sa Tagalog at pinananatili ang natatanging kahulugan nito sa pagbati ni Pablo.
- source_word: ἔλεος
  choice: awa
  rationale: Tuwirang katumbas ito na malinaw na naiiba sa biyaya at kapayapaan.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili nito ang personal at pangtipang lawak ng salitang Griyego.
- source_word: θεοῦ πατρὸς
  choice: Diyos Ama
  rationale: Tumpak itong sumusunod sa Griyego, na walang panghalip na 'ating' na tumutukoy sa Ama.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' at natural na inuugnay ito sa pangalang Jesus sa Tagalog.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili nito ang diwa ng awtoridad at ang kristolohikal na bigat ng κύριος.
theological_decisions:
- issue: Pagkakasalin ng Χριστοῦ Ἰησοῦ
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Gumaganap dito ang Χριστός bilang titulo; kaya isinasalin ang kahulugan nitong 'Mesiyas' sa halip na gamitin lamang ang nakaugaliang transliterasyon. Inilalagay sa talababa ang tradisyonal na anyo.
- issue: Kaugnayan ng τοῦ κυρίου ἡμῶν
  choice: na ating Panginoon
  alternative: ating Panginoong Mesiyas na si Jesus
  rationale: Pinananatili nitong malinaw na ang 'ating Panginoon' ay tumutukoy kay Jesus, habang sinusunod ang ayos at appositional na ugnayan ng Griyego nang hindi dinaragdagan ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “minamahal na anak” upang mapanatili ang magiliw ngunit mabigat na tono; iniwasan ang “kong” sapagkat walang katumbas na panghalip sa Griyego.
