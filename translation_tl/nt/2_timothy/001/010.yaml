source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: tl
  text: ngunit nahayag na ngayon sa pagpapakita ng ating Tagapagligtas na si Jesus na Mesiyas[a]. Pinawalang-bisa niya ang kamatayan at ipinakita ang buhay at kawalang-kasiraan[b] sa pamamagitan ng ebanghelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesucristo.” Maaaring gumana ang Griyegong Χριστός bilang titulong “Mesiyas” o bilang katawagang ginagamit na tila bahagi ng pangalan, “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “kawalang-kamatayan.” Idiniriin ng salitang Griyego ang pagiging hindi nasisira o hindi nabubulok.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: nahayag na ngayon
  rationale: Pinananatili ang diwang pasibo at ang ugnayan nito sa biyaya ng Diyos na binanggit sa naunang talata, nang hindi inuulit ang pangngalan.
- source_word: ἐπιφανείας
  choice: pagpapakita
  rationale: Likas at malinaw na salin para sa hayag na paglitaw ni Jesus; hindi ginagamit ang teknikal na transliterasyong “epipanya.”
- source_word: σωτῆρος
  choice: Tagapagligtas
  rationale: Karaniwan, malinaw, at marangal na salin ng titulong σωτήρ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ipinakikita ang Χριστός bilang titulong “Mesiyas,” habang ang “na” ay nagbibigay ng likas na anyong Tagalog nang hindi ipinapalagay na apelyido ito.
- source_word: καταργήσαντος
  choice: Pinawalang-bisa
  rationale: Ipinahahayag ang mapagpasiyang pagkatalo ng kamatayan ngunit hindi sinasabing hindi na ito umiiral sa kasalukuyan.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwiran at karaniwang katumbas ng θάνατος.
- source_word: φωτίσαντος
  choice: inilantad
  rationale: Likas na ipinahahayag sa Tagalog ang idyomang pagdadala sa liwanag o paghahayag.
- source_word: ζωὴν
  choice: buhay
  rationale: Tuwirang salin na hindi pinalalawak ang eskatolohikal na diwa nang lampas sa teksto.
- source_word: ἀφθαρσίαν
  choice: pagiging hindi nasisira
  rationale: Mas nauunawaan sa modernong Tagalog kaysa sa abstraktong “kawalang-kasiraan” at pinananatili ang diin sa hindi pagkabulok o pagkasira.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: sa pamamagitan ng magandang balita
  rationale: Malinaw na ipinakikita ang gamit o paraang ipinahahayag ng διά, at isinasalin ang εὐαγγέλιον sa pangkaraniwang modernong Tagalog.
- source_word: μὲν ... δὲ
  choice: '... at ...'
  rationale: Ang magkatambal na mga kilos—pagpapawalang-bisa sa kamatayan at paglalantad ng buhay—ay natural na pinag-uugnay sa Tagalog sa pamamagitan ng “at.”
theological_decisions:
- issue: Gamit ng Χριστός sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo
  rationale: Kasunod ito ng titulong “ating Tagapagligtas,” kaya nananatiling buhay ang kahulugan ng Χριστός bilang titulong Mesiyas; itinatala sa talababa ang nakaugaliang anyo.
- issue: Lakas ng καταργήσαντος tungkol sa kamatayan
  choice: Pinawalang-bisa niya ang kamatayan
  alternative: Winasak niya ang kamatayan
  rationale: Pinananatili ang matibay na pahayag ng teksto nang hindi ipinapakahulugang tuluyan nang hindi umiiral ang kamatayan sa kasalukuyang panahon.
- issue: Kahulugan ng ἀφθαρσίαν
  choice: pagiging hindi nasisira
  alternative: kawalang-kamatayan
  rationale: Pinananatili ang pangunahing diwa ng pagiging malaya sa pagkasira o kabulukan; inilalagay sa talababa ang karaniwang alternatibong tumutukoy sa imortalidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap para maging natural at madaling maunawaan, habang pinananatili ang lohikal na ugnayan sa naunang talata at ang teolohikal na tensiyon tungkol sa pagkakapawalang-bisa ng kamatayan.
