  - severity: low
    issue: “magandang balita” para sa εὐαγγέλιον
    rationale: Maaaring literal at malinaw, ngunit ang “ebanghelyo” ay karaniwan at tiyak na katawagang Filipino sa kontekstong ito; pinananatili nito ang teknikal ngunit madaling unawaing gamit ng terminong nasa pinagmulan.
