    rationale: Katanggap-tanggap ito, ngunit ang “ipinakita” ay mas likas na Filipino sa kontekstong “ipinakita ang buhay at kawalang-kasiraan” at mas malinaw na naghahatid ng diwang ‘brought to light.’
