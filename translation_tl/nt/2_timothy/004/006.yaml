  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: tl
  text: Sapagkat ibinubuhos na ako bilang isang inuming handog[a], at dumating na ang panahon ng aking pagpanaw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Ibinubuhos na ako.” Ang pandiwang Griyego ay pumupukaw ng larawan ng pagbubuhos ng isang inuming handog bilang hain.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pag-alis,” “pagkakalag,” o “pagkawatak-watak.” Dito, ang “pagpanaw” ay likas na pagtukoy sa kamatayan.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: ibinubuhos na ako bilang handog na inumin
  rationale: Pinananatili ang tahasang larawan ng pagbubuhos ng inuming handog at ang aspektong kasalukuyang nagaganap, sa halip na gawing tuwirang pahayag lamang tungkol sa kamatayan.
- source_word: ἤδη
  choice: na
  rationale: Sa pariralang “ibinubuhos na ako,” likas na ipinahahayag ng “na” na nagsimula o nararanasan na ngayon ang kilos.
- source_word: καιρός
  choice: panahon
  rationale: Natural at marangal na katumbas na maaaring tumukoy sa takda o mapagpasyang sandali ayon sa konteksto.
- source_word: ἀναλύσεώς
  choice: pagpanaw
  rationale: Likas na magalang na pagtukoy sa kamatayan sa Filipino; pinananatili sa talababa ang mas literal na saklaw na “pag-alis,” “pagkalag,” o “pagkalutas.”
- source_word: ἐφέστηκεν
  choice: dumating na
  rationale: 'Ipinahahayag ang perpektong aspekto: ang takdang sandali ay dumating at naririto na.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
theological_decisions:
- issue: Matalinghagang paglalarawan ni Pablo sa nalalapit niyang kamatayan
  choice: Pinanatili ang larawan ng inuming handog at ginamit ang magalang na “pagpanaw.”
  alternative: Tuwirang sabihing “malapit na akong mamatay” o unawain ito bilang pangkalahatang pagdurusa lamang.
  rationale: Ang pagsasama ng σπένδομαι at ἀνάλυσις ay malakas na tumutukoy sa nalalapit na kamatayan, ngunit hindi dapat patagin ang dalawang matalinghagang pahayag tungo sa isang tahasang pagpapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “handog na inumin” upang malinaw ang imaheng pansakripisyo, at “pagpanaw” upang maging natural ang eupemismo para sa kamatayan nang hindi inaalis ang leksikal na kalabuan, na inilalahad sa talababa.
