  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: tl
  text: Sa una kong pagtatanggol[a], walang sinumang humarap na kasama ko[b]; sa halip, iniwan ako ng lahat. Huwag nawa itong ibilang laban sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa una kong pagdinig” o “sa una kong legal na pagtatanggol.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “walang sinumang dumating upang makasama ako”; ang diwa sa kontekstong ito ay walang humarap na kasama ni Pablo sa kanyang pagtatanggol.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Huwag nawang iparatang ito sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: pagtatanggol
  rationale: Sa kontekstong panghukuman, tumutukoy ito sa pormal na pagtatanggol o pagsagot sa harap ng mga awtoridad. Likas sa modernong Tagalog ang “pagtatanggol” at nananatili rito ang legal na diwa.
- source_word: πρώτῃ
  choice: una
  rationale: Tuwirang ipinahihiwatig ng salita ang unang pagkakataon o yugto ng pagtatanggol.
- source_word: οὐδείς μοι παρεγένετο
  choice: walang sinumang dumating upang sumuporta sa akin
  rationale: Literal na nagsasaad ang pandiwa ng pagdating o pagharap upang maparoon kasama ng isang tao. Sa paglilitis na ito, ipinahihiwatig ng parirala ang pagharap bilang suporta kay Pablo.
- source_word: πάντες με ἐγκατέλιπον
  choice: iniwan ako ng lahat
  rationale: Ipinahihiwatig ng pandiwa ang pag-iwan sa isang tao sa gitna ng mahirap o mapanganib na kalagayan. Malinaw at natural ang “iniwan ako ng lahat” nang hindi dinaragdagan ang tindi ng orihinal.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Huwag nawa itong ibilang laban sa kanila
  rationale: Pinananatili ng “nawa” ang optative na diwa ng isang hangarin o panalangin, samantalang ang “ibilang laban” ay nagpapanatili sa metaporang pananagutan o pagsingil.
theological_decisions:
- issue: Tono ng huling pahayag ni Pablo tungkol sa mga nag-iwan sa kanya
  choice: Isang hangarin o panalanging huwag ibilang laban sa kanila ang ginawa nila
  alternative: 'Isang mas mahinang pahintulot: “Huwag itong ibilang laban sa kanila”'
  rationale: Ang aorist passive optative na λογισθείη kasama ng μή ay likas na nagpapahayag ng hangarin o panalangin. Pinananatili nito ang himig ng pagpapatawad nang hindi ipinapasok ang mas tiyak na doktrinal na paliwanag kaysa sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang bokabularyong panghukuman nang hindi nagiging teknikal o lipas, at pinanatili ang maikli ngunit mapagpatawad na himig ng huling sugnay.
