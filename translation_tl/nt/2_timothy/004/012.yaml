  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: tl
  text: Ngunit isinugo ko si Tiquico sa Efeso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At isinugo ko si Tiquico sa Efeso” o “Isinugo ko naman si Tiquico sa Efeso.” Ang Griyegong pang-ugnay na δέ ay maaaring magpahiwatig ng payak na pagpapatuloy o banayad na pagsalungat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tiquico
  rationale: Pangalan ng tao sa accusative; ginamit ang nakasanayang anyong Filipino na “Tiquico.”
- source_word: δὲ
  choice: Ngunit
  rationale: Isang banayad na pang-ugnay na maaaring magpahiwatig ng bahagyang pagsalungat o paglipat ng paksa. Pinananatili ng “Ngunit” ang posibleng bahagyang pagsalungat, habang inilalahad sa talababa ang ibang likas na pagbasa.
- source_word: ἀπέστειλα
  choice: isinugo ko
  rationale: Aorist active indicative, unang panauhang isahan ng ἀποστέλλω. Ang “isinugo ko” ay natural at marangal sa kontekstong tumutukoy sa pagpapadala ng isang tao para sa isang layunin, nang hindi dinaragdagan ang aspektong pandiwa.
- source_word: εἰς
  choice: sa
  rationale: Kapag patutunguhang lungsod ang kasunod, natural sa Filipino ang “sa”; malinaw sa pandiwang “isinugo” na patutunguhan ang tinutukoy.
- source_word: Ἔφεσον
  choice: Efeso
  rationale: Pangalan ng lugar sa accusative pagkatapos ng εἰς; ginamit ang nakasanayang anyong Filipino na “Efeso.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ikli ng orihinal at ang kalabuan ng δέ sa pamamagitan ng talababa.
