  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: tl
  text: Sasagipin ako ng Panginoon mula sa bawat masamang gawa[a] at dadalhin niya akong ligtas sa kanyang makalangit na kaharian.[b] Sa kanya ang kaluwalhatian magpakailanman.[c] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa bawat gawang masama.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “at ililigtas niya ako tungo sa kanyang makalangit na kaharian.”
    reason: lexical_alternative
  - marker: c
    text: Literal na, “sa mga kapanahunan ng mga kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: sasagipin
  rationale: Malinaw na ipinahihiwatig ng ῥύομαι ang pagsagip o pagliligtas mula sa panganib. Naiiba rin ang “sasagipin” sa kasunod na σώσει nang hindi pinapahina ang diwa.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: mula sa bawat masamang gawa
  rationale: Pinananatili ng “bawat” ang distributibong lakas ng παντός, at likas sa modernong Tagalog ang “masamang gawa” para sa moral na kasamaan ng ἔργου πονηροῦ.
- source_word: σώσει εἰς
  choice: dadalhin niya akong ligtas sa
  rationale: Ipinahahayag nito sa natural na Tagalog ang pagliligtas o ligtas na pag-iingat na nakatuon sa pagpasok sa hantungan. Hindi ginagamit ang literal ngunit alanganing “ililigtas ako tungo sa.”
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: kanyang makalangit na kaharian
  rationale: Tuwirang inilalarawan ng ἐπουράνιον ang kaharian bilang makalangit, habang pinananatili ng “sa” kasunod ng pandiwang paggalaw ang tunguhin ng εἰς.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwan, marangal, at angkop na katumbas ng κύριος sa kontekstong debosyonal.
- source_word: ᾧ ἡ δόξα
  choice: Sa kanya ang kaluwalhatian
  rationale: Likas na pormula ng pagpupuri sa Tagalog na pinananatili ang pag-uukol ng kaluwalhatian sa tinutukoy ng ᾧ.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Natural na katumbas sa Tagalog ng idyomang Griyego para sa walang hanggang panahon.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinikilalang anyong liturhikal sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng kasalukuyang pagsagip at pangwakas na kaligtasan
  choice: Ang “sasagipin” at “dadalhin niya akong ligtas” ay pinananatiling magkaugnay ngunit hindi ganap na magkapareho; nakatuon ang ikalawa sa pagdating sa makalangit na kaharian.
  alternative: Unawain ang unang pangako bilang tiyak na pagsagip kay Pablo mula sa pisikal na kamatayan.
  rationale: Hindi ipinapangako nang tahasan ng talata ang pag-iwas sa pagkamartir. Pinananatili ng salin ang pagtitiwala sa pagsagip mula sa masama at sa pangwakas na pagdating sa kaharian nang hindi nilulutas ang lahat ng tensiyon tungkol sa paraang pisikal o espirituwal ng pagsagip.
- issue: Lakas-teolohikal ng σώσει
  choice: Isinalin sa idyomatikong pariralang “dadalhin niya akong ligtas,” na nagpapahiwatig ng pagliligtas at ligtas na pagdating.
  alternative: “Ililigtas niya ako tungo sa kanyang makalangit na kaharian.”
  rationale: Mas tuwirang pormal ang alternatibo ngunit hindi natural sa Tagalog. Ang napiling anyo ay nagpapanatili sa ideya ng kaligtasan at direksiyon ng εἰς nang hindi nagdaragdag ng garantiya ng pansamantalang pisikal na kaligtasan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sasagipin” upang malinaw na ihayag ang pagliligtas mula sa panganib, at ang idyomatikong “dadalhin niya akong ligtas” upang pagsamahin ang diwa ng σώσει at ang tunguhin ng εἰς. Iniwasan ang sobrang teknikal, makaluma, o denominasyonal na pananalita.
