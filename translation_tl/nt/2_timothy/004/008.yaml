id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: tl
  text: Mula ngayon, nakalaan na para sa akin ang korona ng katuwiran[a]. Igagawad iyon sa akin ng Panginoon, ang matuwid na Hukom, sa araw na iyon—at hindi lamang sa akin, kundi pati sa lahat ng umibig sa kanyang pagpapakita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “korona ng katarungan.” Ang salitang Griyego ay maaaring mangahulugang “katuwiran” o, sa ilang konteksto, “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Mula ngayon
  rationale: Sa konteksto, tumutukoy ito sa nalalabing naghihintay kay Pablo matapos niyang matapos ang takbuhin, kaya likas na ipinahahayag ang temporal na diwa.
- source_word: ἀπόκειταί
  choice: nakalaan na
  rationale: Ipinahihiwatig ng pandiwa na ang isang bagay ay naitabi o naireserba; pinananatili ng 'nakalaan na' ang kasalukuyang kalagayan nito sa natural na Tagalog.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: ang korona ng katuwiran
  rationale: Pinananatili nito ang genitibong parirala nang hindi ipinapasya kung ang korona ay gantimpala para sa katuwiran, binubuo ng katuwiran, o kaugnay ng pagpapawalang-sala.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang 'katuwiran' ang tuwirang at nakaugaliang salin sa kontekstong Paulino; inilalagay sa talababa ang posibleng diwang 'katarungan.'
- source_word: ἀποδώσει
  choice: Igagawad
  rationale: Ang 'igagawad' ay angkop sa larawan ng koronang ibinibigay bilang gantimpala at taglay pa rin ang diwa ng pagbibigay ng nararapat.
- source_word: κύριος
  choice: Panginoon
  rationale: Tuwirang katumbas ito ng τίτulong κύριος at hindi pinalalawak ang pagkakakilanlan sa mismong teksto.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: sa araw na iyon
  rationale: Natural na ekspresyong temporal sa Tagalog na nagpapanatili sa eskatolohikal na pahiwatig.
- source_word: ὁ δίκαιος κριτής
  choice: ang matuwid na Hukom
  rationale: Pinananatili ang appositional na paglalarawan sa Panginoon at ang kaugnayan nito sa katuwiran; ginawang malaking titik ang 'Hukom' bilang titulong tumutukoy sa Panginoon.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: sa lahat ng umibig
  rationale: Ang 'umibig' ay naghahayag ng pag-ibig na naipamalas na at nananatiling makabuluhan hanggang sa kasalukuyang pananaw ng talata, nang hindi nagiging mabigat ang Tagalog.
- source_word: ἐπιφάνειαν
  choice: pagpapakita
  rationale: Tuwiran nitong pinananatili ang diwa ng hayag na pagpapakita at hindi ito pinakikitid sa mas malawak na konsepto ng 'pagdating.'
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Natural na tumutukoy pabalik sa Panginoon at sumusunod sa panghalip ng Griyego.
theological_decisions:
- issue: Kahulugan ng 'korona ng katuwiran'
  choice: Pinanatili ang genitibong parirala nang hindi nilulutas ang eksaktong ugnayan ng korona at katuwiran.
  alternative: Koronang gantimpala para sa katuwiran; koronang binubuo ng katuwiran; korona ng pagpapawalang-sala o katarungan.
  rationale: Pinahihintulutan ng Griyegong genitive ang higit sa isang pagbasa, kaya hindi nararapat magpasok ng mas tiyak na interpretasyon kaysa sa teksto.
- issue: Tinutukoy ng 'Panginoon'
  choice: Pinanatili ang titulong 'Panginoon'; malakas na ipinahihiwatig ng 'kanyang pagpapakita' na si Jesus Cristo ang tinutukoy.
  alternative: Ang Diyos sa mas pangkalahatang diwa.
  rationale: Ang paggamit ng 'pagpapakita' sa konteksto ng Mga Liham Pastoral ay tumuturo kay Cristo bilang hukom, ngunit hindi kailangan ng nagpapaliwanag na pangalan sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang 'nakalaan na' at 'igagawad' bilang natural ngunit tumpak na pananalita; iniwasan ang labis na arkaikong ayos at pinanatili ang tunay na ambiguity ng pariralang 'korona ng katuwiran.'
