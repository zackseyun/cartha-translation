source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: tl
  text: Ngunit tumayo sa tabi ko ang Panginoon at pinalakas niya ako, upang sa pamamagitan ko ay lubos na maisakatuparan ang pagpapahayag at marinig ito ng lahat ng mga bansa[a]. At iniligtas ako mula sa bibig ng leon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga Hentil.” Ang salitang Griyego na ἔθνη ay maaaring mangahulugang “mga bansa” o “mga Hentil”; dito, malamang na tumutukoy ito sa mga bansang hindi Judio na makarinig ng mabuting balita.
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa bibig ng leon” ay maaaring matalinghagang paglalarawan ng pagliligtas mula sa nakamamatay na panganib, sa halip na pagtukoy sa isang literal na leon.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Ngunit … ang Panginoon
  rationale: Ipinakikita ng “Ngunit” ang pagsalungat sa naunang talata, at pinananatili ng “Panginoon” ang karaniwang salin ng κύριος nang hindi tinutukoy nang higit sa sinasabi ng teksto ang tinutukoy nito.
- source_word: μοι παρέστη
  choice: tumayo sa tabi ko
  rationale: Natural na ipinahahayag nito ang personal na presensiya at pagsuporta, hindi lamang ang pisikal na pagtayo.
- source_word: ἐνεδυνάμωσέν με
  choice: pinalakas niya ako
  rationale: Malinaw at likas na salin ng pagbibigay-lakas o pagpapalakas.
- source_word: ἵνα δι’ ἐμοῦ
  choice: upang sa pamamagitan ko
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at ng “sa pamamagitan ko” ang instrumental na diwa ng διά.
- source_word: τὸ κήρυγμα
  choice: ang pagpapahayag
  rationale: Saklaw nito ang gawa ng hayagang pagpapahayag at ang ipinahahayag na mensahe, nang hindi nililimitahan sa isang pormal na sermon.
- source_word: πληροφορηθῇ
  choice: lubos na maisakatuparan
  rationale: Pinananatili nito ang diwa ng ganap na pagsasagawa o pagtupad, sa halip na paliitin agad ang kahulugan tungo lamang sa ‘maipahayag nang lubos.’
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: marinig ito ng lahat ng mga bansa
  rationale: Ginagawang hayag ng “ito” na ang pagpapahayag ang naririnig. Pinananatili ng “mga bansa” ang malawak at tunay na posibleng kahulugan ng ἔθνη; maaaring tumukoy ito lalo na sa mga hindi Judio, gaya ng ipinaliliwanag sa talababa.
- source_word: ἐρρύσθην
  choice: iniligtas ako
  rationale: Karaniwan, malinaw, at masiglang salin para sa pagliligtas mula sa panganib.
- source_word: ἐκ στόματος λέοντος
  choice: mula sa bibig ng leon
  rationale: Pinananatili ang mismong larawan at hindi ipinapasok sa teksto ang alinman sa mga posibleng interpretasyon nito.
theological_decisions:
- issue: Ang tinutukoy ng κύριος
  choice: Panginoon, nang walang karagdagang pagtukoy
  alternative: Partikular na si Jesus; o ang Diyos sa mas pangkalahatang diwa
  rationale: Hindi tahasang nilulutas ng talata ang tinutukoy nito, kaya pinananatili ng salin ang katawagan ng Griyego.
- issue: Kahulugan ng πάντα τὰ ἔθνη
  choice: lahat ng mga bansa
  alternative: lahat ng mga Hentil / lahat ng mga hindi Judio
  rationale: Maaaring mangahulugan ang ἔθνη ng ‘mga bansa’ o ‘mga Hentil.’ Pinananatili sa teksto ang mas malawak na katawagan at inilalagay sa talababa ang malamang na kontekstuwal na diin sa mga hindi Judio.
- issue: Kahulugan ng ‘mula sa bibig ng leon’
  choice: Pinanatili bilang larawan ng pagliligtas mula sa matinding panganib
  alternative: Si Nero; si Satanas; o literal na kamatayan sa mababangis na hayop
  rationale: Hindi tinutukoy ng teksto kung alin sa mga paliwanag na ito ang tama, kaya hindi dapat lutasin iyon sa salin.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinili ang “tumayo sa tabi ko” upang mapanatili ang matingkad na larawan ng presensiya at suporta, at ang “lubos na maisakatuparan” upang panatilihin ang lawak ng πληροφορηθῇ. Ang dalawang talababa ay kapuwa may katumbas na marker sa pangunahing teksto.
