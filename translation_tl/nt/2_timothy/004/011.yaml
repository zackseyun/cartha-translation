  source_fidelity: 'Tumpak ang salin sa estruktura at diwa ng Griyego: si Lucas lamang ang kasama ni Pablo; iniutos niyang kunin/isama si Marcos at dalhin siya sa kaniya; at ibinigay ang dahilan na kapaki-pakinabang si Marcos sa paglilingkod. Ang “rito” ay isang likas na pagpapalinaw sa Tagalog ng direksiyong likas sa utos na dalhin si Marcos kay Pablo at hindi nagdaragdag ng hiwalay na pahayag.'
