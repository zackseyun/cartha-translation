  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: tl
  text: Si Lucas lamang ang kasama ko. Isama mo si Marcos at dalhin mo siya rito, sapagkat malaki ang maitutulong niya sa akin sa paglilingkod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gawaing ministeryo.” Maaaring tumukoy ang salitang Griego sa paglilingkod sa mas malawak na diwa, bagaman maaaring gawaing ministeryo ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lucas
  rationale: Karaniwang anyo ng pangalang Luke sa makabagong saling Tagalog at tradisyong biblikal.
- source_word: μόνος
  choice: lamang
  rationale: Ipinahahayag na si Lucas ang nag-iisang kasamang naroon kay Pablo, sa natural na ayos ng Tagalog.
- source_word: μετ’ ἐμοῦ
  choice: ang kasama ko
  rationale: Tuwirang ipinapahayag ang diwa ng pisikal na pakikisama o pagkanaroon kay Pablo.
- source_word: Μᾶρκον
  choice: Marcos
  rationale: Karaniwang anyo ng pangalang Mark sa Tagalog na Bibliya.
- source_word: ἀναλαβὼν
  choice: Isama mo
  rationale: Sa konteksto ng paglalakbay, nangangahulugan itong kunin o isama si Marcos bago siya dalhin kay Pablo.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: at dalhin mo siya rito
  rationale: Natural sa Tagalog ang tahasang layong 'siya'; ang 'rito' ay ipinahihiwatig ng utos na dalhin si Marcos sa kinaroroonan ng nagsasalita.
- source_word: γάρ μοι
  choice: sapagkat ... sa akin
  rationale: Pinananatili ang paliwanag na dahilan at ang personal na kaugnayan ng pakinabang kay Pablo.
- source_word: εὔχρηστος
  choice: malaki ang maitutulong
  rationale: Natural at magalang na Tagalog para sa pagiging kapaki-pakinabang, nang hindi tunog na itinuturing lamang na kasangkapan ang tao.
- source_word: εἰς διακονίαν
  choice: sa paglilingkod
  rationale: Pinananatili ang malawak na kahulugan ng διακονία bilang paglilingkod, habang hindi isinasara ang posibilidad na tumutukoy ito sa gawaing ministeryo.
theological_decisions:
- issue: Saklaw ng διακονία sa pahayag tungkol kay Marcos
  choice: paglilingkod
  alternative: gawaing ministeryo
  rationale: Maaaring tumukoy ang salita sa paglilingkod sa pangkalahatan o sa gawaing ministeryo. Mas tapat sa leksikal na lawak ang 'paglilingkod,' at inilalahad sa talababa ang mas tiyak na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang biblikal na mga pangalang Lucas at Marcos; iniwasan ang labis na teknikal na pananalita at pinanatili ang lawak ng kahulugan ng διακονία.
