  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: tl
  text: At ilalayo nila ang kanilang mga tainga[a] sa katotohanan at babaling sila sa mga mito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kanilang pandinig.”
    reason: lexical_alternative
  - marker: b
    text: O “mga pabula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: sa katotohanan
  rationale: Pinananatili ang tiyak na diwa ng Griyegong artikulo at ang malawak na kahulugan ng ‘katotohanan,’ nang hindi ito nililimitahan sa ‘ebanghelyo’ o ‘wastong aral.’
- source_word: ἀκοὴν
  choice: ang kanilang mga tainga
  rationale: Ang ἀκοή ay literal na ‘pandinig,’ ngunit ang ‘ilayo ang mga tainga’ ang mas likas na idyomang Filipino at pinananatili ang larawan ng sadyang pagtangging makinig. Isinaad sa talababa ang mas literal na anyo.
- source_word: ἀποστρέψουσιν
  choice: ilalayo nila
  rationale: Ipinahahayag nito ang aktibong kilos ng pagtalikod o paglayo at pinananatili ang direksiyong ‘mula sa’ katotohanan.
- source_word: μύθους
  choice: mga alamat
  rationale: Ang ‘alamat’ ay tuwirang makabagong katumbas ng μῦθος bilang salaysay na hindi nakabatay sa katotohanan. Inilagay sa talababa ang ‘mga pabula’ bilang alternatibo.
- source_word: ἐκτραπήσονται
  choice: babaling sila
  rationale: Likas na intransitibong salin ito ng anyong maaaring passive o middle, nang hindi nagpapasiya kung may panlabas na tagapaglihis.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: sa ... at ... sa
  rationale: Naipahahayag ng magkatapat na ‘ilalayo ... sa’ at ‘babaling ... sa’ ang kontrast ng paglayo mula sa katotohanan at pagharap sa mga alamat nang hindi mabigat ang pangungusap.
theological_decisions:
- issue: Saklaw ng ‘katotohanan’ sa konteksto
  choice: katotohanan
  alternative: wastong aral; katotohanan ng ebanghelyo
  rationale: Bagaman kaugnay ito ng apostolikong turo sa konteksto, mas malawak ang ἀλήθεια. Hindi ito pinalawak o pinaliit ng salin.
- issue: Ahensiya sa ἐκτραπήσονται
  choice: babaling sila
  alternative: ililihis sila
  rationale: Pinananatili ng intransitibong salin ang posibilidad ng middle o passive na diwa nang hindi tahasang nagdaragdag ng isang panlabas na tagapaglihis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang idyomang ‘ilalayo ... ang mga tainga’ upang maging natural habang pinananatili ang talinghaga at aktibong kilos ng Griyego.
