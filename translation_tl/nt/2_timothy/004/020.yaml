base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: tl
  text: Nanatili si Erasto sa Corinto, ngunit iniwan ko sa Mileto si Trofimo na may sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Erasto
  rationale: Pangalan ng tao; ginamit ang anyong matagal nang natural sa tradisyong Tagalog/Filipino.
- source_word: ἔμεινεν
  choice: Nanatili
  rationale: Ang aorist ng μένω ay tumutukoy rito sa pananatili sa isang lugar; likas at marangal ang “nanatili” sa ulat ng paglalakbay.
- source_word: ἐν Κορίνθῳ
  choice: sa Corinto
  rationale: Karaniwang lokatibong gamit ng ἐν sa pangalan ng lungsod; natural sa Filipino ang “sa Corinto.”
- source_word: Τρόφιμον
  choice: Trofimo
  rationale: Pangalan ng tao; ginamit ang karaniwang anyong Tagalog/Filipino.
- source_word: δὲ
  choice: ngunit
  rationale: Nagpapakita ang δέ ng banayad na paghahambing o pagsalungat sa dalawang ulat; malinaw at angkop ang “ngunit.”
- source_word: ἀπέλιπον
  choice: iniwan ko
  rationale: Unang panauhang isahan na aorist ng ἀπολείπω; tuwirang ipinahahayag ng “iniwan ko” ang kilos nang hindi nagdaragdag ng di-tiyak na diwa.
- source_word: ἐν Μιλήτῳ
  choice: sa Mileto
  rationale: Karaniwang lokatibong parirala sa pangalan ng lungsod; natural sa Filipino ang “sa Mileto.”
- source_word: ἀσθενοῦντα
  choice: na may sakit
  rationale: Ang present participle ay naglalarawan sa kalagayan ni Trofimo nang siya ay iwan; malinaw at natural ang “na may sakit.”
