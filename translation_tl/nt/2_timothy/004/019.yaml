  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: tl
  text: Batiin mo sina Prisca at Aquila[a], at ang sambahayan ni Onesiforo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Prisca”; tinatawag din siyang “Priscila” sa ibang mga talata (halimbawa, Mga Gawa 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Batiin mo
  rationale: Tuwirang pautos sa iisang kausap; natural sa makabagong Tagalog at hindi nagdaragdag ng antas ng lambing na hindi tahasang nasa pandiwa.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Tuwirang transliterasyon ng pangalang nasa tekstong Griyego; pinananatili ang anyong ginamit sa talatang ito sa halip na palitan ng Priscila.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang Griyego na Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: ang sambahayan ni Onesiforo
  rationale: Sa konteksto ng pagbati, ang οἶκος ay tumutukoy sa mga taong kabilang o kaugnay sa tahanan, hindi lamang sa gusali o sa mga kadugo.
