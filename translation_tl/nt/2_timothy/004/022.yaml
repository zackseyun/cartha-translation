  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: tl
  text: Ang Panginoon nawa ay mapasaiyong espiritu.[a] Ang biyaya nawa ay sumainyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, isahan ang “iyong espiritu,” ngunit maramihan ang “sumainyo” sa sumunod na pangungusap.
    reason: Nililinaw ang mahalagang paglipat mula sa isahang kausap tungo sa maramihang tagatanggap.
lexical_decisions:
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng τίτulong κύριος sa Bagong Tipan at likas sa pormula ng pagpapala; hindi idinagdag ang “Jesus” upang hindi maging higit na tiyak kaysa sa Griyego.
- source_word: μετὰ
  choice: sumaiyo nawa / sumainyo nawa
  rationale: Walang tahasang pandiwa ang Griyego, ngunit ipinahihiwatig ng pormula ang isang hangarin o pagpapala. Natural na ipinapahayag ito sa marangal na modernong Tagalog sa pamamagitan ng “sumaiyo/sumainyo nawa.”
- source_word: πνεύματός
  choice: espiritu
  rationale: Ang kasamang panghalip na isahan na “iyong” ay tumutukoy sa espiritu ni Timoteo; pinananatili ng “espiritu” ang personal at panloob na diwa nang hindi ito tahasang ginagawang Espiritu Santo.
- source_word: σου
  choice: iyong / iyo
  rationale: Pinananatili ang isahang bilang sapagkat ang unang pagpapala ay tuwirang nakatuon kay Timoteo.
- source_word: χάρις
  choice: biyaya
  rationale: Ang “biyaya” ang likas at may bigat na katumbas ng χάρις sa pangwakas na pagpapalang Paulino.
- source_word: ὑμῶν
  choice: inyo
  rationale: Ang “inyo” sa “sumainyo” ay malinaw na maramihan sa Tagalog at pinananatili ang paglipat mula sa isahang σου tungo sa maramihang ὑμῶν nang hindi nagdaragdag ng “lahat,” na wala sa Griyego.
theological_decisions:
- issue: Tinutukoy ng “Panginoon”
  choice: Pinanatili ang titulong “Panginoon,” na sa kontekstong Paulino ay malamang na tumutukoy kay Jesus.
  alternative: Unawain ito bilang pangkalahatang pagtukoy sa Diyos.
  rationale: Karaniwang tumutukoy kay Jesus ang “Panginoon” sa mga pangwakas na pagpapalang Paulino, ngunit hindi idinagdag ang pangalang “Jesus” dahil wala ito sa tekstong Griyego.
- issue: Paglipat ng bilang sa dalawang sugnay
  choice: Ang unang sugnay ay para kay Timoteo bilang isang tao; ang ikalawa ay para sa maramihang tagatanggap.
  alternative: Ipahayag ang dalawang sugnay na kapwa para lamang kay Timoteo.
  rationale: 'Malinaw na magkaiba ang bilang sa Griyego: isahan ang σου at maramihan ang ὑμῶν. Ipinakikita ito ng “sumaiyo ... iyong” at “sumainyo.”'
- issue: Pagkakakilanlan ng “espiritu”
  choice: Espiritu ng tao, partikular ang espiritu ni Timoteo.
  alternative: Tahasang pagtukoy sa Espiritu Santo.
  rationale: Mas natural na tumutukoy sa espiritu ni Timoteo ang pariralang “iyong espiritu.” Hindi isinasara ng salin ang mas malawak na teolohikal na kaugnayan, ngunit hindi rin nito ginagawang tahasang “Espiritu Santo” ang salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang pormulang “sumaiyo/sumainyo nawa” upang likas na maipahayag ang ipinahihiwatig na panalangin o hangarin ng Griyego. Hindi idinagdag ang “lahat” dahil sapat nang ipinakikita ng “sumainyo” ang maramihan at walang katumbas na πάντων sa tekstong SBLGNT.
