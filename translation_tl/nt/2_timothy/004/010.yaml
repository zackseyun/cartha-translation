id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: tl
  text: Sapagkat tinalikuran ako ni Demas dahil minahal niya ang kasalukuyang kapanahunan[a], at pumunta siya sa Tesalonica. Pumunta naman si Crescente sa Galacia, at si Tito sa Dalmacia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sanlibutang ito.” Ang salitang Griego ay mas literal na tumutukoy sa kasalukuyang kapanahunan o panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili nito ang ugnayang nagpapaliwanag sa naunang pakiusap, at angkop ito sa marangal ngunit makabagong Filipino.
- source_word: ἐγκατέλιπεν
  choice: iniwan ako
  rationale: Ipinahihiwatig ng pandiwa ang mabigat at mapanagutang pag-iwan kay Pablo, nang hindi tahasang sinasabing tumalikod si Demas sa pananampalataya. Natural ito sa Filipino; ang negatibong diwa ay nililinaw ng kasunod na dahilan.
- source_word: ἀγαπήσας
  choice: dahil minahal niya
  rationale: Malamang na sanhi ang gamit ng aorist participle sa konteksto. Ang pariralang ito ay natural sa Filipino at malinaw na inuugnay ang pag-ibig ni Demas sa kapanahunan sa pag-iwan niya kay Pablo.
- source_word: τὸν νῦν αἰῶνα
  choice: ang kasalukuyang kapanahunan
  rationale: Pinananatili ng “kapanahunan” ang temporal at etikal na diwa ng αἰών at iniiwasang tukuyin lamang ang pisikal na daigdig.
- source_word: ἐπορεύθη
  choice: pumunta
  rationale: Payak at natural na pandiwa ito para sa pagkilos patungo sa mga binanggit na lugar, nang hindi nagdaragdag ng paraan o layunin ng paglalakbay.
- source_word: Θεσσαλονίκην
  choice: Tesalonica
  rationale: Karaniwang anyong Filipino ng pangalan ng lungsod.
- source_word: Κρήσκης
  choice: Crescente
  rationale: Nakaugaliang anyong Filipino ng personal na pangalang ito.
- source_word: Γαλατίαν
  choice: Galacia
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
- source_word: Τίτος
  choice: Tito
  rationale: Karaniwang anyong Filipino ng personal na pangalan.
- source_word: Δαλματίαν
  choice: Dalmacia
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
theological_decisions:
- issue: Kung ang pag-alis ni Demas ay dapat isaling tahasang pagtalikod sa pananampalataya
  choice: Isinalin bilang “iniwan ako” at hindi bilang tahasang pagtalikod sa pananampalataya.
  alternative: Gumamit ng mas matinding pananalitang nagsasabing lubusan siyang tumalikod o apostata.
  rationale: Malinaw sa teksto na iniwan ni Demas si Pablo kaugnay ng pag-ibig niya sa kasalukuyang kapanahunan, ngunit hindi nito tahasang ipinapahayag ang kaniyang pangwakas na espirituwal na kalagayan.
- issue: Ang ugnayan ng ἀγαπήσας sa pag-iwan ni Demas
  choice: 'Isinalin sa malamang na diwang sanhi: “dahil minahal niya.”'
  alternative: Panatilihin ang mas pormal ngunit hindi gaanong natural na participial na anyo, gaya ng “na minahal ang kasalukuyang kapanahunan.”
  rationale: Sa konteksto, malamang na ipinapaliwanag ng participle kung bakit iniwan ni Demas si Pablo. Hindi naman pinalalawak ng salin ang pahayag tungo sa tiyak na apostasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan. Inulit ang “pumunta” bago kay Crescente upang maging natural at malinaw ang listahan, habang pinanatili ang elipsis sa huling sugnay tungkol kay Tito.
