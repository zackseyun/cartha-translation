id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: tl
  text: Taimtim kitang inaatasan sa harap ng Diyos at ng Mesiyas na si Jesus, na malapit nang humatol sa mga buhay at mga patay,[a] at alang-alang sa kanyang pagpapakita at sa kanyang kaharian:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na hahatol sa mga buhay at mga patay.”
    reason: lexical_alternative
  - marker: b
    text: O maaaring, “at ang kanyang pagpapakita at ang kanyang kaharian,” na iniiwang mas di-hayag ang kaugnayan ng mga ito sa taimtim na pag-aatas.
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Taimtim kitang inaatasan
  rationale: Sa konteksto ng isang banal at seryosong pagsusugo, ipinahihiwatig ng pandiwa ang mahigpit at taimtim na pag-aatas, hindi lamang pagpapatotoo. Ang “kita” ay likas na nagpapahayag sa Tagalog ng ipinahihiwatig na layon na “ikaw.”
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Likas at marangal na katumbas ito ng pagiging nasa presensya o paningin ng isang saksi.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Nananatiling malinaw rito ang Χριστός bilang titulo. Mas natural sa Tagalog ang “Mesiyas na si Jesus” kaysa “Mesiyas Jesus.”
- source_word: τοῦ μέλλοντος κρίνειν
  choice: na malapit nang humatol
  rationale: Pinananatili nito ang puwersa ng μέλλω bilang nakahandang o nalalapit na pagkilos, sa halip na gawing payak na panghinaharap lamang. Inilalagay sa talababa ang mas di-tiyak na alternatibo.
- source_word: ζῶντας καὶ νεκρούς
  choice: sa mga buhay at mga patay
  rationale: Ito ang malinaw at nakaugaliang paraan ng pagsasabi sa Tagalog ng saklaw ng paghatol sa parehong nabubuhay at namatay.
- source_word: ἐπιφάνειαν
  choice: pagpapakita
  rationale: Tuwirang ipinahahayag nito ang nakikitang pagpapamalas nang hindi agad ipinapakahulugang simpleng “pagdating.”
- source_word: βασιλείαν
  choice: kaharian
  rationale: Ito ang karaniwang katumbas na sumasaklaw sa kaharian at paghahari, at angkop sa eskatolohikal na parirala.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: at alang-alang sa kanyang pagpapakita at sa kanyang kaharian
  rationale: Likas na ipinahahayag ng “alang-alang sa” ang karaniwang pagbasa na pinalalawak ng mga pariralang ito ang taimtim na pag-aatas. Dahil maaaring basahin ang Griyego bilang mas payak na koordinasyon, pinananatili ang posibilidad na iyon sa talababa.
theological_decisions:
- issue: Pagpapahayag sa Χριστός bilang kristolohikal na titulo
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesiyas” ang aktibong kahulugan ng titulo sa maringal na paglalarawan kay Jesus bilang hukom, nang hindi ito ginagawang karaniwang bahagi lamang ng pangalan.
- issue: Puwersa ng μέλλω sa pahayag tungkol sa paghatol
  choice: na malapit nang humatol
  alternative: na hahatol
  rationale: Ipinakikita ng pangunahing teksto ang higit sa payak na panghinaharap na puwersa ng μέλλω, habang kinikilala sa talababa na maaari rin itong idiomatikong tumukoy sa nakatakdang mangyari nang hindi tiyak ang antas ng pagkalapit.
- issue: Ugnayan ng “pagpapakita” at “kaharian” sa solemneng pag-aatas
  choice: at alang-alang sa kanyang pagpapakita at sa kanyang kaharian
  alternative: at ang kanyang pagpapakita at ang kanyang kaharian
  rationale: Maaaring unawain ang mga akusatibong parirala bilang mga batayan ng taimtim na pag-aatas, ngunit hindi ganap na hayag sa Griyego ang relasyong iyon. Kaya ang mas likas na pagbasa ang nasa teksto at ang mas literal na koordinasyon ang nasa talababa.
translation_notes:
  register: Makabago ngunit marangal ang himig. Ginamit ang “taimtim kitang inaatasan” para sa solemneng atas, “Mesiyas na si Jesus” para sa malinaw na titulo, at karaniwang bokabularyong madaling maunawaan ng mga mambabasang Filipino. Ang mga tunay na leksikal at sintaktikong kalabuan ay hindi pinawi kundi inilagay sa mga talababa.
