  source_fidelity: Tumpak na naipapahayag ng salin ang solemneng pag-aatas (Διαμαρτύρομαι), ang saksi/presensya ng Diyos at ng Mesiyas na si Jesus, ang paghatol sa mga buhay at patay, at ang mahirap na pangwakas na pariralang may kaugnayan sa kanyang pagpapakita at kaharian. Ang “na malapit nang humatol” ay isang lehitimong paraan upang mapanatili ang puwersa ng μέλλω, habang ang talababa ay nagbibigay ng mas payak na panghinaharap na pagbasa.
  naturalness: Likas, malinaw, at marangal ang modernong Tagalog. Ang “Taimtim kitang inaatasan,” “sa harap ng Diyos,” at “Mesiyas na si Jesus” ay angkop sa pormal na register ng liham. Nauunawaan din ang “alang-alang sa kanyang pagpapakita at sa kanyang kaharian” bilang pagpapalawak ng solemneng pag-aatas.
  terminology: 'Wasto at magkakatugma ang mahahalagang termino: “Mesiyas” para sa Χριστός bilang titulo, “pagpapakita” para sa ἐπιφάνεια, at “kaharian” para sa βασιλεία. Hindi nito ipinapataw ang isang partikular na doktrinal na pagbasa.'
