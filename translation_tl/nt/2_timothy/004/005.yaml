  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: tl
  text: Ngunit ikaw, panatilihin mong malinaw ang iyong pag-iisip sa lahat ng bagay,[a] tiisin mo ang paghihirap,[b] gawin mo ang gawain ng isang tagapagpahayag ng mabuting balita, at lubos mong gampanan ang iyong ministeryo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging mahinahon at malinaw ang isip sa lahat ng bagay.” Literal na tumutukoy ang pandiwang Griyego sa pagiging hindi lasing, ngunit matalinghaga itong ginagamit dito para sa malinaw na pag-iisip, pagpipigil sa sarili, at katatagan.
    reason: lexical_alternative
  - marker: b
    text: O “magdusa ka sa hirap.”
    reason: lexical_alternative
  - marker: c
    text: O “ganapin mo nang lubos ang iyong paglilingkod.” Ang pandiwang Griyego ay may diwa ng ganap na pagsasakatuparan o pagdadala sa kaganapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ngunit ikaw
  rationale: Pinananatili nito ang pagdidiin sa panghalip na σὺ at ang pagsalungat ng δέ sa asal ng mga taong binanggit sa naunang mga talata.
- source_word: νῆφε
  choice: manatiling malinaw ang isip
  rationale: 'Bagaman literal na nauugnay ang pandiwa sa pagiging hindi lasing, matalinghaga ang gamit nito sa Bagong Tipan: malinaw na pag-iisip, pagpipigil sa sarili, at katatagan sa gitna ng panggigipit. Likas at madaling maunawaan sa modernong Tagalog ang napiling parirala.'
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng Griyego nang hindi nagpapasiya kung mga kalagayan, gawain, o pagkakataon ang pangunahing tinutukoy.
- source_word: κακοπάθησον
  choice: tiisin mo ang paghihirap
  rationale: Ipinahahayag kapuwa ang pagdanas ng hirap at ang matatag na pagtitiis dito, na angkop sa pautos na diwa at konteksto.
- source_word: ἔργον ποίησον
  choice: gawin mo ang gawain
  rationale: Direkta at likas na katumbas ng karaniwang pariralang Griyego, habang malinaw na pinananatili ang utos.
- source_word: εὐαγγελιστοῦ
  choice: ng isang tagapagpahayag ng mabuting balita
  rationale: Malinaw nitong inilalarawan ang taong nagpapahayag ng ebanghelyo nang hindi umaasa sa teknikal o posibleng denominasyonal na pakahulugan ng salitang “ebanghelista.”
- source_word: τὴν διακονίαν σου
  choice: ang iyong ministeryo
  rationale: Sa konteksto ng ipinagkatiwalang gawaing pastoral at pagpapahayag ni Timoteo, mas tiyak ang “ministeryo” kaysa sa pangkalahatang “paglilingkod,” ngunit hindi nito itinatakda ang isang partikular na denominasyonal na katungkulan.
- source_word: πληροφόρησον
  choice: lubos mong gampanan
  rationale: Ipinakikita ang diwa ng ganap na pagsasakatuparan o pagdadala sa kaganapan ng ipinagkatiwalang ministeryo.
theological_decisions:
- issue: Saklaw ng διακονία ni Timoteo
  choice: ministeryo
  alternative: paglilingkod
  rationale: Ang agarang konteksto ay ang ipinagkatiwalang pagpapahayag at gawaing pastoral ni Timoteo. Ang “ministeryo” ay angkop dito ngunit hindi ipinapalagay ang isang tiyak na denominasyonal na posisyon.
- issue: Kahulugan ng εὐαγγελιστής
  choice: tagapagpahayag ng mabuting balita
  alternative: ebanghelista
  rationale: Pinananatili ang pangunahing tungkuling ipinahahayag ng salita—ang pagpapahayag ng mabuting balita—nang hindi nilulutas kung ito ay pormal na katungkulan o paglalarawan sa gawain.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang “tagapagpahayag ng mabuting balita” upang maging madaling maunawaan at maiwasan ang di-kinakailangang teknikal na dating; pinanatili ang “ministeryo” dahil natural ito sa kontekstong pastoral. Ang mga pautos ay isinalin sa magalang ngunit tuwirang anyong “mo,” alinsunod sa personal na tagubilin kay Timoteo.
