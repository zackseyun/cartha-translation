base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: tl
  text: Pagparito mo, dalhin mo ang balabal[b] na iniwan ko sa Troas kay Carpo, pati ang mga aklat[a], lalo na ang mga pergamino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga balumbon”; maaaring tumukoy ang salitang Griyego sa mga nakasulat na rolyo o kahalintulad na materyales.
    reason: lexical_alternative
  - marker: b
    text: May ilang nagpapakahulugan sa “balabal” bilang lalagyan o balot ng mga aklat, ngunit ang karaniwang kahulugan ng salitang Griyego ay isang panlabas na kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: balabal
  rationale: Karaniwang tumutukoy ang pangngalan sa isang panlabas na kasuotang pantakip. Likas at marangal sa modernong Tagalog ang “balabal,” at hindi kailangang ipakahulugan itong lalagyan ng mga aklat.
- source_word: ἀπέλιπον
  choice: iniwan ko
  rationale: Tuwirang ipinahahayag ng aorist active indicative ang ginawa ng nagsasalita; natural at sapat sa Tagalog ang “iniwan ko.”
- source_word: παρὰ Κάρπῳ
  choice: kay Carpo
  rationale: Sa konteksto, ipinahihiwatig ng παρά na ang bagay ay nasa kinaroroonan o pangangalaga ni Carpo. Likas sa Tagalog ang “kay Carpo” at pinananatili nito ang bahagyang lawak ng kahulugan.
- source_word: ἐρχόμενος
  choice: Pagparito mo
  rationale: Ang participle ay may temporal na kaugnayan sa pautos na φέρε. Maikli at natural na ipinapahayag ng “Pagparito mo” ang “kapag pumarito ka.”
- source_word: φέρε
  choice: dalhin mo
  rationale: Ang pautos na anyo ng φέρω ay humihiling na dalhin ni Timoteo ang mga bagay patungo sa nagsasalita.
- source_word: τὰ βιβλία
  choice: ang mga aklat
  rationale: Maaaring tumukoy ang βιβλία sa mga aklat, balumbon, o iba pang nakasulat na materyal. “Mga aklat” ang malawak at karaniwang salin, habang itinatala sa talababa ang posibleng pisikal na anyo.
- source_word: μάλιστα
  choice: lalo na
  rationale: Malinaw at likas na ipinakikita ng “lalo na” ang natatanging pagdiriin sa kasunod na bagay.
- source_word: τὰς μεμβράνας
  choice: ang mga pergamino
  rationale: Tumutukoy ang μεμβράνα sa materyal na sulatan na mula sa inihandang balat ng hayop. Ang “pergamino” ang tiyak at kinikilalang terminong Filipino.
