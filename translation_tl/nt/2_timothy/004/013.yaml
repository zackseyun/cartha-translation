translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “Carpo” bilang karaniwang anyong Filipino ng pangalan. Inayos ang mga marker upang ang talababa [a] ay tumukoy sa “mga aklat” at ang [b] sa alternatibong pakahulugan sa “balabal”; kapwa marker ay nasa pangunahing teksto.
