  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: tl
  text: Si Alejandro na panday ng metal[a] ay nagpakita sa akin ng maraming kasamaan[b]. Gagantihan siya ng Panginoon ayon sa kanyang mga gawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “panday ng tanso.”
    reason: lexical_alternative
  - marker: b
    text: O, “Marami siyang ginawang masama sa akin.”
    reason: lexical_alternative
  - marker: c
    text: 'Ganito ang mababasa sa ilang manuskrito: “Nawa’y gantihan siya ng Panginoon ayon sa kanyang mga gawa.”'
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: panday ng metal
  rationale: Tumutukoy ito sa manggagawang humuhubog ng metal, karaniwang tanso o bronse. Ang “panday ng metal” ay malinaw sa makabagong Filipino at hindi labis na nagtatakda kung anong metal ang kanyang ginagamit.
- source_word: πολλά μοι κακὰ
  choice: maraming masama … sa akin
  rationale: Pinananatili nito ang maramihang κακά (“maraming masasamang bagay”) habang natural na isinasama sa pariralang Filipino na “gumawa sa akin ng maraming masama.”
- source_word: ἐνεδείξατο
  choice: gumawa
  rationale: Bagaman maaari itong literal na tumukoy sa pagpapakita o pagpapamalas, sa kontekstong ito ang “gumawa sa akin” ay natural na Filipino para sa masamang pakikitungong ipinamalas ni Alejandro, nang hindi kinakailangang tukuyin ang eksaktong uri ng pinsala.
- source_word: ἀποδώσει
  choice: gagantihan
  rationale: Ang panghinaharap na pandiwa ay nagpapahayag ng pagbabayad o pagganti. Ang “gagantihan” ay natural at pinananatili ang diwa ng makatarungang pagsusukli.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin sa Filipino ng κύριος bilang tiyak na titulo sa kontekstong ito.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: ayon sa kanyang mga gawa
  rationale: Malapit ito sa anyo at diwa ng Griyego at pinananatili ang kaugnayan ng pagganti sa mga ginawa ni Alejandro.
theological_decisions:
- issue: Kung ang ἀποδώσει ay pahayag sa hinaharap o isang kahilingan/panalangin
  choice: Gagantihan siya ng Panginoon
  alternative: Gantihan nawa siya ng Panginoon
  rationale: Ang ἀποδώσει sa ibinigay na tekstong Griyego ay future indicative, kaya pangunahing isinalin bilang tiyak na pahayag tungkol sa pagganti ng Panginoon. Inilalagay sa talababa ang alternatibong pagbasa ng ilang manuskrito upang hindi ikubli ang pagkakaibang tekstuwal at teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na “gumawa sa akin ng maraming masama” sa pangunahing teksto, habang pinanatili sa talababa ang mas literal na anyo ng idyomang Griyego. Ang “panday ng metal” ay madaling maunawaan at umiiwas sa hindi tiyak na pagtukoy sa tanso o bronse.
