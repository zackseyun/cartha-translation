  to: Si Alejandro na panday ng metal[a] ay nagpakita sa akin ng maraming kasamaan[b]. Gagantihan siya ng Panginoon ayon sa kanyang mga gawa.[c]
  rationale: Pinalitan ang hindi gaanong likas na “gumawa sa akin ng maraming masama” ng “nagpakita sa akin ng maraming kasamaan,” na mas malapit sa pandiwang Griyego ἐνεδείξατο at malinaw na pinananatili ang “maraming masasamang bagay.” Inilipat sa talababa ang natural na idiomatikong alternatibo. Inayos din ang anyo ng tekstuwal na alternatibo upang malinaw na isa itong kahilingang optative (“Nawa’y ...”), samantalang ang pangunahing teksto ay nananatiling future indicative.
