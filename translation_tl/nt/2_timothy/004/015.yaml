  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: tl
  text: Mag-ingat ka rin sa kanya, sapagkat matindi ang pagsalungat niya sa mga salita namin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aming mensahe” o “aming turo.” Sa Griyego, “mga salita namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Alejandro sa naunang talata. Likas sa Tagalog ang pariralang “mag-ingat sa kanya.”
- source_word: καὶ σὺ
  choice: ka rin
  rationale: Pinananatili ng “rin” ang diin na dapat ding mag-ingat si Timoteo, kaugnay ng karanasan ni Pablo.
- source_word: φυλάσσου
  choice: Mag-ingat
  rationale: Ang kasalukuyang panggitnang pautos ay nananawagan ng patuloy at personal na pag-iingat. Natural at malinaw sa modernong Tagalog ang “mag-ingat.”
- source_word: λίαν
  choice: matindi
  rationale: Pinatitindi ng λίαν ang pandiwang kasunod. Ang “matindi ang pagsalungat” ay natural na Tagalog at naghahatid ng malakas na antas ng pagtutol.
- source_word: ἀντέστη
  choice: ang pagsalungat niya
  rationale: Ang ἀντέστη ay nangangahulugang tumindig laban o sumalungat. Ginawang pangngalang parirala upang maging likas ang daloy sa Tagalog nang hindi binabago ang diwa.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: sa mga salita namin
  rationale: Malapit ito sa tahasang anyo ng Griyego at hindi nito nililimitahan ang tinutukoy sa pormal na mensahe, turo, o patotoo lamang.
theological_decisions:
- issue: Saklaw ng “mga salita namin”
  choice: Pinanatili ang malawak at literal na “mga salita namin,” na tumutukoy sa sinabi ni Pablo at ng kanyang mga kasama nang hindi tinutukoy ang eksaktong konteksto.
  alternative: “aming mensahe,” “aming turo,” o “aming patotoo sa hukuman”
  rationale: Hindi nililinaw ng parirala kung ito ay patotoo sa hukuman, pangangaral, o pagtuturong Kristiyano. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Mag-ingat ka rin” bilang tuwirang babala at ang “matindi ang pagsalungat” upang iwasan ang pilit na literalismong “lubha siyang tumindig laban.”
