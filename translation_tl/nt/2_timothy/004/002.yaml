  to: Ipangaral mo ang salita. Maging handa ka[a], napapanahon man o hindi[b]. Ituwid mo, sawayin mo, at himukin mo[c], nang may buong pagtitiyaga at pagtuturo.
  rationale: Pinalitan ang “manghikayat ka” ng “himukin mo” upang mas tumpak na maipahayag ang παρακάλεσον sa konteksto ng pastoral na pagwawasto at pagsaway. Pinalitan ang “Magwasto ka” ng “Ituwid mo” para sa mas tuwirang diwa ng pagwawasto, at inalis ang di-kailangang “Gawin mo ito” upang mapanatili ang maigsi at magkakatugmang ritmo ng mga pautos. Ang “buong pagtitiyaga” ay natural na nagpapahayag ng πάσῃ μακροθυμίᾳ nang walang labis na pagpapakahulugan.
