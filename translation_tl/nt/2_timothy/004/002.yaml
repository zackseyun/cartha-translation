  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: tl
  text: Ipangaral mo ang salita. Maging handa ka[a], napapanahon man o hindi[b]. Ituwid mo, sawayin mo, at himukin mo[c], nang may buong pagtitiyaga at pagtuturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maging laging handa” o “maging masigasig.” Maaaring ipahiwatig ng pautos sa Griyego ang pagiging handa, naroroon, o mapilit sa pagsasagawa ng atas.
    reason: lexical_alternative
  - marker: b
    text: O “angkop man ang panahon o hindi.”
    reason: lexical_alternative
  - marker: c
    text: O “palakasin mo ang loob” o “manghikayat ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Ipangaral mo
  rationale: Ang pautos na anyo ng κηρύσσω ay tumutukoy sa hayagang pagpapahayag. Ang “ipangaral” ay likas, malinaw, at may angkop na bigat sa kontekstong pastoral.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Pinananatili ng “ang salita” ang lawak at teolohikal na bigat ng λόγος nang hindi ito tahasang nililimitahan sa “ebanghelyo” o “Kasulatan.”
- source_word: ἐπίστηθι
  choice: Maging handa ka
  rationale: Ipinahihiwatig ng pautos ang pagiging naroon at nakahandang kumilos. Likas ito sa modernong Tagalog at mahusay na kaugnay ng kasunod na pagtukoy sa angkop o di-angkop na panahon.
- source_word: εὐκαίρως ἀκαίρως
  choice: napapanahon man o hindi
  rationale: Maikli at natural na ipinahahayag nito ang magkatambal na ideya ng paggawa kung ang pagkakataon ay tila angkop o hindi.
- source_word: ἔλεγξον
  choice: Magwasto ka
  rationale: Ipinahahayag nito ang paglalantad at pagtutuwid ng mali, nang hindi nililimitahan ang diwa sa panloob na pagkakumbinsi lamang.
- source_word: ἐπιτίμησον
  choice: sumaway ka
  rationale: Pinananatili ng “sumaway” ang mas matindi at tahasang puwersang mapagtuwid ng pandiwa.
- source_word: παρακάλεσον
  choice: manghikayat ka
  rationale: Saklaw ng “manghikayat” ang taimtim na paghimok at maaari ring magtaglay ng diwa ng pagpapalakas ng loob, gaya ng pinahihintulutan ng παρακαλέω.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: nang may lubos na pagtitiis
  rationale: Ang μακροθυμία ay matiyagang pagtitiis, lalo na sa pakikitungo sa mga tao; ipinakikita ng “lubos” ang komprehensibong puwersa ng πάσῃ.
- source_word: καὶ διδαχῇ
  choice: at pagtuturo
  rationale: Pinananatili ng “pagtuturo” ang diwa ng instruksiyong kasama ng pagwawasto, pagsaway, at panghihikayat.
theological_decisions:
- issue: Saklaw ng “ang salita”
  choice: ang salita
  alternative: ang mensahe; ang ebanghelyo; ang Kasulatan
  rationale: Bagaman iniuugnay ng konteksto ang ipinahahayag sa apostolikong mensahe at sa Kasulatan, hindi tahasang nililimitahan ng λόγος ang kahulugan nito rito. Pinananatili ng salin ang tunay na lawak ng teksto.
- issue: Puwersa ng παρακάλεσον
  choice: manghikayat ka
  alternative: himukin mo; palakasin mo ang loob
  rationale: Maaaring tumukoy ang pandiwa sa taimtim na paghimok o sa pagpapalakas ng loob. Ang “manghikayat” ay hindi lubusang nagtatakda sa isa lamang sa mga diwang ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling pautos upang mapanatili ang sunod-sunod at mariing ritmo ng Griyego. Idinagdag ang pangungusap na “Gawin mo ito” bilang likas na pang-ugnay sa Tagalog; hindi ito nagdaragdag ng bagong gawain kundi inuugnay ang pariralang nagsasaad ng paraan sa tatlong naunang pautos.
