  text: Make every effort to come to me quickly[a].
translation:
  language: tl
  text: Sikapin mong makapunta agad sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magsikap kang pumunta sa akin sa lalong madaling panahon” o “Gawin mo ang lahat upang makapunta agad sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Sikapin mo
  rationale: Ang aorist active imperative ng σπουδάζω ay nagpapahayag ng masigasig at sinasadyang pagsisikap. Likas sa modernong Tagalog ang “Sikapin mo,” at hindi nito isinasama ang ideya ng pagmamadali na hiwalay na ipinahahayag ng ταχέως.
- source_word: ἐλθεῖν
  choice: makapunta
  rationale: Ang aorist infinitive ng ἔρχομαι ay nakasalalay sa Σπούδασον. Sa Tagalog, natural ang “makapunta” pagkatapos ng “sikapin” kapag ang tinutukoy ay matagumpay na pagdating sa kinaroroonan ng nagsasalita.
- source_word: πρός με
  choice: sa akin
  rationale: Ang πρός na may accusative ay nagpapahiwatig ng pagkilos patungo sa isang tao. Ang “sa akin” ang malinaw at karaniwang katumbas nito sa pangungusap.
- source_word: ταχέως
  choice: agad
  rationale: Maaaring mangahulugan ang ταχέως ng “mabilis” o “sa lalong madaling panahon.” Sa pakiusap na makarating sa nagsasalita, ang “agad” ay natural na nagpapahayag ng temporal na pagmamadali nang hindi inuulit nang alanganin ang diwa ng pagsisikap.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, tuwiran, at magalang na modernong Tagalog. Pinanatiling magkahiwalay ang masigasig na pagsisikap sa Σπούδασον at ang agarang panahon sa ταχέως.
