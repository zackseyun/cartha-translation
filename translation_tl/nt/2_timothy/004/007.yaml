  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: tl
  text: Nakipaglaban ako sa mabuting laban; natapos ko ang karera; iningatan ko ang pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Iningatan ko ang katapatan” o “Nanatili akong tapat.” Ang Griyegong τὴν πίστιν ay maaaring tumukoy sa “pananampalataya” bilang pananampalatayang Kristiyano, o sa katapatang pinanatili.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: marangal na labanan
  rationale: Ang ἀγών ay maaaring tumukoy sa pakikibaka, paligsahan, o labanan, at ang καλός dito ay may diwang mabuti o marangal. Pinananatili ng “marangal na labanan” ang lakas ng talinghaga at likas itong pakinggan sa modernong Filipino.
- source_word: ἠγώνισμαι
  choice: Nakipaglaban ako
  rationale: Ang perpektong anyo ng ἀγωνίζομαι ay nagpapahayag ng natapos na pakikibakang may nananatiling kabuluhan. Ang “nakipaglaban ako” ang pinakanatural na katumbas sa Filipino sa kontekstong ito.
- source_word: δρόμον
  choice: takbuhan
  rationale: Ang δρόμος ay takbuhan o karera. Ang “takbuhan” ay nagpapanatili sa larawang atletiko at maaari ring tumukoy sa landasing itinakda upang tapusin.
- source_word: τετέλεκα
  choice: natapos ko
  rationale: Ang perpektong anyo ng τελέω ay nagsasaad na ang takbuhan ay dinala hanggang sa wakas. Maikli at natural ang “natapos ko.”
- source_word: πίστιν
  choice: pananampalataya
  rationale: Maaaring tumukoy ang πίστις sa pananampalataya bilang nilalaman ng paniniwalang Kristiyano o sa katapatan/pananatiling tapat. Ang “pananampalataya” sa pangunahing teksto ay nagpapanatili sa malakas at nakaugaliang pagbasa nang hindi isinasara ang ibang posibleng diwa.
- source_word: τετήρηκα
  choice: iningatan ko
  rationale: Ang τηρέω ay maaaring mangahulugang ingatan, panatilihin, o bantayan. Ang “iningatan ko” ay likas at naiiwan nitong bukas kapuwa ang diwa ng pagpapanatili at pag-iingat.
theological_decisions:
- issue: Kahulugan ng τὴν πίστιν
  choice: ang pananampalataya
  alternative: nanatili akong tapat / pinanatili ko ang katapatan
  rationale: Bagaman maaaring tukuyin ng parirala ang pananampalatayang Kristiyano, maaari rin itong magpahiwatig ng katapatang pinanatili ni Pablo. Ginamit sa pangunahing teksto ang “pananampalataya,” at inilagay sa talababa ang tunay na leksikal at teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tatlong magkakatimbang at maiikling pahayag, pati ang magkaugnay na talinghaga ng labanan at takbuhan. Inilagay ang marker na [a] kaagad pagkatapos ng pariralang may kalabuan.
