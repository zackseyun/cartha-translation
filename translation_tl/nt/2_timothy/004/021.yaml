id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: tl
  text: Sikapin mong makarating bago magtaglamig. Kinukumusta ka nina Eubulo, Pudente, Lino, at Claudia, pati ng lahat ng kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kapatid na lalaki”; ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit sa kontekstong ito maaari itong tumukoy sa mas malawak na pangkat ng mga mananampalataya, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Sikapin mong
  rationale: Ipinahahayag ng aorist imperative ang masigasig at apurahang pagsisikap. Natural sa modernong Tagalog ang “Sikapin mong” at hindi nito pinalalabis ang kahulugan.
- source_word: πρὸ χειμῶνος ἐλθεῖν
  choice: makarating bago magtaglamig
  rationale: Ang πρό na may genitive ay tumutukoy sa panahong bago dumating ang taglamig. Sa konteksto ng hinihiling na paglalakbay ni Timoteo, natural ang “makarating”; ang “bago magtaglamig” ay malinaw at karaniwang paraan ng pagpapahayag.
- source_word: Ἀσπάζεταί σε
  choice: Kinukumusta ka
  rationale: Sa konteksto ng liham, ang ἀσπάζομαι ay pagpaparating ng pagbati. Ang “Kinukumusta ka” ay natural na pormula sa Tagalog para sa gayong pagbati mula sa malayo.
- source_word: Εὔβουλος
  choice: Eubulo
  rationale: Isinalin sa karaniwang anyong Tagalog ang pangalang Griyego.
- source_word: Πούδης
  choice: Pudente
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Latin na Pudens.
- source_word: Λίνος
  choice: Lino
  rationale: Ginamit ang karaniwang anyong Tagalog ng personal na pangalan.
- source_word: Κλαυδία
  choice: Claudia
  rationale: Pinanatili ang malawak na kinikilalang baybay ng personal na pangalan.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: lahat ng kapatid
  rationale: Bagaman panlalaking maramihan ang ἀδελφοί sa gramatika, ang “mga kapatid” sa Tagalog ay likas na walang tinutukoy na kasarian at maaari ring tumukoy sa kapwa mananampalataya. Pinananatili nito ang leksikal na larawan nang hindi nagpapasok ng kasariang hindi tahasang minamarkahan sa Tagalog.
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa isang posibleng halo-halong pangkat ng mga Cristiano
  choice: lahat ng kapatid
  alternative: lahat ng kapatid na lalaki; lahat ng mananampalataya
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit maaari itong gamitin para sa mas malawak na pamayanan ng mga mananampalataya. Dahil walang kasarian ang salitang Tagalog na “kapatid,” napapanatili nito ang tunay na luwag ng posibleng tinutukoy. Nililinaw ng talababa ang dalawang pagbasa nang hindi nagpapasya nang higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na magalang, malinaw, at angkop sa liham. Ginamit ang “Sikapin mong” para sa apurahang tagubilin at “Kinukumusta ka” bilang natural na pormula ng pagbati. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinatalababa.
