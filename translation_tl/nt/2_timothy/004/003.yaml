  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: tl
  text: Sapagkat darating ang panahon na hindi nila matitiis ang wastong turo[a], ngunit ayon sa sarili nilang mga pagnanasa ay mag-iipon sila para sa kanilang sarili ng mga guro, na nangangati ang kanilang pandinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malusog na turo” o “wastong doktrina.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na nangangati ang pandinig.” Ang larawan ay tumutukoy sa pananabik na makarinig ng nais marinig; maaari rin itong unawain bilang paglalarawan sa kanilang kalagayan, hindi bilang tahasang pahayag ng sanhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: panahon
  rationale: Tumutukoy ito sa isang tiyak na panahong darating; natural at malinaw sa modernong Tagalog ang “panahon.”
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: ang wastong turo
  rationale: Literal na “malusog na turo,” ngunit metaporikal itong tumutukoy sa turong tama at kapaki-pakinabang. Mas natural sa Tagalog ang “wastong turo” kaysa “malusog na turo,” at hindi ito kasing teknikal ng “doktrina.”
- source_word: οὐκ ἀνέξονται
  choice: hindi nila matitiis
  rationale: Ipinahahayag ng ἀνέχομαι ang pagtitiis o pagpaparaya; pinananatili ng “hindi nila matitiis” ang diwa ng aktibong pagtangging magtiis.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: ayon sa sarili nilang mga pagnanasa
  rationale: Malawak ang saklaw ng ἐπιθυμίαι rito—mga hangarin o pagnanasa—kaya hindi ito nilimitahan sa seksuwal na kahulugan ng “pagnanasa.”
- source_word: ἑαυτοῖς
  choice: para sa kanilang sarili
  rationale: 'Pinananatili nito ang reflexive na diwa: pumipili at nagtitipon sila ng mga guro ayon sa sarili nilang kapakanan o kagustuhan.'
- source_word: ἐπισωρεύσουσιν
  choice: magtitipon sila ng napakarami
  rationale: Ang pandiwa ay may larawan ng pagtatambak o labis na pag-iipon. Ang “napakarami” ay natural na nagpapahayag sa Tagalog ng labis na dami nang hindi gumagamit ng alanganing literal na “magtatambak ng mga guro.”
- source_word: διδασκάλους
  choice: mga guro
  rationale: Ito ang karaniwan at tuwirang katumbas, at walang dahilan upang gawin itong natatanging titulo.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: dahil gusto nilang makarinig ng mga bagay na kasiya-siya sa kanilang pandinig
  rationale: Ang literal na larawang “kinakati ang pandinig” ay maaaring maging malabo sa modernong Tagalog. Inilalahad sa pangunahing teksto ang idiomatikong diwa, habang pinananatili sa talababa ang literal na larawan at ang posibleng di-tiyak na ugnayan ng participle.
theological_decisions:
- issue: Pagbibigay-kahulugan sa διδασκαλία
  choice: turo
  alternative: doktrina
  rationale: Tinutukoy ng konteksto ang mapananaligang pagtuturo, ngunit hindi hinihingi ng salitang Griyego ang mas teknikal at maaaring denominasyonal na “doktrina.”
- issue: Ugnayan ng κνηθόμενοι sa pangunahing pandiwa
  choice: dahil gusto nilang makarinig ng mga bagay na kasiya-siya sa kanilang pandinig
  alternative: na kinakati ang pandinig
  rationale: Maaaring ipahiwatig ng participle ang kalagayan o motibo nang hindi tahasang tinutukoy ang eksaktong lohikal na ugnayan. Ginawang natural ang pangunahing teksto, ngunit nilinaw sa talababa na literal na “kinakati ang pandinig” at hindi ganap na tahasang sanhi ang anyong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang sobrang teknikal na “doktrina” sa pangunahing teksto at ang alanganing literal na “magtatambak ng mga guro.” Ang matalinghagang “kinakati ang pandinig” ay inilagay sa talababa upang mapanatili ang larawan at ang ambiguwidad ng participial construction.
