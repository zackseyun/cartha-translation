lexical_decisions:
- source_word: εἷς ... εἷς
  choice: iisa ... iisa
  rationale: 'Pinananatili ang mariing pagkakatulad ng dalawang parirala: iisa ang Diyos at iisa ang tagapamagitan.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: μεσίτης
  choice: tagapamagitan
  rationale: Ito ang natural at tiyak na salitang Filipino para sa isang namamagitan sa dalawang panig.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: sa Diyos at sa mga tao
  rationale: Bagaman nasa anyong genitive ang Griyego, natural sa Filipino ang ganitong pag-uugnay sa salitang “tagapamagitan.” Ang “mga tao” ay tumutukoy sa sangkatauhan sa pangkalahatan.
- source_word: ἄνθρωπος
  choice: ang tao
  rationale: Pinananatili ang lantad na diin ng teksto sa tunay na pagkatao ng tagapamagitan at ang leksikal na ugnayan nito sa “mga tao.”
- source_word: Χριστὸς Ἰησοῦς
  choice: ang Mesiyas na si Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” at inayos ang parirala sa likas na balangkas ng Filipino nang hindi binabago ang pagkakakilanlan ni Jesus.
theological_decisions:
- issue: Ugnayan ng ἀνθρώπων at ἄνθρωπος
  choice: mga tao ... ang tao
  alternative: sangkatauhan ... ang taong si Jesus
  rationale: Ang napiling anyo ay kapuwa natural sa Filipino at malinaw na nagpapanatili sa sinadyang pag-uugnay ng sangkatauhan sa pagkatao ni Jesus.
- issue: Pagpapahayag sa Χριστός bilang titulo
  choice: ang Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Ipinakikita ng salin na titulo ang “Mesiyas,” hindi apelyido; ibinibigay sa talababa ang tradisyonal na anyo.
- issue: Diin sa pagkatao ni Jesus
  choice: Isinalin nang tuwiran ang ἄνθρωπος bilang “ang tao”
  alternative: ang taong tagapamagitan, si Jesus na Mesiyas
  rationale: Pinananatili ang tahasang diin ng talata sa pagkatao ni Jesus nang hindi nagdaragdag ng pahayag tungkol sa kaniyang pagka-Diyos o nagmumungkahing itinatanggi iyon ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “iisa” para sa diin at pagkakatulad ng dalawang sugnay. Ang gitling na em dash ay nagpapakilalang ang tao—ang Mesiyas na si Jesus—ang tinutukoy na nag-iisang tagapamagitan.
