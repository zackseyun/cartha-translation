base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: tl
  text: At hindi nalinlang si Adan, ngunit ang babae, nang malinlang[a], ay napasailalim sa paglabag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang lubusang malinlang.” Maaaring masidhi ang pandiwang Griyego rito kaysa sa naunang “nalinlang,” bagaman hindi tiyak na kailangan itong idiin sa bawat gamit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ay napasailalim na sa paglabag” o “ay napasok sa kalagayan ng paglabag.” Maaaring idiin ng anyong perfect ng pandiwang Griyego ang kalagayang ibinunga ng pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Adam sa modernong saling Tagalog.
- source_word: ἠπατήθη
  choice: hindi nalinlang
  rationale: Tuwirang ipinahahayag ng aorist passive ng ἀπατάω na si Adan ay hindi nalinlang; mas angkop sa marangal na rehistro ang “nalinlang” kaysa “nadaya” o “naloko.”
- source_word: ἡ γυνὴ
  choice: ang babae
  rationale: Bagaman maaari ring mangahulugang “asawa” ang γυνή, malinaw na tinutukoy rito ang babae sa salaysay ng Genesis at ikinukumpara siya kay Adan.
- source_word: ἐξαπατηθεῖσα
  choice: nang malinlang
  rationale: Isinasalin ang aorist passive participle bilang kilos na nauna sa pangunahing pandiwa. Hindi inilagay sa pangunahing teksto ang “lubusang” dahil maaaring masidhi ang tambalang pandiwa ngunit hindi tiyak na kailangang idiin iyon sa bawat gamit; inilalahad ang posibilidad sa talababa.
- source_word: ἐν παραβάσει
  choice: sa paglabag
  rationale: Pinananatili ang abstraktong pangngalang παράβασις bilang “paglabag” sa halip na gawing personal na katawagang “lumabag” o “makasalanan.”
- source_word: γέγονεν
  choice: humantong
  rationale: Ipinahihiwatig ng perfect ng γίνομαι ang pangyayaring nagbunga ng isang kalagayan. Natural sa Tagalog ang “humantong sa paglabag,” habang ipinapaliwanag sa talababa ang maaaring pagdiin sa namamalaging kalagayan.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw nitong ipinakikita ang pagsalungat ng sinabi tungkol kay Adan at sa babae.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa naunang pangangatwiran nang hindi nagdaragdag ng di-hayag na konklusyon.
theological_decisions:
- issue: Kung paano ilalarawan ang kaugnayan ng babae sa paglabag nang hindi nagpapasok ng mas malawak na doktrina tungkol sa lahat ng babae.
  choice: 'Isinalin bilang isang pahayag na nakaugnay sa salaysay ng Genesis: “ang babae, nang malinlang, ay humantong sa paglabag.”'
  alternative: “ang babae, nang malinlang, ay naging isang lumalabag”
  rationale: Pinananatili ng napiling anyo ang abstraktong “paglabag” ng Griyego at hindi ginagawang katawagan sa pagkatao ng babae ang pangyayari. Hindi rin nito pinalalawak ang saklaw ng talata nang lampas sa tahasang sinasabi nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinili ang “nalinlang” at “paglabag” bilang malinaw sa karaniwang mambabasa at angkop sa tono ng Kasulatan; iniwasan ang mas kolokyal na “naloko” at ang mas mabigat o di-likas na literalismo.
