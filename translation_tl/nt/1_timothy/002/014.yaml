    rationale: Ang perfect ng γίνομαι kasama ng ἐν + dative ay nagpapahayag ng kalagayang resulta, ngunit hindi tahasang nagsasaad ng isang prosesong “humantong.” Ang “napasailalim sa paglabag” ay mas maingat na naghahayag ng resultang kalagayan nang hindi ginagawang personal na label ang babae.
