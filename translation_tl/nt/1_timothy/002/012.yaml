id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: tl
  text: Ngunit hindi ko pinahihintulutan ang isang babae na magturo o gumamit ng awtoridad sa isang lalaki[a][b]; sa halip, dapat siyang maging tahimik.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang asawang babae ... isang asawang lalaki.” Maaaring magkaroon ng pangkalahatang kahulugang “babae/lalaki” o pangmag-asawang kahulugang “asawang babae/asawang lalaki” ang mga salitang Griyego.
    reason: alternative_reading
  - marker: b
    text: O “magkaroon ng awtoridad sa”; maaari ring “mangibabaw sa.” Bihira ang pandiwang Griyego at pinagtatalunan ang eksaktong diwa nito.
    reason: lexical_alternative
  - marker: c
    text: O “manahimik.” Maaaring tumukoy ang salitang Griyego sa katahimikan, mahinahong kalagayan, o pananahimik ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: magturo
  rationale: Tuwirang ipinapahayag ng pawatas ang gawaing hindi pinahihintulutan; natural at malinaw ang “magturo” sa modernong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang banayad na pagsalungat o paglipat mula sa naunang tagubilin.
- source_word: γυναικί
  choice: isang babae
  rationale: Maaaring mangahulugan ang γυνή ng “babae” o “asawang babae.” Mas angkop bilang pangunahing salin ang pangkalahatang kahulugan ayon sa konteksto, habang inilalagay sa talababa ang kahulugang pangmag-asawa.
- source_word: οὐκ ἐπιτρέπω
  choice: hindi ko pinahihintulutan
  rationale: Pinananatili nito ang tahasan at kasalukuyang pahayag ng unang panauhan, sa dignified ngunit karaniwang Tagalog.
- source_word: οὐδὲ
  choice: o
  rationale: Natural sa Tagalog ang “o” matapos ang negatibong pandiwang “hindi ... pinahihintulutan” upang iugnay ang ikalawang gawaing ipinagbabawal.
- source_word: αὐθεντεῖν
  choice: mamahala sa
  rationale: Ang bihira at pinagtatalunang pandiwa ay tumutukoy sa paggamit o pagkakaroon ng awtoridad. Ang “mamahala sa” ay maikli at medyo neutral, nang hindi agad ipinapalagay ang mapang-abusong diwa ng “mangibabaw.” Inilalahad sa talababa ang ibang posibleng nuances.
- source_word: ἀνδρός
  choice: isang lalaki
  rationale: Maaaring mangahulugan ang ἀνήρ ng “lalaki” o “asawang lalaki.” Pinili sa pangunahing teksto ang pangkalahatang kahulugan at pinanatili sa talababa ang posibleng kahulugang pangmag-asawa.
- source_word: ἀλλ’
  choice: sa halip
  rationale: Malinaw nitong ipinakikita ang kaibahan sa pagitan ng pagbabawal at ng positibong kalagayang kasunod.
- source_word: εἶναι
  choice: dapat siyang manatili
  rationale: Ginagawang natural sa Tagalog ang infinitival construction at malinaw na ipinakikitang ito ang inaasahang kalagayan ng babaeng tinutukoy. Ang “manatili” ay kontekstuwal na paglalahad, hindi pag-angkin na may hiwalay na pandiwang ‘remain’ sa Griyego.
- source_word: ἐν ἡσυχίᾳ
  choice: sa katahimikan
  rationale: Sinasaklaw ng “katahimikan” ang tahimik at mahinahong kalagayan, ngunit maaari rin itong maunawaang ganap na pananahimik; kaya nililinaw sa talababa ang saklaw ng salita.
theological_decisions:
- issue: Kahulugan ng αὐθεντεῖν sa isang pinagtatalunang tekstong pangkapulungan
  choice: mamahala sa
  alternative: gumamit o magkaroon ng awtoridad sa; mangibabaw sa
  rationale: Hindi tiyak kung neutral na paggamit ng awtoridad o mapang-abusong pangingibabaw ang diin ng bihirang pandiwa. Ang pangunahing salin ay hindi nag-aangkat ng negatibong nuance na hindi tiyak, at pinananatili ng talababa ang leksikal na pagtatalo.
- issue: Kung ang γυνή at ἀνήρ ay babae/lalaki o asawang babae/asawang lalaki
  choice: isang babae ... isang lalaki
  alternative: isang asawang babae ... kanyang asawang lalaki
  rationale: Kayang taglayin ng dalawang pangngalan ang pangkalahatan at pangmag-asawang kahulugan. Mas malawak ang agarang konteksto kaysa pag-aasawa lamang, ngunit tunay na posibilidad sa leksikon ang marital reading kaya hindi ito inaalis.
- issue: Saklaw ng ἡσυχία
  choice: katahimikan
  alternative: tahimik at mahinahong kalagayan; pananahimik
  rationale: Maaaring tumukoy ang salita sa pagiging tahimik, panatag, o hindi magulo, at hindi kinakailangang sa ganap na hindi pagsasalita. Iniiwasan ng talababa na gawing tiyak ang isang nuance na hindi nilulutas ng salita lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinahihintulutan” upang panatilihin ang pormal ngunit madaling maunawaang tono. Iniwasan ang terminolohiyang nakatali sa isang denominasyon, at inilagay sa mga talababa ang tunay na leksikal at interpretatibong mga alternatibo.
