  naturalness: Malinaw at marangal ang Tagalog. Mas tuwiran at natural sa modernong Tagalog ang “gumamit ng awtoridad sa” para sa neutral na pangunahing salin, at “maging tahimik” para sa inaasahang kalagayan nang hindi idinaragdag ang ‘manatili.’
