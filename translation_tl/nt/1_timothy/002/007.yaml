- from: Dahil dito, itinalaga ako bilang isang tagapagpahayag at apostol—katotohanan ang sinasabi ko; hindi ako nagsisinungaling—at bilang guro ng mga Hentil[a], sa pananampalataya at katotohanan.[b]
  to: Para rito, itinalaga ako bilang isang tagapagpahayag at apostol—katotohanan ang sinasabi ko; hindi ako nagsisinungaling—at guro ng mga Hentil[a], sa pananampalataya at katotohanan.[b]
