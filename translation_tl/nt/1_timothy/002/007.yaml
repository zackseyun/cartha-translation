  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: tl
  text: Para rito, itinalaga ako bilang isang tagapagpahayag at apostol—katotohanan ang sinasabi ko; hindi ako nagsisinungaling—at guro ng mga Hentil[a], sa pananampalataya at katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “guro ng mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: O “sa katapatan at katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Dahil dito
  rationale: Tumutukoy ito pabalik sa naunang mensahe at layuning magligtas; likas sa Tagalog ang “Dahil dito” at hindi nito nililimitahan ang parirala sa layunin lamang.
- source_word: ἐτέθην
  choice: itinalaga ako
  rationale: Sa konteksto, ang pasibong anyo ng τίθημι ay tumutukoy sa paghirang o pagtatalaga sa isang gawain, hindi sa pisikal na paglalagay.
- source_word: κῆρυξ
  choice: tagapagpahayag
  rationale: Ipinahihiwatig ng κῆρυξ ang isang opisyal na naghahayag para sa iba. Mas malinaw ito sa karaniwang mambabasa kaysa sa “heraldo” at mas malapit sa diwang iyon kaysa sa tradisyonal na “mangangaral.”
- source_word: ἀπόστολος
  choice: apostol
  rationale: Kinikilalang katawagan ito sa sariling paglalarawan ni Pablo at karaniwang salin sa modernong Tagalog.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: katotohanan ang sinasabi ko; hindi ako nagsisinungaling
  rationale: Pinananatili ang mariing dobleng pagpapatunay sa natural at kasalukuyang Tagalog.
- source_word: διδάσκαλος ἐθνῶν
  choice: guro ng mga Hentil
  rationale: Sa gamit ni Pablo, karaniwang tumutukoy ang ἔθνη sa mga taong hindi Judio; pinananatili sa talababa ang mas literal na “mga bansa.”
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: sa pananampalataya at katotohanan
  rationale: Pinananatili ang maluwag na ugnayang ipinahihiwatig ng ἐν at ang karaniwang kahulugan ng πίστις, nang hindi tiyak na ipinapasya kung ito ay saklaw, paraan, o katangian ng pagtuturo.
theological_decisions:
- issue: Kahulugan ng ἐθνῶν sa atas kay Pablo
  choice: mga Hentil
  alternative: mga bansa
  rationale: Mas malamang na tinutukoy rito ang mga hindi Judio ayon sa karaniwang gamit ni Pablo, ngunit lehitimo rin ang mas literal na “mga bansa,” kaya isinama ito sa talababa.
- issue: Kahulugan ng πίστις sa ἐν πίστει καὶ ἀληθείᾳ
  choice: pananampalataya
  alternative: katapatan
  rationale: Ang “pananampalataya” ang karaniwang salin at angkop sa posibleng saklaw o diwa ng ministeryo; gayunman, maaari ring mangahulugan ang πίστις ng “katapatan,” kaya pinanatili ang posibilidad na ito sa talababa.
- issue: Ugnayan ng εἰς ὃ sa naunang pahayag
  choice: Dahil dito
  alternative: Para rito / para sa layuning ito
  rationale: Ang Griyego ay maaaring tumukoy sa bagay o layuning dahilan ng pagkatalaga. Ang pangunahing salin ay natural at sapat na maluwag upang hindi lubusang isara ang alinman.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagapagpahayag” upang maipakita ang pampublikong atas ng κῆρυξ nang hindi umasa sa salitang hiram na “heraldo.” Pinanatili ang mahahabang gitling upang malinaw ang mariing paningit ni Pablo.
