  source_fidelity: 'Kailangang baguhin ang pambungad na “Dahil dito.” Ang εἰς ὃ ay tumutukoy sa bagay o layuning pinag-ukulan ng pagtatalaga (“para rito/para sa bagay na ito”), hindi pangunahing sanhi (“dahil dito”). Tapat ang iba pang pangunahing bahagi: ang ἐτέθην ay wastong naipahayag bilang pagtatalaga, ang κῆρυξ at ἀπόστολος ay napanatili, at ang mariing paningit na “katotohanan ang sinasabi ko; hindi ako nagsisinungaling” ay malinaw.'
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “tagapagpahayag,” “apostol,” “mga Hentil,” at “pananampalataya at katotohanan.” Ang “Para rito” ay mas natural at mas eksakto kaysa “Dahil dito” sa ugnayang ipinahihiwatig ng Griyego.
  terminology: Ang “mga Hentil” ay angkop para sa ἐθνῶν sa kontekstong Paulino, habang ang “mga bansa” ay maaaring manatili bilang alternatibo sa talababa. Ang “pananampalataya” para sa πίστις ay angkop; ang “katapatan” ay wastong alternatibong semantiko sa talababa. Ang “tagapagpahayag” ay katanggap-tanggap na modernong salin ng κῆρυξ.
