translation:
  language: tl
  text: na nagnanais na ang lahat ng tao ay maligtas at makarating sa pagkakilala sa katotohanan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na niloloob na maligtas ang lahat ng tao.” Maaari ring isalin ang pandiwang Griyego na “niloloob” o “gustong”; pinili ang “nagnanais” upang hindi pagpasiyahan sa salin ang mga teolohikal na pagtatalong lampas sa mismong pananalita ng teksto.
    reason: lexical_alternative
  - marker: b
    text: O “makarating sa ganap na pagkakilala sa katotohanan.” Maaaring taglay ng pangngalang Griyego ang diwa ng mas buo o mas ganap na pagkakilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: na
  rationale: Panghalip na nag-uugnay sa Diyos na binanggit sa naunang talata; ang “na” ang likas na pang-ugnay sa Filipino kapag ipinagpapatuloy ang pangungusap.
- source_word: πάντας ἀνθρώπους
  choice: ang lahat ng tao
  rationale: Tumutukoy ito sa lahat ng tao, hindi lamang sa mga lalaki. Tuwiran at malinaw ang “lahat ng tao” at hindi nito nililimitahan ang saklaw sa mga uri lamang ng tao.
- source_word: θέλει
  choice: nagnanais
  rationale: Maaaring mangahulugang magnais, gustuhin, o loobin ang θέλω. Pinananatili ng “nagnanais” ang diwa nang hindi ginagawang teknikal na pahayag tungkol sa kalooban ng Diyos.
- source_word: σωθῆναι
  choice: na maligtas
  rationale: Ang anyong balintiyak ng σῴζω ay may malinaw na diwang pangkaligtasan sa kontekstong ito; “maligtas” ang karaniwan at teolohikal na malinaw na katumbas.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: sa pagkakilala sa katotohanan
  rationale: Ang ἐπίγνωσις ay maaaring tumukoy sa pagkakilala, kaalaman, o ganap na kaalaman. Likas sa Filipino ang “pagkakilala sa katotohanan” at hindi nito labis na pinatitindi ang kahulugan.
- source_word: ἐλθεῖν
  choice: makarating
  rationale: Kasama ng εἰς, inilalarawan ng ἔρχομαι ang pagdating sa isang kalagayan o realidad. Mas natural dito ang “makarating” kaysa sa literal na “dumating.”
theological_decisions:
- issue: Saklaw ng πάντας ἀνθρώπους at ang hangarin ng Diyos na maligtas ang tao
  choice: Isinalin nang tuwiran bilang “lahat ng tao” at “nagnanais,” kaya nananatili ang pangkalahatang saklaw at teolohikal na tensiyon ng teksto.
  alternative: “lahat ng uri ng tao”; “niloloob na maligtas ang lahat ng tao”
  rationale: Likas na pangkalahatan ang saklaw ng pariralang Griyego. Hindi ito dapat paliitin sa “lahat ng uri ng tao,” ni dapat gawing teknikal na pahayag ang θέλει tungkol sa isang tiyak na pagkaunawa sa kalooban ng Diyos.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pagkakilala” sa halip na mas akademikong “kaalaman” upang ipahayag ang pagpasok sa tunay na pagkilala sa katotohanan, habang inilagay sa talababa ang posibleng diin sa ganap na kaalaman.
