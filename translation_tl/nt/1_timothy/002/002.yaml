source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: tl
  text: para sa mga hari at sa lahat ng nasa matataas na posisyon[a], upang mamuhay tayo nang payapa at tahimik, nang may buong pagkamaka-Diyos at dignidad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “lahat ng may awtoridad.” Literal na “lahat ng nasa mataas na kalagayan o posisyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: para sa
  rationale: Sa konteksto ng naunang panawagan sa mga panalangin at pamamagitan, likas itong tumutukoy sa mga taong ipinapanalangin.
- source_word: βασιλέων
  choice: mga hari
  rationale: Tiyak na tumutukoy ang pangngalan sa mga hari o soberanong pinuno; pinananatili ng salin ang kongkretong katawagan ng Griyego.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: lahat ng nasa matataas na katungkulan[a]
  rationale: Saklaw nito ang mga taong nasa mataas o prominenteng kalagayan, lalo na sa pamamahala, nang hindi ito labis na nililimitahan sa isang tiyak na uri ng legal na awtoridad.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na ipinahahayag nito ang layunin o inaasahang bunga.
- source_word: ἤρεμον
  choice: payapa
  rationale: Ipinahahayag nito ang kalagayang panatag at malaya sa kaguluhan.
- source_word: ἡσύχιον
  choice: tahimik
  rationale: Pinananatili nito ang diin sa katahimikan at kapanatagan, gayundin ang pagkakaiba nito sa ἤρεμον.
- source_word: βίον διάγωμεν
  choice: mamuhay tayo
  rationale: Likas na salin ito sa Filipino para sa pamumuhay o paggugol ng buhay, at iniiwasan ang pilit na idyomang literal.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: taglay ang buong debosyon sa Diyos
  rationale: Ang εὐσέβεια ay tumutukoy sa mapitagang debosyon sa Diyos na nahahayag sa pamumuhay; mas malinaw ito sa karaniwang mambabasa kaysa sa abstraktong “pagkamaka-Diyos.”
- source_word: σεμνότητι
  choice: marangal na asal
  rationale: Ipinahahayag nito ang seryoso at kagalang-galang na uri ng pamumuhay, hindi lamang panlabas na katayuan o dignidad.
theological_decisions:
- issue: Saklaw at layunin ng panalangin para sa mga pinunong sibil
  choice: Ipinahahayag ng talata ang panalangin para sa mga pinuno upang makapamuhay ang mga mananampalataya nang payapa, may debosyon sa Diyos, at marangal.
  alternative: Bigyang-diin ang pagpapasakop sa pamahalaan, o limitahan ang parirala sa mga may pormal na awtoridad lamang.
  rationale: Binabanggit ng Griyego kung sino ang ipinapanalangin at ang layuning kalagayan ng pamumuhay, ngunit hindi nito tahasang itinuturo rito ang walang-pasubaling pagsang-ayon o pagpapasakop sa bawat pinuno.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinili ang “debosyon sa Diyos” upang maipahayag ang relihiyoso at praktikal na diwa ng εὐσέβεια, at “marangal na asal” upang gawing likas ang moral at panlipunang bigat ng σεμνότης.
