  text: ⸀τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: tl
  text: Ito ay mabuti at katanggap-tanggap sa paningin ng Diyos na ating Tagapagligtas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Ito
  rationale: Ang panghalip na pamatlig na nasa anyong neuter singular ay tumutukoy pabalik sa naunang tagubilin tungkol sa pananalangin. Likas sa Tagalog ang “Ito” at hindi nito labis na tinutukoy kung ano ang tinutukoy.
- source_word: καλὸν
  choice: mabuti
  rationale: Sa kontekstong etikal, ipinahihiwatig ng καλός ang kabutihan o pagiging nararapat, hindi lamang kagandahang panlabas.
- source_word: ἀπόδεκτον
  choice: katanggap-tanggap
  rationale: Ipinahihiwatig ng salita ang isang bagay na malugod o may pagsang-ayon na tinatanggap. Pinananatili ng “katanggap-tanggap” ang evaluative na diwa nang hindi dinaragdagan ang kahulugan.
- source_word: ἐνώπιον
  choice: sa paningin ng
  rationale: Dito ay tumutukoy ito sa pagtataya o pagsang-ayon ng Diyos. Mas natural sa modernong Tagalog ang “sa paningin ng” kaysa literal na “sa harap ng.”
- source_word: σωτῆρος
  choice: Tagapagligtas
  rationale: Ang σωτήρ ay titulong tumutukoy sa nagliligtas. Ang “Tagapagligtas” ang malinaw at kinikilalang katumbas sa gamit ng Bagong Tipan.
- source_word: ἡμῶν
  choice: ating
  rationale: Tuwirang pinananatili ang unang panauhang maramihang panghalip na kaugnay ng “Tagapagligtas.”
- source_word: θεοῦ
  choice: Diyos
  rationale: Ang θεοῦ ay nasa apposition sa “Tagapagligtas”; natural sa Tagalog ang ayos na “Diyos na ating Tagapagligtas.”
theological_decisions:
- issue: Ugnayang appositional sa τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Diyos na ating Tagapagligtas
  alternative: ating Tagapagligtas na Diyos
  rationale: Likas na ipinakikilala ng magkakaugnay na genitive ang Diyos bilang ating Tagapagligtas. Ang piniling ayos ay malinaw at natural sa Tagalog at hindi nagdaragdag ng doktrinang lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sa paningin ng” bilang natural na idyoma para sa banal na pagtataya, at ang “Diyos na ating Tagapagligtas” upang malinaw na mapanatili ang apposition.
