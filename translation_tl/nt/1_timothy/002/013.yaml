id: 1TI.2.13
reference: 1 Timothy 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: tl
  text: Sapagkat si Adan ang unang hinubog[a], saka si Eva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inanyuan.” Ang pandiwa ay umaalingawngaw sa pananalita tungkol sa paghubog sa salaysay ng paglikha sa Genesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o batayan para sa naunang pahayag at pinananatili ang paliwanag na ugnayan ng talata.
- source_word: Ἀδὰμ
  choice: Adan
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa modernong Tagalog.
- source_word: πρῶτος
  choice: ang unang
  rationale: Malinaw nitong ipinahahayag ang temporal na pagkakasunod kaugnay ng paghubog kay Eva.
- source_word: ἐπλάσθη
  choice: hinubog
  rationale: Tumpak na inilalarawan ang pag-aanyo o paghubog at pinananatili ang alingawngaw ng pananalita sa salaysay ng paglikha sa Genesis, sa halip na gamitin ang mas malawak na 'nilalang.'
- source_word: εἶτα
  choice: saka
  rationale: Natural sa Tagalog at malinaw na nagsasaad ng sumunod na pangyayari sa temporal na pagkakasunod.
- source_word: Εὕα
  choice: Eva
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan sa pagkakasunod ng paglikha sa Genesis sa loob ng pinagtatalunang kontekstong pang-iglesia
  choice: 'Isinalin bilang payak na pahayag ng temporal na pagkakasunod: si Adan ang unang hinubog, saka si Eva.'
  alternative: Isang mas interpretatibong salin na tuwirang naglalagay ng implikasyon tungkol sa awtoridad o pagkakaiba ng mga tungkulin.
  rationale: Ang Griyegong teksto ay tahasang nagsasaad lamang ng pagkakasunod ng paghubog. Hindi nito sa talatang ito mismo binibigkas ang buong teolohikal na implikasyon, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Natural, maikli, at marangal na modernong Tagalog. Ginamit ang “hinubog” upang mapanatili ang konkretong larawan ng πλάσσω at ang kaugnayan nito sa Genesis; ang “saka” ay payak at malinaw na pananda ng pagkakasunod.
