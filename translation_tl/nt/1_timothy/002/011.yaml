id: 1TI.2.11
reference: 1 Timothy 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: tl
  text: Dapat matuto ang babae[a] nang tahimik[b], na may lubos na pagpapasakop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “asawang babae,” depende sa konteksto; ang salitang Griyego ay maaaring mangahulugang “babae” o “asawang babae.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nang walang imik”; ang salitang Griyego ay maaari ring tumukoy sa katahimikan o kapanatagan, at hindi kinakailangang mangahulugan ng lubos na hindi pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: ang babae
  rationale: Maaaring mangahulugan ang γυνή ng “babae” o “asawang babae” ayon sa konteksto. Pinananatili ng “ang babae” ang pangkalahatang diwa ng isahang anyo nang hindi ipinapalagay na may asawa ang tinutukoy.
- source_word: ἐν ἡσυχίᾳ
  choice: nang tahimik
  rationale: Ang ἡσυχία ay maaaring tumukoy sa katahimikan, kapanatagan, o mahinahong asal, at hindi kinakailangang mangahulugan ng lubos na hindi pagsasalita. Likas sa modernong Tagalog ang “nang tahimik” at hindi nito pinalalabis ang utos.
- source_word: μανθανέτω
  choice: dapat matuto
  rationale: Ang μανθανέτω ay pangkasalukuyang pautos sa ikatlong panauhan. Malinaw na ipinahahayag ng “dapat matuto” na ito ay isang positibong tagubilin na matuto, hindi lamang pahintulot.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: na may lubos na pagpapasakop
  rationale: Ipinahahayag ng ὑποταγή ang pagpapasakop, at ng πάσῃ ang kabuuan o kalubusan nito. Hindi tinutukoy sa Griyego kung kanino ang pagpapasakop, kaya hindi rin nagdagdag ng tahasang layon ang salin.
theological_decisions:
- issue: Kung ang ἡσυχία ay lubos na pananahimik o tahimik at mahinahong asal
  choice: nang tahimik
  alternative: nang walang imik
  rationale: Saklaw ng salita ang katahimikan at kapanatagan, kaya hindi dapat ipakahulugan ng salin na ganap na pagbabawal sa lahat ng pagsasalita.
- issue: Kung ang γυνή ay “babae” o “asawang babae”
  choice: babae
  alternative: asawang babae
  rationale: Walang tahasang palatandaan sa mismong parirala na kasal ang tinutukoy. Hindi nililimitahan ng “babae” ang kahulugan, samantalang pinananatili sa talababa ang posibleng kahulugang “asawang babae.”
- issue: Kung dapat tukuyin kung kanino ang pagpapasakop
  choice: hindi tinukoy ang layon
  alternative: pagpapasakop sa guro o sa lalaki
  rationale: Walang nakasaad na layon ng ὑποταγῇ sa talata. Ang pagdaragdag nito ay magpapasya sa isang usaping hindi tahasang nilulutas ng tekstong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dapat matuto” upang likas na maipahayag ang puwersa ng pautos, at iniwasang magdagdag ng hindi nakasaad na layon ng pagpapasakop.
