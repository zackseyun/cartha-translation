translation:
  language: tl
  text: na nagbigay ng kanyang sarili bilang pantubos para sa lahat[a]—ang patotoo sa mga takdang panahon.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa lahat.” Pinananatili ng “para sa lahat” ang malawak na saklaw ng Griyego nang hindi nagpapasiya kung ang ibig sabihin ay bawat indibidwal o lahat ng uri ng tao.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang pagpapatotoo” o “ang patotoong ibinigay sa mga takdang panahon.” Siksik ang pariralang Griyego at maaaring mangahulugang ang pagbibigay ni Cristo ng kanyang sarili ang patotoong nahayag sa mga panahong itinakda ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “bilang patotoo sa mga takdang panahon.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δοὺς
  choice: ibinigay
  rationale: Ang aorist participle ay tumutukoy kay Cristo Jesus sa naunang talata. Ang anyong “na ibinigay” ay likas sa Tagalog bilang sugnay na naglalarawan at pinananatili ang diwa ng kusang pagkakaloob.
- source_word: ἑαυτὸν
  choice: ang kanyang sarili
  rationale: Tuwirang ipinapahayag ng reflexive pronoun na ang ibinigay ni Cristo ay ang sarili niya.
- source_word: ἀντίλυτρον
  choice: bilang pantubos
  rationale: Ang “pantubos” ay malinaw at karaniwang katumbas ng halagang ibinabayad upang palayain ang iba. Hindi pinalalawak sa pangunahing teksto ang mas mariing diwa ng ἀντί- bilang kapalit upang maiwasan ang labis na pagpapaliwanag.
- source_word: ὑπὲρ πάντων
  choice: para sa lahat
  rationale: Likas at malawak ang “para sa lahat,” at hindi nito nililimitahan ang πάντων sa alinman sa bawat indibidwal o lahat ng uri ng tao.
- source_word: τὸ μαρτύριον
  choice: ang patotoo
  rationale: Pinananatili nito ang siksik at maaaring appositional na ugnayan sa naunang pahayag, nang hindi nagdaragdag ng pandiwang wala sa Griyego.
- source_word: καιροῖς ἰδίοις
  choice: sa mga takdang panahon
  rationale: Ipinakikita ng “takdang” ang diwa ng angkop o itinalagang panahon, habang pinananatili ng “mga panahon” ang maramihang bilang ng καιροῖς.
theological_decisions:
- issue: Saklaw ng πάντων kaugnay ng pantubos ni Cristo
  choice: para sa lahat
  alternative: para sa bawat tao; para sa lahat ng uri ng tao
  rationale: Malawak ang mismong pananalita ng talata, ngunit hindi nito tahasang nilulutas ang mga sumunod na pagtatalo tungkol sa saklaw ng pantubos. Kaya pinananatili ang lawak at tensiyong teolohikal ng teksto.
- issue: Diwa ng pagpapalit sa ἀντίλυτρον
  choice: pantubos
  alternative: pantubos na kapalit; halagang pantubos para sa iba
  rationale: Taglay ng salita ang diwa ng pagtubos at pagpapalit, ngunit magiging labis na pagpapaliwanag kung isisingit ang buong pagpapakahulugan sa pangunahing teksto.
- issue: Ugnayan ng τὸ μαρτύριον sa naunang sugnay
  choice: 'Iniharap bilang siksik na apposition: “—ang patotoo sa mga takdang panahon”'
  alternative: “bilang patotoong ibinigay sa mga takdang panahon”; “ang patotoong inihayag sa mga takdang panahon”
  rationale: Maaaring tumukoy ang parirala sa pagbibigay ni Cristo ng sarili bilang mismong patotoo, o sa patotoong nahayag sa itinakdang panahon. Hindi nagdaragdag ang salin ng tahasang pandiwa, kaya nananatili ang tunay na kalabuan ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pantubos,” “patotoo,” at “mga takdang panahon” bilang pamilyar ngunit hindi labis na teknikal na pananalita. Pinanatili ang siksik na hulíng parirala sa pangunahing teksto, habang ipinaliliwanag sa talababa ang posibleng mga ugnayang panggramatika.
