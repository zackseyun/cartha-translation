id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: tl
  text: Kaya, una sa lahat, hinihimok ko na maghandog ng mga pagsusumamo, mga panalangin, mga panalanging namamagitan, at mga pasasalamat alang-alang sa lahat ng tao[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga umuunawa sa “lahat ng tao” bilang “lahat ng uri ng tao”; ang Griyego mismo ay nagsasabing “lahat ng tao.”
    reason: alternative_reading
  - marker: b
    text: Ang “tao” rito ay salin ng pangkalahatang salitang Griyego para sa mga tao at hindi lamang para sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: hinihimok ko
  rationale: Ipinapahayag nito ang taimtim at may awtoridad na panawagan ni Pablo nang hindi gumagamit ng lipas o labis na matigas na pananalita.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang lohikal na kaugnayan ng tagubilin sa naunang talakayan at natural ito sa makabagong Tagalog.
- source_word: πρῶτον πάντων
  choice: una sa lahat
  rationale: Pinananatili ang diin sa pangunahing prayoridad, hindi kinakailangang sa unang bahagi lamang ng isang numeradong talaan.
- source_word: ποιεῖσθαι
  choice: maghandog
  rationale: Natural itong gamitin sa lahat ng apat na anyo ng panalangin at pasasalamat. Bahagya itong mas matalinghaga kaysa literal na 'gawin,' ngunit mas malinaw at marangal sa Tagalog.
- source_word: δεήσεις
  choice: mga pagsusumamo
  rationale: Tumutukoy ito sa marubdob na mga kahilingang nagmumula sa pangangailangan at naiiba sa pangkalahatang salitang 'mga panalangin.'
- source_word: προσευχάς
  choice: mga panalangin
  rationale: Ito ang tuwiran at pangkalahatang katumbas ng salita para sa panalangin.
- source_word: ἐντεύξεις
  choice: mga panalanging namamagitan
  rationale: Sa kontekstong ito, ipinahihiwatig nito ang mga panalanging inihaharap para sa kapakanan ng iba. Pinananatili ng pariralang ito ang pagkakaiba nito sa pangkalahatang 'mga panalangin' nang hindi ipinahihiwatig na ang nananalangin ang siyang tagapamagitan sa natatanging teolohikal na diwa.
- source_word: εὐχαριστίας
  choice: mga pasasalamat
  rationale: Pinananatili ang anyong maramihan at ang pagkakaiba nito sa iba pang uri ng panalangin sa talaan.
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Malinaw nitong ipinahahayag ang diwa ng pagkilos para sa kapakanan o sa ngalan ng iba.
- source_word: πάντων ἀνθρώπων
  choice: lahat ng tao
  rationale: Ang ἄνθρωπος dito ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa mga lalaki; natural at tumpak ang 'lahat ng tao' sa Tagalog.
theological_decisions:
- issue: Saklaw ng πάντων ἀνθρώπων
  choice: lahat ng tao
  alternative: lahat ng uri ng tao
  rationale: Ang mismong Griyegong parirala ay nagsasabing 'lahat ng tao.' Hindi tahasang nililimitahan ng talata ang saklaw sa mga pangkat o uri lamang, kaya pinananatili sa teksto ang payak na kahulugan at inilalagay sa talababa ang ibang pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hinihimok” upang mapanatili ang taimtim na lakas ng panawagan, at “maghandog” upang maging natural ang iisang pandiwang sumasaklaw sa apat na anyo ng panalangin. Iniwasan ang makalumang “mga daing” at ang posibleng malabong nagsasariling pangngalang “mga pamamagitan.”
