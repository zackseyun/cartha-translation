translation:
  language: tl
  text: kundi ng nararapat sa mga babaeng nagpapahayag ng debosyon sa Diyos—sa pamamagitan ng mabubuting gawa.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng naaangkop” o “ng nababagay.”
    reason: lexical_alternative
  - marker: b
    text: O “paggalang sa Diyos” o “pitagan sa Diyos.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa pamamagitan ng mabubuting gawa.” Sa konteksto, ang mabubuting gawa ang inilalarawang angkop na pagpapaganda, bilang kaibahan sa panlabas na pagpapaganda sa talata 9.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: kundi
  rationale: Tumutukoy ito sa pagsalungat sa panlabas na pagpapaganda sa naunang talata; natural ang “kundi” sa pagpapatuloy ng pangungusap.
- source_word: ὃ πρέπει
  choice: ng nararapat
  rationale: Ipinapahayag ng parirala ang bagay na angkop o nababagay sa mga babaeng inilalarawan.
- source_word: γυναιξὶν
  choice: sa mga babae
  rationale: Pangkalahatan ang gamit sa konteksto at hindi limitado sa mga may-asawa.
- source_word: ἐπαγγελλομέναις
  choice: nagpapahayag
  rationale: Ipinahihiwatig ng pandiwari ang hayagang pag-aangkin o pagpapakilala sa sarili, nang hindi ito ginagawang isang panata.
- source_word: θεοσέβειαν
  choice: paggalang sa Diyos
  rationale: Malinaw nitong naihahatid ang debosyon at pitagan na tuwirang nakatuon sa Diyos; mas madaling maunawaan kaysa sa mas teknikal na “kabanalan.”
- source_word: δι’ ἔργων ἀγαθῶν
  choice: sa pamamagitan ng mabubuting gawa
  rationale: Pinananatili nito ang tahasang ugnayang instrumental ng διά na may genitive, habang ipinahihiwatig ng konteksto na ang mabubuting gawa ang angkop na pagpapaganda.
theological_decisions:
- issue: Ugnayan ng mabubuting gawa at ng pagpapahayag ng paggalang sa Diyos
  choice: Inilalahad ang mabubuting gawa bilang angkop na hayag na pagpapamalas ng mga babaeng nagpapahayag ng paggalang sa Diyos.
  alternative: Ang mabubuting gawa ang batayang nagbibigay-karapatan sa pagtanggap ng Diyos.
  rationale: Ang balarila at konteksto ay naghahambing sa panlabas na palamuti at sa asal na naaayon sa ipinahahayag na debosyon; hindi nagdaragdag ang salin ng pahayag tungkol sa kung paano nakakamit ang kaligtasan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakaugnay nito sa naunang talata sa pamamagitan ng “kundi” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
