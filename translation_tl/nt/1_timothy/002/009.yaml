  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: tl
  text: Gayundin naman, dapat ay maggayak ang mga babae ng kanilang sarili sa maayos na pananamit[a], na may kahinhinan at pagpipigil sa sarili—hindi sa mga tirintas, ginto, perlas, o mamahaling damit[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “angkop na kasuotan” o “mahinhin na pananamit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tirintas, ginto, perlas, o mamahaling damit” ay malamang na tumutukoy sa mapagpasikat at marangyang paggayak, sa halip na ipagbawal ang bawat paggamit ng mga tirintas o alahas sa lahat ng pagkakataon.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Gayundin naman
  rationale: Likas na pariralang Filipino na nagpapanatili sa pag-uugnay at pandagdag na diin ng dalawang salitang Griyego.
- source_word: γυναῖκας
  choice: mga babae
  rationale: Bagaman maaari ring mangahulugang ‘mga asawang babae,’ walang palatandaang pangmag-asawa sa konteksto; mas angkop ang pangkalahatang ‘mga babae.’
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: ng maayos na pananamit
  rationale: Ipinahihiwatig ng καταστολή ang pananamit at ng κόσμιος ang pagiging angkop, maayos, at kagalang-galang. Natural at hindi labis na mapagpakahulugan ang parirala sa modernong Filipino.
- source_word: μετὰ αἰδοῦς
  choice: nang may kahinhinan
  rationale: Ipinapahayag ang maingat na pag-iwas sa di-angkop na pagpapasikat o asal, hindi lamang ang panlabas na anyo.
- source_word: σωφροσύνης
  choice: pagpipigil sa sarili
  rationale: Malinaw na ipinapakita ang matinong pagpapasiya na nahahayag sa pagpipigil, at natural itong katambal ng ‘kahinhinan.’
- source_word: κοσμεῖν ἑαυτάς
  choice: dapat gayakan ... ang kanilang sarili
  rationale: Pinananatili ng ‘gayakan’ ang diwa ng pag-aayos o pagpapaganda at ang kaibahan nito sa kasunod na mapagpasikat na paggayak; ipinahahayag ng ‘dapat’ ang pwersang mapagtagubilin.
- source_word: μὴ ἐν πλέγμασιν
  choice: hindi ng mga tirintas
  rationale: Ang πλέγματα ay mga pagkakatirintas ng buhok, malamang na tumutukoy sa masalimuot na ayos; hindi na idinagdag sa teksto ang interpretasyong ‘mararangya.’
- source_word: χρυσίῳ
  choice: ginto
  rationale: Pinananatili ang malawak na katawagan ng Griyego nang hindi nililimitahan sa isang partikular na uri ng alahas.
- source_word: μαργαρίταις
  choice: mga perlas
  rationale: Tuwirang katumbas at bahagi ng talaan ng mamahaling palamuti.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: mamahaling damit
  rationale: Malinaw at kasalukuyang Filipino para sa kasuotang magastos o marangya.
theological_decisions:
- issue: Kung mga babae sa pangkalahatan o mga asawang babae lamang ang tinutukoy
  choice: mga babae sa pangkalahatan
  alternative: mga asawang babae
  rationale: Maramihan at walang tahasang palatandaang pangmag-asawa ang γυναικας sa konteksto, kaya hindi dapat paliitin ang saklaw nito.
- issue: Kung lubos na ipinagbabawal ang bawat tirintas, ginto, perlas, at mamahaling damit
  choice: Pinananatiling literal sa pangunahing teksto ang pagbabawal, habang ipinapaliwanag sa talababa na malamang na mapagpasikat na paggayak ang puntirya.
  alternative: Lubos na pagbabawal sa paggamit ng alinman sa mga ito sa lahat ng pagkakataon
  rationale: Inihaharap ng sintaks ang kaibahan ng maayos at mapagpigil na paggayak sa pagpapakita ng mamahaling palamuti. Hindi dapat dagdagan ng salin ang teksto, ngunit mahalagang ipabatid ang malamang na puwersang pangkultura nito.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang ‘kahinhinan’ sa diwa ng maingat at angkop na asal, at ang ‘pagpipigil sa sarili’ upang malinaw na maipahayag ang moral at mental na dimensiyon ng σωφροσύνη. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
