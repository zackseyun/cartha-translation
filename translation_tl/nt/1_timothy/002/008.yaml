  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: tl
  text: Kaya nais kong manalangin ang mga lalaki sa bawat lugar, habang itinataas nila ang mga banal na kamay nang walang galit o pakikipagtalo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang walang galit o pag-aalinlangan.” Ang salitang Griyego ay maaaring tumukoy sa panloob na pag-iisip o pag-aalinlangan, ngunit dito ay malamang na tumutukoy sa mapagtunggaling pagtatalo sa kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: nais ko
  rationale: Likas at marangal sa modernong Filipino; pinananatili ang diwa ng kagustuhan na may bigat ng tagubilin.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal na kaugnayan sa naunang talakayan nang natural sa Filipino.
- source_word: προσεύχεσθαι
  choice: manalangin
  rationale: Karaniwang salin ng pandiwang tumutukoy sa pananalangin.
- source_word: τοὺς ἄνδρας
  choice: ang mga lalaki
  rationale: Tiyak na tumutukoy sa mga lalaki, hindi sa lahat ng tao sa pangkalahatan; umaayon ito sa magkaibang tagubilin sa kalapit na konteksto.
- source_word: ἐν παντὶ τόπῳ
  choice: sa bawat lugar
  rationale: Pinananatili ang distributibong diwa ng parirala at nananatiling malinaw sa Filipino.
- source_word: ἐπαίροντας
  choice: na itinataas
  rationale: Inilalarawan ang kilos na kasabay ng pananalangin.
- source_word: ὁσίους χεῖρας
  choice: mga banal na kamay
  rationale: Tuwirang pinananatili ang larawan at ang diwa ng kabanalang kalugud-lugod sa Diyos, sa halip na ipalit ang ibang konsepto gaya ng ritwal na kalinisan.
- source_word: χωρὶς
  choice: nang walang
  rationale: Malinaw na nagpapahayag ng kawalan ng mga sumusunod na saloobin o kilos.
- source_word: ὀργῆς
  choice: galit
  rationale: Natural na modernong salita para sa interpersonal na kontekstong ito.
- source_word: διαλογισμοῦ
  choice: pakikipagtalo
  rationale: Sa pagkakatambal nito sa galit at sa konteksto ng sama-samang pananalangin, malamang na tumutukoy ito sa mapagtunggaling pagtatalo; gayunman, pinananatili sa talababa ang posibleng diwang pag-aalinlangan.
theological_decisions:
- issue: Tiyak na kasarian ng τοὺς ἄνδρας
  choice: ang mga lalaki
  alternative: ang mga tao; ang lahat; ang mga asawang lalaki
  rationale: Ang ἄνδρας ay pinakatumpak na tumutukoy rito sa mga lalaki. Ang gawing pangkalahatan ang salita ay magpapalabo sa pagiging tiyak nito sa konteksto.
- issue: Diwa ng διαλογισμοῦ sa tagubilin tungkol sa panalangin
  choice: pakikipagtalo
  alternative: pagtatalo; pag-aalinlangan
  rationale: Ang panlipunan at mapagtunggaling diwa ang malamang dahil katambal ito ng galit at nakapaloob sa tagubilin sa kapulungan. Hindi lubusang inaalis ang leksikal na posibilidad na tumukoy ito sa panloob na pag-aalinlangan, kaya inilagay iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang kongkretong larawan ng pagtataas ng mga banal na kamay at ang tiyak na pagtukoy sa mga lalaki.
