  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: tl
  text: Ngunit maliligtas siya sa pamamagitan ng panganganak[a][c], kung magpapatuloy sila sa pananampalataya[b], pag-ibig, at kabanalan na may pagpipigil sa sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng pagsilang na iyon.” Nauunawaan ito ng ilan bilang pagtukoy sa isang tiyak na pagsilang, posibleng sa Mesiyas, bagaman maaari ring tumukoy ang parirala sa panganganak sa pangkalahatan.
    reason: alternative_reading
  - marker: b
    text: Ang “pananampalataya” ay maaari ring unawain dito bilang “katapatan.”
    reason: lexical_alternative
  - marker: c
    text: Mula sa isahang “maliligtas siya,” lumilipat ang Griyego sa maramihang “kung magpapatuloy sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Karaniwang ipinahihiwatig ng hinaharap na balintiyak ng σῴζω sa mga sulat ni Pablo ang pagliligtas. Hindi ito nilimitahan sa pisikal na kaligtasan, sapagkat hindi iyon tahasang sinasabi ng talata.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa naunang pahayag; natural at sapat ang “Ngunit” sa Filipino.
- source_word: διὰ τῆς τεκνογονίας
  choice: sa pamamagitan ng panganganak
  rationale: Ang τεκνογονία ay tumutukoy sa panganganak o pag-aanak. Natural sa Filipino ang “sa pamamagitan ng panganganak,” habang pinananatili sa talababa ang posibleng pagtukoy ng artikulo sa isang tiyak na panganganak.
- source_word: ἐὰν
  choice: kung
  rationale: Tuwirang nagpapakilala ang ἐάν ng isang kondisyong sugnay.
- source_word: μείνωσιν
  choice: magpapatuloy sila
  rationale: Sa kondisyong ito, ang μένω ay nagpapahiwatig ng pananatili o pagpapatuloy sa isang kalagayan. Pinananatili rin ng “sila” ang biglang paglipat ng Griyego mula isahan tungong maramihan.
- source_word: ἐν πίστει
  choice: sa pananampalataya
  rationale: Karaniwan at malinaw na katumbas ng πίστις ang “pananampalataya.” Posible rin ang diwang “katapatan,” kaya inilagay iyon sa talababa.
- source_word: ἀγάπῃ
  choice: pag-ibig
  rationale: Karaniwang katumbas ng ἀγάπη at natural sa talaan ng mga katangiang espirituwal.
- source_word: ἁγιασμῷ
  choice: kabanalan
  rationale: Maaaring mangahulugan ang ἁγιασμός ng pagpapabanal o kabanalan. Mas natural at hindi teknikal ang “kabanalan” sa talaang ito ng mga katangian.
- source_word: μετὰ σωφροσύνης
  choice: na may pagpipigil sa sarili
  rationale: Saklaw ng σωφροσύνη ang pagpipigil sa sarili at matinong paghatol. Malinaw sa modernong Filipino ang pariralang ito at angkop sa etikal na diin ng talata.
theological_decisions:
- issue: Paglipat mula sa isahang “maliligtas siya” tungo sa maramihang “kung magpapatuloy sila”
  choice: Pinanatili ang paglipat ng bilang gaya ng nasa Griyego.
  alternative: Gawing maramihan ang dalawang bahagi, gaya ng “maliligtas ang mga babae ... kung magpapatuloy sila,” o unawain ang “siya” bilang si Eva at ang “sila” bilang mga babae sa pangkalahatan.
  rationale: Mahalagang katangian ng teksto ang biglang paglipat mula isahan tungong maramihan. Ang pagpapakinis nito ay magtatago sa tunay na kalabuan tungkol sa tinutukoy ng bawat panghalip.
- issue: Kahulugan ng “maliligtas ... sa pamamagitan ng panganganak”
  choice: Pinanatili ang malawak at hindi nilutas na pariralang “maliligtas ... sa pamamagitan ng panganganak.”
  alternative: “Mailalayo sa kapahamakan sa panganganak,” “maliligtas sa pagtanggap sa tungkulin ng pagiging ina,” o “maliligtas sa pamamagitan ng pagsilang sa Mesiyas.”
  rationale: Hindi tahasang tinutukoy ng Griyego kung espirituwal o pangwakas na kaligtasan ito, pisikal na pag-iingat, o pagtukoy sa isang tiyak na pagsilang. Hindi dapat magpasok ang salin ng isang pinagtatalunang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang isahan-maramihang paglipat at ang interpretatibong tensiyon ng “panganganak,” habang iniwasan ang teknikal o denominasyonal na pagpapaliwanag sa pangunahing teksto.
