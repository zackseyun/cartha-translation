revisions:
- from: Gayundin, ang mga diyakono ay dapat kagalang-galang, hindi pabago-bago ng salita[a], hindi nahuhumaling sa maraming alak[b], at hindi sakim sa kahiya-hiyang pakinabang.[c]
  to: Gayundin, ang mga diyakono ay dapat na kagalang-galang, hindi doble-singaw[a], hindi nagpapakalulong sa labis na pag-inom ng alak[b], at hindi sakim sa kahiya-hiyang pakinabang.[c]
  rationale: Pinalitan ang hindi sapat na tiyak na “pabago-bago ng salita” ng “doble-singaw,” na mas tuwirang tumutukoy sa dalawang-magkaibang pananalita at nilinaw sa talababa. Inayos ang parirala tungkol sa alak upang maging likas sa modernong Filipino at maipahayag ang patuloy na pagkakapit sa labis na pag-inom, habang pinananatili ang modifier na “marami/labis” ng Griyego. Walang idinagdag na doktrinal na pagbasa.
