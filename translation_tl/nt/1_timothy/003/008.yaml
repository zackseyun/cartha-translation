  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: tl
  text: Gayundin, ang mga diyakono ay dapat na kagalang-galang, hindi doble-singaw[a], hindi nagpapakalulong sa labis na pag-inom ng alak[b], at hindi sakim sa kahiya-hiyang pakinabang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nagsasabi ng isang bagay sa isang tao at iba naman sa iba.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi nahuhumaling sa labis na pag-inom ng alak.”
    reason: lexical_alternative
  - marker: c
    text: O “hindi naghahangad ng maruming pakinabang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: mga diyakono
  rationale: Sa konteksto ng mga katangiang hinihingi sa mga kinikilalang tungkulin sa iglesya, tumutukoy ito sa mga diyakono, hindi lamang sa mga lingkod sa pangkalahatan.
- source_word: ὡσαύτως
  choice: Gayundin
  rationale: Likas at maikli itong nag-uugnay sa mga katangiang naunang itinakda para sa mga tagapangasiwa.
- source_word: σεμνούς
  choice: kagalang-galang
  rationale: Ipinahahayag nito ang marangal at kapita-pitagang asal nang hindi nagpapahiwatig ng pagiging mabagsik o laging seryoso.
- source_word: μὴ διλόγους
  choice: hindi pabago-bago ng salita
  rationale: Ipinahahayag nito ang pandarayang pagsasalita—ang pagsasabi ng magkakaibang bagay sa magkakaibang tao—sa natural na makabagong Tagalog.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: hindi nahuhumaling sa maraming alak
  rationale: Pinananatili nito ang diwa ng patuloy na pagkahilig o pagkakapit sa alak at ang tahasang modifier na 'marami,' nang hindi nag-aangkat ng makabagong klinikal na kategorya.
- source_word: μὴ αἰσχροκερδεῖς
  choice: hindi sakim sa kahiya-hiyang pakinabang
  rationale: Pinananatili nito ang parehong kasakiman at ang kahiya-hiya o mababang uri ng pakinabang na tinutukoy ng tambalang salitang Griyego.
theological_decisions:
- issue: Terminong pangtungkulin sa iglesya para sa διάκονος
  choice: Isinalin bilang “mga diyakono,” isang kinikilalang tungkulin
  alternative: mga lingkod; mga tagapaglingkod
  rationale: Ang talata ay bahagi ng talaan ng mga katangian para sa mga kinikilalang tungkulin sa iglesya, kasunod ng mga tagapangasiwa. Pinananatili ng “mga diyakono” ang kontekstong ito nang hindi ipinapasok ang mga estrukturang nabuo sa kalaunang mga denominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang nakikilalang terminong “diyakono” para sa tungkulin sa iglesya; iniwasan ang sobrang literal ngunit di-likas na “dalawang-dila,” habang pinanatili sa talababa ang tiyak na diwa ng pandarayang pananalita.
