  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: tl
  text: Gayundin, ang mga babae[a] ay dapat maging kagalang-galang, hindi mapanirang-puri, mapagpigil sa sarili, at tapat sa lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga asawa.” Ang salitang Griyego na γυναῖκας ay maaaring mangahulugang “mga babae” o “mga asawa” sa kontekstong ito; hindi tahasang sinasabi ng teksto na “kanilang mga asawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: ang mga babae
  rationale: Ang γυνή ay maaaring mangahulugang “babae” o “asawa.” Walang artikulo o tahasang panghalip na “kanilang” sa Griyego, kaya pinanatiling malawak ang pangunahing salin at inilagay sa talababa ang mahalagang alternatibo.
- source_word: ὡσαύτως
  choice: Gayundin
  rationale: Malinaw at likas nitong ipinapakita ang pagkakatulad ng pangkat na ito sa naunang talaan ng mga katangian.
- source_word: σεμνάς
  choice: kagalang-galang
  rationale: Ipinahahayag nito ang marangal, seryoso, at karapat-dapat igalang na asal nang hindi nagiging makaluma.
- source_word: μὴ διαβόλους
  choice: hindi mapanirang-puri
  rationale: Dito, ang διάβολος ay naglalarawan sa taong naninirang-puri o nagbibintang nang masama, hindi tumutukoy sa Diyablo bilang pantanging pangalan.
- source_word: νηφαλίους
  choice: mahinahon
  rationale: Sinasaklaw nito ang pagiging mapagpigil, malinaw mag-isip, at hindi padalos-dalos; natural ito sa modernong Filipino sa isang talaan ng katangian.
- source_word: πιστὰς
  choice: tapat
  rationale: Pinananatili nito ang diwa ng katapatan at pagiging maaasahan na taglay ng πιστός.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Tuwiran nitong pinananatili ang malawak at komprehensibong saklaw ng parirala.
theological_decisions:
- issue: Ang tinutukoy ng γυναῖκας sa talaan ng mga katangian
  choice: mga babae
  alternative: mga asawa
  rationale: Maaaring tumukoy ang teksto sa mga babaeng may kinikilalang paglilingkod o sa mga asawa ng mga lalaking diakono. Dahil maaaring mangahulugang “babae” o “asawa” ang γυνή at walang tahasang “kanilang,” hindi idinagdag ang possessive at pinanatili sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kagalang-galang” sa halip na mas pormal o makalumang pananalita, at pinanatili sa talababa ang tunay na kalabuan ng referent.
