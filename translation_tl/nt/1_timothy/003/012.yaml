  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: tl
  text: Ang mga diyakono ay dapat na mga lalaking may iisang asawa[a] at mahusay na namamahala sa kanilang mga anak at sa sarili nilang sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga lalaking may iisang babae.” Maaaring idiin ng parirala ang katapatan sa pag-aasawa; nauunawaan naman ito ng ilan bilang mas tiyak na pagbabawal sa pagkakaroon ng higit sa isang asawa o sa muling pag-aasawa.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: mga diyakono
  rationale: Sa konteksto ng mga katangian para sa paglilingkod sa iglesya, tumutukoy ito sa kinikilalang tungkulin, hindi lamang sa pangkalahatang kahulugang “mga tagapaglingkod.”
- source_word: ἔστωσαν
  choice: ay dapat na
  rationale: Ipinapahayag ng pautos na anyo ang isang kinakailangang katangian; natural at malinaw itong naihahatid ng “dapat” sa modernong Tagalog.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: mga lalaking may iisang asawa
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang pagtukoy sa mga lalaki, habang hindi tiyak na nilulutas kung ang diin ay katapatan sa asawa, monogamya, o pag-aasawa nang minsan lamang.
- source_word: τέκνων
  choice: kanilang mga anak
  rationale: Bagaman walang tahasang panghalip na paari rito, likas itong ipinahihiwatig ng konstruksyon at nililinaw sa Tagalog ng “kanilang.”
- source_word: καλῶς
  choice: mahusay
  rationale: Natural nitong inilalarawan ang mabuti at wastong paraan ng pamamahala.
- source_word: προϊστάμενοι
  choice: namamahala
  rationale: Ipinahihiwatig ng salita ang responsableng pangangasiwa; ang “namamahala” ay angkop sa konteksto ng sambahayan nang hindi labis na mapang-utos ang himig.
- source_word: τῶν ἰδίων οἴκων
  choice: sa sarili nilang sambahayan
  rationale: Ang οἶκος ay tumutukoy sa buong sambahayan, hindi lamang sa gusaling tinitirhan; pinananatili ng “sambahayan” ang lawak na iyon.
theological_decisions:
- issue: Kahulugan ng μιᾶς γυναικὸς ἄνδρες bilang katangian ng mga diyakono
  choice: mga lalaking may iisang asawa
  alternative: mga lalaking tapat sa kani-kanilang asawa; mga lalaking minsan lamang nag-asawa
  rationale: Maikli at idyomatiko ang pariralang Griyego, at pinagtatalunan kung pangunahing tinutukoy nito ang katapatan sa pag-aasawa, pagbabawal sa poligamya, o pagbabawal sa muling pag-aasawa. Pinananatili ng salin at talababa ang tunay na kalabuan sa halip na magtakda ng isang denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “diyakono” bilang karaniwang katawagan sa kinikilalang tungkulin sa iglesya at “sambahayan” upang saklawin ang pamilya at buong yunit ng tahanan.
