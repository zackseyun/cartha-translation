lexical_decisions:
- source_word: πάροινον
  choice: hindi lasenggo
  rationale: Tumutukoy ito sa taong mahilig o nalululong sa alak bilang nakagawiang asal. Likas at tuwiran sa makabagong Tagalog ang “hindi lasenggo,” nang hindi ipinahihiwatig na ang pag-inom lamang ang tinutukoy.
- source_word: πλήκτην
  choice: hindi marahas
  rationale: Bagaman literal na tumutukoy sa nananakit o nanununtok, ipinapahayag ng “hindi marahas” ang mas malawak na ugaling agresibo habang pinananatili ang pisikal na diwa ng salita.
- source_word: ἐπιεικῆ
  choice: mahinahon
  rationale: Saklaw ng salita ang pagiging banayad, mapagparaya, at makatuwiran. Ang “mahinahon” ay natural sa talaan ng mga katangian at angkop na kasalungat ng marahas at palaaway.
- source_word: ἄμαχον
  choice: hindi palaaway
  rationale: Tahasang inilalarawan nito ang taong hindi mahilig makipag-away o makipagtalo. Mas malinaw sa ordinaryong mambabasa ang “hindi palaaway” kaysa sa mas abstraktong “mapayapa.”
- source_word: ἀφιλάργυρον
  choice: hindi maibigin sa salapi
  rationale: Hayagang itinatanggi ng tambalang Griyego ang pag-ibig sa pilak o salapi. Pinananatili ng salin ang panloob na pagnanasa, hindi lamang ang panlabas na kasakiman.
