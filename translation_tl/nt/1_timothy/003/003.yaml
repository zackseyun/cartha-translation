  text: hindi lasenggo[a], hindi marahas[b], kundi mahinahon, hindi palaaway[c], at hindi maibigin sa salapi[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi lulong sa alak.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi nananakit,” na higit na nagdiriin sa pisikal na karahasan.
