base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: tl
  text: Kailangan din siyang magkaroon ng mabuting patotoo mula sa mga nasa labas[a], upang hindi siya mapahiya at mahulog sa bitag ng diyablo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga tagalabas.” Tumutukoy ito sa mga taong hindi kabilang sa pamayanang Kristiyano.
    reason: lexical_alternative
  - marker: c
    text: O “bitag ng maninirang-puri,” kung ang διάβολος ay inuunawa sa pangkalahatang kahulugan; dito ay isinaling tumutukoy sa diyablo.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: Kailangan din
  rationale: Ipinahahayag ang karagdagang kinakailangang katangian at pinananatili ang puwersa ng obligasyon at pagdaragdag.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: magkaroon ng mabuting patotoo
  rationale: Malapit sa anyo ng Griyego at malinaw na tumutukoy sa mabuting pagpapatunay o ulat tungkol sa kaniya; hindi agad pinapaliit ang kahulugan tungo lamang sa reputasyon.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: mula sa mga nasa labas
  rationale: Pinananatili ang matalinghagang pananalita ng Griyego nang hindi tahasang idinaragdag sa pangunahing teksto ang 'ng iglesya.'
- source_word: ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: upang hindi siya malagay sa kahihiyan
  rationale: Natural sa modernong Tagalog at ipinapahayag ang pagkalantad sa paninisi, paghamak, o pampublikong kahihiyan.
- source_word: παγίδα
  choice: bitag
  rationale: Karaniwan at malinaw na katumbas sa Tagalog na nagpapanatili sa metapora ng isang patibong.
- source_word: τοῦ διαβόλου
  choice: ng diyablo
  rationale: Pinananatili ang genitibong ugnayan at ang pinakakaraniwang personal na pagtukoy ng διάβολος sa Bagong Tipan.
theological_decisions:
- issue: Kahulugan ng τοῦ διαβόλου
  choice: 'ang diyablo bilang personal na masamang nilalang: ''bitag ng diyablo'''
  alternative: ‘bitag ng maninirang-puri,’ kung pangkalahatang pangngalan ang διάβολος
  rationale: Sa mga Liham Pastoral at sa mas malawak na gamit sa Bagong Tipan, ang may artikulong διάβολος ay karaniwang tumutukoy sa diyablo. Gayunman, tunay na posibilidad sa leksikon ang kahulugang 'maninirang-puri,' kaya inilalagay ito sa talababa sa halip na burahin.
- issue: Ugnayan ng ὀνειδισμός at παγίς
  choice: 'dalawang magkaugnay na panganib: kahihiyan at bitag ng diyablo'
  alternative: ang kahihiyan mismo ang bitag ng diyablo
  rationale: Ang καί ay pinananatiling koordinasyon nang hindi ipinapasiya kung ganap na magkahiwalay ang dalawang parirala o kung ang una ay paraan ng ikalawa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'mabuting patotoo' upang manatiling malapit sa μαρτυρίαν καλὴν, at ipinaliwanag sa talababa ang 'mga nasa labas.'
