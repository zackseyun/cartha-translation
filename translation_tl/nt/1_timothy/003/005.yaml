id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: tl
  text: Ngunit kung hindi marunong mamahala[a] ang isang tao sa sarili niyang sambahayan[b], paano niya pangangalagaan[c] ang iglesya ng Diyos[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamuno” o “mangasiwa.”
    reason: lexical_alternative
  - marker: b
    text: O “sarili niyang pamilya” o “sarili niyang tahanan.”
    reason: lexical_alternative
  - marker: c
    text: O “aalagaan” o “aasikasuhin.”
    reason: lexical_alternative
  - marker: d
    text: O “kapulungan ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ngunit kung
  rationale: Likas na ipinahahayag nito sa Tagalog ang kondisyon ng εἰ at ang banayad na pagsalungat ng δέ.
- source_word: τις
  choice: ang isang tao
  rationale: Pinananatili nito ang di-tiyak na pagtukoy sa isang magiging tagapangasiwa nang hindi ginagawang tahasang 'lalaki' ang τις. Ang 'niya' sa Tagalog ay likas na hindi tumutukoy sa kasarian.
- source_word: τοῦ ἰδίου οἴκου
  choice: sa sarili niyang sambahayan
  rationale: Ang οἶκος dito ay tumutukoy sa buong yunit ng tahanan o pamilya na nasa ilalim ng kaniyang pananagutan, hindi lamang sa gusali.
- source_word: προστῆναι
  choice: mamahala
  rationale: Ipinahahayag ng 'mamahala' ang responsable at praktikal na pamumuno sa sambahayan nang hindi nagpapahiwatig ng labis na awtoritaryanismo.
- source_word: οὐκ οἶδεν
  choice: hindi marunong
  rationale: Ang οἶδα na may pawatas ay idyomatikong nangangahulugang hindi alam kung paano gawin ang isang bagay; natural itong ipinahahayag ng 'hindi marunong.'
- source_word: πῶς
  choice: paano niya
  rationale: Pinananatili nito ang retorikal na tanong at ang paghinuha mula sa pamamahala sa sambahayan tungo sa pananagutan sa iglesya.
- source_word: ἐκκλησίας θεοῦ
  choice: ang iglesya ng Diyos
  rationale: Ang 'iglesya ng Diyos' ay malinaw at kinikilalang salin ng eklesyal na gamit ng ἐκκλησία, habang pinananatili ang ugnayang genitibo sa Diyos.
- source_word: ἐπιμελήσεται
  choice: pangangalagaan
  rationale: Binibigyang-diin nito ang maingat at aktibong pagkalinga, at pinananatiling naiiba sa pandiwang ginamit para sa pamamahala ng sambahayan.
theological_decisions:
- issue: Ugnayan ng pamumuno sa sambahayan at pangangasiwa sa iglesya
  choice: Gamitin ang 'mamahala' para sa sambahayan at 'pangangalagaan' para sa iglesya.
  alternative: Gamitin ang 'mamuno' sa dalawang sugnay o ang mas matigas na 'maghari' para sa sambahayan.
  rationale: Magkaiba ang dalawang pandiwang Griyego, προΐστημι at ἐπιμελέομαι. Pinananatili ng salin ang pagkakatulad ng dalawang pananagutan ngunit hindi ginagawang simpleng pamumuno o pagkontrol ang pag-aasikaso sa iglesya.
- issue: Kasarian ng di-tiyak na simuno
  choice: Isalin ang τις bilang 'ang isang tao' at gamitin ang likas na panghalip na 'niya.'
  alternative: Gawing tahasan itong 'isang lalaki' o gumamit ng mas mabigat na paulit-ulit na pangngalan upang tukuyin ang kasarian.
  rationale: Di-tiyak ang τις, at hindi minamarkahan ng Tagalog na 'niya' ang kasarian. Hindi nito itinatanggi ang konteksto ng mga kuwalipikasyon ng tagapangasiwa at hindi rin ito nagdaragdag ng kasariang hindi tahasang nasa mismong salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” upang saklawin ang pamilya at buong yunit ng tahanan; ang “iglesya” ay karaniwang terminong eklesyal, samantalang nasa talababa ang mas literal na alternatibong “kapulungan.”
