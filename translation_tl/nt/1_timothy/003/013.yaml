  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: tl
  text: Sapagkat ang mga naglingkod nang mahusay ay nagkakamit para sa kanilang sarili ng mabuting katayuan at malaking katapangan[a] sa pananampalataya kay Mesiyas na si Jesus.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking kumpiyansa.” Ang salitang Griyego ay maaaring mangahulugang katapangan, kumpiyansa, o malayang pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: O “sa katapatan kay Mesiyas na si Jesus.” Ang salitang Griyego na πίστις ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan.
    reason: alternative_reading
  - marker: c
    text: Sa Griyego, “Cristo”; isinalin ditong “Mesiyas” sapagkat ginagamit ang salita bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: mga naglingkod
  rationale: Ang pandiwa ay nangangahulugang maglingkod. Bagaman tumutukoy ito sa mga tagapaglingkod na tinatalakay sa konteksto, hindi direktang ipinapasok sa pandiwa ang titulo ng katungkulan.
- source_word: καλῶς
  choice: nang mahusay
  rationale: Likas na pang-abay sa modernong Tagalog na nagpapahayag ng mahusay o wastong paraan ng paglilingkod.
- source_word: βαθμὸν ... καλὸν
  choice: marangal na katayuan
  rationale: Metaporikal ang βαθμός, na maaaring tumukoy sa hakbang, antas, o katayuan. Ipinahahayag ng salin ang mabuting pagkilalang natatamo nang hindi nagpapahiwatig ng tiyak na ranggong pansimbahan.
- source_word: περιποιοῦνται
  choice: nagkakamit para sa kanilang sarili
  rationale: Pinananatili nito ang reflexive na puwersa ng middle voice at malinaw na nagsasaad na sila mismo ang nagkakamit ng pakinabang.
- source_word: παρρησίαν
  choice: katapangan
  rationale: Ipinahahayag nito ang malaya at panatag na lakas ng loob; inilalagay sa talababa ang tunay na alternatibong 'kumpiyansa.'
- source_word: πίστει
  choice: pananampalataya
  rationale: Ito ang pinakakaraniwang kahulugan ng πίστις dito, ngunit nananatiling posible ang 'katapatan,' kaya iningatan ang alternatibo sa talababa.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: nakaugnay sa Mesiyas na si Jesus
  rationale: Ipinakikitang inilalarawan ng pariralang may artikulo ang pananampalataya. Ang 'nakaugnay sa' ay natural sa Tagalog at hindi ipinipilit kung lokasyon, pakikipag-isa, o sentro ang eksaktong diin ng ἐν.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Ginagawang malinaw ang kahulugan ng Χριστός bilang titulo sa halip na ituring lamang itong bahagi ng pangalan.
theological_decisions:
- issue: Kahulugan ng πίστις sa ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: pananampalataya
  alternative: katapatan
  rationale: Mas natural sa konteksto ang pananampalatayang nakaugnay sa Mesiyas na si Jesus, ngunit lehitimong kahulugan din ng πίστις ang katapatan; hindi ito tahimik na nilulutas at kaya ay binabanggit sa talababa.
- issue: Diin ng ἐν sa pariralang ἐν Χριστῷ Ἰησοῦ
  choice: nakaugnay sa Mesiyas na si Jesus
  alternative: nasa Mesiyas na si Jesus; sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Pinananatili ng 'nakaugnay sa' ang saklaw ng ugnayang ipinahahayag ng ἐν nang hindi agad nagpapasya sa isang mas makitid na teolohikal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Iniwasan ang sobrang teknikal na 'antas' o 'ranggo' at ang tuwirang paglalagay ng opisyal na titulong 'diyakono' sa pandiwang διακονέω. Ang lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
