  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: tl
  text: 'Mapagkakatiwalaan ang kasabihang ito: Kung sinuman ang naghahangad ng pangangasiwa[a], isang mabuting gawain[b] ang ninanais niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang katungkulan ng isang tagapangasiwa”; ayon sa tradisyon, “pagkaobispo.”
    reason: alternative_reading
  - marker: b
    text: O “isang marangal na tungkulin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Mapagkakatiwalaan ang kasabihang ito
  rationale: Ang pormulang ito sa mga Liham Pastoral ay nagpapakilala ng isang pahayag na maaasahan at karapat-dapat paniwalaan. Mas likas dito ang “kasabihan” kaysa sa literal na “salita.”
- source_word: εἴ τις
  choice: kung sinuman
  rationale: Ang τις ay di-tiyak at pangkalahatan; hindi nito, sa ganang sarili, tahasang nililimitahan ang tinutukoy sa lalaki.
- source_word: ἐπισκοπῆς
  choice: na mangasiwa
  rationale: Ipinahahayag nito ang diwa ng pangangasiwa o pananagutan ng isang tagapangasiwa nang hindi agad ipinapasok ang mas huling teknikal na katawagang pansimbahan.
- source_word: ὀρέγεται
  choice: naghahangad
  rationale: Ipinahahayag ng pandiwa ang pag-abot o taimtim na paghahangad sa isang bagay; natural at positibo sa kontekstong ito ang “naghahangad.”
- source_word: καλοῦ ἔργου
  choice: isang mabuting gawain
  rationale: Pinananatili nito ang karaniwang kahulugan ng καλός at ang diin sa gawain, hindi lamang sa katayuan o titulo.
- source_word: ἐπιθυμεῖ
  choice: ang ninanais niya
  rationale: Direktang isinasalin ang positibong pagnanais at pinananatili ang pagkakatugma nito sa naunang “naghahangad.”
theological_decisions:
- issue: Kung isasalin ang ἐπισκοπῆς gamit ang katawagan ng isang pormal at mas huling katungkulan sa simbahan
  choice: na mangasiwa
  alternative: ang katungkulan ng isang tagapangasiwa; pagka-obispo
  rationale: Mas malawak ang saklaw ng salitang Griyego kaysa sa ilang nabuo nang kaayusang pansimbahan. Iniiwasan ng salin ang pagpasok ng partikular na sistemang denominasyonal habang pinananatili ang kaugnayan nito sa tagapangasiwang tatalakayin sa kasunod na mga talata.
- issue: Kung gagawing tiyak na lalaki ang εἴ τις
  choice: kung sinuman
  alternative: kung ang isang lalaki
  rationale: Pangkalahatan ang di-tiyak na panghalip sa pariralang ito. Hindi dapat ipasok sa mismong parirala ang isang paghihigpit na hindi tahasang taglay ng mga salitang Griyego rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pandiwang “mangasiwa” upang maging natural sa Tagalog at upang maiwasang patigasin ang ἐπισκοπή bilang isang tiyak na katawagang institusyonal. Nanatiling pangkalahatan ang “sinuman,” at ang “niya” ay natural na panghalip na hindi nagtatakda ng kasarian sa modernong Filipino.
