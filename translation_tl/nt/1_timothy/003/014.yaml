lexical_decisions:
- source_word: Ταῦτά
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at tumutukoy sa kalipunan ng mga tagubiling isinusulat.
- source_word: σοι
  choice: sa iyo
  rationale: Likas na katumbas ng datibong tumutukoy sa tatanggap ng liham.
- source_word: γράφω
  choice: Isinusulat ko
  rationale: Ipinahahayag ang kasalukuyang gawaing pagsulat sa paraang natural sa modernong Filipino.
- source_word: ἐλπίζων
  choice: sa pag-asang
  rationale: Natural na ipinapakita ang kasabay na pag-asa o layong kaugnay ng pangunahing pandiwa nang hindi ginagawang tiyak ang inaasahan.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: makapunta sa iyo
  rationale: Ipinahahayag ang paglapit sa kausap; natural ito sa Filipino at hindi dinaragdagan ng ideya ng pananatili o pagdalaw na wala sa mismong parirala.
- source_word: ἐν τάχει
  choice: sa madaling panahon
  rationale: Ang idyoma ay maaaring tumukoy sa pagdating na malapit nang mangyari; pinananatili sa talababa ang alternatibong diwang 'nang mabilis.'
