base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: tl
  text: At ang mga ito rin ay subukin muna; pagkatapos ay maglingkod sila, na walang maipaparatang sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang kapintasan.” Ipinahihiwatig nito na walang makatuwirang paratang laban sa kanila, hindi na sila ay ganap na walang kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ang mga ito rin
  rationale: Pinananatili ang demonstratibong pagtukoy at ang dagdag na diwa ng καὶ ... δὲ; sa konteksto, tumutukoy ito sa mga kandidatong tinatalakay.
- source_word: δοκιμαζέσθωσαν
  choice: subukin
  rationale: Ipinapahayag ang pagsusuri upang matiyak ang pagiging karapat-dapat; ang anyong pautos ay likas na naihahatid ng “ay subukin.”
- source_word: πρῶτον
  choice: muna
  rationale: Likas sa modernong Tagalog at malinaw na nagsasaad na nauuna ang pagsusuri.
- source_word: εἶτα
  choice: pagkatapos
  rationale: Malinaw na minamarkahan ang kasunod na hakbang matapos ang pagsusuri.
- source_word: διακονείτωσαν
  choice: hayaan silang maglingkod bilang mga diakono
  rationale: Ang pandiwa ay literal na “maglingkod,” ngunit ang agarang konteksto ay ang kinikilalang paglilingkod ng mga diakono. Pinananatili ang pandiwang diwa habang nililinaw sa teksto ang kontekstuwal na tungkulin.
- source_word: ἀνέγκλητοι
  choice: walang maipaparatang sa kanila
  rationale: Ipinahihiwatig na walang makatwirang o mapatutunayang paratang laban sa kanila, hindi na sila ay ganap na walang kasalanan.
- source_word: ὄντες
  choice: kung
  rationale: Inihahatid nang natural sa Tagalog ang kalagayan o kundisyong kaakibat ng kanilang paglilingkod, bagaman ang Griyego ay gumagamit ng participle na literal na “habang/nang sila ay.”
theological_decisions:
- issue: Kung ang διακονείτωσαν ay isasalin bilang pangkalahatang “maglingkod” o bilang paglilingkod sa tungkulin ng diakono
  choice: maglingkod bilang mga diakono
  alternative: maglingkod
  rationale: Bagaman pandiwang “maglingkod” lamang ang tahasang nasa Griyego, ang konteksto ng 1 Timoteo 3:8–13 ay tungkol sa mga diakono. Ginagawang malinaw ng salin ang kontekstuwal na gamit nang hindi inaalis ang pangunahing diwa ng paglilingkod; itinatala sa talababa ang mas literal na alternatibo.
- issue: Kung ang ἀνέγκλητοι ay nangangahulugang ganap na walang kasalanan
  choice: walang maipaparatang sa kanila
  alternative: walang kapintasan
  rationale: Ang salita ay tumutukoy sa kawalan ng balidong sakdal o paratang, hindi sa ganap na kawalan ng kasalanan. Iniiwasan ng salin ang pagpapahiwatig ng moral na kasakdalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “subukin muna” at “pagkatapos” para sa malinaw at natural na pagkakasunod-sunod. Ang “walang maipaparatang” ay mas tiyak kaysa “walang kapintasan” at umiiwas sa pahiwatig ng ganap na kawalang-kasalanan.
