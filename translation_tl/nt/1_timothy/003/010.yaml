  terminology: Ang "maglingkod" ang direktang katumbas ng διακονέω. Ang "walang maipaparatang sa kanila" ay angkop para sa ἀνέγκλητοι; ipinaliliwanag ng talababa na hindi ito naghahayag ng ganap na kawalang-kasalanan.
