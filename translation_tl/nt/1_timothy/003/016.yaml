reference: 1 Timothy 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: tl
  text: 'At walang pagsalang dakila ang hiwaga ng makadiyos na pamumuhay:


    Siya[a] ay nahayag sa laman,

    pinatunayang matuwid sa espiritu[b],

    nakita ng mga anghel,

    ipinangaral sa mga bansa[c],

    sinampalatayanan sa sanlibutan,

    iniakyat sa kaluwalhatian.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskritong nagsasabing, “Ang Diyos ay nahayag sa laman,” sa halip na “Siya ay nahayag sa laman.” Ang kritikal na tekstong Griyego ay kababasahan ng panlalaking panghalip na paugnay, na maaaring isaling “na siyang” o, ayon sa daloy ng pangungusap, “siya”; ito ang sinunod dito.
    reason: textual_variant
  - marker: b
    text: 'Maaari ring isalin na “pinatunayang matuwid sa pamamagitan ng Espiritu” o “pinatunayang matuwid sa Espiritu.” Maikli at maaaring unawain sa higit sa isang paraan ang pariralang Griyego: maaaring tumukoy ito sa pagkilos ng Espiritu Santo o sa espirituwal na larangan o kalagayan.'
    reason: alternative_reading
  - marker: c
    text: O, “ipinangaral sa mga Hentil.”
    reason: lexical_alternative
  - marker: d
    text: O, “iniakyat nang may kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: hindi maikakaila
  rationale: Ipinahahayag nito na ang bagay ay hayagang kinikilala o inaamin ng lahat, sa natural at dignified na modernong Tagalog.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: ang hiwaga ng maka-Diyos na pamumuhay
  rationale: Pinananatili ng “hiwaga” ang diwang Paulino ng katotohanang dating nakakubli ngunit nahayag; ipinahahayag naman ng “maka-Diyos na pamumuhay” ang εὐσέβεια bilang debosyon at buhay na nakatuon sa Diyos, hindi lamang relihiyon bilang institusyon.
- source_word: Ὃς
  choice: Siya
  rationale: Ang kritikal na tekstong Griyego ay may panlalaking panghalip na tumutukoy sa isang persona. Natural na ipinagpapatuloy ng “Siya” ang mala-himnong pagpapahayag tungkol kay Cristo nang hindi pinapalitan ang pagbasa ng tekstong pinagmulan ng “Diyos.”
- source_word: ἐφανερώθη ἐν σαρκί
  choice: nahayag sa laman
  rationale: Ang “nahayag” ay malinaw at natural na katumbas ng pasibong pandiwang tumutukoy sa pagpapakita o pagsisiwalat; pinananatili ng “sa laman” ang maikli at kongkretong pagtukoy sa tunay na buhay bilang tao.
- source_word: ἐδικαιώθη
  choice: pinatunayang matuwid
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagpapatunay o paghayag na siya ay nasa tama, hindi sa paggawa sa kanya na matuwid. Mas madaling maunawaan ito kaysa sa teknikal na “inaring-ganap.”
- source_word: ἐν πνεύματι
  choice: sa espiritu
  rationale: Pinananatili ng maliit na titik at payak na parirala ang pagiging malabo ng Griyego kung ang tinutukoy ay ang Espiritu Santo bilang gumagawa o ang espirituwal na larangan o kalagayan.
- source_word: ὤφθη ἀγγέλοις
  choice: nakita ng mga anghel
  rationale: Pinananatili ang pasibong anyo at ang malamang na pagtukoy sa mga makalangit na anghel.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: ipinangaral sa mga bansa
  rationale: Ang “ipinangaral” ay angkop sa pampublikong pagpapahayag ng mensahe; ang “mga bansa” ay mas malawak kaysa “mga Hentil” ngunit maaari pa ring saklawin ang kahulugang iyon.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: sinampalatayanan sa sanlibutan
  rationale: Ipinananatili ang pasibong pagkakabuo at nililinaw na ang persona mismo ang pinaglagakan ng pananampalataya. Ang “sanlibutan” ay dignified at karaniwang bokabularyong biblikal.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: itinaas sa kaluwalhatian
  rationale: Natural nitong ipinahahayag ang pag-akyat o pagtanggap sa itaas habang pinananatili ang kaugnayan nito sa kaluwalhatian.
theological_decisions:
- issue: 'Pagkakaiba ng mga manuskrito sa simula ng mala-himnong bahagi: Ὃς, θεός, o ὅ'
  choice: Isinalin ang kritikal na pagbasa na Ὃς bilang “Siya.”
  alternative: “Ang Diyos ay nahayag sa laman” o “na nahayag sa laman.”
  rationale: Ὃς ang teksto ng SBLGNT at tumutukoy sa isang panlalaking persona. Malinaw na si Cristo ang tinutukoy sa konteksto, ngunit hindi dapat ipasok sa pangunahing teksto ang makasaysayang alternatibong pagbasa na θεός; inilalahad ito sa talababa para sa katapatan sa kasaysayan ng teksto.
- issue: Tinutukoy ng ἐν πνεύματι
  choice: Isinalin nang hindi tiyak bilang “sa espiritu.”
  alternative: “sa pamamagitan ng Espiritu” o “sa Espiritu.”
  rationale: Maaaring tukuyin ng maikling parirala ang pagkilos ng Espiritu Santo o ang espirituwal na kalagayan o larangan na kabaligtaran ng “laman.” Hindi nilulutas ng salin ang tunay na gramatikal at teolohikal na kalabuan.
- issue: Kahulugan ng ἐν δόξῃ
  choice: “itinaas sa kaluwalhatian”
  alternative: “itinaas nang may kaluwalhatian”
  rationale: Maaaring ipahiwatig ng ἐν ang kalagayan o larangan ng kaluwalhatian, samantalang maaaring unawain ng Tagalog na “sa” ang patutunguhan. Inilalahad ang alternatibo upang huwag itago ang saklaw ng maikling pariralang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan, na may bahagyang mala-himnong ritmo at magkakatulad na pasibong linya. Ginamit ang “sanlibutan” bilang pamilyar na salitang biblikal; iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang mga tunay na kalabuan sa teksto at mahalagang pagkakaiba ng mga manuskrito ay pinanatili sa pangunahing salin at mga talababa.
