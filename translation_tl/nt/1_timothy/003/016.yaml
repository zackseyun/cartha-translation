  to: 'At walang pagsalang dakila ang hiwaga ng makadiyos na pamumuhay:


    Siya[a] ay nahayag sa laman,

    pinatunayang matuwid sa espiritu[b],

    nakita ng mga anghel,

    ipinangaral sa mga bansa[c],

    sinampalatayanan sa sanlibutan,

    iniakyat sa kaluwalhatian.[d]'
  rationale: Inayos ang pambungad para sa mas natural na modernong Tagalog, ginawang “makadiyos” ang karaniwang baybay, at pinalitan ang “itinaas” ng “iniakyat” upang mas tapat na maipahayag ang ἀνελήμφθη. Nilinaw rin ang talababa tungkol sa Ὃς nang hindi binabago ang kritikal na pagbasa o nilulutas ang tekstuwal na variant. Napanatili ang lahat ng mahalagang kalabuan at mga angkla ng talababa.
