base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: tl
  text: na mahusay na namamahala sa sarili niyang sambahayan[a], at may mga anak na nagpapasakop[b] nang may buong dignidad[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahusay na namumuno sa sarili niyang sambahayan” o “mahusay na namumuno sa sarili niyang pamilya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na ang mga anak ay nasa pagpapasakop” o “na pinananatiling masunurin ang kanyang mga anak.”
    reason: lexical_alternative
  - marker: c
    text: Ang “nang may buong dignidad” ay maaaring maglarawan sa paraan ng pagpapasakop ng mga anak o, sa mas malawak na diwa, sa paraan ng kanyang pamamahala sa sambahayan.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: sa sarili niyang sambahayan
  rationale: Ang οἶκος ay maaaring tumukoy sa bahay o sa sambahayan/pamilya. Sa konteksto ng pangangasiwa, malinaw at likas na ipinahihiwatig ng “sambahayan” ang mga taong nasa tahanan at ang buhay-pamilyang nasa kanyang pananagutan; pinananatili naman ng “sarili niyang” ang diin ng ἰδίου.
- source_word: καλῶς
  choice: mahusay
  rationale: Ipinapahayag nito na ang pangangasiwa ay ginagawa nang mabuti, wasto, at may kakayahan. Likas sa modernong Filipino ang “mahusay na namamahala.”
- source_word: προϊστάμενον
  choice: namamahala
  rationale: Saklaw ng pandiwa ang pamumuno at responsableng pangangasiwa. Ang “namamahala” ay nagpapahayag ng tunay na awtoridad nang hindi nagdaragdag ng malupit o makalumang himig ng “naghahari.”
- source_word: τέκνα ἔχοντα
  choice: may mga anak
  rationale: Malapit ito sa literal na anyo ng participial phrase at natural sa Filipino. Inuugnay nito ang kalagayan ng mga anak sa mahusay na pamamahala sa sambahayan.
- source_word: ἐν ὑποταγῇ
  choice: na nagpapasakop
  rationale: Pinananatili ng “nagpapasakop” ang diwa ng ὑποταγή bilang pagkilala at pagtalima sa nararapat na kaayusan, sa halip na paliitin ito sa panlabas na pagkontrol lamang.
- source_word: μετὰ πάσης σεμνότητος
  choice: nang may buong dignidad
  rationale: Ang σεμνότης ay tumutukoy sa dignidad, kagalang-galang na asal, o marangal na pagkilos. Ang pariralang ito ay maikli at tuwiran, at hindi lubusang nilulutas kung pangunahing inilalarawan nito ang pagpapasakop ng mga anak o ang pangkalahatang pamamahala sa sambahayan.
theological_decisions:
- issue: Saklaw ng pamumuno sa sambahayan
  choice: Inilalarawan ng talata ang responsable at tunay na pangangasiwa ng isang magiging tagapangasiwa sa sarili niyang sambahayan.
  alternative: Maaaring idiin ang mas matigas na “pamumuno” o “paghahari,” o kaya nama’y pahinain ito bilang pag-aaruga lamang.
  rationale: Nagpapahiwatig ang προϊστάμενον at ὑποταγή ng awtoridad at maayos na kaayusan, ngunit kwalipikasyon para sa tagapangasiwa ang paksa ng talata, hindi isang ganap na paglalahad ng doktrina tungkol sa lahat ng ugnayan sa pamilya.
- issue: Tinutukoy ng “nang may buong dignidad”
  choice: Pinanatili sa pangunahing teksto ang parirala nang hindi tahasang nililimitahan ang kaugnayan nito sa mga anak o sa ama.
  alternative: Maaari itong pangunahing tumukoy sa marangal na pagpapasakop ng mga anak, o sa marangal na paraan ng pamamahala ng ama sa buong sambahayan.
  rationale: May sintaktikong kalabuan sa Griyego. Ang salin at talababa ay nagpapanatili sa dalawang makatwirang pagbasa sa halip na pumili nang walang katiyakan.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “sambahayan,” “namamahala,” at “nagpapasakop” upang mapanatili ang pormal at etikal na bigat ng Griyego nang hindi maging makaluma o labis na mapang-utos. Ang panimulang “na” at pangwakas na tuldok-kuwit ay nagpapanatili sa ugnayan ng talata sa nakapaligid na pangungusap.
