id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: tl
  text: Kaya, ang tagapangasiwa ay kailangang walang maipipintas sa kanya, asawang lalaki ng iisang babae[a], malinaw mag-isip, may pagpipigil sa sarili, kagalang-galang, mapagpatuloy sa mga panauhin, at may kakayahang magturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking tapat sa iisang babae.” Maaaring ang diin ng parirala ay katapatan sa pag-aasawa, at hindi lamang ang katayuang pangmag-asawa.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: kailangang
  rationale: Malinaw na nagpapahayag ng kinakailangan, hindi lamang ng payo.
- source_word: οὖν
  choice: Kaya
  rationale: Natural na ipinakikita sa modernong Tagalog ang lohikal na kaugnayan sa naunang sinabi.
- source_word: ἐπίσκοπον
  choice: tagapangasiwa
  rationale: Isinasalin ang tungkulin ayon sa kahulugan at iniiwasang ipasok ang mas huling katawagang pansimbahan na “obispo.”
- source_word: ἀνεπίλημπτον
  choice: walang maipipintas sa kanya
  rationale: Ipinahihiwatig na walang makatuwirang paratang na maihaharap laban sa kanya, nang hindi ipinapalagay na ganap siyang walang kasalanan.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: asawa ng iisang babae
  rationale: Malapit sa anyong Griyego, pinananatili ang panlalaking pagtukoy at hindi nilulutas sa pangunahing teksto kung ang diin ay katapatan sa asawa, monogamya, o katayuang pangmag-asawa.
- source_word: νηφάλιον
  choice: mahinahon
  rationale: Ipinahahayag ang pagiging alerto at mapagpigil sa pag-iisip at asal, hindi lamang ang literal na hindi pagkalasing.
- source_word: σώφρονα
  choice: may pagpipigil sa sarili
  rationale: Ipinakikita ang disiplinadong paghatol at pagkilos at naihihiwalay sa naunang katangiang mahinahon.
- source_word: κόσμιον
  choice: kagalang-galang
  rationale: Natural na tumutukoy sa maayos at nararapat na asal na karapat-dapat igalang.
- source_word: φιλόξενον
  choice: mapagpatuloy sa mga panauhin
  rationale: Malinaw na ipinahahayag ang bukas-palad na pagtanggap sa mga panauhin at estranghero.
- source_word: διδακτικόν
  choice: may kakayahang magturo
  rationale: Ipinahahayag ang kakayahan at kaangkupan sa pagtuturo, hindi lamang ang kahandaang gawin ito.
theological_decisions:
- issue: Kahulugan ng μιᾶς γυναικὸς ἄνδρα bilang kuwalipikasyon ng tagapangasiwa
  choice: asawa ng iisang babae
  alternative: lalaking tapat sa iisang babae
  rationale: Pinananatili ng pangunahing teksto ang pormal at sadyang bukas na pananalita ng Griyego. Maaaring idiin ng parirala ang katapatan sa asawa, ang pagkakaroon ng iisang asawa, o ibang limitasyon sa katayuang pangmag-asawa; hindi pinipili ng salin ang isa lamang sa mga iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapangasiwa” sa halip na “obispo” upang isalin ang tungkulin ayon sa kahulugan. Inilipat ang tandang [a] sa mismong pariralang tinutukoy ng talababa.
