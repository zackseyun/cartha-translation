id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: tl
  text: Ngunit kung maantala ako, isinusulat ko ang mga ito upang malaman mo kung paano dapat kumilos sa sambahayan ng Diyos, na siyang kapulungan[a] ng buhay na Diyos, ang haligi at sandigan[b] ng katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iglesia” o “kongregasyon.”
    reason: lexical_alternative
  - marker: b
    text: O “salalayan” o “muog”; iminungkahi rin ang “saligan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: maantala ako
  rationale: Ipinahihiwatig ng pandiwa rito na maaaring maudlot o mahuli ang pagdating ni Pablo, hindi na mabagal siya bilang katangian.
- source_word: ἵνα εἰδῇς
  choice: upang malaman mo
  rationale: Likas nitong ipinahahayag sa Tagalog ang layunin ng pagsulat.
- source_word: δεῖ
  choice: dapat
  rationale: Pinananatili nito ang diwa ng kinakailangan o wastong asal nang hindi labis na pinatitindi ang pahayag.
- source_word: ἐν οἴκῳ θεοῦ
  choice: sa sambahayan ng Diyos
  rationale: Maaaring tumukoy ang οἶκος sa pamilya o sambahayan, hindi lamang sa gusali; pinagtitibay ito ng kasunod na pagtukoy sa kapulungan.
- source_word: ἀναστρέφεσθαι
  choice: kumilos
  rationale: Sa konteksto, tumutukoy ito sa asal o paraan ng pamumuhay. Ang pagkakaltas ng tahasang simuno sa Tagalog ay nagpapanatili sa pagiging di-tiyak ng Griyegong pawatas kung si Timoteo ba o ang sinuman sa kapulungan ang tinutukoy.
- source_word: ἥτις
  choice: na siyang
  rationale: Malinaw nitong ipinakikilalang ang sambahayan ng Diyos ay ang kapulungan, habang nananatiling natural sa Tagalog.
- source_word: ἐκκλησία
  choice: kapulungan
  rationale: Itinatampok nito ang mga taong tinipon bilang bayan ng Diyos at iniiwasang ipakahulugan ang salita bilang isang gusali.
- source_word: θεοῦ ζῶντος
  choice: ng Diyos na buhay
  rationale: Direkta at likas na katumbas ito ng pariralang Griyego at pinananatili ang diin na ang Diyos ay buhay.
- source_word: στῦλος
  choice: haligi
  rationale: Pinananatili nito ang malinaw na larawang pang-arkitektura ng Griyego.
- source_word: ἑδραίωμα
  choice: sandigan
  rationale: Ipinahahayag nito ang nagbibigay-katatagan o suporta nang hindi tiyakang nilulutas ang lawak ng bihirang salitang Griyego.
- source_word: τῆς ἀληθείας
  choice: ng katotohanan
  rationale: Likas nitong tinutukoy sa Tagalog ang tiyak na katotohanang tinutukoy sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa ἐκκλησία sa kontekstong eklesiyal
  choice: kapulungan
  alternative: iglesia; kongregasyon
  rationale: Inuuna ng “kapulungan” ang diwa ng mga taong tinipon ng Diyos at hindi ang gusali o isang partikular na institusyong denominasyonal. Inilalagay sa talababa ang tradisyonal na salin.
- issue: Ang kapulungan bilang “haligi at ἑδραίωμα ng katotohanan”
  choice: haligi at sandigan ng katotohanan
  alternative: haligi at salalayan, muog, o saligan ng katotohanan
  rationale: Tahasang iniuugnay ng sintaks ang mataas na paglalarawang ito sa kapulungan. Pinananatili ng “sandigan” ang diwa ng pagpapatatag o pagsuporta nang hindi ipinahihiwatig na ang kapulungan ang pinagmulan ng katotohanan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sambahayan” at “kapulungan” upang malinaw na mga tao, hindi gusali, ang tinutukoy. Ang “isinusulat ko ang mga ito” ay likas na ipinagpapatuloy ang pandiwa at layon mula sa naunang talata, gaya ng hinihingi ng ἵνα-clause sa konteksto.
