translation:
  language: tl
  text: Dapat nilang panghawakan ang hiwaga ng pananampalataya nang may malinis na budhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Dapat nilang taglayin ang hiwaga ng pananampalataya nang may dalisay na budhi.”
    reason: Ipinapakita ang mas literal na mga alternatibo para sa ἔχοντας at καθαρᾷ nang hindi binabago ang diwa; pinananatili ng “nang may” na ang budhi ay tumutukoy sa mga tagapaglingkod, hindi sa hiwaga.
lexical_decisions:
- source_word: ἔχοντας
  choice: Dapat nilang panghawakan
  rationale: Ang kasalukuyang aktibong participle ay tumutukoy sa mga tagapaglingkod na binabanggit sa naunang talata. Ipinahihiwatig ng “panghawakan” ang patuloy at matatag na pag-iingat o pagsunod, samantalang ang “dapat nilang” ay likas na nag-uugnay sa anyong pangkwalipikasyon ng konteksto.
- source_word: μυστήριον
  choice: hiwaga
  rationale: Pinananatili ng “hiwaga” ang gamit ni Pablo para sa katotohanang mula sa Diyos na dating nakakubli at nahayag na, nang hindi isinisiksik ang paliwanag sa mismong teksto.
- source_word: τῆς πίστεως
  choice: ng pananampalataya
  rationale: Malamang na tumutukoy ito sa nilalaman ng pananampalatayang Kristiyano, ngunit hindi nilalagyan ng “Kristiyano” upang mapanatili ang posibleng lawak at tensiyon ng parirala sa Griyego.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: nang may malinis na budhi
  rationale: Ang “may” ay likas na katumbas sa Filipino sa ganitong moral na gamit ng ἐν. Ang “malinis na budhi” ay malinaw, kasalukuyan, at marangal na pananalita para sa καθαρὰ συνείδησις.
theological_decisions:
- issue: Kahulugan ng τῆς πίστεως
  choice: “ng pananampalataya,” na malamang ay tumutukoy sa nilalaman ng pinaniniwalaang mensaheng Kristiyano
  alternative: ang pansariling pagsampalataya o katapatan
  rationale: Sa konteksto ng mga kwalipikasyon ng mga tagapaglingkod, pinakamalamang ang obhetibong kahulugan—ang pananampalatayang kanilang pinanghahawakan. Gayunman, hindi ito pinalawak sa salin upang hindi lubusang alisin ang likas na saklaw ng πίστις.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “budhi” bilang karaniwang terminong moral at ang “panghawakan” upang ipahayag ang patuloy na katapatan sa pinaniniwalaan.
