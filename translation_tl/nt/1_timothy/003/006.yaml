base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: tl
  text: Hindi siya dapat isang taong kamakailan lamang sumampalataya, upang hindi siya maging palalo at mahulog sa hatol ng diyablo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahatulan gaya ng diyablo”; o “mapasailalim sa hatol na may kaugnayan sa diyablo.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: bagong sumampalataya
  rationale: Literal itong nangangahulugang ‘bagong tanim,’ ngunit metaporikal na tumutukoy sa isang taong kamakailan lamang yumakap sa pananampalataya. Malinaw at natural sa modernong Tagalog ang ‘bagong sumampalataya.’
- source_word: τυφωθεὶς
  choice: magmataas
  rationale: Ipinahihiwatig ng pandiwa ang pagiging palalo o labis na mataas ang tingin sa sarili. Natural at marangal ang ‘magmataas’ nang hindi gumagamit ng kolokyal na idyoma.
- source_word: κρίμα
  choice: hatol
  rationale: Maaaring tumukoy ang κρίμα sa paghatol o kaparusahan. Pinananatili ng ‘hatol’ ang mas malawak na diwa at hindi agad nilulutas kung anong uri ng hatol ang tinutukoy.
- source_word: τοῦ διαβόλου
  choice: ng diyablo
  rationale: Sadyang hindi tiyak ang gamit ng genitive sa Griyego. Pinananatili ng ‘ng diyablo’ ang posibilidad na ito ang hatol na sinapit ng diyablo o isang hatol na may kaugnayan sa diyablo.
- source_word: ἐμπέσῃ
  choice: mahulog sa
  rationale: Pinananatili nito ang metapora ng pagpasok o pagkasadlak sa isang mapanganib na kalagayan o kahihinatnan.
- source_word: ἵνα μὴ
  choice: upang hindi siya
  rationale: Malinaw nitong ipinahahayag sa kasalukuyang Tagalog ang layunin o inaasahang pag-iwas sa resulta.
theological_decisions:
- issue: Kahulugan ng pariralang εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: mahulog sa hatol ng diyablo
  alternative: mahatulan gaya ng diyablo; mapasailalim sa hatol na may kaugnayan sa diyablo
  rationale: Maaaring unawain ang τοῦ διαβόλου bilang hatol na sinapit ng diyablo o bilang hatol na may kaugnayan sa kanya. Hindi nilulutas ng pangunahing salin ang tunay na kalabuan ng Griyego; inilalahad sa talababa ang mahahalagang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang mas kolokyal na ‘lumaki ang ulo’ at ang arkaikong pananalita. Inilagay ang pananda ng talababa sa pariralang talagang may kalabuan.
