base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: tl
  text: Huwag kang magmadaling magpatong ng mga kamay sa sinuman[a], ni makibahagi sa mga kasalanan ng iba. Panatilihin mong dalisay ang iyong sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak sa kontekstong ito, “Huwag kang magmadaling humirang o magtalaga ng sinuman.” Literal na sinasabi ng Griyego na “magpatong ng mga kamay,” isang idyomang madalas iugnay sa pagtatalaga o pagkilala sa isang tao para sa ministeryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: magpatong ... ng mga kamay
  rationale: Pinananatili nito ang literal na idyomang Griyego at hindi ito pinakikitid sa tahasang ‘humirang’ o ‘ordinahan,’ bagaman malamang na tumutukoy ito sa pagkilala o pagtatalaga sa ministeryo sa konteksto.
- source_word: ταχέως
  choice: agad
  rationale: Sa pautos na may pagbabawal, ipinahihiwatig ng ‘huwag ... agad’ ang padalos-dalos o wala-sa-panahong pagkilos, at natural ito sa makabagong Tagalog.
- source_word: μηδενὶ
  choice: sa sinuman
  rationale: Pinananatili ang pangkalahatang saklaw ng pagbabawal sa natural na anyong Tagalog.
- source_word: μηδὲ κοινώνει
  choice: ni makibahagi
  rationale: Ipinahahayag nito ang pakikilahok o pagkakasangkot sa kasalanan ng iba nang hindi nililimitahan sa pakikisama lamang.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: sa mga kasalanan ng iba
  rationale: Malinaw at natural na ipinapahayag ang mga kasalanang nauukol sa ibang tao.
- source_word: σεαυτὸν
  choice: ang iyong sarili
  rationale: Tuwirang katumbas ng reflexive pronoun at malinaw ang personal na pananagutan.
- source_word: ἁγνὸν
  choice: dalisay
  rationale: Tumutukoy sa malawak na kadalisayang moral; hindi ito pinakikitid sa kalinisang seksuwal lamang.
- source_word: τήρει
  choice: Panatilihin
  rationale: Naipahahayag ang patuloy na pag-iingat o pagpapanatili sa isang kalagayan.
theological_decisions:
- issue: Kahulugan ng pagpapatong ng mga kamay sa konteksto
  choice: Panatilihin ang idyomang ‘magpatong ng mga kamay’ nang hindi tahasang tinutukoy na ordinasyon.
  alternative: ‘Huwag kang humirang/ordinahan agad ng sinuman.’
  rationale: Ang konteksto ay may kinalaman sa mga matatanda sa iglesya at pananagutan, kaya maaaring tumukoy ito sa pagkilala o pagtatalaga sa ministeryo. Gayunman, idyoma mismo ang ginamit ng Griyego, hindi isang tahasang pandiwa para sa paghirang; kaya iniiwasang magtakda ng mas makitid na pamamaraang eklesiyastiko kaysa sa sinasabi ng teksto.
- issue: Ugnayan ng dalawang pagbabawal
  choice: Panatilihing malawak ang babala laban sa pakikibahagi sa mga kasalanan ng iba.
  alternative: Gawing tahasan na ang padalos-dalos na pagtatalaga ang dahilan ng pakikibahagi sa pagkakasala ng iba.
  rationale: Maaaring ipinahihiwatig ng magkasunod na sugnay na ang padalos-dalos na pagpapatong ng mga kamay ay nagdudulot ng pagkakasangkot sa kasalanan ng iba, ngunit hindi tahasang binabanggit ng Griyego ang eksaktong ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang biblikal na idyoma ngunit ipinaliwanag sa talababa ang malamang na kontekstuwal na kahulugan. Ginamit ang ‘dalisay’ upang panatilihin ang malawak na diwa ng moral na kadalisayan.
