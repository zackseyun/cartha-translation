  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: tl
  text: Huwag mong sawayin ang isang nakatatandang lalaki[a]; sa halip, pakiusapan mo siya na parang ama, at ang mga nakababatang lalaki na parang mga kapatid na lalaki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag mong sawayin nang matindi ang isang elder.” Ang salitang Griyego ay maaaring mangahulugang “nakatatandang lalaki” o “elder/pinuno ng iglesya,” ngunit sa kontekstong ito, ang paghahambing sa mga nakababatang lalaki ay pumapabor sa “nakatatandang lalaki.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: isang nakatatandang lalaki
  rationale: Ang pang-uri ay ginamit bilang pangngalan at malinaw na inihahambing sa νεωτέρους (“mga nakababatang lalaki”). Ang kasunod na paghahati ayon sa edad at kasarian ay pumapabor sa kahulugang nakabatay sa edad, habang pinananatili sa talababa ang posibleng kahulugang tungkulin sa iglesya.
- source_word: μὴ ἐπιπλήξῃς
  choice: Huwag mong sawayin
  rationale: Ang “sawayin” ay likas at tuwirang Filipino para sa pasalitang pagpuna o pagsita. Hindi na idinagdag sa pangunahing teksto ang “nang matindi” upang hindi labis na tukuyin ang antas, bagaman posible ang gayong diin.
- source_word: ἀλλὰ παρακάλει
  choice: sa halip, pakiusapan mo siya
  rationale: Sa pagsalungat sa pagsaway at sa paghahambing sa isang ama, ipinahahayag ng “pakiusapan” ang magalang at malapit na paraan ng paghimok. Ang “siya” ay tahasang inilagay para sa linaw bagaman ipinahihiwatig lamang sa Griyego.
- source_word: ὡς πατέρα
  choice: na parang ama
  rationale: Natural na ipinahahayag ng “na parang” ang paghahambing na dala ng ὡς.
- source_word: νεωτέρους
  choice: mga nakababatang lalaki
  rationale: Pinananatili nito ang panlalaking maramihan at ang kaibahan sa nakatatandang lalaki; sa kasunod na talata, hiwalay na tinutukoy ang mga babae.
- source_word: ὡς ἀδελφούς
  choice: na parang mga kapatid
  rationale: Sa Filipino, karaniwang tumutukoy ang “mga kapatid” sa magkakapatid na lalaki o sa grupong tinukoy na bilang mga lalaki. Dahil tahasang “mga nakababatang lalaki” ang nauuna, malinaw ang panlalaking saklaw nang hindi gumagamit ng mas mabigat na “mga kapatid na lalaki.”
theological_decisions:
- issue: Kung ang Πρεσβυτέρῳ ay tumutukoy sa isang nakatatandang lalaki o sa may tungkuling elder sa iglesya
  choice: nakatatandang lalaki
  alternative: matanda o tagapanguna sa iglesya
  rationale: 'Binubuo ng talata at ng kasunod nito ang magkakatugmang pangkat ayon sa edad at kasarian: nakatatandang lalaki/ama, nakababatang lalaki/mga kapatid, nakatatandang babae/mga ina, at nakababatang babae/mga kapatid. Kaya mas malamang ang kahulugang nakabatay sa edad, ngunit tunay na posible sa salita ang kahulugang may tungkulin sa iglesya at pinananatili iyon sa talababa.'
- issue: Kung gagawing tahasang “mga kapatid na lalaki” ang ἀδελφούς
  choice: mga kapatid, na ang tinutukoy ay nililinaw ng “mga nakababatang lalaki”
  alternative: mga kapatid na lalaki
  rationale: Hindi ginawang inklusibo ang tinutukoy; ang mismong naunang parirala ang naglilimita rito sa mga lalaki. Ang mas natural na “mga kapatid” ay sapat sa Filipino at hindi nagdaragdag ng babae sa saklaw.
translation_notes:
  register: Makabago, magalang, at madaling maunawaang Filipino. Ginamit ang “nakatatandang” sa halip na “matandang” sa pangunahing teksto upang maging natural at magalang. Inulit ang “Pakiusapan mo” sa ikalawang sugnay upang maging malinaw sa Filipino ang pandiwang ipinahihiwatig lamang sa Griyego.
