  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: tl
  text: Kaya nais kong ang mga nakababatang biyuda ay mag-asawa[a], magkaanak, mamahala sa kanilang sambahayan, at huwag bigyan ang kalaban[b] ng anumang pagkakataong manirang-puri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay nagsasabi lamang na “mag-asawa.” Dahil mga biyuda ang tinutukoy, ipinahihiwatig ng konteksto ang muling pag-aasawa.
    reason: lexical_alternative
  - marker: b
    text: O “ang kaaway”; posibleng tumutukoy kay Satanas.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: nais kong
  rationale: Likas at marangal na Filipino ito para sa personal na hangarin o pasiya ni Pablo, nang hindi pinahihina ang puwersang volitional ng pandiwa.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw nitong ipinahihiwatig ang kongklusyon o praktikal na bunga ng naunang talakayan, at mas natural ito sa kasalukuyang Filipino kaysa sa mas pormal na “Samakatuwid.”
- source_word: νεωτέρας
  choice: mga nakababatang biyuda
  rationale: Ang pang-uri ay literal na “mga nakababatang [babae],” ngunit ang agarang konteksto ay tungkol sa mga biyuda; kailangang punan ang ipinahihiwatig na pangngalan sa Filipino.
- source_word: γαμεῖν
  choice: mag-asawa
  rationale: Karaniwang kahulugan nito ang “mag-asawa.” Hindi tahasang sinasabi ng pandiwang Griyego ang “muling,” bagaman muling pag-aasawa ang ipinahihiwatig ng konteksto dahil mga biyuda ang tinutukoy.
- source_word: τεκνογονεῖν
  choice: magkaanak
  rationale: Natural na Filipino itong nagpapahayag ng panganganak o pagkakaroon ng mga anak nang hindi nagiging teknikal o di-likas ang pananalita.
- source_word: οἰκοδεσποτεῖν
  choice: mamahala sa kanilang sambahayan
  rationale: Ipinahihiwatig ng pandiwa ang aktibong pangangasiwa sa sambahayan. Ang “mamahala” ay malinaw ngunit hindi nagdaragdag ng di-kinakailangang diwa ng malupit na paghahari.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: huwag bigyan ... ng anumang pagkakataon
  rationale: Natural nitong inililipat ang diwa ng hindi pagbibigay ng anumang bukas na pagkakataon o dahilan sa isang sumasalansang.
- source_word: τῷ ἀντικειμένῳ
  choice: ang kalaban
  rationale: Pinananatili nito ang isahan at ang kawalan ng tiyak na pagkakakilanlan sa Griyego; maaaring tumukoy sa isang taong sumasalansang o, ayon sa ibang pagkaunawa, kay Satanas.
- source_word: λοιδορίας χάριν
  choice: pagkakataong manirang-puri
  rationale: Ipinahahayag nito ang layon o gamit ng pagkakataon—ang mapanirang at mapanlibak na pagsasalita—sa natural na ayos ng Filipino.
theological_decisions:
- issue: Ang tinutukoy ng τῷ ἀντικειμένῳ
  choice: Hindi tiyak na “kalaban,” na maaaring isang taong o pangkat na sumasalansang
  alternative: “ang Kaaway,” na inuunawang tumutukoy kay Satanas
  rationale: Hindi tahasang kinikilala ng participle na Griyego ang kalaban bilang diyablo. Pinananatili ng pangunahing teksto ang tunay na kalabuan, samantalang inilalahad sa talababa ang posibleng teolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyuda” dahil karaniwan at tiyak ito sa kasalukuyang gamit; pinanatiling payak ang magkakasunod na pandiwa upang masalamin ang serye ng mga infinitive sa Griyego.
