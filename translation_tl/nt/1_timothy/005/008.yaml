id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: tl
  text: Ngunit kung ang sinuman ay hindi naglalaan para sa pangangailangan ng mga kaanak niya[a], lalo na ng mga kasama niya sa sambahayan, itinanggi na niya ang pananampalataya[b] at masahol pa siya kaysa sa isang hindi sumasampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “mga taong malapit sa kaniya.” Mas malawak ang parirala kaysa sa mga nakatira lamang sa iisang bahay; ang kasunod na “mga kasama niya sa sambahayan” ang lalo nang binibigyang-diin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinalikuran na niya ang pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: ang sinuman
  rationale: Ipinahahayag nito ang di-tiyak at pangkalahatang tinutukoy ng Griyego nang hindi nililimitahan sa lalaki.
- source_word: τῶν ἰδίων
  choice: mga kaanak niya
  rationale: Natural itong tumutukoy sa sariling mga kapamilya o kamag-anak at nananatiling mas malawak kaysa sa kasunod na tiyak na pangkat na nasa sambahayan.
- source_word: μάλιστα
  choice: lalo na
  rationale: Malinaw nitong itinatampok ang isang pangkat na may natatanging bigat sa loob ng mas malawak na pangkat.
- source_word: οἰκείων
  choice: mga kasama niya sa sambahayan
  rationale: Iniiwasan nito ang posibleng makitid na modernong kahulugan ng “kasambahay” bilang bayarang manggagawa at ipinapahayag ang mga kabilang sa mismong sambahayan.
- source_word: προνοεῖ
  choice: naglalaan para sa pangangailangan
  rationale: Ipinahahayag nito ang praktikal na pag-iintindi at paglalaan ng kinakailangang suporta, hindi lamang ang pag-aalala sa isip.
- source_word: τὴν πίστιν
  choice: ang pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pananampalatayang Kristiyano na ipinahahayag ng tao, habang pinananatili ang karaniwang salin ng πίστις.
- source_word: ἤρνηται
  choice: itinanggi na
  rationale: Pinananatili nito ang tuwirang lakas ng pandiwa at ang ganap na kilos na may nananatiling bunga sa kasalukuyan.
- source_word: ἀπίστου
  choice: isang hindi sumasampalataya
  rationale: Ipinahahayag nito ang taong walang pananampalataya sa kontekstong ito, sa halip na isang taong hindi lamang mapagkakatiwalaan.
- source_word: χείρων
  choice: masahol pa
  rationale: Natural at mariing paghahambing ito na angkop sa moral na bigat ng pahayag.
theological_decisions:
- issue: Kasarian sa pangkalahatang konstruksiyon
  choice: Gamitin ang likas na walang-tiyak-na-kasariang “ang sinuman” at “niya.”
  alternative: Gumamit ng tahasang panlalaking parirala gaya ng “sinumang lalaki.”
  rationale: Bagaman panlalaki sa gramatika ang anyong Griyego, pangkalahatan ang saklaw nito. Likas sa Tagalog na hindi tinutukoy ng “siya/niya” ang kasarian, kaya napapanatili ang pangkalahatang diwa nang walang dagdag na interpretasyon.
- issue: Kahulugan ng πίστις sa τὴν πίστιν ἤρνηται
  choice: “ang pananampalataya” bilang pananampalatayang ipinahahayag
  alternative: “katapatan” bilang pagiging tapat o “pananalig” bilang pansariling pagtitiwala
  rationale: Ang tiyak na pariralang “ang pananampalataya” sa konteksto ng Mga Liham Pastoral ay malamang na tumutukoy sa pananampalatayang Kristiyano na ipinahahayag at isinasabuhay. Gayunman, hindi dinaragdagan ang teksto ng salitang “Kristiyano,” upang hindi lampasan ang tahasang sinabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kasama niya sa sambahayan” sa halip na “mga kasambahay” upang maiwasan ang karaniwang makabagong kahulugang tumutukoy lamang sa domestic worker. Ang “naglalaan para sa pangangailangan” ay natural na nagpapahiwatig ng konkretong suporta at pangangalaga.
