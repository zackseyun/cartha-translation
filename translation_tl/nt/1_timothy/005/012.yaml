translation:
  language: tl
  text: Napapasailalim sila sa hatol sapagkat isinantabi nila ang dati nilang pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang una nilang pangako” o “ang dati nilang pananagutan.” Maaaring mangahulugan ang salitang Griyego na “pananampalataya,” ngunit sa kontekstong ito ay inuunawa ito ng ilan bilang isang naunang pangako, marahil kaugnay ng pagkakatala bilang balo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: napapasailalim sila
  rationale: Ang literal na “taglay” ay hindi likas sa Filipino kapag kasama ng κρίμα. Ipinahahayag ng “napapasailalim sila” na sila ay sumasailalim sa hatol, habang pinananatili ang kaugnayan nito sa naunang konteksto.
- source_word: κρίμα
  choice: hatol
  rationale: Malawak at seryoso ang “hatol” ngunit hindi nito awtomatikong tinutukoy ang walang-hanggang kaparusahan, na hindi tahasang sinasabi ng talata.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang sumusunod na sugnay ang dahilan ng hatol, sa isang dignificado at natural na rehistro.
- source_word: τὴν πρώτην πίστιν
  choice: ang una nilang pananampalataya
  rationale: Pinananatili ng “pananampalataya” ang karaniwang kahulugan ng πίστις, at ng “una” ang temporal na lakas ng πρώτην. Dahil maaari rin itong mangahulugang naunang pangako o pananagutan sa kontekstong ito, inilagay ang mga iyon sa talababa.
- source_word: ἠθέτησαν
  choice: tinalikuran nila
  rationale: Likas sa Filipino ang “tinalikuran” para sa pagtanggi o pagsasantabi sa dating pananampalataya o pangako. Hindi nito nililimitahan ang pandiwa sa teknikal na ideya ng pagpapawalang-bisa.
theological_decisions:
- issue: Kahulugan ng τὴν πρώτην πίστιν sa konteksto
  choice: ang una nilang pananampalataya
  alternative: ang una nilang pangako; ang dati nilang pananagutan
  rationale: Maaaring tumukoy ang πίστις sa pananampalatayang dati nilang pinanghawakan o sa isang naunang pangako o pananagutang posibleng kaugnay ng pagkakatala bilang balo. Pinananatili sa pangunahing teksto ang karaniwang kahulugang “pananampalataya,” habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at dignipikadong Filipino. Ginamit ang “sapagkat” upang maging pormal ngunit madaling maunawaan, at iniwasang tukuyin ang “hatol” bilang walang-hanggang kaparusahan.
