source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: tl
  text: 'na may mabuting patotoo dahil sa mabubuting gawa: kung nagpalaki siya ng mga anak, kung tumanggap siya ng mga panauhin,[a] kung naghugas siya ng mga paa ng mga banal,[b] kung tumulong siya sa mga nagdurusa, at kung masigasig niyang sinikap na gawin ang bawat mabuting gawa.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumanggap ng mga estranghero.” Ang pandiwang Griyego ay tumutukoy sa pagtanggap ng mga panauhin o estranghero, karaniwan sa sariling tahanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga banal” ay ang mga taong ibinukod ng Diyos—dito, ang mga kapuwa mananampalataya.
    reason: lexical_clarification
  - marker: c
    text: Sa literal, “sumunod sa bawat mabuting gawa.” Ipinahihiwatig ng pananalitang Griyego ang masugid na paghahangad at patuloy na paggawa ng mabuti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: kinikilalang gumagawa ng mabubuti
  rationale: Ipinahahayag nito ang pasibong diwa ng μαρτυρουμένη—may mabuting patotoo sa kaniya ang iba—sa natural na Filipino, at iniuugnay ang reputasyong iyon sa kaniyang nakikitang mabubuting gawa.
- source_word: εἰ
  choice: (sunud-sunod na pandiwang naglilista ng mga katibayan)
  rationale: Sa konteksto, ang paulit-ulit na εἰ ay naglalahad ng magkakaugnay na pamantayan. Hindi natural sa Filipino ang paulit-ulit na “kung” sa isang pariralang nakadepende sa naunang talata, kaya ginamit ang tuwirang listahan nang hindi binabago ang kondisyunal na tungkulin nito sa mas malawak na pangungusap.
- source_word: ἐτεκνοτρόφησεν
  choice: nagpalaki siya ng mga anak
  rationale: Tumutukoy ito sa pag-aaruga at pagpapalaki sa mga anak, nang hindi ipinapalagay na sila ay sariling anak niya.
- source_word: ἐξενοδόχησεν
  choice: naging mapagpatuloy sa mga panauhin
  rationale: Pinananatili nito ang ideya ng pagtanggap at pag-aasikaso sa mga panauhin o mga dayuhan, hindi lamang ang pangkalahatang pagiging magiliw.
- source_word: ἁγίων
  choice: mga banal
  rationale: Pinananatili ang mahalagang katawagang Paulino para sa mga taong ibinukod ng Diyos, sa halip na agad itong palitan ng interpretatibong “mga mananampalataya.”
- source_word: πόδας ἔνιψεν
  choice: naghugas ng mga paa
  rationale: Tuwirang pinananatili ang kongkretong gawa ng mapagpakumbabang paglilingkod at ang bigat nitong pangkultura.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: tumulong sa mga nagdurusa
  rationale: Saklaw ng “nagdurusa” ang mga dumaranas ng kagipitan, dalamhati, o panggigipit, habang malinaw na ipinapahayag ng “tumulong” ang praktikal na pag-alalay.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: masugid na gumawa ng lahat ng uri ng kabutihan
  rationale: Ipinakikita ng “masugid” ang aktibong pagsunod o pagtatalaga sa mabubuting gawa. Ang “lahat ng uri ng kabutihan” ay natural sa Filipino at hindi nagpapahiwatig na literal na naisagawa niya ang bawat posibleng mabuting gawa.
theological_decisions:
- issue: Tinutukoy ng ἁγίων
  choice: mga banal, na ipinaliliwanag sa talababa bilang mga taong ibinukod ng Diyos at, sa kontekstong ito, mga kapuwa mananampalataya
  alternative: mga mananampalataya / mga taong banal
  rationale: Karaniwang katawagan ito ni Pablo sa mga Cristiano bilang bayan ng Diyos. Pinananatili ng salin ang pangunahing terminong teolohikal nang hindi ipinahihiwatig na tumutukoy lamang ito sa isang natatanging uri ng Cristiano.
- issue: Diwa ng ἐπηκολούθησεν
  choice: masugid na gumawa
  alternative: sumunod sa / itinalaga ang sarili sa
  rationale: Pinananatili nito ang aktibong paghahangad at patuloy na pagtatalaga na ipinahihiwatig ng pandiwa, ngunit hindi ginagawang teknikal na panata o lubos na pag-aalay ng sarili ang pahayag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mapagpatuloy” at “mga banal” bilang pamilyar na wikang biblikal, na nilinaw sa mga talababa. Ang talata ay sintaktikong karugtong ng pamantayang sinimulan sa naunang bersikulo, kaya nagsisimula ito sa “na.”
