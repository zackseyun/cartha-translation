base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: tl
  text: 'Sapagkat sinasabi ng Kasulatan: “Huwag mong busalan ang baka habang gumigiik ito[a],” at, “Karapat-dapat ang manggagawa sa kaniyang sahod.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang tinatapakan nito ang butil sa giikan.” Ang salitang Griyego ay tumutukoy sa bakang ginagamit sa paggiik.
    reason: lexical_alternative
  - marker: b
    text: O “kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Sapagkat sinasabi ng Kasulatan
  rationale: Isinasalin ang γάρ bilang “Sapagkat” upang ipakita ang paliwanag na kaugnayan sa naunang talata. Ang ἡ γραφή ay “ang Kasulatan,” at ang kasalukuyang λέγει ay natural na “sinasabi.”
- source_word: Βοῦν
  choice: ang baka
  rationale: Ang βοῦς ay tumutukoy sa bakang ginagamit sa gawaing bukid. Mas karaniwan at madaling maunawaan sa modernong Filipino ang “baka” kaysa sa mas teknikal na “kapong baka.”
- source_word: ἀλοῶντα
  choice: habang gumigiik ito
  rationale: 'Ipinahahayag ng participle ang kilos na kasabay ng pagbabawal: ang baka ay kasalukuyang gumigiik. Pinananatili ng “gumigiik” ang gawaing tinutukoy nang maikli at natural.'
- source_word: οὐ φιμώσεις
  choice: Huwag mong busalan
  rationale: Ang future indicative ay may puwersang nagbabawal. Ang “Huwag mong busalan” ay malinaw at likas na anyo ng utos sa Filipino.
- source_word: καί
  choice: at
  rationale: Payak na pinag-uugnay ng καί ang dalawang sipi.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Karapat-dapat ang manggagawa
  rationale: Ang ἐργάτης ay isang taong gumagawa o nagpapagal. Ang “manggagawa” ay kasalukuyan, marangal, at sapat na malawak para sa pangkalahatang simulain.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: sa kaniyang sahod
  rationale: Ang μισθός dito ay kabayarang nararapat sa paggawa, kaya “sahod” ang pinakatumpak. Pinananatili ng “kaniyang” ang ikatlong panauhang isahan ng αὐτοῦ nang hindi nagdaragdag ng kasariang hindi kailangang markahan sa Filipino.
theological_decisions:
- issue: Saklaw ng γραφή kaugnay ng dalawang sipi
  choice: Inilalahad ang dalawang sipi sa ilalim ng “sinasabi ng Kasulatan” nang hindi nililimitahan sa salin ang implikasyon nito.
  alternative: Ituring na ang unang sipi lamang ang Kasulatan at ang ikalawa ay hiwalay na kasabihan o salita ng Panginoon.
  rationale: Sa gramatika ng talata, kapuwa sumusunod ang mga sipi sa pambungad na pormula. Hindi dapat lutasin ng salin ang mas malawak na usaping kanonikal na hindi tahasang nililinaw rito.
- issue: Paglalarawan sa αὐτοῦ
  choice: kaniyang sahod
  alternative: kanilang sahod
  rationale: Isahan ang anyong Griyego. Ang “kaniyang” ay nagpapanatili ng bilang habang likas sa Filipino at hindi sapilitang nagtatakda ng kasarian.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Kasulatan,” “busalan,” “gumigiik,” at “manggagawa” upang mapanatili ang biblikal na tono nang hindi nagiging lipas o labis na teknikal. Ang mga panandang [a] at [b] ay inilagay kaagad pagkatapos ng mga bahaging nililinaw ng mga talababa.
