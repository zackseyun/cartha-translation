base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: tl
  text: Huwag ka nang uminom ng tubig lamang[a], ngunit gumamit ka rin ng kaunting alak dahil sa iyong sikmura at sa madalas mong mga karamdaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Huwag ka nang maging palainom ng tubig.” Ang diwa, ayon sa kasunod na pananalita, ay huwag nang magpatuloy si Timoteo sa pag-inom ng tubig lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: Huwag ka nang
  rationale: Ipinahihiwatig ng pang-abay ang pagtigil sa dating nakagawian; natural itong ipahayag kasama ng pautos na pandiwa sa Filipino.
- source_word: ὑδροπότει
  choice: uminom ng tubig lamang
  rationale: Literal itong tumutukoy sa pag-inom ng tubig, ngunit ipinahihiwatig ng kasunod na paghahambing sa alak na tubig lamang ang dating iniinom. Nililinaw ito nang hindi ipinahihiwatig na dapat ganap na itigil ang tubig.
- source_word: ἀλλὰ
  choice: sa halip
  rationale: Malinaw na ipinakikilala nito ang salungat na tagubilin at natural ang daloy sa Filipino.
- source_word: οἴνῳ ὀλίγῳ
  choice: kaunting alak
  rationale: Pinananatili ang tahasang salitang 'alak' at ang panukat na nagsasaad ng kaunti o katamtamang dami.
- source_word: χρῶ
  choice: gumamit ka
  rationale: Tuwirang katumbas ito ng pandiwang nangangahulugang gumamit o makinabang sa isang bagay; hindi nito dinaragdagan ang teksto ng tiyak na paraang medikal.
- source_word: διὰ
  choice: dahil sa
  rationale: Ipinapahayag ng διά na may accusative ang dahilan ng tagubilin.
- source_word: στόμαχον
  choice: sikmura
  rationale: Karaniwan at natural na katawagan ito sa bahaging anatomikal na tinutukoy.
- source_word: πυκνάς σου ἀσθενείας
  choice: madalas mong pagkakasakit
  rationale: Sa kontekstong pisikal at medikal, ang parirala ay natural na tumutukoy sa paulit-ulit o madalas na mga karamdaman.
theological_decisions:
- issue: Kung dapat bang gawing malinaw na tubig lamang ang dating iniinom ni Timoteo
  choice: uminom ng tubig lamang
  alternative: uminom ng tubig
  rationale: Malakas na ipinahihiwatig ng paghahambing na may 'kaunting alak' na ang tinutukoy ay eksklusibong pag-inom ng tubig, hindi lubos na pagbabawal sa tubig. Pinananatili rin sa talababa ang mas literal na anyo.
- issue: Kung literal na isasalin ang οἶνος o gagawing pangkalahatang inuming panggamot
  choice: alak
  alternative: inuming panggamot
  rationale: Tahasang οἶνος ang nasa Griyego. Hindi ito dapat palabuin o dagdagan para umayon sa isang doktrinal o kultural na pananaw; ipinapakita na ng 'kaunti' ang limitadong dami.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sikmura' sa halip na mas teknikal na katawagan, at pinanatili ang tuwirang pastoral na pautos. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang nililinaw nito.
