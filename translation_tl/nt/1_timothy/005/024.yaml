  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: tl
  text: Hayag ang mga kasalanan ng ilang tao[a] at nauuna ang mga ito sa kanila tungo sa paghatol[b]; ngunit sa iba naman ay saka sumusunod ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kitang-kita ang mga kasalanan ng ilang tao.”
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “paghatol” ay maaaring tumukoy sa kasalukuyang pagsusuri sa isang tao, ngunit maaari rin itong magkaroon ng mas malawak na diwa ng paghatol ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: ang mga kasalanan ng ilang tao
  rationale: Pinananatili ang ugnayang henitibo ng parirala at ginagamit ang pangkalahatang “tao” para sa ἀνθρώπων, na hindi kailangang tukuyin bilang lalaki sa Tagalog.
- source_word: πρόδηλοί
  choice: hayag
  rationale: Ang “hayag” ay natural at marangal na salin na nagpapahiwatig na lantad o madaling makilala ang mga kasalanan.
- source_word: προάγουσαι
  choice: nauuna ang mga ito sa kanila
  rationale: 'Pinananatili ang personipikasyon: ang mga kasalanan ang nauuna sa mga taong tinutukoy. Idinagdag ang “sa kanila” upang maging malinaw sa Tagalog ang ipinahihiwatig na kaugnayan.'
- source_word: εἰς κρίσιν
  choice: tungo sa paghatol
  rationale: Pinananatili ng “tungo sa” ang direksiyonal na puwersa ng εἰς, samantalang hindi nililimitahan ng “paghatol” kung ito ay kasalukuyang pagsusuri o mas malawak na banal na paghatol.
- source_word: τισὶν δὲ καὶ
  choice: ngunit sa iba naman
  rationale: Natural nitong ipinahahayag ang pagsalungat at ang datibong pagtukoy sa ikalawang pangkat.
- source_word: ἐπακολουθοῦσιν
  choice: sumusunod ang mga ito pagkatapos
  rationale: Ipinagpapatuloy nito ang larawang ang mga kasalanan ay sumusunod sa mga tao at nahahayag lamang sa kalaunan, nang hindi dinaragdagan ang hindi tahasang sinabi ng Griyego.
theological_decisions:
- issue: Saklaw ng κρίσις (“paghatol”)
  choice: Panatilihin ang pangkalahatang “paghatol.”
  alternative: Tahasang tukuyin bilang kasalukuyang pagsusuri sa iglesya o bilang panghuling paghatol ng Diyos.
  rationale: Maaaring tumukoy ang agarang konteksto sa pagsusuri sa mga tao, ngunit sapat ang lawak ng salita upang magpahiwatig din ng banal na paghatol. Hindi nilulutas ng salin ang tunay na tensiyong ito.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang personipikasyon ng mga kasalanan at ang hindi tiyak na saklaw ng “paghatol.”
