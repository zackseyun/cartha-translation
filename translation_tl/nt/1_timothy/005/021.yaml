id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: tl
  text: 'Taimtim kitang inaatasan sa harap ng Diyos, ng Mesiyas na si Jesus, at ng mga piniling anghel[a]: sundin mo ang mga bagay na ito nang walang paunang paghatol[b], at huwag kang gumawa ng anuman dahil sa pagkiling[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga hinirang na anghel.”
    reason: lexical_alternative
  - marker: b
    text: O, “nang walang pagtatangi.” Ang salitang Griyego ay maaari ring tumukoy sa paghatol nang patiuna.
    reason: lexical_alternative
  - marker: c
    text: O, “dahil sa pagtatangi” o “dahil sa paboritismo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Taimtim kitang inaatasan
  rationale: Ipinahahayag nito ang bigat ng isang seryosong tagubilin o atas, hindi lamang simpleng pagpapatotoo.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Natural sa modernong Tagalog at pinananatili ang diwa ng taimtim na pag-aatas sa presensiya ng mga binanggit na saksi.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ginagamit ang likas na ayos sa Tagalog.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: ng mga piniling anghel
  rationale: Malinaw at madaling maunawaang katumbas ng ἐκλεκτός, habang pinananatili ang ideya ng pagpili.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Hindi labis na nililinaw ang tinutukoy at pinananatili ang pagbalik sa naunang mga tagubilin.
- source_word: φυλάξῃς
  choice: sundin mo
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa maingat at tapat na pagtupad sa mga tagubilin; mas natural dito ang “sundin” kaysa literal na “bantayan.”
- source_word: χωρὶς προκρίματος
  choice: nang walang paunang paghatol
  rationale: Tuwirang inilalarawan ang paghatol nang patiuna bago ganap na masuri ang usapin, at iniiwasan ang posibleng legal na kahulugan ng salitang “prejudice.”
- source_word: μηδὲν ποιῶν
  choice: at huwag kang gumawa ng anuman
  rationale: Isinasalin ang kasamang participial na tagubilin bilang malinaw at natural na negatibong utos sa Tagalog.
- source_word: κατὰ πρόσκλισιν
  choice: dahil sa pagkiling
  rationale: Ipinahahayag ang pagkampi o pagkiling sa isang panig; natural ito sa Tagalog at hindi nililimitahan sa isang partikular na uri ng paboritismo.
theological_decisions:
- issue: Pagkakasalin ng Χριστός
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Nananatiling lantad ang kahulugan ng titulo bilang Mesiyas, sa halip na ituring lamang itong bahagi ng pangalan.
- issue: Pagkakakilanlan ng ἐκλεκτῶν ἀγγέλων
  choice: mga piniling anghel
  alternative: mga hinirang na anghel
  rationale: Hindi tinutukoy ng talata kung sa anong tiyak na diwa sila pinili; kaya pinananatili ang payak na paglalarawan nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na taimtim at marangal ngunit madaling maunawaan. Ginamit ang tuwirang pakikipag-usap na “ka/mo” alinsunod sa isahang kausap sa Griyego, at pinanatiling magkaiba ang “paunang paghatol” at “pagkiling” upang hindi pag-isahin ang dalawang magkaugnay ngunit magkahiwalay na termino.
source_grounding:
  english_pob_role: consult_only
