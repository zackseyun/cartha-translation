base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: tl
  text: Ngunit huwag mong isama sa talaan ang mga nakababatang biyuda[a], sapagkat kapag nagiging mapusok sila laban sa Mesiyas[b], nais nilang mag-asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, ang ibig sabihin ay huwag silang isama sa talaan ng mga biyudang binanggit sa talata 9; hindi ito pangkalahatang utos na tanggihan o pabayaan sila.
    reason: contextual_clarification
  - marker: b
    text: 'Maaaring isalin: “kapag nagpapadala sila sa makalamang pagnanasa, na salungat sa Mesiyas” o “kapag hinihila sila ng kanilang mga pagnanasa palayo sa Mesiyas.” Mahirap ang eksaktong ugnayan ng mga salitang Griyego; maaaring tumukoy ito sa pagnanasang sumasalungat sa nauna nilang pagtatalaga sa kanya. Ang nakaugaliang salin sa Χριστοῦ ay “Cristo.”'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: Ngunit ... ang mga nakababatang biyuda
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ, at ng “nakababatang biyuda” ang paghahambing sa mas matatandang biyudang tinatalakay sa konteksto.
- source_word: παραιτοῦ
  choice: huwag mong isama sa talaan
  rationale: Sa konteksto ng 1 Timoteo 5:9–11, tumutukoy ang utos sa hindi pagtanggap sa partikular na talaan, hindi sa pangkalahatang pagtatakwil sa mga nakababatang biyuda.
- source_word: ὅταν γὰρ
  choice: sapagkat kapag
  rationale: Ipinahahayag nito kapwa ang pagbibigay-dahilan at ang pangkalahatang kalagayang ipinakikilala ng parirala.
- source_word: καταστρηνιάσωσιν
  choice: ang kanilang mga pagnanasa ay naglalayo sa kanila
  rationale: Ang bihirang pandiwa ay nagpapahiwatig ng malakas at mapagpalayaw o makalamang pagnanasa. Ang likas na pariralang Filipino ay malinaw ngunit hindi itinuturing na masama sa ganang sarili ang pagnanais na mag-asawa.
- source_word: τοῦ Χριστοῦ
  choice: sa Mesiyas
  rationale: Ginamit ang “Mesiyas” sapagkat titulo ang Χριστός. Kasama ng pandiwa, ipinakikita ng parirala na ang mga pagnanasa ay sumasalungat o naglalayo sa naunang pagtatalaga sa kanya.
- source_word: γαμεῖν θέλουσιν
  choice: nais nilang mag-asawa
  rationale: Tumpak at likas na ipinahahayag nito ang pagnanais o hangaring nasa θέλουσιν na may infinitibong γαμεῖν.
theological_decisions:
- issue: Kahulugan ng παραιτοῦ sa konteksto
  choice: huwag mong isama sa talaan
  alternative: tanggihan mo
  rationale: Nililinaw ng konteksto na ang usapin ay ang talaan ng mga biyuda. Iniiwasan nitong ipahiwatig na dapat itakwil o huwag tulungan ang lahat ng nakababatang biyuda.
- issue: Pagpapahayag sa καταστρηνιάσωσιν τοῦ Χριστοῦ
  choice: ang kanilang mga pagnanasa ay naglalayo sa kanila sa Mesiyas
  alternative: nagiging mapusok sila laban sa Mesiyas
  rationale: Mahirap ang ugnayan ng pandiwa at ng genitibong τοῦ Χριστοῦ. Pinananatili ng salin ang tunggalian sa pagitan ng pagnanasa at ng pagtatalaga sa Mesiyas nang hindi ipinapahayag na ang muling pag-aasawa mismo ang kasalanan.
- issue: Pag-render sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang Χριστός bilang titulo; kaya “Mesiyas” ang ginamit, habang kinikilala na “Cristo” ang nakaugaliang salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginawang tahasan ang kontekstuwal na diwa ng “huwag isama sa talaan” upang maiwasan ang maling impresyon ng pangkalahatang pagtatakwil. Ang metaporang “mga pagnanasa ay naglalayo” ay natural sa Filipino at pinananatili ang teolohikal na tensiyon ng Griyego.
