base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: tl
  text: Huwag mong tanggapin ang paratang laban sa isang nakatatanda sa iglesya[a], maliban kung ito ay batay sa patotoo ng dalawa o tatlong saksi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang nakatatandang lalaki,” kung ang πρεσβυτέρου ay inuunawa sa kahulugang batay sa edad sa halip na bilang isang nakatatanda sa iglesya.
    reason: alternative_reading
  - marker: b
    text: Ipinapahiwatig ng pananalitang ito ang tuntuning legal sa Lumang Tipan na ang isang usapin ay pinagtitibay sa pamamagitan ng “dalawa o tatlong saksi” (tingnan ang Deuteronomio 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: laban sa isang matanda
  rationale: Sa konteksto ng 1 Timoteo 5, malamang na tumutukoy ang πρεσβύτερος sa isang kinikilalang lider ng iglesya. Ang “matanda” ang likas at dignified na katawagang Tagalog, habang pinananatili sa talababa ang posibleng kahulugang nakatatandang lalaki.
- source_word: κατηγορίαν
  choice: paratang
  rationale: Ipinahihiwatig ng salita ang isang pormal na akusasyon o sakdal. Malinaw at natural sa makabagong Filipino ang “paratang” at taglay nito ang angkop na bigat na legal.
- source_word: μὴ παραδέχου
  choice: Huwag mong tanggapin
  rationale: Ang pandiwang παραδέχομαι rito ay tumutukoy sa pagtanggap o pagdinig sa isang paratang bilang nararapat isaalang-alang, hindi sa paghatol agad na totoo ito.
- source_word: ἐκτὸς εἰ μὴ
  choice: maliban kung
  rationale: Likas na ipinapahayag ng pariralang Filipino ang eksepsiyong ipinakikilala ng idyomang Griyego.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: batay sa patotoo ng dalawa o tatlong saksi
  rationale: Nililinaw ng “batay sa patotoo” ang evidensiyal at legal na puwersa ng ἐπί, at pinananatili ang alingawngaw ng tuntunin sa Deuteronomio.
theological_decisions:
- issue: Kahulugan ng πρεσβυτέρου sa konteksto ng iglesya
  choice: matanda bilang kinikilalang lider ng iglesya
  alternative: nakatatandang lalaki
  rationale: Ang malapit na konteksto ay tumatalakay sa mga matandang namumuno at sa pagdidisiplina sa kanila, kaya mas malamang ang tungkuling pang-iglesya. Gayunman, tunay na maaari ring maging batay sa edad ang salita, kaya inilalahad ang posibilidad na iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matanda” bilang karaniwang katawagan sa lider na πρεσβύτερος, ngunit nilinaw sa talababa ang likas na leksikal na kalabuan nito. Ang “patotoo” ay idinagdag bilang likas na pagpapahayag sa Filipino ng evidensiyal na gamit ng mga saksi.
