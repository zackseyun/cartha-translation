  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: tl
  text: Igalang mo ang mga biyudang tunay ngang biyuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tustusan ang mga biyudang tunay ngang biyuda.” Sa konteksto, malamang na kasama sa “igalang” ang materyal na pag-aaruga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: mga biyuda
  rationale: Ang χήρα ay tuwirang tumutukoy sa babaeng namatayan ng asawa; malinaw at natural sa modernong Filipino ang “mga biyuda.”
- source_word: τίμα
  choice: Igalang mo
  rationale: Pangunahing kahulugan ng τιμάω ang pagpaparangal o paggalang. Sa kontekstong ito, malamang na kalakip nito ang praktikal at materyal na pag-aaruga, ngunit hindi dapat paliitin ang salita sa pinansiyal na tulong lamang.
- source_word: τὰς ὄντως χήρας
  choice: ang mga biyudang tunay na walang kumakalinga
  rationale: Literal na inuulit ng Griyego ang “mga biyuda” at nililinaw ng ὄντως na ang tinutukoy ay yaong tunay na nasa kalagayang nangangailangan. Batay sa kasunod na konteksto, ang likas na Filipino na “tunay na walang kumakalinga” ay nagpapahayag ng kwalipikasyong ito nang hindi ipinahihiwatig na hindi totoong namatayan ng asawa ang iba.
- source_word: ὄντως
  choice: tunay na
  rationale: Ipinakikita ng pang-abay ang isang tunay at mahalagang pagkakaiba, hindi lamang retorikal na diin.
theological_decisions:
- issue: Saklaw ng τιμάω sa konteksto
  choice: Pinanatili sa pangunahing teksto ang “Igalang,” na maaaring sumaklaw sa paggalang at materyal na pagkalinga.
  alternative: “Tustusan” o “Kalingain” ang mga biyudang tunay na walang kumakalinga.
  rationale: Tinatalakay ng 1 Timoteo 5 ang praktikal na pagtustos sa mga biyuda, ngunit mas malawak ang mismong pandiwang Griyego kaysa pinansiyal na suporta lamang.
- issue: Kahulugan ng “tunay na biyuda”
  choice: Isinalin bilang “biyudang tunay na walang kumakalinga.”
  alternative: “mga tunay na biyuda” o “mga biyuda talaga.”
  rationale: Hindi pinagdududahan ng parirala kung namatayan nga ng asawa ang babae; sa kasunod na konteksto, itinatangi nito ang mga naiwang nag-iisa at kwalipikado sa pagkalinga ng kapulungan. Iniiwasan ng salin ang madaling maling pagkaunawa sa literal na “tunay na biyuda.”
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “biyuda” bilang karaniwang katawagan at ang “walang kumakalinga” upang likas na maipahayag ang kontekstuwal na diwa ng ὄντως χήρας. Nasa pangunahing teksto ang marker na [a].
