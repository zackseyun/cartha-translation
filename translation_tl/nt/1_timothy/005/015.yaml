review_pass:
  verdict: revise
  source_fidelity: Ang “Sapagkat may ilan nang lumihis” ay tapat sa γὰρ τινες ἤδη ἐξετράπησαν. Gayunman, ang “upang sumunod” ay karaniwang nagpapahiwatig ng layunin (“in order to follow”), samantalang ang ὀπίσω τοῦ Σατανᾶ ay naglalarawan ng direksiyon o resulta ng paglihis—pagsunod kay Satanas.
  naturalness: Malinaw ang draft, ngunit mas natural at tuwiran sa modernong Filipino ang “lumihis at sumunod kay Satanas” kaysa “lumihis upang sumunod kay Satanas.”
  terminology: Ang “Satanas” ay ang karaniwan at angkop na anyong Filipino. Nananatili ang “lumihis” bilang matapat na larawan ng paglayo o paglihis sa tamang landas.
  issues:
  - severity: medium
    issue: Ang “upang sumunod” ay nagdaragdag ng nuwansang layunin.
    rationale: Hindi tahasang ipinapahayag ng Griyego na lumihis sila na may layuning sumunod; ang pariralang ὀπίσω τοῦ Σατανᾶ ay mas tuwirang nagsasaad na ang kanilang paglihis ay nasa pagsunod kay Satanas.
  - severity: low
    issue: Hindi maayos ang literal na alternatibo sa talababa.
    rationale: Ang “lumihis na kasunod ni Satanas” ay maaaring malabong magpahiwatig na si Satanas ang kasunod, at ang “lumihis na sa likuran ni Satanas” ay hindi likas na pagbuo sa Filipino. Maaaring panatilihin ang literal na direksiyon sa mas malinaw na paliwanag.
  revised_text: Sapagkat may ilan nang lumihis at sumunod kay Satanas.[a]
  revised_footnotes:
  - marker: a
    text: O, mas literal, “lumihis kasunod ni Satanas” o “lumihis sa likuran ni Satanas”; ipinahihiwatig ng parirala ang pagsunod kay Satanas.
    reason: lexical_alternative
  revision_rationale: Pinalitan ang pang-ukol na “upang” ng magkaugnay na pandiwang “at sumunod” upang maiwasan ang diwa ng layunin na wala sa Griyego, habang malinaw na naipapahayag ang idiomatikong kahulugan ng ὀπίσω τοῦ Σατανᾶ. Inayos din ang talababa upang maitala ang literal na imahen nang hindi lumikha ng hindi likas o maling pagbasa sa Filipino.
