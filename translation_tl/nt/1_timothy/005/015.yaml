  text: For some have already turned aside to follow Satan.
translation:
  language: tl
  text: Sapagkat may ilan nang lumihis at sumunod kay Satanas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “lumihis kasunod ni Satanas” o “lumihis sa likuran ni Satanas”; ipinahihiwatig ng parirala ang pagsunod kay Satanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: nang
  rationale: Sa pariralang “may ilan nang lumihis,” likas na ipinahihiwatig ng “nang” na nangyari na ang paglihis, kaya napapanatili ang temporal na diwa ng ἤδη.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita nitong ang pahayag ay dahilan o paliwanag sa naunang tagubilin.
- source_word: τινες
  choice: may ilan
  rationale: Natural itong paraan sa modernong Filipino upang tukuyin ang isang di-tiyak na bahagi ng isang pangkat.
- source_word: ἐξετράπησαν
  choice: lumihis
  rationale: Pinananatili nito ang larawan ng pagtalikod sa wastong landas nang hindi ipinapalagay na may ibang tahasang nagligaw sa kanila.
- source_word: ὀπίσω
  choice: upang sumunod
  rationale: Bagaman literal na nangangahulugang “sa likuran” o “kasunod,” sa pariralang ito na may taong sinusundan ay natural na ipinahahayag sa Filipino bilang “upang sumunod.”
- source_word: Σατανᾶ
  choice: Satanas
  rationale: Ito ang karaniwang anyo ng pangalan o titulong ito sa Filipino at sa Bagong Tipan.
theological_decisions:
- issue: Kung ang ὀπίσω τοῦ Σατανᾶ ay isasalin nang literal bilang pagpunta “sa likuran ni Satanas” o idiomatiko bilang pagsunod sa kanya.
  choice: upang sumunod kay Satanas
  alternative: lumihis na kasunod ni Satanas; lumihis na sa likuran ni Satanas
  rationale: Malinaw at natural na ipinahahayag ng piniling salin ang direksiyon ng paglihis at ang diwa ng pagsunod, habang itinatala sa talababa ang mas literal na anyo upang hindi maitago ang talinghaga ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “may ilan nang” sa halip na mas pormal na “ang ilan ay ... na” upang maging natural habang nananatiling tapat sa pagkakasunod ng diwa ng Griyego.
