  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: tl
  text: Ang mga nakatatandang namumuno nang mahusay ay dapat kilalaning karapat-dapat sa dobleng karangalan[a], lalo na[b] ang mga nagpapagal sa pangangaral at pagtuturo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ibilang na karapat-dapat sa dobleng karangalan.” Maaaring saklawin ng parirala ang paggalang at materyal na pagtustos, lalo na ayon sa kasunod na talata.
    reason: lexical_alternative
  - marker: b
    text: 'May ilan ding umuunawa sa “lalo na” bilang “iyon ay,” anupat ipinakikilala nito kung sino ang mga nakatatandang tinutukoy: ang mga nagpapagal sa pangangaral at pagtuturo.'
    reason: alternative_reading
  - marker: c
    text: Ang “sa pangangaral at pagtuturo” ay tumutukoy sa pasalitang paglilingkod, gaya ng pagpapahayag at pagbibigay ng aral.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: mga nakatatanda
  rationale: Sa Mga Sulat Pastoral, tumutukoy ito sa mga kinikilalang pinuno ng kapulungan, hindi lamang sa matatandang lalaki. Ang “mga nakatatanda” ay likas at pamilyar na katawagang Tagalog na hindi nag-aangkat ng mas huling estrukturang pansimbahan.
- source_word: καλῶς προεστῶτες
  choice: mahusay mamuno
  rationale: Ipinahihiwatig ng προΐστημι ang aktuwal na pamumuno at pangangasiwa. Malinaw at natural ang “mahusay mamuno” at hindi kasintindi ng maaaring ipahiwatig ng “mahusay maghari.”
- source_word: διπλῆς τιμῆς
  choice: sa dobleng karangalan
  rationale: Pinananatili ng tuwirang parirala ang saklaw ng τιμή, na maaaring tumukoy kapuwa sa paggalang at sa materyal na pagtustos ayon sa kasunod na talata.
- source_word: ἀξιούσθωσαν
  choice: kilalaning karapat-dapat
  rationale: 'Naipapakita nito ang pasibong pautos: dapat kilalanin at pahalagahan sila ng komunidad bilang karapat-dapat.'
- source_word: μάλιστα
  choice: lalo na
  rationale: Karaniwang itinatampok nito ang isang pangkat sa loob ng mas malawak na pangkat. Hindi nito sapilitang ginagawang kapaliwanagan lamang ang sumusunod na parirala.
- source_word: κοπιῶντες
  choice: mga nagpapagal
  rationale: Inihahatid ng “nagpapagal” ang matindi at masikap na paggawa na nakapaloob sa κοπιάω, habang nananatiling marangal at natural.
- source_word: ἐν λόγῳ
  choice: sa salita
  rationale: Pinananatili nito ang lawak ng λόγος at hindi nililimitahan agad sa pormal na pangangaral, bagaman malamang na tumutukoy ito sa pasalitang ministeryo.
- source_word: διδασκαλίᾳ
  choice: pagtuturo
  rationale: Ang “pagtuturo” ang pinakamalinaw at pinakanatural na katumbas; hindi ito kasingteknikal ng “doktrina.”
theological_decisions:
- issue: Saklaw ng “dobleng karangalan” para sa mga pinuno ng kapulungan
  choice: Panatilihin ang malawak na pariralang “dobleng karangalan.”
  alternative: dobleng paggalang; dobleng kabayaran; karangalang may kasamang materyal na pagtustos
  rationale: Itinuturo ng agarang konteksto sa talata 18 ang materyal na pagtustos, ngunit maaari ring saklawin ng τιμή ang paggalang. Hindi dapat paliitin ng salin ang sadyang malawak na kahulugan.
- issue: Diwa ng μάλιστα
  choice: Isalin bilang “lalo na.”
  alternative: samakatuwid nga; iyon ay
  rationale: Pinananatili nito ang malamang na natatanging pagdidiin sa ilang nakatatanda nang hindi ipinapasya kung ang sumusunod na pangkat ay eksaktong kapareho ng lahat ng nakatatandang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang kinikilalang katawagang “mga nakatatanda” para sa mga pinuno ng kapulungan; iniwasan ang mas teknikal o denominasyonal na “presbitero.” Pinanatili ang mga tunay na kalabuan sa “dobleng karangalan,” “lalo na,” at “sa salita.”
