- from: Ang mga nakatatandang mahusay mamuno ay kilalaning karapat-dapat sa dobleng karangalan[a], lalo na[b] ang mga nagpapagal sa salita at pagtuturo.[c]
  to: Ang mga nakatatandang namumuno nang mahusay ay dapat kilalaning karapat-dapat sa dobleng karangalan[a], lalo na[b] ang mga nagpapagal sa pangangaral at pagtuturo.[c]
  rationale: Inayos ang sintaksis at idiomatikong Tagalog habang pinanatili ang pasibong puwersa ng pautos, ang malawak na kahulugan ng “dobleng karangalan,” at ang hindi-eksklusibong “lalo na.” Isinalin ang λόγῳ bilang “pangangaral” dahil ito ang natural na kontekstuwal na Tagalog para sa pasalitang pagpapahayag sa kapareha ng “pagtuturo”; nililinaw ng talababa ang saklaw nito nang hindi nagdaragdag ng denominasyonal na pakahulugan.
