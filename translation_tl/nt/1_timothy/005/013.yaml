id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: tl
  text: Kasabay nito, natututo rin silang maging walang-gawa, habang nagpapalibot-libot sa mga bahay. Hindi lamang sila walang-gawa kundi mga tsismosa rin[a] at mapanghimasok[b], na nagsasabi ng mga bagay na hindi nila dapat sabihin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng mahilig sa walang kabuluhang usapan.” Maaaring tumukoy ang salitang Griyego sa hangal o walang saysay na pagsasalita sa mas malawak na diwa, bagaman malamang na kabilang dito ang tsismis sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: O “mga pakialamera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Kasabay nito, ... rin
  rationale: Ipinahahayag nito ang magkaugnay na diwa ng pagsabay at pagdaragdag, at natural ang ganitong ugnayan sa modernong Tagalog.
- source_word: ἀργαὶ
  choice: magwalang-gawa / mga walang-gawa
  rationale: Tumutukoy ito sa kawalan ng kapaki-pakinabang na ginagawa, hindi lamang sa ugaling katamaran. Pinananatili rin ang pag-uulit ng salitang Griyego.
- source_word: μανθάνουσιν
  choice: natututo ... silang
  rationale: Ipinahihiwatig ng pandiwa ang pagkakaroon ng isang nakasanayang gawi; ang kasunod na pawatas na “magwalang-gawa” ang likas na pagkakabuo nito sa Tagalog.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: palipat-lipat sa bahay-bahay
  rationale: Likas at malinaw na ipinapakita nito ang pagpunta mula sa isang sambahayan patungo sa iba.
- source_word: φλύαροι
  choice: mga tsismosa
  rationale: Sa konteksto, ang walang saysay o di-maingat na pagsasalita ay malamang na may kasamang tsismis. Nagbibigay ang talababa ng mas malawak na kahulugang leksikal.
- source_word: περίεργοι
  choice: mapanghimasok
  rationale: Ipinapahayag nito ang di-nararapat na pakikialam sa mga bagay na hindi saklaw ng isang tao.
- source_word: λαλοῦσαι
  choice: nagsasabi
  rationale: Isang payak na pandiwa ng pagsasalita ang sapat at maayos itong kaugnay ng kasunod na sugnay.
- source_word: τὰ μὴ δέοντα
  choice: mga bagay na hindi nila dapat sabihin
  rationale: Nililinaw nito na ang hindi nararapat ay ang nilalaman ng kanilang pagsasalita, ayon sa ugnayan nito sa λαλοῦσαι.
theological_decisions:
- issue: Ang kasariang tinutukoy ng mga anyong pambabae at maramihan sa Griyego
  choice: sila ... mga tsismosa
  alternative: ang mga babaeng ito ... mga tsismosa
  rationale: Ang mga anyong Griyego ay pambabae at tumutukoy sa mga nakababatang biyuda sa konteksto. Sapat ang “sila” dahil malinaw ang tinutukoy sa naunang talata, samantalang pinananatili ng “mga tsismosa” ang pambabaeng sanggunian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Pinanatili ang pag-uulit ng ἀργαὶ sa pamamagitan ng magkaugnay na “magwalang-gawa” at “mga walang-gawa,” at inilagay ang mga pananda ng talababa sa mismong mga salitang may leksikal na alternatibo.
