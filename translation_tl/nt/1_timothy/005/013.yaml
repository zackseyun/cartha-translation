  to: Kasabay nito, natututo rin silang maging walang-gawa, habang nagpapalibot-libot sa mga bahay. Hindi lamang sila walang-gawa kundi mga tsismosa rin[a] at mapanghimasok[b], na nagsasabi ng mga bagay na hindi nila dapat sabihin.
  rationale: Binago ang parirala para sa pagpunta sa mga bahay upang maiwasan ang kahulugang paglipat ng tirahan at upang maipakita ang distributibong pag-iikot na nasa Griyego. Inayos din ang ikalawang “walang-gawa” sa mas likas na predikativong Tagalog, nang hindi binabago ang pag-uulit ng ἀργαὶ o ang saklaw ng pahayag.
