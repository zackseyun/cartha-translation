  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: tl
  text: Kung ang isang babaeng mananampalataya ay may mga biyuda[a], maglaan siya para sa kanila, at huwag pabigatan ang iglesya, upang makapaglaan ito para sa mga tunay na biyuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Kung ang sinumang mananampalatayang lalaki o babae ay may mga biyuda,” o “Kung ang sinumang mananampalataya ay may mga biyuda.” Sa mga pagbasa ring ito, hindi lamang babae ang saklaw ng tagubilin.'
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: isang babaeng mananampalataya
  rationale: Ang πιστή ay pambabae at isahan, kaya tiyak na babae ang tinutukoy sa tekstong SBLGNT. Ang “mananampalataya” ay natural na tumutukoy sa kaniyang pagkakakilanlang Kristiyano.
- source_word: ἔχει χήρας
  choice: may mga biyudang kamag-anak
  rationale: Literal itong “may mga biyuda,” ngunit sa konteksto ng pananagutan ng sambahayan, ipinahihiwatig ng ἔχει ang mga biyudang nasa pangangalaga o pamilya niya. Idinagdag ang “kamag-anak” upang maging malinaw at natural sa Tagalog nang hindi nililimitahan sa isang tiyak na ugnayang pampamilya.
- source_word: ἐπαρκείτω αὐταῖς
  choice: siya ang dapat maglaan para sa kanila
  rationale: Ang ἐπαρκέω ay praktikal at sapat na pagtulong o pagtustos. Ang “maglaan para” ay dignified at saklaw ang materyal na pangangalaga; ipinahahayag ng “dapat” ang lakas ng pautos na anyo.
- source_word: μὴ βαρείσθω
  choice: huwag pabigatan
  rationale: Pinananatili nito ang larawan ng obligasyong nagiging pasanin at natural itong pahayag sa modernong Tagalog.
- source_word: ἡ ἐκκλησία
  choice: ang iglesya
  rationale: Tumutukoy ito sa lokal na kapulungan o pamayanang Kristiyano. Ang “iglesya” ay karaniwan at malinaw sa kontekstong ito.
- source_word: ταῖς ὄντως χήραις
  choice: para sa mga tunay na biyuda
  rationale: 'Pinananatili ng “tunay” ang diin ng ὄντως at ang kategoryang binuo sa kabanata: mga biyudang tunay na naiwang walang ibang masasandalan at karapat-dapat sa tulong ng iglesya.'
- source_word: ἐπαρκέσῃ
  choice: makapaglaan ito para
  rationale: Inuulit ang salin ng ἐπαρκέω upang mapanatili ang leksikal na ugnayan ng tulong ng kamag-anak at ng iglesya. Ang “upang makapaglaan” ay malinaw na naghahayag ng layunin.
theological_decisions:
- issue: Kasarian ng simuno sa pambungad na sugnay
  choice: isang babaeng mananampalataya
  alternative: sinumang mananampalataya; sinumang mananampalatayang lalaki o babae
  rationale: Pambabae at isahan ang πιστή sa ibinigay na SBLGNT, kaya hindi ginawang neutral ang kasarian sa pangunahing teksto. Inilagay sa talababa ang mas malawak na pagbasa ng ibang mga manuskrito.
- issue: Kahulugan ng “mga tunay na biyuda”
  choice: panatilihin ang kategoryang “mga tunay na biyuda”
  alternative: mga biyudang talagang nangangailangan; mga biyudang walang ibang masasandalan
  rationale: Hindi tahasang pinalitan ang parirala ng paliwanag. Sa ganitong paraan, napapanatili ang pag-uugnay nito sa naunang talakayan ng kabanata at hindi labis na nilulutas sa mismong talata ang pamantayan ng pagiging “tunay” na biyuda.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “babaeng mananampalataya” upang eksaktong maipakita ang kasarian sa pangunahing tekstong Griyego; “maglaan para” para sa praktikal na pagtustos; at “iglesya” para sa kapulungang Kristiyano. Ang “kamag-anak” ay kontekstuwal na paglilinaw sa likas na Tagalog.
