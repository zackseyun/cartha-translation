  verdict: revise
  source_fidelity: Kailangang alisin ang “kamag-anak” sa pangunahing teksto at talababa. Wala itong tahasang katumbas sa χήρας (“mga biyuda”); bagaman maaaring ipahiwatig ng konteksto ang pananagutang pampamilya o sambahayan, hindi ito dapat gawing hayag na bahagi ng salin. Pinananatili ng rebisyon ang pambabaeng isahang simuno ng τις πιστή at ang layuning maibsan ang pasanin ng iglesya.
  naturalness: Natural at marangal ang “maglaan para sa kanila” at “huwag pabigatan ang iglesya.” Ang “may mga biyuda” ay bahagyang maigsi ngunit tapat na katumbas ng Griyegong ἔχει χήρας at hindi nagdaragdag ng isang partikular na uri ng ugnayan.
  terminology: Ang “babaeng mananampalataya,” “biyuda,” at “iglesya” ay angkop sa modernong Filipino Tagalog at tumutugma sa mga pangunahing termino ng pinagmulan. Ang “mga tunay na biyuda” ay wastong pinananatili bilang kategoryang hindi labis na binibigyang-kahulugan.
