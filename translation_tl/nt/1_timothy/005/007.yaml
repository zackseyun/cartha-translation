  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: tl
  text: At iutos mo ang mga bagay na ito[a], upang walang maipupuna sa kanila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ituro” o “ipagbilin”; may lakas ng awtoritatibong pag-uutos ang pandiwa.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang tinutukoy sa Griyego kung sino ang “kanila.” Sa konteksto, malamang na tumutukoy ito sa mga taong saklaw ng naunang mga tagubilin, lalo na sa mga biyuda at kanilang mga pamilya.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At ... rin
  rationale: Ipinagdurugtong nito ang utos sa naunang tagubilin; likas sa modernong Tagalog ang “rin” upang ipakitang karagdagan ito nang hindi nagdaragdag ng diwa.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangkalahatang pagtukoy ng panghalip sa mga nauna at kaugnay na tagubilin, sa halip na gawing mas tiyak na “mga tagubiling ito.”
- source_word: παράγγελλε
  choice: iutos mo
  rationale: Ipinahahayag ang makapangyarihang lakas ng pangkasalukuyang pautos; mas matindi ito kaysa “ituro” ngunit natural pa rin sa Tagalog.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang nagpapahayag ng layunin o nilalayong bunga.
- source_word: ἀνεπίλημπτοι
  choice: hindi ... mapulaan
  rationale: Tumutukoy sa pagiging walang makatuwirang maipupula o maipaparatang, nang hindi ipinahihiwatig ang ganap na kawalang-kasalanan.
- source_word: ὦσιν
  choice: sila
  rationale: Likas na naipapaloob sa pariralang “hindi sila mapulaan” ang pandiwang ‘maging’; pinananatili ng pangmaramihang “sila” ang di-tiyak na simuno ng Griyego.
theological_decisions:
- issue: Ang tinutukoy ng di-hayag na pangmaramihang simuno ng ὦσιν
  choice: Ginamit ang pangkalahatang “sila” nang hindi tinutukoy sa pangunahing teksto kung sino ang grupo.
  alternative: Tahasang tukuyin ang mga biyuda at kanilang mga pamilya; o unawain itong tumutukoy kay Timoteo at/o sa mas malawak na sambayanan.
  rationale: Hindi tahasang binanggit sa Griyego ang simuno. Malamang na tumutukoy ito sa mga taong saklaw ng naunang mga tagubilin, lalo na sa mga biyuda at kanilang mga pamilya, ngunit nararapat panatilihin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang “hindi mapulaan” ay karaniwang mauunawaan at iniiwasan ang posibleng absolutong dating ng “walang kapintasan.”
