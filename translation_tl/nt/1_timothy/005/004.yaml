id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: tl
  text: Ngunit kung ang isang biyuda ay may mga anak o mga apo[a], dapat muna nilang matutuhang isabuhay ang pagiging maka-Diyos sa sarili nilang sambahayan[b] at suklian ang kanilang mga magulang o mga ninuno[c], sapagkat ito ay katanggap-tanggap sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak o mga inapo.” Maaaring mas malawak kaysa “mga apo” ang salitang Griyego na ἔκγονα.
    reason: lexical_alternative
  - marker: b
    text: O “isabuhay ang debosyon sa Diyos sa sarili nilang pamilya.” Inuugnay ng salitang Griyego ang pag-aaruga sa pamilya sa pagiging maka-Diyos.
    reason: lexical_alternative
  - marker: c
    text: Maaaring isalin na “mga magulang” o “mga ninuno.” Ang salitang Griyego ay tumutukoy sa mga naunang salinlahi ng pamilya at hindi tiyak kung gaano kalawak ang saklaw nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: biyuda
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa babaeng namatayan ng asawa; ito ang paksa ng talata.
- source_word: τέκνα ἢ ἔκγονα
  choice: mga anak o mga apo
  rationale: Ang τέκνα ay mga anak, at bagaman maaaring mas malawak ang ἔκγονα bilang mga inapo, sa konteksto ng agarang pananagutan ng pamilya ay likas ang “mga apo.”
- source_word: μανθανέτωσαν πρῶτον
  choice: dapat muna nilang matutuhang
  rationale: Ipinahahayag ang pautos na lakas ng ikatlong panauhang pangmaramihan at ang prayoridad na ipinahihiwatig ng πρῶτον sa natural na Filipino.
- source_word: τὸν ἴδιον οἶκον εὐσεβεῖν
  choice: ipakita ang kanilang pagiging maka-Diyos sa sarili nilang sambahayan
  rationale: Pinananatili ang relihiyosong diwa ng εὐσεβεῖν at ang sambahayan o yunit ng pamilya na tinutukoy ng οἶκος, hindi lamang ang pisikal na bahay.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: suklian
  rationale: Natural at maikli itong nagpapahayag ng pagbabalik ng kabutihan o pag-aarugang naunang tinanggap.
- source_word: τοῖς προγόνοις
  choice: ang kanilang mga magulang at ninuno
  rationale: Ipinakikita ang agarang henerasyon na malamang na nasa isip habang pinananatili ang mas malawak na saklaw ng πρόγονοι; nililinaw sa talababa ang alternatibong saklaw.
- source_word: ἀπόδεκτον ἐνώπιον τοῦ θεοῦ
  choice: kalugod-lugod sa harap ng Diyos
  rationale: Natural na Filipino na nagpapahayag na ang gayong asal ay tinatanggap nang may pagsang-ayon sa pagsusuri ng Diyos.
theological_decisions:
- issue: Tinutukoy ng pangmaramihang pautos na μανθανέτωσαν
  choice: Ang utos ay para sa mga anak o mga apo ng biyuda.
  alternative: Ang utos ay para sa mga biyuda sa pangkalahatan, na may ipinahihiwatig na paksa o pagbabago sa bilang.
  rationale: Ang pinakamalapit at pinakanatural na pangmaramihang tinutukoy ay τέκνα ἢ ἔκγονα. Kaayon din ito ng tungkulin nilang pangalagaan ang biyuda at suklian ang naunang salinlahi.
- issue: Diwa ng εὐσεβεῖν kaugnay ng pag-aaruga sa pamilya
  choice: Ang pag-aaruga sa sariling sambahayan ay pagpapakita ng pagiging maka-Diyos.
  alternative: Ang salita ay tumutukoy lamang sa pagtupad ng tungkuling pampamilya nang walang malinaw na relihiyosong diwa.
  rationale: May tahasang diwa ng kabanalan o debosyon ang εὐσεβεῖν, at iniuugnay ng talata ang praktikal na pag-aaruga sa bagay na kalugod-lugod sa Diyos.
- issue: Saklaw ng τοῖς προγόνοις
  choice: Isinalin bilang “mga magulang at ninuno,” na sumasaklaw sa naunang mga salinlahi ng pamilya.
  alternative: “mga magulang” lamang o “mga ninuno” lamang.
  rationale: Maaaring tumukoy ang πρόγονοι sa mga magulang o sa mas malawak na mga ninuno. Hindi dapat lubhang paliitin ang saklaw, ngunit hinihingi ng konteksto ang buhay na nakatatandang kamag-anak na maaaring alagaan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “biyuda,” “sambahayan,” at “maka-Diyos” upang mapanatili ang kontekstong pampamilya at teolohikal. Ang “dapat muna nilang matutuhang” ay malinaw na nag-uugnay sa utos sa mga anak o apo.
