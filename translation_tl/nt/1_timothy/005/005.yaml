  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: tl
  text: Ngunit ang tunay na balo, na naiwang nag-iisa[a], ay naglagak ng kanyang pag-asa sa Diyos[b] at nagpapatuloy sa mga pagsusumamo at mga panalangin gabi at araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naiwang mag-isa” o “nag-iisa.” Binibigyang-diin ng anyong Griyego ang kalagayan niyang walang sumusuportang pamilya.
    reason: lexical_alternative
  - marker: b
    text: O “umasa sa Diyos.” Maaaring idiin ng anyong Griyego ang isang naitatag nang pag-asa na may nagpapatuloy na bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang pag-iiba o paglipat mula sa naunang paglalarawan ng balong may pamilyang makatutulong; hindi ito isinaling temporal na “ngayon.”
- source_word: ὄντως χήρα
  choice: tunay na balo
  rationale: Pinananatili ang diwa ng isang balong talagang kabilang sa kategoryang inilalarawan ng konteksto, hindi lamang ang katawagang panlipunan.
- source_word: μεμονωμένη
  choice: naiwang nag-iisa
  rationale: Ipinakikita ng perfect participle ang kalagayang bunga ng pagkaiwang walang kasama o maaasahang suporta.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: naglagak ng kanyang pag-asa sa Diyos
  rationale: Ipinahihiwatig ng perfect ang isang naitatag nang pag-asa na nananatili ang bunga; natural din sa Filipino ang pariralang ito.
- source_word: προσμένει
  choice: nagpapatuloy
  rationale: Tumpak na inilalarawan ang patuloy at namamalaging gawain nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: sa mga pagsusumamo at mga panalangin
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkaibang termino: tiyak at taimtim na mga pakiusap, at panalangin sa mas pangkalahatang diwa.'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: gabi at araw
  rationale: Pinananatili ang ayos ng Griyego at ang idyomang nagpapahiwatig ng palagiang gawain.
theological_decisions:
- issue: Paglalarawan sa “tunay na balo”
  choice: Inilalarawan ang balong tunay na kuwalipikado sa konteksto bilang naiwang walang suporta, umaasa sa Diyos, at nagpapatuloy sa panalangin.
  alternative: Paglalarawan lamang ito sa lahat ng balo at hindi nagpapahiwatig ng anumang pagkilala sa isang natatanging pangkat.
  rationale: Ang ὄντως at ang malapit na konteksto ng 1 Timoteo 5 ay nagtatangi ng isang partikular na kalagayan ng pagkabalo, ngunit hindi nagdaragdag ang salin ng anumang denominasyonal na sistema.
- issue: Lakas ng perfect sa ἤλπικεν
  choice: “naglagak ng kanyang pag-asa” upang ipakita ang naitatag at nagpapatuloy na pagtitiwala
  alternative: “umaasa” o “umasa” sa Diyos
  rationale: Iniiwasang mawala ang resultang nagpapatuloy mula sa perfect, ngunit inilalagay sa talababa ang mas payak na alternatibo.
translation_notes:
  register: Makabago at marangal na Filipino; madaling maunawaan ngunit pinananatili ang pagkakaiba ng “mga pagsusumamo” at “mga panalangin.” Ginamit ang “Ngunit” bilang banayad na panandang salungat para sa δὲ.
