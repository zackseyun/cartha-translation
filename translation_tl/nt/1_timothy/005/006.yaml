  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: tl
  text: Ngunit ang babaeng namumuhay para sa kalayawan ay patay kahit nabubuhay pa siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namumuhay sa pagpapakasasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: nagpapakasasa sa layaw
  rationale: Ipinahihiwatig ng kasalukuyang pandiwaring Griyego ang nagpapatuloy na pamumuhay sa labis at makasariling pagpapasarap, hindi ang karaniwang pagtatamasa lamang. Likas sa modernong Tagalog ang parirala at napapanatili nito ang negatibong diin.
- source_word: ζῶσα
  choice: kahit nabubuhay pa siya
  rationale: 'Ipinakikita ng concessive na “kahit” ang sinadyang kabalintunaan: buhay siya sa pisikal na diwa ngunit inilalarawang patay. Ang “pa” ay nagpapalinaw sa kasalukuyang kalagayan nang hindi dinaragdagan ang teolohiya ng teksto.'
- source_word: τέθνηκεν
  choice: ay patay
  rationale: Ang perpektong anyo ay tumutukoy sa umiiral na kalagayang bunga ng pagkamatay; tuwirang naihahayag ng “ay patay” ang resultant state at napapanatili ang talinghaga.
- source_word: ἡ ... σπαταλῶσα
  choice: ang babaeng nagpapakasasa sa layaw
  rationale: Ang pambabaeng isahan na artikulo at pandiwari ay ginagamit bilang pangngalan. Pinananatili ng “ang babaeng” ang kasarian at sanggunian sa konteksto nang hindi tahasang idinaragdag ang “balo,” na wala sa mismong talata.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan nito ang malinaw na pagsalungat sa babaeng inilarawan sa naunang talata bilang umaasa sa Diyos at nagpapatuloy sa pananalangin.
theological_decisions:
- issue: Kalikasan ng pagiging “patay” habang nabubuhay
  choice: Pinanatili bilang di-tiyak na metaporikal na kamatayan habang pisikal na buhay
  alternative: Tahasang tukuyin bilang patay sa espiritu, patay sa moral, o itinuring na patay sa lipunan
  rationale: Lumilikha ang Griyego ng sinadyang kabalintunaan ngunit hindi nito tahasang nililimitahan ang “patay” sa isang teknikal na kategorya. Pinananatili ng salin ang teolohikal at moral na tensiyon sa halip na lutasin ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “layaw” sa kahulugang labis at makasariling pagpapasarap, hindi simpleng kasiyahan; inilagay ang panandang talababa [a] sa pangunahing teksto.
