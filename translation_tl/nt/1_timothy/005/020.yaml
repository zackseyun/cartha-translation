base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: tl
  text: Ang mga nagkakasala[a][b] ay sawayin mo sa harap ng lahat, upang matakot din ang iba pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga patuloy na nagkakasala”; ang anyo ng pandiwa ay maaaring magpahiwatig ng nagpapatuloy na pagkakasala.
    reason: lexical_alternative
  - marker: b
    text: Dahil sa agarang konteksto, maaaring partikular na tinutukoy ang mga nagkakasalang matanda ng iglesya, bagaman “ang mga nagkakasala” lamang ang sinasabi ng talatang ito.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: ang mga patuloy na nagkakasala
  rationale: Ang substantival na present participle ay tumutukoy sa mga gumagawa ng kasalanan at maaaring magpahiwatig ng nagpapatuloy na asal. Natural sa modernong Tagalog ang pariralang ito, bagaman hindi nito ibig sabihing walang pagsisisi sa bawat pagkakataon.
- source_word: ἐνώπιον πάντων
  choice: sa harap ng lahat
  rationale: Malapit ito sa literal na diwa ng Griyego at malinaw na pinananatili ang hayagang konteksto nang hindi pinapalitan ng mas interpretatibong “hayagan.”
- source_word: ἔλεγχε
  choice: sawayin
  rationale: Sa kontekstong pandisiplina, ipinahihiwatig ng ἐλέγχω ang pagharap at pagtutuwid sa nagkasala. Ang “sawayin” ay natural at marangal sa Tagalog; hindi nito labis na idinidiin ang paglalantad lamang.
- source_word: οἱ λοιποὶ
  choice: ang iba
  rationale: Natural na tumutukoy ito sa ibang mga kabilang sa pangkat o komunidad, bukod sa mga sinasaway.
- source_word: φόβον ἔχωσιν
  choice: matakot
  rationale: Ito ang natural na salin ng idyomang “magkaroon ng takot.” Pinananatili nitong bukas kung ang takot ay pangamba sa disiplina o mapitagang pag-iingat.
theological_decisions:
- issue: Saklaw ng mga nagkakasala sa konteksto
  choice: Hindi tahasang idinagdag ang “mga tagapangasiwa” o “mga matanda” sa pangunahing teksto.
  alternative: Maaaring partikular na tumukoy ang talata sa mga nagkakasalang matanda ng iglesya dahil sa agarang konteksto ng talata 19–20.
  rationale: Ang mismong Griyego ng talata ay nagsasabing “ang mga nagkakasala” lamang. Pinananatili ng salin ang malawak na pahayag habang inilalagay sa talababa ang posibleng mas tiyak na reperente.
- issue: Uri ng takot
  choice: matakot
  alternative: magkaroon ng banal na pagkatakot o mangamba sa kaparusahan
  rationale: Hindi tinutukoy ng φόβος kung ito ay mapitagang takot, pangamba sa disiplina, o kapwa. Hindi ito nilinaw nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa iglesia. Ginamit ang bahagyang pormal na ayos na “ay ... mo sawayin” upang mapanatiling malinaw ang diin sa hayagang pagsaway, ngunit iniwasan ang makaluma o teknikal na bokabularyo.
