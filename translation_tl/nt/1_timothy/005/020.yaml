    issue: Ang “patuloy na” ay nasa pangunahing teksto.
    rationale: Posibleng implikasyon lamang ng present participle ang patuloy na pagkakasala; ang pangunahing salin ay dapat manatiling “mga nagkakasala,” gaya ng pinananatili rin ng English audit trail.
  - severity: low
