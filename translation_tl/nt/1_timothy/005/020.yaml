  source_fidelity: Ang pangunahing teksto ay nagdaragdag ng aspektong mas malakas kaysa sa kinakailangan sa pamamagitan ng “patuloy na nagkakasala.” Ang present participle na τοὺς ἁμαρτάνοντας ay maaaring magpahiwatig ng nagpapatuloy na gawa, ngunit hindi nito tahasang hinihingi iyon. Mas tumpak na ilagay ang “patuloy” bilang alternatibo sa talababa. Ang “sawayin mo sa harap ng lahat” ay wastong naghahatid ng ἔλεγχε at ἐνώπιον πάντων; ang “iba pa” ay mas malinaw na katumbas ng οἱ λοιποί.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Ang mga nagkakasala ay sawayin mo sa harap ng lahat.” Ang ayos na ito ay malinaw at angkop sa isang tagubilin. Ang “upang matakot din ang iba pa” ay natural at pinananatili ang di-tiyak na saklaw ng φόβος.
  terminology: Ang “mga nagkakasala” ay angkop para sa ἁμαρτάνοντας, “sawayin” para sa ἔλεγχε, at “matakot” para sa φόβον ἔχωσιν. Hindi dapat idagdag sa pangunahing teksto ang “mga matanda ng iglesya,” dahil hindi ito inuulit sa talata, bagaman ang konteksto ay maaaring tumukoy sa kanila.
  issues:
