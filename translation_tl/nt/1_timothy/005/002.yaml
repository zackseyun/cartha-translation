  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: tl
  text: ang matatandang babae gaya ng mga ina, at ang mga nakababatang babae gaya ng mga kapatid na babae, nang may buong kadalisayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang may ganap na kalinisang-puri.” Sa kontekstong ito, ang “kadalisayan” ay may matibay ding diwa ng kalinisang seksuwal o wastong asal sa pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: matatandang babae
  rationale: Tumutukoy ito sa edad, hindi sa katungkulan sa iglesia, at tuwirang inihahambing sa νεωτέρας.
- source_word: ὡς μητέρας
  choice: na parang mga ina
  rationale: Likas sa modernong Tagalog ang “parang” para sa paghahambing na ipinahahayag ng ὡς, at hindi idinaragdag ang “iyong,” na wala sa Griyego.
- source_word: νεωτέρας
  choice: mga nakababatang babae
  rationale: Pinananatili nito ang paghahambing ayon sa edad at malinaw itong nauunawaan sa kasalukuyang Filipino.
- source_word: ὡς ἀδελφὰς
  choice: na parang mga kapatid na babae
  rationale: Pinananatili ang larawang pampamilya at nililinaw sa Tagalog na mga babaeng kapatid ang tinutukoy.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: nang may lubos na kadalisayan
  rationale: Ipinahahayag ng “nang may” ang paraan ng pakikitungo; sinasalamin ng “lubos” ang πάσῃ, samantalang pinananatili ng “kadalisayan” ang malawak na saklaw ng ἁγνεία, kabilang ang kalinisang seksuwal nang hindi rito lamang nililimitahan.
theological_decisions:
- issue: Saklaw ng ἁγνεία sa pakikitungo sa mga nakababatang babae
  choice: kadalisayan
  alternative: kalinisang-puri; ganap na kalinisang seksuwal
  rationale: Maaaring tumukoy ang ἁγνεία sa malawak na moral na kadalisayan habang mariing kabilang sa konteksto ang wastong asal na seksuwal. Hindi nililimitahan ng pangunahing teksto ang kahulugan, at ipinapaliwanag ng talababa ang mahalagang pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “parang” upang maging natural ang paghahambing, at “mga kapatid na babae” upang maiwasan ang kalabuan ng pangkalahatang “mga kapatid.”
