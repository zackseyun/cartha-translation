  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: tl
  text: Itala lamang sa talaan ang isang biyuda kung siya ay hindi bababa sa animnapung taong gulang, na naging asawa ng iisang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang babaeng tapat sa iisang lalaki.” Maaaring tumukoy ang parirala sa katapatan o mabuting reputasyon niya sa pag-aasawa, bagaman inuunawa ito ng ilan bilang “minsan lamang nag-asawa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: biyuda
  rationale: Karaniwang makabagong salitang Filipino para sa babaeng namatayan ng asawa; ang konteksto ay tungkol sa mga biyudang opisyal na isinasama sa talaan.
- source_word: καταλεγέσθω
  choice: ilagay ... sa talaan
  rationale: Ipinahahayag nito ang administratibong diwa ng opisyal na pagtatala, hindi lamang pagsasaalang-alang.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα
  choice: kung siya ay hindi bababa sa animnapung taong gulang
  rationale: Malinaw at natural na ipinapakita ang itinakdang pinakamababang edad.
- source_word: γεγονυῖα
  choice: siya ay ... taong gulang
  rationale: Sa pariralang tumutukoy sa edad, idiomatikong ipinahahayag ng participle ang kalagayang naabot na; natural itong ginawang tahasang sugnay sa Filipino.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: naging asawa ng iisang lalaki
  rationale: Pinananatili hangga't maaari ang anyo at tunay na kalabuan ng idyomang Griego, sa halip na tahasang ipakahulugan bilang minsan lamang nag-asawa o bilang tapat sa asawa.
theological_decisions:
- issue: Kahulugan ng ἑνὸς ἀνδρὸς γυνή
  choice: Panatilihin sa pangunahing teksto ang idyomatikong “naging asawa ng iisang lalaki.”
  alternative: “tapat sa kanyang asawa” o “minsan lamang nag-asawa”
  rationale: Maaaring tumukoy ang parirala sa katapatan at mabuting reputasyon sa pag-aasawa, ngunit inuunawa rin ito ng ilan bilang minsan lamang nag-asawa. Hindi lubos na nilulutas ng Griego ang usapin, kaya hindi pinili sa pangunahing teksto ang alinman sa mas tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilagay sa talaan” para sa opisyal na pagpapalista at pinanatili ang kalabuan ng huling parirala sa tulong ng talababa.
