id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: tl
  text: Gayundin, hayag ang mabubuting gawa, at ang mga hindi gayon[a] ay hindi maaaring manatiling nakatago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga naiiba” o “ang mga hindi gayon.” Nauunawaan ito ng ilan bilang partikular na masasamang gawa, batay sa pagkakatulad sa naunang talata.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: Gayundin
  rationale: Likas na ipinahahayag sa Filipino ang mahigpit na pagkakaugnay at paghahambing nito sa naunang talata; hindi kailangang artipisyal na tumbasan nang magkahiwalay ang dalawang salitang Griyego.
- source_word: ἔργα τὰ καλά
  choice: mabubuting gawa
  rationale: Karaniwan, malinaw, at marangal na katumbas na pinananatili ang kongkretong diwa ng mga gawa at ang kanilang kabutihang moral.
- source_word: πρόδηλα
  choice: hayag
  rationale: Maikli at natural na katumbas ng pagiging lantad o madaling makilala, na tuwirang kasalungat ng pagiging nakatago.
- source_word: τὰ ἄλλως ἔχοντα
  choice: ang mga hindi gayon
  rationale: Pinananatili ang sadyang malawak na paghahambing ng Griyego nang hindi tahasang tinatawag na masasama ang mga gawa; maaaring tumukoy sa mga gawang hindi hayag sa gayunding paraan.
- source_word: κρυβῆναι οὐ δύνανται
  choice: ay hindi maaaring manatiling nakatago
  rationale: Ipinahahayag ang kawalan ng kakayahang patuloy na maitago, na angkop sa konteksto ng mga gawang nahahayag kalaunan.
theological_decisions:
- issue: Kung ang τὰ ἄλλως ἔχοντα ay partikular na tumutukoy sa masasamang gawa o mas malawak sa mga gawang hindi hayag sa gayunding paraan
  choice: mga gawang hindi gayon, nang hindi tinutukoy kung masama ang mga ito
  alternative: masasamang gawa
  rationale: Hindi tahasang sinasabi ng Griyego ang “masama.” Pinananatili ng saling ito ang kalabuan at hinahayaan ang konteksto na magpahiwatig kung ang kaibhan ay moral o tungkol sa pagiging lantad.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hayag” at “manatiling nakatago” bilang natural na magkatunggaling pahayag; iniwasang dagdagan ng “masama” ang sadyang di-tiyak na pariralang Griyego.
