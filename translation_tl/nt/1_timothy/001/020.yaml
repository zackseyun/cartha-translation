  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: tl
  text: Kabilang sa kanila sina Himeneo at Alejandro, na ibinigay ko kay Satanas[a] upang maturuan silang huwag lumapastangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinaubaya ko kay Satanas.” Malamang na tumutukoy ang parirala sa isang mabigat na hakbang ng pagdidisiplina na naglalayong magwasto, hindi sa pangwakas na paghatol.
    reason: lexical_alternative
  - marker: b
    text: Ang “maturuan” ay maaari ring isaling “madisiplina,” “masanay,” o “maituwid.” Saklaw ng salitang Griyego ang pagtuturong may kasamang pagwawasto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Kabilang sa kanila
  rationale: 'Likas na Filipino ito na pinananatili ang partitive na diwa: sina Himeneo at Alejandro ay kabilang sa grupong binanggit sa naunang konteksto.'
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: sina Himeneo at Alejandro
  rationale: Ginamit ang kinagawiang anyong Filipino ng mga pangalang biblikal at ang pantukoy na “sina” para sa dalawang tao.
- source_word: οὓς παρέδωκα τῷ Σατανᾷ
  choice: na ibinigay ko kay Satanas
  rationale: Pinananatili ang matindi ngunit sadyang hindi ganap na ipinaliwanag na larawan ng παραδίδωμι. Ang payak na nagdaang “ibinigay ko” ay tuwirang tumutugma sa aorist at natural sa Filipino.
- source_word: ἵνα παιδευθῶσι
  choice: upang maturuan sila
  rationale: Ang παιδεύω ay maaaring tumukoy sa pagtuturo, pagsasanay, o pagdidisiplinang nagwawasto. Ang “maturuan” ay natural at pinananatili ang layuning magbago, habang nililinaw sa talababa ang mas malawak na diwa.
- source_word: μὴ βλασφημεῖν
  choice: huwag lumapastangan
  rationale: Ang “lumapastangan” ay dignified at madaling maunawaang salin ng βλασφημέω, na nagpapahiwatig ng walang-galang at mapanirang pananalita sa sagradong kontekstong ito.
theological_decisions:
- issue: Kahulugan ng “ibinigay kay Satanas”
  choice: Pinanatiling literal ang parirala at ipinahiwatig lamang sa talababa na may layuning magwasto ang hakbang.
  alternative: Tahasang tukuyin ito bilang pagtitiwalag sa iglesya, mahimalang pagpapahirap sa katawan, o pangwakas na paghatol.
  rationale: Hindi tinutukoy ng talata ang eksaktong mekanismo. Ipinakikita ng sugnay na may layunin itong magturo o magwasto, kaya hindi dapat ipakahulugan sa salin bilang pangwakas na kapahamakan.
- issue: Saklaw ng παιδευθῶσι
  choice: “maturuan,” na may talababa tungkol sa pagdidisiplina at pagwawasto
  alternative: “madisiplina” sa pangunahing teksto
  rationale: Pinananatili ng “maturuan” ang formative na layunin ng salita; kinikilala naman ng talababa ang corrective at disciplinary na puwersa nito sa konteksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang literal at teolohikal na tensiyon ng “ibinigay kay Satanas,” habang ang mga posibleng kahulugan ng παιδεύω ay inilagay sa talababa sa halip na paliitin sa pangunahing teksto.
