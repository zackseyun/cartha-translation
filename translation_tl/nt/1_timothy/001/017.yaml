  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: tl
  text: Sa Hari ng mga kapanahunan—walang kamatayan, di-nakikita, at tanging Diyos[a]—sumakanya ang karangalan at kaluwalhatian magpakailanman. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ang tanging marunong na Diyos.”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Hari ng lahat ng panahon
  rationale: Pinananatili ang diwa ng genitibong parirala at ng αἰών bilang mga panahon o kapanahunan, ngunit gumagamit ng mas natural na Filipino kaysa sa literal na “Hari ng mga kapanahunan.”
- source_word: ἀφθάρτῳ
  choice: walang kamatayan
  rationale: Sa pagtukoy sa Diyos, malinaw at likas nitong ipinahahayag na hindi siya saklaw ng pagkabulok o kamatayan; mas madaling maunawaan ito kaysa sa “hindi nasisira.”
- source_word: ἀοράτῳ
  choice: hindi nakikita
  rationale: Tuwiran, malinaw, at karaniwang katumbas ng ἀόρατος sa modernong Filipino.
- source_word: μόνῳ θεῷ
  choice: tanging Diyos
  rationale: Tuwirang pinananatili ang eksklusibong puwersa ng μόνῳ at ang monoteistikong pahayag ng teksto nang walang idinadagdag na paliwanag.
- source_word: τιμὴ καὶ δόξα
  choice: karangalan at kaluwalhatian
  rationale: Tumpak at nakaugaliang pares sa marangal na wikang panrelihiyon, habang nananatiling madaling maunawaan.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Likas na idyomatikong Filipino para sa pormulang nagsasaad ng walang-hanggang tagal; ang mas literal na “sa mga panahon ng mga panahon” ay hindi natural.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinagawiang transliterasyon sa mga Bibliya at pagsamba sa Filipino.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahina ang puwersa nitong pang-ugnay sa doxolohiya. Ang pagdaragdag ng “ngayon” ay magmumungkahi ng panahong wala naman sa salitang Griyego, at hindi kailangan ang hiwalay na pang-ugnay sa natural na Filipino.
theological_decisions:
- issue: Pagpapanatili sa monoteistikong puwersa ng μόνῳ θεῷ nang hindi nilulutas sa salin ang mas malawak na teolohikal na ugnayan nito sa mga pahayag tungkol kay Cristo
  choice: tanging Diyos
  alternative: Diyos lamang
  rationale: Direkta nitong ipinahahayag ang nasa teksto. Walang idinagdag na paliwanag o kwalipikasyong doktrinal, kaya nananatili ang teolohikal na tensiyon ng mismong talata.
- issue: Tekstuwal na baryanteng may σοφῷ (“marunong”)
  choice: Hindi isinama ang “marunong” sa pangunahing teksto
  alternative: ang tanging marunong na Diyos
  rationale: Walang σοφῷ sa ibinigay na SBLGNT source text. Gayunman, mahalagang ipabatid sa talababa ang mas mahabang pagbasa na matatagpuan sa ilang manuskrito.
- issue: Puwersa ng walang pandiwang doxolohiya
  choice: “ang karangalan at kaluwalhatian” nang hindi nagdaragdag ng tahasang pandiwa
  alternative: sumakanya ang karangalan at kaluwalhatian
  rationale: Sinasalamin nito ang maigsi at maringal na estruktura ng Griyego, kung saan walang tahasang pandiwa. Nauunawaan pa rin sa Filipino ang doxolohikal na diwang “mapasakanya” nang hindi ito ipinapasok sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga gitling na pahaba upang malinaw na ipakitang ang “walang kamatayan, hindi nakikita, at tanging Diyos” ay magkakaugnay na paglalarawan sa Hari. Inilagay ang talababa sa “Diyos,” kung saan aktuwal na nauugnay ang tekstuwal na baryante.
