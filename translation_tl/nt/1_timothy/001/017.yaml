  - severity: medium
    issue: Kulang ng malinaw na doxolohikal na predikasyon ang pangunahing pangungusap sa Filipino.
    rationale: Bagaman walang tahasang pandiwa ang Griyego, ang “Sa Hari … ang karangalan” ay hindi ganap na pangungusap sa modernong Filipino. Ang “sumakanya” ay isang likas na paraan upang ihayag ang ipinahihiwatig na “be,” nang walang idinagdag na doktrina.
