  source_fidelity: Ang pangunahing diwa at lahat ng mahahalagang katawagan ay wastong naipapahayag. Gayunman, ang “lahat” sa “Hari ng lahat ng panahon” ay isang hindi tahasang salitang dagdag sa genitibong τῶν αἰώνων. Mas malapit at natural pa rin ang “Hari ng mga kapanahunan.” Mahalaga ring ipahayag ang ipinahihiwatig na doxolohikal na pagbibigay—“sumakanya”—upang maging ganap at malinaw sa Filipino ang walang-pandiwang Griyegong konstruksyon.
  naturalness: Marangal at madaling maunawaan ang rehistro, ngunit ang “Sa Hari … ang karangalan at kaluwalhatian” ay bitin sa karaniwang modernong Filipino. Ang “sumakanya ang karangalan at kaluwalhatian” ay likas na doxolohikal na pananalita at hindi nagpapalit ng kahulugan.
  terminology: Ang “walang kamatayan,” “di-nakikita,” “tanging Diyos,” “karangalan at kaluwalhatian,” at “magpakailanman” ay angkop. Ang “di-nakikita” ay bahagyang mas matipid at mas natural bilang magkatambal na paglalarawan sa marangal na rehistrong ito. Wasto ang talababa tungkol sa variant na may “marunong.”
