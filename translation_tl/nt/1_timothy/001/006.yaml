  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: tl
  text: Ang ilan ay nabigong maabot ang mga ito[a] at lumihis patungo sa walang saysay na usapan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumihis mula sa mga ito.” Ang pandiwa ay maaaring mangahulugang hindi pagtama sa isang layunin o paglihis mula rito.
    reason: lexical_alternative
  - marker: b
    text: O “hungkag na talakayan” o “walang kabuluhang pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: sa mga ito
  rationale: Tumutukoy pabalik sa mga katangiang binanggit sa talata 5. Likas sa Tagalog ang pariralang ito at hindi nito nililimitahan nang labis ang tinutukoy.
- source_word: τινες
  choice: May ilang
  rationale: Pinananatili nito ang di-tiyak na pagtukoy sa isang pangkat nang hindi tinutukoy kung sinu-sino sila.
- source_word: ἀστοχήσαντες
  choice: hindi nakaabot
  rationale: Ipinahahayag nito ang diwa ng hindi pagtama o hindi pagkamit sa isang layunin. Pinananatili rin nito ang ugnayan sa mga katangiang naunang binanggit.
- source_word: ἐξετράπησαν
  choice: lumihis
  rationale: Natural at malinaw na salin para sa pagtalikod o paglihis mula sa tamang landas; aktibo ang anyo sa Tagalog gaya ng idiomatikong gamit ng pandiwang Griyego.
- source_word: εἰς
  choice: tungo sa
  rationale: Ipinakikita ang direksiyon at kinalabasan ng kanilang paglihis.
- source_word: ματαιολογίαν
  choice: walang saysay na usapan
  rationale: Malinaw sa ordinaryong mambabasa at sumasaklaw sa usapang hungkag, walang kabuluhan, o walang pakinabang.
theological_decisions:
- issue: Tinutukoy ng panghalip na ὧν
  choice: Tumutukoy ito sa mga naunang layuning etikal at espirituwal sa talata 5, na isinaling “sa mga ito.”
  alternative: Maaaring tukuyin ito nang mas makitid bilang ang dalisay na puso, malinis na budhi, at tapat na pananampalataya; maaari rin itong isaling mas literal na “mula sa mga iyon.”
  rationale: Pinananatili ng “sa mga ito” ang pabalik na pagtukoy nang hindi ipinipilit ang isang mas makitid na interpretasyon.
- issue: Metapora ng ἀστοχέω
  choice: Hindi nakaabot sa mga ito
  alternative: Lumihis mula sa mga ito; hindi natamo ang mga ito
  rationale: Pinananatili nito ang ideya ng pagkabigong maabot ang layunin, habang iniiwasang gawing magkapareho ang ἀστοχήσαντες at ang kasunod na ἐξετράπησαν.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “usapan” sa halip na mas pormal na “talakayan” sa pangunahing teksto, at iniwasan ang arkaikong bokabularyo.
