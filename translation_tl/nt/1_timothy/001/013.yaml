  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: tl
  text: Dati akong lapastangan, mang-uusig, at marahas na tao[a]. Ngunit kinahabagan ako[b], sapagkat kumilos ako nang walang kaalaman[c] at sa kawalan ng pananampalataya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapang-abusong tao” o “malupit na tao.” Ang salitang Griyego ay tumutukoy sa mapanghamak at sukdulang marahas na paggawi, hindi lamang sa pagmamataas.
    reason: lexical_alternative
  - marker: b
    text: O “tumanggap ako ng awa.”
    reason: lexical_alternative
  - marker: c
    text: O “sa kamangmangan” o “nang hindi ko nalalaman.”
    reason: lexical_alternative
  - marker: d
    text: O “sa kawalan ng katapatan.” Sa kontekstong ito, pinakamalamang na kawalan ng pananampalataya ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: bagaman dati akong
  rationale: Iniuugnay ng pariralang participyal ang paglalarawan kay Pablo sa naunang talata. Likas sa modernong Tagalog ang “dati akong,” at ang “bagaman” ay nagpapakita ng concessive na ugnayan sa pahayag ng talata 12.
- source_word: βλάσφημον
  choice: isang lapastangan
  rationale: Ang pangngalan ay tumutukoy sa taong nagsasalita o kumikilos nang mapanlapastangan; ang “lapastangan” ay tuwiran at marangal na katumbas sa kontekstong panrelihiyon.
- source_word: διώκτην
  choice: mang-uusig
  rationale: Karaniwang Tagalog na katawagan ito sa taong umuusig, at angkop sa dating pag-uusig ni Pablo sa iglesya.
- source_word: ὑβριστήν
  choice: marahas na tao
  rationale: Ipinahihiwatig ng salita ang mapang-abuso at mapanghamak na karahasan, hindi lamang pagmamataas. Malinaw sa karaniwang mambabasa ang “marahas na tao,” habang inilalagay sa talababa ang iba pang kulay ng kahulugan.
- source_word: ἠλεήθην
  choice: kinahabagan ako
  rationale: Pinananatili ng anyong balintiyak ang pagkilos ng Diyos kay Pablo at likas itong pakinggan sa Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinahahayag ang sanhi o paliwanag na likas sa ὅτι, nang hindi sinasabing naging karapat-dapat si Pablo sa awa dahil sa kanyang kamangmangan.
- source_word: ἀγνοῶν ἐποίησα
  choice: ginawa ko iyon nang walang kaalaman
  rationale: Pinagsasama nito nang natural ang participle at pandiwa, pinananatili ang ideyang ang ginawa niya ay isinagawa sa kamangmangan, at hindi lamang na mayroon siyang pangkalahatang kakulangan sa kaalaman.
- source_word: ἐν ἀπιστίᾳ
  choice: at hindi sumasampalataya
  rationale: Sa konteksto, ang ἀπιστία ay pinakamalamang na kawalan ng pananampalataya. Ang koordinasyong “at” ay natural na nag-uugnay sa kalagayang ito sa “nang walang kaalaman” nang hindi binubura ang posibilidad ng mas literal na “sa kawalan ng pananampalataya.”
theological_decisions:
- issue: Batayan ng pahayag na ipinakilala ng ὅτι
  choice: Ipinahahayag ni Pablo na kinahabagan siya sapagkat ginawa niya iyon nang walang kaalaman at hindi sumasampalataya.
  alternative: Maaaring unawain ang parirala bilang paliwanag lamang sa kalagayan ng kanyang pagkilos, hindi bilang tuwirang dahilan ng pagkahabag.
  rationale: Ang ὅτι ay likas na may sanhi o paliwanag na diwa rito. Pinananatili ng “sapagkat” ang tensiyon ng teksto ngunit hindi ipinahihiwatig na pinagkakakitaan o ginagawang karapat-dapat sa awa ang kamangmangan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “lapastangan” at “mang-uusig” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na teknikal na ayos. Pinanatili ang tatluhang paglalarawan at ang causal na tensiyon ng “sapagkat.”
