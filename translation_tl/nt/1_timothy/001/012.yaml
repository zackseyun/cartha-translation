id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: tl
  text: Nagpapasalamat ako kay Jesus na Mesiyas[a], na ating Panginoon, na nagpalakas sa akin, sapagkat itinuring niya akong tapat at itinalaga niya ako sa paglilingkod[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo Jesus na ating Panginoon.” Ang titulong Griyego na Χριστός ay maaaring isalin bilang “Mesiyas” o gamitin sa nakaugaliang anyong “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “sa ministeryo.” Malawak ang kahulugan ng Griyegong διακονία at maaaring tumukoy sa paglilingkod o ministeryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Nagpapasalamat ako
  rationale: Likas at malinaw na katumbas sa makabagong Filipino ng idyomang Griyego na nagpapahayag ng pasasalamat.
- source_word: ἐνδυναμώσαντί με
  choice: na nagpalakas sa akin
  rationale: Ipinapahayag nito na si Jesus ang nagbigay kay Pablo ng lakas o kakayahan nang hindi nililimitahan ang uri ng pagpapalakas.
- source_word: Χριστῷ Ἰησοῦ
  choice: kay Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” habang inayos ang pagkakasunod upang maging mas natural sa Filipino at mapanatiling malinaw na ang titulo ay tumutukoy kay Jesus.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: na ating Panginoon
  rationale: Pinananatili ang kinikilalang titulong kristolohikal at ang inklusibong panghalip na “ating.”
- source_word: πιστόν
  choice: tapat
  rationale: Sinasaklaw ng “tapat” ang pagiging mapagkakatiwalaan sa gawaing ipinagkatiwala, nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa merito o katangian ni Pablo.
- source_word: ἡγήσατο
  choice: itinuring
  rationale: Malapit ito sa kahulugang “itinuring” o “ipinalagay” at natural sa kasalukuyang Filipino.
- source_word: θέμενος
  choice: itinalaga niya ako
  rationale: Sa konteksto ng pagtatalaga sa isang gawain, ipinahihiwatig ng literal na “paglalagay” ang pag-aatas o pagtatalaga.
- source_word: εἰς διακονίαν
  choice: sa paglilingkod
  rationale: Malawak ang διακονία at maaaring tumukoy sa paglilingkod o ministeryo. Iniiwasan ng “paglilingkod” ang mas makitid na pahiwatig ng isang pormal na katungkulang pangsimbahan.
theological_decisions:
- issue: Paglalahad sa Χριστός bilang titulo
  choice: Jesus na Mesiyas
  alternative: Cristo Jesus
  rationale: Isinasalin ng “Mesiyas” ang kahulugan ng titulong Χριστός sa halip na gamitin lamang ang nakaugaliang transliterasyong “Cristo.” Inayos bilang “Jesus na Mesiyas” upang maging natural at malinaw sa Filipino.
- issue: Ugnayan ng pagiging tapat at ng pagtatalaga sa paglilingkod
  choice: itinuring niya akong tapat at itinalaga niya ako sa paglilingkod
  alternative: itinuring niya akong tapat, kaya itinalaga niya ako sa paglilingkod
  rationale: Hindi ginamit ang “kaya” upang hindi gawing tahasang sanhi at bunga ang ugnayang ipinapahayag ng participle na θέμενος. Pinananatili ng payak na pag-uugnay ang bahagyang kaluwagan ng sintaks ng Griyego.
- issue: Saklaw ng διακονία
  choice: paglilingkod
  alternative: ministeryo
  rationale: Ang “paglilingkod” ay nagpapanatili sa malawak na saklaw ng salita at hindi awtomatikong nagpapahiwatig ng isang institusyonal o klerikal na katungkulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jesus na Mesiyas” sa halip na mas di-likas na “Mesiyas Jesus,” at “paglilingkod” upang manatiling malawak ang kahulugan ng διακονία. Pinanatili ang kuwit sa hulihan dahil bahagi ang talata ng nagpapatuloy na pangungusap sa kasunod na teksto.
