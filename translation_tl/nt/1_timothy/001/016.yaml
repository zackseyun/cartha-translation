id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: tl
  text: Ngunit dahil dito ay kinahabagan ako, upang sa akin bilang pinakapangunahin[b], maipakita ng Mesiyas na si Jesus[a] ang buong pagtitiis niya bilang huwaran sa mga sasampalataya sa kaniya tungo sa buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “Cristo Jesus.” Ang salitang Griyego na Χριστός ay titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: O “una.” Sa konteksto, malamang na tumutukoy ito kay Pablo bilang pinakapangunahin sa mga makasalanan (tal. 15), bagaman maaari ring ipahiwatig ng salita ang pagiging una sa isang pagkakasunod-sunod.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: ἠλεήθην
  choice: kinahabagan ako
  rationale: Likas na Filipino para sa aorist passive at hindi tahasang pinapangalanan ang gumawa ng pagkahabag, gaya ng Griyego.
- source_word: πρώτῳ
  choice: na pinakapangunahin
  rationale: Pinananatili ang diwa ng pagiging foremost at ang ugnay sa naunang pahayag ni Pablo tungkol sa mga makasalanan, nang hindi tahasang inuulit sa pangunahing teksto ang pangngalang wala sa talata.
- source_word: ἐνδείξηται
  choice: maipakita
  rationale: Ipinahahayag ang layunin pagkatapos ng ἵνα at ang lantad na pagpapamalas ng pagtitiis kay Pablo.
- source_word: Χριστὸς Ἰησοῦς
  choice: ang Mesiyas na si Jesus
  rationale: Ginagawang malinaw sa natural na Tagalog na ang Χριστός ay titulo, hindi apelyido o bahagi lamang ng pangalan.
- source_word: ἅπασαν μακροθυμίαν
  choice: ang buong lawak ng kaniyang pagtitiis
  rationale: Ipinapakita ng 'buong lawak' ang diin ng ἅπασαν, samantalang ang 'pagtitiis' ay natural na saklaw ang matiyagang pagpipigil ng μακροθυμία.
- source_word: ὑποτύπωσιν
  choice: bilang huwaran
  rationale: Ang 'huwaran' ay malinaw at marangal na katumbas ng isang modelong nagpapakita ng magiging anyo o halimbawa.
- source_word: τῶν μελλόντων πιστεύειν
  choice: para sa mga sasampalataya
  rationale: Natural na ipinahahayag ng panghinaharap na anyo sa Tagalog ang mga taong, mula sa pananaw ng karanasan ni Pablo, ay mananampalataya pa lamang.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: sasampalataya sa kaniya
  rationale: Karaniwang salin ng πιστεύω ἐπί na nagpapanatili sa personal na tuon ng pananampalataya kay Jesus.
- source_word: εἰς ζωὴν αἰώνιον
  choice: tungo sa buhay na walang hanggan
  rationale: Ipinapanatili ng 'tungo sa' ang direksiyon o layuning ipinahahayag ng εἰς.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Dito ay malinaw na maipapahayag ang titular na diwa ng Χριστός sa pamamagitan ng 'Mesiyas'; hindi ito tinatratong simpleng bahagi ng pangalang pantangi.
- issue: Ang tagagawa ng pagkahabag at ang nagpapakita ng pagtitiis
  choice: Hindi pinangalanan ang tagagawa ng passive na 'kinahabagan,' ngunit tahasang si Mesiyas Jesus ang nagpapakita ng pagtitiis
  alternative: Tahasan sa salin na si Jesus o ang Ama ang kumahabag kay Pablo
  rationale: Hindi tinutukoy ng ἠλεήθην ang tagagawa, samantalang pinangalanan ng sugnay na layunin si Mesiyas Jesus. Pinananatili ng salin ang pagkakaibang ito nang hindi nilulutas ang higit sa sinasabi ng teksto.
- issue: Kahulugan ng πρώτῳ
  choice: pinakapangunahin
  alternative: una
  rationale: Ipinahihiwatig ng konteksto ang pagiging pangunahin ni Pablo sa mga makasalanan, ngunit maaari ring marinig sa 'una' ang pagkakasunod-sunod. Ang pangunahing salin ay sumusunod sa kontekstuwal na superlatibong diwa at itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kinahabagan,” “huwaran,” at “tungo sa” upang mapanatili ang pormal na himig nang hindi nagiging lipas o labis na literal. Ang pariralang “Mesiyas na si Jesus” ay mas natural sa Tagalog kaysa “Mesiyas Jesus” at malinaw na nagtatanghal sa Mesiyas bilang titulo.
