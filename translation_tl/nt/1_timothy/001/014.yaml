id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: tl
  text: Ngunit higit na umapaw ang biyaya ng ating Panginoon, kasama ang pananampalataya at pag-ibig na nasa Mesiyas na si Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: higit na umapaw
  rationale: Ipinahahayag ng tambalang pandiwa ang lubhang pagsagana o pag-apaw. Natural sa modernong Tagalog ang “higit na umapaw” at pinananatili nito ang paghahambing sa naunang kasalanan at kawalan ng pananampalataya.
- source_word: δὲ
  choice: Ngunit
  rationale: May malinaw na pagsalungat ito sa naunang paglalarawan kay Pablo, kaya ang “Ngunit” ang angkop na pang-ugnay.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang karaniwan at malinaw na salin ng χάρις sa kontekstong tumutukoy sa mapagkaloob na kagandahang-loob ng Panginoon.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang kinikilalang titulo at ang unang panauhang maramihang panghalip ng Griyego.
- source_word: μετὰ
  choice: kasama ang
  rationale: Direktang ipinapakita ng “kasama ang” na ang pananampalataya at pag-ibig ay kaakibat ng umaapaw na biyaya, nang hindi ipinapasya kung bunga lamang ang mga ito.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang tuwiran at karaniwang katumbas ng πίστις sa talatang ito.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Ito ang natural at kasalukuyang salin ng ἀγάπη.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: na nasa Mesiyas na si Jesus
  rationale: Ang parirala ay inuugnay sa magkasamang “pananampalataya at pag-ibig.” Isinasalin ang Χριστός ayon sa kahulugan nitong titulo, “Mesiyas,” habang ginagawang natural sa Tagalog ang pangalan at titulo.
theological_decisions:
- issue: Kaugnayan ng “kasama ang pananampalataya at pag-ibig” sa biyaya
  choice: Inilalarawan ang biyaya bilang umapaw kasama ang pananampalataya at pag-ibig.
  alternative: Maaaring unawain ang pananampalataya at pag-ibig bilang mga bungang nilikha ng biyaya kay Pablo.
  rationale: Pinakamalapit sa balarila ang pag-uugnay ng μετὰ πίστεως καὶ ἀγάπης sa umaapaw na biyaya. Hindi ipinapasya ng salin ang mas tiyak na sanhi o paraan ng ugnayan.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: “nasa Mesiyas na si Jesus,” na maaaring maglarawan sa pananampalataya at pag-ibig bilang umiiral sa pakikipagkaisa o kaugnayan sa kanya.
  alternative: “na matatagpuan sa Mesiyas na si Jesus,” na maaaring magbigay-diin na siya ang pinagmumulan o kinaroroonan ng mga ito.
  rationale: Pinananatili ng payak na “nasa” ang lawak at teolohikal na tensiyon ng ἐν nang hindi ito nililimitahan sa pinagmulan, paraan, o saklaw lamang.
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dala pa rin ng Χριστός ang kahulugan ng titulo sa pariralang ito; ang “Mesiyas” ay tahasang naghahatid ng kahulugang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang bahagyang siksik na kayarian ng Griyego upang hindi malutas nang palihim ang ugnayan ng biyaya, pananampalataya, at pag-ibig.
