  source_fidelity: Tapat ang salin sa SBLGNT. Ang “Ngunit” ay wastong naghahatid ng kontrast ng δέ; ang “higit na umapaw” ay naipapakita ang masidhing diwa ng ὑπερεπλεόνασεν; at ang “kasama ang” ay maingat na pinananatili ang ugnayan ng μετά sa biyaya nang hindi ipinipilit na ang pananampalataya at pag-ibig ay sanhi o bunga lamang nito. Saklaw ng “na nasa Mesiyas na si Jesus” ang ἐν Χριστῷ Ἰησοῦ at natural na maaaring tumukoy sa kapwa pananampalataya at pag-ibig.
