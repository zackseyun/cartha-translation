  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: tl
  text: Alam natin na mabuti ang kautusan, kung ginagamit ito ng sinuman nang naaayon sa kautusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nang wasto,” “sa paraang nararapat,” o “ayon sa batas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Alam natin
  rationale: Ang perfect-form na οἶδα ay may pangkasalukuyang diwa ng matatag na kaalaman; natural itong ipinahahayag sa Tagalog bilang “alam natin.”
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Banayad na pang-ugnay o transisyon ang δέ rito. Hindi kailangan ng hiwalay na “ngunit” o “ngayon” sa natural na Tagalog, yamang maaari iyong magpahiwatig ng higit na pagsalungat o panahon kaysa nasa Griyego.
- source_word: καλὸς ὁ νόμος
  choice: mabuti ang kautusan
  rationale: Pinananatili ng “mabuti” ang malawak at positibong pagsusuri ng καλός, at ng “kautusan” ang kinikilalang kategorya ng νόμος nang hindi nililimitahan sa pangunahing teksto ang tiyak na saklaw nito.
- source_word: ἐάν τις
  choice: kung … ng isang tao
  rationale: Isang pangkalahatang kondisyon ang parirala. Natural sa Tagalog ang “isang tao” at pinananatili nito ang generic singular.
- source_word: αὐτῷ … χρῆται
  choice: ginagamit ito
  rationale: Tumutukoy ang panghalip sa kautusan, at ang χράομαι ay karaniwang nangangahulugang gumamit o maglaan ng gamit.
- source_word: νομίμως
  choice: ayon sa wastong layunin nito
  rationale: Maaaring mangahulugan ang νομίμως ng alinsunod sa batas, tuntunin, o nararapat na pamantayan. Sa kontekstong paggamit sa kautusan, malinaw at natural ang “ayon sa wastong layunin nito,” habang ang talababa ay nagpapanatili ng ibang leksikal na posibilidad.
theological_decisions:
- issue: Saklaw ng “kautusan”
  choice: “ang kautusan” lamang, nang walang dagdag na “ni Moises”
  alternative: “ang Kautusan ni Moises” o batas sa pangkalahatan
  rationale: Bagaman malamang na lalo nang tinutukoy sa konteksto ang Kautusang Mosaiko, νόμος lamang ang sinasabi ng teksto. Pinananatiling bukas ng salin ang eksaktong saklaw.
- issue: Kahulugan ng νομίμως sa paggamit ng kautusan
  choice: “ayon sa wastong layunin nito”
  alternative: “ayon sa kautusan,” “nang naaayon sa batas,” o “nang wasto”
  rationale: Hindi nilulutas ng salin kung ang pamantayan ay mismong kautusan, isang legal na tuntunin, o ang nararapat na gamit nito. Ipinapakita sa talababa ang mga posibleng mas literal o mas malawak na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kautusan” sa halip na “batas” upang maging natural sa kontekstong biblikal ngunit hindi tahasang tukuyin ang Kautusan ni Moises. Inilagay ang pananda ng talababa pagkatapos ng buong kondisyong tinutukoy nito.
