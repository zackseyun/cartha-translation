base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: tl
  text: sa mga namumuhay sa seksuwal na imoralidad, sa mga lalaking nakikipagtalik sa kapwa lalaki,[a] sa mga nang-aalipin ng tao, sa mga sinungaling, sa mga nagsisinungaling sa kanilang panunumpa, at sa anumang iba pang bagay na salungat sa wastong turo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga lalaking nagsasagawa ng homoseksuwal na pakikipagtalik.” Bihira at pinagtatalunan ang eksaktong saklaw ng salitang Griyego na ἀρσενοκοῖται, ngunit malinaw na tumutukoy ito sa seksuwal na gawain ng mga lalaki sa kapwa lalaki.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: sa mga imoral sa seksuwal
  rationale: Malawak ang saklaw ng πόρνοις at hindi lamang tumutukoy sa pakikipagtalik bago ang kasal. Ang parirala ay malinaw sa modernong Filipino at pinananatili ang pangkalahatang kategorya ng seksuwal na imoralidad.
- source_word: ἀρσενοκοίταις
  choice: sa mga lalaking nakikipagtalik sa kapwa lalaki
  rationale: Ang bihira at pinagtatalunang salita ay binubuo ng mga elementong nangangahulugang 'lalaki' at 'higaan/pakikipagtalik' at malamang na umaalingawngaw sa Septuagint ng Levitico. Nakatuon ang salin sa gawaing seksuwal ng mga lalaki at hindi nag-aangkat ng makabagong kategorya ng identidad.
- source_word: ἀνδραποδισταῖς
  choice: sa mga nang-aalipin at nangangalakal ng tao
  rationale: Tumutukoy ang salita sa pagdakip, pagkuha, o pangangalakal ng mga tao upang alipinin. Mas malinaw sa karaniwang mambabasa ang pinagsamang paglalarawan kaysa sa makitid na 'mangangalakal ng alipin' lamang.
- source_word: ψεύσταις
  choice: sa mga sinungaling
  rationale: Direkta at likas na katumbas sa Filipino ng pangmaramihang pangngalan para sa mga nagsisinungaling.
- source_word: ἐπιόρκοις
  choice: sa mga sumusumpa nang kasinungalingan
  rationale: Ipinahahayag nito ang pagsumpa nang hindi totoo o ang huwad na panunumpa. Mas madaling maunawaan ito kaysa sa teknikal na terminong legal.
- source_word: καὶ εἴ τι ἕτερον
  choice: at sa anumang iba pa
  rationale: Pinananatili nito ang bukas na pagpapalawak ng talaan sa anumang karagdagang bagay na kauri ng mga nabanggit.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: sa wastong turo
  rationale: Ang ὑγιαινούσῃ ay literal na may diwang 'malusog' at metaporikal na 'wasto' o 'maayos.' Likas at malinaw sa modernong Filipino ang 'wastong turo' nang hindi nagiging sobrang teknikal.
- source_word: ἀντίκειται
  choice: salungat
  rationale: Maikli at idiomatikong ipinapahayag ang pagiging laban o taliwas sa tinutukoy na turo.
theological_decisions:
- issue: Salin ng ἀρσενοκοίταις sa isang kontekstong pinagtatalunan sa leksikon at teolohiya
  choice: mga lalaking nakikipagtalik sa kapwa lalaki
  alternative: mga lalaking nagsasagawa ng homoseksuwal na pakikipagtalik
  rationale: Pinananatili ng pangunahing salin ang tiyak na pagtukoy sa lalaki at sa gawaing seksuwal nang hindi ipinapalagay ang makabagong konsepto ng oryentasyon o identidad. Dahil bihira ang terminong Griyego at pinagtatalunan ang eksaktong lawak nito, inilalahad sa talababa ang alternatibo at ang limitasyon ng katiyakan.
- issue: Saklaw ng ἀνδραποδισταῖς
  choice: mga nang-aalipin at nangangalakal ng tao
  alternative: mga mangangalakal ng alipin
  rationale: Hindi nililimitahan ng salin ang kasamaan sa komersiyal na pagbebenta lamang; isinasama nito ang pagkuha o pagdukot sa mga tao upang gawing alipin, na naaayon sa saklaw ng salita.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na angkop sa tuloy-tuloy na talaan ng mga bisyo. Gumamit ng mga pandiwang parirala para sa mga terminong walang likas at tumpak na iisang-salitang katumbas sa Filipino; iniwasan ang makalumang wika at mga kategoryang nakabatay sa modernong identidad.
