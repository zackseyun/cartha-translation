  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: tl
  text: ayon sa ebanghelyo ng kaluwalhatian ng mapalad na Diyos[a], na ipinagkatiwala sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “maluwalhating ebanghelyo ng mapalad na Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinakikilala nito ang pamantayan o batayan ng naunang pahayag at natural itong katumbas ng κατά na may akusatibo.
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Karaniwan at malinaw na katawagan ito sa kontekstong Paulino at pinananatili ang bigat na teolohikal ng salita.
- source_word: τῆς δόξης
  choice: ng kaluwalhatian
  rationale: Pinananatili ang anyong henitibo ng Griyego sa halip na agad itong gawing pang-uri, kaya nananatiling bukas ang tunay na ugnayan ng mga salita.
- source_word: μακαρίου
  choice: mapalad
  rationale: Ang μακάριος kapag tumutukoy sa Diyos ay nagsasaad ng ganap na kalagayang karapat-dapat purihin; mas angkop ang “mapalad” kaysa “masaya” o “masuwerte.”
- source_word: θεοῦ
  choice: Diyos
  rationale: Tuwirang salin ng θεός sa henitibong parirala.
- source_word: ὃ
  choice: na
  rationale: Tumutukoy ang panghalip na ito sa ebanghelyo at natural na nag-uugnay sa sugnay na “ipinagkatiwala sa akin.”
- source_word: ἐπιστεύθην
  choice: ipinagkatiwala sa akin
  rationale: Sa pasibong gamit na ito, ang πιστεύω ay nangangahulugang magtiwala o magbigay ng isang bagay bilang pananagutan, hindi “maniwala.”
- source_word: ἐγώ
  choice: akin
  rationale: Naipahahayag ng “sa akin” ang unang panauhan; hindi dinagdagan ng artipisyal na diin, bagaman tahasang may ἐγώ sa Griyego.
theological_decisions:
- issue: Ugnayang henitibo sa τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: ebanghelyo ng kaluwalhatian ng mapalad na Diyos
  alternative: maluwalhating ebanghelyo ng mapalad na Diyos
  rationale: Mas malapit ang pangunahing salin sa estruktura ng Griyego at hindi nito agad ipinapalagay na pang-uring henitibo lamang ang “ng kaluwalhatian.” Inilalagay sa talababa ang mas idyomatikong posibilidad.
- issue: Kahulugan ng ἐπιστεύθην
  choice: ipinagkatiwala sa akin
  alternative: pinaniwalaan ko
  rationale: Hinihingi ng konteksto at ng pasibong konstruksyon ang diwang pagbibigay ng pananagutan o katiwala, hindi ang karaniwang diwang “maniwala.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na henitibong “ng kaluwalhatian” upang huwag patahimikin ang ambiguwidad ng Griyego; ang mas natural na pang-uring pagbasa ay nasa talababa.
