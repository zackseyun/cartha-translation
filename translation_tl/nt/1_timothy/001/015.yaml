  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: tl
  text: 'Mapagkakatiwalaan ang pananalitang ito at karapat-dapat tanggapin nang lubos: dumating sa sanlibutan ang Mesiyas na si Jesus[a] upang iligtas ang mga makasalanan—at ako ang pangunahin sa kanila.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo Jesus.”
    reason: alternative_reading
  - marker: b
    text: O, “ako ang una sa kanila” o “ako ang pinakamasama sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Mapagkakatiwalaan ang pananalitang ito
  rationale: Ang pormula sa mga Liham Pastoral ay tumutukoy sa isang maaasahang buod na pahayag. Likas sa modernong Tagalog ang “pananalitang ito” at malinaw na ang kasunod na pahayag ang tinutukoy.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: karapat-dapat tanggapin nang lubos
  rationale: Ipinapahayag ng πάσης ang ganap o buong pagtanggap; pinananatili ng pariralang ito ang diin sa natural na Tagalog.
- source_word: ὅτι
  choice: '[ipinakilala sa pamamagitan ng tutuldok]'
  rationale: Dito, ipinapakilala ng ὅτι ang nilalaman ng mapagkakatiwalaang pananalita, hindi ang sanhi. Sapat at mas natural sa Tagalog ang tutuldok.
- source_word: Χριστὸς Ἰησοῦς
  choice: ang Mesiyas na si Jesus
  rationale: Ginagawang malinaw ng “Mesiyas” ang titular na diwa ng Χριστός, habang natural na inuugnay ito sa pangalang Jesus sa Tagalog.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: dumating sa sanlibutan
  rationale: Tuwirang pinananatili nito ang kilos ng pagdating at ang teolohikal na diwa ng εἰς τὸν κόσμον nang walang dagdag na pagpapakahulugan.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: upang iligtas ang mga makasalanan
  rationale: Ang infinitive na σῶσαι ay nagpapahayag ng layunin, at ang “iligtas” ang karaniwan at tumpak na katumbas sa kontekstong ito.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: at ako ang pangunahin sa kanila
  rationale: Pinananatili ng “pangunahin” ang posibleng diwa ng una sa ranggo o pinakatampok nang hindi agad nililimitahan ito sa interpretasyong “pinakamasama.” Naipapakita rin ng ayos ang diin sa ἐγώ.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός bilang titulo o nakasanayang bahagi ng pangalan
  choice: ang Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: May malinaw na titular na halaga ang Χριστός sa pahayag na ito. Inilalagay sa talababa ang nakasanayang anyong “Cristo Jesus” dahil maaari rin itong marinig bilang halos pangalang pantangi sa ganitong epistolaryong gamit.
- issue: Saklaw ng πρῶτος sa paglalarawan ni Pablo sa sarili
  choice: pangunahin
  alternative: pinakamasama; pinuno
  rationale: Maaaring tumukoy ang πρῶτος sa pagiging una o pangunahin sa ranggo. Ang “pangunahin” ang nagpapanatili sa saklaw na ito at hindi tahasang ginagawang moral na paghahambing ang salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang biblikal at teolohikal na timpla ng κόσμος, at iniwasan ang mas teknikal o denominasyonal na pagpapalawak.
