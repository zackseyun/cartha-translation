  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: tl
  text: Ipinagkakatiwala ko sa iyo ang tagubiling ito, anak kong Timoteo, alinsunod sa mga propesiyang naunang binigkas tungkol sa iyo[a], upang sa pamamagitan ng mga iyon[b] ay makipaglaban ka sa mabuting pakikibaka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ukol sa iyo” o “para sa iyo.” Posible rin ang diwang mga propesiyang binigkas “sa ibabaw mo,” ngunit pangunahing tumutukoy ito sa iyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga iyon” o “sa loob ng mga iyon.” Maaaring ipahayag ng Griyego ang paraan o ang saklaw kung saan isinasagawa ang pakikibaka.
    reason: lexical_alternative
  - marker: c
    text: 'Karaniwang salin: “ipaglaban mo ang mabuting laban.” Mas literal na magkaugnay ang mga salitang Griyego para sa “makipaglaban” at “pakikibaka,” na may talinghagang militar ng isang kampanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: tagubiling
  rationale: Ipinahihiwatig ng salita ang isang may-awtoridad na bilin o atas. Likas sa makabagong Tagalog ang “tagubilin” at hindi nito pinatitigas nang labis ang himig gaya ng maaaring mangyari sa “utos.”
- source_word: παρατίθεμαί
  choice: ipinagkakatiwala ko
  rationale: Ipinapahayag ng anyong panggitna rito ang pagbibigay ng isang pananagutan sa pangangalaga ng iba; malinaw itong naihahatid ng “ipinagkakatiwala ko.”
- source_word: τέκνον Τιμόθεε
  choice: anak kong Timoteo
  rationale: Pinananatili nito ang magiliw na talinghagang pampamilya nang hindi ginagawang tiyak na “anak na lalaki” ang mas malawak na τέκνον.
- source_word: κατὰ
  choice: alinsunod sa
  rationale: Ipinakikita nito ang pagkakaayon o pagkakaugnay ng kasalukuyang tagubilin sa mga naunang propesiya.
- source_word: προαγούσας
  choice: naunang binigkas
  rationale: Ang literal na diwang “nauuna” ay temporal dito; ginagawang malinaw na dati nang ipinahayag ang mga propesiya.
- source_word: ἐπὶ σὲ
  choice: tungkol sa iyo
  rationale: Ito ang pinakanatural na pagpapahayag ng pagtukoy ng mga propesiya kay Timoteo, habang inilalagay sa talababa ang iba pang posibleng ugnayan.
- source_word: προφητείας
  choice: mga propesiya
  rationale: Tuwiran at karaniwang katumbas ito ng pangmaramihang pangngalan para sa mga mensaheng propetiko.
- source_word: ἐν αὐταῖς
  choice: sa pamamagitan ng mga iyon
  rationale: Binabasa rito ang ἐν bilang nagpapahayag ng kasangkapan o paraan, ngunit pinananatili sa talababa ang posibleng diwa ng kalagayan o saklaw.
- source_word: στρατεύῃ ... τὴν καλὴν στρατείαν
  choice: maisagawa mo ang mabuting pakikidigma
  rationale: Pinananatili nito ang talinghagang militar at ang diwa ng pagsasagawa ng isang kampanya o paglilingkod sa digmaan, sa halip na paliitin iyon sa isang laban lamang.
theological_decisions:
- issue: Ang kaugnayan ng mga propesiya sa pagkatawag o pagkahirang kay Timoteo
  choice: Ang mga naunang propesiya tungkol kay Timoteo ang pinag-aalinsunuran at nagsisilbing gabay o paraan sa pagtupad niya sa tagubilin.
  alternative: Maaaring unawain ang mga propesiya bilang pormal na naghirang kay Timoteo, o bilang mga pribadong salitang pampalakas lamang.
  rationale: Iniuugnay ng Griyego ang tagubilin, mga propesiya, at pakikidigma ni Timoteo, ngunit hindi nito tahasang inilalahad ang isang buong teolohiya ng ordinasyon o sakramento.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tagubilin” para sa may-awtoridad ngunit mapagkalingang tono, at “pakikidigma” upang mapanatili ang tahasang talinghagang militar ng Griyego.
