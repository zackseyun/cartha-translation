  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: tl
  text: Ang layunin ng tagubilin[b] ay pag-ibig na nagmumula sa pusong dalisay, sa mabuting budhi, at sa taos-pusong pananampalataya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananampalatayang hindi pakunwari.” Ang salitang isinaling “pananampalataya” ay maaari ring mangahulugang “pagtitiwala” o “katapatan” sa ilang konteksto.
    reason: alternative_reading
  - marker: b
    text: O “utos” o “atas.” Ang “layunin” ay maaari ring isaling “pakay” o “nilalayong bunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: layunin
  rationale: Sa konteksto, tumutukoy ito sa pakay o nilalayong bunga ng tagubilin, hindi lamang sa pagtatapos nito.
- source_word: παραγγελίας
  choice: tagubiling ito
  rationale: Saklaw ng παραγγελία ang tagubilin, utos, o atas. Ang “tagubilin” ay natural sa konteksto ng ministeryo at pagtuturo ni Timoteo; ipinahihiwatig ng pantukoy na τῆς ang tiyak na tagubiling tinatalakay sa konteksto.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Karaniwan at malinaw na katumbas na angkop sa etikal na diin ng talata.
- source_word: ἐκ
  choice: nagmumula sa
  rationale: 'Ipinapahayag ng ἐκ ang pinagmulan: ang pag-ibig ay umuusbong mula sa tatlong katangiang kasunod.'
- source_word: καθαρᾶς καρδίας
  choice: pusong dalisay
  rationale: Pinananatili ang panloob at moral na diwa ng parirala sa marangal at likas na Filipino.
- source_word: συνειδήσεως ἀγαθῆς
  choice: mabuting budhi
  rationale: Mas malapit ang “mabuti” sa ἀγαθῆς kaysa sa mas mapagpaliwanag na “malinis,” at ang “budhi” ay natural na katumbas ng συνείδησις.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang pangunahing katumbas ng πίστις dito, habang nananatiling posible ang diwang pagtitiwala o katapatan.
- source_word: ἀνυποκρίτου
  choice: tapat
  rationale: Natural nitong ipinahahayag ang pananampalatayang hindi pakunwari o mapagkunwari, nang hindi gumamit ng mabigat na parirala.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay o panandang diskurso ito. Hindi kailangan ang hiwalay na “ngayon” o “ngunit” sa Filipino upang maging natural ang pangungusap.
theological_decisions:
- issue: Kahulugan ng πίστις sa πίστεως ἀνυποκρίτου
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Malamang na tumutukoy ito sa tunay at hindi pakunwaring pananampalataya, ngunit maaaring taglayin ng πίστις ang diwa ng pagtitiwala o katapatan. Inilalahad sa talababa ang saklaw nang hindi dogmatikong nilulutas ang ambiguwidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “budhi” sa halip na mas teknikal na “konsensiya,” at iniwasan ang hindi kailangang panimulang pang-ugnay. Nasa pangunahing teksto ang lahat ng marker ng talababa.
