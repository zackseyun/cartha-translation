source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: tl
  text: 'Kay Timoteo, tunay kong anak sa pananampalataya: Sumaiyo ang biyaya, habag, at kapayapaan mula sa Diyos na Ama at mula kay Mesias Jesus na ating Panginoon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνησίῳ
  choice: tunay
  rationale: Ipinapahayag ang pagiging tunay at lehitimo ng espirituwal na ugnayan nang hindi ipinahihiwatig na anak siya sa laman.
- source_word: τέκνῳ
  choice: anak
  rationale: Likas na katumbas sa Filipino at pinananatili ang talinghaga ng espirituwal na pagiging magulang nang hindi kailangang tukuyin ang kasarian sa salitang ito.
- source_word: ἐν πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang maaaring diwa ng pananampalataya bilang larangan o pinagsasaluhang realidad ng kanilang espirituwal na ugnayan.
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwan at tumpak na katumbas ng terminong ginagamit ni Pablo sa pagbati.
- source_word: ἔλεος
  choice: habag
  rationale: Tuwirang katumbas na likas sa makabagong Filipino at malinaw na naiiba sa biyaya.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwiran at kinikilalang salin na nagpapanatili sa kabuuan ng pagbati.
- source_word: θεοῦ πατρὸς
  choice: Diyos Ama
  rationale: Likas na pormang Filipino para sa pariralang tumutukoy sa Diyos bilang Ama.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesias Jesus
  rationale: Isinasalin ang Χριστός bilang titulong Mesias at pinananatili ang ayos ng mga salita sa Griyego.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwan at teolohikal na mahalagang katumbas ng κύριος sa pagtukoy kay Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ Ἰησοῦ
  choice: Mesias Jesus
  alternative: Cristo Jesus
  rationale: Ang Χριστός ay may puwersa pa rin bilang titulo sa pormulang ito; kaya isinalin itong Mesias sa halip na ituring lamang na nakasanayang bahagi ng pangalan.
- issue: Puwersa ng ἐν πίστει
  choice: sa pananampalataya
  alternative: sa pananalig
  rationale: Pinananatili nito ang posibilidad na tumukoy ang parirala sa pinagsasaluhang pananampalataya o sa larangan ng pananampalataya, nang hindi ito nililimitahan sa pansariling kilos ng paniniwala.
- issue: Ugnayan ng ἀπὸ sa dalawang pinagmumulan
  choice: mula sa Diyos Ama at kay Mesias Jesus
  alternative: mula sa Diyos na Ama at sa Mesias na si Jesus
  rationale: Pinananatili ang iisang pang-ukol na sumasaklaw sa Diyos Ama at sa Panginoong Mesias Jesus, gaya ng kayarian ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sumaiyo” bilang maikli at likas na pormula ng pagpapala; hindi dinagdagan ng panghalip na wala sa Griyego. Walang talababa dahil walang kailangang markahang tekstuwal o leksikal na alternatibo para sa publikasyong ito.
