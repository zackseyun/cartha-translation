    rationale: Ang participle na ἀπωσάμενοι ay maaaring magpahiwatig ng kaugnay na resulta sa konteksto, ngunit walang katumbas na salitang “kaya” sa teksto; dapat iwasan ang pagpapalinaw na ito sa pangunahing teksto.
  - severity: medium
    issue: Ang “ang kanilang pananampalataya” ay nagpapalit sa saklaw ng περὶ τὴν πίστιν.
    rationale: Mas literal at hindi mapagpasya ang “hinggil sa pananampalataya,” na maaaring tumukoy sa larangan ng pananampalataya o sa pananampalatayang Kristiyano, sa halip na tuwirang angkinin ito bilang kanilang personal na pananampalataya.
