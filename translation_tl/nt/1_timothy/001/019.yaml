  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: tl
  text: na pinanghahawakan ang pananampalataya at isang mabuting budhi[a], na itinakwil ng ilan; hinggil sa pananampalataya, dumanas sila ng pagkawasak ng barko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa gramatika, ang “na” ay pinakalikas na tumutukoy sa “mabuting budhi.” Maaari rin itong unawain bilang pagtukoy sa “pananampalataya at mabuting budhi” nang magkasama.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχων
  choice: pinanghahawakan
  rationale: Ipinahihiwatig ng kasalukuyang participle ang patuloy at aktibong pag-iingat; likas din itong nag-uugnay sa utos sa naunang talata.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pananampalatayang Kristiyano; mas malamang ito kaysa katapatan, bagaman taglay rin ng salita ang diwa ng pagtitiwala.
- source_word: ἀγαθὴν συνείδησιν
  choice: malinis na budhi
  rationale: Sa natural na modernong Tagalog, ang 'malinis na budhi' ay malinaw na nagpapahayag ng budhing matuwid sa moral, bagaman ang literal na anyo ay 'mabuting budhi.'
- source_word: ἥν
  choice: ito
  rationale: Ang panghalip na pambabae at isahan ay pinakalikas na tumutukoy sa pinakamalapit na antecedent na συνείδησιν, o 'budhi.'
- source_word: ἀπωσάμενοι
  choice: itinakwil
  rationale: Ipinahahayag nito ang sinasadya at mariing pagtataboy o pagtanggi, habang nananatiling natural sa Filipino.
- source_word: περὶ τὴν πίστιν
  choice: ang kanilang pananampalataya
  rationale: Ipinapakita ng parirala ang larangan kung saan naganap ang pagkawasak. Ginawang tahasan ang kaugnayan upang maging malinaw at natural sa Tagalog.
- source_word: ἐναυάγησαν
  choice: nawasak na parang barkong lumubog
  rationale: Pinananatili ang metapora ng sakunang pandagat sa paraang madaling maunawaan ng karaniwang mambabasa.
theological_decisions:
- issue: Tinutukoy ng ἥν
  choice: Partikular na tumutukoy sa 'malinis na budhi.'
  alternative: Maaaring ibuod nito ang 'pananampalataya at malinis na budhi' bilang magkasama.
  rationale: Ang ἥν ay pambabae at isahan at pinakalikas na kaayon ng pinakamalapit na pambabae at isahang pangngalan, συνείδησιν. Gayunman, binabanggit sa talababa ang mas malawak na pagkaunawa upang hindi itago ang tunay na kalabuan.
- issue: Kahulugan ng περὶ τὴν πίστιν
  choice: Pagkawasak ng kanilang pananampalataya.
  alternative: Pagkawasak hinggil sa 'ang pananampalataya' bilang kalipunan ng paniniwalang Kristiyano.
  rationale: Maaaring tumukoy ang may artikulong πίστιν sa pananampalatayang Kristiyano bilang larangan o nilalaman. Pinili ang natural na Filipino, habang iniiwasang magpasok ng partikular na doktrina tungkol sa uri o wakas ng kanilang pananampalataya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang 'budhi' kaysa mas teknikal na 'konsensiya,' at pinalinaw ang metaporang pandagat nang hindi inaalis ang larawan nito.
