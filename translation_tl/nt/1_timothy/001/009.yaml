  source_fidelity: Ang pangkalahatang pagkakasunod at mga pares sa talaan ay tapat sa Griyego. Ang “taong matuwid” ay angkop para sa kinatawang isahang δικαίῳ, at ang “hindi itinakda” ay mahusay na katumbas ng νόμος οὐ κεῖται. Gayunman, ang “hindi kumikilala sa Diyos” ay mas makitid at nagbibigay-diin sa pagkilala kaysa sa ἀσεβέσι, na tumutukoy sa pagiging di-makadiyos o kawalan ng paggalang sa Diyos.
  naturalness: Makabago at malinaw ang daloy. Ang “mga di-makadiyos” ay mas tuwiran, natural sa dignipikadong rehistro ng salin, at mas tumpak kaysa “mga hindi kumikilala sa Diyos.” Ang “mga lapastangan” ay mas maigsi at mas kaayon ng pangngalang pangkat na βεβήλοις kaysa sa pariralang tahasang nagdaragdag ng “mga banal na bagay.”
  terminology: Pinananatili ang “kautusan,” “matuwid,” “makasalanan,” at “mamamatay-tao.” Pinalitan ang terminong para sa ἀσεβέσι upang hindi maisalin bilang simpleng kawalan ng pagkilala sa Diyos. Ang leksikal na pag-aalinlangan sa πατρολῴαις at μητρολῴαις ay wastong napanatili sa talababa.
