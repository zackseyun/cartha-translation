id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: tl
  text: 'na alam ito: ang kautusan ay hindi itinakda para sa taong matuwid, kundi para sa mga suwail sa kautusan at mapaghimagsik, sa mga di-makadiyos at makasalanan, sa mga hindi banal at mga lapastangan, sa mga pumapatay sa kanilang mga ama at sa kanilang mga ina,[a] at sa mga mamamatay-tao,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga nananakit sa kanilang mga ama at sa kanilang mga ina.” Ang mga salitang Griyego ay maaaring tumukoy sa marahas na pananakit sa mga magulang, bagaman malamang na “pumapatay” ang kahulugan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: na alam ito
  rationale: Pinananatili ang participyal na ugnayan sa naunang pangungusap at ang diwang nagbibigay ito ng batayan sa tagubilin.
- source_word: δικαίῳ
  choice: para sa taong matuwid
  rationale: Likas sa makabagong Tagalog, isahan, at kinakatawan ang sinumang matuwid nang hindi ipinipilit na lalaki lamang ang tinutukoy.
- source_word: νόμος οὐ κεῖται
  choice: ang kautusan ay hindi itinakda
  rationale: Ipinahahayag ang legal na diwa ng κεῖται bilang paglalagda o pagtatakda, nang hindi ito pinapakahulugang basta 'hindi naaangkop.'
- source_word: ἀνόμοις
  choice: mga suwail sa kautusan
  rationale: Mas malinaw kaysa literal na 'walang kautusan' at pinananatili ang moral at legal na diwa.
- source_word: ἀνυποτάκτοις
  choice: mapaghimagsik
  rationale: Natural at malinaw na katumbas ng pagtangging magpasakop.
- source_word: ἀσεβέσι
  choice: mga hindi kumikilala sa Diyos
  rationale: Nauunawaan ng karaniwang mambabasa at ipinahahayag ang kawalan ng paggalang o debosyon sa Diyos.
- source_word: ἁμαρτωλοῖς
  choice: makasalanan
  rationale: Maikli at karaniwang katumbas, at umaayon sa magkakaparis na katawagan sa talaan.
- source_word: ἀνοσίοις
  choice: mga hindi banal
  rationale: Pinananatili ang pagkakaiba nito sa kawalan ng pagkilala sa Diyos at sa paglapastangan.
- source_word: βεβήλοις
  choice: lumalapastangan sa mga banal na bagay
  rationale: Nililinaw ang diwa ng pagtrato sa banal na para bang karaniwan, at iniiwasang pag-isahin ito sa ἀνοσίοις.
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: mga pumapatay sa kanilang mga ama at sa kanilang mga ina
  rationale: Ang mga pambihirang salita ay maaaring tumukoy sa pananakit o pagpatay sa mga magulang; pinili ang mas matinding diwa ayon sa konteksto, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: ἀνδροφόνοις
  choice: mga mamamatay-tao
  rationale: Karaniwan at tiyak na Tagalog para sa mga gumagawa ng labag sa batas na pagpatay.
theological_decisions:
- issue: Kinatawang panlalaking anyo ng δικαίῳ
  choice: taong matuwid
  alternative: matuwid na lalaki; mga matuwid
  rationale: Bagaman panlalaki at isahan ang anyong Griyego, ang gamit ay kinatawan. Ang 'taong matuwid' ay nagpapanatili sa isahan at generic na diwa nang hindi pinapakitid ang saklaw sa kalalakihan.
- issue: Saklaw ng πατρολῴαις / μητρολῴαις
  choice: mga pumapatay sa kanilang mga ama at sa kanilang mga ina
  alternative: mga nananakit sa kanilang mga ama at sa kanilang mga ina
  rationale: Maaaring mangahulugan ang mga salita ng marahas na pananakit o pagpatay. Malamang ang 'pumapatay' sa kontekstong ito, ngunit pinananatili sa talababa ang leksikal na katiyakan.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang anyo ng isang nagpapatuloy na pangungusap mula sa naunang talata at ang retorikang magkakaparis ng talaan.
