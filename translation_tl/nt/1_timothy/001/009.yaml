    rationale: Maaaring hindi kumilala ang isang tao sa Diyos nang hindi iyon ang buong diwa ng ἀσεβής; ang salita ay tumutukoy sa pagiging di-makadiyos, hindi maka-Diyos, o walang nararapat na paggalang sa Diyos.
  - severity: low
    issue: Ang “lumalapastangan sa mga banal na bagay” ay bahagyang mas eksplikado kaysa βεβήλοις.
    rationale: Ang Griyego ay pang-uring tumutukoy sa mga taong profane/lapastangan; ang “mga lapastangan” ay pinananatili ang maikling paralelong anyo at hindi nagdaragdag ng tahasang bagay ng paglapastangan.
