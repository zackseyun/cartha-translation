id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: tl
  text: Gaya ng ipinakiusap ko sa iyo nang papunta ako sa Macedonia, manatili ka sa Efeso upang utusan mo ang ilang tao na huwag magturo ng ibang aral,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “utusan ang ilang tao na huwag magturo ng naiibang doktrina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Gaya ng
  rationale: Pinananatili ang paghahambing at pagbabalik sa naunang pakiusap; natural ito sa makabagong Tagalog kahit ang pangungusap ay nagpapatuloy sa susunod na talata.
- source_word: παρεκάλεσά
  choice: ipinakiusap ko
  rationale: Ipinahahayag ang taimtim na paghimok nang hindi ito ginagawang tuwirang utos; akma sa ugnayan ni Pablo kay Timoteo.
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: manatili ka sa Efeso
  rationale: Tuwirang ipinapahayag ang pananatili sa isang lugar sa natural at marangal na Tagalog.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: nang papunta ako sa Macedonia
  rationale: Itinuturing ang participle na tumutukoy sa paglalakbay ng nagsasalita at ipinapakita ang temporal na kalagayan nang hindi nagdaragdag ng detalye.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na pinananatili ang layuning ipinahahayag ng sugnay.
- source_word: παραγγείλῃς
  choice: utusan mo
  rationale: Ang pandiwa ay tumutukoy sa may-awtoridad na tagubilin o utos. Sa konteksto ng pagpigil sa ibang aral, ang 'utusan' ay natural at hindi pinahihina ang lakas ng Griyego.
- source_word: τισὶν
  choice: ang ilang tao
  rationale: Tumutukoy sa mga tiyak ngunit hindi pinangalanang tao; natural ang 'ilang tao' sa Tagalog.
- source_word: ἑτεροδιδασκαλεῖν
  choice: mag­turo ng ibang aral
  rationale: Pinananatili ang diwa ng pagtuturo ng aral na naiiba, nang hindi tahasang dinaragdagan ng salitang 'mali' na higit sa leksikal na anyo.
theological_decisions:
- issue: Lakas ng παραγγείλῃς sa konteksto ng pagtutuwid sa iglesya
  choice: utusan mo
  alternative: tagubilinan mo
  rationale: May malinaw na ipinagkatiwalang awtoridad ang kilos. Mas tuwiran at pangkaraniwan ang 'utusan' kaysa 'tagubilinan,' at tapat ito sa lakas ng pandiwa.
- issue: Pagpapakahulugan sa ἑτεροδιδασκαλεῖν
  choice: magturo ng ibang aral
  alternative: magturo ng maling aral
  rationale: Ipinakikita ng tambalang pandiwa ang aral na naiiba sa pamantayang apostoliko. Ang 'maling aral' ay posibleng implikasyon sa konteksto ngunit mas tahasang mapanghatol kaysa sa mismong leksikal na anyo.
- issue: Ugnayang sintaktiko ng Καθὼς
  choice: panatilihin ang pambungad na 'Gaya ng' at ang kuwit sa dulo
  alternative: gawing ganap na malayang pangungusap
  rationale: Ang talata ay sintaktikong nagpapatuloy sa kasunod na pahayag; pinananatili ng salin ang bukas na estruktura sa halip na tahimik na punan ang pangunahing sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'aral' sa pangunahing teksto bilang higit na karaniwan sa mga ordinaryong mambabasa, habang inilagay sa talababa ang 'doktrina' bilang mas teknikal na katumbas. Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
