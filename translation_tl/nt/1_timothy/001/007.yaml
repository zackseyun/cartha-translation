id: 1TI.1.7
reference: 1 Timothy 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: tl
  text: Nais nilang maging mga tagapagturo ng Kautusan[a], kahit hindi nila nauunawaan ang kanilang sinasabi ni ang mga bagay na buong-tiwala nilang iginigiit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga tagapagturo ng Kautusan” ay malamang na tumutukoy sa mga nag-aangking may awtoridad na magturo ng Kautusang Judio (Torah).
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “hindi nauunawaan ang kanilang sinasabi ni ang buong-tiwala nilang pinagtitibay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: Nais nilang
  rationale: Ipinahahayag ang patuloy na hangarin ng ipinahihiwatig na simuno at likas sa makabagong Tagalog.
- source_word: εἶναι
  choice: maging
  rationale: Karaniwang anyong pawatas na kasama ng pandiwang nagsasaad ng pagnanais.
- source_word: νομοδιδάσκαλοι
  choice: mga tagapagturo ng Kautusan
  rationale: Pinananatili ang ugnayan sa νόμος nang hindi idinaragdag sa pangunahing teksto ang salitang 'Mosaic' o 'Torah'; ang malaking titik ay tumutulong ipahiwatig ang malamang na pagtukoy sa Kautusang Judio.
- source_word: μὴ νοοῦντες
  choice: kahit hindi nila nauunawaan
  rationale: 'Ginagawang malinaw ang pasalungat na diwa ng sugnay: naghahangad silang magturo ngunit wala silang pagkaunawa.'
- source_word: μήτε ... μήτε
  choice: ni ... ni
  rationale: Likas na magkaugnay na pagtanggi sa Tagalog pagkatapos ng 'hindi.'
- source_word: ἃ λέγουσιν
  choice: ang kanilang sinasabi
  rationale: Tumutukoy sa nilalaman ng kanilang pananalita at natural sa kasalukuyang Tagalog.
- source_word: περὶ τίνων
  choice: ang mga bagay na
  rationale: Pinananatili ang ikalawang layon ng kanilang pananalita nang hindi nagiging mabigat ang literal na 'tungkol sa mga bagay na.'
- source_word: διαβεβαιοῦνται
  choice: buong-tiwala nilang iginigiit
  rationale: Ipinahahayag kapuwa ang matibay na paggigiit at ang kumpiyansang lakas ng pandiwa; mas tumpak kaysa sa simpleng 'sinasabi.'
theological_decisions:
- issue: Tinutukoy ng νομοδιδάσκαλοι na Kautusan
  choice: Kautusan
  alternative: Kautusan ni Moises; Torah; batas
  rationale: Malamang na tumutukoy ito sa Kautusang Judio o Torah, ngunit hindi tahasang sinasabi ng tambalang pangngalan ang 'ni Moises.' Pinananatili ng salin ang lawak ng Griyego habang nililinaw ito sa talababa.
- issue: Ugnayan ng μὴ νοοῦντες sa θέλοντες
  choice: kahit hindi nila nauunawaan
  alternative: nang hindi nauunawaan
  rationale: Ang konteksto ay nagpapakita ng pasalungat na tensiyon sa pagitan ng hangaring maging guro at ng kakulangan sa pagkaunawa; hindi nito ipinapalagay ang isang dagdag na teolohikal na konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tagapagturo' sa halip na mas teknikal na tambalan, at 'iginigiit' upang maipakita ang lakas ng διαβεβαιοῦνται nang hindi nagiging labis na kolokyal.
