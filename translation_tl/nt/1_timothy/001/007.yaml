  source_fidelity: Tumpak na naisasalin ang θέλοντες εἶναι νομοδιδάσκαλοι bilang pagnanais na maging mga tagapagturo ng Kautusan. Ang concessive na “kahit hindi nila nauunawaan” ay angkop sa μὴ νοοῦντες, at malinaw na naipapahayag ng “ni ... ni” ang μήτε ... μήτε. Ang “buong-tiwala nilang iginigiit” ay sapat na katumbas ng matibay o may-kumpiyansang pag-aangkin sa διαβεβαιοῦνται.
  naturalness: Likas, malinaw, at marangal ang daloy sa makabagong Filipino. Ang “Nais nilang maging” at “ang kanilang sinasabi” ay idiomatiko; hindi rin mabigat ang ayos ng huling sugnay.
