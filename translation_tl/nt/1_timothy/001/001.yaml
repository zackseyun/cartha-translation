id: 1TI.1.1
reference: 1 Timothy 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: tl
  text: Si Pablo, isang apostol ng Mesiyas na si Jesus[a] ayon sa utos ng Diyos na ating Tagapagligtas at ng Mesiyas na si Jesus na ating pag-asa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Cristo Jesus” sa dalawang paglitaw ng “Mesiyas na si Jesus.” Ang salitang Griyego na Χριστός ay maaaring gumana bilang isinaling titulong “Mesiyas” o, sa ilang konteksto, bilang mas pangalang anyong “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ito ang nakaugaliang anyo ng pangalang Paul sa modernong saling Tagalog.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Pinananatili nito ang kinikilalang tungkulin at titulong Kristiyano, sa halip na paliitin ang kahulugan sa pangkalahatang “sugo.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang ang “na si” ay nagbibigay ng natural at malinaw na ugnayan ng titulo at pangalang Jesus sa Tagalog.
- source_word: κατ’ ἐπιταγήν
  choice: ayon sa utos
  rationale: Ipinahahayag nito na ang pagiging apostol ni Pablo ay nakabatay sa makapangyarihang utos, at malapit itong sumusunod sa diwa ng κατά kasama ng accusative.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: ng Diyos na ating Tagapagligtas
  rationale: Malinaw na iniuukol kay Diyos ang titulong Tagapagligtas at natural ang ayos nito sa Tagalog.
- source_word: καὶ Χριστοῦ Ἰησοῦ
  choice: at ng Mesiyas na si Jesus
  rationale: Inuulit ang pang-ukol na “ng” upang malinaw na kapuwa ang Diyos at ang Mesiyas na si Jesus ang kaugnay ng “utos,” gaya ng koordinasyon sa Griyego.
- source_word: τῆς ἐλπίδος ἡμῶν
  choice: na ating pag-asa
  rationale: Pinananatili ang appositional na pagkakakilanlan kay Jesus bilang ating pag-asa nang hindi ito pinalalawak o ipinapaliwanag nang labis.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay nananatiling buhay ang tungkulin nito bilang titulo, kaya isinasalin ito bilang “Mesiyas”; kinikilala sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Ugnayan ng “ating pag-asa” sa Mesiyas na si Jesus
  choice: Ang Mesiyas na si Jesus mismo ang tinutukoy na ating pag-asa
  alternative: “ang Mesiyas na si Jesus, na siyang ating pag-asa”
  rationale: Ang maikling “na ating pag-asa” ay natural na apposition sa Tagalog at hindi nagdaragdag ng paliwanag na wala sa Griyego.
- issue: Saklaw ng “utos”
  choice: Ang utos ay iniuugnay kapuwa sa Diyos at sa Mesiyas na si Jesus
  alternative: Pagbasa na mas maluwag ang pagkakaugnay ng ikalawang parirala
  rationale: Ang magkatugmang mga genitive na pinagdurugtong ng καί ay pinakamalinaw na kapuwa nakasalalay sa ἐπιταγήν; inuulit sa Tagalog ang “ng” para sa malinaw na gramatika.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang pormulang “Si Pablo” upang mapanatili ang anyong pambungad ng liham at ang di-ganap na pangungusap na nagpapatuloy sa susunod na talata. Pinili ang “Mesiyas na si Jesus” kaysa sa mas mekanikal na “Mesiyas Jesus” upang maging likas sa ordinaryong mambabasang Tagalog.
