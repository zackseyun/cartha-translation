  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: tl
  text: ni magbigay-pansin sa mga alamat at mga walang-katapusang talaangkanan, na nagbubunga ng mga haka-haka[a] sa halip na ng pangangasiwang mula sa Diyos[b] na ayon sa pananampalataya[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagtatalo” o “mga pagsisiyasat.” Ang salitang Griyego ay maaaring tumukoy sa mga tanong, pagsisiyasat, o pagtatalo na dito ay walang kapaki-pakinabang na bunga.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pangangasiwa ng Diyos,” “plano ng Diyos,” o “katiwalaang mula sa Diyos.” Ang Griyegong οἰκονομία ay maaaring tumukoy sa pangangasiwa, kaayusan o plano, o gawaing ipinagkatiwala.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pagtitiwala”; maaaring taglayin ng “pananampalataya” ang diwa ng katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: magbigay-pansin
  rationale: Likas sa modernong Filipino at pinananatili ang diwa ng pagbibigay-pansin o pagtutuon ng isip nang hindi labis na nagpapakahulugan.
- source_word: μύθοις
  choice: mga alamat
  rationale: Direkta at madaling maunawaang katumbas ng μῦθος; hindi nito ipinahihiwatig ang pambatang himig na maaaring idulot ng ibang katawagan.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: walang-katapusang talaangkanan
  rationale: Ipinahahayag ng ἀπέραντος ang kawalan ng hangganan o katapusan, samantalang ang “talaangkanan” ang natural na salin ng genealogical records o linages.
- source_word: ἐκζητήσεις
  choice: mga haka-haka
  rationale: Sa konteksto, tumutukoy ito sa walang-bungang pagsisiyasat o pagtatalo; malinaw na naihahatid ng “mga haka-haka” ang negatibong diwa nang hindi nililimitahan iyon sa hayagang alitan.
- source_word: παρέχουσι
  choice: nagbubunga
  rationale: Natural na ipinahahayag sa Filipino ang paglikha o pagbibigay-daan sa isang resulta.
- source_word: μᾶλλον ἢ
  choice: sa halip na
  rationale: Malinaw na ipinakikita ang paghahambing at pagsalungat ng dalawang kinalabasan.
- source_word: οἰκονομίαν θεοῦ
  choice: pangangasiwang mula sa Diyos
  rationale: Pinananatili ng “pangangasiwa” ang ubod na diwa ng οἰκονομία, at ng “mula sa Diyos” ang posibleng genitibong pinagmulan nang hindi isinasara ang posibilidad ng pagmamay-ari o banal na kaayusan.
- source_word: τὴν ἐν πίστει
  choice: na isinasagawa sa pananampalataya
  rationale: Ginagawang natural sa Filipino ang ugnayan ng ἐν πίστει sa pangangasiwa, habang pinananatili ang maaaring diwa ng larangan o paraan.
- source_word: πίστει
  choice: pananampalataya
  rationale: Ito ang karaniwang at angkop na katumbas ng πίστις dito; ang mga posibleng diwang “pagtitiwala” at “katapatan” ay inilalahad sa talababa.
theological_decisions:
- issue: Kahulugan ng οἰκονομίαν θεοῦ
  choice: pangangasiwang mula sa Diyos
  alternative: pangangasiwa ng Diyos; plano ng Diyos; katiwalaang mula sa Diyos
  rationale: Malawak ang saklaw ng οἰκονομία at maaaring tumukoy sa pangangasiwa, kaayusan, plano, o ipinagkatiwalang gawain. Pinananatili ng salin ang konkretong diwa at ang kalabuan ng genitibong θεοῦ nang hindi nagpapasok ng makitid na sistemang teolohikal.
- issue: Kahulugan ng πίστει sa τὴν ἐν πίστει
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Hindi hinihingi ng konteksto ang paglayo sa karaniwang saling “pananampalataya,” ngunit itinatala ang mas malawak na saklaw ng salita upang mapanatili ang tunay na leksikal at teolohikal na tensiyon.
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang gitling sa hulihan dahil nagpapatuloy ang pangungusap mula sa naunang talata. Inayos ang mga talababa ayon sa mismong salitang tinutukoy: [a] pagkatapos ng “mga haka-haka,” [b] pagkatapos ng “Diyos,” at [c] pagkatapos ng “pananampalataya.”'
