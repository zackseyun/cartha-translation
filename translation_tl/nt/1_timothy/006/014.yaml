  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: tl
  text: na tuparin mo ang utos nang walang dungis at walang maipupuna[b][c] hanggang sa pagpapakita ng ating Panginoong Jesus na Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesucristo.” Ang Griyegong titulong Χριστός ay maaaring isaling “Mesiyas” o gamitin sa nakaugaliang anyong “Cristo,” na higit na kahawig ng bahagi ng pangalan.
    reason: alternative_reading
  - marker: b
    text: Maaaring inilalarawan ng “walang dungis” at “walang maipupuna” ang mismong utos o ang paraan ng pagtupad ni Timoteo rito; siksik ang pagkakabuo ng Griyego at hindi ganap na nililinaw ang ugnayan.
    reason: lexical_alternative
  - marker: c
    text: O “na tuparin mo ang utos na walang dungis at walang maipupuna.”
    reason: alternative_rendering
lexical_decisions:
- source_word: τηρῆσαί
  choice: tuparin
  rationale: Sa konteksto ng utos na ibinigay sa naunang talata, ipinahihiwatig ng pandiwa ang matapat na pagsunod. Likas sa makabagong Tagalog ang “tuparin” at hindi nito nililimitahan ang diwa sa basta pag-iingat o pagbabantay.
- source_word: τὴν ἐντολήν
  choice: ang utos
  rationale: Pinananatili ng “utos” ang bigat ng tiyak at isahang ἐντολή habang nananatiling malinaw at karaniwan sa modernong Tagalog.
- source_word: ἄσπιλον
  choice: walang dungis
  rationale: Tuwirang ipinapahayag nito ang pagiging malaya sa mantsa o kapintasan at angkop kapuwa sa asal ng tumutupad at sa utos na pinananatiling dalisay.
- source_word: ἀνεπίλημπτον
  choice: walang maipupula
  rationale: Ipinahihiwatig nito na walang makatuwirang maibibintang o maipipintas; mas natural ito sa kasalukuyang Tagalog kaysa sa teknikal na “di-mapupulaan.”
- source_word: μέχρι
  choice: hanggang sa
  rationale: Malinaw nitong minamarkahan ang pagpapatuloy hanggang sa isang pangyayaring darating.
- source_word: ἐπιφανείας
  choice: pagpapakita
  rationale: Pinananatili nito ang diwa ng hayag na paglitaw ni Jesus nang hindi idinaragdag ang salitang “muli,” na hindi tahasang nasa pangngalan.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Natural na Tagalog para sa pagmamay-aring parirala at pinananatili ang “Panginoon” bilang titulong Cristolohikal.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ginagamit ang “na” upang maging likas sa Tagalog ang pamagat na kasunod ng pangalang Jesus.
theological_decisions:
- issue: Ang ugnayan ng ἄσπιλον at ἀνεπίλημπτον sa “utos” o sa pagtupad ni Timoteo
  choice: Inilalahad sa pangunahing teksto bilang paraan ng pagtupad, ngunit itinatala ang sintaktikong kalabuan
  alternative: Maaaring unawain na ang mismong utos ang “walang dungis at walang maipupula”
  rationale: Siksik ang Griyegong ayos at maaaring iugnay ang dalawang pang-uri sa ἐντολήν o sa pag-iingat/pagtupad ni Timoteo. Mas natural sa Tagalog ang pang-abay na anyo, ngunit hindi dapat itago ang alternatibong ugnayan.
- issue: Pagsasalin sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa maringal at eskatolohikal na parirala, nananatiling malinaw ang bisa nito bilang titulo; kaya isinasalin ang kahulugan sa pangunahing teksto habang ibinibigay sa talababa ang nakaugaliang anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tuparin” at “utos” bilang mga karaniwang salitang may sapat na bigat. Iniwasan ang pagdaragdag ng “muling” sa pagpapakita at pinanatili sa talababa ang tunay na sintaktikong kalabuan.
