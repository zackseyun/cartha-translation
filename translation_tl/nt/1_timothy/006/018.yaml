  text: gumawa sila ng mabuti, maging mayaman sa mabubuting gawa, maging bukas-palad at handang magbahagi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: gumawa sila ng mabuti
  rationale: Pinananatili nito ang pandiwang diwa ng infinitive bilang pagpapatuloy ng iniutos ni Pablo. Likas at malinaw ito sa makabagong Filipino.
- source_word: πλουτεῖν
  choice: maging mayaman
  rationale: Pinananatili ng salin ang talinghaga ng kayamanan at ang sadyang paghahambing nito sa materyal na yaman sa konteksto.
- source_word: ἐν ἔργοις καλοῖς
  choice: sa mabubuting gawa
  rationale: Tinutukoy nito ang larangan kung saan sila dapat maging mayaman. Ang pariralang ito ay malinaw, natural, at angkop sa gamit ng Mga Sulat Pastoral.
- source_word: εὐμεταδότους
  choice: maging bukas-palad
  rationale: Ipinahahayag nito ang kahandaang magbigay ng sariling yaman o ari-arian. Natural ang 'bukas-palad' sa Filipino at hindi lipas ang dating.
- source_word: κοινωνικούς
  choice: handang magbahagi
  rationale: Nahuhuli nito ang disposisyong kusang makibahagi o magbahagi sa iba, nang hindi ipinapasok ang posibleng mapanlinlang na diwa ng 'komunal.'
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: maging bukas-palad at handang magbahagi
  rationale: 'Pinananatili ang magkaugnay ngunit hindi ganap na magkaparehong ideya: ang una ay diin sa mapagbigay na pagkilos, at ang ikalawa ay sa kahandaang magbahagi.'
