id: 1TI.6.15
reference: 1 Timothy 6:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: tl
  text: na ipakikita niya sa sarili niyang mga takdang panahon[a]—siya na ang Mapalad at Nag-iisang Pinuno, ang Hari ng mga naghahari at Panginoon ng mga namumuno[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili niyang mga panahon”; tumutukoy ang parirala sa mga panahong itinakda niya.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “Hari ng mga hari at Panginoon ng mga panginoon.” Gumagamit ang Griyego ng mga participle, na literal na “Hari ng mga naghahari at Panginoon ng mga namumuno.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: na
  rationale: Ang panghalip na pambabae at isahan ay tumutukoy sa ἐπιφάνειαν (‘pagpapakita’) sa talata 14. Likas sa Tagalog ang pang-ugnay na ‘na’ para ipagpatuloy ang sugnay nang hindi nagpapahiwatig na tao ang tinutukoy.
- source_word: καιροῖς ἰδίοις
  choice: sa sarili niyang mga takdang panahon
  rationale: Pinananatili ang maramihang bilang at ang diwa ng mga panahong nauukol sa kaniya; idinagdag ang ‘takdang’ upang malinaw na καιρός ang tinutukoy, hindi basta paglipas ng oras.
- source_word: δείξει
  choice: ipakikita niya
  rationale: 'Tuwirang ipinapahayag ang hinaharap na aktibong kahulugan ng δείκνυμι: gagawin niyang hayag o makikita ang pagpapakita.'
- source_word: ὁ μακάριος
  choice: siya na mapalad
  rationale: Ang μακάριος ay ginagamit dito bilang marangal na titulong tumutukoy sa Diyos. Ang ‘mapalad’ ay mas angkop sa mataas na rehistro kaysa sa karaniwang ‘maligaya.’
- source_word: μόνος δυνάστης
  choice: tanging Makapangyarihang Pinuno
  rationale: Ipinahahayag ng δυνάστης ang isang may kapangyarihang mamahala. Ang parirala ay malinaw sa makabagong Tagalog at pinananatili ang bigat ng titulong ‘Sovereign’ nang hindi gumagamit ng lipas na salita.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: ang Hari ng mga naghahari
  rationale: Pinananatili ang pandiwang lakas ng participle βασιλευόντων (‘mga naghahari’) sa halip na awtomatikong gawing pangngalang ‘mga hari.’
- source_word: κύριος τῶν κυριευόντων
  choice: Panginoon ng mga namumuno
  rationale: Ang ‘Panginoon’ ay angkop na titulo para sa κύριος, samantalang ang ‘mga namumuno’ ay natural na Tagalog na nagpapanatili sa pandiwang diwa ng κυριευόντων.
theological_decisions:
- issue: Ang tiyak na pagkakakilanlan ng magpapakita
  choice: Pinananatili ang panghalip na ‘niya,’ at ang kasunod na mga titulo ang nagpapakilala sa simuno ayon sa anyo ng Griyego.
  alternative: Tahasang tukuyin ang Ama bilang siyang magpapakita sa pagpapakita ni Jesu-Cristo.
  rationale: Hindi nagbibigay rito ang Griyego ng pantanging pangalan kundi ng mga dakilang titulo. Hindi dapat magdagdag ang salin ng mas tiyak na pagkakakilanlang doktrinal kaysa sa mismong teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang malalaking titik sa ‘Hari’ at ‘Panginoon’ bilang mga titulong pantangi sa konteksto, habang iniwasan ang lipas o labis na teknikal na bokabularyo.
