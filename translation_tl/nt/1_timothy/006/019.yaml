  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: tl
  text: nag-iimpok para sa kanilang sarili ng isang mabuting pundasyon para sa hinaharap, upang panghawakan nila ang buhay na siyang tunay na buhay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: nag-iimpok
  rationale: Pinananatili nito ang larawan ng pag-iipon ng kayamanan at ang nagpapatuloy na kilos ng kasalukuyang participle, nang hindi gumagamit ng makalumang pananalita.
- source_word: ἑαυτοῖς
  choice: para sa kanilang sarili
  rationale: Ipinahahayag ng reflexive dative na ang pakinabang ng pag-iimpok ay para rin sa mga taong tinutukoy.
- source_word: θεμέλιον καλὸν
  choice: isang mabuting pundasyon
  rationale: Tuwirang pinananatili ang larawang panggusali ng θεμέλιον at ang positibong halaga ng καλόν.
- source_word: εἰς τὸ μέλλον
  choice: para sa hinaharap
  rationale: Natural at malawak na salin ito ng pariralang tumutukoy sa darating, nang hindi tahasang ipinapasok ang interpretasyong 'darating na kapanahunan.'
- source_word: ἐπιλάβωνται
  choice: panghawakan nila
  rationale: Pinananatili nito ang masiglang diwa ng paghawak o pagkapit sa isang bagay, sa halip na pahinain iyon bilang simpleng pagtanggap o pagtatamo.
- source_word: τῆς ὄντως ζωῆς
  choice: ang buhay na tunay na buhay
  rationale: Pinananatili ang tahasang pangngalang ζωή at ang diin ng ὄντως. Bagaman sadyang mariin ang pag-uulit sa Filipino, malinaw nitong ipinakikita ang kaibahan ng tunay na buhay sa buhay na nakabatay sa kayamanan.
theological_decisions:
- issue: Kung ang εἰς τὸ μέλλον ay dapat isaling tahasang eskatolohikal
  choice: para sa hinaharap
  alternative: para sa darating na kapanahunan
  rationale: May pahiwatig ng panghinaharap na katotohanan sa konteksto, ngunit hindi tahasang binabanggit ng Griyego ang isang 'kapanahunan.' Pinananatili ng salin ang lawak at tensiyon ng orihinal.
- issue: Kung paano ipahahayag ang τῆς ὄντως ζωῆς
  choice: ang buhay na tunay na buhay
  alternative: ang tunay na buhay
  rationale: Ang piniling anyo ay mas ganap na kumakatawan sa ὄντως at ζωή at pinananatili ang mariing pagkakaiba sa pagitan ng anyo ng buhay na iniuugnay sa kayamanan at ng buhay na tunay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong parirala ng talata dahil ang participle na ἀποθησαυρίζοντας ay nagpapatuloy sa utos at paksa mula sa naunang talata; hindi nagdagdag ng tahasang pang-ugnay na wala sa Griyego.
