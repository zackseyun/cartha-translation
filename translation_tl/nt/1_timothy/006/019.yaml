  source_fidelity: 'Tumpak ang pangunahing daloy: nagpapatuloy na pag-iimpok para sa sariling pakinabang, isang mabuting pundasyon para sa hinaharap, at layuning makapanghawak sa tunay na buhay. Gayunman, ang huling parirala ay nangangailangan ng mas natural na Tagalog upang maipahayag nang malinaw ang mariing ὄντως nang hindi binabago ang metapora ng ἐπιλάβωνται.'
  naturalness: Ang “ang buhay na tunay na buhay” ay nauunawaan ngunit hindi natural na modernong Filipino; tunog itong tuwirang kinopya mula sa Ingles. Ang “ang buhay na siyang tunay na buhay” ay mas idiomatiko sa marangal na rehistro at pinananatili ang parehong pangngalang “buhay” at ang diin na ito ang buhay sa ganap na diwa.
  terminology: Ang “nag-iimpok,” “para sa kanilang sarili,” “mabuting pundasyon,” at “hinaharap” ay angkop. Ang “panghawakan” ay angkop na salin ng ἐπιλάβωνται sapagkat pinananatili nito ang larawang pagkapit/paghawak, sa halip na gawing simpleng “matanggap” o “makamit.”
