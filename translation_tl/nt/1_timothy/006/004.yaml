  source_fidelity: 'Tapat ang salin sa Griyego. Ang «mapagmataas» ay wastong paglalarawan ng τετύφωται, habang pinananatili ng talababa ang imahen ng pagkalobo sa pagmamataas. Nasasaklaw ng «walang nauunawaan» ang μηδὲν ἐπιστάμενος. Ang «may sakit na pagkahumaling» ay pinananatili ang metapora ng νοσῶν at ang kaugnayan nito sa mga kontrobersiya at pag-aaway tungkol sa mga salita. Wasto ring naihayag ang resultang talaan: inggit, alitan, paninirang-puri, at masasamang hinala.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang «Siya’y» ay angkop bilang pagpapatuloy ng tinutukoy na tao mula sa naunang konteksto. Naiiba nang sapat ang «mga pagtatalo» at «pag-aaway tungkol sa mga salita» upang maipakita ang dalawang magkaugnay ngunit hindi magkaparehong terminong Griyego.
  terminology: Ang «inggit» para sa φθόνος, «alitan» para sa ἔρις, at «masasamang hinala» para sa ὑπόνοιαι πονηραί ay angkop. Ang «paninirang-puri» ay mahusay na kontekstuwal na salin ng βλασφημίαι sa interpersonal na talaan; maingat na iniiwan ng talababa ang mas malawak na posibilidad na «mga paglapastangan.» Ang lahat ng talababa ay may umiiral at wastong angkla.
