id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: tl
  text: Siya’y mapagmataas[a] at walang nauunawaan, kundi may sakit na pagkahumaling sa mga pagtatalo at pag-aaway tungkol sa mga salita[b]. Mula sa mga ito ay nagmumula ang inggit, alitan, paninirang-puri[c], at masasamang hinala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging palalo.” Literal na inilalarawan ng Griyego ang isang taong namamaga o lumolobo sa pagmamataas.
    reason: lexical_alternative
  - marker: b
    text: O “mga pag-aaway dahil sa mga salita.”
    reason: lexical_alternative
  - marker: c
    text: Dito, ang “paninirang-puri” ay tumutukoy sa mapanirang pananalita laban sa mga tao. Sa ibang konteksto, ang salitang Griyego ay maaaring mangahulugang “mga paglapastangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: mapagmataas
  rationale: Ipinahahayag ng perpektong anyo ang nananatiling kalagayan ng pagmamataas. Natural ito sa makabagong Tagalog; inilalagay sa talababa ang literal na larawang namamaga o lumolobo sa yabang.
- source_word: μηδὲν ἐπιστάμενος
  choice: walang nauunawaan
  rationale: Tumutukoy sa kawalan ng tunay na pagkaunawa, hindi lamang sa kawalan ng impormasyong nalalaman.
- source_word: νοσῶν
  choice: may sakit na pagkahumaling
  rationale: Pinananatili ang metapora ng karamdaman habang malinaw na inilalarawan ang di-malusog na pagkahilig.
- source_word: περὶ ζητήσεις
  choice: sa mga pagtatalo
  rationale: Ang ζητήσεις dito ay mga kontrobersiya o mapagtalong usapin; karaniwan at malinaw ang 'mga pagtatalo' sa Tagalog.
- source_word: λογομαχίας
  choice: pag-aaway tungkol sa mga salita
  rationale: Ipinahahayag nito kapwa ang pakikipaglaban at ang pokus sa mga salita; mas malinaw kaysa sa isang pilit na tambalang salita.
- source_word: ἐξ ὧν γίνεται
  choice: Mula sa mga ito ay nagmumula
  rationale: Malinaw na iniuugnay ang kasunod na mga bisyo bilang bunga ng mga pagtatalo at pag-aaway tungkol sa mga salita.
- source_word: φθόνος
  choice: inggit
  rationale: Tumpak na katumbas ng mapanibughong pagnanais sa taglay ng iba.
- source_word: ἔρις
  choice: alitan
  rationale: Natural at marangal na salitang tumutukoy sa hidwaan o pagtutunggali.
- source_word: βλασφημίαι
  choice: paninirang-puri
  rationale: Sa kontekstong ito ng mga kasalanang nagaganap sa ugnayan ng mga tao, malamang na tumutukoy ito sa mapanirang pananalita laban sa kapwa; pinananatili sa talababa ang posibilidad na 'mga paglapastangan.'
- source_word: ὑπόνοιαι πονηραί
  choice: masasamang hinala
  rationale: Direkta at natural na ipinahahayag ang moral na masamang uri ng paghihinala.
theological_decisions:
- issue: Ang tinutukoy ng βλασφημίαι
  choice: paninirang-puri laban sa kapwa
  alternative: mga paglapastangan, kabilang ang laban sa Diyos
  rationale: Iminumungkahi ng interpersonal na talaan ng mga bisyo ang mapanirang pananalita laban sa mga tao, ngunit hindi lubos na inaalis ng salitang Griyego ang mas malawak na kahulugan kaya binanggit ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Siya’y' upang natural na ipagpatuloy ang paksa mula sa naunang talata. Pinanatili ang matingkad na metapora ng pagkakasakit, ngunit ipinaliwanag ang metapora sa paraang madaling maunawaan.
