lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa maling pag-aakalang ang debosyon sa Diyos ay paraan upang kumita sa naunang talata.
- source_word: πορισμὸς
  choice: pakinabang
  rationale: Saklaw nito ang diwa ng pakinabang o kita at pinananatili ang ugnayang leksikal sa naunang talata nang hindi nililimitahan sa salapi.
- source_word: μέγας
  choice: malaking
  rationale: Natural na katumbas sa Filipino at malinaw na naghahayag ng mataas na pagpapahalaga.
- source_word: εὐσέβεια
  choice: pamumuhay na may takot sa Diyos
  rationale: Ipinahahayag nito ang magalang na debosyon sa Diyos na nakikita sa paraan ng pamumuhay; mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal o makalumang katawagan.
- source_word: μετὰ
  choice: kung may
  rationale: Natural na ipinahahayag sa Filipino ang pagsama o pag-iral ng kasiyahan kasabay ng pamumuhay na may takot sa Diyos.
- source_word: αὐταρκείας
  choice: kasiyahan sa kung anong mayroon
  rationale: Ipinakikita ng kasunod na konteksto ang pagiging nasisiyahan sa pangunahing pangangailangan, hindi ang ganap na pagsasarili o kawalan ng pangangailangan sa Diyos.
theological_decisions:
- issue: Diwa ng αὐτάρκεια sa kontekstong Cristiano
  choice: kasiyahan sa kung anong mayroon
  alternative: kasapatan sa sarili
  rationale: Ipinaliliwanag ng mga talatang 7–8 ang pagiging nasisiyahan sa pagkain at pananamit; iniiwasan ng salin ang pahiwatig ng nagsasariling pag-asa sa sarili.
- issue: Ugnayan ng εὐσέβεια at πορισμός
  choice: ang pamumuhay na may takot sa Diyos na may kasiyahan ay malaking pakinabang mismo
  alternative: ang pamumuhay na may takot sa Diyos ay isang paraan upang magkaroon ng malaking pakinabang kapag may kasiyahan
  rationale: Pinananatili ng predikatibong salin ang malamang na pagsalungat at paglalaro sa ideya ng pakinabang mula sa talata 5, nang hindi ginagawang kasangkapan ang debosyon para sa materyal na kita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pamumuhay na may takot sa Diyos” upang maging madaling maunawaan ang εὐσέβεια, at pinalawak nang bahagya ang αὐτάρκεια upang malinaw ang kontekstuwal na diwa nito.
