  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: tl
  text: Ngunit ang mga naghahangad yumaman[a] ay nahuhulog sa tukso, sa bitag[b], at sa maraming hangaring hangal at nakapipinsala, na siyang naglulubog sa mga tao sa kapahamakan at pagkawasak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghangad na maging mayaman.” Maaaring tumukoy ang Griyego sa pagnanais na yumaman o maging mayaman, hindi lamang sa kalagayan ng pagkakaroon ng yaman.
    reason: lexical_alternative
  - marker: b
    text: O “silo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: Ngunit ang mga naghahangad yumaman
  rationale: Ipinahahayag ng βουλόμενοι ang matibay na pagnanais o hangarin, at maaaring tumukoy ang πλουτεῖν sa pagiging o pagyaman. Likas sa modernong Tagalog ang “naghahangad yumaman” at malinaw na nakatuon sa pagnanais na magkamal ng yaman, hindi sa simpleng kalagayan ng pagkakaroon nito.
- source_word: ἐμπίπτουσιν εἰς πειρασμόν
  choice: ay nahuhulog sa tukso
  rationale: Pinananatili ng “nahuhulog sa” ang metapora ng pagpasok sa isang masamang kalagayan; sa kontekstong ito, ang πειρασμός ay tukso sa kasalanan, hindi lamang neutral na pagsubok.
- source_word: παγίδα
  choice: bitag
  rationale: Ang “bitag” ay natural at malinaw na katumbas sa Tagalog at pinananatili ang larawan ng pagkakahuli.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: maraming hangaring hangal at nakapipinsala
  rationale: Sapat na malawak ang “hangarin” para sa ἐπιθυμίαι; malinaw at kasalukuyang pananalita ang “hangal” at “nakapipinsala” para sa ἀνοήτους at βλαβεράς.
- source_word: αἵτινες
  choice: Ang mga ito
  rationale: Tumutukoy ang panghalip sa naunang maraming hangarin. Ginawang bagong pangungusap upang maging malinaw sa Tagalog ang tinutukoy nang hindi binabago ang ugnayang lohikal.
- source_word: βυθίζουσι τοὺς ἀνθρώπους
  choice: ang naglulubog sa mga tao
  rationale: Pinananatili ng “naglulubog” ang matingkad na larawan ng βυθίζω bilang pagpapalubog; generic ang ἀνθρώπους kaya “mga tao,” hindi partikular na mga lalaki.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: kapahamakan at pagkawasak
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkaibang termino at ang tumitinding babala, nang hindi parehong isinasalin sa iisang salita.
theological_decisions:
- issue: Kung ang ὄλεθρον καὶ ἀπώλειαν ay dapat tahasang ipakahulugang walang-hanggang kaparusahan
  choice: kapahamakan at pagkawasak
  alternative: kapahamakan at walang-hanggang kapahamakan
  rationale: Mabigat ang babala ng Griyego ngunit hindi nito sa talatang ito lamang tahasang nililimitahan ang saklaw sa walang-hanggang hatol. Pinananatili ng salin ang bigat at tunay na tensiyong teolohikal nang walang idinaragdag na mas tiyak na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “naghahangad yumaman” sa halip na mas kolokyal na “gustong yumaman,” at “naglulubog” upang mapanatili ang matingkad na metapora ng orihinal.
