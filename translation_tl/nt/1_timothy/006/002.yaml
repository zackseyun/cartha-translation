  terminology: Ang “panginoon,” “mananampalataya,” “mga kapatid,” at “minamahal” ay angkop sa modernong Filipino Tagalog at sa kontekstong panlipunan at pangkomunidad ng talata. Pinananatili ng “mabuting gawa” ang εὐεργεσία nang hindi ipinipilit sa pangunahing teksto na ang tinutukoy ay ang paglilingkod ng mga alipin.
