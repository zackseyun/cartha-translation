id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: tl
  text: At ang mga may mga panginoong mananampalataya ay huwag humamak sa kanila dahil mga kapatid sila[a]. Sa halip, lalo pa nilang paglingkuran ang mga ito, sapagkat ang mga nakikinabang sa mabuting gawa ay mga mananampalataya at minamahal.[b] Ituro at itagubilin mo ang mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga kapatid na lalaki”; sa gamit ng mga unang Cristiano, maaari itong tumukoy sa mga kapwa mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Mahirap unawain ang pariralang Griyego. Malamang na tumutukoy ito sa mga mananampalatayang panginoon bilang mga nakikinabang sa paglilingkod ng mga alipin; maaari rin itong unawain na ang mga aliping mananampalataya ang gumagawa o nakikibahagi sa mabuti.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: mananampalatayang
  rationale: Tumutukoy ito sa mga panginoong sumasampalataya kay Cristo, hindi lamang sa mga mapagkakatiwalaan.
- source_word: δεσπότας
  choice: panginoon
  rationale: Sa konteksto ng pang-aalipin at sambahayan, tumutukoy ito sa mga taong may ganap na kapangyarihan sa mga alipin; natural at dignified sa Filipino ang 'panginoon' sa pariralang ito.
- source_word: καταφρονείτωσαν
  choice: huwag humamak
  rationale: Ipinapahayag nito ang paghamak o pagtingin nang mababa at pinananatili ang lakas ng pagbabawal.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang natural na Filipino na 'mga kapatid' ay hindi minamarkahan ang kasarian at karaniwang tumutukoy sa magkakapatid sa pananampalataya.
- source_word: μᾶλλον δουλευέτωσαν
  choice: lalo pa silang maglingkod
  rationale: Pinananatili ng 'lalo pa' ang μᾶλλον, at ipinahihiwatig ng 'maglingkod' ang gawaing isinasagawa sa kalagayan ng pagkaalipin nang hindi nagiging asiwa ang Filipino.
- source_word: πιστοί
  choice: mga mananampalataya
  rationale: Dito rin, ang tinutukoy ay mga sumasampalataya kay Cristo.
- source_word: ἀγαπητοὶ
  choice: minamahal
  rationale: Natural itong salin na nagpapanatili sa mapagmahal na bigat ng salita sa pamayanang Cristiano.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ang mga nakikinabang sa kanilang mabuting paglilingkod
  rationale: Ipinakikita ang malamang na kahulugang ang mga panginoon ang nakikinabang, habang nililinaw sa talababa na mahirap at maaaring unawain sa ibang paraan ang siksik na pariralang Griyego.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Ituro mo at ipayo ang mga bagay na ito
  rationale: Kapwa pautos kay Timoteo; ang 'ipayo' ay natural na Filipino para sa paghimok o masidhing pagpapayo sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ang 'mga kapatid' sa Filipino ay natural na tumutukoy sa kapwa mananampalataya nang hindi nagdaragdag o nag-aalis ng kasarian; ipinapaliwanag ng talababa ang anyong Griyego.
- issue: Terminolohiya sa konteksto ng pang-aalipin
  choice: mga panginoon ... maglingkod
  alternative: mga amo ... magpaalipin
  rationale: Tumpak na ipinahahayag ng 'panginoon' ang δεσπότης, samantalang natural na isinasalin ng 'maglingkod' ang δουλεύω. Hindi itinatago ang kontekstong panlipunan, ngunit hindi rin ipinapasok ang pangngalang 'alipin,' na wala sa mismong talata.
- issue: Tinukoy ng οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ang mga mananampalatayang panginoon ang nakikinabang sa mabuting paglilingkod
  alternative: ang mga aliping mananampalataya ang gumagawa o nakikibahagi sa kabutihan; o kapwa panig ang nakikinabang
  rationale: Pinakamalapit sa daloy ng pangungusap ang pagtukoy nito sa mga panginoon, ngunit mahirap at pinagtatalunan ang Griyegong parirala, kaya tahasang itinatala ang ibang posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sila'y' upang mapanatiling maayos ang ritmo; ang 'panginoon' ay binabasa rito sa kontekstong panlipunan, hindi bilang titulong tumutukoy sa Diyos. Ang pangunahing teksto ay bahagyang nagpapaliwanag sa εὐεργεσία bilang 'mabuting paglilingkod,' habang pinananatili sa talababa ang tunay na hirap at alternatibong pagbasa ng Griyego.
