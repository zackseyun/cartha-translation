  to: At ang mga may mga panginoong mananampalataya ay huwag humamak sa kanila dahil mga kapatid sila[a]. Sa halip, lalo pa nilang paglingkuran ang mga ito, sapagkat ang mga nakikinabang sa mabuting gawa ay mga mananampalataya at minamahal.[b] Ituro at itagubilin mo ang mga bagay na ito.
  rationale: Inalis ang “kanilang ... paglilingkod” mula sa pangunahing teksto upang hindi malutas doon ang pinagtatalunang ugnayan ng genitive at ng participle. Ang “mabuting gawa” ay mas malapit sa εὐεργεσία kaysa “mabuting paglilingkod,” habang ang talababa ay nananatiling nagbibigay ng malamang na kontekstuwal na pagbasa. Pinahusay din ang pagpapahayag ng paglilingkod at ng panghuling utos nang hindi binabago ang kahulugan.
