base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: tl
  text: Sapagkat wala tayong dinalang anuman sa sanlibutan[a], at wala rin tayong mailalabas na anuman mula rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Sapagkat wala tayong dinalang anuman sa sanlibutan, sapagkat hindi rin tayo makapaglalabas ng anuman.” Ang pang-ugnay na Griyego ay maaaring unawaing nagpapahayag ng dahilan (“sapagkat”) o nagpapakilala sa katugmang ikalawang pahayag.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: wala ... anuman
  rationale: Likas na Filipino para sa ganap na pagkakaila at malinaw na layon ng pandiwang “dinala.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag, gaya ng gamit ng γάρ.
- source_word: εἰσηνέγκαμεν
  choice: dinala
  rationale: Tumpak at likas na katumbas ng “nagdala paloob”; sa konteksto, tumutukoy sa pagpasok ng tao sa sanlibutan sa pagsilang.
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Ang κόσμος dito ay ang daigdig o kalagayang pantao na pinapasok sa pagsilang; ang “sanlibutan” ay dignificado at karaniwang biblikal na Filipino.
- source_word: ὅτι
  choice: at
  rationale: Ginagawang likas ang magkatimbang na dalawang pahayag. Dahil maaari rin itong unawaing sanhi, pinananatili sa talababa ang alternatibong “sapagkat/dahil.”
- source_word: οὐδὲ
  choice: wala rin
  rationale: Ipinahahayag ang kasunod at katumbas na negatibong pahayag nang natural sa Filipino.
- source_word: ἐξενεγκεῖν
  choice: mailalabas ... mula rito
  rationale: Pinananatili ang larawan ng pagdadala palabas sa sanlibutan, samantalang ang “mula rito” ay nililinaw ang pinagmumulan nang hindi nagdaragdag ng bagong ideya.
- source_word: τι
  choice: anuman
  rationale: Likas na katumbas ng di-tiyak na panghalip sa ilalim ng pagkakaila.
- source_word: δυνάμεθα
  choice: mailalabas
  rationale: Ang hulaping ma- ay likas na nagpapahayag ng kakayahan sa Filipino; katumbas ito ng “hindi natin kayang ilabas” ngunit mas maikli at matatas.
theological_decisions:
- issue: Ugnayan ng ikalawang sugnay na ipinakilala ng ὅτι
  choice: 'Magkatimbang na pagpapatuloy: “at wala rin tayong mailalabas na anuman.”'
  alternative: 'Sanhing sugnay: “sapagkat/dahil wala rin tayong mailalabas na anuman.”'
  rationale: Maaaring sanhi ang ὅτι, ngunit ang konteksto ay may anyong kawikaan na nagtatambal sa walang dinala paloob at walang mailalabas. Hindi itinatago ang tunay na kalabuan sapagkat inilalahad sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Ginamit ang “sanlibutan” bilang pamilyar na katawagang biblikal, habang ang kayarian ng pangungusap ay nananatiling natural para sa karaniwang mambabasa.
