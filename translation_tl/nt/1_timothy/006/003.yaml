id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: tl
  text: Kung may nagtuturo ng ibang aral at hindi sumasang-ayon sa wastong mga salita[a]—ang mga salita ng ating Panginoong Jesus na Mesiyas[b]—at sa aral na naaayon sa maka-Diyos na pamumuhay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “malulusog na mga salita”; tumutukoy ito sa mga salitang tama at kapaki-pakinabang sa pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: O “ating Panginoong Jesu-Cristo.” Ang “Mesiyas” ang kahulugan ng titulong Griyego na Christos.
    reason: alternative_rendering
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: nagtuturo ng ibang aral
  rationale: Ipinahahayag nito na ang itinuturo ay naiiba sa tinatanggap na aral, nang hindi idinaragdag ang tahasang paghatol na “maling aral,” na hindi naman nakapaloob mismo sa pandiwa.
- source_word: προσέρχεται
  choice: sumasang-ayon sa
  rationale: Bagaman literal itong tumutukoy sa paglapit, sa kontekstong ito ipinahihiwatig nito ang pagtanggap o pagpanig sa isang aral. Likas at malinaw sa Tagalog ang “sumasang-ayon sa.”
- source_word: ὑγιαίνουσι λόγοις
  choice: wastong mga salita
  rationale: Ang ὑγιαίνω ay metaporang tumutukoy sa pagiging malusog o tama ng aral. Ang “wastong” ay natural sa modernong Tagalog, samantalang pinananatili ng “mga salita” ang λόγοις sa halip na palitan ito agad ng “aral.”
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ang mga salita ng ating Panginoong Jesus na Mesiyas
  rationale: Nililinaw ng pariralang Griyego na ang “wastong mga salita” ay yaong nagmumula o nauukol sa Panginoong Jesus. Inulit ang “mga salita” upang maging malinaw at natural sa Tagalog.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinalin ang titulong Χριστός ayon sa kahulugan nito sa halip na basta itransliterang “Cristo.” Ang “Jesus na Mesiyas” ay likas na paraan sa Tagalog upang ipakitang titulo ito.
- source_word: κατ’ εὐσέβειαν
  choice: naaayon sa maka-Diyos na pamumuhay
  rationale: Ipinakikita ng κατά ang pagkakatugma ng aral at ng εὐσέβεια. Hindi nito pinipiling ipakahulugan na ang aral ang sanhi ng gayong pamumuhay, kaya napapanatili ang saklaw ng orihinal.
- source_word: διδασκαλίᾳ
  choice: aral
  rationale: Maaaring tumukoy ang salita sa pagtuturo o sa nilalaman nito. Ang “aral” ay maikli, natural, at angkop sa konteksto.
- source_word: εὐσέβειαν
  choice: maka-Diyos na pamumuhay
  rationale: Saklaw nito ang debosyon at paggalang sa Diyos na nahahayag sa buhay at asal. Mas madaling maunawaan ito ng karaniwang mambabasa kaysa sa mas pormal na “kabanalan” o “debosyon.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo. Inilagay ang tradisyonal na “Jesu-Cristo” sa talababa upang kilalanin ang pamilyar na anyo nang hindi itinatago ang kahulugan ng titulo.
- issue: Ugnayan ng aral at εὐσέβεια sa κατ’ εὐσέβειαν
  choice: aral na naaayon sa maka-Diyos na pamumuhay
  alternative: aral na humahantong sa maka-Diyos na pamumuhay
  rationale: Ang “naaayon sa” ay nagpapanatili sa ideya ng pagkakatugma at hindi nagpapasok ng tiyak na ugnayang sanhi at bunga na hindi tahasang ipinahahayag ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “wastong mga salita” sa pangunahing teksto upang maiwasan ang di-likas na literalismong “malulusog na salita,” ngunit pinanatili sa talababa ang metapora ng orihinal. Ang pangungusap ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang kondisyong pangungusap sa kasunod na talata.
