  terminology: Ang “makadiyos na pamumuhay” ay isang angkop at positibong salin ng εὐσέβεια. Pinananatili nito na ang mali ay ang mapagsamantalang pagtingin dito, hindi ang makadiyos na pamumuhay mismo. Ang “katotohanan” ay angkop para sa τῆς ἀληθείας.
