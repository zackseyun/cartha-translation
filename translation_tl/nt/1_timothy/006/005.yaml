  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: tl
  text: walang tigil na alitan[a] sa pagitan ng mga taong tiwali ang pag-iisip at pinagkaitan ng katotohanan, na nag-aakalang ang makadiyos na pamumuhay ay isang paraan upang magtamo ng pakinabang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy na pag-aaway” o “tuluy-tuloy na pagtatalo.” Inilalarawan ng salitang Griyego ang walang humpay na pagkikiskisan sa isa’t isa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang makadiyos na pamumuhay ay pakinabang” o “pinagmumulan ng pakinabang.” Itinuturing nila ang makadiyos na pamumuhay bilang isang bagay na magagamit para sa sariling pakinabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: walang tigil na alitan
  rationale: Ipinahihiwatig ng pambihirang pangngalan ang patuloy na pagkikiskisan o pag-aaway. Natural sa modernong Filipino ang “walang tigil na alitan,” habang pinananatili ng talababa ang larawan ng pagkikiskisan.
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: sira ang pag-iisip
  rationale: Ang perpektong pasibong pandiwari ay naglalarawan ng kalagayang bunga ng pagkasira. Malinaw at matindi ang “sira ang pag-iisip” nang hindi dinaragdagan ang moral na hatol ng Griyego.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: pinagkaitan ng katotohanan
  rationale: Pinananatili nito ang pasibong anyo at ang nagpatuloy na kalagayan ng pagkawala, pati ang tiyak na “katotohanan.”
- source_word: νομιζόντων
  choice: nag-aakalang
  rationale: Ang “nag-aakala” ay natural na nagpapahiwatig ng paniniwalang mali sa kontekstong ito, nang hindi kailangang magdagdag ng tahasang paliwanag.
- source_word: πορισμὸν
  choice: isang paraan para kumita
  rationale: Saklaw ng salita ang pakinabang o paraan ng pagtatamo nito. Ang pariralang ito ay malinaw na nagpapakita ng mapagsamantalang paggamit sa makadiyos na pamumuhay at madaling maunawaan sa Filipino.
- source_word: εὐσέβειαν
  choice: makadiyos na pamumuhay
  rationale: Tumutukoy ang salita sa paggalang at debosyong nakatuon sa Diyos na nahahayag sa pamumuhay. Mas natural ito kaysa “pagkamaka-Diyos” at hindi nito ibinababa ang positibong salita tungo sa panlabas na relihiyon lamang.
theological_decisions:
- issue: Kung ang εὐσέβεια ay tumutukoy sa tunay na debosyon o sa panlabas na relihiyon lamang
  choice: makadiyos na pamumuhay
  alternative: relihiyon; debosyon sa Diyos; pagkamaka-Diyos
  rationale: Positibo ang salitang Griyego; ang kinokondena ay hindi ang makadiyos na pamumuhay kundi ang pagtrato rito bilang pagkakakitaan.
- issue: Gaano katindi ang paglalarawan sa διεφθαρμένων
  choice: sira ang pag-iisip
  alternative: bulok ang isip; tiwali ang pag-iisip
  rationale: Pinananatili nito ang matinding paghatol ng teksto ngunit iniiwasang magpasok ng mas tiyak o mas mabigat na doktrinal na kahulugan kaysa sa nasa pandiwari.
- issue: Kung ang πορισμός ay dapat tahasang limitahan sa materyal na pakinabang
  choice: paraan para kumita
  alternative: pinagmumulan ng pakinabang; pakinabang
  rationale: Malakas ang pahiwatig ng konteksto na ginagamit ang debosyon para sa mapapakinabangan, malamang na materyal. Gayunman, inilalagay sa talababa ang mas malawak na “pakinabang” upang hindi itago ang saklaw ng pangngalang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa pagitan ng” upang maging natural ang ugnayan ng alitan at ng mga taong sangkot dito. Pinanatili ang anyong bahagi ng mas mahabang pangungusap ng 1 Timoteo 6:3–5 sa pamamagitan ng pagsisimula sa maliit na titik, alinsunod sa Griyegong sugnay.
