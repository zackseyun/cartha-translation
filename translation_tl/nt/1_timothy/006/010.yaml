  terminology: Nananatiling angkop ang “pag-ibig sa salapi” para sa φιλαργυρία at “pananampalataya” para sa πίστις. Ginamit ang “Kristiyano” sa talababa bilang karaniwang modernong baybay sa Filipino, nang hindi ipinipilit na ang pangunahing teksto ay dapat pumili sa pagitan ng obhetibo at pansariling pakahulugan ng πίστις.
