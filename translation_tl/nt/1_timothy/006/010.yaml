  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang φιλαργυρία ay “isang ugat” ng sari-saring kasamaan, ang ilan ay lumalayo mula sa pananampalataya dahil sa paghahangad nito, at sila mismo ang nakararanas ng maraming pasakit. Gayunman, ang “Dahil pinananabikan ito” ay hindi gaanong natural na pag-uugnay sa Tagalog, at ang “tinusok ... ng maraming kirot” ay hindi malinaw na naihahayag ang instrumental na larawan ng περιέπειραν ὀδύναις πολλαῖς.'
