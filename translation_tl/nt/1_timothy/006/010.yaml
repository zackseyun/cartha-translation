  to: Sapagkat ang pag-ibig sa salapi ay isang ugat ng sari-saring kasamaan.[a] Sa paghahangad nito, ang ilan ay lumihis mula sa pananampalataya[b] at tinuhog ang kanilang sarili ng maraming pasakit.[c]
  rationale: Inayos ang sintaksis upang maging likas sa modernong Tagalog at pinanatili ang saklaw at metapora ng Griyego. Ang “Sa paghahangad nito” ay malinaw na nag-uugnay sa matinding paghahangad ng pag-ibig sa salapi at sa paglihis ng ilan. Ang “tinuhog ... ng maraming pasakit” ay mas maayos na naghahatid ng περιέπειραν at ng malawak na ὀδύναις, nang hindi nililimitahan ang mga ito sa pisikal na sakit o sa damdamin lamang.
