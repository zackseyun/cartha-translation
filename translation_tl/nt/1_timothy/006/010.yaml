  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: tl
  text: Sapagkat ang pag-ibig sa salapi ay isang ugat ng sari-saring kasamaan.[a] Sa paghahangad nito, ang ilan ay lumihis mula sa pananampalataya[b] at tinuhog ang kanilang sarili ng maraming pasakit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na salin, “ang pag-ibig sa salapi ang ugat ng lahat ng kasamaan.” Mas natural na ipinahihintulot ng Griyego ang “isang ugat ng sari-saring kasamaan,” kaya hindi nito ipinahihiwatig na iisa lamang ang sanhi ng bawat kasamaan.
    reason: alternative_reading
  - marker: b
    text: O “lumihis mula sa pananampalataya.” Sa kontekstong ito, malamang na tumutukoy ang “pananampalataya” sa pananampalatayang Kristiyano bilang kabuuan ng pinaniniwalaan.
    reason: lexical_alternative
  - marker: c
    text: O “tinusok ang kanilang sarili ng maraming dalamhati” o “maraming pagdurusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: isang ugat
  rationale: Ang pangngalang walang pantukoy at ginagamit bilang panaguri ay natural na maunawaan bilang isa sa mga ugat o pinagmumulan, hindi bilang nag-iisang ugat.
- source_word: πάντων τῶν κακῶν
  choice: ng sari-saring kasamaan
  rationale: Ipinahahayag nito ang malawak at sari-saring anyo ng masasamang bagay nang hindi ipinahihiwatig na lahat ng kasamaan, nang walang eksepsiyon, ay iisa ang sanhi.
- source_word: φιλαργυρία
  choice: ang pag-ibig sa salapi
  rationale: Tuwirang pinananatili ang kahulugan ng tambalang Griyego na pag-ibig sa pera o pilak; mas tiyak ito kaysa sa mas malawak na “kasakiman.”
- source_word: ὀρεγόμενοι
  choice: Dahil pinananabikan ito
  rationale: Ipinakikita ng pandiwaring Griyego ang matinding paghahangad at ang kaugnayan nito sa pagkaligaw ng ilan.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: naligaw palayo sa pananampalataya
  rationale: Pinananatili ang larawan ng paglihis o paglayo mula sa dating kinalalagyan at ang puwersa ng ἀπό.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa konteksto, maaaring tumukoy ito sa pananampalatayang Cristiano bilang pinaniniwalaang katotohanan; hindi kailangang lagyan ng “ang” sa Tagalog upang maipahayag ang ganitong diwa.
- source_word: περιέπειραν
  choice: tinusok ang kanilang sarili
  rationale: Pinananatili ang matingkad na metapora ng pagtusok o pagtagos at ang reflexive na ἑαυτούς.
- source_word: ὀδύναις πολλαῖς
  choice: ng maraming kirot
  rationale: Ang “kirot” ay maaaring sumaklaw sa matinding pisikal o panloob na pagdurusa at pinananatili ang larawan ng pagkatusok.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa salapi at kasamaan
  choice: Ang pag-ibig sa salapi ay isang ugat ng sari-saring kasamaan.
  alternative: Ang pag-ibig sa salapi ang ugat ng lahat ng kasamaan.
  rationale: Mas natural sa balarilang Griyego ang di-tiyak na “isang ugat,” at ang pangmaramihang κακῶν ay angkop na maipahayag bilang sari-saring kasamaan. Iniiwasan nitong gawing nag-iisang sanhi ng bawat kasamaan ang pag-ibig sa salapi.
- issue: Kahulugan ng τῆς πίστεως
  choice: Pananampalatayang Cristiano bilang pinaniniwalaang katotohanan o kapaniwalaan
  alternative: Personal na pagtitiwala o pagsampalataya
  rationale: Ang pantukoy at gamit sa mga Liham Pastoral ay pumapabor sa obhetibong diwa, ngunit ang salitang Tagalog na “pananampalataya” ay maingat na nagpapanatili ng likas na lawak ng πίστις.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “salapi” sa halip na mas kolokyal na “pera” upang mapanatili ang marangal na rehistro, at “pinananabikan” upang ihayag ang matinding patuloy na paghahangad.
