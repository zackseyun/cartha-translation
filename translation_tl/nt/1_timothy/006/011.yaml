id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: tl
  text: Ngunit ikaw, O tao ng Diyos, ay tumakas sa mga bagay na ito. Sa halip, pagsikapan mong matamo ang katuwiran[a], maka-Diyos na pamumuhay, pananampalataya[b], pag-ibig, pagtitiis, at kahinahunan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “katapatan” o “pagtitiwala.”
    reason: lexical_alternative
  - marker: c
    text: Ang bihirang salitang Griyego ay maaari ring isaling “kaamuan,” “mapagpasensiyang pagpipigil,” o “matiising kaamuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Ngunit ikaw
  rationale: Pinananatili ang mariing panghalip at ang malinaw na pagsalungat sa naunang babala.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: O tao ng Diyos
  rationale: Likas at marangal na tuwirang tawag sa Filipino; tumutukoy ito kay Timoteo nang hindi nawawala ang biblikal na katawagan.
- source_word: ταῦτα φεῦγε
  choice: tumakas sa mga bagay na ito
  rationale: Ipinahahayag ang lakas at kagyat na diwa ng pautos na φεῦγε, higit sa mas mahinang 'iwasan.'
- source_word: δίωκε δὲ
  choice: Sa halip, pagsikapan mong matamo
  rationale: Ipinakikita ang aktibong paghahangad at ang pagsalungat sa utos na tumakas, sa natural na Filipino.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Karaniwang salin para sa moral at relasyonal na diwa ng δικαιοσύνη; inilalagay sa talababa ang posibleng 'katarungan.'
- source_word: εὐσέβειαν
  choice: maka-Diyos na pamumuhay
  rationale: Malinaw na naghahatid ng mapitagan at sa Diyos nakatuong paraan ng pamumuhay, nang hindi gumagamit ng malabo o makalumang katawagan.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Pangunahing salin ng πίστις; pinananatili sa talababa ang mga posibleng diwang katapatan at pagtitiwala.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Direkta, malinaw, at likas na katumbas sa listahan ng mga birtud.
- source_word: ὑπομονήν
  choice: pagtitiis
  rationale: Ipinahahayag ang matatag na pananatili sa gitna ng hirap; likas at madaling maunawaan sa modernong Filipino.
- source_word: πραϋπαθίαν
  choice: kahinahunan
  rationale: Nahahagip ang banayad at mapagpigil na asal ng bihirang salitang Griyego; inilalahad sa talababa ang mas buong saklaw nito.
theological_decisions:
- issue: Tuwirang tawag na ὦ ἄνθρωπε θεοῦ
  choice: O tao ng Diyos
  alternative: O lingkod ng Diyos
  rationale: Ang literal na katawagang 'tao ng Diyos' ay pinananatili; ang 'lingkod' ay magdaragdag ng ideyang hindi tahasang nasa ἄνθρωπος.
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas akma ang 'katuwiran' sa listahan ng mga birtud, ngunit tunay na bahagi ng semantikong saklaw ang 'katarungan' kaya hindi ito inaalis.
- issue: Saklaw ng πίστις sa listahan ng mga birtud
  choice: pananampalataya
  alternative: katapatan o pagtitiwala
  rationale: Hindi lubos na matitiyak sa konteksto kung diin ay pananampalataya, pagtitiwala, o pagiging tapat; pinananatili ang mga alternatibo sa talababa.
- issue: Diwa ng bihirang πραϋπαθία
  choice: kahinahunan
  alternative: kaamuan, mapagpasensiyang pagpipigil, o matiising kaamuan
  rationale: Pinili ang natural na pangunahing salin habang hayagang pinananatili ang hindi ganap na tiyak na lawak ng bihirang termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'O' upang likas na maipakita ang tuwirang pagtawag, at hinati sa dalawang pangungusap upang luminaw ang magkasalungat na utos na tumakas at aktibong maghangad.
