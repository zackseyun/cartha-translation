reference: 1 Timothy 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: tl
  text: Ipaglaban mo ang mabuting laban ng pananampalataya[a]; panghawakan mo ang buhay na walang hanggan na para rito ay tinawag ka, at nagpahayag ka ng mabuting pagpapahayag[b] sa harap ng maraming saksi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Ipaglaban mo ang mabuting laban para sa pananampalataya.” Ang pariralang Griyego ay maaaring tumukoy sa pakikibakang inilalarawan ng pananampalataya o sa pakikibaka para sa pananampalatayang Kristiyano.'
    reason: alternative_reading
  - marker: b
    text: Maaaring unawain na ang mabuting pagpapahayag ay may kaugnayan sa buhay na walang hanggan o sa pagkatawag dito. Hindi tahasang isinasaad ng Griyego ang nilalaman ng pagpapahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Ipaglaban mo ang mabuting laban
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan at ang larawan ng masigasig at patuloy na pakikipaglaban. Ang “mabuti” ay likas at tapat na katumbas ng καλός, na maaari ring magpahiwatig ng marangal o karapat-dapat.
- source_word: τῆς πίστεως
  choice: ng pananampalataya
  rationale: Hindi likas sa Tagalog ang tahasang pagkakaiba ng Ingles na “faith” at “the faith.” Ang parirala ay maaaring tumukoy sa pakikibakang inuudyukan ng pananampalataya o sa pakikibaka para sa pananampalatayang Kristiyano; pinananatili sa talababa ang dalawang posibilidad.
- source_word: ἐπιλαβοῦ
  choice: Panghawakan mo
  rationale: Naghahatid ito ng mariin at mapagpasiyang pagkapit o pag-angkin, habang nananatiling natural sa modernong Tagalog.
- source_word: τῆς αἰωνίου ζωῆς
  choice: ang buhay na walang hanggan
  rationale: Ito ang malinaw, karaniwan, at marangal na katumbas sa Tagalog ng tiyak na buhay na ipinangako.
- source_word: εἰς ἣν ἐκλήθης
  choice: na siyang dahilan kung bakit ka tinawag
  rationale: 'Ipinapahayag ang tunguhin ng εἰς nang natural sa Tagalog: ang buhay na walang hanggan ang layon ng pagkatawag.'
- source_word: τὴν καλὴν ὁμολογίαν
  choice: ng mabuting pagpapahayag
  rationale: Ang “pagpapahayag” ay sumasaklaw sa hayag na pagkilala o pagpapahayag ng pinaniniwalaan nang hindi inaangkat ang makitid na diwa ng pag-amin sa kasalanan na maaaring ipahiwatig ng “pag-amin.” Pinananatili rin ang pag-uulit ng καλός bilang “mabuti.”
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: sa harap ng maraming saksi
  rationale: Direkta at natural na katumbas; ang μάρτυρες dito ay mga saksi, hindi “mga martir.”
- source_word: καὶ ὡμολόγησας
  choice: at nagpahayag ka
  rationale: Pinananatiling koordinado ang sugnay gaya ng tahasang anyo ng Griyego, sa halip na idagdag sa pangunahing teksto na ang nilalaman ng pagpapahayag ay ang buhay na walang hanggan.
theological_decisions:
- issue: Diwa ng πίστεως sa τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: “ng pananampalataya,” na sadyang hindi nililimitahan sa pansariling pagtitiwala o sa kabuuan ng pananampalatayang Kristiyano
  alternative: “para sa pananampalataya” o “na bunga ng pananampalataya”
  rationale: Kayang panatilihin ng likas na pariralang Tagalog ang tunay na kalabuan ng genitibo. Ipinaliliwanag ng talababa ang dalawang pangunahing pagbasa nang hindi pumipili ng isang denominasyonal na pakahulugan.
- issue: Ugnayan ng mabuting pagpapahayag sa pagkatawag at buhay na walang hanggan
  choice: 'Koordinadong pagbasa: “at nagpahayag ka...”'
  alternative: “at tungkol dito ay ginawa mo ang mabuting pagpapahayag...”
  rationale: Hindi tahasang isinasaad ng Griyego ang nilalaman ng pagpapahayag. Iniiwasan ng pangunahing teksto ang pagdaragdag ng ugnayang semantiko, samantalang binabanggit sa talababa na maaaring iugnay ito sa buhay na walang hanggan o sa pagkatawag.
- issue: Kalikasan ng utos na ἐπιλαβοῦ τῆς αἰωνίου ζωῆς
  choice: “Panghawakan mo ang buhay na walang hanggan”
  alternative: “Kamtiin mo” o “sakmalin mo ang buhay na walang hanggan”
  rationale: Pinananatili ang matinding metapora ng pagkapit nang hindi ipinapakahulugang natatamo ang buhay na walang hanggan sa pamamagitan ng sariling gawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipaglaban,” “panghawakan,” at “pagpapahayag” bilang kasalukuyan at malinaw na pananalita. Iniwasan ang labis na teknikal o makalumang mga salita, at pinanatili sa mga talababa ang tunay na sintaktiko at teolohikal na kalabuan.
