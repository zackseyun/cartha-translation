revisions:
- from: Ipaglaban mo ang mabuting laban ng pananampalataya[a]. Panghawakan mo ang buhay na walang hanggan na siyang dahilan kung bakit ka tinawag; at nagpahayag ka ng mabuting pagpapahayag sa harap ng maraming saksi.[b]
  to: Ipaglaban mo ang mabuting laban ng pananampalataya[a]; panghawakan mo ang buhay na walang hanggan na para rito ay tinawag ka, at nagpahayag ka ng mabuting pagpapahayag[b] sa harap ng maraming saksi.
  rationale: Pinalitan ang sugnay tungkol sa pagkatawag upang maipahayag ang layuning diwa ng εἰς ἣν ἐκλήθης. Inilipat ang angkla ng ikalawang talababa sa “mabuting pagpapahayag” para sa mas malinaw na pagtukoy. Hindi binago ang koordinadong pagbasa ng huling sugnay at hindi nagdagdag ng tiyak na nilalaman sa pagpapahayag.
