  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: tl
  text: O Timoteo, ingatan mo ang ipinagkatiwala sa iyo. Talikuran mo ang mga lapastangan at walang kabuluhang usapan, at ang mga pagsalungat[a] ng tinatawag na “kaalaman.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kontradiksiyon” o “mga pagtutol.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ng kaalamang may huwad na pangalan”; maaari ring “ng tinatawag na kaalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: O Timoteo
  rationale: Pinananatili ng “O” ang mariin at taimtim na tuwirang pagtawag na ipinahihiwatig ng Ὦ, habang likas pa rin ito sa marangal na estilong Filipino.
- source_word: τὴν παραθήκην
  choice: ang ipinagkatiwala sa iyo
  rationale: Ang παραθήκη ay isang bagay na ipinagkatiwala upang ingatan. Mas natural sa modernong Filipino ang pariralang ito kaysa sa literal na “deposito,” at hindi nito tinutukoy nang mas makitid kung ano ang ipinagkatiwala.
- source_word: φύλαξον
  choice: ingatan mo
  rationale: Ipinahahayag nito ang masusing pag-iingat at pangangalaga sa isang bagay na ipinagkatiwala.
- source_word: ἐκτρεπόμενος
  choice: Talikuran mo
  rationale: Pinananatili nito ang larawan ng pagtalikod o pag-iwas. Ginawang hiwalay na pautos sa Filipino upang maging malinaw at natural ang kaugnayan nito sa pangunahing utos.
- source_word: τὰς βεβήλους κενοφωνίας
  choice: ang mga usapang walang kabuluhan at lapastangan
  rationale: Ang “walang kabuluhan” ay nagpapakita sa kahungkagan ng κενοφωνίας, at ang “lapastangan” ay naghahatid ng di-banal o di-nararapat na katangian ng βεβήλους sa malinaw na modernong Filipino.
- source_word: ἀντιθέσεις
  choice: mga pagsalungat
  rationale: Saklaw ng salita ang mga pagtutol, oposisyon, o magkakasalungat na pahayag. Ang “mga pagsalungat” ay nagpapanatili sa lawak nito nang hindi agad nagpapahiwatig ng pormal na lohikal na kontradiksiyon.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ng tinatawag na “kaalaman” ngunit hindi naman tunay
  rationale: Malinaw nitong ipinahahayag na ang katawagang “kaalaman” ay huwad o hindi karapat-dapat, habang natural ang daloy sa Filipino. Ang mga panipi ay tumutulong markahan na kinukuwestiyon ang pangalang ito.
theological_decisions:
- issue: Ano ang tinutukoy ng παραθήκη
  choice: “ang ipinagkatiwala sa iyo,” nang hindi tahasang tinutukoy ang nilalaman nito
  alternative: “ang ebanghelyo,” “ang turo ng mga apostol,” o “ang tungkuling iniatas kay Timoteo”
  rationale: Ipinakikita ng konteksto na mahalagang bagay o mensahe ito na dapat pangalagaan, ngunit hindi ito espesipikong pinangalanan sa talata. Pinananatili ng salin ang pagiging bukás ng pahayag.
- issue: Ugnayan ng ἀντιθέσεις sa ψευδώνυμος γνῶσις
  choice: Itinuturing ang “mga pagsalungat” bilang kaugnay ng huwad na tinatawag na kaalaman, ngunit hindi tinutukoy ang isang partikular na sistemang doktrinal
  alternative: Tukuyin ito bilang isang espesipikong kilusang pilosopikal o proto-Gnostikong sistema
  rationale: Hindi sapat ang mismong talata upang pangalanan ang isang tiyak na makasaysayang sistema; iniiwasan ng salin ang pagpasok ng interpretasyong hindi tahasang nasa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang taimtim na “O Timoteo.” Iniwasan ang teknikal na “deposito” at ang mas makitid na pagpapakahulugan sa ipinagkatiwala. Ang dalawang pangungusap ay nagbibigay ng natural na daloy sa Filipino habang pinananatili ang puwersa ng pautos at ng kasamang participle.
