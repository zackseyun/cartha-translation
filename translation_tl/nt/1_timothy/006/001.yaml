review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang saklaw ng Ὅσοι εἰσὶν, ang tahasang kalagayan ng δοῦλοι na “nasa ilalim ng pamatok,” ang “kani-kanilang” para sa ἰδίους, at ang layuning ipinakilala ng ἵνα. Gayunman, ang “hindi lapastanganin” ay maaaring mabasa bilang anyong aktibo na walang malinaw na tagaganap; ang Griyego ay pandiwang balintiyak. Ang “hindi malapastangan” ay mas malinaw na katumbas nito.
  naturalness: Mas likas at malinaw sa modernong Filipino ang “dapat ituring na karapat-dapat” kaysa “dapat kilalaning karapat-dapat,” sapagkat mas tuwirang ipinapahayag nito ang hinihinging pagtataya o pagtingin (ἡγείσθωσαν). Ang balintiyak na “malapastangan” ay maayos ding umuugnay sa kapuwa “ang pangalan ng Diyos” at “ang aral.”
  terminology: Ang “mga alipin,” “pamatok,” “mga panginoon,” “paggalang,” “pangalan ng Diyos,” at “aral” ay angkop sa konteksto at sa rehistro. Hindi dapat palitan ang “mga alipin” ng “mga lingkod,” dahil pinaiigting ng ὑπὸ ζυγόν ang kalagayan ng pagkaalipin. Nananatiling wastong alternatibo sa talababa ang “doktrina.”
  issues:
  - severity: medium
    issue: Hindi ganap na malinaw ang balintiyak na diwa ng βλασφημῆται sa “upang hindi lapastanganin.”
    rationale: Ang βλασφημῆται ay present passive subjunctive. Ang “upang hindi malapastangan” ay malinaw na Filipino passive at hindi nagdaragdag ng tagaganap.
  - severity: low
    issue: Medyo hindi likas ang “dapat kilalaning karapat-dapat.”
    rationale: Bagaman nauunawaan, mas idiomatiko ang “dapat ituring na karapat-dapat,” na tumpak ding naghahatid ng evaluative sense ng ἡγείσθωσαν.
  revised_text: Ang lahat ng alipin na nasa ilalim ng pamatok ay dapat ituring na karapat-dapat sa buong paggalang ang kani-kanilang mga panginoon, upang hindi malapastangan[a] ang pangalan ng Diyos at ang aral.[b]
