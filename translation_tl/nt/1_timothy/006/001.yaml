  rationale: Inayos ang pananalita upang maging mas likas ang pag-uutos na “ituring na karapat-dapat” at upang malinaw na maipakita ang balintiyak na anyo ng βλασφημῆται sa “malapastangan.” Pinanatili ang lahat ng pangunahing pagpiling leksikal at ang mga angkla ng talababa.
