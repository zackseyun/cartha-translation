base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: tl
  text: Ang lahat ng alipin na nasa ilalim ng pamatok ay dapat ituring na karapat-dapat sa buong paggalang ang kani-kanilang mga panginoon, upang hindi malapastangan[a] ang pangalan ng Diyos at ang aral.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagsalitaan nang masama.”
    reason: lexical_alternative
  - marker: b
    text: O “doktrina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Tuwirang ipinahahayag ng kasunod na pariralang “nasa ilalim ng pamatok” ang kalagayan ng pagkaalipin, kaya mas tumpak ang “mga alipin” kaysa sa mas malawak na “mga lingkod.”
- source_word: ὑπὸ ζυγὸν
  choice: nasa ilalim ng pamatok
  rationale: Pinananatili nito ang metapora ng pagpapasakop at pagkagapos na nasa Griyego at likas ding nauunawaan sa Filipino.
- source_word: τοὺς ἰδίους δεσπότας
  choice: ang kani-kanilang mga panginoon
  rationale: Ipinahihiwatig ng ἰδίους ang partikular na panginoon ng bawat alipin; ang “kani-kanilang” ang likas na panumbas. Sa kontekstong ito, ang δεσπότας ay mga taong may kapangyarihan sa mga alipin.
- source_word: πάσης τιμῆς ἀξίους
  choice: karapat-dapat sa buong paggalang
  rationale: Ang “buong paggalang” ay natural na Filipino para sa komprehensibong diwa ng πάσης τιμῆς nang hindi lumalabis sa teksto.
- source_word: ἡγείσθωσαν
  choice: dapat kilalaning
  rationale: Ipinapahayag nito ang patuloy na pagtataya o pagtingin na hinihingi ng pangkasalukuyang pautos sa Griyego.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ang pangalan ng Diyos
  rationale: Pinananatili ng tuwirang salin ang biblikal na konsepto ng pangalan ng Diyos bilang kaugnay ng kanyang pagkakakilanlan at reputasyon.
- source_word: ἡ διδασκαλία
  choice: ang aral
  rationale: Ang “aral” ay malinaw at pangkaraniwang Filipino na hindi nagdaragdag ng teknikal na himig ng “doktrina.”
- source_word: βλασφημῆται
  choice: hindi lapastanganin
  rationale: Ang “lapastanganin” ay maaaring tumukoy kapuwa sa pangalan ng Diyos at sa aral, at naipapahayag nito ang mapanirang pagsasalita o paghamak na taglay ng pandiwa.
- source_word: Ὅσοι εἰσὶν
  choice: Ang lahat ng
  rationale: Natural nitong naipahahayag sa Filipino ang saklaw na inklusibo ng ὅσοι εἰσὶν.
theological_decisions:
- issue: Paglalarawan sa δοῦλοι sa sensitibong konteksto ng pagkaalipin
  choice: mga alipin
  alternative: mga lingkod
  rationale: Hindi ipinapahiwatig ng salin na sinasang-ayunan ang pagkaalipin; tapat lamang nitong inilalarawan ang kalagayang panlipunan sa teksto, na lalo pang nililinaw ng “nasa ilalim ng pamatok.”
- issue: Saklaw ng βλασφημῆται
  choice: lapastanganin
  alternative: pagsalitaan ng masama
  rationale: Pinananatili ng “lapastanganin” ang matinding diwa ng pandiwa at ang posibilidad na iisang pandiwa ang umuugnay kapuwa sa pangalan ng Diyos at sa aral.
- issue: Pagpapakahulugan sa διδασκαλία
  choice: ang aral
  alternative: ang doktrina
  rationale: Ang “aral” ay tumpak ngunit hindi mas teknikal kaysa sa hinihingi ng Griyego, kaya hindi ito nag-aangkat ng mas huling denominasyonal na gamit ng “doktrina.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “pamatok” at ang tahasang katawagang “alipin.” Ginamit ang “kani-kanilang” upang malinaw na ihatid ang ἰδίους. Ang mga talababa ay nakatuon lamang sa tunay na mga alternatibong leksikal.
