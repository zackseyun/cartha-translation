id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: tl
  text: Utusan mo ang mayayaman sa kasalukuyang panahon[a] na huwag maging mapagmataas at huwag ilagak ang kanilang pag-asa sa kayamanang walang katiyakan[b], kundi sa Diyos, na saganang nagkakaloob sa atin ng lahat ng bagay upang tamasahin natin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kasalukuyang sanlibutang ito.” Ang salitang Griyego ay maaaring mangahulugang “panahon” o, sa pinalawak na diwa, ang kasalukuyang kaayusan ng sanlibutan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos: “sa kawalang-katiyakan ng kayamanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: ang mayayaman
  rationale: Likas at tuwirang substantibong anyo sa Tagalog para sa pangmaramihang may artikulo, nang hindi dinaragdagan ang diwa.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: sa kasalukuyang panahon
  rationale: Pinananatili ng “panahon” ang temporal at eskatolohikal na diwa ng αἰών; iniiwasan nitong limitahan ang kahulugan sa pisikal na mundo.
- source_word: παράγγελλε
  choice: Utusan mo
  rationale: Ipinahahayag ng pautos na pandiwa ang awtoritatibong lakas ng tagubilin; mas matibay ito kaysa “payuhan mo.”
- source_word: μὴ ὑψηλοφρονεῖν
  choice: na huwag maging mapagmataas
  rationale: Malinaw at kasalukuyang pananalita para sa pag-iisip nang mataas tungkol sa sarili o pagmamataas.
- source_word: μηδὲ ἠλπικέναι
  choice: at huwag ilagak ang kanilang pag-asa
  rationale: Ipinahihiwatig ng “ilagak” ang matatag na paglalagay ng pag-asa, na angkop sa perpektong pawatas.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: sa kayamanang walang katiyakan
  rationale: Likas sa Tagalog at malinaw na inilalarawan ang kayamanan bilang hindi maaasahan, habang ang mas pormal na kayariang “kawalang-katiyakan ng kayamanan” ay inilalagay sa talababa.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: kundi sa Diyos
  rationale: 'Pinananatili ang tuwirang pagtatambis sa pinagtutuunan ng pag-asa: hindi sa kayamanan kundi sa Diyos.'
- source_word: τῷ παρέχοντι ἡμῖν
  choice: na ... nagkakaloob sa atin
  rationale: Ang sugnay ay naglalarawan sa Diyos bilang siyang patuloy na nagbibigay o naglalaan.
- source_word: πάντα
  choice: lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng salita nang hindi ito nililimitahan sa mga pangunahing pangangailangan lamang.
- source_word: πλουσίως
  choice: saganang
  rationale: Likas na pang-abay sa Tagalog na nagpapahayag ng kasaganaan ng pagkakaloob; hindi man tuwirang naiuulit ang salitang-ugat ng kayamanan, napapanatili ang larawang iyon.
- source_word: εἰς ἀπόλαυσιν
  choice: upang tamasahin natin
  rationale: Malinaw na ipinahahayag ang layunin o bunga ng pagkakaloob. Ang “natin” ay likas na pagpapalinaw sa Tagalog at tumutukoy sa naunang “sa atin.”
theological_decisions:
- issue: Kahulugan ng αἰών sa kontekstong etikal at eskatolohikal
  choice: kasalukuyang panahon
  alternative: kasalukuyang sanlibutan
  rationale: Pinananatili ng “panahon” ang temporal na paghahambing na karaniwan sa gamit ni Pablo at hindi ipinapakahulugang masama ang materyal na daigdig mismo.
- issue: Saklaw ng pagkakaloob ng Diyos sa πάντα
  choice: lahat ng bagay
  alternative: lahat ng kailangan natin
  rationale: Malawak ang mismong pahayag ng teksto. Hindi ito nililimitahan sa mga pangangailangan lamang, ngunit hindi rin dinaragdagan ng anumang pangakong tiyak na materyal na kasaganaan.
- issue: Layunin ng mga kaloob sa εἰς ἀπόλαυσιν
  choice: upang tamasahin natin
  alternative: para sa ating kasiyahan
  rationale: Pinananatili ang positibong pahayag na maaaring tamasahin ang mga kaloob ng Diyos, nang hindi ipinahihiwatig na ang kasiyahan ang pinakamataas na layunin ng buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Utusan mo” upang mapanatili ang lakas ng pautos, at “ilagak ang kanilang pag-asa” bilang pamilyar ngunit dignified na pananalita. Inilagay ang mga talababa sa mga pariralang talagang tinutukoy ng mga ito.
