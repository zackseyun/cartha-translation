  source_fidelity: 'Tapat ang salin sa Griyego: ang “kasalukuyang panahon” ay maayos na katumbas ng ἐν τῷ νῦν αἰῶνι; malinaw ang magkatuwang na pagbabawal laban sa pagmamataas at paglalagak ng pag-asa sa di-tiyak na kayamanan; at napananatili ang pagtatambis na ang pag-asa ay sa Diyos na saganang nagbibigay ng lahat para tamasahin. Hindi nililimitahan ng “lahat ng bagay” ang πάντα, at hindi rin pinalalawak ang pahayag tungo sa isang pangakong kasaganaan.'
