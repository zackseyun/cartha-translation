- from: Sa pag-aangking taglay nila ito[a], ang ilan ay lumihis tungkol sa pananampalataya.[b] Sumainyo nawa ang biyaya.[c]
  to: Sa pag-aangkin nito, lumihis ang ilan sa pananampalataya.[a] Sumainyo nawa ang biyaya.[b]
  rationale: Inalis ang “taglay nila” upang huwag magdagdag ng diwang wala sa pandiwa, at inayos ang sugnay upang maging likas sa modernong Filipino. Pinanatili ang metaporikal na puwersa ng ἠστόχησαν sa “lumihis,” habang inilalagay ang mga leksikal na alternatibo at ang malawak na saklaw ng “pananampalataya” sa talababa. Pinanatili rin ang maramihang pangwakas na pagpapala.
