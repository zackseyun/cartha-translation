base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: tl
  text: Sa pag-aangkin nito, lumihis ang ilan sa pananampalataya.[a] Sumainyo nawa ang biyaya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nito” ay tumutukoy sa naunang binanggit na kaalamang maling tinatawag na kaalaman. Ang pandiwang isinaling “lumihis” ay maaari ring isaling “naligaw,” “nagkamali,” o, mas literal, “hindi tumama sa layon.” Ang “pananampalataya” rito ay malamang na tumutukoy sa pananampalatayang Kristiyano bilang kabuuan ng pinaniniwalaan, bagaman maaari rin itong unawain bilang personal na pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Maramihan ang “inyo” sa Griyego; maaaring saklaw ng pagpapala hindi lamang si Timoteo kundi pati ang pamayanang kasama niya.
    reason: audience_detail
lexical_decisions:
- source_word: ἥν
  choice: ito
  rationale: Ang pambabaeng panghalip na pantukoy ay tumutukoy sa naunang binanggit na kaalamang tinatawag nang gayon. Likas sa Tagalog ang “ito” sa ganitong ayos ng pangungusap.
- source_word: ἐπαγγελλόμενοι
  choice: sa pag-aangking taglay nila
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang hayagang nag-aangkin o nagpapakilalang may taglay ng naturang kaalaman, hindi nangangako.
- source_word: ἠστόχησαν
  choice: lumihis
  rationale: Ipinahihiwatig ng ἀστοχέω ang hindi pagtama sa pinupuntirya at, sa pinalawak na diwa, ang pagkaligaw o paglihis. Natural sa modernong Tagalog ang “lumihis” habang pinananatili ang larawan ng paglayo sa tamang landas o layon.
- source_word: περὶ τὴν πίστιν
  choice: tungkol sa pananampalataya
  rationale: Ang περί na may akusatibo ay nagsasaad ng bagay na tinutukoy o saklaw. Hindi ito ginawang tuwirang layon ng pandiwang “lumihis,” upang mapanatili ang ugnayang nasa Griyego.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Ang πίστις ay karaniwang tumutukoy sa pananampalataya; sa konteksto ng maling aral, malamang na ang tinutukoy ay ang pananampalatayang Kristiyano bilang kabuuan ng pinaniniwalaan.
- source_word: Ἡ χάρις
  choice: ang biyaya
  rationale: Ito ang maikli at marangal na anyo ng pangwakas na pagpapala sa liham.
- source_word: μεθ’ ὑμῶν
  choice: sumainyo nawa
  rationale: Ipinahahayag ng anyong ito ang diwang “nawa'y makasama ninyo” sa natural na pangwakas na pagpapala. Ang “inyo” ay angkop sa maramihang ὑμῶν.
theological_decisions:
- issue: Kahulugan ng “pananampalataya” sa babala
  choice: Pinanatili ang “pananampalataya,” na sa konteksto ay malamang na tumutukoy sa pananampalatayang Kristiyano bilang kabuuan ng pinaniniwalaan.
  alternative: Maaari rin itong unawain bilang personal na pagtitiwala o pananampalataya.
  rationale: Ang agarang konteksto ay tumatalakay sa huwad na kaalaman at paglihis na kaugnay ng aral, ngunit hindi nililinaw ng pangngalan lamang ang lahat ng saklaw nito.
- issue: Mga pinatutungkulan ng pangwakas na pagpapala
  choice: Pinanatili ang maramihang “inyo.”
  alternative: Maaaring gawing para lamang kay Timoteo ang pahayag dahil siya ang pangunahing kinakausap sa liham.
  rationale: Maramihan ang ὑμῶν, kaya malamang na pinalalawak ng pangwakas na pagpapala ang saklaw nito sa pamayanang kasama ni Timoteo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “pag-aangking taglay” upang malinaw ang diwa ng pagpapanggap o pag-aangkin, at “lumihis” upang mapanatili ang matalinghagang puwersa ng ἀστοχέω nang hindi nagiging salitang salin. Ang pangwakas na “Sumainyo nawa ang biyaya” ay pormal ngunit buhay pa rin sa kasalukuyang gamit.
