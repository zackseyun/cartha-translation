  verdict: revise
  source_fidelity: Kailangang iwasto ang “makakakita,” na karaniwang tumutukoy sa panghinaharap na pangyayari. Ang Griyegong οὐδὲ ἰδεῖν δύναται ay nagpapahayag ng kawalan ng kakayahang makita siya. Ang “ni hindi rin siya kayang makita” ay tumpak na pinananatili ang diwang ito.
  naturalness: Likas at marangal sa makabagong Tagalog ang “Walang sinumang tao ang nakakita sa kanya ni hindi rin siya kayang makita.” Ang “Sumakanya ang” ay angkop na pagbigkas ng doxolohiya at malinaw na ipinahihiwatig ang pandiwang wala sa Griyego.
  terminology: Ang “kawalang-kamatayan,” “liwanag na hindi malalapitan,” at “karangalan” ay angkop. Pinananatili ang “kapangyarihan” para sa κράτος; sa doxolohikal na konteksto ay maaari itong sumaklaw sa naghaharing kapangyarihan nang hindi labis na pinipili ang isang interpretasyon.
  issues:
