  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: tl
  text: Siya lamang ang nagtataglay ng kawalang-kamatayan at nananahan sa liwanag na hindi malalapitan. Walang sinumang tao ang nakakita sa kanya ni hindi rin siya kayang makita. Sumakanya ang karangalan at walang hanggang kapangyarihan. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μόνος ἔχων ἀθανασίαν
  choice: Siya lamang ang nagtataglay ng kawalang-kamatayan
  rationale: Pinananatili ng “lamang” ang pagiging bukod-tangi, at malinaw na ipinapahayag ng “nagtataglay” ang ἔχων nang hindi ipinahihiwatig na natanggap lamang niya ang katangiang ito.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: nananahan sa liwanag na hindi malalapitan
  rationale: Likas sa makabagong Tagalog at tumpak na pinananatili ang larawan ng pananahan at ang di-malapitang liwanag.
- source_word: οὐδεὶς ἀνθρώπων
  choice: walang sinumang tao
  rationale: Ipinahahayag ang partitive at pangkalahatang diwa ng Griyego sa natural at gender-accurate na Tagalog.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: o makakakita
  rationale: Sa kontekstong kasunod ng “nakakita,” natural na ipinahahayag ng “makakakita” ang kawalan ng kakayahang makita siya, hindi lamang isang payak na pangyayari sa hinaharap.
- source_word: τιμὴ καὶ κράτος αἰώνιον
  choice: karangalan at walang hanggang kapangyarihan
  rationale: Ang “kapangyarihan” ay natural na katawagan sa Tagalog para sa κράτος sa isang doxolohiya at maaaring tumukoy sa makapangyarihang pamamahala, hindi lamang sa pisikal na lakas.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang nakaugaliang anyo sa pagsamba at mga salin ng Kasulatan sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng mga paglalarawan at doxolohiya
  choice: Ang mga ito ay tumutukoy sa Diyos, ang pinagpalang at tanging Makapangyarihang Tagapamahala sa naunang konteksto.
  alternative: Iniuugnay ng ilan ang mga paglalarawan nang mas tuwiran sa Panginoong Jesu-Cristo dahil sa mas malawak na pagkakabuo ng pangungusap.
  rationale: Ang daloy ng 1 Timoteo 6:15–16 at lalo na ang pananalitang walang taong nakakita o makakakita sa kanya ay pinakanatural na tumutukoy sa Diyos. Gayunman, hindi nilulutas nang palihim ang tunay na usapin sa pagtukoy; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “walang sinumang tao” sa halip na isang salitang may makitid na kasariang pahiwatig. Hinati sa maiikling pangungusap para sa likas na daloy nang hindi binabago ang ugnayan ng mga sugnay.
