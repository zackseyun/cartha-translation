  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: tl
  text: Ngunit kung mayroon tayong pagkain at pantakip[a], makukuntento tayo sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “damit”; mas malawak ang maaaring kahulugan ng salitang Griyego—anumang tumatakip sa isang tao, at posibleng kabilang dito ang tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: kung mayroon tayong
  rationale: Ang participle ay naglalahad ng kalagayan o kundisyong kaugnay ng pangunahing pandiwa. Likas sa modernong Tagalog ang kondisyunal na “kung mayroon tayong,” at hindi nito ipinapalagay na tiyak na taglay na ang mga bagay na ito.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat o paglipat mula sa naunang pahayag; malinaw at marangal na ipinahihiwatig ito ng “Ngunit.”
- source_word: διατροφὰς
  choice: pagkain
  rationale: Tumutukoy ang salita sa ikabubuhay o panustos, lalo na sa pagkain. “Pagkain” ang pinakanatural at sapat na tiyak sa modernong Tagalog.
- source_word: σκεπάσματα
  choice: pantakip
  rationale: Ang salita ay maaaring tumukoy sa anumang tumatakip sa tao. Pinananatili ng “pantakip” ang lawak ng kahulugan sa halip na paliitin agad sa damit lamang o tirahan lamang.
- source_word: τούτοις
  choice: sa mga ito
  rationale: Tumutukoy ang panghalip pabalik sa pagkain at pantakip. Pinananatili ng “sa mga ito” ang demonstratibong puwersa at likas itong kaugnay ng “masisiyahan.”
- source_word: ἀρκεσθησόμεθα
  choice: masisiyahan na tayo
  rationale: Ang anyong future ay nagpapahayag ng pagiging sapat o kontento. Ang “masisiyahan na tayo” ay natural na Tagalog, pinananatili ang hinaharap na pahiwatig, at hindi ito ginagawang tahasang utos na “masiyahan tayo.”
theological_decisions:
- issue: Saklaw ng σκεπάσματα
  choice: Malawak na “pantakip,” na maaaring sumaklaw sa damit at posibleng tirahan
  alternative: “damit” lamang o “tirahan” lamang
  rationale: Hindi tiyak na nililimitahan ng salitang Griyego ang tinutukoy sa damit lamang. Pinananatili ng salin ang leksikal na lawak at ang diwa ng kasiyahan sa mga pangunahing pangangailangan nang hindi nagpapasok ng mas makitid na interpretasyon.
- issue: Pahayag o pangaral sa ἀρκεσθησόμεθα
  choice: 'Pahayag sa hinaharap: “masisiyahan na tayo”'
  alternative: 'Pangaral: “masiyahan tayo”'
  rationale: Future indicative ang anyong Griyego. Bagaman maaaring madama ang praktikal na pangaral sa konteksto, hindi dapat palitan ng salin ang gramatikal na pahayag ng isang tahasang pautos.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pantakip” upang mapanatili ang tunay na lawak at bahagyang kalabuan ng σκεπάσματα; nilinaw ito sa talababa. Ang “masisiyahan na tayo” ay idiomatiko at pinananatili ang pahayag sa hinaharap.
