  naturalness: Ang 'Inaatasan kita' at 'sa harap ng' ay angkop sa marangal ngunit makabagong rehistro. Mas natural ang 'nagbibigay ng buhay' kaysa sa tambalang 'nagbibigay-buhay' sa pangungusap na ito, at ang 'nagpatotoo tungkol sa' ay idiomatiko at malinaw.
  terminology: Ang 'Cristo Jesus' ay katanggap-tanggap at karaniwan sa Filipino, habang nililinaw ng talababa na ang Cristo ay nangangahulugang Mesiyas. Ang 'mabuting pagpapahayag' ay pinanatili upang huwag magdagdag ng teolohikal na nilalaman sa ὁμολογία at upang mapanatili ang kaugnayan sa 'mabuti' ng Griyego.
