revisions:
- from: Inaatasan kita sa harap ng Diyos[a], na nagbibigay-buhay sa lahat ng bagay, at ni Cristo Jesus[b], na nagpatotoo ng mabuting pagpapahayag sa harap ni Poncio Pilato[c].
  to: Inaatasan kita sa harap ng Diyos[a], na nagbibigay ng buhay sa lahat ng bagay, at ni Cristo Jesus[b], na nagpatotoo tungkol sa mabuting pagpapahayag sa harap ni Poncio Pilato[c].
  rationale: Inayos ang kolokasyon ng 'magpatotoo' upang maging natural na Filipino habang pinananatili ang pagkakaiba ng pagpapatotoo at ng mabuting pagpapahayag. Pinalitan din ang 'nagbibigay-buhay' ng mas karaniwang 'nagbibigay ng buhay.' Hindi binago ang mga talababa, dahil maayos nilang iniingatan ang leksikal na saklaw ng ζωογονοῦντος, ang titulong Cristo, at ang posibleng pakahulugan ng ἐπὶ Ποντίου Πιλάτου.
