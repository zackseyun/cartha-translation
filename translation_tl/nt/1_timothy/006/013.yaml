  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: tl
  text: Inaatasan kita sa harap ng Diyos[a], na nagbibigay ng buhay sa lahat ng bagay, at ni Cristo Jesus[b], na nagpatotoo tungkol sa mabuting pagpapahayag sa harap ni Poncio Pilato[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na nagpapanatiling buhay sa lahat ng bagay” o “na bumubuhay sa lahat ng bagay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ang “Cristo” ay titulong nangangahulugang “Mesiyas.” Maaari ring isalin: “ang Mesiyas na si Jesus.”'
    reason: title_clarification
  - marker: c
    text: 'Maaari ring isalin ang parirala: “noong panahon ni Poncio Pilato” o “sa ilalim ni Poncio Pilato.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Inaatasan kita
  rationale: Ipinahahayag nito ang isang taimtim at may-bigat na utos, habang nananatiling natural sa makabagong Filipino.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Maikli at likas na katumbas na nagpapanatili sa diwa ng pagiging nasa presensiya ng Diyos at ni Cristo Jesus.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: na nagbibigay-buhay sa lahat ng bagay
  rationale: Sinasaklaw nito ang malawak na diwa ng pandiwa—pagbibigay o pagpapanatili ng buhay—nang hindi labis na nililimitahan ang kahulugan.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Cristo Jesus
  rationale: Sa karaniwang makabagong gamit sa Tagalog, kinikilala ang “Cristo” bilang titulong tumutukoy sa Mesiyas at natural itong kasama ng pangalang Jesus; inilalagay sa talababa ang mas tahasang salin.
- source_word: μαρτυρήσαντος
  choice: na nagpatotoo
  rationale: Pinananatili ang juridikal at pampublikong diwa ng pagbibigay-saksi sa konteksto ng pagharap kay Pilato.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: sa harap ni Poncio Pilato
  rationale: Ang konteksto ng pagpapatotoo at paglilitis ay pabor sa kahulugang nasa presensiya ni Pilato, bagaman maaari ring tumukoy sa panahon o pamamahala niya.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: ang mabuting pagpapahayag
  rationale: Ang “pagpapahayag” ay natural at malinaw para sa pampublikong pagkilala o pag-amin; pinananatili ng “mabuti” ang ugnayang leksikal sa kalapit na talata.
theological_decisions:
- issue: Kahulugan ng ζῳογονοῦντος
  choice: na nagbibigay-buhay sa lahat ng bagay
  alternative: na nagpapanatiling buhay sa lahat ng bagay; na bumubuhay sa lahat ng bagay
  rationale: Maaaring tumukoy ang participle sa pagkakaloob ng buhay o pagpapanatili nito. Pinananatili ng pangunahing salin ang malawak na saklaw, at inilalahad sa talababa ang mahahalagang posibilidad.
- issue: Paglalahad ng Χριστός
  choice: Cristo Jesus
  alternative: Mesiyas na si Jesus
  rationale: Natural at marangal sa Tagalog ang tradisyonal na titulong “Cristo,” ngunit nililinaw sa talababa ang kahulugan nitong “Mesiyas” upang hindi ito mabasang simpleng bahagi lamang ng pangalan.
- issue: Ugnayan ng μαρτυρήσαντος at ὁμολογίαν
  choice: nagpatotoo ng mabuting pagpapahayag
  alternative: nagbigay ng mabuting pagpapahayag
  rationale: Pinananatili ng pangunahing salin ang elementong pagpapatotoo ng μαρτυρέω at ang hiwalay na konsepto ng ὁμολογία, sa halip na pagsamahin ang mga ito sa isang mas malayang paraphrase.
- issue: Kahulugan ng ἐπὶ Ποντίου Πιλάτου
  choice: sa harap ni Poncio Pilato
  alternative: noong panahon ni Poncio Pilato; sa ilalim ni Poncio Pilato
  rationale: Pinakamalapit sa tagpo ng paglilitis ang “sa harap,” ngunit tunay na maaaring dalhin ng parirala ang temporal o administratibong kahulugan, kaya binabanggit ang mga iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Inaatasan kita” para sa taimtim na tono, “Poncio Pilato” bilang nakaugaliang anyong Filipino, at maiikling pariralang hindi nawawala ang pormal na bigat ng pangungusap.
