  source_fidelity: Tumpak na naihahatid ng salin ang paghahambing sa pagitan ng limitadong pakinabang ng σωματικὴ γυμνασία at ng malawak na pakinabang ng εὐσέβεια. Ang “limitado lamang ito” ay hindi sapilitang pumipili sa temporal o pangsaklaw na pagbasa ng πρὸς ὀλίγον, at maayos na tinutukoy ng talababa ang dalawang posibilidad. Naipapahayag din nang malinaw ang pangako para sa buhay ngayon at sa darating na buhay.
