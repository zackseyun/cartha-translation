id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: tl
  text: Sapagkat may pakinabang ang pagsasanay ng katawan, ngunit limitado lamang ito[a]; ang maka-Diyos na pamumuhay naman ay kapaki-pakinabang sa lahat ng bagay, sapagkat taglay nito ang pangako para sa buhay ngayon at sa buhay na darating.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay maaari ring mangahulugang “may pakinabang sa maikling panahon” o “may kaunting pakinabang.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “taglay ang pangako ng buhay ngayon at ng darating.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: pagsasanay ng katawan
  rationale: Likas at malinaw na Filipino para sa pisikal o pangkatawang pagsasanay; pinananatili nito ang malawak na diwa ng γυμνασία at hindi ito nililimitahan sa palakasan.
- source_word: πρὸς ὀλίγον
  choice: limitado lamang ito
  rationale: Pinananatili ang kaibahan sa malawak na pakinabang ng εὐσέβεια nang hindi pinipili sa pangunahing teksto kung ang limitasyon ay sa tagal o sa lawak; inilalahad sa talababa ang tunay na kalabuan ng Griyego.
- source_word: ὠφέλιμος
  choice: may pakinabang / kapaki-pakinabang
  rationale: Malinaw at pangkaraniwang pananalita sa modernong Filipino; ang bahagyang pagbabago ng anyo ay para sa likas na daloy ng dalawang sugnay, habang iisa ang kahulugan.
- source_word: εὐσέβεια
  choice: maka-Diyos na pamumuhay
  rationale: Ipinahahayag ang buhay na may paggalang at debosyon sa Diyos, hindi lamang isang panlabas o pormal na relihiyosidad.
- source_word: πρὸς πάντα
  choice: sa lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng Griyego.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: sapagkat taglay nito ang pangako
  rationale: Ang participial phrase ay nauunawaang nagbibigay ng dahilan sa pagiging kapaki-pakinabang ng maka-Diyos na pamumuhay; natural sa Filipino ang ekspresyong 'taglay ang pangako.'
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: para sa buhay ngayon at sa buhay na darating
  rationale: Malinaw na ipinapakita ang paghahambing ng kasalukuyang buhay at ng darating na buhay, at likas na pinupunan sa Filipino ang elipsis ng δεύτερο ζωή.
theological_decisions:
- issue: Saklaw ng pakinabang ng pagsasanay ng katawan
  choice: May tunay ngunit limitadong pakinabang ang pagsasanay ng katawan.
  alternative: May pakinabang lamang ito sa maikling panahon, o maliit lamang ang pakinabang nito.
  rationale: Hindi itinatanggi ng talata ang halaga ng pisikal na disiplina. Inihahambing nito ang limitadong pakinabang niyon sa komprehensibo at pangkasalukuyan-at-hinaharap na pakinabang ng maka-Diyos na pamumuhay.
- issue: Kahulugan ng εὐσέβεια
  choice: maka-Diyos na pamumuhay
  alternative: kabanalan; debosyon sa Diyos
  rationale: Iniiwasang paliitin ang termino sa seremonyal na kabanalan lamang; kasama rito ang buong buhay na nakatuon sa Diyos.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang 'maka-Diyos na pamumuhay' upang maging malinaw sa karaniwang mambabasa ang etikal at debosyonal na saklaw ng εὐσέβεια. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
