  terminology: Ang “pagsasanay ng katawan,” “may pakinabang/kapaki-pakinabang,” at “maka-Diyos na pamumuhay” ay angkop at magkakatugma sa konteksto. Ang huli ay wastong nagpapahiwatig ng Diyos-orientadong pamumuhay na saklaw ng εὐσέβεια, nang hindi ipinapataw ang isang mas makitid na doktrinal na pagpapakahulugan.
