  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: tl
  text: Hanggang sa dumating ako, pag-ukulan mo ng buong pansin ang pampublikong pagbabasa[a], ang panghihikayat, at ang pagtuturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagbabasa ng Kasulatan.” “Pagbabasa” lamang ang tahasang sinasabi sa Griyego, ngunit sa konteksto ay malamang na tumutukoy ito sa pampublikong pagbabasa ng Kasulatan sa kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Hanggang sa dumating ako
  rationale: Likas na ipinahahayag sa modernong Tagalog ang panahong magtatagal hanggang sa inaasahang pagdating ni Pablo, habang pinananatili ang unang panauhan ng Griyego.
- source_word: πρόσεχε
  choice: pag-ukulan mo ng buong pansin
  rationale: Ipinahahayag ng pautos ang tuloy-tuloy at masigasig na pagtatalaga ng pansin, hindi lamang ang panandaliang pagpansin.
- source_word: τῇ ἀναγνώσει
  choice: ang pampublikong pagbabasa
  rationale: Ang ἀνάγνωσις ay literal na “pagbabasa,” ngunit sa konteksto ng paglilingkod sa kapulungan ay malamang na tumutukoy sa hayagang pagbabasa. Hindi idinagdag sa pangunahing teksto ang “ng Kasulatan” sapagkat walang tahasang layon sa Griyego.
- source_word: τῇ παρακλήσει
  choice: ang panghihikayat
  rationale: Maaaring saklawin ng παράκλησις ang pagpapalakas ng loob at masidhing paghimok. Ang “panghihikayat” ay natural at pinananatili ang lawak na iyon sa konteksto ng pastoral na paglilingkod.
- source_word: τῇ διδασκαλίᾳ
  choice: ang pagtuturo
  rationale: Malinaw at karaniwang katumbas ito ng gawain o nilalaman ng pagtuturo, nang hindi ipinakikitid ang diwa sa sistematikong doktrina lamang.
theological_decisions:
- issue: Kung tahasang tutukuyin sa pangunahing teksto na Kasulatan ang binabasa
  choice: ang pampublikong pagbabasa
  alternative: ang pagbabasa ng Kasulatan; ang pagbabasa
  rationale: Malakas na ipinahihiwatig ng konteksto ang pampublikong pagbabasa ng Kasulatan sa kapulungan, ngunit “ang pagbabasa” lamang ang tahasang sinasabi ng Griyego. Kaya ipinahahayag sa pangunahing teksto ang malamang na pampublikong katangian, habang inilalagay sa talababa ang mas tiyak na pagbanggit sa Kasulatan.
- issue: Lawak ng kahulugan ng παράκλησις
  choice: panghihikayat
  alternative: pagpapalakas ng loob; pagpapayo; masidhing paghimok
  rationale: Hindi sapilitang nilulutas kung ang diin ay paghimok o pagpapalakas ng loob. Kayang taglayin ng “panghihikayat” ang pastoral at mapanghikayat na puwersa ng salita sa hanay ng pagbabasa at pagtuturo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pag-ukulan mo ng buong pansin” upang ihatid ang patuloy na pananagutan, at ang magkakatulad na anyong pangngalan—pagbabasa, panghihikayat, pagtuturo—upang mapanatili ang tatluhang ayos ng Griyego.
