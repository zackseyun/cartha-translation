  text: sa pamamagitan ng pagkukunwari ng mga sinungaling na ang sarili nilang budhi ay pinaso,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may tatak sa sarili nilang budhi” o “na-cauterize ang sarili nilang budhi.” Maaaring ipinahihiwatig ng larawang Griyego ang budhing namarkahan o nawalan ng pakiramdam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: sa pamamagitan ng
  rationale: Ipinahahayag dito ng ἐν ang paraan o kasangkapan kaugnay ng naunang pahayag; natural sa Filipino ang “sa pamamagitan ng.”
- source_word: ὑποκρίσει
  choice: pagkukunwari
  rationale: Tumutukoy ang ὑπόκρισις sa mapagkunwaring asal o pagpapanggap. Mas karaniwan at malinaw sa modernong Filipino ang “pagkukunwari” kaysa hiram na “hipokrisya.”
- source_word: ψευδολόγων
  choice: ng mga sinungaling
  rationale: 'Ang pangmaramihang henitibo ay likas na kaugnay ng ὑποκρίσει: “pagkukunwari ng mga sinungaling.” Maikli at tuwiran ang salin.'
- source_word: κεκαυστηριασμένων
  choice: na ... ay pinaso
  rationale: Pinananatili ng “pinaso” ang matingkad na larawan ng pagdadarang o cauterization. Isinalin ang ganap na pasibong participle bilang sugnay na naglalarawan sa kalagayang bunga ng ginawa.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: ang sarili nilang budhi
  rationale: Pinananatili ng “sarili nilang” ang diin ng ἰδίαν. Ang “budhi” ay natural at dignified na katumbas ng συνείδησις; ang isahang anyo ay maaaring unawain nang distributibo.
theological_decisions:
- issue: Matalinghagang puwersa ng κεκαυστηριασμένων
  choice: “ang sarili nilang budhi ay pinaso”
  alternative: “may tatak sa sarili nilang budhi” o “kinauterisa ang sarili nilang budhi”
  rationale: Pinananatili ng “pinaso” ang larawan nang hindi ipinipilit kung ang diin ay nasa pagmamarka o sa pagkawala ng pakiramdam, at hindi rin ito gumagawa ng doktrinal na pahayag tungkol sa hindi na mababagong kalagayang espirituwal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pagkukunwari,” “mga sinungaling,” at “budhi” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Nakaugnay ang parirala sa naunang talata, gaya ng ayos ng Griyego.
