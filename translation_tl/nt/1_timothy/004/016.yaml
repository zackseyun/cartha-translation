id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: tl
  text: Bigyang-pansin mong mabuti ang iyong sarili at ang turo[a]. Magpatuloy ka sa mga ito. Sapagkat sa paggawa nito, ililigtas[b] mo kapwa ang iyong sarili at ang mga nakikinig sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagtuturo.” Maaaring tumukoy ang salitang Griyego sa nilalaman ng turo o sa gawain ng pagtuturo.
    reason: lexical_alternative
  - marker: b
    text: O, “iingatan.” Maaaring mangahulugan ang salitang Griyego ng pagliligtas o pag-iingat, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Bigyang-pansin mong mabuti
  rationale: Ipinahahayag ng pautos ang patuloy at masusing pagbabantay, hindi ang panandaliang pagpansin lamang.
- source_word: σεαυτῷ
  choice: ang iyong sarili
  rationale: Ang reflexive dative ang layon ng masusing pagpansin; natural itong ipinahahayag sa Tagalog bilang “ang iyong sarili.”
- source_word: τῇ διδασκαλίᾳ
  choice: ang turo
  rationale: Maaaring tumukoy ang διδασκαλία sa nilalaman o gawain ng pagtuturo. Ang “turo” ay malinaw, dignified, at hindi teknikal, habang pinananatili ng talababa ang alternatibong diwa.
- source_word: ἐπίμενε αὐτοῖς
  choice: Magpatuloy ka sa mga ito
  rationale: Ipinahahayag ng ἐπίμενε ang matatag at tuloy-tuloy na pananatili. Binubuod ng panghalip na maramihan ang naunang mga bagay na dapat pagtuunan.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Sapagkat sa paggawa nito
  rationale: Natural na ipinahahayag nito ang paraan o kasabay na kalagayan ng participial construction nang hindi pinalalabis ang sanhi.
- source_word: σώσεις
  choice: ililigtas
  rationale: Pinananatili nito ang karaniwang at teolohikal na mabigat na diwa ng σῴζω, sa halip na paliitin agad sa pansamantalang pag-iingat lamang.
- source_word: τοὺς ἀκούοντάς σου
  choice: ang mga nakikinig sa iyo
  rationale: Naipahahayag ng kasalukuyang participle ang mga patuloy na nakikinig sa turo ni Timoteo sa natural na modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng σώσεις sa isang pastoral na tagubilin
  choice: “ililigtas” nang hindi nililimitahan ang saklaw nito
  alternative: “iingatan” o “mailalayo sa kapahamakan”
  rationale: Iniuugnay ng talata ang matapat na pagpapatuloy sa sarili at sa turo sa kaligtasan ni Timoteo at ng mga nakikinig sa kaniya. Hindi sinasabi ng teksto na sariling gawa ang pinagmumulan ng kaligtasan; pinananatili ng salin ang bigat at tensiyong teolohikal ng pahayag nang hindi ito ipinapaliwanag nang lampas sa nakasulat.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at pinanatili ang tuwirang lakas ng “ililigtas.”
