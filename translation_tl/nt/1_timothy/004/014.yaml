  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: tl
  text: Huwag mong pabayaan ang kaloob na nasa iyo, na ibinigay sa iyo sa pamamagitan ng propesiya[a], kasabay ng pagpapatong ng mga kamay ng lupon ng mga nakatatanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng propetikong pahayag.” Maaaring tumukoy ito sa propetikong pahayag na naging daan sa pagkakaloob ng kaloob o sumabay rito.
    reason: lexical_alternative
  - marker: b
    text: O, “kapulungan ng mga nakatatanda” o “presbiteryo”; tumutukoy ito sa sama-samang lupon ng mga nakatatanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Huwag mong pabayaan
  rationale: 'Likas at malinaw itong patuloy na pagbabawal sa Filipino: huwag bigong pag-ukulan ng nararapat na pansin ang ipinagkatiwalang kaloob.'
- source_word: χάρισμα
  choice: kaloob
  rationale: Ipinahihiwatig ng salita ang kaloob na nagmumula sa biyaya. Hindi idinagdag ang “espirituwal” sapagkat walang katumbas na pang-uri sa Griyego.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: ang kaloob na nasa iyo
  rationale: Pinananatili ang tahasang lokasyon ng kaloob “sa” loob o pagkatao ni Timoteo sa halip na gawing simpleng “kaloob mo.”
- source_word: ἐδόθη σοι
  choice: ibinigay sa iyo
  rationale: Tuwirang sinasalamin ang anyong balintiyak at hindi tinutukoy kung sino ang nagbigay, gaya rin ng Griyego.
- source_word: διὰ προφητείας
  choice: sa pamamagitan ng propesiya
  rationale: Ipinapahayag ang posibleng instrumental na diwa ng διά, habang iniiwan sa talababa ang posibilidad na tumutukoy ito sa propetikong pahayag na kasabay o naging paraan ng pagkakaloob.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: kasabay ng pagpapatong ng mga kamay
  rationale: Natural na Filipino para sa ritwal na kilos; ipinakikita ng “kasabay” ang ugnayang ipinahihiwatig ng μετά nang hindi pinagsasanib ang papel nito sa papel ng propesiya.
- source_word: τοῦ πρεσβυτερίου
  choice: ng kapulungan ng matatandang pinuno
  rationale: Ipinakikita na isang kolektibong lupon ng mga elder ang tinutukoy, hindi isang tao lamang, at iniiwasan ang katawagang maaaring magpasok ng mas huling denominasyonal na kaayusan.
theological_decisions:
- issue: Kung lalagyan ng tahasang espirituwal o pangministeryong espesipikasyon ang χάρισμα
  choice: kaloob
  alternative: espirituwal na kaloob; kaloob para sa paglilingkod
  rationale: Malamang na tumutukoy ang konteksto sa kaloob para sa paglilingkod, ngunit “kaloob” lamang ang tahasang nasa Griyego. Pinananatili ng salin ang lawak ng salita.
- issue: Kung paano isasalin ang πρεσβυτέριον nang hindi nagpapasok ng partikular na sistema ng pamamahala sa iglesya
  choice: kapulungan ng matatandang pinuno
  alternative: lupon ng mga nakatatanda; presbiteryo
  rationale: Malinaw na kolektibong pangkat ang tinutukoy. Ang napiling parirala ay nauunawaan sa modernong Filipino at hindi ipinapalagay ang isang mas huling denominasyonal na estruktura.
- issue: Ugnayan ng propesiya sa pagkakaloob ng kaloob
  choice: sa pamamagitan ng propesiya
  alternative: sa pamamagitan ng propetikong pahayag; kasabay ng propesiya
  rationale: Maaaring ipahiwatig ng διά ang paraan o pamamagitan, ngunit hindi lubos na nilulutas ng parirala kung ang propesiya mismo ang namagitan o kung propetikong pahayag ang sumabay sa pagkakaloob. Pinananatili sa talababa ang saklaw na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaloob” sa halip na mas teknikal na “karisma,” at “kapulungan ng matatandang pinuno” sa halip na denominasyonal na terminolohiya. Ang “kasabay” ay nagpapalinaw sa μετά habang pinananatili ang pagkakaiba nito sa διὰ.
