  text: Isagawa mo ang mga bagay na ito; italaga mo ang iyong sarili sa mga ito[a], upang maging hayag sa lahat ang iyong pagsulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “maging ka sa mga bagay na ito.” Ipinahihiwatig ng pananalitang Griyego ang lubos na pagtuon at pakikibahagi sa mga ito.
