  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: tl
  text: na nagbabawal sa pag-aasawa at nag-uutos na umiwas sa mga pagkaing nilikha ng Diyos upang tanggapin ng mga sumasampalataya at nakakilala na sa katotohanan nang may pasasalamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “na nagbabawal mag-asawa at umiwas sa mga pagkain.” Ginagawang hayag sa pangunahing teksto na ipinag-uutos ng mga huwad na guro ang pag-iwas sa mga pagkain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: nagbabawal
  rationale: Ang pangkasalukuyang pandiwaring ito ay nagpapatuloy sa paglalarawan mula sa naunang talata; natural at tuwiran ang “nagbabawal” sa Filipino.
- source_word: γαμεῖν
  choice: sa pag-aasawa
  rationale: Bagaman literal na “mag-asawa,” mas likas sa Filipino ang “nagbabawal sa pag-aasawa” at malinaw nitong ipinapahayag ang ipinagbabawal na gawain.
- source_word: ἀπέχεσθαι
  choice: nag-uutos na umiwas
  rationale: Ang anyong pawatas ay nangangahulugang “umiwas.” Ginawang hayag ang ipinahiwatig na pag-uutos upang maiwasan ang maling pagkaunawang ipinagbabawal ng mga guro ang pag-iwas sa pagkain.
- source_word: βρωμάτων
  choice: mga pagkain
  rationale: Pinananatili ng maramihang “mga pagkain” ang bilang ng salitang Griyego at natural ito sa modernong Filipino.
- source_word: ἃ
  choice: na
  rationale: Natural na pang-ugnay sa Filipino na tumutukoy sa “mga pagkain.”
- source_word: ἔκτισεν
  choice: nilikha
  rationale: Pinananatili ng “nilikha” ang malinaw na diwa ng paglalang, hindi lamang pangkalahatang paggawa.
- source_word: εἰς μετάλημψιν
  choice: upang tanggapin
  rationale: Ipinapahayag nito ang layunin ng paglikha sa mga pagkain at natural na inilalarawan ang pagtanggap o pagkain sa mga ito.
- source_word: μετὰ εὐχαριστίας
  choice: nang may pasasalamat
  rationale: Malinaw at karaniwang pagpapahayag na pinananatili ang diwa ng pagpapasalamat sa Diyos.
- source_word: τοῖς πιστοῖς
  choice: ng mga sumasampalataya
  rationale: Ipinakikita ang pandiwang diwa ng πιστός dito at iniiwasan ang posibleng kahulugan ng “mga tapat” lamang.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: nakakilala na sa katotohanan
  rationale: Ang “na” ay tumutulong magpahayag ng kalagayang bunga ng pagkakilala, alinsunod sa aspektong ganap ng pandiwaring Griyego.
theological_decisions:
- issue: Kung ang τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν ay tumutukoy sa iisang pangkat o sa dalawang magkahiwalay na pangkat
  choice: 'Iisang pangkat na inilalarawan sa dalawang paraan: mga sumasampalataya na nakakilala na sa katotohanan'
  alternative: 'Dalawang pangkat: ang mga sumasampalataya at ang mga nakakilala sa katotohanan'
  rationale: Ang iisang pantukoy na kaugnay ng dalawang magkatugmang paglalarawan ay higit na likas na tumutukoy sa iisang pangkat; hindi kailangang magpalagay ng dalawang uri ng tatanggap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong nagpapatuloy sa pangungusap ng naunang talata, habang ginawang hayag ang ipinahiwatig na pag-uutos tungkol sa pagkain. Ang talababa ay nagtatala ng mas literal ngunit sintaktikong alanganing anyo.
