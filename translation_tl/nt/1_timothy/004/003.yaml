  to: na nagbabawal sa pag-aasawa at nag-uutos na umiwas sa mga pagkaing nilikha ng Diyos upang tanggapin ng mga sumasampalataya at nakakilala na sa katotohanan nang may pasasalamat.[a]
  rationale: Inayos ang pagkakasunod-sunod ng mga parirala upang maging natural at walang kalabuan sa Filipino, habang pinananatili ang layunin ng εἰς μετάλημψιν, ang “nang may pasasalamat” ng μετὰ εὐχαριστίας, at ang iisang pangkat na inilalarawan ng τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν. Inalis din sa talababa ang “ilang,” sapagkat hindi ito tahasang nasa pinagmulan.
