id: 1TI.4.4
reference: 1 Timothy 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: tl
  text: Sapagkat ang bawat nilikha ng Diyos ay mabuti[a], at walang dapat tanggihan kung tinatanggap ito nang may pasasalamat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat nilalang ng Diyos ay mabuti.” Ang salitang Griyego na κτίσμα ay maaaring tumukoy sa isang nilalang o, sa mas malawak na diwa, sa anumang bagay na nilikha.
    reason: lexical_alternative
  - marker: b
    text: O “at walang maitatakwil kapag tinatanggap nang may pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o batayan para sa naunang pahayag; natural sa Tagalog ang “Sapagkat” at napapanatili ang paliwanag na diwa.
- source_word: πᾶν
  choice: bawat
  rationale: Dahil isahan ang κτίσμα, ang distributibong “bawat” ang pinakamalinaw na katumbas.
- source_word: κτίσμα
  choice: nilikha
  rationale: Tumutukoy ito sa isang bagay na nilalang o nilikha. Mas malawak at mas natural dito ang “nilikha” kaysa “nilalang,” na maaaring unawaing buhay na nilalang lamang.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinahahayag ang Diyos bilang pinagmulan ng nilikha.
- source_word: καλόν
  choice: mabuti
  rationale: Karaniwang katumbas na angkop sa wikang biblikal tungkol sa kabutihan ng nilikha.
- source_word: οὐδὲν
  choice: walang
  rationale: Natural na Tagalog na nagpapahayag ng ganap na pagtanggi sa anumang eksepsiyon sa saklaw ng pahayag.
- source_word: ἀπόβλητον
  choice: dapat tanggihan
  rationale: Ang pang-uri ay maaaring mangahulugang “maitatakwil” o “dapat tanggihan”; ang hulma na “walang dapat tanggihan” ay natural at tumpak sa Tagalog.
- source_word: μετὰ εὐχαριστίας
  choice: nang may pasasalamat
  rationale: Pinananatili ang tahasang diwa ng pagpapasalamat at ang kaugnayan nito sa pagtanggap.
- source_word: λαμβανόμενον
  choice: kung tinatanggap ito
  rationale: Ginagawang natural na sugnay sa Tagalog ang kasalukuyang pasibong participle, habang pinananatili ang maaaring kondisyunal na ugnayan nito sa pangunahing pahayag.
theological_decisions:
- issue: Saklaw ng κτίσμα sa konteksto ng pagkain at mga pagbabawal
  choice: “bawat nilikha ng Diyos”
  alternative: “bawat nilalang ng Diyos” o “lahat ng pagkaing nilikha ng Diyos”
  rationale: Malawak ang salitang Griyego at hindi tahasang limitado sa pagkain, bagaman pagkain ang agarang konteksto. Pinananatili ng salin ang malawak na batayang nakaugat sa paglikha nang hindi pinakikitid ang teksto.
- issue: Lakas ng kondisyunal na diwa ng λαμβανόμενον
  choice: “kung tinatanggap ito nang may pasasalamat”
  alternative: “kapag tinatanggap ito nang may pasasalamat” o “na tinatanggap nang may pasasalamat”
  rationale: Malinaw at natural na iniuugnay ng “kung” ang hindi pagtanggi sa pagtanggap nang may pasasalamat, nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nilikha” upang mapanatili ang malawak na saklaw ng κτίσμα, at ang “nang may pasasalamat” bilang likas na pahayag sa kasalukuyang Filipino.
