  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: tl
  text: Iutos mo ang mga bagay na ito at ituro ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Itagubilin mo ang mga bagay na ito at ituro ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: Iutos mo
  rationale: Ang kasalukuyang pautos na anyo ay nagpapahayag ng nagpapatuloy at may-awtoridad na pagbibigay ng tagubilin. Pinananatili ng “Iutos mo” ang lakas nito nang hindi nagdaragdag ng uri o saklaw ng awtoridad na hindi tahasang sinabi sa teksto.
- source_word: ταῦτα
  choice: ang mga bagay na ito / ang mga ito
  rationale: Ang panghalip na pamatlig ay nasa pangmaramihang anyong neutral at tumutukoy pabalik sa naunang mga turo o tagubilin. Natural sa Tagalog ang buong parirala sa unang sugnay at ang pinaikling anyo sa ikalawa.
- source_word: καὶ
  choice: at
  rationale: Payak nitong pinag-uugnay ang dalawang pautos.
- source_word: δίδασκε
  choice: ituro
  rationale: Ang kasalukuyang pautos ay maaaring magpahiwatig ng patuloy na pagtuturo. Ang “ituro” ay natural at malinaw; ang layon nitong “ang mga ito” ay hango sa ταῦτα.
theological_decisions:
- issue: Awtoridad na ipinahihiwatig ng παραγγέλλω
  choice: Iutos mo
  alternative: Itagubilin mo
  rationale: May malinaw na puwersang direktibo ang pandiwa, kaya hindi ito pinalambot tungo sa payo lamang. Gayunman, walang idinagdag na partikular na doktrina tungkol sa saklaw ng pastoral na awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Iutos mo” upang mapanatili ang awtoritatibong puwersa ng unang pandiwa, habang inilalahad sa talababa ang bahagyang mas malambot ngunit posibleng “Itagubilin mo.”
