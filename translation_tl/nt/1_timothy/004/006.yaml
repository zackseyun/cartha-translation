id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: tl
  text: Kung ihaharap mo sa mga kapatid[a] ang mga bagay na ito, magiging mabuting lingkod ka ng Mesias na si Jesus[b], na pinangangalagaan at pinalalago ng mga salita ng pananampalataya[c] at ng mabuting aral na iyong sinunod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masculine plural ang salitang Griyego, ngunit maaari itong tumukoy sa mga kapwa mananampalataya sa pangkalahatan, kabilang ang mga babae.
    reason: cultural_note
  - marker: b
    text: O “Cristo Jesus.” Isinalin dito ang titulong Χριστός bilang “Mesias” upang mapanatili ang kahulugan nito.
    reason: lexical_alternative
  - marker: c
    text: Ang “pananampalataya” ay maaari ring tumukoy sa personal na pagtitiwala; ngunit sa pagkakaugnay nito sa “mabuting aral,” malamang na tumutukoy ito sa kinikilalang nilalaman ng paniniwalang Kristiyano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Tumutukoy ang panghalip na maramihan sa naunang mga babala at tagubilin, kaya pinanatili ang bilang at pabalik na pagtukoy.
- source_word: ὑποτιθέμενος
  choice: Kung ihaharap mo
  rationale: Ang pandiwa ay literal na paglalagay o paghaharap ng isang bagay sa harap ng iba, at dito ay nangangahulugang paglalahad ng mga bagay na ito sa kapulungan. Ang kondisyunal na sugnay ay likas na paraan sa Filipino upang ipakita ang ugnayan ng participle sa pangunahing pandiwa.
- source_word: τοῖς ἀδελφοῖς
  choice: sa mga kapatid
  rationale: Karaniwang tawag sa Filipino ang “mga kapatid” para sa mga kapwa mananampalataya at hindi nito sapilitang nililinaw kung mga lalaki lamang o ang buong komunidad ang tinutukoy.
- source_word: καλὸς
  choice: mabuti
  rationale: Tuwirang inilalarawan nito ang kapuri-puring uri ng paglilingkod nang hindi dinaragdagan ang antas ng papuri.
- source_word: διάκονος
  choice: lingkod
  rationale: Sa konteksto, inilalarawan nito ang tungkulin ng paglilingkod at hindi malinaw na tumutukoy sa pormal na katungkulang diyakono.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ni Mesias Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesias” at pinanatili ang pangalang Jesus. Ang “ni” ang natural na panandang Filipino para sa personal na pinaglilingkuran.
- source_word: ἐντρεφόμενος
  choice: habang patuloy kang pinalalakas
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na paghubog o pagpapakain. Ang “pinalalakas” ay natural sa Filipino at pinananatili ang diwang tumatanggap si Timoteo ng espirituwal na sustansiya, bagaman hindi nito literal na inuulit ang larawang pagkain.
- source_word: τοῖς λόγοις
  choice: ng mga salita
  rationale: Pinanatili ang konkretong “mga salita” sa halip na agad itong gawing “mga turo,” at ipinakita ang mga ito bilang kasangkapan ng pagpapalakas.
- source_word: τῆς πίστεως
  choice: ng pananampalataya
  rationale: Ang “pananampalataya” ang karaniwang salin ng πίστις. Maaaring tumukoy rito ang parirala sa kinikilalang nilalaman ng paniniwalang Kristiyano, ngunit hindi likas na minamarkahan ng Filipino ang tiyak na artikulo sa kaparehong paraan ng Griyego.
- source_word: τῆς καλῆς διδασκαλίας
  choice: ng mabuting aral
  rationale: Ang “mabuting aral” ay malinaw at kasalukuyang Filipino, pinananatili ang positibong paglalarawan ng καλῆς nang hindi ito ginagawang “wastong” o “malusog,” na mas interpretatibo.
- source_word: ᾗ παρηκολούθηκας
  choice: na iyong sinunod
  rationale: Ang pambabaeng isahang relative pronoun ay pinakamalapit na tumutukoy sa “mabuting aral.” Sinasaklaw ng “sinunod” ang maingat na pagsubaybay at patuloy na pagtalima nang hindi labis na nililinaw kung alin ang nangingibabaw.
theological_decisions:
- issue: Saklaw ng τοῖς ἀδελφοῖς
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Masculine plural ang anyong Griyego, ngunit maaari itong gamitin para sa mga kapwa mananampalataya bilang isang pangkat. Ang karaniwang salitang Filipino na “mga kapatid” ay nagpapanatili sa posibleng malawak na saklaw nang hindi nagdaragdag ng kasariang hindi tiyak sa konteksto.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesias Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesias” ang kahulugan ng Χριστός bilang titulo ng pinahiran, samantalang ibinibigay sa talababa ang tradisyonal na anyong “Cristo.”
- issue: Kahulugan ng πίστις sa τῆς πίστεως
  choice: pananampalataya, na malamang ay tumutukoy sa kinikilalang nilalaman ng paniniwala
  alternative: pananampalataya bilang personal na pagtitiwala; katapatan
  rationale: Ang artikulo at ang pagkakatambal nito sa “mabuting aral” ay pumapabor sa obhetibong diwa ng kinikilalang pananampalataya, ngunit pinanatili sa pangunahing teksto ang salitang maaari ring magdala ng karaniwang diwa ng pagtitiwala.
- issue: Ugnayan ng relative clause ᾗ παρηκολούθηκας
  choice: tumutukoy sa mabuting aral
  alternative: tumutukoy sa pinagsamang mga salita ng pananampalataya at mabuting aral
  rationale: Ang pambabaeng isahang ᾗ ay kaayon ng pambabaeng isahang διδασκαλίας, kaya pinakamalamang na “mabuting aral” ang tuwirang tinutukoy, bagaman magkakaugnay ang dalawang parirala sa diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ihaharap” upang mapanatili ang larawan ng ὑποτίθημι, ngunit isinaayos bilang kondisyunal na sugnay para sa natural na daloy. Ang “habang patuloy kang pinalalakas” ay likas na Filipino para sa nagpapatuloy na diwa ng ἐντρεφόμενος at umiiwas sa alanganing literal na “pinakakain,” habang nananatili ang diwa ng pagtanggap ng sustansiya.
