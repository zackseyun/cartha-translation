id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: tl
  text: Sapagkat para sa layuning ito kami ay nagpapagal at nilalait[a], sapagkat inilagak namin ang aming pag-asa sa Diyos na buháy[b], na siyang Tagapagligtas ng lahat ng tao, lalo na ng mga sumasampalataya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapagal kami at hinahamak kami.”
    reason: lexical_alternative
  - marker: b
    text: O “itinuon namin ang aming pag-asa sa Diyos na buháy.”
    reason: lexical_alternative
  - marker: c
    text: Ang pariralang “Tagapagligtas ng lahat ng tao, lalo na ng mga sumasampalataya” ay isinalin ayon sa pagkakasulat. Iba-iba ang pagkaunawa kung binibigyang-diin dito ang pag-iingat ng Diyos sa lahat, ang inilaan niyang kaligtasan para sa lahat, o ang kaligtasang natatanging tinatanggap ng mga sumasampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dahil dito
  rationale: Tumutukoy ito sa layunin o mithiin sa naunang konteksto. Likas sa modernong Tagalog ang “dahil dito” habang nananatili ang ugnayang panglayunin.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang pahayag; malinaw at marangal na katumbas ang “sapagkat.”
- source_word: κοπιῶμεν
  choice: nagpapagal kami
  rationale: Ipinahihiwatig ng pandiwa ang mabigat at puspusang paggawa. Higit na pinananatili ng “nagpapagal” ang tindi kaysa sa payak na “nagtatrabaho.”
- source_word: ὀνειδιζόμεθα
  choice: nilalait
  rationale: Ang pasibong anyo ay tumutukoy sa pagtanggap ng panlalait o pampublikong paghamak. Natural at tuwiran sa Tagalog ang “nilalait.”
- source_word: ἠλπίκαμεν ἐπὶ
  choice: inilagak namin ang aming pag-asa sa
  rationale: Ipinakikita ng ganap na panahunan ang isang naganap na pagtitiwala na nananatili ang bunga. Naipahahayag ito ng “inilagak namin ang aming pag-asa sa.”
- source_word: θεῷ ζῶντι
  choice: Diyos na buháy
  rationale: Pinananatili nito ang pamilyar na biblikal na paglalarawan at nililinaw ng tuldik na ang kahulugan ay “living,” hindi “life.”
- source_word: σωτὴρ
  choice: Tagapagligtas
  rationale: Bagaman maaari ring tumukoy sa tagapagligtas o tagapag-ingat, may malinaw na teolohikal na bigat ang salita sa mga Liham Pastoral. “Tagapagligtas” ang pinakatuwirang katumbas nang hindi nilulutas ang saklaw nito rito.
- source_word: πάντων ἀνθρώπων
  choice: ng lahat ng tao
  rationale: Pangkalahatan at inklusibo ang ἀνθρώπων dito; natural sa Tagalog ang “lahat ng tao” bilang pagtukoy sa sangkatauhan.
- source_word: μάλιστα
  choice: lalo na
  rationale: Karaniwang kahulugan nito ang “especially” o “particularly.” Pinananatili ng “lalo na” ang tensiyon sa pagitan ng lahat ng tao at ng natatanging kaugnayan sa mga sumasampalataya.
- source_word: πιστῶν
  choice: mga sumasampalataya
  rationale: Sa konteksto, tumutukoy ito sa mga taong may pananampalataya. Mas malinaw sa karaniwang mambabasa ang “mga sumasampalataya” kaysa sa maaaring malabong “mga tapat.”
theological_decisions:
- issue: Kahulugan ng “Tagapagligtas ng lahat ng tao, lalo na ng mga sumasampalataya”
  choice: Panatilihin ang malawak na pahayag at ang “lalo na” nang hindi nililimitahan ang “lahat ng tao” o iginigiit ang kaligtasan ng lahat.
  alternative: Maaaring unawain ang “Tagapagligtas” bilang tagapag-ingat ng lahat ngunit manunubos ng mga sumasampalataya; bilang pahayag ng kaligtasan ng lahat; o ang “lahat” bilang lahat ng uri ng tao.
  rationale: Magkasamang ipinahahayag ng Griyego ang pangkalahatan (“lahat ng tao”) at ang natatangi (“lalo na ng mga sumasampalataya”). Dapat panatilihin ng salin ang tunay na tensiyong ito sa halip na ipasiya ang isang partikular na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagpapagal,” “nilalait,” at “inilagak” upang mapanatili ang bigat ng orihinal nang hindi nagiging lipas o labis na pormal. Ang mga marker [a], [b], at [c] ay nasa pangunahing teksto at tumutugma sa mga talababa.
