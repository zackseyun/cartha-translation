  to: Sapagkat para sa layuning ito kami ay nagpapagal at nilalait[a], sapagkat inilagak namin ang aming pag-asa sa Diyos na buháy[b], na siyang Tagapagligtas ng lahat ng tao, lalo na ng mga sumasampalataya.[c]
