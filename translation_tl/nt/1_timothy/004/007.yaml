  naturalness: Hindi natural at malabo ang “mga kuwentong-kathang lapastangan at pangmatandang babae.” Mas likas ang magkatugmang pang-uring “lapastangang mga kuwentong-katha ng matatandang babae,” habang nililinaw ng talababa na ang Griyego ay tumutukoy sa katangian, hindi kinakailangang pinagmulan, ng mga kuwento.
