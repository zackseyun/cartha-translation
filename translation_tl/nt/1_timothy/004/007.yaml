base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: tl
  text: Ngunit tanggihan mo ang lapastangang mga kuwentong-katha ng matatandang babae[a]. Sa halip, sanayin mo ang iyong sarili para sa makadiyos na pamumuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga kuwentong-kathang katangian ng matatandang babae.” Mapanghamak ang pananalitang Griyego; maaari ring isalin na “mga kuwento ng matatandang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: lapastangan
  rationale: Ipinapahayag nito ang kawalan ng paggalang sa mga bagay na banal at pinananatili ang pagsalungat sa sagrado.
- source_word: γραώδεις
  choice: pangmatandang babae
  rationale: Pinananatili nito ang tiyak at mapanghamak na larawan ng salitang Griyego, sa halip na palambutin lamang bilang “hangal.” Ipinaliliwanag sa talababa ang literal na diwa at tono nito.
- source_word: μύθους
  choice: mga kuwentong-katha
  rationale: Mas likas ito sa modernong Tagalog para sa mga gawa-gawa o mapag-isip-isip na salaysay kaysa “mga mito,” nang hindi ipinahihiwatig na mga tradisyonal na alamat lamang ang tinutukoy.
- source_word: παραιτοῦ
  choice: tanggihan mo
  rationale: Tuwirang ipinahahayag ng pautos ang pagtanggi o hindi pagtanggap sa gayong mga kuwento.
- source_word: γύμναζε
  choice: sanayin mo
  rationale: Pinananatili ang larawan ng masikap at tuloy-tuloy na pagsasanay, gaya ng pagsasanay sa katawan.
- source_word: σεαυτόν
  choice: ang iyong sarili
  rationale: Tuwirang tinutukoy ang sarili ni Timoteo bilang sasailalim sa pagsasanay.
- source_word: πρὸς εὐσέβειαν
  choice: sa pamumuhay na may paggalang sa Diyos
  rationale: Ipinapahayag ang layunin ng pagsasanay at ang diwa ng εὐσέβεια bilang buhay na nakatuon sa Diyos at may nararapat na paggalang sa kanya.
- source_word: δὲ … δὲ
  choice: Ngunit … naman
  rationale: Ipinakikita ng “Ngunit” ang pagsalungat sa naunang konteksto, samantalang natural na inilalahad ng “naman” ang positibong kapalit na utos.
theological_decisions:
- issue: Paglalarawan sa γραώδεις μύθους
  choice: Panatilihin sa pangunahing teksto ang tiyak na mapanghamak na larawan bilang “mga kuwentong-kathang … pangmatandang babae,” na may paliwanag sa talababa.
  alternative: mga kuwentong-kathang hangal; mga kuwento ng matatandang babae
  rationale: Ang “hangal” ay nagpapalambot at nag-aalis sa partikular na larawang ginamit sa Griyego, samantalang ang “mga kuwento ng matatandang babae” ay maaaring magmukhang simpleng pahayag tungkol sa pinagmulan ng mga kuwento. Pinananatili ng napiling anyo ang retorikal na talim nang nililinaw ang mapanghamak na katangian nito sa talababa.
- issue: Kahulugan ng εὐσέβεια
  choice: pamumuhay na may paggalang sa Diyos
  alternative: kabanalan; debosyon sa Diyos
  rationale: Hindi nililimitahan ng salin ang salita sa seremonyal na debosyon o sa abstraktong katangian lamang; inilalarawan nito ang buháy at praktikal na paggalang sa Diyos nang hindi nag-aangkat ng natatanging doktrinal na pakahulugan.
translation_notes:
  register: Makabago at dignified na Tagalog ang ginamit. Pinili ang “kuwentong-katha” kaysa teknikal na “mito,” at ipinaliwanag sa talababa ang di-pangkaraniwan at mapanghamak na pariralang “pangmatandang babae.”
