id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: tl
  text: Ngunit tahasang sinasabi ng Espiritu na sa mga darating na panahon[a], tatalikod ang ilan sa pananampalataya[b] at makikinig sa mga mapanlinlang na espiritu[c] at sa mga turo ng mga demonyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga panahong darating sa dakong huli.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lalayo ang ilan sa pananampalataya.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga espiritung nanlilinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: ang Espiritu
  rationale: Ang artikulo at ang kontekstong propetiko sa liham ay pinakamalinaw na tumutukoy sa Banal na Espiritu. Ginamit ang malaking titik upang ipakita ang tinutukoy, bagaman walang ganitong pagkakaiba ng malaking at maliit na titik sa sinaunang tekstong Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat na may bahagyang pagsalungat sa naunang pahayag; likas at malinaw sa Filipino ang “Ngunit.”
- source_word: ῥητῶς
  choice: tahasang
  rationale: Ipinapanatili nito ang diwang malinaw at tuwirang ipinahayag, nang hindi gumagamit ng lipas o mabigat na pananalita.
- source_word: λέγει
  choice: sinasabi
  rationale: Pinanatili ang aspektong pangkasalukuyan ng pandiwa at ang karaniwang paraan ng pagtukoy sa patuloy na bisa ng pahayag ng Espiritu.
- source_word: ἐν ὑστέροις καιροῖς
  choice: sa mga darating na panahon
  rationale: Tumutukoy ito sa mga panahong kasunod ng kasalukuyan ng manunulat at hindi kinakailangang sa pinakahuling yugto lamang ng kasaysayan.
- source_word: ἀποστήσονταί
  choice: tatalikod
  rationale: Ipinapahayag nito ang paglayo o pagtalikod nang hindi ipinapasok ang isang tiyak na sistematikong paliwanag tungkol sa apostasya.
- source_word: τινες
  choice: ang ilan
  rationale: Ito ang natural na salin ng di-tiyak na panghalip na maramihan.
- source_word: τῆς πίστεως
  choice: sa pananampalataya
  rationale: Sa kontekstong ito, pinakamalamang na tumutukoy ito sa pananampalatayang Kristiyano bilang pinaniniwalaang katotohanan, habang hindi lubusang inaalis ang kaugnayan nito sa personal na pananalig.
- source_word: προσέχοντες
  choice: makikinig sa
  rationale: Ipinapakita ng participle ang pagbibigay-pansin at pagsunod sa impluwensiya ng mga espiritu at turo. Ang “makikinig sa” ay natural sa Filipino at higit sa simpleng pagkarinig lamang.
- source_word: πνεύμασι πλάνοις
  choice: mga mapanlinlang na espiritu
  rationale: Ang πλάνος ay naglalarawan sa mga espiritung nanlilinlang o nagliligaw; pinananatili ng salin ang aktibong mapanlinlang na katangian.
- source_word: διδασκαλίαις δαιμονίων
  choice: mga turo ng mga demonyo
  rationale: 'Pinananatili ang posibleng genitive of source o association: mga turong nagmumula sa mga demonyo o nauugnay sa kanila, nang hindi ito nilulutas nang higit sa sinasabi ng teksto.'
theological_decisions:
- issue: Ang tinutukoy ng “Espiritu”
  choice: ang Banal na Espiritu
  alternative: isang espiritung propetiko o espiritu ng tao
  rationale: Dahil sa artikulo, pandiwang “sinasabi,” at kontekstong propetiko, pinakamalamang na ang Banal na Espiritu ang tinutukoy. Hindi tinutukoy ng salin ang eksaktong paraan ng paghahayag.
- issue: Diwa ng “pananampalataya”
  choice: ang pananampalatayang Kristiyano bilang nilalaman o kabuuan ng pinaniniwalaan
  alternative: personal na pananalig o katapatan
  rationale: Ang artikulo at ang konteksto ng pagtalikod tungo sa maling turo ay pumapabor sa obhetibong diwa ng “pananampalataya,” ngunit hindi dinaragdagan ng salin ang teksto ng isang partikular na doktrina tungkol sa apostasya.
- issue: Ugnayan ng participle na προσέχοντες sa pagtalikod
  choice: iniugnay sa pamamagitan ng “at” nang hindi tahasang ginawang sanhi
  alternative: “dahil nakikinig” o “habang nakikinig”
  rationale: Maaaring ilarawan ng participle ang paraan o kalagayang kaakibat ng pagtalikod at maaari ring magpahiwatig ng sanhi. Ang payak na pag-uugnay ay nagpapanatili sa ganitong saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “tahasang,” “tatalikod,” at “mga turo” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Nasa pangunahing teksto ang lahat ng panandang talababa at maayos ang pagkakasunod na [a], [b], [c].
