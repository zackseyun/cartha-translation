lexical_decisions:
- source_word: ἁγιάζεται
  choice: pinababanal
  rationale: Ang kasalukuyang balintiyak na anyo ay tumutukoy sa pagkain sa naunang konteksto. Pinananatili ng “pinababanal” ang wikang kaugnay ng pagiging banal nang hindi tahasang nilulutas kung ito ay pagtatalaga o pagpapaging-banal.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag o dahilan para sa naunang pahayag.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Sa kasamang genitive, ipinahihiwatig nito ang paraan o kasangkapan.
- source_word: λόγου θεοῦ
  choice: salita ng Diyos
  rationale: Tuwirang salin ito ng pariralang genitive at pinananatiling bukas ang eksaktong saklaw ng tinutukoy na salita ng Diyos.
- source_word: ἐντεύξεως
  choice: panalangin
  rationale: Natural at malawak na katumbas ito sa konteksto ng pasasalamat para sa pagkain; maaari ring taglayin ng salita ang diwa ng pagsusumamo o pakiusap, kaya inilagay ang mga iyon sa talababa.
theological_decisions:
- issue: Saklaw ng wikang pagpapabanal sa konteksto
  choice: Pinanatili ang “pinababanal” at hinayaang ipakita ng konteksto na pagkain ang tinutukoy.
  alternative: “itinatalaga bilang banal” o “ginagawang banal”
  rationale: Ang 1 Timoteo 4:3–4 ay tungkol sa pagkaing tinatanggap nang may pasasalamat. Hindi dapat dagdagan ng salin ang teksto ng tiyak na sakramental, moral, o soteriolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat” para sa maikling paliwanag at ang tradisyonal ngunit nauunawaang “pinababanal” upang mapanatili ang teolohikal na bigat at balintiyak na anyo ng Griyego.
