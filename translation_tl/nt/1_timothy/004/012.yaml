base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: tl
  text: Huwag kang hamakin ng sinuman dahil sa iyong kabataan. Sa halip, maging halimbawa ka sa mga mananampalataya sa pananalita, sa pamumuhay, sa pag-ibig, sa pananampalataya[a], at sa kadalisayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan.” Maaaring mangahulugan ang salitang Griyego ng pananampalataya o katapatan sa kontekstong ito.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: Huwag kang hamakin ng sinuman
  rationale: Natural na pagbabawal sa modernong Tagalog na pinananatili ang diwa ng paghamak o pagtingin nang mababa.
- source_word: σου τῆς νεότητος
  choice: dahil sa iyong kabataan
  rationale: Ipinahahayag ang dahilan o batayan ng paghamak; ang “kabataan” ay natural at sapat na malawak para sa νεότης.
- source_word: ἀλλὰ τύπος γίνου
  choice: Sa halip, maging halimbawa ka
  rationale: Ang τύπος ay huwarang dapat tularan; malinaw at pangkaraniwan ang “halimbawa,” habang pinananatili ng “maging” ang pautos ng γίνου.
- source_word: τῶν πιστῶν
  choice: sa mga mananampalataya
  rationale: Sa kontekstong ito, tumutukoy ang πιστοί sa mga taong sumasampalataya; ipinakikita ng “sa” kung kanino siya dapat maging halimbawa.
- source_word: ἐν λόγῳ
  choice: sa pananalita
  rationale: Tumutukoy dito ang λόγος sa paraan o nilalaman ng pagsasalita.
- source_word: ἐν ἀναστροφῇ
  choice: sa pamumuhay
  rationale: Saklaw ng ἀναστροφή ang asal at paraan ng pamumuhay; mas natural at malawak ang “pamumuhay” kaysa “pag-uugali” lamang.
- source_word: ἐν ἀγάπῃ
  choice: sa pag-ibig
  rationale: Direkta at kinikilalang katumbas ng ἀγάπη sa marangal na modernong Tagalog.
- source_word: ἐν πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang pangunahing kahulugan ng πίστις at ang posibilidad na tumukoy ito sa pananampalataya, habang inilalagay sa talababa ang posibleng “katapatan.”
- source_word: ἐν ἁγνείᾳ
  choice: sa kalinisan
  rationale: Pinananatili ang malawak na moral na diwa ng ἁγνεία nang hindi ito nililimitahan agad sa seksuwal na kalinisan lamang.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng mga katangiang dapat tularan
  choice: pananampalataya
  alternative: katapatan
  rationale: Maaaring tumukoy ang πίστις sa pagtitiwala o pananampalataya, o sa pagiging tapat. Pinananatili sa pangunahing teksto ang karaniwang salin at inilalahad sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang magkakatulad na hulma ng limang pariralang nagsisimula sa “sa,” at iniwasan ang sobrang espesipikong pagpapakahulugan sa ἁγνεία at πίστις.
