  source_fidelity: Tumpak ang kabuuang pagsasalin ng utos at ng limang larangang pinagtutuunan ng pagiging halimbawa. Ang “Huwag kang hamakin ng sinuman dahil sa iyong kabataan” ay natural na Tagalog para sa μηδείς σου τῆς νεότητος καταφρονείτω, at ang “maging halimbawa ka sa mga mananampalataya” ay wastong naghahatid ng τύπος γίνου τῶν πιστῶν. Napananatili rin ng talababa ang leksikal na kalabuan ng ἐν πίστει.
  naturalness: Marangal, malinaw, at natural ang daloy sa modernong Filipino Tagalog. Ang magkakatulad na paggamit ng “sa” sa talaan ay mabisa. Gayunman, ang “kalinisan” ay karaniwang tumutukoy sa pagiging malinis o hygiene sa kasalukuyang gamit at maaaring hindi agad maunawaang moral na purity.
  terminology: Ang “pananalita,” “pamumuhay,” “pag-ibig,” at “pananampalataya” ay angkop. Ang “kadalisayan” ay mas tuwirang katumbas ng ἁγνεία kaysa “kalinisan,” sapagkat pinananatili nito ang malawak na diwa ng moral na kadalisayan nang hindi ito nililimitahan sa kalinisan ng katawan o sa isang tiyak na aspekto ng asal.
