translation:
  language: tl
  text: Mapagkakatiwalaan ang kasabihan at karapat-dapat na tanggapin nang lubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mapagkakatiwalaan ang salita” o “Mapagkakatiwalaan ang pahayag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: mapagkakatiwalaan
  rationale: Sa pormulang πιστὸς ὁ λόγος, inilalarawan ng πιστός ang kasabihan bilang maaasahan at karapat-dapat pagtiwalaan. Likas at malinaw sa modernong Filipino ang “mapagkakatiwalaan.”
- source_word: ὁ λόγος
  choice: ang kasabihang ito
  rationale: Sa pormulang ito sa mga Liham Pastoral, ang λόγος ay tumutukoy sa isang tiyak na kasabihan o pahayag. Ginagawang natural at tiyak ng “kasabihang ito” ang diwa sa Filipino nang hindi ito binibigyan ng mas malawak na teknikal na kahulugan.
- source_word: πάσης
  choice: nang lubos
  rationale: Sa pariralang πάσης ἀποδοχῆς, ipinahihiwatig ng πάσης ang ganap o buong pagtanggap. Ang “nang lubos” ang natural na paraan upang ihayag ang kabuuang lakas nito sa Filipino.
- source_word: ἀποδοχῆς
  choice: tanggapin
  rationale: Ang ἀποδοχή ay pagtanggap o malugod na pagtanggap. Ang pandiwang “tanggapin” ay malinaw at likas sa balangkas ng pangungusap sa Filipino.
- source_word: ἄξιος
  choice: karapat-dapat
  rationale: Ang ἄξιος na sinusundan ng genitibo ay nangangahulugang nararapat o karapat-dapat sa isang bagay. Tuwirang tinutumbasan ito ng “karapat-dapat.”
