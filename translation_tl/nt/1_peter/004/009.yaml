  text: Be hospitable to one another without grumbling[a].
translation:
  language: tl
  text: Maging mapagpatuloy kayo sa isa’t isa nang walang pagrereklamo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maging mapagpatuloy kayo sa isa’t isa nang walang pagbulung-bulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλόξενοι
  choice: Maging mapagpatuloy
  rationale: Ang pang-uri ay ginagamit bilang isang utos sa konteksto. Likas at malinaw sa makabagong Tagalog ang “Maging mapagpatuloy,” at napapanatili nito ang anyong naglalarawan ng ugali sa halip na gawing mas malayang pagpapahayag.
- source_word: εἰς ἀλλήλους
  choice: sa isa’t isa
  rationale: Ipinahahayag nito ang pagtutumbasan at ang direksiyon ng pagkamapagpatuloy sa loob ng pamayanan. Karaniwan at natural sa Tagalog ang “sa isa’t isa.”
- source_word: ἄνευ
  choice: nang walang
  rationale: Tuwirang ipinahahayag nito ang kawalan ng kasunod na kilos o saloobin at maayos na nag-uugnay sa pang-abay na parirala.
- source_word: γογγυσμοῦ
  choice: pagrereklamo
  rationale: Saklaw nito ang di-m nasisiyahang pagdaing o pagbulong-bulong habang nananatiling malinaw sa ordinaryong mambabasa. Ang “pagbulung-bulong” ay mas malapit sa tunog ng lihim na pagdaing ngunit maaaring maging mas makitid o di-gaanong natural sa pangungusap.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “kayo” upang maipakita na ang utos ay nakatuon sa buong pamayanan; nananatili ang kapwa-tumbasang diwa ng “isa’t isa.”
