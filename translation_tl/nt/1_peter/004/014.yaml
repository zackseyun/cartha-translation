base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: tl
  text: Kung nilalait kayo dahil sa pangalan ng Mesiyas[a], mapalad kayo, sapagkat ang Espiritu ng kaluwalhatian at ng Diyos[b] ay nananatili sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: Cristo; bilang titulo, nangangahulugang “ang Pinahiran.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang maluwalhating Espiritu ng Diyos”; o, “ang Espiritu ng kaluwalhatian, samakatuwid, ang Espiritu ng Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: nilalait kayo
  rationale: Ipinahahayag ng kasalukuyang balintiyak na anyo ang patuloy o aktuwal na pagdanas ng mapanirang pananalita at pagpapahiya. Likas at malinaw sa makabagong Filipino ang “nilalait.”
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: dahil sa pangalan ng Mesiyas
  rationale: Sa konteksto, ang ἐν ay nagpapahiwatig ng kaugnayan sa pangalan at pagkakakilanlan ng Mesiyas, na siyang dahilan ng paglalait. Iniiwasan ng “dahil sa” ang maling pahiwatig na ang paglalait ay isinagawa sa awtoridad ng Mesiyas.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito bilang titulo ang Χριστός. Pinananatili ng “Mesiyas” ang kahulugang “ang Pinahiran,” sa halip na ituring lamang itong personal na pangalan.
- source_word: μακάριοι
  choice: mapalad
  rationale: Ang “mapalad” ang likas at kinikilalang pananalita sa mga pahayag na tulad ng beatitude. Tumutukoy ito sa kalagayang kinalulugdan ng Diyos, hindi lamang sa pansariling saya.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: ang Espiritu ng kaluwalhatian at ng Diyos
  rationale: Pinananatili nito ang dalawang genitibong parirala ng Griyego nang hindi nagpapasiya kung magkatimbang ang mga ito o kung ang ikalawa ay paliwanag sa una.
- source_word: ἀναπαύεται
  choice: sumasainyo
  rationale: Likas sa Filipino ang “sumasainyo” para sa Espiritung nananatili o namamalagi sa mga tao. Naipahahayag nito ang diwang paglapag at pananatili ng ἀναπαύεται nang hindi gumagamit ng di-likas na “nagpapahinga sa ibabaw ninyo.”
theological_decisions:
- issue: Kung paano uunawain ang τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: ang Espiritu ng kaluwalhatian at ng Diyos
  alternative: ang maluwalhating Espiritu ng Diyos; o, ang Espiritu ng kaluwalhatian, samakatuwid, ang Espiritu ng Diyos
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang kayarian ng Griyego. Pinananatili ng pangunahing salin ang posibilidad na kapuwa naglalarawan sa Espiritu ang “ng kaluwalhatian” at “ng Diyos,” o na nililinaw ng ikalawa ang una.
- issue: Kung isasalin bilang titulo ang Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo sa konteksto ang kahulugan nito bilang titulo ng kinikilalang Pinahiran ng Diyos. Nililinaw ito ng “Mesiyas,” habang itinatala sa talababa ang mas tuwirang anyong “Cristo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilalait” at “sumasainyo” bilang karaniwang pananalita, samantalang pinanatili ang biblikal na bigat ng “Mesiyas,” “mapalad,” “Espiritu,” at “kaluwalhatian.”
