  naturalness: Makabago, malinaw, at marangal ang “nilalait kayo,” “mapalad kayo,” at “Espiritu ng kaluwalhatian at ng Diyos.” Ang “nananatili sa inyo” ay likas na Filipino at mas malapit sa pandiwang Griyego kaysa “sumasainyo,” nang hindi gumagamit ng di-likas na literalismong “nagpapahinga sa ibabaw ninyo.”
  terminology: Wasto ang “Mesiyas” para sa Χριστός bilang titulo at ang “mapalad” para sa μακάριοι. Pinananatili ng “Espiritu ng kaluwalhatian at ng Diyos” ang sinadyang kalabuan ng ugnayan ng dalawang genitive na parirala. Nilinaw nang bahagya ang talababa sa Mesiyas upang maging mas natural ang pahayag tungkol sa titulo.
