base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: tl
  text: Mananagot sila sa isang handang humatol sa mga buháy at mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang nakahandang humatol.” Literal na inilalarawan ng Griyego ang isang “may kahandaang humatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: sila
  rationale: Ang panghalip na kaugnay ay tumutukoy sa mga taong binanggit sa naunang talata. Natural sa Tagalog na simulan ang pangungusap sa “sila.”
- source_word: ἀποδώσουσιν λόγον
  choice: mananagot
  rationale: Ipinahihiwatig ng idyoma ang pagbibigay-sulit o pagsagot para sa sariling ginawa, lalo na sa kontekstong paghatol. Ang “mananagot” ay malinaw, natural, at nagpapanatili ng hudisyal na diwa.
- source_word: τῷ
  choice: sa isang
  rationale: Ginagamit ang artikulo kasama ng participle bilang pantukoy sa isang persona. Hindi nito tahasang pinapangalanan kung sino ang hukom.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: handang humatol
  rationale: Natural na katumbas ito ng paglalarawan sa isang nasa kalagayang handa nang humatol, nang hindi ginagawang mekanikal ang literal na anyong “may kahandaang humatol.”
- source_word: ζῶντας καὶ νεκρούς
  choice: sa mga buháy at mga patay
  rationale: Pinananatili nito ang maikli, malawak, at nakagawiang saklaw ng parirala. Nilagyan ng tuldik ang “buháy” upang malinaw ang bigkas at kahulugan.
theological_decisions:
- issue: Pagkakakilanlan ng handang humatol sa mga buháy at mga patay
  choice: Hindi tahasang pinangalanan; isinalin bilang “sa isang handang humatol.”
  alternative: Pangalanan bilang Diyos o bilang Mesiyas/Cristo.
  rationale: Hindi tahasang tinutukoy ng Griyego sa talatang ito kung sino ang hukom. Pinananatili ng salin ang hindi tahasang pagkakakilanlan at ang kaugnay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang maikli at matinding “mananagot” para sa hudisyal na idyoma, at iniwasang tahasang pangalanan ang hukom dahil hindi ito ginagawa ng mismong Griyego.
