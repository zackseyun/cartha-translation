  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: tl
  text: Higit sa lahat, panatilihin ninyo ang masidhing[a] pag-ibig sa isa’t isa, sapagkat tinatakpan ng pag-ibig ang napakaraming kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “taimtim” o “walang humpay.”
    reason: lexical_alternative
  - marker: b
    text: Umaalingawngaw rito ang Kawikaan 10:12. Ang “tinatakpan” ay maaari ring magpahiwatig ng hindi pagpapalaganap o pag-uungkat ng mga pagkakasala, ngunit pinananatili rito ang metapora ng orihinal.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Higit sa lahat
  rationale: Likas na pariralang Filipino na nagpapahayag ng pangunahing priyoridad, hindi lamang ng pagkakasunod-sunod sa panahon.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: ang pag-ibig ninyo sa isa’t isa
  rationale: Ipinahahayag nang malinaw ang pag-ibigang kapuwa at kapuwa sa loob ng pamayanan.
- source_word: ἐκτενῆ
  choice: masidhi
  rationale: Ipinapanatili ang diwa ng pag-ibig na matindi, taimtim, at patuloy na isinasabuhay nang hindi pinipili lamang ang isa sa mga posibleng himig ng salita.
- source_word: ἔχοντες
  choice: panatilihin ninyo
  rationale: Ang kasalukuyang participle ay nagpapatuloy sa himig ng mga tagubilin sa naunang konteksto; ang pautos na anyo ay malinaw at natural sa modernong Filipino.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na nagpapakilala sa dahilan ng tagubilin at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: καλύπτει
  choice: tinatakpan
  rationale: Pinananatili ang kongkretong metapora at ang alusyon sa Kawikaan 10:12, sa halip na limitahan ang kahulugan sa pagpapatawad, pagpapalampas, o pagkukubli.
- source_word: πλῆθος ἁμαρτιῶν
  choice: ang napakaraming kasalanan
  rationale: Natural na Filipino na nagpapanatili sa retorikal na bigat ng isang malaking bilang ng mga kasalanan.
theological_decisions:
- issue: Kahulugan ng “tinatakpan ng pag-ibig ang napakaraming kasalanan”
  choice: Panatilihin ang metaporang “tinatakpan” nang hindi tinutukoy kung kaninong mga kasalanan ang tinutukoy o kung anong eksaktong paraan ng pagtatakip ang nasasangkot.
  alternative: “pinalalampas ng pag-ibig ang maraming pagkakasala” o “nagdudulot ang pag-ibig ng kapatawaran sa maraming kasalanan”
  rationale: Ang Griyego ay kawikaan ang anyo at hindi nagtatakda ng iisang paliwanag. Ang pagpapanatili sa metapora ay umiiwas sa pagpasok ng doktrinang hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Ginamit ang “sa isa’t isa” para sa malinaw na ugnayang kapuwa at kapuwa, at iniwasan ang sobrang pormal o makalumang bokabularyo. Ang “sapagkat” ay bahagyang mataas ang rehistro ngunit karaniwan pa ring nauunawaan sa tekstong biblikal.
