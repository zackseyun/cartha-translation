id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: tl
  text: Kung may nagsasalita, magsalita siya gaya ng naghahayag ng mga pahayag ng Diyos[a]; kung may naglilingkod, maglingkod siya mula sa lakas na ipinagkakaloob ng Diyos[b], upang sa lahat ng bagay ay mabigyan ng kaluwalhatian ang Diyos sa pamamagitan ni Jesus na Mesiyas. Sa kanya ang kaluwalhatian at ang kapangyarihang maghari magpakailanman[c][d]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magsalita siyang gaya ng naghahayag ng mga orakulo ng Diyos.” Ang Griyegong λόγια ay tumutukoy sa mga banal na pahayag o kapahayagang mula sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “maglingkod siya gaya ng mula sa lakas na ipinagkakaloob ng Diyos.” Eliptikal ang Griyego; ipinahihiwatig ang paraan ng paglilingkod.
    reason: previous_rendering
  - marker: c
    text: Ang “sa kanya” ay pinakamalapit na tumutukoy kay Jesus na Mesiyas, ngunit inuunawa naman ng ilan na ang pagpupuri ay tumutukoy sa Diyos Ama dahil sa naunang sugnay.
    reason: alternative_reading
  - marker: d
    text: Sa literal, “sa mga kapanahunan ng mga kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: nagsasalita
  rationale: Likas at malawak na salin ito na hindi nililimitahan ang diwa sa pangangaral lamang.
- source_word: λόγια θεοῦ
  choice: mga salita ng Diyos
  rationale: Nauunawaan ito ng karaniwang mambabasa, samantalang ipinapaliwanag sa talababa na ang λόγια ay tumutukoy sa mga kapahayagan o pahayag na mula sa Diyos.
- source_word: διακονεῖ
  choice: naglilingkod
  rationale: Saklaw nito ang paglilingkod sa pangkalahatan at hindi ipinapalagay na isang pormal na katungkulan sa iglesya ang tinutukoy.
- source_word: ἐξ ἰσχύος
  choice: mula sa lakas
  rationale: Pinananatili ng “mula sa” ang diwa ng ἐξ na ang Diyos ang pinagmumulan ng kakayahang maglingkod.
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: na ipinagkakaloob ng Diyos
  rationale: Ang “ipinagkakaloob” ay natural at marangal na salin ng χορηγεῖ bilang pagbibigay o pagtustos.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak at sumasaklaw na diwa ng parirala.
- source_word: δοξάζηται
  choice: ay luwalhatiin
  rationale: Pinananatili ang balintiyak na tinig at ang layuning ipinakikilala ng ἵνα.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ipinapakita ng “Mesiyas” ang pantitulong gamit ng Χριστός, at natural sa Tagalog ang hulma na “Jesus na Mesiyas.”
- source_word: κράτος
  choice: kapangyarihang maghari
  rationale: Mas malinaw sa modernong Tagalog kaysa sa “paghahari” lamang ang doxological na diwa ng namamahalang kapangyarihan o dominion.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang natural na katumbas sa Tagalog ng idyomang nagsasaad ng walang hanggang panahon; nasa talababa ang mas literal na anyo.
theological_decisions:
- issue: Tinutukoy ng ᾧ (“sa kanya”) sa pangwakas na pagpupuri
  choice: Pinanatiling “Sa kanya,” na sa pinakamalapit na antecedent ay tumutukoy kay Jesus na Mesiyas.
  alternative: Maaaring unawain na tumutukoy ito sa Diyos Ama dahil ang naunang sugnay ay tungkol sa pagluwalhati sa Diyos.
  rationale: Pinapaboran ng lapit ng antecedent ang pagtukoy kay Jesus na Mesiyas, ngunit tunay na maaaring iugnay ng daloy ng pangungusap ang pagpupuri sa Diyos; kaya inilalahad ang alternatibo sa talababa.
- issue: Puwersa ng ὡς sa dalawang sugnay
  choice: 'Ginawang tahasang paghimok: “magsalita siya na parang…” at “maglingkod siya mula…”'
  alternative: 'Mas eliptikal: “kung may nagsasalita, gaya ng mga salita ng Diyos; kung may naglilingkod, gaya ng mula sa lakas…”'
  rationale: Eliptikal ang Griyego, ngunit kailangan sa natural na Tagalog ang pandiwang naghahayag ng paghimok. Hindi nito dinaragdagan ang nilalaman kundi inililinaw ang ipinahihiwatig ng sintaks.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkapares na “magsalita siya” at “maglingkod siya” upang maging natural ang eliptikal na paghihimok ng Griyego. Iniwasan ang teknikal o denominasyonal na bokabularyo; pinanatili ang “Mesiyas” bilang titulo at ang tunay na kalabuan ng panghalip sa pangwakas na pagpupuri.
