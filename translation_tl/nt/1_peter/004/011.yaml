revisions:
- from: Kung may nagsasalita, magsalita siya na parang naghahayag ng mga salita ng Diyos[a]; kung may naglilingkod, maglingkod siya mula sa lakas na ipinagkakaloob ng Diyos[b], upang sa lahat ng bagay ay luwalhatiin ang Diyos sa pamamagitan ni Jesus na Mesiyas. Sa kanya ang kaluwalhatian at ang kapangyarihang maghari magpakailanman[c][d]. Amen.
  to: Kung may nagsasalita, magsalita siya gaya ng naghahayag ng mga pahayag ng Diyos[a]; kung may naglilingkod, maglingkod siya mula sa lakas na ipinagkakaloob ng Diyos[b], upang sa lahat ng bagay ay mabigyan ng kaluwalhatian ang Diyos sa pamamagitan ni Jesus na Mesiyas. Sa kanya ang kaluwalhatian at ang kapangyarihang maghari magpakailanman[c][d]. Amen.
  rationale: Pinalitan ang unang paghihimok upang mas tumpak na maihatid ang λόγια θεοῦ at ang eliptikal na ὡς nang hindi ipinahihiwatig na ang nagsasalita ay nagpapanggap lamang na naghahayag. Pinahusay din ang balintiyak na layunin sa “mabigyan ng kaluwalhatian ang Diyos” at inayos ang kaugnay na talababa. Pinanatili ang kalabuan ng “Sa kanya” sa doxolohiya sa pamamagitan ng talababa.
