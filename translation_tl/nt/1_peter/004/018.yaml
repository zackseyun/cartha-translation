source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: tl
  text: At kung ang matuwid ay naliligtas nang may kahirapan[a], saan lilitaw ang walang paggalang sa Diyos at ang makasalanan?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahagya lamang naliligtas” o “hirap na hirap maligtas.” Sa konteksto, ang matuwid ay naliligtas sa gitna ng matinding pagsubok; hindi kinakailangang ipahiwatig na hindi tiyak ang kaligtasan mismo.
    reason: lexical_alternative
  - marker: b
    text: O “saan matatagpuan ang walang paggalang sa Diyos at ang makasalanan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: ang matuwid
  rationale: Pangngalang gamit ng pang-uri na may pantukoy at nasa isahang bilang. Pinananatili ng “ang matuwid” ang maikli at pangkalahatang anyo ng kasabihan.
- source_word: μόλις
  choice: nang may kahirapan
  rationale: Ipinahahayag ng μόλις ang kahirapan o pagiging bahagya lamang. Natural ito sa makabagong Tagalog at pinananatili ang diin sa hirap na kaakibat ng pagkaligtas nang hindi tahasang nagpapakahulugang hindi tiyak ang kaligtasan.
- source_word: σῴζεται
  choice: naliligtas
  rationale: Kasalukuyang anyong passive/middle ng σῴζω. Ang “naliligtas” ay tuwiran at angkop sa pangkalahatang pahayag, habang maaari ring magpahiwatig ng prosesong nagaganap sa gitna ng pagsubok.
- source_word: ἀσεβής
  choice: ang hindi kumikilala sa Diyos
  rationale: Ipinahahayag ang moral at panrelihiyong diwa ng taong walang paggalang o debosyon sa Diyos. Mas madaling maunawaan ito sa kasalukuyang Tagalog kaysa sa “lapastangan,” na maaaring magpahiwatig lalo na ng tahasang pag-insulto.
- source_word: ἁμαρτωλός
  choice: ang makasalanan
  rationale: Karaniwan at tumpak na katumbas. Pinanatiling hiwalay sa ἀσεβής dahil dalawang magkaugnay ngunit natatanging paglalarawan ang nasa Griyego.
- source_word: ποῦ
  choice: saan
  rationale: Tuwiran at natural na katumbas ng pang-abay na patanong, at pinananatili ang retorikal na lakas ng tanong.
- source_word: φανεῖται
  choice: lilitaw
  rationale: Ang hinaharap na anyo ng φαίνω ay nangangahulugang “lilitaw” o “makikita.” Pinananatili ng “lilitaw” ang larawan at pormal na tanong nang hindi dinaragdagan ng tahasang lugar o tagpo ng paghuhukom.
theological_decisions:
- issue: Diwa ng μόλις σῴζεται
  choice: Ang matuwid ay naliligtas nang may kahirapan, ayon sa konteksto ng pagdurusa at paghatol.
  alternative: Ang pangwakas na kaligtasan ng matuwid ay bahagya lamang o hindi tiyak.
  rationale: Ang malapit na konteksto ay tungkol sa pagdurusa, pagtitiis, at paghatol na nagsisimula sa sambahayan ng Diyos. Pinananatili ng salin ang tensiyon ng teksto ngunit hindi nagpapasok ng turo na likas na hindi tiyak ang pangwakas na kaligtasan.
- issue: Kinatawang isahang panlalaki
  choice: ang matuwid
  alternative: ang taong matuwid; ang mga matuwid
  rationale: Isahan at panlalaki ang anyong Griyego ngunit kinatawan nito ang isang pangkalahatang uri ng tao. Ang “ang matuwid” ay nagpapanatili sa isahan at sa maikling estilong kawikaan nang hindi nagdaragdag ng kasarian sa Tagalog.
- issue: Retorikal na puwersa ng ποῦ φανεῖται
  choice: saan lilitaw
  alternative: saan matatagpuan; ano ang sasapitin
  rationale: Pinananatili nito ang talinghaga at bukas na retorikal na tanong ng Griyego, sa halip na tahasang tukuyin ang kahihinatnan o tagpo ng paghatol.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Pinanatili ang maikli at retorikal na anyo ng kasabihan, pati ang pagkakaiba ng dalawang paglalarawan sa masama. Iniwasan ang mga salitang masyadong arkaiko at ang pagpapaliwanag sa loob mismo ng talata.
