  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: tl
  text: Ngunit kung nagdurusa siya bilang isang Kristiyano, huwag siyang mahiya; sa halip, luwalhatiin niya ang Diyos sa pangalang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal sa Griyego, “sa pangalang ito,” na malamang na tumutukoy sa pangalang “Kristiyano.” Maaari rin itong unawaing “dahil sa pangalang ito.” Sa ilang manuskrito, “sa bagay na ito” ang mababasa sa halip na “sa pangalang ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili nito ang kondisyon at ang banayad na pagsalungat ng δέ, habang natural sa makabagong Tagalog.
- source_word: ὡς Χριστιανός
  choice: bilang isang Kristiyano
  rationale: Ang Χριστιανός ay nakagawiang katawagan sa tagasunod ni Cristo. Ang “Kristiyano” ang malinaw at karaniwang katumbas nito sa Filipino.
- source_word: μὴ αἰσχυνέσθω
  choice: huwag siyang mahiya
  rationale: Tuwirang ipinahahayag nito ang pautos na nasa ikatlong panauhan at ang diwa ng αἰσχύνομαι.
- source_word: δοξαζέτω δὲ
  choice: sa halip, luwalhatiin niya
  rationale: Pinananatili ng “luwalhatiin” ang karaniwang kahulugan ng δοξάζω kapag Diyos ang layon; ipinakikita ng “sa halip” ang matinding kaibahan sa pagkahiya.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwirang salin ng layon ng pandiwang δοξαζέτω.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: sa pangalang ito
  rationale: Pinananatili nito ang literal at mahalagang ugnayan sa katawagang “Kristiyano,” nang hindi isinasara ang posibleng instrumental o sanhiing diwa ng ἐν.
- source_word: implicit πάσχω from context
  choice: nagdurusa siya
  rationale: Elliptical ang Griyego at nakasalalay sa pagdurusang binabanggit sa naunang talata. Kailangang ilantad ang pandiwa upang maging buo at natural ang sugnay sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng “sa pangalang ito” (ἐν τῷ ὀνόματι τούτῳ)
  choice: Pinananatili sa pangunahing teksto ang “sa pangalang ito,” na malamang na tumutukoy sa katawagang “Kristiyano.”
  alternative: Maaari rin itong unawaing “sa bagay na ito” o “dahil sa pangalang ito.”
  rationale: Ang pinakamalapit na tinutukoy ay Χριστιανός, at karaniwang nangangahulugang pangalan o katawagan ang ὄνομα. Gayunman, hindi lubusang tinatanggal ng Griyego ang mas maluwag o sanhiing pagkaunawa, kaya inilalahad ang mga iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kristiyano” bilang karaniwang katawagan, at idinagdag ang ipinahihiwatig na “nagdurusa” mula sa malapit na konteksto upang maging likas at ganap ang pangungusap sa Tagalog.
