id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: tl
  text: Ngunit magalak kayo sa abot ng pakikibahagi ninyo sa mga pagdurusa ng Mesiyas[a], upang sa paghahayag[b] ng kanyang kaluwalhatian ay magalak din kayo nang may matinding kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: O “pagbubunyag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Pinananatili ang malinaw na pagsalungat sa naunang diwa nang hindi dinaragdagan ang teksto.
- source_word: καθὸ
  choice: ayon sa lawak ng
  rationale: Ipinahahayag ang proporsiyonal na puwersa ng salita, hindi lamang ang temporal na diwang maaaring ipahiwatig ng “habang.”
- source_word: κοινωνεῖτε
  choice: pakikibahagi ninyo sa
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng aktuwal na pakikibahagi, hindi lamang pakikiramay.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: mga pagdurusa ng Mesiyas
  rationale: Pinananatili ang genitibong ugnayan at ang sadyang hindi tiyak na saklaw ng pakikibahagi sa mga pagdurusang kaugnay ng Mesiyas.
- source_word: χαίρετε
  choice: magalak kayo
  rationale: Tuwirang pautos na may marangal ngunit pangkaraniwang himig.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikita ang layunin o bungang kaugnayan ng kasunod na sugnay.
- source_word: ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ
  choice: kapag nahayag ang kanyang kaluwalhatian
  rationale: Likas na pariralang Tagalog na ipinahahayag ang hinaharap na pagbubunyag ng kanyang kaluwalhatian, bagaman ginawang pandiwa ang pangngalang Griyego.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: magalak din kayo at lubos na magsaya
  rationale: Pinananatili ang pag-uulit ng salitang-ugat para sa galak at ang pinaigting na diwa ng ἀγαλλιάω sa natural na Tagalog.
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit dito ang Χριστός bilang titulong tumutukoy sa pinahiran at ipinangakong hari; pinananatili ng “Mesiyas” ang kahulugang iyon. Inilalagay sa talababa ang tradisyonal na “Cristo.”
- issue: Kalikasan ng pakikibahagi sa mga pagdurusa ng Mesiyas
  choice: pakikibahagi ... sa mga pagdurusa ng Mesiyas
  alternative: pagdurusa para sa Mesiyas
  rationale: Hindi nililinaw ng salin kung ang mga ito ay pagdurusang kasama niya, dahil sa kaugnayan sa kanya, o kaugnay ng kanyang sariling mga pagdurusa. Sa gayon, hindi ipinapasok sa teksto ang isang tiyak na paliwanag na teolohikal.
- issue: Ugnayan ng kasalukuyan at hinaharap na kagalakan
  choice: magalak ... upang magalak din ... kapag nahayag ang kanyang kaluwalhatian
  alternative: magalak ... sapagkat magagalak din kayo
  rationale: Pinananatili ang ἵνα bilang layunin o bunga at ang tensiyon sa pagitan ng kasalukuyang utos at ng kagalakan sa hinaharap na paghahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ayon sa lawak ng” upang mapanatili ang proporsiyonal na diwa ng καθὸ, kahit bahagyang mas pormal ito kaysa sa karaniwang pananalita. Iniwasan ang teknikal o denominasyonal na pagpapaliwanag sa pakikibahagi sa mga pagdurusa.
