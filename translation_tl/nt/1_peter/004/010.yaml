  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: tl
  text: Gamitin ng bawat isa ang kaloob na natanggap niya sa paglilingkod sa isa’t isa[a], bilang mabubuting katiwala ng sari-saring biyaya ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa inyong magkakasamahan” o “para sa isa’t isa.”
    reason: Pinananatili ang mga posibleng salin ng εἰς ἑαυτούς, na tumutukoy sa pamayanan bilang saklaw at mga nakikinabang sa paglilingkod.
lexical_decisions:
- source_word: ἕκαστος
  choice: bawat isa
  rationale: Pinananatili ang distributibong diin na tumutukoy sa bawat miyembro nang paisa-isa.
- source_word: καθὼς ἔλαβεν
  choice: ayon sa ... tinanggap
  rationale: Ipinahahayag ang pagtutugma ng natanggap na kaloob at ng paglilingkod; natural ito sa modernong Tagalog nang hindi tahasang idinaragdag kung sino ang nagbigay.
- source_word: χάρισμα
  choice: kaloob
  rationale: Malinaw at malawak ang 'kaloob' at hindi nito pinakikitid ang salita sa teknikal na kahulugang 'kaloob na espirituwal.'
- source_word: εἰς ἑαυτοὺς
  choice: sa isa’t isa
  rationale: Ipinakikita ang kapuwa mananampalataya bilang mga pinaglilingkuran at likas itong pakinggan sa Tagalog.
- source_word: αὐτὸ διακονοῦντες
  choice: gamitin ninyo ito sa paglilingkod
  rationale: Inilalahad sa natural na Tagalog ang eksortatibong lakas ng participle at malinaw na iniuugnay ang panghalip sa kaloob.
- source_word: καλοὶ οἰκονόμοι
  choice: mabubuting katiwala
  rationale: Pinananatili ng 'katiwala' ang diwa ng ipinagkatiwalang yaman at pananagutan sa may-ari.
- source_word: ποικίλης χάριτος θεοῦ
  choice: sari-saring biyaya ng Diyos
  rationale: Ang 'sari-sari' ay malinaw at kasalukuyang pananalita para sa maraming anyo ng biyaya, habang pinananatili ang genitibong kaugnayan sa Diyos.
theological_decisions:
- issue: Kung gagawing teknikal na 'kaloob na espirituwal' ang χάρισμα
  choice: kaloob
  alternative: kaloob na espirituwal; kaloob ng biyaya
  rationale: Hindi hinihingi ng mismong pangngalan ang mas makitid na teknikal na kahulugan; sapat na ipinahihiwatig ng konteksto at ng 'biyaya ng Diyos' ang pinagmulan nito.
- issue: Kung paano ihahayag ang komunal na puwersa ng εἰς ἑαυτούς
  choice: sa isa’t isa
  alternative: sa inyong magkakasamahan; para sa isa’t isa
  rationale: Natural sa Tagalog ang 'sa isa’t isa' at saklaw nito ang kapuwa direksiyon at pakinabang ng paglilingkod nang hindi nagdaragdag ng denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang pangmaramihang 'ninyo' upang likas na maipahayag ang panawagan sa buong pamayanan.
