  to: Gamitin ng bawat isa ang kaloob na natanggap niya sa paglilingkod sa isa’t isa[a], bilang mabubuting katiwala ng sari-saring biyaya ng Diyos.
  rationale: Inayos ang unang sugnay upang malinaw na bawat indibidwal ay dapat gumamit ng kaloob na kaniya mismong natanggap, nang hindi idinaragdag ang nagbibigay ng kaloob o nililimitahan ang kahulugan nito. Pinanatili ang mga pangunahing terminong tumpak sa Griyego at ang modernong, marangal na rehistro.
