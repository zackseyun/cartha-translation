id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: tl
  text: upang sa nalalabi niyang panahon sa katawang ito[a] ay mamuhay siya, hindi na ayon sa mga pagnanasa ng tao kundi ayon sa kalooban ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa laman.” Dito, tumutukoy ito sa buhay ng tao sa katawan sa mundong ito, hindi kinakailangang sa “makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: upang
  rationale: Ipinapahayag ng pang-ukol at articular infinitive ang layunin o bunga kaugnay ng naunang talata; likas na ipinahihiwatig ito ng “upang” sa Tagalog.
- source_word: μηκέτι
  choice: hindi na
  rationale: Malinaw nitong ipinapahayag ang pagtigil sa dating paraan ng pamumuhay.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: ayon sa mga pagnanasa ng tao
  rationale: Ang “tao” ay panlahatan at hindi limitado sa mga lalaki. Pinananatili ng “mga pagnanasa” ang malawak na saklaw ng ἐπιθυμίαις, sa halip na paliitin ito sa seksuwal na pagnanasa lamang.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: kundi ayon sa kalooban ng Diyos
  rationale: Pinananatili ng “kundi” ang matinding pagsalungat, at ipinakikita ng “ayon sa” na ang kalooban ng Diyos ang pamantayan at patnubay ng pamumuhay.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: sa nalalabi niyang panahon
  rationale: Likas ito sa Tagalog at pinananatili ang pansariling singular na diwa mula sa konteksto, nang hindi nagtatakda ng kasarian.
- source_word: ἐν σαρκὶ
  choice: sa katawang ito
  rationale: Sa kontekstong ito, ang σάρξ ay tumutukoy sa natitirang buhay ng tao sa katawan sa mundong ito, hindi tahasang sa isang “makasalanang kalikasan.” Ang “katawang ito” ay malinaw sa karaniwang mambabasa, habang inilalahad sa talababa ang literal na anyo.
- source_word: βιῶσαι
  choice: mamuhay siya
  rationale: Tuwirang ipinapahayag nito ang pamumuhay o paggugol ng natitirang buhay, at natural itong umaangkop sa inayos na sintaks ng Tagalog.
theological_decisions:
- issue: Kahulugan ng σάρξ sa ἐν σαρκὶ
  choice: buhay sa katawan sa mundong ito (“sa katawang ito”)
  alternative: “sa laman,” na maaaring mapagkamalang tumutukoy sa makasalanang kalikasan
  rationale: Ang parirala ay tumutukoy sa nalalabing mortal at makatawang buhay. Bagaman ang konteksto ay naghahambing ng dating makasalanang asal at pagsunod sa Diyos, hindi kailangang ipakahulugan ang σάρξ dito bilang panloob na makasalanang prinsipyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Inayos ang ayos ng mga parirala upang maging natural sa Filipino habang pinananatili ang layunin, pagsalungat, at teolohikal na tensiyon ng Griyego.
