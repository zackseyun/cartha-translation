  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: tl
  text: Kaya nga, yamang nagdusa ang Mesiyas[a] sa laman[b], sandatahan din ninyo ang inyong sarili ng gayunding kaisipan, sapagkat ang nagdusa sa laman ay tumigil na sa kasalanan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Cristo” para sa “Mesiyas” (Griyego: Christos). Pinanatili rito ang diwa nito bilang titulo.'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa laman” ay literal na salin ng Griyegong sarx. Dito, tumutukoy ito sa pisikal na pag-iral bilang tao, hindi kinakailangang sa “makasalanang kalikasan.”
    reason: lexical_alternative
  - marker: c
    text: Pinagtatalunan ang kahulugan ng “ang nagdusa sa laman ay tumigil na sa kasalanan.” Maaaring tumukoy ito partikular sa Mesiyas, sa mga mananampalatayang sumusunod sa kaniyang huwaran, o sa pangkalahatang simulain ng tiyak na pagtalikod sa kasalanan.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: ang Mesiyas
  rationale: Pinanatili ang diwa ng Χριστός bilang titulo. Ang “Mesiyas” ay malinaw at likas sa modernong Filipino; inilagay sa talababa ang tradisyonal na “Cristo.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahahayag nito ang paghihinuha mula sa naunang konteksto sa maikli at natural na Filipino.
- source_word: παθόντος
  choice: yamang nagdusa
  rationale: Isinalin ang aorist participle bilang sugnay na may sabayang temporal at sanhiing diwa, nang hindi nagiging alanganin ang pangungusap.
- source_word: σαρκὶ
  choice: sa laman
  rationale: Pinanatili ang kongkretong salita at ang pag-uulit ng Griyego. Nililinaw ng talababa na tumutukoy ito sa pisikal na pag-iral bilang tao, hindi awtomatikong sa “makasalanang kalikasan.”
- source_word: ἔννοιαν
  choice: pag-iisip
  rationale: Sinasaklaw nito ang disposisyon, pananaw, o layunin ng isip nang hindi pinipili nang labis ang isa lamang sa mga posibleng diwa.
- source_word: ὁπλίσασθε
  choice: sandatahan din ninyo ang inyong sarili
  rationale: Pinananatili ang matingkad na metaporang militar at ang reflexive na lakas ng middle imperative.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang kasunod na pahayag ang batayan ng utos, habang nananatiling marangal ang himig.
- source_word: ὁ παθὼν
  choice: ang nagdusa
  rationale: Pinananatili ang maigsi at pangkalahatang anyo ng substantival participle, nang hindi tahasang tinutukoy kung ang Mesiyas lamang o ang mga mananampalataya ang tinutukoy.
- source_word: πέπαυται
  choice: ay tumigil na
  rationale: Ipinahahayag ang naganap na paghinto at ang resultang kalagayan ng perfect form sa natural na Filipino.
- source_word: ἁμαρτίας
  choice: sa kasalanan
  rationale: Pinananatili ang isahan at ang diwa ng paghiwalay o pagtigil mula sa kasalanan bilang gawain, saklaw, o kapangyarihan.
theological_decisions:
- issue: Ang tinutukoy at saklaw ng “ang nagdusa sa laman ay tumigil na sa kasalanan”
  choice: Pinanatili ang malawak at siksik na pahayag nang hindi tinutukoy kung eksklusibo itong tumutukoy sa Mesiyas, sa mga mananampalatayang sumusunod sa kaniyang huwaran, o sa isang pangkalahatang simulain.
  alternative: Maaaring tumukoy ito partikular sa Mesiyas; sa mga mananampalatayang dumaranas ng hirap at pumuputol sa paghahari ng kasalanan; o sa paghihirap bilang tanda ng isang tiyak na pagtalikod sa makasalanang pamumuhay.
  rationale: Hindi tahasang nilulutas ng Griyego ang pinagtatalunang reperente at aplikasyon. Kaya hindi nagdagdag ang salin ng paliwanag sa pangunahing teksto; inilagay sa talababa ang mahahalagang posibilidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “sandatahan,” ang pag-uulit ng “sa laman,” at ang siksik na teolohikal na pahayag. Iniwasan ang mga salitang magpapasya nang hindi kinakailangan sa pinagtatalunang reperente ng huling sugnay.
