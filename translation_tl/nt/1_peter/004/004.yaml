  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: tl
  text: Sa bagay na ito[a], nagtataka sila na hindi kayo nakikisabay sa kanila sa gayon ding pag-apaw ng walang habas na pamumuhay[b], at nilalait nila kayo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dahil dito” o “Sa bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa gayon ding pagbuhos o pag-apaw ng walang habas na pamumuhay.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sinisiraan nila kayo” o “pinagsasalitaan nila kayo nang masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dito
  rationale: Iniuugnay nito ang reaksiyon nila sa naunang binanggit na pagbabago ng pamumuhay, nang hindi pinatitindi ang ugnayan bilang tahasang sanhi.
- source_word: ξενίζονται
  choice: sila nagtataka
  rationale: Likas sa modernong Tagalog at naipahahayag ang diwa ng pagkagulat o pagtinging kakatwa.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: dahil hindi na kayo nakikisabay sa kanila
  rationale: Ipinahahayag ang hindi na pakikibahagi sa kilos ng grupo. Ang “na” ay likas sa konteksto ng dating pamumuhay na tinalikuran, bagaman ipinahihiwatig lamang ito ng konteksto.
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: sa gayunding rumaragasang agos ng walang habas na pamumuhay
  rationale: Pinananatili ng “agos” ang larawan ng ἀνάχυσις bilang pagbuhos o pag-apaw, samantalang ipinakikita ng “rumaragasang” ang labis at mapanulak na katangian nito. Ang “walang habas na pamumuhay” ay malinaw na salin ng asal na magastos, walang pagpipigil, at imoral.
- source_word: βλασφημοῦντες
  choice: kaya nilalait nila kayo
  rationale: Sa konteksto, ang mapanirang pananalita ay nakatuon sa mga mananampalataya. Ang “nilalait” ay natural at hindi nagmumungkahi na ang Diyos ang tuwirang pinupuntirya.
theological_decisions:
- issue: Tinutukoy ng βλασφημοῦντες na mapanirang pananalita
  choice: paglalait na nakatuon sa mga mananampalataya
  alternative: pamumusong laban sa Diyos, o pangkalahatang pagsasalita ng masama
  rationale: Ang agarang konteksto ay reaksiyon ng mga dating kasamahan sa nagbagong asal ng mga mananampalataya. Ang “namumusong” ay maaaring maling ipakahulugang laban lamang sa Diyos.
- issue: Ugnayan ng participle na βλασφημοῦντες sa pangunahing pandiwa
  choice: kaya nilalait nila kayo
  alternative: habang nilalait nila kayo
  rationale: Ang “kaya” ay natural na naghahayag ng bunga sa konteksto, ngunit hindi nito ginagawang hiwalay na pangunahing pangungusap ang participle. Nananatiling malapit ang paglalait sa kanilang pagtataka.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding larawang tubig ng ἀνάχυσις sa pamamagitan ng “rumaragasang agos,” habang iniwasan ang masyadong teknikal o makalumang bokabularyo.
