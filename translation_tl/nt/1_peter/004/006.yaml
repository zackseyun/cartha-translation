reference: 1 Peter 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: tl
  text: 'Sapagkat ito ang dahilan kung bakit ipinahayag din ang mabuting balita sa mga patay: upang, bagaman hinatulan sila ayon sa pamantayan ng tao sa laman[a], mabuhay sila ayon sa Diyos sa espiritu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “ayon sa mga tao sa laman.” Maaari ring unawain na “ayon sa pamantayan ng tao habang nasa laman.” Ang parirala ay maaaring tumukoy sa pananaw o pamantayan ng tao.
    reason: lexical_alternative
  - marker: b
    text: O “sa Espiritu.” Maaaring tumukoy ang parirala sa larangan ng espirituwal na buhay, bilang kabaligtaran ng “sa laman”; inuunawa naman ito ng ilan bilang buhay sa pamamagitan ng Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ito ang dahilan kung bakit
  rationale: Likas na pariralang Filipino na nagpapanatili sa paliwanag na puwersa ng pananalita at tumutukoy sa layuning kasunod.
- source_word: νεκροῖς
  choice: sa mga patay
  rationale: Pang-uring datibo na ginamit bilang pangngalan; neutral ito tungkol sa pinagtatalunang pagkakakilanlan at kalagayan ng mga patay.
- source_word: εὐηγγελίσθη
  choice: ipinahayag ... ang magandang balita
  rationale: Pinananatili ang pasibong tinig at ang kahulugan ng pagpapahayag ng mabuting balita sa natural na modernong Filipino.
- source_word: ἵνα
  choice: upang
  rationale: Karaniwang panandang Filipino para sa layunin o nilalayong kinalabasan.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: bagaman hinatulan sila ... mabuhay sila
  rationale: Ipinahahayag ng concessive na 'bagaman' ang μὲν...δὲ na pagsalungat sa natural na Filipino, habang pinananatili ang pasibong kahulugan ng κριθῶσι at ang subjunctive na kinalabasan ng ζῶσι.
- source_word: κατὰ ἀνθρώπους
  choice: ayon sa mga tao
  rationale: Pinananatili ang literal na pamantayan o pananaw at ang tuwirang pagsalungat sa 'ayon sa Diyos,' nang hindi nililimitahan ang ἀνθρώπους sa mga lalaki.
- source_word: σαρκὶ
  choice: sa laman
  rationale: Pinananatili ang konkretong salitang 'laman' at ang pagtutulad nito sa πνεύματι; hindi ipinapasok ang interpretasyong 'makasalanang kalikasan.'
- source_word: κατὰ θεὸν
  choice: ayon sa Diyos
  rationale: Pinananatili ang sadyang parallel at teolohikal na tensiyon sa 'ayon sa mga tao.'
- source_word: πνεύματι
  choice: sa espiritu
  rationale: Pinananatili ang datibo ng larangan at ang pagiging malabo kung tumutukoy ito sa espirituwal na larangan ng buhay o mas tiyak sa Espiritu.
theological_decisions:
- issue: Pagkakakilanlan ng “mga patay”
  choice: Isinalin nang neutral bilang “mga patay,” nang hindi tinutukoy kung kailan o sa anong diwa sila patay nang ipahayag ang magandang balita.
  alternative: Maaaring unawain bilang mga patay na ngayon ngunit nakarinig habang nabubuhay, mga patay sa espirituwal na diwa, o mga patay na inuugnay sa 3:19.
  rationale: Hindi nilulutas ng mismong talata ang matagal nang pinagtatalunang pagkakakilanlan; pinananatili ng salin ang tunay na kalabuan ng Griyego.
- issue: “Hinatulan ... sa laman” at “mabuhay ... sa espiritu”
  choice: Pinanatili ang magkatapat na mga parirala nang hindi tinutukoy kung ang paghatol ay paghatol ng tao, pisikal na kamatayan, o paghatol sa larangan ng buhay-tao.
  alternative: Maaaring tumukoy sa paghatol ayon sa pamantayan ng tao habang nasa katawan, sa pagkamatay na sinasapit ng tao, o sa paghatol sa laman na kasabay ng espirituwal na buhay.
  rationale: Nagpapahintulot ang sintaks at mga salitang Griyego ng magkakaugnay ngunit magkakaibang pagbasa; hindi dapat magpasok ang salin ng isang tiyak na paliwanag.
- issue: Pagkakakilanlan ng πνεύματι
  choice: “sa espiritu,” na may maliit na titik at may talababa.
  alternative: “sa Espiritu,” kung ang tinutukoy ay ang Banal na Espiritu.
  rationale: Hindi tahasang tinutukoy ng teksto ang Banal na Espiritu; mas ligtas na panatilihin sa pangunahing teksto ang parallel na 'sa laman ... sa espiritu' at ilahad ang ibang pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “magandang balita” para sa εὐαγγελίζω, “laman” para mapanatili ang leksikal at retorikal na contrast, at mga neutral na parirala upang hindi lutasin sa salin ang mga pinagtatalunang interpretasyon.
