  to: Kaya, ipagkatiwala rin ng mga nagdurusa ayon sa kalooban ng Diyos ang kanilang sarili[a] sa tapat na Manlilikha sa paggawa ng mabuti.
  rationale: Pinalitan ang “habang gumagawa sila ng mabuti” ng “sa paggawa ng mabuti” upang mas tapat na maipahayag ang ἐν ἀγαθοποιΐᾳ nang hindi nililimitahan ito sa isang tahasang temporal na ugnayan. Inayos din ang pagkakasunod ng mga salita upang maging mas tuwiran ang pautos sa modernong Tagalog. Pinanatili ang lahat ng iba pang wastong pagpili, pati ang talababa para sa ψυχή.
