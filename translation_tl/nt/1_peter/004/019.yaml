  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: tl
  text: Kaya, ipagkatiwala rin ng mga nagdurusa ayon sa kalooban ng Diyos ang kanilang sarili[a] sa tapat na Manlilikha sa paggawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang buhay” o “ang kanilang mga kaluluwa”; maaaring tumukoy ang salitang Griyego sa sarili, buhay, o kaluluwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Nagpapahayag ito ng kongklusyong hinango mula sa naunang pangangatwiran; likas at malinaw ang “Kaya” sa makabagong Tagalog.
- source_word: οἱ πάσχοντες
  choice: ang mga nagdurusa
  rationale: Pinananatili nito ang pangkalahatang pagtukoy sa mga taong dumaranas ng paghihirap.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: ayon sa kalooban ng Diyos
  rationale: Tuwirang ipinapahayag ang pag-ayon sa kalooban ng Diyos nang hindi nililinaw kung ang paghihirap ay pahintulot, pagtatakda, o ibang anyo ng pagkilos ng Diyos.
- source_word: πιστῷ κτίστῃ
  choice: sa tapat na Manlilikha
  rationale: Ipinahihiwatig ng “tapat” na maaasahan ang Diyos, at natural na titulo sa Tagalog ang “Manlilikha.”
- source_word: παρατιθέσθωσαν
  choice: ipagkatiwala
  rationale: Naghahatid ito ng diwa ng paglalagak ng sarili sa pangangalaga ng isang mapagkakatiwalaan at angkop sa pautos na anyo ng Griyego.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: ang kanilang sarili
  rationale: Sa kontekstong ito, maaaring tumukoy ang ψυχή sa buong sarili o buhay, hindi lamang sa isang hiwalay na di-materyal na bahagi. Mas natural sa Tagalog ang “kanilang sarili,” habang inilalahad sa talababa ang ibang posibleng salin.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: habang gumagawa sila ng mabuti
  rationale: Malinaw nitong ipinakikitang nagpapatuloy ang paggawa ng mabuti kasabay ng pagtitiwala sa Diyos.
theological_decisions:
- issue: Ugnayan ng pagdurusa at ng kalooban ng Diyos
  choice: ayon sa kalooban ng Diyos
  alternative: dahil sa kalooban ng Diyos
  rationale: Pinananatili ng “ayon sa” ang lawak at tensiyon ng κατά nang hindi ipinapalagay kung paanong nauugnay ang pagdurusa sa kalooban ng Diyos.
- issue: Kahulugan ng ψυχή sa konteksto
  choice: ang kanilang sarili
  alternative: ang kanilang mga kaluluwa; ang kanilang buhay
  rationale: Maaaring saklawin ng ψυχή ang sarili, buhay, o kaluluwa. Ang “sarili” ay natural at holistiko sa Tagalog; pinananatili ng talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Manlilikha” bilang titulo at ang inklusibong panghalip na “kanilang” ayon sa pangmaramihang paksa. Iniwasan ang pagpapaliwanag ng tiyak na mekanismo ng kalooban ng Diyos sa pagdurusa.
