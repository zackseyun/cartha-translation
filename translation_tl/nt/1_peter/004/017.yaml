id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: tl
  text: Sapagkat panahon na upang magsimula ang paghatol mula sa sambahayan ng Diyos[a]. At kung magsisimula muna ito mula sa atin, ano ang kahihinatnan[b] ng mga sumusuway[c] sa ebanghelyo ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahay ng Diyos.” Ang salitang Griyego ay maaaring mangahulugang “bahay” o “sambahayan”; dito, malamang na tumutukoy ito sa bayan ng Diyos bilang Kanyang sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “wakas.” Ang salitang Griyego ay maaaring mangahulugang “wakas,” “kahihinatnan,” o “resulta.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga tumatangging maniwala.” Ang pandiwang Griyego ay maaaring tumukoy kapuwa sa pagsuway at sa hindi paniniwala bilang tugon sa ebanghelyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ng pang-ugnay na ang talata ay nagbibigay ng dahilan kaugnay ng naunang pahayag; natural at malinaw ang “Sapagkat” sa Filipino.
- source_word: ὁ καιρός
  choice: dumating na ang panahon
  rationale: Ang καιρός ay tumutukoy sa angkop o itinakdang panahon. Ipinahihiwatig ng konteksto at ng kasalukuyang diwa ng sugnay na sumapit na ang panahong iyon.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: upang magsimula ang paghatol
  rationale: Pinananatili nito ang diwa ng articular infinitive kasunod ng καιρός at ang malawak na saklaw ng κρίμα bilang paghahatol, hindi lamang hatol na kaparusahan.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: sa sambahayan ng Diyos
  rationale: Ang οἶκος dito ay tumutukoy sa sambayanan ng Diyos, gaya ng nililinaw ng kasunod na “sa atin.” Ang “sa” ay natural sa Filipino sa pariralang “magsimula sa,” habang taglay pa rin ang panimulang puntong ipinahahayag ng ἀπό.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: At kung magsisimula muna ito sa atin
  rationale: Inuulit ang pandiwang “magsisimula” mula sa unang sugnay para sa linaw. Ang “muna” ay natural na naghahatid sa πρῶτον, at ang “sa atin” ay nagpapanatili sa inuulit na ἀπό.
- source_word: τέλος
  choice: kahihinatnan
  rationale: Saklaw nito ang diwang wakas, resulta, o kalalabasan nang hindi nililimitahan ang salita sa simpleng pagtatapos sa panahon.
- source_word: ἀπειθούντων
  choice: mga hindi sumusunod
  rationale: Pinananatili nito ang pangunahing diwa ng pagsuway, ngunit ang pandiwang Griyego sa kaugnayan nito sa ebanghelyo ay maaari ring magpahiwatig ng pagtangging maniwala; inilalahad ang alternatibong iyon sa talababa.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: sa ebanghelyo ng Diyos
  rationale: Pinananatili ang tradisyonal ngunit nauunawaang “ebanghelyo” at ang genitibong maaaring magpahayag na ito ay mula sa Diyos o nauukol sa kanya.
theological_decisions:
- issue: Kalikasan ng κρίμα kaugnay ng sambahayan ng Diyos
  choice: paghatol
  alternative: pagkondena; pagdidisiplina
  rationale: 'Hindi tinutukoy ng salin kung ito ay pagkondena o pagdidisiplina lamang. Sa gayon, nananatili ang bigat at tensiyon ng teksto: nagsisimula ang mapanuring paghatol ng Diyos sa sarili niyang sambahayan, ngunit mas mabigat ang ipinahihiwatig na kahihinatnan ng mga hindi sumusunod sa ebanghelyo.'
- issue: Tinutukoy ng οἶκος τοῦ θεοῦ
  choice: sambahayan ng Diyos, ibig sabihin ay ang kanyang mga tao
  alternative: bahay o templo ng Diyos bilang gusali
  rationale: Ang kasunod na “sa atin” ay nagpapakitang mga tao ang tinutukoy, at kaayon ito ng paglalarawan sa mga mananampalataya bilang espirituwal na bahay sa 1 Pedro 2:5.
- issue: Ugnayan ng pagsuway at kawalan ng pananampalataya sa ἀπειθέω
  choice: mga hindi sumusunod
  alternative: mga tumatangging maniwala
  rationale: Hindi pinaghihiwalay ng salin ang moral na pagsuway at ang pagtanggi sa pananampalataya. Pinananatili sa pangunahing teksto ang diwa ng pagsuway at itinatala sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na may marangal at madaling maunawaang himig. Ginamit ang “sambahayan” upang malinaw na tumukoy sa komunidad, “paghatol” upang mapanatili ang teolohikal na tensiyon, at “ebanghelyo” bilang karaniwan at kinikilalang terminong biblikal. Inayos ang mga marker ayon sa pagkakasunod ng paglitaw sa teksto.
