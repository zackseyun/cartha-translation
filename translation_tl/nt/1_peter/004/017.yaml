  naturalness: Natural at marangal sa modernong Filipino ang “Sapagkat panahon na upang magsimula ang paghatol mula sa sambahayan ng Diyos.” Mas malinaw at mas tapat ang “mga sumusuway sa ebanghelyo” kaysa sa mas pangkalahatang “mga hindi sumusunod.”
  terminology: Pinananatili ang “paghatol,” “sambahayan ng Diyos,” “kahihinatnan,” at “ebanghelyo ng Diyos.” Ang “paghatol” ay hindi nililimitahan sa pagkondena o pagdidisiplina.
