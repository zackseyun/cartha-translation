revisions:
- from: Sapagkat dumating na ang panahon upang magsimula ang paghatol sa sambahayan ng Diyos[a]. At kung magsisimula muna ito sa atin, ano ang kahihinatnan[b] ng mga hindi sumusunod[c] sa ebanghelyo ng Diyos?
  to: Sapagkat panahon na upang magsimula ang paghatol mula sa sambahayan ng Diyos[a]. At kung magsisimula muna ito mula sa atin, ano ang kahihinatnan[b] ng mga sumusuway[c] sa ebanghelyo ng Diyos?
  rationale: Inalis ang di-tahasang “dumating na,” isinalin ang dalawang ἀπό bilang “mula sa,” at ginawang “mga sumusuway” ang ἀπειθούντων para sa mas tumpak na pandiwang diwa. Pinananatili ng lahat ng pagbabago ang bukas na saklaw ng κρίμα at τέλος at ang lehitimong semantikong kaugnayan ng pagsuway at kawalan ng pananampalataya sa talababa.
