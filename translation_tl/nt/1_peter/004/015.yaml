  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: isang pagbabawal laban sa pagdurusang kaugnay ng pagpatay, pagnanakaw, paggawa ng masama, o mapanghimasok na pakikialam. Gayunman, ang ὡς ay mas tuwirang minamarkahan ng “bilang” kaysa “dahil siya ay”; ang huli ay maaaring magpahiwatig ng mas tahasang sanhi kaysa sa pagkakakilanlan o katayuang ipinahihiwatig ng Griyego.'
  naturalness: Malinaw at modernong Filipino ang draft. Mas maayos at matipid ang paralelong talaan sa paggamit ng “bilang” sa una at huling aytem, at ang “isang nakikialam” ay nagpapanatili ng pagiging tao/ahente ng huling pangngalan.
  terminology: Ang “mamamatay-tao,” “magnanakaw,” at “gumagawa ng masama” ay angkop. Ang “nakikialam sa mga gawain ng iba” ay isang ligtas na pagsasalin ng bihirang ἀλλοτριεπίσκοπος. Inayos ang talababa upang huwag ipakitang tiyak ang isang sobrang-makitid na literal na pagpapakahulugan sa bihirang tambalang ito.
