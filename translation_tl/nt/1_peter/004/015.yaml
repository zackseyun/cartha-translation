  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: tl
  text: Sapagkat huwag magdusa ang sinuman sa inyo bilang mamamatay-tao, magnanakaw, gumagawa ng masama, o bilang isang nakikialam sa mga gawain ng iba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapanghimasok” o “nakikialam sa mga bagay na hindi kanya”; mas literal, “tagapangasiwa ng mga bagay ng iba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν πασχέτω
  choice: Sapagkat huwag magdusa ang sinuman sa inyo
  rationale: Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa konteksto. Ang “huwag ... ang sinuman sa inyo” ay likas na Filipino para sa ipinagbabawal ng μὴ at προστακτική na πασχέτω, habang nananatili ang indibiduwal na diwa ng τις ὑμῶν.
- source_word: ὡς
  choice: dahil siya ay
  rationale: Sa talaang ito, ipinakikita ng ὡς ang katayuan o saligan ng pagdurusa. Mas malinaw sa natural na Filipino ang “dahil siya ay” kaysa sa paulit-ulit na literal na “bilang,” nang hindi ginagawang tiyak na legal na kaparusahan ang pagdurusa.
- source_word: φονεύς
  choice: mamamatay-tao
  rationale: Tiyak itong tumutukoy sa taong pumapatay nang labag sa matuwid, kaya mas angkop kaysa sa mas malawak na “pumapatay.”
- source_word: κλέπτης
  choice: magnanakaw
  rationale: Karaniwan at tuwirang katumbas ito ng κλέπτης, nang hindi idinaragdag ang puwersahang pagnanakaw na maaaring ipahiwatig ng ibang termino.
- source_word: κακοποιός
  choice: gumagawa ng masama
  rationale: Pinananatili nito ang malawak at moral na diwa ng salita at hindi ito nililimitahan sa teknikal na kahulugang kriminal.
- source_word: ἀλλοτριεπίσκοπος
  choice: nakikialam sa mga gawain ng iba
  rationale: Ang bihira at mahirap na tambalang salita ay negatibong tumutukoy sa pakikialam sa mga bagay na saklaw ng iba. Malinaw ito sa modernong Filipino at hindi nag-aangkat ng eklesiastikal na kahulugan mula sa elementong ἐπίσκοπος.
theological_decisions:
- issue: Kahulugan ng ἀλλοτριεπίσκοπος
  choice: nakikialam sa mga gawain ng iba
  alternative: mapanghimasok; nakikialam sa hindi niya saklaw
  rationale: Ang konteksto ay talaan ng mga maling gawa na maaaring maging dahilan ng pagdurusa. Ipinahahayag ng pinili ang mapanagutang pakikialam nang hindi ipinapalagay ang isang partikular na tungkulin sa iglesya. Dahil bihira ang salita at may literal na larawang “tagapangasiwa ng pag-aari o gawain ng iba,” inilalahad sa talababa ang alternatibong anyo.
- issue: Diwa ng ὡς sa kaugnayan ng pagdurusa at kasalanan
  choice: dahil siya ay
  alternative: bilang
  rationale: Ipinakikita ng parirala ang dahilan o katangiang pinagbabatayan ng pagdurusa, ngunit hindi nito sinasabing lahat ng gayong pagdurusa ay pormal na hatol ng hukuman. Iniiwasan ng salin ang pagdaragdag ng “bilang parusa.”
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “Sapagkat” upang mapanatili ang ugnayang paliwanag sa naunang talata. Ang huling parirala ay sadyang malinaw ngunit may talababa upang mapanatili ang pambihira at bahagyang di-tiyak na katangian ng ἀλλοτριεπίσκοπος.
