id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: tl
  text: Sapagkat sapat na ang panahong lumipas na ginugol ninyo sa paggawa ng kalooban ng mga Hentil—noong namumuhay kayo sa mga kahalayan[a], masasamang pagnanasa, mga paglalasing[b], magulong pagsasaya, mga inuman, at mga ipinagbabawal na pagsamba sa mga diyos-diyosan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga walang-kahihiyang pagpapakasasa.”
    reason: lexical_alternative
  - marker: b
    text: O “mga labis na pag-inom hanggang malasing.”
    reason: lexical_alternative
  - marker: c
    text: O “mga kasuklam-suklam na pagsamba sa mga diyos-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Sapagkat sapat na ang panahong lumipas
  rationale: Pinananatili ng “sapat na” ang diwa ng ἀρκετός, at ng “Sapagkat” ang paliwanag na ugnayan ng γάρ.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: ang kalooban ng mga Hentil
  rationale: Ang βούλημα ay kalooban, hangarin, o layunin. Sa konteksto, ang ἐθνῶν ay tumutukoy sa mga di-Judio sa kanilang dating paganong pamumuhay; ang “mga Hentil” ang pinakamaikli at pinakapamilyar na salin nang hindi ginagawang geopolitikal na “mga bansa.”
- source_word: κατειργάσθαι
  choice: sa pagsasagawa ninyo
  rationale: Ipinahihiwatig ng pandiwa ang aktuwal na pagganap o pagsasakatuparan. Ginamit ang pariralang ito upang maging likas sa Filipino ang pagkakaugnay nito sa “panahong lumipas,” habang ipinakikitang dati na nila itong ginagawa.
- source_word: πεπορευμένους
  choice: noong namumuhay kayo
  rationale: Sa kontekstong moral, ang literal na “lumakad” ay nangangahulugang mamuhay o umasal. Mas natural sa modernong Filipino ang “namumuhay,” at ipinakikita ng “noong” na ito ang dati nilang paraan ng buhay.
- source_word: ἐν ἀσελγείαις
  choice: sa mga kahalayan
  rationale: Saklaw ng ἀσέλγεια ang walang-kahihiyang pagpapakasasa, lalo na ang seksuwal na kalabisan. Pinananatili ng “mga kahalayan” ang maramihang anyo at malawak na moral na diwa.
- source_word: ἐπιθυμίαις
  choice: masasamang pagnanasa
  rationale: Maaaring neutral ang ἐπιθυμία, ngunit malinaw na masama ang diwa nito sa talaang ito ng mga bisyo. Iniiwasan ng salin ang pagpapakitid nito sa seksuwal na pita lamang.
- source_word: οἰνοφλυγίαις
  choice: mga paglalasing
  rationale: Tumutukoy ang bihirang salitang ito sa labis at paulit-ulit na pag-inom hanggang malasing. Likas sa Filipino ang “mga paglalasing” at napapanatili nito ang maramihang anyo.
- source_word: κώμοις
  choice: magulong pagsasaya
  rationale: Ang κῶμος ay maingay at mahalay na pagsasaya, karaniwang kaugnay ng pag-inom. Ipinahahayag ng “magulong pagsasaya” ang ganitong uri ng walang-pigil na kasayahan.
- source_word: πότοις
  choice: mga inuman
  rationale: Ang πότος ay isang pagtitipon o okasyong nakasentro sa pag-inom. Ang “mga inuman” ay maikli, natural, at malinaw sa modernong Filipino.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: mga ipinagbabawal na pagsamba sa mga diyos-diyosan
  rationale: Ang ἀθέμιτος ay nangangahulugang hindi pinahihintulutan o salungat sa wastong kautusan at pamantayan. Ang “ipinagbabawal” ay nagpapanatili sa moral-legal na puwersa nito; ipinakikita naman ng maramihang parirala ang sari-saring gawaing idolatroso.
theological_decisions:
- issue: Pagpapakahulugan sa ἐθνῶν
  choice: mga Hentil
  alternative: mga pagano; mga bansa
  rationale: Sa konteksto, inilalarawan ni Pedro ang dating asal na karaniwan sa lipunang di-Judio. Ang “mga Hentil” ay karaniwang terminong biblikal at hindi kasing-interpretibo ng “mga pagano,” samantalang napakalawak ng “mga bansa.”
- issue: Lakas ng moral na paghatol sa ἀθεμίτοις εἰδωλολατρίαις
  choice: mga ipinagbabawal na pagsamba sa mga diyos-diyosan
  alternative: mga kasuklam-suklam na pagsamba sa mga diyos-diyosan
  rationale: Binibigyang-diin ng ἀθέμιτος na ang mga gawaing ito ay hindi pinahihintulutan at salungat sa wastong pamantayan. Hindi ito tahimik na pinatitindi tungo sa emosyonal na “kasuklam-suklam,” bagaman posible rin ang diwang iyon ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na “Hentil” at “diyos-diyosan,” habang iniwasan ang labis na arkaiko o denominasyonal na pananalita. Pinanatili hangga't likas ang mga maramihang anyo sa talaan ng mga bisyo at ang temporal na kaibhan ng dati nilang pamumuhay.
