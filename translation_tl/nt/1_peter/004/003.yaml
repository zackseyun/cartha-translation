revisions:
- from: Sapagkat sapat na ang panahong lumipas sa pagsasagawa ninyo ng kalooban ng mga Hentil—noong namumuhay kayo sa mga kahalayan[a], masasamang pagnanasa, mga paglalasing[b], magulong pagsasaya, mga inuman, at mga ipinagbabawal na pagsamba sa mga diyos-diyosan.[c]
  to: Sapagkat sapat na ang panahong lumipas na ginugol ninyo sa paggawa ng kalooban ng mga Hentil—noong namumuhay kayo sa mga kahalayan[a], masasamang pagnanasa, mga paglalasing[b], magulong pagsasaya, mga inuman, at mga ipinagbabawal na pagsamba sa mga diyos-diyosan[c].
  rationale: Binago ang pambungad na sugnay upang malinaw na ang sapat na panahong lumipas ay panahon na nagugol na ng mga mambabasa sa paggawa ng dating kalooban ng mga Hentil, habang pinanatili ang temporal na ugnayan ng kasunod na participle sa pamamagitan ng "noong namumuhay kayo." Inayos din ang puwesto ng marker c. Walang binagong kahulugan sa talaan ng mga bisyo o sa moral-legal na puwersa ng ἀθεμίτοις.
