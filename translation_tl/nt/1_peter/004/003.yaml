  naturalness: Marangal at madaling maunawaan ang register. Mas likas at mas malinaw sa modernong Tagalog ang "ang panahong lumipas na ginugol ninyo sa paggawa" kaysa "ang panahong lumipas sa pagsasagawa ninyo." Inilapit din ang hulíng footnote anchor sa pariralang tinutukoy nito.
  terminology: Ang "mga Hentil," "mga kahalayan," "masasamang pagnanasa," at "mga diyos-diyosan" ay angkop. Ang "ipinagbabawal" ay isang maingat na salin ng ἀθεμίτοις at hindi nagpapataw ng mas matinding interpretasyon kaysa sa pinagmulan.
