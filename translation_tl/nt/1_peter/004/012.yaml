  - severity: low
    issue: Ang “nag-aapoy na pagsubok” ay bahagyang di-likas at maaaring magmukhang literal na pagsubok na nasusunog.
    rationale: Ang “pagsubok na parang apoy” ay mas malinaw na Filipino para sa metaporang ‘fiery ordeal’ at pinananatili ang imahen ng apoy.
