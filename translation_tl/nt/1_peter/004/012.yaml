  to: Mga minamahal, huwag kayong magtaka sa pagsubok na parang apoy[a] na nagaganap sa gitna ninyo upang subukin kayo, na para bang may kakaibang sumasapit sa inyo.
  rationale: Inayos ang talinghaga ng apoy upang maging mas likas sa modernong Filipino, inilapit ang hulihang sugnay sa kahulugang ‘sumasapit,’ at itinama ang saklaw ng lexical na paliwanag sa talababa. Inilipat ang panandang talababa sa pariralang tinatalakay nito.
