  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: tl
  text: Mga minamahal, huwag kayong magtaka sa pagsubok na parang apoy[a] na nagaganap sa gitna ninyo upang subukin kayo, na para bang may kakaibang sumasapit sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “maapoy na pagsubok” o “matinding pagsubok na parang apoy.” Ang salitang Griyego na πυρώσει ay literal na may larawan ng pagsunog o apoy, at ang πειρασμός ay maaaring mangahulugang “pagsubok,” “pagsusuri,” o, sa ibang konteksto, “tukso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan. Pinananatili nito ang diwa ng pag-ibig at ang marangal ngunit likas na himig sa modernong Filipino.
- source_word: μὴ ξενίζεσθε
  choice: huwag kayong magtaka
  rationale: Likas itong pahayag sa Filipino para sa huwag mabigla o huwag ituring na di-karaniwan; kaugnay rin ito sa ξένου sa hulihan ng talata.
- source_word: τῇ ... πυρώσει
  choice: sa nag-aapoy na pagsubok
  rationale: Pinananatili ang malinaw na larawan ng apoy sa πυρώσει habang ipinahihiwatig ng 'pagsubok' ang matinding pagdurusang sumusuri sa pananampalataya.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Ipinakikita ang kolektibong karanasan ng pamayanan nang hindi itinatanggi ang personal na pagdanas ng bawat isa.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: upang subukin kayo
  rationale: Sa konteksto ng pagdurusa, tumutukoy ito sa pagsubok o pagpapatunay, hindi pangunahing sa tukso na gumawa ng masama. Ang pandiwang anyo ay malinaw at natural sa Filipino.
- source_word: γινομένῃ
  choice: na nangyayari
  rationale: Pinananatili ang kasalukuyan at nagpapatuloy na katangian ng pangyayari.
- source_word: ὡς ξένου
  choice: na para bang may kakaibang
  rationale: Ang 'kakaiba' ay natural na katumbas ng isang bagay na banyaga, di-pamilyar, o di-inaasahan, at pinananatili ang ugnayan sa 'huwag kayong magtaka.'
- source_word: συμβαίνοντος
  choice: nangyayari sa inyo
  rationale: Direkta at karaniwang Filipino para sa isang pangyayaring sumasapit sa kanila.
theological_decisions:
- issue: Kahulugan ng πειρασμός sa konteksto
  choice: pagsubok/pagsusuri sa pamamagitan ng pagdurusa
  alternative: tukso na gumawa ng masama
  rationale: Ang agarang konteksto ay pagdurusa at pag-uusig, kaya higit na tumutukoy ang salita sa isang pagsubok na sumusuri o nagpapatunay. Gayunman, kinikilala sa talababa ang mas malawak na saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na marangal, malinaw, at madaling maunawaan. Ginamit ang 'Mga minamahal' bilang mainit na pastoral na pantawag; pinanatili ang larawan ng apoy at ang pag-uulit ng konsepto ng pagiging kakaiba.
