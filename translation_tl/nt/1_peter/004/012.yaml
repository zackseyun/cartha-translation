  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: ang mga mambabasa ay hindi dapat magulat sa kasalukuyang pagsubok sa kanilang pamayanan na naglalayong sumubok sa kanila, ni ituring itong isang di-pangkaraniwang pangyayaring sumasapit sa kanila. Gayunman, ang talababa ay hindi sapat na tumpak nang ilista nito ang “pagdurusa” bilang direktang kahulugan ng πειρασμός; mas wasto ang “pagsubok,” “pagsusuri,” o “tukso,” habang ang pagdurusa ay kontekstuwal na paglalarawan ng karanasan. Ang rebisyon ay mas malinaw ding nag-uugnay sa dalawang pandiwang Griyego para sa ‘nagaganap/sumasapit.’'
  naturalness: Ang “Mga minamahal” at “huwag kayong magtaka” ay likas at angkop sa marangal na modernong Filipino. Ang “pagsubok na parang apoy” ay mas natural kaysa “nag-aapoy na pagsubok” at nananatili ang metapora ng πυρώσει. Ang “sumasapit sa inyo” ay natural para sa συμβαίνοντος at iniiwasan ang hindi kailangang pag-uulit ng “nangyayari.”
  terminology: Pinananatili ang “pagsubok” para sa πειρασμός sa kontekstong ito, nang hindi ipinapasok ang isang tiyak na doktrinal na pagpapaliwanag. Ang “parang apoy” ay malinaw na naglilipat ng larawan ng πυρώσει nang hindi ipinahihiwatig na literal na sunog ang tinutukoy.
