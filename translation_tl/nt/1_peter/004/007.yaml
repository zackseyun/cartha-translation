  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: tl
  text: Ngunit malapit na ang wakas ng lahat ng bagay.[a] Kaya mag-isip kayo nang matino at maging malinaw ang isip[b] upang makapanalangin kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumapit na.” Ipinahahayag ng Griyegong anyong perfect kapuwa ang paglapit at ang kasalukuyang kalagayan na bunga nito.
    reason: lexical_alternative
  - marker: b
    text: O “maging mapagmatyag.” Ang dalawang utos ay kapuwa nagbibigay-diin sa matinong paghatol at espirituwal na pagiging alerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: ng lahat ng bagay
  rationale: Ang genitibong maramihan ng πᾶς, kasama ng τέλος, ay likas na tumutukoy sa “lahat ng bagay.” Nililinaw ng “bagay” ang ipinahihiwatig na neutrong diwa nang hindi dinaragdagan ang kahulugan.
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na paglipat o pagsalungat mula sa naunang konteksto; pinananatili ng “Ngunit” ang bigat ng pagbabagong ito.
- source_word: τὸ τέλος
  choice: ang wakas
  rationale: Sa kontekstong eskatolohikal, ang “wakas” ang pinakadirekta at likas na katumbas ng τέλος, nang hindi ito ginagawang isang tiyak na sistemang panghuling-panahon.
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Likas na ipinapahayag sa makabagong Tagalog ng “malapit na” ang kasalukuyang kalagayang bunga ng paglapit na taglay ng Griyegong perfect. Inilalagay sa talababa ang mas pormal na “lumapit na.”
- source_word: σωφρονήσατε
  choice: mag-isip kayo nang matino
  rationale: Ipinahahayag nito ang maayos na paghatol, matinong pag-iisip, at disiplinadong pagpipigil na hinihingi ng pandiwa, habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at likas na ipinakikita ng “Kaya” ang pagbubunga ng mga utos mula sa pahayag na malapit na ang wakas.
- source_word: νήψατε
  choice: maging mapagmatyag
  rationale: Matalinghaga ang νήφω sa talatang ito at tumutukoy sa pagiging alerto at malinaw ang isip. Iniiwasan ng “mapagmatyag” ang posibleng pagkaunawa na alak lamang ang tinutukoy, at pinananatili ang kaibhan nito sa σωφρονήσατε.
- source_word: εἰς προσευχάς
  choice: upang makapanalangin kayo
  rationale: Dito, layunin ang ipinahahayag ng εἰς. Ang ganitong ayos ay likas sa Tagalog at ipinakikitang ang matinong pag-iisip at pagiging mapagmatyag ay naghahanda sa patuloy na pananalangin.
theological_decisions:
- issue: Eskatolohikal na diwa ng “wakas ng lahat ng bagay”
  choice: Pinanatili bilang tuwirang pahayag na malapit na ang wakas, nang walang itinakdang detalyadong panahon o sistemang eskatolohikal.
  alternative: Maaaring unawain ang τέλος bilang “layunin” o “kaganapan,” o pahinain ang sanggunian nito sa hinaharap.
  rationale: Sa konteksto, ang nalalapit na wakas ang batayan ng agarang panawagan sa matinong pag-iisip, pagmamatyag, at panalangin. Pinananatili ng salin ang tensiyon at pagkaapurahan nang hindi nag-aangkat ng partikular na pananaw tungkol sa mga huling bagay.
- issue: Ugnayan ng σωφρονήσατε at νήψατε
  choice: 'Isinalin bilang dalawang magkaugnay ngunit magkaibang utos: “mag-isip nang matino” at “maging mapagmatyag.”'
  alternative: Pagsamahin ang dalawa sa iisang pangkalahatang utos na “magpigil sa sarili,” o isalin ang νήψατε bilang literal na “maging hindi lasing.”
  rationale: Binibigyang-diin ng unang pandiwa ang matinong paghatol at disiplina, at ng ikalawa ang alertong pag-iisip. Hindi hinihingi ng konteksto na gawing tuwirang utos tungkol sa alak ang matalinghagang νήψατε.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “malapit na” kaysa sa mas pormal ngunit hindi gaanong likas na “lumapit na,” at ang “upang makapanalangin kayo” kaysa sa literal ngunit matigas na “para sa mga panalangin.”
