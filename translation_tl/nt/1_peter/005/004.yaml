base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: tl
  text: At kapag nahayag[a] ang Punong Pastol, tatanggapin ninyo ang di-kumukupas na putong[b] ng kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpakita.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego para sa “putong” ay maaaring tumukoy sa putong na gawa sa mga dahon na iginagawad sa isang nagwagi bilang gantimpala at karangalan, hindi partikular sa korona ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: kapag nahayag
  rationale: Ang aorist passive participle sa genitive absolute ay likas na ipinapahayag bilang pangyayari sa panahon. Pinananatili ng “nahayag” ang diwang pasibo at ang ideya ng pagpapakita o paghahayag, samantalang natural ito sa modernong Tagalog.
- source_word: ἀρχιποίμενος
  choice: Punong Pastol
  rationale: Tumutukoy ang tambalang salita sa pangunahing o kataas-taasang pastol. Malinaw, marangal, at madaling maunawaan ang “Punong Pastol”; ang malaking titik ay nagpapakitang titulo ito ni Jesus sa konteksto.
- source_word: κομιεῖσθε
  choice: tatanggapin ninyo
  rationale: Ang future middle indicative ay tumutukoy rito sa pagtanggap ng gantimpalang iginagawad. Likas sa Tagalog ang “tatanggapin ninyo” at hindi nito ginagawang tahasang pasibo ang pandiwa.
- source_word: ἀμαράντινον
  choice: di-kumukupas
  rationale: Ang pang-uri ay nangangahulugang hindi nalalanta, kumukupas, o nawawalan ng kasariwaan. Tumpak at madaling maunawaan ang “di-kumukupas” nang hindi pinalalakas ang kahulugan tungo sa mas malawak na “di-nasisira.”
- source_word: τῆς δόξης
  choice: ng kaluwalhatian
  rationale: Pinananatili ang genitive construction upang mapanatili ang maikli ngunit makahulugang talinghaga ng Griyego, sa halip na gawing “maluwalhating putong.”
- source_word: στέφανον
  choice: putong
  rationale: Ang στέφανος ay putong o koronang iginagawad bilang karangalan o gantimpala, gaya ng putong ng isang nagwagi, at hindi partikular na koronang maharlika. Ang “putong” ay angkop at dignified na salin; nililinaw sa talababa ang espesipikong pahiwatig.
theological_decisions:
- issue: Pagkakakilanlan ng “Punong Pastol”
  choice: Isang titulong tumutukoy kay Jesus
  alternative: Isalin bilang karaniwang “punong pastol” nang walang malaking titik
  rationale: Sa agarang konteksto ng pagpapastol at ng panghinaharap na paghahayag, si Jesus ang tinutukoy. Ipinahihiwatig ito ng malaking titik nang hindi nagdaragdag ng paliwanag na wala sa mismong talata.
- issue: Wika tungkol sa eskatolohikal na pagpapakita
  choice: nahayag
  alternative: magpakita
  rationale: Pinananatili ng “nahayag” ang anyong pasibo at ang tema ng paghahayag sa Griyego. Hindi nito labis na tinutukoy kung paano magaganap ang pagpapakitang ito, kaya nananatili ang tunay na lawak ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “di-kumukupas” para sa likas na daloy at ang “putong” upang mapanatili ang sinaunang larawan ng gantimpalang karangalan.
