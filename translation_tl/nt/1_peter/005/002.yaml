  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: tl
  text: Pangalagaan ninyo bilang mga pastol ang kawan ng Diyos na nasa gitna ninyo, na pinangangasiwaan ito hindi dahil napipilitan kayo kundi kusang-loob, ayon sa Diyos[a]; at hindi para sa kahiya-hiyang pakinabang kundi nang buong sigasig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kalooban ng Diyos” o “gaya ng nais ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιμάνατε
  choice: Pastulan ninyo
  rationale: Pinananatili nito ang talinghaga ng pastol at ang lakas ng pautos na pandiwa, nang hindi ginagawang titulo ng katungkulan ang kilos.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: ang kawan ng Diyos na nasa gitna ninyo
  rationale: Tahasang pinananatili ang pagmamay-ari ng Diyos at ang lokasyonal o relasyonal na diwa ng ἐν ὑμῖν, sa halip na ipahiwatig na pag-aari ito ng mga pinuno.
- source_word: ἐπισκοποῦντες
  choice: Pangasiwaan ninyo ito
  rationale: Likas na Filipino para sa aktibong pangangalaga at pamamahala; inilalarawan nito ang gawain at hindi ipinapasok ang isang teknikal o denominasyonal na titulo.
- source_word: μὴ ἀναγκαστῶς
  choice: hindi dahil napipilitan kayo
  rationale: Malinaw at karaniwang pagpapahayag ng pagkilos dahil sa pamimilit o sapilitang pangangailangan.
- source_word: ἀλλὰ ἑκουσίως
  choice: kundi kusang-loob
  rationale: Direkta at natural na kabaligtaran ng pagkilos nang napipilitan.
- source_word: κατὰ θεόν
  choice: ayon sa Diyos
  rationale: Pinananatili ang maikli at siksik na anyo ng Griyego at ang tunay na kalabuan kung ito ay tumutukoy sa kalooban, pamantayan, o paraang naaayon sa Diyos.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: hindi dahil sa kahiya-hiyang pakinabang
  rationale: Pinananatili ang moral na bigat ng αἰσχροκερδῶς at ang ideya ng mababa o kahiya-hiyang paghahangad ng pakinabang.
- source_word: ἀλλὰ προθύμως
  choice: kundi nang buong sigasig
  rationale: Ipinahahayag ang kahandaan at pananabik ng προθύμως habang iniiwasang ulitin lamang ang 'kusang-loob' para sa ἑκουσίως.
theological_decisions:
- issue: Kung gagawing teknikal na katawagan sa katungkulan ang ἐπισκοποῦντες
  choice: Isinalin bilang gawaing 'Pangasiwaan ninyo ito,' hindi bilang titulong gaya ng obispo.
  alternative: Maglingkod bilang mga tagapangasiwa / gampanan ang tungkulin ng obispo
  rationale: Sa konteksto, inilalarawan ng participle kung paano papastulan ng matatandang pinuno ang kawan. Iniiwasan nitong magpasok ng partikular na kaayusan ng pamamahala sa iglesya habang pinananatili ang diwa ng pangangasiwa.
- issue: Kung gaano kalinaw na bibigyang-kahulugan ang κατὰ θεόν
  choice: Pinanatili sa pangunahing teksto bilang 'ayon sa Diyos,' na may paliwanag sa talababa.
  alternative: ayon sa kalooban ng Diyos / gaya ng nais ng Diyos
  rationale: Siksik at may higit sa isang posibleng himig ang parirala. Ang mas pormal na salin ay hindi tahimik na nagpapasya kung kalooban, pamantayan, o paraang maka-Diyos ang tiyak na tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang talinghaga ng pastol at kawan. Ginamit ang 'pangasiwaan' bilang paglalarawan ng gawain, hindi bilang denominasyonal na titulo. Ang hulma ng mga paghahambing—hindi... kundi—ay pinanatili para sa ritmo at diin ng orihinal.
