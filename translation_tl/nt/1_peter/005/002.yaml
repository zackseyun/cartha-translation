revisions:
- from: Pastulan ninyo ang kawan ng Diyos na nasa gitna ninyo. Pangasiwaan ninyo ito, hindi dahil napipilitan kayo kundi kusang-loob, ayon sa Diyos[a]; hindi dahil sa kahiya-hiyang pakinabang kundi nang buong sigasig.
  to: Pangalagaan ninyo bilang mga pastol ang kawan ng Diyos na nasa gitna ninyo, na pinangangasiwaan ito hindi dahil napipilitan kayo kundi kusang-loob, ayon sa Diyos[a]; at hindi para sa kahiya-hiyang pakinabang kundi nang buong sigasig.
  rationale: Pinalitan ang “Pastulan ninyo” ng “Pangalagaan ninyo bilang mga pastol” upang maipahayag nang natural at tapat ang ποιμάνατε habang pinananatili ang metapora. Iniugnay ang pangangasiwa sa gawaing pastoral sa pamamagitan ng participial na “na pinangangasiwaan ito.” Pinalitan ang “hindi dahil sa kahiya-hiyang pakinabang” ng “hindi para sa kahiya-hiyang pakinabang” upang mas tumpak na maipahayag ang motibong tinatanggihan sa μηδὲ αἰσχροκερδῶς. Pinanatili ang pangunahing tekstong “ayon sa Diyos” at ang talababa upang huwag magpasya nang lampas sa siksik na kahulugan ng κατὰ θεόν.
