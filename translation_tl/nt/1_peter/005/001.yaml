  source_fidelity: Tumpak ang pagsasalin sa lohikal na «Kaya» (οὖν), sa pangkat na «mga nakatatanda sa inyo» (πρεσβυτέρους ἐν ὑμῖν), sa pastoral na «hinihimok ko» (παρακαλῶ), at sa mga pariralang «saksi sa mga paghihirap ng Mesiyas» at «kabahagi ... sa kaluwalhatian.» Napananatili rin ng «malapit nang ihayag» ang futurong may inaasahang paglapit sa μέλλουσαν ἀποκαλύπτεσθαι, nang hindi nagbibigay ng tiyak na takdang panahon.
  naturalness: Sa modernong Tagalog, mas malinaw at mas natural ang «kapwa ninyo nakatatanda» kaysa «kapwa nakatatanda.» Tahasang ipinakikita ng «ninyo» na ang nagsasalita ay kapwa ng mga nakatatandang kaniyang tinutukoy, gaya ng puwersa ng συμπρεσβύτερος.
  terminology: Ang «mga nakatatanda» ay katanggap-tanggap na di-denominasyonal na katawagan para sa πρεσβύτεροι sa kontekstong pangkapulungan. Ang «Mesiyas,» «saksi,» «paghihirap,» «kabahagi,» at «kaluwalhatian» ay angkop sa rehistro at sa mga pangunahing salitang Griyego. Ang mga talababa ay wastong nakaangkla sa Mesiyas at sa parirala tungkol sa kaluwalhatian.
