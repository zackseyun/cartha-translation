id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: tl
  text: 'Kaya hinihimok ko ang mga nakatatanda sa inyo, bilang kapwa ninyo nakatatanda at saksi sa mga paghihirap ng Mesiyas[a], at kabahagi rin sa kaluwalhatiang malapit nang ihayag[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga paghihirap ni Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o, ayon sa nakaugaliang salin, “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O, “kalahok sa kaluwalhatiang ihahayag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: mga nakatatanda
  rationale: Sa kontekstong ito, tumutukoy ito sa mga kinikilalang pinuno ng kapulungan, hindi lamang sa mga lalaking may edad. Pinananatili ng “mga nakatatanda” ang katawagan nang hindi nag-aangkat ng terminolohiya ng isang partikular na denominasyon.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang lohikal na paglipat mula sa naunang talakayan sa natural at malinaw na makabagong Tagalog.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Likas na katumbas sa Tagalog ng diwang “nasa gitna ninyo” o “kabilang sa inyo.”
- source_word: παρακαλῶ
  choice: hinihimok ko
  rationale: Ipinahahayag ang taimtim na pastoral na paghimok, hindi lamang isang karaniwang pakiusap.
- source_word: συμπρεσβύτερος
  choice: kapwa nakatatanda
  rationale: Pinananatili ang diwa na ang nagsasalita ay kabahagi nila sa parehong tungkulin o katayuan.
- source_word: μάρτυς
  choice: saksi
  rationale: Pinananatili ang pangunahing kahulugan ng isang nagpapatotoo tungkol sa mga paghihirap ng Mesiyas, nang hindi ito awtomatikong inuunawa bilang “martir.”
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: sa mga paghihirap ng Mesiyas
  rationale: Natural na ipinahahayag na ang mga paghihirap ay dinanas ng Mesiyas, habang pinananatiling buhay ang titulong Χριστός.
- source_word: κοινωνός
  choice: kabahagi
  rationale: Malinaw at likas na ipinahahayag ang pakikibahagi sa kaluwalhatian, nang walang komersiyal na pahiwatig ng “kasosyo.”
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: sa kaluwalhatiang malapit nang ihayag
  rationale: Pinananatili ang pasibong diwa ng paghahayag at ang inaasahang nalalapit na katuparan na taglay ng μέλλω kasama ng pawatas.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulong kristolohikal
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may buhay na diwa ng titulo rito. Ang “Mesiyas” ay tuwirang naghahatid ng kahulugang “Pinahiran,” samantalang kinikilala sa talababa ang nakaugaliang “Cristo.”
- issue: Lakas ng μελλούσης ἀποκαλύπτεσθαι
  choice: malapit nang ihayag
  alternative: ihahayag / ihahayag sa hinaharap
  rationale: Ipinananatili nito ang himig ng pag-asang nalalapit ang paghahayag, ngunit hindi nito nilulutas ang mas malawak na usapin tungkol sa eksaktong panahon ng katuparan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga nakatatanda” bilang di-denominasyonal na katawagan sa mga pinuno ng kapulungan; pinanatili ang masidhing himig ng paghimok at ang eskatolohikal na pag-asang nasa Griyego.
