id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: tl
  text: Gayundin, kayong mga nakababatang lalaki,[a] magpasakop kayo sa mga elder. At kayong lahat, isuot ninyo ang kapakumbabaan sa pakikitungo sa isa't isa,[b] sapagkat “sinasalungat ng Diyos ang mga mapagmataas, ngunit nagbibigay siya ng biyaya sa mga mapagpakumbaba.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kayong mga nakababata.” Panlalaking maramihan ang anyong Griyego, ngunit itinuturing ito ng ilan na mas pangkalahatang tawag sa mga nakababatang kaanib ng kapulungan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na larawan, “itali o isuot ninyo sa inyong sarili ang kapakumbabaan.” Ipinahihiwatig ng pandiwang Griyego ang sadyang pagsusuot o pagtatali ng isang kasuotan.
    reason: lexical_alternative
  - marker: c
    text: Sipi o pahiwatig mula sa Kawikaan 3:34 ayon sa Septuagint, ang sinaunang saling Griyego.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Gayundin
  rationale: Likas at maikling panandang nag-uugnay sa tagubiling nauna.
- source_word: νεώτεροι
  choice: kayong mga nakababatang lalaki
  rationale: Pinananatili ang panlalaking maramihang anyo at ang paghahambing sa πρεσβυτέροις, habang ang talababa ay naglalahad ng posibleng mas pangkalahatang saklaw.
- source_word: ὑποτάγητε
  choice: magpasakop kayo
  rationale: Natural na pautos sa Filipino na nagpapahayag ng kusang pagpapailalim sa kinikilalang pamumuno.
- source_word: πρεσβυτέροις
  choice: sa mga tagapanguna
  rationale: Sa agarang konteksto ng 5:1–4, tumutukoy ito sa mga elder ng iglesya; mas madaling maunawaan ng karaniwang mambabasa ang 'mga tagapanguna' kaysa sa malabong 'matatanda.'
- source_word: πάντες δὲ
  choice: At kayong lahat
  rationale: Malinaw na pinalalawak ang kasunod na utos sa buong kapulungan.
- source_word: ἀλλήλοις
  choice: sa pakikitungo sa isa't isa
  rationale: Ipinahahayag ang kapwa at relasyonal na direksiyon ng kapakumbabaan sa natural na Filipino.
- source_word: ταπεινοφροσύνην
  choice: kapakumbabaan
  rationale: Karaniwan, malinaw, at marangal na katumbas ng mapagpakumbabang pag-iisip at asal.
- source_word: ἐγκομβώσασθε
  choice: isuot ninyo
  rationale: Pinananatili ang metapora ng pagsusuot o pagtatali ng kasuotan nang hindi nagiging alanganin sa Filipino.
- source_word: ὑπερηφάνοις
  choice: mga mapagmataas
  rationale: Natural na substantibong paglalarawan sa mga taong mayabang o palalo.
- source_word: ἀντιτάσσεται
  choice: sinasalungat
  rationale: Malakas at malinaw na katumbas ng aktibong pagpanig laban o pagharap laban sa isang tao.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: ngunit nagbibigay siya ng biyaya sa mga mapagpakumbaba
  rationale: Pinananatili ang tahasang pagsalungat ng dalawang sugnay at ang teolohikal na salitang χάρις bilang 'biyaya.'
theological_decisions:
- issue: Tinutukoy ng πρεσβυτέροις
  choice: mga tagapanguna ng iglesya
  alternative: mga nakatatandang lalaki sa pangkalahatan
  rationale: Dahil tuwirang tinutukoy sa 5:1–4 ang mga πρεσβύτεροι bilang namumuno at nagpapastol, ang pangkat na iyon ang pinakamalamang na tinutukoy rito.
- issue: Kasarian at saklaw ng νεώτεροι
  choice: mga nakababatang lalaki
  alternative: mga nakababata sa pangkalahatan
  rationale: Panlalaking maramihan ang anyong Griyego at malamang na inihahambing sa mga lalaking tagapanguna. Gayunman, maaaring unawain ito nang mas pangkalahatan, kaya pinananatili sa talababa ang tunay na kalabuan.
- issue: Saklaw ng utos na magpakumbaba
  choice: para sa lahat at kapwa-kapwa
  alternative: para lamang sa mga nakababatang lalaki sa harap ng mga tagapanguna
  rationale: Ang πάντες at ἀλλήλοις ay tahasang nagpapalawak sa utos tungkol sa kapakumbabaan sa buong pamayanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tagapanguna' upang ipakita ang papel ng mga elder sa agarang konteksto at maiwasan ang pagkalito sa mga nakatatanda lamang dahil sa edad. Pinanatili ang metapora ng kasuotan at ang kasariang nakikita sa νεώτεροι, na may mga talababa para sa tunay na mga alternatibo.
