base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: tl
  text: Batiin ninyo ang isa’t isa sa pamamagitan ng halik ng pag-ibig. Kapayapaan sa inyong lahat na nasa Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa tradisyonal na salin, “Cristo.”
    reason: Ibinibigay ang pamilyar at tradisyonal na salin ng Χριστῷ bilang alternatibo sa “Mesiyas.”
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Isang aorist middle imperative sa ikalawang panauhang maramihan. Ang “Batiin ninyo” ay natural na utos sa makabagong Tagalog at angkop sa pangwakas na pagbati sa liham.
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Malinaw na ipinapahayag nito ang gantihang kilos sa loob ng pamayanan.
- source_word: ἐν φιλήματι ἀγάπης
  choice: ng halik ng pag-ibig
  rationale: Idyomatikong ipinapakita ng “ng” ang paraan ng pagbati. Pinananatili ng “halik ng pag-ibig” ang tahasang ugnayan ng ἀγάπης sa pag-ibig, sa halip na gawing mas malayang “mapagmahal na halik.”
- source_word: εἰρήνη
  choice: Kapayapaan
  rationale: Pinananatili ang maikli at nominal na anyo ng pangwakas na pagpapala sa Griyego, nang hindi tahasang nagdaragdag ng pandiwa.
- source_word: ὑμῖν πᾶσιν
  choice: sa inyong lahat
  rationale: Natural sa Tagalog at pinananatili ang saklaw na walang ibinubukod sa mga kausap.
- source_word: τοῖς ἐν Χριστῷ
  choice: na nasa Mesiyas
  rationale: Ang artikulo at pariralang pang-ukol ay tumutukoy sa mga taong “nasa” Mesiyas. Pinananatili ng “nasa” ang siksik at teolohikal na bukas na pahayag na ἐν Χριστῷ, sa halip na ipaliwanag ito bilang “nakipag-isa,” “nakaugnay,” o “kabilang.” Isinalin ang titulong Χριστός bilang “Mesiyas.”
theological_decisions:
- issue: Paglalarawan sa ἐν Χριστῷ
  choice: nasa Mesiyas
  alternative: nasa Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran, kaya “Mesiyas” ang pangunahing salin. Hindi pinalawak ang ἐν bilang “nakipag-isa kay” upang mapanatili ang tunay na lawak at teolohikal na tensiyon ng parirala. Inilagay sa talababa ang tradisyonal na “Cristo.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “isa’t isa” at “sa inyong lahat” bilang natural na pananalita, habang pinanatili ang maikli at solemne na anyo ng pangwakas na pagpapala.
