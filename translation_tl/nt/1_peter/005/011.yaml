  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: tl
  text: Sa kanya ang kapangyarihan magpakailanman. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ
  choice: Sa kanya
  rationale: Ang panghalip na nasa datibo ay tumutukoy sa Diyos sa naunang konteksto. Pinananatili ng “Sa kanya” ang anyong papuri ng Griyego nang hindi ginagawang tahasang pag-aari ang pahayag.
- source_word: κράτος
  choice: kapangyarihang maghari
  rationale: Sa ganitong papuri, tumutukoy ang κράτος sa makapangyarihang pamamahala o paghahari, hindi lamang sa lakas. Likas at malinaw sa modernong Tagalog ang “kapangyarihang maghari.”
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Isa itong mariing idyomang tumutukoy sa walang-hanggang panahon. Malinaw at likas na naipahahayag ng “magpakailanman” ang kahulugan nito, habang inilalagay sa talababa ang higit na literal na anyo.
- source_word: ἀμήν
  choice: Amen
  rationale: Ang kinagawiang transliterasyong “Amen” ay malawak na nauunawaan at pinananatili ang liturhikal na bisa ng pangwakas na pagpapatibay.
theological_decisions:
- issue: Ipinahihiwatig na panaguri sa papuri
  choice: Sa kanya ang kapangyarihang maghari
  alternative: Sumakanya ang kapangyarihang maghari; Sa kanya nauukol ang kapangyarihang maghari
  rationale: Walang tahasang pandiwa ang Griyego. Pinananatili ng napiling anyo ang maikli at maringal na pahayag at hindi nito ipinapasya kung dapat itong unawain bilang hangad (“sumakanya”) o bilang pagkilalang nauukol na sa Diyos ang kapangyarihan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, maringal, at madaling maunawaan. Iniwasan ang labis na makalumang ayos habang pinanatili ang anyong papuri at ang kawalan ng tahasang pandiwa sa Griyego.
