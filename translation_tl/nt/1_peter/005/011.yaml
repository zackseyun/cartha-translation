- from: Sa kanya ang kapangyarihang maghari magpakailanman[a]. Amen.
  to: Sa kanya ang kapangyarihan magpakailanman. Amen.
  rationale: Pinalitan ang “kapangyarihang maghari” ng “kapangyarihan” upang katawanin ang κράτος bilang kapangyarihan o dominion na iniuukol sa Diyos, nang hindi ipinapasok ang ideya ng kakayahang “maghari.” Pinanatili ang maikli at verbless na himig ng orihinal sa abot ng natural na Tagalog. Inayos din ang literal na talababa upang tumugma sa binagong pangunahing salin at maipakita ang anyong “mga kapanahunan ng mga kapanahunan.”
