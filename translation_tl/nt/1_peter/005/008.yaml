  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: tl
  text: Panatilihing malinaw ang inyong pag-iisip[a]; manatiling mapagbantay. Ang inyong kalaban, ang diyablo, ay gumagala tulad ng isang leong umuungal[b], na naghahanap ng sinumang kanyang lalamunin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Maging matino,” ayon sa tradisyonal na literal na larawan. Ang pandiwang Griyego ay literal na may kaugnayan sa pagiging hindi lasing, ngunit matalinghaga ang gamit nito rito: malinaw na pag-iisip at pagpipigil sa sarili sa harap ng espirituwal na panganib.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “umaaligid tulad ng isang leong umuungal.” Mas literal ang pandiwang Griyego na “lumilibot” o “nagpaparoo't-parito”; ang “umaaligid” ay isang mas interpretatibong salin na nababagay sa larawan ng leon.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Maging malinaw ang inyong pag-iisip
  rationale: 'Bagaman literal na nauugnay ang νήφω sa pagiging hindi lasing, matalinghaga ang gamit nito rito: panatilihin ang malinaw na pag-iisip at pagpipigil sa sarili sa harap ng espirituwal na panganib. Iniiwasan din nitong pag-isahin ang diwa nito sa kasunod na γρηγορήσατε.'
- source_word: γρηγορήσατε
  choice: manatiling mapagbantay
  rationale: Ipinahahayag nito ang patuloy na mapagmatyag na pagbabantay at natural itong katambal, ngunit hindi kapareho, ng malinaw na pag-iisip.
- source_word: ἀντίδικος
  choice: kalaban
  rationale: Maaaring tumukoy ang salita sa katunggali sa usaping legal, ngunit dito ay mas malawak na tumutukoy sa isang kaaway. Ang “kalaban” ay natural at hindi labis na nagpapakitid sa legal na kahulugan.
- source_word: διάβολος
  choice: ang diyablo
  rationale: Dito ay ginagamit ang salita bilang kinikilalang katawagan sa personal na espirituwal na kaaway, hindi lamang bilang karaniwang pangngalang “maninirang-puri.”
- source_word: ὡς λέων ὠρυόμενος
  choice: gaya ng leong umuungal
  rationale: Pinananatili nito ang tahasang paghahambing at ang matingkad na larawan ng nagbabantang mandaragit.
- source_word: περιπατεῖ
  choice: gumagala
  rationale: Ang pangunahing diwa ay lumilibot o naglalakad sa iba't ibang dako. Natural sa Filipino ang “gumagala” at hindi nito idinaragdag nang tahasan ang interpretatibong diwa ng palihim na paninila.
- source_word: ζητῶν
  choice: na naghahanap
  rationale: Ipinakikita ng participle ang kasabay at may layuning paghahanap ng diyablo.
- source_word: τινα
  choice: ng masisila
  rationale: Ang di-tiyak na panghalip ay tumutukoy sa sinumang maaaring maging biktima. Sa Filipino, natural na naipahahayag ito sa pariralang “naghahanap ng masisila.”
- source_word: καταπιεῖν
  choice: masisila
  rationale: Literal na nangangahulugang lunukin o lamunin; sa larawan ng leon, ang “masisila” ay natural at pinananatili ang marahas na puwersa ng paglamon.
theological_decisions:
- issue: Kung isasalin ang διάβολος bilang karaniwang pangngalang “maninirang-puri” o bilang personal na katawagang “diyablo”
  choice: ang diyablo
  alternative: ang maninirang-puri
  rationale: Sa kontekstong ito, ang tinutukoy ay ang personal na espirituwal na kaaway ng mga mananampalataya. Sumasalamin ang “diyablo” sa gamit ng salita rito nang walang idinaragdag na denominasyonal na paliwanag.
- issue: Kung palalakasin ang περιπατεῖ ayon sa larawan ng leon
  choice: gumagala
  alternative: umaaligid upang manila
  rationale: Pinananatili ng “gumagala” ang karaniwang diwa ng pandiwang Griyego, samantalang ang paghahambing sa leon at ang layuning manila ang siyang nagdadala ng banta. Inilalagay sa talababa ang mas interpretatibong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang pangmaramihang “inyong” sapagkat maramihan ang mga panghalip at pautos sa Griyego. Pinanatiling magkaiba ang malinaw na pag-iisip at mapagbantay na pagbabantay.
