  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: tl
  text: huwag kayong maghari-harian sa mga ipinagkatiwala sa inyong pangangalaga[a], kundi maging mga halimbawa kayo sa kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa mga bahaging itinalaga sa inyo.” Literal na sinasabi ng Griyego na “mga bahagi” o “mga takdang bahagi,” na malamang ay tumutukoy sa mga bahagi ng kawan ng Diyos na iniatas sa pangangalaga ng bawat nakatatanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: hindi bilang
  rationale: Ipinagpapatuloy nito ang pagbabawal sa naunang talata at inilalarawan ang paraang hindi dapat gamitin sa pagpapastol.
- source_word: κατακυριεύοντες
  choice: mga naghahari-harian sa
  rationale: Ipinahihiwatig ng pandiwa ang mapang-abuso at mapang-aping paggamit ng kapangyarihan, hindi ang lahat ng lehitimong pamumuno.
- source_word: τῶν κλήρων
  choice: mga ipinagkatiwala sa inyong pangangalaga
  rationale: Literal itong tumutukoy sa mga bahagi o takdang bahagi; sa konteksto, ang tinutukoy ay ang mga bahagi ng kawan ng Diyos na iniatas sa pangangalaga ng mga tagapanguna.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa ipinagbabawal na asal at sa nararapat na asal.
- source_word: τύποι
  choice: mga halimbawa
  rationale: Tumutukoy ito sa mga huwarang maaaring tularan; natural at malinaw sa modernong Tagalog ang “mga halimbawa.”
- source_word: γινόμενοι
  choice: maging
  rationale: Pinananatili nito ang dinamikong diwa ng aktuwal na pagiging huwaran sa asal, sa halip na isang purong statikong paglalarawan.
- source_word: τοῦ ποιμνίου
  choice: sa kawan
  rationale: Pinananatili ang karaniwang talinghagang pastoral para sa pamayanan ng mga mananampalataya.
theological_decisions:
- issue: Kahulugan ng κλήρων kaugnay ng pamumuno sa iglesya
  choice: mga taong iniatas sa pangangalaga ng mga tagapanguna, hindi mga pag-aari nila
  alternative: literal na “mga bahagi” o “mga takdang bahagi” nang walang paliwanag
  rationale: Ang konteksto ay tungkol sa pagpapastol sa kawan ng Diyos. Ipinakikita ng salin ang pananagutan bilang katiwala at iniiwasan ang pahiwatig na pag-aari ng mga tagapanguna ang mga tao.
- issue: Lakas ng κατακυριεύοντες
  choice: ipinagbabawal ang mapang-abuso at mapang-aping paggamit ng awtoridad
  alternative: ipinagbabawal ang anumang uri ng pamumuno ng matatanda
  rationale: Ang pandiwa ay tumutukoy sa mapaniil na paghahari. Ang kaibahan sa talata ay hindi sa pagitan ng pamumuno at kawalan ng pamumuno, kundi ng mapang-abusong pamumuno at pamumunong nagsisilbing halimbawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “naghahari-harian” upang ihayag ang mapang-abusong tono ng κατακυριεύω nang hindi ipinagkakaila ang lehitimong pamumuno; pinanatili ang pastoral na talinghagang “kawan.”
