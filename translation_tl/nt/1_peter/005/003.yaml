  naturalness: Ang “mga naghahari-harian” ay hindi angkop sa konstruksiyong “hindi bilang mga …” at nagiging mabigat ang pangungusap. Mas likas at tuwiran ang “huwag kayong maghari-harian.” Ang “maging mga halimbawa kayo” ay nananatiling malinaw at marangal.
  terminology: Ang “maghari-harian” ay sapat na nagpapahiwatig ng mapang-abusong pag-aangkin ng kapangyarihan, hindi ng lahat ng lehitimong pamumuno. Ang “mga ipinagkatiwala sa inyong pangangalaga” ay natural na pagsasalin sa kontekstuwal na kahulugan ng τῶν κλήρων; pinananatili ng talababa ang literal na larangan ng “bahagi/allotment.”
