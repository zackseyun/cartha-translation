  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: tl
  text: Ilagak ninyo sa kanya[c][b] ang lahat ng inyong alalahanin[a], sapagkat nagmamalasakit siya sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-aalala” o “pagkabahala.” Dito, ang diwa ng μέριμνα ay balisang pag-aalala, hindi neutral na pagmamalasakit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “matapos ninyong ilagak sa kanya” o “nang mailagak ninyo sa kanya”; nakaugnay ito sa paghimok sa talata 6.
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy ay ang Diyos, ayon sa agarang konteksto sa talata 6.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν
  choice: lahat ng
  rationale: Pinananatili nito ang saklaw na buo at komprehensibo habang natural na binabago ang anyo ayon sa balarilang Tagalog.
- source_word: μέριμναν
  choice: alalahanin
  rationale: Sa kontekstong ito, tumutukoy ito sa mabigat o balisang pag-aalala, hindi sa neutral na pagmamalasakit. Likas at marangal sa modernong Tagalog ang “alalahanin.”
- source_word: ὑμῶν
  choice: inyong / inyo
  rationale: Ang panghalip ay maramihan sa Griyego; likas na naihahayag ito sa magalang at pangmaramihang anyong Tagalog.
- source_word: ἐπιρίψαντες
  choice: Ilagak ninyo
  rationale: Pinananatili ng “ilagak” ang larawan ng paglilipat ng pasan sa iba nang hindi nagiging masyadong kolokyal ang “ihagis.” Ginawang tahasang pautos sa Tagalog upang natural na maipahayag ang lakas ng participle na nakaugnay sa utos sa talata 6.
- source_word: ἐπ’ αὐτόν
  choice: sa kanya
  rationale: Natural itong katumbas ng paglalagak ng isang pasan sa isang tao at pinananatili ang panghalip ng Griyego nang hindi isinisiksik ang pangalan ng tinutukoy.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: μέλει
  choice: nagmamalasakit siya
  rationale: Ipinahahayag nito ang aktibong personal na pagkalinga, hindi lamang na mahalaga sa kanya ang isang bagay.
- source_word: περὶ ὑμῶν
  choice: sa inyo
  rationale: Kasama ng “nagmamalasakit,” ito ang pinakanatural na Tagalog para sa pagkalingang nakatuon sa mga mambabasa.
theological_decisions:
- issue: Tinutukoy ng αὐτόν/αὐτῷ
  choice: “kanya/siya” = Diyos ayon sa agarang konteksto
  alternative: Ang Panginoon sa pangkalahatan, na ang tinutukoy ay kinukuha mula sa konteksto
  rationale: Binabanggit sa talata 6 ang “makapangyarihang kamay ng Diyos,” kaya Diyos ang pinakamalapit at pinakanatural na tinutukoy. Gayunman, pinananatili sa salin ang panghalip upang hindi maging higit na tahasan kaysa sa Griyego.
- issue: Ugnayan ng ἐπιρίψαντες sa naunang utos
  choice: Isinalin bilang tuwirang paghimok na “Ilagak ninyo”
  alternative: “habang inilalagak” o “pagkalagak” bilang mas pormal na participial na anyo
  rationale: Ang aorist participle ay nakadepende sa paghimok sa talata 6. Sa Tagalog, malinaw at natural ang tuwirang pautos, samantalang ipinapaliwanag sa talababa ang literal na anyo at ugnayan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “ilagak” upang mapanatili ang metapora ng paglilipat ng pasan nang hindi maging marahas o kolokyal; ang “nagmamalasakit” ay nagpapahayag ng personal at aktibong pagkalinga.
