id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: tl
  text: Binabati kayo ng kasama ninyong hinirang[a] na nasa Babilonia[b], at gayundin ni Marcos, na anak ko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, pambabae at pang-isahan ang “kasama ninyong hinirang,” ngunit walang tahasang pangngalan. Maaari itong unawain nang mas interpretatibo bilang “ang iglesya sa Babilonia, na kasama ninyong hinirang.”
    reason: alternative_reading
  - marker: b
    text: Maaaring sagisag ang “Babilonia” para sa Roma sa sinaunang paggamit ng mga Kristiyano; “Babilonia” mismo ang sinasabi ng teksto.
    reason: cultural_note
  - marker: c
    text: Malamang na espirituwal, hindi biyolohikal, ang ugnayang ipinahahayag ng “anak ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: binabati
  rationale: Karaniwang ipinahihiwatig ng pandiwa ang pagbati o pagpapadala ng pagbati. Ang “binabati” ay maikli, natural, at angkop sa liham.
- source_word: ἡ ... συνεκλεκτὴ
  choice: ang kasama ninyong hinirang
  rationale: Ang Griyego ay may pambabaeng pang-isahang artikulo at pang-uri ngunit walang tahasang pangngalan. Ginamit ang pariralang nominal na ito upang hindi basta idagdag sa pangunahing teksto ang “iglesya” o “babae.” Hindi likas na naipakikita ng mga panghalip at artikulo sa Tagalog ang pambabaeng kasarian, kaya ipinaliliwanag ito sa talababa.
- source_word: ἐν Βαβυλῶνι
  choice: nasa Babilonia
  rationale: Pinanatili ang pangalang hayagang nasa Griyego sa halip na isalin ito bilang “Roma,” na isa nang interpretasyon.
- source_word: συνεκλεκτὴ
  choice: kasama ninyong hinirang
  rationale: Ipinahahayag nito na ang tinutukoy ay hinirang na kasama ng mga mambabasa, nang hindi gumagamit ng di-likas na salitang teknikal.
- source_word: Μᾶρκος
  choice: Marcos
  rationale: Ito ang nakaugaliang anyo ng pangalang Μᾶρκος sa makabagong saling Filipino.
- source_word: ὁ υἱός μου
  choice: anak ko
  rationale: Ang “anak” ay natural sa Tagalog at hindi sapilitang nagpapasiya kung biyolohikal o espirituwal ang ugnayan. Bagaman ang υἱός ay tiyak na “son,” karaniwang hindi tinutukoy ng Tagalog na “anak” ang kasarian maliban kung kailangan sa konteksto; lalaki na ang pangalang Marcos.
theological_decisions:
- issue: Pagkakakilanlan ng ἡ ... συνεκλεκτὴ
  choice: Iniwan sa pangunahing teksto ang tinutukoy bilang isang di-pinangalanang “kasama ninyong hinirang.”
  alternative: “Ang iglesya sa Babilonia, na kasama ninyong hinirang,” o isang babaeng Kristiyano gaya ng asawa ni Pedro.
  rationale: Pambabae at pang-isahan ang anyong Griyego, ngunit walang nakasulat na pangngalan. Iniiwasan ng salin na ipasok ang “iglesya” o “babae” bilang tiyak na tinutukoy; inilalahad sa talababa ang mahalagang gramatikal at interpretatibong impormasyon.
- issue: Kahulugan ng Babilonia
  choice: Pinanatili ang “Babilonia” sa pangunahing teksto.
  alternative: Maaaring sagisag ito para sa Roma, o tumukoy sa literal na Babilonia sa Mesopotamia.
  rationale: Babilonia mismo ang pinangalanan ng tekstong Griyego. Dahil pinagtatalunan ang historikal na tinutukoy, hindi ito nilutas sa pangunahing salin.
- issue: Kahulugan ng “anak ko” tungkol kay Marcos
  choice: Pinanatili ang pananalitang pampamilya nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: “Espirituwal kong anak.”
  rationale: Malamang na espirituwal na ugnayan ang tinutukoy, ngunit hindi tahasang sinasabi iyon ng Griyego. Ang interpretasyon ay inilagay sa talababa sa halip na idagdag sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “binabati” sa halip na mas kolokyal na “kinukumusta.” Ang nominal na “ang kasama ninyong hinirang” ay nagpapanatili sa di-tahasang tinutukoy ng Griyego; dahil walang gramatikal na kasariang pambabae sa katumbas na anyo sa Tagalog, inilagay ang detalyeng iyon sa talababa.
