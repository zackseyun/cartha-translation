  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: tl
  text: Labanan ninyo siya; maging matatag kayo sa pananampalataya[a], sapagkat alam ninyo na ang gayunding mga pagdurusa ay dinaranas[b] ng inyong kapatiran[c] sa mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “matatag sa pananalig” o “matatag sa pananampalatayang pinanghahawakan.”
    reason: lexical_ambiguity
  - marker: b
    text: O “ay nagaganap” o “ay nalulubos.”
    reason: lexical_alternative
  - marker: c
    text: Ang “kapatiran” ay tumutukoy sa buong pamayanan ng mga kapwa mananampalataya, hindi lamang sa mga lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: siya
  rationale: Ang panghalip ay tumutukoy sa diyablo sa naunang talata; likas sa Tagalog ang tahasang layon na “siya” pagkatapos ng “labanan.”
- source_word: ἀντίστητε
  choice: Labanan ninyo
  rationale: Ipinahahayag nito ang mariin at aktibong pagtutol na hinihingi ng pautos na anyo, sa malinaw at karaniwang Tagalog.
- source_word: στερεοὶ τῇ πίστει
  choice: na matatag sa pananampalataya
  rationale: Pinananatili ng “matatag” ang diwa ng στερεοὶ, at ng “sa pananampalataya” ang posibleng pagtukoy kapuwa sa matibay na pagtitiwala at sa pananampalatayang Kristiyano.
- source_word: εἰδότες
  choice: sapagkat alam ninyo
  rationale: Isinasalin ang participle bilang batayan ng utos; mas natural ito sa Tagalog kaysa sa literal na “nalalaman.”
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: ang gayunding mga pagdurusa
  rationale: Ipinahihiwatig ng parirala ang mga pagdurusang kauri o katulad, hindi kinakailangang eksaktong magkakaparehong pangyayari.
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: ng inyong kapatiran sa buong mundo
  rationale: Ang “kapatiran” ay nagpapanatili sa kolektibo at pampamilyang larawan ng Griyego; ang “sa buong mundo” ay natural na tumutukoy sa malawak na kinaroroonan ng pamayanan.
- source_word: ἐπιτελεῖσθαι
  choice: ay dinaranas
  rationale: Sa konteksto, malinaw at natural nitong ipinahahayag na ang parehong mga pagdurusa ay nangyayari sa mga kapwa mananampalataya, habang inilalagay sa talababa ang mas pormal na posibilidad ng pagkaganap o pagkalubos.
theological_decisions:
- issue: Saklaw ng τῇ πίστει
  choice: sa pananampalataya
  alternative: sa pananalig; matatag sa pananampalatayang pinanghahawakan
  rationale: Hindi ipinipilit kung ang diin ay nasa personal na pagtitiwala o sa pananampalatayang Kristiyano bilang pinanghahawakang katotohanan; kayang dalhin ng “pananampalataya” ang dalawang posibilidad.
- issue: Diwa ng ἐπιτελεῖσθαι
  choice: ay dinaranas
  alternative: ay nagaganap; ay nalulubos
  rationale: Ang “dinaranas” ang pinakaidiomatiko sa kaugnayan ng mga pagdurusa sa kapatiran, ngunit maaaring magpahiwatig ang pandiwa ng pagganap o pagkalubos; pinananatili ang tensiyong ito sa talababa.
- issue: Saklaw ng ἀδελφότητι
  choice: kapatiran
  alternative: pamilya ng mga mananampalataya; mga kapatid sa pananampalataya
  rationale: Ang salitang Griyego ay kolektibong tumutukoy sa buong pamayanan ng magkakapatid sa pananampalataya, hindi lamang sa mga lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “labanan” at “matatag” para sa tuwiran at matibay na himig ng pangaral. Pinanatili ang “kapatiran” bilang kolektibong larawang pampamilya, na may paliwanag upang matiyak ang inklusibong saklaw nito.
