base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: tl
  text: Kaya magpakumbaba kayo[a] sa ilalim ng makapangyarihang kamay ng Diyos, upang itaas niya kayo sa takdang panahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Magpakababa kayo.” Pasibo ang anyo ng utos sa Griyego, bagaman karaniwan itong nauunawaan dito na may pansariling diwa: “magpakumbaba kayo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: magpakumbaba kayo
  rationale: Bagaman pasibo ang anyong Griyego, karaniwan itong nauunawaan dito na may pansarili o middle na diwa. Natural sa modernong Tagalog ang “magpakumbaba kayo” at malinaw nitong naipapahayag ang utos.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang lohikal na bunga ng naunang pahayag tungkol sa pagtutol ng Diyos sa mapagmataas at pagbibigay niya ng biyaya sa mapagpakumbaba.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: sa ilalim ng makapangyarihang kamay
  rationale: Pinananatili nito ang biblikal na larawang tumutukoy sa makapangyarihan at nangingibabaw na pagkilos ng Diyos.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinakikilala kung kanino ang makapangyarihang kamay.
- source_word: ἵνα
  choice: upang
  rationale: Natural at marangal na panandang nagpapahayag ng layunin o resultang nilalayon.
- source_word: ὑμᾶς ὑψώσῃ
  choice: itaas niya kayo
  rationale: Ang ipinahihiwatig na gumagawa ay ang Diyos. Ang “itaas” ay nagpapanatili sa diwa ng pagbibigay ng karangalan o pagpapatunay sa mapagpakumbaba nang hindi nililimitahan ito sa pisikal na pag-angat.
- source_word: ἐν καιρῷ
  choice: sa takdang panahon
  rationale: Ipinahihiwatig ng καιρός ang angkop o itinakdang panahon, hindi lamang pangkalahatang paglipas ng oras.
theological_decisions:
- issue: Tinig at gumagawa sa Ταπεινώθητε
  choice: Isinalin bilang “magpakumbaba kayo,” habang pinananatili ang “sa ilalim ng makapangyarihang kamay ng Diyos.”
  alternative: “Magpakumbaba kayo” maaari ring unawain ayon sa literal na pasibong anyo bilang “hayaan ninyong kayo ay ibaba” o “magpasakop kayong mapakumbaba.”
  rationale: 'Natural sa Tagalog ang pansariling anyo, ngunit mahalagang hindi mawala ang tensiyon sa Griyego: may pananagutan ang mga mambabasa na magpakumbaba, at ginagawa nila ito sa pagpapasakop sa makapangyarihang pagkilos ng Diyos. Ang talababa ang nagpapanatili sa tunay na alternatibong dulot ng pasibong anyo.'
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kaya” bilang karaniwang panandang lohikal, at pinanatili ang pamilyar na biblikal na larawang “makapangyarihang kamay ng Diyos.”
