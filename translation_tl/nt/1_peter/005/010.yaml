    issue: Hindi malinaw ang layon ng “magpapanumbalik sa inyo.”
    rationale: Sa Tagalog, ang konstruksiyong ito ay madaling unawain bilang ‘magpapanumbalik ng bagay sa inyo,’ samantalang ang καταρτίσει ay tumutukoy sa pagpapanumbalik o pag-aayos sa mga mambabasa mismo.
  - severity: low
    issue: Ang “ang siya mismong” ay hindi likas na pambungad sa sunod-sunod na pandiwa.
    rationale: Mas malinaw at natural ang “siya mismo ang kikilos,” na nagdadala ng emphatic αὐτός sa buong listahan ng mga kilos.
  - severity: low
    issue: Ang “Cristo” ay transliterasyon ng titulong Χριστός.
    rationale: Ang “Mesiyas” ay mas tahasang nagsasalin ng titulo at tumutugma sa napiling rendering sa English POB; itinatala pa rin ang “Cristo” bilang tradisyonal na anyo.
