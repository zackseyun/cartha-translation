revisions:
- from: Ngunit ang Diyos ng lahat ng biyaya, na tumawag sa inyo tungo sa kanyang walang-hanggang kaluwalhatian kay Cristo, matapos kayong magdusa nang kaunting panahon, ang siya mismong magpapanumbalik sa inyo, magpapatatag, magpapalakas, at maglalagay sa inyo sa matibay na saligan.[a]
  to: 'Ngunit ang Diyos ng lahat ng biyaya, na tumawag sa inyo tungo sa kanyang walang-hanggang kaluwalhatian kay Mesiyas,[a] matapos kayong magdusa nang kaunting panahon, siya mismo ang kikilos: ibabalik niya kayo sa wastong kalagayan,[b] patatatagin niya kayo, palalakasin niya kayo, at ilalagay niya kayo sa matibay na pundasyon.[c]'
  rationale: Nilinaw ang sintaks upang ang Diyos mismo ang malinaw na gumagawa sa mga mambabasa, hindi nagbabalik ng isang bagay sa kanila. Pinanatili ang temporal na ugnayan ng maikling pagdurusa at ng susunod na pagkilos ng Diyos, ang diin ng αὐτός, at ang magkakaibang diin ng pagpapanumbalik, pagpapatatag, pagpapalakas, at pagtatatag sa pundasyon. Inayos din ang mga talababa upang may malinaw na angkla ang bawat leksikal o terminolohikal na alternatibo.
