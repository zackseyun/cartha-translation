  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: tl
  text: 'Ngunit ang Diyos ng lahat ng biyaya, na tumawag sa inyo tungo sa kanyang walang-hanggang kaluwalhatian kay Mesiyas,[a] matapos kayong magdusa nang kaunting panahon, siya mismo ang kikilos: ibabalik niya kayo sa wastong kalagayan,[b] patatatagin niya kayo, palalakasin niya kayo, at ilalagay niya kayo sa matibay na pundasyon.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Cristo.” Ang Griyegong Χριστός ay isang titulo na maaaring isalin bilang “Mesiyas” o gamitin sa tradisyonal na anyong “Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “gagawin niyang ganap” o “bubuuin.” Kasama sa pandiwa ang diwa ng pagpapanumbalik sa wastong kalagayan.
    reason: lexical_alternative
  - marker: c
    text: O “ilalagay niya kayo sa pundasyon” o “itatatag niya kayo sa isang matibay na pundasyon.” Gumagamit ang Griyego ng larawang may kinalaman sa pundasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: ng lahat ng biyaya
  rationale: Pinananatili ang malawak at sumasaklaw na diwa ng pariralang Griyego sa likas na Tagalog.
- source_word: καλέσας
  choice: na tumawag
  rationale: Ang aorist participle ay likas na naipapahayag bilang sugnay na nasa nakaraan.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: tungo sa kanyang walang-hanggang kaluwalhatian
  rationale: Ipinahahayag ng “tungo sa” ang direksiyon ng εἰς nang hindi ipinipilit na ang tinutukoy ay pagpasok na ganap nang natupad.
- source_word: ἐν Χριστῷ
  choice: kay Cristo
  rationale: Ang “kay Cristo” ang likas na anyong Tagalog para sa ugnayang ipinahahayag ng karaniwang pariralang Paulino/Petrino na ἐν Χριστῷ; pinananatili rin nito ang nakaugaliang titulong Cristo.
- source_word: ὀλίγον παθόντας
  choice: matapos kayong magdusa nang kaunting panahon
  rationale: Itinuturing ang ὀλίγον na pananda ng maikling tagal at ginagawang malinaw ang temporal na kaugnayan sa susunod na mga kilos ng Diyos.
- source_word: αὐτὸς
  choice: ang siya mismong
  rationale: Pinananatili ang diin na ang Diyos mismo ang personal na kikilos.
- source_word: καταρτίσει
  choice: magpapanumbalik sa inyo
  rationale: Ipinahahayag ang pag-aayos o pagbabalik sa wastong kalagayan; ang posibilidad na “gawing ganap” ay inilalagay sa talababa.
- source_word: στηρίξει
  choice: magpapatatag
  rationale: Direkta at likas na ipinahahayag ang paggawa sa mga mambabasa na maging matatag.
- source_word: σθενώσει
  choice: magpapalakas
  rationale: Pinananatili ang tuwirang diwa ng pagbibigay-lakas at ang pagkakaiba nito sa pagpapatatag.
- source_word: θεμελιώσει
  choice: maglalagay sa inyo sa matibay na saligan
  rationale: Malinaw na pinananatili ang larawang may kinalaman sa pundasyon na taglay ng pandiwang Griyego.
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ
  choice: kay Cristo
  alternative: sa Mesiyas; sa pamamagitan ni Cristo
  rationale: Hindi tiyak na instrumento ang ἐν; pinananatili ng “kay Cristo” ang malawak na relasyonal o pakikipagkaisang diwa nang hindi ito nililimitahan sa “sa pamamagitan.”
- issue: Kaugnayan ng pagdurusa at pagkilos ng Diyos
  choice: matapos kayong magdusa nang kaunting panahon
  alternative: pagkatapos ninyong magdusa sandali; kayong nagdusa nang kaunti
  rationale: Ipinakikita ang malamang na temporal na pagkakasunod ngunit hindi nagdaragdag ng paliwanag kung bakit kinakailangan ang pagdurusa.
- issue: Saklaw ng καταρτίσει
  choice: magpapanumbalik
  alternative: gagawing ganap; bubuuin
  rationale: Ang konteksto ng pagdurusa ay pumapabor sa pagpapanumbalik, ngunit tunay na kasama sa saklaw ng salita ang paghubog tungo sa pagiging buo o ganap, kaya tinatala ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “walang-hanggang,” “magpapanumbalik,” at “matibay na saligan” upang maging malinaw nang hindi nawawala ang teolohikal at metaporikal na bigat ng Griyego.
