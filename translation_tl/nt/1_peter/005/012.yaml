  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: tl
  text: Sa pamamagitan ni Silvano[a], ang tapat na kapatid ayon sa pagkakilala ko sa kanya, sumulat ako sa inyo nang maikli, hinihikayat kayo at pinatutunayan na ito ang tunay na biyaya ng Diyos. Manindigan kayong matatag sa biyayang ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Sumulat ako sa inyo sa kakaunting salita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ganito sa ilang manuskrito: “Dito kayo naninindigan,” sa halip na “Manindigan kayong matatag sa biyayang ito.”'
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Sa pamamagitan ni Silvano
  rationale: Ang διά na may genitive ay nagpapahayag ng tagapamagitan o kasangkapan. Pinananatili nito ang posibilidad na si Silvano ang tagapagdala o tumulong sa pagsulat nang hindi tiyak na itinatakda ang kaniyang papel.
- source_word: Σιλουανοῦ
  choice: Silvano
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang Griyego na Silouanos, sa halip na gamitin ang kaugnay ngunit ibang anyong Silas.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: tapat na kapatid
  rationale: Ang πιστός ay maaaring mangahulugang tapat o mapagkakatiwalaan. Ang “tapat” ay natural na papuri rito, at ang “kapatid” ay angkop sa tiyak na lalaking tinutukoy.
- source_word: ὡς λογίζομαι
  choice: na itinuturing kong
  rationale: Ipinahahayag nito ang personal na pagkilala o pagtataya ni Pedro kay Silvano. Ang mga gitling ay malinaw na nagtatakda sa pariralang paningit.
- source_word: δι’ ὀλίγων
  choice: nang maikli
  rationale: Natural na Filipino para sa idyomang nangangahulugang sumulat sa maikling paraan o sa kakaunting salita.
- source_word: ἔγραψα
  choice: sumulat ako
  rationale: Ang epistolary aorist ay natural na maisalin sa Filipino bilang payak na naganap na kilos; hindi kailangang piliting tularan ang aspekto ng pandiwang Ingles.
- source_word: παρακαλῶν
  choice: upang palakasin ang inyong loob
  rationale: Sa kontekstong pastoral, saklaw ng παρακαλέω ang pagpapalakas-loob at masidhing paghikayat. Ang pariralang ito ay natural at nananatiling seryoso.
- source_word: ἐπιμαρτυρῶν
  choice: patotohanan
  rationale: Pinananatili nito ang diwa ng taimtim na pagpapatunay o pagbibigay-saksi, hindi lamang simpleng pagsang-ayon.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: na ito ang tunay na biyaya ng Diyos
  rationale: Tuwirang pinananatili ang panghalip na “ito,” ang katangiang “tunay,” at ang kaugnayan ng biyaya sa Diyos nang hindi nililimitahan ang saklaw ng tinutukoy.
- source_word: εἰς ἣν στῆτε
  choice: Manindigan kayong matatag dito
  rationale: Ang στῆτε sa ibinigay na teksto ay pautos at humihingi ng matatag na pananatili. Ang “dito” ay tumutukoy pabalik sa biyaya at natural na naghahatid ng diwa ng εἰς sa kontekstong ito.
theological_decisions:
- issue: Tinutukoy ng “ito” sa “ito ang tunay na biyaya ng Diyos”
  choice: 'Pinanatiling malawak ang saklaw: maaaring tumukoy sa nilalaman ng sulat at patotoo ni Pedro tungkol sa biyaya ng Diyos.'
  alternative: Maaaring mas makitid na tumukoy sa kasalukuyang karanasan ng mga mambabasa sa biyaya o sa mensaheng inihatid sa pamamagitan ni Silvano.
  rationale: Ang konteksto ng pagsulat, pagpapalakas-loob, at pagpapatotoo ay sumusuporta sa nilalaman ng sulat bilang pangunahing tinutukoy, ngunit hindi ito nililinaw nang higit sa sinabi ng Griyego.
- issue: Puwersa ng pangwakas na στῆτε
  choice: 'Pautos: “Manindigan kayong matatag dito.”'
  alternative: 'Paturol ayon sa ilang manuskrito: “Dito kayo naninindigan.”'
  rationale: Ang SBLGNT na ibinigay ay may pautos na στῆτε. Inilalagay sa talababa ang mahalagang tekstuwal na variant upang hindi maitago ang ibang sinaunang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Silvano” bilang karaniwang anyong Filipino ng pangalan. Pinanatili ang teolohikal na kalabuan ng “ito,” at ang mga talababa [a] at [b] ay kapuwa minarkahan sa pangunahing teksto.
