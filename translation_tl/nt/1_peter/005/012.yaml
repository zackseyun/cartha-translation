revisions:
- from: Sa pamamagitan ni Silvano[a]—na itinuturing kong tapat na kapatid—sumulat ako sa inyo nang maikli upang palakasin ang inyong loob at patotohanan na ito ang tunay na biyaya ng Diyos. Manindigan kayong matatag dito.[b]
  to: Sa pamamagitan ni Silvano[a], ang tapat na kapatid ayon sa pagkakilala ko sa kanya, sumulat ako sa inyo nang maikli, hinihikayat kayo at pinatutunayan na ito ang tunay na biyaya ng Diyos. Manindigan kayong matatag sa biyayang ito.[b]
  rationale: Pinalitan ang pariralang nakatuon lamang sa pagpapalakas-loob ng mas malawak at mas tapat na “hinihikayat kayo,” habang pinanatili ang hiwalay na puwersa ng ἐπιμαρτυρῶν sa “pinatutunayan.” Nilinaw ang tinutukoy ng pangwakas na panghalip bilang biyaya, at ginawang tuwiran ang leksikal na alternatibo sa talababa [a]. Ang tekstuwal na variant sa [b] ay pinanatili nang hindi binabago ang pangunahing pagbasa ng SBLGNT.
