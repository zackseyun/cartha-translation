base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: tl
  text: Igalang ninyo ang lahat ng tao; mahalin ninyo ang kapatiran[a]; matakot kayo sa Diyos; igalang ninyo ang hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatiran” ay tumutukoy sa komunidad ng mga kapwa mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: O “emperador.” “Hari” ang salitang Griyego, ngunit sa kontekstong Romano ni Pedro, malamang na tumutukoy ito sa emperador.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: ang lahat
  rationale: Ang substantibong gamit ng πᾶς ay sumasaklaw sa lahat ng tao. Likas at maikli sa Tagalog ang “ang lahat” sa kontekstong ito.
- source_word: τιμήσατε / τιμᾶτε
  choice: igalang ninyo
  rationale: Pinananatili ang pag-uulit ng iisang pandiwang τιμάω sa simula at wakas. Mas angkop ang “igalang” kaysa sa mas mahinang “respetuhin,” at natural ang tahasang maramihang pautos na “ninyo.”
- source_word: ἀδελφότητα
  choice: ang kapatiran
  rationale: Tumutukoy ang ἀδελφότης sa kabuuang komunidad ng magkakapatid sa pananampalataya. Pinananatili ng “kapatiran” ang pampamilya at pangkalahatang diwa ng salita nang hindi ito pinahahaba sa pangunahing teksto.
- source_word: ἀγαπᾶτε
  choice: mahalin ninyo
  rationale: Karaniwan, malinaw, at kasalukuyang Tagalog ito para sa pautos ng ἀγαπάω. Hindi kailangang tahasang idagdag ang “patuloy” sapagkat hindi iyon binibigyang-diin ng maikling serye ng mga utos.
- source_word: τὸν θεὸν φοβεῖσθε
  choice: matakot kayo sa Diyos
  rationale: Direktang pinananatili ng “matakot” ang lakas ng φοβέομαι at ang pagkakaiba nito sa paggalang na iniutos para sa lahat at sa hari.
- source_word: τὸν βασιλέα
  choice: ang hari
  rationale: Ang pangunahing kahulugan ng βασιλεύς ay “hari.” Bagaman malamang na emperador ng Roma ang tinutukoy sa konteksto ni Pedro, hindi iyon ipinapalit sa mismong salita ng teksto; inilalahad ito sa talababa.
theological_decisions:
- issue: Pagkakaiba ng nararapat na tugon sa Diyos at sa pinunong sibil
  choice: “matakot kayo sa Diyos” ngunit “igalang ninyo ang hari”
  alternative: “igalang nang lubos ang Diyos” at “respetuhin ang hari”
  rationale: 'Sinasadya ng Griyego ang magkaibang pandiwa: φοβέομαι para sa Diyos at τιμάω para sa hari. Pinananatili ng salin ang mas mabigat na tugon sa Diyos nang hindi nagdaragdag ng isang mas malawak na teolohiyang pampolitika.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang magkakatulad na hulma ng apat na pautos at pinanatili ang pag-uulit ng “igalang.” Ang mga tuldok-kuwit ay nagpapakita ng balanseng serye ng maiikling utos.
