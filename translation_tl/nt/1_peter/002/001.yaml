  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: tl
  text: Kaya, matapos ninyong iwaksi[a] ang lahat ng masamang kalooban, lahat ng panlilinlang, lahat ng pagkukunwari, lahat ng inggit, at lahat ng pananalitang naninira sa kapwa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinantabi” o “hubarin.” Ang salitang Griyego ay maaaring gamitin sa pag-aalis o paghuhubad ng isang bagay at dito ay tumutukoy sa pagtatakwil sa masasamang asal.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “lahat ng masamang pagsasalita laban sa iba.” Malawak ang tinutukoy ng salitang Griyego: pananalitang naninira o nagsasalita laban sa kapwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: matapos ninyong iwaksi
  rationale: Ang aorist participle ay naghahayag ng paghahandang kilos na kaugnay ng pangunahing pautos sa talata 2. Pinananatili ng pariralang ito ang diwang nauna o naisagawa na ang pag-aalis, nang hindi ito ginagawang hiwalay na pangunahing pautos.
- source_word: οὖν
  choice: Kaya
  rationale: Likas at malinaw na ipinahihiwatig ng “Kaya” ang kongklusyon o bunga mula sa naunang konteksto, lalo na sa 1:22–25.
- source_word: πᾶσαν κακίαν
  choice: ang lahat ng masamang hangarin
  rationale: Sa konteksto ng talaan ng mga bisyong nakapipinsala sa kapwa, ipinahahayag nito ang masamang kalooban o hangarin, hindi lamang ang pangkalahatang konsepto ng kasamaan.
- source_word: πάντα δόλον
  choice: lahat ng panlilinlang
  rationale: Ang δόλος ay mapanlinlang o tusong pagkilos. Ang “panlilinlang” ay malinaw, kasalukuyan, at natural sa Filipino.
- source_word: ὑποκρίσεις
  choice: pagkukunwari
  rationale: Natural na pangngalang di-mabilang sa Filipino ang “pagkukunwari.” Bagaman hindi hayag ang anyong maramihan, saklaw ng kayarian ng pangungusap ang lahat ng anyo o pagkakataon nito.
- source_word: φθόνους
  choice: lahat ng pagkainggit
  rationale: Tumpak na inilalarawan ng “pagkainggit” ang masamang pagnanais dahil sa kabutihang tinatamasa ng iba. Ipinahihiwatig ng “lahat” ang saklaw ng maramihang anyo sa Griyego.
- source_word: πάσας καταλαλιάς
  choice: lahat ng paninira sa kapwa
  rationale: Ang καταλαλιά ay malawak na tumutukoy sa mapanirang pagsasalita laban sa iba. Nililinaw ng “sa kapwa” ang tuon nito nang hindi nililimitahan sa legal na kahulugan ng paninirang-puri.
theological_decisions:
- issue: Saklaw ng talaan ng mga bisyo
  choice: Isalin nang kongkreto ang bawat bisyo at panatilihin ang tuon sa mga asal na nakapipinsala sa kapwa.
  alternative: Isalin ang κακία bilang pangkalahatang “kasamaan” at ang καταλαλιάς bilang “masamang pananalita.”
  rationale: Ang talata ay isang etikang pangaral. Ang piniling mga salita ay nagpapanatili sa kongkretong lakas ng talaan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ugnayan ng participle sa pangunahing pautos ng talata 2
  choice: Gamitin ang “matapos ninyong iwaksi” bilang naghahandang kilos.
  alternative: Gawing tuwirang pautos na “iwaksi ninyo.”
  rationale: Pinananatili ng napiling anyo ang gramatikal na pagdepende ng Ἀποθέμενοι sa pangunahing pautos na sumusunod sa talata 2, sa halip na lumikha ng hiwalay na pautos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “matapos ninyong” upang mapanatili ang participial at paghahandang katangian ng pambungad, kahit nagpapatuloy ang pangungusap sa talata 2. Ang mga pangngalang “pagkukunwari” at “pagkainggit” ay likas na hindi minamarkahan para sa bilang sa Filipino; ipinahihiwatig ng “lahat” ang kabuuang saklaw. Pinanatili ang kuwit sa dulo dahil nagpapatuloy ang sintaks sa kasunod na talata.
