translation:
  language: tl
  text: na hindi gumawa ng kasalanan,[b] at walang pandarayang natagpuan sa kanyang bibig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panlilinlang”; ang salitang Griyego ay maaaring tumukoy sa daya, pandaraya, o pagtataksil.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang ito ay umaalingawngaw sa Isaias 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: Siya ay
  rationale: Tumutukoy ang panghalip na ito kay Cristo sa naunang talata. Ang “Siya ay” ay natural sa Filipino at maayos na nagdurugtong sa paglalarawan sa kanya.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: hindi gumawa ng kasalanan
  rationale: Pinananatili nito ang anyong malapit sa Griyego at ang maringal na himig ng pahiwatig sa Isaias 53:9, habang malinaw pa rin sa makabagong Filipino.
- source_word: οὐδὲ
  choice: at walang
  rationale: Likas na ipinagdurugtong nito sa Filipino ang ikalawang negatibong sugnay nang hindi binabago ang koordinadong pagtanggi sa Griyego.
- source_word: εὑρέθη
  choice: natagpuan
  rationale: Pinananatili ang balintiyak na anyo ng Griyego at iniiwasang magdagdag ng hindi tinukoy na tagaganap.
- source_word: δόλος
  choice: pandarayang
  rationale: Ang “pandaya” ay kasalukuyan at madaling maunawaang salita para sa panlilinlang, daya, o tusong pagsisinungaling; ang anyong may pang-angkop ay natural bago ang pandiwang “natagpuan.”
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: sa kanyang bibig
  rationale: Pinananatili ang larawang-katawan ng orihinal at ang pagkakatulad ng pananalita sa Isaias 53:9; hindi ito pinapakahulugang basta “sa kanyang sinabi.”
theological_decisions:
- issue: Ang paglalarawan sa kawalang-kasalanan at katapatan ni Cristo ay umaalingawngaw sa Isaias 53:9.
  choice: Panatilihin ang “hindi gumawa ng kasalanan” at “walang pandarayang natagpuan sa kanyang bibig.”
  alternative: “Hindi siya kailanman nagkasala ni nagsalita nang may pandaraya.”
  rationale: Ang mas malapit na anyo ay nagpapanatili sa ugnayan sa Isaias at sa balintiyak na pananalita ng teksto, nang hindi nagpapalawak o tahimik na nagpapakahulugan sa pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na hulma at ang metapora ng “bibig” upang maipakita ang pahiwatig sa Isaias nang hindi nagiging lipas o labis na paraprasis.
