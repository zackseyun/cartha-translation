id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: tl
  text: Ngunit kayo ay lahing pinili[a], maharlikang pagkasaserdote, bansang banal, at bayang sariling pag-aari ng Diyos, upang maipahayag ninyo ang mga kadakilaan[b] ng tumawag sa inyo mula sa kadiliman tungo sa kanyang kamangha-manghang liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “piniling angkan” o “piniling sambayanan.” Ang salitang Griyego ay maaaring tumukoy sa lahi, angkan, o isang bayang may magkakaugnay na pagkakakilanlan; hindi nito kinakailangang tukuyin ang isang makabagong kategoryang etniko.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kapuri-puring katangian” o “mga dakilang gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Ngunit kayo
  rationale: Ipinapanatili ng “ngunit” ang paghahambing sa naunang paglalarawan, at ng tahasang “kayo” ang diin ng panghalip na Griyego.
- source_word: γένος ἐκλεκτόν
  choice: lahing pinili
  rationale: Saklaw ng γένος ang lahi, angkan, o sambayanan. Ang “lahing pinili” ay tuwirang nagpapanatili sa kolektibong pagkakakilanlan at ugnayang pampamilya nang hindi ito nililimitahan sa makabagong kategoryang etniko.
- source_word: βασίλειον ἱεράτευμα
  choice: maharlikang pagkasaserdote
  rationale: Pinananatili nito ang dalawang sangkap ng parirala—ang makahari o maharlikang katangian at ang sama-samang tungkulin bilang mga saserdote—kasabay ng alingawngaw ng Exodo 19:6.
- source_word: ἔθνος ἅγιον
  choice: bansang banal
  rationale: Tuwiran at likas na salin ito na nagpapanatili sa diwa ng pagiging inilaan at ibinukod para sa Diyos.
- source_word: λαὸς εἰς περιποίησιν
  choice: bayang sariling pag-aari ng Diyos
  rationale: Ipinahahayag ng περιποίησις ang natatanging pag-aari o pag-angkin. Ginawang tahasan ang Diyos bilang nagmamay-ari sapagkat malinaw siya ang tinutukoy sa konteksto.
- source_word: ὅπως
  choice: upang
  rationale: Malinaw at likas na ipinapakita ng “upang” ang layuning ipinahahayag ng ὅπως.
- source_word: τὰς ἀρετὰς
  choice: mga kadakilaan
  rationale: Pinananatili ng “mga kadakilaan” ang lawak ng ἀρεταί, na maaaring tumukoy sa mga kapuri-puring katangian at, ayon sa konteksto, sa mga dakilang gawa ng Diyos.
- source_word: ἐξαγγείλητε
  choice: maipahayag ninyo
  rationale: Ipinahihiwatig nito ang hayagan at malawakang pagpapahayag na taglay ng ἐξαγγέλλω, at akma ang anyong pandiwa sa sugnay ng layunin.
- source_word: τοῦ ... καλέσαντος
  choice: ng tumawag
  rationale: Pinananatili ang paraang pagkilala sa Diyos sa pamamagitan ng kanyang ginawa, nang hindi idinaragdag ang kanyang pangalan sa bahaging hindi ito tahasang nasa Griyego.
- source_word: ἐκ σκότους
  choice: mula sa kadiliman
  rationale: Inilalarawan nito ang paglabas mula sa isang kalagayan o saklaw, gaya ng ipinahihiwatig ng ἐκ.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: tungo sa kanyang kamangha-manghang liwanag
  rationale: Pinananatili ng “tungo sa” ang galaw patungo sa bagong saklaw, at ng “kamangha-manghang” ang mataas at mapagpuring himig ng θαυμαστόν.
theological_decisions:
- issue: Ang mga titulong pangtipan na dating ginamit para sa Israel
  choice: Panatilihin nang tuwiran ang kolektibong mga katawagang “lahing pinili,” “maharlikang pagkasaserdote,” at “bansang banal.”
  alternative: Gawing mas abstrakto o ituring lamang na paghahambing ang mga katawagan.
  rationale: Sadyang ginagamit ng talata para sa mga mambabasa ni Pedro ang wikang pangtipan mula sa Lumang Tipan. Pinananatili ng salin ang tensiyong teolohikal nito nang hindi nagpapasya para sa isang mas malawak na sistemang teolohikal.
- issue: Ang hindi tahasang pinangalanang nagmamay-ari sa λαὸς εἰς περιποίησιν
  choice: 'Tukuyin bilang Diyos ang nagmamay-ari: “bayang sariling pag-aari ng Diyos.”'
  alternative: Iwan itong “bayang ukol sa pag-aari” o gumamit ng panghalip na maaaring maging malabo.
  rationale: Bagaman walang tahasang pangngalang “Diyos” sa mismong parirala, malinaw sa konteksto na siya ang tinutukoy. Kailangan ang paglilinaw upang maging likas at hindi malabo sa Tagalog, ngunit hindi ito nagdaragdag ng hiwalay na aral.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at sunod-sunod na mga titulong kolektibo ng tekstong Griyego. Ginamit ang “pagkasaserdote” sa halip na “kaparian” upang hindi magpahiwatig ng isang partikular na institusyong denominasyonal; ginamit naman ang “Diyos” sa parirala ng pag-aari para sa kinakailangang kalinawan sa Tagalog.
