source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: tl
  text: 'Sapagkat ganito ang nasusulat sa Kasulatan: “Tingnan ninyo, naglalagay ako sa Sion ng isang pinili at mahalagang batong-panulok[a], at ang sumasampalataya sa kanya[b] ay tiyak na hindi mapapahiya[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinili at marangal na batong-panulok.” Ang salitang Griyego ay maaaring tumukoy kapuwa sa karangalan at sa mataas na halaga.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “sa batong ito,” ayon sa larawan ng bato. Ang “sa kanya” ay nagpapakita ng paglalapat ni Pedro sa batong ito kay Cristo sa nakapaligid na konteksto.
    reason: alternative_reading
  - marker: c
    text: O “ay hinding-hindi mapapahiya.” Mariin ang pagtanggi sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang patunay mula sa Kasulatan para sa naunang pahayag.
- source_word: περιέχει ἐν γραφῇ
  choice: ganito ang nasusulat sa Kasulatan
  rationale: Likas na idyomang Filipino para sa impersonal na Griyegong pahayag, habang pinananatili ang diwang ang sipi ay matatagpuan sa Kasulatan.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pinananatili ang mariing panawagan na bigyang-pansin ang propetikong pahayag sa paraang malinaw sa modernong Filipino.
- source_word: τίθημι
  choice: naglalagay ako
  rationale: Tuwirang inilalarawan ang paglalagay ng bato sa larawang panggusali; ang aspektong di-ganap ng Filipino ay angkop sa kasalukuyang anyo ng Griyego.
- source_word: ἐν Σιὼν
  choice: sa Sion
  rationale: Ang “sa” ang likas na locative na katumbas sa Filipino.
- source_word: λίθον ἀκρογωνιαῖον
  choice: batong-panulok
  rationale: Karaniwan at malinaw na terminong Filipino para sa cornerstone sa larawang panggusali.
- source_word: ἐκλεκτὸν
  choice: pinili
  rationale: Malinaw na nagpapahayag ng pagpili nang hindi gumagamit ng teknikal na katawagang teolohikal.
- source_word: ἔντιμον
  choice: pinarangalan
  rationale: Itinatampok ang kahulugan ng karangalan at umaayon sa temang “karangalan” sa kasunod na talata; maaari rin itong tumukoy sa mataas na halaga.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: ang sumasampalataya sa kanya
  rationale: Pinananatili ang wika ng pananampalataya at ang personal na aplikasyon ni Pedro sa bato bilang tumutukoy kay Cristo.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ay tiyak na hindi mapapahiya
  rationale: Ang “tiyak na hindi” ay naghahatid ng mariing dobleng pagtanggi ng Griyego, at ang “mapapahiya” ay tuwirang tumutugma sa pandiwa.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῷ sa sipi mula sa Isaias ayon sa paggamit ni Pedro
  choice: personal na “sa kanya”
  alternative: “dito” o “rito,” na tumutukoy nang mas mahigpit sa bato
  rationale: Bagaman bato ang larawan, malinaw na inilalapat ni Pedro ang teksto kay Cristo sa 1 Pedro 2:4–8. Pinananatili ng “sa kanya” ang personal na aplikasyon nang hindi inaalis ang metapora.
- issue: Kahulugan ng ἔντιμον
  choice: pinarangalan
  alternative: mahalaga o mamahalin
  rationale: Saklaw ng salita ang karangalan at mataas na halaga. Pinili ang “pinarangalan” dahil mahalaga ang tema ng karangalan sa agarang konteksto, habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kasulatan” at “Sion” bilang pamilyar na katawagang biblikal; iniwasan ang sobrang arkaikong “Narito” at pinili ang malinaw na “Tingnan ninyo.”
