  to: 'Sapagkat ganito ang nasusulat sa Kasulatan: “Tingnan ninyo, naglalagay ako sa Sion ng isang pinili at mahalagang batong-panulok[a], at ang sumasampalataya sa kanya[b] ay tiyak na hindi mapapahiya[c].”'
  rationale: Inayos ang anyo at saklaw ng katumbas ng ἔντιμον at itinuwid ang alternatibong pagsasalin ng αὐτῷ sa talababa. Walang binago sa kahulugan ng sipi, sa personal na aplikasyon nito sa konteksto ni Pedro, o sa mariing negatibong pangako.
