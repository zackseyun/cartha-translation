base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: tl
  text: Kayong mga alipin sa sambahayan[a], magpasakop kayo sa inyong mga amo nang buong paggalang[b], hindi lamang sa mabubuti at mahinahon kundi pati sa mga baluktot ang ugali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod sa sambahayan.” Ang salitang Griyego ay tumutukoy sa mga alipin o lingkod na nasa loob ng isang sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nang may buong takot”; maaari rin itong mangahulugan dito ng lubos na pagpipitagan o paggalang.
    reason: lexical_alternative
  - marker: c
    text: O “malupit” o “di-makatarungan.” Ang salitang Griyego ay literal na nangangahulugang “baluktot” o “pilipit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: mga aliping naglilingkod sa sambahayan
  rationale: Tinutukoy ng salita ang mga aliping nakatalaga sa paglilingkod sa loob ng sambahayan. Pinananatili ng saling ito kapwa ang kanilang kalagayang hindi malaya at ang tiyak na kontekstong pantahanan.
- source_word: ὑποτασσόμενοι
  choice: magpasakop kayo
  rationale: Bagaman participle ang anyo, gumaganap ito bilang utos sa konteksto. Ang “magpasakop kayo” ay natural sa makabagong Tagalog at malinaw na naghahatid ng panawagan.
- source_word: ἐν παντὶ φόβῳ
  choice: nang may buong paggalang
  rationale: Maaaring mangahulugan ang φόβος ng takot, pagpipitagan, o paggalang. Sa kontekstong ito, ipinahahayag ng parirala ang lubos na mapitagang pakikitungo nang hindi ipinapalagay na sindak ang tiyak na diwa.
- source_word: δεσπόταις
  choice: mga amo
  rationale: Ang “amo” ang natural na katawagan sa Tagalog para sa may kapangyarihan sa mga alipin o lingkod sa sambahayan, at iniiwasan nito ang posibleng kalituhan ng “panginoon” sa pagtukoy sa Diyos.
- source_word: ἀγαθοῖς
  choice: mabubuti
  rationale: Tuwirang pinananatili nito ang malawak na moral na diwa ng ἀγαθός at malinaw itong kaiba sa kasunod na katangian.
- source_word: ἐπιεικέσιν
  choice: mapagparaya
  rationale: Saklaw ng ἐπιεικής ang pagiging mahinahon, makatuwiran, at hindi mapamilit sa paggamit ng kapangyarihan. Ang “mapagparaya” ay natural at angkop sa paglalarawan sa pagtrato ng amo.
- source_word: σκολιοῖς
  choice: mga baluktot ang ugali
  rationale: Pinananatili nito ang metaporang “baluktot” ng salitang Griyego habang nililinaw na ugali o asal ng mga amo ang tinutukoy; hindi nito nililimitahan ang diwa sa kalupitan lamang.
theological_decisions:
- issue: Paglalarawan sa katayuan ng οἰκέται nang hindi pinapahina ang realidad ng pagkaalipin o pinalalawak nang lampas sa sambahayan
  choice: mga aliping naglilingkod sa sambahayan
  alternative: mga lingkod sa sambahayan
  rationale: Maaaring mapalabo ng “mga lingkod” ang hindi malayang kalagayang panlipunan ng mga tinutukoy. Ang piniling salin ay tapat sa pagkaalipin at sa pantahanang saklaw ng termino.
- issue: Kung ang φόβος ay isasaling literal na “takot” o ayon sa kontekstuwal na diwa
  choice: nang may buong paggalang
  alternative: nang may lubos na takot
  rationale: Pinananatili ng “buong paggalang” ang mapitagang pagpapasakop na hinihingi ng teksto, samantalang ang “takot” lamang ay maaaring maling maunawaan bilang utos na masindak sa amo. Itinatala sa talababa ang literal na anyo upang mapanatili ang tunay na lawak ng salita.
- issue: Pagpapanatili sa metapora ng σκολιός nang hindi nilulutas ang diwa bilang kalupitan o kawalang-katarungan lamang
  choice: mga baluktot ang ugali
  alternative: mga malupit o di-makatarungan
  rationale: Ang metaporikong salin ay nagpapanatili sa malawak na hatol ng orihinal sa likong pagkatao o pakikitungo, habang inilalahad sa talababa ang mga posibleng kontekstuwal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “amo” bilang natural na katawagang panlipunan at ang “mga baluktot ang ugali” upang mapanatili ang matalinghagang lakas ng orihinal nang hindi nagiging malabo.
