  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: tl
  text: 'Sapagkat ito ang kalooban ng Diyos: sa paggawa ninyo ng mabuti, upang patahimikin ninyo ang kamangmangan ng mga taong hangal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “busalan ang kamangmangan ng mga taong hangal.” Literal na “busalan” ang pandiwa; ginamit ito rito bilang talinghaga para sa pagpapatigil sa salungat na pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan ng naunang tagubilin, kaya ang panandang sanhi na “Sapagkat” ang angkop.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: ito ang kalooban ng Diyos
  rationale: Natural at malinaw itong pagpapahayag sa Tagalog ng paraan o bagay na itinuturo bilang kalooban ng Diyos.
- source_word: ἀγαθοποιοῦντας
  choice: sa paggawa ninyo ng mabuti
  rationale: Ipinahahayag ng participle ang paraang ginagamit upang makamit ang kasunod na layunin.
- source_word: φιμοῦν
  choice: mapatahimik ninyo
  rationale: Ang literal na diwa ay “busalan,” ngunit ginagamit dito bilang talinghaga para sa pagpapatigil sa mapanirang o salungat na pananalita.
- source_word: ἀγνωσίαν
  choice: kamangmangan
  rationale: Tuwirang tumutukoy sa kawalan ng kaalaman o pagkaunawa; pinananatili rin nito ang abstraktong anyo ng Griyego.
- source_word: ἀφρόνων ἀνθρώπων
  choice: mga taong hangal
  rationale: Ang ἄφρων ay “hangal” o “walang unawa,” at generic ang ἀνθρώπων, kaya “mga tao” sa halip na panlalaking katawagan.
theological_decisions:
- issue: Generic na saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Hindi partikular sa kalalakihan ang tinutukoy kundi ang mga taong kumakalaban dahil sa kanilang kamangmangan.
- issue: Ugnayan ng paggawa ng mabuti at pagpapatahimik
  choice: sa paggawa ninyo ng mabuti ay mapatahimik ninyo
  alternative: habang gumagawa kayo ng mabuti, patahimikin ninyo
  rationale: 'Pinananatili ang instrumental na diwa ng participle: ang paggawa ng mabuti ang paraan upang mapatahimik ang kamangmangan, hindi hiwalay na utos ang pagpapatahimik.'
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mapatahimik” bilang natural na talinghagang katumbas, habang inilagay sa talababa ang mas literal na “mabusalan.”
