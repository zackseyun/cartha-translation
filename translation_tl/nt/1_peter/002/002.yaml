source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: tl
  text: Gaya ng mga sanggol na kasisilang pa lamang, manabik kayo sa dalisay na espirituwal na gatas[a], upang sa pamamagitan nito ay lumago kayo tungo sa kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalisay na makatuwirang gatas.” Ang salitang Griyego ay maaaring tumukoy sa nauukol sa katwiran o sa panloob na buhay; dito, malamang na tumutukoy ito sa pagkaing espirituwal sa halip na literal na gatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Gaya ng
  rationale: Likas na panandang Filipino para sa paghahambing; inilalarawan ang mga mambabasa na tulad ng mga sanggol, hindi bilang literal na mga sanggol.
- source_word: ἀρτιγέννητα βρέφη
  choice: mga sanggol na kasisilang pa lamang
  rationale: Pinananatili ang diin ng ἀρτιγέννητα sa napakakailang na kapanganakan at ang malinaw na larawan ng βρέφη.
- source_word: τὸ λογικὸν
  choice: espirituwal
  rationale: Sa talinghaga ng gatas, malinaw nitong ipinahihiwatig sa karaniwang mambabasa na hindi literal na gatas ang tinutukoy. Gayunman, dahil maaari ring mangahulugang nauukol sa katwiran o panloob na buhay ang λογικός, inilalahad ang mas literal na mga posibilidad sa talababa.
- source_word: ἄδολον
  choice: dalisay
  rationale: Ipinapahayag ang gatas na walang halo o pandaraya at likas itong gamitin sa Filipino para sa kadalisayan.
- source_word: γάλα
  choice: gatas
  rationale: Tuwirang pinananatili ang talinghaga ng pagkaing nagpapalago sa sanggol.
- source_word: ἐπιποθήσατε
  choice: manabik kayo sa
  rationale: Naghahatid ng masidhing paghahangad at nagpapanatili sa lakas ng pautos na anyo.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na ipinakikilala ang layunin ng pananabik sa gatas.
- source_word: ἐν αὐτῷ
  choice: sa pamamagitan nito
  rationale: Itinuturing ang gatas bilang paraan ng paglago at malinaw na ibinabalik dito ang panghalip.
- source_word: αὐξηθῆτε
  choice: lumago kayo
  rationale: Natural na Filipino para sa diwang pasibo ng pandiwa, nang hindi nagpapasok ng hindi likas na pahayag na 'mapalago kayo.'
- source_word: εἰς σωτηρίαν
  choice: tungo sa kaligtasan
  rationale: Pinananatili ang direksiyon o layuning ipinahahayag ng εἰς at hindi nilulutas kung paano nauugnay ang kasalukuyang paglago sa ganap na katuparan ng kaligtasan.
theological_decisions:
- issue: Kahulugan ng λογικός sa talinghaga ng gatas
  choice: espirituwal sa pangunahing teksto
  alternative: makatuwiran; nauukol sa katwiran o panloob na buhay
  rationale: Ang 'espirituwal' ay natural na nagpapakitang matalinghaga at hindi literal ang gatas, ngunit hindi tiyak na ito lamang ang saklaw ng salitang Griyego. Kaya pinananatili sa talababa ang mahalagang leksikal na kalabuan.
- issue: Puwersa ng εἰς σωτηρίαν
  choice: tungo sa kaligtasan
  alternative: para sa kaligtasan; hanggang sa kaligtasan
  rationale: Pinananatili ang galaw patungo sa kaligtasan nang hindi ipinapalagay na ang talata ay nagtuturo ng isang partikular na sistemang pangdoktrina tungkol sa pag-aaring-ganap, pagpapakabanal, o katiyakan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kasisilang pa lamang” upang buhayin ang larawan ng bagong silang na sanggol, “manabik” para sa masidhing pagnanais, at “tungo sa kaligtasan” upang mapanatili ang teolohikal na tensiyon ng pariralang Griyego.
