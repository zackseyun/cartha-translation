  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: tl
  text: Sapagkat dati kayong tulad ng mga tupang naliligaw[a]; ngunit ngayon ay nagbalik na kayo[b] sa Pastol at Tagapangasiwa[c] ng inyong mga kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pagala-gala” o “inililigaw.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin na “bumalik na kayo”; maaari ring unawain ang anyong Griyego na may pasibong diwa: “ibinalik na kayo.”'
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “Tagapagbantay”; ayon sa tradisyon, “Obispo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Sapagkat dati kayong
  rationale: Ipinahihiwatig ng γάρ ang dahilan o paliwanag na kaugnay ng naunang pahayag, at inilalarawan ng imperfect na ἦτε ang dati nilang kalagayan.
- source_word: ὡς πρόβατα
  choice: tulad ng mga tupa
  rationale: Ang ὡς ay naghahayag ng paghahambing, at ang πρόβατα ay maramihang anyo ng ‘tupa.’
- source_word: πλανώμενοι
  choice: naliligaw
  rationale: Napapanatili nito ang larawan ng mga tupang lumilihis o pagala-gala nang hindi tiyakang nagpapasiya kung may panlabas na kumikilos upang iligaw sila.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: ngunit ngayon ay nagbalik na kayo
  rationale: Malinaw na ipinakikita ng ἀλλά ang pagsalungat sa dating kalagayan. Ang ‘nagbalik na kayo’ ay likas sa Tagalog at pinananatiling bukas ang gitna ng kusang pagbabalik at pasibong diwang ‘ibinalik.’
- source_word: ἐπὶ τὸν ποιμένα
  choice: sa Pastol
  rationale: Ang ποιμήν ay tuwirang nangangahulugang ‘pastol.’ Ginamit ang malaking titik sapagkat titulo ito ni Cristo sa konteksto.
- source_word: καὶ ἐπίσκοπον
  choice: at Tagapangasiwa
  rationale: Ang ἐπίσκοπος ay tumutukoy sa isang nagbabantay at nangangalaga. Ang ‘Tagapangasiwa’ ay malinaw na salin na hindi nag-aangkat ng mas huling kahulugang denominasyonal ng ‘Obispo.’
- source_word: τῶν ψυχῶν ὑμῶν
  choice: ng inyong mga kaluluwa
  rationale: Pinananatili ng ‘mga kaluluwa’ ang tuwirang leksikal at tradisyonal na diwa ng ψυχαί sa konteksto ng espirituwal na pangangalaga, bagaman maaari ring tumukoy ang salita sa buhay o buong pagkatao.
theological_decisions:
- issue: Ang ἐπίσκοπος bilang titulo ni Cristo
  choice: Tagapangasiwa
  alternative: Tagapagbantay; Obispo
  rationale: Inilalapat ng talata kay Cristo ang mga titulong ποιμήν at ἐπίσκοπος. Pinananatili ng ‘Tagapangasiwa’ ang diwa ng pangangalaga at pagbabantay nang hindi nag-aangkat ng partikular na sistema ng pamamahala sa simbahan.
- issue: Ang tinig ng ἐπεστράφητε
  choice: nagbalik na kayo
  alternative: ibinalik na kayo; bumalik na kayo
  rationale: Bagaman pasibo ang anyong Griyego at maaaring magpahiwatig na sila ay ibinalik, nagagamit din ang pandiwa sa diwang intransitibo o middle. Hindi tahasang nilulutas ng salin ang tensiyon sa pagitan ng pagkilos ng Diyos at tugon ng tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘dati kayong tulad’ para sa natural na daloy, at ginawang malaking titik ang ‘Pastol’ at ‘Tagapangasiwa’ bilang magkaugnay na mga titulo ni Cristo.
