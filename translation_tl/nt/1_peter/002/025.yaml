  terminology: Ang “Pastol” at “Tagapangasiwa” ay tumpak at angkop na mga titulong inilalapat kay Cristo. Iniiwasan ng “Tagapangasiwa” ang di-kailangang pagpapasok ng huling kahulugang pang-estruktura ng “Obispo,” habang ang tala ay sapat na nagtatala ng tradisyonal na termino. Ang “mga kaluluwa” ay isang tuwiran at katanggap-tanggap na salin ng ψυχῶν sa kontekstong ito.
