  source_fidelity: Tapat ang salin sa SBLGNT. Ang “Sapagkat dati kayong tulad ng mga tupang naliligaw” ay angkop na naghahayag ng dating nagpapatuloy na kalagayan (ἦτε ... πλανώμενοι), at hindi nito labis na nilulutas kung ang pagkaligaw ay kusang nangyari o dulot ng iba. Ang “ngunit ngayon ay nagbalik na kayo” ay maayos na salin ng ἀλλὰ ἐπεστράφητε νῦν, na pinananatiling hindi tiyak ang posibleng pasibong pananarinari. Wasto rin ang “sa Pastol at Tagapangasiwa ng inyong mga kaluluwa” para sa ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
