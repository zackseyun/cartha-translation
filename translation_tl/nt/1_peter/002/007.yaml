review_pass:
  verdict: approve
  source_fidelity: Tapat ang salin sa Griyego. Naipapakita ang tuwirang pagtutol ng τοῖς πιστεύουσιν at ἀπιστοῦσιν, ang τιμή bilang “karangalan,” at ang siping tungkol sa batong itinakwil na naging κεφαλὴ γωνίας. Hindi ipinapasok sa pangunahing teksto ang isang mas tiyak na interpretasyong arkitektural kaysa sa ipinahihiwatig ng Griyego.
  naturalness: Natural at marangal ang modernong Filipino. Ang “ulo ng panulukan” ay bahagyang literal at biblikal ang tunog, ngunit nauunawaan at sinasadyang pinananatili upang huwag gawing mas tiyak ang metapora; ang mas pamilyar na alternatibo ay wastong nasa talababa.
  terminology: Ang “sumasampalataya,” “hindi sumasampalataya,” “itinakwil,” at “mga tagapagtayo” ay angkop sa rehistro at tapat sa mga pangunahing termino. Wastong iniiwan ng talababa ang “mga sumusuway” bilang posibleng leksikal na lilim at ang “batong-panulukan” bilang tradisyonal na interpretatibong salin.
