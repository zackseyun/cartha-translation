id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: tl
  text: Kaya, ang karangalan ay para sa inyo na sumasampalataya[a]; ngunit para sa mga hindi sumasampalataya[b], “Ang batong itinakwil ng mga tagapagtayo—ito ang naging ulo ng panulukan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagiging mahalaga ay para sa inyo na sumasampalataya,” ibig sabihin, mahalaga sa mga sumasampalataya ang bato.
    reason: alternative_reading
  - marker: b
    text: O “mga sumusuway”; maaaring ipahiwatig ng pandiwa ang pagtangging manampalataya na nahahayag sa pagsuway.
    reason: lexical_alternative
  - marker: c
    text: Ayon sa tradisyon, “batong-panulukan” o “pangunahing batong-panulukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: karangalan
  rationale: Maaaring mangahulugan ang τιμή ng karangalan, halaga, o pagiging mahalaga. Pinananatili ng “karangalan” ang maikli at tuwirang pahayag na ang karangalan ay para sa mga sumasampalataya, habang inilalagay sa talababa ang posibleng pagtukoy sa pagiging mahalaga ng bato.
- source_word: τοῖς πιστεύουσιν
  choice: sa inyo na sumasampalataya
  rationale: Pinananatili nito ang tuwirang pakikipag-usap sa mga mambabasa at ang kaibahan nila sa mga hindi sumasampalataya.
- source_word: ἀπιστοῦσιν
  choice: mga hindi sumasampalataya
  rationale: Dahil tuwirang kasalungat ito ng πιστεύουσιν, pinakamalinaw dito ang kawalan o pagtanggi ng pananampalataya. Nasa talababa ang posibleng diwa ng pagsuway.
- source_word: λίθος
  choice: bato
  rationale: Karaniwan at natural itong katumbas sa konteksto ng pagtatayo.
- source_word: ἀπεδοκίμασαν
  choice: itinakwil
  rationale: Ipinahihiwatig ng pandiwa ang pagtanggi matapos suriin o hatulan. Ang “itinakwil” ay malinaw at angkop sa dignidad ng sipi.
- source_word: οἱ οἰκοδομοῦντες
  choice: mga tagapagtayo
  rationale: Natural na salin ito ng substantibong participle at pinananatili ang larawan ng pagtatayo.
- source_word: κεφαλὴν γωνίας
  choice: ulo ng panulukan
  rationale: Malapit ito sa literal na larawan ng Griyegong parirala at hindi agad nililimitahan ang kahulugan sa isang tiyak na uri ng batong panggusali. Inilalagay sa talababa ang tradisyonal na “batong-panulukan.”
theological_decisions:
- issue: Kahulugan ng ἡ τιμή kaugnay ng mga sumasampalataya at ni Cristo bilang bato
  choice: Ang karangalan ay para sa mga sumasampalataya.
  alternative: Ang pagiging mahalaga ay para sa mga sumasampalataya, ibig sabihin, mahalaga sa kanila ang bato.
  rationale: Pinakanatural na pahayag ng ὑμῖν ... ἡ τιμή na ang karangalan ay para sa kanila, at umaayon ito sa mas malawak na konteksto ng hindi mapapahiya. Gayunman, tunay na posible ang alternatibo dahil sa “mahalaga” sa naunang talata, kaya pinananatili ito sa talababa.
- issue: Pagpapakahulugan sa κεφαλὴ γωνίας
  choice: Pinanatili sa pangunahing teksto ang malinaw ngunit literal na larawang “ulo ng panulukan.”
  alternative: batong-panulukan; pangunahing batong-panulukan
  rationale: Mahalaga ang parirala sa pagkakakilanlan ni Cristo, ngunit hindi dapat paliitin ng salin ang mas bukas na larawang arkitektural ng Griyego. Ibinibigay sa talababa ang pamilyar na pagpapakahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sumasampalataya,” “itinakwil,” at “tagapagtayo” bilang malinaw na mga salitang biblikal na nauunawaan pa rin ng karaniwang mambabasa. Pinanatili ang bahagyang putol na estruktura ng paghahambing bago ang sipi upang huwag punan ang anumang hindi tahasang sinabi sa Griyego.
