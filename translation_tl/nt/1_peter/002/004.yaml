  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: tl
  text: Habang lumalapit kayo sa kanya[a]—ang batong buháy na itinakwil ng mga tao ngunit sa Diyos ay pinili at mahalaga—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa kanya, habang lumalapit kayo.”
    reason: Pinananatili ng alternatibo ang mas literal na unang paglalagay ng “sa kanya” sa Πρὸς ὃν προσερχόμενοι at ang participial na anyo ng “lumalapit.”
lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: Habang lumalapit kayo sa kanya
  rationale: Ipinahahayag ng kasalukuyang participle ang nagpapatuloy na paglapit ng mga mambabasa. Natural sa modernong Tagalog ang sugnay na “habang,” at nananatili ang direksiyong ipinahihiwatig ng πρός.
- source_word: λίθον ζῶντα
  choice: ang batong buháy
  rationale: Pinananatili ng “bato” ang larawang panggusali sa konteksto, at ng “buháy” ang sadyang kabalintunaan ng metapora.
- source_word: ὑπὸ ἀνθρώπων
  choice: ng mga tao
  rationale: Ang ἄνθρωποι rito ay tumutukoy sa mga tao bilang kabaligtaran ng Diyos. Ang “mga tao” ang tuwiran, natural, at saklaw-sa-kasariang katumbas sa Tagalog.
- source_word: ἀποδεδοκιμασμένον
  choice: itinakwil
  rationale: Ipinahahayag nito nang malinaw ang naging bunga ng pagsusuri at pagtanggi, habang ang anyong balintiyak ay tumutugma sa Griyego.
- source_word: παρὰ δὲ θεῷ
  choice: ngunit ... sa paningin ng Diyos
  rationale: Ipinakikita ng παρά na may datibo ang katayuan o pagpapahalaga ayon sa Diyos, bilang tahasang kaibahan sa paghatol ng mga tao.
- source_word: ἐκλεκτὸν
  choice: pinili
  rationale: Natural at malinaw ito sa modernong Tagalog at pinananatili ang diwang ang Diyos ang pumili nang hindi gumagamit ng teknikal na katawagan.
- source_word: ἔντιμον
  choice: mahalaga
  rationale: Saklaw nito ang mataas na halaga at karangalan ng salita. Akma rin ito sa larawan ng isang bato na pinahahalagahan.
theological_decisions:
- issue: Ang tinutukoy ng “kanya” at ng “batong buháy”
  choice: Pinanatili ang panghalip at inilagay ang “ang batong buháy” bilang paliwanag dito.
  alternative: Tahasang sabihing “kay Jesus, ang batong buháy.”
  rationale: Malinaw sa konteksto ng 1 Pedro 2:3–8 na si Jesus/Mesiyas ang tinutukoy, ngunit panghalip lamang ang nasa talata. Hindi idinagdag ang pangalan upang manatiling tapat sa anyo at daloy ng pinagmulan.
- issue: Ugnayan ng “pinili” at “mahalaga” sa Diyos
  choice: Kapuwa iniugnay sa “sa paningin ng Diyos.”
  alternative: Iugnay lamang ang “mahalaga” sa Diyos.
  rationale: Ang ayos ng Griyego ay natural na naglalagay sa dalawang pang-uri sa ilalim ng pagtataya ng Diyos, kasalungat ng pagtatakwil ng mga tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga tao” dahil likas itong panlahat sa Tagalog. Pinanatili ang bitin na estruktura sa hulihan sa pamamagitan ng gitling sapagkat nagpapatuloy ang pangungusap sa talata 5.
