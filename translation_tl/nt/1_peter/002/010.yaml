  naturalness: Ang “hindi isang bayan” ay medyo hindi likas at maaaring maunawaan bilang kawalan ng isang heograpikong bayan. Ang “hindi isang sambayanan” ay mas natural para sa kolektibong pagkakakilanlan na tinutukoy ng λαός. Ang magkatugmang “hindi pinagkalooban ng awa … pinagkalooban ng awa” ay malinaw na modernong Filipino.
  terminology: Ginamit ang “sambayanan” para sa λαός upang ipahayag ang isang bayang kolektibo nang hindi inuugnay sa isang lugar o munisipalidad. Pinanatili ang “Diyos” at ang pasibong wika ng awa; walang idinagdag na denominasyonal o etnikong pagpapakahulugan.
