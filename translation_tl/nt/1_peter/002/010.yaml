  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: tl
  text: Kayo na dati'y hindi isang sambayanan[a], ngunit ngayo'y sambayanan ng Diyos; kayo na noon ay hindi pinagkalooban ng awa[b], ngunit ngayo'y pinagkalooban ng awa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umaalingawngaw dito ang Hosea 1:9–10 at 2:23. Ikinakapit ni Pedro sa kasalukuyang pagkakakilanlan ng kanyang mga mambabasa bilang sambayanan ng Diyos ang wikang tungkol sa pagpapanumbalik ng Israel.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “kayo na hindi kinaawaan noon, ngunit ngayon ay kinaawaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: kayo na
  rationale: Tumutukoy ang panghalip na maramihan sa mga mambabasa mula sa naunang talata. Likas sa Tagalog ang “kayo na” at malinaw nitong pinananatili ang tuwirang pagtukoy sa kanila.
- source_word: ποτε
  choice: dati / noon
  rationale: Ipinakikita nito ang dating kalagayan na tahasang ipinaparis sa νῦν, “ngayon.” Ginamit ang “dati” at “noon” ayon sa natural na daloy ng dalawang sugnay.
- source_word: λαὸς
  choice: isang bayan / bayan ng Diyos
  rationale: Ang λαός ay tumutukoy sa isang sama-samang sambayanan, lalo na sa wikang tipan. Pinananatili ng “hindi isang bayan” ang di-tiyak na unang pahayag, samantalang tuwirang isinasalin ng “bayan ng Diyos” ang λαὸς θεοῦ.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Likas at tapat na ipinahahayag ng pariralang “bayan ng Diyos” ang ugnayang nasa genitibong Griyego.
- source_word: οὐκ ἠλεημένοι
  choice: hindi kinaawaan noon
  rationale: Ang perpektong pasibong participle ay naglalarawan sa dati nilang kalagayan bilang mga hindi tumanggap ng awa. Ang “hindi kinaawaan” ay maikli, natural, at pinananatiling lantad na sila ang tumanggap ng pagkilos.
- source_word: ἐλεηθέντες
  choice: kinaawaan na
  rationale: Ang aorist passive participle ay tumutukoy sa naganap na pagkilos ng awa na nagbunga ng kasalukuyang kalagayan. Ipinahihiwatig ng “na” ang pagbabagong naganap at nananatili ang pasibong anyo.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinakikita ng “ngunit” ang dalawang matinding pagbaligtad mula sa dating kalagayan tungo sa kasalukuyan.
- source_word: νῦν
  choice: ngayon
  rationale: Tuwirang ipinapahayag ng “ngayon” ang kasalukuyang kalagayang kasalungat ng dati.
theological_decisions:
- issue: Pahiwatig sa Hosea at wika ng pagkakakilanlan bilang bayan ng tipan
  choice: “hindi isang bayan … bayan ng Diyos”
  alternative: “hindi bayan ng Diyos … bayan na ngayon ng Diyos”
  rationale: Sa unang sugnay, literal na “hindi isang bayan” ang Griyego, hindi tahasang “hindi bayan ng Diyos”; sa ikalawa lamang sinasabi ang “bayan ng Diyos.” Pinananatili ng salin ang pagkakaibang ito at ang sama-samang pagbaligtad ng kanilang katayuan nang hindi nililimitahan ito sa isang partikular na etniko o denominasyonal na paliwanag.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” upang idiin ang kolektibong pagkakakilanlan, hindi lamang ang maraming indibidwal. Pinanatili ang magkatugmang ayos ng dalawang sugnay at ang matinding paghahambing ng “dati/noon” at “ngayon.”
