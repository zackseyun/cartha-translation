  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: tl
  text: Mga minamahal, hinihimok ko kayo, bilang mga dayuhan at pansamantalang naninirahan[a], na umiwas sa mga pagnanasa ng laman[b], na nakikipagdigma laban sa kaluluwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga banyagang naninirahan at mga pansamantalang nakikipamayan.” Magkasamang idiniriin ng dalawang katawagan na hindi lubos na kabilang ang mga mananampalataya sa kasalukuyang kaayusan ng sanlibutan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga pagnanasa ng laman.” Maaari ring unawain bilang “makalamang mga pagnanasa” o, nang mas interpretatibo, “makasalanang mga pagnanasa.”
    reason: lexical_alternative
  - marker: c
    text: Ang “kaluluwa” ay maaari ring mangahulugang “buhay,” “sarili,” o “buong pagkatao” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Pinananatili nito ang magiliw na pantawag at ang ugnayang leksikal sa pag-ibig, nang hindi nililimitahan ang mga kausap sa kahulugang 'mga kaibigan.'
- source_word: παρακαλῶ
  choice: hinihimok ko kayo
  rationale: Ipinahahayag nito ang taimtim at malakas na pakiusap o paghimok ng pandiwa, sa natural na modernong Filipino.
- source_word: ὡς
  choice: bilang
  rationale: Tuwirang ipinakikita nito ang katayuan o pagkakakilanlan kung paano tinatawag ang mga mambabasa, nang hindi nagdaragdag ng tahasang sanhi.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: mga dayuhan at pansamantalang naninirahan
  rationale: Pinananatili ng pares ang di-ganap na pagkamamamayan at pansamantalang katayuan ng mga mambabasa. Mas malinaw ito sa karaniwang mambabasa kaysa sa mga salitang makaluma gaya ng 'nakikipamayan' at 'manlalakbay.'
- source_word: ἀπέχεσθαι
  choice: umiwas
  rationale: Likas na Filipino itong nagpapahayag ng patuloy na paglalayo ng sarili mula sa tinutukoy na mga pagnanasa.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: mga pagnanasa ng laman
  rationale: Pinananatili nito ang talinghaga at ugnayang leksikal sa σάρξ, ngunit hindi ito pinakikitid sa seksuwal na pagnanasa lamang o agad ipinapakahulugang 'makasalanang kalikasan.'
- source_word: αἵτινες
  choice: na
  rationale: Natural itong nag-uugnay sa paliwanag tungkol sa katangian at ginagawa ng mga pagnanasa.
- source_word: στρατεύονται
  choice: nakikipagdigma
  rationale: Pinananatili nito ang masiglang larawang militar ng aktibong pakikibaka.
- source_word: κατὰ τῆς ψυχῆς
  choice: laban sa kaluluwa
  rationale: Pinananatili nito ang antropolohikal na bigat at tunay na lawak ng ψυχή nang hindi tahasang dinaragdagan ng 'inyong,' na wala sa Griyego.
theological_decisions:
- issue: Kahulugan ng σαρκικῶν sa kontekstong moral
  choice: ng laman
  alternative: makasalanan; makalaman
  rationale: Ang 'ng laman' ay nagpapanatili sa pinagmulang talinghaga at sa teolohikal na tensiyon nito. Hindi nito ipinapasok sa pangunahing teksto ang mas interpretatibong 'makasalanang pagnanasa' o ang isang buong doktrina ng 'makasalanang kalikasan.'
- issue: Kahulugan ng ψυχή
  choice: kaluluwa
  alternative: buhay; sarili; buong pagkatao
  rationale: Ang 'kaluluwa' ay nagpapanatili sa tradisyonal at leksikal na bigat ng salita, habang nililinaw ng talababa na maaari nitong tukuyin ang buhay o sarili at hindi kailangang magtakda rito ng mahigpit na paghahati ng katawan at kaluluwa.
- issue: Katayuan ng παροίκους καὶ παρεπιδήμους
  choice: mga dayuhan at pansamantalang naninirahan
  alternative: mga itinapon sa ibang bayan; mga nakikipamayan at manlalakbay
  rationale: Hindi malinaw sa parirala lamang kung ang diin ay panlipunan, pansamantala, o teolohikal. Pinananatili ng salin ang dalawang magkaugnay na katawagan nang hindi ginagawang tiyak na sapilitang pagpapatapon ang kanilang kalagayan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “hinihimok,” “umiwas,” at “nakikipagdigma” upang mapanatili ang taimtim na panawagan at matinding larawang militar. Iniwasan ang sobrang makaluma o teknikal na bokabularyo, habang pinanatili ang “laman” at “kaluluwa” dahil mahalaga ang kanilang leksikal at teolohikal na lawak.
