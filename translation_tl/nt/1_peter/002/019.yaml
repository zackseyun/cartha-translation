base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: tl
  text: 'Sapagkat ito ay biyaya[a]: kung ang isang tao, dahil sa kamalayan niya sa Diyos[b], ay nagtitiis ng mga pasakit habang nagdurusa nang di-makatarungan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “biyaya” rito ay maaari ring mangahulugang isang bagay na kalugod-lugod, kapuri-puri, o karapat-dapat sa pagsang-ayon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil may kamalayan siya sa Diyos” o “dahil sa budhi sa harap ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Pinananatili ng “biyaya” ang mahalagang ugnayang leksikal sa karaniwang gamit ng χάρις sa Bagong Tipan, habang ipinapaliwanag sa talababa ang evaluative na diwa nitong “kalugod-lugod” o “karapat-dapat sa pagsang-ayon.”
- source_word: διὰ συνείδησιν θεοῦ
  choice: dahil sa kamalayan niya sa Diyos
  rationale: Ipinapahayag nito ang Diyos bilang pinagtutuunan ng kamalayan at pinagmumulan ng motibo sa pagtitiis. Hindi nito nililimitahan ang συνείδησις sa moral na “budhi” lamang; inilalagay sa talababa ang mga posibleng pagbasa.
- source_word: ὑποφέρει
  choice: nagtitiis
  rationale: Natural at tumpak na ipinahahayag ng “nagtitiis” ang matiyagang pagdadala ng hirap o pasakit.
- source_word: λύπας
  choice: mga pasakit
  rationale: Sinasaklaw ng “mga pasakit” ang hirap, kirot, at dalamhating maaaring tukuyin ng maramihang λύπας sa kontekstong ito.
- source_word: πάσχων ἀδίκως
  choice: habang nagdurusa nang di-makatarungan
  rationale: Malinaw na pinananatili ang participial na kalagayan at ang di-makatarungang katangian ng pagdurusa.
- source_word: τις
  choice: ang isang tao
  rationale: Tumutugma sa di-tiyak at pangkalahatang singular ng τις nang hindi nagdaragdag ng kasariang wala sa Griyego.
- source_word: τοῦτο γὰρ
  choice: Sapagkat ito
  rationale: Pinananatili ang paliwanag na ugnayan ng γάρ at ang pagtukoy ng τοῦτο sa kasunod na kondisyon.
theological_decisions:
- issue: Diwa ng χάρις sa konteksto
  choice: biyaya
  alternative: isang bagay na kalugod-lugod; kapuri-puri; karapat-dapat sa pagsang-ayon
  rationale: Hindi tahasang sinasabi ng talata kung kanino ito kalugod-lugod. Ang “biyaya” ay umiiwas sa pagdaragdag ng “sa Diyos” sa pangunahing teksto at pinananatili ang teolohikal na saklaw ng salita.
- issue: Kahulugan ng συνείδησις θεοῦ
  choice: kamalayan niya sa Diyos
  alternative: pagiging palaisip sa Diyos; budhing nakatuon sa Diyos
  rationale: Pinananatili ng pangunahing salin ang tensiyon sa pagitan ng “kamalayan” at “budhi” at hindi ipinipilit ang isa lamang na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “di-makatarungan” bilang natural ngunit pormal na katumbas ng ἀδίκως. Inuna ang pariralang sanhi bago ang “nagtitiis” upang maging malinaw na ang kamalayan sa Diyos ang dahilan ng pagtitiis, hindi ang dahilan ng di-makatarungang pagdurusa.
