  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: tl
  text: Sapagkat ano ang kapurihang matatamo ninyo kung, habang nagkakasala kayo at binubugbog, ay nagtitiis kayo? Ngunit kung, habang gumagawa kayo ng mabuti at nagdurusa, ay nagtitiis kayo, ito ay biyaya[a] sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalugod-lugod ito sa Diyos” o “kapuri-puri ito sa paningin ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: kapurihan
  rationale: Sa retorikal na tanong, tumutukoy ito sa papuri o pagkilalang matatamo, hindi lamang sa malawak na diwa ng katanyagan.
- source_word: ἁμαρτάνοντες
  choice: nagkakasala
  rationale: Pinananatili nito ang tuwirang moral at teolohikal na diwa ng paggawa ng kasalanan.
- source_word: κολαφιζόμενοι
  choice: binubugbog
  rationale: Malinaw nitong ipinahahayag ang pisikal na pananakit na saklaw ng pandiwa, sa likas na makabagong Tagalog.
- source_word: ὑπομενεῖτε
  choice: nagtitiis kayo
  rationale: Ipinahahayag nito ang matatag na pananatili sa gitna ng hirap at pinananatili ang pag-uulit sa dalawang sugnay.
- source_word: ἀγαθοποιοῦντες
  choice: gumagawa ng mabuti
  rationale: Tuwiran at natural na salin para sa pagkilos nang tama o paggawa ng kabutihan.
- source_word: πάσχοντες
  choice: nagdurusa
  rationale: Pinananatili ang malawak na kahulugan ng pagdurusa nang hindi nililimitahan sa isang uri ng pagmamaltrato.
- source_word: χάρις
  choice: biyaya
  rationale: Pinananatili ang mahalagang leksikal at teolohikal na diwa ng χάρις, habang inilalahad sa talababa ang kontekstuwal na diwa ng pagsang-ayon ng Diyos.
- source_word: παρὰ θεῷ
  choice: sa harap ng Diyos
  rationale: Ipinahahayag ang kalagayan sa presensiya o pagtataya ng Diyos at pinananatili ang pormal na ugnayan ng parirala.
theological_decisions:
- issue: Kahulugan ng χάρις sa pangwakas na sugnay
  choice: “biyaya sa harap ng Diyos” sa pangunahing teksto
  alternative: “kalugod-lugod ito sa Diyos” o “kapuri-puri ito sa paningin ng Diyos”
  rationale: Maaaring tumukoy ang parirala sa biyaya o sa pagsang-ayon at pagkilala ng Diyos. Pinananatili ng pangunahing teksto ang leksikal at teolohikal na bigat ng χάρις, samantalang nililinaw ng talababa ang kontekstuwal na alternatibo nang hindi isinasara ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang magkatulad na ayos ng dalawang kondisyon at ang pag-uulit ng “nagtitiis kayo” upang maipakita ang retorikal na paghahambing.
