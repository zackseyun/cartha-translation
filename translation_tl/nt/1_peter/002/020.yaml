  to: Sapagkat ano ang kapurihang matatamo ninyo kung, habang nagkakasala kayo at binubugbog, ay nagtitiis kayo? Ngunit kung, habang gumagawa kayo ng mabuti at nagdurusa, ay nagtitiis kayo, ito ay biyaya[a] sa harap ng Diyos.
  rationale: Inayos ang idiomatikong pagpapahayag ng κλέος bilang kapurihang “matatamo” at inilipat ang footnote marker upang tuwirang iangkla ito sa “biyaya,” ang katumbas ng χάρις. Hindi binago ang kahulugan, ang pag-uulit ng “nagtitiis kayo,” o ang sinadyang ambiguwidad ng χάρις παρὰ θεῷ.
