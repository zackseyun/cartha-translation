id: 1PE.2.23
reference: 1 Peter 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: tl
  text: Nang siya ay insultuhin, hindi siya gumanti ng insulto; nang siya ay magdusa, hindi siya nagbanta, kundi patuloy niyang ipinagkatiwala ang sarili niya sa humahatol nang makatarungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιδορούμενος
  choice: nang siya ay insultuhin
  rationale: Ipinahahayag ng pasibong pandiwaring-bahagi ang pagtanggap niya ng berbal na pang-aabuso; natural at malinaw sa modernong Filipino ang “insultuhin.”
- source_word: ἀντελοιδόρει
  choice: hindi siya gumanti ng insulto
  rationale: Napananatili ng “gumanti ng insulto” ang berbal at gantihang diwa ng ἀντι-; ang anyong imperpekto ay naglalarawan sa palagian niyang hindi pagganti.
- source_word: πάσχων
  choice: nang siya ay magdusa
  rationale: Ginawang sugnay na panahunan upang tumugma sa naunang pandiwaring-bahagi at maging natural sa Filipino.
- source_word: οὐκ ἠπείλει
  choice: hindi siya nagbanta
  rationale: Tuwirang ipinahahayag ang hindi niya pagbigkas ng mga banta habang nagdurusa.
- source_word: παρεδίδου
  choice: patuloy niyang ipinagkatiwala ang sarili niya
  rationale: Ang “patuloy” ay nagpapakita ng aspektong imperpektibo; ang “ipinagkatiwala” ay angkop sa konteksto ng matiyagang pagpapasakop sa makatarungang paghatol.
- source_word: τῷ κρίνοντι δικαίως
  choice: sa humahatol nang makatarungan
  rationale: Napananatili ang naglalarawang anyo ng Griyego at hindi ginagawang tahasang titulo o pangalan ang ipinahiwatig na Diyos.
- source_word: δὲ
  choice: kundi
  rationale: Malinaw nitong minamarkahan ang kaibahan sa pagitan ng hindi pagganti at ng positibong pagtitiwala.
- source_word: ὃς
  choice: siya
  rationale: Bagaman panghalip na pamanggit ang ὃς at nakaugnay sa naunang talata, mas natural sa nagsasariling sipi sa Filipino ang “siya”; pinananatili pa rin nito ang pagtukoy kay Cristo mula sa konteksto.
theological_decisions:
- issue: Tinutukoy ng “humahatol nang makatarungan”
  choice: Pinanatili itong paglalarawan nang hindi tahasang pinangalanan ang Diyos Ama.
  alternative: Tahasang isalin na “sa Diyos na humahatol nang makatarungan.”
  rationale: Ipinahihiwatig ng konteksto na Diyos ang tinutukoy, ngunit hindi siya tahasang pinangalanan sa Griyego; iniiwasan ng salin ang pagdaragdag ng mas tiyak na katawagan.
- issue: Bagay na ipinagkakatiwala sa παρεδίδου
  choice: “ang sarili niya” bilang likas na ipinahihiwatig na layon
  alternative: 'Iwanang walang tahasang layon: “patuloy siyang nagtitiwala sa humahatol…”'
  rationale: Walang nakasulat na tahasang layon sa Griyego, kaya may tunay na pagkaelliptical ang parirala. Gayunman, natural na ipinahihiwatig sa konteksto ang kanyang sarili o kalagayan; ang “ang sarili niya” ay malinaw sa Filipino nang hindi tinutukoy nang higit pa kung buhay, layunin, o usapin niya ang ipinagkakatiwala.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinili ang “insulto” kaysa mas matandang “pag-alimura,” at pinanatili ang balanseng parallelismo ng dalawang sugnay. Walang kinakailangang talababa sapagkat nailahad sa teksto ang pangunahing diwa nang hindi itinatago ang kontekstuwal na pahiwatig.
source_grounding:
  english_pob_role: consult_only
