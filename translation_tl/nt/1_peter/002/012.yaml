  to: Mamuhay kayo nang marangal sa gitna ng mga Hentil, upang, sa bagay na sinisiraan nila kayo bilang mga gumagawa ng masama, dahil sa nakikita nila ang inyong mabubuting gawa ay luwalhatiin nila ang Diyos sa araw ng kanyang pagdalaw.[a]
