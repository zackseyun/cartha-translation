id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: tl
  text: Mamuhay kayo nang marangal sa gitna ng mga Hentil, upang, sa bagay na sinisiraan nila kayo bilang mga gumagawa ng masama, dahil sa nakikita nila ang inyong mabubuting gawa ay luwalhatiin nila ang Diyos sa araw ng kanyang pagdalaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagdalaw” ay maaaring tumukoy sa paglapit ng Diyos upang magligtas, magsiyasat, o humatol; hindi ito tinutukoy nang mas tiyak ng Griyego rito.
    reason: Pinananatili ang semantikong ambiguwidad ng ἐπισκοπή nang hindi itinatali sa isang pagpapakahulugang doktrinal.
lexical_decisions:
- source_word: ἀναστροφή
  choice: mamuhay
  rationale: Tumutukoy ito sa asal o paraan ng pamumuhay; natural sa modernong Tagalog ang pandiwang anyo sa pangungusap na ito.
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Pinananatili ang pagkakaiba ng mga mananampalataya at ng mga bansang di-Judio sa kontekstong ito, sa halip na gawing pangkalahatang ‘mga tao.’
- source_word: καλήν / καλῶν
  choice: marangal / mabubuting
  rationale: Ang καλήν ay tumutukoy sa kapuri-puring asal, kaya ‘marangal’; ang καλῶν ἔργων ay likas na ‘mabubuting gawa.’
- source_word: καταλαλοῦσιν
  choice: ipinaparatang
  rationale: Ipinahihiwatig ng pandiwa ang mapanirang pagsasalita laban sa kanila; ang ‘ipinaparatang’ ay angkop sa kasunod na pagturing sa kanila bilang masasamang gumagawa.
- source_word: ἐποπτεύοντες
  choice: makita nila
  rationale: Nangangahulugang masusing makita o mapagmasdan; ‘makita’ ang pinakanatural dito, habang ang ugnayan sa kanilang mga gawa ay malinaw sa konteksto.
- source_word: ἡμέρᾳ ἐπισκοπῆς
  choice: araw ng kanyang pagdalaw
  rationale: Pinananatili ang biblikal na konsepto ng banal na pagdalaw at ang likas na ambiguwidad kung ito ay para sa pagliligtas o paghatol.
theological_decisions:
- issue: Kahulugan ng ‘araw ng pagdalaw’
  choice: araw ng kanyang pagdalaw
  alternative: araw ng pagsusulit / araw ng paghatol
  rationale: Hindi tahasang nilulutas ng Griyego kung ang ἐπισκοπή ay pagdalaw para sa biyaya, pagsisiyasat, o paghatol; ang salin ay nagpapanatili sa tensiyong ito.
- issue: Ugnayan ng paninirang-puri at mabubuting gawa
  choice: sa mga bagay na ipinaparatang nila sa inyo bilang mga gumagawa ng masama
  alternative: kahit sinisiraan nila kayo bilang mga gumagawa ng masama
  rationale: Mas malapit ito sa ἐν ᾧ at hindi ginagawang concessive ang parirala nang walang katiyakan, bagaman medyo mas mahirap ang estruktura.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Hentil’ bilang pamilyar na terminong biblikal at iniwasan ang labis na teknikal o denominasyonal na pagpapakahulugan.
