id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: tl
  text: Siya mismo ang nagpasan ng ating mga kasalanan sa kanyang katawan sa punongkahoy[a], upang tayo, na namatay na sa mga kasalanan, ay mabuhay para sa katuwiran. Sa pamamagitan ng kanyang sugat[b] ay pinagaling kayo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa krus”; sa Griyego, “sa punongkahoy,” na malamang na umaalingawngaw sa Deuteronomio 21:23.
    reason: alternative_reading
  - marker: b
    text: O “pasa” o “bakas ng hampas”; isahan ang pangngalan at umaalingawngaw sa Isaias 53:5.
    reason: lexical_alternative
  - marker: c
    text: Malawak ang ipinahahayag na paggaling dito. Sa konteksto, kaugnay ito ng mga kasalanan at katuwiran, ngunit hindi nililimitahan ng teksto ang kahulugan sa pisikal lamang o espirituwal lamang na paggaling.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: nagpasan
  rationale: Saklaw ng ἀναφέρω ang pagdadala o paghahandog. Ang “nagpasan” ay likas sa modernong Tagalog at pinananatili ang diwa ng pagdadala ng mga kasalanan at ang alusyon sa Isaias nang hindi nililimitahan sa isang teknikal na katawagang panghandog.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: sa kanyang katawan
  rationale: Tuwirang salin na nagpapanatili sa kongkreto at pisikal na katangian ng kanyang pagdurusa; ang diin ng αὐτός ay naipahayag na sa “Siya mismo.”
- source_word: ἐπὶ τὸ ξύλον
  choice: sa punongkahoy
  rationale: Ang ξύλον ay kahoy o punongkahoy. Pinananatili ng “punongkahoy” ang salitang Griyego at ang malamang na alusyon sa Deuteronomio 21:23, habang malinaw pa ring tumutukoy sa pagpapako kay Jesus.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: na namatay na sa mga kasalanan
  rationale: Ang ἀπογίνομαι ay nagpapahiwatig ng tiyak na paghiwalay o pagtalikod. Ang “namatay na sa mga kasalanan” ay natural at matibay na paglalarawan sa Tagalog at pinananatili ang pangmaramihang “mga kasalanan.”
- source_word: τῇ δικαιοσύνῃ
  choice: para sa katuwiran
  rationale: Ipinahahayag ng datibo kasama ng ζήσωμεν ang buhay na nakatuon sa katuwiran. Mas natural sa Tagalog ang “mabuhay para sa katuwiran” kaysa sa literal ngunit alanganing “mabuhay sa katuwiran.”
- source_word: μώλωπι
  choice: sugat
  rationale: Ang μώλωψ ay sugat, pasa, o bakas ng hampas. Ang “sugat” ay malinaw at likas sa kasalukuyang Tagalog at pinananatili ang isahang anyo na umaalingawngaw sa Isaias 53:5.
- source_word: ἰάθητε
  choice: pinagaling kayo
  rationale: Pinananatili nito ang aorist passive at ang malawak na larangan ng paggaling nang hindi ito nililimitahan sa pisikal lamang o espirituwal lamang.
- source_word: αὐτὸς
  choice: Siya mismo
  rationale: Malinaw na naihahatid ang matinding diin ng intensive pronoun.
theological_decisions:
- issue: Saklaw ng paggaling sa huling sugnay
  choice: Panatilihin ang “pinagaling kayo” nang hindi tinutukoy kung pisikal lamang o espirituwal lamang.
  alternative: Pisikal na paggaling lamang; espirituwal na paggaling mula sa kasalanan lamang; o ganap na paggaling na pangunahing tumutukoy sa kaligtasan.
  rationale: Ang konteksto ay nakasentro sa mga kasalanan, katuwiran, at pagdurusa ni Cristo, kaya kabilang ang pagpapanumbalik mula sa kasalanan. Gayunman, hindi nililimitahan ng mismong pananalita ang paggaling sa iisang kategorya, kaya pinananatili ang lawak at tensiyong teolohikal nito.
- issue: Salin ng ξύλον
  choice: Gamitin ang “punongkahoy” sa pangunahing teksto.
  alternative: “Krus” o “kahoy.”
  rationale: Bagaman malinaw na tumutukoy ito sa pagpapako kay Jesus, ξύλον ang ginamit, hindi σταυρός. Pinananatili ng “punongkahoy” ang orihinal na pananalita at ang malamang na alusyong kasulatan nang hindi pinapalitan ito ng mas interpretatibong katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nagpasan,” “punongkahoy,” at “katuwiran” upang mapanatili ang bigat at mga alusyong kasulatan ng Griyego nang hindi nagiging lipas o sobrang teknikal. Ang ayos ng pangungusap ay bahagyang inayos para sa likas na daloy sa Tagalog, habang pinananatili ang diin sa “Siya mismo” at ang ugnayan ng kamatayan sa mga kasalanan, pamumuhay para sa katuwiran, at paggaling.
