base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: tl
  text: Magpasakop kayo sa bawat institusyong pantao alang-alang sa Panginoon[a]—maging sa isang hari bilang nakatataas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa Panginoon.” Maaari ring isalin ang “institusyong pantao” bilang “kaayusang pantao”; ayon sa mga kasunod na halimbawa, tumutukoy ito sa mga institusyon o awtoridad na sibiko.
    reason: lexical_alternative
  - marker: b
    text: O “bilang nakahihigit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Magpasakop kayo
  rationale: Likas at malinaw na pautos sa modernong Filipino; ipinahahayag ang kusang pagpapailalim sa kaayusan nang hindi ipinahihiwatig ang lubos at walang-takdang pagsunod.
- source_word: πάσῃ
  choice: bawat
  rationale: Ang isahang datibo na kasama ng κτίσει ay distributibo, kaya mas tiyak ang “bawat” kaysa “lahat ng.”
- source_word: ἀνθρωπίνῃ κτίσει
  choice: institusyong pantao
  rationale: Bagaman karaniwang nangangahulugang “paglikha” o “nilalang” ang κτίσις, ipinakikita ng kasunod na mga halimbawa ng hari at mga gobernador na tumutukoy rito sa mga institusyon o kaayusang sibiko ng tao. Pinananatili ng “pantao” ang tahasang katangian ng ἀνθρωπίνῃ.
- source_word: διὰ τὸν κύριον
  choice: alang-alang sa Panginoon
  rationale: Ipinahahayag ng διά na may akusatibo ang dahilan o motibo; natural sa Filipino ang “alang-alang sa” at pinananatili nitong nakaugat sa Panginoon ang pagpapasakop.
- source_word: κύριον
  choice: Panginoon
  rationale: Pinananatili ang titulong nasa Griyego nang hindi tinutukoy nang higit sa teksto kung Diyos o si Jesus ang tahasang tinutukoy.
- source_word: εἴτε βασιλεῖ
  choice: maging sa isang hari
  rationale: Sinisimulan ng εἴτε ang magkakaugnay na pagpipilian na nagpapatuloy sa susunod na talata. Ang “hari” ang tuwirang kahulugan ng βασιλεύς; hindi ipinapalit ang mas makitid na historikal na “emperador.”
- source_word: ὡς ὑπερέχοντι
  choice: bilang nakatataas
  rationale: Ipinahahayag ng participle ang mas mataas na katayuan o awtoridad. Ang “nakatataas” ay maikli, natural, at hindi kasing-absoluto ng “kataas-taasan.”
theological_decisions:
- issue: Kalikasan ng awtoridad sibil sa ἀνθρωπίνῃ κτίσει
  choice: institusyong pantao
  alternative: bawat nilalang na tao; bawat ordinansa ng tao
  rationale: Nililinaw ng mga kasunod na halimbawa na mga kaayusan o awtoridad na sibiko ang tinutukoy, hindi bawat indibidwal na tao. Hindi rin ipinapasok ng salin ang isang tiyak na doktrina tungkol sa pinagmulan o saklaw ng kanilang lehitimasyon.
- issue: Tinutukoy ng κύριον
  choice: Panginoon
  alternative: Jesus; Diyos
  rationale: Hindi tinutukoy ng Griyego nang mas tiyak ang referent, kaya pinananatili ang tunay na kaluwagan ng pamagat.
- issue: Saklaw ng ὑπερέχοντι
  choice: nakatataas
  alternative: kataas-taasan; may awtoridad
  rationale: Ipinakikita ang ranggo ng hari sa kaayusang sibil nang hindi ipinahihiwatig na lubos o walang hangganan ang kanyang kapangyarihan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magpasakop” sa halip na mas lumang “pasakop kayo,” at “institusyong pantao” upang maging malinaw ang kontekstong sibiko habang pinananatili ang pambihirang pahayag ng Griyego. Ang kuwit sa hulihan ay nagpapakitang nagpapatuloy ang pangungusap sa talata 14.
