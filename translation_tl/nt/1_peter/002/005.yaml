source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: tl
  text: Kayo rin mismo[a], tulad ng mga batong buhay, ay itinatayo bilang isang espirituwal na bahay upang maging isang banal na kaparian[b], upang maghandog ng mga espirituwal na haing katanggap-tanggap sa Diyos sa pamamagitan ni Jesus, ang Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Kayo rin, gaya ng mga batong buhay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “para sa isang banal na kaparian” o “tungo sa isang banal na kaparian.” Maaaring magpahayag ang salitang Griyego ng layunin o bunga.'
    reason: alternative_reading
  - marker: c
    text: 'Griyego: “Jesus Cristo.” Isinalin dito ang Χριστός bilang titulong “Mesiyas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: Kayo rin mismo
  rationale: Pinananatili ng “rin” ang pandagdag na diwa ng καί at ng “mismo” ang pagbibigay-diin ng αὐτοὶ, habang tuwirang kinakausap ang maramihang mambabasa.
- source_word: ὡς λίθοι ζῶντες
  choice: tulad ng mga batong buhay
  rationale: Likas na paghahambing sa modernong Tagalog na pinananatili ang metapora at ang ugnay nito kay Cristo bilang batong buhay sa naunang talata.
- source_word: οἰκοδομεῖσθε
  choice: ay itinatayo
  rationale: Pinananatili ang kasalukuyang balintiyak na kilos at hindi tahasang tinutukoy ang gumagawa, gaya ng tekstong Griyego.
- source_word: οἶκος πνευματικὸς
  choice: bilang isang espirituwal na bahay
  rationale: Pinananatili ang metapora ng gusali at ang panuring na πνευματικός; ipinahahayag ng “bilang” ang predikatibong kaugnayan ng bahay sa mga batong itinatayo.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: tungo sa isang banal na kaparian
  rationale: Ipinahihiwatig ng “tungo sa” ang maaaring layunin o bunga ng εἰς nang hindi ganap na pinagpapasyahan kung alin; ang “kaparian” ay tumutukoy sa isang pangkat na gumaganap bilang mga pari.
- source_word: ἀνενέγκαι
  choice: upang maghandog
  rationale: Sa konteksto ng paghahain, ang ἀναφέρω ay nangangahulugang maghandog; ipinakikita ng “upang” ang layunin ng pawatas.
- source_word: πνευματικὰς θυσίας
  choice: mga espirituwal na hain
  rationale: Tuwirang pinananatili ang wikang panghandog at hindi tinutukoy kung ano mismo ang mga hain.
- source_word: εὐπροσδέκτους θεῷ
  choice: katanggap-tanggap sa Diyos
  rationale: Natural at malinaw na pahayag sa Tagalog para sa mga haing tinatanggap ng Diyos.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ipinahahayag ng “sa pamamagitan” ang pamamagitan o kasangkapan ng διά na may genitive; isinasalin ang Χριστός bilang titulong “Mesiyas.”
theological_decisions:
- issue: Tinig at ahensiya ng οἰκοδομεῖσθε
  choice: Balintiyak na “ay itinatayo,” na hindi pinapangalanan ang gumagawa
  alternative: “itinayo ninyo ang inyong sarili” o tahasang “itinatayo ng Diyos”
  rationale: Ang anyo ay balintiyak at sinusuportahan ng konteksto ang pagtanggap ng kilos ng mga mananampalataya. Hindi idinaragdag ang ahenteng hindi tahasang binanggit sa talata.
- issue: Ugnayan ng οἶκος πνευματικὸς at εἰς ἱεράτευμα ἅγιον
  choice: “bilang isang espirituwal na bahay tungo sa isang banal na kaparian”
  alternative: “bilang isang espirituwal na bahay at banal na kaparian” o “upang maging isang banal na kaparian”
  rationale: Pinananatili ang kakaibang sintaks at ang direksiyon ng εἰς, pati ang tunay na kalabuan kung layunin o bunga ang banal na kaparian.
- issue: Pagkakasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulong nakakabit kay Jesus; ang “Mesiyas” ay nagpapanatili sa kahulugan ng titulo nang hindi binabago ang kristolohikong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang bokabularyong biblikal na “espirituwal,” “kaparian,” “hain,” at “Mesiyas.” Pinanatili ang balintiyak na tinig, ang magkakaugnay na metapora ng mga bato at bahay, at ang sintaktikong tensiyon sa pagitan ng espirituwal na bahay at banal na kaparian.
