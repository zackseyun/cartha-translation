id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: tl
  text: 'Sapagkat para rito kayo tinawag, yamang nagdusa rin ang Mesiyas para sa inyo at nag-iwan sa inyo ng huwaran[a], upang sundan ninyo ang kanyang mga yapak.


    [a] Maaari ring “padron” o “modelong tutularan.” Ang salitang Griyego ay maaaring tumukoy sa isang huwarang sulat na inilalagay sa harap ng mga mag-aaral upang kanilang bakatin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “padron” o “modelong tutularan.” Ang salitang Griyego ay maaaring tumukoy sa isang huwarang sulat na inilalagay sa harap ng mga mag-aaral upang kanilang bakatin.
    reason: Pinananatili ang kongkretong larawang panturo ng ὑπογραμμός na hindi lubos na naihahatid ng “huwaran.”
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: para rito
  rationale: Likas na pariralang Filipino na tumutukoy pabalik sa pagtitiis sa di-makatarungang pagdurusa at pinananatili ang direksiyon o layuning ipinahihiwatig ng εἰς.
- source_word: ἐκλήθητε
  choice: kayo tinawag
  rationale: Pinananatili ang balintiyak at ang teolohikal na diwa ng banal na pagtawag nang hindi dinaragdagan ng isang partikular na doktrina tungkol sa bisa nito.
- source_word: ὅτι
  choice: yamang
  rationale: Ipinakikita ang batayan o paliwanag ng pagkatawag habang iniiwasan ang mabigat na pag-uulit ng “sapagkat” sa iisang pangungusap.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulo ng Pinahiran, alinsunod sa gamit nito rito.
- source_word: ἔπαθεν
  choice: nagdusa
  rationale: Tuwirang salin na hindi nagdaragdag ng uri o lawak ng pagdurusang hindi tahasang binanggit sa talata.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: 'Natural at malawak ang saklaw: maaaring magpahiwatig ng kapakinabangan o pagkatawan nang hindi ipinipilit ang mas makitid na kahulugang “kapalit ninyo.”'
- source_word: ὑμῖν ὑπολιμπάνων
  choice: nag-iwan sa inyo
  rationale: Malinaw na ang Mesiyas ang nag-iwan at ang huwaran ay iniwan para sa mga mambabasa.
- source_word: ὑπογραμμὸν
  choice: huwaran
  rationale: Naihahatid ang ideya ng modelong tutularan; inilalagay sa talababa ang mas kongkretong larawan ng sulat na binabakat ng mag-aaral.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng sugnay.
- source_word: ἐπακολουθήσητε
  choice: sundan ninyo
  rationale: Natural na Filipino para sa pagsunod sa landas o halimbawa ng isang tao.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: ang kanyang mga yapak
  rationale: Pinananatili ang metapora ng pagtahak sa dinaanan ng Mesiyas at malinaw sa mga modernong mambabasa.
theological_decisions:
- issue: Diwa ng ὑπὲρ ὑμῶν kaugnay ng pagdurusa ng Mesiyas
  choice: para sa inyo
  alternative: alang-alang sa inyo; sa halip ninyo
  rationale: Tiyak na sinasabing nagdusa ang Mesiyas para sa mga mambabasa, ngunit nakatuon ang agarang konteksto sa kanyang pagdurusa bilang huwarang susundan. Pinananatili ng “para sa inyo” ang kapakinabangan, pagkatawan, at posibleng pamalit na diwa nang hindi nilulutas ang teolohikal na tensiyon sa isang mas makitid na pormula.
- issue: Ugnayan ng pagkatawag at pagdurusa
  choice: para rito kayo tinawag
  alternative: dahil dito kayo tinawag; sa layuning ito kayo tinawag
  rationale: Tumutukoy pabalik sa pagtitiis sa di-makatarungang pagdurusa, ngunit hindi tahasang nililimitahan ang pahayag sa isang ganap na ipinaliwanag na layunin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mesiyas” bilang titulong madaling maunawaan, “huwaran” para sa likas na daloy, at “mga yapak” upang mapanatili ang matingkad na metapora ng orihinal.
