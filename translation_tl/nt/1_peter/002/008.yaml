  naturalness: Hindi natural sa modernong Filipino ang “batong-batong ikabubuwal.” Ang “malaking batong ikabubuwal” ay malinaw, marangal, at naipapahiwatig ang kaibhan ng πέτρα mula sa λίθος nang hindi ginagawang teknikal ang pananalita. Ang “sa bagay na ito” ay mas likas at mas malinaw na panandang tumutukoy sa sinadyang malabong antecedent kaysa “sa ganito.”
  terminology: Pinananatili ang “salita” para sa λόγος at ang walang-pinangalanang pasibo sa “itinalaga.” Hindi pinapangalanan ang Diyos bilang ahente at hindi nilulutas ang pinagtatalunang saklaw ng huling sugnay.
