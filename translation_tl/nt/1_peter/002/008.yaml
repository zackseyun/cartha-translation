  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: tl
  text: at, “isang batong katitisuran at isang malaking batong ikabubuwal.” Natitisod sila dahil sinusuway nila ang salita, at sa bagay na ito rin sila itinalaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “at dito rin sila itinakda.” Hindi tiyak kung ang “bagay na ito” ay tumutukoy sa pagkatisod, sa pagsuway, o sa kalalabasan ng mga ito.'
    reason: Itinatala ang lehitimong sintaktiko at teolohikal na kalabuan ng εἰς ὃ καὶ ἐτέθησαν.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: isang batong katitisuran
  rationale: Pinananatili ang metapora at ang diwa ng isang batong nagiging sanhi ng pagkatisod.
- source_word: πέτρα σκανδάλου
  choice: batong-batong ikabubuwal
  rationale: Ipinapakita ang mas malaking batong nagiging sanhi ng pagbagsak, habang iniiwasan ang makabagong diwang limitado sa emosyonal na ‘pagkakasala’.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: dahil sinusuway nila ang salita
  rationale: Ang ἀπειθέω ay nagpapahiwatig ng pagtangging sumunod o maniwala; ang ‘sinusuway’ ay natural at pinananatili ang aspektong pagsuway.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: at sa ganito rin sila itinalaga
  rationale: Pinananatili ang pasibong ἐτέθησαν at ang sadyang malabong tinutukoy ng εἰς ὅ, nang hindi ipinapaliwanag kung ang pagtatalaga ay sa pagkatisod, pagsuway, o bunga nito.
theological_decisions:
- issue: Saklaw ng ‘sa ganito’ sa εἰς ὃ
  choice: sa ganito rin sila itinalaga
  alternative: itinalaga rin silang matisod
  rationale: Ang Griyego ay may tunay na kalabuan sa antecedent. Hindi tahasang nililimitahan ng salin ang pagtatalaga sa pagkatisod o sa pagsuway.
- issue: Ahente ng pasibong ἐτέθησαν
  choice: pasibong ‘itinalaga’ nang hindi pinapangalanan ang ahente
  alternative: itinalaga sila ng Diyos
  rationale: Bagaman maaaring ipahiwatig ang Diyos bilang ahente, hindi siya tahasang pinangalanan sa teksto; kaya hindi ito idinaragdag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkatambal na larawan ng bato at ang tensiyong teolohikal sa huling sugnay; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
