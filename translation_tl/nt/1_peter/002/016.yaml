  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: tl
  text: Mamuhay kayo bilang mga taong malaya, ngunit huwag ninyong gamitin ang inyong kalayaan bilang pantakip sa kasamaan; sa halip, mamuhay kayo bilang mga alipin ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: mga taong malaya
  rationale: Tumutukoy ang pang-uri sa mga tagapakinig bilang isang pangkat. Likas at inklusibo sa modernong Filipino ang “mga taong malaya,” at pinananatili nito ang kalagayang panlipunan ng pagiging malaya.
- source_word: ἐπικάλυμμα
  choice: pantakip
  rationale: Pinananatili ng “pantakip” ang konkretong larawan ng isang bagay na nagkukubli ng masama. Higit itong malapit sa salitang Griyego kaysa sa “dahilan” o “pagdadahilan.”
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: gamitin ang kalayaan bilang
  rationale: Bagaman literal na “taglay ang kalayaan bilang pantakip,” natural na ipinahahayag sa Filipino ang instrumental na diwa sa pamamagitan ng “gamitin ... bilang,” nang hindi nawawala ang kahulugan.
- source_word: κακίας
  choice: kasamaan
  rationale: Malawak ang saklaw ng κακία rito—masamang asal o gawa—kaya mas angkop ang pangkalahatang “kasamaan” kaysa sa mas makitid na “masamang hangarin.”
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Sadyang itinatambis ng talata ang pagiging malaya at ang lubos na pag-aari at paglilingkod sa Diyos. Pinananatili ng “mga alipin” ang lakas at tensiyon ng δοῦλοι; mapalalambot iyon ng “mga lingkod.”
- source_word: θεοῦ δοῦλοι
  choice: mga alipin ng Diyos
  rationale: Malinaw na ipinahahayag nito ang kaugnayang pag-aari at lubos na pagpapasakop sa Diyos, habang pinananatili ang retorikal na pagtutol sa “mga taong malaya.”
theological_decisions:
- issue: Paglalarawan sa mga Cristiano bilang δοῦλοι ng Diyos
  choice: mga alipin ng Diyos
  alternative: mga lingkod ng Diyos
  rationale: Ang kabalintunaan ng talata ay ang mga malaya ay lubos ding pag-aari ng Diyos. Hindi dapat palambutin ang sinadyang tensiyong ito, kaya “mga alipin” ang ginamit.
- issue: Pahiwatig na pandiwa sa pariralang ὡς ἐλεύθεροι
  choice: Mamuhay kayong gaya ng mga taong malaya
  alternative: bilang mga taong malaya
  rationale: Nakadepende ang pariralang ito sa pautos na konteksto ng naunang talata (ὑποτάγητε, 2:13). Inilantad sa Filipino ang ipinahihiwatig na paraan ng pamumuhay upang maging buo at natural ang talata, nang hindi ginagawang pahayag tungkol lamang sa legal na katayuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magkatapat na “malaya” at “mga alipin,” gayundin ang metapora ng “pantakip.” Inulit ang “mamuhay kayong gaya” sa huling sugnay upang malinaw ang paralelismo at natural ang daloy sa Filipino.
