  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: tl
  text: o sa mga gobernador[a], bilang mga isinugo niya upang parusahan ang mga gumagawa ng masama at purihin ang mga gumagawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “niya” ay malamang na tumutukoy sa hari o emperador na binanggit sa naunang talata; inuunawa naman ng ilan na mas malawak itong tumutukoy sa Diyos bilang siyang nag-aayos ng awtoridad.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: o
  rationale: Ipinagpapatuloy nito ang tambalang pagpipilian mula sa naunang talata; natural at maikli ang “o” sa Filipino.
- source_word: ἡγεμόσιν
  choice: mga gobernador
  rationale: Tumutukoy ito sa mga namamahalang opisyal sa kontekstong sibiko; sapat na tiyak ang “mga gobernador” nang hindi ipinipilit ang isang mas makitid na katungkulang Romano.
- source_word: ὡς
  choice: bilang
  rationale: Inilalarawan nito ang mga gobernador ayon sa kanilang katayuan bilang mga isinugo; natural sa Filipino ang “bilang.”
- source_word: δι’ αὐτοῦ
  choice: niya
  rationale: Sa pariralang “mga isinugo niya,” malinaw at natural na naipahahayag ang ahensiya ng διά na may genitive. Pinakamalapit na tinutukoy ng panghalip ang hari o emperador sa naunang talata, ngunit pinananatili sa talababa ang posibleng mas malawak na pagtukoy sa Diyos.
- source_word: πεμπομένοις
  choice: mga isinugo
  rationale: Pinananatili nito ang ideya ng ipinadalang mga kinatawan o opisyal nang hindi dinaragdagan ng mas matinding diwa ng pormal na pagkokomisyon.
- source_word: εἰς ἐκδίκησιν
  choice: upang parusahan
  rationale: Sa konteksto ng pamahalaan, tumutukoy ito sa paglalapat ng kaparusahan o katarungan, hindi sa personal na paghihiganti. Ang pandiwang anyo ay mas natural sa modernong Filipino.
- source_word: κακοποιῶν
  choice: ang mga gumagawa ng masama
  rationale: Pinananatili nito ang pandiwang diwa at inilalarawan ang mga taong gumagawa ng masama.
- source_word: ἔπαινον
  choice: parangalan
  rationale: Maaaring mangahulugan ang ἔπαινος ng papuri o pagkilala. Sa tungkuling pampamahalaan, natural ang “parangalan” at pinananatili nito ang positibong katapat ng pagpaparusa.
- source_word: ἀγαθοποιῶν
  choice: ang mga gumagawa ng mabuti
  rationale: Natural at tuwirang salin ito na pinananatili ang pandiwang ideya ng paggawa ng mabuti.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ sa δι’ αὐτοῦ
  choice: Ang hari o emperador na binanggit sa naunang talata ang pinakamalapit na tinutukoy.
  alternative: Maaaring unawain ang Diyos bilang siyang nag-aayos o nagpapahintulot sa awtoridad.
  rationale: Ang pinakamalapit at pinakanatural na antecedent sa daloy ng pangungusap ay ang hari o emperador sa talata 13. Gayunman, hindi tahasang pinangalanan ng Griyego ang tinutukoy ng panghalip, kaya inilalahad sa talababa ang ibang pagkaunawa nang hindi nilulutas nang sapilitan ang tensiyong teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “gobernador” bilang pamilyar na katawagan sa namamahalang opisyal, at pinanatili ang talata bilang pagpapatuloy ng pangungusap mula sa 1 Pedro 2:13.
