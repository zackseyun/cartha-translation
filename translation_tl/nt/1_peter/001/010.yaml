  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: tl
  text: Tungkol sa kaligtasang ito, masigasig na nagsaliksik at nagsiyasat ang mga propetang nagpropesiya tungkol sa biyaya para sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungkol sa biyayang darating sa inyo.” Mahihinuha sa konteksto ang diwang panghinaharap, ngunit hindi ito tahasang sinasabi sa Griyego ng talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Tungkol sa kaligtasang ito
  rationale: Ipinakikilala ng περί na may genitibo ang paksa, at ang ἧς ay tumutukoy sa kaligtasang nabanggit sa naunang konteksto. Likas sa modernong Tagalog ang “kaligtasang ito” at napananatili nito ang pagtukoy pabalik.
- source_word: ἐξεζήτησαν καὶ ἐξηραύνησαν
  choice: masigasig na nagsaliksik at nagsiyasat
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pandiwa at ang diin ng masusing paghahanap. Ang “masigasig” ay inilalapat sa buong tambalang kilos upang maging natural at hindi paulit-ulit sa Tagalog.
- source_word: προφῆται
  choice: ang mga propeta
  rationale: Bagaman walang artikulo ang pangngalan, tiyak na tinutukoy ito ng kasunod na pariralang participial; natural sa Tagalog ang “ang mga propeta.”
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: ang mga propetang nagpahayag tungkol sa biyayang para sa inyo
  rationale: Ginawang panuring sa “mga propeta” ang articular participle. Ipinahahayag ng περί ang nilalaman ng kanilang propesiya, at pinananatili ng “para sa inyo” ang maaaring direksiyonal o kapakinabangang diwa ng εἰς ὑμᾶς.
- source_word: χάριτος
  choice: biyaya
  rationale: Ang “biyaya” ang karaniwan at angkop na salin ng χάρις sa kontekstong tumutukoy sa mapagpalang kaloob at pagliligtas ng Diyos.
theological_decisions:
- issue: Kung gagawing tahasan ang hinaharap na diwa ng “biyayang para sa inyo”
  choice: Hindi idinagdag sa pangunahing teksto ang “darating”
  alternative: biyayang darating sa inyo
  rationale: Mahihinuha sa mas malawak na konteksto at sa pasulong na pananaw ng propesiya ang hinaharap na diwa, ngunit walang tahasang pandiwa o participle para rito sa tekstong Griyego ng talatang ito. Kaya pinanatili sa pangunahing teksto ang tunay na kalabuan at inilagay sa talababa ang posibleng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Inayos ang pagkakasunod upang agad magkaugnay ang paksa at ang pangunahing kilos, habang pinananatili ang lahat ng sangkap ng Griyego. Ginamit ang “nagsaliksik at nagsiyasat” upang maipakita ang dalawang pandiwa nang hindi tunog paulit-ulit.
