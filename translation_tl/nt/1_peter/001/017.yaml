  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: tl
  text: At kung tinatawag ninyong Ama[a] ang humahatol nang walang kinikilingan ayon sa gawa ng bawat isa, mamuhay kayo nang may takot[b] sa buong panahon ng inyong paninirahan bilang mga dayuhan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinatawag ninyo siya bilang Ama” o “tumatawag kayo sa kanya bilang Ama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang may pagpipitagan” o “nang may mapitagang pagkamangha.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa buong panahon ng inyong pansamantalang paninirahan” o “sa panahon ng inyong pamumuhay bilang mga dayuhan.” Ang salitang Griyego ay maaaring tumukoy sa pamumuhay bilang dayuhan o pansamantalang residente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: tinatawag ninyong
  rationale: Ipinahahayag nito ang pagtawag o pakikipag-usap sa Diyos bilang Ama, habang nananatiling natural sa modernong Tagalog. Ang posibleng diwa ng pagtawag sa kanya o pagdalangin sa kanya ay inilagay sa talababa.
- source_word: πατέρα
  choice: Ama
  rationale: 'Predikatibo ang gamit: kinikilala at tinatawag ng mga mananampalataya ang Diyos bilang Ama. Ginamit ang malaking titik sapagkat tumutukoy ito sa Diyos.'
- source_word: ἀπροσωπολήμπτως
  choice: nang walang kinikilingan
  rationale: Malinaw at karaniwang Tagalog ito para sa paghatol na hindi nakabatay sa katayuan o panlabas na pagkatao.
- source_word: κρίνοντα
  choice: ang humahatol
  rationale: Inilalarawan ng kasalukuyang participle ang Ama bilang siyang patuloy na humahatol; natural itong naipapahayag sa Tagalog sa pariralang ito.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: ayon sa gawa ng bawat isa
  rationale: Pinananatili nito ang pamantayan ng paghatol at ang pananagutan ng bawat tao. Ang isahang ἔργον ay isinalin ding isahan nang hindi dinaragdagan ng sistematikong paliwanag.
- source_word: ἐν φόβῳ
  choice: nang may takot
  rationale: Pinananatili nito ang tuwirang diwa at ang tensiyon sa pagitan ng pagiging Ama ng Diyos at ng kanyang walang-kinikilingang paghatol; hindi ito agad nililimitahan sa paggalang lamang.
- source_word: παροικίας
  choice: paninirahan bilang mga dayuhan
  rationale: Ipinahahayag nito ang kalagayan ng pansamantalang naninirahan sa lugar na hindi sariling bayan, sa mas madaling maunawaang Tagalog kaysa sa isang teknikal o makalumang salita.
- source_word: ἀναστράφητε
  choice: mamuhay kayo
  rationale: Sa konteksto, tumutukoy ito sa paraan ng pamumuhay o asal. Ang 'mamuhay kayo' ay natural at nananatili ang puwersa ng pautos.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: sa buong panahon ng inyong paninirahan bilang mga dayuhan
  rationale: Ipinakikita ng 'sa buong panahon' ang tagal na saklaw ng utos, at pinananatili ng natitirang parirala ang motibo ng pagiging dayuhan o pansamantalang naninirahan.
theological_decisions:
- issue: Kahulugan ng φόβος kaugnay ng Diyos bilang Ama at Hukom
  choice: nang may takot
  alternative: nang may pagpipitagan; nang may banal na pagkamangha
  rationale: Magkasamang inilalahad ng talata ang pagiging Ama ng Diyos at ang kanyang walang-kinikilingang paghatol. Pinananatili ng 'takot' ang moral na bigat at hindi tahimik na nilulutas ang tensiyon bilang paggalang lamang.
- issue: Saklaw ng paghatol ayon sa gawa
  choice: ayon sa gawa ng bawat isa
  alternative: ayon sa mga gawa ng bawat isa; ayon sa ginawa ng bawat isa
  rationale: Tuwirang isinasalin ang pahayag ng Griyego nang hindi nagpapasok ng partikular na doktrina tungkol sa merito, katiyakan ng kaligtasan, o eksaktong yugto ng paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mamuhay” sa halip na mas pormal na “umasal,” at “paninirahan bilang mga dayuhan” sa halip na makaluma o teknikal na “pakikipamayan.” Pinanatili ang “takot” upang hindi pahinain ang teolohikal na tensiyon ng talata.
