source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: tl
  text: 'ayon sa paunang kaalaman[a] ng Diyos Ama, sa pagpapabanal ng Espiritu,[b] para sa pagsunod at pagwiwisik ng dugo[c] ni Jesus na Mesiyas: Sumagana nawa sa inyo ang biyaya at kapayapaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paunang kaalaman” ay salin ng πρόγνωσις. Nagkakaiba ang pagkaunawa kung binibigyang-diin nito ang naunang kaalaman ng Diyos, ang kaniyang naunang pagpili, o kapuwa.
    reason: lexical_alternative
  - marker: b
    text: Sa tatluhang banggit sa Diyos Ama, sa Espiritu, at kay Jesus na Mesiyas, ang “Espiritu” ay nauunawaang tumutukoy sa Banal na Espiritu.
    reason: referent_clarification
  - marker: c
    text: Ang “pagwiwisik ng dugo” ay malamang na nagpapahiwatig ng mga larawan ng tipan at paglilinis sa Lumang Tipan, lalo na sa Exodo 24:8. Maaari ring isalin ang titulong “Mesiyas” bilang “Cristo.”
    reason: cross_reference_and_alternative_rendering
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: ayon sa paunang kaalaman
  rationale: Ipinakikita ng “ayon sa” ang pamantayan o pagkakatugma na ipinahihiwatig ng κατά. Pinananatili ng “paunang kaalaman” ang pangunahing diwa ng πρόγνωσις nang hindi ipinapasya sa salin kung ito ay tumutukoy sa paunang pagkakaalam, pagpili, o kapuwa.
- source_word: θεοῦ πατρός
  choice: ng Diyos Ama
  rationale: Natural at marangal itong anyo sa modernong Tagalog at pinananatili ang ugnayang appositional ng dalawang pangngalan.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: sa pagpapabanal ng Espiritu
  rationale: Ang “pagpapabanal” ay malinaw sa karaniwang mambabasa at tumutukoy sa paggawa o kalagayan ng pagiging banal. Pinananatili ng “ng Espiritu” ang anyo ng genitive habang ang malaking titik ay tumutukoy sa Banal na Espiritu.
- source_word: εἰς ὑπακοὴν
  choice: para sa pagsunod
  rationale: Likas na ipinahahayag ng “para sa” ang layunin o bunga na maaaring taglayin ng εἰς.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: at sa pagwiwisik ng dugo
  rationale: Malapit ito sa anyo ng Griyego at pinananatili ang larawang tipan at paglilinis na kaugnay ng pagwiwisik ng dugo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas”; ang “na” ay natural na paraan sa Tagalog upang ipakilalang si Jesus ang Mesiyas.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Sumagana nawa sa inyo ang biyaya at kapayapaan
  rationale: Ipinahahayag ng “nawa” ang hangarin o pagpapalang nasa optative, at natural na inilalarawan ng “sumagana” ang pagdami o paglago ng biyaya at kapayapaan.
theological_decisions:
- issue: Kahulugan ng πρόγνωσις kaugnay ng pagpili ng Diyos
  choice: Isinalin nang neutral bilang “paunang kaalaman.”
  alternative: paunang pagpili; paunang pagtatakda; paunang pagkakilala
  rationale: Hindi tiyak sa salita lamang kung binibigyang-diin ang naunang kaalaman, pagpili, o kapuwa; hindi nilulutas ng salin ang pinagtatalunang usaping ito.
- issue: Tinutukoy ng πνεύματος
  choice: “Espiritu,” na tumutukoy sa Banal na Espiritu
  alternative: espiritu ng tao o di-personal na diwa
  rationale: Ang tatluhang kayarian—Diyos Ama, Espiritu, at Jesus na Mesiyas—ay matibay na nagpapahiwatig na ang Banal na Espiritu ang tinutukoy.
- issue: Lakas ng titulong Χριστοῦ
  choice: “Mesiyas” bilang titulo
  alternative: Cristo bilang anyong halos pangalan na
  rationale: Pinananatili ng “Mesiyas” ang makabuluhang titulong taglay ng Χριστός sa kontekstong ito nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Diyos Ama,” “pagpapabanal,” at “Mesiyas” bilang mga terminong teolohikal na pamilyar ngunit hindi labis na teknikal. Ang pangungusap ay nananatiling bahagi ng mas mahabang pagbati sa 1 Pedro 1:1–2.
