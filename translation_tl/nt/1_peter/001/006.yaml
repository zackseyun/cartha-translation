  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: tl
  text: Dito kayo lubos na nagagalak, bagaman ngayon ay napipighati kayo nang maikling panahon, kung kinakailangan, dahil sa sari-saring pagsubok[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring tumukoy sa mga pagsubok na sumusukat o sumusuri; sa ibang konteksto, ang salitang Griyego ay maaari ring mangahulugang “mga tukso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Dito
  rationale: Likas at maikli sa Filipino, at pinananatili ang pagtukoy sa kabuuan ng pag-asa, mana, at kaligtasang binanggit sa naunang mga talata nang hindi tahasang ginagawang sanhi ang parirala.
- source_word: ἀγαλλιᾶσθε
  choice: lubos na nagagalak
  rationale: Ipinahahayag ng pandiwa ang matindi o masiglang kagalakan; natural sa modernong Filipino ang pariralang ito at mas malinaw kaysa sa mas makalumang 'nagbubunyi.'
- source_word: ὀλίγον ἄρτι
  choice: sa ngayon, sa maikling panahon
  rationale: Pinananatili nito kapwa ang kasalukuyang panahon ng ἄρτι at ang kaiklian ng ὀλίγον.
- source_word: εἰ δέον
  choice: kung kinakailangan
  rationale: Pinananatili ang kondisyunal na diwa ng εἰ at ang pangangailangan sa δέον, nang hindi ipinapaliwanag kung sino ang nagtatakda ng pangangailangang iyon.
- source_word: λυπηθέντες
  choice: napighati kayo
  rationale: Ipinakikita ang dinanas na kalungkutan at ang pasibong diwa ng pandiwa sa isang marangal ngunit nauunawaang anyo.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: dahil sa sari-saring pagsubok
  rationale: Ang 'pagsubok' ang angkop sa konteksto ng pagdurusa at pagsubok sa pananampalataya. Ang 'dahil sa' ay natural na naghahayag ng kalagayan o paraang nagdulot ng pighati, at ang 'sari-sari' ay tumutugma sa ποικίλοις.
theological_decisions:
- issue: Kahulugan ng πειρασμοῖς sa konteksto ng pagdurusa
  choice: pagsubok
  alternative: mga tukso
  rationale: Ang kasunod na talata ay tumutukoy sa pagsubok sa pagiging tunay ng pananampalataya, kaya higit na angkop dito ang panlabas na mga pagsubok o paghihirap. Gayunman, hindi inaalis ang ibang posibleng kahulugan ng salitang Griyego, kaya binanggit ang 'mga tukso' sa talababa.
- issue: Ugnayan ng kagalakan at pighati
  choice: pinanatiling magkasabay ang kasalukuyang kagalakan at pansamantalang pighati
  alternative: ipaliwanag ang kagalakan bilang nagaganap lamang sa hinaharap o pagkatapos ng mga pagsubok
  rationale: 'Ang kasalukuyang anyo ng ἀγαλλιᾶσθε at ang konsesibong participle ay nagpapakita ng tunay na tensiyon: nagagalak sila kahit napipighati. Hindi ito nilutas o pinahina sa salin.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'lubos na nagagalak' sa halip na mas makalumang 'nagbubunyi,' at 'napighati' upang mapanatili ang emosyonal na bigat ng teksto. Inilagay ang talababa sa 'pagsubok,' ang salitang aktuwal nitong nililinaw.
