base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: tl
  text: na sa pamamagitan niya ay sumasampalataya sa Diyos[a], na muling bumuhay sa kanya mula sa mga patay at nagbigay sa kanya ng kaluwalhatian, kaya ang inyong pananampalataya at pag-asa ay nasa Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tapat sa Diyos”; ngunit sa kontekstong ito, malamang na tumutukoy ito sa mga sumasampalataya sa Diyos sa pamamagitan ni Cristo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “na ang naging bunga ay nasa Diyos ang inyong pananampalataya at pag-asa,” o “upang ang inyong pananampalataya at pag-asa ay mapasa Diyos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Likas na salin ng διά na may genitive, na nagpapahayag na si Cristo ang tagapamagitan o paraan ng pagsampalataya sa Diyos.
- source_word: πιστοὺς εἰς θεόν
  choice: sumasampalataya sa Diyos
  rationale: Bagaman maaaring mangahulugan ang πιστός na “tapat,” ang kasunod na εἰς θεόν ay higit na tumutukoy sa paniniwala o pagtitiwala sa Diyos.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: na bumuhay sa kanya mula sa mga patay
  rationale: Malinaw at karaniwang pananalita sa Filipino para sa pagbuhay na muli, habang pinananatili ang larawan ng ἐκ νεκρῶν, “mula sa mga patay.”
- source_word: δόξαν αὐτῷ δόντα
  choice: nagbigay sa kanya ng kaluwalhatian
  rationale: Tuwirang pinananatili ang kilos ng Diyos na pagkakaloob ng kaluwalhatian kay Cristo.
- source_word: ὥστε
  choice: kaya
  rationale: Natural na ipinahahayag ang bunga ng pagbuhay at pagbibigay ng kaluwalhatian, nang hindi lubusang isinasara ang posibilidad ng layunin.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: ang inyong pananampalataya at pag-asa
  rationale: Ang “pananampalataya” at “pag-asa” ang karaniwan, malinaw, at teolohikal na hindi labis na nagpapakahulugang mga katumbas.
- source_word: εἶναι εἰς θεόν
  choice: ay nasa Diyos
  rationale: Idyomatikong ipinahahayag na ang Diyos ang pinatutungkulan at pinagsasaligan ng kanilang pananampalataya at pag-asa.
theological_decisions:
- issue: Kahulugan ng πιστούς
  choice: “sumasampalataya” bilang mga naniniwala o nagtitiwala sa Diyos
  alternative: “mga tapat”
  rationale: Ang pariralang εἰς θεόν ay malakas na sumusuporta sa diwa ng paniniwala sa Diyos, ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo.
- issue: Papel ni Cristo sa paglapit sa Diyos
  choice: “sa pamamagitan niya”
  alternative: “dahil sa kanya” o “sa pamamagitan ng pagkilos niya”
  rationale: Pinananatili nito ang mediated na ugnayan na ipinahihiwatig ng διά + genitive nang hindi nagdaragdag ng sistematikong pormulasyon.
- issue: Lakas ng ὥστε
  choice: “kaya” bilang pagpapahayag ng bunga
  alternative: “upang” bilang layunin o “na ang naging bunga ay”
  rationale: Sa konteksto, malinaw ang resultang lohika, ngunit maaaring saklawin ng ὥστε ang bahagyang paglalangkap ng bunga at layunin; kaya binabanggit ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sumasampalataya” sa halip na ang mas abstraktong “mga mananampalataya” upang maging maayos ang dugtong sa naunang talata. Pinanatili ang “kaluwalhatian,” “pananampalataya,” at “pag-asa” bilang pamilyar at tumpak na bokabularyong biblikal.
