  source_fidelity: 'Tumpak na naihahatid ang εἰς bilang “tungo sa,” ang κληρονομία bilang “pamana,” at ang tatlong magkakatugmang paglalarawan ng mana: hindi nasisira, hindi nadudungisan, at hindi kumukupas. Ang balintiyak na “na iniingatan” ay hindi nagdaragdag ng tahasang tagapag-ingat at sapat na sinasalamin ang τετηρημένην. Ang “sa langit para sa inyo” ay likas at tapat sa ἐν οὐρανοῖς εἰς ὑμᾶς.'
