  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: tl
  text: tungo sa isang pamanang hindi nasisira, hindi nadudungisan, at hindi kumukupas, na iniingatan sa langit para sa inyo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: tungo sa isang pamana
  rationale: Pinananatili ng “tungo sa” ang direksiyon ng εἰς at ang pagkakaugnay ng parirala sa naunang talata; ang “pamana” ang likas at malinaw na katumbas ng κληρονομία.
- source_word: ἄφθαρτον
  choice: hindi nasisira
  rationale: Ipinapahayag ang kawalan ng pagkabulok o pagkasira sa payak at kasalukuyang Tagalog.
- source_word: ἀμίαντον
  choice: hindi nadudungisan
  rationale: Pinananatili ang larawan ng isang pamanang walang bahid o karumihan nang hindi nililimitahan ito sa isang partikular na teolohikong paliwanag.
- source_word: ἀμάραντον
  choice: hindi kumukupas
  rationale: Inilalarawan ang hindi paglalaho ng ganda o sigla, ayon sa karaniwang diwa ng salita.
- source_word: τετηρημένην
  choice: na iniingatan
  rationale: Ipinakikita ang patuloy na kalagayang bunga ng pag-iingat na ipinahihiwatig ng perfect passive participle, at malinaw na tumutukoy sa “pamana.”
- source_word: ἐν οὐρανοῖς
  choice: sa langit
  rationale: Ang isahang “langit” ang likas na idyomatikong anyo sa modernong Tagalog para sa Griyegong maramihang οὐρανοῖς sa kontekstong ito.
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Natural na ipinahahayag ang layon o mga tatanggap ng pamanang iniingatan.
theological_decisions:
- issue: Kung sino ang nag-iingat sa pamana
  choice: Gumamit ng balintiyak na “iniingatan” nang hindi pinangalanan ang gumagawa.
  alternative: “na iniingatan ng Diyos”
  rationale: Balintiyak ang Griyego at hindi tahasang pinangalanan sa talatang ito ang gumagawa; iniiwasang magdagdag ng hindi nakasaad kahit malinaw sa mas malawak na konteksto ang banal na pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “hindi” sa tatlong magkakatumbas na paglalarawan upang mapanatili ang diin at balanseng ayos ng Griyego.
