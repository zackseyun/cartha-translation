  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: tl
  text: Bilang mga anak ng pagsunod[a], huwag ninyong iayon ang inyong mga sarili sa mga pagnanasang taglay ninyo noon, sa panahon ng inyong kamangmangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “masunuring mga anak.” Literal sa Griyego: “mga anak ng pagsunod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Bilang
  rationale: Ipinakikilala nito ang pagkakakilanlan o katayuan na dapat umayon sa kasunod na tagubilin; natural dito ang “Bilang” sa makabagong Tagalog.
- source_word: τέκνα ὑπακοῆς
  choice: mga anak ng pagsunod
  rationale: Pinananatili ang di-karaniwang genitibong pahayag ng Griyego at ang diin nito sa pagkakakilanlang inilalarawan ng pagsunod. Ipinaliliwanag sa talababa ang mas natural na alternatibo.
- source_word: μὴ συσχηματιζόμενοι
  choice: huwag ninyong iayon ang inyong sarili
  rationale: Ipinahahayag ang patuloy na pagbabawal at pananagutang moral na nakapaloob sa anyong middle/passive, sa paraang malinaw at natural sa Tagalog.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: sa mga pagnanasang
  rationale: Saklaw ng “pagnanasa” ang malalakas at, sa kontekstong ito, maling hangarin nang hindi nililimitahan ang kahulugan sa seksuwal na pagnanasa.
- source_word: πρότερον
  choice: taglay ninyo noon
  rationale: Malinaw na iniuugnay ang dating panahon sa mga pagnanasang dating humuhubog sa mga mambabasa.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: sa inyong kamangmangan
  rationale: Malapit sa estruktura ng Griyego at pinananatili ang dating kalagayan ng kawalan ng kaalaman nang hindi dinaragdagan kung ano mismo ang hindi nila alam.
theological_decisions:
- issue: Kung gagawing karaniwang pang-uri ang Hebraiko/Semitikong pahayag na τέκνα ὑπακοῆς
  choice: mga anak ng pagsunod
  alternative: masunuring mga anak
  rationale: Pinananatili ng pangunahing teksto ang diin sa pagkakakilanlang may katangian ng pagsunod, habang ibinibigay sa talababa ang mas natural na Tagalog nang hindi nagpapasok ng karagdagang doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang bahagyang di-karaniwang “mga anak ng pagsunod” upang mailantad ang anyo at diin ng orihinal; nililinaw ito ng talababa.
