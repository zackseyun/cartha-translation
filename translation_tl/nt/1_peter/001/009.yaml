  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: tl
  text: habang tinatanggap ninyo ang bunga ng inyong pananampalataya[a]—ang kaligtasan ng inyong mga kaluluwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang katapusan,” “layunin,” o “kinalabasan ng inyong pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang kaligtasan ng inyong mga buhay” o “ang kaligtasan ng inyong buong pagkatao.” Ang salitang Griyego ay maaaring mangahulugang “mga kaluluwa,” “mga buhay,” o “mga tao,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: habang tinatanggap ninyo
  rationale: Ipinahahayag nito ang nagpapatuloy na pagtanggap o pagtatamo at likas na iniuugnay ang pandiwaring Griyego sa mga mambabasa mula sa naunang konteksto.
- source_word: τέλος
  choice: bunga
  rationale: Sa kontekstong ito, tumutukoy ito sa kinalabasan na naisasakatuparan sa pananampalataya. Mas natural ang “bunga” sa Filipino kaysa “katapusan,” na maaaring mapagkamalang panahong wakas lamang.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at angkop na salin dito; ang pariralang “inyong pananampalataya” ay likas na tumutukoy sa pananampalataya ng mga mambabasa.
- source_word: ὑμῶν
  choice: inyong
  rationale: Tuwirang isinasalin ang panghalip na maramihang ikalawang panauhan bilang panuring sa “pananampalataya.”
- source_word: σωτηρίαν
  choice: kaligtasan
  rationale: Ito ang pamantayan at angkop na salin, at naipapanatili nito ang saklaw ng pagliligtas nang hindi nililimitahan sa isang temporal na yugto.
- source_word: ψυχῶν
  choice: mga kaluluwa
  rationale: Tuwirang pinananatili nito ang tradisyonal na diwa ng ψυχή, habang ipinapaliwanag sa talababa na maaari rin itong tumukoy sa buhay o buong pagkatao.
theological_decisions:
- issue: Saklaw ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Sa pariralang “inyong pananampalataya,” pinakamalamang na tumutukoy ito sa pananalig ng mga mambabasa. Hindi kailangan ng konteksto na gawing “katapatan” ang pangunahing salin.
- issue: Kahulugan ng ψυχῶν sa pariralang σωτηρίαν ψυχῶν
  choice: kaligtasan ng inyong mga kaluluwa
  alternative: kaligtasan ng inyong mga buhay o ng inyong buong pagkatao
  rationale: Pinananatili ng pangunahing teksto ang tuwirang salin ngunit hindi nito ipinapalagay ang mahigpit na paghihiwalay ng katawan at kaluluwa. Inilalahad sa talababa ang mas malawak na saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “habang” upang mapanatili ang ugnayang pandiwari at nagpapatuloy na diwa ng κομιζόμενοι; ginamit ang em dash upang malinaw na ipakitang ang “kaligtasan” ang pagpapaliwanag sa bunga ng pananampalataya.
