id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: tl
  text: sapagkat, “Ang lahat ng laman ay tulad ng damo,[a] at ang lahat ng kaluwalhatian nito ay tulad ng bulaklak ng damo; natuyo ang damo, at nalaglag ang bulaklak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong sangkatauhan.” Ang salitang Griyego ay literal na “lahat ng laman,” na umaalingawngaw sa Isaias 40:6 at nagbibigay-diin sa pagiging mortal ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang kasulatang batayan ng naunang pahayag at pinananatili ang ugnayang sanhi.
- source_word: πᾶσα σὰρξ
  choice: ang lahat ng laman
  rationale: Pinananatili ang literal at biblikal na larawan ng mortal na sangkatauhan at ang alingawngaw ng Isaias 40:6; hindi ito tumutukoy rito sa makasalanang kalikasan.
- source_word: ὡς χόρτος
  choice: ay tulad ng damo
  rationale: Natural na paghahambing sa Tagalog na tapat sa larawan ng panandaliang buhay.
- source_word: πᾶσα δόξα αὐτῆς
  choice: ang lahat ng kaluwalhatian nito
  rationale: Ang “kaluwalhatian” ay nagpapanatili sa lawak ng δόξα bilang karangalan o kaningningan, at ang “nito” ay tumutukoy pabalik sa kolektibong “laman.”
- source_word: ὡς ἄνθος χόρτου
  choice: ay tulad ng bulaklak ng damo
  rationale: Pinananatili ang tiyak na larawang genitibo ng tekstong Griyego at ng sipi mula sa Isaias.
- source_word: ἐξηράνθη
  choice: natuyo
  rationale: Karaniwan at angkop na paglalarawan sa damong nawalan ng buhay o halumigmig.
- source_word: ἐξέπεσεν
  choice: nalaglag
  rationale: Likas na salitang Tagalog para sa bulaklak na humiwalay at bumagsak.
theological_decisions:
- issue: Kahulugan ng σάρξ sa sipi tungkol sa pagiging mortal ng tao
  choice: lahat ng laman
  alternative: buong sangkatauhan
  rationale: Ang konteksto ay kahinaan at paglipas ng mortal na buhay, hindi katiwaliang moral. Pinananatili rin ng “laman” ang intertekstuwal na alingawngaw ng Isaias 40:6 nang hindi nilulutas ang talinghaga sa isang paliwanag.
- issue: Saklaw ng δόξα
  choice: kaluwalhatian
  alternative: karangyaan
  rationale: Mas malawak ang “kaluwalhatian” at maaaring sumaklaw sa karangalan, kaningningan, at ipinagmamalaking kahusayan ng tao; hindi nito nililimitahan ang salita sa materyal na karangyaan lamang.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang anyong patula at ang semicolon upang dumaloy ang sipi bilang isang pangungusap. Gumamit ng panipi upang malinaw na markahan ang sipi sa Kasulatan.
