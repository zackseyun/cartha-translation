id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: tl
  text: sinisiyasat nila kung sino o kung anong uri ng panahon ang ipinahihiwatig ng Espiritu ng Mesiyas na nasa kanila, habang ito’y patiunang nagpapatotoo tungkol sa mga pagdurusang nakalaan sa Mesiyas[a] at sa mga kaluwalhatiang kasunod ng mga pagdurusang iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pagdurusa ng Mesiyas.”
    reason: Pinananatili ang isang malakas at tradisyonal na pagbasa sa di-tiyak na pariralang τὰ εἰς Χριστὸν παθήματα.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: sinisiyasat nila
  rationale: Ipinagpapatuloy ng participle ang gawain ng mga propeta sa naunang talata. Ang “sinisiyasat” ay natural sa makabagong Filipino at pinananatili ang diwa ng masusing paghahanap o pagsisiyasat.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: kung sino o kung anong uri ng panahon
  rationale: 'Pinananatili nito ang dalawang bahagi ng mahirap na parirala: ang τίνα bilang tanong tungkol sa persona (“kung sino”) at ang ποῖον καιρόν bilang tanong tungkol sa uri o katangian ng panahon. Hindi ito pinaiikli sa isang tanong lamang tungkol sa panahon.'
- source_word: ἐδήλου
  choice: ipinahihiwatig
  rationale: Ang imperpektong anyo ay angkop na naipahahayag bilang patuloy na pagpapahiwatig. Hindi nito ipinapalagay na lubos nang nilinaw ang lahat ng detalye.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: ang Espiritu ng Mesiyas na nasa kanila
  rationale: Tuwirang pinananatili ang kaugnayan ng Espiritu sa Mesiyas at ang katotohanang nasa mga propeta ang Espiritu. Isinalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: προμαρτυρόμενον
  choice: nang patiunang nagpapatotoo ito
  rationale: Pinananatili ng “nagpapatotoo” ang diwa ng μαρτυρέω at ng “patiuna” ang temporal na puwersa ng πρό-. Ang “ito” ay malinaw na tumutukoy sa Espiritu.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: mga pagdurusang nakalaan sa Mesiyas
  rationale: Ipinahahayag nito ang direksiyon o kaugnayang dala ng εἰς nang hindi basta ginagawang tahasang pagmamay-ari ang parirala. Dahil pinagtatalunan ang eksaktong puwersa nito, inilagay sa talababa ang malakas at tradisyonal na alternatibo.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: mga kaluwalhatiang kasunod ng mga iyon
  rationale: Pinananatili ang maramihang “mga kaluwalhatian” at ang temporal na pagkakasunod pagkatapos ng mga pagdurusa. Ang “mga iyon” ay natural na tumutukoy sa naunang binanggit na mga pagdurusa.
theological_decisions:
- issue: Ang kahulugan ng “Espiritu ng Mesiyas” kaugnay ng mga propeta
  choice: Panatilihin ang tuwirang pananalitang “ang Espiritu ng Mesiyas na nasa kanila.”
  alternative: ang Espiritung propetiko na nagsasalita tungkol sa Mesiyas; ang Espiritung ibinigay ng Mesiyas
  rationale: Inilalarawan ng Griyego ang Espiritung kaugnay ng Mesiyas bilang kumikilos sa mga propeta. Hindi ito binawasan sa isang paliwanag na magpapasya sa higit pa sa mismong teksto.
- issue: Ang puwersa ng εἰς sa τὰ εἰς Χριστὸν παθήματα
  choice: “mga pagdurusang nakalaan sa Mesiyas” sa pangunahing teksto
  alternative: “mga pagdurusa ng Mesiyas”
  rationale: Hindi karaniwang genitive ang ginamit ng Griyego kundi εἰς, kaya pinananatili sa pangunahing teksto ang ideya ng paglalaan o pagtutungkol. Gayunman, tunay at malakas na pagbasa ang pagdurusa mismo ng Mesiyas, kaya tahasan itong pinananatili sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Mesiyas” bilang salin ng titulong Χριστός. Pinanatili ang bahagyang masalimuot na dalawang tanong (“kung sino” at “kung anong uri ng panahon”), ang aktibong patotoo ng Espiritu, at ang maramihang “mga kaluwalhatian.”
