  naturalness: Natural at marangal ang pangkalahatang rehistro, ngunit mas malinaw at idiomatiko ang “lubos kayong nagagalak” kaysa “nag-uumapaw sa kagalakan.” Ang “Bagaman” ay mas tiyak na naghahayag ng concessive na ugnayan kaysa “Kahit,” na maaari ring mangahulugang “even if.”
  terminology: Ang “iniibig,” “nananalig,” at “kaluwalhatian” ay angkop sa modernong Filipino Tagalog na rehistrong pang-Kasulatan. Ginawang “maluwalhating” ang huling paglalarawan para sa malinaw at natural na katumbas ng δεδοξασμένῃ; pinananatili ng talababa ang mas malapit na alternatibong may diwang “niluwalhati.”
