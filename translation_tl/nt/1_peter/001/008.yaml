    rationale: Ang Griyego ay perfect passive participle (“niluwalhati/glorified”), samantalang ang “puspos ng” ay isang makinis ngunit pinalawak na pagpapakahulugan. Ang “maluwalhating” ay mas natural sa pangunahing teksto, habang ang mas literal na posibilidad ay maaaring ilagay sa talababa.
