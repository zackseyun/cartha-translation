revisions:
- from: Kahit hindi ninyo siya nakita, iniibig ninyo siya. Kahit hindi ninyo siya nakikita ngayon, nananalig kayo sa kanya at nag-uumapaw sa kagalakang hindi kayang ipahayag at puspos ng kaluwalhatian.[a]
  to: Bagaman hindi pa ninyo siya nakita, iniibig ninyo siya. Bagaman hindi ninyo siya nakikita ngayon, nananalig kayo sa kanya at lubos kayong nagagalak nang may kagalakang hindi kayang ipahayag at maluwalhati.[a]
  rationale: Pinalitan ang “Kahit” ng “Bagaman” upang malinaw ang concessive na ugnayan. Idinagdag ang “pa” sa unang sugnay upang idiomatikong maipahayag ang kawalan ng karanasan sa pagkakita hanggang sa kasalukuyan, samantalang pinanatili ang “ngayon” sa ikalawang sugnay para sa ἄρτι. Pinalitan ang “nag-uumapaw sa kagalakan” ng “lubos kayong nagagalak” upang mas tapat na maihatid ang masidhing ἀγαλλιᾶσθε. Ginawang “maluwalhati” ang paglalarawan ng kagalakan bilang natural na Tagalog, at inilipat sa talababa ang mas literal at ang mas ekspansibong mga posibilidad para sa δεδοξασμένῃ.
