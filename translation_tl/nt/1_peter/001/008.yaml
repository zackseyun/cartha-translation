  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: tl
  text: Bagaman hindi pa ninyo siya nakita, iniibig ninyo siya. Bagaman hindi ninyo siya nakikita ngayon, nananalig kayo sa kanya at lubos kayong nagagalak nang may kagalakang hindi kayang ipahayag at maluwalhati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kagalakang puspos ng kaluwalhatian” o “kagalakang niluwalhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: siya
  rationale: Ang panghalip na ito ay tumutukoy kay Jesu-Cristo sa naunang konteksto; natural sa Tagalog ang “siya” bilang layon ng mga pandiwa rito.
- source_word: οὐκ ἰδόντες
  choice: hindi ninyo siya nakita
  rationale: Ang aorist participle ay tumutukoy sa hindi nila pagkakita sa kanya noong nakaraan; pinananatili ng payak na aspektong naganap ang kaibahan nito sa kasalukuyang μὴ ὁρῶντες.
- source_word: ἀγαπᾶτε
  choice: iniibig ninyo siya
  rationale: Ang kasalukuyang pandiwa ay nagsasaad ng nagpapatuloy na pag-ibig. Dignified at malinaw ang “iniibig” sa modernong Tagalog.
- source_word: εἰς ὃν … πιστεύοντες
  choice: nananalig kayo sa kanya
  rationale: Sa konstruksyong πιστεύω εἰς, ang tinutukoy ay pananampalataya o pagtitiwala na nakatuon sa isang persona. Mas natural na pandiwang Tagalog dito ang “nananalig … sa kanya” kaysa literal na “naniniwala … sa kanya.”
- source_word: ἄρτι μὴ ὁρῶντες
  choice: hindi ninyo siya nakikita ngayon
  rationale: Pinananatili ang kasalukuyan at nagpapatuloy na hindi pagkakita, na naiiba sa naunang οὐκ ἰδόντες.
- source_word: δὲ
  choice: at
  rationale: Ang δέ ay maaaring bahagyang panalungat o panugtong. Naipahihiwatig na ng “Kahit” ang pagsalungat, kaya natural ang “at” nang hindi dinaragdagan ang diin.
- source_word: ἀγαλλιᾶσθε
  choice: nag-uumapaw sa kagalakan
  rationale: Ang pandiwa ay masidhi kaysa karaniwang pagsasaya. Ipinahahayag ng “nag-uumapaw sa kagalakan” ang masiglang pagdiriwang sa natural na Tagalog.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: kagalakang hindi kayang ipahayag
  rationale: Ang dative χαρᾷ ay kaugnay ng paraan o nilalaman ng matinding pagsasaya; ang ἀνεκλάλητος ay kagalakang hindi maisasaysay sa mga salita.
- source_word: δεδοξασμένῃ
  choice: puspos ng kaluwalhatian
  rationale: Ang perpektong pasibong participle ay literal na may diwang “niluwalhati,” ngunit hindi natural sa Tagalog ang “niluwalhating kagalakan.” Ang “puspos ng kaluwalhatian” ay malinaw at pinananatili ang kaugnayan sa δόξα, habang inilalahad sa talababa ang mas payak na alternatibo.
theological_decisions:
- issue: Kahulugan ng πιστεύοντες εἰς ὃν
  choice: nananalig kayo sa kanya
  alternative: sumasampalataya kayo sa kanya; nagtitiwala kayo sa kanya
  rationale: Ang parirala ay nagsasaad ng patuloy na pananampalatayang nakatuon kay Cristo. Sinasaklaw ng “nananalig” ang paniniwala at pagtitiwala nang hindi nagpapasok ng partikular na denominasyonal na paliwanag.
- issue: Paglalarawan ng δεδοξασμένῃ sa kagalakan
  choice: puspos ng kaluwalhatian
  alternative: maluwalhating kagalakan; kagalakang niluwalhati
  rationale: May verbal at passive na anyo ang Griyego, ngunit hindi tiyak kung dapat idiing ang kalagayang niluwalhati, ang pagkapuspos ng kaluwalhatian, o ang pagiging maluwalhati. Gumagamit ang pangunahing teksto ng natural na pariralang nananatiling malapit sa ugat na δόξα at pinananatili sa talababa ang ibang maaaring salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” upang katawanin ang pangmaramihang ikalawang panauhan ng Griyego. Iniwasan ang sobrang literal at di-natural na participial syntax, ngunit pinanatili ang kaibahan ng nakaraang hindi pagkakita at kasalukuyang hindi pagkakita.
