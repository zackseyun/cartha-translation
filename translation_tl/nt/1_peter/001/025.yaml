id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: tl
  text: Ngunit ang salita ng Panginoon ay nananatili magpakailanman.” At ito ang salitang ipinahayag sa inyo bilang mabuting balita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang salitang ipinangaral sa inyo bilang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: salita
  rationale: Pinananatili ng “salita” ang malinaw na ugnayan sa sipi mula sa Isaias 40:8 at ang pag-uulit ng ῥῆμα sa dalawang sugnay. Maaari rin itong mangahulugang mensahe o pahayag, ngunit hindi kailangang paliitin ang saklaw nito rito.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Likas na katumbas ito ng genitibong κυρίου at pinananatili ang karaniwang katawagan sa Bagong Tipan nang hindi ipinapasok sa mismong salin ang interpretasyong “YHWH.”
- source_word: μένει
  choice: nananatili
  rationale: Ipinahahayag ng aspektong pangkasalukuyan ang patuloy at di-nagbabagong pag-iral; malinaw at likas sa makabagong Filipino ang “nananatili.”
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Ito ang natural at marangal na katumbas ng idyomang tumutukoy sa walang hanggang pagpapatuloy.
- source_word: τοῦτο δέ ἐστιν
  choice: At ito ang
  rationale: Ang “At” ay mahinang pang-ugnay na angkop sa δέ at malinaw na nagdurugtong sa sipi at sa paliwanag ni Pedro.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: ang salitang ipinahayag … bilang mabuting balita
  rationale: Pinananatili nito ang “salita” para sa ῥῆμα at inilalantad ang pandiwang diwa ng εὐαγγελίζω bilang pagpapahayag ng mabuting balita, sa halip na umasa lamang sa terminong pansimbahan na “ebanghelyo.”
- source_word: εἰς ὑμᾶς
  choice: sa inyo
  rationale: Sa pagsama sa “ipinahayag,” natural nitong tinutukoy ang mga nakatanggap o pinatunguhan ng pagpapahayag.
theological_decisions:
- issue: Ang kaugnayan ng “salita ng Panginoon” sa sipi mula sa Isaias at sa mabuting balitang ipinahayag sa mga mambabasa
  choice: Panatilihin ang “salita ng Panginoon” sa sipi at tukuyin sa ikalawang pangungusap na ito ang salitang ipinahayag bilang mabuting balita.
  alternative: Gawing mas interpretatibo ang dalawang sugnay bilang “mensahe mula sa Panginoon.”
  rationale: Pinananatili ng salin ang alingawngaw ng Kasulatan at ang sariling paglalapat ni Pedro nang hindi pinag-iisa sa isang paliwanag ang sipi at ang pagpapahayag ng mabuting balita.
- issue: Paglalarawan sa εὐαγγελισθέν
  choice: Gamitin ang hayag na pariralang “ipinahayag … bilang mabuting balita.”
  alternative: “ipinangaral sa inyo bilang ebanghelyo”
  rationale: Ipinakikita nito ang pandiwang lakas at kahulugan ng pagpapahayag ng mabuting balita, habang ang mas tradisyonal na alternatibo ay inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Panginoon,” “nananatili,” at “magpakailanman” bilang pamilyar ngunit hindi lipas na pananalita. Pinanatili ang panapos na panipi sa unang pangungusap dahil ito ang wakas ng siping nagsimula sa naunang talata.
