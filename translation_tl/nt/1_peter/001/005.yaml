  source_fidelity: 'Kailangang baguhin ang “handa nang ihayag.” Ang ἀποκαλυφθῆναι ay balintiyak: ang kaligtasan ang ihahayag, hindi ito ang maghahayag. Ang “nang” ay maaari ring magdagdag ng diwang “already,” na wala sa Griyego. Ang “iniingatan ng kapangyarihan ng Diyos sa pamamagitan ng pananampalataya” ay tapat na nagpapahayag ng patuloy na pag-iingat, kapangyarihan ng Diyos, at pananampalataya bilang paraan.'
  naturalness: Natural at angkop sa makabagong marangal na Filipino ang anyong sugnay na nagsisimula sa “na,” sapagkat karugtong ito ng naunang talata. Mas natural at malinaw ang “handang maihayag” kaysa “handa nang ihayag.”
  terminology: Ang “pananampalataya,” “kaligtasan,” at “huling panahon” ay angkop at pare-pareho sa saklaw ng mga terminong Griyego. Dapat itama ang talababa b upang tunay na magbigay ng alternatibong salin ng ἐν καιρῷ ἐσχάτῳ, hindi isang pagpapalawak na “pagdating.”
