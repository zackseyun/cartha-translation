  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: tl
  text: na iniingatan ng kapangyarihan ng Diyos sa pamamagitan ng pananampalataya[a] para sa kaligtasang handang maihayag sa huling panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagtitiwala”; hindi gaanong malamang dito, “katapatan.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa panahon ng wakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: iniingatan
  rationale: Ipinahihiwatig ng kasalukuyang balintiyak na pandiwaring Griyego ang patuloy na pagkilos sa mga tinutukoy. Likas sa Filipino ang “iniingatan” at napapanatili nito ang diwa ng pagbabantay at pagprotekta.
- source_word: ἐν δυνάμει θεοῦ
  choice: ng kapangyarihan ng Diyos
  rationale: Ang ἐν ay nagpapahayag dito ng paraan o kasangkapang gumagawa kaugnay ng balintiyak na “iniingatan.” Malinaw at natural sa Filipino ang pariralang ito.
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ang διά ay nagsasaad ng paraang namamagitan, at ang πίστις ay pinakatuwirang isinasaling “pananampalataya” rito. Inilalagay sa talababa ang mga posibleng diwang “pagtitiwala” at, bagaman hindi gaanong malamang dito, “katapatan.”
- source_word: εἰς σωτηρίαν
  choice: para sa kaligtasan
  rationale: Ang εἰς ay tumutukoy sa layunin o kahihinatnan. Ang “para sa kaligtasan” ay nagpapanatili sa pasulong na oryentasyon ng parirala at natural sa Filipino.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: handang ihayag
  rationale: Tuwirang ipinapahayag nito ang pagiging handa ng kaligtasan na maihayag. Hindi kailangan sa Filipino ang tahasang balintiyak na “maihayag” matapos ang “handang”; gayunman, ang kaligtasan pa rin ang tumatanggap ng pagkilos.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: sa huling panahon
  rationale: Ipinahihiwatig ng καιρός ang isang tiyak o mapagpasiyang panahon. Pinananatili ng “sa huling panahon” ang eskatolohikal na diwa nang hindi nagdaragdag ng isang partikular na sistemang pangwakas-panahon.
- source_word: τοὺς
  choice: na
  rationale: Ipinagpapatuloy ng artikulong akusatibo ang pagtukoy sa mga kausap mula sa naunang talata. Ang pang-ugnay na “na” ang natural na paraan upang mapanatiling karugtong ang sugnay sa Filipino.
theological_decisions:
- issue: Ugnayan ng pag-iingat ng Diyos at tugon ng tao sa διὰ πίστεως
  choice: Ang kapangyarihan ng Diyos ang nag-iingat, at ang pananampalataya ang paraang namamagitan.
  alternative: Maaaring unawain ang pananampalataya bilang pagtitiwala; hindi gaanong malamang dito ang diwang katapatan.
  rationale: Pinananatili ng salin kapwa ang pagkilos ng Diyos at ang papel ng pananampalataya, nang hindi nagpapasiya para sa isang doktrinang denominasyonal tungkol sa pagtitiyaga o pagtalikod.
- issue: Panahon ng paghahayag ng kaligtasan
  choice: Itinuturo ng talata ang ganap na paghahayag ng kaligtasan sa hinaharap.
  alternative: Hindi nito itinatanggi ang kasalukuyang mga aspekto ng kaligtasan sa ibang mga teksto, ngunit hindi rin nito itinuturing na kasalukuyang pagbabalik-loob lamang ang tinutukoy rito.
  rationale: Malinaw na pasulong ang “handang ihayag sa huling panahon.” Pinananatili ang diin sa hinaharap nang hindi nagpapasok ng higit sa sinasabi ng talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong sugnay na nagsisimula sa “na” dahil karugtong ito ng naunang talata. Ginamit ang “kaligtasang” upang maging maayos ang daloy patungo sa panuring na “handang ihayag.”
