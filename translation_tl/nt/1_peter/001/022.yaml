  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: tl
  text: Yamang dinalisay na ninyo ang inyong mga sarili sa pagsunod sa katotohanan para sa tapat na pagmamahalan bilang magkakapatid[a], magmahalan kayo nang taimtim mula sa puso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tapat na pag-ibig sa mga kapwa mananampalataya.” Ang salitang Griyego ay tumutukoy sa pagmamahalang pampamilya sa mga magkakapatid sa pananampalataya, babae man o lalaki.
    reason: lexical_alternative
  - marker: b
    text: 'Sa ilang manuskrito: “mula sa pusong dalisay.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: Yamang dinalisay na ninyo
  rationale: Ipinahahayag ng perpektong aktibong participle ang naganap nang pagkilos na may patuloy na kabuluhan. Ang “yamang” ay likas sa Tagalog at hindi labis na nagpapasya kung temporal o lohikal ang ugnayan nito sa pangunahing utos.
- source_word: ψυχὰς ὑμῶν
  choice: ang inyong mga sarili
  rationale: Maaaring tumukoy ang ψυχή sa buhay, sarili, o kaluluwa. Sa kontekstong ito, ang buong pagkatao ang tinutukoy; mas natural at hindi mapanlinlang sa modernong Tagalog ang “mga sarili” kaysa “mga kaluluwa,” na maaaring unawaing hiwalay na espirituwal na bahagi lamang.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: sa pagsunod sa katotohanan
  rationale: Pinananatili ng “sa” ang maaaring kahulugang paraan o kalagayan ng ἐν, habang malinaw na iniuugnay ang pagdadalisay sa masunuring pagtugon sa katotohanan.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: upang magkaroon kayo ng tapat na pagmamahalan bilang magkakapatid
  rationale: Ipinakikita ng “upang” ang layon o bunga ng εἰς. Ang “tapat” ay likas na katumbas ng ἀνυπόκριτον, at ang “bilang magkakapatid” ay nagpapanatili sa pampamilyang diwa ng φιλαδελφία nang malinaw na saklaw ang lahat ng mananampalataya.
- source_word: ἀλλήλους ἀγαπήσατε
  choice: kayong magmahalan
  rationale: Ang hulaping mag-an ay natural na nagpapahayag ng katumbasang “one another,” habang ang payak na pautos ay angkop sa aorist imperative nang hindi nagdaragdag ng tahasang aspektong “patuloy.”
- source_word: ἐκ καρδίας
  choice: mula sa puso
  rationale: Tuwirang isinasalin ang tekstong SBLGNT na walang pang-uring “dalisay.”
- source_word: ἐκτενῶς
  choice: taimtim
  rationale: Ipinahahayag nito ang masidhi at buong-loob na pag-ibig sa natural at marangal na modernong Tagalog, bagaman maaaring kasama rin sa Griyego ang diwa ng pagpupunyagi o pagpapatuloy.
theological_decisions:
- issue: Pagkakaiba ng φιλαδελφία at ἀγαπάω sa iisang talata
  choice: Isinalin ang φιλαδελφία bilang “pagmamahalan bilang magkakapatid” at ang ἀγαπήσατε bilang “magmahalan.”
  alternative: Isalin ang dalawang termino sa parehong salitang “pag-ibig” o “magmahalan.”
  rationale: Pinananatili nito ang pampamilyang kulay ng unang termino at ang mas pangkalahatang utos ng ikalawa, nang hindi ipinipilit na may mahigpit na teolohikal na pagkakaiba ang dalawang uri ng pag-ibig.
- issue: Saklaw ng kasarian sa φιλαδελφία
  choice: Gamitin ang “bilang magkakapatid,” na likas na sumasaklaw sa mga lalaki at babae.
  alternative: “Pag-ibig na pangkapatid” o “pag-ibig sa mga kapatid na lalaki.”
  rationale: Ang konteksto ay tumutukoy sa buong sambayanan ng mga mananampalataya. Gender-accurate ang “magkakapatid” at pinananatili nito ang metaporang pampamilya.
- issue: Variant sa ἐκ καρδίας
  choice: “mula sa puso”
  alternative: “mula sa pusong dalisay”
  rationale: Walang καθαρᾶς (“dalisay”) sa ibinigay na SBLGNT text. Inilalagay lamang sa talababa ang variant upang hindi ito maipasok sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dinalisay” upang mapanatili ang larawang ritwal at moral ng ἁγνίζω, at “mga sarili” upang maiwasang paliitin ang ψυχή sa isang hiwalay na bahagi ng tao. Ang ayos ng pangungusap ay inayos para sa natural na daloy sa Tagalog habang pinananatili ang participial na batayan, layon, at pangunahing pautos.
