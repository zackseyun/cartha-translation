base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: tl
  text: Sapagkat isinilang kayong muli, hindi mula sa binhing nasisira kundi mula sa binhing hindi nasisira, sa pamamagitan ng buhay at nananatiling salita ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng salita ng Diyos na buhay at nananatili.” Sa Griyego, maaaring tumukoy sa “salita” o sa “Diyos” ang mga salitang “buhay” at “nananatili,” bagaman mas pinapaboran ng konteksto ang “salita.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: isinilang kayong muli
  rationale: 'Inihahatid nito ang perpektong pasibong diwa: ang muling pagsilang ay naganap na at nagpapatuloy ang bunga nito. Ginawang tahasang sugnay sa Tagalog upang maging natural sa ugnayan ng talata.'
- source_word: σπορᾶς
  choice: binhi
  rationale: Likas na katumbas sa Tagalog at pinananatili ang talinghaga ng kapanganakan.
- source_word: φθαρτῆς
  choice: nasisira
  rationale: Malinaw at pangkasalukuyang salita na nagpapahayag ng pagiging lumilipas o nabubulok ng binhi.
- source_word: ἀφθάρτου
  choice: hindi nasisira
  rationale: Pinananatili ang tuwirang pagsalungat sa φθαρτῆς gamit ang magkatugmang pananalita.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Malinaw na naghahayag ng paraan o kasangkapan, gaya ng hinihingi ng διά na may henitibo.
- source_word: λόγου
  choice: salita
  rationale: Tuwirang katumbas na nagpapanatili sa malawak na diwa ng λόγος nang hindi ito nililimitahan sa “mensahe.”
- source_word: ζῶντος
  choice: buhay
  rationale: Natural na pang-uri sa Tagalog para sa isang salitang may buhay; hindi idinagdag ang mas mapagpaliwanag na “nagbibigay-buhay.”
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang henitibong ugnayan bilang “salita ng Diyos,” nang hindi ipinapalit ang mas interpretibong “mula sa Diyos.”
- source_word: μένοντος
  choice: nananatili
  rationale: Inihahatid ang patuloy at namamalaging diwa ng kasalukuyang pandiwari sa natural na modernong Tagalog.
theological_decisions:
- issue: Kung ang ζῶντος at μένοντος ay kapuwa tumutukoy sa “salita” o sa “Diyos”
  choice: 'Kapuwa inilapat sa “salita”: “buhay at nananatiling salita ng Diyos”'
  alternative: “salita ng buhay at nananatiling Diyos”
  rationale: Magkatugma sa henitibong panlalaking isahan ang mga pandiwari at ang λόγου, at sinusuportahan ng kasunod na konteksto, lalo na ng talata 25, ang diin sa salitang nananatili. Gayunman, posible sa balarila ang paglalapat ng mga ito sa Diyos, kaya pinanatili ang tunay na kalabuan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” upang likas na iugnay ang pandiwari sa naunang pangungusap; iniwasan ang mas teknikal o makalumang “di-nasisira” at “namamalagi.”
