  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: tl
  text: kundi sa mahalagang dugo ng Mesiyas[a], gaya ng dugo ng korderong walang kapintasan at walang bahid,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Cristo.” Ang salitang Griyego na Χριστοῦ ay isang titulong nangangahulugang “Mesiyas” o “Pinahiran.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ipinapahayag nito ang matibay na pagsalungat sa naunang “hindi”; sa Filipino, likas ang pares na “hindi… kundi….”
- source_word: τιμίῳ
  choice: mahalagang
  rationale: Saklaw nito ang mataas na halaga at dangal ng tinutukoy nang hindi ginagawang komersiyal ang himig.
- source_word: αἵματι
  choice: dugo
  rationale: Pinananatili ang kongkretong larawan ng dugo; hindi ito pinalitan ng pagpapakahulugang “kamatayan” o “sakripisyo.”
- source_word: ὡς
  choice: gaya ng dugo ng
  rationale: Malinaw at likas nitong ipinakikitang ang dugo ang tuwirang pinaghahambing. Ang ikalawang “dugo” ay ipinahiwatig sa Griyego at nilantad sa Filipino para sa linaw.
- source_word: ἀμνοῦ
  choice: kordero
  rationale: Karaniwan at tuwirang salin na nagpapanatili sa larawang panghandog nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: ἀμώμου
  choice: walang kapintasan
  rationale: Angkop sa bokabularyo tungkol sa katanggap-tanggap na handog at hindi nito nililimitahan ang salita sa moral na kawalang-sala.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang magkaugnay ngunit magkahiwalay na paglalarawan.
- source_word: ἀσπίλου
  choice: walang bahid
  rationale: Pinananatili nitong naiiba ang ikalawang paglalarawan sa “walang kapintasan” at ang magkatimbang na ayos ng parirala.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo; ang “Mesiyas” ay malinaw na naghahatid ng kahulugan nito sa modernong Filipino.
theological_decisions:
- issue: Paglilipat ng Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός at ang kaugnayang mesiyaniko ng talata. Inilalagay sa talababa ang tradisyonal na “Cristo” nang hindi ipinipilit na pangalang pantangi lamang ang gamit dito.
- issue: Ugnayan ng dugo at kordero
  choice: gaya ng dugo ng kordero
  alternative: gaya ng kordero
  rationale: Ang ὡς ἀμνοῦ ay nakaugnay sa αἵματι at nangangahulugang ang dugo ay gaya ng sa isang kordero. Nilantad ang ipinahiwatig na “dugo” upang maiwasang magmukhang ang Mesiyas lamang ang tuwirang inihahambing sa kordero, habang pinananatili ang sakripisyal na larawan.
translation_notes:
  register: Makabagong Filipino na may marangal at biblikal na himig. Ginamit ang likas na “hindi… kundi…” na pagpapatuloy mula sa naunang talata, at pinanatiling magkahiwalay ang “walang kapintasan” at “walang bahid.”
