id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: tl
  text: Kaya, matapos ninyong bigkisan ang baywang ng inyong isip[a] at habang malinaw ang inyong pag-iisip, ituon ninyo nang lubusan[b] ang inyong pag-asa sa biyayang dinadala sa inyo kapag nahayag si Jesus, ang Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bigkisan ang baywang ng inyong isip”—isang larawan ng paghahanda ng isip upang kumilos.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “habang lubos na malinaw ang inyong pag-iisip, ituon ninyo ang inyong pag-asa.” Maaaring iugnay ang “nang lubusan” sa malinaw na pag-iisip o sa pag-asa.'
    reason: alternative_reading
  - marker: c
    text: 'Griyego: “Jesus Christ”; ang Χριστός ay titulo, kaya isinalin itong “ang Mesiyas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas at malinaw na panandang naghihinuha mula sa naunang sinabi.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: matapos bigkisan ang baywang ng inyong isip
  rationale: Pinananatili ang matingkad na talinghaga ng Griyego tungkol sa paghahanda para kumilos; ipinaliliwanag sa talababa ang diwang idyomatiko nito.
- source_word: νήφοντες
  choice: habang malinaw ang inyong pag-iisip
  rationale: Matalinghaga ang gamit ng νήφω rito at tumutukoy sa malinaw, mapagpigil, at handang pag-iisip, hindi tuwirang sa hindi pagkalasing.
- source_word: τελείως
  choice: nang lubusan
  rationale: Ikinabit sa pangunahing utos na ituon ang pag-asa, ngunit pinananatili sa talababa ang tunay na posibilidad na kaugnay ito ng malinaw na pag-iisip.
- source_word: ἐλπίσατε
  choice: ituon ... ang inyong pag-asa
  rationale: Naipahahayag ang tiyak at sinasadyang pagkilos na hinihingi ng aorist imperative.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: sa biyayang dinadala sa inyo
  rationale: Pinananatili ang kasalukuyang pasibong participle at ang larawan ng biyayang dumarating sa mga mambabasa.
- source_word: ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ
  choice: sa paghahayag ni Jesus na Mesiyas
  rationale: Pinananatili ang nominal na 'paghahayag' at ang lawak ng ugnayang maaaring ipahiwatig ng genitive, habang isinasalin ang Χριστός bilang titulong 'Mesiyas.'
theological_decisions:
- issue: Pagpapanatili sa talinghaga ng pagbibigkis ng baywang
  choice: Pinanatili sa pangunahing teksto ang 'bigkisan ang baywang ng inyong isip.'
  alternative: ihanda ang inyong isip upang kumilos
  rationale: Mahalaga ang matingkad na larawan sa Griyego; ang talababa ang nagbibigay ng malinaw na idyomatikong kahulugan nang hindi pinapalitan ang larawan.
- issue: Saklaw ng τελείως
  choice: Ikinabit ang 'nang lubusan' sa pagtuon ng pag-asa.
  alternative: lubos na malinaw ang pag-iisip
  rationale: Kapwa posible ayon sa ayos ng Griyego; pinili ang natural na pangunahing pagbasa ngunit tahasang pinanatili sa talababa ang sintaktikong kalabuan.
- issue: Kahulugan ng νήφοντες
  choice: malinaw ang inyong pag-iisip
  alternative: maging mapagpigil / maging hindi lasing
  rationale: Ang konteksto ay paghahanda ng isip, kaya hindi nararapat magpasok ng tuwirang diin sa pag-iwas sa alak; gayunman, kasama sa salita ang diwa ng pagpipigil at pagiging alerto.
- issue: Paglilipat sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay naririnig pa rin ang Χριστός bilang titulo; ang 'Mesiyas' ay likas na modernong Tagalog at hindi ito itinuturing na apelyido.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pambihirang talinghaga ng orihinal, samantalang ang talababa ang nagbibigay ng karaniwang idyomatikong paliwanag. Ginamit ang 'kayo/inyo' para sa pangmaramihang kausap at iniwasan ang labis na teknikal o denominasyonal na pananalita.
