  naturalness: Marangal at pangkalahatang natural ang rehistro. Gayunman, mas malinaw at mas likas ang “sabik na nagnanais silipin ng mga anghel” kaysa “minimithing pagmasdan nang mabuti ng mga anghel,” na medyo mabigat at hindi tuwirang nagpapahayag na mga anghel ang may pagnanais.
  terminology: Ang “Espiritu Santo,” “mabuting balita,” at “mga anghel” ay angkop sa modernong Filipino Tagalog at tapat sa saklaw ng Griyego. Ginamit ang “sa pamamagitan ng Espiritu Santo” upang malinaw na ipahayag ang kaparaanang ipinahihiwatig ng datibo nang hindi nagdaragdag ng doktrinal na paliwanag.
