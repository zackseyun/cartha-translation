  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: tl
  text: Ipinahayag sa kanila na hindi para sa kanilang sarili kundi para sa inyo[a] sila naglilingkod sa mga bagay na ito. Ang mga bagay na ito ay ibinalita ngayon sa inyo sa pamamagitan ng mga nagpahayag sa inyo ng mabuting balita[b] sa pamamagitan ng Espiritu Santo na isinugo mula sa langit—mga bagay na sabik na nagnanais silipin ng mga anghel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi sa kanilang sarili kundi sa inyo”; ipinakikita ng anyong datibo sa Griyego kung para kanino ang paglilingkod ng mga propeta.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “nangaral sa inyo ng ebanghelyo.” Pandiwa na nangangahulugang “magpahayag ng mabuting balita” ang ginamit sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Ang “silipin” ay maaari ring isaling “pagmasdan nang mabuti” o “yumuko upang tingnan,” na nagpapahiwatig ng sabik at masinsing pagmamasid.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: Ipinahayag sa kanila
  rationale: Tumutukoy ang panghalip sa mga propeta sa naunang talata. Pinananatili ng anyong balintiyak ang di-tahasang tagaganap ng paghahayag.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: hindi para sa kanilang sarili kundi para sa inyo
  rationale: Ginagawang malinaw sa natural na Tagalog ang paghahambing ng mga pinag-uukulan o nakikinabang sa paglilingkod.
- source_word: διηκόνουν
  choice: sila naglilingkod
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang nagpapatuloy na paglilingkod noon; karaniwan at malinaw ang “naglilingkod” kaysa sa mas teknikal na “nagmiministeryo.”
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Ang mga ito ngayon ay ibinalita sa inyo
  rationale: Pinananatili ang balintiyak na anyo at ang diin ng νῦν sa kasalukuyang yugto ng pagpapahayag.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: sa pamamagitan ng mga nagpahayag sa inyo ng mabuting balita
  rationale: Isinasalin ang pandiwang εὐαγγελίζω bilang aktuwal na pagpapahayag ng mabuting balita, nang hindi umaasa sa teknikal na salitang hiram.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: sa Espiritu Santo na isinugo mula sa langit
  rationale: Pinananatili ng “sa” ang maaaring instrumental o saklaw na gamit ng datibo, habang malinaw na inuugnay ang pariralang “isinugo mula sa langit” sa Espiritu Santo.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: minimithing pagmasdan nang mabuti ng mga anghel
  rationale: Ipinahahayag ng “minimithi” ang patuloy at taimtim na pagnanais, at ng “pagmasdan nang mabuti” ang masinsinang pagtinging nasa παρακύπτω nang hindi nagiging alanganin sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι ἁγίῳ
  choice: Espiritu Santo bilang banal na tagaganap o kaparaanan ng pagpapahayag ng mabuting balita
  alternative: isang banal na espiritu o espirituwal na kapangyarihan sa pangkalahatan
  rationale: Sa konteksto ng pagkilos ng Diyos sa kasaysayan ng kaligtasan at ng pagsusugo mula sa langit, natural na tumutukoy ito sa Espiritu Santo. Hindi dinaragdagan ng salin ang teksto ng mas tiyak na paliwanag sa paraan ng pagkilos niya.
- issue: Ang mga nakikinabang sa paglilingkod ng mga propeta
  choice: ang mga mambabasang nakatanggap ngayon ng ipinahayag na mabuting balita
  alternative: ang mga propeta lamang o ang mga kapanahon lamang nila
  rationale: Tahasang pinaghahambing ng Griyego ang “hindi para sa kanilang sarili” at “kundi para sa inyo,” kaya pinananatili ang ugnayan ng propesiya at ng kasalukuyang pagpapahayag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mabuting balita” sa halip na ang mas teknikal na “ebanghelyo,” at iniwasan ang salitang “ministeryo.” Ang em dash ay nagpapanatili sa pangwakas na diin sa matinding pagnanais ng mga anghel.
