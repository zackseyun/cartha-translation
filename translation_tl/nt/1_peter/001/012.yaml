  to: Ipinahayag sa kanila na hindi para sa kanilang sarili kundi para sa inyo[a] sila naglilingkod sa mga bagay na ito. Ang mga bagay na ito ay ibinalita ngayon sa inyo sa pamamagitan ng mga nagpahayag sa inyo ng mabuting balita[b] sa pamamagitan ng Espiritu Santo na isinugo mula sa langit—mga bagay na sabik na nagnanais silipin ng mga anghel.[c]
