id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: tl
  text: 'Si Pedro, isang apostol ni Jesus na Mesiyas[a], sa mga hinirang na nakikipamayan, na nakakalat[b] sa Ponto, Galacia, Capadocia, Asia, at Bitinia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesucristo.” Ang “Cristo” ay katumbas ng titulong “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ng diaspora” o “ng pagkakawatak-watak.” Maaaring ipahiwatig nito kapwa ang Diasporang Judio at, sa mas malawak na diwa, ang bayan ng Diyos na namumuhay na malayo sa tunay nilang tahanan.
    reason: cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Griyego na Πέτρος.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Pinanatili ang kinikilalang titulo at tungkulin sa Bagong Tipan, sa halip na gawing pangkalahatang “sugo.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ipinahayag ang titulong Χριστός bilang “Mesiyas,” habang pinananatiling natural sa modernong Tagalog ang kaugnayan nito sa pangalang Jesus.
- source_word: ἐκλεκτοῖς
  choice: mga hinirang
  rationale: Tuwirang ipinapahayag ang pagiging pinili nang hindi naglalakip ng isang makitid na sistemang teolohikal.
- source_word: παρεπιδήμοις
  choice: mga nakikipamayan
  rationale: Ipinahihiwatig nito ang mga taong pansamantalang naninirahan sa isang lugar na hindi nila sariling bayan; mas natural ito kaysa sa burukratikong “residenteng dayuhan.”
- source_word: διασπορᾶς
  choice: nakakalat
  rationale: Isinalin sa malinaw na karaniwang wika ang ideya ng diaspora o pagkakawatak-watak sa iba't ibang lupain, nang hindi nililimitahan kung literal, etniko, o teolohikal ang diin.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: sa Ponto, Galacia, Capadocia, Asia, at Bitinia
  rationale: Ginamit ang karaniwang anyong Filipino ng mga sinaunang pangalang heograpiko at idinagdag ang “sa” upang likas na maipahayag ang lokatibong ugnayan.
theological_decisions:
- issue: Kahulugan ng ἐκλεκτοῖς
  choice: mga hinirang
  alternative: mga pinili
  rationale: Pinananatili ng “hinirang” ang mariing pahayag ng teksto na pinili sila, ngunit hindi ipinapaliwanag sa talata ang paraan o saklaw ng pagpiling iyon.
- issue: Ugnayan ng παρεπιδήμοις at διασπορᾶς
  choice: mga hinirang na nakikipamayan at nakakalat
  alternative: mga hinirang na dayuhan ng Diaspora
  rationale: Hinahayaan ng salin na manatili kapwa ang aktuwal na kalagayan ng mga mambabasa bilang mga nakikipamayan at ang posibleng teolohikal na pahiwatig na ang bayan ng Diyos ay malayo sa tunay nilang tahanan. Hindi nito ipinipilit na mga etnikong Judio lamang o na purong talinghaga lamang ang tinutukoy.
- issue: Pagsasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may lakas ng isang titulo rito. Nililinaw ng “Mesiyas” ang kahulugan nito sa halip na ituring lamang na bahagi ng personal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang anyong pambungad ng liham; ginamit ang tutuldok upang ihudyat na nagpapatuloy ang pangungusap sa susunod na talata. Iniwasan ang sobrang teknikal na “Diaspora” sa pangunahing teksto ngunit ipinaliwanag ito sa talababa.
