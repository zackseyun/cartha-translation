lexical_decisions:
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Ipinakikita ang matibay na pagsalungat sa dating pamumuhay na binanggit sa naunang talata; natural ito sa simula ng pangungusap sa Filipino.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: kung paanong banal ang tumawag sa inyo
  rationale: Pinananatili ang paghahambing o pagtutulad at malinaw na iniuugnay ang kabanalan sa Diyos na tumawag sa kanila, nang hindi ginagawang pantanging titulo ang pang-uri.
- source_word: καὶ αὐτοὶ
  choice: din kayo
  rationale: Sapat na naipahahayag ng “din” ang pagtutugma sa kabanalan ng tumawag; ang ayos ng Filipino ay natural at may malinaw na diin sa mga tinutukoy.
- source_word: ἅγιοι
  choice: banal
  rationale: Inuulit ang salitang ginamit para sa katangian ng tumawag, kaya napapanatili ang sadyang pagtutugma sa Griyego.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: sa buong pamumuhay ninyo
  rationale: Ang ἀναστροφή ay tumutukoy sa kabuuang paraan ng pamumuhay o asal. Mas malawak at mas natural ang “buong pamumuhay” kaysa sa salitang maaaring tumukoy lamang sa hiwa-hiwalay na kilos.
- source_word: γενήθητε
  choice: maging
  rationale: Natural na pautos sa Filipino ang “maging,” at maaari nitong dalhin kapwa ang diwa ng pagiging banal at ng pagpasok o pagpapakita sa kalagayang iyon.
theological_decisions:
- issue: Ang ugnayan ng kabanalan ng Diyos at ng utos sa mga tinawag
  choice: kung paanong banal ang tumawag sa inyo, maging banal din kayo
  alternative: gaya ng Banal na tumawag sa inyo, maging banal din kayo
  rationale: Pinananatili ng napiling salin ang malinaw na paghahambing sa magkaparehong pang-uri sa Griyego at hindi ginagawang pormal na titulo ang ἅγιον, bagaman Diyos ang malinaw na tinutukoy.
- issue: Ang puwersa ng pautos na γενήθητε
  choice: maging banal
  alternative: mamuhay kayong banal
  rationale: Ang “maging banal” ay tuwirang tumutugma sa pautos at hindi nagtatakda ng isang partikular na paliwanag tungkol sa proseso ng pagpapabanal; naipapakita naman ng kasunod na parirala ang praktikal na saklaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pamumuhay” upang masaklaw ang kabuuang asal at hindi lamang mga indibiduwal na gawa. Ang ayos na “kung paanong … maging … din” ay likas sa Filipino at pinananatili ang retorikal na pagtutugma ng dalawang paggamit ng “banal.”
