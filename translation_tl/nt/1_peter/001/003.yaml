id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: tl
  text: Purihin nawa ang Diyos at Ama ng ating Panginoong Jesus na Mesiyas[a], na dahil sa sagana niyang awa ay muli niya tayong isinilang[b] tungo sa isang buhay na pag-asa sa pamamagitan ng muling pagkabuhay ni Jesus na Mesiyas mula sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ating Panginoong Jesu-Cristo.” Ang salitang Griyego na Χριστός (Christos) ay titulong nangangahulugang “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: O “binigyan niya tayo ng bagong kapanganakan.” Pinananatili ng pandiwang Griyego ang larawan ng muling pagsilang o muling pagkaanak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Purihin
  rationale: Doxolohikal na pahayag ito. Ang “Purihin” ay likas at marangal sa makabagong Tagalog at ipinahahayag ang pagsamba, sa halip na simpleng ilarawan ang Diyos bilang “pinagpala.”
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ang Diyos at Ama
  rationale: Pinananatili ang dalawang katawagan at ang iisang kaugnayang parirala sa Griyego.
- source_word: κυρίου
  choice: Panginoon
  rationale: Tumutukoy sa titulo, hindi lamang sa magalang na pantawag.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Likas at nakikilalang anyo sa Tagalog; nililinaw sa talababa na ang Χριστός ay titulong “Mesiyas,” hindi apelyido.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: dahil sa sagana niyang awa
  rationale: Sa konteksto, natural na ipinahahayag nito ang batayan ng pagkilos ng Diyos. Ang “sagana” ay mahusay na naghahatid sa πολὺ.
- source_word: ἀναγεννήσας
  choice: muli niya tayong isinilang
  rationale: Pinananatili ang Diyos bilang gumaganap at ang larawan ng panibagong kapanganakan, nang hindi nagdaragdag ng sistematikong doktrina.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: tungo sa isang buhay na pag-asa
  rationale: Ang “tungo sa” ay nagpapanatili sa direksiyon o resultang ipinahihiwatig ng εἰς, at ang “buhay na pag-asa” ay nagpapanatili sa matingkad na metapora.
- source_word: δι’ ἀναστάσεως
  choice: sa pamamagitan ng muling pagkabuhay
  rationale: Malinaw na ipinahahayag ang paraan o kasangkapang kahulugan ng διά na may genitive.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Likas na Tagalog para sa karaniwang wika ng muling pagkabuhay at pinananatili ang maramihang anyo ng νεκρῶν.
theological_decisions:
- issue: Pagpapahayag sa Χριστός bilang kristolohikal na titulo
  choice: Jesu-Cristo, na may talababa na “Jesus na Mesiyas”
  alternative: Jesus na Mesiyas
  rationale: Ang “Jesu-Cristo” ang higit na natural at nakikilalang anyo sa karaniwang Tagalog, samantalang ang talababa ay tahasang nagpapanatili sa titular na kahulugan ng Χριστός at umiiwas na ituring itong simpleng apelyido.
- issue: Pagkilos ng Diyos sa ἀναγεννήσας
  choice: muli niya tayong isinilang
  alternative: binigyan niya tayo ng bagong kapanganakan
  rationale: Ang Diyos ang tahasang gumaganap sa Griyego. Pinananatili ng salin ang ahensiya niya at ang larawan ng pagsilang nang hindi nilulutas ang mas malawak na mga pagtatalong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Purihin” bilang likas na doxolohikal na anyo, “sagana niyang awa” para sa natural na daloy, at “tungo sa” upang mapanatili ang resultative o directional na puwersa ng εἰς. Ang tandang padamdam ay nagpapalinaw sa doxolohikal na pambungad, bagaman nagpapatuloy ang pangungusap sa kasunod na sugnay.
