  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: tl
  text: sapagkat nasusulat[a], “Kayo'y magiging banal, sapagkat ako'y banal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tuwirang bilang utos, “Maging banal kayo.” Sinusunod ng Griyego ang pananalita ng sipi sa Kasulatan na nasa anyong panghinaharap: “Kayo''y magiging banal.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: sapagkat
  rationale: Ipinakikilala nito ang nasusulat na batayan ng naunang tagubilin at likas na nagpapahayag ng dahilan sa modernong Tagalog.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula ito sa Tagalog para sa pagsipi sa Kasulatan at naipahihiwatig ang nananatiling bisa ng nakasulat.
- source_word: ὅτι (una)
  choice: hindi tahasang isinalin; ipinakita sa panipi
  rationale: Tagapagpakilala ito ng tuwirang sipi; sapat at mas natural sa Tagalog ang paggamit ng panipi.
- source_word: Ἅγιοι
  choice: banal
  rationale: Pinananatili nito ang malawak na kahulugang etikal at tipanan ng ἅγιος; masyadong makitid ang 'ibinukod' sa kontekstong ito.
- source_word: ἔσεσθε
  choice: kayo'y magiging
  rationale: Pinananatili ang anyong panghinaharap ng sipi habang hinahayaang manatili ang lakas nitong tulad ng isang utos sa wikang biblikal.
- source_word: ὅτι (ikalawa)
  choice: sapagkat
  rationale: 'Malinaw na ipinahahayag ang dahilan: ang kabanalan ng Diyos ang batayan ng kabanalan ng mga kinakausap.'
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip at ang diin ng banal na pagtukoy sa sarili.
- source_word: ἅγιος
  choice: banal
  rationale: Parehong salin ang ginamit upang mapanatili ang ugnayan ng hinihinging kabanalan ng bayan at ng sariling kabanalan ng Diyos.
theological_decisions:
- issue: Lakas ng panghinaharap na ἔσεσθε sa sipi tungkol sa kabanalan
  choice: “Kayo'y magiging banal” upang mapanatili ang pormal na panghinaharap at ang puwersang tulad ng utos sa sipi.
  alternative: “Maging banal kayo” o “Kayo ay magiging banal” bilang payak na hula.
  rationale: Ang Griyego ay sumusunod sa anyong panghinaharap ng siping Levitico, na maaaring gumanap na utos sa biblikal na pananalita. Pinananatili ng salin at talababa ang tensiyon sa pagitan ng anyo at tungkulin sa halip na lutasin ito nang tahasan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nasusulat” bilang pamilyar na pormula sa pagsipi sa Kasulatan at ang pinaikling “Kayo'y” upang maging maayos at dignified ang daloy.
