  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: tl
  text: Alam ninyo na tinubos kayo[a] mula sa walang-kabuluhang paraan ng pamumuhay na minana ninyo mula sa inyong mga ama[b]—hindi sa pamamagitan ng mga bagay na nasisira, gaya ng pilak o ginto—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalaya sa pamamagitan ng pantubos.” Ang pandiwang Griego ay may diwa ng pagpapalaya kapalit ng kabayaran.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ipinasa mula sa inyong mga ama.” Dito, maaaring tumukoy ang “mga ama” sa mga ninuno o naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Alam ninyo na
  rationale: Ang perpektong participle ng οἶδα ay nagpapahayag ng kaalamang taglay na ng mga mambabasa. Natural sa modernong Tagalog ang “Alam ninyo na,” at nananatili ang kaugnayan nito sa nakapaligid na pangungusap.
- source_word: ἐλυτρώθητε
  choice: tinubos kayo
  rationale: Ipinahihiwatig ng λυτρόομαι ang pagpapalaya sa pamamagitan ng pantubos o kabayaran. Ang “tinubos” ay likas na katumbas sa Tagalog at hindi labis na nagtatakda ng mekanismong teolohikal.
- source_word: φθαρτοῖς
  choice: mga bagay na nasisira
  rationale: Substantibo ang gamit ng pang-uri at tumutukoy sa mga bagay na nabubulok, nauubos, o hindi nananatili. Malinaw at pangkaraniwan ang “mga bagay na nasisira.”
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: gaya ng pilak o ginto
  rationale: Ang pilak at ginto ay mga halimbawang nagpapaliwanag sa “mga bagay na nasisira”; malinaw na ipinakikita ito ng “gaya ng.”
- source_word: ἐκ
  choice: mula sa
  rationale: Pinananatili nito ang diwa ng paghiwalay o pagpapalaya mula sa dating paraan ng pamumuhay.
- source_word: ματαίας
  choice: walang-kabuluhang
  rationale: Saklaw ng μάταιος ang pagiging hungkag, walang saysay, o walang mabuting patutunguhan. Ang “walang-kabuluhan” ay dignificado at madaling maunawaan.
- source_word: ἀναστροφῆς
  choice: paraan ng pamumuhay
  rationale: Ang ἀναστροφή ay tumutukoy sa asal o kabuuang gawi sa buhay. Mas malawak at natural ang “paraan ng pamumuhay” kaysa sa “pag-uugali” lamang.
- source_word: πατροπαραδότου
  choice: ipinamana sa inyo ng inyong mga ninuno
  rationale: Tumutukoy ang salita sa bagay na ipinasa ng mga naunang salinlahi, sa literal ay ng “mga ama.” Ang “mga ninuno” ang natural na salitang Filipino para sa kolektibong angkan na pinagmulan, samantalang inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Wika ng minanang tradisyon
  choice: ipinamana sa inyo ng inyong mga ninuno
  alternative: ipinamana sa inyo ng inyong mga ama
  rationale: Sa kontekstong ito, ang πατροπαράδοτος ay karaniwang tumutukoy sa tradisyong nagmula sa mga naunang salinlahi. Iniiwasan ng “mga ninuno” ang maling pagkaunawang sariling mga ama lamang ang tinutukoy, habang itinatala sa talababa ang literal na paternal na pananalita.
- issue: Terminolohiya ng pagtubos
  choice: tinubos
  alternative: pinalaya sa pamamagitan ng pantubos
  rationale: Pinananatili ng “tinubos” ang larawan ng pagpapalaya sa pamamagitan ng kabayaran nang hindi nagdaragdag ng isang partikular na paliwanag sa paraan ng pagtubos na hindi pa tahasang sinasabi sa sugnay na ito.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/kayo” para sa maramihang kausap. Ang mga gitling-pahaba ay nagpapanatili sa diin ng Griegong ayos: hindi pilak o ginto ang ipinantubos; nagpapatuloy ang kaisipan sa susunod na talata.'
