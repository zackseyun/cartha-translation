base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: tl
  text: Siya ay nakilala na noon pa[a], bago pa itatag ang sanlibutan, ngunit nahayag sa wakas ng mga panahon alang-alang sa inyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinili noon pa.” Sinasabi ng Griyego na “nakilala na noon pa,” na maaaring magpahiwatig ng layunin ng Diyos ngunit hindi nangangailangang ipakahulugan nang gayon sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga huling panahong ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: kilala na
  rationale: Pinananatili nito ang pangunahing diwa ng naunang pagkakilala nang hindi agad ipinapakahulugang “pinili na” o “itinalaga na.” Ang pasibong anyo at kaugnayan nito sa tinutukoy sa talata 19 ay naipahahayag nang likas sa Tagalog.
- source_word: πρὸ καταβολῆς κόσμου
  choice: bago pa itatag ang sanlibutan
  rationale: Likas at marangal itong katumbas ng idyomang tumutukoy sa panahon bago ang paglikha, habang pinananatili ang larawan ng pagtatatag o paglalagay ng pundasyon.
- source_word: φανερωθέντος
  choice: nahayag
  rationale: Ipinahahayag nito na ang tinutukoy ay ginawang lantad o nakikita, at karaniwan itong salitang Tagalog para sa teolohikal na diwa ng pagpapakita o paghahayag.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: sa wakas ng mga panahon
  rationale: Malapit ito sa literal na temporal na pahayag ng Griyego at pinananatili ang eskatolohikal na diwa nang hindi idinaragdag ang pantukoy na “mga panahong ito.”
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Malinaw nitong ipinapakita na ang paghahayag ay para sa kapakinabangan ng mga mambabasa, hindi na sila ang sanhi nito.
theological_decisions:
- issue: Kahulugan ng προεγνωσμένου tungkol sa Mesiyas bago ang paglikha
  choice: kilala na
  alternative: pinili na; itinalaga na
  rationale: Hindi tahasang ipinapantay ng salitang Griyego ang naunang pagkakilala sa pagpili o pagtatalaga. Pinananatili ng salin ang tunay na teolohikal na tensiyon at iniiwasang magpasok ng mas tiyak na doktrinal na pagpapakahulugan.
- issue: Temporal na diwa ng ἐπ’ ἐσχάτου τῶν χρόνων
  choice: sa wakas ng mga panahon
  alternative: sa mga huling panahong ito
  rationale: Pinananatili nito ang anyo ng Griyego, na walang tahasang katumbas ng “ito,” habang malinaw pa ring tumutukoy sa pangwakas na yugto ng mga panahon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sanlibutan,” “nahayag,” at “alang-alang” bilang malinaw at kinikilalang bokabularyong biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
