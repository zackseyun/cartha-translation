reference: 1 Peter 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: tl
  text: upang ang napatunayang pagiging tunay ng inyong pananampalataya—na higit na mahalaga kaysa gintong nasisira, bagaman sinusubok sa apoy—ay masumpungang magbunga ng papuri, kaluwalhatian, at karangalan sa paghahayag ni Jesus na Mesiyas.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pagsubok sa inyong pananampalataya”; maaaring idiin ng salitang Griyego ang proseso ng pagsubok o ang pagiging tunay na napatutunayan bilang bunga nito.
    reason: lexical_alternative
  - marker: b
    text: O “Jesucristo.” Dito, isinalin ang titulong Χριστός ayon sa kahulugan nitong “Mesiyas.”
    reason: lexical_alternative
  - marker: c
    text: O “ay masumpungang mauwi sa.”
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: napatunayang pagiging tunay
  rationale: Ipinahahayag nito ang katunayang lumilitaw bilang bunga ng pagsubok, hindi lamang ang proseso ng pagsubok; ang paghahambing sa gintong sinusubok sa apoy ay sumusuporta sa resultative na diwa.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang natural at karaniwang salin sa kontekstong tumutukoy sa pananampalataya ng mga mananampalataya na dumaraan sa pagsubok.
- source_word: πολυτιμότερον
  choice: higit na mahalaga
  rationale: Malinaw nitong pinananatili ang paghahambing ng halaga sa ginto at natural ito sa modernong Filipino.
- source_word: χρυσίου
  choice: ginto
  rationale: Tuwirang katumbas sa genitive of comparison.
- source_word: ἀπολλυμένου
  choice: nasisira
  rationale: Pinananatili ang pandiwang diwa at ang kaibahan sa mas matibay na halaga ng tunay na pananampalataya.
- source_word: διὰ πυρὸς
  choice: sa apoy
  rationale: Sa pariralang “sinusubok sa apoy,” natural nitong ipinahahayag ang paraang ginagamit sa pagsubok.
- source_word: δοκιμαζομένου
  choice: sinusubok
  rationale: Pinananatili ang ideya ng pagtiyak sa kalidad ng ginto nang hindi labis na nililimitahan sa teknikal na pagdadalisay.
- source_word: εὑρεθῇ εἰς
  choice: masumpungang humantong sa
  rationale: Pinananatili ang pasibong “masumpungan” at malinaw na ipinahahayag ang kinalabasan na tinutukoy ng εἰς.
- source_word: ἔπαινον
  choice: papuri
  rationale: Karaniwang salin na angkop sa tatluhang pahayag ng pagkilala sa wakas.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Karaniwang salin na nagpapanatili sa teolohikal at pampublikong diwa ng δόξα.
- source_word: τιμήν
  choice: karangalan
  rationale: Angkop sa diwa ng pagkilala at pagpapahalaga kasabay ng papuri at kaluwalhatian.
- source_word: ἐν ἀποκαλύψει
  choice: sa paghahayag
  rationale: Natural na tumutukoy sa panahon o pangyayari ng hayagang pagpapakita kay Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός ayon sa kahulugan nitong titulong “Mesiyas,” sa natural na anyong Filipino.
theological_decisions:
- issue: Diwa ng τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: “ang napatunayang pagiging tunay ng inyong pananampalataya,” na nakatuon sa katunayang ibinubunga ng pagsubok
  alternative: “ang pagsubok sa inyong pananampalataya,” na nakatuon sa proseso
  rationale: Sa paghahambing sa gintong sinusubok sa apoy, mas malamang na tinutukoy ng δοκίμιον ang napatunayang kalidad, ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo.
- issue: Kung kanino nauukol ang “papuri, kaluwalhatian, at karangalan”
  choice: Hindi tinukoy sa salin kung sino ang tumatanggap o nagkakaloob ng mga ito
  alternative: Maaaring tumukoy sa karangalang ibinibigay sa mga mananampalataya, sa papuring iniuukol sa Diyos o kay Cristo, o sa pinagsamang pagkilalang pangwakas
  rationale: Hindi tahasang tinutukoy ng Griyego ang kaugnayan o tumatanggap ng tatluhang pahayag, kaya pinananatili ang ambiguwidad.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas bilang titulo
  alternative: Cristo bilang tradisyonal na transliterasyon
  rationale: Ang “Mesiyas” ay naghahatid ng kahulugan ng titulo, samantalang kinikilala sa talababa ang karaniwang alternatibong Filipino.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inyong” upang mapanatili ang pangmaramihang ὑμῶν at ang pormal na tono. Ang mga gitling ay tumutulong na malinaw na maihiwalay ang paghahambing sa ginto nang hindi binabago ang sintaktikong ugnayan.
