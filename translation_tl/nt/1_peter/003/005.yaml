  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: tl
  text: Sapagkat noong unang panahon, ganito rin ginayakan ng mga banal na babaeng umaasa sa Diyos[a] ang kanilang sarili sa pamamagitan ng pagpapasakop sa kani-kanilang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglalagak ng kanilang pag-asa sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ganito
  rationale: Tumutukoy ito pabalik sa paraang inilarawan sa naunang konteksto at pinananatili ang demonstratibong diwa ng Griyego.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang tagubilin.
- source_word: ποτε
  choice: noon
  rationale: Natural na tumutukoy sa mga babae noong unang panahon nang hindi nagdaragdag ng tiyak na panahong wala sa teksto.
- source_word: ἅγιαι γυναῖκες
  choice: mga banal na babae
  rationale: Pinananatili ang karaniwang kahulugan ng ἅγιαι at hindi ito pinahihina tungo sa mas malabong ‘mabubuting babae.’
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: umaasa sa Diyos
  rationale: Natural at tuwirang paglalarawan sa mga babaeng ang pag-asa ay nasa Diyos; pinananatili ang kasalukuyang katangiang ipinahahayag ng participle.
- source_word: ἐκόσμουν ἑαυτάς
  choice: ginagayakan ... ang kanilang sarili
  rationale: Pinananatili ang ugnayang leksikal sa paksa ng paggayak sa malapit na konteksto. Ang aspektong di-ganap ay angkop na naipahahayag ng ‘ginagayakan noon.’
- source_word: ὑποτασσόμεναι
  choice: sa pagpapasakop
  rationale: Ipinakikita ng pariralang ito na ang pagpapasakop ang paraan ng kanilang paggayak sa sarili, alinsunod sa ugnayan ng participle sa pangunahing pandiwa.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: sa kani-kanilang asawa
  rationale: Sa konteksto ng sambahayan, ang ἀνδράσιν ay tumutukoy sa mga asawa. Ang ‘kani-kanilang’ ay natural na nagpapanatili sa ἰδίοις at naglilimita sa pahayag sa sariling asawa ng bawat babae.
theological_decisions:
- issue: Saklaw at tungkulin ng pariralang tungkol sa pagpapasakop sa pag-aasawa
  choice: sa pagpapasakop sa kani-kanilang asawa
  alternative: na nagpapasakop sa sarili nilang asawa
  rationale: Pinananatili ng salin ang pagpapasakop bilang paraan ng paggayak at ang malinaw na limitasyong tumutukoy sa sariling asawa. Hindi nito pinalalawak ang pahayag upang maging pangkalahatang pag-angkin tungkol sa lahat ng babae at lahat ng lalaki.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang em dash upang luminaw na ang ‘sa pagpapasakop’ ay nagpapahayag ng paraan ng paggayak, habang pinananatili ang daloy at teolohikal na tensiyon ng orihinal.
