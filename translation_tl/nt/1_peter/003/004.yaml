  terminology: Ang “pagkatao,” “espiritu,” at “sa harap ng Diyos” ay angkop. “Mapayapang” ay likas na pang-uri para sa espiritu at, kasama ng talababa, malinaw na hindi ito tumutukoy sa sapilitang pananahimik.
