  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: tl
  text: kundi ang nakatagong pagkatao ng puso[a], sa di-kumukupas na kagandahan[b] ng maamo at mapayapang espiritu[c], na napakahalaga sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nakatagong tao ng puso.” Ang ἄνθρωπος sa Griyego ay maaaring mangahulugang “tao” sa pangkalahatan; dito, tumutukoy ito sa panloob na sarili.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa di-kumukupas na katangian ng maamo at mapayapang espiritu.” Isinuplay ang “kagandahan” mula sa paghahambing sa panlabas na pagpapaganda sa naunang talata.
    reason: lexical_alternative
  - marker: c
    text: Ang “mapayapa” ay tumutukoy sa kalmado at hindi magulong disposisyon, hindi kinakailangang sa hindi pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: ang nakatagong pagkatao ng puso
  rationale: Pinananatili ng “nakatago” ang diwa ng κρυπτός, samantalang likas na ipinahahayag ng “pagkatao” ang panloob na sarili nang hindi nagdaragdag ng panlalaking kahulugan sa generic na ἄνθρωπος.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: na may di-kumukupas na kagandahan
  rationale: Elliptical ang Griyego at walang tahasang pangngalan. Ang “kagandahan” ay maingat na isinusuplay mula sa paghahambing sa panlabas na pagpapaganda sa talata 3; ang “di-kumukupas” ay malinaw at likas na katumbas ng ἄφθαρτος sa kontekstong ito.
- source_word: πραέως
  choice: mahinahon
  rationale: Ipinahahayag nito ang banayad at hindi mapusok na katangiang tinutukoy ng πραΰς, sa natural na makabagong Tagalog.
- source_word: ἡσυχίου
  choice: payapa
  rationale: Ipinakikita ng “payapa” ang kalmado at hindi magulong disposisyon, at iniiwasang ipakahulugan ang salita bilang sapilitang pananahimik.
- source_word: πνεύματος
  choice: espiritu
  rationale: Pinananatili ang antropolohikal na pananalita ng teksto sa halip na paliitin ito sa mas interpretibong “disposisyon” o “ugali.”
- source_word: ὅ ἐστιν
  choice: na
  rationale: Likas na inuugnay sa Tagalog ng “na” ang buong naunang katangian sa pagsusuri ng Diyos, habang hindi pinipilit ang eksaktong saklaw ng neuter relative pronoun.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Tuwirang katumbas ito ng Griyego at nagpapahayag ng pagtataya ng Diyos.
- source_word: πολυτελές
  choice: napakahalaga
  rationale: Malinaw nitong ipinahahayag ang napakataas na halaga ng πολυτελής at nababagay sa paghahambing sa mamahaling panlabas na palamuti.
theological_decisions:
- issue: Antropolohikal na pahayag sa kontekstong tumutukoy sa mga babae
  choice: Gamitin ang “pagkatao” para sa generic na ἄνθρωπος.
  alternative: ang nakatagong tao ng puso; ang nakatagong lalaki ng puso
  rationale: Ang tinutukoy ay ang panloob na sarili, hindi ang kasariang lalaki. Iniiwasan ng “pagkatao” ang maling pahiwatig na may lalaking referent habang pinananatili ang personal at antropolohikal na diwa.
- issue: Pagdaragdag ng ipinahihiwatig na pangngalan sa ἐν τῷ ἀφθάρτῳ
  choice: Isuplay ang “kagandahan” at ipabatid ito sa talababa.
  alternative: sa di-nasisirang katangian; taglay ang di-kumukupas na mahinahon at payapang espiritu
  rationale: Siksik at elliptical ang Griyego. Batay sa tahasang paghahambing sa panlabas na pagpapaganda sa naunang talata, nililinaw ng “kagandahan” ang likas na diwa nang hindi itinatago na ito ay suplay ng salin.
- issue: Kahulugan ng ἡσύχιος
  choice: Isalin bilang “payapa,” na tumutukoy sa kalmadong disposisyon.
  alternative: tahimik
  rationale: Maaaring mapagkamalang kawalan ng pagsasalita ang “tahimik.” Mas malinaw na ipinahahayag ng “payapa” ang kalmado at hindi mapanggulong katangian nang gawing utos ng pananahimik ang teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kundi” upang ipagpatuloy ang pagsalungat mula sa talata 3. Pinili ang “pagkatao” at “payapa” upang maging natural sa Filipino habang pinananatili ang antropolohikal na wika at tensiyon ng orihinal; ipinaliwanag sa mga talababa ang literal na anyo at ang isinusuplay na “kagandahan.”
