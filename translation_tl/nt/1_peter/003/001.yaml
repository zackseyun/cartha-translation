id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: tl
  text: Gayundin, mga asawang babae, magpasakop kayo sa inyong sariling mga asawa upang, kahit may ilan sa inyong mga asawa na hindi tumatalima sa salita,[a] mahikayat sila nang walang salita sa pamamagitan ng inyong asal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi naniniwala sa mensahe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: Gayundin
  rationale: Pinananatili ang pang-ugnay sa naunang tagubilin at natural ito sa makabagong Tagalog.
- source_word: γυναῖκες
  choice: kayong mga asawang babae
  rationale: Dahil kasunod ang ‘sarili ninyong asawa,’ ang tinutukoy ay mga asawa sa relasyong mag-asawa, hindi kababaihan sa pangkalahatan.
- source_word: ὑποτασσόμεναι
  choice: magpasakop kayo
  rationale: Natural na pautos sa Tagalog na nagpapahayag ng kusang paglalagay ng sarili sa kaayusang panrelasyon, nang hindi dinaragdagan ng diwa ng lubos na pagsunod o pagiging mababa.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: sa sarili ninyong asawa
  rationale: Ipinapakita ng konteksto at ng ἰδίοις na ang ἀνδράσιν ay tumutukoy sa kani-kanilang asawa; pinananatili ng ‘sarili ninyong’ ang diin ng Griyego.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at maikli nitong ipinahahayag ang layunin o inaasahang bunga.
- source_word: καὶ εἴ τινες
  choice: kahit may ilan sa kanila
  rationale: 'Inihahatid nito ang konsesibong diwa: saklaw ng tagubilin maging ang mahirap na kalagayang ito.'
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: hindi tumatalima sa salita
  rationale: Ang ‘tumatalima’ ay nag-iingat sa diwa ng pagsunod o pagtangging sumunod, habang ang talababa ay nagpapanatili sa posibleng diwa ng hindi paniniwala sa mensahe.
- source_word: λόγῳ
  choice: sa salita
  rationale: Pinananatili ang karaniwang biblikal na katawagan para sa ipinahayag na mensahe at ang retorikal na kaugnayan nito sa ‘walang salita.’
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: sa pamamagitan ng inyong asal
  rationale: Ang ἀναστροφή ay tumutukoy sa paraan ng pamumuhay o pag-uugali; ang ‘inyong asal’ ay tuwiran at natural dahil kinakausap mismo ang mga asawang babae.
- source_word: ἄνευ λόγου
  choice: nang walang salita
  rationale: Pinananatili ang maikli at sadyang pag-uulit ng λόγος, na tumutukoy rito sa hindi paggamit ng pananalita o pangangatwiran ng asawa.
- source_word: κερδηθήσονται
  choice: mahikayat sila
  rationale: Natural sa Tagalog para sa metaporikal na ‘maipanalo’ o maakay ang isang tao, nang hindi tahasang dinaragdagan kung ano ang magiging ganap na tugon niya.
theological_decisions:
- issue: Likas ng ὑποτασσόμεναι sa tagubilin sa sambahayan
  choice: Isinalin bilang ‘magpasakop kayo,’ nang hindi ipinapahiwatig ang lubos na pagsunod o likas na pagiging mababa.
  alternative: ‘sumunod kayo’ o ‘pailalim kayo’
  rationale: Ὑποτάσσω ang ginamit, hindi ang mas tuwirang pandiwa para sa pagtalima. Pinananatili ng salin ang kaayusang panrelasyon ngunit hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Saklaw ng ἀπειθοῦσιν τῷ λόγῳ
  choice: ‘hindi tumatalima sa salita,’ na nagpapanatili sa diwa ng pagsuway o pagtangging sumunod
  alternative: ‘hindi naniniwala sa mensahe’
  rationale: Maaaring saklawin ng pandiwa ang hindi paniniwala at pagsuway. Hindi nilulutas ng pangunahing teksto ang tensiyong ito, at inilalahad sa talababa ang mahalagang alternatibo.
- issue: Diwa ng κερδηθήσονται
  choice: ‘mahikayat sila’
  alternative: ‘maipanalo sila’ o ‘maakay sila sa pananampalataya’
  rationale: Iniiwasan ng ‘mahikayat’ ang alanganing literalismo ng ‘maipanalo’ at ang tahasang pagdaragdag ng ‘sa pananampalataya,’ bagaman ipinahihiwatig iyon ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang pakikipag-usap na ‘kayo/inyong’ at pinanatili ang retorikal na pag-uugnay ng ‘salita’ at ‘walang salita.’
