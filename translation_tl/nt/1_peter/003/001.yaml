    issue: Hindi tugma ang bilang sa “sa sarili ninyong asawa.”
    rationale: Maramihan ang mga kausap at ang “mga asawa” sa Griyego. Dapat gumamit ng plural na anyo upang hindi magmukhang iisa lamang ang asawang tinutukoy para sa buong pangkat.
  - severity: low
    issue: Ang talababa ay naglalahad ng isang interpretatibong pagpapaliwanag bilang tiyak na kahulugan.
    rationale: Ang ἀπειθοῦσιν ay maaaring tumukoy sa pagtangging sumunod o hindi paniniwala sa mensahe. Dapat ilahad ang alternatibo bilang alternatibo, hindi bilang “ibig sabihin” na naglilimita sa kahulugan.
