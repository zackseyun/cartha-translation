  source_fidelity: 'Tumpak sa kabuuan ang pangunahing diwa: ang pang-ugnay na “Gayundin,” ang tagubilin ng ὑποτασσόμεναι, ang layuning ipakilalang maaaring mahikayat ang mga asawang hindi tumatalima sa salita, at ang paraan—sa asal, nang walang salita. Gayunman, ang “sa sarili ninyong asawa” ay isahang anyo samantalang plural ang τοῖς ἰδίοις ἀνδράσιν at ang kausap ay maramihan. Ang talababa rin ay masyadong ipinapakitang tiyak na kahulugan ang isang leksikal na posibilidad.'
  naturalness: Marangal at malinaw ang Tagalog. Mas natural at hindi malabo ang “sa inyong sariling mga asawa” at “may ilan sa inyong mga asawa” kaysa “sa sarili ninyong asawa” at “may ilan sa kanila.”
  terminology: Ang “magpasakop,” “salita,” at “asal” ay angkop at pinananatili ang antas at mga ugnayang retorikal ng talata. Ang “mahikayat” ay katanggap-tanggap na maingat na salin ng κερδηθήσονται nang hindi idinaragdag ang resulta bilang tahasang pagbabalik-loob.
  issues:
