  to: Gayundin, mga asawang babae, magpasakop kayo sa inyong sariling mga asawa upang, kahit may ilan sa inyong mga asawa na hindi tumatalima sa salita,[a] mahikayat sila nang walang salita sa pamamagitan ng inyong asal.
  rationale: Inayos ang plural na pagtukoy sa mga asawa at ginawang malinaw ang antecedent ng “ilan,” nang hindi binabago ang saklaw ng tagubilin. Pinaikli ang talababa upang mapanatili ang leksikal na ambigwidad ng ἀπειθοῦσιν at maiwasang ituring na tiyak ang isang kontekstuwal na pagpapakahulugan.
