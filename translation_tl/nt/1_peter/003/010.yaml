  to: Sapagkat ang sinumang nagnanais na mahalin ang buhay at makakita ng mabubuting araw ay dapat pigilan ang kanyang dila sa pagsasalita ng masama at ang kanyang mga labi sa pagsasalita ng panlilinlang[a].
