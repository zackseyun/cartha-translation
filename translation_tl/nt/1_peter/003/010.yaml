  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: tl
  text: Sapagkat ang sinumang nagnanais na mahalin ang buhay at makakita ng mabubuting araw ay dapat pigilan ang kanyang dila sa pagsasalita ng masama at ang kanyang mga labi sa pagsasalita ng panlilinlang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pandaraya.” Ang salitang Griyego ay maaaring tumukoy sa panlilinlang, pandaraya, o katusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: ang sinumang nagnanais
  rationale: Ang artikulo at kasalukuyang pandiwaring θέλων ay tumutukoy sa sinumang tao sa pangkalahatan. Likas sa Filipino ang “ang sinumang” at hindi ito nagdaragdag ng kasariang wala sa diwa ng Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng batayan o paliwanag para sa naunang payo; malinaw na naipakikita ng “Sapagkat” ang ugnayang ito.
- source_word: ζωὴν ἀγαπᾶν
  choice: na mahalin ang buhay
  rationale: Malapit ito sa tuwirang kahulugan ng parirala at natural na nauunawaan sa modernong Filipino nang hindi nagdaragdag ng panghalip na paari.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: makakita ng mabubuting araw
  rationale: Pinananatili ang konkretong pandiwang “makakita” at ang malawak na kahulugan ng ἀγαθός; hindi ito nililimitahan sa materyal na kasaganaan.
- source_word: παυσάτω
  choice: ay dapat pigilan
  rationale: Bagaman anyong pautos ang Griyego, natural na ipinahahayag ng “dapat pigilan” ang pangkalahatang moral na utos kasama ng mga pariralang sumusunod.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: ang kanyang dila sa masama
  rationale: Pinananatili ang larawan ng dila at ang malawak na saklaw ng κακόν. Kailangan sa natural na Filipino ang panghalip na paari para sa bahagi ng katawan.
- source_word: χείλη
  choice: ang kanyang mga labi
  rationale: Pinananatili ang maramihang konkretong larawan ng Griyego at ginagamit ang likas na panghalip na paari sa Filipino.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: sa pagsasalita ng panlilinlang
  rationale: Ipinahahayag ng parirala ang pagpigil sa mapanlinlang na pananalita. Ang “panlilinlang” ay malinaw at kasalukuyang salita para sa δόλος.
theological_decisions:
- issue: Pangkalahatang isahan at paglalarawan ng kasarian
  choice: Gamitin ang “ang sinumang” para sa paksa at “kanyang” para sa mga bahagi ng katawan.
  alternative: Gamitin ang “ang taong” o tahasang panlalaking katawagan.
  rationale: Ang Griyego ay isahan ngunit kumakatawan sa sinumang tao. Pinananatili ng salin ang pangkalahatang saklaw at pagkakaugnay ng isahan nang hindi nagdaragdag ng kahulugang tiyak sa lalaki.
- issue: Lakas ng pautos sa παυσάτω
  choice: Isalin bilang “ay dapat pigilan.”
  alternative: Isalin bilang “pigilan niya” o “itigil niya.”
  rationale: Ang “dapat” ay natural na naghahatid ng normatibo at pautos na diwa sa pangungusap na nagsisimula sa isang pangkalahatang kondisyong paglalarawan, nang hindi ginagawang payak na mungkahi ang utos.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Pinanatili ang matalinghagang “dila,” “mga labi,” at “makakita ng mabubuting araw,” habang iniwasan ang luma o labis na pormal na pananalita.
