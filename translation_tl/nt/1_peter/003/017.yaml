base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: tl
  text: Sapagkat mas mabuting magdusa dahil sa paggawa ng mabuti[a]—kung iyon ang loobin ng Diyos[b]—kaysa magdusa dahil sa paggawa ng masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang gumagawa ng mabuti … kaysa habang gumagawa ng masama.” Maaaring unawain ang mga participle bilang nagsasaad ng dahilan (“dahil sa”) o, sa mas pangkalahatan, ng kalagayan (“habang”).
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, literal na “kung nanaisin ito ng kalooban ng Diyos.” Isang mariing pahayag ito na isinalin dito sa natural na Tagalog bilang “kung iyon ang loobin ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: mas mabuti
  rationale: Likas at tuwirang katumbas sa Tagalog ng impersonal na paghahambing na ‘it is better.’
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at pinananatili ang lohikal na ugnayan.
- source_word: ἀγαθοποιοῦντας
  choice: dahil sa paggawa ng mabuti
  rationale: Ang kasalukuyang aktibong participle ay maaaring maglarawan ng kalagayan o dahilan ng pagdurusa. Sa kontekstong ito, natural sa Tagalog ang ‘dahil sa,’ habang itinatala sa talababa ang tunay na posibilidad na ‘habang gumagawa.’
- source_word: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ
  choice: kung iyon ang loobin ng Diyos
  rationale: Pinagsasama ng idiomatikong Tagalog na ‘loobin ng Diyos’ ang magkaugnay na θέλοι at θέλημα nang hindi inuulit nang pilit ang ‘kalooban ... loloobin.’ Ang ‘kung’ at anyong ‘loobin’ ay nagpapanatili sa potensiyal o di-tiyak na kondisyon ng optative.
- source_word: πάσχειν
  choice: magdusa
  rationale: Tuwiran, natural, at angkop na katumbas ng complementary infinitive.
- source_word: ἢ
  choice: kaysa
  rationale: Karaniwang pang-ugnay sa paghahambing pagkatapos ng ‘mas mabuti.’
- source_word: κακοποιοῦντας
  choice: dahil sa paggawa ng masama
  rationale: Pinananatili ang malinaw na paralelismo at pagsalungat sa ‘paggawa ng mabuti.’
theological_decisions:
- issue: Kaugnayan ng pagdurusa sa kalooban ng Diyos
  choice: Ipinahahayag na maaaring maging ayon sa loob ng Diyos ang pagdurusa dahil sa paggawa ng mabuti, nang hindi tinutukoy kung ito ay tahasang itinakda o pinahintulutan lamang.
  alternative: Maaaring ipakahulugan na tahasang itinatalaga ng Diyos ang bawat pagdurusa, o na pinahihintulutan lamang niya ito nang walang ibang pakikilahok.
  rationale: Ang εἰ θέλοι τὸ θέλημα τοῦ θεοῦ ay tumutukoy nang may kondisyon sa kalooban ng Diyos ngunit hindi nilulutas ang mas malawak na usapin tungkol sa pagtatakda at pagpapahintulot.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘loobin ng Diyos’ bilang natural na idyoma, at ang mga gitling ay nagtatangi sa kondisyong parirala nang hindi pinuputol ang pangunahing paghahambing.
