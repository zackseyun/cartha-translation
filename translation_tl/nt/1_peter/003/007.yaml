id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: tl
  text: Gayundin, kayong mga asawang lalaki, mamuhay kayong kasama ng inyong mga asawa nang may pagkaunawa.[a] Parangalan ninyo sila bilang mas mahinang sisidlan[b] at bilang mga kapwa tagapagmana rin ng biyaya ng buhay,[c] upang hindi mahadlangan ang inyong mga panalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ayon sa kaalaman.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mas mahinang sisidlan” ay isang talinghaga na maaaring tumukoy sa relatibong pisikal o panlipunang kahinaan, hindi sa mas mababang halaga; kasunod nito, kinikilala ang mga asawang babae bilang mga kapwa tagapagmana rin ng biyaya ng buhay.
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain na “biyaya na nagbibigay-buhay” o “mabiyayang kaloob na buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: kayong mga asawang lalaki
  rationale: Sa konteksto ng mga tagubilin sa buhay-mag-asawa mula 3:1, ang ἄνδρες ay tumutukoy sa mga asawang lalaki, hindi sa mga lalaki sa pangkalahatan.
- source_word: ὁμοίως
  choice: Gayundin
  rationale: Pinananatili nito ang ugnayan ng tagubilin sa naunang pangangaral at ang paghahambing na ipinahihiwatig ng pang-abay.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: mamuhay kayong kasama ng inyong mga asawa nang may pagkaunawa
  rationale: Likas sa modernong Tagalog ang parirala at ipinahahayag nito ang magkasamang buhay ng mag-asawa na ginagabayan ng pagkakilala at wastong pagkaunawa.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: bilang mas mahinang sisidlan
  rationale: Pinananatili ang pahambing na 'mas mahina' at ang talinghagang 'sisidlan' nang hindi tinutukoy sa salin kung pisikal o panlipunang kahinaan ang nasasangkot.
- source_word: ἀπονέμοντες τιμήν
  choice: Parangalan ninyo sila
  rationale: Malinaw at natural nitong ipinapahayag ang pagbibigay ng τιμή na nararapat sa mga asawa.
- source_word: συγκληρονόμοις
  choice: mga kapwa tagapagmana
  rationale: Ipinapahayag nito ang magkasamang bahagi sa mana at pinananatili ang anyong maramihan ng tekstong Griyego.
- source_word: χάριτος ζωῆς
  choice: biyaya ng buhay
  rationale: 'Pinananatili ang malawak na ugnayang genitibo: maaaring biyayang binubuo ng buhay o biyayang nagbibigay ng buhay.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: upang hindi mahadlangan ang inyong mga panalangin
  rationale: Natural na ipinahahayag ang layunin o bunga habang pinananatili ang balintiyak na diwa ng pagkahadlang.
theological_decisions:
- issue: Kahulugan ng “mas mahinang sisidlan”
  choice: Pinanatili bilang pahambing na paglalarawan at talinghaga, nang hindi ito ipinakahulugang mas mababa ang dangal o espirituwal na katayuan ng babae.
  alternative: Tahasang tukuyin itong pisikal na kahinaan, panlipunang kahinaan, o emosyonal na kahinaan.
  rationale: Hindi nililinaw ng teksto kung anong uri ng kahinaan ang tinutukoy. Kaagad din nitong iniuutos ang pagpaparangal at kinikilalang mga kapwa tagapagmana ang mga asawa.
- issue: Saklaw ng “biyaya ng buhay”
  choice: Pinanatili ang pariralang “biyaya ng buhay” nang hindi nililimitahan kung ito ay buhay na walang hanggan o ang mas malawak na kaloob ng buhay.
  alternative: Isalin bilang “biyaya ng buhay na walang hanggan” o “mabiyayang kaloob na buhay.”
  rationale: Ang genitibong χάριτος ζωῆς ay may higit sa isang posibleng ugnayan, kaya hindi dapat magdagdag ang salin ng paglilinaw na wala sa teksto.
- issue: Pagiging kapwa tagapagmana ng mga asawa
  choice: Ang mga asawang babae ay tinutukoy bilang mga kapwa tagapagmana rin ng biyaya ng buhay.
  alternative: Unawain ang parirala bilang pangkalahatang pahayag tungkol sa lahat ng mag-asawa bilang magkakasamang tagapagmana.
  rationale: Ang agarang konteksto ay ang pagpaparangal ng mga asawang lalaki sa kanilang mga asawa; pinananatili rin ng salin ang maramihang anyo ng συγκληρονόμοις.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asawang lalaki” at “mga asawa” para maging tiyak ang kontekstong pangmag-asawa. Pinanatili ang talinghagang “sisidlan” at ang malawak na pariralang “biyaya ng buhay,” habang inilagay sa mga talababa ang mahahalagang alternatibong pagbasa.
