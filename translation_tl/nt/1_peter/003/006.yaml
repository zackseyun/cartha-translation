id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: tl
  text: gaya ni Sara, na sumunod kay Abraham at tinatawag siyang “panginoon.” Kayo ay naging mga anak niya kung gumagawa kayo ng mabuti at hindi natatakot sa anumang nakakatakot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang sindak” o “anumang pananakot.”
    reason: Pinananatili ang mga posibleng kahulugan ng πτόησις, na maaaring tumukoy sa sindak, sa bagay na nakakatakot, o sa pananakot.
lexical_decisions:
- source_word: ὡς
  choice: gaya ni
  rationale: Likas na ipinakikilala sa Filipino si Sara bilang halimbawang kaugnay ng naunang pahayag.
- source_word: ὑπήκουσεν
  choice: sumunod
  rationale: Tuwirang ipinapahayag ang karaniwang diwa ng ὑπακούω na pagsunod o pagtalima, nang hindi ito pinahihina dahil sa usaping kultural.
- source_word: κύριον
  choice: “panginoon”
  rationale: Iginagalang na tawag ito ni Sara kay Abraham, hindi banal na titulo; ipinakikita ng maliit na titik at panipi na katawagan ito sa tao.
- source_word: καλοῦσα
  choice: tinawag itong
  rationale: Natural na Filipino para sa participle na nagpapakita kung paano ipinahayag ni Sara ang kaniyang paggalang; malinaw na si Abraham ang tinutukoy ng “itong.”
- source_word: ἧς ... τέκνα
  choice: mga anak niya
  rationale: Pinananatili ang matalinghagang ugnayang pampamilya kay Sara sa likas na ayos ng Filipino.
- source_word: ἐγενήθητε
  choice: naging
  rationale: Pinananatili ang diwa ng pagpasok sa isang kalagayan, sa halip na gawing payak na “kayo ay.”
- source_word: ἀγαθοποιοῦσαι
  choice: kung gumagawa kayo ng mabuti
  rationale: Ginagawang hayag ang praktikal na kondisyunal na ugnayan ng participle sa pangunahing sugnay.
- source_word: μὴ φοβούμεναι
  choice: hindi natatakot
  rationale: Natural na pandiwang Filipino na nagpapahiwatig ng nagpapatuloy na saloobin.
- source_word: μηδεμίαν πτόησιν
  choice: anumang nakakatakot
  rationale: Pinananatili ang lawak at bahagyang kalabuan ng πτόησις—maaaring bagay na kinatatakutan, sindak, o pananakot—nang hindi ipinapalagay na panlabas na intimidasyon lamang.
theological_decisions:
- issue: Ang pagsunod ni Sara bilang halimbawa sa mga Kristiyanong asawa
  choice: “sumunod kay Abraham”
  alternative: “nagpasakop kay Abraham”
  rationale: Ang “sumunod” ang tuwirang diwa ng ὑπήκουσεν. Hindi pinalalawak ang talata tungo sa isang ganap na doktrina ng pag-aasawa, ngunit hindi rin pinahihina ang mismong pandiwa.
- issue: Ugnayan ng ἀγαθοποιοῦσαι at μὴ φοβούμεναι sa ἐγενήθητε
  choice: Ipinahayag bilang kondisyon sa “kung”
  alternative: Ilarawan lamang bilang “habang gumagawa kayo...”
  rationale: 'May kondisyunal na puwersa ang mga participle sa konteksto: ipinakikita ng paggawa ng mabuti at kawalan ng takot ang pagiging mga anak ni Sara. Pinananatili nito ang pangaral nang hindi labis na sinisistematisa ang pahayag.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “panginoon” sa maliit na titik at nasa panipi upang hindi mapagkamalang banal na titulo. Ang hulíng parirala ay sadyang hindi nilimitahan sa panlabas na pananakot lamang.
