translation:
  language: tl
  text: Sa pamamagitan nito[a], pumaroon din siya at nagpahayag[b] sa mga espiritung nasa bilangguan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kanya” o “sa loob nito.” Maaaring maunawaan sa higit sa isang paraan ang kaugnayan ng pariralang Griyego sa naunang sugnay.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nangaral.” Ang pandiwa ay tumutukoy sa pagpapahayag, ngunit hindi tinutukoy rito ng teksto ang eksaktong nilalaman ng mensahe.
    reason: lexical_alternative
  - marker: c
    text: Pinagtatalunan kung sino ang “mga espiritung nasa bilangguan.” Kabilang sa mga posibilidad ang mga taong namatay o mga bumagsak na anghel.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa gayong kalagayan
  rationale: Iniuugnay nito ang parirala sa naunang pahayag tungkol sa pagiging buhay sa espiritu, habang hindi tahasang itinatakda kung ang diwa ay lokatibo, personal, o instrumental.
- source_word: καὶ
  choice: din
  rationale: Likas na ipinahahayag ng “din” ang pandagdag na puwersa ng καί sa kasalukuyang ayos ng pangungusap.
- source_word: τοῖς ... πνεύμασιν
  choice: sa mga espiritu
  rationale: Tuwirang katumbas ito ng πνεύμασιν at hindi nito ipinapalagay kung ang tinutukoy ay mga namatay na tao o mga espirituwal na nilalang.
- source_word: ἐν φυλακῇ
  choice: nasa bilangguan
  rationale: Natural at malinaw itong salin ng kalagayan o lugar ng pagkakakulong na ipinahihiwatig ng φυλακή.
- source_word: πορευθεὶς
  choice: pumaroon siya
  rationale: Pinananatili nito ang ideya ng pagpunta sa participle nang hindi labis na itinatakda ang eksaktong χρονological na ugnayan sa pangunahing pandiwa.
- source_word: ἐκήρυξεν
  choice: nagpahayag
  rationale: Saklaw nito ang pampublikong pagpapahayag ng κηρύσσω nang hindi ipinapalagay na ang mensahe ay ebanghelyo, hatol, o pahayag ng tagumpay.
theological_decisions:
- issue: Tinutukoy ng ἐν ᾧ
  choice: Isinalin bilang “Sa gayong kalagayan” upang iugnay sa naunang sugnay nang hindi lubusang nilulutas ang sintaktikong tanong.
  alternative: “sa kanya” o “sa pamamagitan nito”
  rationale: Maaaring maunawaan ang Griyego sa paraang tumutukoy sa kalagayan o saklaw, sa isang personal na tinutukoy, o sa instrumento. Dapat panatilihin ang tunay na kalabuan.
- issue: Pagkakakilanlan ng “mga espiritung nasa bilangguan”
  choice: Hindi tinukoy sa pangunahing teksto kung sino ang mga espiritu.
  alternative: Mga namatay na tao, mga nagkasalang anghel, o mas malawak na pangkat ng mga espiritung nakakulong
  rationale: Hindi sapat ang mismong pariralang Griyego upang tiyak na pumili sa mga makasaysayang pagpapakahulugang ito.
- issue: Nilalaman ng ipinahayag ni Cristo
  choice: Ginamit ang “nagpahayag” sa halip na salitang tiyak na nangangahulugang pangangaral ng ebanghelyo.
  alternative: “nangaral,” na maaaring maunawaang pangangaral ng ebanghelyo; o pagpapahayag ng hatol o tagumpay
  rationale: Tinutukoy ng ἐκήρυξεν ang pagpapahayag ngunit hindi nito sinasabi rito ang eksaktong nilalaman ng mensahe.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pumaroon” upang malinaw na mapanatili ang ideya ng pagpunta at ang “nagpahayag” upang maiwasan ang hindi nararapat na pagtiyak sa uri ng mensahe. Ang mga talababa ay inilagay agad sa mga pariralang kanilang nililinaw.
