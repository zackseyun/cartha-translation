  source_fidelity: Ang “Sa gayong kalagayan” ay masyadong nagpapakahulugan sa ἐν ᾧ at hindi malinaw na katumbas ng dative relative phrase. Mas tapat at mas bukas ang “Sa pamamagitan nito,” na malinaw na minamarkahan ng talababa ang iba pang mga posibilidad. Napananatili ng iba pang bahagi ang diwa ng pagpunta, ang di-tiyak na pagkakakilanlan ng mga espiritu, at ang hindi tinukoy na nilalaman ng pagpapahayag.
  naturalness: Likas ang “pumaroon din siya at nagpahayag,” bagaman ang “Sa pamamagitan nito” ay mas tuwiran at natural kaysa “Sa gayong kalagayan” sa ganitong siksik na pangungusap. Ang “mga espiritung nasa bilangguan” ay malinaw at marangal na modernong Filipino.
  terminology: Ang “nagpahayag” ay angkop para sa ἐκήρυξεν sapagkat hindi nito ipinapalagay na ebanghelyo ang ipinangaral. Ang “mga espiritu” at “bilangguan” ay wastong pinananatiling hindi mapagpasiya. Sa talababa c, mas neutral ang “mga bumagsak na anghel” kaysa “mga nagkasalang espirituwal na nilalang,” na maaaring lumabo sa dalawang magkaibang pangunahing posibilidad.
