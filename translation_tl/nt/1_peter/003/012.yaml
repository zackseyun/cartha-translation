  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: tl
  text: Sapagkat ang mga mata ng Panginoon ay nakatuon sa mga matuwid, at ang kanyang mga tainga ay nakikinig sa kanilang pagsusumamo[a]; ngunit ang mukha ng Panginoon ay laban sa mga gumagawa ng masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kanyang mga tainga ay tungo sa kanilang pagsusumamo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita rito ang dahilan o batayang kasulatan para sa naunang pahayag; likas sa Tagalog ang “Sapagkat” at malinaw ang puwersang sanhi.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: ang mga mata ng Panginoon ay nakatuon sa mga matuwid
  rationale: Pinananatili ang larawang antropomorpiko ng mga mata, habang likas na ipinahahayag ng “nakatuon sa” ang direksiyon at mapagmasid na pansin ng ἐπί.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: ang kanyang mga tainga ay nakikinig sa kanilang pagsusumamo
  rationale: Eliptiko ang Griyego, sa literal ay “ang kanyang mga tainga tungo sa kanilang pagsusumamo.” Isinusuplay ng “nakikinig” ang ipinahihiwatig na masusing pakikinig, at pinananatili ng “pagsusumamo” ang tiyak na diwa ng δέησις bilang taimtim na pakiusap o panalangin.
- source_word: πρόσωπον δὲ κυρίου
  choice: ngunit ang mukha ng Panginoon
  rationale: Pinananatili ang literal at pampanitikang larawan ng “mukha,” at isinasalin ang δέ bilang malinaw na pagsalungat na “ngunit.”
- source_word: ἐπὶ ποιοῦντας κακά
  choice: ay laban sa mga gumagawa ng masama
  rationale: Sa negatibong sugnay, ipinahahayag ng ἐπί ang pagtutol; pinananatili ng “mga gumagawa ng masama” ang pandiwang puwersa ng participle.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa mga mata, tainga, at mukha ng Panginoon
  choice: Panatilihin nang tuwiran ang tatlong larawan
  alternative: Ipaliwanag bilang “binabantayan ng Panginoon,” “dinirinig niya,” at “tinututulan niya”
  rationale: Sadyang magkakatugma ang mga larawang ito sa sipi mula sa Awit at ipinahahayag ang mapagkalingang pansin at pagtutol ng Diyos. Ang pagpapanatili sa mga ito ay nag-iingat sa pampanitikan at teolohikal na puwersa nang hindi ipinapakahulugang may pisikal na katawan ang Diyos.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “Panginoon,” “matuwid,” at “pagsusumamo” bilang pamilyar na bokabularyong biblikal; pinanatili ang parallel na mga larawang mata, tainga, at mukha.
