base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: tl
  text: Sa wakas, kayong lahat ay magkaisang-isip, makiramay, magmahalan bilang magkakapatid[a], maging mahabagin, at maging mapagpakumbaba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “magkaroon ng pag-ibig na pangkapatid.” Sa Griyego, ginagamit ang wikang pampamilya para sa pag-ibig sa isa''t isa sa komunidad ng mga mananampalataya.'
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “magiliw” o “magalang” ang mababasa sa halip na “mapagpakumbaba.”
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Sa wakas
  rationale: Likas na panandang pangdiskurso sa Filipino para sa pangwakas na buod ng mga tagubilin, hindi literal na pagtukoy sa katapusan.
- source_word: πάντες
  choice: kayong lahat
  rationale: Tahasang ipinakikita ang tuwirang kolektibong pagtawag sa buong mambabasa.
- source_word: ὁμόφρονες
  choice: magkaisa ng pag-iisip
  rationale: Pinananatili ang diwa ng pagkakaisa sa pananaw o kaisipan, sa malinaw at natural na Filipino.
- source_word: συμπαθεῖς
  choice: makiramay
  rationale: Ipinahahayag ang pakikibahagi sa damdamin at kalagayan ng iba.
- source_word: φιλάδελφοι
  choice: magmahalan bilang magkakapatid
  rationale: Pinananatili ang larawang pampamilya ng salitang Griyego habang natural at malinaw na isinasama ang buong komunidad ng mga mananampalataya.
- source_word: εὔσπλαγχνοι
  choice: maging mahabagin
  rationale: Ipinahahayag ang malalim at taos-pusong habag sa karaniwang makabagong Filipino.
- source_word: ταπεινόφρονες
  choice: mapagpakumbaba
  rationale: Natural na Filipino para sa mapagpakumbabang disposisyon o kaisipan; hindi kinakailangang gawing mabigat ang anyong 'mapagpakumbaba sa pag-iisip.'
theological_decisions:
- issue: Wikang pampamilya sa φιλάδελφοι
  choice: magmahalan bilang magkakapatid
  alternative: magmahalan bilang magkakapatid na lalaki; magkaroon ng pag-ibig na pangkapatid
  rationale: Ang 'magkakapatid' sa Filipino ay likas na inklusibo ngunit pinananatili ang metaporang pampamilya ng Griyego para sa halo-halong komunidad ng mga mananampalataya.
- issue: Anyo ng huling pang-uri
  choice: ταπεινόφρονες = mapagpakumbaba
  alternative: φιλόφρονες = magalang o palakaibigan
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na may ταπεινόφρονες. Mahalaga ang ibang pagbasa ngunit nararapat itong ilagay sa talababa, hindi sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakatugmang anyong pautos/panghikayat upang maging natural ang serye ng mga pang-uri sa Griyego. Ang 'magkakapatid' ay karaniwang inklusibong katawagan sa Filipino at nagpapanatili sa larawang pampamilya.
