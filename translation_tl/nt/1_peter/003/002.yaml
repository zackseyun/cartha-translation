  text: when they observe your pure conduct in fear.
translation:
  language: tl
  text: kapag nakita nila ang inyong dalisay na pamumuhay na may takot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “na nasa takot.” Hindi tahasang binanggit sa Griyego kung kanino nakatuon ang takot. Maaaring tumukoy ito sa mapitagang takot sa Diyos ayon sa konteksto.'
    reason: Pinananatili ng pangunahing teksto ang kalabuan ng ἐν φόβῳ, habang ipinapaliwanag ng talababa ang isang posibleng kontekstuwal na pag-unawa nang hindi ito ipinapasok bilang tahasang kahulugan.
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: kapag nakita nila
  rationale: Ipinahahayag ang masusing personal na pagmamasid na tinutukoy ng participle, sa natural na Tagalog at ayon sa ugnayang pangkondisyonal-temporal sa naunang talata.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: dalisay na pamumuhay
  rationale: Ang ἁγνός ay moral na dalisay, at ang ἀναστροφή ay paraan ng pamumuhay o asal; mas natural dito ang pinagsamang pariralang “dalisay na pamumuhay.”
- source_word: ἐν φόβῳ
  choice: na may takot sa Diyos
  rationale: Pinananatili ang diwa ng paggalang at banal na takot; nililinaw sa Tagalog ang malamang na Diyos ang layon, habang minamarkahan sa talababa ang literal at posibleng mas malawak na pagbasa.
theological_decisions:
- issue: Layon ng φόβος
  choice: takot sa Diyos
  alternative: may takot / may paggalang
  rationale: Sa 1 Pedro, ang “takot” ay karaniwang nakatuon sa Diyos (1:17; 2:17), at iniiwasan ng konteksto ang takot sa tao (3:6, 14). Gayunman, walang tahasang layon sa Griyego, kaya pinananatili sa talababa ang literal na anyo at tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “inyong” upang umayon sa maramihang ὑμῶν at sa estilong angkop sa salin ng Kasulatan; iniwasan ang mas arkaikong “pag-uugali” bilang tanging katumbas dahil mas malawak ang saklaw ng ἀναστροφή.
