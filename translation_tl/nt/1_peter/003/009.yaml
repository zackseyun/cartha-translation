id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: tl
  text: Huwag ninyong gantihan ng masama ang masama o ng pang-iinsulto ang pang-iinsulto[a]. Sa halip[b], magpala kayo, sapagkat para rito kayo tinawag[c], upang magmana kayo ng pagpapala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panlalait ang panlalait.” Ang salitang Griyego ay tumutukoy sa mapang-abuso o mapang-insultong pananalita.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “ngunit sa kabaligtaran.” Ipinahahayag ng Griyego ang mariing pagbaligtad ng inaasahang tugon.
    reason: lexical_alternative
  - marker: c
    text: Sa konteksto, ang Diyos ang nauunawaang tumawag sa kanila. Maaaring tumukoy ang “rito” sa pagpapala sa halip na pagganti, o mas malawak sa ganitong uri ng pamumuhay.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: gantihan
  rationale: Ipinahahayag ng “gantihan” ang pagbabalik ng kaparehong masamang ginawa bilang tugon, at natural ito sa makabagong Tagalog.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: gantihan ng masama ang masama
  rationale: Pinananatili ng “masama” ang bigat na moral ng κακόν, habang malinaw na ipinakikita ng ayos ng pangungusap ang pagganti.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: ng pang-iinsulto ang pang-iinsulto
  rationale: Ang λοιδορία ay mapanlait o mapang-abusong pananalita. Malinaw at karaniwan sa kasalukuyang Filipino ang “pang-iinsulto.”
- source_word: τοὐναντίον δὲ
  choice: Sa halip
  rationale: Natural na ipinahahayag nito ang mariing pagbaligtad mula sa pagganti tungo sa pagpapala; nililinaw sa talababa ang mas literal na diwa.
- source_word: εὐλογοῦντες
  choice: magpala kayo
  rationale: Saklaw ng “magpala” ang pagsasalita ng mabuti at paghiling ng kabutihan o pabor ng Diyos, nang hindi dinaragdagan ng tahasang layon na wala sa Griyego.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng naunang tagubilin at angkop sa marangal ngunit makabagong rehistro.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: dito kayo tinawag
  rationale: Pinananatili nito ang pasibong anyo at ang bahagyang kaluwagan ng tinutukoy ng “dito,” nang hindi tahasang nagdaragdag ng tagatawag sa pangunahing teksto.
- source_word: ἵνα
  choice: upang
  rationale: Natural at tuwirang ipinahahayag ng “upang” ang layunin o nilalayong bunga.
- source_word: εὐλογίαν
  choice: pagpapala
  rationale: Ang “pagpapala” ay maaaring tumukoy sa kabutihang ipinagkakaloob ng Diyos at likas na kaugnay ng pandiwang “magpala.”
- source_word: κληρονομήσητε
  choice: magmana kayo
  rationale: Pinananatili ng “magmana” ang larawan ng pagtanggap bilang tagapagmana, sa halip na gawing karaniwang “tumanggap” lamang.
theological_decisions:
- issue: Ang saklaw ng εἰς τοῦτο ἐκλήθητε (“dito kayo tinawag”)
  choice: Iniugnay ang pagtawag sa agarang tagubilin na magpala sa halip na gumanti, ngunit hindi nilimitahan nang tahasan ang “dito” sa iisang kilos lamang.
  alternative: Maaaring tumukoy ito nang mas malawak sa buhay Kristiyano na nagtitiis at hindi gumaganti.
  rationale: Pinapaboran ng agarang konteksto ang pagtukoy sa pagpapala bilang tugon sa masamang pakikitungo, ngunit sapat na maluwag ang salin upang mapanatili ang posibleng mas malawak na saklaw.
- issue: Ang hindi binanggit na tagatawag sa pasibong ἐκλήθητε
  choice: Pinanatiling pasibo ang “kayo tinawag,” habang ipinaliliwanag sa talababa na sa konteksto ay Diyos ang nauunawaang tumawag.
  alternative: Isalin sa pangunahing teksto bilang “tinawag kayo ng Diyos.”
  rationale: Iniiwasan nitong magdagdag sa pangunahing teksto ng pangngalang hindi tahasang nasa Griyego, habang kinikilala ang karaniwang teolohikal na diwa ng banal na pagtawag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/kayo” upang katawanin ang pangmaramihang anyo sa Griyego. Pinanatili ang maikli at tuwirang himig ng tagubilin, pati ang ugnayan ng “magpala” at “pagpapala.”
