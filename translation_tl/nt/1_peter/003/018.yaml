source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: tl
  text: Sapagkat ang Mesiyas man ay nagdusa nang isang beses para sa mga kasalanan[a]—ang matuwid para sa mga di-matuwid—upang madala niya kayo sa Diyos. Pinatay siya sa laman ngunit binuhay sa espiritu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “namatay” sa halip na “nagdusa.”
    reason: textual_variant
  - marker: b
    text: O “binuhay ng Espiritu.” Maaaring tumukoy ang Griyego sa saklaw o aspekto ng espiritu, o sa pagkilos ng Espiritu Santo.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: Pinananatili ang kahulugan ng Χριστός bilang titulong mesiyaniko, alinsunod sa patakaran ng proyekto, sa halip na gawing pangalang “Cristo.”
- source_word: ἅπαξ
  choice: minsang
  rationale: Tuwirang ipinapahayag ang isang beses na pangyayari nang hindi idinaragdag ang diin ng “minsan at magpakailanman,” na hindi tahasang nasa pang-abay.
- source_word: περὶ ἁμαρτιῶν
  choice: dahil sa mga kasalanan
  rationale: Likas sa modernong Tagalog at ipinahahayag ang kaugnayan ng pagdurusa sa mga kasalanan, habang iniiwasang tukuyin nang higit sa teksto ang eksaktong modelo ng paghahandog.
- source_word: ἔπαθεν
  choice: nagdusa
  rationale: Ito ang salin ng SBLGNT reading na ἔπαθεν; inilalagay sa talababa ang variant na “namatay.”
- source_word: δίκαιος
  choice: ang matuwid
  rationale: Pinananatili ang pangngalang gamit ng pang-uri at ang tuwirang kaibahan nito sa “mga di-matuwid.”
- source_word: ὑπὲρ ἀδίκων
  choice: para sa mga di-matuwid
  rationale: Ipinahahayag ang kapakinabangan at posibleng kinatawan o pamalit na diwa ng ὑπέρ nang hindi pinipili ang isang mas detalyadong teorya ng pagtubos.
- source_word: προσαγάγῃ
  choice: madala niya kayo
  rationale: Natural na Tagalog para sa pagdadala sa presensiya ng Diyos o pagbibigay ng paglapit sa kaniya.
- source_word: θανατωθεὶς
  choice: Pinatay siya
  rationale: Malinaw at natural na pinananatili ang pasibong diwa ng participle sa isang maikling malayang pangungusap.
- source_word: σαρκὶ
  choice: sa laman
  rationale: Pinananatili ang tradisyonal ngunit nauunawaang katumbas ng σάρξ at ang paralelismo sa πνεύματι; hindi ito binibigyang-kahulugang “makasalanang kalikasan.”
- source_word: ζῳοποιηθεὶς
  choice: binuhay
  rationale: Maikli at karaniwang Tagalog para sa pasibong “made alive.”
- source_word: πνεύματι
  choice: sa espiritu
  rationale: Pinananatili ang dative bilang saklaw o aspekto sa pangunahing teksto at hindi agad kinikilala bilang tahasang ahensiya ng Espiritu Santo; nasa talababa ang alternatibo.
theological_decisions:
- issue: Kahulugan ng paghahambing ng laman at espiritu sa huling sugnay
  choice: “sa laman ... sa espiritu”
  alternative: “sa katawan ... sa espiritu” o “binuhay ng Espiritu”
  rationale: Maikli at pinagtatalunan ang Griyego. Pinananatili ng magkatulad na parirala ang tunay na kalabuan kung ang πνεύματι ay saklaw/aspekto o tumutukoy sa pagkilos ng Espiritu Santo.
- issue: Diwa ng “ang matuwid para sa mga di-matuwid”
  choice: Pinanatili ang payak na “para sa” nang walang pagpapalawak
  alternative: “ang walang-sala bilang kapalit ng mga salarin”
  rationale: Malinaw na ang pagdurusa ng Mesiyas ay para sa iba, ngunit hindi dapat magdagdag ang salin ng mas ganap na pormulasyon ng isang partikular na teorya ng pagtubos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Mesiyas” bilang titulong mesiyaniko, “di-matuwid” upang mapanatili ang tuwirang kaibahan sa “matuwid,” at magkatulad na “sa laman ... sa espiritu” upang huwag lutasin ang kalabuan ng Griyego.
