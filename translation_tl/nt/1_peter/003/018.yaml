revisions:
- from: Sapagkat ang Mesiyas man ay minsang nagdusa dahil sa mga kasalanan[a]—ang matuwid para sa mga di-matuwid—upang madala niya kayo sa Diyos. Pinatay siya sa laman ngunit binuhay sa espiritu.[b]
  to: Sapagkat ang Mesiyas man ay nagdusa nang isang beses para sa mga kasalanan[a]—ang matuwid para sa mga di-matuwid—upang madala niya kayo sa Diyos. Pinatay siya sa laman ngunit binuhay sa espiritu.[b]
  rationale: 'Pinalitan ang dalawang salitang nangangailangan ng pagwawasto para sa katapatan at likas na modernong gamit: “minsang” ng “nang isang beses,” at “dahil sa mga kasalanan” ng “para sa mga kasalanan.” Walang binago sa kalabuan ng “sa laman ... sa espiritu,” sa pasibong diwa, o sa mga anchor at nilalaman ng talababa.'
