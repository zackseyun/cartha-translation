base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: tl
  text: kundi nang may kahinahunan at takot[a], na may mabuting budhi, upang sa bagay na pinagsasalitaan kayo ng masama[b], mapahiya ang mga umaalipusta sa mabuti ninyong pamumuhay sa Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagpipitagan” o “paggalang.”
    reason: lexical_alternative
  - marker: b
    text: O “sa bagay na sinisiraan kayo.”
    reason: lexical_alternative
  - marker: c
    text: 'Griyego: “sa Mesiyas”; ayon sa nakaugaliang salin, “kay Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: kahinahunan
  rationale: Ipinahahayag nito ang mapagpakumbaba at hindi marahas na paraan ng pagsagot; likas at malinaw ito sa makabagong Filipino.
- source_word: φόβου
  choice: takot
  rationale: Pinananatili ng “takot” ang lawak at tensiyon ng salitang Griyego, na maaari ring tumukoy sa pagpipitagan o paggalang; hindi tahasang tinutukoy sa konteksto ang layon nito.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: na taglay ang mabuting budhi
  rationale: Tapat nitong inilalarawan ang kasabay at nagpapatuloy na kalagayan ng pagkakaroon ng mabuting budhi.
- source_word: ἐν ᾧ
  choice: sa bagay na
  rationale: Pinananatili nito ang bahagyang bukas na pagtukoy ng pariralang Griyego sa usapin o larangan kung saan sinisiraan ang mga mambabasa.
- source_word: καταλαλεῖσθε
  choice: sinisiraan kayo
  rationale: Ang “sinisiraan” ay natural na Filipino para sa mapanirang pagsasalita laban sa isang tao.
- source_word: καταισχυνθῶσιν
  choice: mapahiya
  rationale: Pinananatili nito ang pasibong diwa at ang layunin o inaasahang bunga na ipinahahayag ng ἵνα at ng pasibong pasakali.
- source_word: ἐπηρεάζοντες
  choice: mga umaalipusta
  rationale: Ipinahahayag nito ang aktibong mapanghamak o mapang-abusong pagtrato, at angkop sa kaugnayan nito sa paninira sa pamumuhay ng mga mananampalataya.
- source_word: ἀναστροφήν
  choice: pamumuhay
  rationale: Ang salita ay tumutukoy sa asal o paraan ng pamumuhay; mas karaniwan at malawak sa Filipino ang “pamumuhay” kaysa sa mas pormal na “pag-uugali.”
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang pinananatili ng payak na pariralang “sa Mesiyas” ang siksik at teolohikal na ugnayang ipinahahayag ng ἐν.
- source_word: ἀγαθὴν
  choice: mabuti
  rationale: Pinananatili ang payak na moral na kahulugan ng ἀγαθός at ang leksikal na pag-uulit nito sa budhi at pamumuhay.
theological_decisions:
- issue: Kahulugan at layon ng φόβου
  choice: takot, nang hindi tahasang tinutukoy kung kanino o saan nakatuon
  alternative: pagpipitagan; paggalang; takot sa Diyos
  rationale: Hindi tahasang binabanggit ng agarang konteksto ang layon ng φόβος. Iniiwasan ng saling ito ang pagpapasya sa isang mas makitid na interpretasyon.
- issue: Pagpapakahulugan sa ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: kay Cristo; bilang mga kaisa ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo. Ang “sa Mesiyas” ay nagpapanatili rin sa maigsi at malawak na diwa ng ἐν Χριστῷ nang hindi ito ipinapaliwanag nang labis.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Pinili ang “kahinahunan,” “mabuting budhi,” at “pamumuhay” bilang natural ngunit tapat na mga katumbas. Hindi nilinaw nang lampas sa teksto ang layon ng “takot” o ang eksaktong saklaw ng “sa Mesiyas.”
