  terminology: Ang 'kahinahunan,' 'takot,' 'mabuting budhi,' 'umaalipusta,' 'mabuting pamumuhay,' at 'Mesiyas' ay angkop sa modernong Filipino at sa antas ng pananalita ng liham. Hindi dapat palitan ang 'takot' ng mas tiyak na 'takot sa Diyos,' sapagkat hindi ito tinutukoy ng teksto.
