  source_fidelity: 'Tapat ang pangunahing diwa sa Griyego: napananatili ang kahinahunan, ang hindi tinutukoy na layon ng takot, mabuting budhi, ang bukas na saklaw ng ἐν ᾧ, mapanirang pagsasalita, kahihiyan, mabuting pamumuhay, at ang ''sa Mesiyas.'' Gayunman, ang ''sa bagay na sinisiraan kayo'' ay medyo pilit sa Filipino at maaaring magmukhang ang ''bagay'' ang tuwirang sinisiraan. Ang ''pinagsasalitaan kayo ng masama'' ay mas malinaw na katumbas ng καταλαλεῖσθε sa konstruksiyong ito.'
