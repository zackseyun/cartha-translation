  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: tl
  text: Lumayo siya sa masama at gumawa ng mabuti; hanapin niya ang kapayapaan at pagsikapang makamit ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habulin ito.” Ipinahihiwatig ng salitang Griyego ang masugid na pagtataguyod sa kapayapaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: Lumayo siya
  rationale: Pinananatili ng “lumayo” ang diwang direksiyon at tahasang pagtalikod na taglay ng aorist imperative, at natural ito sa makabagong Tagalog.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Ang δέ ay banayad na pang-ugnay o panalungat sa daloy ng sipi. Sa nakahiwalay na talatang Tagalog, magiging pilit ang “ngunit”; naipahihiwatig na ng pagkakasunod ng mga utos ang ugnayan.
- source_word: ἀπὸ κακοῦ
  choice: sa masama
  rationale: Moral ang diwa ng κακόν dito, at malinaw ang pagtutol nito sa “mabuti.” Kasama ng “lumayo,” likas ang pariralang “lumayo sa masama.”
- source_word: ποιησάτω ἀγαθόν
  choice: gumawa ng mabuti
  rationale: Karaniwan, malinaw, at aktibong pahayag sa Tagalog para sa etikal na utos ng Griyego.
- source_word: ζητησάτω
  choice: hanapin niya
  rationale: Pinananatili ng “hanapin” ang pagkakaiba at pag-unlad mula sa paghahanap tungo sa masugid na pagtataguyod na ipinahihiwatig ng kasunod na διωξάτω.
- source_word: εἰρήνην
  choice: ang kapayapaan
  rationale: Ang “kapayapaan” ang karaniwan at sapat na malawak na katumbas ng εἰρήνη sa kontekstong biblikal.
- source_word: διωξάτω αὐτήν
  choice: pagsikapang makamit ito
  rationale: Ipinahahayag nito ang masidhi at patuloy na paghahangad sa kapayapaan nang hindi ginagamit ang di-likas na “habulin ito” sa Tagalog; malinaw na ang “ito” ay tumutukoy sa kapayapaan.
- source_word: 3rd person singular imperatives across the verse
  choice: siya ... niya
  rationale: Pinananatili ang ikatlong panauhang isahan ng mga utos sa Griyego. Sa Tagalog, hindi minamarkahan ng “siya/niya” ang kasarian, kaya likas nitong naihahatid ang kinatawang pangkalahatang diwa.
theological_decisions:
- issue: Kinatawang puwersa ng panlalaking isahan sa siping pautos
  choice: Gamitin ang “siya/niya” sa pangunahing teksto
  alternative: “ang isang tao” o tuwirang maramihang “sila”
  rationale: Ang Griyego ay ikatlong panauhang isahan at may pangkalahatang kinatawang diwa. Ang Tagalog na “siya/niya” ay tapat sa bilang at panauhan ngunit hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa Tagalog.
- issue: Lakas ng διώκω kapag kapayapaan ang layon
  choice: “pagsikapang makamit”
  alternative: “habulin” o “itaguyod”
  rationale: Pinananatili nito ang masidhing pagsunod sa kapayapaan nang hindi ginagawang pisikal o denominasyonal ang larawan. Hindi nito ipinapalagay na nakamit na ang kapayapaan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang maiikling pautos at magkatimbang na mga parirala upang mapanatili ang ritmo ng sipi. Ang tandang [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
