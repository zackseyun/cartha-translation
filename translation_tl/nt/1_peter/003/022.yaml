id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: tl
  text: na nasa kanan ng Diyos, matapos pumunta sa langit, at ang mga anghel, mga awtoridad, at mga kapangyarihan ay naipailalim na sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: na
  rationale: Iniuugnay ng panghalip na pamanggit ang talata kay Jesu-Cristo sa naunang pangungusap; natural sa Filipino ang simpleng “na” sa pagpapatuloy ng sugnay.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: nasa kanan ng Diyos
  rationale: Pinananatili ang biblikal na larawang tumutukoy sa dakilang katayuan at karangalan nang hindi ito ginagawang tahasang paliwanag.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: matapos pumaroon sa langit
  rationale: Ipinahahayag ang naunang kilos ng aorist participle at ang direksiyon ng εἰς sa natural at marangal na Filipino.
- source_word: ὑποταγέντων αὐτῷ
  choice: ipinasakop sa kanya
  rationale: Pinananatili ang balintiyak na diwa at ang natapos na pagpapailalim, habang malinaw na si Cristo ang pinasasakupan.
- source_word: ἀγγέλων
  choice: mga anghel
  rationale: Sa konteksto ng pagdakila at mga kosmikong kapangyarihan, mga makalangit na nilalang ang tinutukoy, hindi mga taong mensahero.
- source_word: ἐξουσιῶν
  choice: mga awtoridad
  rationale: Tuwirang katumbas na nagbubukod sa terminong ito mula sa kasunod na δυνάμεων at hindi tinutukoy ang moral na uri ng mga ito.
- source_word: δυνάμεων
  choice: mga kapangyarihan
  rationale: Natural na salin sa talaan ng mga kosmikong ranggo at pinananatili ang tatluhang ayos ng orihinal.
theological_decisions:
- issue: Ang pagdakila kay Cristo sa kanan ng Diyos
  choice: Panatilihin ang idyomang “nasa kanan ng Diyos.”
  alternative: “nasa pinakamataas na marangal na kalagayan sa tabi ng Diyos”
  rationale: Ang larawang panlunan at ugnayan ay may sariling bigat sa teksto; ang pagpapaliwanag dito bilang karangalan lamang ay maglilimita sa kahulugan.
- issue: Pagkakakilanlan ng “mga anghel, mga awtoridad, at mga kapangyarihan”
  choice: Panatilihin ang malawak na katawagan para sa mga makalangit o kosmikong nilalang at kapangyarihan.
  alternative: Tukuyin silang lahat bilang mabubuti o masasamang espiritu.
  rationale: Hindi tahasang inuuri ng Griyego ang mga ito ayon sa moralidad, kaya hindi dapat lutasin ng salin ang nananatiling bukas sa teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “pumaroon” bilang pormal ngunit malinaw na pandiwa para sa pagpunta sa langit; iniwasan ang labis na pagpapaliwanag at pinanatili ang pagkakaugnay sa naunang talata.
