base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: tl
  text: na noong unang panahon ay hindi sumunod[a], nang matiyagang naghihintay ang Diyos noong mga araw ni Noe habang inihahanda ang arka. Iilan lamang—samakatuwid, walong tao[b]—ang ligtas na nakarating sa loob ng arka sa pagdaan sa tubig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ay hindi naniwala.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “walong kaluluwa.”
    reason: lexical_alternative
  - marker: c
    text: O “iniligtas sa pamamagitan ng tubig.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν ποτε
  choice: na noong unang panahon ay hindi sumunod
  rationale: Ipinahahayag ng ἀπειθέω ang pagtangging sumunod, at ng ποτε ang panahong nakalipas. Mas natural sa makabagong Tagalog ang “hindi sumunod” kaysa “mga masuwayin,” habang nananatili ang ugnayang participyal sa naunang talata.
- source_word: ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία
  choice: nang matiyagang naghihintay ang Diyos
  rationale: Ang imperfect na ἀπεξεδέχετο ay nagsasaad ng patuloy na paghihintay, samantalang ang μακροθυμία ay pagtitiis o mahabang pasensiya. Ginawang likas na pandiwang Tagalog ang personipikadong pariralang Griyego nang hindi inaalis ang diwa ng mapagtiis na pagpapaliban.
- source_word: ἐν ἡμέραις Νῶε
  choice: noong mga araw ni Noe
  rationale: Ito ang natural at matapat na katumbas ng panandang pangpanahon.
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: habang inihahanda ang arka
  rationale: Saklaw ng κατασκευάζω ang paghahanda o paggawa. Pinananatili ng “inihahanda” ang malawak na kahulugan, at “arka” ang nakaugaliang tawag sa sasakyang-dagat ni Noe.
- source_word: εἰς ἣν
  choice: ang pumasok doon
  rationale: Pinananatili ng “pumasok” ang direksiyong ipinahahayag ng εἰς. Ang “doon” ay malinaw na tumutukoy sa arka at mas natural kaysa sa literal na “kung saan papasok.”
- source_word: ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: Iilan lamang—samakatuwid, walong tao
  rationale: Ang ὀλίγοι ay maliit na bilang, at nililinaw ito ng τοῦτ’ ἔστιν. Dito, ang ψυχαί ay tumutukoy sa mga tao, hindi sa isang teknikal na antropolohikal na konsepto.
- source_word: διεσώθησαν δι’ ὕδατος
  choice: ligtas na nakatawid sa tubig
  rationale: Ipinahahayag ng διασῴζω ang ligtas na pagkalampas sa panganib. Ang διά na may genitive ay maaaring mangahulugang “sa pamamagitan ng” o “sa pagdaan sa”; pinananatili ng pangunahing salin ang kongkretong larawan ng pagkaligtas sa gitna ng baha, habang nasa talababa ang mas tuwirang alternatibo.
theological_decisions:
- issue: Soteriolohikal na bigat ng διεσώθησαν
  choice: ligtas na nakatawid sa tubig
  alternative: iniligtas sa pamamagitan ng tubig
  rationale: Sa salaysay ng baha, ang pandiwa ay tumutukoy sa ligtas na pagkalampas sa panganib. Hindi ipinapasok agad ng pangunahing salin ang teknikal na wikang soteriolohikal, ngunit pinananatili sa talababa ang posibleng instrumental na pagbasa na mahalaga sa kaugnayan nito sa bautismo sa susunod na talata.
- issue: Kahulugan ng ψυχαί
  choice: mga tao
  alternative: mga kaluluwa
  rationale: Binibilang dito ang mga taong nasa arka; hindi kinakailangang ipinapahayag ng teksto ang paghihiwalay ng kaluluwa at katawan. Inilalagay sa talababa ang mas literal na anyo.
- issue: Lakas ng δι’ ὕδατος
  choice: sa tubig
  alternative: sa pamamagitan ng tubig
  rationale: Maaaring tumukoy ang διά na may genitive sa paraan o sa pagdaan sa isang kalagayan. Pinananatili ang ambiguwidad sa pamamagitan ng malinaw na alternatibo sa talababa sa halip na magtakda ng iisang doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “arka” at “Noe” bilang pamilyar na katawagan. Ang ayos ng pangungusap ay pinadulas para sa natural na Tagalog ngunit pinanatili ang pagkakasunod ng mga ideya, ang direksiyon ng εἰς, at ang ambiguwidad ng δι’ ὕδατος.
