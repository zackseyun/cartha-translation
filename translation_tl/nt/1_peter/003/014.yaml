id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: tl
  text: Ngunit kahit magdusa kayo dahil sa katuwiran, pinagpala kayo. Huwag ninyong katakutan ang kanilang kinatatakutan[a], at huwag kayong mabagabag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang takot sa kanila” o “ang takot na idinudulot nila.” Malabo ang pariralang Griyego at umaalingawngaw sa Isaias 8:12.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Ngunit kahit magdusa kayo
  rationale: Ipinahihiwatig ng kondisyong may optative ang isang tunay ngunit hindi tiyak na posibilidad; likas itong naipahahayag sa Tagalog sa pamamagitan ng “kahit magdusa kayo.”
- source_word: διὰ δικαιοσύνην
  choice: dahil sa katuwiran
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Pinananatili ng “katuwiran” ang moral at teolohikal na lawak ng δικαιοσύνη nang hindi ito nililimitahan sa isang partikular na gawa o sa katarungang panlipunan lamang.
- source_word: μακάριοι
  choice: pinagpala kayo
  rationale: Tuwirang tinutukoy ang mga mambabasa. Ang “pinagpala” ay nagpapanatili ng biblikal na diwa at hindi lamang tumutukoy sa damdamin ng pagiging masaya o sa magandang kapalaran.
- source_word: τὸν ... φόβον αὐτῶν
  choice: ang kanilang kinatatakutan
  rationale: Natural itong basahin sa makabagong Tagalog at tumutugma sa posibleng kahulugang “what they fear.” Gayunman, malabo sa Griyego kung ito ay takot na nadarama nila o takot na idinudulot nila, kaya inilalahad sa talababa ang ibang pagbasa.
- source_word: μὴ φοβηθῆτε
  choice: Huwag ninyong katakutan
  rationale: Ang anyong pautos na negatibo ay malinaw na naihahatid ng “huwag.” Pinananatili rin ng “katakutan” ang pag-uulit ng salitang-ugat na takot kasama ng “kinatatakutan.”
- source_word: μηδὲ ταραχθῆτε
  choice: at huwag kayong mabagabag
  rationale: Ang “mabagabag” ay natural at marangal na paglalarawan ng panloob na pagkabalisa o pagkayanig na ipinahihiwatig ng ταράσσω.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη
  choice: katuwiran
  alternative: paggawa ng tama; katarungan
  rationale: Sa konteksto, tumutukoy ito sa matuwid na pamumuhay na maaaring pagmulan ng pagdurusa. Pinananatili ng “katuwiran” ang mas malawak na moral-teolohikal na diwa kaysa sa mas paliwanag na “paggawa ng tama” o sa mas makitid na posibleng dating ng “katarungan.”
- issue: Ambiguwidad ng τὸν φόβον αὐτῶν
  choice: ang kanilang kinatatakutan
  alternative: ang takot sa kanila; ang takot na idinudulot nila
  rationale: Ang parirala ay umaalingawngaw sa Isaias 8:12 at maaaring tumukoy sa kinatatakutan nila o sa takot na idinudulot nila. Gumagamit ang pangunahing teksto ng natural na pagbasa ngunit hindi itinatago ang tunay na ambiguwidad, na pinananatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “katuwiran,” “pinagpala,” at “mabagabag” upang mapanatili ang biblikal na bigat nang hindi nagiging lipas o teknikal. Ang panghalip na maramihan ay malinaw sa “kayo/ninyo.”
