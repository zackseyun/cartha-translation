  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: tl
  text: At sino ang makapipinsala sa inyo kung maging masigasig kayo sa mabuti?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masigasig sa paggawa ng mabuti.”
    reason: Ipinapakita ang natural na pagpapakahulugang nakatuon sa gawa, samantalang pinananatili ng pangunahing teksto ang mas malawak na saklaw ng τοῦ ἀγαθοῦ.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang neutral na pang-ugnay at ang daloy mula sa naunang pangaral.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: sino ang mananakit sa inyo
  rationale: Natural na Filipino para sa substantival na future participle at pinananatili ang anyo ng retorikal na tanong. Malawak ang saklaw ng “mananakit,” kaya maaari itong tumukoy sa pananakit, pagpinsala, o masamang pagtrato.
- source_word: ἐὰν
  choice: kung
  rationale: Karaniwan at malinaw na pananda ng kondisyong ipinahahayag ng ἐὰν kasama ng subjunctive.
- source_word: τοῦ ἀγαθοῦ
  choice: sa paggawa ng mabuti
  rationale: Natural na ipinahahayag sa Filipino ang bagay na pinagtutuunan ng sigasig; ipinapakita ng “paggawa ng mabuti” ang praktikal na diwa ng abstraktong neuter na ἀγαθόν ayon sa konteksto.
- source_word: ζηλωταὶ
  choice: masigasig
  rationale: Ipinapahayag ang matinding pagkagiliw at pagtatalaga ng ζηλωτής sa paraang natural at dignified sa modernong Filipino.
- source_word: γένησθε
  choice: maging
  rationale: Pinananatili ang diwa ng pagpasok o pagiging gayon, sa halip na gawing payak na kasalukuyang kalagayan lamang.
theological_decisions:
- issue: Lakas ng retorikal na tanong kaugnay ng pagdurusa dahil sa paggawa ng tama
  choice: 'Pinanatili bilang pangkalahatang retorikal na katiyakan: “sino ang mananakit sa inyo?”'
  alternative: Isalin bilang tahasang pangakong walang sinumang makapipinsala kailanman sa mga mananampalataya.
  rationale: Kinikilala ng kasunod na konteksto na maaari pa rin silang magdusa dahil sa paggawa ng mabuti. Kaya hindi ginawang absolutong pangako ng kaligtasan mula sa lahat ng pagdurusa ang tanong.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kayo/inyo” upang maipakita ang maramihang ὑμᾶς at γένησθε; iniwasan ang sobrang teknikal o makalumang pananalita.
