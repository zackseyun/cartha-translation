base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: tl
  text: Ang inyong palamuti ay huwag maging yaong panlabas—ang pagtitirintas ng buhok, pagsusuot ng mga alahas na ginto, o pagbibihis ng mga damit—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring isalin: “Huwag hayaang ang inyong palamuti ay maging ang panlabas—pagtitirintas ng buhok, pagsusuot ng mga gintong palamuti, o pagbibihis ng mga damit.” Inihahambing ng kasunod na talata ang panlabas na palamuti sa nakatagong pagkatao ng puso. Maaaring unawain ang pahayag bilang pagbibigay-priyoridad sa panloob na pagkatao, bagama’t payak ang anyo ng pagtanggi sa talatang ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: inyong
  rationale: Ang panghalip na paari ay tumutukoy sa mga babaeng/asawang babae na kausap sa naunang talata; natural itong ipinahahayag sa Tagalog bilang “inyong.”
- source_word: ἔστω οὐχ
  choice: ay huwag maging
  rationale: Pinananatili nito ang lakas ng pangatlong-panauhang pautos na may pagtanggi, sa natural at marangal na Tagalog.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: panlabas ... palamuti
  rationale: Ang κόσμος dito ay “palamuti” o “pag-aayos,” hindi “mundo”; inilalarawan ng ἔξωθεν ang panlabas na anyo nito.
- source_word: ἐμπλοκῆς τριχῶν
  choice: pagtitirintas ng buhok
  rationale: Tuwirang ipinahahayag ang uri ng panlabas na pagpapalamuti at pinananatili ang kilos na nasa pangngalang ἐμπλοκή.
- source_word: περιθέσεως χρυσίων
  choice: pagsusuot ng mga alahas na ginto
  rationale: Ipinahahayag ng περίθεσις ang paglalagay o pagsusuot, at ang χρυσίων ay tumutukoy sa mga bagay na ginto, malamang ay mga palamuti o alahas.
- source_word: ἐνδύσεως ἱματίων
  choice: pagbibihis ng mga damit
  rationale: Pinananatili ang paralel na anyo ng tatlong kilos na inililista, gamit ang karaniwang bokabularyong Tagalog.
theological_decisions:
- issue: Kung lubusang ipinagbabawal ni Pedro ang panlabas na pag-aayos, alahas, at pananamit, o inuuna lamang niya ang panloob na pagkatao
  choice: Ipinahihiwatig ng “huwag maging panlabas lamang” na hindi dapat nakasentro sa panlabas na anyo ang palamuti.
  alternative: Basahin ang payak na pagtanggi bilang ganap na pagbabawal sa pagtitirintas, gintong alahas, at pagbibihis.
  rationale: Ikinukumpara ng kasunod na talata ang panlabas na palamuti sa nakatagong pagkatao ng puso. Gayunman, dahil maaaring basahin nang mas ganap ang Griyegong pagtanggi, minarkahan ang “lamang” at ipinaliwanag sa talababa sa halip na itago ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “palamuti” para sa κόσμος at mga magkakatulad na pariralang pandiwa-pangngalan upang mapanatili ang paralelismo ng Griyego. Ang hulihang gitling ay nagpapatuloy sa diwa tungo sa talata 4.
