  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: tl
  text: Ang katumbas nito—ang bautismo—ay nagliligtas din ngayon sa inyo. Hindi ito pag-aalis ng dumi sa laman, kundi paghingi sa Diyos ng isang mabuting budhi[a], sa pamamagitan ng muling pagkabuhay ni Jesu-Cristo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kundi pangako ng isang mabuting budhi sa Diyos.” Ang salitang Griyego na isinaling “paghingi” (ἐπερώτημα) ay maaari ring unawain bilang “pangako” o “tugon.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: Ang katumbas nito
  rationale: Tumutukoy pabalik sa tubig at pangyayari noong baha sa naunang talata. Pinananatili ng “katumbas nito” ang ugnayang tipolohikal nang hindi gumagamit ng teknikal at di-pamilyar na terminong “antitype.”
- source_word: σῴζει
  choice: nagliligtas
  rationale: Tuwirang isinasalin ang pangkasalukuyang pandiwa at hindi pinahihina ang malinaw na pahayag ng teksto.
- source_word: βάπτισμα
  choice: bautismo
  rationale: Karaniwang salin sa Filipino; malinaw ring ibinubukod ng kasunod na paliwanag ang bautismo sa pisikal na paghuhugas lamang.
- source_word: σαρκὸς
  choice: laman
  rationale: Pinananatili ang literal na diwa ng σάρξ sa konteksto ng pisikal na dumi, sa halip na ang mas mapagpaliwanag na “katawan.”
- source_word: ἀπόθεσις ῥύπου
  choice: pag-aalis ng dumi
  rationale: Natural at malinaw na paglalarawan ng panlabas na paglilinis.
- source_word: συνειδήσεως ἀγαθῆς
  choice: ng isang malinis na budhi
  rationale: Ang “malinis na budhi” ay natural sa modernong Filipino para sa budhing matuwid o walang paratang sa harap ng Diyos. Ang ugnayan ng genitive sa ἐπερώτημα ay isinaling bilang layon ng paghingi, habang kinikilala sa talababa ang ibang posibleng pagbasa.
- source_word: ἐπερώτημα
  choice: paghingi
  rationale: Ang “paghingi” ay angkop sa direksiyon ng εἰς θεόν at nagpapahayag ng pagsusumamo sa Diyos. Dahil maaaring mangahulugan din ang salita ng “pangako” o “tugon,” inilalahad ang alternatibo sa talababa.
- source_word: εἰς θεόν
  choice: sa Diyos
  rationale: Natural na Filipino para sa isang kahilingan o pagsusumamong nakatuon sa Diyos.
- source_word: δι’ ἀναστάσεως
  choice: sa pamamagitan ng muling pagkabuhay
  rationale: Ipinahahayag ang instrumental na gamit ng διά na may genitive.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesu-Cristo
  rationale: Ang “Jesu-Cristo” ay natural, marangal, at malawak na nauunawaang anyo sa Filipino, habang pinananatili ang titulong Χριστός sa nakaugaliang katumbas nito.
theological_decisions:
- issue: Ugnayan ng bautismo at kaligtasan
  choice: Panatilihin ang tuwirang pahayag na “ang bautismo—ay nagliligtas din ngayon sa inyo,” at hayaang ang sariling paglilinaw ni Pedro ang magtakda ng diwa nito.
  alternative: Pahinain bilang “sumasagisag sa kaligtasan” o palawakin ayon sa isang partikular na doktrinang sakramental.
  rationale: Tuwirang iniuugnay ng Griyego ang bautismo sa pagliligtas, ngunit agad nitong itinatanggi na pisikal na paglilinis lamang iyon at iniuugnay ito sa budhi sa harap ng Diyos at sa muling pagkabuhay ni Jesus. Pinananatili ng salin ang tensiyong ito nang walang denominasyonal na pagpapaliwanag.
- issue: Kahulugan ng ἐπερώτημα sa konteksto ng bautismo
  choice: Isalin bilang “paghingi” sa pangunahing teksto.
  alternative: “pangako” o “tugon” ng isang malinis na budhi sa Diyos.
  rationale: Tunay na pinagtatalunan ang kahulugan. Ang “paghingi” ay nababagay sa εἰς θεόν, ngunit may sapat na batayan ang “pangako” o “tugon,” kaya pinananatili ang mga iyon sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “budhi” bilang karaniwang katumbas ng συνείδησις at iniwasan ang teknikal o denominasyonal na pagpapalawak. Inilagay ang paningit na “ang bautismo” upang maging malinaw na ito ang katumbas ng naunang inilalarawan.
