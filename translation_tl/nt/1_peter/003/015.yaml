  to: Ngunit ituring ninyong banal sa inyong mga puso ang Mesiyas bilang Panginoon[a]. Lagi kayong maging handang magbigay ng pagtatanggol sa bawat taong humihingi sa inyo ng paliwanag tungkol sa pag-asang nasa inyo.
