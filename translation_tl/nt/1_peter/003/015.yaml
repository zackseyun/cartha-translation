  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: tl
  text: Ngunit ituring ninyong banal sa inyong mga puso ang Mesiyas bilang Panginoon[a]. Lagi kayong maging handang magbigay ng pagtatanggol sa bawat taong humihingi sa inyo ng paliwanag tungkol sa pag-asang nasa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Italaga ninyong banal sa inyong mga puso ang Mesiyas bilang Panginoon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον ... τὸν Χριστὸν
  choice: ang Mesiyas bilang Panginoon
  rationale: Pinananatili ang Χριστός bilang titulong “Mesiyas” at ang κύριος bilang “Panginoon.” Ang “bilang” ay malinaw na nag-uugnay sa pagkilala sa Mesiyas sa kanyang pagiging Panginoon nang hindi pinapawi ang alingawngaw ng Isaias 8:13.
- source_word: ἁγιάσατε
  choice: kilalanin ninyong banal
  rationale: Ang pandiwa ay literal na “pabanalin” o “ituring na banal.” Sa personal na layon na Mesiyas, ipinahahayag nito ang panloob na pagkilala at paggalang sa kanyang kabanalan, hindi ang paggawa sa kanya upang maging banal.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Tuwirang pinananatili ang larawan ng puso bilang kaloob-loobang pagkatao at ang pangmaramihang anyo ng “inyong.”
- source_word: ἕτοιμοι ἀεὶ
  choice: Lagi kayong maging handa
  rationale: Natural na Filipino na pinananatili ang patuloy na kahandaan na ipinahihiwatig ng ἀεί.
- source_word: πρὸς ἀπολογίαν
  choice: magbigay ng pagtatanggol
  rationale: Ang ἀπολογία ay isang pagtatanggol, paliwanag, o tugon. Ang pariralang ito ay malinaw at natural, habang pinananatili ang bahagyang legal o depensibong himig ng salita.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: sa bawat humihingi sa inyo
  rationale: Pinananatili ng “bawat” ang distributibong saklaw ng παντί at ng “humihingi” ang nagpapatuloy na kilos ng participle.
- source_word: λόγον
  choice: paliwanag
  rationale: Sa kontekstong ito, ang λόγος ay isang maipapahayag na saligan o katuwiran. Mas natural sa Filipino ang “paliwanag” kaysa “isang dahilan” matapos ang “humihingi.”
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: tungkol sa pag-asang nasa inyo
  rationale: Malapit sa anyo ng Griyego at pinananatiling bukas kung ang pag-asa ay nasa bawat isa o nasa kanilang pamayanan bilang kabuuan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na gumaganap ang Χριστός bilang titulo, lalo na sa pagkakaugnay nito sa κύριος; kaya isinalin ang kahulugan nito sa halip na gamitin ang tradisyonal na transliterasyong “Cristo.”
- issue: Diwa ng ἁγιάσατε kapag ang Mesiyas ang layon
  choice: kilalanin ninyong banal
  alternative: pabanalin ninyo
  rationale: Pinananatili nito ang utos na ituring at parangalan siyang banal, nang hindi ipinahihiwatig na ang mga mananampalataya ang nagpapabanal sa Mesiyas o gumagawa sa kanya upang maging banal.
- issue: Ugnayan ng κύριον at Χριστόν
  choice: ang Mesiyas bilang Panginoon
  alternative: ang Panginoong Mesiyas
  rationale: Ang “bilang Panginoon” ay nagpapakita ng predikatibong puwersa ng κύριον kaugnay ng utos na ἁγιάσατε, samantalang ang alternatibo ay maaaring basahin lamang bilang magkasunod na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyong” at “kayong” upang maipakita ang pangmaramihang kausap. Iniwasan ang sobrang teknikal na bokabularyo, ngunit pinanatili ang “pagtatanggol” para sa natatanging diwa ng ἀπολογία.
