source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: tl
  text: Sapagkat ang lahat ng nasa sanlibutan—ang pagnanasa ng laman[a], ang pagnanasa ng mga mata, at ang pagmamataas dahil sa kabuhayan[b]—ay hindi nagmumula sa Ama, kundi sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pita ng laman.” Ang salitang Griyego ay maaaring mangahulugang matinding pagnanais, paghahangad, o pita; hindi lamang ito tumutukoy sa seksuwal na pagnanasa. Maaari ring unawain ang “laman” dito bilang makasalanang kalikasan ng tao.
    reason: lexical_alternative
  - marker: b
    text: O “mapagmataas na pagyayabang tungkol sa kabuhayan.” Ang “kabuhayan” ay maaaring tumukoy sa katayuan, mga ari-arian, o paraan ng pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan ng naunang utos at natural na nagpapanatili sa causal na puwersa.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: ang lahat ng nasa sanlibutan
  rationale: Pinananatili ang kolektibo at malawak na saklaw ng Griyegong parirala.
- source_word: κόσμῳ / κόσμου
  choice: sanlibutan
  rationale: Karaniwang salin ng κόσμος na hindi nagpapasok sa pangunahing teksto ng paliwanag na gaya ng 'makamundong sistema.'
- source_word: ἐπιθυμία
  choice: pagnanasa
  rationale: Nagpapahayag ng matindi at, sa kontekstong ito, masamang pagnanasa nang hindi ito nililimitahan sa seksuwal na pita.
- source_word: τῆς σαρκὸς
  choice: ng laman
  rationale: Pinananatili ang konkretong talinghaga at teolohikal na tensiyon ng σάρξ sa halip na agad ipakahulugang 'makasalanang kalikasan.'
- source_word: τῶν ὀφθαλμῶν
  choice: ng mga mata
  rationale: Tuwirang salin na nagpapanatili sa maramihang anyo ng Griyego.
- source_word: ἀλαζονεία τοῦ βίου
  choice: mapagmataas na pagpaparangya sa buhay
  rationale: Ipinahahayag ang mapagmalaki at mapagkunwaring pagtatanghal na maaaring kaugnay ng katayuan, ari-arian, o paraan ng pamumuhay; mas malinaw ito sa modernong Tagalog kaysa sa malabong 'pagmamataas ng buhay.'
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: ay hindi nagmumula sa Ama
  rationale: Malinaw na inilalahad ang pinagmulan na tinutukoy ng ἐκ.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: kundi sa sanlibutan
  rationale: Pinananatili ang tuwirang pagsalungat ng dalawang pinagmulan; nauunawaan ang pandiwang 'nagmumula' mula sa unang sugnay.
theological_decisions:
- issue: Kahulugan ng σάρξ sa isang listahang may moral na diin
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Ang 'laman' ay nagpapanatili sa sadyang lawak at talinghaga ng Griyego; ang alternatibo ay maaaring magtakda ng isang partikular na antropolohikal na pagpapakahulugan.
- issue: Kahulugan ng κόσμος
  choice: sanlibutan
  alternative: makamundong sistema
  rationale: Hinahayaan ang konteksto na magpahiwatig ng kaayusang salungat sa Ama, sa halip na ipaloob ang interpretasyon sa mismong salin.
- issue: Saklaw ng ἀλαζονεία τοῦ βίου
  choice: mapagmataas na pagpaparangya sa buhay
  alternative: pagmamataas sa buhay
  rationale: Ang parirala ay maaaring tumukoy sa pagyayabang o mapagkunwaring pagtatanghal ng katayuan, tinatangkilik, at paraan ng pamumuhay; hindi ito nililimitahan sa panloob na damdamin lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'sanlibutan' upang mapanatili ang biblikal na teolohikal na gamit ng κόσμος, at nilinaw sa natural na Tagalog ang mahirap na pariralang ἀλαζονεία τοῦ βίου nang hindi pinakikitid ang saklaw nito.
