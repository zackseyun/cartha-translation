  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: tl
  text: Hindi ko kayo sinulatan dahil hindi ninyo alam ang katotohanan, kundi dahil alam ninyo ito, at dahil walang kasinungalingang nagmumula sa katotohanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: isinulat
  rationale: Ang aorist ay likas na naipahahayag sa Filipino sa aspektong perpektibo. Idinagdag ang “ito” upang malinaw na tumukoy sa liham na tinatanggap ng mga mambabasa, nang hindi binabago ang diwa.
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Direkta at natural itong katumbas ng pandiwang nangangahulugang “alam” o “nakikilala.” Ang pagkakaiba ng “hindi ninyo alam” at “alam ninyo” ay sapat nang naghahatid ng mariing pagsalungat sa Filipino.
- source_word: ἀλήθεια
  choice: ang katotohanan
  rationale: Pinananatili ang tiyak at malawak na pahayag ng Griyego, nang hindi ito pinakikitid sa “mensahe” o “ebanghelyo.”
- source_word: πᾶν ψεῦδος ... οὐκ ἔστιν
  choice: walang kasinungalingan
  rationale: Ito ang natural na Filipino para sa pangkalahatang pagtangging “bawat kasinungalingan ... ay hindi,” at pinananatili nitong saklaw ang lahat ng uri ng kabulaanan.
- source_word: ἐκ τῆς ἀληθείας
  choice: nagmumula sa katotohanan
  rationale: Ipinahahayag ng “nagmumula” ang pinagmulan o bukal na ipinakikita ng ἐκ, sa malinaw at karaniwang Filipino.
theological_decisions:
- issue: Saklaw ng “katotohanan” sa gamit ni Juan
  choice: ang katotohanan
  alternative: ang tunay na mensahe; ang katotohanan ng ebanghelyo
  rationale: May malalim na teolohikal na kahulugan ang salita sa sulat, ngunit hindi ito nililimitahan ng talata sa isang mas makitid na parirala. Pinananatili ng salin ang lawak ng orihinal.
- issue: Ugnayan ng kasinungalingan at katotohanan
  choice: walang kasinungalingang nagmumula sa katotohanan
  alternative: walang kasinungalingang mula sa katotohanan
  rationale: Pinananatili nito ang ideya ng pinagmulan na taglay ng ἐκ, nang hindi pinalalawak ang pahayag tungo sa ibang pilosopikal o doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kundi” upang ihatid ang matalim na pagsalungat ng ἀλλά, at iniwasan ang teknikal o denominasyonal na pagpapalawak.
