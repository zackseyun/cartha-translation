base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: tl
  text: 'At dito natin nalalaman na nakilala na natin siya: kung tinutupad natin ang kanyang mga utos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “na nakilala natin siya”; ang perfect na anyo ng pandiwa sa Griyego ay malamang nagpapahiwatig ng “na nakilala na natin siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: sa ganitong paraan
  rationale: Likas na Filipino para sa pormulang Juanino na nagpapakilala ng batayan o katibayan kung paano nalalaman ang isang bagay; pinananatili rin nito ang puwersa ng demonstratibo.
- source_word: γινώσκομεν
  choice: nalalaman natin
  rationale: Ang pangkasalukuyang pandiwa ay tumutukoy sa kasalukuyang pagkilala o katiyakan; natural itong ipinahahayag sa Filipino bilang “nalalaman natin.”
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: na nakilala na natin siya
  rationale: Ipinahihiwatig ng Greek perfect ang pagkakilalang nagsimula na at may nagpapatuloy na bunga. Ang “nakilala na natin” ay natural sa Filipino at higit na nag-iingat sa aspektong ito kaysa sa payak na “kilala natin.”
- source_word: αὐτόν
  choice: siya
  rationale: Pinananatili ang panghalip ng Griyego upang hindi tukuyin nang higit sa teksto kung ang tinutukoy ay ang Diyos o si Cristo.
- source_word: ἐὰν
  choice: kung
  rationale: Direkta at natural na panandang kondisyon sa Filipino.
- source_word: ἐντολάς
  choice: mga utos
  rationale: Ang “mga utos” ay may sapat na moral at biblikal na bigat, ngunit mas natural sa modernong Filipino kaysa sa “mga kautusan” sa pangungusap na ito.
- source_word: τηρῶμεν
  choice: tinutupad natin
  rationale: Ipinahahayag ng “tinutupad” ang masunuring pag-iingat at pagsasagawa ng mga utos, na siyang diwa ng τηρέω sa kontekstong Juanino.
theological_decisions:
- issue: Tinutukoy ng αὐτόν (“siya”)
  choice: Panatilihin ang panghalip na “siya” nang hindi tahasang tinutukoy ang Diyos o si Jesus sa pangunahing teksto.
  alternative: Tukuyin bilang “ang Diyos” o “si Jesus/Cristo.”
  rationale: Panghalip ang ginamit sa Griyego, at pinananatili ng konteksto ng 1 Juan ang malapit na ugnayan ng pagkilala sa Diyos at ng kaugnayan sa Anak. Iniiwasan ng “siya” ang paglutas sa isang sangguniang hindi tahasang nilinaw ng talata.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga utos” at “tinutupad” upang mapanatili ang biblikal na bigat nang hindi nagiging makaluma. Ang panandang talababa [a] ay nasa pangunahing teksto.
