  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: tl
  text: Ang nagsasabi, “Nakilala ko na siya,”[a] at hindi tumutupad sa kanyang mga utos ay sinungaling, at wala sa taong iyon[b] ang katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kilala ko siya.” Ipinahihiwatig ng anyong perfect sa Griyego ang kasalukuyang pagkakilala na bunga ng naunang pagkakilala sa kanya.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “sa taong ito”; maaari ring isalin na “sa gayong tao.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ang nagsasabi
  rationale: Ang articular present participle ay tumutukoy sa sinumang taong gumagawa ng ganitong pahayag; natural sa modernong Tagalog ang generic na “Ang nagsasabi.”
- source_word: Ἔγνωκα
  choice: Nakilala ko na
  rationale: Ipinahihiwatig ng Greek perfect ang kasalukuyang kalagayang bunga ng pagkakilala noon; naipapahayag ito ng “nakilala ... na” nang hindi nililimitahan sa kaalamang pangkaisipan lamang.
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ang panghalip ng Griyego at hindi tahasang nilulutas kung ang tiyak na tinutukoy ay ang Diyos o si Cristo.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: kanyang mga utos
  rationale: Ang “mga utos” ay natural at malinaw na katumbas ng ἐντολάς sa kasalukuyang Tagalog.
- source_word: μὴ τηρῶν
  choice: hindi tumutupad
  rationale: Sa konteksto, ang τηρέω ay pag-iingat o pagsunod sa mga utos; malinaw na naihahatid ng “tumutupad” ang aktuwal at nagpapatuloy na pagsasagawa.
- source_word: ψεύστης
  choice: sinungaling
  rationale: Tuwirang pinananatili ang predicate noun at ang mariing moral na paglalarawan ng teksto.
- source_word: ἐν τούτῳ
  choice: sa taong iyon
  rationale: Likas sa Tagalog at malinaw na ibinabalik ang demonstrative sa taong kalalarawan lamang, sa halip na gumamit ng panghalip na maaaring mapagkamalang tumutukoy sa Diyos.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: wala ... ang katotohanan
  rationale: Pinananatili ang malawak na Johannine na diwa ng “katotohanan” at ang payak ngunit mariing pagtanggi sa presensya nito.
theological_decisions:
- issue: Tinutukoy ng αὐτόν / αὐτοῦ
  choice: Panatilihin bilang “siya” / “kanyang”
  alternative: Tukuyin nang tahasan bilang Diyos o Cristo
  rationale: Pinakamalapit na konteksto ang Diyos, ngunit dahil mahigpit na pinag-uugnay ni Juan ang Ama at ang Anak, hindi nilulutas ng salin ang hindi tahasang nilulutas ng panghalip sa Griyego.
- issue: Lakas ng Ἔγνωκα
  choice: “Nakilala ko na” bilang relasyonal na pagkakilala na may nagpapatuloy na bunga
  alternative: “Kilala ko siya”
  rationale: Masasalamin ng napiling anyo ang Greek perfect at ang pag-angkin ng isang naitatag nang relasyon, nang hindi nagdaragdag ng ideya ng mistikal na pakikipag-isa.
- issue: Ugnayan ng pag-angkin at hindi pagtupad
  choice: Panatilihin ang tuwirang hatol na “sinungaling”
  alternative: Palambutin bilang “hindi nagsasabi ng totoo”
  rationale: Predicate noun ang ψεύστης at sinadya ng teksto ang mariing personal na moral na paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “tumutupad” sa halip na mas kolokyal na “sumusunod” upang mapanatili ang diwa ng pag-iingat at pagsasagawa sa mga utos. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
