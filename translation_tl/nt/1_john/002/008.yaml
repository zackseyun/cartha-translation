- from: Muli, isang bagong utos ang isinusulat ko sa inyo. Totoo ito sa kanya[a] at sa inyo, sapagkat lumilipas na ang kadiliman at sumisikat na ang tunay na liwanag.
  to: Muli, sumusulat ako sa inyo ng isang bagong utos, na totoo sa kanya[a] at sa inyo, sapagkat lumilipas ang kadiliman at nagliliwanag na ang tunay na liwanag.
  rationale: Pinalitan ang “sumisikat” ng “nagliliwanag” upang maipahayag ang φαίνει nang hindi nagdaragdag ng larawan ng pagsikat ng araw. Ginawang mas tuwiran ang ayos ng unang pangungusap. Inayos ang talababa upang ang alternatibong pagbasa ay malinaw na tumukoy sa utos, hindi sa lugar.
