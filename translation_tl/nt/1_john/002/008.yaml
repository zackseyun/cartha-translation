  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: tl
  text: Muli, sumusulat ako sa inyo ng isang bagong utos, na totoo sa kanya[a] at sa inyo, sapagkat lumilipas ang kadiliman at nagliliwanag na ang tunay na liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na totoo sa utos at sa inyo,” kung ang panghalip ay tumutukoy sa utos sa halip na kay Cristo.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Pinananatili ang maikling panandang pandiskurso na nagpapakitang sa ibang diwa ay bagong utos ang isinusulat, kasunod ng sinabi sa talata 7.
- source_word: ἐντολὴν καινὴν
  choice: isang bagong utos
  rationale: Likas at tumpak na salin; ipinahihiwatig ng καινός ang pagiging bago sa uri o katangian.
- source_word: γράφω
  choice: ang isinusulat ko
  rationale: Ipinahahayag ang kasalukuyang pagkilos ng pagsulat at natural sa modernong Tagalog.
- source_word: ἀληθὲς
  choice: Totoo
  rationale: Pinananatili ang diwa ng pagiging tunay at ang ugnayang pampanitikan sa 'tunay na liwanag.'
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Malamang na tumutukoy ang panghalip kay Cristo, ang pinakanatural na personal na tinutukoy sa konteksto.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Direktang pinananatili ang paralelismo sa 'sa kanya,' habang maaari itong tumukoy sa katotohanang nahahayag sa buhay ng mga mambabasa.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang ugnayang sanhi o batayan ng naunang pahayag.
- source_word: ἡ σκοτία παράγεται
  choice: lumilipas na ang kadiliman
  rationale: Ipinahahayag ang nagpapatuloy na paglaho ng kadiliman; ang 'na' ay natural na kasama ng aspektong nagsimula na.
- source_word: τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει
  choice: sumisikat na ang tunay na liwanag
  rationale: Ang 'sumisikat' ay likas para sa liwanag at ipinakikita ng 'na' na nagaganap na ito ngayon, ayon sa ἤδη.
theological_decisions:
- issue: Tinutukoy ng αὐτῷ
  choice: 'Tumutukoy kay Cristo: “Totoo ito sa kanya at sa inyo.”'
  alternative: 'Maaaring tumukoy sa utos: “Totoo ito rito at sa inyo.”'
  rationale: Ang anyong panlalaki ng panghalip at ang kontekstong Juanino ay higit na umaayon sa personal na pagtukoy kay Cristo. Gayunman, hindi lubos na walang posibilidad ang konseptuwal na pagtukoy sa utos, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sapagkat” para sa dignidad ng tono, at iniwasan ang pagpapaliwanag sa loob ng teksto ng tunay na ambiguwidad ng panghalip.
