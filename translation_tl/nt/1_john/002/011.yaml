  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: tl
  text: Ngunit ang napopoot sa kanyang kapatid[a] ay nasa kadiliman at lumalakad sa kadiliman, at hindi niya alam kung saan siya pupunta, sapagkat binulag ng kadiliman ang kanyang mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa panlalaking isahan, “kapatid na lalaki,” ngunit malamang na tumutukoy ito sa isang kapwa mananampalataya sa pamayanang Kristiyano, lalaki man o babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: napopoot
  rationale: Ang substantival na pangkasalukuyang participle ay naglalarawan ng namamalaging saloobin o pagkakakilanlan; natural itong naipahahayag sa Tagalog bilang “ang napopoot.”
- source_word: ἀδελφὸν
  choice: kapatid
  rationale: Ang “kapatid” ay likas na salin sa Tagalog at hindi kailangang tukuyin ang kasarian, bagaman ang anyong Griyego ay panlalaking isahan; sa konteksto, malamang na tumutukoy ito sa kapwa mananampalataya.
- source_word: ἐν τῇ σκοτίᾳ
  choice: nasa kadiliman / sa kadiliman
  rationale: Pinananatili ang kongkretong larawang teolohikal ng kadiliman at ang pag-uulit nito sa dalawang sugnay.
- source_word: περιπατεῖ
  choice: lumalakad
  rationale: Pinananatili nito ang metapora ng paglakad bilang paraan ng pamumuhay o asal, sa halip na ipaliwanag agad bilang “namumuhay.”
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: Hindi niya alam kung saan siya pupunta
  rationale: Natural na modernong Tagalog na nagpapanatili sa larawan ng pagkilos patungo sa isang lugar o hantungan.
- source_word: ἐτύφλωσεν
  choice: binulag
  rationale: Tuwirang inilalarawan ang naganap na pagkilos ng kadiliman na may nagpapatuloy na bunga sa kasalukuyan.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ang kanyang mga mata
  rationale: Pinananatili ang kongkretong larawan ng mga mata at ang taglay na panghalip.
theological_decisions:
- issue: Moral at espirituwal na kahulugan ng σκοτία
  choice: Isinalin nang literal bilang “kadiliman.”
  alternative: “kasamaan” o “kadiliman ng kasalanan”
  rationale: Ang metapora ni Juan ay sadyang malalim at kaugnay ng kanyang paghahambing ng liwanag at kadiliman; hindi ito dapat paliitin sa isang paliwanag na wala mismo sa teksto.
- issue: Tinutukoy ng ἀδελφός
  choice: “kapatid,” na maaaring tumukoy sa kapwa mananampalataya anuman ang kasarian
  alternative: “kapatid na lalaki” o “kapwa mananampalataya”
  rationale: Bagaman panlalaking isahan ang Griyego, likas na walang tinutukoy na kasarian ang salitang Tagalog na “kapatid.” Nililinaw sa talababa ang malamang na saklaw nito sa pamayanang Kristiyano nang hindi ginagawang paraphrase ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “kadiliman” at ang metapora ng “lumalakad,” na mahalaga sa estilo at teolohiya ni Juan.
