  source_fidelity: 'Tumpak ang pangunahing salin: naipapahayag nito ang taong may patuloy na pagkamuhi, ang dalawang ulit na pagkakasangkot sa kadiliman, ang metapora ng paglakad, ang kawalan ng kaalaman sa patutunguhan, at ang pagbulag ng kadiliman sa kanyang mga mata. Ang pag-uugnay ng mga sugnay sa isang pangungusap ay mas malapit sa estruktura ng Griyego.'
