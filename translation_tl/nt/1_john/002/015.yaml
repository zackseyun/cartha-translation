  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: tl
  text: Huwag ninyong ibigin ang sanlibutan o ang mga bagay na nasa sanlibutan. Kung may umiibig sa sanlibutan, wala sa kanya ang pag-ibig sa Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pag-ibig ng Ama,” na maaaring tumukoy sa pag-ibig na taglay o ipinapakita ng Ama.
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Huwag ninyong ibigin
  rationale: Ang pangkasalukuyang pautos na may μή ay maaaring pangkalahatang pagbabawal o pagbabawal sa nagpapatuloy na gawain. Hindi pinipilit ng payak na “Huwag ninyong ibigin” ang alinman sa dalawang aspekto.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Sa konteksto, tumutukoy ito sa kaayusang salungat sa Diyos, hindi sa pisikal na nilikha lamang. Ang “sanlibutan” ay maikli, dignified, at hinahayaang linawin ng konteksto ang diwa.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: o ang mga bagay na nasa sanlibutan
  rationale: Pinalalawak ng parirala ang pagbabawal mula sa sanlibutan tungo sa mga bagay na saklaw nito. Natural sa makabagong Tagalog ang “o” sa kasunod na bahagi ng negatibong pautos.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Kung iniibig ng sinuman
  rationale: Ang “sinuman” ay likas na nagpapahayag ng di-tiyak at pangkalahatang saklaw ng τις.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: ang pag-ibig sa Ama
  rationale: Mas pinapaboran ng paghahambing sa pag-ibig sa sanlibutan ang diwang pag-ibig na nakatuon sa Ama. Dahil hindi natural na mapanatili sa Tagalog ang buong kalabuan ng genitibo, inilagay sa talababa ang alternatibong “pag-ibig ng Ama.”
- source_word: ἐν αὐτῷ
  choice: wala sa kanya
  rationale: Pinananatili nito ang isahang reperensiya ng Griyego habang natural at pangkalahatan sa Tagalog.
theological_decisions:
- issue: Kahulugan ng “sanlibutan” sa etikang Juanino
  choice: Pinanatili ang “sanlibutan” nang walang paliwanag sa pangunahing teksto.
  alternative: kaayusan ng sanlibutang salungat sa Diyos
  rationale: Hindi kinokondena ng talata ang nilikha o ang mga tao bilang gayon; ang konteksto ang nagpapakitang ang tinutukoy ay ang kaayusang sumasalungat sa Diyos. Ang hindi pagpapalawak sa pangunahing teksto ay umiiwas sa labis na interpretasyon.
- issue: Genitibo sa ἡ ἀγάπη τοῦ πατρὸς
  choice: pag-ibig sa Ama
  alternative: pag-ibig ng Ama
  rationale: Ang agarang pagsalungat sa pag-ibig sa sanlibutan ay mas pumapabor sa pag-ibig ng tao para sa Ama, ngunit maaaring mangahulugan ang anyong Griyego ng pag-ibig na nagmumula sa Ama. Hayagang pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago at malinaw na Tagalog na may dignified na himig. Ginamit ang “sanlibutan” bilang kinikilalang terminong biblikal ngunit iniwasan ang mas mabigat o sektaryang pagpapaliwanag. Ang “sa kanya” ay natural na pangkalahatang pagtukoy at hindi nagdaragdag ng kasarian na hindi kailangan sa Tagalog.
