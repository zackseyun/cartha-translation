base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: tl
  text: Ang nagsasabing siya ay nasa liwanag at napopoot sa kanyang kapatid ay nasa kadiliman hanggang ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Greek, masculine singular ang salitang isinaling “kapatid,” ngunit maaari itong kumatawan sa kapatid na lalaki o babae sa ganitong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ang nagsasabing
  rationale: Ang artikulo at pangkasalukuyang pandiwaring Greek ay tumutukoy sa isang kinatawang tao at nagpapahiwatig ng patuloy o kinagawiang pag-aangkin.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: siya ay nasa liwanag
  rationale: Pinananatili ang metaporikong larawang Johannine at isinasalin sa likas na kayariang Filipino ang infinitive na nakasalalay sa pandiwa ng pagsasalita.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: kanyang kapatid
  rationale: Ang “kapatid” ay likas na salitang Filipino na hindi nagtatakda ng kasarian; matapat nitong naihahatid ang ugnayang tinutukoy ng ἀδελφός nang hindi ipinapasok sa pangunahing teksto ang mas interpretibong “kapwa mananampalataya.”
- source_word: μισῶν
  choice: napopoot
  rationale: Ang pangkasalukuyang anyo ay nagpapakita ng nagpapatuloy o kinagawiang saloobin; natural itong naipahahayag ng “napopoot.”
- source_word: ἐν τῇ σκοτίᾳ
  choice: nasa kadiliman
  rationale: Pinananatili nito ang tahasang kaagapay at pagsalungat sa “nasa liwanag,” pati ang mahalagang larawang liwanag-kadiliman sa sulat.
- source_word: ἕως ἄρτι
  choice: pa rin hanggang ngayon
  rationale: Ang “hanggang ngayon” ay tuwirang nagpapahayag ng pagpapatuloy hanggang sa kasalukuyan, habang nililinaw ng “pa rin” na hindi binago ng pag-aangkin ang tunay na kalagayan ng tao.
theological_decisions:
- issue: Saklaw ng ἀδελφός sa isang kinatawang pangungusap tungkol sa asal
  choice: kapatid
  alternative: kapwa mananampalataya; kapatid na lalaki
  rationale: Hindi minamarkahan ng salitang Filipino na “kapatid” ang kasarian, kaya natural nitong napapanatili ang posibleng kinatawang saklaw ng masculine singular sa Greek. Ang “kapwa mananampalataya” ay maaaring tama sa konteksto ngunit mas interpretibo, samantalang ang “kapatid na lalaki” ay maaaring maging higit na makitid kaysa sa nilalayong etikal na saklaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang magkatapat na larawang “liwanag” at “kadiliman.” Ginamit ang “ngunit” upang malinaw at natural na ihayag ang salungatan, at ang “pa rin hanggang ngayon” upang mapanatili ang diin ng ἕως ἄρτι.
