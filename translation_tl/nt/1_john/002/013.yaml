source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: tl
  text: Sumusulat ako sa inyo, mga ama, sapagkat nakilala na ninyo siyan[g] mula pa sa pasimula[a]. Sumusulat ako sa inyo, mga kabataang lalaki, sapagkat nadaig na ninyo ang Masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang isang mula pa sa pasimula.” Malamang na ang Anak ang tinutukoy ng parirala, bagaman inuunawa ito ng ilan bilang mas malawak na pagtukoy sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: Sumusulat ako
  rationale: Likas na ipinahahayag sa Filipino ng aspektong imperpektibo ang kasalukuyang gawaing pagsulat sa konteksto ng liham, habang pinananatili ang pag-uulit ng pandiwa.
- source_word: πατέρες
  choice: mga ama
  rationale: Tuwirang pinananatili ang panawagang panlalaking maramihan; hindi ito tahasang binibigyang-kahulugang mga nakatatandang lalaki o mga may sapat na gulang sa pananampalataya.
- source_word: ἐγνώκατε
  choice: nakilala na ninyo
  rationale: Ipinahihiwatig ng perpektong anyo ang pagkakilalang naganap na at nananatili ang bunga; ang 'na' ay natural na paraan sa Filipino upang maipakita ito nang hindi dinaragdagan ang teksto.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ang nasa pasimula
  rationale: Pinananatili ang substantibong parirala at ang sadyang di-pagbanggit sa pangalan ng tinutukoy. Mas natural ito sa Filipino kaysa sa mabigat na 'siya na mula sa pasimula,' at hindi nito tahasang nilulutas kung ang tinutukoy ay ang Anak o ang Diyos.
- source_word: νεανίσκοι
  choice: mga kabataang lalaki
  rationale: Pinananatili ang panlalaking kahulugan ng pangngalang maramihan at malinaw na ipinakikitang hindi lamang pangkalahatang 'mga kabataan' ang tawag.
- source_word: νενικήκατε
  choice: nadaig na ninyo
  rationale: Ang 'nadaig' ay natural at malinaw na katumbas ng tagumpay laban sa isang kalaban; ipinakikita ng 'na' ang tagumpay na natamo na at may nagpapatuloy na bisa.
- source_word: τὸν πονηρόν
  choice: ang Masama
  rationale: Ang anyong panlalaking substantibo ay pinakamalamang na tumutukoy sa isang personal na masamang kalaban. Ang malaking titik ay tumutulong ipakitang persona ang tinutukoy nang hindi idinaragdag ang pangalang Satanas.
theological_decisions:
- issue: Tinutukoy ng τὸν ἀπ’ ἀρχῆς
  choice: Iniwan bilang 'ang nasa pasimula,' nang hindi tahasang pinapangalanan ang tinutukoy
  alternative: Tahasan itong tukuyin bilang Anak/Mesiyas, o mas malawak bilang Diyos
  rationale: Malakas ang pahiwatig sa mga sulat ni Juan na maaaring ang Anak ang tinutukoy, ngunit hindi siya pinangalanan ng Griyego sa talatang ito. Pinananatili ng salin ang tunay na kalabuan.
- issue: Kahulugan ng τὸν πονηρόν
  choice: 'Isang personal na masamang kalaban: ''ang Masama'''
  alternative: Abstraktong kasamaan
  rationale: Ang panlalaking isahan na artikulo at pang-uring ginamit bilang pangngalan ay higit na pumapabor sa personal na tinutukoy, ngunit hindi idinaragdag ang pangalang hindi nakasulat sa Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkatulad na ayos ng dalawang pangungusap at ang mga tuwirang panawagang 'mga ama' at 'mga kabataang lalaki.'
