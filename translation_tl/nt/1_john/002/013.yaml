    rationale: Ang “nasa” ay lokatibo (“located at”), hindi katumbas ng ἀπό (“from/since”). Nawawala rin ang personal na panlalaking pahiwatig na nasa τὸν.
  revised_text: Sumusulat ako sa inyo, mga ama, sapagkat nakilala na ninyo siyan[g] mula pa sa pasimula[a]. Sumusulat ako sa inyo, mga kabataang lalaki, sapagkat nadaig na ninyo ang Masama.
