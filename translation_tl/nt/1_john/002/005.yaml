id: 1JN.2.5
reference: 1 John 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: tl
  text: 'Ngunit ang sinumang tumutupad sa kanyang salita, tunay na sa taong iyon[a] ay naging ganap ang pag-ibig ng Diyos[b]. Sa pamamagitan nito ay nalalaman nating tayo ay nasa kanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa bagay na ito” o, mas literal, “sa isang ito.” Maaaring tumukoy ang pariralang Griyego sa taong tumutupad sa kanyang salita o sa mismong pagtupad bilang katibayan.
    reason: alternative_reading
  - marker: b
    text: Ang “pag-ibig ng Diyos” ay maaaring mangahulugang pag-ibig ng Diyos na kumikilos sa mananampalataya o pag-ibig ng mananampalataya para sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Ngunit ang sinumang
  rationale: Ipinahahayag ng ὃς ἂν ang isang pangkalahatang kondisyon—“ang sinumang”—samantalang pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ sa naunang pahayag.
- source_word: τηρῇ
  choice: tumutupad
  rationale: Sa kontekstong ito, ang τηρέω ay tumutukoy sa patuloy na pag-iingat at pagsunod sa sinabi; likas sa makabagong Tagalog ang “tumutupad” at hindi nito nililimitahan ang diwa sa panlabas na pagsunod lamang.
- source_word: αὐτοῦ τὸν λόγον
  choice: sa kanyang salita
  rationale: Pinananatili ng “salita” ang isahan at ang malawak na diwa ng λόγος bilang ipinahayag na salita o mensahe, pati ang karaniwang bokabularyong Juanino.
- source_word: ἀληθῶς
  choice: tunay na
  rationale: Tuwirang pinananatili nito ang pagpapatibay na ipinahahayag ng pang-abay.
- source_word: ἐν τούτῳ
  choice: sa taong iyon
  rationale: Maaaring tukuyin ng demonstratibo ang taong tumutupad sa salita. Ginagawang natural at malinaw ito sa Tagalog, habang inilalagay sa talababa ang posibleng di-personal na pagbasa.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ang pag-ibig ng Diyos
  rationale: 'Pinananatili ng pariralang ito ang tunay na kalabuan ng genitibo: maaaring pag-ibig ng Diyos na kumikilos sa mananampalataya o pag-ibig ng mananampalataya para sa Diyos.'
- source_word: τετελείωται
  choice: ay naging ganap
  rationale: Ipinahahayag nito ang kalagayang ganap na bunga ng natapos na pagkilos, alinsunod sa perfect passive, at pinananatili ang diwa ng pag-ibig na naihatid sa kaganapan.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Sa pamamagitan nito ay nalalaman natin
  rationale: Natural nitong ipinahahayag ang batayan o katibayang ipinakikilala ng karaniwang pormulang Juanino.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: tayo ay nasa kanya
  rationale: Pinananatili ng “nasa kanya” ang mahalagang pariralang Juanino tungkol sa kaugnayan at pananatili nang hindi ito pinalalawak sa isang mas interpretatibong paliwanag.
theological_decisions:
- issue: Kahulugan ng genitibo sa ἡ ἀγάπη τοῦ θεοῦ
  choice: ang pag-ibig ng Diyos
  alternative: pag-ibig ng Diyos sa mananampalataya; pag-ibig ng mananampalataya para sa Diyos
  rationale: Kapwa sinusuportahan ng balarila at kontekstong Juanino ang dalawang ugnayan. Pinananatili sa pangunahing teksto ang kalabuan sa halip na magtakda ng iisang teolohikal na pagbasa.
- issue: Tinutukoy ng unang ἐν τούτῳ
  choice: sa taong iyon
  alternative: sa bagay na ito
  rationale: Malamang na tumutukoy ito sa sinumang tumutupad sa salita, ngunit maaari ring ituring na ang mismong pagtupad ang katibayan o kalagayan. Pinili ang personal na pagbasa para sa likas na Tagalog at pinanatili sa talababa ang alternatibo.
- issue: Tinutukoy ng αὐτοῦ sa “kanyang salita” at “nasa kanya”
  choice: kanya
  alternative: tahasang “Diyos” o “Cristo”
  rationale: Hindi tahasang inuulit ng Griyego ang pangalan ng tinutukoy. Pinananatili ng panghalip ang pagkakaugnay ng talata at iniiwasang lutasin nang higit sa pinagmulan ang maaaring usaping reperensiyal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tumutupad” sa halip na mas teknikal o makalumang “nag-iingat,” at pinanatili ang mga susing pariralang Juanino na “salita,” “pag-ibig ng Diyos,” at “nasa kanya.”
