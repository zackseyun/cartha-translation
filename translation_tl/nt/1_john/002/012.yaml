base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: tl
  text: Sumusulat ako sa inyo,[a] mga munting anak, sapagkat[b] pinatawad na ang inyong mga kasalanan alang-alang sa kanyang[c] pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sumusulat ako sa inyo.” Ang kasalukuyang panahunan sa Griyego ay maaaring ipahayag bilang payak na kasalukuyan o bilang kasalukuyang nagaganap sa konteksto ng liham.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na.” Maaaring ipakilala ng salitang Griyego ang nilalaman ng sinusulat, bagaman sa kontekstong ito ay malamang na ipinahahayag nito ang dahilan ng pagsulat.
    reason: alternative_reading
  - marker: c
    text: Hindi tahasang sinasabi rito kung ang “kanyang” ay tumutukoy sa Diyos o kay Jesus; iniiwan itong di-tiyak ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Sumusulat ako
  rationale: Likas sa Filipino ang aspektong nagaganap para sa kasalukuyang pagsulat ng liham; maaari rin itong unawain bilang payak na “Isinusulat ko.”
- source_word: τεκνία
  choice: mumunti kong mga anak
  rationale: Pinananatili nito ang magiliw at pampamilyang himig ng diminutibo, hindi lamang isang pagtukoy sa murang edad.
- source_word: ὅτι
  choice: sapagkat
  rationale: Sa daloy ng talata, malamang na ipinakikilala nito ang dahilan ng pagsulat, bagaman maaari rin itong magpakilala ng nilalaman.
- source_word: ἀφέωνται
  choice: pinatawad na
  rationale: Ipinahahayag ng perpektong pasibo ang naganap nang pagpapatawad na may nananatiling bunga.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: ang inyong mga kasalanan
  rationale: Natural na ipinahahayag sa Filipino ang kaugnayan ng datibong ὑμῖν bilang pag-aaring “inyong” sa pahayag tungkol sa pagpapatawad.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: alang-alang sa kanyang pangalan
  rationale: Ipinapakita ng διά na may akusatibo ang dahilan o batayan, habang pinananatili ng “pangalan” ang personal at teolohikal na bigat ng idyomang biblikal.
theological_decisions:
- issue: Tinutukoy ng “kanyang” sa “kanyang pangalan”
  choice: Hindi tahasang kinilala sa pangunahing teksto
  alternative: Ang Diyos o si Jesus
  rationale: Hindi pinangalanan sa mismong pangungusap ang tinutukoy ng panghalip; pinananatili ang tunay na kalabuan sa halip na magpasok ng isang tiyak na interpretasyon.
- issue: Gamit ng ὅτι
  choice: 'Dahilan: “sapagkat”'
  alternative: 'Nilalaman: “na”'
  rationale: Mas angkop sa padron ng diskurso ang pagbibigay ng dahilan ng pagsulat, ngunit kinikilala sa talababa ang posibleng pagbasa bilang nilalaman.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ang “mumunti kong mga anak” ay sadyang magiliw at pampamilya; ang “alang-alang sa kanyang pangalan” ay nagpapanatili sa idyomang biblikal nang hindi nilulutas ang di-tahasang tinutukoy ng panghalip.
