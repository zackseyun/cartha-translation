  source_fidelity: 'Tumpak ang pangunahing salin sa lahat ng pangunahing elemento: ang patuloy na paglipas ng κόσμος, ang kaugnay nitong ἐπιθυμία, ang pangkalahatang taong gumagawa ng kalooban ng Diyos, at ang pananatili magpakailanman. Gayunman, hindi tama ang mga talababa sa pagkakakabit sa mga salitang tinutukoy nila: ang marker [a] ay nasa “mundo” ngunit tumatalakay sa kahaliling salin ng παράγεται sa English audit trail, at ang marker [b] ay nasa “pagnanasa nito” ngunit ang katapat nitong English note ay para sa μένει. Ang rebisyon ay nagtatama ng mga angkla at pinananatili ang kahulugan.'
  naturalness: Natural at marangal ang “At lumilipas ang mundo at ang pagnanasa nito; ngunit ang gumagawa ng kalooban ng Diyos ay nananatili magpakailanman.” Mas tuwiran ang pag-uugnay sa pamamagitan ng “at” kaysa “pati,” na maaaring bahagyang magpahiwatig na ikinabit lamang bilang dagdag sa halip na magkatambal na lumilipas ang mundo at ang pagnanasa nito.
  terminology: Ang “mundo,” “pagnanasa,” “kalooban ng Diyos,” “nananatili,” at “magpakailanman” ay angkop na modernong Filipino at pinananatili ang lawak ng mga terminong Griyego. Hindi kailangang ipalit ang mas makitid na “kahalayan” para sa ἐπιθυμία o ang mas teknikal na pananalita tungkol sa buhay na walang hanggan.
