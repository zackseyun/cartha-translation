  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: tl
  text: At lumilipas ang mundo[a] at ang pagnanasa nito; ngunit ang gumagawa ng kalooban ng Diyos ay nananatili[b] magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “lumipas.” Ipinahihiwatig ng pandiwang Griyego ang isang patuloy na paglipas o pagkawala.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Griyego ay madalas ding isinasaling “naninirahan” o “nananaig” sa ilang salin, ngunit ang “nananatili” ay mas malinaw sa kontemporaryong Filipino sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: mundo
  rationale: Karaniwan at malinaw itong katumbas sa modernong Filipino. Sa konteksto ng 1 Juan 2:15–16, tumutukoy ito sa daigdig ng mga pagpapahalaga at pagnanasang salungat sa Diyos, hindi lamang sa pisikal na sangnilikha; pinananatili ng saling “mundo” ang lawak ng salitang Griyego.
- source_word: παράγεται
  choice: lumilipas
  rationale: Ipinahihiwatig ng pangkasalukuyang anyo ang patuloy na pagkawala o pagdaan ng mundo. Natural sa Filipino ang “lumilipas” at pinananatili nito ang diwa ng pagiging pansamantala.
- source_word: ἐπιθυμία
  choice: pagnanasa
  rationale: Nagsasaad ito ng matinding pagnanais na negatibo sa kontekstong ito. Mas malawak ang “pagnanasa” kaysa “kahalayan” at hindi nito nililimitahan ang kahulugan sa seksuwal na pagnanasa.
- source_word: αὐτοῦ
  choice: nito
  rationale: Tumutukoy ang panghalip sa mundo. Ang “nito” ang natural na di-personal na anyo sa Filipino.
- source_word: ὁ δὲ ποιῶν
  choice: ngunit ang gumagawa
  rationale: Inilalarawan ng substantibong participle ang taong kinikilala sa paggawa ng kalooban ng Diyos. Pinananatili ng “ang gumagawa” ang pang-isahang kinatawang diwa nang hindi gumagamit ng lipas na pananalita.
- source_word: θέλημα
  choice: kalooban
  rationale: Ang “kalooban” ang kinikilalang natural at makabuluhang katumbas ng θέλημα kapag tumutukoy sa layunin o nais ng Diyos.
- source_word: μένει
  choice: nananatili
  rationale: Malinaw na ipinapahayag nito ang patuloy at matatag na pag-iral. Iniiwasan nito ang mas di-natural na literalismong “nananahan” sa kontekstong ito.
- source_word: εἰς τὸν αἰῶνα
  choice: magpakailanman
  rationale: Ito ang natural na idyomatikong Filipino para sa walang-hanggang pagpapatuloy na ipinahihiwatig ng parirala sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng κόσμος sa konteksto ni Juan
  choice: “mundo,” na sa konteksto ay ang pansamantala at makasalanang kaayusang salungat sa Diyos
  alternative: ang pisikal na sangnilikha lamang
  rationale: Inilalarawan ng naunang talata ang mundo sa pamamagitan ng masasamang pagnanasa at pagmamapuri. Hindi pinakikitid ng pangunahing teksto ang salita, ngunit nililinaw ng konteksto at talababa ang etikal na diwa nito.
- issue: Diwa ng μένει εἰς τὸν αἰῶνα
  choice: ang gumagawa ng kalooban ng Diyos ay nananatili magpakailanman
  alternative: hayagang gawing teknikal na pahayag tungkol sa buhay na walang hanggan
  rationale: Tahasang sinasabi ng Griyego ang permanenteng pananatili ngunit hindi nito ipinapaliwanag sa talatang ito ang buong doktrinal na mekanismo. Kaya pinananatili ng salin ang bigat at tensiyon ng pahayag nang walang idinadagdag.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mundo” sa halip na mas makalumang “sanlibutan,” at “nananatili” sa halip na mas eklesyastikong “nananahan.”
