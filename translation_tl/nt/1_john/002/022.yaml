source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: tl
  text: Sino ang sinungaling kundi ang tumatangging si Jesus ay hindi ang Mesiyas? Ito ang anticristo—ang tumatanggi sa Ama at sa Anak.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang salitang Griyego na ὁ χριστός ay isang titulo rito, kaya isinaling “ang Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: 'O “anticristo.” May tiyak na artikulo ang Griyego: “ang anticristo.” Sa mga sulat ni Juan, maaari ring tumukoy ang katawagang ito sa uri ng kalabang nakikilala sa pagtanggi sa Ama at sa Anak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: ang sinungaling
  rationale: Tiyak ang pangngalan dahil sa artikulong ὁ, at inilalarawan nito ang taong kinikilalang huwaran ng kasinungalingan sa kontekstong ito.
- source_word: ἀρνούμενος
  choice: ang tumatanggi
  rationale: Ang pangkasalukuyang participle ay ginamit bilang pangngalan at nagpapahayag ng patuloy o katangiang pagtanggi.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: si Jesus ang Mesiyas
  rationale: Sa Filipino, ang pandiwang 'tumatanggi' ay likas na nagpapahiwatig na itinatatwa ang kasunod na pahayag; kaya ang 'tumatangging si Jesus ang Mesiyas' ay tumpak na naghahatid ng nilalaman ng pagtanggi nang hindi gumagamit ng di-likas na dobleng pagkakaila.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo, kaya isinalin itong 'Mesiyas' upang mapanatili ang mesiyanikong kahulugan nito.
- source_word: ὁ ἀντίχριστος
  choice: ang anticristo
  rationale: Pinananatili ng tiyak na artikulong 'ang' ang pagkakakilanlang ipinahahayag ng Griyego, habang hindi nililimitahan kung ito ay isang natatanging persona lamang o isang uri ng kalaban.
- source_word: οὗτός ἐστιν
  choice: Siya ang
  rationale: Tumutukoy ang demonstratibo sa taong kababanggit lamang; natural at tuwiran sa Filipino ang 'Siya ang'.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: sa Ama at sa Anak
  rationale: Ang malalaking titik ay nagpapakitang tumutukoy ang mga katawagan sa Diyos Ama at sa Anak sa relasyong Johannine.
theological_decisions:
- issue: Paglalarawan kay Jesus bilang ὁ χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit dito, kaya inililitaw ng 'Mesiyas' ang pahayag na si Jesus ang ipinangakong pinahiran, sa halip na tratuhin ang salita bilang bahagi lamang ng pangalan.
- issue: Saklaw ng ὁ ἀντίχριστος
  choice: ang anticristo
  alternative: isang anticristo
  rationale: Pinananatili ang tiyak na anyo ng Griyego ngunit hindi ipinapasiya kung tumutukoy ito sa iisang pangwakas na persona o sa kinatawan/uri ng kalabang inilalarawan sa mga sulat ni Juan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tumatangging si Jesus ang Mesiyas' upang maiwasan ang alanganing dobleng pagkakaila habang pinananatili ang eksaktong nilalaman ng Griyegong sugnay.
