  terminology: Ang “utos,” “mula pa sa simula,” at “salita” ay angkop. Ang “lumang utos” ang mas malinaw na katapat ng παλαιὰ at mas pinananatili ang pagsalungat sa “bagong utos”; hindi nito kinakailangang ipahiwatig na lipas na ang utos sa kontekstong ito.
