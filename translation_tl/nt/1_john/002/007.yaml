- from: Mga minamahal, hindi isang bagong utos ang isinusulat ko sa inyo, kundi isang dating utos na taglay na ninyo mula pa sa simula. Ang dating utos ay ang salita[a] na narinig ninyo.
  to: Mga minamahal, hindi ako sumusulat sa inyo ng bagong utos, kundi ng lumang utos na taglay na ninyo mula pa sa simula. Ang lumang utos ay ang salita[a] na narinig ninyo.
  rationale: Pinalitan ang “dating utos” ng “lumang utos” upang malinaw na maipakita ang hayagang pagsalungat ng παλαιά sa καινή (“luma” at “bago”). Inayos din ang ayos ng unang pangungusap para sa mas likas na modernong Filipino. Pinanatili ang “salita,” kasama ang talababa para sa “mensahe,” upang hindi ipasiya nang labis ang saklaw ng λόγος.
