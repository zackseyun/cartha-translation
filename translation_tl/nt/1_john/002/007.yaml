id: 1JN.2.7
reference: 1 John 2:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: tl
  text: Mga minamahal, hindi ako sumusulat sa inyo ng bagong utos, kundi ng lumang utos na taglay na ninyo mula pa sa simula. Ang lumang utos ay ang salita[a] na narinig ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mensahe”: “Ang lumang utos ay ang mensaheng narinig ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Likas at marangal na anyo ng mapagmahal na pagtawag sa maramihan; pinananatili rin nito ang ugnayang leksikal sa pag-ibig.
- source_word: ἐντολήν
  choice: utos
  rationale: Karaniwang makabagong salin na malinaw sa ordinaryong mambabasa at sapat na nagpapanatili sa bigat ng terminong Johannine.
- source_word: καινήν
  choice: bago
  rationale: Tuwirang katumbas na nagpapanatili sa hayagang pagsalungat nito sa παλαιάν.
- source_word: γράφω
  choice: ang isinusulat ko
  rationale: Ipinakikita ng aspektong nagaganap ang kasalukuyang gawain ng may-akda sa liham.
- source_word: παλαιάν / παλαιά
  choice: dating
  rationale: Sa kontekstong ito, ang diin ay utos na mayroon na sila mula sa simula, hindi utos na lipas na; mas natural ang 'dating' kaysa 'lumang' para sa utos.
- source_word: εἴχετε
  choice: taglay na ninyo
  rationale: Ipinahihiwatig ang nagpapatuloy na pag-aari mula sa nakaraan; ang 'na' ay likas na naghahatid ng diwang matagal na nila itong taglay.
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili ang sadyang hindi tinukoy na saklaw ng pariralang Johannine; ang 'pa' ay natural na nagpapakita ng pagpapatuloy.
- source_word: λόγος
  choice: salita
  rationale: Pinananatili ang pangunahing leksikal na anyo at posibleng resonansiyang Johannine, habang ang konteksto ay nagpapakitang tumutukoy ito sa narinig na ipinahayag na nilalaman.
- source_word: ἠκούσατε
  choice: narinig ninyo
  rationale: Tuwirang salin ng aorist na tumutukoy sa pagtanggap nila noon sa ipinahayag na salita.
theological_decisions:
- issue: Tinutukoy ng 'mula pa sa simula'
  choice: Hindi tinukoy kung anong simula; pinanatili bilang 'mula pa sa simula'.
  alternative: Mula nang magsimula kayong sumampalataya / mula nang unang ipahayag ang ebanghelyo
  rationale: Mas malamang sa agarang konteksto ang simula ng kanilang pagkarinig, ngunit hindi iyon tahasang nililimitahan ng Griyego; pinananatili ang lawak at tensiyon ng pananalita ni Juan.
- issue: Pagkakakilanlan ng dating utos at ng λόγος
  choice: Tuwirang itinumbas ang dating utos sa 'salita na narinig ninyo'.
  alternative: Ipaliwanag bilang mensahe ng ebanghelyo o utos na magmahalan
  rationale: Hindi dinaragdagan ng talata ang pagkakakilanlang ito ng paliwanag mula sa kalapit na mga talata; iniiwasang ipasok sa salin ang isang partikular na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Mga minamahal' bilang mainit ngunit hindi masyadong kolokyal na pagtawag, at 'dating utos' upang maiwasan ang maaaring negatibong pahiwatig ng 'lumang utos.'
