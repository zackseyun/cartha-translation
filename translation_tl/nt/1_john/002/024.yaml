source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: tl
  text: Kayo naman[a], hayaang manatili sa inyo ang narinig ninyo mula pa sa simula. Kung mananatili sa inyo ang narinig ninyo mula pa sa simula[b], mananatili rin kayo sa Anak at sa Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang narinig ninyo mula pa sa simula”; malamang na tumutukoy ang parirala sa unang mensahe ng mga apostol tungkol sa Anak.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mananatili” ay salin ng iisang pandiwang Griyego na paulit-ulit na ginamit sa talatang ito; maaari rin itong isalin na “mamamalagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kayo naman
  rationale: Ang tahasang panghalip sa unahan ay may diin at nagpapakita ng paghahambing sa mga naunang binanggit. Likas sa modernong Tagalog ang “Kayo naman” bilang panandang paksa at kaibahan.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ang narinig ninyo mula pa sa simula
  rationale: Pinananatiling malawak ng “ang narinig ninyo” ang di-tiyak na tinutukoy ng neuter relative na ὃ, sa halip na idagdag sa pangunahing teksto ang interpretatibong “mensahe” o “ebanghelyo.”
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili nito ang karaniwang pananalitang Juanino at ang diwa ng pagpapatuloy mula sa unang pagtanggap nila rito.
- source_word: ἐν ὑμῖν μενέτω
  choice: hayaang manatili sa inyo
  rationale: Ipinahahayag ng anyong pautos ang patuloy na pagpapamalagi. Ang “manatili” ay malinaw, kasalukuyan, at maaaring gamitin nang pare-pareho sa lahat ng paglitaw ng μένω sa talata.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Kung mananatili sa inyo
  rationale: Natural na ipinahahayag ng “kung” at panghinaharap na anyong “mananatili” ang kundisyon sa Tagalog, habang pinananatili ang pag-uulit ng parehong pandiwa.
- source_word: καὶ ὑμεῖς
  choice: mananatili rin kayo
  rationale: Ang “rin” ay naghahatid ng kahulugan ng καί na “also,” at ang tahasang “kayo” ay nagpapanatili sa diin ng panghalip.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: sa Anak at sa Ama
  rationale: Ang “sa” ay inuulit upang mapanatili ang parallel na kaugnayan sa Anak at sa Ama, ayon sa pag-uulit ng ἐν sa Griyego.
- source_word: μενεῖτε
  choice: mananatili
  rationale: Tuwirang isinasalin ang future indicative at pinananatili ang malinaw na ugnayang leksikal sa naunang mga anyo ng μένω.
theological_decisions:
- issue: Kalikasan ng kundisyon at pangako sa huling sugnay
  choice: Isalin nang tuwiran bilang “mananatili rin kayo sa Anak at sa Ama.”
  alternative: Gawing isang payo lamang, o ipaliwanag bilang patunay ng isang tiyak na doktrina tungkol sa pagtitiyaga.
  rationale: Ang Griyego ay naghahayag ng kinalabasang nakaugnay sa kundisyon. Pinananatili ng salin ang tensiyong ito nang hindi ipinapasok ang isang denominasyonal na paliwanag.
- issue: Tinutukoy ng “ang narinig ninyo mula pa sa simula”
  choice: Panatilihing pangkalahatan ang parirala sa pangunahing teksto.
  alternative: Tukuyin ito bilang “ebanghelyo” o “turo ng mga apostol.”
  rationale: Bagaman malakas na ipinahihiwatig ng konteksto ang unang pahayag ng mga apostol tungkol sa Anak, kamag-anak na panghalip lamang ang ginamit sa Griyego; kaya hindi ito dapat paliitin sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Kayo naman” upang ihatid ang contrastive emphasis, at “manatili” nang pare-pareho para sa μένω. Iniwasan ang mas makaluma o mas mataas na rehistrong “manahan” at ang interpretatibong pagdaragdag ng “mensahe” sa pangunahing teksto.
