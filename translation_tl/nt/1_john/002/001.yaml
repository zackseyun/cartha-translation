id: 1JN.2.1
reference: 1 John 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: tl
  text: Mga anak ko, isinusulat ko sa inyo ang mga bagay na ito upang hindi kayo magkasala. Ngunit kung may magkasala, mayroon tayong Tagapagtanggol[a] sa piling ng Ama—si Jesus na Mesiyas[b], ang Matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na παράκλητος ay maaari ring unawain nang mas malawak bilang “katulong,” “tagapayo,” o “mang-aaliw.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “Cristo.” Ang titulong Griyego na Χριστός ay maaaring mangahulugang “Mesiyas” o gamitin na parang bahagi ng pangalang “Jesus Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Mga anak ko
  rationale: Pinananatili nito ang magiliw at pampamilyang pagtawag. Ang mas literal na “mumunti kong mga anak” ay hindi likas sa makabagong Tagalog at maaaring magpahiwatig lamang ng murang edad.
- source_word: ταῦτα γράφω ὑμῖν
  choice: isinusulat ko sa inyo ang mga bagay na ito
  rationale: Likas sa liham ang aspektong nagaganap ng γράφω, at malinaw na pinananatili ng “ang mga bagay na ito” ang hindi tiyak na saklaw ng ταῦτα.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: upang hindi kayo magkasala
  rationale: Tuwirang ipinahahayag ang layunin ng ἵνα nang hindi ginagawang ganap na pahayag na hindi na maaaring magkasala ang mga mambabasa.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Ngunit kung may magkasala
  rationale: Sa konteksto, ang καὶ ay may bahagyang panalungat na puwersa. Pinananatili ng kondisyon ang posibilidad ng pagkakasala nang hindi ito ipinapalagay na tiyak.
- source_word: παράκλητον
  choice: Tagapagtanggol
  rationale: Sa konteksto ng pagharap sa Ama, pinakamalinaw nitong naihahatid ang kinatawan o tagapagtanggol na kumikilos para sa iba, habang inilalahad sa talababa ang mas malawak na saklaw ng salita.
- source_word: πρὸς τὸν πατέρα
  choice: sa piling ng Ama
  rationale: Ipinahihiwatig nito ang presensiya at malapit na kaugnayan sa Ama, hindi lamang direksiyon o lokasyong “sa harap” niya.
- source_word: Ἰησοῦν Χριστὸν
  choice: si Jesus na Mesiyas
  rationale: Dito ay malinaw na pamagat ang Χριστός. Ang “na Mesiyas” ay natural sa Tagalog at iniiwasang magtunog na apelyido ang titulo.
- source_word: δίκαιον
  choice: ang Matuwid
  rationale: Ginagawang appositional na paglalarawan ang pang-uri, ayon sa pagkakaugnay nito kay Jesus sa Griyego, at pinananatili ang bigat nitong kristolohikal.
theological_decisions:
- issue: Posibleng pahiwatig ng ganap na kawalan ng kasalanan sa ἵνα μὴ ἁμάρτητε
  choice: 'Panatilihin bilang layunin: “upang hindi kayo magkasala”'
  alternative: Isalin bilang pahayag na hindi na magkakasala ang mga mambabasa
  rationale: 'Ang kasunod na kondisyong “kung may magkasala” ay nagpapanatili sa tensiyon ng teksto: layunin ang hindi pagkakasala, ngunit kinikilala ang posibilidad ng pagkabigo.'
- issue: Pagpapakahulugan sa Χριστός bilang titulo o bahaging parang pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang pagkakasunod na paglalarawang “ang Matuwid” ay umaayon sa pagbasa sa Χριστός bilang titulo. Nasa talababa ang tradisyonal na “Cristo” upang mapanatili ang lehitimong alternatibo.
- issue: Saklaw ng παράκλητος
  choice: Tagapagtanggol
  alternative: katulong, tagapayo, o mang-aaliw
  rationale: Pinakamalakas sa kontekstong ito ang diwang kumakatawan at nagtatanggol sa harap ng Ama, ngunit hindi isinasara ng talababa ang mas malawak na semantikong saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mga anak ko” bilang natural na magiliw na pagtawag; iniwasan ang literal ngunit alanganing “mumunti kong mga anak.” Ang “sa piling ng Ama” ay nagpapahayag ng presensiya at ugnayan, at ang “Tagapagtanggol” ay madaling maunawaan habang pinananatili sa talababa ang lawak ng παράκλητος.
