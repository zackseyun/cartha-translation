base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: tl
  text: Ang sinumang nagsasabing nananatili siya sa kanya ay dapat ding mamuhay gaya ng pamumuhay ng taong iyon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “taong iyon” ay tumutukoy kay Jesus. Sa Griyego, ginamit ang mariing demonstratibong panghalip na maaaring isaling “ang isang iyon” o “ang taong iyon.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “lumakad gaya ng paglakad ng taong iyon.” Ang “lumakad” ay metapora sa Bibliya para sa paraan ng pamumuhay.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ang nagsasabing
  rationale: Pinananatili ang substantibong gamit ng articular participle bilang pagtukoy sa sinumang taong gumagawa ng ganitong pahayag, sa likas at pangkalahatang anyong Tagalog.
- source_word: ἐν αὐτῷ μένειν
  choice: nananatili siya sa kanya
  rationale: Ang “nananatili” ay madaling maunawaan at pinananatili ang mahalagang Johannine na diwa ng pagpapatuloy sa ugnayan; ang “sa kanya” ay hindi tahasang pinapangalanan ang tinutukoy ng panghalip.
- source_word: ὀφείλει
  choice: ay dapat
  rationale: Ipinahahayag ng “dapat” ang moral na pananagutan nang hindi ginagawang labis na legal o mas matindi kaysa sa Griyego.
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na naghahayag sa Tagalog ng pagkakatulad sa paraan o asal.
- source_word: ἐκεῖνος
  choice: niya
  rationale: Sa natural na Tagalog, malinaw sa konteksto na si Jesus ang huwaran. Ipinaliliwanag sa talababa ang reperensiya at ang mas mariing demonstratibong anyo ng Griyego.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: pamumuhay ... mamuhay
  rationale: Ang περιπατέω ay metapora para sa paraan ng pamumuhay. Mas natural at malinaw sa karaniwang modernong Tagalog ang “mamuhay” kaysa literal na “lumakad,” habang itinatala sa talababa ang orihinal na larawan.
- source_word: καὶ αὐτὸς
  choice: ding
  rationale: 'Ang enklitikong “ding” ay natural na naghahatid ng pandagdag at paghahambing na diin: ang taong nag-aangkin nito ay siya ring nararapat mamuhay nang gayon.'
theological_decisions:
- issue: Tinutukoy ng αὐτῷ at ἐκεῖνος
  choice: Panatilihin ang mga panghalip na “kanya” at “niya,” habang nililinaw sa talababa na si Jesus ang tinutukoy sa konteksto.
  alternative: Tahasang isalin na “kay Jesus” at “ni Jesus,” o gumamit ng malaking titik sa mga panghalip.
  rationale: Itinuturo ng konteksto kay Jesus ang mga panghalip, ngunit hindi Siya tahasang pinapangalanan sa Griyego. Ang pagpapanatili sa panghalip ay umiiwas sa tahimik na pagpapaliwanag sa mismong teksto, at ang walang malaking titik ay hindi nag-aangkat ng kombensiyong wala sa orihinal.
- issue: Metapora ng paglakad bilang asal sa buhay
  choice: Isalin sa teksto bilang “mamuhay” at ipaliwanag sa talababa ang literal na metaporang “lumakad.”
  alternative: Panatilihin sa pangunahing teksto ang “lumakad.”
  rationale: Ang layunin ng metapora ay ang paraan ng pamumuhay. Sa modernong Tagalog, ang literal na “lumakad gaya ng paglakad niya” ay madaling mapagkamalang pisikal na kilos; ang dinamikong katumbas ay mas malinaw habang napapanatili sa talababa ang biblikal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “nananatili” upang mapanatili ang mahalagang bokabularyong Johannine, at ang “mamuhay” upang maihatid nang malinaw ang etikal na metapora sa ordinaryong mambabasa.
