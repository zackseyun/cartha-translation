revisions:
- from: Ngunit para sa inyo, ang pagpapahid na tinanggap ninyo mula sa kanya ay nananatili sa inyo, at hindi ninyo kailangang turuan kayo ng sinuman. Sa halip, kung paanong itinuturo sa inyo ng kanyang pagpapahid ang tungkol sa lahat ng bagay—at ito ay totoo at hindi kasinungalingan—at kung paanong itinuro nito sa inyo, manatili kayo sa kanya.[a][b]
  to: Ngunit kayo, ang pagpapahid na tinanggap ninyo mula sa kanya ay nananatili sa inyo, at hindi ninyo kailangan ang sinumang magturo sa inyo. Ngunit kung paanong itinuturo sa inyo ng kanyang pagpapahid ang tungkol sa lahat ng bagay, at ito ay totoo at hindi kasinungalingan, manatili kayo sa kanya ayon sa itinuro nito sa inyo.[a][b]
  rationale: Inayos ang maling sintaks sa sugnay tungkol sa pangangailangan ng pagtuturo. Ang “ayon sa itinuro nito sa inyo” ay isang natural na Filipino na paglalahad ng καθὼς ἐδίδαξεν ὑμᾶς at malinaw na inuugnay ang utos na manatili sa naunang pagtuturo ng “pagpapahid.” Napanatili ang tekstuwal na alternatibo sa talababa at ang pag-uulit ng μένω sa pangunahing teksto.
