reference: 1 John 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: tl
  text: Ngunit kayo, ang pagpapahid na tinanggap ninyo mula sa kanya ay nananatili sa inyo, at hindi ninyo kailangan ang sinumang magturo sa inyo. Ngunit kung paanong itinuturo sa inyo ng kanyang pagpapahid ang tungkol sa lahat ng bagay, at ito ay totoo at hindi kasinungalingan, manatili kayo sa kanya ayon sa itinuro nito sa inyo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “at kung paanong itinuro nito sa inyo, nananatili kayo sa kanya.”'
    reason: textual_variant
  - marker: b
    text: Iisang pandiwang Griyego ang isinaling “nananatili” sa unang bahagi at “manatili” sa hulihan ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: pagpapahid
  rationale: Pinananatili nito ang metapora ng Griyego nang hindi tahasang ipinapantay sa Banal na Espiritu o sa mensahe. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal o makalumang “pagpapahid ng langis,” habang hindi rin idinaragdag ang “langis,” na wala sa salita mismo.
- source_word: ἀπ’ αὐτοῦ
  choice: mula sa kanya
  rationale: Pinananatili ang panghalip ng Griyego at hinahayaang matukoy ang tinutukoy nito mula sa naunang konteksto, sa halip na tahasang idagdag ang “Banal,” “Diyos,” o “Cristo.”
- source_word: μένει ἐν ὑμῖν
  choice: nananatili sa inyo
  rationale: Natural sa modernong Filipino at pinananatili ang mahalagang pag-uulit ng μένω sa hulihan ng talata.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: hindi ninyo kailangang turuan kayo ng sinuman
  rationale: Malapit sa lakas at lawak ng pahayag sa Griyego. Hindi nito pinahihina ang sinabi o ginagawang tahasang doktrina laban sa lahat ng pagtuturo ng tao.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: turuan / itinuturo / itinuro
  rationale: Ginagamit ang magkakaugnay na anyo ng “turo” upang mapanatili ang pag-uulit at retorikal na ugnayan ng tatlong pandiwa.
- source_word: περὶ πάντων
  choice: ang tungkol sa lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng πάντων nang hindi ito nililimitahan sa isang paksa na hindi tahasang binanggit sa talata.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: ito ay totoo at hindi kasinungalingan
  rationale: Direktang pinananatili ang mariing Johannine na pagsalungat ng katotohanan at kasinungalingan.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: kung paanong itinuro nito sa inyo
  rationale: Ipinapakita ang paghahambing na ipinahihiwatig ng καθώς at tinutukoy ang “pagpapahid” sa pamamagitan ng neutral na “nito,” nang hindi ito ipinapakahulugan nang higit sa teksto.
- source_word: μένετε ἐν αὐτῷ
  choice: manatili kayo sa kanya
  rationale: Binabasa ang μένετε bilang pautos at pinananatili ang personal na panghalip na “kanya.” Ang “manatili” ay natural at inuugnay ito sa naunang “nananatili.”
theological_decisions:
- issue: Tinutukoy ng “pagpapahid” (χρῖσμα)
  choice: Pinanatili bilang “pagpapahid” sa pangunahing teksto.
  alternative: “Banal na Espiritu” o “mensahe/ebanghelyong tinanggap”
  rationale: Malamang na kaugnay ito ng presensiya at pagtuturo ng Espiritu, ngunit metapora ang mismong ginamit ng teksto. Ang tahasang pagtukoy rito bilang Espiritu o mensahe ay magpapasya sa isang interpretasyong hindi isinasaad ng salita mismo.
- issue: Saklaw ng “hindi ninyo kailangang turuan kayo ng sinuman”
  choice: Pinanatili ang pahayag ayon sa lakas ng Griyego nang walang paliwanag sa pangunahing teksto.
  alternative: Ganap na pagtanggi sa lahat ng gurong tao, o tiyak na pagtanggi lamang sa mga humiwalay na guro
  rationale: Hindi dapat dagdagan ang talata upang gawin itong ganap na pagbabawal sa pagtuturo ng tao, ngunit hindi rin dapat pahinain ang tuwirang pahayag. Ang konteksto ang dapat gumabay sa pagpapakahulugan.
- issue: Anyo ng huling μένετε
  choice: 'Pautos: “manatili kayo sa kanya.”'
  alternative: 'Pasalaysay: “nananatili kayo sa kanya.”'
  rationale: Ang anyong nakalimbag sa SBLGNT ay natural na nauunawaan bilang pautos sa kontekstong ito. Inilalagay sa talababa ang tekstuwal na alternatibo upang hindi maitago ang pagkakaiba ng mga manuskrito.
- issue: Tinutukoy ng αὐτῷ sa hulihan
  choice: “sa kanya,” na nagpapahiwatig ng personal na tinutukoy.
  alternative: “rito,” na tumutukoy sa pagpapahid
  rationale: Panlalaki ang panghalip sa Griyego at malamang na tumutukoy sa personal na naunang tinutukoy sa konteksto. Gayunman, hindi siya tahasang pinangalanan sa salin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagpapahid” upang mapanatili ang metapora nang walang denominasyonal na pagpapakahulugan. Ang balangkas na “kung paanong … at kung paanong …” ay bahagyang pormal ngunit sinasadyang panatilihin ang sintaktikong at teolohikal na tensiyon ng Griyego. Ang mga em dash ay tumutulong upang malinaw na mabasa ang parentetikong pagpapatunay na “ito ay totoo at hindi kasinungalingan.”
