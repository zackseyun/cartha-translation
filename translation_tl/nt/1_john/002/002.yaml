  source_fidelity: Ang pangunahing diwa ng ἱλασμός at ang malawak na saklaw ng “buong mundo” ay naipapahayag. Gayunman, ang “sa ating mga kasalanan” ay mas malabo kaysa sa likas na gamit na “para sa ating mga kasalanan,” at ang eliptikong τῶν ἡμετέρων ay dapat linawin bilang mga kasalanan upang hindi magmukhang ang handog ay para lamang sa mga tao mismo.
  naturalness: Natural ang “Siya mismo,” “hindi lamang … kundi pati,” at “buong mundo.” Mas malinaw at mas matatas sa modernong Tagalog ang pag-uulit ng “mga kasalanan” sa ikalawang bahagi ng paghahambing.
  terminology: Katanggap-tanggap ang “handog na pantubos” bilang madaling maunawaang katumbas ng “atoning sacrifice,” bagaman ang “pantubos” ay maaaring magpahiwatig ng ransom. Ang talababa ay dapat maglahad ng mga alternatibong leksikal nang hindi tahasang idinadagdag ang “Diyos,” na hindi pinapangalanan sa Griyego sa talatang ito.
  issues:
