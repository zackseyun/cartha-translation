  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: tl
  text: At siya mismo ang handog na pantubos para sa ating mga kasalanan[a]—hindi lamang para sa ating mga kasalanan kundi pati para sa mga kasalanan ng buong mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pampalubag-loob”; nauunawaan din ng ilan bilang “handog na nag-aalis ng kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Ipinapahayag ang mariing gamit ng αὐτός at binibigyang-diin ang personal na papel ni Jesus.
- source_word: ἱλασμός
  choice: handog na pantubos
  rationale: Likas at madaling maunawaang parirala sa modernong Tagalog na naghahatid ng diwang sakripisyal at nagbabayad-sala, nang hindi nilulutas sa pangunahing teksto ang pagtatalo sa pagitan ng propitiation at expiation.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: sa ating mga kasalanan
  rationale: Sa kaugnayan nito sa ἱλασμός, malinaw at natural nitong ipinahahayag kung ano ang tinutugunan ng handog.
- source_word: τῶν ἡμετέρων
  choice: sa atin
  rationale: Isinasalin ang elipsis ayon sa natural na gamit sa Tagalog; malinaw mula sa naunang parirala na ang tinutukoy ay ang ating mga kasalanan.
- source_word: ὅλου τοῦ κόσμου
  choice: sa buong mundo
  rationale: Pinananatili ang buong lawak ng ὅλου τοῦ κόσμου nang hindi ito nililimitahan ayon sa isang tiyak na sistemang teolohikal.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: hindi lamang ... kundi pati
  rationale: Natural na katumbas sa Tagalog na nagpapanatili sa magkaugnay na paghahambing at pagpapalawak ng Griyego.
theological_decisions:
- issue: Saklaw ng “buong mundo”
  choice: Panatilihin ang ganap na pahayag na “buong mundo.”
  alternative: “mga tao mula sa buong mundo” o “mga hinirang sa buong mundo”
  rationale: Hindi tahasang nililimitahan ng Griyego ang saklaw; pinananatili ng salin ang lawak at teolohikal na tensiyon ng pahayag.
- issue: Kahulugan ng ἱλασμός
  choice: Gamitin ang “handog na pantubos” sa pangunahing teksto.
  alternative: “handog na nagpapawi ng galit ng Diyos” o “handog na nag-aalis ng kasalanan”
  rationale: Ipinahahayag nito sa paraang madaling maunawaan ang sakripisyal na pagbabayad-sala, habang inilalagay sa talababa ang mahahalagang posibleng diin ng salita sa halip na pumili nang palihim sa isa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang em dash upang luminaw ang ikalawang sugnay at mapanatili ang diin ng paghahambing.
