    rationale: Ang περί kasunod ng ἱλασμός ay mas tuwirang naipapahayag ng “para sa.” Bukod dito, ang “sa atin” ay maaaring tumukoy sa mga tao sa halip na sa eliptikong “ating mga kasalanan”; ang paglalantad ng elipsis ay nagpapanatili ng malinaw na kahulugan.
  - severity: low
    issue: Ang talababa ay nagdaragdag ng “Diyos” sa alternatibong “propitiation.”
    rationale: Bagaman karaniwang inuunawa ang propitiation kaugnay ng galit ng Diyos, hindi tahasang binabanggit ng ἱλασμός o ng agarang pangungusap ang Diyos bilang layon. Mas mainam ang neutral na “handog na pampalubag-loob.”
