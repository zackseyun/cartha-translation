  rationale: Pinalitan ang “sa” ng “para sa” upang mas malinaw na maipahayag ang ugnayan ng handog sa mga kasalanan. Inulit ang “mga kasalanan” sa ikalawang sugnay upang mailantad ang elipsis ng Griyego at maiwasan ang hindi kinakailangang kalabuan. Inayos ang talababa upang mapanatili ang mga alternatibong kahulugan ng ἱλασμός nang hindi nagdaragdag ng isang tahasang layon na wala sa teksto.
