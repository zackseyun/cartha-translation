    rationale: Bagaman maaaring ipahiwatig ng “marami,” mas tapat at mas malinaw ang “marami nang mga anticristo,” upang mapanatili ang malinaw na pagsalungat ng isahan at maramihan sa Griyego.
  - severity: low
    issue: Kulang ang pang-ugnay na “na” sa “nalalaman nating huling oras na.”
    rationale: Ang “nalalaman natin na ito ang huling oras” ay mas malinaw na nagsasalin ng γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν at mas natural sa modernong Filipino.
