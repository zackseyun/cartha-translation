    rationale: Ang “ang” sa Filipino ay kailangan ng sintaks at hindi tuwirang katumbas ng Griyegong article. Dapat ipaliwanag lamang na ang malaking titik ay isang maaaring paraan upang basahin ang termino bilang kinikilalang inaasahang persona, habang nananatiling walang pantukoy ang Griyego.
