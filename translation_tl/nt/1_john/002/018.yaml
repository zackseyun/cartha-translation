  source_fidelity: Tumpak ang pangkalahatang diwa at napananatili ang paghahambing sa inaasahang isahang anticristo at sa kasalukuyang maraming anticristo. Gayunman, mas malinaw na dapat markahan sa pangunahing teksto ang pangmaramihan ng ἀντίχριστοι, at ang hulíng pangungusap ay dapat may tahasang pantulong na “na” upang ganap na maipakita ang nilalaman ng γινώσκομεν ὅτι.
  naturalness: Likas ang register ng “Mga anak” at “huling oras.” Mas maayos ang daloy kung gagamitin ang “ngayon ay” kaysa “ngayon pa nga ay,” na medyo mabigat sa ganitong pangungusap.
  terminology: Ang “anticristo” ay angkop at mahalagang panatilihin sa isahan at maramihan. Ang maliit na titik sa pangunahing teksto ay makatuwirang hindi nagpapasiya kung ang isahan ay tiyak na persona o katawagan; dapat ding iwasan ng talababa ang pahiwatig na ang Filipino na “ang” mismo ay katumbas ng Griyegong pantukoy.
