reference: 1 John 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: tl
  text: Mga anak, ito ang huling oras. At gaya ng narinig ninyo, darating ang anticristo[a]; at ngayon ay marami nang mga anticristo ang lumitaw[b]. Dahil dito, nalalaman natin na ito ang huling oras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isulat na “Anticristo,” kung babasahin bilang tumutukoy sa isang kinikilalang inaasahang persona. Walang pantukoy ang pangngalang Griyego; hindi nito tahasang ipinapasiya kung isang tiyak na indibidwal o isang katawagan ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: O “bumangon” o “dumating.” Ang ganap na anyo ng pandiwang Griyego ay nagdiriing lumitaw na ang maraming anticristo at naroroon sila ngayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Mga anak
  rationale: Isang magiliw at pampastol na pantawag sa mga mambabasa. Likas ito sa modernong Filipino at hindi labis na nagdidiin sa kanilang pagiging bata.
- source_word: ἐσχάτη ὥρα
  choice: huling oras
  rationale: Pinananatili ang malinaw na temporal at eskatolohikal na talinghaga nang hindi ito ipinapakahulugang literal na animnapung minuto o isinasara sa isang tiyak na sistemang pangwakas na panahon.
- source_word: καθὼς ἠκούσατε
  choice: gaya ng narinig ninyo
  rationale: Ipinahahayag ang pagtutugma sa naunang aral na natanggap ng mga mambabasa sa natural na Filipino.
- source_word: ἀντίχριστος
  choice: anticristo
  rationale: Pinananatili ang natatanging terminong Juanino at ang ugnayan nito sa pangmaramihang anyo sa kasunod na sugnay. Ginamit ang maliit na titik upang huwag agad ipasiya kung titulo o pangkalahatang katawagan ang tinutukoy.
- source_word: ἔρχεται
  choice: darating
  rationale: Natural na ipinahahayag sa Filipino ang nakatuon-sa-hinaharap na diwa ng pangkasalukuyang pandiwang Griyego.
- source_word: καὶ νῦν
  choice: ngayon pa nga
  rationale: Ipinakikita ang diin na sa kasalukuyan ay naroon na ang maraming anticristo, kasabay ng inaasahang pagdating na dati nilang narinig.
- source_word: ἀντίχριστοι πολλοὶ
  choice: marami nang anticristo
  rationale: Pinananatili ang mismong leksikal na ugnayan sa isahang anticristo at ipinahahayag ng “nang” na umiiral na sila ngayon.
- source_word: γεγόνασιν
  choice: lumitaw
  rationale: Ipinahahayag ang paglitaw ng mga taong ito sa kasaysayan; ipinahihiwatig ng kabuuang parirala na lumitaw na sila at naroroon sa kasalukuyan.
- source_word: ὅθεν γινώσκομεν
  choice: Dahil dito, nalalaman natin
  rationale: Malinaw na iniuugnay ang kaalaman sa naunang katibayan at pinananatili ang pangmaramihang pananaw ng nagsasalita.
theological_decisions:
- issue: Kahulugan ng “huling oras”
  choice: Pinanatili bilang “huling oras,” isang eskatolohikal na pananalitang tumutukoy sa mapagpasyang huling yugto nang hindi nililimitahan sa literal na oras.
  alternative: Isalin bilang isang eksaktong nalalapit na sandali o bilang retorikal lamang na panahon ng krisis.
  rationale: Hindi nilulutas ng salin ang eksaktong kronolohiya o isang partikular na balangkas tungkol sa wakas; pinananatili nito ang temporal na talinghaga at bigat ng orihinal.
- issue: Ang isahang “anticristo” at maramihang “mga anticristo”
  choice: Pinanatili ang inaasahang isahan at ang kasalukuyang marami nang anticristo nang hindi pinagsasanib ang dalawa.
  alternative: Ituring ang isahan bilang pangkalahatang uri lamang, o tahasang tukuyin ito bilang isang ganap na tiyak na indibidwal.
  rationale: Sadyang pinagtatabi ng talata ang dating narinig tungkol sa darating na anticristo at ang kasalukuyang paglitaw ng marami. Hindi dapat alisin ng salin ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Mga anak” bilang magiliw na pastoral na tawag, at iniwasan ang lipas o labis na teknikal na pananalita. Pinanatili ang terminong “anticristo” upang manatiling malinaw ang pag-uugnay ng isahan at maramihan.
