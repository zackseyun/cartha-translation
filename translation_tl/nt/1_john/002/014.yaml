  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: tl
  text: Sumulat ako sa inyo[a], mga anak, sapagkat nakilala na ninyo ang Ama. Sumulat ako sa inyo, mga ama, sapagkat nakilala na ninyo ang umiiral mula pa sa simula.[b] Sumulat ako sa inyo, mga kabataang lalaki, sapagkat malalakas kayo, nananatili sa inyo ang salita ng Diyos,[c] at napagtagumpayan na ninyo ang Masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Isinulat ko sa inyo” sa buong talata. Ang Griyegong aorist ay maaaring tumukoy sa payak na nagdaang kilos; natural sa Tagalog ang “Sumulat ako” sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “umiiral mula pa sa simula” ay malamang na tumutukoy sa Anak na umiiral na bago pa man, ayon sa karaniwang gamit ni Juan, ngunit hindi tahasang pinangalanan sa teksto ang tinutukoy.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “namamalagi sa inyo.” Ang “nananatili” ay nagsasaad ng patuloy na presensiya ng salita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Sumulat ako
  rationale: Likas sa Tagalog ang payak na aspektong perpektibo para sa natapos na pagsulat; hindi kailangang tumbasan ng hiwalay na present perfect ang Ingles. Pinananatili ang tatlong ulit na retorikal na hulma.
- source_word: παιδία
  choice: mga anak
  rationale: Pinananatili ang pampamilyang pantawag sa mga mambabasa at mas natural ito sa makabagong Tagalog kaysa “maliliit na anak.”
- source_word: ἐγνώκατε
  choice: nakilala na ninyo
  rationale: Ipinahihiwatig ng “na” ang pagkakilalang naganap na at nananatiling mahalaga, na angkop sa resultative force ng Greek perfect.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Malinaw na titulong tumutukoy sa Diyos sa kontekstong Juanino.
- source_word: πατέρες
  choice: mga ama
  rationale: Tuwirang pinananatili ang metapora at kaibahan sa mga anak at kabataang lalaki, sa halip na ipakahulugang “matatandang lalaki.”
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ang mula pa sa simula
  rationale: Pinananatiling hindi tahasang pinapangalanan ang tinutukoy, gaya ng Greek. Ang “mula pa” ay natural na naghahayag ng pag-iral mula sa simula.
- source_word: νεανίσκοι
  choice: mga kabataang lalaki
  rationale: Tumpak sa panlalaking pangmaramihang anyo at malinaw ang kaibahan sa “mga ama.”
- source_word: ἰσχυροί
  choice: malalakas
  rationale: Tuwiran at natural na katumbas na angkop sa moral at espirituwal na konteksto.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pamilyar na biblikal na parirala na hindi nililimitahan kung ito ay mensahe ng Diyos sa pangkalahatan o ang ipinahayag na ebanghelyo.
- source_word: μένει
  choice: nananatili
  rationale: Natural na makabagong Tagalog na nagpapanatili sa patuloy na diwa ng mahalagang terminong Juanino.
- source_word: νενικήκατε
  choice: nadaig na ninyo
  rationale: Ipinapahayag ang naganap na tagumpay na may patuloy na kabuluhan; ang “na” ay tumutulong maghatid ng resultative force ng perfect.
- source_word: τὸν πονηρόν
  choice: ang Masama
  rationale: Ang artikulo at panlalaking anyo ay tumuturo sa isang personal na kalaban, hindi lamang sa abstraktong kasamaan. Ang malaking titik ay nagpapalinaw sa pantanging pagtukoy nang hindi tahasang idinaragdag ang pangalang Satanas.
theological_decisions:
- issue: Tinutukoy ng “ang mula pa sa simula”
  choice: Hindi tahasang pinangalanan; isinaling “ang mula pa sa simula.”
  alternative: Tukuyin nang hayagan bilang “si Cristo” o “ang Anak,” o unawain bilang Diyos sa pangkalahatan.
  rationale: Malakas ang pahiwatig sa gamit ni Juan na malamang ang Anak ang tinutukoy, ngunit hindi Siya pinangalanan sa mismong parirala. Pinananatili ng salin ang ambigwidad ng teksto.
- issue: Kasarian ng mga kinakausap
  choice: “mga anak,” “mga ama,” at “mga kabataang lalaki”
  alternative: Gawing neutral ang lahat bilang mga antas ng espirituwal na paglago o mga pangkat ng buong iglesya.
  rationale: 'Magkahalo ang anyo sa Greek: mas malawak ang παιδία, samantalang panlalaki ang πατέρες at νεανίσκοι. Pinananatili ang leksikal na kasarian at ang retorikal na tatluhan nang hindi nagpapasya kung literal o metaporikal lamang ang mga pangkat.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak” bilang likas na pampamilyang pantawag; pinanatili ang tatlong ulit na “Sumulat ako sa inyo” at ang mga aspektuwal na pahiwatig sa pamamagitan ng “na.”
