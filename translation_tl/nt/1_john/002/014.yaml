  naturalness: Makabago at malinaw ang karamihan ng salin. Mas natural at mas malinaw ang “ang umiiral mula pa sa simula” para sa personal na tinutukoy. Ang “napagtagumpayan” ay mas tiyak na katumbas ng νενικήκατε sa kontekstong pakikipaglaban kaysa “nadaig,” na maaari ring mangahulugang nalampasan o nahigitan.
  terminology: Ang “Ama,” “salita ng Diyos,” at “Masama” ay angkop at magkakatugma sa karaniwang rehistrong biblikal na Filipino. Pinananatili ng “ang umiiral mula pa sa simula” ang hindi tahasang pagpapangalan sa tinutukoy at hindi nilulutas ang ambigwidad ng teksto.
