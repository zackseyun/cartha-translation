  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: tl
  text: At ngayon, mga anak, manatili kayo sa kanya upang, kung siya ay mahayag[a], magkaroon tayo ng lakas ng loob at hindi tayo umurong palayo sa kanya dahil sa hiya[b] sa kanyang pagdating[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “kapag siya ay mahayag” o “kapag siya ay magpakita.” Pasibo ang pandiwang Griyego: “mahayag.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mapahiya sa harap niya.” Maaaring tumukoy ang parirala sa kahihiyan sa kanyang harapan, sa halip na tahasang pag-urong palayo sa kanya.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sa kanyang presensya.” Sa kontekstong ito, ipinahahayag ng “pagdating” ang eskatolohikal na diwa ng salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: mga anak
  rationale: Isang magiliw na pantawag ng isang espirituwal na ama sa kanyang mga mambabasa. Natural ito sa modernong Tagalog at pinananatili ang larawang pampamilya; magiging pilit ang literal na “maliliit na anak.”
- source_word: μένετε
  choice: manatili kayo
  rationale: Pinananatili nito ang patuloy at ugnayang diwa ng mahalagang salitang Johannine na μένω, habang malinaw at natural sa kasalukuyang Tagalog.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Karaniwang paraan ito sa Tagalog upang ipahayag ang pananatili sa isang tao. Hindi nito labis na ipinapaliwanag ang teolohikal na talinghaga bilang “kaisa niya.”
- source_word: φανερωθῇ
  choice: mahayag siya
  rationale: Pinananatili ng “mahayag” ang anyong pasibo ng Griyego at ang diwa ng lantad na pagpapakita ni Cristo, sa halip na gawing aktibo lamang na “magpakita siya.”
- source_word: σχῶμεν παρρησίαν
  choice: magkaroon tayo ng lakas ng loob
  rationale: Natural nitong ipinahahayag ang bukas at panatag na pagharap na tinutukoy ng παρρησία. Hindi ito nililimitahan sa intelektuwal na katiyakan lamang.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: umurong palayo sa kanya dahil sa hiya
  rationale: Sinasalamin nito kapwa ang kahihiyang ipinahihiwatig ng pandiwa at ang diwa ng paglayo sa ἀπό, nang hindi ipinapalagay na tumutukoy ito sa pinal na hatol.
- source_word: παρουσίᾳ
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, malinaw at likas na ipinahahayag ng “pagdating” ang hinaharap na παρουσία ni Cristo, samantalang inilalagay sa talababa ang mas literal na “presensya.”
theological_decisions:
- issue: Tinutukoy ng mga panghalip at ng eskatolohikal na paghahayag
  choice: Ang “siya” at “kanya” ay tumutukoy sa Anak, si Jesu-Cristo, at sa kanyang paghahayag at pagdating sa hinaharap.
  alternative: Maaaring unawain ang panghalip bilang mas pangkalahatang pagtukoy sa Diyos nang hindi tahasang tinutukoy ang Anak.
  rationale: Ang malapit na konteksto ay nakatuon sa pananatili sa Anak at sa kanyang pagpapakita. Gayunman, hindi idinagdag ang pangalang “Jesus” sa mismong talata, upang mapanatili ang anyong panghalip ng Griyego.
- issue: Diwa ng kahihiyan sa kanyang pagdating
  choice: Inilalarawan ang posibleng pag-urong palayo sa kanya dahil sa hiya.
  alternative: “Mapahiya sa harap niya,” nang walang malinaw na diwa ng pag-urong o paglayo.
  rationale: Ang pagsasama ng αἰσχυνθῶμεν at ἀπ’ αὐτοῦ ay maaaring magpahiwatig ng paglayo dahil sa kahihiyan. Pinananatili ng talababa ang mas payak at tradisyonal na pagbasa nang hindi ginagawang tiyak ang isang tunay na malabong detalye.
- issue: Kondisyonal na ἐὰν sa paghahayag
  choice: “kung mahayag siya”
  alternative: “kapag mahayag siya”
  rationale: Pinananatili ng “kung” ang pormal na kondisyong ipinahahayag ng ἐὰν, nang hindi ipinahihiwatig na nag-aalinlangan ang may-akda kung magaganap ang paghahayag. Ang alternatibong “kapag” ay maaaring maging mas idiomatiko sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa pampublikong pagbasa. Ginamit ang “mga anak” bilang likas na magiliw na pantawag, at iniwasan ang mga lumang salitang gaya ng “magsipanatili.” Pinanatili ang mahahalagang pagkalabo sa “kung/kapag,” sa pasibong “mahayag,” at sa ugnayan ng kahihiyan at paglayo sa pamamagitan ng mga talababa.
