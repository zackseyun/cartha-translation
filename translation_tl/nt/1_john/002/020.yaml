base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: tl
  text: Ngunit mayroon kayong pagpapahid mula sa Banal, at alam ninyong lahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ibang pagbasa ng teksto: “at alam ninyo ang lahat ng bagay.” Sinusuportahan ng SBLGNT ang “at alam ninyong lahat.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Ngunit
  rationale: Bagaman karaniwang nangangahulugang “at” ang καί, dito ay ipinakikita nito ang pagsalungat sa mga anti-Cristo na binanggit sa naunang talata. Likas sa Filipino ang “Ngunit” para ihayag ang ugnayang ito.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Hayag at may diin ang panghalip sa Griyego. Napananatili ng “kayo,” kasunod ng panalungat na “Ngunit,” ang paghahambing sa mga naunang tinukoy.
- source_word: χρῖσμα
  choice: pagpapahid
  rationale: Pinananatili ng “pagpapahid” ang metapora ng χρῖσμα nang hindi ito tahasang ipinapakahulugan bilang Banal na Espiritu o bilang isang partikular na kaloob.
- source_word: ἔχετε
  choice: may
  rationale: Ang “may” ang pinakanatural na modernong Filipino para sa payak na diwang “taglay ninyo” o “mayroon kayo.”
- source_word: ἀπὸ τοῦ ἁγίου
  choice: mula sa Banal
  rationale: Tuwirang pinananatili nito ang titulong “ang Banal” nang hindi tinutukoy kung ang tinutukoy ay ang Ama o ang Anak.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay ang ikalawang καί, kaya ang natural na katumbas nito ay “at.”
- source_word: οἴδατε
  choice: nakaaalam
  rationale: Tuwirang ipinahahayag ng “nakaaalam” ang kaalaman o pagkabatid na tinutukoy ng οἴδατε.
- source_word: πάντες
  choice: kayong lahat
  rationale: 'Nominatibong maramihan ang πάντες sa tekstong SBLGNT, kaya inilalagay itong paksa: “kayong lahat,” hindi layong “lahat ng bagay.”'
theological_decisions:
- issue: Ang tinutukoy ng “ang Banal”
  choice: Pinanatili bilang “ang Banal” nang hindi tinukoy kung ito ang Ama o ang Anak.
  alternative: ang Ama; ang Anak/si Jesu-Cristo
  rationale: Hindi tahasang kinikilala ng teksto ang tinutukoy, at maaaring tumukoy ang katawagan sa alinman ayon sa konteksto at paggamit ni Juan. Pinananatili ng salin ang tunay na tensiyong teolohikal.
- issue: Ang kahulugan ng χρῖσμα
  choice: Isinalin bilang “pagpapahid” at pinanatiling metaporikal.
  alternative: ang Banal na Espiritu; pagpapahid ng Espiritu; kaloob ng pagpapahid
  rationale: Bagaman madalas itong inuunawa bilang Banal na Espiritu o gawain ng Espiritu, χρῖσμα mismo ang ginamit ng Griyego. Hindi dapat tahasang lutasin sa salin ang pagpapakahulugang iyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pagpapahid” upang mapanatili ang biblikal na metapora, at ang “kayong lahat ay nakaaalam” upang malinaw na ang πάντες ay tumutukoy sa lahat ng mambabasa, hindi sa lahat ng bagay bilang layon ng kaalaman.
