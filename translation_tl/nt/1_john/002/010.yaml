base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: tl
  text: Ang umiibig sa kanyang kapatid ay nananatili sa liwanag, at walang katitisuran sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at walang makatitisod sa kanya.” Maaaring unawain ang pariralang Griyego bilang katitisurang wala sa kanya o bilang katitisurang hindi niya kinakaharap.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Ang umiibig
  rationale: Ang may pantukoy na pangkasalukuyang participle ay tumutukoy sa sinumang patuloy na umiibig. Likas at marangal sa Tagalog ang “ang umiibig,” at pinananatili nito ang pangkalahatan at nagpapatuloy na diwa.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Bagaman panlalaking isahan ang anyong Griyego, “kapatid” ang likas na katumbas sa Tagalog at hindi karaniwang minamarkahan ang kasarian; ang “kapatid na lalaki” ay magdaragdag ng diin sa kasarian na wala sa karaniwang gamit ng konteksto.
- source_word: ἐν τῷ φωτὶ
  choice: sa liwanag
  rationale: Pinananatili nito ang mahalagang metapora ng liwanag sa sulat at natural sa modernong Tagalog.
- source_word: μένει
  choice: nananatili
  rationale: Ipinahahayag ng kasalukuyang anyo ang nagpapatuloy na kalagayan. Ang “nananatili” ay malinaw at angkop sa mahalagang gamit ng μένω sa mga sulat ni Juan.
- source_word: σκάνδαλον
  choice: sanhi ng pagkatisod
  rationale: Maaaring tumukoy ang salita sa katitisuran, bitag, o sanhi ng pagkakasala. Pinananatili ng parirala ang metapora at ang etikal na diwa nang hindi ito ginagawang literal na bagay.
- source_word: ἐν αὐτῷ
  choice: sa loob niya
  rationale: Pinipili ng pangunahing teksto ang tuwirang lokatibong diwa na ang sanhi ng pagkatisod ay wala sa taong umiibig. Dahil maaari rin itong unawain bilang “para sa kanya,” inilalahad ang alternatibo sa talababa.
- source_word: οὐκ ἔστιν
  choice: walang
  rationale: Ito ang pinakanatural na eksistensiyal na konstruksiyon sa Tagalog para sa “there is no.”
theological_decisions:
- issue: Kahulugan ng καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: Walang sanhi ng pagkatisod sa loob ng taong umiibig sa kanyang kapatid.
  alternative: Walang katitisurang humaharap sa kanya o magiging dahilan upang siya ay matisod.
  rationale: Maaaring ilarawan ng ἐν αὐτῷ ang wala sa loob ng taong iyon, ngunit maaari rin itong magkaroon ng diwang “para sa kanya.” Pinananatili ng pangunahing salin ang tuwirang lokatibong pagbasa, habang iniiwan ng talababa ang tunay na sintaktikong posibilidad ng alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Pinanatili ang metapora ng liwanag at pagkatisod, at iniwasan ang makalumang pananalita at sektaryang pagpapakahulugan.
