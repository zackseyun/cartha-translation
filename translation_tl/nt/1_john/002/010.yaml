  terminology: Ang “umiibig,” “kapatid,” “liwanag,” at “nananatili” ay angkop at pare-pareho sa rehistro ng sulat. Ang “katitisuran” ay isang matatag at likas na katumbas ng σκάνδαλον at mas mahusay na nakapag-iingat ng sadyang kalabuan ng parirala.
