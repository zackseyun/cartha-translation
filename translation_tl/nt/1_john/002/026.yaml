  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: tl
  text: Isinulat ko sa inyo ang mga bagay na ito tungkol sa mga nagliligaw sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga nanlilinlang sa inyo” o “mga nagsisikap na iligaw kayo.” Maaaring tumukoy ang participle sa Griyego sa panlilinlang o sa pagtatangkang iligaw kayo; hindi nito tinutukoy kung nagtagumpay sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Ang panghalip na pamatlig ay walang kasarian at maramihan; tumutukoy ito sa naunang bahagi ng sulat, kaya likas sa Tagalog ang “ang mga bagay na ito.”
- source_word: ἔγραψα
  choice: Isinulat ko
  rationale: Ang aorist indicative ay tumutukoy sa natapos na pagsulat. Sapat at natural ang aspektong perpektibo ng “isinulat” nang hindi kinakailangang idagdag ang “na.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang tinutukoy ng datibo ang mga tumanggap ng isinulat.
- source_word: περὶ
  choice: tungkol sa
  rationale: Malinaw at pangkaraniwang pananda ito ng paksang tinatalakay.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: mga nagliligaw sa inyo
  rationale: Pinananatili ng “nagliligaw” ang larawan ng pagpapalihis mula sa tamang daan at ang nagpapatuloy na gawain ng present participle. Hindi nito tiyak na sinasabing nagtagumpay na ang panlilinlang.
theological_decisions:
- issue: Kung ang πλανώντων ay nagpapahiwatig ng matagumpay na panlilinlang o ng gawaing naglalayong iligaw ang mga mambabasa
  choice: mga nagliligaw sa inyo
  alternative: mga nanlilinlang sa inyo; mga nagsisikap na iligaw kayo
  rationale: Tinutukoy ng participle ang mga kalaban ayon sa kanilang gawain laban sa mga mambabasa. Ang “nagliligaw” ay tuwiran ngunit hindi kinakailangang magpahiwatig na ganap na silang nagtagumpay; ipinapaliwanag sa talababa ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “nagliligaw” upang mapanatili ang metapora ng paglihis sa landas, samantalang inilagay sa talababa ang mga leksikal na alternatibo at ang hindi tiyak na antas ng tagumpay ng gawain.
