  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: tl
  text: Ang sinumang tumatanggi sa Anak ay hindi rin niya taglay ang Ama; ang hayagang kumikilala sa Anak ay taglay rin ang Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito, wala ang: “ang hayagang kumikilala sa Anak ay taglay rin ang Ama.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Ang bawat tumatanggi
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili ang panlahat at pangkalahatang diwa ng substantival present participle.
- source_word: ἀρνούμενος
  choice: tumatanggi
  rationale: Sa kontekstong pagpapahayag ng pananampalataya, malinaw nitong ipinahahayag ang pagtanggi sa Anak nang hindi nagdaragdag ng diwang wala sa Griyego.
- source_word: τὸν υἱὸν
  choice: sa Anak
  rationale: Pinananatili ang tiyak na kristolohikal na titulong “Anak” nang hindi pinalalawak bilang “Anak ng Diyos.”
- source_word: οὐδὲ
  choice: rin
  rationale: 'Likas na ipinapakita ng “rin” ang kaugnay na pagkakait: kung tinatanggihan ang Anak, wala rin ang Ama.'
- source_word: τὸν πατέρα ἔχει
  choice: nasa kanya ang Ama
  rationale: Mas natural ito sa Tagalog kaysa sa literal ngunit alanganing “mayroon siyang Ama,” habang pinananatili ang sadyang malawak na relasyonal na diwa ng ἔχει at hindi ito nililimitahan sa pakikisama o pag-aari.
- source_word: ὁ ὁμολογῶν
  choice: ang kumikilala
  rationale: Ang “kumikilala” ay natural at dignified na salin ng ὁμολογέω rito, na tumutukoy sa hayagang pagkilala o pagpapahayag tungkol sa Anak; iniiwasan nito ang posibleng maling pagkaunawa sa “nagkukumpisal.”
- source_word: καὶ
  choice: rin
  rationale: Sa magkatapat na mga sugnay, likas na ipinakikita ng “rin” na taglay din ng kumikilala sa Anak ang Ama.
theological_decisions:
- issue: Nakalagak sa panaklong tekstuwal ang ikalawang sugnay sa SBLGNT
  choice: Isinama sa pangunahing teksto ang “ang kumikilala sa Anak ay nasa kanya rin ang Ama.”
  alternative: Alisin ang ikalawang sugnay dahil wala ito sa ilang manuskrito.
  rationale: Kasama ang sugnay sa ibinigay na tekstong Griyego bagaman minarkahan bilang may pagkakaibang tekstuwal; kaya isinalin ito at iniulat sa talababa ang variant.
- issue: Relasyonal na diwa ng τὸν πατέρα ἔχει
  choice: Isinalin bilang “nasa kanya ang Ama.”
  alternative: “may pakikipag-isa sa Ama” o “kabilang sa Ama”
  rationale: Pinananatili nito ang malawak at matinding pahayag ni Juan nang hindi ipinapako ang ἔχει sa isang mas makitid na kategoryang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang magkatimbang na ayos ng dalawang sugnay upang mapanatili ang antitesis ng Griyego.
