revisions:
- from: Ang bawat tumatanggi sa Anak ay wala rin sa kanya ang Ama; ang kumikilala sa Anak ay nasa kanya rin ang Ama.[a]
  to: Ang sinumang tumatanggi sa Anak ay hindi rin niya taglay ang Ama; ang hayagang kumikilala sa Anak ay taglay rin ang Ama.[a]
  rationale: Inayos ang pananalita upang maging mas natural sa modernong Filipino Tagalog at mas malapit sa direksiyon ng ἔχει (“may/taglay”), habang pinananatili ang antitesis, ang mga titulong “Anak” at “Ama,” at ang tekstuwal na talababa para sa nakapanaklong na ikalawang sugnay sa SBLGNT. Inilagay ang talababa sa dulo ng ikalawang sugnay na siyang tinutukoy ng variant.
