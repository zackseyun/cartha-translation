base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: tl
  text: Lumabas sila mula sa atin, ngunit hindi sila kabilang sa atin. Sapagkat kung kabilang sila sa atin, nanatili sana silang kasama natin.[a] Ngunit nangyari ito upang mahayag na hindi silang lahat ay kabilang sa atin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nagpatuloy sana silang kasama natin.
    reason: lexical_alternative
  - marker: b
    text: O, upang sila ay maihayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: mula sa atin / kabilang sa atin
  rationale: Sa unang paglitaw, tumutukoy ang parirala sa pinanggalingang pamayanan kaya natural ang “mula sa atin.” Sa mga sumunod, ang diwa ay kaugnayan o pagiging bahagi ng pangkat kaya ginamit ang “kabilang sa atin,” nang hindi ito pinalalawak tungo sa isang sistematikong teolohikal na paliwanag.
- source_word: ἐξῆλθαν
  choice: lumabas
  rationale: Tuwirang pinananatili nito ang larawan ng pag-alis sa ἐξέρχομαι nang hindi paunang binibigyang-kahulugan ang kilos bilang apostasya.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: hindi sila kabilang sa atin
  rationale: Likas sa modernong Tagalog ang “kabilang” para sa diwa ng ugnayan at pagkakakilanlan na taglay rito ng ἐκ.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: sapagkat kung kabilang sila sa atin
  rationale: Ang “kung… sana” na kabuuang kayarian ng pangungusap ang nagpapahayag ng kondisyong salungat sa nangyari, habang pinananatili ang parehong wikang pang-ugnayan.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: nanatili sana silang kasama natin
  rationale: Ang “nanatili” ay natural at pinananatili ang mahalagang Johannine na diwa ng μένω; ipinahahayag ng “sana” ang resultang salungat sa nangyari.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: ngunit nangyari ito upang mahayag
  rationale: Ang “mahayag” ay maikli at marangal na katumbas ng pasibong φανερόω. Idinagdag ang “nangyari ito” upang maging buo at natural sa Tagalog ang eliptikong ugnayan ng sugnay.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: na hindi silang lahat ay kabilang sa atin
  rationale: Pinananatili nito ang ayos na “hindi lahat” at ang kaugnayang diwa ng ἐξ ἡμῶν, sa halip na gawing “wala ni isa” o magdagdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Kung dapat ipakahulugan ang “kabilang sa atin” bilang tahasang pahayag tungkol sa tunay na pananampalataya o kaligtasan
  choice: Panatilihin ang wikang pangkomunidad na “kabilang sa atin.”
  alternative: “Hindi sila kailanman tunay na mananampalataya” o “hindi sila tunay na ligtas.”
  rationale: Ipinaghihiwalay ng talata ang pisikal na pag-alis at ang tunay na pagiging kabilang, ngunit hindi ginagamit ng Griyego ang mga kategorya ng kalaunang sistematikong teolohiya. Pinananatili ng salin ang tensiyong ito.
- issue: Saklaw ng οὐκ… πάντες
  choice: “hindi silang lahat ay kabilang sa atin”
  alternative: “wala ni isa sa kanila ang kabilang sa atin”
  rationale: Pinananatili ng napiling anyo ang pormal na saklaw na “hindi lahat” sa source at sa audited consultation layer, sa halip na tahimik na gawing mas ganap ang negasyon.
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “atin/natin” ayon sa likas na tuntunin ng Tagalog: “atin” pagkatapos ng “mula/kabilang,” at “natin” pagkatapos ng “kasama.” Iniwasan ang teknikal o denominasyonal na pananalita.'
