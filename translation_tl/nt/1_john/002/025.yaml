  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: tl
  text: 'At ito ang pangakong siya mismo[a] ang nangako sa atin: ang buhay na walang hanggan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi rito kung ang “siya mismo” ay tumutukoy sa Ama o sa Anak.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία … ἐπηγγείλατο
  choice: pangakong … nangako
  rationale: Pinananatili ang sadyang pag-uugnay at pag-uulit ng magkaugnay na pangngalan at pandiwa sa Griyego. Bagaman may bahagyang pag-uulit sa Filipino, malinaw at natural pa rin ito.
- source_word: αὐτός
  choice: siya mismo
  rationale: Ipinahahayag nito ang diin ng panghalip sa Griyego nang hindi tinutukoy kung ang tinutukoy ay ang Ama o ang Anak.
- source_word: ἡμῖν
  choice: sa atin
  rationale: Natural na katumbas ng datibong di-tuwirang layon at kasama ang manunulat at mga mambabasa.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ang buhay na walang hanggan
  rationale: Karaniwan, malinaw, at marangal na salin ng parirala sa kontekstong Juanino. Ang “ang” ay likas na nagpapanatili sa tiyak na anyo ng pariralang Griyego.
- source_word: καὶ αὕτη ἐστίν
  choice: At ito ang
  rationale: Direktang iniuugnay ang talata sa naunang pahayag at ipinakikilala ang nilalaman ng pangako nang walang idinagdag na pagpapakahulugan.
theological_decisions:
- issue: Ang tinutukoy ng emphatic na αὐτός
  choice: Pinanatili bilang “siya mismo” nang hindi pinapangalanan ang tinutukoy.
  alternative: “ang Ama mismo” o “ang Anak mismo”
  rationale: Hindi tahasang inuulit ng talata kung ang panghalip ay tumutukoy sa Ama o sa Anak. Pinananatili ng salin ang tunay na kalabuan at tensiyong teolohikal ng teksto.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Pinanatili ang retorikal na pag-uulit na “pangakong … nangako” at ang diin ng “siya mismo.”
