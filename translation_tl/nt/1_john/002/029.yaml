id: 1JN.2.29
reference: 1 John 2:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: tl
  text: Kung alam ninyong matuwid siya,[a] alam din ninyo na ang bawat namumuhay nang matuwid ay ipinanganak na mula sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “siya” at “kanya” ay maaaring tumukoy sa Diyos Ama o sa Anak; hindi tahasang tinutukoy ng Griyego kung sino.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Kung alam ninyo
  rationale: Pinananatili ang kondisyon ng ἐὰν at ang karaniwang diwa ng οἶδα bilang tunay na kaalaman.
- source_word: δίκαιός
  choice: matuwid
  rationale: Likas at marangal na salin para sa moral at teolohikal na diwa ng δίκαιος sa konteksto.
- source_word: γινώσκετε
  choice: alam din ninyo
  rationale: Itinuturing na pasalaysay, hindi pautos; ang “din” ay malinaw na nag-uugnay sa naunang “alam ninyo” nang hindi binabago ang diwa.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: ang bawat namumuhay nang matuwid
  rationale: Ipinahahayag ang patuloy o kinagawiang paggawa na ipinahihiwatig ng present participle. Mas natural ito sa modernong Tagalog kaysa sa literal ngunit matigas na “gumagawa ng katuwiran.”
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: ay ipinanganak na mula sa kanya
  rationale: Ang “ipinanganak” ay nagpapanatili sa larawang kapanganakan at sa tinig na balintiyak; ipinahihiwatig ng “na” ang naganap nang kilos na may nananatiling bunga, gaya ng Greek perfect.
theological_decisions:
- issue: Ang tinutukoy ng αὐτός sa “matuwid siya” at “mula sa kanya”
  choice: Panatilihin ang mga panghalip na “siya” at “kanya” nang hindi pinapangalanan ang tinutukoy.
  alternative: Tukuyin bilang Diyos Ama o bilang Anak.
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy, at maaaring ituro ng konteksto sa Ama o sa Anak. Pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “namumuhay nang matuwid” upang natural na maipahayag ang kinagawiang matuwid na pagkilos, habang pinanatili ang hindi tiyak na tinutukoy ng mga panghalip.
