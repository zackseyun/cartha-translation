id: 1JN.4.1
reference: 1 John 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: tl
  text: Mga minamahal[a], huwag ninyong paniwalaan ang bawat espiritu. Sa halip, subukin ninyo ang mga espiritu upang malaman kung sila ay mula sa Diyos[b], sapagkat maraming bulaang propeta ang lumabas na patungo sa sanlibutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mga mahal kong kaibigan.” Ang salitang Griyego ay literal na nangangahulugang “mga minamahal.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, suriin ang espirituwal na pinagmulan sa likod ng mga pahayag na nag-aangking mula sa Diyos; tinutukoy ng kasunod na sugnay ang “mga bulaang propeta” bilang mga taong nagsasalita.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan na nagpapanatili ng ugnayang leksikal sa pag-ibig at ng marangal na himig ni Juan.
- source_word: παντὶ πνεύματι
  choice: ang bawat espiritu
  rationale: Pinananatili ang tuwirang supernatural na pananalita at ang pangkalahatang diwa ng isahan, nang hindi ito pinapaliit sa mga guro o pahayag lamang.
- source_word: πιστεύετε
  choice: paniwalaan
  rationale: Likas sa modernong Tagalog para sa pagtanggap na totoo ng ipinahahayag o impluwensiyang nagmumula sa isang espiritu.
- source_word: δοκιμάζετε
  choice: subukin
  rationale: Ipinahahayag ang pagsusuri upang matiyak ang pagiging tunay; marangal at malinaw nang hindi labis na teknikal.
- source_word: τὰ πνεύματα
  choice: ang mga espiritu
  rationale: Pinananatili ang tahasang maramihang katawagan at ang kaibhan nito sa mga bulaang propetang binanggit sa kasunod na sugnay.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: upang malaman kung sila ay mula sa Diyos
  rationale: Likas na inilalahad sa Tagalog ang layunin ng pagsubok, habang pinananatili ang tanong tungkol sa kanilang pinagmulan.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: maraming bulaang propeta
  rationale: Karaniwan at tumpak na salin ng tambalang Griyego para sa mga nag-aangking propeta ngunit hindi tunay.
- source_word: ἐξεληλύθασιν
  choice: lumabas na
  rationale: Ang pangnagdaang ganap ay nagpapahiwatig ng naganap nang paglabas na may patuloy na bunga; ipinahihiwatig ito ng 'na'.
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Natural at malawak na katumbas na hindi nagdaragdag ng interpretasyong gaya ng 'sistema ng sanlibutan.'
theological_decisions:
- issue: Tinutukoy ng “mga espiritu”
  choice: Mga tunay na espiritu o espirituwal na pinagmulan sa likod ng mga pahayag ng mga propeta, na sinusuri sa pamamagitan ng mga taong nagsasalita
  alternative: Mga taong guro lamang, o mga pahayag na itinuturing nang hiwalay sa anumang espirituwal na pinagmulan
  rationale: Tahasan at magkahiwalay na binabanggit ng teksto ang “mga espiritu” at “mga bulaang propeta.” Pinananatili ng salin ang supernatural na pananalita at hindi nilulutas nang lampas sa sinasabi ng teksto ang kaugnayan ng espiritu at taong tagapagsalita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Mga minamahal,” “subukin,” at “sanlibutan” upang mapanatili ang biblikal na bigat nang hindi nagiging lipas o labis na pormal. Nasa pangunahing teksto ang lahat ng panandang talababa.
