base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: tl
  text: Walang sinumang nakakita kailanman sa Diyos. Kung iniibig natin ang isa’t isa, nananatili sa atin ang Diyos, at ang pag-ibig niya[a] ay naging ganap na[b] sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “ang pag-ibig natin sa Diyos.” Ang Griyegong “pag-ibig niya” ay maaaring tumukoy sa pag-ibig ng Diyos sa atin o sa pag-ibig natin sa Diyos; higit na sinusuportahan ng konteksto ang pag-ibig ng Diyos.
    reason: alternative_reading
  - marker: b
    text: O “ay ginawang ganap sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: nakakita
  rationale: Likas at malinaw itong salin ng pandiwang tumutukoy sa pagkakita o pagmamasid; kasama ng πώποτε, ipinahahayag nito na walang sinuman ang nakakita sa Diyos kahit kailan.
- source_word: πώποτε
  choice: kailanman
  rationale: 'Kasama ng pagtanggi, pinatitindi nito ang pangkalahatang pahayag: walang sinuman ang nakakita sa Diyos sa anumang panahon.'
- source_word: ἐὰν ἀγαπῶμεν
  choice: kung iniibig natin
  rationale: Pinananatili ng “kung” ang tunay na kondisyon ng ἐάν at ng pangkasalukuyang pasakali, nang hindi dinaragdagan ang kahulugan ng aspekto.
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: Karaniwan, malinaw, at marangal na salin ng katumbasang ugnayan sa kontekstong Juanino.
- source_word: μένει
  choice: nananatili
  rationale: Pinananatili nito ang patuloy at ugnayang diwa ng mahalagang salitang Juanino na μένω, sa natural na makabagong Tagalog.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: ang pag-ibig niya
  rationale: Pinananatili ng parirala ang anyong mapang-angkin ng Griyego at ang posibilidad ng higit sa isang ugnayang genitibo; sa konteksto, pangunahing nauunawaan itong pag-ibig ng Diyos.
- source_word: τετελειωμένη ἐστιν
  choice: ay naging ganap na
  rationale: Ipinahihiwatig ng periphrastic perfect ang isang pagkaganap na may nananatiling bunga. Ang “naging ganap na” ay natural at pinananatili ang ugnayan sa ideya ng τελειόω nang hindi ito ginagawang labis na paliwanag.
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Natural sa Tagalog ang “sa atin” para sa kapuwa pananatili ng Diyos at pagganap ng pag-ibig sa loob ng sambayanan; hindi nito pinipilit ang isang mahigpit na indibiduwal o kolektibong pagbasa.
theological_decisions:
- issue: Kahulugan ng ἡ ἀγάπη αὐτοῦ (“ang pag-ibig niya”)
  choice: Ang pag-ibig ng Diyos ay nagiging ganap sa atin
  alternative: Ang pag-ibig natin sa Diyos ay nagiging ganap sa atin
  rationale: Binibigyang-diin ng agarang konteksto (mga talata 10–11) ang pag-ibig na unang nagmula sa Diyos, kaya higit na malamang ang pagbasa na pag-ibig ng Diyos. Gayunman, tunay na maaaring ipakahulugan ang genitibo bilang pag-ibig na nakatuon sa Diyos, kaya inilalahad ang alternatibo sa talababa.
- issue: Diwa ng τετελειωμένη ἐστιν
  choice: ay naging ganap na
  alternative: ay lubos na natutupad
  rationale: Pinananatili ng pangunahing salin ang natapos na kalagayang may patuloy na bunga, samantalang ang alternatibo ay nagpapalinaw sa posibleng diwa ng pagkumpleto o ganap na katuparan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang pangunahing bokabularyong Juanino sa “nananatili” at “pag-ibig,” at iniwasan ang mga salitang lipas o labis na teknikal. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinutukoy ng mga ito.
