  to: Walang takot sa pag-ibig, ngunit itinataboy ng ganap na pag-ibig ang takot, sapagkat ang takot ay may kalakip na parusa.[a] Ngunit ang natatakot ay hindi pa ginawang ganap sa pag-ibig.
  rationale: Pinalitan ang hindi likas na “hindi pa nagawang ganap” ng “hindi pa ginawang ganap” upang maipahayag nang mas malinaw ang pasibong anyo at resultang kalagayan ng τετελείωται. Pinalitan din ang unang “Sa halip” ng “ngunit” bilang mas natural na salin ng ἀλλά. Hindi binago ang kahulugan ng kaugnayan ng takot at parusa, at pinanatili ang footnote na nagsasaad ng literal na anyo.
