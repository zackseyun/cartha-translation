source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: tl
  text: Walang takot sa pag-ibig, ngunit itinataboy ng ganap na pag-ibig ang takot, sapagkat ang takot ay may kalakip na parusa.[a] Ngunit ang natatakot ay hindi pa ginawang ganap sa pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang takot ay may parusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: takot / natatakot
  rationale: Karaniwang salin na malinaw sa konteksto ng paghatol at pinananatili ang pag-uulit ng salitang-ugat sa buong talata.
- source_word: ἀγάπῃ / ἀγάπη
  choice: pag-ibig
  rationale: Likas at kinikilalang katumbas ng ἀγάπη, at pinananatili ang mahalagang pag-uulit sa talata.
- source_word: τελεία
  choice: ganap
  rationale: Ipinahihiwatig ang pag-ibig na umabot sa nilalayong kabuuan; mas natural ito sa kasalukuyang Tagalog kaysa 'perpekto' at hindi agad nagpapahiwatig ng ganap na kawalan ng pagkukulang.
- source_word: ἔξω βάλλει
  choice: itinataboy
  rationale: Natural na Tagalog para sa mariing pagpapalayas o pagpapaalis at pinananatili ang talinghaga.
- source_word: κόλασιν ἔχει
  choice: may kalakip na parusa
  rationale: Malapit sa literal na 'may parusa' ngunit mas likas sa Tagalog; pinananatili ang ugnayan nang hindi tahasang ginagawang 'takot sa parusa.'
- source_word: τετελείωται
  choice: hindi pa nagawang ganap
  rationale: Pinananatili ang perfect passive at ang leksikal na kaugnayan nito sa τελεία; ipinapahayag ang kasalukuyang kalagayang bunga ng hindi pa nakukumpletong paghubog.
- source_word: ἐν τῇ ἀγάπῃ
  choice: sa pag-ibig
  rationale: Maikli at natural na salin na nagpapanatili sa ideya ng pagiging nasa saklaw ng pag-ibig.
theological_decisions:
- issue: Kahulugan ng 'ganap na pag-ibig' at 'nagawang ganap'
  choice: Ginamit ang magkaugnay na 'ganap' at 'nagawang ganap.'
  alternative: '''mature na pag-ibig'' / ''hindi pa nahinog sa pag-ibig'' o ''perpektong pag-ibig'' / ''hindi pa naging perpekto'''
  rationale: Pinananatili nito ang ugnayan ng τελεία at τετελείωται at ang tensiyon sa pagitan ng kaganapan ng pag-ibig at ng taong hindi pa nagawang ganap dito, nang hindi ipinapasok ang doktrina ng kawalang-kasalanan.
- issue: Ugnayan ng takot at parusa
  choice: Ang takot ay 'may kalakip na parusa.'
  alternative: '''may parusa'' o ''may kinalaman sa parusa'''
  rationale: Ang Griyego ay siksik at literal na nagsasabing 'may parusa ang takot.' Ang napiling anyo ay likas sa Tagalog ngunit hindi nilulutas kung ang tinutukoy ay taglay, inaasahan, o kaugnay na parusa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang mas teknikal na 'perpekto' at pinili ang 'ganap' upang mapanatili ang ideya ng pag-abot sa nilalayong kabuuan. Ang pang-ugnay na 'Sa halip' ay nagpapalinaw sa ἀλλά nang hindi pinapahaba ang pangungusap.
