  terminology: Ang “ganap na pag-ibig” at “ginawang ganap” ay pinananatili upang maipakita ang leksikal na ugnayan ng τελεία at τετελείωται. Ang “pag-ibig,” “takot,” at “parusa” ay angkop sa modernong Filipino Tagalog at sa rehistro ng sipi.
