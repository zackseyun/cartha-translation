id: 1JN.4.14
reference: 1 John 4:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: tl
  text: At nakita namin at pinatototohanan na isinugo ng Ama ang Anak bilang Tagapagligtas ng sanlibutan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isinugo ng Ama ang Anak, Tagapagligtas ng sanlibutan.”
    reason: Ipinakikita ang mas literal na appositional na kayarian ng Griyego, na walang katumbas na salitang tahasang nangangahulugang “bilang.”
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: At ... namin
  rationale: Pinananatili ng “At” ang ugnayan sa naunang pahayag, habang ipinahihiwatig ng “namin” ang tahasang panghalip na maramihan nang hindi nagiging mabigat ang Filipino.
- source_word: τεθεάμεθα
  choice: nakita namin
  rationale: Natural at malinaw itong katumbas ng perpektong anyo na tumutukoy sa tunay na pagkakita na nananatiling batayan ng kanilang patotoo.
- source_word: μαρτυροῦμεν
  choice: pinatototohanan
  rationale: Ipinapahayag nito ang kasalukuyan at patuloy na pagbibigay-patotoo sa paraang pormal ngunit madaling maunawaan.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng patotoo, hindi ang dahilan nito.
- source_word: ὁ πατήρ
  choice: ang Ama
  rationale: Pinananatili ang relasyonal na katawagan sa Diyos ayon sa gamit ni Juan.
- source_word: ἀπέσταλκεν
  choice: isinugo
  rationale: Ang “isinugo” ay mas angkop sa marangal na konteksto kaysa “ipinadala” at malinaw na nagsasaad ng natapos na pagsusugo na may patuloy na kabuluhan.
- source_word: τὸν υἱόν
  choice: ang Anak
  rationale: Pinananatili ang relasyonal na titulo at hindi idinaragdag ang panghalip na “kanyang,” na wala sa Griyego.
- source_word: σωτῆρα
  choice: Tagapagligtas
  rationale: Ito ang natural at kinikilalang salin ng σωτήρ sa kasalukuyang Filipino, nang hindi nililimitahan ang uri ng pagliligtas.
- source_word: τοῦ κόσμου
  choice: ng sanlibutan
  rationale: Pinananatili ang malawak na saklaw ng κόσμος sa pahayag ni Juan at ang ugnayang genitibo sa “Tagapagligtas.”
- source_word: σωτῆρα τοῦ κόσμου
  choice: bilang Tagapagligtas ng sanlibutan
  rationale: Ginagawang natural sa Filipino ang appositional accusative pagkatapos ng “isinugo ... ang Anak,” habang pinananatili ang tungkulin o pagkakakilanlang ipinahayag sa parirala.
theological_decisions:
- issue: Saklaw ng “Tagapagligtas ng sanlibutan”
  choice: Pinanatili ang malawak na pahayag na “Tagapagligtas ng sanlibutan.”
  alternative: Limitahan ito sa isang partikular na pangkat o ipakahulugang Tagapagligtas lamang sa posibilidad.
  rationale: Hindi nililinaw ng talata ang isang partikular na teorya o saklaw ng paglalapat ng kaligtasan; kaya hindi dapat dagdagan o paliitin ng salin ang mismong pahayag.
- issue: Relasyon ng Ama at ng Anak
  choice: Ginamit ang tuwirang mga titulong “ang Ama” at “ang Anak.”
  alternative: Palawakin bilang “Diyos Ama” at “si Jesu-Cristo.”
  rationale: Ang teksto mismo ay gumagamit ng mga relasyonal na titulo; ang pagdaragdag ng mga pangalan o iba pang titulo ay lalampas sa nakasulat.
- issue: Kahulugan ng appositional na “σωτῆρα”
  choice: Isinalin bilang “bilang Tagapagligtas.”
  alternative: Isalin nang higit na literal bilang “ang Anak, Tagapagligtas ng sanlibutan.”
  rationale: Ang “bilang” ay natural na Filipino at hindi ginagawang tahasang layunin ang pagsusugo gaya ng maaaring gawin ng “upang maging”; itinatala sa talababa ang mas literal na ayos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “isinugo” at “Tagapagligtas” bilang pamilyar na wikang biblikal na hindi lipas o labis na teknikal; iniwasan ang pagpapalawak na doktrinal at pinanatili ang maikli at mariing kayarian ng talata.
