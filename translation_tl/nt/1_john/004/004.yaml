  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: tl
  text: Kayo ay mula sa Diyos, mga anak, at napagtagumpayan ninyo sila[a], sapagkat higit na dakila ang nasa inyo kaysa sa nasa sanlibutan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang mga kalaban na kababanggit lamang, lalo na ang mga huwad na propeta.
    reason: cross_reference
  - marker: b
    text: Hindi tahasang pinapangalanan sa Griyego ang dalawang tinutukoy; ipinahihiwatig ng konteksto ang Diyos o ang kanyang Espiritu para sa una, at ang Masama na nasa likod ng sanlibutan para sa ikalawa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Kayo
  rationale: Hayag at mariin ang panghalip sa Griyego; pinananatili ng “Kayo” sa unahan ang diin nang natural sa Tagalog.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Ipinahahayag ng ἐκ ang pinagmulan o kaugnayang nagmumula sa Diyos; malinaw at likas sa makabagong Tagalog ang “mula sa Diyos.”
- source_word: τεκνία
  choice: mga anak
  rationale: Mapagmahal na pantawag ito ni Juan sa kanyang mga mambabasa. Ang “mga anak” ay magiliw, marangal, at mas natural kaysa sa literal ngunit di-likas na “maliliit na anak.”
- source_word: νενικήκατε
  choice: napagtagumpayan ninyo
  rationale: Ipinahihiwatig ng ganap na aspekto ang tagumpay na natamo at nananatili ang bunga; naipapahayag ito nang maayos ng “napagtagumpayan ninyo.”
- source_word: αὐτούς
  choice: sila
  rationale: Pinananatili ang panghalip at ang pagtukoy nito sa naunang binanggit, sa halip na tukuyin nang higit sa sinasabi ng talata.
- source_word: ὅτι
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan ng kanilang pagtatagumpay; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: μείζων
  choice: higit na dakila
  rationale: Malawak ang kahulugan ng συγκριτικός na ito at hindi lamang tumutukoy sa lakas. Hindi ito pinakikitid sa “mas malakas.”
- source_word: ὁ ἐν ὑμῖν
  choice: ang nasa inyo
  rationale: Pinananatili ang di-tahasang pagkakakilanlan ng substantibong parirala sa Griyego at natural itong pakinggan sa Tagalog.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: ang nasa sanlibutan
  rationale: Sinasalamin nito ang naunang parirala at pinananatiling di-tahas ang tinutukoy, gaya sa Griyego.
- source_word: κόσμῳ
  choice: sanlibutan
  rationale: Karaniwan at marangal na salin ito ng κόσμος sa kontekstong Juanin, nang hindi idinaragdag sa pangunahing teksto ang paliwanag na isang sistemang salungat sa Diyos.
theological_decisions:
- issue: Pagkakakilanlan ng “nasa inyo” at “nasa sanlibutan”
  choice: Iniwan sa pangunahing teksto na di-tahas bilang “ang nasa inyo” at “ang nasa sanlibutan.”
  alternative: Tahasan silang tukuyin bilang Diyos o ang Espiritu Santo, at ang diyablo o masama.
  rationale: Malakas na ipinahihiwatig ng konteksto ang mga pagkakakilanlang iyon, ngunit hindi sila pinapangalanan ng Griyego. Pinananatili ng salin ang tunay na pahiwatig at retorikal na paghahambing nang hindi nagdaragdag ng doktrinal na pagpapaliwanag sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Ginamit ang “mga anak” bilang magiliw na pantawag, at pinanatili ang magkatimbang na mga pariralang “ang nasa inyo” at “ang nasa sanlibutan.”
