base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: tl
  text: 'Ganito nahahayag ang pag-ibig: hindi sa tayo ang umibig sa Diyos, kundi siya ang umibig sa atin at nagsugo ng kanyang Anak bilang handog na pangbayad-sala[a] para sa ating mga kasalanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog na pangbayad-sala” ay maaari ring unawain bilang “handog na pampalubag-loob” o “handog na nag-aalis ng kasalanan.” Ang salitang Griyego ay tumutukoy sa sakripisyong ginawa ng Anak upang harapin ang ating mga kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Ganito nahahayag ang pag-ibig
  rationale: Ang Johannine na pariralang ἐν τούτῳ ay tumuturo sa kasunod bilang malinaw na pagpapakita o pagkakakilanlan ng pag-ibig. Ang “nahahayag” ay likas sa modernong Tagalog at hindi nagpapahiwatig ng sanhi.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: hindi sa ... kundi
  rationale: Pinananatili ang mariing paghahambing ng Griyego at natural itong pakinggan sa Tagalog.
- source_word: ἡμεῖς ἠγαπήκαμεν τὸν θεόν
  choice: tayo ang umibig sa Diyos
  rationale: Ang tahasang “tayo ang” ay naghahatid ng diin sa ἡμεῖς. Ang “umibig” ay angkop na buod sa Tagalog ng perpektong anyo sa loob ng paghahambing, nang hindi nagpapabigat sa pangungusap.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: siya ang umibig sa atin
  rationale: Inililipat ng “siya ang” ang diin ng αὐτός at malinaw na itinatapat ang pagkilos ng Diyos sa pagkilos natin.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: nagsugo ng kanyang Anak
  rationale: Ang “nagsugo” ay natural at marangal, at pinananatili ang mahalagang wika ng pagpapadala sa mga sulat ni Juan.
- source_word: ἱλασμὸν
  choice: handog na pantubos
  rationale: Ipinahahayag nito sa madaling maunawaang Tagalog ang sakripisyong mabisang humaharap sa kasalanan, habang iniiwasang ipako ang salita sa iisang teknikal na paliwanag. Nililinaw sa talababa ang saklaw ng kahulugan.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: sa ating mga kasalanan
  rationale: Sa konteksto ng handog, likas na ipinapahayag ng “sa” ang kaugnayan ng handog sa ating mga kasalanan.
theological_decisions:
- issue: Ang kahulugan ng ἱλασμός sa konteksto ng pagtubos
  choice: handog na pantubos
  alternative: handog na pampalubag-loob; handog na nag-aalis ng kasalanan
  rationale: Ang ἱλασμός ay tumutukoy sa sakripisyong pagharap ng Anak sa mga kasalanan, ngunit pinagtatalunan kung dapat idiin ang pagpapalubag ng galit, pag-aalis ng kasalanan, o ang mas malawak na bisa ng pagtubos. Pinananatili ng pangunahing salin ang sentrong ideya at inilalahad sa talababa ang mga posibleng diin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Ganito nahahayag” upang maging natural ang idiomatikong pambungad, at “siya ang” upang mapanatili ang diin ng paghahambing. Ang talababa ay sadyang nagpapanatili sa saklaw at teolohikal na tensiyon ng ἱλασμός.
