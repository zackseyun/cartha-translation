id: 1JN.4.17
reference: 1 John 4:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: tl
  text: Sa ganitong paraan[a], ang pag-ibig ay naging ganap sa atin, upang magkaroon tayo ng lakas ng loob[b] sa araw ng paghuhukom, sapagkat kung ano siya[c], gayon din tayo sa mundong ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa pamamagitan nito” o “Dito.” Ang pariralang Griyego ay maaaring tumukoy sa paraan, batayan, o kalagayan kung saan nagiging ganap ang pag-ibig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagtitiwala” o “katapangan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “siya” ay malamang na tumutukoy kay Jesus; nauunawaan naman ito ng ilan bilang pagtukoy sa Diyos sa mas pangkalahatang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganitong paraan
  rationale: Likas sa modernong Tagalog at napapanatili ang posibleng kahulugang paraan o batayan, habang iniiwasang tukuyin nang labis kung pabalik o pasulong ang tinutukoy.
- source_word: τετελείωται
  choice: ay naging ganap
  rationale: Ipinahihiwatig ang kilos na nakumpleto at ang nananatiling bunga nito; tumutukoy sa pag-ibig na naabot ang nilalayong kaganapan, hindi sa pagwawasto ng kapintasan.
- source_word: ἡ ἀγάπη μεθ’ ἡμῶν
  choice: ang pag-ibig ay naging ganap sa atin
  rationale: Ang “sa atin” ay natural ngunit nananatiling maluwag kung ito ay nasa ugnayan natin, nasa gitna natin, o nahahayag sa ating buhay; hindi nililimitahan ang pag-ibig sa iisang direksiyon.
- source_word: παρρησίαν
  choice: lakas ng loob
  rationale: Karaniwang Tagalog para sa malaya at walang-takot na pagtitiwala sa harap ng paghuhukom.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: sa araw ng paghuhukom
  rationale: Likas at karaniwang eskatolohikal na parirala sa Tagalog.
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: kung ano siya, gayon din tayo
  rationale: Pinananatili ang kasalukuyang panahunan at ang paghahambing, nang hindi dinaragdagan kung sa anong tiyak na katangian magkatulad.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: sa mundong ito
  rationale: Tuwirang tumutukoy sa kasalukuyang larangan ng buhay ng tao.
theological_decisions:
- issue: Tinutukoy ng ἐκεῖνος (“siya”)
  choice: Pinanatiling “siya”; malamang na tumutukoy kay Jesus/sa Anak
  alternative: Maaaring unawain bilang pagtukoy sa Diyos sa mas pangkalahatang paraan
  rationale: Sa 1 Juan, madalas gamitin ang ἐκεῖνος para kay Jesus, ngunit hindi tahasang pinapangalanan ng talata ang tinutukoy kaya pinananatili ang panghalip at nilalagyan ng talababa.
- issue: Kahulugan ng pag-ibig na naging ganap
  choice: Ang pag-ibig ay umabot sa nilalayong kaganapan kaugnay ng mga mananampalataya
  alternative: Ang pag-ibig natin sa Diyos ay naging lubos na sakdal, o ang pag-ibig lamang ng Diyos sa atin ang naging ganap
  rationale: Hindi nilulutas ng Griyego kung kaninong pag-ibig o anong direksiyon nito ang eksklusibong tinutukoy; pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sa ganitong paraan” sa halip na literal ngunit alanganing “Dito,” at “lakas ng loob” para sa natural na pagpapahayag ng παρρησία. Pinanatili ang mga kalabuan tungkol sa saklaw ng “sa atin,” sa tinutukoy ng “siya,” at sa tiyak na aspeto ng paghahambing.
