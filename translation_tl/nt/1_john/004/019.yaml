  terminology: Magkakatugma ang “umiibig” at “umibig,” at hindi ipinapasok ang isang tiyak na layon na wala sa pangunahing tekstong Griyego. Wasto at malinaw rin ang footnote sa tekstuwal na baryante; ipinakikita nitong ang “siya” ay bahagi ng ilang manuskrito, hindi ng SBLGNT na pangunahing teksto.
