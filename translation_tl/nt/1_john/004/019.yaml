  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: tl
  text: Tayo ay umiibig sapagkat siya ang unang umibig sa atin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Iniibig natin siya sapagkat siya ang unang umibig sa atin.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Tayo
  rationale: Ang tahasang panghalip ay nagpapanatili ng bahagyang diin sa simuno, at natural ito sa modernong Filipino.
- source_word: ἀγαπῶμεν
  choice: umiibig
  rationale: Pinananatili ng pangkasalukuyang anyo ang patuloy o karaniwang katangian ng pag-ibig at ang leksikal na ugnayan sa ἠγάπησεν.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Ginagamit dito bilang panandang sanhi: ang naunang pag-ibig ng Diyos ang batayan ng ating pag-ibig.'
- source_word: αὐτὸς
  choice: siya
  rationale: Tumutukoy sa Diyos ayon sa konteksto; sapat na natural ang panghalip nang hindi labis na dinaragdagan ang diin.
- source_word: πρῶτος
  choice: ang unang
  rationale: Malinaw na ipinahahayag ang temporal na pangunguna ng kanyang pag-ibig at natural na kaagapay ng pandiwang Filipino.
- source_word: ἠγάπησεν
  choice: umibig
  rationale: Ang aorist ay inilalarawan bilang naunang tiyak na pagkilos, na natural na naihahayag sa Filipino sa anyong perpektibo.
- source_word: ἡμᾶς
  choice: sa atin
  rationale: Ang pokus na pandiwang umibig ay likas na kumukuha ng layon sa pariralang may 'sa'; inklusibo ang 'atin' alinsunod sa 'tayo'.
theological_decisions:
- issue: Kung lalagyan ng tahasang layon ang “tayo ay umiibig”
  choice: 'Hindi tinukoy ang layon: “Tayo ay umiibig”'
  alternative: “Iniibig natin siya” o “Iniibig natin ang Diyos”
  rationale: 'Walang tahasang layon ang ἀγαπῶμεν sa SBLGNT. Ang hindi pagtukoy rito ay nagpapanatili sa tunay na lawak at tensiyon ng teksto: maaaring saklaw ang pag-ibig sa Diyos at sa kapwa, habang ang pag-ibig ng Diyos ang pinagmumulan nito.'
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Ginamit ang “umiibig” sa halip na mas kolokyal na “nagmamahal” upang mapanatili ang siksik na pag-uugnay ng magkaparehong pandiwang Griyego sa dalawang sugnay.
