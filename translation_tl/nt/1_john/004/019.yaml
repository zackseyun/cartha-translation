  source_fidelity: 'Tapat ang salin sa SBLGNT: ang tahasang simuno na “Tayo” ay tumutugon sa ἡμεῖς; ang “umiibig” ay walang idinagdag na layon, gaya ng ἀγαπῶμεν; at malinaw na sanhi at temporal na pangunguna ang “sapagkat siya ang unang umibig sa atin.”'
