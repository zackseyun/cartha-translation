  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: tl
  text: Ang hindi umiibig ay hindi nakakilala sa Diyos[a], sapagkat ang Diyos ay pag-ibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang hindi umiibig ay hindi nakakakilala sa Diyos.” Maaaring ipahayag nang payak sa pangkasalukuyan ang Griyegong aorist, ngunit ipinakikita ng “hindi nakakilala” na hindi siya dumating sa pagkilala sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Ang hindi umiibig
  rationale: Ang artikulo at pangkasalukuyang participle ay tumutukoy sa sinumang taong kakikitaan ng patuloy o kinagawiang hindi pag-ibig. Likas sa Tagalog ang pangkalahatang anyong “Ang hindi umiibig.”
- source_word: ἀγαπῶν
  choice: umiibig
  rationale: Pinananatili ng pandiwang “umiibig” ang ugnayang leksikal sa pangngalang “pag-ibig” para sa ἀγάπη.
- source_word: οὐκ ἔγνω
  choice: ay hindi nakakilala
  rationale: Ipinahihiwatig ng aorist sa konteksto na ang taong hindi umiibig ay hindi dumating sa tunay at relasyonal na pagkilala sa Diyos. Ang “hindi nakakilala” ay mas natural kaysa “hindi nakilala” para sa ganitong pangkalahatang pahayag, habang pinananatili ang puwang para sa mas payak na “hindi nakakakilala” sa talababa.
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Karaniwang Tagalog na anyo ng layon ng pandiwang “nakakilala,” na nangangailangan ng “sa.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng naunang pahayag at ang “sapagkat” ay angkop sa marangal ngunit makabagong rehistro.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang paksa ng sugnay; kailangan ang panandang “ang” sa natural na Tagalog.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Pinananatili ang abstraktong pangngalan at ang leksikal na kaugnayan nito sa “umiibig,” sa halip na pahinain ito bilang “mapagmahal.”
- source_word: ἐστίν
  choice: ay
  rationale: Payak na pangawing na tapat sa predikatibong pahayag ng Griyego.
theological_decisions:
- issue: Diwa ng “ang Diyos ay pag-ibig”
  choice: Pinanatili bilang predikatibong pahayag tungkol sa likas o katangian ng Diyos, nang hindi ginagawang lubos at eksklusibong depinisyon.
  alternative: “Mapagmahal ang Diyos” o “Ang pag-ibig ay Diyos”
  rationale: Sa Griyego, ang Diyos ang paksa at ang pag-ibig ang panaguri. Ang “ang Diyos ay pag-ibig” ay nagpapanatili ng bigat ng pangngalang ἀγάπη at hindi binabaligtad ang pahayag.
- issue: Aspekto at uri ng pagkilala sa Diyos
  choice: “hindi nakakilala sa Diyos” bilang pagkilalang relasyonal na hindi narating o naranasan
  alternative: “hindi nakakakilala sa Diyos” o “hindi nakaunawa sa Diyos”
  rationale: Ang ἔγνω ay aorist at sa mga sulat ni Juan ay karaniwang tumutukoy sa relasyonal na pagkilala na nahahayag sa pamumuhay. Hindi ito dapat paliitin tungo sa intelektuwal na pagkaunawa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uugnay ng “umiibig” at “pag-ibig,” gayundin ang matinding predikatibong pahayag na “ang Diyos ay pag-ibig.”
