  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: tl
  text: At nakilala na natin at pinaniwalaan ang pag-ibig ng Diyos na nasa atin.[a] Ang Diyos ay pag-ibig. Ang nananatili sa pag-ibig ay nananatili sa Diyos, at ang Diyos ay nananatili sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pag-ibig na taglay ng Diyos sa atin” o “ang pag-ibig ng Diyos na nahahayag sa gitna natin.” Maaaring tumukoy ang pariralang Griyego sa pag-ibig na nasa mga mananampalataya o nakikita sa kanilang kalipunan.
    reason: alternative_reading
  - marker: b
    text: Ang panghalip sa Griyego ay panlalaking isahan at tumutukoy sa “ang nananatili sa pag-ibig”; ginagamit ito bilang kumakatawan sa sinumang gayong tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: nakilala na natin
  rationale: Ipinahahayag ng aspektong perpekto ang pagkilalang naganap na at nananatili ang bunga sa kasalukuyan; ang “na” ay likas na paraan sa Tagalog upang ipahiwatig ito.
- source_word: πεπιστεύκαμεν
  choice: pinaniwalaan
  rationale: Pinananatili ang pag-ibig bilang tuwirang layon ng pandiwa at ipinahahayag ang matatag na paniniwalang bunga ng nakaraang pagkilos.
- source_word: τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: ang pag-ibig ng Diyos na nasa atin
  rationale: Pinananatili ang lokatibong puwersa ng ἐν ἡμῖν nang hindi ito agad ginagawang “para sa atin”; maaari itong tumukoy sa pag-ibig na nasa mga mananampalataya o nahahayag sa kanilang kalipunan.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Ang Diyos ay pag-ibig
  rationale: Tuwirang salin ng panaguring pangngalan nang walang dagdag na paliwanag.
- source_word: ὁ μένων
  choice: ang nananatili
  rationale: Ang “nananatili” ay natural sa makabagong Tagalog at pinananatili ang mahalagang temang Johannine ng patuloy na pananatili.
- source_word: ἐν τῇ ἀγάπῃ
  choice: sa pag-ibig
  rationale: Natural na Tagalog para sa pamumuhay o pananatili sa saklaw ng pag-ibig na tinutukoy sa konteksto.
- source_word: ἐν τῷ θεῷ μένει
  choice: nananatili sa Diyos
  rationale: Pinananatili ang lokatibo at ang pagkakapare-pareho ng salin sa μένω.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: ang Diyos ay nananatili sa kanya
  rationale: Ang “kanya” ay natural na panghalip sa Tagalog at hindi nagtatakda ng kasarian, bagaman ang Griyego ay panlalaking isahan na tumutukoy pabalik sa sinumang nananatili.
theological_decisions:
- issue: Kahulugan ng ἐν ἡμῖν sa unang pangungusap
  choice: 'lokatibo: “nasa atin”'
  alternative: “para sa atin” o “sa gitna natin”
  rationale: Ang ἐν ay pangunahing lokatibo. Pinananatili ng “nasa atin” ang posibilidad ng panloob na presensiya at pangkomunidad na paghahayag ng pag-ibig, sa halip na lutasin ang parirala bilang benepaktibong “para sa atin.”
- issue: Tumutukoy na puwersa ng αὐτῷ
  choice: “sa kanya”
  alternative: “sa taong iyon”
  rationale: Tumutukoy ito sa isahang “ang nananatili.” Ang “kanya” ay maikli at likas sa Tagalog, habang ang pangkalahatang saklaw ng parirala ay nananatili.
- issue: Magkapalit na pananatili ng tao at ng Diyos
  choice: inuulit ang “nananatili” sa dalawang sugnay
  alternative: pagsamahin o ipakahulugan bilang simpleng pakikipag-ugnayan
  rationale: Pinananatili ng pag-uulit ang simetriya at teolohikal na tensiyon ng mutual indwelling sa tekstong Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nananatili” sa halip na mas tradisyonal ngunit di-gaanong pangkaraniwang “nananahan” upang mapanatili ang paulit-ulit na bokabularyo ng μένω. Hiniwalay sa bagong pangungusap ang “Ang Diyos ay pag-ibig” upang maging malinaw at mabigat ang pahayag.
