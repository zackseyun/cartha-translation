  source_fidelity: Tumpak na naihahatid ng salin ang pangkalahatang kondisyon ng ὃς ἐὰν, ang hayag na pagkilala sa nilalaman ng pagpapahayag (ὁμολογήσῃ ὅτι), ang titulong “ang Anak ng Diyos,” at ang magkatugong pananatili ng Diyos at ng taong nagpapahayag. Wasto ring hindi inuulit sa ikalawang sugnay ang pandiwang “nananatili,” sapagkat ellipsis ito sa Griyego at malinaw na nauunawaan sa Filipino.
  naturalness: Natural at marangal ang modernong Filipino. Ang “Ang sinumang nagpapahayag na si Jesus ang Anak ng Diyos” ay maayos na konstruksyon, at ang “siya naman sa Diyos” ay malinaw na naghahayag ng katumbas na tugon nang hindi mabigat o paulit-ulit.
  terminology: Ang “Anak ng Diyos” ay angkop at pinananatili ang titulong kristolohikal. Ang “nagpapahayag” ay katanggap-tanggap na katumbas ng ὁμολογέω sa kontekstong ito, dahil naipahihiwatig nito ang hayag na pagkilala. Ang “nananatili” ay tumpak at modernong salin ng μένω; ang talababa ay nagbibigay ng lehitimong alternatibong “nananahan.”
