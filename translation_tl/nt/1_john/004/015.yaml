id: 1JN.4.15
reference: 1 John 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: tl
  text: Ang sinumang nagpapahayag na si Jesus ang Anak ng Diyos, nananatili[a] sa kanya ang Diyos, at siya naman sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nananahan.” Ang pandiwang Griyego na menō ay mahalagang salita sa mga akda ni Juan at maaaring isaling “manatili” o “manahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Ang sinumang
  rationale: 'Likas na ipinapahayag sa Filipino ang di-tiyak at pangkalahatang diwa ng sugnay: sinumang tumutupad sa kondisyong binanggit.'
- source_word: ὁμολογήσῃ
  choice: nagpapahayag
  rationale: Ipinapanatili nito ang diwa ng hayag na pagkilala o pagpapahayag ng katotohanan tungkol kay Jesus. Ang pangkasalukuyang anyo ay natural sa Filipino para sa pangkalahatang kondisyong binubuo ng ἐάν at ng aorist subjunctive.
- source_word: ὅτι
  choice: na
  rationale: Tuwirang ipinakikilala ang nilalaman ng ipinahahayag.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Pinananatili ang tiyak at mahalagang titulong kristolohikal nang walang pagpapaliwanag o pagpapalawak.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang salin ng tiyak na simuno.
- source_word: ἐν αὐτῷ μένει
  choice: nananatili sa kanya
  rationale: Ang “nananatili” ay malinaw at modernong katumbas ng μένω at pinananatili ang patuloy at ugnayang diwa nito sa mga sulat ni Juan.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: at siya naman sa Diyos
  rationale: Pinananatili ang elipsis ng Griyego, kung saan nauunawaan mula sa unang sugnay ang pandiwang “nananatili.” Ang “naman” ay likas na naghahayag ng tugunang balanse nang hindi nagdaragdag ng bagong kahulugan.
theological_decisions:
- issue: Kapwa pananatili ng Diyos at ng tao
  choice: “nananatili sa kanya ang Diyos, at siya naman sa Diyos”
  alternative: “nananahan sa kanya ang Diyos, at siya naman sa Diyos”
  rationale: Pinananatili ang tugunang pahayag ng teksto tungkol sa Diyos at sa taong nagpapahayag, nang hindi ito ipinapaliwanag bilang ibang uri ng kaugnayan o nilulutas ang teolohikal na tensiyon.
- issue: Titulong kristolohikal
  choice: “ang Anak ng Diyos”
  alternative: “Anak ng Diyos”
  rationale: Pinananatili ng tiyak na parirala ang malinaw na titulong ibinibigay kay Jesus sa Griyego, nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “nagpapahayag” upang mapanatili ang hayag na bigat ng ὁμολογέω, at ang “nananatili” bilang malinaw na pangunahing salin ng μένω. Ang panghalip na “kanya” ay sumusunod sa pangkalahatang “sinuman” at hindi nililinaw ang kasarian na likas na hindi kailangang tukuyin sa Filipino.
