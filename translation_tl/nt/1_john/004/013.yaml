  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: tl
  text: 'Sa pamamagitan nito, nalalaman natin na nananatili tayo sa kanya at nananatili siya sa atin: sapagkat nagbigay siya sa atin mula sa kanyang Espiritu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Dito natin nalalaman.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kanyang Espiritu.” Ipinahihiwatig ng Griyegong ἐκ ang pinagmulan at maaaring magkaroon ng partitive na diwa; hindi tinutukoy ng pahayag kung ano mismo ang ibinigay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Sa ganito
  rationale: Likas na pormulang Filipino para sa paraan o katibayang batayan ng pagkilala; pinananatili rin ang posibleng di-tiyak na pagtukoy ng τούτῳ.
- source_word: γινώσκομεν
  choice: natin nalalaman
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang patuloy na kaalaman o katiyakan; natural ang inklusibong ayos na ito sa Filipino.
- source_word: ἐν αὐτῷ μένομεν
  choice: nananatili tayo sa kanya
  rationale: Ang “nananatili” ay malinaw, kasalukuyan, at pinananatili ang mahalagang Johannine na diwa ng patuloy na ugnayan.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: at siya sa atin
  rationale: Pinananatili ang maikli at parallel na ayos ng Griyego, kung saan ipinahihiwatig mula sa unang sugnay ang pandiwang “nananatili.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Ang ikalawang ὅτι ay natural na inuunawa rito bilang nagpapakilala sa batayan o dahilan ng pagkakilala.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: ng bahagi mula sa kanyang Espiritu
  rationale: Ang “mula sa” ay pinananatili ang diwa ng pinagmulan sa ἐκ; idinagdag ang “bahagi” upang maging maayos sa Filipino ang partitive na pagkakabuo nang hindi ipinapalagay na ang Espiritu ay nahahati.
- source_word: δέδωκεν ἡμῖν
  choice: binigyan niya tayo
  rationale: Natural na Filipino para sa perpektong kilos na may nananatiling bunga; naipahihiwatig ng konteksto ang patuloy na epekto.
theological_decisions:
- issue: Tinutukoy ng “kanyang” at pagkakakilanlan ng πνεῦμα
  choice: Ang “kanyang Espiritu” ay tumutukoy sa Espiritu ng Diyos at ginagamitan ng malaking titik.
  alternative: “kanyang espiritu” bilang pangkalahatang espirituwal na kaloob o disposisyon
  rationale: Sa konteksto ng 1 Juan, ang Espiritu na kaloob ng Diyos ang katibayan ng magkatuwang na pananatili ng Diyos at ng mga mananampalataya.
- issue: Wika ng magkatuwang na pananatili
  choice: “nananatili tayo sa kanya at siya sa atin”
  alternative: “nanunahan tayo sa kanya at siya sa atin” o tahasang ulitin ang “nananatili” sa ikalawang sugnay
  rationale: Pinananatili nito ang reciprocity at siksik na parallelismo ng Griyego nang hindi nagpapalawak ng teksto.
- issue: Diwa ng ἐκ τοῦ πνεύματος αὐτοῦ
  choice: “ng bahagi mula sa kanyang Espiritu”
  alternative: “ng kanyang Espiritu”
  rationale: Iniiwasang burahin ang ἐκ bilang tanda ng pinagmulan, habang nililinaw sa Filipino ang di-karaniwang partitive na pahayag. Hindi nito ibig sabihing nahahati ang Espiritu.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nananatili” para sa mahalagang terminong Johannine na μένω at iniwasan ang lipas o labis na teknikal na pananalita.
