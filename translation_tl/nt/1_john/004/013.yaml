  to: 'Sa pamamagitan nito, nalalaman natin na nananatili tayo sa kanya at nananatili siya sa atin: sapagkat nagbigay siya sa atin mula sa kanyang Espiritu.[a][b]'
  rationale: Inalis ang “ng bahagi,” sapagkat ito ay dagdag na pagtukoy na wala sa Griyego. Pinalitan ang pambungad ng mas natural na evidential na pormulang Filipino at inulit ang ipinahihiwatig na pandiwang “nananatili” upang maging malinaw at idiomatiko, nang walang pagbabago sa kahulugan. Inayos din ang talababa upang ipaliwanag ang ἐκ nang hindi nagdaragdag ng interpretibong depensa.
