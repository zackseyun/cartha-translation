base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: tl
  text: Mga minamahal[a], kung inibig tayo ng Diyos nang ganito, dapat din nating ibigin ang isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mga minamahal, yamang inibig tayo ng Diyos nang ganito.” Gumagamit ang Griyego ng kondisyunal na anyong “kung,” ngunit malamang na ipinapalagay sa konteksto na totoo ang kondisyon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Mga minamahal
  rationale: Tuwirang pantawag na maramihan; pinananatili nito ang ugnayang leksikal sa mga anyo ng ἀγαπάω sa talata at ang magiliw ngunit marangal na tono ni Juan.
- source_word: εἰ
  choice: kung
  rationale: Pinananatili ang kondisyunal na anyo ng Griyego, bagaman ipinapalagay na totoo ang kondisyon sa konteksto.
- source_word: οὕτως
  choice: gayon
  rationale: Maaaring tumukoy kapuwa sa paraan at tindi ng pag-ibig ng Diyos at natural na bumabalik sa naunang konteksto.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Karaniwang salin ng tahasang simuno.
- source_word: ἠγάπησεν
  choice: inibig
  rationale: Ipinahahayag ang naganap na pagkilos at pinananatili ang iisang bokabularyo ng pag-ibig sa buong talata.
- source_word: ἡμᾶς
  choice: tayo
  rationale: Ang pokus na anyong 'tayo' ang natural na katumbas bilang layon ng pandiwang aktor-pokus na 'inibig'.
- source_word: καὶ ἡμεῖς
  choice: dapat din nating
  rationale: Ang 'din' ay kumakatawan sa καί, at ang 'natin' sa 'nating' ay nagpapanatili sa hayag at bahagyang idiniing inklusibong simuno.
- source_word: ὀφείλομεν
  choice: dapat
  rationale: Malinaw na naghahatid ng moral na pananagutan nang hindi pinatitindi sa isang tuwirang utos.
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: Natural at pamantayang katumbas ng panghalip na tugunan.
- source_word: ἀγαπᾶν
  choice: ibigin
  rationale: Komplementaryong pawatas na natural kasunod ng 'dapat' at nagpapanatili ng pag-uulit sa ugat ng salitang pag-ibig.
theological_decisions:
- issue: Lakas ng kondisyunal na sugnay na εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Panatilihin ang 'kung' sa pangunahing teksto.
  alternative: Yamang inibig tayo ng Diyos sa ganitong paraan
  rationale: Ipinapalagay ng konteksto na tunay ang pag-ibig ng Diyos, ngunit kondisyunal pa rin ang pormang Griyego. Pinananatili ng 'kung' ang retorikal na puwersa at hindi ginagawang tahasang sanhi ang pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang 'Mga minamahal' ay angkop na tuwirang pantawag at sadyang inuugnay sa 'inibig' at 'ibigin.'
