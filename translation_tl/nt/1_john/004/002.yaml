id: 1JN.4.2
reference: 1 John 4:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: tl
  text: 'Dito ninyo nakikilala ang Espiritu ng Diyos: ang bawat espiritung kumikilala na ang Mesiyas na si Jesus[a] ay naparito sa laman[b] ay mula sa Diyos.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “si Jesu-Cristo.” Ang salitang Griyego na Χριστός ay titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “kumikilala kay Jesus na Mesiyas bilang naparito sa laman.” Gumamit ang Griyego ng perfect participle, na maaaring magbigay-diin sa nananatiling kabuluhan ng pagparito niya sa tunay na laman ng tao.
    reason: source_form_and_ambiguity
  - marker: c
    text: 'Maaari ring unawain ang “nakikilala” bilang pautos: “Dito ninyo kilalanin ang Espiritu ng Diyos.” Magkapareho ang anyo ng pandiwang Griyego para sa dalawang pagbasa.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Dito
  rationale: 'Likas na panandang Filipino para ipakilala ang batayan o paraang kasunod: “sa pamamagitan nito” o “sa ganitong paraan.”'
- source_word: γινώσκετε
  choice: ninyo nakikilala
  rationale: Pinananatili ang aspektong pangkasalukuyan at ang diwa ng pagkilala o pagkilatis, hindi lamang ng pag-alam sa isang impormasyon.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: ang Espiritu ng Diyos
  rationale: Ang tiyak na parirala sa konteksto ay tumutukoy sa Espiritu ng Diyos; ang malaking titik ay naaayon sa karaniwang gamit sa Filipino.
- source_word: πᾶν πνεῦμα
  choice: ang bawat espiritu
  rationale: Ipinahahayag ang distributibong saklaw sa lahat ng espiritung sinusubok, tunay man o huwad.
- source_word: ὁμολογεῖ
  choice: kumikilala
  rationale: Natural sa modernong Filipino at taglay ang diwa ng hayagang pagkilala o pagpapahayag ng paninindigan.
- source_word: Ἰησοῦν Χριστόν
  choice: ang Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at inaayos ang parirala ayon sa natural na balangkas ng Filipino.
- source_word: ἐν σαρκὶ
  choice: sa laman
  rationale: Pinananatili ang kongkretong salitang “laman,” na mariing nagpapahayag ng tunay na pagparito bilang tao nang hindi nagdaragdag ng teknikal na terminolohiyang teolohikal.
- source_word: ἐληλυθότα
  choice: ay naparito
  rationale: Ang “naparito” ay natural na Filipino para sa ganap na pagparito at maaari ring magpahiwatig ng nananatiling kabuluhan ng pangyayaring iyon.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: ay mula sa Diyos
  rationale: Malinaw na ipinahahayag ang pinagmulan, na siyang pangunahing diwa ng ἐκ.
theological_decisions:
- issue: Kung ang τὸ πνεῦμα τοῦ θεοῦ ay tiyak na Espiritu ng Diyos o isang espiritung nagmula sa Diyos
  choice: Espiritu ng Diyos
  alternative: espiritung mula sa Diyos
  rationale: Ang pantukoy, isahan, at paghahambing nito sa “bawat espiritu” sa kasunod na sugnay ay pumapabor sa pagtukoy sa sariling Espiritu ng Diyos.
- issue: Ang puwersang kristolohikal ng ἐν σαρκὶ ἐληλυθότα
  choice: naparito sa laman
  alternative: dumating bilang tao
  rationale: Pinananatili nito ang mismong kongkretong wika ng Griyego at ang pagpapatunay sa tunay na pagkakatawang-tao, nang hindi ipinapasok sa teksto ang mas huling teknikal na pananalita.
- issue: Ang ugnayan ng ὁμολογεῖ sa Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα
  choice: kumikilala na ang Mesiyas na si Jesus ay naparito sa laman
  alternative: kumikilala kay Jesus na Mesiyas bilang naparito sa laman
  rationale: Ginagawang natural sa Filipino ang akusatibo at participle habang pinananatili na ang nilalaman ng pagkilala ay si Jesus bilang Mesiyas na tunay na naparito sa laman.
- issue: Kung ang γινώσκετε ay pasalaysay o pautos
  choice: 'pasalaysay: “ninyo nakikilala”'
  alternative: 'pautos: “kilalanin ninyo”'
  rationale: Magkapareho ang anyong Griyego para sa present indicative at imperative, ngunit mas maayos sa daloy ang pasalaysay na nagpapakilala sa pamantayan ng pagkilatis. Itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Pinili ang “Dito ninyo nakikilala” bilang maikli at natural na pambungad; ginamit ang “Mesiyas na si Jesus” upang malinaw na manatiling titulo ang Χριστός. Ang “laman” ay sadyang pinanatili upang hindi pahinain ang kongkreto at teolohikal na diin ng orihinal.
