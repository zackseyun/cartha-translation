  naturalness: Ang binagong pangungusap ay mas idiomatiko sa makabagong Filipino, habang pinananatili ang marangal at tuwirang rehistro. Ang magkakaugnay na “iniibig/umiibig/ibigin” ay nananatiling malinaw.
  terminology: Ang “Diyos,” “kapatid,” “napopoot,” at “sinungaling” ay angkop. Ang “kapatid” ay wastong pangunahing salin ng ἀδελφός; ang talababa ay nag-iingat ng posibleng inklusibong gamit nang hindi ito ipinapasok bilang pagpapakahulugan sa pangunahing teksto.
