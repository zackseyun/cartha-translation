base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: tl
  text: Kung may magsabi, “Iniibig ko ang Diyos,” at napopoot siya sa kanyang kapatid[a], sinungaling siya. Sapagkat ang hindi umiibig sa kanyang kapatid na nakita na niya ay hindi kayang ibigin ang Diyos na hindi niya nakita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapatid na lalaki o babae.” Sa Griyego, panlalaking isahan ang “kapatid” (adelphon), ngunit maaari itong gamitin nang kumakatawan sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Kung sabihin ng sinuman
  rationale: Ipinapahayag ng ἐάν kasama ng aorist subjunctive ang isang pangkalahatang kondisyon; pinananatili ng “sinuman” ang di-tiyak na saklaw ng τις.
- source_word: Ἀγαπῶ / ἀγαπῶν / ἀγαπᾶν
  choice: Iniibig / umiibig / makaiibig
  rationale: Pinananatili ng magkakaugnay na anyo ng “ibig” ang malinaw na pag-uulit ng ἀγαπάω sa buong talata. Ang “makaiibig” ay likas na Filipino at naghahatid ng kakayahang ipinahihiwatig ng δύναται.
- source_word: τὸν θεόν
  choice: ang Diyos
  rationale: Tuwirang katumbas at natural na pagtukoy sa Diyos sa Filipino.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: kanyang kapatid
  rationale: Ang “kapatid” ang natural na salin ng ἀδελφός sa Filipino at maaari ring gamitin para sa kapwa mananampalataya. Hindi nito minamarkahan ang kasarian gaya ng panlalaking anyo sa Griyego, kaya nililinaw iyon sa talababa.
- source_word: μισῇ
  choice: napopoot
  rationale: Ang “napopoot” ay naghahatid ng kasalukuyan at patuloy na saloobin ng present subjunctive nang hindi pinahihina ang matinding kahulugan ng μισέω.
- source_word: ψεύστης ἐστίν
  choice: sinungaling siya
  rationale: Pinananatili ang tahasang pangngalang panaguri at ang mariing moral na hatol ni Juan, sa halip na gawing simpleng “nagsisinungaling.”
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: Sapagkat ang hindi umiibig
  rationale: Ang articular participle ay ginawang substantibong parirala, at ang “Sapagkat” ay nagpapanatili sa paliwanag na tungkulin ng γάρ.
- source_word: ὃν ἑώρακεν
  choice: na nakita na niya
  rationale: Ang “nakita na niya” ay natural na naghahatid ng perpektong aspekto ng ἑώρακεν—isang pagkakitang naganap na at may kaugnayan sa kasalukuyan.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: hindi makaiibig
  rationale: Pinananatili nito ang mariing kawalan ng kakayahan o posibilidad na ipinahahayag ng οὐ δύναται, hindi lamang isang praktikal na kahirapan.
theological_decisions:
- issue: Saklaw ng ἀδελφός sa konteksto ng pamayanan ng mga mananampalataya
  choice: kapatid
  alternative: kapatid na lalaki; kapwa mananampalataya
  rationale: Ang “kapatid” ang natural at marangal na anyo sa Filipino at hindi labis na nagpapakahulugan. Dahil panlalaking isahan ang anyong Griyego ngunit maaaring kumatawan sa kapatid na lalaki o babae sa konteksto, pinananatili ang impormasyong iyon sa talababa.
- issue: Lakas ng οὐ δύναται ἀγαπᾶν
  choice: hindi makaiibig sa Diyos
  alternative: hindi kayang umibig sa Diyos
  rationale: Ipinapahayag ng teksto ang mariing moral at espirituwal na imposibilidad sa pangangatwiran ni Juan. Hindi ito pinalalambot bilang simpleng kahirapan, at hindi rin dinaragdagan ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “ibig,” ang matinding paghaharap ng pag-ibig at pagkapoot, at ang tahasang pahayag na “sinungaling siya.” Ginamit ang “ngunit” para sa kontekstuwal na salungatan ng καί.
