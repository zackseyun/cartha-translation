  - severity: low
    issue: “Kung sabihin ng sinuman”
    rationale: Gramatikal ito ngunit hindi gaanong likas sa Filipino. Ang “Kung may magsabi” ay mas natural para sa ἐάν τις εἴπῃ.
  - severity: low
