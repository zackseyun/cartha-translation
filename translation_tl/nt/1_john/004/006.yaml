id: 1JN.4.6
reference: 1 John 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: tl
  text: Kami ay mula sa Diyos. Ang nakakakilala sa Diyos ay nakikinig sa amin; ang hindi mula sa Diyos ay hindi nakikinig sa amin.[a] Sa pamamagitan nito, nakikilala natin ang Espiritu ng katotohanan[b][c] at ang espiritu ng kamalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “naririnig kami” sa dalawang paglitaw; ang pandiwang Griyego ay maaaring tumukoy sa pagkarinig, ngunit dito ay malamang na nangangahulugang pagtanggap at pagbibigay-pansin sa patotoong ipinahahayag namin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “espiritu ng katotohanan.” Walang pagkakaiba ang malaki at maliit na titik sa sinaunang tekstong Griyego; bagaman karaniwang tumutukoy ang pariralang ito sa Banal na Espiritu sa mga sulat ni Juan, maaari rin itong basahin sa mas pangkalahatang diwa.
    reason: alternative_reading
  - marker: c
    text: Ihambing ang “Espiritu ng katotohanan” sa Juan 14:17; 15:26; 16:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Pinananatili ng “mula sa” ang diwa ng ἐκ bilang pinagmulan, na mahalaga sa paghahambing sa pagitan ng mga nagmumula sa Diyos at ng mga hindi.
- source_word: ὁ γινώσκων τὸν θεὸν
  choice: ang nakakakilala sa Diyos
  rationale: Ipinahahayag nito ang pangkalahatan at patuloy na katangian ng substantival present participle, at likas sa Tagalog ang “nakakakilala” para sa pagkilalang may kaugnayan, hindi lamang kaalamang pangkaisipan.
- source_word: ἀκούει ἡμῶν
  choice: nakikinig sa atin
  rationale: Bagaman maaaring mangahulugang simpleng “naririnig,” ipinahihiwatig ng konteksto ang pagtanggap at pagbibigay-pansin sa patotoo ng mga nagsasalita. Hindi ito pinalakas hanggang “sumusunod.”
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ang hindi mula sa Diyos
  rationale: Likas at maikli itong pangkalahatang paglalarawan sa Tagalog habang pinananatili ang ἐκ bilang pinagmulan.
- source_word: ἐκ τούτου
  choice: Dito
  rationale: Karaniwang paraang Tagalog ito upang ipahayag na batay sa naunang pamantayan nagaganap ang pagkilala; katumbas ito ng inferensiyal na “sa pamamagitan nito.”
- source_word: γινώσκομεν
  choice: nakikilala natin
  rationale: Ang “nakikilala” ay angkop sa konteksto ng pagkilatis at pinananatili rin ang ugnayang leksikal sa γινώσκων sa unang bahagi ng talata.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: ang Espiritu ng katotohanan
  rationale: Ang malaking titik sa “Espiritu” ay kumakatawan sa malamang na pagtukoy sa Banal na Espiritu sa gamit ni Juan, habang pinananatili ng talababa ang tunay na posibilidad ng mas pangkalahatang pagbasa.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: ang espiritu ng kamalian
  rationale: Ang “kamalian” ay tuwirang katapat ng “katotohanan” at naipahihiwatig ang paglihis o panlilinlang ng πλάνη nang hindi labis na nililinaw kung ito ay isang personal na espiritu o espirituwal na impluwensiya.
theological_decisions:
- issue: Kung ang unang πνεῦμα ay tiyak na tumutukoy sa Banal na Espiritu
  choice: Espiritu ng katotohanan
  alternative: espiritu ng katotohanan
  rationale: Sa konteksto ng pagsubok sa mga espiritu at sa mas malawak na gamit ni Juan, malamang na titulo ito ng Banal na Espiritu. Gayunman, hindi gramatikal na ipinipilit ng Griyego ang malaking titik, kaya inilalahad sa talababa ang alternatibo.
- issue: Kung ang ἀκούει ἡμῶν ay simpleng pagkarinig o pagtanggap sa patotoo
  choice: nakikinig sa atin
  alternative: naririnig tayo
  rationale: Ang paksa ng talata ay ang tugon sa patotoo o aral ng mga nagsasalita. Ipinahahayag ng “nakikinig” ang kusang pagtanggap nang hindi nagdaragdag ng mas malakas na diwang “sumusunod.”
- issue: Kung ang “tayo/atin” ay dapat tukuying hayagan bilang mga apostol
  choice: pinanatili ang mga panghalip na “tayo” at “atin”
  alternative: kami na mga apostol / sa aming patotoo
  rationale: Hindi tahasang tinatawag ng Griyegong teksto na mga apostol ang tinutukoy ng ἡμεῖς at ἡμῶν. Pinananatili ng salin ang saklaw at bahagyang kalabuan ng orihinal sa halip na idagdag ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “nakakakilala” at “nakikilala” upang maging likas sa karaniwang mambabasa at mapanatili ang ugnayan ng dalawang anyo ng γινώσκω. Hindi idinagdag sa teksto ang “mga apostol,” at pinanatili ang magkatapat na “Espiritu ng katotohanan” at “espiritu ng kamalian.”
