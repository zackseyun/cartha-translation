id: 1JN.4.3
reference: 1 John 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: tl
  text: At ang bawat espiritung hindi kumikilala kay Jesus ay hindi mula sa Diyos.[a] Ito ang espiritu ng anticristo,[b] na narinig ninyong ito’y darating at ngayon ay nasa sanlibutan na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “hindi kumikilala na si Jesu-Cristo ay dumating bilang tao.”'
    reason: textual_variant
  - marker: b
    text: Hindi inuulit sa Griyego ang salitang “espiritu”; literal, “ito ang sa anticristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: bawat espiritu
  rationale: Distributibo ang πᾶν kasama ng isahang πνεῦμα. Sa konteksto, mga espirituwal na impluwensiya o pahayag ang sinusubok, hindi ang Banal na Espiritu.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: kumikilala kay Jesus
  rationale: Likas ito sa makabagong Tagalog at ipinahihiwatig ang hayagang pagkilala o pagpapahayag ng katapatan. Sinusunod ng pangunahing teksto ang maikling anyo ng SBLGNT.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Malinaw na ipinapahayag ng ἐκ ang pinagmulan; natural at tuwiran sa Tagalog ang “mula sa Diyos.”
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Ito ang espiritu ng anticristo
  rationale: Elliptical ang Griyego at hindi inuulit ang πνεῦμα, ngunit malinaw itong ipinahihiwatig ng naunang sugnay. Ang paglalagay ng “espiritu” ay kailangan upang maging natural at malinaw sa Tagalog, habang itinatala sa talababa ang anyo ng Griyego.
- source_word: ἀντιχρίστου
  choice: anticristo
  rationale: Pinananatili ang kinikilalang terminong Tagalog; ang pantukoy na “ang” ay nagpapakita na tumutukoy ito sa kilalang inaasahang anticristo.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: na narinig ninyong darating
  rationale: Pinananatili nito ang di-tahas na kasarian ng Griyegong panghalip at hindi ipinapalagay na “siya” ang tinutukoy.
- source_word: ἐν τῷ κόσμῳ
  choice: nasa sanlibutan
  rationale: Ang “sanlibutan” ay dignidad at pamilyar na salin para sa κόσμος sa kontekstong Juaniniko, kung saan maaari itong tumukoy sa daigdig ng sangkatauhang hiwalay sa Diyos.
- source_word: ἤδη
  choice: na
  rationale: Sa hulíng pariralang “ngayo’y nasa sanlibutan na,” natural na ipinahahayag ng hulíng “na” ang diwa ng ἤδη, samantalang ang “ngayo’y” ay nagbibigay-diin sa kasalukuyang pag-iral.
theological_decisions:
- issue: Anyo ng ipinagkakait na pagkilala kay Jesus
  choice: 'Sinunod sa pangunahing teksto ang maikling pagbasa ng SBLGNT: “hindi kumikilala kay Jesus.”'
  alternative: “hindi kumikilala na si Jesu-Cristo ay dumating bilang tao”
  rationale: Mas matibay ang maikling pagbasa sa kritikal na teksto, at nasa talata 2 na ang mas buong nilalaman ng pagpapahayag. Inilalagay sa talababa ang mas mahabang pagbasa upang hindi ito mawala.
- issue: Pagpapalinaw sa ellipsis ng τὸ τοῦ ἀντιχρίστου
  choice: Ipinahiwatig nang tahasan ang “espiritu” sa pangunahing teksto.
  alternative: Panatilihin ang literal ngunit alanganing “ito ang sa anticristo.”
  rationale: Hindi inuulit ng Griyego ang πνεῦμα, ngunit malinaw itong hinihingi ng konteksto. Ang tahasang paglalagay nito ay natural sa Tagalog at hindi nagdaragdag ng bagong konsepto; ipinaliliwanag sa talababa ang ellipsis.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sanlibutan” bilang pamilyar na terminong biblikal ngunit iniwasan ang labis na arkaikong ayos. Ang “ngayo’y” ay bahagyang pormal ngunit likas at madaling maunawaan.
