  terminology: Napananatili ng “minamahal,” “magmahalan,” “pag-ibig,” at “umiibig” ang mahalagang pag-uulit ng ἀγαπ- na salitang-ugat. Ang “mula sa Diyos” at “ipinanganak mula sa Diyos” ay magkakatugma sa pagpapahayag ng banal na pinagmulan.
