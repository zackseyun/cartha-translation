base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: tl
  text: Mga minamahal[a], magmahalan tayo, sapagkat ang pag-ibig ay mula sa Diyos. Ang bawat umiibig ay ipinanganak mula sa Diyos at kilala ang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mga minamahal na kaibigan.” Sa Griyego, literal itong “Mga minamahal,” na umaalingawngaw sa mga salitang tumutukoy sa pag-ibig na paulit-ulit sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan. Pinananatili nito ang ugnayang leksikal sa magkakaugnay na salitang ἀγαπάω at ἀγάπη na paulit-ulit sa talata.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: magmahalan tayo
  rationale: Likas na salin sa Filipino ng hortatoryong pangmaramihang anyo at ng tumbasang kilos ng ἀλλήλους. Hindi idinagdag ang tahasang diwang ‘patuloy’ sapagkat ipinahihiwatig lamang iyon ng aspektong pangkasalukuyan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng panawagang magmahalan.
- source_word: ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν
  choice: ang pag-ibig ay mula sa Diyos
  rationale: Ang ‘mula sa’ ay tuwirang nagpapahayag ng pinagmulan na tinutukoy ng ἐκ, habang likas sa Filipino ang ‘pag-ibig’ bilang pangngalan.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: ang bawat umiibig
  rationale: Pinananatili ang pangkalahatang saklaw ng πᾶς at ang kilos na inilalarawan ng substantival na participle.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ay ipinanganak ng Diyos
  rationale: Likas at nakaugaliang pahayag sa Filipino para sa kapanganakang may Diyos bilang pinagmulan. Ang anyong ‘ipinanganak’ ay nagpapahiwatig ng naganap na kilos na may nananatiling bunga nang hindi pinabibigat ang pangungusap.
- source_word: γινώσκει τὸν θεόν
  choice: kumikilala sa Diyos
  rationale: Sa kontekstong Johannine, ang ‘kumikilala’ ay likas na nagpapahayag ng patuloy at personal na pagkakilala, hindi lamang ng pagkakaroon ng impormasyon tungkol sa Diyos.
theological_decisions:
- issue: Ugnayan ng pag-ibig, kapanganakang mula sa Diyos, at pagkilala sa Diyos
  choice: Tahasang panatilihin ang pagkakaugnay ng tatlo ayon sa gramatika ng Griyego, nang hindi ipinapaliwanag bilang teknikal na pagkakasunod-sunod ng kaligtasan.
  alternative: Ituring ang pag-ibig bilang mahigpit na teknikal na patunay ng regenerasyon, o bilang etikal na kilos lamang na hiwalay sa kapanganakang mula sa Diyos.
  rationale: Sinasabi mismo ng talata na ang bawat umiibig ay ipinanganak ng Diyos at kumikilala sa Diyos. Dapat panatilihin ng salin ang pahayag at tensiyong teolohikal nito nang walang dagdag na sistematikong pagpapakahulugan.
- issue: Pagpapanatili sa pag-uulit ng ἀγαπ- na salitang-ugat
  choice: Gamitin ang magkakaugnay na ‘minamahal,’ ‘magmahalan,’ ‘pag-ibig,’ at ‘umiibig.’
  alternative: Gumamit ng sari-saring katawagan na hindi nagpapakita ng ugnayan ng mga salitang tungkol sa pag-ibig.
  rationale: Mahalaga sa retorika ng talata ang pag-uulit ng magkakaugnay na salitang Griyego; ipinakikita rin ito hangga’t natural sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Mga minamahal’ upang mapanatili ang retorikal na ugnayan ng mga salitang tungkol sa pag-ibig; ipinaliwanag sa talababa ang mas kolokyal na alternatibo. Hinati sa dalawang pangungusap para sa likas at madaling pagbasa nang hindi binabago ang lohikal na ugnayan.
