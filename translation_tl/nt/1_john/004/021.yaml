  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: tl
  text: 'At ito ang utos na taglay natin mula sa kanya: Ang umiibig sa Diyos ay dapat ding umibig sa kanyang kapatid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” dito ay maaaring tumukoy sa kapatid na lalaki o babae—isang kapwa mananampalataya. Panlalaking isahan ang anyong Griyego, ngunit maaari itong gamitin nang representatibo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: utos
  rationale: Ang “utos” ay likas at marangal na salin sa modernong Tagalog at pinananatili ang moral at awtoritatibong bisa ng salita sa kontekstong Juanino.
- source_word: ἀπ’ αὐτοῦ
  choice: mula sa kanya
  rationale: Pinananatili ang panghalip ng Griyego sa halip na tahasang ulitin ang “Diyos”; malinaw sa agarang konteksto ang tinutukoy nito.
- source_word: ἵνα
  choice: Ang … ay dapat
  rationale: Ipinakikilala rito ng ἵνα ang nilalaman ng utos. Ang konstruksiyong ito ay natural sa Tagalog at malinaw na naghahayag ng obligasyon, hindi lamang ng isang pangyayari.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: Ang umiibig sa Diyos
  rationale: Ang pariralang ito ay natural na kumakatawan sa substantibong participle at pinananatili ang pangkalahatan ngunit isahang pagtukoy nang hindi gumagamit ng di-kailangang panghalip na may kasarian.
- source_word: ἀγαπᾷ
  choice: ay dapat ding umibig
  rationale: Ang subjunctive sa sugnay na nagsasaad ng nilalaman ng utos ay naghahayag ng iniatas na kilos. Ang “dapat” ay malinaw ngunit hindi labis ang tindi.
- source_word: ἀδελφὸν αὐτοῦ
  choice: kanyang kapatid
  rationale: Ang “kapatid” sa Tagalog ay likas na walang tiyak na kasarian, kaya tumpak nitong naihahatid ang relasyong ipinahahayag ng ἀδελφός nang hindi kailangang magdagdag ng lalaki o babae. Sa konteksto, tumutukoy ito sa kapwa mananampalataya.
- source_word: καὶ
  choice: ding
  rationale: 'Ipinakikita ng “din/ding” ang dagdag na diin: ang umiibig sa Diyos ay umiibig din sa kanyang kapatid.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: umibig / umiibig
  rationale: Pare-parehong ginamit ang salitang-ugat na “ibig” upang mapanatili ang tematikong pagkakaugnay ng mga anyo ng ἀγαπάω.
theological_decisions:
- issue: Saklaw ng ἀδελφὸν αὐτοῦ
  choice: “kanyang kapatid” sa pangunahing teksto, na may talababa tungkol sa kahulugang pangkomunidad
  alternative: “kanyang kapatid na lalaki” o “kapwa mananampalataya”
  rationale: Masculine singular ang anyong Griyego, ngunit maaaring gamitin itong representatibo para sa kapwa kabilang sa sambayanan ng pananampalataya. Dahil walang likas na kasarian ang Tagalog na “kapatid,” napapanatili nito ang anyong isahan at hindi nito nililimitahan ang tinutukoy sa lalaki lamang. Ipinaliliwanag sa talababa ang kontekstuwal na saklaw nang hindi inilalagay ang interpretibong pagpapalawak sa pangunahing teksto.
- issue: Lakas ng obligasyon sa ἵνα … ἀγαπᾷ
  choice: “ay dapat ding umibig”
  alternative: “umibig din” o “kailangang umibig din”
  rationale: Ipinahahayag ng “dapat” na ito ang nilalaman ng isang utos, samantalang ang payak na “umibig din” ay maaaring magmukhang pasalaysay at ang “kailangan” ay maaaring magdagdag ng higit na tindi kaysa hinihingi ng anyo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “taglay natin” upang maipahayag ang ἔχομεν nang hindi tunog literal o banyaga, at ang “utos” sa halip na mas mabigat o makalumang pananalita.
