base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: tl
  text: Sila ay mula sa sanlibutan[a]; kaya nagsasalita sila mula sa sanlibutan, at ang sanlibutan[b] ay nakikinig sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sila ay kabilang sa sanlibutan … nagsasalita sila bilang mga mula sa sanlibutan.” Dalawang ulit na ginamit sa Griyego ang pananalitang “mula sa sanlibutan,” na nagdiriin sa pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: Ang “sanlibutan” dito ay ang kaayusan ng sangkatauhang salungat sa Diyos, hindi ang nilikhang daigdig sa ganang sarili.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Sila
  rationale: Tumutukoy ito sa mga bulaang propeta o espiritung binanggit sa konteksto. Pinananatili ng “sila” ang paghahambing sa “tayo” sa kasunod na talata nang hindi pinatitindi nang labis ang panghalip.
- source_word: ἐκ τοῦ κόσμου
  choice: mula sa sanlibutan
  rationale: Ang ἐκ ay nagpapahiwatig ng pinagmulan. Malinaw itong naipahahayag ng “mula sa sanlibutan,” at napapanatili rin ang paulit-ulit na pananalita ng Griyego.
- source_word: κόσμος
  choice: sanlibutan
  rationale: Karaniwan at marangal na salin ito ng κόσμος sa ganitong kontekstong Juaniko. Hindi nito isinasama sa pangunahing teksto ang mas mahabang interpretasyong “kaayusan ng sangkatauhang salungat sa Diyos.”
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: Natural at tuwirang ipinakikita ng “kaya” na ang paraan at pinagmulan ng kanilang sinasabi ay bunga ng kanilang pagiging mula sa sanlibutan.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: mula sa sanlibutan ang kanilang sinasabi
  rationale: Mas natural ito sa modernong Tagalog kaysa sa literal na “nagsasalita sila mula sa sanlibutan,” habang pinananatili ang diwa ng sanlibutan bilang pinagmumulan ng kanilang pananalita.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: nakikinig sa kanila ang sanlibutan
  rationale: Sa konteksto, ang ἀκούει ay hindi lamang pisikal na pagkarinig kundi pagtanggap o pakikinig nang may pagsang-ayon. Ang “nakikinig” ay likas na nagpapahayag nito sa Tagalog.
theological_decisions:
- issue: Kahulugan ng κόσμος sa teolohiya ni Juan
  choice: Ang “sanlibutan” ay tumutukoy sa kaayusan ng sangkatauhang hiwalay at salungat sa Diyos.
  alternative: Ang pisikal na nilikha o ang sangkatauhan sa neutral na kahulugan.
  rationale: Ipinaghahambing ng konteksto ang mga mula sa Diyos at ang mga mula sa sanlibutan. Gayunman, pinanatili sa pangunahing teksto ang payak na “sanlibutan” upang hindi gawing paliwanag ang salin.
- issue: Diin ng αὐτοὶ
  choice: Hindi tahasang dinagdagan ng “mismo” ang pangunahing teksto.
  alternative: “Sila mismo ay mula sa sanlibutan.”
  rationale: May bahagyang diin ang panghalip sa Griyego, ngunit malinaw na ang paghahambing sa konteksto. Sa Tagalog, maaaring magbigay ng labis na diin ang “mismo.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sanlibutan” upang mapanatili ang teolohikal na tunog ng κόσμος, at inayos ang ikalawang parirala bilang “mula sa sanlibutan ang kanilang sinasabi” upang maging likas sa Tagalog nang hindi mawala ang ideya ng pinagmulan.
