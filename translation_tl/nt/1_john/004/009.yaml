base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: tl
  text: 'Sa ganitong paraan nahayag ang pag-ibig ng Diyos sa gitna natin[a]: isinugo ng Diyos sa sanlibutan ang kanyang kaisa-isang Anak[b] upang mabuhay tayo sa pamamagitan niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa atin” o “sa loob natin.” Maaaring tumukoy ang pariralang Griyego sa paghahayag sa gitna ng komunidad o sa loob ng mga mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “kanyang bugtong na Anak.” Idinidiin ng Griyegong μονογενής ang pagiging natatangi ng Anak.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganitong paraan
  rationale: Ipinakikilala nito ang paraan kung paano nahayag ang pag-ibig; natural ito sa makabagong Tagalog at malinaw na tumutukoy sa kasunod na sugnay.
- source_word: ἐφανερώθη
  choice: nahayag
  rationale: Ipinapahayag ng aorist passive na ang dating hindi lantad ay naging hayag o nakilala.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ang pag-ibig ng Diyos
  rationale: Pinananatili ang anyong genitive at likas na nauunawaan sa konteksto bilang pag-ibig na nagmumula sa Diyos.
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Sa Tagalog, maaaring tumukoy ang “sa atin” sa pagpapahayag ng pag-ibig sa gitna natin o kaugnay natin, nang hindi labis na nilulutas ang lawak ng Griyegong parirala.
- source_word: ὅτι
  choice: ':'
  rationale: Ginagamit ang tutuldok upang natural na ipakilala sa Tagalog ang paliwanag o nilalaman ng paraan ng paghahayag.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: ang kanyang kaisa-isang Anak
  rationale: Ipinahahayag ng “kaisa-isa” ang natatangi at walang kapantay na katayuan ng Anak, nang hindi ipinapasok sa pangunahing teksto ang tiyak na ideya ng pagkakaanak o pagkapanganak.
- source_word: ἀπέσταλκεν
  choice: isinugo
  rationale: Ang “isinugo” ay angkop sa personal at may-layuning pagpapadala ng Anak; hindi likas sa Tagalog na sapilitang tularan ang perfect aspect sa pamamagitan ng pantulong na pandiwa.
- source_word: εἰς τὸν κόσμον
  choice: sa sanlibutan
  rationale: Karaniwang marangal na salin ng κόσμος bilang daigdig ng sangkatauhan na pinagsuguan sa Anak.
- source_word: ἵνα ζήσωμεν
  choice: upang mabuhay tayo
  rationale: Malinaw na ipinahahayag ang layunin ng ἵνα at subjunctive nang hindi ginagawang tiyak na awtomatikong resulta.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Tumpak na ipinahahayag ang paraan o ahensiya ng διά na may genitive.
theological_decisions:
- issue: Kahulugan ng μονογενής bilang pantukoy sa Anak
  choice: kaisa-isang Anak
  alternative: bugtong na Anak
  rationale: Pinananatili ng pangunahing salin ang diin sa pagiging natatangi ng Anak. Inilalagay sa talababa ang tradisyonal na “bugtong na Anak” dahil mahalaga ito sa kasaysayan ng pagsasalin ngunit maaaring maunawaan bilang tuwirang pahayag tungkol sa paraan ng pagkakaanak.
- issue: Saklaw ng ἐν ἡμῖν
  choice: sa atin
  alternative: sa gitna natin; sa loob natin
  rationale: Ang “sa atin” ay sadyang malawak at natural sa Tagalog. Pinananatili sa talababa ang posibilidad na tumukoy ito sa pagpapahayag sa komunidad o sa kalooban ng mga mananampalataya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sanlibutan” bilang pamilyar na biblikal na salita ngunit iniwasan ang labis na arkaikong ayos. Ang “sa atin” ay nagpapanatili ng tunay na kalabuan ng ἐν ἡμῖν, at ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
