  source_fidelity: Ang “sa atin” sa pangunahing teksto ay mas natural na mauunawaan bilang tagatanggap ng paghahayag (“ipinahayag sa atin”) kaysa katumbas ng ἐν ἡμῖν. Mas tumpak ang “sa gitna natin” para sa pangunahing, pangkomunidad na pagbasa, habang inilalaan ng talababa ang posibilidad na “sa loob natin.” Napananatili ng iba pang mga parirala ang diwa ng Griyego, kabilang ang layunin sa “upang” at ang paraang ipinahahayag ng “sa pamamagitan niya.”
  naturalness: Ang binagong ayos ay malinaw at likas sa makabagong Filipino. Ang “Sa ganitong paraan” ay maayos na panimula sa paliwanag na kasunod ng tutuldok; ang “sa gitna natin” ay hindi lumilikha ng maling kahulugang “ipinahayag sa atin.”
  terminology: Ang “pag-ibig ng Diyos,” “kaisa-isang Anak,” “sanlibutan,” at “sa pamamagitan niya” ay angkop sa marangal ngunit makabagong rehistro. Ang “kaisa-isang Anak” ay maingat na nagsasaad ng pagiging natatangi ng μονογενής; pinananatili sa talababa ang tradisyonal na “bugtong na Anak.”
