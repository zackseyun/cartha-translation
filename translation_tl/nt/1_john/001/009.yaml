  to: Kung inaamin natin ang ating mga kasalanan, tapat at matuwid[a] siya upang patawarin tayo sa ating mga kasalanan at linisin tayo mula sa lahat ng kalikuan.
  rationale: Pinalitan ang “ipinagtatapat” ng “inaamin” upang maging likas ang Tagalog nang walang idinagdag na tagatanggap ng pagtatapat. Pinalitan ang “kaya” ng “upang” upang mas maingat na maipakita ang ἵνα nang hindi ipinipilit na puro sanhi-bunga ang ugnayan. Ginawang “mula sa” ang panandang kaugnay ng paglilinis upang tuwirang maipahayag ang ἀπό (“from”).
