  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: tl
  text: Kung inaamin natin ang ating mga kasalanan, tapat at matuwid[a] siya upang patawarin tayo sa ating mga kasalanan at linisin tayo mula sa lahat ng kalikuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makatarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Kung
  rationale: Likas na panumbas sa kondisyong ipinahihiwatig ng Griyego at hindi nito ipinapalagay na tiyak o paulit-ulit ang kilos.
- source_word: ὁμολογῶμεν
  choice: ipinagtatapat natin
  rationale: Sa konteksto ng kasalanan, malinaw nitong ipinahahayag ang hayagang pagkilala at pag-amin, habang nananatiling natural sa makabagong Tagalog.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: ang ating mga kasalanan
  rationale: Tuwiran at natural na salin ng layon at panghalip na paari.
- source_word: πιστός
  choice: tapat
  rationale: Ipinahahayag ang pagiging maaasahan ng Diyos ayon sa kanyang salita at likas na pagkatao.
- source_word: δίκαιος
  choice: matuwid
  rationale: Pinananatili ang malawak na diwa ng wastong moral na pagkatao; ang posibleng diwang 'makatarungan' ay inilagay sa talababa upang hindi mawala ang hudisyal na himig.
- source_word: ἵνα
  choice: kaya
  rationale: Sa pagkakasunod na ito, ipinakikita ng ἵνα ang bunga o kinauukulang pagkilos na umaayon sa pagiging tapat at matuwid ng Diyos. Mas natural sa Tagalog ang 'kaya' kaysa sa literal ngunit alanganing 'upang' matapos ang mga pang-uri.
- source_word: ἀφῇ
  choice: patatawarin
  rationale: Karaniwang kahulugan ng ἀφίημι kapag kasalanan ang tinutukoy; ang anyong panghinaharap ay likas sa Tagalog sa kondisyong may 'kung'.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: patatawarin niya tayo sa ating mga kasalanan
  rationale: Natural na kayarian sa Tagalog na malinaw na nagpapanatili sa taong pinatatawad at sa mga kasalanang pinatatawad.
- source_word: καθαρίσῃ
  choice: lilinisin
  rationale: Pinananatili ang larawan ng pag-aalis ng moral na karumihan at ang pagkakatulad nito sa pagpapatawad.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: sa lahat ng kalikuan
  rationale: Ang 'kalikuan' ay may sapat na lawak para sa moral na kasamaan o kawalang-katuwiran, at ang 'lahat' ay kumakatawan sa πάσης.
theological_decisions:
- issue: Kahulugan ng δίκαιος kaugnay ng pagpapatawad ng Diyos
  choice: matuwid
  alternative: makatarungan
  rationale: Ang 'matuwid' ay nagpapanatili sa malawak na moral na diwa ng salita nang hindi nililimitahan ito sa isang hudisyal na paliwanag. Gayunman, tunay ding posible ang 'makatarungan,' kaya pinanatili ito sa talababa.
- issue: Ugnayan ng ἵνα sa pagiging tapat at matuwid ng Diyos
  choice: kaya patatawarin niya ... at lilinisin
  alternative: upang patawarin niya ... at linisin
  rationale: Maaaring magpahiwatig ang ἵνα ng layunin o kinalabasan. Pinili ang likas na Tagalog na nagpapakita ng bunga ng karakter ng Diyos, nang hindi nagdaragdag ng paliwanag kung paano nagiging matuwid ang pagpapatawad.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'ipinagtatapat' bilang pamilyar ngunit hindi lipas na pananalita sa konteksto ng kasalanan; iniwasan ang sobrang teknikal o denominasyonal na mga termino.
