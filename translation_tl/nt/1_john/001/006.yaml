  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: tl
  text: Kung sabihin nating may pakikisama tayo sa kanya ngunit lumalakad naman tayo sa kadiliman[a], nagsisinungaling tayo at hindi natin isinasagawa ang katotohanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa dilim.” May pantukoy ang salitang Griyego, at maaaring idiin nito ang moral at espirituwal na larangang salungat sa Diyos sa mga sulat ni Juan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi natin ginagawa ang katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Kung sinasabi natin
  rationale: Pinananatili ang kondisyonal na diwa nang hindi idinaragdag ang bahagyang mapanghusgang kahulugan ng “inaangkin natin.”
- source_word: κοινωνίαν ἔχομεν
  choice: may pakikisama tayo
  rationale: Natural na Tagalog para sa pagkakaroon ng κοινωνία, na nagpapahiwatig ng kaugnayan at pakikibahagi nang hindi labis na pinapaliwanag ito.
- source_word: μετ’ αὐτοῦ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego; hindi ito tahasang pinapalitan ng “sa Diyos,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: ἐν τῷ σκότει
  choice: sa kadiliman
  rationale: Pinananatili ang matimbang na metaporang Juanino para sa larangang moral at espirituwal na salungat sa Diyos.
- source_word: περιπατῶμεν
  choice: lumalakad naman tayo
  rationale: Pinananatili ang biblikal na metapora ng paglakad bilang paraan ng pamumuhay; ang “naman” ay natural na naghahayag ng salungatan sa sinasabing pakikisama.
- source_word: ψευδόμεθα
  choice: nagsisinungaling tayo
  rationale: Tuwirang ipinapahayag ang patuloy o kasalukuyang pagkilos na ipinahihiwatig ng pandiwang Griyego.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: hindi natin isinasagawa ang katotohanan
  rationale: Natural na Tagalog para sa literal na “hindi ginagawa ang katotohanan,” habang pinananatili ang aktibong diwa ng pamumuhay ayon sa katotohanan.
theological_decisions:
- issue: Ang moral at espirituwal na metapora ng kadiliman
  choice: sa kadiliman
  alternative: namumuhay sa kasalanan
  rationale: Hindi nililimitahan ang Juaninong “kadiliman” sa isang paliwanag lamang gaya ng kasalanan; pinananatili nito ang saklaw na kinabibilangan ng kasamaan, kabulaanan, at pagkahiwalay sa Diyos.
- issue: Ang kaugnayan ng sinasabi at aktuwal na pamumuhay
  choice: sinasabi nating may pakikisama tayo ... ngunit lumalakad naman tayo
  alternative: inaangkin nating kaisa natin siya ... ngunit namumuhay tayo sa kasalanan
  rationale: Pinananatili ang kondisyonal na pananalita at metapora ng orihinal, nang hindi dinaragdagan ang teksto ng mas tiyak na doktrinal na interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga metaporang “lumalakad” at “kadiliman” dahil mahalaga ang mga ito sa bokabularyo at teolohiya ni Juan. Ginamit ang “pakikisama” bilang pangkaraniwang salitang naglalarawan ng ugnayan at pakikibahagi, at ang “isinasagawa ang katotohanan” bilang natural ngunit malapit na salin ng idyomang Griyego.
