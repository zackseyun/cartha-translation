  verdict: revise
  source_fidelity: 'Ang salin ay tapat sa lohika at pangunahing bokabularyo ng Griyego: pinananatili nito ang kondisyon, ang pakikisama kay "kanya," ang metaporang paglakad sa kadiliman, at ang pagsalungat ng pagsisinungaling sa paggawa ng katotohanan. Gayunman, ang «Kung sinasabi nating» ay mas aspektuwal na nagpapatuloy kaysa sa payak na kundisyon ng aorist subjunctive na ἐὰν εἴπωμεν. Ang «Kung sabihin nating» ay mas malapit at natural.'
  naturalness: Makabago at malinaw ang rehistro. Ang «lumalakad ... sa kadiliman» ay angkop na biblikal ngunit naiintindihan pa rin; ang «isinasagawa ang katotohanan» ay pormal ngunit natural at maingat na pinananatili ang aktibong Juaninong idyoma. Ang «pakikisama» ay maaaring magpahiwatig ng simpleng pakikibagay sa ibang gamit, ngunit sa konstruksyong «may pakikisama tayo sa kanya» ay katanggap-tanggap na salin ng fellowship at hindi kailangang palitan.
  terminology: Wastong napanatili ang «kadiliman» bilang malawak na moral-espirituwal na metapora nang hindi ito isinasalin bilang «kasalanan.» Ang panghalip na «kanya» ay wastong hindi pinalawak sa «Diyos.» Ang mga talababa ay tumutugma sa mga angkla at tumpak na inihahayag ang literal na alternatibo.
