id: 1JN.1.5
reference: 1 John 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: tl
  text: 'At ito ang mensaheng narinig namin mula sa kanya at ipinapahayag namin sa inyo: ang Diyos ay liwanag, at walang anumang kadiliman sa kanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: mensahe
  rationale: Ang “mensahe” ay natural at malinaw sa makabagong Filipino at angkop sa nilalamang ipinahahayag.
- source_word: ἀκηκόαμεν
  choice: narinig namin
  rationale: Likas sa Filipino ang aspektong perpektibo rito; ipinahihiwatig ng konteksto na ang narinig noon ay siya pa ring ipinapahayag ngayon.
- source_word: ἀπ’ αὐτοῦ
  choice: mula sa kanya
  rationale: Pinananatili ang panghalip ng Griyego at hindi tahasang pinapangalanan ang tinutukoy nito.
- source_word: ἀναγγέλλομεν
  choice: ipinapahayag namin
  rationale: Ipinahihiwatig nito ang kasalukuyan at hayagang paghahatid ng natanggap na mensahe; mas natural ito kaysa piliting panatilihin sa Filipino ang ugnayang-ugat ng ἀγγελία at ἀναγγέλλομεν.
- source_word: ὅτι
  choice: ':'
  rationale: Natural na ipinakikilala ng tutuldok sa Filipino ang mismong nilalaman ng mensahe nang hindi nagdaragdag ng paliwanag.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: ang Diyos ay liwanag
  rationale: Tuwirang pinananatili ang kwalitatibo at metaporikal na pahayag, nang hindi dinaragdagan ng “banal,” “dalisay,” o pantukoy na magpapakitid sa kahulugan.
- source_word: σκοτία
  choice: kadiliman
  rationale: Pinananatili nito ang literal at moral-espirituwal na lawak ng metapora sa sulat.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Ito ang natural na Filipino para sa metaporikal na ἐν αὐτῷ, nang hindi ito labis na binibigyang-kahulugan bilang pisikal na lokasyon.
- source_word: οὐκ ἔστιν οὐδεμία
  choice: walang anumang
  rationale: 'Ang dobleng anyo ng parirala ay natural na naghahatid sa Filipino ng mariing ganap na pagtanggi: ni katiting na kadiliman ay wala.'
theological_decisions:
- issue: Metaporikal na panaguring “ang Diyos ay liwanag”
  choice: 'Pinanatili nang tuwiran ang metapora: “ang Diyos ay liwanag.”'
  alternative: “Ang Diyos ay banal na liwanag” o “ang Diyos ang liwanag.”
  rationale: Hindi ipinapaliwanag ng Griyego ang metapora sa pamamagitan ng “banal” o “dalisay,” at hindi rin nito tinutukoy ang Diyos bilang isang partikular na bagay na “ang liwanag.” Ang tuwirang anyo ang nagpapanatili sa lawak at lakas ng pahayag.
- issue: Tinutukoy ng panghalip sa “mula sa kanya”
  choice: Pinanatili ang panghalip na “kanya.”
  alternative: “Mula kay Jesus” o “mula sa Anak.”
  rationale: Bagaman mauunawaan sa konteksto ang tinutukoy, ang tahasang paglalagay ng pangalan o titulo ay magpapasok ng interpretasyong wala sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinapahayag” bilang likas na pananalita sa kontekstong apostoliko, at pinanatiling payak at matindi ang magkatunggaling larawan ng liwanag at kadiliman.
