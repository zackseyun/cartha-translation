id: 1JN.1.8
reference: 1 John 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: tl
  text: Kung sinasabi nating wala tayong kasalanan[a], dinadaya natin ang ating sarili, at wala sa atin ang katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas mapagpaliwanag na salin, “pagkamakasalanan”; literal na “kasalanan” ang nasa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Kung sinasabi natin
  rationale: Likas na salin sa Filipino ng kondisyong may ἐὰν at aorist subjunctive; ipinahahayag nito ang maaaring pag-aangkin nang hindi ginagawang tiyak o palagian.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: wala tayong kasalanan
  rationale: Pinananatili ang isahang ἁμαρτία bilang pangkalahatang di-mabilang na konsepto ng kasalanang nasa tao, hindi isang partikular na gawa lamang.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: dinadaya natin ang ating sarili
  rationale: Malinaw at natural na ipinapahayag ang reflexive na diwa ng pagliligaw sa sarili.
- source_word: ἡ ἀλήθεια
  choice: ang katotohanan
  rationale: Pinananatili ang tiyak na anyo at ang malawak na Johannine na diwa nito, nang hindi nililimitahan sa katapatan lamang o tahasang dinaragdagan ng 'ng Diyos.'
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: wala sa atin
  rationale: Natural na Filipino para sa existential clause na may ἐν, habang pinananatili ang panloob at personal na dimensiyon.
theological_decisions:
- issue: Kahulugan ng 'kasalanan' sa pahayag na wala tayong kasalanan
  choice: Isinalin bilang 'kasalanan' sa pangkalahatang diwa ng presensiya o kalagayan ng kasalanan sa tao.
  alternative: '''pagkamakasalanan'' o ''hindi tayo nagkasala'''
  rationale: Ang Griyego ay nagsasabing 'may kasalanan' at naiiba sa pagtanggi na nakagawa ng kasalanan sa talata 10. Hindi dapat gawing mas interpretibo kaysa sa orihinal.
- issue: Diwa ng 'ang katotohanan ay wala sa atin'
  choice: Pinanatili bilang 'wala sa atin ang katotohanan.'
  alternative: '''wala sa atin ang katotohanan ng Diyos'' o ''hindi tayo namumuhay sa katotohanan'''
  rationale: Maaaring saklawin ng maikling pahayag ang banal na katotohanan at ang pagiging makatotohanan; hindi nilulutas ng salin ang sinadyang lawak ng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ating sarili' sa halip na mas kolokyal na anyo upang mapanatili ang dignidad at linaw; nananatiling madaling maunawaan ng karaniwang mambabasa.
