revisions:
- from: Ngunit kung lumalakad tayo sa liwanag, kung paanong siya mismo ay nasa liwanag, may pakikisama tayo sa isa’t isa[a], at ang dugo ni Jesus, na kanyang Anak, ang naglilinis sa atin mula sa bawat kasalanan[b].
  to: Ngunit kung lumalakad tayo sa liwanag, kung paanong siya mismo ay nasa liwanag, may pakikisama tayo sa isa’t isa[a], at nililinis tayo mula sa bawat kasalanan[b] ng dugo ni Jesus, na kanyang Anak.
  rationale: Inayos lamang ang ayos ng huling sugnay para sa mas likas na daloy sa modernong Filipino. Nananatiling paksa sa diwa ang «dugo ni Jesus» at napananatili ang payak na pangkasalukuyang «nililinis,» ang ugnayang «kanyang Anak,» at ang saklaw na «bawat kasalanan.» Ang mga talababa ay nananatiling nakaangkla sa mga salitang aktuwal na tinatalakay ng mga ito.
