id: 1JN.1.7
reference: 1 John 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: tl
  text: Ngunit kung lumalakad tayo sa liwanag, kung paanong siya mismo ay nasa liwanag, may pakikisama tayo sa isa’t isa[a], at nililinis tayo mula sa bawat kasalanan[b] ng dugo ni Jesus, na kanyang Anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang nagpapakahulugan sa “sa isa’t isa” bilang pakikisama sa pagitan ng mga mananampalataya at ng Diyos, ngunit ang katumbasang pananalita sa Griyego ay pinakanatural na tumutukoy sa pakikisama ng mga mananampalataya sa isa’t isa.
    reason: alternative_reading
  - marker: b
    text: O, “mula sa lahat ng kasalanan.” Maaaring unawain ang Griyego nang distributibo (“bawat kasalanan”) o kolektibo (“lahat ng kasalanan”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ngunit kung
  rationale: Ipinakikita ng δέ ang pagsalungat sa pahayag sa naunang talata tungkol sa paglakad sa kadiliman; natural itong naipahahayag ng “Ngunit kung.”
- source_word: ἐν τῷ φωτὶ
  choice: sa liwanag
  rationale: Pinananatili ang mahalagang metapora ng liwanag sa konteksto ni Juan nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: περιπατῶμεν
  choice: lumalakad tayo
  rationale: Pinananatili ang metaporang etikal ng paglakad sa halip na agad itong bigyang-kahulugang “namumuhay,” at naipahihiwatig ang nagpapatuloy na paraan ng pamumuhay.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: kung paanong siya mismo ay nasa liwanag
  rationale: Ang “siya mismo” ay nagpapakita ng bahagyang diin ng αὐτός, samantalang ang “kung paanong” ay nagpapanatili sa paghahambing nang hindi nagpapalabis ng eksaktong pagkakapantay.
- source_word: κοινωνίαν ἔχομεν
  choice: may pakikisama tayo
  rationale: Ang “pakikisama” ay karaniwan at nauunawaang salin para sa ibinahaging ugnayan at pakikibahagi, nang hindi nagdaragdag ng tiyak na sakramental na kahulugan.
- source_word: μετ’ ἀλλήλων
  choice: sa isa’t isa
  rationale: Natural na katumbas ito ng katumbasang panghalip sa Griyego at malinaw na naghahayag ng ugnayang kapwa.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: ang dugo ni Jesus
  rationale: Pinananatili ang “dugo” bilang simuno at ang bigat ng larawan sa teolohiya ng talata.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: na kanyang Anak
  rationale: Natural na ipinakikilala si Jesus bilang Anak ng Diyos habang pinananatili ang pagkakasunod ng mga parirala sa Griyego.
- source_word: καθαρίζει
  choice: naglilinis
  rationale: Naipahahayag ng pangkasalukuyang anyo ang nagpapatuloy o katangiang pagkilos nang hindi dinaragdagan ng mas tahasang “patuloy na.”
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: mula sa bawat kasalanan
  rationale: Ipinakikita ng “bawat kasalanan” ang posibleng distributibong diwa ng πάσης na kasama ang pang-isahang ἁμαρτίας, habang nananatiling natural sa Filipino.
theological_decisions:
- issue: Tinutukoy ng “sa isa’t isa” (μετ’ ἀλλήλων)
  choice: Pakikisama ng mga mananampalataya sa isa’t isa
  alternative: Pakikisama sa pagitan ng mga mananampalataya at ng Diyos
  rationale: Ang katumbasang ἀλλήλων ay pinakanatural na tumutukoy sa kapwa ugnayan ng mga tao. Bagaman kasama sa mas malawak na konteksto ang pakikisama sa Diyos, hindi ito tahasang ipinapalit sa payak na katumbasang diwa ng pariralang ito.
- issue: Diwa ng pangkasalukuyang καθαρίζει
  choice: Nagpapatuloy o katangiang paglilinis na ipinahayag sa payak na pangkasalukuyan
  alternative: Isahang paglilinis, o ang tahasang pinalawak na “patuloy na nililinis”
  rationale: Maaaring magpahiwatig ang pangkasalukuyang Griyego ng nagpapatuloy o karaniwang pagkilos, ngunit sapat itong naipahahayag ng “naglilinis” nang hindi labis na binibigyang-kahulugan ang aspekto.
- issue: Saklaw ng πάσης ἁμαρτίας
  choice: bawat kasalanan
  alternative: lahat ng kasalanan
  rationale: Maaaring unawain ang parirala nang distributibo o kolektibo. Pinili sa pangunahing teksto ang distributibong pagbasa, at itinala ang kolektibong posibilidad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga larawang “lumalakad,” “liwanag,” at “dugo,” at iniwasan ang pagpapaliwanag ng mga ito sa mismong talata. Ginamit ang maliit na titik sa panghalip na tumutukoy sa Diyos, ayon sa karaniwang modernong estilo, at malaking titik sa titulong “Anak.”
