- from: Ang mula pa sa pasimula[a], ang narinig namin, ang nakita namin ng sarili naming mga mata, ang pinagmasdan namin at nahipo ng aming mga kamay, tungkol sa salita ng buhay[b]—
  to: Yaong naroon na mula pa sa pasimula[a], yaong aming narinig, yaong nakita namin ng sarili naming mga mata, yaong pinagmasdan namin at hinipo ng aming mga kamay, tungkol sa salita ng buhay[b]—
  rationale: Ang rebisyon ay nagdaragdag lamang ng kinakailangang “naroon na” upang katawanin ang ἦν, at inaayos ang pandiwang “hinipo” para sa mas tuwiran at likas na Tagalog. Hindi nito nilulutas ang sinasadyang kalabuan ng neuter na ὃ o ng λόγος τῆς ζωῆς. Ang talababa a ay ginawang mas hindi mapagpalagay tungkol sa pagkakakilanlan ng plural na mga saksi.
