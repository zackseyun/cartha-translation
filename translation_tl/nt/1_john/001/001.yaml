  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: tl
  text: Yaong naroon na mula pa sa pasimula[a], yaong aming narinig, yaong nakita namin ng sarili naming mga mata, yaong pinagmasdan namin at hinipo ng aming mga kamay, tungkol sa salita ng buhay[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Yaong mula pa sa pasimula.” Gumagamit ang Griyego ng panghalip na walang kasariang pambalarila; maaaring malawak nitong tukuyin ang patotoo ng mga saksi tungkol sa Anak sa halip na tuwirang tawagin siyang “siya.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring unawain na “ang Salita ng buhay.” Maaaring personal itong tumukoy sa Anak, na may sadyang pag-alingawngaw sa Juan 1:1, o sa mensaheng nagbibigay-buhay tungkol sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Ang
  rationale: Inuulit ang “ang” upang katawanin ang magkakasunod na sugnay na may panghalip na walang kasariang pambalarila sa Griyego. Hindi nito nililimitahan ang tinutukoy sa isang tahasang personal na “siya,” kaya nananatili ang lawak at bahagyang kalabuan ng teksto.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: mula pa sa pasimula
  rationale: Pinananatili nito ang idyomang Juanino at ang temporal na lalim ng parirala. Ang “pa” ay natural na nagpapahiwatig na naroon na ang tinutukoy noong pasimula, nang hindi nagdaragdag ng mas tiyak na aspektong wala sa teksto.
- source_word: ἀκηκόαμεν
  choice: narinig namin
  rationale: Ito ang natural na makabagong Tagalog para sa ganap na patotoo tungkol sa narinig. Hindi likas sa Tagalog na tahasang kopyahin ang perpektong panahunan ng Griyego sa pariralang ito.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: nakita namin ng sarili naming mga mata
  rationale: Pinananatili ang mariing pagbanggit sa mga mata at malinaw na ipinahahayag ang pagiging saksi mismo ng mga nagsasalita.
- source_word: ἐθεασάμεθα
  choice: pinagmasdan namin
  rationale: Ang “pinagmasdan” ay higit sa panandaliang pagtingin at angkop sa diwa ng maingat o sadyang pagmamasid, ngunit nananatiling natural sa kasalukuyang Tagalog.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: nahipo ng aming mga kamay
  rationale: Ipinananatili ang pisikal at kongkretong patotoo ng paghipo, pati ang tahasang pagbanggit sa mga kamay, nang hindi ipinapalagay ang mas matagal o mas masinsing paghawak.
- source_word: περὶ
  choice: tungkol sa
  rationale: Likas at malinaw itong pananda ng paksang tinutukoy ng patotoo.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: salita ng buhay
  rationale: Ang “salita” ay maaaring tumukoy sa mensahe o pahayag at maaari ring umalingawngaw sa personal na Logos sa tradisyong Juanino. Ang maliit na titik ay hindi nagpapasya sa kalabuan na hindi minamarkahan ng tekstong Griyego.
theological_decisions:
- issue: Ang tinutukoy ng mga sugnay na may ὃ at ang kahulugan ng λόγος
  choice: Gamitin ang di-personal na “ang” sa pagbubukas at ang maliit-na-titik na “salita ng buhay.”
  alternative: Gawing tahasang personal ang salin, gaya ng “Siya na mula pa sa pasimula,” o gawing “Salita ng buhay” upang malinaw na tukuyin ang Anak.
  rationale: Kristolohikal ang konteksto, ngunit walang kasariang panlalaki ang mga inuulit na panghalip sa Griyego at hindi rin minamarkahan ng sinaunang teksto ang malaking titik. Kaya pinananatili ng salin ang tensiyon sa pagitan ng Anak mismo at ng patotoo o mensaheng tungkol sa kanya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ang paulit-ulit na “ang” ay nagpapanatili sa anaporikong ritmo ng Griyego, samantalang ang “pinagmasdan” at “nahipo” ay nagbibigay ng kongkretong diin sa patotoong nasaksihan at naranasan.
