source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: tl
  text: Ang nakita at narinig namin ay ipinapahayag din namin sa inyo, upang kayo rin ay magkaroon ng pakikiisa[b] sa amin; at ang pakikiisa naman namin ay sa Ama at sa kanyang Anak, si Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “si Jesus Cristo.” Ang Χριστός ay maaaring isalin bilang “Mesiyas” o “Cristo”; nangangahulugan itong “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Ang “pakikiisa” ay maaari ring isaling “pakikibahagi,” “pakikipagkaisa,” o “pakikisama.” Ipinahihiwatig nito ang pinagsasaluhang ugnayan at pakikibahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: Ang nakita at narinig namin
  rationale: Natural na Tagalog para sa bagay na nasaksihan at narinig; hindi ginagawang tahasang personal ang neuter na ὃ. Naipahihiwatig ng konteksto ang patuloy na bisa ng patotoo kahit walang tuwirang katumbas sa Tagalog ng Greek perfect.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: ay ipinapahayag din namin sa inyo
  rationale: Ang “ipinapahayag” ay angkop sa pag-uulat o paghahayag ng nasaksihan, at ang “din” ay kumakatawan sa καί.
- source_word: ἵνα καὶ ὑμεῖς
  choice: upang kayo rin
  rationale: Pinananatili ang layuning ipinakikilala ng ἵνα at ang diin ng καί sa mga tatanggap.
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: magkaroon ng pakikiisa sa amin
  rationale: 'Ang “pakikiisa” ay likas at malawak: saklaw nito ang kaugnayan, pagbabahagi, at pakikibahagi nang hindi nililimitahan sa simpleng samahan o sa isang sakramental na kahulugan.'
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: At tunay na ang pakikiisa natin
  rationale: Ang “tunay na” ay naghahatid sa nagpapatibay at nagpapaliwanag na puwersa ng δέ. Ginamit ang inklusibong “natin” sapagkat, matapos anyayahan ang mga mambabasa sa pakikiisa, natural sa Tagalog na tumukoy sa pakikiisang pinagsasaluhan nila at ng mga saksi; nananatiling posible sa Griyego ang mas makitid na “amin.”
- source_word: μετὰ τοῦ πατρὸς
  choice: ay sa Ama
  rationale: Ang “Ama” ay pinanatiling pantawag o titulo para sa Diyos.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: at sa kanyang Anak
  rationale: Malinaw at natural na ipinakikita ang ugnayang Ama-Anak.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Ipinakikita ng “na Mesiyas” na ang Χριστός ay titulo, hindi apelyido, habang nananatiling natural sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng κοινωνία
  choice: pakikiisa
  alternative: pakikisama; pakikibahagi; pakikipagkaisa
  rationale: Pinananatili ng “pakikiisa” ang sabay na relasyonal at participatoryong kahulugan ng salita, kapuwa sa mga saksi at sa Ama at sa Anak, nang hindi ito ginagawang panlipunang samahan lamang o eksklusibong sakramental.
- issue: Pagkakasalin ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang Ἰησοῦ Χριστοῦ, nauunawaan pa rin ang Χριστός bilang titulong tumutukoy sa pinahiran o Mesiyas. Ang “si Jesus na Mesiyas” ay malinaw at idiomatikong Tagalog.
- issue: Saklaw ng ἡμετέρα sa “ang pakikiisa natin”
  choice: inklusibong “natin”
  alternative: eksklusibong “amin”
  rationale: Ang Greek na ἡμετέρα ay hindi nagtatangi ng inklusibo at eksklusibong “tayo/kami.” Dahil layunin ng pangungusap na makibahagi ang mga mambabasa, ang “natin” ay natural, ngunit ang “amin” ay nananatiling lehitimong pagbasa kung ang tinutukoy ay partikular na pakikiisa ng mga apostolikong saksi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipinapahayag” para sa tono ng pampublikong patotoo at “pakikiisa” upang mapanatili ang lawak ng κοινωνία. Ang mga marker na [a] at [b] ay kapuwa inilagay sa pangunahing teksto.
