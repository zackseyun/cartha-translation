    rationale: Ang unang panauhang pangmaramihang pang-angkin sa Griyego ay tumutukoy sa nagsasalita/mga saksi. Sa Tagalog, ang inklusibong “natin” ay nagsasama sa mga mambabasang kausap at nagbabago sa ipinagkaibang “kayo ... sa amin” sa unang sugnay.
  - severity: medium
    issue: Footnote b ay nagsasabing hindi ipinakikita ng Griyego ang “aming/ating” saklaw
    rationale: Ang Griyego ay malinaw na gumagamit ng unang panauhang pangmaramihang pang-angkin (“aming”). Maaaring pag-usapan sa antas ng diskurso kung sino ang bumubuo sa “kami,” ngunit hindi dapat ipakita ng tala na walang ganitong pang-angking pagkakaiba o gamitin ito upang bigyang-katwiran ang inklusibong “natin.”
  - severity: low
    issue: Mga footnote marker ay kapuwa nasa hulihan ng talata
    rationale: Mas malinaw na ilagay ang lexical note sa “pakikiisa” at ang alternatibong salin ng Χριστός sa “Mesiyas,” upang tumugma ang bawat anchor sa paksang tinatalakay nito.
