translation:
  language: tl
  text: At isinusulat namin ang mga bagay na ito upang malubos ang aming kagalakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “inyong kagalakan” sa halip na “aming kagalakan.”'
