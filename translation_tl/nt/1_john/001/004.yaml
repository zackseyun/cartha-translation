lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa naunang patotoo at pinananatili ang ugnayan ng talata sa konteksto.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili nito ang maramihang anyo ng demonstratibo at tumutukoy sa nilalaman ng isinusulat.
- source_word: γράφομεν
  choice: isinusulat namin
  rationale: Ang aspektong pangkasalukuyan ay natural na naipahahayag bilang nagpapatuloy na gawain ng pagsulat.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ang hayag na panghalip sa Griyego ay binibigyang-diin ang mga sumulat; sa Tagalog, likas itong ipinahahayag sa panghalip na kaugnay ng pandiwa.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na panandang nagsasaad ng layunin, habang nananatiling natural sa modernong Tagalog.
- source_word: ἡ χαρά
  choice: ang ating kagalakan
  rationale: Ang “kagalakan” ay karaniwan, malinaw, at angkop na katumbas ng χαρά sa kontekstong Juanino.
- source_word: ἡμῶν
  choice: ating
  rationale: Isinasalin nang tuwiran ang unang panauhang maramihan ng SBLGNT. Ginamit ang inklusibong “ating” sapagkat ang layunin ng sulat ay kagalakang pinagsasaluhan ng mga sumulat at mga mambabasa, bagaman hindi tahasang itinatakda ng Griyego ang inklusibo o eksklusibong anyo.
- source_word: ᾖ πεπληρωμένη
  choice: malubos
  rationale: Maikli at natural nitong ipinahahayag ang kalagayang umabot sa ganap na kapuspusan o kaganapan na taglay ng periphrastic perfect passive construction.
theological_decisions:
- issue: Panghalip sa pariralang ἡ χαρὰ ἡμῶν
  choice: ating kagalakan
  alternative: inyong kagalakan
  rationale: Ang ibinigay na tekstong Griyego ay may ἡμῶν (“natin/atin”), kaya ito ang nasa pangunahing teksto. Ang kilalang variant na “inyong” ay inilagay sa talababa upang mapanatili ang mahalagang ebidensiyang tekstuwal.
- issue: Inklusibo o eksklusibong kahulugan ng unang panauhang maramihan
  choice: ating
  alternative: aming
  rationale: Hindi ipinag-iiba ng Griyegong ἡμῶν ang inklusibo at eksklusibong “our.” Pinili ang “ating” dahil ang naunang talata ay naglalayong magkaroon ng pakikisama ang mga mambabasa sa mga sumulat, kaya ang kagalakan ay likas na maunawaang pinagsasaluhan. Gayunman, nananatiling tunay na posibilidad ang “aming.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang payak na estilo ng sulat at ang tekstuwal na variant sa talababa.
