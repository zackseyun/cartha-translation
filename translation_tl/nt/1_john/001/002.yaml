base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: tl
  text: At nahayag ang buhay[a], at nakita na namin at nagpapatotoo kami at ipinapahayag namin sa inyo ang buhay na walang hanggan[b], na kasama ng Ama at nahayag sa amin—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpakita” o “ginawang hayag” para sa “nahayag” (ἐφανερώθη).
    reason: lexical_alternative
  - marker: b
    text: Sa balarila, ang “buhay na walang hanggan” ay ipinahahayag bilang isang bagay, ngunit sa konteksto ay personal itong tumutukoy sa Anak—ang kasama ng Ama at nahayag sa mga apostol.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: ang buhay
  rationale: Pinanatili ang tiyak na pagtukoy sa “buhay.” Sa konteksto, hindi lamang abstraktong buhay ang tinutukoy kundi isang tiyak at personal na realidad na kaugnay ng Anak.
- source_word: ἐφανερώθη
  choice: nahayag
  rationale: Ang “nahayag” ay likas at marangal na salin ng aorist passive na nagpapahiwatig na ang dating hindi lantad ay naging hayag. Hindi nito nililimitahan ang kahulugan sa pisikal na pagpapakita lamang.
- source_word: ἑωράκαμεν
  choice: nakita namin
  rationale: Tuwirang ipinapahayag ang karanasan ng mga saksi. Bagaman hindi tahasang naipapakita ng anyong Tagalog ang Greek perfect, malinaw sa daloy na ang pagkakita nila ang batayan ng patuloy nilang patotoo.
- source_word: μαρτυροῦμεν
  choice: pinatototohanan
  rationale: Pinananatili nito ang diwa ng pagbibigay-patotoo bilang mga saksi at malinaw itong naiiba sa kasunod na pagpapahayag.
- source_word: ἀπαγγέλλομεν
  choice: ipinapahayag
  rationale: Natural na inilalarawan nito ang aktibong paghahatid ng mensahe sa mga tagapakinig nang hindi pinahihina bilang simpleng pag-uulat.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang isinasaad ang pinag-uukulan ng pagpapahayag.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ang buhay na walang hanggan
  rationale: Ito ang natural at kinikilalang katumbas sa modernong Tagalog, habang pinananatili ng “ang” ang pagiging tiyak ng tinutukoy na buhay.
- source_word: ἥτις
  choice: na
  rationale: Ang pang-ugnay na “na” ay natural na tumutukoy sa “buhay na walang hanggan” at hindi sapilitang nilulutas kung ito ay dapat ipahayag sa paraang impersonal o personal.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: kasama ng Ama
  rationale: Natural nitong ipinapahayag ang ugnayan at pagiging kapiling ng Ama, kaayon ng gamit ni Juan, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: τὸν πατέρα
  choice: ang Ama
  rationale: Ginamit ang malaking titik sapagkat banal na titulo ito na tumutukoy sa Diyos Ama.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Mahalaga ang tahasang pagtukoy sa mga apostolikong saksi na pinagpakitaan o pinahayagan.
theological_decisions:
- issue: Kung gagawing tahasang personal ang “buhay”
  choice: Pinanatili ang “ang buhay” at “ang buhay na walang hanggan” sa pangunahing teksto.
  alternative: “siya” o tahasang “ang Anak”
  rationale: Zωή (“buhay”), hindi panlalaking panghalip o pangalan ng Anak, ang ginamit ng Griyego. Hinahayaan nitong lumitaw sa konteksto ang personal na tinutukoy nang pinananatili ang teolohikal at pampanitikang lalim ng pahayag ni Juan.
- issue: Kung gaano kat tahasang ipaliliwanag ang preeksistensiya sa πρὸς τὸν πατέρα
  choice: “kasama ng Ama”
  alternative: “nasa presensiya ng Ama”
  rationale: Pinananatili nito ang personal na ugnayan sa Ama at ang pahiwatig ng pag-iral bago ang paghahayag, ngunit hindi ito pinalalawak bilang doktrinal na paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang mahabang, magkakaugnay na daloy ng pangungusap at ang pangwakas na gatlang, sapagkat bahagi ang talata ng parentetikong pahayag na nagpapatuloy mula at tungo sa mga karatig na talata. Ang sunod-sunod na “nakita namin, pinatototohanan, at ipinapahayag” ay sadyang maigsi upang maging natural sa Tagalog habang pinananatili ang tatlong kilos ng tekstong Griyego.
