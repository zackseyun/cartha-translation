base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: tl
  text: Kung sinasabi nating hindi tayo nagkasala[a], ginagawa natin siyang sinungaling, at wala sa atin ang kanyang salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “hindi tayo nagkasala.” Nasa perfect ang pandiwang Griyego, kaya tumutukoy ito sa nagawang pagkakasala na may kabuluhan sa kasalukuyan. Hindi nito tahasang sinasabing “hinding-hindi tayo nagkasala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “salita” ay maaari ring isaling “mensahe.” Maaaring taglayin ng Griyegong λόγος ang alinmang kahulugan; pinanatili rito ang “salita” upang maingatan ang pananalitang karaniwan kay Juan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Kung sinasabi natin
  rationale: Likas na ipinapahayag sa Filipino ang kondisyon ng ἐὰν kasama ang subjunctive, nang hindi dinaragdagan ng mas matinding diwang gaya ng “iginigiit.”
- source_word: οὐχ ἡμαρτήκαμεν
  choice: hindi tayo nagkasala
  rationale: Ito ang natural na katumbas sa modernong Filipino ng pagtanggi sa nagawang pagkakasala. Hindi malinaw na minamarkahan ng Filipino ang aspektong perfect na gaya sa Griyego, kaya ipinaliliwanag sa talababa ang nakaraang kilos na may kabuluhan sa kasalukuyan.
- source_word: ψεύστην
  choice: sinungaling
  rationale: Pinananatili ang tuwiran at personal na pangngalan ng Griyegong ψεύστης sa halip na palambutin bilang “mali.”
- source_word: ποιοῦμεν αὐτὸν
  choice: ginagawa natin siyang
  rationale: 'Tuwirang pinananatili ang konstruksyong may predicate accusative: sa ating sinasabi, itinuturing o ipinahahayag natin siyang sinungaling.'
- source_word: ὁ λόγος αὐτοῦ
  choice: ang kanyang salita
  rationale: Ang λόγος ay maaaring tumukoy sa salita o mensahe. Pinili ang “salita” upang mapanatili ang bokabularyong katangian ng mga sulat ni Juan at ang lawak ng posibleng kahulugan.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: wala sa atin
  rationale: Natural at maikli itong Filipino na nagpapanatili sa panloob na diwa ng ἐν ἡμῖν, nang hindi idinaragdag ang larawang “nananahan.”
theological_decisions:
- issue: Tinutukoy ng αὐτόν / αὐτοῦ
  choice: Pinanatili ang panghalip na “siya/kanya,” na sa konteksto ay tumutukoy sa Diyos.
  alternative: Tahasang sabihing “Diyos” sa pangunahing teksto.
  rationale: Ang Diyos ang malinaw na tinutukoy sa konteksto ng 1 Juan 1:5–10, ngunit panghalip ang ginamit ng Griyego. Ang pagpapanatili rito ay tapat sa anyo ng pinagmulan at hindi kailangang lutasin sa pangunahing teksto ang ipinauunawa na ng konteksto.
translation_notes:
  register: Modernong Filipino na simple, tuwiran, at marangal. Ginamit ang “tayo” bilang inklusibong unang panauhang maramihan, gaya ng natural na pagbasa sa pangangaral ng may-akda sa sarili at sa kanyang mga mambabasa. Inilagay ang marker [b] pagkatapos ng buong pariralang “kanyang salita” upang malinaw na iyon ang tinatalabaan.
