  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: tl
  text: 'Sa ganito natin nalalaman na iniibig natin ang mga anak ng Diyos: kapag iniibig natin ang Diyos at sinusunod natin ang kanyang mga utos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ginagawa natin ang kanyang mga utos.” Ang pandiwang Griyego rito ay ποιῶμεν (“ginagawa natin”), hindi ang mas karaniwang τηρέω (“tinutupad” o “iniingatan”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganito
  rationale: Likas na pormang Filipino para sa Johanine na pananalitang nagpapakilala sa batayan o palatandaan kung paano nalalaman ang isang bagay; pinananatili ang puwersa ng demonstratibo.
- source_word: γινώσκομεν
  choice: nalalaman natin
  rationale: Malinaw at likas na salin ng pangkasalukuyang anyo, na nagpapahayag ng pagkilala o kaalamang nagpapatuloy.
- source_word: ἀγαπῶμεν
  choice: iniibig natin
  rationale: Pinananatili ang tuwirang diwa ng ἀγαπάω at ang marangal na rehistro ng talata.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: ang mga anak ng Diyos
  rationale: Ang τέκνα ay inklusibong 'mga anak,' at pinananatili ng parirala ang ugnayang genitibo sa Diyos.
- source_word: ὅταν
  choice: kapag
  rationale: Naipahahayag ang kondisyunal-temporal na diwa ng ὅταν kasama ng mga pandiwang nasa subjunctive, nang hindi ito nililimitahan sa isang pagkakataon lamang.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: sinusunod natin ang kanyang mga utos
  rationale: Bagaman literal na 'ginagawa' ang ποιῶμεν, ang 'sinusunod ang mga utos' ang natural at malinaw na kolokasyon sa modernong Filipino; itinatala sa talababa ang leksikal na detalye.
theological_decisions:
- issue: Ugnayan ng pag-ibig sa mga anak ng Diyos, pag-ibig sa Diyos, at pagsunod sa kanyang mga utos
  choice: Inilalahad ang pag-ibig sa Diyos at pagsunod sa kanyang mga utos bilang pamantayang kaugnay ng pagkaalam na iniibig natin ang mga anak ng Diyos.
  alternative: Maaaring unawain ito bilang mahigpit na ebidensiya, sanhi ng pag-ibig sa kapwa, o kapwa-kahulugan ng dalawang uri ng pag-ibig.
  rationale: Hindi tahasang nilulutas ng Griyego kung evidential, causal, o definitional ang lohikal na ugnayan; pinananatili ng salin ang maigsi at may-tensiyong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “iniibig” para sa dignified biblical register at “sinusunod” para sa karaniwang paraan ng pagsasabi tungkol sa mga utos; pinanatili sa talababa ang literal na pandiwa.
