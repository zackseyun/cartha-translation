  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: tl
  text: Ang lahat ng kalikuan ay kasalanan,[a] at may kasalanang hindi humahantong sa kamatayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang bawat masamang gawa ay kasalanan,” o “Ang lahat ng kawalang-katarungan ay kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: O “may kasalanang hindi nagbubunga ng kamatayan”; mas literal, “may kasalanang hindi tungo sa kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: ang lahat ng kalikuan
  rationale: Ipinahahayag ng πᾶσα ang kabuuang saklaw. Ang “kalikuan” ay natural at marangal na salin na sumasaklaw sa moral na kamalian nang hindi nililimitahan ang diwa sa kawalang-katarungang panlipunan lamang.
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Ito ang karaniwan at tumpak na katumbas sa kontekstong biblikal; pareho itong ginamit sa dalawang paglitaw ng salita.
- source_word: καὶ
  choice: at
  rationale: Pinananatili nito ang payak na pag-uugnay ng pangkalahatang pahayag at ng kasunod na paglilinaw.
- source_word: οὐ πρὸς θάνατον
  choice: hindi humahantong sa kamatayan
  rationale: Ipinahahayag nito nang malinaw sa modernong Tagalog ang direksiyon o kinalabasan na maaaring ipahiwatig ng πρὸς, at umaayon sa parirala sa naunang talata.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwirang salin ito na hindi nagpapasya kung pisikal, espirituwal, o pangwakas na kamatayan ang tinutukoy.
theological_decisions:
- issue: Kalikasan ng “kamatayan” sa pariralang οὐ πρὸς θάνατον
  choice: Panatilihin lamang ang “kamatayan” nang walang paliwanag na nagtatakda sa kahulugan nito.
  alternative: Pisikal na kamatayan; espirituwal na kamatayan; pangwakas na hatol.
  rationale: Hindi nililinaw ng tekstong Griyego kung anong uri ng kamatayan ang tinutukoy, kaya pinananatili ng salin ang tunay na kalabuan.
- issue: Saklaw ng ἀδικία
  choice: kalikuan
  alternative: masamang gawa; kawalang-katarungan; di-pagkamatuwid
  rationale: Ang “kalikuan” ay may malawak na moral na saklaw at angkop sa marangal ngunit nauunawaang rehistro. Hindi nito pinaliliit ang diwa tungo sa legal o panlipunang kawalang-katarungan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “humahantong sa” upang maipahayag ang puwersa ng πρὸς sa paraang madaling maunawaan, habang pinananatiling bukas ang kahulugan ng “kamatayan.”
