  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: tl
  text: 'At ito ang patotoo: binigyan tayo ng Diyos ng buhay na walang hanggan,[a] at ang buhay na ito ay nasa kanyang Anak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ibinigay sa atin ng Diyos ang buhay na walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: patotoo
  rationale: Likas at malinaw na katumbas na tumutukoy sa nilalaman ng pagsaksi sa kontekstong Juanino.
- source_word: ὅτι
  choice: ':'
  rationale: Sa Filipino, natural na ipinakikilala ng tutuldok ang mismong nilalaman ng patotoo nang hindi dinaragdagan ang kahulugan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Karaniwan, malinaw, at dignified na salin na nagpapanatili sa tagal at teolohikal na diwa ng buhay mula sa Diyos.
- source_word: ἔδωκεν
  choice: Binigyan
  rationale: Pinananatili ang aspektong ganap ng Griyegong aorist; sa Filipino, naipahihiwatig ng konteksto ang nananatiling bunga ng natapos na pagbibigay.
- source_word: ὁ θεὸς ἡμῖν
  choice: tayo ng Diyos
  rationale: Ang pokus-sa-tumatanggap na ayos na “Binigyan tayo ng Diyos” ay natural sa Filipino at tumpak na inilalahad ang Diyos bilang gumagawa at tayo bilang tumatanggap.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: nasa kanyang Anak
  rationale: Pinananatili ang lakas ng ἐν at ang masinsing idyomang Juanino na ang buhay ay nasa Anak, sa halip na paliitin ito sa “sa pamamagitan ng.”
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: ito ... ang buhay na ito
  rationale: Pinananatili ang pag-uulit ng demonstratibo upang maiugnay nang mariin ang patotoo at ang buhay na kababanggit.
theological_decisions:
- issue: Lakas ng aorist na ἔδωκεν at ang kasalukuyang pag-aangkin sa buhay
  choice: “Binigyan tayo ng Diyos”
  alternative: “Ibinigay sa atin ng Diyos” o “Nagbigay sa atin ang Diyos”
  rationale: Ipinapahayag ang natapos na gawa ng Diyos nang hindi ipinapasok sa pandiwa ang isang teolohikal na sistema; ang kasalukuyang kabuluhan nito ay malinaw sa pahayag na ang buhay ay nasa Anak.
- issue: Kahulugan ng buhay na “nasa kanyang Anak”
  choice: Pinanatili ang “nasa kanyang Anak”
  alternative: “sa pamamagitan ng kanyang Anak” o “kasama ng kanyang Anak”
  rationale: Hindi nilulutas o pinapaliit ang siksik na pahayag ng teksto tungkol sa kinaroroonan, pinagmumulan, at kaugnayan ng buhay sa Anak.
translation_notes:
  register: Modernong Filipino Tagalog na natural, payak, at marangal. Ginamit ang “patotoo,” “buhay na walang hanggan,” at “nasa kanyang Anak” bilang pamilyar ngunit tumpak na wikang biblikal. Ang tanging talababa ay nagtatala ng isang mas pormal na alternatibo sa ayos at anyo ng ἔδωκεν.
