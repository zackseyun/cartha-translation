  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Griyego: pinananatili ang kondisyunal na lohika, ang dalawang ulit na «alam natin,» ang «dinirinig niya tayo» na hindi ginagawang «sinasagot,» ang malawak na saklaw ng ὃ ἐὰν, at ang kasalukuyang diwa ng ἔχομεν sa «nasa atin.» Ang «sa kanya» ay likas na Tagalog para sa ἀπ’ αὐτοῦ sa konteksto ng paghingi.'
