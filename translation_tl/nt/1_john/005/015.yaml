  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: tl
  text: At kung alam nating dinirinig niya tayo sa anumang hinihingi natin,[a] alam nating nasa atin ang mga kahilingang hiningi natin sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anuman ang hingin natin.” Ang pagkakabuo sa Griyego ay nagpapahayag ng bukás at malawak na diwang “anuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: dinirinig niya tayo
  rationale: Likas sa modernong Tagalog sa konteksto ng panalangin at hindi nito ipinapalagay na ang kahulugan ay agad na 'sinasagot niya tayo.'
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: sa anumang hinihingi natin
  rationale: 'Pinananatili ang bukás at malawak na diwa ng di-tiyak na sugnay na may ἐάν: ''anuman ang hingin natin.'''
- source_word: αἰτώμεθα
  choice: hinihingi natin
  rationale: Ang 'hingin' ang pinakadirekta at natural na salita para sa paghingi sa panalangin.
- source_word: ἔχομεν
  choice: nasa atin
  rationale: Ipinahahayag ang kasalukuyang pag-aari na tinutukoy ng ἔχομεν, nang hindi ito ginagawang 'tatanggapin natin.'
- source_word: τὰ αἰτήματα
  choice: ang mga kahilingan
  rationale: Tumutukoy sa mga bagay na hiniling at pinananatili ang ugnayang leksikal sa pandiwang 'hingin.'
- source_word: ἃ ᾐτήκαμεν
  choice: na hiningi natin
  rationale: Ipinakikita ang naganap nang paghingi; natural sa Tagalog ang aspektong kontemplatibo rito.
- source_word: ἀπ’ αὐτοῦ
  choice: sa kanya
  rationale: Sa Tagalog, ang 'humingi sa kanya' ang natural na paraan upang ipahayag ang pinagmumulan o taong pinag-ukulan ng kahilingan.
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Pinananatili ang paulit-ulit at mahalagang diin ng sulat sa kaalaman at katiyakan.
theological_decisions:
- issue: Kung ang ἀκούει ay simpleng 'dinirinig' o nagpapahiwatig na ng kanais-nais na sagot.
  choice: dinirinig niya tayo
  alternative: sinasagot niya tayo
  rationale: Hindi pinagsasanib ang pagdinig ng Diyos at ang kasunod na pahayag tungkol sa pagkakaroon ng mga kahilingan; pinananatili nito ang lohika at tensiyong nasa Griyego.
- issue: Kung ang ἔχομεν ay dapat gawing panghinaharap na pagtanggap.
  choice: nasa atin
  alternative: tatanggapin natin
  rationale: Kasalukuyang panahunan ang Griyego at tahasang nagsasabing 'mayroon tayo'; ang panghinaharap na 'tatanggapin' ay interpretatibong pagpapalawak.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang 'dinirinig' sa halip na 'sinasagot' upang hindi lumabis sa tahasang sinasabi ng teksto; ginamit ang 'nasa atin' upang mapanatili ang kasalukuyang diwa ng ἔχομεν.
