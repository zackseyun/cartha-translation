  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: tl
  text: 'Kung tinatanggap natin ang patotoo ng mga tao, higit na dakila ang patotoo ng Diyos, sapagkat ito ang patotoo ng Diyos: nagpatotoo siya tungkol sa kanyang Anak.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang huling bahagi bilang: “sapagkat nagpatotoo siya tungkol sa kanyang Anak.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: patotoo
  rationale: Likas at malinaw sa modernong Filipino, at pinananatili ang pag-uulit ng salitang Griyego at ang diwang ebidensiyal nito.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Ang ἄνθρωπος ay pangkalahatang tumutukoy sa mga tao rito, bilang pagsalungat sa Diyos; hindi ito limitado sa mga lalaking nasa hustong gulang.
- source_word: λαμβάνομεν
  choice: tinatanggap natin
  rationale: Sa konteksto ng patotoo, ang λαμβάνω ay tumutukoy sa pagtanggap o pagkilala rito bilang mapananaligan.
- source_word: μείζων
  choice: higit na dakila
  rationale: Ipinahahayag nito na nakahihigit ang patotoo ng Diyos sa patotoo ng tao, habang pinananatili ang payak na paghahambing ng Griyego.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: ito ang patotoo ng Diyos
  rationale: Direkta at natural na salin na pinananatili ang retorikal na pag-uulit ng “patotoo ng Diyos.”
- source_word: μεμαρτύρηκεν
  choice: nagpatotoo siya
  rationale: Ang perpektong panahunan ay tumutukoy sa patotoong naibigay na at nananatiling may bisa; sa Filipino, natural itong ipinahahayag ng “nagpatotoo” sa kontekstong ito.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: tungkol sa kanyang Anak
  rationale: Ang περί na may genitive ay nangangahulugang “tungkol sa” o “hinggil sa”; ang “tungkol sa” ay malinaw at kasalukuyang gamit.
theological_decisions:
- issue: Pangkalahatang saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang reperensiya ng salita at ang kaibahan ay patotoo ng tao laban sa patotoo ng Diyos; ang “mga lalaki” ay maaaring maling magpahiwatig na kasarian lamang ang tinutukoy.
- issue: Gamit ng ikalawang ὅτι
  choice: 'panandang nagpapakilala sa nilalaman: “nagpatotoo siya tungkol sa kanyang Anak”'
  alternative: 'panandang sanhi: “sapagkat nagpatotoo siya tungkol sa kanyang Anak”'
  rationale: Pinakamalamang na ipinakikilala ng ikalawang ὅτι kung ano ang patotoo ng Diyos. Gayunman, posible rin sa balarila ang pagbasa rito bilang sanhi, kaya inilalahad iyon sa talababa.
- issue: Lakas ng μείζων
  choice: higit na dakila
  alternative: higit na mapananaligan
  rationale: Hindi tahasang sinasabi ng Griyego kung sa anong paraan “greater” ang patotoo. Iniiwasan ng pangunahing salin na paliitin ito sa pagiging mapananaligan lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tatlong ulit na “patotoo” upang masalamin ang diin at pagkakaugnay ng Griyego. Ginamit ang “mga tao” para sa pangkalahatang ἀνθρώπων at hindi ang mas makitid na “mga lalaki.”
