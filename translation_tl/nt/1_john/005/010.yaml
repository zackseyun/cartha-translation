id: 1JN.5.10
reference: 1 John 5:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: tl
  text: Ang sumasampalataya sa Anak ng Diyos ay taglay ang patotoo sa kanyang sarili[a]. Ang hindi naniniwala sa Diyos ay itinuring niyang sinungaling ang Diyos[b], sapagkat hindi niya pinaniwalaan ang patotoong ibinigay ng Diyos tungkol sa kanyang Anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskritong kababasahan ng “sa kanya” sa halip na “sa kanyang sarili”; maaari itong unawaing ang patotoo ay nasa Anak sa halip na nasa sumasampalataya.
    reason: textual_variant
  - marker: b
    text: 'Mas literal: “ginawa niyang sinungaling ang Diyos.” Ibig sabihin, ang pagtanggi sa patotoo ng Diyos ay pagtrato sa Diyos na para bang hindi siya nagsasabi ng totoo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Ang sumasampalataya
  rationale: Ang substantival na present participle ay tumutukoy sa sinumang patuloy na nananampalataya; natural at karaniwang pananalita ang “ang sumasampalataya.”
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: sa Anak ng Diyos
  rationale: Kasama ng πιστεύω, ang εἰς ay nagpapahayag ng pananampalatayang nakatuon sa isang persona; sapat itong naipahahayag ng “sumasampalataya sa.”
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Pinananatili nito ang diwang legal at personal ng μαρτυρία sa mga sulat ni Juan.
- source_word: ἐν αὑτῷ
  choice: sa kanyang sarili
  rationale: Ang reflexive pronoun sa SBLGNT ay likas na tumutukoy pabalik sa taong sumasampalataya at nagpapahiwatig na nasa kanya ang patotoo.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: Ang hindi naniniwala sa Diyos
  rationale: Sa konteksto, nangangahulugan itong hindi pagtanggap bilang totoo sa sinabi o patotoo ng Diyos, hindi lamang kawalan ng paniniwala na umiiral ang Diyos.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: ay pinalalabas na sinungaling ang Diyos
  rationale: 'Ipinahahayag ng natural na idyomang Filipino ang diwa ng pariralang Griyego: sa pagtanggi sa patotoo ng Diyos, itinuturing o inilalarawan siyang hindi nagsasabi ng totoo. Ang Diyos ay inulit bilang pangngalan upang maiwasan ang malabong reperensiya ng panghalip.'
- source_word: οὐ πεπίστευκεν
  choice: hindi niya pinaniwalaan
  rationale: Ang anyong perfect ay nagpapahiwatig ng pagtangging may nananatiling bisa; ang “hindi niya pinaniwalaan” ay natural na tumutukoy sa hindi pagtanggap sa patotoo bilang totoo.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: patotoong ibinigay ng Diyos
  rationale: Mas natural ito sa modernong Filipino kaysa sa mabigat na “patotoong pinatotohanan ng Diyos,” habang pinananatili ang Diyos bilang pinagmulan ng patotoo.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: tungkol sa kanyang Anak
  rationale: Tuwirang ipinahahayag nito ang kahulugan ng περί na may genitive sa kontekstong ito.
theological_decisions:
- issue: Kinaroroonan ng patotoo
  choice: Taglay ng sumasampalataya ang patotoo sa kanyang sarili.
  alternative: Ang patotoo ay nasa Anak, ayon sa ibang pagbasa ng manuskrito.
  rationale: Ang SBLGNT ay may reflexive na ἐν αὑτῷ, na pinakanatural na tumutukoy sa sumasampalatayang kababanggit lamang; hindi dinagdagan ng paliwanag kung ano ang eksaktong kalikasan ng panloob na patotoong ito.
- issue: Kahulugan ng hindi paniniwala sa Diyos
  choice: Pagtanggi ito sa patotoo ng Diyos bilang totoo.
  alternative: Pangkalahatang kawalan ng paniniwala sa pag-iral ng Diyos.
  rationale: Nililinaw ng kasunod na ὅτι-clause na ang tinutukoy ay hindi paniniwala sa patotoo ng Diyos tungkol sa kanyang Anak.
- issue: Diwa ng “ginawang sinungaling”
  choice: Pinalalabas na sinungaling ang Diyos.
  alternative: Literal na “ginawa niyang sinungaling ang Diyos.”
  rationale: Hindi sinasabing aktuwal na binabago ng tao ang katangian ng Diyos; ang pagtanggi sa patotoo ay mistulang paghatol na hindi totoo ang Diyos. Pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sumasampalataya” para sa pananampalataya sa Anak, “patotoo” para sa Johannine witness language, at natural na idyomang “pinalalabas na sinungaling” upang maiwasan ang maling impresyong kayang baguhin ng tao ang likas na katangian ng Diyos. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
