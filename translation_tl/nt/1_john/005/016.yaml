revisions:
- from: Kung makita ng sinuman na ang kanyang kapatid ay gumagawa ng kasalanang hindi humahantong sa kamatayan,[a][b] humingi siya, at bibigyan siya ng Diyos ng buhay—ang mga gumagawa ng kasalanang hindi humahantong sa kamatayan.[c] May kasalanang humahantong sa kamatayan; hindi ko sinasabing humingi siya tungkol doon.
  to: Kung makita ng sinuman ang kanyang kapatid na gumagawa ng isang kasalanang hindi humahantong sa kamatayan,[a][b] humiling siya, at bibigyan ng Diyos ng buhay ang kapatid—ang mga gumagawa ng mga kasalanang hindi humahantong sa kamatayan.[c] May kasalanang humahantong sa kamatayan; hindi ko sinasabing humiling siya tungkol doon.
  rationale: Ginawang “gumagawa ng isang kasalanan” upang maipakita ang kongkretong kasalanang tinutukoy ng Griyego. Pinalitan ang ikalawang panghalip ng “ang kapatid” upang malinaw na ang kapatid na nagkakasala, hindi ang taong humihiling, ang tatanggap ng buhay. Pinanatili ang maramihang paliwanag pagkatapos ng gitling, ang ambigwidad ng “kamatayan,” at ang maingat na pahayag na hindi tuwirang nagbabawal sa paghiling.
