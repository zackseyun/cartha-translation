id: 1JN.5.16
reference: 1 John 5:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: tl
  text: Kung makita ng sinuman ang kanyang kapatid na gumagawa ng isang kasalanang hindi humahantong sa kamatayan,[a][b] humiling siya, at bibigyan ng Diyos ng buhay ang kapatid—ang mga gumagawa ng mga kasalanang hindi humahantong sa kamatayan.[c] May kasalanang humahantong sa kamatayan; hindi ko sinasabing humiling siya tungkol doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tinutukoy ng Griyego kung ang “kamatayan” dito ay pisikal na kamatayan, espirituwal na kamatayan, o panghuling paghatol.
    reason: theological_ambiguity
  - marker: b
    text: Ang “kapatid” ay panlalaking isahan sa Griyego at malamang na tumutukoy sa isang kapwa mananampalataya; sa konteksto, maaari nitong saklawin ang sinumang kapwa Kristiyano.
    reason: cultural_note
  - marker: c
    text: Sa Griyego, “at bibigyan niya siya ng buhay.” Hindi tahasang binanggit ang simuno; ginawang malinaw sa salin ang “Diyos” dahil siya ang nauunawaang nagbibigay bilang tugon sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: kapatid
  rationale: Likas sa Tagalog ang “kapatid” at maaari itong tumukoy sa kapatid na lalaki o sa kapwa mananampalataya. Bagaman panlalaking isahan ang anyong Griyego, hindi likas na ipinahihiwatig ng salitang Tagalog ang kasarian; ipinapaliwanag sa talababa ang konteksto.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: gumagawa ng kasalanan
  rationale: Idyomatikong inilalarawan nito ang kongkretong paggawa ng isang kasalanan nang hindi ginagaya ang di-likas na cognate construction ng Griyego.
- source_word: μὴ πρὸς θάνατον
  choice: hindi humahantong sa kamatayan
  rationale: Ipinapahayag nito ang direksiyon o kinahihinatnan na dala ng πρός, habang pinananatiling bukas kung pisikal, espirituwal, o panghuling kamatayan ang tinutukoy.
- source_word: αἰτήσει
  choice: humingi siya
  rationale: Ang future indicative ay maaaring magkaroon ng diwang pautos sa konteksto. Ang “humingi siya” ay natural na Tagalog at ang konteksto ay nagpapakitang panalangin ang paghingi.
- source_word: δώσει αὐτῷ ζωήν
  choice: bibigyan siya ng Diyos ng buhay
  rationale: Walang tahasang simuno ang pandiwang Griyego. Nililinaw sa salin na Diyos ang nagbibigay, gaya ng malakas na ipinahihiwatig ng konteksto ng paghingi sa panalangin, at itinatala ang pagdaragdag sa talababa.
- source_word: ζωήν
  choice: buhay
  rationale: Pinananatili ang payak ngunit teolohikong mayamang katawagan ni Juan at hindi ito pinakikitid sa “espirituwal na buhay” o “buhay na walang hanggan.”
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: —ang mga gumagawa ng kasalanang hindi humahantong sa kamatayan
  rationale: Pinananatili ng gitling at pariralang paliwanag ang mahirap at bahagyang di-tiyak na ugnayang sintaktiko ng datibong parirala, pati ang paglipat sa maramihan.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: May kasalanang humahantong sa kamatayan
  rationale: Pinananatili nito ang maikli at walang-artikulong pahayag nang hindi nagpapasiya kung isang partikular na gawa o isang uri ng kasalanan ang tinutukoy.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: hindi ko sinasabing humingi siya tungkol doon
  rationale: Pinananatili ang pagkakaugnay ng dalawang pandiwa ng paghiling nang hindi ipinapalagay na ganap na magkapareho ang αἰτέω at ἐρωτάω. Hindi rin ginagawang tahasang pagbabawal ang mas maingat na pahayag ng Griyego.
theological_decisions:
- issue: Kahulugan ng “kamatayan” sa kasalanang humahantong dito
  choice: Panatilihin lamang ang “kamatayan” nang walang pagtukoy sa uri nito.
  alternative: Pisikal na kamatayan bilang hatol ng Diyos; espirituwal o walang-hanggang kamatayan; panghuling paghatol.
  rationale: Hindi tinutukoy ng talata kung anong uri ng kamatayan ito. Ang paglilinaw sa pangunahing teksto ay magpapasiya sa isang tunay na pinagtatalunang kahulugan.
- issue: Simuno ng “bibigyan siya ng buhay”
  choice: Gawing tahasang simuno ang Diyos.
  alternative: Panatilihing “bibigyan niya siya” o unawain ang humihingi bilang tagapagbigay.
  rationale: Bagaman hindi binanggit ang simuno sa Griyego, ang konteksto ng paghingi sa panalangin ay malakas na tumutukoy sa Diyos bilang nagbibigay ng buhay. Nililinaw ito sa Tagalog at minamarkahan sa talababa.
- issue: Lakas ng huling pahayag tungkol sa paghiling
  choice: “Hindi ko sinasabing humingi siya tungkol doon.”
  alternative: “Huwag siyang humingi tungkol doon.”
  rationale: Ang Griyego ay hindi tuwirang nagbabawal; sinasabi lamang ng may-akda na hindi niya sinasabing humingi tungkol sa gayong kasalanan. Pinananatili ng salin ang pagkakaibang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “humahantong” upang malinaw na ipahayag ang resultative force ng πρός nang hindi nilulutas ang uri ng kamatayan. Iniwasan ang sobrang pormal na “hinggil doon” at ang mas denominasyonal o interpretatibong mga terminong wala sa Griyego. Ang bahagyang mabigat na parirala matapos ang gitling ay sadyang nagpapanatili sa sintaktikong tensiyon ng orihinal.
