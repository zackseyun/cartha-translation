    rationale: Ang kasalukuyang “Ang bawat nananampalatayang si Jesus ang Mesiyas” ay hindi wastong pagkakabuo sa Tagalog. Kailangang ipakilala ang nilalaman ng pananampalataya sa pamamagitan ng “na.”
  - severity: medium
    issue: Ang “nagsilang” ay maaaring magpahiwatig ng maternal na panganganak.
    rationale: Bagaman leksikal na kaugnay ito ng “isinilang,” ang γεννήσαντα ay panlalaking participle at tumutukoy sa Diyos bilang begetter. Ang “nagbigay-buhay sa kanya” ay mas neutral at natural sa Tagalog, nang hindi ipinapataw ang titulong “Ama.”
