id: 1JN.5.1
reference: 1 John 5:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: tl
  text: Ang bawat nananampalataya na si Jesus ang Mesiyas[a] ay ipinanganak ng Diyos,[b] at ang bawat umiibig sa nagbigay-buhay sa kanya ay umiibig din sa isinilang mula sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Cristo.” Ang salitang Griyego na Χριστός ay isang titulo na nangangahulugang “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Iisang pandiwang Griyego ang pinagmulan ng “ipinanganak,” “nagbigay-buhay,” at “isinilang” sa talatang ito.
    reason: lexical_connection
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Ang bawat nananampalataya
  rationale: Ang articular present participle ay pangkalahatan at substantibo. Likas sa modernong Tagalog ang “ang bawat nananampalataya” at pinananatili nito ang diwang tumutukoy sa lahat ng kabilang sa uring ito.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: na si Jesus ang Mesiyas
  rationale: Ang Χριστός ay titulo rito. Ang “Mesiyas” ay malinaw na naghahayag kay Jesus bilang ipinangakong pinahiran, sa halip na ituring ang titulo na wari’y personal na pangalan lamang.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: ay ipinanganak ng Diyos
  rationale: Ipinahihiwatig ng perfect passive ang naganap nang kapanganakang may nananatiling bunga. Ang “ipinanganak ng Diyos” ay natural na pahayag sa Tagalog para sa temang bagong kapanganakan ni Juan.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: ang bawat umiibig
  rationale: Pinananatili nito ang pangkalahatang saklaw at ang kasalukuyan o katangiang diwa ng participle nang hindi nagiging mabigat ang pananalita.
- source_word: τὸν γεννήσαντα
  choice: sa nagsilang
  rationale: Ang “nagsilang” ay aktibong anyo na hindi tahasang pinapalitan ng interpretibong titulong “Ama.” Iniiwasan din nitong magdagdag ng layon na walang tahasang katumbas sa Griyego.
- source_word: ἀγαπᾷ καὶ
  choice: ay umiibig din
  rationale: Natural na ipinahahayag ng “din” ang dagdag na layon ng pag-ibig na tinutukoy ng καί.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: sa isinilang mula sa kanya
  rationale: Ang “isinilang” ay nagpapanatili ng malinaw na ugnayang leksikal sa “nagsilang,” at ang “mula sa kanya” ay tuwirang kumakatawan sa ἐξ αὐτοῦ nang hindi nililinaw kung iisang mananampalataya o ang buong uri ng mga anak ng Diyos ang nasa isip.
theological_decisions:
- issue: Wika ng γεννάω tungkol sa kapanganakang mula sa Diyos
  choice: Gamitin ang “ipinanganak ng Diyos,” “nagsilang,” at “isinilang mula sa kanya.”
  alternative: Gamitin ang “inaring anak,” “Ama,” at “anak.”
  rationale: Ang piniling mga salita ay nagpapanatili sa talinghaga ng pagsilang at sa ugnayan ng nagsilang at isinilang. Hindi nito ipinapalit ang mas interpretibong wika ng pag-aampon o tahasang titulong “Ama,” kahit katugma ng konteksto ang gayong pagkaunawa.
- issue: Ang titulong ὁ χριστός
  choice: Isalin bilang “ang Mesiyas.”
  alternative: Isalin bilang “ang Cristo.”
  rationale: 'Confessional at titular ang parirala: si Jesus ang ipinangakong pinahiran. Mas tuwirang naihahatid ng “Mesiyas” ang kahulugan ng titulo sa karaniwang mambabasang Filipino.'
- issue: Sino ang “isinilang mula sa kanya”
  choice: Panatilihin ang anyong isahan at huwag tukuyin pa bilang “kapatid” o “anak ng Diyos.”
  alternative: Ipaliwanag bilang “iba pang mga anak ng Diyos” o “kapwa mananampalataya.”
  rationale: Isahan ang participle sa Griyego at hindi tahasang tinutukoy ang isang partikular na tao. Pinananatili ng salin ang lawak at bahagyang kalabuan ng pahayag.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “nananampalataya” at “umiibig” bilang pamilyar na wikang biblikal na nananatiling natural. Ang hulma ng ikalawang sugnay ay sadyang malapit sa Griyego upang mapanatili ang lohika: ang pag-ibig sa nagsilang ay humahantong sa pag-ibig sa isinilang mula sa kanya.'
