revisions:
- from: Ang bawat nananampalatayang si Jesus ang Mesiyas[a] ay ipinanganak ng Diyos,[b] at ang bawat umiibig sa nagsilang ay umiibig din sa isinilang mula sa kanya.
  to: Ang bawat nananampalataya na si Jesus ang Mesiyas[a] ay ipinanganak ng Diyos,[b] at ang bawat umiibig sa nagbigay-buhay sa kanya ay umiibig din sa isinilang mula sa kanya.
  rationale: Idinagdag ang kinakailangang “na” upang maging gramatikal ang unang sugnay. Pinalitan ang “nagsilang” ng “nagbigay-buhay sa kanya” upang maiwasan ang di-sinasadyang maternal na kahulugan ng “nagsilang,” habang pinananatili ang ugnayang begetter/begotten sa pamamagitan ng talababa at ng “isinilang mula sa kanya.” Hindi nililinaw ng salin kung sino nang eksakto ang tinutukoy ng isahang “isinilang,” alinsunod sa lawak ng Griyego.
