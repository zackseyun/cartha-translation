  text: For there are three who testify,[a]
translation:
  language: tl
  text: Sapagkat tatlo ang nagpapatotoo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idinaragdag ng mas huling mga manuskrito ang isang mas mahabang pagbasa na karaniwang tinatawag na Comma Johanneum: “sa langit: ang Ama, ang Salita, at ang Banal na Espiritu, at ang tatlong ito ay iisa. At may tatlong nagpapatotoo sa lupa ...” Wala ang pananalitang ito sa pinakamaagang ebidensiya ng mga manuskritong Griyego at hindi ito kasama sa teksto ng SBLGNT.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o batayan para sa naunang pahayag; natural at marangal sa Filipino ang “Sapagkat.”
- source_word: τρεῖς εἰσιν
  choice: tatlo ang
  rationale: Likas na ayos sa Filipino para sa bilang at pag-iral ng tinutukoy, nang hindi na kailangang isalin nang hiwalay ang kopulang εἰσιν.
- source_word: οἱ μαρτυροῦντες
  choice: nagpapatotoo
  rationale: Pinananatili ang pandiwang diwa ng articular present participle. Mas natural ito kaysa “ang mga nagpapatotoo” pagkatapos ng “tatlo ang,” at hindi nito ginagawang pangngalang “mga saksi” ang aktibong pagpapatotoo.
theological_decisions:
- issue: Tekstuwal na anyo ng 1 Juan 5:7 at ang Comma Johanneum
  choice: 'Isinalin lamang sa pangunahing teksto ang maikling pagbasa ng SBLGNT: “Sapagkat tatlo ang nagpapatotoo,”'
  alternative: Idinaragdag ng ilang mas huling manuskrito ang pananalitang tungkol sa Ama, sa Salita, at sa Banal na Espiritu sa langit, at sa tatlong nagpapatotoo sa lupa.
  rationale: Ang ibinigay na tekstong Griyego ay ang maikling pagbasa. Upang sundin ang orihinal na sanggunian at maging malinaw tungkol sa mahalagang variant, inilagay sa talababa ang mas mahabang tradisyonal na pagbasa sa halip na isama ito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpapatotoo” upang mapanatili ang aktibong diwa ng participle. Pinanatili ang kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
