  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: tl
  text: Ang may Anak ay may buhay[a]; ang walang Anak ng Diyos ay walang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buhay na walang hanggan”; sa paggamit ni Juan, ang “buhay” dito ay tumutukoy sa buhay na matatagpuan sa Anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ang mayroong
  rationale: Ang artikulo at pangkasalukuyang pandiwaring ἔχων ay tumutukoy sa sinumang taong kinikilalang mayroon sa Anak. Likas at pangkalahatan sa Tagalog ang “ang mayroong,” nang hindi nililimitahan sa kasarian.
- source_word: τὸν υἱόν
  choice: Anak
  rationale: “Anak” lamang ang nasa unang sugnay. Pinananatili nito ang pagkakaiba sa mas buong titulong “Anak ng Diyos” sa ikalawang sugnay.
- source_word: ἔχει
  choice: may
  rationale: Payak at natural na katumbas ito ng ἔχω sa pangungusap, at hindi nito labis na ipinapaliwanag ang kaugnayang ipinahihiwatig ng pagkakaroon sa Anak at sa buhay.
- source_word: τὴν ζωήν
  choice: buhay
  rationale: Bagaman may artikulo sa Griyego, natural sa Tagalog ang “may buhay.” Pinananatili ng “buhay” ang teolohikal na bigat ng salita nang hindi idinaragdag sa pangunahing teksto ang “walang hanggang.”
- source_word: ὁ μὴ ἔχων
  choice: ang hindi mayroong
  rationale: Tuwirang pinananatili nito ang negatibong katapat ng unang parirala at ang pokus sa hindi pagkakaroon sa Anak, bagaman bahagyang mas pormal kaysa sa karaniwang usapan.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Malinaw at karaniwang salin ito ng buong titulong kristolohikal at pinananatili ang tahasang kaugnayang genitibo.
- source_word: τὴν ζωὴν οὐκ ἔχει
  choice: walang buhay
  rationale: Ang “walang buhay” ang pinakanatural na modernong Tagalog para sa “does not have life” at pinananatili ang mariing pagsalungat sa “may buhay.”
theological_decisions:
- issue: Kahulugan ng ζωή sa kontekstong Juanino
  choice: Isalin bilang “buhay” sa pangunahing teksto.
  alternative: “buhay na walang hanggan”
  rationale: Sa 1 Juan, ang ζωή ay madalas tumutukoy sa buhay na walang hanggan na nasa Anak, ngunit ζωή lamang ang nakasulat sa talatang ito. Pinananatili ng salin ang mismong pahayag at inilalagay sa talababa ang mas buong kontekstuwal na diwa.
- issue: Pangkalahatang pagtukoy ng mga substantibong pandiwari na panlalaking isahan
  choice: Gamitin ang walang-kasariang anyong “ang mayroong … / ang hindi mayroong …”
  alternative: “ang sinumang mayroon … / ang sinumang walang …”
  rationale: Panlalaking isahan ang anyong pambalarila sa Griyego ngunit pangkalahatan ang saklaw. Hindi kailangang magpasok ng panlalaking panghalip sa Tagalog.
- issue: Pagkakaiba ng “Anak” at “Anak ng Diyos”
  choice: Panatilihin ang “Anak” sa unang sugnay at “Anak ng Diyos” sa ikalawa.
  alternative: Gawing “Anak ng Diyos” sa dalawang sugnay para sa ganap na pagkakapantay.
  rationale: Sadyang magkaiba ang anyo sa Griyego. Malinaw pa rin sa konteksto na iisang Anak ang tinutukoy, kaya hindi kailangang punan ang unang sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinananatili ang balanseng pagsalungat ng dalawang sugnay at ang pagkakaiba ng “Anak” at “Anak ng Diyos.”
