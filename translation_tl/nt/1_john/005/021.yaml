  text: Little children[a], guard yourselves from idols.
translation:
  language: tl
  text: Mga munting anak,[a] mag-ingat kayo sa mga diyus-diyosan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mga anak.” Ang salitang Griyego ay isang mapagmahal na diminutibong pantawag na ginagamit ni Juan sa tuwirang pakikipag-usap sa kanyang mga mambabasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Mga minamahal kong anak
  rationale: Isang mapagmahal na pantawag ni Juan sa kanyang mga mambabasa. Likas sa makabagong Tagalog ang pariralang ito at naipahahayag nito ang lambing ng diminutibong anyo nang hindi nagpapahiwatig na pawang bata ang kausap.
- source_word: φυλάξατε
  choice: mag-ingat
  rationale: Ang aorist active imperative na maramihan ay nananawagan ng tiyak at aktibong pagbabantay. Sa pariralang “mag-ingat ... sa,” natural na naihahatid sa Tagalog ang pag-iwas at pag-iingat laban sa panganib.
- source_word: ἑαυτὰ
  choice: kayo
  rationale: Sa konstruksyong Tagalog na “mag-ingat kayo,” likas nang reflexive ang diwa; ang “ang inyong sarili” ay mas lantad ngunit hindi gaanong natural dito.
- source_word: ἀπὸ
  choice: sa
  rationale: Kasunod ng “mag-ingat,” ang “sa” ang natural na panandang naghahayag ng bagay na dapat layuan o bantayan.
- source_word: εἰδώλων
  choice: mga diyus-diyosan
  rationale: Ito ang malinaw at karaniwang salin para sa mga idolo o bagay na sinasamba bilang diyos. Hindi nito pinalalawak ang salita tungo sa lahat ng anumang maaaring pumalit sa Diyos.
theological_decisions:
- issue: Saklaw ng “εἰδώλων”
  choice: Isinaling tuwiran bilang “mga diyus-diyosan.”
  alternative: anumang pumapalit sa Diyos; huwad na pagsamba sa pangkalahatan
  rationale: Tuwirang tinutukoy ng Griyego ang mga diyus-diyosan. Maaaring mas malawak ang implikasyon ng babala, ngunit hindi iyon dapat idagdag sa mismong salin.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Mga minamahal kong anak” bilang pastoral at mapagmahal na pantawag; ang “mag-ingat kayo sa” ay mas likas kaysa sa literal ngunit mabigat na “bantayan ninyo ang inyong sarili mula sa.”
