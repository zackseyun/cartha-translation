revisions:
- from: At alam natin na naparito na ang Anak ng Diyos at binigyan niya tayo ng pang-unawa upang makilala natin ang Tunay. At tayo ay nasa Tunay—nasa kanyang Anak na si Jesus, ang Mesiyas. Ito[a] ang tunay na Diyos at ang buhay na walang hanggan.
  to: At alam natin na dumating na ang Anak ng Diyos at binigyan niya tayo ng pang-unawa upang makilala natin ang Tunay na Isa; at tayo ay nasa Tunay na Isa—nasa kanyang Anak na si Jesus, ang Mesiyas. Ito[a] ang tunay na Diyos at ang buhay na walang hanggan.
  rationale: Pinalitan ang “ang Tunay” ng “ang Tunay na Isa” sa kapwa paglitaw upang maging malinaw at likas ang personal na substantibong gamit ng ἀληθινός, habang pinananatili ang pag-uulit at hindi tinutukoy nang tahasan ang Ama. Pinalitan din ang “naparito na” ng mas modernong “dumating na.” Nanatili ang “Ito” at ang talababa upang mapreserba ang sintaktikong kalabuan ng οὗτός.
