id: 1JN.5.20
reference: 1 John 5:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: tl
  text: At alam natin na dumating na ang Anak ng Diyos at binigyan niya tayo ng pang-unawa upang makilala natin ang Tunay na Isa; at tayo ay nasa Tunay na Isa—nasa kanyang Anak na si Jesus, ang Mesiyas. Ito[a] ang tunay na Diyos at ang buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ang “Ito” ay partikular na tumutukoy kay Jesus, ang Mesiyas. Nauunawaan naman ng iba na tumutukoy ito sa “Tunay na Isa” (ang Ama) sa naunang sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Ang οἶδα ay anyong perpekto ngunit gumaganap bilang pangkasalukuyang kalagayan ng tiyak na kaalaman; natural itong ipinapahayag sa Filipino bilang “alam natin.”
- source_word: ἥκει
  choice: naparito na
  rationale: Ipinahihiwatig ng ἥκω ang pagdating na naganap na at may kasalukuyang bunga; naipakikita ng “naparito na” ang dalawang diwang ito.
- source_word: δέδωκεν ἡμῖν
  choice: binigyan niya tayo
  rationale: Likas na ayos ito sa Filipino at ipinahahayag ang kaloob na naibigay na at nananatiling taglay ng mga tumanggap.
- source_word: διάνοιαν
  choice: pang-unawa
  rationale: Tumutukoy rito sa kakayahang makaunawa at kumilala sa katotohanan, hindi lamang sa isip bilang sangkap.
- source_word: ἵνα γινώσκωμεν
  choice: upang makilala natin
  rationale: Pinananatili ng “upang” ang layunin ng ἵνα, habang ang “makilala” ay angkop sa personal at patuloy na pagkilala sa konteksto.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: ang Tunay / nasa Tunay
  rationale: Pangngalang gamit ang pang-uri sa Griyego. Ang pare-parehong “Tunay” ay nagpapanatili sa pag-uulit ni Juan at tumutukoy sa isang persona nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ἐσμὲν ἐν
  choice: tayo ay nasa
  rationale: Tuwirang pinananatili ang larawang panrelasyon ng “nasa” at hindi ito pinalalawak bilang “nananatili” o “nakikiisa,” sapagkat hindi iyon tahasang sinabi rito.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jesus, ang Mesiyas
  rationale: Ang Χριστός ay gumaganap bilang titulo; malinaw at natural sa Filipino ang “ang Mesiyas” sa kasunod na pagtukoy kay Jesus.
- source_word: οὗτός
  choice: Ito
  rationale: Pinananatili ng “Ito” ang demonstratibong lakas ng οὗτός at hindi nito lubusang nilulutas kung si Jesus na Mesiyas o ang Tunay na binanggit bago nito ang tinutukoy.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: ang tunay na Diyos
  rationale: Tumpak at karaniwang salin ng pariralang predikatibo, na umaayon sa pananalita ni Juan.
- source_word: ζωὴ αἰώνιος
  choice: ang buhay na walang hanggan
  rationale: Likas at nakaugaliang salin sa Filipino na naghahatid ng diwa ng buhay na hindi nagwawakas.
theological_decisions:
- issue: Ang tinutukoy ng οὗτός sa huling pangungusap
  choice: Ginamit ang “Ito” at, ayon sa pinakamalapit na personal na tinutukoy, maaari itong unawaing tumutukoy kay Jesus, ang Mesiyas.
  alternative: Maaaring tumukoy ang “Ito” sa Tunay, samakatuwid ay sa Ama, na binanggit sa naunang sugnay.
  rationale: Karaniwang inuugnay ang demonstratibo sa pinakamalapit na personal na tinutukoy, ngunit pinagtatalunan ang sintaks. Kaya hindi ginawang tahasang “Si Jesus” o “Siya” ang salin, at inilagay sa talababa ang ibang makatuwirang pagkaunawa.
- issue: Kahulugan ng pagiging “nasa” Tunay at sa kanyang Anak
  choice: Pinanatili ang literal at panrelasyong pahayag na “tayo ay nasa Tunay—nasa kanyang Anak.”
  alternative: Isaling “nakikiisa tayo sa Tunay” o “nananatili tayo sa Tunay.”
  rationale: Hindi tahasang ginagamit ng talata ang pandiwang “manatili,” at ang “nakikiisa” ay mas tiyak kaysa sa Griyegong ἐν. Pinananatili ng salin ang siksik na teolohikal na pananalita ni Juan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “naparito na” upang mapanatili ang kasalukuyang bunga ng pagdating, “Tunay” bilang substantibong banal na titulo, at em dash upang malinaw ngunit hindi labis na ipaliwanag ang kaugnayan ng dalawang pariralang may ἐν. Nasa pangunahing teksto ang marker na [a].
