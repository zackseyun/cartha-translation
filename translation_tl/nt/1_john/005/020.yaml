  source_fidelity: 'Tumpak ang pangkalahatang pagsunod sa Griyego: naipapahayag ang kasalukuyang-bungang diwa ng ἥκει at δέδωκεν, ang layunin ng ἵνα, ang paulit-ulit na τὸν/τῷ ἀληθινόν, at ang sinadyang hindi pagtiyak sa tinutukoy ng οὗτός. Gayunman, ang nominal na “ang Tunay” ay hindi likas na modernong Filipino para sa isang persona at maaaring magmukhang isang abstraktong katangian kaysa “ang Tunay na Isa.”'
  naturalness: Ang “Ang Tunay na Isa” ay mas malinaw at natural na Filipino bilang pangngalang gamit ng pang-uri, habang pinananatili ang pag-uulit sa dalawang parirala. Ang “dumating na” ay mas pangkaraniwang modernong Filipino kaysa “naparito na” at sapat na naghahatid ng ἥκει sa kontekstong ito. Ang “Ito” sa huling pangungusap ay maaaring manatili upang huwag lutasin ang pinagtatalunang antecedent.
  terminology: Pinananatili ang “Anak ng Diyos,” “Mesiyas,” “tunay na Diyos,” at “buhay na walang hanggan.” Ang “Jesus, ang Mesiyas” ay angkop na pagdadala sa titulong Ἰησοῦ Χριστῷ. Hindi ipinapasok ng salin ang anumang doktrinal na paghatol sa antecedent ng οὗτός.
