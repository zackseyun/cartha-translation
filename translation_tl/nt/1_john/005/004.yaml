  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: tl
  text: 'Sapagkat ang bawat ipinanganak ng Diyos[a] ay dumaraig sa sanlibutan. At ito ang tagumpay na dumaig sa sanlibutan: ang ating pananampalataya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang ipinanganak ng Diyos.” Neuter ang pagkakabuo ng parirala sa Griyego at tumutukoy sa buong pangkat ng mga ipinanganak ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “ang ating katapatan.” Sa ilang konteksto, ang salitang Griyego ay maaaring mangahulugang “pananampalataya,” “pagtitiwala,” o “katapatan”; “pananampalataya” ang ginamit sa pangunahing teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan o batayan para sa naunang pahayag.
- source_word: πᾶν τὸ γεγεννημένον
  choice: ang bawat ipinanganak
  rationale: Bagaman nasa anyong neuter singular ang Griyego, pangkalahatang tinutukoy nito ang lahat ng mga taong ipinanganak ng Diyos. Likas sa Tagalog ang “ang bawat ipinanganak” at hindi na kailangang magdagdag ng salitang panlalaki o pambabae.
- source_word: γεγεννημένον
  choice: ipinanganak
  rationale: Ang perfect passive participle ay tumutukoy sa kapanganakang naganap na at may nagpapatuloy na bunga. Sa Tagalog, naipahihiwatig ito ng konteksto kahit walang tuwirang katumbas ang aspektong perfect ng Griyego.
- source_word: ἐκ τοῦ θεοῦ
  choice: ng Diyos
  rationale: Karaniwan at malinaw itong pahayag sa wikang biblikal na Tagalog para sa Diyos bilang pinagmulan ng bagong kapanganakan.
- source_word: νικᾷ
  choice: dumaraig
  rationale: Pinananatili ng aspektong nagaganap o pangkalahatan ang present tense ng Griyego, at ang “dumaraig” ay angkop sa pakikipagtunggali laban sa sanlibutan.
- source_word: κόσμον
  choice: sanlibutan
  rationale: Ang “sanlibutan” ay likas na katumbas ng κόσμος sa mga sulat ni Juan at nagpapahintulot sa konteksto na magtakda kung tumutukoy ito sa kaayusang salungat sa Diyos.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: ito ang tagumpay
  rationale: Tuwiran nitong pinananatili ang diin ng demonstrative at ang tahasang pagkilala sa tagumpay.
- source_word: ἡ νικήσασα
  choice: na dumaig
  rationale: Ang anyong naganap na “dumaig” ay kumakatawan sa aorist participle at sa natamong tagumpay, habang inuugnay pa rin ito sa naunang “dumaraig.”
- source_word: ἡ πίστις ἡμῶν
  choice: ang ating pananampalataya
  rationale: “Pananampalataya” ang pinakalikas at pangunahing kahulugan dito; malinaw ding ipinahahayag ng “ating” ang possessive na ἡμῶν.
theological_decisions:
- issue: Tinutukoy ng πᾶν τὸ γεγεννημένον
  choice: Bawat taong ipinanganak ng Diyos
  alternative: Anumang ipinanganak ng Diyos
  rationale: Pormal na neuter ang parirala at maaaring isaling “anumang,” ngunit ipinakikita ng konteksto na mga mananampalataya ang tinutukoy. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang tunay na gramatikal na posibilidad.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan
  rationale: Sa kontekstong ito, pinakamalamang na tumutukoy ang πίστις sa pananampalataya o pagtitiwala ng mga mananampalataya. Gayunman, maaari itong mangahulugang “katapatan” sa ilang konteksto, kaya pinananatili ang posibilidad sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “sanlibutan” dahil pamilyar ito sa wikang biblikal at mas angkop dito kaysa sa simpleng “mundo.” Ang “dumaraig/dumaig” ay nagpapanatili sa aspektuwal na pagkakaiba ng present at aorist, bagaman hindi lubos na mapananatili sa Tagalog ang pagkakaugnay ng Griyegong pandiwa νικάω at pangngalang νίκη.
