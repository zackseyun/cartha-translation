id: 1JN.5.5
reference: 1 John 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: tl
  text: At sino ang dumaraig sa sanlibutan kundi ang sumasampalatayang si Jesus ang Anak ng Diyos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang mga katagang “ang dumaraig” at “ang sumasampalataya” ay nasa panlalaking isahan ngunit ginagamit bilang pangkalahatang pagtukoy sa sinumang gayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: At sino ang
  rationale: Ang retorikal na tanong ay payak at natural na naipapahayag sa Filipino; ang “At” ay banayad na nag-uugnay sa naunang pahayag.
- source_word: ὁ νικῶν
  choice: ang dumaraig
  rationale: Pinananatili ng pandiwaring anyo ang katangian o nagpapatuloy na diwa ng pagdaig, at likas itong gumaganap bilang pangngalan sa Filipino.
- source_word: τὸν κόσμον
  choice: sa sanlibutan
  rationale: Ang “sanlibutan” ay dignidad at pamilyar na salin ng κόσμος sa kontekstong Juaniko, nang hindi ito pinalalawak sa interpretatibong “sistema ng sanlibutan.”
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa retorikal na tanong, malinaw na ipinapahayag ng “kundi” ang eksklusibong diwa ng εἰ μή.
- source_word: ὁ πιστεύων
  choice: ang sumasampalataya
  rationale: Pinananatili nito ang pandiwang diwa ng patuloy o katangiang paniniwala/pagtitiwala, sa halip na gawing abstraktong katawagan.
- source_word: ὅτι
  choice: -ng
  rationale: 'Ang pang-angkop sa “sumasampalatayang” ay natural na nagpapakilala sa nilalaman ng pananampalataya: na si Jesus ang Anak ng Diyos.'
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwirang pinananatili ang tiyak at mahalagang kristolohikal na titulo nang walang dagdag na paliwanag.
theological_decisions:
- issue: Ang panlalaking isahang pandiwari na ὁ νικῶν at ὁ πιστεύων
  choice: ang dumaraig / ang sumasampalataya
  alternative: siyang dumaraig / lalaking dumaraig
  rationale: Hindi kailangang markahan ng kasarian sa Filipino ang mga anyong ito. Napananatili ang pangkalahatan at kumakatawang bisa ng Griyego nang hindi ipinahihiwatig na lalaki lamang ang tinutukoy.
- issue: Ang pagpapahayag na ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  alternative: Anak ng Diyos / ang Anak na mula sa Diyos
  rationale: Pinananatili ang tiyak na kristolohikal na titulo at ang mismong pahayag tungkol sa pagkakakilanlan ni Jesus, nang hindi dinaragdagan o binabawasan ang teolohikal na nilalaman.
translation_notes:
  register: Modernong Filipino na may dignidad at pamilyar na biblikal na bokabularyo. Ginamit ang “sanlibutan” upang panatilihin ang maikli at hindi pinalawak na κόσμος, at ang mga anyong “dumaraig” at “sumasampalataya” upang maingatan ang pandiwang lakas ng mga kasalukuyang pandiwari.
