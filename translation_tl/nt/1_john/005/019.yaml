  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: tl
  text: Alam nating tayo ay mula sa Diyos, at ang buong mundo ay nasa ilalim ng kapangyarihan ng Masama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang buong mundo ay nakalagay sa Masama.” Maaari ring unawain ang “Masama” bilang “kasamaan,” ngunit mas malamang sa gamit ni Juan na tumutukoy ito sa isang personal na nilalang na masama.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: Alam natin
  rationale: Tuwirang ipinapahayag ng οἴδαμεν ang tiyak at matatag na kaalaman; natural sa modernong Tagalog ang “Alam natin.”
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Ipinahahayag ng ἐκ ang pinagmulan o kaugnayan sa Diyos nang hindi idinaragdag ang mas tiyak na ideyang “ipinanganak ng Diyos.”
- source_word: ὁ κόσμος ὅλος
  choice: ang buong mundo
  rationale: Pinananatili nito ang saklaw ng ὅλος at ang karaniwang Juaninong gamit ng κόσμος bilang mundong salungat sa Diyos.
- source_word: ἐν τῷ πονηρῷ
  choice: nasa ilalim ng kapangyarihan ng Masama
  rationale: Sa kontekstong Juanino, malamang na personal ang τῷ πονηρῷ, tumutukoy sa Masama. Ang “nasa ilalim ng kapangyarihan” ay natural na Tagalog para sa kalagayang ipinahihiwatig ng parirala, habang nasa talababa ang mas pormal na anyo.
- source_word: κεῖται
  choice: nasa ilalim
  rationale: Ang κεῖται ay literal na “nakahimlay/nakalagay,” ngunit dito ay tumutukoy sa nagpapatuloy na kalagayan o pagkakasakop; mas malinaw at natural ang “nasa ilalim” sa Tagalog.
theological_decisions:
- issue: Kung ang τῷ πονηρῷ ay tumutukoy sa abstraktong kasamaan o sa isang personal na Masama
  choice: 'Personal: “ang Masama”'
  alternative: 'Abstrakto: “kasamaan”'
  rationale: Sa mga sulat ni Juan, karaniwang personal ang ὁ πονηρός, at sinusuportahan ito ng artikulo at ng konteksto. Gayunman, binabanggit sa talababa ang posibleng abstraktong pagkaunawa upang mapanatili ang tunay na ambigwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Masama” bilang pantanging katawagan sa personal na tinutukoy, hindi bilang karaniwang pang-uri.
