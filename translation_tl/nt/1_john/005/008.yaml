id: 1JN.5.8
reference: 1 John 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: tl
  text: Ang Espiritu, ang tubig, at ang dugo; at nagkakaisa ang tatlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “at ang tatlo ay tungo sa iisa.” Malamang na ipinahihiwatig ng idyomang Griyego na nagkakatugma ang kanilang patotoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Ginamit ang malaking titik dahil sa konteksto ng 1 Juan 5:6–8, ang tiyak na tinutukoy ay malamang na ang Banal na Espiritu bilang saksi. Posible sa gramatika ang “espiritu,” ngunit hindi ito ang mas malamang sa konteksto.
- source_word: τὸ ὕδωρ
  choice: ang tubig
  rationale: Tuwirang pinananatili ang tiyak na pantukoy at ang konkretong larawan ng Griyego, nang hindi ipinapaliwanag sa talata mismo kung ano ang tinutukoy ng tubig.
- source_word: τὸ αἷμα
  choice: ang dugo
  rationale: Tuwirang pinananatili ang tiyak na pantukoy at konkretong pangngalan; hindi dinaragdagan ng salin ang hindi tahasang paliwanag ng talata.
- source_word: οἱ τρεῖς
  choice: ang tatlo
  rationale: Likas at tuwirang salin ng pariralang tumutukoy bilang isang pangkat sa tatlong kababanggit lamang.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: nagkakaisa
  rationale: Sa konteksto ng pagpapatotoo, ipinahihiwatig ng idyoma na nagtutugma o nagkakasundo ang tatlo. Ang “nagkakaisa” ay natural sa Filipino at hindi tahasang nagdaragdag ng salitang “patotoo,” na wala sa mismong sugnay.
theological_decisions:
- issue: Kung ang εἰς τὸ ἕν εἰσιν ay tumutukoy sa pagkakaisa ng patotoo o sa ontolohikal na pagiging isa
  choice: “nagkakaisa ang tatlo,” na likas na nauunawaan bilang pagkakasundo sa konteksto ng mga saksi
  alternative: “iisa ang tatlo” o, mas literal, “ang tatlo ay tungo sa iisa”
  rationale: Ang agarang konteksto ay tungkol sa pagpapatotoo ng Espiritu, tubig, at dugo. Kaya mas malamang na ang kanilang pagkakatugma ang tinutukoy, ngunit inilalahad sa talababa ang mas literal na anyo upang mapanatili ang tunay na saklaw ng Griyegong pananalita at maiwasang gawing tahasang ontolohikal ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “tubig” at “dugo” at iniwasang ipasok sa pangunahing teksto ang isang partikular na paliwanag sa mga ito. Ginamit ang tuldok-kuwit upang malinaw na iugnay ngunit maibukod ang pangwakas na sugnay.
