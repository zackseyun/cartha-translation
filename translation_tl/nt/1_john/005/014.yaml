  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: tl
  text: 'At ito ang katiyakang[a] taglay natin sa harap niya: kung humihingi tayo ng anuman ayon sa kanyang kalooban, dinirinig niya tayo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lakas ng loob” o “panatag na pagtitiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: katiyakan
  rationale: Sa konteksto ng paglapit sa Diyos sa panalangin, ipinahihiwatig nito ang panatag at malayang pagtitiwala, hindi lamang ang tapang na magsalita sa publiko.
- source_word: πρὸς αὐτόν
  choice: sa harap niya
  rationale: Likas itong pahayag sa Filipino para sa paglapit at pagiging nasa presensiya ng Diyos, habang pinananatili ang relasyonal na direksiyon ng parirala.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng katiyakan. Sa Filipino, malinaw at natural itong naipahahayag sa pamamagitan ng tutuldok.
- source_word: ἐάν τι αἰτώμεθα
  choice: kung humihingi tayo ng anuman
  rationale: Pinananatili nito ang pangkalahatang kondisyon at ang bukas na saklaw ng τι nang hindi ginagawang tiyak sa isang pagkakataon lamang.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: ayon sa kanyang kalooban
  rationale: Direkta at karaniwang salin ito ng pagsunod sa pamantayan ng kalooban ng Diyos, at pinananatili ang bigat ng θέλημα.
- source_word: ἀκούει ἡμῶν
  choice: dinirinig niya tayo
  rationale: Sa konteksto ng panalangin, ang “dinirinig” ay nagpapahiwatig ng pakikinig at pagbibigay-pansin ng Diyos, ngunit hindi pa nito ipinapakahulugang awtomatikong ipinagkakaloob ang bawat kahilingan.
theological_decisions:
- issue: Kahulugan ng pagdinig ng Diyos sa panalangin
  choice: dinirinig niya tayo
  alternative: sinasagot niya tayo; ipinagkakaloob niya ang mga hinihingi natin
  rationale: Sinasabi ng talata na dinirinig ng Diyos ang mga kahilingang ayon sa kanyang kalooban. Hindi dapat dagdagan sa salin ang mas malakas na ideya ng agarang pagsagot o pagkakaloob, na higit na tinatalakay sa kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katiyakan” bilang likas na katumbas ng παρρησία sa konteksto ng panalangin; inilagay ang talababa sa salitang tinutukoy nito.
