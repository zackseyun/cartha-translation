id: 1JN.5.6
reference: 1 John 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: tl
  text: Siya ang dumating sa pamamagitan ng tubig at dugo[a]—si Jesus, ang Mesiyas[b]. Hindi lamang sa tubig, kundi sa tubig at sa dugo. At ang Espiritu ang nagpapatotoo, sapagkat[c] ang Espiritu ang katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa tubig at dugo.” Pinagtatalunan ang tinutukoy ng parirala: maaaring ang bautismo at kamatayan ni Jesus, ang kapanganakan at kamatayan niya, o imaheng sakramental. Hindi nagpapasya ang salin sa mga pagbabasang ito.'
    reason: alternative_reading
  - marker: b
    text: 'Griyego: “Ἰησοῦς Χριστός.” Isinalin dito ang Χριστός bilang titulong “Mesiyas.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain: “At ang Espiritu ang nagpapatotoo na ang Espiritu ang katotohanan.” Maaaring magpahiwatig ang ὅτι ng nilalaman (“na”) o sanhi (“sapagkat”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Siya ang dumating
  rationale: Likas sa Tagalog ang hulma na “Siya ang…” upang mapanatili ang mariing pagtukoy sa taong tinutukoy, habang ang aorist participle ay maayos na naipahahayag ng pangnagdaang “dumating.”
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: sa pamamagitan ng tubig at dugo
  rationale: Ipinahahayag nito ang posibleng instrumental o kasamang-pangyayari na diwa ng διά na may genitive, nang hindi tinutukoy kung ano mismo ang sinasagisag ng tubig at dugo.
- source_word: Ἰησοῦς Χριστός
  choice: si Jesus na Mesiyas
  rationale: Ang Χριστός ay inuunawa rito bilang titulo. Ang “si Jesus na Mesiyas” ay malinaw at likas na Tagalog para sa appositional na pagkakakilanlan.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: hindi sa pamamagitan lamang ng tubig, kundi sa pamamagitan ng tubig at dugo
  rationale: Pinananatili ang malinaw na pagtutol sa tubig lamang at ang pagsasama ng tubig at dugo. Ang pag-uulit ng “sa pamamagitan” ay nagpapakita ng diin nang hindi nagiging mabigat ang Tagalog.
- source_word: τὸ πνεῦμά
  choice: ang Espiritu
  rationale: Sa konteksto ng banal na patotoo sa 1 Juan, ang tinutukoy ay ang Banal na Espiritu; ipinakikita ito ng malaking titik nang walang idinaragdag na paliwanag sa pangunahing teksto.
- source_word: τὸ μαρτυροῦν
  choice: ang nagpapatotoo
  rationale: Ang pandiwaring pangkasalukuyan ay naipahahayag bilang nagpapatuloy o katangiang gawain sa likas na Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Binabasa ang ὅτι bilang sanhi o batayan ng pagpapatotoo ng Espiritu, ngunit inilalahad sa talababa ang posibleng pagbasa rito bilang tagapagpakilala ng nilalaman.
- source_word: ἡ ἀλήθεια
  choice: ang katotohanan
  rationale: 'Pinananatili ang tiyak at identificational na pahayag ng Griyego: ang Espiritu ang katotohanan, hindi lamang na siya ay totoo o mapagkakatiwalaan.'
theological_decisions:
- issue: Kahulugan ng “tubig at dugo”
  choice: Pinanatili ang mismong pananalitang “tubig at dugo” nang walang tiyak na pagpapakahulugan.
  alternative: Maaaring tumukoy sa bautismo at kamatayan ni Jesus, sa kapanganakan at kamatayan niya, o sa imaheng sakramental.
  rationale: Hindi ipinaliliwanag ng Griyegong teksto ang mga sagisag, kaya pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
- issue: Tinutukoy ng “Espiritu”
  choice: Ang Banal na Espiritu
  alternative: Isang pangkalahatang espiritu
  rationale: Ang konteksto ng banal na patotoo at ang gamit ni Juan ay malakas na tumutukoy sa Banal na Espiritu.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas bilang titulo
  alternative: Cristo bilang nakasanayang bahagi ng pangalan
  rationale: Appositional ang parirala at malinaw ang tungkulin ng Χριστός bilang titulong mesiyaniko sa talata.
- issue: Gamit ng ὅτι
  choice: 'Sanhi: “sapagkat”'
  alternative: 'Nilalaman: “na”'
  rationale: Ang causal na pagbasa ay nagbibigay ng batayan kung bakit mapananaligan ang patotoo ng Espiritu, ngunit kapwa posible sa balarila kaya nakatala ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa pamamagitan ng” para sa malinaw at likas na ugnayan ng tubig at dugo sa pagdating, habang iniwasang ipasok sa teksto ang alinman sa pinagtatalunang interpretasyon. Ang mga gitling sa apposition ay nagpapanatili sa diin ng pagkakakilanlan kay Jesus na Mesiyas.
