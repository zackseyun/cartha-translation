source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: tl
  text: 'Sapagkat ganito ang pag-ibig sa Diyos: tinutupad natin ang kanyang mga utos[a], at ang kanyang mga utos ay hindi mabigat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang parirala bilang “pag-ibig ng Diyos.” Sa Griyego, maaari itong tumukoy sa pag-ibig natin sa Diyos o sa pag-ibig na nagmumula sa Diyos, bagaman mas pinapaboran ng agarang konteksto ang “pag-ibig sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: ito
  rationale: Tumutukoy nang pasulong sa sugnay na nagpapaliwanag kung ano ang pag-ibig sa Diyos.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: pag-ibig sa Diyos
  rationale: Mas pinapaboran ng agarang konteksto ang pag-ibig na iniuukol ng mga mananampalataya sa Diyos; sa Tagalog, hindi natural na panatilihin ang kaparehong uri ng genitibong kalabuan nang walang maling pahiwatig.
- source_word: ἵνα
  choice: na
  rationale: Ipinakikilala nito ang nilalaman o paliwanag kung ano ang nasabing pag-ibig, hindi lamang isang layunin.
- source_word: ἐντολάς
  choice: mga utos
  rationale: Natural at may sapat na bigat sa modernong Tagalog, at angkop sa paulit-ulit na gamit ni Juan.
- source_word: τηρῶμεν
  choice: tuparin natin
  rationale: Ipinahahayag ang patuloy na pagsunod o pagtupad sa mga utos sa natural na Tagalog; pinananatili rin ang hortatory-looking Filipino form while functioning as the content clause.
- source_word: βαρεῖαι
  choice: mabigat
  rationale: Pinananatili ang metapora ng bigat at natural na nangangahulugang mahirap pasanin o mapaniil sa Tagalog.
theological_decisions:
- issue: Kahulugan ng genitive sa ἡ ἀγάπη τοῦ θεοῦ
  choice: pag-ibig sa Diyos, ibig sabihin, pag-ibig ng mga mananampalataya para sa Diyos
  alternative: pag-ibig ng Diyos sa mga mananampalataya; o isang pagbasa na saklaw ang dalawang diwa
  rationale: Iniuugnay ng talata 2 ang pag-ibig sa Diyos sa pagtupad sa kanyang mga utos, at agad itong binibigyang-kahulugan ng talata 3 sa gayong paraan. Gayunman, kinikilala sa talababa ang tunay na gramatikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pag-ibig sa Diyos” upang maging natural at malinaw, habang inilalahad sa talababa ang lehitimong alternatibong pagbasa. Ang “hindi mabigat” ay tuwirang nagpapanatili sa metapora ng βαρεῖαι.
