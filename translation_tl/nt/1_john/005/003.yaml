  source_fidelity: 'Tumpak ang pangunahing kahulugan, lalo na ang ‘pag-ibig sa Diyos’ at ang ‘hindi mabigat,’ na natural na nagpapanatili sa metapora ng βαρεῖαι. Gayunman, ang ‘tuparin natin’ ay karaniwang anyong panawagan o paghimok sa Tagalog (‘let us fulfill’), samantalang ang τηρῶμεν sa sugnay na ito ay nagpapaliwanag kung ano ang binubuo ng pag-ibig sa Diyos: ‘na tinutupad natin’ / ‘ang pagtupad natin.’'
