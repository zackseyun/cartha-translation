base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: tl
  text: Isinulat ko ang mga bagay na ito sa inyo na sumasampalataya sa pangalan ng Anak ng Diyos,[a] upang malaman ninyo na mayroon kayong buhay na walang hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, kung mas malapit sa ayos ng Griyego bagaman hindi gaanong natural: “Isinulat ko sa inyo ang mga bagay na ito upang malaman ninyo na mayroon kayong buhay na walang hanggan—kayong sumasampalataya sa pangalan ng Anak ng Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at likas na tumutukoy sa nilalaman ng liham o sa naunang tinalakay.
- source_word: ἔγραψα
  choice: Isinulat ko
  rationale: Likas na salin ng aorist sa konteksto ng liham at malinaw na nagsasaad ng natapos na pagsulat.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang salin ng datibong di-tuwirang layon.
- source_word: ἵνα εἰδῆτε
  choice: upang malaman ninyo
  rationale: Malinaw na pinananatili ang layuning ipinahihiwatig ng ἵνα at ang diwa ng tiyak na pagkaalam.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Karaniwan, malinaw, at matapat na salin ng ekspresyong Juaniko, na sumasaklaw sa walang-hanggang tagal at sa uri ng buhay na mula sa Diyos.
- source_word: ἔχετε
  choice: mayroon kayong
  rationale: Pinananatili ang pangkasalukuyang pag-aari, na mahalaga sa katiyakang ipinahahayag ng talata.
- source_word: τοῖς πιστεύουσιν
  choice: sa inyo na sumasampalataya
  rationale: Itinuturing na apposisyon sa ὑμῖν upang kilalanin ang mga pinatutungkulan, habang nananatiling natural sa Tagalog.
- source_word: πιστεύουσιν εἰς
  choice: sumasampalataya sa
  rationale: Pinananatili ang karaniwang biblikal na pananalita para sa pananampalatayang nakatuon sa isang persona.
- source_word: τὸ ὄνομα
  choice: pangalan
  rationale: Pinananatili ang biblikal na idyoma na kumakatawan sa ipinahayag na persona at awtoridad, sa halip na ipaliwanag ito sa paraphrase.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Tuwiran at dignidad na salin ng kristolohikal na titulo at ng mga konstruksiyong henitibo.
theological_decisions:
- issue: Pagkakalagay at sintaktikong kaugnayan ng τοῖς πιστεύουσιν
  choice: 'Ikinabit sa ὑμῖν: “sa inyo na sumasampalataya sa pangalan ng Anak ng Diyos”'
  alternative: 'Resumptibong apposisyon pagkatapos ng sugnay ng katiyakan: “upang malaman ninyo na mayroon kayong buhay na walang hanggan—kayong sumasampalataya sa pangalan ng Anak ng Diyos”'
  rationale: Maaaring suportahan ng ayos ng Griyego ang alinman, ngunit ang pagkakabit sa ὑμῖν ang pinakanatural sa Tagalog at malinaw na kinikilala ang mga tumatanggap ng liham. Dahil tunay ang sintaktikong kalabuan, iniingatan ang mas malapit na ayos sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumasampalataya” upang mapanatili ang biblikal na diwa ng πιστεύω εἰς, at ang “buhay na walang hanggan” bilang natural at kinikilalang katumbas ng ζωὴ αἰώνιον. Pinanatili sa talababa ang tunay na kalabuan ng ayos ng pariralang τοῖς πιστεύουσιν.
