  source_fidelity: Tumpak ang pangunahing pag-unawa sa talata, kabilang ang pagpapanatili sa kalabuan ng tinutukoy ng «ang ipinanganak mula sa Diyos» at ng panghalip na «siya.» Gayunman, ang «hindi siya maaaring sakmalin» ay nagdaragdag ng modal na «maaaring» na wala sa Griyego at masyadong pinaiigting ang ἅπτεται, na pangunahing nangangahulugang «humipo/humawak.»
  naturalness: Marangal at malinaw ang register. Mas natural at idiomatiko ang «bawat taong ipinanganak» kaysa «bawat ipinanganak,» at ang «hindi siya ginagalaw ng Masama» ay mas maayos na Tagalog habang iniiwasan ang dagdag na modal at labis na marahas na larawan ng «sakmalin.»
  terminology: Ang «Diyos,» «Masama,» at «pagkakasala» ay angkop at magkakatugma sa modernong Filipino Tagalog na gamit sa Bibliya. Ang malaking titik sa «Masama» ay makatwirang nagpapahiwatig ng personal na reperente nang hindi ipinapasok ang pangalang wala sa teksto.
