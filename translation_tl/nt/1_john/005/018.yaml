id: 1JN.5.18
reference: 1 John 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: tl
  text: Alam natin na ang bawat taong ipinanganak mula sa Diyos ay hindi nagpapatuloy sa pagkakasala[a]. Ngunit iniingatan siya ng ipinanganak mula sa Diyos[b], at hindi siya ginagalaw ng Masama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hindi nagpapatuloy sa pagkakasala” ay malamang na tumutukoy sa patuloy o nakaugaliang pagkakasala, hindi sa pahayag na hindi kailanman nagkakasala ang mga mananampalataya. Ihambing ang 1 Juan 1:8–10; 2:1.
    reason: cross_reference
  - marker: b
    text: 'Maaaring unawain ito na: “iniingatan ng ipinanganak mula sa Diyos ang kanyang sarili.” Gayunman, nauunawaan ng marami na ang “ipinanganak mula sa Diyos” ay tumutukoy kay Jesus, ang Anak, na nag-iingat sa mananampalataya.'
    reason: alternative_reading
  - marker: c
    text: Sa literal, “hindi siya hinahawakan.” Dito, ang “humawak” ay maaaring mangahulugang humawak o manghawak upang pinsalain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Alam natin
  rationale: Ang anyong perpekto na οἶδα ay ginagamit bilang pangkasalukuyang kalagayan; natural at tumpak ang “Alam natin.”
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: ang bawat ipinanganak mula sa Diyos
  rationale: Ipinapakita ng πᾶς ὁ + participle ang bawat taong kabilang sa uring tinutukoy. Pinananatili ng “ipinanganak mula sa Diyos” ang hulma at imahen ng tekstong Griyego.
- source_word: οὐχ ἁμαρτάνει
  choice: hindi nagpapatuloy sa pagkakasala
  rationale: Ipinahahayag nito ang nagpapatuloy o nakaugaliang pagkakasala, nang hindi ipinapalagay na kailanman ay hindi nagkakasala ang mananampalataya; kaayon ito ng aspektong di-ganap ng pangkasalukuyang pandiwa at ng 1 Juan 1:8–10; 2:1.
- source_word: ἀλλ’
  choice: Sa halip
  rationale: Malinaw nitong ipinahahayag ang matinding pagsalungat o pagtutuwid na dala ng ἀλλά.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: ang ipinanganak mula sa Diyos
  rationale: Pinananatili nito ang tunay na kalabuan kung ang tinutukoy ay ang mananampalataya o si Jesus, ang Anak, sa halip na ipasok ang isang interpretasyon sa pangunahing teksto.
- source_word: τηρεῖ αὐτόν
  choice: iniingatan siya
  rationale: Maaaring mangahulugan ang τηρέω ng pag-iingat, pagbabantay, o pangangalaga. Natural sa Tagalog ang “iniingatan siya” at pinananatili ang di-reflexibong panghalip ng tekstong SBLGNT.
- source_word: ὁ πονηρὸς
  choice: ang Masama
  rationale: Dahil may pantukoy at alinsunod sa gamit ni Juan, pinakamalamang na personal na tumutukoy ito kay Satanas. Ang malaking titik ay tumutulong na ipakitang katauhan ang tinutukoy.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: hindi siya maaaring sakmalin
  rationale: Ang ἅπτομαι ay maaaring mangahulugang humawak o kumapit upang pinsalain. Ipinahahayag ng “sakmalin” ang mapaminsalang paghawak na malamang na diwa rito, habang ipinaliliwanag sa talababa ang literal na larawan.
theological_decisions:
- issue: Diwa ng pangkasalukuyang οὐχ ἁμαρτάνει
  choice: Itinatanggi ng sugnay ang pagpapatuloy o pagkagawian sa pagkakasala.
  alternative: Ang ipinanganak mula sa Diyos ay hindi kailanman gumagawa ng anumang kasalanan.
  rationale: Ang pagpili ay umaayon sa aspektong di-ganap ng pangkasalukuyang pandiwa at hindi binubura ang tensiyon sa 1 Juan 1:8–10 at 2:1, kung saan kinikilalang maaaring magkasala ang mga mananampalataya.
- issue: Tinutukoy ng ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: 'Nananatiling malabo sa pangunahing teksto: “ang ipinanganak mula sa Diyos.”'
  alternative: Maaaring tumukoy ito sa mananampalataya na nag-iingat sa sarili, o kay Jesus na nag-iingat sa mananampalataya.
  rationale: Hindi tahasang nilulutas ng sintaks ng Griyego ang reperente. Pinananatili ng salin ang kalabuan at inilalahad sa talababa ang dalawang pangunahing pagkaunawa.
- issue: Tinutukoy ng αὐτόν at αὐτοῦ
  choice: Ang “siya” ay tumutukoy sa taong ipinanganak mula sa Diyos na iniingatan at hindi nasasakmal ng Masama.
  alternative: 'Kung ang paksa ng τηρεῖ ay ang mananampalataya ring nabanggit, maaaring reflexibo ang diwa: “iniingatan niya ang kanyang sarili.”'
  rationale: Ang αὐτόν sa SBLGNT ay karaniwang panghalip, hindi reflexive na ἑαυτόν. Gayunman, posible ang reflexibong pagkaunawa ayon sa pagkakaugnay ng mga reperente, kaya inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mula sa Diyos” upang malinaw na ipahayag ang pinagmulan; “nagpapatuloy sa pagkakasala” upang ihatid ang aspektong Griyego; at “Masama” bilang personal na katawagan. Ang mga talababa ay nakaayos ayon sa mismong pagkakasunod ng mga pananda sa pangunahing teksto.
