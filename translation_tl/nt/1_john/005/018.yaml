    rationale: Ang pandiwa ay walang ipinahihiwatig na kakayahan o posibilidad; ang «maaaring» ay nagdaragdag ng kahulugan. Ang «sakmalin» naman ay mas marahas at mas tiyak kaysa sa literal na paghipo o paghawak, bagaman maaaring may mapaminsalang implikasyon sa konteksto.
