base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: tl
  text: Mga anak[a], huwag tayong umibig sa salita o sa pananalita, kundi sa gawa at katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang manuskrito na mababasa: “Mga anak ko.”'
    reason: textual_variant
lexical_decisions:
- source_word: Τεκνία
  choice: Mga anak
  rationale: Ang pangmaramihang pantawag na ito ay magiliw at pampamilya. Ang “Mga anak” ang likas na katumbas sa makabagong Filipino; ang “Munting mga anak” ay maaaring maling magpahiwatig na bata ang tinutukoy.
- source_word: μὴ ἀγαπῶμεν
  choice: huwag tayong umibig
  rationale: Pinananatili nito ang pangmaramihang paghimok na kasama ang nagsasalita, gaya ng hortatory subjunctive sa Griyego.
- source_word: λόγῳ μηδὲ τῇ γλώσσῃ
  choice: sa salita lamang o sa pananalita
  rationale: Ang λόγος ay tumutukoy rito sa salita, at ang γλῶσσα—literal na “dila”—ay metonimiya para sa pananalita. Ang “pananalita” ay mas likas sa Filipino kaysa “sa dila,” habang napapanatili ang diin sa pag-ibig na hanggang salita lamang.
- source_word: ἐν ἔργῳ
  choice: sa gawa
  rationale: Maikli, likas, at tuwirang katumbas ng ἔργον bilang kongkretong kilos o gawa.
- source_word: καὶ ἀληθείᾳ
  choice: at katotohanan
  rationale: Pinananatili ang karaniwang kahulugan at mas malalim na temang Johannine ng ἀλήθεια, sa halip na paliitin ito sa “katapatan” o “pagiging taos-puso.”
theological_decisions:
- issue: Kahulugan ng ἀληθείᾳ sa “sa gawa at katotohanan”
  choice: katotohanan
  alternative: katapatan / pagiging taos-puso
  rationale: Maaaring tukuyin ng parirala ang pag-ibig na tunay at tapat, ngunit may mas malawak na teolohikal na saysay ang “katotohanan” sa mga sulat ni Juan. Pinananatili ng salin ang dalawang posibilidad sa halip na limitahan ito sa pansariling sinseridad.
translation_notes:
  register: Makabago, magalang, at madaling maunawaang Filipino. Ginamit ang “umibig” upang mapanatili ang marangal at makahulugang tono ng talata; iniwasan ang sobrang literal na “sa dila,” na hindi likas sa kasalukuyang Filipino.
