id: 1JN.3.1
reference: 1 John 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: tl
  text: Tingnan ninyo kung anong uri ng pag-ibig ang ibinigay sa atin ng Ama[a] upang tawagin tayong mga anak ng Diyos—at gayon nga tayo.[b] Dahil dito, hindi tayo nakikilala ng sanlibutan[c], sapagkat hindi nito nakilala siya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung gaano kadakila ang pag-ibig.” Binibigyang-diin ng Griyego, nang may paghanga, ang uri o katangian ng pag-ibig ng Ama.
    reason: lexical_alternative
  - marker: b
    text: Wala sa ilang manuskrito ang “at gayon nga tayo.”
    reason: textual_variant
  - marker: c
    text: Maaari ring “hindi tayo kilala ng sanlibutan ... hindi nito siya nakilala.”
    reason: lexical_alternative
  - marker: d
    text: Sa talatang ito, ang “siya” ay pinakamalamang na tumutukoy sa Ama; nauunawaan naman ito ng ilan bilang pagtukoy kay Cristo batay sa mas malawak na konteksto ng mga sulat ni Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Tingnan ninyo
  rationale: Isang tuwirang pautos na tumatawag ng pansin. Likas ito sa modernong Tagalog at hindi kasing-arkaiko ng “Masdan ninyo.”
- source_word: ποταπὴν
  choice: kung anong uri ng
  rationale: Ipinahahayag nito ang pagtataka sa uri o katangian ng pag-ibig, hindi lamang sa laki nito.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Tuwiran, malinaw, at karaniwang katumbas sa kontekstong ito.
- source_word: δέδωκεν
  choice: ang ibinigay
  rationale: Ipinapakita ng pandiwang Griyego ang isang kaloob na ibinigay at nananatiling mahalaga; ang likas na Tagalog na “ibinigay” ay hindi nagpipilit ng di-likas na anyong aspektuwal.
- source_word: ὁ πατὴρ
  choice: ang Ama
  rationale: Tumutukoy ito sa Diyos bilang Ama sa kontekstong Juanino.
- source_word: τέκνα θεοῦ
  choice: mga anak ng Diyos
  rationale: Ang τέκνα ay inklusibo sa kasarian at hindi dapat limitahan sa “mga anak na lalaki.”
- source_word: κληθῶμεν
  choice: tinawag tayong
  rationale: Likas na ipinapahayag sa Tagalog ang nilalaman o bunga ng kaloob ng Ama nang hindi nagpapahiwatig ng pag-aalinlangan.
- source_word: καὶ ἐσμέν
  choice: at gayon nga tayo
  rationale: Pinananatili ang mariing pagpapatunay na hindi lamang tayo tinatawag na mga anak ng Diyos kundi tunay ngang gayon tayo.
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Malinaw na inuugnay ang kasunod na pahayag sa naunang katotohanan.
- source_word: ὁ κόσμος
  choice: ang sanlibutan
  rationale: Pinananatili ang terminong Juanino para sa kaayusang pantao na salungat sa Diyos, nang hindi ito labis na ipinapaliwanag sa pangunahing teksto.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: hindi tayo nakikilala
  rationale: Sa konteksto, ang “nakikilala” ay natural na sumasaklaw sa pagkilala at pagkaunawa sa tunay na identidad ng mga anak ng Diyos, habang ang alternatibong “hindi tayo kilala” ay inilalagay sa talababa.
- source_word: ὅτι οὐκ ἔγνω αὐτόν
  choice: sapagkat hindi nito nakilala siya
  rationale: Pinananatili ang malinaw na ugnayang sanhi at ang paralelismo ng γινώσκω/ἔγνω, pati ang pormal na kalabuan ng panghalip.
theological_decisions:
- issue: Tinutukoy ng αὐτόν (“siya”)
  choice: Hindi pinangalanan sa pangunahing teksto; sa agarang sintaks, pinakamalamang na ang Ama
  alternative: Si Cristo
  rationale: Ang pinakamalapit na tahasang tinutukoy ay “ang Ama,” ngunit maaaring unawain ang panghalip bilang pagtukoy kay Cristo sa mas malawak na kontekstong Juanino. Pinananatili ng “siya” ang tunay na kalabuan at ipinapaliwanag ito sa talababa.
- issue: Pagkakasama ng καὶ ἐσμέν
  choice: Isinama bilang “at gayon nga tayo”
  alternative: Alisin ayon sa ilang manuskrito
  rationale: Kasama ang parirala sa SBLGNT at mahalaga itong mariing pagpapatunay. Itinala sa talababa ang baryanteng wala nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tingnan ninyo” sa halip na mas arkaikong “Masdan ninyo,” at “sanlibutan” upang mapanatili ang kinikilalang bokabularyong Juanino. Iniwasan ang pagtukoy sa partikular na denominasyonal na pagpapakahulugan.
