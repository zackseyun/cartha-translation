  source_fidelity: Tumpak na naipapahayag ang di-tiyak na saklaw ng ὃ ἐὰν ("anuman"), ang pangkalahatang kasalukuyang diwa ng αἰτῶμεν/λαμβάνομεν ("hingin"/"tinatanggap"), ang pinagmulan sa ἀπ’ αὐτοῦ ("mula sa kanya"), at ang malinaw na dahilang ipinahahayag ng ὅτι ("sapagkat"). Napananatili rin ang τὰς ἐντολὰς ... τηροῦμεν bilang pagtupad sa mga utos at ang malawak na saklaw ng τὰ ἀρεστὰ ... ποιοῦμεν.
  naturalness: Natural at marangal ang daloy para sa makabagong Filipino Tagalog. Ang "sa kanyang harapan" ay tuwirang katumbas ng ἐνώπιον αὐτοῦ at katanggap-tanggap sa rehistrong pang-Kasulatan; ang alternatibong idyoma sa talababa ay kapaki-pakinabang.
  terminology: Ang "mga utos," "tinutupad," at "kalugod-lugod" ay angkop at magkakatugma sa karaniwang bokabularyong biblikal sa Filipino. Hindi nito dinaragdagan o nilulutas ang ugnayang teolohikal ng panalangin at pagsunod lampas sa tahasang sanhi sa Griyego.
