id: 1JN.3.22
reference: 1 John 3:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: tl
  text: At anuman ang hingin natin ay tinatanggap natin mula sa kanya, sapagkat tinutupad natin ang kanyang mga utos at ginagawa natin ang kalugod-lugod sa kanyang harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginagawa natin ang nakalulugod sa kanyang paningin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν αἰτῶμεν
  choice: anuman ang hingin natin
  rationale: Ang ὃ ἐάν ay bumubuo ng di-tiyak na pariralang nangangahulugang “anuman,” at ang “hingin natin” ay natural na pagpapahayag ng panalanging pakiusap sa Filipino.
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: tinatanggap natin mula sa kanya
  rationale: Pinananatili ng “tinatanggap” ang pangkalahatang kasalukuyang diwa ng pandiwa, samantalang malinaw na ipinahihiwatig ng “mula sa kanya” ang pinagmulan.
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: tinutupad natin ang kanyang mga utos
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “tinutupad” ang patuloy na pag-iingat at pagsunod sa mga utos, nang hindi dinaragdagan ang kahulugan.
- source_word: τὰ ἀρεστὰ ... ποιοῦμεν
  choice: ginagawa natin ang kalugod-lugod
  rationale: Ang pang-uring neuter plural na ginagamit bilang pangngalan ay tumutukoy sa mga bagay na nakalulugod; ang kolektibong “ang kalugod-lugod” ay maikli, marangal, at malawak ang saklaw.
- source_word: ἐνώπιον αὐτοῦ
  choice: sa kanyang harapan
  rationale: Tuwirang pinananatili nito ang larawang “sa harap niya,” habang nananatiling natural sa makabagong Filipino; inilalahad sa talababa ang posibleng idyomatikong alternatibo.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na sanhi ang ipinahahayag ng ὅτι rito; pinananatili ng “sapagkat” ang tahasang ugnayang iyon.
theological_decisions:
- issue: Ugnayan ng tinutugong panalangin at pagtupad sa mga utos
  choice: 'Pinanatili ang tahasang sanhi: tumatanggap tayo mula sa kanya sapagkat tinutupad natin ang kanyang mga utos at ginagawa ang kalugod-lugod sa kanyang harapan.'
  alternative: Paluwagin ang pahayag upang maging kaugnayan lamang at hindi sanhi.
  rationale: Tahasan ang gamit ng ὅτι bilang pagbibigay ng dahilan. Hindi dapat pahinain ang tensiyong teolohikal ng talata ni palawakin ito bilang awtomatikong pormula para sa lahat ng kahilingan.
translation_notes:
  register: Makabago at dignified na Filipino; malinaw sa karaniwang mambabasa. Ginamit ang maliliit na titik sa panghalip na tumutukoy sa Diyos, ayon sa karaniwang makabagong baybay, nang walang pagbawas sa paggalang.
