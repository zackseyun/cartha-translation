  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: tl
  text: Sa pamamagitan nito, malalaman natin na tayo ay mula sa katotohanan[a], at sa harap niya ay bibigyan natin ng kapanatagan ang ating mga puso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tayo ay kabilang sa katotohanan.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “hihikayatin natin ang ating puso.” Maaari ring “papanatagin natin ang ating mga puso sa harap niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganitong paraan
  rationale: Likas na Filipino para sa instrumental na diwa ng parirala, habang pinananatili ang pagtukoy nito sa batayan o paraang binanggit sa konteksto.
- source_word: γνωσόμεθα
  choice: natin malalaman
  rationale: Tuwirang inilalarawan ang future indicative nang hindi nagdaragdag ng di-kailangang ingresibong diwa.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: tayo ay mula sa katotohanan
  rationale: Pinananatili ang larawan ng pinagmulan o pagkakaugnay na ipinahihiwatig ng ἐκ, sa halip na tahasang ipakahulugang pag-aari o pagkabilang.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: sa harap niya
  rationale: Malapit sa anyo at diwa ng Griyego at natural ding tumutukoy sa pagiging nasa kanyang presensiya.
- source_word: πείσομεν
  choice: bibigyan natin ng kapanatagan
  rationale: Sa kontekstong ang puso ang layon, ipinahihiwatig ng πείθω ang pagpapapanatag o pagbibigay-katiyakan; mas natural ito sa Filipino kaysa literal na 'hihikayatin' ang puso.
- source_word: τὴν καρδίαν ἡμῶν
  choice: ang ating mga puso
  rationale: Ginamit ang distributibong maramihan sa Filipino dahil maramihan ang nagsasalita, bagaman isahan ang anyong Griyego.
theological_decisions:
- issue: Diwa ng ἐκ τῆς ἀληθείας
  choice: mula sa katotohanan
  alternative: kabilang sa katotohanan
  rationale: Hindi nilulutas ang posibleng diwa ng pinagmulan, kaugnayan, o pag-aari sa pamamagitan ng mas tahasang doktrinal na pagpapakahulugan.
- issue: Diwa ng πείσομεν kapag puso ang layon
  choice: bibigyan natin ng kapanatagan ang ating mga puso
  alternative: hihikayatin natin ang ating puso
  rationale: Ipinahahayag ang kontekstuwal na diwa ng panloob na katiyakan sa harap ng Diyos, ngunit inilalagay sa talababa ang mas literal na posibilidad upang mapanatili ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangungusap bilang bahagi ng nagpapatuloy na argumento at ang pangwakas na bantas bilang kuwit, ayon sa ibinigay na yunit.
