  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: tl
  text: Huwag kayong magtaka, mga kapatid[a], kung napopoot sa inyo ang mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking maramihan ang anyong Griyego, ngunit malamang na tinutukoy rito ang buong komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Huwag kayong magtaka
  rationale: Likas at malinaw na Filipino para sa pagbabawal na ipinahahayag ng present imperative na may μή; iniiwasan nito ang mas makalumang “huwag kayong mamangha.”
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang karaniwang salitang Filipino na “kapatid” ay natural na tawag sa kapwa mananampalataya. Hindi nito minamarkahan ang kasarian, kaya ipinaliliwanag sa talababa na panlalaking maramihan ang anyong Griyego at malamang na saklaw ang buong kapulungan.
- source_word: εἰ
  choice: kung
  rationale: Pinananatili ang payak na kondisyunal na diwa ng εἰ nang hindi ito ginagawang tiyak na “kapag.”
- source_word: μισεῖ
  choice: napopoot sa
  rationale: Ang “napopoot sa inyo” ay natural na pagpapahayag ng kasalukuyan at patuloy na saloobin; mas matindi at mas angkop ito kaysa sa payak na “ayaw.”
- source_word: ὁ κόσμος
  choice: ang mundo
  rationale: Pinananatili ng “mundo” ang malawak at sadyang hindi lubusang nililinaw na diwa ng κόσμος sa mga sulat ni Juan, nang hindi nagdaragdag ng interpretasyong gaya ng “sistemang laban sa Diyos.”
theological_decisions:
- issue: Ang panlalaking anyo ng ἀδελφοί at ang saklaw ng pagtawag
  choice: Isinalin bilang “mga kapatid” at nilagyan ng talababa tungkol sa anyong Griyego
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Sa modernong Filipino, ang “mga kapatid” ang likas na tawag sa komunidad at hindi tahasang panlalaki. Pinananatili ng talababa ang impormasyong panggramatika at ang malamang na inklusibong saklaw nang hindi nagpapabigat sa pangunahing teksto.
- issue: Ang teolohikal na diwa ng κόσμος sa sulat ni Juan
  choice: “ang mundo” nang walang dagdag na paliwanag sa pangunahing teksto
  alternative: “ang mundong salungat sa Diyos” o “ang sistema ng mundo”
  rationale: Madalas tumukoy ang κόσμος sa sangkatauhan o kaayusang lumalaban sa Diyos, ngunit ang payak na “mundo” ang nagpapanatili sa lawak at tensiyon ng salita at hinahayaang ang konteksto ang maglinaw.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “mundo” sa halip na mas makalumang “sanlibutan,” at “napopoot” upang mapanatili ang lakas ng μισεῖ.
