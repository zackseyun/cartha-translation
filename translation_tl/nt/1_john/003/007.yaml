  rationale: Pinalitan ang “gumagawa ng katuwiran” ng “gumagawa ng matuwid” upang maging natural at malinaw sa modernong Filipino, habang pinananatili ang kahulugang etikal ng δικαιοσύνη at ang paghahambing nito sa “matuwid.” Inangkop ang talababa upang ipaliwanag ang anyong pangngalan ng Griyego nang hindi ipinapasok ang hindi natural na termino sa pangunahing teksto. Pinanatili ang “siya” at ang talababa nito upang hindi piliting lutasin ang reperente ng ἐκεῖνος.
