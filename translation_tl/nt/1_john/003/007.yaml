  naturalness: Ang “Mga anak” at “huwag kayong linlangin ng sinuman” ay malinaw at angkop sa marangal na modernong Tagalog. Ngunit mas karaniwan at tuwiran ang “gumagawa ng matuwid” kaysa “gumagawa ng katuwiran,” sapagkat ang “katuwiran” sa kasalukuyang gamit ay madalas unang nauunawaan bilang dahilan o pangangatwiran.
  terminology: Ang pares na “katuwiran/matuwid” ay naglalayong panatilihin ang pagkakaugnay ng δικαιοσύνη at δίκαιος, ngunit ang naturalness ay higit na napapanatili sa “gumagawa ng matuwid ay matuwid.” Ang talababa ay maaaring magpaliwanag na ang Griyegong pangngalan ay may kaugnayan sa “matuwid” at maaari ring isaling “katarungan.” Ang “siya” para sa ἐκεῖνος ay wastong hindi naglilimit sa reperente; ang tala ay sapat na nagbabanggit ng posibleng pagtukoy kay Cristo o sa Diyos.
