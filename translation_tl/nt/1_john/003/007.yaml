  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: tl
  text: Mga anak, huwag kayong linlangin ng sinuman.[a] Ang gumagawa ng matuwid[c] ay matuwid, kung paanong matuwid siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag kayong iligaw ng sinuman.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang isang iyon”; malamang na tumutukoy kay Cristo, bagaman nauunawaan ito ng ilan na tumutukoy sa Diyos.
    reason: alternative_reading
  - marker: c
    text: Ang Griyegong salita ay pangngalang kaugnay ng “matuwid”; maaari ring isaling “katarungan.” Dito, ang diwa ay wastong asal na kaayon ng pagiging matuwid.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Mga anak
  rationale: Isang magiliw na pantawag sa mga mambabasa. Natural ito sa modernong Tagalog at hindi ipinapalagay na literal na maliliit na bata ang kausap.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: huwag kayong linlangin ng sinuman
  rationale: Malinaw at natural na pagbabawal. Maaaring mangahulugan ang πλανάω ng panlilinlang o pag-akay palayo sa tama; ang konteksto ay tumutukoy sa maling aral tungkol sa matuwid na pamumuhay.
- source_word: ὁ ποιῶν
  choice: Ang gumagawa
  rationale: Ang pangkasalukuyang pandiwaring may pantukoy ay naglalarawan ng kinagawiang gawain o tuloy-tuloy na asal, hindi lamang ng isang hiwalay na kilos.
- source_word: τὴν δικαιοσύνην
  choice: ng katuwiran
  rationale: Pinananatili ng “katuwiran” ang ugnayang leksikal at teolohikal nito sa δίκαιος, “matuwid,” habang ang konteksto ay nakatuon sa wastong asal.
- source_word: δίκαιός ἐστιν
  choice: ay matuwid
  rationale: Tuwirang inilalarawan ang katayuan o katangian ng tao at pinananatili ang kaugnayan sa “katuwiran.”
- source_word: καθὼς
  choice: kung paanong
  rationale: Ipinapahayag nito ang paghahambing at pagtutugma sa pamantayang binabanggit sa kasunod na parirala.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Ang likas na panghalip sa Tagalog ay nagpapanatili sa reperenteng hindi tahasang pinangalanan. Iniiwasan nitong ipasok sa pangunahing teksto ang interpretibong pangalang “Cristo” o “Diyos”; inilalahad sa talababa ang literal na demonstratibong anyo.
theological_decisions:
- issue: Ang tinutukoy ng ἐκεῖνος
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; isinalin bilang “siya.”
  alternative: Maaaring tumukoy kay Cristo, na siyang mas malamang sa konteksto, o sa Diyos/Ama.
  rationale: Madalas gamitin sa 1 Juan ang ἐκεῖνος para kay Jesus sa mga konteksto ng pagtulad sa kanyang asal, ngunit hindi tahasang pinangalanan rito ang reperente. Pinananatili ng panghalip at talababa ang tunay na kalabuan sa halip na lutasin ito nang tahimik.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mga anak” bilang magiliw na pantawag at pinanatili ang pares na “katuwiran/matuwid.” Ang “siya” ay mas natural sa Tagalog kaysa sa literal ngunit alanganing “ang isang iyon,” habang ang literal na anyo at posibleng reperente ay nakatala sa talababa.
