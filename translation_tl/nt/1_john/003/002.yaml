id: 1JN.3.2
reference: 1 John 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: tl
  text: Mga minamahal, ngayon ay mga anak tayo ng Diyos, at hindi pa nahahayag kung ano ang magiging kalagayan natin. Alam natin na kung mahayag siya[a][b], magiging katulad niya tayo, sapagkat makikita natin siya kung ano siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung mahayag iyon,” na tumutukoy sa magiging kalagayan natin. Walang tahasang simuno ang pandiwang Griyego; mas pinapaboran ng konteksto ang “siya,” na tumutukoy kay Cristo.
    reason: alternative_reading
  - marker: b
    text: Madalas itong isalin na “kapag magpakita siya.” Mas literal ang Griyego na “kung mahayag siya,” at inuulit nito ang pandiwang ginamit sa “hindi pa nahahayag” sa naunang pangungusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan. Pinananatili nito ang kaugnayan sa pag-ibig at mas likas sa makabagong Tagalog kaysa sa mas pormal na “mga iniibig.”
- source_word: νῦν
  choice: ngayon
  rationale: Tahasang ipinapakita ang kasalukuyang kalagayan bilang kaibahan ng hindi pa nahahayag na kalagayan sa hinaharap.
- source_word: τέκνα θεοῦ
  choice: mga anak tayo ng Diyos
  rationale: Ipinahahayag ang ugnayang pampamilya nang walang ipinapasok na pagkakaibang pangkasarian.
- source_word: οὔπω ἐφανερώθη
  choice: hindi pa nahahayag
  rationale: Pinananatili ang balintiyak na tinig at ang diwa ng isang bagay na hindi pa naipakikita o naibubunyag.
- source_word: τί ἐσόμεθα
  choice: kung ano tayo sa hinaharap
  rationale: Likas na Tagalog para sa magiging uri o kalagayan ng mga mananampalataya, nang hindi ito ginagawang usapin lamang ng personal na pagkakakilanlan.
- source_word: οἴδαμεν
  choice: Alam natin
  rationale: Direkta at natural na salin ng pandiwang may kasalukuyang kahulugan.
- source_word: ἐὰν φανερωθῇ
  choice: kung mahayag siya
  rationale: Pinananatili ang kondisyonal na “kung,” ang balintiyak na tinig, at ang pag-uulit ng pandiwang ginamit sa naunang sugnay. Ang “siya” ay tumutukoy kay Cristo ayon sa pinakamalamang na daloy ng konteksto.
- source_word: ὅμοιοι αὐτῷ
  choice: magiging katulad niya tayo
  rationale: Ipinahahayag ang tunay na pagkakatulad ngunit hindi ang ganap na pagkakapareho o iisang kalikasan.
- source_word: ὀψόμεθα αὐτὸν
  choice: makikita natin siya
  rationale: Natural na salin ng panghinaharap na pandiwa at pinananatili ang tuwirang layon na “siya.”
- source_word: καθώς ἐστιν
  choice: kung ano talaga siya
  rationale: Ang “talaga” ay natural na nagpapahayag na makikita siya ayon sa tunay niyang pagiging, nang hindi dinaragdagan ang nilalaman ng teksto.
theological_decisions:
- issue: Ang tinutukoy ng di-tahasang simuno sa ἐὰν φανερωθῇ
  choice: 'Si Cristo ang tinutukoy: “kung mahayag siya.”'
  alternative: 'Ang magiging kalagayan ng mga anak ng Diyos ang tinutukoy: “kung mahayag iyon”; maaari ring isaling higit na interpretibo bilang “kapag magpakita siya.”'
  rationale: Pinakamalinaw sa kasunod na mga pananalitang “katulad niya” at “makikita natin siya” na si Cristo ang tinutukoy. Gayunman, dahil walang tahasang simuno sa Griyego, itinatala sa talababa ang tunay na alternatibo.
- issue: Ang uri ng magiging pagkakatulad kay Cristo
  choice: “magiging katulad niya tayo” — tunay na pagkakatulad, hindi lubos na pagkakapareho.
  alternative: “magiging gaya niya tayo” o ang mas matinding “magiging kung ano siya.”
  rationale: Ang ὅμοιοι ay nagsasaad ng pagkakatulad, hindi ng pagkakaisa ng identidad o kalikasan. Pinananatili ng salin ang lakas ng pangako nang hindi pinalalabis ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mga minamahal” bilang mainit ngunit hindi labis na pormal na pantawag. Iniwasan ang di-likas na literalismong “kung ano ang magiging tayo,” habang pinanatili ang paghaharap ng kasalukuyang pagiging mga anak ng Diyos at ng kalagayang hindi pa nahahayag.
