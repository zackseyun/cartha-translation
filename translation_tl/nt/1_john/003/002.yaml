  terminology: Ang «Mga minamahal,» «mga anak ng Diyos,» «mahayag,» at «magiging katulad niya tayo» ay angkop at magkakaugnay sa terminolohiya. Ang «Cristo» sa talababa ay katanggap-tanggap na modernong Filipino na anyo ng pangalan.
