source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: tl
  text: Ang bawat nananatili sa kanya ay hindi nagkakasala[a]; ang bawat nagkakasala ay hindi nakakita sa kanya ni nakakilala sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, maaaring ipakahulugan ang mga anyong pangkasalukuyan sa Griyego bilang tumutukoy sa nagpapatuloy o nakaugaliang gawain: “ay hindi patuloy na nagkakasala … ang bawat patuloy na nagkakasala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: ang bawat
  rationale: Ipinahahayag ng konstruksyong may πᾶς at artikulo ang sinumang kabilang sa tinutukoy na uri; natural sa Tagalog ang “ang bawat” at pinananatili nito ang pangkalahatang saklaw.
- source_word: ἐν αὐτῷ μένων
  choice: nananatili sa kanya
  rationale: Pinananatili ng “nananatili” ang nagpapatuloy na diwa ng μένω at ang mahalagang pananalitang Juanino na “sa kanya,” nang hindi nililinaw nang higit sa Griyego ang uri ng kaugnayan.
- source_word: οὐχ ἁμαρτάνει
  choice: hindi patuloy na nagkakasala
  rationale: Maaaring ilarawan ng pangkasalukuyang anyo ang nagpapatuloy o katangiang gawain. Ipinahahayag ito ng “patuloy na nagkakasala” habang iniiwasang ipakahulugan na hindi kailanman nagkakasala ang isang mananampalataya.
- source_word: πᾶς ὁ ἁμαρτάνων
  choice: ang bawat patuloy na nagkakasala
  rationale: Ang pangkasalukuyang participle ay inihahanay sa naunang pandiwa bilang nagpapatuloy o katangiang pagkakasala; pinananatili ng salin ang paralelismo ng dalawang sugnay.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: ay hindi nakakita sa kanya
  rationale: Ang “hindi nakakita” ay natural na Tagalog para sa Griyegong perfect at hindi nagdaragdag ng “kailanman,” na wala sa mismong teksto.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: ni nakakilala sa kanya
  rationale: Ang “nakakilala” ay maaaring magpahiwatig ng personal at relasyonal na pagkakilala, gaya ng madalas na gamit ni Juan sa γινώσκω; wastong iniuugnay ng “ni” ang dalawang negatibong pahayag.
- source_word: αὐτῷ / αὐτόν
  choice: kanya
  rationale: Panghalip lamang ang ginamit sa Griyego. Pinananatili ang “kanya” upang hindi tukuyin nang higit sa pinagmulan kung ang tinutukoy ay ang Diyos o ang Anak.
theological_decisions:
- issue: Kung itinuturo ng talata ang lubos na kawalan ng kasalanan ng mga mananampalataya
  choice: 'Isinalin ang mga pangkasalukuyang anyo bilang nagpapatuloy o katangiang pagkakasala: “patuloy na nagkakasala.”'
  alternative: Mas pormal na “hindi nagkakasala … nagkakasala,” na maaaring basahin bilang lubos na pagtanggi sa anumang pagkakasala.
  rationale: Pinananatili nito ang matinding etikal na pahayag ng talata at ang tensiyon nito sa 1 Juan 1:8–2:2, kung saan kinikilala ang pagkakasala at ang pamamagitan ni Cristo. Dahil hindi tahasang nakapaloob sa present tense lamang ang aspektong ito, inilalahad din sa talababa ang mas pormal na anyo.
- issue: Ang tinutukoy ng panghalip na αὐτός
  choice: Pinanatili ang panghalip na “kanya.”
  alternative: Tahasang tukuyin bilang “Diyos,” “ang Anak,” o “Cristo.”
  rationale: Hindi tahasang pinapangalanan ng talata ang tinutukoy, kaya hindi nilulutas ng salin ang tunay na kalabuan ng pinagmulan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nananatili” upang mapanatili ang mahalagang bokabularyong Juanino, at ang “patuloy na nagkakasala” upang malinaw sa karaniwang mambabasa ang posibleng aspektong nagpapatuloy o katangian. Nasa pangunahing teksto ang marker na [a].
