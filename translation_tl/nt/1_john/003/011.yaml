base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: tl
  text: Sapagkat ito ang mensaheng narinig ninyo mula pa sa simula:[a] dapat tayong magmahalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ito ang mensahe na narinig ninyo mula pa sa simula.”
    reason: lexical_alternative
  - marker: b
    text: O “upang magmahalan tayo” o “magmahalan tayo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Sapagkat
  rationale: Ginamit bilang panandang nagpapaliwanag sa naunang pahayag; likas at malinaw sa Filipino ang “Sapagkat.”
- source_word: ἡ ἀγγελία
  choice: ang mensahe
  rationale: Karaniwang salitang Filipino na malinaw na tumutukoy sa aral o pahayag na tinanggap ng mga mambabasa.
- source_word: ἣν ἠκούσατε
  choice: narinig ninyo
  rationale: Tuwirang inililipat ang aorist na pandiwa nang hindi ipinapasok ang aspektong hindi tahasang nasa anyong Griego.
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili ang pamilyar na ekspresyong Juanino at ipinahihiwatig ng “pa” ang pagpapatuloy ng kaugnayan nito hanggang sa kasalukuyan.
- source_word: ἵνα ἀγαπῶμεν
  choice: dapat tayong magmahalan
  rationale: Natural na ipinapahayag sa Filipino ang nilalaman at moral na puwersa ng sugnay, habang ang ibang posibleng puwersa ng ἵνα at subjunctive ay inilalahad sa talababa.
- source_word: ἀλλήλους
  choice: magmahalan
  rationale: Ang resiprokal na anyong “mag-…-an” ay natural at tumpak na nagsasaad ng pag-ibig sa isa’t isa.
theological_decisions:
- issue: Puwersa ng ἵνα ἀγαπῶμεν ἀλλήλους
  choice: “dapat tayong magmahalan” bilang nilalaman at etikal na diin ng mensahe
  alternative: “upang magmahalan tayo” o “magmahalan tayo”
  rationale: Maaaring ipakilala ng ἵνα rito ang nilalaman ng mensahe, ngunit maaari ring marinig ang layunin o tuwirang paghimok. Pinili sa pangunahing teksto ang natural na pahayag ng obligasyong moral at pinanatili sa talababa ang tunay na saklaw ng ibang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magmahalan” sa halip na mas mahabang “magmahal sa isa’t isa” dahil likas nitong ipinapahayag ang resiprokal na diwa ng ἀλλήλους.
