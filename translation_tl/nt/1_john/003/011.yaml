  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Griyego: ang Ὅτι ay maayos na “Sapagkat,” ang ἀγγελία ay “mensahe,” ang ἣν ἠκούσατε ἀπ’ ἀρχῆς ay “mensaheng narinig ninyo mula pa sa simula,” at ang resiprokal na ἀλλήλους ay likas na naipahayag sa “magmahalan.” Hindi nito dinaragdagan ang saklaw ng pahayag.'
  naturalness: 'Likas, malinaw, at angkop sa makabagong Filipino ang “Sapagkat ito ang mensaheng narinig ninyo mula pa sa simula: dapat tayong magmahalan.” Ang “magmahalan” ay idiomatiko at sapat nang nagpapahiwatig ng “sa isa’t isa.”'
  terminology: Ang “mensahe” ay angkop na modernong katumbas ng ἀγγελία. Ang “mula pa sa simula” ay mahusay at pare-parehong salin para sa ekspresyong Juanino na ἀπ’ ἀρχῆς. Ang “dapat tayong magmahalan” ay isang makatwirang paraan upang ihayag ang etikal na puwersa ng ἵνα ἀγαπῶμεν nang hindi ipinipilit ang isang doktrinal na pagbasa.
