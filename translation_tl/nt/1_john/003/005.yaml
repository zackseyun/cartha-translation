source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: tl
  text: At alam ninyo na nahayag siya[b] upang alisin ang mga kasalanan[a], at walang kasalanan sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalhin palayo” ang mga kasalanan. Ang pandiwang Griyego ay maaaring mangahulugang alisin o dalhin palayo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpakita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Ang anyong perpekto na οἶδα ay karaniwang may pangkasalukuyang diwa sa Koine; natural sa modernong Tagalog ang “alam ninyo.”
- source_word: ἐκεῖνος
  choice: siya
  rationale: Bagaman maaaring literal na “ang isang iyon,” malinaw sa konteksto na tumutukoy ito kay Jesu-Cristo; pinananatili ng “siya” ang likas na daloy nang hindi nagdaragdag ng pangalan.
- source_word: ἐφανερώθη
  choice: nagpakita
  rationale: Tumutukoy ito sa makasaysayang pagpapakita ni Cristo. Mas natural at malinaw ang “nagpakita” kaysa sa mas teknikal na “nahayag,” habang naipahihiwatig pa rin na dati siyang hindi nakikita o lantad.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layuning isinasaad ng ἵνα.
- source_word: τὰς ἁμαρτίας
  choice: ang mga kasalanan
  rationale: Pinananatili ang maramihang anyo ng Griyego at ang pagtukoy nito sa mga konkretong kasalanan.
- source_word: ἄρῃ
  choice: alisin
  rationale: Saklaw ng αἴρω ang pag-aalis o pagdadala palayo. Ang “alisin” ang pinakanatural dito at hindi nito nililimitahan ang talata sa isang partikular na paliwanag tungkol sa pagtubos.
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Ang payak na “kasalanan” ay nagpapanatili sa ganap na pahayag tungkol sa kawalan ng kasalanan sa kanya.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Natural na Tagalog ito para sa ἐν αὐτῷ sa pangungusap na ito at pinananatili ang diwa na walang kasalanang matatagpuan sa kanya.
theological_decisions:
- issue: Ang tinutukoy ng ἐκεῖνος
  choice: Panghalip na “siya,” na tumutukoy kay Jesu-Cristo
  alternative: “ang isang iyon” o tahasang “si Jesu-Cristo”
  rationale: Malinaw sa konteksto ang pagtukoy kay Cristo. Iniiwasan ng “siya” ang malabong literalismo at ang pagdaragdag ng pangalang wala sa mismong talata.
- issue: Kahulugan ng αἴρω kaugnay ng mga kasalanan
  choice: alisin ang mga kasalanan
  alternative: dalhin o pasanin ang mga kasalanan
  rationale: Binibigyang-diin ng talata ang layunin ng pagpapakita ni Cristo—ang pag-aalis ng mga kasalanan. Hindi nito ipinipilit ang isang partikular na modelo ng pagtubos; inilalahad sa talababa ang tunay na saklaw ng pandiwa.
- issue: Pahayag na ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν
  choice: walang kasalanan sa kanya
  alternative: walang kasalanang nasa loob niya
  rationale: Pinananatili ng salin ang tuwiran at ganap na pahayag ng teksto tungkol sa kawalan ng kasalanan kay Cristo nang walang karagdagang pagpapaliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpakita” bilang natural na katumbas ng ἐφανερώθη; hindi na kailangan ng hiwalay na talababa dahil ang alternatibong “nahayag” ay hindi nagdudulot ng mahalagang pagkakaibang semantiko sa Tagalog. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang tinutukoy nito.
