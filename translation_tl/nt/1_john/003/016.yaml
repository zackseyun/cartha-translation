reference: 1 John 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: tl
  text: 'Sa pamamagitan nito natin nakilala ang pag-ibig: ibinigay niya ang kanyang buhay para sa atin,[a] at dapat din nating ibigay ang ating mga buhay para sa mga kapatid.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “para sa atin” ay maaari ding isaling “alang-alang sa atin” o “para sa ating kapakanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “mga kapatid” ay tumutukoy sa kapwa mananampalataya, mga lalaki at mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganito
  rationale: Ipinakikilala ng parirala ang batayan o paraan kung paano nakilala ang pag-ibig. Likas sa modernong Tagalog ang “Sa ganito” at pinananatili nito ang bahagyang lawak ng kahulugang “dito” o “sa pamamagitan nito.”
- source_word: ἐγνώκαμεν
  choice: natin nakilala
  rationale: Ang aspektong perfect ay tumutukoy sa pagkilalang naganap at nananatiling mahalaga sa kasalukuyan. Naipahihiwatig ito ng “nakilala” sa natural na Tagalog nang hindi nagiging mabigat ang pangungusap.
- source_word: τὴν ἀγάπην
  choice: ang pag-ibig
  rationale: Tuwirang katumbas ito ng ἀγάπη at angkop sa tinutukoy na mapagsakripisyong pag-ibig.
- source_word: ἐκεῖνος
  choice: niya
  rationale: Pinananatili ang panghalip ng Griyego sa halip na idagdag sa teksto ang pangalang Jesus; ang konteksto ang tumutukoy sa kanya.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Ipinahahayag nito ang pagkilos alang-alang sa atin nang hindi nililimitahan ang parirala sa isang partikular na paliwanag tungkol sa pagbabayad-sala.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: inialay niya ang kanyang buhay
  rationale: Sa idyomang ito, ang ψυχή ay “buhay,” at ang τίθημι ay kusang pagbibigay nito. Mas natural sa Tagalog ang “inialay ang buhay” kaysa literal na “inilapag ang buhay,” at malinaw nitong naihahatid ang kusang pagsasakripisyo.
- source_word: ὀφείλομεν
  choice: dapat din nating
  rationale: Ipinahahayag ng “dapat” ang moral na pananagutan o obligasyon, habang ang “din” ay nagpapanatili sa paghahambing sa ginawa niya.
- source_word: ὑπὲρ τῶν ἀδελφῶν
  choice: para sa mga kapatid
  rationale: Ang “mga kapatid” ay natural na katumbas sa Tagalog ng pangmaramihang ἀδελφῶν at maaari ring tumukoy sa kapwa mananampalataya anuman ang kasarian; nililinaw ito sa talababa.
- source_word: τὰς ψυχὰς θεῖναι
  choice: ialay ang ating mga buhay
  rationale: Pinananatili nito ang pagkakatulad sa naunang parirala at ang pangmaramihang anyo ng Griyego, na tumutukoy sa buhay ng bawat isa sa atin.
theological_decisions:
- issue: Ang tinutukoy ng ἐκεῖνος
  choice: Panghalip lamang ang ginamit sa pangunahing teksto, na sa konteksto ay tumutukoy kay Jesus.
  alternative: Tahasang isalin na “inialay ni Jesus” o mas literal na “ang Isang iyon.”
  rationale: Malinaw sa konteksto ng 1 Juan na si Jesus ang tinutukoy, ngunit panghalip ang nasa Griyego. Pinananatili ng salin ang anyo at hinahayaang ang konteksto ang kumilala sa kanya.
- issue: Saklaw ng τῶν ἀδελφῶν
  choice: “mga kapatid,” na sa kontekstong pansamahan ng mga mananampalataya ay sumasaklaw sa mga lalaki at babae
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Masaklaw sa kasarian ang karaniwang gamit ng “mga kapatid” sa Tagalog, kaya naihahatid nito ang kolektibong gamit ng pangmasculinong plural sa Griyego nang hindi nagdaragdag ng mga salitang wala sa pangunahing teksto.
- issue: Diwa ng pag-aalay ng buhay
  choice: Kusang mapagsakripisyong pagkamatay para sa atin, nang hindi tinutukoy sa salin ang isang partikular na teorya ng pagbabayad-sala
  alternative: Isaling may mas tiyak na diwang pamalit, gaya ng “namatay bilang kapalit natin”
  rationale: Ang ὑπέρ ay may bigat na pagkilos alang-alang sa iba at maaaring umugnay sa pamalit na pagsasakripisyo, ngunit hindi kailangang tukuyin dito nang mas makitid kaysa sa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “inialay ang buhay” bilang likas na Tagalog para sa idyomang Griyego, habang pinanatili ang pag-uulit at moral na bigat ng talata.
