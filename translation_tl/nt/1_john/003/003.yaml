  rationale: Pinalitan ang ‘ang bawat may’ ng ‘ang bawat taong may’ para sa mas likas na pangkalahatang konstruksiyon sa Tagalog. Idinagdag ang ‘niya’ sa ‘dinadalisay niya ang kanyang sarili’ upang malinaw na maipakita ang aktibong reflexive na kahulugan, habang pinananatili ang cognate na ‘dinadalisay/dalisay,’ ang ambiguity ng mga panghalip, at ang lahat ng umiiral na footnote anchor.
