  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: tl
  text: At ang bawat taong may ganitong pag-asang nakatuon sa kanya[a] ay dinadalisay niya ang kanyang sarili, kung paanong siya[b] ay dalisay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “may ganitong pag-asa sa kanya.” Maaaring ipahiwatig ng pariralang Griyego na siya ang pinagtutuunan o pinagbabatayan ng pag-asa.
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “siya” ay malamang na tumutukoy sa Anak, si Cristo, bagaman panghalip lamang ang ginamit sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: ang bawat may
  rationale: Likas at maikli sa modernong Tagalog, habang pinananatili ang pangkalahatan at patuloy na katangian ng articular present participle.
- source_word: τὴν ἐλπίδα ταύτην
  choice: ganitong pag-asa
  rationale: Itinuturo ng demonstrative ang pag-asang binanggit sa naunang konteksto; ang “ganitong” ay natural na anaporiko sa Tagalog.
- source_word: ἐπ’ αὐτῷ
  choice: nakatuon sa kanya
  rationale: Ipinahahayag nito na siya ang pinagtutuunan o pinagbabatayan ng pag-asa, habang kinikilala sa talababa ang posibleng saling “nasa kanya.”
- source_word: ἁγνίζει ἑαυτὸν
  choice: dinadalisay ang kanyang sarili
  rationale: Pinananatili ang aktibong reflexive na diwa at ang leksikal na ugnayan ng ἁγνίζει sa ἁγνός. Ang “dinadalisay” ay marangal at nauunawaan sa kontekstong moral.
- source_word: καθὼς
  choice: kung paanong
  rationale: Malinaw na naghuhudyat ng paghahambing at angkop sa dignidad ng talata.
- source_word: ἐκεῖνος
  choice: siya
  rationale: Natural sa Tagalog at hindi nagdaragdag ng pangalang “Cristo” o “Anak” na wala sa mismong teksto; nililinaw ng talababa ang malamang na reperente.
- source_word: ἁγνός
  choice: dalisay
  rationale: Pinakamalapit na katumbas sa kontekstong moral at pinananatili ang ugnayan sa pandiwang “dinadalisay.”
theological_decisions:
- issue: Reperente ng αὐτῷ at ἐκεῖνος
  choice: Panatilihin bilang mga panghalip; sa konteksto, malamang na tumutukoy ang mga ito sa Anak/Cristo.
  alternative: Tahasang isalin bilang “Cristo” o unawaing tumutukoy sa Diyos Ama.
  rationale: Malakas na itinuturo ng agarang konteksto ang Anak/Cristo, ngunit mga panghalip lamang ang ginamit ng Griyego. Hindi dapat lutasin sa pangunahing teksto ang bahagyang kalabuan na pinanatili ng pinagmulan.
- issue: Reflexive na ἑαυτὸν sa pangkalahatang konstruksiyon
  choice: “ang kanyang sarili”
  alternative: “ang sarili” o “ang kanilang sarili”
  rationale: Ang Tagalog na “kanyang sarili” ay malinaw na reflexive at tumutugma sa isahang anyo nang hindi kailangang magpasok ng tahasang kasariang wala sa likas na gamit ng panghalip sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na natural, dignified, at madaling maunawaan. Ginamit ang “dalisay/dinadalisay” upang mapanatili ang ugnayang leksikal ng pandiwa at pang-uri sa Griyego. Ang mga talababa ay inilagay kaagad sa mga pariralang tinutukoy ng mga ito.
