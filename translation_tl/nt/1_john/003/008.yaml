id: 1JN.3.8
reference: 1 John 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: tl
  text: 'Ang namumuhay sa kasalanan ay mula sa diyablo[a], sapagkat ang diyablo ay patuloy na nagkakasala mula pa sa pasimula[b]. Para sa layuning ito nahayag ang Anak ng Diyos[c]: upang wasakin ang mga gawa ng diyablo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang gumagawa ng kasalanan.” Ang anyo ng pandiwa sa Griyego ay maaaring magpahiwatig ng nagpapatuloy o nakaugaliang gawain, hindi lamang ng isang nakahiwalay na pagkakasala. Ang “mula sa diyablo” ay tumutukoy sa pinagmulan o moral-espirituwal na pagkakaugnay.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang tinutukoy ng “mula pa sa pasimula” kung alin mismong pasimula ang ibig sabihin.
    reason: ambiguity_preservation
  - marker: c
    text: Maaari ring “Para sa layuning ito, nagpakita ang Anak ng Diyos.” Ang “nahayag” ay may diwa ng pagpapakita o pagkakilala.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “upang buwagin” o “kalagin ang mga gawa ng diyablo.” Ang pandiwa ay literal na nangangahulugang “kalagin” o “lutasin,” at dito ay may diwang magwasak o magpawalang-bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Ang namumuhay sa kasalanan
  rationale: Ipinahihiwatig ng pangkasalukuyang participle ang nagpapatuloy o nakaugaliang paggawa ng kasalanan. Likas sa modernong Tagalog ang “namumuhay sa kasalanan” at hindi nito ipinapalagay na isang nakahiwalay na pagkakasala lamang ang tinutukoy.
- source_word: ἐκ τοῦ διαβόλου
  choice: ay mula sa diyablo
  rationale: Pinananatili ng “mula sa” ang larawan ng pinagmulan o moral-espirituwal na pagkakaugnay, nang hindi ipinahihiwatig ang literal na pag-aanak o ontolohikal na pinagmulan.
- source_word: διάβολος
  choice: diyablo
  rationale: Sa konteksto, ito ang kinikilalang personal na katawagan sa diyablo, hindi lamang ang karaniwang kahulugang “maninirang-puri.”
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: sapagkat ... mula pa sa pasimula
  rationale: Ipinakikita ng “sapagkat” ang dahilan, habang pinananatili ng “mula pa sa pasimula” ang malawak at sadyang hindi tinukoy na temporal-teolohikal na diwa ng parirala.
- source_word: ἁμαρτάνει
  choice: ay patuloy na nagkakasala
  rationale: Ipinahahayag nito ang nagtatagal at katangiang gawain ng diyablo mula sa pasimula hanggang sa kasalukuyang pananaw ng pahayag.
- source_word: εἰς τοῦτο
  choice: Dahil dito
  rationale: Sa natural na Tagalog, tumuturo ito pasulong sa layuning kasunod. Maaari rin itong unawaing “Para sa layuning ito,” kaya nililinaw iyon sa talababa.
- source_word: ἐφανερώθη
  choice: nahayag
  rationale: Pinananatili nito ang diwa ng pagpapakita at pagkakahayag ng pagkakakilanlan at misyon ng Anak, at ang anyong hindi tahasang nagsasaad ng gumagawa.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwiran at karaniwang salin ng hayag na titulong kristolohikal.
- source_word: ἵνα λύσῃ
  choice: upang wasakin
  rationale: Ang λύω ay literal na “kalagin” o “lutasin,” ngunit kasama ng “mga gawa ng diyablo” ay tumutukoy sa mapagpasyang pagbuwag o pagpawi sa bisa ng mga iyon.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: ang mga gawa ng diyablo
  rationale: Pinananatili ang maramihang bilang at ang malawak na saklaw ng “mga gawa,” kabilang ang masasamang gawain at mga bunga ng mga ito.
theological_decisions:
- issue: Lakas ng pangkasalukuyang pananalita tungkol sa kasalanan
  choice: 'Isinalin bilang nagpapatuloy o nakaugaliang pamumuhay: “namumuhay sa kasalanan” at “patuloy na nagkakasala.”'
  alternative: Unawain bilang ganap na pahayag tungkol sa kahit isang gawa ng kasalanan.
  rationale: Ang aspektong pangkasalukuyan at ang mas malawak na konteksto ng 1 Juan ay pumapabor sa katangiang huwaran ng kilos. Pinananatili nito ang tensiyon sa mga pahayag ng sulat na kumikilala ring nagkakasala ang mga mananampalataya.
- issue: Kahulugan ng “mula sa diyablo”
  choice: Moral-espirituwal na pinagmulan o pagkakaugnay.
  alternative: Literal o ontolohikal na pagmula sa diyablo.
  rationale: Pinananatili ng salin ang metapora ng pinagmulan nang hindi ginagawang literal na pag-aanak ang ugnayan.
- issue: Layunin ng pagkahayag ng Anak
  choice: Nahayag ang Anak upang wasakin o buwagin ang mga gawa ng diyablo.
  alternative: Nahayag lamang upang ilantad ang mga gawa ng diyablo.
  rationale: Ang ἵνα-clause ay nagsasaad ng layunin, at ang λύσῃ sa kontekstong ito ay mapagpasyang pagbuwag, hindi lamang paglalantad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “diyablo,” “nahayag,” at “pasimula” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na teknikal o denominasyonal na pananalita. Ang ayos ng mga sugnay ay nananatiling malapit sa Griyego habang natural sa Tagalog.
