  source_fidelity: Tumpak ang pagsasalin ng patuloy o nakaugaliang paggawa ng kasalanan, ng moral-espirituwal na diwa ng ἐκ τοῦ διαβόλου, ng temporal na “mula pa sa pasimula,” at ng layuning ipinahahayag ng ἵνα. Gayunman, ang “Dahil dito” ay karaniwang tumutukoy pabalik sa Tagalog at maaaring basahing dahilan/bunga, samantalang ang εἰς τοῦτο ay tumuturo pasulong sa layunin ng pagkahayag ng Anak.
  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at likas sa modernong Filipino ang “Para sa layuning ito” sa puntong ito kaysa “Dahil dito.”
  terminology: Ang “diyablo,” “Anak ng Diyos,” “nahayag,” “kasalanan,” at “mga gawa ng diyablo” ay angkop, matatag, at hindi nagdaragdag ng denominasyonal na pagpapakahulugan. Ang “wasakin” ay katanggap-tanggap na kontekstuwal na salin ng λύσῃ; ang “buwagin” ay nananatiling kapaki-pakinabang na alternatibo sa talababa.
