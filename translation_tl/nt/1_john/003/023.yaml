source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: tl
  text: 'At ito ang kanyang utos: sumampalataya tayo sa pangalan ng kanyang Anak na si Jesus na Mesiyas[a] at magmahalan tayo, kung paanong ibinigay niya sa atin ang utos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Jesus na Cristo.” Ang salitang Griego na Χριστός ay nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
  - marker: b
    text: Sa Griego, literal na “kung paanong ibinigay niya sa atin ang utos” o “isang utos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: utos
  rationale: Ang “utos” ay natural sa makabagong Tagalog at pinananatili ang awtoritatibong diwa ng pangngalan.
- source_word: ἵνα πιστεύσωμεν
  choice: sumampalataya tayo
  rationale: Pagkatapos ng “ito ang kanyang utos,” ipinakikilala ng ἵνα ang nilalaman ng utos. Ang anyong “sumampalataya tayo” ay likas sa Tagalog at naipahahayag ang hortatoryong puwersa ng subjunctive.
- source_word: πιστεύω τῷ ὀνόματι
  choice: sumampalataya sa pangalan
  rationale: Ipinahihiwatig ng parirala ang pananampalatayang nakatuon sa taong ipinakikilala at kinakatawan ng pangalan, hindi lamang ang pagsang-ayon sa isang katawagan.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ng kanyang Anak
  rationale: Tuwirang inilalarawan ang kaugnayan ni Jesus sa Diyos; ginamit ang malaking titik sa “Anak” bilang pantukoy sa natatanging titulong ito sa konteksto.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas.” Ang “Jesus na Mesiyas” ay malinaw at likas sa Tagalog habang pinananatili ang tungkulin nito bilang titulo.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: magmahalan tayo
  rationale: Ang pandiwang resiprokal na “magmahalan” ay maikli at natural na katumbas ng “ibigin ang isa't isa,” at malinaw na nagsasaad ng pag-ibig sa isa't isa.
- source_word: καθὼς
  choice: ayon sa
  rationale: Sa kontekstong ito, natural na iniuugnay ng “ayon sa” ang pag-ibig sa utos na ibinigay niya; pinananatili nito ang diwa ng pagtutugma o pagsunod.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: iniutos niya sa atin
  rationale: Ito ang pinakanatural na Tagalog para sa literal na “nagbigay siya sa atin ng utos.” Nananatili ang buong kahulugan kahit nagiging pandiwa ang pangngalang ἐντολή.
theological_decisions:
- issue: Paglalahad sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay kinikilala ang Anak sa pamamagitan ng mesiyanikong titulo. Pinananatili ng “Mesiyas” ang kahulugan ng titulo sa halip na tratuhin itong wari'y apelyido.
- issue: Puwersa ng πιστεύω τῷ ὀνόματι
  choice: sumampalataya sa pangalan
  alternative: magtiwala sa pangalan
  rationale: Pinananatili ng “sumampalataya” ang karaniwang bokabularyong Juaniko at ang teolohikal na diwa ng pananampalatayang nakatuon kay Jesus ayon sa kanyang nahayag na pagkakakilanlan at awtoridad.
- issue: Ugnayan ng dalawang pandiwa sa iisang utos
  choice: sumampalataya tayo ... at magmahalan tayo
  alternative: dapat tayong sumampalataya ... at magmahalan
  rationale: Pinananatili ang dalawang magkaugnay na nilalaman ng iisang utos nang hindi nagpapasya kung dapat itong hatiin sa magkahiwalay na mga utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at ang resiprokal na “magmahalan” para sa likas na daloy. Hindi nilagyan ng paliwanag sa mismong talata ang teolohikal na saklaw ng “pangalan,” upang mapanatili ang siksik at bahagyang bukas na pahayag ng orihinal.
