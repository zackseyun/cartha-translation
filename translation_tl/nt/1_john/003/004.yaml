  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: tl
  text: Ang bawat gumagawa ng kasalanan[a] ay gumagawa rin ng paglabag sa kautusan, at ang kasalanan ay paglabag sa kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang bawat patuloy na gumagawa ng kasalanan.” Ang mga anyong kasalukuyan sa Griyego ay literal na maisasaling “gumagawa,” ngunit sa kontekstong ito maaari silang magpahiwatig ng nagpapatuloy o kinagawiang gawain.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, kapuwa may artikulo ang “kasalanan” at “paglabag sa kautusan,” ngunit hindi karaniwang inuulit ang gayong pantukoy sa natural na Tagalog kapag nagbibigay ng ganitong depinisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Ang bawat gumagawa
  rationale: Pinananatili nito ang pangkalahatang saklaw ng parirala—bawat taong gumagawa—nang hindi nililimitahan sa kasarian. Ang kasalukuyang pandiwaring Griyego ay maaaring magpahiwatig ng nagpapatuloy o kinagawiang gawain, ngunit ang payak na “gumagawa” ay natural sa Tagalog at hindi labis na nagpapasya sa aspektong iyon.
- source_word: τὴν ἁμαρτίαν
  choice: ng kasalanan
  rationale: Ang “kasalanan” ay ginagamit bilang pangkalahatan at abstraktong kategorya; hindi kailangan sa natural na Tagalog ang katumbas ng artikulong Griyego.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: ay gumagawa rin ng paglabag sa kautusan
  rationale: Inuulit ang “gumagawa” upang mapanatili ang paralelismo ng ποιῶν at ποιεῖ. Ang “paglabag sa kautusan” ay malinaw at likas na salin ng ἀνομία habang pinananatili ang kaugnayan nito sa νόμος, ‘kautusan.’
- source_word: ἀνομία
  choice: paglabag sa kautusan
  rationale: Mas madaling maunawaan ito ng karaniwang mambabasa kaysa “kawalan ng kautusan” o “kalapastanganan,” at hindi nito tinutukoy nang higit sa teksto kung aling partikular na kautusan ang tinutukoy.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: at ang kasalanan ay paglabag sa kautusan
  rationale: Pinananatili ang tuwiran at mariing depinisyon ng teksto. Hindi ito pinalalambot bilang bunga lamang o halimbawa ng kasalanan.
theological_decisions:
- issue: Kung ang mga pandiwang nasa kasalukuyang anyo ay tumutukoy sa isang kilos o sa nagpapatuloy o kinagawiang gawain
  choice: gumagawa, na may paliwanag sa talababa tungkol sa maaaring nagpapatuloy o kinagawiang diwa
  alternative: patuloy na gumagawa; namimihasa
  rationale: Maaaring magpahiwatig ang konteksto ng katangian o nagpapatuloy na asal, ngunit hindi teknikal na nangangahulugan ang anyong kasalukuyan ng ‘palagi’ o ‘walang tigil.’ Pinananatili ng pangunahing salin ang pagiging tuwiran at ng talababa ang tunay na aspektuwal na posibilidad.
- issue: Ang saklaw ng ἀνομία sa depinisyong pangwakas
  choice: paglabag sa kautusan
  alternative: kawalan ng kautusan; kasamaan
  rationale: Pinananatili nito ang ugnayang leksikal sa ‘kautusan’ at ang teolohikal na tensiyon ng pahayag, nang hindi ipinapasok kung ito ay tumutukoy lamang sa Kautusan ni Moises, batas sibil, o isang mas malawak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kautusan” sa halip na “batas” upang mapanatili ang biblikal na bigat ng νόμος nang hindi tahasang nililimitahan ang tinutukoy sa Kautusan ni Moises. Iniwasan ang “namimihasa,” sapagkat maaari itong magdagdag ng diwang pagkagumon o matinding pagkasanay na hindi tahasang nasa anyong Griyego.
