id: 1JN.3.20
reference: 1 John 3:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: tl
  text: Sapagkat kung hinahatulan tayo ng ating puso[a], ang Diyos ay higit na dakila kaysa sa ating puso[b], at alam niya ang lahat ng bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinisisi tayo” o “may nakikitang mali sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ang Diyos ay higit na dakila kaysa sa ating puso” ay maaaring tumukoy sa mas ganap niyang kaalaman sa katotohanan tungkol sa atin at, bilang pahiwatig, sa awtoridad niya sa paghatol natin sa ating sarili.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ang unang ὅτι ay nagbibigay ng paliwanag o batayan sa naunang pahayag; natural itong ipinahahayag ng “sapagkat” sa Filipino.
- source_word: ἐὰν
  choice: kung
  rationale: Kasama ng pandiwang nasa present subjunctive, naghaharap ito ng isang kondisyong maaaring mangyari.
- source_word: καταγινώσκῃ
  choice: hinahatulan
  rationale: Ipinahihiwatig ng pandiwa ang paghatol laban sa isang tao o pagkakita ng kasalanan sa kaniya. Pinananatili ng “hinahatulan” ang panloob at tila hudisyal na diwa sa konteksto.
- source_word: ἡμῶν ἡ καρδία
  choice: tayo ng ating puso
  rationale: Pinanatili ang literal na larawang “puso” bilang sentro ng panloob na buhay sa halip na paliitin agad ang kahulugan nito sa “budhi.” Inayos ang mga salita ayon sa natural na balarilang Filipino.
- source_word: ὅτι
  choice: hindi hiwalay na isinalin
  rationale: Ang ikalawang ὅτι ay nagpapakilala sa batayan o nilalaman ng katiyakan. Naipahahayag ang puwersa nito sa tuwirang pagpapatuloy ng sugnay nang hindi inuulit ang “sapagkat.”
- source_word: μείζων
  choice: higit na dakila
  rationale: Pinananatiling malawak ang paghahambing at hindi nililimitahan sa kaalaman, awtoridad, o awa lamang.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Karaniwang salin ng θεός, na may pantukoy na kailangan sa natural na Filipino.
- source_word: τῆς καρδίας ἡμῶν
  choice: kaysa sa ating puso
  rationale: Ang genitive na kasunod ng comparative ay natural na ipinahahayag sa Filipino sa pamamagitan ng “kaysa sa.”
- source_word: γινώσκει πάντα
  choice: alam niya ang lahat ng bagay
  rationale: Malinaw at likas na Filipino ito at pinananatili ang ganap na saklaw ng πάντα.
theological_decisions:
- issue: Ang kahulugan ng pagiging higit na dakila ng Diyos kaysa sa ating puso
  choice: Pinanatiling malawak ang pahayag nang hindi nililimitahan sa awa, awtoridad, o ganap na kaalaman lamang.
  alternative: Maaaring unawain na mas maawain ang Diyos kaysa sa mapanghatol nating budhi, na napapawalang-bisa ng hatol ng Diyos ang paghatol natin sa sarili, o na alam niya ang buong katotohanang hindi saklaw ng ating sariling pagtataya.
  rationale: Malawak ang pahayag ng Griyego na ang Diyos ay higit na dakila kaysa sa ating puso, saka idinaragdag na alam niya ang lahat. Mahalaga ang kaalaman sa diwa ng talata, ngunit hindi nito lubusang nililimitahan ang paghahambing.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “puso” bilang mahalagang larawan sa teksto at iniwasang ipalit ang mas interpretatibong “budhi.”
