source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: tl
  text: Hindi tulad ni Cain[a], na nagmula sa Masama at pinaslang[b] ang kanyang kapatid. At bakit niya pinaslang ang kanyang kapatid? Dahil masasama ang kanyang mga gawa, ngunit matuwid naman ang mga gawa ng kanyang kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa kasamaan.” Maaaring unawain nang abstrakto ang salitang Griyego, ngunit sa karaniwang gamit ni Juan ay tumutukoy ito sa personal na Masama.
    reason: alternative_reading
  - marker: b
    text: O “pinatay.” Ang pandiwang Griyego ay mas matingkad at literal na tumutukoy sa marahas na pagkatay o pagpaslang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Huwag tayong tumulad kay Cain
  rationale: Ipinapahayag nang natural sa Filipino ang negatibong paghahambing at ang ipinahiwatig na panawagan mula sa naunang konteksto, nang hindi binabago ang diwa.
- source_word: ἐκ τοῦ πονηροῦ
  choice: mula sa Masama
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan sa ἐκ. Ang malaking titik sa “Masama” ay nagpapahiwatig ng personal na tinutukoy, gaya ng karaniwang gamit ni Juan, habang inilalahad sa talababa ang posibleng abstraktong pagbasa.
- source_word: ἔσφαξεν
  choice: pinaslang
  rationale: Ang “pinaslang” ay mas marahas at matingkad kaysa sa pangkalahatang “pinatay,” kaya angkop sa lakas ng σφάζω at nananatiling natural sa makabagong Filipino.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ang kanyang kapatid
  rationale: Tuwiran at natural na salin na pinananatili ang mahalagang ugnayang pampamilya.
- source_word: χάριν τίνος
  choice: bakit
  rationale: Pinakanatural na katumbas sa Filipino ng tanong tungkol sa dahilan.
- source_word: ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: Dahil masasama ang kanyang mga gawa
  rationale: Malinaw na ipinapakita ng “Dahil” ang sanhi; pinananatili ng “mga gawa” ang etikal na diin ng ἔργα.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: ngunit matuwid naman ang mga gawa ng kanyang kapatid
  rationale: Ginagawang hayag sa Filipino ang eliptikong “mga gawa” upang maging malinaw, habang pinananatili ng “matuwid” ang moral na kaibahan sa masasama.
theological_decisions:
- issue: Kung personal o abstrakto ang τοῦ πονηροῦ
  choice: 'Personal: “ang Masama”'
  alternative: 'Abstrakto: “kasamaan”'
  rationale: Sa mga sulat ni Juan, ang may-artikulong πονηρός ay karaniwang tumutukoy sa personal na Masama. Gayunman, hindi lubusang isinasara ang abstraktong posibilidad, kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinaslang” upang mapanatili ang marahas na lakas ng orihinal, at ang “Masama” bilang maikli ngunit personal na katawagan nang hindi tahasang ipinapasok ang pangalang wala sa teksto.
