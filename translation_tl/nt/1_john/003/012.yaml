  to: Hindi tulad ni Cain[a], na nagmula sa Masama at pinaslang[b] ang kanyang kapatid. At bakit niya pinaslang ang kanyang kapatid? Dahil masasama ang kanyang mga gawa, ngunit matuwid naman ang mga gawa ng kanyang kapatid.
