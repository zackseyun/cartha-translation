base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: tl
  text: Ang sinumang napopoot sa kanyang kapatid[b] ay mamamatay-tao, at alam ninyo na walang mamamatay-tao ang may buhay na walang hanggan na nananatili sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namamalagi sa kanya.” Ang pandiwang Griyego na μένω ay mahalagang salita sa mga akda ni Juan at maaari ring isaling “manatili” o “mamalagi.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “kapatid” ay malamang na tumutukoy sa isang kapwa mananampalataya.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Ang bawat napopoot
  rationale: Likas sa modernong Tagalog ang pangkalahatang pormulang ito at naipahihiwatig ng pangkasalukuyang pandiwari ang patuloy o naglalarawang pagkapoot.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Pinananatili ng “kapatid” ang tuwirang salitang Griyego habang natural na hindi tinutukoy ng Tagalog ang kasarian; ayon sa konteksto, malamang na tumutukoy ito sa kapwa mananampalataya.
- source_word: ἀνθρωποκτόνος
  choice: mamamatay-tao
  rationale: Ito ang karaniwan at mariing katumbas sa Tagalog ng isang taong pumapatay ng kapwa.
- source_word: οἴδατε
  choice: alam ninyo
  rationale: Malinaw na ipinakikita ng “ninyo” ang ikalawang panauhang maramihan ng Griyego.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: walang mamamatay-tao na may
  rationale: Ito ang natural na Tagalog para sa negadong pangkalahatang pahayag at hindi nito binabago ang saklaw ng diwa.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang malinaw at nakaugaliang salin na nagpapanatili sa Johannine na konsepto.
- source_word: ἐν αὐτῷ μένουσαν
  choice: na nananatili sa kanya
  rationale: Pinananatili ng “nananatili” ang duratibong diwa at ang mahalagang Johannine na gamit ng μένω nang hindi gumagamit ng di-natural na pananalita.
theological_decisions:
- issue: Saklaw ng “kapatid”
  choice: Panatilihin ang “kapatid” sa pangunahing teksto at ipaliwanag sa talababa ang malamang na kontekstuwal na sanggunian.
  alternative: kapwa mananampalataya
  rationale: Ang konteksto ay pag-ibig sa loob ng sambayanan ng mga mananampalataya, ngunit hindi dapat ipalit sa teksto ang isang interpretatibong pagpapaliwanag.
- issue: Pagkakamit o pananatili ng buhay na walang hanggan
  choice: Iugnay ang “nananatili” sa buhay na walang hanggan, gaya ng balarila ng Griyego.
  alternative: walang buhay na walang hanggan sa kanyang kalooban
  rationale: Mahalaga ang μένω sa mga sulat ni Juan; pinananatili ng salin ang tensiyon ng pahayag tungkol sa buhay na walang hanggan na hindi nananatili sa mamamatay-tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamamatay-tao” dahil mas natural ito kaysa sa literal na “tagapatay ng tao,” at ang “kanyang” ay hindi nagtatakda ng kasarian sa Tagalog.
