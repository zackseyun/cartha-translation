  naturalness: Makabago at malinaw ang Tagalog. Mas natural at mas malapit sa anyo ng teksto ang “At dito natin nalalaman” kaysa “At sa ganito natin nalalaman,” at ang “siya'y nananatili rin sa kanya” ay sapat na malinaw sa konteksto nang hindi nagpapaliwanag nang higit sa pinagmulan.
