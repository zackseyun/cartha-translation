source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: tl
  text: 'At ang tumutupad sa kanyang mga utos ay nananatili sa kanya, at siya''y nananatili rin sa kanya. At dito natin nalalaman na nananatili siya sa atin: sa pamamagitan ng Espiritung ibinigay niya sa atin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa Espiritung ibinigay niya sa atin.” Maaaring idiin ng Griyegong pang-ukol ang pinagmulan gayundin ang paraan o batayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: tumutupad
  rationale: Ipinahahayag nito ang patuloy na pagsunod at tapat na pag-iingat sa mga utos, nang hindi nililimitahan ang diwa sa panlabas na pagsunod lamang.
- source_word: ἐντολάς
  choice: mga utos
  rationale: Ito ang natural at malinaw na katumbas sa makabagong Tagalog at pinananatili ang moral at may-awtoridad na lakas ng salita.
- source_word: μένει
  choice: nananatili
  rationale: Pinananatili ang mahalagang bokabularyong Juanino at ang diwa ng nagpapatuloy na ugnayan; ginamit nang pare-pareho sa tatlong paglitaw ng pandiwa.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: sa ganito natin nalalaman
  rationale: Natural itong nagpapakilala sa batayan o paraan ng pagkakilala habang nananatiling malapit sa anyo ng Griyego.
- source_word: ἐκ τοῦ πνεύματος
  choice: sa pamamagitan ng Espiritu
  rationale: Ipinahahayag nito ang Espiritu bilang paraan o batayan ng pagkakilala; ang ἐκ ay maaari ring magbigay-diin sa pinagmulan, kaya itinala ang alternatibo sa talababa.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: ibinigay niya sa atin
  rationale: Tapat sa payak na aorist na ἔδωκεν at natural sa Tagalog; hindi kailangang ipakita sa panghalip ang kasariang gramatikal ng πνεῦμα.
theological_decisions:
- issue: Tinutukoy ng mga panghalip na αὐτῷ / αὐτός at ng pariralang μένει ἐν ἡμῖν
  choice: Pinanatili ang mga panghalip, na sa agarang konteksto ay tumutukoy sa Diyos.
  alternative: Tahasang ulitin ang “Diyos,” o unawain ang huling pagtira bilang mas malawak na pagtukoy sa pamamalagi ni Cristo.
  rationale: Hindi inuulit ng Griyego ang pangngalang “Diyos.” Ang paggamit ng mga panghalip ay nagpapanatili sa pagkakaugnay ng teksto at hindi nilulutas nang labis ang posibleng teolohikal na pag-alingawngaw sa pamamalagi ni Cristo.
- issue: Pagkilala sa πνεῦμα
  choice: “Espiritu” na may malaking titik, bilang pagtukoy sa Banal na Espiritu.
  alternative: “espiritu” na may maliit na titik.
  rationale: Ang Espiritung ibinigay ng Diyos sa mga mananampalataya ang tinutukoy sa kontekstong Juanino; ang malaking titik ay nagpapakita ng referent nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nananatili” nang pare-pareho upang mapanatili ang paulit-ulit at mahalagang terminong Juanino. Ang “sa taong iyon” ay likas na Tagalog na paglilinaw sa ikalawang ἐν αὐτῷ nang hindi pinapalitan ng tahasang pangngalang “Diyos” ang panghalip ng Griyego.
