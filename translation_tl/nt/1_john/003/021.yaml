id: 1JN.3.21
reference: 1 John 3:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: tl
  text: Mga minamahal, kung hindi tayo hinahatulan[a] ng ating puso[b], may lakas-loob[c] tayo sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inaakusahan tayo” o “nakakakita ng mali sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “puso” rito ay tumutukoy sa panloob na pagkatao o moral na kamalayan; maihahambing ito sa diwa ng “konsensiya.”
    reason: cultural_note
  - marker: c
    text: Maaari ring “pagtitiwala” o “katiyakan sa harap ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Mga minamahal
  rationale: Isang magiliw na pantawag sa maramihan. Pinananatili nito ang tuwirang kaugnayan sa nangingibabaw na wika ng pag-ibig sa 1 Juan.
- source_word: ἐὰν
  choice: kung
  rationale: Likas na panandang Filipino para sa kondisyong ipinahahayag ng ἐὰν kasama ng subjunctive.
- source_word: καρδία
  choice: puso
  rationale: Pinananatili ang metapora ng orihinal para sa panloob na pagkatao at moral na kamalayan, sa halip na paliitin agad ang kahulugan nito sa konsensiya.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: hindi tayo hinahatulan
  rationale: Ipinahahayag ang diwang paghatol laban sa isang tao. Nananatili rin ang ugnayan nito sa naunang talata, bagaman maaari ring mangahulugang inaakusahan o pinupulaan.
- source_word: παρρησίαν
  choice: lakas-loob
  rationale: Sinasaklaw nito ang malaya, hayag, at panatag na tindig sa harap ng Diyos nang hindi ipinahihiwatig ang kawalang-galang.
- source_word: πρὸς τὸν θεόν
  choice: sa harap ng Diyos
  rationale: 'Likas sa Filipino at angkop sa relasyonal na diwa ng πρός dito: isang may-lakas-loob na kalagayan kaugnay ng Diyos at sa kaniyang presensiya.'
theological_decisions:
- issue: Ang panloob na kakayahang tinutukoy ng καρδία
  choice: puso
  alternative: konsensiya
  rationale: Ang “puso” ay nagpapanatili sa metapora at bokabularyo ng teksto. Ang “konsensiya” ay maaaring magpaliwanag sa tungkulin nito rito ngunit mas makitid at mas tuwirang interpretasyon.
- issue: Ang diwa ng παρρησίαν kaugnay ng Diyos
  choice: may lakas-loob tayo sa harap ng Diyos
  alternative: may pagtitiwala tayo sa harap ng Diyos; may katiyakan tayo sa harap ng Diyos
  rationale: Ipinahahayag ng “lakas-loob” ang malaya at hindi nahihiyang pagharap sa Diyos, habang iniiwasang gawing purong damdaming pansarili ang pahayag o burahin ang paggalang na nararapat sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Mga minamahal” upang mapanatili ang magiliw at mataas na himig, at pinanatili ang metaporang “puso” at ang bahagyang lawak ng kahulugan ng “lakas-loob.”
