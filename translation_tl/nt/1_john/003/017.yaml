  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: tl
  text: Ngunit ang sinumang may mga ari-arian sa mundong ito at nakikita ang kanyang kapatid[a] na nangangailangan, ngunit ipinagkakait niya sa kanya ang kanyang habag[b]—paano nananatili sa kanya ang pag-ibig ng Diyos?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” ay maaaring tumukoy rito sa isang kapwa mananampalataya, lalaki man o babae.
    reason: lexical_alternative
  - marker: b
    text: O, “isinasara niya ang kanyang mga kaloob-looban laban sa kanya”; literal, “isinasara niya ang kanyang mga lamang-loob mula sa kanya,” isang idyoma para sa pagkakait ng taos-pusong habag.
    reason: lexical_alternative
  - marker: c
    text: Ang “pag-ibig ng Diyos” ay maaaring mangahulugang pag-ibig ng Diyos na nasa kanya, o ang pag-ibig niya sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: mga ari-arian sa mundong ito
  rationale: Sa konteksto ng pagtugon sa pangangailangan, ang βίος ay tumutukoy sa materyal na ikabubuhay o mga pag-aari, hindi sa buhay bilang abstraktong konsepto. Likas sa modernong Tagalog ang pariralang ito.
- source_word: θεωρῇ
  choice: nakikita
  rationale: Ipinahahayag nito ang tuwirang pagkakita at pagkabatid sa kalagayan ng kapatid nang hindi nagdaragdag ng paliwanag.
- source_word: ἀδελφὸν
  choice: kapatid
  rationale: Ang salitang Tagalog na “kapatid” ay likas na katumbas ng ἀδελφός at hindi kailangang markahan para sa kasarian. Sa konteksto, maaari itong tumukoy sa kapwa mananampalataya.
- source_word: χρείαν ἔχοντα
  choice: nangangailangan
  rationale: Natural at tuwirang salin ito ng participial expression na “may pangangailangan.”
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: isinasara sa kanya ang kanyang puso
  rationale: Pinananatili nito ang larawang may sadyang pagsasara o pagkakait, habang ang “puso” ay natural na idyomang Tagalog para sa kaloob-loobang habag.
- source_word: πῶς
  choice: paano
  rationale: Pinananatili ang anyo ng retorikal na tanong nang hindi idinaragdag ang modal na “magagawa.”
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ang pag-ibig ng Diyos
  rationale: Pinananatili ng genitibong parirala ang posibleng kahulugang pag-ibig na mula sa Diyos o pag-ibig ng tao para sa Diyos.
- source_word: μένει ἐν αὐτῷ
  choice: nananatili sa kanya
  rationale: Ang “nananatili” ay malinaw at madaling maunawaang salin ng mahalagang terminong Juanino na μένω, na may diwang patuloy na pamamalagi.
theological_decisions:
- issue: Kalabuan ng genitive sa ἡ ἀγάπη τοῦ θεοῦ
  choice: pag-ibig ng Diyos
  alternative: pag-ibig ng Diyos sa kanya; pag-ibig niya sa Diyos
  rationale: Maaaring ipakahulugan ang Griyego bilang pag-ibig na mula sa Diyos at nasa tao, o bilang pag-ibig ng tao para sa Diyos. Hindi nilulutas ng pangunahing teksto ang tunay na kalabuang ito.
- issue: Saklaw ng ἀδελφὸν
  choice: kapatid
  alternative: kapatid na lalaki; kapwa mananampalataya
  rationale: Hindi likas na may markang panlalaki ang “kapatid” sa Tagalog. Tumpak itong katumbas sa ugnayang tinutukoy, habang nililinaw sa talababa ang posibleng representatibong gamit para sa kapwa mananampalataya.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mundong ito” sa halip na mas makalumang “sanlibutan,” at pinanatili ang retorikal na tanong at ang teolohikal na kalabuan ng “pag-ibig ng Diyos.”
