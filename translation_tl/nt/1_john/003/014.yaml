base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: tl
  text: Alam natin na nakatawid na tayo mula sa kamatayan tungo sa buhay, sapagkat mahal natin ang mga kapatid.[a] Ang hindi nagmamahal ay nananatili sa kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay malamang na tumutukoy rito sa mga kapwa mananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Alam natin
  rationale: Ang anyong perpekto na οἶδα ay gumaganap bilang pandiwang nagsasaad ng kasalukuyang kalagayan sa Koine; natural itong tumbasan ng “alam natin.”
- source_word: μεταβεβήκαμεν
  choice: nakatawid na tayo
  rationale: Ipinahihiwatig ng perpektong panahunan ang natapos nang paglipat na may nagpapatuloy na bunga. Pinananatili ng “nakatawid na” ang larawan ng pagdaan at ang kasalukuyang kalagayang bunga nito.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: mula sa kamatayan tungo sa buhay
  rationale: Pinananatili ng “mula… tungo sa…” ang direksiyon ng paggalaw palabas sa isang kalagayan at papasok sa isa pa nang hindi dinaragdagan ang kahulugan ng “kamatayan” at “buhay.”
- source_word: ἀγαπῶμεν
  choice: iniibig natin
  rationale: Ang kasalukuyang indikativo ay tumutukoy sa patuloy at kinagawiang pag-ibig. Ang “iniibig” ay dignified, malinaw, at akma sa bokabularyong teolohikal ng talata.
- source_word: τοὺς ἀδελφούς
  choice: ang mga kapatid
  rationale: Sa Filipino, ang “mga kapatid” ay likas na hindi nakatali sa kasarian at karaniwang tumutukoy sa mga kapwa mananampalataya; hindi kailangang magdagdag ng “lalaki at babae” sa pangunahing teksto.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Ang hindi umiibig
  rationale: Maikli at natural itong paglilipat ng articular present participle na tumutukoy sa sinumang kakikitaan ng kawalan ng pag-ibig bilang patuloy na katangian.
- source_word: μένει
  choice: nananatili
  rationale: Pinananatili nito ang mahalagang Johannine na diwa ng patuloy na pananatili habang mas natural sa modernong Tagalog kaysa sa mas makalumang mga katumbas.
- source_word: ἐν τῷ θανάτῳ
  choice: sa kamatayan
  rationale: Tapat at maikli itong salin ng metaporikal na pananatili sa saklaw ng kamatayan, nang hindi ipinapasok sa teksto ang paliwanag na “espirituwal” o “nasasakupan.”
theological_decisions:
- issue: Saklaw at kasarian ng τοὺς ἀδελφούς
  choice: Isinalin bilang “ang mga kapatid,” na sa Filipino ay natural na maaaring sumaklaw sa kapwa lalaki at babae sa pamayanan ng mga mananampalataya.
  alternative: ang mga kapatid na lalaki; ang mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, ang gamit nito sa konteksto ay malamang na tumutukoy sa mga kapwa mananampalataya sa pangkalahatan. Hindi tulad ng English na “brothers,” ang Filipino na “mga kapatid” ay likas na walang tiyak na kasarian, kaya kapwa nito napapanatili ang literal na ugnayang pampamilya at ang malamang na inklusibong saklaw. Nililinaw ito sa talababa.
- issue: Kalikasan ng “kamatayan” at “buhay”
  choice: Pinanatili ang payak at masinsing mga salitang “kamatayan” at “buhay.”
  alternative: espirituwal na kamatayan at buhay na walang hanggan; nasasakupan ng kamatayan at nasasakupan ng buhay
  rationale: Nagsasaad ang talata ng malalim na teolohikal na paglipat ngunit hindi nito tahasang nilalagyan ng mga panuring ang dalawang kalagayan. Ang hindi pagpapalawak sa mga termino ay nagpapanatili sa talinghaga at sa saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakatawid na” upang buhayin ang metapora ng μεταβαίνω at ang “iniibig/umiibig” upang mapanatili ang dignified na rehistro. Ang talababa ay may katugmang marker na [a] sa pangunahing teksto.
