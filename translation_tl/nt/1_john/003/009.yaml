base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: tl
  text: Ang bawat taong ipinanganak mula sa Diyos ay hindi namumuhay sa kasalanan[a], sapagkat ang binhi ng Diyos ay nananatili sa kanya[b]; at hindi siya maaaring patuloy na magkasala[c], sapagkat ipinanganak siya mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas pormal, “hindi gumagawa ng kasalanan” o “hindi nagkakasala.” Malamang na tumutukoy ang pananalita sa patuloy o kinagawiang pamumuhay sa kasalanan, hindi lamang sa isang gawa.
    reason: lexical_alternative
  - marker: b
    text: O “nananahan sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “hindi siya maaaring magkasala.” Sa konteksto, malamang na ang Griyegong infinitive na nasa kasalukuyang anyo ay may diwang “patuloy na magkasala.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Ang bawat ipinanganak
  rationale: Ipinahahayag ng πᾶς kasama ng substantival perfect participle ang isang pangkalahatang uri at ang kalagayang bunga ng kapanganakan. Likas sa Tagalog ang “ang bawat ipinanganak” at pinananatili nito ang saklaw na pangkalahatan.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Ang ἐκ kasama ng γεννάω ay tumutukoy sa pinagmulan. Mas tuwiran at natural sa makabagong Tagalog ang “mula sa Diyos.”
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: hindi namumuhay sa kasalanan
  rationale: Ang literal na “hindi gumagawa ng kasalanan” ay maaaring unawaing tumutukoy sa kahit isang gawa lamang at hindi gaanong natural. Sa konteksto, ipinahihiwatig ng present tense at ng kasunod na ἁμαρτάνειν ang nagpapatuloy o kinagawiang pamumuhay sa kasalanan.
- source_word: σπέρμα αὐτοῦ
  choice: ang binhi ng Diyos
  rationale: Pinananatili ang kongkretong metapora ng σπέρμα nang hindi ipinapakahulugan bilang salita, buhay, o kalikasan ng Diyos. Inulit ang “Diyos” sa halip na gumamit ng “kanyang” upang maiwasan ang malabong reperensiya sa Tagalog.
- source_word: ἐν αὐτῷ μένει
  choice: nananatili sa kanya
  rationale: Malinaw at kasalukuyang Tagalog ang “nananatili,” at pinananatili nito ang patuloy na diwa ng mahalagang pandiwang Johannine na μένω.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: hindi siya maaaring magpatuloy sa pagkakasala
  rationale: Ang present infinitive na ἁμαρτάνειν ay malamang na nagpapahiwatig ng patuloy na pagkakasala sa kontekstong ito. Pinananatili sa talababa ang mas literal na pagbasa.
- source_word: γεγέννηται
  choice: ipinanganak siya
  rationale: Sa Tagalog, likas na naihahayag ng aspektong perpektibo ng “ipinanganak” ang natapos na pangyayaring may nananatiling bunga; hindi kailangan ang di-likas na pagtulad sa English perfect.
theological_decisions:
- issue: Kung itinuturo ng talata ang ganap na kawalan ng anumang pagkakasala o ang di-pagkakatugma ng bagong kapanganakan at nagpapatuloy na pamumuhay sa kasalanan
  choice: Inilalarawan ng pangunahing teksto ang hindi pagpapatuloy o pamumuhay sa kasalanan.
  alternative: “Hindi gumagawa ng kasalanan” at “hindi maaaring magkasala,” na maaaring unawaing ganap na kawalan ng kakayahang gumawa ng kahit isang kasalanan.
  rationale: Sinusuportahan ng mga present form na ποιεῖ at ἁμαρτάνειν, kasama ng konteksto ng 1 Juan 1:8–2:1, ang patuloy o kinagawiang diwa. Gayunman, inilalahad sa mga talababa ang mas pormal na anyo upang hindi maitago ang lakas at tensiyon ng Griyego.
- issue: Ang kahulugan ng “binhi ng Diyos”
  choice: Pinanatili ang metaporang “binhi” nang walang tiyak na interpretasyon.
  alternative: Salita ng Diyos, buhay ng Diyos, o kalikasan ng Diyos.
  rationale: Hindi tinutukoy mismo ng teksto kung ano ang eksaktong tinutukoy ng σπέρμα, kaya hindi dapat magpasok ang salin ng isang pinagtatalunang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namumuhay sa kasalanan” upang likas na ipahayag ang malamang na patuloy o kinagawiang diwa, habang inilagay sa talababa ang mas literal na anyo. Iniwasan ang teknikal o denominasyonal na pagpapakahulugan sa “binhi.”
