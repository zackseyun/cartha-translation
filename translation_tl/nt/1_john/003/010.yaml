  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: tl
  text: 'Sa pamamagitan nito ay nahahayag ang mga anak ng Diyos at ang mga anak ng diyablo: ang sinumang hindi namumuhay nang matuwid[a] ay hindi mula sa Diyos, at hindi rin mula sa Diyos ang hindi umiibig sa kanyang kapatid.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi gumagawa ng katuwiran” o “hindi nagsasagawa ng katarungan.” Ang salitang Griyego ay maaaring tumukoy sa katuwiran o katarungan; dito, pangunahing tinutukoy nito ang matuwid na pamumuhay.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanyang kapatid sa pananampalataya.” Ang salitang Griyego ay nasa anyong panlalaking isahan, ngunit ang Tagalog na “kapatid” ay maaaring tumukoy sa lalaki o babae.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Sa ganitong paraan
  rationale: Ipinahihiwatig ng parirala ang paraan o batayan kung paano nakikilala ang pagkakaiba; natural ito sa modernong Tagalog nang hindi nililimitahan sa 'dito' o 'mula rito.'
- source_word: φανερά ἐστιν
  choice: nakikilala
  rationale: Sa konteksto, ang pagiging hayag ng dalawang pangkat ay tumutukoy sa kanilang pagkakakilanlan sa pamamagitan ng mga palatandaang kasunod; malinaw at natural ang 'nakikilala.'
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: ang mga anak ng Diyos at ang mga anak ng diyablo
  rationale: Pinananatili ang tahasang pampamilyang larawan at ang matinding paghahambing sa Griyego.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: ang sinumang hindi namumuhay nang matuwid
  rationale: Ang kasalukuyang participle ay naglalarawan ng namamayaning gawi o paraan ng pamumuhay, hindi lamang ng isang kilos. Ang 'namumuhay nang matuwid' ay natural na nagpapahayag nito sa Tagalog.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: ay hindi mula sa Diyos
  rationale: Pinananatili nito ang diwa ng pinagmulan o pag-aari na ipinahahayag ng ἐκ nang hindi nagdaragdag ng sistematikong paliwanag.
- source_word: καὶ ὁ μὴ ἀγαπῶν
  choice: gayundin ang hindi umiibig
  rationale: 'Ginagawang malinaw sa natural na Tagalog ang elipsis: ang ikalawang taong inilalarawan ay hindi rin mula sa Diyos.'
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Ang 'kapatid' sa Tagalog ay likas na hindi tumutukoy sa kasarian, ngunit tapat pa rin sa relasyonal na katawagang ἀδελφός; ipinapaliwanag sa talababa ang posibleng kahulugang kapwa mananampalataya.
theological_decisions:
- issue: Pampamilyang wika para sa espirituwal at moral na pagkakakilanlan
  choice: mga anak ng Diyos at mga anak ng diyablo
  alternative: mga taong kabilang sa Diyos at mga taong kabilang sa diyablo
  rationale: Tahasang gumagamit ang teksto ng τέκνα, kaya pinananatili ang larawan ng pagiging anak at hindi ito pinapahina bilang pangkalahatang pag-aari lamang.
- issue: Saklaw ng ἀδελφός
  choice: kanyang kapatid
  alternative: kanyang kapatid sa pananampalataya
  rationale: Pinananatili sa pangunahing teksto ang literal at natural na 'kapatid,' habang inilalagay sa talababa ang malamang na kontekstuwal na pagtukoy sa kapwa mananampalataya.
- issue: Katangian ng ποιῶν δικαιοσύνην
  choice: namumuhay nang matuwid
  alternative: gumagawa ng katuwiran
  rationale: Ipinapakita ng present participle ang katangiang gawi. Iniiwasan ng salin ang pagpapakahulugang walang pagkukulang habang pinananatili ang etikal na bigat ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Ginamit ang 'diyablo' bilang nakaugaliang personal na katawagan. Pinanatili ang maikli at mariing paghahambing ng Griyego, habang ginawang natural ang elipsis sa pamamagitan ng 'gayundin.'
