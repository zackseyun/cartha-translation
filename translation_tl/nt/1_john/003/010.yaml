  naturalness: Natural ang karamihan ng bokabularyo, lalo na ang “namumuhay nang matuwid” at “kanyang kapatid.” Mas malinaw at mas likas ang buong paralelong sugnay na “at hindi rin mula sa Diyos ang …” kaysa sa “gayundin ang …,” na maaaring iwanang bitin o malabo ang tinutukoy na paghahambing.
