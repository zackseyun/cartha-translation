base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: tl
  text: Alam ko kung paano mamuhay sa abang kalagayan, at alam ko rin kung paano managana. Sa bawat kalagayan at sa lahat ng bagay, natutuhan ko ang lihim[a]—ang mabusog at magutom, ang managana at kapusin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “pinasimulan ako.” Ginagamit ni Pablo bilang talinghaga ang salitang tumutukoy sa pagpapasok sa isang lihim na kaalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Alam ko kung paano
  rationale: Kasama ng mga pawatas na sumusunod, ipinahihiwatig nito ang praktikal na kaalamang nahubog sa karanasan, hindi lamang kaalamang nasa isip.
- source_word: ταπεινοῦσθαι
  choice: mamuhay sa abang kalagayan
  rationale: Ipinapanatili nito ang diwang mapasa-mababang kalagayan nang hindi ipinakahulugang kusang pagpapakumbaba lamang.
- source_word: περισσεύειν
  choice: managana
  rationale: Likas at malawak itong salin para sa pagkakaroon nang higit sa sapat at pinananatili ang pag-uulit ng pandiwa sa talata.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: Sa bawat kalagayan at sa lahat ng bagay
  rationale: Pinananatili ang dalawang magkaugnay ngunit bukod na pahayag ng Griyego habang malinaw at natural sa Tagalog.
- source_word: μεμύημαι
  choice: natutuhan ko ang lihim
  rationale: Inihahatid nito ang metaporikal na diwa ng pagkakatuto sa paraang nauunawaan ng modernong mambabasa; ipinaliliwanag sa talababa ang literal na larawang may kinalaman sa pagpapasimula.
- source_word: χορτάζεσθαι
  choice: mabusog
  rationale: Malinaw nitong pinananatili ang ugnay sa pagkain at ang tuwirang pagsalungat sa magutom.
- source_word: πεινᾶν
  choice: magutom
  rationale: Ito ang payak at natural na katapat ng mabusog.
- source_word: ὑστερεῖσθαι
  choice: kapusin
  rationale: Malinaw nitong ipinahahayag ang kakulangan nang hindi nililimitahan sa salapi lamang.
