translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “abang kalagayan” upang tumukoy sa kalagayan sa buhay, hindi upang ipakahulugan lamang na saloobin ng pagpapakumbaba. Pinanatili ang magkatapat na pares at ang retorikal na lawak ng talata.
