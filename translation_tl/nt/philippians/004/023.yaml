base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: tl
  text: Nawa’y mapasainyo—sa inyong espiritu—ang biyaya ng Panginoong Jesu-Cristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang katumbas sa makabagong Filipino para sa χάρις sa mga pagbabasbas ni Pablo; pinananatili nito ang diwa ng kusang-loob na kagandahang-loob at pabor ng Diyos.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas at kinikilalang salin ng titulong κύριος para kay Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa pormulang “Panginoong Jesu-Cristo,” malapit nang gumana ang Χριστός bilang bahagi ng nakaugaliang pantanging katawagan. Ang “Jesu-Cristo” ay natural, marangal, at malinaw sa karaniwang mambabasang Filipino, habang taglay pa rin ng “Cristo” ang mesiyanikong titulo.
- source_word: μετὰ
  choice: mapasainyo
  rationale: Ipinahahayag ng “mapasainyo” ang presensiya o pakikisama na tinutukoy ng μετά kasabay ng panalanging “nawa.”
- source_word: τοῦ πνεύματος
  choice: espiritu
  rationale: Maliit ang titik sapagkat ang pinakamalamang na tinutukoy ay ang panloob na espiritu ng mga kausap, hindi tahasang ang Espiritu Santo. Pinananatili ang pang-isahang anyo at ang posibleng kolektibong diwa.
- source_word: ὑμῶν
  choice: inyong
  rationale: Ang “inyong” ay malinaw na pangmaramihang panghalip na paari at tumpak na kumakatawan sa ὑμῶν.
theological_decisions:
- issue: Kung isasalin ang Χριστοῦ bilang “Mesiyas” o panatilihin bilang “Cristo”
  choice: Cristo
  alternative: Mesiyas
  rationale: Bagaman titulo ang pinagmulan ng Χριστός, sa nakapirming pormulang Παῦλος na “Panginoong Jesu-Cristo” ay malakas din ang gamit nitong halos bahagi ng pangalan. Ang “Cristo” ang pinakanatural sa Filipino at hindi nito inaalis ang kahulugang “Mesiyas.”
- issue: Kung ang πνεύματος ay espiritu ng tao o ang Espiritu Santo
  choice: espiritu ng mga mananampalataya
  alternative: Espiritu Santo
  rationale: Ang panghalip na ὑμῶν (“inyong”) at ang karaniwang anyo ng pagbabasbas ni Pablo ay higit na umaayon sa espiritu o panloob na buhay ng mga kausap. Hindi ginawang malaking titik upang hindi ipilit ang alternatibong pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Inuna ang panalanging “Nawa’y” upang maging natural ang pagbabasbas, at ginamit ang “mapasainyong espiritu” upang mapanatili ang tiyak na pariralang Griyego nang hindi nagiging mabigat o paulit-ulit.
