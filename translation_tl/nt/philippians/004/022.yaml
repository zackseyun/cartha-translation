base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: tl
  text: Binabati kayo ng lahat ng banal, lalo na ng mga kabilang sa sambahayan ni Cesar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sambahayan ni Cesar” ay tumutukoy sa mga taong kaugnay o kabilang sa sambahayan ng emperador, hindi lamang sa mga miyembro ng kaniyang pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: Binabati
  rationale: Karaniwang pandiwa ito sa mga pagbati sa liham. Likas sa modernong Tagalog ang “binabati” at pinananatili nito ang tuwirang diwa ng pagbati.
- source_word: πάντες οἱ ἅγιοι
  choice: lahat ng mga banal
  rationale: Karaniwang tawag ni Pablo ang ἅγιοι sa mga mananampalataya. Pinananatili ng “mga banal” ang mahalagang leksikal at teolohikal na katawagan nang hindi ito pinapakahulugang isang natatanging uri lamang ng mga Kristiyano.
- source_word: μάλιστα δὲ
  choice: lalo na
  rationale: Ipinakikita ng parirala ang natatanging pagbanggit sa isang pangkat na kabilang sa mas malaking pangkat; malinaw at natural dito ang “lalo na.”
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: mga kabilang sa sambahayan ni Cesar
  rationale: Ipinahihiwatig ng ἐκ τῆς ... οἰκίας ang mga taong kaugnay o kabilang sa sambahayan ng pinuno. Hindi ipinapalagay ng salin na sila ay mga kadugo ni Cesar.
- source_word: Καίσαρος
  choice: Cesar
  rationale: Pinananatili ang makasaysayang titulo/pangalan sa Griyego sa halip na palitan ito ng mas interpretatibong “emperador.”
theological_decisions:
- issue: Kahulugan ng “mga banal” sa gamit ni Pablo
  choice: Pinanatili ang katawagang “mga banal” bilang tawag sa mga mananampalataya.
  alternative: “mga hinirang ng Diyos” o “mga mananampalataya”
  rationale: Hindi tumutukoy ang salita rito sa isang piling uri ng mga Kristiyanong bukod-tanging banal. Gayunman, pinananatili ang mismong katawagan ni Pablo upang hindi palitan ng paliwanag ang teolohikal na wika ng teksto.
- issue: Saklaw ng “sambahayan ni Cesar”
  choice: Mga taong kabilang o kaugnay sa sambahayan ng emperador, nang hindi nililimitahan sa kaniyang pamilya.
  alternative: Mga kapamilya ni Cesar lamang
  rationale: Maaaring saklawin ng οἰκία ang mas malawak na imperyal na sambahayan, gaya ng mga alipin, pinalayang alipin, at iba pang tauhan; hindi nilulutas ng teksto ang tiyak nilang katayuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sambahayan” upang mapanatili ang mas malawak na kahulugan ng οἰκία kaysa sa “pamilya,” at pinanatili ang “Cesar” bilang makasaysayang titulong-pangalan.
