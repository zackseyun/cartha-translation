  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: tl
  text: Hindi dahil hinahangad ko ang kaloob, kundi hinahangad ko ang bungang nadaragdagan sa inyong kuwenta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “ang bungang saganang nadaragdag sa inyong kredito.”'
    reason: Ipinakikita ang posibleng mas idyomatikong pagsasalin ng πλεονάζοντα εἰς λόγον ὑμῶν habang pinananatili ang metaporang pangkuwenta o kredito.
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: hinahangad ko
  rationale: Ipinahihiwatig ng pandiwa ang masidhing paghahangad o aktibong pagnanais. Inulit ito upang mapanatili ang diin at paghahambing sa Griyego.
- source_word: δόμα
  choice: ang kaloob
  rationale: Tuwirang tumutukoy ito sa ibinigay ng mga taga-Filipos. Ang “kaloob” ay likas at marangal na salin nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: καρπὸν
  choice: ang bunga
  rationale: Pinananatili ng “bunga” ang talinghaga ng resulta o pakinabang at ang pag-igting nito sa kasunod na wikang pangkuwenta.
- source_word: πλεονάζοντα
  choice: dumarami
  rationale: Ipinahahayag ng kasalukuyang participle ang patuloy na paglago o pagdami ng bunga.
- source_word: εἰς λόγον ὑμῶν
  choice: sa inyong kuwenta
  rationale: Sa konteksto ng Filipos 4:15–17, ang λόγος ay may diwang pangkalakalan o pagtatala. Pinananatili ng “sa inyong kuwenta” ang larawang may naidaragdag o naitatala para sa kanila.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Hindi sa ...; sa halip, ...
  rationale: Likas itong paraan sa modernong Filipino upang ipahayag ang paglilinaw at matinding pagtatambis ng Griyego.
theological_decisions:
- issue: Ugnayan ng talinghagang “bunga” at wikang pangkuwenta
  choice: Pinanatili ang “bungang dumarami sa inyong kuwenta.”
  alternative: “Pakinabang na lalong dumarami para sa inyo.”
  rationale: Hindi nililinaw nang higit sa teksto kung ang bunga ay gantimpala, espirituwal na pakinabang, o ibang uri ng pagkilala. Pinananatili ng salin ang sadyang pagsasanib ni Pablo ng talinghagang agrikultural at pangkuwenta.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kuwenta” sa diwang talaang pangkuwenta, hindi sa karaniwang diwang pagkalkula; ipinapaliwanag ng talababa ang kahulugang pakinabang o kredito.
