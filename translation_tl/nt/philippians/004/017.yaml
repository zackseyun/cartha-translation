    rationale: Ang εἰς λόγον ὑμῶν ay gumagamit ng wika ng account o credit, hindi lamang pangkalahatang pakinabang. Maaaring magbigay ng alternatibong “sa inyong kredito” nang hindi inaalis ang metapora.
