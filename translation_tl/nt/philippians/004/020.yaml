  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: tl
  text: Sa ating Diyos at Ama ang kaluwalhatian magpakailanman[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga kapanahunan ng mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa pangwakas na doxolohiya; sa Filipino, natural at malinaw ang pangungusap kahit walang idinagdag na “ngayon,” “at,” o “ngunit,” na maaaring magpahiwatig ng di-kailangang temporal o pasalungat na diwa.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: ating Diyos at Ama
  rationale: Pinananatili itong iisang ekspresyong tumutukoy sa isang persona, at likas na kapuwa inilalarawan ng “ating” ang “Diyos” at “Ama.”
- source_word: ἡ δόξα
  choice: ang kaluwalhatian
  rationale: Ang Griyego ay walang tahasang pandiwa. Ang hulma na “Sa … ang kaluwalhatian” ay natural na doxolohiya sa Filipino at hindi kailangang magdagdag ng lantad na pandiwa.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Likas at marangal na katumbas ito ng idyomang tumutukoy sa walang katapusang panahon; nilalagyan ng talababa ang mas literal na anyo.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinaugaliang transliterasyon dahil isa itong nakapirming pahayag ng pagsang-ayon sa gamit Kristiyano.
theological_decisions:
- issue: Ipinahihiwatig na ugnayan sa doxolohiyang walang pandiwa
  choice: Sa ating Diyos at Ama ang kaluwalhatian
  alternative: Sumaatin nawa ang kaluwalhatian ng ating Diyos at Ama / Ang kaluwalhatian ay sa ating Diyos at Ama
  rationale: Walang pandiwa ang Griyego, kaya pinananatili ng hulmang Filipino ang doxolohikal na bisa nang hindi tiyak na nagpapasya sa pagitan ng “sumakaniya nawa,” “ay sumakaniya,” at “nauukol sa kaniya.”
translation_notes:
  register: Modernong Filipino na maikli, marangal, at angkop sa doxolohiya. Ginamit ang “ating” sa halip na mas kolokyal na “natin,” at iniwasan ang di-kailangang pang-ugnay sa simula.
