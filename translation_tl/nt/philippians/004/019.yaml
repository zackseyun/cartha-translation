  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: tl
  text: At tutugunan ng aking Diyos ang bawat pangangailangan ninyo ayon sa kanyang kayamanan sa kaluwalhatian, sa Mesiyas na si Jesus[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “kay Cristo Jesus.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon sa kanyang kayamanan” ay nagsasaad ng sukat o pamantayan ng paglalaan ng Diyos, hindi lamang na nagmumula ito sa kanyang kayamanan.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin ang “sa kaluwalhatian” bilang “sa maluwalhating paraan.”
    reason: alternative_reading
  - marker: d
    text: 'O, nang walang paghihiwalay sa dalawang parirala: “sa kaluwalhatian sa Mesiyas na si Jesus.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: At tutugunan ng aking Diyos
  rationale: Ang δέ ay banayad na pang-ugnay sa daloy ng sinabi ni Pablo, kaya likas ang “At.” Pinananatili ng “aking Diyos” ang personal na diin ng μου.
- source_word: πληρώσει
  choice: tutugunan
  rationale: Sa kontekstong ito, ang πληρόω ay tumutukoy sa paglalaan ng anumang kulang. Ang “tutugunan” ay likas na katambal ng “pangangailangan” sa modernong Tagalog at hindi nagpapahiwatig na basta lamang ‘pupunuin’ ang isang bagay.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: ang bawat pangangailangan ninyo
  rationale: Ipinahahayag ng “bawat” ang distributibong puwersa ng πᾶσαν, at ang “pangangailangan” ay karaniwang katumbas ng χρεία bilang kailangan o kinakailangan.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: ayon sa kanyang kayamanan
  rationale: Ang κατά na may accusative ay nagpapahiwatig ng pamantayan o sukat. Kaya ang paglalaan ay kaayon ng kayamanan ng Diyos, hindi lamang nagmumula rito.
- source_word: ἐν δόξῃ
  choice: sa kaluwalhatian
  rationale: Pinananatili ang anyong pariralang pang-ukol dahil hindi ganap na tinutukoy ng Griyego kung ito ay saklaw, paraan, o kaugnay na kalagayan ng paglalaan.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ang Χριστός ay titulong nangangahulugang “Mesiyas.” Ang anyong “Mesiyas na si Jesus” ay malinaw at natural sa Tagalog habang pinananatili ang titulong kristolohikal.
theological_decisions:
- issue: Pagsasalin sa Χριστός sa pariralang ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  alternative: kay Cristo Jesus
  rationale: Ginamit sa pangunahing teksto ang kahulugan ng titulo sa halip na transliterasyon. Inilagay sa talababa ang tradisyonal na anyo upang mapanatili ang pamilyar na alternatibo nang hindi ginagawang pangalang pantangi lamang ang titulo.
- issue: Ugnayan ng ἐν δόξῃ at ἐν Χριστῷ Ἰησοῦ sa pangungusap
  choice: sa kaluwalhatian, sa Mesiyas na si Jesus
  alternative: sa kaluwalhatian sa Mesiyas na si Jesus
  rationale: Tinutulungan ng kuwit ang pagbasa sa dalawang magkasunod na pariralang may ἐν nang hindi ganap na nilulutas ang saklaw ng mga ito. Ang mas tuloy-tuloy na pagbasa ay inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “tutugunan … pangangailangan” bilang natural na kolokasyon, habang pinanatili ang bahagyang sintaktikong kalabuan ng dalawang pariralang ἐν sa pangunahing teksto at mga talababa.
