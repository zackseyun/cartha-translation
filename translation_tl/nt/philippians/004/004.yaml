lexical_decisions:
- source_word: Χαίρετε
  choice: Magalak kayo
  rationale: Ang pangkasalukuyang aktibong pautos na nasa ikalawang panauhang maramihan ay likas na naipapahayag sa modernong Filipino bilang “Magalak kayo,” habang pinananatili ang lakas ng pag-uutos at ang diwang paulit-ulit na kagalakan.
- source_word: ἐν
  choice: sa
  rationale: Sa pariralang “sa Panginoon,” likas na naipahihiwatig ng “sa” ang kalagayan o ugnayan—ang kagalakang nakaugnay sa Panginoon—nang hindi ito nililimitahan sa kahulugang sanhi o paraan lamang.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ang “Panginoon” ang kinikilalang marangal at malinaw na katumbas ng κύριος, na sa kontekstong ito ay tumutukoy kay Cristo.
- source_word: πάντοτε
  choice: palagi
  rationale: Ang “palagi” ay natural sa kasalukuyang Filipino at malinaw na naghahatid ng tuloy-tuloy o walang-tanging-panahong saklaw ng pang-abay.
- source_word: πάλιν
  choice: Muli
  rationale: Ipinakikita ng “Muli” na inuulit ni Pablo ang utos para sa diin.
- source_word: ἐρῶ
  choice: kong sasabihin
  rationale: Pinananatili ng “sasabihin” ang anyong panghinaharap ng Griyegong ἐρῶ sa halip na gawing pangkasalukuyan.
- source_word: χαίρετε
  choice: magalak kayo
  rationale: Pareho ang salin sa dalawang paglitaw upang mapanatili ang tahasang pag-uulit at retorikal na diin.
theological_decisions:
- issue: Kahulugan ng ἐν κυρίῳ (“sa Panginoon”)
  choice: 'Pinanatili ang malawak na diwa ng kalagayan o ugnayan: ang mga mananampalataya ay magalak sa kanilang kaugnayan at pakikiisa sa Panginoon.'
  alternative: Maaaring unawain bilang “dahil sa Panginoon” o “sa pamamagitan ng kapangyarihan ng Panginoon.”
  rationale: Karaniwang ipinahihiwatig ng ἐν κυρίῳ kay Pablo ang larangan o ugnayang kinaroroonan. Hindi nilulutas nang makitid ng “sa Panginoon” ang posibleng teolohikal na lawak ng parirala.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “magalak” sa halip na mas kolokyal na “matuwa” upang panatilihin ang bigat ng apostolikong tagubilin; pinanatili rin ang panghinaharap na “sasabihin” at ang emphatic na pag-uulit.
