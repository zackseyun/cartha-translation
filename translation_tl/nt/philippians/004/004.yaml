  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: tl
  text: 'Magalak kayo sa Panginoon palagi[a]. Muli kong sasabihin[b]: magalak kayo!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Matuwa kayo sa Panginoon palagi.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “muli kong sasabihin: magalak kayo.”'
