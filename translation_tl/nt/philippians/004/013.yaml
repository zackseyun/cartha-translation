translation:
  language: tl
  text: Kaya ko ang lahat ng bagay sa pamamagitan ng nagpapalakas sa akin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “May kakayahan ako sa lahat ng bagay.” Sa konteksto, ang diwa ay kakayahang harapin ang bawat uri ng kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Ang sabi sa Griyego ay “ang nagpapalakas sa akin” at hindi tahasang pinangalanan si Cristo sa talatang ito, bagaman malakas na ipinahihiwatig ng konteksto na siya ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili nito ang malawak na saklaw ng salitang Griyego. Sa konteksto, tumutukoy ito sa sari-saring kalagayang nabanggit ni Pablo, ngunit hindi nililimitahan ng mismong parirala ang kahulugan sa isang tiyak na talaan ng mga kalagayan.
- source_word: ἰσχύω
  choice: Kaya ko
  rationale: Ipinapahayag ng pandiwa ang pagkakaroon ng lakas o kakayahan. Likas sa makabagong Tagalog ang “Kaya ko,” at hindi na kailangang idagdag ang “gawin,” na wala namang tahasang katumbas sa Griyego.
- source_word: ἐν
  choice: sa pamamagitan ng
  rationale: Bagaman ang karaniwang literal na kahulugan ay “sa,” ipinapakita rito ng parirala ang paraan o pinagmumulan ng kakayahan; malinaw at natural itong naipahahayag ng “sa pamamagitan ng.”
- source_word: τῷ ἐνδυναμοῦντί με
  choice: ng nagpapalakas sa akin
  rationale: Ginagawang pangngalang parirala ang articular participle at pinananatili ang patuloy na diwa ng pagpapalakas. Hindi nito idinaragdag sa talata ang pangalang “Cristo,” na wala sa tekstong Griyego.
theological_decisions:
- issue: Ang tinutukoy ng “nagpapalakas sa akin”
  choice: Hindi tahasang pangalanan si Cristo sa pangunahing teksto.
  alternative: sa pamamagitan ni Cristo na nagpapalakas sa akin
  rationale: Malinaw na itinuturo ng malapit at mas malawak na konteksto si Cristo bilang tinutukoy, ngunit hindi siya tahasang pinangalanan sa tekstong Griyego ng talatang ito. Pinananatili ng salin ang pagkakaibang iyon.
- issue: Saklaw ng “lahat ng bagay”
  choice: Panatilihin ang malawak na pananalita sa pangunahing teksto at ipaliwanag ang konteksto sa talababa.
  alternative: Kaya kong harapin ang bawat kalagayan
  rationale: Ang konteksto ay tungkol sa kasiyahan at pagtitiis sa kasaganaan o kakulangan, ngunit mas malawak ang πάντα kaysa sa tahasang “bawat kalagayan.” Iniiwasan ng pangunahing teksto ang pagsasara sa tunay na lawak ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “Kaya ko” ay karaniwang pananalita ngunit hindi impormal; ang “sa pamamagitan ng” ay nagpapanatili ng maingat at angkop na rehistro para sa Kasulatan.
