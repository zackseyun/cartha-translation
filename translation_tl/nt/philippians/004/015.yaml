  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “iglesia” bilang karaniwang terminong biblikal para sa lokal na kapulungan. Inilagay ang panandang [a] sa pariralang tinutukoy mismo ng talababa.
