  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: tl
  text: Alam din naman ninyo, mga taga-Filipos, na noong pasimula ng ebanghelyo, nang umalis ako mula sa Macedonia, walang iglesiang nakibahagi sa akin sa usapin ng pagbibigay at pagtanggap[a] maliban sa inyo lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa talaan ng pagbibigay at pagtanggap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: At alam din ninyo mismo
  rationale: Ginamit ang kasalukuyang statibong “alam,” at pinanatili ng “din” at “ninyo mismo” ang dagdag at diin ng καὶ ὑμεῖς; ang δὲ ay banayad na pang-ugnay dito.
- source_word: Φιλιππήσιοι
  choice: mga taga-Filipos
  rationale: Natural na modernong Tagalog na pantawag sa mga naninirahan sa Filipos, at malinaw ang anyong bokatibo.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: noong pasimula ng ebanghelyo
  rationale: Malapit sa anyo ng Griyego at hindi tahasang nililimitahan ang parirala sa unang pangangaral, unang pagtanggap, o isang tiyak na yugto ng gawain ni Pablo.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: nang umalis ako sa Macedonia
  rationale: Direkta at natural na paglalarawan sa minsanang pag-alis ni Pablo mula sa Macedonia.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: walang iglesiang nakibahagi sa akin
  rationale: Ipinahahayag ng “nakibahagi” ang aktuwal na pakikipagtulungan o pakikibahagi sa suporta nang hindi ito nililimitahan sa komersiyal na transaksiyon.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: sa usapin ng pagbibigay at pagtanggap
  rationale: Nauunawaan sa pangkaraniwang Tagalog at pinananatili ang magkatugmang mga ideya ng pagbibigay at pagtanggap; inilagay sa talababa ang posibleng wikang pangkuwenta.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: maliban sa inyo lamang
  rationale: Pinananatili ang mariing pagiging bukod-tangi ng mga taga-Filipos.
