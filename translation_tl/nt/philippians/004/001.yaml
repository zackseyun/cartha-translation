  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: tl
  text: Kaya nga, mga minamahal at pinananabikan kong kapatid[a]—kayo ang aking kagalakan at korona[b]—manatili kayong matatag sa Panginoon sa ganitong paraan, mga minamahal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaki ang anyo ng salitang Griyego, ngunit sa kontekstong ito ay kinakausap ni Pablo ang mga kapwa mananampalataya sa kongregasyon, hindi lamang ang mga lalaki.
    reason: cultural_note
  - marker: b
    text: Maaari ring “putong ng nagwagi”; tumutukoy ang salitang Griyego sa putong na iginagawad bilang gantimpala sa isang nagwagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya nga
  rationale: Likas na panandang Filipino para sa kongklusyong hinango sa naunang pangangatwiran.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang natural at karaniwang katawagan sa Filipino para sa mga kapwa mananampalataya; hindi nito nilalagyan ng kasariang wala sa salitang Filipino, habang nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: ἀγαπητοὶ
  choice: mga minamahal
  rationale: Pinananatili ang mapagmahal na tono at ang pag-uulit ng salita sa simula at wakas ng talata.
- source_word: ἐπιπόθητοι
  choice: pinananabikan
  rationale: Ipinahahayag ang matinding pananabik ni Pablo na makita o makasama sila, sa natural na modernong Filipino.
- source_word: χαρὰ
  choice: kagalakan
  rationale: Tuwirang ipinapahayag na ang mga taga-Filipos mismo ang kagalakan ni Pablo.
- source_word: στέφανος
  choice: korona
  rationale: Ito ang malinaw at pamilyar na katumbas sa Filipino; nililinaw sa talababa na ang larawan ay putong na gantimpala sa nagwagi, hindi pangunahing koronang maharlika.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Pinananatili ang tahasang pang-abay at ang malamang na pagtukoy nito sa paraang inilalarawan ng naunang pangaral.
- source_word: στήκετε
  choice: manatili kayong matatag
  rationale: Natural na pautos sa Filipino na naghahatid ng diwa ng matatag at patuloy na paninindigan.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang siksik at sadyang hindi lubusang ipinaliliwanag na ugnayang ipinahahayag ng karaniwang parirala ni Pablo.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: Ginamit ang “mga kapatid” sa pangunahing teksto at ipinaliwanag sa talababa ang anyong panlalaki ng Griyego at ang saklaw nito sa buong kongregasyon.
  alternative: “mga kapatid na lalaki”
  rationale: Bagaman panlalaki ang anyong Griyego, ang liham ay nakatuon sa kongregasyon, kabilang ang mga babae. Ang karaniwang salitang Filipino na “kapatid” ay hindi minamarkahan para sa kasarian at hindi nangangailangang paliitin ang tinutukoy.
- issue: Ugnayan ng οὕτως sa pangaral
  choice: “sa ganitong paraan”
  alternative: “kaya” bilang panandang kongklusyon lamang
  rationale: Pinananatili ang posibilidad na itinuturo ng οὕτως ang paraan ng pananatiling matatag ayon sa naunang pangaral, sa halip na isama lamang ito sa pang-ugnay na kongklusyon.
- issue: Diwa ng ἐν κυρίῳ
  choice: “sa Panginoon”
  alternative: “kaisa ng Panginoon”
  rationale: Hindi tahasang nilulutas kung ang parirala ay pangunahing tumutukoy sa pakikipag-isa, saklaw, o batayan ng katatagan; nananatili ang teolohikal na lawak ng orihinal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang masidhing pagmamahal sa pag-uulit ng “mga minamahal,” at ginamit ang mga gatlang upang luminaw ang panawag at ang paglalarawan nang hindi hinahati ang iisang pangungusap.
