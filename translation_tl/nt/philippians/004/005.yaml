  yaml_path: translation/nt/philippians/004/005.yaml
  text: Let your graciousness be known to all people[b][a]. The Lord is near.
translation:
  language: tl
  text: Makilala nawa ng lahat ng tao ang inyong maunawaing pakikitungo[a]. Malapit ang Panginoon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabaitan,” “kahinahunan,” “pagiging mapagparaya,” o “pagiging makatuwiran.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Malapit ang Panginoon” ay maaaring mangahulugang naririto at malapit ang Panginoon, nalalapit ang kanyang pagdating, o kapuwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: maunawaing pakikitungo
  rationale: Ipinahahayag nito ang makonsiderasyon, hindi mapaggiit, at mapagparayang asal sa kapuwa. Mas malawak ito kaysa sa simpleng kahinahunan at natural sa makabagong Tagalog.
- source_word: γνωσθήτω
  choice: makilala nawa
  rationale: 'Pinananatili nito ang diwang pasibo at pautos ng pandiwa: ang katangiang ito ay dapat makilala o maging hayag sa iba.'
- source_word: πᾶσιν ἀνθρώποις
  choice: ng lahat ng tao
  rationale: Malinaw at inklusibong katumbas ito ng pariralang Griyego.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang katumbas ito ng κύριος at pinananatili ang bigat ng titulo.
- source_word: ἐγγύς
  choice: malapit
  rationale: Pinananatili ng “malapit” ang posibilidad na tumukoy sa presensiya ng Panginoon, sa nalalapit niyang pagdating, o sa dalawang diwa.
theological_decisions:
- issue: Kahulugan ng ὁ κύριος ἐγγύς
  choice: Malapit ang Panginoon
  alternative: Naririto at malapit ang Panginoon / Malapit nang dumating ang Panginoon
  rationale: Maaaring spatial o temporal ang ἐγγύς. Hindi nilulutas ng salin ang sadyang pagiging bukás ng pahayag sa dalawang diwa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “maunawaing pakikitungo” upang ilarawan ang malawak na etikal na diwa ng ἐπιεικές nang hindi ito nililimitahan sa banayad na disposisyon lamang.
