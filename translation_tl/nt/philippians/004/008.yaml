  source_fidelity: Tumpak ang pangunahing talaan at ang pangwakas na utos. Gayunman, ang “kung may anumang karapat-dapat purihin” ay naglilipat ng pangngalang ἔπαινος (“papuri/commendation”) tungo sa mas mahabang pang-uring parirala at nagiging hindi kapantay ng naunang “kung may anumang kagalingan.”
  naturalness: Malinaw at marangal ang kabuuang Filipino. Mas natural at mas maikli ang magkatulad na ayos na “kung may anumang kabutihan at kung may anumang papuri.”
  terminology: Ang “mga kapatid,” “marangal,” “matuwid,” “dalisay,” “kaibig-ibig,” at “kapuri-puri” ay angkop. Pinalitan ang “kagalingan” ng “kabutihan” upang mas malinaw na maihatid ang moral na saklaw ng ἀρετή at hindi pangunahing tumukoy sa husay o kakayahan.
  issues:
