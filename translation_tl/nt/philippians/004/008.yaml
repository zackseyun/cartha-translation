id: PHP.4.8
reference: Philippians 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: tl
  text: Sa wakas, mga kapatid[a], anumang totoo, anumang marangal, anumang matuwid, anumang dalisay, anumang kaibig-ibig, anumang kapuri-puri—kung may anumang kabutihan at kung may anumang papuri—ang mga bagay na ito ang isipin ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na isinaling “mga kapatid” ay nasa anyong panlalaking maramihan ngunit maaari nitong tukuyin ang buong sambayanan ng mga mananampalataya, kapwa lalaki at babae.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Sa wakas
  rationale: Likas na panandang pangdiskurso sa Filipino para sa pangwakas na paghihikayat, habang pinananatili ang puwersa ng paglipat.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang natural na tawag sa Filipino sa magkakapatid sa pananampalataya at hindi kailangang tukuyin ang kasarian; nililinaw sa talababa ang anyo at gamit ng salitang Griyego.
- source_word: ὅσα
  choice: anumang
  rationale: Pinananatili ng paulit-ulit na “anumang” ang distributibo at retorikal na ayos ng talaan nang hindi nagiging mabigat.
- source_word: ἀληθῆ
  choice: totoo
  rationale: Malawak at tuwirang katumbas na angkop sa moral at pangkaisipang saklaw ng talaan.
- source_word: σεμνά
  choice: marangal
  rationale: Ipinahihiwatig nito ang pagiging kagalang-galang at may bigat sa asal sa natural na modernong Filipino.
- source_word: δίκαια
  choice: matuwid
  rationale: Sinasaklaw nito ang tama, makatarungan, at naaayon sa wastong asal nang hindi nililimitahan sa usaping legal.
- source_word: ἁγνά
  choice: dalisay
  rationale: Pinananatili ang moral at panloob na diwa ng kadalisayan.
- source_word: προσφιλῆ
  choice: kaibig-ibig
  rationale: Natural na nagpapahayag ng bagay na pumupukaw ng pag-ibig o pagkagiliw.
- source_word: εὔφημα
  choice: kapuri-puri
  rationale: Malinaw na tumutukoy sa bagay na maganda ang pagkakilala o karapat-dapat sang-ayunan.
- source_word: εἴ τις ἀρετὴ
  choice: kung may anumang kagalingan
  rationale: Ang “kagalingan” ay tumutukoy rito sa kahusayan o mabuting katangiang moral at pinananatili ang maikli at panlahatang puwersa ng ἀρετή.
- source_word: καὶ εἴ τις ἔπαινος
  choice: at kung may anumang karapat-dapat purihin
  rationale: Natural sa Filipino at inilalahad ang diwa ng ἔπαινος bilang papuri o bagay na tumatanggap ng papuri, nang hindi nagiging asiwa ang literal na “kung may anumang papuri.”
- source_word: ταῦτα λογίζεσθε
  choice: ang mga bagay na ito ang isipin ninyo
  rationale: Ipinahahayag ang tuloy-tuloy at sinasadyang pagtutuon ng isip, at binibigyang-diin ng ayos na Filipino ang “mga bagay na ito.”
