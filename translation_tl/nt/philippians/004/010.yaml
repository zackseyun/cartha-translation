  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: tl
  text: Lubos akong nagalak sa Panginoon dahil sa wakas ay muling sumigla ang malasakit ninyo sa akin[a]. Tunay ngang nagmamalasakit kayo noon[b], ngunit wala kayong pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “muli kayong sumibol” may kinalaman sa malasakit ninyo sa akin.
    reason: lexical_alternative
  - marker: b
    text: O “iniisip ninyo ako.” Ang pandiwang Griego ay maaaring mangahulugang mag-isip tungkol sa isang tao, ituon sa kanya ang kalooban, o magmalasakit sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: ako'y nagalak
  rationale: Tuwirang ipinapahayag ang aorist ng χαίρω bilang personal na pagkagalak ni Pablo; natural at marangal ito sa modernong Tagalog.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang pahayag ni Pablo tungkol sa saklaw o batayan ng kanyang kagalakan.
- source_word: μεγάλως
  choice: lubos
  rationale: Natural na Tagalog na nagpapanatili sa matinding diin ng pang-abay.
- source_word: ἤδη ποτὲ
  choice: sa wakas
  rationale: Ipinahihiwatig ang paglitaw muli ng pagkalinga makalipas ang isang panahon, nang hindi nagpapahiwatig na sinisisi ni Pablo ang mga taga-Filipos.
- source_word: ἀνεθάλετε
  choice: muli ninyong ipinamalas
  rationale: Ipinahahayag sa natural na Tagalog ang muling pagsibol o pagkabuhay ng kanilang praktikal na malasakit; inilalagay sa talababa ang literal na larawang botanikal.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: ang malasakit ninyo sa akin
  rationale: Sa konteksto, ang φρονεῖν ay hindi lamang pag-iisip kundi mapagmalasakit na pagtuon kay Pablo.
- source_word: ἐφ’ ᾧ
  choice: tunay ngang
  rationale: Natural na panandang nagpapakilala sa paglilinaw ni Pablo na naroon na ang kanilang malasakit.
- source_word: ἐφρονεῖτε
  choice: nagmamalasakit kayo
  rationale: Pinananatili ang kaugnayan sa naunang φρονεῖν at ang patuloy na saloobin ng mga taga-Filipos.
- source_word: ἠκαιρεῖσθε
  choice: wala kayong pagkakataon
  rationale: Malinaw na ang kulang ay ang angkop na pagkakataon, hindi ang pagnanais o malasakit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ipinamalas” upang maiwasang ipahiwatig na nawala ang kanilang malasakit, yamang nililinaw ng kasunod na sugnay na patuloy silang nagmamalasakit ngunit wala silang pagkakataon. Ang metapora ng muling pagsibol ay pinanatili sa talababa.
