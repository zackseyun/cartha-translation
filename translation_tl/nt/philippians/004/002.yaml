  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: tl
  text: Nakikiusap ako kay Euodia at nakikiusap ako kay Sintique na magkaisa sila sa pag-iisip sa Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “na magkaroon sila ng iisang pag-iisip sa Panginoon”; posible rin, “na magkasundo sila sa Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Euodia
  rationale: Isinatinig ang personal na pangalan mula sa Griyego sa halip na isalin ang posibleng kahulugan nito.
- source_word: παρακαλῶ
  choice: nakikiusap ako
  rationale: Ipinahahayag nito ang taimtim at personal na pakiusap ni Pablo nang hindi nagiging labis na pormal. Pinanatili ang pag-uulit ng pandiwa para sa bawat babae.
- source_word: Συντύχην
  choice: Sintique
  rationale: Isinatinig ang personal na pangalan ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: magkaisa sila ng pag-iisip
  rationale: Pinananatili nito kapwa ang pagkakapareho o pagkakaisa na ipinahihiwatig ng τὸ αὐτό at ang disposisyon o paraan ng pag-iisip na saklaw ng φρονεῖν. Hindi ito nililimitahan sa pagsang-ayon lamang sa isang usapin.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ang literal at likas na pariralang Filipino ay nagpapanatiling bukas sa ugnayan, batayan, at saklaw sa Panginoon ng hinihinging pagkakaisa.
theological_decisions:
- issue: Saklaw ng hinihinging pagkakaisa
  choice: magkaisa sila ng pag-iisip sa Panginoon
  alternative: magkasundo sila sa Panginoon
  rationale: Ang φρονεῖν ay maaaring tumukoy sa pag-iisip, saloobin, o disposisyon; kaya iniwasang paliitin ito sa simpleng pagkakasundo tungkol sa isang partikular na alitan.
translation_notes:
  register: Modernong Filipino na magalang at marangal. Pinanatili ang retorikal na pag-uulit ng “nakikiusap ako” at ang mahalagang pariralang “sa Panginoon.”
