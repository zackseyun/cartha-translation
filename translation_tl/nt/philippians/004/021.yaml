  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: tl
  text: Batiin ninyo ang bawat banal na nasa Mesiyas na si Jesus.[a] Binabati kayo ng mga kapatid na kasama ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa Mesiyas na si Jesus.” Maaari ring isalin ang “Mesiyas” bilang “Cristo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” ay maaaring tumukoy rito sa mga kapwa mananampalatayang kasama ni Pablo, kabilang ang isang pangkat na may mga lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang pautos na pandiwa ay tumutukoy sa pagpapaabot ng pagbati; natural at tuwiran ang “batiin ninyo” sa pangwakas na bahagi ng isang liham.
- source_word: πάντα ἅγιον
  choice: ang bawat banal
  rationale: May diwang pamahagi ang isahang anyo kasama ng πᾶς, kaya ang “bawat banal” ay tumpak at natural, at pinananatili nito ang pagkakakilanlan ng mga mananampalataya bilang mga itinalaga sa Diyos.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: na kaisa ng Mesiyas na si Jesus
  rationale: Ipinahahayag ng ἐν ang kaugnayan at pakikiisa kay Jesus; natural sa modernong Tagalog ang “kaisa ng.” Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang bahagi ng pangalan.
- source_word: ἀσπάζονται ὑμᾶς
  choice: Binabati kayo
  rationale: Karaniwang ipinahahayag sa Tagalog sa aktibong anyo ang pagbating ipinapaabot sa mga tumatanggap ng liham.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: ang mga kapatid na kasama ko
  rationale: Natural na katumbas ng ἀδελφοί ang “mga kapatid.” Napapanatili nito ang posibleng pagtukoy sa mga lalaking kapatid o, ayon sa konteksto, sa mas malawak na pangkat ng mga kapwa mananampalataya.
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: na kaisa ng Mesiyas na si Jesus
  alternative: sa Mesiyas na si Jesus / kay Cristo Jesus
  rationale: Inihahatid ng pangunahing salin ang relasyonal na diwa ng parirala nang hindi ito ginagawang lokasyong pisikal. Inilalagay sa talababa ang mas pormal na anyo upang mapanatili ang tunay na lawak ng ἐν.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mesiyas” bilang titulo ng Χριστός at ang likas na Tagalog na “mga kapatid” nang hindi tahasang nilulutas kung puro lalaki o halo-halong pangkat ang tinutukoy.
