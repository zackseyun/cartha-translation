  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: tl
  text: Ngunit natanggap ko na ang lahat[a], at sagana ako. Lubos na akong natustusan matapos kong tanggapin mula kay Epafrodito ang ipinadala ninyo—isang mabangong samyo, isang hain na katanggap-tanggap at kalugod-lugod sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “ganap ko nang natanggap,” o “natanggap ko na ang buong kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: natanggap ko na
  rationale: Sa konteksto ng materyal na tulong, maaari itong mangahulugang tinanggap nang buo o natanggap bilang kabayaran. Pinananatili ng “natanggap ko na” ang likas na Filipino at hindi labis na ipinipilit ang komersiyal na himig.
- source_word: πάντα
  choice: ang lahat
  rationale: Komprehensibo ang parirala at tumutukoy sa kabuuan ng ipinadala ng mga taga-Filipos.
- source_word: περισσεύω
  choice: sagana ako
  rationale: Ipinahahayag nito ang kalagayang higit sa kasapatan at pinananatili ang maikli at mariing pahayag ni Pablo.
- source_word: πεπλήρωμαι
  choice: lubos na akong natustusan
  rationale: Ipinakikita ng perpektong aspekto ang kasalukuyang kalagayan bunga ng natanggap na kaloob. Ang “natustusan” ay malinaw sa konteksto ng materyal na suporta.
- source_word: δεξάμενος
  choice: sapagkat tinanggap ko
  rationale: Likas nitong ipinapaliwanag kung paano lubos na natustusan si Pablo, nang hindi ginagawang mas teknikal ang participle kaysa kailangan.
- source_word: παρὰ Ἐπαφροδίτου
  choice: mula kay Epafrodito
  rationale: Si Epafrodito ang agarang pinagmulan o tagapaghatid ng kaloob; nililinaw ng kasunod na parirala na nagmula talaga ito sa mga taga-Filipos.
- source_word: τὰ παρ’ ὑμῶν
  choice: ang ipinadala ninyo
  rationale: Natural sa Filipino at malinaw na tumutukoy sa kaloob na nagmula sa kanila.
- source_word: ὀσμὴν εὐωδίας
  choice: isang mabangong samyo
  rationale: Pinananatili nito ang matingkad na wikang panghandog at ang alusyon sa pagsamba sa Lumang Tipan.
- source_word: θυσίαν δεκτήν
  choice: isang handog na katanggap-tanggap
  rationale: Inilalarawan ang kanilang kaloob bilang handog sa pagsamba. Mas natural ang “handog” sa Filipino rito kaysa “hain,” habang nananatili ang sakripisyal na larawan.
- source_word: εὐάρεστον τῷ θεῷ
  choice: kalugod-lugod sa Diyos
  rationale: Dignified at malinaw nitong ipinapahayag ang pagsang-ayon ng Diyos sa handog.
theological_decisions:
- issue: Sakripisyal na paglalarawan sa materyal na kaloob ng mga taga-Filipos
  choice: 'Panatilihin ang tunay na metapora ng pagsamba: “isang mabangong samyo, isang handog na katanggap-tanggap at kalugod-lugod sa Diyos.”'
  alternative: Gawing pangkalahatang pahayag lamang ng pasasalamat o ipakahulugang “isang handog na malugod na tinatanggap ng Diyos.”
  rationale: Sinasadya ni Pablo ang magkakaugnay na wikang panghandog—samyo, handog, at pagiging kalugod-lugod sa Diyos. Dapat itong mapanatili nang hindi dinaragdagan ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling pag-uulit ng kasaganaan at kapuspusan, pati ang wikang panghandog, ngunit iniwasan ang sobrang pormal o teknikal na pananalita.
