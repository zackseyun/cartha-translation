  to: Ngunit natanggap ko na ang lahat[a], at sagana ako. Lubos na akong natustusan matapos kong tanggapin mula kay Epafrodito ang ipinadala ninyo—isang mabangong samyo, isang hain na katanggap-tanggap at kalugod-lugod sa Diyos.
  rationale: Ginawang mas likas at malinaw ang footnote, pinanatili ang kawalang-singaw ng participle, at ginamit ang “hain” upang mas tuwirang maipahayag ang sakripisyal na wikang θυσία. Hindi binago ang kahulugan o ang metaporang pagsamba ng talata.
