  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: tl
  text: Ang mga bagay na inyong natutuhan, tinanggap, narinig, at nakita sa akin[a]—patuloy ninyong isagawa ang mga ito[b]. At ang Diyos ng kapayapaan ay makakasama ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nakita sa akin” ay maaari ding ipahayag na “nakita sa aking halimbawa” o “nakita sa aking pamumuhay.”
    reason: lexical_alternative
  - marker: b
    text: O “gawin ninyo ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ang mga bagay na
  rationale: Pinananatili ang maramihang diwa ng panghalip at natural itong nag-uugnay sa kasunod na “ang mga ito.”
- source_word: ἐμάθετε
  choice: natutuhan ninyo
  rationale: Tuwirang ipinahahayag ang natutuhan ng mga taga-Filipos mula kay Pablo.
- source_word: παρελάβετε
  choice: tinanggap
  rationale: Pinananatili ang malawak na diwa ng pagtanggap ng turo o ipinasa sa kanila nang hindi tahasang dinaragdagan ng “tradisyon.”
- source_word: ἠκούσατε
  choice: narinig
  rationale: Maikli at tuwirang katumbas na nagpapanatili sa magkakasunod na pandiwa.
- source_word: εἴδετε ἐν ἐμοί
  choice: nakita sa akin
  rationale: Malapit sa anyo ng Griyego at hindi tahasang nagpapakahulugan kung ito ay tumutukoy sa halimbawa o pamumuhay ni Pablo.
- source_word: ταῦτα πράσσετε
  choice: patuloy ninyong isagawa ang mga ito
  rationale: Ipinahahayag ng “patuloy” ang aspektong paulit-ulit o nakaugaliang pagsasagawa na hinihingi ng pangkasalukuyang pautos na πράσσετε.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: ang Diyos ng kapayapaan
  rationale: Pinananatili ang karaniwang ekspresyong Paulino at ang genitibong pagkakaugnay nang hindi ito nilalawak bilang “Diyos na nagbibigay ng kapayapaan.”
- source_word: ἔσται μεθ’ ὑμῶν
  choice: ay sasainyo
  rationale: Likas at marangal na pahayag sa Tagalog para sa pangakong makakasama nila ang Diyos.
theological_decisions:
- issue: Ugnayan ng pagsunod at presensiya ng Diyos
  choice: Isinalin bilang tuwirang utos na sinusundan ng pangako, na pinag-uugnay ng “At.”
  alternative: 'Gawing hayagang kondisyon: “Kung gagawin ninyo ang mga ito, sasainyo ang Diyos.”'
  rationale: καί ang nag-uugnay sa dalawang sugnay, hindi isang tahasang kondisyunal na pormula; kaya pinananatili ang pastoral na lakas at teolohikal na tensiyon nang hindi nagdaragdag ng mekanistikong sanhi at bunga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “patuloy ninyong isagawa” upang maging natural habang naihahatid ang diwa ng nakaugaliang pagsasagawa; pinanatili ang “Diyos ng kapayapaan” bilang pamilyar at teolohikal na hindi labis na ipinapaliwanag.
