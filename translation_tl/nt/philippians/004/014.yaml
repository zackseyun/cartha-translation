lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Nagpapahiwatig ito ng banayad na pagsalungat sa naunang sinabi ni Pablo habang pinananatili ang positibong papuri niya sa mga taga-Filipos.
- source_word: καλῶς ἐποιήσατε
  choice: mabuti ang ginawa ninyo
  rationale: Natural at tuwirang katumbas ito ng idyomatikong pariralang Griyego na positibong humahatol sa kanilang ginawa.
- source_word: συγκοινωνήσαντές
  choice: nang makibahagi kayo
  rationale: Ipinahahayag nito ang aktibong pakikibahagi o pakikiisa sa dinaranas ni Pablo, hindi lamang ang pagbibigay ng tulong mula sa malayo.
- source_word: μου τῇ θλίψει
  choice: sa aking paghihirap
  rationale: Ipinauugnay ng μου kay Pablo ang θλῖψις, na tumutukoy sa mabigat na hirap, kagipitan, o pagdurusa; malinaw at likas sa modernong Tagalog ang “aking paghihirap.”
