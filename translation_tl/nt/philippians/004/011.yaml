  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: tl
  text: Hindi ko ito sinasabi dahil sa kakulangan, sapagkat natutuhan kong maging kontento sa anumang kalagayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: dahil sa kakulangan
  rationale: Ipinahihiwatig ng parirala ang pagsasalita bunsod ng kakulangan o pangangailangan; natural sa Tagalog ang 'dahil sa kakulangan' at hindi nito nililimitahan ang diwa sa isang tiyak na uri ng pangangailangan.
- source_word: λέγω
  choice: sinasabi
  rationale: Ang aspektong pangkasalukuyan ay likas na naipahahayag sa Tagalog sa 'sinasabi,' na tumutukoy sa kasalukuyang pahayag ni Pablo.
- source_word: ἔμαθον
  choice: natutuhan
  rationale: Ipinahahayag nito ang pagkatutong naganap at may nananatiling bunga sa kasalukuyan.
- source_word: ἐν οἷς εἰμι
  choice: anuman ang kalagayan ko
  rationale: Ang parirala ay idyomatikong tumutukoy sa anumang sitwasyong kinaroroonan ni Pablo, hindi lamang sa literal na lugar.
- source_word: αὐτάρκης
  choice: masiyahan
  rationale: Sa konteksto, inilalarawan nito ang natutuhang pagiging kontento sa anumang kalagayan. Ang pandiwang 'masiyahan' ay natural sa pangungusap at hindi nagpapahiwatig ng ganap na pagsasarili.
theological_decisions:
- issue: Posibleng pilosopikal na diwa ng αὐτάρκης
  choice: Isinaling 'masiyahan.'
  alternative: maging sapat sa sarili
  rationale: Ang konteksto ay tungkol sa natutuhang pagkakontento sa pabago-bagong kalagayan. Iniiwasan ng 'masiyahan' ang labis na pagpapahiwatig ng nagsasariling kasapatan, habang pinananatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang maikling lohika ng Griyego at iniwasan ang denominasyonal o pilosopikal na pagpapakahulugang lampas sa konteksto.
