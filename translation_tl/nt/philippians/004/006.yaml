  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: tl
  text: Huwag kayong mabalisa tungkol sa anumang bagay[a]; sa halip, sa lahat ng bagay, sa pamamagitan ng panalangin at pagsusumamo[b] na may pasasalamat, ipaalam ninyo sa Diyos[c] ang inyong mga kahilingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kayong mag-alala tungkol sa anumang bagay.”
    reason: lexical_alternative
  - marker: b
    text: O “masidhing paghingi.”
    reason: lexical_alternative
  - marker: c
    text: O “sa harap ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Huwag kayong mabalisa tungkol sa anumang bagay
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw nitong ipinapahayag ang pagbabawal sa pagkabalisa nang hindi ipinapalagay na ipinagbabawal ang lahat ng wastong pagmamalasakit.
- source_word: ἀλλ’ ἐν παντί
  choice: sa halip, sa lahat ng bagay
  rationale: Pinananatili nito ang malinaw na pagsalungat at ang malawak na saklaw ng parirala.
- source_word: τῇ προσευχῇ
  choice: panalangin
  rationale: Karaniwan, marangal, at malawak na katumbas ng προσευχή bilang pakikipag-usap sa Diyos.
- source_word: τῇ δεήσει
  choice: pagsusumamo
  rationale: Ipinakikita nito ang mas tiyak at marubdob na paghingi na tinutukoy ng δέησις, kaya napapanatili ang pagkakaiba nito sa pangkalahatang 'panalangin.'
- source_word: μετ’ εὐχαριστίας
  choice: na may pasasalamat
  rationale: Direkta at likas na salin na nagpapanatili sa anyong pangngalan at sa diin sa mapagpasalamat na pananalangin.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: ang inyong mga kahilingan
  rationale: Malinaw at natural na tumutukoy sa mga tiyak na bagay na hinihingi, nang hindi inuulit ang 'pagsusumamo.'
- source_word: γνωριζέσθω
  choice: ipaalam ninyo
  rationale: Bagaman pasibo ang anyong Griyego, ito ang pinakanatural na paraan sa Tagalog upang maipahayag ang patuloy na utos na iharap o ipabatid sa Diyos ang mga kahilingan.
- source_word: πρὸς τὸν θεόν
  choice: sa Diyos
  rationale: Direktang ipinahahayag ang tunguhin ng paghiling at natural na kaugnay ng pandiwang 'ipaalam.'
theological_decisions:
- issue: Saklaw ng pagbabawal sa μεριμνᾶτε
  choice: mabalisa
  alternative: mag-alala / mabahala
  rationale: Ang 'mabalisa' ay tumutukoy sa mapanligalig na pag-aalala ngunit hindi kusang itinatanggi ang lehitimong malasakit o pananagutan.
- issue: Kahulugan ng πρὸς τὸν θεόν
  choice: sa Diyos
  alternative: sa harap ng Diyos
  rationale: Pinananatili ng pangunahing salin ang pinakadirektang tunguhin ng panalangin; inilalagay sa talababa ang posibleng diwa ng pagharap sa presensiya ng Diyos nang hindi ito ipinipilit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang 'kayo/ninyo/inyong' upang katawanin ang pangmaramihang anyo ng Griyego. Pinanatili ang pagkakaiba ng pangkalahatang panalangin at tiyak na pagsusumamo, habang iniwasan ang masyadong teknikal o makalumang pananalita.
