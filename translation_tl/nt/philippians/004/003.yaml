  source_fidelity: 'Tumpak ang salin sa daloy at pangunahing mga termino ng Griyego: ang pagpapatibay na “Oo,” ang magalang na pakiusap, ang di-tiyak na pantawag na γνήσιε σύζυγε, ang utos na tumulong, ang hayag na pambabaeng maramihang tinutukoy, ang larawan ng sama-samang pakikipagpunyagi sa ebanghelyo, at ang “aklat ng buhay.” Hindi nito ipinipilit ang alinmang pinagtatalunang pagkakakilanlan para sa σύζυγε.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino Tagalog. Ang “nakipagpunyagi silang kasama ko” ay mabuting katumbas ng sama-samang pagsisikap/pakikipagtunggali at nananatiling madaling unawain. Ang pag-uugnay kay Clemente at sa iba pang kamanggagawa ay maayos na nababasa.
  terminology: Ang “ebanghelyo,” “mga kamanggagawa,” at “aklat ng buhay” ay matatag at angkop na mga katawagang biblikal sa modernong Tagalog. Ang “tunay na kasama” ay natural na pangunahing salin, habang wastong pinananatili ng talababa ang mas literal na larawan at ang posibilidad na pangalang pantangi ang σύζυγε.
