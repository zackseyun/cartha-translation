id: PHP.4.3
reference: Philippians 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: tl
  text: Oo, hinihiling ko rin sa iyo, tunay na kasama[a], tulungan mo ang mga babaeng ito. Nakipagpunyagi silang kasama ko sa ebanghelyo[b], kasama rin si Clemente at ang iba ko pang mga kamanggagawa, na ang mga pangalan ay nasa aklat ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “tunay na katuwang sa pamatok.” Itinuturing naman ito ng ilan na pangalang pantangi: “Sizigo.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “nakipaglaban silang kasama ko” o “gumawa silang kaagapay ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Oo
  rationale: Pinananatili ang tuwirang pagpapatibay at paglipat ni Pablo sa panibagong pakiusap.
- source_word: ἐρωτῶ
  choice: hinihiling ko
  rationale: Likas sa modernong Tagalog at pinananatili ang personal na tono ng pakiusap nang hindi ito ginagawang mas mariing utos.
- source_word: γνήσιε σύζυγε
  choice: tunay na kasama
  rationale: Itinuturing ang σύζυγε bilang karaniwang pangngalang pantawag, hindi tiyak na pangalang pantangi. Malinaw at natural ang “kasama,” habang inilalagay sa talababa ang literal na larawan ng magkasamang pumapasan ng pamatok at ang posibilidad na pangalan ito.
- source_word: συλλαμβάνου
  choice: tulungan mo
  rationale: Malinaw na ipinahahayag ang utos na aktibong umalalay, nang hindi pilit na inililipat ang literal na idyoma ng magkasamang paghawak.
- source_word: αὐταῖς
  choice: ang mga babaeng ito
  rationale: Ginagawang malinaw ang pambabaeng maramihan na tumutukoy sa sina Euodia at Sintique sa naunang talata.
- source_word: συνήθλησάν μοι
  choice: nakipagpunyagi silang kasama ko
  rationale: Nananatili ang diwa ng sama-samang matinding pagsisikap o pakikipagtunggali sa συναθλέω, ngunit natural pa ring basahin sa Tagalog.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: sa ebanghelyo
  rationale: Malapit sa siksik na pananalita ng Griyego at hindi nililimitahan kung ito ay pakikibahagi sa ebanghelyo o paglilingkod para rito.
- source_word: συνεργῶν
  choice: mga kamanggagawa
  rationale: Karaniwan, malinaw, at angkop na katumbas ng katawagang Paulino para sa mga kasamang gumagawa.
- source_word: βίβλῳ ζωῆς
  choice: aklat ng buhay
  rationale: Ito ang malinaw at nakaugaliang katawagang biblikal sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa γνήσιε σύζυγε
  choice: 'Pantawag na naglalarawan sa isang di-pinangalanang kasamang lalaki: “tunay na kasama”'
  alternative: Maaaring mas literal na “tunay na katuwang sa pamatok,” o maaaring pangalang pantangi na “Sizigo.”
  rationale: Ang anyo ng γνήσιε ay likas na umaayon sa isang pantawag na naglalarawan, ngunit hindi ganap na tiyak kung karaniwang pangngalan o pangalang pantangi ang σύζυγε. Kaya pinili sa teksto ang natural na karaniwang pangngalan at pinanatili sa talababa ang mga tunay na alternatibo.
- issue: Saklaw ng ἐν τῷ εὐαγγελίῳ
  choice: “sa ebanghelyo”
  alternative: “para sa ebanghelyo” o “sa gawain ng ebanghelyo”
  rationale: Pinananatili ng mas tuwirang anyo ang lawak at bahagyang kalabuan ng pariralang Griyego sa halip na tahasang tukuyin ang uri ng paglilingkod.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nakipagpunyagi” upang mapanatili ang larawan ng matinding sama-samang pagsisikap, at iniwasang gawing mas tiyak kaysa sa Griyego ang “sa ebanghelyo.” Inilipat ang panandang [a] sa “tunay na kasama,” sapagkat doon talaga nauukol ang talababa.
