  naturalness: Natural at marangal sa modernong Filipino ang "Sapagkat maging sa Tesalonica, minsan at muli kayong nagpadala para sa pangangailangan ko." Naiiwasan nito ang medyo mabigat na "upang tugunan" habang pinananatiling hindi tinutukoy ang ipinadala, gaya ng Griyego.
