  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: tl
  text: Sapagkat maging sa Tesalonica, minsan at muli kayong nagpadala para sa pangangailangan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idyomatiko, “mahigit isang beses kayong nagpadala para sa pangangailangan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o dahilan na kaugnay ng naunang pahayag ni Pablo.
- source_word: καὶ ἐν Θεσσαλονίκῃ
  choice: kahit noong nasa Tesalonica ako
  rationale: Ipinahahayag ng καί ang diin na “kahit,” at ginagawang malinaw sa natural na Tagalog na si Pablo ang nasa Tesalonica, gaya ng hinihingi ng konteksto.
- source_word: ἅπαξ καὶ δὶς
  choice: minsan at muli
  rationale: Pinananatili nito ang paulit-ulit na anyo at diin ng Griyego nang hindi tiyak na nililimitahan ang kahulugan sa eksaktong dalawang padala.
- source_word: εἰς τὴν χρείαν μοι
  choice: upang tugunan ang pangangailangan ko
  rationale: Natural nitong ipinahahayag ang layunin ng ipinadala habang pinananatili ang isahan ng χρεία.
- source_word: ἐπέμψατε
  choice: nagpadala
  rationale: Hindi pinangalanan ng pandiwa ang bagay na ipinadala, kaya hindi idinagdag sa pangunahing teksto ang “tulong” o “salapi.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “minsan at muli” upang mapanatili ang anyo at bahagyang kalabuan ng ἅπαξ καὶ δὶς; ibinigay sa talababa ang mas idyomatikong pagpapahayag.
