source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: tl
  text: At ang kapayapaan ng Diyos, na nakahihigit sa lahat ng pang-unawa, ay magbabantay sa inyong mga puso at mga isip sa Mesiyas na si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Cristo Jesus.”
    reason: Nagbibigay ng nakasanayang alternatibong anyo para sa ἐν Χριστῷ Ἰησοῦ, habang ang pangunahing teksto ay nagsasalin sa Χριστός bilang titulong “Mesiyas.”
lexical_decisions:
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Likas at malawak na katumbas ito sa Filipino, at pinananatili ang diwa ng panloob at panlahatang kapayapaan nang hindi pinalalawak ang teksto.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili nito ang anyong henitibo ng Griyego; hindi nito nililimitahan ang diwa sa pinagmulan lamang, gaya ng maaaring ipahiwatig ng “mula sa Diyos.”
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: na nakahihigit sa lahat ng pang-unawa
  rationale: Ipinahahayag nito na ang kapayapaan ng Diyos ay lampas sa kakayahang umunawa, habang pinananatili ang paghahambing na nasa pandiwaring ὑπερέχουσα at ang saklaw ng πάντα.
- source_word: φρουρήσει
  choice: ang magbabantay
  rationale: Ang “magbabantay” ay nagpapanatili sa larawan ng isang bantay na nag-iingat, kabilang ang protektibong kulay ng pandiwang Griyego.
- source_word: τὰς καρδίας ὑμῶν
  choice: inyong mga puso
  rationale: Pinananatili ng “mga puso” ang biblikal na larawan ng kaibuturan ng pagkatao at damdamin.
- source_word: τὰ νοήματα ὑμῶν
  choice: inyong mga pag-iisip
  rationale: Mas tuwirang tumutukoy ang νοήματα sa mga iniisip, pag-unawa, o prosesong mental kaysa sa mismong “isip”; malinaw rin ang kaibahan nito sa “mga puso.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at iniiwasang dagdagan sa pangunahing teksto ang mas tiyak na paliwanag na “sa pakikipag-isa,” upang mapanatili ang lawak ng ἐν.
theological_decisions:
- issue: Kahulugan ng ἐν sa pariralang ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  alternative: sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Maaaring ipahiwatig ng parirala ang kinaroroonan o saklaw, pakikipag-isa, at kaugnayan sa Mesiyas. Ang payak na “sa” ang higit na nagpapanatili sa siksik at bahagyang bukas na pahayag ng Griyego.
- issue: Paglilipat ng titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may makabuluhang puwersa bilang titulo rito. Isinasalin ito bilang “Mesiyas” sa halip na panatilihin lamang bilang nakasanayang transliterasyong “Cristo.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang magkapares na “mga puso” at “mga pag-iisip,” gayundin ang larawan ng nagbabantay. Ginamit ang “ang magbabantay” upang maging malinaw sa Filipino na “ang kapayapaan ng Diyos” ang simuno ng pandiwa.
