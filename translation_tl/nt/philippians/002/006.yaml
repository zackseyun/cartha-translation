base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/006.yaml
  text: who[a], though he was in the form of God, did not consider equality with God something to be grasped[c][b],
translation:
  language: tl
  text: Siya, bagaman umiiral sa anyo ng Diyos[a], ay hindi itinuring ang pagiging kapantay ng Diyos[c] na isang bagay na dapat samantalahin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “umiiral sa anyo ng Diyos.” Ang ὑπάρχων ay maaaring unawain na may concessive na diin (“bagaman umiiral”) o bilang payak na paglalarawan ng kalagayan (“umiiral”).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang bagay na dapat panghawakan” o “isang bagay na dapat agawin.” Pinagtatalunan ang tiyak na diwa ng ἁρπαγμός.
    reason: alternative_reading
  - marker: c
    text: Sa literal, “ang maging kapantay ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Siya
  rationale: Sa Filipino, mas natural na ipagpatuloy ang naunang tinutukoy sa pamamagitan ng “Siya” kaysa sa literal na panghalip na “na,” habang nananatili ang ugnayan sa paksa ng talata 5.
- source_word: ἐν μορφῇ θεοῦ
  choice: sa anyo ng Diyos
  rationale: Pinananatili ng “anyo” ang mismong larawan ng μορφή at ang mataas na Kristolohiya ng pahayag nang hindi ito pinapalitan ng mas makitid na paliwanag na metapisikal.
- source_word: ὑπάρχων
  choice: bagaman umiiral
  rationale: Ipinahahayag ng “bagaman” ang malamang na pagpapaukol na diwa ng participle sa pagsalungat sa pagpapakababa sa talata 7; inilalagay sa talababa ang maaari ring statibong pagbasa.
- source_word: ἡγήσατο
  choice: hindi itinuring
  rationale: Ang “itinuring” ay likas at kasalukuyang salin ng paghatol o pagkilala sa isang bagay bilang may partikular na katangian.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: ang pagiging kapantay ng Diyos
  rationale: Malinaw at natural nitong ipinapahayag ang articular infinitive at ang diwa ng ἴσα bilang pagkakapantay o kapantay na katayuan.
- source_word: ἁρπαγμὸν
  choice: isang bagay na dapat samantalahin
  rationale: Sa konteksto ng kasunod na kusang pagpapakababa, ipinahihiwatig nito ang isang kalagayang hindi ginamit para sa sariling pakinabang. Dahil pinagtatalunan ang salita, pinananatili sa talababa ang mga pagbasa na “panghawakan” at “agawin.”
theological_decisions:
- issue: Ang Kristolohikal na bigat ng ἐν μορφῇ θεοῦ
  choice: Panatilihin ang “sa anyo ng Diyos” sa pangunahing teksto.
  alternative: “taglay ang kalikasan ng Diyos” o “Diyos sa likas na kalagayan”
  rationale: Ang “anyo ng Diyos” ay nananatiling malapit sa pananalita ni Pablo at hindi ipinapasok sa salin ang mas huling pormulang teolohikal, habang hindi rin inaalis ang ontolohikal na bigat na maaaring taglayin nito.
- issue: Ang kahulugan ng ἁρπαγμός kaugnay ng pagiging kapantay ng Diyos
  choice: “isang bagay na dapat samantalahin” sa pangunahing teksto
  alternative: “isang bagay na dapat panghawakan” o “isang bagay na dapat agawin”
  rationale: Ang daloy tungo sa kusang pagpapakababa sa talata 7 ay pumapabor sa diwang hindi paggamit ng katayuan para sa sariling pakinabang. Gayunman, tunay na hindi tiyak ang saklaw ng ἁρπαγμός, kaya hayagang pinananatili ang ibang pagbasa sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “umiiral” upang panatilihin ang bigat ng pahayag, “anyo” upang hindi paliitin ang μορφή sa “hitsura” lamang, at “samantalahin” upang ipakita ang kontekstuwal na diwa ng paggamit para sa sariling pakinabang. Ang mga tunay na hindi tiyak na pagbasa ay hindi nilutas nang palihim kundi inilagay sa mga talababa.
