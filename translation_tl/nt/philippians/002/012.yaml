id: PHP.2.12
reference: Philippians 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: tl
  text: Kaya nga, mga minamahal ko, kung paanong lagi kayong naging masunurin—hindi lamang kapag kasama ninyo ako, kundi lalo na ngayong wala ako—isakatuparan ninyo ang sarili ninyong kaligtasan[a] nang may takot at panginginig[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “isagawa ninyo” o “dalhin ninyo sa katuparan.”
    reason: Ipinakikita ang saklaw ng κατεργάζεσθε nang hindi nagdaragdag ng larawang wala sa teksto o nagtatakda ng isang doktrinal na pagpapakahulugan.
  - marker: b
    text: Ang “takot at panginginig” ay idyomang nagpapahiwatig ng taimtim na kaseryosohan, pitagan, at pagpapakumbaba.
    reason: Nililinaw ang idyomatikong puwersa habang hindi nagdaragdag ng tahasang layon na wala sa parirala.
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya nga
  rationale: Nagpapakita ito ng kongklusyon o paghihinuha mula sa naunang paglalarawan at pangaral tungkol kay Cristo.
- source_word: ἀγαπητοί μου
  choice: mga minamahal ko
  rationale: Pinananatili ang mainit at mapagmahal na tono ng tuwirang pagtawag ni Pablo.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: kung paanong lagi kayong sumusunod
  rationale: Natural sa makabagong Tagalog at inilalarawan ang nakagawian nilang pagsunod na dapat magpatuloy.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: kapag kasama ninyo ako / ngayong wala ako
  rationale: Mas likas kaysa sa abstraktong 'presensiya/pagkawala' at malinaw na pinananatili ang paghahambing.
- source_word: πολλῷ μᾶλλον
  choice: lalo na
  rationale: Likas na Tagalog para sa pinatinding paghahambing na 'much more/all the more.'
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: ang sarili ninyong kaligtasan
  rationale: Pinananatili ang diin ng ἑαυτῶν sa pananagutan ng mga kausap at ang karaniwang teolohikal na kahulugan ng σωτηρία.
- source_word: κατεργάζεσθε
  choice: ipamuhay ninyo hanggang sa ganap na bunga
  rationale: Ipinahahayag ang patuloy na pagsasakatuparan o pagdadala sa bunga, nang hindi ipinahihiwatig na dapat kitain ang kaligtasan.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: nang may takot at panginginig
  rationale: Pinananatili ang lakas at solemnidad ng Griyegong idyoma sa halip na palambutin ito bilang paggalang lamang.
theological_decisions:
- issue: Kahulugan ng κατεργάζεσθε kaugnay ng kaligtasan
  choice: Isakatuparan at ipamuhay ang kaligtasan hanggang sa makita ang ganap na bunga nito.
  alternative: Kitain o likhain ang kaligtasan sa pamamagitan lamang ng sariling gawa.
  rationale: Maaaring tumukoy ang pandiwa sa pagsasagawa at pagdadala ng isang bagay sa bunga; pinananatili rin ng kasunod na talata ang tensiyon sa pagitan ng pananagutan ng tao at paggawa ng Diyos.
- issue: Diin ng 'takot at panginginig'
  choice: Seryoso, mapagpakumbaba, at may pitagan sa harap ng Diyos, habang pinananatili ang literal na bigat ng pananalita.
  alternative: Purong sindak lamang, o simpleng paggalang na walang matinding damdamin.
  rationale: Ang parirala ay may taimtim na bigat; hindi dapat burahin ng salin ang lakas o ang posibleng lawak ng kahulugan nito.
- issue: Saklaw ng ἑαυτῶν
  choice: Sarili ninyong kaligtasan, na tumutukoy sa mga kausap bilang isang pangkat at bilang mga taong may pananagutan.
  alternative: Isang mahigpit na indibiduwalistikong kaligtasan na walang kaugnayan sa pamayanan.
  rationale: Maramihan ang mga anyo sa Griyego; pinananatili ng 'ninyo' ang kolektibong pakikipag-usap nang hindi inaalis ang personal na pananagutan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang 'kayo/ninyo' ayon sa Griyego at iniwasan ang teknikal o sektaryang pananalita.
