  to: Kaya nga, mga minamahal ko, kung paanong lagi kayong naging masunurin—hindi lamang kapag kasama ninyo ako, kundi lalo na ngayong wala ako—isakatuparan ninyo ang sarili ninyong kaligtasan[a] nang may takot at panginginig[b],
