translation:
  language: tl
  text: Nagpakumbaba siya at naging masunurin hanggang sa kamatayan[a]—maging kamatayan sa krus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang kamatayan”; ang diwa ay umabot ang kanyang pagsunod hanggang sa mismong kamatayan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “kamatayan—ng krus”; pinatitingkad ng parirala ang uri ng kamatayan: kamatayan sa krus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν ἑαυτὸν
  choice: Nagpakumbaba siya
  rationale: Likas at tuwirang salin ito ng aktibong pandiwa at reflexive pronoun; pinananatili nito na kusang ibinaba ng paksa ang sarili niya.
- source_word: γενόμενος ὑπήκοος
  choice: at naging masunurin
  rationale: Malinaw na ipinapahayag ang pagkalakip ng participle sa pagpapakumbaba, nang hindi labis na itinatakda kung temporal o modal lamang ang ugnayan.
- source_word: μέχρι θανάτου
  choice: hanggang sa kamatayan
  rationale: 'Pinananatili ang lawak o sukdulan ng pagsunod: umabot ito sa mismong kamatayan.'
- source_word: θανάτου δὲ σταυροῦ
  choice: maging kamatayan sa krus
  rationale: Ang “maging” ay natural na nagpapatingkad sa huling parirala, at ang “sa krus” ay malinaw na naghahatid sa siksik na genitive construction.
theological_decisions:
- issue: Lakas ng θανάτου δὲ σταυροῦ
  choice: 'Pagpapatingkad: “maging kamatayan sa krus”'
  alternative: “kamatayan nga sa krus” o literal na “kamatayan ng krus”
  rationale: Pinananatili nito ang retorikal na pag-igting mula sa kamatayan tungo sa kahiya-hiyang uri ng kamatayan, nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ugnayan ng γενόμενος sa ἐταπείνωσεν
  choice: Iniugnay sa pamamagitan ng “at naging masunurin”
  alternative: “sa pamamagitan ng pagiging masunurin”
  rationale: Hindi tahasang nilulutas ng salin kung paraan lamang o kalakip na kalagayan ang participle; nananatiling malinaw at natural ang ugnayan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagpakumbaba” at “masunurin” bilang karaniwan ngunit dignified na mga salita; iniwasan ang mas arkaikong “masunurin hanggang kamatayan” nang walang pantukoy, ngunit inilagay iyon bilang alternatibo sa talababa.
