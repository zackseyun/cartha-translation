  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: tl
  text: Sapagkat ang Diyos ang kumikilos sa inyo upang kayo’y kapuwa magnais at kumilos para sa kanyang mabuting kalooban.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapuwa ang pagnanais at ang pagkilos.”
    reason: Pinananatili ng alternatibong ito ang nominal na anyo ng dalawang articular infinitive, τὸ θέλειν at τὸ ἐνεργεῖν.
  - marker: b
    text: O “ayon sa kanyang mabuting kalooban.”
    reason: Maaaring unawain ang ὑπὲρ τῆς εὐδοκίας bilang “ayon sa,” bagaman ang pangunahing salin ay pinananatili ang diwa ng layunin o kapakanan.
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang tagubilin at likas na nag-uugnay sa pangungusap sa Filipino.
- source_word: ὁ ἐνεργῶν
  choice: ang kumikilos
  rationale: 'Pinananatili ng pariralang ito ang substantival at nagpapatuloy na diwa ng present participle: ang Diyos mismo ang aktibong gumagawa.'
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Maaaring tumukoy sa pagkilos sa loob ng bawat mananampalataya o sa gitna ng buong kapulungan; pinananatili ng “sa inyo” ang saklaw na bukas.
- source_word: τὸ θέλειν
  choice: inyong loobin
  rationale: Ipinahahayag nito ang pagkukusa o pagpapasya, hindi lamang damdamin o pagnanais, at natural itong katambal ng “gawin” sa Filipino.
- source_word: τὸ ἐνεργεῖν
  choice: gawin
  rationale: Ipinahahayag nito ang aktuwal na pagkilos. Bagaman hindi ganap na naipakikita ang pag-uulit ng ugat na ἐνεργ- sa Filipino, mas natural at malinaw ang “gawin” kaysa sa pilit na pag-uulit ng “kumilos.”
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: ang nakalulugod sa kanya
  rationale: Likas na naihahatid nito ang layunin o pakinabang na kaugnay ng εὐδοκία. Ang panghalip na “kanya” ay tumutukoy sa Diyos, gaya ng ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagkilos ng Diyos at pagloob/paggawa ng tao
  choice: Pinanatiling ang Diyos ang kumikilos sa mga mananampalataya kapuwa sa kanilang pagloob at paggawa.
  alternative: Ang Diyos ay nagbibigay lamang ng pagnanais at kakayahang gumawa.
  rationale: Hindi tinutukoy ng talata ang isang sistematikong paliwanag sa ugnayan ng banal at pantaong pagkilos. Kaya hindi idinagdag ang “kakayahan” ni pinalambot ang tahasang pagkilos ng Diyos.
- issue: Kahulugan ng ὑπὲρ sa pariralang ὑπὲρ τῆς εὐδοκίας
  choice: 'Layunin: “ang nakalulugod sa kanya.”'
  alternative: 'Pamantayan: “ayon sa kanyang mabuting kalooban.”'
  rationale: Karaniwang nagpapahiwatig dito ang ὑπέρ na may genitive ng layunin o kapakanan, ngunit posible rin ang pagbasa ayon sa pamantayan; kaya isinama ang alternatibo sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “loobin” upang mapanatili ang volitional na diwa nang hindi nagiging teknikal; ang “sa inyo” ay sadyang hindi nilinaw bilang indibiduwal lamang o pangkapulungan.
