id: PHP.2.27
reference: Philippians 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: tl
  text: Sapagkat talagang nagkasakit siya at muntik nang mamatay; ngunit kinaawaan siya ng Diyos—at hindi lamang siya kundi pati ako—upang hindi ako magkaroon ng patong-patong na kalungkutan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kalungkutan sa ibabaw ng kalungkutan,” na nangangahulugang dagdag o patong-patong na kalungkutan.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: nagkasakit
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pisikal na karamdaman ni Epafrodito. Likas sa modernong Tagalog ang “nagkasakit” at naipahihiwatig nito ang pangyayaring inilalarawan ng aorist.
- source_word: παραπλήσιον θανάτῳ
  choice: muntik nang mamatay
  rationale: Ipinahahayag nito nang natural na napakalapit siya sa kamatayan ngunit hindi namatay. Mas karaniwan at malinaw ito kaysa sa literal na “malapit sa kamatayan.”
- source_word: ἠλέησεν αὐτόν
  choice: kinaawaan siya
  rationale: Pinananatili ng “kinaawaan” ang diwa ng habag o awa ng Diyos at natural itong ginagamit sa Tagalog sa ganitong konstruksiyon.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: at hindi lamang siya kundi pati ako
  rationale: Pinananatili nito ang paghahambing at diin ng Griyego; malinaw mula sa naunang sugnay na ang awa ng Diyos ang kapuwa tinanggap niya at ni Pablo.
- source_word: ἵνα μὴ ... σχῶ
  choice: upang hindi ako magkaroon
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα μή, samantalang ang “magkaroon” ay tuwirang katumbas ng σχῶ sa idyomang ito.
- source_word: λύπην ἐπὶ λύπην
  choice: patong-patong na kalungkutan
  rationale: Likas na idyomang Tagalog ito para sa naipong o nadagdagang dalamhati, habang pinananatili ang retorikal na ideya ng isang kalungkutang idinaragdag sa isa pa.
theological_decisions:
- issue: Ang awa ng Diyos kay Pablo sa paggaling ni Epafrodito
  choice: kinaawaan siya ng Diyos—at hindi lamang siya kundi pati ako
  alternative: nagpakita ng awa ang Diyos sa kaniya, at hindi lamang sa kaniya kundi pati sa akin
  rationale: Pinananatili ang pahayag na ang paggaling ni Epafrodito ay awa rin kay Pablo, nang hindi nagpapaliwanag kung paano o nagdaragdag ng isang tiyak na doktrina tungkol sa paggaling.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “muntik nang mamatay” bilang natural na salin ng pagkakalapit sa kamatayan. Ang tanging talababa ay nagpapakita sa literal na anyo ng idyoma; hindi kailangan ang hiwalay na talababa para rito sa pangunahing parirala dahil malinaw ang salin.
