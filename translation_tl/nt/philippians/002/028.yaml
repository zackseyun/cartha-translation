  source_fidelity: 'Kailangang baguhin ang “lalo akong nagmadaling ipadala siya,” dahil ang σπουδαιοτέρως ay nagsasaad ng higit na kasigasigan o pananabik, hindi ng pagmamadali. Ang huling sugnay ay mas tapat kung si Pablo mismo ang tahasang paksa ng paghahambing: “ako naman ay hindi gaanong malungkot.”'
