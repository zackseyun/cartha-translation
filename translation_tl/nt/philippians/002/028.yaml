  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: tl
  text: Kaya lalo ko siyang ipinadala nang may pananabik, upang kapag muli ninyo siyang makita ay magalak kayo, at ako naman ay hindi gaanong malungkot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: lalo akong nagmadaling
  rationale: 'Ipinapahayag nito ang paghahambing na lakas ng pang-abay: higit na kasabikan o pagmamadali sa pagpapadala. Likas sa modernong Tagalog ang pandiwang pariralang ito.'
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at natural na nag-uugnay sa konklusyon o pagpapatuloy mula sa naunang paliwanag.
- source_word: ἔπεμψα
  choice: ipadala
  rationale: Kasama ng “nagmadali,” likas nitong ipinahahayag ang naganap na kilos ng pagpapadala nang hindi pinabibigat ang pangungusap.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang layuning ipinahahayag ng sugnay.
- source_word: ἰδόντες
  choice: kapag nakita ninyo
  rationale: Natural na ginagawang temporal na kalagayan sa loob ng sugnay ng layunin ang aorist participle.
- source_word: πάλιν
  choice: muli
  rationale: Tumutukoy sa muli nilang pagkakita kay Epafrodito.
- source_word: χαρῆτε
  choice: magalak kayo
  rationale: Pinananatili ang diwa ng χαίρω at ang layunin o inaasahang bunga ng pagpapadala.
- source_word: κἀγὼ
  choice: at ... naman ang aking
  rationale: Ang “at” ay nagpapanatili sa koordinasyon, samantalang ang “naman” ay natural na nagpapakita ng paglipat sa kalagayan ni Pablo nang hindi dinaragdagan ang kahulugan.
- source_word: ἀλυπότερος
  choice: mabawasan ... ang aking kalungkutan
  rationale: Ipinapahayag ang comparative na ‘hindi gaanong malungkot’ sa mas natural na Tagalog, habang nananatiling nakatuon sa dalamhati o kalungkutan at hindi partikular na pagkabalisa.
- source_word: ὦ
  choice: mabawasan ... ang aking kalungkutan
  rationale: Isinasama ang diwa ng subjunctive na ‘ako ay maging hindi gaanong malungkot’ sa isang natural na pandiwang konstruksiyon sa Tagalog.
