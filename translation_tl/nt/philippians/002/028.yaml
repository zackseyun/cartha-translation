  to: Kaya lalo ko siyang ipinadala nang may pananabik, upang kapag muli ninyo siyang makita ay magalak kayo, at ako naman ay hindi gaanong malungkot.
  rationale: Pinalitan ang pandiwang nagpapahiwatig ng pagmamadali ng pariralang nagsasaad ng higit na pananabik, upang maipahayag ang σπουδαιοτέρως nang hindi nagdaragdag ng ideya ng apurahang bilis. Inayos din ang pangwakas na sugnay upang mapanatili ang tahasang comparative na kalagayan ni Pablo.
