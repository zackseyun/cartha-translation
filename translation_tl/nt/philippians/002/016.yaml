  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: tl
  text: habang mahigpit ninyong pinanghahawakan ang salita ng buhay[a], upang may maipagmalaki ako sa araw ng Mesiyas[b], sapagkat hindi ako tumakbo nang walang kabuluhan ni nagpagal nang walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “habang inihaharap” o “habang iniaalok ninyo ang salita ng buhay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “araw ni Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: salita ng buhay
  rationale: Pinananatili nito ang maikli at masinsing pariralang Griyego, pati ang posibleng diwa ng salitang nagbibigay-buhay at salitang tungkol sa buhay.
- source_word: ἐπέχοντες
  choice: nanghahawak nang mahigpit
  rationale: Maaaring mangahulugan ang pandiwa ng mahigpit na paghawak o ng pag-aabot/paghaharap. Sa daloy ng pangaral tungkol sa matatag na pagsunod, ang mahigpit na paghawak ang pinakamalinaw, habang inilalagay sa talababa ang ibang tunay na posibilidad.
- source_word: καύχημα
  choice: maipagmamalaki
  rationale: Natural itong Filipino para sa bagay o dahilan ng wastong pagmamalaki, at malinaw na ang mga taga-Filipos ang magiging dahilan ng pagmamalaki ni Pablo.
- source_word: ἡμέραν Χριστοῦ
  choice: araw ng Mesiyas
  rationale: Titular ang Χριστοῦ sa eskatolohikal na pariralang ito. Pinananatili ng “Mesiyas” ang maharlika at pinahirang diwa ng titulo.
- source_word: οὐκ εἰς κενὸν
  choice: hindi ... nang walang kabuluhan
  rationale: Malinaw na ipinahahayag ang kawalan ng bunga o saysay at napapanatili ang magkatulad na ayos ng dalawang sugnay.
- source_word: ἔδραμον
  choice: tumakbo
  rationale: Pinananatili ang metaporang pampalakasan ni Pablo para sa kanyang paglilingkod.
- source_word: ἐκοπίασα
  choice: nagpagal
  rationale: Ipinahahayag nito ang mabigat at puspusang paggawa at maayos na kaagapay ng “tumakbo.”
theological_decisions:
- issue: Paglalarawan sa Χριστοῦ sa eskatolohikal na titulong ἡμέραν Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang ito, aktibo ang titular at eskatolohikal na diwa ng Χριστός, kaya “Mesiyas” ang pangunahing salin; pinananatili sa talababa ang tradisyonal na “Cristo.”
- issue: Ugnayan ng εἰς καύχημα ἐμοὶ sa araw ng Mesiyas
  choice: Sa gayon, magkakaroon ako ng maipagmamalaki sa araw ng Mesiyas
  alternative: bilang maipagmamalaki ko sa araw ng Mesiyas
  rationale: Natural nitong ipinapakita sa Filipino ang layunin o resultang ipinahihiwatig ng εἰς nang hindi ginagawang makasarili o makasalanan ang pagmamalaki ni Pablo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nanghahawak nang mahigpit” upang maging malinaw ang patuloy na kilos ng participle, at pinanatili ang retorikal na pag-uulit ng “nang walang kabuluhan.”
