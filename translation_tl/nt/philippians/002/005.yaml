  text: Taglayin ninyo sa isa't isa ang ganitong pag-iisip[a], na taglay rin ng Mesiyas na si Jesus,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “Taglayin ninyo sa isa''t isa ang ganitong pag-iisip na taglay rin ninyo sa Mesiyas na si Jesus.”'
