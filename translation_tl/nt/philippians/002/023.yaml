  register: Modernong Filipino Tagalog na natural at marangal ang ginamit. Iniwasan ang sobrang literal na “ang isang ito,” ngunit pinanatili sa talababa ang mas tuwirang anyo ng pariralang tumutukoy sa kalagayan ni Pablo.
