  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: tl
  text: Kaya nga, umaasa akong ipadala ko siya agad kapag nakita ko nang malinaw kung ano ang kalagayan ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kaya nga, umaasa akong ipadala ko siya agad sa sandaling makita ko ang mga bagay na may kinalaman sa akin.”'
    reason: Pinananatili ng alternatibong ito ang mas literal na “makita” para sa ἀφίδω at “mga bagay na may kinalaman sa akin” para sa τὰ περὶ ἐμέ.
lexical_decisions:
- source_word: τοῦτον
  choice: siya
  rationale: Tumutukoy ang panghalip na pamatlig kay Timoteo sa naunang konteksto; ang “siya” ang likas na katumbas sa modernong Tagalog.
- source_word: μὲν οὖν
  choice: Kaya
  rationale: Nagpapahiwatig ito ng lohikal na paglipat mula sa naunang sinabi; malinaw at natural itong naihahatid ng “Kaya.”
- source_word: ἐλπίζω πέμψαι
  choice: umaasa akong ipadala
  rationale: Pinananatili ng “umaasa” ang diwa ng pag-asa o inaasahang gagawin nang hindi ito ginagawang tiyak na plano.
- source_word: ὡς ἂν ἀφίδω
  choice: kapag nalaman ko na
  rationale: Ipinahahayag ng parirala ang isang panghinaharap na panahong nakasalalay sa pagkaunawa ni Pablo sa magiging kalagayan niya; likas sa Tagalog ang “kapag nalaman ko na.”
- source_word: τὰ περὶ ἐμέ
  choice: kung ano ang mangyayari sa akin
  rationale: Sa konteksto, tumutukoy ito sa mga pangyayari o kalagayang may kinalaman kay Pablo, hindi lamang sa isang hiwalay na bagay.
- source_word: ἐξαυτῆς
  choice: agad
  rationale: Ipinahahayag ng pang-abay ang agarang pagpapadala kapag nalinaw na kay Pablo ang kanyang kalagayan.
