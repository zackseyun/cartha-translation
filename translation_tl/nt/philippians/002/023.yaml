  verdict: revise
  source_fidelity: Kailangang baguhin ang “kung ano ang mangyayari sa akin,” dahil inililipat nito ang τὰ περὶ ἐμέ sa mga pangyayaring darating. Tumutukoy ang parirala sa mga bagay o kalagayang may kinalaman kay Pablo. Ang “kapag nakita ko nang malinaw kung ano ang kalagayan ko” ay pinananatili ang pag-alam/pagkakita at ang nakasalalay na panghinaharap na panahon ng ὡς ἂν ἀφίδω.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Kaya nga, umaasa akong ipadala ko siya agad kapag nakita ko nang malinaw kung ano ang kalagayan ko.” Mas malinaw ang aktibong “ipadala ko siya” kaysa sa dating anyong maaaring bahagyang malabo ang gumaganap.
  terminology: Walang problemang pangteolohikal o pangngalan. Ang “kalagayan ko” ay angkop na kontekstuwal na katumbas ng τὰ περὶ ἐμέ, habang ang talababa ay nagbibigay ng mas literal na alternatibo.
