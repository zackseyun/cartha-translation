  - severity: low
    issue: Bahagyang malabo ang “umaasa akong ipadala siya.”
    rationale: Bagaman maiintindihan, mas malinaw at likas ang “umaasa akong ipadala ko siya,” na tahasang ipinapakita ang aktibong pagpapadala ni Pablo.
