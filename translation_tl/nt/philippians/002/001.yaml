id: PHP.2.1
reference: Philippians 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: tl
  text: Kaya, kung may anumang pagpapalakas-loob sa Mesias, kung may anumang kaaliwang dulot ng pag-ibig, kung may anumang pakikibahagi sa Espiritu[a], at kung may anumang malasakit at habag,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pakikisamang dulot ng Espiritu”; di-gaanong malamang, “pakikisama sa espiritu.”
    reason: Pinananatili ang kalabuan ng κοινωνία πνεύματος hinggil sa eksaktong ugnayan ng κοινωνία at πνεύματος.
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na ipinahihiwatig ang lohikal na kaugnayan nito sa naunang sinabi ni Pablo.
- source_word: παράκλησις
  choice: pagpapalakas-loob
  rationale: Saklaw nito ang pagpapatibay at pag-aliw nang hindi nililimitahan ang diwa sa utos o emosyonal na pagdamay lamang.
- source_word: ἐν Χριστῷ
  choice: sa Mesias
  rationale: Pinananatili ang batayang puwersa ng ἐν at ang titulong kahulugan ng Χριστός, ayon sa patakaran ng proyekto.
- source_word: παραμύθιον ἀγάπης
  choice: kaaliwang dulot ng pag-ibig
  rationale: Ang παραμύθιον ay tumutukoy sa mapagpalubag o mapang-aliw na pananalita; ipinahahayag ng “dulot ng” ang malamang na ugnayang pinagmulan ng genitibong ἀγάπης sa natural na Tagalog.
- source_word: κοινωνία πνεύματος
  choice: pakikibahagi sa Espiritu
  rationale: Ang “pakikibahagi” ay likas na Tagalog para sa κοινωνία bilang sharing o participation. Malamang na ang πνεύματος ay tumutukoy sa Banal na Espiritu, ngunit inilalahad sa talababa ang ibang posibleng ugnayan ng genitibo.
- source_word: σπλάγχνα
  choice: pagmamahal
  rationale: Bagaman literal na tumutukoy sa mga kaloob-looban, idyomatiko itong nangangahulugang malalim at magiliw na damdamin. Ang “pagmamahal” ay malinaw at marangal sa kasalukuyang Tagalog.
- source_word: οἰκτιρμοί
  choice: habag
  rationale: Natural at tuwirang katumbas ito ng mahabaging awa o compassion, at naiiba pa rin sa σπλάγχνα.
theological_decisions:
- issue: Kung ang πνεύματος ay tumutukoy sa Banal na Espiritu at kung paano iuugnay ang genitibo sa κοινωνία
  choice: pakikibahagi sa Espiritu
  alternative: pakikisamang dulot ng Espiritu; pakikisama sa espiritu
  rationale: Malamang na Banal na Espiritu ang tinutukoy dahil sa konteksto ng mga pagpapalang Cristiano. Gayunman, hindi tahasang tinutukoy ng maigsi at genitibong parirala kung ito ay pakikibahagi sa Espiritu, pakikisamang nililikha ng Espiritu, o—bagaman di-gaanong malamang—pakikisama sa antas ng espiritu. Pinananatili ng talababa ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “kung may anumang” upang mapanatili ang retorikal na ayos ng apat na sugnay sa Griyego. Nagtatapos sa kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata.
