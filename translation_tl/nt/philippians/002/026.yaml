translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang causal na simula ng talata at ang tindi ng pananabik at pagkabagabag. Hindi isinama ang alternatibong talababa ng English POB sapagkat malinaw na ikalawang panauhang maramihan ang ἠκούσατε sa ibinigay na tekstong Griyego; ang pagdaragdag ng “nabalitaan niya” ay walang hayag na katumbas sa source text.
