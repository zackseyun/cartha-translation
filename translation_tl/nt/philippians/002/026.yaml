translation:
  language: tl
  text: Sapagkat labis niyang pinananabikan kayong lahat at labis siyang nababagabag dahil nabalitaan ninyong nagkasakit siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag tungkol sa pagpapabalik kay Epafrodito; likas at malinaw ang “Sapagkat” sa ganitong ugnayang sanhi.
- source_word: ἐπιποθῶν ἦν
  choice: sabik na sabik siyang makita
  rationale: Ipinahihiwatig ng περιφραστικήong anyo ang nagpapatuloy na matinding pananabik noong panahong tinutukoy. Ginagawang natural sa Filipino ng “makita” ang pananabik na nakatuon sa mga tao nang hindi binabago ang diwa.
- source_word: πάντας ὑμᾶς
  choice: kayong lahat
  rationale: Pinananatili nito ang tahasang diin ng πάντας na walang sinuman sa mga kausap ang hindi kabilang.
- source_word: ἀδημονῶν
  choice: labis siyang nababagabag
  rationale: Ang salita ay tumutukoy sa matinding emosyonal na pagkabalisa, hindi lamang sa bahagyang pag-aalala.
- source_word: διότι
  choice: dahil
  rationale: Direktang ipinapahayag ang sanhi ng kanyang pagkabagabag.
- source_word: ἠκούσατε
  choice: nabalitaan ninyo
  rationale: Ang pandiwa ay ikalawang panauhang maramihan at tumutukoy sa pagtanggap nila ng balita; mas natural sa konteksto ang “nabalitaan” kaysa literal na “narinig.”
- source_word: ὅτι ἠσθένησεν
  choice: nagkasakit siya
  rationale: Sa konteksto, pisikal na karamdaman ang tinutukoy ng ἀσθενέω. Naipapakita ng “nagkasakit” ang pangyayaring inilahad ng aorist nang natural sa Filipino.
