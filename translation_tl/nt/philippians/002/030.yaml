- from: Sapagkat alang-alang sa gawain[c] ng Mesiyas[a], umabot siya sa bingit ng kamatayan. Isinapanganib niya ang kanyang buhay upang punan ang kakulangan sa paglilingkod ninyo sa akin.[b]
  to: Dahil sa gawain[c] ng Mesiyas[a], umabot siya sa bingit ng kamatayan, isinapanganib ang kanyang buhay upang punan ang kakulangan[b] sa paglilingkod ninyo sa akin.
  rationale: Pinakinis ang panimulang parirala upang maging likas sa modernong Filipino habang pinananatili ang ugnayang sanhi ng Griyego. Pinagdugtong ang paglapit sa kamatayan at ang pagsasapanganib ng buhay sa isang pangungusap upang malinaw na maipakita ang participial na παραβολευσάμενος. Inayos ang talababa [c] at ang puwesto ng [b] nang hindi binabago ang kahulugan.
