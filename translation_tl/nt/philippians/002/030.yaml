  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: tl
  text: Dahil sa gawain[c] ng Mesiyas[a], umabot siya sa bingit ng kamatayan, isinapanganib ang kanyang buhay upang punan ang kakulangan[b] sa paglilingkod ninyo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Cristo.” Sa Griyego: “ang gawain ng Cristo/Mesiyas.”'
    reason: alternative_reading
  - marker: b
    text: Ang “kakulangan” ay tumutukoy sa paglilingkod na hindi personal na magawa ng mga taga-Filipos dahil wala sila roon, hindi sa kawalan nila ng kagustuhang tumulong.
    reason: cultural_note
  - marker: c
    text: O “alang-alang sa gawain.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι διὰ τὸ ἔργον Χριστοῦ
  choice: Sapagkat alang-alang sa gawain ng Mesiyas
  rationale: Ipinahihiwatig ng ὅτι ang dahilan, at ang διά na may accusative ay maaaring mangahulugang “dahil sa” o “alang-alang sa.” Pinili ang “alang-alang sa” upang natural na maipakita na hinarap niya ang panganib para sa gawain. Isinalin ang Χριστοῦ bilang titulong “Mesiyas.”
- source_word: μέχρι θανάτου ἤγγισεν
  choice: umabot siya sa bingit ng kamatayan
  rationale: Natural at marangal na Filipino ito para sa ideyang napakalapit na niyang mamatay, habang pinananatili ang larawan ng paglapit sa kamatayan.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: Isinapanganib niya ang kanyang buhay
  rationale: Ang participle ay tumutukoy sa kusang pagharap sa matinding panganib; ang ψυχή rito ay ang buhay ng tao, hindi partikular na ang di-materyal na kaluluwa.
- source_word: ἵνα ἀναπληρώσῃ
  choice: upang punan
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at ng “punan” ang diwa ng paglalaan ng kulang.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: ang kakulangan
  rationale: Tuwirang ipinapakita nito ang bagay na hindi nila naibigay dahil sa kanilang pagkalayo, nang hindi awtomatikong itinuturing na moral na pagkukulang.
- source_word: τῆς πρός με λειτουργίας
  choice: sa paglilingkod ninyo sa akin
  rationale: Saklaw ng “paglilingkod” ang praktikal na tulong at ministeryong ginawa para kay Pablo nang hindi nililimitahan ang kahulugan.
theological_decisions:
- issue: Paglalarawan sa Χριστοῦ sa pariralang Paulino
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo; pinananatili ng “Mesiyas” ang kahulugan nito sa halip na tratuhing pangalan lamang.
- issue: Kahulugan ng kakulangan sa paglilingkod ng mga taga-Filipos
  choice: Pinanatili sa teksto ang “kakulangan,” na nililinaw sa talababa bilang kawalan ng personal na pagkakataong maglingkod
  alternative: Isama sa pangunahing teksto na hindi sila makapaglingkod nang personal
  rationale: Pinananatili nito ang anyo at posibleng tensiyon ng ὑστέρημα nang hindi nagpapahiwatig ng kawalan ng malasakit o tahimik na nagpapasok ng paliwanag sa mismong talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang “umabot sa bingit ng kamatayan” ay mas natural kaysa literal na “nalapit sa kamatayan,” at ang “isinapanganib” ay malinaw nang hindi kolokyal. Inilagay ang lahat ng marker na [a], [b], at [c] sa pangunahing teksto.
