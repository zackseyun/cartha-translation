  naturalness: Mas natural ang iisang pangungusap na may pandiwaring participial na “isinapanganib ang kanyang buhay,” na mahigpit na inuugnay sa paglapit niya sa kamatayan. Inilipat din ang [b] upang direktang tumukoy sa “kakulangan.”
  terminology: Ang “Mesiyas” ay angkop para sa Χριστοῦ bilang titulo. Ang “gawain,” “bingit ng kamatayan,” “buhay,” at “paglilingkod” ay tapat at natural na katumbas sa kontekstong ito.
