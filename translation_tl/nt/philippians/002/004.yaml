  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: tl
  text: Huwag lamang ang sariling kapakanan ang tingnan ng bawat isa,[a] kundi pati ang kapakanan ng iba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Huwag lamang tingnan ng bawat isa ang sarili niyang mga bagay, kundi pati ang mga bagay ng iba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: tingnan
  rationale: Ipinahihiwatig ng σκοπέω dito ang maingat na pagbibigay-pansin o pagsasaalang-alang. Likas sa modernong Tagalog ang “tingnan” sa ganitong diwa at hindi ito nililimitahan sa literal na pagtanaw.
- source_word: τὰ ἑαυτῶν
  choice: sarili niyang kapakanan
  rationale: Ang substantivized neuter plural na parirala ay mas malawak kaysa mga pag-aari lamang at tumutukoy sa sariling mga usapin, interes, o kapakanan. Ang “kapakanan” ay malinaw at natural sa konteksto.
- source_word: ἕκαστοι
  choice: bawat isa
  rationale: 'Pinananatili nito ang distributibong diwa ng ἕκαστοι: ang bawat taong kabilang sa pamayanan ay isa-isang tinutukoy.'
- source_word: ἀλλὰ καὶ
  choice: hindi ... lamang, kundi pati
  rationale: 'Natural na ipinahahayag sa Tagalog ng hulmaing ito ang magkasamang pagsalungat at pagdaragdag: hindi inaalis ang sariling kapakanan, ngunit isinasama rin ang sa iba.'
- source_word: τὰ ἑτέρων
  choice: ang kapakanan ng iba
  rationale: Katulad ng τὰ ἑαυτῶν, malawak ang saklaw nito at maaaring tumukoy sa mga usapin, interes, o kalagayan ng iba; malinaw itong naihahatid ng “kapakanan ng iba.”
theological_decisions:
- issue: Kung ipinagbabawal ba ang anumang pagtingin sa sariling kapakanan
  choice: “sarili lamang niyang kapakanan ... kundi pati”
  alternative: “huwag tingnan ang sariling kapakanan, kundi ang sa iba”
  rationale: 'Ang καί sa ἀλλὰ καί ay nagpapahiwatig ng pagdaragdag: hindi lubusang itinatanggi ang pag-aasikaso sa sariling kapakanan; tinututulan ang eksklusibong pagtuon dito at iniuutos na isaalang-alang din ang iba.'
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kapakanan” upang natural na katawanin ang malawak na mga pariralang τὰ ἑαυτῶν at τὰ ἑτέρων, habang inilagay sa talababa ang mas literal na anyo.
