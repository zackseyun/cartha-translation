  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: tl
  text: May tiwala ako sa Panginoon na ako mismo ay darating rin sa lalong madaling panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagtitiwala ako sa Panginoon na ako rin mismo ay darating sa lalong madaling panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθα
  choice: nagtitiwala ako
  rationale: Ang perpektong anyo ay nagpapahayag ng matatag at nagpapatuloy na pagtitiwala; natural ito sa makabagong Tagalog at pinananatili ang personal na pag-asa ni Pablo.
- source_word: δὲ
  choice: Ngunit
  rationale: Banayad na pang-ugnay ito sa naunang pahayag; ang “Ngunit” ay angkop sa bahagyang paglipat mula sa planong isugo si Timoteo tungo sa pag-asang makararating din si Pablo.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili nito ang karaniwang idyomang Paulino at ipinahihiwatig na ang pagtitiwala ni Pablo ay nakasalig at umiiral sa kaugnayan niya sa Panginoon.
- source_word: ὅτι
  choice: na
  rationale: Likas na ipinakikilala ng “na” ang nilalaman ng pagtitiwala sa Tagalog.
- source_word: καὶ αὐτὸς
  choice: ako mismo ay ... din
  rationale: Pinananatili ng “ako mismo” ang diin ng αὐτός, habang ipinapahayag ng “din” ang pandagdag na diwa ng καί kaugnay ng pagpunta ni Timoteo.
- source_word: ταχέως
  choice: sa lalong madaling panahon
  rationale: Tumutukoy ito sa nalalapit na panahon, hindi sa bilis ng paglalakbay; malinaw at likas ang pariralang ito sa Tagalog.
- source_word: ἐλεύσομαι
  choice: darating
  rationale: Pinananatili ang deiktikong pananaw ng ἔρχομαι mula sa panig ng mga taga-Filipos na pupuntahan ni Pablo.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ito ang karaniwan at angkop na salin ng κύριος sa kontekstong Paulino.
theological_decisions:
- issue: Batayan at katangian ng pagtitiwala ni Pablo “sa Panginoon”
  choice: nagtitiwala ako sa Panginoon
  alternative: umaasa ako sa Panginoon / nagtitiwala ako na sa tulong ng Panginoon
  rationale: Pinananatili ng salin ang teolohikal na pag-asa ni Pablo na nakaugat sa Panginoon, nang hindi ipinapalagay na ito ay tahasang pahayag ng banal na kapahayagan o lubos na katiyakang hiwalay sa kalooban ng Panginoon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagtitiwala” sa halip na mas pormal na “nakakatiyak” upang mapanatili ang ugnayang diwa ng ἐν κυρίῳ, at ang “ako mismo ... din” upang maipakita kapwa ang diin at pandagdag na kahulugan ng καὶ αὐτός.
