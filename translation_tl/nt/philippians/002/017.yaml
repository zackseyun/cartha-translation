  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: tl
  text: Ngunit kahit na ibinubuhos ako bilang handog na inumin[a] bilang dagdag sa hain at paglilingkod[b] ng inyong pananampalataya[c], nagagalak ako at nakikigalak sa inyong lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinubuhos ako bilang libasyon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “paglilingkod” ay maaari ring isaling “banal na paglilingkod” o “ministeryo”; taglay ng Griyego rito ang diwa ng paglilingkod sa pagsamba.
    reason: lexical_alternative
  - marker: c
    text: O “katapatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: ibinubuhos ako bilang handog na inumin
  rationale: Pinananatili nito ang larawan ng libasyong ibinubuhos sa paghahandog at malinaw itong nauunawaan sa makabagong Filipino.
- source_word: ἐπὶ
  choice: sa ibabaw ng
  rationale: Inilalarawan nito ang buhay ni Pablo bilang handog na inuming ibinubuhos sa ibabaw ng, o idinaragdag sa, hain ng mga taga-Filipos; hindi nito pinapawi ang posibleng kaugnayang panritwal.
- source_word: θυσίᾳ
  choice: hain
  rationale: Ang “hain” ay likas at tuwirang salitang Filipino para sa paghahandog at nagpapanatili sa wikang panritwal ng talata.
- source_word: λειτουργίᾳ
  choice: paglilingkod
  rationale: Sapat itong malawak upang mapanatili ang karaniwang kahulugang paglilingkod, habang ipinahihiwatig ng katabing “hain” ang konteksto ng pagsamba nang hindi tahasang nagdaragdag ng “pagkapari.”
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang pinakakaraniwang kahulugan dito at pinananatili ang ugnayan ng kanilang pananampalataya sa hain at paglilingkod; itinatala sa talababa ang posibleng “katapatan.”
- source_word: χαίρω
  choice: nagagalak ako
  rationale: Pinananatili nito ang mahalagang tema ng kagalakan sa Filipos at ang kasalukuyang pahayag ni Pablo.
- source_word: συγχαίρω
  choice: nakikigalak
  rationale: Likas nitong ipinapahayag sa Filipino ang pakikibahagi ni Pablo sa kagalakan ng buong kapulungan.
- source_word: πᾶσιν ὑμῖν
  choice: sa inyong lahat
  rationale: Pinananatili nito ang tahasang pagbibigay-diin ni Pablo sa buong kapulungan.
theological_decisions:
- issue: Larawang panritwal para sa posibleng kamatayan ni Pablo
  choice: Inilalarawan ni Pablo ang sarili bilang handog na inuming ibinubuhos sa ibabaw ng hain at paglilingkod ng pananampalataya ng mga taga-Filipos.
  alternative: Ilarawan lamang ang pagbubuhos ng buhay ni Pablo kaugnay ng kanilang paglilingkod, nang hindi idiin ang larawang paghahandog.
  rationale: Ang magkakaugnay na σπένδομαι, θυσία, at λειτουργία ay matibay na nagpapahiwatig ng paghahandog at pagsamba. Gayunman, hindi nilinaw sa salin kung tiyak na kamatayan o mas malawak na pagsasakripisyo ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hain” at “handog na inumin” upang mapanatili ang magkakaugnay na larawan ng pagsamba, ngunit iniwasan ang mas tiyak na “paglilingkod ng pari” dahil hindi tahasang binanggit ang pari sa Griyego. Ang “nakikigalak” ay natural na katumbas ng sama-samang kagalakan.
