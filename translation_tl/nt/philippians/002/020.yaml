lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang sinabi.
- source_word: οὐδένα ... ἔχω
  choice: wala akong sinuman
  rationale: Direkta at likas na pagpapahayag ng kawalan ng taong inilalarawan, nang hindi nagdaragdag ng tahasang paghahambing.
- source_word: ἰσόψυχον
  choice: kaisa ko ng kalooban
  rationale: Ipinahihiwatig ang pagkakapantay o malapit na pagkakatulad ng panloob na disposisyon ni Timoteo at ni Pablo, habang nananatiling malinaw sa modernong Tagalog.
- source_word: ὅστις
  choice: na
  rationale: Likas na pang-ugnay sa Tagalog para ipakilala ang katangiang nagpapakilala sa taong tinutukoy.
- source_word: γνησίως
  choice: tunay na
  rationale: Ipinahahayag ang tapat at hindi pakunwaring malasakit.
- source_word: τὰ περὶ ὑμῶν
  choice: inyong kapakanan
  rationale: Likas na buod sa Tagalog ng mga bagay na may kinalaman sa kalagayan at interes ng mga taga-Filipos.
- source_word: μεριμνήσει
  choice: magmamalasakit
  rationale: Sa kontekstong ito, positibong pagkalinga ang diwa ng pandiwa, hindi nakasasamang pagkabalisa; ipinahahayag din ng anyong ito ang hinaharap.
