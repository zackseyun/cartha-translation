  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: tl
  text: upang sa pangalan ni Jesus ay lumuhod ang bawat tuhod ng mga nasa langit, nasa lupa, at nasa ilalim ng lupa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o kinalabasan mula sa naunang pahayag.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: sa pangalan ni Jesus
  rationale: Pinananatili nito ang sadyang kalabuan kung ang diwa ay pagtugon sa pangalan ni Jesus o pagkilos sa loob ng saklaw ng kanyang pangalan; hindi ito nililimitahan sa 'pagbanggit' lamang.
- source_word: πᾶν γόνυ
  choice: ang bawat tuhod
  rationale: Pinananatili ang matingkad na larawang pisikal at ang diin sa pangkalahatang pagpupugay, sa halip na gawing abstraktong 'bawat nilalang.'
- source_word: κάμψῃ
  choice: ay lumuhod
  rationale: Natural na Tagalog para sa pagyukod ng tuhod bilang tanda ng pagpupugay; ang anyong nasa ilalim ng ἵνα ay sapat nang naihahayag ng 'upang ... ay.'
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: ng mga nasa langit, nasa lupa, at nasa ilalim ng lupa
  rationale: Sinasalamin ang mga pang-uring ginamit bilang pangngalan at pinananatili ang tatluhang kosmikong saklaw nang hindi tinutukoy nang higit sa sinasabi ng Griyego kung sinu-sino ang mga ito.
theological_decisions:
- issue: Kahulugan ng ἐν τῷ ὀνόματι Ἰησοῦ
  choice: sa pangalan ni Jesus
  alternative: sa pagbanggit sa pangalan ni Jesus
  rationale: Hindi tahasang sinasabi ng Griyego na ang pagbanggit o pagbigkas sa pangalan ang sanhi ng pagluhod. Ang mas tuwirang salin ay nagpapanatili sa mas malawak na posibleng diwa.
- issue: Saklaw at pagkakakilanlan ng ἐπουρανίων, ἐπιγείων, at καταχθονίων
  choice: Mga nasa tatlong kosmikong saklaw, nang hindi higit na pinapangalanan
  alternative: mga anghel, mga tao, at mga demonyo o mga patay
  rationale: Binibigyang-diin ng talata ang pangkalahatang pagpupugay kay Jesus, ngunit hindi nito tahasang itinatalaga ang mga pangkat sa mga partikular na uri ng nilalang.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'lumuhod' bilang natural na pagpapahayag ng κάμπτω γόνυ, habang inilagay sa talababa ang mas pormal na 'yumukod ang bawat tuhod.' Pinanatili ang genitibong ugnayan sa 'ng mga nasa...' at ang kosmikong tatluhan ng orihinal.
