id: PHP.2.15
reference: Philippians 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: tl
  text: upang kayo’y maging walang kapintasan at dalisay, mga anak ng Diyos na walang dungis sa gitna ng isang liko at baluktot na salinlahi.[b] Sa gitna nila, nagniningning kayo[a] na gaya ng mga tanglaw[c] sa mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakikita kayo” o “lumilitaw kayo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “liko at baluktot na salinlahi” ay malamang na umaalingawngaw sa Deuteronomio 32:5 at inihahambing ang mga anak ng Diyos sa isang tiwaling salinlahi.
    reason: cross_reference
  - marker: c
    text: O, “mga nagbibigay-liwanag.” Maaari ring tumukoy ang salita sa mga tanglaw sa kalangitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o inaasahang bunga ng naunang tagubilin.
- source_word: γένησθε
  choice: kayo’y maging
  rationale: Pinananatili ang diwa ng pagdating sa isang kalagayan, hindi lamang ang pananatili rito.
- source_word: ἄμεμπτοι
  choice: walang kapintasan
  rationale: Malinaw at dignidadong pahayag ng pagiging hindi mapupulaan sa asal.
- source_word: ἀκέραιοι
  choice: dalisay
  rationale: Ipinahahayag ang moral na kalinisan at integridad nang hindi ito nililimitahan sa legal na kawalang-sala.
- source_word: τέκνα θεοῦ
  choice: mga anak ng Diyos
  rationale: Tumpak sa gender-inclusive na τέκνα at natural sa Filipino.
- source_word: ἄμωμα
  choice: walang dungis
  rationale: Inihihiwalay sa naunang ‘walang kapintasan’ at pinananatili ang larawan ng kawalan ng dungis o kapintasan.
- source_word: μέσον γενεᾶς
  choice: sa gitna ng isang ... salinlahi
  rationale: Pinananatili ang kalagayan ng mga anak ng Diyos sa loob ng nakapaligid na salinlahi.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: liko at baluktot
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na matitinding paglalarawang moral at ang posibleng alingawngaw ng Deuteronomio 32:5.
- source_word: ἐν οἷς
  choice: sa gitna nila
  rationale: Ang tinutukoy ay ang mga taong bumubuo sa salinlahi; natural itong pakinggan sa Filipino at iniiwasan ang mekanikal na ‘sa kanila.’
- source_word: φαίνεσθε
  choice: nagniningning kayo
  rationale: Sa kasamang φωστῆρες, nangingibabaw ang diwa ng pagbibigay-liwanag; pinananatili sa talababa ang posibleng kahulugang ‘nakikita’ o ‘lumilitaw.’
- source_word: φωστῆρες
  choice: mga tanglaw
  rationale: Natural na larawang Filipino para sa mga nagbibigay-liwanag at hindi kasingkitid ng ‘mga bituin.’
- source_word: ἐν κόσμῳ
  choice: sa mundo
  rationale: Karaniwan at malinaw na modernong Filipino para sa κόσμος bilang mundong ginagalawan ng tao.
theological_decisions:
- issue: Kaugnayan ng ‘walang dungis’ sa ‘mga anak ng Diyos’ at ang posibleng alingawngaw ng Deuteronomio 32:5
  choice: Iniugnay nang tuwiran ang ‘walang dungis’ sa ‘mga anak ng Diyos’ at iniwang pahiwatig lamang sa pangunahing teksto ang ugnayang tipan sa Deuteronomio 32:5.
  alternative: Iugnay ang ‘walang dungis’ sa buong sugnay, o gawing tahasan sa teksto ang alusyon sa Deuteronomio 32:5.
  rationale: Pinakamalapit sa ayos ng Griyego ang tuwirang paglalarawan sa mga anak ng Diyos. Ang talababa ang angkop na lugar upang ituro ang malamang na alusyon nang hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may dignidad. Ginamit ang ‘salinlahi,’ ‘walang dungis,’ at ‘mga tanglaw’ upang mapanatili ang biblikal na larawan nang hindi nagiging lipas o labis na teknikal. Hinati sa dalawang pangungusap para sa natural na daloy sa Filipino habang pinananatili ang lohikal na ugnayan ng mga sugnay.
