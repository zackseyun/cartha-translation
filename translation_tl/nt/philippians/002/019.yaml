id: PHP.2.19
reference: Philippians 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: tl
  text: Ngunit umaasa ako sa Panginoong Jesus na maipadala ko sa inyo si Timoteo sa madaling panahon, upang mapalakas din ang loob ko kapag nalaman ko ang kalagayan ninyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλπίζω
  choice: umaasa ako
  rationale: Likas at tuwirang ipinahahayag nito ang kasalukuyang pag-asa ni Pablo.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na paglipat o pagsalungat sa naunang konteksto.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  rationale: Pinananatili ang ugnayang saklaw at pagtitiwala ni Pablo sa Panginoong Jesus; ang 'sa' ang natural na katumbas sa Filipino sa pariralang ito.
- source_word: Τιμόθεον
  choice: si Timoteo
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Bibliyang Filipino.
- source_word: ταχέως
  choice: sa lalong madaling panahon
  rationale: Malinaw na tumutukoy sa nalalapit na panahon ng pagpapadala, hindi sa bilis ng paglalakbay.
- source_word: πέμψαι
  choice: na maipadala ko
  rationale: Natural sa Filipino pagkatapos ng 'umaasa ako' at pinananatili ang layunin ni Pablo na siya ang magpadala.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Natural na katumbas ng datibong tumutukoy sa mga padadalhan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na naghuhudyat ng layunin.
- source_word: κἀγὼ
  choice: din ... ako
  rationale: Pinananatili ang diin na si Pablo rin, kasama ng iba, ay mapapalakas ang loob.
- source_word: εὐψυχῶ
  choice: mapalakas ang loob ko
  rationale: Natural at dignified na Filipino para sa pagiging nasa mabuting kalagayan ng kalooban o pagkakaroon ng panibagong sigla.
- source_word: γνοὺς
  choice: kapag nalaman ko
  rationale: Inihahayag nang natural ang temporal na kaugnayan ng aorist participle.
- source_word: τὰ περὶ ὑμῶν
  choice: ang kalagayan ninyo
  rationale: Ipinahahayag ang balita o mga bagay tungkol sa kanila nang hindi gumagamit ng mabigat at di-likas na literalismo.
theological_decisions:
- issue: Pag-render sa κύριος sa pariralang ἐν κυρίῳ Ἰησοῦ
  choice: Panginoon
  alternative: Ginoo / Amo
  rationale: Ang 'Panginoon' ang kinikilalang dignified at christological na titulo sa Bagong Tipan; walang dahilan sa talata upang palitan ito ng mas pangkaraniwang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang sobrang literal na 'mga bagay tungkol sa inyo,' ngunit pinanatili sa 'kalagayan ninyo' ang malawak na saklaw ng τὰ περὶ ὑμῶν. Walang footnote dahil walang kinakailangang tekstuwal o makabuluhang leksikal na alternatibo para sa talatang ito.
