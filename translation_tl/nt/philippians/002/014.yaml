translation:
  language: tl
  text: Gawin ninyo ang lahat nang walang pagrereklamo at pakikipagtalo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “pakikipagtalo” ay maaari ring tumukoy sa “pagtatanong,” “pag-aalinlangan,” o “mga pangangatwiran”; sa kontekstong ito, malamang na mapagtunggaling pagtatalo ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ang lahat
  rationale: Komprehensibo ang gamit ng pangmaramihang akusatibo ng πᾶς; likas sa modernong Tagalog ang “ang lahat” at pinananatili nito ang saklaw ng utos.
- source_word: ποιεῖτε
  choice: Gawin ninyo
  rationale: Ang pangkasalukuyang pautos ay humihiling ng patuloy na asal. Malinaw at natural na naipahahayag ito ng “Gawin ninyo” sa kontekstong ito.
- source_word: χωρὶς
  choice: nang walang
  rationale: Tuwirang ipinahahayag ng pariralang ito na hindi dapat kasabay o bahagi ng kanilang ginagawa ang mga sumusunod na asal.
- source_word: γογγυσμῶν
  choice: pagrereklamo
  rationale: Tumutukoy ang γογγυσμός sa pabulong o mapaghinanakit na pagrereklamo. Ang “pagrereklamo” ay malinaw at karaniwan sa modernong Tagalog, samantalang ang “pagbubulung-bulungan” ay maaari nang mapagkamalang pag-uusap nang palihim o tsismisan.
- source_word: διαλογισμῶν
  choice: pakikipagtalo
  rationale: Bagaman maaaring tumukoy ang salita sa mga pag-iisip, pangangatwiran, o pag-aalinlangan, sa kontekstong ito ay malamang na tumutukoy ito sa mapagtunggaling pakikipagtalo. Pinananatili sa talababa ang tunay na lawak ng kahulugan.
