  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: tl
  text: Kaya naman, lubos din siyang itinaas ng Diyos at buong biyaya niyang ipinagkaloob sa kanya ang pangalang higit sa bawat pangalan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinigay sa kanya” sa halip na “buong biyaya niyang ipinagkaloob sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pangalan” ay maaaring tumukoy hindi lamang sa binibigkas na pangalan kundi pati sa katayuan, ranggo, o titulo; hindi pa tinutukoy ng talatang ito kung aling pangalan ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Kaya naman ... din
  rationale: Pinananatili ng “Kaya naman” ang lohikal na bunga ng διό, at ng “din” ang dagdag na diwa ng καί, sa likas na ayos ng modernong Tagalog.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tahasang simuno at tiyak ang tinutukoy sa Griyego; “ang Diyos” ang karaniwang anyo sa Tagalog.
- source_word: ὑπερύψωσεν
  choice: lubos ... itinaas
  rationale: Ipinahahayag ang pinatinding diwa ng tambalang pandiwa nang hindi gumagamit ng pilit o labis na teknikal na pananalita.
- source_word: ἐχαρίσατο
  choice: buong biyayang ibinigay
  rationale: Pinananatili ang kaugnayan ng pandiwa sa χάρις, “biyaya,” habang nananatiling malinaw at natural sa modernong Tagalog.
- source_word: τὸ ὄνομα
  choice: ang pangalan
  rationale: Tuwirang isinasalin ang “pangalan” at hindi agad ipinapakahulugang titulo, katayuan, o ranggo.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: ang pangalang higit sa bawat pangalan
  rationale: Pinananatili ang paghahambing sa orihinal at ang indibiduwal na puwersa ng πᾶν nang natural sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng “pangalan”
  choice: Iniwan bilang “ang pangalan” nang hindi tinutukoy kung alin iyon sa pangunahing teksto.
  alternative: Tahasang tukuyin ito bilang “Jesus” o bilang banal na titulong “Panginoon.”
  rationale: Hindi pa tahasang kinikilala ng talatang ito ang pangalan; kaya pinananatili ang pagiging bukas ng teksto at hindi ipinapasok sa talata 9 ang interpretasyong mula sa mga sumusunod na talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “buong biyayang ibinigay” upang mailantad ang diwa ng χάρις sa ἐχαρίσατο, at “lubos ... itinaas” upang maipakita ang pinatinding puwersa ng ὑπερύψωσεν. Parehong nakalagay sa pangunahing teksto ang mga panandang [a] at [b].
