  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat lahat sila ay naghahanap ng sarili nilang kapakanan, hindi ng kapakanan ni Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Jesu-Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: nilang lahat
  rationale: Tumutukoy ito sa lahat ng mga taong tinatalakay sa konteksto at pinananatili ang kolektibong diin ng Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan sa naunang pahayag.
- source_word: τὰ ἑαυτῶν
  choice: ang sarili nilang kapakanan
  rationale: Ang pangmaramihang pariralang neuter ay tumutukoy sa mga bagay o interes na para sa sarili; malinaw at likas sa modernong Tagalog ang “sarili nilang kapakanan.”
- source_word: ζητοῦσιν
  choice: inuuna
  rationale: Sa kontekstong may paghahambing ng sariling kapakanan at ng kay Jesus, natural na ipinahahayag ng “inuuna” ang aktibong paghahangad at pansariling pokus, nang hindi dinaragdagan ang saklaw ng diwa.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: ang kapakanan ni Jesus na Mesiyas
  rationale: Inuulit sa Tagalog ang “kapakanan” upang maging malinaw ang elipsis ng Griyego. Ang Χριστοῦ ay pinananatiling titulong “Mesiyas,” at ang “Jesus na Mesiyas” ay likas na anyong Tagalog.
theological_decisions:
- issue: Pagpapahayag sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng Χριστός bilang titulo sa halip na ituring lamang itong bahagi ng pangalan. Itinatala sa talababa ang tradisyonal at pamilyar na anyong “Jesu-Cristo.”
- issue: Saklaw ng τὰ Ἰησοῦ Χριστοῦ
  choice: ang kapakanan ni Jesus na Mesiyas
  alternative: ang mga bagay na nauukol kay Jesus na Mesiyas
  rationale: Ang “kapakanan” ay sumusunod sa kontrast sa τὰ ἑαυτῶν at pinananatili ang moral na diin, samantalang ang alternatibo ay mas literal ngunit hindi gaanong natural.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Inulit ang “kapakanan” sa ikalawang hati upang maiwasan ang malabong “ang kay” at malinaw na maipakita ang simetrikong paghahambing.
