  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: tl
  text: 'Ngunit alam ninyo ang kanyang subok na pagkatao[a]: gaya ng anak na kasama ng kanyang ama, naglingkod siyang kasama ko para sa ebanghelyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “napatunayan nang pagkatao niya.” Ang salitang Griyego ay tumutukoy sa katangiang napatunayang tunay matapos masubok.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang banayad na pagsalungat o paglipat ng diwa mula sa naunang talata.
- source_word: δοκιμὴν αὐτοῦ
  choice: ang kanyang subok na pagkatao
  rationale: Ipinakikita ng “subok” na ang pagkatao ni Timoteo ay napatunayang tunay sa pamamagitan ng pagsubok, hindi lamang na kilala ang kanyang personalidad.
- source_word: γινώσκετε
  choice: alam ninyo
  rationale: Tuwirang ipinahahayag na may umiiral nang personal na kaalaman ang mga taga-Filipos tungkol kay Timoteo.
- source_word: ὅτι
  choice: ':'
  rationale: Ginamit ang tutuldok upang likas na ipakilala sa Filipino ang nilalaman at patunay ng alam nila tungkol kay Timoteo.
- source_word: ὡς πατρὶ τέκνον
  choice: gaya ng anak na kasama ng kanyang ama
  rationale: Pinananatili ang paghahambing at ang neutral-sa-kasariang kahulugan ng τέκνον; likas sa Filipino ang “anak” at hindi kailangang limitahan sa “anak na lalaki.”
- source_word: σὺν ἐμοὶ
  choice: kasama ko
  rationale: Malinaw at likas na naghahayag ng malapit na pakikiisa kay Pablo sa paglilingkod.
- source_word: ἐδούλευσεν
  choice: naglingkod siya
  rationale: Ang pandiwa ay mula sa salitaang kaugnay ng alipin ngunit sa kontekstong ito ay tumutukoy sa masigasig na paglilingkod; iniiwasan ng salin ang labis na literal na “nagpaalipin.”
- source_word: εἰς τὸ εὐαγγέλιον
  choice: para sa ebanghelyo
  rationale: Likas na ipinahahayag ang layon o direksiyon ng magkasama nilang paglilingkod habang pinananatili ang ebanghelyo bilang sentro nito.
theological_decisions:
- issue: Ang ugnayan sa paghahambing na ama at anak
  choice: Pinanatili itong paghahambing sa magkasamang paglilingkod, nang hindi tinutukoy si Pablo bilang literal o opisyal na espirituwal na ama ni Timoteo.
  alternative: Isaling “bilang anak ko” o “bilang espirituwal na anak.”
  rationale: Sinasabi lamang ng Griyego na naglingkod si Timoteo kasama ni Pablo gaya ng anak na kasama ng ama; ang mas tiyak na pagpapakahulugan ay lalampas sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak” upang panatilihin ang likas na neutralidad sa kasarian ng τέκνον, at “ebanghelyo” bilang pamilyar na terminong biblikal.
