  - marker: b
    text: Maaari ring “ituring ang isa't isa na mas mahalaga kaysa sa inyong sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Huwag kayong gumawa ng anuman
  rationale: Likas na pautos na negatibo sa Filipino at malinaw na ipinahahayag ang saklaw ng μηδὲν.
- source_word: κατ’ ἐριθείαν
  choice: dahil sa makasariling hangarin
  rationale: Ipinahahayag ang motibong pansarili at mapagpaligsahan ng ἐριθεία, hindi lamang pangkalahatang alitan.
- source_word: κατὰ κενοδοξίαν
  choice: o hungkag na pagmamataas
  rationale: Pinananatili ang larawan ng κενός (‘hungkag’) at ang diwa ng walang-lamang paghahangad ng sariling karangalan.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: may pagpapakumbaba
  rationale: Natural na Filipino para sa datibong nagsasaad ng paraan o saloobin.
- source_word: ἀλλήλους ἡγούμενοι
  choice: ituring ninyo ang isa't isa
  rationale: Ang ἡγέομαι ay may diwang mapanuri o mapagpahalagang pagkilala; malinaw itong naipapahayag ng ‘ituring.’
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: na higit kaysa sa inyong sarili
  rationale: Pinananatili ang malawak na paghahambing ng ὑπερέχω nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na ideya ng likas na kataasan o halaga.
theological_decisions:
- issue: Saklaw ng ὑπερέχοντας sa pakikitungo sa kapuwa
  choice: na higit kaysa sa inyong sarili
  alternative: na mas mahalaga kaysa sa inyong sarili
  rationale: Ang mas malawak na ‘higit’ ay nagpapanatili sa tunay na kakayahang mangahulugan ng kataasan o pagiging nangingibabaw, habang ang talababa ay nagbibigay ng malinaw na alternatibong Filipino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘kayo’ sapagkat maramihan ang mga anyong Griyego. Iniwasan ang masyadong teknikal o makalumang ‘banal na kapalaluan’ at pinanatili ang maikli at mariing anyo ng pangaral.
