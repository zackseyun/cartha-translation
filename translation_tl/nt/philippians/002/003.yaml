  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: tl
  text: Huwag kayong gumawa ng anuman dahil sa makasariling hangarin o hungkag na pagmamataas[a], kundi sa pagpapakumbaba ay ituring ninyo ang isa't isa na nakahihigit sa inyong sarili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang-kabuluhang pagpapahalaga sa sarili” o “hungkag na paghahangad ng karangalan.”
