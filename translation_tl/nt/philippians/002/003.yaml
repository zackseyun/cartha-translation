revisions:
- from: Huwag kayong gumawa ng anuman dahil sa makasariling hangarin o hungkag na pagmamataas[a]. Sa halip, may pagpapakumbabang ituring ninyo ang isa't isa na higit kaysa sa inyong sarili[b].
  to: Huwag kayong gumawa ng anuman dahil sa makasariling hangarin o hungkag na pagmamataas[a], kundi sa pagpapakumbaba ay ituring ninyo ang isa't isa na nakahihigit sa inyong sarili[b].
  rationale: Inayos ang idyoma at sintaks nang hindi binabago ang saklaw ng kahulugan. Pinalitan ang “may pagpapakumbaba” ng mas likas na “sa pagpapakumbaba,” at ginawang “nakahihigit sa” ang hindi ganap na “higit kaysa” upang malinaw na maipahayag ang paghahambing ng Griyego. Pinanatili ang alternatibong “mas mahalaga” sa talababa bilang lehitimong paglilinaw, hindi bilang sapilitang pagpapakahulugan.
