id: PHP.2.11
reference: Philippians 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: tl
  text: at ipahayag ng bawat dila na si Jesus na Mesiyas ay Panginoon,[a] sa ikaluluwalhati ng Diyos Ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “si Jesu-Cristo ay Panginoon.”'
    reason: Ibinibigay ang tradisyonal na transliterasyon ng Χριστός bilang alternatibo sa saling-titulong “Mesiyas.”
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: bawat dila
  rationale: Pinananatili nito ang kongkretong metapora ng Griyego para sa pangkalahatan at hayagang pagpapahayag, at likas itong nauunawaan sa Filipino.
- source_word: ἐξομολογήσηται
  choice: ipahayag
  rationale: Ipinahihiwatig ng pandiwa ang lantad na pagkilala o pagpapahayag. Ang “ipahayag” ay natural sa Filipino at hindi nagdaragdag ng di-kailangang paliwanag.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang karaniwan at angkop na salin sa κύριος dito, at pinananatili ang bigat ng pahayag tungkol kay Jesus at ang alingawngaw ng wikang Kasulatan.
- source_word: Ἰησοῦς Χριστός
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan; ginagamit ang “na” upang maging likas sa modernong Filipino.
- source_word: εἰς δόξαν
  choice: sa ikaluluwalhati ng
  rationale: 'Likas na ipinahahayag nito ang direksiyon o bunga ng pagpapahayag: nauuwi ito sa pagluwalhati sa Diyos Ama.'
- source_word: θεοῦ πατρός
  choice: Diyos Ama
  rationale: Ito ang malinaw, maikli, at nakagawiang anyo sa Filipino para sa Diyos na tinutukoy bilang Ama.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa pahayag tungkol kay Jesus
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Aktibo pa rito ang diwa ng Χριστός bilang titulo. Ang “Mesiyas” ay nagpapanatili sa mesiyanikong pahayag nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan; inilalagay sa talababa ang tradisyonal na anyo.
- issue: Ugnayan ng “Panginoon” at “Jesus na Mesiyas”
  choice: si Jesus na Mesiyas ay Panginoon
  alternative: Panginoon si Jesus na Mesiyas
  rationale: 'Parehong posible sa Filipino, ngunit mas malinaw na sinusundan ng piniling ayos ang proposisyong Griyego: ang ipinahahayag tungkol kay Jesus na Mesiyas ay na siya ay Panginoon.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang metaporang “bawat dila” at ang simula sa “at” dahil karugtong ang talata ng layuning ipinahayag sa naunang talata. Hindi idinagdag ang “dapat,” sapagkat ang anyong pasakali ng pandiwa ay nakasalalay sa sugnay na layunin sa konteksto, hindi isang hiwalay na utos.
