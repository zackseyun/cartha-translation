base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: tl
  text: Lubusin ninyo ang aking kagalakan upang iisa ang inyong saloobin[a], taglay ang iisang pag-ibig, nagkakaisa sa kalooban[b], at iisang bagay ang iniisip[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mag-isip sa iisang paraan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “iisa ang kaluluwa”; maaari ring “iisa sa diwa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakatuon sa iisang layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Lubusin ninyo ang aking kagalakan
  rationale: Pinananatili ng “lubusin” ang larawan ng pagpuno o pagdadala sa ganap na sukat, habang natural itong tumutukoy sa kagalakan ni Pablo.
- source_word: ἵνα
  choice: sa pamamagitan ng
  rationale: Sa kontekstong ito, ipinakikilala ng ἵνα ang paraan o nilalaman ng paglusog sa kagalakan ni Pablo. Nililinaw ng salin ang ugnayan nang hindi ito ginagawang hiwalay na bunga lamang.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: pagkakaroon ng iisang pag-iisip
  rationale: Ang φρονέω ay tumutukoy sa paraan ng pag-iisip o saloobin, hindi lamang sa isang hiwalay na kaisipan. Ang parirala ay malinaw at angkop sa panawagan sa pagkakaisa.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: taglay ang iisang pag-ibig
  rationale: Pinananatili ang participial na ugnayan at ang pag-uulit ng αὐτός sa pamamagitan ng “iisang,” sa natural at marangal na Tagalog.
- source_word: σύμψυχοι
  choice: nagkakaisa sa kalooban
  rationale: Ipinahihiwatig ng tambalang salita ang pagkakaisa sa panloob na buhay o disposisyon. Ang “kalooban” ay mas natural kaysa literal na “kaluluwa” sa kontekstong ito, habang nananatili ang lakas ng larawan.
- source_word: τὸ ἓν φρονοῦντες
  choice: iisang bagay ang iniisip
  rationale: Pinananatili nito ang pag-uulit ng φρονέω at ang literal na diin sa “isa,” nang hindi agad nililimitahan iyon sa isang tiyak na layunin.
theological_decisions:
- issue: Saklaw ng hinihinging pagkakaisa sa dalawang paggamit ng φρονέω
  choice: “iisang pag-iisip” at “iisang bagay ang iniisip”
  alternative: “magkaroon ng iisang saloobin” at “nakatuon sa iisang layunin”
  rationale: Pinananatili ng napiling salin ang pag-uulit at pagkakaiba-iba ng Griyego. Hindi nito ipinapalagay na hinihingi ni Pablo ang ganap na pagkakapareho sa bawat opinyon, ni nililimitahan ang huling parirala sa isang partikular na layunin.
- issue: Kahulugan ng σύμψυχοι
  choice: “nagkakaisa sa kalooban”
  alternative: “iisa ang kaluluwa” o “iisa sa espiritu”
  rationale: Iniiwasan nitong gawing teknikal na pahayag tungkol sa kaluluwa o Espiritu ang isang panawagan sa malalim na panloob na pagkakaisa, habang kinikilala sa talababa ang mas literal na larawan.
translation_notes:
  register: Makabago at marangal na Filipino na mauunawaan ng karaniwang mambabasa. Pinanatili ang magkakaugnay na pag-uulit ng “iisa/iisang” at ng wika ng pag-iisip upang maipakita ang retorikal na diin ng talata sa pagkakaisa.
