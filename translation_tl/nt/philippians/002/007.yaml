  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: tl
  text: Subalit ginawa niyang walang laman ang kanyang sarili[a] sa pagtanggap ng anyo ng isang alipin, at naging kawangis ng mga tao[b]; at sa panlabas na kaanyuan ay natagpuang tulad ng isang tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginawa niyang walang anuman ang kanyang sarili.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, literal na “naging nasa wangis ng mga tao.” Hindi ipinahihiwatig ng “kawangis” na hindi tunay ang kanyang pagkatao.
    reason: translation_clarification
  - marker: c
    text: 'Ang “tao” rito ay pangkalahatan at hindi tumutukoy lamang sa kasariang lalaki. Maaari ring isalin: “at natagpuang tao sa panlabas na kaanyuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Subalit
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa naunang pahayag at angkop sa marangal na modernong Tagalog.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: ginawa niyang walang laman ang kanyang sarili
  rationale: Pinananatili ang metapora ng κενόω nang hindi ipinapaliwanag kung ano ang inalis o ipinagpalagay na isinuko niya. Ipinakikita ng mga kasunod na pariralang participial kung paano naganap ang pagpapawalang-lamang na ito.
- source_word: μορφὴν δούλου λαβών
  choice: sa pagtanggap ng anyo ng isang alipin
  rationale: Ang “anyo” ay nagpapanatili sa kahulugan at ugnayan ng μορφή sa konteksto; ang “alipin” ay naghahatid ng nakagapos at mababang katayuang ipinahihiwatig ng δοῦλος. Ang “sa pagtanggap” ay natural na naghahayag ng paraan o pamamaraan ng pangunahing kilos.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: at naging kawangis ng mga tao
  rationale: Ang “naging” ay tuwirang katumbas ng γενόμενος, samantalang pinananatili ng “kawangis” ang ὁμοίωμα. Ang “mga tao” ay pangkalahatan at hindi nakatali sa kasarian.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: at sa panlabas na kaanyuan ay natagpuang tulad ng isang tao
  rationale: Ang “panlabas na kaanyuan” ay nagbubukod sa σχῆμα mula sa naunang μορφή. Pinananatili ng “natagpuan” ang pasibong εὑρεθείς at ng “tulad ng isang tao” ang ὡς ἄνθρωπος nang hindi ipinahihiwatig na hindi tunay ang kanyang pagkatao.
theological_decisions:
- issue: Kahulugan ng “ginawa niyang walang laman ang kanyang sarili” sa kontekstong Cristolohikal
  choice: Panatilihin ang metapora ng pagpapawalang-laman at hayaang ipaliwanag ng mga kasunod na parirala ang paraan nito.
  alternative: Sabihing isinuko o inalis niya ang kanyang mga katangiang banal.
  rationale: Hindi tinutukoy ng talata ang isang bagay na inalis sa kanya. Iniuugnay nito ang kilos sa pagtanggap ng anyo ng alipin at pagiging kawangis ng mga tao; kaya hindi dapat ipasok sa salin ang isang tiyak na teoryang teolohikal.
- issue: Lakas ng “kawangis ng mga tao”
  choice: Panatilihin ang salitang “kawangis” nang hindi ito ipinalalagay na hungkag na pagkukunwari lamang.
  alternative: Palakasin ito bilang tahasang pahayag ng ganap na pagkakakilanlan, o pahinain bilang anyong tao lamang.
  rationale: Pinananatili nito ang sadyang pananalita at tensiyon ng Griyego. Hindi dapat gamitin ang ὁμοίωμα upang itanggi ang tunay na pagkatao, ni dapat burahin sa salin ang natatanging salitang pinili ni Pablo.
- issue: Pagkakaiba ng μορφή at σχῆμα
  choice: Isalin bilang “anyo” at “panlabas na kaanyuan.”
  alternative: Gamitin ang iisang salitang “anyo” para sa dalawa.
  rationale: Ipinahihiwatig ng magkaibang salitang Griyego ang pagkakaiba ng anyong tinanggap niya at ng nakikitang paraan ng kanyang paglitaw; pinananatili ng salin ang pagkakaibang ito nang hindi ito ginagawang isang sistematikong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang lumang “bagaman/datapwat,” ang pagdaragdag ng “kaluwalhatian” na wala sa Griyego, at ang labis na pagpapaliwanag sa pangunahing teksto. Ginamit ang “alipin” sa halip na “lingkod” upang mapanatili ang lakas ng δοῦλος.
