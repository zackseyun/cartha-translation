  source_fidelity: 'Tumpak na naihahatid ng salin ang pangunahing sugnay at ang tatlong participial na paglalarawan: ἑαυτὸν ἐκένωσεν bilang “ginawa niyang walang laman ang kanyang sarili,” μορφὴν δούλου λαβών bilang “sa pagtanggap ng anyo ng isang alipin,” γενόμενος ἐν ὁμοιώματι ἀνθρώπων bilang “naging kawangis ng mga tao,” at σχήματι εὑρεθεὶς ὡς ἄνθρωπος bilang “sa panlabas na kaanyuan ay natagpuang tulad ng isang tao.” Pinananatili nito ang metapora ng κενόω at ang maingat na pagkakaiba ng μορφή at σχῆμα nang hindi nilulutas ang mga usaping Kristolohikal nang higit sa sinasabi ng teksto.'
  naturalness: Marangal, malinaw, at katanggap-tanggap sa modernong Filipino Tagalog ang daloy. Bagaman sadyang literal at medyo matalinghaga ang “ginawa niyang walang laman ang kanyang sarili,” nauunawaan ito sa konteksto at angkop itong panatilihin upang hindi palitan ng interpretatibong pahayag ang metapora ng Griyego. Ang “panlabas na kaanyuan” ay natural at malinaw na naibubukod sa naunang “anyo.”
  terminology: Ang “Subalit” ay angkop na panandang pagsalungat. Ang “alipin” ay wastong masidhi para sa δούλου. Mahusay na pinananatili ng “kawangis” ang ὁμοίωμα nang hindi ito ginagawang pahayag ng huwad o hindi tunay na pagkatao. Ang “tao” sa huling parirala ay angkop na pangkalahatang katumbas ng generic na ἄνθρωπος.
