base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: tl
  text: Kaya tanggapin ninyo siya sa Panginoon nang buong kagalakan, at parangalan ninyo ang mga taong tulad niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ganitong mga lalaki.” Panlalaking anyong maramihan ang ginamit sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: tanggapin ninyo
  rationale: Ipinahihiwatig ng pautos ang malugod na pagtanggap, hindi lamang ang pagsang-ayon; natural sa Tagalog ang parirala sa kontekstong ito.
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang pasaklaw o bunga sa naunang sinabi, sa natural na makabagong Tagalog.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang maikli at sadyang malawak na pariralang Paulino nang hindi nililimitahan sa isang paliwanag lamang.
- source_word: μετὰ πάσης χαρᾶς
  choice: nang buong kagalakan
  rationale: Inihahatid nito ang kabuuan o ganap na kagalakang ipinahihiwatig ng πάσης, habang marangal at natural ang himig.
- source_word: τοὺς τοιούτους
  choice: ang mga taong tulad niya
  rationale: Tumutukoy ito sa mga taong kauri ni Epafrodito; malinaw sa Tagalog ang pagiging huwaran niya habang hindi nililimitahan ang aplikasyon nang higit sa hinihingi ng konteksto.
- source_word: ἐντίμους ἔχετε
  choice: parangalan ninyo
  rationale: Maikli at likas na ipinapahayag ang utos na ituring at pakitunguhan ang gayong mga tao bilang karapat-dapat sa dangal.
