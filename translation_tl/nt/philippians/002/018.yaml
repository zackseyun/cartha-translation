translation:
  language: tl
  text: Gayon din[a], magalak din kayo at makigalak sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa gayon ding paraan, magsaya rin kayo at makigalak sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Gayon din
  rationale: Ang parirala ay ginagamit dito bilang pang-abay na tumutukoy pabalik sa naunang sinabi ni Pablo. Likas sa modernong Tagalog ang “Gayon din” at hindi kasing-literal at alanganin ng “ang gayunding bagay.”
- source_word: καὶ ὑμεῖς
  choice: din kayo
  rationale: Ipinakikita ng καὶ na kasama rin ang mga taga-Filipos sa tugon ng kagalakan; malinaw at natural itong naihahayag ng “din kayo.”
- source_word: χαίρετε
  choice: magalak
  rationale: Pautos na pangkasalukuyan at maramihan ang anyo. Pinananatili ng “magalak” ang tuwirang panawagan at ang mahalagang tema ng kagalakan sa Filipos.
- source_word: συγχαίρετέ
  choice: makigalak
  rationale: Ipinahahayag ng tambalang pandiwa ang pakikibahagi sa kagalakan ng iba. Maikli, natural, at malinaw sa Tagalog ang “makigalak.”
- source_word: μοι
  choice: sa akin
  rationale: Tinutukoy ng datibo si Pablo bilang taong dapat nilang samahan sa kagalakan; ang “makigalak sa akin” ang likas na katumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang magkaugnay na “magalak” at “makigalak” upang mapanatili ang pag-uulit at ang dagdag na diwa ng sama-samang kagalakan sa χαίρετε at συγχαίρετέ.
