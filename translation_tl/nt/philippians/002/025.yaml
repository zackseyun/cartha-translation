id: PHP.2.25
reference: Philippians 2:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: tl
  text: Ngunit itinuring kong kailangang ipadala sa inyo si Epafrodito—ang aking kapatid, kamanggagawa, at kapwa kawal, at ang inyong sugo[a] at tagapaglingkod[b] sa aking pangangailangan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apostol”—ibig sabihin, isang isinugo ninyo.
    reason: alternative_reading
  - marker: b
    text: O “lingkod sa aking pangangailangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: kailangang
  rationale: Tuwirang ipinahahayag ang bagay na itinuring ni Pablo na kinakailangan, nang hindi ipinahihiwatig na siya ay sapilitang napilitan.
- source_word: ἡγησάμην
  choice: itinuring ko
  rationale: Pinananatili ang diwa ng maingat na pagtataya o pasiya ni Pablo, hindi lamang isang panandaliang palagay.
- source_word: πέμψαι
  choice: ipadala
  rationale: Natural na Filipino para sa pagpapadala ng isang tao; hindi idinagdag ang diwa ng “pabalik,” na hindi tahasang nasa pandiwang Griyego.
- source_word: ἀδελφὸν
  choice: kapatid
  rationale: Pinananatili ang pampamilyang tawag sa isang kapwa mananampalataya nang hindi nagpapahaba ng teksto.
- source_word: συνεργὸν
  choice: kamanggagawa
  rationale: Likas at malinaw na tawag sa isang taong gumagawang kasama ni Pablo.
- source_word: συστρατιώτην
  choice: kapwa kawal
  rationale: Pinananatili ang metaporang militar ng orihinal sa malinaw at marangal na Filipino.
- source_word: ἀπόστολον
  choice: sugo
  rationale: Sa kontekstong ito, si Epafrodito ay kinatawang ipinadala ng mga taga-Filipos; malinaw na naihahatid ng “sugo” ang diwa nang hindi agad ipinapalagay ang natatanging katungkulang apostoliko.
- source_word: λειτουργὸν
  choice: tagapaglingkod
  rationale: Ipinahahayag ang marangal at aktibong paglilingkod ni Epafrodito nang hindi ito ginagawang pangalan ng isang makabagong katungkulan sa iglesia.
- source_word: τῆς χρείας μου
  choice: sa aking pangangailangan
  rationale: Pinananatili ang kaugnayan ng paglilingkod ni Epafrodito sa praktikal na pangangailangan ni Pablo.
theological_decisions:
- issue: Kung ang ἀπόστολον ay dapat isaling teknikal na “apostol” o sa mas malawak na diwang “sugo”
  choice: sugo
  alternative: apostol
  rationale: Tinutukoy ng agarang konteksto si Epafrodito bilang kinatawang ipinadala ng iglesia sa Filipos. Pinananatili ng “sugo” ang ideya ng isang isinugo nang hindi iniuugnay sa kaniya, nang walang sapat na batayan, ang natatanging katungkulan ng mga apostol.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang magkakasunod na tawag kay Epafrodito at ang metaporang “kapwa kawal.” Ang gitling na em dash ay nagpapakita na nagpapatuloy pa ang pangungusap sa susunod na talata.
