lexical_decisions:
- source_word: πολίτευμα
  choice: pagkamamamayan
  rationale: Pinananatili nito ang puwersang pansibiko ng salita at malinaw na ipinahahayag ang pagkakabilang at katayuan ng mga mananampalataya, na itinatapat sa makalupang pag-iisip sa konteksto.
- source_word: ἐν οὐρανοῖς
  choice: nasa langit
  rationale: Bagaman maramihan ang anyong Griyego, ang “langit” ang natural na tawag sa Filipino para sa makalangit na dako o saklaw.
- source_word: ὑπάρχει
  choice: ay nasa
  rationale: Natural itong Filipino para sa tunay at kasalukuyang lokasyon o pag-iral ng pagkamamamayan, nang hindi ginagawang mabigat ang pangungusap.
- source_word: ἐξ οὗ
  choice: mula roon
  rationale: Malinaw nitong ibinabalik ang tinutukoy sa langit at pinananatili ang spatial na diwa ng pinagmumulan.
- source_word: σωτῆρα
  choice: Tagapagligtas
  rationale: Ito ang malinaw at kinikilalang katumbas na nagpapanatili sa teolohikal na bigat ng katawagan.
- source_word: ἀπεκδεχόμεθα
  choice: sabik nating hinihintay
  rationale: Ipinahahayag nito ang patuloy, masidhi, at umaasang paghihintay na taglay ng pandiwang Griyego.
- source_word: κύριον
  choice: Panginoon
  rationale: Ito ang natural at karaniwang salin sa kontekstong kristolohikal.
- source_word: Χριστόν
  choice: Mesiyas
  rationale: Isinasalin ang kahulugan ng titulong Χριστός sa halip na ituring lamang itong apelyido; ang anyong appositional na “ang Mesiyas” ay natural sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa πολίτευμα bilang pansariling katayuang pansibiko o sama-samang bayang kinabibilangan
  choice: pagkamamamayan
  alternative: bayang kinabibilangan natin
  rationale: Pinakamalinaw sa modernong Filipino ang “pagkamamamayan” at pinananatili nito ang sibikong talinghaga, ngunit inilalagay sa talababa ang posibleng kolektibong diwa.
- issue: Pagsasalin sa Χριστόν sa pariralang κύριον Ἰησοῦν Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan bilang titulo ng inaasahang Tagapagligtas; gayunman, kinikilala sa talababa ang nakaugaliang anyong pangalan/titulo na “Cristo.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang malinaw na ipakilalang ang Tagapagligtas ay ang Panginoong Jesus, ang Mesiyas, habang nananatiling magaan basahin ang mahabang pariralang appositional.
