  source_fidelity: 'Tumpak ang salin sa pangunahing mga elemento ng Griyego: ang πολίτευμα ay naipahayag bilang “pagkamamamayan,” ang kasalukuyang pag-iral/lokasyon nito ay “nasa langit,” at ang ἐξ οὗ ay malinaw na “mula roon.” Ang “sabik nating hinihintay” ay mahusay na katumbas ng ἀπεκδεχόμεθα. Napananatili rin ang anarthrous na σωτῆρα sa “isang Tagapagligtas” at ang buong pagkakakilanlan na κύριον Ἰησοῦν Χριστόν sa “ang Panginoong Jesus, ang Mesiyas.”'
