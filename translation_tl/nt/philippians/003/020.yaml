  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat ang ating pagkamamamayan[a] ay nasa langit[b], at mula roon ay sabik nating hinihintay ang isang Tagapagligtas—ang Panginoong Jesus, ang Mesiyas.[c]
