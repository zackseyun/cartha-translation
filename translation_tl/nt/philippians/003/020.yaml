  terminology: Ang “Tagapagligtas,” “Panginoon,” at “Mesiyas” ay angkop at magkakatugma sa kristolohikal na rehistro. Ang “ang Mesiyas” ay isang natural na paraan sa Filipino upang dalhin ang titular na puwersa ng Χριστόν, nang hindi ito gawing simpleng apelyido. Ang mga talababa ay may wastong kaugnayan sa mga salitang tinatalakay at hindi nagpapataw ng isang interpretasyong sektaryo.
