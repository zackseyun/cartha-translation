id: PHP.3.9
reference: Philippians 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: tl
  text: at masumpungan akong nasa kanya, na hindi ko taglay ang sarili kong katuwiran na mula sa Kautusan, kundi ang katuwirang sa pamamagitan ng pananampalataya sa Mesiyas[a]—ang katuwirang mula sa Diyos na nakabatay sa pananampalataya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pamamagitan ng katapatan ng Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang “katuwiran” bilang “katarungan” sa dalawang paglitaw nito sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: matagpuan
  rationale: Pinananatili ang pasibong anyo at ang diwa ng kalagayang nais ni Pablo na masumpungan siya, nang hindi nagdaragdag ng paliwanag.
- source_word: ἐν αὐτῷ
  choice: nasa kanya
  rationale: Likas ito sa modernong Tagalog at pinananatili ang malawak na teolohikal na diwa ng pagiging 'kay/sa loob ni' Cristo nang hindi ito nililimitahan sa isang paliwanag gaya ng 'kaisa niya.'
- source_word: μὴ ἔχων
  choice: hindi taglay
  rationale: Malinaw na inilalarawan nito ang kalagayan ni Pablo habang siya ay natatagpuang nasa Mesiyas, at mas marangal at natural kaysa sa literal na 'hindi nagkakaroon.'
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Ang 'katuwiran' ang natural at kinikilalang salin sa kontekstong Paulino; ang posibleng diwang 'katarungan' ay inilalagay sa talababa.
- source_word: τὴν ἐκ νόμου
  choice: na mula sa Kautusan
  rationale: Ipinahahayag ang pinagmulan o batayan. Ginamit ang malaking titik dahil sa konteksto ay tumutukoy ito sa Kautusang Mosaiko.
- source_word: διὰ πίστεως Χριστοῦ
  choice: sa pamamagitan ng pananampalataya sa Mesiyas
  rationale: Pinipili sa pangunahing teksto ang obhetibong pagbasa ng genitibo, ngunit pinananatili sa talababa ang tunay na posibleng pagbasa na tumutukoy sa katapatan ng Mesiyas.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Pinananatili ang pag-andar ng Χριστός bilang titulong mesiyaniko sa halip na ituring lamang na pangalang pantangi.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: ang katuwirang mula sa Diyos
  rationale: Pinananatili ang maikli at mariing pag-uulit ng δικαιοσύνη at ang Diyos bilang pinagmulan nito.
- source_word: ἐπὶ τῇ πίστει
  choice: na nakabatay sa pananampalataya
  rationale: Likas na modernong Tagalog ito para sa diwa ng batayan na ipinahahayag ng ἐπί na may datibo, habang hindi tinutukoy nang higit sa sinabi ng Griyego kung kaninong pananampalataya ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng πίστεως Χριστοῦ
  choice: pananampalataya sa Mesiyas
  alternative: katapatan ng Mesiyas
  rationale: Maaaring unawain ang genitibo bilang obhetibo o subhetibo. Sinusunod ng pangunahing teksto ang karaniwang pagbasa na pananampalataya sa Mesiyas, ngunit tahasang pinananatili sa talababa ang alternatibong pagbasa.
- issue: Kahulugan ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas angkop at nakaugaliang salita ang 'katuwiran' sa argumentong Paulino, ngunit saklaw rin ng salitang Griyego ang 'katarungan'; kaya itinatala ang alternatibo nang hindi binabago ang pangunahing teksto.
- issue: Ugnayan ng ἐν αὐτῷ
  choice: nasa kanya
  alternative: kaisa niya
  rationale: Ang literal ngunit natural na 'nasa kanya' ay nagpapanatili sa lawak ng pananalita ni Pablo tungkol sa pakikipag-ugnayan sa Mesiyas; ang 'kaisa niya' ay posibleng paliwanag ngunit mas tiyak kaysa sa mismong parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang masinsing estruktura ng pangungusap at ang pag-uulit ng 'katuwiran.' Ginamit ang 'Mesiyas' bilang titulo at 'Kautusan' para sa Kautusang Mosaiko.
