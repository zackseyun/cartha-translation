  text: Only[a], let us keep in step with what we have attained.
translation:
  language: tl
  text: Gayunman, patuloy tayong mamuhay ayon sa antas na naabot na natin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “manatili tayong nakahanay sa narating na natin,” o “lumakad tayo ayon sa gayunding pamantayan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: Gayunman
  rationale: Dito, ang πλήν ay isang paglilipat na may pananalungat o paglilimita. Ang “Gayunman” ay natural sa Filipino at angkop sa pagpapatuloy ng pangangatwiran ni Pablo.
- source_word: εἰς ὃ
  choice: ayon sa antas na
  rationale: Tinutukoy ng parirala ang puntong narating na at nagsisilbing batayan ng patuloy na pamumuhay. Ginagawang malinaw ng “antas” ang ipinahihiwatig na punto nang hindi nagdaragdag ng tahasang “tuntunin.”
- source_word: ἐφθάσαμεν
  choice: naabot na natin
  rationale: Ipinahihiwatig ng aorist ang puntong narating na, na may patuloy na kabuluhan sa kasalukuyang pamumuhay ng mga mambabasa.
- source_word: τῷ αὐτῷ
  choice: ayon sa
  rationale: Ang datibo ay nagpapahiwatig ng pagsunod sa gayunding landas o pamantayan, ngunit walang tahasang pangngalang “tuntunin” o “pamantayan” sa maikling tekstong Griyego.
- source_word: στοιχεῖν
  choice: mamuhay tayo
  rationale: Ang στοιχεῖν ay literal na paglakad nang nakahanay o pagsunod sa isang landas o pamantayan. Sa modernong Filipino, malinaw at natural na naihahatid ng “mamuhay tayo ayon sa” ang etikal na panawagan, bagaman inilalagay sa talababa ang mas metaporikal na pagbasa.
theological_decisions:
- issue: Kung magdaragdag ng tahasang pangngalang gaya ng “tuntunin” o “pamantayan” para sa τῷ αὐτῷ
  choice: Hindi nagdagdag ng tahasang “tuntunin” sa pangunahing teksto; ginamit ang “mamuhay tayo ayon sa antas na naabot na natin.”
  alternative: “lumakad tayo ayon sa iisang tuntunin” / “manatili tayo sa gayunding pamantayan”
  rationale: Sa SBLGNT na ibinigay, implicit ang sinusunod na landas o pamantayan. Iniiwasan ng pangunahing salin ang sobrang pagtukoy habang pinananatili ng talababa ang tradisyonal at posibleng pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Pinili ang “mamuhay” para sa natural na etikal na diwa ng στοιχεῖν; pinanatili sa talababa ang larawan ng paglakad o pananatiling nakahanay. Lumilitaw ang marker na [a] sa pangunahing teksto.
