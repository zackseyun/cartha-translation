  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: tl
  text: upang makilala ko siya at ang kapangyarihan ng kanyang muling pagkabuhay, at ang pakikibahagi sa kanyang mga pagdurusa[a], habang nagiging kaayon ako ng kanyang kamatayan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pakikipag-isa sa kanyang mga pagdurusa” o “ang pakikilahok sa kanyang mga pagdurusa.”
    reason: lexical_alternative
  - marker: b
    text: O “habang iniaayon ako sa kanyang kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι αὐτόν
  choice: makilala ko siya
  rationale: Ipinahahayag ng pawatas ang layunin ni Pablo. Ang “makilala” ay likas sa Filipino at maaaring tumukoy hindi lamang sa kaalaman tungkol kay Cristo kundi sa personal at karanasang pagkilala sa kanya.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Ito ang tuwiran at karaniwang katumbas ng δύναμις at pinananatili ang diwa ng mabisang kapangyarihang nahayag sa muling pagkabuhay ni Cristo.
- source_word: ἀναστάσεως
  choice: muling pagkabuhay
  rationale: Ito ang malinaw at nakaugaliang salin sa Filipino para sa pagkabuhay mula sa mga patay.
- source_word: κοινωνίαν
  choice: pakikibahagi
  rationale: Ipinakikita nito ang aktuwal na pakikilahok o pagbabahagi, hindi lamang damdaming pakikiramay o malabong pakikisama.
- source_word: παθημάτων
  choice: mga pagdurusa
  rationale: Tuwiran nitong ipinahahayag ang maramihang παθήματα at akma sa mga pagdurusa ni Cristo.
- source_word: συμμορφιζόμενος
  choice: habang iniaayon ako
  rationale: Pinananatili nito ang nagpapatuloy na kilos ng kasalukuyang participle at ang pasibo o di-tiyak na pagkilos, nang hindi pinapangalanan ang gumagawa ng pag-aayon.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: sa kanyang kamatayan
  rationale: Tuwiran nitong pinananatili ang kamatayan ni Cristo bilang huwaran o anyong pinag-aayunan ni Pablo.
theological_decisions:
- issue: Kahulugan ng κοινωνίαν παθημάτων αὐτοῦ
  choice: Tunay na pakikibahagi sa mga pagdurusa ni Cristo
  alternative: Pakikisama sa kanyang mga pagdurusa sa mas malabo o abstraktong diwa
  rationale: Ang κοινωνία at ang konteksto ay nagpapahiwatig ng aktuwal na pakikilahok sa landas ng pagdurusa ni Cristo, ngunit hindi nililimitahan ng salin kung paano ito nagaganap.
- issue: Tinig at ahensiya sa συμμορφιζόμενος
  choice: “iniaayon ako,” na hindi tinutukoy ang gumagawa
  alternative: “nagiging kaayon ako,” na maaaring idiin ang kalagayan o proseso
  rationale: Maaaring taglayin ng anyong Griyego ang pasibo o middle na diwa. Hindi pinapangalanan ng teksto ang tahasang ahente, kaya hindi rin ito idinaragdag sa salin.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang magkakahanay na mga layunin ng Griyego at ang bahagyang tensiyon ng pariralang pag-aayon sa kamatayan, nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag.
