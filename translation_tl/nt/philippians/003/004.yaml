  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: tl
  text: Bagaman ako mismo ay may tiwala rin sa laman. Kung inaakala ng sinumang iba na may tiwala siya sa laman[a], higit pa ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga kredensiyal bilang tao” o “sa panlabas na katayuan.” Sa Griyego, “sa laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Bagaman
  rationale: Malinaw na naghuhudyat ng pagbibigay-daan o konsesyon at angkop sa marangal na modernong Tagalog.
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: ako mismo ay may batayan ... upang magtiwala
  rationale: Ginagawang likas na sugnay sa Tagalog ang participial construction at ipinahahayag ang pagkakaroon ng saligan para sa pagtitiwala.
- source_word: καὶ ἐν σαρκί
  choice: din ... sa laman
  rationale: Pinananatili ang diin ng καί at ang kongkretong katawagang σάρξ nang hindi agad nilulutas ang saklaw nito.
- source_word: δοκεῖ
  choice: inaakala
  rationale: Tumutugma sa diwang itinuturing o iniisip ng isang tao na mayroon siyang gayong batayan.
- source_word: πεποιθέναι
  choice: may batayan siyang magtiwala
  rationale: Ipinahahayag ang matatag na kalagayan ng pagtitiwala at ang retorikal na ideya ng mga kredensiyal sa konteksto.
- source_word: μᾶλλον
  choice: lalo na ako
  rationale: 'Natural at mariing paghahambing sa Tagalog: higit na makapagsasabi nito si Pablo.'
theological_decisions:
- issue: Kahulugan ng σάρξ sa Filipos 3:4
  choice: Panatilihin ang “laman” sa pangunahing teksto at ipaliwanag sa talababa ang kontekstuwal na diwa nito.
  alternative: mga kredensiyal bilang tao / panlabas na katayuan; makasalanang kalikasan
  rationale: Ipinakikita ng kasunod na talaan sa 3:5–6 na ang tinutukoy ay mga kalamangan sa angkan, pagtutuli, kautusan, at sigasig, hindi pangunahing ang makasalanang kalikasan. Pinananatili ng “laman” ang katawagan at tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “batayan upang magtiwala” upang maging natural ang pahayag habang pinananatili ang literal na “laman” at ang paliwanag nito sa talababa.
