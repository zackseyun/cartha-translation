  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: tl
  text: Sa wakas[a], mga kapatid ko[b], magalak kayo sa Panginoon. Hindi pabigat para sa akin na isulat muli sa inyo ang mga iyon[c], at nagsisilbi itong pananggalang para sa inyo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tungkol naman sa iba pa” o “Mula ngayon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay tawag sa buong kapulungan, kaya kabilang ang mga lalaki at babae.
    reason: cultural_note
  - marker: c
    text: Maaari ring “Hindi ito nakaiinip para sa akin” o “Hindi ito abala para sa akin.”
    reason: lexical_alternative
  - marker: d
    text: O “at ito ay para sa inyong katiwasayan” o “at ito ay ligtas para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Sa iba pang bagay
  rationale: Ginamit bilang panandang lumilipat sa susunod na paksa. Iniiwasan nito ang posibleng maling pahiwatig ng “Sa wakas,” sapagkat mahaba pa ang kasunod na bahagi ng liham, habang pinananatili ang saklaw ng idyomang Griyego.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang “mga kapatid” ay likas at marangal sa modernong Tagalog at maaari ring tumukoy sa buong kapulungan, bagaman panlalaking pangmaramihan ang anyong Griyego.
- source_word: χαίρετε
  choice: magalak kayo
  rationale: Pinananatili ang puwersa ng pangmaramihang pautos at ang karaniwang diwa ni Pablo na kagalakang nakaugat sa Panginoon.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ang “sa Panginoon” ang likas na Tagalog na katumbas na nagpapanatili sa teolohikal na ugnayan o kinasasaklawan ng kagalakan.
- source_word: τὰ αὐτά
  choice: ang mga bagay ring iyon
  rationale: Pinananatiling malawak ang tinutukoy, gaya ng Griyego, nang hindi ipinapasiya kung mga naunang paalala, turo, o babala ang inuulit.
- source_word: γράφειν
  choice: na isulat
  rationale: Likas na inilalahad ang infinitive sa konstruksiyong Tagalog habang pinananatili ang kilos na pagsulat.
- source_word: οὐκ ὀκνηρόν
  choice: Hindi mabigat para sa akin
  rationale: Ipinahahayag na ang pag-uulit ay hindi pabigat at hindi iniiwasan ni Pablo; natural ito sa modernong Tagalog nang hindi nililimitahan ang diwa sa pagkabagot lamang.
- source_word: ἀσφαλές
  choice: para sa inyong kaligtasan
  rationale: Dito ang “kaligtasan” ay nasa diwa ng pagiging ligtas o protektado, hindi awtomatikong teknikal na espirituwal na kaligtasan; inililinaw ng talababa ang alternatibong “pananggalang.”
theological_decisions:
- issue: Kasariang saklaw ng tawag sa kapulungan
  choice: mga kapatid ko
  alternative: mga kapatid kong lalaki at babae
  rationale: Bagaman panlalaking pangmaramihan ang ἀδελφοί, ang karaniwang “mga kapatid” sa Tagalog ay natural na kolektibong tawag at hindi kailangang magdagdag sa pangunahing teksto ng mga salitang wala sa Griyego. Nililinaw sa talababa na saklaw ang buong kapulungan.
- issue: Diwa ng ἀσφαλές bilang proteksiyon
  choice: para sa inyong kaligtasan
  alternative: isang pananggalang para sa inyo
  rationale: Pinananatili ang direktang diwa ng kaligtasan o katiwasayan, ngunit hindi ipinapasiya kung anong tiyak na panganib ang nasa isip ni Pablo. Ang talababa ay pumipigil sa pagbasa rito bilang awtomatikong terminong doktrinal para sa pagliligtas.
- issue: Tinutukoy ng “mga bagay ring iyon”
  choice: panatilihing hindi tiyak
  alternative: ang mga dati ko nang isinulat sa inyo
  rationale: Hindi tahasang sinasabi ng Griyego kung aling mga naunang turo o paalala ang tinutukoy, kaya hindi ito tinukoy nang higit sa ebidensiya ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “magalak” sa halip na mas kolokyal na “matuwa” upang mapanatili ang lakas ng apostolikong tagubilin, at “mga kapatid” bilang natural na kolektibong tawag sa iglesia.
