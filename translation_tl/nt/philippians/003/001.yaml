    rationale: Sa kontekstong ito, ang salita ay nangangahulugang ligtas, katiwasayan, o pananggalang. Ang “kaligtasan” sa Filipino ay madaling mabasang salvation at kaya nagdaragdag ng teolohikal na kahulugang wala sa pahayag.
  - severity: medium
