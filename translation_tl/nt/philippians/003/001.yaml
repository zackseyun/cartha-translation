- from: Sa iba pang bagay[a], mga kapatid ko[b], magalak kayo sa Panginoon. Hindi mabigat para sa akin na isulat sa inyo ang mga bagay ring iyon[c], at ito ay para sa inyong kaligtasan[d].
  to: Sa wakas[a], mga kapatid ko[b], magalak kayo sa Panginoon. Hindi pabigat para sa akin na isulat muli sa inyo ang mga iyon[c], at nagsisilbi itong pananggalang para sa inyo[d].
  rationale: Inayos ang transisyong idyomatiko, ang likas na pagpapahayag ng hindi pagiging pabigat, at lalo na ang ἀσφαλές upang maipahayag ang katiwasayan o proteksiyong dulot ng paulit-ulit na pagsulat nang hindi ipinapasok ang kahulugang “kaligtasan” bilang salvation. Inilipat din ang talababa c sa wastong salita at pinanatiling malawak ang tinutukoy ng “mga iyon.”
