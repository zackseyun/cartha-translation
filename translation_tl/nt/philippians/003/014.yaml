  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: tl
  text: Nagpupunyagi ako tungo sa mithiin para sa gantimpala ng pagtawag ng Diyos tungo sa itaas[a] sa Mesiyas na si Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “makalangit na pagtawag” o “pagtawag ng Diyos mula sa itaas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “sa Cristo Jesus.” Ang “Cristo” (Christos) ay titulong nangangahulugang “Mesiyas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: tungo sa mithiin
  rationale: Ipinahahayag nito ang nakatuong pagkilos patungo sa takdang layon at pinananatili ang larawang hango sa paligsahan.
- source_word: διώκω
  choice: nagpupunyagi ako
  rationale: Ipinakikita nito ang masigasig at patuloy na pagsisikap sa konteksto ng isang takbuhan, nang hindi nililimitahan ang pandiwa sa literal na paghabol.
- source_word: εἰς τὸ βραβεῖον
  choice: para sa gantimpala
  rationale: Ipinahahayag ng “para sa” ang gantimpala bilang pakay ng pagpupunyagi nang hindi tahasang idinaragdag ang ideyang ‘manalo’ o ‘makamit.’
- source_word: ἄνω
  choice: paitaas
  rationale: Pinananatili nito ang panandang panlunan sa Griyego at ang posibleng ugnay nito sa larawang atletiko, habang hindi isinasara ang kahulugang ‘mula sa itaas’ o ‘makalangit.’
- source_word: κλήσεως τοῦ θεοῦ
  choice: paanyaya ng Diyos
  rationale: Malapit nitong sinusundan ang anyong henitibo at likas itong nauunawaan bilang paanyayang nagmumula sa Diyos.
- source_word: Χριστῷ
  choice: Cristo
  rationale: Ginagamit ang nakaugaliang salin sa Filipino para sa titulong Χριστός; nililinaw sa talababa na ang kahulugan nito ay Mesiyas.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kay Cristo Jesus
  rationale: Maikli at natural itong anyo sa Filipino na nagpapanatili sa ugnayan ng paanyaya kay Cristo Jesus; hindi ito pinalitan ng ‘sa pamamagitan ni,’ na maaaring magpahiwatig ng ibang relasyon.
theological_decisions:
- issue: Kahulugan ng ἄνω κλήσεως
  choice: paanyaya ng Diyos paitaas
  alternative: makalangit na paanyaya; paanyayang mula sa itaas
  rationale: Pinananatili ng “paitaas” ang panandang panlunan at ang tensiyon sa pagitan ng larawang atletiko at ng pinagmumulang makalangit ng paanyaya, sa halip na pumili lamang ng isang pagpapakahulugan.
- issue: Lakas ng ἐν sa ἐν Χριστῷ Ἰησοῦ
  choice: kay Cristo Jesus
  alternative: sa pakikipag-isa kay Cristo Jesus
  rationale: Hindi tahasang dinaragdagan ng pangunahing teksto ang ‘pakikipag-isa,’ bagaman maaari itong ipahiwatig ng parirala sa teolohiya ni Pablo; binabanggit sa talababa ang mas malawak na posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “mithiin,” “nagpupunyagi,” at “gantimpala” ay madaling maunawaan ngunit nagpapanatili sa larawang atletiko at sa pormal na himig ng talata.
