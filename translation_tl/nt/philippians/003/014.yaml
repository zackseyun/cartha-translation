revisions:
- from: Nagpupunyagi ako tungo sa mithiin para sa gantimpala ng paanyaya ng Diyos paitaas[a] kay Cristo Jesus[b].
  to: Nagpupunyagi ako tungo sa mithiin para sa gantimpala ng pagtawag ng Diyos tungo sa itaas[a] sa Mesiyas na si Jesus[b].
  rationale: Pinanatili ang masigasig na galaw tungo sa mithiin at ang layuning makamit ang gantimpala. Ginawang “pagtawag ng Diyos tungo sa itaas” ang ἄνω κλήσεως upang maipahayag ang pangunahing direksiyonal na puwersa ng ἄνω nang hindi isinasara ang mga alternatibong “makalangit” at “mula sa itaas,” na nasa talababa. Isinalin ang Χριστός bilang “Mesiyas” at ang ἐν bilang “sa,” alinsunod sa source at sa patakaran ng proyekto.
