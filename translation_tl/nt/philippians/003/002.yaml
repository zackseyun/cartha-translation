  text: Βλέπετε τοὺς κύνας, βλέπετε τοὺς κακοὺς ἐργάτας, βλέπετε τὴν κατατομήν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: tl
  text: Mag-ingat kayo sa mga aso; mag-ingat kayo sa masasamang manggagawa; mag-ingat kayo sa paglalaslas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “paglalaslas” o “pagputol-putol.” Mapanuyang ipinantatapat ito ni Pablo sa salitang “pagtutuli” sa kasunod na talata; maaari rin itong unawain bilang pagtukoy sa “mga naglalaslas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Mag-ingat kayo sa
  rationale: Ang kasalukuyang pautos ay inuulit nang tatlong beses bilang mariing babala. Pinananatili ng pariralang ito ang agarang diin at paulit-ulit na ritmo sa natural na modernong Tagalog.
- source_word: τοὺς κύνας
  choice: mga aso
  rationale: Pinananatili ang literal at matinding metapora ni Pablo nang hindi dinaragdagan ng paliwanag o pang-uri na wala sa Griyego.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: masasamang manggagawa
  rationale: Ipinapahayag nito kapwa ang moral na bigat ng κακούς at ang karaniwang kahulugan ng ἐργάτας sa malinaw at tuwirang Tagalog.
- source_word: τὴν κατατομήν
  choice: paglalaslas
  rationale: Ang κατατομή ay literal na tumutukoy sa paghiwa o mutilasyon. Pinananatili ng “paglalaslas” ang anyong abstrakto at mapanuyang talas ng salita, pati ang kaibahan nito sa περιτομή (“pagtutuli”) sa kasunod na talata.
theological_decisions:
- issue: Kung paano isasalin ang κατατομήν kaugnay ng pagtutuli sa konteksto
  choice: Isalin bilang mapanuyang “paglalaslas,” hindi bilang neutral na pagtutuli o tahasang tukoy sa mga taong nagsasagawa nito.
  alternative: mga naglalaslas; huwad na pagtutuli
  rationale: Sadyang gumamit si Pablo ng mapanirang salitang katunog at kasalungat ng karaniwang salita para sa pagtutuli. Pinananatili ng salin ang retorikal at teolohikal na tensiyon nang hindi nilulutas ang abstraktong katawagan bilang tahasang pagtukoy sa mga tao.
translation_notes:
  register: Makabago, tuwiran, at marangal ang wika. Ang tatlong ulit na “Mag-ingat kayo” ay sadyang pinanatili upang maihatid ang madiing ritmo ng Griyego; hindi pinalambot ang matatalim na katawagang “mga aso” at “paglalaslas.”
