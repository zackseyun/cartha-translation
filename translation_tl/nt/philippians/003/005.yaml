  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: tl
  text: tinuli nang ikawalong araw, mula sa lahi ng Israel, mula sa lipi ni Benjamin, isang Hebreong mula sa mga Hebreo[a]; kung tungkol sa Kautusan, isang Pariseo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang Hebreong mula sa mga magulang na Hebreo,” na nagbibigay-diin sa Hebreong angkan at pagkakakilanlan ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: tinuli nang ikawalong araw
  rationale: Likas na ipinapahayag sa Tagalog ang siksik na pariralang Griyego at pinananatili ang tiyak na panahon ng pagtutuli bilang tanda ng tipan.
- source_word: ἐκ γένους Ἰσραήλ
  choice: mula sa lahi ng Israel
  rationale: Ipinahahayag ng γένος dito ang pinagmulang etniko o angkan; malinaw at karaniwan sa Tagalog ang “lahi ng Israel.”
- source_word: φυλῆς Βενιαμίν
  choice: mula sa lipi ni Benjamin
  rationale: Tinutukoy ng parirala ang kinabibilangang lipi; ang “lipi” ang natural na katumbas ng φυλή sa kontekstong Israelita.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: isang Hebreong mula sa mga Hebreo
  rationale: Pinananatili nito ang maikli at mariing anyo ng Griyego at ang posibleng pagtukoy kapuwa sa angkan at pagkakakilanlang Hebreo, nang hindi nililimitahan ang kahulugan sa kapanganakan lamang.
- source_word: κατὰ νόμον
  choice: kung tungkol sa Kautusan
  rationale: Ang κατά ay nagpapakilala rito ng pamantayan o larangan ng susunod na paglalarawan. Natural sa Tagalog ang “kung tungkol sa” at naaangkop sa sunod-sunod na pagbanggit ni Pablo ng kanyang mga katangian.
- source_word: Φαρισαῖος
  choice: isang Pariseo
  rationale: Ang “Pariseo” ang nakagawiang katawagan sa Tagalog para sa kasapi ng pangkat na Judio.
theological_decisions:
- issue: Saklaw ng “Kautusan” sa κατὰ νόμον
  choice: Kautusan
  alternative: kautusan
  rationale: Ang malaking titik ay nagpapahiwatig ng Kautusan ng Israel sa kontekstong Judio, ngunit hindi dinaragdagan o nilulutas nang higit sa teksto ang eksaktong saklaw nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong talaan at ang bahagyang putol-putol na balangkas ng Griyego, yamang bahagi ito ng mas mahabang pangungusap sa konteksto.
