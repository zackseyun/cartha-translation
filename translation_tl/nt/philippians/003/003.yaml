  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: tl
  text: Sapagkat tayo ang tunay na mga tinuli—tayong sumasamba sa pamamagitan ng Espiritu ng Diyos[a], nagmamapuri sa Mesiyas na si Jesus[b], at hindi nagtitiwala sa laman[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May tekstuwal na baryanteng maaaring isaling “sumasamba sa Diyos sa espirituwal na paraan.”
    reason: textual_variant
  - marker: b
    text: Ang “Mesiyas” ang salin ng titulong Griyego na Christos.
    reason: lexical_alternative
  - marker: c
    text: Dito, ang “laman” ay tumutukoy sa mga pisikal o pantao na batayan ng pagtitiwala, gaya ng pagtutuli o katayuan.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: mga tuli
  rationale: Ginamit ang likas na kolektibong katawagan sa Filipino upang mapanatili ang kongkretong larawan ng pagtutuli at ang mapanghamong pag-angkin ni Pablo, nang hindi ito pinapaliwanag agad bilang isang doktrinal na paraphrase.
- source_word: πνεύματι θεοῦ
  choice: sa pamamagitan ng Espiritu ng Diyos
  rationale: Ipinahahayag nito ang Espiritu ng Diyos bilang paraan o kapangyarihan ng pagsamba, habang kinikilala sa talababa ang tekstuwal na alternatibo.
- source_word: λατρεύοντες
  choice: sumasamba
  rationale: Natural at malinaw itong salin para sa banal na paglilingkod o pagsambang inihahandog sa Diyos.
- source_word: καυχώμενοι
  choice: nagmamapuri
  rationale: Pinananatili nito ang retorikal na diin sa batayan ng pagmamalaki o kapurihan, na ikinokontra sa pagtitiwala sa laman.
- source_word: Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas,” at ginamit ang natural na ayos sa modernong Filipino.
- source_word: σαρκί
  choice: laman
  rationale: Pinananatili ang literal at metaporikal na saklaw ng σάρξ, na sa konteksto ay tumutukoy sa katawan at sa mga katayuang pantao na maaaring gawing batayan ng tiwala.
- source_word: πεποιθότες
  choice: hindi nagtitiwala
  rationale: Ipinahahayag ang matatag na pag-asa o pananalig na itinatanggi ni Pablo kaugnay ng laman.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang babala.
theological_decisions:
- issue: Kahulugan ng σάρξ sa talatang ito
  choice: Ang “laman” ay pangunahing tumutukoy sa mga batayang pisikal at pantao ng tiwala sa relihiyon, gaya ng pagtutuli, pinagmulan, at katayuan.
  alternative: Ang “laman” ay tumutukoy lamang sa makasalanang kalikasan bilang panloob na prinsipyong moral.
  rationale: Kaagad na inililista sa kasunod na konteksto ang pagtutuli, lahi, pagsunod sa kautusan, at katayuan; kaya pinanatili ang “laman” at ipinaliwanag ang kontekstuwal na diwa nito sa talababa.
- issue: Diwa ng πνεύματι θεοῦ
  choice: Ang Espiritu ng Diyos ang paraan o saklaw ng pagsamba.
  alternative: Ang parirala ay tumutukoy sa espiritu ng tao o sa pagsamba sa Diyos nang espirituwal.
  rationale: Sa tekstong SBLGNT na may θεοῦ, pinakanatural ang pagtukoy sa banal na Espiritu, ngunit kinikilala sa talababa ang mahalagang tekstuwal na baryante.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang gitling na em upang malinaw na iugnay ang tatlong panuring sa “tayo ang mga tuli.” Iniwasan ang sobrang pagpapaliwanag sa pangunahing teksto at inilagay sa mga talababa ang tekstuwal at kontekstuwal na detalye.
