  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: tl
  text: Mga kapatid[a], sama-sama kayong tumulad sa akin, at pagmasdan ninyo ang mga namumuhay nang ganito, gaya ng pagturing ninyo sa amin bilang huwaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay nasa anyong panlalaking maramihan, ngunit malamang na tumutukoy sa buong kongregasyon, kapwa mga lalaki at mga babae.
    reason: cultural_note
  - marker: b
    text: O “halimbawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: sama-sama ninyo akong tularan
  rationale: 'Pinagsasama ng parirala ang utos na tumulad kay Pablo at ang kolektibong diwa ng Συμμιμηταί: hindi lamang hiwa-hiwalay na panggagaya kundi sama-samang pagtulad.'
- source_word: ἀδελφοί
  choice: Mga kapatid
  rationale: Ang “mga kapatid” ang likas at marangal na tawag sa kapwa mananampalataya sa modernong Tagalog. Hindi minamarkahan ng salitang Tagalog ang kasarian, kaya nililinaw sa talababa ang anyo at malamang na saklaw ng salitang Griego.
- source_word: σκοπεῖτε
  choice: Pagmasdan ninyo
  rationale: Ipinahahayag nito ang maingat at patuloy na pagbibigay-pansin, nang hindi ipinapalagay na basta panonood lamang ang ibig sabihin.
- source_word: οὕτω περιπατοῦντας
  choice: mga namumuhay nang ganito
  rationale: Ang περιπατέω ay literal na “lumalakad” ngunit dito ay karaniwang talinghaga ni Pablo para sa asal o paraan ng pamumuhay. Ang “namumuhay” ay malinaw at likas sa Tagalog.
- source_word: καθὼς ἔχετε τύπον ἡμᾶς
  choice: kung paanong kami ang huwaran ninyo
  rationale: Pinananatili ng “kung paanong” ang paghahambing ng καθὼς, ng “huwaran” ang diwa ng τύπος bilang modelong dapat sundan, at ng “kami” ang tahasang maramihang ἡμᾶς.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: Gamitin ang “Mga kapatid” sa pangunahing teksto at ipaliwanag sa talababa ang panlalaking anyo sa Griego at ang malamang na pagsaklaw nito sa buong kongregasyon.
  alternative: Gawing tahasan sa pangunahing teksto ang “Mga kapatid na lalaki at babae.”
  rationale: Ang Tagalog na “kapatid” ay likas na walang tinutukoy na kasarian. Tumpak nitong tinutumbasan ang tawag sa kongregasyon nang hindi nagdaragdag ng kasariang hindi minamarkahan ng salitang Tagalog, habang pinananatili sa talababa ang impormasyong panggramatika ng orihinal.
- issue: Pagkakakilanlan ng huwaran
  choice: Panatilihin ang maramihang “kami.”
  alternative: Gamitin ang isahang “ako” dahil si Pablo ang nagsasalita.
  rationale: Bagaman iniutos muna ni Pablo na siya ay tularan, tahasang maramihan ang ἡμᾶς. Maaaring kabilang dito ang kanyang mga kamanggagawa, kaya hindi ito dapat gawing isahan.
translation_notes:
  register: Makabago, malinaw, at marangal ang pananalita. Ginamit ang “namumuhay” sa halip na literal na “lumalakad” upang likas na maipahayag sa Tagalog ang talinghaga para sa paraan ng pamumuhay. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa dalawang magkaugnay na utos nang hindi binabago ang ugnayang pangkahulugan.
