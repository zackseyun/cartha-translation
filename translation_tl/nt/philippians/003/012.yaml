  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: tl
  text: Hindi ko sinasabing natamo ko na ito[a] o ginawa na akong ganap[b]. Ngunit patuloy akong nagsisikap upang baka mahawakan ko rin ang bagay na siyang dahilan kung bakit[d] hinawakan din ako ni Cristo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakuha” o “nakamtan”; hindi tahasang binabanggit sa Griyego ang layon, kundi ipinahihiwatig ito ng konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naging ganap na ako” o “ginawa na akong lubos.”
    reason: lexical_alternative
  - marker: c
    text: Ang Griyegong Christos ay maaari ring isaling “Mesiyas.”
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring unawain: “sapagkat hinawakan din ako ni Cristo.”'
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: ἔλαβον
  choice: natamo ko na ito
  rationale: Ipinahihiwatig ng konteksto ang layuning hindi pa natatamo ni Pablo. Idinagdag ang “ito” upang maging malinaw sa Tagalog habang nananatiling di-tiyak ang mismong layon.
- source_word: τετελείωμαι
  choice: ginawa na akong ganap
  rationale: 'Pinananatili nito ang perpektong aspektong pasibo: itinatanggi ni Pablo na nasa kalagayan na siya ng ganap na pagkakabuo o pagkakalubos.'
- source_word: διώκω
  choice: patuloy akong nagsisikap
  rationale: Likas at malinaw itong Tagalog para sa masidhing patuloy na paghahabol sa isang layunin, nang hindi gumagamit ng salitang maaaring magpahiwatig dito ng pag-uusig.
- source_word: καταλάβω … κατελήμφθην
  choice: mahahawakan ko … hinawakan … ako
  rationale: 'Pinananatili ang paglalaro sa magkaugnay na aktibo at pasibong anyo ng iisang pandiwang Griyego: hangad ni Pablo na humawak sapagkat siya mismo ay hinawakan.'
- source_word: ἐφ’ ᾧ
  choice: iyon na siyang layunin kung bakit
  rationale: 'Isinasalin ang parirala ayon sa malamang na diwang layunin: hinawakan ni Cristo si Pablo na may isang layuning dapat niyang maabot. Inilalahad sa talababa ang tunay na alternatibong pagbasa.'
- source_word: Χριστοῦ
  choice: Cristo
  rationale: Karaniwan at marangal na anyong Filipino para sa Χριστός sa gamit ni Pablo; maaaring ipakahulugan ding “Mesiyas.”
theological_decisions:
- issue: Kung ang τετελείωμαι ay tumutukoy sa pagiging walang kasalanan o sa ganap na pagkakalubos
  choice: ginawa na akong ganap
  alternative: naging ganap na ako; lubos na akong ginawang ganap
  rationale: Pinananatili ng salin ang pasibong/resultatibong diwa ngunit hindi ipinapasok ang anumang sistematikong doktrina tungkol sa kawalang-kasalanan o espirituwal na kasakdalan.
- issue: Kahulugan ng ἐφ’ ᾧ
  choice: layuning siyang dahilan kung bakit hinawakan si Pablo ni Cristo
  alternative: sapagkat hinawakan din si Pablo ni Cristo
  rationale: Maaaring magpahayag ang parirala ng layunin o sanhi. Ang pangunahing teksto ay sumusunod sa pagbasa ng layunin, habang pinananatili sa talababa ang pagbasa ng sanhi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “natamo,” “ganap,” at “hinawakan” upang mapanatili ang bigat at ugnayang pandiwa ng Griyego nang hindi nagiging labis na teknikal. Ang paghahati sa dalawang pangungusap ay natural sa Filipino at hindi binabago ang lohika ng talata.
