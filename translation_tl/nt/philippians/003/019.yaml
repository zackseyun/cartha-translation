id: PHP.3.19
reference: Philippians 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: tl
  text: Ang wakas nila ay kapahamakan, ang tiyan[a] ang kanilang diyos, at ang kanilang karangalan ay nasa kanilang kahihiyan—nakatuon ang isip nila sa mga bagay na makalupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang gana” o “ang kanilang pagnanasa.”
    reason: Ipinakikita ang posibleng diwang metaporikal ng κοιλία nang hindi inaalis ang kongkretong larawan sa pangunahing teksto.
lexical_decisions:
- source_word: τέλος
  choice: wakas
  rationale: Pinananatili ng “wakas” ang maikli at matinding pahayag ng Griyego at maaari itong tumukoy kapwa sa pagtatapos at sa kahihinatnan.
- source_word: ἀπώλεια
  choice: kapahamakan
  rationale: Natural at mabigat ang “kapahamakan” sa Filipino, at naipahihiwatig nito ang ganap na pagkawasak o kaparusahang tinutukoy nang hindi gumagamit ng salitang lipas.
- source_word: κοιλία
  choice: tiyan
  rationale: Pinananatili ng “tiyan” ang kongkreto at mapanuyang metapora ng Griyego sa halip na agad itong ipakahulugang “pagnanasa” o “gana.”
- source_word: δόξα
  choice: karangalan
  rationale: Tuwirang katumbas ang “karangalan” at pinananatili nito ang kabalintunaan ng pagpapahalaga nila sa bagay na kahiya-hiya.
- source_word: αἰσχύνη
  choice: kahihiyan
  rationale: Malinaw na ipinahahayag ng “kahihiyan” ang pagkawala ng dangal at moral na kasiraan.
- source_word: τὰ ἐπίγεια
  choice: mga bagay na makalupa
  rationale: Malapit ito sa Griyegong pangmaramihang parirala at natural na tumutukoy sa mga bagay na nauukol sa lupa o kasalukuyang mundong ito.
- source_word: φρονοῦντες
  choice: nakatuon ang isip
  rationale: Ipinahahayag nito ang nagpapatuloy na pag-iisip, pagpapahalaga, at oryentasyon ng kalooban, hindi lamang ang panandaliang pag-iisip tungkol sa isang bagay.
- source_word: ὧν ... ὧν
  choice: nila ... kanilang
  rationale: Natural na ibinabalik ng mga panghalip na ito ang tinutukoy na mga tao sa naunang talata, habang pinananatili ang sunod-sunod na paglalarawan sa kanila.
theological_decisions:
- issue: Metaporikal na puwersa ng “ang tiyan ang kanilang diyos”
  choice: Pinanatili sa pangunahing teksto ang kongkretong larawang “tiyan.”
  alternative: Ang kanilang diyos ay ang kanilang gana o pagnanasa.
  rationale: Maaaring tumukoy ang metapora sa gana, pagnanasa, o pagpapasasa, ngunit hindi nililimitahan ng teksto ang kahulugan sa iisang abstraktong paliwanag.
- issue: Kabalintunaan ng karangalan at kahihiyan
  choice: “Ang kanilang karangalan ay nasa kanilang kahihiyan.”
  alternative: Ipinagmamalaki nila ang dapat nilang ikahiya.
  rationale: Pinananatili ng napiling salin ang tahasang pagtutumbas ng δόξα at αἰσχύνη at ang teolohikal at retorikal na tensiyon nito; mas nagpapaliwanag na ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at sunod-sunod na hatol ng Griyego, pati ang matinding metapora at kabalintunaan, habang ginawang natural ang huling sugnay sa Filipino.
