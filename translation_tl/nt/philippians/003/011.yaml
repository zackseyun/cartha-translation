  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: tl
  text: kung sa paanuman ay makarating ako sa muling pagkabuhay mula sa mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “ang pagbangong palabas mula sa gitna ng mga patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: kung sa paanuman
  rationale: Pinananatili nito ang pasubok at mapagpakumbabang himig ng parirala nang hindi ipinahihiwatig na nagdududa si Pablo sa pangako ng Diyos; tumutukoy ito sa paraan ng pag-abot, hindi kinakailangang sa katiyakan ng pangyayari.
- source_word: καταντήσω
  choice: makarating ako
  rationale: Likas na ipinapahayag ng “makarating” ang pag-abot sa isang hantungan o layunin, gaya ng metaporikal na gamit ng pandiwa rito.
- source_word: εἰς
  choice: sa
  rationale: Sa pariralang “makarating sa,” natural na naihahatid ng “sa” ang pagkilos patungo sa hantungan.
- source_word: ἐξανάστασιν
  choice: muling pagkabuhay
  rationale: Ito ang malinaw at karaniwang salin para sa resurrection sa modernong Filipino. Hindi ipinilit sa pangunahing teksto ang di-likas na literalismong “pagbangon palabas,” ngunit itinala sa talababa ang natatanging anyo ng salitang Griyego.
- source_word: τὴν ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Malinaw at natural nitong isinasalin ang pinagmumulang ipinahahayag ng ἐκ νεκρῶν, habang ang mas tahasang “mula sa gitna ng mga patay” ay inilalagay sa talababa.
theological_decisions:
- issue: Kung ang ἐξανάστασις ay dapat isaling naiiba nang husto sa karaniwang ἀνάστασις, na maaaring magpahiwatig ng isang natatanging uri o yugto ng muling pagkabuhay.
  choice: “muling pagkabuhay mula sa mga patay” sa pangunahing teksto
  alternative: “pagbangong palabas mula sa gitna ng mga patay” o “muling pagkabuhay mula sa gitna ng mga patay”
  rationale: Tiyak na tumutukoy ang talata sa muling pagkabuhay mula sa mga patay, ngunit hindi sapat ang pambihirang anyong ἐξανάστασις upang magtakda sa salin ng isang partikular na doktrina tungkol sa natatanging pagkabuhay. Pinananatili sa talababa ang posibleng diin ng anyo at ng pariralang ἐκ νεκρῶν.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “kung sa paanuman” upang mapanatili ang tunay na pag-aalinlangan tungkol sa paraan nang hindi ito pinapalabis bilang pagdududa sa pangako; ginamit ang karaniwang terminong “muling pagkabuhay” para sa linaw.
