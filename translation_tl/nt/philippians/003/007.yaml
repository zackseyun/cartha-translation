  source_fidelity: 'Tapat ang salin sa Griyego: naipapakita ang mariing pagsalungat ng Ἀλλὰ, ang malawak na saklaw ng ἅτινα, ang dating mga κέρδη bilang “pakinabang,” at ang naganap ngunit nananatiling pagtataya ng ἥγημαι sa payak na “itinuring ko.” Ang “dahil sa Mesiyas” ay wastong nagbibigay ng sanhi/batayan para sa διὰ τὸν Χριστόν, at ang “kawalan” ay angkop sa ζημίαν at sa metaporang pangkuwenta.'
