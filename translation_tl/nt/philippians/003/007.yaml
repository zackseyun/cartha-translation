id: PHP.3.7
reference: Philippians 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: tl
  text: Ngunit anumang mga bagay na naging pakinabang sa akin, itinuring ko ang mga iyon na kawalan dahil sa Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinahihiwatig ang matinding pagsalungat sa mga naunang batayan ni Pablo para magtiwala.
- source_word: ἅτινα
  choice: anumang mga bagay
  rationale: Saklaw nito ang kabuuan ng mga dating kalamangan na katatapos lamang ilista ni Pablo.
- source_word: κέρδη
  choice: pakinabang
  rationale: Natural sa modernong Tagalog at pinananatili ang larawang pangkuwenta ng mga bagay na dating itinuturing na kapakinabangan.
- source_word: ἦν μοι
  choice: naging pakinabang sa akin
  rationale: Ipinapahayag ang dating katayuan ng mga bagay na iyon bilang mga pakinabang para kay Pablo.
- source_word: ἥγημαι
  choice: itinuring ko
  rationale: Ang perpektong anyo ay tumutukoy sa isang naganap na muling pagtataya na nananatili ang resulta; ang 'itinuring ko' ay payak at natural, bagaman hindi lubos na nailalantad sa anyo lamang ang nagpapatuloy na resulta.
- source_word: διὰ τὸν Χριστόν
  choice: dahil sa Mesiyas
  rationale: Ang διά na may akusatibo ay maaaring magpahayag ng dahilan o batayan; isinasalin ang Χριστός bilang titulong 'Mesiyas.'
- source_word: ζημίαν
  choice: kawalan
  rationale: Pinananatili nito ang pangkuwentang pagsalungat sa 'pakinabang' at inilalarawan ang dating mga kalamangan bilang isang kabuuang pagkawala.
theological_decisions:
- issue: Pagsasalin ng Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay nauunawaan ang Χριστός bilang titulo, kaya isinasalin ang kahulugan nito sa halip na gamitin lamang ang nakagawiang transliterasyon.
- issue: Saklaw ng διὰ τὸν Χριστόν
  choice: dahil sa Mesiyas
  alternative: alang-alang sa Mesiyas
  rationale: Maaaring magpahiwatig ang parirala ng dahilan o motibasyon. Pinili sa teksto ang tuwirang diwang sanhi, habang inilalagay sa talababa ang lehitimong alternatibo upang mapanatili ang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paghahambing na pangkuwenta sa pagitan ng “pakinabang” at “kawalan,” at iniwasan ang mas teknikal o lumang pananalita.
