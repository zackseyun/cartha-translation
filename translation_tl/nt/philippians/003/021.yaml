base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: tl
  text: na siyang magbabago sa ating hamak na katawan[a] upang maging kaanyo ng kanyang maluwalhating katawan,[b] sa bisa ng kapangyarihan niyang ipasailalim sa kanyang sarili ang lahat ng bagay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang katawan ng ating pagkaaba.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang katawan ng kanyang kaluwalhatian.”
    reason: lexical_alternative
  - marker: c
    text: O “ayon sa pagkilos na nagbibigay sa kanya ng kakayahang ipasailalim sa kanyang sarili ang lahat ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: magbabago
  rationale: Ipinahahayag ng pandiwa ang tunay at panghinaharap na pagbabago ng anyo o kalagayan. Natural sa makabagong Tagalog ang “magbabago,” at nililinaw ng kasunod na “upang maging kaanyo” ang lawak ng pagbabagong tinutukoy.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: ating hamak na katawan
  rationale: Natural nitong ipinahahayag ang kasalukuyang mababang kalagayan ng katawan nang hindi ipinapasok ang karagdagang paliwanag tungkol sa paraan ng muling pagkabuhay. Inilalagay sa talababa ang mas literal na anyo ng parirala.
- source_word: σύμμορφον
  choice: upang maging kaanyo
  rationale: Pinananatili ng “kaanyo” ang diwa ng malakas na pagkakatulad o pagkakaayon ng anyo, at mas tiyak ito kaysa sa payak na “maging katulad.”
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: kanyang maluwalhating katawan
  rationale: Natural na katumbas sa Tagalog ng katawan na inilalarawan o kinakitaan ng kaluwalhatian; ang mas literal na genitive na pananalita ay nasa talababa.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: sa bisa ng kapangyarihan
  rationale: Ipinahahayag nito ang aktibo at mabisang pagkilos na nasa ἐνέργεια, sa natural at marangal na Tagalog.
- source_word: τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα
  choice: kapangyarihan niyang makapagpasailalim sa kanyang sarili maging ang lahat ng bagay
  rationale: Pinananatili ang kakayahan ni Cristo, ang diin ng καί (“maging”), ang malawak na saklaw ng τὰ πάντα, at ang reflexive na “sa kanyang sarili,” nang hindi ipinahihiwatig na may panlabas na kapangyarihang nagbibigay sa kanya ng kakayahan.
theological_decisions:
- issue: Ugnayan ng kasalukuyang pagkaaba ng katawan at ng darating na kaluwalhatian
  choice: Inilalarawan ang panghinaharap na pagbabago ng hamak na katawan ng mga mananampalataya upang maging kaanyo ng maluwalhating katawan ni Cristo.
  alternative: Tahasang idagdag ang salitang “muling pagkabuhay” o ipaliwanag ang mekanismo ng pagbabagong ito.
  rationale: Malinaw sa Griyego ang pagbabagong pangkatawan at ang pagiging kaanyo ng katawan ni Cristo, ngunit hindi nito tahasang inilalahad sa talatang ito ang mekanismo. Kaya hindi nagdagdag ng paliwanag na wala sa teksto.
- issue: Pinagmumulan at paggamit ng kapangyarihan ni Cristo
  choice: “kapangyarihan niyang makapagpasailalim”
  alternative: “kapangyarihang nagbibigay sa kanya ng kakayahan”
  rationale: Ang alternatibo ay maaaring magpahiwatig na ang kakayahan ay ipinagkakaloob kay Cristo ng isang panlabas na puwersa. Mas maingat na ipinapakita ng napiling pananalita na siya ang may kakayahang gumawa nito, habang pinananatili ang kaugnayan sa ἐνέργεια.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaanyo” upang mapanatili ang masidhing pagtutugma ng σύμμορφον, at ang kolektibong isahan na “katawan” upang sundan ang Griyego. Ang panimulang “na siyang” ay nagpapanatili sa panghalip na nag-uugnay sa talata sa naunang banggit kay Cristo.
