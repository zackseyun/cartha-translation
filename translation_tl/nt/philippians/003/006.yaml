  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: tl
  text: Sa sigasig, tagausig ng iglesya; sa katuwirang nasa Kautusan, naging walang kapintasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, walang maiparatang ayon sa pamantayan ng Kautusan; hindi nito kinakailangang ipahiwatig ang ganap na kawalan ng kasalanan.
    reason: theological_clarification
lexical_decisions:
- source_word: κατὰ
  choice: kung tungkol sa
  rationale: Ipinakikilala ng κατά ang bawat batayan ng pagsusuri at pinananatili ng pag-uulit ang balanseng retorika ng Griyego.
- source_word: ζῆλος
  choice: sigasig
  rationale: Natural at malinaw itong tumutukoy sa matindi niyang dating debosyon at pagkilos dahil sa relihiyosong paninindigan.
- source_word: διώκων
  choice: inuusig ko
  rationale: Sa konteksto, hostile na pagkilos laban sa mga mananampalataya ang tinutukoy, hindi simpleng paghabol. Ginawang tahasang unang panauhan upang maging natural sa Tagalog ang nakapaloob na paksa.
- source_word: τὴν ἐκκλησίαν
  choice: ang iglesya
  rationale: Tumutukoy ito sa pamayanang Kristiyano; ang “iglesya” ay maikli, pamilyar, at angkop sa dignidad ng teksto.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Pinananatili nito ang malawak na diwang moral at legal ng δικαιοσύνη nang hindi ito nililimitahan sa makabagong kahulugan ng “katarungan.”
- source_word: τὴν ἐν νόμῳ
  choice: nasa Kautusan
  rationale: Malapit ito sa literal na “nasa kautusan” at pinananatili ang ideya ng larangan o pamantayang pinagbabatayan ng katuwiran. Ginamit ang malaking titik dahil partikular na Kautusan ng Israel ang tinutukoy.
- source_word: γενόμενος
  choice: naging
  rationale: Natural na ipinahahayag sa Tagalog ang naganap na kalagayang ipinahihiwatig ng participle.
- source_word: ἄμεμπτος
  choice: walang kapintasan
  rationale: Ipinahahayag nito ang pagiging walang maiparatang ayon sa binanggit na pamantayan, nang hindi kinakailangang mangahulugan ng ganap na kawalan ng kasalanan.
theological_decisions:
- issue: Saklaw ng pahayag ni Pablo na ἄμεμπτος
  choice: Ang pagiging “walang kapintasan” ay nililimitahan ng pariralang “kung tungkol sa katuwirang nasa Kautusan.”
  alternative: Maaaring unawain bilang pag-aangkin ng ganap na kawalan ng kasalanan o bilang purong ironya.
  rationale: Sa gramatika, ang ἄμεμπτος ay kaugnay ng katuwirang tinutukoy bilang nasa Kautusan. Kaya inilalarawan ni Pablo ang pagkakataya sa dati niyang pamumuhay ayon sa pamantayang iyon, hindi isang walang-pasubaling pag-aangkin ng moral na kasakdalan.
- issue: Ugnayan ng ἐν νόμῳ sa δικαιοσύνη
  choice: “katuwirang nasa Kautusan”
  alternative: “katuwiran sa ilalim ng Kautusan”
  rationale: Ang “nasa Kautusan” ay mas tuwirang kumakatawan sa ἐν νόμῳ at hindi agad nagpapasya kung ang Kautusan ay pangunahing larangan, pinagmulan, o pamantayan ng katuwirang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang magkatulad na ayos ng dalawang pariralang κατά sa pamamagitan ng “kung tungkol sa.” Ginamit ang “iglesya” bilang karaniwang terminong biblikal at “Kautusan” para sa partikular na Torah/Kautusan ng Israel.
