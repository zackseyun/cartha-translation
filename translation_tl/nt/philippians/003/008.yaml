id: PHP.3.8
reference: Philippians 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: tl
  text: Higit pa riyan, itinuturing kong kawalan ang lahat ng bagay dahil sa di-matutumbasang halaga ng pagkakilala kay Cristo Jesus na aking Panginoon. Alang-alang sa kanya, dumanas ako ng pagkawala ng lahat ng bagay at itinuturing ko ang mga iyon na basura[a], upang makamit ko si Cristo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “basura” ay salin ng isang mariing salita na maaari ring mangahulugang “mga itinapon,” “dumi,” o “tae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Higit pa riyan
  rationale: Likas na Filipino itong panandang nagpapaigting at sumusulong mula sa naunang pahayag.
- source_word: ἡγοῦμαι
  choice: itinuturing ko
  rationale: Ipinahahayag ng pandiwa ang sinadya at pinag-isipang pagtataya; pinananatili ang iisang salin sa dalawang paglitaw.
- source_word: πάντα / τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at sinasadyang saklaw ng Griyego.
- source_word: ζημίαν
  choice: kawalan
  rationale: Angkop sa paghahambing ng pakinabang at kawalan na nagpapatuloy sa talata.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: dahil sa di-matutumbasang halaga ng pagkakilala
  rationale: Ipinahahayag ang nangingibabaw na halaga ng γνώσις nang natural sa Filipino; ang 'pagkakilala' ay maaaring tumukoy sa kaalamang personal at relasyonal nang hindi isinasara ang saklaw nito.
- source_word: Χριστοῦ Ἰησοῦ / Χριστόν
  choice: Cristo Jesus / Cristo
  rationale: Ang 'Cristo' ang dignified at karaniwang anyo sa modernong saling Filipino, at dala pa rin nito ang titulong Mesiyas.
- source_word: τοῦ κυρίου μου
  choice: na aking Panginoon
  rationale: Pinananatili ang pag-aari at bigat ng titulong κύριος.
- source_word: δι’ ὃν
  choice: Dahil sa kanya
  rationale: Pinananatili ang personal na dahilan o kapakanan na ipinahihiwatig ng parirala nang hindi labis na nililinaw ang ugnayan.
- source_word: ἐζημιώθην
  choice: naiwala ko
  rationale: Natural na Filipino para sa aktuwal na pagdanas ng pagkawala; naipahihiwatig ng anyo na nangyari ang kawalan kay Pablo.
- source_word: σκύβαλα
  choice: basura
  rationale: Malakas at mapanghamak na katawagan sa mga itinapong bagay; ipinapaliwanag sa talababa ang mas magaspang na saklaw nito.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: upang makamit ko si Cristo
  rationale: Pinananatili ang layunin ng ἵνα at ang metapora ng pakinabang o pagkamit.
theological_decisions:
- issue: Paglilipat ng Χριστός sa gamit ni Pablo
  choice: Cristo
  alternative: Mesiyas
  rationale: Ang 'Cristo' ay pamilyar at dignified sa modernong Filipino at hindi kinakailangang gawing pangalang walang kahulugan; nananatili rito ang titular na diwa ng 'Mesiyas'.
- issue: Saklaw ng γνώσεως
  choice: pagkakilala
  alternative: kaalaman tungkol kay
  rationale: Hindi nililimitahan ng 'pagkakilala' ang parirala sa intelektuwal na impormasyon lamang, ngunit hindi rin nito tahasang dinaragdagan ang teksto ng isang tiyak na teolohikal na paliwanag.
- issue: Puwersa ng ἐζημιώθην
  choice: naiwala ko
  alternative: dumanas ako ng pagkawala
  rationale: Maikli at natural ang pinili habang pinananatili ang aktuwal na pagkawala; ang alternatibo ay higit na lantad sa pasibong diwa ngunit mas mabigat sa Filipino.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang 'Cristo' bilang karaniwang anyong Filipino; iniwasan ang masyadong teknikal o denominasyonal na pananalita. Ang marker na [a] ay inilagay kaagad pagkatapos ng salitang tinatalabaan.
