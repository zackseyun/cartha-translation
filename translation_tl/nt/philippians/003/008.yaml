  to: Higit pa riyan, itinuturing kong kawalan ang lahat ng bagay dahil sa di-matutumbasang halaga ng pagkakilala kay Cristo Jesus na aking Panginoon. Alang-alang sa kanya, dumanas ako ng pagkawala ng lahat ng bagay at itinuturing ko ang mga iyon na basura[a], upang makamit ko si Cristo.
  rationale: 'Inayos ang dalawang pariralang may mahalagang semantikong nuwes: ang δι’ ὃν ay isinaling “Alang-alang sa kanya” upang maipakita ang oryentasyong “for whose sake,” at ang ἐζημιώθην ay isinaling “dumanas ako ng pagkawala” upang mapanatili ang pasibong diwa. Walang binago sa saklaw, layunin, o metapora ng talata; nananatiling nakaangkla nang tama ang talababa sa “basura.”'
