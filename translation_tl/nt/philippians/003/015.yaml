base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: tl
  text: Kaya, tayong lahat na may sapat na gulang sa pananampalataya[a] ay ganito ang isipin natin. At kung may naiiba kayong iniisip sa anumang bagay, ipahahayag din ito ng Diyos sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ganap.” Ang salitang Griyego ay maaari ring mangahulugang “ganap,” ngunit dito ay malamang na tumutukoy sa espirituwal na pagkamay-gulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Nagpapakita ito ng kongklusyon mula sa naunang pangangatwiran at natural na pang-ugnay sa modernong Tagalog.
- source_word: ὅσοι
  choice: tayong lahat na
  rationale: Pinananatili ang saklaw ng grupo at ang inklusibong tono ni Pablo.
- source_word: τέλειοι
  choice: mga ganap na
  rationale: Pinananatili ang posibilidad ng kahulugang “ganap” habang ipinapaliwanag sa talababa na sa konteksto ay malamang na tumutukoy ito sa espirituwal na kahustuhan.
- source_word: τοῦτο φρονῶμεν
  choice: ay mag-isip nang ganito
  rationale: Ang hortatory subjunctive ay likas na naihahayag bilang sama-samang panawagan, at ang “ganito” ay tumutukoy sa pananaw na inilarawan sa naunang konteksto.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: kung naiiba ang iniisip ninyo sa anumang bagay
  rationale: Pinananatili ang kondisyon, ang bukas na saklaw ng τι, at ang pagkakaiba ng pananaw.
- source_word: ἀποκαλύψει
  choice: ihahayag
  rationale: Direktang katumbas na nagpapanatili sa diwa ng paghahayag na nagmumula sa Diyos.
theological_decisions:
- issue: Kahulugan ng τέλειοι sa panawagan ni Pablo
  choice: ganap na, na may talababa tungkol sa kahustuhang espirituwal
  alternative: mga may sapat na gulang sa pananampalataya / mga nasa hustong espirituwal na kalagayan
  rationale: Maaaring mangahulugan ang salita ng “ganap” o “may hustong gulang.” Dahil sinabi ni Pablo sa naunang talata na hindi pa siya ganap, hindi dapat ipakahulugan dito nang tahimik ang kawalang-kasalanan. Pinananatili ng salin at talababa ang tunay na leksikal at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tayong” upang panatilihin ang inklusibong panawagan ni Pablo, at iniwasan ang masyadong teknikal o denominasyonal na pananalita.
