  terminology: Ang “may sapat na gulang sa pananampalataya” ay naglalahad ng kontekstuwal na diwa ng τέλειοι nang hindi ipinahihiwatig ang ganap na kawalang-kasalanan. Pinananatili ng talababa ang leksikal na alternatibong “ganap” at ang kaugnay na tensiyon sa konteksto.
