base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: tl
  text: Sapagkat marami ang namumuhay bilang mga kaaway ng krus ng Mesiyas[a]—madalas ko silang binabanggit noon sa inyo, at ngayo’y sinasabi ko ito habang umiiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Cristo.”
    reason: Alternatibong tradisyonal na salin ng titulong Χριστός.
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Substantibong gamit ang pang-uri at tuwirang tumutukoy sa maraming tao.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili nito ang paliwanag o batayang kaugnayan ng talata sa naunang pahayag.
- source_word: περιπατοῦσιν
  choice: namumuhay
  rationale: Metaporikal itong tumutukoy sa paraan ng pamumuhay. Mas likas at malinaw sa makabagong Tagalog ang “namumuhay” kaysa literal na “lumalakad,” habang pinananatili ang diwa.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: madalas ko na silang binanggit sa inyo
  rationale: Ipinahahayag ng imperfect kasama ng πολλάκις ang paulit-ulit na pagsasabi noon. Likas sa Tagalog ang “binanggit sa inyo” para sa mga taong dati nang tinutukoy ni Pablo.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: at ngayo’y sinasabi ko itong lumuluha
  rationale: Pinananatili ng “lumuluha” ang kasabay at nagpapatuloy na kilos ng participle habang nagsasalita si Pablo.
- source_word: ἐχθροὺς
  choice: mga kaaway
  rationale: Tuwiran at matindi nitong ipinahahayag ang pagsalungat na nasa salitang Griyego.
- source_word: σταυροῦ
  choice: krus
  rationale: Ito ang nakagawiang tuwirang salin at saklaw nito rito ang kamatayan sa krus at ang kabuluhang teolohikal niyon.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito bilang titulo ang Χριστός; ipinapahayag ng “Mesiyas” ang kahulugan ng titulo sa halip na tratuhin lamang itong pangalan.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo o pangalang nakagawian
  choice: Mesiyas
  alternative: Cristo
  rationale: Hindi hinihingi ng parirala ang gamit na tila personal na pangalan. Pinananatili ng “Mesiyas” ang titulong ipinahahayag ng Χριστός, habang inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Ugnayan ng “namumuhay” at “mga kaaway”
  choice: namumuhay bilang mga kaaway
  alternative: namumuhay—…—mga kaaway
  rationale: Ang accusative na τοὺς ἐχθρούς ay tumutukoy sa πολλοὶ bilang appositional na paglalarawan. Nililinaw ng “bilang” ang ugnayan nang hindi ipinapakahulugang kilos lamang ang pagiging kaaway.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Inayos nang bahagya ang pagkakasunod-sunod upang maging likas sa Tagalog, ngunit pinanatili ang paliwanag na “sapagkat,” ang paulit-ulit na dating pagsasabi, ang kasalukuyang pagluha, at ang matinding katawagang “mga kaaway.”
