  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: tl
  text: 'Mga kapatid[a], hindi ko itinuturing na nahawakan ko na iyon. Ngunit isang bagay: nililimot ang mga bagay na nasa likuran at inaabot ang mga bagay na nasa unahan,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Mga kapatid” ay salin ng panlalaking anyong Griego na adelphoi; madalas itong gamitin ni Pablo para sa buong komunidad ng mga mananampalataya, kasama ang mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Mga kapatid
  rationale: Likas na panawag ito sa modernong Tagalog at hindi minamarkahan ang kasarian, bagaman panlalaki ang anyong Griego; ipinapaliwanag sa talababa na karaniwan itong tumutukoy sa buong komunidad ng mga mananampalataya.
- source_word: λογίζομαι
  choice: itinuturing
  rationale: Ipinahahayag nito ang personal na pagtatasa o pagkilala ni Pablo nang natural at malinaw.
- source_word: κατειληφέναι
  choice: nahawakan ko na iyon
  rationale: Pinananatili ang larawang paghawak o pagdakma mula sa konteksto ng talata 12; idinagdag ang “iyon” bilang likas na ipinahihiwatig na layon.
- source_word: ἓν δέ
  choice: Ngunit isang bagay
  rationale: Pinananatili ang maikli at biglang elipsis ng Griego nang hindi idinaragdag ang di-hayag na “ang ginagawa ko.”
- source_word: τὰ μὲν ὀπίσω
  choice: ang mga bagay na nasa likuran
  rationale: Pinananatili ang pangmaramihang diwa at ang larawang tumutukoy sa nasa likod.
- source_word: ἐπιλανθανόμενος
  choice: nililimot
  rationale: Direktang katumbas na nagpapanatili sa progresibong larawang pampalakasan nang hindi ito labis na binibigyang-kahulugan.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: ang mga bagay na nasa unahan
  rationale: Malinaw na katapat ng “mga bagay na nasa likuran” at pinananatili ang direksiyong pasulong.
- source_word: ἐπεκτεινόμενος
  choice: inaabot
  rationale: Natural na Tagalog para sa aktibong pag-unat o pag-abot pasulong, nang hindi dinaragdagan ang tindi ng pandiwa.
theological_decisions:
- issue: Hindi hayag na layon ng κατειληφέναι
  choice: iyon
  alternative: huwag maglagay ng layon / “nakamit ko na”
  rationale: Ang “iyon” ay nagpapalinaw sa Tagalog habang hindi tinutukoy nang mas eksakto kaysa sa teksto kung ano ang nahawakan; pinananatili rin nito ang metapora ng paghawak mula sa talata 12.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang putol at eliptikong “Ngunit isang bagay” at ang magkapares na larawan ng nasa likuran at nasa unahan.
