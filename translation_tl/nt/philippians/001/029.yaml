  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: tl
  text: Sapagkat alang-alang sa Mesiyas[a], ipinagkaloob sa inyo bilang biyaya hindi lamang ang sumampalataya sa kanya[b], kundi pati ang magdusa alang-alang sa kanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.” Ang Griyegong Χριστός ay isang titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: O, “magtiwala sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: O, “dahil sa kanya” o “para sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag o dahilan kaugnay ng matapang na paninindigan sa naunang talata.
- source_word: ἐχαρίσθη
  choice: ipinagkaloob sa inyo bilang biyaya
  rationale: Pinananatili nito ang diwa ng malaya at mapagbiyayang pagkakaloob, hindi lamang pagpapahintulot.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: alang-alang sa Mesiyas
  rationale: Ipinahihiwatig ng ὑπέρ na ang buong kaloob—kapuwa pananampalataya at pagdurusa—ay may kaugnayan at ginagawa alang-alang sa Mesiyas. Ginamit ang “Mesiyas” upang ipakita ang Χριστός bilang titulo.
- source_word: πιστεύειν εἰς αὐτόν
  choice: ang sumampalataya sa kanya
  rationale: Likas at malinaw itong salin ng pagtitiwala o paglalagak ng pananampalataya sa isang persona.
- source_word: πάσχειν
  choice: ang magdusa
  rationale: Tuwiran nitong pinananatili ang kahulugan ng infinitibong Griyego nang hindi pinahihina ang pahayag.
- source_word: ὑπὲρ αὐτοῦ
  choice: alang-alang sa kanya
  rationale: Ipinapahayag nito na ang pagdurusa ay dahil sa at para sa kapakanan ng Mesiyas.
theological_decisions:
- issue: Kung dapat pahinain ang pahayag na kapuwa ang pananampalataya at pagdurusa ay ipinagkaloob bilang biyaya
  choice: Pinanatiling saklaw ng mapagbiyayang pagkakaloob ang kapuwa pagsampalataya at pagdurusa
  alternative: Isaling “pinahintulutan kayo” o baguhin ang ayos upang hindi malinaw na parehong saklaw ng pagkakaloob ang dalawang infinitibo
  rationale: Sa Griyego, kapuwa ang pagsampalataya at pagdurusa ay pagpapaliwanag sa ipinagkaloob. Pinananatili ng salin ang tunay na teolohikal na tensiyon at ang di-tahasang banal na tagaganap ng balintiyak na pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilagay sa unahan ang “alang-alang sa Mesiyas” upang malinaw na saklaw nito ang dalawang magkatuwang na kaloob, habang pinananatili ang balintiyak na anyo at ang biyayang diwa ng ἐχαρίσθη.
