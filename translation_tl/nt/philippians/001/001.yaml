id: PHP.1.1
reference: Philippians 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: tl
  text: 'Sina Pablo at Timoteo, mga alipin[a] ng Mesiyas na si Jesus[b], para sa lahat ng mga banal na nasa Mesiyas na si Jesus at nasa Filipos, kasama ang mga tagapangasiwa[c] at mga diyakono:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ipinahihiwatig ng salitang Griyego ang mga taong nasa ilalim ng pagmamay-ari at kapangyarihan ng isang panginoon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Cristo Jesus.” Ang salitang Griyego na Christos ay titulong nangangahulugang “Mesiyas” o “Pinahiran.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “mga obispo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Tuwirang ipinahahayag nito ang kalagayang nakatali sa isang panginoon na taglay ng salitang Griyego; mas matindi at mas tiyak ito kaysa “mga lingkod.”
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: ng / nasa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang ginagawang natural sa Tagalog ang pagkakaugnay nito sa pangalang Jesus.
- source_word: ἁγίοις
  choice: mga banal
  rationale: Pinananatili ang kahulugan ng mga taong ibinukod bilang banal nang hindi nagdaragdag ng tahasang pariralang “mga banal na tao ng Diyos.”
- source_word: ἐν
  choice: nasa
  rationale: Pinananatili ang sadyang pag-uulit at malawak na diwa ng pagiging “nasa” Mesiyas at nasa Filipos, sa halip na paliitin ito sa isang paliwanag gaya ng “nakipag-isa kay.”
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: at nasa Filipos
  rationale: Natural na Tagalog na nagpapanatili sa tahasang lokasyon ng mga tinutukoy na banal.
- source_word: σὺν
  choice: kasama
  rationale: Malinaw na ipinahahayag ang pakikisama o pagkakabilang ng mga tagapangasiwa at diyakono sa mga pinadadalhan.
- source_word: ἐπισκόποις
  choice: mga tagapangasiwa
  rationale: Isinasalin ang pangunahing diwa ng tungkuling mangasiwa at umiiwas sa awtomatikong pagpasok ng mas huling konotasyon ng titulong “obispo.”
- source_word: διακόνοις
  choice: mga diyakono
  rationale: Sa pagkakapares nito sa mga tagapangasiwa, malamang na tumutukoy ito sa kinikilalang tungkulin sa kapulungan; ang “diyakono” ang malinaw at nakaugaliang katumbas.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: para sa lahat ng mga banal
  rationale: Pinananatili ang kabuuang saklaw ng πᾶσιν at ang anyo ng pambungad na pagbati sa liham.
theological_decisions:
- issue: Pagsasalin sa Χριστός sa pormula ng pagbati ni Pablo
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Ang Χριστός ay may puwersa pa rin bilang titulo rito. Ang “Mesiyas” ay malinaw na nagsasalin sa titulo, samantalang ang “Cristo” ay maaari nang marinig bilang bahagi lamang ng pangalan.
- issue: Pagsasalin sa δοῦλοι sa Filipos 1:1
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang “mga alipin” ang mas ganap na nagpapanatili sa diwa ng pag-aari at lubos na pagpapasakop sa isang panginoon. Inilalagay sa talababa ang mas banayad at tradisyonal na alternatibo.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: nasa Mesiyas na si Jesus
  alternative: nakipag-isa sa Mesiyas na si Jesus
  rationale: Ang literal ngunit mauunawaang “nasa” ay nagpapanatili sa siksik at malawak na teolohikal na pananalita ni Pablo, sa halip na ipako ito sa iisang paliwanag tungkol sa pakikipag-isa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sina Pablo at Timoteo” bilang natural na anyo ng nominative na nagpapakilala sa mga nagpadala, ngunit hindi idinagdag ang pandiwang “sumulat.” Sadyang pinanatili ang bahagyang di-karaniwang “nasa Mesiyas” upang huwag burahin o ipaliwanag nang labis ang paulit-ulit na ἐν ng Griyego.
