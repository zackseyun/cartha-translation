id: PHP.1.23
reference: Philippians 1:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: tl
  text: Ngunit naiipit ako sa pagitan ng dalawang ito. May pagnanais akong lumisan[a] at makapiling ang Mesiyas[b], sapagkat di-hamak na mas mabuti iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamatay.” Sa literal, “lumisan.”
    reason: lexical_alternative
  - marker: b
    text: O “Cristo.” Ang salitang Griyego ay nangangahulugang “ang Mesiyas.”
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: naiipit ako
  rationale: Ipinahahayag nito ang pagiging gipit o naiipit sa magkatunggaling posibilidad, nang hindi pinapalitan ang larawan ng Griyego ng mas tahasang sikolohikal na pananalita.
- source_word: ἐκ τῶν δύο
  choice: sa pagitan ng dalawang ito
  rationale: Idyomatikong tinutukoy ng parirala ang dalawang alternatibong kapuwa gumigipit kay Pablo.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: May pagnanais akong
  rationale: Pinananatili ang tahasang pangngalang ἐπιθυμία habang gumagamit ng natural at dignified na modernong Tagalog.
- source_word: ἀναλῦσαι
  choice: lumisan
  rationale: Pinananatili ang eupemistikong larawan ng pag-alis sa halip na tahasang isalin bilang pagkamatay; inilalagay ang malinaw na kahulugan sa talababa.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' sa kontekstong ito; ibinibigay sa talababa ang nakaugaliang alternatibong 'Cristo.'
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: sapagkat di-hamak na mas mabuti iyon
  rationale: Likas na ipinahahayag sa Tagalog ang matinding antas ng paghahambing sa Griyego.
theological_decisions:
- issue: Pakikipiling sa Mesiyas pagkaraan ng pagpanaw
  choice: lumisan at makapiling ang Mesiyas
  alternative: mamatay at agad na pumunta sa langit
  rationale: Pinananatili lamang ang tahasang sinasabi ng Griyego—ang paglisan at pakikipiling sa Mesiyas—nang hindi nagdaragdag ng paliwanag tungkol sa lugar, paraan, o tiyempo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ang “naiipit” ay nagpapanatili sa diwa ng panlabas na pagdiin at panloob na tensiyon; ang “lumisan” ay sadyang hindi ginawang mas tahas kaysa sa orihinal.
