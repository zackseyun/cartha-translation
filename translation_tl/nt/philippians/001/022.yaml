base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: tl
  text: Ngunit kung ang patuloy kong pamumuhay sa katawan[a] ay nangangahulugan para sa akin ng mabungang paggawa[b]—at hindi ko alam kung alin ang pipiliin ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa laman.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bunga ng paggawa” o “mabungang gawain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: ang patuloy na pamumuhay ko
  rationale: Ipinahahayag nito ang pagpapatuloy ng kasalukuyang buhay ni Pablo, ayon sa konteksto, sa natural na Tagalog.
- source_word: ἐν σαρκί
  choice: sa katawan
  rationale: Sa konteksto, tumutukoy ang σάρξ sa pisikal na buhay sa mundo, hindi sa makasalanang pagkatao. Mas malinaw sa karaniwang mambabasa ang “sa katawan,” habang inilalagay sa talababa ang mas literal na “sa laman.”
- source_word: καρπὸς ἔργου
  choice: mabungang gawain
  rationale: Siksik at bahagyang malabo ang pariralang Griyego. Pinananatili ng “mabungang gawain” ang ideya ng καρπός at ἔργον sa natural na Filipino nang hindi tinutukoy nang higit sa teksto kung anong uri ng gawain ito.
- source_word: αἱρήσομαι
  choice: pipiliin ko
  rationale: Malinaw nitong ipinahahayag ang pagpili ni Pablo sa pagitan ng dalawang posibilidad sa konteksto.
- source_word: οὐ γνωρίζω
  choice: hindi ko alam
  rationale: Bagaman maaari ring mangahulugan ang pandiwa na “ipaalam,” dito ay likas itong pahayag ng kawalang-katiyakan.
theological_decisions:
- issue: Kahulugan ng σάρξ sa talatang ito
  choice: pisikal na pag-iral sa katawan
  alternative: makasalanang pagkatao
  rationale: Inihahambing ng konteksto ang patuloy na buhay ni Pablo sa mundo at ang pagpanaw upang makasama si Cristo; kaya pisikal na buhay ang tinutukoy, hindi moral na kasamaan.
- issue: Ugnayan ng kundisyon at ng pahayag tungkol sa pagpili
  choice: pinanatili ang putol at tensiyonadong ayos sa pamamagitan ng gatlang
  alternative: lagyan ng tahasang “kung gayon” at gawing ganap na lohikal ang pangungusap
  rationale: Siksik at hindi ganap na tahas ang sintaks ng Griyego. Iniiwasan ng gatlang ang pagdaragdag ng isang lohikal na pang-ugnay na wala sa teksto at pinananatili ang pag-aalinlangan ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katawan” sa pangunahing teksto upang maiwasan ang karaniwang maling pagkaunawa sa “laman” bilang makasalanang pagnanasa, ngunit pinanatili sa talababa ang literal na anyo. Ang gatlang ay sumasalamin sa siksik at bahagyang putol na daloy ng orihinal.
