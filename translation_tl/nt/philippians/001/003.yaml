  text: I thank my God at every remembrance of you,[a]
translation:
  language: tl
  text: Nagpapasalamat ako sa aking Diyos tuwing naaalala ko kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagpapasalamat ako sa aking Diyos dahil sa bawat pag-alaala sa inyo.”
