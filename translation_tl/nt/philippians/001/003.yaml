lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Nagpapasalamat ako
  rationale: Likas at tuwirang salin ng pangkasalukuyang pandiwang nasa unang panauhan; pinananatili nito ang patuloy o karaniwang pagkilos nang hindi labis na binibigyang-diin ang aspekto.
- source_word: τῷ θεῷ μου
  choice: sa aking Diyos
  rationale: Ang datibo kasunod ng εὐχαριστέω ay natural na ipinahahayag sa Filipino sa pamamagitan ng “sa”; pinananatili ang personal na “aking.”
- source_word: ἐπὶ πάσῃ τῇ μνείᾳ
  choice: tuwing naaalala
  rationale: Natural na Filipino para sa ideya ng bawat pagkakataon ng pag-alaala. Gayunman, maaaring tumukoy ang parirala sa pasasalamat dahil sa bawat pag-alaala, kaya pinananatili sa talababa ang leksikal at sintaktikong alternatibo.
- source_word: ὑμῶν
  choice: ko kayo
  rationale: Sa natural na Filipino, ang genitibong “ng/inyo” na kaugnay ng pag-alaala ay pinakamalinaw na naipahahayag sa pandiwang pariralang “naaalala ko kayo”; ang “kayo” ay tahasang maramihan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pandiwang “naaalala” sa halip na mas pormal at mabigat na “pag-alaala” sa pangunahing teksto, habang pinanatili sa talababa ang posibleng alternatibong ugnayan ng ἐπὶ sa parirala.
