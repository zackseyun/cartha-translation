base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: tl
  text: puspos ng bunga ng katuwiran[a] na dumarating sa pamamagitan ni Jesus, ang Mesiyas[b], para sa kaluwalhatian at kapurihan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bunga ng katarungan.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Jesus Christ”; ang “Mesiyas” ay salin ng Christos bilang titulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: puspos
  rationale: Ang perpektong partisipyong pasibo ay nagpapahayag ng kalagayang bunga ng isang natapos na pagkilos. Likas at marangal sa Filipino ang “puspos,” at naiuugnay nito ang talata sa naunang sugnay.
- source_word: καρπὸν
  choice: bunga
  rationale: Pinananatili ng “bunga” ang metapora ng nakikitang etikal at espirituwal na kinalabasan.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang katumbas ng δικαιοσύνη sa kontekstong Paulino. Hindi nito labis na nililinaw kung ang bunga ay binubuo ng katuwiran o inilalarawan bilang matuwid.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: na nagmumula sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na may henitibo ay nagsasaad ng paraan o tagapamagitan. Ipinakikita ng “nagmumula sa pamamagitan” na ang bunga ay nakasalalay kay Jesus, habang nananatiling natural sa Filipino.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός ayon sa kahulugan nito bilang titulo, sa halip na ituring lamang na ikalawang pangalan.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: para sa kaluwalhatian at kapurihan ng Diyos
  rationale: Ipinahahayag ng “para sa” ang layunin o bunga ng εἰς, at natural itong mabasa sa makabagong Filipino.
theological_decisions:
- issue: Kahulugan ng “bunga ng katuwiran”
  choice: Pinanatili ang pariralang “bunga ng katuwiran” nang hindi nililimitahan ang ugnayan ng henitibo.
  alternative: “bungang binubuo ng katuwiran” o “bunga na ibinibilang na katuwiran”
  rationale: Maaaring tumukoy ang parirala sa bungang may katangian ng katuwiran o sa bungang binubuo mismo ng katuwiran. Hindi tiyak na nilulutas ng konteksto ang gramatikal na ugnayan, kaya pinananatili ng salin ang tunay na kalabuan.
- issue: Papel ni Jesus sa paglitaw ng bunga
  choice: “nagmumula sa pamamagitan ni Jesus na Mesiyas”
  alternative: “ginagawa ni Jesus na Mesiyas”
  rationale: Malinaw ang pamamagitan o ahensiya sa διά, ngunit hindi dapat palitan ng salin ang malawak na pahayag ng tahasang pag-aangkin tungkol sa eksaktong paraan ng pagkilos.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “puspos” dahil pamilyar ito sa wikang biblikal at malinaw pa rin sa karaniwang mambabasa; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
