  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: tl
  text: 'At ito ang idinadalangin ko: na lalo pang sumagana nang sumagana ang inyong pag-ibig sa kaalaman[a] at sa lahat ng pagkilatis.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na may kaalaman”; ang preposisyong Griyego ay maaaring magpahiwatig ng malapit na pagkakaugnay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng pagkaunawa” o “lahat ng moral na pandama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: At ito
  rationale: Pinananatili ang pang-ugnay na καί at ang pantukoy na τοῦτο, at likas itong naghuhudyat ng paglipat mula sa pasasalamat ni Pablo tungo sa nilalaman ng kanyang panalangin.
- source_word: προσεύχομαι
  choice: idinadalangin ko
  rationale: Likas na Filipino para sa patuloy na panalangin ni Pablo; hindi kailangang pilitin ang aspektong progresibo ng pandiwang Griyego.
- source_word: ἵνα
  choice: na
  rationale: Ipinakikilala ang nilalaman at layunin ng panalangin sa natural na balangkas ng Filipino.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: ang inyong pag-ibig
  rationale: Tuwirang ipinapahayag ang pag-ibig na taglay ng mga kausap, nang hindi tinutukoy ang layon nito sapagkat hindi rin iyon tahasang sinasabi sa Griyego.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: lalo pang ... nang sumagana
  rationale: Ang pariralang “lalo pang sumagana nang sumagana” ay nagpapanatili sa ἔτι at sa inuulit na μᾶλλον, na kapwa nagpapahiwatig ng patuloy at higit pang paglago.
- source_word: περισσεύῃ
  choice: sumagana
  rationale: Pinananatili ang larawan ng kasaganaan o pag-uumapaw, ngunit gumagamit ng karaniwang salitang madaling maunawaan.
- source_word: ἐν ἐπιγνώσει
  choice: sa kaalaman
  rationale: Pinananatili ang preposisyong ἐν at ang malawak na diwa ng ἐπίγνωσις nang hindi labis na ginagawa itong teknikal na “ganap na kaalaman.”
- source_word: πάσῃ αἰσθήσει
  choice: ganap na pagkilatis
  rationale: Ang “pagkilatis” ay naghahatid ng praktikal at moral na kakayahang kumilala o humatol, samantalang ang “ganap” ay kumakatawan sa lawak na ipinahihiwatig ng πάσῃ.
theological_decisions:
- issue: Ang kaugnayan ng pag-ibig sa kaalaman at pagkilatis
  choice: sa kaalaman at ganap na pagkilatis
  alternative: na may kaalaman at ganap na pagkilatis
  rationale: Pinananatili sa pangunahing teksto ang ἐν bilang “sa,” nang hindi tiyak na nilulutas kung ito ay saklaw, kalagayan, o malapit na pagkakaugnay; inilalagay sa talababa ang mas kasamang diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “idinadalangin” at “pagkilatis” bilang mga salitang pamilyar sa karaniwang mambabasa ngunit angkop sa seryosong tono ng liham. Sadyang pinanatili ang bahagyang ambigguwidad ng ἐν at hindi tinukoy kung kanino o saan nakatuon ang pag-ibig.
