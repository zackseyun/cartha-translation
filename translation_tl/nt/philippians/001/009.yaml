  source_fidelity: 'Ang pangunahing diwa at balangkas ay tapat sa Griyego: pinananatili ang panalangin ni Pablo, ang patuloy na paglago ng pag-ibig, at ang ugnayan nito sa kaalaman at αἴσθησις. Gayunman, ang “ganap na pagkilatis” ay hindi wastong katumbas ng πάσῃ αἰσθήσει, sapagkat ang πάσῃ ay “lahat/bawat,” hindi “ganap” sa diwang lubos o perpekto.'
  naturalness: Likas at angkop sa makabagong Filipino ang “At ito ang idinadalangin ko” at “lalo pang sumagana nang sumagana.” Mas malinaw at natural ang “sa lahat ng pagkilatis” kaysa “ganap na pagkilatis,” habang iniiwasan ang maling implikasyong perpekto o kumpleto ang pagkilatis.
