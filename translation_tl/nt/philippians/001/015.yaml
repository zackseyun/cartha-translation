  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: tl
  text: May ilan ngang nangangaral tungkol sa Mesiyas[a] dahil sa inggit at pakikipagtunggali, ngunit ang iba naman ay dahil sa mabuting hangarin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griego ay Χριστός (Christos).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: May ilan nga … ngunit ang iba naman
  rationale: Likas sa modernong Tagalog ang hulma upang malinaw na mapanatili ang paghahambing ng dalawang pangkat na ipinahihiwatig ng μέν … δέ.
- source_word: διὰ φθόνον
  choice: dahil sa inggit
  rationale: Ang διά na may accusative ay nagpapahayag dito ng dahilan o motibo; tuwiran at natural itong naihahayag ng “dahil sa inggit.”
- source_word: ἔριν
  choice: pakikipagpaligsahan
  rationale: Ipinahihiwatig ng salita rito ang mapagkumpitensiyang alitan sa pagitan ng mga tao. Mas angkop sa konteksto ang “pakikipagpaligsahan” kaysa sa pangkalahatang “alitan.”
- source_word: δι’ εὐδοκίαν
  choice: dahil sa mabuting hangarin
  rationale: Kasalungat ito ng inggit at pakikipagpaligsahan at tumutukoy sa positibong motibo. Natural at malinaw sa Tagalog ang “mabuting hangarin” nang hindi labis na tinutukoy kung kanino nakatuon ang kabutihang-loob.
- source_word: τὸν Χριστόν
  choice: ang Mesiyas
  rationale: Ang Χριστός ay pamagat na nangangahulugang ang Pinahiran; sa kontekstong ito, sinusuportahan ng artikulo ang titular na gamit na “ang Mesiyas.”
- source_word: κηρύσσουσιν
  choice: nangangaral tungkol sa
  rationale: Karaniwan at malinaw sa modernong Tagalog ang “nangangaral tungkol sa” para sa hayagang pagpapahayag ng mensahe hinggil sa Mesiyas, at hindi nito nililimitahan ang kilos sa isang pormal na institusyon.
theological_decisions:
- issue: Kung isasalin ang Χριστός bilang pamagat o gagamiting pangalang “Cristo”
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan nito bilang titulo sa pariralang may tiyak na artikulo, habang kinikilala sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nga” at “naman” upang natural na maipakita ang diin at paghahambing, nang hindi mekanikal na inuulit ang dalawang καί ng Griego.
