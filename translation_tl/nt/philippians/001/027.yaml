id: PHP.1.27
reference: Philippians 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: tl
  text: 'Ito lamang: mamuhay kayo bilang mga mamamayan[a] sa paraang karapat-dapat sa ebanghelyo ng Mesiyas. Sa gayon, dumating man ako at makita ko kayo o wala man ako roon, mabalitaan ko tungkol sa inyo na matatag kayong nakatayo sa iisang espiritu[b], na may iisang kalooban[c], na sama-samang nakikipagpunyagi para sa pananampalataya ng ebanghelyo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umasta kayo.” Ang pandiwang Griyego ay may pahiwatig ng pamumuhay bilang mamamayan.
    reason: lexical_alternative
  - marker: b
    text: O “sa iisang Espiritu.” Maaaring tumukoy ito sa Banal na Espiritu.
    reason: alternative_reading
  - marker: c
    text: Sa literal, “may iisang kaluluwa.”
    reason: lexical_alternative
  - marker: d
    text: O “sama-samang nakikipagpunyagi para sa pananampalataya sa ebanghelyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Ito lamang
  rationale: Pinananatili ang mariing pambungad at ipinakikitang ito ang nangingibabaw na tagubilin.
- source_word: ἀξίως
  choice: sa paraang karapat-dapat sa
  rationale: Likas sa modernong Filipino at malinaw na inilalarawan ang paraan ng pamumuhay.
- source_word: πολιτεύεσθε
  choice: mamuhay kayo bilang mga mamamayan
  rationale: Pinananatili ang sibikong pahiwatig ng pandiwa, na angkop din sa konteksto ng Filipos, sa halip na gawing pangkalahatang 'umasal.'
- source_word: εὐαγγελίου
  choice: ebanghelyo
  rationale: Karaniwan, dignipikado, at nakikilalang salitang teolohikal sa Filipino.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo; malinaw na naihahatid ng 'Mesiyas' ang kahulugan nito.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: mabalitaan ko tungkol sa inyo
  rationale: Natural na Filipino para sa idyomatikong Griyego at napapanatili ang diwa ng pagtanggap ng balita tungkol sa kanila.
- source_word: στήκετε
  choice: matatag kayong nakatayo
  rationale: Pinananatili ang larawan ng pagtindig at ang diwa ng pananatiling matibay.
- source_word: ἐν ἑνὶ πνεύματι
  choice: sa iisang espiritu
  rationale: Ang maliit na titik ay umaangkop sa agarang diin sa pagkakaisa, ngunit hindi tuluyang isinasara ang posibilidad na tumutukoy ito sa Banal na Espiritu.
- source_word: μιᾷ ψυχῇ
  choice: nagkakaisang kalooban
  rationale: Mas natural kaysa literal na 'iisang kaluluwa' sa Filipino at inihahatid ang sama-samang paninindigan, habang itinatala sa talababa ang mas literal na larawan.
- source_word: συναθλοῦντες
  choice: sama-samang nakikipaglaban
  rationale: Pinananatili ang larawan ng magkatuwang na pagpupunyagi o pakikipagtunggali.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: para sa pananampalataya ng ebanghelyo
  rationale: Malapit sa anyong henitibo ng Griyego at hindi labis na nilulutas kung ito ay pananampalatayang nilalaman ng ebanghelyo o pananampalataya rito.
theological_decisions:
- issue: Kung ang πνεύματι ay tumutukoy sa sama-samang espiritu ng mga mananampalataya o sa Banal na Espiritu
  choice: sa iisang espiritu
  alternative: sa iisang Espiritu
  rationale: Ang pagkakatulad nito sa μιᾷ ψυχῇ ay pumapabor sa pagkakaisa ng disposisyon, ngunit nananatiling posible ang pagtukoy sa Banal na Espiritu kaya inilagay ang alternatibo sa talababa.
- issue: Ang ugnayan ng πίστει sa τοῦ εὐαγγελίου
  choice: para sa pananampalataya ng ebanghelyo
  alternative: para sa pananampalataya sa ebanghelyo
  rationale: Pinananatili ng pangunahing salin ang mas malapit at sadyang malabong henitibong konstruksyon; ang alternatibo ay maaaring tumukoy sa gawa ng pagsampalataya sa ebanghelyo.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Pinanatili ang sibikong larawan ng πολιτεύεσθε, ang larawan ng matatag na pagtindig, at ang kolektibong pakikipaglaban. Ginamit ang “Mesiyas” bilang titulo para sa Χριστός. Ang mga tunay na kalabuan sa πνεύματι at τῇ πίστει τοῦ εὐαγγελίου ay hindi tahimik na nilutas at inilakip bilang mga talababa.
