revisions:
- from: 'Ito lamang: mamuhay kayo bilang mga mamamayan[a] sa paraang karapat-dapat sa ebanghelyo ng Mesiyas. Sa gayon, pumunta man ako at makita kayo o wala man ako, mabalitaan ko tungkol sa inyo na matatag kayong nakatayo sa iisang espiritu[b], nagkakaisang kalooban[c] na sama-samang nakikipaglaban para sa pananampalataya ng ebanghelyo[d].'
  to: 'Ito lamang: mamuhay kayo bilang mga mamamayan[a] sa paraang karapat-dapat sa ebanghelyo ng Mesiyas. Sa gayon, dumating man ako at makita ko kayo o wala man ako roon, mabalitaan ko tungkol sa inyo na matatag kayong nakatayo sa iisang espiritu[b], na may iisang kalooban[c], na sama-samang nakikipagpunyagi para sa pananampalataya ng ebanghelyo[d].'
  rationale: Inayos ang daloy at sintaks ng salin, pinalitan ang “pumunta” ng mas angkop na “dumating,” at ginawang hindi mapagpasiya ang talababa tungkol sa “Espiritu.” Hindi binago ng rebisyon ang kahulugan, ang sibikong larawan, o ang sinadyang kalabuan ng mga konstruksyong Griyego.
