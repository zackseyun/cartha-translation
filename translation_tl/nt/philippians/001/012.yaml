source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: tl
  text: Nais kong malaman ninyo, mga kapatid[a], na ang mga nangyari sa akin ay lalo pang nakatulong sa pagsulong ng magandang balita[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa buong komunidad ng mga mananampalataya.
    reason: lexical_clarification
  - marker: b
    text: O ebanghelyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Nais kong malaman ninyo
  rationale: Natural na pormulang liham sa Tagalog na malinaw na nagpapahayag ng layunin ni Pablo na ipaalam ito sa mga mambabasa.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang transisyon ito rito; sapat na ang likas na daloy sa Tagalog at ang pagdaragdag ng “ngayon” o “ngunit” ay maaaring magpahiwatig ng temporalidad o pagsalungat na wala sa teksto.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural, marangal, at maaaring tumukoy sa buong komunidad ng mga mananampalataya nang hindi kinakailangang tukuyin ang kasarian.
- source_word: τὰ κατ’ ἐμὲ
  choice: ang mga nangyari sa akin
  rationale: Malinaw at natural na tumutukoy sa mga kalagayan at pangyayaring kinasangkutan ni Pablo.
- source_word: μᾶλλον
  choice: lalo pang
  rationale: Pinananatili nito ang paghahambing o di-inaasahang mas positibong kinalabasan, sa halip na gawing simpleng “talagang.”
- source_word: εἰς προκοπὴν
  choice: nakatulong sa paglaganap
  rationale: Ipinahahayag ang naging bunga o ambag ng mga pangyayari sa patuloy na pagsulong ng mensahe, sa natural na Tagalog.
- source_word: τοῦ εὐαγγελίου
  choice: ng magandang balita
  rationale: Tuwirang inilalahad ang pangunahing kahulugan ng εὐαγγέλιον sa karaniwang makabagong Tagalog; ibinibigay sa talababa ang tradisyonal na katawagan.
- source_word: ἐλήλυθεν
  choice: ay ... nakatulong
  rationale: Ang perpektong anyo ay inilalahad bilang naganap na pangyayaring may nagpapatuloy na bunga; likas itong naipahihiwatig ng buong sugnay sa Tagalog.
theological_decisions:
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” sa Tagalog ay tapat sa larawan ng pagkakamag-anak at natural na inclusive, kaya hindi kailangang ipasok sa pangunahing teksto ang paliwanag sa kasarian.
- issue: Di-inaasahang pagsulong na ipinahihiwatig ng μᾶλλον
  choice: lalo pang nakatulong
  alternative: talagang nakatulong; sa halip ay nakatulong
  rationale: 'Pinananatili ng “lalo pang” ang paghahambing at tensiyon: ang maaaring isiping hadlang ay naging daan sa higit na pagsulong, nang hindi nililinaw nang lampas sa Griyego.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magandang balita” bilang madaling maunawaang katumbas ng εὐαγγέλιον, habang pinanatili sa talababa ang tradisyonal na “ebanghelyo.”
