  source_fidelity: Ang “mga nangyari sa akin” ay tumpak para sa τὰ κατ’ ἐμέ, at ang “Nais kong malaman ninyo, mga kapatid” ay maayos na katumbas ng epistolaryong Γινώσκειν ... βούλομαι. Gayunman, ang “paglaganap” ay pangunahing tumutukoy sa pagkalat o pagdami ng saklaw, samantalang ang προκοπή ay pagsulong o pag-unlad. Mas tapat ang “pagsulong.” Ang perpektong ἐλήλυθεν ay natural na naihahayag ng “ay lalo pang nakatulong sa ...” bilang bunga ng mga nangyari.
  naturalness: Natural at marangal ang pangungusap sa makabagong Filipino. Ang “magandang balita” ay malinaw at ang “mga kapatid” ay likas na pambansang tawag sa komunidad. Mas natural at mas malapit sa Griyego ang “pagsulong ng magandang balita” kaysa “paglaganap ng magandang balita.”
