  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: tl
  text: Ngunit ipinahahayag naman ng iba ang Mesiyas dahil sa makasariling ambisyon, hindi nang may dalisay na hangarin, sa pag-aakalang madaragdagan nila ang paghihirap ng pagkabilanggo ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐριθείας
  choice: makasariling ambisyon
  rationale: Ipinahahayag nito ang pansarili at mapagpaligsahang hangarin, hindi lamang pangkalahatang pagkamakasarili.
- source_word: Χριστόν
  choice: ang Mesiyas
  rationale: Dito, si Jesus bilang ipinahahayag na Mesiyas ang diin, kaya pinanatili ang gamit nito bilang titulo.
- source_word: καταγγέλλουσιν
  choice: ipinahahayag
  rationale: Saklaw nito ang hayagang pagpapakilala o pagpapahayag at hindi ito nililimitahan sa pormal na pangangaral.
- source_word: οὐχ ἁγνῶς
  choice: hindi dahil sa dalisay na hangarin
  rationale: Sa konteksto, tumutukoy ang adverbiyo sa kawalan ng kadalisayan ng motibo; natural at malinaw ito sa modernong Tagalog.
- source_word: οἰόμενοι
  choice: Iniisip nilang
  rationale: Direkta at natural nitong ipinapahayag ang kanilang palagay o layunin.
- source_word: θλῖψιν ἐγείρειν
  choice: lalo nilang pahihirapan ako
  rationale: Ipinapahayag ng idyoma ang balak na magdulot o magpalubha ng paghihirap; ipinahihiwatig ng “lalo” ang pagdaragdag sa hirap ng pagkabilanggo nang hindi gumagamit ng di-natural na literal na “magbangon ng kapighatian.”
- source_word: τοῖς δεσμοῖς μου
  choice: habang nakabilanggo
  rationale: Ang literal na “mga tanikala” ay metonimiya para sa pagkabilanggo; malinaw ang kontekstuwal na kahulugan sa saling ito.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo o pangalang nakasanayan
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Ang Χριστός ang nilalaman ng pagpapahayag at kapansin-pansin dito ang kahulugan nitong titulo, kaya “ang Mesiyas” ang angkop habang kinikilalang posible rin ang nakasanayang “si Cristo.”
- issue: Ugnayan ng θλῖψιν sa pagkabilanggo ni Pablo
  choice: lalo nilang pahihirapan ako habang nakabilanggo
  alternative: magdulot ng kapighatian sa aking mga tanikala
  rationale: Pinananatili ang diwa na nais nilang dagdagan ang paghihirap ni Pablo sa kalagayan niyang bilanggo, nang hindi ipinapalagay ang isang mas tiyak na paraan kung paano nila ito gagawin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ipinahahayag” sa halip na mas makitid na “ipinangangaral,” at isinalin ang metonimikong “mga tanikala” ayon sa kahulugang pagkabilanggo. Walang talababa dahil walang alternatibong kailangang ilagay sa mismong publikasyong teksto.
