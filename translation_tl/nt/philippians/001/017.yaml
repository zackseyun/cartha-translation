  to: Ngunit ipinahahayag naman ng iba ang Mesiyas dahil sa makasariling ambisyon, hindi nang may dalisay na hangarin, sa pag-aakalang madaragdagan nila ang paghihirap ng pagkabilanggo ko.
  rationale: Inayos ang pagpapahayag ng ἁγνῶς upang malinaw na tumukoy ito sa kadalisayan ng motibo. Pinalitan ang huling sugnay upang mapanatili ang ideya ng θλῖψιν ἐγείρειν—pagdaragdag ng paghihirap—na nauugnay sa mga tanikala o pagkabilanggo ni Pablo, nang hindi nagdaragdag ng tiyak na paraan ng pagpapahirap.
