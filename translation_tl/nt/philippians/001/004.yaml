translation:
  language: tl
  text: Lagi, sa bawat panalangin ko para sa inyong lahat, ay nananalangin ako nang may kagalakan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: lagi
  rationale: Ipinahahayag ang palagiang disposisyon ni Pablo at natural na iniuugnay sa pandiwang “nananalangin.”
- source_word: ἐν πάσῃ δεήσει μου
  choice: sa tuwing nananalangin ako
  rationale: Natural na modernong Tagalog para sa idyomang Griyego na tumutukoy sa bawat pagkakataon ng kanyang pagsusumamo o panalangin.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: para sa inyong lahat
  rationale: 'Tuwirang pinananatili ang saklaw na walang ibinubukod: lahat ng mga kausap.'
- source_word: μετὰ χαρᾶς
  choice: nang may kagalakan
  rationale: Dignified at malinaw na katumbas ng paraan o saloobing kasama ng pananalangin.
- source_word: τὴν δέησιν ποιούμενος
  choice: nananalangin
  rationale: Ang literal na “ginagawa ang pagsusumamo” ay idiomatikong nangangahulugang nananalangin; iniiwasan ang matigas at di-natural na salin.
theological_decisions:
- issue: Pagkakaugnay ng πάντοτε at μετὰ χαρᾶς sa pangungusap
  choice: Iugnay ang “lagi” at “nang may kagalakan” sa kilos ng pananalangin nang hindi nagdaragdag ng paliwanag.
  alternative: “sa bawat panalangin ko ... ginagawa ko ang panalangin nang may kagalakan”
  rationale: Pinananatili ang diwa at daloy ng participial clause habang hindi pinipilit ang isang teolohikal na interpretasyon na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Bilang bahagi ng mahabang pangungusap mula talata 3–6, pinanatili ang pangwakas na kuwit.
