  source_fidelity: 'Kailangang baguhin ang aspekto ng pandiwang balintiyak: ang "ipinahahayag" ay karaniwang nagmumungkahi ng naganap na/perpektibong kilos, samantalang ang καταγγέλλεται ay pangkasalukuyang balintiyak. Ang "ipinapahayag" ay mas malinaw na tumutugon sa Griyego. Ang pagdagdag ng "patuloy" sa huling sugnay ay hindi tuwirang nasa χαρήσομαι; sapat ang hinaharap na "magagalak din ako."'
  naturalness: Medyo hindi natural at hindi magkatimbang ang "pakitang-tao man o tapat," dahil pangngalan ang una samantalang pang-uri ang "tapat." Mas natural at malinaw ang magkaparis na "sa pagkukunwari man o sa katapatan." Ang natitirang daloy ay angkop sa modernong Filipino Tagalog at sa marangal na rehistro ng liham.
  terminology: Ang "Mesiyas" ay wastong pagpapanatili sa titular na Χριστός. Ang "ipinapahayag" ay angkop para sa καταγγέλλεται at hindi nililimitahan ang kahulugan sa pangangaral lamang.
