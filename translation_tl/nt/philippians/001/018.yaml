base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: tl
  text: Ano ngayon? Ang mahalaga, sa lahat ng paraan, sa pagkukunwari man o sa katapatan, ipinapahayag ang Mesiyas, at ikinagagalak ko ito. Oo, at magagalak din ako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γάρ
  choice: Ano ngayon?
  rationale: Pinananatili ang maikli at retorikal na paglipat ni Pablo nang hindi dinaragdagan ng paliwanag na wala sa Griyego.
- source_word: πλὴν ὅτι
  choice: Ang mahalaga,
  rationale: Likas na Filipino para sa puwersang naglilimita at tumutuon sa pangunahing punto; hindi kailangang isalin nang hiwalay ang ὅτι sa kasunod na sugnay.
- source_word: παντὶ τρόπῳ
  choice: sa lahat ng paraan
  rationale: Pinananatili ang malawak at distributibong diwa ng parirala.
- source_word: προφάσει
  choice: pakitang-tao
  rationale: Ipinahihiwatig ang hindi tapat na pagpapanggap o panlabas na dahilan, nang hindi tahasang nilulutas kung motibo o paraan ang tinutukoy.
- source_word: ἀληθείᾳ
  choice: tapat
  rationale: Natural na kasalungat ng pakitang-tao sa Filipino at pinananatili ang diwa ng katapatan o pagiging tunay.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginagamit dito bilang titulo at siyang nilalaman ng pagpapahayag; ang Mesiyas ang malinaw na katumbas ng titulong Griyego.
- source_word: καταγγέλλεται
  choice: ipinahahayag
  rationale: Pinananatili ang balintiyak na anyo at ang diwa ng hayagang pagpapahayag; sapat ang aspektong Filipino upang ilarawan ang nagaganap na gawain.
- source_word: ἐν τούτῳ χαίρω
  choice: ikinagagalak ko ito
  rationale: Natural at tuwirang inuugnay ang kagalakan ni Pablo sa katotohanang ipinahahayag ang Mesiyas.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Oo, at patuloy akong magagalak
  rationale: Ipinapahayag nang natural ang mariing pagpapatuloy mula sa kasalukuyang χαίρω tungo sa hinaharap na χαρήσομαι; ang 'patuloy' ay kontekstuwal na bunga ng magkatabing kasalukuyan at hinaharap.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Sa kontekstong ito, ang Χριστός ang titulong ipinahahayag, kaya pinananatili ang kahulugan ng titulo sa halip na gawing tila pangalang pantangi.
- issue: Paghatol sa mga motibo ng mga tagapangaral
  choice: pakitang-tao man o tapat
  alternative: dahil man sa maling motibo o sa tapat na motibo
  rationale: Pinananatili ang maigsi at bahagyang bukas na contrast ng προφάσει at ἀληθείᾳ, sa halip na tahasang tukuying motibo lamang ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'ipinahahayag' sa halip na mas makitid na 'ipinangangaral,' at 'ang Mesiyas' upang panatilihin ang titular na gamit ng Χριστός. Walang footnote dahil walang mahalagang tekstuwal o leksikal na alternatibong kailangang ilahad para maunawaan ang talata.
