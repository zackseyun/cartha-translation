    rationale: Ang Griyego ay magkatambal na mga pangngalan sa pariralang pandiwang pangyayari. Ang "pagkukunwari" at "katapatan" ay likas na magkatimbang na Filipino at pinananatili ang hindi labis na pagpapakahulugan sa contrast.
