    issue: Aspekto ng "ipinahahayag"
    rationale: Ang anyong ito ay madaling basahing perpektibo/naganap sa Filipino. Ang kasalukuyang passive na καταγγέλλεται ay mas tapat na maisasalin bilang "ipinapahayag."
  - severity: medium
