  source_fidelity: 'Ang “kaya” ay wastong nagpapahayag ng resultang puwersa ng ὥστε, at ang “dahil sa Mesiyas” ay isang posibleng pagbasa ng ἐν Χριστῷ na maayos na tinatapatan ng talababa. Gayunman, ang “nalaman ... na” ay bahagyang inililihis ang pagkakabuo ng Griyego: ang naging hayag ay ang mga gapos mismo, hindi lamang isang impormasyong nalaman ng mga tao. Ang “pagkakagapos” ay maaari rin ngunit mas abstrakto kaysa sa τοὺς δεσμούς μου (“mga gapos/tanikala ko”).'
  naturalness: Mas natural at tuwiran sa modernong Filipino ang “naging hayag ... ang mga gapos ko” kaysa sa “nalaman ... na ang pagkakagapos ko.” Ang “hukbong tagapagbantay ng emperador” ay mas malinaw na katawagan para sa isang bantay na pangmilitar kaysa “hukbong bantay.”
  terminology: Pinanatili ang “Mesiyas” para sa Χριστός bilang titulo. Pinanatili ang pangunahing pagbasa na tumutukoy sa bantay ng emperador, habang ang “pretorio” at ang posibleng pagtukoy nito sa himpilan o tirahan ng pinuno ay nasa talababa. Ang alternatibong “sa Mesiyas” ay kinakailangan upang huwag burahin ang tunay na kalabuan ng ἐν Χριστῷ.
  issues:
