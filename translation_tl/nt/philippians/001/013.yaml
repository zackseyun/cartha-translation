    issue: Ang “nalaman ... na” ay nagiging proposisyong nalaman sa halip na ang mga gapos ang maging hayag.
    rationale: Ang φανεροὺς ... γενέσθαι ay tuwirang nagsasaad na ang “mga gapos ko” ay naging hayag/kilala. Mas malapit at malinaw ang konstruksiyong pinananatili ang mga gapos bilang paksa.
  - severity: low
    issue: Ang “pagkakagapos” ay mas abstrakto kaysa sa “mga gapos.”
    rationale: Ang δεσμούς ay pangmaramihang kongkretong “mga gapos/tanikala,” bagaman maaari itong metonimikong tumukoy sa pagkabilanggo. Ang “mga gapos ko” ay pinananatili ang larawan at ang bilang ng pinagmulan.
  - severity: low
