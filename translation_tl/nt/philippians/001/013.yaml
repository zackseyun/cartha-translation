  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: tl
  text: kaya naging hayag sa buong hukbong tagapagbantay ng emperador[b] at sa lahat ng iba pa ang mga gapos ko dahil sa Mesiyas[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga gapos ko sa Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: O, “sa buong pretorio.” Maaaring tumukoy ang salitang ito sa hukbong tagapagbantay ng emperador o sa himpilan o tirahang imperyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahahayag ang bunga ng naunang sinabi at natural na nag-uugnay sa pangungusap sa modernong Tagalog.
- source_word: τοὺς δεσμούς μου
  choice: ang pagkakagapos ko
  rationale: Ang δεσμοί ay literal na mga gapos o tanikala, ngunit tumutukoy dito sa kalagayan ni Pablo bilang isang bilanggo. Pinananatili ng “pagkakagapos” ang kongkretong larawan nang hindi nagiging di-natural.
- source_word: φανεροὺς ... γενέσθαι
  choice: nalaman
  rationale: Ipinahahayag ng konstruksiyon na naging hayag at kinilala ng iba ang dahilan o katangian ng pagkakagapos ni Pablo.
- source_word: ἐν Χριστῷ
  choice: ay dahil sa Mesiyas
  rationale: Sa konteksto, malamang na kinikilala ng mga tao na ang pagkakabilanggo ni Pablo ay dahil sa kaniyang kaugnayan at katapatan sa Mesiyas. Inilalagay sa talababa ang mas pormal at sadyang malabong pagbasa.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Isinasalin bilang titulo ang Χριστός upang maipakita ang kahulugan nitong “Pinahiran,” sa halip na ituring lamang itong personal na pangalan.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: ng buong hukbong bantay ng emperador
  rationale: Malamang na tumutukoy ang πραιτώριον sa bantay o institusyong imperyal; malinaw ito sa karaniwang mambabasa, habang itinatala sa talababa ang posibleng pagtukoy sa lugar o himpilan.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: at ng lahat ng iba pa
  rationale: Malapit na tinutumbasan ang malawak at inklusibong saklaw ng parirala nang natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ kaugnay ng pagkakagapos ni Pablo
  choice: Ang pagkakagapos niya ay “dahil sa Mesiyas,” na nagpapahiwatig na nakilala ang kaugnayan ng kaniyang pagkabilanggo sa katapatan niya sa Mesiyas.
  alternative: “Ang pagkakagapos ko sa Mesiyas,” na maaaring magdiin sa pakikipag-isa kay Mesiyas bilang kalagayan o saklaw ng kaniyang mga gapos.
  rationale: Pinakamalinaw sa agarang konteksto ang pagkilala ng iba sa dahilan ng pagkakabilanggo ni Pablo, ngunit tunay na mas malawak at malabo ang pariralang Griyego kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hukbong bantay ng emperador” sa halip na hindi pamilyar na teknikal na katawagan sa pangunahing teksto; pinanatili sa talababa ang “pretorio.”
