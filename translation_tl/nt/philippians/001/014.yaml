id: PHP.1.14
reference: Philippians 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: tl
  text: At ang karamihan sa mga kapatid[a], dahil sa aking pagkakagapos, ay naging panatag sa Panginoon at lalo pang nangangahas na ipahayag ang salita nang walang takot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay malamang na tumutukoy rito sa mga kapwa mananampalataya sa pangkalahatan, lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: karamihan
  rationale: Kasama ng artikulo at partitive genitive, tumutukoy ito sa nakararami, hindi lamang sa mas marami kaysa dati.
- source_word: ἀδελφῶν
  choice: mga kapatid
  rationale: Ang natural na katawagang Tagalog na “mga kapatid” ay hindi nagpapahiwatig ng kasarian bagaman masculine plural ang anyong Griyego; nililinaw sa talababa na malamang na tumutukoy ito sa mga kapwa mananampalataya, lalaki at babae.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang pariralang Paulino at iniuugnay ito sa kalagayan ng pagtitiwala o kapanatagan.
- source_word: πεποιθότας
  choice: naging panatag
  rationale: Ipinahihiwatig ng perfect participle ang pagkakaroon ng isang matatag at nagpapatuloy na kalagayan ng pagtitiwala; natural itong naipahahayag sa Tagalog bilang “naging panatag.”
- source_word: τοῖς δεσμοῖς μου
  choice: dahil sa aking pagkakagapos
  rationale: Ipinahahayag ng “dahil sa” ang malamang na sanhi. Ang “pagkakagapos” ay nagpapanatili sa konkretong larawan ng δεσμοί nang mas natural kaysa literal na “mga tanikala ko.”
- source_word: περισσοτέρως
  choice: lalo pang
  rationale: Natural na Tagalog para sa paghahambing na “higit pa” o “all the more.”
- source_word: τολμᾶν
  choice: nangangahas
  rationale: Pinananatili nito ang diwa ng matapang na pagpapasyang gawin ang isang bagay sa kabila ng panganib.
- source_word: ἀφόβως
  choice: nang walang takot
  rationale: Tuwirang ipinahahayag ang kawalan ng takot, sa halip na ang mas malawak na ideya lamang ng katapangan.
- source_word: τὸν λόγον
  choice: ang salita
  rationale: Malapit ito sa tekstong Griyego at hindi idinaragdag ang “ng Diyos,” na wala sa pangunahing tekstong SBLGNT, kahit malamang na ang mensahe ng ebanghelyo ang tinutukoy.
- source_word: λαλεῖν
  choice: magsalita
  rationale: Ito ang tuwirang katumbas ng pangkalahatang pandiwa para sa pagsasalita; ang “ipahayag” ay maaaring magdagdag ng mas tiyak na diwa ng pangangaral.
theological_decisions:
- issue: Saklaw ng ἀδελφῶν
  choice: “mga kapatid” sa pangunahing teksto, na may talababa tungkol sa malamang na malawak na saklaw nito
  alternative: “mga kapatid na lalaki at babae” o “mga kapwa mananampalataya”
  rationale: Masculine plural ang anyong Griyego, ngunit karaniwang hindi tiyak sa kasarian ang “mga kapatid” sa Tagalog. Pinananatili ng talababa ang posibilidad na kasama rito ang mga mananampalatayang lalaki at babae nang hindi labis na nilulutas ang saklaw.
- issue: Ugnayan ng ἐν κυρίῳ at τοῖς δεσμοῖς μου
  choice: Ang kapanatagan ay “sa Panginoon,” at ang pagkakagapos ni Pablo ang sanhi o pagkakataon nito
  alternative: “Dahil sa Panginoon ay pinatapang ng aking pagkakagapos” o pagbasa sa “sa Panginoon” bilang tuwirang panuring sa “mga kapatid”
  rationale: Pinakamalamang na kaugnay ang ἐν κυρίῳ sa πεποιθότας, ngunit pinananatili ng ayos ng salin ang dalawang sangkap nang hindi nagbibigay ng labis na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkakagapos” upang mapanatili ang larawan ng pagkabilanggo nang natural, at “nang walang takot” upang tumpak na maipahayag ang ἀφόβως. Ang ayos ng pangungusap ay bahagyang inayos para sa likas na daloy ng Tagalog habang pinananatili ang mga ugnayang semantiko ng Griyego.
