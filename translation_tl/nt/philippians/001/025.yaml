id: PHP.1.25
reference: Philippians 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: tl
  text: At dahil kumbinsido ako rito, alam kong mananatili ako at patuloy na makakasama ko kayong lahat para sa inyong pagsulong at kagalakan sa pananampalataya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kagalakan ng pananampalataya” o “kagalakang nagmumula sa pananampalataya.”
    reason: Pinahihintulutan ng genitibong τῆς πίστεως ang higit sa isang ugnayan sa “kagalakan.”
lexical_decisions:
- source_word: πεποιθὼς
  choice: kumbinsido
  rationale: Ang perpektong participle ay nagpapahayag ng matatag at nagpapatuloy na katiyakan; natural at malinaw sa modernong Filipino ang “kumbinsido.”
- source_word: μενῶ
  choice: mananatili
  rationale: Pinananatili nito ang payak na diwa ng μένω at ang anyong panghinaharap nang hindi tahasang nililimitahan ang kahulugan sa pananatiling buhay.
- source_word: παραμενῶ
  choice: patuloy na makakasama
  rationale: Ipinahihiwatig ng tambalang pandiwa ang patuloy na pananatiling kapiling nila at naihihiwalay ito sa naunang μενῶ.
- source_word: πᾶσιν ὑμῖν
  choice: ninyong lahat
  rationale: Malinaw na pinananatili ang πᾶσιν at, kasama ng “makakasama,” likas na ipinapahayag ang ugnayang diwa ng datibo.
- source_word: προκοπὴν
  choice: pagsulong
  rationale: Ipinahahayag nito ang pasulong na pag-unlad na tinutukoy ng προκοπή at angkop sa marangal ngunit karaniwang Filipino.
- source_word: χαρὰν τῆς πίστεως
  choice: kagalakan sa pananampalataya
  rationale: Likas itong basahin sa Filipino at hindi nito lubusang nilulutas ang maaaring ugnayan ng genitibo sa pagitan ng kagalakan at pananampalataya.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa kontekstong ito, ang karaniwang diwa ng πίστις bilang pananampalataya ang pinakaangkop kaysa “pagtitiwala” o “katapatan.”
theological_decisions:
- issue: Kahulugan ng genitibo sa χαρὰν τῆς πίστεως
  choice: kagalakan sa pananampalataya
  alternative: kagalakan ng pananampalataya; kagalakang nagmumula sa pananampalataya
  rationale: 'Nananatiling bukás ang ugnayang gramatikal: maaaring ito ay kagalakang kaugnay ng pananampalataya, pag-aari o katangian nito, o bunga nito. Gumagamit ang pangunahing teksto ng natural na anyo at inilalagay sa talababa ang ibang posibleng pagbasa.'
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kumbinsido” bilang pangkaraniwan at tiyak na salita; ang “patuloy na makakasama” ay natural na nagpapakita ng dagdag na diwa ng παραμενῶ. Inilagay ang talababa sa pariralang talagang tinutukoy nito.
