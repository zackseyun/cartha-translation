  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: tl
  text: Sapagkat saksi ko ang Diyos kung gaano ko kayong lahat pinananabikan, taglay ang taos-pusong pagmamahal ng Mesiyas na si Jesus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Cristo Jesus.”'
    reason: alternative_reading
  - marker: b
    text: 'O: “taglay ang habag ng Mesiyas na si Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: saksi
  rationale: Likas at malinaw sa Filipino ang idyomang “saksi ko ang Diyos,” at pinananatili nito ang taimtim na pagtawag sa Diyos bilang nagpapatunay sa katapatan ni Pablo.
- source_word: γάρ
  choice: sapagkat
  rationale: Ipinakikita nito ang ugnayang nagpapaliwanag sa naunang pahayag, gaya ng gamit ng γάρ sa konteksto.
- source_word: ὡς
  choice: kung gaano
  rationale: Ipinahahayag nito hindi lamang ang katotohanan kundi ang tindi ng pananabik ni Pablo.
- source_word: ἐπιποθῶ
  choice: kinasasasabikan
  rationale: Ang “kinasasasabikan” ay natural na makabagong Filipino para sa matinding pananabik sa mga taong mahalaga sa nagsasalita.
- source_word: πάντας ὑμᾶς
  choice: kayong lahat
  rationale: Pinananatili nito ang diin na walang sinuman sa mga kausap ang hindi kabilang.
- source_word: ἐν σπλάγχνοις
  choice: taglay ang taos-pusong pagmamahal
  rationale: Ang σπλάγχνα ay literal na mga laman-loob na itinuturing na luklukan ng malalim na damdamin. Ang pariralang ito ay natural sa Filipino at naghahatid ng masidhing pagmamahal nang hindi kahoy na literal.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at natural na inuugnay ito sa pangalang Jesus sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pariralang Χριστοῦ Ἰησοῦ
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulong Χριστός, samantalang inilalagay sa talababa ang tradisyonal at mas mala-pangalang anyong “Cristo Jesus.”
- issue: Ugnayan ng pagmamahal kay Cristo sa ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ
  choice: taglay ang taos-pusong pagmamahal ng Mesiyas na si Jesus
  alternative: taglay ang habag ng Mesiyas na si Jesus
  rationale: Hindi nilulutas nang lampas sa Griyego kung ang damdamin ay nagmumula kay Cristo, nahuhubog niya, o maituturing na kaniyang sariling pagmamahal; pinananatili ng pariralang may “ng” ang ugnayang ito at inilalahad sa talababa ang leksikal na alternatibong “habag.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “taos-pusong” bilang idyomatikong katumbas ng sinaunang larawan ng mga laman-loob bilang luklukan ng malalim na damdamin; iniwasan ang sobrang literal na “mga laman-loob.”
