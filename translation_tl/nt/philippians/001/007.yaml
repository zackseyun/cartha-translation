  to: Nararapat lamang na ganito ang maging saloobin ko tungkol sa inyong lahat, sapagkat nasa puso ko kayo[a], yamang kayong lahat ay mga kabahagi ko sa biyaya, kapuwa sa aking pagkakagapos at sa pagtatanggol at pagpapatibay ng magandang balita.
  rationale: Inayos ang “man o” tungo sa “kapuwa ... at” upang tumpak na maipakita ang ἔν τε ... καὶ. Inihanay din ang sugnay tungkol sa pakikibahagi sa biyaya upang malinaw na saklaw nito ang parehong pagkakagapos ni Pablo at ang pagtatanggol at pagpapatibay ng magandang balita. Pinanatili ang tunay na sintaktikong kalabuan ng sugnay tungkol sa puso sa talababa.
