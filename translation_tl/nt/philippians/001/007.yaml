id: PHP.1.7
reference: Philippians 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: tl
  text: Nararapat lamang na ganito ang maging saloobin ko tungkol sa inyong lahat, sapagkat nasa puso ko kayo[a], yamang kayong lahat ay mga kabahagi ko sa biyaya, kapuwa sa aking pagkakagapos at sa pagtatanggol at pagpapatibay ng magandang balita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat nasa puso ninyo ako.” Maaaring unawain sa alinman sa dalawang paraan ang sugnay sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: Matuwid lamang
  rationale: Ipinapahayag nito na ang saloobin ni Pablo ay wasto at nararapat, sa natural ngunit marangal na Tagalog.
- source_word: φρονεῖν
  choice: ang isipin
  rationale: Pinananatili ang diwa ng pag-iisip o matatag na saloobin nang hindi nililimitahan ito sa damdamin lamang.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: tungkol sa inyong lahat
  rationale: Sa kaugnayan nito sa φρονεῖν, tumutukoy ito sa iniisip o saloobin ni Pablo hinggil sa lahat ng mga taga-Filipos.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: sapagkat nasa puso ko kayo
  rationale: Natural na Tagalog ito para sa pangunahing pagbasa na iniingatan ni Pablo ang mga taga-Filipos sa kanyang puso; inilalahad sa talababa ang tunay na sintaktikong alternatibo.
- source_word: δεσμοῖς
  choice: pagkakagapos
  rationale: Pinananatili ang konkretong larawan ng mga gapos habang malinaw na tumutukoy sa kalagayan ni Pablo bilang bilanggo.
- source_word: ἀπολογίᾳ
  choice: pagtatanggol
  rationale: Tumpak na naghahayag ng pampubliko o posibleng legal na pagtatanggol sa magandang balita.
- source_word: βεβαιώσει
  choice: pagpapatibay
  rationale: Ipinahihiwatig ang pagtatatag at pagpapatunay sa katotohanan ng magandang balita.
- source_word: εὐαγγελίου
  choice: magandang balita
  rationale: Karaniwan, malinaw, at likas na salin sa modernong Filipino ng εὐαγγέλιον.
- source_word: συγκοινωνούς μου
  choice: mga kabahagi ko
  rationale: Natural na ipinahahayag ang magkasamang pakikibahagi nang walang paulit-ulit na diwa ng 'kasama ko' at 'kapwa kabahagi.'
- source_word: χάριτος
  choice: biyaya
  rationale: Pinananatili ang mahalagang teolohikal na termino at ang diwa ng mapagbiyayang kaloob ng Diyos.
theological_decisions:
- issue: Sintaktikong kalabuan sa sugnay tungkol sa puso
  choice: sapagkat nasa puso ko kayo
  alternative: sapagkat nasa puso ninyo ako
  rationale: Parehong accusative ang με at ὑμᾶς sa infinitive construction, kaya maaaring maging simuno ang alinman. Mas akma sa agarang daloy ng pagmamahal ni Pablo ang pangunahing salin, ngunit tunay na posible ang alternatibo at kaya inilagay sa talababa.
- issue: Saklaw ng pakikibahagi sa biyaya
  choice: Sa pagkakagapos ko man o sa pagtatanggol at pagpapatibay sa magandang balita, kayong lahat ay mga kabahagi ko sa biyaya
  alternative: kayong lahat ay nakibahagi sa akin sa biyaya sa panahon ng aking pagkakagapos at sa pagtatanggol at pagpapatibay sa magandang balita
  rationale: Pinananatili ng pangunahing salin na ang lahat ay kabahagi ni Pablo sa biyaya sa kapuwa kalagayan, nang hindi pinipili kung ang biyaya ay partikular na tumutukoy sa ministeryo, pagdurusa, o kabuuang kaloob at pagtawag ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “magandang balita,” “pagkakagapos,” at “mga kabahagi ko” upang mapanatili ang konkretong larawan at teolohikal na diwa nang hindi nagiging lipas o labis na teknikal.
