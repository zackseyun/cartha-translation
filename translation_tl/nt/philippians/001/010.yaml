base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: tl
  text: upang masuri ninyo kung ano ang pinakamabuti[a], nang sa gayon ay maging dalisay kayo at walang kapintasan[b] para sa araw ng Mesiyas[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sang-ayunan ninyo ang mga bagay na nakahihigit,” “matukoy ninyo kung ano ang higit na mahalaga,” o, mas literal, “masuri ninyo ang mga bagay na naiiba.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “hindi natitisod” o “hindi nagiging sanhi ng pagkatisod.”'
    reason: lexical_ambiguity
  - marker: c
    text: 'Tradisyonal na salin: “para sa araw ni Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: masuri
  rationale: Saklaw ng pandiwa ang pagsubok o masusing pagsusuri na humahantong sa pagkilala o pagsang-ayon. Ang “masuri” ay likas sa modernong Tagalog at pinananatili ang proseso ng mapanuring paghatol.
- source_word: τὰ διαφέροντα
  choice: kung ano ang pinakamabuti
  rationale: Bagaman literal na tumutukoy sa “mga bagay na naiiba,” malamang na idyomatiko itong tumutukoy sa mga bagay na nakahihigit o higit na mahalaga. Pinananatili ng “pinakamabuti” ang paghahambing na diwa.
- source_word: εἰλικρινεῖς
  choice: dalisay
  rationale: Maaaring mangahulugan ang salita ng dalisay, tapat, o tunay. Ang “dalisay” ay angkop sa etikal na konteksto at likas na katambal ng “walang kapintasan.”
- source_word: ἀπρόσκοποι
  choice: walang kapintasan
  rationale: Maaaring ilarawan ng salita ang hindi natitisod o ang hindi nagiging sanhi ng pagkatisod. Sa pagkakatambal nito sa εἰλικρινεῖς, malinaw at marangal na ipinahahayag ng “walang kapintasan” ang buhay na hindi mapupulaan.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: para sa araw ng Mesiyas
  rationale: Ang εἰς ay nakatuon sa layunin o hantungan, kaya ang “para sa” ay angkop. Isinalin ang Χριστός bilang “Mesiyas” sapagkat gumaganap ito rito bilang titulo sa pariralang eskatolohikal.
theological_decisions:
- issue: Pagpapakahulugan sa evaluative phrase na δοκιμάζειν ... τὰ διαφέροντα
  choice: masuri ninyo kung ano ang pinakamabuti
  alternative: sang-ayunan ninyo ang mga bagay na nakahihigit; masuri ninyo ang mga bagay na naiiba; matukoy ninyo kung ano ang higit na mahalaga
  rationale: Hindi tahasang nilulutas ng salin ang lahat ng saklaw ng parirala; inilalagay sa talababa ang leksikal na mga posibilidad habang ginagamit sa teksto ang pinakanatural na pagbasa sa konteksto.
- issue: Diwa ng ἀπρόσκοποι
  choice: walang kapintasan
  alternative: hindi natitisod; hindi nagiging sanhi ng pagkatisod
  rationale: Ang pangunahing teksto ay gumagamit ng malawak na etikal na katumbas, habang ipinakikita sa talababa ang dalawang posibleng direksiyon ng salitang Griyego.
- issue: Paglilipat ng Χριστοῦ sa εἰς ἡμέραν Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Titular ang gamit sa pariralang “araw ng Mesiyas,” kaya pinananatili ang kahulugan ng titulong Χριστός. Inilalagay sa talababa ang tradisyonal at pamilyar na “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong sugnay at pangwakas na kuwit dahil bahagi ito ng mas mahabang pangungusap. Ginamit ang “Mesiyas” bilang malinaw na titulo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
