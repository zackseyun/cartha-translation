id: PHP.1.6
reference: Philippians 1:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: tl
  text: 'Nakatitiyak ako sa mismong bagay na ito: ang nagsimula ng mabuting gawa sa gitna ninyo[a] ay tatapusin iyon hanggang sa araw[b] ng Mesiyas na si Jesus[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: O, “pagsapit ng araw.”
    reason: lexical_alternative
  - marker: c
    text: 'Tradisyonal: “Cristo Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Nakatitiyak ako
  rationale: Ginawang tahasang pahayag sa unang panauhan ang pang-abay na participle ayon sa pananaw ni Pablo sa konteksto; natural at malinaw ito sa makabagong Tagalog.
- source_word: αὐτὸ τοῦτο
  choice: sa mismong bagay na ito
  rationale: Pinananatili ng “mismong” ang diin ng dobleng demonstratibo nang hindi nagiging labis na literal.
- source_word: ὁ ἐναρξάμενος
  choice: ang nagsimula
  rationale: Pinananatili nitong personal ngunit hindi tahasang pinapangalanan ang simuno, gaya ng Griyego; sa konteksto, ipinahihiwatig na ang Diyos ang tinutukoy.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Maramihan ang ὑμῖν at ang kausap ay ang kapulungan sa Filipos, kaya malinaw na naipapakita ang posibleng kolektibong diwa nang hindi itinatanggi ang pagbasa na “sa inyo.”
- source_word: ἔργον ἀγαθὸν
  choice: mabuting gawa
  rationale: Tuwiran at natural na salin na hindi nagdaragdag ng hindi sinasabi ng teksto.
- source_word: ἐπιτελέσει
  choice: tatapusin iyon
  rationale: Ipinahahayag ang pagdadala sa matagumpay na kaganapan ng nasimulang gawain; ang “iyon” ay tumutukoy sa mabuting gawa.
- source_word: ἄχρι ἡμέρας
  choice: hanggang sa araw
  rationale: Pinananatili ang karaniwang temporal na hangganang ipinahahayag ng ἄχρι, sa halip na tahimik na gawing tiyak na “sa araw.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at inaayos ang parirala sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Kung indibidwal o kolektibo ang saklaw ng gawain ng Diyos
  choice: “sa gitna ninyo” sa pangunahing teksto
  alternative: “sa inyo”
  rationale: Ang maramihang panghalip at ang pakikipag-usap ni Pablo sa buong kapulungan ay nagpapahintulot sa kolektibong pagbasa. Inilalagay sa talababa ang mas literal at maaaring indibidwal na pagbasa upang hindi lutasin nang sapilitan ang saklaw.
- issue: Kung ang araw ni Jesus ang hantungan o mismong sandali ng pagkumpleto
  choice: “hanggang sa araw”
  alternative: “pagsapit ng araw”
  rationale: Mas tuwirang sinasalamin ng “hanggang” ang ἄχρι bilang temporal na hangganan. Ang alternatibo ay nagpapakita ng posibleng diin sa araw bilang sandali ng kaganapan nang hindi ipinapalit iyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakatitiyak” sa halip na mas kolokyal na “sigurado,” at pinanatiling payak ang pangungusap. Ang “Mesiyas na si Jesus” ay natural na Tagalog para sa pamagat na Χριστός na sinusundan ng pangalang Jesus.
