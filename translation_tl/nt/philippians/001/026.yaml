  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: tl
  text: upang, sa pamamagitan ng muli kong pagdating sa inyo, lalo pang madagdagan ang maipagmamalaki ninyo sa Mesiyas na si Jesus dahil sa akin.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalo pang sumagana ang inyong pagmamalaki sa Mesiyas na si Jesus.” Ang salitang Griyego ay maaaring tumukoy sa pagmamalaki o sa dahilan/batayan ng pagmamalaki.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa akin”; maaari ring unawain na “tungkol sa akin” o “dahil sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Mesiyas na si Jesus” ay maaari ring isaling “Cristo Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na nagpapahayag sa Filipino ng layunin o inaasahang resulta mula sa naunang pahayag.
- source_word: τὸ καύχημα ὑμῶν
  choice: ang maipagmamalaki ninyo
  rationale: Maaaring tumukoy ang καύχημα sa mismong pagmamalaki o sa dahilan/batayan nito. Ang “maipagmamalaki ninyo” ay natural sa Filipino at hindi labis na nagpapasiya sa dalawang magkaugnay na diwa.
- source_word: περισσεύῃ
  choice: lalo pang madagdagan
  rationale: Ipinahihiwatig ang pagdami o pag-uumapaw na nasa περισσεύῃ, habang nananatiling malinaw at natural ang pangungusap sa Filipino.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang kahulugan ng titulong Χριστός at pinananatili ang kaugnayan ng ipinagmamalaki sa Mesiyas na si Jesus.
- source_word: ἐν ἐμοὶ
  choice: dahil sa akin
  rationale: Bagaman literal na “sa akin,” malamang na ipinakikita rito ang dahilan o batayang may kaugnayan kay Pablo; malinaw itong naipahahayag ng “dahil sa akin.”
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: sa muli kong pagdating sa inyo
  rationale: Sa konteksto, ang παρουσία ay ang personal na pagdating o muling pagharap ni Pablo sa kanila. Ang pagkakalagay nito sa unahan ay umiiwas sa sunod-sunod na pariralang “dahil sa” at malinaw na inilalahad ang pagkakataon o paraang tinutukoy.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Dito ay nananatiling buhay ang kahulugan ng Χριστός bilang titulo. Ang “Mesiyas” ay tuwirang naghahatid ng kahulugan nito, samantalang ang “Cristo” ay nakaugaliang anyong hiram.
- issue: Ugnayan ng ἐν Χριστῷ Ἰησοῦ sa καύχημα at περισσεύῃ
  choice: Iniugnay ang “sa Mesiyas na si Jesus” sa “maipagmamalaki ninyo.”
  alternative: Maaaring iugnay ang parirala sa “lalo pang madagdagan,” gaya ng “lalo pang madagdagan sa Mesiyas na si Jesus ang inyong pagmamalaki.”
  rationale: Likas sa gamit ni Pablo ang pagmamalaki “sa” Mesiyas, ngunit hindi lubos na inaalis ng ayos ng Griyego ang ibang pag-uugnay; kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maipagmamalaki” upang maiwasan ang di-kinakailangang negatibong dating ng “pagmamayabang,” at inayos sa unahan ang parirala tungkol sa muling pagdating para sa likas na daloy nang hindi binabago ang lohikal na ugnayan ng talata.
