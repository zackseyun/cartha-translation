  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: tl
  text: Sapagkat para sa akin, ang mabuhay ay si Cristo[a], at ang mamatay ay pakinabang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: para sa akin
  rationale: Likas na ipinapahayag sa modernong Tagalog ang personal na pananaw ni Pablo at malinaw na inuugnay sa parehong sugnay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita na ang pahayag ay paliwanag o batayan ng naunang diwa, habang pinananatili ang maikli at marangal na daloy.
- source_word: τὸ ζῆν
  choice: ang mabuhay
  rationale: Ang infinitibong may artikulo ay ginagamit bilang pangngalan; ang anyong ito ay natural sa Tagalog at pinananatili ang pagtutumbas sa “ang mamatay.”
- source_word: Χριστὸς
  choice: si Cristo
  rationale: Sa pangungusap na ito, ang Χριστός ay pinakanatural na tumutukoy sa persona ni Cristo; ang pantukoy na “si” ay kailangan sa karaniwang balarilang Tagalog.
- source_word: τὸ ἀποθανεῖν
  choice: ang mamatay
  rationale: Pinananatili nito ang substantibong gamit ng infinitibo at ang balanseng kaayusan na katapat ng “ang mabuhay.”
- source_word: κέρδος
  choice: pakinabang
  rationale: Malinaw nitong ipinahahayag ang mabuting natatamo o bentahe nang hindi gaanong komersiyal ang dating kumpara sa “tubo.”
theological_decisions:
- issue: Ang siksik na diwa ng pariralang τὸ ζῆν Χριστός
  choice: ang mabuhay ay si Cristo
  alternative: si Cristo ang dahilan at layunin ng aking buhay
  rationale: Pinananatili ng literal ngunit natural na pahayag ang malawak at sadyang siksik na ugnayan ng buhay ni Pablo kay Cristo, sa halip na limitahan ito sa isang paliwanag lamang.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “Cristo,” ang nakagawiang anyo sa Tagalog para sa Χριστός. Walang talababa sapagkat ang alternatibong “Mesiyas” ay hindi kailangang idagdag sa talatang ito at walang marker na dapat ilagay sa pangunahing teksto.
