id: PHP.1.2
reference: Philippians 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: tl
  text: Sumainyo ang biyaya at kapayapaang mula sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Cristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin ito ng χάρις at pinananatili ang bigat nito bilang kagandahang-loob at pagpapalang nagmumula sa Diyos.
- source_word: ὑμῖν
  choice: sumainyo
  rationale: Likas na pormula ito sa Filipino para sa isang pagbati o pagpapalang ipinagkakaloob sa mga kausap.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwirang ipinahahayag nito ang εἰρήνη at pinananatili ang malawak na diwa ng pagkakasundo at kabutihang kalagayan.
- source_word: ἀπό
  choice: mula sa
  rationale: Malinaw nitong tinutukoy ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: 'Likas at malinaw sa Filipino ang appositional na diwa: ang Diyos, na siyang ating Ama.'
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili nito ang kinikilalang titulo at kristolohikal na bigat ng κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ginagawang malinaw ang titulong Χριστός sa halip na iwan lamang bilang nakasanayang transliterasyong Cristo.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pormula ng pagbati ni Pablo
  choice: Mesiyas
  alternative: Cristo
  rationale: Bagaman maaaring tila bahagi na ng pangalan ang Χριστός sa gamit ni Pablo, nananatiling makabuluhan dito ang titulong 'Mesiyas.' Inilalagay sa talababa ang tradisyonal na anyong 'Cristo' upang hindi itago ang lehitimong alternatibo.
- issue: Ugnayan ng Diyos Ama at ng Panginoong Jesus bilang pinagmumulan
  choice: Iisang pariralang 'mula sa' ang sumasaklaw sa Diyos na ating Ama at sa Panginoong Jesus
  alternative: Ulitin ang 'mula sa' bago ang Panginoong Jesus
  rationale: Sa Griyego, iisang ἀπό ang namamahala sa dalawang magkaugnay na pinagmumulan; pinananatili ito ng ayos ng salin nang hindi dinaragdagan ang teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'sumainyo' bilang likas na pormula ng pagbati, ngunit hindi idinagdag ang 'nawa' upang hindi tahasang dagdagan ang payak na nominal na pagbati ng Griyego.
