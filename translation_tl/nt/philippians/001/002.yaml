  terminology: Ang “biyaya,” “kapayapaan,” at “Panginoon” ay matatag at angkop na katumbas. Ang “Mesiyas” ay malinaw na isinasalin ang Χριστός bilang titulo; ang talababang “O Cristo” ay nagbibigay ng kinikilalang tradisyonal na alternatibo nang hindi binabago ang pangunahing salin.
