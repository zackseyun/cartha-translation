  source_fidelity: 'Tapat ang salin sa pormula ng pagbati sa Griyego: ang biyaya at kapayapaan ay para sa mga kausap at nagmumula sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas. Ang iisang “mula sa” ay wastong sumasaklaw sa kapuwa pinagmumulan.'
