    rationale: Ipinakikita ng νῦν at ng kasalukuyang ἀκούετε na ang pakikibaka ni Pablo ay kasalukuyang nababalitaan, ngunit walang hiwalay na salitang katumbas ng “patuloy” o “pa.” Maaaring ipahiwatig ang kasalukuyang kalagayan sa pandiwang “nararanasan” nang hindi dinaragdagan ang pahayag.
