translation:
  language: tl
  text: Nararanasan ninyo ang gayunding pakikibaka, gaya ng nakita ninyo sa akin at ngayo'y nababalitaan ninyong nararanasan ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν αὐτὸν ἀγῶνα
  choice: sa pakikibakang
  rationale: Ang ἀγών ay tumutukoy sa matinding pakikipaglaban o tunggalian; pinananatili ng “pakikibaka” ang larawan at ang kaugnayan nito sa pagdurusa dahil sa ebanghelyo.
- source_word: ἔχοντες
  choice: nakikibaka rin kayo
  rationale: Ang literal na “taglay ang pakikibaka” ay hindi likas sa Tagalog; ipinahahayag ng pandiwang ito na aktuwal silang dumaranas ng gayunding tunggalian.
- source_word: οἷον εἴδετε ἐν ἐμοὶ
  choice: nakita ninyong hinarap ko
  rationale: Natural na ipinahahayag ang pakikibakang nasaksihan nila kay Pablo nang hindi ipinapalagay ang eksaktong anyo ng pagdurusa.
- source_word: καὶ νῦν ἀκούετε ἐν ἐμοί
  choice: at ngayo'y nababalitaan ninyong patuloy ko pang hinaharap
  rationale: Ang “nababalitaan” ay angkop sa pagkarinig ng ulat tungkol kay Pablo; ang “patuloy...pang” ay likas na nagpapakita na ang dating nasaksihang pakikibaka ay nararanasan pa rin niya ngayon.
theological_decisions:
- issue: Kung eksaktong magkapareho ang mga pangyayari o magkatulad ang uri ng pakikibaka
  choice: pakikibakang nakita ninyong hinarap ko
  alternative: eksaktong kaparehong pagdurusa
  rationale: Ipinapahayag ng τὸν αὐτὸν ἀγῶνα ang iisang uri ng pakikibaka, ngunit hindi hinihinging magkapareho ang bawat pangyayari; iniiwasang higpitan ang teksto.
- issue: Pagpapatuloy ng pakikibaka ni Pablo sa kasalukuyan
  choice: patuloy ko pang hinaharap
  alternative: naririnig ninyo sa akin
  rationale: Bagaman walang hiwalay na salitang Griyego para sa “patuloy,” ipinahihiwatig ng paghahambing ng dating nakita at ngayo'y naririnig na hindi pa natatapos ang kanyang pakikibaka; tumutugma ito sa natural na diwa ng pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pag-uulit na “nakikibaka/pakikibaka” upang mapanatili ang diin, at “ngayo'y” para sa maayos ngunit hindi makalumang daloy. Ang “Sapagkat” ay nagpapakita ng ugnayan ng participial clause sa naunang talata.
