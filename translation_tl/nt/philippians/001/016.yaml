translation:
  language: tl
  text: Ang ilan ay nangangaral dahil sa pag-ibig, sapagkat alam nilang nakatalaga ako para sa pagtatanggol ng magandang balita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay ako para sa pagtatanggol ng magandang balita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Ang mga nauna ay nangangaral
  rationale: Elliptical ang Griyego at ipinahihiwatig mula sa nakapaligid na konteksto ang kilos na pangangaral. Nilinaw ito sa natural na Tagalog, habang pinananatili ng “mga nauna” ang paghahambing sa kasunod na οἱ δέ.
- source_word: ἐξ ἀγάπης
  choice: dahil sa pag-ibig
  rationale: Ipinapahayag ng ἐξ kasama ng abstraktong pangngalan ang motibo o pinagmumulan ng pagkilos; natural itong ipinahahayag sa Tagalog bilang “dahil sa pag-ibig.”
- source_word: εἰδότες
  choice: sapagkat alam nilang
  rationale: Ginagawang natural sa Tagalog ang participle at malinaw na ipinahahayag ang batayan ng kanilang pagkilos nang hindi dinaragdagan ang kahulugan.
- source_word: εἰς ἀπολογίαν
  choice: upang ipagtanggol
  rationale: Ang ἀπολογία ay tumutukoy sa legal o makatuwirang pagtatanggol, at ipinakikita ng “upang” ang layuning ipinahahayag ng εἰς.
- source_word: τοῦ εὐαγγελίου
  choice: ang magandang balita
  rationale: Isinasalin ang εὐαγγέλιον ayon sa malinaw at karaniwang kahulugan nito sa modernong Tagalog.
- source_word: κεῖμαι
  choice: inilagay ako rito
  rationale: Pinananatili nito ang larawan ng pagiging inilagay o itinakda sa isang kalagayan, nang hindi tahasang ipinapasok sa pangunahing teksto kung sino ang gumawa nito. Ang “rito” ay natural na nagpapahiwatig sa kasalukuyang kalagayan ni Pablo.
theological_decisions:
- issue: Kahulugan ng κεῖμαι sa konteksto ng pagkabilanggo ni Pablo
  choice: inilagay ako rito
  alternative: itinalaga ako
  rationale: Ang “inilagay ako rito” ay mas malapit sa anyo at likas na kalabuan ng κεῖμαι, samantalang ang “itinalaga” ay maaaring magpahiwatig nang mas tahasan ng banal na pagtatalaga kaysa sa mismong sinasabi ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Nilinaw ang ipinahihiwatig na kilos na “nangangaral,” ngunit pinanatili sa talababa ang alternatibong pagbasa sa κεῖμαι.
