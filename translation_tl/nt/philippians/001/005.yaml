  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: tl
  text: dahil sa inyong pakikibahagi sa ebanghelyo mula pa noong unang araw hanggang ngayon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa ebanghelyo.” Maaaring tukuyin ng pariralang Griyego ang saklaw ng kanilang sama-samang pakikibahagi o ang layunin nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: dahil sa inyong pakikibahagi
  rationale: Ipinahahayag ng ἐπί na may datibo ang batayan ng pasasalamat ni Pablo, kaya natural ang “dahil sa.” Ang “pakikibahagi” ay tumutukoy sa aktibo at sama-samang paglahok ng mga taga-Filipos, hindi lamang sa mabuting samahan.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: sa ebanghelyo
  rationale: Pinananatili ng “sa ebanghelyo” ang posibleng diwa ng saklaw ng kanilang pakikibahagi, habang maaaring ipahiwatig din ng Griyego ang layuning itaguyod ang ebanghelyo; inilalahad sa talababa ang alternatibo.
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Ang “ebanghelyo” ang kinikilalang terminong Filipino para sa εὐαγγέλιον at angkop sa teolohikal na gamit ni Pablo.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: mula nang unang araw
  rationale: Malinaw at natural nitong ipinahahayag ang panimulang punto ng patuloy nilang pakikibahagi.
- source_word: ἄχρι τοῦ νῦν
  choice: hanggang ngayon
  rationale: Tumpak at karaniwang pahayag ito para sa pagpapatuloy hanggang sa kasalukuyang sandali.
theological_decisions:
- issue: Ang ugnayan ng κοινωνία at εἰς τὸ εὐαγγέλιον
  choice: pakikibahagi sa ebanghelyo
  alternative: pakikibahagi para sa ebanghelyo
  rationale: Maaaring tukuyin ng εἰς ang saklaw ng kanilang sama-samang pakikibahagi o ang layunin nito. Pinili sa teksto ang mas malapit at maikli na “sa ebanghelyo,” ngunit hindi isinara ang purposive na pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “pakikibahagi” sa halip na mas teknikal o panrelihiyong “pakikisama” upang idiin ang aktibong paglahok nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa talata.
