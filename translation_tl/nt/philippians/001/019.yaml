id: PHP.1.19
reference: Philippians 1:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: tl
  text: Sapagkat alam kong hahantong ito sa aking pagliligtas[a] sa pamamagitan ng inyong panalangin at ng paglalaan ng Espiritu ni Jesus na Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaligtasan,” “paglaya,” o “pagpapatunay na ako ay nasa tama.”
    reason: alternative_reading
  - marker: b
    text: 'Griyego: “ng Espiritu ni Jesus na Mesiyas.” Maaaring tumukoy ang “paglalaan ng Espiritu” sa tulong na ibinibigay ng Espiritu o sa pagkakaloob ng Espiritu mismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: alam ko
  rationale: Ang anyong perpekto ay may pangkasalukuyang diwa rito; natural na ipinapahayag ng “alam ko” ang katiyakan ni Pablo.
- source_word: τοῦτό
  choice: ito
  rationale: Pinananatiling malawak ng panghalip ang pagtukoy sa kabuuan ng kasalukuyang kalagayan ni Pablo, nang hindi ito labis na nililinaw.
- source_word: ἀποβήσεται
  choice: hahantong
  rationale: Ipinahahayag ng pandiwa ang magiging kinalabasan; ang “hahantong” ay natural sa modernong Tagalog at angkop sa anyong panghinaharap.
- source_word: σωτηρίαν
  choice: pagliligtas
  rationale: Sa konteksto ng pagkabilanggo, maaaring tumukoy ito sa paglaya o pagpawalang-sala, ngunit taglay rin nito ang mas malawak na diwa ng kaligtasan. Pinananatili ng “pagliligtas” ang saklaw na ito.
- source_word: δεήσεως
  choice: panalangin
  rationale: Malinaw at natural itong katumbas sa Tagalog ng taimtim na pakiusap sa Diyos.
- source_word: ἐπιχορηγίας
  choice: paglalaan
  rationale: Ipinahahayag nito ang ibinibigay na sapat na tulong o panustos. Hindi nito sapilitang nilulutas kung ang Espiritu ang naglalaan o siya mismo ang ipinagkakaloob.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Espiritu ni Jesus na Mesiyas
  rationale: Tuwirang pinananatili ang ugnayang henitibo sa “Espiritu ni Jesus,” at isinasalin ang Χριστός bilang titulong “Mesiyas” sa natural na anyong Tagalog.
theological_decisions:
- issue: Kahulugan ng σωτηρίαν sa konteksto ng pagkabilanggo ni Pablo
  choice: pagliligtas
  alternative: kaligtasan; pagpawalang-sala; paglaya
  rationale: Maaaring nasa isip ni Pablo ang paglaya o pagpapatunay na siya ay nasa tama, ngunit may mas malawak ding teolohikal na alingawngaw ang salita. Kaya hindi nilimitahan ang salin sa isang tiyak na uri ng pagliligtas.
- issue: Ugnayan ng ἐπιχορηγίας at τοῦ πνεύματος
  choice: paglalaan ng Espiritu
  alternative: tulong na ibinibigay ng Espiritu; pagkakaloob ng Espiritu mismo
  rationale: Maaaring ipakahulugan ng pariralang Griyego na ang Espiritu ang pinagmumulan ng tulong o na ang Espiritu mismo ang ipinagkakaloob. Pinananatili ng pangunahing salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Mesiyas” bilang titulo para sa Χριστός. Iniwasan ang labis na teknikal na “panustos” at pinili ang “paglalaan,” habang ipinaliwanag sa talababa ang kalabuan ng pariralang Griyego.
