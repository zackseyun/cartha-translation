id: PHP.1.20
reference: Philippians 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: tl
  text: ayon sa aking matinding pananabik at pag-asa na hindi ako mapapahiya sa anumang paraan[a], sa halip, taglay ang buong tapang, gaya ng dati at maging ngayon, ang Mesiyas[b] ay dadakilain sa aking katawan, sa pamamagitan man ng buhay o ng kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi ako mahihiya sa anumang paraan.”
    reason: lexical_alternative
  - marker: b
    text: O, “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinapahayag nito na ang kasunod ay kaayon ng pananabik at pag-asa ni Pablo; natural ito sa Filipino at pinananatili ang ugnayan sa naunang konteksto.
- source_word: ἀποκαραδοκίαν
  choice: matinding pananabik
  rationale: Ipinahihiwatig ng pambihirang salitang ito ang masidhi at nakatuong paghihintay, hindi lamang karaniwang pag-asam.
- source_word: ἐλπίδα
  choice: pag-asa
  rationale: Ito ang karaniwang katumbas na malinaw na nagpapahayag ng may pagtitiwalang pag-asa.
- source_word: ἐν οὐδενὶ
  choice: sa anumang paraan
  rationale: Likas sa modernong Filipino at malinaw na ipinapahayag ang ganap na pagkakaila nang hindi nililimitahan ang saklaw sa mga bagay lamang.
- source_word: αἰσχυνθήσομαι
  choice: hindi ako mapapahiya
  rationale: Pinananatili nito ang posibleng pasibong diwa ng hayagang pagkabigo o pagkalagay sa kahihiyan; inilagay sa talababa ang alternatibong pansariling damdamin.
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: taglay ang buong tapang
  rationale: Ipinapakita ng παρρησία rito ang malaya at matapang na hayagang pagpapatotoo; malinaw at natural ang parirala sa Filipino.
- source_word: μεγαλυνθήσεται
  choice: dadakilain
  rationale: Pinananatili ang pasibong anyo at ang diwang ipakikita o kikilalaning dakila ang Mesiyas.
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: May buhay na puwersa bilang titulo ang Χριστός sa pangungusap; ipinapakita ng “Mesiyas” ang kahulugan nito sa halip na tratuhing pangalan lamang.
- source_word: ἐν τῷ σώματί μου
  choice: sa aking katawan
  rationale: Tuwirang pinananatili nito ang diin sa katawan ni Pablo bilang larangan ng pagdakila sa Mesiyas, sa buhay man o kamatayan.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: sa pamamagitan man ng buhay o ng kamatayan
  rationale: Pinananatili ang magkatimbang na parirala at ang malawak na diwa ng διά bilang paraan o kalagayang pinagdaraanan.
theological_decisions:
- issue: Ang kahulugan ng αἰσχυνθήσομαι bilang hayagang pagkapahiya o pansariling pagkahiya
  choice: hindi ako mapapahiya
  alternative: hindi ako mahihiya
  rationale: Sa konteksto ng paglilitis, pagpapatotoo, at pag-asang hindi mabibigo, mas angkop ang hayagang pagkapahiya, ngunit tunay na posible rin sa Griyego ang pansariling pagkahiya kaya hindi ito inalis.
- issue: Paglilipat ng Χριστός sa kontekstong Paulino
  choice: Mesiyas
  alternative: Cristo
  rationale: Nananatiling makabuluhan bilang titulo ang Χριστός dito, kaya isinalin ang kahulugan nito; kinikilala sa talababa ang nakasanayang anyong “Cristo.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “taglay ang buong tapang” sa halip na mas teknikal na “buong kalayaan sa pagsasalita,” at pinanatili ang pasibong “dadakilain” at ang kongkretong “sa aking katawan.”
