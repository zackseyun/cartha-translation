  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: tl
  text: at huwag kayong matakot sa anumang paraan sa mga sumasalungat sa inyo.[a] Ito ay isang palatandaan sa kanila ng kapahamakan,[b] ngunit ng inyong kaligtasan—at ito ay mula sa Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabahala” o “masindak.”
    reason: lexical_alternative
  - marker: b
    text: O “katibayan” o “indikasyon” ng kapahamakan.
    reason: lexical_alternative
  - marker: c
    text: Ang “ito ay mula sa Diyos” ay maaaring tumukoy partikular sa kaligtasan o, sa mas malawak na diwa, sa buong naunang palatandaan.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: matakot
  rationale: Ipinahihiwatig ng pandiwa ang pagkagulat, pagkasindak, o pagk intimidated dahil sa mga kalaban. Ang “matakot” ay likas at malinaw sa makabagong Tagalog; inilalahad sa talababa ang iba pang posibleng himig.
- source_word: ἐν μηδενί
  choice: sa anumang paraan
  rationale: Pinananatili nito ang saklaw na walang anumang bagay o paraan na dapat nilang ikatakot, habang natural sa Tagalog.
- source_word: ἀντικειμένων
  choice: mga sumasalungat sa inyo
  rationale: Malinaw nitong ipinakikitang mga taong aktibong kumakalaban sa mga mambabasa ang tinutukoy ng participle.
- source_word: ἔνδειξις
  choice: palatandaan
  rationale: Saklaw nito ang kahulugang indikasyon o katibayang tumuturo sa isang mas malalim na katotohanan, nang hindi ito pinatitindi bilang ganap na “patunay.”
- source_word: ἀπωλείας
  choice: kapahamakan
  rationale: Natural itong salin para sa ruin o destruction sa konteksto ng paghatol at hindi nito nilalagyan ng higit na tiyak na detalye ang Griyego.
- source_word: σωτηρίας
  choice: kaligtasan
  rationale: Pinananatili nito ang teolohikal na bigat ng pagliligtas ng Diyos sa gamit ni Pablo.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: at ito ay mula sa Diyos
  rationale: Pinananatili ang demonstratibong “ito” at ang kalabuan kung ang tinutukoy ay ang kaligtasan lamang o ang mas malawak na naunang palatandaan.
theological_decisions:
- issue: Tinutukoy ng τοῦτο (“ito”)
  choice: 'Hindi nilimitahan sa pangunahing teksto: “at ito ay mula sa Diyos.”'
  alternative: Maaaring tumukoy ang “ito” partikular sa kaligtasan, o mas malawak sa buong palatandaang inilalarawan sa naunang sugnay.
  rationale: Hindi tiyak sa Griyego ang antecedent, kaya pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon sa halip na pasiyahan ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “huwag kayong matakot” bilang natural na pautos na katumbas ng participial construction na nakaugnay sa naunang konteksto. Napanatili ang pagtutulad sa “sa kanila” at “inyong,” pati ang malabong saklaw ng “ito.”
