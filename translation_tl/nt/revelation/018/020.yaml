id: REV.18.20
reference: Revelation 18:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: tl
  text: “Magalak ka dahil sa kanya, O langit—pati kayong mga banal, mga apostol, at mga propeta—sapagkat nagbigay ang Diyos ng hatol sa usapin ninyo laban sa kanya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siksik ang pagkakasabi sa Griyego; sa literal, “hinatulan ng Diyos ang hatol ninyo mula sa kanya.” Maaari rin itong unawain na “hinatulan siya ng Diyos alang-alang sa inyo” o “ipinaghiganti kayo ng Diyos sa kanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Magalak ka
  rationale: Tuwirang pautos sa ikalawang panauhang isahan; natural sa modernong Tagalog at angkop sa marangal na panawagan.
- source_word: ἐπ’ αὐτῇ
  choice: dahil sa kanya
  rationale: Ipinahahayag ang tao o pangyayaring sanhi o okasyon ng kagalakan. Hindi idinaragdag sa mismong parirala kung anong sinapit niya.
- source_word: οὐρανέ
  choice: O langit
  rationale: Pinananatili ang isahang bokatibo at ang personipikadong tuwirang pagtawag sa langit.
- source_word: οἱ ἅγιοι
  choice: mga banal
  rationale: Karaniwang katawagan sa mga taong ibinukod para sa Diyos; mas tuwiran at malawak na nauunawaan kaysa sa hiram na katawagang “mga santo.”
- source_word: οἱ ἀπόστολοι
  choice: mga apostol
  rationale: Pinananatili ang teknikal na katawagan, lalo na't katambal ito ng mga propeta.
- source_word: οἱ προφῆται
  choice: mga propeta
  rationale: Karaniwan at eksaktong katumbas sa kontekstong biblikal.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng utos na magalak habang pinananatili ang marangal na rehistro.
- source_word: ἔκρινεν
  choice: nagpasiya
  rationale: Ipinahahayag ang hudisyal na pagkilos ng Diyos nang hindi pa inuulit nang alanganin ang salitang “hatol” sa pandiwa at pangngalan.
- source_word: τὸ κρίμα ὑμῶν
  choice: ng hatol para sa inyo
  rationale: Pinananatili ang hudisyal na bokabularyo at ang ugnayan ng hatol sa mga banal, apostol, at propeta, ngunit hindi tahasang ginagawang paghihiganti.
- source_word: ἐξ αὐτῆς
  choice: laban sa kanya
  rationale: Sa siksik na hudisyal na pahayag, natural nitong ipinakikita na ang hatol ay ukol sa Babilonia bilang kabilang panig; inilalahad sa talababa ang mas literal na anyo at ang saklaw ng posibleng kahulugan.
theological_decisions:
- issue: Gaano kalinaw na ipahahayag ang hudisyal na pagkilos ng Diyos para sa kanyang bayan laban sa Babilonia
  choice: Gumamit ng “nagpasiya ang Diyos ng hatol para sa inyo laban sa kanya,” na nagpapanatili sa wika ng paghatol.
  alternative: “Ipinaghiganti kayo ng Diyos sa kanya” o “hinatulan siya ng Diyos dahil sa ginawa niya sa inyo.”
  rationale: Walang tahasang pandiwa para sa paghihiganti sa Griyego. Ang pangunahing salin ay likas sa Tagalog ngunit hindi ginagawang lantad na paghihiganti ang siksik na κρίνω/κρίμα na pahayag; itinatala ng talababa ang literal na pagkakasabi at mga posibleng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang gitling na pahaba ay naghihiwalay sa tuwirang tawag sa langit at sa kasunod na mga pangkat nang hindi pinapantay ang bilang ng pandiwang pautos. Iniwasan ang tahasang bokabularyo ng paghihiganti sa pangunahing teksto upang mapanatili ang hudisyal na diin at ang siksik na ambiguwidad ng Griyego.
