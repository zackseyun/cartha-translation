    issue: Di-likas ang pariralang “nagpasiya ang Diyos ng hatol.”
    rationale: Sa modernong Tagalog, karaniwang “nagpasiya ang Diyos” o “nagbigay/iginawad ang Diyos ng hatol.” Dahil may kasunod na κρίμα, ang kasalukuyang anyo ay hindi gaanong malinaw at hindi sapat na naipakikita ang legal na ugnayan ng pandiwa at pangngalan.
  - severity: low
    issue: Ang “hatol para sa inyo” ay maaaring basahing hatol na ibinibigay sa mga kausap, sa halip na hatol sa kanilang usapin laban sa Babilonia.
    rationale: Ang “sa usapin ninyo laban sa kanya” ay mas malinaw na nagpapahiwatig ng kanilang legal na kaso nang hindi ginagawang tahasang “paghihiganti” ang pahayag.
