  verdict: revise
  source_fidelity: Tumpak ang pagtukoy sa langit, mga banal, mga apostol, at mga propeta, at ang pangunahing salin ay wastong nagpapanatili ng hudisyal na diwa nang hindi tahasang isinasalin bilang paghihiganti. Gayunman, ang “nagpasiya ang Diyos ng hatol” ay hindi likas na kolokasyon sa Tagalog at bahagyang lumalabo ang relasyon ng κρίνω at κρίμα.
  naturalness: Marangal at malinaw sa kabuuan ang rehistro. Mas natural at malinaw ang “nagbigay ang Diyos ng hatol sa usapin ninyo laban sa kanya” kaysa “nagpasiya ang Diyos ng hatol para sa inyo laban sa kanya.” Pinananatili nito ang legal na pahayag nang hindi ipinipilit ang di-likas na literalismo.
  terminology: Ang “mga banal,” “mga apostol,” at “mga propeta” ay angkop at magkakatugma. Ang “usapin ninyo” ay isang natural na legal na paraan upang katawanin ang siksik na τὸ κρίμα ὑμῶν; ang “hatol” ay nananatiling hayag sa pangunahing teksto.
  issues:
