source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: tl
  text: At iniiyakan at pinagluluksa siya ng mga mangangalakal sa daigdig[a], sapagkat wala nang bumibili ng kanilang kargamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lupain.” Ang salitang Griego ay maaaring tumukoy sa daigdig o sa lupain; sa Pahayag, madalas na mas malawak ang saklaw nito.
    reason: lexical_alternative
  - marker: b
    text: O “mga paninda.” Ang salitang Griego ay maaaring tumukoy sa karga ng isang barko o sa mga kalakal na inilalako.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: mga mangangalakal
  rationale: Karaniwan at malinaw itong tawag sa mga taong nakikipagkalakalan; ang konteksto ay malawakang kalakalan ng mamahaling mga kalakal.
- source_word: τῆς γῆς
  choice: sa daigdig
  rationale: Maaaring mangahulugan ang γῆ ng ‘daigdig’ o ‘lupain.’ Sa malawak na saklaw ng paghatol sa Pahayag, ang ‘daigdig’ ang pinakaangkop habang itinatala sa talababa ang alternatibo.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: umiiyak at nagluluksa
  rationale: Pinananatiling magkahiwalay ang dalawang pandiwa at ang tumitinding diin ng pag-iyak at pagluluksa.
- source_word: ἐπ’ αὐτήν
  choice: dahil sa kanya
  rationale: Natural itong Filipino para sa pagdadalamhati na nakatuon sa sinapit ng isang tao o personipikadong lungsod. Hindi tinutukoy ng panghalip na Filipino ang kasarian, ngunit nananatili ang personal na pagtukoy sa Babilonia.
- source_word: γόμον
  choice: kargamento
  rationale: Ang γόμος ay karga, lalo na ng sasakyang-dagat, o mga kalakal na isinasakay. Akma ang ‘kargamento’ sa konteksto ng pandaigdigang kalakalan at sa kasunod na talaan ng mga kalakal.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: wala nang bumibili
  rationale: Likas at malinaw nitong ipinahahayag sa Filipino ang kasalukuyang pagtigil na dala ng οὐκέτι.
- source_word: αὐτῶν
  choice: nila
  rationale: Possessive ang genitive na panghalip at tumutukoy sa kargamento ng mga mangangalakal.
theological_decisions:
- issue: Ang Babilonia bilang personipikadong lungsod
  choice: Pinanatili ang personal na pagtukoy sa pamamagitan ng ‘kanya.’
  alternative: Gawing impersonal ang pagtukoy, gaya ng ‘nito.’
  rationale: Inilalarawan sa Pahayag ang Babilonia bilang isang babae at lungsod. Bagaman walang kasariang gramatikal ang ‘kanya,’ hindi nito ginagawang abstraktong sistema lamang ang tinutukoy at pinananatili nito ang personipikasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sapagkat’ upang mapanatili ang pormal na himig ng apokaliptikong salaysay, habang nananatiling natural ang ‘wala nang bumibili.’
