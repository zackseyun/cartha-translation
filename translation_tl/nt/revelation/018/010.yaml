  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: tl
  text: 'Nakatayo sila sa malayo dahil sa takot sa kanyang pagdurusa, at nagsasabi: “Sa aba! Sa aba![a] Ang dakilang lungsod, Babilonia, ang makapangyarihang lungsod![b] Sapagkat sa isang oras lamang ay dumating ang hatol sa iyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kahabag-habag! Kahabag-habag!” Ang bulalas na Griyego ay maaaring magpahayag ng panaghoy at ng nagbabantang kapahamakan; kapuwa diwa ang saklaw ng “Sa aba!”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malakas na lungsod.” Ang pang-uri sa Griyego ay maaaring tumukoy sa lakas, kapangyarihan, o pagiging makapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Nakatayo sila sa malayo
  rationale: Inilalarawan ng perfect participle ang nananatili nilang kalagayan o puwesto, at malinaw na ipinahahayag ng “sa malayo” ang pisikal na distansiya.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: dahil sa takot sa pagpapahirap sa kanya
  rationale: Ipinapakita ng διά na takot ang dahilan ng paglayo nila. Pinananatili ng “pagpapahirap” ang tindi at maparusang diwa ng βασανισμός, habang ang “kanya” ay umaayon sa pagsasatao sa lungsod sa mismong pahayag.
- source_word: Οὐαὶ οὐαί
  choice: Sa aba mo! Sa aba mo
  rationale: Ang “sa aba” ay likas na ekspresyong Filipino na kayang magpahayag kapwa ng panaghoy at ng nagbabantang kapahamakan. Ang “mo” ay angkop sa tuwirang pakikipag-usap sa lungsod, na pinatutunayan din ng “sa iyo” sa hulihan.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: dakilang lungsod
  rationale: Direkta at natural na katumbas ito ng pariralang naglalarawan sa laki, katanyagan, o kadakilaan ng lungsod nang hindi nililimitahan ang saklaw.
- source_word: Βαβυλὼν
  choice: Babilonia
  rationale: Ginamit ang kinagawiang anyong Filipino ng pangalang Babylon.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: makapangyarihang lungsod
  rationale: Saklaw ng ἰσχυρός ang lakas at kapangyarihan. Mas natural sa Filipino ang “makapangyarihang lungsod” kaysa “malakas na lungsod” sa kontekstong ito.
- source_word: μιᾷ ὥρᾳ
  choice: sa loob lamang ng isang oras
  rationale: Ipinahahayag nito ang napakaikling panahon at biglang pagsapit ng hatol. Ginagawang malinaw ng “lamang” ang diin ng iisang oras.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: dumating ang hatol sa iyo
  rationale: Pinananatili ng “dumating” ang larawan ng ἦλθεν, at malinaw na ipinahahayag ng “hatol” ang κρίσις bilang pasiya o hatol na sumapit sa Babilonia.
theological_decisions:
- issue: Saklaw ng apokaliptikong bulalas na οὐαί
  choice: Sa aba mo! Sa aba mo
  alternative: Kahabag-habag! Kahabag-habag!; O, kay saklap!
  rationale: Pinananatili ng “sa aba” ang tensiyon sa pagitan ng panaghoy at pahayag ng kapahamakan, sa halip na gawin itong awa lamang o sumpa lamang.
- issue: Pamanahon at aspekto ng ἦλθεν
  choice: dumating ang hatol sa iyo
  alternative: sumapit na ang hatol sa iyo
  rationale: Ang payak na naganap na anyo ay tapat sa aorist at natural sa tuwirang panaghoy. Hindi idinagdag ang “na,” bagaman maaari rin itong gamitin upang idiin ang kasalukuyang bunga ng dumating na hatol.
- issue: Pagsasatao sa Babilonia
  choice: kanya; sa iyo
  alternative: nito; dito
  rationale: Tuwirang kinakausap ng teksto ang lungsod at ginagamit ang panghalip na ikalawang panauhan sa “hatol sa iyo.” Kaya pinananatili ang pagsasatao sa halip na gawing lubos na impersonal ang lungsod.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinananatili ang matinding pag-uulit at tuwirang pakikipag-usap na katangian ng apokaliptikong panaghoy. Ginamit ang gitling na em dash upang malinaw na ipakita na ang “Babilonia” at “makapangyarihang lungsod” ay kapwa tumutukoy sa “dakilang lungsod.”
