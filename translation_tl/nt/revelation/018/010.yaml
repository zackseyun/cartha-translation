revisions:
- from: Nakatayo sila sa malayo dahil sa takot sa pagpapahirap sa kanya, at sinasabi, “Sa aba mo! Sa aba mo,[a] dakilang lungsod—Babilonia, makapangyarihang lungsod![b] Sapagkat sa loob lamang ng isang oras ay dumating ang hatol sa iyo.”
  to: 'Nakatayo sila sa malayo dahil sa takot sa kanyang pagdurusa, at nagsasabi: “Sa aba! Sa aba![a] Ang dakilang lungsod, Babilonia, ang makapangyarihang lungsod![b] Sapagkat sa isang oras lamang ay dumating ang hatol sa iyo.”'
  rationale: Inalis ang idinagdag na “mo” sa dalawang bulalas upang hindi maglagay ng panghalip na wala sa Οὐαὶ οὐαί, habang pinananatili ang tuwirang pagtukoy sa Babilonia sa “sa iyo.” Ginawang “kanyang pagdurusa” ang βασανισμός αὐτῆς para sa mas malinaw na ugnayang pagmamay-ari/karanasan, at ginawang “sa isang oras lamang” ang parirala ng panahon upang mas malapit sa Griyego.
