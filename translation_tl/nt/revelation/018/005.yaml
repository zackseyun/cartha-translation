  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: tl
  text: Sapagkat ang mga kasalanan niya ay nagpatong-patong hanggang sa langit[a], at inalala ng Diyos ang mga maling gawa niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkadikit-dikit hanggang sa langit.” Ang pandiwang Griyego ay literal na nangangahulugang “dumikit” o “magsanib”; dito ay inilalarawan nito ang mga kasalanang naipon sa napakataas na bunton.
    reason: lexical_alternative
  - marker: b
    text: 'Sa kontekstong ito, ang “inalala” ay may puwersang panghukuman: hindi ipinagwalang-bahala ng Diyos ang mga maling gawa niya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahahayag nito ang dahilan ng utos sa naunang talata at natural ang causal na ugnayan sa Tagalog.
- source_word: ἐκολλήθησαν
  choice: ay nagpatong-patong
  rationale: Ang pandiwa ay literal na tumutukoy sa pagdikit o pagsanib. Sa mga kasalanan bilang simuno at sa pariralang 'hanggang langit,' inilalarawan nito ang napakalaking pag-iipon; malinaw na naihahatid ng 'nagpatong-patong' ang larawang ito.
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Karaniwan at tuwirang katumbas ng ἁμαρτίαι.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: hanggang langit
  rationale: Pinananatili nito ang hangganan at pataas na larawan ng Griyego nang natural sa Tagalog.
- source_word: ἐμνημόνευσεν
  choice: inalala
  rationale: Tuwirang pinananatili ang pandiwang 'alalahanin' nang hindi tahasang ipinapasok ang kaparusahan, bagaman may puwersang panghukuman ito sa konteksto.
- source_word: ὁ θεός
  choice: ang Diyos
  rationale: Tuwiran at pamantayang salin.
- source_word: ἀδικήματα
  choice: masasama niyang gawa
  rationale: Tumutukoy ito sa mga gawang mali o di-matuwid. Malinaw sa karaniwang mambabasa ang 'masasamang gawa' at napapanatili ang pagkakaiba nito sa naunang 'mga kasalanan.'
theological_decisions:
- issue: Pagkakaiba ng ἁμαρτίαι at ἀδικήματα
  choice: 'Gumamit ng magkaibang parirala: ''mga kasalanan'' at ''masasama niyang gawa.'''
  alternative: Isalin ang dalawang salita bilang 'mga kasalanan.'
  rationale: Magkaugnay ngunit magkaiba ang dalawang salitang Griyego. Pinananatili ng salin ang retorikal na pagkakaiba nang hindi ipinapalagay na lubos na magkaiba ang kanilang teolohikal na kahulugan.
- issue: Puwersa ng pag-alaala ng Diyos
  choice: Isalin bilang 'inalala ng Diyos.'
  alternative: Isalin bilang 'pinanagot ng Diyos' o 'hinatulan ng Diyos.'
  rationale: Sa konteksto, ang pag-alaala ng Diyos ay may implikasyong panghukuman, ngunit 'inalala' mismo ang sinabi ng Griyego. Pinananatili nito ang tensiyon sa halip na gawing tahasan ang ipinahihiwatig lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'nagpatong-patong' upang likas na maipahayag ang matinding pag-iipon habang inilalagay sa talababa ang mas literal na larawan ng pagdikit o pagsanib.
