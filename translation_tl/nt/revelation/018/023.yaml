id: REV.18.23
reference: Revelation 18:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: tl
  text: At hindi na kailanman sisikat sa iyo ang liwanag ng ilawan, at hindi na kailanman maririnig sa iyo ang tinig ng lalaking ikakasal at ng babaeng ikakasal; sapagkat ang mga mangangalakal mo ay ang mga makapangyarihan sa lupa,[a] at dahil sa iyong pangkukulam[b] ay nailigaw ang lahat ng bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga prominenteng tao sa lupa.” Ang salitang Griyego ay tumutukoy sa mga taong may mataas na katayuan o malaking kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “salamangka” o “mga gawaing mahika.” Ang Griyegong φαρμακεία ay tumutukoy rito sa pangkukulam o mapanlinlang na paggamit ng mahika.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: liwanag ng ilawan
  rationale: Tuwirang inilalarawan ang liwanag mula sa λύχνος; natural at malinaw sa modernong Tagalog ang “ilawan” sa kontekstong biblikal.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: hindi na kailanman sisikat
  rationale: Ipinahahayag ng οὐ μή kasama ng subjunctive ang mariing pagtanggi, at ng ἔτι ang ganap na paghinto; pinananatili ng “hindi na kailanman” ang katiyakan at pagiging pangwakas ng hatol.
- source_word: ἐν σοὶ
  choice: sa iyo
  rationale: Pinananatili ang tuwirang pakikipag-usap sa Babilonyang inilalarawan bilang isang persona, nang hindi ito pinalalawak sa mas interpretatibong “sa gitna mo.”
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: tinig ng lalaking ikakasal at ng babaeng ikakasal
  rationale: Ang “tinig” ay malapit sa φωνή at nagpapanatili sa alingawngaw ng pananalita ng mga propeta; ang mga pariralang “lalaking ikakasal” at “babaeng ikakasal” ay malinaw sa kasalukuyang Tagalog.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: hindi na kailanman maririnig
  rationale: Pinananatili ang mariing negatibo at ang anyong balintiyak ng Griyego sa natural na Tagalog.
- source_word: οἱ ἔμποροί σου
  choice: ang mga mangangalakal mo
  rationale: Tumpak sa mga taong nakikibahagi sa malawakang kalakalan at umaangkop sa komersiyal na larawan ng kabanata.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: ang mga makapangyarihan sa lupa
  rationale: Ipinahahayag ang mataas na katayuan at impluwensiya nang hindi nililimitahan ang salita sa maharlika, opisyal ng pamahalaan, o modernong negosyanteng tycoon.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: dahil sa iyong pangkukulam
  rationale: Sinasaklaw ng “pangkukulam” ang mahika at mapanlinlang na gawaing okulto na tinutukoy ng φαρμακεία sa kontekstong apokaliptiko, nang hindi ito maling nililimitahan sa makabagong gamot.
- source_word: ἐπλανήθησαν
  choice: nailigaw
  rationale: Pinananatili ang diwang balintiyak ng πλανάω at ang posibilidad ng kapuwa panlilinlang at pag-akit sa maling landas.
- source_word: πάντα τὰ ἔθνη
  choice: ang lahat ng bansa
  rationale: Natural na kolektibong pagtukoy sa mga bansa o mga bayan ng daigdig sa Pahayag.
theological_decisions:
- issue: Kahulugan ng φαρμακεία sa konteksto ng hatol sa Babilonya
  choice: pangkukulam
  alternative: salamangka; mga gawaing mahika
  rationale: Pinananatili nito ang malawak na diwang espirituwal at mapanlinlang ng salita sa konteksto, nang hindi ito inuugnay lamang sa paggamit ng mga gamot o lason.
- issue: Lakas ng dalawang sugnay na may οὐ μή
  choice: hindi na kailanman ...
  alternative: hindi na ...; tiyak na hindi na ...
  rationale: Malinaw nitong ipinahahayag ang mariin at di-mababaling hatol, habang nananatiling natural sa Tagalog.
- issue: Saklaw ng μεγιστᾶνες
  choice: mga makapangyarihan sa lupa
  alternative: mga dakila sa lupa; mga prominenteng tao sa lupa
  rationale: Iniiwasan ng salin ang pagbibigay ng moral na papuri sa “dakila” at hindi rin nito ipinapalagay na pulitikal o pangkabuhayan lamang ang kanilang kapangyarihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang personipikasyon ng Babilonya sa “sa iyo,” ang balanseng pag-uulit ng dalawang mariing negatibong sugnay, at ang propetikong ritmo ng talata. Inilagay ang mga talababa sa mismong mga salitang kanilang ipinapaliwanag.
