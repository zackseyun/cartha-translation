id: REV.18.17
reference: Revelation 18:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: tl
  text: sapagkat sa loob ng isang oras ay nawasak ang gayong kalaking kayamanan. At ang bawat kapitan ng barko, ang bawat naglalayag patungo sa isang lugar[a], ang mga mandaragat, at ang lahat ng naghahanapbuhay sa dagat ay tumayo sa malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bawat naglalayag patungo sa isang daungan” o “ang bawat naglalayag saanman.” Medyo idyomatiko ang pariralang Griyego at maaaring tumukoy nang malawakan sa mga naglalakbay sa dagat patungo sa iba’t ibang lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinahihiwatig nito ang paliwanag o dahilan ng panaghoy sa naunang konteksto.
- source_word: μιᾷ ὥρᾳ
  choice: sa loob ng isang oras
  rationale: Likas na Filipino para sa panahong kinasasaklawan ng pangyayari at pinananatili ang diin sa biglaang pagkawasak.
- source_word: ἠρημώθη
  choice: nawasak
  rationale: Malinaw at natural na katumbas ng lubusang pagkawasak o pagiging tiwangwang, nang hindi dinaragdagan ang larawan.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: ang gayong kalaking kayamanan
  rationale: Pinananatili ang masidhing demonstratibo at ang diin sa napakalaking halaga ng kayamanan.
- source_word: πᾶς κυβερνήτης
  choice: ang bawat kapitan ng barko
  rationale: Sa kontekstong pandagat, tumutukoy ito sa namamahala o nagpapatakbo ng sasakyang-dagat; mas madaling maunawaan ang 'kapitan ng barko' kaysa sa teknikal na 'timonel.'
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: ang bawat naglalayag patungo sa isang lugar[a]
  rationale: Malapit ito sa hindi ganap na tiyak at idyomatikong pariralang Griyego, nang hindi ito nililimitahan sa mga pasahero, mangangalakal, o isang partikular na daungan.
- source_word: ναῦται
  choice: ang mga mandaragat
  rationale: Karaniwan, malinaw, at marangal na modernong katawagan sa mga sailor.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: ang lahat ng naghahanapbuhay sa dagat
  rationale: Natural na Filipino na sumasaklaw sa mga taong ang gawain o kabuhayan ay kaugnay ng dagat, hindi lamang sa mga mandaragat.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: ay tumayo sa malayo
  rationale: Pinananatili ang payak na kilos ng aorist at ang pisikal na distansiya ng mga nakamasid.
theological_decisions:
- issue: Saklaw ng mga pangkat na may gawaing pandagat sa panaghoy tungkol sa Babilonia
  choice: Panatilihing magkakahiwalay ang kapitan ng barko, mga naglalayag patungo sa isang lugar, mga mandaragat, at lahat ng naghahanapbuhay sa dagat.
  alternative: Pagsama-samahin silang lahat bilang 'mga taong-dagat,' o ipakahulugang mga pasahero o mangangalakal lamang ang ikalawang pangkat.
  rationale: Magkakaugnay ngunit magkakaibang pangkat ang inililista ng Griyego. Ang pagpapanatili sa mga ito ay naglalarawan sa malawak na epekto ng pagbagsak ng Babilonia nang hindi nagdaragdag ng espesipikong pagkakakilanlang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyo ng panaghoy at ang magkakahiwalay na mga pangkat sa talaan; ang bahagyang di-karaniwang pariralang 'patungo sa isang lugar' ay sinadyang panatilihin dahil hindi ganap na tiyak ang Griyego at nilinaw sa talababa.
