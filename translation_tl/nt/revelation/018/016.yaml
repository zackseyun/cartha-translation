    issue: “Kahabag-habag! Kahabag-habag” para sa Οὐαὶ οὐαί
    rationale: Ang “kahabag-habag” ay karaniwang pang-uring naglalarawan ng kaawa-awang kalagayan. Hindi nito tuwirang naihahatid ang eksklamatibong “woe” na may panaghoy at pahiwatig ng hatol. “Sa aba, sa aba” ang mas tumpak at likas na katumbas.
  - severity: low
    issue: “nadaramtan” at “napapalamutian”
    rationale: Ang mga anyong ito ay maaaring basahing imperpektibo o nagaganap. Ang mga perpektong participle na περιβεβλημένη at κεχρυσωμένη ay mas mahusay na naihahatid ng “nakadamit” at “pinalamutian,” na tumutukoy sa kalagayang bunga ng naganap na pagkilos.
