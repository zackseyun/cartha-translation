id: REV.18.16
reference: Revelation 18:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: tl
  text: na nagsasabing[a], “Sa aba, sa aba ng dakilang lungsod, na nakadamit ng pinong lino, purpura, at iskarlata, at pinalamutian ng ginto, mahalagang bato, at perlas,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ay, ay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pinananatili ang pangkasalukuyang pandiwaring nag-uugnay sa panaghoy sa mga nagsasalita sa naunang talata, nang hindi inuulit ang simuno.
- source_word: Οὐαὶ οὐαί
  choice: Kahabag-habag! Kahabag-habag
  rationale: Likas na panaghoy sa modernong Tagalog na naghahayag kapuwa ng matinding dalamhati at kapahamakang dulot ng hatol; pinananatili rin ang pag-uulit para sa diin.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: ang dakilang lungsod
  rationale: Natural na ayos sa Tagalog na pinananatili ang mariing paglalarawan sa lungsod.
- source_word: περιβεβλημένη
  choice: nadaramtan ng
  rationale: Inilalarawan ang nananatiling marangyang anyo ng lungsod bilang isang babaeng nakadamit, alinsunod sa personipikasyon sa konteksto.
- source_word: βύσσινον
  choice: pinong lino
  rationale: Ipinahihiwatig ang mamahalin at mataas na uring telang tinutukoy, hindi lamang pangkaraniwang lino.
- source_word: πορφυροῦν
  choice: kulay-ube
  rationale: Malinaw sa karaniwang mambabasa at pinananatili ang kulay na kaugnay ng kayamanan at karangyaan.
- source_word: κόκκινον
  choice: matingkad na pula
  rationale: Inihahatid ang matingkad na scarlet sa natural na modernong Tagalog nang hindi gumamit ng di-pamilyar na terminong pangkulay.
- source_word: κεχρυσωμένη
  choice: napapalamutian ng
  rationale: Sinasaklaw ang marangyang pag-aadorno gamit ang ginto, mahahalagang bato, at perlas, sa halip na ipakahulugang literal na binalutan lamang ng ginto.
- source_word: χρυσίῳ
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na ginamit sa pagpapalamuti.
- source_word: λίθῳ τιμίῳ
  choice: mahahalagang bato
  rationale: Ginawang maramihan bilang likas na kolektibong pagpapahayag sa Tagalog para sa uri ng mamahaling palamuti.
- source_word: μαργαρίτῃ
  choice: mga perlas
  rationale: Ginawang maramihan bilang natural na kolektibong gamit sa Tagalog sa talaan ng mga mamahaling palamuti.
theological_decisions:
- issue: Tono ng panaghoy sa pagbagsak ng Babilonia
  choice: Kahabag-habag! Kahabag-habag
  alternative: Ay! Ay!
  rationale: Pinananatili ang sabayang diwa ng panaghoy at kapahamakang nasa οὐαί sa konteksto ng hatol. Ang “Ay!” ay mas tuwirang interheksiyon ngunit maaaring marinig bilang sakit o pagkagulat lamang at hindi gaanong malinaw ang bigat ng kapahamakan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “nadaramtan” at “napapalamutian” ay nagpapanatili ng mataas na estilong angkop sa apokaliptikong panaghoy, samantalang ang mga kulay ay isinalin sa karaniwang bokabularyo. Walang talababa dahil ang alternatibong “Ay! Ay!” ay hindi kinakailangang ilahad upang maunawaan ang talata.
