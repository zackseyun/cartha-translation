  verdict: revise
  source_fidelity: Kailangan ng ilang pagbabago upang mas tumpak na maihatid ang panaghoy na οὐαὶ οὐαί at ang perpektong kalagayang inilalarawan ng mga participle. Ang “Kahabag-habag” ay higit na pang-uri (“pitiful”) kaysa sa interheksiyong hatol/panaghoy na nasa Griyego.
  naturalness: Mas natural at matimbang sa modernong Tagalog ang “Sa aba, sa aba ng dakilang lungsod” kaysa sa inuulit na “Kahabag-habag.” Ang “nakadamit” at “pinalamutian” ay malinaw na naglalarawan ng kasalukuyang marangyang kalagayan, samantalang ang “nadaramtan” ay maaaring magpahiwatig ng nagaganap na pagkakadamit.
  terminology: Ginamit ang “purpura” at “iskarlata” bilang mga kulay/telang pangkarangyaan na angkop sa apokaliptikong rehistro. Pinanatili ang “pinong lino,” “ginto,” “mahalagang bato,” at “perlas.”
