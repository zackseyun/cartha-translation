id: REV.18.4
reference: Revelation 18:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: tl
  text: At narinig ko ang isa pang tinig mula sa langit na nagsasabi[a], “Lumabas kayo mula sa kaniya, bayan ko, upang hindi kayo makibahagi sa mga kasalanan niya[b], at upang hindi kayo tumanggap ng alinman sa mga salot niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang utos na Griyego na Ἐξέλθατε ay nasa maramihang anyo at nangangahulugang “Lumabas kayo.” Maaari rin itong isaling “Umalis kayo,” ngunit pinananatili ng “Lumabas kayo” ang tuwirang panawagang lisanin ang Babilonia.
    reason: lexical_alternative
  - marker: b
    text: Ang Babilonia ay inilalarawan dito bilang isang babae. Hindi minamarkahan ng “kaniya/niya” ang kasarian sa Filipino, ngunit pinananatili ng personal na panghalip ang personipikasyon sa halip na gawing “nito.”
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: isa pang tinig
  rationale: Ipinahihiwatig ng ἄλλην na may karagdagang tinig na naiiba sa naunang tagapagsalita; natural at malinaw sa Filipino ang “isa pang tinig.”
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Sa kontekstong ito, ang οὐρανός ay tumutukoy sa makalangit na dako, hindi lamang sa pisikal na kalawakan.
- source_word: Ἐξέλθατε
  choice: Lumabas kayo
  rationale: Ang aorist imperative plural ay isang tuwiran at mariing utos sa maraming kausap na umalis; ang “Lumabas kayo” ay natural at hindi kailangang pumili sa deiktikong “come” o “go” ng Ingles.
- source_word: ὁ λαός μου
  choice: bayan ko
  rationale: Pinananatili nito ang kolektibo at tipanang diwa ng λαός bilang isang bayang pag-aari ng nagsasalita, habang natural bilang tuwirang tawag.
- source_word: ἐξ αὐτῆς
  choice: mula sa kaniya
  rationale: Tinutukoy ng pambabaeng panghalip ang Babilonia na inilalarawan bilang babae at lungsod. Ang “kaniya” ay panghalip para sa persona sa Filipino, bagaman hindi nito minamarkahan ang kasarian.
- source_word: ἵνα μὴ συγκοινωνήσητε
  choice: upang hindi kayo makibahagi sa
  rationale: Ang συγκοινωνέω ay tumutukoy sa pakikibahagi o pakikilahok; malinaw na ipinahahayag ng “makibahagi sa” ang pagkakaroon ng bahagi sa kasalanan.
- source_word: ταῖς ἁμαρτίαις αὐτῆς
  choice: mga kasalanan niya
  rationale: Direktang pinananatili ang moral at teolohikal na bigat ng ἁμαρτίαις at ang personal na pagtukoy sa Babilonia.
- source_word: ἐκ τῶν πληγῶν αὐτῆς
  choice: ng alinman sa mga salot niya
  rationale: Ang “alinman sa” ay natural na Filipino para sa pagtanggap ng bahagi mula sa kabuuan ng mga salot, nang hindi ipinapalagay na lahat ng salot ay tatanggapin.
- source_word: πληγῶν
  choice: mga salot
  rationale: Sa Pahayag, ang πληγή ay karaniwang tumutukoy sa mga salot bilang hatol ng Diyos at umaalingawngaw sa wika ng mga salot sa Kasulatan.
- source_word: ἵνα μὴ λάβητε
  choice: upang hindi kayo tumanggap
  rationale: Pinananatili ng “upang” ang layunin o babala ng ἵνα na may subjunctive, at ang “tumanggap” ay malapit sa karaniwang kahulugan ng λαμβάνω.
theological_decisions:
- issue: Ang pagtukoy ng αὐτῆς at ang larawan ng Babilonia
  choice: Gamitin ang personal na “kaniya/niya” sa halip na ang di-personal na “nito.”
  alternative: Gamitin ang “nito” upang idiin ang Babilonia bilang lungsod o sistema.
  rationale: Inilalarawan sa Pahayag ang Babilonia kapuwa bilang lungsod at bilang babae. Ang personal na panghalip ay nagpapanatili sa personipikasyon nang hindi nilulutas kung lungsod, babae, o sistema ang pangunahing diin.
- issue: Lakas at ugnayan ng dalawang sugnay na ἵνα
  choice: Isalin ang dalawa bilang magkatugmang sugnay na “upang hindi … at upang hindi …”
  alternative: Gamitin ang “nang hindi” o ituring ang ikalawang sugnay bilang pagpapaliwanag lamang sa una.
  rationale: Ang pag-uulit ng ἵνα sa Griyego ay nagbibigay ng dalawang magkatugmang layunin o babala; pinananatili ng pag-uulit ng “upang” ang estruktura at diin.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan ko” upang mapanatili ang kolektibo at tipanang himig ng λαός μου; inulit ang “upang” upang maipakita ang retorikal na pagkakatimbang ng dalawang babala.
