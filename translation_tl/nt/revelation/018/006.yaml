revisions:
- from: Gantihan ninyo siya gaya ng pagganti niya mismo, at gantihan ninyo siya nang doble ayon sa kanyang mga gawa[a]. Sa kopang kanyang tinimpla[b], timplahan ninyo siya ng dobleng bahagi.
  to: Gantihan ninyo siya gaya ng ginawa niya; siya rin ay gantihan ninyo nang doble[a] ayon sa kanyang mga gawa. Sa kopang tinimpla niya[b], timplahan ninyo siya ng dobleng bahagi.
  rationale: Binago ang unang sugnay upang malinaw na ang pagganti sa Babilonia ay tumutugon sa sarili niyang mga ginawa, nang hindi ipinahihiwatig na siya ay simpleng gumanti lamang sa iba. Idinagdag ang “siya rin” upang katawanin ang pagbibigay-diin ng αὐτή. Inilipat ang pananda ng talababa a sa “nang doble,” ang eksaktong pariralang pinag-uusapan ng talababa, at pinakinis ang ayos ng pariralang tungkol sa kopa.
