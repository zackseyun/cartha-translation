  source_fidelity: Ang draft ay wastong naghahatid ng mga pautos na ἀπόδοτε, διπλώσατε, at κεράσατε, pati ng dobleng ganti at larawan ng kopang hinalo. Gayunman, ang “gaya ng pagganti niya mismo” ay maaaring magpahiwatig na si Babilonia ay gumanti lamang sa naunang ginawa sa kanya, samantalang ang ἀπέδωκεν dito ay tumutukoy sa pagbibigay o pagpapataw niya ng nararapat na iganti. Mas malinaw na ipahayag ang paralelismong ito bilang “gaya ng ginawa niya.”
  naturalness: Hindi lubos na likas ang “gaya ng pagganti niya mismo.” Mas malinaw at marangal ang “gaya ng ginawa niya,” na may “siya rin” upang ipakita ang diin ng αὐτή. Mas natural din ang ayos na “kopang tinimpla niya” kaysa “kopang kanyang tinimpla.”
  terminology: Nananatiling angkop ang “gantihan,” “mga gawa,” “kopa,” at “timplahan.” Ang “dobleng bahagi” ay maayos na pagpapahayag ng διπλοῦν nang hindi ipinipilit na eksaktong matematikal ang apokaliptikong larawan.
