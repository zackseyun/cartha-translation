base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: tl
  text: Gantihan ninyo siya gaya ng ginawa niya; siya rin ay gantihan ninyo nang doble[a] ayon sa kanyang mga gawa. Sa kopang tinimpla niya[b], timplahan ninyo siya ng dobleng bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “doblehin ninyo para sa kanya ang mga bagay na doble.” Masidhi at siksik ang Griyegong pahayag at maaaring magbigay-diin sa pinatinding pagganti.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang kopang inihanda niya sa pamamagitan ng pagtitimpla; malamang na inilalarawan nito ang inihandang inumin ng paghatol.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Gantihan ninyo siya
  rationale: Ang ἀποδίδωμι rito ay tumutukoy sa pagganting ibinabalik bilang kabayaran sa ginawa. Likas sa modernong Tagalog ang “gantihan” at pinananatili nito ang diwang hudisyal at mapagkabayad, hindi lamang ang payak na “ibigay.”
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: gaya ng pagganti niya mismo
  rationale: Ipinapakita ng parirala na ang pagganti ay batay sa nauna niyang ginawa. Ang “mismo” ay kumakatawan sa pagbibigay-diin ng αὐτή.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: gantihan ninyo siya nang doble
  rationale: Masidhi at siksik ang Griyegong pahayag. Ang saling ito ay likas sa Tagalog at pinananatili ang larawan ng pinatinding, dobleng pagganti nang hindi ginagawang tiyak na matematikal na pormula.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: ayon sa kanyang mga gawa
  rationale: Tuwirang pinananatili ng “mga gawa” ang kahulugan ng ἔργα at ang himig ng paghatol na naaayon sa ginawa.
- source_word: ποτηρίῳ
  choice: kopa
  rationale: Ang “kopa” ay malinaw at marangal na katumbas ng ποτήριον, at pinananatili ang paulit-ulit na sagisag ng kopa sa Pahayag at sa mga propeta.
- source_word: ἐκέρασεν
  choice: kanyang tinimpla
  rationale: Ang κεράννυμι ay tumutukoy sa paghahalo o paghahanda ng inumin. Pinananatili ng “tinimpla” ang kongkretong larawan, sa halip na gawing pangkalahatang “inihanda.”
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: timplahan ninyo siya ng dobleng bahagi
  rationale: Inuulit nito ang pandiwa at larawan ng kopa sa Griyego. Ang “dobleng bahagi” ay natural na Tagalog para sa dobleng sukat o takal na ihahanda para sa kanya.
theological_decisions:
- issue: Kalikasan ng utos na dobleng gantihan
  choice: Isinalin bilang masidhi at hudisyal na pagganti sa sagisag na wika ng paghatol.
  alternative: Unawain ang “doble” bilang eksaktong matematikal na parusa, o pahinain ito bilang pangkalahatang katarungan lamang.
  rationale: Pinananatili ng teksto ang tindi ng dobleng pagganti at ng kopang inihahanda para sa Babilonia, ngunit hindi nito nilulutas kung ang pagdodoble ay eksaktong dami o retorikal na pagbibigay-diin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ganti,” “mga gawa,” at “kopa” upang mapanatili ang himig ng hudisyal na paghatol at ang apokaliptikong larawan, habang iniwasan ang sobrang literal ngunit alanganing pariralang “doblehin ang mga doble.”
