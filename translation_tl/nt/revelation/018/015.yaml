  source_fidelity: 'Ang pangunahing diwa at sintaksis ay maayos na nasasalamin: ang mga mangangalakal ay yumaman mula sa personipikadong Babilonia, tumatayo sila sa malayo dahil sa takot, at sila ay umiiyak at nagdadalamhati. Gayunman, ang “dahil sa kanya” ay mas malinaw na sanhi kaysa pinagmulan, samantalang ang ἀπ’ αὐτῆς ay nagmamarka ng pinagmulan. Ang “pagpapahirap” ay karaniwang tumutukoy sa pagpapahirap na ginagawa ng isang tagapagpahirap at maaaring magdagdag ng ahenteng wala sa teksto; mas tapat sa βασανισμός ang “pagdurusa” sa kontekstong ito.'
  naturalness: Natural at angkop sa modernong Filipino ang pangkalahatang rehistro. Ang “mula sa kanya” ay kapwa natural at mas tumpak kaysa “dahil sa kanya.” Ang “pagdurusa niya” ay mas idiomatiko at hindi ahentibo, samantalang pinananatili ang bigat ng hatol.
  terminology: Ang “mangangalakal,” “mga bagay na ito,” “umiiyak,” at “nagdadalamhati” ay angkop. Pinanatili ang pambabaeng panghalip para sa personipikadong lungsod/Babilonia. Ang “pagdurusa” ay piniling katumbas ng βασανισμός upang ihayag ang matinding pagdurusang dulot ng paghatol nang hindi ipinapasok ang mas makitid na diwa ng sapilitang tortyur.
  issues:
