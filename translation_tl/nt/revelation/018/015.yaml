  to: Ang mga mangangalakal ng mga bagay na ito[a], na yumaman mula sa kanya, ay tatayo sa malayo dahil sa takot sa kanyang pagdurusa, umiiyak at nagdadalamhati.
  rationale: Pinalitan ang panandang sanhi ng panandang pinagmulan sa “yumaman mula sa kanya,” alinsunod sa ἀπ’ αὐτῆς. Pinalitan din ang “pagpapahirap” ng “pagdurusa” upang mas tapat na maisalin ang βασανισμός bilang matinding torment sa paghatol nang hindi nagdaragdag ng isang tagapagpahirap. Walang binago sa sanggunian ng talababa o sa saklaw ng “mga bagay na ito.”
