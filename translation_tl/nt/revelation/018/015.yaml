id: REV.18.15
reference: Revelation 18:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: tl
  text: Ang mga mangangalakal ng mga bagay na ito[a], na yumaman mula sa kanya, ay tatayo sa malayo dahil sa takot sa kanyang pagdurusa, umiiyak at nagdadalamhati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ng mga kalakal na ito” o “ng mga panindang ito”; tumutukoy ang parirala sa mga mamahaling bagay na nakalista sa nakapaligid na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: mga mangangalakal
  rationale: Likas at tiyak na tawag sa mga taong nangangalakal, at angkop sa konteksto ng kalakalan at paghatol.
- source_word: τούτων
  choice: ng mga bagay na ito
  rationale: Pinananatili ang panghalip na tumutukoy pabalik sa mga mamahaling kalakal na nakalista sa konteksto, nang hindi ito ginagawang mas tiyak kaysa sa Griyego.
- source_word: πλουτήσαντες ἀπ’ αὐτῆς
  choice: na yumaman dahil sa kanya
  rationale: Ipinapahayag ang naunang pagyaman ng mga mangangalakal at na siya ang pinagmulan o naging dahilan ng kanilang kayamanan; mas natural ito sa Filipino kaysa sa literal na 'mula sa kanya.'
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: ay tatayo sa malayo
  rationale: Malinaw na inilalarawan ang sadyang pananatili nila sa malayong lugar habang pinagmamasdan ang pangyayari.
- source_word: διὰ τὸν φόβον
  choice: dahil sa takot
  rationale: Pinananatili ang tahasang ugnayang sanhi na ipinahihiwatig ng διά na may accusative.
- source_word: βασανισμοῦ
  choice: pagpapahirap
  rationale: Ipinapanatili ang tindi ng matinding pagdurusang kaugnay ng paghatol, nang hindi nililimitahan sa makabagong teknikal na diwa ng tortyur.
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: habang umiiyak at nagdadalamhati
  rationale: Pinananatiling magkahiwalay ang hayag na pag-iyak at ang pagluluksa o matinding dalamhati.
theological_decisions:
- issue: Kalikasan ng βασανισμός sa apokaliptikong wika ng paghatol
  choice: Isinalin bilang 'pagpapahirap,' na nagpapahiwatig ng matinding pagdurusa.
  alternative: kaparusahan; paghihirap
  rationale: Ang konteksto ay ang paghatol sa Babilonia, at hindi dapat palambutin ang salita bilang emosyonal o pangkabuhayang pagkabalisa lamang. Gayunman, hindi pinalalawak ng salin ang talata tungo sa isang detalyadong doktrina ng pangwakas na kaparusahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'mangangalakal' para sa pormal ngunit karaniwang biblikal na rehistro; pinanatili ang pambabaeng panghalip dahil personipikado ang Babilonia sa konteksto.
