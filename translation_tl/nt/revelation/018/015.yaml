    rationale: Ang ἀπό ay pangunahing nagsasaad ng pinagmulan; “mula sa kanya” ang tuwirang katumbas at pinananatili ang ugnayang pangkabuhayan sa personipikadong Babilonia.
  - severity: medium
    issue: Ang “pagpapahirap” para sa βασανισμός ay may karaniwang ahentibong diwa sa Filipino.
    rationale: Maaaring magpahiwatig ito na may isang tahasang nagpapahirap, samantalang ang teksto ay tumutukoy sa pagdurusa/torment ng babae. “Pagdurusa” ay mas malawak, natural, at hindi nagdaragdag ng ahente.
