id: REV.18.14
reference: Revelation 18:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: tl
  text: At ang hinog na bungang pinananabikan ng iyong kaluluwa ay nawala na sa iyo[a], at ang lahat ng mararangya at mariringal na bagay ay naglaho na sa iyo, at hindi na kailanman matatagpuan ang mga iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang hinog na bunga ng pananabik ng iyong kaluluwa.”'
    reason: lexical_alternative
  - marker: b
    text: O “at hindi na nila kailanman matatagpuan ang mga iyon”; hindi tahasang tinukoy sa Griyego ang simuno ng pandiwang nasa ikatlong panauhang maramihan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: hinog na bunga
  rationale: Tumutukoy ang salita sa bunga, lalo na sa hinog o panghuling-panahong bunga. Pinananatili ng salin ang kongkretong larawan at ang kaugnayan nito sa mga kalakal na marangya.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: pinananabikan ng iyong kaluluwa
  rationale: Likas sa modernong Tagalog ang pandiwang ayos, habang pinananatili ang ψυχή at ang matinding panloob na paghahangad na ipinahihiwatig ng ἐπιθυμία.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: nawala na sa iyo
  rationale: Ipinapahayag nito ang paglayo at kasalukuyang bunga ng pagkawala nang hindi nagiging matigas o makaluma ang Tagalog.
- source_word: πάντα τὰ λιπαρὰ
  choice: lahat ng mararangyang bagay
  rationale: Sa konteksto ng kalakalan at luho, mas malawak ito kaysa matatabang pagkain at tumutukoy sa mayaman at marangyang mga ari-arian.
- source_word: τὰ λαμπρὰ
  choice: mariringal na bagay
  rationale: Ipinahihiwatig ng λαμπρά ang maningning, kahanga-hanga, at magarbong karangyaan; ang 'mariringal' ay angkop sa marangal na himig ng panaghoy.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: naglaho na sa iyo
  rationale: Sinasalamin nito ang ganap at di-na-mababalik na pagkawala sa likas na Tagalog.
- source_word: οὐκέτι οὐ μὴ
  choice: hindi na kailanman
  rationale: Inihahatid nito ang mariing pangwakas na pagtanggi ng pinagsamang mga katagang Griyego.
- source_word: αὐτὰ εὑρήσουσιν
  choice: matatagpuan ang mga iyon
  rationale: Walang tahasang simuno ang ikatlong panauhang maramihan sa Griyego. Ang di-tiyak at parang-balintiyak na Tagalog ay hindi nagdaragdag ng partikular na gumagawa.
theological_decisions:
- issue: Di-tiyak na simuno ng εὑρήσουσιν
  choice: 'Isinalin sa paraang di-tiyak: ''matatagpuan ang mga iyon'''
  alternative: '''hindi na nila kailanman matatagpuan ang mga iyon'''
  rationale: Pinananatili ng pangunahing salin ang kawalan ng tahasang simuno at ang diin sa ganap na pagkawala, samantalang inilalahad sa talababa ang literal na aktibong anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kaluluwa' upang mapanatili ang matinding panloob na pananabik, at 'mararangya at mariringal' upang maipakita ang dalawang magkaugnay ngunit di-magkaparehong paglalarawan sa mga luho.
