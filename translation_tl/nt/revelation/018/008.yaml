id: REV.18.8
reference: Revelation 18:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: tl
  text: 'Dahil dito, sa isang araw ay darating sa kanya ang mga salot: kamatayan, pagluluksa, at taggutom; at lubusan siyang susunugin sa apoy, sapagkat makapangyarihan ang Panginoong Diyos na humatol sa kanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: sa loob ng isang araw
  rationale: Likas sa modernong Tagalog at pinananatili ang biglaan at siksik na takdang panahong ipinahihiwatig ng Griyego.
- source_word: πληγαὶ
  choice: mga salot
  rationale: Ang “mga salot” ay angkop sa konteksto ng banal na paghatol at umaalingawngaw sa bokabularyo ng Apocalipsis.
- source_word: πένθος
  choice: pagluluksa
  rationale: Tumutukoy sa kalagayan o gawain ng pagdadalamhati, hindi lamang sa panloob na lungkot.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: lubusan siyang susunugin
  rationale: Ipinahahayag ng “lubusan” ang masidhing diwa ng κατακαίω; ang apoy ay likas nang nakapaloob sa “susunugin,” kaya hindi na kailangan ang paulit na “sa apoy.”
- source_word: ἰσχυρὸς
  choice: makapangyarihan
  rationale: Sa paglalarawan sa Diyos na nagpapatupad ng hatol, mas natural at kontekstuwal ito kaysa sa literal ngunit alanganing “malakas.”
- source_word: ὁ κρίνας αὐτήν
  choice: na humatol sa kanya
  rationale: Pinananatili ang aorist participle bilang naganap na paghatol nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Ugnayan ng lakas ng Diyos at ng paghatol
  choice: sapagkat makapangyarihan ang Panginoong Diyos na humatol sa kanya
  alternative: sapagkat makapangyarihan ang Panginoong Diyos na humahatol sa kanya
  rationale: Pinananatili ng “humatol” ang aspektong aorist ng κρίνας at inilalahad ang kapangyarihan ng Diyos bilang batayan ng tiyak na kaparusahan, nang hindi ginagawang pangkalahatang pahayag ang participle.
- issue: Pagkakakilanlan ng hinahatulang babae/lungsod
  choice: sa kanya
  alternative: sa kaniya / sa Babilonia
  rationale: Hindi ipinapasok sa talata ang pangalang wala sa mismong pangungusap; pinananatili ang pambabaeng panghalip at ang kaugnayan nito sa naunang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kanya” ayon sa kasalukuyang ortograpiya at iniwasan ang sobrang literal na ayos na magiging di-likas sa Tagalog.
