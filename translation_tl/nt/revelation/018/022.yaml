id: REV.18.22
reference: Revelation 18:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: tl
  text: At ang tunog ng mga manunugtog ng alpa, mga musikero, mga manunugtog ng plauta, at mga manunugtog ng trumpeta ay hindi na kailanman maririnig sa iyo[a], at walang manggagawang may anumang uri ng kasanayan ang matatagpuan sa iyo, at ang tunog ng gilingan ay hindi na kailanman maririnig sa iyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga manunugtog ng plawta” o “mga piper.” Ang “plauta” rito ay tumutukoy sa sinaunang αὐλός, isang instrumentong hinihipan na hindi lubos na katulad ng modernong plauta.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tunog ng batong panggiling.” Maaaring tumukoy ang salitang Griyego sa gilingan o, nang mas tiyak, sa batong ginagamit sa paggiling.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: tunog / ugong
  rationale: Ang φωνή ay tumutukoy rito sa naririnig na tunog, hindi sa tinig na nagsasalita. Ginamit ang “tunog” para sa musika at ang mas likas na “ugong” para sa gilingan, habang nananatili ang larawan ng lungsod na tuluyang tumahimik.
- source_word: κιθαρῳδῶν
  choice: mga manunugtog ng alpa
  rationale: Tumutukoy ang salita sa mga tagapagtanghal na gumagamit ng kithara. Ang “alpa” ay madaling maunawaan sa modernong Filipino bilang sinaunang instrumentong de-kuwerdas, nang hindi gumagamit ng di-pamilyar na transliterasyon.
- source_word: μουσικῶν
  choice: mga musikero
  rationale: Malawak ang saklaw ng salita at maaaring tumukoy sa mga gumagawa o nagtatanghal ng musika. Ang “mga musikero” ang pinakanatural at malawak na katumbas sa Filipino.
- source_word: αὐλητῶν
  choice: mga manunugtog ng plauta
  rationale: Ang αὐλητής ay tumutugtog ng αὐλός. Malinaw sa karaniwang mambabasa ang “plauta,” ngunit nililinaw sa talababa na hindi lubos na katulad ng modernong plauta ang sinaunang instrumento.
- source_word: σαλπιστῶν
  choice: mga manunugtog ng trumpeta
  rationale: Direkta, malinaw, at natural na paglalarawan ito sa mga tumutunog ng trumpeta.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: hindi na kailanman maririnig
  rationale: Ang οὐ μή kasama ng aorist subjunctive ay mariing pagtanggi, at idinaragdag ng ἔτι ang diwa ng hindi na muling pag-iral. Naipahahayag ng “hindi na kailanman” ang ganap at pangwakas na pagkawala.
- source_word: ἐν σοὶ
  choice: sa iyo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap sa Babilonia na inilalarawan bilang isang persona at lungsod.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: sinumang bihasa sa anumang hanapbuhay
  rationale: Pinananatili nito ang komprehensibong diwa ng parirala at likas itong mabasa sa modernong Filipino. Ang “hanapbuhay” ay sumasaklaw sa praktikal na gawain o kasanayan, bagaman maaaring mas tiyak na isalin bilang “likhang-kamay.”
- source_word: οὐ μὴ εὑρεθῇ
  choice: wala nang ... matatagpuan
  rationale: Ipinahahayag nito nang natural sa Filipino ang mariing kawalan na nasa οὐ μή, kasabay ng pangwakas na diwa ng ἔτι.
- source_word: μύλου
  choice: gilingan
  rationale: Maaaring tumukoy ang μύλος sa gilingan o mas tiyak sa batong panggiling. Ang “gilingan” ay natural at napapanatili ang mas malawak na larawan ng pang-araw-araw na paggiling.
theological_decisions:
- issue: Larawan ng paghatol sa Babilonia
  choice: Panatilihin ang tatlong kongkretong pahayag tungkol sa ganap na pagkawala ng musika, bihasang paggawa, at pang-araw-araw na paggiling.
  alternative: Ituring ang mga bagay na ito bilang palamuti lamang o tahasang ipaliwanag ang bawat isa bilang isang tiyak na simbolo.
  rationale: Ang paulit-ulit na οὐ μή ... ἔτι ay nagpapahiwatig ng ganap at di-na-mababaligtad na pagkawasak. Pinananatili ng salin ang konkretong larawan at bigat nito nang hindi nagpapataw ng labis na alegorikong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang tuwirang “sa iyo” at ang paulit-ulit na pangwakas na pormula. Gumamit ng mga karaniwang katawagang “musikero,” “plauta,” at “trumpeta”; iniwasan ang teknikal na transliterasyon. Ang “ugong ng gilingan” ay pinili bilang likas at madulang paglalarawan sa tunog ng pang-araw-araw na paggawa.
