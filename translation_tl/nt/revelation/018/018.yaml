base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: tl
  text: Sumigaw sila habang nakikita nila ang usok ng pagkasunog niya, “Anong lungsod ang katulad ng dakilang lungsod?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, eliptikal ang tanong at maaaring mas literal na isaling, “Ano ang katulad ng dakilang lungsod?” Idinagdag sa salin ang “lungsod” upang luminaw kung ano ang inihahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: sumigaw sila
  rationale: Ipinahahayag ng pandiwa ang malakas na pagsigaw; tuwiran at natural ang “sumigaw sila” sa makabagong Tagalog.
- source_word: βλέποντες
  choice: Nang makita nila
  rationale: Ang kasalukuyang participle ay kasabay ng pangunahing kilos. Likas na ipinahahayag sa Tagalog ng “nang makita nila” ang ugnayang temporal.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: ang usok ng pagkasunog niya
  rationale: Pinananatili ng “pagkasunog” ang diwa ng proseso o kalagayan ng pagliyab, at ng “niya” ang personipikasyon sa lungsod nang hindi nagdaragdag ng paliwanag.
- source_word: λέγοντες
  choice: sumigaw sila, “…”
  rationale: Sa natural na Tagalog, ang nilalaman ng participleng “sinasabi” ay malinaw na naihahatid bilang tuwirang sipi kasunod ng “sumigaw sila,” kaya hindi na kailangan ang mabigat na “na sinasabi.”
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Anong lungsod ang katulad ng dakilang lungsod?
  rationale: Ang tanong sa Griyego ay eliptikal at walang hayag na pandiwang copula. Ang “Anong lungsod” ay likas na Tagalog na nagpapalinaw sa inihahambing, samantalang hindi nito ipinapasok ang panahong “noon” o “ngayon.”
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: ng dakilang lungsod
  rationale: Tuwirang pinananatili ang tiyak at kilalang bansag na “ang dakilang lungsod” sa konteksto.
theological_decisions:
- issue: Personipikasyon sa Babilonia/lungsod
  choice: Gamitin ang “niya” sa pagtukoy sa lungsod
  alternative: Gamitin ang “nito”
  rationale: Patuloy na inilalarawan sa Pahayag ang Babilonia bilang isang babae at lungsod. Pinananatili ng “niya” ang pampanitikan at teolohikal na personipikasyon nang hindi tinutukoy ang kasarian, yamang walang gramatikal na gender ang panghalip sa Tagalog.
- issue: Panahunan ng eliptikal na tanong
  choice: Huwag magdagdag ng tahasang “ay/noon/ngayon”
  alternative: “Anong lungsod noon ang katulad…” o “Anong lungsod ngayon ang katulad…”
  rationale: Walang hayag na copula sa Griyego, kaya tunay na hindi tiyak ang panahunan. Natural sa Tagalog ang verbless comparison at napapanatili nito ang ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maikling ayos na pangungusap at tuwirang sipi upang mapanatili ang lakas ng panaghoy, habang iniingatan ang personipikasyon at ang kawalan ng tahasang panahunan sa tanong.
