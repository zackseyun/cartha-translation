  source_fidelity: 'Tumpak ang karamihan ng talaan ng kalakal: ang “kanela,” “mamahaling pampalasa,” “insenso,” “pabango,” “kamanyang,” “langis ng olibo,” “pinong harina,” “trigo,” “mga baka at mga tupa,” at “mga karwahe” ay angkop sa Griyego. Ang “mga katawan at mga kaluluwa ng tao” ay pinananatili ang literal at sinadyang mapanghamak na pagbanggit sa mga taong ginawang kalakal.'
  naturalness: Natural at marangal ang Filipino. Mas maayos na walang kuwit sa pagitan ng magkakaugnay na “mga katawan at mga kaluluwa ng tao,” at mas tuwiran ang pang-isahang “tao” bilang katumbas ng pangkalahatang genitibong “ng mga tao” sa ganitong parirala.
  terminology: Ang “kamanyang” ay wastong tiyak na katawagan para sa λίβανον at nararapat na manatiling bukod sa “insenso.” Ang “mga karwahe” ay mas angkop kaysa “mga karwaheng pandigma/chariots” para sa ῥεδῶν. Ang talababa para sa huling parirala ay dapat magpaliwanag ng komersiyal na diwa nang hindi nagmumungkahi na ang ψυχὰς ay isang hiwalay na leksikal na salin na “mga buhay.”
