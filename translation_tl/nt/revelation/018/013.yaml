id: REV.18.13
reference: Revelation 18:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: tl
  text: at kanela, mamahaling pampalasa[a], insenso, pabango, kamanyang, alak, langis ng olibo, pinong harina, trigo, mga baka at mga tupa, mga kabayo at mga karwahe, mga katawan at mga kaluluwa ng tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “amomum,” isang mamahaling halamang mabango na ginagamit bilang pampalasa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga katawan at mga kaluluwa ng tao.” Sa kontekstong ito, tumutukoy ang parirala sa mga taong ipinagbibili bilang alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: kanela
  rationale: Ito ang karaniwan at malinaw na katawagan sa modernong Filipino para sa imported na mabangong sangkap na cinnamon.
- source_word: ἄμωμον
  choice: mamahaling pampalasa
  rationale: Tumutukoy ito sa isang mamahaling halamang mabango, na tradisyonal na tinatawag na amomum. Mas nauunawaan ang pangkalahatang salin, habang inilalagay sa talababa ang posibleng tiyak na pagkakakilanlan.
- source_word: θυμιάματα
  choice: insenso
  rationale: Sa listahang pangkalakalan, tumutukoy ito sa sangkap na sinusunog bilang insenso, hindi sa mismong gawa ng paghahandog.
- source_word: μύρον
  choice: pabango
  rationale: Tumutukoy sa mamahaling mabangong langis o pamahid; natural at malinaw sa Filipino ang “pabango” sa listahan ng mga luho.
- source_word: λίβανον
  choice: kamanyang
  rationale: Ito ang tiyak na mabangong dagta na frankincense, kaya pinananatili itong iba sa mas pangkalahatang “insenso.”
- source_word: ἔλαιον
  choice: langis ng olibo
  rationale: Ginagawang tiyak ang uri ng langis na karaniwang tinutukoy sa kontekstong ito.
- source_word: σεμίδαλιν
  choice: pinong harina
  rationale: Ipinapahayag nito ang mataas na uri o pinong kalidad ng harina.
- source_word: σῖτον
  choice: trigo
  rationale: Bagaman maaari itong mangahulugang butil sa pangkalahatan, trigo ang karaniwang tiyak na kahulugan sa ganitong talaan ng kalakal.
- source_word: κτήνη
  choice: mga baka
  rationale: Tumutukoy sa malalaking alagang hayop; pinananatili ng “mga baka” ang pagkakaiba nito sa kasunod na “mga tupa.”
- source_word: πρόβατα
  choice: mga tupa
  rationale: Tuwirang katumbas ng salitang Griyego.
- source_word: ῥεδῶν
  choice: mga karwahe
  rationale: Tumutukoy sa mga sasakyang may apat na gulong, malamang na mamahaling karwahe sa kontekstong Romano, hindi pangunahing mga karwaheng pandigma.
- source_word: σωμάτων
  choice: mga katawan
  rationale: Pinananatili ang literal at nakakagimbal na paglalarawan sa mga taong ginawang paninda; ipinaliliwanag sa talababa ang kaugnayan nito sa pang-aalipin.
- source_word: ψυχὰς ἀνθρώπων
  choice: mga kaluluwa ng mga tao
  rationale: Pinananatili ang literal na retorika at ang ugnayan nito sa “mga katawan,” nang hindi tahimik na nilulutas kung ito ay nangangahulugang mga tao, buhay, o kaluluwa sa puntong ito.
theological_decisions:
- issue: Pagpapakahulugan sa σωμάτων καὶ ψυχὰς ἀνθρώπων
  choice: mga katawan, at mga kaluluwa ng mga tao
  alternative: mga alipin—mga buhay ng tao
  rationale: Pinananatili ng pangunahing teksto ang kapansin-pansing literal na pananalita at ang tensiyon ng “katawan” at “kaluluwa.” Nililinaw ng talababa na sa kontekstong pangkalakalan ay mga taong ipinagbibili bilang alipin ang tinutukoy, nang hindi pinapawi ang retorika ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “karwahe” para sa sasakyang pangluho at pinanatili ang literal na “mga katawan” at “mga kaluluwa” upang hindi mawala ang matinding larawan ng pagkakalakal sa tao.
