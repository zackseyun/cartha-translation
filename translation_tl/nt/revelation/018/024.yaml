id: REV.18.24
reference: Revelation 18:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: tl
  text: At sa kanya[c] natagpuan ang dugo ng mga propeta at ng mga banal[a], at ng lahat ng pinaslang[b] sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taong banal” o “banal na bayan ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng pinatay sa lupa.” Ang pandiwang Griyego ay mas mariin kaysa sa karaniwang salita para sa pagpatay at maaaring mangahulugang marahas na pagpaslang.
    reason: lexical_alternative
  - marker: c
    text: Ang “kanya” ay tumutukoy sa Babilonia, na inilalarawan bilang isang babae sa nakapaligid na pangitain.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: sa kanya
  rationale: Ang panghalip na pambabae ay tumutukoy sa Babilonia, na inilalarawan bilang isang babae sa pangitain. Pinananatili ng “sa kanya” ang personipikasyong ito.
- source_word: αἷμα
  choice: dugo
  rationale: Tuwirang katumbas ito ng salitang Griyego at pinananatili rin ang pahiwatig ng pananagutan sa pagdanak ng dugo.
- source_word: προφητῶν
  choice: mga propeta
  rationale: Karaniwan at malinaw na salin ng προφῆται sa kontekstong biblikal.
- source_word: ἁγίων
  choice: mga banal
  rationale: Tumutukoy ito sa mga taong ibinukod para sa Diyos. Ang “mga banal” ay maikli, likas sa wikang biblikal, at hindi nagdaragdag ng denominasyonal na pakahulugan.
- source_word: εὑρέθη
  choice: natagpuan
  rationale: Pinananatili nito ang anyong balintiyak at ang diwa ng pagbubunyag o pagkakatuklas sa kasalanan ng Babilonia.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: lahat ng pinaslang
  rationale: Mas marahas ang σφάζω kaysa sa pangkalahatang “patayin.” Ang “pinaslang” ay natural sa Tagalog at nagpapahayag ng marahas na pagkitil ng buhay nang hindi nagpapasok ng dagdag na paliwanag.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Sa Apocalipsis, ang γῆ ay karaniwang tumutukoy sa buong lupa o daigdig. Ang “sa lupa” ay natural at nananatiling malawak ang saklaw.
theological_decisions:
- issue: Ang tinutukoy at lawak ng pananagutan ng Babilonia
  choice: Pinananatili ang malawak na paratang na sa Babilonia natagpuan ang dugo ng mga propeta, ng mga banal, at ng lahat ng pinaslang sa lupa.
  alternative: Maaaring unawain ang huling parirala bilang matinding apokaliptikong paglalarawan sa lahat ng pagdanak ng dugo na kinakatawan ng Babilonia, o bilang pangkalahatang pananagutan sa loob ng simbolikong pangitain.
  rationale: Hindi nililinaw ng tekstong Griyego kung paano eksaktong tumutugma sa kasaysayan ang malawak na simbolikong paratang. Kaya hindi ito nililimitahan o ipinapaliwanag nang lampas sa sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pambabaeng personipikasyon ng Babilonia, ang marahas na diin ng “pinaslang,” at ang malawak na saklaw ng paratang nang hindi nilulutas ang sadyang tensiyong teolohikal.
