    issue: Ang “nagbuhos sila ng alabok” ay hindi ang pinakatumpak na kilos para sa ἔβαλον χοῦν.
    rationale: Ang ἔβαλον ay “naghagis” o “itinapon”; ang “naghagis ng alikabok sa kanilang mga ulo” ay parehong tapat sa larawan at natural sa Filipino.
  - severity: medium
    issue: Ang “Ngunit” ay hindi tumutugma sa ὅτι.
    rationale: 'Ipinakikilala ng ὅτι ang dahilan ng kanilang sigaw ng panaghoy: ang lungsod ay biglang nalagay sa pagkatiwangwang. “Sapagkat” ang wastong pang-ugnay.'
  - severity: medium
    issue: Ang “nawasak siya” ay hindi ganap na naihahayag ang passive na ἠρημώθη at ang diwa ng pagkatigang/pagkatiwangwang.
    rationale: Ang “ginawang tiwangwang” ay nagpapanatili ng passive na anyo at ng mas tiyak na kahulugang desolated, nang hindi tinutukoy ang gumawang ahente.
