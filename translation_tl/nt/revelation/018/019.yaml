id: REV.18.19
reference: Revelation 18:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: tl
  text: At naghagis sila ng alikabok sa kanilang mga ulo at sumigaw habang umiiyak at nagdadalamhati, na nagsasabi, “Sa aba! Sa aba ng dakilang lungsod, na siyang nagpayaman sa lahat ng may mga barko sa dagat dahil sa kaniyang kayamanan[a], sapagkat sa loob lamang ng isang oras ay ginawa siyang tiwangwang!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kaniyang mamahaling karangyaan” o “dahil sa kaniyang karilagan.” Ang salitang Griyego ay maaaring tumukoy sa pagiging mahalaga o mamahalin, karangyaan, o kayamanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: nagbuhos sila ng alabok sa kanilang mga ulo
  rationale: Pinananatili ang larawan ng kinaugaliang kilos ng pagluluksa; natural sa modernong Filipino ang “nagbuhos ng alabok” para sa paghahagis o paglalagay nito sa ulo.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: sumigaw habang umiiyak at nagdadalamhati
  rationale: Ipinakikita ng “sumigaw” ang lakas ng tinig, samantalang pinananatiling magkaiba ang pag-iyak at ang mas malawak na pagdadalamhati.
- source_word: Οὐαὶ οὐαί
  choice: Kahabag-habag! Kahabag-habag
  rationale: Isang natural ngunit maringal na sigaw ng dalamhati at kapahamakan sa Filipino; pinananatili ng pag-uulit ang diin ng Griyego.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: ang dakilang lungsod
  rationale: Malapit sa anyo ng Griyego at angkop sa maringal na rehistro ng Apocalipsis.
- source_word: ἐν ᾗ ἐπλούτησαν
  choice: Dahil sa kaniya ... ay yumaman
  rationale: Ipinahahayag nang natural ang instrumental o kaugnayang diwa ng ἐν ᾗ sa kontekstong pangkalakalan, nang hindi ipinapalagay na literal na sa loob lamang ng lungsod naganap ang pagyaman.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: ang lahat ng may mga barko sa dagat
  rationale: Malapit sa participial phrase at hindi labis na tinutukoy kung pagmamay-ari o pamamahala ang ibig sabihin ng ἔχοντες.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: sa kaniyang kayamanan
  rationale: Sa komersiyal na konteksto, malinaw na naihahatid ng “kayamanan” ang halaga at kasaganaang pinagmulan ng pakinabang, habang itinatala sa talababa ang iba pang posibleng nuance.
- source_word: μιᾷ ὥρᾳ
  choice: sa loob lamang ng isang oras
  rationale: Pinananatili ang apokaliptikong diin sa biglaan at mabilis na pagkawasak; ang “lamang” ay ipinahihiwatig ng idiomatikong diin ng parirala sa konteksto.
- source_word: ἠρημώθη
  choice: nawasak siya
  rationale: Maikli, malinaw, at natural na pagpapahayag ng naging kalagayan ng lungsod; ang personipikasyong pambabae ay pinananatili sa “siya.”
theological_decisions:
- issue: Ang sigaw na Οὐαὶ οὐαί bilang kapuwa panaghoy at pahayag ng paghatol
  choice: Kahabag-habag! Kahabag-habag
  alternative: Sa aba! Sa aba!
  rationale: Ang “kahabag-habag” ay malinaw na naghahatid ng matinding panaghoy at kapahamakan sa kasalukuyang Filipino. Posible ang “Sa aba,” na mas lantad ang himig-propetiko, ngunit maaari itong marinig bilang tuwirang banta; hindi nilulutas ng salin ang tensiyon sa pagitan ng pagluluksa at paghatol.
- issue: Ang ugnayan ng lungsod sa pagyaman ng mga may barko sa ἐν ᾗ
  choice: Dahil sa kaniya ... ay yumaman
  alternative: Sa kaniya ... yumaman
  rationale: Pinananatili ang lungsod bilang pinagmulan o paraan ng kanilang pagyaman sa komersiyal na panaghoy, nang hindi nagdaragdag ng partikular na teolohikong paliwanag tungkol sa kaniyang sistemang pangkabuhayan.
translation_notes:
  register: Modernong Filipino Tagalog na maringal ngunit madaling maunawaan. Ginamit ang maiikling padamdam upang maging natural ang malakas na panaghoy. Ang “kaniya” at “siya” ay nagpapanatili sa personipikasyon ng dakilang lungsod. Lumilitaw sa pangunahing teksto ang nag-iisang marker na [a].
