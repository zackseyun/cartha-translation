revisions:
- from: At nagbuhos sila ng alabok sa kanilang mga ulo at sumigaw habang umiiyak at nagdadalamhati. Sinabi nila, “Kahabag-habag! Kahabag-habag ang dakilang lungsod! Dahil sa kaniyang kayamanan[a] ay yumaman ang lahat ng may mga barko sa dagat. Ngunit sa loob lamang ng isang oras ay nawasak siya!”
  to: At naghagis sila ng alikabok sa kanilang mga ulo at sumigaw habang umiiyak at nagdadalamhati, na nagsasabi, “Sa aba! Sa aba ng dakilang lungsod, na siyang nagpayaman sa lahat ng may mga barko sa dagat dahil sa kaniyang kayamanan[a], sapagkat sa loob lamang ng isang oras ay ginawa siyang tiwangwang!”
  rationale: Pinalitan ang pandiwa para sa paghahagis ng alikabok, ibinalik ang tahasang introduksiyon sa sinasabi nilang panaghoy, ginawang “Sapagkat” ang pang-ugnay ng dahilan, at isinalin ang passive na pagkatiwangwang ng lungsod. Hindi binago ang saklaw ng “lahat ng may mga barko sa dagat” o ang komersiyal na diwa ng kanilang pagyaman.
