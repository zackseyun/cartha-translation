revisions:
- from: At ang mga hari sa lupa na nakiapid at nagpakasasa sa karangyaan kasama niya ay iiyak at hahagulgol dahil sa kanya[a] kapag nakita nila ang usok mula sa pagkasunog sa kanya.[b]
