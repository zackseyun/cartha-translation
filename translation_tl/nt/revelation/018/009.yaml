id: REV.18.9
reference: Revelation 18:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: tl
  text: At ang mga hari sa lupa na nakiapid sa kanya[b] at nagpakasasa sa karangyaan kasama niya ay iiyak at mananaghoy[a] para sa kanya kapag nakita nila ang usok ng kanyang pagkasunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hahampasin ang kanilang dibdib”; ipinahihiwatig ng pandiwang Griyego ang hayag at marubdob na pagluluksa.
    reason: lexical_alternative
  - marker: b
    text: Ang “nakiapid sa kanya” ay malamang na bahagi ng paulit-ulit na larawan sa Apocalipsis para sa tiwali at maka-idolong pakikipag-ugnayan, ngunit pinananatili nito ang seksuwal na larawan ng Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: iiyak
  rationale: Ipinahahayag ng κλαίω ang hayag at madamdaming pag-iyak; natural at malinaw ang “iiyak” sa modernong Filipino.
- source_word: κόψονται
  choice: hahagulgol
  rationale: Sa idyomang ito, tumutukoy ang κόπτω sa marubdob at hayag na pagluluksa, hindi pangunahin sa literal na pananakit sa sarili. Ipinapakita ng “hahagulgol” ang matinding panaghoy at naiiba ito sa naunang “iiyak.”
- source_word: ἐπ’ αὐτὴν
  choice: dahil sa kanya
  rationale: Sa mga pandiwa ng pagluluksa, maaaring tukuyin ng ἐπί + accusative ang taong pinagluluksa. Natural sa Filipino ang “dahil sa kanya” at hindi nito ipinahihiwatig na nakatayo sila sa ibabaw niya.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ang mga hari sa lupa
  rationale: Karaniwang apokaliptikong pananalita ito para sa mga tagapamahala ng daigdig; pinananatili ng “sa lupa” ang malawak na saklaw.
- source_word: μετ’ αὐτῆς
  choice: kasama niya
  rationale: Tuwirang ipinapahayag ang pakikisama o pakikibahagi at natural na maiuugnay sa dalawang magkaugnay na participle.
- source_word: πορνεύσαντες
  choice: nakiapid
  rationale: Pinananatili ng “nakiapid” ang seksuwalisadong larawan ng Griyego at ang posibleng metaporikal na diwa nito sa Apocalipsis, sa halip na paliitin ito sa abstraktong “gumawa ng kasamaan.”
- source_word: στρηνιάσαντες
  choice: nagpakasasa sa karangyaan
  rationale: Saklaw ng στρηνιάω ang marangya, mapagmalabis, at mapagpalayaw-sa-sariling pamumuhay. Mas malinaw ang “nagpakasasa sa karangyaan” kaysa simpleng “namuhay nang marangya.”
- source_word: ὅταν βλέπωσιν
  choice: kapag nakita nila
  rationale: Ang ὅταν na may present subjunctive ay nagpapahayag dito ng pangyayaring inaasahan sa hinaharap; natural itong isalin na “kapag nakita nila.”
- source_word: τὸν καπνὸν
  choice: ang usok
  rationale: Tuwirang katumbas at malinaw sa konteksto.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: mula sa pagkasunog sa kanya
  rationale: Ang πύρωσις ay tumutukoy sa pagkasunog o proseso ng pagsunog. Pinananatili ng salin ang larawan nang hindi nagdaragdag ng mas tiyak na interpretasyon gaya ng “pagpapahirap sa apoy.”
theological_decisions:
- issue: Ang diwa ng pakikiapid ng Babilonia
  choice: Panatilihin sa pangunahing teksto ang tahasang larawang seksuwal na “nakiapid,” habang kinikilala sa talababa ang metaporikal na puwersa nito.
  alternative: Isalin nang abstrakto bilang “nakipag-alyansa nang tiwali” o “nagtaksil kasama niya.”
  rationale: Madalas gamitin ng Apocalipsis ang pakikiapid bilang larawan ng idolatriya at tiwaling pakikipag-ugnayan. Ang pagpapanatili sa seksuwal na salita ay hindi tahimik na nagpapasya kung literal lamang o metaporikal lamang ang ibig sabihin.
- issue: Kahulugan ng κόψονται
  choice: Isalin ang diwa ng marubdob na pagluluksa bilang “hahagulgol.”
  alternative: “hahampasin ang kanilang dibdib” o “mananaghoy”
  rationale: Sa konteksto, idyoma ito ng hayag na pagluluksa. Maaaring maging mapanlinlang ang sobrang literal na salin na para bang pananakit sa sarili ang pangunahing diin.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “nakiapid” upang mapanatili ang matalas na propetikong larawan, at “nagpakasasa sa karangyaan” upang maipahayag ang mapagmalabis na pamumuhay. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
