  source_fidelity: Kailangang ipahayag nang hayagan ang kaugnayang “sa/kasama niya” sa pakikiapid, sapagkat ang μετ’ αὐτῆς ay sumasaklaw sa parehong participle. Ang “dahil sa kanya” ay maaaring mangahulugang sanhi lamang, samantalang ang ἐπ’ αὐτήν ay tumutukoy sa siya ang pinagluluksa. Ang “usok ng kanyang pagkasunog” ay mas tuwirang katumbas ng τὸν καπνὸν τῆς πυρώσεως αὐτῆς.
  naturalness: Mas natural at malinaw ang “mananaghoy para sa kanya” para sa ikalawang pandiwa ng pagluluksa. Ang “hahagulgol” ay posible ngunit mas makitid na tumutukoy sa matinding paghikbi; ang “mananaghoy” ay mas akma sa pampublikong/ritwal na pagluluksa ng κόπτω.
  terminology: Pinananatili ang “nakiapid” upang hindi burahin ang seksuwalisadong larawan, at ang “nagpakasasa sa karangyaan” para sa στρηνιάσαντες. Ang “kanyang pagkasunog” ay nagpapanatili ng larawan ng πύρωσις nang hindi idinaragdag ang “pagpapahirap.”
