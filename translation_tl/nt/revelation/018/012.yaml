id: REV.18.12
reference: Revelation 18:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: tl
  text: kargamento ng ginto, pilak, mahahalagang bato, mga perlas, pinong lino, telang kulay-ube, seda, at telang iskarlata; at lahat ng uri ng kahoy na tuya[a], lahat ng uri ng kagamitang yari sa garing, lahat ng uri ng kagamitang yari sa napakamamahaling kahoy, lahat ng uri ng kagamitang yari sa tanso, bakal, at marmol,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tuya” ay isang tradisyonal na tawag sa mamahalin at mabangong kahoy; hindi tiyak ang eksaktong uri nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: mga kargamento
  rationale: Tumutukoy ang γόμος sa kargang pangkalakalan, lalo na sa karga ng barko. Natural sa Filipino ang maramihang “mga kargamento” bilang panimula ng mahabang talaan ng mga kalakal.
- source_word: χρυσοῦ καὶ ἀργύρου
  choice: ginto, pilak
  rationale: Karaniwang tawag sa dalawang metal; hindi na kailangan ang paulit-ulit na “ng” sa isang likas na talaang Filipino.
- source_word: λίθου τιμίου
  choice: mahahalagang bato
  rationale: Bagaman isahan ang anyong Griyego, kolektibo ang gamit nito bilang materyal na kalakal; mas natural at malinaw sa Filipino ang maramihan.
- source_word: μαργαριτῶν
  choice: mga perlas
  rationale: Pinananatili ang maramihang anyo at ang karaniwang kahulugan.
- source_word: βυσσίνου
  choice: pinong lino
  rationale: Tumutukoy sa mamahaling telang lino; ipinahahayag ng “pinong” ang mataas na kalidad nito.
- source_word: πορφύρας
  choice: telang kulay-ube
  rationale: Maaaring tumukoy sa tina, tela, o kasuutang kulay purpura. Sa talaan ng kalakal, ginagawang tahas ang tela nang hindi labis na pinipili ang kasuutan.
- source_word: σιρικοῦ
  choice: seda
  rationale: Likas at karaniwang salin para sa silk o telang seda.
- source_word: κοκκίνου
  choice: telang matingkad na pula
  rationale: Ang κόκκινος ay tumutukoy sa scarlet na kulay o materyal. Nililinaw ng salin na tela ang kalakal at inilalarawan ang kulay sa madaling maunawaang modernong Filipino.
- source_word: πᾶν ξύλον θύϊνον
  choice: lahat ng uri ng kahoy na tuya
  rationale: Ang θύϊνος ay isang mamahalin at mabangong uri ng kahoy, karaniwang tinatawag na thyine/thuya wood. Ang transliterasyong “tuya” ay umiiwas sa di-tiyak na pagkakakilanlang “citron wood,” habang ipinaliliwanag sa talababa ang katangian nito.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: lahat ng uri ng kagamitang yari sa garing
  rationale: Malawak ang saklaw ng σκεῦος—sisidlan, kagamitan, o bagay. Mas natural at sapat na malawak sa Filipino ang “kagamitan” kaysa “sisidlan.”
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: lahat ng uri ng kagamitang yari sa napakamamahaling kahoy
  rationale: Pinananatili ng “napakamamahaling” ang superlatibong diin ng τιμιωτάτου, at natural na isinasalin ng “yari sa” ang ἐκ.
- source_word: χαλκοῦ
  choice: tanso
  rationale: Maaaring tumukoy ang χαλκός sa copper o bronze. “Tanso” ang malawak at karaniwang katawagang Filipino na hindi labis na tumitiyak sa eksaktong haluang metal.
- source_word: σιδήρου καὶ μαρμάρου
  choice: bakal, at marmol
  rationale: Mga tuwirang at karaniwang katumbas sa Filipino.
theological_decisions: []
