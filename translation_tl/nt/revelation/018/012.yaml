  naturalness: Natural at marangal ang karamihan ng talaan. Mas malinaw sa modernong Filipino ang magkakapantay na pariralang “lahat ng uri ng kagamitang yari sa …” sa huling apat na materyal. Ang “telang iskarlata” ay mas tiyak na katumbas ng scarlet kaysa sa mas malawak na “telang matingkad na pula.”
  terminology: Napanatili ang mga terminong pangkalakal at marangyang materyal. “Tuya” ay maingat na transliterasyon para sa di-tiyak na θύϊνον at ang talababa ay angkop. “Tanso” ay ligtas na pangkalahatang salin ng χαλκός.
