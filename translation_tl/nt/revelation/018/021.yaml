id: REV.18.21
reference: Revelation 18:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: tl
  text: At binuhat ng isang makapangyarihang anghel ang isang batong tulad ng malaking gilingang-bato at inihagis iyon sa dagat. Sinabi niya, “Sa ganitong karahasan ihahagis ang Babilonia, ang dakilang lungsod, at hindi na ito kailanman matatagpuan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦρεν
  choice: binuhat
  rationale: Ipinapakita ng aorist ng αἴρω na kinuha at itinaas ng anghel ang bato bilang paghahanda sa sagisag na pagkilos. Likas sa Filipino ang “binuhat” para sa sadyang pag-angat ng isang mabigat na bagay.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: isang makapangyarihang anghel
  rationale: Pinananatili ng “isang” ang pagtukoy sa iisang anghel, at ang “makapangyarihan” ay angkop sa marangal at apokaliptikong himig ng ἰσχυρός.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: isang batong tulad ng malaking gilingang-bato
  rationale: Pinananatili ng “tulad ng” ang paghahambing na ipinahihiwatig ng ὡς, sa halip na sabihing ang bato ay tiyak na isang gilingang-bato.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: inihagis iyon sa dagat
  rationale: Tuwirang ipinahahayag ng “inihagis” ang malakas na kilos ng βάλλω at natural ito sa makabagong Filipino.
- source_word: Οὕτως
  choice: Ganito
  rationale: Iniuugnay nito ang sumunod na pahayag sa sagisag na paghagis ng bato.
- source_word: ὁρμήματι
  choice: karahas
  rationale: Ipinahahayag ng adberbiyal na “karahas” ang puwersa at mapaminsalang bagsik ng ὅρμημα, habang ang talababa ay nagpapanatili sa maaaring diin nito sa biglaan at rumaragasang kilos.
- source_word: βληθήσεται
  choice: ihahagis
  rationale: Pinananatili ang hinaharap na balintiyak at ang leksikal na alingawngaw ng naunang paghagis sa bato, nang hindi nagdaragdag ng tahasang salitang “pababa” na wala sa pandiwa.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: ang Babilonia, ang dakilang lungsod
  rationale: Pinananatili ng pariralang appositional ang apokaliptikong katawagan sa Babilonia.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: hindi na ito kailanman matatagpuan
  rationale: Ang “hindi na ... kailanman” ay malinaw at natural na naghahatid ng mariing pagtanggi ng οὐ μή at ng pangwakas na diwa ng ἔτι.
theological_decisions:
- issue: Ang kahulugan ng Babilonia at ang larawan ng pagkawasak nito
  choice: Inilarawan ang paghatol bilang marahas at pangwakas, nang hindi tinutukoy kung literal, sagisag, o kapwa literal at sagisag ang Babilonia.
  alternative: Tukuyin ang Babilonia bilang isang literal na lungsod, isang pandaigdigang sistemang salungat sa Diyos, o isang pinagsamang apokaliptikong sagisag.
  rationale: Ang talata ay nagbibigay ng sagisag na pagkilos at pahayag ng ganap na pagbagsak, ngunit hindi nito mismo nilulutas ang eksaktong reperensiya ng Babilonia. Dapat panatilihin ng salin ang gayong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding larawang apokaliptiko, ang pag-uulit ng kilos na “ihagis,” at ang mariing pangwakas na pahayag nang hindi nagpapasok ng partikular na sistemang eskatolohikal.
