  to: At binuhat ng isang makapangyarihang anghel ang isang batong tulad ng malaking gilingang-bato at inihagis iyon sa dagat. Sinabi niya, “Sa ganitong karahasan ihahagis ang Babilonia, ang dakilang lungsod, at hindi na ito kailanman matatagpuan.”
  rationale: 'Pinalitan ang hindi likas na “Ganito karahas” ng “Sa ganitong karahasan,” at iningatan ang talababa upang manatiling hayag ang saklaw na leksikal ng ὁρμήματι: marahas, malakas, at biglaang paggalaw. Walang idinagdag na interpretasyon tungkol sa pagkakakilanlan ng Babilonia.'
