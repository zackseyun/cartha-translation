id: REV.18.3
reference: Revelation 18:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: tl
  text: Sapagkat bumagsak na ang lahat ng bansa dahil sa alak ng poot ng kanyang seksuwal na imoralidad[a]; nakipag-apid sa kanya ang mga hari ng daigdig[b], at yumaman ang mga mangangalakal ng daigdig dahil sa lakas ng kanyang walang habas na karangyaan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring unawain ang magkakasunod na pariralang Griyego bilang “alak ng silakbo ng kanyang seksuwal na imoralidad.” Ang θυμός ay maaaring mangahulugang “poot” o “matinding silakbo.” May isang kilalang variant sa tekstong Griyego na “uminom ang lahat ng bansa” sa halip na “bumagsak ang lahat ng bansa.”
    reason: lexical_and_textual_alternative
  - marker: b
    text: Malamang na talinghaga rito ang seksuwal na imoralidad para sa tiwali, may kaugnayan sa pagsamba sa diyos-diyosan, at mapagsamantalang pakikipag-alyansa; pinananatili ng salin ang seksuwal na larawan ng Griyego.
    reason: alternative_reading
  - marker: c
    text: Ang salitang Griyego ay tumutukoy sa mapagmalabis at mapagpalayaw na karangyaan, hindi lamang sa materyal na kaginhawahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag tungkol sa pagbagsak ng Babilonia.
- source_word: ἐκ τοῦ οἴνου
  choice: dahil sa alak
  rationale: Sa pagkakaugnay nito sa πέπτωκαν sa ibinigay na tekstong Griyego, ipinahahayag ng ἐκ ang pinagmulan o sanhi ng pagbagsak habang pinananatili ang larawan ng alak.
- source_word: θυμοῦ
  choice: poot
  rationale: Maaaring tumukoy ang θυμός sa poot o matinding silakbo ng damdamin. Ang “poot” ay angkop sa larawan ng paghatol sa Pahayag, ngunit binabanggit sa talababa ang tunay na kalabuan.
- source_word: πορνείας
  choice: seksuwal na imoralidad
  rationale: Malinaw ito sa makabagong Filipino at pinananatili ang seksuwal na larawan nang hindi ito nililimitahan sa prostitusyon lamang.
- source_word: πέπτωκαν
  choice: bumagsak
  rationale: Isinalin ayon sa mismong anyong πέπτωκαν (“bumagsak”) sa ibinigay na SBLGNT source, sa halip na tahimik itong gawing πέπωκαν (“uminom”).
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng bansa
  rationale: Tumutukoy ito sa mga bansa bilang kabuuang nasakop ng impluwensiya ng Babilonia.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: nakipagtalik nang imoral sa kanya
  rationale: Natural na Filipino ito na pinananatili ang tahasang seksuwal na larawan ng pandiwang πορνεύω at ang pakikipag-ugnayan sa babae.
- source_word: ἔμποροι
  choice: mga mangangalakal
  rationale: Karaniwang salitang Filipino ito para sa mga taong nakikipagkalakalan at nababagay sa kontekstong pangkabuhayan.
- source_word: ἐκ τῆς δυνάμεως
  choice: dahil sa lakas ng
  rationale: Pinananatili ng “lakas” ang diwa ng δύναμις bilang makapangyarihang puwersa, hindi lamang bilang kayamanan.
- source_word: στρήνους
  choice: walang habas na karangyaan
  rationale: Ipinahahayag nito ang marangyang pagmamalabis at mapagpalayaw na labis na pamumuhay, hindi lamang karaniwang kaginhawahan.
- source_word: ἐπλούτησαν
  choice: yumaman
  rationale: Maikli, natural, at tuwirang ipinapahayag ang naging bunga sa mga mangangalakal.
theological_decisions:
- issue: Kung literal na seksuwal na wika o tuwirang interpretasyong “idolatriya” ang gagamitin para sa πορνεία at πορνεύω
  choice: Pinanatili ang seksuwal na wika sa pangunahing teksto.
  alternative: “idolatriya,” “espirituwal na pangangalunya,” o “tiwaling pakikipag-alyansa”
  rationale: Sinasadya ng Pahayag ang seksuwal na larawan upang katawanin ang tiwali, mapagsamba-sa-diyos-diyosan, at mapagsamantalang pakikipag-ugnayan. Hindi dapat paliitin ng salin ang talinghaga sa iisang interpretasyon.
- issue: Kung babaguhin ang πέπτωκαν upang umayon sa pagbasa o kontekstong “uminom”
  choice: Isinalin itong “bumagsak” ayon sa ibinigay na tekstong Griyego.
  alternative: “uminom” kung πέπωκαν ang sinusunod na pagbasa
  rationale: Inuuna ng salin ang aktuwal na original-language source na ibinigay. Inilalahad sa talababa ang mahalagang alternatibong pagbasa sa halip na tahimik na palitan ang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanya” para sa natural na daloy, “mga mangangalakal” para sa karaniwang bokabularyo, at “walang habas na karangyaan” upang maipakita ang negatibong bigat ng στρῆνος. Pinanatili ang matindi at nakagugulat na seksuwal at pang-ekonomiyang larawan ng talata.
