  verdict: revise
  source_fidelity: Tumpak na sinusunod ng draft ang SBLGNT na πέπτωκαν, “bumagsak,” sa halip na ang variant na πέπωκαν, “uminom.” Ang “dahil sa alak” ay isang katanggap-tanggap na pagsasalin ng ἐκ sa mahirap na sintaks na ito. Gayunman, ang “mga hari sa lupa” at “mga mangangalakal sa lupa” ay maaaring magpahiwatig ng lokasyon lamang; ang genitibong τῆς γῆς ay mas malinaw na “ng daigdig.”
  naturalness: 'Ang “nakipagtalik nang imoral” ay hindi likas na modernong Filipino: kalabisan ang “nang imoral” matapos ang “nakipagtalik,” at matigas ang konstruksiyon. Ang “nakipag-apid sa kanya” ay mas natural, pinananatili ang seksuwal na larawan, at angkop sa metaporikong rehistro ng Pahayag.'
  terminology: Napananatili nang maayos ang “seksuwal na imoralidad,” “poot,” “mga mangangalakal,” at “walang habas na karangyaan.” Isinasalin ang natitirang salitang Ingles na “idolatrous” sa talababa sa natural na Filipino upang maging buo at pare-pareho ang wika ng talababa.
  issues:
  - severity: medium
    issue: Hindi likas ang “nakipagtalik nang imoral.”
    rationale: Hindi karaniwang gamit sa Filipino ang modifier na “nang imoral” kasunod ng “nakipagtalik.” Ang “nakipag-apid” ay likas na katumbas na nagpapanatili sa larawang seksuwal at sa mapanuring puwersa ng πορνεύω.
  - severity: low
    issue: Malabo ang “mga hari/mangangalakal sa lupa.”
    rationale: Ang “sa lupa” ay karaniwang lokatibo. Ang “ng daigdig” ay mas malinaw na tumutugon sa τῆς γῆς bilang saklaw ng mga hari at mangangalakal.
  - severity: low
