id: REV.18.2
reference: Revelation 18:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: tl
  text: 'At sumigaw siya sa malakas na tinig: “Bumagsak na, bumagsak na ang dakilang Babilonia! Ito ay naging tahanan ng mga demonyo, kulungan[a] ng bawat maruming espiritu, kulungan ng bawat maruming ibon, at kulungan ng bawat marumi at kinapopootang hayop[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lugar na pinamumugaran ng bawat maruming espiritu … bawat maruming ibon … at bawat marumi at kinapopootang hayop.” Ang salitang Griyego na isinaling “kulungan” ay maaari ring tumukoy sa isang lugar na tinitirhan o madalas puntahan.
    reason: lexical_alternative
  - marker: b
    text: Wala sa ilang manuskrito ang “at kulungan ng bawat marumi at kinapopootang hayop.”
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: sumigaw siya sa malakas na tinig
  rationale: Ipinahahayag ng ἔκραξεν ang malakas na pagsigaw, at ng ἐν ἰσχυρᾷ φωνῇ ang paraan o lakas nito. Ang parirala ay malinaw, marangal, at malapit sa anyo ng Griyego.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Bumagsak, bumagsak na
  rationale: Pinananatili ang mariing pag-uulit at ang himig ng makahulang pagpapahayag. Ipinakikita ng “na” ang kalagayang bunga ng ipinahayag na pagbagsak nang hindi inaalis ang payak na puwersa ng aorist.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: ang dakilang Babilonia
  rationale: Likas ito sa modernong Tagalog at pinananatili ang titulo o paglalarawang ἡ μεγάλη.
- source_word: ἐγένετο κατοικητήριον δαιμονίων
  choice: naging tahanan ng mga demonyo
  rationale: Ang “naging” ay tuwirang katumbas ng ἐγένετο, ang “tahanan” ay malinaw na katumbas ng κατοικητήριον, at ang “mga demonyo” ay hindi pinapalabo bilang pangkalahatang masasamang espiritu.
- source_word: φυλακὴ
  choice: kulungan
  rationale: Maaaring tumukoy ang φυλακή sa lugar ng pagbabantay, pag-iingat, o pagkakulong. Ang “kulungan” ang pinakadirektang salin sa kontekstong ito, habang inilalahad sa talababa ang posibleng diwang lugar na pinamumugaran.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: bawat maruming espiritu
  rationale: Pinananatili ng “bawat” ang distributibong παντός at ng “marumi” ang biblikal na diwa ng ἀκάθαρτος.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: bawat maruming ibon
  rationale: Ang ὄρνεον ay payak na nangangahulugang ibon; hindi dinaragdagan ng salin ang ideya ng pagiging mandaragit o kumakain ng bangkay.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: bawat marumi at kinapopootang hayop
  rationale: Ginamit ang “hayop” sa pangkalahatang kahulugan ng θηρίον sa hanay na ito, hindi bilang pantanging titulong “Halimaw.” Ang “kinapopootan” ay nagpapanatili sa pasibo at resultang diwa ng μεμισημένου.
theological_decisions:
- issue: Kung ang θηρίου ay pantanging apokaliptikong “Halimaw” o karaniwang pangngalang tumutukoy sa hayop
  choice: karaniwang pangngalang “hayop”
  alternative: pantanging titulong “Halimaw”
  rationale: Kasama ito sa hanay ng bawat maruming espiritu at bawat maruming ibon at pinamamahalaan ng παντός. Kaya mas malamang na pangkalahatang hayop ang tinutukoy, hindi ang natatanging kalaban sa ibang bahagi ng Pahayag.
- issue: Kung ang φυλακή ay dapat unawain bilang kulungan o lugar na pinamumugaran
  choice: kulungan sa pangunahing teksto
  alternative: pugad o lugar na pinamumugaran
  rationale: Tunay na saklaw ng salita ang pagkakulong o pag-iingat, ngunit maaari rin nitong ilarawan ang lugar na kinaroroonan o madalas puntahan. Pinananatili sa talababa ang leksikal na kalabuan sa halip na ganap itong lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang apokaliptikong pag-uulit at ang serye ng “kulungan,” ngunit inayos ang pangungusap upang maging natural sa Tagalog. Inilagay ang mga panandang talababa sa mismong mga pariralang tinutukoy ng leksikal at tekstuwal na paliwanag.
