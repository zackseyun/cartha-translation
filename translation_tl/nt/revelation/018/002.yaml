  verdict: revise
  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang malakas na sigaw, ang inuulit na pagpapahayag ng pagbagsak, ang Babilonia bilang tahanan ng mga demonyo, at ang tatlong inuulit na gamit ng φυλακή. Gayunman, ang magkaibang aspekto sa “Bumagsak, bumagsak na” ay hindi ganap na tumutugma sa magkaparehong inuulit na ἔπεσεν. Mas tapat ang magkaparehong “Bumagsak na, bumagsak na.”'
