  terminology: Ang “Babilonia,” “mga demonyo,” “maruming espiritu,” at “kulungan” ay angkop at pare-pareho sa biblikal na rehistro. Pinanatili ang “hayop” bilang karaniwang pangngalan, hindi ang pantanging apokaliptikong “Halimaw.”
