id: REV.18.1
reference: Revelation 18:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: tl
  text: Pagkatapos ng mga bagay na ito, nakita ko ang isa pang anghel na bumababa mula sa langit. Mayroon siyang dakilang awtoridad, at naliwanagan ang lupa dahil sa kanyang kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at naliwanagan ang lupa mula sa kanyang kaluwalhatian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang ταῦτα at ang pagkakasunod-sunod ng mga pangitain, habang malinaw at likas sa makabagong Tagalog.
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang ipinapahayag ng payak na aorist ang nakita ni Juan nang hindi nagdaragdag ng di-hayag na diin.
- source_word: ἄλλον ἄγγελον
  choice: isa pang anghel
  rationale: Likas nitong ipinapakita na ibang anghel ito sa loob ng nagpapatuloy na pangitain.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: na bumababa mula sa langit
  rationale: Ang aspektong nagpapatuloy ng participle ay angkop na naihahayag ng “bumababa,” at ang “mula sa langit” ay natural na katumbas ng ἐκ τοῦ οὐρανοῦ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Mayroon siyang dakilang awtoridad
  rationale: Ang ἐξουσία ay pangunahing tumutukoy sa awtoridad, karapatan, o ipinagkaloob na kapamahalaan, hindi lamang sa lakas; pinananatili ng “dakilang” ang maringal na rehistro.
- source_word: ἡ γῆ
  choice: ang lupa
  rationale: Sa konteksto ng malawak na larawan sa Pahayag, tumutukoy ito sa daigdig sa halip na sa isang lokal na lupain; natural sa Tagalog ang “ang lupa” para sa gayong kahulugan.
- source_word: ἐφωτίσθη
  choice: naliwanagan
  rationale: Pinananatili ng anyong ito ang pasibong diwa ng pagbibigay-liwanag at ang maringal na tono ng tagpo.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: dahil sa kanyang kaluwalhatian
  rationale: Maaaring ipahayag ng ἐκ ang pinagmulan o sanhi. Ang “dahil sa” ay malinaw at natural, samantalang inilalahad sa talababa ang mas tahasang pagbasa bilang pinagmulan.
theological_decisions:
- issue: Ang kalikasan ng awtoridad at ningning ng anghel
  choice: Inilalarawan ang anghel na may dakilang awtoridad at sariling tinutukoy na kaluwalhatian, nang hindi siya tahasang kinikilalang banal.
  alternative: Maaaring basahin ang pambihirang kaluwalhatian na nagpapaliwanag sa lupa bilang pahiwatig ng isang higit na mataas na pagkakakilanlan.
  rationale: Tahasan ng Griyego ang dakilang awtoridad at “kanyang kaluwalhatian,” ngunit hindi nito pinapangalanang Diyos ang anghel ni ipinapaliwanag dito ang pinagmulan ng mga katangiang iyon. Kaya pinananatili ng salin ang tensiyon nang walang dagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayang sintaktiko o ang pagkakasunod ng pangitain.
