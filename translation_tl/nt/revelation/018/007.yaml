id: REV.18.7
reference: Revelation 18:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: tl
  text: Kung gaano niya niluwalhati ang sarili at namuhay sa karangyaan[a], gayon ding karaming pagpapahirap at pagluluksa ang ibigay sa kanya. Sapagkat sinasabi niya sa kanyang puso, “Nakaluklok ako bilang reyna; hindi ako balo, at hinding-hindi ako makararanas ng pagluluksa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namuhay nang mapagpalayaw sa sarili” o “namuhay sa layaw.” Ang pandiwang Griyego ay maaaring tumukoy sa marangya, walang-pigil, at mapagpalayaw-sa-sariling pamumuhay.
    reason: lexical_alternative
  - marker: b
    text: Ang “hinding-hindi” ay nagsasalin sa mariing pagtanggi sa Griyego at naghahayag ng matibay niyang pag-aakalang hindi kailanman darating ang pagluluksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Kung gaano ... gayon din karami
  rationale: Pinananatili ang ugnayang naghahayag ng katumbas at proporsiyonal na pagganti, habang natural pa rin sa makabagong Tagalog.
- source_word: ἐδόξασεν αὑτὴν
  choice: niluwalhati ang sarili
  rationale: Malinaw na pinananatili ang reflexive na diwa ng sariling pagtataas at ang kaugnayan nito sa kaluwalhatian.
- source_word: ἐστρηνίασεν
  choice: namuhay sa karangyaan
  rationale: Ipinahahayag ang marangya at mapagpalayaw-sa-sariling pamumuhay nang hindi nililimitahan ang salita sa seksuwal na kahulugan.
- source_word: δότε αὐτῇ
  choice: ibigay sa kanya
  rationale: Tuwirang pautos na angkop sa hudisyal na tono ng talata.
- source_word: βασανισμὸν
  choice: pagpapahirap
  rationale: Nananatili ang tindi ng kaparusahan ngunit hindi ipinapalagay na pisikal na tortyur lamang ang tinutukoy.
- source_word: πένθος
  choice: pagluluksa
  rationale: Pinananatili ang pag-uulit at ang diwa ng pagdadalamhati dahil sa pagkawala at paghuhukom.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: sinasabi niya sa kanyang puso
  rationale: Pinananatili ang biblikal na idyoma para sa panloob na pagyayabang at katiyakan.
- source_word: Κάθημαι βασίλισσα
  choice: Nakaupo ako bilang reyna
  rationale: Pinananatili ang larawan ng isang reynang nakaluklok at panatag sa kapangyarihan, nang hindi idinaragdag ang salitang 'trono' na wala sa Griyego.
- source_word: χήρα οὐκ εἰμί
  choice: hindi ako balo
  rationale: Tuwiran at natural; pinananatili ang larawan ng inaakalang kaligtasan mula sa pagkawala at pag-iisa.
- source_word: οὐ μὴ ἴδω
  choice: hinding-hindi ako makararanas
  rationale: Ipinahahayag ang mariing Griyegong pagtanggi at ang mapagmataas na katiyakang hindi darating ang pagluluksa.
theological_decisions:
- issue: Pagbibigay-katauhan sa Babilonia bilang babae, reyna, at balo
  choice: Panatilihin ang pambabaeng larawan sa 'reyna' at 'balo' at gumamit ng mga panghalip na tumutukoy sa kanya.
  alternative: Gawing impersonal na lungsod o sistemang pang-ekonomiya ang tinutukoy.
  rationale: Tuloy-tuloy sa Griyego ang pagbibigay-katauhan sa Babilonia bilang babae, at mahalaga ang larawang ito sa propetikong retorika ng Pahayag.
- issue: Wika ng paghuhukom sa βασανισμός
  choice: Gamitin ang 'pagpapahirap.'
  alternative: Pahirap; tortyur; kirot.
  rationale: Pinananatili nito ang bigat ng proporsiyonal na paghuhukom nang hindi nililimitahan ang paraan ng kaparusahan nang higit sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang biblikal na idyomang “sa kanyang puso,” ang pambabaeng personipikasyon, ang larawang maharlika, at ang proporsiyonal na estruktura ng paghuhukom. Inilagay ang [b] pagkatapos ng buong pahayag na ipinapaliwanag nito.
