revisions:
- from: Kung gaano niya niluwalhati ang sarili at namuhay sa karangyaan[a], gayon din karaming pagpapahirap at pagluluksa ang ibigay sa kanya. Sapagkat sinasabi niya sa kanyang puso, “Nakaupo ako bilang reyna; hindi ako balo, at hinding-hindi ako makararanas ng pagluluksa.”[b]
  to: Kung gaano niya niluwalhati ang sarili at namuhay sa karangyaan[a], gayon ding karaming pagpapahirap at pagluluksa ang ibigay sa kanya. Sapagkat sinasabi niya sa kanyang puso, “Nakaluklok ako bilang reyna; hindi ako balo, at hinding-hindi ako makararanas ng pagluluksa.”[b]
