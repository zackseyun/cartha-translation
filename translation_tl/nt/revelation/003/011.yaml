  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: tl
  text: Malapit na akong dumating[a]. Panghawakan mong mahigpit ang mayroon ka, upang walang sinumang kumuha ng iyong korona[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mabilis akong darating.” Maaaring bigyang-diin ng pang-abay na Griyego ang pagiging malapit sa panahon o ang bilis ng pagkilos.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa putong ng tagumpay o parangal, hindi partikular sa maharlikang diadema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Darating ako
  rationale: Ang pangkasalukuyang anyo ay may nalalapit na panghinaharap na diwa sa konteksto. Natural sa modernong Tagalog ang “Darating ako” at malinaw nitong ipinahahayag ang nalalapit na pagdating.
- source_word: ταχύ
  choice: sa lalong madaling panahon
  rationale: Maaaring tumukoy ang pang-abay sa pagiging malapit sa panahon o sa bilis ng pagkilos. Pinili ang temporal na diwa sa pangunahing teksto, habang inilalahad sa talababa ang posibleng kahulugang “mabilis.”
- source_word: κράτει
  choice: Panghawakan mong mahigpit
  rationale: Ang pautos na anyo ay nananawagan ng matatag na pagpapanatili at pagtitiyaga. Pinananatili ng parirala ang diin ng utos at natural itong pakinggan sa Tagalog.
- source_word: ὃ ἔχεις
  choice: ang taglay mo
  rationale: Hindi tinutukoy ng Griyego kung ano mismo ang taglay, kaya pinananatiling bukas ang tinutukoy sa halip na dagdagan ng interpretasyon.
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na panandang Tagalog ito para sa layunin o inaasahang bunga.
- source_word: μηδεὶς
  choice: walang sinuman
  rationale: Tuwirang ipinahahayag nito ang panlahat na negatibong paksa sa natural na Tagalog.
- source_word: λάβῃ
  choice: kumuha
  rationale: Ipinahahayag nito ang kinalabasang dapat maiwasan nang hindi idinaragdag ang mas marahas na diwa ng “agawin.”
- source_word: στέφανόν
  choice: korona
  rationale: Ang “korona” ang madaling maunawaang katumbas, ngunit nililinaw sa talababa na ang στέφανος ay putong ng tagumpay o parangal at hindi partikular na maharlikang diadema.
theological_decisions:
- issue: Diwa ng ταχύ sa pangako ng pagdating ni Cristo
  choice: sa lalong madaling panahon
  alternative: mabilis
  rationale: Maaaring bigyang-diin ng salita ang pagiging malapit ng pagdating sa panahon o ang bilis ng pagkilos. Ginamit sa pangunahing teksto ang temporal na diwa, ngunit pinanatili sa talababa ang tunay na alternatibo upang hindi lutasin nang tahimik ang hindi tiyak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang isahang pautos na “Panghawakan mong” upang mapanatili ang bilang ng kausap. Inilipat ang marker [b] sa “korona,” ang salitang aktuwal na ipinaliliwanag ng talababa.
