  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: tl
  text: Ang nagtatagumpay[a]—ipagkakaloob ko sa kanya[b] na maupong kasama ko sa aking trono, kung paanong nagtagumpay rin ako at umupong kasama ng aking Ama sa kanyang trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ang nananaig.” Dalawang beses ginamit sa talata ang pandiwang Griyego na νικάω; “nagtatagumpay” ang ginamit sa dalawang pagkakataon upang mapanatili ang pagkakaugnay ng mga ito at ang tema ng tagumpay.
    reason: lexical_alternative
  - marker: b
    text: Pang-isahan ang anyo sa Griyego at kumakatawan sa bawat taong nagtatagumpay. Ang panghalip na Filipino na “kanya” ay hindi nagsasaad ng kasarian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Ang nagtatagumpay
  rationale: Ang pangkasalukuyang pandiwaring ginamit bilang pangngalan ay tumutukoy sa sinumang patuloy na nagtatagumpay. Pinananatili ng “nagtatagumpay” ang diwa ng tagumpay at ang pag-uulit ng νικάω sa talata.
- source_word: δώσω αὐτῷ καθίσαι
  choice: pagkakalooban ko siyang umupo
  rationale: Sa kayariang ito, ang δίδωμι na may pawatas ay nangangahulugang pagkakaloob ng pagkakataon o pribilehiyong gawin ang kilos. Ang “pagkakalooban” ay mas angkop kaysa sa payak na “bibigyan” at hindi kasinghina ng “pahihintulutan.”
- source_word: μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου
  choice: kasama ko sa aking trono
  rationale: Tuwirang pinananatili ang pakikisama kay Cristo at ang larawan ng pakikibahagi sa paghahari. Likas sa Filipino ang “sa trono” sa halip na literal na “loob ng trono.”
- source_word: ὡς κἀγὼ
  choice: kung paanong … rin ako
  rationale: Malinaw na ipinahahayag ang paghahambing ng ὡς at ang dagdag na diin ng καί sa κἀγώ.
- source_word: ἐνίκησα
  choice: nagtagumpay
  rationale: Ginamit ang parehong salitang-ugat na ginamit para sa νικῶν upang mapanatili ang sadyang pag-uugnay at tema ng tagumpay.
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ
  choice: umupo kasama ng aking Ama sa kanyang trono
  rationale: Pinananatili ang natapos na kilos, ang kaugnayan sa Ama, at ang malinaw na larawan ng pagluklok sa trono.
theological_decisions:
- issue: Ang pang-isahang kinatawang tinutukoy ng ὁ νικῶν at αὐτῷ
  choice: Gumamit ng pang-isahang “ang nagtatagumpay” at “siya”
  alternative: Gumamit ng maramihang anyo gaya ng “ang mga nagtatagumpay” at “sila”
  rationale: Pang-isahan ang Griyego ngunit kumakatawan ito sa bawat taong nagtatagumpay. Pinananatili ng Filipino ang pang-isahan nang hindi nagpapasok ng kasariang hindi minamarkahan ng panghalip na “siya.”
- issue: Ang pagkakaugnay ng mananagumpay kay Cristo sa kanyang trono at ni Cristo sa Ama sa trono ng Ama
  choice: Tuwirang panatilihin ang parallelismo
  alternative: Palambutin bilang sagisag lamang o dagdagan ng paliwanag tungkol sa likas na pagkakaiba ng mga kalahok
  rationale: Malakas at sadyang tuwiran ang paghahambing sa teksto. Hindi dapat paliitin ang pangako o dagdagan ang salin ng paliwanag na wala sa talata; nananatili rin ang malinaw na pagkakilala kay Cristo at sa kanyang Ama bilang magkaibang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkakalooban” upang ipahayag ang ipinagkaloob na pribilehiyo nang hindi nagiging teknikal, at pinanatili ang “trono” dahil karaniwan at malinaw ito sa wikang biblikal at pang-araw-araw.
