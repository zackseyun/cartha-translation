id: REV.3.20
reference: Revelation 3:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: tl
  text: Narito[a], nakatayo ako sa may pintuan at kumakatok. Kung may makarinig ng tinig ko at magbukas ng pintuan, papasok ako at makikisalo sa kanya sa pagkain[c][b], at siya sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Narito, nakatayo na ako sa may pintuan at kumakatok.” Ang pandiwang Griyego para sa “nakatayo” ay nasa anyong perpekto ngunit may kasalukuyang diwa, at ang “kumakatok” ay nagpapahayag ng nagpapatuloy na kilos.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “papasok ako patungo sa kanya.” Personal at relasyonal ang pananalita; hindi lamang nito inilalarawan ang pagpasok sa isang lugar.
    reason: lexical_alternative
  - marker: c
    text: Ang larawan ng pagsasalo sa pagkain ay nagpapahayag ng malapit at kapwa pakikisama. Iba-iba ang pagkaunawa kung tumutukoy ito sa Hapunan ng Panginoon, sa pagbabalik-loob, o sa panunumbalik ng pakikisama; hindi ito tahasang nililinaw ng teksto.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Narito
  rationale: Isang pantawag-pansin na may agarang diin. Likas at marangal ang “Narito” sa makabagong Tagalog nang hindi kasing-arkayko ng ibang posibleng anyo.
- source_word: ἕστηκα
  choice: nakatayo ako
  rationale: 'Ang perpektong anyo ng ἵστημι ay may kasalukuyang stative force: nakapuwesto siyang nakatayo ngayon, hindi lamang tumayo noong nakaraan.'
- source_word: ἐπὶ τὴν θύραν
  choice: sa may pintuan
  rationale: Likas na Tagalog para sa pagkakatayo sa harap o tabi ng pasukan; hindi nito ipinahihiwatig na literal na nasa ibabaw siya ng pinto.
- source_word: κρούω
  choice: kumakatok
  rationale: Ipinahahayag ng aspektong di-ganap ang nagpapatuloy na pagkakatok at bumabagay ito sa kasalukuyang tagpo.
- source_word: ἐάν τις
  choice: Kung may
  rationale: Pinananatili ang bukas at walang pagtatanging kondisyon ng indefinite pronoun τις.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: makarinig sa tinig ko
  rationale: Ang φωνή ay “tinig,” at ang “makarinig sa tinig ko” ay tuwirang naglalarawan ng pagkarinig nang hindi pa ipinapasok sa salin ang mas interpretatibong “sumunod.”
- source_word: ἀνοίξῃ τὴν θύραν
  choice: magbukas ng pintuan
  rationale: Tuwirang salin ng kilos sa kondisyong sugnay at natural sa Tagalog.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: papasok ako upang makasama siya
  rationale: Ang εἰσελεύσομαι ay “papasok ako,” samantalang ang πρὸς αὐτόν ay may personal at relasyonal na direksiyon. Ang “upang makasama siya” ay nagpapanatili nito nang mas natural kaysa sa literal na “papasok patungo sa kanya.”
- source_word: δειπνήσω
  choice: magsasalo kami sa pagkain
  rationale: Ang δειπνέω ay pagkain ng pangunahing hapunan o pakikisalo sa isang pagkain. Ipinapahayag ng “magsasalo sa pagkain” ang table fellowship nang hindi nililimitahan sa isang partikular na modernong oras o uri ng pagkain.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: ako na kasama niya, at siya na kasama ko
  rationale: Pinananatili ang elipsis at mariing pagkapalitan sa Griyego, habang nililinaw sa natural na Tagalog ang kapwa pakikisama.
theological_decisions:
- issue: Ang kahulugan ng metaporikong pagsasalo sa pagkain
  choice: 'Pinanatili bilang personal at kapwa pakikisalo: “magsasalo kami sa pagkain—ako na kasama niya, at siya na kasama ko.”'
  alternative: Maaaring ipakahulugan bilang pahiwatig sa Hapunan ng Panginoon, pagbabalik-loob, o panunumbalik ng pakikisama sa isang mananampalataya o iglesya.
  rationale: Malinaw sa teksto ang malapit at kapwa pakikisama, ngunit hindi nito tahasang tinutukoy kung sakramento, unang pagbabalik-loob, o panunumbalik ng ugnayan ang larawan. Hindi pinipili ng salin ang isa lamang sa mga pagbasa.
- issue: Ang tinutukoy ng πρὸς αὐτόν
  choice: Isinalin nang personal bilang “upang makasama siya.”
  alternative: “Papasok ako sa kanyang tahanan” o simpleng “papasok ako.”
  rationale: Walang tahasang salitang “tahanan” o “silid” sa Griyego. Pinananatili ng salin ang relasyonal na puwersa nang hindi nagdaragdag ng di-nabanggit na lugar.
translation_notes:
  register: Makabago, natural, at marangal na Filipino Tagalog. Ginamit ang “pintuan,” “tinig,” at “magsasalo sa pagkain” para sa malinaw na pagbasa ng karaniwang mambabasa. Iniwasan ang sobrang literal na pariralang hindi likas sa Tagalog at ang mga salitang maglilimita sa teolohikal na saklaw ng larawan.
