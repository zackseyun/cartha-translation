  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: tl
  text: Ang may tainga[a] ay makinig sa sinasabi ng Espiritu[b] sa mga iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sinumang may tainga ay makinig.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang espiritu”; sa kontekstong ito, nauunawaang ang tinutukoy ay ang Banal na Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang artikulo at pangkasalukuyang pandiwari ay gumaganap bilang pangngalan. Likas sa Tagalog ang “ang may” at napapanatili nito ang pangkalahatang pagtukoy sa isang taong nagtataglay nito nang hindi nagdaragdag ng kasarian.
- source_word: οὖς
  choice: tainga
  rationale: Isahan ang salitang Griyego at bahagi ito ng matalinghagang panawagan na maging handang makinig. Ang literal na isahang “tainga” ay malinaw at likas din sa Tagalog.
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ikatlong panauhang pautos ang anyo. Ang “ay makinig” ay isang likas at marangal na paraan upang ihatid ang tuwirang panawagan nang hindi ito pinahihina bilang payo lamang o pinatitindi bilang tahasang obligasyon.
- source_word: τί
  choice: sa sinasabi
  rationale: Ipinakikilala ng τί ang nilalaman ng dapat pakinggan. Sa Tagalog, likas na naihahayag ang diwa ng “kung ano ang sinasabi” sa mas maikli at maayos na pariralang “sa sinasabi.”
- source_word: τὸ πνεῦμα
  choice: Espiritu
  rationale: Sa paulit-ulit na pormula ng Pahayag 2–3, ang tinutukoy ay ang Banal na Espiritu. Ipinahihiwatig ng malaking titik ang kontekstuwal na reperente nang hindi nagdaragdag ng salitang wala sa teksto.
- source_word: λέγει
  choice: sinasabi
  rationale: Pangkasalukuyang pandiwa ito. Ang “sinasabi” ang pinakalikas na Tagalog sa konstruksiyong “makinig sa sinasabi” at malinaw na naghahatid ng patuloy na pagsasalita sa mga iglesya.
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Tinutukoy ng datibo ang mga tumatanggap ng mensahe. Ang “mga iglesya” ay malinaw at nakaugaliang tawag sa mga kongregasyong kinakausap sa Pahayag 2–3.
theological_decisions:
- issue: Pangkalahatang saklaw ng isahang panawagan
  choice: Ang may tainga ay makinig
  alternative: Sinumang may tainga ay makinig
  rationale: Isahan at kumakatawan sa sinuman ang konstruksiyong Griyego. Pinananatili ng “ang may” ang anyo at lakas nito, habang likas na walang pagtatakda ng kasarian sa Tagalog.
- issue: Tinutukoy ng “Espiritu”
  choice: Espiritu
  alternative: espiritu
  rationale: Batay sa paulit-ulit na pormula sa Pahayag 2–3, ang nagsasalita sa mga iglesya ay nauunawaang ang Banal na Espiritu. Ipinakikita ito ng malaking titik, samantalang nililinaw ng talababa na walang malaking titik sa orihinal na sulat Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at mariing anyo ng paulit-ulit na panawagan sa Pahayag, gayundin ang matalinghagang isahang “tainga.”
