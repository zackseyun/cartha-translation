id: REV.3.18
reference: Revelation 3:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: tl
  text: Ipinapayo ko sa iyo na bumili mula sa akin ng gintong dinalisay sa apoy[a] upang yumaman ka, at ng mga puting kasuotan[b] upang isuot mo ang mga ito at hindi malantad ang kahihiyan ng iyong kahubaran, at ng pamahid sa mata[c] upang ipahid mo ito sa iyong mga mata nang sa gayon ay makakita ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gintong nilinis sa apoy” o “gintong sinubok sa apoy.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga puting damit” o, sa ilang konteksto, “mga puting balabal.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “pamahid sa mata” ay tumutukoy sa isang gamot o preparasyong ipinapahid sa mga mata.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: Ipinapayo ko
  rationale: Likas at marangal na katumbas ng makapangyarihang payo; hindi ito pinahina bilang mungkahi lamang.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: bumili ka sa akin
  rationale: Tuwirang pinananatili ang larawan ng pagbili at ang pinagmumulan ng mga bagay.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: gintong dinalisay sa apoy
  rationale: Pinananatili ang larawang metalurhikal ng gintong dumaan sa apoy; ang perpektong balintiyak na pandiwari ay nagpapahiwatig ng natapos na pagdadalisay na may nananatiling bunga.
- source_word: ἵνα πλουτήσῃς
  choice: upang yumaman ka
  rationale: Naipahahayag ang pagpasok sa kalagayan ng pagiging mayaman, hindi lamang ang pananatiling mayaman.
- source_word: ἱμάτια λευκά
  choice: mga puting kasuotan
  rationale: Malawak ang saklaw ng ἱμάτια; hindi ito nilimitahan sa balabal lamang.
- source_word: ἵνα περιβάλῃ
  choice: upang maisuot mo
  rationale: Natural sa modernong Tagalog at ipinahihiwatig ang personal na pagsusuot na taglay ng gitnang tinig.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: hindi malantad ang kahihiyan ng iyong kahubaran
  rationale: Ang “malantad” ay angkop sa konteksto ng kahubaran at pinananatili ang balintiyak na diwa.
- source_word: κολλούριον
  choice: pamahid sa mata
  rationale: Malinaw na karaniwang tawag sa gamot o preparasyong ipinapahid sa mga mata, nang hindi gumagamit ng teknikal na termino.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: upang ipahid mo sa iyong mga mata
  rationale: Tumpak at natural na inilalarawan ang paglalagay sa pamamagitan ng pagpapahid; iniiwasan ang posibleng maling pahiwatig ng ritwal sa salitang “pahiran.”
- source_word: ἵνα βλέπῃς
  choice: at makakita ka
  rationale: Natural na Tagalog para sa layunin ng pagpapahid; pinananatili ang literal at simbolikong posibilidad ng pagkakita.
theological_decisions:
- issue: Simbolikong kahulugan ng ginto, puting kasuotan, at pamahid sa mata
  choice: Panatilihing literal ang mga larawan nang hindi ipinapaliwanag sa pangunahing teksto ang espirituwal na tinutukoy ng bawat isa.
  alternative: Isalin ang mga ito bilang tunay na espirituwal na kayamanan, katuwiran o kadalisayan, at espirituwal na pagkaunawa.
  rationale: Hindi tahasang binibigyang-kahulugan ng Griyegong teksto sa talatang ito ang bawat sagisag; ang literal na larawan ay nagpapanatili ng ambiguwidad at lakas ng metapora.
- issue: Posibleng ritwal o sakramental na pahiwatig ng ἐγχρῖσαι
  choice: Gamitin ang karaniwang “ipahid” para sa aktuwal na kilos ng paglalagay ng pamahid.
  alternative: Gamitin ang “pahiran” o “anoint,” na maaaring magpahiwatig sa ilang mambabasa ng pormal na ritwal.
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pagpapahid ng medisinang preparasyon sa mata. Pinananatili ng “ipahid” ang kilos nang hindi nagdaragdag ng doktrinal na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kasuotan” upang mapanatili ang bahagyang mataas na rehistro ng apokaliptikong pananalita, samantalang nanatiling payak at tuwiran ang balangkas ng pangungusap. Inihanay ang mga pananda ng talababa sa mismong terminong tinutukoy ng bawat tala.
