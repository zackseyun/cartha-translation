  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang payo ni Cristo na bumili mula sa kanya ng gintong dinalisay sa apoy, puting kasuotan, at pamahid sa mata, pati ang mga layuning yumaman, matakpan ang kahihiyan ng kahubaran, at makakita. Gayunman, ang “sa akin” ay maaari sa karaniwang Tagalog na magpahiwatig ng lokasyon o tagatanggap; ang “mula sa akin” ay mas malinaw na tumutugma sa παρ’ ἐμοῦ (“from me”).
  naturalness: Marangal at madaling maunawaan ang rehistro. Nilinaw ang tinutukoy na bagay sa “isuot mo ang mga ito” at “ipahid mo ito,” upang hindi mabitin ang pandiwa sa mahabang magkakahanay na parirala.
  terminology: Ang “gintong dinalisay sa apoy,” “mga puting kasuotan,” “kahihiyan ng iyong kahubaran,” at “pamahid sa mata” ay angkop, natural, at hindi nagpapataw ng pagpapakahulugang doktrinal. Napananatili rin ng “makakita” ang literal at simbolikong saklaw ng βλέπῃς.
  issues:
