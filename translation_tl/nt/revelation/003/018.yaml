    issue: Hindi ganap na malinaw ang pinagmulan sa “bumili ka sa akin.”
    rationale: Bagaman maaari itong unawain bilang “buy from me,” mas tiyak at likas ang “bumili mula sa akin,” na malinaw na naghahayag ng παρ’ ἐμοῦ bilang pinagmumulan.
  - severity: low
    issue: May bahagyang nakabiting mga pandiwa sa “maisoot mo” at “ipahid mo.”
    rationale: Ang mga bagay na isusuot at ipapahid ay mahihinuha, ngunit ang pagdaragdag ng “ang mga ito” at “ito” ay nagpapalinaw nang hindi binabago ang kahulugan o ang larawan ng Griyego.
