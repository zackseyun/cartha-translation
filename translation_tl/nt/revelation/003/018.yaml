- from: Ipinapayo ko sa iyo na bumili ka sa akin ng gintong dinalisay sa apoy[a] upang yumaman ka, at ng mga puting kasuotan[b] upang maisuot mo at hindi malantad ang kahihiyan ng iyong kahubaran, at ng pamahid sa mata[c] upang ipahid mo sa iyong mga mata at makakita ka.
  to: Ipinapayo ko sa iyo na bumili mula sa akin ng gintong dinalisay sa apoy[a] upang yumaman ka, at ng mga puting kasuotan[b] upang isuot mo ang mga ito at hindi malantad ang kahihiyan ng iyong kahubaran, at ng pamahid sa mata[c] upang ipahid mo ito sa iyong mga mata nang sa gayon ay makakita ka.
