id: REV.3.5
reference: Revelation 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: tl
  text: Sa ganitong paraan, ang nagtatagumpay ay bibihisan ng mga puting kasuotan[a]. Hinding-hindi ko buburahin ang pangalan niya mula sa aklat ng buhay[b][c], at kikilalanin ko ang pangalan niya sa harap ng aking Ama at sa harap ng kanyang mga anghel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang nananaig ay bibihisan sa ganitong paraan ng mga puting kasuotan.”
    reason: lexical_alternative
  - marker: b
    text: O “Hindi ko kailanman papawiin ang pangalan niya mula sa aklat ng buhay.” Mariin ang pagtanggi sa Griyego.
    reason: lexical_alternative
  - marker: c
    text: Ang “aklat ng buhay” ay larawan ng makalangit na talaan ng mga kabilang sa Diyos at tatanggap ng buhay.
    reason: cultural_note
  - marker: d
    text: O “ipahahayag ko ang pangalan niya.” Ihambing sa Mateo 10:32.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Ang nagtatagumpay
  rationale: Ang substantival na present participle ay tumutukoy sa taong kinikilala sa patuloy na pagtatagumpay. Likas sa modernong Tagalog ang pariralang ito at pinananatili ang temang tagumpay sa Pahayag.
- source_word: οὕτως
  choice: nang ganito
  rationale: Pinananatili ang pang-ugnay sa naunang pangako at ang ideya ng pagkakatugma sa paraang binanggit sa konteksto.
- source_word: περιβαλεῖται
  choice: ay bibihisan
  rationale: Ang anyong future middle/passive ay natural na naipahahayag bilang pasibong pangako ng pagbibihis, nang hindi ipinapalagay na ang tao mismo ang magbibihis sa sarili.
- source_word: ἱματίοις λευκοῖς
  choice: ng mga puting kasuotan
  rationale: Ang 'kasuotan' ay sapat na malawak para sa ἱμάτιον at hindi ito nililimitahan sa mas tiyak na 'balabal'; pinananatili nang tuwiran ang kulay puti.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Hinding-hindi ko buburahin
  rationale: Malinaw at natural na ipinahahayag ng 'hinding-hindi' ang mariing pagtanggi ng οὐ μή na may future verb; ang 'buburahin' ay angkop sa larawan ng isang pangalan sa talaan o aklat.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang pangalan niya
  rationale: Pinananatili ang isahang reperensiya ng Griyego. Sa Tagalog, ang 'niya' ay hindi minamarkahan ang kasarian ngunit tumutukoy pa rin sa iisang tao.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: sa aklat ng buhay
  rationale: Ito ang malinaw at kinikilalang biblikal na parirala sa Tagalog; maaaring mangahulugan ang βίβλος ng aklat o balumbon, ngunit hindi kailangang gawing mas tiyak dito.
- source_word: ὁμολογήσω
  choice: kikilalanin ko
  rationale: Sa kontekstong ito, ipinahahayag ng pandiwa ang hayag na pagkilala o pag-amin sa pangalan ng isang tao. Ang 'kikilalanin' ay natural sa Tagalog at angkop sa pampublikong pahayag sa harap ng Ama at mga anghel.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Maikli, natural, at pinananatili sa dalawang paglitaw ang diwa ng pagiging nasa presensiya ng isang saksi.
- source_word: τοῦ πατρός μου
  choice: aking Ama
  rationale: Tuwirang pinananatili ang ugnayang pansarili at pagka-Anak na ipinahahayag ng teksto.
- source_word: τῶν ἀγγέλων αὐτοῦ
  choice: kanyang mga anghel
  rationale: Pinananatili ang panghalip ng Griyego, na pinakamalapit na tumutukoy sa Ama, nang hindi ito ipinapaliwanag o hinaharmonisa.
theological_decisions:
- issue: Kahulugan ng pangakong hindi buburahin ang pangalan sa aklat ng buhay para sa usapin ng pananatili o pagtalikod
  choice: Isinalin bilang mariing pangako sa nagtatagumpay, nang hindi hinahango rito ang isang tiyak na doktrina tungkol sa posibilidad o imposibilidad ng tuluyang pagtalikod.
  alternative: Basahin ito bilang ganap na garantiya ng pananatili ng mga tunay na mananampalataya, o bilang pahiwatig na maaaring mawala sa ilan ang kaligtasan.
  rationale: Ang talata ay nagbibigay ng matibay na pangako sa pamamagitan ng larawan ng makalangit na talaan, ngunit hindi nito nag-iisang nilulutas ang mas malawak na debateng teolohikal.
- issue: Kasarian at bilang ng isahang pananalita
  choice: Ginamit ang 'pangalan niya,' na isahan at likas na maaaring kumatawan sa sinumang nagtatagumpay.
  alternative: Gamitin ang maramihang 'pangalan nila' upang maging tahasang gender-neutral.
  rationale: Mahalagang panatilihin ang isahang balangkas ng Griyego. Hindi kailangang magtakda ng kasarian sa Tagalog dahil likas na gender-neutral ang 'niya'.
- issue: Diwa ng ὁμολογήσω bilang pampublikong pagkilala
  choice: Isinalin na 'kikilalanin ko ang pangalan niya.'
  alternative: Ipahahayag ko ang pangalan niya; ipagtatapat ko ang pangalan niya.
  rationale: Pinananatili ng 'kikilalanin' ang diwa ng hayag na pag-ako o pagkilala nang hindi nagdudulot ng karaniwang negatibong pakahulugan ng 'ipagtatapat' sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kasuotan' sa halip na mas teknikal o mas tiyak na 'balabal,' at 'hinding-hindi' upang natural na maihatid ang mariing Griyegong pagtanggi. Ang ayos ng mga sugnay at pag-uulit ng 'sa harap ng' ay pinanatili upang madama ang retorikal na balanse ng orihinal.
