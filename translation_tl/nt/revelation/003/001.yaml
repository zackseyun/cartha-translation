- from: 'At sumulat ka sa anghel[a] ng iglesya sa Sardis: “Ito ang sinasabi[b] ng may hawak ng pitong espiritu ng Diyos[c] at ng pitong bituin: Alam ko ang mga gawa mo. May pangalan kang ikaw ay buhay[d], ngunit patay ka.”'
  to: 'At sumulat ka sa anghel[a] ng iglesya sa Sardis: “Ganito ang sinasabi[b] ng may hawak ng pitong espiritu ng Diyos[c] at ng pitong bituin: Alam ko ang mga gawa mo. May reputasyon kang buhay ka[d], ngunit patay ka.”'
