id: REV.3.1
reference: Revelation 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: tl
  text: 'At sumulat ka sa anghel[a] ng iglesya sa Sardis: “Ganito ang sinasabi[b] ng may hawak ng pitong espiritu ng Diyos[c] at ng pitong bituin: Alam ko ang mga gawa mo. May reputasyon kang buhay ka[d], ngunit patay ka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sugo.” Ang salitang Griyego na ἄγγελος ay maaaring tumukoy sa alinman, bagaman mas natural ang “anghel” sa apokaliptikong tagpo ng Pahayag.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Ito ang sinasabi” o “Ganito ang pahayag.” Isa itong pormulang ginagamit sa mariing pahayag o propetikong mensahe.
    reason: lexical_alternative
  - marker: c
    text: Pinanatiling literal ang “pitong espiritu ng Diyos.” Maaaring sagisag ito ng kapuspusan ng Banal na Espiritu, ngunit ipinapalagay naman ng iba na pitong espiritung makalangit ang tinutukoy.
    reason: alternative_reading
  - marker: d
    text: Mas literal, “May pangalan kang ikaw ay buhay.” Ang parirala ay nangangahulugang may reputasyon kang buhay ka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Pinananatili ang karaniwang kahulugang anghel, na angkop sa apokaliptikong konteksto ng Pahayag; posible rin ang sugo.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Karaniwan at malinaw na tawag sa lokal na pamayanang Kristiyano sa modernong Filipino.
- source_word: Τάδε λέγει
  choice: Ito ang sinasabi
  rationale: Natural na pormulang propetiko sa Filipino na sapat na malapit sa demonstratibong pahayag ng Griyego.
- source_word: ὁ ἔχων
  choice: ang may hawak
  rationale: Ipinahahayag ang patuloy na pag-aangkin o paghawak; mas matingkad dito kaysa sa payak na 'mayroon.'
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ang pitong espiritu ng Diyos
  rationale: Pinananatili ang tahasang maramihang anyo at hindi nilulutas sa salin ang pinagtatalunang simbolismo.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: ang pitong bituin
  rationale: Tuwirang katumbas na nagpapanatili sa simbolikong larawan.
- source_word: Οἶδά
  choice: Alam ko
  rationale: Maikli, natural, at tuwirang katumbas ng pormulang pagsusuri sa mga iglesya.
- source_word: τὰ ἔργα
  choice: ang mga gawa mo
  rationale: Pinananatili ang leksikal na larawan ng mga gawa at ang pagkakapare-pareho sa Pahayag.
- source_word: ὄνομα ἔχεις
  choice: May pangalan kang
  rationale: Malapit sa Griyegong idyoma at pinananatili ang matalim na kaibahan ng pangalan o reputasyon sa tunay na kalagayan.
- source_word: ζῇς
  choice: ikaw ay buhay
  rationale: Pinananatili ang predikatibong pahayag at ang tuwirang kaibahan sa 'patay ka.'
- source_word: νεκρὸς εἶ
  choice: patay ka
  rationale: Tuwiran at mariing hatol na hindi pinalalambot ang espirituwal na metapora.
theological_decisions:
- issue: Kahulugan ng “pitong espiritu ng Diyos”
  choice: Panatilihin sa pangunahing teksto ang literal na “pitong espiritu ng Diyos.”
  alternative: Maaaring sagisag ito ng kapuspusan ng Banal na Espiritu, o tumukoy sa pitong espiritung makalangit.
  rationale: Maramihan ang Griyego at pinagtatalunan ang simbolismo; hindi dapat ipasiya ng salin ang interpretasyon.
- issue: Tinutukoy ng “anghel” sa pambungad
  choice: Isalin ang ἀγγέλῳ bilang “anghel.”
  alternative: “Sugo,” marahil ay isang taong kinatawan ng iglesya.
  rationale: Sinusuportahan ng apokaliptikong konteksto ang 'anghel,' ngunit inilalahad sa talababa ang tunay na leksikal at interpretatibong posibilidad.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang pormulang propetiko at ang matalim na kaibahan ng panlabas na pangalan sa tunay na kalagayan. Ginamit ang “iglesya” bilang pamilyar na katawagan sa lokal na pamayanang Kristiyano.
