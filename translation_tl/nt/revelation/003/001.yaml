  terminology: Anghel, iglesya, pitong espiritu ng Diyos, pitong bituin, mga gawa, at patay ay angkop at pare-pareho. Pinananatili ang literal na maramihang "espiritu" at hindi nilulutas sa pangunahing teksto ang pinagtatalunang simbolismo.
