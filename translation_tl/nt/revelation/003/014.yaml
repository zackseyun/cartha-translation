id: REV.3.14
reference: Revelation 3:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: tl
  text: 'At sumulat ka sa anghel[a] ng iglesya sa Laodicea: “Ganito ang sinasabi ng Amen, ang saksing tapat at tunay, ang pasimula[b] ng sangnilikha ng Diyos:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero.”
    reason: lexical_alternative
  - marker: b
    text: O “pinagmulan ng sangnilikha ng Diyos” o “tagapamahala sa sangnilikha ng Diyos.” Ang salitang Griyego na archē ay maaaring mangahulugang “pasimula,” “pinagmulan,” o “tagapamahala.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Maaaring tumukoy ang salita sa isang makalangit na anghel o sa isang taong mensahero. Sa paulit-ulit na pormula ng pagpapahayag sa pitong iglesya sa Pahayag, “anghel” ang pinakadirekta at pinakakilalang salin; inilagay sa talababa ang posibleng “mensahero.”
- source_word: Τάδε λέγει
  choice: Ganito ang sinasabi
  rationale: Natural itong pormula ng pagpapahayag sa modernong Tagalog at pinananatili ang mariing pagpapakilala sa mga salitang kasunod.
- source_word: ὁ Ἀμήν
  choice: ang Amen
  rationale: Pinanatili ang “Amen” bilang natatanging titulo, kasama ang kahulugan nitong katiyakan at katotohanan, sa halip na palitan ito ng paliwanag.
- source_word: μάρτυς
  choice: saksi
  rationale: Karaniwan at malinaw na katumbas ito na nagpapanatili sa diwang nagpapatotoo.
- source_word: πιστὸς καὶ ἀληθινός
  choice: tapat at tunay
  rationale: Pinananatili ng pares na ito kapwa ang pagiging mapagkakatiwalaan at ang pagiging tunay o lubos na umaayon sa katotohanan.
- source_word: ἀρχὴ
  choice: pasimula
  rationale: Direkta nitong naihahatid ang pangunahing kahulugang “beginning” habang hindi tahasang nilulutas ang pinagtatalunang saklaw ng salita; nakatala sa talababa ang “pinagmulan” at “tagapamahala.”
- source_word: κτίσεως
  choice: sangnilikha
  rationale: Ang “sangnilikha” ay natural at marangal na katawagan sa kabuuan ng nilikha, at maayos itong bumubuo sa pariralang “sangnilikha ng Diyos.”
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Simple at direktang salin ito ng genitive construction.
theological_decisions:
- issue: Kahulugan ng ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ bilang titulo ni Cristo
  choice: ang pasimula ng sangnilikha ng Diyos
  alternative: ang pinagmulan ng sangnilikha ng Diyos; ang tagapamahala sa sangnilikha ng Diyos
  rationale: Malawak ang saklaw ng ἀρχή at maaaring mangahulugang pasimula, pinagmulan, o pamamahala. Pinananatili sa pangunahing teksto ang pinakadirektang salin at inilalahad sa talababa ang mahahalagang alternatibo upang hindi palihim na lutasin ang tunay na ambiguwidad at tensiyong teolohikal ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “iglesya,” “saksi,” at “sangnilikha” bilang malilinaw at pamilyar na terminong biblikal. Pinanatili ang “Amen” bilang titulo at ang ambiguwidad ng ἀρχή sa pamamagitan ng pangunahing salin at talababa.
