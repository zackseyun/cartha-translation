id: REV.3.9
reference: Revelation 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: tl
  text: Narito, ibinibigay ko sa iyo ang ilan mula sa sinagoga ni Satanas—ang mga nagsasabing sila'y mga Judio ngunit hindi naman, kundi nagsisinungaling. Narito, gagawin kong lumapit sila at yumukod sa harap ng iyong mga paa,[a] at malalaman nilang minahal kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba sa harap ng iyong mga paa.” Ang pandiwang Griyego ay maaaring mangahulugang yumukod o magpatirapa bilang pagpupugay, o sumamba. Ginamit dito ang “yumukod” upang hindi ipahiwatig na tumatanggap ang mga mananampalataya ng pagsambang para sa Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Isang natural at makabagong panawag-pansin sa Tagalog; inuulit ayon sa Griyego.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: ibinibigay ko sa iyo ang ilan mula sa sinagoga ni Satanas
  rationale: Pinananatili ang aspektong pangkasalukuyan ng διδῶ at ang partitive na diwa ng ἐκ. Idinagdag ang 'sa iyo' at 'ang ilan' upang maging malinaw sa Tagalog ang ipinahihiwatig ngunit hindi hayag na layon at tagatanggap.
- source_word: συναγωγῆς
  choice: sinagoga
  rationale: Ito ang tiyak at kinikilalang tawag sa kontekstong Judio, sa halip na ang mas malawak na 'kapulungan.'
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: ang mga nagsasabing sila'y mga Judio
  rationale: Tuwirang inilalahad ang mapagnilay na pahayag ng pagkakakilanlan nang hindi dinaragdagan ang hatol ng teksto.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: ngunit hindi naman, kundi nagsisinungaling
  rationale: Pinananatili ang matalim na pagsalungat at ang nagpapatuloy na kilos ng ψεύδονται.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: gagawin kong lumapit sila
  rationale: Inihahayag ang causative na lakas ng ποιήσω at ang pagdating/paglapit ng ἥξουσιν sa natural na Tagalog.
- source_word: προσκυνήσουσιν
  choice: yumukod
  rationale: Maaaring tumukoy ang pandiwa sa pagsamba o pagpapatirapa/pagyukod. Sa harap ng mga paa ng mananampalataya, malinaw na naihahatid ng 'yumukod' ang kilos ng pagpapasakop o pagpupugay nang hindi ipinahihiwatig na sinasamba sila bilang Diyos.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: sa harap ng iyong mga paa
  rationale: Malapit sa anyo ng Griyego at pinananatili ang larawan ng pagyukod sa harapan ng mga paa.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: malalaman nilang minahal kita
  rationale: Pinananatili ang resulta at ang aorist na anyo ng ἠγάπησα bilang 'minahal,' nang hindi ito ginagawang paliwanag tungkol sa uri o panahon ng pag-ibig.
theological_decisions:
- issue: Ang kahulugan ng mga nagsasabing sila'y mga Judio ngunit hindi naman
  choice: Pinanatili bilang matalim na polemikong paghatol ng teksto tungkol sa inaangking pagkakakilanlan, nang walang dagdag na paliwanag na nagkakaila sa kanilang etnisidad.
  alternative: Ipaliwanag ito bilang ganap na espirituwal na muling pagpapakahulugan sa salitang 'Judio,' o bilang tahasang pagkakaila sa etnikong identidad.
  rationale: Hindi tinutukoy ng talata kung etniko, tipan, o katapatan ang eksaktong saklaw ng pagtanggi. Dapat manatili ang tensiyon at hindi palawakin tungo sa pahayag laban sa lahat ng Judio.
- issue: Ang lakas ng προσκυνήσουσιν sa harap ng mga paa ng mananampalataya
  choice: Isinaling 'yumukod' bilang kilos ng pagpupugay o pagpapasakop.
  alternative: Isaling 'sumamba.'
  rationale: Saklaw ng pandiwa ang parehong pagsamba at pagpapatirapa. Dahil ang kilos ay ginagawa sa harap ng mga paa ng taong kinakausap, iniiwasan ng 'yumukod' ang di-kinakailangang pahiwatig na tatanggap ang mananampalataya ng banal na pagsamba, habang pinananatili ang tunay na semantikong saklaw sa talababa.
- issue: Ang diwa ng ἠγάπησά σε
  choice: Pinanatiling 'minahal kita.'
  alternative: Isaling 'iniibig kita' o 'pinili at inibig kita.'
  rationale: Ang 'minahal kita' ay sumusunod sa aorist na anyo nang hindi nagpapasya kung tumutukoy ito sa isang nakaraang pagpapakita, sa pinasimulang pag-ibig, o sa buod na pahayag ng pag-ibig.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'Tingnan mo' bilang malinaw na panawag-pansin, 'sinagoga' bilang tiyak na terminong pangkasaysayan, at 'Judio' bilang karaniwang pormal na katawagan. Iniwasan ang sobrang literal na sintaks na magiging alanganin sa Tagalog, ngunit pinanatili ang pag-uulit, polemikong tindi, at teolohikong kalabuan ng Griyego.
