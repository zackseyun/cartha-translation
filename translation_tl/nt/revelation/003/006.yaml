  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: tl
  text: Ang may tainga[a] ay makinig sa sinasabi ng Espiritu sa mga iglesya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “Ang may tainga ay makinig.” Pang-isahan ang anyo ngunit pangkalahatan ang panawagan; nakatuon ito sa sinuman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang substantibong participle ay tumutukoy sa sinumang nagtataglay nito. Likas sa Tagalog ang “Ang may,” at napapanatili nito ang pang-isahang, pangkalahatang panawagan.
- source_word: οὖς
  choice: tainga
  rationale: Pang-isahan ang salitang Griyego. Pinananatili ng “tainga” ang matalinghagang anyo ng orihinal nang hindi idinaragdag ang ideyang “pandinig” o ang pariralang “upang makinig.”
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ang ikatlong panauhang pang-isahang pautos ay likas na naipapahayag sa Tagalog sa “ay makinig.” Higit itong tuwirang panawagan kaysa “dapat makinig,” na maaaring magbigay ng ibang diin.
- source_word: τί
  choice: sa sinasabi
  rationale: Sa pariralang “makinig sa sinasabi,” natural na naipahahayag ang nilalaman ng pahayag na ipinakikilala ng τί nang hindi nagiging matigas ang Tagalog.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa paulit-ulit na pormula sa Pahayag 2–3, ang tinutukoy ay ang Banal na Espiritu. Sapat ang malaking titik upang ipakita ang referent nang hindi nagdaragdag ng salitang wala sa talata.
- source_word: λέγει
  choice: sinasabi
  rationale: Ang aspektong pangkasalukuyan o katangiang patuloy ng λέγει ay natural na naipapahayag ng “sinasabi” sa loob ng pariralang “sa sinasabi ng Espiritu.”
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Ang “mga iglesya” ay malinaw at karaniwang terminong Filipino para sa mga pamayanang Kristiyano na kinakausap sa Pahayag. Pinananatili rin nito ang maramihang bilang.
theological_decisions:
- issue: Ang tinutukoy ng “Espiritu”
  choice: ang Banal na Espiritu, na ipinahihiwatig sa saling “Espiritu”
  alternative: isang espiritu
  rationale: Sa konteksto ng paulit-ulit na pangwakas na panawagan sa Pahayag 2–3, ang Espiritu ang nagsasalita sa mga iglesya. Malinaw na ito ang malamang na kahulugan, ngunit hindi idinagdag ang “Banal” sa mismong teksto.
- issue: Pangkalahatang diwa ng pang-isahang panawagan
  choice: Ang may tainga ay makinig
  alternative: Ang mga may tainga ay makinig
  rationale: Pang-isahan ang participle at pautos sa Griyego, ngunit pangkalahatan ang saklaw. Pinananatili ng salin ang pang-isahang anyo nang hindi ito nililimitahan sa mga lalaki, sapagkat walang kasariang ipinapakita ang mga anyong Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at matalinghagang pormula ng Griyego. Ginamit ang “iglesya” bilang karaniwang katawagan sa mga pamayanang Kristiyano, at iniwasan ang pananalitang nakatali sa isang denominasyon.
