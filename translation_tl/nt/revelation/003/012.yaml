id: REV.3.12
reference: Revelation 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: tl
  text: Ang nagtatagumpay[a]—gagawin ko siyang haligi sa templo ng aking Diyos, at hinding-hindi na siya lalabas pa roon.[b] Isusulat ko sa kaniya ang pangalan ng aking Diyos, ang pangalan ng lungsod ng aking Diyos, ang bagong Jerusalem na bumababa mula sa langit, mula sa aking Diyos, at ang sarili kong bagong pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang nananaig.” Ang pandiwang Griyego na νικάω ay paulit-ulit na ginagamit sa Pahayag para sa tapat na pagtatagumpay.
    reason: lexical_alternative
  - marker: b
    text: 'Mariin ang pagtanggi sa Griyego: tiyak na hinding-hindi na siya lalabas pa.'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang bago kong pangalan.” May diin ang ayos ng mga salita sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Ang nagtatagumpay
  rationale: Ang pangkasalukuyang pandiwaring ginamit bilang pangngalan ay tumutukoy sa taong nagtatagumpay; pinananatili rin nito ang paulit-ulit na larawan ng νικάω sa Pahayag.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: gagawin ko siyang haligi
  rationale: Natural sa Tagalog at tuwirang pinananatili ang mahalagang larawang arkitektural ng pagiging haligi.
- source_word: ἐν τῷ ναῷ
  choice: sa templo
  rationale: Ang ναός ay tumutukoy sa templo o santuwaryo, hindi sa buong bakuran nito; malinaw at karaniwan ang “templo” sa kontekstong ito.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: hinding-hindi na siya lalabas pa roon
  rationale: Ipinahahayag ng “hinding-hindi” ang mariing pagtanggi ng οὐ μή, samantalang ang “roon” ay likas na tumutukoy sa nabanggit na templo.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: Isusulat ko sa kaniya
  rationale: Pinananatili ang payak na larawan ng pagsulat o paglalagay ng pangalan sa tao nang hindi agad pinapalitan ng mas mapagpaliwanag na “iuukit.”
- source_word: τὸ ὄνομα τοῦ θεοῦ μου
  choice: ang pangalan ng aking Diyos
  rationale: Tuwirang pinananatili ang “pangalan,” na maaaring magpahiwatig ng pagkakakilanlan, pag-aari, at kaugnayan nang hindi iyon ipinapaliwanag sa mismong talata.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: ang pangalan ng lungsod ng aking Diyos
  rationale: Pinananatili ang pagkakapantay-pantay ng tatlong pariralang tumutukoy sa pangalan.
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: ang bagong Jerusalem
  rationale: Likas na salin ng pariralang may artikulo at pang-uri, habang malinaw na nakikilala ang Jerusalem bilang pangalan ng lungsod.
- source_word: ἡ καταβαίνουσα
  choice: na bumababa
  rationale: Pinananatili ang naglalarawang puwersa ng pangkasalukuyang pandiwari na tumutukoy sa bagong Jerusalem.
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: mula sa langit, mula sa aking Diyos
  rationale: 'Pinananatili ang parehong pariralang nagsasaad ng pinagmulan: mula sa langit at mula sa Diyos.'
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: ang bago kong sariling pangalan
  rationale: Ang “sariling” ay nagpapalitaw sa diin ng hiwalay na artikulo at hulíng pang-uri, nang hindi nagpapaliwanag kung ano ang pangalan.
theological_decisions:
- issue: Kinatawang isahan sa pormula ng pangako
  choice: Gamitin ang isahang “siya/kaniya”
  alternative: Gumamit ng maramihang “sila/kanila” o “ang taong iyon”
  rationale: Isahan ang mga anyong Griyego at kinatawan ang diwa; natural sa Tagalog ang “siya” at hindi nito ipinipilit ang kasarian dahil walang kasariang pambalarila ang panghalip.
- issue: Paulit-ulit na “aking Diyos” sa pananalita ng itinaas na si Jesus
  choice: Panatilihin nang apat na ulit ang “aking Diyos”
  alternative: Bawasan ang pag-uulit para maging mas madulas ang estilo
  rationale: Hayag at teolohikal na makabuluhan ang apat na pag-uulit sa Griyego, kaya hindi ito pinakinis o ipinaliwanag.
- issue: Huling parirala tungkol sa pangalan
  choice: “ang bago kong sariling pangalan”
  alternative: “ang bago kong pangalan”
  rationale: Ipinahihiwatig ng “sariling” ang diin ng Griyegong ayos ngunit iniiwang mahiwaga ang nilalaman at kabuluhan ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang larawang “haligi,” ang apat na pag-uulit ng “aking Diyos,” at ang tatlong magkakatulad na parirala tungkol sa pangalan. Ginamit ang mga gitling upang malinaw na maihiwalay ang paliwanag tungkol sa bagong Jerusalem nang hindi binabago ang ugnayang pambalarila.
