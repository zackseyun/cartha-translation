  to: Ang nagtatagumpay[a]—gagawin ko siyang haligi sa templo ng aking Diyos, at hinding-hindi na siya lalabas pa roon.[b] Isusulat ko sa kaniya ang pangalan ng aking Diyos, ang pangalan ng lungsod ng aking Diyos, ang bagong Jerusalem na bumababa mula sa langit, mula sa aking Diyos, at ang sarili kong bagong pangalan.[c]
  rationale: Pinalitan ang hindi gaanong likas na “ang bago kong sariling pangalan” ng “ang sarili kong bagong pangalan.” Inayos din ang bantas sa pariralang nagpapakilala sa bagong Jerusalem upang maging mas direkta ang pagkakaugnay nito sa “lungsod ng aking Diyos,” nang walang pagbabagong pangkahulugan. Napanatili ang lahat ng elementong hinihingi ng Griyego, kabilang ang paulit-ulit na “aking Diyos” at ang diin ng pangwakas na parirala.
