id: REV.3.17
reference: Revelation 3:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: tl
  text: Sapagkat sinasabi mo, ‘Mayaman ako, yumaman na ako, at wala akong anumang kailangan,’ at hindi mo alam na ikaw ang kahabag-habag, kaawa-awa, dukha, bulag, at hubad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: Sapagkat sinasabi mo
  rationale: Ang unang ὅτι ay nagbibigay ng dahilan, samantalang ang ikalawa ay natural na ipinahihiwatig ng tuwirang sipi sa Tagalog.
- source_word: Πλούσιός εἰμι
  choice: Mayaman ako
  rationale: Tuwiran at likas na katumbas na nagpapanatili sa pag-aangkin tungkol sa kayamanan.
- source_word: πεπλούτηκα
  choice: lalo pa akong yumaman
  rationale: Ipinahihiwatig ng perpektong anyo ang pagkamit ng kayamanan na nagbunga ng kasalukuyang kalagayan; ang ‘lalo pa’ ay pinananatili rin ang retorikal na pag-unlad mula sa ‘mayaman ako.’
- source_word: οὐδὲν χρείαν ἔχω
  choice: wala akong anumang kailangan
  rationale: Natural sa modernong Tagalog at pinananatili ang mariing οὐδέν, ‘wala ni anuman.’
- source_word: οὐκ οἶδας
  choice: hindi mo alam
  rationale: Pinananatili ang tahasang pandiwa ng pagkaalam nang hindi ito binibigyang-kahulugang ‘hindi mo napagtanto.’
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: ikaw ang kahabag-habag
  rationale: Ang ‘ikaw ang’ ay nagpapahayag ng diin ng σὺ at ng matulis na pagtukoy ng artikulong ὁ, habang nananatiling natural sa Tagalog.
- source_word: ἐλεεινός
  choice: kaawa-awa
  rationale: Ipinakikita ang kalagayang karapat-dapat kaawaan at inihihiwalay sa kahulugan ng ταλαίπωρος.
- source_word: πτωχός
  choice: dukha
  rationale: Pinananatili ang matinding kabaligtaran sa pag-aangking mayaman, sa marangal at karaniwang biblikal na pananalita.
- source_word: τυφλός
  choice: bulag
  rationale: Tuwirang katumbas na hindi nagpapaliwanag nang higit sa metaporikal na wika ng teksto.
- source_word: γυμνός
  choice: hubad
  rationale: Tuwirang katumbas na nagpapanatili sa matapang na hulíng larawan.
theological_decisions:
- issue: Kung tahasang tatawaging espirituwal ang kayamanan, karukhaan, pagkabulag, at kahubaran
  choice: Pinanatiling walang dagdag na ‘espirituwal’ ang mga larawan.
  alternative: ‘mayaman sa espirituwal’ at ‘dukha sa espirituwal’
  rationale: Ang mismong paghahambing sa talata ang lumilikha ng ironya at metaporikal na diin; ang pagdaragdag ng ‘espirituwal’ ay magpapaliit sa tunay na saklaw at tensiyon ng pananalita.
- issue: Kung paano ihahayag ang diin ng ὁ ταλαίπωρος
  choice: ‘ikaw ang kahabag-habag’
  alternative: ‘kahabag-habag ka’
  rationale: Mas malinaw na pinananatili ng ‘ikaw ang’ ang mariing σὺ at ang tiyak at matulis na paglalarawan, nang hindi nagiging di-likas sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang ‘dukha’ sa halip na ‘mahirap’ upang malinaw na tumukoy sa karukhaan at maiwasan ang ibang karaniwang kahulugan ng ‘mahirap.’ Walang talababa sapagkat walang mahalagang tekstuwal o leksikal na alternatibong kailangang ilagay sa publikasyong teksto.
