  naturalness: Natural at marangal ang “sumasaway,” “nagdidisiplina,” “maging masigasig,” at “magsisi.” Mas idiomatiko at mas malinaw ang aktibong ayos na may “Ako ay,” kaysa sabihing naipahihiwatig ng hulaping “ko” ang diin ng lantad na panghalip sa Griyego. Ang “maging taimtim ka” sa talababa ay hindi kasing-natural na alternatibo sa kontekstong ito.
  terminology: Ang “minamahal,” “sumasaway,” “nagdidisiplina,” at “magsisi” ay angkop na modernong Tagalog. Pinananatili ng “nagdidisiplina” ang mapagtuwid at mapaghubog na saklaw ng παιδεύω nang hindi ito ginagawang kaparusahang lamang.
  issues:
