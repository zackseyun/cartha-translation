base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: tl
  text: Ako ay sumasaway at nagdidisiplina[b] sa lahat ng minamahal ko[a]. Kaya maging masigasig ka[c] at magsisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinumang minamahal ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nagdidisiplina” rito ay tumutukoy sa mapagtuwid na pagsasanay at paghubog, hindi lamang sa pagpaparusa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “maging maalab ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ko
  rationale: Ang lantad na panghalip ay may diin sa Griyego. Sa natural na Tagalog, naipahihiwatig ang diin sa paglalagay ng “ko” pagkatapos ng dalawang pandiwa; ang tahasang “Ako” ay magiging mabigat at hindi kailangan sa konteksto.
- source_word: ὅσους ἐὰν
  choice: ang mga
  rationale: Ipinahahayag ng konstruksiyon ang isang di-tiyak ngunit saklaw na pangkat—“ang lahat ng sinumang” o “sinumang.” Natural na naisasama ito sa “Ang mga minamahal ko,” habang ang alternatibong di-tiyak na diwa ay itinatala sa talababa.
- source_word: φιλῶ
  choice: minamahal ko
  rationale: Ang φιλέω ay nagpapahayag ng tunay na pag-ibig o pagmamahal. Ang “minamahal ko” ay natural at hindi nagpapahina rito tungo sa simpleng pagkagiliw lamang.
- source_word: ἐλέγχω
  choice: sinasaway
  rationale: Sa kontekstong ito, tumutukoy ito sa pagtutuwid sa kamalian upang magbago ang tao. Ang “sinasaway” ay malinaw at karaniwan sa modernong Tagalog.
- source_word: παιδεύω
  choice: dinidisiplina
  rationale: Saklaw ng salita ang pagwawastong humuhubog at nagsasanay, hindi lamang pagpaparusa. Pinananatili ng “dinidisiplina” ang parehong pagwawasto at paghubog.
- source_word: ζήλευε
  choice: maging masigasig ka
  rationale: Ang pangkasalukuyang pautos ay humihingi ng nagpapatuloy na taimtim at masidhing pagtugon. Ang “maging masigasig” ay natural at pinananatili ang lakas ng utos.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang bunga o lohikal na tugon sa mapagmahal na pagsaway at pagdidisiplina. Ang “Kaya” ay malinaw at natural sa Tagalog.
- source_word: μετανόησον
  choice: magsisi
  rationale: Ang “magsisi” ang karaniwan at tumpak na salin sa moral at espirituwal na konteksto, na nagpapahiwatig ng pagtalikod sa maling landas at pagbabago.
theological_decisions:
- issue: Ang uri ng pag-ibig na ipinahahayag ng φιλῶ kaugnay ng pagtutuwid
  choice: Isinalin bilang “minamahal” nang hindi pinahihina sa pagkagiliw lamang.
  alternative: “kinagigiliwan” o “may pagmamahal ako”
  rationale: Ibinabatay ng talata ang pagsaway at disiplina sa tunay na pag-ibig. Hindi rin ipinapasok ang isang teknikal na pagkakaiba sa pagitan ng φιλέω at ἀγαπάω na hindi hinihingi ng konteksto.
- issue: Ang kahulugan ng παιδεύω
  choice: Isinalin bilang “dinidisiplina,” na may diwang mapagtuwid at mapaghubog.
  alternative: “pinarurusahan,” “sinasanay,” o “kinakastigo”
  rationale: Hindi lamang kaparusahan ang salita, ngunit hindi rin ito simpleng pagtuturo. Pinananatili ng “dinidisiplina” ang tensiyon sa pagitan ng masakit na pagtutuwid at mapaghubog na layunin.
- issue: Bilang o saklaw ng mga inuukulan ng ὅσους ἐὰν
  choice: “Ang mga minamahal ko,” na may alternatibong “sinumang minamahal ko” sa talababa.
  alternative: “Sinumang minamahal ko”
  rationale: Kapwa posible ang kolektibong “ang mga” at di-tiyak na “sinuman.” Pinili ang mas natural na pangunahing pahayag habang pinananatili ang tunay na ambiguwidad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sinasaway” at “dinidisiplina” bilang malinaw na kasalukuyang pananalita; iniwasan ang mas arkaikong “kinakastigo.” Ang dalawang pautos ay nasa isahan, kaya pinanatili ang “ka.”
