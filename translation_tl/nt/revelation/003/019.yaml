    rationale: Ang “ko” ay karaniwang kinakailangang pananda ng unang panauhan sa umiiral na ayos at hindi mismo nagmamarka ng diin. Ang “Ako ay” ay natural na paraan upang maipakita ang lantad na panghalip nang hindi sobra ang pagpapadiin.
