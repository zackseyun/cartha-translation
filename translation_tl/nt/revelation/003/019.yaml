    issue: Bahagyang kulang ang saklaw ng ὅσους ἐὰν sa “Ang mga minamahal ko.”
    rationale: Bagaman posible ang kolektibong “ang mga,” mas tuwirang ipinahahayag ng “sa lahat ng minamahal ko” ang di-tiyak ngunit pangkalahatang saklaw na “as many as/whomever.”
  - severity: low
