id: REV.3.8
reference: Revelation 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: tl
  text: Alam ko ang iyong mga gawa. Tingnan mo, inilagay ko sa harap mo ang isang pintong binuksan[a], na walang sinumang makapagsasara. Sapagkat kakaunti ang iyong lakas, at tinupad mo ang aking salita, at hindi mo itinanggi ang aking pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bukás na pinto” o “isang pintong nananatiling bukás.” Tahasang ipinahihiwatig ng participle sa Griyego na binuksan ang pinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Alam ko ang iyong mga gawa
  rationale: Ang οἶδα ay perpekto sa anyo ngunit pangkasalukuyan ang diwa. Pinananatili ng “mga gawa” ang kongkretong pangmaramihang pangngalan at ang paulit-ulit na pormula sa Pahayag.
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Isang panawag ito upang ituon ang pansin. Natural ito sa makabagong Tagalog at higit na malinaw kaysa sa lipas na “narito.”
- source_word: δέδωκα ἐνώπιόν σου
  choice: inilagay ko sa harap mo
  rationale: Sa konteksto ng θύραν, ang literal na “ibinigay” ay idyomatikong tumutukoy sa paglalagay ng pinto sa harap niya. Ang perpektong Griyego ay isinalin sa paraang nagpapahiwatig ng kilos na may nananatiling bunga.
- source_word: θύραν ἠνεῳγμένην
  choice: isang pintong binuksan
  rationale: Ang perpektong balintiyak na participle ay tahasang nagsasaad na ang pinto ay binuksan at nananatiling bukas; pinananatili ng “pintong binuksan” ang pandiwang puwersang ito.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: na walang sinumang makapagsasara
  rationale: Malinaw na ipinahahayag ng “makapagsasara” ang kakayahang tinutukoy ng δύναται at natural itong gamitin kaugnay ng pinto.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: Sapagkat kakaunti ang iyong lakas
  rationale: Ang ὅτι ay pinakamaayos unawain bilang sanhi. Pinananatili ng “kakaunti ang iyong lakas” ang paglalarawan sa limitadong kakayahan o mapagkukunan nang hindi ito ginagawang pampolitikang kapangyarihan.
- source_word: καὶ ἐτήρησάς μου τὸν λόγον
  choice: ngunit tinupad mo ang aking salita
  rationale: Sa daloy ng pangungusap, may konsesibong ugnayan sa pagitan ng kakaunting lakas at katapatan ng iglesia; natural itong ipinapahayag ng “ngunit.” Ang “tinupad” ay saklaw ang pagsunod at tapat na panghahawak sa salita.
- source_word: καὶ οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: at hindi mo itinanggi ang aking pangalan
  rationale: Tuwirang pinananatili nito ang ἀρνέομαι at ang sagisag na kahulugan ng “pangalan” bilang pagkilala at katapatan sa persona.
theological_decisions:
- issue: Kahulugan ng larawang “pintong binuksan”
  choice: Pinanatili ang literal na larawan nang hindi tinutukoy kung ito ay pagkakataon sa misyon, pagpasok sa kaligtasan o kaharian, proteksiyon, o ibang kaloob ng Diyos.
  alternative: Ipaliwanag ito bilang pagkakataon sa pangangaral o bilang pagpasok sa kaharian.
  rationale: Hindi tahasang nililinaw ng talata ang tiyak na tinutukoy ng talinghaga, kaya dapat panatilihin ng salin ang tunay na teolohikal na kaluwagan nito.
- issue: Ugnayan ng μικρὰν ἔχεις δύναμιν sa kasunod na mga sugnay
  choice: 'Isinalin ang unang καί bilang konsesibong “ngunit”: bagaman kakaunti ang lakas, naging tapat sila.'
  alternative: Gawing payak na magkakasunod ang lahat ng sugnay gamit ang “at.”
  rationale: Maaaring aditibo lamang ang καί, ngunit natural na ipinahihiwatig ng konteksto ang paghahambing ng kahinaan at katapatan. Hindi binabago ng “ngunit” ang mga proposisyon, subalit nililinaw nito ang malamang na ugnayan.
- issue: Aspekto ng mga perpektong anyo
  choice: Ginamit ang natural na Tagalog na aspektong naganap para sa mga kilos na may nananatiling kabuluhan sa kasalukuyan.
  alternative: Magdagdag ng “patuloy” o “hanggang ngayon” upang gawing tahasan ang kasalukuyang bunga.
  rationale: Walang tuwirang katumbas sa Tagalog ng present perfect sa Ingles; ang pagdaragdag ng pang-abay ay maaaring lumabis sa sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “mo” dahil isahan ang mga panghalip sa Griyego, bagaman kinakatawan ng mensahero ang iglesia. Iningatan ang literal na larawan ng pinto at iniwasang ipasok sa salin ang isang tiyak na interpretasyong teolohikal.
