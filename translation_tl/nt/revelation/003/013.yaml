  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: tl
  text: Ang may tainga ay makinig sa sinasabi ng Espiritu sa mga iglesya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga iglesya” na “mga kapulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ang may tainga
  rationale: Pinananatili nito ang isahang anyo at ang pangkalahatang, kasabihang puwersa ng parirala, habang natural sa makabagong Tagalog.
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ang ikatlong panauhang pautos ay likas na naipapahayag sa Tagalog sa ganitong anyo. Ang “makinig” ay naghahatid ng diwa ng maingat na pagdinig at pagtugon, hindi lamang pisikal na pagkarinig.
- source_word: τί
  choice: sa sinasabi
  rationale: Sa kayariang Tagalog, ang “makinig sa sinasabi” ay natural na naghahatid ng nilalaman ng pananalita na ipinakikilala ng τί.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa paulit-ulit na pormula ng Pahayag, tumutukoy ito sa Espiritu Santo; ipinahihiwatig ito ng malaking titik nang hindi nagdaragdag ng katawagan na wala sa mismong talata.
- source_word: λέγει
  choice: sinasabi
  rationale: Natural na katumbas ito ng pangkasalukuyang λέγει sa konteksto ng patuloy na mensahe sa mga iglesya.
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Ang “mga iglesya” ang karaniwan at kontekstuwal na angkop na tawag sa pitong iglesyang kinakausap sa Pahayag; nananatiling posibleng leksikal ang “mga kapulungan.”
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: ang Espiritu Santo na nagsasalita sa mga iglesya
  alternative: espiritu ng tao o di-personal na espiritu ng propesiya
  rationale: Sa paulit-ulit na pangwakas na pormula ng mga mensahe sa Pahayag 2–3, ang “Espiritu” ay pinakamalamang na tumutukoy sa Espiritu Santo na nagsasalita sa pamamagitan ng mensaheng propetiko.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang maikli at mariing anyo ng orihinal, gayundin ang isahang “tainga” at ang pautos na “makinig.”
