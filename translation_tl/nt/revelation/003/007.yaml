id: REV.3.7
reference: Revelation 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: tl
  text: '“At sumulat ka sa anghel[a] ng iglesya sa Filadelfia: Ito ang sinasabi ng Banal, ng Tunay, ng may hawak ng susi ni David[b], na nagbubukas at walang sinumang makapagsasara, at nagsasara at walang sinumang makapagbubukas:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo.” Maaaring mangahulugan ang ἀγγέλῳ ng isang anghel o isang sugo.
    reason: alternative_reading
  - marker: b
    text: Ang “susi ni David” ay malamang na tumutukoy sa Isaias 22:22, isang larawan ng maharlikang awtoridad na magbukas at magsara.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Maaaring tumukoy ang salita sa isang anghel o sugo. Pinanatili ang “anghel” bilang pinakanatural na pagbasa sa paulit-ulit na pormula sa Pahayag, habang inilalagay sa talababa ang tunay na leksikal na alternatibo.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Tumutukoy ito sa pamayanang Kristiyano sa Filadelfia; ang “iglesya” ay malinaw, karaniwan, at angkop sa marangal na modernong Tagalog.
- source_word: Τάδε λέγει
  choice: Ito ang sinasabi
  rationale: Natural sa modernong Tagalog at pinananatili ang pormal at makahulang pormula ng pagpapahayag.
- source_word: ὁ ἅγιος
  choice: ang Banal
  rationale: Ginamit bilang substantibong titulo, hindi lamang karaniwang pang-uri.
- source_word: ὁ ἀληθινός
  choice: ang Totoo
  rationale: Pinananatili ang anyong titulo at ang saklaw na “tunay/genuine,” sa halip na paliitin lamang sa pagiging tapat magsalita.
- source_word: κλεῖν Δαυίδ
  choice: susi ni David
  rationale: Direktang pinananatili ang biblikal na larawan at ang Davidikong kaugnayan nang hindi ito pinapalitan ng interpretatibong pagpapaliwanag.
- source_word: ὁ ἀνοίγων καὶ οὐδεὶς κλείσει
  choice: na nagbubukas at walang sinumang makapagsasara
  rationale: 'Ang “makapagsasara” ay natural na naghahatid ng puwersa ng Griyegong hinaharap: walang sinumang magkakaroon ng kakayahang salungatin ang pagbubukas niya.'
- source_word: καὶ κλείων καὶ οὐδεὶς ἀνοίγει
  choice: at nagsasara at walang sinumang makapagbubukas
  rationale: Pinananatili ang katugmang larawan ng pagbubukas at pagsasara at ang ganap na awtoridad ng nagsasalita.
theological_decisions:
- issue: Mga titulong ὁ ἅγιος at ὁ ἀληθινός
  choice: 'Isinalin bilang mga tuwirang titulo ng nagsasalita: “ang Banal, ang Totoo.”'
  alternative: “ang banal at tunay” o “ang banal, ang tapat”
  rationale: Ang may pantukoy na mga pang-uri ay gumaganap bilang magkahiwalay at mariringal na titulo. Hindi nililimitahan ng “Totoo” ang ἀληθινός sa katapatan lamang.
- issue: Ang larawan ng “susi ni David”
  choice: Pinanatili ang larawan sa pangunahing teksto at ipinaliwanag lamang ang malamang na alusyon sa talababa.
  alternative: “ang awtoridad sa kaharian ni David”
  rationale: Malamang na alusyon ito sa Isaias 22:22, ngunit dapat manatili sa salin ang mismong larawang biblikal sa halip na palitan ito ng interpretasyon.
- issue: Pagkakakilanlan ng ἀγγέλῳ
  choice: “anghel,” na may “sugo” bilang alternatibo sa talababa
  alternative: “sugo” sa pangunahing teksto
  rationale: Parehong saklaw ng salita ang makalangit na anghel at taong sugo. Hindi tiyak ng konteksto ang pagkakakilanlan, kaya pinanatili ang tradisyonal at natural na salin habang hayagang kinikilala ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” at “Filadelfia” bilang pamilyar na anyong biblikal. Ang mga titulong “Banal” at “Totoo” ay nilagyan ng malaking titik dahil ginagamit ang mga ito bilang mga titulo. Lahat ng marker ng talababa ay nasa pangunahing teksto at tumutugma sa mga talababa.
