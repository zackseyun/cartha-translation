id: REV.3.2
reference: Revelation 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: tl
  text: Gumising ka, at palakasin mo ang nalalabi na malapit nang mamatay, sapagkat hindi ko nakitang ganap ang mga gawa mo sa harap ng aking Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Gumising ka
  rationale: Ang idyomatikong utos ay tumatawag sa agarang espirituwal na paggising at pagbabantay; natural sa modernong Tagalog ang “Gumising ka” at kaayon ng konteksto.
- source_word: στήρισον
  choice: palakasin mo
  rationale: Ipinahahayag ang pagpapatatag o pagpapalakas sa nalalabing nanghihina.
- source_word: τὰ λοιπὰ
  choice: ang nalalabi
  rationale: Pinananatili ang hindi tiyak na tinutukoy ng Griyego—maaaring mga tao, gawain, o kalagayang natitira—nang hindi ito nililinaw nang lampas sa teksto.
- source_word: ἃ ἔμελλον ἀποθανεῖν
  choice: na malapit nang mamatay
  rationale: Natural na salin ng nalalapit o nakaambang kamatayan, habang iniiwasang gawing tiyak na naganap na ito.
- source_word: πεπληρωμένα
  choice: ganap
  rationale: Ipinahahayag ang ideya ng mga gawa na hindi pa lubos, ganap, o natupad ayon sa pagsusuri ng Diyos.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: sa harap ng aking Diyos
  rationale: Tuwirang pinananatili ang relasyonal at panghatol na pananaw ng parirala.
theological_decisions:
- issue: Kung ano ang tinutukoy ng “nalalabi”
  choice: 'Hindi tinukoy nang higit pa: “ang nalalabi”'
  alternative: “ang nalalabing mga tao” o “ang nalalabing mga gawain”
  rationale: Neutro at maramihan ang Griyegong τὰ λοιπά, ngunit hindi tahasang pinapangalanan ang reperente; pinananatili ng salin ang tunay na kalabuan.
- issue: Kahulugan ng hindi pagiging ganap ng mga gawa
  choice: “hindi ko nakitang ganap ang mga gawa mo”
  alternative: “hindi ko nakitang natapos ang mga gawa mo”
  rationale: Maaaring tumukoy ang πεπληρωμένα sa pagiging lubos, ganap, o natupad. Ang “ganap” ay nagpapanatili ng moral at kwalitatibong puwersa nang hindi nililimitahan sa simpleng pagtatapos ng gawain.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/mo” dahil isang anghel ng iglesya ang tuwirang kinakausap sa gramatika.
