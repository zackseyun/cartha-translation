id: REV.3.3
reference: Revelation 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: tl
  text: Kaya alalahanin mo kung paano mo tinanggap at narinig[a] ang mensahe; ingatan mo ito at magsisi ka. Kaya kung hindi ka mananatiling gising[b], darating akong gaya ng magnanakaw[c], at tiyak na hindi mo malalaman kung anong oras ako darating sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “alalahanin mo kung ano ang tinanggap at narinig mo.” “Kung paano” ang literal na nasa Griyego at maaaring magbigay-diin sa paraan ng kanilang pagtanggap, bagaman maaari rin itong unawain bilang pagtukoy sa mismong mensahe.'
    reason: alternative_reading
  - marker: b
    text: Ang “mananatiling gising” ay maaari ring isalin na “magbabantay” o “mananatiling mapagbantay.”
    reason: lexical_alternative
  - marker: c
    text: Ang babalang “darating akong gaya ng magnanakaw” ay umaalingawngaw sa ibang mga pahayag tungkol sa biglaan at di-inaasahang pagdating. Hindi tinutukoy ng talatang ito kung pangwakas na paghatol o mas agarang pagdidisiplina ang tinutukoy.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: alalahanin mo
  rationale: Ang pangkasalukuyang pautos ay nananawagan ng patuloy na pag-alaala; natural at tuwiran ang “alalahanin mo” sa modernong Filipino.
- source_word: οὖν
  choice: kaya
  rationale: Ipinakikita nito ang lohikal na bunga ng naunang pagsaway; natural na pang-ugnay ang “kaya” sa Filipino.
- source_word: πῶς
  choice: kung paano
  rationale: Pinananatili nito ang pangunahing diwa ng paraan o kalagayan ng pagtanggap at pakikinig, sa halip na tahimik na palitan ng “kung ano.”
- source_word: εἴληφας καὶ ἤκουσας
  choice: mo tinanggap at narinig
  rationale: Ipinahahayag ang dating pagtanggap na nananatiling mahalaga at ang dating pakikinig; hindi kailangang piliting tumbasan sa Filipino ang aspektong perpekto sa paraang magiging di-natural.
- source_word: τήρει
  choice: sundin mo ito
  rationale: Sa kontekstong nagpapayo, ang τηρέω ay tumutukoy sa pag-iingat sa mensahe sa pamamagitan ng pagsunod. Mas malinaw sa ordinaryong Filipino ang “sundin,” bagaman saklaw rin ng Griyego ang paghawak at pag-iingat.
- source_word: μετανόησον
  choice: magsisi ka
  rationale: Karaniwan, maikli, at angkop na salin ng panawagang tumalikod sa kasalanan.
- source_word: γρηγορήσῃς
  choice: mananatiling gising
  rationale: Pinananatili ang metapora ng pagpupuyat at pagbabantay na kaugnay ng biglaang pagdating ng magnanakaw.
- source_word: ἥξω ὡς κλέπτης
  choice: darating akong gaya ng magnanakaw
  rationale: Natural na simili sa Filipino na pinananatili ang diwa ng biglaan at di-inaasahang pagdating.
- source_word: οὐ μὴ γνῷς
  choice: tiyak na hindi mo malalaman
  rationale: Ipinahahayag ang mariing pagtanggi ng οὐ μή nang hindi gumagamit ng makaluma o mabigat na pananalita.
- source_word: ποίαν ὥραν
  choice: kung anong oras
  rationale: Pinananatili ang tiyak na salitang “oras” at ang apokaliptikong himig ng pahayag.
- source_word: ἐπὶ σέ
  choice: sa iyo
  rationale: Natural sa Filipino at hindi nito nililimita ang pagdating bilang alinman sa pagdalaw, paghatol, o pagdidisiplina.
theological_decisions:
- issue: Saklaw ng πῶς εἴληφας καὶ ἤκουσας
  choice: “kung paano mo tinanggap at narinig”
  alternative: “kung ano ang tinanggap at narinig mo”
  rationale: Tahasan ang πῶς na “kung paano,” kaya pinananatili ang posibleng diin sa paraan ng unang pagtanggap at pakikinig. Ipinakikita ng talababa na maaari rin itong unawain bilang pagtukoy sa mismong mensahe.
- issue: Kalikasan ng babalang “darating akong gaya ng magnanakaw”
  choice: Iniwan itong di-tiyak na babala tungkol sa biglaan at di-inaasahang pagdating.
  alternative: Tukuyin ito nang tahasan bilang huling pagbabalik ni Cristo o bilang agarang paghatol sa lokal na iglesya.
  rationale: Hindi nililinaw ng talata kung pangwakas na paghatol, agarang pagdidisiplina, o ibang uri ng pagdalaw ang tinutukoy; hindi dapat paliitin ng salin ang tunay na tensiyong ito.
- issue: Layon ng τήρει
  choice: Isinuplay ang “ang mensahe/ito” bilang malinaw na layon.
  alternative: 'Iwanang walang tahasang layon: “ingatan mo” o “tuparin mo.”'
  rationale: Walang tahasang layon sa Griyego, ngunit malinaw itong bumabalik sa tinanggap at narinig. Ang pagsuplay ng reperensiya ay kailangan para sa natural na Filipino nang hindi nagdaragdag ng bagong doktrina.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang isahang “mo/ka” dahil iisang tagatanggap ang nasa mga pandiwang Griyego. Iniwasan ang sobrang teknikal at denominasyonal na pananalita; pinanatili ang metapora ng paggising at ang kawalang-tiyak tungkol sa uri ng pagdating.
