id: REV.3.10
reference: Revelation 3:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: tl
  text: Dahil sinunod mo ang aking salita ng pagtitiis[a], iingatan din kita mula sa oras ng pagsubok[b] na malapit nang dumating sa buong daigdig na tinitirhan ng mga tao, upang subukin ang mga naninirahan sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang salita tungkol sa aking pagtitiis” o “ang aking salitang nananawagan ng pagtitiis.” Maaaring maunawaan sa ilang magkakaugnay na paraan ang pariralang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iingatan kita sa gitna ng oras ng pagsubok” o “ilalayo kita sa oras ng pagsubok.” Literal na sinasabi ng Griyego na “ingatan … mula sa,” at hindi nito kusang nilulutas ang mga pagtatalong teolohikal tungkol sa paraan ng pag-iingat na ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: sinunod mo
  rationale: Sa kaugnayan nito sa λόγος, likas sa modernong Tagalog ang “sinunod mo” para sa matapat na pag-iingat o pagtupad sa salita. Hindi man nito lubos na naipapakita ang pag-uulit ng ugat na τηρέω sa τηρήσω, malinaw at natural naman ang kahulugan.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: ang aking salita ng pagtitiis
  rationale: 'Pinananatili ng medyo literal na parirala ang maaaring magkakaugnay na pakahulugan ng Griyegong genitive: salitang kaugnay ng pagtitiis, tungkol sa pagtitiis ni Jesus, o nananawagan sa mga tagapakinig na magtiis.'
- source_word: κἀγώ
  choice: iingatan din kita
  rationale: 'Ang “din” ay naghahayag ng katumbas at mariing tugon: yamang sinunod nila ang kanyang salita, iingatan din niya sila.'
- source_word: τηρήσω ἐκ
  choice: iingatan din kita mula sa
  rationale: Direktang isinasalin nito ang τηρέω + ἐκ nang hindi ipinapasiya kung ang pag-iingat ay sa pamamagitan ng paglalayo, pag-iwas, o pag-iingat habang nagaganap ang pagsubok.
- source_word: ὥρας
  choice: oras
  rationale: Bagaman maaari itong tumukoy sa isang yugto ng panahon, pinananatili ang “oras” bilang tuwirang katumbas at bilang karaniwang pananalita sa apokaliptikong konteksto.
- source_word: πειρασμοῦ
  choice: pagsubok
  rationale: Saklaw ng πειρασμός ang pagsubok, matinding pagdaranas, at tukso. Ang “pagsubok” ang pinakamalawak at hindi agad naglilimita rito sa moral na pagtukso.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: na malapit nang dumating
  rationale: Ipinahahayag nito ang inaasahan at nalalapit na pagdating na taglay ng μέλλω + infinitive.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: sa buong daigdig na tinitirhan ng mga tao
  rationale: Inilalantad nito ang diwa ng οἰκουμένη bilang buong tinatahanang daigdig, hindi lamang ang kosmos sa pangkalahatan.
- source_word: πειράσαι
  choice: upang subukin
  rationale: Ipinakikita ng “upang” ang layunin ng pagdating ng oras, at pinananatili ng “subukin” ang ugnayang leksikal sa naunang “pagsubok.”
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ang mga naninirahan sa lupa
  rationale: Pinananatili nito ang pandiwang anyo at ang paulit-ulit na pahayag sa Pahayag, sa halip na paikliin lamang bilang “mga tao sa lupa.”
theological_decisions:
- issue: Kahulugan ng τηρήσω ἐκ sa kontekstong eskatolohikal
  choice: iingatan din kita mula sa
  alternative: iingatan kita sa gitna ng / ilalayo kita sa
  rationale: Sinusunod ng pangunahing teksto ang pinakadirektang anyo ng Griyego ngunit hindi pinagpapasiyahan kung ang pangako ay pag-aalis bago ang pagsubok, pag-iingat habang nagaganap ito, o kaligtasan mula sa epekto nito.
- issue: Kahulugan ng genitive sa τὸν λόγον τῆς ὑπομονῆς μου
  choice: ang aking salita ng pagtitiis
  alternative: ang salita tungkol sa aking pagtitiis / ang aking salitang nananawagan ng pagtitiis
  rationale: Maaaring tumukoy ang Griyegong parirala sa mensaheng may katangian o panawagan ng pagtitiis, o sa pagtitiis ni Jesus. Pinananatili sa pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa kapulungan. Pinanatili ang “oras” at “salita ng pagtitiis” upang maingatan ang apokaliptikong himig at ang tunay na kalabuan ng Griyego; ipinaliwanag sa mga talababa ang mga pangunahing alternatibo.
