  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang inferensiyal na οὕτως (“Kaya”), ang sanhi sa ὅτι (“dahil”), ang χλιαρός (“maligamgam”), ang magkatambal na “hindi mainit ni malamig,” ang nalalapit na puwersa ng μέλλω (“malapit na”), at ang matinding ἐμέσαι (“isuka”). Nananatili rin ang “mula sa bibig ko” para sa ἐκ τοῦ στόματός μου.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Kaya, dahil” ay bahagyang siksik ngunit katanggap-tanggap at sinasadyang pinananatili ang parehong pang-ugnay ng pinagmulan. Ang gitling na mahaba ay epektibong naghihiwalay sa paglalarawan nang hindi nagpapahina sa retorika.
  terminology: Ang “maligamgam” ay tumpak at karaniwang gamit. Ang “isuka” angkop na tuwirang katumbas ng ἐμέσαι at mas matindi kaysa “iluwa,” kaya hindi nito pinapalambot ang larawan ng paghatol. Walang isyung pangalang pantangi o teknikal na terminong teolohikal sa talata.
