id: REV.3.16
reference: Revelation 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: tl
  text: Kaya, dahil maligamgam ka—hindi mainit ni malamig—malapit na kitang isuka[a] mula sa bibig ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iluwa,” ngunit ang pandiwang Griyego ay mas literal na nangangahulugang “isuka” at mas matindi kaysa “iluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Likas na nagpapakilala sa bunga o kahihinatnan ng naunang pahayag habang pinananatili ang inferensiyal na puwersa.
- source_word: ὅτι
  choice: dahil
  rationale: Ipinahahayag dito ang dahilan ng nalalapit na paghatol.
- source_word: χλιαρός
  choice: maligamgam
  rationale: Karaniwan at eksaktong salitang Filipino para sa temperaturang nasa pagitan ng mainit at malamig.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: hindi mainit ni malamig
  rationale: Pinananatili ang magkatambal na pagsalungat nang natural sa modernong Filipino at hindi dinaragdagan ang talinghaga.
- source_word: μέλλω
  choice: malapit na
  rationale: Pinananatili ang diwa ng nalalapit o nakaambang pagkilos, hindi lamang isang pangkalahatang pahayag tungkol sa hinaharap.
- source_word: ἐμέσαι
  choice: isuka
  rationale: Ito ang tuwiran at matapang na katumbas ng pandiwang Griyego; hindi nito pinahihina ang sadyang nakagigitlang larawan.
- source_word: ἐκ τοῦ στόματός μου
  choice: mula sa bibig ko
  rationale: Natural na Filipino na pinananatili ang malinaw na larawang pisikal ng pagpapalabas mula sa bibig.
theological_decisions:
- issue: Tindi ng larawan ng paghatol sa ἐμέσαι
  choice: Panatilihin ang tahasang larawang “isuka.”
  alternative: “iluwa”
  rationale: Ang Griyego ay tumutukoy sa pagsusuka, hindi lamang sa pagluwa. Ang mas mahinang salita ay magpapalabo sa tindi ng babala at larawan ng pagtanggi.
- issue: Pamanahong puwersa ng μέλλω
  choice: 'Isalin bilang nalalapit: “malapit na.”'
  alternative: “isusuka kita” o “susukahin kita”
  rationale: Ipinakikita ng Griyego na nakaamba ang pagkilos. Pinananatili nito ang agarang bigat ng babala nang hindi ito ginagawang tiyak na pormulang panghinaharap lamang.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang em dash upang malinaw na maipaloob ang pagpapaliwanag na “hindi mainit ni malamig,” habang pinananatili ang matinding retorika ng orihinal.
