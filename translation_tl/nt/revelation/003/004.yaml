id: REV.3.4
reference: Revelation 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: tl
  text: Ngunit mayroon kang ilang pangalan sa Sardis[a] na hindi dinungisan ang kanilang mga damit[b]. Lalakad silang nakaputi kasama ko[c], sapagkat karapat-dapat sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ilang tao.” Literal na sinasabi sa Griyego, “ilang pangalan.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi pinarumi ang kanilang mga damit.”
    reason: lexical_alternative
  - marker: c
    text: 'Malamang na ang ibig sabihin ay “nakasuot ng puting damit”; maikli ang Griyego: “nakaputi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na nagpapahayag ng matinding pagsalungat sa naunang pagsaway, at angkop sa marangal ngunit makabagong Filipino.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: mayroon kang ilang pangalan
  rationale: Pinananatili ang kapansin-pansing literal na metonimiyang “ilang pangalan,” habang ipinakikita ng kasunod na sugnay na mga tao ang tinutukoy.
- source_word: ἐν Σάρδεσιν
  choice: sa Sardis
  rationale: Likas na panandang lokatibo sa Filipino para sa pangalan ng lungsod.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: hindi dinungisan ang kanilang mga damit
  rationale: Ang “dinungisan” ay nagpapanatili sa larawan ng pagkakaroon ng mantsa at sa moral na diwa ng μολύνω; mas natural sa Filipino ang “mga damit” kaysa sa mas mataas ngunit di-gaanong pangkaraniwang “mga kasuutan.”
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: Lalakad silang kasama ko
  rationale: Pinananatili ang literal na larawan ng paglakad at ang diwa ng pakikisama, nang hindi ito pinapaliit sa isang paliwanag lamang.
- source_word: ἐν λευκοῖς
  choice: na nakaputi
  rationale: Natural at maikli sa Filipino, at gaya ng Griyego ay ipinahihiwatig lamang ang puting kasuotan sa halip na tahasang idagdag ito.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: sapagkat karapat-dapat sila
  rationale: Tuwirang pinananatili ang ibinigay na dahilan at ang pahayag ng pagiging karapat-dapat, nang walang idinaragdag na sistematikong paliwanag.
theological_decisions:
- issue: Kung isasalin ang ὀνόματα bilang karaniwang idyomang “mga tao” o pananatilihin ang “mga pangalan”
  choice: Pinanatili sa pangunahing teksto ang “ilang pangalan.”
  alternative: ilang tao
  rationale: Sadyang kapansin-pansin ang literal na pananalita at maaaring magdiin sa mga indibiduwal na kilala at kinikilala sa loob ng iglesya; nililinaw ng talababa ang likas na kahulugan nito.
- issue: Kung paano ihahayag ang moral at panrituwal na larawan ng μολύνω kaugnay ng damit
  choice: hindi dinungisan ang kanilang mga damit
  alternative: hindi pinarumi ang kanilang mga damit
  rationale: Pinananatili ng “dinungisan” ang sabay na larawan ng mantsa sa damit at ng moral na karumihan nang hindi nilulutas ang sagisag sa isang paliwanag lamang.
- issue: Kung palalambutin ang ἄξιοί εἰσιν upang maiwasan ang isang pagbasa tungkol sa merito
  choice: karapat-dapat sila
  alternative: nararapat sila
  rationale: Tuwirang sinasabi ng teksto na sila ay karapat-dapat. Hindi dapat dagdagan o bawasan ng salin ang teolohikal na tensiyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matitingkad na larawan ng “mga pangalan,” pagdungis sa damit, paglakad na kasama ni Cristo, at pagiging nakaputi. Hinati sa dalawang pangungusap upang maging natural at madaling basahin nang hindi binabago ang ugnayang panggramatika at pangkahulugan.
