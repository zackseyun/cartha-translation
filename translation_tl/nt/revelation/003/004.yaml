  source_fidelity: Tumpak na naihahatid ang pagsalungat, ang literal na “ilang pangalan,” ang hindi pagdungis sa mga damit, ang pangakong paglakad kasama ni Cristo, at ang dahilan na sila ay karapat-dapat. Pinananatili rin ng “nakaputi” ang maikling, eliptikong anyo ng ἐν λευκοῖς.
  naturalness: 'May maliit ngunit mahalagang kalabuan sa “Lalakad silang kasama ko na nakaputi”: maaaring basahin ang “na nakaputi” bilang paglalarawan sa “ko” sa pariralang “kasama ko.” Ang muling pag-aayos ng mga parirala ay likas sa makabagong Filipino at malinaw na ang mga tinutukoy na tao ang nakaputi.'
  terminology: Ang “Sardis,” “mga damit,” “dinungisan,” at “karapat-dapat” ay angkop sa rehistro at tapat sa mahahalagang terminong Griyego. Ang literal na “ilang pangalan” ay wastong pinanatili, na may malinaw na talababa para sa idyomatikong kahulugan.
