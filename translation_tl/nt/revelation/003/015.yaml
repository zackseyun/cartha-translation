source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: tl
  text: 'Alam ko ang mga gawa mo: hindi ka malamig ni mainit. Sana’y[a] malamig ka o mainit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung malamig ka lang sana o mainit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Alam ko
  rationale: Ang οἶδα ay may pangkasalukuyang estadibong diwa; natural at tuwiran itong naihahayag ng “Alam ko.”
- source_word: σου τὰ ἔργα
  choice: ang mga gawa mo
  rationale: Pinananatili ng “mga gawa” ang karaniwang bokabularyo ng paghuhukom sa Pahayag at ang moral na bigat ng ἔργα.
- source_word: ψυχρὸς
  choice: malamig
  rationale: Literal na pinananatili ang talinghaga ng temperatura at ang malinaw na pagsalungat nito sa “mainit.”
- source_word: ζεστός
  choice: mainit
  rationale: Ito ang natural na katapat ng “malamig” at hindi nito ipinapasok sa salin ang isang tiyak na paliwanag sa talinghaga.
- source_word: οὔτε … οὔτε
  choice: hindi … ni
  rationale: Ang “hindi … ni” ay likas na paraang Filipino upang ipahayag ang magkatambal na pagtanggi.
- source_word: ὄφελον
  choice: Sana’y
  rationale: Ang ὄφελον ay nagpapahayag ng matinding hangarin na salungat sa kasalukuyang kalagayan; malinaw at natural itong naihahayag ng “Sana’y.”
- source_word: ἢ
  choice: o
  rationale: Tuwiran at natural na ipinapahayag ng “o” ang disjunction sa dalawang kalagayan.
theological_decisions:
- issue: Kahulugan ng talinghaga ng “malamig” at “mainit”
  choice: Panatilihin sa pangunahing teksto ang literal na talinghaga nang hindi ito binibigyan ng tiyak na espirituwal na paliwanag.
  alternative: Ipaliwanag ang “malamig” bilang walang pananampalataya o bilang nakapagpapaginhawa, at ang “mainit” bilang masigasig o nakapagpapagaling.
  rationale: Hindi tahasang ipinaliliwanag ng talata ang simbolismo. Ang literal na mga termino ay nagpapanatili sa tunay na kalabuan at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinanatili ang maikling evaluative na himig at ang literal na imahen ng temperatura; iniwasan ang mas lumang anyong “nawa” upang maging natural sa karaniwang mambabasa.
