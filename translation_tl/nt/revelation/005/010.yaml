id: REV.5.10
reference: Revelation 5:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: tl
  text: at ginawa mo silang isang kaharian[a] at mga pari para sa aming Diyos, at naghahari sila sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “mga hari at mga pari” sa halip na “isang kaharian at mga pari.”'
    reason: textual_variant
  - marker: b
    text: 'Sa ilang manuskrito: “maghahari sila sa lupa” sa halip na “naghahari sila sa lupa.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: ginawa mo
  rationale: Ang aorist active indicative ay tuwirang isinalin sa payak na aspektong naganap; natural ito sa awit at hindi dinaragdagan ng tahasang diwa ng patuloy na resulta.
- source_word: αὐτοὺς
  choice: sila
  rationale: Ito ang layon ng pandiwang “ginawa” at tumutukoy sa mga tinubos na binanggit sa naunang talata; sa konstruksiyong “ginawa mo silang,” malinaw ang gamit bilang layon.
- source_word: τῷ θεῷ ἡμῶν
  choice: para sa aming Diyos
  rationale: Naipapahayag ng “para sa” ang datibong kaugnayan nang natural sa modernong Tagalog, nang hindi ipinapalagay ang mas tiyak na kahulugang hindi tahasang sinasabi ng Griyego.
- source_word: βασιλείαν
  choice: isang kaharian
  rationale: Isahan ang pangngalan sa SBLGNT at kolektibong inilalarawan ang mga tinubos bilang isang kaharian, hindi bilang mga hari.
- source_word: ἱερεῖς
  choice: mga pari
  rationale: Karaniwang katumbas ito ng pangmaramihang pangngalan at pinananatili ang alusyon sa Exodo 19:6.
- source_word: βασιλεύουσιν
  choice: naghahari sila
  rationale: Ang anyong ibinigay sa SBLGNT, βασιλεύουσιν, ay present active indicative, kaya pinananatili sa pangunahing teksto ang pangkasalukuyang anyo. Ang salungat na paglalarawan dito bilang future sa consultation metadata ay hindi tumutugma sa aktuwal na anyong Griyego.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Tuwirang ipinapahayag ng “sa lupa” ang lokatibong diwa ng ἐπί na may genitive at iniiwasang idagdag ang mas interpretatibong “sa ibabaw ng” o “namamahala sa.”
theological_decisions:
- issue: Pagkakakilanlan ng mga tinubos bilang βασιλείαν
  choice: isang kaharian
  alternative: mga hari
  rationale: Βασιλείαν (“kaharian”) ang mababasa sa piniling tekstong Griyego. Inilalagay sa talababa ang variant na “mga hari” dahil mahalaga ito sa kasaysayan ng teksto at interpretasyon.
- issue: Panahon ng paghahari ng mga tinubos
  choice: naghahari sila
  alternative: maghahari sila
  rationale: Present tense ang βασιλεύουσιν sa ibinigay na SBLGNT. Hindi dapat gawing future ang pangunahing teksto upang lutasin ang usaping eskatolohikal; pinananatili sa talababa ang future variant.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aming Diyos” upang panatilihin ang unang panauhang pangmaramihan ng ἡμῶν, at ang “mga pari” bilang karaniwan at madaling maunawaang terminong panrelihiyon.
