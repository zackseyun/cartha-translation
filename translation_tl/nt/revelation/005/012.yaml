id: REV.5.12
reference: Revelation 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: tl
  text: Sinasabi nila sa malakas na tinig, “Karapat-dapat ang Korderong pinaslang[a] na tumanggap ng kapangyarihan, kayamanan[b], karunungan, kalakasan[c], karangalan, kaluwalhatian, at pagpapala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinatay”; maaari ring isaling mas matingkad na “kinatay.”
    reason: lexical_alternative
  - marker: b
    text: O “yaman.”
    reason: lexical_alternative
  - marker: c
    text: O “lakas.” Ginamit ang “kalakasan” upang malinaw itong maiba sa naunang “kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Sinasabi nila
  rationale: Pinananatili ang kilos ng maramihang nagsasalita at ang kaugnayan nito sa makalangit na karamihan sa naunang talata, nang hindi dinaragdagan ang aspekto ng pandiwa.
- source_word: φωνῇ μεγάλῃ
  choice: sa malakas na tinig
  rationale: Pinananatili ang konkretong larawan ng isang malakas na tinig at ang marangal na himig ng pagsamba.
- source_word: Ἄξιόν ἐστιν
  choice: Karapat-dapat
  rationale: Likas at tuwirang katumbas sa Tagalog; ang paglalagay nito sa unahan ay nagpapanatili sa diin ng Griyego.
- source_word: τὸ ἀρνίον
  choice: ang Kordero
  rationale: Karaniwang salin ng kristolohikal na titulo sa Pahayag; ang malaking titik ay nagpapakitang titulo ito sa konteksto.
- source_word: τὸ ἐσφαγμένον
  choice: pinaslang
  rationale: Ipinahihiwatig ang marahas na pagpatay na taglay ng σφάζω habang nananatiling angkop sa marangal at liturhikong tagpo.
- source_word: λαβεῖν
  choice: na tumanggap
  rationale: Ang pagtanggap ang pinakanatural sa talaan ng mga bagay na ipinagkakaloob o iniuukol sa Kordero; hindi nito ipinapahiwatig ang sapilitang pagkuha.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Tuwirang katumbas ng δύναμις at malinaw na naiiba sa kasunod na ἰσχύς.
- source_word: πλοῦτον
  choice: kayamanan
  rationale: Natural na modernong Tagalog para sa yaman o saganang ari-arian at mga mapagkukunan.
- source_word: σοφίαν
  choice: karunungan
  rationale: Tuwiran at nakaugaliang katumbas.
- source_word: ἰσχὺν
  choice: kalakasan
  rationale: Pinananatiling naiiba sa kapangyarihan (δύναμις) at malinaw na ipinapahayag ang lakas o bisa.
- source_word: τιμὴν
  choice: karangalan
  rationale: Likas na katumbas sa konteksto ng pagkilala at pagpipitagan.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Nakaugaliang salin sa konteksto ng makalangit na pagsamba.
- source_word: εὐλογίαν
  choice: pagpupuri
  rationale: Sa doxolohikal na konteksto, tumutukoy ito sa mabuting pagsasalita o pagpupuri na iniuukol sa Kordero; mas natural ito kaysa sa ‘pagpapala,’ na sa modernong Tagalog ay madalas unawaing biyayang tinatanggap.
theological_decisions:
- issue: Kristolohikal na titulo at paggamit ng malaking titik
  choice: ang Kordero
  alternative: ang kordero
  rationale: Sa Pahayag, ang ἀρνίον ay titulo ng pinaslang ngunit itinaas na si Jesus. Ipinakikita ng malaking titik ang gamit bilang titulo nang walang idinaragdag na doktrina.
- issue: Wika tungkol sa pagkamatay ng Kordero
  choice: pinaslang
  alternative: pinatay; kinatay
  rationale: Pinananatili ng ‘pinaslang’ ang marahas at sakripisyal na larawan ng σφάζω nang hindi tinutukoy ang isang partikular na teorya ng pagtubos.
- issue: Kahulugan ng εὐλογία sa awit ng pagsamba
  choice: pagpupuri
  alternative: pagpapala
  rationale: Pinananatili ang kahulugang doxolohikal—mabuting pananalita o parangal na iniuukol sa Kordero—samantalang kinikilala na maaari rin itong isalin nang mas literal na ‘pagpapala.’
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa sama-samang pagsamba. Pinanatili ang pitong magkakaugnay na katawagan at ang diin sa pagiging karapat-dapat ng Kordero, habang iniwasan ang labis na arkaiko o sektaryang pananalita.
