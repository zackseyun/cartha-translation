  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: tl
  text: At nakita ko ang isang makapangyarihang anghel na nagpapahayag sa malakas na tinig, “Sino ang karapat-dapat na magbukas ng balumbon[a] at magtanggal ng mga tatak nito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat.” Maaaring tumukoy ang salitang Griyego na βιβλίον sa isang nakasulat na dokumento sa pangkalahatan, ngunit mas angkop dito ang “balumbon” dahil marami itong tatak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: isang makapangyarihang anghel
  rationale: Ipinapahayag ng ἰσχυρός ang lakas o kapangyarihan. Natural at marangal sa modernong Tagalog ang “makapangyarihang” para sa isang makalangit na nilalang.
- source_word: κηρύσσοντα
  choice: na nagpapahayag
  rationale: Ang κηρύσσω ay pampubliko at mariing paghahayag ng isang tagapagbalita. Mas angkop dito ang “nagpapahayag” kaysa “nangangaral,” dahil hindi sermon ang tagpo.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: sa malakas na tinig
  rationale: Idyoma ito para sa malakas at mariing pagsasalita. Pinananatili ng salin ang diin at natural itong pakinggan sa Tagalog.
- source_word: Τίς ἄξιος
  choice: Sino ang karapat-dapat
  rationale: Saklaw ng ἄξιος ang pagiging karapat-dapat o angkop sa isang dakilang gawain. Pinananatili ng “karapat-dapat” ang bigat ng tanong nang hindi ito nililinaw nang higit sa Griyego.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: na magbukas ng balumbon
  rationale: Maaaring tumukoy ang βιβλίον sa isang nakasulat na dokumento o aklat, ngunit sa larawang may maraming tatak, malamang na balumbon ang pisikal na anyo.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: at magtanggal ng mga tatak nito
  rationale: Ang λύω ay magkalag, magluwag, o magtanggal. Sa mga σφραγῖδες, ang punto ay alisin ang mga tatak upang mabuksan ang balumbon; hindi ipinipilit ng Griyego na literal na basagin ang mga ito.
theological_decisions:
- issue: Paglalarawan sa βιβλίον sa pangitain sa silid ng trono
  choice: balumbon
  alternative: aklat o dokumento
  rationale: Mas tugma ang balumbon sa isang nakasulat na bagay na may maraming tatak sa konteksto ng unang siglo. Pasiyang leksikal at pangkasaysayan ito, hindi denominasyonal.
- issue: Paraan ng pag-alis sa mga tatak
  choice: magtanggal ng mga tatak
  alternative: basagin ang mga tatak
  rationale: Malawak ang kahulugan ng λύω at hindi nito tiyak na sinasabi kung pisikal na binasag o inalis ang mga tatak. Ang “magtanggal” ay nagpapanatili sa saklaw ng salitang Griyego at sa konkretong larawan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “balumbon” bilang makasaysayang angkop na katawagan, na may talababa para sa leksikal na alternatibo.
