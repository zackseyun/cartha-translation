id: REV.5.13
reference: Revelation 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: tl
  text: 'At narinig ko ang bawat nilalang[a] na nasa langit, nasa lupa, nasa ilalim ng lupa, at nasa dagat, at ang lahat ng nasa mga ito, na nagsasabi: “Sa nakaupo sa trono at sa Kordero ay ang pagpapala, karangalan, kaluwalhatian, at kapangyarihan magpakailanman![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat bagay na nilikha.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga kapanahunan ng mga kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: bawat nilalang
  rationale: Ipinapahayag ng κτίσμα ang isang nilikha o bagay na nilikha. Sa tagpong ito ng pansansinukob na pagpupuri, natural ang “bawat nilalang” at napapanatili nito ang distributibong lakas ng πᾶν.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: na nasa langit, at nasa ibabaw ng lupa, at nasa ilalim ng lupa, at nasa ibabaw ng dagat—ang lahat ng nasa mga ito
  rationale: Pinananatili ang apat na saklaw at ang paulit-ulit na καί upang idiin ang kabuuan ng sangnilikha. Ang “ang lahat ng nasa mga ito” ay tumutukoy nang sama-sama sa mga nabanggit na dako.
- source_word: ἤκουσα λέγοντας
  choice: narinig kong nagsasabi
  rationale: Direktang inililipat ang pandiwang pandinig at ang kasamang participle nang natural sa Filipino, habang ang kolektibong paksa ay nananatiling malinaw.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Sa nakaupo sa trono
  rationale: Ang articular participle ay natural na isinasalin bilang pariralang pangngalan. Ang “nakaupo” ay kasalukuyan, marangal, at hindi makaluma.
- source_word: τῷ ἀρνίῳ
  choice: sa Kordero
  rationale: Ang “Kordero” ang nakatatag na titulong Kristolohikal sa Pahayag at pinananatili ang imaheng hain at maringal.
- source_word: ἡ εὐλογία
  choice: ang pagpapala
  rationale: Sa doksolohiyang ito, tumutukoy ito sa pagpapalang iniuukol o ipinahahayag sa Diyos; “pagpapala” ang tuwiran at liturhikong katumbas.
- source_word: ἡ τιμή
  choice: ang karangalan
  rationale: Natural na ipinahahayag ng “karangalan” ang pagkilalang iniuukol sa isang marapat parangalan.
- source_word: ἡ δόξα
  choice: ang kaluwalhatian
  rationale: Ito ang malinaw at nakatatag na katumbas ng δόξα sa konteksto ng pagsamba.
- source_word: τὸ κράτος
  choice: ang kapangyarihan
  rationale: Ang κράτος ay lakas o kapangyarihang aktibong namamayani. Mas madaling maunawaan sa modernong Filipino ang “kapangyarihan” kaysa “kapamahalaan,” nang hindi nililimitahan ang kahulugan sa administratibong pamamahala.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Idyoma ito para sa walang hanggang tagal. Ang “magpakailanman” ang natural na katumbas sa Filipino; inilalagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Iisang doksolohiya para sa nakaupo sa trono at sa Kordero
  choice: 'Panatilihin ang iisang pagpapahayag na magkasamang iniuukol sa dalawa: “Sa nakaupo sa trono at sa Kordero ang…”'
  alternative: Maglagay ng hiwalay o inuulit na pandiwa para sa bawat tinutukoy
  rationale: Iisang magkakaugnay na parangal ang inihaharap ng Griyego sa parehong tinutukoy. Hindi ito pinalalawak o ipinapaliwanag upang mapanatili ang mataas na Kristolohiya at ang tunay na estruktura ng teksto.
- issue: Saklaw ng κτίσμα sa pansansinukob na pagpupuri
  choice: bawat nilalang
  alternative: buong sangnilikha; bawat bagay na nilikha
  rationale: Inilalarawan ng talata ang mga nasa lahat ng dako bilang nagsasalita ng papuri. Ang “bawat nilalang” ay nagpapanatili sa indibiduwal at masiglang larawan, pati sa pangkalahatang saklaw nito.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa pampublikong pagbasa. Pinanatili ang paulit-ulit na “at” upang maihatid ang masaklaw at maringal na ritmo ng Griyego. Ginamit ang karaniwang bokabularyong biblikal na “trono,” “Kordero,” at “kaluwalhatian,” ngunit iniwasan ang di-kailangang makalumang ayos.
