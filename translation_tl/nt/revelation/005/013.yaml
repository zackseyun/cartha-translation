revisions:
- from: 'At narinig kong nagsasabi ang bawat nilalang[a] na nasa langit, at nasa ibabaw ng lupa, at nasa ilalim ng lupa, at nasa ibabaw ng dagat—ang lahat ng nasa mga ito: “Sa nakaupo sa trono at sa Kordero ang pagpapala, ang karangalan, ang kaluwalhatian, at ang kapangyarihan magpakailanman.[b]”'
  to: 'At narinig ko ang bawat nilalang[a] na nasa langit, nasa lupa, nasa ilalim ng lupa, at nasa dagat, at ang lahat ng nasa mga ito, na nagsasabi: “Sa nakaupo sa trono at sa Kordero ay ang pagpapala, karangalan, kaluwalhatian, at kapangyarihan magpakailanman![b]”'
  rationale: Inayos ang ayos ng pangungusap upang maging natural sa modernong Filipino at upang malinaw na ang komprehensibong pangkat ng mga nilalang ang nagsasabi ng doksolohiya. Ginawang idiomatiko ang mga lokatibong parirala nang hindi binabago ang kosmikong saklaw ng Griyego. Idinagdag ang “ay” sa askripsiyong doksolohikal upang maging maayos ang pangungusap sa Filipino, habang pinanatili ang iisang parangal na magkasamang iniuukol sa nakaupo sa trono at sa Kordero.
