  verdict: revise
  source_fidelity: 'Ang draft ay pangkalahatang tapat sa Griyego: pinananatili nito ang saklaw ng lahat ng nilalang sa mga kosmikong dako, ang magkasamang doksolohiya para sa nakaupo sa trono at sa Kordero, at ang apat na parangal. Gayunman, ang ayos ng pandinig at participle sa Filipino ay nangangailangan ng pag-aayos upang malinaw na ang lahat ng nabanggit ang nagsasalita.'
  naturalness: Hindi natural at bahagyang malabo ang “narinig kong nagsasabi ang bawat nilalang.” Mas malinaw at mas angkop sa modernong Filipino ang “Narinig ko ang bawat nilalang ... na nagsasabi.” Ang mga lokatibong “nasa lupa” at “nasa dagat” ay idiomatiko at sapat na katumbas ng mga pariralang Griyego sa ganitong talaan.
  terminology: Ang “Kordero,” “trono,” “pagpapala,” “karangalan,” “kaluwalhatian,” at “kapangyarihan” ay angkop at pare-pareho sa marangal ngunit modernong rehistro. Ang “bawat nilalang” ay isang ligtas na salin ng πᾶν κτίσμα; pinananatili ng talababa ang alternatibong mas malawak na “bawat bagay na nilikha.”
  issues:
