  - severity: low
    issue: Masyadong literal at hindi karaniwan sa Filipino ang paulit-ulit na “nasa ibabaw ng” para sa lupa at dagat.
    rationale: Ang ἐπί sa talaang ito ay lokatibo. Ang “nasa lupa” at “nasa dagat” ay natural na Filipino at pinananatili ang saklaw ng mga dako nang walang dagdag o bawas sa kahulugan.
