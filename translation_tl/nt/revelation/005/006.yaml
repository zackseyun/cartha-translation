id: REV.5.6
reference: Revelation 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: tl
  text: At nakita ko, sa gitna ng trono at ng apat na nilalang na buháy, at sa gitna ng mga nakatatanda, ang isang Korderong nakatayo, na waring kinatay[a]. Mayroon itong pitong sungay at pitong mata; ang mga ito ang pitong espiritu ng Diyos[b] na isinugo sa buong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na parang pinaslang” o, nang mas literal, “na parang kinatay.”
    reason: lexical_alternative
  - marker: b
    text: Pinanatili rito ang mismong pariralang “pitong espiritu ng Diyos.” Nauunawaan ito ng ilan bilang simbolikong pagtukoy sa Espiritu Santo sa ganap na kapuspusan, ngunit hindi tahasang nilulutas ng teksto ang simbolismo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: sa gitna ng ... at sa gitna ng
  rationale: Pinananatili ang inuulit na pariralang panlunan at ang magkapatong na ayos ng tanawin sa pangitain, sa halip na pagsamahin ang dalawang parirala.
- source_word: ζῴων
  choice: mga nilalang na buháy
  rationale: Tumutukoy ito sa mga nilalang sa paligid ng trono, hindi sa karaniwang mga hayop. Likas at malinaw sa modernong Filipino ang parirala.
- source_word: πρεσβυτέρων
  choice: mga nakatatanda
  rationale: Ginagamit dito bilang tawag sa kinikilalang pangkat sa makalangit na tagpo; mas natural ito kaysa sa literal na 'matatandang lalaki'.
- source_word: ἀρνίον
  choice: Kordero
  rationale: Pinananatili ang imaheng pansakripisyo at mesiyaniko. Ginamit ang malaking titik sapagkat natatanging pantukoy ito sa tauhan sa pangitain.
- source_word: ἑστηκὸς
  choice: nakatayo
  rationale: Ipinahahayag ng ganap na participle ang nananatiling kalagayan ng Kordero bilang nakatayo; malinaw at buhay ang payak na anyong Filipino.
- source_word: ὡς ἐσφαγμένον
  choice: na waring kinatay
  rationale: Pinananatili ng 'waring' ang paghahambing o anyo ng nakita, samantalang ipinahihiwatig ng 'kinatay' ang marahas at pansakripisyong pagpatay nang hindi pinapahina ang kabalintunaan ng Korderong nakatayo ngunit kinatay.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: Mayroon itong pitong sungay at pitong mata
  rationale: Literal na pinananatili ang apokaliptikong larawan; hindi isinasalin sa teksto ang sinasagisag ng mga sungay o mata.
- source_word: οἵ εἰσιν
  choice: ang mga ito ang
  rationale: Natural na Filipino ito para sa sugnay na nagpapakilala. Ang pinakamalapit na tinutukoy ay ang pitong mata, ngunit hindi dinaragdagan ng paliwanag ang teksto.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ang pitong espiritu ng Diyos
  rationale: Tapat na pinananatili ang tahasang maramihang anyo ng Griyego at hindi ito ipinapakahulugang agad bilang 'pitong-kapuspúsang Espiritu' o ibang doktrinal na paraphrase.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: na isinugo sa buong lupa
  rationale: Ipinananatili ang balintiyak na participle at ang saklaw na 'buong lupa' sa natural na ayos ng Filipino.
theological_decisions:
- issue: Tinutukoy ng sugnay na 'ang mga ito ang pitong espiritu ng Diyos'
  choice: Iniuugnay ang sugnay sa pinakamalapit na binanggit, ang pitong mata.
  alternative: Maaaring iugnay nang mas maluwag ang sugnay sa pitong sungay at pitong mata na magkasama.
  rationale: Ang pitong mata ang pinakamalapit at pinakanaaangkop na tinutukoy sa daloy ng pangungusap. Hindi nagdagdag ang salin ng interpretasyong lampas sa pagkakaugnay na nasa teksto.
- issue: Kahulugan ng 'pitong espiritu ng Diyos'
  choice: Pinanatili ang literal na pariralang 'pitong espiritu ng Diyos.'
  alternative: Ang pitong-kapuspúsang Espiritu ng Diyos; ang Espiritu ng Diyos sa pitong-kapuspúsang kaganapan.
  rationale: Mabigat at pinagtatalunang simbolikong pananalita ito. Hindi dapat alisin ng salin ang tunay na tensiyong teolohikal sa pamamagitan ng isang mapagpasyang paraphrase.
- issue: Paglalagay ng malaking titik sa 'espiritu'
  choice: Maliit na titik ang ginamit sa 'pitong espiritu ng Diyos.'
  alternative: Pitong Espiritu ng Diyos.
  rationale: Walang pagkakaibang malaki at maliit na titik na makapagpapasya sa kahulugan sa sinaunang Griyegong pinagmulan. Iniiwasan ng maliit na titik ang tahimik na pagpapasya sa pinagtatalunang eksaktong pagkakakilanlan, habang nililinaw ng talababa ang posibleng pagkaunawa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit at kakaibang larawang apokaliptiko kung mahalaga sa anyo ng pangitain. Ginamit ang “buháy” na may tuldik upang maiwasang mabasa bilang “búhay.” Ang “kinatay” ay sadyang matingkad ngunit karaniwan at angkop sa pansakripisyong larawan.
