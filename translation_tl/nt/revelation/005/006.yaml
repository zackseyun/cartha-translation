  terminology: Ang “Kordero,” “mga nilalang na buháy,” “mga nakatatanda,” at “pitong espiritu ng Diyos” ay angkop. Ang maliit na titik sa “espiritu” ay isang maingat na paraan upang huwag ipasiya sa pagsasalin ang pinagtatalunang simbolikong pagkakakilanlan ng parirala.
