  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: tl
  text: Lumapit ang Kordero at kinuha ang balumbon mula sa kanang kamay ng nakaupo sa trono.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: Lumapit
  rationale: Sa tagpong ito, ang aorist ng ἔρχομαι ay nagsasaad ng pagkilos ng Kordero patungo sa nakaupo sa trono. Mas natural at malinaw sa Filipino ang “lumapit” kaysa “dumating,” nang hindi nagdaragdag ng paraan o layunin ng paglapit.
- source_word: εἴληφεν
  choice: kinuha ang balumbon
  rationale: Ang perfect ng λαμβάνω ay bahagi ng sunod-sunod na pangyayari sa pangitain at likas na isinasalaysay sa Filipino sa aspektong perpektibo. Hindi binanggit sa talata ang tuwirang layon, ngunit malinaw sa naunang konteksto na iyon ang balumbon; ang pagbanggit dito ay natural at malinaw sa Filipino.
- source_word: ἐκ
  choice: mula sa
  rationale: Ipinapahayag nito ang pinagmulan ng bagay na kinuha. Ang “mula sa” ang karaniwang makabagong katumbas sa Filipino.
- source_word: τῆς δεξιᾶς
  choice: kanang kamay
  rationale: Sa kayariang ito, ang δεξιά ay tumutukoy sa kanang kamay, hindi lamang sa kanang panig, kaya napapanatili ang kongkretong larawan ng pangitain.
- source_word: τοῦ καθημένου
  choice: ng nakaupo
  rationale: Ang substantival present participle ay natural na naipapahayag bilang “ang nakaupo.” Pinananatili nito ang patuloy na kalagayan at ang pagkakaiba ng Kordero sa tauhang nasa trono.
- source_word: ἐπὶ τοῦ θρόνου
  choice: sa trono
  rationale: Ang ἐπί ay lokatibo rito. Sa Filipino, ang “nakaupo sa trono” ang natural na pahayag; hindi kailangan ang mas literal ngunit mabigat na “nakaupo sa ibabaw ng trono.”
theological_decisions:
- issue: Hindi tahasang binanggit na tuwirang layon ng εἴληφεν
  choice: Tahasan ang “ang balumbon,” na tumutukoy sa balumbon sa agarang konteksto.
  alternative: “Kinuha iyon” o “kumuha mula sa kanang kamay...”
  rationale: Iniiwan ng Griyego na pahiwatig ang layon dahil malinaw ito sa naunang talata. Ang “ang balumbon” ay mas malinaw at natural sa Filipino at hindi nagdaragdag ng bagong nilalaman.
- issue: Paglalarawan sa tauhang nasa trono
  choice: “ang nakaupo sa trono”
  alternative: “siya na nakaupo sa trono”
  rationale: Tapat ito sa participial construction, malinaw na ipinag-iiba ang Kordero at ang nakaupo sa trono, at hindi nagdaragdag ng paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kordero” mula sa agarang konteksto upang maging likas ang paksa sa Filipino, bagaman panghalip lamang ang nakapaloob sa anyo ng pandiwang Griyego. Walang arkaikong pananalita o denominasyonal na dagdag.
