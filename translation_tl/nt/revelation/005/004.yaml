  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: tl
  text: At labis akong umiyak, sapagkat walang natagpuang karapat-dapat magbukas ng balumbon[a] o tumingin dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat.” Ang salitang Griyego ay maaaring mangahulugang “balumbon” o “aklat,” ngunit higit na angkop sa sinaunang anyo at sa larawan ng pagbubukas sa tagpong ito ang “balumbon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari itong mangahulugan ng pagtingin sa loob nito, samakatuwid, sa nilalaman ng balumbon.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: At ... akong
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, habang ang tahasang panghalip ay likas na naipapahayag sa “akong.”
- source_word: ἔκλαιον
  choice: umiyak
  rationale: Ang aspektong di-ganap ay nagsasaad ng nagpapatuloy na pag-iyak sa nakaraang tagpo; sa natural na Tagalog, malinaw itong naihahatid ng “umiyak” sa konteksto nang hindi gumagamit ng mabigat na anyong progresibo.
- source_word: πολὺ
  choice: labis
  rationale: Pinatitindi nito ang pag-iyak nang hindi idinaragdag ang ideya ng paglakas ng tinig o kapaitan na hindi tahasang nasa Griyego.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng pag-iyak sa isang marangal ngunit karaniwang rehistro.
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: walang natagpuang karapat-dapat
  rationale: Pinananatili ang negatibong pahayag, ang pasibong “natagpuan,” at ang mabigat na diwa ng pagiging karapat-dapat.
- source_word: ἀνοῖξαι
  choice: magbukas
  rationale: Tuwirang ipinapahayag ang kilos na nangangailangan ng pagiging karapat-dapat.
- source_word: τὸ βιβλίον
  choice: ang balumbon
  rationale: Ang “balumbon” ang pinakatumpak na modernong salin para sa sinaunang rolyong nasa tagpo, bagaman maaari ring mangahulugang aklat ang salitang Griyego.
- source_word: οὔτε βλέπειν αὐτό
  choice: o tumingin dito
  rationale: Malapit ito sa payak na leksikal na kahulugan ng βλέπειν at pinananatili ang posibilidad na tumutukoy ito sa pagtingin sa balumbon o sa nilalaman nito.
theological_decisions:
- issue: Diwa ng ἄξιος sa makalangit na tagpo
  choice: karapat-dapat
  alternative: kuwalipikado; nararapat
  rationale: Hindi lamang kakayahang teknikal ang pinag-uusapan kundi ang katayuan at pagiging karapat-dapat upang isagawa ang layunin ng Diyos; pinananatili ito nang walang idinaragdag na paliwanag sa talata.
- issue: Anyo ng βιβλίον sa Pahayag 5
  choice: balumbon
  alternative: aklat
  rationale: Ang tagpo at ang kilos ng pagbubukas ay tumutugma sa sinaunang rolyo, ngunit kinikilala sa talababa ang mas malawak na saklaw ng salitang Griyego.
- issue: Saklaw ng βλέπειν αὐτό
  choice: tumingin dito
  alternative: suriin ang nilalaman nito
  rationale: Pinananatili ng pangunahing teksto ang tunay na kalabuan ng Griyego sa halip na tiyaking ang nilalaman mismo ang tinitingnan; inilalahad sa talababa ang posibleng kontekstuwal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sapagkat” at “karapat-dapat” upang mapanatili ang solemneng himig ng tagpo, habang iniwasan ang labis na pormal o makalumang balangkas.
