  to: At nang kunin niya ang balumbon, ang apat na nilalang na buháy at ang dalawampu't apat na matatanda ay nagpatirapa sa harap ng Kordero. Bawat isa ay may hawak na alpa[a] at mga gintong mangkok na punô ng insenso; ang mga ito ang mga panalangin ng mga banal.[b]
  rationale: Pinalitan lamang ang “matatandang pinuno” ng “mga matatanda” upang alisin ang di-tahasang idinagdag na ideya ng pamumuno. Pinanatili ang iba pang pahayag, kabilang ang saklaw na hindi sapilitang nilulutas ng “Bawat isa,” ang simbolikong equative clause, at ang mga umiiral na panandang talababa.
