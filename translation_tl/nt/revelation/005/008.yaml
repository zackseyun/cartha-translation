  verdict: revise
  source_fidelity: 'Kailangan ang isang maliit ngunit mahalagang pagwawasto: ang πρεσβύτεροι ay “mga matatanda/elders,” hindi “matatandang pinuno.” Ang pagdaragdag ng “pinuno” ay nagbibigay ng tungkuling hindi tahasang nasa Griyego. Tapat ang “balumbon,” “mga nilalang na buháy,” “Kordero,” “alpa,” “mga gintong mangkok,” at ang tuwirang pagkakakilanlan ng insenso at mga panalangin.'
  naturalness: Natural at marangal ang daloy sa modernong Filipino. Ang “nagpatirapa sa harap ng Kordero” ay malinaw at angkop sa tagpong pagsamba. Mas natural at mas tapat ang simpleng “mga matatanda” kaysa “matatandang pinuno.”
  terminology: Panatilihin ang “Kordero” bilang pamagat, “mga banal” para sa ἁγίων, at “alpa” na may talababa para sa “lira.” Ang “mga matatanda” ay hindi dapat palitan ng terminong nagpapahiwatig ng isang huling teknikal na katungkulan o ng pamumuno.
  issues:
