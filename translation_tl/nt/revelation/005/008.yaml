    issue: Ang “matatandang pinuno” ay mas malawak kaysa sa πρεσβύτεροι.
    rationale: Ang πρεσβύτεροι ay tumutukoy sa dalawampu't apat na elders/mga matatanda. Bagaman marangal ang kanilang paglalarawan sa pangitain, hindi tahasang isinasaad ng salita mismo na sila ay mga pinuno; kaya ang “pinuno” ay interpretibong dagdag.
