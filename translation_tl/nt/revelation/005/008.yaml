id: REV.5.8
reference: Revelation 5:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: tl
  text: At nang kunin niya ang balumbon, ang apat na nilalang na buháy at ang dalawampu't apat na matatanda ay nagpatirapa sa harap ng Kordero. Bawat isa ay may hawak na alpa[a] at mga gintong mangkok na punô ng insenso; ang mga ito ang mga panalangin ng mga banal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lira.”
    reason: lexical_alternative
  - marker: b
    text: O “mga taong banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: balumbon
  rationale: Sa tagpo ng Pahayag, tumutukoy ito sa sinaunang dokumentong nakarolyo; malinaw na naihahatid ng “balumbon” ang anyo at larawan nito.
- source_word: ζῷα
  choice: mga nilalang na buháy
  rationale: Tumutukoy ito sa mga makalangit na nilalang sa paligid ng trono, hindi sa mababangis na hayop; pinananatili rin nito ang diin sa kanilang pagiging buháy.
- source_word: πρεσβύτεροι
  choice: matatandang pinuno
  rationale: Ipinahihiwatig ng parirala ang marangal at kinatawang katayuan ng dalawampu't apat, habang iniiwasang ipasok ang mas huling teknikal na katungkulan sa iglesya.
- source_word: ἔπεσαν ἐνώπιον
  choice: nagpatirapa sa harap
  rationale: Ang “nagpatirapa” ay likas sa Filipino para sa kilos ng pagpupugay at pagsamba, at ang “sa harap” ay nagpapanatili ng spatial na diwa ng ἐνώπιον.
- source_word: ἀρνίου
  choice: Kordero
  rationale: Pinananatili ang kinikilalang titulong kristolohikal sa Pahayag at ang kaugnayan nito sa paghahain.
- source_word: ἔχοντες ἕκαστος
  choice: Bawat isa ay may hawak
  rationale: Pinananatili ang distributibong diin ng ἕκαστος at natural itong pakinggan sa modernong Filipino.
- source_word: κιθάραν
  choice: alpa
  rationale: Tumutukoy ito sa isang instrumentong de-kuwerdas; “alpa” ang nakagawiang salin sa tagpong ito, bagaman maaari ring “lira.”
- source_word: φιάλας χρυσᾶς
  choice: mga gintong mangkok
  rationale: Ang φιάλη ay mababaw na sisidlan o mangkok; mas malinaw ito sa modernong Filipino kaysa sa “sisidlang-bote.”
- source_word: γεμούσας θυμιαμάτων
  choice: punô ng insenso
  rationale: Likas na mass noun sa Filipino ang “insenso,” at tapat nitong inilalarawan ang laman ng mga mangkok.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: ang mga ito ang mga panalangin ng mga banal
  rationale: Direktang pinananatili ang equative identification ng Griyego at hindi ito pinahihinang gawing “kumakatawan sa.”
theological_decisions:
- issue: Simbolikong pagkakakilanlan ng insenso at mga panalangin
  choice: “ang mga ito ang mga panalangin”
  alternative: “ang mga ito ay kumakatawan sa mga panalangin”
  rationale: Tuwirang equative clause ang αἵ εἰσιν; dapat panatilihin ang matibay na pahayag ng apokaliptikong simbolismo sa halip na dagdagan ito ng paliwanag.
- issue: Kahulugan ng ἅγιοι
  choice: mga banal
  alternative: mga taong ibinukod para sa Diyos / bayan ng Diyos
  rationale: Ang “mga banal” ay tapat sa literal na diwa ng pagiging banal o itinalaga sa Diyos at hindi nito nililimitahan ang tinutukoy sa mga taong kalaunang pormal na kinilalang santo.
- issue: Saklaw ng “bawat isa”
  choice: Panatilihin ang malawak na pagkakaugnay nito sa naunang maramihang paksa
  alternative: Tahasan itong iugnay lamang sa dalawampu't apat na matatandang pinuno
  rationale: Ang anyong Griyego ay hindi tahasang nagpapakipot ng tinutukoy sa matatandang pinuno lamang; pinananatili ng salin ang sintaktikong tensiyon sa halip na lutasin ito sa pamamagitan ng interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagpatirapa” para sa kilos ng pagsamba, “matatandang pinuno” upang malinaw ang marangal na papel ng πρεσβύτεροι, at “mga banal” nang hindi ipinapasok ang ideya ng kalaunang pormal na kanonisasyon. Inilagay ang mga panandang talababa sa mismong mga salitang may leksikal na alternatibo.
