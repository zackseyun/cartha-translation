id: REV.5.9
reference: Revelation 5:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: tl
  text: 'At umaawit sila ng isang bagong awit:


    “Karapat-dapat kang kunin ang balumbon

    at buksan ang mga tatak nito,

    sapagkat pinaslang ka,

    at sa pamamagitan ng iyong dugo

    ay binili mo para sa Diyos ang mga tao[a]

    mula sa bawat lipi, wika, bayan, at bansa.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang nakasulat sa Griyego ang “mga tao,” ngunit ipinahihiwatig ito bilang layon ng “binili mo.”
    reason: textual_clarity
  - marker: b
    text: Sa literal, “mula sa bawat lipi at wika at bayan at bansa”—isang apat na bahaging pormula na nagbibigay-diin sa pandaigdigang saklaw ng mga binili.
    reason: cultural_note
lexical_decisions:
- source_word: ᾄδουσιν
  choice: umaawit sila
  rationale: Likas na isinasalin ang kasalukuyang panahunan bilang masiglang pangkasalukuyan sa salaysay; hindi dinaragdagan ng ideyang ‘papuri’ na wala sa pandiwa.
- source_word: ᾠδὴν καινὴν
  choice: isang bagong awit
  rationale: Karaniwan, malinaw, at pinananatili ang biblikal na motibo ng bagong awit.
- source_word: Ἄξιος εἶ
  choice: Karapat-dapat ka
  rationale: Natural na tuwirang pagpupugay sa makabagong Tagalog.
- source_word: τὸ βιβλίον
  choice: ang balumbon
  rationale: Tumutukoy ito sa sinaunang nakarolyong kasulatang may mga tatak, hindi sa makabagong aklat.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: buksan ang mga tatak nito
  rationale: Malapit sa siksik na pananalita ng Griyego. Ang ‘sirain ang mga tatak’ ay mas mapagpaliwanag kaysa sa mismong anyo ng teksto.
- source_word: ἐσφάγης
  choice: pinaslang ka
  rationale: Pinananatili ang marahas at may pahiwatig na panghandog na diwa ng σφάζω nang hindi gumagamit ng salitang ‘kinatay,’ na labis na nakatuon sa hayop sa karaniwang Tagalog.
- source_word: ἠγόρασας
  choice: bumili ka
  rationale: Pinananatili ang pangunahing komersiyal na kahulugan ng pandiwa; ang ‘tinubos’ ay posibleng teolohikal na pagpapakahulugan ngunit higit sa tahasang leksikal na anyo.
- source_word: τῷ θεῷ
  choice: para sa Diyos
  rationale: 'Malinaw na ipinahahayag ang datibong benepaktibo: ang mga binili ay para sa Diyos.'
- source_word: ἐν τῷ αἵματί σου
  choice: sa pamamagitan ng iyong dugo
  rationale: Natural na Tagalog para sa instrumental na gamit ng ἐν at pinananatili ang kongkretong wikang panghandog.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: mula sa bawat lipi, wika, bayan, at bansa
  rationale: Pinananatili ang apat na bahaging pormula at ang pandaigdigang saklaw nito. Ang ‘bayan’ ay natural na kolektibong katumbas ng λαός sa hanay na ito.
theological_decisions:
- issue: Hindi tahasang nakasaad ang tuwirang layon ng ‘bumili’ sa Griyegong sugnay
  choice: 'Idinagdag ang ipinahihiwatig na ‘mga tao’: ‘bumili ka para sa Diyos ng mga tao.’'
  alternative: 'Iwang di-tahas ang layon: ‘bumili ka para sa Diyos mula sa bawat lipi…’'
  rationale: Kailangan ng natural na pangungusap sa Tagalog ang layon, at malinaw sa konteksto na mga tao ang tinutukoy. Hindi nito nililimitahan ang saklaw nang higit sa sinasabi ng teksto.
- issue: Wikang pantubos sa ‘sa pamamagitan ng iyong dugo’
  choice: Panatilihin ang tahasang pagbanggit sa dugo nang walang idinagdag na sistematikong paliwanag.
  alternative: Ipaliwanag bilang ‘sa pamamagitan ng iyong kamatayan.’
  rationale: Dugo mismo ang tahasang binabanggit ng talata bilang paraan ng pagbili; hindi ito dapat palabuin o palitan ng mas pangkalahatang pahayag.
- issue: Diwa ng σφάζω kaugnay ng Kordero
  choice: Isinalin bilang ‘pinaslang.’
  alternative: ‘kinatay’ o ‘pinatay’
  rationale: Ang ‘pinaslang’ ay nagpapanatili ng marahas na pagkamatay at dignidad ng pahayag. Ang ‘kinatay’ ay mas lantad ang imaheng panghandog ngunit maaaring tumunog na di-likas o mapanlait sa Tagalog; ang ‘pinatay’ naman ay mas patag.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang ‘balumbon’ para sa sinaunang kasulatan, ‘tatak’ para sa mga seal, at maiikling linyang patula upang maipakita na awit ang sipi. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
