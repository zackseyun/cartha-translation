  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: tl
  text: At ang apat na nilalang na buhay ay nagsasabi, “Amen.” At nagpatirapa ang mga matatanda at sumamba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskritong nagdaragdag ng tahasang layon pagkatapos ng “sumamba,” gaya ng “sa Nabubuhay magpakailanman” o “sa kanya.” Sinusunod ng pangunahing teksto ang mas maikling pagbasa ng SBLGNT, na hindi tahasang binabanggit ang layon at ipinauunawa ito sa konteksto.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: mga nilalang na buháy
  rationale: Tumutukoy ito sa mga makalangit na nilalang sa paligid ng trono at pinananatili ang kaugnayan sa pangitain ni Ezekiel; ang tuldik sa “buháy” ay umiiwas sa pagbasa rito bilang “bahay.”
- source_word: ἔλεγον
  choice: patuloy na nagsasabi
  rationale: Ipinahihiwatig ng aspektong imperfect ang nagpapatuloy o inuulit na pagsasalita, na mas malinaw dito kaysa sa payak na “nagsabi.”
- source_word: Ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinikilalang liturhikal na pahayag sa halip na paliitin ang kahulugan nito sa isang paliwanag gaya ng “mangyari nawa.”
- source_word: πρεσβύτεροι
  choice: matatandang pinuno
  rationale: Sa Pahayag, isa itong titulo para sa kinikilalang pangkat sa langit, hindi lamang paglalarawan ng edad; malinaw sa karaniwang mambabasa ang “matatandang pinuno.”
- source_word: ἔπεσαν
  choice: nagpatirapa
  rationale: Likas at malinaw nitong ipinapahayag ang pisikal na pagkadapa o pagyukod sa lupa bilang kilos ng pagsamba.
- source_word: προσεκύνησαν
  choice: sumamba
  rationale: Sa tagpo sa silid-trono, ang pandiwa ay tumutukoy sa mapitagang pagsamba, hindi lamang sa pisikal na pagyukod.
theological_decisions:
- issue: Hindi tahasang binanggit ang sinasamba
  choice: Panatilihin ang ganap na gamit na “sumamba” nang walang tahasang layon.
  alternative: “sumamba sa kanya,” “sumamba sa Diyos,” o “sumamba sa nabubuhay magpakailanman”
  rationale: Nagtatapos ang tekstong SBLGNT sa προσεκύνησαν nang walang ipinahayag na layon. Natural din ito sa Tagalog, kaya hindi kailangang magdagdag ng salitang mula sa ibang tradisyon ng teksto o ipasok ang isang pagpapakahulugan mula sa konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “patuloy na nagsasabi” upang maipakita ang aspektong imperfect, at “nagpatirapa” upang natural na maipahayag ang kilos ng pagpapatirapa sa pagsamba.
