  naturalness: Natural at marangal ang pangungusap matapos gawing “mga matatanda,” ang karaniwang Filipino/Tagalog na katawagan para sa pangkat na ito sa Pahayag. Ang “ay nagsasabi” ay sapat na nagpapahiwatig ng di-ganap na aspekto nang hindi masyadong binibigyang-diin ang pagpapatuloy sa “patuloy na.”
  terminology: 'Mas angkop ang “mga matatanda” para sa πρεσβύτεροι: pinananatili nito ang kinikilalang titulo at iniiwasan ang interpretatibong dagdag na “pinuno.” Ang “mga nilalang na buhay,” “Amen,” “nagpatirapa,” at “sumamba” ay angkop.'
