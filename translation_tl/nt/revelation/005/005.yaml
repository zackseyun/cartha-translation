id: REV.5.5
reference: Revelation 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: tl
  text: At sinabi sa akin ng isa sa mga matatanda, “Huwag kang umiyak. Tingnan mo, nagtagumpay ang Leon mula sa lipi ni Juda, ang Ugat ni David, upang buksan ang balumbon at ang pitong tatak nito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: mga matatanda
  rationale: Sa Pahayag, tumutukoy ito sa kinikilalang pangkat sa makalangit na tagpo, hindi lamang sa mga lalaking may edad. Ang “mga matatanda” ang natural at karaniwang tawag sa ganitong tungkulin sa Tagalog.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman pangkasalukuyan ang Griyego bilang makulay na narrative present, mas natural sa salaysay na Tagalog ang pangnagdaang “sinabi.”
- source_word: Μὴ κλαῖε
  choice: Huwag kang umiyak
  rationale: Natural at marangal itong katumbas ng pagbabawal na umiyak; hindi nito ipinipilit ang posibleng diwang “tumigil ka sa pag-iyak.”
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Nananawagan ito ng pansin. Ang “Tingnan mo” ay malinaw at makabagong Tagalog nang hindi gumagamit ng arkaikong pananalita.
- source_word: ἐνίκησεν
  choice: nagtagumpay
  rationale: Pinananatili nito ang mahalagang tema ng tagumpay sa Pahayag. Mas natural ito sa Tagalog kaysa sa literal na “nanakop,” na maaaring magpahiwatig lamang ng militar o teritoryal na pananakop.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: ang Leon mula sa lipi ni Juda
  rationale: Ang “mula sa” ay tuwirang kumakatawan sa ἐκ at ipinakikita ang kaugnayan o pinagmulan niya sa lipi ni Juda.
- source_word: ἡ ῥίζα Δαυίδ
  choice: ang Ugat ni David
  rationale: Pinananatili ang matalinghagang mesiyanikong titulo at ang ugnayan nito sa mga larawan sa Kasulatan; ginamit ang malaking titik bilang titulo.
- source_word: ἀνοῖξαι
  choice: upang buksan
  rationale: Pinananatili ang ugnayan ng infinitive sa naunang tagumpay nang hindi idinaragdag ang tahasang ideya ng kakayahan o pagiging karapat-dapat.
- source_word: τὸ βιβλίον
  choice: ang balumbon
  rationale: Sa tagpong ito, ang tinutukoy ay isang scroll, kaya mas tumpak sa kasaysayan at konteksto ang “balumbon” kaysa “aklat.”
- source_word: σφραγῖδας
  choice: mga tatak
  rationale: Ang “tatak” ang natural na Tagalog para sa mga seal na nagsasara at nagpapatunay sa balumbon.
- source_word: αὐτοῦ
  choice: nito
  rationale: Malinaw na tumutukoy ito sa balumbon at natural na ipinahahayag ang pagmamay-ari o pagkakaugnay sa Tagalog.
theological_decisions:
- issue: Mga maharlika at mesiyanikong titulong inilalapat kay Jesus
  choice: 'Panatilihin nang tuwiran ang dalawang titulo: “ang Leon mula sa lipi ni Juda, ang Ugat ni David.”'
  alternative: Ipaliwanag o isapaliwanag sa paraphrase ang isa o kapwa titulo.
  rationale: Sadyang pinagsasama ng talata ang dalawang titulong nakaugat sa Kasulatan ng Israel. Ang tuwirang salin ay nagpapanatili sa mesiyanikong bigat nang walang idinadagdag na paliwanag na wala sa teksto.
- issue: Lakas at gamit ng ἀνοῖξαι pagkatapos ng ἐνίκησεν
  choice: Isalin bilang “nagtagumpay ... upang buksan.”
  alternative: “nagtagumpay ... kaya mabubuksan niya” o “nagtagumpay ... at maaari niyang buksan.”
  rationale: Ang “upang buksan” ay malapit sa infinitive at pinananatili ang posibleng layunin o bunga nang hindi tahasang nilulutas ang sintaktikong ambiguwidad o idinaragdag ang konsepto ng kakayahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang arkaikong “Narito” para sa ἰδού at ang sobrang teknikal na wika. Ang “Leon” at “Ugat” ay ginawang malaking titik dahil gumaganap ang mga ito bilang mga titulo sa konteksto.
