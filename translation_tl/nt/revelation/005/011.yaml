  source_fidelity: Kailangang baguhin ang “matatandang pinuno” para sa πρεσβυτέρων. Ang “pinuno” ay nagdaragdag ng katungkulan o awtoridad na hindi tahasang sinasabi ng salita sa talata. Tumpak ang “tumitingin ako,” “narinig ko,” “tinig,” “mga buháy na nilalang,” at ang pagkakalagay ng mga anghel sa palibot ng trono, mga nilalang, at mga matatanda. Ang bilang ay dapat panatilihing pormulang paulit-ulit at hindi gawing isang tiyak na modernong bilang lamang.
  naturalness: Marangal at malinaw ang pangungusap. Ang “mga matatanda” ay natural sa rehistrong biblikal at mas tapat kaysa “matatandang pinuno.” Ang “mga laksa ng mga laksa at mga libo ng mga libo” ay sadyang pormal ngunit angkop sa apokaliptikong pormula; nililinaw ito ng talababa.
  terminology: Pinanatili ang “mga buháy na nilalang” para sa ζῷα. Ginamit ang “mga matatanda” para sa πρεσβύτεροι nang walang idinagdag na denominasyonal o pampamahalaang titulo. Ginamit ang “laksa” bilang katumbas ng μυριάς at ipinaliwanag sa talababa ang literal na bilang at idyomatikong bisa nito.
