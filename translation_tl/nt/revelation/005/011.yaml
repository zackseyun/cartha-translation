  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: tl
  text: At tumingin ako,[a] at narinig ko ang tinig ng maraming anghel sa palibot ng trono, ng mga buháy na nilalang, at ng mga matatanda; at ang bilang nila ay mga laksa ng mga laksa at mga libo ng mga libo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakita ko.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga laksa ng mga laksa at mga libo ng mga libo,” isang pahayag para sa napakalaking karamihan. Ang isang laksa ay sampung libo; maaari ring isalin nang mas literal na “sampung libo ng mga sampung libo at libo ng mga libo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: tumingin ako
  rationale: Sa daloy ng pangitain, inilalarawan muna ni Juan ang pagbaling ng pansin bago niya sabihin ang narinig niya. Posible rin ang “nakita ko,” kaya inilagay ito sa talababa.
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Likas at tuwirang salin ng pandiwang pandinig sa nagdaang salaysay.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: ang tinig ng maraming anghel
  rationale: Pinananatili ang personal na katangian ng narinig at ang tahasang pagtukoy sa maraming anghel.
- source_word: κύκλῳ
  choice: sa palibot
  rationale: Maikli at natural na pahayag ng ayos na nakapaligid sa trono at sa iba pang mga nilalang.
- source_word: τῶν ζῴων
  choice: ng mga buháy na nilalang
  rationale: Ipinakikitang natatanging mga nilalang sa pangitain ang tinutukoy, hindi karaniwang mga hayop.
- source_word: τῶν πρεσβυτέρων
  choice: ng matatandang pinuno
  rationale: Mas malinaw sa karaniwang mambabasa kaysa “matatanda” lamang at ipinahihiwatig ang katayuan ng mga tauhang ito sa eksena nang hindi nag-aangkat ng tiyak na katungkulan sa isang denominasyon.
- source_word: μυριάδες μυριάδων
  choice: laksa-laksang laksa
  rationale: Ginagamit ang salitang “laksa” para sa napakalaking bilang at ginagaya ang mariing paulit-ulit na anyo ng Griyego; ipinaliliwanag sa talababa ang mas literal na halaga at diwang napakaraming karamihan.
- source_word: χιλιάδες χιλιάδων
  choice: libo-libong libo
  rationale: Pinananatili ang paulit-ulit na pormula ng orihinal sa paraang mauunawaan sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa ζῷα sa tagpo sa paligid ng trono
  choice: mga buháy na nilalang
  alternative: mga nilalang; mga buháy na nilikha
  rationale: Pinananatili nito ang natatanging identidad ng apat na nilalang sa pangitain at iniiwasang ipakahulugan silang ordinaryong mga hayop.
- issue: Pagkilala sa πρεσβύτεροι
  choice: matatandang pinuno
  alternative: mga matanda; mga elder
  rationale: Ipinahahayag ang kahulugan ng katayuan sa eksena nang hindi itinatali ang mga tauhan sa isang makabagong denominasyonal na tungkulin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “buháy” na may tuldik upang malinaw na pang-uri ito. Pinanatili sa talababa ang paliwanag sa sadyang napakalaking bilang.
