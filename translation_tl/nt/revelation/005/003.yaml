  terminology: Ang “balumbon” ay angkop sa sinaunang imahen ng βιβλίον sa pangitain; ang “aklat” ay wastong mapananatili bilang alternatibong leksikal sa talababa. Walang doktrinal na pagpapalawak ang idinagdag.
