source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: tl
  text: At walang sinuman—maging sa langit, sa lupa, o sa ilalim ng lupa—ang makapagbukas ng balumbon ni makatingin man dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat.” Maaaring tumukoy ang salitang Griyego sa isang nakasulat na dokumento sa pangkalahatan, ngunit sa tagpong ito, “balumbon” ang higit na angkop sa sinaunang larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: walang sinuman
  rationale: Likas at marangal na katumbas ng ganap na negatibong panghalip; saklaw nito ang sinumang nilalang sa tatlong binanggit na dako.
- source_word: ἐδύνατο
  choice: nakapagbukas … o nakatingin
  rationale: Ang diwa ng kakayahan ng ἐδύνατο ay natural na ipinahahayag sa Filipino sa pamamagitan ng panlaping makapag-/maka-; ipinakikita ng aspektong naganap ang kawalan ng kakayahan sa isinasalaysay na tagpo.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Karaniwan at malinaw na salin na nagpapanatili sa unang bahagi ng tatluhang paglalarawan ng kosmos.
- source_word: ἐπὶ τῆς γῆς
  choice: sa ibabaw ng lupa
  rationale: Pinananatili ang lokatibong diwa ng ἐπί at ang kaibahan nito sa ‘sa ilalim ng lupa.’
- source_word: ὑποκάτω τῆς γῆς
  choice: sa ilalim ng lupa
  rationale: 'Tuwirang salin na nagpapanatili sa tatluhang saklaw: langit, ibabaw ng lupa, at ilalim ng lupa.'
- source_word: ἀνοῖξαι
  choice: magbukas
  rationale: Payak at tuwirang katumbas ng infinitibong ‘buksan’; lumilitaw bilang ‘nakapagbukas’ dahil sa pagsasama nito sa ἐδύνατο.
- source_word: τὸ βιβλίον
  choice: ang balumbon
  rationale: Sa sinaunang tagpong pangitain, malamang na balumbon ang tinutukoy kaysa makabagong aklat na may mga pahina; pinananatili sa talababa ang mas malawak na alternatibo.
- source_word: οὔτε βλέπειν αὐτό
  choice: o nakatingin man dito
  rationale: Ang ‘o … man’ ay natural na Filipino para sa ikalawang negatibong infinitibo at bahagyang ipinadarama ang tumitinding punto nang hindi idinaragdag ang tahasang ‘kahit.’ Ang ‘nakatingin’ ay mas angkop kaysa simpleng ‘nakakita,’ sapagkat maaaring tumukoy sa sadyang pagtingin o pagsusuri.
theological_decisions:
- issue: Saklaw ng mga hindi makapagbukas sa balumbon
  choice: Panatilihin ang tatluhang pananalitang ‘sa langit, ni sa ibabaw ng lupa, ni sa ilalim ng lupa.’
  alternative: Ibuod bilang ‘saanman sa sangnilikha.’
  rationale: Idinidiin ng teksto ang pangkalahatang kawalan ng kakayahan sa pamamagitan ng larawang kosmiko. Ang pagpapanatili rito ay hindi nagpapasya kung anong tiyak na mga uri ng nilalang ang nasa bawat dako.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang magkakatugmang ‘sa langit, ni sa ibabaw ng lupa, ni sa ilalim ng lupa’ upang luminaw ang kosmikong tatluhan. Ang ‘balumbon’ ay mas tiyak sa makasaysayang larawan, habang kinikilala sa talababa ang ‘aklat.’
