base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: tl
  text: At nakita ko sa kanang kamay ng nakaupo sa trono ang isang balumbon[a] na may nakasulat kapwa sa loob at sa likod nito[b], at natatakan ng pitong tatak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat.” Ang salitang Griyego na βιβλίον ay malamang na tumutukoy rito sa isang balumbon, hindi sa aklat na binubuo ng magkakabit na pahina.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa loob at sa likod.” Isinasalin ng ilang salin ang ikalawang parirala sa mas pangkalahatang paraan bilang “sa labas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang isinasalin ang aorist na pandiwang pasalaysay sa natural na nagdaang aspekto sa Tagalog.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: sa kanang kamay
  rationale: Bagaman maaaring literal na 'sa ibabaw ng kanang kamay,' ipinahihiwatig ng idyoma ang kinalalagyan o paghawak; natural at sapat ang 'sa kanang kamay' nang hindi tiyak na sinasabing mahigpit itong hawak.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: ng nakaupo sa trono
  rationale: Pinananatili ang deskriptibong pagtukoy sa tauhan at hindi nagdaragdag ng tahasang banal na pangalan na wala sa Griyego.
- source_word: βιβλίον
  choice: balumbon
  rationale: Sa konteksto ng unang siglo at sa larawang may sulat sa magkabilang panig at may mga tatak, malamang na balumbon ang tinutukoy kaysa makabagong anyo ng aklat.
- source_word: γεγραμμένον
  choice: may nakasulat
  rationale: Natural na Tagalog ito para sa perpektong pasibong participle na naglalarawan sa nananatiling kalagayang nasulatan.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: sa loob at sa likod
  rationale: Pinananatili ang kongkretong larawan ng sulat sa panloob na bahagi at sa likod o kabilang panig ng balumbon, sa halip na gawing mas pangkalahatang 'labas.'
- source_word: κατεσφραγισμένον
  choice: natatakan
  rationale: Ipinahahayag ang natapos at nananatiling kalagayan ng pagkakatatak nang natural sa Tagalog.
- source_word: σφραγῖσιν ἑπτά
  choice: ng pitong tatak
  rationale: Malinaw na ipinakikita ang bilang at ang paraang ginamit sa pagtatatak; idiomatiko ang 'natatakan ng pitong tatak.'
theological_decisions:
- issue: Paglalarawan sa nakaupo sa trono
  choice: ang nakaupo sa trono
  alternative: ang Diyos na nakaupo sa trono
  rationale: Deskriptibo lamang ang Griyego at hindi tahasang pinapangalanan ang tauhan sa talatang ito; pinananatili ng salin ang pampanitikan at teolohikal na pagpipigil ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'balumbon' bilang tumpak ngunit madaling maunawaang terminong pangkasaysayan; iniwasan ang sobrang arkaikong ayos at ang pagdaragdag ng interpretasyong teolohikal.
