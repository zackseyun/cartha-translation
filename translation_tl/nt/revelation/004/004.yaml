id: REV.4.4
reference: Revelation 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: tl
  text: At nakapalibot sa trono ay dalawampu't apat na trono. Sa mga trono ay nakaupo ang dalawampu't apat na matatanda, na nakasuot ng mga puting kasuotan at may mga koronang ginto[a] sa kanilang mga ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gintong putong.” Ang salitang Griyego ay maaaring tumukoy sa korona o putong na iginagawad bilang parangal o tanda ng tagumpay, hindi lamang sa isang maharlikang korona.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: nakapalibot sa
  rationale: Malinaw at likas na ipinahahayag nito ang ayos na nakapaligid sa gitnang trono.
- source_word: θρόνοι
  choice: mga trono
  rationale: Inuulit sa Griyego ang parehong salitang ginamit para sa gitnang trono; pinananatili ng “mga trono” ang maharlika at panghukumang larawan, sa halip na pahinain ito bilang “mga upuan.”
- source_word: εἴκοσι τέσσαρες
  choice: dalawampu't apat
  rationale: Karaniwang makabagong anyo ng bilang sa Filipino.
- source_word: πρεσβυτέρους
  choice: mga matatanda
  rationale: Pinananatili ang katawagan sa pangkat na ito nang hindi ipinapaliwanag kung sila ay mga tao, anghel, o mga kinatawan ng isang partikular na bayan.
- source_word: καθημένους
  choice: nakaupo
  rationale: Likas na Filipino para sa kalagayan o postura ng mga matatanda sa mga trono.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: nakasuot ng mga puting kasuotan
  rationale: Ipinahahayag ang patuloy na kalagayan ng pagkakadamit at hindi nililimitahan ang malawak na ἱμάτια sa mas tiyak na “mga balabal.”
- source_word: στεφάνους χρυσοῦς
  choice: mga koronang ginto
  rationale: Ang “korona” ang pinakalinaw at karaniwang katumbas sa konteksto, samantalang inilalahad sa talababa ang posibleng diwang putong na iginagawad bilang parangal o tagumpay.
theological_decisions:
- issue: Kalikasan ng dalawampu't apat na θρόνοι
  choice: Isinalin bilang “mga trono.”
  alternative: “Mga upuan.”
  rationale: Parehong θρόνος ang ginamit para sa gitnang trono at sa dalawampu't apat na nakapaligid dito. Pinananatili ng salin ang ugnayang leksikal at ang maharlika o panghukumang larawan nang hindi ipinapantay ang mga ito sa gitnang trono.
- issue: Pagkakakilanlan ng dalawampu't apat na matatanda
  choice: Iniwan bilang “mga matatanda” nang walang dagdag na paliwanag sa teksto.
  alternative: Mga kinatawan ng iglesya, mga anghel, o mga kinatawan ng Israel at ng mga apostol.
  rationale: Tinatawag sila ng talata na πρεσβύτεροι ngunit hindi nito tahasang sinasabi kung sino sila; kaya hindi nagpasok ang salin ng isang partikular na teolohikal na pagpapakahulugan.
- issue: Diwa ng στεφάνους
  choice: “Mga korona,” na may paliwanag sa talababa.
  alternative: “Mga putong ng tagumpay” o “mga putong ng karangalan.”
  rationale: Maaaring tumukoy ang στέφανος sa putong o koronang iginagawad bilang parangal o tagumpay, hindi lamang sa sagisag ng paghahari. Pinananatili ng pangunahing teksto ang maikli at likas na salita habang iniiwasan ng talababa ang sobrang pagtitiyak.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Hinati sa dalawang pangungusap ang mahabang Griyegong pangungusap upang maging malinaw sa karaniwang mambabasa, ngunit pinanatili ang pagkakasunod-sunod at mga pangunahing larawan ng pangitain.
