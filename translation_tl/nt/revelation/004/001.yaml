id: REV.4.1
reference: Revelation 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: tl
  text: Pagkatapos ng mga bagay na ito[a], nakita ko, at narito, isang pintuang nakabukas sa langit. At ang unang tinig na narinig ko[b], na tulad ng trumpeta ang tunog habang nagsasalita sa akin[c], ay nagsabi, “Umakyat ka rito, at ipapakita ko sa iyo ang mga bagay na kailangang mangyari pagkatapos ng mga bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas idiomatiko: “Pagkatapos nito … pagkatapos nito.” Inuulit ng Griyego ang maramihang pariralang “pagkatapos ng mga bagay na ito” sa simula at wakas ng talata.'
    reason: lexical_alternative
  - marker: b
    text: Ang “unang tinig” ay malamang na tumutukoy sa tinig na naunang narinig ni Juan (tingnan ang Pahayag 1:10).
    reason: cross_reference
  - marker: c
    text: O “nakikipag-usap sa akin.” Mas literal sa Griyego ang “nagsasalitang kasama ko,” bagaman mas natural sa Filipino ang “nagsasalita sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang maramihang anyo at ang sinadyang pag-uulit ng parirala sa simula at wakas ng talata, nang hindi tinutukoy kung ang pagkakasunod ay pampanitikan, pangitain, o pangkasaysayan.
- source_word: εἶδον
  choice: tumingin ako
  rationale: Bagaman karaniwang nangangahulugang ‘nakita ko,’ mas natural kasama ng kasunod na ἰδοὺ ang ‘tumingin ako’ at nananatili ang diwa ng pansin sa pangitain.
- source_word: ἰδοὺ
  choice: narito
  rationale: Isang marangal ngunit nauunawaang pananda na tumatawag ng pansin sa biglang tanawin.
- source_word: θύρα ἠνεῳγμένη
  choice: may isang pintong nakabukas
  rationale: Ipinahahayag ng ‘nakabukas’ ang kasalukuyang kalagayang bunga ng naunang pagbubukas, gaya ng perfect passive participle.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Ang konteksto ay ang makalangit na dako, hindi lamang ang nakikitang himpapawid.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: ang unang tinig
  rationale: Pinananatili ang tahasang paglalarawan na ‘una’ at ang malamang na pagtukoy pabalik sa naunang tinig sa Pahayag 1:10.
- source_word: ὡς σάλπιγγος
  choice: gaya ng isang trumpeta
  rationale: Pinananatiling paghahambing, hindi pagkakakilanlan, ang ugnayan ng tinig at trumpeta.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: nakikipag-usap sa akin
  rationale: Inilalarawan nang natural sa Filipino ang literal na diwang ‘nagsasalitang kasama ko,’ habang ang talababa ay nagbibigay ng mas karaniwang alternatibong ‘nagsasalita sa akin.’
- source_word: Ἀνάβα ὧδε
  choice: Umakyat ka rito
  rationale: Direkta at natural na utos na nagpapahiwatig ng pag-akyat patungo sa kinaroroonan ng nagsasalita.
- source_word: ἃ δεῖ γενέσθαι
  choice: ang mga bagay na kailangang mangyari
  rationale: Pinananatili ang diwa ng kinakailangang mangyari nang hindi ipinapaliwanag ang pinagmulan o uri ng pangangailangang iyon.
theological_decisions:
- issue: Temporal na bisa ng inuulit na μετὰ ταῦτα
  choice: Parehong isinalin bilang ‘pagkatapos ng mga bagay na ito.’
  alternative: ‘Pagkatapos nito’ sa isa o dalawang paglitaw.
  rationale: Ang eksaktong pag-uulit ay nagpapanatili sa temporal na pananalita at hindi nagpapataw ng isang partikular na iskema tungkol sa mga huling panahon.
- issue: Pagkakakilanlan ng ‘unang tinig’
  choice: Hindi tahasang kinilala sa pangunahing teksto; pinanatili bilang ‘ang unang tinig.’
  alternative: ‘Ang tinig na una kong narinig,’ na mas tuwirang nagpapakahulugang ito rin ang tinig sa Pahayag 1:10.
  rationale: Malamang ang pagtukoy pabalik, ngunit hindi dapat palitan ng salin ang mismong pormulasyon ng Griyego; sapat ang paliwanag sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino, may bahagyang mataas na himig na angkop sa pangitain. Ginamit ang ‘narito’ upang mapanatili ang biglang pagtawag-pansin ng ἰδοὺ, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
