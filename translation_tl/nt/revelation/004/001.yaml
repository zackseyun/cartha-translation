revisions:
- from: Pagkatapos ng mga bagay na ito[a], tumingin ako, at narito, may isang pintong nakabukas sa langit. At ang unang tinig na narinig ko[b], na gaya ng isang trumpeta na nakikipag-usap sa akin[c], ay nagsabi, “Umakyat ka rito, at ipapakita ko sa iyo ang mga bagay na kailangang mangyari pagkatapos ng mga bagay na ito.”
  to: Pagkatapos ng mga bagay na ito[a], nakita ko, at narito, isang pintuang nakabukas sa langit. At ang unang tinig na narinig ko[b], na tulad ng trumpeta ang tunog habang nagsasalita sa akin[c], ay nagsabi, “Umakyat ka rito, at ipapakita ko sa iyo ang mga bagay na kailangang mangyari pagkatapos ng mga bagay na ito.”
  rationale: Binago ang salin upang ang paghahambing sa trumpeta ay malinaw na tumukoy sa tunog ng tinig, hindi sa isang trumpeta na umano’y nagsasalita. Pinalitan din ang “tumingin ako” ng “nakita ko” para sa mas tuwirang pagtugon sa εἶδον, at inayos ang parirala tungkol sa pintuan para sa natural na modernong Filipino. Hindi binago ang temporal na pag-uulit o ang saklaw ng “kailangang mangyari.”
