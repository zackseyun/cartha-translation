id: REV.4.11
reference: Revelation 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: tl
  text: Karapat-dapat ka[a], aming Panginoon at Diyos, na tumanggap ng kaluwalhatian, karangalan, at kapangyarihan, sapagkat nilikha mo ang lahat ng bagay, at dahil sa iyong kalooban[b] ay umiiral at nilikha ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ikaw ay karapat-dapat.” Inilalagay muna sa Griyego ang salitang “karapat-dapat” bilang pagbibigay-diin.
    reason: word_order_alternative
  - marker: b
    text: Maaari ring isalin na, “sa pamamagitan ng iyong kalooban.” Ang pariralang Griyego ay karaniwang nagpapahiwatig ng dahilan (“dahil sa”), ngunit maaari ring unawain bilang paraan o kasangkapan (“sa pamamagitan ng”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Karapat-dapat ka
  rationale: Tuwirang ipinahahayag ng pang-uring ἄξιος kasama ng εἶ ang pagiging karapat-dapat ng kinakausap. Inilalagay sa unahan ang “Karapat-dapat” upang mapanatili ang diin ng Griyego habang nananatiling natural sa Tagalog.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: aming Panginoon at Diyos
  rationale: Ang mga titulong may pantukoy ay ginagamit dito bilang tuwirang pagtawag. Pinananatili ng “aming” ang ἡμῶν at malinaw na kapwa tumutukoy ang “Panginoon” at “Diyos” sa kinakausap.
- source_word: λαβεῖν
  choice: na tumanggap
  rationale: Ang pawatas ay nagsasaad ng nararapat tanggapin ng kinakausap; ang “tumanggap” ay angkop sa konteksto ng pagsamba at pagpupugay.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: ng kaluwalhatian, karangalan, at kapangyarihan
  rationale: Pinananatili ang tatluhang talaan at ang mataas ngunit madaling maunawaang bokabularyo. Hindi na inuulit ang panandang “ng” bago sa bawat pangngalan dahil mas natural ito sa modernong Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan kung bakit karapat-dapat ang Diyos; ang “sapagkat” ay marangal at natural sa ganitong doxolohikal na pahayag.
- source_word: ἔκτισας τὰ πάντα
  choice: nilikha mo ang lahat ng bagay
  rationale: Tuwirang isinasalin ang κτίζω bilang “lumikha” at pinananatili ang ganap na saklaw ng τὰ πάντα bilang “lahat ng bagay.”
- source_word: διὰ τὸ θέλημά σου
  choice: dahil sa iyong kalooban
  rationale: Karaniwang nagpapahayag ng sanhi o dahilan ang διά na may akusatibo. Pinananatili ng “dahil sa” ang ugnayang ito nang hindi ipinipilit na kasangkapan ang kahulugan.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: umiral at nilikha ang mga ito
  rationale: 'Magkahiwalay na pinananatili ang dalawang pandiwa: ang ἦσαν bilang “umiral” at ang pasibong ἐκτίσθησαν bilang “nilikha.” Ang “ang mga ito” ay tumutukoy sa lahat ng bagay at umiiwas sa paggamit ng “sila” para sa mga bagay.'
theological_decisions:
- issue: Ang anyo ng tuwirang pagtawag sa Diyos
  choice: aming Panginoon at Diyos
  alternative: Panginoon namin at aming Diyos
  rationale: Ang parirala ay gumaganap bilang tuwirang pagtawag sa nakaupo sa trono. Ang napiling anyo ay maikli, natural, at hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Ang kaugnayan ng kalooban ng Diyos sa pag-iral at pagkalikha
  choice: dahil sa iyong kalooban ay umiral at nilikha ang mga ito
  alternative: sa pamamagitan ng iyong kalooban ay umiral at nilikha ang mga ito
  rationale: Mas malamang na sanhi o dahilan ang ipinahahayag ng διά + akusatibo, ngunit tunay na posible ang instrumental na pagbasa. Pinananatili sa talababa ang alternatibo upang hindi isara ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pagsamba, ngunit malinaw sa karaniwang mambabasa. Pinanatili ang diin sa “Karapat-dapat,” ang tatluhang ritmo ng papuri, at ang dalawang magkahiwalay na pandiwa sa hulihan.
