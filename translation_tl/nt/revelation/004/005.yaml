  to: At mula sa trono ay lumalabas ang mga kislap ng kidlat, mga tunog[a], at mga dagundong ng kulog; at sa harap ng trono ay may pitong ilawan ng apoy na nagniningas[b], at ang mga ito ay ang pitong espiritu ng Diyos.[c]
