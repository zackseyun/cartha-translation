  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: tl
  text: At mula sa trono ay lumalabas ang mga kislap ng kidlat, mga tunog[a], at mga dagundong ng kulog; at sa harap ng trono ay may pitong ilawan ng apoy na nagniningas[b], at ang mga ito ay ang pitong espiritu ng Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tinig.”
    reason: lexical_alternative
  - marker: b
    text: O “pitong sulo ng apoy na nagniningas sa harap ng trono.”
    reason: lexical_alternative
  - marker: c
    text: Nauunawaan ito ng marami bilang sagisag ng kapuspusan ng iisang Banal na Espiritu; ngunit literal na “pitong espiritu” ang mababasa sa tekstong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: lumalabas
  rationale: Tuwirang ipinahahayag na ang mga penomeno ay nagmumula at lumalabas mula sa trono; pinananatili rin ang pangkasalukuyang aspekto ng Griyego.
- source_word: ἀστραπαὶ
  choice: mga kislap ng kidlat
  rationale: Likas sa modernong Tagalog at malinaw na naihahatid ang maramihan at paulit-ulit na anyo ng kidlat.
- source_word: φωναὶ
  choice: mga tunog
  rationale: Maaaring mangahulugang “mga tinig” o mas pangkalahatang “mga tunog.” Sa hanay na may kidlat at kulog, hindi ipinapalagay ng “mga tunog” na may nagsasalita, habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: βρονταί
  choice: mga dagundong ng kulog
  rationale: Likas at malinaw na salin na nagpapanatili sa maramihan at paulit-ulit na malalakas na ugong ng kulog.
- source_word: λαμπάδες πυρὸς
  choice: mga ilawan ng apoy
  rationale: Pinananatili ang larawan at pormal na ugnayan ng “mga ilawan” at “apoy.” Posible rin ang “mga sulo,” kaya inilagay iyon sa talababa.
- source_word: καιόμεναι
  choice: na nagliliyab
  rationale: Ipinahahayag ang patuloy at matingkad na pagliyab ng pitong ilawan.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: sa harap ng trono
  rationale: Karaniwan, maikli, at likas na pananalita para sa puwesto ng mga ilawan sa tagpo.
- source_word: ἅ εἰσιν
  choice: ang mga ito ang
  rationale: Malinaw na inuugnay ang pitong ilawan sa sumunod na simbolikong pagkakakilanlan nang hindi dinaragdagan ang kahulugan.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: ang pitong espiritu ng Diyos
  rationale: Pinananatili ang tahasang maramihang anyo ng Griyego at hindi isinasalin ang isang posibleng interpretasyon na “pitong-anyo” o kapuspusan ng iisang Espiritu.
theological_decisions:
- issue: Pagpapakahulugan sa τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: “ang pitong espiritu ng Diyos” sa pangunahing teksto
  alternative: “ang pitong-anyo na Espiritu ng Diyos” o sagisag ng kapuspusan ng iisang Banal na Espiritu
  rationale: Tahasang maramihan ang Griyego. Ang paggamit ng isahang “Espiritu” ay magpapasya sa isang interpretasyon na hindi tahasang nilulutas ng teksto; kaya pinananatili sa salin ang teolohikal na tensiyon at inilalahad lamang sa talababa ang karaniwang simbolikong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga tunog” upang mapanatili ang lawak ng φωναί, at ang “mga ilawan ng apoy” upang manatiling malapit sa larawan ng Griyego. Lahat ng pananda ng talababa ay nasa pangunahing teksto.
