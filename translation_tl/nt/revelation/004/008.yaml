id: REV.4.8
reference: Revelation 4:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: tl
  text: 'At ang apat na nilalang na buhay ay may tig-aanim na pakpak; bawat isa sa kanila ay punô ng mga mata sa palibot at sa loob. Wala silang pahinga araw at gabi habang sinasabi nila: “Banal, banal, banal ang Panginoong Diyos, ang Makapangyarihan sa Lahat, na siya noon, siya ngayon, at siyang dumarating.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “na siya noon, siya ngayon, at siyang darating.”
    reason: alternative_reading
lexical_decisions:
- source_word: ζῷα
  choice: mga nilalang na buhay
  rationale: Tumutukoy ito sa mga buháy na nilalang sa langit sa pangitain, hindi sa karaniwang kahulugan ng mga hayop; pinananatili rin nito ang matitingkad na larawan ng teksto.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: bawat isa
  rationale: Likas at malinaw na ipinahahayag sa Filipino ang distributibong diin na ang paglalarawan ay totoo sa bawat nilalang.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: ay may anim na pakpak
  rationale: Tuwirang ipinakikitang bawat isa sa apat na nilalang ay may tig-aanim na pakpak.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: sa palibot at sa loob
  rationale: Pinananatili ang dalawang saklaw na binabanggit ng Griyego nang hindi nililinaw nang higit sa malabong larawan ng pangitain.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: punô ng mga mata
  rationale: Tuwirang katumbas ng idyomang Griyego at pinananatili ang matingkad na apokaliptikong larawan.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: Wala silang pahinga
  rationale: Pinananatili ang literal na diwa ng kawalan ng pahinga at hindi ito pinaliliit sa simpleng hindi pagtigil sa pagsasalita.
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Natural at maikling pahayag sa modernong Filipino para sa patuloy na gawain.
- source_word: λέγοντες
  choice: sa pagsasabi
  rationale: Neutral na salin na hindi nagdaragdag ng lakas gaya ng “sumisigaw,” na wala sa mismong pandiwa.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Banal, banal, banal
  rationale: Eksaktong pinananatili ang tatlong ulit na mahalaga sa retorika at pagsamba ng talata.
- source_word: κύριος, ὁ θεός
  choice: Panginoong Diyos
  rationale: Natural at nakaugaliang salin ng magkaugnay na mga titulong banal.
- source_word: ὁ παντοκράτωρ
  choice: ang Makapangyarihan sa Lahat
  rationale: Malinaw sa ordinaryong modernong Filipino bilang titulong tumutukoy sa Diyos na may ganap na kapangyarihan, nang hindi umaasa sa mas lumang anyong “Makapangyarihan sa lahat.”
- source_word: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: na noon pa man ay umiiral, na ngayon ay umiiral, at siyang dumarating
  rationale: Ipinahahayag nang natural sa Filipino ang temporal na pormula at pinananatili sa huling bahagi ang kilos ng kasalukuyang participle na ἐρχόμενος.
theological_decisions:
- issue: Ang salin ng banal na pormulang temporal na ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: na noon pa man ay umiiral, na ngayon ay umiiral, at siyang dumarating
  alternative: na noon pa man ay umiiral, na ngayon ay umiiral, at siyang darating
  rationale: Ang ἐρχόμενος ay kasalukuyang participle at mas tuwirang naipapakita ng “siyang dumarating” ang aspektong nasa pagkilos. Ang “siyang darating” ay lehitimo at mas tradisyonal na idyomatikong salin, kaya inilagay sa talababa sa halip na ipalit sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nilalang na buhay” sa halip na “hayop” upang maiwasan ang maling karaniwang pakahulugan, at pinanatili ang mahiwaga at matinding larawan ng pangitain. Inilagay ang marker na [a] kaagad pagkatapos ng pormulang tinutukoy nito.
