revisions:
- from: 'At ang apat na nilalang na buhay, na bawat isa ay may anim na pakpak, ay punô ng mga mata sa palibot at sa loob. Wala silang pahinga araw at gabi sa pagsasabi: “Banal, banal, banal ang Panginoong Diyos, ang Makapangyarihan sa Lahat, na noon pa man ay umiiral, na ngayon ay umiiral, at siyang dumarating.[a]”'
  to: 'At ang apat na nilalang na buhay ay may tig-aanim na pakpak; bawat isa sa kanila ay punô ng mga mata sa palibot at sa loob. Wala silang pahinga araw at gabi habang sinasabi nila: “Banal, banal, banal ang Panginoong Diyos, ang Makapangyarihan sa Lahat, na siya noon, siya ngayon, at siyang dumarating.[a]”'
  rationale: Inayos ang sintaks para maging likas sa modernong Filipino at pinalitan ang pinalawak na “noon pa man ay umiiral” ng mas malapit at mas maingat na “na siya noon, siya ngayon.” Pinanatili ang “siyang dumarating” upang katawanin ang kasalukuyang participle ὁ ἐρχόμενος, habang ang tradisyonal na “siyang darating” ay nananatiling nasa talababa. Ang marker ay nananatiling nakaangkla sa buong temporal na pormula.
