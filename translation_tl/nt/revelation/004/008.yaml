review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga larawan ng Griyego ay naipapasa nang tapat: apat na ζῷα, tig-aanim na pakpak, mga matang nasa palibot at sa loob, walang pahinga araw at gabi, at ang tatlong ulit na “Banal.” Gayunman, ang “noon pa man ay umiiral” ay mas malakas kaysa sa simpleng ὁ ἦν (“siya noon/ang siyang noon”), sapagkat maaari itong magpahiwatig ng walang-hanggang nakaraang pag-iral na hindi tahasang isinasaad ng anyong ito ng pormula. Ang binagong pormula ay mas malapit sa estruktura ng Griyego at pinananatili ang kasalukuyang aspekto ng ὁ ἐρχόμενος sa “dumarating.”'
  naturalness: Medyo mabigat ang kasalukuyang “na bawat isa ay may anim na pakpak, ay punô” dahil sa dobleng “ay,” at hindi gaanong likas ang “Wala silang pahinga araw at gabi sa pagsasabi.” Ang paghahati sa paglalarawan ng pakpak at paggamit ng “habang sinasabi nila” ay malinaw, marangal, at natural sa modernong Filipino.
  terminology: Ang “mga nilalang na buhay,” “Panginoong Diyos,” at “Makapangyarihan sa Lahat” ay angkop at pare-pareho sa rehistro ng pangitain at pagsamba. Pinanatili ang “Banal, banal, banal” at ang hindi pangkaraniwang imahen ng mga mata nang walang pagpapaliwanag na wala sa teksto.
  issues:
  - severity: medium
    issue: Ang “noon pa man ay umiiral, na ngayon ay umiiral” ay nagpapalawak sa temporal na pormula.
    rationale: Ang ὁ ἦν at ὁ ὢν ay mas tuwirang “siya noon” at “siya ngayon.” Ang “noon pa man ay umiiral” ay nagdaragdag ng diin sa matagal o walang-hanggang nakaraan na hindi leksikal na hinihingi ng unang bahagi ng Griyego.
  - severity: low
    issue: Hindi lubos na likas ang sintaks ng unang pangungusap at ang “sa pagsasabi.”
    rationale: Ang “na bawat isa ay may …, ay punô” ay mabigat sa Filipino, at ang “walang pahinga … sa pagsasabi” ay maaaring magmukhang ang pagsasabi lamang ang walang pahinga. Ang “habang sinasabi nila” ay mas malinaw na nag-uugnay sa participle na λέγοντες.
  revised_text: 'At ang apat na nilalang na buhay ay may tig-aanim na pakpak; bawat isa sa kanila ay punô ng mga mata sa palibot at sa loob. Wala silang pahinga araw at gabi habang sinasabi nila: “Banal, banal, banal ang Panginoong Diyos, ang Makapangyarihan sa Lahat, na siya noon, siya ngayon, at siyang dumarating.[a]”'
