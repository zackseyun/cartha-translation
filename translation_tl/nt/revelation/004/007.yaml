id: REV.4.7
reference: Revelation 4:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: tl
  text: At ang unang buháy na nilalang ay tulad ng leon, ang ikalawang buháy na nilalang ay tulad ng guya, ang ikatlong buháy na nilalang ay may mukhang gaya ng sa isang tao[a], at ang ikaapat na buháy na nilalang ay tulad ng agilang lumilipad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “may mukhang tao.” Sa Griyego, literal na “may mukha na gaya ng sa tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: buháy na nilalang
  rationale: Ipinahihiwatig nito ang isang nilalang na may buhay at malinaw itong naiiba sa “halimaw” na ginagamit para sa θηρίον sa mga susunod na pangitain ng Pahayag.
- source_word: ὅμοιον
  choice: tulad ng
  rationale: Pinananatili nito ang diwa ng pagkakatulad, hindi ng ganap na pagkakakilanlan.
- source_word: λέοντι
  choice: leon
  rationale: Tuwiran at natural na katumbas ng katawagan sa hayop.
- source_word: μόσχῳ
  choice: guya
  rationale: Ang μόσχος ay karaniwang tumutukoy sa batang baka; hindi nito ipinapalagay ang kasarian o kahulugang may kaugnayan sa paghahandog.
- source_word: ἔχων
  choice: may
  rationale: Natural na inilalahad sa Filipino ang paglalarawan ng ikatlong nilalang nang hindi binabago ang diwa ng participle.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: may mukhang gaya ng sa isang tao
  rationale: Pinananatili ng “mukha” ang πρόσωπον at ng “gaya ng” ang paghahambing na ipinahihiwatig ng ὡς. Ang “tao” ay natural na panlahat sa Filipino at hindi sapilitang nililimitahan sa lalaki.
- source_word: ἀετῷ πετομένῳ
  choice: agilang lumilipad
  rationale: Tuwirang inilalarawan nito ang agila habang lumilipad at pinananatili ang masiglang larawan ng Griyego.
theological_decisions:
- issue: Ang saklaw ng ἀνθρώπου sa paglalarawan sa ikatlong nilalang
  choice: gaya ng sa isang tao
  alternative: mukhang tao
  rationale: Maaaring tumukoy ang ἀνθρώπου sa tao sa pangkalahatan. Likas na panlahat ang “tao” sa Filipino, samantalang pinananatili ng “gaya ng sa isang tao” ang tahasang paghahambing ng Griyego sa halip na gawing tuwirang pagkakakilanlan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “buháy na nilalang” upang maging malinaw ang bigkas at upang maiba ang mga nilalang sa paligid ng trono mula sa mga halimaw sa ibang bahagi ng Pahayag.
