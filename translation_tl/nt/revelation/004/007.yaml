  source_fidelity: 'Tapat ang salin sa pagkakasunod at mga paglalarawan sa Griyego: ang apat na ζῷον ay wastong naipakita bilang “buháy na nilalang,” at napapanatili ng “tulad/gaya ng” ang paghahambing na ipinahihiwatig ng ὅμοιον at ὡς. Ang “guya” ay angkop para sa μόσχῳ, at ang “agilang lumilipad” ay tapat sa ἀετῷ πετομένῳ.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang paralelong ayos ng mga sugnay ay angkop sa marangal at pangitain-biblikal na rehistro. Naiintindihan ang “may mukhang gaya ng sa isang tao” at maayos nitong iniiwasang gawing ganap na pagkakakilanlan ang paghahambing.
  terminology: Ang “buháy na nilalang” ay mabuting terminong pampanitikan at nakapag-iiba sa mga “halimaw”/θηρίον sa ibang bahagi ng Pahayag. Ang “tao” ay likas na panlahat na katumbas ng ἀνθρώπου. Ang talababa ay nagbibigay ng kapaki-pakinabang na mas maikling alternatibo nang hindi binabago ang diwa ng talata.
