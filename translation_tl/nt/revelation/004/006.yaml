  source_fidelity: Tumpak na naihahatid ang dalawang paghahambing sa Griyego (ὡς at ὁμοία), ang ugnayang “sa harap ng trono,” at ang sadyang mahirap na paglalarawang “sa gitna ng trono at sa palibot ng trono.” Ang “apat na nilalang na buháy” ay wastong salin ng τέσσαρα ζῷα, at ang “punô ng mga mata sa harap at sa likod” ay malapit sa pinagmulan.
  naturalness: Natural at marangal ang modernong Filipino. Ang “tila isang dagat na salamin, gaya ng kristal” ay malinaw na matalinghaga at hindi pinipilit na literal. Nababasang maayos ang pagpapanatili ng magkakaugnay na sugnay na nagsisimula sa “At,” alinsunod sa estilo ng pangitain.
  terminology: Ang “trono,” “kristal,” at “mga nilalang na buháy” ay angkop sa rehistro at konteksto. Maingat na iniiwasan ng salin at talababa ang mapanlinlang na negatibong kahulugan ng “halimaw” para sa ζῷα, nang hindi ipinapasok ang doktrinal na pagpapakahulugan.
