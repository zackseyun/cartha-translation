id: REV.4.6
reference: Revelation 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: tl
  text: At sa harap ng trono ay may tila isang dagat na salamin[a], gaya ng kristal. At sa gitna ng trono at sa palibot ng trono ay may apat na nilalang na buháy[b][c], na punô ng mga mata sa harap at sa likod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “isang dagat na tila salamin.” Naghahayag ng paghahambing ang Griyego: may “tila isang dagat na salamin.”'
    reason: lexical_alternative
  - marker: b
    text: O “apat na buháy na nilalang.” Hindi tumutukoy ang salitang Griyego sa masasamang “halimaw” na lumilitaw sa mga sumunod na bahagi ng Pahayag.
    reason: lexical_alternative
  - marker: c
    text: Mahirap ilarawan ayon sa karaniwang pananaw ang pariralang “sa gitna ng trono at sa palibot ng trono.” Malamang na sumasalamin ito sa pananaw ng isang pangitain, kaya pinanatili rito ang di-pangkaraniwang pagkakasabi ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Likas na panandang panlunan sa Filipino na malinaw na nagpapahayag ng kaugnayan nito sa trono.
- source_word: ὡς
  choice: may tila isang
  rationale: Pinananatili ang paghahambing at ang tinatayang katangian ng pangitain, sa halip na ituring ang larawan bilang tuwirang pagkakakilanlan.
- source_word: θάλασσα ὑαλίνη
  choice: dagat na salamin
  rationale: Malinaw at matalinghagang salin ng pariralang pangngalan at pang-uri; pinananatili ang larawan nang hindi ipinapalagay na literal itong dagat.
- source_word: ὁμοία κρυστάλλῳ
  choice: gaya ng kristal
  rationale: Maikli at likas na paghahambing na naghahatid ng malinaw at maningning na anyo ng larawan.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: sa gitna ng trono at sa palibot ng trono
  rationale: Sadyang pinananatili ang mahirap na paglalarawang panlunan sa Griyego sa halip na ayusin o ipaliwanag ang heometriya ng pangitain.
- source_word: ζῷα
  choice: mga nilalang na buháy
  rationale: Ipinakikita nitong mga may-buhay na nilalang ang tinutukoy at iniiwasan ang negatibong pahiwatig ng “mga halimaw” o “mga hayop” na maaaring maiugnay sa masasamang halimaw sa mga sumunod na kabanata.
- source_word: γέμοντα ὀφθαλμῶν
  choice: punô ng mga mata
  rationale: Likas at malapit na salin ng konstruksiyong Griyego.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: sa harap at sa likod
  rationale: Karaniwang pares ng panandang panlunan sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin ng ζῷα sa pangitain tungkol sa makalangit na trono
  choice: mga nilalang na buháy
  alternative: mga buháy na nilalang; mga nilalang; mga hayop
  rationale: Pinananatili nito ang diwa ng mga may-buhay na nilalang sa paligid ng trono at iniiwasang ipagkamali sila sa masasamang halimaw sa mga sumunod na bahagi ng Pahayag.
- issue: Pagpapanatili sa tensiyong panlunan ng ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: sa gitna ng trono at sa palibot ng trono
  alternative: sa gitna, sa palibot ng trono; nasa palibot ng trono
  rationale: Hindi malinaw sa karaniwang heometriya ang paglalarawan ng Griyego at maaaring sumasalamin sa pananaw ng pangitain. Hindi ito pinakinis tungo sa iisang interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “buháy” na may tuldik upang luminaw ang bigkas at maiwasang mabasa bilang “búhay.” Pinanatili ang matalinghaga at mahiwagang katangian ng pangitain.
