  source_fidelity: 'Tumpak na naisalin ang pangunahing mga kilos at mga paglalarawan: ang dalawampu’t apat na matatanda ay magpapatirapa, sasamba sa nabubuhay magpakailanman, at ihahagis ang kanilang mga korona sa harap ng trono. Hindi rin idinagdag ang isang tahasang pagkakakilanlan sa nakaupo sa trono.'
  naturalness: 'Marangal at pangkalahatang natural ang Tagalog. Gayunman, ang paghihiwalay sa “Ihahagis nila...” bilang bagong pangungusap at ang “na sinasabi” sa hulihan ay lumilikha ng hindi malinaw na pagkakaugnay: maaari itong pansamantalang magmukhang tumutukoy sa mga korona sa halip na sa mga matatanda. Mas malinaw na pagdugtungin ang mga kilos at gamitin ang “at sasabihin nila.”'
  terminology: Ang “matatanda,” “magpapatirapa,” “sasamba,” “korona,” at “magpakailanman” ay angkop sa modernong Filipino Tagalog at sa mataas na rehistro ng Pahayag. Ang talababa sa στεφάνους ay wastong nagpapaliwanag ng alternatibong diwa na putong ng tagumpay o karangalan.
