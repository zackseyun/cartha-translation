  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: tl
  text: 'ang dalawampu’t apat na matatanda ay magpapatirapa sa harap ng nakaupo sa trono at sasamba sa nabubuhay magpakailanman[a], at ihahagis nila sa harap ng trono ang kanilang mga korona[b] at sasabihin:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga kapanahunan ng mga kapanahunan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego para sa “mga korona” ay maaari ring tumukoy sa mga putong na iginagawad bilang tanda ng tagumpay o karangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: magpapatirapa
  rationale: Ipinahahayag nito ang pisikal na pagyukod o pagbagsak bilang pagpipitagan sa konteksto ng pagsamba, sa natural at marangal na Tagalog.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: ang dalawampu't apat na matatanda
  rationale: Ang “matatanda” ang malinaw at karaniwang tawag sa mga elder sa makalangit na konseho sa Pahayag; iniiwasan nito ang teknikal at denominasyonal na “presbitero.”
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Natural at maikli itong katumbas sa dalawang paglitaw ng salita sa talata.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: ng nakaupo sa trono
  rationale: Pinananatili nito ang paglalarawang participyal ng Griyego nang hindi tahasang pinapangalanan ang tinutukoy.
- source_word: προσκυνήσουσιν
  choice: sasamba
  rationale: Sa konteksto ng banal na pagsamba sa Pahayag, malinaw na ipinahahayag ng pandiwa ang pagsamba, hindi lamang pagyukod o pagbibigay-galang.
- source_word: τῷ ζῶντι
  choice: sa nabubuhay
  rationale: Pinananatili ang substantival na paglalarawan sa patuloy na buhay ng tinutukoy at natural itong pakinggan sa Tagalog.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang likas na idyomatikong Tagalog para sa walang-hanggang tagal; inilalagay sa talababa ang mas literal na anyo.
- source_word: βαλοῦσιν
  choice: ihahagis
  rationale: Pinananatili nito ang masigla at sadyang kilos ng βάλλω sa halip na pahinain iyon bilang simpleng paglalapag.
- source_word: τοὺς στεφάνους αὐτῶν
  choice: ang kanilang mga korona
  rationale: “Korona” ang pinakanatural na salin sa apokaliptikong tagpo, habang ang historikal na diwa ng koronang gantimpala ay nililinaw sa talababa.
- source_word: λέγοντες
  choice: na sinasabi
  rationale: Natural nitong ipinakikilala ang susunod na pahayag habang pinananatili ang kaugnayan ng participle sa mga matatanda.
theological_decisions:
- issue: Ang tinutukoy ng nakaupo sa trono at ng nabubuhay magpakailanman
  choice: Panatilihin ang mga paglalarawang “nakaupo sa trono” at “nabubuhay magpakailanman.”
  alternative: Tahasang tukuyin siya bilang Diyos Ama.
  rationale: Malinaw sa konteksto na ang Diyos ang tinutukoy, ngunit mga paglalarawan at hindi tahasang pangalan ang ginamit ng tekstong Griyego sa talatang ito. Kaya hindi nagdaragdag ang salin ng doktrinal na pagtukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “matatanda” sa halip na teknikal na “presbitero,” at pinanatili ang masiglang larawan ng pagpapatirapa at paghahagis ng mga korona.
