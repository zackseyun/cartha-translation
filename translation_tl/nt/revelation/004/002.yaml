id: REV.4.2
reference: Revelation 4:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: tl
  text: Kaagad, ako'y nasa Espiritu[a], at masdan, isang trono ang nakalagay sa langit, at may isang nakaupo sa trono,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa espiritu.” Walang pantukoy ang pariralang Griyego at maaaring tumukoy sa pagiging nasa Banal na Espiritu o sa isang espirituwal na kalagayan ng pangitain.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Kaagad
  rationale: Tuwirang ipinapahayag ang biglaan at agarang paglipat sa susunod na bahagi ng pangitain.
- source_word: ἐγενόμην ἐν πνεύματι
  choice: ako'y nasa Espiritu
  rationale: Natural at marangal sa modernong Tagalog. Ipinahihiwatig ng buong pariralang Griyego ang pagpasok ni Juan sa isang kalagayang propetiko o pangitain, bagaman hindi tahasang nilutas sa salin kung ang πνεῦμα ay ang Banal na Espiritu o ang espirituwal na kalagayan ni Juan.
- source_word: ἰδοὺ
  choice: At masdan
  rationale: Pinananatili ang panawagang ituon ang pansin sa biglang lumitaw sa pangitain at ang marangal na himig ng tekstong apokaliptiko.
- source_word: θρόνος ἔκειτο
  choice: may isang tronong nakalagay
  rationale: Ang κεῖμαι ay tumutukoy sa pagkakalagay o pagkakatatag ng trono sa isang lugar. Mas natural sa Tagalog ang 'nakalagay' kaysa sabihing ang trono ay 'nakatayo.' Ginamit ang 'isang' sapagkat bagong ipinakikilala ang trono.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Tumutukoy sa makalangit na dako ng pangitain, hindi sa himpapawid lamang.
- source_word: ἐπὶ τὸν θρόνον καθήμενος
  choice: may isang nakaupo sa trono
  rationale: Pinananatiling di-tiyak ang pagkakakilanlan ng nakaupo gaya ng substantival participle sa Griyego, nang hindi nagdaragdag ng pangalan o paliwanag.
theological_decisions:
- issue: Kung ang ἐν πνεύματι ay tahasang tumutukoy sa Banal na Espiritu o sa espirituwal/pangitaing kalagayan ni Juan
  choice: nasa Espiritu
  alternative: nasa espiritu
  rationale: Ang malaking titik ay kumakatawan sa malamang na pagtukoy sa Espiritu sa konteksto ng propetikong pangitain sa Pahayag. Gayunman, walang pantukoy ang pariralang Griyego, kaya pinanatili sa talababa ang posibilidad na tumukoy ito sa espirituwal o pangitaing kalagayan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'masdan' upang mapanatili ang mariing himig ng ἰδοὺ, at 'tronong nakalagay' bilang natural na paglalarawan sa matatag na pagkakalagay ng trono.
