source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: tl
  text: At sa tuwing nagbibigay ang mga nilalang na buhay ng kaluwalhatian, karangalan, at pasasalamat sa nakaupo sa trono, na nabubuhay magpakailanman[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga kapanahunan ng mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: sa tuwing
  rationale: Ipinahahayag ng ὅταν ang di-tiyak at paulit-ulit na pagkakataon; likas na naihahatid ito ng “sa tuwing” sa Filipino.
- source_word: δώσουσιν
  choice: nagbibigay
  rationale: Pinananatili nito ang payak na diwa ng δίδωμι na “magbigay,” habang ang kasalukuyang anyo sa Filipino ay angkop sa paulit-ulit na kilos na ipinakikilala ng “sa tuwing.”
- source_word: τὰ ζῷα
  choice: ang mga nilalang na buháy
  rationale: Tumutukoy ito sa mga nilalang sa paligid ng trono na nauna nang ipinakilala, hindi sa karaniwang mga hayop. Hindi idinagdag ang “apat” sapagkat wala iyon sa talatang ito.
- source_word: δόξαν καὶ τιμὴν καὶ εὐχαριστίαν
  choice: kaluwalhatian, karangalan, at pasasalamat
  rationale: Pinananatili ang tatlong magkakahanay na pangngalan at ang marangal na himig ng pagpupuri.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: sa nakaupo sa trono
  rationale: Natural at tuwirang inilalarawan nito ang patuloy na kalagayan ng persona sa trono nang hindi idinaragdag ang pangalang “Diyos.”
- source_word: τῷ ζῶντι
  choice: sa nabubuhay
  rationale: Pinananatili ang ikalawang paglalarawan sa parehong persona at malinaw na iniuugnay ito sa kasunod na pahayag tungkol sa walang-hanggang buhay.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang malinaw at likas na modernong Filipino para sa idyomang nagsasaad ng walang-hanggang tagal; inilalagay sa talababa ang higit na literal na anyo.
theological_decisions:
- issue: Paglalarawan sa persona sa trono nang walang idinaragdag na tiyak na pangalan
  choice: sa nakaupo sa trono—sa nabubuhay magpakailanman—
  alternative: sa Diyos na nakaupo sa trono at nabubuhay magpakailanman
  rationale: Hindi tahasang ginagamit ng Griyego ang “Diyos” sa talatang ito. Pinananatili ng salin ang dalawang magkaugnay na paglalarawan at hinahayaang ang konteksto ang tumukoy sa persona.
- issue: Ugnayan ng dalawang pariralang may pantukoy
  choice: magkasingtukoy na mga paglalarawan na pinag-ugnay ng gitling
  alternative: pagsamahin bilang “sa nakaupo sa trono, na nabubuhay magpakailanman”
  rationale: Ang ikalawang parirala ay nasa apposition sa una. Ipinakikita ng gitling ang diin at pagkakapantay ng dalawang paglalarawan nang hindi binabago ang kanilang tinutukoy.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa tuwing” upang ipakita ang paulit-ulit na kilos, at pinanatili ang tatluhang ritmo ng “kaluwalhatian, karangalan, at pasasalamat.” Ang kudlit na pahilis sa “buháy” ay tumutulong upang malinaw na mabasa ito bilang pang-uring “living,” hindi bilang pangngalang “life.”
