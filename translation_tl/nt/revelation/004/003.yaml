id: REV.4.3
reference: Revelation 4:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: tl
  text: Ang nakaupo roon ay sa anyo'y tulad ng batong jaspe at batong kornalina[a]. Sa palibot ng trono ay may bahaghari[b] na sa anyo'y tulad ng esmeralda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sardio,” ang tradisyonal na katawagan sa batong hiyas na isinaling “kornalina” rito.
    reason: lexical_alternative
  - marker: b
    text: O “sinag na parang bahaghari”; ang salitang Griyego ay maaaring tumukoy sa maningning na liwanag na kahawig ng bahaghari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: ang nakaupo roon
  rationale: Ginawang pangngalan ang partisipyong Griyego upang tukuyin ang nasa trono. Idinagdag ang “roon” ayon sa konteksto para sa likas na daloy sa Tagalog.
- source_word: ὅμοιος ὁράσει
  choice: sa anyo'y tulad ng
  rationale: Pinananatili nito ang paghahambing batay sa nakikitang anyo at hindi ipinahihiwatig na literal na yari sa mga batong hiyas ang nakaupo.
- source_word: λίθῳ ἰάσπιδι
  choice: batong jaspe
  rationale: Ang “jaspe” ang nakaugaliang makabagong katawagan sa hiyas, at pinananatili ng “bato” ang λίθῳ.
- source_word: σαρδίῳ
  choice: batong kornalina
  rationale: Mas madaling makilala ng makabagong mambabasa ang kornalina kaysa sa tradisyonal ngunit di-pamilyar na “sardio.” Inulit ang “batong” sa Tagalog upang malinaw na kapuwa hiyas ang pinaghahambingan.
- source_word: ἶρις
  choice: bahaghari
  rationale: Ito ang tuwirang likas na katumbas sa kontekstong pangitain, habang kinikilala sa talababa ang posibilidad ng isang sinag o ningning na parang bahaghari.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: sa palibot ng trono
  rationale: Malinaw nitong ipinapahayag na nakapaligid sa trono ang bahaghari.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: na sa anyo'y tulad ng esmeralda
  rationale: Pinananatili ang biswal na paghahambing at hindi sinasabing literal na esmeralda ang bahaghari.
theological_decisions:
- issue: Ang nakaupo sa trono ay inilalarawan sa pamamagitan ng paghahambing, hindi ng tuwirang pisikal na paglalarawan
  choice: Pinanatili ang “sa anyo'y tulad ng” sa dalawang paghahambing
  alternative: Sabihing ang nakaupo ay yari sa mga hiyas o naglalabas ng mismong mga kulay ng mga ito
  rationale: Dalawang ulit na gumagamit ang Griyego ng wikang naghahambing. Pinananatili nito ang katangian ng pangitain at hindi ginagawang literal na pisikal na paglalarawan ang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang mga katawagang “jaspe,” “kornalina,” at “esmeralda,” at pinanatili ang wikang naghahambing upang hindi gawing labis na literal ang pangitain.
