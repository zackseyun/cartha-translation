revisions:
- from: At umaawit sila ng tila isang bagong awit sa harap ng trono at sa harap ng apat na nilalang na buháy at ng matatandang[a] tagapamahala. Walang sinumang nakapag-aral ng awit maliban sa isandaan at apatnapu't apat na libo, ang mga binili mula sa lupa.[b]
  to: At umaawit sila ng tila isang bagong awit sa harap ng trono at sa harap ng apat na nilalang na buhay at ng mga matatanda.[a] Walang sinumang nakayang matutuhan ang awit maliban sa isandaan at apatnapu't apat na libo, yaong mga binili mula sa lupa.[b]
