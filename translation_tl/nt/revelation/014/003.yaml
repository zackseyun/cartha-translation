id: REV.14.3
reference: Revelation 14:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: tl
  text: At umaawit sila ng tila isang bagong awit sa harap ng trono at sa harap ng apat na nilalang na buhay at ng mga matatanda.[a] Walang sinumang nakayang matutuhan ang awit maliban sa isandaan at apatnapu't apat na libo, yaong mga binili mula sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga elder.” Ang salitang Griego ay tumutukoy sa kinikilalang pangkat ng mga matatanda sa makalangit na kapulungan.
    reason: lexical_alternative
  - marker: b
    text: O “mga tinubos mula sa lupa.” Ang pandiwang Griego ay literal na “binili.”
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: umaawit sila
  rationale: Pinananatili ang pangkasalukuyang anyo at ang masiglang paglalahad ng pangitain sa natural na Tagalog.
- source_word: ὡς ᾠδὴν καινὴν
  choice: tila isang bagong awit
  rationale: Ipinahihiwatig ng ὡς ang paraan o anyo ng nakita/narinig sa pangitain nang hindi itinatangging tunay na bago ang awit.
- source_word: ἐνώπιον
  choice: sa harap ng
  rationale: Natural at malinaw na katumbas na nagpapanatili sa diwang nasa presensiya ng trono at ng mga makalangit na nilalang.
- source_word: τῶν τεσσάρων ζῴων
  choice: apat na nilalang na buháy
  rationale: Iniiwasan ang kahulugang karaniwang hayop at malinaw na tumutukoy sa mga makalangit na nilalang sa paligid ng trono.
- source_word: τῶν πρεσβυτέρων
  choice: matatandang tagapamahala
  rationale: Ipinapakita ang kinikilalang tungkulin ng pangkat sa makalangit na kapulungan, hindi lamang ang kanilang edad.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: Walang sinumang nakapag-aral
  rationale: Ipinapahayag ang kawalan ng kakayahang matutuhan ang awit; ang 'mapag-aralan' ay natural sa awit na kailangang matutuhan.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ang isandaan at apatnapu't apat na libo
  rationale: Isinusulat sa mga salita para sa marangal na estilong pampanitikan at pinananatili ang tiyak na bilang.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: ang mga binili mula sa lupa
  rationale: Pinananatili ang tuwirang metaporang pangkalakalan ng ἀγοράζω at ang saklaw ng ἀπό bilang 'mula sa.'
theological_decisions:
- issue: Lakas ng ὡς sa paglalarawan ng pangitain
  choice: tila isang bagong awit
  alternative: gaya ng isang bagong awit
  rationale: Pinananatili ang wika ng pandama sa pangitain nang hindi nagpapasya kung ang awit ay hindi talaga bago.
- issue: Kahulugan ng οἱ ἠγορασμένοι
  choice: ang mga binili
  alternative: ang mga tinubos
  rationale: Ang pangunahing teksto ay nagpapanatili sa literal na metaporang 'binili'; ang 'tinubos' ay wastong kaugnay na teolohikal na pagpapakahulugan ngunit mas interpretatibo.
- issue: Pagkakakilanlan ng πρεσβύτεροι
  choice: matatandang tagapamahala
  alternative: mga elder
  rationale: Iniiwasan ang hiram na terminong maaaring magpahiwatig ng isang natatanging modernong katungkulan sa denominasyon, habang ipinahahayag ang kanilang papel sa makalangit na kapulungan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tila” upang mapanatili ang wika ng pangitain, at iniwasan ang denominasyonal na pagpapakahulugan sa πρεσβύτεροι.
