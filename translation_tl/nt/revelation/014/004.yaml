revisions:
- from: Ang mga ito ang hindi nagparumi ng kanilang sarili sa mga babae,[a] sapagkat sila ay mga birhen. Sila ang sumusunod sa Kordero saanman siya pumunta. Sila ay binili mula sa sangkatauhan bilang mga unang bunga para sa Diyos at sa Kordero.[b]
  to: Ang mga ito ang hindi nadungisan sa pakikipagtalik sa mga babae,[a] sapagkat sila ay mga birhen. Sila ang sumusunod sa Kordero saanman siya magpunta. Sila ay binili mula sa sangkatauhan bilang unang bunga para sa Diyos at sa Kordero.[b]
  rationale: Inayos ang pangunahing parirala upang maging malinaw at idiomatiko sa modernong Filipino ang seksuwal na kontekstong inilalarawan ng “kasama ng mga babae,” nang hindi nilulutas kung literal o simboliko ang larawan sa Pahayag. Ginawang singular ang “unang bunga” upang tumugma sa ἀπαρχή. Pinanatili ang mga panandang talababa at ang ambiguwidad ng simbolikong pagbasa.
