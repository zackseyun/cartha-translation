id: REV.14.4
reference: Revelation 14:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: tl
  text: Ang mga ito ang hindi nadungisan sa pakikipagtalik sa mga babae,[a] sapagkat sila ay mga birhen. Sila ang sumusunod sa Kordero saanman siya magpunta. Sila ay binili mula sa sangkatauhan bilang unang bunga para sa Diyos at sa Kordero.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa isang posibleng pagbasa, ang larawang ito ay tumutukoy sa espirituwal na kadalisayan o sa pagiging malaya mula sa karumihan ng idolatriya, sa halip na tumukoy lamang sa literal na pag-iwas sa pakikipagtalik.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: hindi nagparumi ng kanilang sarili
  rationale: Ipinapanatili nito ang diwa ng karumihan o pagkadungis, kasama ang moral o ritwal na pahiwatig ng pandiwa. Bagaman pasibo ang anyong Griyego, natural sa Filipino ang ganitong pagpapahayag sa konteksto.
- source_word: μετὰ γυναικῶν
  choice: sa mga babae
  rationale: Ang μετά na may genitive ay nangangahulugang “kasama” o “may kaugnayan sa”; sa pariralang Filipino, natural ang “sa mga babae.” Ang γυναικῶν ay maaaring “mga babae” o “mga asawa,” ngunit hindi tahasang nililimitahan ng teksto sa pag-aasawa.
- source_word: παρθένοι
  choice: mga birhen
  rationale: Ito ang tuwirang katumbas ng konkretong larawan sa Griyego at hindi nito agad nilulutas kung literal o simboliko ang pahayag.
- source_word: ἀκολουθοῦντες
  choice: sumusunod
  rationale: Ipinahihiwatig ng present participle ang patuloy at kinagawiang pagsunod; malinaw at natural itong naipapahayag ng “sumusunod.”
- source_word: ἀρνίῳ
  choice: Kordero
  rationale: Pinananatili nito ang kinikilalang kristolohikal at apokaliptikong titulo sa Pahayag, pati ang sakripisyal na larawan nito.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: saanman siya pumunta
  rationale: Ipinapahayag ng ὅπου ἂν kasama ng subjunctive ang di-tiyak at walang-limitasyong “saanman”; idiomatiko ito sa modernong Filipino.
- source_word: ἠγοράσθησαν
  choice: binili
  rationale: Pinananatili nito ang literal na larawang pangkalakalan at pantubos ng ἀγοράζω nang hindi agad pinapalitan ng mas interpretibong “tinubos.”
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: mula sa sangkatauhan
  rationale: Ang ἀνθρώπων ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki; malinaw at marangal ang “sangkatauhan.”
- source_word: ἀπαρχὴ
  choice: mga unang bunga
  rationale: Pinananatili nito ang larawang ani at handog ng unang bahagi na inilaan sa Diyos.
theological_decisions:
- issue: Kung literal o simboliko ang hindi pagpaparumi sa mga babae at pagiging mga birhen
  choice: 'Pinanatili sa pangunahing teksto ang konkretong pananalita: “hindi nagparumi ng kanilang sarili sa mga babae, sapagkat sila ay mga birhen.”'
  alternative: Maaaring larawan ito ng espirituwal na kadalisayan o kalayaan mula sa karumihan ng idolatriya.
  rationale: Konkreto ang pananalita ng Griyego, samantalang maaaring simboliko ang gamit nito sa Pahayag. Dapat panatilihin ng salin ang tensiyong ito sa halip na magtakda ng iisang interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang apokaliptikong larawang “Kordero” at ang larawang pang-ani at panghandog na “mga unang bunga.”
