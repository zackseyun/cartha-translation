id: REV.14.11
reference: Revelation 14:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: tl
  text: At ang usok ng kanilang pagdurusa ay pumapailanlang magpakailanman[a], at wala silang kapahingahan araw at gabi, ang mga sumasamba sa halimaw at sa larawan nito, at kung may tumatanggap ng tatak ng pangalan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa mga kapanahunan ng mga kapanahunan.”'
    reason: lexical_alternative
  - marker: b
    text: Biglang nagtatapos ang Griyego sa “at kung may tumatanggap ng tatak ng pangalan nito.” Malamang na ipinagpapatuloy nito ang paglalarawan sa mga nasa ilalim ng paghatol; maaari rin itong pakinisin bilang “at ang sinumang tumatanggap.”
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: usok
  rationale: Tuwirang katumbas na nagpapanatili sa kongkretong larawang apokaliptiko.
- source_word: βασανισμοῦ
  choice: pagpapahirap
  rationale: Naghahatid ng masakit na pagdurusa sa konteksto ng paghatol nang hindi tinutukoy ang isang partikular na paraan ng pagpapahirap.
- source_word: εἰς αἰῶνας αἰώνων
  choice: magpakailanman
  rationale: Natural at marangal na idyomang Tagalog para sa napakatinding pahayag ng patuloy na tagal; inilalahad sa talababa ang mas literal na anyo.
- source_word: ἀναβαίνει
  choice: patuloy na pumapaitaas
  rationale: Pinananatili ang kasalukuyan at nagpapatuloy na kilos ng usok sa pangitain.
- source_word: ἀνάπαυσιν
  choice: kapahingahan
  rationale: Tuwirang katumbas na nagpapanatili sa ideya ng kawalan ng pahinga nang hindi ito ginagawang interpretatibong 'ginhawa.'
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Karaniwang natural na parirala sa Tagalog para sa walang tigil na panahon.
- source_word: προσκυνοῦντες
  choice: sumasamba
  rationale: Sa konteksto ng Pahayag, tumutukoy ito sa mapagsambang pagpapasakop at katapatan.
- source_word: θηρίον
  choice: halimaw
  rationale: Natural na katumbas sa modernong Tagalog para sa apokaliptikong nilalang; pinananatili ang nakatatakot at di-pangkaraniwang karakter nito.
- source_word: εἰκόνα
  choice: larawan
  rationale: Malawak at tuwirang katumbas na hindi nagpapakitid sa kahulugan tungo lamang sa isang estatwa.
- source_word: εἴ τις λαμβάνει
  choice: kung may tumatanggap
  rationale: Pinananatili ang biglang paglipat ng Griyego mula sa maramihang participle tungo sa pang-isahang di-tiyak na kondisyon, sa halip na ganap na pakinisin bilang 'sinumang tumatanggap.'
- source_word: χάραγμα
  choice: tatak
  rationale: Angkop na karaniwang salita para sa inilalagay na palatandaang nagpapakilala o nagpapatunay ng pag-aari.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: ng pangalan nito
  rationale: Malapit sa anyong henitibo ng Griyego at hindi inuunahan ang posibleng interpretasyon ng ugnayan ng tatak at pangalan.
theological_decisions:
- issue: Tagal ng paghatol sa εἰς αἰῶνας αἰώνων
  choice: Isinaling “magpakailanman,” na nagpapahayag ng walang katapusang tagal.
  alternative: “sa mga panahon ng mga panahon”
  rationale: Sa Pahayag, ang pormulang ito ang pinakamariing karaniwang pahayag ng patuloy na tagal. Pinananatili ng talababa ang literal na anyo nang hindi pinahihina o higit na ipinapaliwanag ang teolohikong bigat nito.
- issue: Sintaksis at tinutukoy ng huling sugnay
  choice: Pinanatili ang biglang anyong “at kung may tumatanggap.”
  alternative: Pakinisin bilang “at ang sinumang tumatanggap” o gawing iisang paglalarawan sa dalawang pangkat.
  rationale: Ang Griyego ay lumilipat mula sa maramihang participial na paglalarawan tungo sa pang-isahang di-tiyak na kondisyon. Ang salin at talababa ay nagpapanatili sa pag-igting at bahagyang kalabuan ng estruktura.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “halimaw” para sa θηρίον at “tatak” para sa χάραγμα bilang natural na mga salitang akma sa apokaliptikong konteksto. Pinanatili sa huling sugnay ang kapansin-pansing paglihis ng sintaksis ng Griyego, habang gumamit ng em dash upang maging mababasa ang kaugnayan nito sa naunang paglalarawan. Lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
