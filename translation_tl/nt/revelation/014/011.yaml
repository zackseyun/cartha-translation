    issue: “patuloy na pumapaitaas”
    rationale: Hindi likas na pandiwa ang “pumapaitaas” para sa usok sa modernong Tagalog; ang “pumapailanlang” ay mas idiomatiko at nananatiling matapat sa ἀναβαίνει.
  - severity: medium
    issue: “pagpapahirap sa kanila”
    rationale: Ang pagpapahirap ay nakatuon sa gawa ng isang nagpapahirap at maaaring magpahiwatig ng torture. Ang βασανισμός dito ay mas tuwirang naihahayag bilang “kanilang pagdurusa,” nang hindi dinaragdagan ang paraan o ahente.
