  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga larawan ng Griyego ay naipapasa: usok, pagdurusa, walang pahinga araw at gabi, pagsamba sa halimaw at larawan nito, at pagtanggap ng tatak ng pangalan nito. Gayunman, ang “pagpapahirap sa kanila” ay masyadong agentibo at maaaring magpahiwatig ng paraan ng pananakit; mas tapat at natural ang “kanilang pagdurusa.” Ang “patuloy na pumapaitaas” ay hindi likas na kolokasyon para sa usok at hindi kailangang dagdagan ng “patuloy,” dahil naihahatid ng pangkasalukuyang anyo ang patuloy na larawan.'
  naturalness: Hindi gaanong natural ang “pumapaitaas.” Ang “pumapailanlang” ay marangal ngunit malinaw na modernong Tagalog para sa usok. Mas malinaw rin ang sugnay tungkol sa kawalan ng pahinga kapag ang “ang mga sumasamba ... at kung may tumatanggap ...” ay idinugtong nang walang em dash; pinananatili nito ang kapansin-pansing kondisyunal na hulihan nang hindi gumagawa ng maling putol sa Tagalog.
  terminology: Ang “halimaw,” “larawan,” “tatak,” “kapahingahan,” at “sumasamba” ay angkop. Pinanatili ang “magpakailanman” bilang likas na salin ng apokaliptikong idyoma, na may talababa para sa mas literal na anyo.
