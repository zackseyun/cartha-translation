revisions:
- from: Pagkatapos ay tumingin ako, at naroon ang Kordero, nakatayo sa Bundok ng Sion. Kasama niya ang isang daan at apatnapu't apat na libo, na may nakasulat sa kanilang mga noo na pangalan niya at pangalan ng kanyang Ama.[a]
  to: At nakita ko, at narito, ang Kordero ay nakatayo sa Bundok Sion, at kasama niya ang isang daan at apatnapu't apat na libo na nakasulat sa kanilang mga noo ang kanyang pangalan at ang pangalan ng kanyang Ama.[a]
  rationale: Inayos ang panimulang pahayag upang maipakita ang sunod-sunod na pangitain at ang emphatic na ἰδού. Inilipat ang estruktura ng sugnay tungkol sa mga pangalan upang malinaw na ang pangalan ng Kordero at ang pangalan ng kanyang Ama ay kapwa nakasulat sa mga noo. Pinanatili ang eksaktong bilang, mga pangalan, rehistro, at tekstuwal na talababa.
