  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing nilalaman ng draft: ang Kordero ay nakatayo sa Bundok Sion kasama ang 144,000, at kapwa ang pangalan niya at ang pangalan ng kanyang Ama ay nakasulat sa kanilang mga noo. Gayunman, ang ayos na “na may nakasulat sa kanilang mga noo na pangalan niya at pangalan ng kanyang Ama” ay bahagyang mabigat at maaaring magpahina sa malinaw na saklaw ng “nakasulat” sa dalawang pangalan. Ang rebisyon ay mas tuwirang sumasalamin sa Griyegong estruktura at sa diin ng ἰδού.'
  naturalness: Mas likas at malinaw sa modernong Filipino Tagalog ang “At nakita ko, at narito” bilang pagsasalin ng Καὶ εἶδον, καὶ ἰδού. Ang “nakasulat sa kanilang mga noo ang kanyang pangalan at ang pangalan ng kanyang Ama” ay malinaw na pangungusap at hindi nag-iiwan ng kalabuan kung alin ang nakasulat.
  terminology: Pinanatili ang nakaugaliang biblikal na “Kordero,” “Bundok Sion,” at “Ama.” Ang “kanyang pangalan” ay malinaw na tumutukoy sa Kordero, samantalang ang “kanyang Ama” ay pinananatili ang ugnayang nasa Griyego nang walang dagdag na interpretasyong doktrinal.
