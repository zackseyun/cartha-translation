id: REV.14.1
reference: Revelation 14:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: tl
  text: At nakita ko, at narito, ang Kordero ay nakatayo sa Bundok Sion, at kasama niya ang isang daan at apatnapu't apat na libo na nakasulat sa kanilang mga noo ang kanyang pangalan at ang pangalan ng kanyang Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito, ang mababasa lamang ay: “ang pangalan ng kanyang Ama na nakasulat sa kanilang mga noo.”'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Pagkatapos ay tumingin ako
  rationale: Likas na nagsasaad ng pagsulong sa sunod-sunod na pangitain, habang pinananatili ang kilos ng pagtingin.
- source_word: ἰδοὺ
  choice: naroon
  rationale: Natural na pantawag-pansin sa makabagong Tagalog na pinananatili ang biglang pagpapakita ng tanawin nang hindi gumagamit ng lipas na pananalita.
- source_word: τὸ ἀρνίον
  choice: ang Kordero
  rationale: Karaniwang marangal na salin ng kristolohikal na titulo sa Pahayag; hindi idinagdag ang ideya ng pagiging maliit na nasa anyong diminutibo.
- source_word: ἑστὸς
  choice: nakatayo
  rationale: 'Pinananatili ang resultang kalagayan ng perfect participle: ang Kordero ay nasa kalagayang nakatayo.'
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: sa Bundok ng Sion
  rationale: Likas na anyo ng pangalang heograpiko sa Tagalog at tuwirang ipinapahayag ang lokasyon.
- source_word: μετ’ αὐτοῦ
  choice: Kasama niya
  rationale: Malinaw at natural na inilalahad ang presensiya ng pangkat na kasama ng Kordero.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: isang daan at apatnapu't apat na libo
  rationale: Eksaktong pinananatili ang bilang sa karaniwang modernong Tagalog.
- source_word: ἔχουσαι
  choice: na may
  rationale: Natural na panandang nag-uugnay sa 144,000 at sa inskripsiyong taglay nila.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: pangalan niya at pangalan ng kanyang Ama
  rationale: Pinananatili ang dalawang magkaugnay ngunit hiwalay na pangalan ayon sa koordinasyon ng Griyego.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: nakasulat sa kanilang mga noo
  rationale: Tuwirang inilalarawan ang nauna nang naisulat at nananatiling naroon, pati ang mahalagang lokasyon ng tanda.
theological_decisions:
- issue: Pagkakakilanlan ng τὸ ἀρνίον
  choice: Kordero
  alternative: Korderong handog
  rationale: Ginagamit lamang ang kristolohikal na titulo na tahasang nasa teksto at hindi nagdaragdag ng paliwanag tungkol sa paghahain.
- issue: Ugnayan ng dalawang pangalan
  choice: pangalan niya at pangalan ng kanyang Ama
  alternative: pangalan niya, samakatuwid ay pangalan ng kanyang Ama
  rationale: Ang Griyego ay may dalawang pinag-ugnay na layon at hindi tahasang nagsasabing iisang pangalan lamang ang tinutukoy; pinananatili ng salin ang pagkakaiba at malapit na pagkakaugnay.
- issue: Tekstuwal na pagbasa ng inskripsiyon
  choice: Kasama sa pangunahing teksto ang pangalan ng Kordero at pangalan ng kanyang Ama.
  alternative: Pangalan lamang ng kanyang Ama
  rationale: Sinusunod ang SBLGNT; ang mahalagang variant na nag-aalis sa unang pangalan ay inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “naroon” bilang likas na katumbas ng ἰδού at ang “Kordero” bilang nakaugaliang titulong biblikal. Ang hati sa dalawang pangungusap ay nagpapalinaw sa mahabang estruktura nang hindi binabago ang mga ugnayan ng orihinal.
