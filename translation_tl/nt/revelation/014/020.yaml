base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: tl
  text: At niyurakan ang pisaan ng ubas sa labas ng lungsod, at lumabas ang dugo[b] mula sa pisaan hanggang sa mga renda ng mga kabayo sa layong 1,600 estadio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang estadio ay isang sinaunang yunit ng distansiya; ang 1,600 estadio ay humigit-kumulang 296 kilometro.
    reason: cultural_note
  - marker: b
    text: O, umagos ang dugo mula sa pisaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: niyurakan
  rationale: Pinananatili ang pasibong diwa ng ‘tinapakan/yurakan’ at ang marahas na larawan ng paghatol, nang hindi nagdaragdag ng tahasang tagaganap.
- source_word: ληνός / ληνοῦ
  choice: pisaan ng ubas
  rationale: Likas at malinaw na katumbas sa modernong Tagalog para sa winepress; pinananatili nito ang larawan ng pag-aani at paghatol.
- source_word: ἔξωθεν τῆς πόλεως
  choice: sa labas ng lungsod
  rationale: Tuwiran at natural na panandang panlunan.
- source_word: ἐξῆλθεν αἷμα
  choice: lumabas ... ang dugo
  rationale: Malapit sa payak na kahulugan ng ἐξέρχομαι na ‘lumabas’; hindi ginagawang tiyak sa pangunahing teksto na ‘umagos,’ bagaman malamang iyon sa konteksto.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: umabot sa taas ng mga renda ng mga kabayo
  rationale: Ipinahahayag nang malinaw sa Tagalog ang patayong abot ng dugo habang pinananatili ang matingkad na larawan ng mga kabayo at kanilang mga renda.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: sa layong 1,600 estadio
  rationale: Ipinapakita ang lawak na distansiya at pinananatili ang sinaunang yunit sa pangunahing teksto; nasa talababa ang makabagong katumbas.
theological_decisions:
- issue: Kung palalambutin o ipaliliwanag ang marahas na apokaliptikong larawan
  choice: Pinanatili ang konkretong larawan ng dugo, mga renda ng kabayo, at 1,600 estadio.
  alternative: Ipaliwanag ito sa teksto bilang sagisag ng napakalawak na paghatol.
  rationale: Hindi tahasang ipinapaliwanag ng talata ang simbolismo nito; ang pagsasalin ay dapat magpanatili ng larawan at teolohikal na tensiyon sa halip na lutasin iyon para sa mambabasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘lungsod,’ ‘pisaan ng ubas,’ at ‘estadio’ upang maging malinaw ngunit mapanatili ang tiyak at matingkad na larawan ng tekstong Griyego.
