  source_fidelity: Tapat ang salin sa SBLGNT. Napananatili ang pang-ugnay na καὶ sa “At,” ang pasibong diin ng οὐχ εὑρέθη sa “walang … natagpuan,” ang larangan ng pananalita sa “sa kanilang bibig,” at ang predikatibong pangmaramihang ἄμωμοί sa “wala silang kapintasan.”
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang “walang kasinungalingang natagpuan sa kanilang bibig” ay katanggap-tanggap na malapit na salin at hindi pilit; ang “wala silang kapintasan” ay maayos na parallel na pahayag.
