  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: tl
  text: At walang kasinungalingang natagpuan sa kanilang bibig; wala silang kapintasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala silang dungis” o “walang maipaparatang sa kanila.” Ang salitang Griyego ay maaaring magpahiwatig kapwa ng pagiging karapat-dapat bilang handog na walang dungis at ng moral na kawalang-kapintasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay upang ipakitang pagpapatuloy ito ng naunang paglalarawan.
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: sa kanilang bibig
  rationale: Malapit ito sa anyong isahan ng Griyego, na may kolektibong diwa, at natural sa Filipino bilang pagtukoy sa sinasabi nila.
- source_word: οὐχ εὑρέθη
  choice: walang ... natagpuan
  rationale: Pinananatili ang pasibong anyo at ang diin sa kawalan ng anumang natuklasang kasinungalingan.
- source_word: ψεῦδος
  choice: kasinungalingan
  rationale: Direkta at karaniwang salin ito para sa hindi totoong pananalita; hindi nito dinaragdagan ang diwa tungo sa mas malawak na panlilinlang.
- source_word: ἄμωμοί
  choice: wala silang kapintasan
  rationale: Natural at marangal sa modernong Filipino, at naipahahayag ang pagiging walang maipaparatang habang nananatiling bukas ang posibleng larawan ng pagiging walang dungis.
theological_decisions:
- issue: Paglalahad sa ἄμωμοί nang hindi ipinapalagay ang lubos na kawalan ng kasalanan
  choice: wala silang kapintasan
  alternative: wala silang dungis; walang maipaparatang sa kanila
  rationale: Maaaring tumukoy ang salita sa moral na kawalang-kapintasan at sa pagiging walang dungis na kaugnay ng handog. Hindi nito kailangang ipakahulugan ang ganap at metapisikal na kawalan ng kasalanan; kaya inilalagay sa talababa ang saklaw ng larawan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang kolektibong isahan na “bibig” at ang pasibong “natagpuan,” samantalang ang talababa ay nag-iingat sa sakripisyal at moral na mga pahiwatig ng ἄμωμος.
