id: REV.14.8
reference: Revelation 14:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: tl
  text: At sumunod ang isa pang anghel, ang ikalawa, at nagsabi, “Bumagsak, bumagsak na ang dakilang Babilonia! Siya ang nagpainom sa lahat ng bansa ng alak ng matinding pagnanasa[a] ng kanyang seksuwal na imoralidad[b].”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “poot” o “matinding galit.” Ang Griyegong θυμός ay maaaring tumukoy sa poot, matinding galit, o nag-aalab na silakbo o pagnanasa.
    reason: lexical_alternative
  - marker: b
    text: Ang “seksuwal na imoralidad” ng Babilonia ay malamang na isang larawang tumutukoy sa kanyang mapanirang, idolatroso, at di-tapat na impluwensiya, ngunit hindi ito nililimitahan ng talata sa isa lamang sa mga kahulugang ito.
    reason: cultural_note
  - marker: c
    text: Maaari ring unawain na “nilasing ang lahat ng bansa.” Literal na sinasabi ng Griyego na pinainom niya ang lahat ng bansa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: isa pang anghel, ang ikalawa
  rationale: Pinananatili ang parehong ἄλλος (‘isa pa’) at δεύτερος (‘ikalawa’) habang gumagamit ng likas na apposisyon sa Tagalog.
- source_word: ἠκολούθησεν
  choice: sumunod
  rationale: Ipinahahayag ang pagkakasunod-sunod ng mga anghel sa pangitain nang tuwiran at natural.
- source_word: λέγων
  choice: na nagsasabi
  rationale: Pinananatili ang participial na ugnayan nito sa pandiwang ‘sumunod.’
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Bumagsak, bumagsak na
  rationale: Pinananatili ang mariing pag-uulit at ang ganap na pagkahayag ng pagbagsak; ang ‘na’ ay likas na nagpapahiwatig ng natupad na pangyayari sa Tagalog.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: ang dakilang Babilonia
  rationale: Natural na ayos sa Tagalog para sa pangalang may titulong naglalarawan, habang pinananatili ang kadakilaan bilang bahagi ng bansag.
- source_word: ἣ
  choice: Siya ang
  rationale: Ipinagpapatuloy ang personipikasyon ng Babilonia bilang babae/lungsod sa abot ng likas na magagawa sa Tagalog.
- source_word: ἐκ τοῦ οἴνου
  choice: ng alak
  rationale: Sa konstruksiyong ‘nagpainom … ng alak,’ likas na naipapahayag sa Tagalog ang alak bilang bagay o pinagmumulan ng ipinainom, kahit hindi hiwalay na naisasalin ang ἐκ.
- source_word: τοῦ θυμοῦ
  choice: matinding pagnanasa
  rationale: Sa pagkakaugnay nito sa πορνεία, ipinahahayag nito ang nag-aalab at mapusok na puwersa nang hindi awtomatikong itinuturing na poot ng Diyos; inilalagay sa talababa ang ibang leksikal na posibilidad.
- source_word: τῆς πορνείας αὐτῆς
  choice: ng kanyang seksuwal na imoralidad
  rationale: Malinaw at malawak ang modernong parirala at naiiwang bukas kung literal o metaporikal ang larawan.
- source_word: πεπότικεν
  choice: nagpainom
  rationale: Tumpak na naihahayag ng pandiwang sanhi ang ‘ginawang uminom’ nang mas natural sa Tagalog.
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng bansa
  rationale: Tumutukoy sa mga bansa o bayan sa pangkalahatan, hindi lamang sa mga Hentil bilang kaibahan sa mga Judio.
theological_decisions:
- issue: Metaporikal na puwersa ng πορνεία ng Babilonia
  choice: seksuwal na imoralidad
  alternative: prostitusyon; idolatriya; pagtataksil
  rationale: Pinananatili sa pangunahing teksto ang mismong seksuwal na larawan at hindi ito nililimitahan sa iisang paliwanag na teolohikal o pampolitika.
- issue: Kahulugan ng θυμός sa pariralang kaugnay ng πορνεία
  choice: matinding pagnanasa
  alternative: poot; galit; matinding silakbo
  rationale: Ang gramatikal na pagkakaugnay sa seksuwal na imoralidad ay nagpapahintulot sa diwang mapusok na pagnanasa, ngunit tunay na posible rin ang poot o galit kaya pinananatili iyon sa talababa.
- issue: Personipikasyon ng Babilonia
  choice: Siya ang nagpainom
  alternative: Ito ang nagpainom
  rationale: Ang pambabaeng panghalip sa Griyego at ang mas malawak na larawan sa Apocalipsis ay nagpapakilala sa Babilonia bilang personipikadong babae/lungsod; hindi na dinagdagan ng paliwanag ang pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mariing pag-uulit, ang apposisyong ‘ang ikalawa,’ at ang personipikasyon ng Babilonia. Ginamit ang ‘seksuwal na imoralidad’ sa halip na mas makitid o makalumang mga katawagan.
