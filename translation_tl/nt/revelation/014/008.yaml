  source_fidelity: Tumpak na naipapahayag ng draft ang ikalawang anghel, ang mariing dobleng pagpapahayag ng pagbagsak, ang personipikadong Babilonia, ang sanhi ng pagpapainom, at ang saklaw na lahat ng bansa. Gayunman, ang “na nagsasabi” ay hindi likas sa ganitong nakalipas na pagsasalaysay sa Filipino; ang “at nagsabi” ay mas tapat sa tungkulin ng participle sa konteksto nang hindi binabago ang kahulugan.
  naturalness: Ang pangunahing pangungusap ay malinaw at nasa angkop na marangal na rehistro. Ang pagpapalit ng “na nagsasabi” sa “at nagsabi” ay nag-aalis ng hindi natural na aspekto at nagpapalinaw ng daloy. Ang “matinding pagnanasa” ay pinananatili bilang isang posibleng pagbasa ng θυμός, na may talababa para sa iba pang posibilidad.
  terminology: Ang “Babilonia,” “lahat ng bansa,” at “seksuwal na imoralidad” ay pare-pareho at nauunawaan sa modernong Filipino. Ang “Siya” ay wastong pagpapanatili ng personipikasyon ng Babilonia. Ang mga talababa ay wastong nakaangkla sa mga salitang tinutukoy nila.
