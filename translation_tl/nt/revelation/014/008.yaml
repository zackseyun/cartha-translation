- from: At sumunod ang isa pang anghel, ang ikalawa, na nagsasabi, “Bumagsak, bumagsak na ang dakilang Babilonia! Siya ang nagpainom sa lahat ng bansa ng alak ng matinding pagnanasa[a] ng kanyang seksuwal na imoralidad[b].”[c]
  to: At sumunod ang isa pang anghel, ang ikalawa, at nagsabi, “Bumagsak, bumagsak na ang dakilang Babilonia! Siya ang nagpainom sa lahat ng bansa ng alak ng matinding pagnanasa[a] ng kanyang seksuwal na imoralidad[b].”[c]
  rationale: 'Isang maliit na estilistikong pagwawasto lamang ang ginawa: “na nagsasabi” ay pinalitan ng “at nagsabi.” Pinananatili nito ang kahulugang ipinahahayag ng λέγων habang gumagamit ng likas na modernong Filipino sa nakalipas na pagsasalaysay. Hindi binago ang mga salitang teolohikal, ang sinasadyang kalabuan ng θυμός, ang personipikasyon, o ang mga ankla at nilalaman ng talababa.'
