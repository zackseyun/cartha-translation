id: REV.14.12
reference: Revelation 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: tl
  text: Narito ang pagtitiis ng mga banal, yaong mga tumutupad sa mga utos ng Diyos at nanghahawakan sa pananampalataya ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pananampalataya kay Jesus” o “ang katapatan ni Jesus.” Malabo ang pariralang Griyego kung alin sa mga kahulugang ito ang tinutukoy.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Dito makikita
  rationale: Ang ὧδε ay tumutukoy sa kalagayang inilalarawan. Ang “Dito makikita” ay natural sa modernong Tagalog at naipapahayag ang retorikal na diwa nang hindi nilulutas kung ang diin ay sa pagkakataon o sa katibayan.
- source_word: ὑπομονὴ
  choice: pagtitiis
  rationale: Tumutukoy ito sa matatag na pananatili sa gitna ng pagsubok. Ang “pagtitiis” ay malinaw, maikli, at karaniwan sa Tagalog.
- source_word: ἁγίων
  choice: mga banal
  rationale: Ito ang likas na salin ng katawagang tumutukoy sa bayang ibinukod ng Diyos, at hindi nito ipinahihiwatig na iilang natatanging tao lamang ang tinutukoy.
- source_word: τηροῦντες
  choice: tumutupad
  rationale: Sa kaugnayan ng mga utos, ipinahihiwatig ng participle ang masunurin at patuloy na pagsunod. Mas natural dito ang “tumutupad” kaysa “nag-iingat.”
- source_word: ἐντολὰς
  choice: mga utos
  rationale: Karaniwan at malinaw na katumbas ito ng mga banal na kautusan, nang walang di-kinakailangang pagpapabigat sa pangungusap.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Pinananatili nito ang pangunahing leksikal na kahulugan at ang teolohikal na tensiyon ng parirala; inilalahad sa talababa ang posibleng diwang “katapatan.”
- source_word: Ἰησοῦ
  choice: ni Jesus
  rationale: Tuwirang kinakatawan ng Tagalog na genitibong “ni Jesus” ang Ἰησοῦ at pinananatili ang tunay na kalabuan kung ito ay pananampalataya kay Jesus o pananampalataya/katapatan na nauugnay kay Jesus.
theological_decisions:
- issue: Kahulugan ng τὴν πίστιν Ἰησοῦ
  choice: ang pananampalataya ni Jesus
  alternative: pananampalataya kay Jesus; ang katapatan ni Jesus
  rationale: Maaaring unawain ang genitive bilang pananampalatayang nakatuon kay Jesus o bilang pananampalataya/katapatan ni Jesus. Pinananatili ng pangunahing teksto ang anyong malapit sa Griyego, at inilalagay sa talababa ang mga interpretatibong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga banal” bilang pangkalahatang katawagan sa bayan ng Diyos. Ang hulma ng pangungusap ay nagpapanatili sa appositional na ugnayan ng “sila na…” sa “mga banal,” at ang talababa lamang ang nagpapaliwanag sa kalabuan ng genitive.
