  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: tl
  text: At nakita ko ang isa pang anghel na lumilipad sa kalagitnaan ng langit[a], na may isang walang-hanggang ebanghelyo upang ipahayag sa mga naninirahan sa lupa[b] at sa bawat bansa, lipi, wika, at bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng himpapawid” o “sa gitna ng langit”; ang salitang Griyego ay isang natatanging apokaliptikong katawagan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga nakaupo sa lupa”; sa Pahayag, ang pananalitang ito ay idyomatikong tumutukoy sa mga naninirahan sa lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: isa pang anghel
  rationale: Ang “isa pa” ay likas na Tagalog para sa ἄλλον at pinananatili ang pagkakasunod-sunod ng pangitain; sa konteksto ng Pahayag, ang ἄγγελος ay makalangit na anghel.
- source_word: πετόμενον
  choice: lumilipad
  rationale: Inilalarawan ng pangkasalukuyang participle ang anghel habang kumikilos; malinaw at natural ang “lumilipad.”
- source_word: ἐν μεσουρανήματι
  choice: sa kalagitnaan ng langit
  rationale: Pinananatili nito ang natatanging apokaliptikong larawan ng μεσουράνημα habang mas madaling maunawaan sa makabagong Tagalog kaysa sa isang teknikal na hiram na termino.
- source_word: ἔχοντα
  choice: Taglay niya
  rationale: Ipinapahayag ang pagkakaroon o pag-aangkin nang hindi ipinapalagay na pisikal na hawak ng anghel ang mensahe.
- source_word: εὐαγγέλιον αἰώνιον
  choice: isang walang-hanggang ebanghelyo
  rationale: Pinananatili ng “ebanghelyo” ang kinikilalang biblikal na diwa ng εὐαγγέλιον; ipinakikita ng “isang” ang kawalan ng pantukoy sa Griyego, at ng “walang-hanggan” ang αἰώνιον.
- source_word: εὐαγγελίσαι
  choice: upang ipahayag
  rationale: Malinaw na ipinakikita ang layunin ng infinitive at iniiwasan ang alanganing pag-uulit ng “ebanghelyo.”
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: sa mga naninirahan sa lupa
  rationale: Bagaman literal na “mga nakaupo sa lupa,” idiomatiko itong tumutukoy sa mga naninirahan sa daigdig sa Pahayag; hindi inililihis ng salin ang pansin tungo sa postura.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: bawat bansa, lipi, wika, at bayan
  rationale: Pinananatili ang apat na bahaging pormula at ang pandaigdig na saklaw nito sa malinaw at likas na Tagalog.
theological_decisions:
- issue: Kung tradisyonal na terminong Kristiyano o pangkalahatang pananalita ang gagamitin para sa εὐαγγέλιον αἰώνιον
  choice: isang walang-hanggang ebanghelyo
  alternative: ang walang-hanggang magandang balita
  rationale: Pinananatili ng “ebanghelyo” ang kanonikal at teolohikal na ugnayan ng salita nang hindi nagdaragdag ng nilalamang doktrinal; hindi rin ginagawang tiyak ang pariralang walang pantukoy sa Griyego.
- issue: Kung literal na postura o idiomatikong paninirahan ang ihahayag sa τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: mga naninirahan sa lupa
  alternative: mga nakaupo sa lupa
  rationale: Ang piniling salin ay kumakatawan sa paulit-ulit na apokaliptikong katawagan sa mga naninirahan sa lupa at umiiwas sa mapanlinlang na larawan ng pisikal na pag-upo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginawang dalawang pangungusap upang maging malinaw ang ugnayan ng mga participle nang hindi binabago ang diwa; pinanatili ang koordinasyong “at” bago ang pangkalahatang apat na bahaging talaan.
