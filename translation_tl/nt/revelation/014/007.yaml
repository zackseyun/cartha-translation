id: REV.14.7
reference: Revelation 14:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: tl
  text: na nagsasalita nang malakas, “Matakot kayo sa Diyos[a] at magbigay kayo sa kanya ng kaluwalhatian, sapagkat dumating na ang oras ng kanyang paghatol. Sambahin ninyo ang gumawa ng langit, lupa, dagat, at mga bukal ng tubig[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magpitagan kayo sa Diyos.” Ang pandiwang Griyego ay maaaring tumukoy sa mapitagang takot gayundin sa pangamba sa harap ng paghatol.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, literal na “mga bukal ng mga tubig”; karaniwang ipinahahayag ito sa Filipino bilang “mga bukal ng tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: na nagsasabi sa malakas na tinig
  rationale: Pinananatili ang participial na ugnayan sa naunang talata at ang tahasang larawan ng isang malakas na tinig, sa halip na gawing simpleng pang-abay lamang.
- source_word: Φοβήθητε τὸν θεὸν
  choice: Matakot kayo sa Diyos
  rationale: Ang “matakot” ay maaaring magpahiwatig kapuwa ng pagpipitagan at ng takot sa harap ng paghatol; hindi nito pinapahina ang tensiyong nasa konteksto.
- source_word: δότε αὐτῷ δόξαν
  choice: magbigay kayo sa kanya ng kaluwalhatian
  rationale: Pinananatili ang konkretong idyomang “magbigay ng kaluwalhatian” at malinaw na tumutukoy sa Diyos ang “sa kanya.”
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: sapagkat dumating na ang oras ng kanyang paghatol
  rationale: Ginagawang sanhi ng utos ang ὅτι, pinananatili ang apokaliptikong “oras,” at hindi nilulutas nang labis kung ang genitibo ay paghatol na pag-aari, inilabas, o isinasagawa ng Diyos.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: Sambahin ninyo ang gumawa
  rationale: Sa Pahayag, ang προσκυνέω ay karaniwang tumutukoy sa relihiyosong pagsamba; pinananatili naman ng “ang gumawa” ang pandiwang lakas ng participle.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: langit, lupa, dagat, at mga bukal ng tubig
  rationale: Natural na salin sa Filipino na pinananatili ang malinaw na alingawngaw ng wika ng paglikha. Ang “mga bukal ng tubig” ay mas likas kaysa sa mekanikal na “mga bukal ng mga tubig.”
theological_decisions:
- issue: Saklaw ng utos na Φοβήθητε τὸν θεόν
  choice: Matakot kayo sa Diyos
  alternative: Igalang ninyo nang may pagpipitagan ang Diyos
  rationale: Magkasamang lumilitaw ang takot, pagbibigay ng kaluwalhatian, pagsamba, at nalalapit na paghatol. Pinananatili ng “matakot” ang posibleng saklaw mula sa mapitagang takot hanggang sa pangamba sa harap ng Hukom, sa halip na paliitin ito sa paggalang lamang.
- issue: Kahulugan ng τῆς κρίσεως αὐτοῦ
  choice: ng kanyang paghatol
  alternative: ng paghatol niya
  rationale: Ang parirala ay sadyang maikli at maaaring magpahiwatig ng paghatol na mula sa Diyos o isinasagawa niya. Ang “kanyang paghatol” ay nagpapanatili ng ganitong lapad nang hindi nagdaragdag ng paliwanag sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong nakaugnay sa naunang talata sa pamamagitan ng “na nagsasabi,” ang matimbang na wikang “matakot” at “kaluwalhatian,” at ang ritmo ng talaan ng mga nilikha. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang tinatalakay ng mga talababa.
