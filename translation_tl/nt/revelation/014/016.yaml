id: REV.14.16
reference: Revelation 14:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: tl
  text: At inihagis ng nakaupo sa ulap[c] ang kanyang karit sa lupa[a], at ang lupa ay inani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipinukol ang kanyang karit sa lupa.” Literal na nangangahulugang “inihagis/ipinukol” ang pandiwang Griego, ngunit sa larawang ito ng pag-aani, tumutukoy ito sa pagpapakilos ng karit upang gumapas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ginapas ang lupa.”
    reason: lexical_alternative
  - marker: c
    text: Batay sa naunang konteksto, madalas kilalanin ang nakaupo sa ulap bilang Anak ng Tao, ngunit “ang nakaupo sa ulap” lamang ang sinasabi ng talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: inihagis
  rationale: Pinananatili nito ang karaniwang diwa ng βάλλω na ‘ihagis’ o ‘ipukol.’ Sa konteksto ng pag-aani, inilalarawan nito ang pagpapakilos ng karit upang gumapas; nililinaw ang ganitong diwa sa talababa.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: ang nakaupo sa ulap
  rationale: Tapat itong nagsasalin sa substantibong participle nang hindi tahasang pinapangalanan ang tauhan nang higit sa sinasabi ng talata.
- source_word: δρέπανον
  choice: karit
  rationale: Ang ‘karit’ ang karaniwan at malinaw na katawagan sa kasangkapang ginagamit sa paggapas at pinananatili nito ang larawang pang-ani.
- source_word: ἐπὶ τὴν γῆν
  choice: sa lupa
  rationale: Ipinahahayag nito ang direksiyon ng kilos patungo sa γῆ. Likas ito sa modernong Tagalog at hindi labis na ipinapaliwanag ang larawan.
- source_word: ἐθερίσθη
  choice: ay inani
  rationale: Pinananatili ng anyong balintiyak ang aorist passive ng θερίζω. Ang ‘inani’ ay natural sa Tagalog at maaari ring unawaing ‘ginapas,’ gaya ng nakasaad sa talababa.
- source_word: ἡ γῆ
  choice: ang lupa
  rationale: Sa malawak at apokaliptikong konteksto ng Pahayag, ang γῆ ay tumutukoy sa lupa o daigdig, hindi lamang sa isang lokal na lupain. Pinananatili rin ang pag-uulit ng salita sa talata.
theological_decisions:
- issue: Pagkakakilanlan ng nakaupo sa ulap
  choice: Inilarawan lamang bilang ‘ang nakaupo sa ulap,’ ayon sa mismong teksto.
  alternative: Tahasan siyang tukuyin bilang Anak ng Tao/Mesiyas o bilang isang anghel na kinatawan.
  rationale: Hindi pinapangalanan ng talatang ito ang tauhan. Bagaman ipinahihiwatig ng naunang konteksto ang Anak ng Tao, hindi dapat lutasin ng salin ang pagkakakilanlang hindi tahasang nilulutas ng mismong pangungusap.
- issue: Larawan ng pag-aani bilang paghatol
  choice: Panatilihin ang payak na larawang ‘inani ang lupa’ nang hindi tinutukoy sa pangunahing teksto kung anong uri ng paghatol ang isinasagawa.
  alternative: Ipaliwanag sa salin na ito ay paghatol sa masasama o pagtitipon sa mga matuwid.
  rationale: Ang talata ay gumagamit ng larawan ng pag-aani ngunit hindi nito rito lamang tahasang tinutukoy ang eksaktong saklaw o layon nito. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling estruktura at pag-uulit ng ‘lupa’ sa Griego. Ginamit ang ‘inihagis’ upang mapanatili ang kongkretong lakas ng ἔβαλεν, habang ang talababa ang nagpapaliwanag sa gamit nito sa konteksto ng paggapas.
