id: REV.14.2
reference: Revelation 14:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: tl
  text: At nakarinig ako ng tunog mula sa langit, na gaya ng lagaslas ng maraming tubig[b] at gaya ng dagundong ng malakas na kulog. Ang tunog na narinig ko ay gaya ng mga manunugtog ng alpa na tumutugtog ng kani-kanilang alpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang instrumentong Griyego na κιθάρα ay isang sinaunang instrumentong may kuwerdas na mas kahawig ng lira; ayon sa tradisyon, isinasalin itong “alpa.”
    reason: cultural_note
  - marker: b
    text: Ang “maraming tubig” ay larawang biblikal para sa napakalakas at nakabibinging ugong; ihambing sa Ezekiel 43:2.
    reason: cross_reference
lexical_decisions:
- source_word: φωνή
  choice: tunog
  rationale: Sa tatlong paglitaw nito, ang φωνή ay inihahambing sa tubig, kulog, at tugtog ng mga instrumento. Ang “tunog” ay natural sa Tagalog at hindi nagpapahiwatig na tiyak na tinig ng isang nagsasalita ang tinutukoy.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Sa konteksto ng Pahayag, ang οὐρανός ay tumutukoy sa makalangit na dako; malinaw at natural ang “mula sa langit.”
- source_word: ὡς
  choice: gaya ng
  rationale: Ipinakikilala ng ὡς ang magkakasunod na paghahambing; dignified at karaniwang gamit ang “gaya ng.”
- source_word: ὑδάτων πολλῶν
  choice: lagaslas ng maraming tubig
  rationale: Pinananatili ng “maraming tubig” ang biblikal na larawan, habang ipinahihiwatig ng “lagaslas” ang malakas at tuloy-tuloy na tunog na siyang punto ng paghahambing.
- source_word: βροντῆς μεγάλης
  choice: dagundong ng malakas na kulog
  rationale: Ipinapahayag ng “malakas” ang tindi ng μεγάλης, at likas na inilalarawan ng “dagundong” ang naririnig na puwersa ng kulog.
- source_word: κιθαρῳδῶν
  choice: mga manunugtog ng alpa
  rationale: Sa konteksto, nililinaw ng kasunod na κιθαριζόντων na tumutugtog sila ng instrumentong κιθάρα. Ang “manunugtog ng alpa” ay malinaw at hindi nagdaragdag ng pagkanta na hindi tahasang binabanggit dito.
- source_word: κιθαριζόντων
  choice: tumutugtog
  rationale: Direkta at natural nitong isinasalin ang kilos ng pagtugtog sa instrumentong may kuwerdas.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: ng kani-kanilang alpa
  rationale: Natural sa Tagalog ang pariralang “tumutugtog ng ... alpa.” Ipinakikita ng “kani-kanilang” na ang bawat manunugtog ay may sariling instrumento.
theological_decisions:
- issue: Kalikasan ng narinig mula sa langit
  choice: Isinalin ang φωνή bilang “tunog” sa lahat ng paglitaw.
  alternative: “Tinig” sa lahat o ilan sa mga paglitaw.
  rationale: Hindi tinutukoy ng talata kung may nagsasalita. Ang mga paghahambing sa tubig, kulog, at tugtog ay nakatuon sa naririnig na katangian, kaya pinananatili ng “tunog” ang pagiging bukas ng larawan nang hindi nagdaragdag ng personal na tagapagsalita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lagaslas” at “dagundong” upang maging malinaw at likas ang tunog ng mga paghahambing, habang pinanatili ang “maraming tubig” bilang mahalagang larawang biblikal. Inalis ang footnote tungkol sa alternatibong “tinig” sapagkat naipapaliwanag ito sa mga desisyong salin ngunit hindi kailangan para maunawaan ang talata; ang lahat ng aktuwal na footnote ay may katugmang marker sa pangunahing teksto.
