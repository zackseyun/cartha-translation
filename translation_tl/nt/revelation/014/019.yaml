  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: tl
  text: At iniwagayway ng anghel ang kanyang karit sa ibabaw ng lupa, at inani niya ang punong ubas ng lupa, at inihagis niya ito sa pisaan ng ubas ng dakilang poot ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: inihampas ... ang karit sa ibabaw ng lupa
  rationale: Sa konteksto ng paggapas, ang βάλλω ay tumutukoy sa mabilis at malakas na paggamit ng karit. Iniiwasan ng “sa ibabaw ng lupa” ang di-likas na impresyong ibinaon lamang ito sa lupa.
- source_word: ἐτρύγησεν
  choice: ginapas
  rationale: Ipinahahayag ang pag-aani sa pamamagitan ng karit habang pinananatili ang masidhing larawan ng teksto.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: ang punong ubas ng lupa
  rationale: Pinananatili ang isahang kolektibong larawan ng ἄμπελος at ang paulit-ulit na “ng lupa.”
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: sa malaking pisaan ng ubas
  rationale: Ang ληνός ay pisaan para sa ubas; ginawang tahasan ang “ubas” upang maging malinaw sa karaniwang mambabasa.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: ng poot ng Diyos
  rationale: Ang θυμός dito ay matinding poot sa konteksto ng paghuhukom; ang tradisyonal ngunit kasalukuyang “poot” ay malinaw at marangal.
theological_decisions:
- issue: Ang relasyon ng pisaan sa poot ng Diyos
  choice: pisaan ng ubas ng poot ng Diyos
  alternative: pisaan ng ubas kung saan ibinubuhos ang poot ng Diyos
  rationale: Pinananatili ang siksik at metaporikal na genitive construction ng Griyego sa halip na ipaliwanag kung paano kaugnay ng pisaan ang poot.
- issue: Ang bagay na inihagis sa pisaan
  choice: iyon
  alternative: ang mga ubas nito
  rationale: Ang teksto ay gumagamit ng panghalip na tumutukoy sa kolektibong “punong ubas”; hindi idinagdag ang “mga ubas” kahit natural itong ipinahihiwatig ng larawan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang sunod-sunod na “at” upang maipakita ang mabilis at solemne na daloy ng pangitain.
