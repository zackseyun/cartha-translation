id: REV.14.15
reference: Revelation 14:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: tl
  text: At isa pang anghel ang lumabas mula sa santuwaryo at sumigaw nang malakas sa nakaupo sa ulap, “Iusad mo ang iyong karit at gumapas ka, sapagkat dumating na ang oras ng paggapas, sapagkat natuyo na ang ani ng lupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: santuwaryo
  rationale: Tumutukoy sa banal na santuwaryo o templo mismo, hindi sa buong bakuran ng templo; pinananatili ng “santuwaryo” ang mas tiyak na diwa.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Gamitin mo ang iyong karit
  rationale: Literal na may diwang “ipadala/iusad ang iyong karit,” ngunit sa konteksto ng paggapas, natural sa modernong Tagalog ang utos na gamitin ang karit nang hindi binabago ang kilos na hinihingi.
- source_word: θέρισον / θερίσαι
  choice: gumapas / paggapas
  rationale: Pinananatili ang pag-uulit ng iisang salitang-ugat at ang malinaw na larawang pang-ani.
- source_word: ἐξηράνθη ὁ θερισμὸς τῆς γῆς
  choice: hinog na ang aanihin sa lupa
  rationale: Ang ἐξηράνθη ay literal na “natuyo,” ngunit sa pananim ay nagsasaad na handa na itong anihin. Ang salin ay natural at pinananatili ang metaporang pang-ani nang hindi ipinapasok ang mas matinding “sobrang hinog.”
theological_decisions:
- issue: Kung ang pag-ani ay dapat tukuying paghatol o pagliligtas
  choice: Hindi tahasang tinukoy; pinanatili lamang ang larawang pang-ani.
  alternative: Isaling may paliwanag na “handa na sa paghatol” o “handa na sa pagtitipon.”
  rationale: Hindi tahasang nilulutas ng talata ang simbolikong kahulugan ng pag-ani; ang pagdaragdag ng alinman ay mag-aangkat ng interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “santuwaryo,” “karit,” at “gumapas” bilang tumpak ngunit karaniwang bokabularyong biblikal; pinanatili ang tuwirang utos at apurahang tono.
