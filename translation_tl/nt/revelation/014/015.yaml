  verdict: revise
  source_fidelity: Kailangang panatilihin ang mas tiyak na kilos ng Πέμψον (“ipadala/iusad”) sa halip na pangkalahatang “gamitin.” Ang ἐξηράνθη ay literal na “natuyo na”; sa kontekstong pang-ani, ipinahihiwatig nito na handa na ang ani, ngunit ang “hinog na” lamang ay hindi naipapakita ang imaheng ginamit sa Griyego.
  naturalness: Natural at marangal ang daloy ng pangungusap. Ang “iusad mo ang iyong karit” ay mas malapit sa utos ng pinagmulan at nauunawaan sa larawang paggapas.
  terminology: Ang “santuwaryo,” “karit,” at “gumapas/paggapas” ay angkop at magkakatugma. Pinalitan ang “aanihin sa lupa” ng “ani ng lupa” upang matumbasan ang ὁ θερισμὸς τῆς γῆς.
  issues:
