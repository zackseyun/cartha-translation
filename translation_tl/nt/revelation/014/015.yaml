    issue: “Gamitin mo ang iyong karit” ay mas pangkalahatan kaysa Πέμψον τὸ δρέπανόν σου.
    rationale: Ang pandiwang Griyego ay may kongkretong diwang pagpapadala o pagpapausad ng karit; ang “gamitin” ay hindi mali sa konteksto ngunit pinapahina ang larawan at utos.
  - severity: medium
    issue: “Hinog na” ay hindi tuwirang isinasalin ang ἐξηράνθη.
    rationale: Literal na “natuyo na” ang anyo sa Griyego. Maaari itong magpahiwatig ng kahandaan sa pag-ani, ngunit dapat manatili sa pangunahing teksto ang imaheng “natuyo.”
  revised_text: At isa pang anghel ang lumabas mula sa santuwaryo at sumigaw nang malakas sa nakaupo sa ulap, “Iusad mo ang iyong karit at gumapas ka, sapagkat dumating na ang oras ng paggapas, sapagkat natuyo na ang ani ng lupa.”
