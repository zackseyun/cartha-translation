id: REV.14.10
reference: Revelation 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: tl
  text: Iinom din siya mula sa alak ng poot ng Diyos, na inihanda, ngunit walang halo, sa kopa ng kanyang galit,[a] at pahihirapan siya sa apoy at asupre sa harap ng mga banal na anghel at sa harap ng Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “inihanda o hinalo, ngunit walang halo.” Pinagsasama ng Griyego ang ideya ng alak na inihanda o hinalo at alak na hindi binantuan o pinalabnaw, kaya idiniriin ang hatol sa buong tindi nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς πίεται
  choice: Iinom din siya
  rationale: Ipinahihiwatig ng καὶ ang pagdaragdag, at binibigyang-diin ng αὐτός ang taong tinutukoy sa naunang talata. Likas sa modernong Tagalog ang ayos na “Iinom din siya.”
- source_word: ἐκ τοῦ οἴνου
  choice: mula sa alak
  rationale: Pinananatili ng “mula sa” ang diwa ng ἐκ at ang larawan ng pag-inom mula sa isang pinagkukunan.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: ng poot ng Diyos
  rationale: Sa konteksto ng paghuhukom sa Pahayag, ang θυμός ay tumutukoy sa matinding poot ng Diyos. Ang “poot” ay malinaw, marangal, at may sapat na bigat.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: na inihandang walang halo
  rationale: Pinagsasama ng Griyego ang ideya ng alak na inihanda o hinalo at ng alak na hindi binantuan. Inihahatid ng “inihandang walang halo” ang buong lakas ng alak nang hindi lumilikha ng likas na kontradiksiyon sa Tagalog; nililinaw sa talababa ang mas literal na anyo.
- source_word: ἐν τῷ ποτηρίῳ
  choice: sa kopa
  rationale: Tuwirang katumbas ng ἐν ang “sa,” at pinananatili nito ang alak na nasa loob ng kopa sa halip na gawing tahasang kilos ng pagbuhos ang hindi tahasang sinasabi ng teksto.
- source_word: τῆς ὀργῆς αὐτοῦ
  choice: ng kanyang galit
  rationale: Ang “galit” ay natural na katumbas ng ὀργή at nagpapanatili ng bahagyang pagkakaiba nito sa θυμός na isinaling “poot.” Malinaw sa konteksto na ang tinutukoy ng “kanyang” ay ang Diyos.
- source_word: βασανισθήσεται
  choice: pahihirapan siya
  rationale: Pinananatili ng anyong balintiyak ang matinding kaparusahang pagdurusa nang hindi nagdaragdag ng tahasang tagaganap.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: sa apoy at asupre
  rationale: Ang “asupre” ang malinaw at makabagong tawag sa θείον. Pinananatili ng “sa” ang ἐν at ang larawang apokaliptiko.
- source_word: ἐνώπιον ἀγγέλων ἁγίων
  choice: sa harap ng mga banal na anghel
  rationale: Ang “sa harap ng” ay likas na nagpapahayag ng pagiging nasa paningin o presensiya nila; ang “mga” ay kinakailangan sa Tagalog upang malinaw ang maramihan.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Ang “Kordero” ang nakikilalang titulong kristolohikal sa Pahayag; ang malaking titik ay nagpapakitang titulo ito rito.
theological_decisions:
- issue: Pagkakaiba ng θυμός at ὀργή sa iisang talata
  choice: Isalin ang θυμός bilang “poot” at ang ὀργή bilang “galit.”
  alternative: Isalin ang dalawang salita bilang “poot,” o isalin ang θυμός bilang “matinding galit” at ang ὀργή bilang “poot.”
  rationale: Magkaugnay ngunit magkaibang salita ang ginamit ng Griyego. Ang magkaibang salin ay nagpapanatili ng retorikal na pagkakaiba nang hindi ipinipilit ang isang tiyak na sistematikong pagkakaiba sa kahulugan.
- issue: Tensiyon sa τοῦ κεκερασμένου ἀκράτου
  choice: Gamitin sa pangunahing teksto ang “inihandang walang halo” at ipaliwanag sa talababa ang literal na tensiyon.
  alternative: “hinalong puro” o “hinalo ngunit walang halo”
  rationale: Ang parirala ay sadyang nagsasama ng alak na inihanda o hinalo at alak na hindi binantuan. Pinananatili ng salin ang diin sa hatol na walang anumang pagpapahina, habang hindi itinatago ng talababa ang di-pangkaraniwang pahayag ng orihinal.
- issue: Saklaw ng ἐνώπιον
  choice: Panatilihin ang “sa harap” nang hindi ipinapaliwanag kung ano ang teolohikal na papel ng mga anghel at ng Kordero.
  alternative: “sa presensiya” o pagpapaliwanag na sila ay mga saksi o tagapangasiwa ng parusa
  rationale: Sinasabi ng teksto ang lokasyon o presensiya ngunit hindi tahasang itinatakda ang eksaktong papel nila. Ang salin ay hindi dapat magdagdag ng interpretasyong wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “kopa” at “Kordero” bilang pamilyar na bokabularyong biblikal, samantalang “asupre” ang piniling kasalukuyang salita. Iniwasan ang labis na literal na “hinalong walang halo” sa pangunahing teksto ngunit pinanatili sa talababa ang tunay na leksikal na tensiyon.
