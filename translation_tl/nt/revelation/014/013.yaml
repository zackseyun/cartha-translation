    rationale: Isinasalin ng draft ang οἱ ἐν κυρίῳ ἀποθνῄσκοντες ngunit hindi ang naunang οἱ νεκροί. Bagaman iniiwasan nito ang tila paulit-ulit na pahayag, nababawasan nito ang tahasang paglalarawan ng pinagpala bilang “mga patay.”
  - severity: low
