- from: 'At narinig ko ang isang tinig mula sa langit na nagsasabi, “Isulat mo: Pinagpala ang mga namamatay na nasa Panginoon mula ngayon.” “Oo,” sabi ng Espiritu, “upang makapagpahinga sila mula sa kanilang mga pagpapagal[a], sapagkat ang kanilang mga gawa ay sumusunod na kasama nila[b].”'
  to: 'At narinig ko ang isang tinig mula sa langit na nagsasabi, “Isulat mo: Pinagpala ang mga patay—yaong mga namamatay na nasa Panginoon mula ngayon.” “Oo,” sabi ng Espiritu, “upang makapagpahinga sila mula sa kanilang mga pagpapagal[a], sapagkat kasabay nilang sumusunod ang kanilang mga gawa[b].”'
  rationale: Ibinalik ang οἱ νεκροί bilang “ang mga patay” at ginawang appositional ang kasunod na participial na parirala upang maging malinaw at natural sa modernong Tagalog. Inayos din ang hulíng sugnay upang mapanatili ang “kasama nila” na diwa ng μετ’ αὐτῶν nang hindi gumagamit ng di-karaniwang ayos ng salita.
