id: REV.14.13
reference: Revelation 14:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: tl
  text: 'At narinig ko ang isang tinig mula sa langit na nagsasabi, “Isulat mo: Pinagpala ang mga patay—yaong mga namamatay na nasa Panginoon mula ngayon.” “Oo,” sabi ng Espiritu, “upang makapagpahinga sila mula sa kanilang mga pagpapagal[a], sapagkat kasabay nilang sumusunod ang kanilang mga gawa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hirap” o “nakapapagod na paggawa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang kanilang mga gawa ay sumusunod sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: isang tinig mula sa langit na nagsasabi
  rationale: Likas sa modernong Tagalog ang “tinig mula sa langit”; pinananatili ng “na nagsasabi” ang participial na pagpapakilala sa pahayag.
- source_word: Γράψον
  choice: Isulat mo
  rationale: Tuwirang utos sa ikalawang panauhang isahan; natural sa Tagalog ang may panghalip na “mo” nang hindi nagdaragdag ng tahasang layon.
- source_word: Μακάριοι
  choice: Pinagpala
  rationale: Karaniwang marangal na pananalita sa mga beatitude at higit na angkop kaysa sa simpleng “maligaya.”
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: ang mga namamatay na nasa Panginoon
  rationale: Sa halip na ulitin nang alanganin ang “mga patay na namamatay,” ipinahahayag nito nang natural ang tinutukoy na pangkat habang pinananatili ang mahalagang pariralang “nasa Panginoon.”
- source_word: ἀπ’ ἄρτι
  choice: mula ngayon
  rationale: Malinaw at kasalukuyang katumbas ng temporal na parirala.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: “Oo,” sabi ng Espiritu
  rationale: Pinananatili ang mariing pagsang-ayon at ang Espiritu bilang tahasang tagapagsalita.
- source_word: ἵνα ἀναπαήσονται
  choice: upang makapagpahinga sila
  rationale: Ang “upang” ay nagpapanatili sa layunin o resultang himig ng ἵνα; natural na naihahatid ng “makapagpahinga” ang kapahingahang ipinagkakaloob o nararanasan nang hindi labis na nilulutas ang kakaibang future-indicative construction.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: mula sa kanilang mga pagpapagal
  rationale: Ang “pagpapagal” ay sumasaklaw sa mabigat at nakapapagod na paggawa at angkop sa marangal na rehistro.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: sapagkat ang kanilang mga gawa
  rationale: Ang “mga gawa” ang malawak at pamilyar na katumbas ng ἔργα at hindi ito nililimitahan sa isang uri lamang ng kilos.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: sumusunod na kasama nila
  rationale: Sinasadyang pinananatili ang μετά (“kasama”) sa halip na gawing simpleng “sumusunod sa kanila,” bagaman mas di-karaniwan ito sa Tagalog.
theological_decisions:
- issue: Kahulugan ng ἐν κυρίῳ
  choice: nasa Panginoon
  alternative: namamatay na tapat sa Panginoon; namamatay na kabilang sa Panginoon
  rationale: Pinananatili ang malawak na teolohikal na saklaw ng pakikipag-isa, pag-aari, at katapatan nang hindi pumipili ng iisang paliwanag.
- issue: Lakas ng ἵνα ἀναπαήσονται
  choice: upang makapagpahinga sila
  alternative: kaya magpapahinga sila; upang sila ay magpahinga
  rationale: Pinananatili ang maaaring layunin/resulta ng sugnay at hindi labis na tinutukoy kung alin ang nangingibabaw.
- issue: Ugnayan ng mga gawa sa mga namatay
  choice: ang kanilang mga gawa ay sumusunod na kasama nila
  alternative: ang kanilang mga gawa ay sumusunod sa kanila
  rationale: Inilalahad lamang ang pagsama ng kanilang mga gawa, nang hindi ipinapakahulugang ang mga ito ang dahilan ng kaligtasan o na wala silang teolohikal na kabuluhan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Pinagpala,” “Panginoon,” at “Espiritu” para sa solemneng biblikal na tono, ngunit iniwasan ang lipas o labis na pormal na balangkas. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
