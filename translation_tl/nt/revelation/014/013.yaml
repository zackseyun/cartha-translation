  naturalness: Marangal at modernong Tagalog ang rebisyon. Ang paghihiwalay na may em dash ay nagpapalinaw sa appositional na “ang mga patay, yaong mga namamatay …” nang hindi nagiging alanganing “mga patay na namamatay.”
  terminology: Pinananatili ang “Pinagpala,” “Panginoon,” “Espiritu,” “pagpapagal,” at “mga gawa.” Ang “nasa Panginoon” ay hindi nililimitahan ang saklaw ng ἐν κυρίῳ.
