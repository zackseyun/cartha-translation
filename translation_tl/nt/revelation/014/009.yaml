  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: tl
  text: At isa pang anghel, ang ikatlo, ay sumunod sa kanila, na nagsabi sa malakas na tinig, “Kung may sinumang sumasamba[a] sa halimaw at sa larawan nito, at tumatanggap ng tatak sa kanyang[b] noo o sa kanyang kamay,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumuyukod sa harap ng halimaw at ng larawan nito.” Maaaring tumukoy ang pandiwang Griyego sa pagpapatirapa, ngunit dito ay taglay nito ang diwa ng pagsamba at katapatan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, isahan ang panghalip na tumutukoy pabalik sa “sinuman.” Ang “kanyang” sa Filipino ay hindi nagtatakda ng kasarian.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: isa pang anghel, ang ikatlo
  rationale: Pinananatili ang kapuwa ἄλλος at τρίτος upang malinaw na ito ay isa pang anghel at siya ang ikatlo sa pagkakasunod-sunod.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: sumunod sa kanila
  rationale: Tuwirang ipinahahayag ang pagkakasunod ng pangyayari at ang pangmaramihang tinutukoy ng αὐτοῖς.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: na nagsabi nang malakas
  rationale: Natural sa makabagong Filipino at pinananatili ang hayagan at mariing paraan ng pagpapahayag.
- source_word: Εἴ τις
  choice: Kung may sinuman
  rationale: Naghahatid ng pangkalahatang kondisyong sumasaklaw sa kahit sinong tao.
- source_word: προσκυνεῖ
  choice: sumasamba
  rationale: Sa konteksto ng Pahayag, tumutukoy ito sa pagsambang nagpapakita ng debosyon at katapatan, hindi lamang sa pisikal na pagyukod.
- source_word: τὸ θηρίον
  choice: ang halimaw
  rationale: Karaniwan at madaling maunawaang salin ng apokaliptikong θηρίον sa Filipino.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: sa larawan nito
  rationale: Ang “nito” ay natural na tumutukoy sa “halimaw” nang hindi nagdaragdag ng kasariang hindi tahasang minamarkahan ng Griyego.
- source_word: λαμβάνει χάραγμα
  choice: tumatanggap ng tatak
  rationale: Ipinahihiwatig ng λαμβάνει ang pagtanggap, samantalang ang “tatak” ay angkop sa isang palatandaang inilalagay at nagpapakilala.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: sa kanyang noo o sa kanyang kamay
  rationale: Pinananatili ang isahan at ang parehong lokasyon ng tatak; ang “kanyang” sa Filipino ay likas na hindi tumutukoy sa kasarian.
theological_decisions:
- issue: Saklaw ng προσκυνέω kaugnay ng halimaw
  choice: sumasamba
  alternative: yumuyukod sa harap ng
  rationale: Ang konteksto ay pagsambang may kasamang katapatan at debosyon. Hindi nililimitahan ng “sumasamba” ang kilos sa pisikal na pagpapatirapa lamang.
- issue: Panghalip na tumutukoy sa τις
  choice: sa kanyang noo o sa kanyang kamay
  alternative: sa noo o sa kamay ng taong iyon
  rationale: Ang “kanyang” ay nagpapanatili ng isahang pagtukoy ng Griyego habang nananatiling natural at walang ipinapataw na kasarian sa Filipino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong patuloy ng mga pandiwa sa kondisyong pahayag at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
