id: REV.14.14
reference: Revelation 14:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: tl
  text: At tumingin ako, at narito, may isang puting ulap. Nakaupo sa ulap ang isang tulad ng isang anak ng tao[a]. May gintong putong[b] siya sa ulo at matalim na karit sa kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “isang tulad ng Anak ng Tao.” Umaalingawngaw ito sa Daniel 7:13 at karaniwang inuunawa bilang titulong mesiyaniko, bagaman walang pantukoy ang pariralang Griyego rito: “tulad ng isang anak ng tao.”'
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego rito ay stephanos, na madalas tumutukoy sa putong na iginagawad sa nagtagumpay, sa halip na sa maharlikang diadema.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang biglaang pagtawag-pansin sa pangitain ni Juan, sa paraang marangal at likas sa salaysay na apokaliptiko.
- source_word: νεφέλη λευκή
  choice: isang puting ulap
  rationale: Tuwirang inililipat ang kahulugan ng pangngalan at pang-uri nang hindi pinalalawak ang λευκή bilang “maliwanag.”
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: nakaupo sa ulap
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang posisyon ng taong nakita sa pangitain.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: isang tulad ng anak ng tao
  rationale: Pinananatili ang kawalan ng pantukoy sa Griyego at ang alusyon sa Daniel 7:13, nang hindi tahasang ginagawang tiyak na titulo sa pangunahing teksto.
- source_word: στέφανον χρυσοῦν
  choice: gintong putong
  rationale: Ang “putong” ay marangal at maaaring tumukoy sa koronang iginagawad sa nagtagumpay, kaya mas naipahihiwatig nito ang saklaw ng στέφανος kaysa sa eksklusibong maharlikang diadema.
- source_word: δρέπανον ὀξύ
  choice: matalim na karit
  rationale: Karaniwan at malinaw itong tawag sa kasangkapang pang-ani at angkop sa kasunod na larawan ng pag-aani.
theological_decisions:
- issue: Kung gagawing tahasang mesiyanikong titulo ang υἱὸν ἀνθρώπου
  choice: “isang tulad ng anak ng tao” sa pangunahing teksto
  alternative: “isang tulad ng Anak ng Tao”
  rationale: Walang pantukoy ang parirala sa Griyego, kaya hindi ito tahasang ginawang nakapirming titulo sa pangunahing teksto. Gayunman, malinaw ang alusyon sa Daniel 7:13 at karaniwang inuunawa itong mesiyaniko sa konteksto; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “narito” upang mapanatili ang masiglang himig ng pangitain, “putong” para sa mas malawak na diwa ng stephanos, at maiikling pangungusap upang maging natural ang daloy nang hindi inaalis ang sunod-sunod na paglalarawan ng Griyego.
