id: REV.14.17
reference: Revelation 14:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: tl
  text: At lumabas mula sa templo sa langit[a] ang isa pang anghel. Mayroon din siyang matalim na karit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo sa langit.” Ang salitang Griyego na ναός ay maaaring mas tiyak na tumukoy sa panloob na banal na bahagi ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: isa pang anghel
  rationale: Likas na ipinahahayag nito ang isa pang anghel sa sunod-sunod na mga tauhan sa pangitain.
- source_word: ἐξῆλθεν ἐκ
  choice: lumabas mula sa
  rationale: Tumpak na inilalarawan ang paglabas mula sa loob ng isang lugar at natural ito sa makabagong Filipino.
- source_word: ναοῦ
  choice: templo
  rationale: Karaniwang salin ito na malinaw sa mga mambabasa, habang ang mas tiyak na posibleng diwang 'santuwaryo' ay inilagay sa talababa.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Maikli at natural na pagtukoy sa kinaroroonan ng templo.
- source_word: ἔχων καὶ αὐτὸς
  choice: Mayroon din siyang
  rationale: Pinananatili ng 'din' ang diin na ang anghel na ito, gaya ng naunang tauhan, ay may karit; ginawang ganap na pangungusap para sa likas na daloy sa Filipino.
- source_word: δρέπανον ὀξύ
  choice: matalim na karit
  rationale: Ang 'karit' ang malinaw at karaniwang tawag sa kagamitang pang-ani, at ang 'matalim' ay tuwirang nagpapanatili sa matingkad na larawan.
theological_decisions:
- issue: Kalikasan ng larawan ng templo sa langit
  choice: Isinalin ang ναός bilang 'templo' nang walang dagdag na pagpapakahulugan.
  alternative: Maaaring isalin bilang 'santuwaryo' upang idiin ang panloob na banal na bahagi ng templo.
  rationale: Pinananatili nito ang apokaliptikong larawan ayon sa pagkakasabi ng teksto at hindi ipinapasiya kung ito ay arkitektural, simboliko, o liturhikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang estrukturang Griyego upang maging natural ang daloy habang pinananatili ang pagkakasunod ng kilos at ang diin ng καὶ αὐτός.
