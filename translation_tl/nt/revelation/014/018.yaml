id: REV.14.18
reference: Revelation 14:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: tl
  text: At isa pang anghel ang lumabas mula sa altar, ang may kapangyarihan sa apoy, at sumigaw siya nang malakas sa may hawak na matalim na karit, “Ipadala mo ang iyong matalim na karit[a] at tipunin mo ang mga kumpol ng ubas ng puno ng ubas ng lupa[b], sapagkat hinog na ang mga ubas nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipasok mo ang iyong matalim na karit.” Literal na “ipadala” ang pandiwang Griyego, ngunit sa larawan ng pag-aani maaari itong isalin nang idyomatiko bilang “ipasok.”
    reason: lexical_alternative
  - marker: b
    text: Ang “puno ng ubas ng lupa” ay isang apokaliptikong larawan. Hindi tahasang sinasabi rito ng teksto kung sino o ano ang tinutukoy nito, bagaman paghatol ang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: isa pang anghel
  rationale: Sa mga pangitain sa Pahayag, ang ἄγγελος ay karaniwang makalangit na anghel; ipinakikita ng “isa pa” ang pagkakasunod-sunod sa salaysay.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: mula sa altar
  rationale: Ang “altar” ay natural at pamilyar na katawagan sa modernong Filipino, at pinananatili ng “mula sa” ang larawan ng paglabas ng anghel mula roon.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: ang may kapangyarihan sa apoy
  rationale: Pinananatili nito ang paglalarawan sa anghel at ang diwa ng ἐξουσία bilang awtoridad o pamamahala kaugnay ng apoy, nang hindi nililinaw kung ano ang pinagmulan o saklaw nito.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: sumigaw siya nang malakas
  rationale: Ito ang natural na katumbas sa Filipino ng idyomang Griyego at malinaw na ipinahihiwatig ang malakas na pagtawag.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: sa may matalim na karit
  rationale: Ang “sa may” ay maikli at natural na pagtukoy sa taong may hawak o nagtataglay ng karit; pinananatili ang “matalim,” na inuulit sa talata.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Ipadala mo ang iyong matalim na karit
  rationale: Ang πέμπω ay literal na “ipadala.” Bagaman di-pangkaraniwan ang larawan sa Filipino, pinananatili nito ang matingkad na pananalita ng pinagmulan; inilalahad sa talababa ang mas idyomatikong alternatibo.
- source_word: τρύγησον τοὺς βότρυας
  choice: tipunin mo ang mga kumpol ng ubas
  rationale: Ang τρυγάω ay tumutukoy sa pamimitas o pagtitipon ng ubas, at ang βότρυες ay mga kumpol nito. Ang tahasang “ng ubas” ay kailangan sa Filipino upang malinaw ang tinutukoy.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: mula sa puno ng ubas ng lupa
  rationale: Ang “puno ng ubas” ang malinaw na karaniwang Filipino para sa ἄμπελος. Pinananatili ng “ng lupa” ang apokaliptikong ugnayang genitibo at hindi ito tahasang ipinapakahulugan bilang isang pangkat ng mga tao.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: hinog na ang mga ubas nito
  rationale: Natural itong pagpapahayag sa Filipino ng pagdating ng mga ubas sa kahinugan; hindi idinagdag ang “lubos” sapagkat hindi kailangan ng pandiwa ang gayong pagpapatingkad.
theological_decisions:
- issue: Apokaliptikong talinghaga sa τῆς ἀμπέλου τῆς γῆς
  choice: Pinanatili bilang “puno ng ubas ng lupa.”
  alternative: Tahasang tukuyin ito bilang masasamang tao sa lupa o bilang sangkatauhang hahatulan.
  rationale: Bagaman ipinahihiwatig ng konteksto ang paghatol, hindi tahasang kinikilala ng talata ang tinutukoy ng larawan. Pinananatili ng salin ang talinghaga at ang teolohikal na tensiyon.
- issue: Kapangyarihan ng anghel sa apoy
  choice: “may kapangyarihan sa apoy” nang walang dagdag na paliwanag
  alternative: Ipaliwanag na siya ang namamahala sa apoy ng altar o sa apoy ng paghuhukom.
  rationale: Hindi tahasang nililimitahan ng teksto ang apoy sa isa sa mga pagbabasang ito, kaya hindi dapat ipasok ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “altar,” “anghel,” at “karit” bilang mga pamilyar na terminong biblikal. Pinanatili ang di-pangkaraniwang utos na “Ipadala mo” dahil iyon ang pinakamalapit sa Griyego, habang ibinigay sa talababa ang natural na alternatibo. Ang gitling na mahaba ay naghihiwalay sa paglalarawang tumutukoy sa anghel nang hindi nagpapabigat sa pangungusap.
