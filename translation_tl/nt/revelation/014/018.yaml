revisions:
- from: At isa pang anghel ang lumabas mula sa altar—ang may kapangyarihan sa apoy. Sumigaw siya nang malakas sa may matalim na karit, “Ipadala mo ang iyong matalim na karit[a] at tipunin mo ang mga kumpol ng ubas mula sa puno ng ubas ng lupa[b], sapagkat hinog na ang mga ubas nito.”
  to: At isa pang anghel ang lumabas mula sa altar, ang may kapangyarihan sa apoy, at sumigaw siya nang malakas sa may hawak na matalim na karit, “Ipadala mo ang iyong matalim na karit[a] at tipunin mo ang mga kumpol ng ubas ng puno ng ubas ng lupa[b], sapagkat hinog na ang mga ubas nito.”
  rationale: Inayos ang ugnayan ng “mga kumpol” at “puno ng ubas ng lupa” upang maipakita ang genitibong anyo ng Griyego nang walang pagbibigay ng interpretasyong teolohikal. Nilinaw rin ang pinag-uukulan ng sigaw sa pamamagitan ng “may hawak na,” habang pinanatili ang literal ngunit sinadyang matalinghagang “Ipadala mo” at ang kaugnay nitong talababa.
