  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: tl
  text: At napuno ng usok ang santuwaryo mula sa kaluwalhatian ng Diyos at mula sa kanyang kapangyarihan, at walang sinumang makapasok sa santuwaryo hanggang sa matapos ang pitong salot ng pitong anghel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “templo” para sa “santuwaryo” (Griyego: ναός), bagaman madalas na mas tiyak na tumutukoy ang salita sa banal na tahanan sa loob kaysa sa buong nasasakupan ng templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: santuwaryo
  rationale: Sa konteksto ng Apocalipsis, karaniwang tumutukoy ang ναός sa banal na tahanan o pinakaloob na banal na dako, hindi sa buong kompleks ng templo. Likas at tiyak sa modernong Filipino ang “santuwaryo.”
- source_word: ἐγεμίσθη
  choice: napuno
  rationale: Ipinahahayag ng aorist passive ang pangyayaring ang santuwaryo ay napuno; natural na naihahatid ito ng “napuno” sa Filipino.
- source_word: καπνοῦ
  choice: ng usok
  rationale: Ang genitive na kasunod ng γεμίζω ay likas na isinasalin sa Filipino bilang “napuno ng usok,” at ang “usok” ang angkop sa larawang teopanikong nasa talata.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: mula sa kaluwalhatian ng Diyos
  rationale: 'Pinananatili ng “mula sa” ang diwa ng ἐκ bilang pinagmulan: ang usok ay nagmumula sa nahayag na kaluwalhatian ng Diyos.'
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: mula sa kanyang kapangyarihan
  rationale: Tuwirang ipinapahayag ng “kapangyarihan” ang δύναμις, habang pinananatili ng ikalawang “mula sa” ang magkatimbang na ayos ng dalawang pariralang Griyego.
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: walang sinumang makapasok
  rationale: Natural na Filipino ito para sa patuloy na kawalan ng kakayahang ipinahahayag ng imperfect ἐδύνατο kasama ng infinitive na εἰσελθεῖν.
- source_word: ἄχρι τελεσθῶσιν
  choice: hanggang sa matapos
  rationale: Malinaw na itinatakda ng “hanggang sa” ang hangganan sa panahon, at naihahatid ng “matapos” ang pagkumpleto ng mga salot nang hindi nagpapabigat sa pangungusap.
- source_word: πληγαὶ
  choice: salot
  rationale: Sa Apocalipsis, ang πληγή ay tumutukoy sa mga salot na hatol; “salot” ang kinikilalang tiyak at natural na katumbas sa Filipino.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: ng pitong anghel
  rationale: Pinananatili ng payak na pariralang genitibo ang ugnayan ng mga salot sa pitong anghel nang hindi ipinapasiya kung ito ay pagmamay-ari, pagdadala, o pagkakaugnay.
theological_decisions:
- issue: Pagpapakahulugan sa ναός sa makalangit at apokaliptikong tagpo
  choice: santuwaryo
  alternative: templo
  rationale: Mas tiyak na ipinahihiwatig ng “santuwaryo” ang banal na tahanan ng Diyos kaysa sa buong nasasakupan ng templo, at hindi ito nagdaragdag ng partikular na doktrinal na paliwanag.
- issue: Ugnayan ng mga salot at ng pitong anghel sa genitibong τῶν ἑπτὰ ἀγγέλων
  choice: ng pitong anghel
  alternative: na dala ng pitong anghel
  rationale: Ang literal at natural na “ng pitong anghel” ay nagpapanatili sa saklaw ng maaaring kahulugan ng genitive; ang “na dala” ay maaaring maging tama sa konteksto ngunit mas tahasang interpretasyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na “mula sa” upang katawanin ang parallel na kayarian ng Griyego, at ginamit ang “santuwaryo” sa dalawang paglitaw ng ναός para sa katumpakan at pagkakapare-pareho.
