  to: At lumabas mula sa santuwaryo[a] ang pitong anghel na may taglay na pitong salot. Nakasuot sila ng malinis at maningning na kasuutang lino[b], at may mga gintong pamigkis na nakapulupot sa palibot ng kanilang mga dibdib.[c]
  rationale: Pinalitan ang di-likas na “nabibigkisan” ng paglalarawang nagsasaad ng resultang kalagayan ng mga anghel na suot ang gintong pamigkis. Nilinaw ang pagmamay-ari at maramihang dibdib, at ginawang “kasuutang lino” ang “lino” upang malinaw na isalin ang linen bilang pananamit nang walang idinagdag na katangiang wala sa Griyego.
