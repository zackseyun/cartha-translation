  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: tl
  text: At lumabas mula sa santuwaryo[a] ang pitong anghel na may taglay na pitong salot. Nakasuot sila ng malinis at maningning na kasuutang lino[b], at may mga gintong pamigkis na nakapulupot sa palibot ng kanilang mga dibdib.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo.” Ang salitang Griyego na ναός ay karaniwang tumutukoy sa santuwaryo o banal na panloob na bahagi, hindi sa buong kompleks ng templo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dalisay at nagniningning na kasuutang lino.”
    reason: lexical_alternative
  - marker: c
    text: O “at nakabigkis sa palibot ng kanilang mga dibdib ng mga gintong sinturon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: lumabas
  rationale: Tuwirang ipinahahayag ang paggalaw mula sa loob patungo sa labas, nang hindi gumagamit ng makalumang pananalita.
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Sa makalangit na pangitain ng Pahayag, mga makalangit na nilalang ang malinaw na tinutukoy, hindi mga taong mensahero.
- source_word: πληγάς
  choice: mga salot
  rationale: Sa Pahayag, tumutukoy ang salita sa mga hampas o hatol na ipinadadala ng Diyos; natural at nakasanayan sa kontekstong ito ang “mga salot.”
- source_word: ναοῦ
  choice: santuwaryo
  rationale: Mas tiyak ang ναός kaysa sa buong kompleks ng templo at tumutukoy sa banal na dako o panloob na santuwaryo.
- source_word: ἐνδεδυμένοι
  choice: nakasuot
  rationale: Inilalarawan ng perpektong participle ang kalagayan nilang may suot; malinaw at natural sa modernong Filipino ang “nakasuot.”
- source_word: λίνον
  choice: lino
  rationale: Ang pangngalan ay tumutukoy sa telang lino; hindi dinaragdagan ng “pino” sapagkat walang hiwalay na salitang gayon sa ibinigay na tekstong Griyego.
- source_word: καθαρὸν λαμπρὸν
  choice: malinis at maningning
  rationale: 'Pinananatili ang dalawang magkahiwalay na katangian: kalinisan o kadalisayan at maliwanag na ningning.'
- source_word: περιεζωσμένοι
  choice: nabibigkisan
  rationale: Ipinahahayag ang kalagayang may bagay na ibinigkis o ipinulupot sa katawan, sa dignified ngunit mauunawaang Filipino.
- source_word: περὶ τὰ στήθη
  choice: sa palibot ng dibdib
  rationale: Pinananatili ang di-karaniwang lokasyon ng pamigkis sa dibdib sa halip na ipalagay na nasa baywang ito.
- source_word: ζώνας χρυσᾶς
  choice: mga gintong pamigkis
  rationale: Maaaring sinturon, bigkis, o sash ang ζώνη; ang “pamigkis” ay angkop dahil nasa palibot ito ng dibdib, hindi kinakailangang sa baywang.
theological_decisions:
- issue: Kahulugan ng ναός sa makalangit na tagpo
  choice: santuwaryo
  alternative: templo
  rationale: Pinananatili ng “santuwaryo” ang mas tiyak na diwa ng banal na panloob na dako nang hindi nagpapasya nang higit sa sinasabi ng teksto tungkol sa anyo ng makalangit na templo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Hinati sa dalawang pangungusap upang maging natural sa Tagalog habang pinananatili ang pagkakasunod-sunod ng mga larawan sa Griyego. Ginamit ang “taglay” at “pamigkis” bilang dignified ngunit karaniwang mauunawaang mga salita.
