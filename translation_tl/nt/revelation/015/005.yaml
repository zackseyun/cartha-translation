lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: At pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang panimulang pang-ugnay at ang maramihang ταῦτα, pati ang sunod-sunod na himig ng pangitain.
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang inilalahad nito ang nakita ni Juan sa pangitain; hindi nito inililipat ang diin sa kilos ng pagtingin.
- source_word: ἠνοίγη
  choice: nabuksan
  rationale: Likas na katumbas ito ng aorist passive at nagpapahiwatig na ang santuwaryo ay binuksan nang hindi tinutukoy kung sino ang gumawa nito.
- source_word: ναὸς
  choice: santuwaryo
  rationale: Mas tiyak nitong ipinapahayag ang panloob at banal na bahagi na karaniwang tinutukoy ng ναός, sa halip na ang buong bakuran ng templo.
- source_word: τῆς σκηνῆς
  choice: ng tolda
  rationale: Ang 'tolda' ay malinaw at makabagong salita habang pinananatili ang larawan ng banal na tolda sa ilang; iniiwasan ang mas di-pamilyar na 'tabernakulo.'
- source_word: τοῦ μαρτυρίου
  choice: ng patotoo
  rationale: Pinananatili nito ang kultikong katawagan at ang alusyon sa banal na patotoong kaugnay ng santuwaryo.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Natural na Filipino ito para sa lokasyon ng santuwaryo sa makalangit na dako.
theological_decisions:
- issue: Larawang kultiko ng makalangit na santuwaryo
  choice: santuwaryo ng tolda ng patotoo sa langit
  alternative: makalangit na santuwaryo; templo sa langit, samakatuwid ay ang tolda ng patotoo
  rationale: Pinananatili ang magkakaugnay na genitive sa Griyego at ang alusyon sa santuwaryo sa ilang, sa halip na paikliin o ipaliwanag nang lampas sa teksto.
- issue: Di-tinukoy na tagapagbukas ng santuwaryo
  choice: nabuksan
  alternative: binuksan ng Diyos
  rationale: Hindi pinapangalanan ng passive na pandiwa sa Griyego ang gumawa; hindi ito dapat tahasang tukuyin sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak at magkakawing na estilo ni Juan at ang siksik na larawang kultiko ng orihinal.
