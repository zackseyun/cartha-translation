  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: tl
  text: At pagkatapos ng mga bagay na ito, nakita ko, at nabuksan ang santuwaryo[a] ng tolda ng patotoo[b] sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo.” Ang Griyegong ναός ay karaniwang tumutukoy sa panloob na banal na bahagi, hindi sa buong bakuran ng templo.
    reason: lexical_alternative
  - marker: b
