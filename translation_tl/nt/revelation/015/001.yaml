id: REV.15.1
reference: Revelation 15:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: tl
  text: 'At nakakita ako ng isa pang tanda sa langit, dakila at kamangha-mangha: pitong anghel na may pitong huling salot, sapagkat sa mga ito ay nalubos ang poot ng Diyos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat sa mga ito ay natapos ang poot ng Diyos.”
    reason: Alternatibong salin ng ἐτελέσθη; pinananatili ng “sa mga ito” ang mas tuwirang katumbas ng ἐν αὐταῖς.
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Karaniwan at malinaw na katumbas sa Pahayag para sa isang nakikitang pangyayaring may simbolikong kahulugan.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Sa kontekstong apokaliptiko ng Pahayag, tumutukoy ito sa makalangit na dako, hindi lamang sa himpapawid.
- source_word: μέγα καὶ θαυμαστόν
  choice: dakila at kamangha-mangha
  rationale: Pinananatili nito ang diwa ng kadakilaan at pagkamangha sa natural ngunit marangal na modernong Tagalog.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ
  choice: pitong anghel na may pitong ... salot
  rationale: Malinaw at natural na inilalahad ang mga anghel at ang taglay nilang mga salot habang pinananatili ang ugnayan ng participle sa pangngalan.
- source_word: τὰς ἐσχάτας
  choice: huling
  rationale: Direktang ipinahahayag ang pagkakasunod-sunod at pangwakas na katangian ng pitong salot.
- source_word: ὅτι
  choice: sapagkat
  rationale: 'Malinaw na ipinakikita ang sanhi: huli ang mga salot dahil sa mga ito nalulubos ang poot ng Diyos.'
- source_word: ἐν αὐταῖς
  choice: sa pamamagitan ng mga ito
  rationale: Natural sa Tagalog at ipinahahayag na ang mga salot ang kasangkapan o larangan kung saan sumasapit sa kaganapan ang poot ng Diyos; ang mas literal na 'sa mga ito' ay inilagay sa talababa.
- source_word: ἐτελέσθη
  choice: nalubos
  rationale: Ipinahahayag ang pagdating sa ganap na katuparan o hangganan, hindi lamang ang basta paghinto.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: ang poot ng Diyos
  rationale: Pinananatili ang marubdob at solemneng wika ng banal na paghatol sa Pahayag nang hindi ito pinahihina o pinalalabis.
theological_decisions:
- issue: Wika ng banal na paghatol sa kontekstong apokaliptiko
  choice: ang poot ng Diyos
  alternative: ang galit ng Diyos
  rationale: Ang 'poot' ay marangal at mabigat na salita para sa matinding banal na paghatol, ngunit hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Kahulugan ng ἐτελέσθη kaugnay ng poot ng Diyos
  choice: nalubos
  alternative: natapos
  rationale: Pinananatili ng 'nalubos' ang diwa ng pagsapit sa kaganapan; hindi nito ipinahihiwatig nang higit sa teksto na lahat ng anumang paghatol ay tuluyan nang nagwakas.
- issue: Ugnayan ng ἐν αὐταῖς sa mga salot
  choice: sa pamamagitan ng mga ito
  alternative: sa mga ito
  rationale: Mas natural ang instrumental na pagbasa sa Tagalog, ngunit tunay na posible ang mas literal na lokatibong pahayag kaya pinanatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'dakila' at 'poot' upang mapanatili ang mataas at solemneng himig ng apokaliptikong pangitain, habang ang ayos ng pangungusap ay nananatiling natural sa kasalukuyang gamit.
