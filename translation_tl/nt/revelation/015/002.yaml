id: REV.15.2
reference: Revelation 15:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: tl
  text: At nakita ko ang waring isang dagat na salamin na nahaluan ng apoy, at ang mga nagtagumpay laban sa halimaw, laban sa larawan nito, at laban sa bilang ng pangalan nito[a]. Nakatayo sila sa ibabaw ng dagat na salamin at may hawak na mga alpa ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang mga nagtagumpay mula sa halimaw, mula sa larawan nito, at mula sa bilang ng pangalan nito.” Literal na “mula sa” ang ἐκ sa bawat parirala; maaaring ipahiwatig nito ang tagumpay laban sa mga ito o ang pagkalabas mula sa kapangyarihan ng halimaw.
    reason: alternative_reading
  - marker: b
    text: Ang “mga alpa ng Diyos” ay maaari ring mangahulugang mga alpang pag-aari ng Diyos, mula sa Diyos, o nakatalaga sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: waring isang dagat na salamin
  rationale: Ipinahihiwatig ng ὡς na ito ay isang paghahambing batay sa nakita sa pangitain, hindi tahasang pagkakakilanlan. Likas sa modernong Tagalog ang “waring,” at pinananatili ng “dagat na salamin” ang matingkad at inuulit na larawan.
- source_word: μεμιγμένην πυρί
  choice: nahaluan ng apoy
  rationale: Ipinahahayag nito ang anyo ng dagat bilang nahalo o nahaluan ng apoy nang hindi ipinapaliwanag kung paano nangyari ang pambihirang larawang ito.
- source_word: τοὺς νικῶντας
  choice: ang mga nagtagumpay
  rationale: Ang νικάω sa Pahayag ay tumutukoy sa pagdaig o pagtatagumpay. Ang “mga nagtagumpay” ay natural at marangal, at hindi nito nililimitahan ang tagumpay sa pakikidigmang militar.
- source_word: ἐκ τοῦ θηρίου ... ἐκ τῆς εἰκόνος ... ἐκ τοῦ ἀριθμοῦ
  choice: laban sa halimaw, laban sa larawan nito, at laban sa bilang ng pangalan nito
  rationale: Bagaman karaniwang nangangahulugang “mula sa” ang ἐκ, kasama ng νικῶντας ay natural itong maunawaan bilang pagtatagumpay laban sa mga ito. Inuulit ang “laban sa” upang katawanin ang tatlong ἐκ at panatilihin ang ritmo.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: Nakatayo sila sa ibabaw ng dagat na salamin
  rationale: Pinananatili ng “sa ibabaw” ang kapansin-pansing larawan ng ἐπί na hindi pinahihinang maging “sa tabi.” Ginawang hiwalay na pangungusap para sa malinaw at natural na Tagalog.
- source_word: κιθάρας τοῦ θεοῦ
  choice: mga alpa ng Diyos
  rationale: 'Pinananatili ng pariralang ito ang di-tiyak na kaugnayan ng genitibo: maaaring pag-aari ng Diyos, mula sa Diyos, o nakatalaga sa Diyos.'
theological_decisions:
- issue: Ang kaugnayan ng mga nagtagumpay sa halimaw na ipinahayag ng νικῶντας na sinusundan ng inuulit na ἐκ
  choice: Inilarawan silang nagtagumpay laban sa halimaw, sa larawan nito, at sa bilang ng pangalan nito.
  alternative: Maaari ring unawain na nakalabas sila mula sa saklaw o kapangyarihan ng halimaw.
  rationale: Ang “nagtagumpay laban sa” ang pinakanatural na Tagalog at kaayon ng paulit-ulit na tema ng νικάω sa Pahayag. Gayunman, itinatala sa talababa ang literal na puwersa ng ἐκ upang hindi mawala ang posibleng diwa ng pagkalabas mula sa kapangyarihan nito.
- issue: Ang kahulugan ng genitibong τοῦ θεοῦ sa κιθάρας τοῦ θεοῦ
  choice: mga alpa ng Diyos
  alternative: mga alpa na mula sa Diyos o nakatalaga sa Diyos
  rationale: Hindi nililinaw ng Griyego kung ang relasyon ay pag-aari, pinagmulan, o pagtatalaga, kaya pinanatili ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “waring” para sa himig ng pangitain, “halimaw” para sa θηρίον, at “alpa” bilang karaniwang katawagan sa instrumentong κιθάρα. Hinati sa dalawang pangungusap ang mahabang kayariang Griyego upang maging malinaw nang hindi nawawala ang mga ugnayan at pag-uulit.
