  source_fidelity: Tumpak na naisasalin ng draft ang pangunahing teksto ng SBLGNT, kabilang ang αἰώνων bilang “mga kapanahunan,” at wasto ang tala ukol sa baryanteng “mga bansa.” Gayunman, ang paghihiwalay sa “Sinasabi nila” bilang bagong pangungusap ay bahagyang nagpapahina sa tuwirang ugnayan ng λέγοντες sa kanilang pag-awit.
  naturalness: Marangal at likas ang karamihan ng Tagalog. Mas tuloy-tuloy at mas natural na ipakilala ang nilalaman ng awit sa pamamagitan ng “habang sinasabi nila,” sa halip na hiwalay na “Sinasabi nila.” Ang kuwit sa banal na titulo ay nakatutulong upang luminaw ang magkakatabing titulong nasa Griyego.
  terminology: Ang “alipin ng Diyos” ay angkop para sa δοῦλος at pinananatili ang diin ng pagkakabilang at paglilingkod. Ang “Kordero,” “matuwid,” “tunay,” at “mga kapanahunan” ay wasto at angkop sa marangal na rehistro. Ang “Makapangyarihan-sa-Lahat” ay malinaw na katumbas ng παντοκράτωρ.
