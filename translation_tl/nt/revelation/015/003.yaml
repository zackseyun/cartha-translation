id: REV.15.3
reference: Revelation 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: tl
  text: 'At inaawit nila ang awit ni Moises, ang alipin ng Diyos, at ang awit ng Kordero, habang sinasabi nila: “Dakila at kamangha-mangha ang iyong mga gawa, Panginoong Diyos, ang Makapangyarihan-sa-Lahat! Matuwid at tunay ang iyong mga daan, Hari ng mga kapanahunan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang manuskrito na may: “Hari ng mga bansa.”'
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: inaawit nila
  rationale: Likas na isinasalin ang pangkasalukuyang pandiwa bilang buhay na paglalahad sa pangitain.
- source_word: τὴν ᾠδὴν Μωϋσέως
  choice: ang awit ni Moises
  rationale: Tuwirang salin ng parirala; ang “awit” ay hindi nagdaragdag ng tiyak na liturhikong kulay.
- source_word: τοῦ δούλου τοῦ θεοῦ
  choice: ang alipin ng Diyos
  rationale: Pinananatili ng “alipin” ang diwa ng pag-aari at lubos na paglilingkod na taglay ng δοῦλος, sa halip na palambutin bilang “lingkod.”
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Sa Pahayag, ito ay titulong tumutukoy kay Cristo at pinananatili ang sakripisyal at mesiyanikong larawan.
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: Dakila at kamangha-mangha ang iyong mga gawa
  rationale: Pinananatili ang predikatibong ayos at marangal na tono ng pagpupuri sa natural na Tagalog.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Panginoong Diyos na Makapangyarihan sa Lahat
  rationale: Pinananatili ang tatlong sangkap ng titulo sa isang natural at malinaw na pariralang Tagalog.
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: Matuwid at tunay ang iyong mga daan
  rationale: Ang “matuwid” ay nagpapanatili ng moral na diwa ng δίκαιαι, at ang “mga daan” ay nagpapanatili ng metapora ng orihinal.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: Hari ng mga kapanahunan
  rationale: Tuwirang isinasalin ang αἰώνων bilang “mga kapanahunan,” nang hindi pinapalitan ng tekstuwal na baryanteng “mga bansa.”
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος bilang titulo ni Moises
  choice: alipin ng Diyos
  alternative: lingkod ng Diyos
  rationale: Ang “alipin” ay mas malinaw na nagpapanatili sa puwersa ng pagkakabilang sa Diyos at ganap na paglilingkod, bagaman mas karaniwan sa ilang salin ang “lingkod.”
- issue: Tekstuwal na anyo ng panghuling titulo
  choice: Hari ng mga kapanahunan
  alternative: Hari ng mga bansa
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na αἰώνων; inilalagay sa talababa ang mahalagang baryanteng ἐθνῶν.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang anyong patula at mapagpuring himig, gayundin ang mga larawang “Kordero” at “mga daan.”
