  to: 'At inaawit nila ang awit ni Moises, ang alipin ng Diyos, at ang awit ng Kordero, habang sinasabi nila: “Dakila at kamangha-mangha ang iyong mga gawa, Panginoong Diyos, ang Makapangyarihan-sa-Lahat! Matuwid at tunay ang iyong mga daan, Hari ng mga kapanahunan.[a]”'
