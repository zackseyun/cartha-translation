  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: tl
  text: At binigyan ng isa sa apat na nilalang na buháy ang pitong anghel ng pitong mangkok[a] na ginto, na punô ng poot ng Diyos na nabubuhay magpakailanman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘pitong ginintuang palanggana’ o ‘pitong ginintuang sisidlan.’ Ang salitang Griyego ay tumutukoy sa isang mababaw at malapad na sisidlang tulad ng mangkok.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, ‘sa mga kapanahunan ng mga kapanahunan.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: isa sa apat na nilalang na buháy
  rationale: Tumutukoy ang ζῷον sa mga nilalang sa paligid ng trono, hindi sa karaniwang mga hayop. Iniiwasan din ng saling ito ang pagkalito sa ‘halimaw’ na karaniwang katumbas ng ibang salitang Griyego na θηρίον sa Pahayag.
- source_word: ἔδωκεν
  choice: ibinigay
  rationale: Payak at tuwirang katumbas ng aorist na anyo ng δίδωμι, at hindi nangangailangan ang konteksto ng mas mapagpaliwanag na pandiwa.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: sa pitong anghel
  rationale: Ang ‘anghel’ ang likas at karaniwang salin sa kontekstong apokaliptiko.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: pitong mangkok na ginto
  rationale: Ang φιάλη ay isang mababaw at malapad na sisidlan; mas malinaw sa modernong Tagalog ang ‘mangkok’ kaysa ‘sisidlan’ o tradisyonal na ‘fiola.’ Ipinahihiwatig ng ‘na ginto’ ang materyal na tinutukoy ng χρυσᾶς.
- source_word: γεμούσας
  choice: na punô ng
  rationale: Tuwirang ipinapahayag ang kalagayan ng mga mangkok bilang punô ng kasunod na genitive.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: poot ng Diyos
  rationale: Pinananatili ng ‘poot’ ang matindi at solemneng diwa ng θεῖος θυμός sa konteksto ng paghuhukom, nang hindi ito pinahihina bilang karaniwang pagkainis.
- source_word: τοῦ ζῶντος
  choice: na nabubuhay
  rationale: Ang participle ay tumutukoy sa Diyos. Ang sugnay na ‘na nabubuhay’ ay natural sa Tagalog at pinananatili ang paglalarawan sa Diyos bilang ang nabubuhay.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang natural at matatag na katumbas sa Tagalog ng idyomang Griyego para sa walang katapusang tagal; inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Paglalarawan sa banal na θυμός
  choice: poot ng Diyos
  alternative: galit ng Diyos; matinding galit ng Diyos
  rationale: Ang ‘poot’ ay angkop sa solemneng konteksto ng pangwakas na paghuhukom at hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Ugnayan ng buhay ng Diyos at ng walang hanggang tagal
  choice: Diyos na nabubuhay magpakailanman
  alternative: Diyos, ang Nabubuhay, sa mga panahon ng mga panahon
  rationale: Malinaw na inuugnay ng salin ang τοῦ ζῶντος sa Diyos at ang pariralang pangtagal sa kanyang walang hanggang pamumuhay, habang iniiwasan ang hindi likas na literalismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘nilalang na buháy’ upang maiba ito sa ‘halimaw’ sa ibang bahagi ng Pahayag, at nilagyan ng tuldik ang ‘buháy’ at ‘punô’ para maiwasan ang maling pagbasa.
