  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: tl
  text: Sino ang hindi matatakot sa iyo, Panginoon, at luluwalhatiin ang iyong pangalan? Sapagkat ikaw lamang ang banal. Darating ang lahat ng bansa at sasamba sa harap mo, sapagkat nahayag na ang mga matuwid mong gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matuwid mong mga hatol.” Ang salitang Griyego ay maaari ring tumukoy sa mga pasiyang hudisyal o mga tuntunin, ngunit dito ay malamang na tumutukoy sa makatarungang mga gawa ng Diyos na nahayag na.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Sino ang hindi matatakot sa iyo
  rationale: Pinananatili ng tanong ang matinding retorikal na diwa ng οὐ μή, na umaasang ang sagot ay ‘walang sinuman.’ Idinagdag ang ‘sa iyo’ bilang likas na Tagalog na layon ng pagkatakot, na malinaw sa tuwirang pakikipag-usap sa Panginoon.
- source_word: κύριε
  choice: Panginoon
  rationale: Tuwirang tawag na anyo ng κύριος; ang ‘Panginoon’ ang karaniwan, marangal, at angkop na salin sa kontekstong pagsamba.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: luluwalhati sa iyong pangalan
  rationale: Pinananatili ang biblikal na idyoma ng pagbibigay-luwalhati sa pangalan ng Diyos, samantalang natural pa rin sa modernong Tagalog.
- source_word: μόνος ὅσιος
  choice: ikaw lamang ang banal
  rationale: Sa doksolohiyang ito, ang ὅσιος ay tumutukoy sa natatanging kabanalan at moral na kadalisayan ng Diyos; ang ‘banal’ ang pinakanatural at hindi nagpapakitid sa kahulugan tungo lamang sa katapatan.
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng bansa
  rationale: Pinananatili ang malawak at sama-samang diwa ng ἔθνη sa pangitaing ang lahat ng mga bansa ay sasamba sa Diyos.
- source_word: ἥξουσιν
  choice: darating
  rationale: Likas na salin ng hinaharap na pagdating sa kontekstong propetiko.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: sasamba sa harap mo
  rationale: Ipinahahayag ng προσκυνέω rito ang relihiyosong pagsamba, habang malinaw na pinananatili ng ‘sa harap mo’ ang ἐνώπιόν σου.
- source_word: τὰ δικαιώματά σου
  choice: ang matuwid mong mga gawa
  rationale: Malawak ang saklaw ng δικαιώματα—maaaring mga matuwid na gawa, hatol, o tuntunin. Sa konteksto, ang mga nahayag na pagpapakita ng katarungan ng Diyos ang pinakanaaangkop, nang hindi nililimitahan ang salita sa mga batas lamang.
- source_word: ἐφανερώθησαν
  choice: nahayag na
  rationale: Ipinapakita ang natapos na paghahayag na may kasalukuyang kabuluhan; ang ‘nahayag na’ ay maikli at natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng ὅσιος sa doksolohiya tungkol sa Diyos
  choice: banal
  alternative: tapat; maka-Diyos
  rationale: Itinatanghal ng talata ang natatanging kabanalan ng Diyos sa konteksto ng pagsamba. Hindi sapat ang ‘tapat’ upang saklawin ang moral at sagradong diwa, at hindi angkop sa Diyos ang karaniwang gamit ng ‘maka-Diyos.’
- issue: Kahulugan ng δικαιώματα sa konteksto ng apokaliptikong paghuhukom
  choice: matuwid mong mga gawa
  alternative: matuwid mong mga hatol; mga tuntunin mo
  rationale: Pinananatili ng ‘mga gawa’ ang lawak ng termino at binibigyang-diin ang hayag na pagkilos ng Diyos ayon sa katarungan, habang kinikilala sa talababa ang posibleng hudisyal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pampublikong pagbasa. Pinanatili ang retorikal na tanong, ang biblikal na idyoma ng pagluwalhati sa pangalan, at ang pag-uulit ng lohikal na ‘sapagkat’ kung kailangan sa daloy; iniwasan ang labis na teknikal o denominasyonal na pananalita.
