  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: tl
  text: 'Si Juan, sa pitong iglesya sa Asia: Sumainyo ang biyaya at kapayapaang mula sa kaniya na umiiral, na umiral, at dumarating,[a] at mula sa pitong espiritung nasa harap ng kaniyang trono.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas tradisyonal: “mula sa kaniya na ngayon at nang nakaraan at siyang darating.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “pitong espiritu” ay maaaring sumagisag sa kapuspusan ng Espiritu Santo, o tumukoy sa pitong espiritung makalangit; “pitong espiritu” mismo ang mababasa sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Juan
  rationale: Karaniwang anyo ng pangalang Ἰωάννης sa makabagong saling Tagalog ng Bibliya.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: sa pitong iglesya
  rationale: Sa kontekstong Kristiyano at liham, ang ἐκκλησία ay likas na tumutukoy sa iglesya; pinananatili rin ang tahasang bilang na pito.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: sa Asia
  rationale: Pinananatili ang pangalan sa Griyego; sa konteksto, tumutukoy ito sa Romanong lalawigan ng Asia, hindi sa buong makabagong kontinente.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Sumainyo ang biyaya at kapayapaan
  rationale: Natural at marangal na pormula ng pagbati sa Tagalog na tahasang ipinapahayag ang datibong ὑμῖν.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: mula sa kaniya na ngayon ay naririto, na noon pa ay naririto, at dumarating
  rationale: Inihahayag ang personal na banal na titulo at ang tuloy-tuloy na puwersa ng ἐρχόμενος bilang “dumarating.” Ang “naririto” ay mas natural sa Tagalog kaysa sa hubad na “umiiral,” habang ang “ngayon” at “noon pa” ay nililinaw ang temporal na paghahambing nang hindi ginagawang simpleng nakaraang pag-iral ang ὁ ἦν.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: sa pitong espiritu
  rationale: Pinananatili ang tahasang maramihan sa Griyego at hindi ipinapalit ang interpretatibong “pitong-anyo na Espiritu.”
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: nasa harap ng kaniyang trono
  rationale: Maikli at natural na Tagalog para sa lokasyong ipinahahayag ng ἐνώπιον; hindi nito higit na tinutukoy kung ang mga espiritu ay ang Espiritu Santo o mga nilalang sa langit.
theological_decisions:
- issue: Pagkakakilanlan at anyo ng titulong ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: 'Isinalin bilang personal na banal na titulo: “kaniya na ngayon ay naririto, na noon pa ay naririto, at dumarating.”'
  alternative: “kaniya na umiiral, umiral, at darating” o ang mas tradisyonal na “kaniya na ngayon at nang nakaraan at siyang darating.”
  rationale: Ang parirala ay sadyang di-karaniwan sa gramatikang Griyego at waring pinananatili bilang di-nababagong banal na titulo. Iniingatan ng salin ang tatlong bahaging temporal at ang kasalukuyang puwersa ng “dumarating,” nang hindi pinapantay ang Diyos sa karaniwang pag-iral lamang.
- issue: Pagkakakilanlan ng “pitong espiritu”
  choice: Pinanatili sa pangunahing teksto ang literal na “pitong espiritu.”
  alternative: Maaaring sagisag ito ng kapuspusan ng Espiritu Santo, o tumukoy sa pitong espiritung makalangit.
  rationale: Pinagtatalunan ang tinutukoy ng parirala, at maramihan mismo ang Griyego. Hindi dapat lutasin ng pangunahing salin ang teolohikal na tensiyong hindi nilulutas ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “iglesya,” “biyaya,” at “trono” bilang mga salitang pamilyar sa ordinaryong mambabasa ng Bibliya. Inayos ang “biyaya at kapayapaang mula” upang maging iisang natural na parirala, at inilagay ang mga talababa sa mismong mga pariralang nililinaw.
