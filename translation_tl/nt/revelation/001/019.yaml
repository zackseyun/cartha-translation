  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: tl
  text: Kaya isulat mo ang nakita mo, ang mga bagay na umiiral ngayon, at ang mga bagay na malapit nang mangyari pagkatapos ng mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mangyayari pagkatapos ng mga ito.” Sa ilang konteksto, ang pandiwa ay maaaring halos magsaad lamang ng hinaharap, bagaman madalas nitong ipinahihiwatig ang isang pangyayaring nalalapit na.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: isulat mo
  rationale: Tuwirang utos ito sa ikalawang panauhang isahan. Likas sa modernong Tagalog ang “isulat mo” at hindi ito nagdaragdag ng kahulugang wala sa Griyego.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang kongklusyon o pagpapatuloy mula sa naunang pangitain at utos. Mas natural sa Tagalog ang “Kaya” kaysa sa mas mabigat na “Samakatuwid.”
- source_word: ἃ εἶδες
  choice: ang nakita mo
  rationale: Tumutukoy ito sa nilalaman ng pangitaing nakita na ni Juan. Pinananatili ng payak na anyo ang ugnayan nito sa kasalukuyang utos na sumulat.
- source_word: ἃ εἰσὶν
  choice: ang mga bagay na umiiral ngayon
  rationale: Pinananatili nito ang diwa ng mga kasalukuyang realidad nang hindi ipinapalagay na ang tinutukoy ay mga pangyayari lamang. Nililinaw ng “ngayon” ang kasalukuyang panahon ng εἰσίν.
- source_word: μέλλει γίνεσθαι
  choice: malapit nang mangyari
  rationale: Karaniwang ipinahihiwatig ng μέλλω na may infinitive ang nalalapit o napipintong pangyayari. Pinananatili ng “malapit nang mangyari” ang temporal na diin nito.
- source_word: μετὰ ταῦτα
  choice: pagkatapos ng mga ito
  rationale: Tuwirang sinasalamin nito ang pangmaramihang demonstratibo at ang temporal na kahulugan ng parirala.
theological_decisions:
- issue: Temporal na puwersa ng μέλλει sa kontekstong apokaliptiko
  choice: “malapit nang mangyari” upang mapanatili ang diwa ng nalalapit na pangyayari
  alternative: “mangyayari” bilang payak na hinaharap
  rationale: Likas sa konstruksiyong Griyego ang ideya ng isang napipintong pangyayari. Pinananatili ito sa pangunahing teksto nang hindi nilulutas ang mas malawak na usaping eskatolohikal; inilalahad sa talababa ang maaari ring simpleng panghinaharap na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Kaya” para sa likas na daloy at ang “umiiral ngayon” upang mapanatili ang pagiging malawak ng kasalukuyang realidad sa halip na paliitin ito sa mga pangyayari lamang.
