review_pass:
  verdict: approve
  source_fidelity: 'Tapat ang salin sa SBLGNT: naipapahayag ang dative na “mula kay,” ang tatlong pagpapakilala kay Jesus, ang kasalukuyang “nagmamahal,” at ang aorist na “nagpalaya.” Ang “panganay mula sa mga patay” ay mahusay na katumbas ng πρωτότοκος τῶν νεκρῶν, at ang “sa pamamagitan ng kanyang dugo” ay wastong instrumental na pagbasa ng ἐν τῷ αἵματι αὐτοῦ.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “Jesus na Mesiyas,” “tapat na saksi,” at “pinuno ng mga hari sa lupa” ay malinaw at angkop sa mataas ngunit hindi lipas na rehistro ng Pahayag. Maayos ding nananatiling bukás ang pangungusap sa em dash, gaya ng pinagmulan.
  terminology: 'Wasto at pare-pareho ang paggamit ng “Mesiyas” para sa Χριστός, “saksi” para sa μάρτυς, “panganay” para sa πρωτότοκος, at “nagpalaya” para sa λύσαντι. Wasto ang mga talababa: ang unang tala ay nagbibigay ng leksikal na kahalili, at ang ikalawa ay malinaw na naghihiwalay sa tekstuwal na baryanteng λούσαντι (“naghugas”) mula sa pangunahing pagbasa na λύσαντι (“nagpalaya”).'
