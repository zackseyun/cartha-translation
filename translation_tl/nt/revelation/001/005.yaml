id: REV.1.5
reference: Revelation 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: tl
  text: at mula kay Jesus na Mesiyas[a], ang tapat na saksi, ang panganay mula sa mga patay, at ang pinuno ng mga hari sa lupa. Sa kanya na nagmamahal sa atin at nagpalaya[b] sa atin mula sa ating mga kasalanan sa pamamagitan ng kanyang dugo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesucristo.” Ang salitang Griego na Χριστός ay titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: May ilang manuskrito na nagsasabing “naghugas sa atin mula sa ating mga kasalanan sa pamamagitan ng kanyang dugo” sa halip na “nagpalaya sa atin mula sa ating mga kasalanan sa pamamagitan ng kanyang dugo.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ginamit ang “Mesiyas” bilang salin ng titulong Χριστός, sa halip na ituring itong apelyido; natural at malinaw ito sa makabagong Filipino.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: ang tapat na saksi
  rationale: Ang μάρτυς dito ay taong nagpapatotoo, hindi partikular na martir; pinananatili ng “tapat” ang diwa ng pagiging maaasahan at matatag.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: ang panganay mula sa mga patay
  rationale: Pinananatili ng “panganay” ang biblikal na talinghaga at pahiwatig ng pangunguna o kataasan, habang ipinahihiwatig ng “mula sa mga patay” ang pagbangon mula sa kamatayan.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: ang pinuno ng mga hari sa lupa
  rationale: Malinaw na ipinapahayag ng “pinuno” ang kapangyarihan niya sa mga hari; ang “lupa” ay angkop sa malawak na saklaw ng Pahayag.
- source_word: ἀγαπῶντι
  choice: nagmamahal
  rationale: Likas na ipinahahayag ng pangkasalukuyang anyong Filipino ang nagpapatuloy na pag-ibig.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: nagpalaya sa atin mula sa ating mga kasalanan
  rationale: Sinusunod nito ang SBLGNT na λύσαντι at pinananatili ang larawan ng pagpapalaya at paghiwalay mula sa mga kasalanan.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: sa pamamagitan ng kanyang dugo
  rationale: Binabasa ang ἐν bilang instrumental at malinaw na ipinahahayag na ang kanyang dugo ang paraan ng pagpapalaya.
theological_decisions:
- issue: Tekstuwal na baryante pagkatapos ng “nagmamahal sa atin”
  choice: nagpalaya (λύσαντι)
  alternative: naghugas (λούσαντι)
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT, ngunit inilalahad sa talababa ang mahalagang baryante nang hindi pinaghahalo ang dalawang pagbasa.
- issue: Pagsasalin sa titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap itong titulo sa konteksto, kaya isinalin bilang “Mesiyas”; pinananatili sa talababa ang nakaugaliang anyong “Cristo.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang biblikal na talinghagang “panganay” at ang bahagyang pormal na himig ng isang doxolohiya, nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
