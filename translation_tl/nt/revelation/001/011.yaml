id: REV.1.11
reference: Revelation 1:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: tl
  text: 'na nagsasabi, “Ang nakikita mo ay isulat mo sa isang aklat[a] at ipadala mo ito sa pitong iglesya: sa Efeso, sa Esmirna, sa Pergamo[b], sa Tiatira, sa Sardis, sa Filadelfia, at sa Laodicea.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang balumbon” o “sa isang nakasulat na dokumento.” Malawak ang saklaw ng Griyegong βιβλίον.
    reason: lexical_alternative
  - marker: b
    text: Ang Pergamo ay tinatawag ding “Pergamum” sa ilang salin at makabagong sanggunian.
    reason: alternative_transliteration
lexical_decisions:
- source_word: λεγούσης
  choice: na nagsasabi
  rationale: Ang pambabaeng genitive participle ay nagpapatuloy sa paglalarawan sa tinig sa naunang talata. Ang “na nagsasabi” ay likas na nag-uugnay sa sipi nang hindi inuulit o nililinaw nang higit sa Griyego kung sino ang nagsasalita.
- source_word: Ὃ βλέπεις
  choice: Ang nakikita mo
  rationale: Likas itong katumbas ng malawak na diwa ng neuter relative construction at hindi nililimitahan kung isang bagay lamang o ang kabuuan ng pangitain ang tinutukoy.
- source_word: γράψον
  choice: isulat mo
  rationale: Tuwirang utos ito mula sa aorist imperative ng γράφω. Ang hulma na “isulat mo” ay malinaw at natural sa makabagong Tagalog.
- source_word: εἰς βιβλίον
  choice: sa isang aklat
  rationale: Maaaring tumukoy ang βιβλίον sa aklat, balumbon, o nakasulat na dokumento. Pinili ang “aklat” para sa natural na makabagong pagbasa, habang inilalagay sa talababa ang makasaysayang posibleng “balumbon.”
- source_word: πέμψον
  choice: ipadala mo ito
  rationale: Ang “ito” ay likas na tumutukoy sa isinulat na mensahe o aklat, gaya ng hinihingi ng konteksto, nang hindi nagdaragdag ng bagong nilalaman.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: sa pitong iglesya
  rationale: Ang ἐκκλησίαις ay tumutukoy rito sa pitong tiyak na kongregasyong Kristiyano. Ang “iglesya” ay karaniwan, malinaw, at hindi nagtatakda ng isang denominasyon.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: sa Efeso ... at sa Laodicea
  rationale: Inulit ang “sa” sa bawat lungsod upang mapanatili ang distributibong diin ng paulit-ulit na εἰς at luminaw na bawat iglesya ay patutunguhan ng isinulat.
theological_decisions:
- issue: Kahulugan ng ἐκκλησίαις sa Pahayag 1:11
  choice: mga iglesya
  alternative: mga kapulungan
  rationale: Tumutukoy ang salita sa mga kongregasyong Kristiyano sa mga binanggit na lungsod. Ipinahahayag ng “mga iglesya” ang kontekstuwal na kahulugan nang hindi nag-aangkat ng natatanging aral ng alinmang denominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang mga pangalang karaniwan sa tradisyong Filipino—Efeso, Esmirna, Pergamo, Tiatira, Sardis, Filadelfia, at Laodicea—at pinanatili ang paulit-ulit na “sa” upang maipakita ang ritmo at pagkakabahagi ng Griyego.
