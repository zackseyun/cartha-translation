id: REV.1.7
reference: Revelation 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: tl
  text: Masdan! Dumarating siya kasama ng mga ulap. Makikita siya ng bawat mata, maging ang mga tumusok sa kanya, at mananaghoy dahil sa kanya ang lahat ng lipi sa daigdig.[a] Oo, amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng lipi sa lupain.” Maaaring umaalingawngaw ang parirala sa Zacarias 12:10–12, kung saan posible ayon sa konteksto ang “lupain.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Masdan ninyo!
  rationale: Isang buhay at marangal na panawagan ito upang ituon ang pansin. Mas natural sa makabagong Filipino kaysa sa mga lipas o sobrang literal na katumbas.
- source_word: ἔρχεται
  choice: Dumarating siya
  rationale: Pinananatili ang masiglang present tense ng Griyego na may nalalapit o panghinaharap na diwa.
- source_word: μετὰ τῶν νεφελῶν
  choice: kasama ng mga ulap
  rationale: Pinananatili ang larawan ng mga ulap at ang alusyon sa Daniel 7:13 nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: ὄψεται αὐτὸν πᾶς ὀφθαλμός
  choice: Makikita siya ng bawat mata
  rationale: Pinananatili ang kongkreto at distributibong larawan ng bawat mata sa halip na gawing simpleng 'makikita siya ng lahat.'
- source_word: καὶ οἵτινες αὐτὸν ἐξεκέντησαν
  choice: pati ng mga tumusok sa kanya
  rationale: Ang 'pati' ay malinaw na nagtatampok sa partikular na pangkat, at ang 'tumusok' ay nagpapanatili ng ugnayang pandiwa sa Zacarias 12:10 at Juan 19:37.
- source_word: κόψονται ἐπ’ αὐτόν
  choice: mananaghoy dahil sa kanya
  rationale: Ipinahahayag ng 'mananaghoy' ang hayag at matinding pagdadalamhati. Ang 'dahil sa kanya' ay hindi nagpapasiya kung ito ay pakikiramay sa kanya o panaghoy bunga ng kanyang pagdating.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: lahat ng lipi sa daigdig
  rationale: Ang 'lipi' ay mas malapit sa φυλαί kaysa 'mga tao,' at ang 'daigdig' ay umaayon sa pangkalahatang saklaw ng talata. Inilalagay sa talababa ang posibleng kahulugang 'lupain.'
- source_word: ναί, ἀμήν
  choice: Oo, amen
  rationale: Pinananatili ang dobleng pagpapatibay at ang kinikilalang salitang liturhikal na 'amen.'
theological_decisions:
- issue: Saklaw ng τῆς γῆς sa pariralang πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: lahat ng lipi sa daigdig
  alternative: lahat ng lipi sa lupain
  rationale: Ang 'bawat mata' at ang pangitain ng pagdating ay pumapabor sa pandaigdig na saklaw. Gayunman, maaaring tumukoy ang γῆ sa isang lupain, lalo na dahil sa alusyon sa Zacarias 12:10–12, kaya pinananatili ang alternatibo sa talababa.
- issue: Diwa ng panaghoy sa κόψονται ἐπ’ αὐτόν
  choice: mananaghoy dahil sa kanya
  alternative: mananaghoy para sa kanya
  rationale: Hindi tahasang nililinaw ng parirala kung ang mga lipi ay nagluluksa para sa kanya o nananaghoy dahil sa pagdating at paghatol niya. Ang napiling anyo ay nagpapanatili ng ganitong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Masdan ninyo' bilang masiglang panawagan, ang 'bawat mata' upang mapanatili ang kongkretong larawan, at ang 'amen' dahil karaniwan at may bigat na liturhikal sa Filipino.
