- from: Masdan ninyo! Dumarating siya kasama ng mga ulap. Makikita siya ng bawat mata, pati ng mga tumusok sa kanya, at mananaghoy dahil sa kanya ang lahat ng lipi sa daigdig.[a] Oo, amen.
  to: Masdan! Dumarating siya kasama ng mga ulap. Makikita siya ng bawat mata, maging ang mga tumusok sa kanya, at mananaghoy dahil sa kanya ang lahat ng lipi sa daigdig.[a] Oo, amen.
  rationale: Pinalitan lamang ang “pati ng mga” ng “maging ang mga” upang maging mas natural at hindi malabo ang ugnayan ng “mga tumusok sa kanya” sa “bawat mata.” Inalis din ang “ninyo” sa pambungad upang ang panawagan na katumbas ng Ἰδοὺ ay hindi magdagdag ng isang tahasang plural na tagapakinig na wala sa Griyego. Pinanatili ang “dahil sa kanya,” na hindi labis na nagpapasiya sa masalimuot na diwa ng ἐπ’ αὐτόν sa alusyong Zacarias.
