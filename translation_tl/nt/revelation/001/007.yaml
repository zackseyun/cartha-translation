  naturalness: Kailangan ng munting rebisyon sa “pati ng mga tumusok sa kanya.” Bagaman mauunawaan ito, mas natural at malinaw sa modernong Filipino ang “maging ang mga tumusok sa kanya,” na tuwirang itinatampok ang pangkat na kabilang sa makakakita.
  terminology: Ang “mga ulap,” “bawat mata,” “tumusok,” “lipi,” “daigdig,” at “amen” ay angkop sa pinagmulan at sa marangal ngunit makabagong rehistro. Ang talababa para sa “lupain” ay wastong nag-iingat sa posibleng lokal na saklaw ng γῆ.
