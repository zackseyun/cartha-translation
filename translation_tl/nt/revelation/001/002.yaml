  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: tl
  text: na nagpatotoo tungkol sa salita ng Diyos, sa patotoo ni Jesus na Mesiyas[a], at sa lahat ng nakita niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patotoong mula kay Jesus na Mesiyas” o “patotoo tungkol kay Jesus na Mesiyas.” Maaaring unawain sa alinman sa dalawang paraan ang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: nagpatotoo
  rationale: Likas at malinaw na pandiwang Filipino na nagpapanatili sa diwa ng pagbibigay-saksi o patotoo.
- source_word: λόγον τοῦ θεοῦ
  choice: salita ng Diyos
  rationale: Pinananatili ang karaniwang biblikal na pariralang tumutukoy sa ipinahayag o ipinaabot ng Diyos, nang hindi nililimitahan ito sa salitang 'mensahe.'
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Pinananatili ang ugnayang leksikal sa 'nagpatotoo' at natural itong mabasa sa Filipino.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong 'Mesiyas' sa halip na gawing pangalang 'Cristo'; ang 'na' ay natural na pang-ugnay sa Filipino para sa titulo.
- source_word: ὅσα εἶδεν
  choice: sa lahat ng nakita niya
  rationale: Ipinahahayag ang malawak na saklaw ng ὅσα at pinananatili itong paliwanag na sumasaklaw sa naunang mga bagay na pinatotohanan.
theological_decisions:
- issue: Kalabuan ng genitibo sa μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: patotoo ni Jesus na Mesiyas
  alternative: patotoong mula kay Jesus na Mesiyas; patotoo tungkol kay Jesus na Mesiyas
  rationale: Hindi tiyak sa Griyego kung si Jesus ang pinagmulan ng patotoo o ang paksa nito. Pinananatili ng pangunahing teksto ang mas malapit na anyo, at inilalahad sa talababa ang dalawang posibleng kahulugan.
- issue: Pagpapakahulugan sa Χριστοῦ bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan ng Χριστός bilang titulo, kaya isinalin ito upang maging malinaw ang kahulugang 'Mesiyas'.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'nagpatotoo' at 'patotoo' upang mapanatili ang ugnayan ng pandiwa at pangngalan sa Griyego. Ang gitling na em dash bago ang huling parirala ay nagpapakitang ito ay buod ng lahat ng pinatotohanan niya.
