  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: tl
  text: at ang kanyang mga paa ay gaya ng tansong pinakinang[a], na para bang dinalisay sa hurno, at ang kanyang tinig ay gaya ng tunog ng maraming tubig[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang bihirang salitang isinaling “tansong pinakinang” ay maaaring tumukoy sa isang lubhang dinalisay o nagliliwanag na metal o haluang metal. Maaari rin itong isaling “pinong tanso” o “makinang na tanso.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “gaya ng tinig ng maraming tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: mga paa
  rationale: Ang πούς ay karaniwang tumutukoy sa paa; pinananatili ng salin ang tuwirang larawan ng pangitain.
- source_word: ὅμοιοι
  choice: ay gaya ng
  rationale: Ipinapahayag ng ὅμοιος ang pagkakatulad; natural sa modernong Tagalog ang pariralang “ay gaya ng.”
- source_word: χαλκολιβάνῳ
  choice: tansong pinakinang
  rationale: Bihira at hindi tiyak ang eksaktong metal na tinutukoy ng χαλκολίβανον. Ipinahihiwatig ng salin ang maningning at pinong metal nang hindi nagtatakda ng isang tiyak na haluang metal.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: na para bang dinalisay sa hurno
  rationale: Ang κάμινος ay hurno, lalo na para sa metal, at ang anyo ng πυρόω ay maaaring magpahiwatig ng pag-iinit, pagpapaliyab, o pagdadalisay sa apoy. Ang “para bang” ay nagpapanatili sa paghahambing ng ὡς.
- source_word: φωνή
  choice: tinig
  rationale: Sa unang paglitaw, malinaw na personal ang tinutukoy, kaya “tinig” ang natural at tuwirang katumbas.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: gaya ng lagaslas ng maraming tubig
  rationale: Maaaring mangahulugan ang φωνή ng tinig o tunog. Ang “lagaslas” ay natural na Tagalog para sa malakas na tunog ng tubig, samantalang pinananatili ng “maraming tubig” ang malawak na larawang biblikal at hindi ito nililimitahan sa alon o talon.
theological_decisions:
- issue: Pag-uulit ng φωνή sa huling paghahambing
  choice: ang kanyang tinig ay gaya ng lagaslas ng maraming tubig
  alternative: ang kanyang tinig ay gaya ng tinig ng maraming tubig
  rationale: Ipinakikita ng larawan ang kadakilaan at kapangyarihan ng nagsasalita. Pinananatili ng “lagaslas ng maraming tubig” ang bigat ng pandinig na larawan sa natural na Tagalog, habang inilalagay sa talababa ang mas literal na pag-uulit ng “tinig.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ritmo at magkahanay na mga paghahambing ng pangitain. Ginamit ang “kanyang” alinsunod sa karaniwang pormal na estilo ng saling biblikal, at iniwasang tukuyin nang labis ang uri ng metal o ang partikular na anyo ng maraming tubig.
