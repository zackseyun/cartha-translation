id: REV.1.1
reference: Revelation 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: tl
  text: Ang pahayag ni Jesu-Cristo[a], na ibinigay sa kanya ng Diyos upang ipakita sa kanyang mga alipin ang mga bagay na kailangang mangyari sa lalong madaling panahon,[b] at ipinaalam niya ito[c] sa kanyang aliping si Juan sa pamamagitan ng kanyang anghel na isinugo niya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Cristo” ay nangangahulugang “Mesiyas.” Maaari ring unawain ang pariralang Griyego bilang “ang pahayag mula kay Jesu-Cristo” o “ang pahayag tungkol kay Jesu-Cristo.”
    reason: alternative_reading
  - marker: b
    text: O “na kailangang mangyari nang mabilis.” Maaaring tumukoy ang parirala sa nalalapit na panahon o sa mabilis na pagganap ng mga pangyayari.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “ipinahiwatig niya ito.” Maaaring taglay ng pandiwa ang diwa ng pagpapabatid sa pamamagitan ng mga tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: pahayag
  rationale: Likas at malinaw na salin ng pagbubunyag o pagsisiwalat; ang konteksto ang nagpapakitang ito ay pahayag na mula sa Diyos.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesu-Cristo
  rationale: Ang “Cristo” ay kinikilalang titulong katumbas ng Mesiyas sa karaniwang makabagong Tagalog. Hindi ganap na nilulutas ng “ni” kung ang pahayag ay mula kay Jesus, tungkol kay Jesus, o kapwa.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: na ibinigay sa kanya ng Diyos
  rationale: Tuwirang pinananatili ang pagkakaiba ng Diyos at ni Jesus; ang “kanya” ay tumutukoy kay Jesu-Cristo.
- source_word: δεῖξαι
  choice: upang ipakita
  rationale: Pinananatili ang layunin ng pagbibigay at ang biswal na katangian ng pahayag.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: sa kanyang mga alipin
  rationale: Mas tumpak na inilalahad ng “alipin” kaysa “lingkod” ang ugnayan ng pagmamay-ari at lubos na pagpapasakop na taglay ng δοῦλος.
- source_word: ἃ δεῖ γενέσθαι
  choice: ang mga bagay na kailangang mangyari
  rationale: Natural na Tagalog na pinananatili ang diwa ng pangangailangan o itinakdang kaganapan.
- source_word: ἐν τάχει
  choice: sa lalong madaling panahon
  rationale: Inihahayag ang malapit na panahon bilang pangunahing pagbasa, habang inilalagay sa talababa ang posibleng diwang “mabilis.”
- source_word: ἐσήμανεν
  choice: ipinaalam niya ito
  rationale: Malinaw at natural sa Tagalog; maaaring taglay ng Griyegong pandiwa ang pahiwatig ng pagpapabatid sa pamamagitan ng mga tanda, na pinananatili sa talababa.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: sa pamamagitan ng pagsusugo ng kanyang anghel
  rationale: Ipinakikita ang paraan at tagapamagitan ng pagpapabatid nang hindi idinaragdag na ang “ito” mismo ang ipinadala.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: sa kanyang aliping si Juan
  rationale: Pinananatili ang pare-parehong salin ng δοῦλος at malinaw na si Juan ang tumanggap.
theological_decisions:
- issue: Ang genitibo sa Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: “Ang pahayag ni Jesu-Cristo” na may talababa tungkol sa saklaw ng genitibo
  alternative: “Ang pahayag mula kay Jesu-Cristo” o “Ang pahayag tungkol kay Jesu-Cristo”
  rationale: Maaaring tumukoy ang parirala sa pinagmulan, paksa, o pag-aari. Hindi dapat tahimik na pumili ng iisang kahulugan lamang.
- issue: Pagsasalin ng Χριστός
  choice: Cristo, na ipinaliliwanag bilang Mesiyas sa talababa
  alternative: Mesiyas
  rationale: Sa modernong Tagalog, “Jesu-Cristo” ang natural at marangal na anyo ng pangalan at titulo; ipinakikita ng talababa na ang Χριστός ay titulo at hindi apelyido.
- issue: Pagsasalin ng δοῦλος
  choice: alipin/mga alipin
  alternative: lingkod/mga lingkod
  rationale: Pinananatili ng “alipin” ang mariing diwa ng pag-aari at pagpapasakop sa Panginoon, nang hindi pinapahina bilang karaniwang paglilingkod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinanatili ang mahaba ngunit madaling sundang estruktura ng pambungad na pangungusap. Ginamit ang “alipin” para sa δοῦλος at ang karaniwang anyong “Jesu-Cristo,” na may paliwanag sa talababa tungkol sa titulong Mesiyas at sa tunay na kalabuan ng genitibo.
