id: REV.1.13
reference: Revelation 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: tl
  text: at sa gitna ng mga patungan ng ilawan ay may isang katulad ng isang anak ng tao[a], na nakasuot ng kasuutang abot hanggang paa at nakabigkis ng gintong pamigkis sa dibdib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “isang katulad ng Anak ng Tao.” Ang pananalitang Griyego ay may alusyon sa Daniel 7:13 at dito ay tumutukoy sa dinakilang Jesus.
    reason: Pinananatili ang tradisyonal na pagbasa bilang tiyak na titulong Kristolohikal habang hindi inaalis ang kawalan ng pantukoy at ang paghahambing sa Griyegong pangunahing teksto.
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: sa gitna ng
  rationale: Pinananatili ang malinaw na diwang panlunan at ang maringal na himig ng pangitain, habang nananatiling natural sa modernong Tagalog.
- source_word: λυχνιῶν
  choice: mga patungan ng ilawan
  rationale: Ang λυχνία ay patungan ng ilawan, hindi ang ilawan mismo; mahalaga ang pagkakaibang ito sa larawang ipinaliliwanag sa konteksto ng Pahayag.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: isang gaya ng anak ng tao
  rationale: Sinasalamin nito ang kawalan ng pantukoy sa Griyego at pinananatili ang alusyon sa Daniel 7:13 nang hindi agad ginagawang tiyak na titulo sa pangunahing teksto.
- source_word: ἐνδεδυμένον
  choice: nakasuot ng
  rationale: 'Natural na ipinapahayag ang kalagayang inilalarawan ng perfect participle: nakita ang tauhan na suot na ang kasuutan.'
- source_word: ποδήρη
  choice: damit na abot sa paa
  rationale: Tuwirang ipinahahayag ang literal na diwa ng kasuotang umaabot hanggang paa nang hindi gumagamit ng salitang teknikal o lipas.
- source_word: περιεζωσμένον
  choice: may ... pamigkis
  rationale: Natural na inilalarawan sa Tagalog ang kalagayan ng pagkakabigkis, nang hindi gumagamit ng pilit na pandiwang anyo.
- source_word: πρὸς τοῖς μαστοῖς
  choice: sa dibdib
  rationale: Malinaw at likas na tinutukoy ang mataas na pagkakalagay ng pamigkis sa katawan, habang iniiwasan ang alanganing sobrang literal na anyo.
- source_word: ζώνην χρυσᾶν
  choice: gintong pamigkis
  rationale: Ang “pamigkis” ay angkop sa maringal na paglalarawan at mas mahusay kaysa “sinturon” para sa malapad o telang bigkis na nasa dibdib.
theological_decisions:
- issue: Ang Kristolohikal na puwersa ng ὅμοιον υἱὸν ἀνθρώπου
  choice: “isang gaya ng anak ng tao” sa pangunahing teksto
  alternative: “isang gaya ng Anak ng Tao”
  rationale: Pinananatili ng pangunahing salin ang anyo at tunay na interpretatibong puwang ng Griyego, pati ang alusyon sa Daniel 7:13, nang hindi tahimik na ipinapasok ang tiyak na titulong Kristolohikal. Inilalahad sa talababa ang tradisyonal at kontekstuwal na pagbasa, yamang ang tauhan sa pangitain ay ang dinakilang Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “patungan ng ilawan” para sa eksaktong larawan at “pamigkis” para sa maringal na kasuutan. Pinanatili ang anyong parirala na karugtong ng naunang talata, gaya ng sintaks ng pinagmulan.
