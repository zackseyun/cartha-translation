id: REV.1.18
reference: Revelation 1:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: tl
  text: at ang Nabubuhay—namatay ako[a], at narito, buhay ako magpakailanman[b]—at nasa akin ang mga susi ng kamatayan at ng Hades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “naging patay ako”; idinidiin ng Griyego ang pagpasok niya sa kamatayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa mga kapanahunan ng mga kapanahunan,” isang idyoma para sa walang-hanggang tagal.
    reason: lexical_alternative
  - marker: c
    text: Ang “Hades” ay tumutukoy sa daigdig o kinaroroonan ng mga patay, hindi partikular sa pangwakas na kaparusahan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: ang Nabubuhay
  rationale: Ang may artikulong participle ay gumaganap bilang isang titulo. Pinananatili ng “ang Nabubuhay” ang titular na diin at ang alingawngaw ng paglalarawan sa Diyos, sa halip na gawing karaniwang sugnay lamang.
- source_word: ἐγενόμην νεκρός
  choice: Namatay ako
  rationale: Ipinahihiwatig ng γίνομαι kasama ng pang-uring νεκρός ang pagpasok sa kalagayan ng kamatayan. Mas natural sa makabagong Tagalog ang “namatay ako” kaysa “naging patay ako,” at malinaw pa rin nitong ipinapakita ang paglipat mula sa buhay tungo sa kamatayan.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang mapukaw-pansing puwersa ng interjection nang hindi gumagamit ng labis na makalumang pananalita.
- source_word: ζῶν εἰμι
  choice: buhay ako
  rationale: Natural na Tagalog para sa kasalukuyang kalagayang ipinahahayag ng participle na may εἰμί, at malinaw na katapat ng “namatay ako.”
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Likas at marangal na katumbas sa Tagalog ng mariing idyoma para sa walang-hanggang tagal; ipinaliliwanag sa talababa ang mas literal na anyo.
- source_word: κλεῖς
  choice: mga susi
  rationale: Tuwirang katumbas na nagpapanatili sa larawang nagpapahiwatig ng kapangyarihan at pamamahala.
- source_word: τοῦ θανάτου
  choice: ng kamatayan
  rationale: Tuwirang salin ng genitive; hindi ginawang tahasang personipikasyon dahil hindi iyon hinihingi ng Griyego.
- source_word: τοῦ ᾅδου
  choice: ng Hades
  rationale: Pinananatili ang natatanging konsepto ng ᾅδης at iniiwasang ipantay ito sa libingan lamang o sa pangwakas na kaparusahan.
theological_decisions:
- issue: Paglalarawan sa kamatayan ni Jesus
  choice: Namatay ako
  alternative: Naging patay ako / Ako ay patay noon
  rationale: Ang pinili ay natural sa Tagalog at pinananatili ang dinamikong diwa ng ἐγενόμην—ang aktuwal na pagpasok sa kamatayan—nang hindi pinapahina ang tunay na kamatayan o ipinapasok ang paliwanag na wala sa teksto.
- issue: Kahulugan ng ᾅδης sa kontekstong eskatolohikal
  choice: Hades
  alternative: libingan / daigdig ng mga patay / impiyerno
  rationale: Pinananatili ng “Hades” ang pagkakaiba nito sa kamatayan at hindi ito basta itinutumbas sa pisikal na libingan o sa pangwakas na kaparusahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “narito” upang panatilihin ang masiglang diin ng ἰδοὺ, at “Hades” upang mapanatili ang teolohikal na pagkakaiba ng mga terminong nasa Griyego.
