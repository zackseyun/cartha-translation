  source_fidelity: Ang pangunahing mensahe at mga titulo ay tapat sa Griyego. Gayunman, ang “umiral na” ay karaniwang nagpapahiwatig ng perpektibong “has existed” at maaaring lumabo ang natatanging nakaraang sangkap ng ὁ ἦν. Mas malinaw na itumbas ito bilang “umiiral noon,” habang pinananatili ang kasalukuyang aspekto ng “dumarating.”
  naturalness: Marangal at likas ang kabuuang rehistro. Ang “umiiral ngayon, umiiral noon, at dumarating” ay mas malinaw at mas maayos na paralelismo sa modernong Filipino kaysa “umiiral ngayon, umiral na, at dumarating.”
  terminology: Wasto ang “Alpha at Omega,” “Panginoong Diyos,” at “Makapangyarihan sa lahat.” Ang “Siyang” ay katanggap-tanggap na magalang na ortograpikong kumbensiyon sa pagtukoy sa Diyos at hindi nagdaragdag ng kahulugan.
