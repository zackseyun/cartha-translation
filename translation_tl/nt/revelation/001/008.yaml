  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: tl
  text: “Ako ang Alpha at ang Omega,” sabi ng Panginoong Diyos, “ang Siyang umiiral ngayon, umiiral noon, at dumarating[a], ang Makapangyarihan sa lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Siyang umiiral ngayon, umiiral noon, at darating.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Likas sa Tagalog ang konstruksiyong “Ako ang” sa ganitong solemneng pagpapahayag, at sapat nitong naipapakita ang diin ng hayag na panghalip na Ἐγώ.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: ang Alpha at ang Omega
  rationale: Pinananatili ang mga pangalan ng una at huling titik sa alpabetong Griyego upang mapangalagaan ang simbolikong diwa at kinikilalang apokaliptikong katawagan.
- source_word: λέγει
  choice: sabi ng
  rationale: Natural at makabagong pormula ito sa Filipino para sa kasalukuyang λέγει, nang hindi dinaragdagan ang lakas nito gaya ng “ipinapahayag.”
- source_word: κύριος, ὁ θεός
  choice: Panginoong Diyos
  rationale: Ito ang natural na anyong Filipino ng magkaugnay na banal na titulong “ang Panginoon, ang Diyos.”
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: ang Siyang umiiral ngayon, umiral na, at dumarating
  rationale: Pinananatili ang tatluhang pormula at ang kasalukuyang aspekto ng ἐρχόμενος. Idinagdag ang “ngayon” upang maging malinaw at natural sa Filipino ang kaibahan ng ὁ ὢν at ὁ ἦν, nang hindi ginagawang abstraktong titulo lamang ang mga pandiwa.
- source_word: ὁ παντοκράτωρ
  choice: ang Makapangyarihan sa lahat
  rationale: Ito ang malinaw, dignified, at nakaugaliang katumbas ng παντοκράτωρ sa Filipino, na nagpapahayag ng lubos na kapangyarihan at paghahari ng Diyos.
theological_decisions:
- issue: Ang banal na pagpapakilala kaugnay ng walang hanggang pag-iral ng Diyos at ng kaniyang pagdating
  choice: ang Siyang umiiral ngayon, umiral na, at dumarating
  alternative: ang Siyang umiiral ngayon, umiral na, at darating
  rationale: Ang ἐρχόμενος ay present participle, kaya mas tuwirang sinasalamin ng “dumarating” ang nagpapatuloy o aktibong pagdating. Ang “darating” ay lehitimong tradisyonal na pagbasa ngunit maaaring higit na magpahiwatig ng payak na hinaharap, kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga titulong “Alpha at Omega” at “Panginoong Diyos,” habang iniwasan ang labis na arkaikong pananalita. Ang malaking titik sa “Siyang” ay isang magalang na kumbensiyong Filipino para sa pagtukoy sa Diyos, hindi dagdag na teolohikal na pagpapakahulugan.
