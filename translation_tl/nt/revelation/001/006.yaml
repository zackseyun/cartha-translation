  naturalness: Marangal at madaling basahin ang pangungusap. Gayunman, ang “mga pari para sa kanyang Diyos at Ama” ay medyo hindi likas sa modernong Filipino. Ang “mga paring naglilingkod sa kanyang Diyos at Ama” ay natural na naghahayag ng tungkuling pang-pari na ipinahihiwatig ng datibo nang hindi binabago ang kahulugan.
  terminology: Ang “kaharian,” “mga pari,” “Diyos at Ama,” “kaluwalhatian,” at “Amen” ay angkop. Ang “kapamahalaan” ang mas tumpak na katumbas ng κράτος sa doxolohiyang ito kaysa “kapangyarihang maghari.”
