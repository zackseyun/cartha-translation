  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: tl
  text: at ginawa niya tayong isang kaharian[a], mga paring naglilingkod sa kanyang Diyos at Ama—sa kanya ang kaluwalhatian at kapamahalaan magpakailanman.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang mas huling manuskrito, “mga hari at mga pari” ang mababasa sa halip na “isang kaharian, mga pari.” Sinusunod ng pangunahing teksto ang ibinigay na tekstong Griyego.
    reason: textual_variant
  - marker: b
    text: 'Mas literal: “sa mga kapanahunan ng mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: ginawa
  rationale: Ang aorist active indicative ay likas na naipahahayag sa payak na aspektong naganap; hindi na idinagdag ang di-tiyak na patuloy na bunga.
- source_word: βασιλείαν
  choice: isang kaharian
  rationale: Isahan ang pangngalan at tumutukoy sa kaharian o sama-samang bayang nasa ilalim ng paghahari, hindi sa “mga hari.”
- source_word: ἱερεῖς
  choice: mga pari
  rationale: Tuwirang pinananatili ang katawagang panrelihiyon at pangtipan; nakapaliwanag ito sa “tayong isang kaharian.”
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: para sa kanyang Diyos at Ama
  rationale: Ipinahahayag ng “para sa” ang kaugnayan at paglilingkod ng mga pari sa Diyos. Ang “kanyang” ay kaugnay kapwa ng “Diyos” at “Ama.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang maikling anyo ng doxolohiya at ang pagtukoy sa pinakamalapit na tinutukoy sa konteksto, si Jesu-Cristo.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Ito ang malinaw at nakaugaliang katumbas sa mga pahayag ng papuri.
- source_word: κράτος
  choice: kapangyarihang maghari
  rationale: Mas malinaw ito sa karaniwang mambabasa kaysa “pamamayani” at ipinahahayag ang makapangyarihang paghahari, hindi lamang pangkalahatang lakas.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Natural na Filipino para sa idyomang nagsasaad ng walang-hanggang tagal; inilalagay sa talababa ang mas literal na anyo.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinikilalang liturhikal na pagpapatibay na gamit sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng “kanyang Diyos at Ama”
  choice: Pinananatili ang “kanyang Diyos at Ama,” na sa konteksto ay tumutukoy sa Diyos at Ama ni Jesu-Cristo.
  alternative: “Diyos na kanyang Ama” o isang pariralang hindi malinaw kung kanino tumutukoy ang “kanyang.”
  rationale: Pinangangalagaan nito ang ugnayang ipinahahayag ng Griyego at hindi pinapawi ang pagkakaiba ng mga persona o nilulutas nang higit sa sinasabi ng teksto.
- issue: Kalagayan ng tinubos na pamayanan
  choice: “isang kaharian, mga pari”
  alternative: “mga hari at mga pari”
  rationale: Ang ibinigay na tekstong Griyego ay βασιλείαν, ἱερεῖς (“isang kaharian, mga pari”), kaya pinananatili ang kolektibong pagkakakilanlan at hindi ipinapasok sa pangunahing teksto ang mas huling baryante.
- issue: Anyo ng doxolohiya
  choice: “sa kanya ang kaluwalhatian at kapangyarihang maghari”
  alternative: “sumakanya nawa ang kaluwalhatian at kapangyarihan”
  rationale: Walang tahasang pandiwang optative sa Griyego. Ang napiling anyo ay natural na pagpapahayag ng pag-uukol ng papuri nang hindi idinaragdag ang “nawa.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at masidhing himig ng doxolohiya, gayundin ang bahagyang di-pangkaraniwang pagtutumbas na “isang kaharian, mga pari” upang hindi matakpan ang estruktura at teolohikal na diin ng Griyego.
