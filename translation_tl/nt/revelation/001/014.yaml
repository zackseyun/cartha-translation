base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: tl
  text: Ang kanyang ulo at buhok ay maputi[a], tulad ng puting lana, tulad ng niyebe, at ang kanyang mga mata ay tulad ng ningas ng apoy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang kanyang ulo at ang kanyang buhok ay maputi tulad ng puting lana, tulad ng niyebe.”
