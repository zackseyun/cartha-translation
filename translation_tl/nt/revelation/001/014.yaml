lexical_decisions:
- source_word: δὲ
  choice: at
  rationale: Isinama bilang banayad na pang-ugnay sa loob ng pangungusap; hindi ito ginawang temporal na “ngayon,” sapagkat walang tahasang temporal na diwa ang salita rito.
- source_word: κεφαλὴ
  choice: ulo
  rationale: Tuwirang katumbas ng anatomikal na termino at angkop sa paglalarawan ng pangitain.
- source_word: τρίχες
  choice: buhok
  rationale: Ginamit ang likas na kolektibong anyo sa Tagalog sa halip na “mga buhok.”
- source_word: λευκαὶ
  choice: maputi
  rationale: Pinananatili ang payak na kulay at ang diin ng paulit-ulit na kaputian nang walang dagdag na pagpapakahulugan.
- source_word: ὡς ἔριον λευκόν
  choice: tulad ng puting lana
  rationale: Malinaw na pinananatili ang pagtutulad at ang pang-uri na tumutukoy sa lana.
- source_word: ὡς χιών
  choice: tulad ng niyebe
  rationale: Pinananatili ang ikalawang pagtutulad at ang pinagsama-samang larawan ng kaputian.
- source_word: ὀφθαλμοὶ
  choice: mga mata
  rationale: Karaniwang Tagalog na katumbas ng maramihang anatomikal na termino.
- source_word: ὡς φλὸξ πυρός
  choice: tulad ng ningas ng apoy
  rationale: Malapit sa anyong Griyego at pinananatili ang matingkad na larawang apokaliptiko nang hindi ito pinapaliwanag sa mismong teksto.
theological_decisions:
- issue: Simbolikong paglalarawan sa itinaas na Anak ng Tao
  choice: Pinanatiling literal ang mga larawan at pagtutulad sa salin.
  alternative: Dagdagan ang teksto ng pagpapakahulugang tumutukoy sa kadalisayan, kawalang-hanggan, o paghatol.
  rationale: Mga larawang pangitain ang inilalahad ng talata, hindi tahasang paliwanag sa kahulugan ng mga ito. Ang literal na paglalahad ay nagpapanatili ng tunay na teolohikal na tensiyon at umiiwas sa pagpasok ng interpretasyong hindi sinasabi rito.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sunod-sunod na pagtutulad at ang paulit-ulit na larawan ng kaputian. Ginamit ang “ningas ng apoy” bilang natural at matingkad na katumbas ng φλὸξ πυρός.
