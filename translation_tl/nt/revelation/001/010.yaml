id: REV.1.10
reference: Revelation 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: tl
  text: Nasa Espiritu[b] ako noong araw ng Panginoon[a], at narinig ko sa likuran ko ang isang malakas na tinig na parang trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang, “sa Araw ng Panginoon.” Ang Griyego rito ay κυριακῇ ἡμέρᾳ (“araw na nauukol sa Panginoon”), hindi ang mas karaniwang parirala para sa eskatolohikal na “Araw ng Panginoon.”
    reason: alternative_reading
  - marker: b
    text: O, “sa espiritu.” Maaaring tumukoy ang parirala sa pagiging nasa ilalim ng propetikong impluwensiya ng Banal na Espiritu; hindi tahasang sinasabi ng teksto na siya ay nasa kawalan ng ulirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην ἐν πνεύματι
  choice: Nasa Espiritu ako
  rationale: Likas at malinaw ito sa modernong Tagalog. Ipinahihiwatig ng ἐγενόμην ang pagpasok sa isang kalagayan, ngunit magiging alanganin ang sobrang literal na “ako ay napasa Espiritu.” Hindi rin ito pinalawak bilang kawalan ng ulirat, na hindi tahasang sinasabi ng Griyego.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Malamang na tumutukoy ito sa impluwensiyang propetiko ng Banal na Espiritu sa konteksto ng Pahayag, ngunit pinananatili ng payak na parirala ang posibilidad na unawain itong “sa espiritu.”
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: nang araw ng Panginoon
  rationale: Ipinahahayag ng pang-uring κυριακῇ na ang araw ay nauukol sa Panginoon. Ginamit ang “nang” bilang natural na panandang pamanahon; hindi nito awtomatikong ipinapantay ang parirala sa karaniwang eskatolohikal na anyong Griyego para sa “Araw ng Panginoon.”
- source_word: ἤκουσα ὀπίσω μου
  choice: narinig ko sa likuran ko
  rationale: Ang ἤκουσα ay payak na pandama ng pagkarinig, at ang ὀπίσω μου ay lokasyong nasa likuran, hindi pagkakasunod-sunod sa panahon.
- source_word: φωνὴν μεγάλην
  choice: isang malakas na tinig
  rationale: Kapag inilalarawan ang φωνή, ang μεγάλην ay tumutukoy sa lakas ng tunog. Ang “malakas na tinig” ay natural at tumpak sa Tagalog.
- source_word: ὡς σάλπιγγος
  choice: na parang trumpeta
  rationale: Pinananatili nito ang tuwirang paghahambing sa katangian ng tunog ng trumpeta nang hindi idinaragdag ang salitang “bugso” o “tunog,” na wala sa Griyego.
theological_decisions:
- issue: Kung ang ἐν πνεύματι ay tahasang tumutukoy sa Banal na Espiritu, sa espiritu ni Juan, o sa isang kawalan ng ulirat
  choice: sa Espiritu
  alternative: sa espiritu; nasa kawalan ng ulirat
  rationale: Sa mga pormulang pangitain sa Pahayag, malamang na Banal na Espiritu ang tinutukoy. Gayunman, walang tahasang artikulo o salitang nangangahulugang “kawalan ng ulirat,” kaya pinanatili ang maikling parirala at ipinaliwanag ang leksikal na posibilidad sa talababa.
- issue: Kung ang κυριακῇ ἡμέρᾳ ay lingguhang araw na nauukol sa Panginoon o ang eskatolohikal na Araw ng Panginoon
  choice: araw ng Panginoon
  alternative: Araw ng Panginoon sa pangwakas na panahon
  rationale: Ang κυριακός ay nangangahulugang “nauukol sa Panginoon,” at naiiba ang pariralang ito sa mas karaniwang Griyegong ekspresyon para sa eskatolohikal na “Araw ng Panginoon.” Hindi tinutukoy ng salin kung aling araw ng linggo ito.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Iniwasan ang lipas at alanganing “napasa Espiritu” at ang interpretatibong “nasa kawalan ng ulirat.” Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
