id: REV.1.3
reference: Revelation 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: tl
  text: Pinagpala ang bumabasa nang malakas[a], at ang mga nakikinig sa mga salita ng propesiyang ito at tumutupad sa mga nakasulat dito, sapagkat malapit na ang panahon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bumabasa.” Malamang na tumutukoy ang Griyego sa isang taong bumabasa sa harap ng kapulungan, kaya “bumabasa nang malakas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malapit na ang takdang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Pinagpala
  rationale: Pinananatili nito ang bigat ng pananalitang makikita sa mga pagpapala sa Bagong Tipan—higit sa pansariling damdamin ng pagiging masaya o mapalad.
- source_word: ὁ ἀναγινώσκων
  choice: ang bumabasa nang malakas
  rationale: Ang isang bumabasa na itinatambal sa maraming nakikinig ay malamang tumutukoy sa pampublikong pagbasa sa kapulungan. Nililinaw ng “nang malakas” ang malamang na sitwasyong pasalita.
- source_word: οἱ ἀκούοντες
  choice: ang mga nakikinig
  rationale: Natural itong katambal ng pagbasa nang malakas at ipinahihiwatig ang aktibong pagtanggap sa binabasang mga salita.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: mga salita ng propesiyang ito
  rationale: Pinananatili ng “mga salita” ang λόγους sa halip na gawing mas pangkalahatang “mensahe”; ipinakikilala ng “ito” ang propesiyang nasa aklat na binabasa.
- source_word: τηροῦντες
  choice: tumutupad
  rationale: Ipinahahayag nito ang tapat at masunuring pagsunod sa nilalaman, hindi lamang ang pag-iingat o pag-alala rito.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: mga nakasulat dito
  rationale: Natural na salin ito ng mga bagay na nakasulat sa propesiya o aklat na tinutukoy.
- source_word: ὁ καιρός
  choice: ang panahon
  rationale: Malinaw at malawak ang “panahon,” habang hindi nito ipinipilit kung dapat unawain ang καιρός bilang isang partikular na itinakdang sandali.
- source_word: ἐγγύς
  choice: malapit na
  rationale: Likas sa makabagong Tagalog at tuwirang pinananatili ang pahayag ng nalalapit na panahon.
theological_decisions:
- issue: Ang sitwasyon ng pampublikong pagbasa na ipinahihiwatig ng isang bumabasa at maraming nakikinig
  choice: “bumabasa nang malakas” upang ipakita ang malamang na pagbasa sa kapulungan
  alternative: “bumabasa” nang hindi tahasang ipinapakita ang pasalitang pagbasa
  rationale: Malakas na ipinahihiwatig ng pagkakaiba ng isang tagabasa at maraming tagapakinig ang pampublikong pagbasa, ngunit inilalagay sa talababa ang mas literal at mas malawak na posibilidad.
- issue: Ang eskatolohikal na puwersa ng καιρός ἐγγύς
  choice: “malapit na ang panahon” nang hindi tinutukoy ang eksaktong kronolohiya o paraan ng katuparan
  alternative: “malapit na ang takdang panahon”
  rationale: Ipinapahayag ng teksto ang pagkalapit ngunit hindi nito nilulutas ang mga pagtatalo tungkol sa kronolohiya ng katuparan; pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “propesiya,” “tumutupad,” at “malapit na ang panahon” bilang karaniwang wikang biblikal na nauunawaan ng pangkalahatang mambabasa, habang iniwasan ang pagpasok ng anumang partikular na sistemang pang-eskatolohiya.
