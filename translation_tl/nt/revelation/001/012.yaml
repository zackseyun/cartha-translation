source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: tl
  text: At lumingon ako upang tingnan ang tinig na nagsasalita sa akin[a]. Paglingon ko, nakita ko ang pitong patungan ng ilawan na yari sa ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakikipag-usap sa akin.” Sa literal na Griyego, “nagsasalita kasama ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: lumingon ako
  rationale: Tumutukoy rito ang pandiwa sa pisikal na pagharap sa ibang direksiyon. Likas sa Filipino ang “lumingon ako” at hindi nito dinaragdagan ang detalye ng Griyego.
- source_word: βλέπειν
  choice: upang tingnan
  rationale: Ipinahihiwatig ng infinitive ang layunin ng paglingon. Mas natural sa Filipino ang “tingnan ang tinig” kaysa “makita ang tinig,” habang pinananatili ang kapansin-pansing larawan ng pagsisikap na tingnan ang isang tinig.
- source_word: φωνὴν
  choice: ang tinig
  rationale: Dahil nagsasalita ito, “tinig” ang tumpak na kahulugan sa konteksto, hindi lamang “tunog.”
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: nagsasalita sa akin
  rationale: Pinananatili ng aspektong nagaganap ang patuloy na kilos ng imperfect. Pinili ang likas na pariralang Filipino na “sa akin”; inilalagay sa talababa ang mas literal na puwersa ng μετά na “kasama/kausap ako.”
- source_word: ἐπιστρέψας
  choice: nang makalingon ako
  rationale: Ipinakikita ng sugnay na temporal na nauna o kasabay na natapos ang paglingon bago niya nakita ang mga patungan ng ilawan.
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang salin ng aorist na εἶδον nang walang di-kailangang pagpapalawak.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: pitong patungan ng ilawan na yari sa ginto
  rationale: Ang λυχνία ay patungan ng ilawan, hindi ang ilawan mismo. Nililinaw ng “yari sa ginto” ang materyal na ipinahihiwatig ng χρυσᾶς at iniiwasang unawain lamang bilang kulay-ginto.
theological_decisions:
- issue: Paglalarawan sa λυχνίας bilang apokaliptikong sagisag
  choice: patungan ng ilawan
  alternative: mga ilawan
  rationale: Pinananatiling kongkreto at tumpak ang bagay sapagkat sa Pahayag 1:20 ay binibigyan ng simbolikong kahulugan ang pitong patungan ng ilawan. Ang “mga ilawan” ay maghahalo sa ilawan at sa pinapatungan nito.
translation_notes:
  register: Makabago at dignified na Filipino na madaling maunawaan. Sadyang pinanatili ang di-karaniwang larawang “tingnan ang tinig” sa halip na ipaliwanag itong “tingnan kung sino ang nagsasalita,” upang hindi magdagdag ng wala sa teksto.
