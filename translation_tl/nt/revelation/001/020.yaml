id: REV.1.20
reference: Revelation 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: tl
  text: 'Tungkol sa hiwaga ng pitong bituin na nakita mo sa aking kanang kamay, at ng pitong gintong patungan ng ilawan: ang pitong bituin ay ang mga anghel[a] ng pitong iglesya, at ang pitong patungan ng ilawan ay ang pitong iglesya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sugo ng pitong iglesya.” Ang salitang Griyego ay maaaring tumukoy sa mga anghel o sa mga taong sugo.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: hiwaga
  rationale: Pinananatili ang apokaliptiko at teolohikal na bigat ng salita, habang tumutukoy sa inihayag na kahulugan ng pangitain.
- source_word: ἀστέρων / ἀστέρες
  choice: mga bituin
  rationale: Tuwirang salin ng simbolo sa pangitain; ipinaliliwanag ng kasunod na sugnay ang tinutukoy nito.
- source_word: οὓς εἶδες
  choice: na nakita mo
  rationale: Natural na Tagalog na panuring sa “pitong bituin.”
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: sa aking kanang kamay
  rationale: Natural sa Tagalog at umaayon sa larawang naitatag sa agarang konteksto na hawak niya ang mga bituin sa kanang kamay.
- source_word: λυχνίας
  choice: mga patungan ng ilawan
  rationale: Ang λυχνία ay patungan ng ilawan, hindi ang ilawan mismo; pinananatili ng salin ang kongkretong larawan.
- source_word: χρυσᾶς
  choice: gintong
  rationale: Maikli at natural na paglalarawan sa mga patungan ng ilawan bilang yari sa o may katangiang ginto.
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Maaaring mangahulugan ang salita ng mga anghel o mga sugo. Karaniwan sa Pahayag ang diwang makalangit, kaya “mga anghel” ang nasa pangunahing teksto at nasa talababa ang alternatibo.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: mga iglesya
  rationale: Karaniwan at angkop na katawagan sa modernong Filipino para sa mga lokal na kapulungang tinutukoy sa Pahayag.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Tungkol sa hiwaga ng ... at sa ...:'
  rationale: Ginagawang paksa ang dalawang larawan bago ibigay ang paliwanag, nang hindi idinaragdag ang tahasang “ay ito” na wala sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: mga anghel ng pitong iglesya
  alternative: mga sugo ng pitong iglesya
  rationale: Maaaring tumukoy ang ἄγγελος sa makalangit na anghel o sa taong sugo. Hindi tahasang nilulutas ng talata ang pagkakakilanlan nila, kaya pinanatili sa pangunahing teksto ang “mga anghel” at inilagay sa talababa ang “mga sugo.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” bilang karaniwang terminong biblikal at “patungan ng ilawan” upang malinaw na maiba ang λυχνία sa mismong ilawan. Ang panandang [a] ay inilagay kaagad pagkatapos ng “mga anghel,” ang mismong salitang may alternatibong pakahulugan.
