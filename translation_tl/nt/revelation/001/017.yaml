id: REV.1.17
reference: Revelation 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: tl
  text: At nang makita ko siya, bumagsak ako sa paanan niya na parang patay.[a] Ipinatong niya sa akin ang kanyang kanang kamay at sinabi, “Huwag kang matakot.[b] Ako ang Una at ang Huli,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na tila patay.”
    reason: lexical_alternative
  - marker: b
    text: O, “Huwag kang mangamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: At nang
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay sa naunang talata, samantalang malinaw na temporal ang “nang.”
- source_word: εἶδον αὐτόν
  choice: makita ko siya
  rationale: Tuwiran at likas na salin ng karaniwang pandiwa ng pagkakita; hindi nito dinaragdagan ang paraan o tagal ng pagtingin.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: bumagsak ako sa paanan niya
  rationale: Ipinahahayag ng “bumagsak” ang biglaang pagbagsak, at ang “sa paanan niya” ang likas na katumbas sa Filipino ng posisyon sa harap ng kanyang mga paa.
- source_word: ὡς νεκρός
  choice: na parang patay
  rationale: Pinananatili ng “parang” ang hayag na paghahambing at hindi ipinahihiwatig na tunay na namatay si Juan.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Ipinatong niya sa akin ang kanyang kanang kamay
  rationale: Likas na inilalarawan ng “ipinatong” ang paglalagay ng kamay sa isang tao, habang tahasang pinananatili ang “kanang kamay.”
- source_word: λέγων
  choice: at sinabi
  rationale: Bagaman participle ang anyong Griyego, ang koordinadong pandiwang “at sinabi” ay mas likas sa modernong Filipino at malinaw na kasabay ng pagpatong ng kamay ang pagsasalita.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Tuwiran, pang-isahan, at natural na utos sa Filipino; taglay nito ang kapuwa pagpigil at pagpapalakas ng loob.
- source_word: ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa Filipino, ang hulma na “Ako ang” ang natural at madiing pagpapakilala sa sarili bago ang mga titulong sumusunod.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Una at ang Huli
  rationale: Pinananatili ang dalawang articular na katawagan bilang magkatimbang na titulo. Ang malaking titik ay nagpapakita ng gamit bilang mga titulo nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa ὁ πρῶτος καὶ ὁ ἔσχατος bilang titulo
  choice: ang Una at ang Huli
  alternative: ang una at ang huli
  rationale: Sa konteksto, pormal itong pagpapakilala sa nagsasalita at umaalingawngaw sa wikang ginagamit bilang banal na titulo sa Isaias. Ipinakikita ng malaking titik ang tungkuling pantitulo ngunit hindi binabago ang mga salita.
- issue: Lakas ng ἐγώ εἰμι
  choice: Ako ang
  alternative: Ako ay
  rationale: Dahil sinusundan ito ng mga pangngalang pantukoy, “Ako ang” ang wastong likas na anyo sa Filipino at pinananatili ang diin ng tahasang ἐγώ nang hindi ipinipilit ang isang higit na tiyak na teolohikal na alusyon.
- issue: Kalagayan ni Juan sa ὡς νεκρός
  choice: na parang patay
  alternative: na tila patay
  rationale: Ang ὡς ay naghahayag ng paghahambing. Kaya hindi sinasabing literal na namatay si Juan, at pinananatili ang retorikal na tensiyon ng kanyang matinding reaksiyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pasalaysay at pangitain. Ginamit ang “siya/niya” sa halip na mas lumang anyo, at pinanatili ang solemnidad sa mga titulong “Una” at “Huli.”
