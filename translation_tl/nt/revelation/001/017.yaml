  source_fidelity: 'Tumpak na naisasalin ang lahat ng pangunahing sangkap ng Griyego: ang ugnayang pasalaysay at oras (“At nang”), pagkakita, pagbagsak sa paanan niya, hayag na paghahambing na “parang patay,” pagpatong ng kanang kamay, utos na huwag matakot, at ang dalawang pantitulong katawagan. Hindi nito ipinahihiwatig na literal na namatay si Juan.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang “bumagsak ako sa paanan niya” at “Ipinatong niya sa akin ang kanyang kanang kamay” ay marangal ngunit hindi lipas. Ang tuwirang pananalita ay maayos ang daloy at angkop sa pangitain.
  terminology: Wasto at magkakatugma ang “Huwag kang matakot,” “Ako ang,” at “ang Una at ang Huli.” Ang malaking titik sa “Una” at “Huli” ay angkop sa pantitulong gamit at hindi nagdaragdag ng doktrinal na kahulugan. Wasto ring nakalagay ang talababa a sa pariralang isinasailalim nito, “parang patay,” at ang b sa utos na “Huwag kang matakot.”
