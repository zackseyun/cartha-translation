id: REV.1.9
reference: Revelation 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: tl
  text: Akong si Juan, na inyong kapatid at karamay sa pagdurusa, kaharian, at pagtitiis sa pakikiisa kay Jesus, ay nasa pulong tinatawag na Patmos dahil sa salita ng Diyos at sa patotoo ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patotoo tungkol kay Jesus.” Sa Griyego, maaari itong mangahulugan ng patotoong ibinigay ni Jesus o ng patotoo tungkol kay Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: kasama
  rationale: Ipinahahayag nito ang pakikibahagi ni Juan sa parehong mga realidad na dinaranas ng mga mambabasa; natural ito sa modernong Tagalog at walang komersiyal na pahiwatig.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: sa pagdurusa, paghahari, at pagtitiis
  rationale: Pinananatili ang tatlong magkakaugnay na larangan ng pakikibahagi. Ang “pagdurusa” ay natural ngunit may sapat na bigat para sa θλῖψις; ang “paghahari” ay nagpapahayag sa aktibong realidad ng βασιλεία; at ang “pagtitiis” ay maikli at tumpak para sa ὑπομονή.
- source_word: ἐν Ἰησοῦ
  choice: kay Jesus
  rationale: Ang parirala ay pinakamalamang na kaugnay ng naunang tatluhan at naglalagay sa pagdurusa, paghahari, at pagtitiis sa kaugnayan kay Jesus. Mas natural sa Tagalog ang “kay Jesus” kaysa sa literal ngunit di-likas na “sa loob ni Jesus,” nang hindi ito pinalalawak tungo sa isang tiyak na interpretasyon.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: Naroon ako sa pulo
  rationale: Ginagamit dito ang γίνομαι bilang idyoma ng pagiging nasa isang lugar. Hindi ipinahihiwatig ng salin kung paano nakarating si Juan doon.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: na tinatawag na Patmos
  rationale: Natural at malinaw na katumbas ng participle na καλουμένῃ bilang paglalarawan sa pulo.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: dahil sa salita ng Diyos
  rationale: Ang διά na may accusative ay nagsasaad ng sanhi o dahilan. Iniiwang bukas ng “dahil sa” kung ito ay tumutukoy sa pagpapahayag, katapatan, o pag-uusig na may kaugnayan sa salita ng Diyos.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: sa patotoo ni Jesus
  rationale: Ang genitive na Ἰησοῦ ay maaaring tumukoy sa patotoong ibinigay ni Jesus o sa patotoo tungkol sa kanya. Pinananatili ng “patotoo ni Jesus” ang pormal na posibilidad ng unang pagbasa, habang inilalahad sa talababa ang tunay na alternatibo.
- source_word: ἀδελφὸς ὑμῶν
  choice: inyong kapatid
  rationale: Direkta at natural nitong ipinahahayag ang pakikiisa ni Juan sa mga mambabasa bilang isang kapatid.
theological_decisions:
- issue: Kalabuan ng genitive sa μαρτυρίαν Ἰησοῦ
  choice: Isinalin sa pangunahing teksto bilang “patotoo ni Jesus.”
  alternative: “patotoo tungkol kay Jesus”
  rationale: Tunay na hindi tiyak sa Griyego kung si Jesus ang nagbibigay ng patotoo o siya ang paksa nito. Hindi tahimik na nilulutas ng pangunahing teksto ang usaping ito; inilalahad ang ikalawang posibilidad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pulo” at “patotoo” bilang karaniwan at angkop na mga terminong biblikal. Hinati sa dalawang pangungusap upang maging malinaw at natural sa Tagalog nang hindi binabago ang ugnayan ng mga kaisipan.
