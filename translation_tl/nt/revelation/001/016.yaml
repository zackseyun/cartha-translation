id: REV.1.16
reference: Revelation 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: tl
  text: Hawak niya sa kanyang kanang kamay ang pitong bituin, at mula sa kanyang bibig ay lumalabas ang isang matalas na tabak na magkabila ang talim[a]. Ang kanyang anyo ay gaya ng araw na nagniningning sa kasidhian nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang matalas na tabak na may talim sa magkabilang panig.”
    reason: lexical_alternative
  - marker: b
    text: O “nagniningning nang buong lakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: Hawak niya
  rationale: Ginawang likas na sugnay sa Filipino ang participle habang pinananatili ang patuloy na paglalarawan sa pangitain.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: sa kanyang kanang kamay
  rationale: Malinaw na isinasama ang χείρ (“kamay”) at likas sa Filipino ang ayos ng parirala.
- source_word: ἀστέρας ἑπτά
  choice: ang pitong bituin
  rationale: Tuwirang salin sa likas na ayos ng Filipino.
- source_word: ῥομφαία
  choice: tabak
  rationale: Ang salita ay maaaring tumukoy sa isang malaking espada, ngunit ang “tabak” ay malinaw, marangal, at hindi labis na nagtatakda ng tiyak na uri ng sandata.
- source_word: δίστομος ὀξεῖα
  choice: matalas na tabak na magkabila ang talim
  rationale: Isinasalin ang literal na larawang “dalawang-bibig” bilang karaniwang paglalarawan sa sandatang may talim sa magkabilang panig, habang pinananatili rin ang hiwalay na diwa ng ὀξεῖα (“matalas”).
- source_word: ἐκπορευομένη
  choice: lumalabas
  rationale: Pinananatili ng pangkasalukuyang anyo ang dinamikong larawan ng tabak na nagmumula sa bibig.
- source_word: ἡ ὄψις αὐτοῦ
  choice: ang kanyang anyo
  rationale: Hindi nililimitahan ang ὄψις sa mukha lamang; tumutukoy ito sa nakikitang anyo o hitsura.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: gaya ng araw na nagniningning
  rationale: Likas na paghahambing sa Filipino na nagpapanatili sa patuloy na ningning ng araw.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: sa kasidhian nito
  rationale: Sa konteksto ng araw, ipinahahayag ng δύναμις ang tindi o lakas ng ningning. Ang “kasidhian” ay likas at hindi nagdaragdag ng “buo,” na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Kahulugan ng tabak na lumalabas sa bibig
  choice: Pinanatili ang simbolikong larawan nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin ito bilang salita ni Cristo o bilang sagisag ng kanyang paghatol.
  rationale: Inilalahad ng talata ang larawang apokaliptiko ngunit hindi nito tahasang ipinaliliwanag dito ang sagisag; hindi dapat ipasok ng salin ang isang interpretasyon sa mismong teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tabak” para sa malinaw na biblikal na larawan, “anyo” upang hindi paliitin ang kahulugan sa mukha, at “kasidhian” upang natural na ipahayag ang lakas ng sikat ng araw. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat alternatibo.
source_grounding:
  english_pob_role: consult_only
