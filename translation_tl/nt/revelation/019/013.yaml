  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: tl
  text: At nakasuot siya ng balabal na inilubog sa dugo,[a] at ang pangalan niya ay Salita ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nabahiran ng dugo.” Mas literal, ang pandiwang Griyego ay nangangahulugang “inilubog” o “isinawsaw.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: nakasuot siya ng
  rationale: Ipinahahayag ng perpektong participle ang kasalukuyang kalagayan niya; natural sa modernong Tagalog ang “nakasuot” at hindi nito ginagawang simpleng kilos lamang ang paglalarawan.
- source_word: ἱμάτιον
  choice: balabal
  rationale: Tumutukoy ang ἱμάτιον sa panlabas na kasuotan. Ang “balabal” ay angkop sa marangal at makaharing tagpo nang hindi labis na nililimitahan ang anyo ng kasuotan.
- source_word: βεβαμμένον αἵματι
  choice: inilubog sa dugo
  rationale: Ang βάπτω ay pangunahing nangangahulugang ilubog o isawsaw. Pinananatili ng “inilubog sa dugo” ang matingkad na larawan at ang instrumental o locative na ugnayan ng αἵματι; inilalagay sa talababa ang posibleng resultang diwang “namantsahan ng dugo.”
- source_word: κέκληται
  choice: tinatawag na
  rationale: Ang perpektong pasibo ng καλέω ay tumutukoy sa pangalang itinawag at nananatiling taglay niya. Ang “tinatawag na” ay natural at malapit sa anyong pasibo ng Griyego.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang pangalan niya
  rationale: Ito ang natural na modernong Tagalog para sa Griyegong konstruksiyong paari.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Salita ng Diyos
  rationale: Personal na titulo ng nakasakay ang λόγος sa kontekstong ito, hindi lamang mensahe o pananalita. Ang malaking titik sa “Salita” ay nagpapakitang titulo ito nang hindi nagdaragdag ng paliwanag sa talata.
theological_decisions:
- issue: Ang kristolohikal na titulong ὁ Λόγος τοῦ Θεοῦ
  choice: Salita ng Diyos
  alternative: Mensahe ng Diyos
  rationale: Inilalahad ang parirala bilang personal na pangalan o titulo ng nakasakay. Pinananatili ng “Salita ng Diyos” ang bigat at posibleng ugnay nito sa paggamit ng λόγος sa mga sulating Juaniko, samantalang ang “Mensahe ng Diyos” ay maaaring magmukhang di-personal na pahayag lamang.
- issue: Pinagmulan o kahulugan ng dugong nasa balabal
  choice: Hindi tinukoy kung kaninong dugo ito
  alternative: Tukuyin ito bilang dugo ng mga kaaway o bilang sariling dugo ni Cristo
  rationale: Hindi sinasabi ng mismong talata kung kaninong dugo ang tinutukoy. Pinananatili ng salin ang sadyang puwang na ito at hindi nagpapasok ng isang interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “balabal” para sa panlabas na kasuotan at pinanatili ang bahagyang pormal na “tinatawag na” upang maipakita ang pasibong anyo at ang diwa ng isang opisyal na titulo. Ang panandang [a] ay nasa pangunahing teksto.
