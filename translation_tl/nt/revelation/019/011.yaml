id: REV.19.11
reference: Revelation 19:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: tl
  text: At nakita ko ang langit na nakabukas, at narito, isang kabayong puti! Ang nakasakay rito ay tinatawag na Tapat at Totoo. Sa katuwiran siya humahatol at nakikipagdigma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa katarungan siya humahatol at nakikipagdigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: na nakabukas
  rationale: Ipinahihiwatig ng perpektong pasibong pandiwaring ito na ang langit ay nabuksan at nananatiling bukas; likas sa Filipino ang “na nakabukas” para sa resultang kalagayang iyon.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang bigla at matingkad na paghaharap ng pangitain nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: ἵππος λευκός
  choice: isang kabayong puti
  rationale: Tuwirang salin ng pariralang nominal at natural ang ayos ng pang-uri sa Filipino.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: ang nakasakay rito
  rationale: Ang “nakasakay” ay likas na katumbas sa konteksto ng kabayo, samantalang hindi nito ipinapasok ang mas tiyak na katawagang “mangangabayo.” Ginamit ang “rito” upang malinaw na tumukoy sa kabayong kababanggit lamang.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: ay tinatawag na Tapat at Totoo
  rationale: Ipinapakita ng καλούμενος na ang dalawang salita ay mga katawagang ibinibigay sa nakasakay. Ang malaking titik ay naghahayag ng gamit na pantawag o pamagat.
- source_word: πιστός
  choice: Tapat
  rationale: Pinananatili ng “Tapat” ang diwa ng pagiging maaasahan at matibay sa katapatan, at natural itong kaagapay ng “Totoo.”
- source_word: ἀληθινός
  choice: Totoo
  rationale: Ang “Totoo” ay payak at likas na katumbas na maaaring mangahulugang tunay at mapagkakatiwalaan sa kontekstong ito.
- source_word: ἐν δικαιοσύνῃ
  choice: nang may katuwiran
  rationale: Ipinahahayag nito ang paraan o batayang moral ng paghatol at pakikidigma. Pinananatili ng “katuwiran” ang mas malawak na saklaw ng δικαιοσύνη; inilagay sa talababa ang kontekstuwal na alternatibong “katarungan.”
- source_word: κρίνει
  choice: humahatol siya
  rationale: Tuwirang isinasalin ang pangkasalukuyang pandiwa at hindi nagdaragdag ng pang-abay na nasa pariralang ἐν δικαιοσύνῃ na.
- source_word: πολεμεῖ
  choice: nakikipagdigma
  rationale: Likas at marangal itong salin na nagpapanatili sa tuwirang puwersang militar ng pandiwa.
theological_decisions:
- issue: Pagkakakilanlan at paglalahad sa mga katawagan sa nakasakay
  choice: Isinalin ang πιστός at ἀληθινός bilang mga katawagang “Tapat at Totoo.”
  alternative: 'Maaaring ituring ang mga ito bilang karaniwang naglalarawang pang-uri: “tapat at totoo.”'
  rationale: Sa agarang konteksto ng Pahayag, may anyong pantawag ang mga salita dahil sa καλούμενος. Ipinahihiwatig ng malaking titik ang gamit na ito nang hindi tuwirang nagdaragdag ng pagkakakilanlang hindi binanggit sa talata.
- issue: Saklaw ng δικαιοσύνη
  choice: Ginamit sa pangunahing teksto ang “katuwiran.”
  alternative: “katarungan”
  rationale: Maaaring tumukoy ang δικαιοσύνη kapwa sa moral na katuwiran at sa makatarungang paghatol. Pinananatili ng pangunahing salin ang mas malawak na kahulugan, habang inihaharap sa talababa ang kontekstuwal na alternatibo upang hindi alisin ang tensiyong leksikal.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang matingkad na himig ng pangitain sa “narito” at ang pag-uulit ng mahahalagang kilos, ngunit hinati sa maiikling pangungusap upang maging likas at malinaw sa karaniwang mambabasa. Inilipat ang panandang [a] sa tabi ng pariralang tinutukoy nito, sapagkat ang talababa ay tungkol sa δικαιοσύνη, hindi sa pagbubukas ng langit.
