  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: tl
  text: At narinig ko ang tila tinig ng napakaraming tao, gaya ng tinig ng lagaslas ng maraming tubig at gaya ng tinig ng dagundong ng malalakas na kulog, na nagsasabi, “Aleluya! Sapagkat naghahari ang Panginoon, ang Diyos, ang Makapangyarihan sa lahat.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na kababasahan ng “ang Panginoon nating Diyos, ang Makapangyarihan sa lahat.” Ang pandiwang isinaling “naghahari” ay maaari ring unawain bilang pagdiriwang sa tiyak na pagpapakita ng paghahari ng Diyos—“nagpasimulang maghari” o “naging Hari.”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Tuwirang salin ng aorist na ἀκούω sa pagkakasunod-sunod ng salaysay.
- source_word: ὡς φωνὴν
  choice: ang waring tinig … gaya ng
  rationale: Pinananatili ng “waring” at “gaya ng” ang paghahambing at pangitaing katangian ng paulit-ulit na ὡς, sa halip na ipakitang ganap na magkapareho ang mga tunog.
- source_word: ὄχλου πολλοῦ
  choice: napakaraming tao
  rationale: Likas at malinaw na modernong Tagalog para sa isang napakalaking kalipunan, nang hindi nawawala ang maringal na tono.
- source_word: ὑδάτων πολλῶν
  choice: lagaslas ng napakaraming tubig
  rationale: Ginagawang malinaw sa Tagalog na tunog ang pinaghahambingan, habang pinananatili ang biblikal na larawan ng “maraming tubig.”
- source_word: βροντῶν ἰσχυρῶν
  choice: dagundong ng malalakas na kulog
  rationale: Ipinahahayag ang lakas ng ἰσχυρῶν at ang napakalakas na tunog ng mga kulog sa natural na Tagalog.
- source_word: λεγόντων
  choice: Sinasabi nila
  rationale: Ang panlalaking pangmaramihang participle ay tumutukoy sa napakaraming tao; nililinaw ng tahasang panghalip ang tagapagsalita sa Tagalog.
- source_word: Ἁλληλουϊά
  choice: Aleluya
  rationale: Karaniwang anyong liturhikal at transliterasyon sa Filipino ng Griyegong Ἁλληλουϊά.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagpupuri at nababagay sa maringal na pahayag.
- source_word: ἐβασίλευσεν
  choice: naghahari
  rationale: Natural na ipinagdiriwang sa Tagalog ang aktuwal at matagumpay na paghahari ng Diyos; hindi nito ipinipilit ang mas tiyak na inceptive na “nagsimulang maghari,” bagaman maaari ring maunawaan ang aorist bilang pagtukoy sa tiyak na pagpapakita ng paghahari.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: ang Panginoong Diyos, ang Makapangyarihan sa lahat
  rationale: Pinananatili ang tatlong banal na katawagan ng nakalimbag na Griyego sa natural at maringal na Tagalog, nang hindi idinaragdag ang “natin” na wala sa ibinigay na SBLGNT text.
theological_decisions:
- issue: Pahiwatig ng aorist na ἐβασίλευσεν sa paghahari ng Diyos
  choice: naghahari
  alternative: nagpasimulang maghari / naghari / naging Hari
  rationale: Ang “naghahari” ay natural na pahayag ng matagumpay na paghahari sa eksenang ito at hindi nagpapakahulugang noon lamang nagsimula ang soberanya ng Diyos. Ang posibleng diwang tiyak na pagpapakita o pagsisimula ng hayag na paghahari ay hindi ginawang obligadong interpretasyon sa pangunahing teksto.
- issue: Pagkakaroon ng possessive sa banal na katawagan
  choice: ang Panginoong Diyos, ang Makapangyarihan sa lahat
  alternative: ang Panginoon nating Diyos, ang Makapangyarihan sa lahat
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT, na walang ἡμῶν (“natin”). Hindi inangkat sa pangunahing salin ang possessive mula sa ibang tekstuwal na tradisyon.
translation_notes:
  register: Modernong Filipino Tagalog na maringal ngunit madaling maunawaan. Ginamit ang “lagaslas” at “dagundong” upang maging buhay at natural ang paghahambing sa tunog, habang pinanatili ang apokaliptikong pag-uulit at liturhikal na “Aleluya.”
