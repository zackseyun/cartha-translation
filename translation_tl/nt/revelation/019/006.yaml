revisions:
- from: At narinig ko ang waring tinig ng napakaraming tao, gaya ng lagaslas ng napakaraming tubig at gaya ng dagundong ng malalakas na kulog. Sinasabi nila, “Aleluya! Sapagkat naghahari ang Panginoong Diyos, ang Makapangyarihan sa lahat.[a]”
  to: At narinig ko ang tila tinig ng napakaraming tao, gaya ng tinig ng lagaslas ng maraming tubig at gaya ng tinig ng dagundong ng malalakas na kulog, na nagsasabi, “Aleluya! Sapagkat naghahari ang Panginoon, ang Diyos, ang Makapangyarihan sa lahat.[a]”
  rationale: The revision preserves the draft’s sound imagery and restrained rendering of ἐβασίλευσεν, while restoring the source’s repeated comparison structure, maintaining the participial connection to the acclamation, and representing the three Greek divine titles distinctly. The footnote remains appropriately anchored to the divine-title/verb clause and preserves both the textual variant and lexical alternatives without imposing an interpretation.
