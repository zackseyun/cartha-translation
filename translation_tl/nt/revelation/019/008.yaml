id: REV.19.8
reference: Revelation 19:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: tl
  text: At ipinagkaloob sa kanya na damtan ang sarili ng pinong lino, maningning at malinis, sapagkat ang pinong lino ay ang matutuwid na gawa[a] ng mga banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga matuwid na pagkilos.” Sa ibang konteksto, ang salitang Griyego ay maaari ring mangahulugang “mga matuwid na tuntunin,” ngunit dito ay pinakamalamang na tumutukoy ito sa matutuwid na gawa ng mga banal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: ipinagkaloob sa kanya
  rationale: Pinananatili nito ang balintiyak na anyo at hindi tahasang tinutukoy kung sino ang nagkaloob, gaya ng tekstong Griyego. Ang “ipinagkaloob” ay likas sa Filipino at naihahatid ang diwa ng isang bagay na ibinigay bilang pahintulot o kaloob.
- source_word: ἵνα περιβάληται
  choice: na damtan ang sarili
  rationale: Ipinakikita ng gitnang tinig ng pandiwa na ang babae mismo ang nagdadamit sa sarili. Iniiwasan ng saling ito ang pagbasa na basta lamang siyang dinamitan ng iba.
- source_word: βύσσινον
  choice: pinong lino
  rationale: Ang βύσσινον ay mamahalin at pinong telang lino. Ang “pinong lino” ay malinaw, maikli, at angkop sa maringal na larawan ng talata.
- source_word: λαμπρὸν καθαρόν
  choice: maningning at malinis
  rationale: Ang “maningning” ay naghahatid ng maliwanag o makinang na anyo ng tela, samantalang ang “malinis” ay nagpapanatili sa kongkretong paglalarawan bago ipaliwanag ang simbolikong kahulugan nito.
- source_word: τὰ δικαιώματα
  choice: ang matutuwid na gawa
  rationale: Sa kontekstong ito, ang pangmaramihang δικαιώματα ay pinakamalamang na tumutukoy sa matutuwid na gawa o pagkilos. Pinananatili ng talababa ang iba pang posibleng leksikal na kahulugan nang hindi pinapawi ang likas na pagbasa rito.
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Ang “mga banal” ay maikli at kinikilalang katawagan sa Bagong Tipan para sa sambayanang itinalaga sa Diyos, nang hindi nagdaragdag ng paliwanag na wala sa mismong parirala.
theological_decisions:
- issue: Kaugnayan ng ipinagkaloob na kasuutan at ng matutuwid na gawa ng mga banal
  choice: Ang pinong lino ay sumasagisag sa matutuwid na gawa ng mga banal, ngunit ipinagkaloob din sa babae ang pagkakataong damtan ang sarili nito.
  alternative: Ipaliwanag ang lino bilang matuwid na katayuan lamang, o bilang mga utos na dapat sundin ng mga banal.
  rationale: 'Magkatabing pinananatili ng talata ang dalawang ideya: ipinagkaloob ang kasuutan, at ang kasuutan ay ang matutuwid na gawa ng mga banal. Hindi nilulutas ng salin ang tensiyon sa pagitan ng banal na kaloob at ng matuwid na pagkilos ng mga banal.'
- issue: Hindi binanggit na tagapagkaloob sa ἐδόθη
  choice: Panatilihin ang balintiyak na “ipinagkaloob sa kanya.”
  alternative: “Ipinagkaloob ito ng Diyos sa kanya.”
  rationale: Bagaman malamang na Diyos ang ipinahihiwatig na tagapagkaloob, hindi siya tahasang pinangalanan sa Griyego. Hindi siya idinaragdag ng salin bilang hayag na simuno.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “damtan ang sarili” ay bahagyang pormal ngunit natural sa apokaliptikong larawan at malinaw na naipapakita ang reflexive na diwa. Iniwasan ang tahasang pagbanggit sa Diyos bilang tagapagkaloob at ang pagpapakahulugang denominasyonal sa “mga banal.”
