  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: tl
  text: Magalak tayo at magsaya nang lubos, at magbigay tayo ng kaluwalhatian sa kanya[a], sapagkat dumating na ang kasal ng Kordero, at inihanda na ng kanyang nobya[b] ang kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at magbibigay tayo ng kaluwalhatian sa kanya.” Nasa anyong panghinaharap ang pandiwang Griyego, bagaman malamang na ginagamit ito rito bilang panawagan, kaagapay ng “magalak tayo” at “magsaya nang lubos.”
    reason: alternative_reading
  - marker: b
    text: O, “asawa.” Ang salitang Griyego na γυνή ay maaaring mangahulugang “babae,” “asawa,” o, sa konteksto ng kasal, “nobya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: Magalak tayo
  rationale: Ang unang panauhang maramihang present subjunctive ay ginagamit bilang panawagan; natural itong ipinahahayag sa Tagalog sa anyong “Magalak tayo.”
- source_word: ἀγαλλιῶμεν
  choice: magsaya nang lubos
  rationale: Pinananatili nito ang masidhi at masiglang diwa ng pandiwa at ang pagkakaiba nito sa naunang χαίρωμεν.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: magbigay tayo ng kaluwalhatian sa kanya
  rationale: Bagaman future indicative ang anyong Griyego, malamang na may puwersang panawagan ito sa hanay ng mga hortatoryong pandiwa; pinananatili rin ng salin ang idyomang “magbigay ng kaluwalhatian.”
- source_word: ἦλθεν
  choice: dumating na
  rationale: Ipinahahayag ng “na” ang pagdating bilang naganap na pangyayaring may kasalukuyang kabuluhan sa pangitain.
- source_word: γάμος
  choice: kasal
  rationale: Ang γάμος ay maaaring tumukoy sa kasal, pag-aasawa, o piging ng kasal. Ang “kasal” ang natural at sapat na tiyak dito, nang hindi pa ipinapasok ang piging na tahasang binabanggit sa kasunod na talata.
- source_word: ἀρνίου
  choice: Kordero
  rationale: Ito ang kinikilalang salin ng titulong Cristolohikal sa Apocalipsis at pinananatili ang larawan ng orihinal.
- source_word: γυνὴ αὐτοῦ
  choice: kanyang nobya
  rationale: Maaaring mangahulugan ang γυνή na babae, asawa, o nobya. Sa konteksto ng nalalapit na kasal at paghahanda, “nobya” ang pinakanatural at kontekstuwal na salin.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: inihanda na ... ang kanyang sarili
  rationale: Pinananatili nito ang tahasang reflexive na diwa ng Griyego at ang larawan ng sariling paghahanda ng nobya.
theological_decisions:
- issue: Pagpapakahulugan sa γυνὴ αὐτοῦ sa larawan ng kasal
  choice: kanyang nobya
  alternative: kanyang asawa
  rationale: Itinatampok ng tagpo ang paghahanda para sa kasal, kaya “nobya” ang higit na angkop; gayunman, tunay na leksikal na posibilidad ang “asawa” at pinananatili ito sa talababa.
- issue: Puwersa ng δώσομεν sa sunod-sunod na panawagan
  choice: magbigay tayo ng kaluwalhatian sa kanya
  alternative: magbibigay tayo ng kaluwalhatian sa kanya
  rationale: Ang pagkakasunod ng χαίρωμεν, ἀγαλλιῶμεν, at δώσομεν ay pinakamalinaw na nauunawaan bilang iisang panawagan sa pagpupuri, ngunit pinananatili sa talababa ang literal na hinaharap na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magsaya nang lubos” upang mapanatili ang masidhing antas ng ikalawang pandiwa nang hindi nagiging lipas o labis na pampanitikan. Ang mga panandang talababa ay inilagay sa mismong pariralang tinutukoy ng bawat alternatibo.
