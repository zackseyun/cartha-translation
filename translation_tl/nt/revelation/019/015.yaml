revisions:
- from: At mula sa kanyang bibig ay lumalabas ang isang matalas na tabak, upang sa pamamagitan nito ay hampasin niya ang mga bansa. Siya mismo ang magpapastol sa kanila sa pamamagitan ng tungkod na bakal[a]; at siya mismo ang yumuyurak sa pisaan ng ubas na kumakatawan sa alak ng matinding poot ng Diyos na Makapangyarihan sa Lahat.[b]
  to: At mula sa kanyang bibig ay lumalabas ang isang matalas na tabak, upang sa pamamagitan nito ay hampasin niya ang mga bansa; siya mismo ang magpapastol sa kanila sa pamamagitan ng tungkod na bakal[a]; at siya mismo ang yumuyurak sa pisaan ng alak ng matinding poot at galit ng Diyos na Makapangyarihan sa Lahat.[b]
  rationale: Inalis ang interpretibong “na kumakatawan sa” at ginawang tuwiran ang larawan ng pisaan ng alak. Isinama sa pangunahing teksto ang kapwa diwa ng θυμός at ὀργή bilang “matinding poot at galit,” nang hindi ipinipilit ang di-likas na magkakapatong na genitibo sa Tagalog. Pinanatili ang mga talinghaga, pandiwang pangkasalukuyan, at mga talababa sa angkop na mga angkla.
