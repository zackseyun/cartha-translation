id: REV.19.15
reference: Revelation 19:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: tl
  text: At mula sa kanyang bibig ay lumalabas ang isang matalas na tabak, upang sa pamamagitan nito ay hampasin niya ang mga bansa; siya mismo ang magpapastol sa kanila sa pamamagitan ng tungkod na bakal[a]; at siya mismo ang yumuyurak sa pisaan ng alak ng matinding poot at galit ng Diyos na Makapangyarihan sa Lahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamamahala sa kanila sa pamamagitan ng tungkod na bakal.” Literal na nangangahulugang “magpapastol” ang pandiwang Griyego, na umaalingawngaw sa Awit 2 habang pinananatili ang larawan ng isang pastol.
    reason: alternative_reading
  - marker: b
    text: Literal, “ang pisaan ng alak ng silakbo ng galit ng poot ng Diyos.” Gumagamit ang Griyego ng dalawang magkalapit na salita para sa galit upang patindihin ang larawan ng paghatol.
    reason: source_text_clarification
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: lumalabas
  rationale: Pinananatili ang buhay na pangkasalukuyang larawan ng isang bagay na lumalabas mula sa bibig.
- source_word: ῥομφαία ὀξεῖα
  choice: isang matalas na tabak
  rationale: Ang “tabak” ay malinaw at likas sa Tagalog; hindi na tinukoy ang espesipikong uri ng malaking espada upang maiwasan ang labis na pagpapakahulugan.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: upang sa pamamagitan nito ay hampasin niya
  rationale: Ipinahahayag ng “upang” ang layunin, at ng “sa pamamagitan nito” ang gamit ng tabak; ang “hampasin” ay hindi nagdaragdag ng di-tiyak na diwang “ibagsak.”
- source_word: τὰ ἔθνη
  choice: ang mga bansa
  rationale: Tumutukoy sa mga bansa bilang kabuuan, hindi lamang sa mga Hentil bilang kaibahan sa mga Judio.
- source_word: ποιμανεῖ
  choice: magpapastol
  rationale: Pinananatili ang literal na metapora ng pagpapastol at ang tensiyon sa pagitan ng pastoral at maharlikang paghatol.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: sa pamamagitan ng tungkod na bakal
  rationale: Malinaw na ipinakikita ang instrumental na gamit ng tungkod habang pinananatili ang matigas at makaharing larawan.
- source_word: πατεῖ
  choice: yumuyurak
  rationale: Natural na inilalarawan sa Tagalog ang pagpisa sa mga ubas sa pisaan at pinananatili ang marahas na larawan ng paghatol.
- source_word: τὴν ληνὸν
  choice: ang pisaan ng ubas
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal o hindi pamilyar na katawagan para sa winepress.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: alak ng matinding poot
  rationale: Natural sa Tagalog at pinananatili ang pinatinding diwa ng magkapatong na θυμός at ὀργή, bagaman hindi kayang ulitin nang elegante ang dalawang halos magkasingkahulugang pangngalan.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: ng Diyos na Makapangyarihan sa Lahat
  rationale: Karaniwan, malinaw, at marangal na salin ng banal na titulong παντοκράτωρ.
theological_decisions:
- issue: Ang ποιμανεῖ sa alusyon sa Awit 2 at sa konteksto ng paghatol
  choice: magpapastol sa kanila
  alternative: mamamahala sa kanila
  rationale: Ang Griyegong pandiwa ay literal na “magpastol,” ngunit may diwa rin ng maharlikang pamamahala sa kontekstong ito. Pinananatili sa teksto ang pastoral na metapora at inilalagay sa talababa ang alternatibo.
- issue: Ang pinagsamang θυμοῦ τῆς ὀργῆς
  choice: matinding poot
  alternative: nagngangalit na galit ng poot
  rationale: Ipinahahayag ng natural na pariralang Tagalog ang tindi ng dalawang magkalapit na terminong Griyego; ipinapaliwanag sa talababa na kapwa ginamit ang mga ito sa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kanyang” at “niya” sa karaniwang modernong anyo; iniwasan ang masyadong arkaikong bokabularyo. Ipinaliwanag ang metaporikal na ugnayan ng pisaan at alak sa pangunahing teksto upang maging malinaw ang sunod-sunod na genitibo, habang inilagay sa talababa ang mas literal na estruktura.
