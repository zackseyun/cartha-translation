id: REV.19.2
reference: Revelation 19:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: tl
  text: sapagkat tunay at makatarungan ang kanyang mga paghatol; sapagkat hinatulan niya ang dakilang babaeng bayaran na nagpasama sa daigdig sa pamamagitan ng kanyang seksuwal na imoralidad, at ipinaghiganti niya laban sa kanya ang dugo ng kanyang mga alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod.” Ang salitang Griego na doulos ay maaaring tumukoy sa alipin o lingkod; ginamit dito ang “alipin” upang mapanatili ang mas matinding diwa ng pagiging pag-aari ng isang panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: tunay at makatarungan
  rationale: Likas at malinaw na pares sa modernong Tagalog; pinananatili ang pagiging totoo at matuwid ng mga pasiya ng Diyos.
- source_word: κρίσεις
  choice: mga paghatol
  rationale: Pinananatili ang hudisyal at eskatolohikal na diwa ng pangmaramihang ουσιαστικό.
- source_word: ἔκρινεν
  choice: hinatulan
  rationale: Sa konteksto, ang paghatol ay laban sa dakilang πόρνη; mas natural sa Tagalog kaysa sa payak na 'humatol sa' at hindi nangangailangan ng aspektong present perfect.
- source_word: πόρνην τὴν μεγάλην
  choice: ang dakilang babaeng bayaran
  rationale: Tumpak, moderno, at marangal na katumbas ng πόρνη na nananatiling malinaw ang talinghaga nang hindi gumagamit ng lipas o labis na magaspang na salita.
- source_word: ἔφθειρεν
  choice: nagpasama
  rationale: Ipinahahayag ang moral at espirituwal na pagpapasamâ na dulot ng kanyang πορνεία, habang hindi nililimitahan ang pandiwa sa pisikal na pagwasak.
- source_word: τὴν γῆν
  choice: sa daigdig
  rationale: Ang kosmikong saklaw ng Pahayag ay mas malinaw sa 'daigdig' kaysa sa lokalisadong 'lupain.'
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: sa pamamagitan ng kanyang seksuwal na imoralidad
  rationale: Ipinakikita ang paraan o kasangkapan ng pagpapasamâ at pinananatili ang literal na seksuwal na kahulugan nang hindi isinasara ang metaporikal na puwersa nito.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: ipinaghiganti niya ... ang dugong dumanak
  rationale: Ang pandiwa ay tumutukoy sa makatarungang paghihiganti para sa pinaslang; ang 'dugong dumanak' ay natural na Tagalog at nililinaw na ang dugo ay kumakatawan sa buhay na kinitil.
- source_word: τῶν δούλων αὐτοῦ
  choice: ng kanyang mga alipin
  rationale: Pinananatili ang masidhing diwa ng δοῦλος bilang mga taong pag-aari at lubos na nakatalaga sa panginoon; inilalagay sa talababa ang mas banayad na alternatibo.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: sa babae
  rationale: Sa idyomang ito, ang ἐκ χειρός ay nagpapakilala sa salarin na pinananagot. Ang natural na Tagalog na 'ipinaghiganti ... sa babae' ay naghahatid nito nang hindi lumilikha ng malabong literalismong 'mula sa kanyang kamay.'
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλοι bilang kaugnayan ng bayan ng Diyos sa kanya
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang 'mga alipin' ang higit na nagpapanatili sa diwa ng ganap na pag-aari at katapatan sa Diyos sa tekstong apokaliptiko. Dahil may mabigat na makabagong konotasyon ang salita, ibinibigay ang 'mga lingkod' bilang lehitimong alternatibo sa talababa.
- issue: Saklaw ng πορνεία
  choice: seksuwal na imoralidad
  alternative: pakikiapid / prostitusyon
  rationale: Pinananatili ang leksikal na seksuwal na puwersa at hinahayaang manatili ang mas malawak na talinghaga ng pagsamba sa diyus-diyosan at pagtataksil nang hindi ito ipinapasok bilang tahasang paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'babaeng bayaran' sa halip na lipas na 'patutot' o mas magaspang na katawagan. Inayos ang ἐκ χειρὸς αὐτῆς ayon sa natural na idyomang Tagalog, at iniwasang gawing sobrang literal ang 'mula sa kanyang kamay.'
