  to: sapagkat tunay at makatarungan ang kanyang mga paghatol; sapagkat hinatulan niya ang dakilang babaeng bayaran na nagpasama sa daigdig sa pamamagitan ng kanyang seksuwal na imoralidad, at ipinaghiganti niya laban sa kanya ang dugo ng kanyang mga alipin.[a]
