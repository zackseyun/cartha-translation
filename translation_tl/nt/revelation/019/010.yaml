  to: At nagpatirapa ako sa harap ng kanyang mga paa upang sambahin siya. Ngunit sinabi niya sa akin, “Huwag mong gawin iyan! Ako'y kapwa mong alipin[c], kasama ng iyong mga kapatid[b] na nanghahawak sa patotoo ni Jesus.[a] Ang Diyos ang sambahin mo! Sapagkat ang patotoo ni Jesus ang espiritu ng propesiya.”
  rationale: Inayos ang parirala para sa σύνδουλος upang malinaw na ang anghel ay kapwa alipin ni Juan at ng kanyang mga kapatid, hindi dalawang beses na “kapwa alipin” na maaaring magpalabo sa estruktura. Ginawang mas hayag ang “sa harap” upang maipakita ang ἔμπροσθεν. Walang binagong kahulugan o teolohikal na pagpapasya; pinanatili ang kalabuan ng “patotoo ni Jesus.”
