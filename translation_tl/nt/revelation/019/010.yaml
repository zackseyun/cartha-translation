id: REV.19.10
reference: Revelation 19:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: tl
  text: At nagpatirapa ako sa harap ng kanyang mga paa upang sambahin siya. Ngunit sinabi niya sa akin, “Huwag mong gawin iyan! Ako'y kapwa mong alipin[c], kasama ng iyong mga kapatid[b] na nanghahawak sa patotoo ni Jesus.[a] Ang Diyos ang sambahin mo! Sapagkat ang patotoo ni Jesus ang espiritu ng propesiya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patotoo tungkol kay Jesus” o “sariling patotoo ni Jesus.” Ang pariralang Griyego ay maaaring tumukoy sa patotoo tungkol kay Jesus o sa patotoong nagmumula mismo kay Jesus. Gayundin ang kalabuan sa huling pangungusap.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga kapatid na lalaki at babae”; ang “mga kapatid” ay maaaring kumatawan sa lahat ng kapwa mananampalataya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kapwa lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: nagpatirapa ako sa paanan niya
  rationale: Ang “nagpatirapa sa paanan” ay likas na idyomang Filipino na malinaw na naghahayag ng pisikal na pagpapatirapa sa harap ng kanyang mga paa.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: upang sambahin siya / Ang Diyos ang sambahin mo
  rationale: Sa konteksto, tinanggihan ng anghel ang kilos at itinuro ito sa Diyos; kaya ang “sambahin” ang pinakatumpak sa relihiyosong puwersa ng προσκυνέω.
- source_word: Ὅρα μή
  choice: Huwag mong gawin iyan!
  rationale: Isinasalin nito bilang biglaan at mariing pagbabawal ang maikling pahayag sa Griyego, sa natural na modernong Filipino.
- source_word: σύνδουλος
  choice: kapwa alipin
  rationale: Binibigyang-diin ng salita ang magkapantay na kalagayan nila bilang mga nasa ilalim ng kapangyarihan ng Diyos, hindi lamang ang magkasamang paglilingkod.
- source_word: ἀδελφῶν σου
  choice: iyong mga kapatid
  rationale: Pinananatili ang tuwirang salitang “mga kapatid”; ayon sa konteksto, maaari itong kumatawan sa lahat ng kapwa mananampalataya.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: na nanghahawak sa patotoo ni Jesus
  rationale: Ang “nanghahawak” ay nagpapahayag ng aktuwal na pagtataglay at matapat na pag-iingat nang hindi nilulutas ang malabong ugnayan ng Ἰησοῦ sa “patotoo.”
- source_word: μαρτυρία Ἰησοῦ
  choice: patotoo ni Jesus
  rationale: Pinananatili ng parirala at ng talababa ang posibilidad na ito ay patotoo tungkol kay Jesus o patotoong nagmumula kay Jesus.
- source_word: πνεῦμα τῆς προφητείας
  choice: espiritu ng propesiya
  rationale: Hindi pinapantay sa “diwa” o “pinakabuod” ang teolohikal na mayamang πνεῦμα; pinananatili ang pormal at likas na parirala.
theological_decisions:
- issue: Kahulugan ng genitibong Ἰησοῦ sa “patotoo ni Jesus”
  choice: Panatilihin sa pangunahing teksto ang “patotoo ni Jesus” at ipaliwanag ang dalawang posibleng ugnayan sa talababa.
  alternative: “patotoo tungkol kay Jesus” o “sariling patotoo ni Jesus”
  rationale: Hindi sapilitang nilulutas ng Griyego kung si Jesus ang paksa o ang layon ng patotoo. Dapat panatilihin ang tunay na kalabuan sa dalawang paglitaw ng parirala.
- issue: Pagpapakahulugan sa σύνδουλος
  choice: kapwa alipin
  alternative: kapwa lingkod
  rationale: Ang pagtanggi ng anghel na sambahin siya ay nakabatay sa kanyang kalagayang nasa ilalim din ng Diyos kasama ni Juan at ng ibang mananampalataya. Kaya mahalaga rito ang matibay na diwa ng pagkakailalim na taglay ng δοῦλος.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “nagpatirapa,” “sambahin,” “patotoo,” “espiritu,” at “propesiya” upang mapanatili ang solemne at teolohikal na bigat ng talata. Iniwasan ang denominasyonal na pagpapaliwanag at pinanatili sa talababa ang tunay na kalabuan ng μαρτυρία Ἰησοῦ.
