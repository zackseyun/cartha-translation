  source_fidelity: 'Ang pangunahing diwa ay tumpak: ang pagsamba kay anghel ay mahigpit na tinanggihan, ang anghel ay inilalarawang kapwa alipin, at ang pagsamba ay iniukol sa Diyos. Napananatili rin ang kalabuan ng μαρτυρία Ἰησοῦ. Gayunman, ang “kapwa mo alipin at kapwa alipin ng iyong mga kapatid” ay maaaring magmukhang dalawang magkahiwalay na ugnayan at hindi kasinglinaw ng Griyegong isang “kapwa alipin” na kasama ni Juan at ng kanyang mga kapatid.'
  naturalness: Marangal at modernong Filipino Tagalog ang rehistro. Mas likas at malinaw ang “kapwa mong alipin, kasama ng iyong mga kapatid” kaysa sa inuulit na “kapwa alipin.” Ang “nagpatirapa ako sa harap ng kanyang mga paa” ay nagpapanatili rin ng explicit na ἔμπροσθεν (“sa harap ng/bago”).
  terminology: Ang “sambahin,” “alipin,” “patotoo ni Jesus,” “espiritu,” at “propesiya” ay angkop. Ang “patotoo ni Jesus” ay wastong pinananatiling hindi nilulutas ang posibleng subjective/objective genitive.
