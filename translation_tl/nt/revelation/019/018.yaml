id: REV.19.18
reference: Revelation 19:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: tl
  text: upang kainin ninyo ang laman ng mga hari, ang laman ng mga pinuno ng hukbo, ang laman ng mga makapangyarihan, ang laman ng mga kabayo at ng mga nakasakay sa mga iyon[a], at ang laman ng lahat—kapwa malalaya at mga alipin, maliliit at dakila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga nakaupo sa ibabaw ng mga iyon”; maaari ring “mga mangangabayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: upang kainin ninyo
  rationale: Pinananatili ng “upang” ang layunin o bungang ipinahihiwatig ng ἵνα kasama ng pandiwang nasa subjunctive; malinaw rin ang maramihang kausap sa “ninyo.”
- source_word: σάρκας
  choice: ang laman
  rationale: Literal na tumutukoy ang σάρξ sa laman ng mga katawan sa tagpong ito ng paghatol. Ang pag-uulit ng “ang laman” ay nagpapanatili sa mariing retorika ng Griyego.
- source_word: βασιλέων
  choice: ng mga hari
  rationale: Tuwirang katumbas ito ng βασιλεῖς at hindi pinahihina ang tiyak na pagtukoy sa mga hari.
- source_word: χιλιάρχων
  choice: ng mga pinuno ng hukbo
  rationale: Ang χιλίαρχος ay mataas na opisyal o kumandante ng militar. Mas malinaw sa karaniwang mambabasa ang “mga pinuno ng hukbo” kaysa transliterasyon o makalumang titulo.
- source_word: ἰσχυρῶν
  choice: ng mga makapangyarihan
  rationale: Ginagamit dito ang pang-uri bilang pangngalan para sa mga taong malalakas o makapangyarihan; pinananatili ng salin ang malawak na saklaw nito.
- source_word: ἵππων
  choice: ng mga kabayo
  rationale: Literal na mga kabayo ang tinutukoy sa larawan ng labanan.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: ng mga nakasakay sa mga iyon
  rationale: Likas na Tagalog ito para sa mga taong nakaupo sa ibabaw ng mga kabayo. Ang “mga iyon” ay malinaw na tumutukoy sa mga kabayo.
- source_word: πάντων
  choice: ng lahat
  rationale: Binubuod nito ang kabuuan ng mga pangkat na kasunod.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: kapwa malalaya at mga alipin
  rationale: Pinananatili ng “kapwa … at” ang tambalang τε καὶ at ang tahasang pagsalungat ng mga taong malaya at ng mga taong nasa pagkaalipin.
- source_word: μικρῶν καὶ μεγάλων
  choice: maliliit at dakila
  rationale: Pinananatili nito ang tradisyonal at malawak na merismo tungkol sa katayuan o antas, nang hindi ito nililimitahan sa isang tiyak na uri ng ranggo.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa pares ng mga katayuang panlipunan
  choice: mga alipin
  alternative: mga lingkod
  rationale: Dahil tuwirang itinatambal ang δοῦλοι sa mga malalaya, malinaw na pagkaalipin ang katayuang tinutukoy. Maaaring ikubli ng “mga lingkod” ang mahalagang pagsalungat na iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang paulit-ulit na “ang laman” upang maihatid ang matindi at ritmikong talaan sa Griyego, habang ginawang likas sa Tagalog ang mga ugnayang pangungusap.
