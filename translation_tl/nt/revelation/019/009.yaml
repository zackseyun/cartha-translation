id: REV.19.9
reference: Revelation 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: tl
  text: 'At sinabi niya sa akin, “Isulat mo: Mapapalad ang mga inanyayahan[a] sa hapunan sa kasal ng Kordero.” At sinabi niya sa akin, “Ang mga salitang ito ng Diyos ay tunay[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinawag.”
    reason: lexical_alternative
  - marker: b
    text: O “mapagkakatiwalaan”; pinagtitibay ng parirala na totoo at maaasahan ang mga salitang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: Isulat mo
  rationale: Tuwirang pautos na isahan; likas sa Filipino at hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: Μακάριοι
  choice: Mapapalad
  rationale: Karaniwang marangal na pananalita sa mga pagpapahayag ng pagpapala; higit nitong pinananatili ang obhetibong mabuting kalagayan kaysa sa mas pansariling “masaya.”
- source_word: οἱ ... κεκλημένοι
  choice: ang mga inanyayahan
  rationale: Ang perfect passive participle ay tumutukoy sa mga taong nasa kalagayang naanyayahan na. Sa konteksto ng handaan, “inanyayahan” ang likas na kahulugan, habang inilalagay sa talababa ang mas literal na “tinawag.”
- source_word: δεῖπνον
  choice: hapunan
  rationale: Tumutukoy ito sa pangunahing kainan, na madalas ay sa gabi; malapit sa anyo ng Griyego at malinaw sa karaniwang mambabasa.
- source_word: γάμου
  choice: kasal
  rationale: Sa pagkakaugnay nito sa hapunan, tumutukoy ito sa pagdiriwang ng kasal; ang “hapunan sa kasal” ay likas na modernong Filipino.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Pinananatili ang mahalagang titulo ni Cristo sa Pahayag at ang simbolikong kaugnayan nito sa hain.
- source_word: Οὗτοι οἱ λόγοι
  choice: Ang mga salitang ito
  rationale: Direktang inililipat ang demonstrative noun phrase sa natural na ayos ng Filipino.
- source_word: ἀληθινοὶ
  choice: tunay
  rationale: Pinananatili ang tuwirang diwa ng katotohanan; maaaring saklawin din ng salita ang pagiging mapagkakatiwalaan, kaya itinatala iyon sa talababa.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang genitive na hindi ipinapasya kung pagmamay-ari, pinagmulan, o kapwa ang binibigyang-diin.
theological_decisions:
- issue: Kahulugan ng κεκλημένοι sa pangwakas-na-panahong handaan
  choice: inanyayahan
  alternative: tinawag
  rationale: Sa konteksto ng isang hapunan, “inanyayahan” ang idiomatikong diwa at hindi ito nagpapasok ng partikular na doktrina tungkol sa bisa ng pagtawag. Pinananatili sa talababa ang mas literal na alternatibo.
- issue: Saklaw ng ἀληθινοὶ
  choice: tunay
  alternative: mapagkakatiwalaan
  rationale: Ang “tunay” ang pinakadirektang salin, ngunit maaari ring idiin ng Griyego na maaasahan ang mga salita. Hindi ipinapalit sa pangunahing teksto ang interpretibong diin.
- issue: Ugnayan ng τοῦ θεοῦ sa “mga salita”
  choice: ng Diyos
  alternative: mula sa Diyos
  rationale: Pinananatili ng “ng Diyos” ang pormal na kaluwagan ng genitive. Ang “mula sa Diyos” ay posibleng pagpapakahulugan sa pinagmulan ngunit mas tiyak kaysa sa anyong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Mapapalad” bilang pamilyar na anyo ng pagpapahayag ng pagpapala at “Kordero” bilang kinikilalang titulong simboliko sa Pahayag. Iniwasan ang mas lumang “piging ng pag-aasawa” at ang sobrang interpretibong pagpapaliwanag sa pangunahing teksto.
