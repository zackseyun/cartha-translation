  to: Pagkatapos ng mga bagay na ito, narinig ko ang parang malakas na tinig ng napakaraming tao sa langit na nagsasabi, “Aleluya![a] Ang kaligtasan, kaluwalhatian, at kapangyarihan ay sa ating Diyos.”
