id: REV.19.1
reference: Revelation 19:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: tl
  text: Pagkatapos ng mga bagay na ito, narinig ko ang parang malakas na tinig ng napakaraming tao sa langit na nagsasabi, “Aleluya![a] Ang kaligtasan, kaluwalhatian, at kapangyarihan ay sa ating Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Purihin si Yah” o “Purihin ang PANGINOON.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang pangmaramihang demonstratibo at ang pagkakasunod-sunod ng mga pangitain, habang natural pa rin sa Filipino.
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Tuwirang salin ng aorist ng ἀκούω at angkop sa salaysay na nasa nakaraan.
- source_word: ὡς
  choice: tila
  rationale: Ipinahihiwatig ang pagkakatulad o perceptuwal na pagtataya, nang hindi tiyak na ipinapantay ang narinig sa mismong tinig ng karamihan.
- source_word: φωνὴν μεγάλην
  choice: malakas na tinig
  rationale: Sa ganitong gamit, ang μεγάλην ay tumutukoy sa lakas ng tunog; dignified at likas ang “malakas na tinig.”
- source_word: ὄχλου πολλοῦ
  choice: ng napakaraming tao
  rationale: Likas na Filipino para sa isang napakalaking kalipunan; naipapahayag ang laki ng ὄχλος nang hindi gumagamit ng masyadong teknikal na salita.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Tumutukoy sa makalangit na dako, hindi sa pisikal na himpapawid.
- source_word: λεγόντων
  choice: na nagsasabi
  rationale: Malinaw na inuugnay ang maramihang tagapagsalita sa napakaraming tao at ipinakikilala ang kanilang ipinahayag.
- source_word: Ἁλληλουϊά
  choice: Aleluya
  rationale: Ginamit ang kinikilalang anyong liturhikal sa Filipino, na nagpapanatili sa Hebreong sigaw ng papuri na naisatitik sa Griyego.
- source_word: ἡ σωτηρία
  choice: Ang kaligtasan
  rationale: Karaniwang katumbas ng σωτηρία at angkop sa pahayag ng pagliligtas na inuukol sa Diyos.
- source_word: ἡ δόξα
  choice: kaluwalhatian
  rationale: Karaniwan at dignified na katumbas ng δόξα sa konteksto ng pagsamba.
- source_word: ἡ δύναμις
  choice: kapangyarihan
  rationale: Malawak at natural na katumbas ng banal na δύναμις sa isang doxolohiya.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: ay sa ating Diyos
  rationale: Inilalahad ang genitibong pag-aari o pag-uukol nang maikli at natural, habang hindi labis na nililinaw kung ito ay pagmamay-ari o pagkilalang inuukol sa Diyos.
theological_decisions:
- issue: Paglalarawan sa makalangit na tunog sa pamamagitan ng ὡς
  choice: tila malakas na tinig
  alternative: parang malakas na tinig
  rationale: Pinananatili ng “tila” ang apokaliptikong paghahambing at ang tunay na di-tiyak na pagkakakilanlan ng tunog, nang hindi ito ginagawang tahasang literal.
- issue: Pagsasalin sa makalangit na sigaw na Ἁλληλουϊά
  choice: Aleluya
  alternative: Purihin si Yah / Purihin ang PANGINOON
  rationale: Pinananatili ng transliterasyon ang kinikilalang liturhikal at intertekstuwal na katangian ng salita. Inilalagay sa talababa ang kahulugan nito nang hindi ipinapalit ang isang tiyak na anyo ng banal na pangalan sa pangunahing teksto.
- issue: Ugnayan ng σωτηρία, δόξα, at δύναμις sa Diyos
  choice: ay sa ating Diyos
  alternative: ay pag-aari ng ating Diyos
  rationale: Sinasalamin ang genitibo ng pag-aari o pag-uukol at pinananatili ang maikli, masidhing anyo ng doxolohiya nang hindi masyadong ipinapaliwanag ang relasyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinili ang “tinig” sa halip na “boses” para sa mataas ngunit natural na rehistro ng pangitain at pagsamba; ginamit ang “napakaraming tao” bilang malinaw na katumbas ng malaking kalipunan.
