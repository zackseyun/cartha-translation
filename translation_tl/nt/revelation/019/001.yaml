  source_fidelity: Tumpak na naisasalin ang pagkakasunod-sunod ng pangitain, ang malaking tinig ng maraming tao sa langit, ang sigaw na «Ἁλληλουϊά», at ang tatluhang pagpapatungkol ng kaligtasan, kaluwalhatian, at kapangyarihan sa Diyos. Gayunman, mas malinaw na ilagay ang «ὡς» bilang «parang» upang saklawin nito ang buong narinig na tunog, hindi lamang ang antas ng lakas ng tinig.
  naturalness: Marangal at likas ang rehistro. Ang «parang malakas na tinig» ay mas idiomatiko at mas malinaw kaysa «tila malakas na tinig» sa kontekstong ito.
  terminology: Ang «Aleluya,» «kaligtasan,» «kaluwalhatian,» «kapangyarihan,» at «ating Diyos» ay angkop at pare-pareho sa modernong Filipino Tagalog at sa doxolohikal na rehistro.
