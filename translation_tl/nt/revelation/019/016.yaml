reference: Revelation 19:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: tl
  text: 'At mayroon siyang pangalang nakasulat sa kanyang balabal at sa kanyang hita: “HARI NG MGA HARI AT PANGINOON NG MGA PANGINOON.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “pangalang nakaukit.” Literal sa Griyego: “pangalang nakasulat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: mayroon siyang
  rationale: Pinananatili ang pangkasalukuyang anyo at ang tuwirang diwa ng pagkakaroon; hindi ito ginawang “suot” upang maiwasan ang dagdag na pagpapakahulugan.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: sa kanyang balabal
  rationale: Ang “balabal” ay natural at marangal na katumbas ng ἱμάτιον sa larawan ng maharlikang mandirigma; ipinahihiwatig ng konteksto na sa kanya ang kasuotan.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: sa kanyang hita
  rationale: Tuwirang isinasalin ang μηρός bilang “hita” at pinananatili ang ikalawang lokasyong tahasang binanggit sa Griyego.
- source_word: ὄνομα γεγραμμένον
  choice: pangalang nakasulat
  rationale: 'Pinananatili ang pangkaraniwang kahulugan ng γεγραμμένον at ang resultang kalagayan: ang pangalan ay nakasulat na. Hindi ito nilimitahan sa mas tiyak na paraan ng paglalagay ng sulat.'
- source_word: Βασιλεὺς βασιλέων
  choice: HARI NG MGA HARI
  rationale: Tuwirang pinananatili ang mataas na titulong maharlika at ang anyong genitibo na nagpapahayag ng kataas-taasang paghahari.
- source_word: κύριος κυρίων
  choice: PANGINOON NG MGA PANGINOON
  rationale: Ang “Panginoon” ang angkop na salin ng κύριος sa titulong ito at pinananatili ang teolohikal at pampanitikang bigat ng parirala.
theological_decisions:
- issue: Kung gagawing mas interpretatibo o pananatilihing literal ang nakasulat na titulo
  choice: Pinanatili ang “HARI NG MGA HARI AT PANGINOON NG MGA PANGINOON.”
  alternative: “Kataas-taasang Hari at Kataas-taasang Panginoon”
  rationale: Tahasan sa Griyego ang dalawang titulong nasa anyong “X ng mga x.” Ang literal na anyo ang pinakamahusay na nagpapanatili sa maringal at kristolohikal na lakas nito nang walang pagpapalawak.
- issue: Kung paano ilalarawan ang kaugnayan ng balabal at hita sa kinalalagyan ng pangalan
  choice: 'Isinalin nang tuwiran ang dalawang lokasyon: “sa kanyang balabal at sa kanyang hita.”'
  alternative: “sa kanyang balabal, sa bahaging nakapatong sa kanyang hita”
  rationale: Dalawang pariralang may ἐπί ang ibinibigay ng teksto. Hindi ipinaliliwanag ng salin kung iisa o magkaibang pagkakalagay ang tinutukoy, kaya nananatili ang tunay na kalabuan ng larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “balabal” sa halip na mas pangkalahatang “damit,” at malalaking titik sa titulo upang ipakita ang anyo nitong maharlikang pangalan nang hindi nagdaragdag ng interpretasyon.
