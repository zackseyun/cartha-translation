  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: tl
  text: Ang kanyang mga mata ay parang ningas ng apoy, at sa kanyang ulo ay maraming korona[a]. Taglay niya ang isang pangalang nakasulat, na walang sinumang nakaaalam kundi siya lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming diadema.” Ang salitang Griyego ay partikular na tumutukoy sa mga koronang maharlika.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: Ang kanyang mga mata
  rationale: Likas na Filipino ang anyong paari at malinaw nitong ipinagpapatuloy ang paglalarawan sa nakasakay.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito sa sunod-sunod na paglalarawan; hindi na kailangan ng hiwalay na katumbas sa Filipino.
- source_word: φλὸξ πυρός
  choice: nagliliyab na apoy
  rationale: Pinananatili ang tuwirang metaporang walang salitang tahasang nangangahulugang “parang,” habang gumagamit ng malinaw at buhay na modernong Filipino.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sa kanyang ulo
  rationale: Tuwiran at likas na katumbas ng lokatibong parirala sa konteksto.
- source_word: διαδήματα πολλά
  choice: maraming korona
  rationale: Madaling maunawaan ang “korona”; nililinaw sa talababa na ang salitang Griyego ay tumutukoy sa mga koronang maharlika o diadema.
- source_word: ἔχων
  choice: Taglay niya
  rationale: Ipinahahayag nang natural ang pangkasalukuyang participle bilang pagpapatuloy ng paglalarawan, nang hindi ipinahihiwatig na siya ang sumulat.
- source_word: ὄνομα γεγραμμένον
  choice: isang pangalang nakasulat
  rationale: Pinananatili ang pasibong anyo at ang resultang kalagayan ng perpektong participle nang hindi nagdaragdag ng lokasyon na hindi tahasang binanggit.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: na walang sinumang nakaaalam
  rationale: Likas na relative clause sa Filipino; ang οἶδεν ay wastong ipinahahayag sa pangkasalukuyang diwa.
- source_word: εἰ μὴ αὐτός
  choice: kundi siya lamang
  rationale: Pinananatili ang mariing pagbubukod sa mismong tinutukoy na persona.
theological_decisions:
- issue: Ang tinutukoy ng natatanging pagkaalam sa pangalan
  choice: Ang nakasakay lamang ang nakaaalam sa nakasulat na pangalan.
  alternative: Maaaring ituring ang pahayag bilang mas malawak na diin sa di-maarok na katangian ng pangalan.
  rationale: Tahasang sinasabi ng Griyego na walang nakaaalam kundi siya. Pinananatili ng salin ang hiwaga at natatanging pagkaalam nang hindi pinalalawak o nilulutas ang teolohikong kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang teknikal na “diadema” sa pangunahing teksto ngunit pinanatili ito sa talababa. Ang “nagliliyab na apoy” ay nagpapanatili sa matapang na metapora ng Griyego sa halip na tahasang gawing paghahambing sa pamamagitan ng “parang.”
