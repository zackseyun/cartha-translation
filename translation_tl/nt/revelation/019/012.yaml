  verdict: revise
  source_fidelity: 'Ang “nagliliyab na apoy” ay hindi sapat na tumpak sa φλὸξ πυρός: inilalarawan nito ang mga mata bilang apoy, samantalang ang Griyego ay tumutukoy sa “ningas/apoy na nagliliyab” bilang paglalarawan ng mga mata. Ang “parang ningas ng apoy” ay mas malinaw na naghahatid ng metaporikong predikasyon sa natural na Filipino nang hindi nagpapasok ng karagdagang interpretasyon. Ang iba pang bahagi, kabilang ang di-tiyak na lokasyon ng nakasulat na pangalan, ay tapat sa pinagmulan.'
  naturalness: Mas likas at matalinghaga sa modernong Filipino ang “parang ningas ng apoy” kaysa “nagliliyab na apoy” bilang panaguri ng “mga mata.” Ang “Taglay niya” ay marangal at angkop sa rehistro ng Apocalipsis.
  terminology: Ang “mga korona” ay katanggap-tanggap na pangunahing salin ng διαδήματα, habang wastong inilalahad ng talababa ang mas tiyak na “mga diadema” at ang makaharing diwa nito. Ang “pangalan,” “nakasulat,” at “siya lamang” ay angkop at hindi nagpapataw ng doktrinal na pagpapakahulugan.
  issues:
