  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: tl
  text: At nakita ko ang halimaw, ang mga hari ng daigdig, at ang kanilang mga hukbo, na natipon[a] upang makipagdigma laban sa nakaupo sa kabayo at laban sa kanyang hukbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na sama-samang tinipon.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “upang makipagdigma kasama ng nakaupo sa kabayo at kasama ng kanyang hukbo”; sa kontekstong ito, mapanlaban ang diwa: “makipagdigma laban sa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: ang halimaw
  rationale: Sa Pahayag, ito ay isang mabigat at nakatatakot na katawagang apokaliptiko. Ang “halimaw” ay natural sa modernong Tagalog at pinananatili ang simbolikong puwersa nito.
- source_word: βασιλεῖς τῆς γῆς
  choice: ang mga hari ng daigdig
  rationale: Bagaman maaaring tumukoy ang γῆ sa lupa o lupain, ang pandaigdigang saklaw ng tagpo sa Pahayag ay pinakanababagay sa “daigdig.”
- source_word: στρατεύματα αὐτῶν
  choice: ang kanilang mga hukbo
  rationale: Ang maramihang anyo at malinaw na konteksto ng digmaan ay natural na naipahahayag bilang “mga hukbo.”
- source_word: συνηγμένα
  choice: na nagkatipon
  rationale: Ipinahahayag nito ang kalagayan ng mga puwersang sama-sama nang natipon. Natural ang “nagkatipon” sa Tagalog at hindi nito kailangang tukuyin kung sino ang nagtipon sa kanila.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: upang makipagdigma
  rationale: Ang parirala ay idyoma para sa pagsasagawa ng digmaan. Ang “makipagdigma” ay malinaw, dignipikado, at natural sa kasalukuyang Tagalog.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: laban sa nakasakay sa kabayo
  rationale: Bagaman karaniwang “kasama” ang μετά na may genitive, hinihingi ng konteksto ng digmaan ang diwang adversatibo na “laban sa.” Ang “nakasakay” ay likas na paglalarawan sa taong nasa kabayo at hindi nagdaragdag ng tahasang titulong wala sa Griyego.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: at sa kanyang hukbo
  rationale: Saklaw pa rin ng “laban” ang ikalawang parirala. Pinananatili ng “hukbo” ang isahang kolektibong στρατεύματος.
theological_decisions:
- issue: Pagkakakilanlan ng τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: Pinanatili bilang “nakasakay sa kabayo,” isang paglalarawang ayon sa teksto.
  alternative: “Cristo” o “Mesiyas”
  rationale: Ipinakikilala ng kalapit na konteksto ang nakasakay, ngunit hindi gumagamit ang talatang ito ng tahasang kristolohikal na titulo. Pinananatili ng salin ang paraan ng pagkakalahad ng Griyego nang hindi isinasara ang malinaw na kontekstuwal na pagkakakilanlan.
- issue: Kahulugan ng μετά sa konteksto ng digmaan
  choice: Isinalin sa diwang “laban sa.”
  alternative: “kasama ang”
  rationale: Sa idyomang ποιεῖν πόλεμον μετά, ang relasyon ay mapanlaban. Ang literal na “kasama ang” ay maaaring maling magpahiwatig na magkakampi ang mga panig.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “daigdig,” “hukbo,” at “makipagdigma” upang mapanatili ang maringal at apokaliptikong himig nang hindi nagiging lipas o labis na literal.
