  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: tl
  text: At sa ikalawang pagkakataon ay sinabi nila, “Aleluya!” At ang usok niya ay pumapailanlang magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “sa mga kapanahunan ng mga kapanahunan,” isang idyomang nangangahulugang walang-hanggang tagal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: sa ikalawang pagkakataon
  rationale: Ginamit bilang pang-abay upang ipakitang ito ang ikalawang pagbigkas; pinananatili nito ang malinaw na pagkakasunod-sunod, hindi lamang ang diwa ng pag-uulit.
- source_word: εἴρηκαν
  choice: sinabi nila
  rationale: Bagaman nasa perpektong aspekto sa Griyego, natural sa salaysay na Filipino ang payak na “sinabi nila”; hindi idinagdag ang tindi ng “isinigaw” na wala naman sa pandiwa.
- source_word: Ἁλληλουϊά
  choice: Aleluya
  rationale: Pinanatili ang nakikilalang pormulang panliturhiya sa anyong karaniwang ginagamit sa Filipino sa halip na isalin bilang “Purihin si Yah.”
- source_word: ὁ καπνὸς αὐτῆς
  choice: ang usok niya
  rationale: Tumutukoy ang αὐτῆς sa Babilonia na inilalarawan bilang babae at lungsod. Ang “niya” ay natural sa Filipino at pinananatili ang personipikasyon nang hindi ginagawang tahasang kasarian ang panghalip.
- source_word: ἀναβαίνει
  choice: pumapailanlang
  rationale: Inihahatid ng pangkasalukuyang anyo ang patuloy at matingkad na larawan ng usok na tumataas. Ang “pumapailanlang” ay natural at marangal sa kontekstong apokaliptiko.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang malinaw at likas na katumbas sa Filipino ng idyomang Griyego na nagpapahayag ng walang-hanggang tagal; inilagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Ang tagal na ipinahahayag ng εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  alternative: sa mga panahon ng mga panahon
  rationale: Sa konteksto ng pangwakas na paghatol, natural na ipinahahayag ng idyomang Griyego ang walang-hanggang tagal. Hindi ito pinalalambot ng salin, habang inilalahad sa talababa ang literal na kayarian para sa pagiging malinaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang “Aleluya,” ang personipikasyon ng Babilonia sa “niya,” at ang apokaliptikong larawan ng usok na pumapailanlang.
