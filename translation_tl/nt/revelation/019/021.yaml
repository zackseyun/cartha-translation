id: REV.19.21
reference: Revelation 19:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: tl
  text: At ang iba pa ay pinatay[a] sa pamamagitan ng tabak ng nakaupo sa kabayo—ang tabak na lumabas mula sa kanyang bibig[b]. At nabusog ang lahat ng ibon sa kanilang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinaslang.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tabak” na lumabas mula sa kanyang bibig ay larawang apokaliptiko; ihambing sa Apocalipsis 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: ang iba pa
  rationale: Likas na kolektibong pagtukoy sa mga natitira matapos ang sinapit ng halimaw at ng huwad na propeta sa naunang konteksto.
- source_word: ἀπεκτάνθησαν
  choice: ay pinatay
  rationale: Pinananatili ang tahasang kahulugan at ang anyong balintiyak ng aorist passive; malinaw at makabago ang 'pinatay.'
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: sa pamamagitan ng tabak
  rationale: Ipinahahayag ang instrumental na gamit ng ἐν na may datibo habang pinananatili ang kongkretong larawan ng malaking tabak.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: ng nakasakay sa kabayo
  rationale: Natural sa Filipino at tapat sa participial na paglalarawan sa taong nasa ibabaw ng kabayo.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: ang tabak na lumabas sa kanyang bibig
  rationale: Nililinaw na ang pariralang participial ay tumutukoy sa tabak at pinananatili ang matingkad na apokaliptikong larawan.
- source_word: πάντα τὰ ὄρνεα
  choice: ang lahat ng ibon
  rationale: Hindi idinaragdag ang 'mandaragit' sapagkat 'mga ibon' lamang ang tahasang sinasabi ng Griyego, bagaman malinaw sa konteksto na kumakain sila ng bangkay.
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Natural at kongkretong salin ng χορτάζω na nangangahulugang lubusang mapakain o masiyahan.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: sa kanilang laman
  rationale: Sa Filipino, ang 'nabusog sa kanilang laman' ay natural na nagpapahayag ng pagkaing pinagmulan ng pagkabusog, nang hindi pinapahina ang nakapanghihilakbot na larawan.
theological_decisions:
- issue: Kalikasan ng tabak na lumalabas sa bibig ng nakasakay
  choice: Panatilihin sa pangunahing teksto ang kongkretong apokaliptikong larawan ng tabak na lumabas sa kanyang bibig.
  alternative: Ipaliwanag sa teksto na ang tabak ay ang kanyang salita o paghatol.
  rationale: Simbolikong larawan ang inihaharap mismo ng Apocalipsis; hindi dapat lutasin ng salin ang kahulugan nito sa paraang lampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang gitling-pahaba upang malinaw na ipakitang ang ikalawang pagbanggit sa tabak ay paliwanag sa una, at hinati sa dalawang pangungusap para sa natural na daloy.
