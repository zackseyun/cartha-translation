id: REV.19.17
reference: Revelation 19:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: tl
  text: At nakita ko ang isang anghel na nakatayo sa Araw. Sumigaw siya nang malakas at sinabi sa lahat ng ibong lumilipad sa kalagitnaan ng langit[a], “Halika kayo at magtipon para sa dakilang hapunan ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa himpapawid” o “sa gitna ng langit.” Ang salitang Griyego na μεσουράνημα ay isang natatanging pananalitang apokaliptiko na ginagamit sa Pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: isang anghel
  rationale: Pinananatili ang tahasang bilang na ἕνα sa natural na pariralang Filipino na “isang anghel,” sa halip na alisin ang pagiging tiyak ng pangitain.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: nakatayo sa loob ng araw
  rationale: Ipinapanatili ang kapansin-pansing larawang apokaliptiko ng ἐν τῷ ἡλίῳ. Nililinaw ng “sa loob ng araw” na ang tinutukoy ay ang araw bilang bagay sa kalangitan, hindi lamang ang pagkakatayo sa sikat ng araw.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: Sumigaw siya nang malakas
  rationale: Natural at makapangyarihang salin ito ng κράζω at φωνῇ μεγάλῃ nang hindi inuulit nang alanganin ang “boses” sa Filipino.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: sa lahat ng ibon
  rationale: Pangkalahatang salita para sa mga ibon ang ὄρνεον. Hindi isinasama sa pangngalan ang pahiwatig na mga ibong kumakain ng bangkay, sapagkat nagmumula iyon sa kasunod na konteksto.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: lumilipad sa kalagitnaan ng langit
  rationale: Inilalarawan nito ang mga ibong lumilipad sa gitnang bahagi o kaitaasan ng langit at pinananatili ang natatanging apokaliptikong larawan ng μεσουράνημα.
- source_word: Δεῦτε
  choice: Halikayo
  rationale: Isang tuwirang panawagan ito sa maramihang kausap at natural na katumbas sa Filipino ng paanyaya o utos na lumapit.
- source_word: συνάχθητε
  choice: magtipon kayo
  rationale: Natural na utos sa Filipino ang “magtipon kayo” at pinananatili nito ang diwa ng pagsasama-sama ng mga ibon.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: para sa dakilang hapunan ng Diyos
  rationale: Pinananatili ng “hapunan” ang karaniwang kahulugan ng δεῖπνον at ang ugnayang leksikal nito sa larawan ng hapunan sa kalapit na konteksto; pinananatili rin ng “ng Diyos” ang anyong henitibo.
theological_decisions:
- issue: Paglalarawan sa kinaroroonan ng anghel sa apokaliptikong pangitain
  choice: nakatayo sa loob ng araw
  alternative: nakatayo sa harap ng araw
  rationale: Sadyang matindi at di-pangkaraniwan ang larawan sa Griyego. Hindi ito pinahuhupa o ipinapaliwanag bilang simpleng pagkakatayo sa harap ng araw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” bilang natural na maramihang panawagan, at pinanatili ang matitingkad na larawang apokaliptiko nang hindi dinaragdagan ng paliwanag sa mismong talata.
