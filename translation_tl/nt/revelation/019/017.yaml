  source_fidelity: Kailangang baguhin ang “sa loob ng araw.” Bagaman literal ang ἐν, ang “loob” ay nagdaragdag ng ideyang nasa interior ng isang bagay; mas tapat at mas idiomatiko ang “sa Araw,” na pinananatili ang matinding larawan ng pangitain nang hindi ito pinapaliwanag. Napananatili ng iba pang bahagi ang ‘isang,’ ang malakas na pagsigaw, lahat ng ibon, ang kanilang paglipad sa μεσουράνημα, at ang dakilang hapunan ng Diyos.
  naturalness: Malinaw ang pangungusap, ngunit ang “Halikayo” ay mas pampanitikan at hindi gaanong karaniwan sa modernong Filipino. Ang “Halika kayo at magtipon” ay likas na maramihang panawagan at sapat na tuwiran para sa dalawang magkasunod na pautos na Δεῦτε συνάχθητε.
  terminology: Ang “Araw” na may malaking titik ay malinaw na tumutukoy sa araw bilang katawang makalangit, hindi sa sikat ng araw o sa isang araw ng panahon. Ang “dakilang hapunan ng Diyos” ay angkop para sa τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ. Ang “kalagitnaan ng langit” ay tumutugma sa apokaliptikong μεσουράνημα; ang talababa ay dapat magbigay ng tunay na alternatibong salin nang hindi binabago ang pangunahing larawan.
  issues:
