    rationale: Ang “loob” ay isang dagdag na pagpapakahulugan na mas tiyak kaysa sa Griyegong ἐν. Ang “sa Araw” ay kapuwa mas natural sa Filipino at mas maingat na literal.
  - severity: low
    issue: “Halikayo”
    rationale: Nauunawaan ito, ngunit mas tila pampanitikan o lumang anyo kaysa karaniwang modernong Filipino. Ang “Halika kayo at magtipon” ay natural at pinananatili ang dalawang pautos.
