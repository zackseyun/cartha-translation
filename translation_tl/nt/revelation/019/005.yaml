id: REV.19.5
reference: Revelation 19:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: tl
  text: At isang tinig ang nagmula sa trono at nagsabi, “Purihin ninyo ang ating Diyos, kayong lahat na mga alipin niya[a], at kayong mga may takot sa kanya[b], mga hamak at mga dakila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod niya.” Ang salitang Griego na δοῦλοι ay maaaring tumukoy sa mga alipin o mga lingkod, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “mga gumagalang sa kanya.” Ang “may takot sa kanya” ay biblikal na pananalita para sa mapitagang pagkatakot, malalim na paggalang, at katapatan sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: isang tinig
  rationale: Dahil sinundan ito ng λέγουσα (‘nagsabi’), malinaw na tinig ang tinutukoy, hindi basta tunog.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: nagmula sa trono
  rationale: Ipinahahayag nito ang trono bilang pinanggalingan ng tinig sa natural na Tagalog, nang hindi ipinahihiwatig na ang trono mismo ang nagsasalita.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Purihin ninyo ang ating Diyos
  rationale: Ang maramihang pautos ay malinaw sa ‘ninyo.’ Ang ‘ating’ ay natural na katumbas ng ἡμῶν sa panawagang ibinabahagi ng nagsasalita sa mga kinakausap.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: kayong lahat na mga alipin niya
  rationale: Pinananatili ng ‘alipin’ ang diwa ng pag-aari at lubos na katapatan na maaaring taglayin ng δοῦλος; inililinaw ng ‘kayong’ na tuwirang tinatawag ang pangkat.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: kayong mga may takot sa kanya
  rationale: Pinananatili nito ang biblikal na pananalita tungkol sa pagkatakot sa Diyos, kasama ang saklaw nitong banal na sindak, paggalang, at katapatan, sa halip na paliitin agad sa ‘gumagalang.’
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: mga hamak at mga dakila
  rationale: Sa konteksto, ang pares ay tumutukoy sa mga taong mababa at mataas ang katayuan. Mas natural at marangal ito sa Tagalog kaysa sa literal na ‘maliliit at malalaki.’
theological_decisions:
- issue: Paglilipat ng δοῦλοι bilang katawagan sa mga nauukol sa Diyos
  choice: mga alipin niya
  alternative: mga lingkod niya
  rationale: Hindi pinahihina ng ‘alipin’ ang matinding diwa ng pag-aari at katapatan sa Diyos. Gayunman, inilalagay sa talababa ang ‘mga lingkod’ sapagkat maaari ring iyon ang diin ng salita ayon sa konteksto.
- issue: Kahulugan ng pagkatakot sa Diyos
  choice: mga may takot sa kanya
  alternative: mga gumagalang sa kanya
  rationale: Pinananatili sa pangunahing teksto ang teolohikal na tensiyon ng biblikal na ‘takot’ at hindi ito basta pinapalitan ng mas banayad na ‘paggalang.’
- issue: Saklaw ng οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: mga hamak at mga dakila
  alternative: mga maliliit at mga malalaki
  rationale: Ipinahahayag ng piniling salin ang panlipunang lawak ng panawagan—mula sa mababa hanggang sa mataas ang katayuan—nang hindi ito ginagawang usapin ng pisikal na laki.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘tinig,’ ‘nagmula,’ at ‘nagsabi’ para sa malinaw at natural na daloy. Pinanatili ang ‘alipin’ at ‘may takot’ upang huwag pahinain ang mahahalagang diwa ng tekstong Griego, habang inilalahad sa mga talababa ang mga leksikal na alternatibo.
