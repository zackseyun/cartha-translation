revisions:
- from: At binihag ang halimaw, at kasama nito[a] ang huwad na propeta na gumawa ng mga tanda sa harapan nito. Sa pamamagitan ng mga tandang iyon, nilinlang niya ang mga tumanggap ng tatak ng halimaw at ang mga sumasamba sa larawan nito. Silang dalawa ay inihagis nang buhay sa lawa ng apoy na nagliliyab sa asupre.[b]
  to: Dinakip ang halimaw, kasama nito ang huwad na propeta na gumawa ng mga tanda sa harapan nito.[a] Sa pamamagitan ng mga tandang iyon, nilinlang niya ang mga tumanggap ng tatak ng halimaw at ang mga sumasamba sa larawan nito. Silang dalawa ay inihagis nang buhay sa lawa ng apoy na nagliliyab sa asupre.[b]
