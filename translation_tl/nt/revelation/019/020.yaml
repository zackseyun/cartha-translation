id: REV.19.20
reference: Revelation 19:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: tl
  text: Dinakip ang halimaw, kasama nito ang huwad na propeta na gumawa ng mga tanda sa harapan nito.[a] Sa pamamagitan ng mga tandang iyon, nilinlang niya ang mga tumanggap ng tatak ng halimaw at ang mga sumasamba sa larawan nito. Silang dalawa ay inihagis nang buhay sa lawa ng apoy na nagliliyab sa asupre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring gamitin ang “niya” sa halip na “nito.” Ang mga panghalip sa Griyego ay tumutukoy sa “halimaw,” isang pangngalang may neuter na kasariang gramatikal.
    reason: lexical_alternative
  - marker: b
    text: Ang “asupre” ay katumbas ng tradisyonal na English na “brimstone.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιάσθη
  choice: binihag
  rationale: Ipinapahayag ng aorist passive na ang halimaw ay dinakip o sinunggaban. Ang “binihag” ay likas sa Filipino at malinaw na nagpapanatili sa diwang pasibo ng pagkakadakip.
- source_word: θηρίον
  choice: halimaw
  rationale: Karaniwang salin ito sa makabagong Tagalog para sa apokaliptikong θηρίον at pinananatili ang nakatatakot at makasagisag na larawan.
- source_word: μετ’ αὐτοῦ
  choice: kasama nito
  rationale: Ang panghalip ay tumutukoy sa neuter na θηρίον. Ang “nito” ay hindi nagpapasya kung ang halimaw ay dapat ituring na personal na lalaki at natural na tumutukoy sa “halimaw.”
- source_word: ψευδοπροφήτης
  choice: huwad na propeta
  rationale: Tuwiran, malinaw, at karaniwang katumbas ng tambalang salita para sa isang propetang nagpapanggap o nagsasalita nang may kabulaanan.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: na gumawa ng mga tanda
  rationale: Ang “mga tanda” ay nagpapanatili sa sign-value ng σημεῖα sa halip na paliitin ito sa pangkalahatang “mga himala.” Sa Filipino, sapat na ipinahihiwatig ng sugnay ang naunang pagkilos.
- source_word: ἐνώπιον αὐτοῦ
  choice: sa harapan nito
  rationale: Likas at malapit na katumbas ng “before/in the presence of it,” habang pinananatili ang reperensiya sa halimaw.
- source_word: ἐν οἷς
  choice: sa pamamagitan ng mga tandang iyon
  rationale: 'Malinaw na ipinakikita ang instrumental na gamit: ang mga tanda ang ginamit na paraan upang manlinlang.'
- source_word: ἐπλάνησεν
  choice: nilinlang niya
  rationale: Ang πλανάω ay maaaring mangahulugang manlinlang o magligaw. Ang “nilinlang” ay maikli at natural sa kontekstong tumutukoy sa huwad na propeta.
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: ang mga tumanggap ng tatak
  rationale: Ang “tumanggap” ay angkop sa participle at ang “tatak” ay malinaw na katumbas ng isang pagkakakilanlang marka o imprinta.
- source_word: τοὺς προσκυνοῦντας
  choice: ang mga sumasamba
  rationale: Sa konteksto ng Pahayag, ang προσκυνέω ay nagpapahiwatig ng pagsambang panrelihiyon, hindi lamang pisikal na pagyukod.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Silang dalawa ay inihagis nang buhay
  rationale: Pinananatili ang diin sa dalawang tauhan at ang nakakagulat na detalyeng buhay silang inihagis.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: lawa ng apoy na nagliliyab sa asupre
  rationale: Pinananatili ang kongkretong apokaliptikong larawan at isinasalin ang θεῖον sa makabagong terminong “asupre.”
theological_decisions:
- issue: Mga panghalip na tumutukoy sa halimaw
  choice: Gamitin ang “nito” para sa halimaw
  alternative: Gamitin ang “niya/kaniya” upang higit na gawing personal ang halimaw
  rationale: Neuter ang pangngalang θηρίον sa Griyego. Hindi ipinipilit ng “nito” ang isang tiyak na interpretasyon tungkol sa pagiging persona ng pigura, ngunit hindi rin nito inaalis ang ahensiyang makikita sa konteksto.
- issue: Larawan ng pangwakas na paghatol
  choice: Panatilihin ang “lawa ng apoy na nagliliyab sa asupre”
  alternative: Ipaliwanag ito bilang impiyerno o walang-hanggang pagpapahirap
  rationale: Kongkretong apokaliptikong larawan ang ibinibigay ng talata. Hindi dapat idagdag sa salin ang mga doktrinal na paglilinaw na hindi tahasang sinasabi rito.
- issue: Aspekto ng προσκυνοῦντας
  choice: “mga sumasamba”
  alternative: “mga sumamba”
  rationale: Ang present participle ay maaaring maglarawan sa mga taong nakikilala sa patuloy o nakaugaliang pagsamba sa larawan; pinananatili ito ng anyong “sumasamba” nang hindi labis na tinutukoy ang panahon.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang apokaliptikong mga terminong “halimaw,” “tatak,” “larawan,” at “lawa ng apoy.” Iniwasan ang sobrang teknikal o denominasyonal na pagpapaliwanag. Ang paghahati sa tatlong pangungusap ay nagpapalinaw sa mahabang sintaks ng Griyego nang hindi binabago ang mga ugnayang lohikal.
