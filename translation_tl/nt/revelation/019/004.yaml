reference: Revelation 19:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: tl
  text: At nagpatirapa ang dalawampu't apat na matatanda at ang apat na nilalang na buháy, at sumamba sa Diyos na nakaupo sa trono. Sinabi nila, “Amen! Aleluya![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Purihin ang PANGINOON!” Isa itong Hebreong sigaw sa pagsamba; sa literal, “Purihin si Yah!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: nagpatirapa
  rationale: Sa konteksto ng pagsamba, ang aorist ng πίπτω ay tumutukoy sa kusang pagpapatirapa, hindi sa di-sinasadyang pagkabuwal. Likas at malinaw ito sa makabagong Filipino.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: ang dalawampu't apat na matatandang pinuno
  rationale: Ipinahihiwatig ng πρεσβύτεροι ang mga elder na may katayuang namumuno. Nililinaw ng “matatandang pinuno” ang tungkulin at iniiwasang ipakahulugan lamang bilang matatanda sa edad.
- source_word: τὰ τέσσαρα ζῷα
  choice: ang apat na nilalang na buháy
  rationale: Ang ζῷα sa Pahayag ay mga nilalang sa silid-trono, hindi karaniwang mga hayop. Pinananatili ng parirala ang diin sa pagiging buháy at ang kakaibang apokaliptikong identidad nila.
- source_word: προσεκύνησαν
  choice: sumamba sila
  rationale: Dahil Diyos ang tahasang layon, ang προσκυνέω rito ay tunay na pagsamba, hindi lamang pagyukod o pagbibigay-galang.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang datibong layon ay likas na ipinahahayag sa Filipino sa pamamagitan ng “sa” kasunod ng “sumamba.”
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: na nakaupo sa trono
  rationale: Likas na panuring ito sa Filipino para sa substantival participle at pinananatili ang larawan ng Diyos na nakaluklok sa trono.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ginagawang ganap na pangungusap ang participle upang maging natural at malinaw sa Filipino, habang nananatiling kaugnay ang pahayag sa kanilang pagsamba.
- source_word: Ἀμήν
  choice: Amen
  rationale: Ang liturhikong pagpapatibay ay nakasanayan nang transliterasyon sa Filipino at hindi kailangang palitan ng paliwanag sa pangunahing teksto.
- source_word: Ἁλληλουϊά
  choice: Aleluya
  rationale: Ang “Aleluya” ang naturalisado at malawak na nakikilalang anyong liturhiko sa Filipino; pinananatili nito ang sigaw ng papuri na nakapaloob sa Griyego.
theological_decisions:
- issue: Paglilipat ng Ἁλληλουϊά, isang Hebreong liturhikong pahayag na nakasulat sa Griyego
  choice: Aleluya
  alternative: Purihin ang PANGINOON!; Purihin si Yah!
  rationale: Gumaganap ito bilang nakapirming sigaw sa pagsamba, kaya pinananatili ang naturalisadong anyong liturhiko. Inilalagay sa talababa ang literal na kahulugan upang hindi maitago ang sangkap na tumutukoy sa banal na pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagpatirapa” para sa malinaw na kilos ng pagsamba, at “matatandang pinuno” upang maipakita ang tungkulin ng πρεσβύτεροι nang hindi gumagamit ng teknikal na katawagang denominasyonal. Minarkahan ang diin sa “buháy” upang maiwasan ang maling pagbasa.
