  verdict: revise
  source_fidelity: Ang “nagpatirapa,” “sumamba sa Diyos,” “nakaupo sa trono,” at ang liturhikong “Amen! Aleluya!” ay tapat sa Griyego. Gayunman, ang “matatandang pinuno” ay nagdaragdag ng tahasang ideya ng pamumuno na wala sa πρεσβύτεροι mismo at masyadong nagpapakahulugan sa katawagan.
  naturalness: Natural at marangal ang daloy kapag pinanatili ang magkatuwang na paksa at ang “sinabi nila” pagkatapos ng kilos ng pagsamba. Ang “dalawampu't apat na matatanda” ay mas payak, likas, at hindi nagpapasok ng di-tahasang tungkulin.
  terminology: “Matatanda” ang pinakamalapit at di-denominasyonal na katumbas ng πρεσβύτεροι sa apokaliptikong katawagang ito. Ang “nilalang na buháy,” “Diyos,” “trono,” “Amen,” at “Aleluya” ay angkop. Nanatili ang talababa para sa kahulugan ng Aleluya.
  issues:
  - severity: medium
    issue: Ang “matatandang pinuno” para sa πρεσβύτεροι ay interpretibong dagdag.
    rationale: Ang πρεσβύτεροι ay literal na “matatanda/elders.” Bagaman maaari silang may katayuan, hindi tahasang sinasabi ng talata ang “pinuno”; dapat iwasan ang pagdaragdag ng tungkuling iyon sa salin.
  revised_text: At nagpatirapa ang dalawampu't apat na matatanda at ang apat na nilalang na buháy, at sumamba sa Diyos na nakaupo sa trono. Sinabi nila, “Amen! Aleluya![a]”
