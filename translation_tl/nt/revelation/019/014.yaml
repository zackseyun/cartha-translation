  source_fidelity: 'Tumpak na naihahatid ang lahat ng elemento ng Griyego: ang mga hukbo ay inilalarawang nasa langit, patuloy na sumusunod sa kanya, sakay ng mga kabayong puti, at nakadamit ng pinong lino na puti at malinis. Ang “patuloy na sumusunod” ay angkop na pagpapahayag ng imperfect na ἠκολούθει, at hindi pinapangalanan ng salin ang pagkakakilanlan ng mga hukbo nang lampas sa sinasabi ng teksto.'
