id: REV.19.14
reference: Revelation 19:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: tl
  text: At ang mga hukbong nasa langit ay patuloy na sumusunod sa kanya, sakay ng mga kabayong puti.[a] Nakadamit sila ng pinong lino na puti at malinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga hukbo ng langit.” Sa literal, ang pariralang Griyego ay “ang mga hukbo, ang mga nasa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: mga hukbo
  rationale: Tumutukoy ang pangmaramihang pangngalan sa organisadong mga puwersang militar; natural at tuwiran sa makabagong Tagalog ang “mga hukbo” sa konteksto ng digmaan sa pangitain.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: nasa langit
  rationale: 'Pinananatili nito ang lokatibong diwa ng Griyego: ang mga hukbo ay nasa langit, nang hindi ginagawang tahasang pagmamay-ari o pinagmulan ang parirala.'
- source_word: ἠκολούθει αὐτῷ
  choice: ay patuloy na sumusunod sa kanya
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy na kilos sa loob ng pangitain; malinaw itong naihahatid ng “patuloy na sumusunod.”
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: sakay ng mga kabayong puti
  rationale: Likas na Tagalog ang “sakay ng” para sa nakasakay na pagsama, at pinananatili ang simbolikong kulay na puti.
- source_word: ἐνδεδυμένοι
  choice: nakadamit
  rationale: Inilalarawan ng participle ang kalagayan nilang may suot; dignified ngunit madaling maunawaan ang “nakadamit.”
- source_word: βύσσινον
  choice: pinong lino
  rationale: Inihahatid nito kapwa ang materyal at ang mataas na kalidad ng telang tinutukoy, alinsunod sa paulit-ulit na imahen sa Pahayag.
- source_word: λευκὸν καθαρόν
  choice: puti at malinis
  rationale: Tuwirang pinananatili ang dalawang katangiang naglalarawan sa lino, nang hindi labis na binibigyang-kahulugan ang καθαρόν bilang espirituwal na “dalisay.”
theological_decisions:
- issue: Pagkakakilanlan at paglalarawan sa mga hukbong nasa langit
  choice: “mga hukbong nasa langit,” nang hindi tinutukoy kung sila ay mga anghel, mga banal, o kapwa mga ito
  alternative: “mga hukbo ng langit” o tahasang pagkilala sa kanila bilang mga anghel o niluwalhating mga banal
  rationale: Tinutukoy ng talata ang kanilang kinaroroonan at kasuotan ngunit hindi tahasang sinasabi ang kanilang pagkakakilanlan. Pinananatili ng salin ang pagpipigil at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang dalawang pangungusap upang maiwasan ang malabong pagtukoy ng pangmaramihang participle at gawing natural ang daloy, habang pinananatili ang lahat ng detalye at ang nagpapatuloy na aspekto ng kilos.
