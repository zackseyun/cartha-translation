  to: 'Ngunit ito ang laban ko sa iyo: pinahihintulutan mo ang babaeng si Jezebel[a], na nagsasabing isa siyang propeta[b], at tinuturuan niya at inililigaw[c] ang aking mga alipin upang makagawa ng seksuwal na imoralidad at kumain ng pagkaing inihandog sa mga diyos-diyosan.'
