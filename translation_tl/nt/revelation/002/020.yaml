  terminology: Ang “mga alipin” ay wastong katumbas ng δούλους sa kontekstong ito. Ang “seksuwal na imoralidad,” “pagkaing inihandog sa mga diyos-diyosan,” at “propeta” ay angkop sa modernong Filipino Tagalog at sa rehistrong pangkasulatan.
