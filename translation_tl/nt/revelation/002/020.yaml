id: REV.2.20
reference: Revelation 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: tl
  text: 'Ngunit ito ang laban ko sa iyo: pinahihintulutan mo ang babaeng si Jezebel[a], na nagsasabing isa siyang propeta[b], at tinuturuan niya at inililigaw[c] ang aking mga alipin upang makagawa ng seksuwal na imoralidad at kumain ng pagkaing inihandog sa mga diyos-diyosan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskritong kababasahan ng “asawa mong si Jezebel” sa halip na “ang babaeng si Jezebel.”
    reason: textual_variant
  - marker: b
    text: O, “na nag-aangking siya ay propeta.”
    reason: lexical_alternative
  - marker: c
    text: O, “nililinlang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa naunang papuri habang nananatiling marangal at natural ang himig.
- source_word: ἔχω κατὰ σοῦ
  choice: ito ang laban ko sa iyo
  rationale: Natural na idyomang Filipino para sa paghaharap ng paratang o reklamo; ang “ito” ay tumutukoy sa kasunod na usapin.
- source_word: ἀφεῖς
  choice: pinahihintulutan mo
  rationale: Sa konteksto, tumutukoy ito sa pagpapabaya o pagpayag na magpatuloy ang nakapipinsalang gawain, hindi sa pagpapatawad.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: ang babaeng si Jezebel
  rationale: Pinananatili ang pangunahing tekstong Griyego at hindi isinasama sa katawan ng talata ang tekstuwal na variant na “asawa mong si Jezebel.”
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: na nagsasabing isa siyang propeta
  rationale: Tumpak at natural na ipinahahayag ang sariling pagpapakilala niya bilang propeta. Hindi minamarkahan ng Filipino ang kasarian sa salitang “propeta,” ngunit malinaw ito mula sa panghalip na “siya” at sa naunang “babae.”
- source_word: διδάσκει
  choice: tinuturuan
  rationale: Ipinakikita ng anyong pangkasalukuyan ang nagpapatuloy o kinagawiang pagtuturo; ginamit ang pandiwang may layon upang maging natural kasama ng “ang aking mga alipin.”
- source_word: πλανᾷ
  choice: inililigaw
  rationale: Nahuhuli nito ang larawan ng pag-akay palayo sa katotohanan o wastong asal, habang iniiwan sa talababa ang alternatibong diin sa panlilinlang.
- source_word: τοὺς ἐμοὺς δούλους
  choice: ang aking mga alipin
  rationale: Pinananatili ng “mga alipin” ang diwa ng pag-aari at lubos na katapatan kay Cristo na nasa δοῦλος at sa panghalip na “aking.”
- source_word: πορνεῦσαι
  choice: gumawa ng seksuwal na imoralidad
  rationale: Saklaw nito ang ipinagbabawal na seksuwal na gawain nang hindi pinakikitid ang kahulugan sa pangangalunya lamang.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: kumain ng pagkaing inihandog sa mga diyos-diyosan
  rationale: Malinaw na tumutukoy sa pagkaing kaugnay ng paghahandog sa mga idolo at madaling maunawaan sa modernong Filipino.
theological_decisions:
- issue: Pagkakakilanlan ni “Jezebel”
  choice: Panatilihin ang pangalang “Jezebel” nang hindi tinutukoy kung literal niyang pangalan ito o isang simbolikong bansag.
  alternative: Maaaring isang babaeng literal na nagngangalang Jezebel, o isang bansag na tumutukoy sa Jezebel ng Lumang Tipan.
  rationale: Hindi nilulutas ng talata mismo ang pagkakakilanlang ito, kaya pinananatili ng salin ang tunay na kalabuan.
- issue: Kahulugan ng δοῦλος
  choice: aking mga alipin
  alternative: aking mga lingkod
  rationale: Binibigyang-diin ng “aking” ang pag-aari at katapatan kay Cristo; higit na tuwirang pinananatili ng “alipin” ang lakas ng terminong Griyego kaysa sa mas banayad na “lingkod.”
- issue: Saklaw ng πορνεῦσαι
  choice: gumawa ng seksuwal na imoralidad
  alternative: makiapid
  rationale: Hindi nililimitahan ng salin ang malawak na terminong Griyego sa pangangalunya o sa isang partikular na anyo ng ipinagbabawal na seksuwal na gawain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinahihintulutan,” “mga alipin,” at “seksuwal na imoralidad” upang mapanatili ang bigat ng paratang at ang mahahalagang pagkakaiba sa tekstong Griyego. Inilagay ang bawat panandang talababa sa mismong pariralang tinutukoy nito.
