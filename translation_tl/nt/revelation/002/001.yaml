  to: '“Sa anghel[a] ng iglesya sa Efeso, isulat mo: Ito ang sinasabi ng humahawak sa pitong bituin sa kanyang kanang kamay at lumalakad sa gitna ng pitong gintong patungan ng ilawan:”'
