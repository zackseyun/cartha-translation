  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: tl
  text: '“Sa anghel[a] ng iglesya sa Efeso, isulat mo: Ito ang sinasabi ng humahawak sa pitong bituin sa kanyang kanang kamay at lumalakad sa gitna ng pitong gintong patungan ng ilawan:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero” ng iglesya sa Efeso.
    reason: Pinananatili ang posibleng kahulugan ng ἄγγελος at ang tunay na kalabuan tungkol sa tinutukoy nito.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Maaaring tumukoy ang salita sa isang makalangit na anghel o sa isang taong mensahero. Pinananatili ng “anghel” ang apokaliptikong himig ng Pahayag, habang inilalagay sa talababa ang tunay na posibleng kahulugang “mensahero.”
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Sa kontekstong Kristiyano, ang “iglesya” ay natural at malinaw na tawag sa kapulungan ng mga mananampalataya, nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: γράψον
  choice: isulat mo
  rationale: Tuwirang utos ito kay Juan; natural sa modernong Tagalog ang “isulat mo.”
- source_word: Τάδε λέγει
  choice: Ito ang sinasabi
  rationale: Pinananatili nito ang pormal at makahulang pormula habang malinaw at natural sa kasalukuyang Tagalog.
- source_word: κρατῶν
  choice: may hawak
  rationale: Ipinapahayag nito ang matatag na paghawak o pag-iingat nang hindi labis na ipinapaliwanag ang simbolikong diwa.
- source_word: δεξιᾷ
  choice: kanang kamay
  rationale: Tuwirang katumbas na nagpapanatili sa konkretong larawang may pahiwatig ng kapangyarihan at pangangalaga.
- source_word: περιπατῶν
  choice: lumalakad
  rationale: Pinananatili ang malinaw at buhay na larawan ng pagkilos sa gitna ng mga patungan ng ilawan.
- source_word: ἐν μέσῳ
  choice: sa gitna ng
  rationale: Natural na Tagalog na tapat sa larawang nasa loob at kapiling ng pitong patungan ng ilawan.
- source_word: λυχνιῶν
  choice: patungan ng ilawan
  rationale: Ang λυχνία ay patungan ng ilawan, hindi ang ilawan mismo; mahalaga ang pagkakaibang ito sa larawan ng Pahayag.
- source_word: χρυσῶν
  choice: gintong
  rationale: Maikli, natural, at tapat na katumbas ng pang-uring tumutukoy sa ginto.
theological_decisions:
- issue: Ang tinutukoy ng “anghel ng iglesya”
  choice: “anghel” sa pangunahing teksto
  alternative: “mensahero”
  rationale: Pinahihintulutan ng ἄγγελος ang dalawang kahulugan. Ang apokaliptikong konteksto ay umaayon sa “anghel,” ngunit hindi tiyak ang tinutukoy kaya pinananatili sa talababa ang “mensahero” sa halip na lutasin ang usapin ayon sa isang partikular na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na pormal at marangal ngunit madaling maunawaan. Ginamit ang “iglesya” bilang karaniwang katawagan sa pamayanang Kristiyano at “patungan ng ilawan” upang tumpak na maiba ang λυχνία sa mismong ilawan.
