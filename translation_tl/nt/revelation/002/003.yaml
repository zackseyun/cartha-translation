id: REV.2.3
reference: Revelation 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: tl
  text: At taglay mo ang matatag na pagtitiis; nagbata ka alang-alang sa aking pangalan,[a] at hindi ka napagod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa aking pangalan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “hindi ka nanghina sa pagod”; posible ring iugnay ang sugnay sa pagpapagal: “hindi ka napagod sa pagpapagal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: matatag na pagtitiis
  rationale: Ipinahahayag nito ang matibay at patuloy na pagtitiis sa gitna ng pagsubok, nang hindi ito nililimitahan sa pasibong paghihintay o sa isang tiyak na uri ng pag-uusig.
- source_word: ἔχεις
  choice: taglay mo
  rationale: Pinananatili nito ang pangkasalukuyang diwa ng tuwirang papuri at mas natural sa marangal na Tagalog kaysa sa literal na “mayroon kang.”
- source_word: ἐβάστασας
  choice: nagbata ka
  rationale: Maaaring mangahulugan ang βαστάζω ng pagbuhat, pagdadala, o pagtitiis. Sa konteksto, ang “nagbata” ay nagpapahiwatig ng pagdadala ng hirap nang hindi inuulit lamang ang salitang “pagtitiis.”
- source_word: διὰ τὸ ὄνομά μου
  choice: alang-alang sa aking pangalan
  rationale: Natural nitong ipinahahayag ang dahilan o kapakanan na maaaring taglayin ng διά na may accusative, habang pinananatili ang biblikal na diwa ng katapatan sa pangalan ni Jesus.
- source_word: οὐ κεκοπίακες
  choice: hindi ka napagod
  rationale: Sa paralelismo ng talata, ang κοπιάω ay pinakamalamang na tumutukoy sa hindi panghihina dahil sa pagod. Ang payak na anyong Filipino ay malinaw at natural, habang inilalahad sa talababa ang posibleng kaugnayan nito sa pagpapagal.
theological_decisions:
- issue: Diwa ng pagtitiis at pagbata sa papuri
  choice: Pinupuri ang patuloy na pagtitiis at pagbata alang-alang sa pangalan ni Jesus, nang hindi tinutukoy ang isang partikular na anyo ng pag-uusig o paglilingkod.
  alternative: Maaaring unawain ang huling sugnay bilang hindi panghihina o hindi pagkapagod sa pagpapagal.
  rationale: Pinananatili ng salin ang pangkalahatang papuri ng Griyego at hindi nagdaragdag ng tiyak na teolohiya tungkol sa pag-uusig, gawain sa ministeryo, o gantimpala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taglay mo” upang mapanatili ang anyong pangngalan ng ὑπομονή, at ang “nagbata” upang maiba ito sa naunang “pagtitiis.” Inilagay ang mga talababa sa mismong pariralang tinutukoy ng bawat alternatibo.
