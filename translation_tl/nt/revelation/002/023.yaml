id: REV.2.23
reference: Revelation 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: tl
  text: At papatayin ko sa kamatayan ang kanyang mga anak[a]. Malalaman ng lahat ng iglesya na ako ang sumisiyasat sa puso at isip[b], at bibigyan ko ang bawat isa sa inyo ayon sa inyong mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papatayin ko sa pamamagitan ng salot”; literal na sinasabi ng Griyego na “papatayin ko sa kamatayan,” isang pariralang maaaring magpasidhi sa paghatol o umalingawngaw sa wika ng paghatol sa Lumang Tipan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga bato at mga puso,” isang biblikal na idyoma para sa kaibuturan ng tao, kabilang ang kanyang mga motibo, pag-iisip, at pagnanasa.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: mga anak
  rationale: Karaniwang kahulugan nito ang mga anak o supling. Pinananatili ng “mga anak” na bukas kung literal na mga anak o matalinghagang mga tagasunod ang tinutukoy.
- source_word: ἀποκτενῶ
  choice: papatayin ko
  rationale: Tuwirang ipinahahayag ng pandiwa ang pagpatay; malinaw at natural ito sa modernong Tagalog.
- source_word: ἐν θανάτῳ
  choice: sa kamatayan
  rationale: Pinananatili ang kapansin-pansing literal na pariralang “papatayin ... sa kamatayan,” pati ang maaaring alusyon nito sa wika ng paghatol sa Lumang Tipan. Inilalagay sa talababa ang posibleng kahulugang “sa pamamagitan ng salot.”
- source_word: γνώσονται
  choice: malalaman
  rationale: Ipinahahayag nito ang pagkilalang ibubunga ng paghatol; likas sa Tagalog ang “malalaman” sa kontekstong ito.
- source_word: ἐκκλησίαι
  choice: mga iglesya
  rationale: Tumutukoy ito sa mga kongregasyong Kristiyano sa Pahayag; “mga iglesya” ang malinaw at karaniwang salin.
- source_word: ὁ ἐραυνῶν
  choice: ang sumisiyasat
  rationale: Pinananatili nito ang patuloy at masusing pagkilos na ipinahihiwatig ng pandiwaring Griyego, kasama ang himig ng makatarungang pagsusuri.
- source_word: νεφροὺς καὶ καρδίας
  choice: puso at isip
  rationale: Literal itong “mga bato at mga puso,” isang biblikal na idyoma para sa kaibuturan ng tao—mga motibo, pag-iisip, at pagnanasa. Ang “puso at isip” ay malinaw at natural sa modernong Tagalog; ipinaliliwanag sa talababa ang literal na anyo.
- source_word: δώσω
  choice: bibigyan ko
  rationale: Malapit ito sa payak na kahulugang “magbibigay,” habang hinahayaan ang kasunod na parirala na magpahayag ng diwa ng makatarungang pagganti.
- source_word: ὑμῖν ἑκάστῳ
  choice: ang bawat isa sa inyo
  rationale: 'Natural nitong ipinahahayag ang pamamahaging diwa: bawat indibidwal sa grupong kinakausap.'
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: ayon sa inyong mga gawa
  rationale: Pinananatili ng “mga gawa” ang karaniwang biblikal na bokabularyo at ang pormula ng paghatol batay sa ginawa ng bawat isa.
theological_decisions:
- issue: Ang pagkakakilanlan ng nagsasalita bilang sumisiyasat sa kalooban ng tao
  choice: 'Pinanatili ang tahasang unang-panauhang pagpapakilala: “ako ang sumisiyasat sa puso at isip.”'
  alternative: Palambutin ito bilang pangkalahatang pagkaalam o pagmamasid lamang.
  rationale: Iniuugnay ng Griyego sa muling nabuhay na si Jesus ang masusing kaalaman at kapangyarihang humatol. Dapat mapanatili ang bigat na ito nang hindi dinaragdagan o pinahihina.
- issue: Kahulugan ng “kanyang mga anak”
  choice: Hinayaang bukas kung literal na mga anak o matalinghagang mga tagasunod ang tinutukoy.
  alternative: Tukuyin nang tahasan bilang mga anak sa laman o bilang mga alagad/tagasunod.
  rationale: Maaaring magpahiwatig ang konteksto ng mga tagasunod ni “Jezebel,” ngunit hindi ipinipilit ng mismong Griyego ang alinman sa dalawang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang di-pangkaraniwang “sa kamatayan” dahil mahalaga ang tunay na hirap at alusyong taglay ng Griyego, saka ito ipinaliwanag sa talababa. Ginamit ang natural na “puso at isip” para sa sinaunang idyomang antropolohikal.
