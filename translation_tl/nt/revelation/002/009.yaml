  to: Alam ko ang paghihirap mo at ang iyong karalitaan—ngunit mayaman ka—at ang paninirang-puri[a] mula sa mga nagsasabing sila ay mga Judio ngunit hindi naman sila, kundi isang sinagoga ni Satanas.[b]
  rationale: Inayos ang pagmamarka at nilalaman ng mga talababa upang tumugma sa leksikal na audit trail at maiwasan ang paglutas sa isang pinagtatalunang implikasyong teolohikal. Ginawang “mula sa” ang pagsasalin ng ἐκ at nilinaw ang sugnay na “ngunit hindi naman sila,” nang hindi binabago ang kahulugan o dinaragdagan ang teksto ng “tunay.”
