id: REV.2.9
reference: Revelation 2:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: tl
  text: Alam ko ang paghihirap mo at ang iyong karalitaan—ngunit mayaman ka—at ang paninirang-puri[a] mula sa mga nagsasabing sila ay mga Judio ngunit hindi naman sila, kundi isang sinagoga ni Satanas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pamumusong.” Dito, ang diwa ay mapanirang pananalita laban sa mga mananampalataya, kaya “paninirang-puri” ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “sinagoga” ay maaari ring mangahulugang “kapulungan” o “pagtitipon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: paghihirap
  rationale: Ipinahahayag nito ang dinaranas na matinding hirap o panggigipit nang hindi nilalagyan ng teknikal na eskatolohikal na kahulugan.
- source_word: πτωχείαν
  choice: karalitaan
  rationale: Tuwiran nitong ipinahahayag ang kalagayan ng pagiging dukha at angkop sa marangal na rehistro ng talata.
- source_word: πλούσιος
  choice: mayaman
  rationale: Pinananatili nito ang matalim na kabalintunaan sa materyal na karalitaan nang hindi idinaragdag na espirituwal ang kayamanan.
- source_word: βλασφημίαν
  choice: paninirang-puri
  rationale: Sa konteksto, tumutukoy ito sa mapanirang pananalitang laban sa mga mananampalataya; mas malinaw ito kaysa 'pamumusong,' na karaniwang inuunawang tuwirang laban sa Diyos.
- source_word: ἐκ τῶν λεγόντων
  choice: ng mga nagsasabing
  rationale: Natural na Filipino itong nagpapahayag na sa mga taong iyon nagmumula ang paninirang-puri.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: sila'y mga Judio
  rationale: Tuwirang pinananatili ang tahasang katawagang Ἰουδαίους at likas na naipahahayag sa Filipino ang reflexive na diwa.
- source_word: συναγωγὴ
  choice: sinagoga
  rationale: Pinananatili nito ang historikal at leksikal na katiyakan ng salita, pati ang mariing kabalintunaan ng paglalarawan.
- source_word: τοῦ Σατανᾶ
  choice: ni Satanas
  rationale: Ito ang natural na Filipino para sa genitibong parirala at pinananatili ang mariing puwersa nito nang hindi nagpapalabis.
theological_decisions:
- issue: Ang parirala tungkol sa mga nagsasabing sila ay mga Judio ngunit hindi naman
  choice: Pinanatili nang literal ang 'mga Judio' at ang pagtanggi ayon sa pagkakasabi ng Griyego.
  alternative: mga nagsasabing sila ang bayan ng Diyos ngunit hindi naman; mga nagsasabing sila ay tunay na mga Judio ngunit hindi naman
  rationale: Tahasan ang Ἰουδαίους. Hindi dapat palabuin ang salita o dagdagan ng 'tunay' na wala sa teksto. Pinananatili rin nito ang tensiyong teolohikal nang hindi ginagawang tahasang pagtanggi sa etnisidad.
- issue: Kung dapat linawing espirituwal ang pagiging mayaman
  choice: Iniwan na walang panuring ang 'mayaman ka.'
  alternative: mayaman ka sa espirituwal na paraan
  rationale: Ipinahihiwatig ng konteksto ang di-materyal na kayamanan, ngunit walang katumbas ng 'espirituwal' sa Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'karalitaan' at 'paninirang-puri' para sa linaw at dignidad; pinanatili ang 'sinagoga ni Satanas' dahil mahalaga ang historikal at polemikal na anyo ng orihinal.
