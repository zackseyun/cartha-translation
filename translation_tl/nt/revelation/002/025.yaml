  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: tl
  text: Gayunman[a], panghawakan ninyo ang taglay ninyo hanggang sa dumating ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Ito lamang: panghawakan ninyo ang taglay ninyo hanggang sa dumating ako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang pagsalungat o paglilimita sa naunang sinabi. Natural at marangal sa modernong Tagalog ang “Gayunman,” habang inilalagay sa talababa ang posibleng diwang “Ito lamang.”
- source_word: ὃ ἔχετε
  choice: ang taglay ninyo
  rationale: Ang pangkalahatang neutrong parirala ay tumutukoy sa anumang kasalukuyang nasa kanila. Maikli at natural ang “ang taglay ninyo” nang hindi nililinaw nang higit sa Griyego kung ano iyon.
- source_word: κρατήσατε
  choice: panghawakan ninyo
  rationale: Ang pautos ay humihiling ng matatag na pagpapanatili. Ang “panghawakan” ay malinaw at likas na Filipino para sa patuloy na hindi pagbitiw sa kanilang taglay.
- source_word: ἄχρι οὗ ἂν
  choice: hanggang sa
  rationale: Natural nitong ipinapahayag ang hangganang temporal na umaabot sa pagdating ng nagsasalita.
- source_word: ἥξω
  choice: dumating ako
  rationale: Tumpak na ipinapahayag ng “dumating” ang pagdating o pag-abot sa lugar, nang hindi tinutukoy kung ito ba ay huling pagparito o pagdating upang humatol.
theological_decisions:
- issue: Kung ang pagdating ni Jesus ay tumutukoy sa kanyang huling pagparito o sa isang pagdating upang humatol/dumalaw sa iglesiang ito
  choice: “hanggang sa dumating ako,” na hindi tinutukoy ang paraan o panahon
  alternative: “hanggang sa dumating ako upang humatol” o “hanggang sa aking huling pagparito”
  rationale: Hindi tahasang nililinaw ng Griyego ang uri o panahon ng pagdating, kaya pinananatili ng salin ang tunay na teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang maramihang “ninyo” ayon sa kausap na pamayanan, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
