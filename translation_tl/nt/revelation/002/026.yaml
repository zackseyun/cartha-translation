  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: tl
  text: At ang nagtatagumpay[a] at tumutupad sa aking mga gawa[b] hanggang sa wakas—bibigyan ko siya[c] ng awtoridad na mamuno sa mga bansa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nananaig.”
    reason: lexical_alternative
  - marker: b
    text: Ang “aking mga gawa” ay maaaring tumukoy sa mga gawang nauukol o naaayon kay Jesus—sa kanyang mga ginawa, mga layunin, o mga gawaing hinihingi niya. Hindi mas tiyak ang kaugnayang ipinahahayag ng Griyego.
    reason: lexical_alternative
  - marker: c
    text: Isahan ang anyo sa Griyego (“ang … bibigyan ko siya”), at ginagamit ito bilang kumakatawang pagtukoy sa sinumang ganito. Walang kasariang tinutukoy ang “siya” sa Tagalog.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: ang nagtatagumpay
  rationale: Ang may artikulong pangkasalukuyang pandiwaring Griyego ay tumutukoy sa taong kinikilala sa patuloy na pagtatagumpay. Pinananatili ng “nagtatagumpay” ang larawan ng pakikipaglaban sa Pahayag nang hindi ito ginagawang isang tapos na tagumpay lamang.
- source_word: ὁ τηρῶν
  choice: at tumutupad
  rationale: Maaaring mangahulugan ang τηρέω na ingatan, panatilihin, o sundin. Sa ugnay nito sa “mga gawa,” natural sa makabagong Tagalog ang “tumutupad,” habang ipinahihiwatig ang patuloy na matapat na pagsasagawa.
- source_word: ἄχρι τέλους
  choice: hanggang sa wakas
  rationale: Tuwirang ipinahahayag ang pagtitiyaga hanggang sa huling hantungan.
- source_word: τὰ ἔργα μου
  choice: aking mga gawa
  rationale: Pinananatili ang tahasang pananalita ng Griyego at ang hindi tiyak na kaugnayan ng mga gawa kay Jesus, sa halip na paliitin ito bilang mga utos o mga gawang para sa kanya.
- source_word: δώσω αὐτῷ
  choice: bibigyan ko siya
  rationale: Pinananatili ang panghinaharap na “ibibigay ko” at ang isahang tinutukoy. Likas na walang kasariang tinutukoy ang panghalip na Tagalog na “siya.”
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Tumutukoy ito sa ipinagkaloob na karapatan o kapamahalaang mamuno, hindi lamang sa lakas o kakayahan.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: sa mga bansa
  rationale: Sa ganitong gamit, ipinahihiwatig ng ἐπί na ang awtoridad ay nakapangyayari sa mga bansa; natural na ipinapahayag ito sa Tagalog bilang “awtoridad sa mga bansa.”
theological_decisions:
- issue: Isahang anyo na kumakatawan sa lahat ng nagtatagumpay
  choice: Panatilihin ang isahang “ang … siya”
  alternative: Gamitin ang maramihang “ang mga … sila”
  rationale: Isahan ang mga pandiwaring may artikulo at ang panghalip sa Griyego. Pinananatili ng salin ang isahan bilang kumakatawang paglalarawan, ngunit ang likas na walang-kasariang “siya” sa Tagalog ay hindi nagsasaad na lalaki lamang ang tinutukoy.
- issue: Kahulugan ng “aking mga gawa”
  choice: Panatilihin ang “aking mga gawa”
  alternative: “mga gawaing iniuutos ko” o “mga gawang para sa akin”
  rationale: Hindi nililinaw ng Griyego kung ang mga ito ay mga gawa ni Jesus, mga gawang kaayon ng kanyang ginawa at layunin, o mga gawaing hinihingi niya. Hindi pinipili ng salin ang isa lamang sa mga posibleng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang em dash upang mapanatili ang diin sa pangako matapos ilarawan ang taong tatanggap nito. Hindi ginawang mas tiyak ang “aking mga gawa” kaysa sa Griyego.
