id: REV.2.11
reference: Revelation 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: tl
  text: Ang may tainga ay makinig sa sinasabi ng Espiritu sa mga iglesya. Ang nagtatagumpay ay tiyak na hindi mapipinsala ng ikalawang kamatayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ang may pandinig
  rationale: Natural na pormulang Tagalog na pinananatili ang pangkalahatang panawagan ng isahang Griyego; higit itong idiomatiko kaysa sa literal na “ang may tainga” habang hindi binabago ang diwa.
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ipinahahayag ang pautos at mapanghikayat na lakas ng ikatlong panauhang aorist imperative sa likas na modernong Tagalog.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa paulit-ulit na pormula ng Pahayag 2–3, malamang na banal at personal na tagapagsalita ang tinutukoy; ipinakikita ito ng malaking titik nang hindi dinaragdagan ang salita ng “Banal.”
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Tumutukoy sa mga kongregasyong kinakausap sa Pahayag 2–3. Ang “mga iglesya” ay malinaw, kasalukuyan, at pamilyar na salin.
- source_word: ὁ νικῶν
  choice: Ang nagtatagumpay
  rationale: Ipinahahayag ang patuloy o katangiang pagkapanalo ng present articular participle. Saklaw nito ang diwang “dumaraig” o “nagwawagi” nang natural sa Tagalog.
- source_word: οὐ μὴ
  choice: tiyak na hindi
  rationale: Pinananatili ang mariing pagtanggi ng οὐ μή kasama ng subjunctive.
- source_word: ἀδικηθῇ
  choice: mapipinsala
  rationale: Ang passive ng ἀδικέω rito ay tumutukoy sa pagdanas ng pinsala, hindi lamang sa paglabag sa katarungan.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: ng ikalawang kamatayan
  rationale: Sa Tagalog, likas na ipinakikita ng “mapipinsala ng” ang sanhi o pinagmumulan ng pinsala na ipinahahayag ng ἐκ sa kontekstong ito.
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: ang ikalawang kamatayan
  rationale: Tuwirang pinananatili ang mahalagang apokaliptikong katawagan nang walang paliwanag na teolohikal sa mismong teksto.
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: Malaking titik sa “Espiritu,” bilang malamang na banal na tagapagsalita sa mga iglesya
  alternative: Ang espiritu sa mas pangkalahatang diwa ng propetikong Espiritu
  rationale: Sa paulit-ulit na pangwakas na pormula ng mga mensahe sa Pahayag 2–3, ang Espiritu ay nagsasalita nang may banal na awtoridad. Hindi idinagdag ang “Banal” upang hindi lampasan ang tahasang anyo ng Griyego.
- issue: Kinatawang isahan sa panawagang ὁ ἔχων οὖς ἀκουσάτω
  choice: Gumamit ng pangkalahatang “Ang may pandinig ay makinig”
  alternative: Mas literal na “Ang may tainga ay makinig”
  rationale: Walang pangkasariang panghalip na kailangang idagdag sa Tagalog. Nananatili ang isahang kinatawang puwersa at ang pormulang panawagan nang natural.
- issue: Kahulugan ng “ikalawang kamatayan”
  choice: Panatilihin ang katawagan nang walang interpretibong pagpapalawak
  alternative: Tahasang ipaliwanag bilang walang hanggang kaparusahan o pangwakas na paghatol
  rationale: Ang Pahayag mismo ang nagbibigay ng mas malawak na konteksto sa katawagang ito; hindi dapat ipasok sa talata ang isang mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong “dinggin” at pinili ang “makinig.” Ginamit ang “iglesya” bilang karaniwan at kontekstuwal na tawag sa mga kongregasyon. Walang talababa dahil walang kinakailangang mahalagang tekstuwal o leksikal na alternatibo na hindi kayang katawanin ng pangunahing salin.
