  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: tl
  text: 'Ngunit ito ang mayroon ka: kinapopootan mo ang mga gawa ng mga Nicolaita[a], na kinapopootan ko rin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga gawa” ay maaari ring isaling “mga gawain.” Tumutukoy ang salitang Griyego sa kanilang mga kilos o gawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinahihiwatig ang pagsalungat sa naunang konteksto at angkop sa marangal ngunit likas na modernong Tagalog.
- source_word: τοῦτο ἔχεις
  choice: ito ang mabuti sa iyo
  rationale: Ang literal na 'ito ay taglay mo' ay hindi likas sa Tagalog sa ganitong gamit. Ipinahahayag ng salin ang positibong bagay na kinikilala sa kausap nang hindi ito pinalalawak bilang gantimpala o merito.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng tutuldok ang nilalaman ng bagay na kinikilala sa kausap, gaya ng gamit ng ὅτι rito.
- source_word: μισεῖς
  choice: kinapopootan mo
  rationale: Pinananatili ang matinding diwa ng μισέω at iniiwasang palambutin bilang simpleng hindi pagsang-ayon.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Tuwirang tumutukoy sa mga kilos o gawain ng pangkat, hindi sa mga tao mismo.
- source_word: τῶν Νικολαϊτῶν
  choice: ng mga Nicolaita
  rationale: Karaniwang anyong Tagalog ng transliteradong pangalan ng pangkat; ang maramihang pantukoy ay nagpapakitang mga kasapi ng pangkat ang tinutukoy.
- source_word: ἃ
  choice: na
  rationale: Likas na pang-ugnay sa Tagalog na malinaw na bumabalik sa 'mga gawa.'
- source_word: κἀγὼ
  choice: ko rin
  rationale: Pinananatili ang diwang 'ako rin' at ang pakikiayon ng nagsasalita sa pagtanggi sa mga gawa.
- source_word: μισῶ
  choice: kinapopootan
  rationale: Inuulit ang kaparehong pandiwa upang mapanatili ang mahalagang leksikal na pagkakatulad sa μισεῖς.
theological_decisions:
- issue: Ang layon ng pagkapoot
  choice: Ang mga gawa ng mga Nicolaita ang kinapopootan, hindi tahasang ang mga Nicolaita mismo.
  alternative: Isang maluwag na salin na maaaring magpahiwatig na ang mga tao mismo ang kinapopootan.
  rationale: Ang τὰ ἔργα ang tuwirang layon ng μισεῖς, kaya dapat manatiling malinaw na ang kanilang mga gawa o gawi ang hinahatulan.
- issue: Pakikiayon ng nagsasalita sa paninindigan ng iglesya
  choice: na kinapopootan ko rin
  alternative: na ayaw ko rin
  rationale: Pinananatili ng salin ang tahasang pakikiayon ng nagsasalita at ang lakas ng μισέω, sa halip na palambutin ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'kinapopootan' upang mapanatili ang lakas ng pandiwang Griyego at ang pag-uulit nito, habang malinaw na ang mga gawa—hindi tahasang ang mga tao—ang layon.
