id: REV.2.24
reference: Revelation 2:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: tl
  text: Ngunit sinasabi ko sa iba pa sa inyo na nasa Tiatira—sa lahat ng hindi nanghahawakan sa turong ito at hindi nakaalam ng malalalim na bagay ni Satanas, gaya ng sinasabi nila[a]—hindi ako nagpapataw sa inyo ng iba pang pasanin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kalaliman ni Satanas.” Maaaring inuulit ng pananalitang Griyego ang pag-aangking may “malalim” na kaalamang espirituwal, ngunit tinatanggihan ito ni Juan. Hindi tiyak kung sino ang tinutukoy ng “sinasabi nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς
  choice: sa iba sa inyo
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa natitirang mga kaanib na kaiba sa mga yumakap sa naturang turo.
- source_word: ἐν Θυατείροις
  choice: na nasa Tiatira
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan ng lugar at iniugnay ito nang natural sa mga taong kinakausap.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: nanghahawakan sa turong ito
  rationale: Ipinahahayag ang pagyakap o pananatili sa isang turo, hindi lamang ang literal na pagkakaroon nito.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: hindi nakaalam
  rationale: Pinananatili ang malawak na diwa ng γινώσκω na maaaring tumukoy sa pagkilala, pagkaalam, o pagdanas, nang hindi ipinapasok sa teksto ang isang tiyak na paliwanag.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: malalalim na bagay ni Satanas
  rationale: Malapit sa literal na anyo at pinananatili ang posibleng mapanuyang pagtukoy sa inaangking malalim na kaalamang espirituwal.
- source_word: ὡς λέγουσιν
  choice: gaya ng sinasabi nila
  rationale: Hindi tinutukoy nang higit sa Griyego kung sino ang nagsasalita o kung ang buong parirala ang bansag nila, kaya nananatili ang siksik at malabong retorika ng orihinal.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: hindi ako nagpapataw sa inyo ng iba pang pasanin
  rationale: Natural na Tagalog para sa idyomang 'maglagay ng pasanin sa' at pinananatili ang larawan ng isang ipinapataw na obligasyon.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng “malalalim na bagay ni Satanas, gaya ng sinasabi nila”
  choice: Isinalin ang parirala bilang iniulat o mapanuyang katawagan nang hindi nililinaw kung ang mga bulaang guro ang nag-angking may “malalalim na bagay” at si Juan ang nag-ugnay nito kay Satanas, o kung ang buong parirala ang mapanuyang bansag.
  alternative: Tahasang sabihing ang mga bulaang guro ay nag-angking may malalim na kaalaman ngunit kinilala ni Juan na mula ito kay Satanas.
  rationale: Pahihintulutan ng Griyego ang higit sa isang pag-unawa. Dapat panatilihin ang tunay na kalabuan at polemikong puwersa sa halip na lutasin ito sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang em dash upang maihiwalay ang mahabang paglalarawan sa mga kinakausap, habang iniingatan ang daloy at diin ng pangungusap.
