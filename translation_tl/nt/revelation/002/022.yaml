id: REV.2.22
reference: Revelation 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: tl
  text: Narito, ihahagis ko siya sa isang higaan[a], at ihahagis ko sa matinding paghihirap[b] ang mga nangangalunya kasama niya, malibang magsisi sila at talikuran ang mga gawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa higaan ng karamdaman.” Literal na “sa isang higaan” ang nasa Griyego; sa konteksto, nauunawaan ito ng marami bilang higaan ng pagdurusa o karamdaman bilang hatol.
    reason: lexical_alternative
  - marker: b
    text: O “sa matinding kapighatian.” Tumutukoy ang parirala sa matinding pagdurusa o kagipitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan mo
  rationale: Isang natural at makabagong panawag-pansin na nagpapanatili sa biglang diin ng interjection.
- source_word: βάλλω
  choice: ihahagis ko
  rationale: Ipinahahayag ang nalalapit at mariing paghatol; likas sa Tagalog ang anyong panghinaharap sa ganitong propetikong pahayag.
- source_word: αὐτὴν εἰς κλίνην
  choice: siya sa isang higaan
  rationale: Pinananatili ang literal na kahulugan ng κλίνη at hindi ipinapasok sa pangunahing teksto ang interpretasyong higaan ng karamdaman.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: ang mga nangangalunya sa kaniya
  rationale: Tuwirang inililipat ang kongkretong diwa ng μοιχεύω habang hinahayaang manatiling bukas sa konteksto ang posibleng simbolikong kahulugan.
- source_word: εἰς θλῖψιν μεγάλην
  choice: sa matinding paghihirap
  rationale: Likas at malinaw na Filipino para sa matinding pagdurusa o kagipitan, nang hindi awtomatikong nagdadala ng teknikal na eskatolohikal na pakahulugan.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: malibang talikuran nila
  rationale: Sa kasunod na ἐκ, ipinakikita ng pagsisisi ang pagtalikod mula sa mga gawa; natural ang pariralang ito sa Filipino.
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: ang mga gawa niya
  rationale: Pinananatili ang malinaw na pagtukoy sa mga gawa ng babae at ang diwa ng pagtalikod mula sa mga iyon.
theological_decisions:
- issue: Kung ang κλίνη ay dapat tahasang isaling “higaan ng karamdaman”
  choice: Panatilihin ang literal na “higaan” sa pangunahing teksto
  alternative: higaan ng karamdaman
  rationale: Bagaman malinaw na paghatol ang konteksto at maaaring ipahiwatig ang sakit o pagdurusa, hindi likas na nangangahulugang “higaan ng karamdaman” ang κλίνη. Inilalagay ang interpretasyong iyon sa talababa.
- issue: Kung literal na pangangalunya, espirituwal na pagtataksil, o kapuwa ang μοιχεύοντας
  choice: Isalin bilang “mga nangangalunya” at hayaang ipahiwatig ng konteksto ang mas malawak na bisa
  alternative: mga gumagawa ng seksuwal na imoralidad sa kaniya; mga nagtataksil kasama niya
  rationale: Ang μοιχεύω ay tuwirang tumutukoy sa pangangalunya. Hindi dapat alisin ng salin ang kongkretong larawan kahit maaari rin itong magkaroon ng simboliko o espirituwal na puwersa sa Pahayag.
- issue: Kung kaninong mga gawa ang dapat talikuran ayon sa αὐτῆς
  choice: Panatilihin ang “mga gawa niya,” na tumutukoy sa babae
  alternative: kanilang mga gawa
  rationale: Ang SBLGNT na ibinigay ay may αὐτῆς, pambabaeng isahan. Kaya hindi ito dapat gawing “kanilang” kahit may ibang tekstuwal na tradisyon o mas madaling pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Tingnan mo” bilang tuwirang panawag-pansin at “nangangalunya” upang mapanatili ang kongkretong talinghaga. Inulit ang “ihahagis ko” sa ikalawang sugnay para sa kalinawan sa Tagalog, bagaman ipinahihiwatig lamang ito sa Griyego.
