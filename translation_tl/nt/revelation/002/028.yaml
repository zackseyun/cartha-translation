base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: tl
  text: kung paanong tinanggap ko rin mula sa aking Ama, at ibibigay ko sa kanya ang tala sa umaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tala ng bukang-liwayway.” Maaaring tumukoy ang parirala sa maharlika at mesiyanikong larawan at maaari rin itong paunang magpahiwatig ng Pahayag 22:16, kung saan ipinakikilala ni Jesus ang sarili bilang “maningning na tala sa umaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: kung paanong tinanggap ko rin
  rationale: Ipinapakita ng “kung paanong” ang paghahambing sa naunang pangako, at pinananatili ng “rin” ang dagdag na diin ng κἀγώ.
- source_word: εἴληφα
  choice: tinanggap ko
  rationale: Likas sa Tagalog ang aspektong naganap ng “tinanggap,” at sa konteksto ay ipinahihiwatig nitong nananatili ang bunga ng pagtanggap. Mas angkop ang “tinanggap” kaysa “kinuha” dahil malinaw na ang Ama ang pinagmulan.
- source_word: παρὰ τοῦ πατρός μου
  choice: mula sa aking Ama
  rationale: Tuwirang ipinahahayag ang pinagmulan at pinananatili ang ugnayang Ama-Anak nang walang idinagdag na paliwanag na teolohikal.
- source_word: καὶ δώσω αὐτῷ
  choice: at ibibigay ko sa kanya
  rationale: Pinananatili ang panghinaharap na kilos at ang panghalip na tumutukoy sa nagtagumpay sa naunang konteksto.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: ang tala sa umaga
  rationale: Likas at marangal na salin ito ng larawan ng bituing nakikita sa bukang-liwayway, nang hindi ipinapaliwanag sa pangunahing teksto kung ano o sino ang sinasagisag nito.
theological_decisions:
- issue: Pagkakakilanlan o kahulugan ng “tala sa umaga”
  choice: Panatilihin ang metapora bilang “ang tala sa umaga” nang walang paliwanag sa pangunahing teksto.
  alternative: Maaaring tumukoy sa maharlika o mesiyanikong tagumpay, kay Cristo mismo batay sa Pahayag 22:16, o sa kaluwalhatian at gantimpala sa wakas.
  rationale: Hindi tahasang binibigyang-kahulugan ng talata ang sagisag. Pinananatili ng salin ang sadyang kalabuan at inilalagay sa talababa ang mahahalagang posibleng alusyon.
- issue: Ugnayang Cristolohikal sa “mula sa aking Ama”
  choice: Isalin nang tuwiran bilang “mula sa aking Ama.”
  alternative: Palawakin bilang pagtanggap ng ipinagkatiwalang awtoridad mula sa Ama.
  rationale: Pinananatili nito ang hayag na wikang ukol sa pagiging Anak at sa pagtanggap, nang hindi nagdaragdag ng sistematikong paliwanag na wala sa mismong parirala.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tala” sa halip na “bituin” upang maging maikli at angkop sa tradisyonal na larawang “morning star,” habang nananatiling madaling maunawaan; ipinapaliwanag sa talababa ang alternatibong “tala ng bukang-liwayway.”
