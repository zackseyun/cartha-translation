id: REV.2.12
reference: Revelation 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: tl
  text: 'At sumulat ka sa anghel ng iglesya sa Pergamo: “Ito ang sinasabi ng may matalas na tabak na magkabila ang talim:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero” sa halip na “anghel.” Hindi nagkakaisa ang mga tagapagpaliwanag kung ito ay isang makalangit na nilalang o isang taong kumakatawan sa iglesya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Maaaring tumukoy ang ἄγγελος sa makalangit na anghel o sa taong mensahero. Pinananatili ng “anghel” ang karaniwang pananalita sa Pahayag at ang hindi tiyak na pagkakakilanlan nito.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Sa kontekstong Kristiyano, tumutukoy ito sa lokal na kapulungan ng mga mananampalataya. Ang “iglesya” ay malinaw at likas sa modernong Filipino.
- source_word: γράψον
  choice: sumulat ka
  rationale: Tuwirang isinasalin ang aorist imperative bilang isang malinaw na utos.
- source_word: Τάδε λέγει
  choice: Ito ang sinasabi
  rationale: Likas itong pormula sa Filipino para sa pormal na pagpapahayag, habang malinaw na ipinakikilala ang kasunod na mensahe.
- source_word: ὁ ἔχων
  choice: ang may
  rationale: Maikli at natural na katumbas ng articular participle, na pinananatili ang bisa nito bilang titulo o paglalarawan.
- source_word: ῥομφαίαν
  choice: tabak
  rationale: Ang “tabak” ay marangal at madaling maunawaang salin ng uri ng malaking sandata na tinutukoy, nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: δίστομον
  choice: magkabila ang talim
  rationale: Likas na Filipino para sa tabak na may dalawang talim at malinaw na ipinapahayag ang larawan ng Griyego.
- source_word: ὀξεῖαν
  choice: matalas
  rationale: Tuwirang inilalarawan ang talas ng tabak.
- source_word: Περγάμῳ
  choice: Pergamo
  rationale: Karaniwang anyong Filipino ng pangalang Griyegong Πέργαμος.
theological_decisions:
- issue: Pagkakakilanlan ng “anghel” ng iglesya
  choice: Panatilihin ang “anghel” sa pangunahing teksto nang hindi tinutukoy kung makalangit o tao ang tinutukoy.
  alternative: mensahero; lider o kinatawan ng iglesya; makalangit na kinatawan
  rationale: Hindi nilulutas ng talata ang saklaw ng ἄγγελος. Pinananatili ng salin at talababa ang tunay na leksikal at teolohikal na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Ito ang sinasabi” bilang natural na pormal na pormula, “iglesya” para sa lokal na pamayanang Kristiyano, at “magkabila ang talim” upang maging malinaw at idiomatiko ang larawan ng δίστομον.
