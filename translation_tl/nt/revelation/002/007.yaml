    rationale: Ang δώσω αὐτῷ φαγεῖν ay “ipagkakaloob ko sa kanya na kumain.” Maaaring magpahiwatig ang konstruksyon ng ipinagkaloob na pribilehiyo, ngunit hindi nito tahasang sinasabing “karapatan”; kaya dapat iwasan ang dagdag na legal na konsepto.
