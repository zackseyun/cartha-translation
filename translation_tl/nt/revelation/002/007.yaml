id: REV.2.7
reference: Revelation 2:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: tl
  text: Ang may pandinig ay makinig sa sinasabi ng Espiritu sa mga iglesya. Ipagkakaloob ko sa nagtatagumpay[a] na kumain mula sa punongkahoy ng buhay, na nasa paraiso ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang dumadaig” o “ang nagwawagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ang may pandinig
  rationale: Isinasalin ang idyomatikong isahang parirala ayon sa likas na gamit sa Filipino; tumutukoy ito sa sinumang may kakayahang makinig at umunawa, hindi lamang sa pisikal na pagkakaroon ng isang tainga.
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Pinananatili ang lakas ng ikatlong panauhang pautos sa isang natural at marangal na anyong Filipino.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa paulit-ulit na pormula sa Pahayag 2–3, ang tinutukoy ay ang Espiritu Santo; ipinahihiwatig ito ng malaking titik nang hindi nagdaragdag ng salita sa teksto.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: sinasabi ... sa mga iglesya
  rationale: Likas na ipinapahayag ng kasalukuyang panahunan ang patuloy at tuwirang pananalita ng Espiritu sa mga lokal na iglesya.
- source_word: τῷ νικῶντι
  choice: Ang nagtatagumpay
  rationale: Iningatan ang aktibong pandiwang diwa ng νικάω at ang larawan ng tagumpay na mahalaga sa Pahayag; inilagay sa talababa ang maaari ring saling 'Ang nanaig.'
- source_word: δώσω αὐτῷ φαγεῖν
  choice: ay bibigyan ko ng karapatang kumain
  rationale: Ang literal na 'bibigyan ko siyang kumain' ay maaaring magpahiwatig sa Filipino na pakakainin lamang siya. Ang 'bibigyan ... ng karapatang kumain' ay malinaw na naghahatid ng ipinagkaloob na pahintulot na nakapaloob sa konstruksiyon, bagaman bahagyang eksplisito.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: mula sa punongkahoy ng buhay
  rationale: Pinananatili ng 'mula sa' ang puwersa ng ἐκ, at ang 'punongkahoy ng buhay' ay malinaw na nag-uugnay sa larawan sa Genesis at sa kasunod na bahagi ng Pahayag.
- source_word: παραδείσῳ
  choice: paraiso
  rationale: Pinananatili ang eskatolohikal at intertekstuwal na bigat ng παράδεισος sa halip na gawing karaniwang 'hardin.'
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili ang maikli at malawak na puwersa ng genitive.
theological_decisions:
- issue: Tinutukoy ng τὸ πνεῦμα
  choice: ang Espiritu Santo, na tinukoy bilang 'Espiritu'
  alternative: isang pangkalahatang espiritu
  rationale: Ang paulit-ulit na pahayag sa Pahayag 2–3 ay banal na pakikipag-usap sa mga iglesya; ang malaking titik ay tanda lamang ng kontekstuwal na pagkakakilanlan.
- issue: Diwa ng νικάω sa pormula ng pangako
  choice: nagtatagumpay
  alternative: nanaig / nagwawagi
  rationale: Iniiwasang takdaan kung anong tiyak na anyo ng pagtatagumpay ang tinutukoy habang pinananatili ang larawan ng tagumpay at patuloy na pakikibaka.
- issue: Kinatawang isahan sa ὁ ἔχων οὖς at ἀκουσάτω
  choice: Ang may pandinig ay makinig
  alternative: Sinumang may pandinig ay makinig
  rationale: Nananatili ang isahang kinatawang anyo ngunit hindi kailangang magdagdag ng panghalip na may kasarian, sapagkat walang gramatikal na kasarian ang natural na anyong Filipino.
- issue: Puwersa ng δώσω αὐτῷ φαγεῖν
  choice: bibigyan ... ng karapatang kumain
  alternative: bibigyan ... na kumain / pakakainin
  rationale: Ipinapakita nito na ang pagkain mula sa punongkahoy ay isang ipinagkaloob na pribilehiyo. Hindi ginamit ang 'pakakainin' dahil maaari nitong baguhin ang larawan tungo sa aktuwal na pagpapakain.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'iglesya' bilang karaniwang terminong biblikal para sa ἐκκλησία, at 'punongkahoy' upang mapanatili ang maringal at intertekstuwal na tunog ng parirala.
