base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: tl
  text: Kaya kayo rin ay may mga taong nanghahawakan sa turo ng mga Nicolaita sa gayunding paraan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gayundin” o “katulad din.” Maaaring idiin ng Griyego na nanghahawakan sila sa turong ito sa paraang maihahambing sa mga binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Likas na nag-uugnay sa naunang pagsaway at nagpapanatili ng paghahambing o pagbubuod na ipinahihiwatig ng Griyego.
- source_word: ἔχεις καὶ σὺ
  choice: mayroon din sa inyo
  rationale: Ipinahahayag sa natural na Tagalog na ang tinutukoy na mga tao ay kabilang sa kongregasyon, habang pinananatili ng “din” ang diin ng καὶ σὺ.
- source_word: κρατοῦντας
  choice: na nanghahawakan
  rationale: Ipinakikita ang patuloy at matibay na pagkapit sa isang turo nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: τὴν διδαχὴν
  choice: sa turo
  rationale: Ang “turo” ay malinaw, kasalukuyan, at hindi labis na teknikal na katumbas ng διδαχή.
- source_word: Νικολαϊτῶν
  choice: ng mga Nicolaita
  rationale: Ginagamit ang nakikilalang anyong Tagalog ng pangalan ng pangkat.
- source_word: ὁμοίως
  choice: sa gayunding paraan
  rationale: Pinananatili ang paghahambing sa naunang talata at ang bahagyang kalabuan kung tumutukoy ito sa paraan ng panghahawak o sa mas malawak na pagkakatulad ng sitwasyon.
theological_decisions:
- issue: Saklaw ng ὁμοίως sa pangungusap
  choice: Ilagay sa hulihan bilang “sa gayunding paraan,” na maaaring iugnay sa panghahawak sa turo o sa buong kalagayang inihahambing sa talata 14.
  alternative: “Gayundin, mayroon sa inyo…”
  rationale: Hindi tiyak sa Griyego kung tuwirang inilalarawan ng ὁμοίως ang paraan ng panghahawak o ang kabuuang paghahambing sa naunang talata. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Ginamit ang “mayroon din sa inyo” sa halip na literal ngunit di-likas na “mayroon ka,” sapagkat isang kongregasyon ang kinakausap; pinanatili naman ang tuwirang pagsaway at ang ugnayan sa naunang talata.
