review_pass:
  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang paghahambing ng οὕτως, ang diin ng καὶ σὺ, ang diwa ng κρατοῦντας, at ang huling ὁμοίως. Gayunman, ang konstruksyong “mayroon din sa inyo na nanghahawakan” ay hindi ganap na natural at hindi malinaw na minamarkahan ang mga taong tinutukoy ng participle.
  naturalness: Kailangan ng maliit na rebisyon para maging likas at malinaw sa modernong Filipino Tagalog. Ang “may mga taong nanghahawakan” ay maayos na katumbas ng “have those who hold,” samantalang pinananatili ng “kayo rin” ang diin ng Griyego.
  terminology: Ang “turo,” “nanghahawakan,” at “mga Nicolaita” ay angkop at pare-pareho ang rehistro. Ang “sa gayunding paraan” ay medyo pormal ngunit katanggap-tanggap at kapaki-pakinabang upang huwag lutasin ang sintaktikong saklaw ng ὁμοίως.
  issues:
  - severity: medium
    issue: Hindi ganap na likas ang “mayroon din sa inyo na nanghahawakan.”
    rationale: Ang Tagalog na existential na “mayroon ... na” sa anyong ito ay maaaring magtunog bitin o malabo. Ang Griyegong κρατοῦντας ay tumutukoy sa mga tao; kaya mas malinaw at natural ang “may mga taong nanghahawakan.”
  revised_text: Kaya kayo rin ay may mga taong nanghahawakan sa turo ng mga Nicolaita sa gayunding paraan.[a]
