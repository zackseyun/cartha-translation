revisions:
- from: Huwag mong katakutan ang malapit mo nang pagdusahan. Masdan mo, ipapasok ng diyablo sa bilangguan ang ilan sa inyo upang subukin kayo[a], at daranas kayo ng matinding paghihirap sa loob ng sampung araw. Maging tapat ka hanggang kamatayan[b], at ibibigay ko sa iyo ang putong ng buhay.[c]
  to: Huwag kang matakot sa mga malapit mo nang pagdusahan. Tingnan mo, malapit nang ipabilanggo ng diyablo ang ilan sa inyo upang kayo'y masubok[a], at makararanas kayo ng kapighatian sa loob ng sampung araw. Maging tapat ka hanggang kamatayan[b], at ibibigay ko sa iyo ang putong ng buhay[c].
  rationale: Inayos ang pangunahing usaping panggramatika sa πειρασθῆτε sa pamamagitan ng balintiyak na “kayo'y masubok.” Idinagdag ang “malapit nang” sa pagkilos ng diyablo upang maipakita ang μέλλει, at pinasigla ang unang utos at pangtawag-pansin para sa likas na modernong Filipino. Hindi binago ang kahulugan, ang saklaw ng “hanggang kamatayan,” o ang pagkakaiba ng putong at diadema.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:04:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Kailangang gawing malinaw ang tinig na balintiyak ng πειρασθῆτε: ang kahulugan ay “upang kayo''y masubok,” hindi ang aktibong “upang subukin kayo.” Dapat ding maipakita sa ikalawang pangungusap ang nalalapit na kilos ng μέλλει. Ang binagong teksto ay pinananatili ang isahang kausap sa simula at wakas, at ang maramihang “inyo/kayo” sa gitna, gaya ng Griyego.'
  naturalness: Mas natural sa makabagong Filipino ang “Huwag kang matakot sa mga malapit mo nang pagdusahan” kaysa “Huwag mong katakutan ang malapit mo nang pagdusahan.” Ang “Tingnan mo” ay malinaw at likas na pangtawag-pansin. Ang “malapit nang ipabilanggo” ay maayos na naghahatid ng nalalapit na pagkabilanggo nang hindi gumagamit ng di-likas na literal na “ihagis.”
  terminology: Pinanatili ang “diyablo,” “bilangguan,” “kapighatian,” at “putong ng buhay.” Ang “kapighatian” ay angkop na marangal na katumbas ng θλῖψις at hindi nagdaragdag ng antas ng tindi na wala sa salita mismo. Ang “putong” ay nililinaw sa talababa bilang gantimpalang putong, hindi maharlikang diadema.
  issues:
  - severity: medium
    issue: Aktibo ang “upang subukin kayo” para sa πειρασθῆτε.
    rationale: 'Ang πειρασθῆτε ay aorist passive subjunctive: “upang kayo''y masubok” o “upang kayo''y ilagay sa pagsubok.” Ang aktibong ayos ay maaaring magmungkahi na ang diyablo lamang ang tuwirang sumusubok sa kanila at hindi tumpak na naihahatid ang gramatika ng Griyego.'
  - severity: medium
    issue: Hindi naipahayag sa ikalawang pangungusap ang pagka-nalalapit ng μέλλει βάλλειν.
    rationale: Ang “ipapasok ng diyablo” ay panghinaharap ngunit hindi malinaw na naghahatid ng imminence na ipinahahayag ng μέλλει. Ang “malapit nang ipabilanggo” ay mas tapat sa aspekto ng pinagmulan.
  - severity: low
    issue: Medyo di-likas ang “Huwag mong katakutan ang malapit mo nang pagdusahan.”
    rationale: Mas idiomatiko ang “Huwag kang matakot sa mga malapit mo nang pagdusahan,” at mas malinaw nitong naihahatid ang pangmaramihang bagay ng ἃ.
  revised_text: Huwag kang matakot sa mga malapit mo nang pagdusahan. Tingnan mo, malapit nang ipabilanggo ng diyablo ang ilan sa inyo upang kayo'y masubok[a], at makararanas kayo ng kapighatian sa loob ng sampung araw. Maging tapat ka hanggang kamatayan[b], at ibibigay ko sa iyo ang putong ng buhay[c].
