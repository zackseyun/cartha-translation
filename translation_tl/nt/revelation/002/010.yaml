id: REV.2.10
reference: Revelation 2:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: tl
  text: Huwag kang matakot sa mga malapit mo nang pagdusahan. Tingnan mo, malapit nang ipabilanggo ng diyablo ang ilan sa inyo upang kayo'y masubok[a], at makararanas kayo ng kapighatian sa loob ng sampung araw. Maging tapat ka hanggang kamatayan[b], at ibibigay ko sa iyo ang putong ng buhay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang kayo'y tuksuhin” o “upang kayo'y ilagay sa pagsubok.” Ang pandiwang Griyego ay maaaring tumukoy sa pagsubok, paglalagay sa pagsubok, o pagtukso, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “hanggang kamatayan” ay maaari ring mangahulugang “kahit humantong sa kamatayan”—samakatuwid, manatiling tapat kahit kamatayan ang kapalit.
    reason: alternative_reading
  - marker: c
    text: Ang salitang Griyego para sa “putong” (stephanos) ay tumutukoy sa putong na iginagawad sa nagwagi o bilang gantimpala, hindi sa maharlikang korona o diadema.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Huwag mong katakutan
  rationale: Likas na makabagong Tagalog para sa pautos na nagbabawal matakot; pinananatili rin ang isahang kausap sa pandiwang may “mong.”
- source_word: ἃ μέλλεις πάσχειν
  choice: ang malapit mo nang pagdusahan
  rationale: Ipinapahayag ng μέλλω ang nalalapit na pangyayari, at ang πάσχειν ay ang pagdanas ng hirap o pagdurusa.
- source_word: ἰδοὺ
  choice: Masdan mo
  rationale: Tawag-pansin ito sa susunod na pahayag; marangal ngunit mauunawaan sa kasalukuyang Tagalog.
- source_word: μέλλει βάλλειν ... εἰς φυλακήν
  choice: ipapasok ... sa bilangguan
  rationale: Sa kontekstong ito, ang literal na “ihahagis” ay hindi likas sa Tagalog. Ang “ipapasok sa bilangguan” ay malinaw na naghahatid ng nalalapit na pagkabilanggo.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Dito ang salita ay titulo ng personal na espirituwal na kalaban, hindi lamang pangkalahatang “maninirang-puri.”
- source_word: ἐξ ὑμῶν
  choice: ang ilan sa inyo
  rationale: Ipinahihiwatig ng parirala na isang bahagi lamang ng buong pangkat ang ibibilanggo.
- source_word: ἵνα πειρασθῆτε
  choice: upang subukin kayo
  rationale: Saklaw ng πειράζω ang pagsubok, paglalagay sa pagsubok, o pagtukso. Ang “subukin” ang pinakanababagay sa pag-uusig sa konteksto, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: ἕξετε θλῖψιν
  choice: daranas kayo ng matinding paghihirap
  rationale: Inihahatid nito ang mabigat at mapaniil na pagdurusang tinutukoy ng θλῖψις nang mas natural kaysa sa hiram na “tribulasyon.”
- source_word: ἡμερῶν δέκα
  choice: sa loob ng sampung araw
  rationale: Natural na Tagalog para sa genitibong nagsasaad ng haba ng panahon.
- source_word: γίνου πιστός
  choice: Maging tapat ka
  rationale: Direktang pautos na sumasaklaw sa pagpasok at pananatili sa kalagayan ng katapatan.
- source_word: ἄχρι θανάτου
  choice: hanggang kamatayan
  rationale: Malapit sa anyo ng Griyego at hindi nililimitahan ang kahulugan sa pagkamartir lamang, bagaman maaaring kasama iyon.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: ang putong ng buhay
  rationale: Pinananatili ang genitibong parirala at ang tradisyonal ngunit malinaw na “putong”; ipinaliliwanag sa talababa na στέφανος ay gantimpalang putong, hindi koronang maharlika.
theological_decisions:
- issue: Kahulugan ng πειρασθῆτε sa konteksto ng diyablo at pag-uusig
  choice: subukin
  alternative: tuksuhin o ilagay sa pagsubok
  rationale: Ang pagkabilanggo at pagdurusa ay sumusukat sa katapatan, ngunit hindi ipinagkakait ng salin ang mas malawak na saklaw ng pandiwang Griyego; nasa talababa ang tunay na leksikal na kalabuan.
- issue: Saklaw ng ἄχρι θανάτου
  choice: hanggang kamatayan
  alternative: kahit humantong sa kamatayan
  rationale: Pinananatili ng pangunahing salin ang payak na temporal na anyo at ang posibilidad ng katapatan sa buong buhay, samantalang ipinakikita ng talababa na maaari rin itong tumukoy sa katapatang humaharap sa pagkamartir.
- issue: Larawan ng στέφανος
  choice: putong
  alternative: korona
  rationale: Ang tinutukoy ay putong ng tagumpay o gantimpala, hindi maharlikang diadema; iniiwasan nitong ipasok ang ideya ng paghaharing hindi tuwirang nakasaad sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paglipat mula sa isahang kausap (“mo/ka/iyo”) tungo sa maramihan (“inyo/kayo”) at pabalik, gaya ng Griyego. Iniwasan ang sobrang literal na “ihahagis sa bilangguan” at ang teknikal na “tribulasyon,” ngunit pinanatili ang bigat ng pag-uusig at ang mga tunay na kalabuan ng teksto sa mga talababa.
