  to: Ang may tainga ay makinig sa sinasabi ng Espiritu sa mga iglesya. Sa nagtatagumpay[a] ay magbibigay ako ng bahagi ng nakatagong manna. Bibigyan ko rin siya ng isang puting bato[b], at ng isang bagong pangalang nakasulat sa bato, na walang nakaaalam maliban sa tumatanggap.
