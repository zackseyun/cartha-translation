id: REV.2.17
reference: Revelation 2:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: tl
  text: Ang may tainga ay makinig sa sinasabi ng Espiritu sa mga iglesya. Sa nagtatagumpay[a] ay magbibigay ako ng bahagi ng nakatagong manna. Bibigyan ko rin siya ng isang puting bato[b], at ng isang bagong pangalang nakasulat sa bato, na walang nakaaalam maliban sa tumatanggap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa nananaig.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring magpahiwatig ang “puting bato” ng batong pamboto, tanda ng pagpapawalang-sala, o tanda ng pagpasok; hindi tinutukoy ng teksto kung alin sa mga ito ang nilalayon.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ang may tainga
  rationale: Pinananatili ang isahang anyo at ang matalinghagang panawagan ng Griyego. Likas at malinaw sa Filipino ang pariralang “ang may tainga.”
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ang pautos na “makinig” ay natural na katumbas ng aorist imperative at nagpapanatili sa diin ng panawagan.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Tumutukoy ito sa banal na Espiritu sa paulit-ulit na pormula sa Pahayag, ngunit hindi idinaragdag ang salitang “Banal,” na wala rito sa Griyego.
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Ang “mga iglesya” ay angkop at karaniwang tawag sa mga kongregasyong pinatutungkulan sa konteksto.
- source_word: τῷ νικῶντι
  choice: Sa nagtatagumpay
  rationale: Ipinahahayag ng kasalukuyang participle ang taong nagtatagumpay o nananaig. Ang “nagtatagumpay” ay malinaw at nagpapanatili sa temang tagumpay sa Pahayag.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: bahagi ng nakatagong manna
  rationale: Ipinakikita ng “bahagi ng” ang partitive na diwa ng genitive pagkatapos ng “magbibigay,” samantalang pinananatili ng “nakatagong manna” ang kalagayang inilihim o itinago.
- source_word: ψῆφον λευκήν
  choice: isang puting bato
  rationale: Maaaring tumukoy ang ψῆφος sa isang maliit na bato na ginagamit bilang boto o tanda, ngunit hindi tinutukoy ng talata ang tiyak na gamit nito. Ang payak na “puting bato” ang hindi labis na mapagpakahulugan.
- source_word: ἐπὶ τὴν ψῆφον
  choice: sa bato
  rationale: Natural nitong ipinahahayag sa Filipino ang kinalalagyan ng nakasulat na pangalan.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: may nakasulat na isang bagong pangalan
  rationale: Likas ang ayos na ito sa Filipino at pinananatili ang diwa ng isang pangalang naisulat na at nananatiling nakasulat.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: na walang nakaaalam kundi ang tumatanggap nito
  rationale: Ang sugnay ay inuugnay sa “bagong pangalan.” Pinananatili ng “kundi” ang eksklusibong pagbubukod, at nililinaw ng “nito” ang bagay na tinatanggap nang hindi higit na tinutukoy kung ang diin ay nasa bato o sa pangalang taglay nito.
theological_decisions:
- issue: Isahang anyo na may pangkalahatang saklaw
  choice: Panatilihin ang isahang “ang may tainga,” “siya,” at “ang tumatanggap,” na maaaring tumukoy sa sinumang kabilang sa saklaw ng pangako.
  alternative: Gumamit ng maramihang anyo o ulitin ang pangngalan upang iwasan ang panghalip.
  rationale: Isahang panlalaki ang gramatikal na anyo sa Griyego ngunit pangkalahatan ang gamit. Hindi kailangang markahan ng kasarian ang mga pariralang Filipino, kaya napapanatili ang bilang at ang pangkalahatang saklaw nang walang idinaragdag na kasarian.
- issue: Kahulugan ng ψῆφος λευκή
  choice: Isalin lamang bilang “isang puting bato” at ilagay sa talababa ang mga posibleng kaugnayang pangkultura.
  alternative: Tukuyin ito bilang batong pamboto, tanda ng pagpapawalang-sala, o tanda ng pagpasok.
  rationale: Hindi ipinapaliwanag ng teksto kung aling simbolikong pinagmulan ang nilalayon. Ang hindi pagpili sa isa ay nagpapanatili sa tunay na kalabuan ng larawan.
- issue: Kung ano ang eksaktong tinatanggap sa huling sugnay
  choice: Gamitin ang malawak na “tumatanggap nito,” na natural na tumutukoy sa ipinagkaloob na batong may pangalan.
  alternative: Sabihing “tumatanggap ng bato” o “tumatanggap ng pangalan.”
  rationale: Hindi inuulit ng Griyego ang tuwirang layon ng λαμβάνων. Ang mas tiyak na pagtukoy sa bato o pangalan ay maaaring magsara sa isang bahagyang bukas na ugnayan sa teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iglesya,” “Espiritu,” at “manna” bilang pamilyar na bokabularyong biblikal. Iniwasan ang sobrang literal na ayos ng mga salita kapag magiging asiwa ito sa Filipino, ngunit pinanatili ang isahang panawagan, ang paulit-ulit na pagbibigay, at ang kalabuan ng simbolo ng puting bato.
