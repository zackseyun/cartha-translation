id: REV.2.5
reference: Revelation 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: tl
  text: Kaya alalahanin mo kung mula saan ka nahulog[a]. Magsisi ka at gawin mo ang mga ginawa mo noong una. Ngunit kung hindi, pupunta ako sa iyo at aalisin ko ang iyong patungan ng ilawan mula sa kinalalagyan nito[b], malibang magsisi ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa anong taas ka nahulog.” Literal na sinasabi ng Griyego, “mula saan ka nahulog”; ipinapalagay ng ilan na may pahiwatig itong talinghaga ng taas.
    reason: lexical_alternative
  - marker: b
    text: Ang “patungan ng ilawan” ay larawang ginagamit para sa isang iglesya sa Pahayag 1:20.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: alalahanin mo
  rationale: Likas na pautos sa modernong Tagalog; naipahihiwatig ng konteksto ang patuloy na paggunita nang hindi ginagawang alanganin ang pangungusap.
- source_word: οὖν
  choice: kaya
  rationale: Malinaw at natural na nag-uugnay sa utos sa naunang pagsaway bilang bunga o kongklusyon nito.
- source_word: πόθεν
  choice: kung mula saan
  rationale: Pinananatili ang literal na diwa ng pinagmulan nang hindi tahasang idinaragdag ang ideya ng taas.
- source_word: πέπτωκας
  choice: ka nahulog
  rationale: Pinananatili ang talinghaga ng pagkahulog at hindi ipinapasok ang mas tiyak na teolohikal na kahulugan ng lubusang pagtalikod.
- source_word: μετανόησον / μετανοήσῃς
  choice: magsisi ka
  rationale: Karaniwan, malinaw, at angkop na salin sa kontekstong moral at espirituwal.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: gawin mo ang mga ginawa mo noong una
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa mga gawaing katangian ng una nilang kalagayan.
- source_word: εἰ δὲ μή
  choice: Ngunit kung hindi
  rationale: Pinananatili ang biglang kondisyunal na babala at ang pagsalungat sa naunang utos.
- source_word: ἔρχομαί σοι
  choice: pupunta ako sa iyo
  rationale: Natural na Filipino para sa nalalapit na pagdating; hindi idinaragdag ang interpretibong 'laban sa iyo,' na wala sa Griyego.
- source_word: κινήσω
  choice: aalisin ko
  rationale: Bagaman maaaring literal na 'ililipat,' ipinakikita ng kasunod na pariralang 'mula sa kinalalagyan nito' na pag-aalis sa puwesto ang diwa rito.
- source_word: τὴν λυχνίαν σου
  choice: ang iyong patungan ng ilawan
  rationale: Tinutukoy ng λυχνία ang patungan, hindi ang mismong ilawan; pinananatili rin nito ang konkretong larawan sa Pahayag.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: mula sa kinalalagyan nito
  rationale: Direkta at natural na paglalarawan ng pag-aalis sa kasalukuyang puwesto.
- source_word: ἐὰν μὴ μετανοήσῃς
  choice: malibang magsisi ka
  rationale: Maikli at tumpak na pinananatili ang negatibong kondisyon ng babala.
theological_decisions:
- issue: Kahulugan ng babala tungkol sa patungan ng ilawan
  choice: Panatilihin ang simbolikong larawan ng pag-aalis sa patungan ng ilawan ng iglesya nang hindi ipinapaliwanag bilang isang tiyak na sistematikong doktrina.
  alternative: Ipaliwanag ito bilang pagkawala ng patotoo ng iglesya, paghatol sa pag-iral o katayuan nito, o pagkawala ng kaligtasan.
  rationale: Sa Pahayag 1:20, ang mga patungan ng ilawan ay kumakatawan sa mga iglesya. Gayunman, hindi tahasang nilulutas ng talata ang lahat ng implikasyon nito para sa iglesya o sa kaligtasan ng bawat tao, kaya pinananatili ang larawan at teolohikal na tensiyon.
- issue: Direksiyon ng pagdating ni Cristo
  choice: pupunta ako sa iyo
  alternative: pupunta ako laban sa iyo
  rationale: Malinaw na mapanghatol ang konteksto, ngunit hindi tahasang nasa pariralang ἔρχομαί σοι ang 'laban sa iyo'; iniiwasang idagdag sa pangunahing teksto ang interpretasyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang 'kaya,' 'magsisi,' at 'pupunta' sa halip na mas lumang anyo, habang pinanatili ang konkretong apokaliptikong larawan at ang tunay na kalabuan ng teksto.
