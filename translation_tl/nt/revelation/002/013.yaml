  to: Alam ko kung saan ka naninirahan—kung saan naroon ang trono ni Satanas. Gayunman, mahigpit mong pinanghahawakan ang aking pangalan, at hindi mo itinanggi ang aking pananampalataya[a], kahit noong mga araw ni Antipas, ang aking saksi[b], ang tapat sa akin, na pinatay sa gitna ninyo, kung saan naninirahan si Satanas.
