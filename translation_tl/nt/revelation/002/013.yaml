id: REV.2.13
reference: Revelation 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: tl
  text: Alam ko kung saan ka naninirahan—kung saan naroon ang trono ni Satanas. Gayunman, mahigpit mong pinanghahawakan ang aking pangalan, at hindi mo itinanggi ang aking pananampalataya[a], kahit noong mga araw ni Antipas, ang aking saksi[b], ang tapat sa akin, na pinatay sa gitna ninyo, kung saan naninirahan si Satanas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananampalataya sa akin” o “aking katapatan.” Ang maikling pariralang Griyego na “aking pananampalataya” ay maaaring maunawaan sa higit sa isang paraan.
    reason: alternative_reading
  - marker: b
    text: O “ang aking martir.” Ang salitang Griyego ay nangangahulugang “saksi,” ngunit sa konteksto ng pagdurusa o kamatayan ay maaari rin itong magtaglay ng diwang “martir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Alam ko
  rationale: Tuwiran at likas na salin ng pandiwang may kasalukuyang diwang “nalalaman ko.”
- source_word: κατοικεῖς
  choice: ka naninirahan
  rationale: Ipinahahayag ang matatag na paninirahan sa isang lugar; mas angkop sa marangal na rehistro kaysa sa payak na “nakatira ka.”
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: kung saan naroon ang trono ni Satanas
  rationale: Pinananatili ang matinding larawang apokaliptiko nang walang idinagdag na paliwanag kung ano ang tinutukoy ng trono.
- source_word: κρατεῖς
  choice: mahigpit mong pinanghahawakan
  rationale: Ipinakikita ang matatag at patuloy na katapatan, hindi lamang ang literal na paghawak.
- source_word: τὸ ὄνομά μου
  choice: ang aking pangalan
  rationale: Pinananatili ang kongkretong salitang “pangalan” at ang kaakibat nitong diwa ng pagkilala at katapatan nang hindi ito pinapaliwanag sa mismong teksto.
- source_word: οὐκ ἠρνήσω
  choice: hindi mo itinanggi
  rationale: Likas at tuwirang katumbas ng pagtanggi o pagkakaila.
- source_word: τὴν πίστιν μου
  choice: ang pananampalataya sa akin
  rationale: Sa konteksto, likas itong tumutukoy sa pananampalatayang nakatuon kay Cristo. Inilalahad sa talababa ang mas literal at sadyang masaklaw na anyong “aking pananampalataya.”
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: noong mga araw ni Antipas
  rationale: Malapit sa anyo ng Griyego at malinaw na panandang temporal sa Tagalog.
- source_word: ὁ μάρτυς μου
  choice: ang aking saksi
  rationale: Ang pangunahing kahulugan ng μάρτυς ay “saksi”; dahil pinatay si Antipas, ang posibleng diwang “martir” ay inilagay sa talababa.
- source_word: ὁ πιστός μου
  choice: ang tapat sa akin
  rationale: Pinananatiling hiwalay na paglalarawan ang πιστός at iniiwasang idagdag ang salitang “lingkod,” na wala sa Griyego.
- source_word: ἀπεκτάνθη
  choice: pinatay
  rationale: Malinaw at tuwirang salin ng pasibong pandiwa; hindi idinaragdag ang mas tiyak na legal o moral na diwa ng “pinaslang.”
- source_word: παρ’ ὑμῖν
  choice: sa gitna ninyo
  rationale: Ipinahahayag na nangyari ang pagpatay sa kanilang kinaroroonan nang hindi ipinahihiwatig na sila mismo ang pumatay kay Antipas.
theological_decisions:
- issue: Kahulugan ng τὴν πίστιν μου
  choice: “ang pananampalataya sa akin” sa pangunahing teksto
  alternative: “ang aking pananampalataya,” na maaari ring tumukoy sa pananampalatayang kaugnay kay Cristo o sa kanyang katapatan
  rationale: Pinili sa pangunahing teksto ang pinakaangkop at natural na kahulugan sa konteksto, ngunit hindi ikinubli ang masinsing ambiguity ng pariralang Griyego; pinanatili ito sa talababa.
- issue: Kahulugan ng μάρτυς sa konteksto ng kamatayan
  choice: “saksi” sa pangunahing teksto
  alternative: “martir”
  rationale: “Saksi” ang batayang kahulugan at mahalaga sa teolohiya ng Pahayag. Gayunman, dahil pinatay si Antipas dahil sa kanyang patotoo, may makatwirang diwang “martir,” kaya inilalahad ito sa talababa.
- issue: Pagkakakilanlan ng “trono ni Satanas”
  choice: Pinanatili ang larawan nang walang paliwanag
  alternative: Tukuyin ito bilang isang partikular na dambana, kapangyarihang pampolitika, o sentro ng kulto
  rationale: Hindi tuwirang nililinaw ng talata ang historikal na tinutukoy ng larawan, kaya hindi dapat pumili ang salin ng isang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “naninirahan” at “pinanghahawakan” upang mapanatili ang solemneng tono ng pahayag ni Cristo, habang iniwasan ang lipas o labis na eklesiyastikong pananalita. Ang “ang tapat sa akin” ay bahagyang di-karaniwang apposition ngunit sadyang pinili upang mapanatili ang hiwalay na paglalarawan sa Griyego nang hindi nagdaragdag ng “lingkod.”
