  terminology: Ang “saksi” para sa μάρτυς at “martir” bilang alternatibo sa talababa ay wasto. Ang “trono ni Satanas,” “aking pangalan,” at “pinatay sa gitna ninyo” ay angkop. Panatilihin ang “ang tapat sa akin” bilang hiwalay na paglalarawan ng πιστός, nang hindi idinadagdag ang “lingkod.”
