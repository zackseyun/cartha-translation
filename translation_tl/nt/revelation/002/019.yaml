  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: tl
  text: Alam ko ang iyong mga gawa—ang iyong pag-ibig, pananampalataya[a], paglilingkod, at pagtitiis—at ang mga sumunod mong gawa ay mas marami kaysa sa mga nauna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katapatan.” Maaaring mangahulugan ang salitang Griego ng pananampalataya o katapatan sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Alam ko
  rationale: Ang οἶδα ay may pangkasalukuyang stative na diwa; natural at tuwiran sa Filipino ang “Alam ko.”
- source_word: ἔργα
  choice: mga gawa
  rationale: Tumutukoy ito sa kongkretong pagkilos o mga ginawa, at pinananatili ng “mga gawa” ang pag-uulit ng salita sa talata.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Karaniwan at angkop na salin para sa ἀγάπη bilang aktibong birtud.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Pinananatili nito ang pangunahing kahulugang “faith,” habang inilalahad sa talababa ang posibleng diwang “katapatan.”
- source_word: διακονίαν
  choice: paglilingkod
  rationale: Naghahayag ng praktikal na serbisyo nang hindi nagpapahiwatig ng isang pormal na tungkulin sa iglesya.
- source_word: ὑπομονήν
  choice: pagtitiis
  rationale: Natural na Filipino para sa matatag na pananatili sa gitna ng hirap o pagsubok.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: ang mga gawa mo ngayon
  rationale: Sa paghahambing sa τῶν πρώτων, temporal ang ἔσχατα at tumutukoy sa mga huling-kasalukuyang gawa, hindi sa “pinakahuli” sa absolutong diwa.
- source_word: πλείονα τῶν πρώτων
  choice: mas marami ... kaysa noong una
  rationale: Pinananatili ang pangunahing komparatibong diwa ng πλείονα bilang higit sa dami o lawak at nililinaw ang paghahambing sa mga naunang gawa.
theological_decisions:
- issue: Kahulugan ng πίστις sa talaan ng mga birtud
  choice: pananampalataya
  alternative: katapatan
  rationale: Maaaring tumukoy ang πίστις sa pagtitiwala o sa pagiging tapat. Hindi tiyak na nilulutas ng konteksto ang dalawang posibilidad, kaya nasa pangunahing teksto ang karaniwang “pananampalataya” at nasa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Gumamit ng em dash upang malinaw na ilahad ang mga bagay na kabilang sa “mga gawa,” at iniwasan ang sobrang literal ngunit di-natural na “mga huling gawa.”
