reference: Revelation 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: tl
  text: 'At isulat mo sa anghel[a] ng iglesya sa Tiatira: “Ganito ang sinasabi ng Anak ng Diyos, na may mga matang tulad ng ningas ng apoy at mga paang tulad ng pinakinang na tanso[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero.”
    reason: alternative_reading
  - marker: b
    text: Bihira ang salitang Griyego rito, at hindi tiyak ang eksaktong uri ng metal. Maaaring mas pangkalahatan itong tumukoy sa isang pinino at kumikinang na metal o haluang metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Ang “anghel” ang karaniwang kahulugan sa paulit-ulit na pormula ng paghaharap sa pitong iglesya sa Pahayag. Posible rin ang “mensahero,” kaya pinanatili iyon sa talababa.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Tumutukoy ito rito sa kinikilalang pamayanang Kristiyano; natural at malinaw sa makabagong Filipino ang “iglesya.”
- source_word: Τάδε λέγει
  choice: Ganito ang sinasabi
  rationale: Pinananatili nito ang maringal na pormulang propetiko habang natural ang daloy sa Filipino.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Tuwirang pinananatili ang hayag na titulo at ang ugnayang ipinahahayag ng Griyego.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: mga matang tulad ng ningas ng apoy
  rationale: Malapit sa paghahambing sa Griyego at pinananatili ang matingkad na larawang apokaliptiko.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: mga paang tulad ng tansong pinakinang
  rationale: Ipinahahayag ang larawan ng makinang at pinong metal nang hindi lubusang ikinukubli ang kawalang-katiyakan sa pambihirang terminong χαλκολίβανον; ipinaliliwanag ito sa talababa.
theological_decisions:
- issue: Ang titulo ng nagsasalita bilang ὁ υἱὸς τοῦ θεοῦ
  choice: Anak ng Diyos
  alternative: Walang paraprasis na gumagawang titulo lamang sa tungkulin
  rationale: Hayagang ginagamit ng teksto ang titulong ito; pinanatili ito nang tuwiran at hindi pinalambot o pinalawak.
- issue: Ang tinutukoy ng ἀγγέλῳ sa paghaharap sa Tiatira
  choice: anghel
  alternative: mensahero
  rationale: Mas umaangkop ang “anghel” sa apokaliptikong konteksto at sa paulit-ulit na pormula sa Pahayag, ngunit tunay na posibleng kahulugan ang “mensahero,” kaya hindi ito isinara at inilagay sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ganito ang sinasabi” upang mapanatili ang pormulang propetiko, at inilagay ang mga talababa sa mismong mga salitang may tunay na leksikal na kalabuan.
