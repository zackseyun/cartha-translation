  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: tl
  text: 'Ngunit may laban ako sa iyo: iniwan mo ang pag-ibig mo noong una.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinalikuran mo ang una mong pag-ibig.” Maaaring tumukoy ang parirala sa pag-ibig na taglay mo noong una—sa Panginoon, sa isa’t isa, o sa kapuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa naunang papuri, sa dignidad na angkop sa pahayag.
- source_word: ἔχω κατὰ σοῦ
  choice: may laban ako sa iyo
  rationale: Likas na idyomang Filipino para sa pagkakaroon ng paratang o reklamo laban sa isang tao, at pinananatili ang puwersa ng pagsaway.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng tutuldok ang nilalaman ng paratang nang hindi ito binibigyang-kahulugang sanhi gaya ng maaaring ipahiwatig ng “sapagkat.”
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Karaniwan at tuwirang katumbas ng ἀγάπη sa modernong Filipino.
- source_word: τὴν πρώτην
  choice: noong una
  rationale: Sa Filipino, likas nitong inilalarawan ang pag-ibig na taglay sa simula habang iniiwasang tukuyin kung kanino nakatuon ang pag-ibig.
- source_word: ἀφῆκες
  choice: iniwan mo
  rationale: Tuwirang inilalarawan ang pagtalikod o pag-iwan sa dating pag-ibig. Pinananatili rin nito ang saklaw ng ἀφίημι nang hindi labis na pinatitindi gaya ng “tinalikuran.”
theological_decisions:
- issue: Ang tinutukoy ng “pag-ibig mo noong una”
  choice: Hindi tinukoy kung ito ay pag-ibig sa Panginoon, sa isa’t isa, o sa kapuwa.
  alternative: ang una mong pag-ibig; ang pag-ibig mo sa akin noong una
  rationale: Maikli at bukás ang pariralang Griyego. Ang salin ay hindi nagpapasya sa isang referent na hindi tahasang tinukoy ng teksto.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “pag-ibig mo noong una” sa pangunahing teksto dahil mas likas ito kaysa “una mong pag-ibig” at napapanatili nito ang tunay na kalabuan ng pariralang Griyego.
