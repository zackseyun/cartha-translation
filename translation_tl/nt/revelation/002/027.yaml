  source_fidelity: Ang “papastulan niya sila” ay napapanatili ang larawan ng ποιμανεῖ, at ang “tungkod na bakal” ay tapat sa ἐν ῥάβδῳ σιδηρᾷ. Ngunit ang “gaya ng pagdurog sa mga sisidlang luwad” ay nagiging pangngalang parirala na may di-tiyak na gumaganap at hindi malinaw na naihahayag ang pasibong pandiwang συντρίβεται. Mas tapat ang isang sugnay na nagsasabing ang mga sisidlan mismo ay nadudurog.
  naturalness: Marangal at nauunawaan ang kabuuang rehistro. Mas natural at mas malinaw sa modernong Filipino ang “gaya ng mga sisidlang palayok na nadudurog” kaysa “gaya ng pagdurog sa mga sisidlang luwad.”
  terminology: Ang “papastulan,” “tungkod na bakal,” at talababa tungkol sa maharlikang diwa ay angkop at hindi nilulutas ang tensiyong pastoral at maharlika ng alusyon sa Awit 2. Ang “mga sisidlang palayok” ay malinaw na katumbas ng τὰ σκεύη τὰ κεραμικά at umaayon sa larawan ng palayok sa Awit 2:9.
  issues:
