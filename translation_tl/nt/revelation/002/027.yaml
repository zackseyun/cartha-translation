  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: tl
  text: at papastulan niya sila sa pamamagitan ng tungkod na bakal[a], gaya ng mga sisidlang palayok na nadudurog[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamamahalaan niya sila sa pamamagitan ng tungkod na bakal.” Literal na nangangahulugang “magpastol” ang pandiwa, ngunit sa alusyong ito sa Awit 2 ay dala rin nito ang diwa ng maharlikang pamamahala.
    reason: alternative_reading
  - marker: b
