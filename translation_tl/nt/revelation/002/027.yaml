lexical_decisions:
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang pang-ugnay sa naunang pangako.
- source_word: ποιμανεῖ
  choice: papastulan niya
  rationale: Pinananatili nito ang literal na larawan ng pagpapastol habang hinahayaan ang konteksto ng Awit 2 na magpahiwatig ng maharlikang pamamahala at kapangyarihan.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: sa pamamagitan ng tungkod na bakal
  rationale: Ang “tungkod” ay likas na katumbas ng ῥάβδος at naipapaloob kapwa ang larawan ng pastol at ang mapuwersang kapangyarihang ipinahihiwatig ng talata.
- source_word: ὡς
  choice: gaya ng
  rationale: Natural na nagpapakilala ng paghahambing sa modernong Tagalog.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: mga sisidlang luwad
  rationale: Ang “sisidlan” ay katumbas ng pangkalahatang σκεῦος, at ipinakikita ng “luwad” ang marupok na materyal na tinutukoy ng κεραμικός.
- source_word: συντρίβεται
  choice: pagdurog
  rationale: Malinaw na ipinahahayag ang marahas at ganap na pagkabasag; ang anyong parirala ay natural kasunod ng “gaya ng” at hindi pilit na ginagaya ang isahang pandiwang Griyego na kasama ng maramihang neutrong simuno.
theological_decisions:
- issue: Maharlika at mesiyanikong alusyon sa Awit 2:9 sa pamamagitan ng ποιμανεῖ at ng tungkod na bakal
  choice: Panatilihin sa pangunahing teksto ang larawang “papastulan,” habang ipinapaliwanag sa talababa na maaari rin itong tumukoy sa pamamahala.
  alternative: “pamamahalaan niya sila sa pamamagitan ng tungkod na bakal”
  rationale: ποιμαίνω ang ginamit sa Griyego, hindi isang pangkalahatang pandiwa lamang para sa pamamahala. Pinananatili ng salin ang tensiyon sa pagitan ng pangangalaga ng pastol at ng maharlika at mapanghatol na kapangyarihan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawang pastoral sa “papastulan” at ang matinding larawan ng paghatol sa “pagdurog,” nang hindi nilulutas ang sadyang tensiyon ng teksto.
