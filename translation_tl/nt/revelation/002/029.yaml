  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: tl
  text: Ang may tainga ay makinig sa sinasabi ng Espiritu sa mga iglesya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang artikulo at pangkasalukuyang pandiwari ay gumaganap bilang pangngalan. Likas at maikli sa Filipino ang “Ang may,” at napapanatili nito ang pangkalahatan ngunit isahang panawagan.
- source_word: οὖς
  choice: tainga
  rationale: Isahan ang salitang Griyego. Ang “may tainga” ay natural na pormulang Filipino at tumutukoy hindi lamang sa pisikal na pandinig kundi sa kakayahang tumanggap ng mensahe.
- source_word: ἀκουσάτω
  choice: ay makinig
  rationale: Ikatlong panauhang pautos ang anyo. Mas natural sa modernong Filipino ang “makinig” kaysa sa literal na “dinggin,” at malinaw nitong naihahatid ang utos na bigyang-pansin at tugunan ang mensahe.
- source_word: τί
  choice: sa sinasabi
  rationale: Ang τί ang nilalaman ng sinasabi ng Espiritu. Sa Filipino, likas na naipapaloob ang “kung ano” sa pariralang “makinig sa sinasabi,” nang hindi nababawasan ang kahulugan.
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa paulit-ulit na pormula sa Pahayag 2–3, ang tinutukoy ay ang banal na Espiritung nagsasalita sa mga iglesya. Ang malaking titik ay nagpapahiwatig ng referent na ito nang walang idinadagdag na paliwanag sa talata.
- source_word: λέγει
  choice: sinasabi
  rationale: Ang pangkasalukuyang anyo ay angkop na isalin bilang “sinasabi,” na natural sa Filipino at maaaring magpahiwatig ng kasalukuyan o patuloy na pagsasalita.
- source_word: ταῖς ἐκκλησίαις
  choice: sa mga iglesya
  rationale: Sa konteksto ng Pahayag 2–3, tumutukoy ang ἐκκλησίαις sa mga kongregasyong pinadalhan ng mga mensahe. Ang “mga iglesya” ay malinaw, karaniwan, at kontekstuwal na tumpak.
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: ang banal na Espiritung nagsasalita sa mga iglesya
  alternative: isang espiritu ng tao, o ang espiritu/mensahe ni Jesus
  rationale: Sa paulit-ulit na pangwakas na panawagan sa Pahayag 2–3, ang Espiritu ay inihaharap bilang banal na tagapagsalita sa lahat ng iglesya. Pinananatili ng “Espiritu” ang pagkakakilanlang ito nang hindi nagdaragdag ng “Banal” na wala sa mismong parirala.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Pinanatili ang isahang “tainga” at ang solemneng lakas ng pautos, ngunit ginamit ang natural na “makinig” sa halip na mas makaluma o mas literal na “dinggin.”
