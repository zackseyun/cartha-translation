  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: tl
  text: Binigyan ko siya ng panahon upang magsisi[a], ngunit ayaw niyang magsisi sa kanyang seksuwal na imoralidad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “magsisi mula sa kanyang seksuwal na imoralidad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκα αὐτῇ χρόνον
  choice: Binigyan ko siya ng panahon
  rationale: Ang aorist na ἔδωκα ay natural na ipinahahayag sa payak na aspektong naganap, at ang χρόνον ay tuwirang nangangahulugang isang panahong ipinagkaloob.
- source_word: ἵνα μετανοήσῃ
  choice: upang magsisi
  rationale: Ipinahahayag ng ἵνα kasama ng subjunctive ang layunin; malinaw at natural sa Tagalog ang “upang magsisi.”
- source_word: οὐ θέλει
  choice: ayaw niya
  rationale: Ang θέλει ay tumutukoy sa kalooban o pagnanais. Ang “ayaw niya” ay likas sa modernong Tagalog at hindi lumalabis na gaya ng tahasang “tumanggi siya.”
- source_word: μετανοῆσαι
  choice: magsisi
  rationale: Inuulit sa Griyego ang pandiwa para sa pagsisisi; pinanatili ang pag-uulit upang maingatan ang diin.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: sa kanyang seksuwal na imoralidad
  rationale: Karaniwang ginagamit sa Tagalog ang “magsisi sa” para sa bagay na pinagsisisihan. Pinananatili ng “seksuwal na imoralidad” ang tiyak na saklaw ng πορνεία, habang ipinapaliwanag sa talababa ang puwersa ng ἐκ, “mula sa.”
theological_decisions:
- issue: Kahulugan ng πορνεία sa isang apokaliptikong pagsaway
  choice: seksuwal na imoralidad
  alternative: imoralidad; pakikiapid; prostitusyon
  rationale: Ang πορνεία ay maaaring literal o metaporikal sa panitikang propetiko at apokaliptiko. Ang konkretong salin ay nagpapanatili sa karaniwang leksikal na kahulugan nang hindi ipinipilit na lubos itong alegorikal, ngunit hinahayaan pa rin ang konteksto na magpahiwatig ng kaugnayan sa idolatriya.
- issue: Ugnayan ng pagsisisi at ἐκ (“mula sa”)
  choice: magsisi sa kanyang seksuwal na imoralidad, na may talababa sa mas literal na anyo
  alternative: magsisi at tumalikod sa kanyang seksuwal na imoralidad
  rationale: Ang pangunahing teksto ay gumagamit ng natural na pariralang Tagalog, samantalang pinananatili ng talababa ang tunay na puwersa ng Griyegong ἐκ at ang ideya ng pagtalikod mula sa gawain.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “seksuwal” bilang kasalukuyang pamantayang baybay at iniwasan ang mas makaluma o mas makitid na “pakikiapid.”
