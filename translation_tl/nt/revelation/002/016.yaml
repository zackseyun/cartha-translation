id: REV.2.16
reference: Revelation 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: tl
  text: Kaya magsisi ka. Ngunit kung hindi, darating ako sa iyo agad, at makikipagdigma ako laban sa kanila[a] gamit ang tabak ng aking bibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring literal na isalin ang parirala na “kasama nila,” ngunit sa konteksto ng pakikidigma, ang diwa nito ay “laban sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tabak ng aking bibig” ay isang apokaliptikong larawan ng salita o pahayag ni Cristo na nagsasagawa ng paghatol.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: magsisi ka
  rationale: Ang aorist imperative ay nananawagan ng tiyak at kagyat na pagsisisi. Likas at malinaw sa modernong Tagalog ang “magsisi ka” at pinananatili nito ang moral at espirituwal na bigat ng salita.
- source_word: οὖν
  choice: kaya
  rationale: Ipinakikita nito na ang utos ay bunga ng naunang pagsaway. Mas natural sa kasalukuyang Tagalog ang “kaya” kaysa sa mas pormal na “samakatuwid.”
- source_word: εἰ δὲ μή
  choice: ngunit kung hindi
  rationale: Pinananatili nito ang tahasang pagsalungat ng δέ at ang kondisyon ng μή.
- source_word: ἔρχομαί σοι
  choice: darating ako sa iyo
  rationale: Ang pangkasalukuyang anyo ng Griyego ay may diwang nalalapit na pagdating. Sa Tagalog, natural itong ihayag sa “darating ako”; hindi idinagdag ang “laban sa iyo” sapagkat sa kasunod na sugnay pa tahasang tinutukoy ang pakikidigma laban sa kanila.
- source_word: ταχύ
  choice: agad
  rationale: Maikli at natural na katumbas ito na maaaring magpahiwatig ng mabilis o nalalapit na pagkilos nang hindi labis na nililinaw ang diin.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: makikipagdigma ako laban sa kanila
  rationale: Pinananatili ng “makikipagdigma” ang matinding larawang militar. Nililinaw ng “laban sa kanila” ang adversatibong diwa ng parirala sa konteksto.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: gamit ang tabak
  rationale: Ang ἐν ay instrumental dito. Ang “gamit ang” ay malinaw at natural na nagpapahayag ng kasangkapan ng paghatol.
- source_word: τῇ ῥομφαίᾳ
  choice: tabak
  rationale: Sapat na naihahatid ng “tabak” ang apokaliptikong larawan nang hindi nagdaragdag ng espesipikong anyo o laki na maaaring maging mapagpakahulugan.
- source_word: τοῦ στόματός μου
  choice: ng aking bibig
  rationale: Pinananatili ang genitibong ayos at ang kakaibang apokaliptikong larawang nasa teksto sa halip na ipaliwanag ito bilang “aking salita.”
theological_decisions:
- issue: Ang saklaw ng banta ni Cristo sa iglesya at sa mga gumagawa ng mali
  choice: Pinananatili ang pagkakaiba ng pagdating “sa iyo” at pakikidigma “laban sa kanila.”
  alternative: Sabihing darating si Cristo laban sa buong iglesya, o sabihing ang pagdating niya ay para lamang sa mga gumagawa ng mali.
  rationale: Isahan ang kausap sa “sa iyo,” ngunit “sila” ang tahasang layon ng pakikidigma. Pinananatili ng salin ang dalawang elemento at ang tensiyon sa pagitan ng sama-samang babala at nakatutok na paghatol.
- issue: Ang tabak bilang kasangkapan ng paghatol
  choice: Pinanatili ang “tabak ng aking bibig” bilang apokaliptikong larawan.
  alternative: Palitan ito ng paliwanag na “aking salita” o “kapangyarihan ng aking pananalita.”
  rationale: Ang tahasang larawan ng pinagmulang teksto ay may pampanitikan at teolohikal na bigat; ang pagpaparaprasang paliwanag ay magpapalabo rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kaya” at “agad” para sa likas na daloy, habang pinanatili ang matinding utos, babala, at kakaibang apokaliptikong larawan ng orihinal.
