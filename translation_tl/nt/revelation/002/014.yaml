  verdict: revise
  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang ilang paratang, mga taong kumakapit sa turo ni Balaam, ang pagtuturo kay Balak na maglagay ng katitisuran, at ang dalawang resultang gawa. Ang “upang kumain sila” ay wastong nagpapakita ng layon/bungang ipinahihiwatig ng infinitives nang hindi nilalagyan ng di-nasa-teksto na paliwanag.'
  naturalness: Malinaw at angkop ang kabuuang rehistro. Gayunman, ang “gumawa ng seksuwal na imoralidad” ay hindi gaanong likas na kolokasyon sa modernong Filipino. Ang “magsagawa ng seksuwal na imoralidad” ay mas matatas habang pinananatili ang malawak na saklaw ng πορνεῦσαι.
  terminology: Ang “turo,” “katitisuran,” “pagkaing inihandog sa mga diyos-diyosan,” at mga pangalang Balaam at Balak ay angkop. Pinananatili ng “mga anak na lalaki ni Israel” ang panlalaking anyo ng υἱῶν; ang talababa ay nagbibigay ng mas idyomatiko ngunit hindi eksklusibong mga alternatibo.
  issues:
