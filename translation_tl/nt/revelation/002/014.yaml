id: REV.2.14
reference: Revelation 2:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: tl
  text: 'Ngunit mayroon akong ilang bagay laban sa iyo: may ilan diyan na nanghahawak sa turo ni Balaam, na nagturo kay Balak na maglagay ng katitisuran sa harap ng mga anak na lalaki ni Israel[a], upang kumain sila ng pagkaing inihandog sa mga diyos-diyosan at magsagawa ng seksuwal na imoralidad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Israel” o “mga Israelita.” Sa Griyego, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: ilang bagay
  rationale: Ang pang-uring neuter plural ay ginagamit bilang pangngalan; likas sa Tagalog na gawing tahas ang ipinahihiwatig na “mga bagay.”
- source_word: κρατοῦντας
  choice: nanghahawak sa
  rationale: Ipinahihiwatig dito ang patuloy na paninindigan o pagsunod sa isang turo, hindi ang literal na paghawak.
- source_word: τὴν διδαχὴν Βαλαάμ
  choice: turo ni Balaam
  rationale: Ang “turo” ay malinaw, kasalukuyan, at hindi gaanong teknikal kaysa “doktrina,” habang tapat sa διδαχή.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: nagturo kay Balak
  rationale: Likas na salaysay sa Tagalog ang payak na nagdaang anyo; sa kontekstong ito, hindi kailangang gawing tahas ang aspektong duratibo ng imperfect.
- source_word: βαλεῖν σκάνδαλον
  choice: maglagay ng katitisuran
  rationale: Pinananatili ang metapora ng σκάνδαλον bilang sanhi ng pagkakasala o pagbagsak, sa anyong pamilyar sa wikang biblikal ngunit nauunawaan pa rin.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: mga anak na lalaki ni Israel
  rationale: Pinananatili sa pangunahing teksto ang tahasang panlalaking υἱῶν at ang tradisyonal na pagtukoy kay Israel bilang ninuno.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: kumain sila ng pagkaing inihandog sa mga diyos-diyosan
  rationale: Nililinaw ang kultikong kahulugan ng εἰδωλόθυτα; idinagdag ang “sila” upang maging malinaw at natural ang ugnayan ng infinitive sa mga Israelita.
- source_word: πορνεῦσαι
  choice: gumawa ng seksuwal na imoralidad
  rationale: Saklaw nito ang ipinagbabawal na seksuwal na asal nang hindi pinakikitid ang malawak na kahulugan ng πορνεύω.
theological_decisions:
- issue: Kung pananatilihin ang tahasang panlalaking anyo ng τῶν υἱῶν Ἰσραήλ
  choice: mga anak na lalaki ni Israel
  alternative: mga anak ni Israel; mga Israelita
  rationale: Ang pangunahing salin ay sumusunod sa tahasang υἱῶν, habang inilalagay sa talababa ang mas idyomatikong mga katumbas upang hindi ikubli ang anyo ng Griyego.
- issue: Kung literal na metapora o dinamikong pagpapakahulugan ang gagamitin para sa σκάνδαλον
  choice: katitisuran
  alternative: bitag; dahilan upang magkasala
  rationale: Pinananatili ng “katitisuran” ang metapora at ang teolohikal na tensiyon ng pag-akit tungo sa pagkakasala nang hindi ito labis na ipinapaliwanag.
- issue: Ugnayan ng mga infinitive na φαγεῖν at πορνεῦσαι sa katitisuran
  choice: upang kumain sila ... at gumawa
  alternative: na kumain ... at gumawa
  rationale: Ang “upang” ay likas na nagpapakita na ito ang layon o bunga ng inilagay na katitisuran, ngunit hindi tinutukoy nang higit pa kung paano isinagawa ang pag-akay.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “diyan” para sa ἐκεῖ bilang tuwirang pagtukoy sa kinaroroonan ng mga kausap, at pinanatili ang biblikal na metaporang “katitisuran.”
