id: REV.2.2
reference: Revelation 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: tl
  text: Alam ko ang mga gawa mo, ang pagpapagal at pagtitiyaga mo. Alam ko rin na hindi mo kayang tiisin[a] ang masasamang tao. Sinubok mo ang mga nagsasabing mga apostol sila ngunit hindi naman sila mga apostol, at natuklasan mong huwad sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi mo kinukunsinti.” Mas literal ang Griyego na “hindi mo kayang tiisin,” ngunit sa kontekstong ito maaari itong mangahulugang tumatangging magparaya sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Alam ko
  rationale: Tuwiran at natural na katumbas ng pandiwang nagsasaad ng kasalukuyang kaalaman, habang pinananatili ang personal na pagsusuri sa kapulungan.
- source_word: ἔργα
  choice: mga gawa
  rationale: Malawak ang saklaw nito at maaaring tumukoy sa mga kilos at gawain; ang “mga gawa” ay natural din sa bokabularyong biblikal sa Tagalog.
- source_word: κόπον
  choice: pagpapagal
  rationale: Ipinahihiwatig ng κόπος ang mabigat at nakapapagod na paggawa; mas malinaw itong naipapahayag ng “pagpapagal” kaysa sa pangkalahatang “paggawa.”
- source_word: ὑπομονήν
  choice: pagtitiyaga
  rationale: Ipinapahayag nito ang matatag na pagpapatuloy sa gitna ng hirap. Natural at madaling maunawaan ang “pagtitiyaga” sa modernong Tagalog.
- source_word: οὐ δύνῃ βαστάσαι
  choice: hindi mo kayang tiisin
  rationale: Pinananatili nito ang literal na larawan ng hindi pagdadala o pagtitiis, at sa konteksto ay natural na nangangahulugang hindi pagpapahintulot o pagkunsinti.
- source_word: κακούς
  choice: masasamang tao
  rationale: Ang pang-uri ay ginagamit bilang pangngalan para sa mga tao. Nililinaw ng salin ang tinutukoy nang hindi nagdaragdag ng kasariang hindi kinakailangan ng konteksto.
- source_word: ἐπείρασας
  choice: Sinubok mo
  rationale: Pinananatili ng “sinubok” ang diwa ng pagsusuri sa katotohanan ng kanilang pag-aangkin nang hindi ipinapalagay ang tiyak na paraan ng pagsubok.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: mga nagsasabing mga apostol sila
  rationale: Natural sa Tagalog at malinaw na pinananatili ang diwa ng sariling pag-aangkin sa katayuang apostoliko.
- source_word: ἀποστόλους
  choice: mga apostol
  rationale: Sa konteksto ng kapulungan at pag-aangkin ng awtoridad, malamang na teknikal na titulo ang gamit, hindi lamang pangkalahatang “mga sugo.”
- source_word: εὗρες αὐτοὺς ψευδεῖς
  choice: natuklasan mong huwad sila
  rationale: Ang “natuklasan” ay angkop sa kinalabasan ng pagsubok, at ang “huwad” ay pinananatiling nakatuon sa pagiging hindi tunay ng kanilang pag-aangkin nang hindi sapilitang pinatitingkad bilang “mga sinungaling.”
theological_decisions:
- issue: Katayuan ng mga nag-aangking “mga apostol”
  choice: Panatilihin ang teknikal na katawagang “mga apostol.”
  alternative: mga sugo
  rationale: Ang konteksto ay pagsusuri sa mga nag-aangkin ng awtoridad sa loob ng mga kapulungan. Pinananatili ng “mga apostol” ang malamang na teknikal na diwa nang hindi nagdaragdag ng isang tiyak na sistemang pang-institusyon.
- issue: Lakas ng hatol na ψευδεῖς
  choice: Isalin bilang “huwad.”
  alternative: mga sinungaling
  rationale: Maaaring ilarawan ng salita ang mga tao bilang bulaang tagapag-angkin o mga sinungaling. Ang “huwad” ay mas malapit sa agarang usapin ng hindi tunay na pag-aangking apostoliko at hindi nilulutas nang lampas sa teksto kung ang diin ay sa kanilang pagkakakilanlan o sa kanilang pagsisinungaling.
- issue: Kawalan ng kakayahan o pagtangging magparaya sa kasamaan
  choice: “hindi mo kayang tiisin” na may talababa tungkol sa kontekstuwal na diwa
  alternative: hindi mo kinukunsinti
  rationale: Ang Griyego ay tahasang gumagamit ng pananalitang “hindi mo kayang dalhin/tiisin.” Pinananatili ng pangunahing teksto ang anyong ito, habang nililinaw ng talababa na sa konteksto ay maaari itong magpahiwatig ng pagtangging magparaya.
translation_notes:
  register: Gumamit ng makabagong, marangal, at madaling maunawaang Tagalog. Pinanatili ang serye ng mga papuri sa iisang daloy ng pangungusap, ngunit gumamit ng ikalawang pangungusap upang maging malinaw ang pagsusuri sa mga nag-aangking apostol. Iniwasan ang mas kolokyal na “hindi mo sila maatim” at ang mas institusyonal na paliwanag na wala sa teksto.
