  source_fidelity: 'Tumpak ang salin sa Griyego: ang utos na γράψον ay naipahayag sa “isulat mo,” ang ἀγγέλῳ bilang “anghel” na may wastong alternatibong “mensahero,” at ang ἐκκλησίας bilang “iglesya.” Ang “Ganito ang sinasabi” ay likas na katumbas ng pormulang Τάδε λέγει. Ang “ang Una at ang Huli” ay maayos na titulo, at ang “namatay at muling nabuhay” ay tapat at idiomatikong naghahatid ng ἐγένετο νεκρὸς καὶ ἔζησεν nang walang di-kailangang pagpapalawak.'
  naturalness: Natural at marangal ang modernong Filipino. Ang ayos na “At sa anghel ng iglesya sa Smirna ay isulat mo” ay bahagyang pormal ngunit angkop sa propetikong liham at malinaw pa rin.
  terminology: Ang “anghel,” “iglesya,” “Smirna,” at ang kapitalisadong “Una” at “Huli” ay pare-pareho, makikilala, at angkop sa rehistro ng Pahayag. Ang talababa para sa “mensahero” at ang lexical na alternatibo para sa pariralang ukol sa kamatayan ay wastong nakaangkla.
