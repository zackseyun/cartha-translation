id: REV.2.8
reference: Revelation 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: tl
  text: 'At sa anghel[a] ng iglesya sa Smirna ay isulat mo: “Ganito ang sinasabi ng Una at ng Huli, na namatay at muling nabuhay:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero.”
    reason: alternative_reading
  - marker: b
    text: O “na naging patay at nabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: anghel
  rationale: Pinanatili ang karaniwang kahulugan sa kontekstong apokaliptiko ng Pahayag, kung saan mahalaga ang mga makalangit na nilalang; posible rin ang “mensahero,” kaya inilagay ito sa talababa.
- source_word: ἐκκλησίας
  choice: iglesya
  rationale: Tumutukoy rito sa pamayanang Kristiyano sa Smirna, hindi lamang sa isang pangkalahatang pagtitipon. Ang “iglesya” ay maikli, likas, at kinikilalang katawagan sa modernong Filipino.
- source_word: Τάδε λέγει
  choice: Ganito ang sinasabi
  rationale: Likas na pormulang Filipino na nagpapanatili sa maringal at paulit-ulit na pormula ng paghahayag nang hindi nagiging matigas ang pagkakasabi.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: ang Una at ang Huli
  rationale: Pinanatili bilang titulo ni Cristo at ginamitan ng malaking titik upang ipakita ang gamit nitong pantangi, kasabay ng alingawngaw nito sa wikang ginagamit tungkol sa Diyos sa Isaias.
- source_word: ἐγένετο νεκρὸς
  choice: namatay
  rationale: Ipinahahayag nang natural sa Filipino ang pangyayaring pumasok siya sa kamatayan. Ang mas literal na “naging patay” ay hindi likas at maaaring magtunog mekanikal.
- source_word: ἔζησεν
  choice: muling nabuhay
  rationale: Malinaw at likas na ipinakikita ang pagbalik sa buhay pagkatapos mamatay; ang payak na “nabuhay” ay maaari ring mangahulugang patuloy lamang na namuhay.
theological_decisions:
- issue: Ang titulo ni Cristo at ang pananalita tungkol sa kamatayan at muling pagkabuhay
  choice: “ang Una at ang Huli, na namatay at muling nabuhay”
  alternative: “ang una at ang huli, na naging patay at nabuhay”
  rationale: Pinananatili ang mataas na pagkakakilanlan kay Cristo at ang tuwirang pahayag ng kanyang kamatayan at muling pagkabuhay, nang walang idinaragdag na paliwanag na doktrinal. Ang malalaking titik ay nagpapakita na titulo ang parirala, samantalang ang “namatay at muling nabuhay” ay natural na naghahatid ng pangyayaring ipinahahayag ng mga pandiwang Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iglesya” para sa pamayanang Kristiyano at “Smirna” bilang karaniwang anyong Filipino ng pangalan. Pinanatili ang tuwirang utos na “isulat mo” at ang pormulang propetiko na “Ganito ang sinasabi.”
