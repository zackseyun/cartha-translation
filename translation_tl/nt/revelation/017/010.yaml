  terminology: Ang “bumagsak,” “manatili,” at “maikling panahon” ay naaayon sa marangal ngunit makabagong rehistro. Hindi pinapangalanan o kinikilala ang mga hari sa pangunahing teksto; ang talababa lamang ang nagpapalinaw ng agarang konteksto.
