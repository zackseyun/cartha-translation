  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: tl
  text: Lima ang bumagsak[a], ang isa ay naririto, at ang isa pa ay hindi pa dumarating; at pagdating niya, kailangan niyang manatili nang maikling panahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasang ayon sa konteksto: “Limang hari ang bumagsak, ang isang hari ay naririto, at ang isa pang hari ay hindi pa dumarating.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Lima
  rationale: Tumutukoy ang may artikulong bilang sa limang hari mula sa naunang sugnay. Likas sa Tagalog na hindi na ulitin sa pangunahing teksto ang pangngalang “hari,” habang malinaw ito sa konteksto at sa talababa.
- source_word: ἔπεσαν
  choice: ang bumagsak
  rationale: Pinananatili ang matalinghagang “bumagsak” ng πίπτω para sa pagkabuwal o pagkawala sa kapangyarihan, nang hindi tinutukoy kung paano sila nagwakas.
- source_word: ὁ εἷς ἔστιν
  choice: ang isa ay naririto
  rationale: Ang payak na ἔστιν ay eliptiko. Ang “naririto” ay likas na Tagalog para sa kasalukuyang umiiral na isa, nang hindi ito ginagawang tahasang “naghahari.”
- source_word: ὁ ἄλλος οὔπω ἦλθεν
  choice: ang isa pa ay hindi pa dumarating
  rationale: Ipinahahayag ng “isa pa” ang kasunod na naiibang hari, at ng aspektong kontemplatibo sa “dumarating” ang inaasahang pagdating na hindi pa nagaganap.
- source_word: ὅταν ἔλθῃ
  choice: pagdating niya
  rationale: Likas at maikli itong katumbas ng hinaharap na pangyayaring ipinahihiwatig ng ὅταν na may aorist subjunctive. Ang “niya” ay tumutukoy sa isahang haring nasa konteksto.
- source_word: ὀλίγον αὐτὸν δεῖ μεῖναι
  choice: kailangan siyang manatili nang maikling panahon
  rationale: Ang “kailangan” ay tuwirang naghahatid ng impersonal na δεῖ, ang “manatili” ng μεῖναι, at ang “maikling panahon” ng adberbiyal na ὀλίγον nang hindi dinaragdagan ng “lamang.”
theological_decisions:
- issue: Pagkakakilanlan ng pitong hari
  choice: Panatilihing hindi pinapangalanan ang mga hari at huwag magpasok ng tiyak na pamamaraang pangkasaysayan.
  alternative: Tukuyin sa salin ang mga ito bilang partikular na mga emperador o iba pang makasaysayang pinuno.
  rationale: Tinatawag silang mga hari sa agarang konteksto, ngunit hindi sila pinapangalanan ng talata. Pinananatili ng salin ang sadyang maigsi at apokaliptikong paglalahad.
- issue: Kahulugan ng ὁ εἷς ἔστιν
  choice: Isalin bilang “ang isa ay naririto.”
  alternative: “ang isa ay naghahari” o “ang isa ay nananatili”
  rationale: Ang “naghahari” at “nananatili” ay posibleng paliwanag sa konteksto ngunit higit na tiyak kaysa sa payak na ἔστιν. Hindi dapat tahimik na lutasin ng salin ang elipsis.
- issue: Lakas ng δεῖ
  choice: “kailangan siyang manatili”
  alternative: “mananatili siya”
  rationale: Pinananatili ng “kailangan” ang diwang kinakailangan o itinakdang mangyari, na mahalaga sa apokaliptikong balangkas ng talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang maikli at eliptikong ayos ng Griyego, ngunit ginamit ang “naririto” upang maging likas ang ὁ εἷς ἔστιν sa Tagalog. Ang “ngunit” bago ang “pagdating niya” ay naghahatid ng pagbabago tungo sa kondisyong panghinaharap nang hindi nagdaragdag ng interpretasyong pangkasaysayan.
