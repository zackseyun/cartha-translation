  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: tl
  text: Ang sampung sungay na nakita mo at ang halimaw—ang mga ito ay mapopoot sa babaeng bayaran; gagawin nila siyang tiwangwang at hubad[a], kakainin ang kanyang laman[b], at lubusan siyang susunugin sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinubaran.” Ang salitang Griyego ay “hubad” at nagpapahiwatig dito ng hayagang paglalantad at kahihiyan.
    reason: lexical_alternative
  - marker: b
    text: Literal ang “laman” dito; sa apokaliptikong larawan ng Pahayag, inilalarawan ng pananalita ang ganap at marahas na pagwasak.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: mga sungay
  rationale: Pinanatili ang literal na apokaliptikong sagisag sa halip na isalin agad bilang mga hari o kapangyarihan.
- source_word: θηρίον
  choice: halimaw
  rationale: Likas at malinaw na salin sa modernong Tagalog na nagpapanatili sa mapanganib at sagisag na katangian ng nilalang.
- source_word: πόρνην
  choice: babaeng bayaran
  rationale: Direkta ngunit pangkaraniwang modernong katawagan; mas natural kaysa sa lumang 'patutot' at hindi nito binabago ang tauhan tungo sa interpretasyon ng sagisag.
- source_word: μισήσουσι
  choice: mapopoot
  rationale: Tuwirang hinaharap na anyo na angkop sa matinding poot na sinusundan ng marahas na pagkawasak.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: gagawin nila siyang wasak
  rationale: Pinananatili ang resultative na diwa ng konstruksyon—dadalhin nila siya sa kalagayang lubos na napinsala—sa natural na Tagalog.
- source_word: γυμνήν
  choice: hubad
  rationale: Tuwirang katumbas ng pang-uri; hindi isinama sa pangunahing teksto ang ipinahihiwatig na paglalantad at kahihiyan.
- source_word: σάρκας
  choice: laman
  rationale: Pinananatili ang kongkreto at marahas na larawan sa halip na palambutin bilang 'katawan.'
- source_word: φάγονται
  choice: kakainin
  rationale: Tuwirang salin ng pandiwa; hindi pinalitan ng mas interpretatibong 'lalamunin.'
- source_word: κατακαύσουσιν ἐν πυρί
  choice: lubusan siyang susunugin sa apoy
  rationale: Ipinakikita ng 'lubusan' ang masidhing puwersa ng κατακαίω, habang malinaw na isinasalin ang ἐν πυρί bilang 'sa apoy.'
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Pinanatili ang mariing resumptive pronoun na tumutukoy kapwa sa sampung sungay at sa halimaw.
theological_decisions:
- issue: Ang sampung sungay at ang halimaw bilang sama-samang simuno ng mga pandiwang maramihan
  choice: Pinanatili ang kolektibong simuno at ang mariing pag-uulit na 'ang mga ito.'
  alternative: Pakinisin bilang 'Ang sampung sungay na nakita mo at ang halimaw ay mapopoot...' nang walang resumptive pronoun.
  rationale: Sinasalamin nito ang di-pangkaraniwang Griyegong konstruksyon at malinaw na ipinakikitang magkakasamang kikilos ang mga tinutukoy laban sa babae.
- issue: Ang kalikasan ng marahas na larawan ng pagwasak sa babaeng bayaran
  choice: Pinanatili ang apokaliptikong larawan nang hindi tahasang ipinapaliwanag ang babae bilang isang lungsod o sistema.
  alternative: Isalin ang sagisag ayon sa isang partikular na interpretasyon, gaya ng lungsod o sistemang pampolitika o panrelihiyon.
  rationale: Ang talata mismo ay gumagamit ng sagisag at hindi ito dapat tahimik na lutasin ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Gumamit ng maiikling sugnay upang maging malinaw ang sunod-sunod na marahas na kilos, habang pinanatili ang mga sagisag at ang diin ng orihinal.
