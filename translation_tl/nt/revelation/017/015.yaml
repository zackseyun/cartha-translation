  source_fidelity: 'Tumpak na naipapahayag ng salin ang paliwanag ng anghel tungkol sa simbolikong “mga tubig,” kasama ang apat na magkakahiwalay na pangkat: λαοί, ὄχλοι, ἔθνη, at γλῶσσαι. Ang “na kinauupuan ng babaeng bayaran” ay wastong naghahatid ng larawan ng πόρνη na nakaupo sa mga tubig. Ang nakaraang-panahunang “sinabi niya” ay likas sa daloy ng salaysay sa Tagalog, kahit present ang λέγει sa Griyego, at hindi nito binabago ang kahulugan.'
