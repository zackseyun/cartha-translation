id: REV.17.15
reference: Revelation 17:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: tl
  text: At sinabi niya sa akin, “Ang mga tubig na nakita mo, na kinauupuan ng babaeng bayaran, ay mga bayan, mga pulutong, mga bansa, at mga wika.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνη
  choice: babaeng bayaran
  rationale: Likas at dignified na modernong Tagalog para sa isang babaeng nagbebenta ng serbisyong seksuwal; iniiwasan ang labis na kolokyal o mapanlait na katawagan habang pinananatili ang negatibong simbolismo.
- source_word: λαοί
  choice: mga bayan
  rationale: Ipinapahayag ang kolektibong mga pangkat ng tao, at malinaw na naihihiwalay sa kasunod na ‘mga pulutong.’
- source_word: ὄχλοι
  choice: mga pulutong
  rationale: Tuwirang tumutukoy sa maraming taong nagkakatipon o masa; pinananatili ang pagkakaiba nito sa λαοί.
- source_word: ἔθνη
  choice: mga bansa
  rationale: Karaniwang salin sa kontekstong pandaigdig at akma sa listahan ng sari-saring pangkat ng sangkatauhan.
- source_word: γλῶσσαι
  choice: mga wika
  rationale: Sa apokaliptikong listahang ito, tumutukoy sa mga pangkat na kinikilala ayon sa kanilang mga wika; pinananatili ang metonimikong anyo ng Griyego.
- source_word: κάθηται
  choice: kinauupuan
  rationale: Pinananatili ang literal at simbolikong larawan ng babaeng nakaupo sa ibabaw ng mga tubig.
theological_decisions:
- issue: Pagpapakahulugan sa simbolo ng ‘mga tubig’
  choice: 'Pinanatili ang apat na magkakatabing kategorya: mga bayan, mga pulutong, mga bansa, at mga wika.'
  alternative: Pagsamahin ang mga ito bilang ‘lahat ng uri ng tao sa buong mundo.’
  rationale: Ang tahasang paliwanag ng talata at ang retorikal na lawak ng apat na terminong Griyego ay dapat manatili nang hindi pinaiikli o nilalagyan ng karagdagang doktrinal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang kasalukuyang panahunan ng λέγει sa ‘sinasabi’ sana, ngunit piniling ‘sinabi’ sa salaysay? Ang inilathalang teksto ay gumagamit ng ‘At sinabi niya’ bilang natural na Tagalog narrative progression, habang buo ang kahulugan ng direktang pahayag.
source_grounding:
  english_pob_role: consult_only
