source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: tl
  text: At ang babaeng nakita mo ay ang dakilang lungsod na may kapamahalaan sa mga hari ng lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na may kaharian sa mga hari ng lupa.” Literal na “may kaharian”; maaari rin itong mangahulugang may paghahari o kapamahalaang maharlika.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: babae
  rationale: Tumutukoy ito sa simbolikong babaeng nakita sa pangitain; ang “babae” ang natural at hindi labis na mapagpasyang salin.
- source_word: ἣν εἶδες
  choice: na nakita mo
  rationale: Tuwirang kinikilala ng sugnay ang babaeng nakita sa pangitain at natural itong pahayag sa modernong Tagalog.
- source_word: πόλις ἡ μεγάλη
  choice: ang dakilang lungsod
  rationale: Tapat nitong pinananatili ang pangngalan at panuring, pati ang maringal na himig ng pahayag.
- source_word: ἔχουσα βασιλείαν
  choice: na may kapangyarihan
  rationale: Sa kontekstong sinusundan ng “sa mga hari,” ang βασιλεία ay tumutukoy sa taglay na paghahari o kapangyarihang mamahala, hindi lamang sa isang teritoryal na kaharian.
- source_word: ἐπὶ τῶν βασιλέων
  choice: sa mga hari
  rationale: Kasama ng “may kapangyarihan,” malinaw at natural na ipinahahayag ng “sa” ang kapangyarihang nakahigit sa mga hari.
- source_word: τῆς γῆς
  choice: ng lupa
  rationale: Pinananatili nito ang karaniwang apokaliptikong saklaw ng γῆ bilang buong lupa, sa halip na paliitin ito sa isang partikular na lupain.
theological_decisions:
- issue: Ugnayan ng babae at ng dakilang lungsod
  choice: 'Tuwirang pagkakakilanlan: “ang babae ... ay ang dakilang lungsod.”'
  alternative: “Ang babae ... ay kumakatawan sa dakilang lungsod.”
  rationale: Ginagamit ng Griyego ang payak na ἔστιν (“ay”). Pinananatili ng tuwirang salin ang simbolikong pagkakakilanlan nang hindi ito ginagawang paliwanag na wala mismo sa teksto.
- issue: Saklaw ng βασιλεία
  choice: “may kapangyarihan”
  alternative: “may kaharian” o “naghahari”
  rationale: Pinananatili ng salin ang diwa ng taglay na maharlikang pamamahala, habang inilalagay sa talababa ang mas literal at leksikal na alternatibo upang hindi mawala ang tunay na lawak ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “dakilang lungsod” upang mapanatili ang apokaliptikong tono, at ang “may kapangyarihan sa” bilang natural na pagpapahayag ng pamumunong nakahigit sa mga hari.
