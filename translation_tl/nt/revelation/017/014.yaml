  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagtukoy sa mga kalaban ng Kordero, ang kanilang pakikidigma laban sa kanya, ang tagumpay ng Kordero, ang sanhi nito, at ang tatlong paglalarawan sa mga kasama niya. Gayunman, ang δεύτερον καί ay simpleng pang-ugnay na “at,” hindi panandang pagsalungat na “ngunit.”
  naturalness: Natural at marangal ang “Makikipagdigma,” “Kordero,” “Panginoon ng mga panginoon,” at “Hari ng mga hari.” Mas malinaw at mas malapit sa daloy ng Griyego ang “at dadaigin sila ng Kordero” kaysa “ngunit dadaigin sila ng Kordero.”
  terminology: 'Ang mga pangunahing termino ay angkop at magkakaugnay sa karaniwang bokabularyo ng Pahayag: Kordero, dadaigin, Panginoon, Hari, tinawag, pinili, at tapat. Hindi nilulutas ng salin ang anumang debateng doktrinal tungkol sa pagtawag o pagpili.'
