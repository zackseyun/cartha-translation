id: REV.17.14
reference: Revelation 17:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: tl
  text: Makikipagdigma ang mga ito laban sa Kordero[a], at dadaigin sila ng Kordero, sapagkat siya ang Panginoon ng mga panginoon at Hari ng mga hari. At ang mga kasama niya ay mga tinawag, pinili, at tapat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “makikipagdigma kasama ng Kordero”; sa konteksto, nangangahulugan itong makikipagdigma sila laban sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Pinananatili ang pantukoy na puwersa ng demonstratibo at tumutukoy sa mga haring nabanggit sa naunang konteksto.
- source_word: μετὰ τοῦ ἀρνίου
  choice: laban sa Kordero
  rationale: Bagaman karaniwang nangangahulugang “kasama ng” ang μετά na may genitive, adversatibo ang diwa nito kapag kasama ng πολεμέω sa kontekstong ito; iniiwasan ng salin ang maling pahiwatig na kakampi sila ng Kordero.
- source_word: ἀρνίον
  choice: Kordero
  rationale: Ito ang natural at nakaugaliang marangal na salin ng natatanging kristolohikal na titulo sa Pahayag.
- source_word: πολεμήσουσιν
  choice: makikipagdigma
  rationale: Naipahahayag nito ang malawak na diwang militar at ang maringal na apokaliptikong tono, hindi lamang isang karaniwang pakikipaglaban.
- source_word: νικήσει
  choice: dadaigin
  rationale: Malinaw nitong ipinahahayag ang pagtatagumpay ng Kordero laban sa kanila at ang paulit-ulit na tema ng νικάω sa Pahayag.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng tagumpay habang pinananatili ang marangal na rehistro.
- source_word: κύριος κυρίων
  choice: Panginoon ng mga panginoon
  rationale: Pinananatili ang superlatibong titulo at ang kataas-taasang awtoridad ng Kordero.
- source_word: βασιλεὺς βασιλέων
  choice: Hari ng mga hari
  rationale: Natural na katumbas sa Tagalog ng titulong nagpapahayag ng kataas-taasang paghahari.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ang mga kasama niya
  rationale: Direkta at natural na tumutukoy sa mga taong kasama o kakampi ng Kordero.
- source_word: κλητοὶ
  choice: mga tinawag
  rationale: Pinananatili ang lawak at teolohikal na taginting ng κλητός nang hindi tinutukoy kung paanyaya o mabisang pagtawag ang diin.
- source_word: ἐκλεκτοὶ
  choice: pinili
  rationale: Karaniwan at madaling maunawaang salita na hindi nag-aangkat ng isang sistematikong paliwanag tungkol sa paghirang.
- source_word: πιστοί
  choice: tapat
  rationale: Saklaw nito ang matatag na katapatan at pagiging mapagkakatiwalaan; hindi nito nililimitahan ang salita sa paniniwalang intelektuwal lamang.
theological_decisions:
- issue: Ang titulo ng Kordero at ang wika ng kanyang tagumpay
  choice: “Kordero” at “dadaigin”
  alternative: “kordero” at “magtatagumpay laban sa”
  rationale: Pinananatili ang natatanging titulo kay Cristo at ang mahalagang temang νικάω sa Pahayag nang walang idinaragdag na doktrina.
- issue: Ang tatluhang paglalarawan na κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: “mga tinawag, pinili, at tapat”
  alternative: “mga tinawag, hinirang, at matapat”
  rationale: Inilalahad ang tatlong paglalarawan nang hindi nilulutas sa salin ang mga pagtatalo tungkol sa pagtawag, pagpili, at kaligtasan.
- issue: Kaugnayan ng huling parirala sa tagumpay ng Kordero
  choice: 'Panatilihin ito bilang isang hiwalay ngunit kaugnay na pangungusap: “At ang mga kasama niya…”'
  alternative: Idagdag na ang mga kasama niya ay tahasang nakikibahagi sa pananagumpay
  rationale: Elliptical ang Griyego at hindi inuulit ang pandiwang “dadaigin.” Iniiwasang idagdag sa pangunahing teksto ang isang pandiwang hindi hayagang naroon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makikipagdigma,” “Kordero,” at mga tradisyonal na titulong “Panginoon ng mga panginoon” at “Hari ng mga hari” upang mapanatili ang apokaliptikong bigat nang hindi nagiging makaluma.
