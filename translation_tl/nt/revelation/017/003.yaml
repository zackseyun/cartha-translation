id: REV.17.3
reference: Revelation 17:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: tl
  text: At dinala niya ako sa ilang sa Espiritu.[a] At nakita ko ang isang babaeng nakaupo sa isang halimaw na kulay-iskarlata, punô ng mga pangalang mapamusong, at may pitong ulo at sampung sungay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa espiritu.” Maaaring tumukoy ang pariralang Griyego sa isang espirituwal na kalagayan o sa pagdadala ng Espiritu; sa Pahayag, karaniwan nitong ipinakikilala ang isang karanasan ng pangitain.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: dinala ... ako
  rationale: Ipinahihiwatig ng pandiwa ang pagdadala o paglilipat sa ibang lugar. Likas sa modernong Tagalog ang “dinala niya ako,” at ang konteksto at pariralang “sa Espiritu” ang nagpapakitang pangitain ang karanasan.
- source_word: εἰς ἔρημον
  choice: sa ilang
  rationale: Ang ἔρημος ay isang ilang o tiwangwang na lugar, hindi kinakailangang mabuhanging disyerto. Hindi rin ito ginawang tiyak na isang partikular na ilang.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Sa Pahayag, karaniwang ipinakikilala ng pariralang ito ang kalagayan o karanasang propetiko ng pangitain. Malamang na tumutukoy ito sa pagkilos ng Espiritu, ngunit pinananatili sa talababa ang posibilidad na “sa espiritu.”
- source_word: γυναῖκα καθημένην ἐπὶ
  choice: isang babaeng nakaupo sa
  rationale: Tuwiran at natural na inilalarawan nito ang babae at ang kaniyang posisyon sa ibabaw ng halimaw.
- source_word: θηρίον
  choice: halimaw
  rationale: Sa kontekstong apokaliptiko ng Pahayag, ang “halimaw” ay natural at kinikilalang katumbas ng θηρίον, at pinananatili nito ang simbolikong bigat ng salita.
- source_word: κόκκινον
  choice: kulay-iskarlata
  rationale: Tiyak na tumutukoy ang κόκκινος sa matingkad na pulang kulay na iskarlata. Pinananatili ng salin ang natatanging simbolikong kulay sa halip na gawing pangkalahatang “pula.”
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: punô ng mga pangalang lumalapastangan
  rationale: Pinananatili ng “punô” ang kahulugan ng γέμοντα. Ang pariralang “mga pangalang lumalapastangan” ay natural na Filipino para sa mga pangalang may katangian ng paglapastangan nang hindi dinaragdagan ang Griyego ng tahasang layon.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: at may pitong ulo at sampung sungay
  rationale: Ang “may” ay natural na katumbas ng participle na ἔχων, at tuwirang pinananatili ang apokaliptikong larawan at mga bilang.
theological_decisions:
- issue: Kahulugan ng ἐν πνεύματι
  choice: sa Espiritu
  alternative: sa espiritu
  rationale: Madalas gamitin ang parirala sa Pahayag bilang pananda ng propetikong pangitain at malamang na ipinahihiwatig ang pagkilos ng Espiritu. Gayunman, walang pagkakaiba ng malaking titik at maliit na titik sa sinaunang Griyegong manuskrito, kaya itinatala ang alternatibo upang hindi lubusang lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “halimaw” bilang likas na katawagang apokaliptiko, “ilang” sa halip na “disyerto” upang mapanatili ang lawak ng ἔρημος, at inilagay ang talababa pagkatapos ng “Espiritu” dahil iyon ang pariralang may alternatibong pagbasa.
