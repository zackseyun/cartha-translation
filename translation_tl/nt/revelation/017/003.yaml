  naturalness: Marangal at natural ang kabuuang modernong Filipino. Gayunman, ang “mga pangalang lumalapastangan” ay mas karaniwang mauunawaang mga pangalang siyang gumagawa ng paglapastangan, samantalang ang Griyego ay naglalarawan sa mga pangalan bilang mapamusong/blasphemous.
  terminology: Ang “ilang,” “Espiritu,” “halimaw,” “iskarlata,” “ulo,” at “sungay” ay angkop at pare-pareho sa apokaliptikong rehistro. Mas tumpak na katawagan ang “mga pangalang mapamusong” para sa ὀνόματα βλασφημίας.
