id: REV.17.17
reference: Revelation 17:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: tl
  text: Sapagkat inilagay ng Diyos sa kanilang mga puso na isakatuparan ang kanyang layunin, na kumilos nang may iisang layunin[a], at na ibigay sa halimaw ang kanilang kaharian, hanggang sa matupad ang mga salita ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magkaisa ng isip” o “magkaroon ng iisang layunin.” Sa literal, “gumawa ng iisang layunin.”
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa makumpleto ang mga salita ng Diyos” o “hanggang sa mangyari ang mga ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: inilagay ... sa kanilang mga puso
  rationale: Pinananatili nito ang metapora ng Griyego tungkol sa panloob na pagkilos o pag-udyok ng Diyos, at natural itong pakinggan sa modernong Tagalog.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: isakatuparan ang kanyang layunin
  rationale: Dito, ang γνώμη ay tumutukoy sa layunin o pasiya ng Diyos, hindi lamang sa opinyon o pag-iisip; malinaw na ipinahahayag ng “isakatuparan” ang paggawa ayon dito.
- source_word: ποιῆσαι μίαν γνώμην
  choice: kumilos nang may iisang layunin
  rationale: Ipinahahayag nito ang nagkakaisang hangarin at pagkilos ng mga hari habang natural sa Tagalog; hindi nito nililimitahan ang diwa sa pagkakasundo lamang ng isip.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: ibigay ... ang kanilang kaharian
  rationale: Pinananatili ang payak na pandiwang “ibigay” at ang kapansin-pansing isahang “kaharian” na may maramihang nagmamay-ari, gaya ng nasa Griyego.
- source_word: τῷ θηρίῳ
  choice: sa halimaw
  rationale: Ang “halimaw” ay malinaw at karaniwang salin ng θηρίον at nagpapanatili sa apokaliptikong larawan sa Pahayag.
- source_word: ἄχρι τελεσθήσονται
  choice: hanggang sa matupad
  rationale: Ang “matupad” ay angkop sa mga pahayag ng Diyos na umaabot sa kanilang itinakdang katuparan, habang kinikilala sa talababa ang posibleng diwang “makumpleto” o “mangyari.”
- source_word: οἱ λόγοι τοῦ θεοῦ
  choice: ang mga salita ng Diyos
  rationale: Malawak at marangal ang “mga salita,” at hindi nito labis na tinutukoy kung ang mga ito ay mga kasabihan, pahayag, o propesiya.
theological_decisions:
- issue: Ang paghahari ng Diyos at ang tunay na pagkilos ng mga hari
  choice: Tahasang sabihing inilagay ng Diyos sa kanilang mga puso ang gagawin, habang inilalarawan din ang kanilang sariling nagkakaisang pagkilos at pagbibigay ng kaharian.
  alternative: Pahinain ang papel ng Diyos bilang pagpapahintulot lamang, o palakasin ito sa isang deterministikong pagpapakahulugan na higit sa sinasabi ng Griyego.
  rationale: Ang teksto mismo ay kapwa nagsasaad ng sanhi mula sa Diyos at ng tunay na pagkilos ng mga pinuno. Pinananatili ng salin ang tensiyong ito nang hindi ito nilulutas ayon sa isang partikular na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang magkakatulad na anyong pawatas—“isakatuparan,” “kumilos,” at “ibigay”—upang ipakita ang pagkakaugnay ng tatlong kilos, habang nananatiling natural ang daloy.
