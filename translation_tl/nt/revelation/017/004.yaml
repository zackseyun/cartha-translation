  to: At ang babae ay nakadamit ng kulay-ube at matingkad na pula, at pinalamutian ng ginto, mahahalagang bato, at mga perlas. Hawak niya sa kanyang kamay ang isang gintong kopa na punô ng mga kasuklam-suklam na bagay at ng mga karumihan ng kanyang seksuwal na imoralidad[a].
  rationale: Pinalitan ang «napapalamutian» ng «pinalamutian» upang maipahayag ang resultative na kalagayan ng periphrastic perfect na ἦν κεχρυσωμένη. Inilagay ang footnote marker kaagad pagkatapos ng «seksuwal na imoralidad» dahil iyon ang salitang may leksikal na alternatibong ipinapaliwanag. Walang ibang pagbabagong semantiko ang ginawa.
