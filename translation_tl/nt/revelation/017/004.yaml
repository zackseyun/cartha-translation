id: REV.17.4
reference: Revelation 17:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: tl
  text: At ang babae ay nakadamit ng kulay-ube at matingkad na pula, at pinalamutian ng ginto, mahahalagang bato, at mga perlas. Hawak niya sa kanyang kamay ang isang gintong kopa na punô ng mga kasuklam-suklam na bagay at ng mga karumihan ng kanyang seksuwal na imoralidad[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “prostitusyon” o “pakikiapid.” Sa Pahayag, ang salitang Griyego ay maaaring magkaroon ng literal at metaporikal na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: nakadamit
  rationale: Ipinapahayag ang kalagayang bunga ng periphrastic perfect construction (ἦν + perfect participle) sa natural na modernong Tagalog.
- source_word: πορφυροῦν
  choice: kulay-ube
  rationale: Malinaw na katawagan sa kulay na kaugnay ng karangyaan at pagkahari, nang hindi dinaragdagan ang teksto ng tiyak na uri ng tela.
- source_word: κόκκινον
  choice: matingkad na pula
  rationale: Inihahatid ang tiyak at marangyang scarlet hue; mas madaling maunawaan sa modernong Tagalog kaysa sa hiram o bihirang katawagan.
- source_word: κεχρυσωμένη
  choice: napapalamutian
  rationale: Pinananatili ang resultative na diwa ng participle at ang kahulugan ng marangyang pag-aadorno, hindi lamang mekanikal na pagbabalot.
- source_word: χρυσίῳ
  choice: ginto
  rationale: Pinananatiling bukas ang eksaktong anyo ng palamuti gaya ng nasa Griyego.
- source_word: λίθῳ τιμίῳ
  choice: mahahalagang bato
  rationale: Ginagamit bilang pangkalahatang uri sa talaan ng mga palamuti; natural sa Tagalog ang maramihang anyo rito.
- source_word: μαργαρίταις
  choice: mga perlas
  rationale: Tuwirang katumbas na nagpapanatili sa maramihang bilang.
- source_word: ποτήριον χρυσοῦν
  choice: isang gintong kopa
  rationale: Natural at marangal na salin ng pangngalang may panuring na χρυσοῦν.
- source_word: γέμον
  choice: punô ng
  rationale: Maikli at natural na paglalarawan sa laman ng kopa.
- source_word: βδελυγμάτων
  choice: mga kasuklam-suklam na bagay
  rationale: Pinananatili ang matinding moral at panrelihiyong puwersa ng salita nang mas madaling maunawaan kaysa sa abstraktong 'mga kasuklaman.'
- source_word: τὰ ἀκάθαρτα
  choice: mga karumihan
  rationale: Isinasalamin ang substantivized neuter plural at ang moral/rituwal na diwa ng pagiging marumi sa natural na Tagalog.
- source_word: πορνείας
  choice: seksuwal na imoralidad
  rationale: Malawak na modernong salin na kayang magtaglay ng literal at metaporikal na puwersa ng πορνεία sa Pahayag.
theological_decisions:
- issue: Ang πορνεία sa apokaliptikong larawan ay maaaring tumukoy kapwa sa seksuwal na imoralidad at sa metaporikal na pagtataksil o idolatriya.
  choice: seksuwal na imoralidad
  alternative: prostitusyon; pakikiapid
  rationale: Hindi nililimitahan ang larawan sa bayarang pakikipagtalik o sa isang tiyak na anyo ng pakikiapid, at pinananatili ang sadyang tensiyon sa pagitan ng literal at metaporikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Hinati sa dalawang pangungusap para luminaw ang mahabang estruktura nang hindi binabago ang ugnayan ng mga larawan. Ginamit ang 'kopa' bilang pamilyar na salitang biblikal at 'matingkad na pula' upang malinaw na maihatid ang scarlet.
