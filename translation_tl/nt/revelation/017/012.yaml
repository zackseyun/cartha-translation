  source_fidelity: 'Kailangang ayusin ang aspekto ng unang pandiwa: ang “Hindi pa sila tumatanggap” ay karaniwang nangangahulugang hindi pa sila kasalukuyang tumatanggap, samantalang ang οὔπω ἔλαβον ay nagsasaad na hindi pa nila natanggap ang isang kaharian. Ang “tatanggap sila” para sa λαμβάνουσιν ay katanggap-tanggap sa kontekstong prospektibo, ngunit mas malinaw na maipapakita ang pagkakaiba ng βασιλεία at ἐξουσία sa “awtoridad bilang mga hari.”'
  naturalness: Natural at marangal ang pangkalahatang daloy. Mas idiomatiko at mas tumpak ang “Hindi pa sila nakatanggap ng kaharian” kaysa “Hindi pa sila tumatanggap ng kaharian.” Ang “awtoridad bilang mga hari” ay malinaw na modernong Filipino at hindi binabawasan ang apokaliptikong pahayag.
  terminology: Pinanatili ang “mga sungay,” “mga hari,” “kaharian,” at “halimaw.” Pinalitan ang “kapangyarihang maghari” ng “awtoridad bilang mga hari” upang tuwirang katawanin ang ἐξουσίαν ὡς βασιλεῖς at mapanatili ang kaibhan nito sa βασιλείαν.
  issues:
