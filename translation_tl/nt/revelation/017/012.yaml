id: REV.17.12
reference: Revelation 17:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: tl
  text: At ang sampung sungay na nakita mo ay sampung hari. Hindi pa sila nakatanggap ng kaharian, ngunit tatanggap sila ng awtoridad bilang mga hari sa loob ng isang oras, kasama ng halimaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa maikling panahon.” Sa apokaliptikong paglalarawan, ang “isang oras” ay malamang na tumutukoy sa maikli at limitadong panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: mga sungay
  rationale: Pinanatili ang literal na larawang apokaliptiko; ang kasunod na pahayag mismo ang nagpapakilalang ang mga ito ay mga hari.
- source_word: βασιλεῖς
  choice: mga hari
  rationale: Ito ang tuwirang kahulugan ng salita at pinananatili nito ang tensiyon sa pagitan ng tahasang pagkakakilanlan at simbolikong tagpo.
- source_word: βασιλείαν
  choice: kaharian
  rationale: Pinananatili ang pagkakaiba nito sa ἐξουσίαν; maaaring tumukoy sa sakop o paghaharing hindi pa nila natatanggap.
- source_word: οὔπω ἔλαβον
  choice: Hindi pa sila tumatanggap
  rationale: Likas sa makabagong Tagalog at nagpapahayag ng kalagayang totoo pa sa sandali ng pangitain, nang hindi pilit na nilulutas ang aspektong Griyego.
- source_word: ἐξουσίαν
  choice: kapangyarihang maghari
  rationale: Ipinahahayag ang awtoridad o karapatang mamuno at malinaw na iniuugnay sa ὡς βασιλεῖς, habang hindi ito ipinagkakamali sa kaharian.
- source_word: ὡς βασιλεῖς
  choice: maghari
  rationale: Natural na Tagalog para sa pagtanggap nila ng awtoridad sa katayuan o tungkulin bilang mga hari.
- source_word: μίαν ὥραν
  choice: sa loob ng isang oras
  rationale: Pinanatili ang tiyak na larawang 'isang oras' sa pangunahing teksto; ang posibleng matalinghagang kahulugan ay inilagay sa talababa.
- source_word: λαμβάνουσιν
  choice: tatanggap sila
  rationale: Bagaman nasa kasalukuyang panahunan ang anyong Griyego, ang konteksto ng οὔπω at ang inaasahang pagtanggap ay likas na ipinahahayag sa Tagalog sa panghinaharap.
- source_word: μετὰ τοῦ θηρίου
  choice: kasama ng halimaw
  rationale: Tuwirang nagpapahayag ng pakikisama o pagkakaugnay nila sa halimaw.
- source_word: θηρίου
  choice: halimaw
  rationale: Natural at nakaugaliang salin sa Tagalog para sa apokaliptikong θηρίον sa Pahayag.
theological_decisions:
- issue: Kung ang sampung hari ay dapat ipaliwanag bilang literal na mga monarka o simbolikong mga pinuno/kapangyarihan
  choice: Pinanatili ang “sampung hari” nang walang paliwanag sa pangunahing teksto.
  alternative: sampung pinuno; sampung kapangyarihang pampolitika
  rationale: Tahasan silang tinatawag ng Griyego na sampung hari, samantalang simboliko ang tagpong apokaliptiko. Hindi dapat lutasin ng salin ang tensiyong ito.
- issue: Kung literal na oras o maikling takdang panahon ang μίαν ὥραν
  choice: Pinanatili ang “sa loob ng isang oras” sa teksto at ipinaliwanag ang posibleng matalinghagang diwa sa talababa.
  alternative: sa maikling panahon; sandaling panahon
  rationale: Tiyak na 'isang oras' ang anyo ng Griyego, ngunit sa larawang apokaliptiko ay malamang na nagpapahiwatig ito ng maikli at limitadong panahon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “halimaw” upang panatilihin ang matinding larawang apokaliptiko at ang “kapangyarihang maghari” upang maging natural ang ἐξουσίαν ὡς βασιλεῖς. Ang talababa ay inilagay pagkatapos ng “isang oras,” ang mismong pariralang nililinaw nito.
