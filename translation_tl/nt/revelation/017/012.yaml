    rationale: Ang kasalukuyang anyo ng Tagalog na “tumatanggap” ay nagpapahiwatig ng nagpapatuloy na pagtanggap o pangkalahatang gawi. Ang Griyego ay tumutukoy sa kahariang hindi pa nila natanggap; “Hindi pa sila nakatanggap” ang likas na katumbas.
  - severity: low
    issue: Ang “kapangyarihang maghari” ay bahagyang nagsasanib sa ἐξουσίαν at ὡς βασιλεῖς.
    rationale: 'Bagaman posible ito, ang “awtoridad bilang mga hari” ay mas malapit sa pagkakasunod at pagkakaiba ng mga termino sa Griyego: awtoridad, sa katayuan bilang mga hari.'
