  source_fidelity: Tumpak ang pangunahing pagbibigay ng mga hari, mga naninirahan sa lupa, pagkalasing, alak, at pakikiapid. Gayunman, ang “na siyang pinakiapiran” ay hindi likas sa makabagong Filipino at nagpapalabo sa tuwirang ugnayang “with whom.” Ang “dahil sa” ay mas malinaw na naghahayag ng sanhi mula sa ἐκ kaysa sa payak na “sa.”
  naturalness: Ang “Nakipag-apid sa kanya ang mga hari ng lupa” ay mas malinaw at mas natural na modernong Filipino kaysa sa pasibong/arkaykong “na siyang pinakiapiran.” Nananatili itong marangal at angkop sa rehistro ng Pahayag.
  terminology: Pinananatili ang magkaugnay na “nakipag-apid” at “pakikiapid” para sa πορνεύω/πορνεία, nang hindi binabawasan ang seksuwal na metapora tungo lamang sa idolatriya o pampolitikang pakikipag-alyansa. Ang tala ay inayos upang maging mas likas ang Filipino at hindi magpasiya sa isang simbolikong pakahulugan.
  issues:
