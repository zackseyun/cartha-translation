    issue: Hindi likas at maaaring malabo ang “na siyang pinakiapiran.”
    rationale: Bagaman maihahambing ito sa mas lumang salin, hindi ito karaniwang modernong gamit at maaaring hindi agad maunawaan bilang “nakipag-apid sa kanya.”
  - severity: low
    issue: Maaaring maging kulang ang pagpapahiwatig ng ἐκ sa “nalasing ... sa alak.”
    rationale: Katanggap-tanggap ang “sa alak,” ngunit ang “dahil sa alak” ay mas malinaw na nagmamarka ng sanhi/pinagmulan ng pagkalasing.
  revised_text: Nakipag-apid sa kanya ang mga hari ng lupa,[a] at nalasing ang mga naninirahan sa lupa dahil sa alak ng kanyang pakikiapid.[b]
