  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: tl
  text: Nakipag-apid sa kanya ang mga hari ng lupa,[a] at nalasing ang mga naninirahan sa lupa dahil sa alak ng kanyang pakikiapid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nakipag-apid” dito ay maaaring sumagisag sa tiwaling pakikipag-alyansa, idolatriya, o pagtataksil, ngunit nananatili ang puwersa ng larawang seksuwal.
    reason: cultural_note
  - marker: b
    text: Maaari ring “alak ng kanyang prostitusyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: na siyang pinakiapiran
  rationale: Pinananatili nito ang panghalip na panao na tumutukoy sa babae sa naunang talata at malinaw na iniuugnay sa kanya ang kilos ng mga hari.
- source_word: ἐπόρνευσαν
  choice: pinakiapiran
  rationale: Ang “pakikiapid” ay likas at marangal na salitang Filipino para sa ipinagbabawal na pakikipagtalik at naipapanatili rin nito ang simbolikong puwersa ng larawan nang hindi agad nililimitahan sa idolatriya o alyansang pampolitika.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: mga hari sa lupa
  rationale: Ang “lupa” ay umaayon sa malawak at paulit-ulit na gamit ng γῆ sa Pahayag, sa halip na sa mas makitid na “lupain.”
- source_word: ἐμεθύσθησαν
  choice: nalasing
  rationale: Likas na ipinapahayag ng “nalasing” ang kalagayang ibinunga ng pag-inom at maayos nitong isinasalin ang aorist passive sa kasalukuyang Filipino.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: ang mga naninirahan sa lupa
  rationale: Pinananatili nito ang pandiwang anyo at ang paulit-ulit na parirala sa Pahayag.
- source_word: ἐκ τοῦ οἴνου
  choice: sa alak
  rationale: Sa Filipino, likas na ipinahihiwatig ng “nalasing … sa alak” ang pinagmulan o sanhi na tinutukoy ng ἐκ.
- source_word: τῆς πορνείας αὐτῆς
  choice: ng kanyang pakikiapid
  rationale: Pinananatili nito ang kaugnayan sa ἐπόρνευσαν at ang matinding larawang seksuwal, habang hindi isinasara ang mas malawak nitong simbolikong kahulugan.
theological_decisions:
- issue: Kung tahasang ipaliliwanag ang πορνεύω/πορνεία bilang idolatriya o tiwaling alyansang pampolitika at panrelihiyon
  choice: Panatilihin sa pangunahing teksto ang larawan ng pakikiapid
  alternative: Isalin bilang pagtataksil sa Diyos o pakikipag-alyansa sa idolatriya
  rationale: Sinasadyang gamitin ng Pahayag ang larawang seksuwal upang katawanin ang katiwalian at pagtataksil. Ang pagpapanatili rito ay hindi agad nagpapasya kung alin sa mga simbolikong sanggunian ang nangingibabaw.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pakikiapid” sa halip na isang teknikal o tahasang paraprasis upang manatiling malinaw sa karaniwang mambabasa at mapanatili ang simbolikong tensiyon ng orihinal.
