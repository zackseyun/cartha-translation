source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: tl
  text: Iisa ang kanilang pag-iisip[a], at ibinibigay nila sa halimaw ang kanilang kapangyarihan at awtoridad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Iisa ang kanilang layunin.” Literal na sinasabi ng Griyego na sila ay “may isang pag-iisip,” na maaaring tumukoy sa nagkakaisang pasya o layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: kanila
  rationale: Tumutukoy ito sa sampung hari sa naunang talata. Sa Filipino, likas na naipahihiwatig ang paksa sa pariralang “ang kanilang pasya” nang hindi inuulit ang isang mabigat na demonstratibo.
- source_word: μίαν γνώμην ἔχουσιν
  choice: Iisa ang kanilang pasya
  rationale: Pinananatili nito ang pagkakaisa ng kanilang pag-iisip o layunin, habang ang “pasya” ay angkop sa konteksto ng sama-samang pampolitikang pagpapasiya. Hindi nito nililimitahan ang diwa sa opinyon lamang.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Tumutukoy sa aktuwal na lakas o kakayahang kumilos; “kapangyarihan” ang pinakakaraniwan at malinaw na katumbas sa kontekstong apokaliptiko at pampolitika.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinakikita ang karapatan o saklaw na mamahala, na naiiba sa aktuwal na kapangyarihan. Ang “awtoridad” ay natural at malinaw sa modernong Filipino.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: ang kanilang kapangyarihan at awtoridad
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkaibang konsepto at likas sa Filipino ang minsanang paggamit ng panghalip na paari para sa dalawang pangngalan.
- source_word: τῷ θηρίῳ
  choice: sa halimaw
  rationale: Ang “halimaw” ang malinaw at nakaugaliang salin ng θηρίον bilang partikular na apokaliptikong nilalang sa Pahayag.
- source_word: διδόασιν
  choice: ibinibigay nila
  rationale: Pinananatili ang pangkasalukuyang aspekto ng pangitain at ang tuwirang diwa ng pagbibigay, nang hindi dinaragdagan ng interpretasyong gaya ng ganap na pagsuko.
theological_decisions:
- issue: Ang diwa ng μίαν γνώμην ἔχουσιν sa kontekstong apokaliptiko at pampolitika
  choice: Iisa ang kanilang pasya
  alternative: Iisa ang kanilang pag-iisip; Iisa ang kanilang layunin
  rationale: Maaaring tumukoy ang γνώμη sa pag-iisip, pasya, hangarin, o layunin. Ang “pasya” ay natural sa konteksto ng magkakasamang hari at sapat na malawak upang katawanin ang nagkakaisang pagpapasiya, samantalang inilalahad sa talababa ang lehitimong alternatibo.
- issue: Pagkilala sa pagkakaiba ng δύναμις at ἐξουσία
  choice: kapangyarihan at awtoridad
  alternative: lakas at karapatang mamahala
  rationale: Ang pagpapanatili ng dalawang salita ay hindi nagsasanib sa aktuwal na kakayahang kumilos at sa karapatang mamahala, kaya nananatili ang pampolitika at teolohikal na bigat ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “iisa ang kanilang pasya” bilang likas na idyoma, at pinanatili ang magkahiwalay na “kapangyarihan” at “awtoridad.”
