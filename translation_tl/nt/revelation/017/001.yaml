    rationale: Ang idyomang ito ay euphemistic at semantikong malabo; hindi nito malinaw na tinutukoy ang isang prostitute at maaaring mangahulugan ng ibang uri ng nagtitinda ng libangan. Dapat panatilihin ng salin ang direktang metaporang seksuwal at polemikal ng Griyego.
  - severity: low
    issue: Hindi tahasang naipapakita ng “na may pitong mangkok” ang pandiwaring ἐχόντων.
    rationale: Ang “na may hawak na pitong mangkok” ay mas tumpak sa participial na paglalarawan ng mga anghel at nananatiling likas sa Filipino.
  - severity: low
