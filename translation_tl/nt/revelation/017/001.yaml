revisions:
- from: Pagkatapos, dumating ang isa sa pitong anghel na may pitong mangkok. Kinausap niya ako at sinabi, “Halika, ipapakita ko sa iyo ang hatol[a] sa dakilang babaeng nagbebenta ng aliw[b] na nakaupo sa maraming tubig.”
  to: Pagkatapos, dumating ang isa sa pitong anghel na may hawak na pitong mangkok. Nakipag-usap siya sa akin at sinabi, “Halika, ipapakita ko sa iyo ang hatol[a] sa dakilang patutot na nakaupo sa maraming tubig.”
  rationale: Pinalitan ang euphemistic at malabong “babaeng nagbebenta ng aliw” ng “patutot,” ang tuwirang katumbas ng πόρνη sa talinghagang ito. Nilinaw rin na ang mga anghel ay may hawak na mga mangkok at inayos ang pandiwang pananalita upang maipakita ang pakikipag-usap (μετ’ ἐμοῦ). Pinanatili ang “hatol” para sa κρίμα at ang simbolikong larawan ng pag-upo sa maraming tubig.
