id: REV.17.1
reference: Revelation 17:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: tl
  text: Pagkatapos, dumating ang isa sa pitong anghel na may hawak na pitong mangkok. Nakipag-usap siya sa akin at sinabi, “Halika, ipapakita ko sa iyo ang hatol[a] sa dakilang patutot na nakaupo sa maraming tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkondena” o “kaparusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Pagkatapos
  rationale: Ipinahahayag ang pagpapatuloy ng salaysay sa natural na Tagalog habang pinananatili ang puwersa ng pang-ugnay.
- source_word: ἦλθεν
  choice: dumating
  rationale: Tuwirang salaysay ng paglapit o pagdating ng anghel.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: isa sa pitong anghel
  rationale: Natural na Tagalog para sa partitive construction.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: na may pitong mangkok
  rationale: Tinutukoy kung aling pangkat ng mga anghel ang tinutukoy; ang “mangkok” ay angkop sa sisidlang φιάλη sa larawang gamit ng Pahayag.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: Kinausap niya ako at sinabi
  rationale: Natural sa makabagong Tagalog at pinananatili ang diwa ng pakikipag-usap na ipinahihiwatig ng μετά.
- source_word: Δεῦρο
  choice: Halika
  rationale: Maikli at natural na paanyaya o utos na lumapit.
- source_word: δείξω σοι
  choice: ipapakita ko sa iyo
  rationale: Tuwirang kumakatawan sa future indicative.
- source_word: τὸ κρίμα
  choice: ang hatol
  rationale: Sinasaklaw ng “hatol” ang pasiyang panghukuman at maaari ring tumukoy sa kaparusahang bunga nito, nang hindi agad nililimitahan ang kahulugan.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: sa dakilang babaeng nagbebenta ng aliw
  rationale: Malinaw, kasalukuyan, at marangal na salin ng πόρνη na pinananatili ang matinding propetikong talinghaga nang hindi gumagamit ng lipas o labis na magaspang na katawagan.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: na nakaupo sa maraming tubig
  rationale: Pinananatili ang kakaibang simbolikong larawan ng Griyego sa halip na ipaliwanag ito nang maaga.
theological_decisions:
- issue: Ang talinghagang πόρνη bilang katawagan sa Babilonia
  choice: dakilang babaeng nagbebenta ng aliw
  alternative: dakilang patutot
  rationale: Pinananatili ang seksuwal at polemikong lakas ng propetikong talinghaga nang hindi nagpapasok ng tiyak na pagkakakilanlang doktrinal para sa Babilonia.
- issue: Ang saklaw ng κρίμα sa kontekstong apokaliptiko
  choice: hatol
  alternative: paghatol o kaparusahan
  rationale: Ang “hatol” ay hindi nagpapasiya nang maaga kung ang diin ay nasa pasiyang panghukuman, pagkondena, o kaparusahang ipapataw.
translation_notes:
  register: Makabago at dignified na Filipino, na may malinaw na ayos ng pangungusap. Hinati ang mahabang sugnay upang maging madaling basahin, ngunit pinanatili ang simbolikong larawang “nakaupo sa maraming tubig.”
