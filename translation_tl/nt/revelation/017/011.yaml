  naturalness: Marangal at natural sa kabuuan. Mas malinaw at mas idiomatiko ang “siya mismo ang ikawalo,” “siya ay mula sa pito,” at “nagtutungo sa kapahamakan.”
  terminology: Ang “halimaw” ay angkop na matatag na katawagan para sa θηρίον sa apokaliptikong konteksto. Ang “kapahamakan” ay angkop para sa ἀπώλεια. Wasto ring huwag idagdag ang “hari” sa pangunahing teksto.
