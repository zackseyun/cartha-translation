source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: tl
  text: At ang halimaw na dati'y naroon ngunit ngayo'y wala ay siya mismo ang ikawalo[a], at siya ay mula sa pito[b], at nagtutungo sa kapahamakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya mismo ang ikawalong hari.” Ipinahihiwatig ng konteksto ang pangngalang “hari,” ngunit hindi ito tahasang nakasulat sa Griyego.
    reason: alternative_reading
  - marker: b
    text: O “isa sa pito.” Mas literal na “mula sa pito” ang Griyego, na maaaring tumukoy sa pinagmulan, pagiging kabilang, o malapit na kaugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: halimaw
  rationale: Sa Pahayag, tumutukoy ito sa isang nakatatakot at sagisag na kapangyarihang salungat sa Diyos. Mas angkop ang “halimaw” kaysa sa pangkalahatang “hayop” upang mapanatili ang apokaliptikong bigat.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: na dati'y naroon ngunit ngayo'y wala
  rationale: Pinananatili nito ang matalim na paghahambing ng dating pag-iral at kasalukuyang pagkawala, habang natural sa modernong Tagalog. Hindi nito ipinapalagay na hindi na muling lilitaw ang halimaw.
- source_word: αὐτὸς
  choice: siya ring
  rationale: Ipinahahayag ang diin ng αὐτός at natural na tumutukoy sa personipikadong “halimaw” sa Tagalog nang hindi tahasang nagpapasya kung literal itong isang lalaking persona.
- source_word: ὄγδοός
  choice: ikawalo
  rationale: Walang tahasang pangngalan pagkatapos ng ordinal sa Griyego. Ang “ikawalo” ay nagpapanatili sa pagkakait ng pangngalang ipinahihiwatig ng konteksto.
- source_word: ἐκ τῶν ἑπτά
  choice: mula sa pito
  rationale: Pinananatili ng “mula sa” ang posibleng kahulugan ng pinagmulan, pagiging kabilang, o malapit na kaugnayan, sa halip na limitahan ito sa “isa sa pito.”
- source_word: εἰς ἀπώλειαν
  choice: sa kapahamakan
  rationale: Ang “kapahamakan” ay malinaw, marangal, at angkop sa pangwakas na pagkawasak o hatol na ipinahihiwatig ng ἀπώλεια.
- source_word: ὑπάγει
  choice: patungo siya
  rationale: Inilalarawan nito ang galaw tungo sa tiyak na hantungan at likas sa Tagalog, nang hindi nagdaragdag ng aspektong wala sa teksto.
theological_decisions:
- issue: Kung tahasang ilalagay ang ipinahihiwatig na pangngalang “hari” pagkatapos ng “ikawalo”
  choice: Iwan bilang “ikawalo” sa pangunahing teksto.
  alternative: “ikawalong hari”
  rationale: Mga hari ang tinatalakay sa kalapit na konteksto, ngunit walang salitang βασιλεύς sa talatang ito. Pinananatili ng pangunahing teksto ang kaiklian at simbolikong kalabuan ng Griyego; inilalahad sa talababa ang maaaring ipinahihiwatig na pangngalan.
- issue: Kung isasalin ang ἐκ τῶν ἑπτά bilang “isa sa pito”
  choice: “mula sa pito”
  alternative: “isa sa pito”
  rationale: Maaaring tumukoy ang parirala sa pinagmulan, pagiging kabilang, o kaugnayan sa pito. Hindi nilulutas ng salin ang sadyang malabong relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “halimaw” bilang matatag na apokaliptikong katawagan; pinanatili ang maikli at mahiwagang anyo ng mga pariralang “ikawalo” at “mula sa pito.”
