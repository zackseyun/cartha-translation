id: REV.17.7
reference: Revelation 17:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: tl
  text: At sinabi sa akin ng anghel, “Bakit ka namangha? Sasabihin ko sa iyo ang hiwaga ng babae at ng halimaw na nagdadala sa kanya[a]—ang halimaw na may pitong ulo at sampung sungay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pumapasan sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασας
  choice: namangha
  rationale: Ipinahahayag ng θαυμάζω ang matinding pagtataka o pagkagulat; natural at marangal sa modernong Tagalog ang “namangha” at hindi ito nagpapahiwatig ng simpleng pag-uusisa lamang.
- source_word: μυστήριον
  choice: hiwaga
  rationale: Tumutukoy ito sa isang nakatagong katotohanang ihahayag, hindi lamang sa isang palaisipan. Pinananatili ng “hiwaga” ang apokaliptiko at teolohikal na diwa.
- source_word: γυναικός
  choice: babae
  rationale: Bagaman maaaring mangahulugan ang γυνή na babae o asawa, walang ugnayang mag-asawa sa pariralang ito; isang sagisag na babae ang tinutukoy.
- source_word: θηρίου
  choice: halimaw
  rationale: Sa Pahayag, ang θηρίον ay isang mapanganib at nakatatakot na nilalang sa pangitaing apokaliptiko. Mas malinaw na naihahatid ng “halimaw” ang masasamang konotasyon kaysa sa pangkalahatang “hayop.”
- source_word: βαστάζοντος
  choice: nagdadala sa kanya
  rationale: Maaaring mangahulugan ang βαστάζω na magdala o pumasan. Ang “nagdadala sa kanya” ay malinaw at natural sa Tagalog para sa larawan ng babaeng nasa ibabaw ng halimaw, habang ang leksikal na alternatibo ay inilagay sa talababa.
- source_word: ἔχοντος
  choice: na may
  rationale: Ang pandiwaring ito ay naglalarawan sa halimaw. Ang “na may” ay maikli at natural na paraan upang panatilihin ang ugnayang iyon.
- source_word: κεφαλάς
  choice: ulo
  rationale: Pinananatili ang literal na larawang anatomikal na mahalaga sa pangitain.
- source_word: κέρατα
  choice: sungay
  rationale: Pinananatili ang literal at simbolikong larawan ng mga sungay na ginagamit sa Pahayag at sa panitikang apokaliptiko.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Ito ang tuwiran at natural na katumbas ng pariralang patanong.
- source_word: ἐρῶ σοι
  choice: Sasabihin ko sa iyo
  rationale: Tuwirang ipinakikilala nito ang paliwanag na kasunod na ibibigay ng anghel, nang hindi nagdaragdag ng kahulugang wala sa λέγω.
theological_decisions:
- issue: Tinutukoy ng paglalarawang “may pitong ulo at sampung sungay”
  choice: Malinaw na iniugnay ang paglalarawan sa halimaw sa pamamagitan ng pag-uulit na “ang halimaw.”
  alternative: Maaaring gumamit ng mas maluwag na kayarian na hindi gaanong malinaw kung babae o halimaw ang inilalarawan.
  rationale: Ang mga genitibong pandiwaring τοῦ βαστάζοντος at τοῦ ἔχοντος ay umaayon sa θηρίου, hindi sa γυναικός. Kaya dapat ipakita ng salin na ang halimaw ang nagdadala sa babae at may pitong ulo at sampung sungay.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang em dash upang malinaw na maikabit sa halimaw ang huling paglalarawan nang hindi binabago ang kahulugan ng Griyego.
