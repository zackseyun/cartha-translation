  source_fidelity: Tumpak ang salin sa SBLGNT. Naipapahayag nito ang nakaraang pagkamangha (ἐθαύμασας), ang pangakong maghahayag ang anghel (ἐρῶ σοι), at ang “hiwaga” bilang bagay na ipaliliwanag. Malinaw ring ang halimaw, hindi ang babae, ang nagdadala sa babae at siyang may pitong ulo at sampung sungay.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Bakit ka namangha?” at “Sasabihin ko sa iyo” ay tuwiran at angkop sa tinig ng pangitaing apokaliptiko. Bagaman may pag-uulit ng “ang halimaw,” nakatutulong ito upang alisin ang anumang maling pagkakabit ng huling paglalarawan at hindi nakabibigat sa daloy.
  terminology: Ang “hiwaga,” “babae,” “halimaw,” “ulo,” at “sungay” ay angkop at pare-pareho sa imaheng apokaliptiko. Ang “halimaw” ay isang wastong matinding katumbas ng θηρίον sa kontekstong ito. Ang talababa para sa βαστάζοντος ay lehitimong alternatibong leksikal.
