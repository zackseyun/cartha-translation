  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang babae na “lasing sa dugo,” ang magkahiwalay ngunit magkaugnay na “mga banal” at “mga saksi ni Jesus,” at ang mariing pagkamangha ni Juan matapos niya siyang makita. Hindi pinipilit ng “ni Jesus” ang saklaw ng genitive.'
