  terminology: Ang “mga banal” ay angkop na katumbas ng τῶν ἁγίων sa kontekstong ito. Ang “mga saksi ni Jesus” ay wastong pinananatiling pangunahing salin para sa μαρτύρων, habang maayos na itinatala ng talababa ang kontekstuwal na alternatibong “mga martir ni Jesus.”
