id: REV.17.6
reference: Revelation 17:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: tl
  text: At nakita ko ang babae na lasing sa dugo ng mga banal at sa dugo ng mga saksi ni Jesus.[a] Nang makita ko siya, labis akong namangha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga martir ni Jesus.” Ang salitang Griyego ay maaaring mangahulugang “mga saksi” o “mga martir”; dahil binabanggit dito ang kanilang dugo, lalo itong nagpapahiwatig ng pagkamartir.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν
  choice: lasing
  rationale: Likas at matindi ang larawang “lasing sa dugo” sa Filipino at tapat nitong inilalarawan ang kalagayan ng babae.
- source_word: ἐκ τοῦ αἵματος
  choice: sa dugo ng
  rationale: Bagaman literal na may diwang “mula sa,” hinihingi ng natural na idyomang Filipino kasama ng “lasing” ang “sa,” nang hindi nawawala ang larawan ng pagkalasing dahil sa dugo.
- source_word: τῶν ἁγίων
  choice: mga banal
  rationale: Maikli, tradisyonal, at nauunawaan bilang mga taong itinalaga sa Diyos.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: mga saksi ni Jesus
  rationale: Pinananatili ng “mga saksi” ang pangunahing diwa ng μάρτυρες, samantalang ang pagbanggit sa kanilang dugo ay malinaw na nagpapahiwatig na pinatay sila dahil sa kanilang pagsaksi. Ang “ni Jesus” ay sadyang hindi nilulutas kung sila ay mga saksing nauukol kay Jesus o nagpapatotoo tungkol sa kanya.
- source_word: ἐθαύμασα
  choice: namangha
  rationale: Natural na modernong Filipino para sa matinding pagtataka o pagkamangha, nang hindi ipinahihiwatig na sumang-ayon si Juan sa nakita niya.
- source_word: ἰδὼν αὐτὴν
  choice: Nang makita ko siya
  rationale: Likas na temporal na sugnay sa Filipino para sa aorist participle at malinaw ang kaugnayan nito sa pagkamangha.
- source_word: θαῦμα μέγα
  choice: labis
  rationale: Ang cognate accusative ay nagpapalakas sa pandiwa; natural itong naihahayag sa Filipino sa pamamagitan ng pang-abay na “labis.”
theological_decisions:
- issue: Kahulugan ng μάρτυρες sa konteksto ng pag-uusig
  choice: mga saksi ni Jesus
  alternative: mga martir ni Jesus
  rationale: Ang “mga saksi” ay nagpapanatili sa batayang leksikal na kahulugan at sa diin ng Pahayag sa pagpapatotoo. Gayunman, dahil dugo nila ang binabanggit, ang kahulugang “mga martir” ay angkop ding pahiwatig at inilalagay sa talababa.
- issue: Saklaw ng genitive sa Ἰησοῦ
  choice: ni Jesus
  alternative: para kay Jesus / tungkol kay Jesus
  rationale: Pinananatili ng payak na genitive ang tunay na posibilidad na tumukoy ito sa pag-aari o kaugnayan kay Jesus, o sa pagpapatotoo tungkol sa kanya, sa halip na sapilitang pumili ng isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding apokaliptikong larawang “lasing sa dugo” at ang leksikal na tensiyon sa pagitan ng “mga saksi” at “mga martir.”
