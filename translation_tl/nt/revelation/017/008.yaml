revisions:
- from: Ang halimaw na nakita mo ay dating naroon ngunit wala ngayon. Malapit na itong umahon mula sa kalaliman at tumungo sa kapahamakan. Mamamangha[a] ang mga naninirahan sa lupa—sila na ang pangalan ay hindi nakasulat sa aklat ng buhay[b] mula pa nang itatag ang sanlibutan—kapag nakita nila ang halimaw, sapagkat dating naroon ito, wala ngayon, at mapaparito.[c]
  to: Ang halimaw na nakita mo ay naroon noon ngunit wala ngayon. Malapit na itong umahon mula sa kalaliman at tutungo sa kapahamakan. Mamamangha[a] ang mga naninirahan sa lupa—na ang pangalan ay hindi nakasulat sa aklat ng buhay[b] mula pa nang itatag ang sanlibutan—kapag nakita nila ang halimaw, sapagkat naroon ito noon, wala ngayon, at darating.[c]
  rationale: Pinalitan ang “mapaparito” ng “darating” upang maiwasan ang di-ibinigay na ideyang pagdating sa isang partikular na lugar. Pinag-isa ang salin ng pormulang ἦν καὶ οὐκ ἔστιν sa “naroon noon ngunit wala ngayon” at “naroon ito noon, wala ngayon” upang maipakita ang paulit-ulit na contrast ng teksto. Walang binago sa saklaw ng “mula pa nang itatag ang sanlibutan,” sa isahang “pangalan,” o sa maingat na alternatibong pagbasa ng ὅτι sa talababa.
