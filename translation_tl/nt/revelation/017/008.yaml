  source_fidelity: Kailangang iwasto ang ilang aspekto upang mas tapat na maipakita ang magkakatulad na pormulang ἦν / οὐκ ἔστιν / παρέσται. Ang “mapaparito” ay deiktiko (“pupunta rito”) at mas makitid kaysa sa hinaharap na presensiya/pagdating ng παρέσται. Ang “naroon noon ... darating” ay likas at pinananatili ang sinadyang tensiyon nang hindi nagdaragdag ng doktrina.
  naturalness: Marangal at malinaw sa pangkalahatan ang draft. Gayunman, mas natural at mas maayos ang parallelismong “naroon noon, wala ngayon, at darating” kaysa “dating naroon ... mapaparito.” Inayos din ang daloy ng unang pangungusap at ang ugnayan ng mga sugnay.
  terminology: Ang “halimaw,” “kalaliman,” “kapahamakan,” “aklat ng buhay,” at “sanlibutan” ay angkop sa modernong Filipino Tagalog at sa rehistrong apokaliptiko. Pinanatili ang isahang “pangalan,” ayon sa Griyego, at ang idyomatikong “sa aklat.”
