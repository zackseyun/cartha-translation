    issue: Ang “mapaparito” para sa παρέσται ay labis na deiktiko.
    rationale: Ang mapaparito ay nangangahulugang pagdating sa kinaroroonan ng nagsasalita. Ang παρέσται ay maaaring tumukoy sa magiging presensiya o pagdating, ngunit hindi nito hinihingi ang “rito.” Ang “darating” ay mas ligtas at natural.
