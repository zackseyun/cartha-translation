    rationale: Ginamit ang “dating naroon ngunit wala ngayon” sa una at “dating naroon ito, wala ngayon” sa huli. Ang mas tuwirang pag-uulit ng “naroon noon, wala ngayon, at darating” ay mas malinaw na nagpapakita ng estilistikong pag-uulit sa Griyego.
