id: REV.17.8
reference: Revelation 17:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: tl
  text: Ang halimaw na nakita mo ay naroon noon ngunit wala ngayon. Malapit na itong umahon mula sa kalaliman at tutungo sa kapahamakan. Mamamangha[a] ang mga naninirahan sa lupa—na ang pangalan ay hindi nakasulat sa aklat ng buhay[b] mula pa nang itatag ang sanlibutan—kapag nakita nila ang halimaw, sapagkat naroon ito noon, wala ngayon, at darating.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magtataka.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “sa ibabaw ng aklat ng buhay”; ang “sa aklat” ang likas na idyoma sa Tagalog para sa isang pangalang nakatala.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “kapag nakita nilang ang halimaw ay naroon noon, wala ngayon, at darating” o “lilitaw.” Maaaring mangahulugan ang Griyego ng “sapagkat” o “na,” at ang huling pandiwa ay tumutukoy sa pagdating o pagiging naroroon.'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: halimaw
  rationale: Karaniwang salin sa kontekstong apokaliptiko; ipinahihiwatig nito ang mabangis at sagisag na katangian, hindi lamang isang pangkalahatang hayop.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: dating naroon ngunit wala ngayon
  rationale: Pinananatili ang mariing pagtutunggali ng nakaraan at kasalukuyan habang ginagawa itong malinaw at natural sa modernong Tagalog.
- source_word: μέλλει ἀναβαίνειν
  choice: malapit na itong umahon
  rationale: Ipinahahayag ng μέλλει kasama ng pawatas ang napipintong pagkilos, at pinananatili ng “umahon” ang pataas na galaw.
- source_word: ἄβυσσος
  choice: kalaliman
  rationale: Likas at marangal na salitang Tagalog para sa apokaliptikong abyss nang hindi idinaragdag ang interpretasyong “hukay na walang ilalim.”
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: tumungo sa kapahamakan
  rationale: Ipinakikita ang pagpunta tungo sa ganap na pagkawasak o kapalarang mapangwasak; malinaw ang “kapahamakan” sa karaniwang mambabasa.
- source_word: θαυμασθήσονται
  choice: mamamangha
  rationale: Ang pandiwa ay nagpapahiwatig ng matinding pagtataka o pagkamangha; natural ang “mamamangha” sa konteksto.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: ang mga naninirahan sa lupa
  rationale: Pinananatili ang paulit-ulit na katawagan sa Pahayag at ang diwa ng matatag na paninirahan.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: sila na ang pangalan ay hindi nakasulat
  rationale: Pinananatili ang isahang “pangalan” ng Griyego sa halip na tahimik itong gawing maramihan.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: sa aklat ng buhay
  rationale: Ang “sa aklat” ang likas na idyomang Tagalog para sa pangalang nakatala sa isang aklat, bagaman literal na gumagamit ang Griyego ng pang-ukol na maaaring isaling “sa ibabaw ng.”
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula pa nang itatag ang sanlibutan
  rationale: Malinaw na temporal na salin na pinananatili ang bigat ng parirala at ang pagkakaugnay nito sa pagkakasulat ng pangalan.
- source_word: βλεπόντων
  choice: kapag nakita nila
  rationale: Natural na temporal na pagsasalin ng participle na nag-uugnay sa kanilang pagkamangha at sa pagkakita sa halimaw.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: sapagkat dating naroon ito, wala ngayon, at mapaparito
  rationale: Itinuturing na sanhi ang ὅτι sa pangunahing teksto. Ang “mapaparito” ay nagpapanatili sa hinaharap na pagdating o presensiya ng πάρειμι nang hindi tahasang nagpapasok ng ideya ng muling pagkabuhay.
theological_decisions:
- issue: Saklaw ng “mula pa nang itatag ang sanlibutan”
  choice: Iniugnay ang parirala sa hindi pagkakasulat ng pangalan sa aklat ng buhay.
  alternative: Maaaring gamitin ang kahalintulad na parirala sa ibang talata kaugnay ng ibang konsepto, ngunit walang gayong pandiwa rito na mas malapit na mapag-uugnayan.
  rationale: Sa ayos ng Griyegong pangungusap, kaagad na kasunod ng “hindi nakasulat ... sa aklat ng buhay” ang temporal na parirala. Pinananatili ang ugnayang ito nang hindi nilulutas ang mas malawak na usaping teolohikal tungkol sa pagtatalaga.
- issue: Diwa ng παρέσται
  choice: mapaparito
  alternative: darating; lilitaw; naririto sa hinaharap
  rationale: Ang hinaharap ng πάρειμι ay maaaring tumukoy sa pagdating o pagiging naroroon. Ang “mapaparito” ay nagpapanatili sa dalawang magkaugnay na diwa at sa pagtutunggali sa “wala ngayon,” nang hindi labis na binibigyang-kahulugan ang pangyayari.
- issue: Gamit ng ὅτι
  choice: sapagkat
  alternative: na
  rationale: Maaaring ipakilala ng ὅτι ang dahilan ng pagkamangha o ang nilalaman ng kanilang nakita. Pinili sa teksto ang natural na pagbasa bilang sanhi, habang tahasang pinananatili sa talababa ang alternatibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “halimaw,” “kalaliman,” “aklat ng buhay,” at “sanlibutan” upang mapanatili ang apokaliptiko at biblikal na rehistro nang hindi nagiging lipas o labis na teknikal. Pinanatili ang isahang “pangalan” at ang temporal at teolohikal na tensiyon ng talata.
