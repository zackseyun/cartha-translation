  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: tl
  text: 'Narito ang isip na may karunungan: ang pitong ulo ay pitong bundok[a] na kinauupuan ng babae, at ang mga ito ay pitong hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong burol.” Ang salitang Griyego ay maaaring tumukoy sa mga bundok o mga burol; “mga bundok” ang mas tuwirang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Narito
  rationale: Likas na panimula sa Filipino para sa isang paliwanag at pinananatili ang panturong diin ng Griyego.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: ang pag-iisip na may karunungan
  rationale: Pinananatili ang sanggunian sa νοῦς at ang idyomang humihingi ng marunong na pag-unawa, nang hindi ito ginagawang tahasang interpretasyon.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: ang pitong ulo
  rationale: Tuwirang pinananatili ang simbolikong katawagan sa halip na ipaliwanag agad ang kahulugan nito.
- source_word: ἑπτὰ ὄρη
  choice: pitong bundok
  rationale: Ang ὄρη ay tuwirang tumutukoy sa mga bundok, bagaman maaari rin itong gamitin sa mga burol; inilagay sa talababa ang leksikal na alternatibo.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: na kinauupuan ng babae
  rationale: Natural na Filipino na naghahatid sa lokatibong diwa ng ὅπου at ἐπ’ αὐτῶν nang walang alanganing pag-uulit.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: at ang mga ito ay pitong hari
  rationale: Iniuugnay ang sugnay sa pitong ulo/bundok at pinananatili ang pagkakakilanlang simboliko nang hindi tinutukoy kung mga indibidwal na pinuno o mas malawak na kapangyarihan ang tinutukoy.
theological_decisions:
- issue: Simbolikong pagkakakilanlan ng pitong ulo
  choice: Panatilihin ang mga pagtutumbas na pitong ulo, pitong bundok, at pitong hari nang hindi tinutukoy ang tiyak na historikal na katuparan.
  alternative: Tukuyin ang pitong bundok bilang pitong burol ng Roma, o ang pitong hari bilang partikular na mga emperador o kaharian.
  rationale: Nagbibigay ang talata ng mga simbolikong pagtutumbas ngunit hindi nito tahasang nilulutas ang eksaktong historikal na tinutukoy; hindi ito dapat pasiyaan ng salin.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “kinauupuan” upang maging natural ang lokatibong parirala habang pinananatili ang simbolikong larawan.
