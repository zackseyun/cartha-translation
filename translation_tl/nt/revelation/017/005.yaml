  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: tl
  text: 'At sa kanyang noo ay may nakasulat na pangalan: “Hiwaga[a], Babilonia na Dakila, ang ina ng mga babaeng bayaran at ng mga kasuklam-suklam na bagay sa lupa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “may nakasulat na pangalan, isang hiwaga: ‘Babilonia na Dakila, ang ina ng mga babaeng bayaran at ng mga kasuklam-suklam na bagay sa lupa,’” kung ang “hiwaga” ay nagpapakilala sa simbolikong kahulugan ng pangalan sa halip na maging bahagi mismo ng nakasulat na pangalan.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: sa kanyang noo
  rationale: Likas at tuwirang pahayag sa modernong Tagalog para sa lokasyon ng nakasulat na pangalan.
- source_word: ὄνομα γεγραμμένον
  choice: may nakasulat na pangalan
  rationale: Pinananatili ang pasibo at resultang diwa ng γεγραμμένον habang malinaw at natural sa Tagalog.
- source_word: μυστήριον
  choice: Hiwaga
  rationale: Ang “Hiwaga” ay may angkop na apokaliptiko at teolohikal na bigat at, sa pangunahing pagbasa, bahagi ng nakasulat na titulo.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babilonia na Dakila
  rationale: Ginagamit ang nakaugaliang anyong Tagalog na “Babilonia” at isang natural na pamagat para sa ἡ μεγάλη.
- source_word: ἡ μήτηρ
  choice: ang ina
  rationale: Tuwirang pinananatili ang tiyak at pamagat na katangian ng parirala.
- source_word: τῶν πορνῶν
  choice: ng mga babaeng bayaran
  rationale: Malinaw na tumutukoy sa mga prostitute sa karaniwang modernong Tagalog, nang hindi gumagamit ng mas malabo o labis na mapanlait na salita.
- source_word: τῶν βδελυγμάτων
  choice: ng mga kasuklam-suklam na bagay
  rationale: Ipinahahayag ang mga bagay na lubhang karima-rimarim o kasuklam-suklam, kabilang ang posibleng idolatrosong pahiwatig, nang hindi ito nililimitahan sa isang uri lamang.
- source_word: τῆς γῆς
  choice: sa lupa
  rationale: Sa ganitong pariralang Tagalog, natural na inilalarawan ang mga tao at kasuklam-suklam na bagay na nasa buong lupa; pinananatili ang pandaigdigang saklaw ng γῆ.
theological_decisions:
- issue: Kung ang μυστήριον ay bahagi ng inskripsiyon o panandang nagpapakilala sa simbolikong kahulugan ng pangalan
  choice: 'Isinama sa inskripsiyon: “Hiwaga, Babilonia na Dakila...”'
  alternative: 'Unawain bilang panimula: “may nakasulat na pangalan, isang hiwaga: ‘Babilonia na Dakila...’”'
  rationale: Walang bantas ang orihinal na Griyego na tiyak na lulutas sa sintaks. Likas na maaaring maging bahagi ng nakasulat na pangalan ang μυστήριον, ngunit tunay ding posible ang alternatibong pagbasa kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matinding apokaliptikong larawan at ang tunay na sintaktikong kalabuan ng μυστήριον sa pamamagitan ng talababa.
