id: REV.8.9
reference: Revelation 8:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: tl
  text: At namatay ang sangkatlo ng mga nilalang sa dagat—ang mga may buhay[a]—at nawasak ang sangkatlo ng mga sasakyang-dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “may mga kaluluwa” o “mga buhay na nilalang.” Sa Griyego: “ang mga may mga kaluluwa/buhay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: namatay
  rationale: Tuwirang ipinapahayag ng aorist ng ἀποθνῄσκω ang pagkamatay; natural at eksakto ang “namatay” sa Filipino.
- source_word: τὸ τρίτον
  choice: ang sangkatlo
  rationale: Likas na paraang Filipino ito upang ipahayag ang dami o bahaging one-third.
- source_word: κτισμάτων
  choice: mga nilalang
  rationale: Maaaring tumukoy ang κτίσμα sa nilikha o nilalang; dahil tinutukoy rito ang mga nasa dagat na may ψυχάς, ang “mga nilalang” ang angkop at hindi sobrang nagpapaliit sa kahulugan.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: sa dagat
  rationale: Malinaw at maikli nitong ipinapahayag ang kinaroroonan ng mga nilalang.
- source_word: τὰ ἔχοντα ψυχάς
  choice: ang mga may buhay
  rationale: Sa kontekstong ito, ang ψυχή ay tumutukoy sa buhay na taglay ng mga nilalang. Pinananatili ng “may buhay” ang diwa nang hindi nagmumungkahi ng teknikal na doktrina tungkol sa kaluluwa ng mga hayop.
- source_word: ψυχάς
  choice: buhay
  rationale: Bagaman maaaring mangahulugan ang ψυχή ng kaluluwa, buhay, sarili, o buhay na nilalang, dito ay ipinantatangi nito ang mga organismong buhay sa mga bagay na walang buhay.
- source_word: πλοίων
  choice: mga sasakyang-dagat
  rationale: Ang πλοῖον ay barko o bangka; ang “mga sasakyang-dagat” ay malinaw, marangal, at sapat na malawak upang hindi piliting tukuyin ang laki ng mga ito.
- source_word: διεφθάρησαν
  choice: nawasak
  rationale: Sa konteksto ng kapahamakang pandagat, ang passive ng διαφθείρω ay tumutukoy sa pagkawasak, hindi sa moral na katiwalian.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχάς na tumutukoy sa mga nilalang sa dagat
  choice: “may buhay” sa pangunahing teksto, na may talababa para sa literal na anyo
  alternative: “may mga kaluluwa” o “mga buhay na nilalang”
  rationale: Hindi gumagawa ang talata ng teknikal na pahayag tungkol sa antropolohiya o sa kaluluwa ng mga hayop. Ang “may buhay” ang natural na kahulugan sa konteksto, habang pinananatili ng talababa ang lexical na saklaw at tunay na kalabuan ng ψυχή.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang em dash upang malinaw na ipakitang ang “mga may buhay” ay paglalarawan sa mga nilalang sa dagat. Ang “sasakyang-dagat” ay mas malawak kaysa “barko” at angkop sa saklaw ng πλοῖον.
