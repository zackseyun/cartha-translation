  terminology: Ang “anghel,” “Diyos,” at “trumpeta” ay matatag, natural, at naaangkop na mga katawagan. Hindi idinaragdag ng salin ang ranggong “arkanghel,” kaya napapanatili ang di-tahasang pagkakakilanlan ng pitong anghel sa Griyego.
