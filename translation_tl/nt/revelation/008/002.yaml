  source_fidelity: 'Tumpak ang salin sa SBLGNT: naipapahayag ang pangitain ni Juan (εἶδον), ang tiyak na pitong anghel, ang kanilang nagpapatuloy na katayuang nasa harap ng Diyos (ἑστήκασιν), at ang di-tinukoy na tagapagbigay ng pitong trumpeta sa pamamagitan ng natural na pasibong Filipino na “binigyan sila.”'
