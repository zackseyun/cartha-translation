id: REV.8.2
reference: Revelation 8:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: tl
  text: At nakita ko ang pitong anghel na nakatayo sa harap ng Diyos[a], at binigyan sila ng pitong trumpeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na patuloy na nakatayo sa harap ng Diyos” o “na tumayo at nananatili sa harap ng Diyos”; idinidiin ng pandiwang Greek na nasa perfect tense ang kanilang pagtayo bilang isang nagpapatuloy na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Likas na salin sa pagsasalaysay ng isang pangitain; pinananatili nito ang tuwirang puwersa ng aorist nang hindi gumagamit ng makalumang pananalita.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: ang pitong anghel
  rationale: Ipinakikita ng artikulo at bilang na isang tiyak na pangkat ang tinutukoy.
- source_word: ἀγγέλους
  choice: anghel
  rationale: Sa makalangit na tagpo ng Pahayag, mga makalangit na nilalang ang malinaw na tinutukoy, hindi mga taong sugo.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Natural at marangal na Filipino ito na nagpapanatili sa ugnayang panlunan ng parirala.
- source_word: ἑστήκασιν
  choice: nakatayo
  rationale: Ipinahahayag ng Greek perfect ang nagpapatuloy na kalagayan ng pagtayo; natural itong naihahatid ng 'nakatayo' sa Filipino.
- source_word: ἐδόθησαν αὐτοῖς
  choice: binigyan sila
  rationale: Pinananatiling hindi binabanggit ang tagapagbigay, gaya ng Greek passive, habang gumagamit ng natural na pokus sa Filipino.
- source_word: σάλπιγγες
  choice: trumpeta
  rationale: Ito ang karaniwan at angkop na katawagan sa Filipino para sa σάλπιγξ sa apokaliptikong larawan.
theological_decisions:
- issue: Pagkakakilanlan at katayuan ng pitong anghel
  choice: Isinalin bilang 'ang pitong anghel na nakatayo sa harap ng Diyos' nang hindi tinutukoy ang kanilang ranggo.
  alternative: ang pitong arkanghel
  rationale: Hindi ginagamit ng Greek ang ἀρχάγγελοι at hindi nito tahasang itinatakda ang ranggo ng mga anghel; kaya hindi dapat ipasok ang mas huling tradisyon.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ang 'At' ay nagpapanatili sa ugnayang pasalaysay ng καί; ang 'nakatayo' ay mas idiomatiko kaysa literal na anyong 'nakatindig' para sa karaniwang mambabasa.
