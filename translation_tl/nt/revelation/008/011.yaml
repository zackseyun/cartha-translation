  naturalness: Natural at marangal sa pangkalahatan ang “Ajenjo,” “sangkatlo,” at “marami sa mga tao.” Hindi natural at maaaring makalito ang “sapagkat pinapait ang mga iyon,” dahil ang “mga iyon” ay malabong tinutukoy at ang pandiwang di-ganap ay nagmumungkahing nagpapatuloy na kilos.
  terminology: Ang “Ajenjo” ay katanggap-tanggap na nakaugaliang terminong biblikal para sa wormwood at ang pag-uulit nito sa maliit na titik para sa tubig ay angkop. Panatilihin ang paliwanag na ito ay isang mapait na halaman.
