id: REV.8.11
reference: Revelation 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: tl
  text: Ajenjo[a] ang pangalan ng bituin. Naging ajenjo ang sangkatlo ng mga tubig, at marami sa mga tao ang namatay dahil sa mga tubig[b], sapagkat pinait ang mga tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Ajenjo” ay wormwood, isang halamang kilala sa matinding pait. Iisang salitang Griyego ang ginamit sa pangalan ng bituin at sa nangyari sa mga tubig.
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring gawing mas tahasan ang huling bahagi: “sapagkat pinait ang mga tubig.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος λέγεται
  choice: Ajenjo ang pangalan ng bituin
  rationale: Natural na pahayag sa modernong Filipino para sa pangalan o tawag sa bituin; naihahatid nito ang diwa ng λέγεται nang hindi ginagamit ang alanganing literal na anyong “ang pangalan … ay tinatawag.”
- source_word: Ἄψινθος / ἄψινθον
  choice: Ajenjo / ajenjo
  rationale: Ginamit ang nakaugaliang pangalan sa Filipino para sa wormwood, isang napakapait na halaman. Ang pag-uulit ng iisang salita—bilang pangalan ng bituin at bilang kinahinatnan ng mga tubig—ay nagpapanatili sa sadyang ugnayang leksikal ng Griyego.
- source_word: ἐγένετο … εἰς ἄψινθον
  choice: naging ajenjo
  rationale: Pinananatili ang kongkretong larawan ng pagbabago sa halip na ipaliwanag lamang na “naging mapait,” yamang inuugnay mismo ng teksto ang pangalan ng bituin sa nangyari sa tubig.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: sangkatlo ng mga tubig
  rationale: Maikli at likas na katumbas ng partitive expression, habang pinananatili ang dami at ang pangmaramihang anyo ng ‘mga tubig.’
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: marami sa mga tao
  rationale: Pinananatili ang partitive na diwa at tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa kalalakihan.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: namatay dahil sa mga tubig
  rationale: Ipinapahayag ang pinagmulan o sanhi ng kamatayan nang hindi idinaragdag ang hindi tahasang sinabing pag-inom sa tubig.
- source_word: ἐπικράνθησαν
  choice: pinapait ang mga iyon
  rationale: Pinananatili ang pasibong diwa ng pandiwa at ang pangmaramihang reperensiya; ang ‘mga iyon’ ay pinakamalamang na tumutukoy sa mga tubig, ngunit hindi lubusang isinasara ang anyong reperensiyal ng Griyego.
theological_decisions:
- issue: Ang tinutukoy ng pangmaramihang pasibong ἐπικράνθησαν
  choice: Pinakamalamang na tumutukoy ito sa mga tubig, habang pinananatili sa pangunahing teksto ang panghalip na hindi lubusang eksplisito.
  alternative: Maaaring basahin na ang mga tao ang pinapait o pinasasama.
  rationale: 'Ang ‘mga tubig’ ang pinakamalapit at pinakanaaangkop na tinutukoy ayon sa balarila at konteksto: namatay ang mga tao dahil pinapait ang mga tubig. Gayunman, ginamit ang ‘mga iyon’ at nilinaw sa talababa ang mas malamang na pagbasa upang hindi tahimik na alisin ang pormal na posibilidad ng ibang reperensiya.'
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Pinanatili ang nakaugaliang pangalang “Ajenjo” at ipinaliwanag ito sa talababa para sa mga mambabasang hindi pamilyar sa halaman. Sadyang inulit ang “ajenjo” upang mapanatili ang wordplay at larawan ng orihinal.
