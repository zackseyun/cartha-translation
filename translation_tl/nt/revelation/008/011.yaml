    rationale: Bagaman pormal na posible ang ibang pagbasa, ang pinakamalapit at magkakaugnay na tinutukoy ng pangmaramihang passive ay ang mga tubig. Ang pangunahing teksto sa Filipino ay dapat magpahayag nito nang malinaw, gaya ng hinihingi rin ng konteksto ng pagkamatay dahil sa tubig.
