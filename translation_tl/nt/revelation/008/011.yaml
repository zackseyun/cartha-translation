    issue: Di-ganap ang “pinapait” para sa ἐπικράνθησαν.
    rationale: Ang Griyegong aorist passive ay nagsasaad ng naganap na pagpapait; ang “pinapait” ay karaniwang tumutukoy sa kasalukuyan o nagpapatuloy na kilos. “Pinait” ang mas angkop na salaysay na anyo.
