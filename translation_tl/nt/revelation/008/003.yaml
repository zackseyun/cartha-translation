id: REV.8.3
reference: Revelation 8:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: tl
  text: At dumating ang isa pang anghel at tumayo sa altar. May hawak siyang gintong insensaryo[a], at binigyan siya ng maraming insenso upang ihandog niya iyon kasama ng mga panalangin ng lahat ng mga banal[b] sa gintong altar na nasa harap ng trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gintong sisidlang sunugan ng insenso.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “upang ibigay niya iyon sa mga panalangin ng lahat ng mga banal.” Sa konteksto, ang insenso ay inihahandog na kasama ng, o idinaragdag sa, kanilang mga panalangin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: isa pang anghel
  rationale: Likas na ipinahihiwatig sa Tagalog na isa itong karagdagang anghel sa pagkakasunod-sunod, hindi ibang uri ng nilalang.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: tumayo sa tabi ng altar
  rationale: Iniiwasan nito ang maling pahiwatig na tumayo ang anghel sa ibabaw mismo ng altar; ang ἐπί na may genitive ay angkop na unawaing lokasyon sa altar.
- source_word: λιβανωτὸν χρυσοῦν
  choice: gintong insensaryo
  rationale: Ang λιβανωτός ay sisidlang ginagamit sa pagsusunog o paghahandog ng insenso. Ang “insensaryo” ay maikli at tiyak, at ipinaliliwanag sa talababa para sa karaniwang mambabasa.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: binigyan siya ng maraming insenso
  rationale: Pinananatili ang diwa ng pasibong pagkakaloob habang natural sa Tagalog ang “maraming insenso” bilang tumutukoy sa malaking dami.
- source_word: ἵνα δώσει
  choice: upang ihandog niya iyon
  rationale: Ang ἵνα ay nagpapahayag ng layunin. Bagaman karaniwang “ibigay” ang δίδωμι, ang konteksto ng insenso at altar ay nagpapahiwatig ng paghahandog; ang “iyon” ay tumutukoy sa insenso.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: kasama ng mga panalangin ng lahat ng mga banal
  rationale: Mahirap at siksik ang gamit ng dative. Ipinahahayag ng salin ang malamang na ugnayang magkasamang inihahandog ang insenso at mga panalangin, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: ἅγιοι
  choice: mga banal
  rationale: Ito ang maikli at nakaugaliang katawagan sa mga taong itinalaga sa Diyos, nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: sa gintong altar
  rationale: Sa konteksto ng paghahandog, ipinahihiwatig ng ἐπί na may accusative ang direksiyon patungo o paglalagay sa altar; natural itong maipahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: na nasa harap ng trono
  rationale: Malinaw na inilalarawan nito ang kinalalagyan ng gintong altar kaugnay ng trono.
theological_decisions:
- issue: Ugnayan ng insenso at ng mga panalangin ng mga banal
  choice: Inihahandog ang insenso kasama ng mga panalangin ng lahat ng mga banal.
  alternative: 'Mas literal: ibinibigay ang insenso “sa mga panalangin” ng lahat ng mga banal.'
  rationale: Siksik at maaaring pagtalunan ang sintaks, ngunit sinusuportahan ng larawan ng pagsamba sa templo ang pag-unawang sinasamahan o dinaragdagan ng insenso ang mga panalangin. Hindi nito ipinapasok ang mas malawak na doktrina tungkol sa pamamagitan ng mga anghel.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “altar,” “insenso,” at “insensaryo” bilang karaniwang bokabularyong panrelihiyon; ipinaliwanag ang hindi gaanong pamilyar na “insensaryo” sa talababa. Hinati sa dalawang pangungusap para luminaw ang mahabang Griyegong pangungusap nang hindi binabago ang pagkakasunod ng mga pangyayari.
