source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: tl
  text: At ang usok ng insenso ay umakyat kasama ng mga panalangin ng mga banal, mula sa kamay ng anghel, sa harap ng Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumailanlang” para sa “umakyat.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “kasama ng mga panalangin ng mga banal.” Iniuugnay ng pananalita ang usok ng insenso sa mga panalangin ngunit hindi tahasang sinasabing iisa ang mga ito sa talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: pumailanlang
  rationale: Naglalarawan ang aorist na ἀναβαίνω ng pag-akyat. Likas at marangal sa Tagalog ang “pumailanlang” para sa usok at malinaw nitong pinananatili ang konkretong larawang paitaas ang galaw.
- source_word: καπνὸς
  choice: usok
  rationale: Karaniwang literal na kahulugan ang “usok”; hindi kailangang gawing mas interpretatibo ang apokaliptikong larawan.
- source_word: θυμιαμάτων
  choice: ng insenso
  rationale: Karaniwang tumutukoy ang θυμίαμα sa insenso. Bagaman maramihan ang anyong Griyego, natural itong ipahayag bilang pangngalang di-mabilang sa Tagalog.
- source_word: ταῖς προσευχαῖς
  choice: kasama ng mga panalangin
  rationale: Pinananatili ng “kasama ng” ang ugnayang ipinahihiwatig ng datibo nang hindi tinutukoy kung ang insenso ay sumasagisag, sumasama, o nagdadala sa mga panalangin.
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Ang ἅγιοι ay karaniwang katawagan sa mga taong ibinukod para sa Diyos. Sa Tagalog na biblikal na gamit, “mga banal” ang maikli at angkop na katumbas, nang hindi ito nililimitahan sa mga taong kinanonisa sa kalaunang tradisyon.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: mula sa kamay ng anghel
  rationale: Malapit ito sa estrukturang Griyego at pinananatili ang biswal na larawan ng usok na nagmumula sa kamay ng anghel.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Likas na katumbas ito ng “before/in the presence of God” at pinananatili ang diwa ng pagiging nasa presensiya ng Diyos.
theological_decisions:
- issue: Ugnayan ng insenso at ng mga panalangin
  choice: “ang usok ng insenso ay pumailanlang kasama ng mga panalangin ng mga banal”
  alternative: “ang usok ng insenso, na siyang mga panalangin ng mga banal” o “ang usok ay pumailanlang para sa mga panalangin”
  rationale: Iniuugnay ng konstruksiyong Griyego ang usok at mga panalangin ngunit hindi tahasang ipinapantay ang mga ito sa talatang ito. Pinananatili ng salin ang tunay na kalabuan at hindi lumalampas sa sinasabi ng teksto.
- issue: Tinutukoy ng “mga banal”
  choice: Ginamit ang “mga banal” bilang katawagan sa bayan ng Diyos nang hindi ito higit na nililimitahan.
  alternative: “banal na bayan ng Diyos”
  rationale: Malawak na tumutukoy sa konteksto ang ἅγιοι sa mga taong banal para sa Diyos. Ang maikling anyo ay nagpapanatili ng katawagang biblikal at umiiwas sa denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang biswal at panliturhiyang himig ng pangitain nang hindi gumagamit ng sobrang arkaiko o denominasyonal na pananalita.
