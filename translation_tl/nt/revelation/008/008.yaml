  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: tl
  text: At humihip ng trumpeta ang ikalawang anghel. Isang bagay na tulad ng isang malaking bundok na nagliliyab sa apoy ang inihagis sa dagat, at naging dugo ang ikatlong bahagi ng dagat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang trumpeta
  rationale: Ang pandiwa ay nangangahulugang pagpapatunog ng trumpeta. Likas sa modernong Tagalog ang pariralang “hinipan ang trumpeta,” at ipinahihiwatig ng konteksto ang layon.
- source_word: ὡς
  choice: may isang bagay na tulad ng
  rationale: Ipinahahayag ng ὡς ang pagkakatulad, hindi tiyak na pagkakakilanlan. Pinananatili nito ang pangitain nang hindi ipinapalagay na literal na bundok ang bagay.
- source_word: ὄρος μέγα
  choice: isang malaking bundok
  rationale: Tuwirang salin ito na natural at marangal sa modernong Tagalog, nang hindi dinaragdagan ang tindi ng paglalarawan.
- source_word: πυρὶ καιόμενον
  choice: nagliliyab sa apoy
  rationale: Pinananatili nito ang matingkad na larawan ng bagay na nag-aapoy nang hindi ito ipinapakahulugang bulkan, bulalakaw, o anumang partikular na bagay.
- source_word: ἐβλήθη
  choice: inihagis
  rationale: Tumpak na ipinakikita ng anyong balintiyak na ang bagay ay inihagis; hindi tinutukoy ng teksto kung sino ang naghagis.
- source_word: εἰς τὴν θάλασσαν
  choice: sa dagat
  rationale: Sa Tagalog, natural nang ipinahihiwatig ng “inihagis sa dagat” ang kilos papasok dito; ang “dagat” ang tuwirang katumbas ng θάλασσα.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: ang ikatlong bahagi ng dagat
  rationale: Malinaw at likas na ipinapahayag nito ang bahaging isang-katlo at pinananatili ang paulit-ulit na sukat ng hatol sa Pahayag.
- source_word: αἷμα
  choice: dugo
  rationale: Tuwirang kahulugan ito ng salita; walang batayan upang dagdagan o paliitin ang pahayag na naging dugo ang bahagi ng dagat.
theological_decisions:
- issue: Ang kalikasan ng bagay na tulad ng bundok
  choice: Isinalin ang paghahambing nang hindi kinikilalang literal o simboliko ang bagay.
  alternative: Maaaring unawain ito bilang literal na bundok, bagay na gaya ng bulalakaw, o simbolikong larawan ng hatol.
  rationale: Ang ὡς ay naghuhudyat ng pagkakatulad. Dapat panatilihin ng salin ang kalabuan ng pangitain at huwag pasiyahan kung literal, simboliko, o kapwa ang larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa apokaliptikong salaysay. Ginamit ang “may isang bagay na tulad ng” upang natural na maipahayag ang ὡς at maiwasang kilalanin ang bagay bilang mismong bundok. Hindi kailangan ang talababa sapagkat malinaw na sa pangunahing teksto ang paghahambing.
