id: REV.8.12
reference: Revelation 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: tl
  text: At hinipan ng ikaapat na anghel ang trumpeta. Tinamaan ang ikatlong bahagi ng araw, ang ikatlong bahagi ng buwan, at ang ikatlong bahagi ng mga bituin, upang magdilim ang ikatlong bahagi ng mga ito at hindi magliwanag ang maghapon sa ikatlong bahagi nito,[a] at gayundin ang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaya nagdilim ang ikatlong bahagi ng mga ito at hindi nagliwanag ang maghapon sa ikatlong bahagi nito.” Ang kayariang Griyego pagkatapos ng “upang” ay maaari ring ipahayag na may higit na diwa ng resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang trumpeta
  rationale: Likas sa modernong Filipino ang pariralang ito para sa pagtunog ng trumpeta at malinaw nitong ipinahihiwatig ang kilos ng σαλπίζω.
- source_word: ἐπλήγη
  choice: Tinamaan
  rationale: Pinananatili nito ang balintiyak na diwa ng pagkabagabag o paghampas sa mga bagay sa langit, nang hindi gumagamit ng lipas o sobrang interpretatibong pananalita.
- source_word: τὸ τρίτον
  choice: ang ikatlong bahagi
  rationale: Tumpak at natural itong katumbas ng paulit-ulit na sukat na one-third; pinanatili ang pag-uulit dahil mahalaga ito sa ritmo at saklaw ng pangitain.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: araw ... buwan ... mga bituin
  rationale: Tuwirang katumbas ang mga ito ng mga katawang panlangit sa Griyego.
- source_word: ἵνα
  choice: kaya
  rationale: Sa kontekstong ito, malinaw na naihahayag ng 'kaya' ang ibinungang pagdidilim, habang hindi lubusang inaalis ang posibleng layuning diwa ng ἵνα; inilalahad sa talababa ang alternatibong mas nakatuon sa layunin.
- source_word: σκοτισθῇ
  choice: nagdilim
  rationale: Natural itong Filipino para sa pagkakaroon ng dilim sa mga tanglaw sa langit. Bagaman hindi lantad na balintiyak sa anyo, napapanatili ng konteksto na ang pagdidilim ay bunga ng pagkakatama.
- source_word: αὐτῶν
  choice: mga iyon
  rationale: Malinaw na tumutukoy nang maramihan sa araw, buwan, at mga bituin.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: Hindi nagliwanag ang araw
  rationale: Sa konteksto ng kosmikong pagdidilim, ang φαίνω ay pinakamalinaw na tumutukoy sa pagliwanag. Ang 'araw' dito ay nangangahulugang panahon ng liwanag sa maghapon, hindi ang katawang panlangit lamang.
- source_word: τὸ τρίτον αὐτῆς
  choice: sa ikatlong bahagi nito
  rationale: Pinananatili nito ang posibleng saklaw o tagal na apektado nang hindi labis na tinutukoy kung eksaktong paano sinusukat ang bahaging iyon.
- source_word: ἡ νὺξ ὁμοίως
  choice: at gayundin ang gabi
  rationale: Maikli at natural na ipinahahayag na ang parehong limitasyon ay inilalapat sa gabi.
theological_decisions:
- issue: Kalikasan ng larawan ng kosmikong paghatol
  choice: Tuwirang isinalin ang pagdidilim ng mga katawang panlangit bilang wikang apokaliptiko, nang hindi sinasabing ito ay literal lamang, simboliko lamang, o kapwa.
  alternative: Ituring sa salin bilang mahigpit na literal na pangyayaring astronomiko o bilang purong simbolong pampolitika/kosmiko.
  rationale: Hindi nilulutas ng talata ang paraan ng katuparan ng pangitain; dapat panatilihin ng salin ang larawan at teolohikal na tensiyon nito.
- issue: Diwa ng ἵνα at μὴ φάνῃ
  choice: 'Ginamit sa pangunahing teksto ang resultang diwa: ''kaya ... Hindi nagliwanag.'''
  alternative: 'Mas layuning diwa: ''upang ... hindi magliwanag.'''
  rationale: Maaaring magpahiwatig ang ἵνα ng layunin o resulta. Natural sa daloy ng pangitain ang resultang pagbasa, ngunit tunay ang alternatibong layuning diwa at kaya'y inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang paulit-ulit na 'ikatlong bahagi' upang maipakita ang diin at sukat ng orihinal. Ginamit ang 'trumpeta' bilang karaniwang katawagan sa instrumentong σάλπιγξ na ipinahihiwatig ng pandiwa.
