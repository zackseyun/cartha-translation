id: REV.8.13
reference: Revelation 8:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: tl
  text: At nakita ko at narinig ang isang agila[a] na lumilipad sa gitna ng himpapawid[b] at nagsasabi sa malakas na tinig, “Sa aba, sa aba, sa aba ng mga naninirahan sa lupa dahil sa natitirang mga tunog ng trumpeta ng tatlong anghel na malapit nang humihip!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “isang anghel” sa halip na “isang agila.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “sa kalagitnaan ng langit”; tumutukoy ang salitang Griyego sa kalagitnaan o kaitaasan ng himpapawid.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: agila
  rationale: Karaniwang kahulugan nito ang “agila.” Walang banggit sa bangkay o ibang kontekstong magbibigay-dahilan upang piliin ang “buwitre.”
- source_word: μεσουρανήματι
  choice: sa gitna ng himpapawid
  rationale: Tumutukoy ito sa mataas at lantad na bahagi ng langit. Ang “gitna ng himpapawid” ay malinaw sa modernong Filipino at nananatiling angkop sa maringal na pangitain.
- source_word: φωνῇ μεγάλῃ
  choice: sa malakas na tinig
  rationale: Likas at tuwirang salin ito ng paraang ginamit sa malakas at hayagang pagpapahayag.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Sa aba! Sa aba! Sa aba
  rationale: Pinananatili ang tatlong ulit na pahayag upang maipahayag ang tindi at propetikong diin ng Griyego.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: mga naninirahan sa lupa
  rationale: Natural na Filipino ito na nagpapanatili sa paulit-ulit na parirala sa Pahayag para sa mga naninirahan sa daigdig.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: dahil sa natitirang mga tunog ng trumpeta
  rationale: Ang ἐκ ay nauunawaang panhiwatig ng sanhi sa konteksto. Ang “mga tunog ng trumpeta” ay malapit sa literal na φωναί at malinaw sa Filipino.
- source_word: τῶν τριῶν ἀγγέλων
  choice: ng tatlong anghel
  rationale: Sa apokaliptikong konteksto, malinaw na mga makalangit na anghel ang tinutukoy.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: na malapit nang humihip
  rationale: Ipinapahayag ng μέλλω at pawatas ang nalalapit na pagkilos; ipinahihiwatig na ng konteksto na trumpeta ang hihipan.
theological_decisions:
- issue: Pagkakakilanlan ng lumilipad na tagapagpahayag
  choice: isang agila
  alternative: isang anghel
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na ἀετοῦ (“agila”). Inilalagay sa talababa ang “anghel,” na matatagpuan sa ilang tradisyong manuskrito, nang hindi ito ipinapalit sa ibinigay na tekstong Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bigat ng pangitain at ang tatlong ulit na “Sa aba,” habang iniwasan ang lipas o sobrang teknikal na pananalita. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinutukoy ng mga ito.
