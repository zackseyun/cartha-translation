id: REV.8.5
reference: Revelation 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: tl
  text: Kinuha ng anghel ang insensaryo, pinuno iyon ng apoy mula sa altar, at inihagis sa lupa. At nagkaroon ng mga dagundong ng kulog, mga tunog[a], mga kislap ng kidlat, at isang lindol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tinig.” Ang salitang Griyego ay maaaring tumukoy sa mga tinig o sa mga tunog/ingay sa isang pagpapakita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: kinuha
  rationale: Bagaman nasa perpektong anyo ang pandiwa, bahagi ito ng sunod-sunod na kilos sa salaysay; ang payak na nagdaang panahong “kinuha” ang natural sa modernong Tagalog.
- source_word: λιβανωτόν
  choice: insensaryo
  rationale: Tumutukoy ito sa sisidlang ginagamit sa pagsusunog ng insenso at pagdadala ng baga o apoy. Ang “insensaryo” ay maikli, tiyak, at angkop sa tagpong panritwal.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: pinuno iyon ng apoy mula sa altar
  rationale: Malinaw nitong ipinahahayag na ang insensaryo ay pinuno gamit ang apoy na kinuha sa altar, habang pinananatili ang mahalagang pinagmulan ng apoy.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: Karaniwan at madaling maunawaang katumbas sa makalangit na larawang pangtemplo sa Pahayag.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: inihagis sa lupa
  rationale: Pinananatili ng “inihagis” ang puwersa ng kilos. Sa konteksto ng paghuhukom sa Pahayag, ang “lupa” ay tumutukoy sa daigdig sa ibaba, hindi lamang sa lapag.
- source_word: ἐγένοντο
  choice: nagkaroon
  rationale: Natural sa Tagalog bilang pagpapahayag ng biglang paglitaw o pagsapit ng mga penomenong kasunod.
- source_word: βρονταὶ
  choice: mga dagundong ng kulog
  rationale: Ipinahihiwatig ng maramihang anyo ang sunod-sunod o paulit-ulit na malalakas na kulog.
- source_word: φωναὶ
  choice: mga tunog
  rationale: Maaaring mangahulugan ang salita ng mga tinig o mga tunog. Dahil walang tinukoy na nagsasalita, hindi ipinapalagay ng “mga tunog” na may sinasalitang mensahe; itinatala sa talababa ang leksikal na alternatibo.
- source_word: ἀστραπαὶ
  choice: mga kislap ng kidlat
  rationale: Natural na Tagalog na nagpapanatili sa maramihang anyo at sa biswal na larawan ng paulit-ulit na pagkidlat.
- source_word: σεισμός
  choice: isang lindol
  rationale: Tuwirang katumbas ng isahang pangngalan at natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng γῆ sa konteksto ng apokaliptikong paghuhukom
  choice: lupa
  alternative: daigdig; lupain
  rationale: Ang “lupa” ay natural na katapat ng makalangit na pinagmulan ng inihagis at maaari ring tumukoy nang malawak sa mundo. Hindi pinili ang “lupain,” na maaaring magpahiwatig ng mas lokal na saklaw.
- issue: Kahulugan ng φωναί sa pormulang teopanikong ito
  choice: mga tunog
  alternative: mga tinig
  rationale: Walang tinukoy na nagsasalita, kaya hindi tahasang ginagawang pananalita ang penomenong naririnig. Gayunman, tunay na posible sa Griyego ang “mga tinig,” kaya pinananatili iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mabilis at dramatikong pagkakasunod-sunod ng mga kilos at penomeno, habang iniwasang gawing tiyak na pananalita ang malabong φωναί.
