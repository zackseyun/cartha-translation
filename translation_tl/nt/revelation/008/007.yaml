id: REV.8.7
reference: Revelation 8:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: tl
  text: At hinipan ng una ang trumpeta. Nagkaroon ng graniso at apoy na may halong dugo, at inihagis ito sa lupa. Natupok ang sangkatlo ng lupa, natupok ang sangkatlo ng mga punongkahoy, at natupok ang lahat ng luntiang damo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: 'Pinananatili ang elipsis ng Griyego: nauunawaan mula sa konteksto na ang tinutukoy ay ang una sa pitong anghel, ngunit hindi idinaragdag dito ang salitang “anghel.”'
- source_word: ἐσάλπισεν
  choice: hinipan … ang trumpeta
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa pagpapatunog ng trumpeta; ipinahihiwatig ng pandiwang Griyego at ng konteksto ang instrumentong trumpeta.
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Ipinakikilala nito ang paglitaw o pagdating ng kasunod na kababalaghan nang hindi nagdaragdag ng tiyak na paraan ng pagdating nito.
- source_word: χάλαζα καὶ πῦρ
  choice: graniso at apoy
  rationale: Tuwirang pinananatili ang matingkad na pares ng mapaminsalang elemento.
- source_word: μεμιγμένα ἐν αἵματι
  choice: na may halong dugo
  rationale: Natural at malinaw na Tagalog para sa kalagayang magkahalo, habang pinananatili ang nakakagimbal na larawan ng pangitain.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: inihagis ito sa lupa
  rationale: Pinananatili ang balintiyak at ang isahang pandiwa, anupat itinuturing na isang kabuuang pangyayari ang graniso at apoy. Hindi tinutukoy kung sino ang naghagis, gaya rin sa Griyego.
- source_word: τὸ τρίτον τῆς γῆς
  choice: ang sangkatlo ng lupa
  rationale: Ang “sangkatlo” ay likas at eksaktong panumbas sa bahaging one-third. Ang “lupa” ay maaari pa ring tumukoy sa lupaing nasasakupan o sa daigdig, kaya napapanatili ang saklaw na hindi lubusang tiyak sa γῆ.
- source_word: κατεκάη
  choice: natupok
  rationale: Ipinahahayag ng “natupok” ang masidhing puwersa ng κατακαίω—hindi lamang nadapuan ng apoy kundi nasunog hanggang maubos.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: ang sangkatlo ng mga punongkahoy
  rationale: Malinaw at natural na anyo ng partitive expression, habang pinananatili ang inuulit na padron ng hatol.
- source_word: πᾶς χόρτος χλωρός
  choice: ang lahat ng luntiang damo
  rationale: Pinananatili ang kongkretong larawan ng sariwa at berdeng damo; ang “luntian” ay dignidad ngunit karaniwang nauunawaang modernong salita.
theological_decisions:
- issue: Saklaw ng γῆ sa larawang apokaliptiko
  choice: lupa
  alternative: lupain; daigdig
  rationale: 'Ang “lupa” sa Tagalog ay natural na nakapagpapanatili ng tunay na leksikal na kalabuan ng γῆ: maaari itong tumukoy sa lupain o, ayon sa mas malawak na konteksto, sa daigdig. Hindi artipisyal na nililimitahan o pinalalawak ng salin ang saklaw.'
- issue: Hindi pinangalanang gumagawa ng paghagis
  choice: inihagis ito
  alternative: may naghagis nito; ibinagsak ito
  rationale: Pinananatili ng balintiyak na anyo ang hindi pagbanggit ng Griyego sa gumagawa ng kilos, kaya hindi tahasang ipinapalagay kung Diyos, anghel, o ibang tagaganap ang naghagis.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang maikli at paulit-ulit na hulma ng pangungusap upang maihatid ang sunod-sunod na bigat ng pangitain. Ang “ang una” ay sadyang eliptikal ayon sa Griyego at umaasa sa agarang konteksto; ang “natupok” ay mas natural at masidhi kaysa sa paulit-ulit na “nasunog nang lubusan.”
