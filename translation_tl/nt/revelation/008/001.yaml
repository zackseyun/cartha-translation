  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: tl
  text: At nang buksan niya ang ikapitong tatak[a], nagkaroon ng katahimikan sa langit sa loob ng humigit-kumulang kalahating oras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang buksan niya ang ikapitong selyo.” Payak na sinasabi ng Griego na binuksan niya ang ikapitong tatak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at nagkaroon ng katahimikan sa langit sa loob ng humigit-kumulang kalahating oras.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: nang
  rationale: Bagaman maaaring mangahulugan ang ὅταν ng “tuwing,” tumutukoy ito rito sa isang tiyak at minsanang pangyayari sa salaysay; natural sa Tagalog ang “nang.”
- source_word: ἤνοιξεν
  choice: buksan
  rationale: Tuwirang katumbas ito ng ἀνοίγω at hindi nito idinaragdag ang mas mapagpasyang ideya ng “sirain” o “pigtasin.”
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: ang ikapitong tatak
  rationale: Ang “tatak” ay malinaw at karaniwang salin ng σφραγίς sa konteksto ng balumbong nakaselyo, habang tuwirang pinananatili ng “ikapito” ang ordinal na bilang.
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Ipinahahayag nito ang paglitaw o pagsisimula ng isang kalagayan at natural na umuugnay sa “katahimikan” sa modernong Tagalog.
- source_word: σιγὴ
  choice: katahimikan
  rationale: Pinananatili nito ang taimtim at dramatikong diwa ng lubos na pananahimik.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Ang tinutukoy ay ang makalangit na dako, hindi lamang ang pisikal na kalawakan.
- source_word: ὡς ἡμιώριον
  choice: nang mga kalahating oras
  rationale: Ang ὡς ay nagpapahiwatig ng pagtatantiya; ang “nang mga kalahating oras” ay likas na Filipino para sa tinatayang tagal.
theological_decisions:
- issue: Ang di-binanggit na simuno ng ἤνοιξεν
  choice: “niya,” na hindi tahasang pinapangalanan sa talata
  alternative: “ng Kordero,” na tahasang kinikilala ang simuno mula sa naunang konteksto
  rationale: Nasa ikatlong panauhang isahan ang pandiwang Griego ngunit hindi inuulit ang pangalan ng simuno. Pinananatili ng “niya” ang daloy at ang antas ng pagiging tahas ng orihinal, habang likas na tumutukoy sa Kordero mula sa naunang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tatak” sa pangunahing teksto dahil pamilyar ito sa biblikal na gamit, at inilagay ang “selyo” bilang leksikal na alternatibo. Hindi tahasang pinangalanan ang Kordero upang mapanatili ang anyo ng Griego.
