  source_fidelity: 'Tumpak ang salin sa pangunahing mga bahagi ng Griyego: ang pitong anghel, ang pitong trumpeta na taglay nila, ang paghahanda nila, at ang layuning hipan/patunugin ang mga trumpeta. Ang payak na “naghanda” ay likas na Tagalog na katumbas ng reflexive na ἡτοίμασαν αὑτούς sa kontekstong ito.'
