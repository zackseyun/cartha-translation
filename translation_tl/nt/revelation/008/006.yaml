id: REV.8.6
reference: Revelation 8:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: tl
  text: At ang pitong anghel na may pitong trumpeta ay naghanda upang hipan ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patunugin ang mga trumpeta.” Ang pandiwang Griyego ay nangangahulugang “magpatunog ng trumpeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Sa apokaliptikong tagpo ng Pahayag, tumutukoy ito sa mga makalangit na nilalang, hindi sa mga taong sugo.
- source_word: ἔχοντες
  choice: na may
  rationale: Natural at malinaw na inilalarawan ng sugnay na ito ang pagkakaroon nila ng mga trumpeta.
- source_word: σάλπιγγας
  choice: mga trumpeta
  rationale: Ito ang karaniwang makabagong katawagan na nagpapanatili sa apokaliptiko at panrelihiyong larawan ng salitang Griyego.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: naghanda
  rationale: Sa Tagalog, likas nang nagpapahiwatig ang 'naghanda' na inihanda ng mga gumagawa ang kanilang sarili; magiging mabigat ang tahasang 'inihanda ang kanilang sarili.'
- source_word: ἵνα σαλπίσωσιν
  choice: upang hipan ang mga iyon
  rationale: Ipinahahayag ng 'upang' ang layunin, at ang 'hipan' ay natural na salin ng pagpapatunog ng trumpeta; ang 'mga iyon' ay tumutukoy sa pitong trumpeta.
theological_decisions:
- issue: Likas na pagkakakilanlan ng ἄγγελοι sa apokaliptikong konteksto
  choice: mga makalangit na anghel
  alternative: mga taong sugo
  rationale: Malinaw na pinapaboran ng tagpo at ng pagkakatiwala sa kanila ng pitong trumpeta ang mga makalangit na anghel, nang hindi nagdaragdag ng ibang doktrinal na pahayag.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinili ang maikling 'naghanda' kaysa sa mabigat na tahasang panumbas ng reflexive construction, at pinanatili ang layunin sa pamamagitan ng 'upang.'
