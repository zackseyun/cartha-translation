  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: tl
  text: At hinipan ng ikatlong anghel ang trumpeta. At mula sa langit[a] ay nahulog ang isang malaking bituin[c] na nagliliyab na parang sulo[b], at nahulog ito sa ikatlong bahagi ng mga ilog at sa mga bukal ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kalangitan.” Maaaring tumukoy ang salitang Griyego sa langit o sa kalangitan; pinanatili rito ang “langit” dahil angkop ito sa pangitain at apokaliptikong tagpo.
    reason: lexical_alternative
  - marker: b
    text: O “parang lampara.” Maaaring tumukoy ang salitang Griyego sa sulo o lampara; mas angkop sa larawan ng nagliliyab at nahuhulog na bituin ang “sulo.”
    reason: lexical_alternative
  - marker: c
    text: Pinanatili bilang larawan ang “bituin.” Iba-iba ang pagkaunawa kung ito ay isang makalangit na nilalang, bagay na tulad ng bulalakaw, o makasagisag na kapangyarihan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang trumpeta
  rationale: Ang σαλπίζω ay nangangahulugang hipan o patunugin ang trumpeta. Ang pariralang ito ay natural sa modernong Filipino at malinaw na ipinahihiwatig ang instrumento.
- source_word: ἀστὴρ μέγας
  choice: isang malaking bituin
  rationale: Tuwirang isinasalin ang pangngalan at pang-uri. Sa Filipino, mas natural dito ang “malaking” kaysa “dakilang,” dahil inilalarawan muna ang kapansin-pansing anyo ng bituin nang hindi nagdaragdag ng interpretasyon.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Maaaring tumukoy ang οὐρανός sa langit o kalangitan. Pinananatili ang “langit” dahil angkop ito sa marangal at apokaliptikong tagpo, habang itinatala sa talababa ang leksikal na alternatibo.
- source_word: καιόμενος ὡς λαμπάς
  choice: nagliliyab na parang sulo
  rationale: Ipinahahayag ng καιόμενος ang patuloy na pagliyab, at ang λαμπάς ay karaniwang isang sulo. Malinaw at buhay ang paghahambing sa Filipino.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: nahulog ... at nahulog ito
  rationale: 'Pinananatili ang pag-uulit ng pandiwa sa Griyego upang maingatan ang ritmo at diin: una ang pagbagsak mula sa langit, pagkatapos ang pagbagsak sa mga tubig.'
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: sa ikatlong bahagi ng mga ilog
  rationale: Ang τὸ τρίτον sa magkakaugnay na paghuhukom sa Pahayag ay nangangahulugang isang katlo. Ang “ikatlong bahagi” ay malinaw, natural, at eksakto sa Filipino.
- source_word: πηγὰς τῶν ὑδάτων
  choice: mga bukal ng tubig
  rationale: Ang πηγή ay likas na isinasaling “bukal.” Iniiwasan ng natural na pariralang Filipino ang artipisyal na “mga bukal ng mga tubig” habang pinananatili ang kahulugan.
theological_decisions:
- issue: Ang tinutukoy ng nahuhulog na bituin
  choice: Isinalin nang tuwiran bilang “isang malaking bituin” nang hindi kinikilalang anghel, bagay na tulad ng bulalakaw, o makasagisag na kapangyarihan.
  alternative: Maaari itong unawain bilang isang makalangit na nilalang, bagay na tulad ng bulalakaw, o sagisag ng isang pinuno o kapangyarihan.
  rationale: Bituin ang mismong larawang ibinibigay ng talata at hindi nito tahasang tinutukoy ang kahulugang sinasagisag nito. Pinananatili ng salin ang sadyang kalabuan at hindi ipinapasok ang isang partikular na interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang dalawang ulit na “nahulog” upang sundan ang retorikal na galaw ng Griyego. Ginamit ang “trumpeta,” “sulo,” at “bukal” bilang karaniwan at malinaw na mga salita, nang walang denominasyonal o mapagpasyang simbolikong pagpapakahulugan.
