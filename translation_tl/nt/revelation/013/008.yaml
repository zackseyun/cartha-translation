  source_fidelity: Tumpak na naihahatid ng salin ang hinaharap na pagsamba, ang lahat ng naninirahan sa lupa, ang Aklat ng Buhay ng Kordero, at ang sinadyang di-pagpapasya sa malabong pagkakabit ng “mula nang itatag ang sanlibutan.” Gayunman, ang “hindi naisulat” ay mas malinaw na tumutugon sa perpektong pasibong γέγραπται (“has not been written”) kaysa “hindi nakasulat,” na maaaring unawain lamang bilang kasalukuyang kalagayan.
  naturalness: Marangal at natural ang pangunahing pangungusap sa modernong Tagalog. Ang em dash ay mabisa sa pagpapakilala ng nagpapaliwanag na “bawat taong.” Ang “mula nang itatag ang sanlibutan” ay natural at angkop sa saklaw na kosmiko ng parirala.
  terminology: Ang “sasambahin,” “naninirahan sa lupa,” “aklat ng buhay,” “Kordero,” at “pinaslang” ay angkop, magkakaugnay sa gamit ng Pahayag, at may wastong relihiyoso/apokaliptikong rehistro. Napananatili rin ang kapaki-pakinabang na pagkakaiba ng “lupa” para sa γῆ at “sanlibutan” para sa κόσμος.
