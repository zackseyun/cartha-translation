id: REV.13.8
reference: Revelation 13:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: tl
  text: At sasambahin siya ng lahat ng naninirahan sa lupa—bawat taong ang pangalan ay hindi naisulat sa aklat ng buhay ng Korderong pinaslang mula nang itatag ang sanlibutan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat taong ang pangalan ay hindi naisulat mula nang itatag ang sanlibutan sa aklat ng buhay ng Korderong pinaslang.” Maaaring iugnay sa Griyego ang “mula nang itatag ang sanlibutan” alinman sa “pinaslang” o sa “hindi naisulat.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: sasambahin
  rationale: Sa Pahayag, karaniwang tumutukoy ang προσκυνέω sa pagsambang may relihiyosong pagpapasakop; malinaw itong naipapahayag ng “sasambahin.”
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: mga naninirahan sa lupa
  rationale: Pinananatili nito ang anyong pandiwa at ang paulit-ulit na katawagan sa Pahayag, habang natural sa modernong Tagalog.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: bawat taong ang pangalan ay hindi nakasulat
  rationale: Ginagawang malinaw sa Tagalog ang isahang reperente ng panghalip at pinananatili ang resultang kalagayang ipinahihiwatig ng perpektong γέγραπται.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: aklat ng buhay
  rationale: Ito ang malinaw at nakaugaliang salin ng apokaliptikong larawan, nang hindi kinakailangang tukuyin kung kodise o balumbon ang anyo nito.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Pinananatili ang kristolohikal, mesiyaniko, at pansakripisyong larawan; ginamit ang malaking titik bilang titulo.
- source_word: τοῦ ἐσφαγμένου
  choice: pinaslang
  rationale: Ipinahahayag nito ang marahas at pansakripisyong diwa ng σφάζω nang may dignidad at likas na tunog sa Tagalog.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula nang itatag ang sanlibutan
  rationale: Natural na Tagalog ito para sa temporal na parirala at pinananatili ang larawan ng pagkakatatag o pundasyon ng daigdig.
theological_decisions:
- issue: Pagkakabit ng pariralang “mula nang itatag ang sanlibutan”
  choice: Ikinabit sa “Korderong pinaslang” sa pangunahing teksto.
  alternative: “bawat taong ang pangalan ay hindi nakasulat mula nang itatag ang sanlibutan sa aklat ng buhay ng Korderong pinaslang”
  rationale: Sa ayos ng mga salita sa Griyego, maaaring natural na iugnay ang parirala sa kalapit na participle na τοῦ ἐσφαγμένου. Gayunman, sinusuportahan ng Pahayag 17:8 ang pagkakabit nito sa pagkakasulat ng mga pangalan. Dahil tunay na malabo ang sintaks, pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang tumugma sa kosmikong saklaw ng κόσμος at “lupa” para sa γῆ, kaya napapanatili ang pagkakaiba ng dalawang salitang Griyego.
