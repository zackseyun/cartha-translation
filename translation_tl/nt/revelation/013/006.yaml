id: REV.13.6
reference: Revelation 13:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: tl
  text: Binuka nito ang bibig upang bumigkas ng mga paglapastangan laban sa Diyos[a], upang lapastanganin ang pangalan niya at ang tahanan niya,[b] ang mga nananahan sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain ang hulihan bilang ikatlong layon ng “lapastanganin”: “at ang mga nananahan sa langit,” sa halip na bilang paglilinaw sa “ang tahanan niya.”'
    reason: alternative_reading
  - marker: b
    text: Ang “tahanan” ay maaari ring isaling “tabernakulo” o “tolda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: ibinuka nito ang bibig nito
  rationale: Pinananatili ang matingkad na idyomang Griyego at ang tahasang aorist na kilos; ang “nito” ay tumutukoy sa halimaw.
- source_word: εἰς βλασφημίας
  choice: upang magsalita ng mga paglapastangan
  rationale: Natural ito sa modernong Tagalog habang pinananatili ang maramihang βλασφημίας, na nagpapahiwatig ng sari-sari o paulit-ulit na lapastangang pananalita.
- source_word: πρὸς τὸν θεόν
  choice: laban sa Diyos
  rationale: Sa konteksto ng mapanlaban na pananalita, malinaw na ipinahahayag ng “laban sa” ang puwersa ng πρός.
- source_word: βλασφημῆσαι
  choice: upang lapastanganin
  rationale: Ipinahahayag ang layunin o bunga ng pagbuka ng bibig nang hindi dinaragdagan ang kahulugan.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang pangalan niya
  rationale: Pinananatili ang “pangalan,” kasama ang biblikal na diwa ng pagkakakilanlan at karangalan ng Diyos.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: ang tahanan niya
  rationale: Ang σκηνή ay maaaring tumukoy sa tolda, tabernakulo, o tahanan. Ang “tahanan” ay malinaw at likas sa modernong Tagalog nang hindi sapilitang naglalagay ng kultikong kahulugan.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: ang mga nananahan sa langit
  rationale: Likas na salin ng kasalukuyang participle at pinananatili ang ugnayang semantiko nito sa σκηνή.
- source_word: αὐτοῦ
  choice: nito / niya
  rationale: Ginamit ang “nito” para sa halimaw at “niya” para sa Diyos upang maging malinaw ang magkaibang tinutukoy ng mga panghalip.
theological_decisions:
- issue: Ugnayan ng “ang tahanan niya” at “ang mga nananahan sa langit”
  choice: Inilagay ang huling parirala bilang tuwirang apposisyon o pagpapaliwanag sa “ang tahanan niya,” nang walang idinagdag na “samakatuwid” o “ibig sabihin.”
  alternative: Maaaring basahin ang “ang mga nananahan sa langit” bilang ikatlong tuwirang layon ng “lapastanganin,” kapantay ng “pangalan niya” at “tahanan niya.”
  rationale: Kapuwa posible sa Griyego ang appositional at coordinate na pagbasa. Pinananatili ng pangunahing teksto ang apposisyon at ang malapit na leksikal na ugnayan ng σκηνή at σκηνοῦντας, habang inilalahad sa talababa ang ibang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “paglapastangan/lapastanganin” para sa pare-parehong paglalapat ng βλασφημία/βλασφημέω. Ang kuwit bago ang huling parirala ay sadyang nagpapanatili sa appositional na anyo at sa bahagyang sintaktikong tensiyon ng Griyego.
