  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: tl
  text: upang walang sinuman ang makabili o makapagbili maliban sa taong may tatak, pangalan ng halimaw, o bilang ng pangalan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang ng pangalan niya.”
    reason: Pinananatili ang posibleng personal na pagtukoy ng αὐτοῦ, yamang ang halimaw ay inilalarawang may personal na pagkilos.
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: upang walang sinumang
  rationale: Ipinahahayag ng ἵνα ang layunin o kinalabasan, at ng μή τις δύνηται na walang sinumang may kakayahang gawin ang kasunod; sa Filipino, likas na naipahihiwatig ang kakayahan sa mga pandiwang “makabili” at “makapagbili.”
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: makabili o makapagbili
  rationale: Pinananatili nito ang magkatambal na karaniwang gawaing pangkalakalan at ang diin sa kakayahang bumili o magbenta.
- source_word: εἰ μὴ ὁ ἔχων
  choice: maliban sa may
  rationale: Ang εἰ μή ay nagsasaad ng tanging eksepsiyon, samantalang ang articular participle na ὁ ἔχων ay pangkalahatang tumutukoy sa taong nagtataglay; likas at inklusibo ang “sa may” sa Filipino.
- source_word: τὸ χάραγμα
  choice: ang tatak
  rationale: Ang χάραγμα ay markang iniukit, itinatak, o ipinangkilala; malinaw at natural sa kontekstong ito ang “tatak.”
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: ang pangalan ng halimaw
  rationale: Tuwirang pinananatili ang genitibong ugnayan at ang apokaliptikong katawagang θηρίον bilang “halimaw.”
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: o ang bilang ng pangalan nito
  rationale: Pinananatili ang pormal na pagkakaugnay ng “bilang” at “pangalan”; ang “nito” ay natural na tumutukoy sa halimaw nang hindi nagpapasiya kung dapat itong gawing personal na “niya.”
theological_decisions:
- issue: Ugnayan ng tatak, pangalan ng halimaw, at bilang ng pangalan
  choice: Gumamit ng gatlang bago ang “ang pangalan” upang ipakitang maaaring ipaliwanag ng mga kasunod na parirala ang tatak.
  alternative: Gumamit ng kuwit at ituring ang tatlo bilang magkakahanay na mga identifier.
  rationale: Walang conjunction sa pagitan ng χάραγμα at ὄνομα, kaya posibleng appositional ang “pangalan” sa “tatak,” ngunit hindi lubos na tiyak. Ang gatlang ay naghahayag ng malapit na paliwanag nang hindi nagdaragdag ng salitang wala sa Griyego.
- issue: Kasarian ng ὁ ἔχων
  choice: maliban sa may
  alternative: maliban sa taong may
  rationale: Bagaman panlalaking isahan ang anyong Griyego, generic ang gamit nito. Hindi minamarkahan ng Filipino ang kasarian sa ganitong konstruksyon, kaya hindi kailangang magpasok ng panlalaking panghalip.
- issue: Pagtukoy ng αὐτοῦ
  choice: pangalan nito
  alternative: pangalan niya
  rationale: Ang agarang antecedent na θηρίον ay neuter sa Griyego. Pinananatili ng “nito” ang hindi tiyak na antas ng personipikasyon, habang ang “niya” ay posible dahil kumikilos na parang persona ang halimaw sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang sinuman,” “makabili o makapagbili,” at “maliban sa may” bilang natural na pananalita; iniwasan ang di-kailangang panlalaking panghalip dahil walang katumbas na gramatikal na kasarian ang Filipino.
