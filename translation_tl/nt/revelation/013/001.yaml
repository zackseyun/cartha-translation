  to: At nakita ko ang isang mabangis na hayop na umaahon mula sa dagat. Mayroon itong sampung sungay at pitong ulo. Sa mga sungay nito ay may sampung korona[a], at sa mga ulo nito ay may mga pangalang mapanlapastangan.[b]
  rationale: Pinalitan ang “halimaw” ng “mabangis na hayop” upang mas tapat na maihatid ang θηρίον nang hindi nagdaragdag ng diwang “monster.” Ginawang “mga diyadema” ang alternatibo sa talababa upang maging wastong kapalit ng nakaangkla na “korona” at maiwasan ang di-kinakailangang pag-uulit ng bilang. Walang binago sa simbolikong larawan o sa saklaw ng “mapanlapastangan.”
