id: REV.13.1
reference: Revelation 13:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: tl
  text: At nakita ko ang isang mabangis na hayop na umaahon mula sa dagat. Mayroon itong sampung sungay at pitong ulo. Sa mga sungay nito ay may sampung korona[a], at sa mga ulo nito ay may mga pangalang mapanlapastangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “mga diyadema,” mga koronang sagisag ng paghahari.
    reason: lexical_alternative
  - marker: b
    text: O “mga pangalan ng paglapastangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang isinasalin ang payak na pandiwang pasalaysay nang hindi idinaragdag ang “sa isang pangitain,” na wala sa mismong parirala.
- source_word: ἐκ τῆς θαλάσσης
  choice: mula sa dagat
  rationale: Ipinapakita ng parirala na ang halimaw ay umaahon mula sa loob ng dagat; malinaw ito sa Filipino kapag kasama ng “umaahon.”
- source_word: θηρίον
  choice: halimaw
  rationale: Natural at karaniwang salitang Filipino para sa nakatatakot na nilalang sa apokaliptikong tagpo, nang hindi pa tinutukoy kung sino o ano ang sinasagisag nito.
- source_word: ἀναβαῖνον
  choice: umaahon
  rationale: Pinananatili ang nagaganap na kilos ng paglitaw paitaas mula sa dagat.
- source_word: ἔχον
  choice: Mayroon itong
  rationale: Ginawang hiwalay na pangungusap upang maging natural at malinaw sa modernong Filipino habang pinananatili ang paglalarawan sa halimaw.
- source_word: κέρατα δέκα
  choice: sampung sungay
  rationale: Literal na pinananatili ang simbolikong larawan nang walang idinagdag na pakahulugan.
- source_word: κεφαλὰς ἑπτά
  choice: pitong ulo
  rationale: Tuwirang salin na hindi ipinapaliwanag sa pangunahing teksto ang simbolismo.
- source_word: διαδήματα
  choice: korona
  rationale: Madaling maunawaan ng karaniwang mambabasa; inilalagay sa talababa ang mas tiyak na terminong tumutukoy sa koronang sagisag ng paghahari.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: Sa mga sungay nito
  rationale: Natural na lokatibong pahayag sa Filipino na nagpapakita kung saan nakalagay ang mga korona.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: sa mga ulo nito
  rationale: Pinananatili ang lokasyon at ang maramihang “mga ulo.”
- source_word: ὀνόματα βλασφημίας
  choice: mga pangalang mapanlapastangan
  rationale: Natural na attributibong salin ng genitive phrase; hindi tahasang idinaragdag ang “sa Diyos” upang hindi paliitin ang saklaw na hindi hayagang binanggit sa parirala.
theological_decisions:
- issue: Simbolikong larawang apokaliptiko
  choice: Pinanatiling literal ang halimaw, mga sungay, mga ulo, at mga korona.
  alternative: Tukuyin sa teksto ang halimaw bilang isang kaharian, imperyo, pinuno, o satanikong kapangyarihan.
  rationale: Hindi mismo tinutukoy ng talata ang kahulugan ng bawat sagisag, kaya hindi dapat ipasok ng salin ang isang partikular na sistemang interpretatibo.
- issue: Saklaw ng βλασφημίας
  choice: mapanlapastangan
  alternative: lumalapastangan sa Diyos
  rationale: Maaaring tumukoy ang salita sa pamumusong o matinding panlalait, ngunit hindi tahasang nakasaad sa pariralang ito ang layon. Pinananatili ng salin ang tunay na luwang ng pahayag.
- issue: Maharlikang diwa ng διαδήματα
  choice: korona sa pangunahing teksto, na may “diyadema” sa talababa
  alternative: koronang maharlika o diyadema sa pangunahing teksto
  rationale: Nananatiling madaling basahin ang pangunahing teksto habang iniingatan sa talababa ang mas tiyak na anyo ng koronang sumasagisag sa paghahari.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa maiikling pangungusap ang mahabang Griyegong ayos upang maging natural sa pagbasa, ngunit pinanatili ang pagkakasunod-sunod at lahat ng detalye ng pangitain.
