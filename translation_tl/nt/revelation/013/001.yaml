review_pass:
  verdict: revise
  source_fidelity: The draft preserves the emergence from the sea, the ten horns, seven heads, ten diadems/crowns on the horns, and blasphemous names on the heads. However, “halimaw” tends to specify a monster-like creature in modern Filipino, whereas θηρίον is more directly and consistently rendered “mabangis na hayop” (or “hayop”) in Revelation’s symbolic imagery.
  naturalness: The short sentences are natural modern Filipino and retain the Greek descriptive sequence adequately. “Mayroon itong” is clear and idiomatic. “Mabangis na hayop” is also natural in this apocalyptic context and avoids the added monster nuance of “halimaw.”
  terminology: Use “mabangis na hayop” for θηρίον to preserve the established lexical image without interpretive embellishment. Retain “korona” in the text and “diyadema” as the lexical alternative. The footnote should say “mga diyadema,” not repeat the numeral already supplied by the main text.
  issues:
  - severity: medium
    issue: “Halimaw” is overly specific for θηρίον.
    rationale: Although usable in a frightening visionary context, “halimaw” commonly denotes a monster and can add a mythical or grotesque sense not lexically required by θηρίον. “Mabangis na hayop” more directly represents “beast/wild animal” and better supports consistent terminology in Revelation.
  - severity: low
    issue: Footnote a redundantly includes “sampung.”
    rationale: Because the footnote is anchored to “korona,” the lexical alternative should replace that noun phrase with “mga diyadema”; the numeral “sampung” is already present in the main text.
  revised_text: At nakita ko ang isang mabangis na hayop na umaahon mula sa dagat. Mayroon itong sampung sungay at pitong ulo. Sa mga sungay nito ay may sampung korona[a], at sa mga ulo nito ay may mga pangalang mapanlapastangan.[b]
