id: REV.13.14
reference: Revelation 13:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: tl
  text: At dinadaya nito[a] ang mga naninirahan sa lupa sa pamamagitan ng mga tanda na ipinagkaloob ditong gawin sa harapan ng halimaw, habang sinasabi nito sa mga naninirahan sa lupa na gumawa ng isang larawan para sa halimaw[b] na may sugat ng tabak at nabuhay.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inililigaw nito ang mga naninirahan sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: O “larawan ng halimaw”; mas literal sa Griyego ang “larawan para sa halimaw.”
    reason: lexical_alternative
  - marker: c
    text: O “na may sugat ng tabak at muling nabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: dinadaya
  rationale: Malinaw at natural na salin ng kasalukuyang pandiwang nagsasaad ng panlilinlang; maaari rin itong mangahulugang inililigaw.
- source_word: τοὺς κατοικοῦντας / τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: ang mga naninirahan sa lupa
  rationale: Pinananatili ang paulit-ulit at tematikong katawagan sa Apocalipsis habang natural sa modernong Filipino.
- source_word: διὰ τὰ σημεῖα
  choice: sa pamamagitan ng mga tanda
  rationale: 'Pinananatili ang instrumental na diwa ng διά: ang mga tanda ang paraang ginagamit sa panlilinlang.'
- source_word: σημεῖα
  choice: mga tanda
  rationale: Hindi dinaragdagan ng salitang 'mahiwaga' o 'milagroso,' na wala mismo sa pangngalan.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: ipinagkaloob sa nitong gawin
  rationale: Pinananatili ang balintiyak na anyo at hindi tahasang pinapangalanan kung sino ang nagkaloob.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: sa harapan ng halimaw
  rationale: Natural na Filipino na nagpapanatili sa diwang spatial at relational ng parirala.
- source_word: λέγων
  choice: Sinasabi nito
  rationale: Likas na naghahatid sa nilalaman ng sinasabi nang hindi pinalalakas bilang tahasang pag-uutos.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: gumawa sila ng isang larawan para sa halimaw
  rationale: Iginagalang ang datibong τῷ θηρίῳ bilang 'para sa halimaw'; hindi ipinapalagay na genitibong 'larawan ng halimaw.'
- source_word: εἰκόνα
  choice: larawan
  rationale: Mas malawak kaysa 'estatwa' at maaaring tumukoy sa isang representasyong panrelihiyon.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: na nasugatan ng tabak
  rationale: Natural na Filipino para sa paglalarawan sa halimaw na may sugat na dulot ng tabak, nang hindi pinapalabo ang sanhi ng sugat.
- source_word: μάχαιρα
  choice: tabak
  rationale: Karaniwang salin sa kontekstong biblikal at sapat ang lawak nang hindi labis na tinutukoy ang uri ng sandata.
- source_word: καὶ ἔζησεν
  choice: ngunit nabuhay
  rationale: Ipinahahayag ang kontekstuwal na pagsalungat sa sugat habang iniiwasang gawing tahasang pormula ng muling pagkabuhay.
theological_decisions:
- issue: Ipinahihiwatig na tagapagkaloob sa balintiyak na ἐδόθη
  choice: Panatilihin ang balintiyak na 'ipinagkaloob sa nito' nang hindi pinapangalanan ang Diyos.
  alternative: Pinahintulutan ito ng Diyos na gawin
  rationale: Karaniwan sa apokaliptikong panitikan ang ganitong balintiyak, ngunit lalampas sa tahasang sinasabi ng teksto ang pagbanggit sa Diyos bilang tagapagkaloob.
- issue: Diwa ng ἔζησεν matapos ang sugat
  choice: Isalin bilang 'ngunit nabuhay.'
  alternative: muling nabuhay / nabuhay na muli
  rationale: Ipinakikita nito ang buhay sa kabila ng sugat ngunit hindi ipinipilit na ang parirala ay teknikal na pahayag tungkol sa pagkabuhay na muli.
- issue: Ugnayan ng larawan sa halimaw
  choice: larawan para sa halimaw
  alternative: larawan ng halimaw
  rationale: Datibo ang anyo sa Griyego at maaaring magpahiwatig ng pag-aalay o pagtatalaga para sa halimaw; ang anyo o paksa ng larawan ay hindi dapat tahasang ipasiya ng salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'halimaw' para sa θηρίον at 'larawan' para sa εἰκών. Hinati sa dalawang pangungusap para sa linaw. Kailangang lumitaw ang lahat ng panandang talababa sa pangunahing teksto; ang [a] ay dapat ilagay pagkaraan ng 'dinadaya nito'.
