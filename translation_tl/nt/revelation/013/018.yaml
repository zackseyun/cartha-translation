  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: tl
  text: 'Narito ang karunungan: kalkulahin ng may pang-unawa ang bilang ng halimaw, sapagkat iyon ay bilang ng isang tao[a], at ang bilang nito ay anim na raan at animnapu''t anim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bilang ng tao”; maaari ring “bilang na pantao.”
    reason: alternative_reading
  - marker: b
    text: Sa ilang manuskrito, 616 sa halip na 666.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Narito ang karunungan
  rationale: Likas at marangal na pananalitang Filipino na pinananatili ang demonstratibong diin ng ὧδε at ang tuwirang pagpapakilala sa karunungan.
- source_word: ὁ ἔχων νοῦν
  choice: ang may pang-unawa
  rationale: Pinananatili ang substantibong anyo at ipinahahayag ang νοῦς bilang kakayahang umunawa o kumilatis, hindi lamang bilang isip.
- source_word: ψηφισάτω
  choice: ay kalkulahin
  rationale: Ang aorist imperative ay nag-uutos na tuusin o kalkulahin ang bilang; ang 'kalkulahin' ay malinaw at pangkaraniwan sa modernong Filipino.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: ang bilang ng halimaw
  rationale: Tuwirang salin na angkop sa apokaliptikong gamit ng θηρίον sa Pahayag.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: sapagkat iyon ay bilang ng isang tao
  rationale: Pinananatili ang singular na ἀνθρώπου at ang posibleng pagtukoy sa isang tao, habang inilalahad sa talababa ang maaari ring pangkalahatang kahulugang 'bilang ng tao' o 'bilang na pantao.'
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: at ang bilang nito
  rationale: Ang 'nito' ay malinaw na tumutukoy sa halimaw at tumutugma sa neuter na antecedent ng αὐτοῦ sa Griyego.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: animnaraan at animnapu't anim
  rationale: Tuwirang pagsasalin ng bilang 666 sa likas na anyong Filipino.
theological_decisions:
- issue: Kahulugan ng ἀνθρώπου sa ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: bilang ng isang tao
  alternative: bilang ng tao; bilang na pantao
  rationale: Maaaring tumukoy ang anarthrous genitive singular sa isang partikular na tao, sa tao bilang uri, o sa isang bilang na pantao. Hindi nilulutas ng teksto ang lahat ng posibilidad, kaya pinanatili sa pangunahing teksto ang singular at inilagay sa talababa ang iba pang makatuwirang pagbasa.
- issue: Tekstuwal na anyo ng bilang
  choice: '666'
  alternative: '616'
  rationale: Sinusuportahan ng pangunahing teksto ng SBLGNT at ng mas malawak na patotoong manuskrito ang 666; ang mahalagang variant na 616 ay itinatala sa talababa nang hindi pinapalitan ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang 'halimaw' bilang likas na katumbas ng θηρίον sa kontekstong apokaliptiko at ang 'kalkulahin' upang ipakita ang aktibong pagtutuos na hinihingi ng ψηφισάτω.
