  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing kahulugan: karunungan, ang taong may pang-unawa, ang pagtuos sa bilang ng halimaw, ang malabong pariralang tumutukoy sa tao, at ang 666. Gayunman, ang dating ayos na “ang may pang-unawa ay kalkulahin” ay hindi wastong paraan upang ipahayag ang pautos na ψηφισάτω sa modernong Filipino.'
  naturalness: 'Kailangan ang maliit ngunit mahalagang pag-aayos ng ayos ng salita upang maging likas at malinaw ang utos: “kalkulahin ng may pang-unawa ang bilang.” Ang “anim na raan” ay mas karaniwan at madaling basahin kaysa sa dikit na “animnaraan.”'
