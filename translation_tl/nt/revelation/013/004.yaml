id: REV.13.4
reference: Revelation 13:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: tl
  text: At sinamba nila ang dragon dahil ibinigay nito sa halimaw ang awtoridad. Sinamba rin nila ang halimaw at sinabi, “Sino ang tulad ng halimaw[a][c], at sino ang kayang makipagdigma laban dito[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sino ang maihahambing sa halimaw?”
    reason: lexical_alternative
  - marker: b
    text: O, “sino ang kayang lumaban dito?”
    reason: lexical_alternative
  - marker: c
    text: Malamang na inuulit ng papuring ito ang pananalita sa Lumang Tipan tungkol sa kawalang-katulad ng Diyos (halimbawa, Exodo 15:11; Awit 35:10), ngunit dito ay mapamusong itong iniuukol sa halimaw.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: sinamba
  rationale: Sa Pahayag, karaniwang tumutukoy ang προσκυνέω sa pagsambang panrelihiyon, hindi lamang sa pisikal na pagyukod; malinaw na naipahahayag ng “sinamba” ang idolatrosong diwa rito.
- source_word: δράκοντι
  choice: dragon
  rationale: Tuwirang salin ito ng δράκων at likas na katawagan sa makabagong Filipino para sa simbolikong nilalang sa apokaliptikong tagpo.
- source_word: ὅτι
  choice: dahil
  rationale: 'Ipinakikita rito ng ὅτι ang dahilan ng pagsamba sa dragon: ibinigay nito ang awtoridad sa halimaw.'
- source_word: ἔδωκεν
  choice: ibinigay
  rationale: Ang aspektong perpektibo ng “ibinigay” ay natural na nagsasaad ng natapos na pagbibigay; nauunawaan sa pagkakasunod ng pangyayari na nauna ito sa pagsamba.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Pinananatili ng “awtoridad” ang diwa ng ipinagkaloob na karapatang mamahala o gumamit ng kapangyarihan, sa halip na pangkalahatang lakas lamang.
- source_word: θηρίῳ
  choice: halimaw
  rationale: Ang “halimaw” ay natural at matatag na salin ng θηρίον sa apokaliptikong larawan, nang hindi ipinapaliwanag ang simbolo sa mismong teksto.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Natural sa Filipino ang koordinasyong ito upang ipakilala ang mismong sinabi ng mga sumamba, habang pinananatili ang kaugnayan ng pananalita sa kanilang pagsamba.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Sino ang tulad ng halimaw
  rationale: Tuwiran at natural itong tanong na nagpapanatili sa retorikal na hamon at sa posibleng alusyon sa wikang ginagamit tungkol sa kawalang-katulad ng Diyos.
- source_word: δύναται
  choice: kayang
  rationale: Ang “kayang” ay malinaw at kasalukuyang paraan ng pagpapahayag ng kakayahan sa Filipino nang hindi nagiging mabigat ang pangungusap.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: makipagdigma laban dito
  rationale: Ipinahahayag ng “makipagdigma” ang masaklaw na diwang militar ng πολεμέω, at nililinaw ng “laban dito” ang mapanlabang gamit ng μετά kasama ng genitive sa kontekstong ito.
theological_decisions:
- issue: Pagtukoy sa halimaw sa hulíng sugnay nang hindi ito tahasang ginagawang persona
  choice: Gamitin ang “dito,” na tumutukoy pabalik sa halimaw nang hindi nagpapasya kung “siya” o “ito” ang dapat gamitin
  alternative: Gamitin ang “sa kaniya” upang idiin ang mala-personang pagkakalarawan sa halimaw
  rationale: Neuter ang θηρίον at ang kaugnay na αὐτοῦ sa Griyego. Ang “dito” ay natural sa Filipino pagkatapos ng “laban” at umiiwas sa pagdaragdag ng pasyang interpretatibo tungkol sa pagiging persona ng halimaw.
- issue: Alusyon sa pananalita tungkol sa kawalang-katulad ng Diyos
  choice: Panatilihin ang “Sino ang tulad ng halimaw” at ipaliwanag ang posibleng alusyon sa talababa
  alternative: Palawakin ang pangunahing teksto upang tahasang tukuyin itong mapamusong na paggaya sa papuri sa Diyos
  rationale: Pinananatili ng tuwirang pananalita ang tensiyon at alusyon ng orihinal nang hindi ipinapasok sa talata ang isang paliwanag na hindi tahasang sinabi roon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang karaniwang “dragon,” “halimaw,” at “awtoridad” upang manatiling tuwiran ang apokaliptikong larawan at ang diwa ng ipinagkaloob na pamamahala. Ginamit ang “nito” para sa dragon at “dito” para sa halimaw upang maging natural sa Filipino at hindi sapilitang gawing pantao ang mga simbolikong nilalang.
