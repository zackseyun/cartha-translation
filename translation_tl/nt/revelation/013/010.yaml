id: REV.13.10
reference: Revelation 13:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: tl
  text: Kung ang sinuman ay nakalaan sa pagkabihag, sa pagkabihag siya pupunta[a]; kung ang sinuman ay nakatakdang patayin sa pamamagitan ng tabak, sa pamamagitan ng tabak siya dapat patayin[b]. Narito ang pagtitiis at pananampalataya[c] ng mga banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung ang sinuman ay pupunta sa pagkabihag, sa pagkabihag siya pupunta.” Maaari ring unawain ang linyang ito bilang pahayag tungkol sa itinakdang sasapitin, hindi bilang utos.
    reason: alternative_reading
  - marker: b
    text: 'Naiiba ang ilang manuskrito o pagbasa sa sugnay na ito, kabilang ang: “Kung ang sinuman ay pumapatay sa pamamagitan ng tabak, dapat din siyang patayin sa pamamagitan ng tabak.” Pinanatili rito ang piniling teksto, ngunit mahalaga sa pagpapakahulugan ang ibang pagbasa.'
    reason: textual_variant
  - marker: c
    text: O, “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: kung ang sinuman
  rationale: Pinananatili ang bukás at pangkalahatang diwa ng kondisyong Griyego sa natural na modernong Tagalog.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: nakalaan sa pagkabihag, sa pagkabihag siya pupunta
  rationale: Pinananatili ang mariing pag-uulit ng εἰς αἰχμαλωσίαν at ang tahasang galaw ng ὑπάγει, habang ipinahihiwatig ang maikli at kawikaang pahayag tungkol sa itinakdang sasapitin.
- source_word: αἰχμαλωσία
  choice: pagkabihag
  rationale: Tumutukoy sa kalagayan ng pagiging bihag at pinananatili ang himig ng paghatol; mas tiyak ito rito kaysa 'pagkabilanggo' o 'pagkatapon.'
- source_word: ἐν μαχαίρῃ
  choice: sa pamamagitan ng tabak
  rationale: Malinaw na ipinapahayag ang gamit o instrumentong tinutukoy ng pariralang Griyego at pinananatili ang biblikal na larawang 'tabak.'
- source_word: ἀποκτανθῆναι
  choice: patayin
  rationale: Direkta at makabagong salin ng pasibong pawatas, nang hindi gumagamit ng mas makalumang 'paslangin.'
- source_word: αὐτὸν
  choice: siya dapat patayin
  rationale: Ginagawang natural sa Tagalog ang alanganing kayariang Griyego habang pinananatili ang pasibong diwa at ang pahiwatig ng di-maiiwasang sasapitin.
- source_word: ὧδέ ἐστιν
  choice: Dito makikita
  rationale: Natural na Tagalog na pantawag-pansin sa katangiang nahahayag sa sitwasyong kababanggit lamang.
- source_word: ὑπομονή
  choice: pagtitiis
  rationale: Karaniwan at malinaw na salita para sa matatag na pagpapatuloy sa gitna ng pagdurusa.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinananatili sa pangunahing teksto ang karaniwang kahulugang 'pananampalataya'; inilalagay sa talababa ang posibleng diwang 'katapatan.'
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Maikli at tradisyonal na katawagan sa banal na bayan ng Diyos, at nauunawaan sa modernong kontekstong biblikal.
theological_decisions:
- issue: 'Ang diwa ng unang dalawang sugnay: paglalarawan ng itinakdang sasapitin o utos'
  choice: Paglalarawan ng itinakda o di-maiiwasang sasapitin
  alternative: Maaaring unawain bilang utos na huwag labanan ang karahasan, o—ayon sa mahalagang ibang pagbasa ng teksto—bilang pagganti sa nangbibihag at pumapatay.
  rationale: Sa piniling tekstong Griyego, ang mga sugnay ay pinakanatural na mabasa bilang taimtim at kawikaang pahayag tungkol sa sasapitin. Hindi ipinapasok sa salin ang isang ganap na doktrina ng di-paglaban o pagganti na hindi tahasang sinasabi ng piniling teksto.
- issue: Kahulugan ng πίστις sa pangwakas na sugnay
  choice: pananampalataya
  alternative: katapatan
  rationale: Ang 'pananampalataya' ang pangunahing leksikal na salin, ngunit sa konteksto ng pagtitiis sa ilalim ng pang-aapi ay tunay na posible rin ang 'katapatan'; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pag-uulit at taimtim na himig ng Griyego, ngunit inayos ang sintaks upang maging natural. Ang 'tabak,' 'pananampalataya,' at 'mga banal' ay pinanatili bilang malinaw at nakikilalang bokabularyong biblikal.
