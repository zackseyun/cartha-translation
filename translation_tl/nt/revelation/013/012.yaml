id: REV.13.12
reference: Revelation 13:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: tl
  text: Isinasagawa nito ang buong awtoridad ng unang halimaw sa harap ng unang halimaw.[a] At ginagawa nitong sambahin ng lupa at ng mga naninirahan dito ang unang halimaw, na ang nakamamatay nitong sugat ay gumaling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa presensya ng unang halimaw.” Maaaring idiin ng parirala na kumikilos ang ikalawang halimaw sa harapan o sa ilalim ng tingin ng unang halimaw.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na ang sugat ng kamatayan nito ay gumaling.” Ibig sabihin, gumaling ang nakamamatay nitong sugat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν ... πᾶσαν
  choice: buong kapangyarihan
  rationale: Ang ἐξουσία ay tumutukoy sa kapangyarihan o awtoridad na isinasagawa. Mas karaniwan at natural sa Filipino ang “kapangyarihan” sa kontekstong ito, habang pinananatili ng “buong” ang lawak ng πᾶσαν.
- source_word: ποιεῖ (unang paglitaw)
  choice: ginagamit
  rationale: Sa pariralang ποιεῖ τὴν ἐξουσίαν, ang diwa ay pagsasagawa o paggamit ng kapangyarihan, hindi simpleng “ginagawa.”
- source_word: ἐνώπιον αὐτοῦ
  choice: sa harap nito
  rationale: 'Pinananatili nito ang posibleng lokatibo at relasyonal na diwa: kumikilos ang ikalawang halimaw sa mismong harapan o presensya ng una.'
- source_word: ποιεῖ ... ἵνα προσκυνήσουσιν
  choice: ginagawa nitong sumamba
  rationale: Ipinahahayag nito ang sanhi o resultang dala ng kilos ng halimaw nang hindi ipinapalagay na tahasang sapilitan ang pagsamba.
- source_word: τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: ang lupa at ang mga naninirahan dito
  rationale: Pinananatili ang kapansin-pansing pagbanggit sa mismong lupa at ang paulit-ulit na apokaliptikong paglalarawan sa mga naninirahan dito.
- source_word: θηρίον
  choice: halimaw
  rationale: Ang “halimaw” ay natural at matatag na salin sa Filipino para sa θηρίον sa apokaliptikong konteksto.
- source_word: ἐθεραπεύθη
  choice: gumaling
  rationale: Natural na Filipino ito para sa pasibong diwa ng paggaling ng sugat; ang sugat ang gramatikal na paksa sa sugnay.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: ang sugat na ikamamatay nito
  rationale: Ipinahahayag ng parirala ang sugat na nakamamatay o humahantong sa kamatayan, habang iniiwasan ang di-natural na literal na “sugat ng kamatayan.”
theological_decisions:
- issue: Lakas ng pagkilos ng ikalawang halimaw sa mga naninirahan sa lupa
  choice: ginagawa nitong sumamba
  alternative: pinipilit nitong sumamba / pinasasamba nito
  rationale: May causative na puwersa ang ποιεῖ ... ἵνα, ngunit hindi tahasang tinutukoy sa sugnay ang antas o paraan ng pamimilit. Pinananatili ng salin ang sanhi nang hindi dinaragdagan ang teksto.
- issue: Ugnayan ng ikalawang halimaw sa unang halimaw
  choice: sa harap nito
  alternative: sa presensya nito / sa ilalim ng pagmamasid nito
  rationale: Maaaring idiin ng ἐνώπιον ang lokasyon o ang pagkilos sa presensya ng unang halimaw. Hindi idinaragdag ng salin ang mas tiyak na ideya ng pahintulot o pagpapasakop na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “halimaw” at “mga naninirahan dito” upang mapanatili ang apokaliptikong himig at mga tematikong pag-uulit sa Pahayag. Pinanatili rin ang personipikasyon ng “lupa” bilang sumasamba sa halip na paliitin ito sa mga tao lamang.
