  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: tl
  text: At ipinagkaloob sa kanya na makipagdigma laban sa mga banal[a] at daigin sila[b]. At ipinagkaloob sa kanya ang kapamahalaan sa bawat lipi, bayan, wika[c], at bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makipagdigma sa mga banal”; dito, ang diwa ay pakikipaglaban sa kanila, kaya “laban sa mga banal.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “talunin sila” o “magtagumpay laban sa kanila.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “dila”; ginagamit dito sa kahulugang “wika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: ipinagkaloob sa kanya
  rationale: Pinananatili ang balintiyak na anyo at hindi tinutukoy kung sino ang nagkaloob, gaya ng pagpipigil ng tekstong Griyego. Ang “ipinagkaloob” ay likas at marangal sa modernong Filipino at angkop sa dalawang paglitaw ng parirala.
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: makipagdigma laban sa mga banal
  rationale: Ang “makipagdigma” ay natural na katumbas ng idyomang ‘gumawa/magsagawa ng digmaan.’ Bagaman karaniwang nangangahulugang ‘kasama’ ang μετά na may genitive, sa pariralang ito ay tumutukoy ito sa pakikipaglabang may pagkapoot, kaya “laban sa.”
- source_word: τῶν ἁγίων
  choice: mga banal
  rationale: Maikli at nakaugat sa bokabularyong biblikal ang “mga banal” para sa mga taong ibinukod para sa Diyos, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: νικῆσαι
  choice: daigin sila
  rationale: Napananatili ng “daigin” ang malawak na diwa ng pagwawagi o pananaig at ang tematikong gamit ng νικάω sa Pahayag; hindi ito nililimitahan sa simpleng militar na pagkatalo.
- source_word: ἐξουσία
  choice: kapamahalaan
  rationale: Ipinahihiwatig nito ang ipinagkaloob na karapatang mamahala o saklaw ng pamumuno, hindi lamang ang lakas o kakayahan.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: sa bawat lipi, bayan, wika, at bansa
  rationale: Pinananatili ang apat na magkakaugnay na pangkat at ang panlahat na saklaw ng πᾶσαν. Ang “wika” ang malinaw at kasalukuyang Filipino para sa γλῶσσα sa kontekstong ito.
theological_decisions:
- issue: Hindi pinangalanang tagapagkaloob sa dalawang balintiyak na ἐδόθη
  choice: 'Panatilihin ang balintiyak: “ipinagkaloob sa kanya,” nang hindi pinapangalanan ang tagapagkaloob.'
  alternative: “Pinahintulutan siyang,” na tahasang nagpapahiwatig na pahintulot ng Diyos ang tinutukoy.
  rationale: Hindi tuwirang tinutukoy ng Griyego kung sino ang nagkaloob. Ang balintiyak ay nagpapanatili sa tensiyon sa pagitan ng soberanya ng Diyos at ng pansamantalang kapamahalaang ibinigay sa halimaw, sa halip na lutasin ito sa salin.
- issue: Saklaw ng tagumpay ng halimaw laban sa mga banal
  choice: “daigin sila,” nang walang dagdag na paliwanag kung ito ay pisikal, politikal, o espirituwal na tagumpay.
  alternative: “patayin sila” o “lubusang talunin sila.”
  rationale: Mas malawak ang νικάω kaysa pagpatay at sadyang mahalagang motibo ito sa Pahayag. Hindi dapat paliitin ng salin ang uri o sukdulan ng pananaig.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “makipagdigma,” “mga banal,” at “kapamahalaan” bilang pamilyar na bokabularyong biblikal nang hindi nagiging lipas o labis na teknikal. Ang pag-uulit ng “ipinagkaloob sa kanya” ay sinadyang panatilihin upang matularan ang diin at estruktura ng Griyego.
