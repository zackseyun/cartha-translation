source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: tl
  text: At pinangyayari nitong lagyan ng tanda[a] ang lahat—ang mga hamak at mga dakila, ang mayayaman at mahihirap, ang mga malaya at mga alipin—sa kanilang kanang kamay o sa kanilang noo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang bigyan nila sila ng tanda.” Alanganin ang anyong Griyego at hindi nito tahasang tinutukoy kung sino ang nagbibigay; ipinahahayag ng pangunahing teksto ang diwa sa natural na Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: pinapangyari
  rationale: Sa konstruksiyong ποιεῖ + ἵνα, ipinahihiwatig ng pandiwa na ang halimaw ang nagsasanhi o nagpapangyari sa pangyayari. Ang “pinapangyari” ay natural at hindi awtomatikong nagdaragdag ng diwang tahasang pamimilit.
- source_word: πάντας
  choice: ang lahat
  rationale: Saklaw nito ang lahat ng taong tinutukoy, gaya ng nililinaw ng sumusunod na magkakatambal na pangkat.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: ang mga hamak at ang mga dakila
  rationale: Ang tambalang ito ay tumutukoy sa mababa at mataas na katayuan. Pinananatili ng salin ang retorikal na pagtutunggali nang malinaw sa modernong Tagalog.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: ang mayayaman at ang mahihirap
  rationale: Karaniwan at malinaw na salin ng pagtutunggali sa kalagayang pangkabuhayan.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: ang mga malaya at ang mga alipin
  rationale: Dahil tuwirang itinatambal ang δοῦλοι sa mga malaya, malinaw na legal at panlipunang pagkaalipin ang tinutukoy, hindi lamang paglilingkod.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: ay lagyan ng tanda
  rationale: Ang tekstong Griyego ay literal na may diwang “upang magbigay sila sa kanila ng tanda,” ngunit hindi malinaw ang simuno ng “magbigay.” Ang pasibong Tagalog na “lagyan” ay natural, nagpapanatili sa pangyayari, at hindi nagpapakilala ng tiyak na tagaganap na hindi tahasang pinangalanan.
- source_word: χάραγμα
  choice: tanda
  rationale: Ang “tanda” ay natural at malawak na katumbas ng isang tatak, ukit, o palatandaang nagpapakilala, at angkop sa gamit ng χάραγμα sa Pahayag.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: sa kanilang kanang kamay
  rationale: Malinaw at idiomatikong distributibong salin ng pariralang Griyego.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: o sa kanilang noo
  rationale: Pinananatili ang alternatibong lokasyon at ang distributibong isahan ng Griyego sa natural na Tagalog.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος sa magkatambal na katayuang panlipunan
  choice: mga alipin
  alternative: mga lingkod
  rationale: Itinatampok ng tahasang kaibahan sa “mga malaya” ang kalagayan ng pagkaalipin. Ang “mga lingkod” ay maaaring magpalabo sa legal at panlipunang kontrast.
- issue: Pagpapahayag sa mahirap na sugnay na ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: ay lagyan ng tanda
  alternative: upang bigyan nila sila ng tanda
  rationale: Pinananatili ng pangunahing teksto ang diwa sa natural na Tagalog nang hindi nilulutas kung sino ang di-tiyak na simuno ng δῶσιν. Inilalagay sa talababa ang mas literal ngunit alanganing anyo upang mapanatili ang tunay na tekstuwal at sintaktikong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sunod-sunod na magkakatambal na pangkat at ang apokaliptikong ritmo ng talata. Ginamit ang “hamak” at “dakila” para sa panlipunang saklaw, at “alipin” dahil mahalaga rito ang kaibahan sa “malaya.”
