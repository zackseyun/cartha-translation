  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: tl
  text: Gumagawa ito ng mga dakilang tanda[a], anupat nagpapababa pa nga ito ng apoy mula sa langit tungo sa lupa sa harap ng mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dakilang himala” o “mga dakilang kababalaghan”; sa Griyego, “mga tanda.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa paningin ng mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: Gumagawa
  rationale: Sa pariralang ποιεῖ σημεῖα, likas sa Filipino ang “gumagawa ng mga tanda.” Hindi nito ipinapalagay kung ano ang mekanismo ng mga tandang iyon.
- source_word: σημεῖα μεγάλα
  choice: mga dakilang tanda
  rationale: Pinananatili ng “tanda” ang diwang apokaliptiko ng σημεῖα bilang mga gawang may ipinahihiwatig, sa halip na agad tukuyin ang mga ito bilang tunay na himala. Ang “dakila” ay angkop sa mataas ngunit malinaw na rehistro ng Pahayag.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: at nagpapababa pa nga ng apoy
  rationale: Ang “pa nga” ay naghahayag na ang pagpapababa ng apoy ang kapansin-pansing sukdulan ng paggawa nito ng mga tanda. Ang pagkakaugnay sa “at” ay hindi labis na nagpapasiya kung layunin o resulta ang diin ng ἵνα sa kontekstong ito.
- source_word: πῦρ
  choice: apoy
  rationale: Tuwirang katumbas ito ng πῦρ at pinananatili ang posibleng alusyon sa mga pagpapakita ng apoy mula sa langit sa tradisyong propetiko.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Ang “langit” ay nagpapanatili sa apokaliptiko at teolohikal na kulay ng οὐρανός, bagaman maaari rin itong tumukoy sa kalangitan.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: nagpapababa … tungo sa lupa
  rationale: 'Ipinahahayag nito ang sanhi at direksiyon ng pagkilos: pinapangyari nitong bumaba ang apoy hanggang sa lupa.'
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Natural itong Filipino para sa pampublikong pagganap na nakikita ng mga tao. Ang “mga tao” ay pangkalahatan at hindi limitado sa mga lalaki.
theological_decisions:
- issue: Kalikasan ng paggawa ng mga tanda
  choice: Ilarawan ang hayag na paggawa ng mga dakilang tanda nang hindi ipinapasiya kung tunay na sobrenatural, mapanlinlang, o ilusyon lamang ang mekanismo ng mga ito.
  alternative: Isalin ang σημεῖα bilang “mga himala” o gumamit ng pananalitang tahasang nagsasabing panlilinlang lamang ang mga ito.
  rationale: Sinasabi ng talata kung ano ang ginagawa at nakikita ng mga tao, ngunit hindi nito rito ipinapaliwanag ang pinagmulan o mekanismo. Pinananatili ng salin ang teolohikal na tensiyong iyon.
- issue: Puwersa ng ἵνα
  choice: Gamitin ang koordinasyong “at … pa nga” upang ipakita ang kapansin-pansing halimbawa o kinalabasan nang hindi mahigpit na pumipili sa layunin at resulta.
  alternative: “upang magpababa pa nga” para sa tahasang layunin, o “kaya nagpapababa” para sa tahasang resulta.
  rationale: Maaaring magkaroon ang ἵνα ng kulay ng layunin o resulta sa ganitong pagkakabuo. Hindi kailangang lutasin nang higit sa hinihingi ng konteksto ang ugnayang iyon.
translation_notes:
  register: Makabago at malinaw na Filipino na may dignidad na angkop sa apokaliptikong panitikan. Ginamit ang “dakilang tanda” upang mapanatili ang terminolohiyang pampanitikan ng Pahayag, habang ang “nagpapababa pa nga” ay natural at mariing nagpapakita sa apoy bilang natatanging tanda.
