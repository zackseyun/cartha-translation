id: REV.13.15
reference: Revelation 13:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: tl
  text: At ipinagkaloob sa kanya na bigyan ng hininga[a] ang larawan ng mabangis na hayop, upang ang larawan ng mabangis na hayop ay makapagsalita rin at maipapatay nito[b] ang lahat ng hindi sasamba sa larawan ng mabangis na hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “espiritu” o “buhay.”
    reason: lexical_alternative
  - marker: b
    text: O “at maging dahilan upang mapatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: ipinagkaloob sa kanya
  rationale: Pinananatili ng anyong balintiyak ang hindi pinangalanang nagbigay, habang likas na ipinahahayag sa Filipino ang ipinagkaloob na kakayahan o pahintulot.
- source_word: δοῦναι πνεῦμα
  choice: bigyan ng hininga
  rationale: Maaaring mangahulugan ang πνεῦμα ng hininga, espiritu, o buhay. Ang “hininga” ang pinakamalinaw sa larawang pinakikilos upang makapagsalita, nang hindi ipinapalagay na tunay na buhay o isang personal na espiritu ang ibinigay rito.
- source_word: εἰκών
  choice: larawan
  rationale: Saklaw nito ang isang imahen o representasyon nang hindi nililimitahan ang anyo sa isang estatuwa.
- source_word: θηρίον
  choice: halimaw
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa apokaliptikong θηρίον, at hindi ito nagpapasok ng higit na tiyak na pagkakakilanlan.
- source_word: ἵνα καὶ λαλήσῃ
  choice: upang makapagsalita pa nga
  rationale: Ipinahahayag ng “upang” ang layunin o kinalabasan, at ng “pa nga” ang nakagugulat na diin ng καί.
- source_word: ποιήσῃ ἵνα ... ἀποκτανθῶσιν
  choice: at maipapatay nito
  rationale: Natural na causative sa Filipino na pinananatili ang diwang pinapangyari ng larawan na mapatay ang mga hindi sasamba, gayundin ang balintiyak na anyo ng ἀποκτανθῶσιν.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: ang lahat ng hindi sasamba
  rationale: Likas na salin ng pangkalahatan at di-tiyak na saklaw ng parirala, na may inaasahang o panghinaharap na kilos.
- source_word: προσκυνήσωσιν
  choice: sasamba
  rationale: Sa konteksto ng Pahayag, ang προσκυνέω ay relihiyosong pagsamba, hindi lamang pagyukod o pagbibigay-galang.
theological_decisions:
- issue: Kahulugan ng πνεῦμα sa pagbibigay-kilos sa larawan
  choice: hininga
  alternative: espiritu; buhay
  rationale: Pinananatili ng “hininga” ang kongkretong larawan ng pagbibigay-kilos at ang posibleng alingawngaw ng paglikha, ngunit hindi iginigiit na tunay na buhay o personal na espiritu ang ibinigay.
- issue: Sino ang nagkaloob ng kakayahan o pahintulot
  choice: Hindi pinangalanan ang tagapagkaloob
  alternative: Tukuying Diyos o ang dragon/Satanas bilang tagapagkaloob
  rationale: Hindi tahasang tinutukoy ng balintiyak na ἐδόθη ang gumaganap; pinananatili ng salin ang sinadyang pagiging di-tiyak nito.
- issue: Papel ng larawan sa pagpatay
  choice: Pinapangyari nitong mapatay ang mga hindi sasamba
  alternative: Ang larawan mismo ang tuwirang pumapatay sa kanila
  rationale: Ang ποιήσῃ na sinusundan ng ἵνα at ng balintiyak na ἀποκτανθῶσιν ay nagpapahayag ng causation nang hindi tinutukoy kung sino ang aktuwal na tagapatay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ipinagkaloob” upang mapanatili ang apokaliptikong balintiyak at ang di-tiyak na tagapagbigay; iniwasan ang mas sektaryan o labis na interpretatibong pagpapaliwanag.
