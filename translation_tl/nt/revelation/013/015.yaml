revisions:
- from: At ipinagkaloob sa kanya na bigyan ng hininga[a] ang larawan ng halimaw, upang makapagsalita pa nga ang larawan ng halimaw at maipapatay nito[b] ang lahat ng hindi sasamba sa larawan ng halimaw.
  to: At ipinagkaloob sa kanya na bigyan ng hininga[a] ang larawan ng mabangis na hayop, upang ang larawan ng mabangis na hayop ay makapagsalita rin at maipapatay nito[b] ang lahat ng hindi sasamba sa larawan ng mabangis na hayop.
  rationale: 'Pinanatili ng rebisyon ang lahat ng pangunahing relasyon sa Griyego: ang ipinagkaloob na kakayahan sa kanya, ang pagbibigay ng πνεῦμα sa larawan, ang pagsasalita ng larawan, at ang pagpapangyari na mapatay ang mga tumatangging sumamba. Ang “mabangis na hayop” ay mas malapit sa θηρίον kaysa “halimaw,” at ang “makapagsalita rin” ay mas natural na Tagalog para sa kaí. Ang “maipapatay nito” ay nagpapanatili ng causation nang hindi tinutukoy ang aktuwal na tagapatay.'
