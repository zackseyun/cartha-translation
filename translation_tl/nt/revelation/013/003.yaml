  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: tl
  text: At ang isa sa mga ulo nito ay parang pinaslang hanggang sa kamatayan[a], at gumaling ang nakamamatay nitong sugat. Namangha ang buong daigdig[b] at sumunod sa halimaw,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “waring pinaslang hanggang sa kamatayan.” Ang Griyego ay gumagamit ng “parang,” kaya maaaring anyo o pagkakahawig ang tinutukoy sa halip na isang tuwirang pahayag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang buong lupain,” bagaman sa apokaliptikong kontekstong ito ay mas malamang ang “buong daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: ang isa sa mga ulo nito
  rationale: Likas na salin sa Tagalog ng partitive na μίαν ἐκ + genitive plural, nang hindi binabago ang tinutukoy na pag-aari.
- source_word: ὡς ἐσφαγμένην
  choice: ay parang pinaslang
  rationale: Pinananatili ng “parang” ang paghahambing o anyo ng pangitain na ipinahihiwatig ng ὡς; ang “pinaslang” ay sapat na matindi para sa σφάζω at hindi simpleng “pinatay.”
- source_word: εἰς θάνατον
  choice: hanggang sa mamatay
  rationale: Tahasang pinananatili ang diin ng Griyego sa kamatayan, kahit may sinadyang pag-uulit kasunod ng “pinaslang.”
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: ang nakamamatay nitong sugat
  rationale: Natural na Filipino para sa sugat na may katangian o bisa ng kamatayan, nang hindi ipinipilit kung tunay o waring naganap ang kamatayan.
- source_word: ἐθεραπεύθη
  choice: gumaling
  rationale: Karaniwang pandiwang Filipino para sa paggaling ng sugat at maayos na naghahayag ng pasibong diwa sa konteksto.
- source_word: ἐθαυμάσθη
  choice: namangha
  rationale: Ipinahahayag ang matinding pagtataka nang hindi ipinapalagay na pagsamba o pagsang-ayon agad ang damdamin.
- source_word: ὅλη ἡ γῆ
  choice: ang buong daigdig
  rationale: Sa pandaigdigang kontekstong apokaliptiko, mas malamang ang malawak na saklaw na “buong daigdig” kaysa “buong lupain.”
- source_word: ὀπίσω τοῦ θηρίου
  choice: sumunod sa halimaw
  rationale: Natural na Filipino na pinananatili kapuwa ang larawan ng pagsunod at ang maaaring diwa ng pagkiling o katapatan, nang hindi ito labis na ipinapaliwanag.
- source_word: θηρίου
  choice: halimaw
  rationale: Malinaw at karaniwang salin ng θηρίον sa apokaliptikong paglalarawan sa Pahayag.
theological_decisions:
- issue: Kung ano ang likas ng waring pagkamatay at paggaling ng halimaw
  choice: Inilarawan ang ulo bilang “parang pinaslang hanggang sa mamatay” at ang sugat bilang gumaling, nang hindi nililinaw kung literal, simboliko, o mapanlinlang ang pangyayari.
  alternative: Maaaring unawain bilang literal na kamatayan at muling pagkabuhay, simbolikong pagbawi ng isang pinuno o imperyo, o isang huwad na paggaya.
  rationale: Ang ὡς ay nagpapanatili ng paghahambing o anyo, samantalang malinaw na sinasabi ng teksto ang paggaling ng sugat. Hindi mismo nilulutas ng talata ang kahulugang teolohikal ng pangitain.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawan ng pagpaslang at ang sinadyang pagbanggit sa kamatayan, pati ang ambiguwidad ng “parang.” Ang kuwit sa hulihan ay sumusunod sa pagpapatuloy ng pangungusap sa kasunod na talata.
