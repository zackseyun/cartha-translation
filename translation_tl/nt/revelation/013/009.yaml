  text: If anyone has an ear[a], let him hear.
translation:
  language: tl
  text: Kung ang sinuman ay may tainga, makinig siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: Kung … ang sinuman
  rationale: Pinananatili nito ang tahasang kondisyong ipinahihiwatig ng Εἴ at ang bukás at pangkalahatang saklaw ng τις.
- source_word: ἔχει οὖς
  choice: may tainga
  rationale: Tuwirang pinananatili ang isahang οὖς at ang matalinghagang pormula tungkol sa kakayahang tumanggap at tumugon sa mensahe.
- source_word: ἀκουσάτω
  choice: makinig siya
  rationale: Ang ikatlong panauhang pautos ay likas na naipapahayag sa Filipino sa pamamagitan ng “makinig siya.” Mas malinaw na ipinahihiwatig ng “makinig” ang masusing pakikinig kaysa sa “marinig,” nang hindi ito pinalalawak tungo sa “unawain.”
theological_decisions:
- issue: Pangkalahatang tinutukoy ng isahang pautos
  choice: makinig siya
  alternative: makinig ang taong iyon
  rationale: Ang “siya” sa Filipino ay walang tinutukoy na kasarian at likas na tumutukoy rito sa sinumang may tainga; napapanatili rin nito ang isahang anyo ng Griyego nang hindi nagdaragdag ng kasariang wala namang kailangang ipahayag sa Filipino.
- issue: Matalinghagang diwa ng pormula tungkol sa pakikinig
  choice: panatilihin ang “may tainga … makinig”
  alternative: ang may pang-unawa ay umunawa
  rationale: Pinananatili ng salin ang larawang ginamit sa Griyego at ang taimtim na panawagang tumanggap nang may pansin, sa halip na ipakahulugan ito nang mas makitid bilang pag-unawa lamang.
translation_notes:
  register: Maikli, marangal, at likas sa modernong Filipino. Pinanatili ang kondisyong anyo, ang isahang “tainga,” at ang pormulang panawagan sa masusing pakikinig.
