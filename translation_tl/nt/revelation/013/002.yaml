id: REV.13.2
reference: Revelation 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: tl
  text: At ang halimaw na nakita ko ay parang leopardo[a]; ang mga paa nito ay parang mga paa ng oso, at ang bibig nito ay parang bibig ng leon. Ibinigay rito ng dragon ang kanyang kapangyarihan, ang kanyang trono, at malaking awtoridad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang larawan ng leopardo, oso, at leon ay umaalingawngaw sa mga pangitain tungkol sa mga halimaw sa Daniel 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: halimaw
  rationale: Sa Pahayag, tumutukoy ito sa isang mabangis at kakila-kilabot na nilalang na may simbolikong papel. Mas naipahahayag ng “halimaw” ang puwersang ito kaysa sa neutral na “hayop,” nang hindi ipinapaliwanag nang labis ang simbolo.
- source_word: ὅμοιον παρδάλει
  choice: parang leopardo
  rationale: Likas sa modernong Tagalog ang “parang” bilang pagpapahayag ng pagkakahawig, at tuwirang pinananatili ng “leopardo” ang hayop sa pangitain.
- source_word: πόδες ... ὡς ἄρκου
  choice: ang mga paa nito ay parang mga paa ng oso
  rationale: Ang “paa” ang tuwirang katumbas ng πόδες. Inuulit ang “mga paa” upang maging malinaw at natural sa Tagalog ang eliptikong paghahambing sa Griyego, nang hindi ito ginagawang mas tiyak na “mga kuko” o “mga galamay.”
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: ang bibig nito ay parang bibig ng leon
  rationale: Pinananatili ang tahasang pag-uulit ng στόμα upang mapanatili ang malinaw at matingkad na ayos ng paglalarawan.
- source_word: δράκων
  choice: dragon
  rationale: Ang “dragon” ang karaniwan at tuwirang katawagan sa modernong Filipino para sa apokaliptikong nilalang na ito.
- source_word: ἔδωκεν αὐτῷ
  choice: ibinigay rito
  rationale: Tuwiran ang “ibinigay” para sa ἔδωκεν. Ang “rito” ay malinaw na tumutukoy sa halimaw bilang tumatanggap at umiiwas sa mabigat na pag-uulit ng pangngalan.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Ipinahahayag nito ang lakas o kakayahang kumilos na ipinagkaloob ng dragon at pinananatiling naiiba sa ἐξουσία.
- source_word: θρόνον
  choice: trono
  rationale: Tuwirang pinananatili ng “trono” ang maharlika at pampamahalaang larawan ng Griyego.
- source_word: ἐξουσίαν μεγάλην
  choice: malaking awtoridad
  rationale: Pinananatili ng “awtoridad” ang diwa ng karapatan o pahintulot na mamahala at ang pagkakaiba nito sa δύναμις (“kapangyarihan”); tuwirang isinasalin ng “malaking” ang μεγάλην.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Ang dragon ay inilalarawan bilang personal na kumikilos at nagbibigay, kaya natural sa Tagalog ang “kanyang” para sa kapangyarihan at trono nito.
theological_decisions:
- issue: Ugnayan ng dragon at ng halimaw sa pagtukoy ng mga panghalip
  choice: Ginamit ang “nito/rito” para sa halimaw at “kanyang” para sa mga pag-aari ng dragon.
  alternative: Gamitin ang “nito” kapwa para sa halimaw at dragon.
  rationale: Nililinaw nito kung alin ang tumatanggap at alin ang nagbibigay, habang pinananatili ang dragon bilang personal na kumikilos sa salaysay. Hindi nito dinaragdagan ang tekstong Griyego ng hiwalay na doktrinal na paliwanag.
- issue: Pinagsamang larawan ng leopardo, oso, at leon
  choice: Tuwirang isinalin ang tatlong paghahambing at inilagay lamang sa talababa ang alusyon sa Daniel 7.
  alternative: Ipaliwanag sa pangunahing teksto na inuulit o tinutupad nito ang pangitain sa Daniel 7.
  rationale: Inilalahad ng Griyego ang mga larawan nang walang tahasang paliwanag. Ang tuwirang salin ay nagpapanatili sa simbolikong tensiyon at hindi nagpapasok ng interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “halimaw” upang mapanatili ang kakila-kilabot at simbolikong puwersa ng θηρίον, at pinag-iba ang “kapangyarihan” at “awtoridad” para sa δύναμις at ἐξουσία.
