id: REV.13.5
reference: Revelation 13:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: tl
  text: At binigyan ito ng isang bibig na nagsasalita ng mga dakilang bagay[b] at mga paglapastangan, at binigyan ito ng awtoridad na kumilos sa loob ng apatnapu't dalawang buwan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito at salin: “binigyan ito ng awtoridad na magpatuloy sa loob ng apatnapu''t dalawang buwan.”'
    reason: textual_variant
  - marker: b
    text: Sa kontekstong ito, ang “mga dakilang bagay” ay malamang na tumutukoy sa palalo o mapagmalaking pananalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: binigyan
  rationale: Pinananatili ng balintiyak na diwa na ang halimaw ay tumatanggap lamang at hindi likas na nagtataglay nito; inuulit din nito ang pormula ng teksto.
- source_word: στόμα
  choice: isang bibig
  rationale: Pinananatili ang matingkad na larawang apokaliptiko sa halip na gawing abstraktong 'kakayahang magsalita.'
- source_word: λαλοῦν
  choice: na nagsasalita
  rationale: Natural na salin ng kasalukuyang pandiwaring naglalarawan sa 'bibig.'
- source_word: μεγάλα
  choice: mga dakilang bagay
  rationale: Malapit sa literal na lawak ng Griyego at hindi agad nililimitahan sa 'mga pagyayabang,' bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: βλασφημίας
  choice: mga paglapastangan
  rationale: Ipinahahayag ang mapanghamak at laban-sa-Diyos na pananalita; nililinaw ng kasunod na konteksto ang tuwirang paglapastangan sa Diyos.
- source_word: ἐξουσία
  choice: awtoridad
  rationale: Mas angkop sa ipinagkaloob na saklaw o pahintulot kaysa sa hilaw na lakas lamang.
- source_word: ποιῆσαι
  choice: na kumilos
  rationale: Pinananatili ang malawak na diwa ng 'gumawa/kumilos' at sinusunod ang SBLGNT sa halip na ipasok sa pangunahing teksto ang tekstuwal na baryanteng 'magpatuloy.'
- source_word: μῆνας τεσσεράκοντα δύο
  choice: sa loob ng apatnapu't dalawang buwan
  rationale: Natural na Filipino para sa akusatibong nagsasaad ng haba ng panahon.
theological_decisions:
- issue: Diwa ng μεγάλα sa pananalita ng halimaw
  choice: mga dakilang bagay
  alternative: mga pagyayabang; mga palalong salita
  rationale: Ipinahihiwatig ng konteksto ang kapalaluan, ngunit mas malawak ang mismong salitang Griyego; pinananatili ang tensiyon at nililinaw sa talababa.
- issue: Kahulugan ng ποιῆσαι kasama ng pariralang tumutukoy sa tagal
  choice: na kumilos sa loob ng apatnapu't dalawang buwan
  alternative: na magpatuloy sa loob ng apatnapu't dalawang buwan
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na ποιῆσαι; ang 'magpatuloy' ay kaugnay ng ibang pagbasa sa ilang manuskrito at salin kaya inilalagay sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang 'ito' para sa halimaw, alinsunod sa karaniwang gramatikal na pagtukoy sa isang hayop sa Filipino. Pinanatili ang pag-uulit ng 'binigyan ito' at ang konkretong larawang 'isang bibig.' Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
source_grounding:
  english_pob_role: consult_only
