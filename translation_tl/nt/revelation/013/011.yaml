id: REV.13.11
reference: Revelation 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: tl
  text: At nakita ko ang isa pang halimaw na umaahon mula sa lupa[a], at mayroon itong dalawang sungay na tulad ng sa isang kordero, at nagsasalita itong gaya ng dragon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa lupain.” Ang salitang Griego na γῆ ay maaaring mangahulugang “lupa” o “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: isa pang halimaw
  rationale: Ang “halimaw” ay natural ngunit matindi ang dating sa modernong Tagalog at nagpapanatili sa apokaliptikong larawan ng isang mabangis at mapanlabang nilalang; malinaw na ipinahihiwatig ng “isa pa” na naiiba ito sa naunang halimaw.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: umaahon mula sa lupa
  rationale: Ipinakikita ng kasalukuyang participle ang halimaw habang lumilitaw o umaahon. Ang “lupa” ay natural na katumbas ng γῆ at nagpapanatili sa posibleng kahulugang “earth/ground” nang hindi ito nililimitahan sa isang partikular na lupain.
- source_word: εἶχεν
  choice: mayroon itong
  rationale: Natural na paglalarawan ito sa Tagalog para sa imperfect na εἶχεν, na naglalahad ng anyo ng halimaw.
- source_word: κέρατα δύο
  choice: dalawang sungay
  rationale: Tuwirang pinananatili nito ang simbolikong larawang kaugnay ng kapangyarihan at awtoridad sa panitikang apokaliptiko.
- source_word: ὅμοια ἀρνίῳ
  choice: na tulad ng sa isang kordero
  rationale: Dahil ang pang-uri ay tumutukoy sa dalawang sungay, nililinaw ng “tulad ng sa” na ang mga sungay ang inihahambing sa mga sungay ng isang kordero, habang pinananatili ang alusyon sa Kordero sa Pahayag.
- source_word: ἐλάλει
  choice: nagsasalita itong
  rationale: Ang anyong imperfect ay inilalarawan bilang patuloy o katangiang paraan ng pagsasalita; natural itong naipahahayag ng aspektong nagaganap sa “nagsasalita.”
- source_word: ὡς δράκων
  choice: gaya ng isang dragon
  rationale: Pinananatili ng “gaya ng” ang paghahambing at hindi ipinapahayag na ang halimaw mismo ang dragon.
theological_decisions:
- issue: Paglalarawan sa ἀρνίον at ang posibleng alusyon sa Kordero sa Pahayag
  choice: kordero
  alternative: munting kordero
  rationale: Ang “kordero” ay natural at marangal sa Tagalog at nagpapanatili sa posibleng mapanlinlang na pagkakahawig sa Kordero nang hindi labis na binibigyang-diin ang diminutibong anyo.
- issue: Kahulugan ng γῆ
  choice: lupa
  alternative: lupain
  rationale: Maaaring mangahulugan ang γῆ ng “lupa/daigdig” o “lupain.” Mas angkop dito ang “lupa” sa malawak na apokaliptikong paghahambing sa halimaw na mula sa dagat, ngunit itinatala sa talababa ang leksikal na alternatibo.
- issue: Ugnayan ng anyong tulad-kordero at tinig na tulad-dragon
  choice: ngunit
  alternative: at
  rationale: Ang καί ay karaniwang “at,” ngunit dito ay natural na ipinahihiwatig ng magkasalungat na mga larawan ang kontrast. Ginagamit ang “ngunit” upang malinaw na maipahayag ang diskursong ugnayan nang hindi tinutukoy ang pagkakakilanlan ng halimaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa nang malakas. Pinanatili ang apokaliptikong mga larawang “halimaw,” “kordero,” at “dragon,” gayundin ang leksikal na kalabuan ng γῆ sa pamamagitan ng talababa.
