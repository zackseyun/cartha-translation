  source_fidelity: Tumpak ang salin sa SBLGNT. Napananatili nito ang saklaw ng “mga patay,” ang pares na tumutukoy sa lahat ng antas ng katayuan (“mga dakila at mga hamak”), ang postura nilang nakatayo sa harap ng trono, ang pagbubukas ng mga aklat at ng isa pang aklat, at ang paghatol batay sa nakasulat ayon sa kanilang mga gawa. Hindi nito ipinapasok ang hatol na pagkondena sa “hinusgahan.”
  naturalness: Likas, malinaw, at marangal ang daloy sa makabagong Filipino Tagalog. Ang “dakila at hamak,” “sa harap ng trono,” “batay sa mga nakasulat,” at “ayon sa kanilang mga gawa” ay angkop sa rehistrong biblikal ngunit nananatiling madaling unawain.
  terminology: 'Konsistent at angkop ang mahahalagang katawagan: “mga aklat,” “aklat ng buhay,” “hinusgahan,” at “mga gawa.” Wasto ring nakalapat ang talababa a sa “mga gawa” at talababa b sa “mga aklat.” Ang tala tungkol sa “mga balumbon” ay nakapagbibigay ng kinakailangang kontekstong pangkultura nang hindi binabago ang salin.'
