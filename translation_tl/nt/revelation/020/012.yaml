id: REV.20.12
reference: Revelation 20:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: tl
  text: At nakita ko ang mga patay—ang mga dakila at ang mga hamak—na nakatayo sa harap ng trono. Binuksan ang mga aklat[b]. Binuksan din ang isa pang aklat, ang aklat ng buhay. At hinusgahan ang mga patay batay sa mga nakasulat sa mga aklat, ayon sa kanilang mga gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa kanilang mga ginawa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga aklat” ay maaari ring isaling “mga balumbon,” ayon sa karaniwang anyo ng nasusulat na akda noong sinaunang panahon.
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: ang mga patay
  rationale: Tumutukoy ang pang-uring ginamit bilang pangngalan sa mga taong namatay bilang isang kabuuan. Likas at marangal sa Filipino ang “mga patay.”
- source_word: τοὺς μεγάλους καὶ τοὺς μικρούς
  choice: ang mga dakila at ang mga hamak
  rationale: Isa itong saklaw na pahayag para sa lahat anuman ang katayuan. Mas natural sa Filipino ang “dakila at hamak” kaysa literal na “malalaki at maliliit,” na maaaring mapagkamalang tumutukoy sa laki o edad.
- source_word: ἑστῶτας
  choice: nakatayo
  rationale: 'Ipinahahayag ng perfect participle ang kalagayan nila sa tagpo: sila ay nakatayo sa harap ng trono.'
- source_word: ἐνώπιον τοῦ θρόνου
  choice: sa harap ng trono
  rationale: Direktang isinasalin ang pagharap o pagkalagay sa presensiya ng trono nang hindi dinaragdagan ng interpretasyong “hukuman.”
- source_word: βιβλία
  choice: mga aklat
  rationale: Malawak at karaniwang katumbas ito sa Filipino; ang posibilidad na mga balumbon ang sinaunang anyo ay inilagay sa talababa.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: binuksan
  rationale: Tuwirang ipinahahayag ang pasibong kilos sa natural na Filipino. Hindi ginamit ang “inalis ang tatak” sapagkat hindi iyon tiyak na sinasabi ng pandiwa.
- source_word: ἄλλο βιβλίον
  choice: isa pang aklat
  rationale: Ipinakikilala nito ang karagdagang aklat na naiiba sa mga naunang aklat.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: ang aklat ng buhay
  rationale: Elliptical sa Griyego ang parirala at nauunawaan ang “aklat”; kailangan itong banggitin sa Filipino para maging malinaw at natural.
- source_word: ἐκρίθησαν
  choice: hinusgahan
  rationale: Pinananatili nito ang diwang panghukuman nang hindi ipinapalagay na ang lahat ay hinatulan ng kaparusahan, na maaaring ipahiwatig nang mas malakas ng “hinatulan.”
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: batay sa mga nakasulat sa mga aklat
  rationale: Ipinahahayag nito na ang nakatalang nilalaman ng mga aklat ang batayan ng paghatol, at pinananatili ang diwa ng naisulat na at nananatiling nakatala.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: ayon sa kanilang mga gawa
  rationale: Malapit ito sa Griyego at pinananatili ang malawak na diwa ng mga kilos o ginawa ng bawat isa, pati ang kaugnayan nito sa ibang talatang biblikal tungkol sa paghatol.
theological_decisions:
- issue: Paghatol ayon sa mga gawa
  choice: ayon sa kanilang mga gawa
  alternative: ayon sa kanilang mga ginawa
  rationale: Tahasang inuugnay ng talata ang paghatol sa mga gawa. Hindi ito pinalalambot o ipinaliliwanag sa pamamagitan ng pagpasok ng mas malawak na sistemang teolohikal na wala mismo sa talata.
- issue: Kahulugan ng ἐκρίθησαν
  choice: hinusgahan
  alternative: hinatulan
  rationale: Ang pandiwa ay nagsasaad ng paghatol na panghukuman ngunit hindi nito sa sarili lamang tinutukoy ang hatol na kaparusahan. Pinananatili ng “hinusgahan” ang bukas na saklaw na iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal ngunit nauunawaang pares na “dakila at hamak” upang ipahayag ang lahat ng antas ng katayuan. Inilagay ang mga panandang talababa sa mga salitang talagang tinutukoy ng mga tala.
