  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: tl
  text: Ang iba pang mga patay ay hindi muling nabuhay hanggang sa matapos ang isang libong taon.[a] Ito ang unang pagkabuhay na muli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nabuhay hanggang sa matapos ang isang libong taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: ang iba sa mga patay
  rationale: Likas itong Filipino at malinaw na tumutukoy sa natitirang pangkat ng mga patay, bilang kaibahan sa mga binanggit sa naunang talata.
- source_word: οὐκ ἔζησαν
  choice: hindi muling nabuhay
  rationale: Sa konteksto ng ἀνάστασις, ipinahihiwatig ng aorist na anyo ng ζάω ang pagpasok sa buhay. Ang ‘muling nabuhay’ ay natural na pananalita sa Filipino para sa pagkabuhay mula sa kamatayan, nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: ἄχρι τελεσθῇ
  choice: hanggang sa matapos
  rationale: Pinananatili nito ang hangganang panahong ipinahahayag ng ἄχρι at ang diwang ganap na pagwawakas ng τελεσθῇ.
- source_word: τὰ χίλια ἔτη
  choice: ang isang libong taon
  rationale: Direkta at natural na salin ito ng tiyak na yugto ng sanlibong taon na tinutukoy na sa konteksto.
- source_word: αὕτη
  choice: Ito
  rationale: Pinananatiling malawak ang pagtukoy ng demonstratibo sa naunang inilarawang katotohanan, gaya ng nasa Griyego.
- source_word: ἡ ἀνάστασις ἡ πρώτη
  choice: ang unang pagkabuhay na muli
  rationale: Ang ‘pagkabuhay na muli’ ang malinaw at karaniwang katumbas sa Filipino ng ἀνάστασις; tuwirang pinananatili ng ‘unang’ ang σειρά na ipinahahayag ng πρώτη.
theological_decisions:
- issue: Tinutukoy ng “Ito ang unang pagkabuhay na muli”
  choice: Pinanatiling malawak ang “Ito,” na tumutukoy sa katotohanan ng pagkabuhay na inilarawan sa konteksto.
  alternative: Limitahan ito sa mga martir ng talata 4, palawakin sa lahat ng matuwid na patay, o tahasang unawain bilang espirituwal na pagkabuhay.
  rationale: Hindi nililinaw ng Griyego ang isang partikular na sistemang milenyal; kaya hindi dapat lutasin ng salin ang pinagtatalunang pakahulugan.
- issue: Diwa ng ἔζησαν sa konteksto
  choice: Isinalin bilang “muling nabuhay,” na angkop sa agarang konteksto ng pagkabuhay na muli.
  alternative: “nabuhay” lamang, o tahasang “nabuhay sa espirituwal na paraan.”
  rationale: Ang konteksto ng kamatayan at ἀνάστασις ay pumapabor sa pagpasok sa buhay, ngunit hindi na dinagdagan ng salin ang uri o sistematikong paliwanag nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pariralang “pagkabuhay na muli” at iniwasan ang mga terminong nagtatakda ng isang partikular na interpretasyong milenyal.
