  verdict: revise
  source_fidelity: Ang “hindi muling nabuhay,” “hanggang sa matapos,” at “unang pagkabuhay na muli” ay tapat sa diwa ng οὐκ ἔζησαν, ἄχρι τελεσθῇ, at ἡ ἀνάστασις ἡ πρώτη. Gayunman, ang “Ang iba sa mga patay” ay mas madaling unawaing ilan lamang sa pangkat ng mga patay, samantalang ang οἱ λοιποὶ ay tumutukoy sa natitirang bahagi bilang kabaligtaran ng naunang pangkat.
  naturalness: Mas likas at mas tiyak sa modernong Filipino ang “Ang iba pang mga patay,” na malinaw na nagsasaad ng natitira o ibang pangkat na ihinahalintulad sa mga binanggit sa naunang talata. Ang natitirang pananalita ay malinaw at marangal.
  terminology: Ang “pagkabuhay na muli” ay angkop at karaniwang terminong Filipino para sa ἀνάστασις. Ang “muling nabuhay” ay angkop sa kontekstong ito at hindi nagpapataw ng isang partikular na interpretasyong milenyal.
