  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: tl
  text: At nakita ko ang isang dakilang puting trono at ang nakaupo rito, na mula sa presensiya niya ay tumakas ang lupa at ang langit, at walang lugar na masumpungan para sa mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: isang dakila at puting trono
  rationale: Pinananatili ng “dakila” ang diwa ng laki at kadakilaan ng μέγαν, habang natural sa Filipino ang pag-uugnay ng dalawang pang-uri.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: ang nakaupo roon
  rationale: Natural at marangal na paglalarawan ito sa taong nasa trono, nang hindi tahasang tinutukoy ang kanyang pagkakakilanlan.
- source_word: ἀπὸ τοῦ προσώπου
  choice: mula sa kanyang harapan
  rationale: Ipinahahayag ng “harapan” ang idyomatikong diwa ng πρόσωπον bilang presensiya, ngunit nananatiling malapit sa larawan ng “mukha” sa Griyego.
- source_word: ἔφυγεν
  choice: tumakas
  rationale: Pinananatili ang masigla at personipikadong larawan ng φεύγω sa halip na ipakahulugang basta naglaho.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: ang lupa at ang langit
  rationale: Ang dalawang pantukoy ay tumutugma sa kapwa artikulong Griyego at natural pa rin sa Filipino.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: walang natagpuang lugar para sa mga iyon
  rationale: Pinananatili ang pasibong ayos at nililinaw na ang tinutukoy ay ang lupa at ang langit, hindi mga tao.
theological_decisions:
- issue: Pagkakakilanlan ng nakaupo sa trono
  choice: Iniwan itong di-tiyak bilang “ang nakaupo roon.”
  alternative: Tahasang tukuyin bilang Diyos, Ama, Mesiyas, o banal na Hukom.
  rationale: Hindi pinapangalanan ng mismong talata ang nakaupo; kaya hindi dinaragdagan ng salin ang teolohikal na pagtukoy.
- issue: Paraan ng paglalarawan sa paglayo ng lupa at langit
  choice: “tumakas”
  alternative: “naglaho” o “napawi”
  rationale: Ang Griyegong φεύγω ay naglalarawan ng pagtakas. Ang “naglaho” ay posibleng interpretasyon sa pangyayari ngunit hindi iyon ang tuwirang pandiwa ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dakila” para sa apokaliptikong bigat ng μέγαν at “mga iyon” upang malinaw na tumukoy sa lupa at langit.
