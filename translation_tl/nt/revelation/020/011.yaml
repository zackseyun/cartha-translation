  to: At nakita ko ang isang dakilang puting trono at ang nakaupo rito, na mula sa presensiya niya ay tumakas ang lupa at ang langit, at walang lugar na masumpungan para sa mga ito.
  rationale: Inayos ang pagsasalin ng ἀπὸ τοῦ προσώπου bilang “mula sa presensiya niya,” na siyang likas na idyomatikong katumbas sa Filipino, habang pinanatili sa talababa ang literal na “mukha.” Pinalinaw rin ang kaugnayan ng nakaupo sa trono sa pamamagitan ng “rito,” at inayos ang pagkakasunod ng mga pang-uri. Walang idinagdag na pagkakakilanlan sa nakaupo sa trono.
