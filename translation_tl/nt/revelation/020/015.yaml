id: REV.20.15
reference: Revelation 20:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: tl
  text: At kung ang sinuman ay hindi natagpuang nakasulat sa aklat ng buhay[a], itinapon siya sa lawa ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa balumbon ng buhay.” Ang salitang Griyego ay maaaring tumukoy sa aklat o balumbon.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: kung ang sinuman
  rationale: Pinananatili nito ang bukás at di-tiyak na kondisyon ng Griyego at natural itong pakinggan sa makabagong Tagalog.
- source_word: οὐχ εὑρέθη
  choice: hindi natagpuan
  rationale: Tuwirang ipinapahayag ng anyong pasibo ang resulta ng paghahanap o pagsusuri sa tagpo ng paghuhukom.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: sa aklat ng buhay
  rationale: Ang “aklat ng buhay” ay malinaw at likas na salin sa Tagalog; maaari ring tumukoy ang βίβλος sa isang balumbon, kaya inilagay ang posibilidad na iyon sa talababa.
- source_word: γεγραμμένος
  choice: nakasulat
  rationale: Tuwirang sinasalamin nito ang perpektong pasibong participle at likas na kaugnay ng pariralang “hindi natagpuang nakasulat.”
- source_word: ἐβλήθη
  choice: itinapon siya
  rationale: Ipinahahayag ng “itinapon” ang puwersahang paglalagay nang hindi gumagamit ng lipas o labis na matinding salita; pinananatili ng “siya” ang isahang pagtukoy.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: sa lawa ng apoy
  rationale: Tuwirang pinananatili ang apokaliptikong larawan at ang karaniwang anyo nito sa Tagalog.
theological_decisions:
- issue: Larawan ng pangwakas na paghuhukom
  choice: lawa ng apoy
  alternative: maapoy na lawa
  rationale: Pinananatili ang mismong larawan ng teksto nang hindi dinaragdagan ng paliwanag tungkol sa kalikasan o tagal ng kaparusahan.
- issue: Isahang panghalip para sa di-tiyak na tao
  choice: siya
  alternative: ang taong iyon
  rationale: Isahan ang tinutukoy sa Griyego. Ang “siya” sa Tagalog ay hindi nagtatakda ng kasarian, kaya napapanatili ang bilang at natural na daloy nang hindi kinakailangang magpasok ng kasariang hindi ipinapahiwatig ng panghalip sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maigsi at taimtim na himig ng pahayag, ang pasibong ayos ng paghuhukom, at ang apokaliptikong larawang “lawa ng apoy.”
