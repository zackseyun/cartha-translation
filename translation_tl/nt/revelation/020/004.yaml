id: REV.20.4
reference: Revelation 20:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: tl
  text: At nakita ko ang mga trono; umupo sila sa mga iyon, at ibinigay sa kanila ang paghatol. Nakita ko ang mga kaluluwa ng mga pinugutan ng ulo dahil sa patotoo ni Jesus[a] at dahil sa salita ng Diyos, at yaong mga hindi sumamba sa halimaw ni sa larawan nito at hindi tumanggap ng tanda sa kanilang noo at sa kanilang kamay. Nabuhay sila at naghari silang kasama ng Mesiyas[b] sa loob ng isang libong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patotoo tungkol kay Jesus.” Ang pariralang Griyego ay maaaring tumukoy sa patotoong ibinigay ni Jesus o sa patotoo tungkol kay Jesus.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “Cristo.” Ang Χριστός ay nangangahulugang “Mesiyas” o “Pinahiran” at ginagamit dito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: mga trono
  rationale: Tuwiran at karaniwang salin ng konkretong larawan sa pangitain.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: umupo sila sa mga iyon
  rationale: Pinananatili ang aktibong pandiwa at ang di-tiyak na tinutukoy ng panghalip, nang hindi kinikilalang tahasan kung sino ang mga umupo.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: ibinigay sa kanila ang paghatol
  rationale: Pinananatili ang lawak ng κρίμα, na maaaring tumukoy sa paghatol, hatol, o kapangyarihang humatol, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: ψυχὰς
  choice: mga kaluluwa
  rationale: Angkop sa apokaliptikong pangitain at hindi pinapawi ang pagkakaiba ng kanilang kamatayan at kasunod na pagkabuhay.
- source_word: πεπελεκισμένων
  choice: mga pinugutan ng ulo
  rationale: Malinaw at likas na Filipino para sa tiyak na uri ng pagpatay na tinutukoy ng pandiwa.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: dahil sa patotoo ni Jesus
  rationale: Ipinapahayag ng “dahil sa” ang sanhi. Nananatiling bukas sa Filipino ang genitibong “ni Jesus” sa patotoong ibinigay ni Jesus o patotoo tungkol sa kanya.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: dahil sa salita ng Diyos
  rationale: Tuwirang salin ng pariralang nagsasaad ng sanhi at gumagamit ng likas at kinikilalang katawagan.
- source_word: οἵτινες
  choice: yaong mga
  rationale: Pinananatili ang pagkilala sa isang pangkat nang hindi sapilitang nagpapasiya kung ito ay kapareho lamang o mas malawak kaysa sa naunang pangkat.
- source_word: προσεκύνησαν
  choice: sumamba
  rationale: Ipinahahayag ang relihiyosong diwa, hindi lamang ang pisikal na pagyuko.
- source_word: θηρίον
  choice: halimaw
  rationale: Likas na Filipino para sa apokaliptikong θηρίον at malinaw na tumutukoy sa kilalang tauhan sa Pahayag.
- source_word: εἰκόνα
  choice: larawan
  rationale: Tuwiran at hindi mapagpasyang salin; hindi nito paunang ipinapalagay ang mas interpretatibong “diyus-diyosan.”
- source_word: χάραγμα
  choice: tanda
  rationale: Malinaw at karaniwang salin sa konteksto ng Pahayag, nang hindi nililimitahan ito sa tatak o selyo.
- source_word: ἔζησαν
  choice: nabuhay sila
  rationale: Ipinahahayag ang pangyayaring pagdating sa buhay sa konteksto, ngunit hindi dinaragdagan ng paglalarawan hinggil sa eksaktong kalikasan nito.
- source_word: χριστοῦ
  choice: Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo; isinasalin ito upang maging malinaw ang kahulugang “Pinahiran.”
- source_word: χίλια ἔτη
  choice: isang libong taon
  rationale: Likas na paraan sa Filipino ng pagpapahayag ng bilang na isang libo.
theological_decisions:
- issue: Hindi tahasang paksa ng ἐκάθισαν at mga tumanggap ng paghatol
  choice: Pinanatili bilang “sila” at “sa kanila,” nang walang ibinigay na tiyak na pagkakakilanlan.
  alternative: Tukuyin sila bilang mga martir, lahat ng banal, mga apostol, o mga kasapi ng makalangit na hukuman.
  rationale: Hindi tahasang pinapangalanan ng Griyego ang paksa; ang pagtukoy sa isang partikular na pangkat ay magpapasok ng interpretasyong wala sa talata.
- issue: Kahulugan ng μαρτυρίαν Ἰησοῦ
  choice: “patotoo ni Jesus” sa pangunahing teksto, na may talababa tungkol sa dalawang posibleng ugnayan.
  alternative: “kanilang patotoo tungkol kay Jesus” o “patotoong ibinigay ni Jesus.”
  rationale: Tunay na malabo ang genitibo at maaaring maging pansarili o palayon; hindi dapat tahimik na lutasin ang teolohikal na tensiyon.
- issue: Ugnayan ng οἵτινες sa mga pinugutan ng ulo
  choice: Isinalin bilang “at yaong mga,” na pinananatiling bukas kung dagdag na pangkat o karagdagang paglalarawan ang sumusunod.
  alternative: Gawing tahasang iisang pangkat lamang ang mga martir at mga hindi sumamba, o gawing tahasang dalawang magkahiwalay na pangkat.
  rationale: Hindi kailangang pasiyahan ng salin ang eksaktong saklaw at ugnayan ng mga pangkat.
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit ang salita bilang titulo rito, kaya inililitaw ng “Mesiyas” ang titulong kahulugan nang hindi nagdaragdag ng denominasyonal na pagbasa.
- issue: Pagsasalin ng ἔζησαν
  choice: nabuhay sila
  alternative: muling nabuhay sila; namuhay sila
  rationale: Ipinakikita ng konteksto ang eventibong pagdating sa buhay, ngunit iniiwasan ng salin ang dagdag na doktrinal na pagtukoy na lampas sa sinabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang apokaliptikong mga larawang “mga trono,” “mga kaluluwa,” “halimaw,” at “tanda.” Iniwasan ang mga katawagang nakatali sa isang denominasyon at hindi nilutas ang mga tunay na kalabuan ng Griyego.
