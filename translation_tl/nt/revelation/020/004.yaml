revisions:
- from: At nakakita ako ng mga trono, at umupo sila sa mga iyon, at ibinigay sa kanila ang paghatol. Nakita ko rin ang mga kaluluwa ng mga pinugutan ng ulo dahil sa patotoo ni Jesus[a] at dahil sa salita ng Diyos, at yaong mga hindi sumamba sa halimaw ni sa larawan nito at hindi tumanggap ng tanda sa kanilang noo at sa kanilang kamay. Nabuhay sila at naghari silang kasama ng Mesiyas[b] sa loob ng isang libong taon.
  to: At nakita ko ang mga trono; umupo sila sa mga iyon, at ibinigay sa kanila ang paghatol. Nakita ko ang mga kaluluwa ng mga pinugutan ng ulo dahil sa patotoo ni Jesus[a] at dahil sa salita ng Diyos, at yaong mga hindi sumamba sa halimaw ni sa larawan nito at hindi tumanggap ng tanda sa kanilang noo at sa kanilang kamay. Nabuhay sila at naghari silang kasama ng Mesiyas[b] sa loob ng isang libong taon.
  rationale: Inalis ang “rin,” na walang hayag na katumbas sa Griyego, at inayos ang bantas upang maging mas malinaw ang daloy ng pangitain sa Filipino. Hindi binago ang mga terminong teolohikal, ang di-tiyak na paksa ng “umupo sila,” ang kahulugan ng “paghatol,” o ang kalabuan ng “patotoo ni Jesus.”
