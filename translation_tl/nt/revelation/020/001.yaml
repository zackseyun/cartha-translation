id: REV.20.1
reference: Revelation 20:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: tl
  text: At nakita ko ang isang anghel na bumababa mula sa langit, hawak sa kamay niya ang susi ng kalaliman[a] at isang malaking tanikala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hukay na walang ilalim.” Ang salitang Griyego ay “kalaliman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ng “At” ang payak at magkakaugnay na daloy ng salaysay ng pangitain, nang hindi ipinapalagay ang mas tiyak na pagkakasunod-sunod na ipinahihiwatig ng “Pagkatapos.”
- source_word: εἶδον
  choice: nakita ko
  rationale: Direkta at likas na salin ng aorist sa salaysay ng pangitain.
- source_word: ἄγγελον
  choice: isang anghel
  rationale: Sa konteksto ng Pahayag, malinaw na isang makalangit na nilalang ang tinutukoy, hindi lamang isang pangkalahatang sugo.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: na bumababa mula sa langit
  rationale: Pinananatili ang nagpapatuloy na kilos ng participle at ang direksiyong mula sa langit.
- source_word: ἔχοντα
  choice: hawak
  rationale: Ang “hawak” ay angkop sa kongkretong larawan ng susi at tanikala at mas natural kaysa sa payak na “mayroon.”
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: ang susi ng kalaliman
  rationale: Ang “susi ng” ay likas sa Filipino at pinananatili ang ugnayang genitive ng Griyego; ang “kalaliman” ay tuwirang kumakatawan sa ἄβυσσος nang hindi dinaragdagan ang larawan.
- source_word: ἅλυσιν μεγάλην
  choice: isang malaking tanikala
  rationale: Ang “tanikala” ay malinaw at marangal na salita para sa chain, at ang “malaking” ay tuwirang naghahatid sa μέγας.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: sa kamay niya
  rationale: Likas na Filipino para sa pagdadala o paghawak ng mga bagay, habang tahasang pinananatili ang pagbanggit sa kamay.
theological_decisions:
- issue: Paglilipat ng ἄβυσσος sa kontekstong apokaliptiko
  choice: kalaliman
  alternative: hukay na walang ilalim
  rationale: Mas malapit ang “kalaliman” sa mismong salitang Griyego at hindi nito labis na tinutukoy ang anyo ng lugar bilang isang hukay. Inilalagay sa talababa ang tradisyonal na alternatibo upang mapanatili ang posibleng kaugnay na larawan nang hindi ito ipinapasok sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Pinanatili ang iisang pangungusap at ang payak na daloy ng Griyego; inilagay ang talababa kaagad sa “kalaliman,” ang salitang tinutukoy nito.
