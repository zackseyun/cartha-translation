id: REV.20.8
reference: Revelation 20:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: tl
  text: at lalabas siya upang dayain[a] ang mga bansang nasa apat na sulok ng daigdig—Gog at Magog[b]—upang tipunin sila para sa digmaan.[c] Ang bilang nila ay tulad ng buhangin sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iligaw.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Gog at Magog” ay may alusyon sa Ezekiel 38–39 at maaaring magsilbing tipolohikal na tawag sa mga bansang nagtipon para sa huling paghihimagsik.
    reason: cross_reference
  - marker: c
    text: O “para sa labanan.” Ang salitang Griyego ay maaaring mangahulugang “digmaan” o “labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: lalabas siya
  rationale: Likas na salin ng panghinaharap na ἐξέρχομαι at pinananatili ang larawan ng paglabas ni Satanas matapos siyang pakawalan sa naunang talata.
- source_word: πλανῆσαι
  choice: upang dayain
  rationale: Ang πλανάω ay maaaring mangahulugang dayain o iligaw. Maikli at natural ang “dayain” sa kontekstong ito, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: τὰ ἔθνη
  choice: ang mga bansa
  rationale: Tumutukoy ito sa mga bansa bilang mga pangkat ng tao, hindi partikular sa mga di-Judio. Karaniwan at malinaw sa modernong Filipino ang “mga bansa.”
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: na nasa apat na sulok ng daigdig
  rationale: Pinananatili ang apokaliptikong idyoma para sa pinakamalalayong bahagi ng buong daigdig nang hindi ito ginagawang literal na paglalarawan ng hugis nito.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: ang Gog at Magog
  rationale: Isinasalin ang parirala bilang aposisyon sa “mga bansa” at pinananatiling transliterado ang mga pangalang tumutukoy sa alusyon sa Ezekiel.
- source_word: συναγαγεῖν
  choice: at tipunin sila
  rationale: Pinananatili ang koordinasyong may καί at ang layuning pagtipunin ang mga dinayang bansa.
- source_word: εἰς τὸν πόλεμον
  choice: para sa digmaan
  rationale: Ang πόλεμος ay maaaring “digmaan” o “labanan.” Hindi nililimitahan ng “digmaan” ang kahulugan sa iisang sagupaan.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Ang bilang nila
  rationale: Natural na Filipino ito at malinaw na bumabalik sa mga bansang tinipon, bagaman hinahati sa bagong pangungusap upang maiwasan ang mabigat na hulma.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: ay tulad ng buhangin sa dagat
  rationale: Pinananatili ang pamilyar na biblikal na paghahambing na nagpapahiwatig ng napakaraming bilang.
theological_decisions:
- issue: Tinutukoy ng di-hayag na simuno ng ἐξελεύσεται
  choice: Ginamit ang “siya,” na tumutukoy kay Satanas mula sa talata 7.
  alternative: Ulitin ang pangalang “Satanas” sa mismong talata.
  rationale: Walang tahasang simuno sa Griyego ng talatang ito; sapat ang panghalip upang mapanatili ang gramatikal na pagpapatuloy nang hindi nagdaragdag ng pangngalan.
- issue: Papel ng “Gog at Magog”
  choice: Itinuring na aposisyon sa mga bansang dinaya.
  alternative: Ituring bilang dalawang hiwalay na indibidwal o bilang mahigpit na heograpikong pagkakakilanlan mula sa Ezekiel.
  rationale: Sinusuportahan ng anyo at konteksto ang paglalapat ng mga pangalan sa mga bansang nagtipon, ngunit hindi ipinapasya ng salin kung simboliko, tipolohikal, o heograpiko ang tiyak na katuparan.
- issue: Saklaw ng πόλεμος
  choice: digmaan
  alternative: labanan
  rationale: Kapuwa posible ang “digmaan” at “labanan”; pinili ang mas malawak na “digmaan” at pinanatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “daigdig” para sa pandaigdigang saklaw, “dayain” bilang pangunahing salin na may “iligaw” sa talababa, at “tipunin” upang mapanatili ang biblikal at eskatolohikal na larawan. Nasa pangunahing teksto ang lahat ng marker ng talababa.
