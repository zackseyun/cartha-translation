id: REV.20.14
reference: Revelation 20:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: tl
  text: At ang Kamatayan at ang Hades[a] ay itinapon sa lawa ng apoy. Ito ang ikalawang kamatayan, ang lawa ng apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “daigdig ng mga patay.” Ang terminong Griyego ay Hades, na naiiba rito sa “lawa ng apoy.” Isinasalin din ito ng ilan bilang “libingan” o “impiyerno,” ngunit maaaring maging mapanlinlang ang “impiyerno” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: Kamatayan / kamatayan
  rationale: Ginamit ang malaking titik sa unang paglitaw upang ipahiwatig ang personipikasyon nito kasama ng Hades; maliit na titik naman sa pariralang “ikalawang kamatayan,” na tumutukoy sa isang kalagayan o hatol.
- source_word: ᾅδης
  choice: Hades
  rationale: Pinanatili ang transliteradong terminong Griyego upang hindi ito maipagkamali sa lawa ng apoy at upang hindi agad ipakahulugang “impiyerno” o simpleng “libingan.”
- source_word: ἐβλήθησαν
  choice: itinapon
  rationale: Likas at tuwirang salin ng pasibong pandiwa na nagpapahayag ng sapilitang paghahagis o pagtatalaga sa isang lugar.
- source_word: λίμνη τοῦ πυρός
  choice: lawa ng apoy
  rationale: Malinaw at karaniwang salin na nagpapanatili sa larawang apokaliptiko at sa pag-uulit ng parirala sa Griyego.
- source_word: οὗτος ... ἐστιν
  choice: Ito ang
  rationale: Pinananatili ang tahasang pahayag ng pagkakakilanlan nang hindi ito ginagawang maluwag na paliwanag gaya ng “Ibig sabihin nito.”
- source_word: θάνατος ὁ δεύτερος
  choice: ikalawang kamatayan
  rationale: Natural na ayos sa modernong Tagalog para sa natatanging pariralang apokaliptiko.
theological_decisions:
- issue: Paglalarawan sa ᾅδης sa konteksto ng pangwakas na paghatol
  choice: Hades
  alternative: libingan; impiyerno
  rationale: Malinaw na ibinubukod ng talata ang Hades sa lawa ng apoy. Ang “impiyerno” ay maaaring pag-isahin ang dalawang magkaibang larawan, samantalang ang “libingan” ay maaaring labis na magpaliit sa saklaw ng terminong Griyego.
- issue: Personipikasyon ng θάνατος
  choice: “Kamatayan” sa unang sugnay at “kamatayan” sa ikalawa
  alternative: Maliit na titik sa lahat ng paglitaw; malaking titik sa lahat ng paglitaw
  rationale: Sa unang sugnay, ang Kamatayan at Hades ay inilalarawang mga entidad na itinapon. Sa ikalawa, ang “ikalawang kamatayan” ay pangalan ng hatol o kalagayan, kaya hindi ito labis na pinepersonipika.
- issue: Ugnayan ng “ikalawang kamatayan” at “lawa ng apoy”
  choice: 'Pinanatili ang apposisyon: “Ito ang ikalawang kamatayan, ang lawa ng apoy.”'
  alternative: “Ang lawa ng apoy ang ikalawang kamatayan”; “Ibig sabihin nito ay...”
  rationale: Ginagaya nito ang siksik at bahagyang mariing pagkakabuo ng Griyego nang hindi nagdaragdag ng paliwanag o tahasang nilulutas ang lahat ng posibleng sintaktikong diin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang “Hades” bilang teknikal na katawagan, habang ginamit ang karaniwang pariralang “lawa ng apoy.”
