  source_fidelity: Tapat ang salin sa Griyego. Naiingatan ang personipikadong paglalarawan sa unang sugnay sa “Kamatayan at ... Hades,” ang pasibong puwersa ng ἐβλήθησαν sa “ay itinapon,” ang pag-uulit ng “lawa ng apoy,” at ang appositional na pagkakaugnay ng “ikalawang kamatayan” at “lawa ng apoy.”
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Ito ang ikalawang kamatayan, ang lawa ng apoy” ay siksik ngunit malinaw at angkop sa apokaliptikong rehistro; hindi kailangan ng dagdag na paliwanag o pagbabago sa bantas.
  terminology: Ang “Hades” ay wastong pinanatili bilang teknikal na katawagan at hindi ipinagkamali sa “lawa ng apoy.” Ang paggamit ng malaking titik sa “Kamatayan” sa unang sugnay at maliit na titik sa “ikalawang kamatayan” ay kapaki-pakinabang na hudyat ng magkaibang tungkuling pampanitikan nang hindi nagdaragdag ng doktrina. Ang talababa ay angkop na nagbabanggit ng mga alternatibong salin at nagbababala laban sa posibleng mapanlinlang na “impiyerno.”
