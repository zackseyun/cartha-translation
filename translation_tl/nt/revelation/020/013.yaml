id: REV.20.13
reference: Revelation 20:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: tl
  text: At ibinigay ng dagat ang mga patay na nasa loob nito, at ibinigay ng Kamatayan at ng Hades[a] ang mga patay na nasa kanila; at hinatulan ang bawat isa ayon sa kanilang mga gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dako ng mga patay.” Ang salitang Griyego ay ᾅδης (Hades), na naiiba sa ibang mga terminong madalas isaling “impiyerno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: ibinigay
  rationale: Pinananatili ang karaniwang kahulugan ng δίδωμι at likas itong nauunawaan dito bilang pagpapalabas o pagsuko ng mga patay upang hatulan.
- source_word: ἡ θάλασσα
  choice: ang dagat
  rationale: Tuwirang katumbas na nagpapanatili sa tiyak na pantukoy ng Griyego.
- source_word: τοὺς νεκρούς
  choice: ang mga patay
  rationale: Natural na substantibong gamit sa Filipino para sa pangmaramihang νεκρούς.
- source_word: τοὺς ἐν αὐτῇ
  choice: na naroon
  rationale: Malinaw at natural na tumutukoy sa mga patay na nasa dagat nang hindi inuulit nang mabigat ang pariralang 'nasa loob nito.'
- source_word: ὁ θάνατος
  choice: ang Kamatayan
  rationale: Ang malaking titik ay nagpapahiwatig ng personipikasyon sa apokaliptikong larawan, gaya ng pagkakahanay nito sa Hades.
- source_word: ὁ ᾅδης
  choice: ang Hades
  rationale: Ang transliterasyon ay nagpapanatili sa natatanging terminong Griyego at umiiwas sa mapanlinlang na pagtutumbas dito sa 'impiyerno.'
- source_word: τοὺς ἐν αὐτοῖς
  choice: ang mga patay na nasa kanila
  rationale: Pinananatili ang pangmaramihang reperensiya sa Kamatayan at Hades.
- source_word: ἐκρίθησαν ἕκαστος
  choice: hinatulan ang bawat isa
  rationale: Natural na distributibong anyo sa Filipino na pinananatili ang diin sa indibiduwal na paghatol.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: ayon sa kanilang mga gawa
  rationale: Pinananatili ang salitang-bibliyang 'mga gawa' para sa ἔργα at ang batayang pamantayan ng paghatol na ipinahahayag ng κατά.
theological_decisions:
- issue: Paglilipat ng ᾅδης sa konteksto ng pangwakas na paghatol
  choice: Hades
  alternative: daigdig ng mga patay; impiyerno
  rationale: Ibinubukod nito ang ᾅδης sa lawa ng apoy na binabanggit sa agarang konteksto at hindi nag-aangkat ng mga kahulugang nakaugnay sa 'impiyerno.'
- issue: Personipikasyon ng θάνατος
  choice: Kamatayan
  alternative: kamatayan
  rationale: Ang malaking titik ay nagpapakita sa Kamatayan bilang personipikadong kapangyarihan o entidad sa pangitain nang walang idinaragdag na doktrinal na pagpapasya.
- issue: Pamantayan ng paghatol sa κατὰ τὰ ἔργα αὐτῶν
  choice: ayon sa kanilang mga gawa
  alternative: batay sa kanilang ginawa
  rationale: Pinananatili ang pormulasyong Griyego at ang teolohikal na tensiyon nito nang hindi ipinapaliwanag kung paano ito nauugnay sa ibang pahayag ng Kasulatan tungkol sa kaligtasan at paghatol.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paulit-ulit na estruktura ng Griyego, ang personipikasyon ng Kamatayan, at ang natatanging terminong Hades; ginamit ang 'mga gawa' bilang pamilyar ngunit kasalukuyan pa ring malinaw na pananalita.
