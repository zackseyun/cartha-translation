id: REV.20.10
reference: Revelation 20:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: tl
  text: At ang diyablo, na nanlilinlang sa kanila, ay itinapon sa lawa ng apoy at asupre, kung saan naroon din ang halimaw at ang huwad na propeta; at pahihirapan silang araw at gabi magpakailanman[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “sa mga kapanahunan ng mga kapanahunan,” isang mariing idyoma para sa walang katapusang tagal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: diyablo
  rationale: Karaniwang personal na katawagan kay Satanas sa Pahayag; malinaw at likas sa modernong Filipino.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: na patuloy na dumadaya sa kanila
  rationale: Ipinahahayag ng may artikulong present participle ang nagpapatuloy na gawain ng diyablo; inililinaw ng “patuloy” ang aspektong ito.
- source_word: ἐβλήθη
  choice: itinapon
  rationale: Pinananatili ang pasibong anyo at ang diwa ng sapilitang paghahagis bilang hatol.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: lawa ng apoy at asupre
  rationale: Ang “asupre” ang tuwirang makabagong katumbas ng θεῖον at madaling maunawaan.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: kung saan naroon din ang halimaw at ang huwad na propeta
  rationale: Walang hayag na pandiwa sa Griyego; ang “naroon” ay likas na pandagdag sa Filipino at nagpapahiwatig ng patuloy nilang kinaroroonan nang hindi labis na nagpapakahulugan.
- source_word: θηρίον
  choice: halimaw
  rationale: Likas na katumbas ng apokaliptikong θηρίον at angkop bilang katawagan sa tauhan sa Pahayag.
- source_word: ψευδοπροφήτης
  choice: huwad na propeta
  rationale: Tuwirang katumbas na malinaw sa modernong Filipino.
- source_word: βασανισθήσονται
  choice: pahihirapan sila
  rationale: Pinananatili ang hinaharap at pasibong diwa ng matinding pagpapahirap nang hindi tinutukoy ang paraang hindi naman sinabi ng teksto.
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Likas na idyomang Filipino para sa walang tigil na pagpapatuloy.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Likas at mariing katumbas sa Filipino ng idyomang Griyego na nagpapahayag ng walang katapusang tagal.
theological_decisions:
- issue: Tagal ng parusang ipinahahayag ng εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  alternative: sa mga panahon ng mga panahon
  rationale: Inihahatid ang mariing idyomang Griyego sa likas na Filipino nang hindi pinahihina ang pahayag o nilulutas ang mas malawak na pagtatalong doktrinal.
- issue: Ipinahihiwatig na pandiwa sa ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: kung saan naroon din ang halimaw at ang huwad na propeta
  alternative: kung saan naroon din noon ang halimaw at ang huwad na propeta
  rationale: Dahil walang pandiwa ang sugnay sa Griyego, kailangan itong punan sa Filipino. Ang “naroon” ay umaayon sa konteksto at hindi naglilimita sa kanilang pagkanaroon sa nakaraan lamang.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “diyablo,” “halimaw,” at “huwad na propeta” bilang malinaw at nakaugaliang mga katawagan. Inilagay ang mga panandang talababa sa mga salitang talagang tinutukoy ng kani-kanilang paliwanag.
