revisions:
- from: At ang diyablo, na patuloy na dumadaya sa kanila, ay itinapon sa lawa ng apoy at asupre[a], kung saan naroon din ang halimaw at ang huwad na propeta; at pahihirapan sila araw at gabi magpakailanman[b].
  to: At ang diyablo, na nanlilinlang sa kanila, ay itinapon sa lawa ng apoy at asupre, kung saan naroon din ang halimaw at ang huwad na propeta; at pahihirapan silang araw at gabi magpakailanman[a].
  rationale: Pinalitan ang “dumadaya” ng “nanlilinlang” upang tumpak na maihatid ang πλανῶν. Inalis ang hindi kailangang talababa tungkol sa “azufre” at inilipat ang natitirang angkla upang tumugma sa “magpakailanman.” Hindi binago ang kahulugan, mga katawagan, o ang ipinahihiwatig na patuloy na pagkanaroon ng halimaw at huwad na propeta.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:05:03Z'
review_pass:
  verdict: revise
  source_fidelity: Kailangang baguhin ang “dumadaya,” na karaniwang tumutukoy sa pandaraya o cheating. Ang πλανῶν ay mas tumpak na “nanlilinlang” o “inililigaw.” Napananatili ng ibang bahagi ang pasibo ng ἐβλήθη at βασανισθήσονται, ang patuloy na presensiyang ipinahihiwatig sa ὅπου, at ang mariing tagal ng εἰς τοὺς αἰῶνας τῶν αἰώνων.
  naturalness: Mas natural at malinaw ang “na nanlilinlang sa kanila” kaysa “na patuloy na dumadaya sa kanila.” Ang “pahihirapan silang” ay mas maayos na pagkakaugnay sa tatlong tinutukoy na tauhan.
  terminology: Ang “diyablo,” “lawa ng apoy at asupre,” “halimaw,” at “huwad na propeta” ay angkop sa modernong Filipino Tagalog at sa rehistro ng Pahayag. Ang talababa tungkol sa “azufre” ay hindi kapaki-pakinabang na lexical alternative, sapagkat ang “asupre” mismo ang likas at karaniwang katumbas ng sulfur/brimstone sa Filipino.
  issues:
  - severity: medium
    issue: “dumadaya” para sa πλανῶν
    rationale: Ang “dumadaya” ay karaniwang nangangahulugang nandaraya sa laro o transaksiyon. Ang πλανάω rito ay “manlinlang” o “magligaw.”
  - severity: low
    issue: Talababa a ay nag-aalok ng “azufre” bilang tradisyonal na katawagan
    rationale: Ang “azufre” ay hindi likas na modernong Filipino at hindi nagbibigay ng makabuluhang alternatibong salin sa “asupre.” Mas mabuting alisin ang talababa at ang angkla nito.
