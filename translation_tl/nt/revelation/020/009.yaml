id: REV.20.9
reference: Revelation 20:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: tl
  text: At umakyat sila sa lawak ng lupa[a] at pinalibutan[b] ang kampo ng mga banal at ang minamahal na lungsod.[c] At bumaba mula sa langit ang apoy at nilamon sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ibabaw ng lawak ng lupa.” Tumutukoy ang pariralang Griyego sa isang napakalawak na sakop.
    reason: lexical_alternative
  - marker: b
    text: O “kinubkob.”
    reason: lexical_alternative
  - marker: c
    text: Hindi tahasang tinutukoy ng teksto kung alin ang “minamahal na lungsod.” Karaniwan itong inuunawa bilang Jerusalem o, sa mas malawak na diwa, ang lungsod ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: umakyat sila
  rationale: Pinananatili ang karaniwang diwa ng ἀναβαίνω na pag-akyat o pagsulong nang hindi tinutukoy ang heograpiya.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: sa malawak na lupain
  rationale: Natural na Filipino para sa paggalaw sa ibabaw ng malawak na saklaw ng γῆ; hindi idinaragdag ang mas tiyak na larawang 'kapatagan.'
- source_word: ἐκύκλευσαν
  choice: pinalibutan
  rationale: Malinaw at karaniwang katumbas ng pag-ikot sa paligid o pagkubkob.
- source_word: παρεμβολὴν
  choice: kampo
  rationale: Tumpak at maikli; pinananatili ang posibleng larawang militar nang hindi idinaragdag ang 'hukbo.'
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Karaniwang salin ng substantibong ἅγιοι at hindi nagpapasok ng denominasyonal na katawagan.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: ang minamahal na lungsod
  rationale: Pinananatili ang pasibong/resultatibong diwa ng ἠγαπημένην nang hindi tahasang tinutukoy kung sino ang umiibig o kung aling lungsod ito.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: bumaba mula sa langit ang apoy
  rationale: Direkta at natural na salin na nagpapanatili sa larawan at ayos na nakatuon sa pagbaba ng apoy.
- source_word: κατέφαγεν αὐτούς
  choice: nilamon sila
  rationale: Ang κατεσθίω ay literal na 'kumain nang lubos' at matalinghagang 'lumamon'; natural itong ginagamit sa Filipino kapag apoy ang simuno at ipinahihiwatig ang ganap na paglipol.
theological_decisions:
- issue: Ang tinutukoy ng “minamahal na lungsod”
  choice: Hindi pinangalanan ang lungsod sa pangunahing teksto.
  alternative: Jerusalem, o sa mas malawak na diwa, ang lungsod/bayan ng Diyos.
  rationale: Hindi tahasang tinutukoy ng Griyegong teksto ang lungsod; ang pagpapangalan dito ay magpapasya sa isang interpretasyong hindi isinasaad ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga banal” para sa intertekstuwal na pagkakapare-pareho, at iniwasang pangalanan ang lungsod o dagdagan ng tiyak na sistemang teolohikal ang larawan.
