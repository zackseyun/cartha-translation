  source_fidelity: Ang "lupain" ay maaaring tumukoy sa isang tiyak na pook o teritoryo, samantalang ang γῆ sa talatang ito ay mas angkop na "lupa/daigdig." Ang "lawak ng lupa" ay mas malapit sa πλάτος τῆς γῆς at hindi nagdaragdag ng ideya ng isang partikular na lupain o kapatagan. Napananatili ng iba pang mga parirala ang diwa ng Griyego, kabilang ang di-pinangalanang "minamahal na lungsod" at ang ganap na paglipol na ipinahihiwatig ng κατέφαγεν.
  naturalness: Ang binagong "sa lawak ng lupa" ay natural sa matayog ngunit makabagong rehistrong Filipino at iwas sa posibleng lokal o teritoryal na dating ng "malawak na lupain." Ang "pinalibutan," "kampo ng mga banal," "minamahal na lungsod," at "nilamon sila" ay malinaw at angkop sa salaysay.
  terminology: Ang "mga banal" ay angkop para sa τῶν ἁγίων at pinananatili ang gamit sa Bagong Tipan. Ang "minamahal na lungsod" ay hindi nagpapangalan ng referent o nagsusuplay ng umiibig. Ang "langit" para sa οὐρανός at "kampo" para sa παρεμβολή ay tumpak sa konteksto.
