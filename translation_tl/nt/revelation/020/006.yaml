id: REV.20.6
reference: Revelation 20:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: tl
  text: Mapalad at banal ang taong may bahagi sa unang pagkabuhay na muli. Walang kapangyarihan sa kanila ang ikalawang kamatayan, kundi magiging mga pari sila ng Diyos at ng Mesiyas,[a] at maghaharing kasama niya sa loob ng isang libong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego na Χριστός ay isinaling “Mesiyas” dito upang mapanatili ang gamit nito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Mapalad
  rationale: Likas na pananalita sa mga pahayag ng pagpapala sa Bibliya at ipinahihiwatig ang pinagpalang kalagayan, hindi lamang pansariling ligaya.
- source_word: ἅγιος
  choice: banal
  rationale: Tuwirang katumbas na sumasaklaw sa pagiging itinalaga sa Diyos at hindi lamang sa mabuting asal.
- source_word: ὁ ἔχων μέρος
  choice: ang taong may bahagi
  rationale: Natural sa modernong Tagalog at pinananatili ang isahang kinatawang anyo ng Griyego at ang diwa ng pakikibahagi.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: sa unang pagkabuhay na muli
  rationale: Malinaw at karaniwang salin ng pariralang tumutukoy sa unang muling pagkabuhay.
- source_word: ἐπὶ τούτων ... οὐκ ἔχει ἐξουσίαν
  choice: Walang kapangyarihan sa kanila
  rationale: Ipinahahayag ang awtoridad o saklaw ng kapamahalaan, habang ang 'sa kanila' ay malinaw na tumutukoy sa mga nakikibahagi sa unang pagkabuhay na muli.
- source_word: ὁ δεύτερος θάνατος
  choice: ang ikalawang kamatayan
  rationale: Pinananatili ang tahasang apokaliptikong katawagan ng teksto.
- source_word: ἱερεῖς
  choice: mga pari
  rationale: Tuwirang katawagan para sa mga pari at pinananatili ang imaheng pangsaserdote.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: ng Diyos at ng Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo; ang 'Mesiyas' ay nagpapanatili sa titular na diwa nito.
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: maghaharing kasama niya
  rationale: Natural na ipinahahayag ang pakikibahagi nila sa paghahari kasama ng Mesiyas.
- source_word: χίλια ἔτη
  choice: sa loob ng isang libong taon
  rationale: Malinaw na inilalahad ang tagal nang hindi nagpapasok ng partikular na sistemang pang-eskatolohiya.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay malinaw na titulo ang Χριστός sa pormal na pariralang 'ng Diyos at ng Mesiyas.' Pinananatili ng 'Mesiyas' ang kahulugang 'Pinahiran' at iniiwasang gawing waring personal na pangalan lamang.
- issue: Tagal ng paghahari
  choice: sa loob ng isang libong taon
  alternative: isang libong taon
  rationale: Pinananatili ang tahasang pahayag ng tagal ngunit hindi ipinapasiya kung paano ito dapat iugnay sa mas malawak na mga pananaw tungkol sa milenyo.
- issue: Saklaw ng ikalawang kamatayan
  choice: Walang kapangyarihan sa kanila ang ikalawang kamatayan
  alternative: Hindi sila saklaw ng kapangyarihan ng ikalawang kamatayan
  rationale: Malapit ito sa estruktura at legal-pamahalaang diwa ng Griyegong ἐξουσίαν nang hindi binabago ito tungo sa simpleng pisikal na lakas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga kinikilalang terminong biblikal na “pagkabuhay na muli,” “ikalawang kamatayan,” “mga pari,” at “maghahari,” habang iniwasan ang labis na arkaiko o denominasyonal na pananalita.
