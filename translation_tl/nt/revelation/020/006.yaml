  source_fidelity: Tumpak na naipapahayag ang μακάριος καὶ ἅγιος, ang pakikibahagi sa unang pagkabuhay na muli, ang kawalan ng ἐξουσία ng ikalawang kamatayan sa mga ito, ang pagiging mga pari ng Diyos at ng Mesiyas, at ang paghaharing kasama niya sa loob ng isang libong taon. Napananatili ang ugnayang isahan sa unang pangungusap at maramihan sa kasunod na pagtukoy.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Mapalad at banal,” “pagkabuhay na muli,” “ikalawang kamatayan,” at “maghaharing kasama niya” ay malinaw at angkop sa rehistrong biblikal. Ang “Walang kapangyarihan sa kanila” ay idiomatiko at sapat na naghahatid ng saklaw o awtoridad sa kontekstong ito.
  terminology: Ang “Mesiyas” ay wastong pagpapanatili ng titular na saysay ng Χριστός ayon sa audit trail; ang talababang “O ‘Cristo’” ay kapaki-pakinabang na alternatibong salin. Ang “mga pari” ay tuwirang katumbas ng ἱερεῖς at hindi nagpapasok ng dagdag na pagpapakahulugan.
