  source_fidelity: Tumpak na naihahatid ang pagkakasunod ng panahon sa Καὶ ὅταν, ang pagkumpleto ng tiyak na panahong τὰ χίλια ἔτη, ang hinaharap na pasibong λυθήσεται, at ang paglabas ni Satanas mula sa kanyang bilangguan. Ang “isang libong taon” ay likas na paraan sa Tagalog upang ipahayag ang eksaktong bilang, habang ang “ang” at ang konteksto ay nagpapanatili sa pagtukoy sa naunang nabanggit na panahon.
