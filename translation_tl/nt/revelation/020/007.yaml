id: REV.20.7
reference: Revelation 20:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: tl
  text: At kapag natapos na ang isang libong taon, pakakawalan si Satanas mula sa kanyang bilangguan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Ipinakikilala nito ang sugnay na tumutukoy sa tiyak na pangyayari sa hinaharap nang hindi nagdaragdag ng interpretasyon.
- source_word: τελεσθῇ
  choice: natapos na
  rationale: Likas sa modernong Tagalog at ipinapahayag ang pagkakumpleto ng itinakdang panahon; ang konteksto ang nagpapanatili sa pasibong diwa ng Griyego.
- source_word: τὰ χίλια ἔτη
  choice: ang isang libong taon
  rationale: Tumutukoy ito sa panahong nabanggit na sa konteksto. Kailangan sa natural na Tagalog ang “isang” sa tiyak na bilang na isang libo, samantalang ang “ang” ang naghuhudyat na tiyak ang tinutukoy na panahon.
- source_word: λυθήσεται
  choice: pakakawalan
  rationale: Malinaw na hinaharap at pasibo ang anyo, at hindi nito ipinahihiwatig na mabuti o nararapat ang pagpapalaya.
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Karaniwan at kinikilalang anyo ng pangalan sa Tagalog na Bibliya at pangkalahatang gamit.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: mula sa kanyang bilangguan
  rationale: Ang φυλακή ay tumutukoy rito sa lugar ng pagkakakulong; natural na ipinapahayag ng parirala ang paglabas mula roon at pinananatili ang panghalip na αὐτοῦ.
theological_decisions:
- issue: Kalikasan ng isang libong taon
  choice: Isinalin nang tuwiran bilang “ang isang libong taon,” nang hindi tinutukoy kung literal o simboliko ang panahon.
  alternative: Ipaliwanag ito bilang literal na sanlibong-taong paghahari o bilang simbolikong mahabang panahon.
  rationale: Binabanggit ng talata ang isang tiyak na panahon ngunit hindi nito pinagpapasyahan ang iba't ibang pananaw tungkol sa milenyo; pinananatili ng salin ang gayong bukas na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Ginamit ang “pakakawalan” sa halip na mas makaluma o di-likas na “kakalagan,” at iniwasan ang anumang paliwanag na pumapanig sa isang sistema ng interpretasyon tungkol sa milenyo.
