reference: Revelation 20:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: tl
  text: At sinunggaban niya ang dragon—ang sinaunang ahas[a], na siyang Diyablo at Satanas—at iginapos niya ito nang isang libong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang ahas noong unang panahon” o “ang ahas na iyon mula pa noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: sinunggaban
  rationale: Ipinahahayag ng pandiwa ang isang mariin at mapuwersang pagdakma; likas at matingkad sa makabagong Tagalog ang “sinunggaban.”
- source_word: δράκοντα
  choice: dragon
  rationale: Karaniwang katawagan sa makabagong Filipino para sa apokaliptikong nilalang at pinananatili nito ang larawang inuulit sa Pahayag.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ang matandang ahas
  rationale: Tuwirang appositional na pagkakakilanlan ito ng dragon. Likas sa Tagalog ang “matandang ahas,” habang itinatala sa talababa ang mga posibleng paraan ng pag-unawa sa pang-uri.
- source_word: Διάβολος
  choice: Diyablo
  rationale: Kinagawiang anyong Filipino ng titulo, ginamit bilang pantanging katawagan sa nilalang na tinutukoy.
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Kinagawiang transliterasyon sa Filipino ng pangalang-titulo.
- source_word: ἔδησεν
  choice: iginapos
  rationale: Pinananatili nito ang kongkretong larawan ng pagtali at hindi ipinapaliwanag nang higit sa sinasabi ng teksto ang uri ng pagpigil.
- source_word: χίλια ἔτη
  choice: nang isang libong taon
  rationale: Likas na ipinahahayag ng “nang” ang tagal ng pagkakagapos, habang tuwirang pinananatili ang bilang na isang libong taon.
theological_decisions:
- issue: Kalikasan ng isang libong taon
  choice: Isinalin nang tuwiran bilang “isang libong taon,” nang hindi tinutukoy kung literal o sagisag ang panahon.
  alternative: Unawain ito bilang literal na sanlibong taon o bilang simbolikong panahon.
  rationale: Hindi nilulutas ng salin ang pinagtatalunang millennial na pagbasa; pinananatili nito ang mismong pananalita at tensiyong teolohikal ng teksto.
- issue: Pagkakakilanlan ng dragon
  choice: 'Pinanatili ang buong hanay ng mga pagkakakilanlan: ang dragon, ang matandang ahas, ang Diyablo, at si Satanas.'
  alternative: Paliitin ang hanay sa iisang payak na katawagan.
  rationale: Hayagang ibinibigay ng talata ang lahat ng katawagang ito, kaya hindi dapat alisin o pagsama-samahin ang mga ito sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakagawiang katawagang “dragon,” “Diyablo,” at “Satanas,” at pinanatili ang matingkad na konkretong kilos ng pagsunggab at paggapos.
