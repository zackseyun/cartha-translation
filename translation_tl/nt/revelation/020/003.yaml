    issue: Malabo ang mga panghalip sa “itinapon niya ito ... tinatakan iyon sa ibabaw nito.”
    rationale: Ang “ito/nito” ay maaaring tumukoy sa dragon o sa kalaliman, samantalang malinaw sa Griyego na ang dragon ang inihagis at ang kalaliman ang isinara at tinatakan sa ibabaw niya.
  - severity: low
    issue: Hindi gaanong natural ang “nang maikling panahon.”
    rationale: Ang μικρὸν χρόνον ay tagal ng pagpapalaya; mas idiomatiko ang “sa maikling panahon.”
