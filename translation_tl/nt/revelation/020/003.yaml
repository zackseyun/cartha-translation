id: REV.20.3
reference: Revelation 20:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: tl
  text: At itinapon niya siya sa kalaliman[a], isinara ito at tinatakan sa ibabaw niya, upang hindi na niya linlangin ang mga bansa hanggang sa matapos ang isang libong taon. Pagkatapos nito, kailangan siyang pakawalan sa maikling panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bangin na walang ilalim.”
    reason: lexical_alternative
  - marker: b
    text: O “pakawalan sa sandaling panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: itinapon
  rationale: Pinananatili ang puwersa ng sapilitang paghahagis o paglalagay at natural sa makabagong Tagalog.
- source_word: ἄβυσσον
  choice: kalaliman
  rationale: Ang 'kalaliman' ay likas na salin ng apokaliptikong katawagang ἄβυσσος at hindi nagdaragdag ng ideyang tahasang 'walang ilalim.'
- source_word: ἔκλεισεν
  choice: isinara
  rationale: Tuwirang ipinapahayag ang pagsasara nang hindi nagdaragdag ng kandado na wala sa Griyego.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: tinatakan iyon sa ibabaw nito
  rationale: Ipinahihiwatig ng konteksto na ang kalaliman ay sinarhan at tinatakan sa ibabaw ng dragon; nililinaw ng mga panghalip ang ugnayang panlunan.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: upang hindi na nito linlangin ang mga bansa
  rationale: Ang 'linlangin' ay malinaw na katumbas ng πλανάω rito, samantalang ang 'hindi na' ay nagpapanatili sa puwersa ng ἔτι.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: hanggang sa matapos ang isang libong taon
  rationale: Natural na Tagalog para sa temporal na hangganan at pagkakumpleto; ang 'isang libong taon' ay hindi nagpapasya kung literal o simboliko ang panahon.
- source_word: μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Malapit sa pormal na Griyegong transisyon at angkop sa marangal na estilo ng Pahayag.
- source_word: δεῖ
  choice: kailangan
  rationale: Pinananatili ang diwa ng pangangailangan nang hindi ipinapaliwanag kung ito ay banal na pasiya o pangangailangang pampanitikan.
- source_word: λυθῆναι αὐτὸν
  choice: itong pakawalan
  rationale: Ang pasibong 'pakawalan' ay natural sa kasalukuyang Tagalog at malinaw na tumutukoy sa pagpapalaya mula sa pagkakagapos.
- source_word: μικρὸν χρόνον
  choice: nang maikling panahon
  rationale: Tuwirang ipinapahayag ang limitadong tagal.
theological_decisions:
- issue: Kalikasan ng isang libong taon
  choice: Isinalin nang tuwiran bilang 'isang libong taon' nang walang paliwanag sa pangunahing teksto.
  alternative: Unawain bilang literal na milenyo o bilang simbolikong mahabang panahon.
  rationale: Hindi nilulutas ng mismong talata ang pagtatalong eskatolohikal, kaya pinananatiling bukas ang dalawang pagbasa.
- issue: Puwersa ng δεῖ
  choice: Isinalin bilang 'kailangan.'
  alternative: Ipaliwanag bilang tahasang banal na atas o bilang simpleng di-maiiwasang takbo ng salaysay.
  rationale: Ipinahahayag ng Griyego ang pangangailangan ngunit hindi tinutukoy sa talata ang eksaktong uri o pinagmulan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ito/nito' para sa dragon upang maiwasan ang malabong kasariang gramatikal, habang ang 'iyon' ay tumutukoy sa kalaliman. Pinanatili ang apokaliptikong larawan at hindi nilutas ang usapin kung literal o simboliko ang isang libong taon.
