revisions:
- from: At itinapon niya ito sa kalaliman[a], saka isinara at tinatakan iyon sa ibabaw nito, upang hindi na nito linlangin ang mga bansa hanggang sa matapos ang isang libong taon. Pagkatapos ng mga bagay na ito, kailangan itong pakawalan nang maikling panahon.[b]
  to: At itinapon niya siya sa kalaliman[a], isinara ito at tinatakan sa ibabaw niya, upang hindi na niya linlangin ang mga bansa hanggang sa matapos ang isang libong taon. Pagkatapos nito, kailangan siyang pakawalan sa maikling panahon.[b]
