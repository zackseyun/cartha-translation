id: REV.12.8
reference: Revelation 12:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: tl
  text: Ngunit hindi sapat ang lakas niya[a], at wala nang natagpuang lugar para sa kanila sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi siya nanaig.” Ang pandiwang Griyego ay maaaring mangahulugang maging malakas, kayanin, o manaig.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ngunit
  rationale: Ginawang panalungat ang pang-ugnay dahil inilalahad nito ang kabaligtaran ng inaasahang bunga ng labanan sa naunang talata.
- source_word: οὐκ ἴσχυσεν
  choice: hindi sapat ang lakas niya
  rationale: Pinananatili ang diwa ng lakas o kakayahan ng ἰσχύω at ang isahang paksa na tumutukoy sa dragon; hindi nito tahasang nilulutas kung ang diin ay nasa lakas, kakayahan, o pananalo.
- source_word: οὐδὲ
  choice: at
  rationale: Likas sa Tagalog ang koordinasyong “at” kasunod ng negatibong unang sugnay; ang “wala na” ang malinaw na nagdadala ng negatibong diwa sa ikalawang sugnay.
- source_word: τόπος
  choice: lugar
  rationale: Tuwirang tumutukoy sa kinaroroonan o puwang sa makalangit na dako.
- source_word: εὑρέθη
  choice: natagpuang
  rationale: 'Pinananatili ang pasibong anyo at resultang diwa ng pandiwa: walang lugar na natagpuan para sa kanila.'
- source_word: αὐτῶν
  choice: para sa kanila
  rationale: Likas na salin ng genitibo sa konstruksiyong ito at tumutukoy sa dragon at sa kanyang mga anghel.
- source_word: ἔτι
  choice: nang
  rationale: Kasama ng “wala,” ipinahahayag ng “wala nang” na mula noon ay hindi na sila nagkaroon ng lugar doon.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Ang konteksto ay ang makalangit na dako, hindi lamang ang nakikitang himpapawid.
theological_decisions:
- issue: Ang tinutukoy ng isahang pandiwang ἴσχυσεν
  choice: Isahan ang tinutukoy—ang dragon—kaya “lakas niya” ang ginamit.
  alternative: 'Gawing maramihan: “hindi sapat ang lakas nila” o “hindi sila nanaig.”'
  rationale: Ang isahang pandiwa ay nagpapatuloy sa isahang paksang “dragon” sa naunang talata, samantalang ang “kanila” sa ikalawang sugnay ay tumutukoy sa dragon kasama ng kanyang mga anghel.
- issue: Saklaw ng kahulugan ng ἰσχύω
  choice: “hindi sapat ang lakas niya,” na inuuna ang diwa ng lakas ngunit hindi inaalis ang kaugnay na diwa ng kakayahan o pananalo.
  alternative: “hindi siya nanaig.”
  rationale: Maaaring mangahulugan ang pandiwa ng pagiging malakas, pagkakaroon ng kakayahan, o pananalo. Inilalagay sa talababa ang mahalagang alternatibo upang mapanatili ang leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang sobrang teknikal o denominasyonal na pananalita; pinanatili ang isahang pagtukoy sa dragon at ang pasibong “natagpuan” ng Griyego.
