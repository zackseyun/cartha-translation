id: REV.12.7
reference: Revelation 12:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: tl
  text: At sumiklab ang digmaan sa langit.[a] Nakipaglaban si Miguel at ang kanyang mga anghel sa dragon.[b] Lumaban din ang dragon at ang kanyang mga anghel,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkaroon ng digmaan” o “nagsimula ang digmaan sa langit.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas pormal: “si Miguel at ang kanyang mga anghel upang makipaglaban sa dragon.” Gumagamit ang Griyego ng articular infinitive upang ipahayag ang kilos o layunin.'
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “at lumaban ang dragon, at ang kanyang mga anghel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: sumiklab ang digmaan
  rationale: Likas sa makabagong Filipino ang pariralang ito para sa pagsisimula o paglitaw ng isang digmaan, at naipapahayag nito ang diwang ingressive ng γίνομαι + pangngalan.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Ang tinutukoy ay ang makalangit na dako, hindi lamang ang nakikitang himpapawid.
- source_word: Μιχαὴλ
  choice: Miguel
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino nang walang dagdag na pagpapakahulugan sa kanyang pagkakakilanlan o katungkulan.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: ang kanyang mga anghel
  rationale: Malinaw at natural na ipinahahayag ng paari ang ugnayan ng mga anghel kay Miguel at, sa ikalawang sugnay, sa dragon.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: nakipaglaban ... sa dragon
  rationale: Ginawang tahasang pandiwa sa Filipino ang siksik na konstruksyon ng articular infinitive. Sa konteksto ng digmaan, ang “sa dragon” ay malinaw na nagpapahiwatig ng kalaban, hindi ng kakampi.
- source_word: δράκοντος / δράκων
  choice: dragon
  rationale: Pinananatili nito ang apokaliptikong larawan at karaniwang katawagan sa makabagong Filipino.
- source_word: ἐπολέμησεν
  choice: lumaban din
  rationale: Isinasalin ang kilos ng dragon bilang pakikibahagi o pagtugon sa labanan. Ang “din” ay natural na nag-uugnay sa naunang pagkilos nang hindi labis na pinatitindi ang payak na ἐπολέμησεν.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: at ang kanyang mga anghel
  rationale: 'Pinananatili ang parallel na ayos: kapwa si Miguel at ang dragon ay may mga anghel na kasama nila.'
theological_decisions:
- issue: Pagkakakilanlan at katayuan ni Miguel
  choice: Pangalan lamang na “Miguel” ang ginamit, nang walang paliwanag sa teksto.
  alternative: Tawagin siyang arkanghel o iugnay siya kay Cristo.
  rationale: Pinangalanan siya ng talata ngunit hindi nito tinutukoy rito ang kanyang ranggo o ipinapantay siya kay Cristo. Iniiwasan ng salin ang pagpasok ng isang partikular na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sumiklab ang digmaan” bilang natural na idyoma, habang inilagay sa talababa ang mas pormal at mas literal na mga alternatibo. Hindi dinagdagan ang pangalan ni Miguel ng anumang titulong wala sa talata.
