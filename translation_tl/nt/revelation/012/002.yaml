  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: tl
  text: Buntis siya[a], at sumisigaw habang naghihilab[b] at pinahihirapan upang manganak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “may dinadala sa sinapupunan.”
    reason: lexical_alternative
  - marker: b
    text: O “dumaranas ng mga sakit sa panganganak.”
    reason: lexical_alternative
  - marker: c
    text: O “nasa matinding paghihirap upang manganak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: Buntis siya
  rationale: Likas at malinaw na modernong Tagalog para sa idyomang literal na nangangahulugang ‘may dinadala sa sinapupunan.’
- source_word: κράζει
  choice: sumisigaw
  rationale: Pinananatili ang masiglang kasalukuyang kilos ng pangitain at ang lakas ng pandiwa.
- source_word: ὠδίνουσα
  choice: habang dumaranas ng mga sakit sa panganganak
  rationale: Tahasang ipinahahayag ang kirot ng paghilab, hindi lamang ang pangkalahatang kalagayan ng panganganak.
- source_word: βασανιζομένη
  choice: matinding paghihirap
  rationale: Pinananatili ang matinding diwa ng pasibong participle, ngunit sa likas na pananalitang angkop sa konteksto ng panganganak.
- source_word: τεκεῖν
  choice: sa panganganak
  rationale: Natural na ipinahahayag sa Tagalog ang paghihirap na kaugnay ng nalalapit na pagsilang.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ang sunod-sunod at naiipong paglalarawan ng Griyego hangga’t natural sa Tagalog.
theological_decisions:
- issue: Tindi at uri ng pagdurusa ng babae sa pangitain
  choice: Isinalin nang mariin bilang ‘matinding paghihirap’ at hindi tinukoy kung sino ang sinasagisag ng babae.
  alternative: ‘naghihirap’ o ‘nasa matinding dalamhati’
  rationale: Mariin ang βασανιζομένη, ngunit hindi ipinapaliwanag ng talata ang simbolikong pagkakakilanlan ng babae o ang teolohikal na kahulugan ng kaniyang paghihirap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang lipas na ‘nagdadalang-tao’ bilang pangunahing anyo at ang sobrang literal ngunit di-likas na sintaks. Ang ‘matinding paghihirap’ ay nagpapanatili sa lakas ng βασανιζομένη nang hindi nagpapahiwatig ng panlabas na tagapagpahirap.
