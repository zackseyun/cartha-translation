  source_fidelity: Ang draft ay wastong naghahatid ng pagbubuntis, sigaw, paghilab, at tindi ng pagdurusa. Gayunman, ang huling pariralang “matinding paghihirap sa panganganak” ay hindi malinaw na naipapakita ang τεκεῖν bilang layon o kinalabasan (“upang manganak”), at inuulit nito ang “sa panganganak.”
  naturalness: Natural ang “Buntis siya” at “sumisigaw.” Mas malinaw at mas maayos sa modernong Tagalog ang magkaugnay na “naghihilab at pinahihirapan upang manganak,” na nagpapanatili sa dalawang participle at infinitive nang hindi paulit-ulit.
  terminology: Ang “naghihilab” ay angkop para sa ὠδίνουσα. Ang “pinahihirapan” ay mas tuwirang katumbas ng pasibong βασανιζομένη kaysa sa pangngalang “matinding paghihirap,” habang hindi ipinapalagay kung sino ang sanhi ng paghihirap. Walang pangalang pantangi o doktrinal na pagpapakahulugang dapat idagdag.
  issues:
