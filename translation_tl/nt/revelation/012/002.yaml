  - severity: low
    issue: Paulit-ulit ang “sa panganganak.”
    rationale: Nasa “mga sakit sa panganganak” na ang ideya ng labor pains; ang kasunod na “paghihirap sa panganganak” ay mabigat at hindi gaanong malinaw kaysa isang pariralang may “upang manganak.”}],
