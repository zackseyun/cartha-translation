id: REV.12.11
reference: Revelation 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: tl
  text: At dinaig nila siya[a] sa pamamagitan ng dugo ng Kordero at ng salita ng kanilang patotoo, at hindi nila minahal ang kanilang buhay[b], kahit kapalit nito ang kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagtagumpay laban sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “sarili” o “kaluluwa.” Ang salitang Griyego na psychē ay maaaring mangahulugang buhay, sarili, o kaluluwa; dito, ang konteksto ay ang pagsuko ng buhay sa harap ng kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: dinaig
  rationale: Tuwirang ipinapahayag ang tagumpay laban sa isang kalaban at pinananatili ang larawan ng tunggalian sa Pahayag.
- source_word: διὰ τὸ αἷμα
  choice: sa pamamagitan ng dugo
  rationale: 'Pinananatili ang posibleng instrumental na diwa ng διά: ang dugo ng Kordero ang paraang kaugnay ng kanilang pagtatagumpay, nang hindi nagdaragdag ng paliwanag na doktrinal.'
- source_word: ἀρνίου
  choice: Kordero
  rationale: Kinikilala ito bilang titulong kristolohikal sa Pahayag at pinananatili ang larawang sakripisyal at apokaliptiko.
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: salita ng kanilang patotoo
  rationale: Pinananatili ang kapuwa λόγος at μαρτυρία at ang ugnayan ng mga ito sa Griyego; maaaring tumukoy ang 'salita' sa mensaheng kanilang ipinahayag bilang mga saksi.
- source_word: οὐκ ἠγάπησαν
  choice: hindi nila minahal
  rationale: Pinananatili ang karaniwang kahulugan ng ἀγαπάω at iniiwasang palitan ito ng mas mapagpaliwanag na 'hindi nila pinanghawakan' o 'hindi nila pinahalagahan.'
- source_word: τὴν ψυχὴν αὐτῶν
  choice: kanilang buhay
  rationale: Sa konteksto ng pagkamartir at kamatayan, ang ψυχή ay likas na tumutukoy sa buhay na handa nilang isuko, hindi kinakailangang sa 'kaluluwa' bilang hiwalay sa katawan.
- source_word: ἄχρι θανάτου
  choice: maging hanggang sa kamatayan
  rationale: 'Pinananatili ang sukdulang hangganan ng kanilang hindi pag-iingat sa sariling buhay: hanggang kamatayan.'
theological_decisions:
- issue: Kung paano nauugnay ang dugo ng Kordero sa kanilang tagumpay
  choice: 'Isinalin bilang paraan o kasangkapan: ''sa pamamagitan ng dugo ng Kordero.'''
  alternative: 'Maaaring isaling sanhi: ''dahil sa dugo ng Kordero.'''
  rationale: Maaaring magpahayag ang διά na may accusative ng sanhi o batayan, samantalang sa konteksto ay malakas din ang instrumental na diwa. Pinili ang saling nagpapanatili sa dugo bilang batayan at paraan ng tagumpay nang hindi nagpapasok ng mas malawak na pormula tungkol sa pagtubos.
- issue: Kahulugan ng ψυχή sa konteksto ng pagkamartir
  choice: Isinalin bilang 'buhay.'
  alternative: Maaaring isaling 'kaluluwa' o 'sarili.'
  rationale: Ang kasunod na 'hanggang sa kamatayan' ay nagpapakitang ang buhay sa lupa ang pangunahing tinutukoy. Iniiwasan nito ang hindi hinihinging paghihiwalay ng katawan at kaluluwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'dinaig' para sa malinaw na larawan ng tagumpay, 'Kordero' bilang kinikilalang titulong biblikal, at bahagyang pormal na 'salita ng kanilang patotoo' upang mapanatili ang anyo at posibleng lawak ng kahulugan ng Griyego.
