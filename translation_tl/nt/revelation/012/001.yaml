id: REV.12.1
reference: Revelation 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: tl
  text: 'At lumitaw sa langit ang isang dakilang tanda: isang babaeng nakadamit ng araw, nasa ilalim ng kanyang mga paa ang buwan, at sa kanyang ulo ay may putong[a] ng labindalawang bituin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “korona” o “putong ng nagwagi.” Ang salitang Griyego na στέφανος ay naiiba sa maharlikang diadema.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Sa kontekstong apokaliptiko ng Pahayag, tumutukoy ito sa isang makabuluhan at simbolikong tanawin, hindi lamang sa isang himala.
- source_word: μέγα
  choice: dakila
  rationale: Ipinahahayag nito ang laki at kahalagahan ng tanda at angkop sa marangal na himig ng pangitain.
- source_word: ὤφθη
  choice: lumitaw
  rationale: Natural itong paglalarawan sa Filipino ng isang bagay na naging nakikita sa isang pangitain, bagaman pormal na pasibo ang anyong Griyego.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Maaaring tumukoy ang οὐρανός sa langit o kalawakan, ngunit higit na angkop ang “langit” sa pangitain sa Pahayag.
- source_word: γυνή
  choice: babae
  rationale: Hindi siya tahasang tinutukoy bilang asawa sa talata; ang payak na “babae” ay hindi nagdaragdag ng interpretasyon.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: nadaramtan ng araw
  rationale: Pinananatili nito ang larawan ng babaeng nababalutan o nakadamit ng araw sa natural at marangal na Filipino.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: nasa ilalim ng kanyang mga paa ang buwan
  rationale: Tuwirang pinananatili ang ayos ng larawan at ang ugnayang panlunan.
- source_word: στέφανος
  choice: putong
  rationale: Ang “putong” ay angkop sa wreath-like crown na tinutukoy ng στέφανος at naihihiwalay ito sa maharlikang diadema; nililinaw sa talababa ang mga alternatibo.
- source_word: ἀστέρων δώδεκα
  choice: ng labindalawang bituin
  rationale: Likas na katumbas ito ng konstruksiyong henitibo at hindi nito dinaragdagan ang simbolikong larawan.
theological_decisions:
- issue: Simbolikong pagkakakilanlan ng babae
  choice: Hindi tinukoy ang kanyang pagkakakilanlan; inilalarawan lamang siya bilang bahagi ng tanda sa pangitain.
  alternative: Maaaring ipakahulugan bilang Israel, si Maria, ang bayan ng Diyos, o ang iglesya.
  rationale: Hindi tahasang kinikilala ng talatang ito ang babae, kaya pinananatili ng salin ang pagiging bukas at tensiyong teolohikal ng simbolo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang matitingkad na larawang apokaliptiko nang hindi ipinapaliwanag sa pangunahing teksto ang simbolikong pagkakakilanlan ng babae.
