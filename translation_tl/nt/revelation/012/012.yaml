id: REV.12.12
reference: Revelation 12:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: tl
  text: Kaya magalak kayo, O mga langit, at kayong naninirahan sa mga ito! Sa aba ninyo, lupa[a] at dagat, sapagkat bumaba sa inyo ang diyablo na may matinding poot[b], dahil alam niyang kaunti na lamang ang panahong mayroon siya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupain.” Ang salitang Griyego ay maaaring tumukoy sa buong lupa o sa isang lupain; mas malawak ang dating ng “lupa” rito dahil sa kosmikong konteksto at sa pagkakatambal nito sa dagat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na may matinding galit.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mayroon siyang kaunting panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Maikli at likas na panandang naghahayag ng bunga o kongklusyon mula sa naunang tagumpay sa langit.
- source_word: εὐφραίνεσθε
  choice: magalak kayo
  rationale: Pinananatili ang pautos na anyo at ang panawagan sa masayang pagtugon.
- source_word: οἱ οὐρανοὶ
  choice: O mga langit
  rationale: Ang nominative ay ginagamit bilang tuwirang pagtawag; pinananatili rin ang maramihang anyo ng Griyego at ang marangal na himig.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: kayong naninirahan sa mga ito
  rationale: Ipinahahayag ang kahulugan ng σκηνόω bilang paninirahan nang hindi gumagamit ng literal ngunit di-likas na salitang tumutukoy sa tolda o tabernakulo.
- source_word: οὐαὶ
  choice: Sa aba ng
  rationale: Likas at kinikilalang pormula sa Filipino para sa babala ng kapahamakan o paghatol.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: ang lupa at ang dagat
  rationale: Ang 'lupa' ay natural na katumbas ng γῆ at, katambal ng 'dagat,' ay angkop sa malawak na saklaw ng pangitain habang nananatiling posible ang diwang 'lupain.'
- source_word: κατέβη
  choice: bumaba
  rationale: Tuwirang inilalarawan ang natapos na pagkilos mula sa langit patungo sa makalupang saklaw; malinaw sa konteksto ang kasalukuyang bunga nito.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Karaniwan at malinaw na titulong Filipino para sa διάβολος sa kontekstong ito.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Pinananatili ang kilos patungo sa kausap nang hindi idinaragdag ang tahasang 'laban sa,' sapagkat ang pagkapoot ay ipinahahayag na sa kasunod na parirala.
- source_word: ἔχων θυμὸν μέγαν
  choice: na may matinding poot
  rationale: Ang 'matinding poot' ay malinaw at marangal na paglalarawan ng sukdulang galit na ipinahihiwatig ng θυμός.
- source_word: εἰδὼς
  choice: dahil alam niyang
  rationale: Ginagawang malinaw sa natural na Filipino ang paliwanag na kaugnayan ng participle sa matinding poot ng diyablo.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: kaunti na lamang ang panahong mayroon siya
  rationale: 'Malapit sa kayarian at diwa ng Griyego: limitado at maikli ang natitirang panahon, nang hindi tinutukoy kung anong uri ng panahon iyon.'
theological_decisions:
- issue: Tinutukoy ng “inyo” sa “bumaba sa inyo ang diyablo”
  choice: Ang “inyo” ay tumutukoy sa makalupang saklaw na kinakatawan ng lupa at dagat, na siyang binabalaan.
  alternative: Maaaring ipalagay na nagpapatuloy ang pagtukoy sa mga langit at sa mga naninirahan doon.
  rationale: Ang pinakamalapit na nauunang tinutukoy ay “ang lupa at ang dagat,” at lumilikha ito ng malinaw na paghahambing sa pagitan ng kagalakan sa langit at ng kapanganibang nasa lupa, nang hindi nagdaragdag ng mga detalyeng wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang mataas na himig ng tuwirang pagtawag na “O mga langit” at ang propetikong pormulang “Sa aba,” ngunit iniwasan ang lipas o teknikal na pananalita.
