    text: Maaari rin itong mangahulugang “patotoo tungkol kay Jesus” o “patotoong ibinigay ni Jesus.” Maaaring unawain sa higit sa isang paraan ang genitive sa Griyego.
    reason: alternative_reading
  revision_rationale: Inayos ang pagtukoy sa «iba pa sa kanyang mga supling» upang malinaw na maipahayag ang «the rest of her offspring,» at pinalitan ang mas interpretatibong «nanghahawak sa» ng «may,» na mas malapit sa ἐχόντων. Inilipat ang pananda ng talababa sa pariralang may pinag-uusapang genitive. Pinananatili ang adversarial na «laban sa» bilang likas na Filipino sa konteksto ng pakikidigma at ang sinadyang kalabuan ng «patotoo ni Jesus.»
