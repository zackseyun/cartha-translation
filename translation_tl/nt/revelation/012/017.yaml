id: REV.12.17
reference: Revelation 12:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: tl
  text: At nagalit nang matindi ang dragon sa babae at umalis upang makipagdigma laban sa iba pa sa kanyang mga supling, yaong mga tumutupad sa mga utos ng Diyos at may patotoo ni Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin itong mangahulugang “patotoo tungkol kay Jesus” o “patotoong ibinigay ni Jesus.” Maaaring unawain sa higit sa isang paraan ang genitive sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: nagalit nang matindi
  rationale: Ipinapahayag ang pagkapoot na sumiklab sa aorist form at ang matinding galit sa kontekstong apokaliptiko, nang hindi lumalampas sa saklaw ng salita.
- source_word: δράκων
  choice: dragon
  rationale: Karaniwang makabagong salin na nagpapanatili sa simbolikong larawan at sa nauna nang tinukoy na nilalang sa kabanata.
- source_word: γυναικί
  choice: sa babae
  rationale: Tuwirang salin ng tiyak na babaeng naipakilala na sa konteksto.
- source_word: ἀπῆλθεν
  choice: umalis
  rationale: Natural at tuwirang Filipino para sa pag-alis o pagpunta mula sa kinaroroonan.
- source_word: ποιῆσαι πόλεμον
  choice: upang makipagdigma
  rationale: Likas na idyomang Filipino para sa layuning gumawa o magsagawa ng digmaan.
- source_word: μετὰ τῶν λοιπῶν
  choice: laban sa natitira
  rationale: Bagaman literal na 'kasama ng natitira' ang preposisyon, malinaw na adversarial ang kahulugan nito kasunod ng 'makipagdigma'; kailangan ang 'laban sa' sa natural na Filipino.
- source_word: τοῦ σπέρματος αὐτῆς
  choice: sa kanyang mga supling
  rationale: Pinananatili ng 'mga supling' ang larawang pampamilya ng σπέρμα nang hindi gumagamit ng masyadong literal na 'binhi' o nagpapakahulugan agad bilang isang tiyak na uri ng mga inapo.
- source_word: τηρούντων
  choice: tumutupad
  rationale: Ipinahihiwatig dito ang tapat na pagsunod at pagtalima sa mga utos; natural ito sa makabagong Filipino.
- source_word: τὰς ἐντολὰς τοῦ θεοῦ
  choice: mga utos ng Diyos
  rationale: Malinaw at dignidadong salin na nagpapanatili sa bigat ng banal na mga kautusan nang hindi nagiging lipas ang tunog.
- source_word: ἐχόντων
  choice: nanghahawak sa
  rationale: Sa kontekstong ito, ipinapahayag ang patuloy at matatag na pagkapit sa patotoo, hindi lamang simpleng pag-aari nito.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: patotoo ni Jesus
  rationale: Pinananatili hangga't maaari ang genitive na maaaring tumukoy sa patotoo tungkol kay Jesus o sa patotoong ibinigay ni Jesus; inililinaw sa talababa ang tunay na kalabuan.
theological_decisions:
- issue: Kahulugan ng genitive sa τὴν μαρτυρίαν Ἰησοῦ
  choice: patotoo ni Jesus
  alternative: patotoo tungkol kay Jesus; patotoong ibinigay ni Jesus
  rationale: Maaaring objective o subjective genitive ang Ἰησοῦ. Hindi pinipili ng pangunahing teksto ang isang pagbasa lamang; inilalahad sa talababa ang dalawang pangunahing posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na 'makipagdigma laban sa' sa halip na piliting tularan ang Griyegong preposisyon. Ang panandang [a] ay inilagay mismo pagkatapos ng pariralang tinatalakay ng talababa.
