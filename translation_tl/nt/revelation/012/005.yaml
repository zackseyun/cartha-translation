revisions:
- from: At nagsilang siya ng isang anak na lalaki, isang lalaking sanggol, na malapit nang magpastol[a] sa lahat ng bansa gamit ang tungkod na bakal; at ang kanyang anak ay inagaw paitaas, patungo sa Diyos at sa kanyang trono.
  to: At nagsilang siya ng isang anak na lalaki, isang batang lalaki, na nakatakdang magpastol[a] sa lahat ng bansa gamit ang tungkod na bakal; at ang kanyang anak ay inagaw tungo sa Diyos at tungo sa kanyang trono.
  rationale: Inayos ang salin ng μέλλει upang hindi lamang igiit ang agarang pagkalapit, pinalitan ang “lalaking sanggol” ng mas malawak at likas na “batang lalaki,” at pinasimple ang paglalarawan sa pag-agaw. Pinananatili ng rebisyon ang sadyang pagbibigay-diin sa kasariang lalaki, ang metapora ng pagpapastol, at ang paulit-ulit na paggalaw tungo sa Diyos at tungo sa kanyang trono.
