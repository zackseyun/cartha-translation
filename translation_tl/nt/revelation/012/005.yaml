id: REV.12.5
reference: Revelation 12:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: tl
  text: At nagsilang siya ng isang anak na lalaki, isang batang lalaki, na nakatakdang magpastol[a] sa lahat ng bansa gamit ang tungkod na bakal; at ang kanyang anak ay inagaw tungo sa Diyos at tungo sa kanyang trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamamahala sa lahat ng bansa gamit ang tungkod na bakal.” Literal na nangangahulugang “magpastol” ang pandiwang Griyego, ngunit umaalingawngaw rito ang Awit 2 at taglay nito ang diwa ng maharlikang pamamahala.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: nagsilang
  rationale: Likas at tuwirang salin ng konkretong larawan ng panganganak.
- source_word: υἱόν, ἄρσεν
  choice: isang anak na lalaki, isang lalaking sanggol
  rationale: Pinananatili ang sadyang pag-uulit at pagbibigay-diin sa kasariang lalaki sa Griyego, bagaman ginagawang malinaw at likas sa modernong Tagalog.
- source_word: μέλλει ποιμαίνειν
  choice: malapit nang magpastol
  rationale: Ipinakikita ang hinaharap na pagkilos at ang posibleng diwa ng pagiging nalalapit, nang hindi ito pinapantay lamang sa payak na panghinaharap.
- source_word: ποιμαίνειν
  choice: magpastol
  rationale: Pinananatili ang metapora ng ποιμαίνω sa halip na agad itong ipakahulugang 'mamamahala'; taglay ng konteksto ang maharlikang awtoridad.
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng bansa
  rationale: Tumutukoy sa mga bansa ng daigdig at malinaw na umaalingawngaw sa Awit 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: gamit ang tungkod na bakal
  rationale: Malinaw na ipinahahayag ang instrumental na gamit ng ἐν at pinananatili ang larawan mula sa Awit 2.
- source_word: ἡρπάσθη
  choice: inagaw paitaas
  rationale: Pinananatili ang biglaan at sapilitang pagkuha ng ἁρπάζω, pati ang paitaas na direksiyong malinaw sa konteksto.
- source_word: τὸ τέκνον αὐτῆς
  choice: ang kanyang anak
  rationale: Likas na salin ng mas pangkalahatang τέκνον at pinananatili ang pagkakaiba nito sa υἱός.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: patungo sa Diyos at sa kanyang trono
  rationale: Pinananatili ang pagkilos patungo kapwa sa Diyos at sa kanyang trono nang hindi nagiging mabigat ang Tagalog.
theological_decisions:
- issue: Ang mesiyanikong alusyon sa Awit 2 sa ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ
  choice: Pinanatili sa pangunahing teksto ang metapora ng pagpapastol.
  alternative: mamamahala sa lahat ng bansa gamit ang tungkod na bakal
  rationale: Bagaman ipinahihiwatig ng konteksto ang maharlikang pamamahala ng Mesiyas, ang mismong pandiwang Griyego ay nangangahulugang 'magpastol.' Inilalagay sa talababa ang posibleng pagpapakahulugang maharlika.
- issue: Ang puwersa ng μέλλει
  choice: malapit nang magpastol
  alternative: nakatalagang magpastol; magpapastol
  rationale: Ipinakikita nito ang aspektong nakaharap sa hinaharap at ang posibleng pagiging nalalapit ng pagkilos. Hindi lubos na nawawala ang tensiyon ng pahayag sa apokaliptikong konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang apokaliptikong larawan, ang sadyang pag-uulit sa paglalarawan sa batang lalaki, at ang metapora ng pagpapastol.
