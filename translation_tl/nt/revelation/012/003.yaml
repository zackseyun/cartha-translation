id: REV.12.3
reference: Revelation 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: tl
  text: At isa pang tanda ang lumitaw sa langit, at narito, isang malaking dragon na matingkad na pula,[a] na may pitong ulo at sampung sungay, at sa mga ulo niya ay may pitong diadema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pulang dragon.” Ang salitang Griyego na πυρρός ay tumutukoy sa matingkad na pulang kulay na gaya ng apoy.
    reason: lexical_alternative
  - marker: b
    text: O “mga korona.” Mas tiyak, “mga diadema” ang nasa Griyego—mga maharlikang pamigkis sa ulo, na naiiba sa koronang iginagawad sa nagwagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: lumitaw
  rationale: Sa salaysay ng pangitain, likas na ipinahahayag ng pasibong anyo ang paglitaw ng isang bagay sa paningin.
- source_word: ἄλλο σημεῖον
  choice: isa pang tanda
  rationale: Pinananatili ng 'tanda' ang diwa ng isang makasagisag na tanawin sa Pahayag nang hindi ito binibigyang-kahulugan.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Bagaman maaari ring mangahulugang kalangitan ang οὐρανός, ang 'langit' ang higit na angkop sa kosmikong tagpuan ng pangitain.
- source_word: ἰδοὺ
  choice: narito
  rationale: Ang 'narito' ay isang marangal at likas na panawag-pansin na nagpapanatili sa biglaang diin ng Griyego.
- source_word: δράκων μέγας πυρρός
  choice: isang malaking dragon na kulay-apoy
  rationale: Inilalarawan ng πυρρός ang mapulang kulay na gaya ng apoy; ang 'kulay-apoy' ay malinaw at matapat sa ugnayang leksikal nito sa apoy.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: na may pitong ulo at sampung sungay
  rationale: Likas sa modernong Tagalog ang 'na may' at ganap nitong napapanatili ang paglalarawan ng participle.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: sa mga ulo niya
  rationale: Ang 'niya' ay sumasalamin sa panlalaking reperensiya ng δράκων at sa personal na paglalarawan sa nilalang, nang hindi dinaragdagan ang kahulugan.
- source_word: ἑπτὰ διαδήματα
  choice: pitong diadema
  rationale: Ang διάδημα ay partikular na sagisag ng maharlikang kapangyarihan at naiiba sa στέφανος; pinananatili ng hiram na 'diadema' ang pagkakaibang ito.
theological_decisions:
- issue: Kulay na ipinahahayag ng πυρρός
  choice: kulay-apoy
  alternative: pula / mapulang gaya ng apoy
  rationale: Pinananatili ng 'kulay-apoy' ang matingkad at tunay na ugnayan ng salita sa apoy, ngunit hindi tinutukoy kung liwanag, init, o anumang simbolikong kahulugan ang nilalayon.
- issue: Panghalip na tumutukoy sa δράκων
  choice: niya
  alternative: nito
  rationale: Ang 'niya' ay nagpapanatili sa personal na puwersa ng panlalaking reperensiya sa Griyego, samantalang posible ngunit mas impersonal ang 'nito'.
- issue: Paglalarawan sa διάδημα
  choice: diadema
  alternative: korona
  rationale: Iniiwasan ng 'diadema' na pag-isahin ang διάδημα at στέφανος at pinananatili ang espesipikong maharlikang sagisag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang 'narito' upang mapanatili ang mataas na himig ng pangitain; iniwasan ang sobrang arkaikong ayos. Ang tutuldok pagkatapos ng 'langit' ay likas na nag-uugnay sa paglitaw ng tanda at sa mismong tanawin.
