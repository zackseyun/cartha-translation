  to: At ibinigay sa babae ang dalawang pakpak ng malaking agila, upang lumipad siya patungo sa ilang, sa kanyang lugar. Doon siya inaalagaan sa loob ng isang panahon, mga panahon, at kalahati ng isang panahon, malayo sa presensya ng ahas.
  rationale: 'Inalis ang di-tahasang ideya ng pagkakatalaga sa “kanyang lugar,” pinalitan ang maaaring makitid na “pinakakain” ng “inaalagaan,” at pinakinis ang huling parirala para sa natural na modernong Filipino. Walang footnote ang kailangan: ang di-tiyak na pormula ng panahon ay malinaw na napananatili sa teksto, at walang kailangang ipaliwanag upang maunawaan ang salin.'
