id: REV.12.14
reference: Revelation 12:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: tl
  text: At ibinigay sa babae ang dalawang pakpak ng malaking agila, upang lumipad siya patungo sa ilang, sa kanyang lugar. Doon siya inaalagaan sa loob ng isang panahon, mga panahon, at kalahati ng isang panahon, malayo sa presensya ng ahas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: ang dalawang pakpak ng malaking agila
  rationale: Pinananatili ang tiyak at simbolikong larawan ng Griyego, pati ang 'dalawang' pakpak at ang paglalarawan sa agila bilang malaki.
- source_word: ἔρημον
  choice: ilang
  rationale: Natural at dignified na terminong biblikal para sa isang tiwangwang o di-tinitirhang pook; hindi nito nililimitahan ang kahulugan sa mabuhanging disyerto.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: sa lugar na inilaan para sa kanya
  rationale: Ipinahihiwatig ng 'kanyang lugar' sa konteksto ang nakatalagang pook; ang salin ay ginawang natural sa Tagalog nang hindi tinutukoy kung sino ang naglaan nito.
- source_word: ὅπου τρέφεται ἐκεῖ
  choice: Doon siya pinakakain
  rationale: Ang present passive na τρέφεται ay isinaling 'pinakakain,' na nagpapanatili sa di-tinukoy na tagapaglaan. Ang 'Doon' ay kumakatawan sa locative emphasis ng ὅπου...ἐκεῖ nang hindi inuulit nang alanganin sa Tagalog.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: isang panahon, mga panahon, at kalahati ng isang panahon
  rationale: Pinananatili ang kakaiba at sadyang hindi tuwirang pormula ng pinagmulan sa halip na tahasang gawing 'tatlo't kalahating taon.'
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: malayo sa harapan ng ahas
  rationale: Pinananatili ang matalinghagang 'mula sa harapan/presensiya' ng Griyego at ang ideya ng pagkakalayo o pag-iingat mula sa ahas.
theological_decisions:
- issue: Haba ng 'isang panahon, mga panahon, at kalahati ng isang panahon'
  choice: Pinanatili ang simbolikong pormula nang hindi kinuwenta.
  alternative: Tatlo't kalahating taon
  rationale: Hindi tahasang sinasabi ng talata na 'mga taon'; ang literal na pormula ay mahalaga sa apokaliptikong ugnayan nito sa Daniel at nagpapanatili ng tunay na interpretatibong tensiyon.
- issue: Tagapagpakain sa babae
  choice: Gumamit ng balintiyak na 'pinakakain' nang hindi pinangalanan ang gumagawa.
  alternative: Pinakakain siya ng Diyos
  rationale: Balintiyak ang Griyego at hindi tahasang pinangalanan ang tagapagpakain sa mismong talata; hindi dapat idagdag sa pangunahing teksto ang isang teolohikal na pagpapaliwanag.
- issue: Pagkakakilanlan ng babae, agila, at ahas
  choice: Hindi ipinaliwanag sa salin ang simbolikong pagkakakilanlan ng babae o agila; pinanatili ang 'ahas.'
  alternative: Magdagdag ng interpretatibong katawagan gaya ng Israel, Iglesia, o diyablo
  rationale: Ang pagsasalin ng talata ay hindi dapat magpasya sa mga pinagtatalunang detalye na hindi tahasang nakasaad rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'ilang' at 'ahas' bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o sobrang teknikal na pananalita. Walang footnote dahil walang tekstuwal o leksikal na suliraning nangangailangan ng paliwanag para sa talatang ito.
