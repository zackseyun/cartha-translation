id: REV.12.6
reference: Revelation 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: tl
  text: At tumakas ang babae patungo sa ilang, kung saan mayroon siyang lugar na inihanda ng Diyos, upang doon ay alagaan nila siya sa loob ng isang libo dalawang daan at animnapung araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang doon siya alagaan sa loob ng isang libo dalawang daan at animnapung araw.” Ang Griyego ay gumagamit ng pandiwang ikatlong panauhang maramihan na walang tinukoy na simuno; literal, “upang doon ay alagaan nila siya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: tumakas
  rationale: Ipinahahayag ng aorist ng φεύγω ang mabilis na paglayo upang makaiwas sa panganib; natural at malinaw sa makabagong Tagalog ang “tumakas.”
- source_word: ἔρημον
  choice: ilang
  rationale: Saklaw ng ἔρημος ang ilang o ilang na pook, hindi lamang mabuhanging disyerto. Pinananatili ng “ilang” ang malawak na biblikal na diwa nang hindi labis na tinutukoy ang anyo ng lupain.
- source_word: τόπον
  choice: isang lugar
  rationale: Tuwirang katumbas ito ng τόπος at pinananatili ang di-tiyak na anyo.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: inihanda ng Diyos
  rationale: Ipinahihiwatig ng perfect passive participle na naihanda na ang lugar, at ang ἀπό ay tumutukoy sa Diyos bilang gumawa.
- source_word: ἔχει ἐκεῖ
  choice: mayroon siyang isang lugar ... doon
  rationale: Inayos ang pagkakasunod para maging natural sa Tagalog habang nananatili ang lokatibong diin ng ἐκεῖ sa sugnay.
- source_word: ἵνα
  choice: upang
  rationale: Natural na ipinahahayag ng “upang” ang layunin ng ἵνα.
- source_word: τρέφωσιν αὐτὴν
  choice: alagaan nila siya
  rationale: Ang τρέφω ay maaaring mangahulugang pakainin o sustentuhan. Masaklaw at natural ang “alagaan” para sa patuloy na paglalaan, at pinananatili ng “nila” ang ikatlong panauhang maramihan na walang tinukoy na simuno.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: sa loob ng isang libo dalawang daan at animnapung araw
  rationale: Malinaw na ipinahahayag ang akusatibong haba ng panahon at pinananatiling nakasulat sa salita ang bilang.
theological_decisions:
- issue: Hindi tinukoy na simuno ng τρέφωσιν
  choice: 'Pinanatili ang aktibong ikatlong panauhang maramihan: “alagaan nila siya.”'
  alternative: “alagaan siya roon” o “doon siya aalagaan”
  rationale: Walang hayagang simuno ang pandiwang Griyego. Hindi dapat tukuyin ang Diyos o ibang tagapag-alaga; ang “nila” ay nagpapanatili sa tunay na kawalang-tiyak ng teksto.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Tagalog. Ginamit ang “ilang” bilang karaniwang terminong biblikal at ang “alagaan” upang saklawin ang pagpapakain at patuloy na pagkalinga nang hindi tinutukoy kung sino ang gumagawa nito.
