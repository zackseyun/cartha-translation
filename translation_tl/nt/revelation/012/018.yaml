  text: And he stood on the sand of the sea[a].
translation:
  language: tl
  text: At tumayo siya sa buhangin sa tabi ng dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito sa ilang manuskrito: “At tumayo ako sa buhangin sa tabi ng dagat.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa naunang salaysay.
- source_word: ἐστάθη
  choice: tumayo siya
  rationale: Ang anyong aorist na passive sa anyo ngunit intransitibo sa gamit ay nangangahulugang ‘tumayo.’ Batay sa ikatlong panauhang anyo at sa konteksto, ang paksa ay natural na tumutukoy sa dragon sa naunang talata.
- source_word: ἐπὶ
  choice: sa
  rationale: Kasama ng pariralang tumutukoy sa buhanginan, natural nitong ipinapahayag ang kinalalagyan kung saan siya tumayo.
- source_word: τὴν ἄμμον
  choice: buhanginan
  rationale: Pinananatili nito ang tiyak na larawan ng buhangin habang mas natural sa makabagong Tagalog kaysa sa literal na ‘buhangin ng dagat.’
- source_word: τῆς θαλάσσης
  choice: sa tabing-dagat
  rationale: Natural na Tagalog para sa genitibong pariralang naglalarawan sa buhangin na nasa baybay ng dagat, nang hindi ginagawang malabo ang tagpuan.
theological_decisions:
- issue: Pagkakakilanlan ng paksa at tekstuwal na anyo ng pandiwa
  choice: 'Sinusunod ng pangunahing teksto ang ikatlong panauhang ἐστάθη: “tumayo siya,” na sa konteksto ay tumutukoy sa dragon.'
  alternative: “At tumayo ako sa buhanginan sa tabing-dagat.”
  rationale: Ikatlong panauhan ang nakalimbag sa SBLGNT, ngunit may mahalagang tradisyong manuskrito na gumagamit ng unang panauhang ἐστάθην. Pinananatili ang alternatibo sa talababa sa halip na tahimik na lutasin ang tekstuwal na pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “buhanginan sa tabing-dagat” upang maging natural sa ordinaryong mambabasa habang pinananatili ang larawan ng buhangin at dagat.
