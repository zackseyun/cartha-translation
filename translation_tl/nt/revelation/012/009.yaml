id: REV.12.9
reference: Revelation 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: tl
  text: At inihagis ang malaking dragon—ang sinaunang ahas[a], ang tinatawag na Diyablo at Satanas, na nanlilinlang sa buong sanlibutan[b]. Inihagis siya sa lupa[c], at ang kanyang mga anghel ay inihagis na kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sinaunang ahas” ay umaalingawngaw sa larawan ng ahas sa Genesis 3.
    reason: cross_reference
  - marker: b
    text: O “na inililigaw ang buong daigdig na tinatahanan.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang isinaling “lupa” ay maaari ring mangahulugang “lupain”; dito, ang pagkakahagis mula sa langit patungo sa lupa ang ipinahihiwatig ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: inihagis / inihagis
  rationale: Ipinahihiwatig ng pasibong anyo ang sapilitang pagpapaalis. Pinananatili ng pag-uulit ng “inihagis” ang mariing pag-uulit ng pandiwa sa Griyego; malinaw na sa konteksto ang direksiyong pababa.
- source_word: δράκων ὁ μέγας
  choice: ang malaking dragon
  rationale: Ang “dragon” ang tuwirang makabagong katumbas at pinananatili nito ang simbolikong larawan sa Apocalipsis.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: ang matandang ahas
  rationale: Natural sa kasalukuyang Filipino ang “matandang ahas” at naipapahayag nito ang sinaunang pag-iral, habang ang talababa ay nililinaw ang alusyon sa Genesis 3.
- source_word: ὁ καλούμενος
  choice: ang tinatawag na
  rationale: Natural na panandang nagpapakilala sa mga kasunod na pangalan o titulo.
- source_word: Διάβολος
  choice: Diyablo
  rationale: Dito ay kinikilalang pangalan o titulo ito, kaya ginamit ang nakaugaliang anyong Filipino sa halip na isalin bilang “maninirang-puri.”
- source_word: Σατανᾶς
  choice: Satanas
  rationale: Ginamit ang pamantayang anyong Filipino ng pangalan o titulo.
- source_word: ὁ πλανῶν
  choice: na dumadaya
  rationale: Saklaw ng πλανάω ang pandaraya at pag-akay sa maling landas. Maikli at natural ang “dumadaya,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: τὴν οἰκουμένην ὅλην
  choice: sa buong sanlibutan
  rationale: Naipahahayag ng “buong sanlibutan” ang pandaigdig at apokaliptikong saklaw ng parirala nang hindi nililimitahan ito sa isang lupain.
- source_word: εἰς τὴν γῆν
  choice: sa lupa
  rationale: Sa konteksto, ang γῆ ay ang makalupang dako na kasalungat ng langit; natural dito ang “sa lupa.”
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: ang kanyang mga anghel
  rationale: Mga makalangit na nilalang ang tinutukoy sa apokaliptikong konteksto, hindi karaniwang mga sugo.
- source_word: μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Tuwirang ipinapahayag ang pagsama ng kanyang mga anghel sa kanyang pagkakahagis.
theological_decisions:
- issue: Pagkakahanay ng Διάβολος at Σατανᾶς bilang mga katawagan sa dragon
  choice: ang tinatawag na Diyablo at Satanas
  alternative: ang tinatawag na Diyablo at ang Kalaban
  rationale: Pinananatili ang dalawang nakikilalang pangalan o titulo bilang magkahanay na pagkakakilanlan ng dragon, nang walang idinadagdag na paliwanag na doktrinal.
- issue: Saklaw ng οἰκουμένη
  choice: buong sanlibutan
  alternative: buong daigdig na tinatahanan
  rationale: Pinananatili nito ang malawak na saklaw ng pahayag sa kontekstong apokaliptiko, samantalang kinikilala sa talababa ang mas literal na diwa ng tinatahanang daigdig.
- issue: Kahulugan ng γῆ
  choice: lupa
  alternative: lupain
  rationale: Mas angkop ang “lupa” sa kaibahan ng langit at ng makalupang dako rito, ngunit hindi nito dinaragdagan ang teksto ng isang detalyadong kosmolohiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong ulit na “inihagis” upang tumbasan ang retorikal na pag-uulit sa Griyego. Ginamit ang “sanlibutan” bilang pamilyar na biblikal ngunit nauunawaang katawagan sa buong mundo.
