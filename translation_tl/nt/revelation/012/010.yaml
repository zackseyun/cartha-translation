id: REV.12.10
reference: Revelation 12:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: tl
  text: At narinig ko ang isang malakas na tinig sa langit na nagsasabi, “Dumating na ngayon ang kaligtasan, ang kapangyarihan, at ang kaharian ng ating Diyos, at ang awtoridad ng kanyang Mesiyas[a], sapagkat itinapon na ang tagapag-akusa sa ating mga kapatid[b]—siya na nag-aakusa sa kanila sa harap ng ating Diyos araw at gabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong Χριστός (Christos) ay isang titulong nangangahulugang ang Pinahiran ng Diyos.
    reason: alternative_reading
  - marker: b
    text: Ang “mga kapatid” ay maaaring tumukoy sa kapwa mananampalataya bilang isang kabuuan, kabilang ang mga babae at mga lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: isang malakas na tinig
  rationale: Sa pariralang ito, ang μεγάλην ay tumutukoy sa lakas ng tinig; natural at malinaw sa modernong Tagalog ang “malakas na tinig.”
- source_word: Ἄρτι ἐγένετο
  choice: Dumating na ngayon
  rationale: Ipinahahayag nito ang mapagpasyang pagsapit o pagkakatatag sa kasalukuyang sandali. Pinananatili ng “ngayon” ang Ἄρτι at ng “dumating na” ang resultative na diin ng ἐγένετο.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: ang kaligtasan, ang kapangyarihan, at ang kaharian
  rationale: Pinananatili ang magkakahiwalay na mga artikulo at ang maringal na serye ng Griyego, habang natural ang ayos sa Tagalog.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: ang kaharian ng ating Diyos
  rationale: Ang βασιλεία ay maaaring tumukoy sa paghahari o kaharian. Ang “kaharian” ay natural sa apokaliptikong konteksto at hindi inaalis ang ideya ng makaharing pamamahala.
- source_word: ἡ ἐξουσία
  choice: ang awtoridad
  rationale: Ipinakikita ng ἐξουσία ang lehitimong karapatang mamahala, na naiiba sa δύναμις, “kapangyarihan.”
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: ng kanyang Mesiyas
  rationale: Ang Χριστός ay gumaganap dito bilang titulo ng pinahiran ng Diyos; ang “Mesiyas” ay nagpapanatili sa titulong kahulugan nito sa natural na modernong Tagalog.
- source_word: ἐβλήθη
  choice: itinapon na
  rationale: Ang pasibong anyo ay naglalarawan ng marahas na pagpapaalis o paghahagis pababa. Sa konteksto ng talata, malinaw na ang pagpapaalis mula sa langit ang tinutukoy.
- source_word: ὁ κατήγωρ
  choice: ang tagapag-akusa
  rationale: Ang bihirang pangngalan ay tumutukoy sa nagdadala ng paratang. Ang “tagapag-akusa” ay malinaw at pinananatili ang hudisyal na larawan.
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Natural na idyomang Tagalog ito para sa tuluy-tuloy na pag-akusa at malapit sa anyo ng orihinal.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito, ang salita ay titulo sa pariralang “kanyang Χριστός,” hindi lamang pangalang pantangi. Inilalantad ng “Mesiyas” ang kahulugang “Pinahiran” nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Saklaw ng ἀδελφῶν
  choice: mga kapatid
  alternative: mga kapatid na lalaki
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, maaaring kolektibong tumukoy ito sa kapulungan ng mga mananampalataya. Ang karaniwang Tagalog na “mga kapatid” ay likas na hindi nagtatakda ng kasarian at pinananatili ang posibleng malawak na saklaw.
- issue: Kahulugan ng βασιλεία
  choice: kaharian
  alternative: paghahari
  rationale: Kapwa posible ang saklaw na kaharian at makaharing pamamahala. Pinili ang “kaharian” dahil akma ito sa apokaliptikong rehistro, habang hindi ipinipilit na purong teritoryo lamang ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tinig,” “Mesiyas,” at “tagapag-akusa” upang mapanatili ang apokaliptiko at hudisyal na himig. Ang em dash ay nagpapakitang ang huling parirala ay muling pagkilala at paglalarawan sa tagapag-akusa.
