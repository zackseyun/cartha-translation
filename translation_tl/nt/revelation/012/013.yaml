id: REV.12.13
reference: Revelation 12:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: tl
  text: Nang makita ng dragon na inihagis siya sa lupa, hinabol[a] niya ang babaeng nagsilang sa anak na lalaki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inusig.” Ang pandiwang Griego ay maaaring tumukoy kapuwa sa paghabol at pag-uusig; malamang na kapuwa naroroon dito ang mapoot na paghabol at pang-uusig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang lalaki.” Idinagdag ang “anak” para sa likas na diwa sa Filipino; ihambing ang pananalita sa nakapaligid na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: dragon
  rationale: Tuwirang pinananatili ang apokaliptikong larawan ng δράκων; hindi ito pinapalitan ng “ahas,” bagaman ganoon din siya nakikilala sa konteksto.
- source_word: ἐβλήθη
  choice: inihagis siya
  rationale: Ipinapahayag ng aorist passive ang marahas na pagpapabagsak o pagpapaalis. Nilinaw ng “siya” ang likas na pakahulugan sa Filipino nang hindi binabago ang tinutukoy.
- source_word: εἰς τὴν γῆν
  choice: sa lupa
  rationale: Sa kosmikong konteksto ng Pahayag, ang γῆ ay ang lupa o daigdig bilang kabaligtaran ng langit. Natural sa Filipino ang “inihagis ... sa lupa.”
- source_word: ἐδίωξεν
  choice: hinabol
  rationale: Maaaring mangahulugan ang διώκω ng aktuwal na paghabol o pag-uusig. Ang “hinabol” ang pinakakonkreto sa salaysay, habang inilalahad sa talababa ang saklaw na “inusig.”
- source_word: γυναῖκα
  choice: babae
  rationale: Karaniwang katumbas ng γυνή at hindi nito ipinapasok sa salin ang alinman sa magkakaibang pagpapakahulugan sa simbolikong pagkakakilanlan niya.
- source_word: ἥτις
  choice: ang babaeng
  rationale: Likas na naiuugnay sa Filipino sa pamamagitan ng pang-angkop na “-ng,” na gumaganap bilang payak na sugnay na “na siyang.”
- source_word: ἔτεκεν
  choice: nagsilang sa
  rationale: Natural at marangal na katumbas ng “nagbigay-kapanganakan” o “nanganak,” at malinaw na tumutukoy sa naunang pangyayari.
- source_word: τὸν ἄρσενα
  choice: sanggol na lalaki
  rationale: Literal na “ang lalaki.” Ipinagkakaloob ng konteksto ang ipinahihiwatig na sanggol o anak; pinananatili ng “na lalaki” ang tahasang diin sa kasarian.
theological_decisions:
- issue: Simbolikong pagkakakilanlan ng babae at ng sanggol na lalaki
  choice: Pinanatili ang mga larawan bilang “babae” at “sanggol na lalaki” nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin ang babae bilang si Maria, Israel, o bayan ng Diyos/iglesia, at tukuyin nang higit pa ang sanggol.
  rationale: Hindi tahasang nilulutas ng talata ang simbolikong pagkakakilanlan ng babae. Pinananatili ng salin ang tunay na interpretatibong pag-igting at iniiwasang magpasok ng denominasyonal na pagbasa.
- issue: Saklaw ng διώκω
  choice: “hinabol” sa teksto, na may “inusig” bilang alternatibo sa talababa
  alternative: “inusig” lamang sa pangunahing teksto
  rationale: Ang salaysay ay nagpapahiwatig ng konkretong mapoot na paghabol, ngunit taglay rin ng pandiwa ang diwa ng pag-uusig. Hindi dapat lubusang alisin ang alinmang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dragon,” na karaniwan at madaling maunawaan sa kasalukuyang Tagalog, upang panatilihin ang natatanging apokaliptikong larawan. Inilagay ang bawat pananda ng talababa kaagad pagkatapos ng salitang o pariralang tinutukoy nito.
