id: REV.12.16
reference: Revelation 12:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: tl
  text: 'At tinulungan ng lupa[a] ang babae: ibinuka ng lupa ang bibig nito at nilamon ang ilog na ibinuga[b] ng dragon mula sa bibig nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupain” o “daigdig.” Ang salitang Griyego na γῆ ay maaaring mangahulugang “lupa,” “lupain,” o “daigdig.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “itinapon” o “inilabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: tinulungan
  rationale: Tuwirang ipinapahayag ang payak na kilos ng pagtulong o pagsaklolo, nang walang dagdag na pagpapakahulugan.
- source_word: ἡ γῆ
  choice: ang lupa
  rationale: Ang γῆ ay maaaring tumukoy sa lupa, lupain, o daigdig. Ang “lupa” ay likas sa Filipino at napapanatili ang larawang bumubuka ang lupa upang lumamon.
- source_word: τῇ γυναικί
  choice: ang babae
  rationale: Tuwirang salin na nagpapanatili sa simbolikong tauhan nang hindi ipinapaliwanag ang kaniyang pagkakakilanlan.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: ibinuka ng lupa ang bibig nito
  rationale: Pinananatili ang pagsasatao sa lupa. Ang “nito” ay natural na panghalip para sa lupa sa makabagong Filipino.
- source_word: κατέπιεν
  choice: nilamon
  rationale: Malinaw at masiglang katumbas ng paglulon, na angkop sa matinding larawang apokaliptiko.
- source_word: τὸν ποταμόν
  choice: ang ilog
  rationale: Tuwirang katumbas ng ποταμός; hindi ito pinalitan ng “baha” upang maiwasan ang interpretatibong pagpapalawak.
- source_word: ὃν ἔβαλεν
  choice: na ibinuga
  rationale: Sa konteksto ng paglabas ng ilog mula sa bibig, natural na inilalarawan ng “ibinuga” ang marahas na pagpapalabas. Nilalagyan ng talababa ang mas pormal na alternatibong “itinapon” o “inilabas.”
- source_word: ὁ δράκων
  choice: ang dragon
  rationale: Karaniwang makabagong Filipino para sa apokaliptikong nilalang na δράκων.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: mula sa bibig nito
  rationale: Tuwirang salin ng pinagmulan ng ilog. Ang “nito” ay angkop sa di-taong tinutukoy at malinaw na bumabalik sa dragon.
theological_decisions:
- issue: Pagsasatao sa lupa sa larawang apokaliptiko
  choice: Panatilihin ang lupa bilang kumikilos, bumubuka ang bibig, at lumalamon.
  alternative: Ipaliwanag ang lupa bilang isang sambayanan, teritoryo, o paraan ng pagliligtas ng Diyos.
  rationale: Hindi nilulutas ng talata ang simbolismo ng lupa. Dapat panatilihin ng salin ang matingkad na larawan at ang likas na teolohikal na pag-igting nito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinananatili ang paulit-ulit na “lupa” at ang pagsasatao rito, habang ginagamit ang tutuldok upang natural na iugnay ang pagtulong ng lupa sa sumunod nitong kilos.
