  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: tl
  text: Naghagis ang ahas ng tubig na parang ilog mula sa bibig nito sa likuran ng babae[a], upang ipaanod siya ng ilog[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habol sa babae.” Ang Griyego ay maaaring tumukoy sa kinalalagyan sa likuran o sa paghabol sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang gawin siyang dala ng ilog.” Ang bihirang salitang Griyego ay tumutukoy sa pagkaanod o pagkatangay ng ilog.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: nagbuga
  rationale: Ang βασικό na diwa ng βάλλω ay maghagis o magpalabas, ngunit dahil mula sa bibig ang tubig, mas natural at matingkad sa Tagalog ang “nagbuga” nang hindi binabago ang marahas na larawan.
- source_word: ὁ ὄφις
  choice: ang ahas
  rationale: Karaniwang salin ng ὄφις ang “ahas”; malinaw rin nitong napapanatili ang simbolikong ugnayan sa mas naunang paglalarawan sa nilalang.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: mula sa bibig nito
  rationale: Tuwirang ipinapahayag ang pinagmulan ng tubig. Ang “nito” ay natural sa Tagalog para sa hayop at hindi kailangang magtakda ng kasariang gramatikal.
- source_word: ὀπίσω τῆς γυναικός
  choice: sa likuran ng babae
  rationale: Pinananatili nito ang lantad na kahulugang panlunan ng ὀπίσω; ang posibleng diwang paghabol o pag-atake ay itinatala sa talababa.
- source_word: ὕδωρ ὡς ποταμόν
  choice: tubig na parang ilog
  rationale: Pinananatili ang paghahambing na ipinahihiwatig ng ὡς at ang tiyak na larawan ng ποταμός bilang ilog, sa halip na ipakahulugang baha.
- source_word: ἵνα
  choice: upang
  rationale: Natural at malinaw na nagpapahayag ng layunin, habang hindi lubusang isinasara ang posibleng bahid ng kinalabasan.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: ipaanod siya ng ilog
  rationale: Natural na causative sa Tagalog para sa bihirang tambalang nangangahulugang gawing tangay o dala ng ilog. Hindi nito idinaragdag na nalunod o namatay ang babae.
theological_decisions:
- issue: Simboliko at apokaliptikong larawan ng pag-atake ng ahas
  choice: Panatilihin sa teksto ang literal na larawan ng tubig na parang ilog at ng babaeng ipinaanod nito.
  alternative: Tukuyin ang tubig bilang mga hukbo, pag-uusig, kasinungalingan, o kaguluhan.
  rationale: Hindi tahasang ipinaliliwanag ng talata ang simbolo. Ang pagsasalin ay hindi dapat magpasok ng isang partikular na pakahulugang teolohikal sa pangunahing teksto.
- issue: Layunin o kinalabasan ng ἵνα
  choice: Isalin bilang “upang,” na pangunahing nagpapahayag ng layunin ng ahas.
  alternative: Isalin bilang isang tiyak na kinalabasan, gaya ng “kaya ipinaanod niya.”
  rationale: Ang konteksto ng sinasadyang pag-atake ay pumapabor sa layunin, ngunit hindi sinasabing nagtagumpay ang pagtatangka.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagbuga” at “ipaanod” bilang likas na pananalita habang pinananatili ang kakaiba at marahas na larawang apokaliptiko. Ang mga talababa ay nagpapanatili sa tunay na leksikal na kalabuan nang hindi pinapabigat ang pangunahing teksto.
