  naturalness: Ang binagong ayos na “Naghagis ang ahas ng tubig na parang ilog mula sa bibig nito” ay mas idiomatiko kaysa sa paghihiwalay ng “ng tubig” pagkatapos ng pariralang “mula sa bibig nito.” Ang wika ay nananatiling makabago at marangal.
