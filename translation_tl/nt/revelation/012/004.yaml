id: REV.12.4
reference: Revelation 12:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: tl
  text: At kinakaladkad ng buntot nito ang ikatlong bahagi ng mga bituin sa langit at inihagis ang mga ito sa lupa. At ang dragon ay nakatayo sa harap ng babaeng malapit nang manganak, upang lamunin nito ang kaniyang anak kapag maisilang niya ang kaniyang anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: kinaladkad
  rationale: Ang pandiwa ay nasa pangkasalukuyang anyo sa Griyego ngunit nasa loob ng pangitaing isinasalaysay; natural sa Tagalog ang aspektong naganap, at ipinahihiwatig ng salita ang pagkaladkad o paghila.
- source_word: τὸ τρίτον
  choice: ang ikatlong bahagi
  rationale: Malinaw at likas na katumbas ng isang-katlo nang hindi ipinapalagay na eksaktong bilang ng mga bituin ang diin.
- source_word: ἔβαλεν
  choice: inihagis
  rationale: Pinananatili ang naganap na kilos at ang puwersa ng pagbagsak sa lupa.
- source_word: ἕστηκεν
  choice: Tumayo
  rationale: Isinasalin ang resultang kalagayan ng perfect bilang pagkakatayo o pagpuwesto ng dragon sa harap ng babae.
- source_word: μελλούσης τεκεῖν
  choice: malapit nang manganak
  rationale: Natural na Tagalog para sa babaeng nakatakdang o handa nang magsilang.
- source_word: καταφάγῃ
  choice: lamunin
  rationale: Masidhi at angkop sa larawan ng dragon; tumutukoy sa ganap na paglamon.
theological_decisions:
- issue: Pagkakakilanlan ng mga bituin
  choice: Pinanatiling literal na “mga bituin”
  alternative: Ipaliwanag ang mga ito bilang mga anghel o ibang espirituwal na nilalang
  rationale: Hindi tahasang binibigyang-kahulugan ng talata ang simbolo, kaya hindi ito nilutas sa salin.
- issue: Pagkakasunod ng mga panahunan/aspekto
  choice: Ginamit ang aspektong naganap sa “kinaladkad” at “inihagis”
  alternative: “Kinakaladkad ... at inihagis” upang tularan ang pagbabago ng panahunan sa Griyego
  rationale: Mas natural at malinaw sa salaysay na Tagalog habang hindi binabago ang ugnayan ng mga kilos; hindi itinuring na tiyak na teolohikal na pahiwatig ang pagbabago ng panahunan.
- issue: Layunin ng dragon
  choice: “upang lamunin”
  alternative: “nang sa gayon ay malamon”
  rationale: Tuwirang pinananatili ang layuning ipinahahayag ng ἵνα at ang dragon bilang gumagawa ng kilos.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “dragon,” ang karaniwang katawagang biblikal sa nilalang, at iniwasan ang dagdag na interpretasyon sa simbolismo.
