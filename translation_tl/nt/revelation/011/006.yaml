  to: Ang mga ito ay may awtoridad na isara ang langit upang hindi umulan sa mga araw ng kanilang pagpopropesiya,[a] at may awtoridad sila sa mga tubig upang gawing dugo ang mga ito at hampasin ang daigdig sa pamamagitan ng anumang salot, gaano man kadalas nilang naisin.
  rationale: Inayos ang temporal na pagpapahayag ng προφητεία upang maging mas tuwiran at likas, inalis ang hindi kinakailangang dagdag na “uri” sa paglalarawan ng salot, at ginawang “daigdig” ang γῆ upang maging malinaw ang saklaw. Napanatili ang awtoridad, ang tuwirang himalang paglalarawan, ang paulit-ulit na diwa ng ὁσάκις ἐὰν θελήσωσιν, at ang talababa tungkol sa οὐρανός.
