id: REV.11.6
reference: Revelation 11:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: tl
  text: Ang mga ito ay may awtoridad na isara ang langit upang hindi umulan sa mga araw ng kanilang pagpopropesiya,[a] at may awtoridad sila sa mga tubig upang gawing dugo ang mga ito at hampasin ang daigdig sa pamamagitan ng anumang salot, gaano man kadalas nilang naisin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isara ang kalangitan.” Ang Griyegong οὐρανός ay maaaring mangahulugang “langit” o “kalangitan”; ang konteksto rito ay tungkol sa pagpigil sa ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Ang mga ito
  rationale: Pinananatili ang demonstratibo nang hindi idinaragdag ang “dalawa,” sapagkat bagaman dalawang saksi ang tinutukoy sa konteksto, hindi ito inuulit sa mismong talata.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinahihiwatig nito ang ipinagkaloob na karapatan o saklaw ng pagkilos, hindi lamang likas na kakayahan o kapangyarihan.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: isara ang langit
  rationale: Natural at marangal sa Tagalog ang tradisyonal na larawang “isara ang langit”; sa konteksto, tumutukoy ito sa pagpigil sa ulan. Nananatili sa talababa ang posibleng “kalangitan.”
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: upang hindi umulan
  rationale: Likas na Tagalog na nagpapahayag ng layunin o bunga ng pagsasara sa langit nang hindi pilit na inuulit ang magkaugnay na pangngalan at pandiwa sa Griyego.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: sa mga araw ng kanilang pagpapahayag bilang propeta
  rationale: Ginagawang malinaw na ang προφητεία rito ay ang panahon ng kanilang gawaing propetiko, hindi lamang isang mensahe o hula.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: sa mga tubig
  rationale: Kasama ng “may awtoridad,” ipinahahayag nito ang saklaw ng kanilang awtoridad at pinananatili ang pangmaramihang anyo ng Griyego.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: na gawing dugo ang mga iyon
  rationale: Direkta at natural na inilalarawan ang pagbabago ng mga tubig tungo sa dugo.
- source_word: πατάξαι τὴν γῆν
  choice: hampasin ang lupa
  rationale: Ang “hampasin” ay buhay ngunit hindi lipas na katumbas ng πατάσσω; ang “lupa” ay natural na tumutukoy sa daigdig sa kontekstong ito.
- source_word: ἐν πάσῃ πληγῇ
  choice: ng bawat uri ng salot
  rationale: Instrumental ang ἐν, at ang “bawat uri ng salot” ay natural na distributibong pagpapahayag sa Tagalog nang hindi nagtatakda ng isang saradong talaan.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: gaano man kadalas nilang naisin
  rationale: Pinananatili ang paulit-ulit at contingent na diwa ng konstruksiyon at ang marangal na tono.
theological_decisions:
- issue: Mga pahiwatig na nag-uugnay sa dalawang saksi sa mga himala nina Elias at Moises
  choice: Panatilihin ang mga gawang mahimala sa tuwiran at hindi pinababawasang pananalita.
  alternative: Ipaliwanag sa salin na simboliko lamang ang mga pagkilos.
  rationale: Inilalahad ng talata ang mga ito bilang awtoridad na ipinagkaloob sa mga saksi. Hindi dapat pagpasiyahan ng salin kung literal, simboliko, o kapwa ang apokaliptikong larawan.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “awtoridad” upang idiin ang ipinagkaloob na karapatan; iniwasan ang mga salitang labis na arkaiko at hindi ipinaliwanag sa mismong salin kung literal o simboliko ang apokaliptikong larawan.
