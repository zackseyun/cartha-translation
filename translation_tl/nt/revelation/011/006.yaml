  verdict: revise
  source_fidelity: 'Ang salin ay tumpak sa pangunahing kahulugan: ang mga saksi ay may ipinagkaloob na awtoridad na pigilin ang ulan, gawing dugo ang mga tubig, at hampasin ang daigdig ng mga salot nang paulit-ulit ayon sa kanilang nais. Gayunman, ang “bawat uri ng salot” ay nagdaragdag ng “uri,” na wala sa πάσῃ πληγῇ; mas malapit ang “anumang salot.”'
  naturalness: Marangal at malinaw ang karamihan ng pangungusap. Mas likas at tuwiran sa modernong Tagalog ang “sa mga araw ng kanilang pagpopropesiya” kaysa “sa mga araw ng kanilang pagpapahayag bilang propeta,” na medyo mahaba at maaaring magmukhang paglalarawan ng tungkulin sa halip na ng kanilang gawaing propetiko. Ang “daigdig” ay mas malinaw kaysa “lupa” para sa kosmikong saklaw ng τὴν γῆν sa kontekstong ito.
  terminology: Ang “awtoridad” ay angkop para sa ἐξουσίαν. Ang “langit,” na may talababa para sa “kalangitan,” ay makatuwirang panatilihin ang leksikal na kalabuan ng οὐρανός habang ipinapakita ng konteksto ang kaugnayan sa ulan. Ang “pagpopropesiya” ay karaniwang modernong relihiyosong Tagalog at malinaw na katumbas ng προφητεία sa ganitong konteksto.
  issues:
  - severity: medium
    issue: Ang “pagpapahayag bilang propeta” ay hindi ang pinakamalinaw na katumbas ng τῆς προφητείας αὐτῶν.
    rationale: Maaaring tumukoy ito sa pagpapahayag sa pangkalahatan o sa katayuang propeta. Ang “pagpopropesiya” ay tuwirang tumutukoy sa gawaing propetiko at nananatiling temporal sa pariralang “sa mga araw.”
  - severity: medium
    issue: Ang “bawat uri ng salot” ay may dagdag na ideyang “uri.”
    rationale: Ang ἐν πάσῃ πληγῇ ay “sa/sa pamamagitan ng bawat salot” o idiomatikong “sa anumang salot”; hindi tahasang inuuri ang mga salot.
  - severity: low
    issue: Ang “lupa” ay maaaring marinig bilang lupang tinatapakan o lupain.
    rationale: Bagaman posible ang “lupa” para sa γῆ, ang “daigdig” ay mas malinaw para sa saklaw na “earth” sa apokaliptikong pahayag.
  revised_text: Ang mga ito ay may awtoridad na isara ang langit upang hindi umulan sa mga araw ng kanilang pagpopropesiya,[a] at may awtoridad sila sa mga tubig upang gawing dugo ang mga ito at hampasin ang daigdig sa pamamagitan ng anumang salot, gaano man kadalas nilang naisin.
