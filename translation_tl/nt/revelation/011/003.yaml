id: REV.11.3
reference: Revelation 11:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: tl
  text: At bibigyan ko ang dalawa kong saksi[a], at magpopropesiya sila sa loob ng 1,260 araw, na nakasuot ng damit na sako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na salin: “At magbibigay ako sa dalawa kong saksi.” Hindi sinabi sa Griyego kung ano ang ibibigay; malamang na tinutukoy ang kakayahan o atas na magpropesiya.'
    reason: lexical_alternative
  - marker: b
    text: Ang damit na sako ay iniuugnay sa pagluluksa, pagsisisi, at panaghoy na propetiko.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: pagkakalooban ko
  rationale: Pinananatili nito ang diwa ng ‘magbibigay/magkakaloob’ at hindi tahasang dinaragdagan ng ‘kapangyarihan’ o ‘awtoridad,’ sapagkat walang binanggit na tuwirang layon sa Griyego. Sadyang ipinauunawa sa talababa ang di-karaniwang pagkakabuo.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: ang dalawa kong saksi
  rationale: Likas na ayos sa modernong Filipino at pinananatili ang patotoo o testimonial na diwa ng μάρτυς.
- source_word: προφητεύσουσιν
  choice: magpopropesiya sila
  rationale: Tuwiran at matatag na katumbas ng pandiwang προφητεύω; hindi nito nililimitahan ang gawain sa paghula lamang o dinaragdagan ang nilalaman ng kanilang mensahe.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: sa loob ng 1,260 araw
  rationale: Natural na pagpapahayag sa Filipino ng akusatibong nagsasaad ng haba ng panahon.
- source_word: περιβεβλημένοι σάκκους
  choice: na nakasuot ng damit na sako
  rationale: Ipinapakita ang patuloy na kalagayan ng pagiging nakadamit at pinananatili ang kongkretong larawang propetiko ng sackcloth sa halip na isalin agad ang kahulugan nito.
theological_decisions:
- issue: Hindi binanggit na layon ng δώσω
  choice: Hindi dinagdagan ng ‘kapangyarihan’ o ‘awtoridad’ ang pangunahing teksto; ginamit ang ‘pagkakalooban ko’ at ipinaliwanag ang kakulangan ng tahasang layon sa talababa.
  alternative: Bibigyan ko ng kapangyarihan ang dalawa kong saksi
  rationale: Walang tahasang layon ang δώσω sa Griyego. Ipinahihiwatig ng kasunod na sugnay ang isang kaloob o atas na may kaugnayan sa pagpopropesiya, ngunit ang paglalagay ng ‘kapangyarihan’ sa teksto ay magpapasya sa isang bagay na iniwang di-tiyak ng pinagmulan.
- issue: Simbolikong kahulugan ng σάκκους
  choice: Pinanatili sa pangunahing teksto ang larawang ‘damit na sako.’
  alternative: nakasuot ng damit ng pagluluksa
  rationale: May kaugnayan ang damit na sako sa pagluluksa, pagsisisi, at panaghoy ng propeta, ngunit larawan ang ibinigay ng teksto at hindi ang tahasang interpretasyon nito.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang pamilyar na terminong biblikal na ‘magpopropesiya’ at ang malinaw na larawang ‘damit na sako.’ Pinanatili ang tunay na sintaktikong di-katiyakan ng Griyego sa halip na tahasang idagdag ang ‘kapangyarihan.’
