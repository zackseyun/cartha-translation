  to: At bibigyan ko ang dalawa kong saksi[a], at magpopropesiya sila sa loob ng 1,260 araw, na nakasuot ng damit na sako.[b]
  rationale: Pinalitan ang “pagkakalooban ko” ng “bibiryan ko” upang maging mas natural ang Filipino habang pinananatili ang hindi binanggit na layon ng δώσω. Inayos din ang pananalita ng talababa upang hindi ito magmungkahi ng isang partikular na propeta. Walang idinagdag na interpretasyong doktrinal sa pangunahing teksto.
