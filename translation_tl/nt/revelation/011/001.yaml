id: REV.11.1
reference: Revelation 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: tl
  text: At binigyan ako ng isang tambo na parang tungkod. May nagsabi, “Tumayo ka at sukatin mo ang templo[a] ng Diyos, ang altar, at ang mga sumasamba sa loob nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo ng Diyos.” Ang salitang Griyego na ναός ay maaaring tumukoy nang mas tiyak sa panloob na santuwaryo, hindi sa buong nasasakupan ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: binigyan ako
  rationale: Pinananatili ng balintiyak na anyo ang pokus sa bagay na ibinigay at hindi tinutukoy kung sino ang nagbigay.
- source_word: κάλαμος
  choice: tambo
  rationale: Ito ang payak na kahulugan ng salita; hindi ito isinaling ‘panukat’ upang hindi isama agad ang pahiwatig mula sa utos na sumukat.
- source_word: ὅμοιος ῥάβδῳ
  choice: parang tungkod
  rationale: Natural na paghahambing ito sa modernong Tagalog at pinananatili ang pagkakaiba ng tambo at tungkod.
- source_word: λέγων
  choice: May nagsabi
  rationale: Hindi tahasang tinutukoy ng Griyego ang nagsasalita. Ang di-tiyak na ‘may’ ay natural sa Tagalog at hindi nagpapakilala ng anghel, tinig, o ibang partikular na tagapagsalita.
- source_word: Ἔγειρε
  choice: Tumayo ka
  rationale: Direkta at natural na pautos sa modernong Tagalog, na angkop sa pagkilos sa pangitain.
- source_word: μέτρησον
  choice: sukatin mo
  rationale: Payak at tuwirang katumbas ng pautos na sukatin.
- source_word: ναὸν τοῦ θεοῦ
  choice: templo ng Diyos
  rationale: Karaniwan at malinaw na salin; inilalagay sa talababa ang posibilidad na mas tiyak itong tumukoy sa santuwaryo o panloob na bahagi ng templo.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Ito ang karaniwang salin at hindi nito ipinapalagay kung aling uri ng altar ang tinutukoy.
- source_word: τοὺς προσκυνοῦντας
  choice: ang mga sumasamba
  rationale: Pinananatili ang kilos na ipinahahayag ng substantibong participle habang natural sa Tagalog.
- source_word: ἐν αὐτῷ
  choice: sa loob nito
  rationale: Malinaw na inilalahad ang lokatibong diwa at likas na iniuugnay ang panghalip sa templo.
theological_decisions:
- issue: Tinutukoy ng ναός sa kontekstong apokaliptiko
  choice: templo ng Diyos
  alternative: santuwaryo ng Diyos
  rationale: Hindi nilulutas ng talata kung literal na templong panlupa, santuwaryong makalangit, o simbolikong bayan ng Diyos ang nasa pangitain; kaya hindi isinasama sa salin ang isang tiyak na eskatolohikong pagbasa.
- issue: Pagkakakilanlan ng nagsasalita sa λέγων
  choice: iniwang di-tiyak sa ‘May nagsabi’
  alternative: ‘sinabi ng isang anghel’ o ‘may tinig na nagsabi’
  rationale: Walang tahasang tagapagsalita sa tekstong Griyego, kaya hindi nagdaragdag ng anghel, tinig, o ibang pagkakakilanlan.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang ‘parang’ bilang likas na paghahambing at ang ‘May nagsabi’ upang maiwasan ang alanganing anyong maaaring magpahiwatig na ang tambo mismo ang nagsasalita.
