id: REV.11.8
reference: Revelation 11:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: tl
  text: At ang bangkay nilang dalawa ay nasa malapad na lansangan ng dakilang lungsod, na sa espirituwal na diwa ay tinatawag na Sodoma at Ehipto[a], kung saan ipinako rin sa krus ang kanilang Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na sa patalinghagang diwa ay tinatawag na Sodoma at Ehipto.”
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang “kung saan ipinako rin sa krus ang kanilang Panginoon” ay tumutukoy sa Jerusalem, bagaman pinananatili ng teksto ang simbolikong katawagang “dakilang lungsod.”
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: ang bangkay nilang dalawa
  rationale: Ang πτῶμα ay nasa isahan bagaman tumutukoy ang αὐτῶν sa dalawang saksi. Pinananatili ng isahang “bangkay” ang kolektibong paglalarawan ng Griyego, habang nililinaw ng “nilang dalawa” ang maramihang tinutukoy.
- source_word: ἐπὶ τῆς πλατείας
  choice: nasa malapad na lansangan
  rationale: Maaaring tumukoy ang πλατεῖα sa malapad na lansangan o liwasang pampubliko. Ang “malapad na lansangan” ay malapit sa leksikal na larawan at natural sa konteksto ng lungsod.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: ng dakilang lungsod
  rationale: Pinananatili ang mahalagang apokaliptikong katawagang “dakilang lungsod,” sa halip na gawing “malaking lungsod” lamang.
- source_word: πνευματικῶς
  choice: sa espirituwal na diwa
  rationale: Tuwirang pinananatili ang espirituwal na elemento ng adverbio habang ipinahihiwatig na paraan ito ng pagtawag o pagkilala, hindi literal na pangalan.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodoma at Ehipto
  rationale: Ginagamit ang nakasanayang makabagong anyong Filipino ng mga pangalang biblikal.
- source_word: ὅπου καὶ
  choice: kung saan ... rin
  rationale: Pinananatili ng “kung saan” ang lokatibong diwa at ng “rin” ang pandagdag na καί.
- source_word: ὁ κύριος αὐτῶν
  choice: ang kanilang Panginoon
  rationale: Ang “Panginoon” ang angkop at teolohikal na may-bigat na salin ng κύριος sa kontekstong ito.
- source_word: ἐσταυρώθη
  choice: ipinako ... sa krus
  rationale: Karaniwan, malinaw, at tumpak na saling Filipino ng aorist passive na σταυρόω.
theological_decisions:
- issue: Isahang πτῶμα na may maramihang tinutukoy
  choice: Panatilihin ang isahang “bangkay” at idagdag ang “nilang dalawa.”
  alternative: “ang kanilang mga bangkay”
  rationale: Pinananatili nito ang retorikal na kolektibong isahan ng Griyego nang hindi ikinalilito na dalawang saksi ang tinutukoy.
- issue: Kahulugan ng πνευματικῶς
  choice: “sa espirituwal na diwa” sa pangunahing teksto
  alternative: “sa patalinghagang diwa”
  rationale: Hindi nililimitahan ang salita sa isang purong pampanitikang tayutay; pinananatili ang espirituwal at simbolikong tensiyon ng orihinal.
- issue: Pagkakakilanlan ng “dakilang lungsod”
  choice: Huwag tahasang pangalanang Jerusalem sa pangunahing teksto.
  alternative: Idagdag ang “Jerusalem” bilang paliwanag sa teksto.
  rationale: Malakas na ipinahihiwatig ng pagpapako sa Panginoon ang Jerusalem, ngunit sadyang pinananatili ng teksto ang apokaliptikong katawagang “dakilang lungsod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “bangkay” bilang natural at mariing katumbas ng πτῶμα; iniwasan ang sobrang teknikal o makalumang pananalita. Ang lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
