id: REV.11.16
reference: Revelation 11:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: tl
  text: At ang dalawampu't apat na matatanda, na nakaupo sa harap ng Diyos sa kanilang mga trono, ay nagpatirapa at sumamba sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: ang dalawampu't apat na matatanda
  rationale: Sa Pahayag, ang πρεσβύτεροι ay mga kilalang tauhan sa makalangit na kapulungan, hindi lamang matatandang lalaki. Ang “mga matatanda” ang malinaw at nakaugaliang salin sa modernong Tagalog.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Ipinahahayag ng ἐνώπιον ang kanilang kinalalagyan at presensiya sa harap ng Diyos; natural at marangal sa Tagalog ang pariralang ito.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: nakaupo sa kani-kanilang trono
  rationale: Inilalarawan ng participle ang nagpapatuloy nilang posisyon. Ang “kani-kanilang” ay likas na Tagalog para sa distributibong diwa ng αὐτῶν kaugnay ng maramihang mga trono.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: nagpatirapa
  rationale: Ang parirala ay idyoma ng lubos na pagyukod na nakadapa ang mukha. Tumpak at natural na ipinahahayag ng “nagpatirapa” ang pisikal na kilos nang hindi inuulit nang mabigat ang “mga mukha nila.”
- source_word: προσεκύνησαν τῷ θεῷ
  choice: sumamba sa Diyos
  rationale: Dahil Diyos ang tahasang layon sa tagpong ito sa silid ng trono, malinaw na relihiyosong pagsamba ang diwa ng προσκυνέω, hindi lamang pagyukod o pagbibigay-galang.
theological_decisions:
- issue: Diwa ng προσκυνέω sa makalangit na tagpo ng pagsamba
  choice: sumamba
  alternative: yumukod; nagbigay-galang
  rationale: Ang tahasang layon ay ang Diyos at ang tagpo ay makalangit na pagsamba. Pinananatili ng “sumamba” ang buong relihiyosong bigat ng pandiwa nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “matatanda” bilang nakaugaliang katawagan sa mga elder ng Pahayag, at “nagpatirapa” upang malinaw ngunit hindi labis na literal na ilarawan ang kanilang buong-katawang pagpupugay.
