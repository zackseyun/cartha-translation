id: REV.11.7
reference: Revelation 11:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: tl
  text: Kapag natapos na nila ang kanilang pagpapatotoo, ang halimaw na umaahon mula sa kalaliman ay makikipagdigma sa kanila[a], dadaigin sila, at papatayin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magdidigma laban sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τελέσωσιν
  choice: natapos na nila
  rationale: 'Ipinahahayag ng aorist subjunctive kasunod ng ὅταν ang isang pangyayaring inaasahang magaganap: “kapag natapos na nila.” Likas ito sa modernong Tagalog at ipinakikitang lubos nilang magagampanan ang pagpapatotoo.'
- source_word: μαρτυρίαν
  choice: pagpapatotoo
  rationale: Maaaring tumukoy ang μαρτυρία sa patotoo o sa gawain ng pagpapatotoo. Mas natural na layon ng “natapos” ang “pagpapatotoo” at napananatili nito ang diwa ng pagbibigay-saksi.
- source_word: θηρίον
  choice: halimaw
  rationale: Ang “halimaw” ay malinaw at natural na katawagan sa nakatatakot na apokaliptikong nilalang sa Pahayag; ang “mabangis na hayop” ay mas literal ngunit mabigat at maaaring magmukhang karaniwang hayop lamang.
- source_word: ἀναβαῖνον
  choice: umaahon
  rationale: Pinananatili ng kasalukuyang pandiwaring “umaahon” ang masigla at patuloy na larawan ng pag-akyat mula sa kalaliman.
- source_word: ἀβύσσου
  choice: kalaliman
  rationale: Ang “kalaliman” ay tuwirang katumbas na hindi nagdaragdag ng interpretasyong nasa pariralang “hukay na walang ilalim.” Ang konteksto ng Pahayag ang nagbibigay rito ng apokaliptikong kahulugan.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: makikipagdigma sa kanila
  rationale: Likas na idyomang Tagalog ito para sa pagsisimula o pagsasagawa ng digmaan laban sa isang kalaban. Nananatili ang larawang pandigma ng ποιήσει … πόλεμον at malinaw ang pagkapoot sa konteksto.
- source_word: νικήσει
  choice: dadaigin
  rationale: Ang “dadaigin” ay nagpapanatili sa diwa ng νικάω na mananaig o magtatagumpay laban sa iba, at angkop sa larawang pandigma ng talata.
- source_word: ἀποκτενεῖ
  choice: papatayin
  rationale: Ito ang pinakatuwiran at natural na modernong katumbas ng ἀποκτενεῖ, nang walang makaluma o labis na pormal na himig.
theological_decisions:
- issue: Ang ugnayang nagpapahiwatig ng pagkapoot sa ποιήσει μετ’ αὐτῶν πόλεμον
  choice: makikipagdigma sa kanila
  alternative: magdidigma laban sa kanila
  rationale: Bagaman μετά + genitive ay may anyong “kasama/kasangkot nila,” bahagi ito rito ng idyomang paggawa ng digmaan at malinaw sa kasunod na “dadaigin” at “papatayin” na sila ang kalaban. Ang pangunahing salin ay natural sa Tagalog; itinatala sa talababa ang mas tahasang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “halimaw,” “kalaliman,” at “dadaigin” upang mapanatili ang apokaliptiko at pandigmang larawan nang hindi nagiging makaluma o nagdaragdag ng sektaryong interpretasyon.
