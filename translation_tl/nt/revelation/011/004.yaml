  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: tl
  text: Sila ang dalawang punong olibo at ang dalawang patungan ng ilawan; nakatayo sila sa harapan ng Panginoon ng lupa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pahiwatig ito sa Zacarias 4, kung saan ang mga punong olibo at patungan ng ilawan ay larawan ng mga lingkod na itinalaga at pinalakas ng Espiritu ng Diyos.
    reason: cross_reference
  - marker: b
    text: 'O, mas malapit sa ayos ng Griyego: “Sila ang dalawang punong olibo at ang dalawang patungan ng ilawan na nakatayo sa harapan ng Panginoon ng lupa.” Ang “nakatayo” ay tumutukoy sa mga saksi na kinakatawan ng mga larawang ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Ang mga ito
  rationale: Tuwirang isinasalin ang panghalip na pamatlig na panlalaking maramihan at tumutukoy sa dalawang saksi sa naunang konteksto, nang hindi idinaragdag ang salitang “mga saksi” sa mismong talata.
- source_word: ἐλαῖαι
  choice: mga punong olibo
  rationale: Tumutukoy dito sa mga punong olibo, hindi lamang sa bunga; pinananatili nito ang larawang kaugnay ng Zacarias 4.
- source_word: λυχνίαι
  choice: mga patungan ng ilawan
  rationale: Ang λυχνία ay patungan ng ilawan, hindi ang ilawan mismo; mahalaga ang ganitong eksaktong larawan sa Pahayag.
- source_word: ἐνώπιον
  choice: sa harapan ng
  rationale: Natural at marangal na Filipino para sa kinalalagyan sa presensya ng isang pinuno.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ang mapitagang titulo at ang teolohikal na bigat ng κύριος.
- source_word: γῆς
  choice: lupa
  rationale: Sa malawak na saklaw ng Pahayag, tumutukoy ito sa buong lupa, hindi lamang sa isang lupain.
- source_word: ἑστῶτες
  choice: na nakatayo
  rationale: Ipinahahayag ang patuloy na kalagayang bunga ng pagtindig; natural din itong iugnay sa mga larawang binanggit.
theological_decisions:
- issue: Ugnayan ng larawan sa Zacarias 4 at pagkakakilanlan ng dalawang saksi
  choice: 'Pinanatili ang tuwirang metapora: “ang dalawang punong olibo at ang dalawang patungan ng ilawan.”'
  alternative: “Ang dalawang saksing ito ay tulad ng dalawang punong olibo at dalawang patungan ng ilawan.”
  rationale: Tuwirang ipinakikilala ng Griyego ang mga saksi sa pamamagitan ng larawang apokaliptiko, hindi sa pamamagitan ng paliwanag o pagtutulad; pinananatili nito ang pahiwatig at teolohikal na tensiyon.
- issue: Saklaw ng pariralang ἑστῶτες (“nakatayo”)
  choice: Iniugnay sa buong tambalang larawan sa pamamagitan ng “na nakatayo.”
  alternative: “na siyang nakatayo” o “silang nakatayo,” na mas tahasang inuugnay sa dalawang saksi
  rationale: Ang panlalaking anyo ng participle ay sumasang-ayon sa mga taong tinutukoy ng Οὗτοί, samantalang pambabae ang ἐλαῖαι at λυχνίαι. Gayunman, maaaring gumana ang participle ayon sa diwa at ilarawan ang mga taong kinakatawan ng mga larawan; pinananatili ng pangunahing teksto ang natural na daloy, at itinatala sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patungan ng ilawan” sa halip na “kandelero” upang maging eksakto at madaling maunawaan, at pinanatili ang apokaliptikong metapora nang walang dagdag na pagpapakahulugan.
