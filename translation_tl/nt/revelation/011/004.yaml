  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at mas natural sa modernong Filipino ang pag-uulit ng “sila” pagkatapos ng tuldok-kuwit upang maiwasan ang maling pagkakaugnay ng pang-uri/pandiwang “nakatayo.”
  terminology: Ang “punong olibo,” “patungan ng ilawan,” “Panginoon,” at “lupa” ay angkop. Pinananatili ng “patungan ng ilawan” ang pagkakaiba ng λυχνία (lampstand) sa ilawan mismo.
