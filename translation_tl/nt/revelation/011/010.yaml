id: REV.11.10
reference: Revelation 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: tl
  text: At ang mga naninirahan sa lupa[a] ay nagagalak dahil sa kanila at nagdiriwang[b]. Magpapadala sila ng mga regalo sa isa’t isa, sapagkat pinahirapan ng dalawang propetang ito ang mga naninirahan sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga naninirahan sa daigdig.” Madalas gamitin sa Pahayag ang pananalitang ito para sa sangkatauhang naghihimagsik laban sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “nagpapakasaya.” Binibigyang-diin ng pandiwang Griyego ang masigla at pampistang pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ang mga naninirahan sa lupa
  rationale: Pinananatili nito ang pandiwang diwa ng participle at ang magkaparehong pagkakasabi sa simula at dulo ng talata. Natural din ito sa makabagong Filipino at hindi nito nililimitahan ang parirala sa heograpikong kahulugan lamang.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: nagagalak sa sinapit nila
  rationale: Ipinahahayag ng ἐπ’ αὐτοῖς ang pagagalak na nakatuon sa nangyari sa dalawang propeta. Ang “sa sinapit nila” ay natural sa Filipino at malinaw sa konteksto nang hindi nagdaragdag ng hiwalay na paliwanag sa pangunahing teksto.
- source_word: εὐφραίνονται
  choice: nagkakasayahan
  rationale: Ibinubukod ito sa naunang “nagagalak” at ipinapakita ang masigla at pampistang diwa ng pandiwa.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: magpapadala sila ng mga regalo sa isa’t isa
  rationale: Pinananatili ang panghinaharap na anyo ng πέμψουσιν at ang tuwirang kilos ng pagpapadala, sa halip na gawing mas interpretibong “magpapalitan.”
- source_word: οὗτοι οἱ δύο προφῆται
  choice: ang dalawang propetang ito
  rationale: Ito ang natural na ayos sa Filipino para sa demonstrative at noun phrase, habang malinaw na tinutukoy ang dalawang propeta.
- source_word: ἐβασάνισαν
  choice: pinahirapan
  rationale: Ipinananatili nito ang tindi ng βασανίζω at hindi pinahihina bilang simpleng paggambala o pagpapalungkot.
theological_decisions:
- issue: Ang paulit-ulit na parirala sa Pahayag para sa mga taong nakaugnay sa daigdig na salungat sa Diyos
  choice: mga naninirahan sa lupa
  alternative: mga tao sa lupa
  rationale: Pinananatili ng napiling salin ang paulit-ulit na pandiwang anyo at hinahayaang manggaling sa konteksto ng Pahayag ang mas malalim na teolohikal na pahiwatig, sa halip na tahasang idagdag ito sa teksto.
- issue: Tindi ng naging epekto ng dalawang saksi sa mga naninirahan sa lupa
  choice: pinahirapan
  alternative: ginambala
  rationale: Malakas ang βασανίζω; hindi dapat palambutin ang pahayag o tukuyin nang higit sa sinasabi ng teksto kung pisikal, emosyonal, o hatol ang lahat ng saklaw ng paghihirap.
- issue: Dahilan o tuon ng pagagalak sa dalawang propeta
  choice: nagagalak sa sinapit nila
  alternative: nagagalak dahil sa kanila
  rationale: Nililinaw ng konteksto na ang ikinagagalak ay ang sinapit ng mga propeta. Ang salin ay natural sa Filipino ngunit hindi nagdaragdag ng motibong wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “naninirahan” upang mapanatili ang mahalagang paulit-ulit na parirala, “nagkakasayahan” para sa pampistang diwa, at “pinahirapan” upang hindi pahinain ang tindi ng orihinal.
