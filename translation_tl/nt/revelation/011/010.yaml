  naturalness: Natural at marangal ang pangungusap pagkatapos ng munting rebisyon. Ang “nagdiriwang” ay mas karaniwan at mas tuwirang pampistang salin ng εὐφραίνονται kaysa “nagkakasayahan,” na maaaring magpahiwatig ng pagsasaya nang magkakasama at hindi kinakailangan sa Griyego.
  terminology: Ang “mga naninirahan sa lupa,” “dalawang propetang ito,” at “pinahirapan” ay angkop at pare-pareho. Ang “regalo” ay likas sa makabagong Filipino para sa δῶρα.
