  to: At ang mga naninirahan sa lupa[a] ay nagagalak dahil sa kanila at nagdiriwang[b]. Magpapadala sila ng mga regalo sa isa’t isa, sapagkat pinahirapan ng dalawang propetang ito ang mga naninirahan sa lupa.
