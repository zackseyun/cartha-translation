  to: na nagsasabi, “Nagpapasalamat kami sa iyo, Panginoong Diyos na Makapangyarihan sa Lahat, ang Siyang umiiral at ang Siyang umiiral noon,[a] sapagkat inangkin mo na ang iyong dakilang kapangyarihan at nagsimula ka nang maghari.”[b]
  rationale: Pinalitan ang “ang Siyang ngayon” ng “ang Siyang umiiral” upang maihatid ang eksistensiyal na puwersa ng ὁ ὢν, at ginawang “ang Siyang umiiral noon” ang katapat ng ὁ ἦν. Pinalitan ang “taglay mo na” ng “inangkin mo na” upang maipahayag ang kilos at perfect na aspekto ng εἴληφας nang hindi ipinapahiwatig na dati ay walang kapangyarihan ang Diyos. Iningatan ang kawalan ng “ang darating,” ang marangal na rehistro, at ang ingressive na pagbasa sa ἐβασίλευσας.
