  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: tl
  text: na nagsasabi, “Nagpapasalamat kami sa iyo, Panginoong Diyos na Makapangyarihan sa Lahat, ang Siyang umiiral at ang Siyang umiiral noon,[a] sapagkat inangkin mo na ang iyong dakilang kapangyarihan at nagsimula ka nang maghari.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito at salin na nagdaragdag ng “at ang darating,” gaya ng mas mahabang pormula sa ibang bahagi ng Pahayag, ngunit wala ang pariralang iyon sa tekstong Griyego rito.
    reason: textual_variant
  - marker: b
    text: Maaari ring “naghari ka na” o “naging hari ka.” Maaaring idiin ng pandiwang Griyego ang pagsisimula o ang aktuwal na pagsasagawa ng paghahari; sa kontekstong ito, malamang na itinatampok ang hayag na pagpapakita ng paghahari ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pangkasalukuyang aktibong participle na maramihan; inuugnay nito ang sinabi ng matatanda sa naunang talata. Natural sa Filipino ang “na nagsasabi.”
- source_word: Εὐχαριστοῦμέν
  choice: Nagpapasalamat kami
  rationale: Tumpak at likas na salin ng εὐχαριστέω, na angkop sa marangal at liturhikal na himig ng makalangit na pagsamba.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Panginoong Diyos na Makapangyarihan sa Lahat
  rationale: Pinananatili ang sunod-sunod na banal na mga titulo habang gumagamit ng pamilyar, marangal, at madaling maunawaang pananalita sa modernong Filipino.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: ang Siyang ngayon at ang Siyang noon
  rationale: Pinananatili ang pormulang banal na pagtukoy at ang pagkakaiba ng kasalukuyan at nakaraan. Hindi idinagdag ang pariralang “darating” na wala sa SBLGNT sa talatang ito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinahahayag ang sanhi ng pasasalamat at nagpapanatili ng marangal na himig.
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: taglay mo na ang iyong dakilang kapangyarihan
  rationale: Ang perfect εἴληφας ay nagpapakita ng natapos na pagkilos na may nananatiling bunga. Ang “taglay mo na” ay natural sa Filipino at hindi nagpapahiwatig na dati ay walang kapangyarihan ang Diyos.
- source_word: ἐβασίλευσας
  choice: nagsimula ka nang maghari
  rationale: Maaaring idiin ng aorist ang pagsisimula o hayag na pagsasagawa ng paghahari. Inihahatid ng salin ang ingressive na diwa nang hindi ipinahihiwatig na noon lamang naging ganap na hari ang Diyos.
theological_decisions:
- issue: Ang banal na titulong ὁ ὢν καὶ ὁ ἦν at ang kawalan ng “ang darating”
  choice: ang Siyang ngayon at ang Siyang noon
  alternative: ang Siyang ngayon, noon, at darating
  rationale: Dalawang bahagi lamang ang nasa SBLGNT. Hindi ito hinarmonisa sa mas mahabang pormula sa ibang bahagi ng Pahayag, kaya napapanatili ang tekstuwal at teolohikal na tensiyon.
- issue: Ang diwa ng ἐβασίλευσας kaugnay ng paghahari ng Diyos
  choice: nagsimula ka nang maghari
  alternative: naghari ka na / naging hari ka
  rationale: Maaaring itampok ng konteksto ang pasimula ng hayag at mapagpasyang pagsasagawa ng paghahari ng Diyos. Hindi nito kailangang itanggi ang dati at patuloy niyang soberanya.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa pagsamba. Ginamit ang “Panginoong Diyos na Makapangyarihan sa Lahat” bilang malinaw at pamilyar na banal na titulo. Ang “ang Siyang ngayon at ang Siyang noon” ay bahagyang mataas ang rehistro upang mapanatili ang natatanging pormulang Griyego. Ang mga marker na [a] at [b] ay parehong nakalagay sa pangunahing teksto.
