source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: tl
  text: At narinig nila ang isang malakas na tinig mula sa langit na nagsasabi sa kanila, “Umakyat kayo rito,” at umakyat sila sa langit sa ulap,[a] at pinagmasdan sila ng kanilang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang ulap.” Sa Griyego, “sa ulap,” na maaaring umalingawngaw rin sa mga tagpo sa Biblia tungkol sa presensiya at pagpapatunay ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: narinig nila
  rationale: Ang aorist ng ἀκούω ay tumutukoy sa pangyayaring marinig nila ang tinig, hindi sa patuloy na pakikinig.
- source_word: φωνῆς μεγάλης
  choice: isang malakas na tinig
  rationale: Likas na ipinapahayag sa Tagalog ang lakas ng tinig sa ganitong paraan; ang literal na “dakilang tinig” ay hindi natural at maaaring magpahiwatig ng ibang katangian.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Sa kontekstong pangitain at makalangit na pananalita sa Pahayag, ang οὐρανός ay tumutukoy sa langit, hindi lamang sa kalawakan o himpapawid.
- source_word: λεγούσης αὐτοῖς
  choice: na nagsasabi sa kanila
  rationale: Pinananatili ang tahasang αὐτοῖς at malinaw na ang tinig ang nagsasalita.
- source_word: Ἀνάβατε ὧδε
  choice: Umakyat kayo rito
  rationale: Pinananatili ang maramihang pautos at ang pataas na direksiyon ng ἀναβαίνω, kasama ang deiktikong ὧδε.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: umakyat sila sa langit
  rationale: Natural sa Tagalog at tapat sa pataas na pagkilos patungo sa langit; hindi kailangan ang mas teknikal na “umakyat papasok sa langit.”
- source_word: ἐν τῇ νεφέλῃ
  choice: sa loob ng ulap
  rationale: Pinananatili ang tiyak na artikulo sa pamamagitan ng “ng ulap” at nililinaw ng “sa loob” ang lokatibong ἐν nang hindi inaalis ang posibleng alusyon sa ulap ng presensiya ng Diyos.
- source_word: ἐθεώρησαν
  choice: pinagmamasdan
  rationale: Ipinahihiwatig ng θεωρέω ang masusing pagtanaw o pagmamasid, hindi lamang ang biglang pagkakita.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: kanilang mga kaaway
  rationale: Natural na anyong paari sa Tagalog at tahasang pinananatili ang ugnayan ng mga kaaway sa dalawang saksi.
theological_decisions:
- issue: Posibleng alusyon ng “ang ulap” sa presensiya at pagpapatunay ng Diyos
  choice: 'Panatilihin ang tiyak na “ulap” sa pangunahing teksto: “sa loob ng ulap”'
  alternative: “sa loob ng isang ulap”
  rationale: May tiyak na artikulo ang Griyego, at maaaring umaalingawngaw ito sa mga tagpo sa Kasulatan kung saan ang ulap ay kaugnay ng presensiya at pagpapatunay ng Diyos. Pinananatili ng salin ang posibilidad nang hindi tahasang ipinipilit ang alusyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “tinig” sa halip na “boses” para sa dignidad ng apokaliptikong tagpo, at “pinagmamasdan” upang mapanatili ang masusing pagtanaw na ipinahihiwatig ng θεωρέω.
