id: REV.11.9
reference: Revelation 11:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: tl
  text: May ilang tao mula sa mga bayan, mga lipi, mga wika, at mga bansa na tumitingin sa kanilang bangkay sa loob ng tatlo at kalahating araw[a], at hindi nila pinahihintulutang mailagay sa isang libingan ang kanilang mga bangkay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, unang ginamit ang “kanilang bangkay” (isahan), at pagkatapos ay “kanilang mga bangkay” (maramihan). Maaaring inilalarawan ng isahan ang dalawang saksi bilang iisang sama-samang patotoo bago muling tukuyin ang bawat bangkay.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: tumitingin
  rationale: Pinananatili ang pangkasalukuyang, patuloy na kilos at ang tuwirang diwa ng pagtingin.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: ang ilan mula sa mga bayan, mga lipi, mga wika, at mga bansa
  rationale: Ipinahahayag ng ἐκ ang isang bahagi na nagmumula sa mga grupong ito, hindi ang bawat taong kabilang sa mga ito.
- source_word: λαῶν
  choice: mga bayan
  rationale: Likas at marangal na salin para sa maramihang kolektibong pangkat ng mga tao.
- source_word: φυλῶν
  choice: mga lipi
  rationale: Karaniwang makabagong Tagalog para sa mga pangkat na nakabatay sa angkan o tribo.
- source_word: γλωσσῶν
  choice: mga wika
  rationale: Malinaw na tumutukoy sa mga pangkat ayon sa wikang ginagamit.
- source_word: ἐθνῶν
  choice: mga bansa
  rationale: Angkop sa paulit-ulit na pandaigdigang talaan sa Pahayag at hindi nililimitahan sa mga Hentil.
- source_word: τὸ πτῶμα αὐτῶν
  choice: kanilang bangkay
  rationale: Pinananatili ang isahan ng unang πτῶμα at ang posibleng kolektibong paglalarawan sa dalawang saksi.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: sa loob ng tatlo at kalahating araw
  rationale: Likas na Tagalog para sa akusatibong nagpapahayag ng tagal.
- source_word: τὰ πτώματα αὐτῶν
  choice: kanilang mga bangkay
  rationale: Pinananatili ang paglipat ng Griyego mula sa isahan tungo sa maramihan at malinaw ang kalagayan nilang patay.
- source_word: οὐκ ἀφίουσιν
  choice: hindi nila pinahihintulutan
  rationale: Dito, ang ἀφίημι ay nangangahulugang hindi pagpayag o pagpapahintulot.
- source_word: τεθῆναι εἰς μνῆμα
  choice: ilagay sa isang libingan
  rationale: Pinananatili ang tiyak na larawan ng paglalagay sa isang dakong libingan sa halip na ang mas malawak na 'ilibing.'
theological_decisions:
- issue: Isahan na πτῶμα sa unang sugnay at maramihang πτώματα sa ikalawa
  choice: Panatilihin ang isahan na “kanilang bangkay” sa una at ang maramihang “kanilang mga bangkay” sa ikalawa.
  alternative: Gawing maramihan ang dalawang pagbanggit para sa mas karaniwang daloy sa Tagalog.
  rationale: Sadyang pinananatili nito ang pagbabago ng bilang sa tekstong Griyego at hindi ipinapasiya kung ang unang isahan ay kolektibong paglalarawan sa dalawang saksi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang apat na kolektibong kategorya at ang kapansin-pansing paglipat mula isahan tungo sa maramihan.
