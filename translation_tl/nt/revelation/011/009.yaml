  to: May ilang tao mula sa mga bayan, mga lipi, mga wika, at mga bansa na tumitingin sa kanilang bangkay sa loob ng tatlo at kalahating araw[a], at hindi nila pinahihintulutang mailagay sa isang libingan ang kanilang mga bangkay.
  rationale: Ginawang mas likas ang pagbuo ng unang sugnay nang hindi inaalis ang partitive na diwa ng ἐκ (“May ilang tao mula sa”). Pinalitan ang “ilagay” ng “mailagay” upang maipakita ang balintiyak na infinitive ng Griyego. Hindi binago ang isahan/maramihang paglipat o ang footnote na nagpapaliwanag nito.
