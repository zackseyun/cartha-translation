  naturalness: Nauunawaan ang kasalukuyang teksto, ngunit ang “At ang ilan mula sa...” ay mabigat sa makabagong Filipino. Ang “May ilang tao mula sa...” ay higit na likas. Ang “pinahihintulutang mailagay” ay mas maayos na Tagalog at pinananatili ang balintiyak na “to be laid.”
  terminology: Ang “mga bayan, mga lipi, mga wika, at mga bansa” ay katanggap-tanggap at pinananatili ang natatanging apat na kategorya. Ang “bangkay” at “mga bangkay” ay angkop na katumbas ng πτῶμα/πτώματα. Ang “libingan” ay angkop para sa μνῆμα sa kontekstong ito.
