  source_fidelity: Tumpak na naipapahayag ng draft ang dalawang binilang na οὐαί, ang natapos na pagdaan ng ikalawa (ἀπῆλθεν), ang pantawag-pansing ἰδού, at ang patuloy na pagdating ng ikatlo (ἔρχεται). Ang “mabilis” para sa ταχύ ay lehitimo at, kasama ng talababa, hindi ipinipilit ang alinman sa bilis o temporal na paglapit.
  naturalness: Bahagyang hindi natural ang “Narito, mabilis na dumarating ang ...” dahil ang “narito” ay mas malinaw sa modernong Tagalog kapag sinusundan ng paksa na itinatampok. Ang inayos na ayos ay mas maayos pakinggan habang pinananatili ang makahulang himig.
