  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: tl
  text: 'Lumipas na ang ikalawang kapahamakan. Narito: ang ikatlong kapahamakan ay mabilis[a] na dumarating.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lalong madaling panahon.” Maaaring bigyang-diin ng Griyegong ταχύ ang bilis ng pagdating o ang pagiging malapit ng panahon ng pagdating nito.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: kapahamakan
  rationale: Sa kontekstong ito, ang οὐαί ay tumutukoy sa bawat binilang na pangyayaring nagdadala ng matinding pinsala at paghatol. Ang “kapahamakan” ay natural sa makabagong Tagalog at napapanatili ang nagbabantang bigat ng salita nang hindi ito tahasang nililimitahan sa “paghatol.”
- source_word: δευτέρα / τρίτη
  choice: ikalawa / ikatlo
  rationale: Tuwirang isinalin ang mga bilang na panunuran ayon sa pagkakasunod ng mga kapahamakan.
- source_word: ἀπῆλθεν
  choice: lumipas na
  rationale: Ipinahihiwatig ng aorist na natapos na ang ikalawang kapahamakan. Ang “lumipas na” ay natural na Tagalog para sa isang pangyayaring nagdaan na.
- source_word: ἰδού
  choice: narito
  rationale: Ang “narito” ay isang marangal at malinaw na panandang pantawag-pansin na angkop sa makahulang tono ng Pahayag.
- source_word: ἔρχεται
  choice: dumarating
  rationale: Pinananatili ng aspektong nagaganap ng “dumarating” ang matingkad na present tense ng Griyego, nang hindi pinalalabis bilang “malapit nang dumating.”
- source_word: ταχύ
  choice: mabilis
  rationale: Maaaring tumukoy ang ταχύ sa bilis o sa χρονological na pagkalapit. Ang “mabilis” ay nagpapanatili sa diwa ng kagyat na pagkilos, habang inilalahad sa talababa ang posibleng kahulugang “sa lalong madaling panahon.”
theological_decisions:
- issue: Kahulugan ng ταχύ sa kontekstong eskatolohikal
  choice: mabilis
  alternative: sa lalong madaling panahon
  rationale: Hindi tiyak kung ang diin ay nasa mabilis o biglaang pagdating, o sa pagiging malapit nito sa panahon. Pinananatili sa pangunahing teksto ang ideya ng bilis at inilalagay sa talababa ang temporal na alternatibo upang hindi tahimik na lutasin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “narito” bilang makahulang pantawag-pansin; iniwasan ang mas lipas na “masdan.” Ang marker na [a] ay inilagay kaagad pagkatapos ng “mabilis,” ang salitang tinatalakay ng talababa.
