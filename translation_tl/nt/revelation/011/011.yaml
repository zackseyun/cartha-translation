id: REV.11.11
reference: Revelation 11:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: tl
  text: Pagkaraan ng tatlo at kalahating araw, isang hininga[a] ng buhay mula sa Diyos ang pumasok sa kanila. Tumayo sila sa kanilang mga paa, at matinding takot ang bumalot sa mga nakamasid sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang espiritu ng buhay mula sa Diyos”; posible rin ang “ang Espiritu ng buhay mula sa Diyos.” Ang salitang Griyego na πνεῦμα ay maaaring mangahulugang hininga, espiritu, o Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: Pagkaraan ng tatlo at kalahating araw
  rationale: Likas sa modernong Tagalog ang “pagkaraan ng” para sa temporal na μετά, at malinaw nitong pinananatili ang tiyak na yugto ng tatlo at kalahating araw.
- source_word: πνεῦμα ζωῆς
  choice: ang hininga ng buhay
  rationale: Sa tagpong muling pagbibigay-buhay at sa alingawngaw ng Ezekiel 37, ang “hininga” ang pinakamalinaw na pangunahing kahulugan, habang pinananatili sa talababa ang tunay na posibilidad na “espiritu” o “Espiritu” ang tinutukoy.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Direkta at natural na ipinapahayag nito ang Diyos bilang pinagmulan.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: pumasok sa kanila
  rationale: Natural na Tagalog ito para sa pagpasok sa loob nila nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: Tumayo sila sa kanilang mga paa
  rationale: Pinananatili nito ang konkretong larawan at ang wikang kaugnay ng muling pagbangon o pagpapanumbalik.
- source_word: φόβος μέγας
  choice: matinding takot
  rationale: Ang “matinding takot” ay natural at marangal na katumbas ng lakas ng μέγας nang hindi ito pinalalabis bilang sindak.
- source_word: ἐπέπεσεν ἐπὶ
  choice: nabalot ... ang
  rationale: Ang idyomang “nabalot ng takot” ay likas sa Tagalog at malinaw na naghahatid ng bigla at ganap na pagdating ng takot sa mga nakamasid.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: ang mga nakamasid sa kanila
  rationale: Ipinahihiwatig ng “nakamasid” ang nagpapatuloy at masusing pagtingin na taglay ng participle θεωροῦντας.
theological_decisions:
- issue: Kung ang πνεῦμα ζωῆς ay hiningang nagbibigay-buhay, isang espiritu, o ang Espiritu Santo
  choice: ang hininga ng buhay mula sa Diyos
  alternative: isang espiritu ng buhay mula sa Diyos; ang Espiritu ng buhay mula sa Diyos
  rationale: Hindi tahasang kinikilala ng Griyego ang tinutukoy bilang Espiritu Santo. Ang “hininga ng buhay” ay angkop sa larawan ng muling pagbibigay-buhay, ngunit inilalahad sa talababa ang lehitimong ibang pagbasa upang mapanatili ang teolohikal at leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “hininga” sa pangunahing teksto dahil sa konteksto ng muling pagbibigay-buhay, ngunit hindi inalis ang kalabuan ng πνεῦμα; nakasaad ang mga alternatibo sa talababa.
