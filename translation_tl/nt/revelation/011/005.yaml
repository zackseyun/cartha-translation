id: REV.11.5
reference: Revelation 11:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: tl
  text: At kung may gustong manakit sa kanila, lumalabas ang apoy mula sa kanilang bibig[a] at nilalamon nito ang kanilang mga kaaway. At kung may magnanais na manakit sa kanila, sa ganitong paraan siya kailangang patayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa kanilang mga bibig.” Sa Griyego, isahan ang salitang “bibig” ngunit maramihan ang nagmamay-ari nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: manakit
  rationale: Sa kontekstong ito, tumutukoy ito sa mapaminsalang pagkilos laban sa dalawang saksi. Ang “manakit” ay natural at hindi nagtatakda ng isang partikular na paraan ng pananakit.
- source_word: πῦρ
  choice: apoy
  rationale: Tuwirang pinananatili ang matingkad na apokaliptikong larawan ng orihinal.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: lumalabas ang apoy mula sa kanilang bibig
  rationale: Pinananatili ang kongkretong larawan at ang isahang “bibig” na may maramihang nagmamay-ari, gaya ng Griyego.
- source_word: κατεσθίει
  choice: nilalamon
  rationale: Ipinahahayag nito ang marahas at ganap na pagwasak na taglay ng pandiwa.
- source_word: ἐχθρούς
  choice: mga kaaway
  rationale: Karaniwan at malinaw na tawag sa mga kumakalaban sa mga saksi.
- source_word: θέλει / θελήσῃ
  choice: gustong / magnanais na
  rationale: Ang una ay natural na kasalukuyang pagnanais; ang ikalawa ay bahagyang higit na kondisyonal, na angkop sa subjunctive ng Griyego.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Malinaw na itinuturo nito ang naunang inilalarawang paraan ng kamatayan.
- source_word: δεῖ
  choice: kailangang
  rationale: Pinananatili ang diwa ng kinakailangan o itinakdang mangyari nang hindi ipinapaliwanag kung saan nagmumula ang pangangailangan.
- source_word: ἀποκτανθῆναι
  choice: patayin
  rationale: Direkta at natural na pagpapahayag ng pasibong infinitive sa Filipino.
theological_decisions:
- issue: Kung literal na pananatilihin o bibigyang-kahulugan ang apoy na lumalabas sa bibig
  choice: 'Panatilihin ang mismong larawan: “lumalabas ang apoy mula sa kanilang bibig.”'
  alternative: Ipaliwanag ito bilang mapanirang salita o hatol na nagmumula sa kanila.
  rationale: Inilalahad ng Griyego ang larawan nang hindi ipinapaliwanag kung literal o sagisag ito. Pinananatili ng salin ang puwang para sa dalawang pagbasa.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “kanilang bibig” upang sundan ang isahang anyo sa Griyego, habang inilagay sa talababa ang mas karaniwang maramihang pagpapahayag.
