id: REV.11.13
reference: Revelation 11:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: tl
  text: At sa oras na iyon ay nagkaroon ng malakas na lindol. Bumagsak ang ikasampung bahagi ng lungsod, at pitong libong tao[a] ang napatay sa lindol. Ang mga natira ay lubhang natakot at nagbigay ng kaluwalhatian sa Diyos ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “mga pangalan ng mga tao, pitong libo”—isang idyomang tumutukoy sa pitong libong taong kabilang sa mga namatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: nang oras ding iyon
  rationale: Pinananatili nito ang tiyak at madramang panandang temporal ng Griyego, habang natural sa modernong Tagalog.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: nagkaroon ng isang malakas na lindol
  rationale: Likas sa Tagalog ang 'nagkaroon ng' para sa pagsiklab ng pangyayari; malinaw na naipapahayag ng 'malakas' ang μέγας sa konteksto ng lindol.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: ang ikasampung bahagi ng lungsod
  rationale: Pinananatili ang eksaktong bahagdan at ang partitive na diwa ng Griyego.
- source_word: ἔπεσεν
  choice: bumagsak
  rationale: Tuwirang katumbas ito ng 'fell' at hindi nito labis na tinutukoy ang eksaktong paraan ng pagkawasak.
- source_word: ἀπεκτάνθησαν
  choice: namatay
  rationale: Sa kontekstong ang lindol ang sanhi, natural sa Tagalog ang 'namatay sa lindol.' Hindi kailangang ipahiwatig na may personal na pumatay, bagaman passive ang anyong Griyego.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: pitong libong tao
  rationale: Ipinapahayag ang idiomatikong kahulugan sa malinaw na Tagalog; inilalagay sa talababa ang literal at kapansin-pansing ekspresyong 'mga pangalan ng mga tao.'
- source_word: οἱ λοιποὶ
  choice: ang mga natira
  rationale: Tuwiran ito at hindi nagdaragdag ng interpretatibong 'mga nakaligtas.'
- source_word: ἔμφοβοι ἐγένοντο
  choice: lubhang natakot
  rationale: Naipapakita ng 'lubhang' ang tindi ng ἔμφοβοι at ipinahihiwatig ng pandiwa ang pagpasok nila sa kalagayan ng matinding takot.
- source_word: ἔδωκαν δόξαν
  choice: nagbigay ng kaluwalhatian
  rationale: Pinananatili ang biblikal na idyoma sa isang malinaw at marangal na anyong Tagalog.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: sa Diyos ng langit
  rationale: Pinananatili ang genitival na titulo at ang nakaugaliang biblikal na pahayag nang hindi ito ginagawang 'Diyos na nasa langit.'
theological_decisions:
- issue: Kung ang pagtugon ng mga natira ay tahasang tunay na pagsisisi o pananampalatayang nagliligtas
  choice: Isinalin nang neutral bilang 'lubhang natakot at nagbigay ng kaluwalhatian sa Diyos ng langit.'
  alternative: Maaaring unawain bilang tunay na pagsisisi, o bilang pagkilala lamang sa kapangyarihan ng Diyos dahil sa takot.
  rationale: Takot at pagbibigay ng kaluwalhatian sa Diyos ang tahasang sinasabi ng Griyego, ngunit hindi nito tuwirang inilalarawan ang panloob na katangian ng tugon. Kaya hindi nilulutas ng salin ang nananatiling teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang tradisyonal na pananalita at ang mga pagpapaliwanag na higit sa sinasabi ng Griyego.
