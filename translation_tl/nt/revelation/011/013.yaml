- from: At nang oras ding iyon ay nagkaroon ng isang malakas na lindol. Bumagsak ang ikasampung bahagi ng lungsod, at pitong libong tao[a] ang namatay sa lindol. Ang mga natira ay lubhang natakot at nagbigay ng kaluwalhatian sa Diyos ng langit.
  to: At sa oras na iyon ay nagkaroon ng malakas na lindol. Bumagsak ang ikasampung bahagi ng lungsod, at pitong libong tao[a] ang napatay sa lindol. Ang mga natira ay lubhang natakot at nagbigay ng kaluwalhatian sa Diyos ng langit.
  rationale: Inayos ang panandang panahon upang maging natural na modernong Filipino at pinalitan ang «namatay» ng «ay napatay» upang maipakita ang passive na pandiwang Griyego nang hindi nagdaragdag ng paliwanag tungkol sa paraan ng pagkamatay. Pinananatili ang neutral na paglalarawan sa tugon ng mga natira.
