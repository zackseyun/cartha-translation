id: REV.11.19
reference: Revelation 11:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: tl
  text: At nabuksan ang templo ng Diyos na nasa langit[a], at nakita sa kanyang templo ang kaban ng kanyang tipan[b]. At nagkaroon ng mga kidlat, mga tinig[c], mga kulog, isang lindol, at matinding graniso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Ang Griyegong ναός ay maaaring tumukoy nang mas tiyak sa banal na panloob na bahagi ng templo, hindi sa buong bakuran nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ayon sa nakaugaliang katawagan na “kaban ng tipan,” ngunit tahasang sinasabi ng Griyego na “kanyang tipan.”
    reason: lexical_alternative
  - marker: c
    text: O “mga tunog” o “mga ugong.” Madalas gamitin sa Pahayag ang “mga tinig” sa mga tagpo ng pagpapakita ng banal na kadakilaan at paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: templo
  rationale: Natural at pamilyar na salin sa modernong Tagalog. Bagaman maaaring tumukoy ang ναός nang mas tiyak sa panloob na santuwaryo, hindi pinipilit ng “templo” ang isang detalyadong paglalarawan sa kaayusan ng makalangit na tahanan ng Diyos.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: na nasa langit
  rationale: Malinaw na iniuugnay ang parirala sa templo, gaya ng ayos ng Griyego, at iniiwasang magmukhang ang “Diyos” lamang ang tinutukoy ng “nasa langit.”
- source_word: ἠνοίγη
  choice: nabuksan
  rationale: Pinananatili ang pasibong pangyayari at hindi nagdaragdag ng tahasang gumagawa ng pagbubukas.
- source_word: ὤφθη
  choice: nakita
  rationale: Malapit sa pasibong diwa ng Griyego at hindi ipinapalagay kung ang kaban ay aktibong nagpakita o basta naging nakikita.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: kaban ng kanyang tipan
  rationale: Ang “kaban” ang nakaugaliang salin ng κιβωτός sa kontekstong ito; pinananatili ng “kanyang” ang tahasang αὐτοῦ at ipinakikilalang sa Diyos ang tipan.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: sa kanyang templo
  rationale: Pinananatili ang pag-uulit ng ναός at ang panghalip na tumutukoy sa Diyos.
- source_word: ἐγένοντο
  choice: nagkaroon ng
  rationale: Likas na Tagalog para sa paglitaw o pagsisimula ng magkakasunod na kababalaghang binanggit.
- source_word: ἀστραπαὶ
  choice: mga kidlat
  rationale: Payak at natural na salin na pinananatili ang maramihang anyo.
- source_word: φωναὶ
  choice: mga tinig
  rationale: Tuwirang pinananatili ang natatanging bokabularyong ginagamit sa mga pagpapakita ng banal na kapangyarihan sa Pahayag, sa halip na agad itong gawing “mga ugong” o pangkalahatang “mga tunog.”
- source_word: βρονταὶ
  choice: mga kulog
  rationale: Natural na salin sa Tagalog at angkop sa maramihang anyo ng Griyego.
- source_word: σεισμὸς
  choice: isang lindol
  rationale: Karaniwang katumbas ng σεισμός at pinananatili ang pagiging isahan nito.
- source_word: χάλαζα μεγάλη
  choice: matinding graniso
  rationale: Likas na modernong Tagalog para sa malakas o matinding pagbagsak ng yelo, nang hindi ipinapalagay na laki lamang ng bawat tipak ang tinutukoy ng μεγάλη.
theological_decisions:
- issue: Saklaw ng makalangit na ναός
  choice: templo
  alternative: santuwaryo
  rationale: Ang “templo” ay malinaw at natural, samantalang inilalagay sa talababa ang mas tiyak na posibleng kahulugang “santuwaryo” upang hindi ipilit ang isang partikular na paglalarawan sa makalangit na kaayusan.
- issue: Kahulugan ng φωναὶ sa hanay ng mga tanda
  choice: mga tinig
  alternative: mga tunog o mga ugong
  rationale: Pinananatili ng “mga tinig” ang literal at paulit-ulit na pananalita ng Pahayag at ang sadyang tensiyon nito; itinatala sa talababa ang posibleng mas pangkalahatang pandinig na kahulugan.
- issue: Pagmamay-ari ng tipan
  choice: kanyang tipan
  alternative: ang tipan
  rationale: Tahasan sa Griyego ang αὐτοῦ, kaya pinananatiling malinaw na ang tipan ay sa Diyos, sa halip na alisin ang panghalip ayon sa nakaugaliang katawagang “kaban ng tipan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at maringal na sunod-sunod na mga tanda, pati ang pag-uulit ng “templo” at ang literal na “mga tinig,” habang iniwasan ang makaluma o labis na teknikal na pananalita.
