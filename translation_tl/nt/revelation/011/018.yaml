revisions:
- from: Nagalit ang mga bansa, ngunit dumating ang iyong poot, at ang panahon upang hatulan ang mga patay, upang gantimpalaan ang iyong mga lingkod[a]—ang mga propeta, ang mga banal, at ang mga may takot sa iyong pangalan, kapwa ang mga hamak at ang mga dakila—at upang lipulin ang mga sumisira sa daigdig.[b]
  to: Nagalit ang mga bansa, at dumating ang iyong poot, at ang panahon ng paghatol sa mga patay, upang gantimpalaan ang iyong mga lingkod[a]—ang mga propeta, ang mga banal, at ang mga may takot sa iyong pangalan, kapwa ang mga hamak at ang mga dakila—at upang wasakin ang mga sumisira sa daigdig.[b]
  rationale: Inayos ang mga pagbabagong nagdaragdag ng kahulugang wala sa Griyego o nagpapalabo sa tinig at pag-uugnay ng mga pandiwa. Pinanatili ang talaan ng mga tatanggap ng gantimpala at ang saklaw na ‘mga hamak at mga dakila’ nang hindi nilulutas ang kanilang eksaktong sintaktikong saklaw nang lampas sa teksto.
