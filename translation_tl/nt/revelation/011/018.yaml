id: REV.11.18
reference: Revelation 11:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: tl
  text: Nagalit ang mga bansa, at dumating ang iyong poot, at ang panahon ng paghatol sa mga patay, upang gantimpalaan ang iyong mga lingkod[a]—ang mga propeta, ang mga banal, at ang mga may takot sa iyong pangalan, kapwa ang mga hamak at ang mga dakila—at upang wasakin ang mga sumisira sa daigdig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin.” Ang salitang Griyego na doulos ay maaaring tumukoy sa isang lingkod o alipin, ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: O “ang mga sumisira o nagpapasama sa lupain.” Ang salitang Griyego na gē ay maaari ring mangahulugang “lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: mga bansa
  rationale: Tumutukoy sa mga bansa ng daigdig bilang sama-samang pangkat; mas angkop ito rito kaysa sa mas tiyak na 'mga Hentil.'
- source_word: ὠργίσθησαν
  choice: nagalit
  rationale: Likas at tuwirang salin ng pandiwang nagsasaad ng pagkagalit, nang hindi labis na pinatitindi ang diwa.
- source_word: ὀργή
  choice: poot
  rationale: Pinananatili ang matindi, makatarungan, at panghuling-hatol na diwa ng galit ng Diyos, gayundin ang kaibhan nito sa galit ng mga bansa.
- source_word: καιρός
  choice: panahon
  rationale: Likas sa Tagalog at maaaring tumukoy sa itinakdang mahalagang sandali, gaya ng hinihingi ng kontekstong eskatolohikal.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: upang hatulan ang mga patay
  rationale: Malinaw at natural na paglilipat ng pasibong infinitive na may diwang panghukuman.
- source_word: μισθός
  choice: gantimpala
  rationale: Angkop sa banal na paggawad sa bayan ng Diyos at hindi nagmumungkahi ng karaniwang sahod o transaksiyong paggawa.
- source_word: δούλοις
  choice: mga lingkod
  rationale: Sa talaang ito ng mga taong gagantimpalaan ng Diyos, nangingibabaw ang marangal na diwa ng paglilingkod; inilalahad sa talababa ang posibleng 'mga alipin.'
- source_word: ἁγίοις
  choice: mga banal
  rationale: Karaniwan at maikli itong katawagan sa mga taong itinalaga sa Diyos, nang hindi nagpapasok ng natatanging denominasyonal na pakahulugan.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: mga may takot sa iyong pangalan
  rationale: Pinananatili ang biblikal na idyoma ng mapitagang takot sa Diyos sa halip na tahasang lutasin ito bilang paggalang lamang.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: kapwa ang mga hamak at ang mga dakila
  rationale: Ipinahahayag ang saklaw sa lahat ng antas ng katayuan; mas natural sa Tagalog ang 'hamak' kaysa literal na 'maliit' para sa mga tao sa ganitong tambalan.
- source_word: διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν
  choice: lipulin ang mga sumisira sa daigdig
  rationale: Inilalapit ng 'lipulin/sumisira' ang magkaugnay na pandiwa habang isinasaad ang matinding hatol; ang 'daigdig' ay umaangkop sa kosmikong saklaw ng konteksto.
theological_decisions:
- issue: Kahulugan ng δοῦλος bilang katawagan sa bayan ng Diyos
  choice: mga lingkod
  alternative: mga alipin
  rationale: Nakatuon ang talata sa pagkilala at paggantimpala sa mga kabilang sa Diyos, hindi lalo na sa kanilang kalagayang nakagapos. Gayunman, tunay na leksikal na posibilidad ang 'mga alipin' at pinananatili ito sa talababa.
- issue: Saklaw ng γῆ
  choice: daigdig
  alternative: lupain
  rationale: Mas malamang ang pandaigdig o kosmikong saklaw sa konteksto ng panghuling paghuhukom sa Apocalipsis, ngunit maaari ring mangahulugan ang salitang Griyego ng 'lupain,' kaya hindi inaalis ang posibilidad na iyon.
- issue: Ugnayan ng mga pangkat na tumatanggap ng gantimpala
  choice: pinanatiling magkakasunod ang 'mga propeta, mga banal, at mga may takot sa iyong pangalan'
  alternative: ituring ang mga sumunod na katawagan bilang pagpapaliwanag lamang sa 'mga propeta' o bilang lubusang magkakahiwalay na uri
  rationale: Hindi tahasang nilulutas ng sintaks kung gaano magkakapatong ang mga katawagang ito; ang tuwirang talaan ay nagpapanatili ng gayong kaluwagan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang apokaliptikong bigat ng 'poot,' 'hatulan,' at 'lipulin,' habang iniwasan ang lipas o labis na teknikal na pananalita. Ginamit ang 'ngunit' upang likas na maipakita sa Filipino ang matinding paghaharap ng galit ng mga bansa at pagdating ng poot ng Diyos, bagaman simpleng καί ang nasa Griyego.
