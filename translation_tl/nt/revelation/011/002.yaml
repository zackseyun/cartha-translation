id: REV.11.2
reference: Revelation 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: tl
  text: Ngunit ibukod mo ang patyo na nasa labas ng templo[a], at huwag mo itong sukatin, sapagkat ibinigay ito sa mga bansa[b]. Yuyurakan nila ang banal na lungsod sa loob ng apatnapu't dalawang buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Maaaring tumukoy ang Griyegong ναός nang mas tiyak sa santuwaryo kaysa sa buong nasasakupan ng templo.
    reason: lexical_alternative
  - marker: b
    text: O “mga Hentil.” Ang Griyegong ἔθνεσιν ay maaaring mangahulugang “mga bansa” o “mga Hentil,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: patyo
  rationale: Sa konteksto ng templo, tumutukoy ito sa bukás na patyo o court, hindi sa karaniwang bakuran.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: sa labas ng templo
  rationale: Malinaw at natural nitong inilalarawan ang patyo bilang nasa labas ng ναός, habang pinananatili ang kaibahang panglokasyon.
- source_word: ναός
  choice: templo
  rationale: Ito ang pinakanatural na katawagan sa Filipino, bagaman maaaring mas tiyak na tumukoy ang Griyego sa santuwaryo; pinanatili ang alternatibo sa talababa.
- source_word: ἔκβαλε ἔξωθεν
  choice: huwag mong isama
  rationale: Sa ugnay nito sa kasunod na utos na huwag sukatin, ang diwa ay ibukod ang patyo sa pagsukat, hindi literal na ihagis ito palabas.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: huwag mo itong sukatin
  rationale: Tuwirang pinananatili ang pautos na nasa ikalawang panauhang isahan.
- source_word: ἐδόθη
  choice: ibinigay ito
  rationale: Pinananatili ang balintiyak na pandiwa at hindi tahasang tinutukoy ang di-binanggit na gumawa ng pagbibigay.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga bansa
  rationale: Pinananatili nito ang malawak na kolektibo at makabansang diwa ng ἔθνη sa pananalitang propetiko, nang hindi isinasara ang posibleng kahulugang 'mga Hentil.'
- source_word: πόλιν τὴν ἁγίαν
  choice: ang banal na lungsod
  rationale: Karaniwan at tumpak na salin ito na hindi tahasang nagpapangalan sa lungsod sa mismong teksto.
- source_word: πατήσουσιν
  choice: yuyurakan nila
  rationale: Matingkad at natural itong nagpapahayag ng marahas na paglapastangan o pananakop.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: sa loob ng apatnapu't dalawang buwan
  rationale: Likas sa Filipino ang 'sa loob ng' upang ipahayag ang tagal na isinasaad ng akusatibo.
theological_decisions:
- issue: Lawak ng kahulugan ng ναός sa larawang apokaliptiko tungkol sa templo
  choice: templo
  alternative: santuwaryo
  rationale: Mas madaling maunawaan ang 'templo,' ngunit maaaring tumukoy ang ναός nang mas tiyak sa santuwaryo o gusaling banal na kaiba sa panlabas na patyo. Inilagay sa talababa ang alternatibo upang mapanatili ang interpretatibong tensiyon.
- issue: Kahulugan ng ἔθνεσιν
  choice: mga bansa
  alternative: mga Hentil
  rationale: Maaaring mangahulugan ang salita ng mga bansa sa pangkalahatan o ng mga Hentil bilang kaiba sa Israel o mga Judio. Mas malawak at hindi gaanong mapagpasya ang 'mga bansa,' habang nasa talababa ang posibleng etniko-relihiyosong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'patyo' at 'templo' bilang mga salitang madaling maunawaan, habang pinanatili sa mga talababa ang mahahalagang alternatibong leksikal. Hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga sugnay.
