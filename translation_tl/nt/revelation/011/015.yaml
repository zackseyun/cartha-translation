revisions:
- from: At hinipan ng ikapitong anghel ang trumpeta[a]. At narinig sa langit ang malalakas na tinig na nagsasabi, “Ang kaharian ng sanlibutan ay naging sa ating Panginoon at sa kanyang Mesiyas[b], at maghahari siya magpakailanman[c].”
  to: At hinipan ng ikapitong anghel ang trumpeta[a], at may malalakas na tinig sa langit na nagsasabi, “Ang kaharian ng sanlibutan ay naging pag-aari ng ating Panginoon at ng kanyang Mesiyas[b], at maghahari siya magpakailanman[c].”
  rationale: Pinalitan ang hindi likas na 'ay naging sa' ng 'ay naging pag-aari ng' upang malinaw na maipahayag ang genitive na ugnayan sa orihinal. Pinalitan din ang 'narinig' ng 'may' upang mas malapit sa ἐγένοντο φωναὶ μεγάλαι. Pinanatili ang isahang 'siya' at hindi tinukoy ang antecedent nito, gaya ng siksik na pahayag sa Griyego.
