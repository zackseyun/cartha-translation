id: REV.11.15
reference: Revelation 11:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: tl
  text: At hinipan ng ikapitong anghel ang trumpeta[a], at may malalakas na tinig sa langit na nagsasabi, “Ang kaharian ng sanlibutan ay naging pag-aari ng ating Panginoon at ng kanyang Mesiyas[b], at maghahari siya magpakailanman[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ang mga kaharian ng sanlibutan ay naging,” o “ang kaharian ng mundong ito ay naging.” Isahan ang mababasa sa SBLGNT: “ang kaharian ng sanlibutan ay naging.”'
    reason: textual_variant
  - marker: b
    text: O “kanyang Cristo.” Isinalin dito ang Griyegong titulong Χριστός bilang “Mesiyas” upang mapanatili ang diwa nito bilang titulo.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa mga kapanahunan ng mga kapanahunan,” isang Griyegong idyoma para sa walang katapusang tagal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang trumpeta
  rationale: Ang σαλπίζω ay nangangahulugang patunugin ang trumpeta. Likas at malinaw sa Tagalog ang “hinipan ... ang trumpeta,” habang ipinahahayag lamang nito ang instrumentong likas nang nakapaloob sa pandiwa.
- source_word: φωναὶ μεγάλαι
  choice: malalakas na tinig
  rationale: Dahil sinusundan ito ng λέγοντες, mga tinig na bumibigkas ang tinutukoy, hindi lamang malalakas na tunog. Ang “malalakas” ang likas na katumbas ng μεγάλαι sa kontekstong ito.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Sa tagpong ito ng Pahayag, ang οὐρανός ay tumutukoy sa makalangit na dako, hindi sa pisikal na himpapawid.
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Maayos nitong inililipat ang participial construction sa natural na Tagalog nang hindi ginagaya ang kapansin-pansing pagkakaiba ng kasariang gramatikal sa Griyego.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Ang kaharian ng sanlibutan ay naging
  rationale: Pinananatili ang isahang βασιλεία ng SBLGNT. Ang “ay naging” ay tuwirang naghahayag ng napangyaring pagbabago sa proklamasyon.
- source_word: τοῦ κόσμου
  choice: ng sanlibutan
  rationale: Tumpak ito sa payak na genitive na “of the world” at hindi ipinapasok ang “mundong ito,” na kaugnay ng ibang tekstuwal na anyo.
- source_word: τοῦ κυρίου ἡμῶν
  choice: sa ating Panginoon
  rationale: Sa pariralang “ay naging sa,” naipahahayag ang pag-aari o pamamahala nang hindi idinaragdag ang pangngalang wala sa Griyego.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: sa kanyang Mesiyas
  rationale: Ang Χριστός ay malinaw na titulong tumutukoy sa pinahiran ng Diyos; kaya “Mesiyas” ang piniling likas at titularyong salin.
- source_word: καὶ βασιλεύσει
  choice: at maghahari siya
  rationale: Pinananatili ang isahang anyo ng pandiwa at ang siksik, hindi ganap na nilinaw na reperensiya ng paksa sa Griyego.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Ito ang natural na Tagalog na katumbas ng Griyegong idyoma para sa walang katapusang tagal.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay gumaganap ang salita bilang titulo sa pariralang “kanyang Mesiyas,” kaya pinananatili ng “Mesiyas” ang titularyong diwa.
- issue: Paksa ng βασιλεύσει
  choice: maghahari siya
  alternative: maghahari sila / maghahari ang Panginoon at ang kanyang Mesiyas
  rationale: Isahan ang Griyegong pandiwa. Pinananatili ng salin ang isahang paksa at hindi nilulutas nang higit sa teksto kung sino mismo ang tinutukoy ng “siya.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sanlibutan” upang malinaw na tumukoy sa buong daigdig na saklaw ng kaharian, at iniwasan ang labis na arkaikong ayos. Pinanatili ang isahang “siya” upang huwag lutasin ang teolohikal at gramatikal na siksik na pahayag ng orihinal.
