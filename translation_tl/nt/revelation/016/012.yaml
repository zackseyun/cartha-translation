revisions:
- from: At ibinuhos ng ikaanim ang laman ng kanyang mangkok sa malaking ilog na Eufrates, at natuyo ang tubig nito upang maihanda ang daan ng mga haring manggagaling sa sinisikatan ng araw.[a]
  to: At ibinuhos ng ikaanim ang kanyang mangkok sa malaking ilog na Eufrates, at natuyo ang tubig nito upang maihanda ang daan para sa mga haring mula sa pagsikat ng araw.[a]
