  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: tl
  text: At ibinuhos ng ikaanim ang kanyang mangkok sa malaking ilog na Eufrates, at natuyo ang tubig nito upang maihanda ang daan para sa mga haring mula sa pagsikat ng araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas payak, “mula sa silangan.” Sa literal, “mula sa pagsikat ng araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: ang ikaanim
  rationale: Pinananatili ang elipsis ng Griyego, na tumutukoy sa ikaanim sa mga tagapagdala ng mangkok sa konteksto, nang hindi idinaragdag ang salitang “anghel” na wala sa talata.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: ibinuhos ... ang laman ng kanyang mangkok
  rationale: Sa natural na Tagalog, ang laman ng sisidlan ang ibinubuhos. Nililinaw ito nang hindi binabago ang larawan ng φιάλη bilang isang mangkok.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: sa malaking ilog na Eufrates
  rationale: Natural na inilalahad sa Tagalog ang ilog at ang pantanging pangalan nito, habang pinananatili ang paglalarawan dito bilang “malaki.”
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: natuyo ang tubig nito
  rationale: Ang “natuyo” ay likas na Tagalog para sa pasibong pangyayari at resultang ipinahihiwatig ng aorist passive.
- source_word: ἵνα ἑτοιμασθῇ ἡ ὁδὸς
  choice: upang maihanda ang daan
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα, at ng “maihanda” ang pasibong anyo.
- source_word: τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: ng mga haring manggagaling sa sinisikatan ng araw
  rationale: Pinananatili ang matingkad na idyomang “pagsikat ng araw” sa halip na agad itong pay simplihing “silangan”; ang “manggagaling” ay natural na nagpapahayag ng pinagmulan ng mga hari.
theological_decisions:
- issue: Kung tahasang tatawaging anghel ang “ikaanim”
  choice: “ang ikaanim,” nang walang idinagdag na “anghel”
  alternative: “ang ikaanim na anghel”
  rationale: Bagaman ipinakikilala ng konteksto ang mga tagapagbuhos bilang mga anghel, hindi inuulit ng talatang Griyego ang pangngalan. Pinananatili ng salin ang elipsis.
- issue: Kung bibigyang-kahulugan sa salin ang pagkatuyo ng Eufrates at pagdating ng mga hari
  choice: Tuwirang isinalin ang larawan nang walang paliwanag na simboliko.
  alternative: Ipaliwanag sa mismong teksto bilang pagsalakay o eskatolohikal na pagtitipon.
  rationale: Hindi ipinaliliwanag ng talata ang ganap na kahulugan ng apokaliptikong larawan, kaya hindi ito nilulutas o pinalalawak ng salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Eufrates,” ang karaniwang modernong anyo ng pangalan, at pinanatili ang apokaliptikong larawan ng pagsikat ng araw.
