id: REV.16.17
reference: Revelation 16:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: tl
  text: At ibinuhos ng ikapito sa hangin ang laman ng kaniyang mangkok. At isang malakas na tinig ang lumabas mula sa santuwaryo[a], mula sa trono, na nagsasabi, “Naganap na.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo.” Ang salitang Griyego na ναός ay mas tiyak na tumutukoy sa santuwaryo kaysa sa buong kompleks ng templo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Tapos na.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: ang ikapito
  rationale: 'Pinananatili ang elipsis ng Griyego: ordinal lamang ang tahasang nakasulat. Malinaw sa konteksto na ito ang ikapitong anghel, ngunit hindi idinagdag sa pangunahing teksto ang salitang ‘anghel.’'
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: ibinuhos ... ang laman ng kaniyang mangkok
  rationale: Sa Griyego, ang mangkok mismo ang gramatikal na layon bilang metonimiya para sa laman nito. Idinagdag ang ‘laman’ upang maging likas at hindi magmukhang mismong sisidlan ang inihagis o ibinuhos sa Tagalog.
- source_word: ἐπὶ τὸν ἀέρα
  choice: sa hangin
  rationale: Likas na Tagalog para sa patutunguhan ng pagbubuhos; hindi ipinipilit ang alanganing literal na ‘ibabaw ng hangin.’
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: isang malakas na tinig ang lumabas
  rationale: Pinananatili ang galaw ng ἐξῆλθεν at isinasalin ang φωνὴ μεγάλη sa karaniwang makabagong Tagalog.
- source_word: ἐκ τοῦ ναοῦ
  choice: mula sa santuwaryo
  rationale: Ang ναός ay tumutukoy nang mas tiyak sa banal na santuwaryo, hindi sa buong bakuran o kompleks ng templo.
- source_word: ἀπὸ τοῦ θρόνου
  choice: mula sa trono
  rationale: Pinananatili bilang ikalawang paglalarawan sa pinagmulan ng tinig, sa halip na pagsamahin o alisin.
- source_word: λέγουσα
  choice: na nagsasabi
  rationale: Likas na paglilipat ng pambabaeng participle na tumutugma sa φωνή; sa Tagalog ay walang kailangang markang kasarian.
- source_word: Γέγονεν
  choice: Naganap na
  rationale: Ipinahahayag ang natapos na pangyayari at ang nananatiling bunga nito. Ang ‘na’ ay natural na naghahatid ng resultative o completed sense sa Tagalog.
theological_decisions:
- issue: Saklaw ng ναός sa makalangit na tagpo
  choice: santuwaryo
  alternative: templo
  rationale: Pinananatili ng ‘santuwaryo’ ang mas tiyak na kahulugan ng ναός at hindi pinalalawak ang larawan tungo sa buong kompleks ng templo.
- issue: Pormula ng katuparan sa Γέγονεν
  choice: Naganap na
  alternative: Tapos na
  rationale: Pinananatili ang resultative perfect at ang sadyang hindi tinukoy na simuno o bagay na naganap. Iniiwasang gawing mas tahasang deklarasyon ng pagtatapos kaysa sa hinihingi ng pandiwang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘kaniyang’ bilang pormal ngunit karaniwang anyo. Pinanatili ang ‘ang ikapito’ nang walang idinagdag na ‘anghel,’ at ang dalawang pariralang pinagmulan—‘mula sa santuwaryo, mula sa trono’—upang maingatan ang anyo at bahagyang tensiyon ng Griyego.
