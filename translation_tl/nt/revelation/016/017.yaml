  naturalness: Makabago at marangal ang Tagalog. Ang ayos na «ibinuhos ng ikapito sa hangin ang laman ng kaniyang mangkok» ay malinaw at angkop sa matayog na rehistro. Ang «na nagsasabi» ay katanggap-tanggap na paraan upang ilipat ang participle na λέγουσα.
