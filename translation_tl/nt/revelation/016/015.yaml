id: REV.16.15
reference: Revelation 16:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: tl
  text: “Tingnan ninyo,[a] dumarating ako na tulad ng isang magnanakaw. Pinagpala ang nananatiling gising at nag-iingat ng kanyang mga damit, upang hindi siya maglakad nang hubad at makita nila ang kanyang kahihiyan—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Masdan ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas at marangal na panawag-pansin sa makabagong Filipino; pinananatili ang bigat ng babala sa apokaliptikong pahayag.
- source_word: ἔρχομαι
  choice: dumarating ako
  rationale: Ipinapahayag ang masigla at nalalapit na puwersa ng pangkasalukuyang anyong Griyego na may hinaharap na diwa.
- source_word: ὡς κλέπτης
  choice: na tulad ng isang magnanakaw
  rationale: Pinananatili ang paghahambing tungkol sa di-inaasahang pagdating, nang hindi ipinahihiwatig na magkatulad sila sa moral na katangian.
- source_word: μακάριος
  choice: Pinagpala
  rationale: Angkop sa anyo ng isang pagpapala at may higit na teolohikal na bigat kaysa sa simpleng 'masaya' o 'mapalad.'
- source_word: ὁ γρηγορῶν
  choice: ang nananatiling gising
  rationale: Pinananatili ang konkretong larawan ng pagpupuyat habang bukas pa rin ang metaporikal na diwa ng pagiging mapagbantay.
- source_word: τηρῶν
  choice: nag-iingat
  rationale: Saklaw nito ang pag-iingat, pagbabantay, at pagpapanatili nang hindi labis na tinutukoy kung paano iniingatan ang mga damit.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ng kanyang mga damit
  rationale: Karaniwan at dignidad na Filipino para sa maramihang ἱμάτια, habang nananatili ang maaaring simbolikong kabuluhan.
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Malinaw na pinananatili ang negatibong layunin ng sugnay.
- source_word: γυμνὸς περιπατῇ
  choice: siya maglakad nang hubad
  rationale: Pinananatili ang kongkretong larawan ng paglalakad na hubad at ang kaugnay nitong pagkalantad.
- source_word: βλέπωσιν
  choice: makita nila
  rationale: Pinananatiling di-tiyak ang ikatlong panauhang maramihang simuno ng pandiwang Griyego.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: ang kanyang kahihiyan
  rationale: Naipahahayag kapwa ang kahiya-hiyang pagkalantad at ang dungis sa dangal, nang hindi inuulit lamang ang 'hubad.'
theological_decisions:
- issue: Metaporikal na puwersa ng mga damit, kahubaran, at kahihiyan
  choice: Panatilihin ang kongkretong larawan nang walang paliwanag na alegorikal sa pangunahing teksto.
  alternative: Tukuyin ang mga damit bilang moral na kahandaan o matuwid na gawa, at ang kahubaran bilang kahihiyan sa paghuhukom.
  rationale: May malinaw na simbolikong posibilidad sa konteksto ng Pahayag, ngunit hindi ito tuwirang nililinaw ng mismong Griyego; kaya pinananatili ang teolohikal na tensiyon.
- issue: Masculine singular na kinatawang pagtukoy
  choice: Gamitin ang isahang 'siya' at 'kanyang.'
  alternative: Gawing maramihan at neutral, gaya ng 'ang mga nananatiling gising' at 'kanilang.'
  rationale: Ang Griyego ay nasa panlalaking isahan ngunit gumaganap bilang kinatawang pahayag; ang isahang anyo ang pinakamalapit sa gramatika nang hindi nililimitahan ang aplikasyon.
translation_notes:
  register: Makabago at dignidad na Filipino na may bahagyang maringal na himig na angkop sa Pahayag. Ginamit ang 'Tingnan ninyo' sa halip na mas arkaikong 'Narito,' at pinanatili ang gitling sa hulihan dahil nagpapatuloy ang mas malaking salaysay.
