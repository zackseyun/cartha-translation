  naturalness: Likas at malinaw ang modernong Filipino, habang may marangal na himig na angkop sa Pahayag. Ang “nanatiling gising,” “nag-iingat ng kanyang mga damit,” at “maglakad nang hubad” ay madaling maunawaan at pinananatili ang kongkretong larawan ng Griyego.
  terminology: Ang “Pinagpala,” “mga damit,” “hubad,” at “kahihiyan” ay angkop at pare-pareho sa register. Hindi pinalalawak ng salin ang simbolismo ng damit at kahubaran tungo sa isang partikular na doktrinal na pagpapakahulugan.
