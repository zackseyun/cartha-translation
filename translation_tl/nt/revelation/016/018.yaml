  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: tl
  text: At nagkaroon ng mga kidlat, mga tunog, at mga kulog, at nagkaroon ng isang malakas na lindol, na ang gaya nito ay hindi pa kailanman nangyari mula nang magkaroon ng mga tao sa lupa—gayon na lamang kalakas ang lindol na iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: mga kidlat
  rationale: Likas at malinaw na katawagan sa Filipino para sa maramihang pagkidlat; ipinahihiwatig ng konteksto ang paulit-ulit na mga kislap.
- source_word: φωναὶ
  choice: mga ugong
  rationale: Maaaring mangahulugan ang φωναί ng mga tinig o mga tunog. Sa hanay ng kidlat at kulog, ang “mga ugong” ay natural na di-personal na tunog nang hindi ipinapalagay na may nagsasalita.
- source_word: βρονταί
  choice: mga kulog
  rationale: Karaniwang Filipino para sa maramihan o paulit-ulit na pagdagundong ng kulog.
- source_word: σεισμὸς μέγας
  choice: isang napakalakas na lindol
  rationale: Ang “napakalakas” ay natural na nagpapahayag ng pambihirang tindi ng μέγας sa kontekstong ito.
- source_word: οἷος οὐκ ἐγένετο
  choice: isang lindol na hindi pa nangyari
  rationale: 'Pinananatili ang diwa ng paghahambing: walang naunang lindol na katulad nito.'
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: mula nang magkaroon ng mga tao sa lupa
  rationale: Ang ἄνθρωποι ay tumutukoy sa sangkatauhan, hindi lamang sa mga lalaki; ang “magkaroon” ay natural na Filipino para sa pag-iral ng mga tao sa lupa.
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: gayon na lamang kalakas ang lindol na iyon
  rationale: Pinananatili ang mariing pag-uulit at sukdulang antas ng lindol sa hulihan ng pangungusap.
theological_decisions:
- issue: Saklaw ng ἄνθρωποι sa makasaysayang paghahambing
  choice: mga tao
  alternative: mga lalaki; sangkatauhan
  rationale: Generic at inklusibo ang tinutukoy na sangkatauhan. Ang “mga tao” ang pinakanatural at tumpak sa modernong Filipino, nang hindi nililimitahan ang kahulugan sa kalalakihan.
- issue: Kahulugan ng φωναί sa eksenang apokaliptiko
  choice: mga ugong
  alternative: mga tinig; mga tunog
  rationale: Tunay na maaaring mangahulugan ng “mga tinig” o “mga tunog” ang salita. Pinili ang “mga ugong” dahil sa kasamang kidlat at kulog, ngunit hindi ito ipinakahulugang pagsasalita o mensahe.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang maindayog na pag-uulit ng “nagkaroon” at “lindol,” gayundin ang mariing pangwakas na paglalarawan. Walang talababa dahil walang alternatibong kailangang ilagay upang maunawaan nang tumpak ang talata.
