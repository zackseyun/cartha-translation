revisions:
- from: At nagkaroon ng mga kidlat, mga ugong, at mga kulog; at nagkaroon ng isang napakalakas na lindol—isang lindol na hindi pa nangyari mula nang magkaroon ng mga tao sa lupa, gayon na lamang kalakas ang lindol na iyon.
  to: At nagkaroon ng mga kidlat, mga tunog, at mga kulog, at nagkaroon ng isang malakas na lindol, na ang gaya nito ay hindi pa kailanman nangyari mula nang magkaroon ng mga tao sa lupa—gayon na lamang kalakas ang lindol na iyon.
  rationale: Pinalitan ang mas tiyak na “mga ugong” ng mas neutral na “mga tunog,” ibinaba ang unang paglalarawan ng lindol sa “malakas” upang hindi maunahan ang pangwakas na pagpapasidhi, at ginawang hayag ang paghahambing na walang katulad na lindol. Walang talababa ang kailangan dahil ang salin ay hindi pumipili ng isang pinagtatalunang pagbasa o nagdaragdag ng interpretasyong dapat ipaliwanag.
