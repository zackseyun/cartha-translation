  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: tl
  text: At ibinuhos ng ikatlo ang kanyang mangkok sa mga ilog at sa mga bukal ng tubig, at naging dugo ang tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: ang ikatlo
  rationale: Pinananatili ang elipsis ng Griyego, na hindi tahasang inuulit ang ‘anghel’; malinaw sa agarang konteksto kung sino ang tinutukoy.
- source_word: ἐξέχεεν
  choice: ibinuhos
  rationale: Likas at tumpak na katumbas ng pagkilos na pagbuhos ng laman ng mangkok.
- source_word: φιάλην
  choice: mangkok
  rationale: Ang φιάλη ay isang malapad at mababaw na sisidlan; mas tumpak ang ‘mangkok’ kaysa sa tradisyonal ngunit mapanlinlang na ‘sisidlang maliit’ o ‘bote.’
- source_word: εἰς τοὺς ποταμούς
  choice: sa mga ilog
  rationale: Sa Filipino, natural na ipinahahayag ng ‘ibinuhos ... sa’ ang patungong kilos na taglay ng εἰς.
- source_word: πηγὰς τῶν ὑδάτων
  choice: mga bukal ng tubig
  rationale: Ang ‘bukal ng tubig’ ay malinaw at karaniwang katumbas ng πηγή, at pinananatili ang ugnayang henitibo.
- source_word: ἐγένετο αἷμα
  choice: naging dugo ang mga iyon
  rationale: Malinaw na tumutukoy ang ‘mga iyon’ sa mga ilog at mga bukal. Bagaman isahan ang pandiwang Griyego, natural sa Filipino ang maramihang reperensiya habang pinananatili ang diwa ng pagbabago tungo sa dugo.
theological_decisions:
- issue: Ipinahihiwatig na simuno ng ἐγένετο
  choice: Ang mga ilog at mga bukal ay naging dugo
  alternative: Ang tubig ay naging dugo
  rationale: Ang pinakamalapit na mga tinutukoy ay ang mga ilog at mga bukal ng tubig. Hindi na kailangang magdagdag ng doktrinal na paliwanag; nililinaw lamang ng panghalip ang ugnayang gramatikal sa natural na Filipino.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang elipsis na ‘ang ikatlo’ sa halip na idagdag ang ‘anghel,’ at iniwasan ang makalumang katawagang hindi kailangan.
