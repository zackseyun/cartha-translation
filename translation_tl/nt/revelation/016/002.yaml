id: REV.16.2
reference: Revelation 16:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: tl
  text: Umalis ang una at ibinuhos ang kaniyang mangkok sa lupa. At nagkaroon ng mapaminsala at malubhang sugat[a] ang mga taong may tatak ng halimaw at sumasamba sa larawan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masama at nakapipinsalang sugat.” Gumagamit ang Griyego ng dalawang matitinding pang-uri, κακόν at πονηρόν, upang idiin ang tindi at kasamaan ng salot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: humayo
  rationale: Nasa sunod-sunod na salaysay ang aorist na pandiwa. Ang “humayo” ay nagpapahayag ng pagkilos nang hindi dinaragdagan ang diin ng Griyego.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Ginamit ang pang-uri bilang pangngalan at tumutukoy sa una sa pitong anghel ayon sa konteksto. Pinananatili ng salin ang pagkakasabi ng Griyego nang hindi idinaragdag ang “anghel.”
- source_word: ἐξέχεεν
  choice: ibinuhos
  rationale: Karaniwang kahulugan ng ἐκχέω ang pagbuhos palabas, at ang “ibinuhos” ay natural sa paulit-ulit na larawan ng mga mangkok sa Apocalipsis.
- source_word: φιάλην
  choice: mangkok
  rationale: Tumutukoy ang φιάλη sa isang mababaw na sisidlan. Ang “mangkok” ay malinaw at madaling maunawaan, samantalang ang “sisidlan” ay hindi gaanong tiyak.
- source_word: εἰς τὴν γῆν
  choice: sa lupa
  rationale: Ipinahihiwatig ng εἰς ang lupa bilang puntirya ng pagbuhos. Sa Filipino, likas na ipinahahayag ito ng “sa lupa,” na maaari ring sumaklaw sa diwang “sa daigdig” ayon sa konteksto.
- source_word: ἐγένετο
  choice: nagkaroon
  rationale: Ipinakikilala ng γίνομαι ang naging bunga ng pagbuhos. Natural na inilalarawan ng “nagkaroon” ang paglitaw ng sugat sa mga tao.
- source_word: ἕλκος
  choice: sugat
  rationale: Ang ἕλκος ay isang singaw, ulser, o nagnanaknak na sugat. Ang “sugat” ang pinakanauunawaang salita at hindi labis na klinikal o tiyak.
- source_word: κακὸν καὶ πονηρὸν
  choice: mapaminsala at malubha
  rationale: Pinagsasama ng Griyego ang dalawang matitinding pang-uri upang idiin ang tindi ng salot. Pinananatili ng pares na ito ang pagkakaiba ng pinsalang dulot at bigat ng sugat nang hindi ito inilalarawang may moral na kasamaan.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: ang mga taong
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa kalalakihan. Ang ayos ng pangungusap sa Filipino ay natural na ginagawang paksa ang mga taong tinamaan.
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: tatak ng halimaw
  rationale: Ang “tatak” ay malinaw na katumbas ng χάραγμα, at ang “halimaw” ay natural na tawag sa apokaliptikong θηρίον sa kontekstong ito.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: sumasamba sa larawan nito
  rationale: Ang προσκυνέω ay tumutukoy rito sa pagsamba o pagyukod bilang pagsamba. Ang “nito” ay malinaw na bumabalik sa halimaw at hindi nagtatakda ng kasarian.
theological_decisions:
- issue: Ang dalawang pang-uri na κακὸν καὶ πονηρὸν para sa ἕλκος
  choice: mapaminsala at malubhang sugat
  alternative: masama at napakasakit na sugat; nakapandidiri at masamang sugat
  rationale: Magkalapit ngunit hindi lubos na magkapareho ang dalawang pang-uri, at kapuwa nagpapatingkad sa bigat ng salot. Iniiwasan ng salin na ipakahulugang moral na masama ang sugat habang pinananatili ang tindi ng orihinal.
- issue: Kung sino ang mga hinatulan
  choice: ang mga taong may tatak ng halimaw at sumasamba sa larawan nito
  alternative: ang mga tao sa pangkalahatan
  rationale: Tiyak na nililimitahan ng dalawang participial phrase ang salot sa mga kumakampi sa halimaw sa pamamagitan ng pagtanggap sa tatak at pagsamba sa larawan nito. Hindi pinalalawak ng salin ang saklaw nang higit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling sunod-sunod na daloy ng salaysay at ang substantibong “ang una,” habang iniwasan ang pagdaragdag ng “anghel” na wala sa talata mismo.
