  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: tl
  text: At tumakas ang bawat pulo[a], at hindi natagpuan ang mga bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naglaho.” Literal na “tumakas” ang pandiwang Griyego, kaya napapanatili ang matingkad na pagbibigay-katauhan sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: bawat pulo
  rationale: 'Ang isahang νῆσος na may πᾶσα ay distributibo: bawat isang pulo. Likas sa modernong Filipino ang “bawat pulo.”'
- source_word: ἔφυγεν
  choice: tumakas
  rationale: Pinananatili ng “tumakas” ang literal at masiglang pagsasatao sa φεύγω, sa halip na agad itong ipaliwanag bilang “naglaho.”
- source_word: ὄρη
  choice: ang mga bundok
  rationale: Ang maramihang ὄρη ay tuwirang tumutukoy sa mga bundok. Kailangan ang panandang “ang mga” sa natural na balangkas ng pangungusap sa Filipino.
- source_word: οὐχ εὑρέθησαν
  choice: hindi na natagpuan
  rationale: Tapat ito sa pasibong “hindi natagpuan”; ang “na” ay natural na naghahayag ng resultang kalagayan sa konteksto ng kosmikong pagyanig nang hindi tahasang ginagawang “naglaho” ang pandiwa.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang magkatugmang pag-uugnay at ang sunod-sunod na estilo ng Pahayag.
theological_decisions:
- issue: Kung bibigyang-kahulugan bilang literal o simboliko ang pagkawala sa apokaliptikong larawan
  choice: 'Panatilihin ang kongkretong larawan: tumakas ang mga pulo at hindi na natagpuan ang mga bundok'
  alternative: Isalin nang interpretibo bilang “naglaho” o “nawala”
  rationale: Hindi nilulutas ng salin kung literal o simboliko ang tagpo; pinananatili nito ang matingkad na larawan at teolohikal na tensiyon ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pulo” at “bundok” bilang karaniwan at malinaw na mga salita; pinanatili ang payak at magkahanay na ayos ng orihinal.
