  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: tl
  text: sapagkat ibinuhos nila ang dugo ng mga banal at ng mga propeta[a], at binigyan mo sila ng dugo upang inumin; karapat-dapat sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinadanak nila ang dugo ng mga banal at ng mga propeta.” Literal na “ibinuhos” ang pandiwang Griyego, na umaalingawngaw rin sa pagbubuhos ng mga mangkok ng paghatol sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “karapat-dapat sila” ay nangangahulugang nararapat sa kanila ang hatol na ito; ang layon ay ipinahiwatig sa konteksto ngunit hindi tahasang sinabi sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan para sa pahayag sa naunang talata at nagpapanatili ng marangal na himig.
- source_word: αἷμα
  choice: dugo
  rationale: Pinanatili ang literal na salita sa dalawang paglitaw upang maipakita ang tuwirang pagtutumbas sa paghatol.
- source_word: ἁγίων
  choice: mga banal
  rationale: Karaniwang tawag sa Apocalipsis para sa mga taong itinalaga sa Diyos; hindi nito ipinahihiwatig ang mas huling kategorya ng mga kinanonisang santo.
- source_word: προφητῶν
  choice: mga propeta
  rationale: Tuwiran at likas na katumbas na tumutukoy sa mga propetang pinatay.
- source_word: ἐξέχεαν
  choice: ibinuhos
  rationale: Pinananatili ang literal na larawang 'ibinuhos,' na umaalingawngaw rin sa pagbubuhos ng mga mangkok sa konteksto.
- source_word: αὐτοῖς
  choice: sila
  rationale: Likas na Tagalog na layon ng pandiwang 'binigyan,' na tumutukoy sa mga nagbuhos ng dugo.
- source_word: δέδωκας
  choice: binigyan mo
  rationale: Ang aspektong ganap ng Griyego ay natural na naipahahayag dito ng Tagalog na perpektibong anyo; malinaw ang natapos na gawa ng Diyos.
- source_word: πιεῖν
  choice: upang inumin
  rationale: Likas na pagpapahayag ng layon o itinakdang gamit ng dugong ibinigay sa kanila.
- source_word: ἄξιοί εἰσιν
  choice: karapat-dapat sila rito
  rationale: Pinananatili ang pormal at panghukumang pahayag. Idinagdag ang 'rito' bilang likas na Tagalog na pantukoy sa hatol na malinaw sa konteksto, nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Wika ng gumaganting katarungan
  choice: Pinanatili ang matinding pahayag na binigyan sila ng dugo upang inumin at karapat-dapat sila rito.
  alternative: Ginantihan mo sila; nararapat lamang iyon sa kanila.
  rationale: Tuwirang inilalarawan ng Griyego ang proporsiyonal na paghatol. Hindi ito dapat palambutin o gawing pangkalahatang pahayag lamang tungkol sa kaparusahan.
- issue: Tinutukoy ng ἁγίων
  choice: mga banal
  alternative: mga taong banal
  rationale: Tumutukoy ito nang malawakan sa bayan ng Diyos at hindi sa isang mas huling, teknikal na pangkat ng mga kinanonisang santo.
- issue: Kahulugan ng ἄξιοί εἰσιν
  choice: karapat-dapat sila rito
  alternative: nararapat sa kanila ito
  rationale: Sa konteksto, ang pagiging 'karapat-dapat' ay nangangahulugang nararapat nilang tanggapin ang hatol, hindi na sila ay mabuti o kapuri-puri.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang matinding imahen ng dugo at ang pag-uulit nito, gayundin ang ugnayan ng 'ibinuhos' sa mga mangkok sa nakapaligid na salaysay.
