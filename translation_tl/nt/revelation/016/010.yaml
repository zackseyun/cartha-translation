id: REV.16.10
reference: Revelation 16:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: tl
  text: At ibinuhos ng ikalima[a] ang kanyang mangkok sa trono ng halimaw, at nagdilim ang kaharian nito[b]; nginangatngat nila ang kanilang mga dila dahil sa sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ipinahihiwatig ng konteksto: “ang ikalimang anghel.” Sa Griyego, “ang ikalima” lamang ang nakasulat.'
    reason: implicit_referent
  - marker: b
    text: Maaari ring isalin na “nalubog sa dilim ang kaharian nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: ang ikalima
  rationale: Pinananatili ang ordinal na nasa Griyego nang hindi idinaragdag sa pangunahing teksto ang “anghel,” na ipinahihiwatig lamang ng konteksto.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: ibinuhos ... ang kanyang mangkok
  rationale: Ang “ibinuhos” ang likas na katumbas sa paulit-ulit na pormula ng mga paghuhukom sa kabanata; ang “mangkok” ay malinaw at makabagong salin ng φιάλη.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: sa trono ng halimaw
  rationale: Tuwirang pinananatili ang apokaliptikong larawan at ang nakaugaliang kahulugan ng θηρίον sa Pahayag.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ang kaharian nito
  rationale: Ang “kaharian” ay tuwirang katumbas ng βασιλεία. Ang “nito” ay likas sa Tagalog para sa halimaw at hindi nagpapasok ng di-kailangang pagpapasiya tungkol sa kasarian o personipikasyon.
- source_word: ἐγένετο ... ἐσκοτωμένη
  choice: nagdilim
  rationale: Maikli at likas na ipinahahayag ang pagpasok ng kaharian sa kalagayang madilim, habang pinananatili sa talababa ang mas tahasang resultative na salin.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: nginangatngat nila ang kanilang mga dila
  rationale: Ang “nginangatngat” ay naghahatid ng matinding paulit-ulit o nagpapatuloy na pagkagat na ipinahihiwatig ng imperfect na ἐμασῶντο.
- source_word: ἐκ τοῦ πόνου
  choice: dahil sa sakit
  rationale: Malinaw at likas na ipinapahayag ang sanhi ng kanilang ginagawa.
theological_decisions:
- issue: Kung tahasang tatawaging anghel ang ikalima
  choice: ang ikalima
  alternative: ang ikalimang anghel
  rationale: Bagaman malinaw sa konteksto na ang tinutukoy ay ang ikalimang anghel, ordinal lamang ang tahasang nasa Griyego; kaya hindi ito dinaragdagan sa pangunahing teksto.
- issue: Paglalarawan sa pagdidilim ng kaharian
  choice: Nagdilim ang kaharian nito
  alternative: Nalubog sa dilim ang kaharian nito
  rationale: Pinipili ang payak at likas na pahayag na hindi nagdaragdag ng metaporang higit sa nasa Griyego; inilalahad ang mas masidhing alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang matinding apokaliptikong larawan nang walang dagdag na paliwanag sa pangunahing teksto.
