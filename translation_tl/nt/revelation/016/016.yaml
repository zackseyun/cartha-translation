  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: tl
  text: At tinipon niya sila sa lugar na sa wikang Hebreo ay tinatawag na Armagedon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, isahan ang pandiwa: “tinipon niya/niyon sila.” Hindi tahasang pinangalanan dito ang tagaganap; sa naunang konteksto, ang masasamang espiritu ang lumalabas upang tipunin ang mga hari (tal. 13–14).'
    reason: alternative_reading
  - marker: b
    text: O “sa wikang Hebreo/Aramaico.” Sa Pahayag, ang “sa wikang Hebreo” ay maaaring tumukoy sa anyong Semitiko ng pangalan at hindi kinakailangang magtakda ng mahigpit na pagkakaiba sa pagitan ng Hebreo at Aramaico.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: tinipon niya
  rationale: Ang pandiwang Griyego ay ikatlong panauhang isahan (“tinipon niya/niyon”). Pinananatili ng saling ito ang gramatikal na bilang at ang hindi tahasang pinangalanang tagaganap; hindi rin tinutukoy ng Tagalog na “niya” ang kasarian.
- source_word: αὐτοὺς
  choice: sila
  rationale: Likas na layon ng pandiwang “tinipon” sa Tagalog at tumutukoy sa mga hari na binabanggit sa konteksto.
- source_word: τὸν τόπον
  choice: sa lugar
  rationale: Ang “lugar” ang tuwiran, natural, at marangal na katumbas ng τόπος.
- source_word: τὸν καλούμενον
  choice: na ... ay tinatawag na
  rationale: Pinananatili nito ang pasibong diwa ng participle habang natural ang ayos sa modernong Tagalog.
- source_word: Ἑβραϊστὶ
  choice: sa Hebreo
  rationale: Tuwirang salin ito ng Ἑβραϊστί. Ang posibilidad na tumutukoy ito nang mas malawak sa wikang Semitiko ng Judea, kabilang ang Aramaico, ay inilalagay sa talababa.
- source_word: Ἁρμαγεδών
  choice: Armagedon
  rationale: Transliterasyon ng pangalang Griyego sa karaniwang baybay at bigkas sa Filipino; hindi ipinapalagay sa pangunahing teksto ang isang tiyak na etimolohiya ng pangalan.
theological_decisions:
- issue: Ang tagaganap ng pagtitipon
  choice: tinipon niya sila
  alternative: tinipon nila sila / tinipon sila
  rationale: Isahan ang anyong Griyego, kaya pinananatili iyon sa pangunahing teksto. Gayunman, hindi pinapangalanan ng talata ang tagaganap, at maaaring iugnay ng konteksto sa mga espiritung lumalabas upang tipunin ang mga hari sa talata 13–14. Hindi nilulutas ng salin ang pagkakakilanlan ng tagaganap.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “At” upang katawanin ang καί at mapanatili ang ugnayang pasalaysay. Ang “niya” ay sadyang hindi tumutukoy sa kasarian at nagpapanatili sa hindi pinangalanang isahang tagaganap.
