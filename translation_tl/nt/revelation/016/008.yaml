id: REV.16.8
reference: Revelation 16:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: tl
  text: At ibinuhos ng ikaapat ang kanyang mangkok sa araw[a], at ipinagkaloob dito na pasuin ng apoy ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at ipinagkaloob dito na pasuin ang mga tao sa apoy.” Malamang na ang panghalip na “dito” ay tumutukoy sa araw.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: ang ikaapat
  rationale: Ginamit nang pangngalan ang may-artikulong pang-uri. Ipinahihiwatig ng konteksto na ito ang ikaapat na anghel, ngunit hindi tahasang inuulit sa talata ang salitang “anghel.”
- source_word: ἐξέχεεν
  choice: ibinuhos
  rationale: Karaniwan at natural na salin sa konteksto ng sunod-sunod na pagbuhos ng mga mangkok ng hatol.
- source_word: φιάλην
  choice: mangkok
  rationale: Tumutukoy ito sa isang malapad na sisidlan o mangkok; malinaw at makabago ang “mangkok” at angkop sa larawan sa Pahayag.
- source_word: ἐπὶ τὸν ἥλιον
  choice: sa araw
  rationale: Ipinakikita ng ἐπί na ang araw ang pinuntirya o binuhusan ng laman ng mangkok.
- source_word: ἐδόθη αὐτῷ
  choice: ipinagkaloob dito
  rationale: Pinananatili ang balintiyak na anyo nang hindi tahasang pinapangalanan ang nagkaloob. Ang “dito” ay nagpapanatili rin sa panghalip ng Griyego at malamang na tumutukoy sa araw.
- source_word: καυματίσαι
  choice: pasuin
  rationale: Tiyak nitong ipinahahayag ang pagdudulot ng napakatinding init o pagkasunog.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Pangkalahatan ang tinutukoy ng ἄνθρωπος at hindi lamang mga lalaki.
- source_word: ἐν πυρί
  choice: ng apoy
  rationale: Natural sa Filipino ang “pasuin ng apoy,” at naipahahayag nito ang apoy bilang paraan o kasangkapan ng pagpaso.
theological_decisions:
- issue: Di-tahasang banal na ahensiya sa ἐδόθη
  choice: Panatilihin ang balintiyak na “ipinagkaloob” nang hindi pinapangalanan ang Diyos.
  alternative: “Binigyan ito ng Diyos” o “pinahintulutan ang araw.”
  rationale: Karaniwan sa Pahayag ang ganitong balintiyak na maaaring magpahiwatig ng banal na pahintulot o pagkakaloob. Ang tahasang pagbanggit sa Diyos ay magdaragdag ng hindi nakasulat sa pangungusap.
- issue: Tinutukoy ng αὐτῷ
  choice: Malamang na tumutukoy ang “dito” sa araw.
  alternative: Ang ikaapat na anghel o isang di-tiyak na tagaganap.
  rationale: Ang araw ang pinakamalapit na maaaring tinutukoy ng panghalip, at ang pagpaso sa mga tao ay likas na umaangkop sa araw bilang kasangkapan ng hatol. Pinananatili ng talababa ang bahagyang kalabuan ng panghalip.
- issue: Pangkalahatang kahulugan ng ἀνθρώπους
  choice: “ang mga tao”
  alternative: “ang mga lalaki” o “sangkatauhan”
  rationale: Pangkalahatan ang saklaw ng salita rito; hindi ito tumutukoy lamang sa kasariang lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling “ang ikaapat” sa halip na idagdag ang “anghel,” at iniwasang tahasang pangalanan ang Diyos bilang tagapagkaloob dahil hindi siya pinangalanan sa Griyego.
