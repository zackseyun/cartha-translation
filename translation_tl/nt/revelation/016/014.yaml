revisions:
- from: Sapagkat sila ay mga espiritu ng mga demonyo[a] na gumagawa ng mga tanda. Lumalabas sila at pumupunta sa mga hari ng buong sanlibutan[b] upang tipunin ang mga ito para sa labanan sa dakilang araw ng Diyos na Makapangyarihan sa Lahat—
  to: Sapagkat sila ay mga espiritu ng mga demonyo[a] na gumagawa ng mga tanda. Lumalabas sila patungo sa mga hari ng buong sanlibutan[b] upang tipunin ang mga hari para sa labanan sa dakilang araw ng Diyos na Makapangyarihan sa Lahat—
  rationale: Gumawa lamang ng maliliit na pagbabago para sa daloy at malinaw na pagtukoy sa mga hari. Pinananatili ng salin ang genitibong “mga espiritu ng mga demonyo,” ang neutral na “mga tanda,” ang pandaigdig na saklaw ng οἰκουμένη, ang layuning ipinahihiwatig ng συναγαγεῖν, at ang marangal na banal na titulo. Hindi binabago ng “sa dakilang araw” ang ipinahihiwatig na ugnayan ng labanan at ng dakilang araw; ito ang likas na Filipino para sa konstruksyong ito.
