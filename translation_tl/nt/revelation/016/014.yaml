id: REV.16.14
reference: Revelation 16:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: tl
  text: Sapagkat sila ay mga espiritu ng mga demonyo[a] na gumagawa ng mga tanda. Lumalabas sila patungo sa mga hari ng buong sanlibutan[b] upang tipunin ang mga hari para sa labanan sa dakilang araw ng Diyos na Makapangyarihan sa Lahat—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga demonyong espiritu.”
    reason: lexical_alternative
  - marker: b
    text: O “ng buong daigdig na tinitirhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: mga espiritu ng mga demonyo
  rationale: Malapit itong tumutugma sa genitibong parirala at likas sa Filipino; hindi nito ipinapasya kung ang genitibo ay pinagmulan o paglalarawan lamang.
- source_word: ποιοῦντα σημεῖα
  choice: gumagawa ng mga tanda
  rationale: Pinananatili ng “mga tanda” ang apokaliptikong katawagan nang hindi ipinapalagay kung ang mga ito ay pandaraya lamang o tunay na mga kababalaghan.
- source_word: ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς
  choice: Lumalabas sila at pumupunta sa mga hari
  rationale: Nililinaw sa natural na Filipino ang paglabas at pagkilos patungo sa mga hari. Ang pangmaramihang “sila” ay sumusunod sa tinutukoy na mga espiritu sa kabila ng di-pangkaraniwang bilang ng pandiwang Griyego.
- source_word: τῆς οἰκουμένης ὅλης
  choice: ng buong sanlibutan
  rationale: Ang “sanlibutan” ay dignidad at pamilyar na salin para sa buong daigdig na tinitirhan at saklaw ng paghaharing pantao.
- source_word: συναγαγεῖν αὐτοὺς
  choice: upang tipunin ang mga ito
  rationale: Malinaw na ipinapahayag ang layunin ng pagpunta ng mga espiritu; tumutukoy ang “mga ito” sa mga hari.
- source_word: εἰς τὸν πόλεμον
  choice: para sa labanan
  rationale: Natural na inilalarawan ang pagtitipon bilang paghahanda para sa tiyak na tunggalian.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: sa dakilang araw
  rationale: Ang “sa” ay likas na Filipino para sa labanang magaganap sa dakilang araw, habang pinananatili ang maringal na himig.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: ng Diyos na Makapangyarihan sa Lahat
  rationale: Isinasalin ang banal na titulong παντοκράτωρ sa malinaw, kasalukuyan, at marangal na Filipino.
theological_decisions:
- issue: Kalikasan ng mga tanda
  choice: Tinatawag lamang na “mga tanda” ang kanilang ginagawa.
  alternative: Tawagin ang mga ito na mga huwad na himala o tahasang tunay na himala.
  rationale: Hindi tinutukoy ng talata ang mekanismo o antas ng pagiging tunay ng mga tanda; kaya hindi dapat lutasin ng salin ang sadyang tensiyong ito.
- issue: Ugnayan ng πνεύματα at δαιμονίων
  choice: “mga espiritu ng mga demonyo”
  alternative: “mga demonyong espiritu”
  rationale: Pinananatili ng genitibong anyo ang posibleng ugnayan ng pag-aari, pinagmulan, o paglalarawan sa halip na paliitin ito sa isang attributibong pagbasa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Sapagkat” upang ipakita ang paliwanag na γάρ, “sanlibutan” para sa pandaigdig na saklaw ng οἰκουμένη, at em dash sa hulihan upang mapanatili ang pagpapatuloy ng pangungusap patungo sa susunod na talata.
