  terminology: Ang “mga espiritu ng mga demonyo,” “mga tanda,” “buong sanlibutan,” at “Diyos na Makapangyarihan sa Lahat” ay angkop. Hindi binibigyang-kahulugan nang lampas sa teksto ang uri o pagiging tunay ng mga tanda. Ang salin ng παντοκράτωρ ay malinaw at marangal.
