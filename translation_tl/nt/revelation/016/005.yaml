id: REV.16.5
reference: Revelation 16:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: tl
  text: At narinig ko ang anghel ng mga tubig na nagsabi[a], “Matuwid ka, ikaw na umiiral at umiral, ang Banal, sapagkat hinatulan mo ang mga bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito, mas mahaba ang titulo, gaya ng “ikaw na umiiral at umiral at darating.” Malamang na iniayon ito sa mga kahawig na pormula sa ibang bahagi ng Pahayag. Ang tekstong sinusunod dito ay: “ikaw na umiiral at umiral, ang Banal.”'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: ang anghel ng mga tubig
  rationale: Pinananatili ang genitibong anyo ng Griyego. Sa konteksto, maaari itong tumukoy sa anghel na kaugnay ng mga tubig o may pamamahala sa mga ito, ngunit hindi iyon tahasang nililinaw ng parirala.
- source_word: Δίκαιος
  choice: Matuwid
  rationale: Saklaw ng δίκαιος ang moral na katuwiran at katarungan. Ang “matuwid” ay angkop sa mapagpuring tono at hindi nililimitahan ang diwa sa legal na pagiging makatarungan lamang.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: ikaw na ngayon ay naririyan at noon pa man ay naririyan
  rationale: Inilalarawan nito ang patuloy na pag-iral ng Diyos sa kasalukuyan at nakaraan. Ginamit ang “naririyan” upang maging likas sa Tagalog at maiwasan ang malabong “ang umiiral at ang noon,” habang hindi idinaragdag ang nawawalang bahaging “darating.”
- source_word: ὁ ὅσιος
  choice: ang Banal
  rationale: Ang ὅσιος ay tumutukoy sa kabanalan o ganap na katapatan sa moral at tipanang diwa. Ang “ang Banal” ay malinaw at marangal na titulong Tagalog sa kontekstong ito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita ang dahilan kung bakit ipinahahayag na matuwid ang Diyos. Ang “sapagkat” ay angkop sa marangal na rehistro ng pangungusap.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Tuwirang pinananatili ang demonstratibong pananalita ng Griyego sa halip na ipalit ang mas interpretatibong “mga hatol na ito.”
- source_word: ἔκρινας
  choice: hinatulan mo
  rationale: Ang aorist ay inilalahad bilang naganap na pagkilos. Sa Tagalog, malinaw na naihahayag ng aspektong perpektibo sa “hinatulan” ang natapos na paghatol na tinutukoy ng pagpapahayag.
theological_decisions:
- issue: Ang titulong pantukoy sa Diyos ay walang inaasahang bahagi tungkol sa hinaharap
  choice: ikaw na ngayon ay naririyan at noon pa man ay naririyan, ang Banal
  alternative: ikaw na ngayon ay naririyan, noon pa man ay naririyan, at darating
  rationale: 'Sinusunod ng salin ang nakalimbag na SBLGNT: ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος. Hindi ito iniaangkop sa mas buong pormulang matatagpuan sa ibang bahagi ng Pahayag. Itinatala sa talababa ang ibang pagbasa ng ilang manuskrito.'
- issue: Ugnayan ng anghel sa mga tubig
  choice: ang anghel ng mga tubig
  alternative: ang anghel na namamahala sa mga tubig
  rationale: Ang genitibong Griyego ay maaaring magpahiwatig ng kaugnayan o pamamahala, ngunit hindi nito tahasang tinutukoy ang eksaktong relasyon. Pinananatili ng pangunahing salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang mapagpuring himig at ang kalabuan ng genitibong “anghel ng mga tubig.” Ang pormulang “ngayon ay naririyan at noon pa man ay naririyan” ay piniling mas natural kaysa isang matigas na pangngalang salin ng mga participle, bagaman may bahagyang pagpapaliwanag upang maipahayag ang eksistensiyal na diwa.
