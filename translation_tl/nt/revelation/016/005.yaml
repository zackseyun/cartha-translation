    issue: Ang “naririyan” ay hindi tumpak na salin ng mga pandiwang tumutukoy sa pag-iral.
    rationale: Ang ὁ ὢν at ὁ ἦν ay “ang umiiral/siya na umiiral” at “ang umiral/siya na umiral,” hindi “naririyan.” Ang kasalukuyan at nakaraang pang-abay na idinagdag sa draft ay nagpapaliwanag din nang lampas sa tahasang pahayag ng Griyego.
