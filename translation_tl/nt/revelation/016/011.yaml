  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang Diyos ng langit ay nilapastangan dahil sa mga kirot at sugat, at walang pagsisisi sa mga ginawa. Gayunman, ang “nilapastangan nila ang Diyos” ay maaaring magpahiwatig ng paglapastangan sa pamamagitan ng gawa, samantalang ang βλασφημέω ay tumutukoy lalo na sa mapanlait o lapastangang pagsasalita. Ang dating paliwanag sa talababa c ay nagdaragdag ng “at tumalikod,” na wala sa literal na anyo ng Griyego.'
  naturalness: Mas natural at mas tiyak sa modernong Filipino Tagalog ang “Naglapastangan sila laban sa Diyos” para sa pandiwang nakatuon sa pananalita. Ang “hindi sila nagsisi sa kanilang mga ginawa” ay mas tuwirang katumbas ng μετανοέω kaysa “hindi nila pinagsisihan,” na maaari ring mangahulugang nakaramdam lamang ng panghihinayang.
  terminology: Pinananatili ang “Diyos ng langit,” isang angkop na biblikal at marangal na titulo. Ang “mga kirot” at “mga sugat” ay malinaw na katumbas ng πόνοι at ἕλκη; ang alternatibong “mga ulser” ay angkop sa talababa. Ang “naglapastangan” at “nagsisi” ay pinananatili ang panrelihiyong bigat nang walang dagdag na doktrinal na paliwanag.
  issues:
  - severity: medium
    issue: Ang “nilapastangan nila ang Diyos” ay hindi tahasang nagmamarka na ang paglapastangan ay sa pamamagitan ng pananalita.
    rationale: Ang ἐβλασφήμησαν ay nagsasaad ng pagsasalitang mapanlait o lapastangan laban sa Diyos. Ang “Naglapastangan sila laban sa Diyos” ay mas tiyak at natural pa rin sa Tagalog.
  - severity: medium
    issue: Ang talababa c ay nagsasabing “hindi sila nagsisi at tumalikod mula sa kanilang mga gawa.”
    rationale: Walang pangatnig na “at” o hiwalay na pandiwang “tumalikod” sa Griyego. Ang ἐκ τῶν ἔργων αὐτῶν ay maaaring ipaliwanag bilang kaugnay ng pagsisisi/pagtalikod, ngunit ang nakasaad na “mas literal” ay dapat hindi magdagdag ng pandiwa.
