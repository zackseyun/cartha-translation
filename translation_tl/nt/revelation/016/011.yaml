id: REV.16.11
reference: Revelation 16:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: tl
  text: At naglapastangan[a] sila laban sa Diyos ng langit dahil sa kanilang mga kirot at mga sugat[b], at hindi sila nagsisi sa kanilang mga ginawa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilait” o “nagsalita ng masama laban sa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga ulser.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal na anyo: “hindi sila nagsisi mula sa kanilang mga gawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: nilapastangan
  rationale: Ipinahihiwatig ng βλασφημέω ang mapanirang o lapastangang pananalita laban sa Diyos. Pinananatili ng “nilapastangan” ang tuwirang panrelihiyong bigat ng salita.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: ang Diyos ng langit
  rationale: Tuwirang pinananatili nito ang marangal at biblikal na titulo sa pariralang Griyego.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: dahil sa kanilang mga kirot
  rationale: Sa konteksto, ang ἐκ ay may sanhiing diwa, at ang πόνος ay tumutukoy sa pisikal na sakit o kirot.
- source_word: ἑλκῶν
  choice: mga sugat
  rationale: Ang ἕλκος ay maaaring tumukoy sa sugat o ulser. Ang “mga sugat” ay malinaw at hindi labis na espesipikong terminong medikal.
- source_word: μετενόησαν
  choice: hindi nila pinagsisihan
  rationale: Sa Pahayag, ang μετανοέω ay may moral at panrelihiyong diwa ng pagsisisi, hindi lamang pagbabago ng isip.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: ang kanilang mga ginawa
  rationale: Kasunod ng μετανοέω, ipinahihiwatig ng ἐκ ang pagtalikod sa dating mga kilos. Likas sa modernong Tagalog ang “pinagsisihan ang kanilang mga ginawa,” habang iniiwasang dagdagan ang teksto ng salitang “masasama.”
theological_decisions:
- issue: Diwa ng inuulit na ἐκ
  choice: Ang kanilang mga kirot at sugat ang dahilan ng paglapastangan nila sa Diyos, ngunit hindi nila pinagsisihan ang kanilang mga ginawa.
  alternative: Maaaring isalin nang mas literal ang unang dalawang ἐκ bilang “mula sa kanilang mga kirot at sugat,” at ang huli bilang “tumalikod mula sa kanilang mga gawa.”
  rationale: Karaniwang sanhi ang diwa ng unang dalawang ἐκ sa kontekstong ito, samantalang kasama ng μετανοέω ang huling ἐκ ay nagpapahiwatig ng pagtalikod sa mga dating gawa. Pinananatili ng salin ang kaibahang ito nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nilapastangan” upang mapanatili ang panrelihiyong bigat ng βλασφημέω, at “mga ginawa” upang maging natural nang hindi nagdaragdag ng tahasang moral na pang-uri.
