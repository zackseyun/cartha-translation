base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: tl
  text: At ibinuhos ng ikalawa ang kanyang mangkok sa dagat, at ito’y naging dugo, gaya ng dugo ng isang patay.[a] At namatay ang bawat nilalang na may buhay na nasa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “dugo gaya ng sa isang patay.” Maaari ring isalin, “gaya ng dugong mula sa isang bangkay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: ang ikalawa
  rationale: 'Pinananatili ang elipsis ng Griyego: malinaw sa konteksto na ang tinutukoy ay ang ikalawang anghel, ngunit hindi tahasang inuulit dito ang salitang ‘anghel.’'
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: ibinuhos ... ang laman ng kanyang mangkok
  rationale: Sa natural na Filipino, ang ibinubuhos ay ang laman ng mangkok. Ginagawang hayag ang ipinahihiwatig na laman nang hindi binabago ang larawan ng φιάλη bilang isang mangkok.
- source_word: εἰς τὴν θάλασσαν
  choice: sa dagat
  rationale: Likas sa Filipino ang ‘ibinuhos ... sa dagat’ para sa paggalaw ng laman tungo sa dagat; hindi kailangan ang mas mabigat na ‘papasok sa dagat.’
- source_word: ἐγένετο αἷμα
  choice: Ang dagat ay naging dugo
  rationale: Tinutukoy nang hayag ang dagat bilang simuno upang maiwasan ang malabong panghalip, at pinananatili ang tuwirang pahayag na naging dugo ito, hindi lamang nagmukhang dugo.
- source_word: ὡς νεκροῦ
  choice: gaya ng dugo ng isang patay
  rationale: Ipinahahayag ang nakalaang salitang ‘dugo’ sa paghahambing at pinananatili ang singular na νεκροῦ. Ang ‘isang patay’ ay likas at hindi nililimitahan ang tinutukoy sa lalaking tao.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: bawat nilalang na may buhay
  rationale: Ipinapakita ang kahulugan ng Semitikong pariralang tumutukoy sa bawat nabubuhay na nilalang, at iniiwasan ang ‘kaluluwa,’ na maaaring magbigay ng di-angkop na antropolohikal na pakahulugan sa kontekstong pandagat.
- source_word: ἀπέθανεν τὰ ἐν τῇ θαλάσσῃ
  choice: namatay ... sa dagat
  rationale: Ang payak na ‘namatay’ ay katumbas ng ἀπέθανεν, at likas na ikinakabit sa Filipino ang lokasyon sa mga nilalang na tinutukoy.
theological_decisions:
- issue: Kalikasan ng larawan ng salot
  choice: Isinalin na ang dagat ay ‘naging dugo,’ ayon sa tuwirang pahayag ng pangitain.
  alternative: ‘Nagmukhang dugo’ o ‘naging parang dugo.’
  rationale: Ang ἐγένετο αἷμα ay nagsasabing naging dugo ang dagat; ang ὡς νεκροῦ ang naglalarawan sa uri o katangian ng dugong iyon. Hindi dapat palambutin ang tindi ng paghatol bilang anyo lamang.
- issue: Saklaw ng pagkamatay sa dagat
  choice: ‘bawat nilalang na may buhay sa dagat’
  alternative: Limitahan ito sa isang uri lamang ng hayop-dagat o unawain bilang mga taong nasa dagat.
  rationale: Malawak ang πᾶσα ψυχὴ ζωῆς at ang kasunod na τὰ ἐν τῇ θαλάσσῃ; pinananatili ng salin ang pangkalahatang saklaw nang hindi nagdaragdag ng espesipikong uri ng nilalang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang ‘ang ikalawa’ sa halip na idagdag ang ‘anghel,’ at ginamit ang ‘mangkok’ sa halip na tradisyonal ngunit di-gaanong malinaw na ‘sisidlan’ o ‘maliit na bote.’
