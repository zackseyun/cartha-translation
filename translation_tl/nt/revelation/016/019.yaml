id: REV.16.19
reference: Revelation 16:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: tl
  text: At nahati sa tatlong bahagi ang dakilang lungsod, at bumagsak ang mga lungsod ng mga bansa. At inalaala ng Diyos[a] ang dakilang Babilonia, upang bigyan siya ng kopa ng alak ng bagsik ng kanyang poot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inalaala ng Diyos” ay isang biblikal na idyoma na nagpapahiwatig na ang Babilonia ay napansin ng Diyos para sa paghatol.
    reason: Pagpapaliwanag sa idyomatikong kahulugan ng ἐμνήσθη ἐνώπιον τοῦ θεοῦ nang hindi ito ipinapasok sa pangunahing teksto.
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: nahati sa tatlong bahagi
  rationale: 'Resultatibo ang parirala: ang lungsod ay naging tatlong bahagi. Likas sa modernong Tagalog ang “nahati” at malinaw nitong ipinahahayag ang kinalabasan nang hindi dinaragdagan ang larawan.'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: ang dakilang lungsod
  rationale: Pinananatili ang karaniwang apokaliptikong katawagan at ang diin ng pang-uri.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: ang mga lungsod ng mga bansa
  rationale: Sa konteksto ng pandaigdigang paghuhukom, mas angkop at hindi gaanong mapagpasiya ang “mga bansa” kaysa “mga Hentil.”
- source_word: ἔπεσαν
  choice: bumagsak
  rationale: Pinananatili ang tuwiran at matingkad na larawan ng πίπτω; hindi nito ipinagpapalagay kung literal na gumuho o simbolikong bumagsak ang mga lungsod.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: ang dakilang Babilonia
  rationale: Likas na ayos ito sa Tagalog at pinananatili ang paulit-ulit na titulo sa Pahayag.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: naalaala sa harap ng Diyos
  rationale: Malapit ito sa biblikal na idyoma at pinananatili ang pahiwatig ng pagharap sa banal na paghuhukom nang hindi iyon tahasang idinaragdag sa pangunahing teksto.
- source_word: δοῦναι αὐτῇ
  choice: upang ibigay niya rito
  rationale: Ipinahahayag ng “upang” ang layunin ng pawatas. Ang “niya” ay tumutukoy sa Diyos, at ang “rito” ay sa Babilonia, na inilalarawan bilang babae sa Griyego.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: ang kopa ng alak
  rationale: Pinananatili ang tradisyonal na biblikal na larawan ng kopa bilang takdang bahagi ng paghuhukom at ang genitibong pagkakaugnay ng kopa at alak.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: ng bagsik ng kanyang poot
  rationale: Ginagamit ang magkaibang salitang “bagsik” at “poot” upang hindi pagsamahin ang θυμός at ὀργή at upang mapanatili ang mariing pagkakapatong ng mga salita sa Griyego.
theological_decisions:
- issue: Ang idyoma ng paghuhukom sa ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: naalaala sa harap ng Diyos
  alternative: naalaala ng Diyos para hatulan
  rationale: Pinananatili ng napiling anyo ang idyoma at ang teolohikal na tensiyon. Maliwanag sa kasunod na pagbibigay ng kopa na ang pag-alaala ay humahantong sa paghuhukom, kaya hindi kailangang ipasok ang paliwanag sa mismong talata.
- issue: Ang pagkakaiba ng θυμός at ὀργή
  choice: bagsik ng kanyang poot
  alternative: nagngangalit niyang poot
  rationale: Pinananatili ng napiling salin ang dalawang magkaugnay ngunit magkahiwalay na termino sa halip na pagsamahin ang mga ito sa iisang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lungsod,” “mga bansa,” “Babilonia,” at “kopa” upang mapanatili ang biblikal at apokaliptikong larawan. Ang bahagyang di-karaniwang “naalaala sa harap ng Diyos” at “bagsik ng kanyang poot” ay sinadyang panatilihin upang maipakita ang idyoma at retorikal na tindi ng Griyego.
