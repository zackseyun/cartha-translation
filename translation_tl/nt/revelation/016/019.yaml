revisions:
- from: At nahati sa tatlong bahagi ang dakilang lungsod, at bumagsak ang mga lungsod ng mga bansa. At naalaala sa harap ng Diyos ang dakilang Babilonia[a], upang ibigay niya rito ang kopa ng alak ng bagsik ng kanyang poot.
  to: At nahati sa tatlong bahagi ang dakilang lungsod, at bumagsak ang mga lungsod ng mga bansa. At inalaala ng Diyos[a] ang dakilang Babilonia, upang bigyan siya ng kopa ng alak ng bagsik ng kanyang poot.
  rationale: Pinalitan ang literal ngunit di-likas na pasibong ayos ng isang malinaw at modernong Tagalog na ayos. Nananatili ang kahulugan ng banal na pag-alaala bilang paghahandang humatol, ngunit ang interpretibong paliwanag ay nasa talababa. Nilinaw rin ang layuning sugnay sa “bigyan siya,” at inilipat ang footnote marker sa pariralang aktuwal nitong ipinapaliwanag.
