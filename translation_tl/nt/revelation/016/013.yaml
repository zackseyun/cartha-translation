  source_fidelity: 'Tumpak ang salin sa SBLGNT: pinananatili nito ang tatlo, ang pagiging marumi ng mga espiritu, ang paghahambing sa mga palaka, at ang tatlong inuulit na pinagmumulan—ang dragon, ang halimaw, at ang huwad na propeta. Ang “na lumalabas mula sa” ay isang likas na paraan sa Filipino upang ipahayag ang pinagmulan/paglabas na ipinahihiwatig ng ἐκ, nang walang dagdag na pagpapakahulugan.'
  naturalness: 'Malinaw, makabago, at angkop ang rehistro: “At nakita ko ang tatlong maruruming espiritu na parang mga palaka, na lumalabas...” Natural ang pag-uulit ng “mula sa bibig ng” at nakatutulong itong mapanatili ang diin at estruktura ng Griyego.'
