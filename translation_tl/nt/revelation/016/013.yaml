id: REV.16.13
reference: Revelation 16:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: tl
  text: At nakita ko ang tatlong maruruming espiritu na parang mga palaka, na lumalabas mula sa bibig ng dragon, mula sa bibig ng halimaw, at mula sa bibig ng huwad na propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “At nakita kong mula sa bibig ng dragon, mula sa bibig ng halimaw, at mula sa bibig ng huwad na propeta ay lumabas ang tatlong maruruming espiritu na parang mga palaka.” Sa Griyego, nauuna ang tatlong pariralang nagsasaad ng pinagmulan bago ang “tatlong maruruming espiritu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Likas at tuwirang salin ng aorist na pandiwang ginagamit sa pagsasalaysay ng pangitain.
- source_word: ἐκ ... τοῦ στόματος
  choice: na lumalabas mula sa bibig ng
  rationale: Ipinahahayag nang natural sa Tagalog ang pinagmumulan at ipinahiwatig na paglabas ng mga espiritu; inuulit ang parirala ayon sa diin ng Griyego.
- source_word: δράκοντος
  choice: dragon
  rationale: Karaniwang katawagan sa makabagong Filipino at pinananatili ang apokaliptikong larawan.
- source_word: θηρίου
  choice: halimaw
  rationale: Natural na salin ng θηρίον sa konteksto ng Pahayag at pinananatili ang larawan ng isang mabangis at di-pangkaraniwang nilalang.
- source_word: ψευδοπροφήτου
  choice: huwad na propeta
  rationale: Tuwirang ipinahahayag ang propetang hindi tunay at ang katawagang ginagamit bilang titulo sa konteksto.
- source_word: πνεύματα
  choice: mga espiritu
  rationale: Tumutukoy rito sa mga espirituwal na nilalang, hindi sa hangin o saloobin.
- source_word: τρία ἀκάθαρτα
  choice: tatlong maruruming
  rationale: Ang 'marumi' ay nagpapanatili sa ritwal at moral-espirituwal na pahiwatig ng ἀκάθαρτος; iniayon ang ayos sa natural na Tagalog.
- source_word: ὡς βάτραχοι
  choice: na parang mga palaka
  rationale: Malinaw na pinananatili ang paghahambing, hindi pagkakakilanlan.
theological_decisions:
- issue: Kalikasan ng πνεύματα ἀκάθαρτα sa apokaliptikong larawan
  choice: tatlong maruruming espiritu na parang mga palaka
  alternative: tatlong espiritu ng mga demonyo na kahawig ng mga palaka
  rationale: Hindi muna idinaragdag sa talatang ito ang paliwanag ng kasunod na talata na mga espiritu sila ng mga demonyo; pinananatili ang eksaktong larawan at hinahayaang ang konteksto ang magpaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'dragon,' 'halimaw,' at 'huwad na propeta' upang mapanatili ang pamilyar na apokaliptikong larawan nang walang dagdag na interpretasyong teolohikal.
