  to: At ang napakalaking graniso, na kasimbigat ng isang talento, ay bumababa mula sa langit sa mga tao.[a] Nilapastangan ng mga tao ang Diyos dahil sa salot ng graniso, sapagkat napakatindi ng salot nito.[b]
