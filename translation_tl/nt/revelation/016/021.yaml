id: REV.16.21
reference: Revelation 16:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: tl
  text: At ang napakalaking graniso, na kasimbigat ng isang talento, ay bumababa mula sa langit sa mga tao.[a] Nilapastangan ng mga tao ang Diyos dahil sa salot ng graniso, sapagkat napakatindi ng salot nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na tumitimbang nang humigit-kumulang isang talento.” Paghahambing, hindi eksaktong sukat, ang ipinahahayag ng Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “sapagkat napakalaki ng salot nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: napakalalaking tipak ng yelo
  rationale: Ang χάλαζα ay kolektibong tumutukoy sa graniso; ginawang tahasang “mga tipak ng yelo” upang maging natural at malinaw sa modernong Tagalog, habang ipinahahayag ng “napakalalaki” ang μεγάλη at ang pambihirang laki sa konteksto.
- source_word: ὡς ταλαντιαία
  choice: na bawat isa ay tumitimbang nang humigit-kumulang isang talento
  rationale: Ipinahahayag ang paghahambing na ὡς at ang timbang na tinutukoy ng ταλαντιαία. Ang “humigit-kumulang” ay umiiwas sa maling eksaktong sukat, at ang “bawat isa” ay nililinaw na ang inilalarawan ay ang mga tipak ng yelo.
- source_word: καταβαίνει
  choice: bumagsak
  rationale: Bagaman vivid present ang Griyego, mas likas sa salaysay na Tagalog ang perpektibong “bumagsak.” Ang pandiwa ay angkop sa pagbaba ng mabibigat na tipak ng yelo at hindi nagdaragdag ng sanhi.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Pinananatili ng “langit” ang parehong pisikal at apokaliptikong-teolohikal na posibilidad ng οὐρανός, sa halip na paliitin ito sa “kalawakan” o “himpapawid.”
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa kalalakihan. Ang “sa mga tao” ay natural at walang maling pagtukoy sa kasarian.
- source_word: ἐβλασφήμησαν
  choice: Nilapastangan
  rationale: Ang “nilapastangan” ay dignified at malinaw na tumutukoy sa mapanghamak o lapastangang pananalita laban sa Diyos, na siyang diwa ng βλασφημέω sa konteksto.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: dahil sa salot na dulot ng yelo
  rationale: Causal ang ἐκ dito. Pinananatili ng “salot” ang karaniwang gamit ng πληγή sa mga paghatol sa Pahayag, samantalang nililinaw ng “dulot ng yelo” ang ugnayan ng genitive.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: sapagkat napakatindi ng salot na iyon
  rationale: Natural na ipinahahayag ng “napakatindi” ang pinatinding μεγάλη ... σφόδρα. Ang “na iyon” ay tumutukoy pabalik sa salot ng yelo nang hindi pilit na inuulit ang parirala.
theological_decisions:
- issue: Kahulugan ng οὐρανός sa tagpong apokaliptikong paghatol
  choice: mula sa langit
  alternative: mula sa himpapawid
  rationale: Maaaring tumukoy ang salita sa pisikal na langit, ngunit sa Pahayag ay taglay rin nito ang apokaliptikong diwa ng paghatol na nagmumula sa itaas. Pinananatili ng “langit” ang dalawang dimensiyon nang walang idinadagdag na doktrina.
- issue: Pangkalahatang saklaw ng ἄνθρωποι
  choice: mga tao
  alternative: sangkatauhan
  rationale: Ang tinutukoy ay mga taong dinaranas ang salot, hindi espesipikong mga lalaki. Mas tuwiran at natural sa pangungusap ang “mga tao” kaysa sa abstraktong “sangkatauhan.”
- issue: Ugnayan ng unang ὅτι sa paglapastangan
  choice: sapagkat napakatindi ng salot na iyon
  alternative: at napakatindi ng salot na iyon
  rationale: Pinananatili ang paliwanag na ibinibigay ng ὅτι sa naging tugon ng mga tao, nang hindi ipinahihiwatig na makatarungan ang kanilang paglapastangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipak ng yelo” sa halip na teknikal o di-gaanong pamilyar na “graniso,” at pinanatili ang “talento” bilang sinaunang yunit ng timbang na ipinaliliwanag sa talababa.
