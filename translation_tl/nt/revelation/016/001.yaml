  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: tl
  text: At narinig ko mula sa santuwaryo[a] ang isang malakas na tinig na nagsasabi sa pitong anghel, “Humayo kayo at ibuhos ninyo sa ibabaw ng lupa ang pitong mangkok[b] ng poot ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “templo.” Ang salitang Griyego na ναός ay madalas na mas tiyak na tumutukoy sa panloob na santuwaryo kaysa sa buong kompleks ng templo.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang mas lumang salin, “ampolya.” Ngunit ang salitang Griyego ay tumutukoy sa mga mangkok o mabababaw na sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: isang malakas na tinig
  rationale: Sa pariralang ito, ang μέγας ay tumutukoy sa lakas o lakas ng tunog ng tinig. Likas at malinaw sa modernong Tagalog ang “malakas na tinig.”
- source_word: ναοῦ
  choice: santuwaryo
  rationale: Ang ναός ay karaniwang tumutukoy sa banal na dako o panloob na santuwaryo, hindi sa buong lawak ng kompleks ng templo. Pinananatili ng “santuwaryo” ang ganitong katiyakan sa makalangit na tagpo ng Pahayag.
- source_word: λεγούσης
  choice: na nagsasabi
  rationale: Ang kasalukuyang participle ay tumutukoy sa “tinig.” Ang “na nagsasabi” ay natural sa Tagalog at pinananatili ang masiglang paglalahad ng Griyego.
- source_word: Ὑπάγετε
  choice: Humayo kayo
  rationale: Isa itong pautos na umalis at isagawa ang ipinagagawa. Ang “Humayo kayo” ay malinaw, marangal, at angkop sa utos na ibinigay sa mga anghel.
- source_word: ἐκχέετε
  choice: ibuhos ninyo
  rationale: Pinananatili nito ang larawan ng ganap na pagbubuhos ng laman ng mga sisidlan at malinaw na ipinahahayag ang pautos sa maramihang kausap.
- source_word: φιάλας
  choice: mangkok
  rationale: Ang φιάλη ay isang mangkok o mababaw na sisidlan, hindi maliit na botelya. “Mangkok” ang tumpak at madaling maunawaang katumbas sa kasalukuyang Tagalog.
- source_word: θυμοῦ
  choice: poot
  rationale: Sa kontekstong ito, ang θυμός ay matinding banal na galit na nahahayag bilang paghatol. Ang “poot” ay nagpapanatili sa bigat at solemnidad nito.
- source_word: εἰς τὴν γῆν
  choice: sa ibabaw ng lupa
  rationale: Kasama ng ἐκχέω, ipinahihiwatig ng εἰς ang direksiyon ng pagbubuhos patungo sa ibabaw o saklaw ng lupa. Nililinaw ng pariralang ito ang galaw nang hindi ginagawang lokal lamang ang paghatol.
theological_decisions:
- issue: Pagpapakahulugan sa ναός sa makalangit na tagpo ng Pahayag
  choice: santuwaryo
  alternative: templo
  rationale: Mas tiyak na ipinahihiwatig ng “santuwaryo” ang banal na dako na karaniwang tinutukoy ng ναός. Hindi nito pinalalawak ang salita upang awtomatikong tumukoy sa buong kompleks ng templo.
- issue: Pagpapakahulugan sa θυμός τοῦ θεοῦ
  choice: poot ng Diyos
  alternative: galit ng Diyos
  rationale: Ipinakikita ng konteksto ang matindi at makatarungang paghatol ng Diyos. Pinananatili ng “poot” ang bigat ng pananalita nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Gumamit ng moderno ngunit marangal na Tagalog. Ang “Humayo kayo” ay bahagyang mataas ang rehistro ngunit karaniwan at madaling maunawaan sa kontekstong biblikal. Ang ayos ng pangungusap ay nananatiling malapit sa Griyego habang likas pa rin sa Filipino.
