id: REV.16.9
reference: Revelation 16:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: tl
  text: At napaso ang mga tao sa matinding init, at nilapastangan nila ang pangalan ng Diyos, na may kapangyarihan sa mga salot na ito, at hindi sila nagsisi upang magbigay sa kanya ng kaluwalhatian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: napaso
  rationale: Ipinapahayag ng aorist passive ang pagkapaso dahil sa init; natural ito sa makabagong Tagalog at hindi nagpapahiwatig na lubusang nasunog ang mga tao.
- source_word: οἱ ἄνθρωποι
  choice: ang mga tao
  rationale: Tumutukoy ito sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: καῦμα μέγα
  choice: sa matinding init
  rationale: Ipinahihiwatig ng μέγα ang tindi ng init; malinaw at natural ang pariralang ito sa Tagalog.
- source_word: ἐβλασφήμησαν
  choice: nilapastangan
  rationale: Sa kaugnayan sa pangalan ng Diyos, ipinahahayag nito ang mapang-insultong pananalitang lumalapastangan sa kanyang karangalan.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ang pangalan ng Diyos
  rationale: Pinananatili nito ang biblikal na idyoma kung saan ang pangalan ay kumakatawan sa ipinahayag na pagkakakilanlan at karangalan ng Diyos.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: na may kapangyarihan sa mga salot na ito
  rationale: Pinananatili ang kasalukuyang diwa ng ἔχοντος at ang tuwirang pahayag na saklaw ng kapangyarihan ng Diyos ang mga salot.
- source_word: πληγὰς
  choice: mga salot
  rationale: Ito ang karaniwang tawag sa mga hatol na ipinadadala sa Apocalipsis at pinananatili ang kaugnayan sa mga salot sa Exodo.
- source_word: οὐ μετενόησαν
  choice: hindi sila nagsisi
  rationale: Ang μετανοέω sa konteksto ng hatol ay moral at espirituwal na pagsisisi, hindi lamang pagbabago ng isip.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: upang magbigay sa kanya ng kaluwalhatian
  rationale: Pinananatili ang konkretong biblikal na idyoma at ang kaugnayan ng pagsisisi sa pagbibigay-luwalhati sa Diyos.
theological_decisions:
- issue: Saklaw ng οἱ ἄνθρωποι
  choice: pangkalahatang pagtukoy sa mga tao
  alternative: mga lalaki
  rationale: Ang konteksto ay tungkol sa mga taong nasa ilalim ng hatol, hindi partikular sa mga lalaking nasa hustong gulang.
- issue: Kapangyarihan ng Diyos sa mga salot
  choice: may kapangyarihan ang Diyos sa mga salot
  alternative: iniuugnay lamang sa Diyos ang mga salot
  rationale: Tuwirang iniuukol ng teksto sa Diyos ang ἐξουσία sa mga salot, nang hindi pinalalawak ang pahayag nang lampas sa talata.
- issue: Ugnayan ng pagsisisi at pagbibigay-luwalhati
  choice: hindi sila nagsisi upang magbigay sa Diyos ng kaluwalhatian
  alternative: hindi sila nagsisi at hindi nila siya niluwalhati bilang dalawang hiwalay na kilos
  rationale: Pinananatili ng infinitive δοῦναι ang malapit ngunit maaaring unawaing layon o bunga na ugnayan nito sa μετενόησαν, nang hindi labis na nilulutas ang sintaktikong tensiyon.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang “napaso” sa halip na mas teknikal o sobrang tinding “nasunog,” at “nilapastangan” upang maipahayag ang relihiyosong bigat ng βλασφημέω.
