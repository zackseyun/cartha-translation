id: REV.16.7
reference: Revelation 16:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: tl
  text: At narinig ko ang altar na nagsasabi[a], “Oo, Panginoong Diyos na Makapangyarihan sa lahat, tunay at makatarungan ang mga hatol mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “narinig ko ang nagsasalita mula sa altar.” Maaaring tukuyin ng Griyego ang pinagmulan ng narinig ni Juan, bagaman mas likas sa pagkakasabi na ang altar mismo ang inilalarawang nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Ang aorist ng ἀκούω ay payak na pangyayaring naganap. Ang “narinig ko” ay hindi nagdaragdag ng intensiyonal na pakikinig na wala sa Griyego.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: ang altar na nagsasabi
  rationale: Bagaman maaaring markahan ng genitive ang pinagmulan ng narinig, tahasang iniuugnay ng participle na λέγοντος ang pagsasalita sa altar. Pinananatili nito ang matingkad na personipikasyon sa pangitain at hindi nagdaragdag ng salitang “tinig.”
- source_word: Ναί
  choice: Oo
  rationale: Malinaw at likas na katumbas ng mariing pagsang-ayon, at pinananatili ang tugon sa naunang pahayag.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Panginoong Diyos na Makapangyarihan sa lahat
  rationale: Likas sa modernong Tagalog ang magkaugnay na mga titulong ito sa tuwirang pagtawag. Napananatili ang tatlong sangkap—Panginoon, Diyos, at Makapangyarihan sa lahat—nang hindi nagiging pilit ang ayos.
- source_word: ἀληθιναὶ
  choice: tunay
  rationale: Ipinahahayag nito na ang mga hatol ay totoo at mapagkakatiwalaan, at likas itong katambal ng “mga hatol.”
- source_word: δίκαιαι
  choice: makatarungan
  rationale: Pinananatili nito ang hudisyal at moral na bigat ng salita at mas tiyak kaysa sa mas mahinang “patas.”
- source_word: αἱ κρίσεις σου
  choice: ang mga hatol mo
  rationale: Ang κρίσεις ay tumutukoy sa mga pasiya o gawa ng paghatol. Ang “mga hatol” ay maikli, malinaw, at angkop sa konteksto.
theological_decisions:
- issue: Personipikasyon ng altar bilang nagsasalita
  choice: “narinig ko ang altar na nagsasabi”
  alternative: “narinig ko mula sa altar ang nagsasabi” o “narinig ko ang isang tinig mula sa altar”
  rationale: Ang altar ang gramatikal na pinagmulan ng narinig at may participle ng pagsasalita. Pinananatili ng pangunahing salin ang personipikasyon ng tekstong apokaliptiko; inilalagay sa talababa ang tunay na posibilidad na tumutukoy ang genitive sa pinagmulan.
- issue: Paglalahad ng mga titulong pantao sa Diyos
  choice: “Panginoong Diyos na Makapangyarihan sa lahat”
  alternative: “Panginoon, ang Diyos, ang Makapangyarihan sa lahat”
  rationale: Napananatili sa likas na Tagalog ang κύριε, ὁ θεός, at ὁ παντοκράτωρ. Ang mas literal na magkakahiwalay na ayos ay posible ngunit mas mabigat at hindi gaanong likas sa tuwirang pagtawag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “altar” sapagkat malinaw itong tumutukoy sa altar na pinaghahandugan at karaniwan nang nauunawaan; ang “dambana” ay maaaring magpahiwatig ng mas malawak na uri ng sagradong pook. Ang ayos ng mga titulong banal ay ginawang likas sa Tagalog habang pinananatili ang lahat ng sangkap ng Griyego.
