id: REV.6.4
reference: Revelation 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: tl
  text: At lumabas ang isa pang kabayo, na pulang gaya ng apoy[a]. Ang nakaupo rito ay pinagkaloobang alisin ang kapayapaan sa daigdig[b], upang sila'y magkatayan[c]; at pinagkalooban siya ng isang malaking tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pulang kabayo.” Mas tiyak na ipinahihiwatig ng salitang Griyego na πυρρός ang pulang gaya ng apoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lupain.” Ang salitang Griyego na γῆ ay maaaring tumukoy sa daigdig o sa lupain; ang mas malawak na diwa ang angkop dito sa pandaigdigang konteksto ng pangitain sa Pahayag.
    reason: lexical_alternative
  - marker: c
    text: Ang pandiwang isinaling “magkatayan” ay mas matindi kaysa sa pangkalahatang salita para sa “magpatayan” at nagpapahiwatig ng marahas na pagdanak ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: isa pang
  rationale: Likas na ipinahahayag sa Tagalog ang isang kasunod na kabayong naiiba sa nauna.
- source_word: ἵππος πυρρός
  choice: kabayo, na pulang gaya ng apoy
  rationale: Ipinapanatili ang tiyak na diwa ng πυρρός bilang pulang tulad ng apoy, hindi lamang karaniwang pula.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: ang nakaupo rito
  rationale: Malapit sa participyal na anyong Griyego at hindi pinapalitan ng mas interpretatibong 'ang sakay' o 'ang mangangabayo.'
- source_word: ἐδόθη αὐτῷ
  choice: pinagkalooban siya / pinagkaloobang
  rationale: Pinananatili ang balintiyak na pahayag at hindi tahasang pinapangalanan kung sino ang nagkaloob.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: alisin ang kapayapaan sa daigdig
  rationale: Natural sa kasalukuyang Tagalog; ang 'daigdig' ay angkop sa malawak na saklaw ng pangitain, habang kinikilala sa talababa ang posibleng 'lupain.'
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: upang sila'y magkatayan
  rationale: Ipinahahayag ng 'magkatayan' ang gantihang marahas na pagpaslang at ang mas matinding puwersa ng σφάζω kaysa sa pangkalahatang 'pumatay.'
- source_word: μάχαιρα μεγάλη
  choice: isang malaking tabak
  rationale: Ang 'tabak' ay malinaw at likas na katumbas sa apokaliptikong larawan, at pinananatili ng 'malaki' ang μεγάλη.
theological_decisions:
- issue: Balintiyak na pahayag sa dalawang ἐδόθη
  choice: Panatilihin ang balintiyak na 'pinagkalooban' nang hindi pinapangalanan ang nagkaloob
  alternative: Tahasan itong gawing 'ipinagkaloob ng Diyos' o idagdag ang salitang 'kapangyarihan'
  rationale: Hindi tinutukoy ng talata ang tagapagkaloob o tahasang binabanggit ang 'kapangyarihan.' Pinananatili ng salin ang pahiwatig ng soberanong pagpapahintulot nang hindi nilulutas ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matingkad at marahas na larawang apokaliptiko, gayundin ang balintiyak na pagkakabuo ng orihinal.
