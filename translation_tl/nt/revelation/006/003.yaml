  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: tl
  text: At nang buksan niya ang ikalawang tatak, narinig ko ang ikalawang nilalang na nagsasabi, “Halika.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Humayo.” Nauunawaan ng ilan na ang utos ay para sa mangangabayo, sa halip na isang panawagang lumapit.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapanatili sa tuloy-tuloy na daloy ng salaysay.
- source_word: ὅτε
  choice: nang
  rationale: Likas na panandang temporal sa Tagalog para sa pangyayaring kasabay ng kilos na sumunod.
- source_word: ἤνοιξεν
  choice: buksan niya
  rationale: Tuwirang salin ng ἀνοίγω na ‘buksan’; hindi ipinalit ang mas mapagpakahulugang ‘sirain.’
- source_word: σφραγῖδα τὴν δευτέραν
  choice: ang ikalawang tatak
  rationale: Likas na ayos sa Tagalog na pinananatili ang ordinal na diin.
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Payak at natural na salaysay ng aorist na ἀκούω.
- source_word: τοῦ δευτέρου ζῴου
  choice: ang ikalawang nilalang
  rationale: Sa konteksto ng Pahayag, tumutukoy ang ζῷον sa mga nilalang sa paligid ng trono, hindi sa karaniwang hayop; iniiwasan ng ‘nilalang’ ang nakalilitong implikasyon ng ‘hayop.’
- source_word: λέγοντος
  choice: na nagsabi
  rationale: Natural na Tagalog para sa participle na nakasalalay sa ‘narinig ko.’
- source_word: Ἔρχου
  choice: Halika
  rationale: Pinakadirektang diwa ng pautos na ἔρχομαι; pinananatili sa talababa ang kontekstuwal na posibilidad na ‘Humayo.’
theological_decisions:
- issue: Pagpapakahulugan sa Ἔρχου sa pagbubukas ng tatak
  choice: Halika
  alternative: Humayo
  rationale: Leksikal na pangunahing kahulugan ng Ἔρχου ang ‘Halika.’ Hindi tiyak sa konteksto kung kanino nakatuon ang utos; kaya hindi nilulutas sa pangunahing teksto ang tanong kung ito ay panawag na lumapit o utos sa mangangabayo na humayo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘tatak’ para sa σφραγίς at ‘nilalang’ para sa ζῷον upang maging likas sa karaniwang mambabasa nang hindi nagpapasok ng labis na interpretasyon.
