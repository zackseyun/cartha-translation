id: REV.6.2
reference: Revelation 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: tl
  text: At nakita ko, at narito—isang kabayong puti! Ang nakasakay rito[b] ay may pana. Binigyan siya ng isang korona[a], at humayo siyang nananaig at upang manaig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang putong ng tagumpay ang ibinigay sa kaniya.” Ang Griyegong στέφανος ay madalas tumukoy sa putong o koronang kaugnay ng tagumpay, sa halip na sa maharlikang diadema.
    reason: lexical_alternative
  - marker: b
    text: Hindi sinasabi ng teksto kung sino ang nakasakay. Lubhang magkakaiba ang mga pagpapakahulugan tungkol sa kaniyang pagkakakilanlan.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Karaniwang kahulugan ng aorist ng ὁράω at tuwirang inilalahad ang karanasang pangitain ni Juan.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang biglaang pagtawag-pansin at masiglang himig ng pangitain sa natural ngunit marangal na Tagalog.
- source_word: ἵππος λευκός
  choice: isang kabayong puti
  rationale: Tuwirang salin ng pariralang walang pantukoy at nagpapakilala ng bagong larawan sa pangitain.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: ang nakasakay rito
  rationale: Natural sa Tagalog para sa taong nakaupo sa ibabaw ng kabayo, habang hindi nagdaragdag ng pagkakakilanlan sa sakay.
- source_word: ἔχων τόξον
  choice: ay may pana
  rationale: Payak at likas na pagpapahayag ng paghawak o pagkakaroon ng τόξον.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: binigyan siya ng isang korona
  rationale: Pinananatili ang pasibong diwa at ang hindi tinukoy na tagapagbigay. Ang korona ay natural na katumbas, habang inilalagay sa talababa ang posibleng diwa ng putong ng tagumpay.
- source_word: ἐξῆλθεν
  choice: humayo siya
  rationale: Ipinahahayag ang paglabas o pagsulong ng sakay sa marangal at natural na wikang angkop sa tagpo.
- source_word: νικῶν
  choice: nananaig
  rationale: Ipinakikita ng aspektong nagaganap ang kasabay at nagpapatuloy na pagkilos ng pagtatagumpay o pananakop nang hindi labis na nililimitahan ang νικάω sa isang kahulugang militar.
- source_word: ἵνα νικήσῃ
  choice: upang manaig
  rationale: Malinaw na pinananatili ang layuning ipinahahayag ng ἵνα at subjunctive.
theological_decisions:
- issue: Pagkakakilanlan ng nakasakay sa kabayong puti
  choice: Hindi tinukoy sa salin ang pagkakakilanlan ng sakay.
  alternative: Maaaring ipakahulugan bilang si Cristo o isang tulad-Cristong tauhan, isang mananakop o imperyo, o isang mapanlinlang na mananakop.
  rationale: Inilalarawan ng Griyegong teksto ang sakay at ang kaniyang ginagawa ngunit hindi siya pinapangalanan. Hindi dapat lutasin ng salin ang pinagtatalunang pagkakakilanlan.
- issue: Diwa ng στέφανος
  choice: korona
  alternative: putong ng tagumpay
  rationale: Ang στέφανος ay maaaring tumukoy sa putong na iginagawad sa nagwagi, hindi lamang sa maharlikang korona. Pinananatiling malawak ang pangunahing salin at nililinaw ang leksikal na posibilidad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masiglang “narito” at ang sunod-sunod na mga sugnay ng pangitain, ngunit gumamit ng natural na ayos ng pangungusap. Inihanay ang mga panandang [a] at [b] sa mismong salitang tinatalakay ng bawat talababa.
