id: REV.6.17
reference: Revelation 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: tl
  text: sapagkat dumating na ang dakilang araw ng kanilang poot[a], at sino ang makatatayo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, “kanilang poot,” na magkasamang tumutukoy sa nakaupo sa trono at sa Kordero. Sa ilang saling nagpapakahulugan: “kanyang poot.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng takot na inilarawan sa naunang talata; natural at marangal itong panandang sanhi sa Filipino.
- source_word: ἦλθεν
  choice: dumating na
  rationale: Ipinahahayag ng aorist na dumating na ang araw at nararanasan na ngayon ang bunga ng pagdating nito.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: ang dakilang araw
  rationale: Pinananatili ng “dakilang araw” ang mariin at eskatolohikal na bigat ng parirala sa natural na ayos ng Filipino.
- source_word: τῆς ὀργῆς
  choice: ng ... poot
  rationale: Mas angkop ang “poot” kaysa karaniwang “galit” upang ipahiwatig ang matindi at makatarungang paghatol sa kontekstong ito.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Tahasan nitong pinananatili ang pangmaramihang panghalip sa Griyego, na tumutukoy sa nakaupo sa trono at sa Kordero.
- source_word: τίς
  choice: sino
  rationale: Natural na panimulang panghalip ito para sa retorikal na tanong.
- source_word: δύναται
  choice: makatatayo
  rationale: Sa pagsama nito sa infinitive, malinaw na naihahayag ng anyong may maka- ang kakayahang manatiling nakatayo.
- source_word: σταθῆναι
  choice: makatatayo
  rationale: Ang “makatatayo” ay tapat at natural, habang iniiwang pahiwatig sa konteksto ang diwang makapanatili o makatiis sa harap ng paghatol.
theological_decisions:
- issue: Pangmaramihang panghalip na kaugnay ng poot ng nakaupo sa trono at ng Kordero
  choice: Panatilihin ang “kanilang poot”
  alternative: “kanyang poot” bilang pagpapakahulugang ginagawang iisa ang kumikilos
  rationale: Malinaw na pangmaramihan ang αὐτῶν at tumutukoy sa dalawang tauhang binanggit sa Pahayag 6:16. Hindi dapat alisin ng salin ang gramatikal at teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sapagkat,” “dakilang araw,” at “poot” upang mapanatili ang solemneng tono; hindi pinagaan ang kapansin-pansing pangmaramihang “kanilang.”
