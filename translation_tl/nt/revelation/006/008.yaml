revisions:
- from: At tumingin ako, at narito, isang kabayong maputlang luntian.[a] Ang pangalan ng nakasakay rito ay Kamatayan, at sumusunod sa kanya ang Hades. Binigyan sila ng awtoridad sa ikaapat na bahagi ng lupa upang pumatay sa pamamagitan ng tabak, taggutom, salot,[b] at mababangis na hayop sa lupa.
  to: At tumingin ako, at narito, isang kabayong maputlang luntian.[a] Ang pangalan ng nakasakay rito ay Kamatayan, at kasama niyang sumusunod ang Hades. Binigyan sila ng awtoridad sa ikaapat na bahagi ng lupa upang pumatay sa pamamagitan ng tabak, taggutom, salot,[b] at mababangis na hayop sa lupa.
  rationale: Ginawa lamang ang ligtas at maliit na pagbabago upang maipahayag ang μετ’ αὐτοῦ sa sugnay tungkol sa Hades at upang pakinisin ang isang parirala sa talababa. Hindi binago ang saklaw, personipikasyon, o teolohikal na pagkakaiba ng Kamatayan at Hades; nananatili rin ang footnote na nag-iingat sa literal na pagbasa ng ἐν θανάτῳ.
