id: REV.6.8
reference: Revelation 6:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: tl
  text: At tumingin ako, at narito, isang kabayong maputlang luntian.[a] Ang pangalan ng nakasakay rito ay Kamatayan, at kasama niyang sumusunod ang Hades. Binigyan sila ng awtoridad sa ikaapat na bahagi ng lupa upang pumatay sa pamamagitan ng tabak, taggutom, salot,[b] at mababangis na hayop sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “isang maputlang kabayo.” Ang salitang Griyego ay literal na tumutukoy sa kulay na luntian o maputlang luntian at maaari ring magpahiwatig ng pamumutlang tila may sakit.'
    reason: lexical_alternative
  - marker: b
    text: 'O: “kamatayan.” Dito, ang “salot” ay nagpapahayag ng posibleng idiomatikong kahulugan ng salitang Griyego sa talaan ng mga hatol na umaalingawngaw sa Ezekiel 14.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: maputlang luntian
  rationale: Pinananatili nito ang literal na luntian o manilaw-nilaw na luntiang kulay ng salita at ang ipinahihiwatig na maputla at nakamamatay na anyo; inilalagay sa talababa ang mas payak na alternatibo.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: ang nakasakay rito
  rationale: Likas sa modernong Tagalog para sa isang taong nakaupo sa ibabaw ng kabayo, nang hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: Ang pangalan ng nakasakay rito ay Kamatayan
  rationale: Malinaw na pinananatili ang pormula ng pagpapangalan at ang personipikasyon ng Kamatayan.
- source_word: ᾅδης
  choice: Hades
  rationale: Pinananatili ang natatanging katawagan para sa daigdig o kinaroroonan ng mga patay at iniiwasang ipantay ito sa impiyerno o sa libingan.
- source_word: μετ’ αὐτοῦ
  choice: sa kanya
  rationale: Kasama ng pandiwang 'sumusunod,' natural nitong ipinahahayag na ang Hades ay sumusunod na kasama niya; hindi ipinipilit ang mas tiyak na 'sa likuran niya.'
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: Binigyan sila ng awtoridad
  rationale: Pinananatili ang maramihang panghalip, ang di-tahasang tagapagbigay, at ang diwa ng ipinagkaloob na karapatan o saklaw.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: sa ikaapat na bahagi ng lupa
  rationale: Tuwirang ipinahahayag ang isang-kapat na saklaw; ang 'lupa' ay sapat na malawak para sa γῆ sa pangitain.
- source_word: ἐν ῥομφαίᾳ καὶ ἐν λιμῷ
  choice: sa pamamagitan ng tabak, taggutom
  rationale: Ang 'tabak' at 'taggutom' ay malinaw at dignidad na katumbas ng mga paraan ng pagpatay sa listahan.
- source_word: ἐν θανάτῳ
  choice: salot
  rationale: Sa pormula ng mga hatol na umaalingawngaw sa Ezekiel 14, ang 'kamatayan' ay maaaring tumukoy sa salot; pinananatili sa talababa ang literal na alternatibo.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: at mababangis na hayop sa lupa
  rationale: Natural na Tagalog para sa pagpatay na dulot ng mga mailap at mapanganib na hayop; pinananatili ang kaugnayan nila sa lupa.
theological_decisions:
- issue: Kahulugan ng ᾅδης
  choice: Hades
  alternative: daigdig ng mga patay; libingan; impiyerno
  rationale: Ibinubukod ng talata ang personipikadong Kamatayan sa Hades na sumusunod sa kanya. Ang transliterasyon ay umiiwas sa pagpasok ng isang tiyak na doktrina tungkol sa huling kaparusahan.
- issue: Kahulugan ng ἐν θανάτῳ sa talaan ng mga hatol
  choice: salot
  alternative: kamatayan
  rationale: Ang konteksto at alusyon sa talaan ng hatol sa Ezekiel ay sumusuporta sa idiomatikong kahulugang 'salot,' ngunit inilalahad sa talababa ang literal na 'kamatayan' upang mapanatili ang tunay na posibilidad ng pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Ginamit ang 'narito' upang mapanatili ang biglang pantawag-pansin ng ἰδού; 'Hades' upang panatilihin ang terminolohikal na pagkakaiba; at maiikling parirala upang mapanatili ang matindi at sunod-sunod na ritmo ng pangitain.
