id: REV.6.14
reference: Revelation 6:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: tl
  text: At ang kalangitan[a] ay nahawi[b] na parang isang balumbon ng sulatin[c] na inilululon, at ang bawat bundok at pulo ay naalis mula sa kani-kanilang kinalalagyan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “langit.” Dito, ang tinutukoy ay ang nakikitang lawak sa itaas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “umurong” o “nahiwalay.” Ang salitang Griyego ay maaaring mangahulugang humiwalay o umurong.
    reason: lexical_alternative
  - marker: c
    text: Ang “balumbon ng sulatin” ay isang scroll na inilululon o iginugulong, hindi isang makabagong aklat na may pabalat.
    reason: cultural_note
  - marker: d
    text: Sa literal, “mula sa kanilang mga kinalalagyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: kalangitan
  rationale: Sa pangitain ng kosmikong pagyanig, tumutukoy ito sa nakikitang lawak sa itaas. Mas malinaw dito ang “kalangitan” kaysa “langit,” na maaari ring maunawaan bilang tahanan ng Diyos.
- source_word: ἀπεχωρίσθη
  choice: nahawi
  rationale: Ipinahahayag ng pandiwa ang pagkakahiwalay o pag-urong. Ang “nahawi” ay likas sa Filipino at pinananatili ang larawan ng kalangitang nabubuksan o naihihiwalay nang hindi ipinapalagay na lubos itong napawi.
- source_word: βιβλίον
  choice: balumbong
  rationale: Sa kontekstong ito, ang tinutukoy ay sulating nilululon, hindi makabagong aklat na may mga pahina at pabalat.
- source_word: ἑλισσόμενον
  choice: na nilululon
  rationale: Ipinahahayag ng kasalukuyang pandiwaring balintiyak ang nagaganap na paglulon o pagrolyo sa balumbon.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: bawat bundok at pulo
  rationale: Pinananatili ng “bawat” ang distributibong diwa ng πᾶν na kasama ng mga pangngalang isahan.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: sa kani-kanilang kinalalagyan
  rationale: Ang Griyego ay literal na “mula sa kanilang mga lugar.” Ipinahahayag ng “kani-kanilang” na ang bawat bundok at pulo ay naalis mula sa sarili nitong lugar.
- source_word: ἐκινήθησαν
  choice: naalis
  rationale: Sa pariralang may pinanggalingang lugar, ang κινέω ay tumutukoy sa pagkalipat o pagkaalis sa kinalalagyan, hindi lamang sa pagyanig.
theological_decisions:
- issue: Kosmikong katawagan sa apokaliptikong larawan
  choice: Isinalin ang οὐρανός bilang “kalangitan.”
  alternative: “langit”
  rationale: Itinatampok nito ang nakikitang kalawakan sa pangitain at iniiwasang ipalagay na ang tahanan ng Diyos mismo ang naalis, habang kinikilala sa talababa ang posibleng saling “langit.”
- issue: Uri ng nangyari sa kalangitan
  choice: Isinalin ang ἀπεχωρίσθη bilang “nahawi.”
  alternative: “umurong,” “nahiwalay,” o “naglaho”
  rationale: Pinananatili ng “nahawi” ang pangunahing diwa ng paghihiwalay o pag-urong at ang tensiyon ng matalinghagang pangitain, nang hindi tahasang ipinapakahulugang nawasak o naglaho ang kalangitan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “balumbong” ay mas angkop sa sinaunang bagay kaysa “rolyo,” at nililinaw ito sa talababa. Ang “kani-kanilang kinalalagyan” ay natural na distributibong katumbas ng pangmaramihang anyo sa Griyego.
