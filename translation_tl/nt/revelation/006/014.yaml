    rationale: Maaaring hindi agad maunawaan ng modernong mambabasa na isang kasulatan na nakarolyong bagay ang tinutukoy. Ang “balumbon ng sulatin” ay mas malinaw habang pinananatili ang historikal na sanggunian.
