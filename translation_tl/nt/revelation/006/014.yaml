  source_fidelity: Ang “kalangitan,” “bawat bundok at pulo,” at ang pag-alis mula sa kani-kanilang mga lugar ay tapat sa Griyego. Gayunman, ang “balumbong” ay hindi ang wastong anyo ng pangngalan sa gamit na ito, at ang kasalukuyang parirala ay hindi gaanong malinaw na tumutukoy sa isang nakarolyong kasulatan. Ang “nahawi” ay isang katanggap-tanggap na maingat na salin ng ἀπεχωρίσθη, na pinananatili ang diwa ng pagkakahiwalay nang hindi ipinagpapalagay ang ganap na paglaho.
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “isang balumbon ng sulatin na inilululon.” Nililinaw nito ang sinaunang anyo ng βιβλίον at ang kilos ng ἑλισσόμενον nang hindi gumagamit ng salitang “aklat” o ng hindi pangkaraniwang “balumbong.”
  terminology: Pinanatili ang “kalangitan” para sa nakikitang lawak sa itaas at “balumbon ng sulatin” para sa βιβλίον. Ang “inilululon” ay ginagamit dito sa kahulugang pagrolyo/pagpupulupot, hindi paglunok; nilinaw ito sa talababa.
