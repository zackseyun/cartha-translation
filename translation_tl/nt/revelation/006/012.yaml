  source_fidelity: 'Tumpak na naipapahayag ng salin ang sunod-sunod na pangitain: ang di-pinangalanang pagbubukas niya ng ikaanim na tatak, ang malaking lindol, ang pag-itim ng araw na inihalintulad sa telang-sakong yari sa balahibo, at ang buong buwang naging parang dugo. Napananatili ang paghahambing ng ὡς sa parehong larawan at hindi ito ginagawang literal na pahayag tungkol sa dugong buwan.'
  naturalness: Likas at marangal ang daloy sa makabagong Filipino Tagalog. Ang “naging maitim ang araw” at “ang buong buwan ay naging parang dugo” ay malinaw at angkop sa matinding bisyonaryong rehistro. Katanggap-tanggap din ang “magaspang na telang-sako” bilang pagpapaliwanag ng uri ng telang tinutukoy.
  terminology: Ang “tatak” ay angkop para sa σφραγίς sa nagpapatuloy na larawang pagbubukas ng mga tatak. Ang “lindol,” “maitim,” at “balahibo” ay sapat na katumbas sa konteksto. Ang talababa ay wastong nakaugnay sa pariralang “telang-sako ... yari sa balahibo” at hindi nagdaragdag ng interpretasyong doktrinal.
