id: REV.6.12
reference: Revelation 6:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: tl
  text: 'At nakita ko nang buksan niya ang ikaanim na tatak: nagkaroon ng isang malakas na lindol, naging maitim ang araw na parang magaspang na telang-sako na yari sa balahibo,[a] at ang buong buwan ay naging parang dugo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “parang telang-sakong yari sa balahibo.” Ang tinutukoy ay magaspang na telang yari sa balahibo, na karaniwang kaugnay ng pagluluksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Karaniwang pananalita sa Filipino para sa pangitain ng tagakita at tuwirang katumbas ng aorist ng ὁράω.
- source_word: ὅτε ἤνοιξεν
  choice: nang buksan niya
  rationale: Likas na ipinapahayag ng “nang” ang panahong tinutukoy ng ὅτε; pinananatili ng “niya” ang hindi pinangalanang paksa sa talata.
- source_word: τὴν σφραγῖδα τὴν ἕκτην
  choice: ang ikaanim na tatak
  rationale: Ang “tatak” ay malinaw at nakaugat na katumbas ng σφραγίς sa konteksto ng balumbon; natural ang ayos ng ordinal sa Filipino.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: nagkaroon ng isang malakas na lindol
  rationale: Ang σεισμός dito ay malinaw na “lindol.” Ipinahihiwatig ng “malakas” ang tindi ng μέγας sa mas natural na Filipino kaysa “dakilang lindol.”
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: naging maitim ang araw
  rationale: Ang μέλας ay tumutukoy sa itim o maitim; mas natural sa Filipino ang “maitim” para sa anyo ng araw habang pinananatili ang matinding larawan.
- source_word: ὡς σάκκος τρίχινος
  choice: parang magaspang na telang-sako na yari sa balahibo
  rationale: Ipinapakita ng σάκκος ang telang-sako at ng τρίχινος na yari ito sa balahibo. Idinagdag ang “magaspang” upang maipabatid sa makabagong mambabasa ang uri ng telang tinutukoy, hindi bilang hiwalay na katangian.
- source_word: ἡ σελήνη ὅλη
  choice: ang buong buwan
  rationale: Tahasang pinananatili ang diin ng ὅλη na ang buwan sa kabuuan ang inilarawan.
- source_word: ἐγένετο ὡς αἷμα
  choice: ay naging parang dugo
  rationale: Pinananatili ng “parang” ang paghahambing na ipinahihiwatig ng ὡς at hindi sinasabing literal na naging dugo ang buwan.
theological_decisions:
- issue: Kalikasan ng mga tanda sa kalawakan
  choice: Tuwirang isinalin ang mga larawang nakita sa pangitain nang hindi ipinapasiya kung literal, simboliko, o kapwa ang mga ito.
  alternative: Ipaliwanag ang mga ito bilang eksklusibong literal na kapahamakan sa kalawakan o eksklusibong simbolo ng paghuhukom at pagbagsak ng mga kapangyarihan.
  rationale: Inilalahad ng Griyego ang pangitain sa pamamagitan ng malinaw na mga paghahambing (“parang”); hindi nito nilulutas sa talatang ito ang mas malawak na usaping interpretatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod at matinding larawang apokaliptiko, ngunit inayos ang pangungusap sa natural na daloy ng Tagalog. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
