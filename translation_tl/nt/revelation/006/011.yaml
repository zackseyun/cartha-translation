id: REV.6.11
reference: Revelation 6:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: tl
  text: At binigyan ang bawat isa sa kanila ng mahabang puting damit, at sinabi sa kanila na magpahinga pa nang kaunting panahon, hanggang sa makumpleto rin[a] ang kanilang mga kapwa alipin at mga kapatid[b], na malapit nang patayin gaya rin nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa malubos din ang kanilang mga kapwa alipin at mga kapatid” o “hanggang sa makumpleto rin ang buong bilang ng kanilang mga kapwa alipin at mga kapatid.” Payak na sinasabi ng Griyego, “hanggang sa … makumpleto/malubos.”
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay panlalaking maramihan, ngunit ang “mga kapatid” ay maaaring tumukoy sa mga kapwa mananampalataya sa mas malawak na diwa, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: puting balabal
  rationale: Ang στολή ay isang mahaba o maringal na kasuotan; ang “balabal” ay natural at dignified na katumbas sa Filipino, at malinaw na naihahatid ng “puti” ang λευκή.
- source_word: ἑκάστῳ
  choice: ang bawat isa sa kanila
  rationale: 'Pinananatili nito ang distributibong diwa: bawat isa, hindi lamang ang pangkat sa kabuuan, ang binigyan.'
- source_word: ἐρρέθη αὐτοῖς
  choice: sinabi sa kanila
  rationale: Natural itong pasibong pahayag sa Filipino at hindi tinutukoy kung sino ang nagsalita, gaya ng Griyego.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: magpahinga pa nang kaunting panahon
  rationale: Pinananatili ng “magpahinga” ang diwa ng ἀναπαύω at ng “pa nang kaunting panahon” ang temporal na lakas ng ἔτι χρόνον μικρόν.
- source_word: πληρωθῶσιν
  choice: makumpleto
  rationale: Sinasadya nitong panatilihin ang malawak at bahagyang di-tiyak na diwa ng pasibong πληρόω, nang hindi tahasang idinaragdag ang salitang “bilang,” na wala sa Griyego.
- source_word: σύνδουλοι
  choice: mga kapwa alipin
  rationale: Ipinahahayag nito ang κοινong kalagayan ng mga taong nasa ilalim ng iisang panginoon at pinananatili ang lakas ng δοῦλος-family term.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Sa Filipino, ang “mga kapatid” ay likas na katumbas na hindi kailangang tukuyin ang kasarian; maaari itong tumukoy sa magkakapatid o sa kapwa mananampalataya ayon sa konteksto.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: na papatayin
  rationale: Inihahatid nito ang inaasahan o nalalapit na pasibong pangyayari nang hindi nagdaragdag ng mas malakas na ideya ng itinakdang kapalaran.
- source_word: ὡς καὶ αὐτοί
  choice: ding gaya nila
  rationale: Malinaw na iniuugnay nito ang magiging pagpatay sa mga kapwa alipin at kapatid sa sinapit na ng mga kaluluwang tinutukoy.
theological_decisions:
- issue: Kahulugan ng πληρωθῶσιν kapag mga kapwa alipin at mga kapatid ang simuno
  choice: makumpleto rin
  alternative: malubos din; makumpleto rin ang kanilang buong bilang
  rationale: Walang tahasang salitang “bilang” sa Griyego. Pinananatili ng “makumpleto” ang posibilidad na tumukoy ito sa pagkalubos o pagkabuo ng pangkat nang hindi ginagawang tiyak ang isang interpretasyong numerikal.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid sa pananampalataya
  rationale: Ang Griyego ay panlalaking maramihan, ngunit madalas itong tumukoy nang mas malawak sa pamayanang sumasampalataya. Ang “mga kapatid” ay tumpak at natural sa Filipino habang pinananatili ang posibleng mas malawak na saklaw.
- issue: Paglalarawan sa σύνδουλοι
  choice: mga kapwa alipin
  alternative: mga kapwa lingkod
  rationale: Mahalaga sa larawan ng talata ang magkakatulad nilang pag-aari at paglilingkod sa iisang Panginoon; mas tuwirang pinananatili ng “alipin” ang lakas ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang payak na ayos ng pangungusap at “kaunting panahon” sa halip na mas makalumang pananalita. Pinanatili ang di-karaniwang pahayag na “makumpleto” tungkol sa mga tao upang huwag ikubli ang tunay na kalabuan ng Griyego.
