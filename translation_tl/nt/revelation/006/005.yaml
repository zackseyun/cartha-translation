id: REV.6.5
reference: Revelation 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: tl
  text: At nang buksan niya ang ikatlong tatak, narinig kong sinabi ng ikatlong nilalang na buháy, “Halika.”[a] Tumingin ako, at naroon ang isang kabayong itim! Ang nakasakay rito ay may hawak na timbangan[b] sa kanyang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumapit ka.” Maaaring ang utos ay para kay Juan, o maaaring tinatawag nito ang kabayo at ang nakasakay rito.
    reason: alternative_reading
  - marker: b
    text: O “balanseng panukat.” Ang salitang Griyego ay maaaring tumukoy sa timbangan; sa kontekstong ito, malamang na ginagamit ito sa pagsukat ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: buksan
  rationale: Tuwirang salin ng pagbubukas sa ikatlong tatak; hindi kailangang idagdag na ito ay ‘binasag.’
- source_word: σφραγῖδα τὴν τρίτην
  choice: ikatlong tatak
  rationale: Likas at tuwirang Filipino na nagpapanatili sa pagkakasunod-sunod ng mga tatak.
- source_word: ζῴου
  choice: nilalang na buháy
  rationale: Tinutukoy nito ang mga nilalang sa silid ng trono, hindi pangkaraniwang hayop; ang diin ay tumutulong na malinaw na ang ‘buháy’ ay pang-uri.
- source_word: Ἔρχου
  choice: Halika
  rationale: Maikli at mariing pautos na hindi tahasang tumutukoy kung sino ang kinakausap.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: Tumingin ako, at naroon ...!
  rationale: Natural na inilalahad sa Filipino ang pag-usad ng pangitain at pinananatili ang mapang-akit na puwersa ng ἰδού.
- source_word: ἵππος μέλας
  choice: isang kabayong itim
  rationale: Tuwirang pinananatili ang kulay na mahalaga sa larawan ng pangitain.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: ang nakasakay rito
  rationale: Natural sa Filipino at malapit sa Griyegong pariralang tumutukoy sa taong nakaupo sa kabayo.
- source_word: ζυγὸν
  choice: timbangan
  rationale: Sa konteksto ng pagsukat ng pagkain sa kasunod na talata, tumutukoy ito sa kasangkapang panimbang, bagaman maaari rin itong tawaging balanseng panukat.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: may hawak ... sa kanyang kamay
  rationale: Malinaw at idiomatikong paglalahad ng bagay na nasa kamay ng nakasakay.
theological_decisions:
- issue: Tinutukoy ng utos na Ἔρχου
  choice: Isinaling ‘Halika’ nang hindi tinutukoy ang kausap.
  alternative: Maaaring utos ito kay Juan na lumapit, o panawagan sa kabayo at sa nakasakay rito na lumabas.
  rationale: Hindi tahasang binabanggit ng Griyego ang kausap, kaya pinananatili ng pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maigsi at masiglang takbo ng pangitain, gayundin ang kalabuan kung sino ang inuutusang ‘Halika.’
