  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: tl
  text: At ang mga bituin sa langit ay nahulog sa lupa, gaya ng puno ng igos na naglalaglag ng mga hilaw nitong igos[a] kapag niyayanig ng malakas na hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bubot na igos,” “mga berdeng igos,” o “mga huling igos”; ang salitang Griyego ay tumutukoy sa mga igos na hindi pa ganap na hinog at nalalaglag bago mahinog.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: mga bituin
  rationale: Ito ang karaniwang kahulugan at pinananatili nito ang larawang apokaliptiko nang hindi ipinapakahulugan ang mga bituin bilang mga anghel o pinuno.
- source_word: τοῦ οὐρανοῦ
  choice: sa langit
  rationale: Likas sa modernong Tagalog ang pariralang “mga bituin sa langit,” at pinananatili nito ang kosmikong himig ng teksto.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: nahulog sa lupa
  rationale: Malinaw nitong ipinahahayag ang paggalaw pababa tungo sa lupa at ang dramatikong larawan ng pangitain.
- source_word: ὡς
  choice: gaya ng
  rationale: Natural na pananda ito ng paghahambing sa Tagalog.
- source_word: συκῆ
  choice: isang puno ng igos
  rationale: Karaniwan at malinaw na katumbas ng pangngalan sa modernong Tagalog.
- source_word: βάλλει
  choice: nalalaglag
  rationale: Sa konteksto ng bungang natatanggal sa puno dahil sa hangin, mas natural ang “nalalaglag” kaysa literal na “inihahagis.”
- source_word: ὀλύνθους
  choice: mga hilaw nitong bunga
  rationale: Tumutukoy ang salita sa mga igos na hindi pa hinog at nalalaglag bago mahinog. Naiiwasan din ng “bunga” ang alanganing pag-uulit ng “igos,” habang malinaw ang tinutukoy dahil puno ng igos ang paksa.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: ng malakas na hangin
  rationale: Natural na Tagalog ito para sa lakas ng hangin; hindi kailangan ang mas literal ngunit di-likas na “dakilang hangin.”
- source_word: σειομένη
  choice: kapag niyayanig
  rationale: Pinananatili nito ang pasibong diwa ng participle at malinaw na inilalahad ang pangyayaring sanhi ng pagkalaglag ng bunga.
theological_decisions:
- issue: Apokaliptikong larawan ng mga bituing nahuhulog
  choice: Panatilihin ang larawang “ang mga bituin sa langit ay nahulog sa lupa” nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag ang mga bituin bilang mga anghel, pinuno, o iba pang makasagisag na nilalang.
  rationale: Maaaring makasagisag ang larawan, ngunit hindi tinutukoy ng talata mismo ang simbolikong kahulugan nito. Ang literal na larawang leksikal ay nagpapanatili sa sadyang tensiyon at kalabuan ng pangitain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “puno ng igos” para sa malinaw na pagkilala sa halaman at “mga hilaw nitong bunga” para sa natural na daloy. Ang [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
