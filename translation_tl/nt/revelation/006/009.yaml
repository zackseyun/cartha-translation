id: REV.6.9
reference: Revelation 6:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: tl
  text: Nang buksan niya ang ikalimang tatak, nakita ko sa ilalim ng altar ang mga kaluluwa ng mga pinaslang[a] dahil sa salita ng Diyos at dahil sa patotoong[b] taglay nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinatay.” Mas tuwirang naipapakita nito ang marahas at panghandog na lakas ng pandiwang Griyego, ngunit maaaring maging di-likas kapag tao ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: O “pagsaksi.” Maaaring tumukoy ang salitang Griyego sa patotoong ibinigay o sa gawa ng pagsaksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: buksan
  rationale: Likas at karaniwang salin ng ἀνοίγω sa paulit-ulit na tagpo ng pagbubukas ng mga tatak sa Pahayag.
- source_word: σφραγῖδα
  choice: tatak
  rationale: Karaniwang salin ng σφραγίς na malinaw sa modernong Filipino at angkop sa apokaliptikong larawan.
- source_word: ὑποκάτω
  choice: sa ilalim
  rationale: Tuwirang panandang panlunan na natural sa Filipino.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: Tumpak at madaling maunawaang terminong nagpapanatili sa larawang kaugnay ng paghahandog nang hindi tinutukoy kung makalangit o makalupa ang altar.
- source_word: ψυχὰς
  choice: mga kaluluwa
  rationale: Pinananatili ang tiyak na larawan sa pangitain tungkol sa mga namatay sa ilalim ng altar, nang hindi ito pinapapantay lamang sa ‘mga buhay’ o ‘mga tao.’
- source_word: ἐσφαγμένων
  choice: mga pinaslang
  rationale: Masidhi ito kaysa sa karaniwang ‘pinatay’ at pinananatili ang marahas at posibleng panghandog na himig ng σφάζω, ngunit mas natural at marangal sa Filipino kaysa ‘kinatay’ kapag tao ang tinutukoy.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: dahil sa salita ng Diyos
  rationale: Ipinahahayag ng διά na may akusatibo ang sanhi o dahilan; malinaw itong naihahatid ng ‘dahil sa.’
- source_word: μαρτυρίαν
  choice: patotoo
  rationale: Pinananatili ang juridikal at hayagang pagpapahayag na diwa ng μαρτυρία; maaari rin itong mangahulugang ‘pagsaksi.’
- source_word: ἣν εἶχον
  choice: taglay nila
  rationale: Natural na Filipino para sa literal na ‘mayroon sila’ at hindi nagdaragdag ng ideyang gaya ng ‘pinanghawakan’ na wala mismong ipinapahayag ng pandiwa.
theological_decisions:
- issue: Kahulugan ng ψυχὰς sa pangitain
  choice: Isinalin bilang ‘mga kaluluwa.’
  alternative: ‘mga buhay’ o ‘mga tao’
  rationale: Inilalarawan ng talata ang mga namatay na nakita sa ilalim ng altar. Pinananatili ng ‘mga kaluluwa’ ang anyo ng pangitain ngunit hindi nito nilulutas ang mas malawak na usaping antropolohikal.
- issue: Lakas at panghandog na himig ng ἐσφαγμένων
  choice: Ginamit ang ‘mga pinaslang.’
  alternative: ‘mga pinatay’ o ‘mga kinatay’
  rationale: Hindi pinalalambot ng ‘pinaslang’ ang marahas na kamatayan at naiiwan nitong marinig ang ugnayan sa altar at paghahandog, nang hindi nagiging labis na di-likas sa pagtukoy sa tao.
- issue: Saklaw ng μαρτυρία
  choice: Ginamit ang ‘patotoo’ sa pangunahing teksto.
  alternative: ‘pagsaksi’
  rationale: Kapuwa maaaring tukuyin ng salita ang patotoong ibinigay at ang gawa ng pagsaksi. Ang ‘patotoo’ ay angkop sa pariralang ‘taglay nila,’ habang itinatala sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at bahagyang pormal. Pinanatili ang tradisyonal ngunit pangkaraniwang mga terminong ‘altar,’ ‘kaluluwa,’ ‘salita ng Diyos,’ at ‘patotoo.’
