id: REV.6.6
reference: Revelation 6:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: tl
  text: At narinig ko ang tila isang tinig sa gitna ng apat na nilalang na buháy, na nagsasabi, “Isang takal[a] ng trigo sa halagang isang denario[b], at tatlong takal ng sebada sa halagang isang denario; at huwag mong pinsalain[c] ang langis at ang alak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na χοῖνιξ ay isang sukat ng tuyong bagay na humigit-kumulang isang litro, at madalas ituring na sapat na rasyon ng butil para sa isang tao sa loob ng isang araw.
    reason: cultural_note
  - marker: b
    text: Ang isang denario ay karaniwang sahod ng isang manggagawa para sa isang araw. Ipinakikita ng mga presyong ito ang matinding kakapusan.
    reason: cultural_note
  - marker: c
    text: O, “sirain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: ang tila isang tinig
  rationale: Ipinahihiwatig ng ὡς ang pagkakahawig o impresyon sa pandinig. Pinananatili ng “tila isang tinig” ang pag-iingat ng salaysay nang hindi tiyak na kinikilala ang nagsasalita.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: mula sa gitna ng apat na nilalang na buháy
  rationale: Ang ἐν μέσῳ ay tumutukoy sa kinalalagyan sa gitna o kalipunan nila. Idinagdag ang “mula sa” upang maging likas sa Filipino ang pinagmulan ng tinig. Ang ζῷα ay isinaling “mga nilalang na buháy” upang tumukoy sa mga nilalang sa paligid ng trono, hindi sa karaniwang mga hayop.
- source_word: λέγουσαν
  choice: na nagsasabi
  rationale: Ang kasalukuyang pandiwaring ito ay tumutugma sa “tinig” at likas na nagpapakilala sa tuwirang sinabi.
- source_word: Χοῖνιξ / χοίνικες
  choice: takal / mga takal
  rationale: Ang χοῖνιξ ay sinaunang sukat ng tuyong bagay na humigit-kumulang isang litro. Ang “takal” ay malinaw at natural sa Filipino, samantalang ipinapaliwanag sa talababa ang tiyak na sinaunang sukat.
- source_word: σίτου
  choice: trigo
  rationale: Tiyak na ipinakikita ang kaibahan ng mas mahalagang trigo sa sebada.
- source_word: δηναρίου
  choice: sa halagang isang denario
  rationale: Genitibo ito ng presyo. Pinananatili ang pangalang “denario” bilang sinaunang salapi at nililinaw sa talababa ang halaga nito bilang karaniwang isang araw na sahod.
- source_word: κριθῶν
  choice: sebada
  rationale: Karaniwang modernong salin sa Filipino ng κριθή at malinaw na naiiba sa trigo.
- source_word: μὴ ἀδικήσῃς
  choice: huwag mong pinsalain
  rationale: Maaaring mangahulugan ang ἀδικέω na gumawa ng masama, manakit, o puminsala. Sa konteksto ng mga produktong langis at alak, ang “pinsalain” ay malawak at angkop; ibinibigay sa talababa ang “sirain” bilang mas materyal na alternatibo.
- source_word: τὸ ἔλαιον
  choice: ang langis
  rationale: Karaniwang tumutukoy ang ἔλαιον sa langis ng olibo, ngunit hindi kailangang idagdag ang “olibo” sa pangunahing teksto dahil hindi ito tahasang tinukoy rito.
- source_word: τὸν οἶνον
  choice: ang alak
  rationale: Likas at karaniwang katumbas sa Filipino ng οἶνος sa kontekstong ito.
theological_decisions:
- issue: Paglalarawan sa ζῷα sa pangitain tungkol sa trono
  choice: mga nilalang na buháy
  alternative: mga hayop; mga halimaw
  rationale: Iniiwasan nito ang pag-uugnay sa masasamang “halimaw” na lumilitaw sa ibang bahagi ng Pahayag at tumpak na inilalarawan ang mga nilalang sa paligid ng trono nang hindi dinaragdagan ang kanilang pagkakakilanlan.
- issue: Paglalahad ng sinaunang sukat at salapi
  choice: Isalin ang χοῖνιξ bilang “takal” at panatilihin ang “denario,” na kapuwa nililinaw sa mga talababa
  alternative: Gamitin ang eksaktong modernong litro at katumbas na makabagong salapi; o baybayin lamang ang choinix
  rationale: Pinananatili nito ang makasaysayang tagpo at ang diwa ng matinding kakapusan, ngunit nananatiling madaling maunawaan ng karaniwang mambabasa. Hindi ginagawang eksaktong modernong sukat o halaga ang mga sinaunang yunit.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “tila isang tinig” upang mapanatili ang pag-aalinlangan ng ὡς, at “ngunit” upang likas na maipakita ang biglang pagbabawal sa pinsala sa langis at alak. Ang tuldik sa “buháy” ay tumutulong upang maiwasan ang maling pagbasa, ngunit hindi ginawang labis na teknikal ang pangunahing teksto.
