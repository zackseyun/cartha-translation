  source_fidelity: 'Ang salin ay tapat sa mga pangunahing elemento ng Griyego: ang maingat na ὡς (“tila”), ang apat na nilalang na buháy, ang mga sukat at presyo, at ang pagbabawal na may kinalaman sa langis at alak. Gayunman, ang καὶ bago ang huling pagbabawal ay payak na “at,” hindi tahasang panandang pagsalungat; mas maingat na huwag idagdag ang “ngunit.” Ang “sa gitna” ay mas tuwirang katumbas ng ἐν μέσῳ kaysa “mula sa gitna,” bagaman nauunawaan ang layon ng draft.'
