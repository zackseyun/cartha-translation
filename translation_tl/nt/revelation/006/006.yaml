  to: At narinig ko ang tila isang tinig sa gitna ng apat na nilalang na buháy, na nagsasabi, “Isang takal[a] ng trigo sa halagang isang denario[b], at tatlong takal ng sebada sa halagang isang denario; at huwag mong pinsalain[c] ang langis at ang alak.”
