  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: tl
  text: Nang buksan niya ang ikaapat na selyo, narinig ko ang tinig ng ikaapat na buhay na nilalang na nagsasabi, “Halika.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, posibleng “Humayo ka.” Mas literal na salin ng Griyego ang “Halika,” ngunit magkakaiba ang pagkaunawa kung ang utos ay para kay Juan o sa mangangabayo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: buksan
  rationale: Likas na salin ng aorist na ἀνοίγω sa paulit-ulit na pormula ng pagbubukas ng mga tatak sa pangitain.
- source_word: σφραγῖδα
  choice: tatak
  rationale: Ang σφραγίς ay tumutukoy sa tatak na nagsasara sa balumbon; malinaw at karaniwang salitang Filipino ang “tatak” sa kontekstong ito.
- source_word: τετάρτην / τετάρτου
  choice: ikaapat
  rationale: Tuwirang salin ng parehong ordinal at pinananatiling pare-pareho sa dalawang paglitaw.
- source_word: φωνὴν
  choice: ang tinig
  rationale: Bagaman walang artikulo sa Griyego, tiyak ang tinig dahil agad itong tinutukoy bilang sa ikaapat na nilalang.
- source_word: ζῴου
  choice: nilalang
  rationale: Sa konteksto ng Pahayag, tumutukoy ito sa mga buhay na nilalang sa paligid ng trono, hindi sa karaniwang hayop; natural sa Filipino ang “nilalang” at hindi ito napagkakamalang θηρίον, “halimaw.”
- source_word: λέγοντος
  choice: na nagsasabi
  rationale: Tuwirang ipinapahayag ang kasabay na kilos ng participle matapos ang “narinig ko ang tinig.”
- source_word: Ἔρχου
  choice: Halika
  rationale: Ito ang pinakadirektang kahulugan ng pangkasalukuyang pautos na ἔρχου at hindi nito tahasang tinutukoy kung sino ang inuutusan.
theological_decisions:
- issue: Ang pinatutungkulan ng pautos na Ἔρχου
  choice: Isinalin lamang na “Halika,” nang hindi tinutukoy ang kinakausap.
  alternative: Maaaring unawain na si Juan o ang mangangabayo ang kinakausap; kaya may nagpapakahulugang “Humayo ka.”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang pinatutungkulan. Pinananatili ng payak na pautos ang tunay na kalabuan ng salaysay.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “tinig” at “nilalang” bilang malinaw na bokabularyong angkop sa pangitain, at iniwasang dagdagan ang teksto ng hindi tahasang pinatutungkulan ng utos.
