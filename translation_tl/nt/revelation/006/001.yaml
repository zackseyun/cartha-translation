  source_fidelity: Tumpak na naipapahayag ng draft ang pagkakita ni Juan sa pagbubukas ng isa sa pitong tatak ng Kordero, ang pagkarinig niya sa isa sa apat na nilalang na buhay, ang paghahambing ng tinig sa kulog, at ang hindi tinutukoy na kausap ng utos na Ἔρχου. Ang “Kordero,” “pitong tatak,” at “mga nilalang na buhay” ay angkop na mga katumbas.
  naturalness: Bahagyang mas natural at mas malapit sa aspektong nagpapatuloy ng λέγοντος ang “na nagsasalita” kaysa “na nagsabi.” Ang kuwit pagkatapos ng “nakita ko” at tutuldok bago ang tuwirang pahayag ay nagpapalinaw sa daloy ng pangungusap.
  terminology: Ang “Kordero” ay angkop na pamagat sa konteksto ng Pahayag. Ang “mga nilalang na buhay” ay pinananatili upang hindi sila mapagkamalang karaniwang hayop. Ang “Halika!” ay wastong pangunahing salin at pinananatili ang kalabuan ng tinutukoy na kausap. Ang talababa ay binago lamang para sa mas likas na Tagalog.
