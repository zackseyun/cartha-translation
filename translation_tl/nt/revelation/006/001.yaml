  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: tl
  text: 'At nakita ko, nang buksan ng Kordero ang isa sa pitong tatak, at narinig ko ang isa sa apat na nilalang na buhay na nagsasalita sa tinig na parang kulog: “Halika!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Humayo ka,” kung ang utos ay inuunawa bilang para sa mangangabayo at hindi kay Juan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: Kordero
  rationale: Sa Pahayag, ginagamit ang salita bilang titulong tumutukoy kay Jesus. Ang “Kordero” ay natural at kinikilalang salin nang hindi ipinipilit ang literal na munting anyo.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: isa sa pitong tatak
  rationale: Likas na paraan ito sa Tagalog upang ipahayag na isang tatak mula sa kabuuang pitong tatak ang binuksan.
- source_word: ζῴων
  choice: mga nilalang na buhay
  rationale: Tumutukoy ito sa mga nilalang sa palibot ng trono, hindi sa karaniwang mga hayop. Iniiwasan ng saling ito ang maling zoolohikal na pahiwatig.
- source_word: ὡς φωνῇ βροντῆς
  choice: sa tinig na parang kulog
  rationale: Pinananatili nito ang paghahambing ng tinig sa kulog sa natural at malinaw na Tagalog.
- source_word: Ἔρχου
  choice: Halika
  rationale: Ito ang pinakadirektang kahulugan ng pautos na anyo ng ἔρχομαι. Hindi tinutukoy sa pangunahing teksto kung sino ang kinakausap.
- source_word: ὅτε
  choice: nang
  rationale: Ipinahahayag nito ang panahong kaugnayan ng pagkakita ni Juan sa pagbubukas ng tatak.
- source_word: εἶδον
  choice: nakita ko
  rationale: Direktang salin ng payak na pandiwang pasalaysay, nang walang idinadagdag na kilos gaya ng “tumingin.”
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Karaniwang salin ng pandiwang ἀκούω sa ganitong salaysay.
- source_word: λέγοντος
  choice: na nagsabi
  rationale: Payak nitong inilalahad ang pagsasalita nang hindi dinaragdagan ang lakas o paraan nito bukod sa tahasang paghahambing sa kulog.
theological_decisions:
- issue: Ang tinutukoy at puwersa ng utos na Ἔρχου
  choice: “Halika,” nang hindi tinutukoy sa pangunahing teksto kung sino ang kinakausap
  alternative: “Humayo ka,” kung ang utos ay para sa mangangabayo at hindi kay Juan
  rationale: Ang Griyego ay tuwirang nangangahulugang “Halika,” ngunit hindi tahasang pinapangalanan ang kinakausap. Pinananatili ng pangunahing salin ang kalabuan, samantalang inilalagay sa talababa ang makabuluhang alternatibong pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kordero” bilang titulong pangkristolohiya at “mga nilalang na buhay” upang makilala ang mga nilalang sa trono mula sa karaniwang mga hayop. Inilagay ang pananda ng talababa pagkatapos ng “Halika!” sapagkat doon tumutukoy ang alternatibong salin.
