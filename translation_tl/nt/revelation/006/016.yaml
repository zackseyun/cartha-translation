id: REV.6.16
reference: Revelation 6:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: tl
  text: at sinasabi nila sa mga bundok at sa mga bato, “Bumagsak kayo sa amin at itago ninyo kami mula sa mukha[a] ng Isa na nakaupo sa trono at mula sa poot ng Kordero,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa presensya ng Isa na nakaupo sa trono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: sinasabi nila
  rationale: Pinananatili ng pangkasalukuyang anyo ang masiglang kasalukuyan ng apokaliptikong salaysay, nang hindi ito ginagawang tahasang nakaraan.
- source_word: ὄρεσιν
  choice: mga bundok
  rationale: Ang ὄρος ay karaniwang tumutukoy sa bundok; pinananatili nito ang laki at tindi ng larawan.
- source_word: πέτραις
  choice: mga bato
  rationale: Ang πέτρα ay tumutukoy sa malaking bato o batuhang masa. Ang “mga bato” ay malinaw at natural sa makabagong Tagalog.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Bumagsak kayo sa amin
  rationale: Tuwiran at apurahang utos ang aorist imperative; inilalarawan nito ang paghiling na tabunan sila ng mga bundok at bato.
- source_word: κρύψατε ἡμᾶς
  choice: itago ninyo kami
  rationale: Tuwiran at natural nitong ipinapahayag ang utos na ikubli sila.
- source_word: ἀπὸ προσώπου
  choice: mula sa mukha
  rationale: Pinananatili ang literal at matingkad na larawang dala ng πρόσωπον. Inilalagay sa talababa ang posibleng diwang “presensya.”
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: ng nakaupo sa trono
  rationale: Natural nitong inilalarawan ang patuloy na kalagayan ng Isa na nakaluklok sa trono nang hindi nagdaragdag ng pangalang wala sa Griyego.
- source_word: ὀργῆς
  choice: poot
  rationale: Mas mabigat kaysa karaniwang galit ang ὀργή sa konteksto ng paghuhukom; ang “poot” ay angkop sa eskatolohikal na bigat nito.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Ang “Kordero” ang kinikilalang titulong kristolohikal sa Pahayag at pinananatili ang kabalintunaan ng handog na Kordero na nagdadala rin ng paghuhukom.
theological_decisions:
- issue: Ang dalawang kaugnay ngunit natatanging pinagmumulan ng kinatatakutang paghuhukom
  choice: Pinanatili kapwa ang “nakaupo sa trono” at ang “Kordero” bilang magkaugnay na pinagmumulan ng kinatatakutang presensya at poot.
  alternative: Pagsamahin ang dalawa bilang pangkalahatang pagtukoy lamang sa Diyos, o palambutin ang “poot ng Kordero.”
  rationale: Malinaw na pinag-uugnay ng Griyego ang dalawang parirala sa pamamagitan ng καί at ἀπό. Pinananatili rin ng salin ang sinadyang tensiyon na ang Korderong kaugnay ng paghahain ay kaugnay rin ng eskatolohikal na poot.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang masiglang pangkasalukuyang salaysay, ang literal na larawang “mukha,” at ang matinding apokaliptikong pananalita nang hindi dinaragdagan o pinapaliit ang teolohikal na tensiyon.
