base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: tl
  text: At sumigaw sila nang malakas, “Hanggang kailan, Panginoon[a], ikaw na banal at tunay, bago ka humatol at ipaghiganti ang aming dugo sa mga naninirahan sa lupa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong titulo ay despótēs, na nagbibigay-diin sa awtoridad ng isang panginoon at naiiba sa kýrios, na karaniwang isinasaling “Panginoon.” Maaari ring isalin na “Kataas-taasang Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laban sa mga naninirahan sa lupa.” Maaaring tukuyin ng parirala ang mga pinatutungkulan ng paghihiganti; ang “mga naninirahan sa lupa” ay paulit-ulit ding katawagan sa Pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: sumigaw sila nang malakas
  rationale: Likas na modernong Tagalog na pinananatili ang lakas at agarang himig ng κράζω at φωνῇ μεγάλῃ.
- source_word: Ἕως πότε
  choice: Hanggang kailan
  rationale: Karaniwang pananalita sa Tagalog para sa panaghoy at pagsusumamo tungkol sa naaantalang pagkilos.
- source_word: δεσπότης
  choice: Panginoong Makapangyarihan
  rationale: Ipinahahayag ang ganap na kapangyarihan ng δεσπότης at inihihiwalay ang diwa nito sa karaniwang κύριος, bagaman walang iisang salitang Tagalog na ganap na tumutumbas dito.
- source_word: ἅγιος καὶ ἀληθινός
  choice: banal at tunay
  rationale: Tuwirang pinananatili ang dalawang katangian ng tinutukoy na Diyos nang hindi pinagsasama o ipinapaliwanag nang labis.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: bago ka humatol at ipaghiganti
  rationale: Sa tanong na nagsisimula sa ‘Hanggang kailan,’ natural na ipinahihiwatig ng ‘bago ka’ ang hinihintay at naaantalang pagkilos, habang pinananatili ang paghatol at makatarungang pagganti.
- source_word: τὸ αἷμα ἡμῶν
  choice: ang aming dugo
  rationale: Pinananatili ang biblikal na metonimiya ng dugo para sa marahas na pagkamatay sa halip na palitan ito ng paliwanag.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: sa mga naninirahan sa lupa
  rationale: Natural sa Tagalog bilang target ng paghihiganti at pinananatili ang paulit-ulit na katawagan sa Pahayag.
theological_decisions:
- issue: Pagtawag sa Diyos sa salitang δεσπότης
  choice: Panginoong Makapangyarihan
  alternative: Panginoon; Guro; Kataas-taasang Panginoon
  rationale: Iniiwasang tumbasan lamang ng karaniwang ‘Panginoon,’ sapagkat binibigyang-diin ng δεσπότης ang ganap na kapangyarihan. Ang talababa ay nagpapanatili sa leksikal na pagkakaiba nito sa κύριος.
- issue: Lakas ng pagsusumamo ng mga martir para sa katarungan
  choice: humatol at ipaghiganti ang aming dugo
  alternative: humatol at bigyang-katarungan ang aming pagkamatay
  rationale: Pinananatili ang hayagang hudisyal at mapaghiganting wika ng teksto nang hindi ito pinalalambot o ginagawang panawagan sa personal na paghihiganti.
- issue: Ugnayan ng ἐκ sa paghihiganti
  choice: sa mga naninirahan sa lupa
  alternative: laban sa mga naninirahan sa lupa; mula sa mga naninirahan sa lupa
  rationale: Ang parirala ay maaaring magpahiwatig ng mga taong pinatutungkulan o pinagmumulan ng pagganti; pinili ang natural na Tagalog at itinala ang saklaw ng kahulugan sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘sumigaw nang malakas’ sa halip na mas lumang ‘humiyaw sa malakas na tinig,’ at pinanatili ang matinding wika ng paghatol, paghihiganti, at dugo.
