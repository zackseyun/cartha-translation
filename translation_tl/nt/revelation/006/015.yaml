id: REV.6.15
reference: Revelation 6:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: tl
  text: At ang mga hari sa lupa, ang mga prominenteng tao, ang mga pinuno ng hukbo, ang mayayaman, ang malalakas, at ang bawat alipin at taong malaya[a] ay nagtago sa mga kuweba at sa mga batuhan ng mga bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking isahan ang tambalang “bawat alipin at malaya,” ngunit ginagamit ito bilang pangkalahatang pagtukoy sa lahat ng tao sa dalawang kalagayang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: mga hari sa lupa
  rationale: Sa konteksto ng pansansinukob na paghatol sa Pahayag, ang γῆ ay tumutukoy sa lupa o daigdig, hindi lamang sa isang lupain.
- source_word: μεγιστᾶνες
  choice: mga dakilang tao
  rationale: Tumutukoy ito sa mga taong mataas ang katayuan o prominente. Pinananatili ng salin ang lawak ng termino nang hindi ito nililimitahan sa namamanang maharlika.
- source_word: χιλίαρχοι
  choice: mga pinuno ng hukbo
  rationale: Bagaman literal na pinuno ng isang libo, malinaw at natural na ipinahahayag ng pariralang ito ang ranggong militar.
- source_word: πλούσιοι
  choice: mayayaman
  rationale: Direkta at likas na salin ng pang-uring ginamit bilang pangngalan.
- source_word: ἰσχυροὶ
  choice: malalakas
  rationale: Pinananatili nito ang pangunahing diwa ng lakas, habang ang 'makapangyarihan' ay maaaring labis na umulit sa ideya ng mataas na katayuan.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: bawat alipin at taong malaya
  rationale: Maliwanag ang katayuang pagkaalipin dahil tuwirang inihahambing ang δοῦλος sa taong malaya. Ang 'taong malaya' ay natural at kumakatawan sa lahat ng kasarian.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: nagtago
  rationale: Likas na Filipino na kusang nagpapahayag ng refleksibong diwa; hindi na kailangang idagdag ang mabigat na 'ng kanilang sarili.'
- source_word: εἰς τὰ σπήλαια
  choice: sa mga kuweba
  rationale: Pagkatapos ng 'nagtago,' natural sa Filipino ang 'sa' para sa kinalalagyan na bunga ng pagkilos.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: sa mga batuhan ng mga bundok
  rationale: Ipinahahayag ng 'batuhan' ang mababatong lugar o mga siwang na mapagtataguan, sa halip na magmungkahi na pumasok sila sa loob ng solidong mga bato.
theological_decisions:
- issue: Pag-render sa δοῦλος sa tambalang alipin/malaya
  choice: alipin
  alternative: lingkod
  rationale: Ginagawang hayag ng paghahambing sa ἐλεύθερος ang legal at panlipunang kalagayang hindi malaya, kaya mas tumpak ang 'alipin' kaysa 'lingkod.'
- issue: Saklaw ng kasarian sa πᾶς δοῦλος καὶ ἐλεύθερος
  choice: bawat alipin at taong malaya
  alternative: bawat aliping lalaki at lalaking malaya
  rationale: Bagaman panlalaking isahan ang anyong Griyego, kinakatawan ng nakaugaliang tambalan ang lahat ng tao ayon sa kanilang katayuang panlipunan; iniiwasan ng 'taong malaya' ang maling paglilimita sa mga lalaki.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang sunod-sunod na listahan ng mga pangkat at ang panlipunang saklaw mula sa mga hari hanggang sa alipin at malaya.
