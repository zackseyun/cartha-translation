  to: At nang magsalita ang pitong kulog, magsusulat na sana ako; at nakarinig ako ng isang tinig mula sa langit na nagsasabi, “Ilihim mo[a] ang mga sinabi ng pitong kulog, at huwag mong isulat ang mga ito.”
  rationale: Inayos ang panghalip at ang tinutukoy nito bilang maramihan upang katawanin ang αὐτά at ang mga nilalamang sinalita. Pinalitan ang adversative na “Ngunit” ng “at,” alinsunod sa καί. Inalis ang tahasang idinagdag na layon sa unang sugnay upang higit na masundan ang ἤμελλον γράφειν, habang pinananatili ang natural na modernong Filipino.
