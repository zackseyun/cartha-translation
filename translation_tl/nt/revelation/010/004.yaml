id: REV.10.4
reference: Revelation 10:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: tl
  text: At nang magsalita ang pitong kulog, magsusulat na sana ako; at nakarinig ako ng isang tinig mula sa langit na nagsasabi, “Ilihim mo[a] ang mga sinabi ng pitong kulog, at huwag mong isulat ang mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego: “Tatakan mo.” Sa kontekstong ito, nangangahulugan itong panatilihing lihim at huwag ihayag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: magsalita
  rationale: Karaniwang kahulugan ng λαλέω ang ‘magsalita.’ Pinananatili nito ang pagkatao-sa-larawan ng pitong kulog bilang mga nagsasalitang tagaganap.
- source_word: αἱ ἑπτὰ βρονταί
  choice: ang pitong kulog
  rationale: Ang ‘kulog’ ang likas na salin ng βροντή. Bagaman hindi karaniwang binibilang sa Filipino, ang ‘pitong kulog’ ay angkop sa personipikado at apokaliptikong larawan ng Griyego.
- source_word: ἤμελλον γράφειν
  choice: isusulat ko na sana
  rationale: Ipinahihiwatig ng μέλλω na malapit nang gawin ni Juan ang pagsulat ngunit napigilan siya. Natural na naipahahayag ito ng ‘isusulat ko na sana.’
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: isang tinig mula sa langit
  rationale: Tumpak at likas itong nagpapahayag ng pinagmulan ng tinig nang hindi tinutukoy kung sino ang nagsasalita.
- source_word: Σφράγισον
  choice: Ilihim mo
  rationale: Sa konteksto, ang paglalagay ng tatak ay utos na huwag ihayag ang mensahe. Ang ‘ilihim’ ay malinaw sa modernong Filipino, habang ang literal na larawan ng pagtatatak ay pinananatili sa talababa.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: ang sinabi ng pitong kulog
  rationale: Ang panghalip na ἃ ay tumutukoy sa nilalaman ng kanilang pananalita. Mas natural sa Filipino ang ‘ang sinabi’ kaysa sa literal na ‘ang mga bagay na sinalita.’
- source_word: μὴ αὐτὰ γράψῃς
  choice: huwag mo itong isulat
  rationale: Bagaman maramihan ang αὐτά sa Griyego, ang tinutukoy nito ay ang kabuuang nilalaman ng sinabi ng mga kulog. Natural sa Filipino ang isahang ‘ito’ para sa nilalamang iyon.
theological_decisions:
- issue: Pagkakakilanlan ng tinig mula sa langit
  choice: isang tinig mula sa langit
  alternative: tinig ng Diyos mula sa langit
  rationale: Hindi tuwirang kinikilala ng talata ang nagsasalita. Pinananatiling hindi tiyak ang pagkakakilanlan sa halip na magdagdag ng teolohikal na pagpapasiya.
- issue: Kahulugan ng utos na σφράγισον
  choice: Ilihim mo
  alternative: Tatakan mo
  rationale: Ipinahahayag ng konteksto na hindi dapat isulat o ihayag ang sinabi. Gayunman, dahil ang Griyego ay gumagamit ng larawan ng pagtatatak, inilalahad ang literal na anyo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘isusulat ko na sana’ upang likas na ipahayag ang napipintong kilos na napigil, at ‘Ngunit’ upang malinaw ang biglang pagsalungat ng narinig na utos.
