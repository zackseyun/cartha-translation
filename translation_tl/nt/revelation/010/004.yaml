  naturalness: Marangal at malinaw ang Filipino ng draft. Mas natural at malapit sa daloy ng Griyego ang paggamit ng “at” sa halip na “Ngunit,” at ang “magsusulat na sana ako” ay sapat na nagpapahayag na malapit nang sumulat ang nagsasalita nang hindi tahasang dinaragdagan ang di-binanggit na layon ng γράφειν.
  terminology: Ang “pitong kulog,” “isang tinig mula sa langit,” at “ilihim” ay angkop sa modernong Filipino Tagalog at sa apokaliptikong rehistro. Pinananatili ng talababa ang literal na larawan ng “pagtatatak.”
  issues:
