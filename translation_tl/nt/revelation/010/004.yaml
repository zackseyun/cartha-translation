  - severity: low
    issue: “Ngunit” ang salin ng ikalawang καί.
    rationale: Ang καί ay pang-ugnay na “at”; hindi tahasang nagpapahayag ang Griyego ng adversative na ugnayan. Ang “at” ay mas tapat at nananatiling natural sa salaysay.
  - severity: low
    issue: Ginawang tahasang layon ang “ang sinabi nila” sa “isusulat ko na sana.”
    rationale: Walang tahasang layon ang γράφειν sa Griyego. Maliwanag ang konteksto, ngunit ang “magsusulat na sana ako” ay mas malapit sa anyo ng pinagmulan nang hindi nawawala ang diwa.
