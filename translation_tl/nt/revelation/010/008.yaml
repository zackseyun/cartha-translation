id: REV.10.8
reference: Revelation 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: tl
  text: At muling nagsalita sa akin ang tinig na narinig ko mula sa langit. Sinabi nito, “Pumunta ka at kunin mo ang balumbon na nakabukas na nasa kamay ng anghel na nakatayo sa ibabaw ng dagat at ng lupa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lupa” ay maaari ring isaling “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: tinig
  rationale: Tumutukoy ito sa tinig na nagsasalita mula sa langit, hindi lamang sa isang tunog.
- source_word: πάλιν
  choice: muling
  rationale: Malinaw nitong ipinahihiwatig na muling kinausap si Juan ng tinig.
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: nagsalita sa akin ... Sinabi nito
  rationale: Natural sa modernong Tagalog at pinananatili ang dalawang pandiwang participle ng Griyego nang hindi nagiging mabigat ang pangungusap.
- source_word: Ὕπαγε
  choice: Humayo ka
  rationale: Isang tuwirang utos na pumunta; marangal at karaniwang nauunawaan sa biblikal na salaysay.
- source_word: λάβε
  choice: kunin mo
  rationale: Tuwirang utos na kunin ang bagay na nasa kamay ng anghel.
- source_word: βιβλίον
  choice: balumbon
  rationale: Sa makasaysayang at pampanitikang tagpuan, ang tinutukoy ay isang scroll, hindi isang makabagong aklat. Hindi idinagdag ang diwang ‘maliit’ sapagkat βιβλίον, hindi ang diminutibong βιβλαρίδιον, ang nasa talatang ito.
- source_word: ἠνεῳγμένον
  choice: nakabukas
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng pagkakabukas, gaya ng perfect passive participle.
- source_word: ἐν τῇ χειρὶ
  choice: sa kamay
  rationale: Inilalarawan ang kinaroroonan ng balumbon nang hindi tahasang idinaragdag ang ‘mula sa,’ bagaman ipinahihiwatig iyon ng utos na kunin.
- source_word: ἄγγελος
  choice: anghel
  rationale: Sa pangitain ng Pahayag, malinaw na isang makalangit na nilalang ang tinutukoy.
- source_word: ἑστῶτος
  choice: nakatayo
  rationale: Ipinapakita ang nagpapatuloy na tindig o kalagayan ng anghel.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: sa ibabaw ng dagat at ng lupa
  rationale: Pinananatili ang matingkad na larawang ang anghel ay nakatindig sa dagat at sa lupa; ang ‘lupa’ ang mas angkop na katapat ng dagat sa agarang tagpo.
theological_decisions:
- issue: Kahulugan ng γῆ sa apokaliptikong larawan
  choice: lupa
  alternative: daigdig
  rationale: Ang agarang tagpo ay ang pisikal na pagtayo ng anghel sa dagat at sa tuyong lupa. Pinananatili sa talababa ang posibleng mas malawak na kahulugang ‘daigdig.’
- issue: Pagkakaugnay ng βιβλίον sa maliit na balumbon sa mga kalapit na talata
  choice: balumbon
  alternative: maliit na balumbon
  rationale: Ang mismong pangngalan sa talatang ito ay βιβλίον at walang diminutibong anyo. Hindi tahimik na iniayon ang salita sa βιβλαρίδιον ng mga kalapit na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “balumbon” bilang likas na katawagan sa scroll. Hinati sa dalawang pangungusap upang maging natural sa Tagalog habang pinananatili ang pag-uulit ng mga pandiwang ‘nagsalita’ at ‘sinabi.’
