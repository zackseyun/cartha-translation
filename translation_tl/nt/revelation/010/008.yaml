  to: At muling nagsalita sa akin ang tinig na narinig ko mula sa langit. Sinabi nito, “Pumunta ka at kunin mo ang balumbon na nakabukas na nasa kamay ng anghel na nakatayo sa ibabaw ng dagat at ng lupa.[a]”
