id: REV.10.2
reference: Revelation 10:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: tl
  text: At may hawak siyang isang munting balumbon na nabuksan na.[a] Ipinatong niya ang kanyang kanang paa sa dagat, at ang kaliwa naman sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang munting aklat.” Ang βιβλαρίδιον ay diminutibong salita para sa isang maliit na balumbon o aklat.
    reason: lexical_alternative
  - marker: b
    text: O “sa daigdig.” Ang salitang Griego na γῆ ay maaaring mangahulugang “lupa” o “daigdig”; pinili rito ang “lupa” upang tumugma sa pagkakaiba nito sa “dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: may hawak siyang
  rationale: Natural na Filipino para sa participial phrase na nagsasaad na nasa kamay niya ang bagay, habang pinananatili ng “At” ang ugnayan sa naunang talata.
- source_word: βιβλαρίδιον
  choice: isang munting balumbon
  rationale: Ang diminutive na βιβλαρίδιον ay tumutukoy sa maliit na balumbon o aklat; pinananatili ng “munting balumbon” ang laki at ang larawang angkop sa konteksto.
- source_word: ἠνεῳγμένον
  choice: na nabuksan na
  rationale: Ipinahihiwatig ng perfect passive participle ang naunang pagbubukas at ang nananatiling kalagayan nito bilang bukas.
- source_word: ἔθηκεν
  choice: ipinatong
  rationale: Ang “ipinatong” ay natural at malinaw para sa sinadyang paglalagay ng mga paa sa ibabaw ng dagat at lupa.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: ang kanyang kanang paa
  rationale: Tuwirang pinananatili ang isahang “paa” at ang pagtukoy sa kanan.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sa dagat
  rationale: Natural na salin ng ἐπί kasama ng θάλασσα sa larawang ito; ipinahihiwatig ang pagtuntong sa ibabaw ng dagat.
- source_word: τὸν δὲ εὐώνυμον
  choice: at ang kaliwa naman
  rationale: Ang εὐώνυμος ay nangangahulugang “kaliwa”; hindi na kailangang ulitin ang “paa” dahil malinaw ito sa magkatulad na kayarian. Ang “naman” ay naghahayag ng contrast.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Maaaring mangahulugan ang γῆ ng lupa o daigdig; “lupa” ang pinakanatural na katapat ng “dagat” sa agarang larawang pangheograpiya.
theological_decisions:
- issue: Saklaw ng γῆ bilang katapat ng θάλασσα
  choice: lupa
  alternative: daigdig
  rationale: Ang pangitain ay naglalarawan ng isang paa sa dagat at isa sa tuyong lupa. Hindi pinipilit ng “lupa” ang mas malawak na kosmolohikal na kahulugang maaaring ipahiwatig ng “daigdig,” ngunit itinatala sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “balumbon” upang mapanatili ang sinaunang larawan, at inayos ang mga marker upang ang talababa tungkol sa βιβλαρίδιον ay sumunod sa “balumbon” at ang tungkol sa γῆ ay sumunod sa “lupa.”
