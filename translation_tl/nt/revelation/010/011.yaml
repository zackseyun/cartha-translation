id: REV.10.11
reference: Revelation 10:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: tl
  text: At sinabi nila sa akin, “Kailangan mong muling magpahayag ng propesiya tungkol sa mga bayan, bansa, wika, at maraming hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν
  choice: sinabi nila
  rationale: Likas sa salaysay na Tagalog ang aspektong perpektibo; pinananatili ng pangmaramihang “nila” ang di-tiyak na maramihang simuno ng Griyego.
- source_word: Δεῖ σε
  choice: Kailangan mong
  rationale: Malinaw at natural na ipinahahayag ang di-maiiwasang atas o pangangailangan.
- source_word: πάλιν
  choice: muling
  rationale: Dignified at maikli; tumutukoy sa pag-uulit ng gawaing propetiko.
- source_word: προφητεῦσαι
  choice: magpahayag ng propesiya
  rationale: Mas malinaw sa karaniwang mambabasa kaysa sa “manghula,” na maaaring maling maunawaan bilang basta paghula sa hinaharap.
- source_word: ἐπὶ
  choice: tungkol sa
  rationale: Pinananatili ang malamang na diwang tumutukoy sa paksa o mga taong saklaw ng pahayag, nang hindi pinipilit ang posibleng diwang “laban sa.”
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: maraming bayan, bansa, wika, at hari
  rationale: Pinananatili ang apat na magkakaugnay na pangkat at ang saklaw ng “marami,” sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Saklaw o direksiyon ng propesiya sa ἐπὶ
  choice: tungkol sa
  alternative: laban sa / sa harap ng
  rationale: Ang ἐπὶ na may datibo ay maaaring magkaroon ng higit sa isang ugnayan, ngunit sa konteksto, “tungkol sa” ang pinakamalinaw na salin habang hindi nagdaragdag ng tiyak na mapanghatol na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Iniwasan ang “manghula” dahil sa makitid o popular na kahulugan nito; ginamit ang “magpahayag ng propesiya” upang idiin ang gawaing propetiko. Walang kailangang talababa.
