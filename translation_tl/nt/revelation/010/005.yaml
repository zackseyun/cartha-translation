id: REV.10.5
reference: Revelation 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: tl
  text: At itinaas ng anghel na nakita kong nakatayo sa ibabaw ng dagat at ng lupa[a] ang kanyang kanang kamay patungo sa langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “daigdig” sa halip na “lupa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: anghel
  rationale: Sa konteksto ng Pahayag, isang makalangit na nilalang ang tinutukoy; ang “anghel” ang natural at tiyak na salin kaysa sa pangkalahatang “mensahero.”
- source_word: ἑστῶτα
  choice: nakatayo
  rationale: Inilalarawan ng perpektong pandiwaring ito ang kasalukuyang tindig o kalagayan ng anghel; natural itong ipahayag sa Filipino bilang “nakatayo.”
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sa ibabaw ng dagat
  rationale: Pinananatili nito ang matingkad na larawan ng anghel na nakatayo sa ibabaw ng dagat at ang kahulugan ng ἐπί na may genitive.
- source_word: ἐπὶ τῆς γῆς
  choice: sa ibabaw ng lupa
  rationale: Sa agarang paghahambing sa dagat, ang “lupa” ang natural na katawagan sa tuyong bahagi, habang nananatiling posible ang mas malawak na diwang “daigdig.”
- source_word: ἦρεν
  choice: itinaas
  rationale: Tumpak at natural na ipinapahayag ng “itinaas” ang kilos ng αἴρω sa maringal na kumpas ng panunumpa.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: ang kanyang kanang kamay
  rationale: Tahasang tinutukoy ng Griyego ang kamay at nililinaw na iyon ang kanan; tuwiran at natural ito sa Filipino.
- source_word: εἰς τὸν οὐρανόν
  choice: patungo sa langit
  rationale: Ipinahihiwatig ng εἰς ang direksiyon ng pagtaas ng kamay. Pinananatili ng “langit” ang teolohikal na bigat ng tagpo kaysa sa “kalangitan” o “himpapawid.”
theological_decisions:
- issue: Kahulugan ng γῆ bilang kapareha ng θάλασσα
  choice: lupa
  alternative: daigdig
  rationale: Ang “lupa” ang pinakamalinaw na katapat ng “dagat” sa larawang biswal ng talata, ngunit hindi ikinakaila ang mas malawak na saklaw na maaaring taglayin ng γῆ.
- issue: Kahulugan ng οὐρανός
  choice: langit
  alternative: kalangitan
  rationale: Ang susunod na talata ay nag-uugnay sa kilos sa panunumpa sa harap ng walang hanggang Maylalang, kaya ang “langit” ay angkop sa teolohikal na himig at hindi lamang tumutukoy sa pisikal na himpapawid.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biswal na ayos ng anghel sa ibabaw ng dagat at lupa at ang pormal na kumpas ng pagtataas ng kanang kamay.
