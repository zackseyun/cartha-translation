id: REV.10.1
reference: Revelation 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: tl
  text: At nakita ko ang isa pang makapangyarihang anghel na bumababa mula sa langit, nakabalot ng ulap. Nasa ibabaw ng kanyang ulo ang bahaghari[a]; ang kanyang mukha ay gaya ng araw, at ang kanyang mga paa ay gaya ng mga haliging apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maningning na aureola.” Karaniwang nangangahulugang “bahaghari” ang salitang Griyego at umaayon ito sa larawan sa Pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: isa pang ... anghel
  rationale: Bagaman maaaring mangahulugan ang ἄγγελος na sugo, anghel ang likas na kahulugan sa pangitaing ito at sa pagbaba niya mula sa langit.
- source_word: ἰσχυρὸν
  choice: makapangyarihan
  rationale: Ipinahahayag nito ang pambihirang lakas o kapangyarihan ng anghel sa natural at marangal na modernong Tagalog.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: bumababa mula sa langit
  rationale: Pinananatili nito ang malinaw at buhay na kilos na pababa mula sa langit.
- source_word: περιβεβλημένον νεφέλην
  choice: nababalot ng ulap
  rationale: Sinasaklaw nito ang larawan ng pagiging nakadamit o napalilibutan ng ulap nang hindi nagiging pilit sa Tagalog.
- source_word: ἡ ἶρις
  choice: bahaghari
  rationale: Ang karaniwang kahulugan ng ἶρις ay bahaghari, at umaayon ito sa larawan sa Pahayag 4:3; gayunman, kinikilala sa talababa ang posibleng kahulugang maningning na bilog.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: nasa ibabaw ng kanyang ulo
  rationale: Natural nitong ipinahahayag ang kinalalagyan ng bahaghari kaugnay ng ulo.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: ang kanyang mukha ay gaya ng araw
  rationale: Pinananatili ang tuwirang paghahambing sa araw nang hindi dinaragdagan ang teksto ng tahasang paliwanag tungkol sa ningning.
- source_word: οἱ πόδες αὐτοῦ
  choice: ang kanyang mga paa
  rationale: Paa ang tuwirang kahulugan ng πόδες at sapat itong malinaw sa larawang inilalarawan.
- source_word: στῦλοι πυρός
  choice: mga haliging apoy
  rationale: Tapat at malinaw na inililipat nito ang genitibong larawan ng mga haligi na waring binubuo ng apoy.
theological_decisions:
- issue: Pagkakakilanlan ng makapangyarihang anghel
  choice: Tinawag lamang siyang “isa pang makapangyarihang anghel,” ayon sa Griyegong teksto.
  alternative: Kilalanin siya bilang nilikhang anghel o bilang pagpapakita ni Cristo.
  rationale: Hindi nilulutas ng talata ang pinagtatalunang pagkakakilanlan ng tauhan, kaya pinananatiling bukas ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nababalot ng ulap” upang maging natural habang pinananatili ang apokaliptikong larawan; hindi tinukoy nang higit sa teksto ang identidad ng anghel.
