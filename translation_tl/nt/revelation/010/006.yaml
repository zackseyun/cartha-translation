id: REV.10.6
reference: Revelation 10:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: tl
  text: At sumumpa siya sa pamamagitan ng Isa na nabubuhay magpakailanman—ang lumikha ng langit at ng mga naroon, ng lupa at ng mga naroon, at ng dagat at ng mga naroon—na hindi na magkakaroon ng pagkaantala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “wala nang panahon.” Sa kontekstong ito, maaaring tumukoy ang χρόνος sa “pagkaantala”—natapos na ang panahon ng paghihintay bago ang pangwakas na pagkilos ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: sumumpa
  rationale: Likas at tuwirang katumbas ito ng paggawa ng isang taimtim na panunumpa.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: sa pamamagitan ng nabubuhay magpakailanman
  rationale: Ang datibo kasunod ng ὀμνύω ay tumutukoy sa pinagbabatayan o pinapanumpaan; malinaw na ipinahahayag ng parirala ang walang-hanggang buhay ng tinutukoy.
- source_word: ἔκτισεν
  choice: lumikha
  rationale: Ang κτίζω sa pormulang kosmiko ay tumutukoy sa paglikha, hindi lamang sa pangkalahatang paggawa.
- source_word: τὸν οὐρανὸν
  choice: langit
  rationale: Sa tatluhang pormulang langit–lupa–dagat, tumutukoy ito sa kosmikong langit.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: ang mga naroon
  rationale: Pinananatili nito ang paulit-ulit na estruktura at saklaw ng lahat ng nasa langit, lupa, at dagat sa natural na Tagalog.
- source_word: γῆν
  choice: lupa
  rationale: Sa kosmikong hanay, ang γῆ ay ang lupa o daigdig, hindi isang lokal na lupain.
- source_word: θάλασσαν
  choice: dagat
  rationale: Tuwirang katumbas ito ng singular na θάλασσα at angkop sa pormula ng paglikha.
- source_word: ὅτι
  choice: na
  rationale: Pagkatapos ng pandiwa ng panunumpa, ipinapakilala nito ang nilalaman ng sumpa.
- source_word: χρόνος οὐκέτι ἔσται
  choice: hindi na magkakaroon ng pagkaantala
  rationale: Sa konteksto ng talata 7, malamang na tumutukoy ang χρόνος sa natitirang panahon ng paghihintay bago ang pangwakas na pagkilos ng Diyos, hindi sa pag-iral ng panahon mismo.
theological_decisions:
- issue: Kahulugan ng χρόνος sa nilalaman ng panunumpa
  choice: pagkaantala o panahon ng paghihintay
  alternative: hindi na magkakaroon ng panahon / mawawala na ang panahon
  rationale: Ipinahihiwatig ng kasunod na talata ang nalalapit na katuparan ng hiwaga ng Diyos. Kaya ang diwa ay wala nang palugit o pagkaantala, samantalang kinikilala sa talababa ang mas literal at tunay na posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang taimtim na himig at ang tatluhang estruktura ng langit, lupa, at dagat; ginamit ang mga gitling upang malinaw na maihiwalay ang paglalarawan sa walang-hanggang nabubuhay.
