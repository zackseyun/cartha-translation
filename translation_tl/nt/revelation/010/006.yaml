  to: At sumumpa siya sa pamamagitan ng Isa na nabubuhay magpakailanman—ang lumikha ng langit at ng mga naroon, ng lupa at ng mga naroon, at ng dagat at ng mga naroon—na hindi na magkakaroon ng pagkaantala.[a]
