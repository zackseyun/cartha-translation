  source_fidelity: Tumpak na naipapahayag ng draft ang panunumpa, ang Maylalang, ang tatluhang langit–lupa–dagat at mga nilalaman ng mga ito, at ang kontekstuwal na pagbasa sa χρόνος bilang pagkaantala. Gayunman, ang «sa pamamagitan ng nabubuhay magpakailanman» ay kulang sa pangngalang tinutukoy at hindi maayos na Filipino; kailangan ang substantival na «ng Isa na nabubuhay magpakailanman.»
  naturalness: Marangal at makabago ang pangkalahatang rehistro. Ang binagong pariralang «sa pamamagitan ng Isa na nabubuhay magpakailanman» ay likas na paraan upang isalin ang panunumpang isinumpa sa pamamagitan ng isang tao.
  terminology: Ang «sumumpa,» «lumikha,» «langit,» «lupa,» «dagat,» at «pagkaantala» ay angkop. Pinananatili ng talababa ang literal na alternatibo nang hindi iginigiit ang isang doktrinal na pagbasa.
