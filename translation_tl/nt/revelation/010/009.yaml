  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: tl
  text: At pumunta ako sa anghel at sinabi kong ibigay niya sa akin ang maliit na balumbon[a]. Sinabi niya sa akin[b], “Kunin mo ito at kainin. Papaitin nito ang tiyan mo[c], ngunit sa bibig mo ay magiging matamis itong gaya ng pulot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliit na aklat.” Ang Griegong βιβλαρίδιον ay salitang nasa anyong diminutibo at maaaring tumukoy sa isang maliit na balumbon o munting aklat.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “Sinasabi niya sa akin.” Gumagamit dito ang Griego ng pangkasalukuyang pandiwa sa pagsasalaysay ng nakaraan upang maging mas buhay ang tagpo.
    reason: lexical_alternative
  - marker: c
    text: O “sikmura.” Ang Griegong κοιλία ay maaari ring isalin bilang “tiyan”; sa konteksto ng pagkain, tumutukoy ito sa bahaging panunaw ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: pumunta ako sa anghel
  rationale: Ipinahihiwatig ng parirala ang pagkilos ni Juan patungo sa anghel. Likas sa makabagong Tagalog ang “pumunta ako sa” at hindi nito binabago ang pananaw ng salaysay.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: sinabi kong ibigay niya sa akin
  rationale: Pinananatili nito ang nilalaman ng sinabi at hindi ipinapalagay na magalang na pakiusap ang pahayag.
- source_word: βιβλαρίδιον
  choice: maliit na balumbon
  rationale: Ipinapakita ng “maliit” ang diminutibong anyo, samantalang ang “balumbon” ang malamang na pisikal na anyo ng kasulatan sa sinaunang konteksto.
- source_word: λέγει μοι
  choice: Sinabi niya sa akin
  rationale: Ginawang karaniwang nagdaang panahunan para sa likas na salaysay sa Tagalog; inilalahad sa talababa ang mas literal na makasaysayang pangkasalukuyan.
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: Kunin mo ito at kainin
  rationale: Malinaw at likas na utos sa Tagalog. Hindi dinagdagan ng paliwanag ang simbolikong pagkilos, at hindi rin labis na pinatindi bilang “lamunin.”
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: Papaitin nito ang tiyan mo
  rationale: Pinananatili ang sanhi at ang kongkretong larawan ng pagkain at pagtunaw. Ang “tiyan” ay karaniwan at madaling maunawaan sa modernong Tagalog.
- source_word: γλυκὺ ὡς μέλι
  choice: magiging matamis itong gaya ng pulot
  rationale: Tuwirang pinananatili ang paghahambing sa tamis ng pulot sa natural na Tagalog.
theological_decisions:
- issue: Simbolikong pagkain sa balumbon
  choice: Pinanatili ang kongkretong utos na kunin at kainin ang balumbon nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag sa salin na ang pagkain ay pagsasaloob sa mensahe ng Diyos.
  rationale: Inilalahad ng talata ang isang simbolikong gawaing propetiko ngunit hindi nito tahasang ipinaliliwanag dito ang buong kahulugan. Ang hindi pagdaragdag ng interpretasyon ay nagpapanatili sa larawan at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “balumbon” bilang tumpak ngunit nauunawaang katawagan sa scroll; iniwasan ang sobrang pormal o denominasyonal na pananalita. Inayos ang mga pananda ng talababa upang bawat isa ay katabi ng mismong salitang nililinaw nito.
