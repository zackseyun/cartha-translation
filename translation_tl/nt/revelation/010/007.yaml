id: REV.10.7
reference: Revelation 10:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: tl
  text: Ngunit sa mga araw ng pagpapahayag ng ikapitong anghel, kapag malapit na siyang tumunog ng trumpeta, matutupad ang hiwaga ng Diyos, gaya ng ipinahayag niya bilang mabuting balita sa sarili niyang mga alipin[a]—ang mga propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griyego ay maaaring tumukoy sa mga alipin o mga lingkod; dito, binibigyang-diin ng “sarili niyang” na sila ay pag-aari at mga itinalaga ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: kundi
  rationale: Malinaw na ipinagpapatuloy nito ang pagsalungat sa naunang pahayag tungkol sa hindi na pagkaantala.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: sa mga araw na maririnig ang tinig ng ikapitong anghel
  rationale: Pinananatili ang 'mga araw' at 'tinig' ng Griyego, ngunit ginagawang likas at malinaw sa Tagalog na ang tinig ay maririnig sa panahong iyon.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: kapag tutunog na siya ng trumpeta
  rationale: Ipinahahayag ng 'na' ang nalalapit na pagkilos na nasa μέλλῃ; likas sa Tagalog ang 'tutunog ng trumpeta.'
- source_word: καὶ ἐτελέσθη
  choice: matutupad
  rationale: Bagaman aorist ang anyong Griyego, nasa panghinaharap na balangkas ang sugnay; ang panghinaharap na Tagalog ay nagpapahayag ng tiyak na katuparan nang hindi ito inilalagay sa nakaraan.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: ang hiwaga ng Diyos
  rationale: '''Hiwaga'' ang natural at dignified na katumbas ng μυστήριον at pinananatili nitong bukas ang kahulugan bilang lihim na layunin ng Diyos.'
- source_word: ὡς εὐηγγέλισεν
  choice: gaya ng mabuting balitang ipinahayag niya
  rationale: Pinananatili ang diwa ng εὐαγγελίζω bilang pagpapahayag ng mabuting balita, hindi lamang pangkalahatang pagbabalita.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: sa sarili niyang mga alipin
  rationale: Ipinakikita ng 'sarili niyang' ang pag-aari at pagtatalaga, samantalang pinananatili ng 'alipin' ang lakas ng δοῦλος; inilalahad sa talababa ang mas malumanay na alternatibo.
- source_word: τοὺς προφήτας
  choice: ang mga propeta
  rationale: Tuwirang panuring na tumutukoy kung sino ang mga alipin ng Diyos.
theological_decisions:
- issue: Ang panahon at puwersa ng ἐτελέσθη sa panghinaharap na sugnay
  choice: matutupad
  alternative: natupad / matatapos
  rationale: Ang aorist ay maaaring maglarawan sa katuparan bilang tiyak at buo, ngunit ang ὅταν μέλλῃ ay naglalagay sa pangyayari sa hinaharap. 'Matutupad' ang pinakanatural na Tagalog at hindi nagtatakda ng isang partikular na sistemang eskatolohikal.
- issue: Pagkasalin ng δοῦλος para sa mga propeta ng Diyos
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang ἑαυτοῦ ay nagbibigay-diin sa kanilang pagiging pag-aari at itinalagang mga kinatawan ng Diyos. Pinananatili ng 'alipin' ang matinding ugnayang iyon, habang inilalagay sa talababa ang 'lingkod' bilang leksikal na alternatibo.
- issue: Kahulugan ng μυστήριον τοῦ θεοῦ
  choice: hiwaga ng Diyos
  alternative: lihim na layunin ng Diyos
  rationale: Hindi tahasang nililinaw ng talata ang buong nilalaman ng hiwaga. Ang 'hiwaga' ay nagpapanatili sa teolohikal na lawak at tensiyon ng parirala.
translation_notes:
  register: Makabago at dignified na Filipino, na may bahagyang apokaliptikong pormalidad. Iniwasan ang sobrang literal na 'mga araw ng tinig,' na malabo sa Tagalog, ngunit pinanatili ang 'tinig' sa halip na ipakahulugang agad na tunog ng trumpeta.
