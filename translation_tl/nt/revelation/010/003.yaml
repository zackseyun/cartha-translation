  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: tl
  text: At sumigaw siya nang malakas, gaya ng leon na umuungal. At nang sumigaw siya, nagsalita ang pitong kulog sa kani-kanilang tinig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipinarinig ng pitong kulog ang kani-kanilang tinig.” Kapansin-pansing literal ang Griyego at inilalarawan ang mga kulog na parang mga taong nagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: sumigaw
  rationale: Tuwirang ipinahahayag ang isang malakas at mariing pagsigaw, nang hindi ipinahihiwatig na iyon ay sigaw dahil sa dalamhati.
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Natural na pahayag sa makabagong Tagalog para sa paraan ng pagsigaw. Bagaman ginagawang pang-abay ang konkretong pangngalang φωνή, malinaw nitong napapanatili ang lakas ng tinig at iniiwasan ang pilit na parirala.
- source_word: ὥσπερ λέων μυκᾶται
  choice: gaya ng pag-ungal ng leon
  rationale: Pinananatili ang tahasang paghahambing at ginagamit ang karaniwang pandiwa para sa malakas na tinig ng leon.
- source_word: ὅτε
  choice: nang
  rationale: Nagpapahayag ng temporal na ugnayan nang hindi dinaragdagan ng sanhi o tiyak na agwat ng panahon.
- source_word: αἱ ἑπτὰ βρονταί
  choice: ang pitong kulog
  rationale: Pinananatili ang tiyak at personipikadong mga kulog sa pangitain.
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: nagsalita ... sa kani-kanilang tinig
  rationale: Natural sa Tagalog habang pinananatili ang kapansin-pansing personipikasyon at ang diin ng ἑαυτῶν na bawat kulog ay may sariling tinig.
theological_decisions:
- issue: Personipikasyon ng pitong kulog
  choice: nagsalita ang pitong kulog sa kani-kanilang tinig
  alternative: dumagundong ang pitong kulog
  rationale: Tahasan sa Griyego na nagsalita ang mga kulog at mayroon silang sariling mga tinig. Pinananatili ito bilang bahagi ng apokaliptikong larawan sa halip na gawing karaniwang tunog lamang ng kulog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kani-kanilang tinig” upang natural na maipahayag ang maramihang “sarili nilang mga tinig” at mapanatili ang personipikasyon.
