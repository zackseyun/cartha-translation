id: REV.10.10
reference: Revelation 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: tl
  text: At kinuha ko sa kamay ng anghel ang munting balumbon[a] at kinain iyon. Sa bibig ko ay matamis iyon na gaya ng pulot; ngunit nang makain ko na iyon, pumait ang tiyan ko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “munting aklat.” Diminutibo ang salitang Griyego at maaaring tumukoy sa isang maliit na nakasulat na dokumento; malamang na balumbon ang sinaunang anyo nito.
    reason: lexical_alternative
  - marker: b
    text: O “pumait ang sikmura ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: munting balumbon
  rationale: Ipinahihiwatig ng anyong diminutibo ang isang maliit na nakasulat na dokumento. Ang “balumbon” ang pinakamalamang na sinaunang anyo nito, at pinananatili ng “munting” ang diminutibong diwa.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: sa kamay ng anghel
  rationale: Likas na salin sa Filipino na pinananatili ang malinaw na larawang tuwirang kinuha ng tagapagsalaysay ang balumbon mula sa kamay ng anghel.
- source_word: κατέφαγον
  choice: kinain
  rationale: Sapat at natural ang “kinain” para sa simbolikong kilos. Ang mas mariing “nilamon” ay maaaring magdagdag ng tonong hindi tiyak na hinihingi ng konteksto.
- source_word: ὡς μέλι γλυκύ
  choice: matamis ... na gaya ng pulot
  rationale: Pinananatili nito ang tahasang paghahambing sa pulot habang natural ang ayos sa modernong Filipino.
- source_word: ὅτε ἔφαγον αὐτό
  choice: nang makain ko na iyon
  rationale: 'Malinaw na ipinakikita ng parirala ang pagkakasunod-sunod: matapos kainin ang balumbon ay pumait ang tiyan. Hindi nito inaangkin na may hiwalay na pluperfect na halaga ang aorist.'
- source_word: ἐπικράνθη
  choice: pumait
  rationale: Natural na Filipino ito para sa pagbabago ng kalagayan na ipinahahayag ng aorist passive sa kontekstong ito. Ang tahasang pasibong “ginawang mapait” ay mabigat at maaaring magpahiwatig ng lantad na tagagawa na hindi binabanggit.
- source_word: κοιλία
  choice: tiyan
  rationale: Karaniwan, malinaw, at marangal na salitang Filipino para sa panloob na bahagi ng katawan; iniiwasan nito ang teknikal na “abdomen” at ang posibleng mas kolokyal na “sikmura” sa ilang gamit.
theological_decisions:
- issue: Simbolikong pagkain sa balumbon
  choice: Tuwirang panatilihin ang larawan ng tamis sa bibig at pait sa tiyan nang walang paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag sa salin na ang tamis at pait ay tumutukoy sa kagalakan at paghuhukom.
  rationale: Hindi tahasang ipinaliliwanag ng talata ang buong kahulugan ng simbolo. Ang literal na larawan ay nagpapanatili sa teolohikal na tensiyon at umiiwas sa pagpasok ng isang interpretasyon sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “munting balumbon” upang mapanatili ang sinaunang pisikal na larawan at ang diminutibong diwa. Hinati sa dalawang pangungusap para sa malinaw na pagbasa, habang pinanatili ang pagkakasunod-sunod at simbolikong tensiyon ng Griyego.
