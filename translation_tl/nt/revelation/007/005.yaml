id: REV.7.5
reference: Revelation 7:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: tl
  text: mula sa lipi ni Juda, labindalawang libo ang tinatakan; mula sa lipi ni Ruben, labindalawang libo; mula sa lipi ni Gad, labindalawang libo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: mula sa
  rationale: Karaniwang panandang Tagalog para sa pinagmulan o kinabibilangang pangkat; pinananatili rin nito ang paulit-ulit na pormula ng Griyego.
- source_word: φυλῆς
  choice: lipi
  rationale: Sa talaang genealogical ng Israel, ang “lipi” ang natural at nakaugaliang tawag sa tribong nagmula sa isang ninuno.
- source_word: Ἰούδα
  choice: Juda
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: δώδεκα χιλιάδες
  choice: labindalawang libo
  rationale: Tuwirang salin ng bilang; hindi kailangang idagdag ang “katao” sapagkat malinaw ito sa konteksto.
- source_word: ἐσφραγισμένοι
  choice: ang tinatakan
  rationale: Ipinahahayag ang pasibong diwa ng participle sa natural na Tagalog, habang inilalagay lamang ito sa unang sugnay gaya ng Griyego at hinahayaang maunawaan sa mga kasunod na magkakatulad na sugnay.
- source_word: Ῥουβὴν
  choice: Ruben
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: Γὰδ
  choice: Gad
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog.
theological_decisions:
- issue: Diwa at saklaw ng ἐσφραγισμένοι sa talaan ng mga lipi
  choice: Isinaling “ang tinatakan” sa unang sugnay, at hindi na inulit sa mga sumunod na sugnay.
  alternative: Maaaring isalin nang higit na pormal bilang “mula sa lipi ni Juda, labindalawang libong tinatakan,” o ulitin ang “ang tinatakan” sa bawat lipi.
  rationale: Nasa hulihan ng unang bilang ang pasibong participle sa Griyego at likas na naglalarawan sa mga binilang sa buong talaan. Pinananatili ng salin ang tahasang paglitaw nito sa unang sugnay at ang ellipsis sa mga kasunod, nang hindi dinaragdagan o nilulutas ang saklaw nito nang lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Bibliya. Pinanatili ang maikli at paulit-ulit na ayos ng talaan sa Griyego.
