id: REV.7.12
reference: Revelation 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: tl
  text: na nagsasabi, “Amen! Ang pagpapala, ang kaluwalhatian, ang karunungan, ang pasasalamat, ang karangalan, ang kapangyarihan, at ang kalakasan ay sa ating Diyos magpakailanman.[a] Amen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa ating Diyos hanggang sa mga kapanahunan ng mga kapanahunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pinananatili nito ang pangkasalukuyang pandiwaring maramihan na nag-uugnay sa pagbubunyi sa mga gumagawa ng kilos sa naunang talata.
- source_word: Ἀμήν / ἀμήν
  choice: Amen
  rationale: Ang nakaugaliang anyong liturhikal ay angkop sa pagbubunying ito, at ang pag-uulit nito ay nagsisilbing pambungad at pangwakas.
- source_word: ἡ εὐλογία
  choice: ang pagpapala
  rationale: Ipinahihiwatig dito ang pagpapalang iniuukol sa Diyos; pinananatili rin ang pangngalang anyo ng pitong bahaging pagbubunyi.
- source_word: ἡ δόξα
  choice: ang kaluwalhatian
  rationale: Ito ang malinaw at nakaugaliang katumbas sa konteksto ng pagpupuri sa Diyos.
- source_word: ἡ σοφία
  choice: ang karunungan
  rationale: Tuwirang katumbas na angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: ἡ εὐχαριστία
  choice: ang pasasalamat
  rationale: Pinananatili ang pangngalang anyo at ang diwa ng pagpapasalamat bilang bahagi ng pagpupuri.
- source_word: ἡ τιμή
  choice: ang karangalan
  rationale: Sa konteksto ng pagsamba, tumutukoy ito sa karangalang iniuukol sa Diyos, hindi sa halagang pangkabuhayan.
- source_word: ἡ δύναμις
  choice: ang kapangyarihan
  rationale: Karaniwang katumbas ito ng δύναμις at ipinakikita ang kakayahan o kapangyarihan.
- source_word: ἡ ἰσχύς
  choice: ang kalakasan
  rationale: Ibinubukod ito sa δύναμις habang pinananatili ang magkaugnay na diin ng dalawang salitang Griyego.
- source_word: τῷ θεῷ ἡμῶν
  choice: ay sa ating Diyos
  rationale: Ang Griyego ay walang hayag na pandiwa. Ang pariralang Tagalog na ito ay nagsasaad ng pag-uukol sa Diyos nang hindi ipinipilit na ito ay tahasang pahayag ng pagmamay-ari.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Likas at malinaw itong katumbas sa Tagalog ng idyomang Griyego para sa walang-hanggang tagal; inilalagay sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagdaragdag ng ipinahihiwatig na pandiwa sa pagbubunyi
  choice: ay sa ating Diyos
  alternative: ay pag-aari ng ating Diyos
  rationale: Walang pandiwa ang sugnay sa Griyego. Pinananatili ng “ay sa ating Diyos” ang diwa ng pag-uukol sa pagsamba at hindi nito nililimitahan ang pahayag sa pagmamay-ari lamang.
- issue: Pagkakaiba ng δύναμις at ἰσχύς
  choice: kapangyarihan … kalakasan
  alternative: kapangyarihan … lakas
  rationale: Pinananatili ang dalawang magkalapit ngunit magkaibang salita upang hindi mapatag ang retorikal na kasaganaan ng pitong bahaging pagpupuri.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Inulit ang pantukoy na “ang” sa bawat sangkap upang mapanatili ang sinadyang ritmo at pitong bahaging ayos ng Griyego. Inilipat ang talababa sa pariralang talagang tinutukoy nito.
