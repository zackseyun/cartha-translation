  source_fidelity: Tapat ang salin sa pitong magkakaugnay na pangngalan ng Griyego, sa pag-uukol ng mga ito sa “ating Diyos,” at sa pangwakas na pagpapahayag ng walang-hanggang tagal. Maayos ding napanatili ang pambungad at pangwakas na “Amen.” Ang “ay sa ating Diyos” ay angkop na pagpapanatili ng ascriptive at verbless na anyo ng Griyego nang hindi nagdaragdag ng doktrinal na pagbasa.
  naturalness: Likas at marangal ang Filipino ng doxology. Ang pag-uulit ng “ang” ay nagbibigay ng malinaw na ritmo at tumutugma sa pormal na talaan sa pinagmulan. Ang “magpakailanman” ay idiomatiko at sapat na katumbas ng εἰς τοὺς αἰῶνας τῶν αἰώνων.
