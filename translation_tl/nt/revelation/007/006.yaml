  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: tl
  text: mula sa lipi ni Aser, labindalawang libo[a]; mula sa lipi ni Neftali, labindalawang libo; mula sa lipi ni Manases, labindalawang libo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, kung mas tahasang isasaad batay sa konteksto: “mula sa lipi ni Aser, labindalawang libo ang tinatakan” (at gayundin sa mga sumunod na lipi). Hindi inuulit sa Griyego ng talatang ito ang pandiwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: mula sa
  rationale: Ipinapahayag ng pang-ukol ang pinagmulan o kinabibilangang pangkat; natural ang “mula sa” sa talaang ito.
- source_word: φυλῆς
  choice: lipi
  rationale: Sa konteksto ng mga pangkat ng Israel, ang “lipi” ang karaniwan at tiyak na salin ng φυλή sa modernong Filipino.
- source_word: Ἀσὴρ
  choice: Asher
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino na malapit sa transliterasyon ng Griyego.
- source_word: δώδεκα χιλιάδες
  choice: labindalawang libo
  rationale: Tuwirang isinasalin ang bilang. Hindi idinagdag sa pangunahing teksto ang pandiwang “tinatakan” sapagkat wala itong katumbas na pandiwa sa Griyego ng talatang ito.
- source_word: Νεφθαλὶμ
  choice: Neftali
  rationale: Ginamit ang nakaugaliang modernong Filipino na anyo ng pangalan.
- source_word: Μανασσῆ
  choice: Manases
  rationale: Ginamit ang nakaugaliang Filipino na anyo ng pangalang panlipi.
theological_decisions:
- issue: Kung idaragdag ang ipinahihiwatig na pandiwang “tinatakan” mula sa nakapaligid na konteksto
  choice: Hindi idagdag ang pandiwa sa pangunahing teksto; panatilihin ang maikli at walang-pandiwang talaan ng Griyego.
  alternative: “mula sa lipi ni Asher, labindalawang libo ang tinatakan,” at gayundin sa mga sumunod na lipi
  rationale: Malinaw sa naunang konteksto na ang bilang ay tungkol sa mga tinatakan, ngunit walang inuulit na pandiwa sa Griyego ng talatang ito. Pinananatili ng salin ang anyo at bahagyang pagpapaubaya ng orihinal, habang ipinaliliwanag sa talababa ang ipinahihiwatig ng konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga em dash upang maging natural at malinaw ang walang-pandiwang pag-iisa-isa, nang hindi nagdaragdag ng salitang wala sa talata. Nasa pangunahing teksto ang marker na [a].
