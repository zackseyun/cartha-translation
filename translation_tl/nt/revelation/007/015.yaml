language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: tl
  text: Dahil dito, nasa harap sila ng trono ng Diyos at naglilingkod sa kanya araw at gabi sa kanyang templo. At ang nakaupo sa trono ay ilulukob ang kanyang tolda sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mananahan siyang nakalukob sa kanila” o “magbibigay siya sa kanila ng kanlungan.” Ang pandiwang Griyego ay kaugnay ng larawan ng tolda o tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Dahil dito
  rationale: Malinaw nitong inuugnay ang talata sa naunang paliwanag at pinananatili ang sanhi o batayan ng kalagayan nila.
- source_word: ἐνώπιον
  choice: nasa harap
  rationale: Likas at maikli sa modernong Tagalog, at ipinahahayag kapwa ang lokasyon at pagharap sa presensiya ng Diyos.
- source_word: λατρεύουσιν
  choice: naglilingkod
  rationale: Saklaw nito ang sagradong paglilingkod sa Diyos; ipinahihiwatig ng konteksto ng templo na ito ay mapagsambang paglilingkod, nang hindi nililimitahan sa papuri lamang.
- source_word: ἡμέρας καὶ νυκτός
  choice: araw at gabi
  rationale: Pinananatili ang malinaw na larawan ng walang tigil na paglilingkod.
- source_word: ναῷ
  choice: templo
  rationale: Karaniwan at madaling maunawaang katumbas ng ναός; nililinaw ng makalangit na tagpo ang tinutukoy na santuwaryo.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: ang nakaupo sa trono
  rationale: Natural sa kasalukuyang Tagalog at pinananatili ang lakas ng pariralang tumutukoy sa Diyos sa pamamagitan ng kanyang pagluklok.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: maglaladlad ng kanyang tolda sa ibabaw nila
  rationale: Pinananatili ang larawang tolda/tabernakulo at ang diwa ng presensiyang kumukupkop, samantalang hindi tahimik na pinipili lamang ang interpretasyong 'mananahan' o 'kakanlungan.'
theological_decisions:
- issue: Pagpapahayag sa σκηνώσει bilang larawan ng banal na presensiya
  choice: maglaladlad ng kanyang tolda sa ibabaw nila
  alternative: mananahan sa ibabaw nila; kakanlungan sila
  rationale: Pinananatili ng salin ang metapora ng tolda o tabernakulo at ang kaugnay na diwa ng presensiya at pagkupkop ng Diyos, nang hindi dinaragdagan ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tolda” sa pangunahing teksto upang maging malinaw sa karaniwang mambabasa, habang inilagay sa talababa ang “tabernakulo” at ang mga alternatibong diwa.
