  to: Dahil dito, nasa harap sila ng trono ng Diyos at naglilingkod sa kanya araw at gabi sa kanyang templo. At ang nakaupo sa trono ay ilulukob ang kanyang tolda sa kanila.[a]
  rationale: Pinalitan ang pandiwang “maglaladlad” ng “ilulukob” upang maging mas natural ang Tagalog habang pinananatili ang konkretong larawan ng tolda at ang diwa ng protektibong presensiya. Inayos din ang unang alternatibo sa talababa upang hindi maging pilit ang “sa ibabaw nila,” ngunit hindi rin mawala ang ideya ng paglukob na ipinahihiwatig ng ἐπί.
