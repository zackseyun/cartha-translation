    rationale: Bagaman nauunawaan at malapit sa English audit trail, ang “magladlad” ay mas karaniwang tumutukoy sa paglalatag o pagsasampay ng isang bagay. Ang “ilulukob” ay mas idiomatiko para sa toldang sumasaklaw at mas angkop sa protektibong imahen ng ἐπ’ αὐτούς.
  - severity: low
    issue: Medyo literal at hindi natural ang alternatibong “mananahan sa ibabaw nila” sa talababa.
    rationale: Maaaring panatilihin ang diwa ng divine dwelling at ng paglukob sa mas natural na Tagalog sa pamamagitan ng “mananahan siyang nakalukob sa kanila.”
