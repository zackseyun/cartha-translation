  source_fidelity: 'Tumpak ang pangunahing daloy ng salin: naipapahayag ang ugnayang sanhi sa διὰ τοῦτο, ang pananatili sa harap ng trono, ang patuloy na sagradong paglilingkod, at ang larawang-tolda ng σκηνώσει ἐπ’ αὐτούς. Gayunman, ang “maglaladlad ng kanyang tolda sa ibabaw nila” ay hindi ang pinakanatural na paraan sa modernong Tagalog upang ilarawan ang paglukob ng tolda.'
  naturalness: Marangal at malinaw ang karamihan ng teksto. Mas likas ang “ilulukob ang kanyang tolda sa kanila,” na malinaw na nagpapahiwatig ng toldang nakatakip o nakasilong sa kanila nang hindi isinasantabi ang metapora.
  terminology: Ang “trono,” “Diyos,” “naglilingkod,” at “templo” ay angkop at pare-pareho ang rehistro. Ang “tolda” ay malinaw na modernong katumbas at pinananatili ang tabernakulong imahen; ang talababa ay nagbibigay ng mga semantikong alternatibo.
  issues:
