    rationale: 'Kailangan ang paksa o pang-ugnay na “ang” sa karaniwang Filipino: “walang hangin ang umihip.”'
  - severity: low
    issue: Ang “Pinigilan nila” ay mas nakatuon sa natapos na kilos kaysa sa participial na paglalarawan ng mga anghel habang nakatayo.
    rationale: Ang “na pumipigil” ay mas malapit sa sabayang paglalarawan ng κρατοῦντας at mas maayos na ikinakabit sa “apat na anghel.”
