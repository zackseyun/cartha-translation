  source_fidelity: Tumpak na naihahatid ng salin ang pagkakasunod-sunod ng pangitain, ang apat na anghel, ang apat na sulok at hangin ng lupa, at ang saklaw na lupa, dagat, at bawat puno. Gayunman, mas malinaw na panatilihin ang aspekto ng Griyegong participle sa pamamagitan ng “na pumipigil,” sa halip na ang nakaraang-aspektong “Pinigilan nila.”
  naturalness: May maliit ngunit mahalagang suliraning panggramatika sa “upang walang hanging umihip.” Sa makabagong Filipino, natural at malinaw ang “upang walang hangin ang umihip.” Ang binagong pangungusap ay mas maayos ding nag-uugnay sa nakita ni Juan at sa sabayang kilos ng mga anghel.
  terminology: Ang “anghel,” “lupa,” “dagat,” “hangin,” at “alinmang puno” ay angkop at pare-pareho. Ang “apat na sulok ng lupa” ay wastong pinanatiling literal bilang nakaugaliang larawang apokaliptiko, na may kapaki-pakinabang na paliwanag sa talababa.
  issues:
