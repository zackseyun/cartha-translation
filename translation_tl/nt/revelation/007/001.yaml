id: REV.7.1
reference: Revelation 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: tl
  text: Pagkatapos nito[a], nakita ko ang apat na anghel na nakatayo sa apat na sulok ng lupa[b], na pumipigil sa apat na hangin ng lupa upang walang hangin ang umihip sa lupa, sa dagat, o sa alinmang puno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na paraan, “Pagkatapos ng mga bagay na ito, nakita ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “apat na sulok ng lupa” ay nakaugaliang pananalita para sa mga dulo ng lupa o sa apat na direksiyon.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Pagkatapos nito
  rationale: Likas na makabagong Filipino para sa panandang nagsasaad ng kasunod na tagpo, habang pinananatili ang temporal na pagkakasunod-sunod.
- source_word: εἶδον
  choice: nakita ko
  rationale: Tuwirang naghahayag ng pangitain; hindi kailangan ang dagdag na ‘tumingin ako’ na wala sa Griyego.
- source_word: τέσσαρας ἀγγέλους
  choice: apat na anghel
  rationale: Tuwirang katumbas ng bilang at pangngalan.
- source_word: ἑστῶτας
  choice: nakatayo
  rationale: Inilalarawan nito ang kalagayan o tindig ng mga anghel; ang ‘nakapuwesto’ ay magiging mas interpretatibo.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: sa apat na sulok ng lupa
  rationale: Pinananatili ang nakaugaliang larawang apokaliptiko. Sa Filipino, ang ‘sa’ ang likas na katumbas ng lokatibong gamit ng ἐπί rito.
- source_word: κρατοῦντας
  choice: pinigilan nila
  rationale: Ipinahihiwatig ng konteksto na hinahadlangan ng mga anghel ang pag-ihip ng hangin. Ginawang pangunahing pandiwa ang participle upang maging malinaw at natural sa Filipino nang hindi binabago ang gumagawa ng kilos.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: ang apat na hangin ng lupa
  rationale: Pinananatili ang karaniwang larawang apokaliptiko ng mga hanging mula sa apat na direksiyon.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: upang walang hanging umihip
  rationale: Ang ἵνα na may subjunctive ay nagsasaad ng layunin o kinalabasan; malinaw na naihahayag ng pariralang Filipino ang ganap na pagpigil sa hangin.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: sa lupa, sa dagat, o sa alinmang puno
  rationale: Natural na koordinasyon sa Filipino sa ilalim ng naunang pagtanggi. Ang ‘alinmang puno’ ay nagpapanatili sa distributibong diwa ng πᾶν δένδρον.
theological_decisions:
- issue: Saklaw ng γῆ sa pangitaing apokaliptiko
  choice: Isinalin bilang ‘lupa’ sa buong talata.
  alternative: lupain
  rationale: 'Pandaigdigan o kosmiko ang larawan: apat na sulok, apat na hangin, lupa, dagat, at bawat puno. Ang ‘lupain’ ay maaaring di-kinakailangang magpaliit sa saklaw.'
- issue: Kalikasan ng pananalitang ‘apat na sulok ng lupa’
  choice: Pinanatili ang tayutay nang literal.
  alternative: apat na dulo ng lupa
  rationale: Nakaugaliang wikang pangitain ang parirala. Ang literal na anyo ay nagpapanatili sa larawan ng teksto nang hindi ito ginagawang pahayag tungkol sa siyentipikong hugis ng daigdig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang apokaliptikong larawan ngunit hinati sa dalawang pangungusap upang maging natural at madaling maunawaan; hindi nito binabago ang ugnayan ng mga kilos sa Griyego.
