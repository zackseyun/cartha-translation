base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: tl
  text: mula sa lipi ni Zebulun, labindalawang libo; mula sa lipi ni Jose, labindalawang libo; mula sa lipi ni Benjamin, labindalawang libo—pawang tinatakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na tinatakan” o “na pawang tinatakan.” Ang Griyegong pandiwari sa dulo ay nagbubuod sa lahat ng pangkat na nakatala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: mula sa
  rationale: Likas na panandang Filipino para sa pinagmulan o kinabibilangang pangkat, at napapanatili ang inuulit na hulma ng talaan.
- source_word: φυλῆς
  choice: lipi
  rationale: Sa konteksto ng mga pangkat ng Israel, ang “lipi” ang karaniwan at malinaw na katumbas ng tribal division.
- source_word: Ζαβουλών
  choice: Zebulun
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: δώδεκα χιλιάδες
  choice: labindalawang libo
  rationale: Tuwirang inililipat ang bilang at pinananatili ang pormal na ayos ng talaan.
- source_word: Ἰωσήφ
  choice: Jose
  rationale: Pinanatili ang mismong pangalang nasa Griyego sa nakaugaliang anyong Filipino; hindi ito pinalitan ng Efraim o Manases.
- source_word: Βενιαμίν
  choice: Benjamin
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: ἐσφραγισμένοι
  choice: mga tinatakan
  rationale: Ipinahahayag nito ang pasibong diwa ng pandiwari at inilalagay sa dulo bilang buod na paglalarawan sa mga nakatalang pangkat. Ang gitling-pahaba ay tumutulong upang malinaw na basahin ito bilang pangwakas na buod.
theological_decisions:
- issue: Saklaw at lakas ng pangwakas na pandiwaring ἐσφραγισμένοι
  choice: Inilagay sa dulo bilang “mga tinatakan,” isang pangwakas na paglalarawan sa mga nakatalang libo mula sa tatlong lipi.
  alternative: “na tinatakan” o “na mga natatakan”
  rationale: Pinananatili nito ang pangwakas na puwesto at pasibong/resultatibong diwa ng Griyego nang hindi ipinapaliwanag kung ano ang likas o teolohikal na kahulugan ng pagtatatak.
translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang paulit-ulit na estruktura ng talaan. Ginamit ang “lipi” at ang karaniwang anyong Filipino ng mga pangalang biblikal.
