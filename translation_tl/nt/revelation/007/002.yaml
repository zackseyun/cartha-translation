id: REV.7.2
reference: Revelation 7:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: tl
  text: At nakita ko ang isa pang anghel na umaakyat mula sa silangan[a], na taglay ang tatak ng Diyos na buháy, at sumigaw siya nang malakas sa apat na anghel na ipinagkaloob na pinsalain ang lupa at ang dagat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “mula sa pagsikat ng araw.”
    reason: Pinananatili ang literal na larawan ng ἀπὸ ἀνατολῆς ἡλίου habang ginagamit ang likas na panandang direksiyon na “silangan” sa pangunahing teksto.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: isa pang anghel
  rationale: Likas na ipinahihiwatig ng ἄλλον ang isang karagdagang anghel na naiiba sa apat na naunang binanggit.
- source_word: ἀναβαίνοντα
  choice: umaakyat
  rationale: Pinananatili nito ang tahasang paitaas na kilos ng pandiwari at ang pananaw ng pangitain.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: mula sa silangan
  rationale: Ito ang malinaw at likas na panandang direksiyon sa makabagong Tagalog; inilalagay sa talababa ang literal na larawang 'pagsikat ng araw.'
- source_word: ἔχοντα σφραγῖδα
  choice: taglay niya ang tatak
  rationale: Ang 'taglay' ay natural para sa ἔχω at hindi nagpapasiya kung hawak lamang o suot ang σφραγίς; ang 'tatak' ay nagpapanatili sa kongkretong larawang ginagamit sa pagmamarka o pagpapatunay.
- source_word: θεοῦ ζῶντος
  choice: ng Diyos na buháy
  rationale: Tumpak na pinananatili ang kinikilalang biblikal na paglalarawan sa Diyos at ang diin na siya ay buháy.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: sumigaw siya nang malakas
  rationale: Likas at maringal na Tagalog ito para sa matinding sigaw at malakas na tinig, nang hindi nagiging kahoy ang pagkakasalin.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: sa apat na anghel
  rationale: Tuwirang paglilipat ng datibong pinag-uukulan ng sigaw.
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: na pinagkalooban
  rationale: Pinananatili ng pandiwang balintiyak ang ideya ng ipinagkaloob na pahintulot o awtoridad nang hindi nagdaragdag ng salitang 'kapangyarihan' o tahasang pinapangalanan ang nagkaloob.
- source_word: ἀδικῆσαι
  choice: pinsalain
  rationale: Sa konteksto, tumutukoy ito sa pagdudulot ng pinsala sa sangnilikha, hindi lamang sa abstraktong paggawa ng kawalang-katarungan.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: ang lupa at ang dagat
  rationale: Ang 'lupa' ay natural na Tagalog para sa γῆ at, katambal ng dagat, pinananatili ang saklaw ng larawang pangkalawakan nang hindi ipinipilit kung 'daigdig' o 'kalupaan' lamang.
theological_decisions:
- issue: Saklaw ng ipinagkaloob sa ἐδόθη
  choice: pinagkaloobang pinsalain
  alternative: binigyan ng kapangyarihang pinsalain; pinahintulutang pinsalain
  rationale: Walang tahasang layon ang ἐδόθη sa Griyego. Iniiwasan ng salin ang pagdaragdag ng 'kapangyarihan' at hindi rin nililimitahan ang diwa sa pahintulot lamang; nananatiling bukas ang ipinagkaloob na awtoridad o pahintulot.
- issue: Direksiyon sa ἀπὸ ἀνατολῆς ἡλίου
  choice: mula sa silangan sa pangunahing teksto
  alternative: mula sa pagsikat ng araw
  rationale: Ipinahahayag ng 'silangan' ang karaniwang panandang direksiyon, samantalang iniingatan sa talababa ang literal at maaaring makabuluhang larawan ng pagsikat ng araw.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at maringal. Hinati sa tatlong pangungusap ang mahabang sugnay para sa madaling pagbasa, ngunit pinanatili ang ugnayang sintaktiko at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata. Ginamit ang tuldik sa “buháy” upang maiwasan ang maling pagbasa.
