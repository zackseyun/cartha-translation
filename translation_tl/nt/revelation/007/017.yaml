id: REV.7.17
reference: Revelation 7:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: tl
  text: sapagkat ang Korderong nasa gitna ng trono[a] ang magpapastol sa kanila at gagabay[b] sa kanila patungo sa mga bukal ng tubig ng buhay[c], at papahirin ng Diyos ang bawat luha sa kanilang mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nasa sentro ng trono.”
    reason: lexical_alternative
  - marker: b
    text: O, “aakay.”
    reason: lexical_alternative
  - marker: c
    text: O, “sa mga bukal ng tubig na nagbibigay-buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: Kordero
  rationale: Ginamit bilang kinikilalang titulo ni Cristo sa Pahayag. Pinananatili nito ang imaheng hain at mesiyaniko nang hindi nagpapahiwatig ng maliit o murang tupa.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: nasa gitna ng trono
  rationale: Pinananatili ang matingkad na paglalarawan ng sentral na kinalalagyan ng Kordero kaugnay ng trono.
- source_word: ποιμανεῖ
  choice: magpapastol
  rationale: Tuwirang pinananatili ang sinasadyang kabalintunaan na ang Kordero mismo ang kikilos bilang pastol; ang konteksto ng paggabay sa tubig ay sumusuporta sa pastoral, hindi lamang maharlikang, diwa.
- source_word: ὁδηγήσει
  choice: gagabay
  rationale: Likas at malinaw na katumbas sa makabagong Tagalog, at hindi nito inuulit lamang ang diwa ng pagpapastol.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: patungo sa mga bukal ng tubig ng buhay
  rationale: Pinananatili ang posibleng pagkakaugnay ng ζωῆς sa tubig bilang 'tubig ng buhay,' habang natural na isinasalin ang galaw na ipinahihiwatig ng ἐπί bilang 'patungo sa.'
- source_word: ἐξαλείψει
  choice: papahirin
  rationale: Likas sa Tagalog para sa maaliwalas at mapag-aliw na larawan ng pag-aalis ng luha.
- source_word: πᾶν δάκρυον
  choice: bawat luha
  rationale: Pinananatili ang paisa-isang diin at ganap na saklaw ng singular na may πᾶν.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: sa kanilang mga mata
  rationale: Ito ang natural na pariralang Tagalog kasunod ng 'papahirin' at tapat na pinananatili ang larawan ng pag-aalis ng luha mula sa mga mata.
theological_decisions:
- issue: Ang Kristolohikal na kabalintunaan ng Kordero bilang pastol
  choice: Pinanatili ang tuwirang pahayag na ang Kordero ay magpapastol sa kanila.
  alternative: Ang Kordero ay mag-aalaga o mamamahala sa kanila.
  rationale: Sinasadya ng talata ang imaheng ang Kordero rin ang Pastol. Ang pagpapalabnaw nito bilang pangkalahatang pag-aalaga o pamamahala ay makababawas sa natatanging lakas ng larawan.
- issue: Ang kaugnayan ng Diyos sa Kordero sa huling sugnay
  choice: Pinanatili ang Diyos bilang tahasang simuno ng 'papahirin.'
  alternative: Ipagpatuloy nang di-tuwiran ang Kordero bilang simuno.
  rationale: Tahasang pinangalanan ng Griyego ang ὁ θεός bilang simuno ng huling pandiwa, kaya hindi dapat pag-isahin ang mga simuno ng dalawang sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'Kordero' bilang pamilyar na titulong biblikal, 'magpapastol' upang mapanatili ang mahalagang larawan, at 'gagabay' bilang payak na salitang nauunawaan ng karaniwang mambabasa. Inilagay ang mga tandang-talababa kaagad sa mga pariralang tinutukoy ng mga ito.
