source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: tl
  text: Pagkatapos, sumagot ang isa sa matatanda at sinabi sa akin, “Sino ang mga ito na nakasuot ng puting kasuotan, at saan sila nanggaling[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “saan sila nagmula?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Pagkatapos
  rationale: Ginamit bilang pang-ugnay na nagpapasulong sa pagkakasunod-sunod ng pangitain; mas natural ito rito kaysa sa payak na “At.”
- source_word: ἀπεκρίθη … λέγων μοι
  choice: sinabi sa akin
  rationale: Ang ἀπεκρίθη ay maaaring mangahulugang “sumagot,” ngunit nagagamit din itong panimulang pormula sa pagsasalita kahit walang naunang tuwirang tanong. Ang “sinabi sa akin” ay natural sa Tagalog at hindi nagpapahiwatig ng tanong na wala sa teksto.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: isa sa matatanda
  rationale: Pinananatili ang partitive na diwa at ang katawagang ginagamit para sa pangkat sa pangitain nang hindi nagdaragdag ng tungkuling hindi tahasang binanggit dito.
- source_word: οἱ περιβεβλημένοι
  choice: mga nakasuot
  rationale: 'Likas na Tagalog para sa kasalukuyang kalagayang ipinahihiwatig ng perfect participle: ang mga taong nabihisan at ngayo’y suot ang kasuotan.'
- source_word: τὰς στολὰς τὰς λευκάς
  choice: puting kasuotan
  rationale: Ang στολή ay mahaba o natatanging damit. Ang “kasuotan” ay marangal at malinaw, at iniiwasan ang mas tiyak ngunit maaaring mapanlinlang na “balabal.”
- source_word: τίνες εἰσὶν
  choice: sino sila
  rationale: Direkta at natural na pagtatanong tungkol sa pagkakakilanlan ng pangkat.
- source_word: πόθεν ἦλθον
  choice: saan sila nanggaling
  rationale: Ipinahahayag ng πόθεν ang pinagmulan. Natural sa modernong Tagalog ang “nanggaling” at pinananatili nito ang nakaraang pagdating na mahalaga sa kasalukuyang tagpo.
theological_decisions:
- issue: Aspekto ng ἦλθον
  choice: saan sila nanggaling
  alternative: saan sila nagmula
  rationale: Ang aorist ay tumutukoy sa nakaraang pagdating, ngunit walang kailangang ipilit na natatanging teolohikal na pagbasa. Parehong naipahahayag ng mga anyong Tagalog ang pinagmulan; pinili ang mas karaniwang pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang retorikal na ayos ng tanong sa pamamagitan ng gitling, at iniwasang gawing teknikal o denominasyonal ang katawagang “matatanda.”
