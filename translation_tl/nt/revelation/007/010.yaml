id: REV.7.10
reference: Revelation 7:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: tl
  text: At malakas silang sumisigaw, “Sa ating Diyos na nakaupo sa trono at sa Kordero ang kaligtasan!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ang kaligtasan ay sa ating Diyos na nakaupo sa trono at sa Kordero.”'
    reason: Pinananatili ng mas literal na anyo ang walang-pandiwang pagbubunyi at ang datibong pag-uukol sa Griyego.
lexical_decisions:
- source_word: κράζουσι
  choice: sumisigaw sila
  rationale: Ipinahahayag nito ang malakas at mariing pagsigaw, at pinananatili ng pangkasalukuyang anyo ang buhay na paglalarawan sa tagpo.
- source_word: φωνῇ μεγάλῃ
  choice: malakas
  rationale: Likas sa modernong Tagalog ang pang-abay na ito at malinaw nitong ipinapahayag ang paraan ng pagsigaw nang hindi pinapabigat ang pangungusap.
- source_word: λέγοντες
  choice: tuwirang sipi pagkatapos ng kuwit
  rationale: Ang participle ay nagpapakilala sa nilalaman ng sigaw. Sa Tagalog, sapat at mas natural na tuwirang sundan ang pandiwa ng pagsigaw ng mismong sinabi.
- source_word: Ἡ σωτηρία
  choice: ang kaligtasan
  rationale: Saklaw ng “kaligtasan” ang pagliligtas bilang gawa at ang kalagayang bunga nito. Hindi ginamit ang “tagumpay,” na mas makitid at higit na interpretatibo.
- source_word: τῷ θεῷ ἡμῶν
  choice: sa ating Diyos
  rationale: Pinananatili ng “sa” ang datibong pag-uukol o pag-aangkin sa Diyos nang hindi tinutukoy nang labis kung ito ay pinagmulan, pagmamay-ari, o papuri.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: na nakaupo sa trono
  rationale: Malinaw at likas itong paglalarawan sa Diyos bilang siyang nasa trono, at tugma sa buhay na pangkasalukuyang tagpo.
- source_word: τῷ ἀρνίῳ
  choice: sa Kordero
  rationale: Ang “Kordero” ang kinikilalang pamagat kay Jesus sa Pahayag at pinananatili nito ang sakripisyal at mesiyanikong larawan.
theological_decisions:
- issue: Ugnayan ng kaligtasan sa Diyos at sa Kordero
  choice: “Sa ating Diyos ... at sa Kordero ang kaligtasan!”
  alternative: “Ang kaligtasan ay mula sa ating Diyos ... at sa Kordero!” o “Ang kaligtasan ay pag-aari ng ating Diyos ... at ng Kordero!”
  rationale: Sabay na iniuukol ng salin ang kaligtasan sa Diyos at sa Kordero, gaya ng magkatugmang datibo sa Griyego. Iniiwasan nitong gawing tahasang “mula sa” lamang o literal na pagmamay-ari ang sadyang maikli at walang-pandiwang pagbubunyi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang baligtad na ayos na “Sa ... ang kaligtasan” upang maging likas na pagbubunyi at mapanatili ang diin sa Diyos at sa Kordero.
