  source_fidelity: Tumpak na naisasalin ang κράζουσι φωνῇ μεγάλῃ bilang “malakas silang sumisigaw,” at likas na naihahatid ng tuwirang sipi ang nilalaman na ipinakikilala ng λέγοντες. Ang “Sa ating Diyos na nakaupo sa trono at sa Kordero ang kaligtasan!” ay maingat na Tagalog na katumbas ng walang-pandiwang pagbubunyi at magkatugmang datibong pag-uukol sa Griyego.
  naturalness: Likas at malinaw ang ayos na “Sa ... ang kaligtasan,” lalo na sa isang marangal na pagbubunyi. Ang “Kordero” at “trono” ay angkop sa rehistro ng Pahayag at madaling mauunawaan sa modernong Filipino Tagalog.
  terminology: Wastong-wasto ang “kaligtasan” para sa σωτηρία at ang kapitalisadong “Kordero” para sa matatag na pamagat sa Pahayag. Hindi ipinipilit ng salin ang “mula sa” o “pag-aari ng,” kaya napananatili ang saklaw at liturhikal na lakas ng Griyego.
