  to: At sinabi ko sa kanya, “Ginoo ko, kayo ang nakaaalam.” Sinabi niya sa akin, “Ang mga ito ang lumalabas mula sa malaking kapighatian[a]. Nilabhan nila ang kanilang mga kasuotan at pinaputi ang mga iyon sa dugo ng Kordero[b].”
