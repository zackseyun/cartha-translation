id: REV.7.14
reference: Revelation 7:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: tl
  text: At sinabi ko sa kanya, “Ginoo ko, kayo ang nakaaalam.” Sinabi niya sa akin, “Ang mga ito ang lumalabas mula sa malaking kapighatian[a]. Nilabhan nila ang kanilang mga kasuotan at pinaputi ang mga iyon sa dugo ng Kordero[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa malaking pagdurusa” o “mula sa malaking kagipitan.” Ang salitang Griyego ay maaaring tumukoy sa kapighatian, pagdurusa, o panggigipit.
    reason: lexical_alternative
  - marker: b
    text: Sadyang pinanatili ang “sa dugo ng Kordero.” Maaari ring unawain ang Griyego bilang “sa pamamagitan ng dugo,” ngunit iniingatan ng saling ito ang kabalintunaang larawan sa Pahayag ng paglilinis sa dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: sinabi ko
  rationale: Bagaman nasa perfect form ang Griyego, ginagamit ito rito bilang pagpapakilala sa sinabi ni Juan; natural sa makabagong Tagalog ang payak na nagdaang “sinabi ko.”
- source_word: Κύριέ μου
  choice: Panginoon ko
  rationale: Pinananatili nito ang magalang at marangal na pagtawag sa matanda, ngunit hindi ginagawang tiyak na ang kausap ay ang Diyos o ang Mesiyas.
- source_word: σὺ οἶδας
  choice: kayo ang nakaaalam
  rationale: Ipinahahayag ng “kayo” at ng panandang “ang” ang bahagyang diin ng tahasang panghalip na σὺ, habang ang magalang na anyo ay angkop sa kausap.
- source_word: οἱ ἐρχόμενοι
  choice: ang mga ito ang lumalabas
  rationale: Pinananatili ng aspektong pangkasalukuyan ang kilos bilang nagpapatuloy o katangian ng pangkat, sa halip na gawing simpleng nagdaang pangyayari.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: mula sa matinding kapighatian
  rationale: Ang “kapighatian” ay natural at malawak na katumbas ng θλῖψις, at hindi nito ipinapasya kung tumutukoy ang parirala sa isang natatanging panahon sa hinaharap o sa mas malawak na pagdurusa.
- source_word: ἔπλυναν
  choice: nilabhan nila
  rationale: Inilalahad ng aorist ang pagkilos bilang buo; ang “nilabhan” ay malinaw at tumutugma sa larawang kaugnay ng mga kasuotan.
- source_word: στολάς
  choice: mga kasuotan
  rationale: Mas marangal at mas malapit ito sa mahahabang damit o roba na tinutukoy ng στολή kaysa sa mas payak na “mga damit,” nang hindi gumagamit ng di-likas na hiram na salita.
- source_word: ἐλεύκαναν
  choice: pinaputi
  rationale: 'Pinananatili nito ang causative na diwa ng pandiwa: ginawa nilang puti ang mga kasuotan.'
- source_word: ἐν τῷ αἵματι
  choice: sa dugo
  rationale: Pinananatili ang kapansin-pansing larawang Griyego ng pagpapaputi “sa” dugo, sa halip na tahimik na gawing instrumental na “sa pamamagitan ng dugo.”
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Ang “Kordero” ay kinikilalang titulo ni Jesus sa Pahayag; ipinakikita ng malaking titik ang gamit nito bilang titulo.
theological_decisions:
- issue: Ang pagtawag na κύριος sa matanda
  choice: Panginoon ko
  alternative: Ginoo; Panginoon ko bilang tuwirang banal na titulo
  rationale: Ang kausap ay isa sa matatanda sa langit, kaya pinananatili ang paggalang ng salita ngunit hindi ipinapalagay na siya ang Diyos o ang Mesiyas.
- issue: Saklaw ng “matinding kapighatian”
  choice: Panatilihin ang leksikal na parirala nang hindi tinutukoy ang isang sistemang eskatolohikal
  alternative: Ipaliwanag ito bilang isang tiyak na panahon sa wakas o bilang pangkalahatang pagdurusa lamang
  rationale: Hindi nilulutas ng talata mismo ang buong saklaw ng parirala; dapat panatilihin ng salin ang teolohikal na tensiyon.
- issue: Paraan ng pagpapaputi sa dugo ng Kordero
  choice: sa dugo ng Kordero
  alternative: sa pamamagitan ng dugo ng Kordero
  rationale: Maaaring instrumental ang ἐν, ngunit ang literal na lokatibong pananalita ay sadyang lumilikha ng kabalintunaang larawan ng paglilinis sa dugo at mahalaga sa simbolismo ng Pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magalang na “kayo” sa pakikipag-usap sa matanda. Iniwasan ang teknikal na “tribulasyon” sa pangunahing teksto at pinili ang natural na “matinding kapighatian,” habang pinananatili sa talababa ang saklaw ng kahulugan. Ang “mga kasuotan” ay bahagyang marangal upang umangkop sa pangitain nang hindi nagiging lipas o labis na teknikal.
