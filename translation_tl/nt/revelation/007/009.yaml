source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: tl
  text: Pagkatapos ng mga bagay na ito, nakita ko, at narito, isang napakalaking pulutong na hindi kayang bilangin ng sinuman, mula sa bawat bansa at sa mga lipi at mga bayan at mga wika,[a] na nakatayo sa harap ng trono at sa harap ng Kordero. Nakasuot sila ng mga puting damit at may mga sanga ng palma sa kanilang mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring mas madulas na isalin: “mula sa bawat bansa, lipi, bayan, at wika.” Pinananatili sa pangunahing teksto ang paglipat ng Griyego mula sa isahang “bansa” tungo sa maramihang “mga lipi,” “mga bayan,” at “mga wika.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Pagkatapos ng mga bagay na ito
  rationale: Pinananatili nito ang maramihang ταῦτα at ang sunod-sunod na balangkas ng pangitain sa Pahayag.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: tumingin ako, at narito
  rationale: Ang “tumingin ako” ay natural sa pagpapakilala ng isang tanawin sa pangitain, at ang “narito” ay nagpapanatili sa ἰδού bilang pantawag-pansin.
- source_word: ὄχλος πολύς
  choice: isang napakalaking pulutong
  rationale: Ang “pulutong” ay angkop sa marangal na rehistro at ang “napakalaki” ay malinaw na naghahatid sa lawak ng πολύς.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: na hindi kayang bilangin ng sinuman
  rationale: Natural itong Filipino at pinananatili ang diin sa kawalan ng kakayahan ng sinuman na bilangin ang pulutong.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: mula sa bawat bansa at sa mga lipi at mga bayan at mga wika
  rationale: Pinananatili ang paglipat ng Griyego mula sa isahang ἔθνους tungo sa maramihang φυλῶν, λαῶν, at γλωσσῶν. Ang pag-uulit ng “mga” ay naglilinaw sa bilang sa Filipino.
- source_word: ἑστῶτες
  choice: na nakatayo
  rationale: Ginagawang natural na sugnay sa Filipino ang participle habang pinananatili ang kalagayan ng pulutong sa tanawin.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: sa harap ng trono at sa harap ng Kordero
  rationale: Ang pag-uulit ng “sa harap” ay sumasalamin sa pag-uulit ng ἐνώπιον at nagpapanatili sa maringal na indayog.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: Nakasuot sila ng mga puting damit
  rationale: Ang “nakasuot” ay likas na salin ng περιβεβλημένους. Mas madaling maunawaan ng karaniwang mambabasa ang “mga puting damit” kaysa sa mas teknikal o makalumang “mga balabal,” nang hindi nagdaragdag ng anyong hindi tiyak sa teksto.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: may mga sanga ng palma sa kanilang mga kamay
  rationale: Sa kontekstong ito, ang φοίνικες ay mga sanga ng palma. Ang “may” ay natural na naghahatid sa larawang hawak o taglay nila ang mga ito nang hindi dinaragdagan ang kilos.
theological_decisions:
- issue: Pagsasalin sa ἀρνίον bilang titulong tumutukoy kay Cristo
  choice: ang Kordero
  alternative: ang munting kordero
  rationale: Bagaman may anyong diminutibo ang ἀρνίον, ginagamit ito sa Pahayag bilang matatag na titulong cristolohikal. Ang “Kordero” ay kinikilala, marangal, at hindi nagdaragdag ng di-angkop na diin sa kaliitan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang apokaliptikong pantawag-pansing “narito,” ang pag-uulit ng “sa harap,” at ang tunay na pagbabago ng bilang sa talaan ng mga pangkat. Hinati sa dalawang pangungusap ang mahabang paglalarawan upang maging malinaw at natural sa Filipino nang hindi binabago ang ugnayang pangkahulugan.
