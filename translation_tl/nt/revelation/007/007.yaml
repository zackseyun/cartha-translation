id: REV.7.7
reference: Revelation 7:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: tl
  text: Mula sa lipi ni Simeon[a], labindalawang libo; mula sa lipi ni Levi, labindalawang libo; mula sa lipi ni Isacar, labindalawang libo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Sa lipi ni Simeon … sa lipi ni Levi … sa lipi ni Isacar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: mula sa
  rationale: Likas na katumbas sa Tagalog para sa pinagmulan o pagkabilang; pinananatili rin nito ang paulit-ulit na balangkas ng Griyego.
- source_word: φυλῆς
  choice: lipi
  rationale: Sa konteksto ng mga pangkat na nagmula sa mga anak ni Israel, ang “lipi” ang karaniwan at malinaw na katawagan sa modernong Tagalog.
- source_word: Συμεὼν
  choice: Simeon
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: δώδεκα χιλιάδες
  choice: labindalawang libo
  rationale: Isinulat sa salita upang bumagay sa pampanitikang talaan at tapat na ipahayag ang bilang sa Griyego.
- source_word: Λευὶ
  choice: Levi
  rationale: Tuwirang pinanatili ang nakaugaliang anyo ng pangalan; hindi dinagdagan ng paliwanag ang di-pangkaraniwang pagsama kay Levi sa talaan.
- source_word: Ἰσσαχὰρ
  choice: Isacar
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Tagalog.
theological_decisions:
- issue: Paulit-ulit na anyo ng talaan ng mga lipi
  choice: Inulit ang “mula sa lipi ni …, labindalawang libo” para sa bawat lipi.
  alternative: Pagsamahin bilang “mula sa mga lipi nina Simeon, Levi, at Isacar, tig-labindalawang libo.”
  rationale: Tahasan at maindayog na inuulit ng Griyego ang pormula sa bawat lipi; ang pagpapanatili rito ay hindi nagpapakinis o nagpapaiikli sa estruktura ng teksto.
- issue: Pagkakasama ni Levi sa talaan
  choice: Isinalin nang tuwiran ang pangalan ni Levi nang walang paliwanag sa pangunahing teksto.
  alternative: Magdagdag ng paliwanag tungkol sa di-pangkaraniwang pagkakasama ng lipi ni Levi.
  rationale: Inililista lamang siya ng talata; ang dagdag na paliwanag ay lalampas sa sinasabi ng teksto at maaaring magpasok ng interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormal at paulit-ulit na himig ng apokaliptikong talaan, habang ginamit ang likas na pariralang “mula sa lipi ni.”
