  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: tl
  text: Sinabi niya, “Huwag ninyong pinsalain ang lupa, ang dagat, o ang mga puno hanggang sa tatakan namin ang mga alipin[a] ng ating Diyos sa kanilang mga noo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griego na doulos ay tumutukoy sa mga taong pag-aari ng isang panginoon; pinananatili ng “mga alipin” ang diwang iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Sinabi niya
  rationale: Ginawang likas na pandiwang Filipino ang participle na “nagsasabi”; malinaw sa konteksto na ang anghel sa naunang talata ang nagsasalita.
- source_word: ἀδικήσητε
  choice: pinsalain
  rationale: Dahil lupa, dagat, at mga puno ang mga layon, pisikal na pamiminsala ang diwa rito, hindi moral na paglabag.
- source_word: τὴν γῆν
  choice: ang lupa
  rationale: Likas itong katumbas sa Filipino sa hanay na “lupa, dagat, at mga puno,” at hindi nito labis na nililinaw kung ang tinutukoy ay lupain o ang lupa sa malawak na saklaw.
- source_word: τὴν θάλασσαν
  choice: ang dagat
  rationale: Tuwiran at karaniwang katumbas sa modernong Filipino.
- source_word: τὰ δένδρα
  choice: ang mga puno
  rationale: Tuwiran at natural na salin ng pangmaramihang pangngalan.
- source_word: ἄχρι
  choice: hanggang sa
  rationale: 'Ipinapakita nito ang hangganang temporal ng pagbabawal: ipinagpapaliban ang pamiminsala hanggang maganap ang pagtatatak.'
- source_word: σφραγίσωμεν
  choice: tatakan namin
  rationale: Pinananatili ang aktibong tinig at ang larawan ng paglalagay ng tatak, habang natural ang anyong panghinaharap sa sugnay na nagsisimula sa “hanggang sa.”
- source_word: τοὺς δούλους
  choice: ang mga alipin
  rationale: Pinananatili ng “mga alipin” ang diwa ng pag-aari at ganap na pagkabilang sa isang panginoon, na mahalaga sa tagpo ng pagtatatak bilang tanda ng pag-aari at katapatan.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: ng ating Diyos
  rationale: Tuwirang ipinapahayag ang pagkabilang sa Diyos at pinananatili ang inklusibong panghalip na “ating.”
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: sa noo
  rationale: Natural sa Filipino ang isahan na “noo” kapag tumutukoy sa magkakatulad na bahagi ng katawan ng maraming tao; malinaw na bawat alipin ay tatatakan sa noo.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa konteksto ng pag-aari at pagtatatak
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang pagtatatak ay naglalarawan sa mga taong kinikilalang pag-aari ng Diyos. Mas malinaw na pinananatili ng “mga alipin” ang lakas ng δοῦλος, habang inilalahad sa talababa ang mas banayad na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pinsalain” at “tatakan” bilang mga salitang madaling maunawaan ngunit angkop sa apokaliptikong tagpo. Iniwasan ang sobrang teknikal o makalumang pananalita.
