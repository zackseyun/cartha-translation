id: REV.7.11
reference: Revelation 7:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: tl
  text: At ang lahat ng anghel ay nakatayo na nakapalibot sa trono, sa mga nakatatanda, at sa apat na nilalang na buháy[a]. Nagpatirapa sila sa harap ng trono at sumamba sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na buháy na nilalang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: ang lahat ng anghel
  rationale: Tuwirang inililipat ang kabuuang saklaw ng πάντες at ginagamit ang karaniwang katawagan sa ἄγγελοι.
- source_word: εἱστήκεισαν
  choice: ay nakatayo
  rationale: 'Ipinahahayag ang statibong diwa ng anyo: nasa kalagayan silang nakatayo, hindi lamang biglang tumayo.'
- source_word: κύκλῳ
  choice: sa palibot
  rationale: Likas na Filipino para sa puwestong nakapaligid sa mga binanggit na sentrong persona at nilalang.
- source_word: τοῦ θρόνου
  choice: ng trono
  rationale: Pinananatili ang maharlika at makalangit na larawan ng θρόνος.
- source_word: τῶν πρεσβυτέρων
  choice: ng matatandang pinuno
  rationale: Iniiwasan ang maaaring malabong simpleng 'matatanda' at ipinahihiwatig ang kinikilalang pangkat ng mga elder nang hindi nagdaragdag ng tiyak na tungkuling hindi sinabi ng teksto.
- source_word: τῶν τεσσάρων ζῴων
  choice: ng apat na nilalang na buháy
  rationale: Pinananatili ang diwa ng mga buháy na nilalang sa pangitain at iniiwasang ipakahulugang karaniwang mga hayop.
- source_word: ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: Nagpatirapa sila
  rationale: Likas at malinaw na Filipino para sa pagbagsak nang nakadapa ang mukha bilang ganap na pagpapakumbaba.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: sa harap ng trono
  rationale: Tuwirang spatial na katumbas na natural sa modernong Filipino.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: sumamba sa Diyos
  rationale: Dahil Diyos ang tahasang pinag-uukulan at nailarawan na ang pisikal na pagpapatirapa, 'sumamba' ang angkop na buong diwa.
theological_decisions:
- issue: Paglalarawan sa ζῷα sa silid ng trono
  choice: mga nilalang na buháy
  alternative: mga buháy na nilalang; mga nilalang
  rationale: Hindi sila tinutukoy bilang karaniwang mga hayop, at hindi rin sila binibigyan ng mas tiyak na pagkakakilanlang wala sa teksto.
- issue: Diwa ng προσκυνέω kapag Diyos ang pinag-uukulan
  choice: sumamba sa Diyos
  alternative: yumukod sa Diyos
  rationale: Ang naunang pagpapatirapa ay nagsasaad na ng kilos ng katawan; dito, ang pandiwa ay angkop na nagsasaad ng pagsamba.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'nagpatirapa' upang natural na katawanin ang literal na pagbagsak nang nakadapa, at nilagyan ng tuldik ang 'buháy' upang hindi ito mabasa bilang /búhay/.
