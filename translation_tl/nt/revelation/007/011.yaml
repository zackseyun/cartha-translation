revisions:
- from: At ang lahat ng anghel ay nakatayo sa palibot ng trono, ng matatandang pinuno, at ng apat na nilalang na buháy[a]. Nagpatirapa sila sa harap ng trono at sumamba sa Diyos.
  to: At ang lahat ng anghel ay nakatayo na nakapalibot sa trono, sa mga nakatatanda, at sa apat na nilalang na buháy[a]. Nagpatirapa sila sa harap ng trono at sumamba sa Diyos.
  rationale: Pinalitan ang “matatandang pinuno” ng “mga nakatatanda” upang tapat na maisalin ang πρεσβυτέρων nang walang idinagdag na opisina o awtoridad. Idinagdag ang “na nakapalibot” at inuulit ang pang-ukol na “sa” upang maging malinaw at likas ang saklaw ng κύκλῳ sa trono, mga nakatatanda, at apat na nilalang na buháy. Pinanatili ang “nagpatirapa” at “sumamba sa Diyos,” na angkop na naghahayag ng prostration at pagsamba sa kontekstong ito.
