  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: tl
  text: Hindi na sila magugutom, ni mauuhaw pa; hindi kailanman tatama sa kanila ang araw[a], ni anumang nakapapasong init.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mariin ang pagtanggi sa Griyego: “hinding-hindi tatama sa kanila ang araw.”'
    reason: Ipinababatid ang diin ng οὐδὲ μή + pandiwang pasakali nang hindi ginagawang mabigat ang pangunahing teksto.
lexical_decisions:
- source_word: πεινάσουσιν
  choice: magugutom
  rationale: Ang pandiwang panghinaharap na “magugutom” ay tuwirang nagpapahayag ng πεινάω at likas sa makabagong Tagalog.
- source_word: ἔτι
  choice: hindi na / pa
  rationale: Sa mga sugnay na may pagtanggi, ipinahihiwatig ng ἔτι na hindi na muling mararanasan ang gutom o uhaw; ang “hindi na” at “pa” ay likas na magkatugmang pahayag sa Tagalog.
- source_word: διψήσουσιν
  choice: mauuhaw
  rationale: Pinananatili ng pandiwang “mauuhaw” ang anyong panghinaharap at ang pagkakatulad nito sa “magugutom.”
- source_word: οὐδὲ
  choice: ni
  rationale: Ang “ni” ay maikli at likas na nag-uugnay sa magkakasunod na sugnay na negatibo.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: hindi kailanman tatama sa kanila
  rationale: Ipinahahayag ng “hindi kailanman” ang mariing pagtanggi ng οὐδὲ μή, samantalang ang “tatama sa kanila” ay natural na Tagalog para sa larawan ng araw na bumabagsak o humahampas sa kanila.
- source_word: ὁ ἥλιος
  choice: ang araw
  rationale: Ito ang tuwiran at karaniwang katumbas sa Tagalog.
- source_word: πᾶν καῦμα
  choice: anumang nakapapasong init
  rationale: Saklaw ng “anumang” ang kabuuang diwa ng πᾶν sa negatibong pahayag, at ipinapakita ng “nakapapasong init” ang matindi at nakasusunog na init ng καῦμα.
theological_decisions:
- issue: Pahiwatig sa Isaias 49:10 at larawan ng pagpapanumbalik sa wakas
  choice: Panatilihin ang kongkretong larawan ng gutom, uhaw, araw, at nakapapasong init.
  alternative: Ituring ang gutom at uhaw bilang mga sagisag lamang ng espirituwal na pananabik.
  rationale: Tumutunog ang talata sa pangako ng pagpapanumbalik sa Isaias. Hindi nililimitahan ng salin ang mga larawan sa isang purong metaporikal na pakahulugan, kaya nananatili ang lawak at tensiyong teolohikal ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tatama” sa halip na literal na “babagsak” upang maging natural ang paglalarawan sa tindi ng sikat ng araw, habang pinananatili sa talababa ang mariing puwersa ng konstruksiyong Griyego.
