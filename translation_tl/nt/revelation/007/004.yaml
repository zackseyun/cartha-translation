id: REV.7.4
reference: Revelation 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: tl
  text: 'At narinig ko ang bilang ng mga natatakan na: 144,000[a], na tinatakan mula sa bawat lipi ng mga anak na lalaki ni Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Israel.” Sa Griyego, “mga anak na lalaki ni Israel,” na nagpapanatili sa panlalaking pananalitang panggenealogiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Likas na salin ng aorist indicative sa kontekstong nagsasalaysay ng narinig ni Juan.
- source_word: ἀριθμὸν
  choice: bilang
  rationale: Tumutukoy sa kabuuang dami ng pangkat na tinatakan.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: mga tinatakan / tinatakan
  rationale: Ang perpektong pasibong participle ay nagpapahiwatig ng natapos nang pagtatatak na may nananatiling bunga; sa Tagalog, malinaw na naihahatid ito ng konteksto sa anyong “tinatakan,” habang napapanatili ang pag-uulit sa Griyego.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 144,000
  rationale: Karaniwan at madaling basahing modernong paraan ng pagsulat ng tiyak na bilang.
- source_word: ἐκ
  choice: mula sa
  rationale: Malinaw na nagpapahayag ng pinagmulan o pinagkunan.
- source_word: πάσης φυλῆς
  choice: bawat lipi
  rationale: 'Pinananatili ang distributibong diwa: ang mga tinatakan ay mula sa bawat lipi.'
- source_word: υἱῶν Ἰσραήλ
  choice: mga anak na lalaki ni Israel
  rationale: Tuwirang pinananatili ang panlalaking genealogical na pananalita ng υἱῶν at ang kaugnayan nito sa kasunod na talaan ng mga lipi.
theological_decisions:
- issue: Paglalarawan sa υἱῶν Ἰσραήλ sa konteksto ng mga lipi
  choice: mga anak na lalaki ni Israel
  alternative: mga anak ni Israel
  rationale: Tahasan ang panlalaking anyo ng Griyegong υἱῶν. Pinananatili ito sa pangunahing teksto nang hindi nagpapasok ng anumang tiyak na sistemang eskatolohikal; inilalagay sa talababa ang mas tradisyonal at mas malawak na salin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lipi” bilang karaniwang terminong biblikal at genealogical; iniwasan ang mas mabigat o sektaryong pagpapakahulugan sa pagkakakilanlan ng 144,000.
