  source_fidelity: 'Tumpak ang pangunahing diwa: ang tatlong salot ang pumatay sa sangkatlo ng sangkatauhan, at ang mga ito ay apoy, usok, at asupre. Napananatili rin ang pasibong diwa ng ἀπεκτάνθησαν at ang pangkalahatang saklaw ng ἀνθρώπων. Gayunman, ang αὐτῶν ay payak na panghalip na ''kanilang''; hindi ito demonstratibong ''mga iyon.'''
