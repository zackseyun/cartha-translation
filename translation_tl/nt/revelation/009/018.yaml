base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: tl
  text: Sa pamamagitan ng tatlong salot na ito, napatay ang sangkatlo ng sangkatauhan—sa pamamagitan ng apoy, usok, at asupre[a] na lumalabas sa kanilang mga bibig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “azufre.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Sa pamamagitan ng tatlong salot na ito
  rationale: Ang ἀπό rito ay nagpapahayag ng sanhi o kasangkapan, at pinananatili ng “na ito” ang demonstratibong τούτων na tumutukoy sa tatlong kasunod na salot.
- source_word: ἀπεκτάνθησαν
  choice: napatay
  rationale: Pinananatili nito ang pasibong diwa ng aorist na pandiwa nang natural sa modernong Tagalog.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: ang sangkatlo ng sangkatauhan
  rationale: Ipinapahayag ng τὸ τρίτον ang isang-katlong bahagi, at ang ἀνθρώπων ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: sa pamamagitan ng apoy, usok, at asupre
  rationale: Ang ἐκ ay nagpapakita rito ng pinagmulan o nakamamatay na sanhi; natural na ipinahahayag ito sa Tagalog bilang “sa pamamagitan ng.” Ang θεῖον ay isinaling “asupre,” ang karaniwang makabagong tawag.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: na lumalabas sa mga bibig ng mga iyon
  rationale: Ang “lumalabas” ay malinaw na naglalarawan sa patuloy na paglabas, at ang “mga iyon” ay nag-iingat sa reperensiya sa mga nilalang na naunang inilalarawan nang hindi lumilikha ng kalituhan sa karaniwang panghalip na “kanila.”
theological_decisions:
- issue: Saklaw ng ἀνθρώπων sa tagpo ng paghuhukom
  choice: sangkatauhan
  alternative: mga tao
  rationale: Ang salita ay kolektibong tumutukoy sa mga tao anuman ang kasarian. Ang “sangkatauhan” ay angkop sa maringal at pandaigdigang saklaw ng pangitain nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at maringal na Tagalog. Pinanatili ang pasibong pahayag at ang pag-uulit ng “sa pamamagitan ng” upang luminaw na kapuwa ang tatlong salot at ang apoy, usok, at asupre ang inilalarawang sanhi ng pagkamatay.
