id: REV.9.11
reference: Revelation 9:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: tl
  text: May hari silang namumuno sa kanila—ang anghel ng kalaliman.[a] Ang pangalan niya sa Hebreo ay Abaddon,[b] at sa Griyego naman ay Apollyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hukay na walang ilalim.”
    reason: alternative_reading
  - marker: b
    text: Ang pangalang Abaddon ay kaugnay ng salitang Hebreo para sa pagkawasak.
    reason: lexical_alternative
  - marker: c
    text: Ang Apollyon ay pangalang Griyego na nangangahulugang “Tagapuksa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: May hari silang namumuno sa kanila
  rationale: Pinananatili nito ang pandiwang ἔχουσιν (‘mayroon sila’) at ang larawan ng βασιλεύς bilang hari, habang likas na ipinahahayag sa Tagalog ang ἐπ’ αὐτῶν bilang pamumuno sa kanila.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: ang anghel ng kalaliman
  rationale: Karaniwang ‘anghel’ ang kahulugan ng ἄγγελος sa Pahayag. Ang ‘kalaliman’ ay tuwiran at likas na salin ng ἄβυσσος nang hindi idinaragdag ang interpretasyong ‘walang-hanggang hukay.’
- source_word: Ἑβραϊστὶ
  choice: sa Hebreo
  rationale: Maikli at karaniwang paraan sa modernong Tagalog upang tukuyin ang pangalan sa wikang Hebreo.
- source_word: Ἀβαδδών
  choice: Abaddon
  rationale: Isinatinig bilang pangalang pantangi; inilalahad sa talababa ang kaugnayan nito sa pagkawasak.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: at sa Griyego naman
  rationale: Malinaw na ipinakikita ng ‘naman’ ang paghahambing ng pangalang Hebreo at Griyego.
- source_word: ὄνομα ἔχει Ἀπολλύων
  choice: ay Apollyon
  rationale: Likas sa Tagalog ang ganitong pagpapahayag ng pangalan. Hindi kailangang tularan nang mekanikal ang inulit na ὄνομα ἔχει upang mapanatili ang kahulugan.
- source_word: Ἀπολλύων
  choice: Apollyon
  rationale: Isinatinig bilang pangalang pantangi, samantalang pinananatili sa talababa ang malinaw na kahulugang ‘Tagapuksa.’
theological_decisions:
- issue: Kung isasalin o isasatinig ang Ἀβαδδών at Ἀπολλύων
  choice: Isatinig sa pangunahing teksto bilang ‘Abaddon’ at ‘Apollyon.’
  alternative: Isalin bilang ‘Pagkawasak’ at ‘Tagapuksa.’
  rationale: Parehong gumaganap na mga pangalan sa talata. Pinananatili ng mga talababa ang mahalagang kahulugang leksikal nang hindi pinapalitan ang mga pangalan.
- issue: Pagpapahayag sa ἀβύσσου
  choice: kalaliman
  alternative: hukay na walang hanggan
  rationale: Ang ‘kalaliman’ ang mas tuwirang katumbas at hindi nagpapasok ng larawang ‘hukay’ na hindi tahasang nasa salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘May hari silang namumuno sa kanila’ upang mapanatili kapwa ang tahasang pandiwang ‘mayroon’ at ang maharlikang larawan, nang hindi maging matigas o banyaga ang ayos.
