id: REV.9.15
reference: Revelation 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: tl
  text: At pinakawalan ang apat na anghel na inihanda para sa oras, araw, buwan, at taon,[a] upang patayin nila ang ikatlong bahagi ng sangkatauhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mismong oras, araw, buwan, at taon.” Maaaring idiin ng Griyego ang eksaktong panahong itinakda.
    reason: lexical_alternative
  - marker: b
    text: O “ikatlong bahagi ng mga tao.” Ang Griyego ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: pinakawalan
  rationale: Aorist passive ng λύω. Likas itong katumbas sa makabagong Filipino at umaangkop sa konteksto ng mga anghel na dating nakagapos.
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Sa apokaliptikong konteksto ng Pahayag, malinaw na mga makalangit na nilalang ang tinutukoy, hindi mga taong sugo.
- source_word: ἡτοιμασμένοι
  choice: na inihanda
  rationale: Ang perfect passive participle ay nagpapahiwatig na naihanda na sila at nananatili silang handa para sa itinakdang panahon.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: para sa oras, araw, buwan, at taon na iyon
  rationale: Pinananatili ang sunod-sunod na mga yunit ng panahon at ang iisang tiyak na artikulong namamahala sa talaan, nang hindi ipinapalagay kung eksaktong sandali o pinagsamang haba ng panahon ang ibig sabihin.
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na Filipino na nagpapahayag ng layunin ng pagpapalaya sa kanila.
- source_word: ἀποκτείνωσιν
  choice: patayin nila
  rationale: Malinaw at tuwirang katumbas ng aorist active subjunctive sa sugnay na may ἵνα.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: ang ikatlong bahagi ng sangkatauhan
  rationale: Partitibong pahayag ito na tumutukoy sa isang-katlo ng lahat ng tao; hindi partikular sa mga lalaki ang ἀνθρώπων.
theological_decisions:
- issue: Lakas at tinutukoy ng pariralang temporal
  choice: Isinalin bilang “para sa oras, araw, buwan, at taon na iyon,” na nagpapahiwatig ng isang tiyak na itinakdang panahon ngunit hindi nilulutas ang eksaktong kronolohiya.
  alternative: Maaaring unawain bilang kabuuang panahong isang taon, isang buwan, isang araw, at isang oras.
  rationale: Ang Griyego ay nag-uugnay ng magkakasunod na yunit ng panahon sa ilalim ng isang artikulo. Pinananatili ng salin ang tiyak at pinagsama-samang diin nang hindi nagpapasok ng sistemang pangkronolohiya.
- issue: Saklaw ng ἀνθρώπων
  choice: sangkatauhan
  alternative: mga tao
  rationale: Pangkalahatan ang reperensiya sa mga taong nilalang, hindi sa mga lalaki lamang; ang “sangkatauhan” ay malinaw na kolektibo at tapat sa saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakawalan” sa halip na mas lumang “kinalagan,” at pinanatili ang maindayog na pagkakasunod ng oras, araw, buwan, at taon.
