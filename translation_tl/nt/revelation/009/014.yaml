  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: tl
  text: na nagsasabi sa ikaanim na anghel, na siyang may trumpeta, “Kalagan mo ang apat na anghel na nakagapos[a] sa malaking Ilog Eufrates.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na ginapos” o “na nagapos na”; idinidiin ng perfect participle sa Griyego ang kasalukuyan nilang kalagayan ng pagkakapigil bilang bunga ng naunang paggapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: na nagsasabi
  rationale: Pinananatili ang kasalukuyang participle at ang kaugnayan nito sa tinig mula sa altar sa naunang talata; natural din itong dugtong sa Filipino.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: sa ikaanim na anghel
  rationale: Tuwirang salin ng dative indirect object at ordinal na pang-uri sa natural na ayos ng Filipino.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: na siyang may trumpeta
  rationale: Ipinakikilala ng pariralang participial kung aling anghel ang kinakausap, habang pinananatili ang appositional na diin.
- source_word: Λῦσον
  choice: Kalagan mo
  rationale: Malinaw at likas na pautos sa Filipino para sa pag-aalis ng pagkakatali o pagpigil; ang tahasang “mo” ay natural sa utos na nakatuon sa isang kausap.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: ang apat na anghel
  rationale: Tuwirang salin ng layon na may bilang.
- source_word: τοὺς δεδεμένους
  choice: na nakagapos
  rationale: Ipinahahayag ang umiiral na kalagayan ng pagkakagapos na bunga ng naunang paggapos, gaya ng perfect passive participle.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: sa ... ilog
  rationale: Ang ἐπί na may dative ay lokatibo rito; hindi nililimitahan ng “sa” kung sila ay nasa pampang, rehiyon, o mismong kaugnayan sa ilog.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: malaking ilog ng Eufrates
  rationale: Natural at dignidad na katawagan sa modernong Filipino, habang pinananatili ang epithet na “malaki” at ang pangalang pantangi.
theological_decisions:
- issue: Pagkakakilanlan at moral na katayuan ng apat na anghel
  choice: “ang apat na anghel” lamang, nang walang dagdag na pantukoy sa kanilang moral na katayuan
  alternative: “ang apat na nagkasalang anghel” o “ang apat na anghel na itinalaga sa paghatol”
  rationale: Tinatawag lamang sila ng talata na mga anghel na nakagapos sa Eufrates. Ang pagdaragdag ng “nagkasala,” “masama,” o ibang paliwanag ay magpapasok ng teolohikal na konklusyong hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “trumpeta,” “nakagapos,” at “Eufrates” bilang mga salitang madaling maunawaan ng karaniwang mambabasa, habang iningatan ang gramatikal at teolohikal na tensiyon ng Griyego.
