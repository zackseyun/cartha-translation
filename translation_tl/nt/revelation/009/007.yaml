id: REV.9.7
reference: Revelation 9:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: tl
  text: Ang anyo ng mga balang ay gaya ng mga kabayong inihanda para sa labanan, at sa kanilang mga ulo ay may tila mga koronang gaya ng ginto[a], at ang kanilang mga mukha ay gaya ng mga mukha ng mga tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na στέφανοι ay maaari ring tumukoy sa mga putong na kaugnay ng karangalan o tagumpay.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga mukha ng mga tao”; pangkalahatan ang pananalita at hindi lamang mga lalaki ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοιώματα
  choice: anyo
  rationale: Tumutukoy ito sa nakikitang anyo o wangis sa pangitain; likas sa modernong Tagalog ang “anyo” at hindi nito ipinapalagay na literal ang pagkakakilanlan.
- source_word: ἀκρίδων
  choice: mga balang
  rationale: Karaniwang kahulugan ng ἀκρίς at angkop sa apokaliptikong tagpo.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: gaya ng mga kabayong inihanda para sa labanan
  rationale: Pinananatili ng “gaya” ang paghahambing, at ipinahahayag ng “inihanda” ang kalagayang handa na na nasa perfect passive participle.
- source_word: πόλεμον
  choice: labanan
  rationale: Natural na katambal sa Tagalog ng pariralang “inihanda para sa,” habang pinananatili ang diwang militar.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: sa kanilang mga ulo
  rationale: Tuwirang paglalarawan ng kinalalagyan sa pangitain.
- source_word: ὡς στέφανοι
  choice: tila mga korona
  rationale: Ipinakikita ng “tila” na ito ay nakikitang pagkakahawig at hindi tiyak na pahayag tungkol sa literal na bagay.
- source_word: στέφανοι
  choice: mga korona
  rationale: Malinaw at pangkalahatang salin; maaaring tumukoy ang salita sa koronang tulad ng putong na kaugnay ng karangalan o tagumpay, na inilalahad sa talababa.
- source_word: ὅμοιοι χρυσῷ
  choice: gaya ng ginto
  rationale: Pinananatili ang pagkakahawig sa ginto at hindi ipinahihiwatig na talagang yari sa ginto ang mga korona.
- source_word: πρόσωπα
  choice: mga mukha
  rationale: Natural at kongkretong salin para sa nakikitang mukha.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Pangkalahatan ang ἄνθρωπος dito at hindi partikular na tumutukoy sa mga lalaki.
theological_decisions:
- issue: Mga panandang naghahambing sa apokaliptikong pangitain
  choice: Panatilihin ang sunod-sunod na paghahambing sa pamamagitan ng “gaya” at “tila.”
  alternative: Gawing tuwirang paglalarawan na para bang literal na mga kabayo, korona, at mukhang pantao ang mga ito.
  rationale: Paulit-ulit na gumagamit ang Griyego ng ὅμοια at ὡς. Pinananatili ng salin ang katangian ng pangitain nang hindi nagpapasya kung literal ang mga inilalarawan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang matinding larawang apokaliptiko at ang paulit-ulit na paghahambing ng orihinal, habang iniwasan ang lipas o labis na teknikal na pananalita.
