  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: tl
  text: At hinipan ng ikalimang anghel ang trumpeta. At nakita ko ang isang bituin na nahulog na mula sa langit patungo sa lupa.[a] Ibinigay sa kanya ang susi ng lagusan ng kalaliman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “isang bituing nahulog mula sa langit patungo sa lupa.” Ipinahihiwatig ng anyo ng pandiwang Griyego na naganap na ang pagkahulog nang makita ito ni Juan. Maaaring sumagisag ang “bituin” sa isang personal na nilalang, sapagkat sinasabi kasunod na ibinigay sa kanya ang susi.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “ang susi ng hukay ng kalaliman” o “ang susi ng hukay na walang ilalim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang trumpeta
  rationale: Ang σαλπίζω ay tumutukoy sa pagpapatunog ng trumpeta. Natural sa modernong Filipino ang pariralang ito at malinaw nitong pinananatili ang larawang nakapaloob sa pandiwa.
- source_word: ἀστέρα
  choice: bituin
  rationale: Literal na nangangahulugang ‘bituin’ ang ἀστήρ. Hindi tahasang kinikilala ng talata kung sino ang sinasagisag nito, kaya pinanatili ang apokaliptikong larawan.
- source_word: πεπτωκότα
  choice: na nahulog na
  rationale: Ipinahihiwatig ng perfect participle ang naganap nang pagkahulog at ang kasalukuyang kalagayang bunga nito; ipinakikita ng ‘na nahulog na’ na nangyari ito bago nakita ni Juan ang bituin.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: mula sa langit patungo sa lupa
  rationale: Pinananatili nito ang kosmikong paghahambing ng langit at lupa sa pangitain, at malinaw na ipinahahayag ang pinagmulan at hantungan.
- source_word: ἐδόθη αὐτῷ
  choice: Ibinigay sa kanya
  rationale: Pinananatili ng balintiyak na anyo ang hindi pinangalanang tagapagbigay at hindi tahasang idinaragdag ang Diyos bilang simuno.
- source_word: ἡ κλεὶς
  choice: ang susi
  rationale: May tiyak na pantukoy ang pangngalan sa Griyego, kaya ang ‘ang susi’ ang tuwirang katumbas.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: ng lagusan tungo sa kalaliman
  rationale: Ang φρέαρ ay hukay, balon, o patayong lagusan na nagbibigay-daan sa ἄβυσσος. Ang ‘lagusan tungo sa kalaliman’ ay natural sa Filipino at naihihiwalay ang pasukan mula sa mismong kalaliman nang hindi ginagamit ang mas interpretibong ‘hukay na walang hanggan.’
- source_word: τῆς ἀβύσσου
  choice: kalaliman
  rationale: Ang ‘kalaliman’ ay dignified at madaling maunawaang katumbas ng ἄβυσσος sa apokaliptikong konteksto, nang hindi ipinapasok ang ideyang ‘walang ilalim’ na hindi tahasang sinasabi rito.
theological_decisions:
- issue: Kung kikilalanin sa pangunahing teksto ang ‘bituin’ bilang isang anghel o si Satanas
  choice: Panatilihin ang ‘bituin’ nang walang tahasang pagkakakilanlan
  alternative: Isalin bilang ‘isang anghelikong nilalang’ o ‘si Satanas’
  rationale: Inilalarawan ng talata ang tauhan bilang bituin at saka tinutukoy ito bilang personal na tumatanggap ng susi. Ipinahihiwatig nito ang isang personal na nilalang ngunit hindi nito tahasang sinasabi kung sino siya, kaya pinananatili ang tensiyon.
- issue: Kung tahasang papangalanan ang Diyos bilang nagbigay ng susi
  choice: Panatilihin ang balintiyak na ‘Ibinigay sa kanya’
  alternative: ‘Ibinigay sa kanya ng Diyos ang susi’
  rationale: Hindi pinangalanan sa Griyego ang gumagawa. Bagaman maaaring ipinahihiwatig ang kapahintulutan ng Diyos, ang tahasang pagbanggit sa Diyos ay magdaragdag ng interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa sa publiko. Ginamit ang ‘Pagkatapos’ upang natural na ipahayag ang sunod na pangitain nang hindi binabago ang ugnayan ng mga sugnay. Pinanatili ang ‘bituin,’ ang hindi pinangalanang tagapagbigay, at ang apokaliptikong ‘kalaliman’ upang maiwasan ang labis na interpretasyon.
