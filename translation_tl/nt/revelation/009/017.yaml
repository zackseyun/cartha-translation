  source_fidelity: 'Tapat ang salin sa SBLGNT: naipapahayag ang demonstratibong οὕτως sa “Ganito,” ang ἐν τῇ ὁράσει sa “sa pangitain,” ang mga sakay, ang mga baluting pandibdib, ang paghahambing ng ulo ng kabayo sa ulo ng leon, at ang kasalukuyang kilos ng paglabas ng apoy, usok, at asupre. Ang “kulay-apoy, kulay-yasinto, at kulay-asupre” ay maingat na paglilipat ng biswal na hanay ng mga pang-uri nang hindi nagdaragdag ng di-tiyak na eksaktong mga kulay.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “mga nakasakay sa mga ito” ay idiomatiko, at ang paghahati sa dalawang pangungusap ay hindi nakapipinsala sa ugnayan ng mga sugnay. Ang “baluting pandibdib” ay bahagyang pormal ngunit angkop sa marangal na rehistrong pampanitikan at malinaw ang tinutukoy na pananggalang.
  terminology: Wasto at magkakatugma ang “pangitain,” “baluting pandibdib,” “yasinto,” at “asupre.” Ang pagpapanatili ng “yasinto” at hindi pagtukoy sa isang tiyak na bughaw o lila ay angkop, habang ang “asupre” ay modernong tumpak na katumbas ng θεῖον.
