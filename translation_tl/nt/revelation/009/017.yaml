id: REV.9.17
reference: Revelation 9:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: tl
  text: 'Ganito ko nakita sa pangitain ang mga kabayo at ang mga nakasakay sa mga ito: may mga baluting pandibdib silang kulay-apoy, kulay-yasinto, at kulay-asupre.[a] Ang mga ulo ng mga kabayo ay parang mga ulo ng leon, at mula sa mga bibig nila ay lumalabas ang apoy, usok, at asupre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga baluting pandibdib na maalab, kulay-yasinto, at asuproso.” Maaaring tumukoy ang mga salitang Griyego sa kulay o sa anyong tulad ng apoy, yasinto, at asupre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ganito
  rationale: Likas na modernong Tagalog na nagpapahayag kung paano nakita ni Juan ang tagpo at pinananatili ang demonstratibong puwersa ng salitang Griyego.
- source_word: ἐν τῇ ὁράσει
  choice: sa pangitain
  rationale: Ang ὅρασις dito ay tumutukoy sa karanasang bisyonaryo sa kontekstong apokaliptiko, hindi lamang sa karaniwang paningin.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: ang mga nakasakay sa mga ito
  rationale: Mas natural sa Tagalog kaysa sa literal na 'mga nakaupo sa ibabaw ng mga ito' habang malinaw na tumutukoy sa mga sakay ng mga kabayo.
- source_word: θώρακας
  choice: mga baluting pandibdib
  rationale: Pinananatili ang kongkretong larawan ng pananggalang sa dibdib at mas malinaw sa karaniwang mambabasa kaysa sa hiram na terminong teknikal.
- source_word: πυρίνους
  choice: kulay-apoy
  rationale: Ipinahihiwatig ang anyong tulad ng apoy nang hindi nililimitahan sa tiyak na kulay na pula lamang.
- source_word: ὑακινθίνους
  choice: kulay-yasinto
  rationale: Pinananatili ang ugnayan sa hyacinth/jacinth at ang likas na kalabuan ng eksaktong kulay, sa halip na tiyaking bughaw o lila.
- source_word: θειώδεις
  choice: kulay-asupre
  rationale: Inihahatid ang nakikitang kaugnayan sa asupre sa serye ng mga paglalarawan sa baluti nang hindi ipinipilit ang eksaktong dilaw na kulay.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: parang mga ulo ng leon
  rationale: Natural na paghahambing sa Tagalog na nagpapanatili sa maramihang anyo ng mga ulo.
- source_word: ἐκπορεύεται
  choice: lumalabas
  rationale: Pinananatili ang pangkasalukuyang anyo ng pandiwang Griyego at malinaw na inilalarawan ang patuloy na kilos sa pangitain.
- source_word: θεῖον
  choice: asupre
  rationale: Karaniwan at tumpak na modernong katawagan sa sangkap na tinutukoy ng θεῖον.
theological_decisions:
- issue: Pag-unawa sa tatlong pang-uri na naglalarawan sa mga baluting pandibdib
  choice: Isinalin bilang 'kulay-apoy, kulay-yasinto, at kulay-asupre,' na nagpapakita ng nakikitang anyo ngunit hindi nagtatakda ng eksaktong pula, bughaw, at dilaw.
  alternative: Maaaring isalin nang mas tuwiran bilang 'maalab, kulay-yasinto, at asuproso,' o gawing tahasang 'pulang-apoy, bughaw-yasinto, at dilaw-asupre.'
  rationale: Ang konteksto ay isang bisyon at malamang na biswal ang paglalarawan, ngunit maaaring tumukoy ang mga pang-uri sa kulay, anyo, o katangiang tulad ng apoy at asupre. Pinananatili ng salin ang imahen at ang tunay na kalabuan ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'nakasakay' sa halip na sobrang literal na 'nakaupo sa ibabaw,' at 'baluting pandibdib' upang maging malinaw ang kongkretong larawan. Iniwasang tukuyin nang labis ang eksaktong mga kulay upang mapanatili ang kalabuan ng orihinal.
