  verdict: revise
  source_fidelity: 'Ang “nagsisi at tumalikod sa” ay nagpapakilala ng dalawang magkahiwalay na pandiwa sa ilalim ng pagtanggi, samantalang ang μετενόησαν ἐκ ay iisang diwa: hindi sila nagsisi hinggil sa / tumalikod mula sa mga gawaing ito. Mas tuwirang naipahahayag ito ng “Hindi nila pinagsisihan ang …” Hindi rin gaanong tiyak ang “mga pagpatay” para sa φόνων, na sa talaang moral na ito ay mas angkop na “mga pagpaslang.”'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “Hindi nila pinagsisihan ang kanilang mga pagpaslang, ni ang kanilang mga pangkukulam …” Ang inuulit na “ni ang” ay maayos na katumbas ng sunod-sunod na οὔτε at pinananatili ang diin ng talaan.
  terminology: Ang “mga pangkukulam” ay angkop sa φαρμάκων sa konteksto ng Pahayag, habang ang talababa ay wastong nag-iingat ng mas malawak na saklaw na may kaugnayan sa mahika, mga gayuma, o lason. “Seksuwal na imoralidad” ay mas likas na ayos kaysa “imoralidad na seksuwal.”
  issues:
  - severity: medium
    issue: Ang “nagsisi at tumalikod sa” ay nagdaragdag ng magkahiwalay na pandiwang “tumalikod.”
    rationale: Bagaman kaugnay ng pagsisisi ang pagtalikod, ang Griyego ay hindi nagsasaad ng dalawang pinagtambal na kilos. Ang “Hindi nila pinagsisihan ang …” ay mas tuwirang katumbas ng μετενόησαν ἐκ sa Filipino.
  - severity: low
    issue: Ang “mga pagpatay” ay mas malawak kaysa sa moral-kriminal na puwersa ng φόνων.
    rationale: Maaaring sumaklaw ang “pagpatay” sa hindi sinasadyang o di-kriminal na pagkitil ng buhay. “Mga pagpaslang” ay mas malapit sa “murders” nang hindi lumalampas sa pinagmulan.
  - severity: low
    issue: Hindi pinakanatural ang ayos na “imoralidad na seksuwal.”
    rationale: Mas karaniwan at malinaw sa modernong Filipino ang “seksuwal na imoralidad.”
