id: REV.9.21
reference: Revelation 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: tl
  text: At hindi nila pinagsisihan ang kanilang mga pagpaslang, ni ang kanilang mga pangkukulam[a], ni ang kanilang seksuwal na imoralidad, ni ang kanilang mga pagnanakaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga gawaing mahika.” Ang salitang Griyego ay maaari ring iugnay sa paggamit ng mga gayuma o lason.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: nagsisi at tumalikod sa
  rationale: Sa kontekstong moral, ang μετανοέω na sinusundan ng ἐκ ay hindi lamang pagbabago ng isip kundi pagsisisi at pagtalikod sa kasalanan. Natural sa modernong Tagalog ang pinagsamang pariralang ito.
- source_word: φόνων
  choice: mga pagpatay
  rationale: Ang φόνος ay tumutukoy sa pagpatay, kadalasa'y may diwang kriminal o moral na kasamaan. Ang “mga pagpatay” ay malinaw at hindi nagpapakitid nang higit sa ipinahihiwatig ng salitang Griyego.
- source_word: φαρμάκων
  choice: mga pangkukulam
  rationale: Sa konteksto ng Pahayag at ng talaan ng mga kasalanan, malamang na tumutukoy ito sa mga gawaing mahika o okulto. Pinananatili sa talababa ang kaugnayan ng salita sa mga gayuma o lason.
- source_word: πορνείας
  choice: imoralidad na seksuwal
  rationale: Malawak ang saklaw ng πορνεία sa mga gawaing seksuwal na itinuturing na imoral. Ang parirala ay malinaw, makabago, at hindi kasimpitid ng ilang tradisyonal na katawagan.
- source_word: κλεμμάτων
  choice: mga pagnanakaw
  rationale: Sa talaan ng mga bisyo, natural na tumutukoy ang κλέμματα sa mga gawa ng pagnanakaw; tuwiran at karaniwan ang salin sa Tagalog.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ni ... ni ... ni
  rationale: Likas sa Tagalog ang inuulit na “ni” matapos ang sugnay na may pagtanggi, at malinaw nitong pinagbubuklod ang lahat ng kasalanang hindi nila pinagsisihan.
theological_decisions:
- issue: Saklaw ng kahulugan ng φαρμάκων sa isang apokaliptikong talaan ng mga kasalanan
  choice: mga pangkukulam
  alternative: mga gawaing mahika; paggamit ng mga gayuma o lason
  rationale: Sa Pahayag, ang mga kaugnay na salita ay karaniwang tumutukoy sa mahika o mapanlinlang na gawaing okulto. Gayunman, may ugnayang leksikal din ito sa mga timpla, gayuma, o lason, kaya hindi inaalis ang posibilidad na iyon at inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsisi at tumalikod sa” upang maipahayag nang natural ang moral na puwersa ng μετανοέω ἐκ, at ang inuulit na “ni” upang mapanatili ang ayos at diin ng talaan.
