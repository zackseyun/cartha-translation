  to: At hindi nila pinagsisihan ang kanilang mga pagpaslang, ni ang kanilang mga pangkukulam[a], ni ang kanilang seksuwal na imoralidad, ni ang kanilang mga pagnanakaw.
  rationale: Inayos ang pangunahing pandiwa upang ihayag ang iisang diwa ng pagsisising tinalikuran ang mga kasalanang nakatala, sa halip na magdagdag ng ikalawang pandiwa. Pinalitan ang “mga pagpatay” ng “mga pagpaslang” para sa mas tiyak na puwersa ng φόνων, at inayos ang pariralang tumutukoy sa πορνεία para sa likas na modernong Filipino. Pinanatili ang saklaw at kawalang-katiyakan ng φαρμάκων sa talababa.
