  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: tl
  text: May buhok silang tulad ng buhok ng mga babae,[a] at ang mga ngipin nila ay tulad ng mga ngipin ng mga leon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “gaya ng buhok ng mga babae.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχον
  choice: May … sila
  rationale: Ang imperpektong εἶχον ay naglalarawan ng anyo sa pangitain. Likas sa modernong Tagalog ang konstruksiyong “May … sila” kaysa sa pilit na pagmamarka ng nagpapatuloy na nakaraan.
- source_word: τρίχας
  choice: buhok
  rationale: Bagaman maramihan sa Griyego, karaniwang pangngalang di-mabilang ang “buhok” sa natural na paglalarawan sa Tagalog.
- source_word: ὡς τρίχας γυναικῶν
  choice: gaya ng buhok ng mga babae
  rationale: Pinananatili ng “gaya ng” ang tahasang paghahambing ng ὡς, at ang “buhok ng mga babae” ay malinaw, likas, at malapit sa anyo ng Griyego.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: ang mga ngipin nila
  rationale: Natural na ipinahahayag sa Tagalog ang artikulo, pangngalan, at panghalip na paari sa ganitong ayos.
- source_word: ὡς λεόντων
  choice: gaya ng mga ngipin ng mga leon
  rationale: Inuulit ang ipinahihiwatig na “mga ngipin” upang maging malinaw na mga ngipin ng leon ang pinaghahambingan, hindi ang mismong mga leon.
- source_word: ἦσαν
  choice: ay
  rationale: Sa sugnay na paglalarawan, sapat at natural ang “ay” upang ipahayag ang pagiging katulad; hindi kailangang gawing tahasang nakaraan dahil naitatakda na ng salaysay ang panahon.
theological_decisions:
- issue: Kalikasan ng larawang apokaliptiko
  choice: Panatilihin nang tuwiran ang dalawang pagtutulad nang hindi ipinaliliwanag ang simbolismo.
  alternative: Magdagdag ng interpretibong pananalita tungkol sa kahulugan ng buhok at mga ngipin.
  rationale: Mga paghahambing lamang ang ibinibigay ng Griyego at hindi nito nilulutas ang simbolikong kahulugan. Kaya pinananatili ng salin ang larawan at ang likas nitong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na “May … sila” at “nila” para sa natural na daloy, habang pinanatili ang pormal na bigat ng larawang apokaliptiko.
