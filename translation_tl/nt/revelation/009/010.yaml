  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: tl
  text: May mga buntot silang tulad ng mga alakdan, at mga tinik; nasa mga buntot nila ang kapangyarihang saktan ang mga tao sa loob ng limang buwan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: mga buntot
  rationale: Tuwirang katumbas ng maramihang anatomikal na larawan.
- source_word: ὁμοίας σκορπίοις
  choice: gaya ng sa mga alakdan
  rationale: Pinananatili ang paghahambing at natural na ipinahihiwatig sa Filipino na ang mga buntot ang inihahambing sa mga buntot ng alakdan.
- source_word: κέντρα
  choice: mga pantibo
  rationale: Sa larawang alakdan, tumutukoy ito sa matulis na bahaging ginagamit sa pagtibo; mas tiyak ito rito kaysa sa abstraktong 'mga tibo.'
- source_word: ἐξουσία
  choice: kapangyarihan
  rationale: Saklaw nito ang mabisang kakayahang manakit, habang hindi itinatanggi ang maaaring ipinagkaloob na awtoridad sa konteksto ng pangitain.
- source_word: ἀδικῆσαι
  choice: manakit
  rationale: Sa konteksto ng salot at pagpapahirap, ang diwa ay magdulot ng pinsala, hindi lamang gumawa ng kawalang-katarungan.
- source_word: τοὺς ἀνθρώπους
  choice: mga tao
  rationale: Ang ἄνθρωποι ay pangkalahatang tumutukoy sa mga tao rito; natural at saklaw ang 'mga tao' sa modernong Filipino.
- source_word: μῆνας πέντε
  choice: sa loob ng limang buwan
  rationale: Malinaw na ipinapahayag ang akusatibong nagsasaad ng tagal.
theological_decisions:
- issue: Diwa ng ἐξουσία sa larawan ng apokaliptikong salot
  choice: kapangyarihan
  alternative: awtoridad
  rationale: Ang tuon ng pangungusap ay ang aktuwal na kakayahan nilang manakit sa pamamagitan ng kanilang mga buntot. Hindi nito nilulutas kung likas o ipinahintulot ang kapangyarihang iyon.
- issue: Saklaw ng τοὺς ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang referent ng salitang Griyego sa kontekstong ito; ang 'mga lalaki' ay magpapakitid nang hindi nararapat sa saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masinsing larawang apokaliptiko at ang bahagyang pag-uulit ng 'mga buntot' para sa katapatan at kalinawan.
