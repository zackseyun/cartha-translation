id: REV.9.6
reference: Revelation 9:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: tl
  text: At sa mga araw na iyon, hahanapin ng mga tao ang kamatayan at hinding-hindi nila ito matatagpuan. Nanaisin nilang mamatay, ngunit tumatakas sa kanila ang kamatayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: sa mga araw na iyon
  rationale: Likas na pananalitang temporal sa Tagalog na pinananatili ang pagtukoy sa tiyak na panahong iyon.
- source_word: ζητήσουσιν
  choice: hahanapin
  rationale: Ipinapahayag ang sinasadya at masidhing paghahanap sa kamatayan; mas natural dito kaysa sa mas abstraktong “sasaliksikin.”
- source_word: οἱ ἄνθρωποι
  choice: mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy rito sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki. Ang “mga tao” ang tumpak at likas na modernong Tagalog.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: hinding-hindi nila ito matatagpuan
  rationale: Ang “hinding-hindi” ay malinaw na naghahatid ng mariing pagtanggi ng οὐ μή kasama ng pandiwang nasa hinaharap.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: nanaisin nilang mamatay
  rationale: Inihahatid ng “nanaisin” ang matinding pagnanais ng ἐπιθυμέω nang hindi nagpapasok ng karagdagang emosyon na wala sa teksto.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: tumatakas sa kanila ang kamatayan
  rationale: Pinananatili ang dramatikong pangkasalukuyang aspekto at ang personipikasyon ng kamatayan bilang aktibong lumalayo sa kanila.
theological_decisions:
- issue: Personipikasyon ng kamatayan sa apokaliptikong paghuhukom
  choice: “tumatakas sa kanila ang kamatayan”
  alternative: “hindi sila maaaring mamatay”
  rationale: Tuwirang ginagawang simuno ng Griyego ang kamatayan sa pandiwang φεύγει. Pinananatili ng salin ang larawan at tensiyon sa teksto sa halip na gawing paliwanag lamang ang ipinahihiwatig nito.
- issue: Saklaw ng οἱ ἄνθρωποι
  choice: “mga tao”
  alternative: “mga lalaki”
  rationale: Bagaman panlalaking maramihan ang anyong panggramatika, pangkalahatan ang gamit ng ἄνθρωποι sa konteksto. Ang “mga tao” ay hindi naglilimita sa tinutukoy sa mga lalaking nasa hustong gulang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang masidhing negasyon at matingkad na personipikasyon, habang iniwasan ang sinauna o labis na teknikal na pananalita.
