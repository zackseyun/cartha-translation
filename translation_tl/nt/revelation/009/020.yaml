id: REV.9.20
reference: Revelation 9:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: tl
  text: At ang natitirang mga tao[a], na hindi napatay sa mga salot na ito, ay hindi man lamang nagsisi sa mga gawa ng kanilang mga kamay[b], upang hindi sila sumamba sa mga demonyo at sa mga diyus-diyosang yari sa ginto, pilak, tanso, bato, at kahoy[c], na hindi nakakakita, nakakarinig, o nakakalakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang natitira sa sangkatauhan.” Ang salitang Griyego ay pangkalahatang tumutukoy sa mga tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagsisi mula sa mga gawa ng kanilang mga kamay.” Sa kontekstong ito, lalo itong tumutukoy sa mga bagay na kanilang ginawa at sinamba.
    reason: lexical_alternative
  - marker: c
    text: O, “upang hindi na sila sumamba” o “upang tumigil sila sa pagsamba.” Ang sugnay sa Griyego ay maaaring magpahayag ng layunin o nilalayong bunga.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: ang iba pang mga tao
  rationale: Ipinahahayag nito ang mga taong natira matapos ang mga salot; ang ἀνθρώπων ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa kalalakihan.
- source_word: οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: hindi napatay sa mga salot na ito
  rationale: Tuwirang inililipat ang aorist passive na ἀπεκτάνθησαν at ang apokaliptikong diwa ng πληγαῖς bilang mga salot.
- source_word: οὐδὲ μετενόησαν ἐκ
  choice: hindi man lamang nagsisi at tumalikod sa
  rationale: Ang “hindi man lamang” ay nagpapakita ng diin ng οὐδέ. Idinagdag ang “tumalikod” upang likas na maipahayag sa Tagalog ang direksiyong ipinahihiwatig ng ἐκ nang hindi nililimitahan ang μετάνοια sa damdaming pagsisisi lamang.
- source_word: τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: mga gawa ng kanilang mga kamay
  rationale: Pinananatili ang kongkretong biblikal na larawan, na sa konteksto ay lalo nang tumutukoy sa mga diyus-diyosang kanilang ginawa at sinamba.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: upang hindi na sila sumamba
  rationale: Pinananatili ng “upang” ang maaaring layunin o nilalayong bunga ng sugnay; ipinahihiwatig ng “hindi na” ang paghinto sa umiiral na pagsamba nang hindi ginagawang tahasang paliwanag sa pangunahing teksto.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Ito ang malinaw at karaniwang modernong salin para sa masasamang espirituwal na nilalang sa konteksto ng Bagong Tipan.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: mga diyus-diyosang yari sa ginto, pilak, tanso, bato, at kahoy
  rationale: Ang “diyus-diyosan” ay malinaw na kultikong larawan, at ang “yari sa” ay likas na Tagalog para sa magkakasunod na pang-uri ng materyal.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: mga bagay na hindi nakakakita, nakakarinig, o nakakalakad
  rationale: Pinananatili ang tatluhang pangungutya sa kawalang-kakayahan ng mga diyus-diyosan; ang περιπατεῖν ay isinaling literal na “nakakalakad.”
theological_decisions:
- issue: Pangkalahatang saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: sangkatauhan
  rationale: Ang “mga tao” ay likas at pangkalahatan sa modernong Tagalog at malinaw na tumutukoy sa natitirang bahagi ng sangkatauhan nang walang pahiwatig na lalaki lamang.
- issue: Ugnayan ng pagsisisi at pagtigil sa pagsamba sa mga demonyo at diyus-diyosan
  choice: upang hindi na sila sumamba
  alternative: upang tumigil sila sa pagsamba
  rationale: Pinananatili ng napiling salin ang anyong ἵνα μή at ang ambiguwidad nito sa layunin o nilalayong bunga, habang ipinakikitang ang pagsisisi ay may kasamang pagtalikod sa idolatriya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “salot,” “demonyo,” at “diyus-diyosan” bilang malinaw at karaniwang bokabularyong biblikal. Ang mga kuwit sa talaan ng materyales ay iniangkop sa natural na daloy ng Tagalog, at ang gitling bago ang huling sugnay ay nagpapalinaw na ang tinutukoy ay ang mga diyus-diyosan.
