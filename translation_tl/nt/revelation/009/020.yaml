    rationale: Ang “na” ay maaaring magpahiwatig na dati silang patuloy nang sumasamba. Maaaring ilagay ang ganitong pagpapaliwanag sa talababa, habang ang pangunahing teksto ay nananatiling mas malapit sa ἵνα μὴ προσκυνήσουσιν.
