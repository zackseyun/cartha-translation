  source_fidelity: Ang “ang iba pang mga tao” ay maaaring mangahulugang ibang mga tao, samantalang ang οἱ λοιποὶ τῶν ἀνθρώπων ay “ang natitirang mga tao.” Dagdag pa, ang “nagsisi at tumalikod” ay nagdaragdag ng isang hiwalay na kilos na wala sa Griyego; ang μετάνοια at ἐκ ay sapat na maisalin bilang “nagsisi sa mga gawa.” Ang “hindi na” sa pangunahing teksto ay maaaring magpahiwatig ng dating nagpapatuloy na pagsamba na hindi tahasang isinasaad ng anyo ng Griyego.
  naturalness: Natural at marangal ang binagong Tagalog. Ang “natitirang mga tao” ay malinaw sa kontekstong yaong mga nakaligtas sa mga salot, at ang sugnay na “na hindi nakakakita, nakakarinig, o nakakalakad” ay tuwirang tumutukoy sa mga diyus-diyosan.
  terminology: Ang “salot,” “demonyo,” at “diyus-diyosan” ay angkop sa modernong Filipino Tagalog at tapat sa πληγαί, δαιμόνια, at εἴδωλα. Pinananatili ang kongkretong larawan ng “mga gawa ng kanilang mga kamay.”
  issues:
  - severity: medium
    issue: “Ang iba pang mga tao” para sa οἱ λοιποὶ τῶν ἀνθρώπων
    rationale: Ang “iba pang” ay karaniwang “other/additional,” hindi “the rest/the remainder.” Mas tapat ang “ang natitirang mga tao.”
  - severity: medium
    issue: Idinagdag ang “at tumalikod”
    rationale: Walang nakahiwalay na pandiwang katumbas ng “tumalikod” sa Griyego. Bagaman kaugnay ito ng kahulugan ng pagsisisi sa konteksto, hindi dapat idagdag bilang ikalawang hayag na kilos sa pangunahing teksto.
  - severity: low
