revisions:
- from: At ang iba pang mga tao[a], na hindi napatay sa mga salot na ito, ay hindi man lamang nagsisi at tumalikod sa mga gawa ng kanilang mga kamay[b], upang hindi na sila sumamba sa mga demonyo at sa mga diyus-diyosang yari sa ginto, pilak, tanso, bato, at kahoy[c]—mga bagay na hindi nakakakita, nakakarinig, o nakakalakad.
  to: At ang natitirang mga tao[a], na hindi napatay sa mga salot na ito, ay hindi man lamang nagsisi sa mga gawa ng kanilang mga kamay[b], upang hindi sila sumamba sa mga demonyo at sa mga diyus-diyosang yari sa ginto, pilak, tanso, bato, at kahoy[c], na hindi nakakakita, nakakarinig, o nakakalakad.
