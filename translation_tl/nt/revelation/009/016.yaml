  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: tl
  text: At ang bilang ng mga hukbo ng kabalyerya ay dalawang daang milyon[a]; narinig ko ang bilang nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “dalawang sampung libo na pinarami sa sampung libo” (samakatuwid, dalawang daang milyon).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: bilang
  rationale: Tuwirang katumbas ng salitang tumutukoy sa bilang o kabuuan; inulit din sa ikalawang sugnay gaya ng Griyego.
- source_word: στρατευμάτων
  choice: mga hukbo
  rationale: Ang anyong maramihan ay tumutukoy sa mga pangkat o puwersang militar. Pinananatili ng “mga hukbo” ang maramihang anyo at malinaw ang diwang militar.
- source_word: ἱππικοῦ
  choice: kabalyerya
  rationale: Tumutukoy sa sama-samang puwersang militar na nakasakay sa kabayo, hindi lamang sa mga indibidwal na mangangabayo.
- source_word: δισμυριάδες μυριάδων
  choice: dalawang daang milyon
  rationale: Ang parirala ay literal na dalawang laksa ng mga laksa, na katumbas ng 200,000,000. Malinaw at natural sa modernong Tagalog ang numerong “dalawang daang milyon,” habang inilalahad sa talababa ang anyo ng Griyego.
- source_word: ἤκουσα
  choice: narinig ko
  rationale: Likas at tuwirang salin ng payak na pandiwang pasalaysay sa aorist.
- source_word: αὐτῶν
  choice: nila
  rationale: Natural na panghalip na paari na tumutukoy pabalik sa mga hukbo ng kabalyerya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang teknikal ngunit karaniwang nauunawaang salitang “kabalyerya” upang mapanatili ang kolektibong diwa ng ἱππικόν; iniwasan ang “mga mangangabayo,” na maaaring magpahiwatig ng mga indibidwal sa halip na puwersang militar.
