  to: Sapagkat ang kapangyarihan ng mga kabayo ay nasa kanilang mga bibig at buntot; sapagkat ang kanilang mga buntot ay tulad ng mga ahas na may mga ulo, at sa pamamagitan ng mga ito ay pumipinsala sila.[a]
