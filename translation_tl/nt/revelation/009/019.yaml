id: REV.9.19
reference: Revelation 9:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: tl
  text: Sapagkat ang kapangyarihan ng mga kabayo ay nasa kanilang mga bibig at buntot; sapagkat ang kanilang mga buntot ay tulad ng mga ahas na may mga ulo, at sa pamamagitan ng mga ito ay pumipinsala sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “at sa mga ito ay pumipinsala sila.”
    reason: Nililinaw ang mas literal na anyo ng parirala nang hindi ginagawang mas tiyak kaysa sa Griyego ang tinutukoy ng panghalip.
lexical_decisions:
- source_word: ἐξουσία
  choice: kapangyarihan
  rationale: Sa pangitain, tumutukoy ito sa bisa o lakas ng mga kabayo upang makapinsala, hindi pangunahin sa ipinagkaloob na legal na awtoridad.
- source_word: στόματι
  choice: mga bibig
  rationale: Bagaman isahan ang anyo sa Griyego, distributibo ito kaugnay ng maramihang mga kabayo; likas sa Tagalog ang maramihang anyo.
- source_word: οὐραῖς / οὐραὶ
  choice: mga buntot
  rationale: Ito ang tuwiran at karaniwang katumbas at mahalaga sa biswal na larawan ng talata.
- source_word: ὅμοιαι ὄφεσιν
  choice: tulad ng mga ahas
  rationale: Ang “ahas” ay natural sa makabagong Tagalog at malinaw na nagpapanatili sa larawang inihahambing sa mga serpiyente.
- source_word: ἔχουσαι κεφαλάς
  choice: na may mga ulo
  rationale: Natural itong Tagalog para sa participial phrase at pinananatili ang malinaw na detalye ng pangitain.
- source_word: ἀδικοῦσιν
  choice: pumipinsala sila
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa aktuwal na pananakit o pagdudulot ng pinsala, hindi sa abstraktong paggawa ng kawalang-katarungan.
- source_word: ἐν αὐταῖς
  choice: sa pamamagitan ng mga iyon
  rationale: Instrumental ang diwa ng parirala at ang pambabaeng panghalip sa Griyego ay tumutukoy sa mga buntot; hindi tahasang pinapangalanan muli ang mga buntot upang mapanatili ang anyo ng pinagmulan.
- source_word: γὰρ
  choice: sapagkat
  rationale: Parehong paliwanag ang gamit ng dalawang γάρ; pinananatili ng “sapagkat” ang ugnayang lohikal ng mga sugnay.
theological_decisions:
- issue: Apokaliptikong larawan ng mga buntot na tulad ng mga ahas at may mga ulo
  choice: Isinalin nang tuwiran ang larawan nang walang idinagdag na alegorikal na paliwanag.
  alternative: Tukuyin ang mga buntot bilang sagisag ng maling aral, kapangyarihang demonyo, o ibang tiyak na realidad.
  rationale: Inilalarawan lamang ng talata ang pangitain; hindi nito tahasang ibinibigay ang isang alegorikal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “sapagkat” at ang masinsing daloy ng larawang apokaliptiko nang hindi ito binibigyan ng dagdag na interpretasyon.
