  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: tl
  text: Lumipas na ang unang kasawian[a]. Narito[b], dalawa pang kasawian ang darating pagkatapos ng mga bagay na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lumipas na ang isang kasawian”; literal na “ang isang kasawian” sa Griyego, ngunit sa konteksto ay ito ang una sa isang serye.
    reason: lexical_alternative
  - marker: b
    text: O “Narito, may dalawa pang kasawian na darating pagkatapos ng mga bagay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: kapighatian
  rationale: Pinananatili ang bigat ng pormulang apokaliptiko na nagpapahayag ng matinding sakuna at paghatol; mas marangal at mas angkop sa konteksto kaysa sa payak na “sakuna.”
- source_word: ἡ μία
  choice: ang unang
  rationale: Bagaman literal na “ang isa,” ordinal ang gamit nito sa konteksto sapagkat ito ang una sa tatlong kapighatiang naunang ipinahayag.
- source_word: ἀπῆλθεν
  choice: lumipas na
  rationale: Likas sa Tagalog para sa isang yugto o pangyayaring natapos na at malinaw na ipinahihiwatig ang ganap na pagwawakas nito.
- source_word: ἰδού
  choice: Masdan
  rationale: Isang marangal at malinaw na panawagan upang ituon ang pansin sa kasunod na pahayag, na angkop sa propetiko at apokaliptikong himig.
- source_word: ἔρχεται
  choice: darating
  rationale: Natural na salin sa Tagalog para sa nalalapit na pagdating ng dalawang natitirang kapighatian; hindi kailangang tumbasan ang bilang ng pandiwa gaya sa Ingles.
- source_word: ἔτι
  choice: pa
  rationale: Ipinakikitang may dalawa pang natitira matapos ang una, sa pinakanatural na ayos ng modernong Tagalog.
- source_word: μετὰ ταῦτα
  choice: pagkatapos ng mga bagay na ito
  rationale: Pinananatili ang maramihang demonstratibo at ang pormal na pahayag ng pagkakasunod-sunod na paulit-ulit sa Pahayag.
theological_decisions:
- issue: Apokaliptikong pagkakasunod-sunod ng tatlong kapighatian
  choice: Natapos na ang unang ipinahayag na kapighatian, at dalawa pa ang darating.
  alternative: Ituring ang οὐαί bilang pangkalahatang “sakuna” o “paghatol” nang hindi pinananatili ang inuulit na pormula.
  rationale: Binibigyang-diin ng Griyego ang bilang at pagkakasunod-sunod ng mga kapighatian sa pangitain. Pinananatili ng salin ang estrukturang ito nang hindi nagdaragdag ng paliwanag tungkol sa tiyak na anyo ng mga paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapighatian” upang mapanatili ang solemne at apokaliptikong himig, at ang “Masdan” bilang bahagyang mataas ngunit malinaw na panawag-pansin.
