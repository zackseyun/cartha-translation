  terminology: Ang “pahirapan/paghihirap” ay angkop para sa βασανισθήσονται/βασανισμός at pinananatili ang magkakaugnay na larangan ng matinding pagdurusa. Ang “isang tao” ay tumpak para sa generic na ἄνθρωπον. Walang kailangang footnote anchor sa Tagalog na tekstong ito.
