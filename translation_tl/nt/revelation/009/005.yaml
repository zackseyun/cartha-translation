  to: At ipinagkaloob sa kanila na huwag nilang patayin ang mga tao, kundi upang ang mga ito ay pahirapan sa loob ng limang buwan. Ang paghihirap na dulot nila ay tulad ng sakit mula sa alakdan kapag tinutuklaw nito ang isang tao.
