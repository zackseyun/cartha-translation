id: REV.9.5
reference: Revelation 9:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: tl
  text: At ipinagkaloob sa kanila na huwag nilang patayin ang mga tao, kundi upang ang mga ito ay pahirapan sa loob ng limang buwan. Ang paghihirap na dulot nila ay tulad ng sakit mula sa alakdan kapag tinutuklaw nito ang isang tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: ibinigay sa kanila
  rationale: Pinananatili ang balintiyak na pahayag at hindi tahasang pinapangalanan ang nagbigay, gaya ng tekstong Griyego.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: na huwag nilang patayin ang mga tao
  rationale: Ipinahahayag ang nilalaman o layunin ng ipinagkaloob; ang “mga tao” ay malinaw na tumutukoy sa mga taong nasa naunang konteksto.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: kundi pahirapan ang mga ito sa loob ng limang buwan
  rationale: Ang “pahirapan” ay likas sa modernong Tagalog at naghahatid ng matinding pagdurusang ipinahihiwatig ng βασανίζω; malinaw na ipinapakita ng “sa loob ng” ang tagal.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: ang paghihirap na dulot nila
  rationale: Nililinaw nang katamtaman na ang paghihirap ay yaong idinudulot ng mga nilalang, ayon sa konteksto, nang hindi dinaragdagan ang uri nito.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: tulad ng sakit mula sa alakdan
  rationale: Sa Tagalog, mas natural at malinaw ang “sakit mula sa alakdan” kaysa sa literal na “pahirap ng alakdan,” habang pinananatili ang paghahambing.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: kapag tinutuklaw nito ang isang tao
  rationale: Bagaman literal na “humampas” ang παίω, sa konteksto ng alakdan ay ang pagtuklaw ang likas at tiyak na kahulugan; generic ang ἄνθρωπον kaya “isang tao” ang angkop.
theological_decisions:
- issue: Balintiyak na pahayag tungkol sa kapangyarihan o pahintulot
  choice: Panatilihin ang “ibinigay sa kanila” nang hindi pinapangalanan ang nagbigay.
  alternative: “Pinahintulutan sila ng Diyos” o “binigyan sila ng Diyos ng kapangyarihan.”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang Diyos. Pinananatili ng salin ang ugnayan ng banal na paghahari at di-tuwirang paghatol nang hindi ito pinapasimple.
- issue: Layunin o resulta ng ἵνα kasama ang di-karaniwang future passive
  choice: Isalin bilang “kundi pahirapan ang mga ito.”
  alternative: “kundi upang pahirapan ang mga ito” o “kundi upang ang mga ito ay pahirapan.”
  rationale: Pinananatili nito ang kaibhan sa pagitan ng pagbabawal na pumatay at ng itinakdang pagpapahirap, habang natural ang anyo sa Tagalog at hindi labis na nilulutas kung layunin o resulta ang diin.
- issue: Generic na ἄνθρωπον
  choice: “isang tao”
  alternative: “isang lalaki”
  rationale: Ang ἄνθρωπος ay generic dito at hindi nagpapahiwatig na lalaki lamang ang tinutukoy; tumpak at natural ang “tao.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong “datapwat” at ang teknikal o labis na literal na “pahirap ng alakdan.”
