  source_fidelity: 'Tumpak ang pangunahing diwa: ipinagkaloob sa mga nilalang na huwag pumatay kundi magdulot ng limang buwang matinding pagdurusa, na inihambing sa dulot ng alakdan. Gayunman, ang pambungad na “ibinigay sa kanila na” ay hindi gaanong likas na Tagalog, at ang “pahirapan” ay mas mabuting lagyan ng malinaw na layuning anyo upang maipakita ang ἵνα nang hindi binabago ang balintiyak na resulta para sa mga tao.'
