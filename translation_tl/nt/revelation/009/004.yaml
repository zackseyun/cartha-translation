  source_fidelity: Ang salin ay tapat sa balintiyak na ἐρρέθη (“sinabi sa kanila”), sa pagbabawal na pinsalain ang damo at mga puno, sa natatanging saklaw na mga taong walang tatak ng Diyos, at sa lokasyong “sa kanilang mga noo.” Gayunman, ang πᾶν χλωρόν ay substantivized na “anumang luntiang bagay,” hindi tahasang “halaman”; hindi dapat paliitin ang saklaw nito sa salin.
  naturalness: Marangal, malinaw, at likas ang pangungusap sa modernong Filipino Tagalog. Ang “ni anumang” ay angkop sa magkakasunod na pagtanggi, at ang “kundi ang mga taong” ay malinaw na eksepsiyon sa ipinagbabawal na pinsala.
  terminology: Ang “tatak ng Diyos” ay angkop para sa σφραγίς at pinananatili ang larawang apokaliptiko nang hindi nagdaragdag ng doktrinal na paliwanag. Ang “pinsalain” ay angkop sa kontekstuwal na diwa ng ἀδικέω.
