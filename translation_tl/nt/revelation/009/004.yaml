id: REV.9.4
reference: Revelation 9:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: tl
  text: At sinabi sa kanila na huwag nilang pinsalain ang damo sa lupa, ni anumang luntiang bagay, ni anumang punongkahoy, kundi ang mga taong walang tatak ng Diyos sa kanilang mga noo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: sinabi sa kanila
  rationale: Pinananatili nito ang di-tahasang tagapagsalita ng balintiyak na Griyego nang hindi ipinapalagay na tahasang utos ng Diyos.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: na huwag nilang pinsalain
  rationale: Sa konteksto ng paghuhukom, ang ἀδικέω ay tumutukoy sa pananakit o pamiminsala; likas at malinaw sa Tagalog ang “pinsalain.”
- source_word: τὸν χόρτον τῆς γῆς
  choice: ang damo sa lupa
  rationale: Likas na Tagalog para sa mga damong tumutubo sa lupa, habang pinananatili ang kaugnayan ng χόρτος at γῆ.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: ni anumang luntiang halaman
  rationale: Ang substantivized χλωρόν ay literal na “anumang luntiang bagay”; nililinaw ng “halaman” ang konteksto ng mga pananim nang hindi labis na nililimitahan ang saklaw.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ni anumang punongkahoy
  rationale: Tuwirang katumbas ng δένδρον at malinaw na kaagapay ng iba pang uri ng pananim.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Ipinahahayag nito ang tanging pinahihintulutang puntirya ng pamiminsala.
- source_word: τοὺς ἀνθρώπους
  choice: ang mga taong
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: walang
  rationale: Maikli at likas na Tagalog para sa “na hindi nagtataglay,” at malinaw ang kaugnayan sa mga tao.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: tatak ng Diyos
  rationale: Pinananatili ng “tatak” ang mahalagang larawang apokaliptiko ng pagmamay-ari at pag-iingat ng Diyos.
- source_word: ἐπὶ τῶν μετώπων
  choice: sa kanilang mga noo
  rationale: Likas na Tagalog para sa lokasyon ng tatak; idinagdag ang “kanilang” ayon sa tinutukoy na mga tao.
theological_decisions:
- issue: Saklaw ng ἀνθρώπους
  choice: mga tao sa pangkalahatan
  alternative: mga lalaki lamang
  rationale: Ikinukumpara ng talata ang mga halaman sa mga taong mayroon o walang tatak ng Diyos; walang batayan sa konteksto na limitahan ito sa mga lalaki.
- issue: Di-tahasang tagapagsalita sa ἐρρέθη
  choice: sinabi sa kanila, nang hindi pinapangalanan ang nagsalita
  alternative: iniutos sa kanila ng Diyos
  rationale: Hindi tinutukoy ng balintiyak na anyo sa Griyego ang nagsalita. Bagaman maaaring Diyos ang sukdulang pinagmulan ng utos sa konteksto, hindi iyon dapat tahasang idagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pinsalain,” “luntiang halaman,” “punongkahoy,” at “tatak” upang mapanatili ang apokaliptikong tono nang hindi nagiging makaluma o teknikal.
