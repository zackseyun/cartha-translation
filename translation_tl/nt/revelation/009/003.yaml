  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: tl
  text: At mula sa usok ay lumabas ang mga balang patungo sa lupa, at pinagkalooban sila ng awtoridad[a], gaya ng awtoridad na taglay ng mga alakdan sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapangyarihan.” Ang salitang Griyego ay maaaring mangahulugang awtoridad, karapatan, o kapangyarihan; ginamit dito ang “awtoridad” upang ipakita ang ipinagkaloob na pahintulot sa pasibong anyo ng pangungusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ ἐξῆλθον
  choice: mula sa usok ay lumabas
  rationale: Ipinapakita ng “mula sa usok” at “lumabas” ang paglitaw mula sa loob nito. Natural sa Tagalog ang bahagyang pag-uulit at pinananatili nito ang malinaw na galaw ng Griyego.
- source_word: ἀκρίδες
  choice: mga balang
  rationale: Ang ἀκρίς ay karaniwang tumutukoy sa locust; “balang” ang tiyak at pamilyar na katumbas sa Tagalog.
- source_word: εἰς τὴν γῆν
  choice: patungo sa lupa
  rationale: Pinananatili ng “patungo” ang direksiyonal na puwersa ng εἰς, habang ang “lupa” ay natural na katumbas ng γῆ sa kontekstong ito.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: binigyan sila ng awtoridad
  rationale: Ang “awtoridad” ay nagpapanatili sa diwa ng ipinagkaloob na karapatan o pahintulot, at hindi lamang likas na lakas. Hindi tinutukoy ang nagbigay, gaya ng pasibong anyo sa Griyego.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: gaya ng awtoridad na taglay
  rationale: Malinaw na ipinapahayag ang paghahambing at inuulit ang “awtoridad,” gaya ng pag-uulit ng ἐξουσία sa Griyego.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: mga alakdan sa lupa
  rationale: Mas natural sa modernong Tagalog ang “sa lupa” kaysa “ng lupa,” at hindi nito ipinapalagay na yari sa lupa ang mga alakdan.
theological_decisions:
- issue: Ang kalikasan ng ipinagkaloob sa mga balang
  choice: “awtoridad” at hindi tinukoy kung sino ang nagbigay
  alternative: “kapangyarihan” o tahasang tukuyin ang Diyos bilang nagbigay
  rationale: Maaaring saklawin ng ἐξουσία ang awtoridad, karapatan, o kapangyarihan. Dito, ang pasibong “binigyan” ay nagpapahiwatig ng ipinahintulot o ipinagkaloob na kakayahan. Pinananatili ang pagpipigil ng teksto sa hindi pagtukoy sa nagbibigay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “balang” at “alakdan” bilang tiyak at karaniwang katawagan; pinanatili ang apokaliptikong larawan at ang hindi tahasang pagtukoy sa nagbigay.
