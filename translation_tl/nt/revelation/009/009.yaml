id: REV.9.9
reference: Revelation 9:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: tl
  text: May suot silang mga baluti sa dibdib na parang mga baluting bakal, at ang tunog ng kanilang mga pakpak ay gaya ng tunog ng maraming karwaheng may mga kabayong rumaragasa[a] patungo sa labanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “gaya ng tunog ng mga karwahe ng maraming kabayong tumatakbo patungo sa labanan.”'
    reason: Pinananatili ng mas literal na anyo ang siksik na ugnayan ng ἁρμάτων ἵππων πολλῶν τρεχόντων at ang posibleng saklaw ng pandiwaring “tumatakbo.”
lexical_decisions:
- source_word: θώρακας
  choice: mga baluti sa dibdib
  rationale: Tiyak na tumutukoy ang θώραξ sa baluting nagtatanggol sa dibdib o katawan; malinaw at natural sa modernong Filipino ang “baluti sa dibdib.”
- source_word: ὡς θώρακας σιδηροῦς
  choice: parang mga baluting bakal
  rationale: Pinananatili ng “parang” ang hayagang paghahambing na ipinapahiwatig ng ὡς, at tuwirang isinasalin ng “bakal” ang σιδηροῦς.
- source_word: φωνὴ
  choice: tunog
  rationale: Sa konteksto ng mga pakpak at karwahe, tumutukoy ang φωνή sa naririnig na tunog, hindi sa tinig. Pinananatili rin ang pag-uulit ng salita sa dalawang bahagi ng paghahambing.
- source_word: πτερύγων
  choice: mga pakpak
  rationale: Tuwirang katumbas ng πτέρυγες at natural sa Filipino ang pariralang “tunog ng kanilang mga pakpak.”
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: maraming karwaheng may mga kabayo
  rationale: Tahasan nitong pinananatili kapuwa ang mga karwahe at mga kabayo nang hindi ipinipilit sa pangunahing teksto ang mas interpretatibong “hinihila ng mga kabayo.”
- source_word: τρεχόντων
  choice: rumaragasa
  rationale: Ipinahahayag nito ang mabilis at maramihang pagkilos ng mga kabayo o karwahe sa matingkad na tagpo, nang hindi dinaragdagan ang teksto ng mas tiyak na kilos na “sumasalakay.”
- source_word: εἰς πόλεμον
  choice: patungo sa labanan
  rationale: Natural na ipinahahayag nito ang direksiyon tungo sa digmaan o pakikipaglaban sa agarang larawan ng mga karwahe.
theological_decisions:
- issue: Kalikasan ng larawang nakita ni Juan
  choice: Isinalin ang paglalarawan bilang hayagang paghahambing sa isang pangitain, nang hindi tinutukoy kung ano mismo ang sinasagisag ng mga nilalang.
  alternative: Kilalanin sa salin ang mga ito bilang literal na makinaryang pandigma, mga demonyo, o isang tiyak na hukbo.
  rationale: Dalawang ulit gumagamit ang Griyego ng ὡς (“parang/gaya ng”). Dapat panatilihin ng salin ang apokaliptikong larawan at huwag lutasin ang pinagtatalunang kahulugan nito.
- issue: Ugnayan ng mga karwahe, kabayo, at pandiwaring τρεχόντων
  choice: Ginamit ang “maraming karwaheng may mga kabayong rumaragasa,” na natural ngunit hindi lubusang nilulutas kung ang diin ng rumaragasang pagkilos ay nasa mga kabayo o sa buong pangkat ng mga karwahe at kabayo.
  alternative: “Maraming karwaheng hinihila ng mga kabayong tumatakbo” o “maraming karwaheng rumaragasa.”
  rationale: Maaaring iugnay sa anyong Griyego ang τρεχόντων sa mga kabayo o, ayon sa anyong panggramatika at larawan, sa mga karwahe. Ang pangunahing salin at talababa ay nagpapanatili sa saklaw ng posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “baluti,” “karwahe,” at “labanan” bilang madaling maunawaang mga salitang angkop sa sinauna at apokaliptikong tagpo; iniwasan ang teknikal o denominasyonal na pagpapakahulugan.
