id: REV.9.13
reference: Revelation 9:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: tl
  text: At hinipan ng ikaanim na anghel ang kanyang trumpeta, at narinig ko ang isang tinig[a] mula sa mga sungay ng gintong altar na nasa harapan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iisang tinig.” Idinidiin sa Griyego na ang tinig ay isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: hinipan ... ang kanyang trumpeta
  rationale: Ang σαλπίζω ay nangangahulugang hipan o patunugin ang trumpeta. Likas sa makabagong Tagalog ang tahasang pagbanggit sa trumpeta, na ipinahihiwatig ng pandiwa at malinaw sa konteksto.
- source_word: φωνὴν μίαν
  choice: isang tinig
  rationale: Pinananatili nito ang diin sa pagiging isa ng tinig nang hindi tinutukoy kung kanino iyon nagmula.
- source_word: ἐκ τῶν κεράτων
  choice: mula sa mga sungay
  rationale: Ipinapahayag ng ἐκ ang pinagmulan, at ang κέρατα ay ang mga nakausling bahaging hugis-sungay ng altar.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: gintong altar
  rationale: Ito ang natural at marangal na katumbas sa Tagalog, at pinananatili ang larawan ng makalangit na santuwaryo.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: na nasa harapan ng Diyos
  rationale: Malapit ito sa diwa ng ἐνώπιον bilang kinaroroonan sa harap o presensya ng Diyos, nang hindi nagdaragdag na ang altar ay nakatayo.
- source_word: ἄγγελος
  choice: anghel
  rationale: Sa pangitain ng Pahayag, malinaw na isang makalangit na nilalang ang tinutukoy, hindi isang taong mensahero.
theological_decisions:
- issue: Pagkakakilanlan ng tinig
  choice: Panatilihing neutral bilang “isang tinig.”
  alternative: Tukuyin ito bilang tinig ng Diyos, tinig ng isang anghel, o tinig na kumakatawan sa altar.
  rationale: Sinasabi lamang ng Griyego na nakarinig si Juan ng isang tinig mula sa mga sungay ng gintong altar. Hindi dapat lutasin ng salin ang sadyang hindi tinukoy ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na “anghel,” “trumpeta,” at “altar,” at pinanatili ang masining na larawan ng mga sungay ng altar.
source_grounding:
  english_pob_role: consult_only
