  source_fidelity: 'Tapat ang salin sa pagkakasunod at mga ugnayan ng Griyego: binuksan ang φρέαρ na naiiba sa ἄβυσσος; umakyat ang usok mula rito; itinulad ito sa usok ng malaking pugon; at dumilim ang araw at ang hangin dahil sa usok. Ang “lagusan patungo sa kalaliman” ay isang katanggap-tanggap na paraan upang maipakita sa natural na Filipino na ang lagusan ay daan/bukasan at hindi ang kalaliman mismo.'
  naturalness: Malinaw, makabago, at marangal ang daloy. Natural ang “umakyat mula sa lagusan ang usok” at “Dumilim ang araw at ang hangin dahil sa usok.” Ang paghahati sa dalawang pangungusap ay hindi nakapagbago sa lohikal na daloy ng talata.
