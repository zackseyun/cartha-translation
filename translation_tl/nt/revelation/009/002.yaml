id: REV.9.2
reference: Revelation 9:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: tl
  text: Binuksan niya ang lagusan patungo sa kalaliman[a], at umakyat mula sa lagusan ang usok na parang usok ng isang malaking pugon. Dumilim ang araw at ang hangin dahil sa usok mula sa lagusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hukay ng kalaliman”; ayon sa tradisyon, “ang hukay na walang ilalim.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: Binuksan
  rationale: Tuwirang ipinapahayag ang aorist active indicative ng ἀνοίγω nang hindi dinaragdagan ng paraang gaya ng “inangkla” o “ini-unlock.”
- source_word: φρέαρ
  choice: lagusan
  rationale: Sa pangitain, tumutukoy ito sa bukasan o daanang patungo sa kalaliman. Ang “lagusan” ay natural sa Filipino at pinananatiling naiiba ang bukasan sa mismong ἄβυσσος.
- source_word: ἀβύσσου
  choice: kalaliman
  rationale: Ang “kalaliman” ay likas at dignified na katumbas ng ἄβυσσος at hindi nagdaragdag ng ideyang “walang ilalim,” na hindi tahasang sinasabi ng salita rito.
- source_word: ἀνέβη καπνὸς
  choice: umakyat ... ang usok
  rationale: Pinananatili ang tahasang paitaas na galaw ng ἀναβαίνω at ang usok bilang simuno.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: parang usok ng isang malaking pugon
  rationale: Pinananatili ang paghahambing na ὡς, ang larawan ng κάμινος bilang pugon, at ang lakas ng μεγάλης.
- source_word: ἐσκοτώθη
  choice: Dumilim
  rationale: Natural itong passive/resultative equivalent sa Filipino sa kontekstong ang kasunod na pariralang “dahil sa usok” ang nagsasaad ng sanhi. Ang mas literal na “pinadilim” ay mas mabigat at maaaring magmungkahi ng tahasang personal na tagagawa.
- source_word: ὁ ἥλιος καὶ ὁ ἀὴρ
  choice: ang araw at ang hangin
  rationale: Tuwirang pinananatili ang dalawang pangngalan; ang ἀήρ ay “hangin” o atmospera, hindi “langit.”
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: dahil sa usok mula sa lagusan
  rationale: Likas na ipinahahayag sa Filipino ang sanhi at pinagmulan na saklaw ng ἐκ.
theological_decisions:
- issue: Paglalarawan sa apokaliptikong pook nang hindi nagdaragdag ng tradisyonal na interpretasyon
  choice: “ang lagusan patungo sa kalaliman” para sa τὸ φρέαρ τῆς ἀβύσσου
  alternative: “ang hukay ng kalaliman” o tradisyonal na “hukay na walang ilalim”
  rationale: Nililinaw ng “patungo sa” ang relasyong ang φρέαρ ay bukasan o daan tungo sa ἄβυσσος, habang iniiwasang pag-isahin ang dalawa. Hindi rin nito idinaragdag ang “walang ilalim,” na interpretibong pagpapalawak ng ἄβυσσος.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pugon” bilang pamilyar ngunit dignified na salita, at hinati sa dalawang pangungusap upang maging natural ang mahabang Griyegong pangungusap nang hindi nawawala ang pagkakasunod-sunod ng mga larawan.
