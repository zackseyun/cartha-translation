base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: tl
  text: 'Sinasabi ng nagpapatotoo tungkol sa mga bagay na ito: “Oo, malapit na akong dumating.”[a] Amen. Dumating ka, Panginoong Jesus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabilis akong darating.” Maaaring idiin ng pang-abay na Griyego ang pagiging malapit sa panahon o ang bilis ng pagdating o pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Sinasabi
  rationale: Likas na inililipat ng kasalukuyang panahunang pandiwa ang introduksiyon sa tuwirang pananalita bilang “Sinasabi.”
- source_word: ὁ μαρτυρῶν
  choice: ang nagpapatotoo
  rationale: Pinananatili nito ang patuloy na diwa ng kasalukuyang participle at ang legal na diwa ng pagbibigay-patotoo.
- source_word: ταῦτα
  choice: tungkol sa mga bagay na ito
  rationale: Malinaw na tumutukoy ang pangmaramihang demonstratibo sa mga nilalaman ng pahayag na nauna.
- source_word: Ναί
  choice: Oo
  rationale: Payak at tuwirang katumbas ng panandang pagsang-ayon.
- source_word: ἔρχομαι
  choice: darating ako
  rationale: Ang kasalukuyang anyong Griyego ay may nakatuon-sa-hinaharap na diwa rito; natural sa Tagalog ang “darating ako” at hindi nito dinaragdagan ang pahayag.
- source_word: ταχύ
  choice: sa lalong madaling panahon
  rationale: Ipinahahayag nito ang temporal na lapit sa natural na modernong Tagalog; inilalagay sa talababa ang tunay na alternatibong diwang mabilis ang pagdating o pagkilos.
- source_word: Ἀμήν
  choice: Amen
  rationale: Pinananatili ang tradisyonal at panalanging tugon nang walang pagpapakahulugan na higit sa teksto.
- source_word: ἔρχου
  choice: Pumarito ka
  rationale: Tuwiran at marangal na pautos na humihiling sa Panginoon na dumating sa kinaroroonan ng nagsasalita.
- source_word: κύριε
  choice: Panginoong
  rationale: Karaniwang pamagat kay Jesus sa Bagong Tipan at natural sa tuwirang pagtawag sa Tagalog.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng personal na pangalan sa Filipino.
theological_decisions:
- issue: Diwa ng ταχύ sa pangako ng pagdating ni Cristo
  choice: sa lalong madaling panahon
  alternative: nang mabilis
  rationale: Maaaring tumukoy ang ταχύ sa pagiging malapit sa panahon o sa bilis ng pagdating/pagkilos. Ang pangunahing salin ay natural na nagpapahayag ng temporal na lapit, habang pinananatili ng talababa ang mahalagang alternatibo nang hindi nilulutas nang palihim ang eskatolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa banal na kasulatan. Ginamit ang “Pumarito ka” sa panalangin upang maging natural ang direksiyon ng pagdating at mapanatili ang maikli at apurahang pakiusap.
