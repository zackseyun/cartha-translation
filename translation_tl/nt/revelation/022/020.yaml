  rationale: Pinalitan ang idyomang “sa lalong madaling panahon” ng “malapit na” upang hindi maipahiwatig ang ‘sa pinakaunang posibleng oras’ at upang mapanatili ang temporal na pagbasa ng ταχύ. Inayos din ang ayos ng “malapit na akong dumating” para sa likas na modernong Tagalog. Pinalitan ang “Pumarito ka” ng “Dumating ka” upang maging mas kontemporaryo at maiwasan ang dagdag na deiktikong direksiyon, habang pinananatili ang panalanging apela kay Jesus.
