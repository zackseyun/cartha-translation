revisions:
- from: At akong si Juan ang nakaririnig at nakakakita ng mga bagay na ito. Nang marinig at makita ko ang mga ito, nagpatirapa ako sa harap ng mga paa ng anghel na nagpapakita sa akin ng mga bagay na ito upang sumamba[a].
  to: At ako, si Juan, ang nakaririnig at nakakakita ng mga bagay na ito. Nang marinig at makita ko ang mga ito, nagpatirapa ako upang sumamba sa harap ng mga paa ng anghel na nagpapakita sa akin ng mga bagay na ito.[a]
  rationale: Inayos ang pambungad para sa likas na modernong Filipino at inilipat ang “upang sumamba” upang malinaw na isaad na layunin ito ng pagpapatirapa ni Juan. Walang binago sa kahulugan, aspekto, teolohikal na tensiyon, o saklaw ng mga salitang pinagmulan. Inilipat ang talababa sa hulihan ng buong pangungusap upang ang pananda ay nakaangkla pa rin sa saling “sumamba” at hindi nakasisira sa daloy ng sugnay.
