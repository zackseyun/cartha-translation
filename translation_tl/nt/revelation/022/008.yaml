    issue: Di-gaanong likas ang “At akong si Juan.”
    rationale: Ang “At ako, si Juan,” ay mas karaniwang ayos sa makabagong Filipino habang pinananatili ang emphatic na ἐγώ at ang pagpapakilala sa pangalan.
  - severity: medium
    issue: Malayo ang “upang sumamba” sa pandiwang “nagpatirapa.”
    rationale: Dahil sumusunod ito sa mahabang pariralang “ng anghel na nagpapakita…,” puwede itong lumikha ng pansamantalang kalabuan sa pagkakaugnay ng layunin. Ang Griyegong infinitive ay layunin ng ἔπεσα, kaya dapat itong ilapit sa “nagpatirapa.”
