id: REV.22.8
reference: Revelation 22:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: tl
  text: At ako, si Juan, ang nakaririnig at nakakakita ng mga bagay na ito. Nang marinig at makita ko ang mga ito, nagpatirapa ako upang sumamba sa harap ng mga paa ng anghel na nagpapakita sa akin ng mga bagay na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumukod sa harap” o “magbigay-galang.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpapatirapa o paggalang; dito ay isinaling “sumamba” dahil madalas itong may ganitong diwa sa Apocalipsis at dahil sa pagsaway na kasunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: At akong si Juan
  rationale: Pinananatili ang pang-ugnay na καί at ang mariing pagtukoy ni Juan sa sarili, sa likas at marangal na ayos sa Tagalog.
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: ang nakaririnig at nakakakita ng mga bagay na ito
  rationale: Inilalahad bilang kasalukuyan ang mga participle at pinananatili ang tahasang maramihang ταῦτα.
- source_word: καὶ ὅτε ἤκουσα καὶ ἔβλεψα
  choice: Nang marinig at makita ko ang mga ito
  rationale: Ang “nang” ay tumutugma sa temporal na ὅτε nang hindi ipinapalagay na ang ibig sabihin ay “pagkatapos.” Ang tahasang layon ay idinagdag para sa likas na daloy sa Tagalog at malinaw na tumutukoy sa ταῦτα.
- source_word: ἔπεσα προσκυνῆσαι
  choice: nagpatirapa ako … upang sumamba
  rationale: Ipinahahayag ng “nagpatirapa” ang pisikal na pagbagsak o pagluhod, habang pinananatili ng “sumamba” ang layunin ng προσκυνῆσαι at ang bigat nito sa konteksto ng Apocalipsis.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: sa harap ng mga paa
  rationale: Pinananatili ang tahasang “mga paa” at ang kahulugan ng ἔμπροσθεν sa halip na gawing mas maluwag na “sa paanan.”
- source_word: τοῦ ἀγγέλου
  choice: ng anghel
  rationale: Ang tinutukoy ay isang makalangit na nilalang, kaya ang nakaugaliang saling “anghel” ang angkop.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: na nagpapakita sa akin ng mga bagay na ito
  rationale: Ang aspektong nagpapatuloy ng present participle ay naipahahayag ng “nagpapakita,” at pinananatili ang inuulit na ταῦτα.
theological_decisions:
- issue: Kahulugan ng προσκυνέω na iniukol sa anghel
  choice: sumamba
  alternative: yumukod sa harap; magbigay-galang
  rationale: Maaaring tumukoy ang pandiwa sa pagpapatirapa o pagbibigay-galang, ngunit madalas itong may lakas na “sumamba” sa Apocalipsis. Hindi pinalalambot ng salin ang maling ginawa ni Juan; ang pagsaway sa kasunod na talata ang magpapakitang hindi ito nararapat iukol sa anghel.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nakaririnig” at “nakakakita” upang mapanatili ang kasalukuyang anyo ng mga participle, at “nagpatirapa” upang malinaw na mailarawan ang kilos nang hindi pinapalitan ang hiwalay na layuning “sumamba.”
