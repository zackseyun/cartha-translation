id: REV.22.5
reference: Revelation 22:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: tl
  text: Hindi na magkakaroon ng gabi, at hindi nila kakailanganin ang liwanag ng ilawan o ang liwanag ng araw, sapagkat liliwanagan sila ng Panginoong Diyos. At maghahari sila magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “sa mga kapanahunan ng mga kapanahunan,” isang idyomang nangangahulugang walang katapusang tagal.
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: Hindi na magkakaroon ng gabi
  rationale: Likas at marangal na Filipino ito para sa ganap na pagkawala ng gabi, at tumpak na ipinahahayag ang οὐκ ἔσται ἔτι.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: hindi nila kakailanganin
  rationale: Bagaman nasa pangkasalukuyang anyo ang ἔχουσιν, malinaw na nakapaloob ang pahayag sa panghinaharap na pangitain at napaliligiran ng mga pandiwang nasa hinaharap.
- source_word: φωτὸς λύχνου
  choice: liwanag ng ilawan
  rationale: Direkta at natural na salin ng konstruksiyong genitibo; mas malinaw sa karaniwang Filipino kaysa sa pinagsamang anyong katumbas ng 'lamplight.'
- source_word: φῶς ἡλίου
  choice: liwanag ng araw
  rationale: Karaniwang Filipino para sa liwanag na nagmumula sa araw at malinaw na kaagapay ng 'liwanag ng ilawan.'
- source_word: κύριος ὁ θεός
  choice: ang Panginoong Diyos
  rationale: Ang 'Panginoon' ang karaniwang katumbas ng κύριος, at natural sa Filipino ang tambalang titulong 'Panginoong Diyos.'
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: magbibigay-liwanag sa kanila
  rationale: Pinananatili nito ang larawan ng Diyos bilang pinagmumulan ng liwanag at ang direksiyong ipinahihiwatig ng ἐπί, nang hindi ipinapalagay na sikat ng araw ang tinutukoy.
- source_word: βασιλεύσουσιν
  choice: maghahari sila
  rationale: Tumpak at karaniwang salin ng pandiwang nangangahulugang mamahala o maghari.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: magpakailanman
  rationale: Natural at matatag na idyomang Filipino para sa walang katapusang tagal; ipinaliliwanag sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Panahunan ng οὐκ ἔχουσιν χρείαν sa isang panghinaharap na pangitain
  choice: 'Isinalin sa hinaharap: “hindi nila kakailanganin.”'
  alternative: 'Mas pormal na kasalukuyan: “hindi nila kailangan.”'
  rationale: Maaaring maging masiglang kasalukuyan ang anyong Griyego sa paglalarawang propetiko, ngunit ang tahasang mga pandiwang panghinaharap sa talata ay nagpapakitang ang ganap na kalagayan sa hinaharap ang inilalarawan.
- issue: Paraan ng pagbibigay-liwanag ng Diyos sa φωτίσει ἐπ’ αὐτούς
  choice: “magbibigay-liwanag sa kanila”
  alternative: “liliwanagan sila” o “sisikatan sila”
  rationale: Iniiwasan ng napiling salin na ipakahulugang araw ang Diyos, habang pinananatili ang larawan na ang liwanag ay nagmumula sa Panginoong Diyos at umaabot sa kanila.
- issue: Tagal ng paghahari sa εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: “magpakailanman” bilang idyomatikong pahayag ng walang katapusang tagal
  alternative: Mas literal na “sa mga panahon ng mga panahon”
  rationale: Ang pariralang Griyego ay isang mariing idyoma ng walang katapusang tagal. Ang natural na Filipino sa pangunahing teksto ay hindi nagpapahina sa diwa, at ang literal na anyo ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilawan” sa halip na mas kolokyal na “lampara,” at pinanatiling maikli ang dalawang pangungusap upang maging madaling basahin nang hindi nawawala ang maringal na himig ng pangitain.
