    rationale: Ang «nagbubunga ng bunga nito bawat buwan» ay mas malinaw na salin ng ἀποδιδοῦν τὸν καρπὸν αὐτοῦ kaysa «nagbibigay ng bunga nito,» habang nananatiling natural sa Filipino.
