id: REV.22.2
reference: Revelation 22:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: tl
  text: Sa gitna ng lansangan nito,[a] at sa panig na ito at sa panig na iyon ng ilog, naroon ang punongkahoy ng buhay. Namumunga ito ng labindalawang bunga,[b] at nagbubunga ng bunga nito bawat buwan.[c] Ang mga dahon ng punongkahoy ay para sa pagpapagaling ng mga bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring isaling “malawak na daan” o “liwasan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “labindalawang uri ng bunga” o labindalawang ani; literal na “labindalawang bunga” ang Griyego.
    reason: lexical_alternative
  - marker: c
    text: Inaalala ng larawang ito ang punongkahoy ng buhay sa Genesis 2:9 at ang mga punong namumunga buwan-buwan sa Ezekiel 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: Sa gitna ng lansangan nito
  rationale: Pinananatili ang lokatibong diwa ng ἐν μέσῳ at ang city imagery ng πλατεία. Ang “lansangan” ay natural at marangal na katumbas ng malawak na daan o pampublikong kalye.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: sa panig na ito at sa panig na iyon
  rationale: Malapit itong sumusunod sa distributibong pananalita ng Griyego at hindi agad nilulutas ang di-pangkaraniwang heograpiya ng pangitain.
- source_word: ξύλον ζωῆς
  choice: punongkahoy ng buhay
  rationale: Bagaman maaari ring mangahulugang kahoy ang ξύλον, malinaw na punongkahoy ang tinutukoy dahil sa larawang mula sa Genesis at sa mga dahon at bunga nito.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: Namumunga ito ng labindalawang bunga
  rationale: Ang ποιοῦν kasama ng καρπούς ay tumutukoy sa pamumunga. Hindi idinagdag sa pangunahing teksto ang “uri” sapagkat hindi ito tahasang nasa Griyego.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: nagbibigay ng bunga nito bawat buwan
  rationale: Ipinahahayag nang natural ang regular at buwanang pagbibigay ng bunga habang pinananatili ang isahang τὸν καρπόν.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: para sa pagpapagaling sa mga bansa
  rationale: Pinananatili ng “para sa” ang layuning ipinahahayag ng εἰς, ng “pagpapagaling” ang θεραπεία, at ng “mga bansa” ang malawak na saklaw ng ἔθνη.
theological_decisions:
- issue: Ang masikip at di-pangkaraniwang paglalarawan sa kinalalagyan ng punongkahoy kaugnay ng lansangan at ilog
  choice: Pinanatili ang isahang “punongkahoy ng buhay” at ang literal na “sa panig na ito at sa panig na iyon,” nang hindi ipinapaliwanag kung paano sumasaklaw ang isang punongkahoy sa dalawang panig.
  alternative: Gawing “mga punongkahoy ng buhay” o ayusin bilang “sa magkabilang panig ng ilog” upang gawing mas payak ang heograpiya.
  rationale: Isahan ang ξύλον sa tekstong Griyego, at mahalaga ang ugnayan nito sa kilalang punongkahoy ng buhay. Ang apokaliptikong larawan ay sadyang hindi dapat tahimik na gawing mas tiyak kaysa sa pinagmulan.
- issue: Ang kahulugan ng “labindalawang bunga”
  choice: Pinanatili sa teksto ang “labindalawang bunga.”
  alternative: “Labindalawang uri ng bunga” o “labindalawang ani.”
  rationale: Hindi tahasang sinasabi ng Griyego ang “mga uri.” Hinahayaan ng literal na anyo na manatili ang posibilidad ng labindalawang uri, ani, o ganap na siklo ng pamumunga.
- issue: Ang “pagpapagaling” ng mga bansa sa ganap na bagong paglikha
  choice: Isinalin nang tuwiran bilang “pagpapagaling sa mga bansa.”
  alternative: “Kalusugan ng mga bansa” o “pagpapanumbalik sa mga bansa.”
  rationale: Hindi nilulutas ng salin kung ang θεραπεία ay tumutukoy sa literal na pagpapagaling, ganap na kalusugan, o simbolikong pagpapanumbalik.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lansangan” at “punongkahoy” bilang karaniwang salitang biblikal na nauunawaan pa rin ng mga modernong mambabasa. Sadyang pinanatili ang masikip na sintaks at kakaibang heograpiya ng pangitain, ngunit hinati sa maiikling pangungusap upang maging madaling basahin.
