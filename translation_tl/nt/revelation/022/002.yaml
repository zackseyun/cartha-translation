revisions:
- from: Sa gitna ng lansangan nito,[a] at sa panig na ito at sa panig na iyon ng ilog, naroon ang punongkahoy ng buhay. Namumunga ito ng labindalawang bunga,[b] at nagbibigay ng bunga nito bawat buwan.[c] Ang mga dahon ng punongkahoy ay para sa pagpapagaling sa mga bansa.
  to: Sa gitna ng lansangan nito,[a] at sa panig na ito at sa panig na iyon ng ilog, naroon ang punongkahoy ng buhay. Namumunga ito ng labindalawang bunga,[b] at nagbubunga ng bunga nito bawat buwan.[c] Ang mga dahon ng punongkahoy ay para sa pagpapagaling ng mga bansa.
  rationale: Dalawang maliit at ligtas na pagbabago lamang ang ginawa. Pinalitan ang «sa mga bansa» ng «ng mga bansa» upang malinaw na maipahayag ang genitibong τῶν ἐθνῶν. Pinalitan ang «nagbibigay» ng «nagbubunga» upang higit na tumugma sa larawang agrikultural ng ἀποδιδοῦν τὸν καρπὸν αὐτοῦ. Pinanatili ang isahang punongkahoy, ang siksik na paglalarawang panglugar, at ang hindi tinutukoy na «labindalawang bunga.»
