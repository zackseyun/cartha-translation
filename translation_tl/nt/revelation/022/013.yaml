id: REV.22.13
reference: Revelation 22:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: tl
  text: “Ako ang Alfa at ang Omega, ang Una at ang Huli, ang Simula at ang Wakas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Ako
  rationale: Pinananatili ang hayag at may-diin na panghalip sa taimtim na pagpapakilala sa sarili.
- source_word: τὸ Ἄλφα
  choice: ang Alfa
  rationale: Pinananatili ang pangalan ng unang titik ng alpabetong Griyego bilang kinikilalang simbolikong titulo sa Pahayag.
- source_word: τὸ Ὦ
  choice: ang Omega
  rationale: Pinananatili ang pangalan ng huling titik ng alpabetong Griyego at ang nakaugaliang katambal ng Alfa.
- source_word: ὁ πρῶτος
  choice: ang Una
  rationale: Tuwirang salin ng pang-uring ginamit bilang titulo at natural na katambal ng 'ang Huli.'
- source_word: ὁ ἔσχατος
  choice: ang Huli
  rationale: Tuwirang katumbas na nagpapanatili sa balanseng pares ng mga titulo.
- source_word: ἡ ἀρχὴ
  choice: ang Simula
  rationale: Pinananatili ang pangunahing diwa at ang malinaw na paralelismo sa 'ang Wakas.'
- source_word: τὸ τέλος
  choice: ang Wakas
  rationale: Natural at marangal na katambal ng 'ang Simula'; maaari ring taglayin ng salitang Griyego ang diwa ng hantungan, ngunit hindi iyon tahasang nililinaw sa teksto.
theological_decisions:
- issue: Paglalahad sa tatlong magkakatumbas na pares ng mga titulo nang hindi labis na ipinapaliwanag ang metapisikal na saklaw ng mga ito
  choice: Ako ang Alfa at ang Omega, ang Una at ang Huli, ang Simula at ang Wakas.
  alternative: Ako ang Alfa at ang Omega, ang Una at ang Huli, ang Pinagmulan at ang Hantungan.
  rationale: Pinananatili ng salin ang maigsi at balanseng ayos ng Griyego at hinahayaang manatili ang malawak na pahayag ng teksto. Ang 'Pinagmulan' at 'Hantungan' ay posibleng mga semantikong pagbasa sa ἀρχή at τέλος, ngunit higit na natural sa magkapares na pahayag dito ang 'Simula' at 'Wakas.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang malalaking titik sa Una, Huli, Simula, at Wakas upang ipakitang magkakaugnay na mga titulo ang mga ito, gaya ng Alfa at Omega.
