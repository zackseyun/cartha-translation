id: REV.22.16
reference: Revelation 22:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: tl
  text: Ako, si Jesus, ay nagsugo ng aking anghel upang magpatotoo sa inyo tungkol sa mga bagay na ito para sa mga iglesya.[a] Ako ang ugat at ang inapo ni David,[b] ang maningning na tala sa umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga iglesya” o “tungkol sa mga iglesya.” Ang pariralang Griyego na ἐπὶ ταῖς ἐκκλησίαις ay maaaring magkaroon ng higit sa isang kahulugan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang ugat at ang supling ni David.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Ako, si Jesus,
  rationale: Pinananatili ng tahasang “Ako” ang diin ng panghalip, at likas sa modernong Tagalog ang pariralang panuring na “si Jesus.” Hindi idinagdag ang “ay,” sapagkat ang pandiwang ἔπεμψα ang panaguri ng unang pangungusap.
- source_word: ἔπεμψα
  choice: ang nagsugo
  rationale: Ang “nagsugo” ay angkop sa pagpapadala na may atas o layunin. Sa konstruksyong “Ako… ang nagsugo,” malinaw ang natapos na pagkilos at ang patuloy nitong kabuluhan sa konteksto.
- source_word: τὸν ἄγγελόν μου
  choice: sa aking anghel
  rationale: Sa kontekstong apokaliptiko ng Pahayag, ang ἄγγελος ay pinakamalamang na isang makalangit na anghel, hindi lamang taong mensahero.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: upang patotohanan sa inyo ang mga bagay na ito
  rationale: Ipinahahayag ng “upang” ang layunin ng pagsusugo. Pinananatili ng “patotohanan” ang diwang pagsaksi at ang “mga bagay na ito” bilang tuwirang layon ng pandiwa.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: para sa mga iglesya
  rationale: Likas na ipinahihiwatig nito na ang patotoo ay inilaan para sa mga iglesya, habang inilalagay sa talababa ang iba pang posibleng nuances ng nababaluktot na pariralang Griyego.
- source_word: ἡ ῥίζα
  choice: ang ugat
  rationale: Literal at malinaw na pinananatili ang larawang pinagmulan o ugat sa mesiyanikong titulo.
- source_word: τὸ γένος Δαυίδ
  choice: ang inapo ni David
  rationale: Sa pang-isahang pagtukoy kay Jesus, natural at malinaw ang “inapo” para sa γένος bilang nagmula sa angkan ni David.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: ang maningning na tala sa umaga
  rationale: 'Pinagsasama sa likas na Tagalog ang magkakaugnay na paglalarawan: tala, maningning, at nauukol sa umaga. Nananatiling buhay at literal ang titulo.'
theological_decisions:
- issue: Mesiyanikong pagkakakilanlan kaugnay ni David
  choice: “ang ugat at ang inapo ni David”
  alternative: “ang pinagmulan at ang supling ni David”
  rationale: Pinananatili ng salin ang tensiyong si Jesus ay kapuwa “ugat” at “inapo” ni David, nang hindi ipinapaliwanag o nilulutas ang paradoksong nasa teksto.
- issue: Kristolohikal na titulong “tala sa umaga”
  choice: “ang maningning na tala sa umaga”
  alternative: “ang maliwanag na tala sa umaga”
  rationale: Pinananatili ito bilang tuwirang pagtukoy ni Jesus sa kanyang sarili, nang walang idinadagdag na paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iglesya,” “anghel,” at “patotohanan” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
