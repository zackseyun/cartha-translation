  source_fidelity: 'Tumpak ang "makikita nila ang kanyang mukha," na maayos na nagsasalin sa future na ὄψονται, sa πρόσωπον bilang "mukha," at sa di-tinukoy na αὐτοῦ bilang "kanyang." Gayunman, ang "mapapasakanilang mga noo" ay hindi ligtas na katumbas ng ἐπὶ τῶν μετώπων αὐτῶν: ang mapasa/mapapasakanila ay karaniwang nagpapahiwatig na mapupunta o magiging pag-aari nila, hindi simpleng lokasyong "nasa kanilang mga noo."'
