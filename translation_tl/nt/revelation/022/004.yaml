  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: tl
  text: At makikita nila ang kanyang mukha[a][b], at ang kanyang pangalan ay nasa kanilang mga noo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamasdan nila ang kanyang mukha.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga panghalip na isahang “kanyang” ay maaaring tumukoy sa Diyos, o maaaring masalamin ng mga ito ang magkasamang banal na paghahari ng Diyos at ng Kordero sa agarang konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: makikita nila
  rationale: Ang future middle indicative ng ὁράω ay may payak na diwang panghinaharap dito. Likas at malinaw sa modernong Tagalog ang “makikita nila”; maaari ring “mamasdan nila,” ngunit mas mataas ang rehistro nito.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: ang kanyang mukha
  rationale: Pangunahing kahulugan ng πρόσωπον ang “mukha.” Pinananatili ng “kanyang” ang panghalip ng Griyego nang hindi tinutukoy nang mas makitid kung sino ang tinutukoy nito.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: ang kanyang pangalan
  rationale: Tuwirang katumbas ng ὄνομα ang “pangalan.” Hindi idinagdag sa salin ang mga posibleng pahiwatig na pagkakakilanlan, pagmamay-ari, o katangian.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: mapapasakanilang mga noo
  rationale: Ipinapahayag nito na ang pangalan ay nasa ibabaw ng kanilang mga noo. Ang “mapapasakanilang mga noo” ay marangal at likas sa estilong biblikal na Tagalog at pinananatili ang maramihang anyo.
- source_word: καὶ … καὶ
  choice: At … at
  rationale: Pinananatili ang payak at magkaugnay na estruktura ng dalawang καὶ sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ (“kanyang”) sa “kanyang mukha” at “kanyang pangalan”
  choice: Panatilihin ang panghalip na “kanyang” nang hindi tahasang pinapangalanan ang tinutukoy.
  alternative: Tukuyin ito bilang Diyos; o unawain kaugnay ng magkasamang paghahari ng Diyos at ng Kordero sa agarang konteksto.
  rationale: Magkalapit na binabanggit sa konteksto ang Diyos at ang Kordero (lalo na sa Pahayag 22:3). Hindi nililinaw ng mga panghalip na isahan sa talata ang tinutukoy nang higit sa ibinibigay ng konteksto, kaya pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “makikita” sa halip na mas mataas na “mamasdan” sa pangunahing teksto; pinanatili naman ang maikli at bahagyang biblikal na “mapapasakanilang mga noo” upang maipahayag nang natural ang lokasyon ng pangalan.
