  to: At ang Espiritu at ang nobya ay nagsasabi, “Halika.”[b] At ang nakikinig ay magsabi rin, “Halika.” Ang nauuhaw ay lumapit; ang nagnanais ay kumuha ng tubig ng buhay nang walang bayad.[a]
