  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: tl
  text: At ang Espiritu at ang nobya ay nagsasabi, “Halika.”[b] At ang nakikinig ay magsabi rin, “Halika.” Ang nauuhaw ay lumapit; ang nagnanais ay kumuha ng tubig ng buhay nang walang bayad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang libre” o “bilang kaloob.”
    reason: lexical_alternative
  - marker: b
    text: Karaniwang inuunawa ang unang dalawang panawagang “Halika” bilang panawagan na pumarito ang Panginoon; pagkatapos ay inaanyayahang lumapit ang nauuhaw at kumuha ng tubig ng buhay. Hindi tahasang tinutukoy ng Griyego kung sino ang kinakausap sa unang dalawang panawagan.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ang Espiritu
  rationale: Sa konteksto ng Pahayag, pinakamalamang na tumutukoy ito sa Banal na Espiritu; sapat ang “Espiritu” upang mapanatili ang anyo ng Griyego nang hindi nagdaragdag ng salitang “Banal.”
- source_word: ἡ νύμφη
  choice: ang babaeng ikakasal
  rationale: Pinananatili nito ang larawang pangkasal ng νύμφη at nauunawaan sa makabagong Filipino, nang hindi tahasang ipinapakahulugan bilang iglesya, bayan ng Diyos, o bagong Jerusalem.
- source_word: λέγουσιν
  choice: ay nagsasabi
  rationale: Ang pangkasalukuyang pandiwa ay nagpapahayag ng buhay at nagpapatuloy na panawagan.
- source_word: Ἔρχου
  choice: Halika
  rationale: Tuwirang ikalawang panauhang pautos; hindi tinutukoy sa salin kung sino ang kinakausap, gaya ng Griyego.
- source_word: ὁ ἀκούων
  choice: ang nakikinig
  rationale: Likas at pangkalahatang salin ng articular present participle; maaari itong tumukoy sa sinumang nakaririnig at tumutugon.
- source_word: εἰπάτω
  choice: sabihin din
  rationale: Ipinapahayag ang ikatlong panauhang pautos sa likas na Filipino; ang “din” ay malinaw na nag-uugnay sa naunang panawagan.
- source_word: ὁ διψῶν
  choice: ang nauuhaw
  rationale: Pinananatili ang metapora ng uhaw at ang pangkalahatang pagtukoy sa taong nangangailangan.
- source_word: ἐρχέσθω
  choice: lumapit
  rationale: Sa paanyayang tumanggap ng tubig, mas likas sa Filipino ang “lumapit” kaysa ulitin ang “halika,” habang pinananatili ang diwa ng pagparito.
- source_word: ὁ θέλων
  choice: ang nagnanais
  rationale: Tuwirang ipinapahayag ang pagnanais o pagkukusa nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: λαβέτω
  choice: ay kumuha
  rationale: Pinananatili ang aktibong larawan ng pagkuha at ang pautos na anyo; posible rin ang “tumanggap,” ngunit mas tuwiran ang “kumuha.”
- source_word: ὕδωρ ζωῆς
  choice: tubig ng buhay
  rationale: Tuwirang pinananatili ang genitive construction at ang pamilyar na larawang Juaniko, sa halip na gawing “tubig na nagbibigay-buhay.”
- source_word: δωρεάν
  choice: nang walang bayad
  rationale: Malinaw sa ordinaryong mambabasa na ang tubig ng buhay ay ibinibigay nang libre o walang kapalit na halaga.
theological_decisions:
- issue: Pagkakakilanlan ng kinakausap sa dalawang “Halika”
  choice: Hindi tahasang pinangalanan ang kinakausap; pinananatiling bukas ang dalawang unang panawagan bago ang paanyaya sa nauuhaw.
  alternative: Ipaliwanag sa pangunahing teksto na ang “Halika” ay para sa Panginoon, o ituring ang lahat ng panawagan bilang paanyaya sa nauuhaw.
  rationale: Walang tahasang layon ang Ἔρχου sa Griyego. Maaaring ang unang dalawa ay panawagan sa Panginoon at saka nagbabago ang direksiyon tungo sa nauuhaw; hindi dapat lutasin ng salin ang sinadyang tensiyong ito.
- issue: Simbolikong tinutukoy ng “babaeng ikakasal”
  choice: Panatilihin ang simbolikong larawang pangkasal nang walang paliwanag sa pangunahing teksto.
  alternative: Isalin bilang “iglesya,” “bayan ng Diyos,” o “bagong Jerusalem.”
  rationale: Pinagsasama ng Pahayag ang mga ugnayang ito, ngunit νύμφη mismo ang nakasulat; ang interpretatibong pagpapalit ay magpapakitid sa larawan.
- issue: Lakas ng paanyaya sa nauuhaw at nagnanais
  choice: Gumamit ng mga anyong pautos na likas ding mabasa bilang bukas na paanyaya.
  alternative: Gawing mahigpit na obligasyon gamit ang “dapat.”
  rationale: Ang mga ikatlong panauhang imperative ay may tunay na puwersang pautos, ngunit sa konteksto ay mapagbigay na paanyaya ang diin, hindi sapilitang obligasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maiikling panawagan at ang simbolikong wika ng talata. Ginamit ang “babaeng ikakasal” sa halip na mas lumang “nobya” o interpretatibong “iglesya.”
