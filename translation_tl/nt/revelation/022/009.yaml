  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: tl
  text: At sinabi niya sa akin, “Huwag mong gawin iyan![a] Kapwa mong alipin ako, kasama mo at ng iyong mga kapatid na propeta at ng mga tumutupad sa mga salita ng aklat na ito. Ang Diyos ang sambahin mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyego ay maikli at literal na “Tingnan mong huwag”; ang diwa ay “Huwag mong gawin iyan,” na tumutukoy sa pagtatangka ni Juan na sumamba sa anghel. Ihambing sa Pahayag 19:10.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Huwag mong gawin iyan!
  rationale: Ang maikli at idyomatikong pagbabawal sa Griyego ay tumutukoy sa pagtatangka ni Juan na sumamba sa anghel. Likas sa modernong Tagalog ang tahasang pagbanggit sa ipinagbabawal na kilos sa pamamagitan ng “iyan.”
- source_word: σύνδουλός σού εἰμι
  choice: Ako ay kapwa mo alipin
  rationale: Ipinahihiwatig ng σύνδουλος ang magkapantay na kalagayan bilang mga alipin sa ilalim ng iisang panginoon. Pinananatili ng “kapwa mo alipin” ang diin na ang anghel ay nasa ilalim din ng Diyos at hindi dapat sambahin.
- source_word: τῶν ἀδελφῶν σου τῶν προφητῶν
  choice: mga kapatid mong propeta
  rationale: Ang “mga propeta” ay nagpapakilala sa tinutukoy na “mga kapatid.” Ang anyong ito ay tuwiran, maikli, at likas sa Tagalog nang hindi pinalalawak ang kasarian o saklaw na hindi tahasang binanggit.
- source_word: τηρούντων
  choice: tumutupad
  rationale: Sa kaugnayan nito sa “mga salita,” saklaw ng τηρέω ang tapat na pag-iingat at pagsunod. Mas likas sa Tagalog ang “tumutupad” at naipapahayag nito ang aktibong pagsunod nang hindi ginagawang simpleng pakikinig lamang.
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: mga salita ng aklat na ito
  rationale: Tuwirang pinananatili ng “mga salita” ang maramihang λόγους at ang diksyong inuulit sa Pahayag; ang “aklat” ay malinaw at karaniwang katumbas ng βιβλίον sa kontekstong ito.
- source_word: τῷ θεῷ προσκύνησον
  choice: Ang Diyos ang sambahin mo
  rationale: 'Ipinakikita ng ayos na ito ang eksklusibong diin ng Griyego: ang Diyos, hindi ang anghel, ang nararapat sambahin. Ang “sambahin” ay angkop sa konteksto ng pagsambang panrelihiyon.'
theological_decisions:
- issue: Paglalarawan sa σύνδουλος
  choice: kapwa mo alipin
  alternative: kapwa mo lingkod
  rationale: Mahalaga sa pangangatwiran ng anghel ang magkapareho nilang pagpapailalim sa Diyos. Mas malinaw na pinananatili ng “alipin” ang kalagayang ipinahihiwatig ng σύνδουλος, samantalang maaaring palabuin iyon ng mas banayad na “lingkod.”
- issue: Pagpuno sa ipinahihiwatig na kilos sa Ὅρα μή
  choice: Huwag mong gawin iyan!
  alternative: Huwag!
  rationale: Elliptical ang Griyego, ngunit malinaw sa salaysay na ang tinutukoy ay ang pagtatangkang sumamba sa anghel. Nililinaw ito ng salin nang hindi dinaragdagan ang teolohikal na diwa.
- issue: Diin sa τῷ θεῷ προσκύνησον
  choice: Ang Diyos ang sambahin mo
  alternative: Sambahin mo ang Diyos
  rationale: Parehong tama ang dalawang anyo, ngunit mas malinaw na ipinapakita ng piniling ayos ang kaibahan sa pagitan ng maling pagsamba sa anghel at ng wastong pagsamba sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kapwa mo alipin” upang mapanatili ang lakas ng σύνδουλος, at “tumutupad” bilang likas na katumbas ng tapat na pag-iingat at pagsunod sa mga salita ng aklat.
