  to: At sinabi niya sa akin, “Huwag mong gawin iyan![a] Kapwa mong alipin ako, kasama mo at ng iyong mga kapatid na propeta at ng mga tumutupad sa mga salita ng aklat na ito. Ang Diyos ang sambahin mo.”
