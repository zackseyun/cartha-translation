id: REV.22.15
reference: Revelation 22:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: tl
  text: Nasa labas ang mga aso[a], ang mga mangkukulam, ang mga namumuhay sa seksuwal na imoralidad, ang mga mamamatay-tao, ang mga sumasamba sa diyus-diyosan, at ang bawat umiibig sa kabulaanan at gumagawa nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na metaporikal dito ang “mga aso”—isang katawagan para sa mga itinatakwil at itinuturing na marumi sa asal; mas tiyak ang pakahulugan dito ng ilang tagapagpaliwanag.
    reason: cultural_note
  - marker: b
    text: O “ang bawat umiibig at gumagawa ng isang kasinungalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: Nasa labas
  rationale: Pinananatili ang mariing paglalagay ng ἔξω sa unahan at ipinahihiwatig ang pagkakait sa pagpasok sa lungsod ayon sa konteksto.
- source_word: κύνες
  choice: ang mga aso
  rationale: Pinananatili ang konkretong larawan ng orihinal sa halip na ipasok sa teksto ang isa sa mga pinagtatalunang tiyak na pakahulugan nito.
- source_word: φάρμακοι
  choice: ang mga mangkukulam
  rationale: Sa konteksto ng Pahayag, tumutukoy ito sa mga nagsasagawa ng pangkukulam o mahika, hindi sa mga parmasyutiko sa makabagong kahulugan.
- source_word: πόρνοι
  choice: ang mga gumagawa ng seksuwal na imoralidad
  rationale: Malinaw at malawak na salin para sa mga taong nagsasagawa ng ipinagbabawal na gawaing seksuwal; iniiwasan nitong paliitin ang kahulugan sa iisang uri lamang ng kasalanan.
- source_word: φονεῖς
  choice: ang mga mamamatay-tao
  rationale: Tuwiran at karaniwang salin para sa mga pumapatay nang labag sa matuwid.
- source_word: εἰδωλολάτραι
  choice: ang mga sumasamba sa mga diyos-diyosan
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na katawagang “mga idolatro,” habang pinananatili ang diwa ng pagsamba sa mga diyus-diyosan.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: ang bawat umiibig sa kasinungalingan at gumagawa nito
  rationale: Likas na isinasalin ang πᾶς na may mga participle bilang “ang bawat” gumagawa ng mga ito. Ipinahihiwatig ng “umiibig” at “gumagawa” ang palagian o kinagawiang pagkiling at pamumuhay.
- source_word: ψεῦδος
  choice: kasinungalingan
  rationale: Maaaring tumukoy sa isang kasinungalingan o sa kabulaanan sa pangkalahatan. Ang “kasinungalingan” ay likas sa Filipino at maaaring saklawin ang kapuwa maling pananalita at mas malawak na pagkiling sa huwad.
theological_decisions:
- issue: Kung ang “mga aso” ay dapat ipaliwanag sa pangunahing teksto bilang isang tiyak na pangkat sa halip na isalin nang literal.
  choice: Panatilihin ang “mga aso” sa pangunahing teksto.
  alternative: mga marurumi; mga taong kahiya-hiya; isang mas tiyak na pangkat ng mga taong itinatakwil
  rationale: Ang κύνες ay isang matingkad at malamang na metaporikal na larawan. Hindi tiyak ang eksaktong tinutukoy nito, kaya hindi dapat ipasok sa pangunahing teksto ang isang pinagtatalunang interpretasyon.
- issue: Kung ang ψεῦδος ay tumutukoy sa “isang kasinungalingan” o sa kasinungalingan/kabulaanan bilang mas malawak na moral na kategorya.
  choice: Gamitin ang mas malawak na “kasinungalingan.”
  alternative: isang kasinungalingan
  rationale: Ang pagkakaugnay nito sa “umiibig” at “gumagawa” ay maaaring maglarawan ng matatag na pagkiling at kinagawiang asal, hindi lamang ng isang nakahiwalay na pagsisinungaling. Gayunman, pinananatili sa talababa ang mas tiyak na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang anyo ng talaan at ang matinding simbolikong larawang “mga aso,” habang gumagamit ng mga pariralang madaling maunawaan tulad ng “gumagawa ng seksuwal na imoralidad” at “sumasamba sa mga diyos-diyosan.”
