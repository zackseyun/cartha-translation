  source_fidelity: Tumpak ang talaan, ang mariing panimulang “Nasa labas,” at ang literal na “mga aso.” Naipapahayag din ng salin ang malawak na saklaw ng φάρμακοι, πόρνοι, at ψεῦδος nang hindi ipinapasok ang pinagtatalunang pagpapakahulugan sa pangunahing teksto.
  naturalness: Hindi gaanong likas sa makabagong Filipino ang “mga gumagawa ng seksuwal na imoralidad.” Mas malinaw at mas natural ang “mga namumuhay sa seksuwal na imoralidad,” na pinananatili ang pangkalahatan at kinagawiang aspekto ng talaan. Ang “kabulaanan” ay mas angkop ding pangkalahatang katumbas ng ψεῦδος sa pariralang “umiibig sa ... at gumagawa nito.”
  terminology: Pinananatili ang “mga aso” bilang metaporang hindi nililinaw sa teksto, “mga mangkukulam” para sa φάρμακοι, at “mga sumasamba sa diyus-diyosan” para sa εἰδωλολάτραι. Ginamit ang karaniwang baybay na “diyus-diyosan.”
