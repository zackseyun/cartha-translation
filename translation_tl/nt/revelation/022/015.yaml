- from: Nasa labas ang mga aso[a], ang mga mangkukulam, ang mga gumagawa ng seksuwal na imoralidad, ang mga mamamatay-tao, ang mga sumasamba sa mga diyos-diyosan, at ang bawat umiibig sa kasinungalingan at gumagawa nito.[b]
  to: Nasa labas ang mga aso[a], ang mga mangkukulam, ang mga namumuhay sa seksuwal na imoralidad, ang mga mamamatay-tao, ang mga sumasamba sa diyus-diyosan, at ang bawat umiibig sa kabulaanan at gumagawa nito.[b]
  rationale: Pinalitan ang di-idiomatikong paglalarawan ng seksuwal na imoralidad ng natural na Filipino na hindi nagpapakitid sa saklaw ng Griyego. Pinalitan ang “kasinungalingan” ng “kabulaanan” upang maipahayag ang mas malawak na ψεῦδος, at pinanatili ang alternatibong “isang kasinungalingan” sa talababa. Walang binagong kahulugan sa talaan o sa metaporang “mga aso.”
