  source_fidelity: 'Tumpak ang pangunahing nilalaman: ang μαρτυρῶ ay naisalin bilang pagpapatotoo, ang pandiwang ‘magdagdag … idaragdag’ ay nagpapanatili ng sinadyang pagtutumbas, at ang mga πληγαί ay wastong ‘mga salot.’ Gayunman, ang ‘mga salita ng propesiya sa aklat na ito’ ay maaaring mangahulugang ang propesiya ay nasa aklat, samantalang ang Griyego ay mas tiyak: ‘ang propesiya ng aklat na ito.’'
