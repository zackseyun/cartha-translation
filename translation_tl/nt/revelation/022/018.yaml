id: REV.22.18
reference: Revelation 22:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: tl
  text: 'Pinatototohanan ko sa bawat nakikinig sa mga salita ng propesiya ng aklat na ito[a]: kung may magdagdag sa mga ito, idaragdag ng Diyos sa kanya ang mga salot na nakasulat sa aklat na ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balumbon” sa halip na “aklat”; maaaring tumukoy ang βιβλίον sa sinaunang pisikal na anyo ng sulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Pinatototohanan ko
  rationale: Pinananatili nito ang solemneng wika ng pagpapatotoo; hindi ito nililimitahan sa pangkalahatang diwa ng pagbababala.
- source_word: παντὶ τῷ ἀκούοντι
  choice: sa bawat nakikinig
  rationale: Likas na Tagalog ito at naipapahayag ang kasalukuyan at tumatanggap na kilos ng pakikinig.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: sa mga salita ng propesiya
  rationale: Ang “mga salita” ay tuwirang tumutukoy sa nilalamang pasalita o nasusulat, samantalang pinananatili ng “propesiya” ang uri ng pahayag.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: sa aklat na ito
  rationale: Ang “aklat” ang natural na modernong katumbas ng βιβλίον at pare-pareho itong ginamit sa dalawang paglitaw.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: kung may magdagdag sa mga ito
  rationale: Malinaw at idiomatikong ipinapahayag nito ang pagdaragdag sa mga salita ng propesiya.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: idaragdag ng Diyos sa kanya
  rationale: 'Inuulit ang pandiwang “dagdag” upang mapanatili ang sinadyang pagtutumbas ng Griyego: ang nagdaragdag ay dadagdagan ng Diyos.'
- source_word: τὰς πληγὰς τὰς γεγραμμένας
  choice: ang mga salot na nakasulat
  rationale: Ang “mga salot” ay umaangkop sa paulit-ulit na paggamit ng πληγή para sa mga hatol sa Pahayag; ang “nakasulat” ay nagpapahiwatig ng nananatiling nakatalang kalagayan.
theological_decisions:
- issue: Pagpapatotoo o tahasang pagbababala sa pambungad
  choice: Pinatototohanan ko
  alternative: Binabalaan ko
  rationale: Ang μαρτυρέω ay wika ng pagpapatotoo. Hayaan ang babalang diwa na lumitaw mula sa kasunod na kondisyong hatol sa halip na ipalit iyon sa kahulugan ng pandiwa.
- issue: Pagpapanatili ng retorikal na pagtutumbas ng ἐπιτίθημι
  choice: magdagdag … idaragdag
  alternative: magdagdag … ipapataw
  rationale: Pinananatili ng magkatugmang pandiwa ang ugnayang sinadya ng teksto nang hindi inaalis ang bigat ng hatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pinatototohanan” upang mapanatili ang solemneng witness-language, at ang “aklat” para sa natural na pagbasa; inilagay sa talababa ang “balumbon” bilang makasaysayang alternatibo.
