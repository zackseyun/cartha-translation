  text: The grace of the Lord Jesus be with all[a].
translation:
  language: tl
  text: Sumainyong lahat ang biyaya ng Panginoong Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Sumainawa sa lahat ng mga banal ang biyaya ng Panginoong Jesus”; sa iba naman: “Sumainawa sa inyo, kayong lahat, ang biyaya ng Panginoong Jesus.”'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin sa Bagong Tipan na angkop sa pangwakas na basbas at nagpapanatili ng ugnayan at teolohikal na lalim ng salita.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas at kinikilalang salin ng titulong kristolohikal na κύριος sa makabagong Tagalog.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Isinasalin sa kinagawiang anyo ng personal na pangalan sa Tagalog.
- source_word: μετὰ
  choice: sumainyo
  rationale: Ang Griyego ay walang tahasang pandiwa; ang pormulang “sumainyo” ay natural na Tagalog para sa basbas at maingat na ipinahihiwatig ang ‘mapasainyo/makasama ninyo.’
- source_word: πάντων
  choice: lahat
  rationale: Pinananatili ang malawak at hindi tinukoy na saklaw ng πάντων, nang hindi idinaragdag sa pangunahing teksto ang “mga banal.”
theological_decisions:
- issue: Kung tutukuyin ang ipinahihiwatig na tatanggap ng pangwakas na basbas
  choice: “Sumainyong lahat”
  alternative: “Sumainyo nawang lahat” / “Sumainyong lahat na mga banal”
  rationale: Ang SBLGNT ay nagtatapos sa πάντων, ‘lahat,’ nang walang tahasang pangngalan. Ginagawang natural ng “inyong lahat” ang pahayag sa Tagalog habang hindi ipinapasok ang tekstuwal na variant na “mga banal.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tradisyonal ngunit buhay pa ring pormulang pambasbas na “sumainyo,” na angkop sa pangwakas na talata ng aklat.
