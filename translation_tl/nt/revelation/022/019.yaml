  source_fidelity: 'Tumpak ang pangunahing salin: naipapahayag nito ang kondisyon ng ἐάν τις, ang pag-aalis mula sa mga salita ng propesiya, ang katumbas na pagkilos ng Diyos, at ang SBLGNT na pagbasa na “punongkahoy ng buhay.” Ang “bahagi” ay wastong hindi labis na nagpapakahulugan sa μέρος. Ang pangmaramihang τῶν γεγραμμένων ay tumutukoy sa punongkahoy at banal na lungsod.'
  naturalness: Marangal at likas sa modernong Filipino ang kabuuan. Gayunman, ang em-dash na “—mga bagay na nakasulat...” ay medyo putol at hindi gaanong malinaw na inuugnay ang huling parirala sa kapwa naunang pangngalan. Ang “na parehong nakasulat” ay mas malinaw at mas maayos sa daloy.
