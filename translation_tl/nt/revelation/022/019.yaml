id: REV.22.19
reference: Revelation 22:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: tl
  text: At kung may mag-aalis ng anuman sa mga salita ng aklat ng propesiyang ito, aalisin ng Diyos ang bahagi niya sa punongkahoy ng buhay[a] at sa banal na lungsod, na parehong nakasulat sa aklat na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “aklat ng buhay” ang mababasa sa halip na “punongkahoy ng buhay.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: mag-aalis / aalisin
  rationale: 'Pinananatili ang sinadyang pag-uulit at pagtutumbas ng kilos: ang mag-aalis sa mga salita ay aalisan ng Diyos. Ang pariralang “ng anuman” ay likas na ipinahihiwatig ng partitibong ἀπὸ τῶν λόγων.'
- source_word: λόγων
  choice: mga salita
  rationale: Tumutukoy sa mismong nilalamang pasalita o nakasulat ng propesiya at angkop sa babala laban sa pagbabawas dito.
- source_word: βιβλίου
  choice: aklat
  rationale: Karaniwan, malinaw, at marangal na katumbas sa modernong Filipino; hindi kailangang tukuying “balumbon” sa kontekstong ito.
- source_word: προφητείας
  choice: propesiya
  rationale: Pinananatili ang katawagan sa uri at mensahe ng aklat nang walang dagdag na pagpapakahulugan.
- source_word: μέρος
  choice: bahagi
  rationale: Maaaring tumukoy sa bahagi, karapatan, o pakikibahagi; ang “bahagi” ay tuwiran at hindi labis na nagpapasiya sa eksaktong teolohikal na diwa.
- source_word: ξύλου τῆς ζωῆς
  choice: punongkahoy ng buhay
  rationale: Ito ang malinaw na kahulugan sa konteksto at umaayon sa larawan sa Pahayag 22:2, 14.
- source_word: πόλεως τῆς ἁγίας
  choice: banal na lungsod
  rationale: Likas na Filipino at pinananatili ang tiyak at apokaliptikong katawagan.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: mga bagay na nakasulat sa aklat na ito
  rationale: Ang pangmaramihang parirala ay pinakamalamang na tumutukoy kapwa sa punongkahoy ng buhay at sa banal na lungsod. Ang gitling ay nagpapalinaw sa ugnayan nang hindi binabago ang saklaw nito.
theological_decisions:
- issue: Pagkakaiba ng tekstong “punongkahoy ng buhay” at “aklat ng buhay”
  choice: punongkahoy ng buhay
  alternative: aklat ng buhay
  rationale: Ang ibinigay na SBLGNT ay may ξύλου τῆς ζωῆς (“punongkahoy ng buhay”), na sinusuportahan ng mga kritikal na edisyon at angkop sa agarang konteksto. Inilalagay sa talababa ang kilalang ibang pagbasa.
- issue: Diwa ng μέρος bilang pakikibahagi o mana
  choice: bahagi
  alternative: karapatan / mana
  rationale: Hindi tahasang nililinaw ng Griyego kung “karapatan,” “mana,” o pakikibahagi ang eksaktong diin. Pinananatili ng “bahagi” ang tunay na lawak at tensiyong teolohikal ng pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “At kung” upang mapanatili ang ugnayan sa naunang talata, at ang simetrikong “mag-aalis / aalisin” upang marinig ang retorikal na pagganti sa Griyego.
