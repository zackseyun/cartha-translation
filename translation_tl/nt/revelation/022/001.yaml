id: REV.22.1
reference: Revelation 22:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: tl
  text: At ipinakita niya sa akin ang isang ilog ng tubig ng buhay, maningning na gaya ng kristal[a], na umaagos[b] mula sa trono ng Diyos at ng Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, kasingningning ng kristal.
    reason: lexical_alternative
  - marker: b
    text: O, na nagmumula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: ipinakita niya sa akin
  rationale: Tuwirang ipinahahayag ang aorist na pandiwa at ang di-tuwirang layon, habang pinananatili ang tagpo ng pangitain nang walang dagdag na pakahulugan.
- source_word: ποταμὸν
  choice: isang ilog
  rationale: Walang pantukoy ang pangngalan sa Griyego; natural sa Tagalog ang “isang ilog” sa unang pagbanggit, at mas angkop ang “ilog” kaysa “batis.”
- source_word: ὕδατος ζωῆς
  choice: tubig ng buhay
  rationale: Pinananatili ang anyo at biblikal na larawan ng pariralang genitibo, sa halip na ipakahulugang agad bilang “tubig na nagbibigay-buhay.”
- source_word: λαμπρὸν
  choice: maningning
  rationale: Pangunahing tumutukoy ang salita sa ningning o kaningningan, hindi lamang sa linaw o pagiging malinaw.
- source_word: ὡς κρύσταλλον
  choice: na gaya ng kristal
  rationale: Pinananatili ang tahasang paghahambing na ipinapahayag ng ὡς sa natural na makabagong Tagalog.
- source_word: ἐκπορευόμενον
  choice: na umaagos
  rationale: Ang kasalukuyang participle ay naglalarawan sa ilog; ang “umaagos” ang pinakanatural at pinakamatingkad na paglalarawan ng kilos nito sa Tagalog.
- source_word: ἐκ τοῦ θρόνου
  choice: mula sa trono
  rationale: Malinaw na ipinapahayag ng “mula sa” ang pinagmulan na tinutukoy ng ἐκ.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: ng Diyos at ng Kordero
  rationale: Tuwirang pinananatili ang magkaugnay na mga genitibo at ang “Kordero” bilang mahalagang titulo kay Cristo sa Pahayag.
theological_decisions:
- issue: Iisang trono ng Diyos at ng Kordero
  choice: mula sa trono ng Diyos at ng Kordero
  alternative: mula sa mga trono ng Diyos at ng Kordero
  rationale: Isahan ang “trono” sa Griyego at sinusundan ito ng dalawang magkaugnay na genitibo. Pinananatili ng salin ang larawan ng iisang trono nang hindi nagdaragdag ng paliwanag o ginagawang maramihan ang hindi naman maramihan sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Kordero” bilang kinikilalang biblikal na titulo at iniwasan ang sobrang teknikal o makalumang pananalita.
