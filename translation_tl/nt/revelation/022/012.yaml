  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: tl
  text: “Narito, malapit na akong dumating,[a] at dala ko ang aking gantimpala upang ibigay sa bawat isa ayon sa kanyang gawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “darating ako nang mabilis.” Maaaring idiin ng salitang Griyego na ταχύ ang pagiging malapit ng pagdating o ang bilis nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Nananatili ang mariing panawag-pansin ng pahayag na propetiko, ngunit gumagamit ng likas at kasalukuyang Tagalog.
- source_word: ἔρχομαι
  choice: darating ako
  rationale: Ang pangkasalukuyang anyo sa Griyego ay may puwersang panghinaharap sa konteksto; ito ang likas na paraan sa Tagalog upang ipahayag ang nalalapit na pagdating.
- source_word: ταχύ
  choice: sa lalong madaling panahon
  rationale: Ipinahahayag ang pangunahing diwa ng pagiging malapit o nalalapit. Inilalagay sa talababa ang maaari ring diwang mabilis o biglaan.
- source_word: ὁ μισθός μου μετ’ ἐμοῦ
  choice: dala ko ang aking gantimpala
  rationale: Natural na Tagalog ito para sa literal na ‘ang aking gantimpala ay kasama ko’ at pinananatili ang larawan na dala ng dumarating ang ipagkakaloob niya.
- source_word: ἀποδοῦναι
  choice: upang gantihan
  rationale: Ipinakikita ang layunin at ang diwa ng pagganti o pagbibigay ng nararapat ayon sa gawa, nang hindi nililimitahan kung mabuti o masama ang igaganti.
- source_word: ἑκάστῳ
  choice: ang bawat isa
  rationale: Pinananatili ang distributibong diin sa pananagutan ng bawat indibidwal.
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: ayon sa kanyang ginawa
  rationale: Likas na Tagalog na naghahatid sa pamantayang ipinahahayag ng parirala. Bagaman ginagawang pandiwa ang pangngalang ἔργον, hindi nito dinaragdagan ang kahulugan.
theological_decisions:
- issue: Saklaw ng ἑκάστῳ ... αὐτοῦ
  choice: bawat isa ... kanyang ginawa
  alternative: bawat isa ... kanyang gawa
  rationale: Ang panlalaking isahan sa Griyego ay maaaring kumatawan sa bawat tao. Sa Tagalog, ang ‘kanyang’ ay likas at hindi nakatali sa kasarian, kaya naipahahayag ang pangkalahatang saklaw nang hindi binabago ang indibidwal na diin.
- issue: Kalikasan ng pagganti ayon sa gawa
  choice: gantimpala ... gantihan ang bawat isa ayon sa kanyang ginawa
  alternative: kabayaran ... bayaran ang bawat isa ayon sa kanyang gawa
  rationale: Pinananatili ang wika ng indibidwal na pagganti ayon sa mga gawa nang hindi nagpapasok ng paliwanag tungkol sa batayan ng kaligtasan o sa kung positibo lamang ang gantimpala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ang “Tingnan ninyo” ay nagsisilbing solemneng panawag-pansin; ang “dala ko” ay mas natural kaysa sa tahasang “kasama ko” para sa gantimpalang ihahatid.
