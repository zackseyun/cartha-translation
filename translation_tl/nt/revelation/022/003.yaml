  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: tl
  text: Hindi na magkakaroon ng anumang sumpa[a]. At ang trono ng Diyos at ng Kordero ay mapapasá loob nito, at ang kanyang mga alipin[c] ay sasamba sa kanya[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anumang isinumpang bagay” o “anumang bagay na nasa ilalim ng sumpa.”
    reason: lexical_alternative
  - marker: b
    text: 'Isahan ang mga anyo sa Griyego: “ang trono” ng “Diyos at ng Kordero” ... “ang kanyang mga alipin ay sasamba sa kanya.” Sa gayon, kapuwa napananatili ang pagkakaiba ng Diyos at ng Kordero at ang kanilang magkasamang paghahari.'
    reason: alternative_reading
  - marker: c
    text: Maaari ring “mga lingkod” o “mga lingkod na lubos na nakatalaga.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “maglilingkod sa kanya” o “mag-uukol sa kanya ng banal na paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: anumang sumpa
  rationale: Likas at malinaw sa makabagong Tagalog, habang pinananatili ang ganap na saklaw ng πᾶν. Ang mas kongkretong diwang “anumang isinumpang bagay” ay inilagay sa talababa.
- source_word: οὐκ ἔσται ἔτι
  choice: hindi na magkakaroon pa
  rationale: Natural na paraang Tagalog upang ipahayag ang panghinaharap na pag-iral at ang diwa ng ἔτι, na hindi na ito iiral kailanman.
- source_word: θρόνος
  choice: trono
  rationale: Karaniwang salin at pinananatiling isahan, gaya ng Griyego.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: ng Diyos at ng Kordero
  rationale: Malinaw na pinananatili ang dalawang genitive at ang kilalang larawan ng Kordero sa Pahayag.
- source_word: ἐν αὐτῇ
  choice: sa loob nito
  rationale: Natural na tumutukoy sa lungsod na binanggit sa naunang konteksto, nang hindi inuulit o ipinapasok ang pangngalan sa teksto.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili ang matibay na diwa ng pag-aari at ganap na pagkakatalaga na taglay ng δοῦλοι; ang “mga lingkod” ay maaaring alternatibo ngunit mas mahina.
- source_word: λατρεύσουσιν
  choice: sasamba
  rationale: Sa konteksto ng trono at banal na paglilingkod, malinaw na ipinahihiwatig ng λατρεύω ang pagsambang iniuukol sa Diyos. Ang diwang “maglilingkod” ay itinatala bilang alternatibo.
- source_word: αὐτοῦ ... αὐτῷ
  choice: kanyang ... sa kanya
  rationale: Pinananatili ang isahang anyo ng mga panghalip sa Griyego sa halip na gawing maramihan at lutasin ang sinadyang tensiyon ng pangungusap.
theological_decisions:
- issue: Iisang trono na inuugnay sa Diyos at sa Kordero, kasunod ang mga panghalip na isahan
  choice: Pinanatili ang “ang trono” at ang isahang “kanyang ... sa kanya.”
  alternative: 'Gawing maramihan: “kanilang mga alipin ... sa kanila,” o baguhin ang pangungusap upang maiwasan ang tensiyon.'
  rationale: Pinag-iiba ng teksto ang Diyos at ang Kordero ngunit iniuugnay sila sa iisang trono at gumagamit ng mga panghalip na isahan. Hindi dapat lutasin ng salin ang teolohikal at gramatikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kordero,” “trono,” at “sasamba” bilang mga pamilyar ngunit dignipikadong salitang biblikal. Hindi pinalitan ng maramihang panghalip ang isahang anyo ng Griyego.
