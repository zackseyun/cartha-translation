revisions:
- from: At hindi na magkakaroon pa ng anumang sumpa[a]. At sa loob nito ay naroon ang trono ng Diyos at ng Kordero, at ang kanyang mga alipin[c] ay sasamba sa kanya[d][b].
  to: Hindi na magkakaroon ng anumang sumpa[a]. At ang trono ng Diyos at ng Kordero ay mapapasá loob nito, at ang kanyang mga alipin[c] ay sasamba sa kanya[d][b].
  rationale: Inayos ang dalawang anyong Tagalog upang maging likas at upang malinaw na maipahayag ang hinaharap na diwa ng Griyegong οὐκ ἔσται ἔτι at ἔσται. Walang binago sa kahulugan, sa isahang trono, o sa sinadyang isahang panghalip na may kaugnayan sa Diyos at sa Kordero.
