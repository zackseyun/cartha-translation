  verdict: revise
  source_fidelity: Ang “hindi na magkakaroon pa” ay hindi likas na pagpapahayag ng οὐκ ἔσται ἔτι; ang “Hindi na magkakaroon” ay malinaw na naghahatid ng panghinaharap at ng “hindi na.” Ang “ay naroon” ay karaniwang pangkasalukuyang anyo at hindi malinaw na naipapakita ang panghinaharap na ἔσται. Pinalitan ito ng “ay mapapasá loob nito” upang mapanatili ang lokasyon at futurity. Nananatili ang isahang “trono,” “kanyang,” at “kanya,” alinsunod sa Griyego.
  naturalness: Mas natural sa makabagong Tagalog ang “Hindi na magkakaroon ng anumang sumpa” kaysa “hindi na magkakaroon pa.” Ang “mapapasá loob nito” ay angkop na panghinaharap na pananalita para sa kinalalagyan ng trono sa lungsod.
  terminology: Ang “Diyos,” “Kordero,” “trono,” at “mga alipin” ay angkop at tapat sa itinatag na terminolohiya. Ang “sasamba” ay katanggap-tanggap para sa λατρεύσουσιν sa kontekstong ito; pinananatili ng talababa ang aspektong banal na paglilingkod.
