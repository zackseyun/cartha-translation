  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang pagiging maaasahan at katotohanan ng mga salita, ang titulong Panginoon at ang kasunod na appositional na parirala, ang pagpapadala ng anghel, ang mga alipin, ang banal na pangangailangan sa kailangang mangyari, at ang temporal na diwa ng ἐν τάχει. Hindi nito nilulutas nang interpretatibo ang “mga espiritu ng mga propeta.”'
