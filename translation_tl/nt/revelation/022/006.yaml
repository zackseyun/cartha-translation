  terminology: 'Wasto at pare-pareho ang mga pangunahing termino: “Panginoon” para sa κύριος, “Diyos” para sa θεός, “anghel” para sa ἄγγελος, at “mga alipin” para sa δούλοις. Ang “mga espiritu ng mga propeta” ay sadyang pormal upang mapanatili ang kalabuan ng pinagmulan.'
