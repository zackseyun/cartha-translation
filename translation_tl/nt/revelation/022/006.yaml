id: REV.22.6
reference: Revelation 22:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: tl
  text: At sinabi niya sa akin, “Ang mga salitang ito ay mapagkakatiwalaan at totoo. At ang Panginoon, ang Diyos ng mga espiritu ng mga propeta, ay nagsugo ng kanyang anghel upang ipakita sa kanyang mga alipin ang mga bagay na kailangang mangyari sa lalong madaling panahon[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang mabilis.” Maaaring idiin ng pariralang Griyego ang pagiging malapit sa panahon (“sa lalong madaling panahon”) o ang bilis ng pagganap (“nang mabilis”).
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὶ
  choice: mapagkakatiwalaan
  rationale: Sa paglalarawan sa mga salita, natural na ipinahahayag nito ang pagiging maaasahan ng mensahe, habang nananatiling bukod sa ἀληθινοί.
- source_word: ἀληθινοί
  choice: totoo
  rationale: Direkta at likas na katumbas na nagpapanatili sa katotohanan at pagiging tunay ng mga salita.
- source_word: κύριος
  choice: Panginoon
  rationale: Karaniwang salin ng banal na titulong κύριος at angkop sa pagkakatumbas nito rito sa Diyos.
- source_word: θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: ang Diyos ng mga espiritu ng mga propeta
  rationale: Pinananatili ang ugnayang genitibo at ang tunay na kalabuan kung ang tinutukoy ay mga espiritung taglay ng mga propeta, mga espiritung kumikilos sa kanila, o ang kanilang panloob na espiritu; iniiwasan ang paliwanag na 'nagbibigay-inspirasyon.'
- source_word: ἄγγελον
  choice: anghel
  rationale: Sa kontekstong apokaliptiko ng Pahayag, tumutukoy ito sa makalangit na sugo.
- source_word: δούλοις
  choice: mga alipin
  rationale: Pinananatili ang matibay na diwa ng pagmamay-ari at pagpapasakop sa δοῦλος; bagaman posible ang 'mga lingkod,' mas mahina nitong naipahahayag ang terminong Griyego.
- source_word: δεῖξαι
  choice: upang ipakita
  rationale: Tuwirang salin na angkop sa konteksto ng pangitain nang hindi nagdaragdag ng interpretasyon.
- source_word: ἃ δεῖ γενέσθαι
  choice: ang mga bagay na kailangang mangyari
  rationale: Pinananatili ang diwa ng kinakailangang maganap na nasa δεῖ at ang pangyayari sa γενέσθαι.
- source_word: ἐν τάχει
  choice: sa lalong madaling panahon
  rationale: Natural na Filipino para sa temporal na kalapitan o 'soon'; inilalagay sa talababa ang posibleng diwang 'mabilis' upang hindi lutasin nang tahimik ang kalabuan.
- source_word: Καὶ εἶπέν μοι
  choice: At sinabi niya sa akin
  rationale: Pinananatili ang payak na pang-ugnay na καί at hindi ito pinalalakas bilang tahasang sunod-sunod na panahong 'Pagkatapos.'
theological_decisions:
- issue: Kahulugan ng ἐν τάχει sa eskatolohikong konteksto
  choice: sa lalong madaling panahon
  alternative: nang mabilis
  rationale: Maaaring idiin ng parirala ang kalapitan sa panahon o ang bilis ng pagganap. Pinili sa teksto ang temporal na kalapitan dahil sa paulit-ulit na diin ng Pahayag, ngunit pinanatili sa talababa ang tunay na alternatibo.
- issue: Lakas ng δοῦλοι bilang katawagan sa bayan ng Diyos
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang 'mga alipin' ay mas tapat sa diwa ng pag-aari at ganap na pagpapasakop na dala ng δοῦλος. Ang 'mga lingkod' ay mas banayad at tradisyonal ngunit maaaring ikubli ang lakas ng salita.
- issue: Ugnayan sa pariralang θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: ang Diyos ng mga espiritu ng mga propeta
  alternative: ang Diyos na nagbibigay-inspirasyon sa mga propeta
  rationale: Pinananatili ng pormal na anyo ang kalabuan ng mga genitive at hindi ipinapalit ang isang paliwanag hinggil sa inspirasyon bilang mismong salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mapagkakatiwalaan at totoo' bilang natural ngunit tumpak na tambalan, at pinanatili ang mas mabigat na 'mga alipin' para sa δοῦλοι. Ang marker na [a] ay nasa mismong teksto at tumutukoy sa ἐν τάχει.
