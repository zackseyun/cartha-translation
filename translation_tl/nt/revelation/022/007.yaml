id: REV.22.7
reference: Revelation 22:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: tl
  text: At narito, malapit na akong dumating.[a] Pinagpala ang tumutupad sa mga salita ng propesiya sa aklat na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mabilis akong darating.” Maaaring idiin ng Griyego ang pagiging malapit sa panahon (“malapit na”) o ang mabilis at biglaang pagdating.
    reason: lexical_alternative
  - marker: b
    text: O, “balumbong ito.”
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang panawag-pansin at maringal na tono ng pahayag nang hindi nagdaragdag ng tahasang pautos na wala sa Griyego.
- source_word: ἔρχομαι
  choice: akong dumating
  rationale: Sa pariralang “malapit na akong dumating,” natural na naihahayag sa Tagalog ang kasalukuyang anyong may pahiwatig ng nalalapit na pagdating.
- source_word: ταχύ
  choice: malapit na
  rationale: Sa konteksto, pangunahing ipinahihiwatig ang pagiging nalalapit sa panahon; inilalahad sa talababa ang maaari ring diing mabilis o biglaan.
- source_word: μακάριος
  choice: pinagpala
  rationale: Angkop sa pormang tulad ng beatitud at pinananatili ang espirituwal at eskatolohikal na bigat, hindi lamang damdaming masaya.
- source_word: ὁ τηρῶν
  choice: ang tumutupad
  rationale: Natural sa makabagong Tagalog at ipinahihiwatig ang patuloy na pagsunod o pagtalima sa nilalaman; hindi lamang pisikal na pag-iingat.
- source_word: τοὺς λόγους
  choice: sa mga salita
  rationale: Pinananatili ang tahasang pangmaramihang anyo sa halip na ibuod bilang iisang “mensahe.”
- source_word: τῆς προφητείας
  choice: ng propesiya
  rationale: Pinananatili ang kinikilalang kategoryang apokaliptiko at ang ugnayang “mga salita ng propesiya.”
- source_word: τοῦ βιβλίου τούτου
  choice: sa aklat na ito
  rationale: Ang “aklat” ang pinakanatural na modernong katumbas sa sariling pagtukoy ng Pahayag sa nasusulat na akda; ang makasaysayang posibilidad na “balumbon” ay nasa talababa.
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita sa “malapit na akong dumating”
  choice: Hindi tahasang pinangalanan ang nagsasalita; pinanatili lamang ang unang panauhan.
  alternative: Idagdag sa teksto ang pangalang “Jesus.”
  rationale: Unang panauhang pandiwa lamang ang nasa Griyego. Hinahayaan nitong ang kontekstong pampanitikan ang magpakilala sa nagsasalita at iniiwasang magpasok ng pangalang wala sa talata.
- issue: Saklaw ng τηρῶν
  choice: “tumutupad,” na nagpapahayag ng matapat na pagtalima sa mga salita ng propesiya
  alternative: “nag-iingat,” na maaaring unawain bilang pagpreserba lamang ng teksto
  rationale: Saklaw ng pandiwa ang pag-iingat, panghahawak, at pagsunod. Sa Tagalog, “tumutupad sa mga salita” ang mas natural sa kontekstong ito, bagaman hindi nito nililimitahan ang diwa sa simpleng pagsunod sa mga utos.
translation_notes:
  register: 'Makabago ngunit maringal na Filipino. Ginamit ang “narito” bilang panawag-pansin na angkop sa apokaliptikong pahayag, at iniwasan ang labis na arkaikong pananalita. Inayos ang mga pananda ng talababa ayon sa salitang talagang tinatalakay: [a] sa ταχύ at [b] sa βιβλίον.'
