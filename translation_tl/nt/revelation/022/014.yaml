id: REV.22.14
reference: Revelation 22:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: tl
  text: Pinagpala ang mga naglalaba ng kanilang mga kasuotan[a][b], upang magkaroon sila ng karapatan sa punongkahoy ng buhay at makapasok sa lungsod sa pamamagitan ng mga pintuang-bayan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na kababasahan ng “Pinagpala ang mga sumusunod sa kanyang mga utos” o “tumutupad sa kanyang mga utos” sa halip na “naglalaba ng kanilang mga kasuotan.”
    reason: textual_variant
  - marker: b
    text: Umaalingawngaw ang larawang ito sa Pahayag 7:14, kung saan nilabhan at pinaputi ang mga kasuotan sa dugo ng Kordero.
    reason: cross_reference
  - marker: c
    text: Maaari ring isalin na “na dumaraan sa mga pintuang-bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Pinagpala
  rationale: Pinananatili nito ang bigat ng pahayag ng pagpapala sa kontekstong pangwakas at hindi ito nililimitahan sa pansariling damdaming ‘masaya.’
- source_word: πλύνοντες
  choice: naglalaba
  rationale: Konkretong inilalarawan ng pandiwa ang paghuhugas ng kasuotan. Ang anyong pangkasalukuyan ay nagpapakilala sa mga taong kinaugalian o katangian ang gawaing ito nang hindi dinaragdagan ang talata ng paliwanag.
- source_word: στολὰς
  choice: mga kasuotan
  rationale: Natural at marangal itong tawag sa mga damit sa pangitain. Hindi nito sapilitang tinutukoy ang isang partikular na estilo ng damit, ngunit pinananatili ang simbolikong larawan.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na ipinapahayag ang ugnayang layunin o kinalabasan ng kasunod na sugnay.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: magkaroon sila ng karapatan
  rationale: Sa konteksto, ang ἐξουσία ay tumutukoy sa lehitimong karapatan o pahintulot na lumapit, hindi sa kapangyarihang mamuno.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: sa punongkahoy ng buhay
  rationale: Kasama ng ἐξουσία, likas itong nagpapahayag ng karapatan sa paglapit o pakikibahagi sa punongkahoy, hindi pamamahala rito.
- source_word: τοῖς πυλῶσιν
  choice: sa pamamagitan ng mga pintuang-bayan
  rationale: Ipinahahayag nito ang datibo bilang daan o paraan ng pagpasok. Ang ‘pintuang-bayan’ ay angkop sa malalaking tarangkahan ng lungsod.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: makapasok sa lungsod
  rationale: Natural na salin ng aorist subjunctive sa sugnay na pinangungunahan ng ἵνα, at pinananatili ang tanawing pangwakas.
theological_decisions:
- issue: Pagkakaiba-iba ng tekstong Griyego sa unang sugnay
  choice: Isinalin sa pangunahing teksto ang SBLGNT na ‘mga naglalaba ng kanilang mga kasuotan.’
  alternative: ‘mga sumusunod sa kanyang mga utos’ o ‘mga tumutupad sa kanyang mga utos’
  rationale: Ang ibinigay na tekstong Griyego ay πλύνοντες τὰς στολὰς αὐτῶν. Dahil mahalaga at laganap sa tradisyon ng pagsasalin ang ibang pagbasa, inilagay iyon sa talababa sa halip na itago o ipalit sa pangunahing teksto.
- issue: Ugnayan ng paglalaba ng mga kasuotan at ng karapatan sa buhay
  choice: Pinanatili ang ugnayang tahasang sinasabi ng talata nang hindi ipinaliliwanag sa pangunahing teksto ang paraan ng kaligtasan.
  alternative: Ipaliwanag ang paglalaba bilang gawang may sariling merito, o idagdag sa pangunahing teksto na nilabhan ang mga kasuotan sa dugo ng Kordero.
  rationale: Hindi tahasang inilalahad ng talatang ito ang mekanismo. Iniiwasan ng salin ang pagpasok ng dagdag na sistemang teolohikal, samantalang itinuturo ng talababa ang kaugnay na larawan sa Pahayag 7:14.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘punongkahoy’ at ‘pintuang-bayan’ upang mapanatili ang mataas ngunit madaling maunawaang himig ng pangitain; iniwasan ang labis na teknikal o denominasyonal na pananalita.
