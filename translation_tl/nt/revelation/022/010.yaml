id: REV.22.10
reference: Revelation 22:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: tl
  text: At sinasabi niya sa akin, “Huwag mong tatakan[a] ang mga salita ng propesiya sa aklat na ito[c], sapagkat malapit na ang panahon[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag mong selyuhan” o “Huwag mong ilihim.” Umaalingawngaw ang parirala sa wikang propetiko tungkol sa kung ang isang pahayag ay isasara o pananatilihing bukás.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “malapit na ang itinakdang panahon.” Ang Griyegong καιρός ay maaaring tumukoy sa isang mapagpasiyang panahon o panahong itinakda.
    reason: lexical_alternative
  - marker: c
    text: Ihambing ang Daniel 12:4, kung saan iniutos na tatakan ang propesiya; kabaligtaran ang utos dito.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: sinasabi niya sa akin
  rationale: Pinananatili ang pangkasalukuyang panahunan ng Griyego bilang masiglang pangkasaysayang kasalukuyan, na natural ding maipahayag sa Filipino.
- source_word: Μὴ σφραγίσῃς
  choice: Huwag mong tatakan
  rationale: Pinananatili ang kongkretong larawan ng σφραγίζω—ang pagtatatak o pagsasara—nang hindi agad nililimitahan ang kahulugan sa ‘ilihim.’
- source_word: τοὺς λόγους
  choice: ang mga salita
  rationale: Tuwirang pinananatili ang maramihang λόγους; hindi ito ginawang pang-isahang ‘mensahe.’
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: ng propesiya sa aklat na ito
  rationale: Natural sa modernong Filipino at malinaw na ang tinutukoy ay ang propesiyang nilalaman ng aklat na ito, habang pinananatili ang ugnayan ng mga salita, propesiya, at aklat.
- source_word: ὁ καιρὸς
  choice: ang panahon
  rationale: Ang ‘panahon’ ay maikli at bukás sa diwa ng isang tiyak o mapagpasiyang panahon nang hindi iyon idinaragdag nang tahasan sa pangunahing teksto.
- source_word: ἐγγύς ἐστιν
  choice: malapit na
  rationale: Karaniwan at malinaw na Filipino para sa pagiging malapit o nalalapit; pinananatili nito ang diin ng teksto sa nalalapit na panahon.
theological_decisions:
- issue: Ang pahayag ng pagiging malapit sa kontekstong apokaliptiko
  choice: sapagkat malapit na ang panahon
  alternative: sapagkat malapit na ang itinakdang panahon
  rationale: Tuwirang pinananatili ang pahayag na malapit na ang panahon, nang hindi nagtatakda ng detalyadong iskedyul o pinahihina ang tensiyong eskatolohikal ng talata.
- issue: Ang pagtatatak bilang larawan ng pagsasara o paglilihim ng pahayag
  choice: Huwag mong tatakan
  alternative: Huwag mong ilihim
  rationale: Pinananatili sa pangunahing teksto ang propetikong larawan ng pagtatatak at inilalagay sa talababa ang posibleng ipinahihiwatig nitong hindi paglilihim, sa halip na tahimik na pumili ng isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang propetikong larawang ‘tatakan’ at ang maramihang ‘mga salita,’ samantalang ginawang natural sa Filipino ang magkakasunod na genitive sa pariralang ‘propesiya sa aklat na ito.’
