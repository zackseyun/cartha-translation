base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: tl
  text: Hayaan ang gumagawa ng masama na patuloy pang gumawa ng masama; hayaan ang marumi na patuloy pang madungisan; hayaan ang matuwid na patuloy pang gumawa ng katuwiran; at hayaan ang banal na patuloy pang pabanalin.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hayaan ang marumi na patuloy pang maging marumi.” Balintiyak ang pandiwang Griyego at maaari ring isaling “patuloy pang marumihan” o “madungisan.”
    reason: lexical_alternative
  - marker: b
    text: O “patuloy pang gumawa ng katarungan.” Maaari ring mangahulugan ang δικαιοσύνη ng “katarungan,” bagaman “katuwiran” ang pangunahing salin dito.
    reason: lexical_alternative
  - marker: c
    text: O “patuloy pang gawing banal.” Ang pandiwang Griyego ay nangangahulugang “pabanalin” o “gawing banal” at nasa anyong balintiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: Ang gumagawa ng masama ay patuloy pang gumawa ng masama
  rationale: Ang artikulong may kasalukuyang participle ay ginawang pangkalahatang katawagan sa tao. Pinananatili ng “gumagawa” ang pandiwang diwa, at ng “patuloy pa” ang pagpapatuloy na ipinahihiwatig ng ἔτι, nang hindi labis na binibigyang-kahulugan ang aorist imperative.
- source_word: ὁ ῥυπαρός … ῥυπαρευθήτω ἔτι
  choice: ang marumi ay patuloy pang maging marumi
  rationale: Ang ῥυπαρός ay may diwa ng karumihan o pagkadungis. Ang “maging marumi” ay natural sa Tagalog at maaaring magpahiwatig ng pagpasok o pagpapatuloy sa kalagayan, samantalang iniiwasan ang di-natural na “gawing marumi” na maaaring magtakda ng hindi tahasang ahente.
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: ang matuwid ay patuloy pang gumawa ng katuwiran
  rationale: Pinananatili ang ugnayang leksikal ng δίκαιος at δικαιοσύνη sa “matuwid/katuwiran.” Ang “gumawa ng katuwiran” ay malinaw na tumutukoy sa aktuwal na asal, bagaman maaari ring isalin ang δικαιοσύνη bilang “katarungan.”
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: ang banal ay patuloy pang gawing banal
  rationale: Tahasan nitong pinananatili ang balintiyak na anyo ng ἁγιασθήτω at iniiwang di-binanggit ang ahente, gaya ng Griyego. Ang “patuloy pa” ay nagpapahayag ng ἔτι.
theological_decisions:
- issue: Pautos na anyo sa konteksto ng pangwakas na pagpapatibay ng kalagayang moral
  choice: Isinalin ang apat na pandiwa bilang mga pautos sa ikatlong panauhan sa anyong “ay patuloy pang …,” na gumaganap bilang solemneng pagpapahintulot o pahayag-pautos.
  alternative: 'Isalin bilang panghuhula: “patuloy na gagawa …” o gumamit ng tahasang “hayaan.”'
  rationale: Pautos, hindi panggitna o panghinaharap na pasalaysay, ang mga anyong Griyego. Iniiwasan ng salin na gawing simpleng prediksiyon ang teksto o ipahiwatig na sinasang-ayunan ang kasamaan, habang pinananatili ang mabigat na tensiyong retorikal.
- issue: Tinig ng ῥυπαρευθήτω at ἁγιασθήτω
  choice: Natural na isinalin ang ῥυπαρευθήτω bilang “maging marumi,” ngunit pinanatiling tahasang balintiyak ang ἁγιασθήτω bilang “gawing banal.”
  alternative: “gawing marumi” at “gawing banal,” o “maging marumi” at “manatiling banal.”
  rationale: Parehong pasibo ang mga anyong Griyego, ngunit ang literal na pasibo sa unang parirala ay hindi natural at madaling magtakda ng sapilitang ahente sa Tagalog. Ipinaliliwanag ng talababa ang anyo. Sa huling parirala, natural at teolohikal na mahalaga ang “gawing banal,” kaya iniwang di-tiyak ang gumagawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Inulit ang “patuloy pang” sa apat na sugnay upang mapanatili ang mariing pag-uulit ng ἔτι. Ginamit ang “ang … ay …” upang katawanin nang natural sa Tagalog ang magkakatulad na substantival na anyo at mga pautos sa ikatlong panauhan.
