id: REV.21.1
reference: Revelation 21:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: tl
  text: At nakita ko ang isang bagong langit at isang bagong lupa, sapagkat lumipas na ang unang langit at ang unang lupa[a], at wala na ang dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang dating langit at ang dating lupa.” Literal na “una” ang Griyegong πρῶτος, ngunit dito maaari itong tumukoy sa naunang kaayusan bilang kaibahan sa bago.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain nang literal ang “dagat,” bagaman sa Pahayag maaari rin itong magpahiwatig ng kaguluhan, panganib, o pagkakahiwalay.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: nakita ko
  rationale: Ang aorist ng ὁράω ay likas na isinasalin bilang payak na nagdaang kilos sa salaysay. Malinaw at natural sa modernong Filipino ang “nakita ko.”
- source_word: οὐρανὸν ... γῆν
  choice: langit ... lupa
  rationale: Sa kosmikong konteksto ng pangitain, tumutukoy ang mga salita sa kabuuan ng nilikhang kaayusan, hindi lamang sa himpapawid at lupain. Pinananatili rin nito ang isahang anyo ng Griyego.
- source_word: καινὸν ... καινήν
  choice: bagong ... bagong
  rationale: Ang καινός ay nagsasaad ng pagiging bago, lalo na sa uri o katangian. Hindi tinutukoy ng “bago” kung ganap na pinalitan o binago lamang ang naunang nilikha.
- source_word: ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: sapagkat ... ang unang langit at ang unang lupa
  rationale: Tuwirang tinutumbasan ng “unang” ang πρῶτος at pinananatili ang paghahambing sa bagong kaayusan; maaari rin itong maunawaan bilang “dating.”
- source_word: ἀπῆλθαν
  choice: lumipas na
  rationale: Sa kontekstong ito, inilalarawan ng ἀπέρχομαι ang pagkawala ng naunang kaayusan. Natural sa Filipino ang “lumipas na” at malinaw ang kaugnayan nito sa pangitaing nakita ni Juan.
- source_word: ἡ θάλασσα
  choice: ang dagat
  rationale: Tuwirang kahulugan ng θάλασσα ang “dagat.” Hindi inilalagay sa pangunahing teksto ang posibleng simbolismo nito.
- source_word: οὐκ ἔστιν ἔτι
  choice: wala na
  rationale: Maikli, natural, at eksaktong ipinapahayag ng “wala na” ang kasalukuyang pagtanggi na may diwang “hindi na.”
theological_decisions:
- issue: Ang kalikasan ng “bagong langit at bagong lupa”
  choice: Isinaling “bago” nang hindi tinutukoy kung ito ay ganap na kapalit o pagbabago ng naunang nilikha.
  alternative: Ganap na pagpapalit; o pagpapanibago at pagbabago ng umiiral na nilikha.
  rationale: Ipinahihiwatig ng καινός ang pagiging bago, ngunit hindi nilulutas ng talata kung pagpapalit o transpormasyon ang tinutukoy. Pinananatili ng salin ang tensiyong ito.
- issue: Ang kahulugan ng “wala na ang dagat”
  choice: Pinanatili ang konkretong larawan ng pagkawala ng dagat sa pangunahing teksto.
  alternative: Literal na kawalan ng dagat; o sagisag ng pag-aalis ng kaguluhan, panganib, kasamaan, o pagkakahiwalay.
  rationale: Maaaring magkaroon ng simbolikong kabuluhan ang dagat sa Pahayag, ngunit hindi tahasang ipinaliliwanag ng talata ang kabuluhang iyon. Mas angkop ilagay ang mga posibilidad sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang payak ngunit maringal na himig ng pangitain at iniwasang ipasok sa pangunahing teksto ang mga tiyak na interpretasyong teolohikal.
