source:
  edition: SBLGNT
  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: tl
  text: Ang materyales ng pader nito ay jaspe[a], at ang lungsod ay purong ginto, gaya ng malinaw na salamin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang pagkakayari ng pader nito ay jaspe.” Ang salitang Griyego ay maaaring tumukoy sa pagkakayari o sa materyales/estruktura ng itinayo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “gaya ng dalisay na salamin.” Binibigyang-diin ng paghahambing ang maningning na linaw ng lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: materyales
  rationale: Maaaring tumukoy sa pagkakayari o sa materyales ng itinayo. Dahil jaspe ang panaguri at kasunod ang paglalarawan sa sangkap ng lungsod, natural na ipinahihiwatig dito ang materyales.
- source_word: τεῖχος
  choice: pader
  rationale: Karaniwang tumutukoy sa pader ng isang lungsod; malinaw at natural ang “pader” sa modernong Tagalog.
- source_word: ἴασπις
  choice: jaspe
  rationale: Ito ang nakaugaliang pangalang Filipino sa batong jasper; pinananatili nito ang katawagang batong-hiyas sa Griyego nang hindi ipinapalagay na ganap itong katumbas ng modernong uri ng jasper.
- source_word: χρυσίον καθαρόν
  choice: purong ginto
  rationale: Tumutukoy sa ginto bilang materyales at sa kadalisayan nito; “purong ginto” ang natural na katumbas sa Tagalog.
- source_word: ὅμοιον
  choice: gaya ng
  rationale: Nagpapakilala ito ng paghahambing; natural at tuwiran ang “gaya ng.”
- source_word: ὑάλῳ καθαρῷ
  choice: malinaw na salamin
  rationale: Ang ὕαλος ay salamin o malinaw na sangkap na tulad ng salamin. Sa kontekstong biswal, naipahahayag ng “malinaw” ang linaw o pagk透 nito, samantalang maaaring unawain din nang mas literal ang καθαρός bilang “dalisay.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “materyales” dahil mas natural ito kaysa “sangkap” para sa materyal na ginamit sa pader; inilagay sa talababa ang tunay na alternatibong “pagkakayari.”
