  source_fidelity: 'Tapat ang salin sa Griyego: ang ἐνδώμησις ay naipahayag bilang “materyales,” ang τεῖχος bilang “pader,” ang ἴασπις bilang “jaspe,” at ang χρυσίον καθαρόν bilang “purong ginto.” Ang “gaya ng malinaw na salamin” ay angkop na paghahayag ng paghahambing na ὅμοιον ὑάλῳ καθαρῷ at pinananatili ang imahen ng linaw/transparency nang walang labis na pagpapakahulugan.'
