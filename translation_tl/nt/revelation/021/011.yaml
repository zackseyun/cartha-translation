id: REV.21.11
reference: Revelation 21:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: tl
  text: taglay ang kaluwalhatian ng Diyos. Ang ningning nito[a] ay gaya ng isang napakahalagang bato, gaya ng batong jaspe na kasinglinaw ng kristal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “liwanag nito” o “kaningningan nito” (Griyego: φωστήρ).'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kumikislap na parang kristal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: taglay
  rationale: Pinananatili ang ugnayan ng kasalukuyang participle sa lungsod na binanggit sa naunang talata, at likas itong pakinggan sa Filipino.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: ang kaluwalhatian ng Diyos
  rationale: Ang “kaluwalhatian” ay nagpapanatili sa bigat na teolohikal at sa diwa ng hayag na kadakilaan at presensya ng Diyos.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: ang ningning nito
  rationale: Maaaring tumukoy ang φωστήρ sa pinagmumulan ng liwanag o sa maningning na anyo. Sa paglalarawan sa lungsod, malinaw at natural ang “ningning,” habang pinananatili sa talababa ang ibang posibilidad.
- source_word: ὅμοιος λίθῳ τιμιωτάτῳ
  choice: ay gaya ng isang napakahalagang bato
  rationale: Ipinahahayag ng “gaya” ang paghahambing, at ng “napakahalaga” ang pinatinding o superlatibong lakas ng τιμιωτάτῳ.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: gaya ng batong jaspe
  rationale: Pinananatili ang pag-uulit ng “bato” sa Griyego at ginagamit ang kinikilalang pangalang Filipino na “jaspe.”
- source_word: κρυσταλλίζοντι
  choice: kasinglinaw ng kristal
  rationale: Ipinahahayag nito ang mala-kristal na linaw o anyo ng jaspe sa natural na Filipino, nang hindi lubusang nilulutas kung linaw o pagkislap ang pangunahing diin.
theological_decisions:
- issue: Pagpapahayag sa δόξα τοῦ θεοῦ sa apokaliptikong paglalarawan
  choice: ang kaluwalhatian ng Diyos
  alternative: ang kaningningan ng Diyos
  rationale: Hindi lamang kagandahang nakikita ang tinutukoy kundi ang nahahayag na kadakilaan at presensya ng Diyos; pinananatili ng “kaluwalhatian” ang mas malawak na diwang biblikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang pangungusap ay sadyang nagsisimula sa “taglay” upang mapanatili ang ugnayang gramatikal nito sa lungsod sa naunang talata. Ginamit ang “nito” para sa lungsod at iniwasan ang labis na pagpapaliwanag sa matalinghagang larawan.
