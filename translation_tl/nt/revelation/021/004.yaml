  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: tl
  text: At papahirin niya ang bawat luha mula sa kanilang mga mata[a]. Hindi na magkakaroon ng kamatayan; hindi na rin magkakaroon ng pagluluksa, pag-iyak[b], o kirot. Lumipas na ang mga dating bagay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “lahat ng luha.” Distributibo ang isahang anyo sa Griyego: “bawat luha.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “daing” o “malakas na sigaw.” Ang salitang Griyego ay maaaring tumukoy sa isang sigaw o malakas na pagdaing.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga unang bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: papahirin
  rationale: Sa konteksto ng luha, likas at personal sa Filipino ang “papahirin”; iniiwasan nito ang di-angkop na diwa ng literal na pagbubura.
- source_word: πᾶν δάκρυον
  choice: bawat luha
  rationale: Pinananatili ng “bawat luha” ang distributibong puwersa ng isahang pangngalan na may πᾶν.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: sa kanilang mga mata
  rationale: Likas na Filipino ito para sa pag-aalis ng luha mula sa mga mata; ang pandiwang “papahirin” ay sapat nang nagpapahiwatig ng pag-aalis.
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: Hindi na magkakaroon ng kamatayan
  rationale: Malinaw at natural na ipinapahayag nito ang ganap na pagkawala ng kamatayan.
- source_word: πένθος
  choice: pagluluksa
  rationale: Tumpak na tumutukoy sa pagdadalamhati, lalo na kaugnay ng kamatayan at pagkawala.
- source_word: κραυγή
  choice: pag-iyak
  rationale: Sa kontekstong nagbibigay-aliw, natural nitong inilalarawan ang pag-iyak dahil sa dalamhati; maaari ring mangahulugang malakas na daing.
- source_word: πόνος
  choice: kirot
  rationale: Ang “kirot” ay maikli, marangal, at maaaring tumukoy sa pisikal o emosyonal na sakit nang hindi inuulit ang karaniwang salitang “sakit,” na maaari ring mangahulugang karamdaman.
- source_word: τὰ πρῶτα
  choice: ang mga dating bagay
  rationale: Pinakamalinaw itong tumutukoy sa dating kaayusan o mga naunang realidad, samantalang ang literal na “mga unang bagay” ay maaaring malabo sa Filipino.
- source_word: ἀπῆλθαν
  choice: Lumipas na
  rationale: Ipinahahayag nito ang natapos nang pagpanaw ng dating kaayusan at likas sa eskatolohikal na pahayag sa Filipino.
theological_decisions:
- issue: Hindi tahasang inuulit sa talata ang simuno ng ἐξαλείψει; nakukuha ito mula sa Apocalipsis 21:3.
  choice: “papahirin niya” nang hindi idinaragdag ang pangngalang “Diyos”
  alternative: “papahirin ng Diyos”
  rationale: Pinananatili nito ang pagkakaugnay ng Griyego at hindi nagdaragdag ng pangngalang wala sa mismong talata, habang malinaw pa rin ang tinutukoy mula sa konteksto.
- issue: Saklaw ng pagkawala ng kamatayan, pagluluksa, pag-iyak, at kirot.
  choice: Ganap na pananalitang “Hindi na magkakaroon”
  alternative: “Hindi na iiral” o “mawawala na”
  rationale: Kategorikal ang οὐκ ἔσται ἔτι; hindi lamang nababawasan ang mga ito kundi tuluyang wala na sa bagong kaayusan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal, malinaw, at madaling basahin. Ginamit ang “Hindi na magkakaroon” upang natural na mapanatili ang dalawang ganap na pagtanggi ng Griyego. Inilagay ang mga panandang talababa sa mismong mga salitang kaugnay ng bawat alternatibo.
