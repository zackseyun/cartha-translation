  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: tl
  text: At lalakad ang mga bansa sa liwanag nito[a], at dadalhin ng mga hari ng daigdig ang kanilang kaluwalhatian[b] sa loob nito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng liwanag nito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kanilang karilagan” o “kanilang karangalan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, pambabae ang panghalip sapagkat tumutukoy ito sa lungsod, isang pangngalang pambabae sa gramatika ng Griyego. Walang gayong gramatikal na kasarian ang “nito” sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: lalakad
  rationale: Pinananatili ang kongkretong larawan ng paglakad sa liwanag; hindi ito pinalalabo bilang ‘mamumuhay’ o ‘mamumuhay nang ayon.’
- source_word: τὰ ἔθνη
  choice: ang mga bansa
  rationale: Ipinapahayag ang sama-samang diwang pampamayanan at pampolitika at pinananatili ang ugnay sa mga propetikong larawan sa Lumang Tipan.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: sa liwanag nito
  rationale: Natural ito sa makabagong Tagalog at maaaring ipahiwatig ang liwanag bilang kapaligiran o paraang nagbibigay-daan sa paglakad; inilalahad sa talababa ang higit na tahasang kahulugang instrumental.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ang mga hari sa lupa
  rationale: Natural na salin ng karaniwang apokaliptikong katawagan sa mga tagapamahala ng mundo.
- source_word: φέρουσιν
  choice: dadalhin
  rationale: Bagaman nasa pangkasalukuyang anyo ang pandiwa sa Griyego, magkakaugnay ito sa panghinaharap na pangitain ng unang sugnay; ang panghinaharap sa Tagalog ay malinaw at natural.
- source_word: τὴν δόξαν αὐτῶν
  choice: ang kanilang kaluwalhatian
  rationale: Pinananatili ang malawak na biblikal na saklaw ng δόξα—karangalan, karilagan, at kadakilaan—nang hindi ito nililimitahan sa kayamanan lamang.
- source_word: εἰς αὐτήν
  choice: sa loob nito
  rationale: Malinaw na ipinapahayag ang direksiyong papasok na taglay ng εἰς, habang ang ‘nito’ ay natural na tumutukoy sa lungsod sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy at antas ng pagsasatao sa pambabaeng panghalip para sa Bagong Jerusalem
  choice: Gamitin ang walang-kasariang ‘nito’ para sa lungsod.
  alternative: Gamitin ang ‘kaniya’ upang idiin ang lungsod bilang babaing ikakasal.
  rationale: Tunay na inilalarawan sa kabanata ang Bagong Jerusalem bilang babaing ikakasal, ngunit sa talatang ito ang pinakamalapit na larawan ay panlungsod at panlunan. Hindi likas na may kasariang pambabae ang panghalip sa Tagalog, kaya hindi dapat ipilit ang gramatikal na kasarian ng Griyego o palakasin nang labis ang pagsasatao.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang matingkad na larawang ‘lalakad’ at ang salitang ‘kaluwalhatian’ dahil sa kanilang biblikal na alingawngaw, habang iniwasan ang di-likas na pagsasatao sa panghalip.
