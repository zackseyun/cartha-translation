id: REV.21.3
reference: Revelation 21:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: tl
  text: At narinig ko ang isang malakas na tinig mula sa trono na nagsasabi, “Masdan ninyo! Ang tahanan ng Diyos ay nasa piling ng sangkatauhan.[a] Mananahan siyang kasama nila,[b] at sila ay magiging mga bayan niya.[c] Ang Diyos mismo ay magiging kasama nila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang tolda ng Diyos” o “ang tabernakulo ng Diyos.” Ang salitang ito ay nagpapagunita sa tolda bilang lugar ng presensya ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “mananahan” ay kaugnay ng salitang “tolda” sa naunang pangungusap; mas literal, “mananahan siya sa tolda kasama nila” o “itatayo niya ang kanyang tolda kasama nila.”
    reason: lexical_alternative
  - marker: c
    text: 'Maramihan sa Griyego: “mga bayan” o “mga sambayanan niya,” hindi ang tradisyonal na isahang “bayan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: isang malakas na tinig
  rationale: Likas sa modernong Tagalog ang “malakas na tinig” para sa lakas o lakas ng tunog ng tinig, habang pinananatili ang maringal na pahayag.
- source_word: ἐκ τοῦ θρόνου
  choice: mula sa trono
  rationale: Tuwirang ipinahahayag ang pinagmulan ng tinig at pinananatili ang mahalagang larawan ng trono sa Pahayag.
- source_word: Ἰδοὺ
  choice: Masdan ninyo!
  rationale: Pinananatili nito ang maringal at mapagtuong lakas ng ἰδού; ang maramihang anyo ay ang karaniwang dignipikadong panawagan sa mga tagapakinig sa Tagalog.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: ang tahanan ng Diyos
  rationale: Malinaw at likas itong nagpapahayag ng tirahan ng Diyos sa modernong Tagalog. Inilalagay sa talababa ang mas literal na “tolda/tabernakulo” upang mapanatili ang kaugnay na larawan.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: kasama na ng sangkatauhan
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki. Ang “na” ay natural na naghahayag ng bagong kalagayang ipinakikita sa pangitain.
- source_word: σκηνώσει
  choice: mananahan siya
  rationale: Malinaw na salin ng hinaharap na pandiwa; ipinaliliwanag sa talababa ang pagkakaugnay nito sa σκηνή at ang literal na larawan ng pagtira sa tolda.
- source_word: λαοὶ αὐτοῦ
  choice: mga bayan niya
  rationale: Pinananatili ng “mga bayan” ang tunay na maramihang λαοί at mas natural sa Tagalog kaysa “mga sambayanan niya,” nang hindi ginagawang isahan ang teksto.
- source_word: αὐτὸς ὁ θεός
  choice: Ang Diyos mismo
  rationale: Inihahayag ng “mismo” ang diin ng αὐτός sa personal at tuwirang presensya ng Diyos.
- source_word: μετ’ αὐτῶν ἔσται
  choice: makakasama nila
  rationale: Natural na modernong Tagalog para sa panghinaharap na “will be with them,” habang pinananatili ang pormula ng presensya ng Diyos.
theological_decisions:
- issue: Maramihang λαοὶ kumpara sa tradisyonal na isahang “bayan”
  choice: sila ay magiging mga bayan niya
  alternative: sila ay magiging bayan niya
  rationale: Maramihan ang pagbasa ng SBLGNT, kaya pinananatili ang “mga bayan” sa halip na ayusin ito ayon sa tradisyonal na isahan. Hindi tinutukoy ng salin kung paano eksaktong kaugnay ang maraming bayan sa pagkakaisa ng bayan ng Diyos.
- issue: Larawan ng tolda/tabernakulo sa σκηνή at σκηνόω
  choice: ang tahanan ng Diyos ... mananahan siya kasama nila
  alternative: ang tolda/tabernakulo ng Diyos ... magtatayo siya ng tolda at maninirahan kasama nila
  rationale: Ginagamit sa pangunahing teksto ang malinaw at natural na Tagalog, ngunit pinananatili sa mga talababa ang literal na larawan at ang pag-uulit ng magkaugnay na mga salitang Griyego.
- issue: Saklaw ng ἀνθρώπων
  choice: sangkatauhan
  alternative: mga tao
  rationale: Tumutukoy ang salita sa mga tao sa pangkalahatan. Ang “sangkatauhan” ay malinaw na kolektibo at hindi limitado ayon sa kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Masdan ninyo” upang mapanatili ang maringal na panawagan ng apokaliptikong pahayag; iniwasan ang mas teknikal na “tabernakulo” sa pangunahing teksto ngunit ipinaliwanag ito sa talababa. Ang lahat ng marker na [a]–[c] ay nasa mismong teksto.
