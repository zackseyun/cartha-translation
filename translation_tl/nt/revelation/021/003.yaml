revisions:
- from: At narinig ko ang isang malakas na tinig mula sa trono na nagsasabi, “Masdan ninyo! Ang tahanan ng Diyos ay kasama na ng sangkatauhan.[a] Mananahan siya kasama nila,[b] at sila ay magiging mga bayan niya.[c] Ang Diyos mismo ay makakasama nila.”
  to: At narinig ko ang isang malakas na tinig mula sa trono na nagsasabi, “Masdan ninyo! Ang tahanan ng Diyos ay nasa piling ng sangkatauhan.[a] Mananahan siyang kasama nila,[b] at sila ay magiging mga bayan niya.[c] Ang Diyos mismo ay magiging kasama nila.”
  rationale: Inalis ang hindi kinakailangang “na” at pinalitan ang hindi likas na “kasama ng sangkatauhan” ng “nasa piling ng sangkatauhan,” na malinaw na naghahayag ng presensiya ng Diyos kasama ng mga tao. Pinakinis ang mga pandiwang panghinaharap at inayos ang talababa upang mapanatili ang lexical na ugnayan ng σκηνή at σκηνόω nang walang idinagdag na interpretasyon. Napanatili ang maramihang λαοὶ at ang diin ng αὐτὸς ὁ θεός.
