  source_fidelity: Tumpak na naipapahayag ng draft ang tinig mula sa trono, ang paninirahan ng Diyos sa gitna ng sangkatauhan, ang maramihang λαοὶ (“mga bayan”), at ang mariing “ang Diyos mismo.” Gayunman, ang “kasama na ng sangkatauhan” ay nagpapasok ng aspektong “na” na wala sa Griyego at hindi likas sa konstruksiyong ito.
  naturalness: Mas natural at marangal sa modernong Filipino ang “ay nasa piling ng sangkatauhan” para sa μετὰ τῶν ἀνθρώπων, “mananahan siyang kasama nila” para sa σκηνώσει μετ’ αὐτῶν, at “magiging kasama nila” para sa μετ’ αὐτῶν ἔσται.
