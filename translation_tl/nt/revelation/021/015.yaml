  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: tl
  text: At ang kausap ko ay may gintong panukat na tungkod[a] upang sukatin ang lungsod, ang mga pintuan nito, at ang pader nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gintong panukat na tambo.” Ang salitang Griyego na κάλαμος ay literal na “tambo,” na maaari ring tumukoy sa isang tungkod na ginagamit sa pagsukat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: ang nagsasalita sa akin
  rationale: Likas sa modernong Tagalog at pinananatili ang paglalarawang nasa pangkasalukuyang participle. Hindi idinagdag ang “anghel,” sapagkat wala ang salitang iyon sa mismong talata.
- source_word: εἶχεν
  choice: ay may
  rationale: Tuwirang ipinapahayag ang pag-aari o pagkakaroon nang hindi ipinapalagay na tahasang hawak niya ito.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: gintong panukat na tungkod
  rationale: Ipinakikita ng “panukat” ang gamit ng instrumento, habang ang “tungkod” ay malinaw at likas na katumbas sa kontekstong ito. Ang literal na larawang “tambo” ay inilagay bilang alternatibo sa talababa.
- source_word: ἵνα μετρήσῃ
  choice: upang sukatin
  rationale: Ang “upang” ay malinaw na naghahayag ng layunin ng ἵνα na may subjunctive, nang hindi nagiging mabigat ang pangungusap.
- source_word: τὴν πόλιν
  choice: ang lungsod
  rationale: Karaniwan at eksaktong katumbas; hindi idinagdag sa talata ang pangalang Bagong Jerusalem.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: ang mga pintuan nito
  rationale: Ang πυλών ay tumutukoy sa pintuan o pasukan ng lungsod; “mga pintuan” ang pinakanatural at sapat na salin dito.
- source_word: τὸ τεῖχος αὐτῆς
  choice: ang pader nito
  rationale: Tumpak at karaniwang katumbas ng pader na nakapalibot sa lungsod, nang walang dagdag na interpretasyon.
theological_decisions:
- issue: Kung tahasang kikilalanin bilang anghel ang nagsasalita
  choice: Panatilihin ang “ang nagsasalita sa akin” nang hindi idinaragdag ang “anghel.”
  alternative: “Ang anghel na nagsasalita sa akin”
  rationale: Bagaman ipinakikilala ng mas malawak na konteksto ang tauhan bilang isa sa mga anghel, participial na paglalarawan lamang ang ginamit sa talatang ito. Pinananatili ng salin ang mismong pahayag ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “lungsod,” “pintuan,” at “pader” bilang natural na mga terminong pang-arkitektura. Iniwasan ang mas lumang ayos na “nakikipag-usap sa akin” dahil ang μετ’ ἐμοῦ dito ay natural na naipapahayag bilang “sa akin.”
