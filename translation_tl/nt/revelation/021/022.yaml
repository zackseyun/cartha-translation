id: REV.21.22
reference: Revelation 21:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: tl
  text: Wala akong nakitang templo sa loob nito[a], sapagkat ang Panginoong Diyos na Makapangyarihan sa lahat ang templo nito, gayundin ang Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santuwaryo.” Ang Griyegong ναός ay maaaring tumukoy nang mas tiyak sa panloob na santuwaryo ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: templo
  rationale: Ang “templo” ang malinaw at likas na katumbas sa modernong Tagalog. Pinananatili nito ang paghahambing sa kawalan ng gusaling templo at sa Diyos at sa Kordero bilang templo ng lungsod; inilalahad sa talababa ang mas tiyak na diwa ng ναός.
- source_word: οὐκ εἶδον
  choice: Wala akong nakitang
  rationale: Likas at tuwirang ipinapahayag nito ang ganap na kawalan ng templong nakita ng tagapagsalaysay, ayon sa aorist na εἶδον na may οὐκ.
- source_word: ἐν αὐτῇ
  choice: sa loob nito
  rationale: Ang panghalip ay tumutukoy sa lungsod. Hindi kailangang tumbasan sa Tagalog ang pambabaeng kasariang gramatikal ng salitang Griyego.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: ang Panginoong Diyos na Makapangyarihan sa lahat
  rationale: Pinananatili ang banal na titulong κύριος, ang tuwirang katawagang θεός, at ang diwa ng παντοκράτωρ bilang lubos at soberanong makapangyarihan, sa natural na anyong Tagalog.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: ang templo nito
  rationale: Inililipat nang natural sa Tagalog ang panaguring nagsasabing ang Panginoong Diyos mismo ang templo ng lungsod.
- source_word: καὶ τὸ ἀρνίον
  choice: gayundin ang Kordero
  rationale: Ipinakikita ng “gayundin” na kasama at kapantay na idinaragdag ang Kordero sa pahayag, habang napapanatili ang bahagyang pahabol na ayos ng Griyego sa halip na gawing tahasang maramihan ang pandiwa.
theological_decisions:
- issue: Pagkakaugnay ng “ang Panginoong Diyos ... ang templo nito, at ang Kordero”
  choice: Panatilihin ang Panginoong Diyos bilang pangunahing sugnay at idagdag ang Kordero sa pamamagitan ng “gayundin.”
  alternative: 'Gawing tuwirang tambalang paksa: “ang Panginoong Diyos ... at ang Kordero ang templo nito.”'
  rationale: Ang Griyego ay may isahang ἐστιν bago ang pahabol na καὶ τὸ ἀρνίον. Ang “gayundin ang Kordero” ay nagpapanatili sa anyong ito at malinaw pa ring isinasama ang Kordero bilang templo ng lungsod, nang hindi pinapahina o higit na isinasaayos ang teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa loob nito” at “templo nito” dahil hindi karaniwang minamarkahan sa Tagalog ang kasariang gramatikal ng lungsod. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
