  source_fidelity: Tumpak na naipapahayag ang kawalan ng templo sa lungsod at ang pahayag na ang Panginoong Diyos na Makapangyarihan sa lahat at ang Kordero ang templo nito. Ang “gayundin ang Kordero” ay isang likas na Tagalog na pahabol na malinaw na isinasama ang Kordero nang hindi pinipilit lutasin ang bahagyang di-pangkaraniwang ayos ng Griyego, na may isahang ἐστιν bago ang καὶ τὸ ἀρνίον.
  naturalness: Marangal, malinaw, at natural sa modernong Filipino Tagalog ang “Wala akong nakitang templo sa loob nito” at ang mga titulong “Panginoong Diyos na Makapangyarihan sa lahat.” Ang “sa loob nito” ay katanggap-tanggap na pagsasalin ng ἐν αὐτῇ sa pagtukoy sa lungsod.
  terminology: Ang “templo” ay wastong katumbas ng ναός sa kontekstong ito; ang talababa ay angkop na nagbibigay ng “santuwaryo” bilang alternatibo. Wasto at pare-pareho rin ang “Panginoon,” “Diyos,” “Makapangyarihan sa lahat,” at “Kordero.”
