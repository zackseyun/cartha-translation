id: REV.21.19
reference: Revelation 21:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: tl
  text: 'Ang mga pundasyon ng pader ng lungsod ay pinalamutian ng bawat uri ng mahalagang bato[a]: ang unang pundasyon ay jaspe, ang ikalawa ay safiro, ang ikatlo ay kalsedonia[b], at ang ikaapat ay esmeralda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ng bawat mahalagang bato.” Maaaring unawain nang distributibo ang pariralang Griyego, kaya “bawat uri ng mahalagang bato.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kalsedonia” ang nakaugaliang salin ng salitang Griyego; hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga batong hiyas noong sinaunang panahon.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ θεμέλιοι
  choice: mga pundasyon
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga pundasyon o mga bahaging pundasyon ng pader. Likas at hindi labis na mapagpaliwanag sa Filipino ang “mga pundasyon.”
- source_word: τοῦ τείχους τῆς πόλεως
  choice: ng pader ng lungsod
  rationale: Direktang pinananatili ang ugnayan ng “pader” at “lungsod” sa Griyego, nang hindi dinaragdagan ng ideya ng isang tiyak na uri ng tanggulan.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: ng bawat uri ng mahalagang bato
  rationale: Likas na ipinahahayag sa Filipino ang posibleng distributibong diwa ng παντί, habang kinikilala sa talababa ang mas literal na alternatibo.
- source_word: κεκοσμημένοι
  choice: ay pinalamutian
  rationale: Pinananatili ang pasibong diwa at ang natapos na kalagayan ng pagkakapalamuti na ipinahihiwatig ng perfect passive participle.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: ang unang pundasyon
  rationale: Tinutukoy nang paisa-isa ang bawat pundasyon sa pagkakasunod-sunod; hindi idinaragdag sa pangunahing teksto ang salitang “bato,” na posible ngunit mas mapagpaliwanag.
- source_word: ἴασπις
  choice: jaspe
  rationale: Karaniwan at nakikilalang katawagang Filipino para sa jasper.
- source_word: σάπφιρος
  choice: safiro
  rationale: Karaniwang katawagang Filipino para sa sapphire at angkop sa marangal na talaan ng mga hiyas.
- source_word: χαλκηδών
  choice: kalsedonia
  rationale: Ginagamit ang nakaugaliang anyong hango sa pangalan ng sinaunang batong ito, habang inilalahad sa talababa na hindi tiyak ang eksaktong pagkakakilanlan nito.
- source_word: σμάραγδος
  choice: esmeralda
  rationale: Karaniwan at malamang na katumbas sa Filipino ng sinaunang pangalan ng hiyas.
theological_decisions:
- issue: Paglalarawan sa mga hiyas sa apokaliptikong pangitain
  choice: Isinalin nang tuwiran ang mga pangalan ng mga bato nang walang simbolikong paliwanag sa pangunahing teksto.
  alternative: Iugnay sa mismong salin ang bawat bato sa mga lipi ng Israel, sa mga apostol, o sa kasuotan ng punong pari.
  rationale: Inililista lamang ng talata ang mga palamuti at hindi nito ipinaliliwanag ang kahulugang simboliko ng bawat isa. Pinananatili ng salin ang larawan at hindi ipinapasok ang isang teolohikong pakahulugan na wala sa Griyegong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maindayog na pagkakasunod-sunod ng apat na pundasyon at gumamit ng mga katawagang madaling makilala para sa mga hiyas. Inilagay ang mga pananda ng talababa sa mismong pariralang tinatalakay ng bawat tala.
