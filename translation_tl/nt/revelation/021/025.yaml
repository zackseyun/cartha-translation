  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “mga pintuan nito” ay angkop para sa πυλῶνες sa larawan ng lungsod; ang “hinding-hindi isasara” ay malinaw na nagpapahayag ng mariing panghinaharap na pagtanggi ng οὐ μὴ κλεισθῶσιν; at ang “sapagkat” ay pinananatili ang paliwanag na γάρ. Ang “sa maghapon” ay likas na temporal na katumbas ng ἡμέρας at mahusay na inihahambing sa kasunod na “gabi.”
