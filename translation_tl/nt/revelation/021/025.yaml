  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: tl
  text: At ang mga pintuan nito ay hinding-hindi isasara sa maghapon, sapagkat wala nang gabi roon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “ang mga pintuan nito ay tiyak na hindi kailanman isasara sa maghapon.” Mariin ang pagtanggi sa Griyego.'
    reason: lexical_alternative
  - marker: b
    text: 'Ang ibinigay na dahilan ay: “sapagkat wala nang gabi roon.”'
    reason: cross_reference
lexical_decisions:
- source_word: πυλῶνες
  choice: mga pintuan
  rationale: Sa konteksto ng isang lungsod, tumutukoy ito sa mga pintuan o pasukan ng lungsod. Natural at malinaw sa modernong Tagalog ang “mga pintuan.”
- source_word: οὐ μὴ κλεισθῶσιν
  choice: hinding-hindi isasara
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi hinggil sa hinaharap. Inihahayag ng “hinding-hindi isasara” ang diin at ang aspektong panghinaharap.
- source_word: ἡμέρας
  choice: sa maghapon
  rationale: Ginagamit ang genitive bilang panandang pamanahon. Ang “sa maghapon” ay likas sa Tagalog at malinaw na kasalungat ng kasunod na “gabi.”
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: sapagkat wala nang gabi roon
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ibinibigay ng γάρ, samantalang likas na ipinahahayag ng “wala nang gabi roon” ang eksistensiyal na diwa at ang kalagayang panghinaharap.
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang paglalarawan ng lungsod.
- source_word: αὐτῆς
  choice: nito
  rationale: Ang pambabaeng anyo sa Griyego ay umaayon sa gramatikal na kasarian ng tinutukoy na lungsod. Hindi kailangang gawing pambabae sa Tagalog; natural at hindi labis ang personipikasyon sa “nito.”
theological_decisions:
- issue: Antas ng personipikasyon ng Bagong Jerusalem
  choice: Gamitin ang “mga pintuan nito,” hindi ang anyong tahasang pambabae.
  alternative: mga pintuan niya
  rationale: Ang pambabaeng panghalip sa Griyego ay bunga ng gramatikal na kasarian ng lungsod. Hindi kailangang ipilit iyon sa Tagalog, at nakatuon ang talata sa laging bukás na lungsod at sa kawalan ng gabi.
- issue: Kahulugan ng pagkawala ng gabi
  choice: Panatilihin ang tuwirang pahayag na “wala nang gabi roon.”
  alternative: Ipaliwanag ito bilang sagisag lamang ng lubos na katiwasayan o kawalan ng kasamaan.
  rationale: Hindi nililinaw ng mismong talata kung dapat unawain ang pahayag nang literal, matalinghaga, o kapwa; kaya hindi ito dapat tahimik na pagpasyahan sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “hinding-hindi” upang maipakita ang mariing pagtanggi, at “sapagkat” upang tahasang mapanatili ang paliwanag na γάρ. Ang mga panandang talababa [a][b] ay nakalagay sa pangunahing teksto.
