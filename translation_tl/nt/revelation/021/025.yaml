  terminology: Ang “mga pintuan,” “hinding-hindi,” at “sapagkat” ay wastong pinili at kaayon ng antas ng diin, ugnayang lohikal, at imaheng panglungsod ng Griyego. Wasto ring hindi ipilit ang pambabaeng panghalip ng Griyego sa Tagalog.
