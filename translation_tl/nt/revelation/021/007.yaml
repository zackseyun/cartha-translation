  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: tl
  text: Ang nagtatagumpay ay magmamana ng mga ito[a], at ako ay magiging Diyos niya, at siya ay magiging anak kong lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang nananaig.” Ang pandiwang Griyego na νικάω ay paulit-ulit na ginagamit sa Pahayag para sa tapat na pagtatagumpay o pananaig.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “siya ay magiging anak na lalaki ko.” Ang panlalaking katawagan ay malamang na kumakatawan dito sa sinumang nagtatagumpay, ngunit pinananatili ng salin ang wika ng pagiging anak na lalaki sa pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Ang nagtatagumpay
  rationale: Ang may pantukoy na pangkasalukuyang pandiwaring Griyego ay tumutukoy sa taong kinakikitaan ng patuloy na pagtatagumpay. Natural ito sa modernong Tagalog at umaayon sa paulit-ulit na gamit ng νικάω sa Pahayag.
- source_word: κληρονομήσει
  choice: magmamana
  rationale: Tuwirang ipinapahayag nito ang pagtanggap bilang mana at pinananatili ang ugnayang pampamilya at pangtipan na kaugnay ng sumunod na pahayag tungkol sa Diyos at sa anak.
- source_word: ταῦτα
  choice: ng mga bagay na ito
  rationale: Pinananatili nito ang pangmaramihang pantukoy ng Griyego at malinaw na tumutukoy sa mga bagay na inilarawan sa naunang pangitain.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: ako ang magiging Diyos niya
  rationale: Natural na Tagalog ito para sa pormulang pangtipan at pinananatili ang personal at relasyonal na diwa ng datibong αὐτῷ.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: siya ay magiging anak ko
  rationale: Ito ang natural na paraan sa Tagalog upang ipahayag ang relasyong magulang-anak. Bagaman hindi likas na nagtatangi ng kasarian ang salitang “anak,” nililinaw sa talababa na panlalaki ang υἱός sa Griyego upang hindi mawala ang orihinal na larawang pangmana at pang-anak.
theological_decisions:
- issue: Panlalaking katawagang υἱός sa pangakong pangkalahatang iniuukol sa nagtatagumpay
  choice: Gamitin ang natural na “anak ko” sa pangunahing teksto at ilahad sa talababa na “anak na lalaki” ang literal na Griyego
  alternative: anak na lalaki ko
  rationale: Ang “anak na lalaki ko” ay tahasang nagpapanatili ng kasarian ngunit hindi natural sa ganitong pangungusap sa modernong Tagalog. Ang “anak ko” ay malinaw na nagpapanatili ng relasyong pampamilya, samantalang ang talababa ay nagpapanatili sa panlalaking anyo at sa posibleng kinatawang saklaw nito.
- issue: Alingawngaw ng pormulang pangtipan
  choice: ako ang magiging Diyos niya, at siya ay magiging anak ko
  alternative: ako ay magiging Diyos para sa kanya, at siya ay magiging isang anak para sa akin
  rationale: Pinananatili ng piniling anyo ang relasyong pangtipan at pag-aampon nang hindi nagdaragdag ng paliwanag o doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikli at taimtim na hulma ng pahayag, gayundin ang ugnayan ng mana, tipan, at pagiging anak.
