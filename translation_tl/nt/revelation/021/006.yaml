id: REV.21.6
reference: Revelation 21:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: tl
  text: At sinabi niya sa akin, “Naganap na ang mga ito.[a] Ako ang Alpha at ang Omega, ang simula at ang wakas. Ang nauuhaw ay bibigyan ko nang walang bayad ng tubig mula sa bukal ng tubig ng buhay.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Tapos na.” Pangmaramihan ang pandiwang Griyego: “naganap na ang mga ito” o “naganap na ang mga bagay na ito.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “libre” o “bilang kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Naganap na ang mga ito
  rationale: Ipinakikita ang pangmaramihang anyo ng pandiwang Griyego at ang ganap nang katuparan ng mga ipinahayag na realidad, sa halip na gawing pang-isahan ang pahayag.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: ang Alpha at ang Omega
  rationale: Pinananatili ang mga pangalan ng titik Griyego bilang kinikilalang simbolikong titulo sa Pahayag; nililinaw agad ito ng kasunod na pariralang “ang simula at ang wakas.”
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: ang simula at ang wakas
  rationale: Likas at tuwirang katumbas na nagpapanatili sa lawak ng kahulugang temporal at patungkol sa layunin nang hindi labis na nagpapakahulugan.
- source_word: τῷ διψῶντι
  choice: ang nauuhaw
  rationale: Natural na pangkalahatang pagtukoy sa isang taong nauuhaw, habang pinananatili ang personal at pang-isahang anyo ng Griyego.
- source_word: δώσω
  choice: bibigyan ko
  rationale: Tuwirang hinaharap na pangako na hindi nangangailangan ng pagpapalawak.
- source_word: ἐκ τῆς πηγῆς
  choice: mula sa bukal
  rationale: Ang “bukal” ay malinaw at likas na katumbas ng πηγή at angkop sa larawang nagbibigay-buhay.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: ng tubig ng buhay
  rationale: Pinananatili ang pagkakaugnay ng mga parirala at ang nakaugaliang larawang biblikal sa halip na gawing paliwanag na “tubig na nagbibigay-buhay.”
- source_word: δωρεάν
  choice: nang walang bayad
  rationale: Malinaw na ipinahahayag na ang ibinibigay ay libre o kaloob, at mas tiyak ito sa modernong Tagalog kaysa sa posibleng malabong “nang libre.”
theological_decisions:
- issue: Ang pangmaramihang pahayag na Γέγοναν sa deklarasyon ng Diyos
  choice: Naganap na ang mga ito
  alternative: Tapos na
  rationale: Pinananatili nito ang pangmaramihang anyo at iniuugnay ang pahayag sa katuparan ng mga naunang ipinahayag na bagay, nang hindi ipinapantay sa isang pang-isahang tradisyonal na pormula.
- issue: Pagpapanatili sa Alpha at Omega bilang banal na titulo
  choice: ang Alpha at ang Omega
  alternative: ang A at ang Z
  rationale: Pinananatili ang mismong larawang Griyego at ang pagkakaugnay nito sa ibang bahagi ng Pahayag, nang hindi nagdaragdag ng sektaryanong paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga titulong Alpha at Omega at ang larawang “tubig ng buhay.” Inayos ang mga pananda ng talababa upang lumitaw ang [a] pagkatapos ng pahayag na tinutukoy nito at ang [b] pagkatapos ng pangungusap na naglalaman ng δωρεάν.
