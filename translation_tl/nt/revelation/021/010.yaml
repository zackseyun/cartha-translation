id: REV.21.10
reference: Revelation 21:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: tl
  text: At sa Espiritu[a], dinala niya ako sa isang malaki at mataas na bundok, at ipinakita niya sa akin ang banal na lungsod, ang Jerusalem, na bumababa mula sa langit, mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa espiritu.” Maaaring tumukoy ang pariralang Griyego sa isang kalagayan ng pangitain; sa Pahayag, karaniwan itong nagpapakilala ng propetikong pangitain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: dinala
  rationale: Likas na salin ito para sa paglilipat sa tagpo ng pangitain; ipinahihiwatig ng kasunod na parirala ang pagdadala sa ibang kinalalagyan nang hindi nagdaragdag ng paraang wala sa teksto.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Pinananatili nito ang maikling pormulang ginagamit sa Pahayag para sa kalagayan o paraang propetiko ng pangitain, habang ang malaking titik ay nagpapahiwatig ng malamang na pagkilos ng Banal na Espiritu ngunit hindi ito ipinapaliwanag sa mismong talata.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: sa isang malaki at mataas na bundok
  rationale: Ang “sa” ay natural na Filipino para sa patutunguhan ng pagdadala; kapwa pinanatili ang magkahiwalay na paglalarawang “malaki” at “mataas.”
- source_word: ἔδειξέν μοι
  choice: ipinakita niya sa akin
  rationale: Tuwirang salin na hindi nagdaragdag ng mas tiyak na diwang tulad ng “inihayag.”
- source_word: τὴν πόλιν τὴν ἁγίαν
  choice: ang banal na lungsod
  rationale: Karaniwan at malinaw na katumbas ng πόλις at ἁγία sa makabagong biblikal na Filipino.
- source_word: Ἰερουσαλήμ
  choice: ang Jerusalem
  rationale: Ginagamit ang nakaugaliang anyo ng pangalan; ang “ang” ay nilalagay upang ipakitang ang Jerusalem ang mismong banal na lungsod.
- source_word: καταβαίνουσαν
  choice: na bumababa
  rationale: Pinananatili ang kasalukuyang kilos ng participle at mas natural ito sa Filipino kaysa sa mas pormal na “lumulusong.”
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Natural na Filipino ang “mula sa” para sa pinanggalingan; malinaw na ang lungsod ay nagmumula sa langit.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Tumpak na pinananatili ang Diyos bilang pinagmulan nang hindi idinaragdag ang “presensya ng.”
theological_decisions:
- issue: Tinutukoy ng ἐν πνεύματι
  choice: “sa Espiritu,” na may malaking titik
  alternative: “sa espiritu,” bilang di-tiyak na espirituwal o pangitain na kalagayan
  rationale: Sa Pahayag, paulit-ulit na pormula ito sa pagpapakilala ng propetikong pangitain. Ipinahihiwatig ng malaking titik ang malamang na pagkilos ng Banal na Espiritu, samantalang pinananatili ng talababa ang tunay na posibilidad ng mas di-tiyak na pagbasa.
- issue: Ugnayan ng “ang Jerusalem” sa “ang banal na lungsod”
  choice: 'appositive: ang Jerusalem ang banal na lungsod na ipinakita'
  alternative: basahing magkahiwalay na pagtukoy ang lungsod at ang Jerusalem
  rationale: Ang magkasunod na accusative na parirala sa Griyego ay likas na nagpapakilala sa banal na lungsod bilang Jerusalem; hindi kinakailangang magdagdag ng pandiwang “tinatawag na.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ritmo ng pangungusap at ang dalawang parirala ng pinagmulan—“mula sa langit, mula sa Diyos”—upang huwag pag-isahin ang magkaibang preposisyong Griyego. Ang marker na [a] ay inilagay kaagad pagkatapos ng “sa Espiritu.”
