id: REV.21.20
reference: Revelation 21:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: tl
  text: ang ikalima, sardonyx; ang ikaanim, sardio[a]; ang ikapito, crisolito; ang ikawalo, berilo; ang ikasiyam, topacio; ang ikasampu, crisopraso; ang ikalabing-isa, jacinto[b]; at ang ikalabindalawa, amatista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “carnelian”; hindi tiyak ang eksaktong pagkakakilanlan sa sinaunang batong hiyas na ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “jacinto” rito ay isang batong hiyas, hindi ang bulaklak.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: sardonyx
  rationale: Ginamit ang kinikilalang pangalang mineral upang maiba ito sa kasunod na σάρδιον.
- source_word: σάρδιον
  choice: sardio
  rationale: Pinanatili ang tradisyonal na katawagan sa batong hiyas; maaaring tumukoy ito sa carnelian, ngunit hindi tiyak ang eksaktong pagkakakilanlan sa sinaunang panahon.
- source_word: χρυσόλιθος
  choice: crisolito
  rationale: Ito ang nakaugaliang katawagang Filipino sa chrysolite at mas malinaw kaysa literal na 'batong ginto.'
- source_word: βήρυλλος
  choice: berilo
  rationale: Karaniwang katawagang Filipino sa beryl.
- source_word: τοπάζιον
  choice: topacio
  rationale: Karaniwang katawagang Filipino sa topaz.
- source_word: χρυσόπρασος
  choice: crisopraso
  rationale: Kinikilalang katawagan sa chrysoprase; ang literal na etimolohikal na salin ay magiging malabo.
- source_word: ὑάκινθος
  choice: jacinto
  rationale: Tradisyonal na katawagan sa batong hiyas; nililinaw sa talababa na hindi bulaklak ang tinutukoy.
- source_word: ἀμέθυστος
  choice: amatista
  rationale: Karaniwang katawagang Filipino sa amethyst.
