id: REV.21.16
reference: Revelation 21:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: tl
  text: 'Ang lungsod ay nakatatag nang parisukat, at ang haba nito ay kasinghaba ng lapad nito. Sinukat niya ang lungsod gamit ang panukat na tungkod[a]: labindalawang libong estadio[b]. Magkakapantay ang haba, lapad, at taas nito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit ang tambo.” Ang salitang Griyego ay maaaring mangahulugang “tambo,” ngunit dito ay tumutukoy ito sa isang kasangkapang panukat.
    reason: lexical_alternative
  - marker: b
    text: Ang estadio ay isang sinaunang yunit ng layo. Ang labindalawang libong estadio ay humigit-kumulang 2,220 kilometro, depende sa ipinalalagay na eksaktong haba ng isang estadio.
    reason: cultural_note
  - marker: c
    text: Sa mas interpretatibong pananalita, “ang lungsod ay isang ganap na kubo.” Tuwirang sinasabi ng Griyego na magkakapantay ang haba, lapad, at taas nito.
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος κεῖται
  choice: nakalatag na parisukat
  rationale: Ipinapahayag nito ang parisukat na anyo o pagkakaayos ng lungsod habang pinananatili ang diwa ng κεῖται bilang pagkakalatag o pagkakatayo nito.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: ang haba nito ay kasinlaki ng lapad nito
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang pagkakapantay ng sukat na tinutukoy ng ὅσον.
- source_word: ἐμέτρησεν
  choice: sinukat niya
  rationale: Tuwirang salin ng payak na pandiwang pasalaysay; ang tinutukoy ng 'niya' ay makikilala mula sa konteksto.
- source_word: τῷ καλάμῳ
  choice: gamit ang panukat na tungkod
  rationale: Maaaring mangahulugan ang κάλαμος na tambo, ngunit dito ay gamit ito sa pagsukat; nililinaw ng salin ang tungkulin ng bagay nang hindi binabago ang referent.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: labindalawang libong estadio
  rationale: Pinananatili ang sinaunang yunit at likas na isinasama sa Tagalog ang preposisyong nagsasaad ng kinalabasang sukat.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Magkakapantay ang haba, lapad, at taas nito
  rationale: Tuwirang ipinapahayag ang pagkakapantay ng tatlong dimensiyon nang hindi pinapalitan ng interpretatibong katawagang heometriko.
theological_decisions:
- issue: Kung pananatilihin ang sinaunang yunit o papalitan ito ng makabagong katumbas sa pangunahing teksto
  choice: Panatilihin ang “labindalawang libong estadio” sa pangunahing teksto
  alternative: Humigit-kumulang 2,220 kilometro
  rationale: Sinaunang yunit ang tahasang ibinigay ng Griyego. Nag-iiba nang bahagya ang makabagong katumbas ayon sa ipinapalagay na haba ng isang stadion, kaya mas angkop itong ilagay sa talababa.
- issue: Kung tahasang tatawaging kubo ang anyo ng lungsod
  choice: Sabihing magkakapantay ang haba, lapad, at taas
  alternative: Ang lungsod ay isang ganap na kubo
  rationale: Iyon mismo ang pahayag ng Griyego. Bagaman kubo ang ipinahihiwatig, hindi ginagamit ng teksto ang katawagang iyon, kaya pinananatili ang pahayag at ang puwang para sa interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nakalatag na parisukat” upang mailarawan ang ayos ng lungsod, at “panukat na tungkod” upang maging malinaw ang gamit ng κάλαμος. Pinanatili ang “estadio” bilang sinaunang yunit, na ipinaliwanag sa talababa.
