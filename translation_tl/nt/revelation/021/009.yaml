revisions:
- from: Pagkatapos, dumating ang isa sa pitong anghel na may pitong mangkok na punô ng pitong huling salot. Kinausap niya ako at sinabi, “Halika, ipapakita ko sa iyo ang babaeng ikakasal, ang asawa ng Kordero.”
  to: Pagkatapos, dumating ang isa sa pitong anghel na may pitong mangkok at puspos ng pitong huling salot. Kinausap niya ako at sinabi, “Halika, ipapakita ko sa iyo ang nobya, ang asawa ng Kordero.”
  rationale: 'Iniayon ang saklaw ng “puspos ng pitong huling salot” sa panlalaking anyo ng Griyego at pinalitan ang di-tuwirang “babaeng ikakasal” ng “nobya.” Walang footnote ang kailangan: ang rebisyon ay tuwirang pagsasalin ng tekstong Griyego, bagaman naiiba ito sa syntactic na pagpapakahulugan ng English audit trail.'
