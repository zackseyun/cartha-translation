id: REV.21.9
reference: Revelation 21:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: tl
  text: Pagkatapos, dumating ang isa sa pitong anghel na may pitong mangkok at puspos ng pitong huling salot. Kinausap niya ako at sinabi, “Halika, ipapakita ko sa iyo ang nobya, ang asawa ng Kordero.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Pagkatapos
  rationale: Ipinahahayag ang pagsulong ng salaysay habang pinananatili ang puwersa ng pang-ugnay.
- source_word: ἦλθεν
  choice: dumating
  rationale: Likas na salin sa Filipino para sa paglapit o pagdating ng anghel sa tagapagsalaysay.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: isa sa pitong anghel
  rationale: Natural na Filipino para sa partitive construction.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: na may pitong mangkok
  rationale: Tinutukoy ang anghel bilang kabilang sa mga may taglay na pitong φιάλαι; mas wasto ang 'mangkok' kaysa 'sisidlan' o tradisyonal na 'bote.'
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: na punô ng pitong huling salot
  rationale: Pinananatili ang literal na diwang 'being full of' at ang sunud-sunod na kahulugan ng ἐσχάτων.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: Kinausap niya ako
  rationale: Natural na Filipino para sa pakikipagsalita sa tagapagsalaysay; ipinahihiwatig ng pandiwang may ka- ang relational na diwa ng μετά.
- source_word: Δεῦρο
  choice: Halika
  rationale: Maikli at natural na paanyaya o utos sa Filipino.
- source_word: δείξω σοι
  choice: ipapakita ko sa iyo
  rationale: Tuwirang ipinapahayag ang future indicative.
- source_word: τὴν νύμφην
  choice: ang babaeng ikakasal
  rationale: Sa modernong Filipino, malinaw nitong tinutukoy ang bride at iniiwasan ang posibleng pagkalito ng 'nobya' bilang kasintahan lamang.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: ang asawa ng Kordero
  rationale: Sa apposition sa νύμφη, ang γυνή ay tumutukoy sa asawa; pinananatili ang dalawang larawang pangkasal.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Pinananatili bilang titulong kristolohikal sa Pahayag, na may malaking titik ayon sa gamit sa Filipino.
theological_decisions:
- issue: Ugnayan ng νύμφην at γυναῖκα
  choice: 'Parehong tahasang isinalin: “ang babaeng ikakasal, ang asawa ng Kordero”'
  alternative: “ang nobya, ang asawa ng Kordero” o “ang babaeng ikakasal na asawa ng Kordero”
  rationale: Dalawang pangngalang magkatabing nagpapaliwanag ang nasa Griyego. Ang pagpapanatili sa dalawa ay hindi nagpapahina o tahimik na nagpapakahulugan sa larawang pangkasal.
- issue: ἀρνίον bilang titulong kristolohikal
  choice: Kordero
  alternative: batang tupa
  rationale: Ang 'Kordero' ay malinaw at dignified na kinikilalang titulo sa konteksto ng Pahayag, nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “Kinausap niya ako at sinabi” sa halip na mas matigas na “nagsalita siyang kasama ko, na sinasabi,” ngunit pinanatili ang diwang relational ng μετ’ ἐμοῦ. Walang footnote dahil walang mahalagang ambigüidad na nangangailangan ng tala sa publikasyong ito.
