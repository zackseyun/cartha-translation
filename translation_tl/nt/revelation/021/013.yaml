base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: tl
  text: Sa silangan[a] ay may tatlong pintuan, at sa hilaga ay may tatlong pintuan, at sa timog ay may tatlong pintuan, at sa kanluran ay may tatlong pintuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Mula sa silangan … mula sa hilaga … mula sa timog … mula sa kanluran.” Dito, isinalin ang parirala ayon sa diwa upang ipakita kung saang panig naroon ang mga pintuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: Sa silangan
  rationale: Sa paglalarawang ito ng ayos ng lungsod, ang parirala ay tumutukoy sa panig na kinaroroonan ng mga pintuan. Mas natural ito sa Tagalog kaysa sa literal na “mula sa silangan,” na maaaring magpahiwatig ng pinagmulan o paggalaw.
- source_word: πυλῶνες
  choice: mga pintuang-daan
  rationale: Ang πυλών ay maaaring tumukoy sa pintuan o buong pasukang kayarian. Ang “pintuang-daan” ay malinaw at angkop sa maringal na mga pasukan sa pader ng lungsod nang hindi ipinapalagay na mga tore ang mga ito.
- source_word: τρεῖς
  choice: tatlo/tatlong
  rationale: Tuwirang salin ng bilang; inulit sa bawat panig upang mapanatili ang sukat at simetriya ng Griyego.
- source_word: ἀπὸ βορρᾶ
  choice: sa hilaga
  rationale: Tumutukoy sa hilagang panig ng lungsod, hindi sa pinagmulan ng pagkilos.
- source_word: ἀπὸ νότου
  choice: sa timog
  rationale: Tumutukoy sa timog na panig at pinananatiling kaayon ng iba pang direksiyon.
- source_word: ἀπὸ δυσμῶν
  choice: sa kanluran
  rationale: Ang δυσμαί ay tumutukoy sa paglubog ng araw at, bilang direksiyon, sa kanluran; “sa kanluran” ang natural na panumbas sa Tagalog.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: ay may ... ay may ... ay may ... at ... ay may ...
  rationale: Pinanatili ang paulit-ulit at maindayog na pagbilang, ngunit ginamit ang natural na sintaks ng Tagalog. Ang huling “at” ay malinaw na naghuhudyat sa huling bahagi ng talaan.
theological_decisions:
- issue: Paglalarawan sa lokasyon ng mga pintuan ng Bagong Jerusalem
  choice: Tuwirang paglalarawan ng tatlong pintuang-daan sa bawat isa sa apat na panig
  alternative: Hayagang tukuyin sa salin ang sagisag na kaugnayan nito sa pagkakaayos ng mga lipi ng Israel o sa pangitain ni Ezekiel
  rationale: Ang talata mismo ay nagtatala lamang ng bilang at kinalalagyan ng mga pintuan. Hindi isinama sa salin ang posibleng simbolismo upang manatiling bukas ang mga ugnayang teolohikal sa pagpapakahulugan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “pintuang-daan” upang ipahiwatig ang malalaking pasukan sa pader, at pinanatili ang simetriko at paulit-ulit na ayos ng talata.
