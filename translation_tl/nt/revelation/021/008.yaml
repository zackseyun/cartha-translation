id: REV.21.8
reference: Revelation 21:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: tl
  text: Ngunit ang mga duwag, mga hindi sumasampalataya[a], mga kasuklam-suklam, mga mamamatay-tao, mga gumagawa ng imoralidad na seksuwal, mga mangkukulam, mga sumasamba sa mga diyus-diyosan, at lahat ng sinungaling—ang magiging bahagi nila ay sa lawa na nagliliyab sa apoy at asupre[b]. Ito ang ikalawang kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hindi tapat.”
    reason: Pinananatili ang semantikong saklaw ng ἄπιστος, na maaaring mangahulugang hindi sumasampalataya o hindi tapat.
  - marker: b
    text: Ang “asupre” ay ang sangkap na tradisyonal na tinatawag na “brimstone” sa Ingles.
    reason: Nililinaw ang tradisyonal na katawagan nang hindi ito ipinapasok sa pangunahing tekstong Tagalog.
lexical_decisions:
- source_word: δειλοῖς
  choice: mga duwag
  rationale: Ipinahahayag ng δειλός ang kahiya-hiyang kaduwagan, hindi ang karaniwang pagkatakot lamang.
- source_word: ἀπίστοις
  choice: mga hindi sumasampalataya
  rationale: Sa talaang ito ng mga hahatulan, ito ang pinakadirektang kahulugan; inilagay sa talababa ang posibleng diwa na 'mga hindi tapat.'
- source_word: ἐβδελυγμένοις
  choice: mga kasuklam-suklam
  rationale: Pinananatili nito ang matinding moral na pagkasuklam ng perpektong partisipyong Griyego nang hindi gumagamit ng lipas na pananalita.
- source_word: φονεῦσι
  choice: mga mamamatay-tao
  rationale: Ang φονεύς ay tumutukoy sa murderer, hindi sa sinumang nakapatay lamang.
- source_word: πόρνοις
  choice: mga gumagawa ng imoralidad na seksuwal
  rationale: Malawak ang saklaw ng πόρνος at tumutukoy sa mga taong nagsasagawa ng seksuwal na imoralidad; malinaw at likas ito sa modernong Tagalog.
- source_word: φαρμάκοις
  choice: mga mangkukulam
  rationale: Sa konteksto ng Pahayag, tumutukoy ito sa mga nagsasagawa ng mahika o okultismo, hindi sa mga parmasyutiko.
- source_word: εἰδωλολάτραις
  choice: mga sumasamba sa mga diyus-diyosan
  rationale: Direkta at madaling maunawaang paglalarawan ito sa mga sumasamba sa mga idolo.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: lahat ng sinungaling
  rationale: Ang substantibong gamit ng ψευδής sa talaang ito ay likas na isinasaling 'mga sinungaling.'
- source_word: τὸ μέρος αὐτῶν
  choice: ang magiging bahagi nila
  rationale: Ang μέρος ay inilaan nilang bahagi o kahihinatnan; ginawang tahasan ang ipinahihiwatig na pandiwa para sa natural na Tagalog.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: sa lawa na nagliliyab sa apoy at asupre
  rationale: Pinananatili ang atribütibong larawan ng lawang nagliliyab at isinasalin ang θεῖον sa modernong terminong 'asupre.'
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: Ito ang ikalawang kamatayan
  rationale: Likas sa Tagalog ang demonstratibong pangungusap at malinaw nitong iniuugnay ang naunang lawa sa ikalawang kamatayan.
theological_decisions:
- issue: Kahulugan ng ἄπιστος sa talaan ng paghatol
  choice: mga hindi sumasampalataya
  alternative: mga hindi tapat
  rationale: Sa konteksto, malamang na tumutukoy ito sa kawalan ng pananampalataya, ngunit maaaring tumukoy rin sa kawalan ng katapatan; pinananatili ng talababa ang tunay na ambiguwidad.
- issue: Paglalarawan sa ikalawang kamatayan
  choice: Ito ang ikalawang kamatayan
  alternative: na siyang ikalawang kamatayan
  rationale: Hindi pinalalawak ang metapora o ipinapaliwanag ang kalikasan nito; pinananatili lamang ang pagkakakilanlang tahasang ibinibigay ng teksto.
- issue: Kahulugan ng θείῳ
  choice: asupre
  alternative: brimstone
  rationale: Ang 'asupre' ang tuwirang modernong katumbas sa Tagalog at hindi umaasa sa tradisyonal na terminolohiyang Ingles.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Inulit ang “mga” upang luminaw ang bawat pangkat sa mahabang talaan; gumamit ng em dash bago ang kahihinatnan upang mapadali ang pagbasa. Ang “imoralidad na seksuwal” ay pormal ngunit kasalukuyang gamit at sapat ang lawak para sa πόρνοις.
