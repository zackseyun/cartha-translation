  source_fidelity: 'Tumpak ang pagsasalin sa pangunahing mga bahagi ng Griyego: ang kilos ng pagsukat, ang pader ng lungsod, ang 144 na siko, at ang siksik na paliwanag tungkol sa panukat ng tao at ng anghel. Hindi nito pinipilit ang isang interpretasyon sa bahagyang malabong huling parirala.'
