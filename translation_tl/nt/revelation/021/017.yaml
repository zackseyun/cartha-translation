id: REV.21.17
reference: Revelation 21:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: tl
  text: 'At sinukat niya ang pader nito: 144 na siko, ayon sa panukat ng tao, na siya ring panukat ng anghel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “ayon sa panukat ng isang tao, samakatuwid ay ng isang anghel.” Maaaring idiin ng Griyego na gumamit ang anghel ng yunit ng pagsukat ng tao, o na magkatugma rito ang panukat ng tao at ng anghel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: sinukat
  rationale: Tuwirang ipinapahayag ng aorist active indicative ng μετρέω ang ginawang pagsukat; natural at eksakto ang “sinukat” sa modernong Tagalog.
- source_word: τεῖχος
  choice: pader
  rationale: Tumutukoy ang τεῖχος sa pader ng isang lungsod. Malinaw at karaniwan ang “pader” sa paglalarawan sa Bagong Jerusalem.
- source_word: αὐτῆς
  choice: nito
  rationale: Ang panghalip ay tumutukoy sa lungsod; natural sa Tagalog ang “nito” at hindi nito ipinipilit ang personipikasyon.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 na siko
  rationale: Pinananatili ang sinaunang yunit na πῆχυς bilang “siko” sa halip na tahasang iconvert, sapagkat mahalaga sa teksto ang mismong pamantayan ng pagsukat.
- source_word: μέτρον
  choice: panukat
  rationale: Maaaring tumukoy ang μέτρον sa sukat o pamantayan ng pagsukat. Ang “panukat” ay malinaw dito bilang pamantayang ginamit.
- source_word: ἀνθρώπου
  choice: ng tao
  rationale: Pangkalahatan ang ἄνθρωπος at hindi partikular sa lalaki; tumpak at likas ang “tao.”
- source_word: ὅ ἐστιν ἀγγέλου
  choice: na siya ring panukat ng anghel
  rationale: Nililinaw nito ang eliptikong Griyego habang pinananatili ang posibleng pagtutumbas ng panukat ng tao at ng anghel; ipinahihiwatig ng “rin” ang kaugnayang iyon nang hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Kahulugan ng μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Inilalahad ang sukat ayon sa panukat ng tao, na siya ring panukat ng anghel.
  alternative: Maaaring ang diin ay ginamit ng anghel ang karaniwang yunit ng tao, o na nagkatugma rito ang panukat ng tao at ng anghel.
  rationale: Siksik at bahagyang malabo ang Griyego. Pinananatili ng salin ang paliwanag at pagtutumbas nito nang hindi nagpapasya kung alin sa dalawang diin ang pangunahing layunin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “siko” bilang tradisyonal at maikling katawagan sa cubit; pinanatili ang sinaunang yunit. Ang tandang-paliwanag ay inilagay kaagad matapos ang sugnay na may interpretatibong kalabuan.
