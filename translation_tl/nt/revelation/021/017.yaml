  terminology: Ang “siko” ay angkop na tradisyonal na katumbas ng cubit, at ang “panukat” ay angkop para sa μέτρον bilang pamantayan ng pagsukat. Wasto at inklusibo ang “tao” para sa ἀνθρώπου. Ang “anghel” ay pare-pareho sa karaniwang terminolohiyang biblikal sa Tagalog.
