id: REV.21.12
reference: Revelation 21:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: tl
  text: Mayroon itong isang malaki at mataas na pader at labindalawang pintuang-bayan. Sa mga pintuang-bayan ay may labindalawang anghel, at may mga pangalang nakasulat—ang mga pangalan ng labindalawang lipi ng mga anak ni Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχουσα
  choice: Mayroon itong
  rationale: Ang pambabaeng pang-isahang participle ay tumutukoy sa lungsod sa naunang talata. Ginawang likas na sugnay sa Filipino habang pinananatili ang paglalarawan sa lungsod.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: isang malaki at mataas na pader
  rationale: Magkahiwalay na pinananatili ang dalawang pang-uri nang hindi pinagsasama ang kahulugan ng μέγα at ὑψηλόν.
- source_word: πυλῶνας δώδεκα
  choice: labindalawang pintuang-bayan
  rationale: Mas tiyak sa konteksto ng napapaderang lungsod kaysa sa payak na “pinto,” at likas sa makabagong Filipino.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: Sa mga pintuang-bayan
  rationale: Ipinahahayag ang lokatibong diwa ng ἐπί na may datibo at hindi ipinahihiwatig na nasa ibabaw mismo ng mga tarangkahan ang mga anghel.
- source_word: ἀγγέλους δώδεκα
  choice: labindalawang anghel
  rationale: Tuwiran at karaniwang katumbas sa kontekstong ito.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: mga pangalang nakasulat
  rationale: Inihahatid ang diwa ng mga pangalang isinulat sa isang bagay nang hindi labis na tinutukoy na tiyak na inukit ang mga ito.
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: ang mga pangalan ng labindalawang lipi
  rationale: Ginagawang malinaw sa natural na Filipino ang ipinahihiwatig na kaugnayan ng mga pangalan sa labindalawang lipi.
- source_word: υἱῶν Ἰσραήλ
  choice: mga anak ni Israel
  rationale: Ang “mga anak ni Israel” ay likas at matatag na katawagang pangkabuuan sa Filipino; hindi nito maling nililimitahan ang tinutukoy sa labindalawang sariling anak na lalaki ni Jacob.
theological_decisions:
- issue: Ang korporatibong katawagang υἱῶν Ἰσραήλ
  choice: mga anak ni Israel
  alternative: mga anak na lalaki ni Israel
  rationale: Bagaman panlalaki ang anyong Griyego, ang parirala rito ay katawagan sa bayang binubuo ng mga lipi. Pinananatili ng “mga anak ni Israel” ang larawang pampamilya at ang nakagawiang katawagan nang hindi lumilikha ng maling impresyong ang tinutukoy lamang ay ang labindalawang anak na lalaki ni Jacob.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pintuang-bayan” upang maging malinaw na mga pasukan ito ng napapaderang lungsod. Hinati sa dalawang pangungusap ang mahabang paglalarawan para sa likas na daloy sa Filipino, ngunit pinanatili ang lahat ng ugnayang nasa Griyego.
