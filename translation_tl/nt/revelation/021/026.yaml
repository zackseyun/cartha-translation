translation:
  language: tl
  text: At dadalhin nila sa loob nito ang kaluwalhatian at karangalan ng mga bansa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob niya,” upang mapanatili ang pambabaeng personipikasyon ng lungsod sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na nag-uugnay sa talatang ito sa naunang pangitain.
- source_word: οἴσουσιν
  choice: dadalhin nila
  rationale: Ang pandiwang nasa anyong panghinaharap ay nagsasaad ng pagdadala mula sa labas patungo sa lungsod.
- source_word: τὴν δόξαν
  choice: ang kaluwalhatian
  rationale: Pinananatili ng “kaluwalhatian” ang malawak na diwang biblikal ng δόξα, kasama ang ningning at kadakilaan.
- source_word: τὴν τιμὴν
  choice: karangalan
  rationale: Ang “karangalan” ang likas na katambal ng “kaluwalhatian” at hindi ito nagpapasya kung ang tinutukoy ay yaman, handog, o pagpaparangal.
- source_word: τῶν ἐθνῶν
  choice: ng mga bansa
  rationale: Tumutukoy sa mga bansa o mga pangkat ng mga tao sa malawak na diwa; hindi ipinapasok ang mas makitid na kaibhang Judio at Hentil.
- source_word: εἰς αὐτήν
  choice: roon
  rationale: Likas sa modernong Tagalog bilang pagtukoy sa pagpasok sa Bagong Jerusalem, habang iniiwasan ang di-likas na panghalip na pambabae para sa lungsod.
theological_decisions:
- issue: Ang tinutukoy at personipikasyon ng αὐτήν
  choice: Isinalin bilang “roon,” na tumutukoy sa Bagong Jerusalem.
  alternative: “sa kanya,” upang tahasang mapanatili ang pambabaeng personipikasyon ng lungsod
  rationale: Pambabae ang panghalip sa Griyego sapagkat pambabae ang gramatikal na kasarian ng πόλις at inilalarawan din ang lungsod bilang isang babaeng ikakasal. Gayunman, mas natural sa Tagalog ang “roon” sa pangungusap na ito; itinatala sa talababa ang personipikasyon.
- issue: Kahulugan ng “kaluwalhatian at karangalan ng mga bansa”
  choice: Pinanatiling malawak ang parirala nang hindi tinutukoy kung ito ay yaman, ambag na pangkultura, natatanging kadakilaan, o pagpaparangal.
  alternative: “kayamanan ng mga bansa” o “kadakilaan ng kultura ng mga bansa”
  rationale: Malawak ang saklaw ng pariralang Griyego, at hindi hinihingi ng konteksto na pumili ng isang tiyak na interpretasyong eskatolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “dadalhin nila roon” bilang natural na katumbas ng pagdadala papasok sa lungsod; pinanatili ang mga salitang biblikal na “kaluwalhatian” at “karangalan.”
