id: REV.21.27
reference: Revelation 21:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: tl
  text: At hinding-hindi makapapasok doon ang anumang marumi[a], ni ang sinumang gumagawa ng kasuklam-suklam na bagay o ng kasinungalingan[b], kundi ang mga nakasulat lamang sa aklat ng buhay ng Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang profano” o “anumang nadungisan” ang πᾶν κοινόν.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “gumagawa ng kasuklam-suklam na bagay at kasinungalingan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: hinding-hindi makapapasok
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi. Likas sa modernong Tagalog ang “hinding-hindi” upang ipahayag ang ganap na pagkakait ng pagpasok.
- source_word: αὐτὴν
  choice: doon
  rationale: Tumutukoy ito sa lungsod, ang Bagong Jerusalem. Mas natural sa Tagalog ang lokatibong “doon” kaysa literal na panghalip na “dito/ito” pagkatapos ng pandiwang “makapasok.”
- source_word: πᾶν κοινὸν
  choice: ang anumang marumi
  rationale: Komprehensibo ang neuter singular na may πᾶν. Sa kontekstong Hudyo ng kadalisayan, ang κοινός ay maaaring mangahulugang marumi, karaniwan/profano, o nadungisan; “anumang marumi” ang pinakamalinaw sa pangunahing teksto.
- source_word: ποιῶν βδέλυγμα
  choice: ang sinumang gumagawa ng kasuklam-suklam
  rationale: Substantival ang participle at tumutukoy sa taong gumagawa nito. Pinananatili ng “kasuklam-suklam” ang matinding moral at posibleng kultikong bigat ng βδέλυγμα nang hindi nagiging di-likas ang Tagalog.
- source_word: καὶ ψεῦδος
  choice: o kasinungalingan
  rationale: 'Bagaman καί ang nasa Griyego, inilalahad dito ang magkahiwalay na uri ng gawa sa ilalim ng iisang participle. Natural sa Tagalog ang “o” sa negatibong saklaw: walang makapapasok na gumagawa ng alinman sa kasuklam-suklam o kasinungalingan. Nililinaw sa talababa ang literal na kayarian.'
- source_word: εἰ μὴ
  choice: kundi ... lamang
  rationale: Ipinakikilala ng εἰ μή ang tanging eksepsiyon. Ang “kundi ... lamang” ay malinaw at idiomatikong Tagalog.
- source_word: οἱ γεγραμμένοι
  choice: ang mga nakasulat
  rationale: Ipinahihiwatig ng perfect passive participle ang nananatiling kalagayan ng pagkakatala. Hindi idinagdag ang “mga pangalan,” sapagkat wala itong tahasang katumbas sa talata.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς
  choice: sa aklat ng buhay
  rationale: Ang “aklat ng buhay” ay tumpak, malinaw, at kinikilalang parirala sa kontekstong apokaliptiko.
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Pinananatili ang possessive genitive at ang mahalagang titulong kristolohikal na “Kordero.”
theological_decisions:
- issue: Saklaw ng hindi pinahihintulutang pumasok sa Bagong Jerusalem
  choice: Ihiwalay sa balangkas ang “anumang marumi” at “ang sinumang gumagawa” ng kasuklam-suklam o kasinungalingan.
  alternative: Unawain ang unang parirala bilang tumutukoy lamang sa bagay na marumi at ang ikalawa lamang sa mga tao.
  rationale: Magkasamang ginagamit ng Griyego ang neuter na πᾶν κοινόν at ang substantival participle na ποιῶν. Pinananatili ng salin ang dalawang anyo nang hindi pinag-iisa o nilulutas ang posibleng saklaw.
- issue: Kung ano ang nakasulat sa aklat
  choice: “ang mga nakasulat”
  alternative: “ang mga nakasulat ang pangalan” o “ang mga nakatala ang pangalan”
  rationale: Ipinahihiwatig ng larawan ng aklat na mga pangalan ang nakatala, ngunit hindi tahasang binabanggit ang ὀνόματα sa talatang ito. Pinananatili ang katahimikan ng orihinal.
- issue: Ugnayan ng βδέλυγμα at ψεῦδος
  choice: Gamitin ang idiomatikong “o” sa pangunahing teksto at ilagay sa talababa ang literal na koordinasyong “at.”
  alternative: “gumagawa ng kasuklam-suklam at kasinungalingan”
  rationale: Sa ilalim ng negatibong saklaw, malinaw na ipinagbabawal ang alinman sa dalawang uri ng gawain. Hindi nito nilulutas ang teolohikal na saklaw; inilalahad lamang ito sa natural na Tagalog habang dokumentado ang literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hinding-hindi” para sa mariing pagtanggi, “doon” para sa likas na pagtukoy sa lungsod bilang lugar, at “Kordero” bilang nakagawiang marangal na titulong biblikal. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
