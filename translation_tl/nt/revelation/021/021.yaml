  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: tl
  text: At ang labindalawang pintuan ay labindalawang perlas; bawat isa sa mga pintuan ay yari sa iisang perlas. At ang lansangan ng lungsod ay purong ginto[a], gaya ng malinaw na salamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang malapad na lansangan ng lungsod” o “ang liwasan ng lungsod” para sa πλατεῖα.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: mga pintuan
  rationale: Sa paglalarawan sa Bagong Jerusalem, tumutukoy ito sa mga pintuan o pasukan ng lungsod; natural at malinaw sa modernong Tagalog ang “mga pintuan.”
- source_word: μαργαρῖται / μαργαρίτου
  choice: mga perlas / perlas
  rationale: Tuwirang katumbas ng μαργαρίτης ang “perlas.” Pinanatili ang maramihan at isahang anyo upang maipakita na ang labindalawang pintuan ay katumbas ng labindalawang perlas at na bawat pintuan ay mula sa iisang perlas.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: bawat isa
  rationale: Ipinahahayag nito ang distributibong diwa na isa-isa o tig-iisa; idiomatiko at may sapat na diin ang “bawat isa.”
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: yari sa iisang perlas
  rationale: Ang ἐξ ay tumutukoy sa materyal o pinagmulan. Malinaw at natural ang “yari sa,” samantalang pinananatili ng “iisang” ang diin ng ἑνός.
- source_word: πλατεῖα
  choice: lansangan
  rationale: Maaaring tumukoy ang salita sa isang malapad na daan o pampublikong bukás na lugar. Ang “lansangan” ay marangal at natural sa kontekstong ito, habang inilalagay sa talababa ang tunay na leksikal na mga alternatibo.
- source_word: χρυσίον καθαρὸν
  choice: purong ginto
  rationale: Karaniwan at eksaktong katumbas sa Tagalog ng ginto na walang halo o karumihan.
- source_word: ὡς ὕαλος διαυγής
  choice: gaya ng salaming malinaw na malinaw
  rationale: Ang ὕαλος ay “salamin,” at ang διαυγής ay nagpapahiwatig ng pambihirang linaw o transparency. Pinananatili ng pag-uulit ang matinding linaw ng imahen sa natural na Tagalog.
theological_decisions:
- issue: Ang anyo ng πλατεῖα sa larawan ng lungsod
  choice: Isinaling isahang “lansangan ng lungsod” nang hindi tinutukoy nang labis ang ayos ng lungsod.
  alternative: “malapad na lansangan ng lungsod” o “liwasan ng lungsod”
  rationale: Leksikal at panglarawan ang usapin, hindi doktrinal. Pinananatili ng pangunahing salin ang pangitain habang kinikilala sa talababa ang posibilidad na isang malapad na daan o liwasan ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “lansangan” sa halip na mas kolokyal na “kalsada” upang umangkop sa matayog na pangitain, ngunit iniwasan ang lipas o labis na teknikal na pananalita.
