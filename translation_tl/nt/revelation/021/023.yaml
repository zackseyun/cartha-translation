id: REV.21.23
reference: Revelation 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: tl
  text: Hindi kailangan ng lungsod ang araw o ang buwan upang tumanglaw dito[a], sapagkat niliwanagan ito ng kaluwalhatian ng Diyos, at ang ilawan nito ay ang Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang bigyan ito ng liwanag.” Sa literal, ang Griyego ay “upang tumanglaw para rito/dito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: lungsod
  rationale: Karaniwan at tuwirang katumbas sa makabagong Tagalog, ayon sa konteksto ng Bagong Jerusalem.
- source_word: οὐ χρείαν ἔχει
  choice: Hindi kailangan
  rationale: Natural na Tagalog para sa idyomang nangangahulugang walang pangangailangan; iniiwasan ang mas mabigat na 'walang pangangailangan sa.'
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: ang araw o ang buwan
  rationale: Pinananatili ang magkatambal na mga bagay at ang negatibong diwang ipinahahayag ng οὐδέ.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: upang tumanglaw dito
  rationale: Ang 'tumanglaw' ay likas para sa araw at buwan at napapanatili ang ideya ng pagsinag sa o pagbibigay-liwanag sa lungsod nang hindi inuulit ang pandiwa sa kasunod na sugnay.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Itinatag na salin na nagpapanatili sa teolohikal at apokaliptikong bigat ng salita, sa halip na paliitin ito sa ningning lamang.
- source_word: ἐφώτισεν
  choice: niliwanagan
  rationale: Tuwirang ipinapahayag ang kongkretong pagliliwanag sa lungsod at natural sa Tagalog.
- source_word: λύχνος
  choice: ilawan
  rationale: Tumpak na tumutukoy sa isang ilawan, hindi sa liwanag sa pangkalahatan o sa patungan ng ilawan.
- source_word: ἀρνίον
  choice: Kordero
  rationale: Itinatag na titulong kristolohikal sa Pahayag; ang malaking titik ay nagpapakitang titulo ang gamit.
theological_decisions:
- issue: Metaporikal na ugnayan sa 'ang ilawan nito ay ang Kordero'
  choice: 'Panatilihin nang tuwiran ang metapora: ''ang ilawan nito ay ang Kordero.'''
  alternative: ang Kordero ang liwanag nito
  rationale: Ang Griyego ay tahasang gumagamit ng λύχνος ('ilawan'), hindi ng pangkalahatang salita para sa liwanag. Pinananatili nito ang pagkakaiba ng kaluwalhatian ng Diyos na nagliliwanag at ng Kordero bilang ilawan ng lungsod.
- issue: Larawan ng banal na pagliliwanag
  choice: Isalin ang pahayag nang walang idinagdag na paliwanag tungkol sa mga pangyayari sa hinaharap.
  alternative: Palawakin upang sabihing ganap na pinapalitan ng Diyos ang lahat ng nilikhang pinagmumulan ng liwanag.
  rationale: Sinasabi lamang ng talata na hindi kailangan ng lungsod ang araw o buwan dahil nililiwanagan ito ng kaluwalhatian ng Diyos at ang Kordero ang ilawan nito; hindi dapat dagdagan ng salin ang teolohikal na paliwanag.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'tumanglaw' upang mapanatili ang larawan ng araw at buwan na sumisikat o nagbibigay-liwanag, at ang 'niliwanagan' para sa hiwalay na pandiwang tumutukoy sa kaluwalhatian ng Diyos.
