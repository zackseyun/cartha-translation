  source_fidelity: 'Tumpak na naisasalin ang lahat ng pangunahing elemento ng Griyego: ang lungsod ay walang pangangailangan sa araw o buwan upang tumanglaw dito; ang kaluwalhatian ng Diyos ang nagliwanag dito; at ang ilawan nito ay ang Kordero. Napananatili ang magkaibang pandiwa at larawan ng φαίνω at ἐφώτισεν, gayundin ang tiyak na λύχνος bilang “ilawan.”'
  naturalness: Natural at marangal ang daloy sa makabagong Filipino Tagalog. Ang “Hindi kailangan ng lungsod ang araw o ang buwan” at “upang tumanglaw dito” ay malinaw at idiomatiko. Ang paggamit ng “niliwanagan” ay angkop at hindi labis na malaya.
  terminology: Ang “kaluwalhatian,” “Diyos,” “ilawan,” at “Kordero” ay angkop, matatag, at magkakaugnay sa karaniwang gamit sa Filipino ng Pahayag. Ang malaking titik sa “Kordero” ay angkop para sa titulong gamit sa konteksto.
