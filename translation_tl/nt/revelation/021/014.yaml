id: REV.21.14
reference: Revelation 21:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: tl
  text: At ang pader ng lungsod ay may labindalawang pundasyon[a], at nakasulat sa mga iyon ang labindalawang pangalan ng labindalawang apostol ng Kordero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “labindalawang batong pundasyon.” Sa kontekstong pang-arkitektura, ang salitang Griyego ay maaaring tumukoy sa mga pundasyon o sa mga batong pundasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: pader
  rationale: Tumutukoy ito sa pader ng isang lungsod; ang “pader” ang natural at malinaw na katumbas sa modernong Tagalog.
- source_word: πόλεως
  choice: ng lungsod
  rationale: Tuwirang ipinahahayag ng pariralang ito na ang pader ay pag-aari o bahagi ng lungsod.
- source_word: ἔχων
  choice: ay may
  rationale: Bagaman participle ang Griyego, natural sa Tagalog ang sugnay na “ay may” sa paglalarawan ng pangitain.
- source_word: θεμελίους δώδεκα
  choice: labindalawang pundasyon
  rationale: Maaaring tumukoy ang θεμέλιος sa pundasyon o batong pundasyon. Pinananatili sa pangunahing teksto ang mas malawak at tuwirang “pundasyon,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: ἐπ’ αὐτῶν
  choice: sa mga iyon
  rationale: Ang tinutukoy ay ang labindalawang pundasyon. Natural sa Tagalog ang “sa mga iyon” at hindi nito labis na tinutukoy kung eksaktong paano naroon ang mga pangalan.
- source_word: ὀνόματα
  choice: nakasulat ... ang ... pangalan
  rationale: Tahasang “mga pangalan” lamang ang nasa Griyego, ngunit kailangan sa natural na Tagalog ng kaugnayang predikatibo. Ang “nakasulat” ay nagpapahayag ng pangalan na nasa mga pundasyon nang hindi ginagawang ibang bagay ang mga ito.
- source_word: ἀποστόλων
  choice: apostol
  rationale: Ang “apostol” ang nakagawiang teknikal na katawagan sa Bagong Tipan at mas tiyak kaysa “mga sugo.”
- source_word: τοῦ ἀρνίου
  choice: ng Kordero
  rationale: Ang “Kordero” ay kinikilalang kristolohikal na titulo sa Pahayag at pinananatili ang kaugnayang ipinahahayag ng genitive.
theological_decisions:
- issue: Kristolohikal na titulong ἀρνίον
  choice: Kordero
  alternative: kordero
  rationale: Ginagamit ang malaking titik sapagkat ang ἀρνίον sa Pahayag ay gumaganap bilang titulo ni Jesus; ipinahihiwatig nito ang titular na gamit nang hindi nagdaragdag ng doktrina sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod,” “pader,” “pundasyon,” at “apostol” bilang karaniwan at madaling maunawaang mga katawagan; pinanatili ang “Kordero” bilang mahalagang titulo sa Pahayag.
