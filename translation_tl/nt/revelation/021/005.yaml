id: REV.21.5
reference: Revelation 21:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: tl
  text: At sinabi ng nakaupo sa trono, “Tingnan! Ginagawa kong bago ang lahat ng bagay[a].” At sinabi niya, “Isulat mo, sapagkat[b] ang mga salitang ito ay mapagkakatiwalaan[c] at totoo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginagawa kong bago ang lahat.” Ang πάντα ay maaaring isalin na “lahat ng bagay” o “lahat.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Isulat mo na ang mga salitang ito ay mapagkakatiwalaan at totoo.” Maaaring magbigay ang ὅτι ng dahilan (“sapagkat”) o magpakilala sa nilalaman ng isusulat (“na”).
    reason: syntactic_ambiguity
  - marker: c
    text: Maaari ring “maaasahan” o “tapat.” Sa paglalarawan sa mga salita, ipinahihiwatig ng πιστοί na maaasahan at mapananaligan ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: ang nakaupo sa trono
  rationale: Likas at malinaw sa modernong Tagalog, habang pinananatili ang paglalarawan sa nagsasalita sa pamamagitan ng kanyang pagkakaupo sa trono.
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Tuwirang panawag-pansin na nauunawaan ng karaniwang mambabasa at may sapat na bigat para sa maringal na pahayag.
- source_word: καινὰ ποιῶ πάντα
  choice: ginagawa kong bago ang lahat ng bagay
  rationale: Pinananatili ng “ginagawa” ang aspektong pangkasalukuyan ng ποιῶ, ng “bago” ang diwa ng καινά, at ng “lahat ng bagay” ang malawak na saklaw ng πάντα nang hindi ipinapasiya kung pagpapalit o pagbabago ang tinutukoy.
- source_word: Γράψον
  choice: Isulat mo
  rationale: Tuwirang pautos na likas sa Tagalog; hindi tahasang nagdaragdag ng isang bagay na isusulat, bagaman nauunawaan iyon mula sa konteksto.
- source_word: ὅτι
  choice: sapagkat
  rationale: Binabasa rito ang ὅτι bilang nagpapakilala ng dahilan kung bakit dapat isulat ang pahayag, habang itinatala sa talababa ang posibleng pagbasa nito bilang “na.”
- source_word: οὗτοι οἱ λόγοι
  choice: ang mga salitang ito
  rationale: Tuwirang ipinapahayag ang mga binigkas o inihayag na salita nang hindi nililimitahan ang mga ito sa isang tiyak na uri ng kasabihan.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: mapagkakatiwalaan at totoo
  rationale: Ang “mapagkakatiwalaan” ay natural na paglalarawan sa mga salita na maaasahan, at ang “totoo” ay tuwirang katumbas ng ἀληθινοί; napapanatili ang magkaugnay ngunit hindi ganap na magkaparehong diin ng dalawang salita.
theological_decisions:
- issue: Saklaw at uri ng pagbabagong tinutukoy ng καινὰ ποιῶ πάντα
  choice: ginagawa kong bago ang lahat ng bagay
  alternative: ginagawa kong bago ang lahat
  rationale: Pinananatili ang kasalukuyang pagkilos at ang lubos na saklaw ng pahayag, ngunit hindi ipinapasiya kung ang tinutukoy ay ganap na pagpapalit o pagbabago at pagpapanibago.
- issue: Pagkakakilanlan ng banal na nagsasalita
  choice: ang nakaupo sa trono
  alternative: siyang nakaupo sa trono
  rationale: Ipinakikilala ang nagsasalita ayon lamang sa larawan ng trono na nasa teksto, nang walang idinaragdag na mas tiyak na katawagang teolohikal.
- issue: Kaugnayan ng ὅτι sa utos na sumulat
  choice: sapagkat
  alternative: na
  rationale: Mas malamang na nagbibigay ito ng dahilan—dapat isulat sapagkat mapagkakatiwalaan at totoo ang mga salita—ngunit tunay na posible sa gramatika ang pagbasa rito bilang pagpapakilala sa nilalaman ng isusulat, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tingnan mo” sa halip na mas lumang “Narito” bilang panawag-pansin, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
