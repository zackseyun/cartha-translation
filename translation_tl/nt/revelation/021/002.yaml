id: REV.21.2
reference: Revelation 21:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: tl
  text: At nakita ko ang banal na lungsod, ang bagong Jerusalem, na bumababa mula sa langit, mula sa Diyos, na inihanda gaya ng isang babaing ikakasal na ginayakan para sa kaniyang asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na inihanda gaya ng isang babaing ikakasal na pinalamutian para sa kaniyang asawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλιν
  choice: lungsod
  rationale: Tuwirang katumbas ng πόλις at pinananatili ang konkretong larawang panlungsod.
- source_word: ἁγίαν
  choice: banal
  rationale: Karaniwan at teolohikong angkop na salin ng ἅγιος; natural ang pariralang “banal na lungsod.”
- source_word: Ἰερουσαλὴμ καινὴν
  choice: ang bagong Jerusalem
  rationale: Isinasalin ang καινήν bilang naglalarawang pang-uri at tinutumbasan ang pangalang Ἰερουσαλήμ bilang Jerusalem.
- source_word: εἶδον
  choice: nakita ko
  rationale: Payak at likas na salin ng aorist ng ὁράω, nang walang di-kinakailangang pagpapalawak.
- source_word: καταβαίνουσαν
  choice: bumababa
  rationale: Likas sa modernong Filipino at malinaw na nagpapahayag ng kilos na pababa.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Ang “mula sa langit” ang pinakanatural na Filipino para sa paggalaw na nagmumula o lumalabas sa langit; ang direksiyong pababa ay malinaw na sa pandiwa.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Pinananatili ang tahasang pinagmulan nang hindi idinaragdag ang ideyang “mula sa presensiya ng Diyos.”
- source_word: ἡτοιμασμένην
  choice: inihanda
  rationale: Ipinahihiwatig ang natapos na paghahanda at ang pasibong kalagayan ng lungsod.
- source_word: ὡς
  choice: gaya ng
  rationale: Malinaw na naghahayag ng paghahambing o pagtutulad.
- source_word: νύμφην
  choice: isang babaing ikakasal
  rationale: Natural at madaling maunawaang Filipino para sa bride, nang hindi ito ginagawang teknikal na titulong “ang Nobya.”
- source_word: κεκοσμημένην
  choice: naggayak
  rationale: Ipinapahayag ang pagpapaganda o pag-aayos para sa kasal sa dignified ngunit kasalukuyang Filipino.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: para sa kaniyang asawa
  rationale: Sa kontekstong pangkasal, ang ἀνήρ ay likas na nangangahulugang asawa; hindi idinaragdag ang mas tiyak na terminong “lalaking ikakasal.”
theological_decisions:
- issue: Kung ituturing bang pormal na titulo ang “bagong Jerusalem”
  choice: Ginamit ang “ang bagong Jerusalem,” na nag-iiwan sa “bagong” bilang naglalarawang pang-uri.
  alternative: “ang Bagong Jerusalem” bilang isang pormal na titulong pantangi
  rationale: Walang pagkakaiba ng malaking titik at maliit na titik sa ganitong anyo ng tekstong Griyego, at maaaring unawain ang καινήν bilang payak na panuring. Hindi kailangang lutasin sa salin ang usaping estilistikong ito.
- issue: Kung tahasang ipakikilala ang babaing ikakasal bilang iglesia o bayan ng Diyos
  choice: Pinanatili ang pagtutulad nang walang interpretatibong pagkakakilanlan.
  alternative: “inihanda bilang iglesia, ang babaing ikakasal ng Kordero”
  rationale: Ang talata ay naghaharap ng simile sa pamamagitan ng ὡς. Ang pagdaragdag ng tiyak na eklesiyolohikal na paliwanag ay lalampas sa mismong sinabi ng teksto.
- issue: Ugnayan ng ἐκ τοῦ οὐρανοῦ at ἀπὸ τοῦ θεοῦ
  choice: 'Pinanatili ang dalawang pariralang pinagmulan: “mula sa langit, mula sa Diyos.”'
  alternative: Pagsamahin bilang “mula sa Diyos sa langit”
  rationale: Ang pagsasanib ay maaaring magpaliit sa tunay na sintaktikong puwang ng dalawang parirala; mas tapat na panatilihing magkatabi ang mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang paulit-ulit na “mula” upang katawanin ang dalawang magkaibang pariralang Griyego. Ginamit ang “kaniyang” para sa dignified na register at ang “babaing ikakasal” sa halip na mas lumang “nobya.”
