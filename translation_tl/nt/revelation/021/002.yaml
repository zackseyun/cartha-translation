  terminology: Ang “banal,” “lungsod,” “Jerusalem,” “Diyos,” at “babaing ikakasal” ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Ang “asawa” ay wastong salin ng ἀνήρ sa kontekstong pangkasal; hindi kinakailangang gawing “lalaking ikakasal.”
