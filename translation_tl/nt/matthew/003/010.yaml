  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: tl
  text: At nakalagay na ang palakol sa ugat ng mga puno[a]. Kaya, ang bawat punong hindi namumunga ng mabuting bunga ay pinuputol at itinatapon sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakalapag sa ugat ng mga puno.”
    reason: Pinahihintulutan ng κεῖται ang diwang “nakalagay” o “nakalapag/nakahimlay”; inihaharap ng alternatibo ang mas literal na larawan nang hindi binabago ang kahulugan.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: At ... na
  rationale: Ipinahahayag ng “na” ang χρονική puwersa ng ἤδη (“already”), samantalang ang “At” ay nagpapanatili sa mahinang pag-uugnay ng δέ sa naunang babala.
- source_word: ἡ ἀξίνη
  choice: ang palakol
  rationale: Karaniwan at malinaw na salitang Filipino para sa kasangkapang pamutol na ginamit sa larawan ng paghatol.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: nakalagay ... sa ugat ng mga puno
  rationale: Pinananatili ang larawan ng palakol na nasa mismong paanan o ugat ng mga puno at handa nang gamitin, nang hindi tahasang idinaragdag ang salitang “handa.”
- source_word: πᾶν οὖν δένδρον
  choice: Kaya, ang bawat puno
  rationale: Ipinakikita ng “Kaya” ang paghihinuha o bunga na ipinahahayag ng οὖν; ang “bawat puno” ay tuwirang katumbas ng πᾶν ... δένδρον.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: hindi namumunga ng mabuting bunga
  rationale: Ang “namumunga” ay likas na ekspresyon sa Filipino para sa punong nagbubunga at pinananatili ang patuloy o katangiang kilos ng participle; ang “mabuting bunga” ay nagpapanatili sa moral na talinghaga ng καρπὸν καλόν.
- source_word: ἐκκόπτεται
  choice: pinuputol
  rationale: Ang aspektong imperpektibo ng anyong pangkasalukuyan sa Filipino ay angkop sa matingkad at pangkalahatang pahayag ng pasibong Griyego; malinaw sa konteksto na ang puno ay pinuputol pabagsak.
- source_word: εἰς πῦρ βάλλεται
  choice: itinatapon sa apoy
  rationale: Likas na makabagong Filipino ito na nagpapanatili sa pasibong kilos at sa hindi pinalawak na larawan ng apoy.
theological_decisions:
- issue: Kalikasan ng larawan ng apoy
  choice: Pinanatili bilang “sa apoy” nang walang paliwanag na idinagdag sa talata.
  alternative: Tukuyin ito bilang impiyerno, huling paghuhukom, o pansamantalang paghatol.
  rationale: Malinaw na larawan ito ng paghatol, ngunit hindi tinutukoy ng mismong talata kung anong partikular na anyo ng paghatol ang ibig sabihin; kaya pinananatili ang teolohikal na tensiyon.
- issue: Panahon ng pagputol at pagtatapon
  choice: Ginamit ang pangkasalukuyang “pinuputol” at “itinatapon.”
  alternative: Gamitin ang panghinaharap na “puputulin” at “itatapon.”
  rationale: Ang Griyego ay nasa pangkasalukuyang pasibo at naglalahad ng bunga sa matingkad o pangkalahatang paraan. Hindi ginawang tahasang panghinaharap ang sinabi ng teksto, kahit ipinahihiwatig ng konteksto ang nalalapit na paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang agrikultural na talinghaga at ang maikli, mariing daloy ng babala. Ginamit ang “palakol,” “ugat,” “bunga,” at “apoy” bilang mga salitang madaling maunawaan ng karaniwang mambabasa.
