  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: tl
  text: at sinasabi niya, “Magsisi kayo[a], sapagkat malapit na ang kaharian ng langit.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Baguhin ninyo ang inyong pag-iisip.” Ang pandiwang Griyego ay tumutukoy sa malalim na pagbabago ng isip at pananaw na humahantong sa panibagong direksiyon ng buhay, hindi lamang sa pagkadama ng lungkot o hiya dahil sa kasalanan.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “ang kaharian ng mga langit ay lumapit na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: at sinasabi
  rationale: Pinananatili ang pag-uugnay ng καὶ at ang pangkasalukuyang pandiwaring λέγων sa naunang salaysay, nang hindi dinaragdagan ang mas tiyak na diwang ‘nangangaral’ o ‘ipinapahayag.’
- source_word: Μετανοεῖτε
  choice: Magsisi kayo
  rationale: Ang maramihang pautos ay likas at marangal na naipahahayag sa Filipino sa ‘Magsisi kayo.’ Saklaw nito sa konteksto ang radikal na pagbabago ng isip at direksiyon ng buhay, hindi lamang pagkadama ng lungkot o hiya; nililinaw ng talababa ang lawak ng salitang Griyego.
- source_word: ἤγγικεν
  choice: malapit na
  rationale: 'Likas na Filipino itong nagpapahayag ng kinalabasan ng Griyegong perfect: lumapit na ang kaharian at ngayo’y nasa malapit. Ang ‘lumapit na’ ay mas pormal sa aspekto ngunit hindi gaanong natural sa pariralang ito.'
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang paglapit ng kaharian ang batayan ng utos, sa isang marangal ngunit madaling maunawaang rehistro.
- source_word: ἡ βασιλεία
  choice: ang kaharian
  rationale: Pinananatili ng ‘kaharian’ ang malawak na saklaw ng βασιλεία—ang paghahari at ang nasasakupan—nang hindi ito nililimitahan sa abstraktong ‘pamamahala.’
- source_word: τῶν οὐρανῶν
  choice: ng langit
  rationale: Bagaman maramihan ang anyong Griyego, ang ‘ng langit’ ang natural at nakaugaliang Filipino para sa natatanging pananalita ni Mateo.
theological_decisions:
- issue: Saklaw ng utos na Μετανοεῖτε
  choice: Magsisi kayo, na inuunawa bilang pagbabago ng isip at direksiyon ng buhay
  alternative: Baguhin ninyo ang inyong pag-iisip
  rationale: Iniiwasang paliitin ang utos sa emosyonal na pagkalungkot lamang, ngunit pinananatili ang natural at matatag na bokabularyong biblikal sa Filipino. Ang talababa ang nagpapanatili sa leksikal na lawak at tunay na tensiyon.
- issue: Kahulugan ng ‘kaharian ng langit’
  choice: Panatilihin ang ‘kaharian ng langit’
  alternative: paghahari ng Diyos
  rationale: Pinananatili nito ang natatanging pananalita ni Mateo at hindi agad ipinapakahulugan ang βασιλεία bilang ‘paghahari’ lamang o pinapalitan ang ‘langit’ ng ‘Diyos,’ kahit malapit ang mga kahulugang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang nakaugaliang ‘magsisi’ ngunit nilinaw sa talababa ang mas malawak na puwersa ng Griyego. Ang ‘malapit na’ ay piniling natural na katumbas ng perfect na ἤγγικεν, habang ang mas literal na anyo ay inilagay sa talababa.
