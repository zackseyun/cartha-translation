  source_fidelity: 'Napananatili ng draft ang utos na pangmaramihan at ang hinuha ng οὖν sa “Kaya.” Gayunman, ang “magbunga kayo nang karapat-dapat sa pagsisisi” ay hindi wastong naipapakita ang καρπὸν ἄξιον: ang “nang” ay ginagawang pang-abay ang parirala, samantalang ang Griyego ay tumutukoy sa bungang dapat umaayon sa pagsisisi.'
  naturalness: Hindi likas ang “magbunga ... nang karapat-dapat sa pagsisisi.” Mas malinaw at natural ang “magbunga kayo ng bungang naaayon sa pagsisisi,” kung saan malinaw na inilalarawan ng “naaayon” ang “bunga.”
  terminology: Ang “pagsisisi” ay angkop at kinikilalang modernong salin ng μετανοίας sa kontekstong ito. Ang “naaayon sa” ay tumpak na naghahatid ng ideya ng ἄξιον na pagkakatugma, nang hindi nagpapahiwatig na ang bunga ay nagtatamo ng pagsisisi.
