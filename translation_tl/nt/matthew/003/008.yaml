  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: tl
  text: Kaya magbunga kayo ng bungang naaayon sa pagsisisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magbunga kayo ng bungang karapat-dapat sa pagsisisi.”
    reason: Ipinakikita ng alternatibo ang mas tuwirang katumbas ng ἄξιον (“karapat-dapat”), samantalang ang pangunahing teksto ay gumagamit ng “naaayon sa” upang malinaw na ipahayag ang pagkakatugma, hindi merito.
lexical_decisions:
- source_word: ποιήσατε
  choice: magbunga kayo
  rationale: Ang aorist active imperative na pangmaramihan ay isang tuwirang utos. Sa Filipino, likas na ipinahahayag ng “magbunga” ang paggawa o paglalabas ng bunga nang hindi ginagamit ang di-likas na “gumawa ng bunga.”
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at likas na ipinakikita ng “Kaya” ang kongklusyon mula sa naunang babala at panawagan.
- source_word: καρπὸν
  choice: bunga (nakapaloob sa “magbunga”)
  rationale: Pinananatili ng pandiwang “magbunga” ang metapora ng καρπός bilang nakikitang resulta o asal, kahit hindi na inuulit ang pangngalang “bunga.”
- source_word: ἄξιον
  choice: karapat-dapat sa
  rationale: Tuwirang katumbas ito ng ἄξιος na may genitive at pinananatili ang ideya ng pagiging angkop o katugma, nang hindi ipinahihiwatig na ang bunga ang nagkakamit ng pagsisisi.
- source_word: μετανοίας
  choice: pagsisisi
  rationale: Ang “pagsisisi” ang natural at kinikilalang salin sa kontekstong ito, na tumutukoy sa tunay na pagbabago at pagtalikod bilang tugon sa panawagan ni Juan.
theological_decisions:
- issue: Kahulugan ng καρπὸν ἄξιον τῆς μετανοίας
  choice: Ang bunga o asal ay dapat maging karapat-dapat at katugma ng tunay na pagsisisi.
  alternative: Ang bunga ang kumikita o nagkakamit ng pagsisisi.
  rationale: Ang konstruksyong may genitive ay nagpapahayag ng pagiging angkop o pagkakatugma, hindi ng merito. Pinananatili ng salin ang moral na utos ngunit hindi ipinapasok ang ideyang nabibili o nalilikha ng mga gawa ang pagsisisi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng pamumunga at ang tuwirang lakas ng utos; iniwasan ang mabigat at paulit-ulit na “gumawa kayo ng bungang…”.
