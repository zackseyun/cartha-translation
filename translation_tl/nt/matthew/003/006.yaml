  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: tl
  text: At binabautismuhan niya sila sa Ilog Jordan[a] habang ipinagtatapat nila ang kanilang mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “binautismuhan”; maaaring ipahiwatig ng imperpektong pandiwa sa Griyego ang nagpapatuloy o paulit-ulit na kilos: “binabautismuhan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: ay binabautismuhan
  rationale: Ipinahihiwatig ng imperpektong pasibo ang nagpapatuloy o paulit-ulit na kilos sa salaysay. Pinanatili ang terminong “bautismo” sa halip na tukuyin ang paraan nito, sapagkat ritwal na termino ang βαπτίζω sa kontekstong ito at hindi itinatampok ng talata ang eksaktong paraan.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: sa Ilog Jordan
  rationale: Lokasyon ang ipinahihiwatig ng ἐν na may datibo, at tahasang tinutukoy ng ποταμῷ ang Jordan bilang ilog. Ang “Ilog Jordan” ang natural na ayos sa makabagong Tagalog.
- source_word: ὑπ’ αὐτοῦ
  choice: niya
  rationale: Ang ὑπό na may henitibo ay tumutukoy sa gumagawa ng kilos. Pinanatili ang panghalip, na sa konteksto ay tumutukoy kay Juan, nang hindi pinapalitan ito ng tahasang pangalan.
- source_word: ἐξομολογούμενοι
  choice: habang ipinapahayag
  rationale: Ang participle ay kasabay ng pangunahing kilos at tumutukoy sa hayagang pagkilala o pagtatapat sa kasalanan. Ang “ipinapahayag” ay malinaw at natural sa pariralang ito.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ang kanilang mga kasalanan
  rationale: Tuwirang pinananatili ang maramihang anyo, na maaaring tumukoy sa mga partikular na kasalanang kinikilala nila.
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang salaysay; pinananatili ng “At” ang daloy nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Kahulugan at paraan ng bautismo
  choice: Gamitin ang “binabautismuhan” nang hindi tinutukoy ang paraan.
  alternative: “inilulubog” o “hinuhugasan”
  rationale: Sinasabi ng talata na binautismuhan sila ni Juan sa Jordan, ngunit hindi nito tahasang ipinaliliwanag ang paraan. Pinananatili ng “bautismo” ang terminong ritwal at iniiwasang magpasok ng denominasyonal na pagpapasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Ilog Jordan” at ang nakaugaliang terminong “bautismo,” habang pinananatili ang aspektong nagpapatuloy ng pandiwang Griyego.
