  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: tl
  text: Nang panahong iyon, patuloy na pumupunta sa kanya ang mga tao mula sa Jerusalem, sa buong Judea, at sa buong rehiyon sa paligid ng Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buong Judea” at “buong rehiyon sa paligid ng Jordan” ay malalawak na pananalitang heograpikal na naglalarawan sa laganap na pagtugon kay Juan; hindi nito kailangang sabihing pumunta ang bawat naninirahan.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa Filipino na nag-uugnay sa malawak na pagtugon ng mga tao sa naunang paglalarawan sa ministeryo ni Juan.
- source_word: ἐξεπορεύετο
  choice: patuloy na pumupunta
  rationale: Ipinahahayag ng imperfect ang nagpapatuloy o paulit-ulit na pagkilos sa nakaraan; malinaw itong naihahatid ng “patuloy na pumupunta.”
- source_word: πρὸς αὐτόν
  choice: sa kanya
  rationale: Sa pandiwa ng paggalaw, ipinahahayag nito ang pagpunta patungo sa isang tao—dito ay kay Juan.
- source_word: Ἱεροσόλυμα
  choice: mga tao mula sa Jerusalem
  rationale: Ang pangalan ng lungsod ay metonimikong tumutukoy sa mga naninirahan dito; kailangang gawing tahasan sa Filipino upang maging natural ang pangungusap.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: mga tao mula ... sa buong Judea
  rationale: Pinananatili ang malawak na saklaw ng rehiyon habang ipinakikitang mga tao mula rito ang pumupunta.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: mga tao mula ... sa buong lupain sa palibot ng Jordan
  rationale: Ang περίχωρος ay nakapalibot na lupain o rehiyon; ang parirala ay natural at malinaw na heograpikal sa Filipino.
- source_word: καὶ ... καὶ
  choice: …, …, at …
  rationale: Ang karaniwang seryeng Filipino ay natural na nagpapanatili sa pinagsama-samang talaan ng tatlong heograpikal na lugar.
theological_decisions:
- issue: Saklaw ng mga pangkalahatang heograpikal na pahayag
  choice: Panatilihin ang “buong” bilang malawak at retorikal na paglalarawan sa pagtugon ng mga rehiyon
  alternative: Ipahiwatig na literal na bawat naninirahan sa tatlong lugar ay pumunta
  rationale: Karaniwang gamit ang ganitong kabuuang pananalita upang ilarawan ang napakalawak na pagtugon, nang hindi kinakailangang tumukoy sa bawat indibidwal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginawang tahasan ang metonimikong “Jerusalem” bilang “mga tao mula sa Jerusalem,” at ginamit ang “patuloy na pumupunta” upang maipakita ang aspektong imperfect ng Griyego.
