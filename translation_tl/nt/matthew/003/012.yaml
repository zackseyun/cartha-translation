id: MAT.3.12
reference: Matthew 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: tl
  text: Hawak niya ang kanyang pangtahip[a]. Lubusan niyang lilinisin ang kanyang giikan at titipunin ang kanyang trigo sa kamalig[b], ngunit susunugin niya nang tuluyan ang ipa sa apoy na hindi mapapatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pala na pantahip.”
    reason: lexical_alternative
  - marker: b
    text: O “imbakan ng butil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: pangtahip
  rationale: Tumutukoy sa kasangkapang ginagamit sa pagtahip upang maihiwalay ang butil sa ipa; maikli at likas sa Tagalog, habang inilalahad sa talababa ang posibleng anyo ng kasangkapan.
- source_word: διακαθαριεῖ
  choice: lilinisin niyang lubos
  rationale: 'Pinananatili ang pinalakas na diwa ng tambalang pandiwa: ganap o masusing paglilinis ng giikan.'
- source_word: ἅλωνα
  choice: giikan
  rationale: Karaniwang salitang Tagalog para sa lugar na pinaggigiikan at pinagtatahitan ng ani.
- source_word: σῖτον
  choice: trigo
  rationale: Bagaman maaari itong tumukoy sa butil sa pangkalahatan, ang trigo ang likas na katapat sa larawang inihahambing ito sa ipa.
- source_word: ἀποθήκην
  choice: kamalig
  rationale: Likas at maikling katawagan sa imbakan ng ani o butil, nang hindi labis na nililimitahan ang uri ng gusali.
- source_word: ἄχυρον
  choice: ipa
  rationale: Eksaktong salitang Tagalog para sa magaan at walang-halagang bahaging inihihiwalay sa butil sa pagtahip.
- source_word: κατακαύσει
  choice: susunugin
  rationale: Sa Tagalog, ipinahihiwatig na ng pandiwang ito sa konteksto ang pagsunog hanggang maubos; hindi na kailangan ang mabigat na dagdag na parirala.
- source_word: πυρὶ ἀσβέστῳ
  choice: sa apoy na hindi mapapatay
  rationale: Malinaw at natural na ipinahahayag ang apoy na hindi kayang patayin o apulahin, habang nananatili ang matinding larawan ng teksto.
- source_word: οὗ
  choice: niya / kanyang
  rationale: Ang panghalip na paari ay tumutukoy sa darating na isa sa naunang talata; natural itong isinaayos bilang 'Nasa kamay niya ang kanyang…' sa Tagalog.
theological_decisions:
- issue: Larawan ng paghatol sa paghihiwalay ng trigo at ipa
  choice: Pinanatili ang konkretong larawang pang-agrikultura at ang hinaharap na pagsunog sa ipa.
  alternative: Tuwirang tukuyin sa pangunahing teksto na ang trigo at ipa ay sumasagisag sa mga matuwid at masasama.
  rationale: Hindi tahasang tinutukoy ng talata ang kahulugan ng bawat sagisag. Ang pagpapanatili sa talinghaga ay umiiwas sa pagpasok ng paliwanag o partikular na doktrina sa salin.
- issue: Diwa ng ἀσβέστῳ
  choice: apoy na hindi mapapatay
  alternative: apoy na walang hanggan
  rationale: Ang salita ay tuwirang tumutukoy sa apoy na hindi mapapatay, hindi sa tahasang pormulasyong 'walang hanggan.' Pinananatili nito ang lakas at maaaring tensiyong teolohikal ng orihinal nang walang dagdag na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga salitang pang-agrikulturang 'pangtahip,' 'giikan,' 'kamalig,' at 'ipa'; ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
