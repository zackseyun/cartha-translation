  to: Hawak niya ang kanyang pangtahip[a]. Lubusan niyang lilinisin ang kanyang giikan at titipunin ang kanyang trigo sa kamalig[b], ngunit susunugin niya nang tuluyan ang ipa sa apoy na hindi mapapatay.
  rationale: Inayos ang pananalita upang maging mas likas sa modernong Filipino Tagalog, ipinahayag ang ganap na puwersa ng κατακαύσει nang walang dagdag na paliwanag, at pinalitan ang potensiyal na nakalilitong alternatibo sa talababa para sa πτύον. Nananatili ang metapora ng paghatol at ang “apoy na hindi mapapatay” nang hindi ipinapataw ang isang partikular na doktrinal na pagbasa.
