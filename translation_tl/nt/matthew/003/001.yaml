    rationale: Ang κηρύσσων ay present participle na nagpapahayag ng kasabay o nagpapatuloy na gawain; “na nangangaral” ay mas malapit dito.
  revised_text: Noong mga araw na iyon, dumating[b] si Juan na Tagapagbautismo[a], na nangangaral sa ilang ng Judea.
