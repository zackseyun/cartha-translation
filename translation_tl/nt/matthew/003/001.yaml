  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: tl
  text: Noong mga araw na iyon, dumating[b] si Juan na Tagapagbautismo[a], na nangangaral sa ilang ng Judea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Juan Bautista.”
    reason: lexical_alternative
  - marker: b
    text: O “nagpakita” sa halip na “dumating”; makasaysayang pangkasalukuyang anyo ang pandiwa sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: Nang mga araw na iyon
  rationale: Likas na panandang temporal sa Filipino; hindi na tahasang isinalin ang banayad na pang-ugnay na δέ dahil sapat na ang paglipat ng salaysay sa konteksto.
- source_word: παραγίνεται
  choice: dumating
  rationale: Isinalin sa nagdaang panahunan ang historical present upang maging natural ang salaysay sa Filipino. Pinananatili nitong ang diwa ng pagpasok ni Juan sa tagpo nang hindi nagpapahiwatig ng makahimalang pagpapakita.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Bibliyang Filipino.
- source_word: ὁ βαπτιστὴς
  choice: ang Tagapagbautismo
  rationale: Malinaw nitong ipinapahayag na ang titulo ay tumutukoy sa gawaing pagbabautismo ni Juan, nang hindi inuugnay ang talata sa isang makabagong denominasyonal na pangalan.
- source_word: κηρύσσων
  choice: at nangaral
  rationale: Ginawang koordinadong pandiwa ang kasabay na participle upang maging malinaw at natural sa Filipino; ipinahahayag nito ang pampublikong pagpapahayag ni Juan.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay tumutukoy sa tiwangwang o hindi mataong lupain at hindi naglilimita sa larawan sa mabuhanging disyerto.
- source_word: τῆς Ἰουδαίας
  choice: ng Judea
  rationale: Tumutukoy ito sa heograpikong rehiyon ng Judea, hindi sa lipi o sinaunang teritoryo ng Juda.
theological_decisions:
- issue: Pagsasalin sa titulong βαπτιστής ni Juan
  choice: Tagapagbautismo
  alternative: Bautista
  rationale: Pinili ang malinaw na katawagang batay sa gawain upang maiwasang mapagkamalan ang pamagat bilang pangalan ng isang makabagong denominasyon. Ang “Bautista” ay kinikilalang tradisyonal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ilang” bilang natural at matapat na katumbas ng tiwangwang na rehiyon; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
