  naturalness: Mas natural sa makabagong Filipino ang “Noong mga araw na iyon” kaysa “Nang mga araw na iyon.” Ang “Tagapagbautismo” ay nauunawaan at tapat sa titulo, bagaman ang “Juan Bautista” ay natural na alternatibo.
  terminology: Pinananatili ang “Tagapagbautismo” bilang paglalarawang titulo para sa βαπτιστής, at ang “ilang ng Judea” para sa heograpikong ἐρήμῳ τῆς Ἰουδαίας. Walang doktrinal na pagpapakahulugang idinagdag.
