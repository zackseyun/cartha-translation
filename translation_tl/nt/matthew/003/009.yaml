id: MAT.3.9
reference: Matthew 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: tl
  text: At huwag ninyong akalaing sasabihin sa isa't isa[a], ‘Si Abraham ang aming ama,’ sapagkat sinasabi ko sa inyo na kayang magbangon ng Diyos mula sa mga batong ito ng mga anak para kay Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sabihin sa inyong sarili.” Maaaring tumukoy ang pariralang Griyego sa panloob na pagsasabi sa sarili o sa sinasabi nila sa isa't isa bilang isang pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: huwag ninyong ipagpalagay na maaari ninyong
  rationale: Ipinahahayag nito ang pagbabawal na umasa nang may maling pagtitiwala sa isang palagay, hindi lamang ang simpleng pag-iisip.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: sabihin sa isa't isa
  rationale: Natural itong tumutukoy sa sinasabi sa loob ng pangkat, habang inilalagay sa talababa ang maaari ring kahulugang panloob na pagsasabi sa sarili.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Si Abraham ang aming ama
  rationale: Natural at tuwirang Filipino ito na nagpapanatili sa mariing pag-angkin sa pinagmulang lahi.
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ang paliwanag na γάρ at ang pormal na pormula ng pagsasalita.
- source_word: δύναται
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag sa modernong Filipino ang kakayahan o kapangyarihan ng Diyos.
- source_word: ἐκ τῶν λίθων τούτων
  choice: mula sa mga batong ito
  rationale: Pinananatili ang larawan at ang pinagmumulang ipinahahayag ng ἐκ.
- source_word: ἐγεῖραι
  choice: lumikha
  rationale: Sa konteksto, nangangahulugan itong magbangon o magpalitaw ng mga inapo, hindi partikular na bumuhay mula sa kamatayan; ang 'lumikha' ay malinaw sa Filipino at angkop sa mga bato bilang pinagmulan.
- source_word: τέκνα
  choice: mga anak
  rationale: Saklaw nito ang mga anak o inapo anuman ang kasarian at pinananatili ang ugnayang pampamilya.
- source_word: τῷ Ἀβραάμ
  choice: para kay Abraham
  rationale: Ipinahahayag ang mga anak na iuugnay kay Abraham bilang kanyang mga inapo.
theological_decisions:
- issue: Kahulugan ng pagiging inapo ni Abraham sa babala ni Juan
  choice: Itinatakwil ng talata ang pagtitiwala na sapat sa harap ng Diyos ang pisikal na pagkamula kay Abraham.
  alternative: Maaaring ituring itong retorikal lamang, o basahin bilang pagtakwil sa Israel bilang lahi.
  rationale: Sinusuwatan ng mismong pananalita ang katiwasayang ibinabatay sa angkan, ngunit hindi nito itinatanggi ang makasaysayang pagkaama ni Abraham sa Israel ni ipinapahayag ang anumang sistemang teolohikal tungkol sa pagpapalit dito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang kolektibong pag-angkin sa angkan at ang tunay na kalabuan ng ἐν ἑαυτοῖς sa pamamagitan ng talababa.
