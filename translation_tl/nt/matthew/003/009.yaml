    issue: Ang “lumikha” ay ginamit para sa ἐγεῖραι.
    rationale: Ang ἐγείρω rito ay “magbangon” o “magpalitaw” ng mga anak/inapo; hindi nito tahasang sinasabing lumikha. Ang “lumikha” ay nagdaragdag ng mas espesipikong konsepto.
  - severity: low
    issue: Ang “maaari ninyong” ay hindi kinakailangang dagdag sa pagsasalin ng μὴ δόξητε λέγειν.
    rationale: Ang pagbabalangkas na “akalaing sasabihin” ay sapat upang ipahayag ang mapagtiwalang palagay na sinusuway sa teksto.
