  source_fidelity: Ang pangunahing diwa ay naipapahayag, kabilang ang babala laban sa tiwalang nakabatay sa pagiging anak ni Abraham. Ngunit ang “lumikha” para sa ἐγεῖραι ay mas tiyak kaysa sa Griyego at nagpapalit ng larawan ng “magbangon/magpalitaw.” Ang “maaari ninyong” ay dagdag na modal na hindi kailangang isalin upang maipahayag ang μὴ δόξητε λέγειν.
  naturalness: Marangal at madaling maunawaan ang pangkalahatang rehistro. Gayunman, mas tuwiran at mas natural sa Filipino ang “huwag ninyong akalaing sasabihin...” kaysa “huwag ninyong ipagpalagay na maaari ninyong sabihin...”.
  terminology: Ang “Diyos,” “Abraham,” at “mga anak” ay angkop. Pinalitan ang “lumikha” ng “magbangon” upang masundan ang ἐγείρω nang hindi ito binibigyang-kahulugang espesipikong paglikha.
  issues:
