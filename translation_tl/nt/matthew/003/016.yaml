  to: Nang mabautismuhan si Jesus, kaagad siyang umahon mula sa tubig.[a] At narito, nabuksan ang kalangitan, at nakita niya ang Espiritu ng Diyos na bumababang tulad ng isang kalapati at dumarating sa kaniya.[b]
  rationale: Pinalitan ang “lumalapit sa kaniya” ng “dumarating sa kaniya” upang maipakita ang ἐρχόμενον nang hindi nagdaragdag ng ideyang tahasang pagdapo. Inayos din ang talababa upang kilalanin ang direksiyong ipinahihiwatig ng ἐπί habang pinananatili ang hindi mapilit na pangunahing salin.
