  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: tl
  text: Nang mabautismuhan si Jesus, kaagad siyang umahon mula sa tubig.[a] At narito, nabuksan ang kalangitan, at nakita niya ang Espiritu ng Diyos na bumababang tulad ng isang kalapati at dumarating sa kaniya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umahon mula sa loob ng tubig.” Ang Griyego ay literal na “mula sa tubig” (ἀπὸ τοῦ ὕδατος).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dumarating sa ibabaw niya” o, sa mas interpretatibong salin, “dumadapo sa kaniya.” Ang pandiwang Griyego ay literal na nangangahulugang “pumaparito” o “dumarating.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Nang mabautismuhan si Jesus
  rationale: Ang aorist passive participle ay inilalarawan bilang pangyayaring kaugnay at nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang 'nang,' at pinananatili ng 'mabautismuhan' ang tinig na balintiyak.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: kaagad siyang umahon mula sa tubig
  rationale: Ang 'kaagad' ay nagpapanatili sa mabilis na pagkakasunod ng mga pangyayari. Ang 'umahon mula sa tubig' ay natural at malapit sa ἀπό, nang hindi pinatitindi ito bilang tahasang 'mula sa loob ng tubig.'
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing bisa ng salitang Griyego sa isang marangal ngunit nauunawaang anyong Tagalog.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: nabuksan ang kalangitan
  rationale: Pinananatili ang balintiyak na anyo. Ang 'kalangitan' ay natural na kolektibong katumbas sa Tagalog ng pangmaramihang οἱ οὐρανοί at higit na angkop kaysa sa payak na 'langit' bilang sky.
- source_word: πνεῦμα θεοῦ
  choice: ang Espiritu ng Diyos
  rationale: Pinananatili ang genitibong parirala at ang malinaw na reperensiya sa Espiritu ng Diyos nang hindi pinapalitan ng mas interpretatibong titulong 'Banal na Espiritu.'
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: bumababang tulad ng isang kalapati
  rationale: Ipinahahayag ng 'tulad ng' ang paghahambing na nasa ὡσεὶ at hindi ipinapakahulugang literal na kalapati ang Espiritu.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: lumalapit sa kaniya
  rationale: Ang ἐρχόμενον ay karaniwang 'dumarating/lumalapit'; iniiwasan ng saling ito ang mas tiyak ngunit interpretatibong 'dumadapo,' habang pinananatili ang paggalaw patungo kay Jesus.
theological_decisions:
- issue: Kung ang πνεῦμα θεοῦ ay isasaling pangkalahatan o bilang reperensiya sa Espiritu ng Diyos
  choice: ang Espiritu ng Diyos
  alternative: isang espiritung mula sa Diyos
  rationale: Malakas na ipinahihiwatig ng konteksto ng bautismo ang natatanging Espiritu ng Diyos, ngunit pinananatili ang eksaktong pormula ng Griyego sa halip na palitan ito ng 'Banal na Espiritu.'
- issue: Kung tinutukoy ng ὡσεὶ περιστερὰν ang pagkakakilanlan o paghahalintulad
  choice: tulad ng isang kalapati
  alternative: bilang isang kalapati
  rationale: Ang ὡσεὶ ay tahasang pananda ng paghahalintulad; hindi sinasabi ng teksto na literal na naging kalapati ang Espiritu.
- issue: Kung ang ἐρχόμενον ἐπ’ αὐτόν ay nangangahulugang tiyak na pagdapo
  choice: lumalapit sa kaniya
  alternative: dumadapo sa kaniya
  rationale: Ang pandiwa ay 'pumaparito/dumarating,' hindi ang mas tiyak na pandiwang 'dumadapo.' Pinananatili ng pangunahing salin ang lawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'narito' upang mapanatili ang masiglang pantawag-pansing tono ng salaysay. Iniwasan ang sobrang literal na sintaks at ang mga salitang nagtatakda nang higit sa ipinahihintulot ng Griyego.
