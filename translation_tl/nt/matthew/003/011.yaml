id: MAT.3.11
reference: Matthew 3:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: tl
  text: “Binabautismuhan ko nga kayo sa tubig[a] tungo sa pagsisisi[b]. Ngunit ang dumarating pagkatapos ko ay higit na makapangyarihan kaysa sa akin. Hindi ako karapat-dapat kahit magdala ng kanyang mga sandalyas. Siya mismo ang magbabautismo sa inyo sa Banal na Espiritu at apoy[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “gamit ang tubig”; ang Griyegong ἐν ay maaaring magpahiwatig ng kinaroroonan o kasangkapan. Gayundin sa pariralang “sa Banal na Espiritu at apoy.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tungo sa pagsisisi” ay maaari ring isaling “para sa pagsisisi.” Pinananatili ng Griyego ang direksiyonal o layuning diwa nang hindi tahasang sinasabi kung ang pagsisisi ay nauuna sa bautismo o ipinahahayag nito.
    reason: lexical_alternative
  - marker: c
    text: Ang “apoy” ay maaaring tumukoy sa pagdadalisay o sa paghatol; nananatiling bukas ang larawan sa Griyego, at ang konteksto ang dapat gumabay sa pag-unawa rito.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: binabautismuhan / magbabautismo
  rationale: Pinananatili ang kinikilalang terminong “bautismo” at hindi itinatakda ang paraan bilang paglulubog, sapagkat hindi tahasang nililinaw ng talata ang paraan.
- source_word: ἐν ὕδατι
  choice: sa tubig
  rationale: Malapit ito sa anyong Griyego at natural sa Filipino; pinananatili rin nito ang posibilidad na ang tubig ay unawain bilang kinaroroonan o kasangkapan.
- source_word: εἰς μετάνοιαν
  choice: tungo sa pagsisisi
  rationale: Pinananatili ng “tungo sa” ang direksiyonal na diwa ng εἰς nang hindi nagpapasya kung nauuna ang pagsisisi, layunin ito ng bautismo, o ipinahahayag nito ang pagsisisi.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: ang dumarating pagkatapos ko
  rationale: Natural na Filipino ito na nagpapanatili sa pagkakasunod na ipinahihiwatig ng parirala.
- source_word: ἰσχυρότερός μού
  choice: higit na makapangyarihan kaysa sa akin
  rationale: Ipinahahayag nito ang paghahambing nang malinaw at marangal, at mas angkop dito kaysa sa literal ngunit posibleng pisikal na “mas malakas.”
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Hindi ako karapat-dapat
  rationale: Sa pormula ng pagpapakumbabang ito, ang “karapat-dapat” ang pinakamalinaw na katumbas ng idyomatikong diwa ng ἱκανός.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: magdala ng kanyang mga sandalyas
  rationale: Ang βαστάσαι ay “magdala” o “magbuhat,” hindi “mag-alis”; ang “sandalyas” ay angkop sa bagay at kulturang tinutukoy.
- source_word: αὐτός
  choice: Siya mismo
  rationale: Pinananatili nito ang diin at ang paghahambing sa pagbautismo ni Juan.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Tinutukoy sa kontekstong ito ang Banal na Espiritu; pinananatili ng “sa” ang pagkakatulad sa naunang ἐν ὕδατι nang hindi nagdaragdag ng paliwanag.
- source_word: καὶ πυρί
  choice: at apoy
  rationale: Literal at maikli itong salin na hindi nagpapasya kung ang apoy ay larawan ng pagdadalisay o ng paghatol.
theological_decisions:
- issue: Kahulugan ng “Banal na Espiritu at apoy”
  choice: Panatilihin ang literal na “sa Banal na Espiritu at apoy.”
  alternative: “sa Banal na Espiritu at nagdadalisay na apoy” o “sa Banal na Espiritu at apoy ng paghatol”
  rationale: Maaaring ituro ng larawan ang pagdadalisay o paghatol, at hindi dapat lutasin ng pangunahing teksto ang tensiyong iniwan ng Griyego.
- issue: Tinutukoy ng πνεύματι ἁγίῳ
  choice: Banal na Espiritu
  alternative: “banal na espiritu” o “kapangyarihan ng Banal na Espiritu”
  rationale: Sa kontekstong Mateo, pinakamainam itong unawain bilang pagtukoy sa Banal na Espiritu, ngunit walang idinaragdag na paliwanag tungkol sa paraan ng kanyang pagkilos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang karaniwang terminong “bautismo,” iniwasan ang makaluma o labis na teknikal na pananalita, at pinanatili ang mga tunay na kalabuan ng mga pariralang ἐν, εἰς μετάνοιαν, at “Espiritu at apoy.”
