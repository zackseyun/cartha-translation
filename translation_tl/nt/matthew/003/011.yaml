  source_fidelity: Tumpak na naipapahayag ng salin ang paghahambing sa bautismo ni Juan, ang layuning/direksiyonal na εἰς μετάνοιαν, ang nakatataas na kapangyarihan ng darating, ang pagpapakumbaba hinggil sa pagdadala ng sandalyas, at ang mariing αὐτός. Napapanatili rin ang bukas na saklaw ng ἐν sa parehong parirala at ang hindi nilulutas na kahulugan ng “apoy.”
