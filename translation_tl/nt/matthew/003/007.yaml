  to: Ngunit nang makita niyang marami sa mga Pariseo at Saduseo ang lumalapit sa bautismo niya[a], sinabi niya sa kanila, “Lahi ng mga ulupong, sino ang nagbabala sa inyo na tumakas mula sa paparating na poot?”
