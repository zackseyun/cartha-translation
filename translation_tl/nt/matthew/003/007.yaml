id: MAT.3.7
reference: Matthew 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: tl
  text: Ngunit nang makita niyang marami sa mga Pariseo at Saduseo ang lumalapit sa bautismo niya[a], sinabi niya sa kanila, “Lahi ng mga ulupong, sino ang nagbabala sa inyo na tumakas mula sa paparating na poot?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagbabautismo niya.”
    reason: Pinananatili ang posibilidad na ang βάπτισμα ay tumutukoy sa gawain ng pagbabautismo ni Juan, hindi lamang sa bautismo bilang pangyayari.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Ngunit nang makita niya
  rationale: Ginawang likas na sugnay na panahunan sa Tagalog ang aorist participle; pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ sa daloy ng salaysay.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: maraming kabilang sa mga Pariseo at mga Saduseo
  rationale: 'Malinaw na ipinahihiwatig ng “kabilang sa” ang partitive na anyo ng Griyego: marami mula sa mga pangkat na iyon, hindi kinakailangang lahat ng kasapi.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: ang pumupunta sa kanyang pagbabautismo
  rationale: Ipinahahayag nito ang paglapit nila sa gawaing pagbabautismo ni Juan nang hindi idinaragdag na talagang nagpabautismo sila. Nananatili sa talababa ang posibleng pagtukoy sa mismong bautismo bilang pangyayari.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Mga anak ng ulupong
  rationale: Ang “mga anak” ay natural ngunit matalas na katumbas ng γεννήματα, at ang “ulupong” ay malinaw na makamandag na ahas. Pinananatili nito ang mapanuligsang larawang propetiko.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: sino ang nagbabala sa inyo
  rationale: Bagaman maaaring mangahulugang “nagpakita” o “nagturo” ang pandiwa, ang konteksto ng pagtakas sa nalalapit na poot ay nagbibigay rito ng diwang babala.
- source_word: φυγεῖν ἀπὸ
  choice: na tumakas mula sa
  rationale: Pinananatili ng “tumakas” ang larawan ng agarang paglayo sa panganib na nasa φυγεῖν.
- source_word: τῆς μελλούσης ὀργῆς
  choice: paparating na poot
  rationale: Ang “paparating” ay nagpapahayag ng nalalapit o darating na katangian ng μελλούσης, at ang “poot” ay nagpapanatili sa bigat ng ὀργή nang hindi ito pinapalitan ng mas interpretibong “hatol” o “parusa.”
theological_decisions:
- issue: Saklaw ng pagtukoy sa mga Pariseo at mga Saduseo
  choice: maraming kabilang sa mga Pariseo at mga Saduseo
  alternative: maraming Pariseo at Saduseo
  rationale: Pinananatili ng salin ang partitive na kayarian upang hindi ipahiwatig na naroon o tahasang tinutukoy ang bawat kasapi ng dalawang pangkat.
- issue: Lakas at eskatolohikal na diwa ng ὀργή
  choice: poot
  alternative: hatol; parusa
  rationale: Ang “poot” ang tuwirang katumbas na nagpapanatili sa teolohikal na bigat at sa posibleng eskatolohikal na diwa, nang hindi nilulutas ang poot bilang isa lamang partikular na anyo ng hatol o parusa.
- issue: Layunin ng paglapit nila sa bautismo
  choice: pumupunta sa kanyang pagbabautismo
  alternative: pumupunta upang magpabautismo sa kanya
  rationale: Hindi tahasang sinasabi ng talata na nagpabautismo sila o na tiyak na iyon ang kanilang layunin; kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakasanayang baybay na “Pariseo,” “Saduseo,” at “ulupong.” Ang “Mga anak ng ulupong” ay sadyang matalim upang mapanatili ang lakas ng propetikong pagsaway, samantalang iniwasan ang mas kolokyal o labis na interpretibong pananalita.
