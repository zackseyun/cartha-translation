  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: tl
  text: Si Juan mismo ay nakasuot ng damit na yari sa balahibo ng kamelyo[b][c] at may sinturong katad sa baywang[a]. Ang pagkain niya ay mga balang at ligaw na pulot-pukyutan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang kasuotan ni Juan ay nagpapaalaala sa anyo ng propetang si Elias sa 2 Hari 1:8, isang mahalagang kaugnayan sa paglalarawan ni Mateo kay Juan.
    reason: cross_reference
  - marker: b
    text: O “ang damit niya ay yari sa balahibo ng kamelyo.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “may damit.” Sa kontekstong ito, inilalarawan nito ang damit na suot ni Juan.
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Si Juan mismo
  rationale: Pinananatili ng “mismo” ang diin ng αὐτός; hindi kailangang tumbasan nang tahasan ang mahinang pang-ugnay na δέ sa simula ng pangungusap.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: ay nakasuot ng damit
  rationale: Sa konteksto, inilalarawan ng εἶχεν ang kasuutan ni Juan. Ang “nakasuot” ay likas sa Tagalog at umiiwas sa pahiwatig na ipinagawa niya ang damit.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: na yari sa balahibo ng kamelyo
  rationale: Ipinahahayag ng ἀπό ang materyales. Ang “balahibo” ay malinaw at karaniwang tawag sa buhok ng hayop.
- source_word: ζώνην δερματίνην
  choice: sinturong katad
  rationale: Ang ζώνη ay sinturon o pamigkis, at ang δερματίνην ay tumutukoy sa materyales na katad.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: sa baywang
  rationale: Ang “sa baywang” ay natural na Tagalog para sa bagay na isinusuot paikot sa ὀσφύς.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: Ang pagkain niya ay
  rationale: Direkta at malinaw na katumbas ng paglalarawan sa kaniyang τροφή; ang bagong pangungusap ay natural sa Tagalog.
- source_word: ἀκρίδες
  choice: mga balang
  rationale: 'Ito ang karaniwang kahulugan ng salitang Griyego: mga insektong balang, hindi isang uri ng halaman.'
- source_word: μέλι ἄγριον
  choice: pulot-pukyutang ligaw
  rationale: Pinananatili ang diwa ng pulot na matatagpuan sa ilang o mula sa mga pukyutang ligaw, nang hindi ginagawang domestikadong produkto.
theological_decisions:
- issue: Pagkakahawig ng anyo ni Juan sa propetang Elias
  choice: Panatilihing tuwiran ang paglalarawan sa pangunahing teksto at ilagay ang ugnayan kay Elias sa talababa.
  alternative: Gumamit sa pangunahing teksto ng pananalitang mas tahasang nagpapakilala kay Juan bilang tulad ni Elias.
  rationale: Inilalarawan lamang ng talata ang damit at pagkain ni Juan. Totoo ang alusyon sa 2 Hari 1:8, ngunit hindi ito dapat ipasok bilang tahasang interpretasyon sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinturon” sa halip na mas lumang “pamigkis,” at “baywang” sa halip na arkaikong pananalita. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
