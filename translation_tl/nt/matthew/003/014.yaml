  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: tl
  text: Ngunit patuloy na sinikap ni Juan na pigilan siya,[a] at sinabi niya, “Kailangan akong bautismuhan mo, at ikaw ang lumalapit sa akin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinipigilan siya ni Juan.” Maaaring ipahiwatig ng pandiwang imperpektibo sa Griyego ang paulit-ulit o nagpapatuloy na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: patuloy siyang pinipigilan
  rationale: Ipinahahayag nito ang aspektong imperpektibo ng pandiwa—isang nagpapatuloy o paulit-ulit na pagtatangkang hadlangan—nang hindi ginagawang tiyak na lubusang napigilan ni Juan si Jesus.
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili ng pariralang ito ang ugnayan ng pagpigil ni Juan at ng sinabi niyang paliwanag.
- source_word: χρείαν ἔχω
  choice: Ako ang kailangang
  rationale: Natural sa modernong Tagalog at malinaw na ipinapahayag ang personal na pangangailangan ni Juan; ang “ang” ay nagtatampok sa kaibahan nila ni Jesus.
- source_word: ὑπὸ σοῦ βαπτισθῆναι
  choice: bautismuhan mo
  rationale: Natural na aktibong ayos sa Tagalog na tumpak na pinananatili si Jesus bilang tagaganap at si Juan bilang tatanggap ng bautismo, kahit pasibo ang anyo sa Griyego.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: pero ikaw pa ang lumalapit sa akin?
  rationale: Ang “ikaw pa” ay natural na naghahatid ng retorikal na pagtataka at matinding paghahambing na likas sa pagkakasunod ng mga salita sa Griyego, samantalang ang kasalukuyang “lumalapit” ay nagpapanatili sa aspektong ipinahahayag ng ἔρχῃ.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na naghahatid ng banayad na pagsalungat sa paglapit ni Jesus kay Juan sa naunang konteksto.
theological_decisions:
- issue: Pagtutol ni Juan na bautismuhan si Jesus
  choice: Tuwirang ipinahayag ang pangangailangan ni Juan na bautismuhan siya ni Jesus at ang pagtataka niyang si Jesus ang lumalapit sa kanya.
  alternative: Ipaliwanag ang pagtutol bilang tahasang pahayag tungkol sa kawalang-kasalanan ni Jesus o bilang usapin lamang ng ranggo at awtoridad.
  rationale: Ipinakikita ng talata ang pagkilala ni Juan sa kahigitan ni Jesus at sa sarili niyang pangangailangan, ngunit hindi nito ganap na ipinapaliwanag ang teolohikal na dahilan. Kaya pinananatili ng salin ang tensiyon nang walang idinagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “bautismuhan” bilang karaniwan at hindi sektaryong terminong panrelihiyon. Ang “pero ikaw pa” ay kolokyal ngunit dignified at malinaw na naghahatid ng retorikal na paghahambing.
