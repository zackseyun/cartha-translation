revisions:
- from: Ngunit patuloy siyang pinipigilan ni Juan,[a] na sinasabi, “Ako ang kailangang bautismuhan mo, pero ikaw pa ang lumalapit sa akin?”
  to: Ngunit patuloy na sinikap ni Juan na pigilan siya,[a] at sinabi niya, “Kailangan akong bautismuhan mo, at ikaw ang lumalapit sa akin?”
  rationale: Pinalitan ang hindi tiyak na focal na konstruksyon ng “Kailangan akong bautismuhan mo” upang si Juan ang malinaw na may pangangailangan at si Jesus ang malinaw na tagaganap. Ginawang “at ikaw ang lumalapit sa akin?” ang huling tanong upang mapanatili ang diin sa “ikaw” nang hindi magdagdag ng “pa/yet.” Inayos din ang pang-ugnay ng pananalita para sa mas natural na modernong Filipino. Ang talababa ay inangkop upang maging tunay na alternatibo sa pangunahing salin at upang panatilihin ang impormasyon tungkol sa imperpektibong aspekto.
