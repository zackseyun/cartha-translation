  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: tl
  text: Ngunit sumagot si Jesus sa kanya, “Hayaan mo muna itong mangyari, sapagkat sa ganitong paraan ay nararapat nating tuparin ang buong katuwiran[a].” Pagkatapos nito, pumayag si Juan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng katarungan.” Maaaring mangahulugan ang salitang Griyego ng katuwiran o katarungan; sa kontekstong ito, higit na angkop ang “katuwiran” bilang pagtugon sa matuwid na kalooban ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Ngunit sumagot si Jesus sa kanya
  rationale: Ang δέ ay nagpapakita ng pagsalungat sa pagtutol ni Juan sa naunang talata. Ang ἀποκριθεὶς ... εἶπεν ay likas na isinasalin bilang “sumagot,” at pinananatili ng “sa kanya” ang tahasang πρὸς αὐτόν.
- source_word: Ἄφες ἄρτι
  choice: Hayaan mo muna itong mangyari
  rationale: Ang ἀφίημι rito ay nangangahulugang magpahintulot, hindi magpatawad o umalis. Ipinahihiwatig ng ἄρτι ang kasalukuyang pagkakataon, kaya ang “muna” ay natural na katumbas. Ang “itong mangyari” ay nilinaw mula sa konteksto—ang pagbautismo kay Jesus—nang hindi ito labis na ipinapaliwanag.
- source_word: οὕτως γὰρ
  choice: sapagkat sa ganitong paraan
  rationale: Itinuturo ng οὕτως ang paraang kababanggit pa lamang, samakatuwid, ang pagbautismo ni Juan kay Jesus. Pinananatili ng salin ang ugnayang dahilan na ipinahihiwatig ng γάρ.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: nararapat nating
  rationale: Ang πρέπον ay tumutukoy sa kung ano ang angkop o nararapat. Ang “nararapat nating” ay natural sa modernong Tagalog at pinananatili ang inklusibong “para sa atin” ng ἡμῖν.
- source_word: πληρῶσαι
  choice: tuparin
  rationale: Sa Mateo, ang πληρόω ay madalas tumukoy sa pagtupad sa layunin o kalooban ng Diyos. Ang “tuparin” ay malinaw at may angkop na resonansiyang teolohikal nang hindi nagdaragdag ng paliwanag.
- source_word: πᾶσαν δικαιοσύνην
  choice: ang buong katuwiran
  rationale: Pinananatili ng “katuwiran” ang lawak at teolohikal na tensiyon ng δικαιοσύνη, sa halip na paliitin ito sa pagsunod lamang sa kautusan. Ang “buong” ay natural na katumbas ng πᾶσαν sa pariralang ito.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Kaya pumayag si Juan
  rationale: Ang ἀφίησιν ay historical present at nangangahulugang pinahintulutan ni Juan si Jesus. Ang “pumayag” ay natural sa Tagalog; ginawang tahasan si Juan upang maiwasan ang malabong magkasunod na panghalip, nang hindi binabago ang kahulugan.
theological_decisions:
- issue: Kahulugan ng πᾶσαν δικαιοσύνην
  choice: “ang buong katuwiran,” bilang malawak na pagtupad sa matuwid na layunin o kalooban ng Diyos sa pagkakataong ito
  alternative: “ang buong katarungan” o isang mas makitid na pagtukoy sa pagtupad sa lahat ng legal na kahilingan
  rationale: Hindi nililimitahan ng teksto ang parirala sa legal na pagsunod lamang, at hindi rin nito tahasang inilalatag ang isang mas malawak na sistemang doktrinal. Pinananatili ng “katuwiran” ang karaniwang diwa ng δικαιοσύνη sa Mateo, habang kinikilala sa talababa ang posibleng diwang “katarungan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hayaan mo muna itong mangyari” at “pumayag” para sa natural na daloy, habang pinanatili ang mas pormal at teolohikal na salitang “katuwiran.”
