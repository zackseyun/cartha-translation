id: MAT.3.13
reference: Matthew 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: tl
  text: Pagkatapos, dumating si Jesus mula sa Galilea sa Jordan, kay Juan, upang magpabautismo sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang bautismuhan siya ni Juan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa pangyayaring ito sa naunang salaysay.
- source_word: παραγίνεται
  choice: dumating
  rationale: Bagaman nasa historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang aspektong naganap; ipinahihiwatig pa rin nito ang pagdating ni Jesus sa tagpo.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: mula sa Galilea
  rationale: Malinaw na ipinapahayag ng ἀπό ang pinagmulan.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: sa Jordan
  rationale: Sa konteksto ng pagkilos, tumutukoy ito sa patutunguhan; sapat at natural ang “sa Jordan” nang hindi nagdaragdag ng salitang wala sa teksto.
- source_word: πρὸς τὸν Ἰωάννην
  choice: kay Juan
  rationale: Ipinapahayag ng πρός ang paglapit o pagpunta sa isang tao; hindi idinagdag ang titulong “Tagapagbautismo” dahil “Juan” lamang ang nasa talata.
- source_word: τοῦ βαπτισθῆναι
  choice: upang magpabautismo
  rationale: Ang articular infinitive ay nagpapahayag ng layunin. Likas sa Tagalog ang “magpabautismo” para sa pasibong diwang kusang tumanggap ng bautismo.
- source_word: ὑπ’ αὐτοῦ
  choice: sa kanya
  rationale: Ang ὑπό na may genitive ay tumutukoy sa personal na tagaganap; sa Tagalog, natural na ipinahahayag ito sa pariralang “magpabautismo sa kanya.”
theological_decisions:
- issue: Historical present ng παραγίνεται
  choice: Isinalin bilang “dumating” ayon sa natural na aspektong pasalaysay sa Tagalog
  alternative: “dumarating” o “pumunta”
  rationale: Ang literal na pangkasalukuyang anyo ay magiging asiwa sa karaniwang salaysay sa Tagalog. Ang naganap na aspekto ay hindi nagbabago sa pangyayari o teolohikal na kahulugan.
- issue: Pagbanggit sa katawagan ni Juan
  choice: “Juan” lamang
  alternative: “Juan na Tagapagbautismo”
  rationale: Juan lamang ang tahasang nasa talata; iniiwasang magdagdag ng katawagang mula sa konteksto ngunit wala sa mismong pangungusap.
- issue: Layunin ng pagpunta ni Jesus
  choice: “upang magpabautismo sa kanya”
  alternative: “para bautismuhan niya”
  rationale: Pinananatili ang layuning ipinahahayag ng τοῦ + infinitive at ang personal na tagaganap, nang hindi ipinapaliwanag ang teolohikal na kabuluhan ng bautismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magpabautismo” bilang natural na katumbas ng pasibong infinitive at iniwasan ang di-likas na sunod-sunod na pariralang may “sa.”
