  source_fidelity: Tumpak na naipapahayag ng salin ang temporal na pagsunod ng Τότε, ang pagdating ni Jesus mula sa Galilea, ang pagpunta niya sa Jordan kay Juan, at ang layuning siya ay bautismuhan ni Juan. Ang naganap na aspekto sa “dumating” ay likas sa pasalaysay na Tagalog kahit historical present ang παραγίνεται.
  naturalness: Natural at malinaw ang “Pagkatapos, dumating si Jesus mula sa Galilea sa Jordan, kay Juan, upang magpabautismo sa kanya.” Ang “magpabautismo sa kanya” ay idiomatikong Tagalog para sa pagtanggap ni Jesus ng bautismo mula kay Juan. Ang malapit na pangngalang “Juan” ay sapat na malinaw na pinatutungkulan ng “kanya.”
  terminology: Ang “Galilea,” “Jordan,” “Juan,” at “magpabautismo” ay angkop sa makabagong Filipino Tagalog at sa marangal na rehistro ng salaysay. Hindi idinagdag ang titulong wala sa mismong talata. Ang talababa ay wastong nagbibigay ng mas tahasang anyong aktibo nang hindi binabago ang kahulugan.
