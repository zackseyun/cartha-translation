  naturalness: Mas natural at masidhi sa makabagong Filipino ang “Tinig ng isang sumisigaw sa ilang” kaysa “May tinig ng isang sumisigaw sa ilang.” Inayos din ang “sa pamamagitan ng propetang Isaias,” na mas maayos na anyo sa pangungusap.
  terminology: Ang “ilang,” “daan,” “Panginoon,” at “mga landas” ay angkop sa matayog na rehistro ng sipi. Pinananatili ang “Panginoon” para sa κυρίου at ang talababa tungkol sa YHWH sa Isaias 40:3.
  issues:
