id: MAT.3.3
reference: Matthew 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: tl
  text: 'Sapagkat siya ang tinutukoy sa sinabi sa pamamagitan ng propetang Isaias:


    “Tinig ng isang sumisigaw sa ilang:[a]


    ‘Ihanda ninyo ang daan ng Panginoon[b];


    tuwirin ninyo ang kanyang mga landas.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Tinig ng isang sumisigaw: ‘Sa ilang, ihanda ninyo ang daan ng Panginoon…’”'
    reason: Ipinapakita ang alternatibong pagkakabit ng “sa ilang” sa utos na “ihanda ninyo,” sa halip na sa “sumisigaw.”
  - marker: b
    text: Sa Isaias 40:3 na pinagmulan ng siping ito, YHWH ang banal na pangalang nasa tekstong Hebreo.
    reason: Nililinaw ang pinagmulang Hebreo ng κυρίου at ang pagkakaugnay ng “Panginoon” sa banal na pangalang YHWH.
lexical_decisions:
- source_word: οὗτος
  choice: siya
  rationale: Tumutukoy ito kay Juan na Tagapagbautismo sa naunang konteksto. Mas natural sa Filipino ang “siya” kaysa sa literal na “ito” kapag tao ang tinutukoy.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag sa naunang pahayag at pinananatili ang malinaw na ugnayang lohikal.
- source_word: ὁ ῥηθεὶς
  choice: ang tinutukoy sa sinabi
  rationale: Ang articular passive participle ay tumutukoy sa taong binanggit o ipinahiwatig ng pahayag. Pinananatili ng salin ang pasibong anyo nang hindi nagdaragdag ng tahasang tagapagsalita.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: sa pamamagitan ni propetang Isaias
  rationale: Pinananatili nito ang διά na nagpapahayag ng pamamagitan o intermediate agency, sa halip na gawing simpleng “sinabi ni Isaias.”
- source_word: Φωνὴ βοῶντος
  choice: May tinig ng isang sumisigaw
  rationale: 'Natural itong pakinggan sa makabagong Filipino habang pinananatili ang genitibong ugnayan: ang tinig ay sa isang sumisigaw.'
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at angkop sa ilang na rehiyong kaugnay ng gawain ni Juan at sa sipi mula sa Isaias.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Ihanda ninyo ang daan ng Panginoon
  rationale: Ang “Ihanda ninyo” ay malinaw na maramihang pautos, at ang “daan” ay nagpapanatili sa literal at metaporikal na diwa ng ὁδός.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: tuwirin ninyo ang kanyang mga landas
  rationale: Pinananatili nito ang larawan ng pagpapatuwid ng mga landas at ang personal na panghalip na αὐτοῦ.
theological_decisions:
- issue: Paglilipat ng κυρίου sa sipi ng Isaias 40:3, kung saan YHWH ang nasa Hebreo
  choice: Panginoon
  alternative: YHWH
  rationale: κυρίου ang mababasa sa tekstong Griyego ng Mateo, kaya “Panginoon” ang nasa pangunahing teksto. Ipinaliliwanag sa talababa na YHWH ang banal na pangalan sa pinagmulang Hebreo upang mapanatili ang mahalagang intertekstuwal na kaugnayan nang hindi pinapalitan ang mismong anyo ng Griyego.
- issue: Pagkakabit ng pariralang ἐν τῇ ἐρήμῳ
  choice: ikinabit sa “sumisigaw”
  alternative: ikinabit sa utos na “Ihanda ninyo”
  rationale: Ito ang pinakanatural na pagbasa sa konteksto ng paglalarawan kay Juan sa Mateo, ngunit maaaring ikabit sa kasunod na utos sa Isaias 40:3; pinananatili sa talababa ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sa pamamagitan ni propetang Isaias” upang mapanatili ang propetikong pamamagitan, at ang maramihang “ninyo” upang malinaw na maipahayag ang mga pautos sa Griyego. Ang ayos ng taludtod ay tumutulong na maipakita ang anyong patula ng sipi.
