  to: 'Sapagkat siya ang tinutukoy sa sinabi sa pamamagitan ng propetang Isaias:


    “Tinig ng isang sumisigaw sa ilang:[a]


    ‘Ihanda ninyo ang daan ng Panginoon[b];


    tuwirin ninyo ang kanyang mga landas.’”'
  rationale: Pinalitan ang “May tinig” ng “Tinig” upang hindi magdagdag ng diwang wala sa Griyego at upang mapanatili ang anyong patula at proklamatibo ng sipi. Ginawang “ng propetang Isaias” ang pariralang pamamagitan para sa mas likas na Filipino. Pinanatili ang sintaktikong ambigwidad ng “sa ilang” sa talababa at ang intertekstuwal na tala tungkol sa YHWH.
