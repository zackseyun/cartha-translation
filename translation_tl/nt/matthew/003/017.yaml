  naturalness: Marangal at pangkasalukuyang Tagalog ang kabuuan. Mas natural at mas matipid ang “mula sa mga langit” kaysa “mula sa mga kalangitan.” Ang “na aking kinalulugdan” ay natural na paraan upang ipahayag ang pagpapatuloy ng pagkakalugod sa pormulang pahayag na ito.
  terminology: Ang “aking minamahal na Anak” ay angkop, malinaw, at pinananatili ang marangal na rehistro at tahasang ugnayang Ama-Anak. Hindi kailangan ng karagdagang doktrinal na paliwanag.
