source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: tl
  text: At narito, isang tinig mula sa mga langit[a] ang nagsabi, “Ito ang aking minamahal na Anak, na aking kinalulugdan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa langit.” Maramihan sa Griyego: “mula sa mga langit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sa kaniya ako nalugod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: At narito
  rationale: Ginamit bilang pantawag-pansin sa isang mahalaga at maringal na pangyayari. Pinananatili ng “At narito” ang diin ng Griyego nang hindi nagiging di-likas sa makabagong Tagalog.
- source_word: φωνὴ
  choice: isang tinig
  rationale: Tumutukoy ito sa malinaw na tinig na nagsasalita, hindi lamang sa isang tunog, sapagkat kasunod nito ang tuwirang pahayag.
- source_word: ἐκ τῶν οὐρανῶν
  choice: mula sa mga kalangitan
  rationale: Maramihan ang οὐρανῶν sa tekstong Griyego. Pinananatili sa pangunahing teksto ang anyong ito, habang inilalagay sa talababa ang mas karaniwang isahang “mula sa langit.”
- source_word: λέγουσα
  choice: ang nagsabi
  rationale: Bagaman participle ang anyong Griyego, mas likas sa Tagalog ang pandiwang may hangganang “nagsabi” upang ipakilala ang sipi.
- source_word: Οὗτός ἐστιν
  choice: Ito ang
  rationale: Likas at tuwirang katumbas sa Tagalog ng demonstratibong pagkakakilanlan sa Griyego.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: aking minamahal na Anak
  rationale: Ang “minamahal” ay malinaw at marangal na katumbas ng ἀγαπητός. Ang “Anak” ay tumutukoy kay Jesus sa tuwirang pahayag ng Diyos at gumaganap bilang kristolohikal na katawagan sa konteksto.
- source_word: ἐν ᾧ
  choice: na
  rationale: Ang pang-ugnay na “na” ay likas na nag-uugnay sa Anak at sa kinalulugdan ng nagsasalita. Hindi nito ipinapasok sa pangunahing teksto ang di-likas na literalismong “sa kaniya,” ngunit itinatala iyon bilang alternatibo sa talababa.
- source_word: εὐδόκησα
  choice: lubos kong kinalulugdan
  rationale: Ipinapahayag nito ang matinding pagsang-ayon at kasiyahan ng Diyos. Ang aspektong imperpektibo ng “kinalulugdan” ay likas sa Tagalog para sa umiiral na kalagayan ng pagkalugod sa pormulang pahayag na ito, nang hindi itinatanggi ang aorist na anyo ng Griyego.
theological_decisions:
- issue: Ang pahayag ng Diyos tungkol sa pagiging Anak ni Jesus
  choice: aking minamahal na Anak
  alternative: aking Anak na pinakamamahal
  rationale: Pinananatili ang tahasang ugnayang Ama-Anak at ang diin ng ἀγαπητός nang hindi nagdaragdag ng paliwanag tungkol sa paraan o panahon ng pagiging Anak.
- issue: Ang maramihang οὐρανῶν
  choice: mula sa mga kalangitan
  alternative: mula sa langit
  rationale: Sinusunod ng pangunahing teksto ang maramihang anyo ng pinagmulang Griyego. Inilalahad sa talababa ang mas karaniwan at idyomatikong isahang anyo upang hindi maitago ang tunay na pagkakaiba.
- issue: Ang ugnayan ng ἐν ᾧ sa εὐδόκησα
  choice: na lubos kong kinalulugdan
  alternative: sa kaniya ako lubos na nalugod
  rationale: Pinananatili ang pagtukoy kay Jesus bilang siyang kinalulugdan ng Diyos, ngunit hindi pinipilit sa pangunahing teksto ang literal na pang-ukol na maaaring maging mabigat sa Tagalog. Inilalahad sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang “At narito” upang mapanatili ang mariing pantawag-pansin ng pahayag, at ang “mga kalangitan” upang katawanin ang maramihang anyo ng Griyego. Iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
