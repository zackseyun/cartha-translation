  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: tl
  text: '“Narinig ninyo na sinabi[a]: ‘Huwag kang mangangalunya.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Narinig ninyo na sinabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Narinig ninyo
  rationale: Ang aorist na pandiwa sa pormulang ito ay likas na maisasalin sa Tagalog bilang “Narinig ninyo,” na tumutukoy sa kautusang naiparinig at natanggap na ng mga kausap.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng narinig at natural itong ipinahahayag sa Tagalog sa pamamagitan ng “na.”
- source_word: ἐρρέθη
  choice: sinabi
  rationale: Ang aorist passive ay impersonal sa Griyego. Sa natural na Tagalog, sapat ang “sinabi”; hindi kailangang tukuyin kung sino ang nagsabi.
- source_word: Οὐ μοιχεύσεις
  choice: Huwag kang mangangalunya
  rationale: Ang future indicative na may οὐ ay ginagamit bilang pagbabawal at umaalingawngaw sa Sampung Utos. Ang “Huwag kang mangangalunya” ay malinaw, dignified, at pamilyar na anyo ng utos sa modernong Tagalog.
theological_decisions:
- issue: Kaugnayan sa sipi mula sa Sampung Utos
  choice: 'Panatilihin ang tuwirang anyo ng pagbabawal: “Huwag kang mangangalunya.”'
  alternative: “Hindi ka mangangalunya.”
  rationale: Ipinakikita ng tuwirang pagbabawal ang anyo ng kautusan at ang intertekstuwal na kaugnayan nito sa Dekalogo, nang hindi ginagawang di-natural ang Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang pormulang panimula at ang pormal na bigat ng utos, habang iniwasan ang masyadong makaluma o kahoy na pananalita.
