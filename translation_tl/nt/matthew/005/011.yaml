- from: Mapalad kayo kapag nilalait[a] at inuusig kayo, at nagsasabi sila ng lahat ng uri ng masama laban sa inyo[b] nang hindi totoo, dahil sa akin.[c]
  to: Mapalad kayo dahil sa akin kapag nilalait[a] nila kayo, inuusig, at nagsasabi ng lahat ng uri ng masama laban sa inyo[b] nang hindi totoo.[c]
  rationale: Inayos ang sintaks para maging pare-pareho ang paksa ng tatlong pandiwa at inilagay ang “dahil sa akin” sa unahan upang malinaw na ito ang dahilan ng lahat ng inilalarawang pagsalungat. Pinalitan ang footnote c upang tumugma ito sa posisyon at tungkulin ng ψευδόμενοι bilang participial na “nagsisinungaling sila,” samantalang nananatiling natural ang pangunahing tekstong “nang hindi totoo.”
