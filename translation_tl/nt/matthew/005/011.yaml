  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: tl
  text: Mapalad kayo dahil sa akin kapag nilalait[a] nila kayo, inuusig, at nagsasabi ng lahat ng uri ng masama laban sa inyo[b] nang hindi totoo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inaalipusta.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagsasabi sila ng bawat masamang bagay laban sa inyo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nang nagsisinungaling sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Mapalad kayo
  rationale: Pinananatili ang pormula ng mga pagpapahayag ng pagiging mapalad at ang diwang higit sa karaniwang magandang kapalaran.
- source_word: ὅταν
  choice: kapag
  rationale: Likas na nagpapahayag sa Tagalog ng pangkalahatang kalagayang maaaring mangyari, gaya ng ipinahihiwatig ng Griyegong may kasunod na mga pandiwang nasa subjunctive.
- source_word: ὀνειδίσωσιν
  choice: nilalait kayo
  rationale: Malinaw at kasalukuyang pananalita para sa mapanlait na pagsasalita o pag-alipusta.
- source_word: διώξωσιν
  choice: inuusig kayo
  rationale: Sinasaklaw ang mapoot na pagtrato dahil sa kaugnayan kay Jesus nang hindi nililimitahan sa pisikal na karahasan.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: nagsasabi sila ng lahat ng uri ng masama laban sa inyo
  rationale: Pinananatili ang malawak at tahasang diwa ng pagsasalita ng masama laban sa mga alagad, sa halip na paliitin ito sa isang partikular na uri ng paratang.
- source_word: ψευδόμενοι
  choice: nang hindi totoo
  rationale: Natural na pang-abay na pagpapahayag na nililinaw na kasinungalingan ang masasamang sinasabi.
- source_word: ἕνεκεν ἐμοῦ
  choice: dahil sa akin
  rationale: Tuwirang ipinapahayag na ang dahilan ng pag-uusig ay ang kaugnayan at katapatan kay Jesus.
theological_decisions:
- issue: Saklaw ng pag-uusig at pagsalungat
  choice: Inilalarawan ang panlalait, pag-uusig, at sari-saring kasinungalingang sinasabi laban sa mga alagad dahil kay Jesus.
  alternative: Limitahan ang pag-uusig sa pisikal na karahasan lamang o ituring ang buong pahayag bilang paninirang-puri lamang.
  rationale: Magkakaugnay ngunit magkakaiba ang tatlong kilos sa Griyego; pinananatili ng salin ang lawak ng pagsalungat at hindi ito ipinapako sa isang anyo lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “nilalait” at “inuusig” bilang madaling maunawaang mga salita, habang pinanatiling malawak ang saklaw ng masasamang sinasabi at ng pag-uusig.
