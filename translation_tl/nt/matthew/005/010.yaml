  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: tl
  text: Pinagpala ang mga pinag-usig dahil sa katuwiran[a], sapagkat sa kanila ang kaharian ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring taglayin ng salitang Griyego ang mga diwa kapwa ng matuwid na pamumuhay at ng katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Pinananatili ang deklaratibo at teolohikal na diwa ng beatitude; hindi lamang ito tumutukoy sa pansariling damdamin ng pagiging masaya.
- source_word: οἱ δεδιωγμένοι
  choice: ang mga inuusig
  rationale: Ang artikulo at perfect passive participle ay tumutukoy sa mga taong dumanas ng pag-uusig at nananatiling nasa gayong kalagayan. Ang kasalukuyang anyong Filipino ay likas at maaaring saklawin ang patuloy o naranasang pag-uusig.
- source_word: ἕνεκεν
  choice: dahil sa
  rationale: Malinaw at natural na ipinahahayag ang sanhi o batayan ng pag-uusig.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Karaniwang salin na sumasaklaw sa matuwid na kalagayan at pamumuhay na naaayon sa kalooban ng Diyos; pinananatili sa talababa ang posibleng diwang katarungan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng pahayag ng pagpapala sa paraang marangal at likas sa Filipino.
- source_word: αὐτῶν ἐστιν
  choice: sa kanila ang
  rationale: Maikli at natural na Filipino na nagpapanatili sa diin ng Griyego sa pag-aari o pagkakaloob sa kanila.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Likas at kinikilalang salin ng natatanging parirala ni Mateo, na tumutukoy sa paghahari ng Diyos nang hindi ginagawang di-likas ang maramihang anyo ng Griyegong 'mga langit.'
theological_decisions:
- issue: Pagpapakahulugan sa δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas malawak na naipahahayag ng 'katuwiran' ang pagiging at pamumuhay nang naaayon sa kalooban ng Diyos. Gayunman, maaari ring taglayin ng salita ang diwa ng 'katarungan,' kaya pinananatili ito bilang tunay na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang tradisyonal ngunit natural na 'Pinagpala' at 'kaharian ng langit,' habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
