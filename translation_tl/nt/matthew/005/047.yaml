id: MAT.5.47
reference: Matthew 5:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: tl
  text: At kung ang mga kapatid[a] lamang ninyo ang binabati ninyo, ano ang ginagawa ninyong higit sa karaniwan?[b] Hindi ba't gayon din ang ginagawa ng mga Hentil?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay maaari ring tumukoy nang mas malawak sa mga kabilang sa sariling pangkat.
    reason: lexical_alternative
  - marker: b
    text: O “ano pa ang ginagawa ninyo nang higit?”
    reason: lexical_alternative
  - marker: c
    text: O “mga pagano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: binabati
  rationale: Tumutukoy ang pandiwa sa pagbibigay ng bati o pagpupugay. Natural sa modernong Tagalog ang “binabati” at hindi nito dinaragdagan ang diwa tungo sa pagtanggap bilang panauhin.
- source_word: ἀδελφοὺς
  choice: mga kapatid
  rationale: Bagaman panlalaking maramihan ang anyong Griyego, likas na maaaring tumukoy ang Tagalog na “mga kapatid” sa magkakapatid na lalaki o sa mga kasapi ng sariling pangkat; pinananatili sa talababa ang mas malawak na posibleng saklaw.
- source_word: μόνον
  choice: lamang
  rationale: Malinaw na nililimitahan ng “lamang” ang pagbati sa sariling mga kapatid o pangkat.
- source_word: τί περισσὸν ποιεῖτε
  choice: ano ang ginagawa ninyong higit sa karaniwan
  rationale: Ipinahahayag ng περισσόν ang gawaing lumalampas sa pangkaraniwan. Pinananatili ng salin ang retorikal na diin nang hindi ginagawang lubhang pambihira o kagila-gilalas ang kahulugan.
- source_word: ἐθνικοὶ
  choice: mga Hentil
  rationale: Sa kontekstong Judio, pangunahing tumutukoy ito sa mga hindi Judio. Pinananatili ng “mga Hentil” ang pagkakaibang etniko at pangtipan nang hindi ipinapasok ang mas mariing hatol na maaaring taglay ng “mga pagano.”
- source_word: τὸ αὐτὸ
  choice: gayon din
  rationale: Natural na katumbas ito ng paggawa ng kaparehong bagay sa Tagalog at maayos na umuugnay sa naunang kilos.
theological_decisions:
- issue: Saklaw ng ἀδελφοὺς sa turong etikal
  choice: Isinalin bilang “mga kapatid,” na hindi tinutukoy ang kasarian sa Tagalog at maaaring tumukoy sa sariling mga kamag-anak o kapangkat.
  alternative: mga kapatid na lalaki; mga kasamahan sa sariling pangkat
  rationale: Panlalaking maramihan ang Griyego, ngunit maaaring mas malawak ang panlipunang tinutukoy nito. Ang likas na lawak ng “mga kapatid” sa Tagalog ay nagpapanatili sa posibilidad na iyon nang hindi tahasang nilulutas ang hangganan ng pangkat.
- issue: Kahulugan ng ἐθνικοὶ
  choice: Isinalin bilang “mga Hentil.”
  alternative: mga pagano; mga bansa
  rationale: Pangunahing tumutukoy ang salita sa mga hindi Judio. Pinananatili ng “mga Hentil” ang kontekstuwal na pagkakaiba nang hindi nagdaragdag ng mas matinding relihiyosong paghatol.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “Hindi ba't” upang mapanatili ang retorikal na tanong, at ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang diin sa limitadong pagbati at sa kilos na higit sa karaniwan.
