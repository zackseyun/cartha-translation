  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na ang bawat lalaking dumidiborsiyo sa kanyang asawa, maliban dahil sa seksuwal na imoralidad,[a] ay nagiging sanhi ng pangangalunya ng kanyang asawa;[b] at ang sinumang mag-asawa sa babaeng hiniwalayan ay nangangalunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “seksuwal na imoralidad” ay salin ng Griyegong porneia, isang malawak na katawagan para sa ipinagbabawal na seksuwal na gawain; isinasalin din ito ng ilan bilang “pakikiapid” o “karumihang seksuwal.”
    reason: lexical_alternative
  - marker: b
    text: O, sa mas literal na paraan, “nagiging sanhi upang siya ay maging isang mangangalunya” (passive ang anyo ng infinitive sa Griyego).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: humihiwalay / babaeng hiniwalayan
  rationale: Sa konteksto ng pag-aasawa, ang ἀπολύω ay tumutukoy sa pakikipaghiwalay o diborsiyo. Mas natural sa modernong Filipino ang “humihiwalay” at “babaeng hiniwalayan” kaysa paulit-ulit na gamitin ang teknikal na “diborsiyo,” habang nananatili ang legal at pangmag-asawang diwa.
- source_word: γυναῖκα
  choice: asawa
  rationale: Bagaman maaaring mangahulugang “babae” o “asawa” ang γυνή, malinaw sa panghalip na αὐτοῦ at sa konteksto ng paghihiwalay na asawa ang tinutukoy. Ang “lalaking” sa simula ang naglilinaw na babae ang kanyang asawa.
- source_word: παρεκτὸς λόγου πορνείας
  choice: maliban kung seksuwal na imoralidad ang dahilan
  rationale: Ipinakikita ng παρεκτός ang isang tunay na eksepsiyon, at dito ang λόγος ay may diwang “dahilan” o “batayan.” Malawak ang saklaw ng πορνεία, kaya hindi ito pinakipot sa pangangalunya lamang.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: nagiging sanhi upang mangalunya siya
  rationale: Likas sa Filipino ang ganitong pagpapahayag ng sanhi. Nananatili sa talababa ang alternatibong resultative o passive na diwa ng μοιχευθῆναι.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: ang sinumang mag-asawa
  rationale: Ang sugnay na may ἐάν ay nagsasaad ng pangkalahatan at di-tiyak na kondisyon; malinaw at natural itong naipapahayag ng “ang sinumang.”
- source_word: μοιχᾶται
  choice: nangangalunya
  rationale: Ito ang tuwiran at karaniwang salin sa Filipino ng pandiwang tumutukoy sa paggawa ng pangangalunya.
- source_word: πᾶς ὁ ἀπολύων
  choice: ang bawat lalaking humihiwalay
  rationale: Pinananatili nito ang pangkalahatang saklaw ng πᾶς at ang lalaking panlipunang tagpuan ng pangungusap, na makikita rin sa pagtukoy sa kanyang asawa.
theological_decisions:
- issue: Kahulugan ng eksepsiyong παρεκτὸς λόγου πορνείας
  choice: 'Isinalin bilang tunay na eksepsiyon: “maliban kung seksuwal na imoralidad ang dahilan.”'
  alternative: “maliban sa usapin ng seksuwal na imoralidad” o “maliban sa kaso ng bawal na pagsasama”
  rationale: Tahasang naghaharap ng eksepsiyon ang Griyego. Hindi naman nililimitahan ng salin ang eksaktong saklaw ng πορνεία, kaya nananatili ang tunay na teolohikal na tensiyon.
- issue: Diwa ng μοιχευθῆναι pagkatapos ng ποιεῖ
  choice: Ginamit sa pangunahing teksto ang natural na “nagiging sanhi upang mangalunya siya.”
  alternative: “nagiging sanhi upang siya ay maging isang mangangalunya”
  rationale: Passive ang anyo ng infinitive sa Griyego at maaaring unawain bilang kilos o bilang resultang kalagayan. Malinaw ang pangunahing salin, habang itinatala sa talababa ang alternatibong diwa upang hindi lubusang lutasin ang gramatikal at interpretatibong tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “seksuwal na imoralidad” bilang malawak ngunit pamilyar na katawagan, at iniwasan ang sobrang teknikal o denominasyonal na pagpapakahulugan.
