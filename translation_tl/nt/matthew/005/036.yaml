  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: tl
  text: Huwag ka ring manumpa sa iyong ulo, sapagkat hindi mo kayang paputiin o paitimin ang kahit isang hibla ng buhok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Huwag ka ring
  rationale: Ipinagpapatuloy nito ang magkakaugnay na serye ng mga pagbabawal sa naunang konteksto; likas sa modernong Tagalog ang “ring” upang ipakita ang pagpapatuloy.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: sa pamamagitan ng iyong ulo
  rationale: Sa pagsama sa ὀμόσῃς, ang ulo ang bagay na tinatawag na panagot sa panunumpa. Mas malinaw ito kaysa sa posibleng malabong “sa iyong ulo.”
- source_word: ὀμόσῃς
  choice: manumpa
  rationale: Tuwirang katumbas ng pandiwa ng panunumpa at natural sa isang mariing pagbabawal.
- source_word: ὅτι
  choice: sapagkat
  rationale: Pinananatili ang sanhi o batayan ng pagbabawal sa isang marangal ngunit karaniwang rehistro.
- source_word: οὐ δύνασαι
  choice: hindi mo kayang
  rationale: Malinaw na ipinahahayag ang kawalan ng kakayahang binibigyang-diin ng Griyego.
- source_word: μίαν τρίχα
  choice: kahit isang buhok
  rationale: Ang “kahit” ay natural na nagpapakita ng diin sa kawalan ng kakayahang baguhin maging ang isang hibla lamang.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: paputiin o paitimin
  rationale: Pinananatili ang tuwirang paghahambing ng puti at itim, habang natural na ikinakabit sa causative na diwa ng ποιῆσαι.
- source_word: ποιῆσαι
  choice: paputiin o paitimin
  rationale: Sa kontekstong ito, nangangahulugan itong magpangyari na maging puti o itim; ang mga pandiwang may pa- ang pinakanatural at eksaktong anyo sa Tagalog.
theological_decisions:
- issue: Saklaw ng pagbabawal sa panunumpa
  choice: Isinalin bilang tuwirang pagbabawal sa panunumpa sa pamamagitan ng sariling ulo.
  alternative: Unawain bilang ganap na pagbabawal sa lahat ng uri ng panunumpa, o bilang pagbabawal lamang sa mapanlinlang na mga pormula ng panunumpa.
  rationale: Ang mismong talata ay partikular na tumutukoy sa panunumpa sa pamamagitan ng ulo at ibinabatay ito sa limitasyon ng kakayahan ng tao. Hindi nilulutas ng salin ang mas malawak na debateng teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang isahan na “ka/mo/iyong” ayon sa ikalawang panauhang isahan ng Griyego. Walang talababa sapagkat ang ibinigay na English footnote ay waring hindi tumutugma sa marker nito at inuulit lamang ang pangunahing sugnay; walang mahalagang tekstuwal o leksikal na kalabuan dito na nangangailangan ng tala.
