  to: Ang sabihin ninyo ay dapat na ‘Oo, oo’ o ‘Hindi, hindi.’ Anumang higit pa sa mga ito ay mula sa Masama[a].
  rationale: Inayos ang sintaksis upang maging mas likas sa modernong Filipino at mas malinaw na maipakita na ang ‘sabihin ninyo’ ang dapat magkaroon ng payak na anyong ‘Oo’ o ‘Hindi.’ Inalis ang ‘Ngunit’ dahil hindi ito kailangan upang maisalin ang δέ. Pinanatili ang pag-uulit, ang saklaw ng ‘anumang higit pa,’ at ang personal/di-personal na kalabuan ng τοῦ πονηροῦ sa pamamagitan ng talababa.
