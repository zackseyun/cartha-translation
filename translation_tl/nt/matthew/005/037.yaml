  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: tl
  text: Ang sabihin ninyo ay dapat na ‘Oo, oo’ o ‘Hindi, hindi.’ Anumang higit pa sa mga ito ay mula sa Masama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mula sa kasamaan.” Maaaring unawain ang Griyegong τοῦ πονηροῦ bilang personal (“ang Masama”) o di-personal (“kasamaan”).
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: dapat ay
  rationale: Ang ikatlong panauhang pautos ng εἰμί ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “dapat ay,” na pinananatili ang puwersa ng utos nang hindi nagiging asiwa ang pangungusap.
- source_word: λόγος
  choice: ang sabihin ninyo
  rationale: Sa kontekstong ito, tumutukoy ang λόγος sa sinasabi ng isang tao. Mas natural sa Tagalog ang “ang sabihin ninyo” kaysa sa literal ngunit matigas na “ang inyong salita,” habang nananatiling tuwiran at maikli.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Oo, oo’ ... ‘Hindi, hindi’
  rationale: Pinanatili ang pag-uulit upang maipakita ang diin at indayog ng Griyego; nilagyan ng “o” upang maging malinaw at natural ang pagsalungat ng dalawang tugon.
- source_word: περισσὸν
  choice: Anumang higit pa
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa anumang lumalampas sa payak na oo o hindi. Likas at malinaw sa Tagalog ang “anumang higit pa.”
- source_word: τούτων
  choice: sa mga ito
  rationale: Pinananatili ng maramihang “mga ito” ang pagtukoy ng Griyegong panghalip sa dalawang tugong kababanggit lamang.
- source_word: ἐκ
  choice: mula sa
  rationale: Tuwirang ipinahahayag ng “mula sa” ang pinagmulan o bukal na tinutukoy ng pang-ukol.
- source_word: τοῦ πονηροῦ
  choice: sa Masama
  rationale: Maaaring tumukoy ang parirala sa isang personal na “Masama” o sa di-personal na “kasamaan.” Mas malamang sa gamit ni Mateo ang personal na diwa, kaya ito ang nasa pangunahing teksto, habang itinatala sa talababa ang tunay na gramatikal na alternatibo.
theological_decisions:
- issue: Kung ang τοῦ πονηροῦ ay di-personal na “kasamaan” o personal na “ang Masama”
  choice: ang Masama
  alternative: kasamaan
  rationale: Malabo sa gramatika ang parirala, ngunit madalas gamitin ni Mateo ang ὁ πονηρός sa personal na diwa para sa Masama. Pinili sa pangunahing teksto ang malamang na kahulugan, ngunit pinanatili sa talababa ang di-personal na pagbasa upang hindi tuluyang lutasin ang tunay na tensiyon ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ang sabihin ninyo” sa halip na literal na “ang inyong salita” upang maiwasan ang asiwa at mapanatili ang malinaw na pagtukoy sa karaniwang pananalita. Pinanatili ang pag-uulit na “Oo, oo” at “Hindi, hindi” dahil mahalaga ito sa diin at anyo ng orihinal.
