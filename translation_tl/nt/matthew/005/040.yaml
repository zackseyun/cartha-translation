  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: tl
  text: At sa sinumang gustong idemanda ka[a] at kunin ang iyong tunika[b], ipaubaya mo rin sa kanya ang iyong balabal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalhin ka sa hukuman.” Ang salitang Griyego ay literal na tumutukoy sa paghatol o paglilitis sa isang usaping legal.
    reason: lexical_alternative
  - marker: b
    text: Ang “tunika” ay panloob na pangunahing kasuotan; ang “balabal” naman ay panlabas na kasuutan.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: sa sinumang gustong
  rationale: Ang substantival na participle ay tumutukoy sa sinumang tao sa pangkalahatan; natural sa modernong Tagalog ang “sinumang gustong” at pinananatili nito ang diwa ng pagnanais.
- source_word: σοι κριθῆναι
  choice: idemanda ka
  rationale: Sa kontekstong legal, ang literal na diwang “makipaghatulan sa iyo” ay tumutukoy sa pagsasampa ng usapin laban sa kausap. Ang “idemanda ka” ay maikli, malinaw, at kasalukuyang gamit.
- source_word: χιτῶνά
  choice: damit na panloob
  rationale: Ang χιτών ay kasuotang isinusuot sa ilalim ng panlabas na balabal. Iniiwasan ng saling ito ang hindi pamilyar na terminong historikal habang pinananatili ang pagkakaiba nito sa ἱμάτιον.
- source_word: λαβεῖν
  choice: kunin
  rationale: Tuwirang ipinahahayag ng “kunin” ang pagkuha o pagtatamo ng pag-aari sa konteksto ng paglilitis.
- source_word: ἄφες
  choice: ipaubaya mo sa kanya
  rationale: Dito, ang pautos na anyo ng ἀφίημι ay nangangahulugang huwag pigilan at isuko ang pag-aangkin sa kasuutan. Ang “ipaubaya” ay natural at hindi ito ginagawang teknikal na pormulang legal.
- source_word: ἱμάτιον
  choice: balabal
  rationale: Ang ἱμάτιον ay panlabas na kasuutan, kaya malinaw na naipakikita ng “balabal” ang kaibahan nito sa damit na panloob.
- source_word: καὶ ... καὶ
  choice: At ... rin
  rationale: Ang unang καί ay nag-uugnay sa naunang turo, samantalang ang ikalawa ay nagdaragdag ng panlabas na kasuutan sa dapat ipaubaya.
theological_decisions:
- issue: Etikal na bigat ng utos ni Jesus sa isang alitang legal
  choice: Isinalin bilang tuwirang utos ng radikal na hindi pagganti at mapagbigay na pagpapaubaya.
  alternative: Gawing maluwag na pangkalahatang prinsipyo lamang tungkol sa pagsuko ng mga karapatan.
  rationale: Ang pautos na ἄφες at ang kongkretong larawan ng dalawang kasuutan ay nagpapanatili sa matalim at praktikal na anyo ng turo, nang hindi ito nililimitahan sa isang partikular na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pamilyar na “idemanda” para sa legal na kilos, samantalang pinanatili ng “ipaubaya” ang tuwiran ngunit hindi marahas na lakas ng utos. Ipinaliliwanag sa talababa ang historikal na pagkakaiba ng dalawang kasuutan.
