  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: tl
  text: Pinagpala ang mga maawain, sapagkat sila ang kaaawaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tatanggap sila ng awa.” Nasa anyong panghinaharap at balintiyak ang pandiwang Griyego; hindi tahasang pinangalanan kung sino ang magkakaloob ng awa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Ipinahahayag nito ang kalagayan ng mga tumatanggap ng pagpapala at lingap, hindi lamang ang pansariling damdamin ng pagiging masaya. Angkop din ito sa marangal at maikling anyo ng mga pagpapala.
- source_word: οἱ ἐλεήμονες
  choice: ang mga maawain
  rationale: Ginagamit bilang pangngalan ang pang-uri sa Griyego. Pinananatili ng “mga maawain” ang maikli at kawikaang anyo, pati ang ugnayang leksikal nito sa pandiwang “kaaawaan.”
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng pagpapala, sa natural at marangal na modernong Tagalog.
- source_word: αὐτοὶ
  choice: sila ang
  rationale: Ipinahihiwatig ng ayos na ito ang diin ng panghalip—ang mismong mga maawain ang tatanggap ng awa—nang hindi gumagamit ng mas mabigat na “sila mismo.”
- source_word: ἐλεηθήσονται
  choice: kaaawaan
  rationale: Tuwirang sinasalamin nito ang panghinaharap na balintiyak na anyo ng pandiwang Griyego at pinananatili ang pag-uulit ng salitang-ugat na “awa.” Hindi rin nito tahasang pinapangalanan ang gumagawa ng awa.
theological_decisions:
- issue: Kung sino ang magkakaloob ng ipinangakong awa
  choice: Panatilihing di-tiyak ang gumagawa sa “kaaawaan.”
  alternative: “Kaaawaan sila ng Diyos” o “tatanggap sila ng awa mula sa iba.”
  rationale: Bagaman malakas na ipinahihiwatig ng konteksto ang Diyos bilang nagbibigay ng awa, hindi tahasang pinangalanan sa Griyego ang gumagawa. Pinananatili ng salin ang gayong teolohikal na di-pagtukoy.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinananatili ang matimbang na anyo ng pagpapala at ang magkatugmang paggamit ng salitang-ugat na “awa.”
