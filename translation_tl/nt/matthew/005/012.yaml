id: MAT.5.12
reference: Matthew 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: tl
  text: Magalak kayo at lubos na magsaya, sapagkat malaki ang gantimpala ninyo sa langit[a]. Sapagkat ganiyan din nila inusig ang mga propetang nauna sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga langit.” Madalas gamitin ni Mateo ang anyong maramihan kung saan karaniwang “langit” ang sinasabi sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Magalak kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng aktibong kagalakan; natural at marangal sa modernong Tagalog ang “magalak kayo.”
- source_word: ἀγαλλιᾶσθε
  choice: lubos na magsaya
  rationale: Masidhi at masiglang kagalakan ang ipinahihiwatig nito kaysa sa χαίρετε; pinananatili ng “lubos na magsaya” ang pag-igting nang hindi gumagamit ng salitang labis na pormal.
- source_word: μισθὸς
  choice: gantimpala
  rationale: Bagaman maaari rin itong tumukoy sa upa o kabayaran, “gantimpala” ang angkop sa konteksto ng tugon ng Diyos sa mga inuusig at hindi ito tunog komersiyal.
- source_word: πολὺς
  choice: malaki
  rationale: Inilalarawan nito ang laki o kasaganaan ng gantimpala; “malaki ang gantimpala” ang likas na parirala sa Tagalog.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa langit
  rationale: Maramihan ang anyong Griyego, ngunit karaniwang isahan ang “langit” sa natural na Tagalog kapag tinutukoy ang makalangit na dako. Itinatala sa talababa ang mas pormal na anyo.
- source_word: οὕτως
  choice: ganiyan din
  rationale: Itinuturo nito ang pagkakatulad ng paraan ng pag-uusig sa mga alagad at sa mga propeta; malinaw at natural sa Tagalog ang “ganiyan din.”
- source_word: ἐδίωξαν
  choice: inusig
  rationale: Malinaw na pag-uusig dahil sa pananampalataya ang kahulugan ng διώκω sa kontekstong ito.
- source_word: προφήτας
  choice: mga propeta
  rationale: Ito ang karaniwan at malinaw na katawagan sa mga propeta ng Israel.
- source_word: τοὺς πρὸ ὑμῶν
  choice: nauna sa inyo
  rationale: Ipinahihiwatig ng parirala ang mga propetang nabuhay bago ang mga kausap ni Jesus; maikli at natural ang salin.
theological_decisions:
- issue: Kahulugan ng “sa langit” / “sa mga langit”
  choice: “Sa langit,” bilang natural na pagtukoy sa makalangit na dako kung saan naroon ang gantimpalang mula sa Diyos.
  alternative: “Sa mga langit,” na mas tuwirang sumusunod sa maramihang anyo ng Griyego.
  rationale: 'Hindi nilulutas ng pagpili ang isang doktrinal na pagtatalo. Pangunahing usaping pangwika ito: maramihan ang οὐρανοῖς, ngunit karaniwang isahan ang katumbas nito sa modernong Tagalog. Pinananatili sa talababa ang pormal na alternatibo.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang magkatambal na utos na “magalak” at “lubos na magsaya,” habang iniwasan ang labis na teknikal o makalumang pananalita.
