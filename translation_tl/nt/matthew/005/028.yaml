id: MAT.5.28
reference: Matthew 5:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na ang sinumang tumitingin sa isang babae[a] upang pagnasaan siya[b] ay nangalunya na sa kanya sa sarili niyang puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay maaaring mangahulugang “babae” o “asawa,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin: “nang may pagnanasa sa kanya.”'
    reason: translation_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ng “ngunit” ang pagsalungat ng δέ, at ipinahihiwatig ng tahasang “ko” ang diin ng ἐγώ. Likas at marangal din sa makabagong Filipino ang pariralang ito.
- source_word: πᾶς ὁ βλέπων
  choice: ang sinumang tumitingin
  rationale: Ipinahahayag ng “sinumang” ang pangkalahatang saklaw ng πᾶς nang hindi labis na tinutukoy ang kasarian; ang “tumitingin” ay tuwirang tumutugma sa βλέπων.
- source_word: γυναῖκα
  choice: sa isang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang γυνή. Mas angkop sa pangkalahatang pahayag ang “babae,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: upang pagnasaan siya
  rationale: Malinaw na ipinakikita ng “upang” ang layunin o sinasadyang direksiyon ng πρὸς + articular infinitive. Sa kontekstong seksuwal, natural na ipinahahayag ng “pagnasaan” ang masamang pagnanasa ng ἐπιθυμέω.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: ay nangalunya na sa kanya
  rationale: Ang “na” ay kumakatawan sa ἤδη, at ang “nangalunya sa kanya” ay natural na salin ng μοιχεύω kasama ang tuwirang layon na αὐτήν.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sa sarili niyang puso
  rationale: Pinananatili nito ang biblikal na larawan ng καρδία bilang kaloob-looban, habang nililinaw ng “sarili niyang” na puso ito ng taong tumitingin.
theological_decisions:
- issue: Kung isasalin ang γυνή bilang “babae” o “asawa” sa konteksto ng pangangalunya
  choice: babae
  alternative: asawa
  rationale: Hindi tahasang itinatakda ng anyong Griego ang katayuang may-asawa. Pinananatili ng “babae” ang lawak ng pahayag, samantalang kinikilala sa talababa ang posibleng kahulugang “asawa.”
- issue: Kung ilalarawan ang pagtingin bilang may layuning magnasa o bilang pagtinging may pagnanasa
  choice: upang pagnasaan siya
  alternative: nang may pagnanasa sa kanya
  rationale: Ang πρὸς τὸ kasama ang pawatas ay karaniwang nagpapahayag ng layunin o intensiyon. Kaya hindi lamang basta pagkakita ang tinutukoy kundi ang sinasadyang pagtingin na nakatuon sa masamang pagnanasa; gayunman, ibinibigay sa talababa ang idiomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “upang” upang mapanatili ang layuning ipinahahayag ng konstruksiyong Griego, at iniwasan ang sobrang teknikal o makalumang pananalita.
