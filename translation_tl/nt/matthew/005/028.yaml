  source_fidelity: 'Tapat ang salin sa pangunahing mga elementong Griego: ang mariing pagsalungat at unang panauhan ("Ngunit sinasabi ko sa inyo"), ang pangkalahatang saklaw ("ang sinumang"), ang layuning ipinahahayag ng πρὸς τὸ + pawatas ("upang pagnasaan siya"), ang ἤδη ("na"), at ang larawang "sa ... puso." Hindi nito pinipilit ang γυνή na mangahulugang "asawa" lamang.'
  naturalness: Likas, malinaw, at angkop sa marangal na makabagong Filipino ang daloy ng pangungusap. Ang "upang pagnasaan siya" ay tuwirang nagsasaad ng sinasadyang layunin at mas natural kaysa sa mas mahaba o malabong pagpapahayag. Nauunawaan ang "nangalunya na sa kanya" sa kontekstong ito.
  terminology: Ang "babae" ay wastong pangunahing salin ng γυναῖκα sa pangkalahatang pahayag, at maayos na itinatala ng talababa ang "asawa" bilang posibleng kahulugan ayon sa konteksto. Ang "pagnasaan" ay angkop sa seksuwal at etikang konteksto ng ἐπιθυμῆσαι nang hindi nagdaragdag ng isang tiyak na doktrinal na pagbasa. Ang "puso" ay nagpapanatili ng biblikal na saklaw ng καρδία.
