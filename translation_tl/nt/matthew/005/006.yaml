id: MAT.5.6
reference: Matthew 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: tl
  text: Mapalad ang mga nagugutom at nauuhaw sa katuwiran[a], sapagkat sila ay bubusugin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Ang salitang Griyego ay maaaring tumukoy sa katuwiran, katarungan, o sa kung ano ang tama sa harap ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Mapalad
  rationale: Likas at marangal na pananalita ito para sa pahayag ng pagpapala; hindi nito nililimitahan ang kahulugan sa pansariling damdaming gaya ng “masaya.”
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ang mga nagugutom at nauuhaw
  rationale: Pinananatili nito ang matingkad na larawan ng gutom at uhaw at ang patuloy na paghahangad na ipinahihiwatig ng mga present participle.
- source_word: τὴν δικαιοσύνην
  choice: sa katuwiran
  rationale: Saklaw ng “katuwiran” ang pagiging matuwid at ang kalagayang tama sa harap ng Diyos, habang iniiwan ding bukas ang kaugnay na diwa ng katarungan sa talababa.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng ipinahayag na pagpapala at angkop ito sa marangal na rehistro ng talata.
- source_word: αὐτοὶ
  choice: sila
  rationale: Ang lantad na panghalip ay nagpapanatili ng diin ng Griyego nang hindi nagiging mabigat o di-likas sa Tagalog.
- source_word: χορτασθήσονται
  choice: ay bubusugin
  rationale: Pinananatili ng “bubusugin” ang larawan ng lubos na pagpuno sa gutom at ang future passive, na hindi tahasang pinapangalanan kung sino ang kikilos.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring tumukoy ang salita sa matuwid na pagkatao, sa pagiging tama sa harap ng Diyos, at sa katarungan. Ginamit sa pangunahing teksto ang mas malawak na teolohikal na “katuwiran,” ngunit pinanatili sa talababa ang tunay na posibleng pagbasa na “katarungan.”
- issue: Hindi tahasang pinangalanang tagakilos sa χορτασθήσονται
  choice: panatilihin ang balintiyak na “bubusugin”
  alternative: “bubusugin sila ng Diyos”
  rationale: Balintiyak ang pandiwang Griyego at hindi nito tahasang binabanggit ang Diyos bilang tagakilos. Bagaman maaaring maunawaan itong divine passive, hindi idinagdag sa teksto ang hindi tahasang nakasaad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “Mapalad” at “sapagkat” ay angkop sa anyong pahayag ng beatitude, samantalang ang “nagugutom,” “nauuhaw,” at “bubusugin” ay nagpapanatili ng magkakaugnay na larawang pandama.
