  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: tl
  text: “Narinig ninyo na sinabi, ‘Mata para sa mata at ngipin para sa ngipin.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Narinig ninyo
  rationale: Likas na salin sa modernong Tagalog ng aorist sa pormulang panimula ni Mateo; tumutukoy ito sa aral na dati nang narinig at alam ng mga kausap.
- source_word: ὅτι ἐρρέθη
  choice: na sinabi
  rationale: Ipinakikilala ang nilalaman ng narinig at pinananatili ang impersonal na pasibong pahayag nang hindi tinutukoy kung sino ang nagsabi.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Mata para sa mata
  rationale: Ang “para sa” ay natural at kinikilalang katumbas sa Tagalog ng ἀντί sa pormulang legal na ito, na nagpapahayag ng katumbas na ganti o kapalit.
- source_word: καὶ ὀδόντα ἀντὶ ὀδόντος
  choice: at ngipin para sa ngipin
  rationale: Pinananatili ang balanseng paralelismo at ang parehong kahulugan ng ἀντί sa ikalawang bahagi ng kasabihang legal.
theological_decisions:
- issue: Paglalarawan sa prinsipyong legal na sinipi ni Jesus
  choice: Mata para sa mata at ngipin para sa ngipin
  alternative: Mata bilang kapalit ng mata at ngipin bilang kapalit ng ngipin
  rationale: Tumpak at madaling makilalang pormula ito sa Tagalog. Hindi nito ipinapasiya kung ang tuntunin ay literal na pagganti o sukatan ng katumbas na pananagutan, kaya nananatili ang tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at madaling maunawaan. Pinanatili ang maikli at balanseng anyo ng legal na kasabihan; walang talababa dahil ang “para sa” ay malinaw at natural, samantalang ang mas literal na “bilang kapalit ng” ay hindi nagdaragdag ng mahalagang impormasyong kailangan sa talata.
