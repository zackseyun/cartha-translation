  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: tl
  text: '“Narinig ninyo na sinabi: ‘Ibigin mo ang iyong kapwa at kapootan mo ang iyong kaaway.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang unang sugnay ay umaalingawngaw sa Levitico 19:18. Ang ikalawang sugnay (“at kapootan mo ang iyong kaaway”) ay hindi tuwirang sipi mula sa Lumang Tipan kundi sumasalamin sa tinanggap na aral na itinutuwid dito ni Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Narinig ninyo
  rationale: Ang aorist sa pormulang ito ay natural na isinasalin sa Tagalog bilang “Narinig ninyo,” na tumutukoy sa aral na dati nang tinanggap o napakinggan ng mga kausap.
- source_word: ἐρρέθη
  choice: sinabi
  rationale: Pinananatili ng “sinabi” ang di-tiyak na pasibong diwa nang hindi tinutukoy kung sino ang nagsalita.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Ang future indicative ay gumaganap bilang utos. Ang “Ibigin mo” ay dignificado at angkop sa anyo ng sipi mula sa Levitico 19:18.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Ang “kapwa” ang natural at matatag na katumbas sa etikong kontekstong ito at tumutugma sa alusyon sa Levitico 19:18.
- source_word: μισήσεις
  choice: kapootan mo
  rationale: Ipinahahayag nito ang parehong utos na puwersa ng future indicative at pinananatili ang tuwirang pagsalungat sa “Ibigin mo.”
- source_word: τὸν ἐχθρόν σου
  choice: ang iyong kaaway
  rationale: Ang “kaaway” ang tuwiran at karaniwang katumbas ng ἐχθρός sa kontekstong ito.
theological_decisions:
- issue: Katayuan ng pariralang “at kapootan mo ang iyong kaaway”
  choice: Isinama ito sa kabuuang kasabihang iniulat ni Jesus na narinig ng kanyang mga tagapakinig, nang hindi ipinahihiwatig na tuwirang sipi ang buong pangungusap mula sa Lumang Tipan.
  alternative: Ituring ang buong pangungusap bilang pantay na tuwirang sipi sa Kasulatan, o tukuyin sa pangunahing teksto na tradisyong interpretatibo lamang ang ikalawang sugnay.
  rationale: Iisang iniulat na kasabihan ang ipinakikita ng Griyego sa ilalim ng “Narinig ninyo na sinabi.” Gayunman, Levitico 19:18 lamang ang pinagmumulan ng unang sugnay; kaya nililinaw ito sa talababa nang hindi nilulutas o binabago ang tensiyon sa pangunahing teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Ibigin” at “kapootan” upang mapanatili ang malinaw at magkatimbang na anyong pautos; iniwasan ang mas arkaikong ayos at ang pagdaragdag ng di-nasa-Griyegong tagapagsalita.
