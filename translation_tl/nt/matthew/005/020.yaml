  source_fidelity: Tumpak na naipapahayag ang γάρ sa “Sapagkat,” ang kinakailangang kondisyon ng ἐὰν μὴ sa “malibang,” ang paghahambing ng περισσεύσῃ ... πλεῖον sa “higitan ... ang sa,” at ang mariing οὐ μή sa “hinding-hindi kayo makapapasok.” Napananatili rin ang “kaharian ng langit,” ang karaniwang katumbas ng βασιλεία τῶν οὐρανῶν sa Mateo.
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino Tagalog. Ang estrukturang “higitan ng inyong pagiging matuwid ang sa mga eskriba at mga Pariseo” ay gramatikal at maayos na naiiwasan ang maling pagpapahiwatig na ang mga tao mismo ang hinihigitan sa halip na ang kanilang pagiging matuwid.
  terminology: Ang “pagiging matuwid” ay angkop para sa δικαιοσύνη sa agarang konteksto ng Mateo 5; ang “katarungan” sa talababa ay wastong leksikal na alternatibo. Ang “mga eskriba,” “mga Pariseo,” at “kaharian ng langit” ay wasto, makasaysayan, at pare-pareho ang rehistro.
