id: MAT.5.20
reference: Matthew 5:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: tl
  text: Sapagkat sinasabi ko sa inyo, malibang higitan ng inyong pagiging matuwid[a] ang sa mga eskriba at mga Pariseo, hinding-hindi kayo makapapasok sa kaharian ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Maaaring tumukoy ang salitang Griyego sa pagiging matuwid at sa katarungan; sa konteksto ng Mateo 5, mas angkop dito ang “pagiging matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na bisa ng γάρ, at natural na tuwirang pananalita sa modernong Tagalog ang “sinasabi ko sa inyo.”
- source_word: ἐὰν μὴ
  choice: malibang
  rationale: Malinaw at maikli nitong ipinahahayag ang kinakailangang negatibong kondisyon.
- source_word: περισσεύσῃ ... πλεῖον
  choice: higitan ... ang
  rationale: Ipinahahayag nito ang paghahambing na ang pagiging matuwid ng mga kinakausap ay kailangang lumampas sa pagiging matuwid ng binanggit na mga pangkat.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: inyong pagiging matuwid
  rationale: Mas natural sa pangungusap ang “pagiging matuwid” kaysa abstraktong “katuwiran,” at angkop ito sa konteksto ng Mateo 5 tungkol sa matuwid na pamumuhay; pinananatili sa talababa ang posibleng diwang “katarungan.”
- source_word: γραμματέων
  choice: mga eskriba
  rationale: Tiyak at makasaysayang katawagan ito para sa mga kinikilalang dalubhasa at tagapagsalin ng Kautusan, nang hindi ipinapaliit ang kanilang gampanin sa pagtuturo lamang.
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat.
- source_word: οὐ μὴ εἰσέλθητε
  choice: hinding-hindi kayo makapapasok
  rationale: Ang pag-uulit na “hinding-hindi” ay natural na Filipino at nagpapanatili sa mariing pagtanggi ng οὐ μή kasama ng aorist subjunctive.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: kaharian ng langit
  rationale: Ito ang natural at nakagawiang salin ng natatanging parirala ni Mateo, nang hindi ginagawang di-likas na maramihan ang “mga langit.”
theological_decisions:
- issue: Pagpapakahulugan sa δικαιοσύνη sa konteksto ng Mateo
  choice: pagiging matuwid
  alternative: katarungan
  rationale: Sa Mateo 5:20, pangunahing tinutukoy ng salita ang wastong pamumuhay at pagsunod na nakikita sa paghahambing sa mga eskriba at Pariseo. Gayunman, hindi inaalis ang leksikal na diwa ng katarungan, kaya inilalahad ito sa talababa.
- issue: Lakas ng babala tungkol sa pagpasok sa kaharian
  choice: hinding-hindi kayo makapapasok
  alternative: tiyak na hindi kayo makapapasok
  rationale: Pinananatili ng napiling anyo ang mariin at walang-pasubaling tunog ng οὐ μή nang hindi dinaragdagan ang teolohikong kahulugan ng pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang makasaysayang katawagang “mga eskriba,” ang mariing pagtanggi na “hinding-hindi,” at ang nakagawiang pariralang “kaharian ng langit.”
