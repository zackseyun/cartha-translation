  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: tl
  text: Nang makita niya ang mga pulutong ng tao, umakyat siya sa bundok. Pagkaupo niya, lumapit sa kanya ang mga alagad niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Nang makita niya
  rationale: Ang aorist participle ay naglalahad ng kalagayang kaugnay ng pangunahing kilos. Likas sa modernong Tagalog ang “Nang makita niya” at hindi nito labis na pinatitigas ang pagkakasunod-sunod.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay o panandang transisyon ito; hindi kailangang tumbasan nang tahasan sa natural na Tagalog.
- source_word: τοὺς ὄχλους
  choice: ang maraming tao
  rationale: Bagaman maramihan ang ὄχλους, mas natural sa Tagalog ang kolektibong pariralang “maraming tao” kaysa “mga pulutong,” habang malinaw pa rin ang dami.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: umakyat siya sa bundok
  rationale: Tumpak at karaniwang paraan ito ng paglalarawan sa paitaas na pagpunta sa bundok; iniiwasan ang labis na pormal na “umahon.”
- source_word: τὸ ὄρος
  choice: bundok
  rationale: Karaniwang kahulugan ng ὄρος ang bundok o mataas na lupain. Pinananatili ng “sa bundok” ang tiyak na anyo ng Griyego nang hindi nagpapalagay ng pangalan o eksaktong topograpiya.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Pagkaupo niya
  rationale: Ang genitive absolute ay nagsasaad ng temporal na kalagayan. Maikli at natural ang “Pagkaupo niya,” at maaari itong unawain bilang nang o matapos siyang maupo.
- source_word: προσῆλθαν αὐτῷ
  choice: lumapit sa kanya
  rationale: Direkta at natural na katumbas ng paglapit o pagpunta sa isang tao.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang malinaw at nakaugaliang salin ng μαθηταί sa ugnayang guro-tagasunod.
theological_decisions:
- issue: Tiyak na anyo ng τὸ ὄρος
  choice: sa bundok
  alternative: sa isang bundok; sa dalisdis
  rationale: May tiyak na pantukoy ang Griyego. Ang “sa bundok” ay nagpapanatili nito ngunit hindi nagpapakilala ng isang pinangalanang bundok.
- issue: Temporal na ugnayan ng καθίσαντος αὐτοῦ
  choice: Pagkaupo niya
  alternative: Nang maupo siya; Matapos siyang maupo
  rationale: Ipinahihiwatig ng genitive absolute ang temporal o kasabay na kalagayan ngunit hindi kailangang gawing mahigpit na sunod-sunod. Pinananatili rin nito ang teksto mula sa pagdaragdag ng teolohikal o seremonyal na kahulugan sa pag-upo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “maraming tao” para sa natural na kolektibong pagpapahayag at “mga alagad” bilang karaniwang terminong biblikal. Walang footnote dahil malinaw na naihahatid sa pangunahing teksto ang mga tunay na posibilidad ng konstruksiyon nang walang mahalagang pagkawala.
