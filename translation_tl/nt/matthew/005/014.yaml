base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: tl
  text: Kayo ang ilaw ng mundo. Hindi maitatago ang isang lungsod na nakatayo sa ibabaw ng isang bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi maitatago ang isang lungsod na nakalagay sa ibabaw ng isang bundok.”'
    reason: Ipinakikita ang mas literal na kahulugan ng κειμένη, na tumutukoy sa lungsod na nakalagay o nakapuwesto roon. Ang “nakatayo” sa pangunahing teksto ay mas natural na Tagalog sa larawang ito.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kayo
  rationale: Hayag at may diin ang panghalip na pangalawang panauhang maramihan. Likas na naipahahayag sa Tagalog ang tuwirang diin sa pamamagitan ng “Kayo” sa unahan.
- source_word: τὸ φῶς
  choice: ang ilaw
  rationale: Pinananatili ang tiyak at tuwirang metapora ng Griyego; natural sa modernong Tagalog ang “ang ilaw.”
- source_word: τοῦ κόσμου
  choice: ng mundo
  rationale: Tuwirang pinananatili ang genitibong ugnayan at ang malawak na kahulugan ng κόσμος, sa halip na gawing mas interpretibong “para sa mundo.”
- source_word: οὐ δύναται
  choice: Hindi maitatago
  rationale: 'Ang konstruksiyong may δυνατότητα at pasibong infinitive ay natural na naipapahayag sa Tagalog bilang imposibilidad: “Hindi maitatago.”'
- source_word: πόλις
  choice: isang lungsod
  rationale: Ang “lungsod” ang karaniwang katumbas ng πόλις; ang “isang” ay natural na nagpapakilala sa pangkalahatang larawan.
- source_word: κρυβῆναι
  choice: maitatago
  rationale: Pinananatili nito ang pasibong diwa ng “maitago” sa maikli at likas na Tagalog.
- source_word: ἐπάνω ὄρους
  choice: sa ibabaw ng isang bundok
  rationale: Mas malapit ito sa literal na topograpikong diwa ng ὄρος kaysa “burol,” habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: κειμένη
  choice: nakatayo
  rationale: Sa pagtukoy sa isang lungsod, likas sa Tagalog ang “nakatayo” para sa pagiging nakalagay o nakapuwesto sa isang mataas na lugar; ang mas literal na “nakahimlay” ay hindi natural dito.
theological_decisions:
- issue: Metaporikal na pagkakakilanlan ng mga alagad bilang ilaw
  choice: 'Pinanatili ang tuwirang metapora: “Kayo ang ilaw ng mundo.”'
  alternative: “Kayo ang ilaw para sa mundo.”
  rationale: Ang “ng mundo” ay mas malapit sa genitibong τοῦ κόσμου at hindi nagpapasok ng paliwanag tungkol sa layunin na hindi tahasang sinabi sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang kilalang metapora at iniwasan ang labis na interpretasyon.
