  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: tl
  text: Sa gayunding paraan, magliwanag ang inyong ilaw sa harap ng mga tao, upang makita nila ang mabubuti ninyong gawa at luwalhatiin ang inyong Ama na nasa kalangitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, pangmaramihan ang salita: “nasa mga langit.” Maaari rin itong isaling “nasa langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Sa gayunding paraan
  rationale: Ikinakabit nito ang utos sa naunang larawan ng ilawang nagbibigay-liwanag at malinaw na ipinahahayag ang paraan.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: paliwanagin ninyo ang inyong ilaw
  rationale: Natural at tuwirang utos sa Filipino na pinananatili ang aktibong puwersa ng imperatibo at ang pang-isahang ‘ilaw’ na sama-samang kumakatawan sa patotoo ng mga alagad.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Ang ‘mga tao’ ay likas na pangkalahatan sa Filipino at tumutukoy sa mga tao anuman ang kasarian.
- source_word: ὅπως ἴδωσιν
  choice: upang makita nila
  rationale: Malinaw na naghahayag ng layunin at natural na kumakatawan sa sugnay na may subjunctive.
- source_word: τὰ καλὰ ἔργα
  choice: ang mabubuti ninyong gawa
  rationale: Ang ‘mabubuting gawa’ ang malinaw at karaniwang katumbas, habang maaari ring magpahiwatig ang καλός ng marangal o kahanga-hangang gawa.
- source_word: δοξάσωσιν
  choice: luwalhatiin
  rationale: Pinananatili ang matimbang at kinikilalang kahulugan ng δοξάζω kapag Diyos ang tinutukoy.
- source_word: τὸν πατέρα ὑμῶν
  choice: ang inyong Ama
  rationale: Natural na anyong paari na pinananatili ang mahalagang wikang pampakikipag-ugnayan sa teksto.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: na nasa kalangitan
  rationale: Ang ‘kalangitan’ ay natural at marangal sa modernong Filipino at naipahihiwatig ang mas malawak na anyong nasa pangmaramihan sa Griyego.
theological_decisions:
- issue: Pangkalahatang saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Sa konteksto, ang ἀνθρώπων ay tumutukoy sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaking tao. Tahasang naipahahayag ito ng ‘mga tao’ nang walang kailangang paliwanag sa talababa.
- issue: Pangmaramihang οὐρανοῖς
  choice: nasa kalangitan
  alternative: nasa langit / nasa mga langit
  rationale: Hindi nililimita sa karaniwang pang-isahang ‘langit’ ang anyo ng Griyego, ngunit iniiwasan din ang di-likas na literalismong ‘mga langit’ sa pangunahing teksto. Itinatala sa talababa ang pormal na pangmaramihan.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang ‘paliwanagin ninyo’ upang maging tuwiran ang utos, ‘mga tao’ para sa pangkalahatang sangkatauhan, at ‘kalangitan’ upang mapanatili hangga't maaari ang anyong pangmaramihan ng Griyego nang hindi nagiging asiwa ang pangunahing teksto.
