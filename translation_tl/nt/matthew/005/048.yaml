  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: tl
  text: Kaya nga, maging ganap[a] kayo, gaya ng inyong Ama na nasa langit, na ganap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “perpekto,” “lubos,” “buo,” o “hinog.” Ang salitang Griyego na τέλειος ay maaaring tumukoy sa pagiging ganap o buo, at gayundin sa pagiging hinog.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: maging
  rationale: Ang future indicative ay may pautos o panghikayat na gamit sa konteksto. Likas sa modernong Tagalog ang “maging” at malinaw nitong naipahahayag ang panawagan.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal na bunga ng naunang turo tungkol sa pag-ibig sa mga kaaway; natural at malinaw sa Tagalog ang “Kaya.”
- source_word: ὑμεῖς
  choice: kayo
  rationale: Pinananatili ang tahasang panghalip at ang diin nito sa mga kausap.
- source_word: τέλειοι / τέλειός
  choice: ganap
  rationale: Saklaw ng “ganap” ang pagiging buo at lubos sa kontekstong etikal, at maaari rin nitong dalhin ang matinding pamantayan ng paghahambing sa Ama. Inulit ang iisang salita upang mapanatili ang retorikal na pagtutugma ng Griyego.
- source_word: ὡς
  choice: gaya ng
  rationale: Natural na panandang paghahambing sa Tagalog.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: inyong Ama sa langit
  rationale: Ang pariralang ito ay natural at marangal sa Tagalog at tumpak na ipinahahayag ang pagtukoy sa makalangit na Ama.
theological_decisions:
- issue: Kahulugan ng τέλειος sa etikal na panghihikayat
  choice: ganap
  alternative: perpekto; lubos; buo; may-gulang
  rationale: Sa agarang konteksto ng Mateo 5:43–47, ang salita ay tumutukoy sa buo at walang-piling pag-ibig na tumutulad sa Ama. Hindi nilulutas ng salin ang lahat ng teolohikal na implikasyon; pinananatili ng “ganap” ang mataas na puwersang etikal, habang inilalahad sa talababa ang mas malawak na saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “maging” sa halip na mas literal ngunit di-likas na anyong panghinaharap, at “Ama sa langit” bilang natural na katumbas ng attributive na οὐράνιος.
