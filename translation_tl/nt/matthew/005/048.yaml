  naturalness: Natural ang “Kaya” at “maging ganap kayo,” ngunit hindi ganap ang kayarian ng “gaya ng inyong Ama sa langit na ganap.” Ang “na ganap” ay nangangailangan ng mas malinaw na pagkakabit upang maging likas at hindi malabo sa modernong Tagalog.
  terminology: Ang “ganap” ay angkop na pangunahing salin ng τέλειος at mahusay na pinananatili ang lexical at retorikal na pag-uulit. Ang “Ama na nasa langit” ay malinaw na natural na katumbas ng ὁ πατὴρ ὑμῶν ὁ οὐράνιος. Sa talababa, mas tumpak ang “hinog” kaysa “may-gulang” para sa saklaw na maturity ng τέλειος, dahil ang “may-gulang” ay karaniwang tumutukoy sa pagiging adulto.
