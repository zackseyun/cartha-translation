  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: huwag kayong lumaban sa taong masama.[a] Sa halip, kung may sumampal sa iyong kanang pisngi, iharap mo rin sa kanya ang kabila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag kayong lumaban sa kasamaan”; o “huwag kayong lumaban sa Masama.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ng “Ngunit” ang pagsalungat ng δέ, at likas at marangal sa modernong Tagalog ang pormulang “sinasabi ko sa inyo.”
- source_word: μὴ ἀντιστῆναι
  choice: huwag kayong lumaban
  rationale: Sinasalamin ng “lumaban” ang malawak na diwa ng ἀνθίστημι na tumutukoy sa paglaban o pagtutol, nang hindi ito agad nililimitahan sa paghihiganti lamang.
- source_word: τῷ πονηρῷ
  choice: sa taong masama
  rationale: Maaaring neuter o masculine ang parirala, ngunit pinapaboran ng kasunod na halimbawa tungkol sa isang nananampal ang pangkalahatang personal na kahulugan. Inilalagay sa talababa ang tunay na gramatikal na kalabuan.
- source_word: ὅστις
  choice: kung may
  rationale: Likas sa modernong Tagalog ang “kung may” para sa di-tiyak at halos kondisyonal na gamit ng ὅστις.
- source_word: ῥαπίζει
  choice: sumampal
  rationale: Tiyak na ipinahihiwatig ng ῥαπίζω ang paghampas gamit ang kamay; ang “sumampal” ay angkop sa pisngi at naipapakita rin ang aspektong pang-iinsulto.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: sa iyong kanang pisngi
  rationale: Bagaman maaari ring mangahulugang “panga” ang σιαγών, “pisngi” ang likas na salita sa konteksto ng pagsampal. Ipinahihiwatig ng panghalip na σε ang “iyong.”
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: iharap mo rin sa kanya ang kabila
  rationale: Ang “iharap” ay natural na Tagalog para sa aktuwal na pagbaling ng kabilang pisngi, habang nananatiling malapit sa στρέφω at hindi nagdaragdag ng mas malakas na diwang tulad ng kusang “ialok.”
theological_decisions:
- issue: Kahulugan ng τῷ πονηρῷ
  choice: 'pangkalahatang personal: “sa taong masama”'
  alternative: 'abstrakto: “sa kasamaan”; personal na tiyak: “sa Masama”'
  rationale: Tunay na malabo sa gramatika ang parirala. Pinapaboran ng agarang halimbawa ang taong gumagawa ng masama, ngunit pinananatili sa talababa ang abstrakto at demonolohikal na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang pangmaramihang “kayo” sa pangkalahatang utos at ang isahang “iyo/mo” sa indibiduwal na halimbawang sumusunod, ayon sa paglipat ng bilang sa Griyego.
