  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: tl
  text: Mapalad[a] ang mga dukha sa espiritu[b], sapagkat kanila ang kaharian ng langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagpala” o “maligaya.” Ang salitang Griyego ay tumutukoy sa isang kanais-nais at kahanga-hangang kalagayan, hindi lamang sa damdamin ng kaligayahan.
    reason: lexical_alternative
  - marker: b
    text: Ang “dukha sa espiritu” ay maaari ding unawain bilang “dukha sa espirituwal na kalagayan” o “mga kumikilala sa kanilang espirituwal na pangangailangan.” Pinananatili ng salin ang pariralang Griyego nang hindi ito nililimitahan sa iisang pagpapakahulugan.
    reason: alternative_reading
  - marker: c
    text: Sa literal, “kaharian ng mga langit,” isang katangi-tanging paraan ng pagpapahayag sa Mateo na karaniwang isinasaling “kaharian ng langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Mapalad
  rationale: Likas at marangal na katumbas ito sa Filipino para sa kalagayang karapat-dapat hangarin at kinasasangkutan ng pabor ng Diyos; hindi nito nililimitahan ang salita sa pansariling damdamin ng kaligayahan.
- source_word: οἱ πτωχοὶ
  choice: ang mga dukha
  rationale: Pinananatili ng “mga dukha” ang diwa ng matinding karalitaan at ang substantibong gamit ng pang-uri, nang hindi ito pinakikitid sa literal na pamamalimos.
- source_word: τῷ πνεύματι
  choice: sa espiritu
  rationale: Pinananatili nito ang maikli at bukás sa pagpapakahulugang pariralang Griyego. Ang “sa Espiritu” ay maaaring maling magpahiwatig na tahasang tinutukoy ang Banal na Espiritu, samantalang hindi iyon sinasabi ng teksto.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan ng pagiging mapalad at angkop sa marangal ngunit kasalukuyang register.
- source_word: αὐτῶν ἐστιν
  choice: kanila
  rationale: Natural na panaguring paari sa Filipino na nagpapanatili sa diin ng Griyego at sa kasalukuyang pag-aari, sa halip na gawing panghinaharap.
- source_word: ἡ βασιλεία
  choice: ang kaharian
  rationale: Karaniwan at malinaw na salin na maaaring maglaman kapuwa ng sakop at ng paghahari ng hari.
- source_word: τῶν οὐρανῶν
  choice: ng langit
  rationale: Idyomatikong Filipino para sa katangi-tanging parirala ni Mateo na literal na nasa maramihan sa Griyego, “ng mga langit.”
theological_decisions:
- issue: Kahulugan ng “dukha sa espiritu”
  choice: Panatilihin ang “mga dukha sa espiritu” nang walang paliwanag sa pangunahing teksto.
  alternative: “mga dukha sa espirituwal na kalagayan,” “mga mapagpakumbaba,” o “mga kumikilala sa kanilang espirituwal na pangangailangan”
  rationale: Mayaman at bukás sa higit sa isang kaugnay na pagpapakahulugan ang parirala. Ang pagpapalawak nito sa pangunahing teksto ay magpapasya sa isang usaping hindi tahasang nilulutas ng Griyego.
- issue: Kasalukuyang pag-aari ng kaharian
  choice: Isalin ang ἐστιν sa kasalukuyang diwa sa pamamagitan ng “kanila.”
  alternative: “mapapasakanila” o “magiging kanila”
  rationale: Nasa panahunang kasalukuyan ang pandiwang Griyego; hindi dapat ilipat ang pahayag tungo lamang sa gantimpalang panghinaharap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na anyong “Mapalad ang…” para sa beatitud, habang pinanatili ang bahagyang di-karaniwang “dukha sa espiritu” upang hindi tabunan ang sadyang siksik at bukás na pahayag ng pinagmulan.
