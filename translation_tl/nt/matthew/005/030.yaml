id: MAT.5.30
reference: Matthew 5:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: tl
  text: At kung ang kanan mong kamay ay nagpapatisod sa iyo,[a] putulin mo ito at itapon. Sapagkat mas mabuti para sa iyo na mawala ang isa sa mga bahagi ng katawan mo kaysa mapunta sa Gehenna[b] ang buo mong katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagiging sanhi ng pagkakasala mo.” Literal na inilalarawan ng pandiwang Griyego ang pagpapatisod.
    reason: lexical_alternative
  - marker: b
    text: O “impiyerno.” Ang Gehenna ay katawagang nagmula sa Lambak ng Hinnom at ginagamit para tumukoy sa pangwakas na paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: kanan mong kamay
  rationale: Likas at tuwirang salin sa Tagalog na nagpapanatili sa tiyak na bahagi ng katawan at sa pagkakatulad nito sa naunang talata.
- source_word: σκανδαλίζει
  choice: nagiging dahilan ng pagkatisod mo
  rationale: Pinananatili ang metapora ng pagkatisod sa Griyego habang ipinahihiwatig ng konteksto ang pagkahulog sa kasalanan; inilagay sa talababa ang mas tahasang kahulugan.
- source_word: ἔκκοψον
  choice: putulin mo ito
  rationale: Tuwiran at mariing utos na natural gamitin tungkol sa kamay.
- source_word: βάλε ἀπὸ σοῦ
  choice: itapon
  rationale: Likas sa modernong Tagalog at sapat na naghahatid ng sapilitang pag-aalis at pagtatakwil; hindi na kailangan ang mas mabigat at paulit-ulit na 'itapon palayo sa iyo.'
- source_word: συμφέρει γάρ σοι
  choice: Sapagkat mas mabuti para sa iyo
  rationale: Ipinapahayag ang paghahambing ng kapakinabangan sa natural at marangal na Tagalog.
- source_word: ἵνα ἀπόληται
  choice: na mawala
  rationale: Ang 'mawala' ay natural para sa pagkawala ng isang bahagi ng katawan at pinananatili ang kaibahan nito sa kapahamakan ng buong katawan nang hindi dinaragdagan ang pandiwa.
- source_word: ἓν τῶν μελῶν σου
  choice: ang isa sa mga bahagi ng katawan mo
  rationale: Mas malinaw sa karaniwang mambabasa kaysa 'miyembro' at mas malawak kaysa 'galamay,' gaya ng saklaw ng μέλος.
- source_word: ὅλον τὸ σῶμά σου
  choice: ang buo mong katawan
  rationale: Natural na Tagalog na malinaw na nagpapanatili sa kaibahan ng isang bahagi at ng kabuuan.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: mapunta sa Gehenna
  rationale: Ang 'mapunta sa' ay likas na naghahatid sa pagpunta patungo sa isang hantungan; pinananatili ang makasaysayan at teolohikal na terminong Gehenna.
theological_decisions:
- issue: Paglalapat ng σκανδαλίζει sa kasalanan
  choice: Pinanatili sa pangunahing teksto ang metapora ng pagkatisod
  alternative: nagiging sanhi ng pagkakasala mo
  rationale: Ang pandiwa ay may larawan ng pagpapatisod ngunit sa konteksto ay tumutukoy sa pagkahulog sa kasalanan. Pinananatili ng salin at talababa ang dalawang antas ng kahulugan nang hindi tahimik na nilulutas ang metapora.
- issue: Pagsasalin ng γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili ng 'Gehenna' ang mismong terminong Griyego na nagmula sa Lambak ng Hinnom at ginamit kaugnay ng pangwakas na paghatol, sa halip na agad itong ipantay sa lahat ng kalaunang kahulugan ng 'impiyerno.'
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang matinding larawang retorikal at ang terminong 'Gehenna,' habang ipinaliwanag sa mga talababa ang metapora ng pagkatisod at ang karaniwang alternatibong 'impiyerno.'
