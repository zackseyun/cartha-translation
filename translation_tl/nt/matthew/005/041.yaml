  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: tl
  text: At kung pilitin ka[a] ng sinuman na maglakad nang isang milya, maglakad ka kasama niya nang dalawang milya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “pilitin” ay maaaring tumukoy sa sapilitang paglilingkod na ipinag-uutos ng may awtoridad, tulad ng maaaring ginagawa noong panahon ng Roma.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “isang milya … dalawa”; nauunawaan ang “milya” pagkatapos ng “dalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: sinumang
  rationale: Ipinahahayag ng di-tiyak na panghalip ang isang pangkalahatang kaso; natural at malawak ang saklaw ng “sinumang” sa modernong Tagalog.
- source_word: ἀγγαρεύσει
  choice: pumilit
  rationale: Tumutukoy ang pandiwa sa sapilitang paglilingkod, lalo na sa ilalim ng awtoridad. Malinaw na naihahatid ng “pumilit” ang pamimilit nang hindi tahasang nagdaragdag ng sundalong Romano sa teksto.
- source_word: μίλιον ἕν
  choice: isang milya
  rationale: Isang milyang Romano ang tinutukoy, ngunit sapat at natural sa pangunahing teksto ang karaniwang katawagang “isang milya.”
- source_word: ὕπαγε μετ’ αὐτοῦ
  choice: samahan mo siya
  rationale: Sa konteksto ng sapilitang paglalakbay, natural na ipinahahayag nito ang utos na magpatuloy na kasama niya; iniiwasan nito ang alanganing literal na “pumunta kang kasama niya.”
- source_word: δύο
  choice: dalawang milya
  rationale: Bagaman “dalawa” lamang ang tahasang nasa Griyego, nauunawaan mula sa naunang parirala ang yunit na “milya.” Kailangang ulitin ito upang maging natural at malinaw sa Tagalog.
theological_decisions:
- issue: Makasaysayang diwa ng sapilitang paglilingkod sa ilalim ng awtoridad
  choice: Ipinahayag ang pamimilit ngunit hindi tinukoy sa pangunahing teksto kung sino ang namimilit.
  alternative: Tahasang tukuyin ang isang sundalong Romano o opisyal na nag-uutos.
  rationale: Malakas na nagpapahiwatig ang ἀγγαρεύσει at ang “milya” ng sapilitang paglilingkod noong panahon ng Roma, ngunit walang tahasang binabanggit na sundalo o opisyal ang Griyegong teksto. Pinananatili ng salin ang makasaysayang pahiwatig nang hindi ginagawang tiyak ang hindi tiyak sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “maglakad” upang natural na maipahayag ang paglalakbay na ipinahihiwatig ng pandiwa at ng sukat ng layo; pinanatili naman sa talababa ang mas tiyak na makasaysayang kulay ng sapilitang paglilingkod.
