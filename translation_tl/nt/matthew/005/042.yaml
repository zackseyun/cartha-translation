  terminology: Wasto at pare-pareho ang paggamit ng “humihingi,” “gustong humiram,” at mga panghalip na “mo/iyo.” Hindi nililimitahan ng “humiram” ang hinihiram sa pera. Ang talababa ay nagbibigay ng lehitimong alternatibong mas idiomatiko (“tanggihan”) nang hindi pinapalitan ang pangunahing mas malapit sa larawan ng Griyego.
