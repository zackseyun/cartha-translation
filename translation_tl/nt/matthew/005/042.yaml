  source_fidelity: Tapat ang salin sa dalawang utos ng Griyego. Ang “Bigyan mo ang humihingi sa iyo” ay wastong nagsasalin sa τῷ αἰτοῦντί σε δός, at ang “huwag mong talikuran ang gustong humiram sa iyo” ay pinananatili ang larawang “huwag tumalikod” sa μὴ ἀποστραφῇς, kasama ang saklaw na “humiram sa iyo” para sa ἀπὸ σοῦ δανίσασθαι.
