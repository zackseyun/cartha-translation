  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: tl
  text: Bigyan mo ang humihingi sa iyo, at huwag mong talikuran ang gustong humiram sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag mong tanggihan ang gustong humiram sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦντί
  choice: ang humihingi
  rationale: Ang artikulong may kasamang present participle ay tumutukoy sa sinumang taong humihingi. Likas sa modernong Tagalog ang “ang humihingi” at napapanatili nito ang pangkalahatang diwa.
- source_word: δός
  choice: Bigyan mo
  rationale: Tuwirang pautos ang aorist imperative ng δίδωμι. Ang “Bigyan mo” ay natural at malinaw na utos sa Tagalog nang walang idinadagdag na modal na kahulugan.
- source_word: θέλοντα
  choice: ang gustong
  rationale: Ang substantival present participle ng θέλω ay natural na maisasalin bilang “ang gustong,” na nagpapanatili sa diwa ng pagnanais.
- source_word: ἀπὸ σοῦ
  choice: sa iyo
  rationale: Sa konstruksiyong Tagalog na “humiram sa iyo,” ang “sa iyo” ang likas na paraan upang tukuyin ang pinagmumulan ng hinihiram.
- source_word: δανίσασθαι
  choice: humiram
  rationale: Ang infinitive ay nangangahulugang humiram. Hindi nililimitahan sa pera ang salin sapagkat walang tahasang layon sa Griyego.
- source_word: μὴ ἀποστραφῇς
  choice: huwag mong talikuran
  rationale: Ang “talikuran” ay nagpapanatili sa larawan ng pagtalikod na nasa ἀποστρέφω, habang natural at marangal sa Tagalog; maaari rin itong maunawaan sa konteksto bilang pagtangging tumulong.
theological_decisions:
- issue: Saklaw at bisa ng etikang utos ni Jesus
  choice: Isinalin bilang tuwirang utos na pangkalahatan, nang hindi pinahihina o nililimitahan ang sinasabi ng Griyego.
  alternative: Limitahan ang utos sa mga itinuturing na karapat-dapat humingi, o gawing tahasang “huwag mong tanggihan.”
  rationale: Dalawang tuwirang utos ang talata sa Sermon sa Bundok. Hindi dapat magdagdag ang salin ng mga kondisyong wala sa teksto, at dapat nitong panatilihin ang larawan at lakas ng pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignificado, at madaling maunawaan. Ginamit ang isahang “mo/iyo” dahil isahan ang mga panghalip sa Griyego. Inilagay ang talababa sa dulo ng ikalawang sugnay, kung saan nauukol ang alternatibong salin.
