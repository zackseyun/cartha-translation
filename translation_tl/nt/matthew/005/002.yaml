  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng Griyego nang hindi nagdaragdag ng mas tiyak na diwang panahunan gaya ng “Pagkatapos.”
- source_word: ἀνοίξας
  choice: ibinuka niya
  rationale: Isinasalin ang aorist participle sa natural na anyong pasalaysay sa Filipino habang pinananatili ang literal at maringal na idyomang pagbubukas ng bibig bago ang pormal na pagsasalita.
- source_word: τὸ στόμα αὐτοῦ
  choice: ang kanyang bibig
  rationale: Natural na ayos sa Filipino na tapat sa tahasang parirala ng Griyego; hindi inalis ang bibig bilang bahagi ng pormal na pambungad sa pagsasalita.
- source_word: ἐδίδασκεν
  choice: tinuruan
  rationale: Ang imperpektong pandiwa ay inilalarawan dito sa natural na nakaraang anyo sa kontekstong pasalaysay. Hindi idinagdag ang “nagsimulang” o “patuloy” sapagkat maaaring sumobra ang mga iyon sa aspektong ipinahihiwatig ng Griyego.
- source_word: αὐτοὺς
  choice: sila
  rationale: Pinananatili ang panghalip upang hindi tukuyin nang mas makitid sa mismong talata kung sino ang tinuturuan.
- source_word: λέγων
  choice: na sinasabi
  rationale: Pinananatili ang participial na ugnayan nito sa pagtuturo at malinaw na ipinakikilalang kasunod ang mismong nilalaman ng sinabi.
