  naturalness: Hindi natural sa modernong Filipino ang “tinuruan sila, na sinasabi:” sa ganitong estruktura. Ang “binuka niya ang kanyang bibig at nagturo sa kanila sa mga salitang ito:” ay malinaw, pormal, at angkop sa maringal na himig ng talata.
  terminology: Walang isyung pang-teolohikal o pangalang pantangi. Pinanatili ang literal na pormal na idyomang “binuka niya ang kanyang bibig.”
