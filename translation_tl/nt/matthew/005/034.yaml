base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: huwag kayong manumpa kailanman—ni sa langit man, sapagkat ito ang trono ng Diyos;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pagtutol ng ἐγὼ δέ at ang tuwirang pananalita ni Jesus sa natural na modernong Tagalog.
- source_word: μὴ ὀμόσαι ὅλως
  choice: huwag kayong manumpa kailanman
  rationale: Ang ὀμόσαι ay tumutukoy sa panunumpa, at ang ὅλως ay nagpapahayag ng ganap na pagbabawal; malinaw itong naihahatid ng “kailanman” sa kontekstong ito.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ni sa ngalan ng langit
  rationale: Sa pormula ng panunumpa, ang ἐν ay idiomatikong tumutukoy sa bagay na ginagamit na panagot o batayan ng sumpa; ang “sa ngalan ng” ay malinaw at natural sa Tagalog.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: sapagkat ito ang trono ng Diyos
  rationale: Isinasalin ang ὅτι bilang sanhi at pinananatili ang tuwirang metapora at ayos ng pagmamay-ari.
theological_decisions:
- issue: Saklaw ng μὴ ὀμόσαι ὅλως
  choice: huwag kayong manumpa kailanman
  alternative: huwag kayong manumpa nang walang pasubali
  rationale: Pinananatili ang malakas at pangkalahatang anyo ng utos nang hindi nagdaragdag ng eksepsiyong teolohikal na wala sa talata.
- issue: Kaugnayan ng langit sa Diyos
  choice: sapagkat ito ang trono ng Diyos
  alternative: dahil trono ito ng Diyos
  rationale: Pinananatili ang paliwanag ng teksto na ang langit ay hindi maaaring gawing neutral na panagot, nang hindi pinalalawak ang implikasyong doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “manumpa” sa pormal na diwa ng pagbibigay ng sumpa, hindi bilang pagmumura. Ang tuldok-kuwit ay pinanatili dahil nagpapatuloy ang pangungusap sa kasunod na talata.
