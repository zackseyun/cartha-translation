id: MAT.5.35
reference: Matthew 5:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: tl
  text: ni sa lupa, sapagkat ito ang tuntungan ng kanyang mga paa[a]; ni sa Jerusalem[b], sapagkat ito ang lungsod ng dakilang Hari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alusyon sa Isaias 66:1: “Ang lupa ay tuntungan ng aking mga paa.”'
    reason: cross_reference
  - marker: b
    text: Sa literal, “patungo sa Jerusalem.” Ginagamit dito ang Griyegong εἰς (“patungo sa/sa”) bilang bahagi ng idyoma ng panunumpa, kaya maaari itong unawain na “sa pamamagitan ng Jerusalem” o “sa Jerusalem.”
    reason: lexical_alternative
  - marker: c
    text: Alusyon sa Awit 48:2, kung saan tinawag ang Jerusalem na “lungsod ng dakilang Hari.”
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ni
  rationale: Ipinagpapatuloy ng “ni” ang magkakaugnay na pagbabawal mula sa naunang talata at likas itong pakinggan sa Filipino.
- source_word: ἐν τῇ γῇ
  choice: sa lupa
  rationale: Sa konteksto ng panunumpa, ang ἐν ay nagpapakilala sa bagay na pinanunumpaan. Sapat na ipinahihiwatig ng “sa lupa” ang idyomang ito kapag binasa kasama ng naunang utos.
- source_word: γῇ
  choice: lupa
  rationale: Ang tinutukoy ay ang lupa bilang katapat ng langit, hindi isang partikular na lupain.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinahahayag nito ang dahilan ng pagbabawal habang pinananatili ang marangal na himig.
- source_word: ὑποπόδιον
  choice: tuntungan
  rationale: Karaniwan at tiyak na katumbas ito ng patungan ng mga paa at pinananatili ang alusyon sa wikang Kasulatan.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: ng kanyang mga paa
  rationale: Tuwirang pinananatili ang anyong henitibo at hindi tahasang nilulutas sa teksto ang tinutukoy ng panghalip.
- source_word: εἰς Ἱεροσόλυμα
  choice: sa Jerusalem
  rationale: Bagaman karaniwang direksiyonal ang εἰς, idyomatiko itong gumaganap sa pormula ng panunumpa rito. Ang “sa Jerusalem” ay natural sa Filipino; itinatala sa talababa ang anyong literal.
- source_word: πόλις
  choice: lungsod
  rationale: Ito ang tuwiran at natural na katumbas sa modernong Filipino.
- source_word: τοῦ μεγάλου βασιλέως
  choice: ng dakilang Hari
  rationale: Pinananatili nito ang pagmamay-aring ugnayan at ang marangal na katawagang malamang na umaalingawngaw sa Awit 48:2.
theological_decisions:
- issue: Tinutukoy ng “kanyang” sa “tuntungan ng kanyang mga paa”
  choice: Ginamit ang maliit na titik sa “kanyang,” habang hinahayaang ipahiwatig ng konteksto na ang tinutukoy ay ang Diyos.
  alternative: Gawing “Kanyang” upang tahasang ipakita na Diyos ang tinutukoy.
  rationale: Walang malaking titik sa panghalip na Griyego mismo; pinananatili ng maliit na titik ang pagiging bukas ng anyo ng pinagmulan nang hindi ikinukubli ang malinaw na pahiwatig ng konteksto.
- issue: Pagkakakilanlan ng “dakilang Hari”
  choice: Pinanatili ang katawagang “dakilang Hari” nang walang idinagdag na paliwanag sa pangunahing teksto.
  alternative: Tahasan itong gawing “Diyos, ang dakilang Hari.”
  rationale: Ang Griyego ay nagsasabing “ang dakilang Hari”; ang alusyon at konteksto ang nagpapakilala sa tinutukoy, kaya hindi dapat dagdagan ang teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong bahagi ng pangungusap sapagkat ipinagpapatuloy ng talata ang pagbabawal sa naunang taludtod. Ang “ni … ni …” ay nagpapanatili sa koordinasyon ng Griyego, at ang mga alusyong pangkasulatan ay hindi labis na ipinaliwanag sa pangunahing teksto.
