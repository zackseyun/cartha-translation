base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: tl
  text: “Ngunit sinabi, ‘Ang sinumang magdiborsiyo sa kanyang asawa ay dapat magbigay sa kanya ng kasulatan ng diborsiyo.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sinumang magpaalis sa kanyang asawa ... kasulatan ng paghihiwalay.” Ang pandiwang Griyego ay maaaring mangahulugang “paalisin,” ngunit sa legal na konteksto ng pag-aasawa rito ay tumutukoy ito sa diborsiyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: Sinabi rin
  rationale: Likas na panimulang pormula sa makabagong Tagalog. Ipinahihiwatig ng “rin” ang paglipat sa kasunod na kaugnay na turo nang hindi pinatitindi nang labis ang δέ bilang tahasang pagsalungat.
- source_word: Ὃς ἂν
  choice: Ang sinuman
  rationale: Malinaw at likas na katumbas ng di-tiyak at pangkalahatang kondisyong ipinapahayag ng relative pronoun na may ἄν.
- source_word: ἀπολύσῃ
  choice: makipagdiborsiyo
  rationale: Bagaman maaari itong mangahulugang “paalisin” o “palayain,” ang kontekstong pangmag-asawa at ang ἀποστάσιον ay tumutukoy sa legal na diborsiyo. Ang “makipagdiborsiyo” ay karaniwang modernong gamit at hindi nagpapahiwatig na kusang-loob ng dalawang panig ang paghihiwalay.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa kanyang asawa
  rationale: Sa konteksto ng diborsiyo, ang γυνή ay “asawa,” hindi lamang “babae.” Nananatili sa pangungusap ang lalaking gumagawa ng kilos, gaya ng nasa Griyego, kahit gender-neutral ang panghalip na “kanyang.”
- source_word: δότω αὐτῇ
  choice: ay dapat magbigay sa kanya
  rationale: Ipinapahayag nang natural sa Tagalog ang puwersa ng third-person imperative bilang obligasyong legal. Mas malinaw ito kaysa sa artipisyal na “hayaan siyang magbigay.”
- source_word: ἀποστάσιον
  choice: kasulatan ng diborsiyo
  rationale: Pinananatili nito ang kahulugan ng isang nakasulat at legal na dokumento. Ang “kasulatan” ay dignified at madaling maunawaan sa pormal na konteksto.
theological_decisions:
- issue: Kaugnayan ng sipi sa probisyon ng Kautusan ni Moises tungkol sa diborsiyo
  choice: Isinalin bilang siniping pormulang legal, nang hindi ipinapasok sa talatang ito ang pagsang-ayon o pagtutol ni Jesus.
  alternative: Isalin ito bilang tuwirang pag-endorso sa diborsiyo o bilang paglalarawan lamang ng karaniwang turo.
  rationale: Ipinapakilala ng talata ang pahayag na tatalakayin ni Jesus sa susunod na talata. Dapat panatilihin ang tensiyong teolohikal at huwag pangunahan ang paliwanag ng kasunod na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “diborsiyo” para sa tiyak na legal na kahulugan, samantalang pinanatili ng “kasulatan” ang pormal at dokumentaryong diwa. Inilagay ang panandang [a] sa pangunahing teksto ayon sa talababa.
