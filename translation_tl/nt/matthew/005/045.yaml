source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: tl
  text: upang maging mga anak kayo ng inyong Ama na nasa langit[a], sapagkat pinasisikat niya ang kanyang araw sa masasama at mabubuti, at nagpapaulan siya sa mga matuwid at di-matuwid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga anak na lalaki ng inyong Ama”; ang pananalita ay tumutukoy sa mga alagad bilang mga anak ng Ama. Ang “nasa langit” ay literal na “nasa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o nilalayong resulta.
- source_word: γένησθε
  choice: maging
  rationale: Pinananatili ang dinamikong diwa ng γίνομαι, na ‘maging’ o ‘dumating sa kalagayan,’ sa halip na gawing payak na ‘ay.’
- source_word: υἱοὶ
  choice: mga anak
  rationale: Bagaman literal na ‘mga anak na lalaki,’ ang pangmaramihang υἱοί dito ay tumutukoy sa mga alagad bilang mga anak ng Ama; ang ‘mga anak’ ang natural at saklaw-lahat na gamit sa modernong Filipino. Itinatala sa talababa ang mas tiyak na anyong Griyego.
- source_word: τοῦ πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: ng inyong Ama na nasa langit
  rationale: Tuwirang pinananatili ang kaugnayan sa ‘inyong Ama’ at ang hiwalay na pariralang naglalarawan sa kanya. Ang isahan na ‘langit’ ay idiomatikong Filipino kahit maramihan ang οὐρανοῖς.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw at marangal na panandang nagpapakilala sa dahilan o paliwanag.
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: pinasisikat niya ang kanyang araw
  rationale: Pinananatili ang tahasang pagmamay-ari sa ‘kanyang araw’ at ang Diyos bilang sanhi ng pagsikat nito.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: sa masasama at mabubuti
  rationale: Ginagawang substantibo sa natural na Filipino ang magkatapat na pang-uri nang hindi nagdaragdag ng ‘mga tao.’
- source_word: βρέχει
  choice: nagpapaulan siya
  rationale: Natural na Filipino na malinaw na nagpapanatili sa Diyos bilang gumagawa; mas angkop kaysa literal ngunit alanganing ‘umuulan siya.’
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: sa mga matuwid at di-matuwid
  rationale: Pinananatili ang balanseng moral na pagsalungat ng δίκαιος at ἄδικος sa karaniwang bokabularyong biblikal sa Filipino.
theological_decisions:
- issue: Ang kasariang nakapaloob sa υἱοί
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Ang Griyego ay tahasang panlalaking maramihan, ngunit sa konteksto ang tawag ay kumakatawan sa lahat ng alagad. Ang ‘mga anak’ ay natural sa Filipino at hindi naglilimita sa mga lalaki; ang literal na anyo ay inilalahad sa talababa upang hindi maitago ang leksikal na detalye.
- issue: Ang puwersa ng γένησθε kaugnay ng pagiging anak ng Diyos
  choice: maging
  alternative: makilalang mga anak / maging tunay na mga anak
  rationale: Ang ‘maging’ ang pinakamalapit sa pandiwang Griyego at pinananatili ang tensiyon ng pahayag nang hindi nagpapasok ng paliwanag kung ito ay pagpasok sa katayuan o pagpapakita ng katangian. Hindi idinaragdag ang ‘tunay’ o ‘makilala,’ na magpapasya sa isang interpretasyon.
- issue: Saklaw ng kabutihan ng Ama
  choice: sa masasama at mabubuti ... sa mga matuwid at di-matuwid
  alternative: sa lahat ng tao
  rationale: Pinananatili ang dalawang magkatapat na pares ng teksto, na nagpapakita ng walang pagtatanging kaloob ng araw at ulan, sa halip na ibuod lamang bilang ‘lahat.’
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na indayog. Ginamit ang ‘sapagkat,’ ‘matuwid,’ at ‘di-matuwid’ bilang pamilyar na wikang biblikal, habang iniwasan ang sobrang makalumang ayos. Ang magkatulad na estruktura ng dalawang sugnay ay pinanatili.
