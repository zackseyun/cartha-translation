  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: tl
  text: Hindi rin nagsisindi ng ilawan ang mga tao at inilalagay ito sa ilalim ng isang sisidlang panukat[a], kundi sa patungan ng ilawan; at nagbibigay ito ng liwanag sa lahat ng nasa bahay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ilalim ng isang takalan.” Ang Griyegong μόδιος ay tumutukoy sa isang panukat ng tuyong sangkap at, sa pagpapalawak ng kahulugan, sa sisidlang ginagamit sa pagsukat.
    reason: lexical_alternative
  - marker: b
    text: O “at nagliliwanag ito para sa lahat ng nasa bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Hindi rin
  rationale: Ikinakabit nito ang isa pang negatibong halimbawa sa naunang pahayag. Likas sa modernong Tagalog ang “Hindi rin” at napapanatili nito ang puwersa ng pang-ugnay.
- source_word: καίουσιν
  choice: nagsisindi
  rationale: Kapag λύχνος ang layon, ang likas na pananalita sa Tagalog ay “nagsisindi ng ilawan,” hindi “nagsusunog.”
- source_word: λύχνον
  choice: ilawan
  rationale: Tumutukoy ito sa isang konkretong lamparang de-langis, hindi sa liwanag bilang abstraktong bagay. Ang “ilawan” ay malinaw at dignified na modernong katumbas.
- source_word: τιθέασιν
  choice: inilalagay
  rationale: Ang aspektong imperpektibo ay angkop sa pangkalahatan at nakagawiang kilos na inilalarawan ng kasabihan.
- source_word: ὑπὸ τὸν μόδιον
  choice: sa ilalim ng isang takalan
  rationale: Ang μόδιος ay isang panukat ng tuyong sangkap at, sa pagpapalawak ng kahulugan, ang sisidlang ginagamit sa pagsukat. Mas tumpak ang “takalan” kaysa sa pangkalahatang “basket,” habang ipinaliliwanag sa talababa ang mismong larawan.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: kundi sa patungan ng ilawan
  rationale: Ang λυχνία ay patungan o tayuan na pinaglalagyan ng ilawan. Likas at malinaw sa Tagalog ang “patungan ng ilawan.”
- source_word: λάμπει
  choice: nagbibigay ito ng liwanag
  rationale: Literal na maaaring “nagliliwanag,” ngunit ipinapakita rito ang epekto ng ilawan sa mga tao sa bahay. Ang “nagbibigay ng liwanag” ay natural at pinananatili ang ugnayan sa πᾶσιν.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: sa lahat ng nasa bahay
  rationale: Malinaw nitong pinananatili ang pangkalahatang saklaw ng πᾶσιν at ang lokatibong diwa ng οἰκίᾳ.
theological_decisions:
- issue: Walang hayag na simuno ang pangkalahatang pandiwang maramihan sa Griyego
  choice: nagsisindi ang mga tao
  alternative: may nagsisindi / nagsisindi sila
  rationale: Ang “mga tao” ay malinaw na naghahatid ng pangkalahatan at kawikaang diwa ng ikatlong panauhang maramihan nang hindi lumilikha ng malabong tinutukoy ng “sila.” Wala itong idinaragdag na sektaryanong pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na simple, dignified, at madaling maunawaan. Ginamit ang pang-araw-araw na “nagsisindi” at “inilalagay,” habang pinanatili ang tiyak na larawang pangkasaysayan sa “takalan” sa tulong ng talababa.
