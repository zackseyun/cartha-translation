  to: Hindi rin nagsisindi ng ilawan ang mga tao at inilalagay ito sa ilalim ng isang sisidlang panukat[a], kundi sa patungan ng ilawan; at nagbibigay ito ng liwanag sa lahat ng nasa bahay.[b]
