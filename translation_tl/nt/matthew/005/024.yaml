id: MAT.5.24
reference: Matthew 5:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: tl
  text: iwan mo roon sa harap ng altar ang iyong handog. Humayo ka muna at makipagkasundo sa iyong kapatid na lalaki[a]; pagkatapos, bumalik ka at ihandog ang iyong handog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking isahan ang “kapatid.” Sa konteksto, maaaring mas malawak ang saklaw ng prinsipyo ng pakikipagkasundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: iwan mo roon
  rationale: Tumutukoy ang aorist imperative sa pag-iwan ng handog sa kinaroroonan nito; pinananatili ng “roon” ang diin sa lugar.
- source_word: τὸ δῶρόν σου
  choice: ang iyong handog
  rationale: Sa konteksto ng altar, mas malinaw at likas sa Filipino ang “handog” kaysa “regalo,” habang saklaw pa rin nito ang δῶρον.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: sa harap ng altar
  rationale: Tuwirang inilalarawan ang puwesto ng handog kaugnay ng altar.
- source_word: ὕπαγε πρῶτον
  choice: Humayo ka muna
  rationale: Ipinahahayag ng “humayo” ang utos na umalis at pumunta, at ng “muna” ang prayoridad ng pakikipagkasundo.
- source_word: διαλλάγηθι
  choice: makipagkasundo
  rationale: Likas itong paraan sa Filipino upang ipahayag ang pagpasok sa kalagayan ng pagkakasundo, nang hindi tinutukoy kung sino lamang ang dapat gumawa ng unang hakbang.
- source_word: τῷ ἀδελφῷ σου
  choice: sa iyong kapatid na lalaki
  rationale: Pinananatili ang panlalaking isahan ng salitang Griyego at nililinaw ang kasarian na maaaring hindi makita sa “kapatid” lamang.
- source_word: καὶ τότε ἐλθὼν
  choice: pagkatapos, bumalik ka
  rationale: Ang “pagkatapos” ay nagpapanatili sa pagkakasunod-sunod; ipinahihiwatig ng konteksto na babalik ang tao sa altar, kaya natural ang “bumalik.”
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: ihandog ang iyong handog
  rationale: Pinananatili ang kultikong diwa ng πρόσφερε at ang pag-uulit ng δῶρον sa pinagmulan.
theological_decisions:
- issue: Saklaw ng ἀδελφός sa etikang interpersonal
  choice: kapatid na lalaki
  alternative: kapatid; kapwa mananampalataya
  rationale: Panlalaking isahan ang anyong Griyego, kaya pinananatili iyon sa pangunahing teksto. Gayunman, maaaring mas malawak ang saklaw ng prinsipyo ng pakikipagkasundo, kaya inilalahad ito sa talababa nang hindi ipinapalit sa mismong anyo ng pinagmulan.
- issue: Puwersang tinig ng διαλλάγηθι
  choice: makipagkasundo
  alternative: makipagbati; hayaang maipagkasundo
  rationale: Deponent/passive ang anyo at nakatuon sa pagkakaroon ng naibalik na ugnayan. Ang “makipagkasundo” ay natural at hindi nagpapasya nang lampas sa teksto kung aling panig ang may buong pananagutan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “altar” bilang karaniwang terminong panrelihiyon, “handog” para sa kontekstong pagsamba, at “makipagkasundo” upang likas na maipahayag ang relasyonal na utos. Nasa pangunahing teksto ang marker na [a].
