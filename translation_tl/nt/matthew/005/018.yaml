id: MAT.5.18
reference: Matthew 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: tl
  text: 'Sapagkat tunay na sinasabi ko sa inyo: hanggang sa lumipas ang langit at ang lupa, ni isang iota[a] o isang munting guhit[b] ay hinding-hindi lilipas mula sa Kautusan, hanggang sa maganap ang lahat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang iota ang pinakamaliit na titik sa alpabetong Griyego; ang diwa rito ay kahit ang pinakamaliit na titik.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, isang napakaliit na markang nakasulat na nagpapakilala o nagbubukod sa isang titik.
    reason: lexical_alternative
  - marker: c
    text: 'O: “hanggang sa matupad ang lahat.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: tunay
  rationale: Ginagamit dito bilang taimtim at makapangyarihang paninindigan sa pasimula ng sinabi ni Jesus; natural sa makabagong Tagalog ang “tunay.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pahayag sa Mateo 5:17.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malapit sa anyo ng Griyego at nagpapanatili ng marangal at may-awtoridad na himig.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: hangga't hindi lumilipas ang langit at ang lupa
  rationale: Likas na Tagalog na nagpapahayag ng hangganang nasa hinaharap, habang pinananatili ang kosmikong saklaw at diwa ng παρέρχομαι.
- source_word: ἰῶτα ἓν
  choice: isang iota
  rationale: Pinananatili ang tiyak na pangalan ng napakaliit na titik sa Griyego; nililinaw sa talababa ang kahulugan nito.
- source_word: μία κεραία
  choice: isang munting guhit
  rationale: Tumutukoy sa napakaliit na markang nakasulat na maaaring magbukod sa mga titik; malinaw ito sa karaniwang mambabasang Tagalog.
- source_word: οὐ μὴ παρέλθῃ
  choice: hinding-hindi lilipas
  rationale: Ang inuulit na anyong Tagalog ay natural na nagpapahayag ng mariing pagtanggi ng οὐ μή kasama ang subjunctive.
- source_word: ἀπὸ τοῦ νόμου
  choice: mula sa Kautusan
  rationale: Sa konteksto ng “Kautusan at mga Propeta” sa talata 17, tumutukoy ito sa kasulatang Kautusan ng Diyos; ang malaking titik ay tumutulong na ipakitang hindi ito basta pangkalahatang batas.
- source_word: ἕως ἂν πάντα γένηται
  choice: hanggang sa maganap ang lahat
  rationale: Malawak at likas na salin ng γίνομαι na hindi nagpapasiya kung ang diin ay simpleng pangyayari o ganap na katuparan.
theological_decisions:
- issue: Saklaw ng νόμος
  choice: Kautusan bilang kasulatang Kautusan ng Diyos
  alternative: ang Torah/Pentateuch lamang, o ang buong Lumang Tipan sa mas malawak na diwa
  rationale: Ipinakikita ng agarang konteksto ang kasulatang kahulugan, ngunit hindi nilulutas ng salin ang pagtatalo hinggil sa eksaktong lawak nito.
- issue: Diwa ng πάντα γένηται
  choice: maganap ang lahat
  alternative: matupad ang lahat
  rationale: Maaaring tumukoy ang parirala sa pagdating sa pangyayari o sa katuparan. Pinananatili ng pangunahing salin ang mas malawak na diwa, at ibinibigay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hangga't hindi” upang maging natural ang unang temporal na sugnay at ang “hinding-hindi” upang maipakita ang mariing negasyon. Pinanatili ang “iota” dahil tiyak itong katawagan sa pinagmulang teksto, kalakip ang paliwanag sa talababa.
