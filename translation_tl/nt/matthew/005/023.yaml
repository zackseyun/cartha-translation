id: MAT.5.23
reference: Matthew 5:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: tl
  text: Kaya, kung inihahandog mo ang iyong kaloob sa altar at doon ay maalala mong may hinanakit sa iyo ang kapatid mong lalaki[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapatid mo.” Panlalaking isahan ang salitang Griyego para sa “kapatid,” ngunit maaari itong gamitin bilang kinatawang katawagan sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kaya, kung
  rationale: Pinananatili ng “kaya” ang ugnayang lohikal sa naunang turo, at ng “kung” ang kondisyonal na diwa ng ἐάν.
- source_word: προσφέρῃς
  choice: inihahandog mo
  rationale: Ang kasalukuyang anyong kondisyonal ay inilalarawan bilang gawaing nagaganap; ang “inihahandog” ay angkop sa konteksto ng pagsamba at paghahain.
- source_word: τὸ δῶρόν σου
  choice: ang iyong kaloob
  rationale: Ang “kaloob” ay tuwirang katumbas ng δῶρον at sapat na malinaw sa konteksto ng altar nang hindi nililimitahan ang uri ng handog.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sa altar
  rationale: Natural ito sa modernong Tagalog para sa pagdadala o paglalagay ng kaloob sa altar, nang hindi ginagawang mabigat ang pangungusap sa “sa ibabaw ng altar.”
- source_word: κἀκεῖ μνησθῇς
  choice: at doon ay maalala mo
  rationale: Pinananatili ang pang-ugnay, ang diin sa lugar, at ang tuwirang diwa ng pag-alaala nang hindi tinutukoy kung kusang sumagi o may nagpaalala.
- source_word: ὁ ἀδελφός σου
  choice: ang kapatid mong lalaki
  rationale: Ipinakikita sa pangunahing teksto ang panlalaking isahan ng salitang Griyego; ipinapaliwanag sa talababa na maaari itong gumana bilang kinatawang katawagan sa konteksto.
- source_word: ἔχει τι κατὰ σοῦ
  choice: may hinanakit sa iyo
  rationale: Natural na ipinahahayag ng “may hinanakit sa iyo” ang idyomang may reklamo o sama ng loob laban sa isang tao, habang hindi tinutukoy ang mismong dahilan.
theological_decisions:
- issue: Ang kasariang ipinahihiwatig ng ἀδελφός
  choice: kapatid mong lalaki
  alternative: kapatid mo; kapatid mong lalaki o babae; kapwa mananampalataya
  rationale: Panlalaking isahan ang anyong Griyego, kaya hindi ito ginawang tahasang neutral o pinalawak sa pangunahing teksto. Gayunman, pinananatili sa talababa ang tunay na posibilidad na kinatawan ang gamit nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “inihahandog” at “altar” bilang karaniwang wikang panrelihiyon, habang iniwasan ang mas mabigat o makalumang ayos. Pinanatili ang kuwit sa dulo dahil nagpapatuloy ang kondisyonal na pangungusap sa susunod na talata.
