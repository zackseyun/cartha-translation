id: MAT.5.17
reference: Matthew 5:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: tl
  text: Huwag ninyong isipin na naparito ako upang pawalang-bisa ang Kautusan o ang mga Propeta. Hindi ako naparito upang pawalang-bisa ang mga ito, kundi upang tuparin[a] ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tuparin” ay maaari ring maunawaan bilang “dalhin sa ganap na katuparan” o “lubos na ihayag ang nilalayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Huwag ninyong isipin
  rationale: Likas at tuwirang pagbabawal sa modernong Tagalog; pinananatili nito ang diwa ng aorist subjunctive na may μή.
- source_word: ἦλθον
  choice: naparito ako
  rationale: Ang “naparito ako” ay natural sa konteksto ng pagsasalita ni Jesus at naihahatid ang simpleng aorist nang hindi kailangang ipilit ang pagkakaibang “came” at “have come,” na hindi magkapareho ang pagmamarka sa Tagalog.
- source_word: καταλῦσαι
  choice: upang pawalang-bisa
  rationale: Sa kaugnayan nito sa Kautusan at mga Propeta, tumutukoy ito sa pag-aalis ng bisa o awtoridad, hindi sa pisikal na pagwasak.
- source_word: τὸν νόμον
  choice: ang Kautusan
  rationale: Ang malaking titik ay nagpapakitang tinutukoy ang Torah o kinikilalang bahagi ng Kasulatan ng Israel, hindi ang batas sa pangkalahatan.
- source_word: τοὺς προφήτας
  choice: ang mga Propeta
  rationale: Sa pariralang “ang Kautusan o ang mga Propeta,” malamang na tumutukoy ito sa kinikilalang bahagi ng Kasulatan, kaya ginamit ang malaking titik.
- source_word: ἀλλὰ πληρῶσαι
  choice: kundi upang tuparin ang mga ito
  rationale: Pinananatili ng “tuparin” ang malawak at mahalagang saklaw ng πληρόω. Idinagdag ang “ang mga ito” upang maging malinaw at natural sa Tagalog ang pagtukoy pabalik sa Kautusan at mga Propeta.
theological_decisions:
- issue: Ang kahulugan ng πληρῶσαι sa kaugnayan ni Jesus sa Kautusan at mga Propeta
  choice: tuparin
  alternative: dalhin sa ganap na katuparan; lubos na ihayag ang nilalayon
  rationale: Hindi nililimitahan ng salin ang salita sa pagsunod lamang, pagwawakas lamang, o pagpapatibay lamang. Pinananatili nito ang teolohikal at intertekstuwal na lawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “naparito” bilang natural na pananalita ng isang nagsasalita tungkol sa layunin ng kaniyang pagdating, at ang “pawalang-bisa” upang malinaw na maipahayag ang di-pisikal na kahulugan ng καταλύω sa kontekstong ito.
