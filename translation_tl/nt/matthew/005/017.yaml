  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “Huwag ninyong isipin,” “naparito ako,” at “pawalang-bisa” ay malinaw at angkop sa kontekstong ito. Maayos ang parallelismo ng dalawang sugnay.
