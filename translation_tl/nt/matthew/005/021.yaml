  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: tl
  text: Narinig ninyo na sinabi sa mga tao noong unang panahon[a], “Huwag kang papaslang[b]; at ang sinumang pumaslang ay mananagot sa paghatol[c].”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga sinauna.”
    reason: lexical_alternative
  - marker: b
    text: Ayon sa kaugalian, “Huwag kang papatay,” ngunit mas tiyak na tumutukoy ang pandiwang Griyego rito sa pagpaslang kaysa sa pagpatay sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: O, “mananagot sa hukuman.”
    reason: lexical_alternative
  - marker: d
    text: 'Maaari ring hatiin ang sipi: “‘Huwag kang papaslang,’ at ‘ang sinumang pumaslang ay mananagot sa paghatol.’”'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Narinig ninyo
  rationale: Likas sa Filipino ang anyong pangnagdaan sa pormulang ito at ipinahihiwatig nitong natanggap na ng mga tagapakinig ang aral na binabanggit.
- source_word: ἐρρέθη
  choice: sinabi
  rationale: Pinananatili ang di-tiyak na tagapagsalita ng pasibong pahayag at hindi ipinapalagay kung sino ang nagsabi.
- source_word: τοῖς ἀρχαίοις
  choice: sa mga tao noong unang panahon
  rationale: Malinaw at natural itong tumutukoy sa mga taong nabuhay noong unang panahon habang pinananatili ang diwang sila ang pinagsabihan.
- source_word: Οὐ φονεύσεις
  choice: Huwag kang papaslang
  rationale: Mas makitid ang φονεύω kaysa pangkalahatang pagpatay. Ang “papaslang” ay mas malinaw na tumutukoy sa sinasadyang pagkitil ng buhay at umiiwas sa pagpapakahulugang ipinagbabawal ang lahat ng uri ng pagpatay.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: at ang sinumang pumaslang
  rationale: Natural nitong ipinahahayag ang pangkalahatang kondisyong tumutukoy sa sinumang gagawa nito.
- source_word: ἔνοχος ἔσται
  choice: mananagot
  rationale: Ang salita ay may legal na diwa ng pagiging may pananagutan o napapailalim sa kaparusahan, hindi lamang ng abstraktong pagkakasala.
- source_word: τῇ κρίσει
  choice: sa hukuman
  rationale: Sa kontekstong legal, natural sa Filipino ang “mananagot sa hukuman.” Gayunman, maaaring tumukoy ang κρίσις sa proseso o pasiya ng paghatol, kaya itinala ang alternatibo sa talababa.
theological_decisions:
- issue: Saklaw ng ikaanim na utos
  choice: papaslang
  alternative: papatay
  rationale: Ang φονεύω ay tumutukoy nang mas tiyak sa pagpaslang o murder, hindi sa bawat posibleng uri ng pagkitil ng buhay. Hindi pinalalawak ng salin ang utos lampas sa saklaw ng salitang Griyego.
- issue: Kung iisang sipi o dalawang magkaugnay na sipi ang utos at kaparusahan
  choice: Iisang sipi na pinag-ugnay ng tuldok-kuwit
  alternative: Dalawang magkahiwalay na sipi
  rationale: Walang panipi sa sinaunang tekstong Griyego. Likas basahin ang utos at ang kasunod na pananagutan bilang isang yunit ng aral, ngunit nananatiling posible ang paghahating makikita sa talababa.
- issue: Kahulugan ng κρίσις
  choice: hukuman
  alternative: paghatol
  rationale: Ang konteksto ay legal, ngunit hindi ganap na tinutukoy ng salita kung institusyon ng hukuman o mismong paghatol ang nasa isip; pinanatili sa talababa ang mas di-tiyak na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tao noong unang panahon” sa halip na mas matigas na “mga sinauna,” at ang “mananagot sa hukuman” bilang karaniwang legal na pananalita. Pinanatili sa mga talababa ang mahahalagang alternatibong leksikal at ang maaaring ibang paghahati ng sipi.
