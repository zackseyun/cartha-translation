id: MAT.5.13
reference: Matthew 5:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: tl
  text: Kayo ang asin ng daigdig. Ngunit kung mawalan ng alat ang asin, sa ano pa ito muling aalatan? Wala na itong silbi kundi itapon sa labas at yurakan ng mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Kayo
  rationale: Ang tahasang panghalip ay may diin sa Griyego. Natural na naipahahayag ito ng pangungusap na nagsisimula sa “Kayo,” nang hindi dinaragdagan ng mabigat na “kayo mismo.”
- source_word: τὸ ἅλας τῆς γῆς
  choice: ang asin ng daigdig
  rationale: Maaaring mangahulugan ang γῆ na daigdig, lupain, o lupa. Sa malawak na talinghaga rito, natural at angkop ang “daigdig.”
- source_word: μωρανθῇ
  choice: mawalan ng alat
  rationale: Bagaman kaugnay ang pandiwa sa salitang “hangal,” kapag asin ang paksa, tumutukoy ito sa pagkawala ng lasa o alat. Ang “mawalan ng alat” ay malinaw at likas sa Filipino.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: sa ano pa ito muling aalatan?
  rationale: Pinananatili nito ang tanong tungkol sa kasangkapang makapagpapaalat muli sa asin at ang di-karaniwang talinghagang nasa Griyego.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Wala na itong silbi
  rationale: Sa konteksto, ang ἰσχύει ay tumutukoy sa pagiging kapaki-pakinabang o mabisa; maikli at natural ang “wala nang silbi.”
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: kundi itapon sa labas
  rationale: Inihahayag ng “sa labas” ang tahasang puwersang panlunan ng ἔξω, habang natural pa rin sa Filipino.
- source_word: καταπατεῖσθαι
  choice: yurakan
  rationale: Matingkad at tuwirang katumbas ito ng pagtapak at pagdurog sa ilalim ng paa.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: ng mga tao
  rationale: Ang ἀνθρώπων ay tumutukoy sa mga tao sa pangkalahatan. Hindi kailangang gumamit ng salitang panlalaki sa Filipino upang maipahayag ang pangkalahatang diwa.
theological_decisions:
- issue: Saklaw ng ὑπὸ τῶν ἀνθρώπων
  choice: ng mga tao
  alternative: ng mga lalaki / ng sangkatauhan
  rationale: Pangkalahatan ang reperensiya sa mga tao, hindi partikular sa mga lalaking tao. Ang “mga tao” ang tumpak at likas na katumbas sa Filipino nang walang idinadagdag na doktrinal na pagpapakahulugan.
- issue: Larawan ng asin na μωρανθῇ
  choice: mawalan ng alat
  alternative: tumabang / maging hangal
  rationale: Pinananatili ang konkretong talinghaga tungkol sa asin. Hindi isinasalin bilang “maging hangal,” bagaman iyon ang etimolohikong ugnayan ng pandiwa, sapagkat asin ang tahasang paksa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang pagtawag na “Kayo” at ang matingkad na larawan ng asin, pagtatapon sa labas, at pagyurak. Walang footnote dahil sapat na naihahayag sa Filipino ang pangkalahatang kahulugan ng ἀνθρώπων.
