  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: tl
  text: Mapalad ang mga tagapamayapa, sapagkat sila ay tatawaging mga anak ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ng Diyos.” Panlalaking maramihan ang ginamit sa Griyego, ngunit maaari itong tumukoy nang panlahat sa mga kabilang sa sambahayan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Mapalad
  rationale: Likas at marangal na pananalita sa mga pagpapahayag ng pagpapala; ipinahihiwatig nito ang kalagayang kinalulugdan at pinagpapala ng Diyos, hindi lamang ang pansariling damdaming masaya.
- source_word: εἰρηνοποιοί
  choice: mga tagapamayapa
  rationale: Maikli at natural na tawag sa mga aktibong nagtataguyod o nagdudulot ng kapayapaan; pinananatili nito ang agentibong diwa ng tambalang pangngalang Griyego.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng pahayag na mapalad sila, sa isang dignidad na angkop sa konteksto.
- source_word: αὐτοὶ
  choice: sila
  rationale: Sapat na naipahahayag sa natural na Tagalog ang binibigyang-diin na panghalip; ang mas tahasang “sila mismo” ay magiging labis na markado rito.
- source_word: υἱοὶ θεοῦ
  choice: mga anak ng Diyos
  rationale: Sa modernong Tagalog, “mga anak” ang natural na panlahatang katawagan sa mga anak na lalaki at babae at pinananatili ang ugnayang pampamilya. Inilalahad sa talababa na panlalaki ang anyo ng Griyego.
- source_word: κληθήσονται
  choice: tatawaging
  rationale: Tuwirang pinananatili ang panghinaharap na balintiyak ng καλέω nang hindi nililimitahan ang diwa sa pagkilala lamang ng lipunan.
theological_decisions:
- issue: Panlalaking wikang pampamilya sa υἱοὶ θεοῦ
  choice: mga anak ng Diyos
  alternative: mga anak na lalaki ng Diyos
  rationale: Bagaman literal na panlalaking maramihan ang Griyego, maaari itong gumamit ng panlalaking katawagan na may saklaw na kinatawan o panlahat. Sa Tagalog, ang “mga anak na lalaki ng Diyos” ay madaling maunawaang sadyang naglilimita sa mga lalaki at hindi likas na pahayag. Pinananatili ng “mga anak ng Diyos” ang tunay na ugnayang pampamilya, habang itinatala sa talababa ang anyo at posibleng puwersa ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Mapalad” bilang nakaugaliang anyo ng beatitude at ang “tagapamayapa” upang idiin ang aktibong paggawa para sa kapayapaan.
