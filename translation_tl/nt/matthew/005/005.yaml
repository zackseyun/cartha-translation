id: MAT.5.5
reference: Matthew 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: tl
  text: Pinagpala ang mga maamo[a], sapagkat sila ang magmamana ng lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banayad” o “mga mapagpakumbaba.” Ang pagiging maamo rito ay hindi kahinaan kundi mapagpakumbabang kahinahunan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “daigdig” o “lupain.” Malamang na umaalingawngaw ang parirala sa Awit 37:11, kaya maaari itong marinig kapwa bilang pangako tungkol sa lupain at bilang pangakong mas malawak ang saklaw.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Pinananatili nito ang diwa ng pagpapala at pagsang-ayon ng Diyos, sa halip na gawing pansariling damdamin lamang gaya ng “masaya.”
- source_word: οἱ πραεῖς
  choice: ang mga maamo
  rationale: Ang πραεῖς ay tumutukoy sa mapagpakumbaba at banayad na pagkatao, hindi sa kahinaan o pagkamahiyain. Likas at marangal na katumbas sa Filipino ang “mga maamo,” ngunit nililinaw sa talababa ang saklaw ng kahulugan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng pahayag ng pagpapala at angkop sa marangal ngunit makabagong rehistro.
- source_word: αὐτοὶ
  choice: sila ang
  rationale: Naipahihiwatig ng hulmaing “sila ang” ang diin ng Griyegong αὐτοὶ nang hindi nagiging mabigat o di-likas ang pangungusap.
- source_word: κληρονομήσουσι
  choice: magmamana
  rationale: Tuwirang pinananatili ang larawan ng pagtanggap ng mana at ang posibleng ugnayan nito sa wikang ginagamit para sa pangako ng Diyos.
- source_word: τὴν γῆν
  choice: ng lupa
  rationale: Ang “lupa” ay likas na katumbas na maaaring tumukoy kapwa sa lupain at, ayon sa konteksto, sa buong daigdig; kaya napapanatili nito ang lawak at tunay na kalabuan ng γῆ.
theological_decisions:
- issue: Saklaw ng τὴν γῆν
  choice: ang lupa
  alternative: ang daigdig; ang lupain
  rationale: Maaaring tumukoy ang γῆ sa buong daigdig o sa isang lupain. Malamang na umaalingawngaw rito ang Awit 37:11, kung saan kapansin-pansin ang pangako tungkol sa lupain, ngunit maaari ring marinig ang pangako sa mas malawak na saklaw. Hindi nilulutas ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang pamilyar na anyong “Pinagpala” para sa beatitude, habang ang “sila ang” ay banayad na nagdadala ng diin ng Griyego. Ang mga talababa ang nagpapaliwanag sa “maamo” at sa saklaw ng “lupa” nang hindi pinapabigat ang pangunahing teksto.
