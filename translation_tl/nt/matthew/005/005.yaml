  source_fidelity: Tumpak na isinasalin ng “Pinagpala ang mga maamo, sapagkat sila ang magmamana ng lupa” ang μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν. Ang “sila ang” ay likas na naihahatid ang diin ng αὐτοὶ, at ang “magmamana” ay pinananatili ang hinaharap at imahen ng mana sa κληρονομήσουσι. Ang “lupa” ay angkop na pinananatili ang saklaw at kalabuan ng γῆ bilang “lupain” o “daigdig/daigdig na tinitirhan.”
