id: MAT.5.25
reference: Matthew 5:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: tl
  text: Makitungo ka agad nang mabuti sa nagsasakdal sa iyo[a] habang kasama mo pa siya sa daan, baka ibigay ka ng nagsasakdal sa hukom, at ng hukom sa opisyal, at ihagis ka sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idyomatiko sa kontekstong legal, “Makipagkasundo ka agad sa nagsasakdal sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Maging mabuti agad ang pakikitungo mo
  rationale: Pinananatili nito ang pangunahing diwa ng pagiging may mabuting kalooban o maayos ang pakikitungo, sa halip na tahasang ipakahulugang nakipagkasundo na. Inilagay ang “agad” kasama ng utos upang maipahayag ang ταχύ.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: nagsasakdal
  rationale: Malinaw ang legal na kahulugan sa konteksto ng hukom, opisyal, at bilangguan. Mas tiyak ito kaysa sa pangkalahatang “kalaban.”
- source_word: ταχύ
  choice: agad
  rationale: Natural sa modernong Tagalog at malinaw na naghahatid ng kagyat na pagkilos.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: habang kasama mo pa siya sa daan
  rationale: Pinananatili ang konkretong larawan ng magkasamang nasa daan nang hindi tahasang idinaragdag na patungo sila sa hukuman.
- source_word: μήποτέ
  choice: Kung hindi, baka
  rationale: Natural na paraan sa Tagalog upang ihatid ang babala at ang posibleng masamang kahihinatnan.
- source_word: παραδῷ
  choice: ibigay
  rationale: Ipinahahayag ang pagpapasa sa kapangyarihan ng hukom; malinaw at likas sa pagkakasunod-sunod ng legal na pangyayari.
- source_word: κριτῇ / κριτής
  choice: hukom
  rationale: Karaniwan at malinaw na katumbas sa legal na konteksto.
- source_word: ὑπηρέτῃ
  choice: opisyal
  rationale: Tumutukoy sa nakabababang opisyal na nagpapatupad ng utos ng hukom nang hindi gumagamit ng terminong nakatali sa isang partikular na sistemang legal.
- source_word: εἰς φυλακὴν βληθήσῃ
  choice: ihagis ka sa bilangguan
  rationale: Pinananatili ang mariing larawan ng βληθήσῃ at ang bigat ng babala.
theological_decisions:
- issue: Kung ang pambungad na utos ay isasaling bilang pakikipagkasundo sa usaping legal o bilang mabuting disposisyon at pakikitungo
  choice: Pinanatili sa pangunahing teksto ang diwa ng mabuting pakikitungo.
  alternative: Makipagkasundo ka agad sa nagsasakdal sa iyo.
  rationale: Maaaring ipinahihiwatig ng legal na konteksto ang pakikipagkasundo, ngunit ang εὐνοέω ay tuwirang tumutukoy sa pagiging may mabuting kalooban o maayos na disposisyon. Inilagay sa talababa ang mas idyomatikong legal na pagbasa upang hindi mawala ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “nagsasakdal,” “hukom,” “opisyal,” at “bilangguan” upang mapanatili ang legal na tagpo nang hindi maging labis na teknikal. Ang “habang kasama mo pa siya sa daan” ay nagpapanatili sa konkretong larawan ng Griyego.
