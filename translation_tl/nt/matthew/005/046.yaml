  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: tl
  text: Sapagkat kung iniibig ninyo ang mga umiibig sa inyo, anong gantimpala ang mayroon kayo?[a] Hindi ba't gayon din ang ginagawa ng mga maniningil ng buwis?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anong sahod ang mayroon kayo?” Ang salitang Griyego ay maaaring mangahulugang “sahod” o “gantimpala”; dito, tumutukoy ito sa kapalit sa konteksto ng turo ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang kaugnayan sa naunang pangangatwiran, at ng “kung” ang kondisyon.
- source_word: ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς
  choice: ang mga umiibig sa inyo lamang ang iniibig ninyo
  rationale: Likas sa Tagalog ang ayos na ito at pinananatili ang pag-uulit ng salitang-ugat na ἀγαπάω. Ang “lamang” ay nagpapahayag ng limitasyong ipinahihiwatig ng kondisyon sa konteksto, hindi ng hiwalay na salitang Griyego.
- source_word: τίνα μισθὸν ἔχετε
  choice: anong gantimpala ang matatanggap ninyo
  rationale: Maaaring tumukoy ang μισθός sa sahod o gantimpala. Ang “gantimpala” ang higit na likas sa kontekstong etikal, samantalang ang “matatanggap” ay naghahatid ng diwa ng pagkakaroon ng gantimpala sa natural na Tagalog.
- source_word: οὐχὶ καὶ
  choice: Hindi ba't ... din
  rationale: Ang οὐχί ay nagpapakilala ng retorikal na tanong na umaasang sang-ayon ang sagot; ipinahahayag ng “din” ang pandagdag at mariing diwa ng καί.
- source_word: οἱ τελῶναι
  choice: mga maniningil ng buwis
  rationale: Malinaw at karaniwang modernong katawagan para sa mga nangongolekta ng buwis o singil.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: gayon din ang ginagawa
  rationale: Natural na katumbas sa Tagalog ng “ginagawa ang gayon ding bagay,” nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Kahulugan ng μισθός sa etikang itinuturo ni Jesus
  choice: gantimpala
  alternative: sahod; kabayaran
  rationale: Pinananatili ng “gantimpala” ang ideya ng kapalit o pagkilala sa konteksto nang hindi nagpapahiwatig ng mekanikal na doktrina ng merito. Inilalahad sa talababa ang tunay na leksikal na alternatibong “sahod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Hindi ba't” upang likas na maipahayag ang retorikal na tanong, at pinanatili ang pag-uulit ng “umiibig/iniibig” mula sa Griyego.
