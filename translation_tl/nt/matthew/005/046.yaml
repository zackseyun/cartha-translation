  naturalness: Malinaw at makabago ang daloy. Mas tuwirang natural at mas malapit sa ἔχετε ang “anong gantimpala ang mayroon kayo?” kaysa “ang matatanggap ninyo.”
  terminology: Ang “iniibig/umiibig” ay marangal ngunit nauunawaan sa modernong Filipino at pinananatili ang pag-uulit ng ἀγαπάω. Ang “gantimpala” ay angkop para sa μισθός sa kontekstong ito. Ang “mga maniningil ng buwis” ay malinaw at hindi nagpapataw ng interpretasyong historikal.
