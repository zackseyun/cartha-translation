- from: “Muli, narinig ninyo na sinabi sa mga tao noong unang panahon, ‘Huwag kang manumpa nang kasinungalingan[a], kundi tuparin mo sa Panginoon[b] ang iyong mga sinumpaan.’”
  to: “Narinig na rin ninyo na sinabi sa mga tao noong unang panahon, ‘Huwag kang sumumpa nang hindi tapat[a], kundi tuparin mo sa Panginoon[b] ang iyong mga panunumpa.’”
  rationale: Inayos ang mga pariralang hindi lubos na idiomatiko sa Filipino habang pinananatili ang saklaw ng Griyegong ἐπιορκήσεις at ang tiyak na kahulugan ng ὅρκους. Hindi binago ang impersonal na “sinabi,” ang pagtukoy sa mga tao noong unang panahon, o ang “Panginoon” para sa κυρίῳ.
