id: MAT.5.33
reference: Matthew 5:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: tl
  text: “Narinig na rin ninyo na sinabi sa mga tao noong unang panahon, ‘Huwag kang sumumpa nang hindi tapat[a], kundi tuparin mo sa Panginoon[b] ang iyong mga panunumpa.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag mong labagin ang iyong panunumpa”; ang pandiwa ay maaaring tumukoy sa huwad na panunumpa o sa paglabag sa isang panunumpa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa PANGINOON,” na sumasalamin sa banal na pangalang nasa likod ng mga talatang tinutukoy mula sa Lumang Tipan.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Muli
  rationale: Likas na panandang pandiskurso sa Filipino para sa isa pang halimbawa sa magkakasunod na pagtuturo.
- source_word: ἠκούσατε
  choice: narinig ninyo
  rationale: Tuwirang inililipat ang aorist sa natural na Filipino; sa pormulang ito, nananatili ang kaugnayan sa kasalukuyang kausap kahit walang tahasang aspektong ganap.
- source_word: ἐρρέθη
  choice: sinabi
  rationale: Pinananatili ang impersonal na balintiyak na diwa nang hindi tinutukoy kung sino ang nagsalita.
- source_word: τοῖς ἀρχαίοις
  choice: sa mga tao noong unang panahon
  rationale: Malinaw na tumutukoy sa naunang mga salinlahi, hindi lamang sa matatandang tao.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Huwag kang manumpa nang kasinungalingan
  rationale: Sinasaklaw ang huwad na panunumpa at hindi nililimitahan sa makabagong teknikal na konsepto ng perjury; inilalahad sa talab ng natural na utos sa Filipino.
- source_word: ἀποδώσεις
  choice: tuparin mo
  rationale: Sa konteksto ng mga sumpa, ang pandiwa ay tumutukoy sa pagsasagawa ng ipinangakong pananagutan, hindi sa literal na pagbabayad lamang.
- source_word: τῷ κυρίῳ
  choice: sa Panginoon
  rationale: Ang κύριος ay tumutukoy sa Diyos sa alusyong mula sa Kasulatan; ang 'Panginoon' ang karaniwang katumbas sa Filipino.
- source_word: τοὺς ὅρκους σου
  choice: ang iyong mga sinumpaan
  rationale: Natural na Filipino para sa mga obligasyong pinagtibay sa panunumpa at mahusay na kaakibat ng pandiwang 'tuparin.'
theological_decisions:
- issue: Paglilipat ng κύριος sa alusyon sa Kasulatan ng Israel
  choice: Panginoon
  alternative: YAHWE / PANGINOON bilang tahasang representasyon ng pangalang tipan
  rationale: κύριος ang nasa tekstong Griyego, at buod ito ng turo ng Kasulatan sa halip na isang tuwirang sipi ng Tetragrammaton; pinananatili sa talababa ang kaugnayan nito sa banal na pangalan.
- issue: Saklaw ng ἐπιορκέω
  choice: manumpa nang kasinungalingan
  alternative: sumira sa sinumpaan
  rationale: Maaaring tumukoy ang pandiwa kapuwa sa huwad na panunumpa at sa paglabag sa isang sumpa. Ang pangunahing salin ay malawak at natural, samantalang inilalagay sa talababa ang isa pang tunay na posibilidad.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang isahan na 'kang/mo/iyong' sa loob ng sipi upang tumbasan ang mga anyong pang-isahan sa Griyego, samantalang maramihan ang 'ninyo' sa pakikipag-usap ni Jesus sa mga tagapakinig.
