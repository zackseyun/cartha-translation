  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: Ibigin ninyo ang inyong mga kaaway at ipanalangin ang mga umuusig sa inyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “manalangin kayo alang-alang sa mga umuusig sa inyo.”
    reason: Ipinakikita ng alternatibo nang mas tahasan ang diwa ng ὑπέρ na “alang-alang sa” o “para sa kapakanan ng,” bagaman mas natural sa pangunahing teksto ang “ipanalangin.”
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ng “Ngunit” ang mariing pagsalungat ng δέ, habang ang “sinasabi ko” ay likas at malapit sa λέγω. Ang tahasang “ko” ay sumasalamin sa diin ng ἐγώ.
- source_word: ἀγαπᾶτε
  choice: Ibigin ninyo
  rationale: Tuwirang pautos ito na nagpapanatili sa malawak na kahulugan ng pag-ibig nang hindi nililimitahan sa damdamin lamang o sa isang partikular na kilos.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ang inyong mga kaaway
  rationale: Direkta at natural na katumbas na hindi nagpapalambot sa relasyonal na pagkapoot na ipinahihiwatig ng ἐχθρός.
- source_word: προσεύχεσθε ὑπὲρ
  choice: ipanalangin
  rationale: Likas na anyong Filipino para sa pagdarasal para sa kapakanan ng iba; naisasama nito ang diwa ng προσεύχεσθε at ng ὑπέρ nang hindi nagiging mabigat ang pangungusap.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: ang mga umuusig sa inyo
  rationale: Pinananatili ng “umuusig” ang pandiwang diwa ng kasalukuyang participle at ang posibleng nagpapatuloy na pagkilos.
theological_decisions:
- issue: Saklaw ng utos na ibigin ang mga kaaway
  choice: Isinalin nang tuwiran ang dalawang utos nang walang dagdag na paliwanag tungkol sa eksaktong anyo ng pag-ibig o nilalaman ng panalangin.
  alternative: Tukuyin ang pag-ibig bilang mabuting pagkilos lamang, o idagdag na ang panalangin ay para sa pagpapala, pagsisisi, o pagbabalik-loob ng mga umuusig.
  rationale: Iniuutos ng talata ang pag-ibig at panalangin ngunit hindi nito tahasang nililinaw ang lahat ng praktikal o teolohikal na implikasyon; kaya pinananatili ang lakas at lawak ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibigin” bilang pamilyar ngunit dignified na pautos sa kontekstong biblikal, at ang “umuusig” upang mapanatili ang seryosong uri ng pag-uusig sa halip na gawing pangkalahatang pang-aapi lamang.
