  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: tl
  text: Pinagpala ang mga may dalisay na puso[a], sapagkat makikita nila ang Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga may malinis na puso.”
    reason: lexical_alternative
  - marker: b
    text: Ang pangakong “makikita nila ang Diyos” ay maaaring tumukoy sa tuwirang paglapit sa presensya ng Diyos, kabilang ang ganap na katuparan sa hinaharap; pinananatili ng salin ang mismong pananalita nang hindi nililimitahan ang kahulugan nito.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Karaniwang salin sa mga beatitude na nagpapahayag ng lingap ng Diyos at ng mabuting kalagayan ng mga tinutukoy, hindi lamang ng pansamantalang damdamin ng kaligayahan.
- source_word: καθαροὶ τῇ καρδίᾳ
  choice: mga may dalisay na puso
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng kadalisayan sa panloob na pagkatao. Ang καρδία rito ay higit sa damdamin lamang.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng pagpapala sa isang marangal ngunit kasalukuyang gamit na Tagalog.
- source_word: αὐτοὶ
  choice: nila
  rationale: Naipahihiwatig sa panghalip ang pagtukoy sa mismong mga taong may dalisay na puso; hindi kailangang dagdagan ng mabigat na “sila mismo.”
- source_word: τὸν θεὸν
  choice: ang Diyos
  rationale: Tuwirang layon ng pandiwa at natural na salin sa Tagalog.
- source_word: ὄψονται
  choice: makikita
  rationale: Tuwirang hinaharap na pangako; natural sa modernong Tagalog at hindi dinaragdagan ng interpretasyon ang uri o panahon ng pagkakita.
theological_decisions:
- issue: Kahulugan ng “makikita ang Diyos”
  choice: Pinanatili ang tuwirang pananalitang “makikita nila ang Diyos.”
  alternative: mararanasan nila ang presensya ng Diyos; mamamasdan nila ang Diyos sa katuparan ng darating na panahon
  rationale: Maikli at bukas ang Griyego sa malalim na teolohikal na kahulugan, kabilang ang tuwirang paglapit sa presensya ng Diyos at ang ganap na katuparan nito sa hinaharap. Hindi dapat paliitin o palawakin ng salin ang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “dalisay na puso” bilang pamilyar ngunit hindi lipas na pagpapahayag ng kadalisayan ng panloob na pagkatao; inilagay ang mga pananda ng talababa sa mismong tekstong pangunahing salin.
