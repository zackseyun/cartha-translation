review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the solemn introductory formula, the emphatic negation, the confinement/debt imagery, and the specific Roman coin without imposing a doctrinal interpretation. However, “hangga't hindi mo nababayaran” uses an imperfective form that can suggest ongoing or repeated payment rather than the completed payment expressed by ἀποδῷς in the limiting clause.
  naturalness: The wording is generally natural and suitably dignified in modern Filipino Tagalog. “Hanggang sa mabayaran mo” is more direct and idiomatic here, and clearly expresses that release is conditioned on full payment.
  terminology: “Kodrantes” is an appropriate Tagalog adaptation of κοδράντης, and the cultural footnote adequately identifies it as a small Roman coin. “Kahuli-hulihang” appropriately conveys the final coin. The address “sa iyo” retains the source’s singular direct address.
  issues:
  - severity: medium
    issue: Aspect of “nababayaran”
    rationale: In “hangga't hindi mo nababayaran,” nababayaran is imperfective and may imply ongoing payment. The Greek aorist subjunctive ἀποδῷς, governed by ἕως ἄν, presents payment as the completion that terminates the confinement. “Hanggang sa mabayaran mo” better preserves this sense without overexplaining it.
  revised_text: Katotohanang sinasabi ko sa iyo, tiyak na hindi ka makalalabas doon[a] hanggang sa mabayaran mo ang kahuli-hulihang kodrantes.[b]
