base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: tl
  text: Katotohanang sinasabi ko sa iyo, tiyak na hindi ka makalalabas doon[a] hanggang sa mabayaran mo ang kahuli-hulihang kodrantes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula roon.”
    reason: lexical_alternative
  - marker: b
    text: Ang kodrantes ay isang maliit na baryang Romano.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: Katotohanan
  rationale: Sa pormulang ἀμὴν λέγω σοι, nagsisilbi itong maringal at taimtim na pagpapatibay. Ang “Katotohanang sinasabi ko sa iyo” ay likas at dignidadong katumbas sa modernong Tagalog.
- source_word: λέγω σοι
  choice: sinasabi ko sa iyo
  rationale: Pinananatili nito ang tuwirang pakikipag-usap at awtoritatibong himig ng pahayag.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: tiyak na hindi ka makalalabas
  rationale: Ang οὐ μή na may aorist subjunctive ay mariing pagtanggi. Ipinahahayag ng “tiyak na hindi” ang diin nang hindi nagiging lipas o labis na literal.
- source_word: ἐκεῖθεν
  choice: doon
  rationale: Sa Tagalog, likas ang “makalalabas doon” para sa pag-alis mula sa isang lugar ng pagkakakulong. Ang mas tahasang “mula roon” ay ibinigay bilang alternatibo sa talababa.
- source_word: ἕως ἂν ἀποδῷς
  choice: hangga't hindi mo nababayaran
  rationale: Likas sa Tagalog ang negatibong konstruksiyong “hangga't hindi” kasunod ng mariing “hindi makalalabas.” Ipinahihiwatig ng “nababayaran” ang ganap na pagtupad sa hinihinging kabayaran.
- source_word: τὸν ἔσχατον
  choice: ang kahuli-hulihang
  rationale: Malinaw nitong ipinahahayag na kailangang mabayaran maging ang pinakahuling maliit na bahagi ng utang.
- source_word: κοδράντην
  choice: kodrantes
  rationale: Isinalin sa anyong angkop sa baybay at bigkas ng Tagalog ang tiyak na pangalan ng Romanong barya, sa halip na palitan ng isang di-katumbas na makabagong salapi. Ipinaliliwanag ito sa talababa.
theological_decisions:
- issue: Kung dapat bang ipakahulugan sa salin ang pagkakakulong bilang huling paghuhukom, purgasyon, o isang karaniwang usaping legal at pagkakautang
  choice: Pinanatili ang tuwirang larawan ng pagkakakulong hanggang sa lubos na mabayaran ang utang.
  alternative: Tahasan itong tukuyin bilang metapora ng banal na paghuhukom o isang partikular na doktrina tungkol sa parusa pagkatapos ng kamatayan.
  rationale: Hindi tahasang nilulutas ng Griyegong teksto ang mas malawak na doktrinal na kahulugan. Kaya pinananatili ng salin ang tensiyon at hinahayaang ang konteksto ang gumabay sa pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “makalalabas” at “hangga't hindi mo nababayaran” bilang karaniwang pananalita, habang pinanatili ang taimtim na himig ng pahayag at ang sinaunang katawagang “kodrantes” na may paliwanag sa talababa.
