  to: Ngunit kung ang kanang mata mo ay nagpapatisod sa iyo[a], dukitin mo ito at itapon palayo sa iyo. Sapagkat mas mabuti para sa iyo na mapahamak ang isa sa mga bahagi ng katawan mo kaysa maitapon ang buo mong katawan sa Gehenna.[b]
