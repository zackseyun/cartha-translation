  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: tl
  text: Ngunit kung ang kanang mata mo ay nagpapatisod sa iyo[a], dukitin mo ito at itapon palayo sa iyo. Sapagkat mas mabuti para sa iyo na mapahamak ang isa sa mga bahagi ng katawan mo kaysa maitapon ang buo mong katawan sa Gehenna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “nagiging sanhi upang magkasala ka.”'
    reason: lexical_alternative
  - marker: b
    text: Ang Gehenna ay anyong Griyego ng pangalang kaugnay ng Lambak ng Hinom; tradisyonal itong isinasaling “impiyerno.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: nagiging dahilan ng pagkatisod mo
  rationale: Pinananatili nito ang metapora ng pagkatisod sa Griyego, habang malinaw pa rin sa modernong Tagalog; ipinapaliwanag sa talababa ang mas tuwirang diwang ‘magkasala.’
- source_word: ἔξελε
  choice: dukitin mo
  rationale: Likas at mariing Tagalog ito para sa sapilitang pag-aalis ng mata at pinananatili ang matinding larawan ng pautos.
- source_word: βάλε ἀπὸ σοῦ
  choice: itapon palayo sa iyo
  rationale: Pinananatili ang lakas ng βάλε at ang diwa ng paghihiwalay na ipinahihiwatig ng ἀπὸ σοῦ.
- source_word: συμφέρει
  choice: mas mabuti para sa iyo
  rationale: Natural na ipinahahayag nito ang pakinabang at paghahambing sa pangungusap nang hindi tunog-komersiyal.
- source_word: ἀπόληται
  choice: mapahamak
  rationale: Ipinahahayag nito ang mabigat na pagkawala ng isang bahagi nang hindi labis na nililinaw ang eksaktong paraan ng pagkawasak.
- source_word: μέλος
  choice: bahagi ng katawan
  rationale: Mas malinaw at natural sa ordinaryong Tagalog kaysa ‘miyembro,’ at hindi kasingkitid ng ‘bisig’ o ‘binti,’ yamang mata ang tinutukoy.
- source_word: βληθῇ
  choice: ay itapon
  rationale: Tuwirang pinananatili ang pasibong anyo at puwersa ng βάλλω.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang natatanging katawagang Griyego at iniiwasang agad itong ipantay sa mas malawak at teolohikal na katawagang ‘impiyerno.’
- source_word: ὁ δεξιὸς
  choice: kanang
  rationale: Pinananatili ang tahasang detalye ng pinagmulang teksto.
- source_word: δὲ
  choice: Ngunit
  rationale: Angkop itong naghahatid ng banayad na pagsalungat o pagpapatuloy mula sa naunang pahayag.
theological_decisions:
- issue: Pagsasalin ng γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili sa pangunahing teksto ang tiyak na katawagang ginamit sa Griyego upang hindi agad maipasok ang mas malawak na mga pagpapakahulugang teolohikal; nililinaw sa talababa ang kaugnayan nito sa Lambak ng Hinom at ang tradisyonal na salin.
- issue: Metaporikal na puwersa ng σκανδαλίζω
  choice: nagiging dahilan ng pagkatisod mo
  alternative: nagiging dahilan ng pagkakasala mo
  rationale: Pinananatili ng pangunahing teksto ang larawan ng pagkatisod sa Griyego, samantalang inilalahad sa talababa ang mas tuwirang kahulugan nito sa konteksto ng kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘dukitin’ upang mapanatili ang mariing larawan, ‘bahagi ng katawan’ para sa malinaw na pagtukoy sa μέλος, at ‘Gehenna’ upang mapanatili ang katawagang nasa pinagmulang teksto.
