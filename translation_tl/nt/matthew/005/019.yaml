id: MAT.5.19
reference: Matthew 5:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: tl
  text: Kaya, ang sinumang magpawalang-bisa[a] sa isa sa pinakamaliit na utos na ito at magturo sa mga tao na gayon din ang gawin ay tatawaging pinakamaliit sa kaharian ng langit. Ngunit ang sinumang tumupad sa mga ito at magturo ng mga ito, ang taong iyon ay tatawaging dakila sa kaharian ng langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mag-alis ng bisa,” “magpaluwag,” o “sumira.” Literal na nangangahulugang “kalagin” ang pandiwang Griyego; dito, tumutukoy ito sa pagpapahina sa bisa ng isang utos o sa pagtrato rito na para bang hindi ito may-bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Likas na nagpapahayag ng kongklusyon mula sa naunang sinabi ni Jesus tungkol sa Kautusan.
- source_word: λύσῃ
  choice: magpawalang-bisa
  rationale: Sa konteksto ng mga utos, ipinahihiwatig ng λύω ang pag-aalis o pagpapahina sa bisa ng isang utos; nililinaw ito ng talababa nang hindi ipinapantay lamang sa pagsuway.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: sa isa sa pinakamaliit sa mga utos na ito
  rationale: Pinananatili ang ranggong ipinahihiwatig ng superlatibong ἐλαχίστων at ang kaugnayan nito sa 'mga utos na ito.'
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: magturo sa mga tao na gayon din ang gawin
  rationale: Ang 'mga tao' ay natural at tumpak na panumbas sa pangkalahatang gamit ng ἀνθρώπους; ang 'gayon din ang gawin' ay malinaw na tumutukoy pabalik sa pagpapawalang-bisa sa utos.
- source_word: ἐλάχιστος κληθήσεται
  choice: tatawaging pinakamaliit
  rationale: Direktang pinananatili ang pasibong κληθήσεται at ang paghahambing ng katayuan sa loob ng kaharian.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: sa kaharian ng langit
  rationale: Ito ang natural at nakaugaliang makabagong Tagalog para sa natatanging parirala ni Mateo.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: tumupad at magturo ng mga ito
  rationale: Sa konteksto ng mga utos, mas natural sa Tagalog ang 'tumupad' kaysa literal na 'gumawa,' habang nananatiling malapit sa diwa ng ποιέω.
- source_word: οὗτος μέγας κληθήσεται
  choice: ay tatawaging dakila
  rationale: Ang ayos at magkatapat na sugnay sa Tagalog ay sapat na nagpapanatili sa diin ng οὗτος; ang 'dakila' ay dignified at tuwirang katapat ng μέγας.
theological_decisions:
- issue: Katayuang “pinakamaliit” o “dakila” sa kaharian
  choice: Panatilihin itong paghahambing ng katayuan sa loob ng kaharian.
  alternative: Ipahiwatig na ang 'pinakamaliit' ay hindi makapapasok sa kaharian, o gawing teknikal na antas ng gantimpala ang 'dakila.'
  rationale: Sinasabi ng teksto na tatawaging pinakamaliit 'sa kaharian,' ngunit hindi nito ipinaliliwanag ang kaugnayan nito sa kaligtasan o gantimpala; hindi dapat lutasin ng salin ang tensiyong iyon.
- issue: Pangkalahatang saklaw ng τοὺς ἀνθρώπους
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang reperensiya ng Griyego sa mga tao, hindi lamang sa kalalakihan; likas at eksakto ang 'mga tao' sa modernong Tagalog.
- issue: Saklaw ng ipinahihiwatig na layon sa ποιήσῃ καὶ διδάξῃ
  choice: tumupad at magturo ng mga ito
  alternative: tumupad sa mga ito at magturo sa iba na tumupad sa mga ito
  rationale: Pinananatiling maikli ang elipsis ng Griyego at hindi labis na dinaragdagan ang tahasang nilalaman, bagaman malinaw sa konteksto na ang mga utos ang tinutupad at itinuturo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga tao' bilang natural na pangkalahatang katawagan. Pinanatili ang paralelismo ng dalawang sugnay at ang tensiyon sa pagitan ng 'pinakamaliit' at 'dakila' nang hindi nagdaragdag ng paliwanag na doktrinal.
