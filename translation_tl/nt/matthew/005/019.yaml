    issue: Malabo at di-gaanong natural ang pariralang 'isa sa pinakamaliit sa mga utos na ito.'
    rationale: Ang Griyegong genitive construction ay tumutukoy sa isang utos na kabilang sa pinakamaliit na mga utos. Mas tuwiran sa Tagalog ang 'isa sa pinakamaliit na utos na ito.'
  - severity: low
