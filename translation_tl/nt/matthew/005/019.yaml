    rationale: Ang 'ang taong iyon' ay naglilipat ng diin ng demonstrative na 'this one' nang natural sa Tagalog.
  - severity: low
    issue: Hindi natural ang 'magkalag' sa talababa bilang pagpapahayag ng literal na kahulugan.
    rationale: Mas idiomatiko ang 'kalagin'; nililinaw rin ng binagong talababa na ang kontekstuwal na diwa ay pagpapahina o pagtrato sa utos bilang hindi may-bisa, hindi lamang personal na pagsuway.
