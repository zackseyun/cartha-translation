  naturalness: Likas ang kabuuang rehistro, ngunit medyo mabigat at posibleng malabo ang 'sa isa sa pinakamaliit sa mga utos na ito.' Ang 'ang taong iyon' ay isang natural na paraan upang maipakita ang demonstratibong diin nang hindi nagiging di-Tagalog ang pangungusap.
  terminology: Ang 'magpawalang-bisa,' 'kaharian ng langit,' 'mga tao,' 'tumupad,' 'pinakamaliit,' at 'dakila' ay angkop sa makabago ngunit marangal na Tagalog. Inayos ang talababa upang ang literal na halaga ng λύω ay maging natural na Tagalog ('kalagin') at upang hindi ipakahulugang simpleng paglabag lamang ang pandiwa.
