id: MAT.5.22
reference: Matthew 5:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: ang bawat nagagalit sa kanyang kapatid[a][d] ay mananagot sa paghatol; ang sinumang magsabi sa kanyang kapatid, “Raka,”[b] ay mananagot sa kapulungan[c]; at ang sinumang magsabi, “Hangal!” ay mananagot sa Gehenna ng apoy.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idinaragdag ng ilang manuskrito ang “nang walang dahilan” pagkatapos ng “nagagalit sa kanyang kapatid.” Wala ito sa pinakamaaga at pinakamabuting pinatotohanang mga manuskrito.
    reason: textual_variant
  - marker: b
    text: Ang “Raka” ay isang Aramaikong katawagang mapanlait, na humigit-kumulang ay “walang laman ang ulo” o “walang silbi.”
    reason: cultural_note
  - marker: c
    text: O “Sanedrin,” ang namumunong kapulungan ng mga Judio.
    reason: alternative_reading
  - marker: d
    text: Ang salitang Griyego ay panlalaking isahan ngunit maaaring kumatawan nang malawakan; ang pahayag ay hindi lamang tungkol sa mga lalaking magkakapatid. Ang “kapatid” sa Filipino ay hindi nagtatakda ng kasarian.
    reason: lexical_alternative
  - marker: e
    text: O “impiyernong apoy.” Pinananatili ng “Gehenna” ang partikular na terminong ginamit ni Jesus, na hango sa larawan ng Lambak ng Hinnom na iniugnay sa paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pagsalungat ng ἐγώ at δέ, habang natural at marangal ang daloy sa Filipino.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: ang bawat nagagalit
  rationale: Ipinapahayag ang pangkalahatang saklaw at patuloy na bisa ng substantival present participle nang hindi labis na tinutukoy ang aspekto.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Ang “kapatid” ang tuwirang katumbas na natural sa Filipino at hindi minamarkahan ang kasarian, kaya naihahatid din nito ang malawak na kinatawang gamit ng terminong Griyego.
- source_word: ἔνοχος ἔσται
  choice: ay mananagot
  rationale: Inihahatid ng “mananagot” ang pagiging saklaw ng pananagutang legal o kaparusahan at pinananatili ang larawang panghukuman sa tatlong pahayag.
- source_word: τῇ κρίσει
  choice: sa paghatol
  rationale: Pinananatili ang di-tiyak na saklaw ng κρίσις bilang paghatol o prosesong panghukuman, sa halip na tiyakang ipakahulugan bilang isang lokal na hukuman.
- source_word: Ῥακά
  choice: Raka
  rationale: Tinumbasan sa baybay-Filipino ang Aramaikong insultong pinanatili sa tekstong Griyego; ipinaliwanag ang kahulugan nito sa talababa.
- source_word: τῷ συνεδρίῳ
  choice: sa kapulungan
  rationale: Isinasalin ang karaniwang kahulugan ng συνέδριον nang hindi agad nililimitahan sa teknikal na pangalang “Sanedrin”; ibinibigay ang posibilidad na iyon sa talababa.
- source_word: Μωρέ
  choice: Hangal!
  rationale: Natural itong tuwirang insulto sa Filipino at pinananatili ang moral na bigat ng μωρέ nang hindi gumagamit ng makabagong terminong klinikal o mapanlinlang.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: sa Gehenna ng apoy
  rationale: Pinananatili ang tiyak at makasaysayang terminong γέεννα at ang imahen ng genitibong τοῦ πυρός, sa halip na lubusang ipalit ang mas malawak na konsepto ng “impiyerno.”
theological_decisions:
- issue: Pagpapakahulugan sa γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinananatili ang partikular na imaheng Hudyo na nagmula sa Lambak ng Hinnom at kaugnay ng paghatol, nang hindi ipinapasok ang lahat ng mga kahulugang nabuo kalaunan sa salitang “impiyerno.”
- issue: Saklaw ng ἀδελφός
  choice: kapatid
  alternative: kapatid na lalaki; kapwa mananampalataya
  rationale: Ang Griyego ay panlalaking isahan ngunit maaaring gamitin bilang kinatawan. Ang salitang Filipino na “kapatid” ay likas na walang tiyak na kasarian at hindi nililimitahan ang pahayag sa lalaking magkakapatid.
- issue: Saklaw ng τῇ κρίσει
  choice: paghatol
  alternative: hukuman
  rationale: Hindi tahasang nilulutas ng parirala kung isang lokal na hukuman o ang proseso/kinalabasan ng paghatol ang tinutukoy; pinananatili ng “paghatol” ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tatluhang paralelismo at ang tumitinding larawang panghukuman. Ginamit ang “Raka” at “Gehenna” upang mapanatili ang makasaysayan at kultural na tekstura, na may maiikling paliwanag sa talababa.
