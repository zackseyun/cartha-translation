  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: tl
  text: Pinagpala ang mga nagdadalamhati[a], sapagkat sila ay aaliwin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga namimighati.” Malawak ang kahulugan ng salitang Griyego at hindi nito tinutukoy ang sanhi ng pagdadalamhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Pinagpala
  rationale: Pinananatili nito ang pormula ng pagpapala at ang obhetibong pagpapahayag ng mabuting kalagayan sa harap ng Diyos; hindi ito nililimitahan sa pansariling damdamin ng pagiging masaya.
- source_word: οἱ πενθοῦντες
  choice: ang mga nagdadalamhati
  rationale: Likas na isinasalin ang substantibong pangkasalukuyang pandiwari bilang pangmaramihang tumutukoy sa mga taong nagdadalamhati. Malawak ang saklaw nito at hindi tinutukoy kung ang sanhi ay pagkawala, pagdurusa, kasalanan, o ibang kapighatian.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw nitong ipinakikilala ang dahilan o batayan ng naunang pagpapahayag habang pinananatili ang marangal at likas na himig.
- source_word: αὐτοὶ
  choice: sila
  rationale: Sapat na naihahayag ng panghalip at ng balangkas ng pangungusap ang bahagyang diin ng Griyego; magiging labis at di-likas dito ang “sila mismo.”
- source_word: παρακληθήσονται
  choice: ay aaliwin
  rationale: Tumpak at likas itong salin ng panghinaharap na balintiyak, na nagsasaad na tatanggap sila ng kaaliwan nang hindi tahasang dinaragdagan kung sino ang kikilos.
theological_decisions:
- issue: Saklaw ng pagdadalamhati sa pagpapala
  choice: Panatilihing malawak bilang “ang mga nagdadalamhati,” nang hindi tinutukoy ang sanhi.
  alternative: Ang mga nagdadalamhati dahil sa kasalanan; ang mga nagdadalamhati sa pangkalahatan; o ang mga tumatangis dahil sa kalagayan ng Israel.
  rationale: Hindi binabanggit ng tekstong Griyego ang layon o sanhi ng pagdadalamhati. Pinananatili ng malawak na salin ang teolohikal at pastoral na pagiging bukás ng sinabi sa halip na magpasok ng isang makitid na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pinagpala” bilang pamilyar at tumpak na pormula ng pagpapala, at ang “nagdadalamhati” upang mapanatili ang malawak na diwa ng πενθέω. Lumilitaw sa pangunahing teksto ang marker na [a].
