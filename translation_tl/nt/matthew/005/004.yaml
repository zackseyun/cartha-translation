  source_fidelity: Tapat ang salin sa Griyego. Ang “Pinagpala” ay angkop sa μακάριοι bilang pormula ng mga pagpapala; ang “mga nagdadalamhati” ay pinananatiling malawak para sa οἱ πενθοῦντες; ang “sapagkat” ay malinaw na nagsasaad ng sanhi; at ang “sila ay aaliwin” ay wastong panghinaharap na balintiyak para sa παρακληθήσονται. Walang idinagdag na tiyak na sanhi ng pagluluksa o pagdadalamhati.
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang ayos na “Pinagpala ang mga nagdadalamhati, sapagkat sila ay aaliwin” ay maayos para sa tekstong biblikal at madaling unawain.
  terminology: Ang “Pinagpala” ay angkop at matatag na katumbas sa ganitong pormula. Ang “nagdadalamhati” ay masaklaw at mas tumpak kaysa sa mga saling maglilimita sa dalamhati sa kasalanan o sa isang partikular na uri ng pagkawala. Ang talababa na “mga namimighati” ay isang makatwirang leksikal na alternatibo, at wastong ipinapaliwanag na hindi tinutukoy ng Griyego ang sanhi.
