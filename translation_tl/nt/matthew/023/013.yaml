  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: tl
  text: Ngunit kasawian sa inyo, mga eskriba at mga Pariseo, mga mapagkunwari! Sapagkat isinasara ninyo ang kaharian ng langit[a] sa harap ng mga tao. Hindi kayo pumapasok, at hindi rin ninyo pinahihintulutang makapasok ang mga pumapasok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kaharian ng mga langit.” Karaniwang ginagamit ni Mateo ang pananalitang ito kung saan sa ibang konteksto ay maaaring sabihing “kaharian ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga nagsisikap pumasok.” Maaaring tumukoy ang anyong Griyego sa mga nasa proseso ng pagpasok o sa mga naghahangad na pumasok.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: kasawian sa inyo
  rationale: Pinananatili ang bigat ng propetikong hatol at babala ng οὐαί; higit itong matindi kaysa sa simpleng pagpapahayag ng lungkot.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Ebanghelyo, malinaw nitong ipinapahayag sa makabagong mambabasa ang tungkulin ng mga γραμματεῖς nang hindi gumagamit ng hindi gaanong malinaw na hiram na katawagang 'eskriba.'
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang salin sa Filipino ng pangalan ng pangkat.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Likas at malinaw na Filipino para sa moral at relihiyosong pagpapanggap na tinutukoy rito.
- source_word: κλείετε
  choice: isinasara
  rationale: Pinananatili ang talinghaga ng pagsasara at paghadlang sa pagpasok.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: kaharian ng langit
  rationale: Likas na Filipino at pamilyar na katumbas ng natatanging parirala ni Mateo, nang hindi ito ipinapakahulugang ibang kaharian kaysa sa kaharian ng Diyos.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa mga tao
  rationale: Sa ugnayan nito sa 'isinasara,' natural na ipinahahayag ang mga taong hinahadlangan; iniiwasan ang alanganing literal na 'sa harap ng mga tao' habang pinananatili ang larawan ng pagsasara laban sa kanila.
- source_word: τοὺς εἰσερχομένους
  choice: ang mga pumapasok
  rationale: Pinananatili ang aspektong pangkasalukuyan ng participle at ang posibilidad na sila ay nasa proseso ng pagpasok, nang hindi tahasang nililimitahan sa 'nagsisikap pumasok.'
- source_word: ἀφίετε εἰσελθεῖν
  choice: pinahihintulutang makapasok
  rationale: Malinaw na ipinapahayag ang kahulugang pagpapahintulot at ang infinitibong 'pumasok' sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng βασιλεία τῶν οὐρανῶν
  choice: kaharian ng langit
  alternative: kaharian ng mga langit
  rationale: Ginagamit ang likas at nakaugaliang anyo sa Filipino, ngunit hindi nag-aangkat ng doktrinal na pagkakaiba nito sa 'kaharian ng Diyos.'
- issue: Aspekto ng τοὺς εἰσερχομένους
  choice: mga pumapasok
  alternative: mga nagsisikap pumasok
  rationale: Pinananatili ang tunay na kalabuan kung ang mga tao ay aktuwal nang nasa proseso ng pagpasok o naghahangad na pumasok.
- issue: Lakas ng Οὐαὶ
  choice: kasawian sa inyo
  alternative: kahabag-habag kayo
  rationale: Ang napiling anyo ay nagpapanatili ng propetikong pahayag ng hatol at hindi lamang paglalarawan sa kanilang kalagayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagturo ng Kautusan” upang maging madaling maunawaan ang historikal na tungkulin, at pinanatili ang mariing himig ng pampublikong pagsaway.
