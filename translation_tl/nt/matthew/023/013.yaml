  to: Ngunit kasawian sa inyo, mga eskriba at mga Pariseo, mga mapagkunwari! Sapagkat isinasara ninyo ang kaharian ng langit[a] sa harap ng mga tao. Hindi kayo pumapasok, at hindi rin ninyo pinahihintulutang makapasok ang mga pumapasok[b].
