  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: tl
  text: Kaya nagpapatotoo kayo laban sa inyong mga sarili na kayo ay mga anak ng mga pumatay sa mga propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapatotoo kayo sa inyong mga sarili.” Mas literal na ganito maisasalin ang pananalitang Griyego, ngunit sa konteksto, ang kanilang patotoo ay nagsasangkot sa kanila mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahahayag ang bunga o lohikal na kongklusyon mula sa naunang sinabi; natural at malinaw ito sa modernong Filipino.
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: pinatototohanan ninyo laban sa inyong sarili
  rationale: Ang pandiwa ay nangangahulugang magpatotoo, at ang datibong ἑαυτοῖς ay literal na maaaring unawaing “sa inyong sarili.” Sa konteksto, ang kanilang patotoo ang nagsasangkot o humahatol sa kanila, kaya ang “laban sa inyong sarili” ang natural na pagpapahayag ng puwersa nito.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng kanilang patotoo, hindi isang sugnay na nagsasaad ng sanhi.
- source_word: υἱοί
  choice: mga anak
  rationale: Sa Filipino, ang “mga anak” ang natural na katumbas sa kontekstong pampamilya at maaari ring magpahiwatig ng moral na pakikiisa sa mga ninuno. Hindi karaniwang ginagamit ang “mga anak na lalaki” sa ganitong retorikal na pahayag at magiging sobrang tahas iyon.
- source_word: τῶν φονευσάντων
  choice: ng mga pumatay
  rationale: Tinutukoy ng aorist participle ang mga taong nakilala sa natapos nilang pagpatay. Sa Filipino, ang “pumatay” ay malinaw at dignified; ang pagiging masama at sinadya ng gawa ay sapat na ipinahihiwatig ng konteksto.
- source_word: τοὺς προφήτας
  choice: sa mga propeta
  rationale: Tuwirang pinananatili ang kinikilalang pangkat ng mga sugo ng Diyos sa kasaysayan ng Israel.
theological_decisions:
- issue: Kung pananatilihin ang literal na panlalaking anyo ng υἱοί o gagamitin ang likas na katumbas nito sa Filipino.
  choice: mga anak
  alternative: mga anak na lalaki; mga inapo
  rationale: Ang “mga anak” ay ang karaniwang salin ng υἱοί sa ganitong idyomang pampamilya at pinananatili ang parehong tunay na ugnayang pangangkan at ipinahihiwatig na moral na pakikiisa. Ang “mga inapo” ay nagpapahina sa talinghaga ng ama at anak, samantalang ang “mga anak na lalaki” ay hindi likas at maaaring magdagdag ng diin sa kasarian na wala sa karaniwang gamit ng Filipino.
- issue: Kung gagawing tahasan ang mapanghatol na diwa ng μαρτυρεῖτε ἑαυτοῖς.
  choice: pinatototohanan ninyo laban sa inyong sarili
  alternative: pinatototohanan ninyo sa inyong sarili
  rationale: Pinananatili ng pangunahing salin ang diwang nagsasangkot sa kanila sa konteksto, habang itinatala sa talababa ang mas literal at tunay na posibleng anyo ng datibo upang hindi maitago ang leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “pinatototohanan” upang mapanatili ang pormal at halos panghukuman na himig ng μαρτυρεῖτε, at “mga anak” upang mapanatili ang matalinghagang ugnayang pampamilya nang hindi nagiging asiwa sa Tagalog.
