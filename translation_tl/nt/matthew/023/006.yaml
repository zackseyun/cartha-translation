  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: tl
  text: Gustung-gusto nila ang pangunahing puwesto sa mga handaan[a][c] at ang mga upuang pandangal sa mga sinagoga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pinakapinarangalang puwesto sa hapag.” Sa mga pormal na handaan noong sinaunang panahon, ang mga panauhin ay nakahilig sa paligid ng hapag, at may puwestong nakalaan sa pinakapinarangalang panauhin.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga pangunahing upuan.” Idinidiin ng Griyego ang mga upuang nagpapakita ng pinakamataas na katayuan o pangunguna.
    reason: lexical_alternative
  - marker: c
    text: Sa mga handaan sa sinaunang daigdig ng Mediteraneo, makikita sa ayos ng mga puwesto ang antas ng karangalan ng bawat panauhin. Kaya ang tinutukoy ay paghahangad ng hayag na katayuan, hindi lamang ng maginhawang puwesto.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: Gustung-gusto nila
  rationale: Ipinahahayag ng kasalukuyang pandiwang φιλοῦσι ang matinding pagkagusto o pagkahilig; natural sa modernong Tagalog ang “gustung-gusto” at nananatili ang puwersa ng pagpuna ni Jesus.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ang δέ na nagpapatuloy sa paglalarawan mula sa naunang talata. Sa Tagalog, mas natural ang tuwirang pagpapatuloy kaysa piliting lagyan ng “at” o “ngunit” sa simula.
- source_word: τὴν πρωτοκλισίαν
  choice: ang mga pinakapinarangalang puwesto
  rationale: Tumutukoy ang πρωτοκλισία sa pinakamataas na puwesto sa pagkakahilig sa hapag. Inihahatid ng salin ang antas at pampublikong karangalang ipinahihiwatig nito, habang ipinapaliwanag sa talababa ang sinaunang kaugalian.
- source_word: ἐν τοῖς δείπνοις
  choice: sa mga handaan
  rationale: Sa kontekstong ito, ang δεῖπνον ay mga pormal na kainan kung saan lantad ang antas ng karangalan. Karaniwan at malinaw sa Tagalog ang “mga handaan.”
- source_word: τὰς πρωτοκαθεδρίας
  choice: ang mga pangunahing upuan
  rationale: Ang πρωτοκαθεδρία ay mga upuang may pinakamataas na katayuan o pangunguna. Pinananatili ng “pangunahing upuan” ang ideya ng ranggo nang hindi ipinakahulugang ang tinutukoy ay kaginhawahan lamang.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Tuwiran at natural na salin ng pariralang panlunan, at pinananatili ang institusyunal na tagpuan ng pagtitipong Judio.
