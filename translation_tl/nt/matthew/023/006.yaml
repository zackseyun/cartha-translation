translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “gustung-gusto” upang malinaw ang matinding pagkahilig, at “pinakapinarangalang puwesto” upang maipakita ang sosyal na ranggo ng πρωτοκλισία. Ang sinaunang paraan ng paghilig sa hapag ay inilagay sa talababa sa halip na gawing mabigat ang pangunahing teksto.
