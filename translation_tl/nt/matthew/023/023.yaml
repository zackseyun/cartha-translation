id: MAT.23.23
reference: Matthew 23:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: tl
  text: '“Kawawa kayo, mga eskriba at mga Pariseo, mga mapagkunwari! Sapagkat nagbibigay kayo ng ikapu mula sa menta, eneldo, at komino, ngunit pinababayaan ninyo ang mas mahahalagang bagay sa Kautusan: ang katarungan, habag, at katapatan[a]. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pananampalataya.” Ang salitang Griyego ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan; sa kontekstong etikal na ito, marami ang umuunawa rito bilang katapatan.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Kawawa kayo
  rationale: Nananatili ang mariing propetikong pahayag ng kapahamakan at paghatol, at natural itong nauunawaan sa modernong Tagalog.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa konteksto ng Mateo, inilalarawan nito ang mga dalubhasa at tagapagturo ng Kautusan; mas malinaw ito sa karaniwang mambabasa kaysa sa hiram na terminong “mga eskriba.”
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Tumpak at likas na katumbas ng etikal na kahulugan ng mga taong ang panlabas na anyo ay salungat sa tunay nilang asal.
- source_word: ἀποδεκατοῦτε
  choice: nagbibigay kayo ng ikapu mula sa
  rationale: Malinaw na ipinapahayag ang pagbibigay ng isang ikasampung bahagi, at ang “mula sa” ay angkop sa mga halamang binanggit.
- source_word: ἡδύοσμον
  choice: menta
  rationale: Karaniwang modernong pangalang Filipino para sa mint.
- source_word: ἄνηθον
  choice: eneldo
  rationale: Tinatanggap na pangalang Filipino para sa dill.
- source_word: κύμινον
  choice: komino
  rationale: Tinatanggap na pangalang Filipino para sa cumin.
- source_word: ἀφήκατε
  choice: pinababayaan ninyo
  rationale: Ipinahihiwatig ang hindi pagtupad o pagpapabaya, hindi kinakailangang ganap na pagtatakwil.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ang mas mahahalagang bagay sa Kautusan
  rationale: Inilalahad nang malinaw ang metaporikal na diwa ng “mas mabibigat,” samakatuwid ay mas mahalaga.
- source_word: κρίσιν
  choice: katarungan
  rationale: Sa etikal na hanay na ito, tumutukoy ito sa makatarungang pagkilos, hindi lamang sa paghatol.
- source_word: ἔλεος
  choice: habag
  rationale: Natural at marangal na salitang Tagalog para sa mercy o compassionate mercy.
- source_word: πίστιν
  choice: katapatan
  rationale: Sa hanay ng mga tungkuling etikal na hinihingi ng Kautusan, malamang na tumutukoy ang πίστις sa pagiging tapat o maaasahan; pinananatili sa talababa ang tunay na posibilidad na “pananampalataya.”
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang iba
  rationale: 'Pinananatili ang dalawang sabay na tungkulin: gawin ang mas mahahalagang bagay at huwag pabayaan ang pag-iikapu.'
theological_decisions:
- issue: Kahulugan ng πίστιν sa etikal na tatluhan
  choice: katapatan
  alternative: pananampalataya
  rationale: Ang agarang konteksto ay tatlong “mas mahahalagang bagay sa Kautusan” na isinasagawa sa pakikitungo at asal; kaya mas angkop dito ang “katapatan.” Gayunman, maaaring mangahulugan ang πίστις ng pananampalataya o pagtitiwala, kaya hindi inaalis ang alternatibong iyon.
- issue: Ugnayan ng mas mahahalagang bagay at pag-iikapu
  choice: Parehong dapat gawin, ngunit tahasang mas mahalaga ang katarungan, habag, at katapatan
  alternative: Ituring na kinansela ng unang utos ang pag-iikapu sa maliliit na halaman
  rationale: Tahasan sa Griyego ang “dapat gawin ang mga ito at huwag pabayaan ang mga iyon”; pinananatili ng salin ang tensiyon at antas ng kahalagahan nang hindi ginagawang magkasalungat ang mga tungkulin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” para sa Torah/Law sa kontekstong biblikal; iniwasan ang mas teknikal na “mga eskriba” at pinili ang malinaw na “mga tagapagturo ng Kautusan.”
