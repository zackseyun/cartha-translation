  to: '“Kawawa kayo, mga eskriba at mga Pariseo, mga mapagkunwari! Sapagkat nagbibigay kayo ng ikapu mula sa menta, eneldo, at komino, ngunit pinababayaan ninyo ang mas mahahalagang bagay sa Kautusan: ang katarungan, habag, at katapatan[a]. Dapat ninyong gawin ang mga ito nang hindi pinababayaan ang mga iyon.”'
