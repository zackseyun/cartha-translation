base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: tl
  text: at sinasabi ninyo, “Kung nabuhay kami noong panahon ng mga ama namin, hindi sana kami naging kabahagi nila sa pagbububo ng dugo ng mga propeta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγετε
  choice: sinasabi ninyo
  rationale: Ang pangkasalukuyang pandiwa at tahasang maramihang kausap ay likas na naipapahayag sa Filipino bilang “sinasabi ninyo.”
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Kung nabuhay kami noong panahon
  rationale: Ipinahihiwatig ng kondisyong salungat sa nangyari ang isang di-totoong kalagayan sa nakaraan. Natural sa modernong Filipino ang “Kung nabuhay kami noong panahon.”
- source_word: τῶν πατέρων ἡμῶν
  choice: ng aming mga ninuno
  rationale: Sa kontekstong tumutukoy sa mga salinlahing nauna sa kanila, malinaw at natural ang “mga ninuno.” Hindi nito nililimitahan ang reperensiya sa kanilang mga agarang ama.
- source_word: οὐκ ἂν ἤμεθα
  choice: hindi sana kami
  rationale: Ang “sana” kasama ng pangnagdaang diwa ay karaniwang paraan sa Filipino upang ipahayag ang bunga ng isang kondisyong hindi nangyari.
- source_word: αὐτῶν κοινωνοὶ
  choice: nakibahagi sa kanila
  rationale: Ipinapanatili ng “nakibahagi sa kanila” ang diwa ng pakikilahok o pakikisangkot nang hindi agad pinatitindi sa mas tiyak na “kasabwat.”
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: sa dugo ng mga propeta
  rationale: Pinananatili ang kongkretong larawan ng “dugo” at ang bahagyang pagkapahiwatig ng Griyego; sa konteksto, tumutukoy ito sa pakikibahagi sa pagbububo ng dugo at pananagutan dito.
theological_decisions:
- issue: Antas ng pakikisangkot na ipinahihiwatig ng κοινωνοὶ ἐν τῷ αἵματι
  choice: “nakibahagi sa kanila sa dugo ng mga propeta”
  alternative: “nakipagsabwatan sa kanila sa pagpatay sa mga propeta”
  rationale: Ang pangunahing salin ay nagpapanatili sa ugnayang ideya ng κοινωνοί at sa metapora ng dugo. Hindi nito nilulutas nang labis ang tunay na pahiwatig kung ang diin ay aktuwal na pakikilahok, pakikiisa, o pananagutan sa pagbububo ng dugo.
translation_notes:
  register: Modernong Filipino na may dignidad at bahagyang biblikal na indayog. Ginamit ang “mga ninuno” bilang natural na katumbas sa kontekstong salinlahi, at pinanatili ang “dugo ng mga propeta” upang huwag gawing tahasang paraprasis ang larawan ng orihinal.
