  naturalness: Natural ang karamihan ng pangungusap, ngunit alanganin ang kolokasyong “nakibahagi sa kanila sa dugo.” Mas idiomatiko ang “naging kabahagi nila sa pagbububo ng dugo ng mga propeta,” habang pinananatili ang diwa ng pakikibahagi kaysa tahasang “pakikipagsabwatan.”
  terminology: Ang “mga propeta” ay wastong katumbas ng προφητῶν. Ginamit ang “mga ama” upang sundin ang hayag na panlalaking termino ng Griyego nang hindi nagdaragdag ng pagpapakahulugang doktrinal.
