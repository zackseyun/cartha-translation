  text: Τότε ὁ Ἰησοῦς ἐλάλησεν τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: tl
  text: Pagkatapos, nagsalita si Jesus sa mga tao at sa kanyang mga alagad,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsasaad ito ng pagkakasunod-sunod sa salaysay. Natural sa modernong Tagalog ang “Pagkatapos” at hindi nito dinaragdagan ang tiyak na pagitan ng oras.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ang artikulong Griyego ay karaniwang gamit sa pangalang pantangi; sa Tagalog, ang natural na pananda sa personal na pangalan ay “si.”
- source_word: ἐλάλησεν
  choice: nagsalita
  rationale: Ang aorist ng λαλέω ay payak na tumutukoy sa pagsasalita. Pinananatili ng “nagsalita” ang diwa nang hindi idinaragdag ang mas tiyak na kahulugan ng “nangaral” o “kinausap.”
- source_word: τοῖς ὄχλοις
  choice: sa mga tao
  rationale: Ang ὄχλοις ay maramihan at tumutukoy sa mga nagkakatipong pangkat ng mga tao. Ang “sa mga tao” ay natural at malinaw sa modernong Tagalog, samantalang ang “sa mga karamihan” ay hindi likas na gamit.
- source_word: καὶ
  choice: at
  rationale: Payak na pangatnig na nag-uugnay sa dalawang pangkat na pinagsalitaan.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Malinaw na inililipat ng “kanyang” ang possessive genitive αὐτοῦ, at ang “mga alagad” ang karaniwan at tumpak na salin ng μαθηταί sa konteksto ng mga Ebanghelyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang dalawang magkahiwalay na pangkat—ang mga tao at ang mga alagad ni Jesus—at ang kuwit sa hulihan bilang paghahanda sa kasunod na pahayag.
