id: MAT.23.37
reference: Matthew 23:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: tl
  text: Jerusalem, Jerusalem, ikaw na pumapatay sa mga propeta at bumabato ng bato sa mga isinugo sa iyo—ilang ulit kong ninais na tipunin ang iyong mga anak, kung paanong tinitipon ng isang inahing manok[b] ang mga sisiw nito sa ilalim ng mga pakpak nito, ngunit ayaw ninyo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang salitang Griyego na isinaling "inahing manok" ay maaari ring mangahulugang "ibon" sa pangkalahatan, ngunit ang larawan ng pagtitipon ng mga sisiw sa ilalim ng mga pakpak ay tumutukoy sa isang inahing manok.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: Pinanatili ang pangalan at ang mariing pag-uulit na nagpapahayag ng panaghoy at tuwirang pagtawag.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: ikaw na pumapatay sa mga propeta
  rationale: Likas sa Tagalog ang tuwirang panghalip sa personipikadong lungsod; ipinahihiwatig ng pangkasalukuyang pandiwari ang kinagawiang katangian.
- source_word: λιθοβολοῦσα
  choice: bumabato hanggang mamatay
  rationale: Nililinaw ang pagpatay sa pamamagitan ng pagbato, sa halip na karaniwang paghahagis lamang ng bato.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: mga isinugo sa iyo
  rationale: Pinananatili ang balintiyak na diwa at ang personipikadong pakikipag-usap sa Jerusalem.
- source_word: ποσάκις ἠθέλησα
  choice: ilang ulit kitang ninais
  rationale: Ang 'ninais' ay nagpapahayag ng tunay na hangarin o pagkukusa nang hindi dinaragdagan ang lakas ng pandiwa o ginagawa itong teknikal na pahayag teolohikal.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: tipunin ang iyong mga anak
  rationale: Pinananatili ang larawan ng pagtitipon at ang metaporang 'mga anak' sa halip na ipakahulugang 'mga mamamayan' o 'mga naninirahan.'
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς
  choice: gaya ng pagtitipon ng isang inahing manok sa kanyang mga sisiw
  rationale: Bagaman maaaring mangahulugang ibon sa pangkalahatan ang ὄρνις, malinaw na maternal na larawan ang pagtipon sa mga sisiw sa ilalim ng mga pakpak; natural at tiyak sa Tagalog ang 'inahing manok.'
- source_word: ὑπὸ τὰς πτέρυγας
  choice: sa ilalim ng kanyang mga pakpak
  rationale: Tuwiran at natural na pinananatili ang mapagkalingang larawan.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ngunit ayaw ninyo
  rationale: 'Ang maramihang ''ninyo'' ay mahalaga: kausap ang personipikadong Jerusalem, ngunit tinutukoy ang mga taong kabilang dito. Ang ''ngunit'' ay likas na naghahayag ng matinding pagsalungat sa naunang pagnanais.'
theological_decisions:
- issue: Pagsalungat ng pagnanais ni Jesus at pagtanggi ng Jerusalem
  choice: Ipinahayag bilang 'ninais' at 'ayaw' nang hindi ipinaliliwanag ang mas malawak na ugnayan ng banal na kalooban at pananagutan ng tao.
  alternative: Gumamit ng mas determinatibong 'itinakda ko,' o gawing damdamin lamang ang unang pandiwa.
  rationale: Magkapamilya ang dalawang anyo ng θέλω at tunay ang volitional na tensiyon sa teksto; dapat itong panatilihin, hindi lutasin sa salin.
- issue: Pagkakakilanlan ng 'iyong mga anak'
  choice: Pinanatili ang 'iyong mga anak.'
  alternative: Ang iyong mga mamamayan; ang mga naninirahan sa iyo.
  rationale: Pinananatili nito ang personipikasyon at hindi nililimitahan ang tinutukoy sa isang grupong hindi tahasang binanggit.
- issue: Paglipat mula isahang Jerusalem tungo sa maramihang tumatanggi
  choice: Ginamit ang isahang 'iyo/iyong' para sa lungsod at maramihang 'ninyo' sa huling sugnay.
  alternative: Gawing isahan ang lahat ng panghalip para sa mas makinis na personipikasyon.
  rationale: Ang ἠθελήσατε ay ikalawang panauhang maramihan. Ang paglipat ay makabuluhan at dapat makita sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'ninais' bilang bahagyang pormal na salitang angkop sa panaghoy; iniwasan ang sobrang arkaikong ayos at denominasyonal na terminolohiya. Walang talababa dahil sapat na malinaw sa pangunahing teksto ang kontekstuwal na kahulugan ng ὄρνις bilang inahing manok.
