revisions:
- from: Jerusalem, Jerusalem, ikaw na pumapatay sa mga propeta at bumabato hanggang mamatay sa mga isinugo sa iyo—ilang ulit kitang ninais tipunin ang iyong mga anak, gaya ng pagtitipon ng isang inahing manok sa kanyang mga sisiw sa ilalim ng kanyang mga pakpak, ngunit ayaw ninyo!
  to: Jerusalem, Jerusalem, ikaw na pumapatay sa mga propeta at bumabato ng bato sa mga isinugo sa iyo—ilang ulit kong ninais na tipunin ang iyong mga anak, kung paanong tinitipon ng isang inahing manok[b] ang mga sisiw nito sa ilalim ng mga pakpak nito, ngunit ayaw ninyo!
