  to: “Kahabag-habag kayo,[a] mga tagapagturo ng Kautusan at mga Pariseo, mga mapagkunwari! Sapagkat nilalamon ninyo ang ari-arian ng mga biyuda, at sa pagkukunwari ay nananalangin kayo nang mahahaba. Kaya tatanggap kayo ng mas mabigat na hatol.”
