  naturalness: Marangal at malinaw ang register. Mas natural at mas tuwirang Filipino ang “sa pagkukunwari ay nananalangin kayo nang mahahaba” kaysa “nagdarasal kayo nang mahaba bilang pagkukunwari.”
  terminology: Ang “mga tagapagturo ng Kautusan,” “mga Pariseo,” “mga mapagkunwari,” at “mas mabigat na hatol” ay angkop. Ang “ari-arian ng mga biyuda” ay mas tapat sa saklaw ng “mga bahay ng mga balo” nang hindi lumilikha ng maling literal na larawan.
