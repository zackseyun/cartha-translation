base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: tl
  text: “Kahabag-habag kayo,[a] mga tagapagturo ng Kautusan at mga Pariseo, mga mapagkunwari! Sapagkat nilalamon ninyo ang ari-arian ng mga biyuda, at sa pagkukunwari ay nananalangin kayo nang mahahaba. Kaya tatanggap kayo ng mas mabigat na hatol.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay wala sa pinakamaagang mga manuskritong Griyego, kabilang ang Sinaiticus at Vaticanus noong ika-4 na siglo, at sa mga sinaunang saling Coptic. Gayunman, matatagpuan ito sa karamihan ng mga manuskrito ng tradisyong Byzantine, gayundin sa Old Latin, Vulgate, at Syriac. Malamang na idinagdag ito ng mga tagakopya upang iayon sa kahawig na mga pahayag sa Marcos 12:40 at Lucas 20:47. Sa mga manuskritong naglalaman nito, nagkakaiba rin kung inilalagay ito bago o pagkatapos ng talata 13.
    reason: textual_critical
lexical_decisions:
- source_word: Οὐαί
  choice: Kahabag-habag kayo
  rationale: Isang natural at marangal na pahayag ng kapighatian at babala sa Filipino; pinananatili nito ang puwersa ng salitang Griyego nang hindi ito ginagawang simpleng sumpa.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, tumutukoy ito sa mga dalubhasa at tagapagturo ng Kautusan, hindi lamang sa mga tagasulat; mas malinaw ito sa karaniwang modernong mambabasa.
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: nilalamon ninyo ang kabuhayan ng mga biyuda
  rationale: Pinananatili ng “nilalamon” ang matinding metapora, samantalang ipinahihiwatig ng “kabuhayan” ang sambahayan, ari-arian, at yaman ng mga biyuda na walang maling larawan ng literal na pagkain sa kanilang bahay.
- source_word: προφάσει
  choice: bilang pagkukunwari
  rationale: Ipinahahayag ang pakunwaring relihiyosong kilos na nagtatakip sa mapagsamantalang layunin.
- source_word: μακρὰ προσευχόμενοι
  choice: nagdarasal kayo nang mahaba
  rationale: Direkta at natural na salin ng pariralang tumutukoy sa mahahabang panalangin.
- source_word: περισσότερον κρίμα
  choice: mas mabigat na hatol
  rationale: Ang συγκριτικός na περισσότερον ay nagpapahiwatig ng higit na bigat o tindi, at ang κρίμα rito ay isang negatibo at maparusang hatol.
theological_decisions:
- issue: Antas ng hatol
  choice: mas mabigat na hatol
  alternative: higit na kaparusahan
  rationale: Pinananatili ang wika ng hudisyal na pasiya sa κρίμα at ang paghahambing sa περισσότερον, nang hindi dinaragdagan ang teksto ng tiyak na paglalarawan sa uri ng kaparusahan.
- issue: Ugnayan ng pagsasamantala at mahabang panalangin
  choice: at nagdarasal kayo nang mahaba bilang pagkukunwari
  alternative: at bilang dahilan ay nananalangin kayo nang mahaba
  rationale: Ipinakikita na ang mahabang panalangin ay mapagkunwaring pagtatakip, ngunit hindi tinutukoy nang higit sa sinasabi ng teksto kung paano teknikal na isinagawa ang pagsasamantala.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga tagapagturo ng Kautusan” para sa historikal na papel ng γραμματεῖς, “mga biyuda” bilang kasalukuyang karaniwang termino, at “nilalamon” upang mapanatili ang matalim na retorika ng orihinal.
