base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: tl
  text: Kayong mga bulag na tagaakay! Sinasala ninyo ang lamok[a], ngunit nilulunok ninyo ang kamelyo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “niknik.” Ang salitang Griyego ay tumutukoy sa isang napakaliit na insektong gaya ng lamok; ang pandiwa ay naglalarawan ng pagsala sa likido upang maalis ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: mga tagaakay
  rationale: Tumutukoy ito sa mga umaakay o gumagabay sa iba. Pinananatili ng “mga tagaakay” ang metapora ng mga pinunong nagbibigay ng direksiyon.
- source_word: τυφλοί
  choice: mga bulag
  rationale: Tuwirang pinananatili nito ang matinding metaporikong pagsaway sa kanilang kawalan ng espirituwal na pagkaunawa.
- source_word: διϋλίζοντες
  choice: sinasala ninyo
  rationale: Ang pandiwa ay tumutukoy sa pagsala ng likido upang maalis ang isang bagay. Likas sa Tagalog ang “sinasala ninyo” at malinaw nitong inilalarawan ang maingat na pag-aalis sa maliit na insekto.
- source_word: τὸν κώνωπα
  choice: ang lamok
  rationale: Ang κώνωψ ay maliit na insektong gaya ng gnat o lamok. Mas karaniwan at agad nauunawaan ng makabagong mambabasang Tagalog ang “lamok” kaysa “niknik,” habang nananatili ang napakalaking paghahambing sa kamelyo.
- source_word: τὴν δὲ κάμηλον
  choice: ngunit … ang kamelyo
  rationale: Malinaw na ipinahahayag ng “ngunit” ang matinding pagsalungat ng δέ sa pagitan ng napakaliit na lamok at napakalaking kamelyo.
- source_word: καταπίνοντες
  choice: nilulunok ninyo
  rationale: Tuwiran at matingkad ang “nilulunok,” at pinananatili nito ang eksaheradong larawan nang hindi dinaragdagan ng kolokyal na kulay.
theological_decisions:
- issue: Metaporikong bisa ng larawan ng karumihang pansamba
  choice: Panatilihin ang kongkretong larawan ng pagsala sa lamok at paglunok sa kamelyo bilang pagsaway sa baluktot na pagtimbang sa moral na mga bagay.
  alternative: Ipaliwanag ang larawan bilang pagbibigay-pansin sa maliliit na pagkakamali habang pinababayaan ang malalaki.
  rationale: Nakasalalay ang bisa ng talata sa katawa-tawang di-pagkakatimbang ng masusing pag-iwas sa napakaliit habang tinatanggap ang napakalaki. Ang pagpapanatili sa larawan ay mas tapat sa Griyego at hindi nilulutas o pinapaliit ang metaporikong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tahasang panghalip na “ninyo” upang maging natural ang mga participle sa Griyego at mapanatili ang tuwirang pagsaway. Inilagay ang tandang padamdam pagkatapos ng pagtawag at sa wakas upang maipakita ang matinding tono.
