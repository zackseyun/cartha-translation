id: MAT.23.19
reference: Matthew 23:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: tl
  text: 'Mga bulag![a] Sapagkat alin ang mas dakila: ang handog[b], o ang altar na nagpapabanal[c] sa handog?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “Mga hangal at bulag!”'
    reason: textual_variant
  - marker: b
    text: O “kaloob.”
    reason: lexical_alternative
  - marker: c
    text: O “gumagawang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Mga bulag
  rationale: Pangmaramihang pang-uri na ginamit bilang tuwirang tawag. Ang “Mga bulag” ay natural sa Tagalog at hindi idinaragdag ang “mga hangal,” na wala sa piniling teksto ng SBLGNT sa talatang ito.
- source_word: τί γὰρ μεῖζον
  choice: Sapagkat alin ang mas dakila
  rationale: Pinananatili ng “sapagkat” ang paliwanag na diwa ng γάρ, at ng “alin ang mas dakila” ang paghahambing ng μεῖζον nang hindi ito nililimitahan sa kahulugang “mas mahalaga.”
- source_word: τὸ δῶρον
  choice: ang handog
  rationale: Bagaman maaaring mangahulugang “kaloob” ang δῶρον, malinaw na nasa konteksto ito ng altar at pagsamba; kaya ang “handog” ang pinakanatural at tiyak na salita sa modernong Tagalog.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Ang “altar” ang karaniwan, malinaw, at kinikilalang salin sa Tagalog para sa θυσιαστήριον sa kontekstong panrelihiyon.
- source_word: τὸ ἁγιάζον
  choice: na nagpapabanal
  rationale: Ang kasalukuyang pandiwaring ito ay tumutukoy sa altar. Pinananatili ng “nagpapabanal” ang ugnayan sa kabanalan at ang aktibong diwa na ang altar ang nagbibigay ng banal na katayuan sa handog.
theological_decisions:
- issue: Wikang pangkulto ng ἁγιάζω kaugnay ng altar at handog
  choice: ang altar na nagpapabanal sa handog
  alternative: ang altar na ginagawang banal ang handog
  rationale: Ipinahihiwatig ng pangungusap na ang altar ang nagbibigay ng kabanalan sa handog. Pinananatili ng “nagpapabanal” ang bigat ng wikang tungkol sa kabanalan at hindi ito pinapaliit sa isang seremonyal na pagtatalaga lamang.
- issue: Paghahambing ng handog at altar
  choice: mas dakila
  alternative: mas mahalaga
  rationale: Ang “mas dakila” ay mas malapit sa malawak na paghahambing ng μεῖζον. Hindi nito ipinapasya kung ang tinutukoy ay halaga, ranggo, o kapangyarihang magpabanal.
translation_notes:
  register: Makabagong Filipino Tagalog na tuwiran at marangal. Napanatili ang matalim na pagsaway, ang tanong na retorikal, at ang bokabularyo ng kabanalan sa konteksto ng templo.
