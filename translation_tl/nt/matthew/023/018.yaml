    rationale: Maaaring ipahiwatig ng “sa ngalan ng” ang panunumpa sa pangalan ng isang tao o awtoridad. Dito, ang altar at handog mismo ang mga bagay na pinanunumpaan; ang “sa altar/handog” ang mas malapit at idiomatiko.
  - severity: low
    issue: Ang talababa a ay nag-aalok ng “Muli” bilang alternatibo ng καί.
    rationale: Ang καί ay simpleng pang-ugnay na “At” sa daloy ng sipi. Ang “Muli” ay maaaring magdagdag ng diin na wala sa Griyego at hindi kailangang itala bilang alternatibo.
