  source_fidelity: Kailangang palitan ang “sa ngalan ng altar/handog.” Ang ἐν sa idyoma ng panunumpa ay tumutukoy sa bagay na pinanunumpaan (“sa altar”), hindi sa “ngalan” nito. Ang “walang bisa” ay malinaw na naipahahayag na ang naturang panunumpa ay itinuturing na walang halaga, at ang “may pananagutan” ay maingat na pinananatili ang di-tahasang layon ng ὀφείλει.
  naturalness: Mas natural at mas tuwiran sa modernong Filipino Tagalog ang “nanunumpa sa altar” at “nanunumpa sa handog.” Ang inalis na talababa sa “At” ay hindi kailangan; ang “Muli” ay hindi ligtas na leksikal na alternatibo para sa simpleng καί sa talatang ito.
  terminology: Pinanatili ang “altar,” na karaniwan at tumpak sa kontekstong pang-templo, at “handog” para sa δῶρον. Ang “may pananagutan” ay angkop na maikling salin ng ὀφείλει nang hindi idinaragdag ang layon ng obligasyon.
