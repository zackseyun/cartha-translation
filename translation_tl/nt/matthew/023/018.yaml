  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: tl
  text: At, “Ang sinumang manumpa sa altar ay walang bisa[b]; ngunit ang sinumang manumpa sa handog na nasa ibabaw nito ay may pananagutan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ibig sabihin, ayon sa aral na tinutuligsa ni Jesus, ang panunumpa sa altar ay itinuturing na walang bisa, ngunit ang panunumpa sa handog na nasa ibabaw nito ay itinuturing na may bisa.
    reason: Nililinaw ang kasanayan sa panunumpa na ipinahihiwatig ng maikling pahayag na οὐδέν ἐστιν.
lexical_decisions:
- source_word: καί
  choice: At
  rationale: Payak na pang-ugnay na nagpapatuloy sa sunod-sunod na mga aral na sinisipi at tinutuligsa ni Jesus.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Ang sinumang manumpa ... ngunit ang sinumang manumpa
  rationale: Ipinapahayag ng ὅς + ἄν na may aorist subjunctive ang isang pangkalahatan at di-tiyak na kondisyon; likas sa modernong Tagalog ang ‘ang sinumang manumpa.’
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: sa ngalan ng altar
  rationale: Sa pormula ng panunumpa, ang ἐν ay tumutukoy sa pinagbabatayan o tinatawag na saksi ng sumpa. Mas malinaw sa Tagalog ang ‘manumpa sa ngalan ng’ kaysa sa literal na ‘sa altar.’
- source_word: θυσιαστήριον
  choice: altar
  rationale: Karaniwan, tiyak, at madaling maunawaang katawagan sa altar na pinaghahandugan sa konteksto ng templo.
- source_word: οὐδέν ἐστιν
  choice: walang kabuluhan iyon
  rationale: Pinananatili nito ang maikli at idiomatikong pahayag na ang naturang sumpa ay itinuturing na walang bisa o halaga, nang hindi nagdaragdag ng tahasang paliwanag sa pangunahing teksto.
- source_word: ἐν τῷ δώρῳ
  choice: sa ngalan ng handog
  rationale: Sa konteksto ng templo, ang δῶρον ay regalong inihahandog sa Diyos; ‘handog’ ang pinakanatural at kontekstuwal na salin sa Tagalog.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: na nasa ibabaw nito
  rationale: Malinaw na inilalarawan ang posisyon ng handog sa ibabaw ng altar at pinananatili ang reperensiya ng αὐτοῦ.
- source_word: ὀφείλει
  choice: ay may pananagutan
  rationale: Ipinahahayag ang legal at moral na pagkakatali sa sumpa habang iniiwang di-binanggit ang layon ng obligasyon, gaya ng Griyego.
theological_decisions:
- issue: Di-binanggit na layon ng pananagutan sa pormula ng panunumpa
  choice: ay may pananagutan
  alternative: nakatali siya sa kanyang panunumpa / dapat niya itong tuparin
  rationale: Hindi tahasang sinasabi ng Griyegong ὀφείλει kung ano ang dapat gawin. Pinananatili ng salin ang kaiklian at tunay na di-pagkakasabi nito sa halip na idagdag na dapat tuparin ang sumpa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘altar’ bilang pamilyar na terminong panrelihiyon at ‘handog’ para sa templong δῶρον. Ang ‘sa ngalan ng’ ay natural na pormula ng panunumpa at nagpapalinaw sa gamit ng ἐν nang hindi binabago ang kahulugan.
