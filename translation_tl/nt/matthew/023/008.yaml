id: MAT.23.8
reference: Matthew 23:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: tl
  text: Ngunit huwag kayong patawag na “Rabbi,” sapagkat iisa ang inyong guro, at kayong lahat ay magkakapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “magkakapatid” ay salin ng panlalaking pangmaramihang ἀδελφοί; sa kontekstong ito, maaari itong tumukoy nang sama-sama sa mga kapwa alagad.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: huwag kayong patawag
  rationale: Likas na Filipino itong pagbabawal sa pagtanggap o paggamit ng tawag na isang titulo, at pinananatili nito ang pasibong diwa ng Griyego.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang transliteradong titulong nasa tekstong Griyego upang mapanatili ang kontekstong Judio at hindi ito maipaghalo sa διδάσκαλος na kasunod sa talata.
- source_word: εἷς
  choice: iisa
  rationale: Tuwirang ipinahahayag ang singularidad nang hindi dinaragdagan ang Griyego ng mas mariing salitang “tanging.”
- source_word: ὁ διδάσκαλος
  choice: ang inyong guro
  rationale: 'Natural sa Filipino at malinaw na inilalahad ang ugnayang ipinahihiwatig ng ὑμῶν: ang guro ninyo.'
- source_word: πάντες δὲ ὑμεῖς ἀδελφοί ἐστε
  choice: at kayong lahat ay magkakapatid
  rationale: Pinananatili ang diin sa buong pangkat at ang metaporang pampamilya. Ang “magkakapatid” ay natural na kolektibong anyo sa Filipino at hindi sapilitang nililimitahan sa mga lalaking alagad.
theological_decisions:
- issue: Kung lubusang ipinagbabawal ni Jesus ang lahat ng titulong pantao o tinutuligsa niya ang paghahangad ng katayuan sa komunidad ng mga alagad
  choice: Pinanatili ang tuwirang pagbabawal nang hindi ito pinalalawak bilang ganap na tuntunin para sa bawat titulo.
  alternative: Isalin o ipaliwanag ito bilang lubusang pagbabawal sa lahat ng paggamit ng “Rabbi” at mga kahalintulad na titulo, o paliitin bilang pagtuligsa lamang sa mapagpaimbabaw na ambisyon.
  rationale: Tuwiran ang pagbabawal at ang dahilan sa Griyego, ngunit hindi tinutukoy ng mismong talata ang lahat ng magiging aplikasyon nito. Kaya hindi nilulutas sa salin ang nananatiling teolohikal na tensiyon.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang “Rabbi” bilang titulong Judio; hindi na kailangan ng hiwalay na talababa para sa kahulugang “guro” sapagkat malinaw itong ipinapahiwatig ng kasunod na parirala. Ang marker na [a] ay nasa pangunahing teksto.
