id: MAT.23.33
reference: Matthew 23:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: tl
  text: Mga ahas, mga anak ng mga ulupong! Paano kayo makatatakas sa hatol ng Gehenna?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “hatol ng impiyerno.” Griyego: “Gehenna.”'
    reason: Ibinibigay ang pamilyar na salin ng γέεννα habang pinananatili sa pangunahing teksto ang tiyak na katawagan sa Griyego.
lexical_decisions:
- source_word: ὄφεις
  choice: mga ahas
  rationale: Tuwirang panawag at matinding pagsaway; ang “mga ahas” ay natural at malinaw sa modernong Tagalog.
- source_word: γεννήματα
  choice: mga anak
  rationale: Ipinapahayag ang mga ipinanganak o nagmula sa iba. Ang “mga anak” ay payak at malinaw, at pinananatili ang ugnayang ipinahihiwatig ng pangngalan at kasunod na genitive.
- source_word: ἐχιδνῶν
  choice: ng mga ulupong
  rationale: Ang “ulupong” ay tumutukoy sa makamandag na uri ng ahas at pinananatili ang mas matinding larawan kaysa sa pangkalahatang “ahas.”
- source_word: πῶς
  choice: Paano
  rationale: Pinananatili ang anyo at puwersa ng retorikal na tanong nang hindi tahasang nilulutas kung kakayahan o hinaharap na posibilidad ang pangunahing diin.
- source_word: φύγητε
  choice: kayo makatatakas
  rationale: Ang pandiwa ay maaaring mangahulugang tumakas o makatakas. Dito, ang “makatatakas” ay natural kasama ng “sa hatol” at nakatuon sa inaasahang kalalabasan.
- source_word: κρίσεως
  choice: hatol
  rationale: Ang “hatol” ay karaniwang terminong panghukuman at hindi kasing interpretatibong tiyak ng “kaparusahan” o “pagkondena.”
- source_word: γεέννης
  choice: Gehenna
  rationale: Pinananatili ang tiyak na terminong Griyego at ang makasaysayan at eskatolohikal na kaugnayan nito sa tradisyong Judio, sa halip na agad itong ipantay sa lahat ng kahulugan ng “impiyerno.”
theological_decisions:
- issue: Paglalarawan sa γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Ang transliterasyong “Gehenna” ay pinakamalapit sa tiyak na katawagang ginamit sa pinagmulan at hindi nagdaragdag ng mga implikasyong nabuo sa kalaunang paggamit ng “impiyerno.” Inilalagay sa talababa ang pamilyar na alternatibo.
- issue: Ugnayan ng κρίσεως at γεέννης
  choice: hatol ng Gehenna
  alternative: hatol na impiyerno / hatol sa impiyerno
  rationale: Pinananatili ng “hatol ng Gehenna” ang siksik at bahagyang bukas na ugnayang genitive sa Griyego, sa halip na tahasang tukuyin kung ito ay hatol na nagmumula, nauukol, o humahantong sa Gehenna.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinananatili ang matinding pananalita ng orihinal nang hindi gumagamit ng lipas o labis na teknikal na bokabularyo.
