  source_fidelity: Tapat ang salin sa SBLGNT. Naipapahayag ang mapanuyang panawag na ὄφεις γεννήματα ἐχιδνῶν sa “Mga ahas, mga anak ng mga ulupong!” at ang retorikal na tanong na πῶς φύγητε sa “Paano kayo makatatakas.” Ang “hatol ng Gehenna” ay pinananatiling malapit sa κρίσεως τῆς γεέννης at hindi labis na nililinaw ang bukas na genitive na ugnayan.
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “mga anak ng mga ulupong” ay mas tuwiran kaysa sa posibleng “lahi ng mga ulupong,” ngunit angkop ito sa matinding talinghaga at madaling nauunawaan. Ang tono ay matalas at marangal gaya ng orihinal.
