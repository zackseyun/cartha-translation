id: MAT.23.28
reference: Matthew 23:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: tl
  text: 'Gayon din kayo: sa panlabas ay nagmumukha kayong matuwid sa paningin ng mga tao, ngunit sa loob ay punô kayo ng pagkukunwari at paglabag sa kautusan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Gayon din
  rationale: Likas at malinaw nitong iniuugnay ang talata sa naunang paghahambing sa mga pinaputing libingan.
- source_word: ἔξωθεν … ἔσωθεν
  choice: sa panlabas … sa loob
  rationale: Pinananatili ang mariing paghahambing ng nakikitang anyo at panloob na kalagayan sa natural na modernong Tagalog.
- source_word: φαίνεσθε
  choice: nagmumukha kayong
  rationale: Ipinahihiwatig nito ang impresyong ibinibigay sa mga nakakakita, nang hindi sinasabing tunay silang matuwid.
- source_word: τοῖς ἀνθρώποις
  choice: sa paningin ng mga tao
  rationale: Malinaw na ipinapahayag ang datibo ng pagtukoy o pananaw; ang “mga tao” ay pangkalahatan at hindi nakatali sa kasarian.
- source_word: δίκαιοι
  choice: matuwid
  rationale: Karaniwang salitang Tagalog na nagpapanatili sa moral at panrelihiyong diwa ng termino.
- source_word: μεστοὶ
  choice: punô
  rationale: Tuwiran at natural na katumbas ng pagiging lubos na tigib ng mga binanggit na kasamaan.
- source_word: ὑποκρίσεως
  choice: pagkukunwari
  rationale: Malinaw sa ordinaryong mambabasa at angkop sa panlilinlang na moral at panrelihiyon sa konteksto.
- source_word: ἀνομίας
  choice: paglabag sa kautusan
  rationale: Pinananatili ang tiyak na diwa ng pagsalungat o pagsuway sa batas, sa halip na palabuin ito bilang pangkalahatang “kasamaan.”
theological_decisions:
- issue: Kung ang δίκαιοι ay tunay na katayuang moral o anyo lamang sa tingin ng iba
  choice: Anyo lamang ng pagiging matuwid sa paningin ng mga tao
  alternative: Tunay na pagiging matuwid
  rationale: Ang φαίνεσθε at ang kasalungat na pahayag tungkol sa panloob na pagkukunwari at paglabag sa kautusan ay nagpapakitang panlabas na impresyon, hindi tunay na katuwiran, ang tinutukoy.
- issue: Kung gagawing pangkalahatang “kasamaan” ang ἀνομία
  choice: paglabag sa kautusan
  alternative: kasamaan
  rationale: Mas tapat ito sa ugnayan ng ἀνομία sa kautusan, ngunit hindi na dinaragdagan ang talata ng isang tiyak na denominasyonal na paliwanag tungkol sa saklaw ng kautusang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “pagkukunwari” sa halip na mas lumang “pagpapaimbabaw,” at iniwasan ang makalumang “katampalasanan.” Walang talababa dahil hindi kailangan sa Tagalog ang alternatibong “men”; pangkalahatan na ang “mga tao.”
