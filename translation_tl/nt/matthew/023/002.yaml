  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: tl
  text: na nagsasabi, “Nakaupo[a] sa upuan ni Moises ang mga eskriba at ang mga Pariseo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “umupo sa upuan ni Moises,” o, “iniluklok nila ang kanilang sarili sa upuan ni Moises.” Maaaring unawain ang pandiwang Griyego bilang neutral na pag-upo o bilang paghawak sa isang posisyong may awtoridad.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Pinananatili ang anyong pandiwaring nag-uugnay sa talatang ito sa naunang pahayag, sa halip na gawin itong hiwalay na pangungusap.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: sa upuan ni Moises
  rationale: Pinananatili ang talinghaga ng upuang kumakatawan sa kinikilalang tungkulin at awtoridad sa pagtuturo na kaugnay ni Moises.
- source_word: ἐκάθισαν
  choice: nakaupo
  rationale: Natural itong naglalarawan sa paghawak nila sa posisyong tinutukoy, ngunit hindi nito lubusang inaalis ang posibilidad na ang Griyego ay tumutukoy sa pag-upo o pagluklok nila roon.
- source_word: οἱ γραμματεῖς
  choice: ang mga eskriba
  rationale: Tuwirang katawagan ito sa kinikilalang pangkat ng mga dalubhasa at tagapagturo ng Kautusan; pinananatili nito ang makasaysayang titulo nang hindi pinalalawak ang kahulugan.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwang salin sa Filipino ng pangalan ng pangkat na Φαρισαῖοι.
theological_decisions:
- issue: Kung ang ἐκάθισαν ay neutral na paglalarawan lamang ng pag-upo o nagpapahiwatig ng pag-angkin o paghawak sa isang posisyong may awtoridad
  choice: nakaupo
  alternative: umupo; iniluklok ang kanilang sarili
  rationale: Ang “nakaupo” ay natural sa Filipino at naglalarawan sa kanilang kalagayan bilang humahawak sa posisyong sinasagisag ng upuan ni Moises. Hindi nito tahasang ipinapahayag kung ang awtoridad ay pormal na ipinagkaloob o inangkin lamang, kaya napapanatili ang tensiyon ng teksto.
translation_notes:
  register: Makabago at malinaw ang pangungusap, ngunit pinananatili ang dignidad at ang talinghaga ng “upuan ni Moises.” Ginamit ang “eskriba” bilang makasaysayang katawagan; ang ayos na panaguri muna ay natural sa Filipino at nagbibigay-diin sa posisyong kanilang hinahawakan.
