  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: tl
  text: “Sa aba ninyo, mga eskriba at mga Pariseo, mga mapagkunwari[b], sapagkat itinatayo ninyo ang mga libingan ng mga propeta at ginagayakan ang mga bantayog[a] ng mga matuwid,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alaalang-libingan.” Ang salitang Griyego ay maaaring tumukoy sa isang bantayog na pang-alaala o sa isang libingan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring bantasang: “mga mapagkunwari! Sapagkat itinatayo ninyo…”'
    reason: punctuation_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Sa aba ninyo
  rationale: Likas na ekspresyong Filipino para sa isang mariing pahayag ng paghatol; pinananatili nito ang puwersang propetiko ng Griyego, hindi lamang ang damdamin ng pagkahabag.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Pinananatili ang makasaysayang katawagan sa mga dalubhasa at tagapagturo ng Kautusan nang hindi ginagawang bahagi ng mismong salin ang isang paliwanag sa kanilang tungkulin.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwan at kinikilalang anyong Filipino ng pangalan ng pangkat.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Natural na salitang Filipino para sa mga taong nagpapanggap na may kabanalan o kabutihang hindi tugma sa kanilang tunay na pagkatao.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi o batayan ng pahayag na “Sa aba ninyo,” habang pinananatili ang marangal na himig.
- source_word: οἰκοδομεῖτε
  choice: itinatayo ninyo
  rationale: Tuwirang inilalarawan ang pagtatayo ng mga libingan; hindi ipinapalagay na muling itinatayo ang mga ito.
- source_word: τάφους
  choice: mga libingan
  rationale: Angkop sa mga itinayong lugar na pinaglibingan at malinaw na katumbas sa karaniwang Filipino.
- source_word: κοσμεῖτε
  choice: ginagayakan
  rationale: Ipinahahayag ang paglalagay ng palamuti o pagpapaganda, na siyang diwa ng pandiwang Griyego.
- source_word: μνημεῖα
  choice: mga bantayog
  rationale: Pinananatili ang commemorative na diwa at naihihiwalay sa τάφους, “mga libingan,” bagaman maaaring tumukoy rin ang salitang Griyego sa mga alaalang-libingan.
- source_word: δικαίων
  choice: mga matuwid
  rationale: Tuwirang substantival na salin na tumutukoy sa mga taong matuwid, nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
theological_decisions:
- issue: Kahulugan ng δικαίων sa kontekstong ito
  choice: mga matuwid
  alternative: mga taong matuwid; mga makatarungan
  rationale: Tinutukoy rito ang mga tapat at matuwid na tao ng nakaraan. Ang “mga matuwid” ay maikli, natural sa wikang biblikal na Filipino, at hindi ipinapasok ang isang mas makitid na doktrinal na pakahulugan.
- issue: Puwersa ng Οὐαί
  choice: Sa aba ninyo
  alternative: Kahabag-habag kayo; Kawawa kayo
  rationale: Ang konteksto ay pangunahing paghatol at pagsaway, hindi simpleng awa o pagdadalamhati; kaya pinananatili ang mariing propetikong puwersa.
translation_notes:
  register: Modernong Filipino na may marangal at mariing himig. Ginamit ang nakaugaliang “Sa aba ninyo” upang mapanatili ang propetikong pagsaway. Ang “mga eskriba” ay pinanatiling makasaysayang katawagan, samantalang ang natitirang pangungusap ay gumagamit ng malinaw at kasalukuyang bokabularyo.
