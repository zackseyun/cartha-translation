base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: tl
  text: Ngunit ang sinumang nagmamataas ay ibababa, at ang sinumang nagpapakumbaba ay itataas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang sinumang nagtataas sa sarili ay ibababa, at ang sinumang nagpapababa sa sarili ay itataas.”'
    reason: Ipinakikita ang mas tahasang alternatibong salin ng magkapares na pandiwa, habang pinananatili ang di-tahasang gumagawa ng mga pandiwang balintiyak at ang paralelismo ng Griyego.
lexical_decisions:
- source_word: ὅστις
  choice: ang sinumang
  rationale: Ipinahahayag nito ang pangkalahatan at mapagkasabihang diwa ng di-tiyak na panghalip na Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang banayad na pagsalungat sa naunang konteksto.
- source_word: ὑψώσει ἑαυτὸν
  choice: nagmamataas
  rationale: Natural itong salin ng idyomang tumutukoy sa pagtataas ng isang tao sa sarili niyang katayuan o karangalan; taglay na ng pandiwa sa Filipino ang mapanumbalik na diwa.
- source_word: ταπεινωθήσεται
  choice: ay ibababa
  rationale: Pinananatili nito ang anyong balintiyak at ang larawang kabaligtaran ng pagtataas, nang hindi tahasang pinapangalanan ang gumagawa.
- source_word: ταπεινώσει ἑαυτὸν
  choice: nagpapakumbaba
  rationale: Ito ang natural at malinaw na Filipino para sa kusang pagpapababa ng sarili.
- source_word: ὑψωθήσεται
  choice: ay itataas
  rationale: Pinananatili nito ang anyong balintiyak, ang hinaharap na bunga, at ang leksikal na pagtutumbas sa unang sugnay.
theological_decisions:
- issue: Ang gumagawa sa mga pandiwang balintiyak
  choice: 'Hindi pinangalanan ang gumagawa: “ibababa” at “itataas.”'
  alternative: Tahasang gawing Diyos ang simuno, gaya ng “ibababa/itataas siya ng Diyos.”
  rationale: Balintiyak ang mga pandiwa sa Griyego at walang tahasang tinukoy na gumagawa. Pinananatili ng salin ang pagkakabukas ng pahayag habang maaaring manatiling ipinahihiwatig ang pagkilos ng Diyos.
- issue: Pangkalahatang saklaw ng panlalaking isahan sa Griyego
  choice: Gamitin ang likas na walang-kasariang “ang sinumang” sa Filipino.
  alternative: Magdagdag ng panlalaking panghalip na wala namang kinakailangan sa gramatika ng Filipino.
  rationale: Bagaman panlalaking isahan ang anyo sa Griyego, pangkalahatan ang tinutukoy nito. Naipahahayag iyon nang tumpak ng “ang sinumang” nang walang hindi likas na pagdaragdag ng kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na magkatambal na “nagmamataas” at “nagpapakumbaba,” habang pinanatili sa “ibababa” at “itataas” ang balanseng balangkas at ang di-tahasang gumagawa ng mga pandiwang balintiyak.
