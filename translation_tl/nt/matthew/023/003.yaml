review_pass:
  verdict: revise
  source_fidelity: Tumpak ang saklaw ng “lahat,” ang inferensiyang “Kaya,” at ang di-tahasang layon ng “sabihin nila sa inyo.” Gayunman, ang “nagsasabi sila ngunit hindi ginagawa” ay hindi ganap na idiomatiko sa Filipino dahil karaniwang kailangan ng pandiwang “ginagawa” ang malinaw o nakapahiwatig na tagaganap; dapat itong “hindi nila ginagawa.” Ang pangunahing salin ng κατά τὰ ἔργα αὐτῶν ay maaari ring gawing mas natural nang hindi lumalampas sa diwa ng pagsunod sa kanilang huwaran.
  naturalness: Ang “huwag kayong gumawa ayon sa kanilang mga gawa” ay nauunawaan ngunit mabigat at hindi likas sa makabagong Filipino. Mas natural ang “huwag ninyong tularan ang kanilang mga gawa.” Pinananatili nito ang “mga gawa” at ang diwa ng pagkilos ayon sa kanilang ginagawa.
  terminology: Ang “sundin” para sa τηρεῖτε ay katanggap-tanggap sa rehistrong ito. Ang “mga gawa” ay angkop para sa ἔργα. Ang “tularan” ay wastong pagpapahayag ng pagbabawal na umayon sa kanilang mga gawa; ang mas literal na ayos ay ilalagay sa talababa.
  issues:
  - severity: medium
    issue: Hindi likas ang “nagsasabi sila ngunit hindi ginagawa.”
    rationale: Sa Filipino, ang “ginagawa” sa ganitong gamit ay nangangailangan ng tagaganap na malinaw na tinutukoy. Ang “ngunit hindi nila ginagawa” ay natural at pinananatili ang siksik na paghahambing ng Griyego.
  - severity: low
    issue: Mabigat ang “huwag kayong gumawa ayon sa kanilang mga gawa.”
    rationale: Bagaman malapit sa estruktura ng Griyego, hindi ito ang karaniwang paraan ng pagpapahayag sa modernong Filipino. Ang “huwag ninyong tularan ang kanilang mga gawa” ay malinaw na naghahatid ng κατά bilang pagsunod sa huwaran, habang pinananatili ang ἔργα bilang “mga gawa.”}],
