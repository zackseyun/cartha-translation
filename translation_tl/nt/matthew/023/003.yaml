base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: tl
  text: Kaya, gawin ninyo at sundin ang lahat ng sabihin nila sa inyo. Ngunit huwag ninyong tularan ang kanilang mga gawa[a], sapagkat nagsasabi sila ngunit hindi nila ginagawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwag kayong gumawa ayon sa kanilang mga gawa.”
    reason: Mas literal na pagpapahayag ng “huwag ninyong tularan ang kanilang mga gawa,” na pinananatili ang ayos na “gumawa ayon sa” para sa κατά at ang pangngalang “mga gawa” para sa ἔργα.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Kaya ... ang lahat ng
  rationale: Ang οὖν ay naghahayag ng konklusyon mula sa naunang pahayag, kaya isinalin itong “Kaya.” Ang πάντα ὅσα ἐὰν ay isang malawak at sumasaklaw na parirala, kaya ang natural na katumbas ay “ang lahat ng.”
- source_word: εἴπωσιν ὑμῖν
  choice: sabihin nila sa inyo
  rationale: Tuwirang ipinahahayag nito ang pagsasalitang nakatuon sa mga tagapakinig nang hindi dinaragdagan ang diwang “ituro” o ang sanggunian sa upuan ni Moises mula sa naunang talata.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: gawin ninyo at sundin
  rationale: Pinananatili ng “gawin” ang karaniwang diwa ng ποιέω, samantalang ipinahahayag ng “sundin” ang patuloy na pagtalima o pagtupad na saklaw ng τηρέω. Natural ito sa Filipino at hindi ganap na pinag-iisa ang dalawang pandiwa.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: Ngunit huwag kayong gumawa ayon sa kanilang mga gawa
  rationale: Ang κατά na may akusatibo ay nagpapahayag ng pamantayan o pagsunod sa isang huwaran. Pinananatili ng “mga gawa” ang pangngalang ἔργα, at ng “gumawa” ang pag-uulit ng ποιέω, kahit bahagyang pormal ang ayos sa Filipino.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: sapagkat nagsasabi sila ngunit hindi ginagawa
  rationale: Pinananatili ang maikli at matalim na pagsalungat ng λέγουσιν at ποιοῦσιν, pati ang pag-uulit ng pandiwang tumutukoy sa paggawa, nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
theological_decisions:
- issue: Kung dapat bang tahasang tukuyin sa talata ang awtoridad sa pagtuturo ng mga eskriba at mga Pariseo mula sa naunang konteksto
  choice: Panatilihing di-tahasan ang layon at isalin lamang ang sinasabi ng talata 3.
  alternative: “ang lahat ng ituro nila sa inyo” o “ang lahat ng sabihin nila sa inyo mula sa upuan ni Moises”
  rationale: Tinutukoy ng agarang konteksto kung sino ang “nila,” ngunit hindi inuulit ng talatang ito ang mga detalyeng iyon. Iniiwasan nitong ipasok sa salin ang paliwanag na mula sa naunang talata.
- issue: Kung dapat bang pakinisin ang pag-uulit ng mga pandiwa ng paggawa
  choice: Panatilihin hangga't maaari ang “gawin ... gumawa ... ginagawa.”
  alternative: Gumamit ng iba-ibang pandiwa gaya ng “isagawa ... tularan ... isabuhay.”
  rationale: Ang pag-uulit ng ποιέω sa Griyego ay retorikal na naglalantad sa agwat ng sinasabi at ginagawa. Mahalaga ang alingawngaw na ito sa diwa ng talata.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Bahagyang pormal ang “gumawa ayon sa kanilang mga gawa” upang mapanatili ang estruktura, bokabularyo, at retorikal na pag-uulit ng Griyego; ibinigay sa talababa ang mas karaniwang paraan ng pagsasabi.
