  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: tl
  text: 'Mga hangal at bulag! Sapagkat alin ang mas dakila: ang ginto, o ang templo[b] na ginawang banal ang ginto[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nagpabanal sa ginto.”
    reason: lexical_alternative
  - marker: b
    text: Ang Griyegong ναός ay maaaring mas tiyak na tumukoy sa santuwaryo, ang banal na gusali sa loob ng templo.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: mga hangal
  rationale: Tuwirang tawag na maramihan at matinding saway; natural at marangal sa makabagong Filipino nang hindi nagiging salitang-balbal.
- source_word: τυφλοί
  choice: bulag
  rationale: Pinananatili ang ikalawang tuwirang bansag at ang metaporikal na diin ng Griyego; hindi na kailangang idagdag ang “mga tao” sa Filipino.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Alin nga ba ang mas dakila
  rationale: Ang τίς ay pagpili sa dalawang tahasang binanggit; ipinahihiwatig ng “nga ba” ang paliwanag at hamon ng γάρ sa natural na Filipino.
- source_word: ὁ χρυσὸς
  choice: ang ginto
  rationale: Tumutukoy sa tiyak na gintong pinag-uusapan sa naunang konteksto.
- source_word: ὁ ναὸς
  choice: ang templo
  rationale: Malinaw at karaniwang katawagan sa Filipino; nililinaw sa talababa na ang ναός ay maaaring mas tiyak na tumukoy sa santuwaryo ng templo.
- source_word: ὁ ἁγιάσας
  choice: na nagpabanal
  rationale: Pinananatili ang aktibong anyo at ang aspektong aorist ng participle, pati ang panrelihiyon at kultikong diwa ng ἁγιάζω.
- source_word: τὸν χρυσόν
  choice: sa ginto
  rationale: Inuulit ang “ginto” gaya ng Griyego upang mapanatili ang retorikal na paghahambing.
theological_decisions:
- issue: Paglalarawan sa ἁγιάζω sa konteksto ng templo
  choice: nagpabanal
  alternative: ginawang banal
  rationale: Ang “nagpabanal” ay maikli at nagpapanatili sa kultiko at teolohikal na diwa na ang templo ang nagkakaloob ng banal na katayuan sa ginto, nang hindi ipinapaliwanag nang higit sa teksto.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang tandang padamdam upang likas na maipahayag ang matinding tuwirang saway, at pinanatili ang estruktura ng retorikal na tanong.
