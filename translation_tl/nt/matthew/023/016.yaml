  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: tl
  text: “Sa aba ninyo, mga bulag na gabay, na nagsasabi, ‘Kung ang sinuman ay manumpa sa templo[a], walang bisa iyon[b]; ngunit kung manumpa siya sa ginto ng templo, may pananagutan siya.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “manumpa sa loob ng templo.” Sa pormula ng panunumpa sa kontekstong ito, ang templo ang ginagamit na batayan o saksi ng sumpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego: “wala iyon.” Ipinahihiwatig nito na ang gayong sumpa ay itinuturing na hindi nagbubuklod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Sa aba ninyo
  rationale: Likas at marangal na pormulang Filipino para sa propetikong babala at paghatol; pinananatili nito ang tindi ng Οὐαί nang hindi ito ginagawang simpleng pagpapahayag ng awa.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: mga bulag na gabay
  rationale: Tuwirang pinananatili ang metapora ng mga taong gumagabay sa iba ngunit sila mismo ay bulag.
- source_word: οἱ λέγοντες
  choice: Sinasabi ninyo
  rationale: Natural na Filipino para sa articular participle at malinaw na ipinagpapatuloy ang tuwirang pagtukoy sa kausap.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Ang sinumang manumpa
  rationale: Maayos na ipinapahayag ang pangkalahatang di-tiyak na kondisyon ng relative clause na may ἄν at subjunctive.
- source_word: ἐν τῷ ναῷ
  choice: sa templo
  rationale: Sa konteksto ng panunumpa, tumutukoy ito sa templong ginagamit na batayan o saksi ng sumpa. Pinanatiling maikli ang pormula at nilinaw sa talababa ang mas literal na anyo.
- source_word: οὐδέν ἐστιν
  choice: wala lamang iyon
  rationale: Pinananatili ang maikli at eliptikong anyo ng Griyego nang hindi tahasang pinapalitan ng mas interpretibong ‘walang bisa.’
- source_word: χρυσῷ τοῦ ναοῦ
  choice: ginto ng templo
  rationale: Tuwirang pinananatili ang kaibahan ng templo mismo at ng gintong kaugnay nito.
- source_word: ὀφείλει
  choice: may pananagutan
  rationale: Inihahatid ang diwang may obligasyon o pagkakautang sa konteksto ng sumpa, habang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
theological_decisions:
- issue: Eliptikong pananalita tungkol sa bisa ng sumpa
  choice: Pinanatiling eliptiko ang unang pahayag bilang ‘wala lamang iyon,’ at isinalin ang ὀφείλει bilang ‘may pananagutan.’
  alternative: Isalin nang mas interpretibo bilang ‘hindi iyon umiiral’ o ‘hindi siya nakatali sa sumpa,’ at ‘dapat niyang tuparin ang sumpa.’
  rationale: Tinutuligsa ng talata ang mapiling pagkilala sa kung aling mga sumpa ang may bisa. Hindi tahasang binabanggit ng Griyego ang ‘bisa’ o ang dapat tuparin, kaya hindi iyon idinagdag sa pangunahing teksto; ipinaliliwanag lamang sa talababa ang ipinahihiwatig ng unang parirala.
translation_notes:
  register: Modernong Filipino na may marangal at matinding himig. Ginamit ang pamilyar na propetikong pormulang “Sa aba ninyo” at iniwasan ang labis na teknikal o denominasyonal na pananalita.
