  naturalness: Ang “Sa aba ninyo” at “mga bulag na gabay” ay angkop sa marangal at mapanuyang propetikong rehistro. Ang binagong ayos na “na nagsasabi” at ang magkatambal na mga sugnay na may “kung” ay mas natural at malinaw sa modernong Filipino Tagalog.
  terminology: Ang “templo,” “ginto ng templo,” at “pananagutan” ay angkop. Ang “walang bisa” ay isang kinakailangang idiomatikong paglalahad ng οὐδέν ἐστιν sa usaping panunumpa; ang talababa ay nag-iingat sa literal na anyo at sa elipsis ng pinagmulan.
