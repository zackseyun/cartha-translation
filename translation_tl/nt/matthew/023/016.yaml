- from: “Sa aba ninyo, mga bulag na gabay! Sinasabi ninyo, ‘Ang sinumang manumpa sa templo[a] ay wala lamang iyon[b]; ngunit ang sinumang manumpa sa ginto ng templo ay may pananagutan.’”
  to: “Sa aba ninyo, mga bulag na gabay, na nagsasabi, ‘Kung ang sinuman ay manumpa sa templo[a], walang bisa iyon[b]; ngunit kung manumpa siya sa ginto ng templo, may pananagutan siya.’”
  rationale: Inayos ang malabong elipsis sa pangunahing teksto upang maging idiomatiko at malinaw ang Tagalog, nang walang pagdaragdag ng denominasyonal na pagbasa. Pinanatili ng talababa ang literal na “wala iyon” at ipinaliwanag lamang ang ipinahihiwatig ng konteksto. Inayos din ang ugnayan ng “mga bulag na gabay” at “na nagsasabi.”
