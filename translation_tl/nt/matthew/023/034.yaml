  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: tl
  text: Kaya, tingnan ninyo, nagsusugo ako sa inyo ng mga propeta, mga marurunong, at mga tagapagturo ng Kautusan. Ang ilan sa kanila ay papatayin ninyo at ipapako sa krus; ang iba naman ay hahagupitin ninyo sa inyong mga sinagoga at pag-uusigin ninyo mula sa isang lungsod tungo sa iba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Likas at malinaw na nagpapahayag ng bunga o konklusyon mula sa naunang pahayag.
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Pinananatili ang pantawag-pansin ng Griyego sa paraang nauunawaan sa modernong Tagalog.
- source_word: ἀποστέλλω
  choice: nagsusugo ako
  rationale: Ang anyong pangkasalukuyan ay nagpapanatili sa tuwirang pahayag ni Jesus at sa diwa ng awtoritatibong pagpapadala.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, hindi lamang mga tagakopya ang γραμματεῖς kundi mga dalubhasa at guro ng Kautusan; mas malinaw ito kaysa literal na 'mga eskriba' para sa karaniwang mambabasa.
- source_word: μαστιγώσετε
  choice: hahagupitin ninyo
  rationale: Tumpak na inilalarawan ang pagpaparusa sa pamamagitan ng latigo nang hindi ginagawang mas teknikal kaysa sa pinagmulan.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: pag-uusigin sa bawat bayang puntahan nila
  rationale: Natural na Tagalog na naghahatid ng patuloy na pagtugis mula sa isang lungsod patungo sa iba.
theological_decisions:
- issue: Ang nagsasalita ang mismong nagsusugo ng mga propeta, marurunong, at mga tagapagturo ng Kautusan
  choice: Pinanatili ang tahasang 'nagsusugo ako'
  alternative: Gawing di-tuwiran o tukuying ang Diyos ang nagsusugo
  rationale: Ang Griyego ay malinaw na ἐγὼ ἀποστέλλω; hindi dapat pahinain o ipaliwanag nang lampas sa teksto ang teolohikal na bigat ng pahayag ni Jesus.
- issue: Saklaw ng mga papatayin at ipapako sa krus
  choice: Ang ilan sa kanila ay papatayin ninyo at ipapako sa krus
  alternative: Hatiin sa magkahiwalay na pangkat ang mga papatayin at ang mga ipapako sa krus
  rationale: Ang ἐξ αὐτῶν ay sumasaklaw sa pangkat, habang parehong pandiwa ang sumusunod; pinananatili ng salin ang anyo at hindi nagtatakda kung iisa o magkahiwalay na mga tao ang tinutukoy ng bawat gawain.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'Kautusan' na may malaking titik bilang pagtukoy sa Kautusan sa kontekstong Judio. Ang 'sinagoga' ay pinanatili bilang karaniwang terminong pangkasaysayan at panrelihiyon.
