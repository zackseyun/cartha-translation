review_pass:
  verdict: revise
  source_fidelity: 'Ang salin ay wastong naghahatid ng pangunahing pahayag: si Jesus ang nagsusugo ng mga propeta, marurunong, at mga eskriba/tagapagturo ng Kautusan; may ilan na papatayin at ipapako sa krus, at may ilan na hahagupitin at uusigin. Gayunman, ang “sa bawat bayang puntahan nila” ay hindi sapat na katumbas ng διώξετε ἀπὸ πόλεως εἰς πόλιν. Inililipat nito ang diin sa mga bayang pinupuntahan ng mga biktima at nawawala ang tuwirang kilos ng “uusigin ninyo ... mula sa isang lungsod tungo sa iba.”'
  naturalness: Natural at marangal ang kabuuang register. Mas malinaw at mas malapit sa Griyego ang pag-uulit ng “ninyo” sa huling pandiwa, dahil kayo ang paksa ng parehong paghagupit at pag-uusig.
  terminology: Ang “mga tagapagturo ng Kautusan” ay isang katanggap-tanggap na nagpapaliwanag na salin ng γραμματεῖς sa kontekstong Judio, bagaman mas malapit sa anyo ng pinagmulan ang “mga eskriba.” Ang “Kautusan,” “sinagoga,” “ipapako sa krus,” at “hahagupitin” ay angkop na mga termino.
  issues:
  - severity: medium
    issue: Ang huling parirala ay hindi tuwirang isinasalin ang “persecute from city to city.”
    rationale: Ang “pag-uusigin sa bawat bayang puntahan nila” ay maaaring mangahulugang uusigin sila sa bawat lungsod na kanilang pinupuntahan, samantalang ang Griyego ay naglalarawan ng pag-uusig sa kanila mula sa isang lungsod tungo sa iba. Dapat ding manatiling malinaw na “ninyo” ang gumagawa ng pag-uusig.
  revised_text: Kaya, tingnan ninyo, nagsusugo ako sa inyo ng mga propeta, mga marurunong, at mga tagapagturo ng Kautusan. Ang ilan sa kanila ay papatayin ninyo at ipapako sa krus; ang iba naman ay hahagupitin ninyo sa inyong mga sinagoga at pag-uusigin ninyo mula sa isang lungsod tungo sa iba.
