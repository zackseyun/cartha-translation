  to: Kaya, tingnan ninyo, nagsusugo ako sa inyo ng mga propeta, mga marurunong, at mga tagapagturo ng Kautusan. Ang ilan sa kanila ay papatayin ninyo at ipapako sa krus; ang iba naman ay hahagupitin ninyo sa inyong mga sinagoga at pag-uusigin ninyo mula sa isang lungsod tungo sa iba.
