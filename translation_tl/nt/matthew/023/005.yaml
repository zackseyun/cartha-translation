  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: tl
  text: Ngunit ginagawa nila ang lahat ng kanilang mga gawa upang makita ng mga tao. Sapagkat pinalalapad nila ang kanilang mga pilakterya[a] at pinalalaki ang mga palawit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pilakterya ay maliliit na sisidlang katad na may mga sipi mula sa Kasulatan at isinusuot ng ilang Judio bilang pagsunod sa mga utos na gaya ng Deuteronomio 6:8.
    reason: cultural_note
  - marker: b
    text: O “mga palawit sa laylayan.” Ihambing ang Bilang 15:38–39 tungkol sa mga palawit na isinusuot sa mga damit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: ang lahat ng kanilang ginagawa
  rationale: Likas sa makabagong Tagalog at malinaw na ipinahahayag ang kabuuan ng kanilang mga gawa, kahit pandiwang parirala ang ginamit sa halip na mas mabigat na “lahat ng kanilang mga gawa.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang pahayag at angkop sa marangal ngunit pangkaraniwang rehistro.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι
  choice: ay ginagawa nila upang makita
  rationale: Pinananatili ng “upang” ang malinaw na diwa ng layunin sa Griyegong konstruksiyon.
- source_word: τοῖς ἀνθρώποις
  choice: ng mga tao
  rationale: Tumutukoy sa mga taong nakakakita sa pangkalahatan at hindi lamang sa kalalakihan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala ang paliwanag o batayan ng naunang paratang.
- source_word: πλατύνουσι
  choice: pinalalapad
  rationale: Tuwirang inilalarawan ang pagpapalapad sa mga sisidlang isinusuot.
- source_word: φυλακτήρια
  choice: mga pilakterya
  rationale: Ginamit ang tiyak na katawagang hango sa terminong Griyego, kalakip ang paliwanag sa talababa, upang hindi mapalitan ng katawagang maaaring magbigay ng maling impresyon tungkol sa gamit ng mga ito.
- source_word: μεγαλύνουσι
  choice: pinalalaki
  rationale: Pinananatili ang pangkalahatang diwang “ginagawang malaki” nang hindi ipinapalagay na haba lamang ang tinutukoy.
- source_word: κράσπεδα
  choice: mga palawit
  rationale: Malinaw na tumutukoy sa nakabitin na mga hibla sa damit; ipinaliliwanag sa talababa ang kontekstong mula sa Kautusan.
theological_decisions:
- issue: Paglalarawan sa mga gamit ng kaugaliang panrelihiyon ng mga Judio nang hindi nagdaragdag ng mapanirang pahiwatig
  choice: Panatilihin ang “mga pilakterya” sa teksto at ipaliwanag ito sa talababa; isalin ang κράσπεδα bilang “mga palawit.”
  alternative: Gamitin ang “mga kahon ng panalangin” at “mga palawit sa laylayan.”
  rationale: Ang pinupuna sa talata ay ang pagpapakitang-tao at pagpapalaki sa mga ito, hindi ang mismong pagsunod sa kaugaliang nakaugat sa Kasulatan. Iniiwasan din ng “pilakterya” ang pag-aakalang ang mga sisidlan ay para lamang sa panalangin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang bahagyang pag-uulit sa “ang lahat ng kanilang ginagawa ay ginagawa nila” ay sadyang pinanatili upang maipahayag kapwa ang kabuuan ng kanilang mga gawa at ang layunin ng paggawa sa mga iyon. Ang mga teknikal na bagay sa kulturang Judio ay nilinaw sa mga talababa.
