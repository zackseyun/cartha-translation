id: MAT.23.27
reference: Matthew 23:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: tl
  text: Sa aba ninyo, mga eskriba at mga Pariseo, mga mapagkunwari! Sapagkat tulad kayo ng mga libingang pinaputi ng apog[a], na sa labas ay mukhang maganda, ngunit sa loob ay punô ng mga buto ng mga patay at ng lahat ng uri ng karumihan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga libingang pinahiran ng apog” o “mga nitso na pinaputi ng apog.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring saklawin ng “karumihan” dito kapuwa ang rituwal na pagkadungis at ang kabulukang moral.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Sa aba ninyo
  rationale: Likas at mariing pahayag sa Filipino para sa propetikong babala at paghatol; pinananatili nito ang lakas ng pagtuligsa, hindi lamang pagdadalamhati.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Tumpak at nakaugaliang katawagan sa uring ito ng mga dalubhasa sa Kasulatan at Kautusan; iniiwasang gawing mas interpretibo ang salin.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Malinaw at natural na inilalarawan ang pagkukunwaring panrelihiyon at moral na tinutuligsa ni Jesus.
- source_word: παρομοιάζετε
  choice: tulad kayo ng
  rationale: Direkta at natural na pagpapahayag ng paghahambing sa Filipino.
- source_word: τάφοις κεκονιαμένοις
  choice: mga libingang pinaputi ng apog
  rationale: Pinananatili ang kongkretong larawan ng mga pook-libing na pinahiran o pinaputi sa pamamagitan ng apog.
- source_word: ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ
  choice: maganda ang anyo sa labas, ngunit sa loob
  rationale: Pinananatili ang matinding pagsalungat ng panlabas na anyo at panloob na kalagayan, sa natural na ayos ng Filipino.
- source_word: γέμουσιν ὀστέων νεκρῶν
  choice: punô ng mga buto ng mga patay
  rationale: Malinaw at malapit sa anyo at diwa ng Griyego nang hindi lumilikha ng malabong pariralang 'mga patay na buto.'
- source_word: πάσης ἀκαθαρσίας
  choice: lahat ng uri ng karumihan
  rationale: Malawak ang saklaw at hindi nililimitahan ang salita sa rituwal na karumihan o sa moral na kasamaan lamang.
theological_decisions:
- issue: Saklaw ng ἀκαθαρσία sa talinghaga
  choice: karumihan
  alternative: rituwal na karumihan; moral na kasamaan
  rationale: Ang larawan ng libingan ay nagpapahiwatig ng rituwal na pagkadungis, samantalang ang pagtuligsa ni Jesus ay tumutukoy rin sa panloob na kabulukang moral. Pinananatili ng 'karumihan' ang dalawang posibleng kaugnayan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pamilyar na biblikal na katawagang “eskriba” at ang likas na pahayag na “Sa aba ninyo.” Ang mga talababa ay inilagay kaagad sa mga salitang talagang tinutukoy ng mga ito.
