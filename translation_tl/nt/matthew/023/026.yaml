  terminology: Ang “Pariseo,” “linisin,” “loob,” “labas,” at “pinggan” ay angkop. Inayos ang leksikal na talababa upang tumugma sa saklaw ng παροψίς bilang pinggan/plato, mangkok, o bandehado para sa pagkain.
