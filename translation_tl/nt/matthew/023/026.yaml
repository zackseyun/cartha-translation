  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: tl
  text: Bulag na Pariseo, linisin mo muna ang loob ng tasa at ng pinggan[a], upang maging malinis din ang labas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plato,” “mangkok,” o “bandehado” ang παροψίς, isang sisidlang paghahainan ng pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Bulag na Pariseo
  rationale: Pinananatili ang tuwirang panawag at ang matalas na metapora ng espirituwal na pagkabulag, nang walang idinagdag na pagpapaliwanag.
- source_word: καθάρισον πρῶτον
  choice: linisin mo muna
  rationale: Ang pautos na “linisin mo” ay natural at tuwiran; malinaw na ipinahihiwatig ng “muna” ang lohikal at sunud-sunod na priyoridad ng πρῶτον.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: ang loob ng kopa
  rationale: Ang “loob” ay likas na katumbas ng substantivized na ἐντός, at ang “kopa” ay karaniwang katawagan sa sisidlang inuman sa kontekstong biblikal.
- source_word: καὶ τῆς παροψίδος
  choice: at ng pinggan
  rationale: Ang παροψίς ay sisidlang paghahainan ng pagkain; malawak at madaling maunawaan ang “pinggan,” habang inilalahad sa talababa ang iba pang posibleng anyo.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: upang maging malinis din ang labas nito
  rationale: Pinananatili ng “upang” ang layunin o kinalabasan ng ἵνα, ng “maging” ang resultative na diwa ng γένηται, at ng “din” ang adverbial na καί.
theological_decisions:
- issue: Konkretong larawan ng mga sisidlan laban sa tahasang moral na pagpapakahulugan
  choice: Panatilihin ang literal na larawan ng paglilinis sa loob at labas ng kopa at pinggan.
  alternative: Gawing tahasan ang kahulugan, gaya ng “linisin muna ang iyong kalooban upang luminis din ang panlabas mong buhay.”
  rationale: Sadyang ipinahahayag ni Jesus ang moral na puna sa pamamagitan ng kongkretong metapora. Ang tahasang pagpapaliwanag sa pangunahing teksto ay lalampas sa Griyego at magpapahina sa retorikal na bisa nito.
- issue: Isahan na αὐτοῦ kasunod ng dalawang sisidlan
  choice: Isalin bilang “nito,” na pinananatili ang isahang anyo at ang pinagsamang larawan ng sisidlan.
  alternative: “ng mga ito” o “ng mga iyon,” na gagawing maramihan ang reperensiya.
  rationale: Isahan ang panghalip sa tekstong Griyego. Hindi ito ginawang maramihan upang hindi tahimik na ayusin ang tensiyon sa gramatika ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tuwiran at matalas ang panawag, ngunit hindi kolokyal; nananatiling kongkreto ang larawan at hindi nilalagyan ng paliwanag sa mismong talata.
