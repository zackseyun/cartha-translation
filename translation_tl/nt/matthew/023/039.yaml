base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: tl
  text: 'Sapagkat sinasabi ko sa inyo: mula ngayon ay hinding-hindi[a] ninyo ako makikita hanggang sa sabihin ninyo, “Pinagpala ang dumarating sa pangalan ng Panginoon.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mariin ang pagtanggi sa Griyego (οὐ μή): “hinding-hindi ninyo ako makikita mula ngayon hanggang sa sabihin ninyo.”'
    reason: lexical_alternative
  - marker: b
    text: Sipi o pahiwatig mula sa Awit 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang panaghoy at hatol; natural sa makabagong Tagalog ang “sinasabi ko sa inyo.”
- source_word: οὐ μή
  choice: tiyak na hindi
  rationale: Ipinahahayag nito ang mariing pagtanggi ng οὐ μή nang malinaw at hindi makaluma.
- source_word: ἴδητε
  choice: makikita
  rationale: Direkta at natural na katumbas ng anyong mula sa ὁράω sa kontekstong hinaharap.
- source_word: ἀπ’ ἄρτι
  choice: mula ngayon
  rationale: Tumpak na ipinakikita ang panahong nagsisimula sa kasalukuyang sandali.
- source_word: ἕως ἂν εἴπητε
  choice: hanggang sa sabihin ninyo
  rationale: Pinananatili ang hinaharap na hangganan o kondisyong ipinahahayag ng ἕως ἄν at subjunctive.
- source_word: Εὐλογημένος
  choice: Pinagpala
  rationale: Karaniwan at marangal na salin na nagpapanatili sa alingawngaw ng Awit 118:26.
- source_word: ὁ ἐρχόμενος
  choice: ang dumarating
  rationale: Ang articular participle ay natural na naihahayag sa Tagalog nang hindi ipinipilit na isang teknikal na titulo.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Pinananatili ang anyo at biblikal na himig ng pariralang Griyego; ang κύριος ay isinaling “Panginoon.”
theological_decisions:
- issue: Ang hinaharap na pagkakita kay Jesus at ang pagsambit ng pagpapala
  choice: Isang taimtim na pahayag na hindi nila siya makikita mula ngayon hanggang sa sambitin nila ang siniping pagpapala, nang hindi tinutukoy ang eksaktong pangyayari o panahon.
  alternative: Tiyak na pagtukoy sa matagumpay na pagpasok, sa muling pagparito, o sa hinaharap na pagsisisi ng Israel.
  rationale: Hindi tahasang itinatakda ng Griyego kung aling makasaysayan o eskatolohikal na pangyayari ang tinutukoy, kaya hindi iyon nilulutas sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” para sa maramihang ὑμῖν/ἴδητε/εἴπητε. Inilagay ang [a] matapos ang sugnay na “sabihin ninyo” upang malinaw na tumukoy ang tala sa buong mariing pahayag, at ang [b] matapos ang sipi para sa sanggunian nito.
