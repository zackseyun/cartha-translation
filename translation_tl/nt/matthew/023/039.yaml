  naturalness: Natural at marangal ang “Sapagkat sinasabi ko sa inyo” at ang siping “Pinagpala ang dumarating sa pangalan ng Panginoon.” Mas idiomatiko at mas matindi sa modernong Filipino ang “hinding-hindi” kaysa “tiyak na hindi” para sa mariing negasyon.
  terminology: Ang “Pinagpala,” “Panginoon,” at “sa pangalan ng Panginoon” ay angkop na mga terminong biblikal. Ang “ang dumarating” ay tapat sa articular participle at hindi sapilitang ginagawang teknikal na titulo.
