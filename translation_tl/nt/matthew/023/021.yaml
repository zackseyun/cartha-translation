  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: tl
  text: At ang sinumang nanunumpa sa templo ay nanunumpa sa templo at sa nananahan dito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa templo … sa loob nito.” Karaniwang nangangahulugang “sa loob ng” ang salitang Griyego, ngunit sa pormula ng panunumpa rito ay tumutukoy ito sa bagay na pinanunumpaan, kaya ang diwa ay “sa pamamagitan ng templo … sa pamamagitan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ang sinumang sumusumpa
  rationale: Ang substantibong aorist participle ay tumutukoy sa sinumang gumagawa nito. Likas sa modernong Tagalog ang “ang sinumang sumusumpa” at napapanatili nito ang pangkalahatang diwa.
- source_word: ἐν τῷ ναῷ
  choice: sa templo
  rationale: Bagaman karaniwang nangangahulugang “sa loob ng” ang ἐν, ginagamit ito rito sa pormula ng panunumpa upang tukuyin ang bagay na ipinananumpa. Sa konteksto, malinaw at likas ang “sumusumpa sa templo.”
- source_word: ναῷ
  choice: templo
  rationale: Maaaring tumukoy ang ναός sa santuwaryo o sa mismong gusaling banal. Ang “templo” ang pinakakaraniwan at malinaw na salita sa kontekstong ito.
- source_word: ὀμνύει
  choice: sumusumpa
  rationale: Inihahayag ng pangkasalukuyang pandiwa ang isang pangkalahatang tuntunin; ang “sumusumpa” ay maikli, natural, at angkop sa pahayag.
- source_word: ἐν αὐτῷ
  choice: rito
  rationale: Tumutukoy ito pabalik sa templo at nagpapatuloy sa pormula ng panunumpa. Iniiwasan ng “rito” ang mabigat na pag-uulit habang malinaw ang tinutukoy.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: sa nananahan dito
  rationale: Pinananatili ng “nananahan” ang tuloy-tuloy na larawang ipinahihiwatig ng present participle. Ang tinutukoy ay ang Diyos, ngunit hindi na kailangang idagdag ang pangalang “Diyos” sa mismong teksto.
- source_word: αὐτόν
  choice: dito
  rationale: Ang panghalip ay tumutukoy sa templo. Sa natural na Tagalog, “dito” ang angkop na panumbas kapag ang templo ay inilalarawang tahanan ng isang nananahan.
theological_decisions:
- issue: Pagkakakilanlan ng nananahan sa templo
  choice: Ipinahiwatig, ngunit hindi tahasang pinangalanan, na ang nananahan dito ay ang Diyos.
  alternative: Isalin bilang “sa Diyos na nananahan dito.”
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit hindi tahasang lumilitaw ang θεός sa Griyego. Ang “sa nananahan dito” ay nagpapanatili sa pahiwatig at hindi nagdaragdag sa teksto.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang “sumusumpa sa templo” dahil itinatakda ng agarang konteksto ang diwang panunumpa, habang ipinaliliwanag sa talababa ang literal na kahulugan ng pang-ukol.
