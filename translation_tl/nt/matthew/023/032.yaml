  text: And you[a], fill up the measure of your fathers.
translation:
  language: tl
  text: At kayo, punuin ninyo ang sukat ng inyong mga ninuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring, “punuin ninyo ang buong sukat ng mga kasalanan ng inyong mga ninuno.” Literal sa Griyego: “punuin ninyo ang sukat ng inyong mga ninuno,” isang metapora ng naiipong sala na umaabot sa hangganan nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay at ang tuloy-tuloy na retorikal na kaugnayan sa naunang pahayag.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang tahasang panghalip sa Griyego ay may diin; natural na naipahahayag ito sa Tagalog sa pamamagitan ng hiwalay na “kayo” bago ang pautos.
- source_word: πληρώσατε
  choice: punuin ninyo
  rationale: Aorist active imperative, ikalawang panauhang maramihan. Pinananatili nito ang anyong pautos at ang metapora ng pagpapaabot sa ganap na dami.
- source_word: τὸ μέτρον
  choice: ang takal
  rationale: Ang “takal” ay isang likas at dignified na salitang Tagalog para sa sukat o daming pumupuno sa isang takdang kapasidad, kaya napapanatili ang metapora ng naiipong sala na umaabot sa hangganan.
- source_word: τῶν πατέρων ὑμῶν
  choice: ng inyong mga ninuno
  rationale: Bagaman literal na “mga ama,” tumutukoy rito ang πατέρων sa mga ninunong binanggit sa konteksto. Ang “mga ninuno” ay malinaw sa makabagong Tagalog at hindi nagpapahiwatig na mga agarang ama lamang ang tinutukoy.
theological_decisions:
- issue: Pautos ba o prediksiyon ang pahayag ni Jesus?
  choice: 'Pautos na may ironiko at mapanghatol na puwersa: “punuin ninyo.”'
  alternative: 'Prediksiyon: “pinupuno ninyo” o “pupunuin ninyo.”'
  rationale: Ang πληρώσατε ay morpolohikal na aorist active imperative, ikalawang panauhang maramihan. Kaya pinananatili ang pautos habang hindi inaalis ang tensiyon na sa konteksto ay isa itong ironiko at mapanghatol na panawagan upang lubusin nila ang huwaran ng pagkakasala ng kanilang mga ninuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “takal” upang mapanatili ang konkretong metapora, at “mga ninuno” upang natural na maipahayag ang kontekstuwal na kahulugan ng πατέρων.
