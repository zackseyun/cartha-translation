  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: tl
  text: Huwag din kayong tawaging mga tagapagturo, sapagkat iisa ang inyong tagapagturo—ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Huwag din
  rationale: Ipinagpapatuloy ng μηδὲ ang mga naunang pagbabawal; natural sa Filipino ang “Huwag din” at malinaw ang ugnayan sa konteksto.
- source_word: κληθῆτε
  choice: kayong patawag
  rationale: Ipinahihiwatig ng pasibong anyo ang pagtanggap sa isang titulo. Ang “patawag” ay likas na paraan sa Filipino upang ipagbawal ang pagpapakilala o pagtawag sa kanila sa gayong titulo.
- source_word: καθηγηταί / καθηγητής
  choice: mga tagapagturo / tagapagturo
  rationale: Saklaw ng καθηγητής ang gumagabay at nagtuturo. Pinananatili ng “tagapagturo” ang diwa ng pagtuturo at pamumuno nang hindi ito basta itinutumbas sa karaniwang “guro,” na tumutugma sa διδάσκαλος sa kalapit na talata.
- source_word: ὅτι
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan sa pagbabawal; dignified at malinaw ang “sapagkat.”
- source_word: ὑμῶν ἐστιν εἷς
  choice: iisa ang inyong
  rationale: Pinananatili ng ayos na ito ang diin ng Griyego sa pagiging nag-iisa ng tagapagturo, habang natural pa rin sa Filipino.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Dito ay tahasang titulo ang χριστός, kaya isinasalin bilang “Mesiyas” upang mapanatili ang kahulugan at kontekstong Judio; inilalahad sa talababa ang tradisyonal na alternatibong “Cristo.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: May pantukoy ang ὁ χριστός at gumaganap bilang mesiyanikong titulo. Hindi ito itinuturing lamang na personal na pangalan; ang tradisyonal na anyo ay pinananatili bilang lehitimong alternatibo sa talababa.
- issue: Diin sa nag-iisang tagapagturo
  choice: iisa ang inyong tagapagturo
  alternative: may isa kayong tagapagturo
  rationale: Mas tuwirang pinananatili ng “iisa” ang diin ng ἐστιν εἷς sa pagiging bukod-tangi, nang hindi pinalalawak ang teolohikong implikasyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagturo” upang maiba sa “guro” sa kalapit na konteksto, at ang gitling na em dash upang malinaw na tukuyin na ang nag-iisang tagapagturo ay ang Mesiyas.
