id: MAT.23.35
reference: Matthew 23:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: tl
  text: upang dumating sa inyo ang lahat ng dugo ng mga matuwid na ibinubuhos sa lupa[a], mula sa dugo ng matuwid na si Abel hanggang sa dugo ni Zacarias na anak ni Barakias[b], na pinaslang ninyo sa pagitan ng santuwaryo at ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lupain.” Ang salitang Griyego ay maaaring tumukoy sa “daigdig” o “lupain.”
    reason: lexical_alternative
  - marker: b
    text: Pinagtatalunan ang pagkakakilanlan kay “Zacarias na anak ni Barakias.” Iniuugnay siya ng ilan sa propetang si Zacarias; iniuugnay naman siya ng iba kay Zacarias na anak ni Joiada (2 Cron. 24:20–22). Sinusunod ng salin ang pagkakasulat ng tekstong Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o kinalabasan, at pinananatili ang puwersa ng sugnay na kasunod ng naunang pagtuligsa.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: dumating sa inyo ang pananagutan
  rationale: Ang literal na pagdating ng dugo sa kanila ay isang metonimiya para sa pagsapit ng pananagutan sa ibinuhos na dugo. Ginawang malinaw sa natural na Filipino ang hudisyal na diwa nang hindi inaalis ang salitang 'dugo' sa kasunod na parirala.
- source_word: πᾶν αἷμα δίκαιον
  choice: lahat ng dugong matuwid
  rationale: Pinananatili ang isahang kolektibong 'dugo' at ang metonimikong paglalarawan dito bilang matuwid, ibig sabihi'y dugo ng mga taong matuwid.
- source_word: ἐκχυννόμενον
  choice: na ibinubuhos
  rationale: Pinananatili ang pangkasalukuyang pasibong aspekto at ang larawan ng dugong ibinubuhos; mas tuwiran ito kaysa sa simpleng 'dumanak.'
- source_word: ἐπὶ τῆς γῆς
  choice: sa ibabaw ng lupa
  rationale: Ang 'lupa' ay natural sa Filipino at maaari ring tumukoy sa daigdig o sa isang lupain; inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: mula sa dugo ng matuwid na si Abel
  rationale: Pinananatili ang henitibong kayarian at ang tawag kay Abel na matuwid sa natural na ayos ng Filipino.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: hanggang sa dugo ni Zacarias na anak ni Barakias
  rationale: Tuwirang inililipat ang saklaw na ἀπό...ἕως at ang pangalan at patronimiko ayon sa tekstong Griyego.
- source_word: ὃν ἐφονεύσατε
  choice: na pinaslang ninyo
  rationale: Ang 'pinaslang' ay nagtataglay ng moral na bigat ng φονεύω at mas angkop kaysa sa pangkalahatang 'pinatay.'
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: sa pagitan ng santuwaryo at ng altar
  rationale: Ang ναός ay ang santuwaryo o mismong gusaling banal, hindi ang buong kompleks ng templo; ang θυσιαστήριον ay altar.
theological_decisions:
- issue: Pagkakakilanlan kay Zacarias na anak ni Barakias
  choice: Panatilihin ang pangalan at patronimiko ayon sa tekstong Griyego nang walang paghaharmonisa.
  alternative: Iugnay siya sa propetang si Zacarias na anak ni Barakias, o sa Zacarias na anak ni Joiada sa 2 Cronica 24:20–22.
  rationale: Hindi tiyak ang historikal na pagkakakilanlan. Dapat isalin ang umiiral na tekstong Griyego at ilahad sa talababa ang usapin sa halip na lihim itong lutasin.
- issue: Dugong 'dumarating' sa mga kausap
  choice: Ipahayag bilang pagdating sa kanila ng pananagutan sa dugo.
  alternative: Literal na 'dumating sa inyo ang lahat ng dugong matuwid.'
  rationale: Sa konteksto, ang dugo ay metonimiya ng pagkakasala o pananagutan sa pagdanak nito. Ang tahasang 'pananagutan' ay natural at nauunawaan sa Filipino, habang nananatili sa teksto ang buong larawang may dugo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'santuwaryo' upang maiba ang ναός sa buong kompleks ng templo, at mga nakaugaliang anyong Filipino ng mga pangalang Zacarias at Barakias.
