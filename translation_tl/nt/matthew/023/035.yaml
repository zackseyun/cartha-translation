  naturalness: Mas natural sa modernong Filipino ang “lahat ng dugo ng mga matuwid na ibinubuhos sa lupa” kaysa “lahat ng dugong matuwid.” Ang “sa lupa” ay sapat at hindi kinakailangang “sa ibabaw ng lupa.”
  terminology: Ang “pinaslang,” “santuwaryo,” “altar,” at ang mga pangalang “Zacarias” at “Barakias” ay angkop. Pinananatili ang anak ni Barakias ayon sa tekstong Griyego at ang talababa ay wastong nag-iingat sa pinagtatalunang pagkakakilanlan.
  issues:
