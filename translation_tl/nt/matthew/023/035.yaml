    issue: Idinagdag ang “pananagutan” bilang paksa ng “dumating sa inyo.”
    rationale: Ang ἔλθῃ ἐφ’ ὑμᾶς ay may paksa na πᾶν αἷμα δίκαιον. Bagaman ipinahihiwatig ng konteksto ang pananagutan sa pagdanak ng dugo, hindi ito hayagang salita sa Griyego at hindi dapat ipalit sa pangunahing teksto.
  - severity: low
    issue: Hindi natural ang “dugong matuwid” sa Filipino.
    rationale: Ang δίκαιον ay metonimikong tumutukoy sa mga taong matuwid na dumanak ang dugo. Ang “dugo ng mga matuwid” ay natural na Filipino at pinananatili ang kahulugan.
