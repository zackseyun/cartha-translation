  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: tl
  text: Nagtatali sila ng mabibigat na pasanin at ipinapatong ang mga ito sa mga balikat ng mga tao, ngunit sila mismo ay ayaw man lamang galawin ang mga ito kahit isang daliri nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: Nagtatali
  rationale: Pinananatili nito ang konkretong larawan ng pagbibigkis o pagtatali ng mga pasaning ihahakot.
- source_word: φορτία βαρέα
  choice: mabibigat na pasanin
  rationale: Naipapahayag nito kapwa ang literal na bigat at ang metaporikal na diwa ng mapaniil na mga hinihingi.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: ipinapasan ... sa mga balikat
  rationale: Natural ito sa modernong Tagalog at pinananatili ang konkretong larawan ng paglalagay ng pasan sa balikat.
- source_word: τῶν ἀνθρώπων
  choice: ng mga tao
  rationale: Ang ἀνθρώπων ay tumutukoy dito sa mga tao sa pangkalahatan; malinaw at likas ang inklusibong salin sa Tagalog.
- source_word: αὐτοὶ δὲ
  choice: ngunit sila mismo
  rationale: Pinananatili ang mariing paghahambing sa ipinapagawa nila sa iba at sa sarili nilang pagtanggi.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: kahit isang daliri
  rationale: Likas na idyoma ito sa Tagalog para sa pinakamaliit na pagsisikap, habang pinananatili ang larawang nasa Griyego.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: ayaw man lamang galawin ang mga iyon
  rationale: Ipinakikita ng θέλουσιν ang kusang pagtanggi, at tuwirang katumbas ng κινῆσαι ang “galawin,” sa halip na mas interpretatibong “buhatin.”
theological_decisions:
- issue: Kung literal o metaporikal ang mga pasanin
  choice: Panatilihin ang konkretong larawang “mabibigat na pasanin” nang hindi tinutukoy kung ano mismo ang mga ito.
  alternative: Ipaliwanag ang mga ito bilang mga tuntuning panrelihiyon o mga kahilingan ng kautusan.
  rationale: Ginagamit ng Griyego ang larawan ng mga pasanin ngunit hindi nito tahasang pinapangalanan ang tinutukoy; iniiwasan ng salin ang pagpapasok ng mas makitid na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “ipinapasan” upang maging idiomatiko habang pinananatili ang larawan ng balikat at pasanin; hindi kailangan ang talababa dahil likas na pangkalahatan sa Tagalog ang “mga tao.”
