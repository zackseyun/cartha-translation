review_pass:
  verdict: revise
  source_fidelity: Tumpak sa pangkalahatan ang larawan ng pagbibigkis ng mabibigat na pasanin, paglalagay ng mga ito sa balikat ng mga tao, at mariing pagtanggi ng mga nagsasalita na tumulong. Gayunman, kailangang gawing mas malinaw na ang 'isang daliri' ay kanilang sariling daliri at siyang kasangkapang ipinangangalaw sa mga pasanin.
  naturalness: Likas ang karamihan ng pangungusap. Ang 'ipinapatong ... sa mga balikat' ay mas tuwirang tumutugma sa paglalagay ng pasanin sa balikat kaysa 'ipinapasan,' na maaaring magpahiwatig na ang paksa mismo ang nagpapasan. Ang 'kahit isang daliri nila' ay malinaw at idiomatiko.
  terminology: Ang 'mabibigat na pasanin,' 'mga tao,' at 'sila mismo' ay angkop, malinaw, at pinananatili ang metaporang hindi binibigyang-kahulugang doktrinal. Walang talababa na kailangan para sa pangkalahatang 'mga tao' sa Tagalog.
  issues:
  - severity: medium
    issue: Hindi ganap na malinaw ang saklaw ng 'kahit isang daliri.'
    rationale: Sa 'ayaw man lamang galawin ang mga iyon kahit isang daliri,' maaaring mabasa ang parirala bilang pangkalahatang idyoma ng kawalang-kilos. Ang Griyego ay tiyak na nagsasabing ayaw nilang galawin ang mga pasanin sa pamamagitan ng kanilang daliri. Ang pagdaragdag ng 'nila' ay nag-iingat sa larawang ito.
  - severity: low
    issue: Ang 'ipinapasan ... sa mga balikat' ay bahagyang hindi tuwiran para sa ἐπιτιθέασιν ἐπὶ τοὺς ὤμους.
    rationale: Ang pandiwa sa Griyego ay 'ilagay/ipatong sa'; ang 'ipinapatong' ay mas malapit at mas malinaw na ang pasanin ang inilalagay sa balikat ng iba.
  revised_text: Nagtatali sila ng mabibigat na pasanin at ipinapatong ang mga ito sa mga balikat ng mga tao, ngunit sila mismo ay ayaw man lamang galawin ang mga ito kahit isang daliri nila.
