  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: tl
  text: Ngunit ang pinakadakila sa inyo ay magiging lingkod ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang higit na dakila sa inyo ay magiging lingkod ninyo.” Ang pahambing na anyo sa Griyego ay maaaring gamitin sa diwang tumutukoy sa taong may pinakamataas na katayuan sa pangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa paghahangad ng mataas na katayuan at mga titulo sa naunang konteksto.
- source_word: μείζων
  choice: ang pinakadakila
  rationale: Bagaman pahambing ang anyong Griyego, maaari itong gamitin sa diwang pasukdol para sa taong may pinakamataas na katayuan sa pangkat.
- source_word: ὑμῶν (una)
  choice: sa inyo
  rationale: 'Ipinahahayag nang natural sa Tagalog ang partitive na diwa: ang pinakadakila mula sa pangkat na kinakausap.'
- source_word: ἔσται
  choice: ay magiging
  rationale: Tuwirang ipinananatili ang panahong hinaharap ng pandiwa nang hindi gumagamit ng makalumang pananalita.
- source_word: ὑμῶν (ikalawa)
  choice: ninyo
  rationale: 'Ipinahahayag ang relasyonal na ugnayan sa διάκονος: lingkod na naglilingkod sa mga kinakausap.'
- source_word: διάκονος
  choice: lingkod
  rationale: Sa kontekstong ito, tumutukoy ito sa taong naglilingkod sa iba, hindi sa teknikal na katungkulan sa iglesya; iniiwasan ng “lingkod” ang maling pahiwatig ng isang opisyal na posisyon.
theological_decisions:
- issue: Wika ng katayuan sa turo ni Jesus tungkol sa kadakilaan at paglilingkod
  choice: 'Panatilihin ang pagbaligtad ng katayuan: “ang pinakadakila sa inyo ay magiging lingkod ninyo.”'
  alternative: “ang higit na dakila sa inyo ay magiging tagapaglingkod ninyo”
  rationale: Ipinahahayag ng talata na ang tunay na kadakilaan ay nahahayag sa paglilingkod, nang hindi ipinapasok ang isang kalaunang katungkulang pansimbahan o pinahihina ang matinding pagbaligtad sa karaniwang pagtingin sa ranggo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinakadakila” bilang natural na pagpapahayag ng superlatibo-like na diwa ng Griyegong pahambing, habang inilagay sa talababa ang mas literal na alternatibo.
