review_pass:
  verdict: revise
  source_fidelity: Kailangang baguhin ang “sa ngalan ng,” sapagkat ang ἐν sa pormula ng panunumpa ay tumutukoy sa bagay na pinanunumpaan (“sa langit”), hindi sa panunumpa “sa ngalan ng” isang entidad. Kailangan ding maging “sa nakaupo rito,” hindi “ng nakaupo rito,” upang maipakita ang ikatlong magkakaugnay na ἐν (“sa/pinananumpaan sa pamamagitan ng”).
  naturalness: Ang “nanunumpa sa langit,” “nanunumpa sa trono ng Diyos,” at “sa nakaupo rito” ay natural at malinaw sa modernong Filipino Tagalog sa konteksto ng panunumpa. Ang “rito” ay angkop na tumutukoy sa trono.
  terminology: Ang “langit,” “trono ng Diyos,” at ang di-tuwirang “nakaupo rito” ay tapat sa marangal at mapitagang pananalita ng Griyego. Hindi kailangang palitan ang huli ng tahasang “Diyos.”
  issues:
  - severity: medium
    issue: Ang “sa ngalan ng langit” at “sa ngalan ng trono ng Diyos” ay hindi tumpak na katumbas ng gamit ng ἐν sa mga pariralang ito.
    rationale: Ang pariralang Tagalog na “sa ngalan ng” ay karaniwang nangangahulugang kumikilos o nagsasalita bilang kinatawan o sa awtoridad ng isang pangalan. Sa konteksto ng panunumpa, ang mas tapat at likas na salin ay “nanunumpa sa langit/trono ng Diyos.”
  - severity: medium
    issue: Kulang ang pang-ukol sa “at ng nakaupo rito.”
    rationale: Ang Griyego ay may ἐν bago sa “ang nakaupo rito,” gaya ng naunang dalawang parirala. Sa Tagalog, dapat itong maging “at sa nakaupo rito” upang mapanatili ang ugnayan ng panunumpa.
