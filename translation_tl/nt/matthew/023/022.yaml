base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: tl
  text: At ang sinumang nanunumpa sa langit ay nanunumpa sa trono ng Diyos at sa nakaupo rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa nakaupo sa trono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ang sinumang nanunumpa
  rationale: Ang articular aorist participle ay ginagamit nang pangkalahatan at substantibo; likas sa modernong Tagalog ang “ang sinumang nanunumpa” para sa isang pangkalahatang simulain.
- source_word: ἐν
  choice: sa ngalan ng
  rationale: Sa pormula ng panunumpa, ang ἐν na may datibo ay tumutukoy sa pinagbabatayan o tinatawag na saksi ng sumpa. Mas malinaw at likas sa Tagalog ang “manumpa sa ngalan ng” kaysa sa literal na “sa.”
- source_word: οὐρανῷ
  choice: langit
  rationale: Sa kontekstong panrelihiyon at sa tuwirang kaugnayan nito sa trono ng Diyos, tumutukoy ito sa langit, hindi lamang sa pisikal na kalawakan.
- source_word: ὀμνύει
  choice: ay nanunumpa
  rationale: Ang pangkasalukuyang indikativo ay nagpapahayag ng pangkalahatang katotohanan; ang aspektong imperpektibo ng “nanunumpa” ay angkop dito.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: trono ng Diyos
  rationale: Pinananatili nito ang hayag na ugnayang henitibo at ang marangal na himig ng Griyego.
- source_word: τῷ καθημένῳ
  choice: ang nakaupo
  rationale: Tumutukoy ito sa isang nakaluklok sa trono. Ang “nakaupo” ay malinaw at natural, habang hindi dinaragdagan ang teksto ng tahasang pangalang “Diyos.”
- source_word: ἐπάνω αὐτοῦ
  choice: rito
  rationale: Ang panghalip ay bumabalik sa trono; sa Tagalog, ang “rito” pagkatapos ng “nakaupo” ay natural na nagpapahiwatig na nakaupo siya sa trono, hindi nakahiwalay sa ibabaw nito.
theological_decisions:
- issue: Ang tinutukoy ng “nakaupo rito”
  choice: Pinanatili bilang mapitagang di-tuwirang pagtukoy sa Diyos na nakaluklok sa kanyang trono
  alternative: Tahasang isalin bilang “Diyos na nakaupo rito” o gawing mas malabo bilang “ang nakaupo roon”
  rationale: Nililinaw ng pariralang “trono ng Diyos” ang tinutukoy, ngunit pinananatili ng salin ang di-tuwirang pahayag ng Griyego sa halip na palitan ito ng “Diyos.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “sa ngalan ng” upang maipahayag nang natural ang idyoma ng panunumpa, at iniwasang tahasang tukuyin bilang “Diyos” ang participial circumlocution sa dulo.
