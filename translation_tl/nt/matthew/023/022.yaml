revisions:
- from: At ang sinumang nanunumpa sa ngalan ng langit ay nanunumpa sa ngalan ng trono ng Diyos at ng nakaupo rito.[a]
  to: At ang sinumang nanunumpa sa langit ay nanunumpa sa trono ng Diyos at sa nakaupo rito.[a]
  rationale: Inalis ang “sa ngalan ng” upang hindi maipasok ang kahulugang pagkatawan o awtoridad na wala sa pormula ng Griyego para sa panunumpa. Isinauli ang “sa” bago ang huling parirala upang maipakita ang paulit-ulit na ἐν at upang maging wasto ang sintaks ng Tagalog. Pinanatili ang di-tuwirang pagtukoy sa nakaupo sa trono at ang reperensiya ng “rito” sa trono.
