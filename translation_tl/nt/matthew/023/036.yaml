base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: tl
  text: 'Katotohanang sinasabi ko sa inyo: sasapit sa salinlahing ito[b] ang lahat ng bagay na ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “lahat ng ito.” Pangmaramihan ang Griyego: “lahat ng bagay na ito.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “salinlahing ito” ay maaari ding unawain ng ilan bilang “mga taong ito” o bilang isang mas malawak na salinlahing di-sumasampalataya, ngunit ang pinakatuwirang pagbasa sa Griyego ay “salinlahing ito.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Katotohanan
  rationale: Sa pormulang ἀμὴν λέγω ὑμῖν, nagsisilbi itong taimtim na pagpapatibay sa awtoritatibong pahayag. Ang “Katotohanang sinasabi ko sa inyo” ay likas at marangal sa Filipino at hindi dinodoble ang ἀμήν.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwirang ipinapahayag ang pandiwa at panghalip habang pinananatili ang taimtim na himig ng pormula.
- source_word: ἥξει
  choice: sasapit
  rationale: Ipinahahayag ng panghinaharap ng ἥκω ang pagdating ng mga bagay o kahihinatnang binanggit. Ang “sasapit sa” ay natural sa Filipino at pinananatili ang diwa ng pagdating sa mga taong tinutukoy.
- source_word: ταῦτα πάντα
  choice: ang lahat ng bagay na ito
  rationale: Malinaw na kinakatawan ang pangmaramihang Griyego at ang kabuuan ng mga bagay na tinutukoy sa naunang konteksto.
- source_word: ἐπὶ
  choice: sa
  rationale: Kasama ng “sasapit,” natural na ipinahahayag ng “sa” ang pagdating ng mga kahihinatnan sa salinlahing tinutukoy, nang hindi labis na binibigyang-kahulugan bilang tahasang pagkapoot.
- source_word: γενεὰν ταύτην
  choice: salinlahing ito
  rationale: Ito ang pinakatuwirang katumbas ng Griyego at pinananatili ang temporal na puwersa at ang posibleng saklaw nito nang hindi nagpapasok ng isang tiyak na sistemang eskatolohikal.
theological_decisions:
- issue: Ang tinutukoy ng γενεὰν ταύτην
  choice: salinlahing ito
  alternative: mga taong ito; mas malawak na salinlahing di-sumasampalataya; kasalukuyang kapanahunan
  rationale: Pinananatili ng salin ang tuwirang pananalita at temporal na puwersa ng Griyego, habang iniiwang bukas sa konteksto ang pinagtatalunang saklaw nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang taimtim na pormula ng pagsasalita ni Jesus at ang tunay na kalabuan ng “salinlahing ito,” nang hindi nilulutas ang pinagtatalunang interpretasyong eskatolohikal.
