  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: tl
  text: Sa aba ninyo, mga eskriba at mga Pariseo, mga mapagkunwari! Nililinis ninyo ang labas ng tasa at ng pinggan, ngunit ang loob ng mga ito ay puno ng mapagsamantalang pagkamkam at pagpapakasasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puno ng pandarambong at kawalan ng pagpipigil sa sarili.” Ang mga salitang Griyego ay maaari ring tumukoy sa marahas o mapagsamantalang pagkuha at sa walang-pigil na labis na pagpapakasasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Kawawa kayo
  rationale: Naghahatid ito ng matinding propetikong pagtuligsa at babala sa natural na modernong Tagalog, hindi lamang ng pagkahabag.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa teknikal na 'mga eskriba,' at angkop sa tungkulin ng grupo sa konteksto ng Ebanghelyo.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang salin at kinikilalang pangalan ng pangkat.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Likas at tumpak na katumbas para sa pagkukunwaring moral at panrelihiyon.
- source_word: καθαρίζετε
  choice: Nililinis ninyo
  rationale: Tuwirang modernong salin ng pangkasalukuyang kilos.
- source_word: τὸ ἔξωθεν
  choice: ang labas
  rationale: Pinananatili ang malinaw na pagsalungat ng labas at loob.
- source_word: ποτηρίου
  choice: kopa
  rationale: Dignified at pamilyar na katawagan sa sisidlang inuman sa kontekstong biblikal.
- source_word: παροψίδος
  choice: pinggan
  rationale: Malawak at natural na katawagan para sa sisidlang gamit sa paghahain o pagkain, nang hindi labis na tinutukoy ang hugis.
- source_word: ἔσωθεν
  choice: ang loob ng mga ito
  rationale: Nililinaw ang reperensiya sa dalawang sisidlan habang pinananatili ang metapora.
- source_word: γέμουσιν
  choice: ay punô
  rationale: Ang pandiwang Griyego ay maramihan at tumutukoy sa kopa at pinggan; ipinahihiwatig ito ng 'mga ito.'
- source_word: ἁρπαγῆς
  choice: pandarambong
  rationale: Pinananatili ang mas matinding diwa ng mapagsamantala o marahas na pagkamkam, sa halip na paliitin ito sa panloob na kasakiman lamang.
- source_word: ἀκρασίας
  choice: pagpapakasasa
  rationale: Natural na nagpapahayag ng walang-pigil na pagbibigay-layaw sa sariling pagnanasa; ang alternatibong 'kawalan ng pagpipigil sa sarili' ay inilalagay sa talababa.
theological_decisions:
- issue: Tinutukoy ng karumihan sa loob
  choice: Panatilihin ang larawan na ang loob ng kopa at pinggan ang punô ng masasamang bagay.
  alternative: Tuwirang sabihing ang mga lider mismo o ang kanilang mga puso ang punô ng mga ito.
  rationale: Ang sugnay sa Griyego ay nagpapatuloy sa metapora ng mga sisidlan at gumagamit ng maramihang pandiwa. Hindi dapat idagdag sa pangunahing teksto ang pagpapaliwanag sa malinaw ngunit di-tahasang tinutukoy na mga lider.
- issue: Lakas ng ἁρπαγή
  choice: pandarambong
  alternative: kasakiman
  rationale: Maaaring tumukoy ang salita sa pagkamkam, pandarambong, o pagsasamantala. Ang mas matinding salin ay nagpapanatili ng posibleng panlabas at mapagsamantalang dimensiyon sa halip na gawing panloob na bisyo lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tagapagturo ng Kautusan' para sa kalinawan, at pinanatili ang matalim na himig ng pagtuligsa at ang metaporang labas-loob ng mga sisidlan.
