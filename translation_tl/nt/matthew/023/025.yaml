  terminology: Gamitin ang «mga eskriba» para sa γραμματεῖς at «mga Pariseo» para sa Φαρισαῖοι. Ang «mga mapagkunwari» ay angkop para sa ὑποκριταί. Ang «mapagsamantalang pagkamkam» at «pagpapakasasa» ay maingat na naghahatid ng ἁρπαγή at ἀκρασία; ang mas maigting na «pandarambong» at ang «kawalan ng pagpipigil sa sarili» ay maaaring ilagay sa talababa bilang mga alternatibong leksikal.
