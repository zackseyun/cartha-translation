  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: tl
  text: At huwag ninyong tawaging inyong ama ang sinuman sa lupa,[a] sapagkat iisa ang inyong Ama, ang nasa langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At huwag ninyong tawaging ‘ama’ ang sinuman sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang Ama sa langit,” o “ang makalangit na Isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: huwag ninyong tawaging inyong ama
  rationale: Pinananatili nito ang tuwirang pagbabawal at ang titulong “ama,” pati ang ugnayang ipinahihiwatig ng ὑμῶν, nang hindi ipinapasiyang tumutukoy ito sa lahat ng karaniwang gamit ng salita.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Likas at maikli itong panumbas sa Filipino para sa saklaw na makalupa, na kaiba sa nasa langit.
- source_word: εἷς
  choice: iisa
  rationale: Ang “iisa” ay natural na Filipino at malinaw na nagpapanatili sa diin ng Griyegong εἷς nang hindi nagdaragdag ng hiwalay na salitang “lamang.”
- source_word: ὑμῶν ὁ πατήρ
  choice: ang inyong Ama
  rationale: Pinananatili ang personal na kaugnayang nasa genitibong ὑμῶν at ang pagkakatulad ng salitang πατήρ sa unang sugnay.
- source_word: ὁ οὐράνιος
  choice: ang nasa langit
  rationale: Ang substantibong pang-uri ay natural na naipahahayag sa Filipino bilang “ang nasa langit.” Pinananatili nito ang pagkakakilanlan ng Ama nang hindi inuulit ang “Ama” sa pangunahing teksto.
theological_decisions:
- issue: Saklaw ng pagbabawal ni Jesus
  choice: Panatilihin bilang tuwiran at matinding pagbabawal ang pagtawag sa sinuman sa lupa na “inyong ama.”
  alternative: Ipaliwanag sa salin na espirituwal na titulo lamang ang ipinagbabawal, o palambutin ito bilang eksaherasyon.
  rationale: Matindi at tuwiran ang Griyego. Hindi dapat lutasin ng salin kung paano ito nauugnay sa biyolohikal, panlipunan, o iba pang karaniwang paggamit ng “ama”; dapat manatili ang tensiyong teolohikal upang ang konteksto ang gumabay sa pagpapakahulugan.
- issue: Pagpapakahulugan sa ὁ οὐράνιος
  choice: ang nasa langit
  alternative: ang Ama sa langit / ang makalangit na Isa
  rationale: Maaaring unawain ang parirala bilang substantibong pang-uri na tumutukoy sa Ama. Ang piniling anyo ay natural sa Filipino at hindi labis na nagpapaliwanag, habang inilalahad sa talababa ang ibang posibleng anyo.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang “sinuman” sa halip na isang salitang may tiyak na kasarian dahil walang tahasang pangngalang “lalaki” o “tao” sa Griyego. Ang malaking titik sa ikalawang “Ama” ay tumutulong na ipakita ang pagtukoy sa Diyos nang hindi dinaragdagan ang nilalaman.
