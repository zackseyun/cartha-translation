  source_fidelity: 'Ang pangunahing estruktura at saklaw ng Griyego ay naipapahayag nang tapat: ang γενικong ὁ οὖν ὀμόσας, ang altar bilang batayan ng panunumpa, at ang malawak na “lahat ng nasa ibabaw nito.” Gayunman, ang “sumusumpa” ay sa karaniwang makabagong Filipino ay mas madaling unawaing ‘nagpapahayag ng sumpa/cursing’ kaysa ‘nanunumpa’ sa kahulugang kumukuha ng panunumpa.'
