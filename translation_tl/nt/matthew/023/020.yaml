base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: tl
  text: Kaya nga, ang sinumang nanunumpa sa altar ay nanunumpa rito at sa lahat ng nasa ibabaw nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Kaya, ang sinumang sumusumpa
  rationale: Ang articular aorist participle ay ginagamit sa pangkalahatang diwa, kaya natural itong isalin na “ang sinumang sumusumpa.” Ang οὖν ay inferensiyal at nag-uugnay sa konklusyong ito sa naunang pangangatwiran, kaya “Kaya” ang ginamit.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: sa altar
  rationale: Sa pormula ng panunumpa, ang ἐν ay tumutukoy sa bagay na pinagbabatayan ng sumpa. Sa natural na Tagalog, “sumumpa sa altar” ang angkop at hindi ang literal na lokatibong “nasa altar.”
- source_word: ὀμνύει
  choice: ay sumusumpa
  rationale: Ang pangkasalukuyang anyo sa Tagalog ay malinaw na naghahayag ng pangkalahatang simulain at pinananatili ang pag-uulit ng pandiwa sa Griyego.
- source_word: ἐν αὐτῷ
  choice: rito
  rationale: Ang panghalip ay tumutukoy pabalik sa altar. Ang “rito” ay natural na katumbas sa pormula ng panunumpa at umiiwas sa mabigat na pag-uulit ng “sa altar.”
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: at sa lahat ng nasa ibabaw nito
  rationale: Ang parirala ay malawak at tumutukoy sa lahat ng bagay na nasa ibabaw ng altar. Pinananatili ng saling ito ang saklaw ng Griyego nang hindi ito nililimitahan sa “handog” lamang.
theological_decisions:
- issue: Tinutukoy ng “lahat ng nasa ibabaw nito”
  choice: Pangkalahatang pagtukoy sa lahat ng nasa ibabaw ng altar, nang hindi tinutukoy na mga handog lamang
  alternative: lahat ng handog na nasa ibabaw nito
  rationale: Bagaman binabanggit sa agarang konteksto ang handog sa altar, mas malawak ang mismong pariralang Griyego. Ang pangkalahatang salin ay nagpapanatili sa saklaw at tensiyon ng teksto nang hindi nagpapasok ng paliwanag sa pangunahing talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” isang karaniwan at madaling maunawaang terminong panrelihiyon. Walang talababa dahil sapat na napapanatili ng “lahat ng nasa ibabaw nito” ang lawak ng orihinal na parirala.
