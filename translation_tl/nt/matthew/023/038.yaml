  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: tl
  text: Tingnan ninyo, iniiwan sa inyo ang inyong bahay[a] na tiwangwang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong templo”; maaaring partikular na tumukoy ang “inyong bahay” sa templo, bagaman mas malawak ang saklaw ng pananalitang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang natural at makabagong panawag-pansin na nagpapanatili sa bigat ng taimtim na pahayag; mas madaling maunawaan kaysa sa mas makalumang “Masdan.”
- source_word: ἀφίεται
  choice: iniiwan
  rationale: Pinananatili ang kasalukuyang anyong balintiyak ng pandiwa at hindi tahasang tinutukoy kung sino ang umaalis o nang-iiwan.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang pinananatili ang datibo at ang diwang ang bahay ay naiiwan sa kanila.
- source_word: ὁ οἶκος ὑμῶν
  choice: ang inyong bahay
  rationale: Literal at sadyang malawak ang salin. Maaaring tumukoy sa templo, sa Jerusalem, o sa sambahayan ng Israel, ngunit hindi nililimitahan ng mismong pariralang Griyego ang kahulugan sa isa lamang sa mga ito.
- source_word: ἔρημος
  choice: tiwangwang
  rationale: Likas sa makabagong Filipino at malinaw na naghahatid ng diwa ng pagiging iniwan, walang laman, at wasak o pinabayaan sa konteksto ng paghatol.
theological_decisions:
- issue: Ang tinutukoy ng “inyong bahay”
  choice: Pinanatili bilang “inyong bahay” sa pangunahing teksto.
  alternative: “inyong templo,” “Jerusalem,” o “sambahayan ng Israel”
  rationale: Malakas na ipinahihiwatig ng konteksto ang Jerusalem at lalo na ang templo, ngunit mas malawak ang Griyegong οἶκος. Pinananatili ng salin ang sadyang kalabuan at propetikong bigat ng pahayag sa halip na ipasya ang isang tiyak na pakahulugan.
- issue: Ang gumagawa ng pag-iwan
  choice: Ginamit ang balintiyak na “iniiwan” nang hindi pinangalanan ang gumagawa.
  alternative: “Pinababayaan ng Diyos” o “iniiwan ko”
  rationale: Balintiyak ang ἀφίεται at hindi tahasang pinangalanan sa talata ang gumagawa. Iniiwasan ng salin ang pagdaragdag ng isang paksa na hindi hayag sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo” bilang natural na panawag-pansin at ang “tiwangwang” upang mapanatili ang propetikong himig ng paghatol nang hindi nagiging labis na teknikal o makaluma.
