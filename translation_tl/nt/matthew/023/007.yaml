  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: tl
  text: at ang mga pagbati sa mga pamilihan, at ang matawag ng mga tao na ‘Rabbi.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: mga pagbati
  rationale: Tumutukoy sa magalang at hayag na pagbati o pagpupugay; pinananatili ng ‘mga pagbati’ ang lawak ng salitang Griyego nang hindi nagdaragdag ng tiyak na seremonyal na kahulugan.
- source_word: ἀγοραῖς
  choice: mga pamilihan
  rationale: Ang ἀγορά ay pampublikong pook na sentro ng kalakalan at pagtitipon; ‘mga pamilihan’ ang natural at tuwirang katumbas sa kontekstong ito.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: ng mga tao
  rationale: Sa kontekstong pangkalahatan, ang ἄνθρωποι ay tumutukoy sa mga tao, hindi lamang sa mga lalaking nasa hustong gulang.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang kinikilalang titulong Semitiko na nasa tekstong Griyego; mas tumpak ito kaysa agad na palitan ng paliwanag na ‘Guro.’
theological_decisions:
- issue: Saklaw ng ‘ἀνθρώπων’
  choice: mga tao
  alternative: mga lalaki
  rationale: Walang palatandaan sa konteksto na kasarian ang binibigyang-diin; kolektibong sangkatauhan o publiko ang karaniwang diwa rito.
- issue: Pagpapanatili sa titulong ‘Rabbi’
  choice: Rabbi
  alternative: Guro
  rationale: Mahalaga sa sipi ang mismong titulong ikinatutuwang itawag sa kanila, kaya pinananatili ang transliterasyon at hindi tahimik na pinapakahulugan.
translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Pinanatili ang anyong parirala dahil pagpapatuloy ito ng naunang pangungusap sa Mateo 23:6.
