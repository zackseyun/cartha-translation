revisions:
- from: Kahabag-habag kayo, mga tagapagturo ng Kautusan at mga Pariseo, mga mapagkunwari! Sapagkat nililibot ninyo ang dagat at lupa upang makahikayat ng kahit isang taong aanib sa inyong pananampalataya[a]. At kapag umanib na siya, ginagawa ninyo siyang makalawang higit na anak ng Gehenna[b] kaysa sa inyo.
  to: Kahabag-habag kayo, mga tagapagturo ng Kautusan at mga Pariseo, mga mapagkunwari! Sapagkat nililibot ninyo ang dagat at lupa upang makapag-akay ng isang taong umanib sa inyong pananampalataya[a]. At kapag umanib na siya, ginagawa ninyo siyang dalawang beses na higit na anak ng Gehenna[b] kaysa sa inyo.
  rationale: Inayos ang hindi likas na pariralang "makalawang higit na" tungo sa malinaw na "dalawang beses na higit na." Bahagyang pinasimple rin ang unang sugnay upang mas tuwirang maipahayag ang layuning magkaroon ng isang proselito. Pinanatili ang lahat ng mahalagang termino, ang isahang pagtukoy, ang matinding himig ng οὐαί, at ang mga talababa.
