id: MAT.23.15
reference: Matthew 23:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: tl
  text: Kahabag-habag kayo, mga tagapagturo ng Kautusan at mga Pariseo, mga mapagkunwari! Sapagkat nililibot ninyo ang dagat at lupa upang makapag-akay ng isang taong umanib sa inyong pananampalataya[a]. At kapag umanib na siya, ginagawa ninyo siyang dalawang beses na higit na anak ng Gehenna[b] kaysa sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang proselito.” Ang proselito ay isang taong umanib sa pananampalatayang Judio.
    reason: lexical_alternative
  - marker: b
    text: 'O “anak ng impiyerno.” Sa Griyego: “anak ng Gehenna.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Kahabag-habag kayo
  rationale: Pinananatili ang lakas ng propetikong paghatol at babala ng οὐαί; mas marangal at matindi ito kaysa sa payak na “Kaawa-awa kayo.”
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Likas at malinaw sa karaniwang mambabasang Filipino bilang tawag sa kinikilalang mga dalubhasa at guro ng Kautusang Judio; ang “mga eskriba” ay mas literal ngunit maaari ngayong mapagkamalang mga tagakopya lamang.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang salin-tunog sa Filipino para sa pangkat na Judio.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Tumpak at natural na katumbas ng moral at panrelihiyong pagkukunwari sa konteksto.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: nililibot ninyo ang dagat at lupa
  rationale: Inihahayag ang malawak at masigasig na paglalakbay nang hindi nagiging pilit na literal; pinananatili rin ang tambalang “dagat at lupa.”
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: upang makahikayat ng kahit isang taong aanib sa inyong pananampalataya
  rationale: Ipinahahayag sa likas na Filipino ang pagsisikap na magkaroon ng isang proselito. Ang “kahit isang” ay nagbibigay-diin sa ἕνα sa konteksto, samantalang ang mas teknikal na “proselito” ay nasa talababa.
- source_word: ὅταν γένηται
  choice: kapag umanib na siya
  rationale: 'Likas na ipinahahayag ang ipinahiwatig na kalagayan: naging proselito o kaanib na ang taong tinutukoy.'
- source_word: υἱὸν γεέννης
  choice: anak ng Gehenna
  rationale: Pinananatili ang Semitikong idyomang “anak ng” at ang mismong terminong γεέννα, sa halip na agad itong ipantay sa mas pangkalahatang salitang “impiyerno.”
- source_word: διπλότερον ὑμῶν
  choice: makalawang higit ... kaysa sa inyo
  rationale: Pinananatili ang paghahambing at dobleng antas na ipinahahayag ng διπλότερον nang hindi nilulutas kung anong tiyak na sukatan ng pagiging “anak ng Gehenna” ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa γεέννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Ang tekstong Griyego ay gumagamit ng γεέννα, na may natatanging kasaysayang Judio at eskatolohikong ugnayan. Pinananatili ito sa pangunahing teksto, habang ibinibigay sa talababa ang pamilyar na katumbas.
- issue: Pagpapanatili sa idyomang υἱὸν γεέννης
  choice: anak ng Gehenna
  alternative: taong nakalaan sa impiyerno
  rationale: Hindi tahasang nilulutas ng salin ang Semitikong idyoma bilang isang tiyak na doktrinal na pahayag; pinananatili nito ang matinding talinghaga ng pinagmulan, kaugnayan, o hantungan.
- issue: Panlalaking isahan pagkatapos ng προσήλυτον
  choice: siya
  alternative: ang taong iyon
  rationale: Walang pangkasariang panghalip sa Filipino, kaya likas na naipahahayag ng “siya” ang isahang tinutukoy nang hindi nagdaragdag o nag-aalis ng kahulugang nasa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tagapagturo ng Kautusan” para madaling maunawaan ang gampanin ng γραμματεῖς, at pinanatili ang “Gehenna” at “anak ng” upang hindi mapawi ang makasaysayan at teolohikong kulay ng orihinal.
