id: MAT.11.27
reference: Matthew 11:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: tl
  text: Ipinagkatiwala na sa akin ng aking Ama ang lahat ng bagay. Walang nakakakilala[a] sa Anak kundi ang Ama; at walang nakakakilala sa Ama kundi ang Anak at ang sinumang piliin ng Anak na ihayag niya sa taong iyon ang Ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubos na nakakakilala” sa dalawang pagbanggit; maaaring tumukoy ang pandiwang Griego sa ganap o malalim na pagkilala.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “at ang sinumang loobin ng Anak na ihayag niya sa taong iyon ang Ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw ng neuter plural nang hindi nililimitahan kung ano ang sakop.
- source_word: παρεδόθη
  choice: Ipinagkatiwala na
  rationale: Ipinapahayag ang natapos na pagkakaloob o paglilipat na may patuloy na bisa. Mas likas sa Filipino ang “ipinagkatiwala” kaysa literal na “ibinigay sa kamay,” bagaman maaari ring isaling “ibinigay.”
- source_word: ὑπὸ τοῦ πατρός μου
  choice: ng aking Ama
  rationale: Malinaw na ipinakikilala ang Ama bilang gumaganap sa passive na pandiwa at pinananatili ang natatanging ugnayang ipinahahayag ng “aking Ama.”
- source_word: ἐπιγινώσκει
  choice: nakakakilala
  rationale: Ang pandiwa ay tumutukoy sa tunay at malalim na pagkilala, ngunit hindi tiyak na kailangang lagyan ng tahasang pang-abay na “lubos.” Iniiwan sa talab ng konteksto ang lalim ng natatanging pagkakilalang ito; nakatala sa talababa ang posibleng mas mariing salin.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: sa Anak / sa Ama
  rationale: Ginagamit ang karaniwang mga titulong “Anak” at “Ama,” na may malaking titik dahil tiyak at magkatugma ang mga katawagan sa konteksto.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Likas na katumbas sa Filipino sa mga sugnay na nagtatangi kasunod ng pagtanggi.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς
  choice: ang sinumang piliin ng Anak
  rationale: Ipinananatili ang di-tiyak na tinutukoy at ang tunay na pagkukusa ng Anak, nang hindi binabago ito tungo sa simpleng pagnanais lamang.
- source_word: ἀποκαλύψαι
  choice: na paghayagan niya kung sino ang Ama
  rationale: Likas na ipinapahayag sa Filipino ang pagsisiwalat ng Anak tungkol sa Ama. Nililinaw ng “kung sino ang Ama” ang tinutukoy ng di-tahasang layon nang hindi nagdaragdag ng doktrinal na paliwanag.
theological_decisions:
- issue: Lakas ng ἐπιγινώσκω sa magkatumbas na pahayag tungkol sa pagkakilala ng Ama at Anak
  choice: nakakakilala
  alternative: lubos na nakakakilala
  rationale: Maaaring magpahiwatig ang pandiwa ng ganap o malalim na pagkilala, ngunit pinagtatalunan kung taglay ng tambalang anyo ang tahasang intensipikasyon sa talatang ito. Ang payak na “nakakakilala” ay nagpapanatili sa tunay na kalabuan, samantalang malinaw pa rin sa eksklusibong ayos ng pangungusap ang natatanging pagkakilala ng Ama at Anak.
- issue: Pagkukusa sa βούληται
  choice: piliin
  alternative: loobin
  rationale: Ang “piliin” ay malinaw at kasalukuyang Filipino na nagpapanatili sa kusang pasiya ng Anak. Ang “loobin” ay posible ngunit mas pormal at maaaring magdala ng mas tiyak na teolohikal na himig kaysa hinihingi ng pandiwa.
- issue: Tinutukoy ng layon ng ἀποκαλύψαι
  choice: kung sino ang Ama
  alternative: siya
  rationale: Ang hindi tahasang layon ay tumutukoy sa Ama. Sa Filipino, maaaring maging malabo kung “siya” lamang ang gagamitin dahil kapwa malapit ang Anak at Ama; ang pagbabanggit sa Ama ay nagpapalinaw sa reperensiya nang hindi nilulutas ang iba pang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng paralelismo ng pagkakilala sa Anak at sa Ama. Iniwasan ang sobrang literal na hulma ng Griego kung magiging malabo o di-likas sa Filipino.
