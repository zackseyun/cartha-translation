id: MAT.11.30
reference: Matthew 11:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: tl
  text: Sapagkat mabuti ang aking pamatok, at magaan ang aking pasanin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang paanyaya ni Jesus.
- source_word: ζυγός
  choice: pamatok
  rationale: Pinananatili ang konkretong talinghaga ng kasangkapang ipinapasan sa hayop, na maaari ring tumukoy sa pagpapasakop sa pamumuno at pagtuturo.
- source_word: χρηστός
  choice: mabuti
  rationale: Saklaw ng salita ang pagiging mabuti, kaaya-aya, at hindi mabagsik. Ang “mabuti” ay natural sa Tagalog at pinananatili ang diin sa katangian ng pamatok, sa halip na paliitin ito sa ideyang “madali” lamang.
- source_word: φορτίον
  choice: pasanin
  rationale: Likas at malinaw na katumbas ng bagay o bigat na dinadala.
- source_word: ἐλαφρόν
  choice: magaan
  rationale: Tuwirang pinananatili ang paghahambing sa bigat ng isang pasanin.
theological_decisions:
- issue: Kahulugan ng χρηστός bilang paglalarawan sa pamatok ni Jesus
  choice: mabuti
  alternative: madali / banayad / kaaya-aya
  rationale: Hindi ipinapahayag ng Griyego na walang hinihingi ang pagsunod kay Jesus. Ang “mabuti” ay nagpapanatili sa positibong katangian ng kanyang pamatok nang hindi awtomatikong ginagawang “madali” ang pagdidisipulo.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang tradisyonal ngunit malinaw na larawang “pamatok,” at ang magkatambal na “pamatok” at “pasanin.”
