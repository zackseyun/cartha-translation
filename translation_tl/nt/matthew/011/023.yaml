id: MAT.11.23
reference: Matthew 11:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: tl
  text: At ikaw, Capernaum, itataas ka ba hanggang sa langit? Bababa ka hanggang sa Hades.[a] Sapagkat kung naganap sa Sodoma ang mga makapangyarihang gawa na naganap sa iyo, nanatili sana ito hanggang ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dako ng mga patay.” Sa Griyego, Hades, hindi Gehenna.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Capernaum
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: itataas ka ba hanggang sa langit?
  rationale: Itinuring ang μή kasama ng pandiwang nasa hinaharap bilang retorikal na tanong na umaasang hindi ang sagot. Pinanatili ng “itataas” at “hanggang sa langit” ang tinig na balintiyak at ang larawang pangkalawakan.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Bababa ka hanggang sa Hades
  rationale: Tuwirang ipinapahayag ng “bababa” ang καταβαίνω. Pinanatili ang “Hades” upang hindi ito ipantay agad sa Gehenna o sa mas malawak na konsepto ng impiyerno.
- source_word: δυνάμεις
  choice: mga makapangyarihang gawa
  rationale: Sinasaklaw nito kapwa ang mga kongkretong ginawa at ang kapangyarihang nahayag sa mga iyon, nang hindi nililimitahan sa makabagong pakahulugan ng “mga himala.”
- source_word: γενόμεναι ἐν σοί
  choice: mga makapangyarihang gawang naganap sa iyo
  rationale: Ipinakikita ng “naganap” na ang mga gawang ito ay nangyari sa loob ng lunsod, na tuwirang kinakausap bilang isang persona.
- source_word: ἐγενήθησαν
  choice: kung sa Sodoma naganap
  rationale: Ang ayos na ito ay natural sa Filipino at malinaw na naghahayag ng kundisyong salungat sa aktuwal na nangyari.
- source_word: ἔμεινεν ἂν
  choice: nanatili sana ito
  rationale: Ipinahahayag ng “sana” ang di-naganap na bunga, habang ang isahang “ito” ay tumutukoy sa Sodoma bilang isang lunsod.
- source_word: μέχρι τῆς σήμερον
  choice: hanggang ngayon
  rationale: Natural at tuwirang katumbas ito ng temporal na parirala.
theological_decisions:
- issue: Paglalarawan sa ᾅδης
  choice: Hades
  alternative: dako ng mga patay; impiyerno
  rationale: Pinanatili ang transliterasyong “Hades” upang maingatan ang pagkakaiba nito sa Gehenna at maiwasang magpasok ng mas tiyak na doktrinal na pakahulugan kaysa sa salitang Griyego.
- issue: Anyo ng unang pangungusap tungkol sa pagtataas sa Capernaum
  choice: retorikal na tanong
  alternative: 'pahayag na may tahasang pagtanggi: “Hindi ka itataas hanggang sa langit”'
  rationale: Ang μή sa ganitong pagkakabuo ay malamang na nagpapakilala ng tanong na umaasang negatibo ang sagot; pinananatili ng tanong ang puwersa at bahagyang kalabuan ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tuwirang pakikipag-usap sa Capernaum at ang paghahambing nito sa Sodoma. Ang “mga makapangyarihang gawa” ay mas malapit sa lawak ng δυνάμεις kaysa sa mas makitid na “mga himala.”
