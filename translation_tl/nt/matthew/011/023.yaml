  source_fidelity: Tumpak ang retorikal na tanong, ang pagbaba sa Hades, at ang kundisyong salungat sa aktuwal na nangyari. Gayunman, ang magkasunod na “naganap” ay lumilikha ng hindi kailangang pag-uulit at bahagyang nagpapalabo sa ugnayan ng δυνάμεις at ng participial na γενόμεναι ἐν σοί.
  naturalness: Natural sa pangkalahatan ang rehistro, ngunit mas malinaw at mas maayos sa modernong Filipino ang “mga makapangyarihang gawa na naganap sa iyo” kaysa “mga makapangyarihang gawang naganap sa iyo,” lalo na sa loob ng pangungusap na mayroon nang “naganap sa Sodoma.”
  terminology: Ang “Hades” ay wastong pinanatili at ang talababa ay maingat na nililinaw na hindi ito Gehenna. Ang “mga makapangyarihang gawa” ay angkop para sa δυνάμεις at hindi naglilimita sa kahulugang “himala.”
