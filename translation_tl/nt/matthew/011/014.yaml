lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay sa Filipino at pinananatili ang tuwirang ugnayan sa naunang pahayag.
- source_word: εἰ θέλετε δέξασθαι
  choice: kung handa ninyong tanggapin ito
  rationale: Ipinahahayag ng θέλετε kasama ng pawatas ang kusang kahandaan, at natural sa makabagong Filipino ang “tanggapin ito” para sa ipinahihiwatig na layon.
- source_word: αὐτός
  choice: siya
  rationale: Tumutukoy ito kay Juan Bautista; ang payak na “siya” ay malinaw at natural nang hindi nagdaragdag ng di-tiyak na pagdidiin.
- source_word: ἐστιν Ἠλίας
  choice: siya ang Elias
  rationale: Pinananatili ang tuwirang pagkakakilanlang isinasaad ng Griyego at ginagamit ang nakaugaliang anyo ng pangalan sa Bibliyang Filipino.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: na nakatakdang dumating
  rationale: Pinananatili ang inaasahang pagdating ayon sa hula nang hindi ito ginagawang simpleng agarang pangyayari.
theological_decisions:
- issue: Pagkakakilanlan ni Juan Bautista kay Elias
  choice: “siya ang Elias na nakatakdang dumating”
  alternative: “ginagampanan niya ang papel ni Elias” / “tulad siya ni Elias”
  rationale: Tuwirang pagkakakilanlan ang nasa Griyego, ngunit may paunang kundisyon tungkol sa pagtanggap ng mga nakikinig. Pinananatili ang parehong lakas at tensiyong teolohikal nang hindi nilulutas kung paano natutupad kay Juan ang hula tungkol kay Elias.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handa ninyong” upang natural na ipahayag ang kusang pagtanggap, habang pinanatili sa pangunahing teksto ang tuwirang “siya ang Elias” at ang kaugnay na interpretibong tensiyon.
