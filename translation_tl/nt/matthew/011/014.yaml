  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: tl
  text: At kung nais ninyo itong tanggapin,[a] siya ang Elias na nakatakdang dumating.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung nais ninyong tanggapin ito.”
    reason: lexical_alternative
  - marker: b
    text: Ipinakikilala rito si Juan Bautista bilang si Elias na darating ayon sa pangako. Ihambing ang Malakias 4:5 at Mateo 17:10–13.
