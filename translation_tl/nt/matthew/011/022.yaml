base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: Sa araw ng paghuhukom, mas magiging magaan para sa Tiro at Sidon kaysa para sa inyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mas matitiis para sa Tiro at Sidon kaysa para sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Nagpapahayag ng mariing pagsalungat sa naunang pagtuligsa at angkop sa marangal ngunit likas na modernong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Likas na pormula ng tuwirang pananalita na pinananatili ang personal at taimtim na diin.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: sa Tiro at Sidon
  rationale: Ipinahihiwatig ng datibo kung kanino magiging mas magaan ang karanasan sa paghuhukom.
- source_word: ἀνεκτότερον
  choice: mas magaan ang parusa
  rationale: Likas na Tagalog para sa paghahambing ng bigat ng mararanasan sa konteksto ng paghuhukom; ang salitang 'parusa' ay ipinahiwatig ng konteksto ngunit hindi tahasang nasa pang-uri, kaya itinatala ang mas pormal na alternatibo sa talababa.
- source_word: ἔσται
  choice: magiging
  rationale: Tumpak na naghahayag ng hinaharap na kalagayan, bagaman sa likas na ayos ng pangungusap ay naipapaloob ito sa pariralang 'mas magaan ang parusa' kasunod ng panandang panahong hinaharap.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: Sa araw ng paghuhukom
  rationale: Malinaw at karaniwang Tagalog para sa takdang pangyayaring hudisyal sa hinaharap.
- source_word: κρίσεως
  choice: paghuhukom
  rationale: Pinananatili ang malawak na hudisyal na diwa at hindi ito nililimitahan sa hatol na kaparusahan lamang.
- source_word: ἢ ὑμῖν
  choice: kaysa sa inyo
  rationale: Maikli at tumpak na kinukumpleto ang paghahambing sa mga kinakausap.
theological_decisions:
- issue: Kalikasan ng darating na paghuhukom
  choice: araw ng paghuhukom
  alternative: isang araw ng paghuhukom
  rationale: Bagaman walang pantukoy ang Griyego, sa konteksto ay tumutukoy ito sa kinikilalang pangwakas na paghuhukom; hindi nagdaragdag ang salin ng ibang detalye tungkol dito.
- issue: Ipinahihiwatig na antas ng parusa
  choice: mas magaan ang parusa
  alternative: mas matitiis
  rationale: Ipinakikita ng paghahambing na magkaiba ang bigat ng mararanasan, ngunit hindi ipinapaliwanag ng talata ang batayan o eksaktong anyo ng pagkakaibang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang mga kinagawiang pangalang “Tiro” at “Sidon.”
