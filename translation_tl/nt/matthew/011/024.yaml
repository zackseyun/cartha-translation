base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa iyo: sa araw ng paghuhukom, mas magiging matitiis ang hatol sa lupain ng Sodoma kaysa sa iyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mas magiging magaan ang hatol sa lupain ng Sodoma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ngunit
  rationale: Malakas na panalungat at transisyon ito mula sa naunang pahayag; likas at marangal ang “Ngunit” sa makabagong Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa iyo
  rationale: Pinananatili ang tuwirang pormula ng pagsasalita at ang isahang kinakausap sa konteksto.
- source_word: γῇ Σοδόμων
  choice: sa lupain ng Sodoma
  rationale: Tahasang pinananatili ang γῇ bilang “lupain,” hindi lamang ang pangalan ng lungsod.
- source_word: ἀνεκτότερον
  choice: mas magaan ang parusa
  rationale: Sa konteksto ng paghuhukom, natural nitong ipinahahayag na mas madaling tiisin ang sasapiting hatol, nang hindi ipinapalagay na ang lupain mismo ang nakararanas.
- source_word: ἔσται
  choice: '[ipinahahayag sa sugnay na] mas magaan ang parusa'
  rationale: Ang aspektong panghinaharap ay malinaw mula sa “sa araw ng paghuhukom”; likas sa Tagalog na hindi na tahasang tumbasan ang kopulang panghinaharap.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: sa araw ng paghuhukom
  rationale: Tumpak at karaniwang makabagong Tagalog para sa panahong eskatolohikal ng paghatol.
- source_word: ἢ σοί
  choice: kaysa sa iyo
  rationale: Pinananatili ang isahang panghalip at ang tuwirang propetikong pakikipag-usap sa lungsod na isinapersona.
theological_decisions:
- issue: Tinutukoy ng isahang σοί
  choice: Panatilihin ang “sa iyo” bilang tuwirang pakikipag-usap sa lungsod na isinapersona.
  alternative: “kaysa sa inyong mga tagaroon”
  rationale: Isahan ang Griyego at ipinagpapatuloy nito ang propetikong pagtawag sa lungsod; hindi pinalalawak ang kahulugan sa paraang wala sa teksto.
- issue: Diwa ng ἀνεκτότερον sa paghuhukom
  choice: “mas magaan ang parusa”
  alternative: “mas matitiis” / “mas mapagtitiisan”
  rationale: Ginagawang malinaw at natural sa Tagalog ang paghahambing sa bigat ng sasapiting hatol, habang inilalagay sa talababa ang mas pormal at tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sodoma,” ang karaniwang anyong Filipino ng pangalang Sodom. Ang tutuldok ay natural na naghahanda sa maringal na pahayag ng paghuhukom.
