    issue: Ang “mas magaan ang parusa” ay hindi tuwirang katumbas ng ἀνεκτότερον.
    rationale: Ang salitang Griyego ay comparative ng “matitiis/mapagtitiisan.” Ang “parusa” ay nagdaragdag ng mas espesipikong konsepto kaysa sa teksto, samantalang ang “mas magaan” ay nagpapalit ng leksikal na larawan.
  - severity: low
    issue: Hindi tahasang naipapahayag ang panghinaharap na ἔσται sa kasalukuyang pangungusap.
    rationale: Bagaman maaaring ipahiwatig ng “sa araw ng paghuhukom” ang hinaharap, ang “magiging” ay likas at malinaw na tumutugon sa future copula.
  revised_text: 'Ngunit sinasabi ko sa iyo: sa araw ng paghuhukom, mas magiging matitiis ang hatol sa lupain ng Sodoma kaysa sa iyo.[a]'
