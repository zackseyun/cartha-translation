base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: tl
  text: Ngunit ano ang pinuntahan ninyo roon upang makita? Isang propeta? Oo, sinasabi ko sa inyo, at higit pa sa isang propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mas dakila kaysa sa isang propeta.” Mas literal sa Griyego: “higit pa sa isang propeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Ipinakikita ang pagsalungat sa naunang sunod-sunod na retorikal na tanong sa isang natural at marangal na paraan.
- source_word: τί ἐξήλθατε
  choice: ano ang pinuntahan ninyo roon
  rationale: Pinananatili ang τί bilang tanong tungkol sa bagay o taong pinuntahan nilang makita, hindi bilang tanong na ‘bakit.’ Ang ‘roon’ ay likas na pantukoy sa pook na pinuntahan sa konteksto.
- source_word: ἰδεῖν
  choice: upang makita
  rationale: Ipinahahayag ang layunin ng pagpunta at tuwirang tumutugma sa infinitibong ‘makita.’
- source_word: προφήτην
  choice: isang propeta
  rationale: Ang pangngalang isahan na walang artikulo ay natural na ipinahahayag nang di-tiyak sa Filipino.
- source_word: ναί
  choice: Oo
  rationale: Tuwirang pagsang-ayon sa retorikal na tanong at karaniwan sa makabagong Filipino.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Malinaw at natural na salin ng karaniwang pormulang pandiskurso ni Jesus.
- source_word: καὶ περισσότερον προφήτου
  choice: at higit pa sa isang propeta
  rationale: Pinananatili ang paghahambing at ang sadyang maikli at bahagyang di-tiyak na anyo ng Griyego nang hindi nagdaragdag ng paliwanag tungkol sa kung paano nakahihigit si Juan.
theological_decisions:
- issue: Ang pagkakakilanlan at katayuan ni Juan Bautista sa sinabi ni Jesus
  choice: higit pa sa isang propeta
  alternative: isang higit na dakila kaysa sa isang propeta
  rationale: Itinataas ng pahayag si Juan lampas sa kategorya ng propeta, ngunit hindi ipinaliliwanag sa sugnay na ito kung paano. Pinananatili ng salin ang bigat at tensiyong teolohikal nang walang idinadagdag na paliwanag mula sa tradisyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘upang’ sa halip na mas kolokyal na ‘para’ upang mapanatili ang angkop na rehistro, habang nananatiling madaling maunawaan.
