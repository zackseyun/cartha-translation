  source_fidelity: 'Tumpak ang pagsasalin ng lahat ng pangunahing elemento: ang paliwanag na γάρ (“Sapagkat”), ang aorist na ἦλθεν (“dumating”), ang μήτε...μήτε na saklaw (“hindi kumakain ni umiinom”), ang pangkasalukuyang λέγουσιν (“sinasabi nila”), at ang literal na paratang na Δαιμόνιον ἔχει (“May demonyo siya”). Hindi nagdaragdag ang salin ng “tinapay” o “alak,” na wala sa tekstong Griyego ng Mateo 11:18.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “hindi kumakain ni umiinom” ay katanggap-tanggap at maayos na paraan upang ipahayag ang magkapares na negatibong pahayag. Ang “May demonyo siya” ay tuwiran, idiomatiko, at angkop sa iniulat na paratang.
  terminology: Wasto ang “Juan” para sa Ἰωάννης at “demonyo” para sa δαιμόνιον. Ang “May demonyo siya” ay mas malapit sa literal na Griyego kaysa sa mas interpretibong “sinasapian siya ng demonyo,” habang malinaw pa ring paratang ito ng iba at hindi pahayag ng tagapagsalaysay.
