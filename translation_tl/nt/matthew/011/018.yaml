base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: tl
  text: Sapagkat dumating si Juan na hindi kumakain ni umiinom, at sinasabi nila, “May demonyo siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: dumating
  rationale: Karaniwang katumbas ng aorist na ἔρχομαι at malinaw na tumutukoy sa pagdating o paglitaw ni Juan sa kanyang ministeryo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Pamantayang anyo ng pangalang Ἰωάννης sa Tagalog.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: hindi kumakain ni umiinom
  rationale: Likas na Tagalog na nagpapanatili sa pinaikling paglalarawan ng Griyego sa mapagpigil na pamumuhay ni Juan, nang hindi idinaragdag ang tinapay o alak na wala sa talata.
- source_word: καὶ λέγουσιν
  choice: at sinasabi nila
  rationale: Pinananatili ang masigla at naglalahat na pangkasalukuyang panahunan at ang di-tiyak na tinutukoy ng 'nila'.
- source_word: Δαιμόνιον ἔχει
  choice: May demonyo siya
  rationale: Direkta at natural na katumbas ng literal na 'may demonyo,' at hindi ipinagkakamali ang δαιμόνιον sa διάβολος.
theological_decisions:
- issue: Paglalarawan sa paratang na Δαιμόνιον ἔχει
  choice: May demonyo siya
  alternative: Sinasapian siya ng demonyo
  rationale: Iniulat ng teksto ang paratang ng mga tao, hindi ang pagpapatibay ng tagapagsalaysay. Ang mas tuwirang anyo ay nagpapanatili sa pananalita at hindi nagdaragdag ng interpretasyong higit sa idyomang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ni” sa ikalawang negatibong sugnay upang maging maayos ang daloy nang hindi binabago ang saklaw ng μήτε...μήτε.
