base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: tl
  text: Ang may mga tainga[a] ay makinig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sinumang may mga tainga ay makinig.” Gumagamit ang Griyego ng pangkalahatang ekspresyong nasa anyong isahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang artikulo at pangkasalukuyang participle ay bumubuo ng pangngalang pariralang tumutukoy sa sinumang taong nagtataglay nito. Ang “Ang may” ay natural at maikli sa modernong Tagalog habang pinananatili ang anyong isahan at pangkalahatang diwa.
- source_word: ὦτα
  choice: mga tainga
  rationale: Maramihan ang salitang Griyego. Ang “mga tainga” ang tuwiran at likas na katumbas at nagpapanatili sa idyomatikong panawagan sa masusing pakikinig at pag-unawa.
- source_word: ἀκουέτω
  choice: ay makinig
  rationale: Ikatlong panauhang pangkasalukuyang pautos ito. Sa Tagalog, natural na naihahayag ng “ay makinig” ang pautos na “let him hear,” at saklaw nito ang hindi lamang pagdinig kundi ang pagbibigay-pansin sa sinabi.
theological_decisions:
- issue: Pangkalahatang ekspresyong isahan
  choice: Ang may mga tainga ay makinig.
  alternative: Sinumang may mga tainga ay makinig.
  rationale: Pangkalahatan ang tinutukoy ng Griyegong parirala ngunit nasa anyong isahan. Pinananatili ng “Ang may” ang maigsi at kinatawang anyo nang hindi nagpapasok ng tahasang kasariang hindi kailangang markahan sa Tagalog. Ang “Sinumang” ay posible ngunit bahagyang mas tahasang nagpapaliwanag sa pangkalahatang diwa.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang “makinig” sa halip na “duminig” dahil mas natural ito sa kasalukuyang gamit at naihahatid ang panawagang magbigay-pansin.
