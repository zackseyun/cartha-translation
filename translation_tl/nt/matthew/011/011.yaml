id: MAT.11.11
reference: Matthew 11:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: tl
  text: '“Tunay na sinasabi ko sa inyo: sa mga ipinanganak ng babae[b], walang sinumang lumitaw[a] na higit na dakila kaysa kay Juan Bautista. Ngunit ang pinakamababa[c] sa kaharian ng langit ay higit na dakila kaysa sa kanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ibinangon.” Ang pandiwang Griyego ay maaaring mangahulugang “lumitaw” o “ibinangon”; dito, malamang na tumutukoy ito sa paglitaw sa kasaysayan, hindi sa muling pagkabuhay.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga ipinanganak ng babae” ay isang Semitikong paraan ng pagtukoy sa mga tao.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “ang mas mababa” o “ang mas maliit.” Pahambing ang literal na anyo sa Griyego, ngunit dito ay malamang na tumutukoy sa may pinakamababang ranggo o katayuan sa kaharian ng langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tunay na sinasabi ko sa inyo
  rationale: Pinananatili ang maringal at may-awtoridad na pormula ni Jesus habang nananatiling malinaw sa modernong Tagalog.
- source_word: οὐκ ἐγήγερται
  choice: walang lumitaw
  rationale: Likas itong tumutukoy sa paglitaw ng isang tao sa kasaysayan at iniiwasang awtomatikong ipakahulugan bilang muling pagkabuhay; inilalahad sa talababa ang posibleng literal na alternatibo.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: sa mga ipinanganak ng babae
  rationale: Pinananatili ang Semitikong anyo ng pananalita sa halip na palitan agad ng mas interpretibong ‘sa sangkatauhan.’
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: higit na dakila kaysa kay Juan na Tagapagbautismo
  rationale: Malinaw na ipinapahayag ang paghahambing at isinasalin ang βαπτιστής bilang katawagang nagsasaad ng gawain ni Juan.
- source_word: ὁ δὲ μικρότερος
  choice: Ngunit ang pinakamababa
  rationale: Bagaman pahambing ang anyong Griyego, maaari itong tumukoy sa may pinakamababang ranggo o kalagayan. Ang ‘pinakamababa’ ang pinakanatural na katumbas sa konteksto.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: sa kaharian ng langit
  rationale: Ito ang natural at kinikilalang Tagalog para sa karaniwang parirala ni Mateo; hindi kailangang gayahin ang pangmaramihang anyo ng ‘mga langit.’
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ay higit na dakila kaysa sa kanya
  rationale: Tapat na pinananatili ang tahasang paghahambing kay Juan nang hindi ipinapaliwanag kung sa anong diwa ito totoo.
theological_decisions:
- issue: Ang kadakilaan ni Juan kung ihahambing sa pinakamababa sa kaharian
  choice: Tuwirang panatilihin ang kabalintunaang paghahambing nang walang dagdag na paliwanag sa teksto.
  alternative: Ipaliwanag na ang tinutukoy ay pribilehiyo sa kasaysayan ng pagliligtas, pagiging kabilang sa bagong tipan, o antas ng personal na kabanalan.
  rationale: Hindi mismo ipinaliliwanag ng talata kung bakit higit na dakila ang pinakamababa sa kaharian kaysa kay Juan. Ang pagsasalin ay hindi dapat magpasok ng isang tiyak na teolohikong paglutas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang biblikal na pariralang “ipinanganak ng babae” at ang teolohikong tensiyon ng pangwakas na paghahambing.
