  to: Noong panahong iyon, sumagot si Jesus at sinabi niya, “Pinupuri kita[a], Ama, Panginoon ng langit at lupa, sapagkat itinago mo ang mga bagay na ito sa mga marurunong at mga may-unawa, at inihayag mo ang mga ito sa maliliit na bata[b].”
