source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: tl
  text: Noong panahong iyon, sumagot si Jesus at sinabi niya, “Pinupuri kita[a], Ama, Panginoon ng langit at lupa, sapagkat itinago mo ang mga bagay na ito sa mga marurunong at mga may-unawa, at inihayag mo ang mga ito sa maliliit na bata[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Nagpapasalamat ako sa iyo.” Ang pandiwang Griyego ay maaaring magpahayag ng pasasalamat, papuri, o hayagang pagkilala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga sanggol.” Dito, malamang na metaporikal ang “maliliit na bata” para sa mga tumatanggap nang may pagpapakumbaba o tulad ng isang bata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Nang panahong iyon
  rationale: Likas na temporal na parirala sa Tagalog na nagpapanatili sa tagpuan ng salaysay nang hindi ipinahihiwatig na isang saglit lamang iyon.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sumagot ... at sinabi
  rationale: Pinananatili ang dalawang pandiwa at ang tekstura ng karaniwang pormulang pasalaysay, kahit walang tahasang naunang tanong.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Pinupuri kita
  rationale: Sa tuwirang pakikipag-usap sa Ama, ipinahahayag ng pandiwa ang hayagang pagkilala na may papuri o pasasalamat. Ang “Pinupuri kita” ay angkop sa tonong mapagpuri at hindi nagpapahiwatig ng pagtatapat ng kasalanan.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Ama, Panginoon ng langit at lupa
  rationale: Tuwirang pinananatili ang magkasunod na katawagan at ang diwa ng kapamahalaan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw at marangal na ipinakikita ang sanhi o batayan ng papuri ni Jesus.
- source_word: ἔκρυψας
  choice: itinago mo
  rationale: Direkta at natural na salin ng aktibong pandiwa, na pinananatiling ang Ama ang gumagawa.
- source_word: ταῦτα ... αὐτά
  choice: ang mga bagay na ito ... ang mga ito
  rationale: Pinananatili ang bukas na sanggunian ng mga panghalip sa mga katotohanan o realidad na tinutukoy sa konteksto.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: sa marurunong at nakauunawa
  rationale: 'Pinananatili ang pares na mga pangngalang hango sa pang-uri: yaong marurunong at yaong may pang-unawa, nang hindi dinaragdagan ng interpretasyon.'
- source_word: ἀπεκάλυψας
  choice: inihayag mo
  rationale: Karaniwan at angkop na salin para sa banal na pagbubunyag o pagpapakilala ng dating nakakubli.
- source_word: νηπίοις
  choice: sa maliliit na bata
  rationale: Pinananatili ang kongkretong larawan at posibleng metaporikal na diwa ng mga hamak o tumatanggap na tulad ng bata, sa halip na palitan ito ng isang abstraktong interpretasyon.
theological_decisions:
- issue: Ang Diyos ang tuwirang gumagawa ng pagtatago at paghahayag
  choice: “itinago mo ... at inihayag mo”
  alternative: “hinayaan mong manatiling nakatago ... at ipinaalam mo”
  rationale: Tuwirang aktibong mga pandiwa ang ginamit sa Griyego at ang Ama ang simuno. Pinananatili ng salin ang teolohikal na tensiyon nang hindi ito pinahihina sa paraang permisibo o ipinapaliwanag ayon sa isang partikular na doktrina.
- issue: Kahulugan ng νηπίοις
  choice: “maliliit na bata” bilang larawang maaaring metaporikal
  alternative: “mga sanggol” o ang interpretibong “mga mapagpakumbaba”
  rationale: Maaaring literal na tumukoy ang salita sa mga sanggol, ngunit sa paghahambing dito ay malamang na larawan ito ng mga tumatanggap na tulad ng bata. Pinananatili ang mismong metapora sa halip na palitan ng abstraktong kategorya.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sapagkat” upang panatilihin ang pormal na tonong biblikal nang hindi nagiging lipas. Pinanatili ang pormulang “sumagot ... at sinabi” at ang tuwirang banal na pagkilos upang igalang ang tekstura at teolohikal na tensiyon ng pinagmulan.
