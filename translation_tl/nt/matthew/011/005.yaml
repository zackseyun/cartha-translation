  to: Nagkakaroon ng paningin ang mga bulag, at nakakalakad ang mga pilay; nalilinis ang mga may ketong, at nakakarinig ang mga bingi; binubuhay ang mga patay, at ipinahahayag sa mga mahihirap ang mabuting balita.[a][b]
