  terminology: Pinananatili ang ‘mabuting balita’ para sa εὐαγγελίζονται at ang ‘ebanghelyo’ bilang leksikal na alternatibo sa talababa. Ang ‘Mesiyas’ at mga sanggunian sa Isaias ay angkop. Inilipat ang panandang [a] upang malinaw na nakakabit ito sa sugnay tungkol sa mabuting balita, samantalang ang [b] ay nananatiling para sa buong talaan.
