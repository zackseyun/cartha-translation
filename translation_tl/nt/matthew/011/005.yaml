base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: tl
  text: Nagkakaroon ng paningin ang mga bulag, at nakakalakad ang mga pilay; nalilinis ang mga may ketong, at nakakarinig ang mga bingi; binubuhay ang mga patay, at ipinahahayag sa mga mahihirap ang mabuting balita.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “ipinangangaral sa kanila ang ebanghelyo.” Balintiyak ang pandiwang Griyego: ang mga mahihirap ang tumatanggap ng mabuting balita.'
    reason: lexical_alternative
  - marker: b
    text: Ipinapaalala ng talaang ito ang Isaias 35:5–6 at 61:1, na naglalarawan ng mga tanda na kaugnay ng gawain ng Mesiyas.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: nakakakita ang mga bulag
  rationale: Sa konteksto ng pagpapagaling, ang ἀναβλέπουσιν ay tumutukoy sa pagtanggap o panunumbalik ng paningin. Likas at tuwiran sa modernong Tagalog ang “nakakakita.”
- source_word: χωλοὶ περιπατοῦσιν
  choice: nakakalakad ang mga pilay
  rationale: Pinananatili nito ang maikli at tuwirang paglalarawan sa naipanumbalik na kakayahang lumakad.
- source_word: λεπροὶ καθαρίζονται
  choice: nililinis ang mga may ketong
  rationale: Ang καθαρίζονται ay nasa balintiyak at may saklaw na higit sa pisikal na paggaling, kabilang ang pagiging malinis sa ritwal. Ang “mga may ketong” ay mas makatao at natural sa kasalukuyang Filipino kaysa sa isang katawagang ginagawang pagkakakilanlan ang karamdaman.
- source_word: κωφοὶ ἀκούουσιν
  choice: nakakarinig ang mga bingi
  rationale: Bagaman maaaring mangahulugang bingi o pipi ang κωφοί ayon sa konteksto, nililinaw ng ἀκούουσιν na pandinig ang tinutukoy rito.
- source_word: νεκροὶ ἐγείρονται
  choice: binubuhay ang mga patay
  rationale: Ipinapakita ng balintiyak na ang mga patay ang tumatanggap ng pagkilos. Ang “binubuhay” ay natural na Tagalog para sa pagbabangon ng patay sa kontekstong ito.
- source_word: πτωχοὶ
  choice: mga dukha
  rationale: Ang “dukha” ay malinaw at marangal na katumbas na nagpapanatili sa panlipunan at Isaias na himig ng πτωχός.
- source_word: εὐαγγελίζονται
  choice: ipinahahayag sa mga dukha ang mabuting balita
  rationale: Pinananatili nito ang kahulugan ng pagpapahayag ng mabuting balita at ang mga dukha bilang mga tumatanggap nito, nang hindi ginagawang teknikal na terminong pangsimbahan ang pandiwa.
theological_decisions:
- issue: Paglalarawan sa εὐαγγελίζονται kaugnay ng terminong “ebanghelyo”
  choice: ipinahahayag sa mga dukha ang mabuting balita
  alternative: ipinangangaral sa kanila ang ebanghelyo
  rationale: Pinananatili ng pangunahing salin ang aktuwal na ideya ng “mabuting balita,” ang pagtanggap ng mga dukha sa pagpapahayag, at ang mesiyanikong pahiwatig nang hindi nililimitahan ang salita sa mas huling teknikal na gamit.
- issue: Ang talaan ng mga himala bilang katibayan ng gawa ng Mesiyas
  choice: panatilihin ang tuwirang talaan at ilagay sa talababa ang kaugnayan sa Isaias
  alternative: idagdag sa pangunahing teksto na katuparan ito ng Isaias
  rationale: Malakas ang alusyon sa Isaias, ngunit hindi tahasang sinasabi ng tekstong Griyego rito na “bilang katuparan.” Kaya hindi idinaragdag ang interpretasyong iyon sa pangunahing teksto.
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang magkatulad na ayos ng mga parirala upang mapanatili ang maikli at sunod-sunod na ritmo ng tekstong Griyego. Ang mga panandang [a] at [b] ay inilagay sa dulo ng kaugnay na pahayag: ang [a] para sa εὐαγγελίζονται at ang [b] para sa buong talaang umaalingawngaw sa Isaias.'
