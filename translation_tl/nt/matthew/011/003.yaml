  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: tl
  text: at sinabi sa kanya, “Ikaw ba ang Darating[a], o may iba pa ba kaming dapat asahan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang darating” o “ang siyang darating.” Ang pananalitang Griyego ay maaaring gamitin bilang titulong tumutukoy sa hinihintay na Mesiyas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: at sinabi sa kanya
  rationale: Ang εἶπεν ay payak na “sinabi,” at ang αὐτῷ ay “sa kanya.” Idinagdag ang “at” upang likas na iugnay ang pangungusap sa naunang salaysay, gaya ng hinihingi ng konteksto.
- source_word: Σὺ εἶ
  choice: Ikaw ba
  rationale: Ang tahasang Σὺ ay napapanatili sa “Ikaw,” samantalang ang “ba” ang likas na pananda ng tuwirang tanong sa Tagalog.
- source_word: ὁ ἐρχόμενος
  choice: ang Darating
  rationale: Ang may-artikulong present participle ay substantibo at maaaring tumukoy sa hinihintay na persona. Pinananatili ng “ang Darating” ang maikli at tila-titulong anyo nang hindi tahasang isinasalin bilang “Mesiyas.”
- source_word: ἢ
  choice: o
  rationale: Karaniwang pangatnig na naghaharap ng alternatibo.
- source_word: ἕτερον
  choice: iba
  rationale: Ang ἕτερον ay “iba” o “ibang isa.” Sa tanong na ito, malinaw at likas ang “iba,” at hindi kailangang dagdagan ng “tao” o “isa.”
- source_word: προσδοκῶμεν
  choice: maghihintay kami
  rationale: Sa deliberatibong tanong, ipinahihiwatig nito kung dapat pa silang maghintay o umasa sa pagdating ng iba. Ang “maghihintay kami” ay natural sa Tagalog at akma sa eskatolohikal na konteksto, bagaman posible rin ang “aasahan namin.”
theological_decisions:
- issue: Mesiyanikong o titulong bisa ng ὁ ἐρχόμενος
  choice: Isinalin bilang “ang Darating” at nilagyan ng talababa.
  alternative: “ang siyang darating,” “ang hinihintay na darating,” o tahasang “ang Mesiyas”
  rationale: Sinusuportahan ng artikulo at ng konteksto ang pagkilala rito bilang katawagan sa hinihintay na persona, ngunit hindi tahasang sinasabi ng Griyego ang salitang “Mesiyas.” Kaya pinananatili ang pahiwatig at ang tunay na saklaw ng parirala nang hindi ito labis na nililinaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “ang Darating” ay sadyang maikli upang mapanatili ang anyong katawagan o titulo; ipinaliliwanag ng talababa ang alternatibong mas literal na pagbasa.
