id: MAT.11.10
reference: Matthew 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: tl
  text: 'Siya ang tinutukoy sa nasusulat: “Narito, isinusugo ko ang aking sugo sa harap ng iyong mukha[a], na maghahanda ng iyong daan sa unahan mo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas natural ding isalin: “sa unahan mo.” Literal sa Griyego: “sa harap ng iyong mukha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ
  choice: Siya ang tinutukoy
  rationale: Natural na paraan sa modernong Tagalog upang ipahayag ang mariing pagkilala sa taong tinutukoy, nang hindi idinaragdag ang salitang “lalaki” o inuulit ang alanganing literal na kayarian.
- source_word: γέγραπται
  choice: sa nasusulat
  rationale: Pinananatili ang nakagawiang pormula sa pagsipi sa Kasulatan at ang diwang nananatiling may bisa ang isinulat.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Angkop sa mataas ngunit nauunawaang rehistro ng isang propetikong sipi at pinupukaw nito ang pansin ng mambabasa.
- source_word: ἀποστέλλω
  choice: isinusugo ko
  rationale: Pinananatili ang masiglang aspektong pangkasalukuyan ng Griyego at ang ideya ng awtorisadong pagpapadala.
- source_word: ἄγγελόν
  choice: sugo
  rationale: Sa konteksto, tao at tagapagpauna ang tinutukoy, kaya “sugo” ang mas angkop kaysa “anghel.”
- source_word: πρὸ προσώπου σου
  choice: sa harap ng iyong mukha
  rationale: Sadyang pinananatili ang kongkretong larawan ng Griyego at ang pormal na himig ng siping mula sa Kasulatan.
- source_word: κατασκευάσει
  choice: maghahanda
  rationale: Tuwirang ipinapahayag ang paghahandang gagawin ng sugo at likas itong gamitin kasama ng “daan.”
- source_word: τὴν ὁδόν σου
  choice: iyong daan
  rationale: Pinananatili ang literal na larawan ng daan at ang maaari rin nitong metaporikal na pahiwatig.
- source_word: ἔμπροσθέν σου
  choice: sa unahan mo
  rationale: Natural sa Tagalog at naiiba nang sapat sa naunang “sa harap ng iyong mukha,” kaya napapanatili ang dalawang pariralang nasa Griyego.
theological_decisions:
- issue: Dalawang magkahawig na pariralang tumutukoy sa pagiging nasa unahan
  choice: Pinanatili kapwa ang “sa harap ng iyong mukha” at “sa unahan mo.”
  alternative: Pagsamahin o gawing pareho ang dalawa bilang “sa unahan mo.”
  rationale: May dalawang hiwalay na parirala sa tekstong Griyego, πρὸ προσώπου σου at ἔμπροσθέν σου. Ang pagpapanatili sa dalawa ay nag-iingat sa anyo at diin ng sipi nang hindi nilulutas o pinapakinis nang labis ang pag-uulit.
translation_notes:
  register: Makabago at malinaw na Tagalog na may marangal na himig para sa sipi sa Kasulatan. Ang “sugo” ay karaniwan at angkop sa konteksto; ang bahagyang pormal na “sa harap ng iyong mukha” ay sadyang pinanatili upang maipakita ang kongkretong pananalita ng pinagmulan.
