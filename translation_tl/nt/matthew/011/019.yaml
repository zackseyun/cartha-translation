id: MAT.11.19
reference: Matthew 11:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: tl
  text: Dumating ang Anak ng Tao na kumakain at umiinom, at sinasabi nila, “Tingnan ninyo! Matakaw at lasenggo, kaibigan ng mga maniningil ng buwis at ng mga makasalanan!” At ang karunungan ay napatunayang tama sa pamamagitan ng kanyang mga gawa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling sugnay na, “At ang karunungan ay pinatunayang tama ng kanyang mga ginawa.”
    reason: lexical_alternative
  - marker: b
    text: '“Mga gawa” ang mababasa sa tekstong Griyegong sinusunod dito. “Mga anak” naman ang mababasa sa ilang manuskrito: “At ang karunungan ay napatunayang tama sa pamamagitan ng kanyang mga anak.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang salin ng pansariling titulo at ang Semitikong at teolohikong kabuluhan nito nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: ἐσθίων καὶ πίνων
  choice: kumakain at umiinom
  rationale: Tuwirang inilalarawan ang karaniwang ginagawa ni Jesus at pinananatili ang kaibahan sa paraan ng pamumuhay ni Juan nang hindi pinalalabis bilang pagpapakasasa.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo!
  rationale: Likas at makabagong panawag-pansin sa maramihang kausap na nagpapanatili sa mariing himig ng paratang.
- source_word: φάγος
  choice: matakaw
  rationale: Karaniwang salitang Tagalog na malinaw na naghahatid ng mapanirang paratang tungkol sa labis na pagkain.
- source_word: οἰνοπότης
  choice: lasenggo
  rationale: Ipinahahayag ang paratang ng labis na pag-inom, hindi lamang ang neutral na pag-inom ng alak.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: kaibigan ng mga maniningil ng buwis at ng mga makasalanan
  rationale: Pinananatili ang ayos at panlipunan-relihiyosong bigat ng dalawang katawagan.
- source_word: ἐδικαιώθη
  choice: napatunayang tama
  rationale: Sa kontekstong ito, ang pandiwa ay nangangahulugang naipakitang tama o nabigyang-katwiran; ang salin ay malinaw at likas sa modernong Tagalog.
- source_word: ἡ σοφία
  choice: ang karunungan
  rationale: Pinananatili ang personipikadong pahayag nang hindi tinutukoy kung ito ay si Jesus, ang plano ng Diyos, o iba pang mas makitid na pagpapakahulugan.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: sa pamamagitan ng kanyang mga gawa
  rationale: Ipinahahayag na ang mga gawa ang katibayan ng pagiging tama ng karunungan at pinananatili ang personipikasyon sa paggamit ng “kanyang.”
theological_decisions:
- issue: Kahulugan ng “karunungan” sa huling sugnay
  choice: Panatilihin ang personipikadong “karunungan” nang walang tahasang pagkakakilanlan.
  alternative: Tukuyin ito bilang si Jesus mismo o bilang ang nagliligtas na karunungan o plano ng Diyos.
  rationale: Hindi tahasang nilulutas ng teksto ang pagkakakilanlan nito, kaya pinananatili ng salin ang pampanitikan at teolohikong tensiyon.
- issue: Anyo ng teksto sa huling sugnay
  choice: “mga gawa,” ayon sa ἔργων ng SBLGNT
  alternative: “mga anak,” ayon sa τέκνων sa ilang manuskrito at sa kahawig na pahayag sa Lucas 7:35
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na edisyong Griyego, habang inilalahad sa talababa ang mahalagang tekstuwal na baryante.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo!” upang maging likas ang mariing panawag-pansin; ang “matakaw at lasenggo” ay nagpapanatili sa mapanirang himig ng orihinal. Hindi nilutas ang personipikasyon ng karunungan, at hindi dinagdagan ng adversatibong “ngunit” ang payak na καί.
