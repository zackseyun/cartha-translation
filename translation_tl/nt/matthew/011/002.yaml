  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: tl
  text: Nang mabalitaan ni Juan, habang nasa bilangguan, ang mga gawa ng Mesiyas[a], ipinadala niya ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga gawa ng Cristo.”
    reason: Alternatibong salin sa Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Nagmamarka ito ng paglipat sa salaysay. Sapat na sa natural na Tagalog ang pagsisimula sa temporal na sugnay na “Nang…” nang hindi nagdaragdag ng tahasang panandang panahong wala sa Griyego.
- source_word: ἀκούσας
  choice: Nang mabalitaan ni Juan
  rationale: Ang aorist participle ay natural na ipinapahayag bilang temporal na sugnay. Ang “mabalitaan” ay angkop dahil ang narinig ni Juan ay ulat tungkol sa mga ginawa ng Mesiyas.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: sa bilangguan
  rationale: Malinaw at dignidad na karaniwang salin para sa kinaroroonan ni Juan habang siya ay nakakulong.
- source_word: τὰ ἔργα
  choice: ang mga gawa
  rationale: Pinananatili ng “mga gawa” ang lawak ng ἔργα, kabilang ang makapangyarihang mga ginawa at iba pang gawain ng ministeryo.
- source_word: τοῦ χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo. Ipinahahayag ng “Mesiyas” ang kahulugan at kontekstong Judio nito sa paraang pamilyar sa modernong mambabasa.
- source_word: πέμψας
  choice: nagpasabi siya
  rationale: Ipinahihiwatig ng kasunod na talata ang mensaheng ipinadala. Natural na ipinapakita ng “nagpasabi” na nagpadala si Juan ng mensahe sa pamamagitan ng mga tagapamagitan.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: sa pamamagitan ng kanyang mga alagad
  rationale: Ang διά na may genitive ay nagsasaad ng tagapamagitan o ahensiya; malinaw itong naipapahayag ng “sa pamamagitan ng.”
theological_decisions:
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang salita ay ginagamit dito bilang titulo, kaya isinalin ang kahulugan nito sa halip na ituring na wari’y personal na pangalan. Inilagay sa talababa ang tradisyonal na anyong “Cristo” upang mapanatili ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “mabalitaan” para sa pagkarinig ni Juan ng ulat habang nasa bilangguan, at “nagpasabi” upang maipakita ang mensaheng ipinadala sa pamamagitan ng kanyang mga alagad. Hindi dinagdagan ng panimulang “Ngayon” ang banayad na panandang pandiskurso na δὲ.
