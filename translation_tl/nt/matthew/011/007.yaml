  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: tl
  text: 'Habang papaalis ang mga alagad ni Juan, nagsimulang magsalita si Jesus sa mga tao tungkol kay Juan: “Ano ang sinadya ninyong pagmasdan sa ilang? Isang tambo na inuuga ng hangin?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang larawan ng tambong inuuga ng hangin ay maaaring magpahiwatig ng pagiging di-matatag o pabago-bago. Inaasahan ng tanong ni Jesus ang sagot na hindi ganito si Juan.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Habang papaalis ang mga alagad ni Juan
  rationale: Ang genitive absolute ay nagsasaad ng kasabay na kilos. Nililinaw mula sa naunang konteksto na ang tinutukoy ng Τούτων ay ang mga alagad ni Juan; ang “papaalis” ay natural na nagpapahayag ng kilos na nagpapatuloy.
- source_word: ἤρξατο ... λέγειν
  choice: nagsimulang magsalita
  rationale: Tuwirang ipinapahayag ang inchoative construction na ἄρχομαι + infinitive at angkop sa pagsasalita ni Jesus sa mga tao.
- source_word: τοῖς ὄχλοις
  choice: sa mga tao
  rationale: Bagaman maramihan ang ὄχλοις, ang “mga tao” ang natural at malinaw na modernong Tagalog para sa mga nagkakatipong karamihan; iniiwasan ang mas makalumang “mga pulutong.”
- source_word: περὶ Ἰωάννου
  choice: tungkol kay Juan
  rationale: Natural na katumbas ng περί na may genitive bilang paksang tinutukoy.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Ano ang pinuntahan ninyo sa ilang upang pagmasdan?
  rationale: Pinananatili ang tanong na “ano,” hindi “bakit.” Ang “pagmasdan” ay kumakatawan sa θεάομαι bilang sadyang pagtingin o pagmamasid, at ang “ilang” ay ang karaniwang biblikal ngunit nauunawaang salin ng ἔρημος.
- source_word: κάλαμον
  choice: isang tambo
  rationale: Ang “tambo” ang tuwirang katumbas ng κάλαμος at pinananatili ang isahang larawang retorikal.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: inuuga ng hangin
  rationale: Pinananatili ang diwang pasibo at nagpapatuloy ng participle; natural ang “inuuga” sa Tagalog at mas malakas kaysa simpleng “iginagalaw.”
theological_decisions:
- issue: Tinutukoy ng Τούτων sa genitive absolute
  choice: Tahasan itong isinalin bilang “ang mga alagad ni Juan.”
  alternative: “Habang papaalis sila” o “Habang papaalis ang mga iyon.”
  rationale: Maliwanag sa agarang konteksto ng Mateo 11:2–6 na mga alagad ni Juan ang umaalis. Ang paglilinaw ay pangkonteksto at hindi nagdaragdag ng doktrina.
- issue: Pahiwatig ng larawan ng tambong inuuga ng hangin
  choice: Iniwan ang larawan sa pangunahing teksto at ipinaliwanag lamang sa talababa bilang posibleng pahiwatig ng pabago-bago o di-matatag na pagkatao.
  alternative: Isingit sa teksto ang interpretasyong “isang taong pabago-bago.”
  rationale: Pinananatili nito ang metapora at retorikal na tanong ng Griyego nang hindi ginagawang tahasang pahayag ang isang ipinahihiwatig na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “ilang” bilang pamilyar na terminong biblikal, “pagmasdan” upang mapanatili ang sadyang pagtingin sa θεάσασθαι, at “mga tao” sa halip na mas makalumang “mga pulutong.” Ang marker na [a] ay inilagay kaagad pagkatapos ng larawang ipinaliliwanag nito.
