translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kasuotan” upang mapanatili ang dignidad at ang pag-uulit ng larawan sa Griyego; ang “malalambot” ay sadyang pinanatili sa pangunahing teksto, habang nililinaw sa talababa ang pahiwatig na pino o marangya.
