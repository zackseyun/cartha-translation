  source_fidelity: Kailangang alisin ang “sa ilang.” Wala ito sa Griyegong teksto ng talatang ito; bagaman nasa mas malawak na konteksto ang ilang, ang ἐξήλθατε ay simpleng “lumabas/kayo’y nagpunta,” kaya hindi dapat idagdag sa mismong salin.
  naturalness: Mas natural ang “nakasuot ng malalambot na damit” kaysa “nakadamit ng malalambot na kasuotan.” Ang “malalambot na damit” ay bahagyang di-karaniwan ngunit sinasadyang pinananatili ang kongkretong pananalita ng μαλακά; nililinaw ng talababa ang diwang pino o marangya.
  terminology: Wasto ang “lalaki,” “Tingnan ninyo,” at “mga bahay ng mga hari.” Pinananatili ng “malalambot na damit” ang pag-uulit ng μαλακοῖς/τὰ μαλακά nang hindi ipinapasok sa pangunahing teksto ang mas interpretatibong “marangya.”
