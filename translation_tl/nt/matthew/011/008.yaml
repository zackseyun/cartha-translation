    issue: Idinagdag ang “sa ilang” sa unang tanong.
    rationale: Hindi kasama ang “ilang” sa ἀλλὰ τί ἐξήλθατε ἰδεῖν; at ang English audit trail ay hindi rin ito isinasama. Hindi sapat na dahilan ang konteksto upang magdagdag ng lokasyong wala sa talata.
  - severity: low
    issue: Medyo hindi natural ang “nakadamit ng malalambot na kasuotan.”
    rationale: Mas karaniwan at malinaw sa modernong Filipino ang “nakasuot ng ... damit,” habang napapanatili ang kahulugan at anyo ng Griyego.
