base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: tl
  text: Ngunit ano ang pinuntahan ninyo upang makita? Isang lalaking nakasuot ng malalambot na damit?[a] Tingnan ninyo, ang mga nagsusuot ng malalambot na damit ay nasa mga bahay ng mga hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasuot ng pinong damit” o “nakadamit nang marangya.” Literal na tumutukoy ang Griyego sa “malalambot na bagay/damit,” na nagpapahiwatig ng pino o marangyang pananamit.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nasa mga palasyo ng mga hari.” Mas literal sa Griyego ang “nasa mga bahay ng mga hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Pinananatili ang pagsalungat at pagpapatuloy ng sunod-sunod na retorikal na tanong ni Jesus.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: ano ang pinuntahan ninyo sa ilang upang makita
  rationale: Inilalahad ang layunin ng paglabas sa natural na Tagalog. Idinagdag ang “sa ilang” mula sa malinaw na konteksto ng paglabas patungo kay Juan, nang hindi binabago ang layon ng tanong.
- source_word: ἄνθρωπον
  choice: isang lalaking
  rationale: Ang panlalaking anyo ay angkop sa tuwirang pagtukoy kay Juan na Tagapagbautismo.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: nakadamit ng malalambot na kasuotan
  rationale: Pinananatili ang literal na larawan ng μαλακοῖς bilang malalambot na damit, habang ipinahihiwatig ng konteksto ang pino o marangyang kasuotan.
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Makabago at natural na panawag-pansin na nagpapanatili sa retorikal na diin ng Griyego.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ang mga nagsusuot ng malalambot na kasuotan
  rationale: Ang “nagsusuot” ay angkop sa diwang nakagawiang pagsusuot ng φοροῦντες, at inuulit ang parehong paglalarawan para sa lexical na pagkakapare-pareho.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: ay nasa mga bahay ng mga hari
  rationale: Malapit sa anyo ng Griyego at pinananatili ang mga pangmaramihang “bahay” at “mga hari”; maaaring idiomatikong tumukoy sa mga palasyo.
