- from: Ngunit ano ang pinuntahan ninyo sa ilang upang makita? Isang lalaking nakadamit ng malalambot na kasuotan?[a] Tingnan ninyo, ang mga nagsusuot ng malalambot na kasuotan ay nasa mga bahay ng mga hari.[b]
  to: Ngunit ano ang pinuntahan ninyo upang makita? Isang lalaking nakasuot ng malalambot na damit?[a] Tingnan ninyo, ang mga nagsusuot ng malalambot na damit ay nasa mga bahay ng mga hari.[b]
  rationale: Inalis ang di-nakasulat na “sa ilang” upang tumugma sa saklaw ng Griyegong teksto. Pinalitan ang “nakadamit ng malalambot na kasuotan” ng mas natural na “nakasuot ng malalambot na damit,” at inayos nang bahagya ang talababa para sa pagkakatugma sa pangunahing teksto. Nananatili ang retorikal na anyo, ang panlalaking sanggunian, ang pag-uulit ng “malalambot,” at ang pangmaramihang “mga bahay ng mga hari.”
