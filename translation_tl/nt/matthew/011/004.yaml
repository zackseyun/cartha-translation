  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: tl
  text: At sumagot si Jesus sa kanila[a], “Humayo kayo at ibalita kay Juan ang inyong naririnig at nakikita:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “At sumagot at sinabi ni Jesus sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagpapatuloy sa salaysay nang hindi nagdaragdag ng tiyak na pahiwatig ng panahon.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sumagot
  rationale: Ang tambalang pormulang Griyego ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “sumagot”; ipinakikita na ng kasunod na tuwirang sipi ang pagkilos ng pagsasalita.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Tagalog at ang pantukoy na “si” para sa pangalang pantangi.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tumutukoy ito sa mga sugo ni Juan at likas na isinasalin bilang di-tuwirang layon na “sa kanila.”
- source_word: Πορευθέντες
  choice: Humayo kayo
  rationale: Ang participle na kasama ng pautos ay may puwersang pautos. Ang “Humayo kayo” ay malinaw, marangal, at pinananatili ang utos na pumunta nang hindi nagdaragdag ng tahasang “bumalik,” na wala sa Griyego.
- source_word: ἀπαγγείλατε
  choice: ibalita
  rationale: Ipinahahayag ng pandiwa ang pag-uulat o paghahatid ng balita. Ang “ibalita” ay likas sa konteksto ng mga sugong maghahatid ng kanilang nasaksihan kay Juan.
- source_word: Ἰωάννῃ
  choice: kay Juan
  rationale: Ang datibong di-tuwirang layon ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: ἃ
  choice: ang
  rationale: Sa pariralang “ang inyong naririnig at nakikita,” likas na ipinahahayag ng nominalisadong sugnay ang kahulugang “kung ano” o “mga bagay na,” nang hindi mabigat ang anyo.
- source_word: ἀκούετε καὶ βλέπετε
  choice: inyong naririnig at nakikita
  rationale: Pinananatili ang magkatambal na kasalukuyang karanasan ng pakikinig at pagkakita sa isang likas na ayos sa Tagalog.
theological_decisions:
- issue: Pagpapahayag sa pormulang ἀποκριθεὶς ... εἶπεν
  choice: sumagot si Jesus sa kanila
  alternative: sa pagsagot ay sinabi ni Jesus sa kanila
  rationale: Estilistiko at pangwika ang pasya, hindi doktrinal. Ang pinaikling anyo ay natural sa Tagalog, samantalang inilalahad sa talababa ang mas pormal na pagtutumbas upang mapanatili ang katangian ng pormulang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Humayo kayo” bilang bahagyang mataas ngunit madaling maunawaang utos; iniwasan ang pagdaragdag ng “bumalik,” sapagkat hindi iyon tahasang nasa tekstong Griyego.
