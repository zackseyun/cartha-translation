translation:
  language: tl
  text: Oo[a], Ama, sapagkat ganoon ang naging kalugud-lugod sa iyong paningin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tunay nga”; o, “Sapagkat ganoon ang iyong mabuting kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Oo
  rationale: Tuwirang pagpapahayag ng pagsang-ayon sa konteksto ng panalangin; natural ito sa makabagong Tagalog.
- source_word: ὁ πατήρ
  choice: Ama
  rationale: Ang nominative na ginagamit bilang pantawag ay likas na maisasalin bilang tuwirang pagtawag na “Ama,” nang hindi gumagamit ng makalumang pantawag.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita rito ang dahilan ng pagsang-ayon; malinaw at marangal ang “sapagkat” sa kasalukuyang Tagalog.
- source_word: οὕτως
  choice: ito
  rationale: Tumutukoy pabalik sa paraan ng pagkilos ng Ama na binanggit sa naunang talata; mas natural ang “ito” kaysa sa literal na “gayon” sa pangungusap na ito.
- source_word: εὐδοκία ἐγένετο
  choice: ang nakalulugod
  rationale: Inihahatid ang diwa ng pagiging kalugod-lugod nang hindi ito pinatitindi tungo sa tiyak na kahulugang “pasya” o “layunin.”
- source_word: ἔμπροσθέν σου
  choice: sa iyong paningin
  rationale: Natural na idyomang Tagalog para sa literal na “sa harap mo,” na nagpapahayag ng pagtataya o pagkalugod ng Ama.
theological_decisions:
- issue: Kung ang εὐδοκία ay dapat ipakahulugang banal na pasya/layunin o banal na pagkalugod
  choice: “nakalulugod sa iyong paningin,” na nagbibigay-diin sa pagkalugod ng Ama
  alternative: “ayon sa iyong mabuting kalooban” o “ito ang iyong mabuting layunin”
  rationale: Hindi malinaw na hinihingi ng parirala ang mas matibay na kahulugan ng atas o itinakdang layunin. Pinananatili ng salin ang pagkalugod ng Ama at hindi isinasara ang mas malawak na usaping teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakalulugod sa iyong paningin” upang maging natural habang pinananatili ang evaluative na diwa ng Griyego at ang tunay na posibilidad ng alternatibong “mabuting kalooban.”
