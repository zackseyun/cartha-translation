  naturalness: Natural at marangal ang “Oo, Ama” at “sa iyong paningin.” Ang binagong parirala ay angkop sa makabagong Tagalog na may pormal na rehistrong pangkasulatan; mas malinaw ang ugnayan nito sa naunang pagkilos ng Ama kaysa “ito ang nakalulugod.”
  terminology: Ang “kalugud-lugod” ay angkop para sa εὐδοκία sa kontekstong ito sapagkat pinananatili nito ang diwa ng pagkalugod nang hindi ipinipilit ang “mabuting kalooban” bilang pasya o layunin. Ang “Ama” ay wastong tuwirang pantawag.
