  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: tl
  text: Ngunit mula sa mga araw ni Juan na Tagapagbautismo hanggang ngayon, dumaranas ng karahasan ang kaharian ng langit, at inaagaw ito ng mararahas na tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “puwersahang sumusulong ang kaharian ng langit, at inaagaw ito ng mga taong gumagamit ng puwersa.” Maaari ring unawain sa gitnang diwa ang pandiwang Griyego na isinaling “dumaranas ng karahasan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Ngunit mula
  rationale: Ipinahahayag ng ἀπό ang panimulang panahon, at ang δέ ay banayad na pang-ugnay o panalungat. Likas sa Tagalog ang “Ngunit mula” at hindi nito pinalalabis ang pagsalungat.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: sa mga araw ni Juan na Tagapagbautismo
  rationale: Pinananatili ng “mga araw” ang temporal na idyoma ng Griyego. Ang “Tagapagbautismo” ay malinaw, marangal, at tumutukoy sa kinikilalang papel ni Juan.
- source_word: ἕως ἄρτι
  choice: hanggang ngayon
  rationale: Natural at tuwirang katumbas na nagpapakita ng pagpapatuloy mula sa panahon ni Juan hanggang sa kasalukuyan ng nagsasalita.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Ito ang natural at nakaugaliang Tagalog para sa katangi-tanging parirala ni Mateo; hindi kailangang gawing maramihan ang “langit” ayon sa anyong Griyego.
- source_word: βιάζεται
  choice: dumaranas ng karahasan
  rationale: Pinipili sa pangunahing teksto ang maaaring pasibong kahulugan ng pandiwa. Malinaw ito sa modernong Tagalog at umaayon sa kasunod na pagbanggit sa mararahas na tao, habang inilalahad sa talababa ang tunay na posibleng gitna/intransitibong pagbasa.
- source_word: βιασταὶ
  choice: mararahas na tao
  rationale: Ipinakikita nito na ang tinutukoy ay mga taong gumagamit ng dahas. Mas natural sa Tagalog kaysa “mararahas na lalaki,” at hindi sapilitang nililimitahan sa kasarian ang pangkalahatang pangkat na tinutukoy ng panlalaking pangmaramihang anyo sa Griyego.
- source_word: ἁρπάζουσιν αὐτήν
  choice: inaagaw ito
  rationale: Ang “inaagaw” ay nagpapahiwatig ng marahas o puwersahang pagkuha, at natural na naihahatid ang diwa ng ἁρπάζω nang hindi nagpapaliwanag nang labis.
theological_decisions:
- issue: Kahulugan ng βιάζεται kaugnay ng kaharian
  choice: 'Pasibong diwa sa pangunahing teksto: “dumaranas ng karahasan ang kaharian ng langit.”'
  alternative: 'Gitna/intransitibong diwa: “buong-lakas na sumusulong ang kaharian ng langit.”'
  rationale: Tunay na malabo at matagal nang pinagtatalunan ang anyong Griyego. Mahusay na kaugnay ng pasibong pagbasa ang kasunod na “inaagaw ito ng mararahas na tao,” ngunit may matibay ding batayang leksikal ang pagbasa na ang kaharian ay buong-lakas na sumusulong. Pinananatili sa talababa ang tensiyong ito sa halip na tahimik na lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang idyomang “mga araw” at ang pamilyar na “kaharian ng langit.” Ginamit ang “Tagapagbautismo” bilang malinaw na titulo. Inilagay ang talababa [a] pagkatapos ng buong pahayag upang saklawin nito ang magkakaugnay na alternatibong pagbasa ng βιάζεται at βιασταί/ἁρπάζουσιν.
