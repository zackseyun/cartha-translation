id: MAT.11.1
reference: Matthew 11:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: tl
  text: Nang matapos ni Jesus na tagubilinan[a] ang labindalawa niyang alagad, umalis siya roon upang magturo at mangaral sa kanilang mga bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “utusan.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak sa Griyego kung kanino tumutukoy ang “kanilang mga bayan”; maaaring mga bayan ng mga alagad o, sa mas pangkalahatang diwa, mga bayan ng mga tao sa paligid.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Nang
  rationale: Ang pormulang pasalaysay ay pangunahing nagsisilbing panandang transisyon at panahon; natural itong naipahahayag sa modernong Tagalog sa pamamagitan ng “Nang” nang hindi idinaragdag ang mabigat na literal na “At nangyari.”
- source_word: ἐτέλεσεν
  choice: matapos
  rationale: Ipinahihiwatig nito na ganap nang natapos ang naunang gawain bago ang sumunod na pagkilos ni Jesus.
- source_word: διατάσσων
  choice: tagubilinan
  rationale: Ipinapahayag ng “tagubilinan” ang may-awtoridad na pagbibigay ng mga bilin o tagubilin, habang ang “utusan” ay pinananatili sa talababa bilang mas tuwirang alternatibo.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: ang labindalawa niyang alagad
  rationale: Ang “alagad” ang likas at nakaugaliang salin ng μαθητής sa konteksto ng Ebanghelyo; tahasang pinananatili ang bilang na labindalawa.
- source_word: μετέβη ἐκεῖθεν
  choice: umalis siya roon
  rationale: Natural nitong inilalarawan ang paglipat ni Jesus mula sa lugar na iyon patungo sa ibang mga lugar.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: upang magturo at mangaral
  rationale: Ipinakikita ng articular infinitive ang layunin, at pinananatili ang pagkakaiba ng pagtuturo at pampublikong pangangaral.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: sa kanilang mga bayan
  rationale: Ang πόλις ay maaaring tumukoy sa lungsod o bayan; mas angkop at likas dito ang “mga bayan.” Pinananatili ng “kanilang” ang di-tiyak na tinutukoy ng panghalip sa Griyego.
theological_decisions:
- issue: Tinutukoy ng αὐτῶν sa “ἐν ταῖς πόλεσιν αὐτῶν”
  choice: Panatilihin ang malabong “kanilang mga bayan.”
  alternative: “mga bayan ng mga alagad,” “mga bayan ng mga Judio,” o “mga bayan sa rehiyong iyon”
  rationale: Hindi tahasang tinutukoy ng Griyego kung kanino ang mga bayan. Hindi ito dapat pasiyahan ng salin; ipinaliliwanag sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na likas, malinaw, at marangal. Ginamit ang “tagubilinan” upang mapanatili ang awtoritatibong diwa nang hindi maging labis na militar ang tunog, at “mga bayan” bilang mas malawak at karaniwang katumbas ng πόλεις sa kontekstong ito.
