  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: tl
  text: “Lumapit kayo sa akin, kayong lahat na nagpapagal at nabibigatan[a], at bibigyan ko kayo ng kapahingahan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “napasanan ng mabigat na dalahin.” Ang pandiwaring Griyego ay tumutukoy sa mga pinasanan at nananatili sa gayong kalagayan.
    reason: lexical_alternative
  - marker: b
    text: O, “pagiginhawahin ko kayo.” Ang pandiwa ay maaaring mangahulugang pagpapahingahin ang isang tao o bigyan siya ng ginhawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Lumapit kayo
  rationale: Isang tuwirang paanyaya sa maramihang kausap. Sa Filipino, likas na ipinahihiwatig ng “lumapit” ang pagpunta sa nagsasalita.
- source_word: πρός με
  choice: sa akin
  rationale: Kasama ng pandiwang nagsasaad ng paglapit, malinaw nitong ipinapahayag na si Jesus ang nilalapitan.
- source_word: πάντες
  choice: kayong lahat
  rationale: Pinananatili ang saklaw ng paanyaya at malinaw na ipinahahayag ang maramihang kausap.
- source_word: οἱ κοπιῶντες
  choice: na nagpapagal
  rationale: Pinananatili ang aktibong diwa ng patuloy na paggawa o pagpapakahirap, sa natural at marangal na Filipino.
- source_word: πεφορτισμένοι
  choice: nabibigatan
  rationale: Ipinapahayag ang kasalukuyang kalagayan ng mga taong napasanan at nananatiling mabigat ang dinadala, nang hindi tinutukoy kung literal o matalinghaga ang bigat.
- source_word: κἀγὼ
  choice: at bibigyan ko
  rationale: Pinananatili ang paglipat sa pangako ng nagsasalita; likas nang malinaw sa “ko” ang tahasang paksa na “ako.”
- source_word: ἀναπαύσω
  choice: bibigyan ... ng kapahingahan
  rationale: Natural na Filipino para sa pagpapahinga o pagbibigay-ginhawa at sapat na malawak upang hindi limitahan ang uri ng ipinangakong kapahingahan.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Karaniwang panghalip na maramihan at tumutugma sa “kayong lahat” sa unang bahagi.
theological_decisions:
- issue: Kalikasan ng kapahingahang ipinangako sa ἀναπαύσω
  choice: “bibigyan ko kayo ng kapahingahan,” na hindi nililimitahan ang kahulugan
  alternative: “pagiginhawahin ko kayo” o isang tahasang espirituwal o panghinaharap na pagpapakahulugan
  rationale: Hindi espesipikong itinatakda ng talata kung pisikal, emosyonal, espirituwal, o eskatolohikal ang kapahingahan. Pinananatili ng malawak na salin ang tunay na saklaw at teolohikal na lalim ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “nagpapagal” upang mapanatili ang aktibong diwa ng κοπιῶντες at “nabibigatan” para sa resultang kalagayan ng πεφορτισμένοι. Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay.
