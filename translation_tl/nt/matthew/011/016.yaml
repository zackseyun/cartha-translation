base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: tl
  text: Ngunit sa ano ko ihahambing ang salinlahing ito? Ito ay tulad ng mga batang nakaupo sa mga pamilihan[a] at tumatawag sa iba[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga liwasang pamilihan.” Ang salitang Griyego ay tumutukoy sa mga pampublikong pook na pinagdarausan ng kalakalan at pagtitipon.
    reason: lexical_alternative
  - marker: b
    text: O “sa ibang mga bata.” Ang Griyego ay nagsasabing “sa iba”; ipinahihiwatig ng paghahalintulad na mga bata rin ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: sa ano ko ihahambing
  rationale: Pinananatili ang pamantayan ng paghahambing na ipinahihiwatig ng datibong Τίνι at ang retorikal na puwersa ng panghinaharap na ὁμοιώσω, sa natural ngunit marangal na Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na paglipat o pagsalungat sa naunang pahayag.
- source_word: τὴν γενεὰν ταύτην
  choice: ang salinlahing ito
  rationale: Ang γενεά ay tumutukoy sa magkakapanahong mga tao bilang isang pangkat; ang “salinlahi” ay tumpak at pamilyar sa kontekstong biblikal.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: Tulad sila ng mga bata
  rationale: Ginawang maramihan ang panghalip upang malinaw na ang tinutukoy ay ang mga taong bumubuo sa salinlahing ito, habang pinananatili ang payak na paghahambing.
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: nakaupo sa mga pamilihan
  rationale: Inilalarawan ang patuloy na ayos ng tagpo; ang ἀγορά ay pampublikong pook ng kalakalan at pagtitipon.
- source_word: προσφωνοῦντα
  choice: tumatawag
  rationale: Ipinahahayag ang malakas o hayagang pagtawag sa kausap nang hindi nagdaragdag ng di-nakasulat na detalye.
- source_word: τοῖς ἑτέροις
  choice: sa iba
  rationale: Pinananatili ang di-tiyak na “iba” ng Griyego; ipinahihiwatig lamang ng konteksto na sila rin ay mga bata.
