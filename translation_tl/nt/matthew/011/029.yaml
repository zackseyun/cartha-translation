base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: tl
  text: Pasanin ninyo ang aking pamatok at matuto kayo sa akin, sapagkat ako ay maamo at mapagpakumbaba sa puso,[a] at makakatagpo kayo ng kapahingahan para sa inyong mga kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahinahon at mababang-loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Pasanin ninyo ang aking pamatok
  rationale: Likas sa Filipino ang “pasanin” para sa pagtanggap ng pamatok sa sarili. Pinananatili ng “pamatok” ang kongkretong larawang tumutukoy sa pagpapasakop sa pagtuturo at pamumuno.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: matuto kayo sa akin
  rationale: Tuwirang ipinahahayag ang pagkatuto mula kay Jesus, kasama ang diwa ng pagiging alagad.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit nararapat matuto kay Jesus; marangal at natural ang “sapagkat” sa konteksto.
- source_word: πραΰς
  choice: maamo
  rationale: Ipinahahayag ng “maamo” ang kahinahunan at kawalan ng kabagsikan nang hindi nagpapahiwatig ng kahinaan.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: mapagpakumbabang puso
  rationale: Natural na pariralang Filipino na nagpapanatili sa puso bilang kinaroroonan ng panloob na disposisyon ng pagpapakumbaba.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: makakatagpo kayo ng kapahingahan
  rationale: Pinananatili ang pangako sa anyong hinaharap at ang mahalagang biblikal na konsepto ng kapahingahan.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: para sa inyong mga kaluluwa
  rationale: Ang “kaluluwa” ay tuwirang katumbas na nagpapanatili sa tradisyonal at biblikal na pahayag, habang ang “para sa” ay natural na paglilipat ng datibo sa Filipino.
theological_decisions:
- issue: Paglalarawan ni Jesus sa sarili sa πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: ako ay maamo at mapagpakumbabang puso
  alternative: ako ay mahinahon at mababang-loob
  rationale: Pinananatili ng salin ang personal na paglalarawan ni Jesus sa kanyang kahinahunan at panloob na pagpapakumbaba, nang hindi nagdaragdag ng denominasyonal o doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang metaporang “pamatok,” ang biblikal na “kapahingahan,” at ang “mga kaluluwa,” habang iniwasan ang sobrang arkaiko o paliwanag na paraphrase.
