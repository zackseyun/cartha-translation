review_pass:
  verdict: revise
  source_fidelity: 'Tumpak na naipapasa ng draft ang mga pangunahing elemento ng Griyego: ang utos na tanggapin/pasanin ang pamatok, ang pagkatuto mula kay Jesus, ang dahilan na nakabatay sa kanyang pagiging πραΰς at ταπεινός, at ang pangakong makakatagpo ng ἀνάπαυσις ang mga ψυχαί. Gayunman, ang "mapagpakumbabang puso" ay hindi wastong predikatibong pagsasalin ng ταπεινὸς τῇ καρδίᾳ; inilalarawan nito ang isang puso bilang pangngalan sa halip na si Jesus bilang "mapagpakumbaba sa puso."'
  naturalness: Marangal at malinaw ang kabuuang rehistro. Ang "Pasanin ninyo ang aking pamatok," "matuto kayo sa akin," at "makakatagpo kayo ng kapahingahan" ay natural sa modernong Filipino na may angkop na biblikal na bigat. Kailangan lamang ituwid ang estruktura ng pariralang tumutukoy sa puso.
  terminology: Ang "pamatok," "maamo," "kapahingahan," at "mga kaluluwa" ay angkop at nagpapanatili ng mga mahalagang larawan at termino ng pinagmulan. Ang alternatibong "mahinahon at mababang-loob" ay katanggap-tanggap na lexical alternative para sa "maamo at mapagpakumbaba sa puso."
  issues:
  - severity: medium
    issue: Hindi wasto ang pariralang "ako ay maamo at mapagpakumbabang puso."
    rationale: Ang ταπεινὸς τῇ καρδίᾳ ay predikasyon tungkol kay Jesus—"humble in heart"—hindi isang pariralang pangngalan na "a humble heart." Ang "mapagpakumbaba sa puso" ay malinaw, natural, at mas malapit sa saklaw ng Griyego.
  revised_text: Pasanin ninyo ang aking pamatok at matuto kayo sa akin, sapagkat ako ay maamo at mapagpakumbaba sa puso,[a] at makakatagpo kayo ng kapahingahan para sa inyong mga kaluluwa.
