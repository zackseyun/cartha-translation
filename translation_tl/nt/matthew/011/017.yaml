base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: tl
  text: Sinasabi nila, ‘Tinugtog namin ang plauta para sa inyo, ngunit hindi kayo sumayaw; umawit kami ng awit ng panaghoy, ngunit hindi kayo nagluksa.[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “hindi ninyo hinampas ang inyong sarili,” na tumutukoy sa nakaugaliang pagpapakita ng pagdadalamhati, gaya ng paghampas sa dibdib.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Sinasabi nila
  rationale: Pinananatili ang kasalukuyang panahunan ng Griyego, na masiglang nagpapakilala sa sinasabi ng mga bata sa tagpo.
- source_word: Ηὐλήσαμεν
  choice: Tinugtugan namin kayo ng plauta
  rationale: Tiyak na tumutukoy ang αὐλέω sa pagtugtog ng plauta o tubo; natural sa modernong Tagalog ang pariralang ito at ipinakikitang para sa iba ang pagtugtog.
- source_word: ὑμῖν
  choice: kayo
  rationale: Sa pandiwang “tinugtugan,” likas nang ipinahihiwatig ng hulaping -an na ang tugtog ay itinanghal para sa kanila.
- source_word: ὠρχήσασθε
  choice: kayo sumayaw
  rationale: Likas na katumbas ito ng pandiwa sa konteksto; hindi kailangang gawing tahasang reflexive ang anyong middle.
- source_word: ἐθρηνήσαμεν
  choice: umawit kami ng panaghoy
  rationale: Ipinahahayag ang funeral-style lament at pinananatili ang performative na pagkakatulad sa pagtugtog ng plauta.
- source_word: ἐκόψασθε
  choice: kayo nagluksa
  rationale: Natural na inilalahad ang kontekstuwal na diwa ng kilos ng pagdadalamhati, habang inilalagay sa talababa ang mas literal na kaugaliang paghampas sa sarili.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang magkatapat na larawan ng masayang tugtugin at awit-panaghoy. Isang talababa lamang ang ginamit para sa kulturang nakapaloob sa ἐκόψασθε; ang “plauta” at “panaghoy” ay sapat nang tiyak sa pangunahing teksto.
