  source_fidelity: Tumpak ang saklaw na “lahat ng propeta,” ang pangatnig na “Sapagkat,” ang pagtukoy sa “Kautusan,” at ang temporal na “hanggang kay Juan.” Gayunman, ang “nagpahayag bilang propeta” ay hindi ang pinakanatural na Tagalog na katumbas ng ἐπροφήτευσαν, lalo na sa personipikadong ugnay nito sa Kautusan.
  naturalness: Mas likas sa modernong Filipino ang “nagpahayag nang propetiko” kaysa “nagpahayag bilang propeta.” Ang inayos na talababa ay mas malinaw at idiomatiko rin.
  terminology: Ang “Kautusan” ay angkop bilang pangalang pantukoy sa Law/Torah sa tambalang “mga propeta at ang Kautusan.” Ang “propetiko” ay pinananatili upang maihatid ang pandiwang προφητεύω nang hindi ipinahihiwatig na ang Kautusan ay literal na isang propeta.
