  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: tl
  text: Sapagkat ang lahat ng propeta at ang Kautusan ay nagpahayag nang propetiko hanggang kay Juan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa panahon ni Juan.” Maaaring ipakita ng parirala si Juan bilang kasukdulan ng propetikong patotoo o bilang hangganang nagmamarka sa paglipat nito.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ang lahat ng
  rationale: Tumutukoy sa kabuuang pangkat ng mga propeta at likas na salin sa makabagong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayan na iniuugnay ng talata sa naunang pahayag.
- source_word: οἱ προφῆται
  choice: mga propeta
  rationale: Karaniwan at malinaw na tawag sa mga nagsasalita para sa Diyos.
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Tumutukoy sa kinikilalang bahagi ng Kasulatan, hindi sa batas sa pangkalahatan; ang malaking titik ay nagpapahiwatig ng titulong ito.
- source_word: ἕως Ἰωάννου
  choice: hanggang kay Juan
  rationale: Direkta at natural na pahayag ng hangganang temporal habang pinananatili ang pagiging bukas kung kabilang si Juan bilang kasukdulan o siya ang tanda ng paglipat.
- source_word: ἐπροφήτευσαν
  choice: nagpahayag bilang propeta
  rationale: Pinananatili ang aktibong diwa ng προφητεύω at ang personipikasyon na kapuwa ang mga propeta at ang Kautusan ay nagbigay ng propetikong patotoo; mas natural ito kaysa sa bihirang anyong 'nagpropesiya' para sa Kautusan.
theological_decisions:
- issue: Kung ang ὁ νόμος ay pangkalahatang batas o titulo ng isang bahagi ng Kasulatan
  choice: ang Kautusan
  alternative: ang kautusan
  rationale: Sa tambalang 'mga propeta at ang Kautusan,' tinutukoy ang kinikilalang nakasulat na patotoo ng Israel, kaya ang malaking titik ay nagbibigay-linaw nang walang idinadagdag na doktrina.
- issue: Kung kasama si Juan sa panahong propetiko o siya lamang ang hangganan nito
  choice: hanggang kay Juan
  alternative: hanggang sa panahon ni Juan
  rationale: Hindi ganap na nilulutas ng Griyegong ἕως Ἰωάννου kung si Juan ang kasukdulan ng naunang patotoo o ang hangganan ng paglipat; pinananatili ng pangunahing salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Kautusan' bilang pamagat ng bahagi ng Kasulatan at 'nagpahayag bilang propeta' upang maging natural ang iisang pandiwang inuugnay kapuwa sa mga propeta at sa Kautusan.
