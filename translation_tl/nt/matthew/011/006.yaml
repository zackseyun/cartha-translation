  text: And blessed is the one who is not offended by me[a].
translation:
  language: tl
  text: At mapalad ang sinumang hindi natitisod dahil sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nagkakasala ng loob dahil sa akin.”
    reason: Posibleng idiomatikong paglilinaw ng σκανδαλισθῇ ἐν ἐμοί; pinananatili ng pangunahing teksto ang metapora ng pagkatisod.
lexical_decisions:
- source_word: καί
  choice: At
  rationale: Pinananatili ang tuwirang ugnayan ng kasabihang ito sa naunang pahayag.
- source_word: μακάριος
  choice: pinagpala
  rationale: Pinananatili ang bigat ng pahayag ng pagpapala, sa halip na ang mas pansariling “maligaya” o mas payak na “mapalad.”
- source_word: ὃς ἐὰν μὴ
  choice: ang sinumang hindi
  rationale: Likas sa modernong Tagalog at malinaw na nagpapahayag ng di-tiyak ngunit pangkalahatang kondisyong tumutukoy sa sinumang tao.
- source_word: σκανδαλισθῇ
  choice: natitisod
  rationale: Pinananatili ang metapora ng pagkatisod at ang posibilidad ng pag-urong o pagkadapa sa pananampalataya, nang hindi ito nililimitahan sa damdaming pagkasama ng loob.
- source_word: ἐν ἐμοί
  choice: dahil sa akin
  rationale: Sa pagkakaugnay nito sa σκανδαλίζω, natural nitong ipinahahayag na si Jesus ang dahilan o okasyon ng pagkatisod; mas malinaw ito sa Tagalog kaysa sa literal na “sa akin.”
theological_decisions:
- issue: Lakas at lawak ng σκανδαλισθῇ kaugnay ni Jesus
  choice: 'Pinanatili sa pangunahing teksto ang metapora: “hindi natitisod dahil sa akin.”'
  alternative: “hindi nagkakasala ng loob sa akin” o “hindi tumatalikod dahil sa akin”
  rationale: Ang “natitisod” ay nagpapanatili sa tensiyon sa pagitan ng pagtanggap kay Jesus at ng pagkadapa o pag-urong dahil sa kanya. Hindi nito tahasang nililimitahan ang diwa sa emosyonal na pagkasama ng loob o pinalalawak agad tungo sa ganap na pagtalikod.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “pinagpala” bilang pormulang kahawig ng mga pahayag ng pagpapala, at ang “natitisod” upang mapanatili ang pangunahing metapora ng Griyego.
