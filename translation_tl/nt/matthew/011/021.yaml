  naturalness: Malinaw at modernong Tagalog ang kabuuan. Ang “Kahabag-habag ka” ay mas angkop sa marangal at propetikong bigat ng Οὐαί kaysa “Kawawa ka,” na sa kasalukuyang gamit ay maaaring tumunog na payak na pagkaawa at kulang sa hatol/pagsaway.
  terminology: Ang “mga makapangyarihang gawa” ay angkop para sa δυνάμεις at mahusay na pinananatili ng talababa ang “mga himala” bilang alternatibo. Ang “nagsisi” ay wastong salin ng μετενόησαν sa kontekstong ito. Pinanatili ang Corazin, Betsaida, Tiro, at Sidon bilang mga pangalang-lugar.
