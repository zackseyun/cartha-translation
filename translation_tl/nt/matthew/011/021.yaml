  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: tl
  text: Kahabag-habag ka, Corazin! Kahabag-habag ka, Betsaida! Sapagkat kung nangyari sa Tiro at Sidon ang mga makapangyarihang gawa[a] na ginawa sa gitna ninyo, matagal na sana silang nagsisi sa damit-sako at abo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga himala”; sa Griyego, “mga makapangyarihang gawa” o “mga gawa ng kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Kawawa ka
  rationale: Pinananatili nito ang tuwirang pahayag ng kapahamakan na may himig din ng dalamhati; natural ito sa makabagong Tagalog at higit na mabigat kaysa sa simpleng “Sayang.”
- source_word: Χοραζίν
  choice: Corazin
  rationale: Ginamit ang karaniwang makabagong baybay-Tagalog ng pangalan ng lugar.
- source_word: Βηθσαϊδά
  choice: Betsaida
  rationale: Ginamit ang karaniwang baybay-Tagalog ng pangalan ng lugar.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag ng kapahamakan.
- source_word: ἐγένοντο ... αἱ γενόμεναι
  choice: nangyari ... na ginawa
  rationale: Natural na pagkakaiba ng pananalita sa Tagalog habang pinananatili ang ugnayan ng mga gawang hipotetikong nangyari sa Tiro at Sidon at aktuwal na ginawa sa gitna ng mga kausap.
- source_word: αἱ δυνάμεις
  choice: mga makapangyarihang gawa
  rationale: Pinananatili ang tahasang kaugnayan sa kapangyarihan at hindi agad nililimitahan ang salita sa kategoryang “mga himala”; inilagay ang alternatibo sa talababa.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Tumutukoy ito sa mga gawang naganap sa kanilang kapiling, hindi sa loob ng kanilang pagkatao.
- source_word: πάλαι ἂν ... μετενόησαν
  choice: matagal na sana silang nagsisi
  rationale: Ang “sana” kasama ng aspektong naganap ay likas na naghahayag sa Tagalog ng salungat-sa-katotohanang bunga; ang “nagsisi” ay malinaw at natural na katumbas ng μετενόησαν sa kontekstong ito.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: nakasuot ng damit-sako at nakaupo sa abo
  rationale: Ginagawang malinaw ang sinaunang panlabas na pagpapahayag ng pagluluksa at pagsisisi nang hindi inaalis ang kongkretong larawang kultural.
theological_decisions:
- issue: Likas ng paghahambing ni Jesus sa Tiro at Sidon
  choice: Pinanatili bilang tunay na salungat-sa-katotohanang paghahambing na nagpapakita ng higit na pananagutan ng mga bayang nakasaksi sa makapangyarihang mga gawa ngunit hindi nagsisi.
  alternative: Ituring na purong retorikal na pagmamalabis na walang tunay na paghahambing sa paghatol.
  rationale: Hayagang ginagamit ng Griyego ang kondisyong salungat sa aktuwal na nangyari upang patindihin ang pagsaway sa Corazin at Betsaida. Hindi nilulutas ng salin ang higit pang mga tanong tungkol sa banal na kaalaman o paghatol na hindi sinasagot ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Kawawa ka” upang pagsamahin ang bigat ng propetikong kapahamakan at himig ng dalamhati. Ipinaliwanag nang bahagya ang idyomang damit-sako at abo upang madaling maunawaan ng karaniwang mambabasa.
