source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: tl
  text: Pagkatapos nito, sinimulan niyang tuligsain ang mga lungsod kung saan naganap ang pinakamarami sa kanyang makapangyarihang gawa[a], sapagkat hindi sila nagsisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga himala” o “mga gawang nagpapakita ng kapangyarihan” (Griyego: δυνάμεις).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa susunod na pangyayari sa salaysay; natural ito sa makabagong Tagalog.
- source_word: ἤρξατο ὀνειδίζειν
  choice: sinimulan niyang sumbatan
  rationale: Pinananatili ng “sinimulan” ang ingressive na diwa ng ἤρξατο, at ang “sumbatan” ay likas na katumbas ng matinding pagpuna o paninisi ng ὀνειδίζω nang hindi ito ginagawang pormal na paghatol.
- source_word: τὰς πόλεις ἐν αἷς
  choice: ang mga lungsod kung saan
  rationale: Tuwirang ipinahahayag ang mga pook na tinutukoy at natural ang “kung saan” sa kasalukuyang Tagalog.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: niya ginawa ang karamihan sa kanyang makapangyarihang mga gawa
  rationale: Ipinakikita ng balangkas na ang makapangyarihang mga gawa ay naganap na bago ang pagsumbat. Ang aktibong ayos ay natural sa Tagalog, samantalang pinananatili ng “karamihan” ang superlatibong diwa ng πλεῖσται at ng “makapangyarihang mga gawa” ang ugnayan ng δυνάμεις sa kapangyarihan.
- source_word: ὅτι οὐ μετενόησαν
  choice: sapagkat hindi sila nagsisi
  rationale: Malinaw na ibinibigay ng ὅτι ang dahilan ng pagsumbat. Ang “nagsisi” ay natural at may angkop na moral at espirituwal na bigat para sa μετανοέω sa kontekstong ito.
theological_decisions:
- issue: Paglilipat ng δυνάμεις sa konteksto ng mga himala
  choice: makapangyarihang mga gawa
  alternative: mga himala; mga gawang nagpapakita ng kapangyarihan
  rationale: Pinananatili ng napiling parirala ang diin ng salitang Griyego sa kapangyarihan at hindi ito nililimitahan sa mas makitid na kategoryang maaaring ipahiwatig ng “mga himala.” Inilalahad sa talababa ang wastong alternatibo.
- issue: Paglilipat ng μετενόησαν
  choice: hindi sila nagsisi
  alternative: hindi sila nagbago ng isip; hindi sila tumalikod sa kanilang dating pamumuhay
  rationale: Ipinahahayag ng teksto ang kabiguang tumugon nang moral at espirituwal sa mga gawa ni Jesus. Ang “nagsisi” ay malinaw, karaniwan, at hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sumbatan” upang mapanatili ang tindi ng ὀνειδίζειν, at ang “makapangyarihang mga gawa” upang maipakita ang puwersa ng δυνάμεις habang inilalagay sa talababa ang mas karaniwang alternatibong “mga himala.”
