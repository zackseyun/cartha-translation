- from: Pagkatapos, sinimulan niyang sumbatan ang mga lungsod kung saan niya ginawa ang karamihan sa kanyang makapangyarihang mga gawa[a], sapagkat hindi sila nagsisi.
  to: Pagkatapos nito, sinimulan niyang tuligsain ang mga lungsod kung saan naganap ang pinakamarami sa kanyang makapangyarihang gawa[a], sapagkat hindi sila nagsisi.
