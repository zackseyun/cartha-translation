id: MAT.1.5
reference: Matthew 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: tl
  text: Si Salmon ang ama ni Boaz kay Rahab[a]; si Boaz ang ama ni Obed kay Ruth; at si Obed ang ama ni Jesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula kay Rahab” at “mula kay Ruth.” Ginagamit sa Griyego ang ἐκ sa pangalan ng bawat ina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ang ama ni
  rationale: Sa talaangkanan, tumutukoy ang pandiwa sa pagiging ama o sa pinagmulang linya ng angkan. Ang “ang ama ni” ay natural sa modernong Tagalog at malinaw na pinananatili ang linyang mula sa ama nang hindi gumagamit ng makalumang pananalita.
- source_word: ἐκ
  choice: kay
  rationale: Sa pormulang “ang ama ni … kay Rahab/Ruth,” malinaw sa Tagalog na ipinakikilala ng “kay” ang ina ng anak. Pinananatili nito ang tahasang pagbanggit sa mga ina, habang inilalagay sa talababa ang mas literal na diwang “mula kay.”
- source_word: δὲ
  choice: ; / at
  rationale: Mahinang pang-ugnay ang δέ rito, hindi panalungat. Ang mga tuldok-kuwit at pangwakas na “at” ay likas sa Tagalog at malinaw na nagdurugtong sa magkakasunod na salinlahi.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Ginamit ang nakikilalang anyo ng pangalan sa tradisyong biblikal sa Tagalog.
- source_word: Βόες
  choice: Boaz
  rationale: Ang Βόες ay tumutukoy sa kilalang tauhan sa Lumang Tipan na karaniwang tinatawag na Boaz; pinananatili ng anyong ito ang pagkakaugnay ng mga tipan.
- source_word: Ῥαχάβ
  choice: Rahab
  rationale: Ito ang nakikilalang anyo ng pangalan sa Bibliyang Tagalog at malinaw na iniuugnay ang tinutukoy sa tauhan ng Lumang Tipan.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Ginamit ang karaniwang anyo ng pangalang Hebreo upang mapanatili ang pagkakakilanlan ng tauhan sa Lumang Tipan.
- source_word: Ῥούθ
  choice: Ruth
  rationale: Ginamit ang karaniwang anyo ng pangalan, na tugma sa tauhan at aklat ng Lumang Tipan.
- source_word: Ἰεσσαί
  choice: Jesse
  rationale: Ginamit ang kinikilalang anyo ng pangalan sa tradisyong biblikal sa Tagalog.
theological_decisions:
- issue: Pormula ng talaangkanan at tahasang pagbanggit sa mga ina
  choice: Pinanatili ang linyang mula sa ama sa pormulang “ang ama ni,” at tahasang isinama sina Rahab at Ruth sa pamamagitan ng “kay.”
  alternative: Isaling mas literal bilang “naging anak niya mula kay Rahab/Ruth,” o alisin ang natatanging pormula para sa mga ina.
  rationale: Hindi pangkaraniwan sa talaangkanan ang tahasang pagbanggit sa mga ina sa pamamagitan ng ἐκ at ng kanilang mga pangalan. Pinananatili ng salin ang parehong linyang mula sa ama at ang kapansin-pansing pagsama sa mga ina nang hindi dinaragdagan ang teolohikal na pahiwatig ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang likas na pormulang “ang ama ni … kay …” sa halip na makaluma o sobrang literal na pananalita; pinananatili ng tuldok-kuwit ang maindayog na pagkakasunod ng talaangkanan.
