id: MAT.1.12
reference: Matthew 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: tl
  text: Pagkatapos ng pagpapatapon sa Babilonia[a], naging ama si Jeconias ni Sealtiel, at naging ama si Sealtiel ni Zerubabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkatapos ng pagkakatapon sa Babilonia.” Ang salitang Griyego ay tumutukoy sa sapilitang paglilipat ng mga tao tungo sa pagkakatapon sa Babilonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Pagkatapos
  rationale: Ang μετά na may accusative ay nagsasaad ng pagkakasunod sa panahon. Banayad lamang ang δέ at likas nang nasasaklaw ng daloy ng salin.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: silang sapilitang dalhin sa Babilonia
  rationale: Ang μετοικεσία ay tumutukoy sa paglilipat o deportasyon patungo sa pagkakatapon. Ipinahahayag ng pandiwang parirala ang sapilitang pag-aalis sa mga tao sa natural at malinaw na modernong Tagalog.
- source_word: Ἰεχονίας
  choice: Jeconias
  rationale: Ginamit ang anyong pangalang pamilyar sa tradisyong Biblikal sa Filipino at malapit sa Griyegong Ἰεχονίας.
- source_word: ἐγέννησεν
  choice: naging ama ... ni
  rationale: Sa talaangkanan, ang γεννάω ay karaniwang nagsasaad ng pagiging ama o ninuno sa linyang binabanggit. Natural ito sa modernong Tagalog at hindi ipinipilit na walang nilaktawang salinlahi.
- source_word: Σαλαθιήλ
  choice: Sealtiel
  rationale: Ginamit ang kinikilalang anyong Biblikal sa Filipino para sa pangalang ito.
- source_word: δὲ
  choice: at
  rationale: Dito ay nag-uugnay ang δέ ng magkasunod na bahagi ng talaangkanan; ang “at” ang pinakanatural na katumbas.
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: Ginamit ang karaniwang anyong Biblikal sa Filipino, na madaling makilala ng mga mambabasa.
theological_decisions:
- issue: Kahulugan ng γεννάω sa talaangkanan
  choice: Isalin bilang “naging ama ... ni,” na maaaring tumukoy sa ugnayang pangkanunuan sa talaangkanan.
  alternative: “ipinanganak” o isang pormulang nagpapahiwatig ng agarang biyolohikal na pagiging ama
  rationale: Ang pormula ng sinaunang talaangkanan ay maaaring gumamit ng wika ng pagiging ama para sa pagpapatuloy ng angkan kahit may nilaktawang salinlahi. Pinananatili ng salin ang saklaw na ito nang hindi nilulutas nang lampas sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sapilitang dalhin” upang madaling maunawaan ang makasaysayang deportasyon, habang inilagay sa talababa ang tradisyonal na “pagkakatapon.”
