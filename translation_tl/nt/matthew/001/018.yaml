id: MAT.1.18
reference: Matthew 1:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: tl
  text: 'Ganito nangyari ang kapanganakan ni Jesus na Mesiyas[a]: Nang naipagtipan na sa kasal si Maria, ang kanyang ina, kay Jose[b], bago sila magsama[c], napag-alamang nagdadalang-tao siya mula sa Banal na Espiritu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Jesucristo.” Isinalin dito bilang “Mesiyas” ang titulong Griyego na Χριστός upang maipahayag ang kahulugan nito.
    reason: alternative_reading
  - marker: b
    text: Ang “naipagtipan na sa kasal” ay tumutukoy sa isang pormal at kinikilalang kasunduan na may higit na bisa kaysa sa karaniwang makabagong pakikipagtipan.
    reason: cultural_note
  - marker: c
    text: Ang “bago sila magsama” ay maaari ring magpahiwatig na hindi pa sila nagsasama bilang mag-asawa sa paraang seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: kapanganakan
  rationale: Sa kontekstong ito, tumutukoy ang γένεσις sa pagsilang o pagdating sa daigdig ni Jesus; ang “kapanganakan” ang pinakanatural na salin sa Filipino.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo. Ipinapahayag ng “Mesiyas” ang kahulugan nito sa halip na tratuhing apelyido ang “Cristo.”
- source_word: οὕτως ἦν
  choice: Ganito nangyari
  rationale: Natural itong panimulang pahayag sa modernong Filipino at pinananatili ang diwang ipinakikilala ang paraan ng pangyayari.
- source_word: μνηστευθείσης
  choice: maipagkasundo sa pag-aasawa
  rationale: Ipinahihiwatig nito ang pormal at may-bisang kasunduan sa pag-aasawa, hindi lamang ang karaniwang modernong pakikipagtipan.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: bago sila magsama
  rationale: Pinananatili ng “magsama” ang mahinhing idyoma at ang lawak ng Griyego, na maaaring tumukoy sa pagsasama bilang mag-asawa at magpahiwatig ng pagtatalik.
- source_word: εὑρέθη
  choice: napag-alamang
  rationale: Pinananatili nito ang pasibong diwa ng pagkakatuklas nang hindi tinutukoy kung sino ang nakaalam.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: nagdadalang-tao
  rationale: Ito ang natural at marangal na idyomang Filipino para sa pagiging buntis.
- source_word: ἐκ πνεύματος ἁγίου
  choice: mula sa Banal na Espiritu
  rationale: Ipinakikita ng “mula sa” ang pinagmulan na ipinahahayag ng ἐκ; ang tinutukoy sa konteksto ay ang Banal na Espiritu.
theological_decisions:
- issue: Pagkakasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit ng salita sa pambungad na ito; ang “Mesiyas” ay tahasang naghahatid ng kahulugan habang inilalagay sa talababa ang nakaugaliang alternatibo.
- issue: Tinutukoy ng πνεύματος ἁγίου
  choice: ang Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa salaysay ni Mateo, tumutukoy ang parirala sa banal na Espiritu ng Diyos. Hindi sapilitang nangangahulugang di-tiyak ang walang-artikulong anyo sa Griyego.
- issue: Saklaw ng συνελθεῖν
  choice: magsama
  alternative: magkaroon ng pagtatalik
  rationale: Pinananatili ng salin ang mahinhing pananalita at tunay na lawak ng parirala, habang ipinapaliwanag sa talababa ang maaaring pahiwatig na hindi pa nila nagaganap ang pagsasamang seksuwal bilang mag-asawa.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nagdadalang-tao” sa halip na mas kolokyal na “buntis,” at pinanatili ang mahinhing kalabuan ng “magsama.” Inayos ang mga pananda ng talababa upang lumitaw kaagad pagkatapos ng salitang o pariralang ipinaliliwanag ng bawat isa.
