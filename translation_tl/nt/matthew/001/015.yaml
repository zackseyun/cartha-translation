  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: tl
  text: Si Eliud ay naging ama ni Eleazar, si Eleazar ay naging ama ni Matan, at si Matan ay naging ama ni Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: Isinalin sa baybay na karaniwang gamit sa tradisyong biblikal sa Filipino, habang malapit sa anyong Griyego.
- source_word: δὲ
  choice: at / tuldok-kuwit
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa talaangkanan. Ginamit ang tuldok-kuwit sa unang dalawang sugnay at “at” sa huli upang maging natural ang daloy nang hindi labis na binibigyang-diin ang ugnayan.
- source_word: ἐγέννησεν
  choice: naging anak ni … si …
  rationale: Sa konteksto ng talaangkanan, ipinapahayag ng γεννάω ang ugnayang ama-anak o pinagmulan. Ang pormang ito ay natural, malinaw, at marangal sa modernong Filipino, at naiiwasan ang lipas o masyadong teknikal na pananalita.
- source_word: τὸν
  choice: hindi hiwalay na isinalin
  rationale: Minamarkahan ng artikulong Griyego ang tuwirang layon bago ang pangalang pantangi; ipinahahayag na ito ng panandang “si” sa natural na balangkas ng Filipino.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Ginamit ang nakaugaliang baybay ng pangalang biblikal sa Filipino.
- source_word: Ματθάν
  choice: Matan
  rationale: Malapit na transliterasyon sa bigkas ng Griyegong Ματθάν at natural basahin sa Filipino.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Ginamit ang nakaugaliang baybay ng pangalang biblikal sa Filipino.
theological_decisions:
- issue: Saklaw ng ἐγέννησεν sa talaangkanan
  choice: naging anak ni Eliud si Eleazar
  alternative: ipinanganak ni Eliud si Eleazar / naging ama ni Eleazar si Eliud
  rationale: Pinananatili ang ugnayang ipinahahayag ng talaangkanan nang hindi ipinapahiwatig na ang lalaki ang literal na nanganak. Hindi rin nilulutas kung bawat salinlahi ay agarang ama-anak o maaaring kumatawan sa mas malawak na angkan.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang paulit-ulit na hulma ng Griyego bilang angkop sa estilong talaangkanan.
