  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: tl
  text: Pagkagising ni Jose, ginawa niya ang iniutos sa kanya ng anghel ng Panginoon, at tinanggap niya ang kanyang asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinama niya sa kanyang tahanan ang kanyang asawa.” Ang pandiwang Griyego ay maaaring tumukoy sa pagtanggap o pagkuha sa isang tao upang makasama o mapabilang sa sariling sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: Pagkagising ni Jose
  rationale: 'Likas at malinaw na salin ng participyal na pagkakasunod-sunod: pagkagising mula sa tulog, saka kumilos si Jose. Hindi na kailangang ulitin ang “mula sa pagkakatulog” dahil likas na taglay iyon ng “pagkagising.”'
- source_word: ἐποίησεν ὡς
  choice: ginawa niya ang
  rationale: Ipinahahayag nito na umayon ang ginawa ni Jose sa iniutos sa kanya, sa natural na ayos ng modernong Tagalog.
- source_word: προσέταξεν
  choice: iniutos
  rationale: Pinananatili ang awtoritatibong lakas ng pandiwa nang hindi nagiging mabigat ang pahayag.
- source_word: ὁ ἄγγελος κυρίου
  choice: anghel ng Panginoon
  rationale: Tapat sa pariralang Griyego at nakaugat sa kinikilalang biblikal na pananalita sa Tagalog.
- source_word: παρέλαβεν
  choice: tinanggap
  rationale: Maaaring mangahulugan ang παραλαμβάνω ng pagtanggap o pagkuha sa isang tao upang makasama o mapabilang sa sambahayan. Ang “tinanggap” ay natural sa Tagalog at hindi labis na nililinaw ang eksaktong praktikal na kilos.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ang kanyang asawa
  rationale: Sa legal at panlipunang balangkas ng pagsasama sa konteksto, ang γυνή ay likas na tumutukoy sa asawa, kahit hindi pa ipinahihiwatig rito ang pagtatalik ng mag-asawa.
theological_decisions:
- issue: Kahulugan ng γυνή bago ang pagsasama bilang mag-asawa
  choice: ang kanyang asawa
  alternative: ang babae
  rationale: Itinuturing na ng salaysay si Maria sa legal na balangkas ng pag-aasawa. Ang “asawa” ay hindi kusang nagpapahiwatig na nagkaroon na sila ng ugnayang seksuwal.
- issue: Pagtukoy sa κύριος sa pariralang ἄγγελος κυρίου
  choice: anghel ng Panginoon
  alternative: anghel ni Yahweh
  rationale: Pinananatili ang karaniwang katumbas na “Panginoon” at ang pamilyar na biblikal na parirala nang hindi nagdaragdag ng interpretasyong wala sa mismong tekstong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “Pagkagising ni Jose” para sa natural na daloy ng salaysay, at pinanatili sa talababa ang mas tiyak na posibleng diwa ng παραλαμβάνω.
