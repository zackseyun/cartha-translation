source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: tl
  text: Kaya, ang lahat ng henerasyon mula kay Abraham hanggang kay David ay labing-apat na henerasyon; mula kay David hanggang sa pagpapatapon sa Babilonia ay labing-apat na henerasyon; at mula sa pagpapatapon sa Babilonia hanggang sa Mesiyas[a] ay labing-apat na henerasyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na χριστός ay titulong literal na nangangahulugang “Pinahiran”; “Mesiyas” ang katumbas na titulong ginagamit dito.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Kaya ang lahat ng salinlahi
  rationale: Ang οὖν ay nagbubuod sa naunang talaan, kaya natural ang “Kaya.” Pinananatili ng “ang lahat ng salinlahi” ang Πᾶσαι at ang genealogical na diwa ng γενεαί.
- source_word: ἀπὸ ... ἕως
  choice: mula ... hanggang
  rationale: Malinaw at likas na ipinapahayag nito ang saklaw sa pagitan ng mga yugto ng talaangkanan.
- source_word: γενεαὶ δεκατέσσαρες
  choice: labing-apat na salinlahi
  rationale: Pinananatili ang paulit-ulit at balanseng pormula ng Griyego sa tatlong bahagi ng talata.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: pagpapatapon sa Babilonia
  rationale: Ang μετοικεσία ay tumutukoy sa sapilitang paglilipat o deportasyon. Mas tiyak ang “pagpapatapon” kaysa “pagkabihag,” at ang genitive Βαβυλῶνος ay natural na ipinahahayag bilang destinasyong “sa Babilonia.”
- source_word: τοῦ χριστοῦ
  choice: sa Mesiyas
  rationale: May artikulo at ginagamit bilang titulo sa kasukdulan ng talaangkanan; isinasalin ang kahulugan ng χριστός bilang “Mesiyas” sa halip na ituring itong pangalan.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Abraham / David / Babilonia
  rationale: Ginamit ang karaniwang modernong anyong Filipino ng mga pangalang pantangi.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, ang χριστός ay isang titulong tumutukoy sa pinahiran at siyang kasukdulan ng talaangkanan. Pinananatili ng “Mesiyas” ang titular na kahulugan nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Iningatan ang tatluhang paralelismo at pag-uulit ng Griyego sa pamamagitan ng mga tuldok-kuwit; iniwasan ang mas lumang “sangsalinlahi” at ang hindi gaanong tiyak na “pagkabihag.”
