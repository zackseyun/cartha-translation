id: MAT.1.14
reference: Matthew 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: tl
  text: Si Azor ang naging ama ni Zadok; si Zadok ang naging ama ni Akim; at si Akim ang naging ama ni Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Isinatinig ang pangalang Griyego sa anyong malinaw at pamilyar sa mga mambabasang Filipino.
- source_word: δέ
  choice: at / ipinahiwatig ng bantas
  rationale: Sa talaangkanan, payak na pang-ugnay ang δέ. Ipinahihiwatig ng mga tuldok-kuwit ang sunod-sunod na ugnayan, at isinalin ang huling δέ bilang “at” para sa natural na daloy.
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Sa konteksto ng talaangkanan, tumutukoy ito sa pag-aanak o pinagmulang panlalaki. Ang “naging ama ni” ay likas at marangal sa modernong Tagalog at hindi gumagamit ng makalumang pananalita.
- source_word: τὸν
  choice: hindi hiwalay na isinalin
  rationale: Minamarkahan ng artikulong Griyego ang tuwirang layon, ngunit hindi ito kailangang tumbasan bago ang pangalang pantangi sa Tagalog.
- source_word: Σαδώκ
  choice: Zadok
  rationale: Transliterasyon ng pangalang pantangi sa anyong madaling makilala at bigkasin sa Filipino.
- source_word: Ἀχίμ
  choice: Akim
  rationale: Transliterasyon ayon sa tunog ng Griyegong pangalan, gamit ang karaniwang baybay-Filipino.
- source_word: Ἐλιούδ
  choice: Eliud
  rationale: Transliterasyon ng pangalang pantangi sa malinaw na anyong Filipino.
