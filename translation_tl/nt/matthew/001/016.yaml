source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: tl
  text: At si Jacob ang ama ni Jose, na asawa ni Maria; mula kay Maria ipinanganak si Jesus, na tinatawag na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Christos ay ginagamit dito bilang titulo.
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Bahagyang ipinagpapatuloy ng δέ ang talaangkanan; likas na pang-ugnay sa Filipino ang “At” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἐγέννησεν
  choice: naging anak ni Jacob si Jose
  rationale: Sa konteksto ng talaangkanan, natural sa modernong Filipino ang pagbabaligtad ng pananaw upang ipahayag ang ugnayang ama-anak. Iniiwasan nito ang makaluma at di-likas na “ipinanganak ni Jacob si Jose,” na maaari ring magpahiwatig na si Jacob ang nanganak.
- source_word: τὸν ἄνδρα Μαρίας
  choice: na asawa ni Maria
  rationale: Ang ἀνήρ na sinusundan ng genitibong “ni Maria” ay malinaw na tumutukoy sa asawa, hindi lamang sa isang lalaki.
- source_word: ἐξ ἧς
  choice: kay Maria
  rationale: Ang pambabaeng isahang panghalip ay partikular na tumutukoy kay Maria. Ang pag-uulit ng pangalan sa Filipino ay malinaw at pinananatili ang sadyang paglipat mula sa linyang panlalaki.
- source_word: ἐγεννήθη
  choice: ipinanganak
  rationale: Ang pasibong anyo ay tumutukoy sa kapanganakan ni Jesus at naiiba sa naunang pormula ng talaangkanan.
- source_word: ὁ λεγόμενος
  choice: na tinatawag na
  rationale: Tuwiran at natural nitong ipinahahayag na ang kasunod ay titulong itinatawag kay Jesus.
- source_word: χριστός
  choice: Mesiyas
  rationale: Dito, ang χριστός ay gumaganap bilang titulo sa pormulang “tinatawag na,” kaya isinalin ito bilang “Mesiyas” sa halip na tratuhing pangalang pantangi.
theological_decisions:
- issue: Pagkakakilanlan kay Jesus sa pamamagitan ng titulong χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ipinakikita ng ὁ λεγόμενος χριστός na titulo ang χριστός sa kontekstong ito. Pinananatili ng “Mesiyas” ang tungkulin nito bilang titulo, habang inilalagay sa talababa ang nakaugaliang transliterasyong “Cristo.”
- issue: Pagbabago mula sa karaniwang pormula ng talaangkanan tungo sa kapanganakan ni Jesus
  choice: Kay Maria ipinanganak si Jesus
  alternative: Hindi isinaling para sabihing si Jose ang ama ni Jesus
  rationale: Ang Griyego ay lumilipat mula sa aktibong ἐγέννησεν patungo sa pasibong ἐγεννήθη at sa pambabaeng ἐξ ἧς. Pinananatili ng salin ang pagkakaibang ito nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuldok-kuwit upang mapanatili ang iisang pangungusap at maipakita ang mahalagang pagbabago mula sa talaangkanan ni Jose tungo sa kapanganakan ni Jesus kay Maria.
