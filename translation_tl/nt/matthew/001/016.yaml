    rationale: Ang ἐκ kasama ng pambabaeng panghalip ay tahasang nagsasaad na mula kay Maria ipinanganak si Jesus. Ang “mula kay Maria” ay pinananatili ang relasyong ito nang walang dagdag na pagpapaliwanag.
  revised_text: At si Jacob ang ama ni Jose, na asawa ni Maria; mula kay Maria ipinanganak si Jesus, na tinatawag na Mesiyas.[a]
