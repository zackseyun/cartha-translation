    issue: Hindi tahasang naipapahayag ng “naging anak ni Jacob si Jose” na si Jacob ang ama ni Jose.
    rationale: Ang ἐγέννησεν sa genealogy ay aktibong panlalaking pormula ng pag-aanak/pagiging ama. Bagaman nauunawaan ang ugnayang magulang-anak, hindi tiyak na napapanatili ng kasalukuyang salin ang pokus na si Jacob ang ama.
  - severity: low
