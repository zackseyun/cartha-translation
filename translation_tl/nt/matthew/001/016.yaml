  source_fidelity: Kailangang tahasang maipahayag na si Jacob ang ama ni Jose upang maipreserba ang aktibong panlalaking genealogical na diwa ng ἐγέννησεν. Ang kasalukuyang “naging anak ni Jacob si Jose” ay nauunawaan ngunit hindi malinaw na pinananatili ang ‘fathered.’ Ang “mula kay Maria” ay mas malapit sa ἐξ ἧς kaysa “kay Maria.”
  naturalness: Ang binagong pangungusap ay natural, malinaw, at marangal sa makabagong Filipino. Ang estrukturang “si Jacob ang ama ni Jose” ay idiomatiko at ang tuldok-kuwit ay angkop sa malinaw na paglipat sa kapanganakan ni Jesus.
  terminology: Ang “Mesiyas” ay angkop para sa χριστός bilang titulo sa “na tinatawag na.” Ang “asawa ni Maria” ay wastong pagsasalin ng ἄνδρα Μαρίας.
  issues:
