revisions:
- from: At naging anak ni Jacob si Jose, na asawa ni Maria; kay Maria ipinanganak si Jesus, na tinatawag na Mesiyas.[a]
  to: At si Jacob ang ama ni Jose, na asawa ni Maria; mula kay Maria ipinanganak si Jesus, na tinatawag na Mesiyas.[a]
  rationale: Pinalitan ang baligtad na “naging anak ni Jacob si Jose” ng “si Jacob ang ama ni Jose” upang malinaw na mapanatili ang aktibong genealogical na pahayag tungkol kay Jacob. Pinalitan ang “kay Maria” ng “mula kay Maria” upang maipakita ang ἐξ ἧς at ang sadyang paglipat ng teksto mula sa pag-aanak ng ama tungo sa kapanganakan ni Jesus mula kay Maria. Hindi binibigyang-lutas ng salin ang anumang teolohikal na implikasyon na lampas sa ipinahahayag ng talata.
