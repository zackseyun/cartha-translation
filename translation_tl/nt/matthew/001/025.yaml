  to: At hindi nakipagtalik si Jose kay Maria hanggang sa manganak si Maria ng isang anak na lalaki.[a][b] At pinangalanan niya itong Jesus.[c]
  rationale: Pinalitan ang mas matalinghagang “sinipingan” ng malinaw at karaniwang modernong Filipino na “nakipagtalik,” habang pinanatili sa talababa ang literal na eupemismong Griyego. Inayos ang pagbibigay ng pangalan upang maging idiomatiko at hindi gumamit ng mas malawak na “bata” bilang katumbas ng “anak na lalaki.” Inayos din ang mga talababa para sa wastong gramatika at malinaw na pagpapahayag ng tekstuwal na ambigwidad ng “hanggang sa.”
