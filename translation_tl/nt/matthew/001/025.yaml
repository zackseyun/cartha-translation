  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: tl
  text: At hindi nakipagtalik si Jose kay Maria hanggang sa manganak si Maria ng isang anak na lalaki.[a][b] At pinangalanan niya itong Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na anyo, “hindi niya siya nakilala.” Ginagamit dito ng Griyego ang “makilala” bilang eupemismo para sa pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: Isinasaad ng “hanggang sa” kung ano ang totoo hanggang sa kapanganakan ni Jesus; hindi nito, sa sarili nito, ipinapasiya kung ano ang nangyari pagkatapos.
    reason: alternative_reading
  - marker: c
    text: Sa mas malapit na anyo sa Griyego, “tinawag niya ang pangalan nito na Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: hindi sinipingan ni Jose si Maria
  rationale: Ang γινώσκω ay ginamit dito bilang eupemismo para sa pakikipagtalik. Ang “sinipingan” ay natural, marangal, at malinaw sa modernong Filipino nang hindi nagiging tahasan o magaspang. Nilinaw ang mga tinutukoy ng mga panghalip sa pamamagitan ng paggamit sa mga pangalang Jose at Maria.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Ito ang karaniwang temporal na katumbas at nagsasaad kung ano ang totoo hanggang sa panganganak, nang hindi ipinapasiya kung ano ang nangyari pagkatapos.
- source_word: ἔτεκεν
  choice: manganak siya
  rationale: Natural at kasalukuyang Filipino para sa pagkilos na tinutukoy ng τίκτω.
- source_word: υἱόν
  choice: isang anak na lalaki
  rationale: Pinananatili nito ang di-tiyak na anyo ng pangngalang walang artikulo at hindi nagdaragdag ng diin na wala sa Griyego.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: pinangalanan ni Jose ang bata na Jesus
  rationale: Idyomatiko at malinaw sa Filipino. Iniiwasan nito ang artipisyal na literal na hulma na “tinawag ang pangalan niya,” habang tapat na ipinahahayag ang pagbibigay ng pangalan.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ito ang kinagawiang anyo ng pangalan sa Bagong Tipan sa Filipino.
theological_decisions:
- issue: Ipinahihiwatig ba ng “hanggang sa” ang nangyari sa pagsasama nina Jose at Maria pagkatapos manganak?
  choice: Isinalin ang ἕως οὗ bilang “hanggang sa” nang walang idinagdag na pahayag tungkol sa nangyari pagkatapos.
  alternative: Maaaring ipalagay ng ilan na nagkaroon sila ng normal na relasyong mag-asawa pagkatapos; ipinapalagay naman ng iba na walang ipinahihiwatig na pagbabago ang parirala.
  rationale: Itinatakda ng pariralang Griyego ang hangganan ng panahong tahasang tinutukoy, ngunit hindi nito lamang nilulutas ang tanong tungkol sa sumunod na panahon. Pinananatili ng salin ang tunay na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sinipingan” bilang mahinahong katumbas ng seksuwal na eupemismo sa Griyego; ginamit naman ang idyomatikong “pinangalanan” sa halip na gayahin ang hindi natural na kayarian ng orihinal. Tahasang pinangalanan sina Jose at Maria upang maiwasan ang kalituhan sa mga panghalip.
