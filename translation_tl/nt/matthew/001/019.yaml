  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: tl
  text: Si Jose[a], ang asawa niya, ay isang taong matuwid at ayaw siyang ilantad sa hayagang kahihiyan.[b] Nagbalak siyang diborsiyuhin siya nang lihim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katipan niya.” Sa Griyego, “lalaki/asawa niya” ang nakasulat, na sumasalamin sa legal na bisa ng pagkakatipan ng mga Judio.
    reason: lexical_alternative
  - marker: b
    text: O “gawing halimbawa sa harap ng madla” o “ipahiya sa harap ng publiko.”
    reason: lexical_alternative
  - marker: c
    text: O “paalisin siya nang pribado.” Sa kontekstong ito, tumutukoy ito sa pormal na diborsiyo habang sila ay magkatipan pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: asawa niya
  rationale: Maaaring mangahulugan ang ἀνήρ na “lalaki” o “asawa.” Dito, ipinahihiwatig ng legal na bisa ng kanilang pagkakatipan at ng ἀπολῦσαι na ang “asawa” ang pinakanatural na salin, habang nililinaw sa talababa na hindi pa sila nagsasama bilang mag-asawa.
- source_word: δίκαιος
  choice: matuwid
  rationale: Pinananatili ng “matuwid” ang moral at biblikal na bigat ng δίκαιος nang hindi ipinapakahulugan kung pangunahing tumutukoy ito sa pagsunod sa kautusan, habag, o kapuwa.
- source_word: δειγματίσαι
  choice: ilantad sa hayagang kahihiyan
  rationale: Ipinapahayag ng δειγματίζω ang paglalantad sa isang tao na may kaakibat na pampublikong kahihiyan. Malinaw at natural ito sa modernong Tagalog.
- source_word: ἐβουλήθη
  choice: nagpasiya
  rationale: Ipinahihiwatig ng βούλομαι ang pinag-isipang hangarin o pasiya; ang “nagpasiya” ay malinaw sa daloy ng salaysay.
- source_word: λάθρᾳ
  choice: nang palihim
  rationale: Ang λάθρᾳ ay tumutukoy sa pagkilos nang hindi lantad o sa pribadong paraan. Ang “nang palihim” ay tuwirang katumbas at angkop sa hangaring iwasan ang hayagang kahihiyan.
- source_word: ἀπολῦσαι
  choice: hiwalayan siya
  rationale: Bagaman literal na maaaring “paalisin” o “pakawalan,” sa konteksto ng legal na may-bisang pagkakatipan, tumutukoy ito sa pormal na pagwawakas ng relasyon. Nauunawaan sa Tagalog ang “hiwalayan” nang hindi ito ginagawang karaniwang pagkansela lamang ng kasunduan sa pagpapakasal.
- source_word: δὲ
  choice: naman
  rationale: Ang δέ ay banayad na pang-ugnay na nagpapatuloy sa salaysay; natural itong naipapahayag dito ng “naman.”
- source_word: ὢν καὶ μὴ θέλων
  choice: ay isang taong matuwid at ayaw
  rationale: Pinananatili ang dalawang magkakaugnay na paglalarawan bilang batayan ng pasiya ni Jose, sa natural na kayariang Tagalog.
theological_decisions:
- issue: Paglalarawan kay Jose bilang δίκαιος
  choice: Isinalin bilang “isang taong matuwid” nang hindi nililimitahan ang kahulugan sa mahigpit na pagsunod sa kautusan o sa pagiging mahabagin.
  alternative: “makatarungan” o isang paliwanag na tahasang nagtatampok lamang sa habag
  rationale: Magkasamang inilalahad ng Griyego ang pagiging matuwid ni Jose at ang ayaw niyang ipahiya si Maria. Pinananatili ng salin ang tensiyong ito sa halip na magtakda ng iisang teolohikal o etikal na paliwanag.
- issue: Legal na kalagayan nina Jose at Maria
  choice: Ginamit ang “asawa” at “hiwalayan” sa pangunahing teksto.
  alternative: “katipan” at “putulin ang kasunduan sa pagpapakasal,” o ang mas literal na “lalaki niya” at “paalisin”
  rationale: Sa unang-siglong kaugaliang Judio, legal na may bisa ang pagkakatipan at nangangailangan ng pormal na pagwawakas. Ipinahahayag ng mga terminong pinili ang legal na katotohanang iyon, habang nasa talababa ang mahalagang paglilinaw at mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “siya” ayon sa karaniwang Tagalog sa halip na mga panghalip na may kasarian. Napanatili ang legal na katangian ng pagkakatipan at ang hindi ganap na nilulutas na ugnayan ng katuwiran at habag sa pagkilos ni Jose.
