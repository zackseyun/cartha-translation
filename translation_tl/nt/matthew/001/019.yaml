    issue: Hindi sapat ang legal na linaw ng “hiwalayan siya” para sa ἀπολῦσαι.
    rationale: Sa konteksto ng legal na may-bisang pagkakatipan, ang pandiwa ay tumutukoy sa pormal na diborsiyo. Ang “hiwalayan” sa kasalukuyang Tagalog ay madaling maunawaan bilang impormal na pagtatapos lamang ng relasyon.
