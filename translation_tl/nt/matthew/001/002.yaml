  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: tl
  text: Si Abraham ang naging ama ni Isaac[a]; si Isaac ang naging ama ni Jacob; at si Jacob ang naging ama ni Juda at ng kanyang mga kapatid na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipinanganak ni Abraham si Isaac.” Sa mga talaangkanan, ang pandiwang Griyego ay tumutukoy sa pagiging ama at maaari ring gamitin para sa pagiging ninuno sa linya ng ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ang γεννάω ay tumutukoy sa pag-aanak o ugnayang nagmumula sa panig ng lalaki. Ang “naging ama ni” ay malinaw, likas, at marangal sa makabagong Tagalog, at hindi kasintahimik o kasinlumang pakinggan ng mas literal na mga anyo.
- source_word: δὲ
  choice: si; at si
  rationale: Mahinang pang-ugnay ang δέ rito, hindi tanda ng pagsalungat. Ang paghihiwalay sa pamamagitan ng tuldok-kuwit at paggamit ng “at” sa huling sugnay ay nagbibigay ng likas na daloy sa sunod-sunod na talaangkanan.
- source_word: Ἰούδαν
  choice: Juda
  rationale: Ang tinutukoy ay ang patriyarkang si Juda, anak ni Jacob. “Juda” ang nakaugaliang anyong Filipino ng pangalang ito at malinaw na naiiba kay Judas.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: mga kapatid nitong lalaki
  rationale: Bagaman walang kasariang ipinahihiwatig ang salitang Tagalog na “kapatid,” panlalaki at maramihan ang salitang Griyego at tumutukoy sa ibang mga anak na lalaki ni Jacob. Pinananatili ng “mga kapatid nitong lalaki” ang katiyakang iyon.
- source_word: Ἀβραάμ / Ἰσαάκ / Ἰακώβ
  choice: Abraham / Isaac / Jacob
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Filipino.
theological_decisions:
- issue: Pagpapahayag sa pandiwa ng talaangkanan
  choice: Gamitin ang “ang naging ama ni” sa bawat salin ng ἐγέννησεν sa talata.
  alternative: “Nagkaanak ng” o ang baligtad na ayos na “naging anak ni.”
  rationale: Pinananatili nito ang pananaw at diin ng Griyego sa linyang nagmumula sa ama, habang hindi ipinipilit na sa lahat ng talaangkanan ay laging tuwirang ama lamang at hindi ninuno ang tinutukoy.
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinanatili ang marangal at maindayog na anyo ng talaangkanan. Gumamit ng tuldok-kuwit upang maiwasan ang paulit-ulit at mabigat na pag-uugnay, at nilinaw ang kasariang panlalaki ng mga kapatid ni Juda.
