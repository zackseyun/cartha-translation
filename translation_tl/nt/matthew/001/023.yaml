  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: tl
  text: “Narito, ang birhen[a] ay magdadalang-tao at magsisilang ng isang anak na lalaki, at tatawagin nila siyang Emmanuel[b]”—na ang kahulugan kapag isinalin ay “Kasama natin ang Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring tumukoy sa isang dalagang babae; gayunman, sa konteksto ng salaysay ni Mateo tungkol sa paglilihi at kapanganakan ni Jesus, ang kahulugang “birhen” ang malinaw na ipinahihiwatig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring baybayin na “Immanuel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Pinananatili ang panawag-pansing lakas at marangal na himig ng siping propetiko, habang nananatiling malinaw sa makabagong Tagalog.
- source_word: παρθένος
  choice: birhen
  rationale: Ito ang karaniwang kahulugan ng salitang Griyego sa konteksto ng salaysay ni Mateo tungkol sa pambihirang paglilihi kay Jesus. Nasa talababa ang mas malawak na posibleng pagtukoy sa isang dalagang babae.
- source_word: ἐν γαστρὶ ἕξει
  choice: magdadalang-tao
  rationale: Likas na katumbas sa Tagalog ng idyomang literal na ‘magkakaroon sa sinapupunan’; pinananatili nito ang hinaharap na diwa nang hindi nagiging mekanikal.
- source_word: τέξεται υἱόν
  choice: magsisilang ng isang anak na lalaki
  rationale: Malinaw at likas na pahayag sa Tagalog para sa panganganak ng isang anak na lalaki.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: tatawagin nila siyang
  rationale: Pinananatili ang ikatlong panauhang maramihan at ang di-tiyak na gumagawa, ngunit inihahayag ito sa natural na ayos ng Tagalog.
- source_word: Ἐμμανουήλ
  choice: Emmanuel
  rationale: Malapit na transliterasyon ng anyong Griyego at pamilyar na anyo ng pangalan sa Tagalog; binabanggit sa talababa ang anyong ‘Immanuel.’
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: na kung isasalin ay
  rationale: Natural at malinaw na Tagalog na nagpapahayag na ipinaliliwanag ni Mateo ang kahulugan ng pangalan.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Kasama natin ang Diyos
  rationale: Direkta at idiomatikong paglilipat ng kahulugan ng pangalan, nang walang idinagdag na paliwanag na teolohikal.
theological_decisions:
- issue: Ang kahulugan ng παρθένος sa konteksto ng birheng paglilihi
  choice: birhen
  alternative: dalagang babae
  rationale: Bagaman maaaring tumukoy ang salita sa isang dalagang babae sa ilang gamit, ang mismong salaysay ng Mateo at ang gamit niya ng παρθένος ay sumusuporta sa ‘birhen.’ Nananatili sa talababa ang leksikal na saklaw nang hindi pinapahina ang kahulugan sa kontekstong ito.
- issue: Ang pagpapaliwanag sa pangalang Emmanuel
  choice: Isalin lamang bilang ‘Kasama natin ang Diyos’
  alternative: Dagdagan ng tahasang paliwanag tungkol sa pagkakatawang-tao
  rationale: Ang teksto mismo ang nagbibigay ng kahulugan ng pangalan. Pinananatili ng salin ang teolohikal na bigat nito ngunit hindi nagdaragdag ng doktrinal na paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Narito’ upang mapanatili ang propetikong panawag-pansin; ang iba pang mga parirala ay inayos sa natural na balangkas ng Tagalog nang hindi inaalis ang di-tiyak na maramihang paksa ng ‘tatawagin nila.’
