id: MAT.1.7
reference: Matthew 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: tl
  text: Si Solomon ang naging ama ni Rehoboam, si Rehoboam ang naging ama ni Abias, at si Abias ang naging ama ni Asaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Asa” ang mababasa, na tumutugma sa pangalan ng hari ng Juda sa 1 Hari 15 at 2 Cronica 14–16; “Asaf” ang mababasa sa tekstong Griyego rito.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Sa talaangkanan, tumutukoy ang γεννάω sa pagiging ama o sa linya ng salinlahi. Likas at malinaw sa makabagong Filipino ang “naging ama ni,” at hindi ito kasing-luma o kasing-pormal ng “ipinanganak si” sa ganitong gamit.
- source_word: δὲ
  choice: at / ipinahiwatig ng pagkakasunod-sunod
  rationale: Mahinang pang-ugnay ang δέ rito, hindi panalungat. Ginamit ang “at” bago ang huling sugnay, habang sapat na ang kuwit sa naunang pag-uugnay upang maging natural ang daloy sa Filipino.
- source_word: Σολομών
  choice: Solomon
  rationale: Karaniwang anyo ng pangalan sa makabagong Filipino at madaling maiugnay sa tauhan sa Lumang Tipan.
- source_word: Ῥοβοάμ
  choice: Rehoboam
  rationale: Malinaw na transliterasyon ng pangalang Griyego at kinikilalang anyo ng pangalan ng hari.
- source_word: Ἀβιά
  choice: Abias
  rationale: Karaniwang anyong Filipino ng pangalang biblikal na ito at pinananatili ang kaugnayan nito sa pangalan sa Lumang Tipan.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Tapat na isinasalin sa pangunahing teksto ang Ἀσάφ ng ibinigay na edisyong Griyego; ginagamit ang “f” ayon sa natural na baybay sa Filipino.
theological_decisions:
- issue: Kung iaayon ang pangalan sa listahan ng mga hari sa Lumang Tipan sa pamamagitan ng pagsasaling “Asa” sa halip na Ἀσάφ
  choice: Panatilihin ang “Asaf” sa pangunahing teksto
  alternative: Isalin bilang “Asa” upang tumugma sa hari ng Juda sa 1 Hari 15 at 2 Cronica 14–16
  rationale: Ἀσάφ ang mababasa sa ibinigay na tekstong Griyego, kaya hindi ito tahimik na inaayon sa tala sa Lumang Tipan. Inilalagay sa talababa ang alternatibong pagbasa upang maging hayag ang tekstuwal at pang-talaangkanang usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang paulit-ulit na hulma ng talaangkanan upang mapanatili ang estruktura ng Griyego nang hindi nagiging lipas o mabigat ang pananalita. Inilagay ang talababa pagkatapos ng “Asaf,” ang salitang mismong tinutukoy ng variant.
