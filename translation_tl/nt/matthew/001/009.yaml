source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: tl
  text: Si Uzias ay naging ama ni Jotam[a]; si Jotam ay naging ama ni Ahaz; at si Ahaz ay naging ama ni Ezequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego na ἐγέννησεν ay tradisyonal na lumilitaw sa mga talaangkanan sa konstruksiyong “ipinanganak ni”; dito, ginamit ang “naging ama ni” bilang malinaw at makabagong katumbas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Uzias
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng hari sa Lumang Tipan, sa halip na ang mas tuwirang transliterasyong Griyego na Ozias.
- source_word: δὲ
  choice: ay / at
  rationale: Mahinang pang-ugnay ito sa sunod-sunod na talaangkanan. Ang ay sa unang dalawang sugnay at at sa panghuli ay likas sa Filipino at pinananatili ang maayos na daloy nang hindi labis na binibigyang-diin ang pang-ugnay.
- source_word: ἐγέννησεν
  choice: naging ama ni
  rationale: Sa talaangkanan, ipinapahayag ng γεννάω ang ugnayang paternal. Ang naging ama ni ay malinaw, makabago, at marangal na katumbas sa Filipino, samantalang naiiwasan ang malabo o di-likas na literalismo.
- source_word: Ἰωαθάμ
  choice: Jotam
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan ng hari sa Lumang Tipan.
- source_word: Ἀχάζ
  choice: Ahaz
  rationale: Pinanatili ang kinikilalang anyong biblikal sa Filipino, na malapit din sa anyong Griyego.
- source_word: Ἑζεκίαν
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng hari sa Lumang Tipan sa halip na ang mas Griyegong Ezekias.
theological_decisions:
- issue: Saklaw ng γεννάω sa talaangkanan
  choice: 'Isinalin bilang tuwirang pagkamagulang na paternal: “naging ama ni.”'
  alternative: “ninuno ni” o “naging ninuno ni”
  rationale: Tuwirang inilalahad ng talata ang sunod-sunod na ugnayang paternal. Bagaman maaaring lumaktaw ng mga salinlahi ang mga talaangkanang biblikal, hindi iyon ipinasok sa pangunahing teksto dahil hindi iyon tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na hulma ng talaangkanan, ngunit ginamit ang likas na pang-ugnay na “at” sa huling sugnay. Lumilitaw sa pangunahing teksto ang panandang talababa na [a].
