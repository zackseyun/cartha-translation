  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: tl
  text: Si Josias ang naging ama ni Jeconias at ng mga kapatid niyang lalaki noong panahon ng sapilitang pagpapatapon sa Babilonia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “noong panahon ng pagkakatapon sa Babilonia.” Ang salitang Griyego ay maaaring tumukoy sa sapilitang paglilipat o pagkakatapon; itinatampok ng “sapilitang pagpapatapon” ang puwersahang katangian ng pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Sa talaangkanan, tumutukoy ang γεννάω sa pagiging ama o sa ugnayang pinagmulan sa linya ng angkan. Likas at marangal sa makabagong Tagalog ang “naging ama ni,” at hindi nito ipinipilit na lutasin kung tuwirang ama ang tinutukoy sa bawat salinlahi.
- source_word: Ἰεχονίαν
  choice: Jeconias
  rationale: Ginamit ang anyong pangalang kinikilala sa tradisyong Tagalog at malapit sa transliterasyon ng Griyegong Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: mga kapatid niyang lalaki
  rationale: Tiyak na panlalaking maramihan ang ἀδελφούς; nililinaw ng “lalaki” ang kasariang ipinahihiwatig ng Griyego.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: noong panahon ng sapilitang pagdadala sa Babilonia
  rationale: Temporal dito ang ἐπί na may genitive. Ang “sapilitang pagdadala” ay natural na Tagalog na nagpapakita sa puwersahang paglilipat na saklaw ng μετοικεσία, at ang “sa Babilonia” ay nagpapahayag ng hantungan.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ang δέ sa sunod-sunod na talaangkanan; sapat na ang likas na daloy ng pangungusap sa Tagalog nang walang hiwalay na katumbas.
theological_decisions:
- issue: Pagpapaikli ng mga salinlahi sa talaangkanan ni Mateo
  choice: Tuwirang isinalin ang nakasaad na ugnayang genealogical nang hindi nilulutas sa pangunahing teksto ang mga tanong na pangkasaysayan.
  alternative: Unawain ang γεννάω bilang maaaring tumukoy sa pagiging ninuno at hindi laging sa agarang biyolohikal na pagiging ama.
  rationale: Maaaring magpaikli ng mga salinlahi ang anyo ng talaangkanan ni Mateo. Pinananatili ng “naging ama ni” ang pormula at ang tensiyon ng teksto nang hindi nagdaragdag ng paliwanag na pampagkakasundo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “sapilitang pagdadala” kaysa sa teknikal na “deportasyon” upang madaling maunawaan ng karaniwang mambabasa habang napapanatili ang puwersahang diwa ng salita.
