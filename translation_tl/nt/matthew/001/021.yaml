id: MAT.1.21
reference: Matthew 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: tl
  text: Magsisilang siya ng isang anak na lalaki, at papangalanan mo siyang Jesus[a], sapagkat siya ang magliligtas sa kanyang bayan mula sa kanilang mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Jesus ay anyong Griyego na katumbas ng Hebreo/Aramaikong Yeshua (Josue), na kaugnay ng diwang “Nagliligtas si Yahweh.” Sinasalamin ng paliwanag na “sapagkat siya ang magliligtas” ang paglalaro sa kahulugan ng pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: Magsisilang siya
  rationale: Ang panghinaharap na anyo ng τίκτω ay tumutukoy sa panganganak; natural at malinaw sa modernong Tagalog ang “magsisilang.”
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ang δέ. Hindi na ito tahasang isinalin upang maging natural ang daloy sa Tagalog.
- source_word: υἱὸν
  choice: isang anak na lalaki
  rationale: Tumpak nitong ipinapahayag ang υἱός at ang di-tiyak na gamit nito sa pahayag tungkol sa panganganak.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: papangalanan mo siyang
  rationale: Ito ang likas na modernong Tagalog para sa pormulang Griyego ng pagbibigay ng pangalan, nang hindi nagiging matigas ang literal na “tatawagin mo ang kanyang pangalan.”
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang kinagawiang anyo ng pangalan sa Bagong Tipan sa Tagalog; ipinaliliwanag sa talababa ang kaugnayan nito sa Yeshua/Josue at sa pagliligtas.
- source_word: αὐτὸς
  choice: siya ang
  rationale: Ang ayos na “siya ang magliligtas” ay natural na Tagalog at pinananatili ang pokus o diin sa mismong batang si Jesus bilang tagapagligtas, nang hindi sobra ang pagdidiin.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa ipinag-uutos na pangalan; ang “sapagkat” ay angkop sa marangal na rehistro.
- source_word: σώσει
  choice: magliligtas
  rationale: Direktang ipinapahayag nito ang pangunahing diwa ng σῴζω sa kontekstong “mula sa kanilang mga kasalanan.”
- source_word: τὸν λαὸν αὐτοῦ
  choice: sa kanyang bayan
  rationale: Ang “kanyang bayan” ay natural sa Tagalog at nagpapanatili sa pag-aari at sa posibleng tipanang pahiwatig ng λαός, nang hindi nililimitahan o pinalalawak ang saklaw.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: mula sa kanilang mga kasalanan
  rationale: Pinananatili ng “mula sa” ang diwa ng paghihiwalay sa ἀπό, at ng maramihang “mga kasalanan” ang bilang ng ἁμαρτιῶν.
theological_decisions:
- issue: Diin ng αὐτός kaugnay ng pagliligtas ni Jesus
  choice: “siya ang magliligtas”
  alternative: “siya mismo ang magliligtas” o payak na “magliligtas siya”
  rationale: Pinananatili ng hulma na “siya ang” ang pokus sa batang pinangalanang Jesus bilang gumagawa ng pagliligtas, ngunit iniiwasan ang posibleng labis na diin ng “siya mismo.”
- issue: Saklaw ng “kanyang bayan”
  choice: Hindi tinukoy nang higit sa “kanyang bayan”
  alternative: “ang kanyang bayang Israel” o “lahat ng kabilang sa kanya”
  rationale: May kontekstong Judio at tipanan ang parirala, ngunit hindi tahasang nililinaw sa talatang ito kung Israel lamang o mas malawak ang saklaw. Pinanatili ang tunay na kaluwagan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “papangalanan mo siyang” sa halip na literal ngunit matigas na pormulang “tatawagin mo ang kanyang pangalan.”
