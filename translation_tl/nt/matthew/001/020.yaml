id: MAT.1.20
reference: Matthew 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: tl
  text: Ngunit habang pinag-iisipan niya ang mga bagay na ito, narito, nagpakita sa kanya sa panaginip ang isang anghel ng Panginoon at sinabi, “Jose, anak ni David, huwag kang matakot na tanggapin si Maria bilang iyong asawa[a], sapagkat ang ipinaglihi sa kanya ay mula sa Banal na Espiritu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “tanggapin si Maria na iyong asawa.” Ang pananalitang Griyego ay tumutukoy sa pagtanggap sa kanya sa tahanan bilang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: habang pinag-iisipan niya
  rationale: Ipinahihiwatig ng genitive absolute ang nagpapatuloy na panloob na pagsasaalang-alang ni Jose, hindi pa ang isang ganap na pasiya.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pansenyas na biglang nagtuon ng pansin at nagpasigla sa salaysay.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Walang pantukoy ang ἄγγελος sa Griyego, kaya hindi ito ginawang tiyak na “ang anghel”; ang κύριος ay isinaling “Panginoon.”
- source_word: κατ’ ὄναρ
  choice: sa panaginip
  rationale: Natural at tumpak na katumbas sa modernong Tagalog ng idyomatikong pariralang Griyego.
- source_word: ἐφάνη
  choice: nagpakita
  rationale: Karaniwang salaysay na katumbas para sa isang mahimalang pagpapakita.
- source_word: υἱὸς Δαυίδ
  choice: anak ni David
  rationale: Pinananatili ang literal na pagtukoy sa angkan ni David at ang posibleng Davidikong alingawngaw nito.
- source_word: μὴ φοβηθῇς
  choice: huwag kang matakot
  rationale: Natural na kasalukuyang Tagalog na nagpapanatili sa pagbabawal at damdaming ipinahahayag ng pandiwa.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: tanggapin si Maria bilang iyong asawa
  rationale: Ang παραλαμβάνω sa konteksto ay tumutukoy sa pagtanggap kay Maria sa tahanan bilang asawa; nililinaw ng “bilang iyong asawa” ang ugnayang pangmag-asawa nang hindi sinasabing ngayon pa lamang nagsimula ang legal na katayuan nito.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ang ipinaglihi sa kanya
  rationale: Sa kontekstong bago ang kapanganakan, natural na ipinahahayag ng “ipinaglihi” ang nasa sinapupunan habang hindi dinaragdagan ang teksto ng tahasang salitang “sanggol.”
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: ay mula sa Banal na Espiritu
  rationale: Ang ἐκ ay nagpapahayag ng pinagmulan; ang “mula sa” ang malinaw at natural na katumbas nito.
theological_decisions:
- issue: Pagkakakilanlan ng ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  alternative: ang anghel ng Panginoon
  rationale: Pinananatili ng di-tiyak na “isang anghel” ang anyo ng Griyego at iniiwasang ipilit ang isang natatanging teopanikong pagkakakilanlan.
- issue: Tinutukoy ng πνεύματός ... ἁγίου
  choice: Banal na Espiritu
  alternative: isang banal na espiritu
  rationale: Sa salaysay ni Mateo, ito ay tumutukoy sa banal na Espiritu bilang kinikilalang katawagan, hindi sa isang di-tiyak na espiritu o impersonal na kapangyarihan.
- issue: Katayuan ni Maria bilang γυναῖκά σου
  choice: bilang iyong asawa
  alternative: na iyong asawa
  rationale: Pinananatili ang kahulugang pangmag-asawa at ginagawang natural sa Tagalog ang utos na tanggapin siya, nang hindi ipinapahiwatig na simpleng babae lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang bahagyang mataas na pansalaysay na “narito,” ngunit gumamit ng pangkaraniwang “pinag-iisipan,” “sa panaginip,” at “huwag kang matakot” para madaling maunawaan.
