  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: tl
  text: Si Zerubabel ay naging ama ni Abiud[a], si Abiud ay naging ama ni Eliakim, at si Eliakim ay naging ama ni Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkaanak ng”; sa mga talaangkanan sa Bibliya, maaaring ibuod ng paulit-ulit na pandiwang ito ang isang linya ng angkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: Isinalin ang pangalang pantangi sa anyong karaniwang ginagamit sa makabagong Bibliyang Tagalog at sapat na malapit sa Griyegong anyo.
- source_word: δέ
  choice: — / at
  rationale: Banayad itong pang-ugnay na nagpapatuloy sa talaan, hindi nagpapahayag ng matinding pagsalungat. Hindi kailangang ulitin sa bawat sugnay sa natural na Tagalog; ginamit ang “at” sa huling sugnay upang panatilihin ang daloy.
- source_word: ἐγέννησεν
  choice: naging ama ni
  rationale: Natural at marangal itong katumbas sa Tagalog ng pormulang pangangkanan. Naiiwasan nito ang lipas o di-likas na pananalita habang pinananatili ang ugnayang ipinahahayag ng Griyego.
- source_word: Ἀβιούδ
  choice: Abiud
  rationale: Transliterasyon ng pangalang pantangi na malinaw at nakasanayan sa tradisyong biblikal sa Tagalog.
- source_word: Ἐλιακίμ
  choice: Eliakim
  rationale: Transliterasyon na malapit sa Griyegong pangalan at karaniwang makikilala ng mga mambabasa ng Bibliya.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Payak na transliterasyon ng Griyegong pangalan nang walang di-kinakailangang tandang ponetiko.
theological_decisions:
- issue: Pagpapahayag ng γεννάω sa talaangkanang maaaring pinaikli ang mga salinlahi
  choice: naging ama ni
  alternative: ninuno ni
  rationale: Pinananatili ng “naging ama ni” ang paulit-ulit na pormula ng Griyego nang hindi tahasang nagpapasiya kung bawat ugnayan ay agarang ama-anak. Hindi ginamit sa pangunahing teksto ang “ninuno ni” sapagkat mas malawak iyon kaysa sa tuwirang anyo ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maindayog na pag-uulit ng pormulang pangangkanan at gumamit ng mga pangalang madaling makilala sa Tagalog.
