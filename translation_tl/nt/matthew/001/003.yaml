id: MAT.1.3
reference: Matthew 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: tl
  text: Si Juda ang naging ama nina Perez at Zera sa pamamagitan ni Tamar; si Perez ang naging ama ni Hezron; at si Hezron ang naging ama ni Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang salin, “Ram” ang pangalang ito, ayon sa ibang tradisyon ng pangalan o pagbasa; “Aram” ang mababasa sa tekstong Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Juda
  rationale: Ito ang karaniwang anyong Filipino ng pangalan ng patriyarka at ninuno ng lipi, at iniiwasan nitong maipagkamali siya sa mga tauhan sa Bagong Tipan na karaniwang tinatawag na Judas.
- source_word: δὲ
  choice: at / ipinahiwatig sa bantas
  rationale: Mahinang pang-ugnay ito sa sunod-sunod na talaangkanan, hindi matinding pagsalungat. Ginamit ang “at” sa huling sugnay at ang mga tuldok-kuwit sa naunang mga sugnay para sa likas na daloy sa Filipino.
- source_word: ἐγέννησεν
  choice: naging ama ni/nina
  rationale: Tumpak at likas itong modernong Filipino para sa ugnayang ipinahahayag sa talaangkanan, nang hindi gumagamit ng lipas o masyadong teknikal na pananalita.
- source_word: Φαρὲς
  choice: Perez
  rationale: Tumutugma ito sa Hebreong פֶּרֶץ at nagpapanatili ng pagkakaugnay sa karaniwang anyo ng pangalan sa Lumang Tipan.
- source_word: Ζάρα
  choice: Zera
  rationale: Tumutugma ito sa Hebreong זֶרַח at natural na transliterasyon sa Filipino.
- source_word: ἐκ τῆς Θαμάρ
  choice: kay Tamar
  rationale: Sa kontekstong talaangkanan, ipinahahayag ng ἐκ ang pinagmulan sa ina. Ang “kay Tamar” ay maikli at likas sa Filipino at malinaw na inuugnay sina Perez at Zera sa kanilang ina.
- source_word: Θαμάρ
  choice: Tamar
  rationale: Karaniwang transliterasyon ng pangalang ito sa Filipino.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Tumutugma ito sa Hebreong חֶצְרוֹן at nagpapanatili ng pagkakaugnay sa anyo ng pangalan sa Lumang Tipan.
- source_word: Ἀράμ
  choice: Aram
  rationale: Tuwirang sinusunod nito ang anyong Ἀράμ sa ibinigay na tekstong Griyego sa halip na iayon ito sa ibang tradisyon ng pangalan.
theological_decisions:
- issue: Kung iaayon ang huling pangalan sa karaniwang anyo sa ibang talaangkanan ng Lumang Tipan
  choice: Aram
  alternative: Ram
  rationale: Binabasa ng ibinigay na tekstong Griyego ang Ἀράμ, kaya “Aram” ang nasa pangunahing teksto. Inilagay sa talababa ang “Ram” upang mapanatili ang kaalaman sa pamilyar na alternatibong tradisyon nang hindi binabago ang pinagbatayang teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Pinanatili ang paulit-ulit na hulma ng talaangkanan ngunit gumamit ng mga tuldok-kuwit upang maging natural ang daloy. Inilipat ang panandang [a] sa “Aram,” sapagkat iyon ang tinutukoy ng talababa.
