  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: tl
  text: 'Nangyari ang lahat ng ito[a] upang matupad ang sinabi ng Panginoon sa pamamagitan ng propeta, na nagsabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nangyari ang buong bagay na ito.” Idiniriin ng pariralang Griyego na τοῦτο δὲ ὅλον ang kabuuan ng mga pangyayaring kababanggit.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: lahat ng ito
  rationale: Tinutukoy ng pang-isahang neuter na τοῦτο ang mga pangyayaring kababanggit bilang isang kabuuan, at idiniriin ng ὅλον ang kanilang kalahatan. Likas sa modernong Tagalog ang “lahat ng ito.” Hindi na ginamitan ng hiwalay na panandang pandiskurso para sa δέ sapagkat sapat na ang maayos na pagpapatuloy ng salaysay.
- source_word: γέγονεν
  choice: nangyari
  rationale: Ang perpektong anyo ng γίνομαι ay tumutukoy sa naganap na pangyayari na may kaugnayan sa kasalukuyang salaysay. Ang “nangyari” ay malinaw at natural, nang hindi gumagamit ng makalumang “naganap nga.”
- source_word: ἵνα
  choice: upang
  rationale: Maaaring magpahiwatig ang ἵνα ng layunin, bunga, o kapwa nito. Pinananatili ng “upang” ang teleolohikal na himig nang hindi ganap na nilulutas ang ugnayan.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Pinananatili ng “matupad” ang tinig na balintiyak at ang temang katuparan sa pormula ni Mateo.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Natural na katumbas sa Tagalog ng substantivized passive participle; tumutukoy ito sa pahayag na susunod.
- source_word: ὑπὸ κυρίου
  choice: ng Panginoon
  rationale: Ipinakikilala ng ὑπό ang Panginoon bilang pinagmulan at pangunahing tagapagsalita. Hindi idinagdag ang “Diyos,” na wala sa Griyego.
- source_word: διὰ τοῦ προφήτου
  choice: sa pamamagitan ng propeta
  rationale: Ipinahahayag ng διά na ang propeta ang tagapamagitan ng pahayag, na naiiba sa Panginoon bilang pangunahing tagapagsalita.
- source_word: λέγοντος
  choice: propetang nagsabi
  rationale: Ang participle ay umaayon sa “propeta” at nagpapakilala sa siping susunod. Bagaman may pag-uulit sa “sinabi” at “nagsabi,” malinaw nitong pinananatili ang kayarian at ahensiya ng Griyego.
theological_decisions:
- issue: Ahensiya sa pahayag ng propeta
  choice: “sinabi ng Panginoon sa pamamagitan ng propeta”
  alternative: “sinabi ng propeta mula sa Panginoon”
  rationale: Ibinubukod ng Griyego ang Panginoon bilang pangunahing tagapagsalita (ὑπό) at ang propeta bilang tagapamagitan (διά). Pinananatili ito nang hindi nagpapalawak tungo sa isang partikular na doktrina ng inspirasyon.
- issue: Pormula ng katuparan
  choice: “upang matupad”
  alternative: “kaya natupad”
  rationale: Maaaring saklawin ng ἵνα at ng subjunctive ang layunin at bunga. Hindi nilulutas ng salin kung alin sa dalawa ang tanging diin.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang “Panginoon” para sa κύριος at iniwasan ang makaluma o labis na teknikal na pananalita. Ang tutuldok ay nagpapakilala sa siping sumusunod sa talata 23.
