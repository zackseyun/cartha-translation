  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: tl
  text: Ang talaan ng angkan[a] ni Jesus na siyang Mesiyas,[b] na anak ni David at anak ni Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang pambungad na parirala na “Ang aklat ng pinagmulan” o “Ang aklat ng kapanganakan.” Malawak ang maaaring kahulugan ng salitang Griyego, ngunit ang “talaan ng angkan” ang pinakanaaangkop sa talaangkanang kasunod.
    reason: alternative_reading
  - marker: b
    text: 'Tradisyonal na salin: “Cristo.” Dito, ang salitang Griyegong Χριστός ay isinaling “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Ang talaan
  rationale: Sa pambungad na nagsisilbing pamagat sa isang talaangkanan, natural na ipinahihiwatig nito ang isang nakasulat na tala; mas malinaw sa modernong Tagalog kaysa literal na “aklat.”
- source_word: γενέσεως
  choice: ng angkan
  rationale: Ang kasunod na konteksto ay talaangkanan, kaya ito ang pinakamalinaw na pangunahing diwa. Gayunman, maaaring tumukoy ang γένεσις sa pinagmulan o kapanganakan, kaya pinanatili ang lawak nito sa talababa.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: χριστοῦ
  choice: na Mesiyas
  rationale: Dito ay titulo ang Χριστός, hindi apelyido; ang “Mesiyas” ay malinaw at natural sa Filipino.
- source_word: υἱοῦ Δαυὶδ
  choice: anak ni David
  rationale: Pinananatili ang literal at mesiyanikong katawagang “anak ni David,” bagaman ang kahulugan sa talaangkanan ay inapo.
- source_word: υἱοῦ Ἀβραάμ
  choice: anak ni Abraham
  rationale: Pinananatili ang idiomang genealogical at ang ugnayang tipan kay Abraham, bagaman tumutukoy ito sa pagiging inapo.
theological_decisions:
- issue: Paglilipat ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginagamit ang salita bilang titulong tumutukoy sa pinahiran at ipinangakong hari. Iniiwasang ipakahulugan ito bilang apelyido ni Jesus.
- issue: Diwa ng γενέσεως sa pamagat
  choice: angkan/talaangkanan
  alternative: pinagmulan o kapanganakan
  rationale: Ang agarang konteksto ay listahan ng mga ninuno, ngunit maaaring may mas malawak na alingawngaw ng pinagmulan; hindi ito tuluyang nilutas at isinama ang ibang posibilidad sa talababa.
- issue: Diwa ng υἱός kina David at Abraham
  choice: anak
  alternative: inapo
  rationale: Ang “anak” ang pormal na katumbas at nagpapanatili sa bigat ng titulong “anak ni David”; nililinaw sa talababa na malawak ang genealogical na gamit nito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “talaan ng angkan” sa halip na mas teknikal na “genealohiya” o mas siksik na “aklat ng salinlahi.” Ang “na Mesiyas” ay natural na appositional construction sa Filipino; ang kuwit bago ang unang talababa ay naghihiwalay sa pagkakakilanlan ni Jesus sa kasunod na paglalarawan sa kaniyang angkan.
