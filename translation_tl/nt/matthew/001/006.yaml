  source_fidelity: Ang “Naging anak ni Jesse si Haring David” ay nagpapahayag ng ugnayang mag-ama ngunit hindi nito malinaw na isinasalin ang aktibong panlalaking genealogical na ἐγέννησεν (‘naging ama ni’/‘nagkaanak kay’). Mas tapat ang tuwirang hulmaing “ang ama ni.” Napananatili naman ng “sa asawa ni Uria” ang eliptikong ἐκ τῆς τοῦ Οὐρίου at ang hindi pagbanggit kay Batseba.
