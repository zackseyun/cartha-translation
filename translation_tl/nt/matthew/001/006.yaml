base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: tl
  text: Si Jesse ang ama ni Haring David. Si Haring David ang ama ni Solomon sa asawa ni Uria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “mula sa [babae] ni Uria,” isang eliptikong pahayag na nangangahulugang “sa asawa ni Uria.” Hindi pinangalanan dito ni Mateo si Batseba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: naging anak ni … si
  rationale: Sa talaangkanan, tumutukoy ang γεννάω sa pagiging ama o lalaking ninuno. Ang hulmaing “naging anak ni X si Y” ay likas sa modernong Filipino at naipapakita ang ugnayang pangkanunu-nunuan nang hindi gumagamit ng lipas na “ipinanganak ni,” na maaari ring magpahiwatig na ang lalaki ang nanganak.
- source_word: βασιλέα
  choice: Haring David
  rationale: Pinananatili ang tiyak at mariing pagkakakilanlan kay David bilang hari. Ang “Haring David” ang pinakanatural na katumbas sa Filipino ng τὸν Δαυὶδ τὸν βασιλέα.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: sa asawa ni Uria
  rationale: Ang Griyego ay eliptikong “mula sa [babae] ni Uria,” kung saan ipinahihiwatig ang asawa. Natural sa Filipino ang “sa asawa ni Uria,” at pinananatili nito ang sadyang di-tuwirang pagtukoy ni Mateo sa babae.
- source_word: Ἰεσσαὶ
  choice: Jesse
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: Δαυὶδ
  choice: David
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: Σολομῶνα
  choice: Solomon
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: Οὐρίου
  choice: Uria
  rationale: Karaniwang anyo ng pangalang biblikal sa Filipino.
- source_word: δέ
  choice: —
  rationale: Banayad na pang-ugnay lamang ito sa sunod-sunod na talaangkanan. Hindi na ito tahasang isinalin upang maging natural ang Filipino, habang malinaw pa rin ang pagkakasunod.
theological_decisions:
- issue: Di-tuwirang pagtukoy ni Mateo kay Batseba
  choice: Panatilihin ang “sa asawa ni Uria” at huwag idagdag ang pangalang Batseba.
  alternative: “kay Batseba” o “sa dating asawa ni Uria”
  rationale: Sadyang ipinakikilala ng Griyego ang babae ayon sa kaugnayan niya kay Uria. Pinananatili nito ang alusyong salaysay at moral sa 2 Samuel, nang hindi nilulutas o pinapahina sa pamamagitan ng pagdaragdag ng pangalang wala sa teksto. Hindi rin idinagdag ang “dating,” sapagkat wala itong tuwirang katumbas sa parirala.
translation_notes:
  register: Modernong Filipino na likas, malinaw, at marangal. Ginamit ang karaniwang hulmaing “naging anak ni … si …” para sa talaangkanan; pinanatili ang maharlikang titulo at ang di-tuwirang pagtukoy sa asawa ni Uria. Inilagay ang pananda ng talababa sa mismong sugnay na ipinaliliwanag nito.
