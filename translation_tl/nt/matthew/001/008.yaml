id: MAT.1.8
reference: Matthew 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: tl
  text: Si Asaf ay naging ama ni Josafat[a]; si Josafat ay naging ama ni Joram; at si Joram ay naging ama ni Uzias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Asa” ang mababasa sa halip na “Asaf”; “Asa” rin ang pangalan ng hari ng Juda sa talaangkanan sa Lumang Tipan.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: Tuwirang tinutumbasan ng anyong Tagalog ang pangalang Griyego na Ἀσάφ sa SBLGNT. Hindi ito tahimik na itinutuwid bilang Asa, bagaman iyon ang pangalang inaasahan mula sa talaangkanan sa Lumang Tipan.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito sa talaangkanan, hindi pagsalungat. Likas sa Tagalog ang paggamit ng “at” bago ang huling sugnay; ang unang pag-uugnay ay sapat nang ipinahihiwatig ng sunod-sunod na ayos.
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Malinaw at likas na modernong Tagalog para sa ugnayang paternal sa isang talaangkanan. Iniiwasan nito ang mas lumang “ipinanganak” na maaaring tumukoy sa ina, at ang “nagkaanak” na hindi kasingtiyak sa ipinapakitang ugnayan.
- source_word: Ἰωσαφάτ
  choice: Jehoshafat
  rationale: Ginamit ang nakikilalang anyong Tagalog ng pangalan ng hari sa Lumang Tipan habang nananatiling malapit sa pangalang Griyego.
- source_word: Ἰωράμ
  choice: Joram
  rationale: Sinusunod ang maikling anyo ng pangalang nasa Griyego sa halip na palawakin ito bilang Jehoram.
- source_word: Ὀζίαν
  choice: Uzias
  rationale: Ginamit ang nakikilalang tradisyonal na anyong Tagalog ng pangalan ng hari, sa halip na ang mas tuwirang transliterasyong Griyego na Ozias.
theological_decisions:
- issue: Paglalahad sa paulit-ulit na δὲ at ἐγέννησεν sa talaangkanan
  choice: Panatilihin ang bawat ugnayang ama-anak sa magkakatulad na mga sugnay, at gamitin ang “at” bago ang huling sugnay.
  alternative: Ulitin ang “at” sa bawat sugnay, o gumamit ng mas literal ngunit hindi gaanong likas na “ipinanganak ni.”
  rationale: Pinananatili nito ang eksaktong pagkakasunod-sunod at paulit-ulit na balangkas ng talaangkanan sa malinaw at likas na Tagalog.
- issue: Kung itutuwid ba ang Ἀσὰφ tungo sa inaasahang pangalang Asa
  choice: Panatilihin ang “Asaf” sa pangunahing teksto at ilagay ang “Asa” sa talababa.
  alternative: Gamitin ang “Asa” sa pangunahing teksto upang iayon sa talaangkanan sa Lumang Tipan.
  rationale: Ang pangunahing teksto ay sumusunod sa pangalang nasa ibinigay na tekstong Griyego at hindi tahimik na pinagtutugma ito sa Lumang Tipan. Ipinababatid naman ng talababa ang mahalagang baryante at ang pagkakakilanlang pangkasaysayan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang paulit-ulit na “ang naging ama ni” upang maging natural sa karaniwang mambabasa at mapanatili ang estruktura ng talaangkanan. Ang lahat ng pangalan ay inangkop sa karaniwang baybay sa Tagalog nang hindi binabago ang mahalagang baryante sa Asaf/Asa.
