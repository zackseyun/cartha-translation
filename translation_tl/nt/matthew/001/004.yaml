id: MAT.1.4
reference: Matthew 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: tl
  text: Si Aram[a] ang naging ama ni Aminadab; si Aminadab ang naging ama ni Nahson; at si Nahson ang naging ama ni Salmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ram.” Aram (Ἀράμ) ang mababasa sa tekstong Griyego, samantalang “Ram” ang anyo ng pangalan sa Hebreong talaangkanan.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Tuwirang kinakatawan ang anyong Griyego na Ἀράμ; inilalagay sa talababa ang alternatibong “Ram,” na karaniwang anyong batay sa Hebreo.
- source_word: δὲ
  choice: si; at si
  rationale: Sa talaangkanan, ang δέ ay nag-uugnay at nagpapasulong sa sunod-sunod na salinlahi, hindi nagpapahayag ng matinding pagsalungat. Bahagyang ipinahiwatig ito sa bantas at sa likas na daloy ng Filipino.
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Malinaw at likas na modernong Filipino para sa pandiwang ginagamit sa talaangkanan, nang hindi gumagamit ng makalumang “ipinanganak” na maaari ring magpahiwatig na ang lalaki mismo ang nagsilang.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Malapit na transliterasyon ng pangalang Griyego at karaniwang anyong madaling makilala sa Filipino.
- source_word: Ναασσών
  choice: Nahson
  rationale: Kinakatawan ang nakaugaliang anyo ng pangalang biblikal na kaugnay ng Hebreong pangalan, sa baybay na angkop sa Filipino.
- source_word: Σαλμών
  choice: Salmon
  rationale: Tuwirang transliterasyon ng Σαλμών at madaling basahin bilang pangalan sa Filipino.
theological_decisions: []
