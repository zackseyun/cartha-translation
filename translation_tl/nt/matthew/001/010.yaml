id: MAT.1.10
reference: Matthew 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: tl
  text: Si Hezekias ang naging ama ni Manases; si Manases ang naging ama ni Amos[a]; at si Amos ang naging ama ni Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amon” ang mababasa sa ilang salin dito upang itugma ang pangalan sa hari ng Juda sa 2 Mga Hari 21; “Amos” ang nasa tekstong Griyego ng Mateo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: ang naging ama ni
  rationale: Sa talaangkanan, ipinahihiwatig ng γεννάω ang pagiging ama o pinagmulang panlalaki. Ang “naging ama ni” ay natural at marangal sa modernong Tagalog, at hindi kasing-arkaiko ng “ipinanganak.”
- source_word: Ἑζεκίας
  choice: Hezekias
  rationale: Ginamit ang kinikilalang anyong Tagalog ng pangalang biblikal.
- source_word: Μανασσῆς
  choice: Manases
  rationale: Ginamit ang kinikilalang anyong Tagalog ng pangalang biblikal.
- source_word: Ἀμώς
  choice: Amos
  rationale: Tuwirang sinusunod ang anyong Ἀμώς sa tekstong Griyego ng Mateo, sa halip na tahimik na itugma ito sa pangalang Amon sa Mga Hari at Mga Cronica.
- source_word: Ἰωσίας
  choice: Josias
  rationale: Ginamit ang kinikilalang anyong Tagalog ng pangalang biblikal.
- source_word: δέ
  choice: ; / at
  rationale: Sa paulit-ulit na talaangkanan, ang δέ ay payak na pang-ugnay. Isinalin ang huling paglitaw bilang “at,” habang bantas ang ginamit sa naunang mga paglitaw upang maging natural ang daloy sa Tagalog.
theological_decisions:
- issue: Pagkakaiba ng pangalan sa tekstong Griyego ng Mateo at sa pangalan ng hari sa Lumang Tipan
  choice: Amos sa pangunahing teksto
  alternative: Amon, bilang pagtutugma sa hari ng Juda sa 2 Mga Hari 21
  rationale: Ang SBLGNT ay may Ἀμώς, kaya pinananatili sa pangunahing teksto ang “Amos.” Hindi tahimik na nilulutas ang pagkakaiba; inilalahad sa talababa ang “Amon” na pamilyar mula sa kaugnay na talaangkanan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “naging ama ni” bilang natural na pormula ng talaangkanan; pinanatili ang anyong “Amos” ng Griyego at inilagay agad pagkatapos nito ang panandang talababa.
