  source_fidelity: Tumpak na isinasalin ng teksto ang tatlong paglitaw ng ἐγέννησεν sa kontekstong talaangkanan bilang “naging ama ni.” Pinananatili nito ang mga pangalang Hezekias, Manases, Amos, at Josias, at lalo na ang Ἀμώς bilang “Amos,” alinsunod sa SBLGNT at walang tahimik na pagtutugma sa “Amon.”
