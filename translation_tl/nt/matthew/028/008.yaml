  terminology: Ang “libingan” para sa μνημεῖον at “mga alagad” para sa μαθηταί ay angkop at matatag na mga katawagan. Pinananatili ng “takot” ang di-nilulutas na tensiyon ng φόβος at χαρὰ μεγάλη; ang talababa ay nagbibigay ng lehitimong alternatibong diwa nang hindi ito ipinipilit sa pangunahing teksto. Tama ang angkla ng talababa sa “takot.”
