  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: tl
  text: At mabilis silang umalis sa libingan, taglay ang takot[a] at malaking kagalakan, at tumakbo upang magbalita sa kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “taglay ang mapitagang pagkamangha at malaking kagalakan.” Maaari ring tumukoy ang salitang Griyego para sa “takot” sa mapitagang pagkamangha sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: umalis
  rationale: Ang aorist participle ay tumutukoy sa pag-alis ng mga babae. Likas at malinaw sa makabagong Tagalog ang “umalis,” habang ang kaugnayan nito sa pangunahing pandiwang “tumakbo” ay naipahihiwatig ng daloy ng pangungusap.
- source_word: ταχὺ
  choice: mabilis
  rationale: Tuwirang ipinapahayag nito ang pagmamadali o bilis ng kanilang pag-alis nang hindi dinaragdagan ang diwang nasa Griyego.
- source_word: μνημείου
  choice: libingan
  rationale: Sa konteksto ng pagkabuhay na muli, tumutukoy ang μνημεῖον sa pinaglibingan kay Jesus. “Libingan” ang pinakakaraniwan at malinaw na salin sa Tagalog.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: taglay ang takot at malaking kagalakan
  rationale: Pinananatili ng “taglay” ang dalawang damdaming kasabay ng kanilang pagkilos. Tuwirang isinasalin ang φόβος bilang “takot” at ang χαρὰ μεγάλη bilang “malaking kagalakan,” nang hindi pinapawi ang sinadyang tensiyon ng teksto.
- source_word: ἔδραμον
  choice: tumakbo
  rationale: Ito ang payak at buhay na kahulugan ng aorist na anyo ng τρέχω; mas tumpak ito kaysa sa mas mahinang “nagmadali.”
- source_word: ἀπαγγεῖλαι
  choice: upang magbalita
  rationale: Ipinapakita ng “upang” ang layunin ng kanilang pagtakbo. Hindi tahasang isinasaad sa Griyego ang tuwirang layon, kaya hindi nagdagdag ng “iyon” o ng partikular na nilalaman ng balita.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Ang “mga alagad” ang kinikilalang katawagan sa mga μαθηταί ni Jesus, at pinananatili ng “kanyang” ang panghalip na αὐτοῦ.
theological_decisions:
- issue: Ang magkasabay na takot at kagalakan ng mga babae
  choice: taglay ang takot at malaking kagalakan
  alternative: taglay ang mapitagang pagkamangha at malaking kagalakan
  rationale: Maaaring saklawin ng φόβος ang takot at mapitagang pagkamangha sa kontekstong ito. Pinananatili sa pangunahing teksto ang mas tuwirang “takot” upang huwag lutasin ang tensiyon sa pagitan ng takot at kagalakan; inilalagay sa talababa ang posibleng diwa ng pagkamangha.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “taglay” upang natural na maiugnay ang magkasabay na damdamin sa pagkilos ng mga babae, at iniwasang magdagdag ng tahasang layon sa “magbalita” dahil wala nito sa Griyego.
