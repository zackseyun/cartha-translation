  verdict: approve
  source_fidelity: 'Tumpak na naipapahayag ang sunod-sunod na pagkilos at layunin sa Griyego: mabilis na pag-alis mula sa libingan, magkasabay na takot at malaking kagalakan, at pagtakbo upang magbalita sa mga alagad ni Jesus. Hindi nagdaragdag ang salin ng tahasang layon sa ἀπαγγεῖλαι, na hindi rin tahasang may layon sa teksto.'
