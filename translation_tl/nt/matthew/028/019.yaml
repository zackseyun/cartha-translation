  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: tl
  text: Kaya, humayo kayo at gawin ninyong mga alagad ang lahat ng mga bansa sa pamamagitan ng pagbabautismo sa kanila sa pangalan[a] ng Ama at ng Anak at ng Banal na Espiritu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang preposisyong isinaling “sa” ay εἰς, na literal na maaaring mangahulugang “papasok sa” o “tungo sa”; maaaring idiin nito ang pagpasok sa isang ugnayan o pagkakakilanlan sa Ama, Anak, at Banal na Espiritu.
    reason: Ipinakikita ang direksiyonal na puwersa at posibleng kahulugan ng εἰς nang hindi gumagamit ng di-likas na literal na parirala sa pangunahing teksto.
lexical_decisions:
- source_word: πορευθέντες
  choice: humayo kayo
  rationale: Bagaman anyong aorist participle ang Griyego, kasama ito ng pangunahing pautos at likas na naihahayag sa Filipino bilang tuwirang utos. Pinananatili ng “humayo” ang lakas at dignidad ng pagsusugo; hindi ginamit ang “habang kayo ay humahayo,” na maaaring magmukhang nagkataon lamang ang pagkilos.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang paghihinuha mula sa pahayag ni Jesus tungkol sa kaniyang kapangyarihan sa talata 18. Natural at malinaw sa kasalukuyang Filipino ang “Kaya.”
- source_word: μαθητεύσατε
  choice: gawin ninyong mga alagad
  rationale: Pinananatili ang sanhiang diwa ng pandiwa—ang akayin ang iba upang maging mga alagad—nang hindi gumagamit ng di-likas na pandiwang “alagarin.”
- source_word: πάντα τὰ ἔθνη
  choice: ang lahat ng bansa
  rationale: Saklaw nito ang lahat ng mga bansa o bayan. Hindi ginamit ang “mga Hentil,” sapagkat magiging mas makitid iyon kaysa sa pangkalahatang saklaw ng utos.
- source_word: βαπτίζοντες
  choice: na binabautismuhan
  rationale: Iningatan ang anyong pantulong na participle at ang kaugnayan nito sa paggawa ng mga alagad. Ang “bautismo” ay hindi nagtatakda ng isang partikular at pinagtatalunang paraan ng pagsasagawa.
- source_word: εἰς τὸ ὄνομα
  choice: sa pangalan
  rationale: Ito ang natural at nakaugaliang katumbas sa Filipino. Dahil maaaring ipahiwatig ng εἰς ang pagpasok sa isang ugnayan o pagkakakilanlan, inilagay sa talababa ang mas literal na puwersa nito sa halip na gumamit ng alanganing pariralang “papasok sa pangalan” sa pangunahing teksto.
- source_word: τοῦ πατρὸς
  choice: ng Ama
  rationale: Ginamit bilang banal na titulo sa tatluhang pormula.
- source_word: τοῦ υἱοῦ
  choice: ng Anak
  rationale: Ginamit bilang banal na titulo at iniugnay sa Ama at sa Banal na Espiritu ayon sa sintaks ng teksto.
- source_word: τοῦ ἁγίου πνεύματος
  choice: ng Banal na Espiritu
  rationale: Ito ang pamantayan at makabagong katawagan sa Filipino para sa banal na personal na tinutukoy rito.
theological_decisions:
- issue: Ang pagsasalin ng εἰς sa pormula ng bautismo
  choice: sa pangalan
  alternative: papasok sa pangalan / tungo sa pangalan
  rationale: Hindi likas sa Filipino ang literal na “papasok sa pangalan.” Pinananatili ng pangunahing teksto ang malinaw at tradisyonal na parirala, samantalang ipinababatid ng talababa na ang Griyego ay maaaring magpahiwatig ng pagpasok sa ugnayan o pagkakakilanlan. Hindi nito ipinipilit ang isang ganap na teoryang sakramental.
- issue: Ang iisang “pangalan” at ang Ama, Anak, at Banal na Espiritu
  choice: pangalan ng Ama at ng Anak at ng Banal na Espiritu
  alternative: mga pangalan ng Ama, Anak, at Banal na Espiritu
  rationale: Pinanatili ang isahan ng ὄνομα at ang tatlong magkakaugnay na genitive. Ang malalaking titik ay nagpapakitang mga banal na titulo ang mga ito nang hindi nagdaragdag sa mismong sinabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “humayo” bilang pamilyar at dignidad na wika ng pagsusugo, habang iniwasan ang sobrang teknikal o sektaryong pananalita. Ang kuwit sa hulihan ay pinanatili dahil bahagi ito ng nagpapatuloy na pangungusap sa susunod na talata.
