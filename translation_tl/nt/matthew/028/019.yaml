  naturalness: Ang ‘na binabautismuhan sila’ ay nauunawaan, ngunit medyo mabigat at maaaring pansamantalang magmukhang panuring ng ‘mga bansa.’ Ang ‘sa pamamagitan ng pagbabautismo sa kanila’ ay mas malinaw na nagpapakitang ang bautismo ay kaugnay na paraan ng paggawa ng mga alagad, nang hindi ginagawang hiwalay na pangunahing utos.
  terminology: Ang ‘Ama,’ ‘Anak,’ ‘Banal na Espiritu,’ at ‘bautismo’ ay angkop, makabago, at marangal na mga katawagan. Pinananatili ang ‘sa pangalan’ sa teksto at inililinaw sa talababa ang εἰς nang hindi ipinapataw ang isang partikular na doktrinang sakramental.
