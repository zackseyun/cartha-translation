  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: tl
  text: At kung makarating sa gobernador ang balitang ito,[a] hihikayatin namin siya, at titiyakin naming wala kayong dapat ipag-alala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung mabalitaan ito ng gobernador.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “gagawin namin kayong malaya sa pag-aalala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ τοῦτο ἐπὶ τοῦ ἡγεμόνος
  choice: makarating sa gobernador ang balitang ito
  rationale: Ipinapahayag nito ang idyomatikong diwa na ang usapin ay makarating sa kaalaman o pansin ng gobernador, habang pinananatili ang pasibong kaisipan ng Griyego.
- source_word: ἡγεμόνος
  choice: gobernador
  rationale: Sa konteksto, tumutukoy ito sa Romanong gobernador ng lalawigan, si Pilato; ang “gobernador” ang tiyak at likas na katawagan.
- source_word: πείσομεν αὐτόν
  choice: hihikayatin namin siya
  rationale: Pinananatili nito ang pangunahing kahulugan ng πείθω na hikayatin o kumbinsihin, nang hindi tahasang tinutukoy kung paano nila siya mapapayag.
- source_word: ἀμερίμνους ποιήσομεν
  choice: titiyakin naming hindi kayo mapapahamak
  rationale: Sa salaysay, ang pagiging “malaya sa pag-aalala” ay tumutukoy sa pag-iwas ng mga bantay sa kaparusahan o masamang bunga. Ang saling ito ay natural sa modernong Tagalog at ipinakikita ang resultative na diwa ng ποιήσομεν.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makarating sa gobernador ang balitang ito” bilang natural na idyoma, at ang “hindi kayo mapapahamak” upang maipahayag ang kontekstuwal na panganib sa mga bantay nang hindi ginagawang labis na teknikal ang pangungusap.
