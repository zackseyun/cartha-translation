    issue: Ang “hindi kayo mapapahamak” ay mas matindi at mas tiyak kaysa sa ἀμερίμνους.
    rationale: Ang Griyego ay “gagawin namin kayong walang pag-aalala/pagkabahala,” hindi tahasang “ililigtas namin kayo sa kapahamakan.” Maaaring kasama sa konteksto ang panganib ng kaparusahan, ngunit hindi ito dapat ilagay bilang pangunahing kahulugan.
  revised_text: At kung makarating sa gobernador ang balitang ito,[a] hihikayatin namin siya, at titiyakin naming wala kayong dapat ipag-alala.[b]
