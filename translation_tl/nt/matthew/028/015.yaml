id: MAT.28.15
reference: Matthew 28:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: tl
  text: Kaya kinuha nila ang salaping pilak at ginawa ang itinagubilin sa kanila. At kumalat sa mga Judio ang ulat na ito[a] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salaysay na ito” o “kuwentong ito.” Ang salitang Griyego na λόγος ay maaaring mangahulugang “salita,” “ulat,” “salaysay,” o “kuwento,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: kinuha
  rationale: Ang aorist participle ay naglalahad ng kilos na nauna sa pangunahing pandiwa. Ang “kinuha” ay tuwirang tumutugma sa kilos kasunod ng pagbibigay ng salapi sa naunang talata; posible rin ang “tinanggap.”
- source_word: τὰ ἀργύρια
  choice: ang salaping pilak
  rationale: Tumutukoy ang ἀργύρια sa pilak na ginagamit bilang salapi. Pinananatili ng “salaping pilak” ang konkretong larawan nang hindi tiyakang nagdaragdag ng “mga barya.”
- source_word: ἐποίησαν
  choice: ginawa
  rationale: Karaniwang kahulugan ng ποιέω rito ang paggawa o pagtupad sa iniutos, at natural itong kaugnay ng kasunod na parirala.
- source_word: ὡς ἐδιδάχθησαν
  choice: ang itinagubilin sa kanila
  rationale: Sa kontekstong tinuruan silang sabihin ang isang tiyak na pahayag, ipinahahayag ng “itinagubilin” ang diwa ng tagubiling natanggap nila nang natural sa Filipino.
- source_word: διεφημίσθη
  choice: kumalat
  rationale: Ang pandiwa ay tumutukoy sa malawak na paglaganap ng isang balita o ulat. Ang “kumalat” ay natural na Filipino at ang patuloy na saklaw nito ay malinaw sa “hanggang sa araw na ito.”
- source_word: ὁ λόγος οὗτος
  choice: ang ulat na ito
  rationale: Malawak ang saklaw ng λόγος at sa konteksto ay tumutukoy sa pahayag na ipinalaganap. Ang “ulat” ay hindi agad nagpapasiya kung ito ay simpleng salaysay, kuwento, o sabi-sabi; inilalagay sa talababa ang mga posibleng kahulugan.
- source_word: παρὰ Ἰουδαίοις
  choice: sa mga Judio
  rationale: Sa παρά na may dative, ang diwa ay pag-iral o pagkalat sa loob ng isang pangkat. Sa pandiwang “kumalat,” natural na Filipino ang “sa mga Judio” at hindi ito nagpapahiwatig ng paghatol sa buong pangkat lampas sa tagpong isinasalaysay.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: hanggang sa araw na ito
  rationale: Ito ang tuwiran at likas na katumbas ng idyomang nagsasaad na nagpatuloy ang ulat hanggang sa panahon ng may-akda.
theological_decisions:
- issue: Paglalarawan sa Ἰουδαίοις sa kontekstong maaaring mabasa nang may damdaming laban sa mga Judio
  choice: sa mga Judio
  alternative: sa gitna ng mga Judio; sa mga taga-Judea
  rationale: Ang teksto ay nagsasaad kung saang pamayanan kumalat ang ulat. Tuwirang salin ang “mga Judio”; hindi angkop dito ang mas makitid na panrehiyong “mga taga-Judea,” at walang idinaragdag na mas malawak na teolohikal o etnikong paghatol.
- issue: Kung dapat bang ipahiwatig ng salin na kasinungalingan ang ὁ λόγος οὗτος
  choice: ang ulat na ito
  alternative: ang kuwentong ito; ang salaysay na ito
  rationale: Bagaman ipinakikita ng konteksto na gawa-gawa ang pahayag ng mga bantay, neutral at malawak ang λόγος. Ang “ulat” ay nagpapanatili sa leksikal na puwang at hinahayaang ang konteksto, hindi isang dagdag na mapanghusgang salita, ang maghayag ng katangian nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio,” na karaniwan at maayos na katawagan sa modernong saling biblikal. Iniwasan ang sobrang literal na ayos ng pangungusap upang maging natural, ngunit pinanatili ang pagkakasunod ng mga kilos at ang leksikal na kalabuan ng λόγος.
