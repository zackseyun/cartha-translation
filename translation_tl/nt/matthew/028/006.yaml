  source_fidelity: Ang “Wala siya rito,” “sapagkat,” “gaya ng sinabi niya,” at ang paanyayang “Halikayo at tingnan ninyo” ay tapat sa Griyego. Ang ἠγέρθη ay pasibo; mas malinaw at mas natural sa ayos ng Filipino ang “binuhay siyang muli” kaysa “muli siyang binuhay,” habang pinananatili ang di-tinukoy na gumagawa. Ang ἔκειτο ay statibo, ‘nakahiga/nakahimlay’; “nakahiga” ang mas tuwiran at pangkaraniwang katumbas sa talatang ito.
  naturalness: Natural at angkop ang magalang ngunit modernong himig ng “Halikayo at tingnan ninyo.” Ang “nakahimlay” ay posible ngunit mas madaling maunawaang ‘inilibing’ o ‘ipinahinga’; ang “nakahiga” ay mas malinaw na tumutukoy sa kalagayan ng katawan sa lugar na ipinakikita.
  terminology: Walang problemang pangalang pantangi o teknikal na terminong teolohikal. Ang “binuhay siyang muli” ay nagpapanatili ng pasibong anyo nang hindi nagdaragdag ng ahensiya o doktrinal na paliwanag sa mismong teksto.
  issues:
