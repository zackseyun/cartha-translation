  - severity: low
    issue: “Nakahimlay” para sa ἔκειτο
    rationale: Katanggap-tanggap ito sa rehistrong panglibing, ngunit mas tuwiran ang “nakahiga” para sa statibong ‘was lying’ at hindi ito nagmumungkahing ang diin ay sa paglilibing o pagpapahinga.
