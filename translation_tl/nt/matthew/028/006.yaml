  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: tl
  text: Wala siya rito, sapagkat binuhay siyang muli[a], gaya ng sinabi niya. Halikayo at tingnan ninyo ang lugar kung saan siya nakahiga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muli siyang nabuhay.” Pasibo ang anyo ng pandiwang Griyego (“binuhay siyang muli”), bagaman madalas itong isalin sa aktibong diwa.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “kung saan siya nakahimlay” o “kung saan siya inilagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Wala siya rito
  rationale: Likas na pahayag ito sa Filipino para sa malinaw na tinutukoy na taong wala sa lugar na iyon; tuwirang tinutumbasan ng “rito” ang ὧδε.
- source_word: ἠγέρθη
  choice: muli siyang binuhay
  rationale: Pinananatili nito ang pasibong anyo ng pandiwang Griyego at malinaw na ipinahahayag sa konteksto ang pagbabangon mula sa kamatayan. Ang “muli” ay likas sa Filipino upang ipakita ang pagbabalik sa buhay.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ng γάρ ang dahilan kung bakit wala siya roon; ang “sapagkat” ay malinaw at marangal na pang-ugnay.
- source_word: καθὼς εἶπεν
  choice: gaya ng sinabi niya
  rationale: Pinananatili nito ang pagtutugma ng pangyayari sa nauna nang sinabi ni Jesus nang hindi dinaragdagan ang teksto.
- source_word: δεῦτε
  choice: Halikayo
  rationale: Isang tuwirang paanyaya o panawagan ang δεῦτε; natural ang maramihang “Halikayo” sa kausap na mga babae.
- source_word: ἴδετε
  choice: tingnan ninyo
  rationale: Ipinahahayag nito ang utos na siyasatin agad ang lugar at mas natural sa modernong Filipino kaysa sa makalumang “masdan ninyo.”
- source_word: τὸν τόπον
  choice: ang lugar
  rationale: Karaniwan at sapat na tiyak ang “lugar” para sa puwesto sa libingan na tinutukoy ng τόπος.
- source_word: ὅπου ἔκειτο
  choice: kung saan siya nakahimlay
  rationale: Pinananatili ng “nakahimlay” ang statibong diwa ng κεῖμαι at ang marangal na tono para sa katawan ng isang namatay, nang hindi tahasang ginagawang pangyayaring pasibo ang pandiwa.
theological_decisions:
- issue: Tinig at ahensiya sa pahayag tungkol sa muling pagkabuhay
  choice: muli siyang binuhay
  alternative: muli siyang nabuhay
  rationale: Pasibo ang anyo ng ἠγέρθη. Pinananatili ng salin ang pagkilos na ginawa sa kaniya nang hindi pinapangalanan ang gumagawa, gaya rin ng Griyego. Hindi nito itinatanggi ang ibang pahayag ng Bagong Tipan tungkol sa ahensiya ni Jesus.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit marangal ang himig. Ginamit ang “nakahimlay” bilang pormal ngunit buhay pa ring salita sa konteksto ng libingan; iniwasan ang makaluma o labis na teknikal na pananalita.
