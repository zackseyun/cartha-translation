  to: At narito,[a] sinalubong sila ni Jesus at sinabi, “Magalak kayo!”[b] Lumapit sila, hinawakan ang kanyang mga paa, at sumamba sa kanya.[c]
  rationale: Pinalitan ang hindi eksaktong “niyakap” ng “hinawakan” upang maipahayag ang pisikal na pagkapit na nasa ἐκράτησαν. Pinalitan din ang “masdan ninyo” ng “narito” para sa mas likas na Tagalog na pagsasalin ng ἰδού. Walang binagong kahulugan sa pagbati o sa pagsamba; ang mga lexical na posibilidad ay nananatiling nasa mga talababa.
