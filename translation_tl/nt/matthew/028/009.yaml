id: MAT.28.9
reference: Matthew 28:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: tl
  text: At narito,[a] sinalubong sila ni Jesus at sinabi, “Magalak kayo!”[b] Lumapit sila, hinawakan ang kanyang mga paa, at sumamba sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “narito” ay panawag-pansin na nagbibigay-buhay sa salaysay; maaari ring isaling “tingnan” o “masdan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Kumusta kayo!” Ang salitang Griyego ay literal na pautos na “magalak kayo,” ngunit ginagamit din bilang pagbati.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “yumukod sa harap niya” o “nagbigay-pugay sa kanya.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpapatirapa, pagbibigay-pugay, o pagsamba; sa kontekstong ito ng muling pagkabuhay, malakas ang diwa ng pagsamba.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Pinananatili nito ang puwersa ng pantawag-pansin at kasiglahan ng salaysay, habang nananatiling malinaw at marangal sa modernong Filipino.
- source_word: ὑπήντησεν
  choice: sinalubong
  rationale: Likas sa konteksto ang diwang nakatagpo sila ni Jesus habang nasa daan; ipinahahayag ng “sinalubong” ang pagkikitang ito nang hindi nagpapabigat sa pangungusap.
- source_word: Χαίρετε
  choice: Magalak kayo!
  rationale: Pinananatili ang literal na anyong pautos at kaugnayan sa χαίρω, bagaman maaari rin itong gumana bilang karaniwang pagbati; ang tunay na ambiguity ay inilalahad sa talababa.
- source_word: προσελθοῦσαι
  choice: Lumapit sila
  rationale: Malinaw na ipinakikita ang paglapit kay Jesus bago ang sumunod na dalawang kilos.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: niyakap ang kanyang mga paa
  rationale: Sa Filipino, natural na paglalarawan ito ng mahigpit na paghawak sa mga paa bilang kilos ng pagpipitagan; hindi nito taglay ang marahas na himig ng “sinunggaban.”
- source_word: προσεκύνησαν αὐτῷ
  choice: sumamba sa kanya
  rationale: Sa konteksto ng muling pagkabuhay at sa presentasyon ni Mateo kay Jesus, malakas ang relihiyosong diwa ng προσκυνέω. Gayunman, binabanggit sa talababa ang mas malawak nitong saklaw na pagyukod o pagbibigay-pugay.
theological_decisions:
- issue: Ang kahulugan ng προσκυνέω na nakatuon sa muling nabuhay na si Jesus
  choice: sumamba sa kanya
  alternative: yumukod sa harap niya / nagbigay-pugay sa kanya
  rationale: Ang konteksto ng muling pagkabuhay ay sumusuporta sa “sumamba,” ngunit hindi ikinukubli na maaari ring tumukoy ang pandiwa sa pisikal na pagpapatirapa o pagbibigay-pugay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “masdan ninyo” bilang bahagyang mataas ngunit pamilyar na pantawag-pansin. Pinanatili sa pangunahing teksto ang literal na “Magalak kayo!” at nilinaw sa talababa ang gamit nito bilang pagbati. Ang “niyakap ang kanyang mga paa” ay natural at kongkretong paglalarawan ng mahigpit na paghawak sa mga paa.
