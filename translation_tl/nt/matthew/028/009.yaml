  naturalness: Mas natural at malinaw ang “At narito, sinalubong sila ni Jesus” at “hinawakan ang kanyang mga paa.” Pinanatili ang marangal ngunit makabagong rehistro. Ang “Magalak kayo!” ay maaaring manatili bilang pangunahing salin ng χαίρετε, habang nililinaw ng talababa na isa rin itong karaniwang pagbati.
  terminology: Ang “sumamba sa kanya” ay lexically defensible sa kontekstong ito, at ang talababa ay angkop na nagpapanatili ng mga posibilidad na “yumukod” o “nagbigay-pugay” nang hindi ipinipilit ang isang doktrinal na pagbasa.
