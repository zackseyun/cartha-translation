  source_fidelity: May dalawang mahalagang paglihis. Ang “Muli siyang binuhay” ay maaaring mangahulugang binuhay siyang muli (na ang “muli” ay nakakabit sa pagkilos ng bumuhay) at hindi ang mas malinaw na balintiwang pahayag na siya ay muling binuhay. Ang huling “Tandaan ninyo” ay utos na alalahanin, samantalang ang ἰδοὺ ay pantawag-pansin o mariing pananda, gaya rin ng unang ἰδοὺ.
  naturalness: Malinaw at modernong Tagalog ang kabuuan. Mas natural at mas tumpak ang “Siya ay muling binuhay” at ang magkatugmang “Tingnan ninyo” para sa dalawang ἰδοὺ. Ang “patungong Galilea” ay nililinaw na ang pag-una ay kaugnay ng paglalakbay tungo roon.
