  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: tl
  text: At magmadali kayong pumunta at sabihin sa kanyang mga alagad, ‘Siya ay muling binuhay mula sa mga patay. Tingnan ninyo, mauuna siya sa inyo patungong Galilea. Doon ninyo siya makikita.’ Tingnan ninyo, sinabi ko na sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: magmadali kayong pumunta
  rationale: Ipinahahayag ang agarang pagkilos na hinihingi ng pang-abay at participle, sa natural na modernong Tagalog.
- source_word: Ἠγέρθη
  choice: Muli siyang binuhay
  rationale: Pinananatili ang anyong balintiyak ng Griyego at ang di-binanggit na tagaganap, sa halip na tahasang sabihing siya ang kusang bumangon.
- source_word: προάγει ὑμᾶς
  choice: mauuna siya sa inyo
  rationale: Likas na Tagalog para sa pagpunta niya bago ang mga alagad, habang pinananatili ang direksiyon patungong Galilea.
- source_word: ἰδοὺ
  choice: Tingnan ninyo / Tandaan ninyo
  rationale: 'Isinalin ayon sa gamit sa bawat sugnay: una bilang pantawag-pansin sa balita, at ikalawa bilang mariing pagtiyak na naipahayag na ang mensahe.'
theological_decisions:
- issue: Ang balintiyak na Ἠγέρθη at ang tagaganap ng muling pagkabuhay
  choice: Muli siyang binuhay mula sa mga patay
  alternative: Bumangon siya mula sa mga patay
  rationale: Ang pinili ay mas malapit sa balintiyak ng tekstong Griyego at hindi tahasang tinutukoy kung sino ang gumawa ng pagkilos.
- issue: Kahulugan ng προάγει
  choice: mauuna siya sa inyo sa Galilea
  alternative: pangungunahan niya kayo patungong Galilea
  rationale: Maaaring magpahiwatig ang pandiwa ng pangunguna o pag-una. Pinili ang pag-una dahil tumutugma ito sa kasunod na pangakong makikita nila siya roon nang hindi inaalis ang posibleng diwa ng pangunguna.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga alagad” bilang karaniwang terminong biblikal, at iniwasan ang lipas na “narito” o “masdan” para sa ἰδοὺ.
