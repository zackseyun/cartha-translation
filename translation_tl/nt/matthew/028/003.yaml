base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: tl
  text: Ang anyo niya[a] ay parang kidlat, at ang kanyang damit ay kasingputi ng niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hitsura” o “panlabas na anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa salaysay; natural sa modernong Tagalog na hindi na ito tahasang banggitin dito.
- source_word: εἰδέα
  choice: anyo
  rationale: Tumutukoy ito sa nakikitang panlabas na hitsura o anyo. Maikli, natural, at marangal ang “anyo” sa kontekstong ito.
- source_word: ὡς ἀστραπή
  choice: parang kidlat
  rationale: Pinananatili nito ang paghahambing at natural itong pakinggan sa modernong Tagalog.
- source_word: ἔνδυμα
  choice: damit
  rationale: Pangkalahatang salita ito para sa kasuotan; hindi nito tinutukoy ang isang partikular na uri ng damit.
- source_word: λευκόν
  choice: puti
  rationale: Tuwirang ipinapahayag ang kaputian nang hindi nagdaragdag ng tinding hindi tahasang nasa Griyego.
- source_word: ὡς χιών
  choice: gaya ng niyebe
  rationale: Pinananatili ang ikalawang paghahambing, na tumutukoy sa kaputian ng damit.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ
  choice: Pinanatili ang panghalip na “niya/kanyang,” na sa agarang konteksto ay tumutukoy sa anghel.
  alternative: Tahasan itong gawing “anghel” upang maiwasang mapagkamalang si Jesus ang tinutukoy.
  rationale: Ang pinakamalapit na tinutukoy sa talata 2 ay ang anghel ng Panginoon. Gayunman, panghalip ang ginamit ng Griyego, kaya pinanatili ito nang hindi nagdaragdag ng pangngalang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “anyo” at “damit” bilang natural na pangkalahatang mga salita, at pinanatili ang dalawang paghahambing nang walang dagdag na pagpapaliwanag.
