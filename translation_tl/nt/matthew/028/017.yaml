id: MAT.28.17
reference: Matthew 28:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: tl
  text: Nang makita nila siya, sumamba sila sa kanya, ngunit nag-alinlangan ang ilan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nag-atubili” o “nag-urong-sulong.” Maaaring tumukoy ang salitang Griyego sa kawalang-katiyakan, hindi sa matatag na kawalan ng paniniwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita
  rationale: Isinalin ang aorist participle bilang sugnay na panahunan upang maging natural sa Tagalog at mapanatili ang kaugnayan nito sa mga pangunahing pandiwa.
- source_word: προσεκύνησαν
  choice: sumamba sila sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagpapatirapa, pagbibigay-galang, o pagsamba. Sa konteksto ng pagpapakita ng muling nabuhay na Jesus, ang “sumamba” ang likas at angkop na salin nang hindi inaalis ang bigat ng kilos.
- source_word: οἱ δὲ
  choice: ngunit ... ang ilan
  rationale: Ang pariralang Griyego ay pasalungat at tumutukoy sa isang bahagi ng nabanggit na pangkat; malinaw at natural itong ipinahahayag sa Tagalog sa pamamagitan ng “ngunit ... ang ilan.”
- source_word: ἐδίστασαν
  choice: nag-alinlangan
  rationale: Saklaw ng διστάζω ang pag-aalinlangan, pag-aatubili, o pag-urong-sulong. Pinananatili ng “nag-alinlangan” ang pangunahing diwa, habang inilalahad sa talababa ang maaaring pahiwatig na hindi ito matatag na kawalan ng paniniwala.
theological_decisions:
- issue: Lakas ng προσκυνέω na nakatuon sa muling nabuhay na Jesus
  choice: sumamba sila sa kanya
  alternative: nagpatirapa sila sa harap niya / nagbigay-galang sila sa kanya
  rationale: Sa konteksto ng salaysay ni Mateo pagkatapos ng muling pagkabuhay, ang “sumamba” ay leksikal na makatwiran at pinananatili ang teolohikal na bigat ng kilos nang hindi nagdaragdag ng higit sa ipinahihiwatig ng Griyego.
- issue: Pahiwatig ng διστάζω
  choice: nag-alinlangan
  alternative: nag-atubili / nag-urong-sulong
  rationale: Maaaring ipahiwatig ng salita ang pansamantalang pag-aatubili o pag-urong-sulong sa halip na ganap at matatag na kawalan ng paniniwala. Pinananatili sa pangunahing teksto ang tensiyon, at inilalagay sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kanya” bilang karaniwang anyo sa modernong Tagalog at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
