id: MAT.28.10
reference: Matthew 28:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanila ni Jesus, “Huwag kayong matakot. Humayo kayo at sabihin sa aking mga kapatid[a] na pumunta sila sa Galilea; doon nila ako makikita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “aking mga kapatid” ay tumutukoy sa mga alagad ni Jesus. Panlalaking pangmaramihan ang salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay; malinaw na ipinagpapatuloy nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: λέγει αὐταῖς ὁ Ἰησοῦς
  choice: sinabi sa kanila ni Jesus
  rationale: Isinalin ang historikal na pangkasalukuyan bilang pangnagdaan, gaya ng likas sa makabagong salaysay sa Filipino. Ang “kanila” ay hindi labis na nililinaw bilang “mga babae,” sapagkat malinaw ang tinutukoy sa konteksto.
- source_word: Μὴ φοβεῖσθε
  choice: Huwag kayong matakot
  rationale: Natural at tuwirang modernong Filipino para sa pangmaramihang pagbabawal.
- source_word: ὑπάγετε
  choice: Humayo kayo
  rationale: Pinananatili ang hiwalay na utos na umalis o magpatuloy, habang ang “kayo” ay malinaw na nagsasaad ng maramihan.
- source_word: ἀπαγγείλατε
  choice: sabihin
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “sabihin” ang paghahatid ng ipinagbilin na mensahe nang hindi nagiging labis na pormal.
- source_word: τοῖς ἀδελφοῖς μου
  choice: sa aking mga kapatid
  rationale: Ang “mga kapatid” ang karaniwang salin sa Filipino ng panlalaking pangmaramihang ἀδελφοί kapag gamit na pampamilya o pangkomunidad; hindi ito pinalitan ng interpretatibong “mga alagad.” Nililinaw sa talababa ang kontekstuwal na tinutukoy.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: na pumunta sila sa Galilea
  rationale: Likas na Filipino para sa nilalaman ng di-tuwirang utos; iniiwasan ang mabigat na “upang sila ay magsiparoon.”
- source_word: κἀκεῖ με ὄψονται
  choice: doon nila ako makikita
  rationale: Tuwirang pinananatili ang kahulugan ng pagkakita kay Jesus; hindi ito pinaliit sa mas interpretatibong “makikipagkita.”
theological_decisions:
- issue: Tinutukoy ng “aking mga kapatid”
  choice: Pinanatili sa pangunahing teksto ang pampamilyang katawagang “aking mga kapatid,” na sa agarang konteksto ay tumutukoy sa mga alagad ni Jesus.
  alternative: Isalin nang tuwiran bilang “aking mga alagad.”
  rationale: Ang “mga alagad” ay naglilinaw ng tinutukoy ngunit nawawala ang teolohikal at relasyonal na bigat ng ἀδελφοί. Pinananatili ng pangunahing teksto ang mismong katawagan, at inilalagay ang kontekstuwal na paliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Humayo kayo” upang mapanatili ang hiwalay na utos na ὑπάγετε, ngunit nananatiling madaling maunawaan; iniwasan ang arkaikong “magsiparoon.”
