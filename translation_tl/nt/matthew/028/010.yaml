  source_fidelity: 'Tapat ang salin sa lahat ng pangunahing yunit ng Griyego: ang τότε ay wastong panandang pagsunod sa salaysay; ang historikal na pangkasalukuyang λέγει ay likas na ginawang pangnagdaan; at napapanatili ang mga utos na “Huwag kayong matakot,” “Humayo kayo,” at “sabihin.” Wasto ring naipapahayag ang di-tuwirang utos na pumunta ang mga kapatid sa Galilea at ang pangakong makikita nila si Jesus doon.'
