base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: tl
  text: Pagkaraan ng Sabbath[a], nang magbubukang-liwayway na sa unang araw ng linggo, pumunta si Maria Magdalena at ang isa pang Maria upang tingnan ang libingan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa huling bahagi ng Sabbath, nang magbubukang-liwayway na sa unang araw ng linggo.” Maaaring unawain ang pambungad na pariralang Griego bilang “pagkaraan ng Sabbath” o “sa huling bahagi ng Sabbath.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Pagkaraan ng Sabbath
  rationale: Maaaring tumukoy ang ὀψέ na may genitive sa panahong kasunod ng isang pangyayari. Sa konteksto ng muling pagkabuhay, natural itong unawain bilang matapos ang Sabbath. Bagaman anyong maramihan ang σαββάτων, karaniwan itong idyomatikong tumutukoy sa iisang Sabbath. Hindi hiwalay na isinalin ang mahinang pang-ugnay na δέ upang maging natural ang daloy sa Tagalog.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: nang nagbubukang-liwayway na
  rationale: Ang ἐπιφώσκω ay tumutukoy dito sa pagsisimula ng liwanag ng umaga. Ang “nagbubukang-liwayway” ay natural at marangal na Tagalog para sa pagdating ng bukang-liwayway.
- source_word: εἰς μίαν σαββάτων
  choice: patungo sa unang araw ng linggo
  rationale: Ang μίαν σαββάτων ay Semitikong idyoma para sa unang araw ng linggo, at pinananatili ng “patungo” ang direksiyong temporal ng εἰς kaugnay ng pagbubukang-liwayway.
- source_word: ἦλθεν
  choice: pumunta
  rationale: Sa salaysay, ang aorist ng ἔρχομαι ay maaaring natural na isaling “pumunta” sa Tagalog dahil inilalarawan ang paglapit ng mga babae sa libingan nang hindi ipinapalagay ang pananaw ng nagsasalita.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Tagalog.
- source_word: ἡ ἄλλη Μαρία
  choice: ang isa pang Maria
  rationale: Tumpak at natural na ipinahahayag nito ang ἄλλη habang pinananatili ang pagkakaiba ng dalawang Maria sa salaysay.
- source_word: θεωρῆσαι
  choice: upang tingnan
  rationale: Ipinahahayag ng θεωρέω ang sinasadyang pagtingin o pagmamasid. Hindi nito labis na pinatitingkad ang kilos bilang isang pormal na pagsisiyasat.
- source_word: τὸν τάφον
  choice: ang libingan
  rationale: Ang τάφος ay tumutukoy sa pinaglibingan kay Jesus. Ang “libingan” ang malinaw at karaniwang katumbas sa modernong Tagalog.
theological_decisions:
- issue: Pamanahong pahayag sa simula ng salaysay tungkol sa muling pagkabuhay
  choice: Inilagay ang pangyayari pagkaraan ng Sabbath, sa pagbubukang-liwayway patungo sa unang araw ng linggo.
  alternative: Maaaring unawain ang pambungad na parirala bilang “Sa pagtatapos ng Sabbath” o “Nang gabing-gabi na ng Sabbath.”
  rationale: Pinagtatalunan ang kahulugan ng ὀψὲ σαββάτων. Ang pagsasaling “Pagkaraan ng Sabbath” ay ang mas malamang sa pinagsamang mga pamanahong pahiwatig ng talata, ngunit pinananatili sa talababa ang tunay na posibilidad ng alternatibong pagbasa nang hindi sapilitang pinagkakasundo ang ibang salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Pinili ang “Sabbath” bilang pamilyar na terminong biblikal, “nagbubukang-liwayway” para sa tiyak na larawang temporal, at “libingan” bilang karaniwang katawagan. Pinanatili ang bahagyang di-pangkaraniwang “patungo sa unang araw” upang katawanin ang εἰς at ang pamanahong pag-usad ng Griyego.
