id: MAT.28.4
reference: Matthew 28:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: tl
  text: Dahil sa takot nila sa kanya, nanginig ang mga bantay at naging parang mga patay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nanginig” ay maaari ring isaling “nayanig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: Dahil sa
  rationale: Sa pariralang ἀπὸ τοῦ φόβου, ipinahihiwatig ng ἀπό ang sanhi ng reaksiyon ng mga bantay. Likas at malinaw sa makabagong Tagalog ang “Dahil sa.”
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Ang δέ ay banayad na pang-ugnay sa daloy ng salaysay. Hindi kailangan ang tahasang katumbas dito sapagkat maayos at likas ang pagpapatuloy ng pangungusap sa Tagalog kahit wala ito.
- source_word: φόβου αὐτοῦ
  choice: takot nila sa kanya
  rationale: Tumutukoy ang αὐτοῦ sa anghel na inilarawan sa naunang talata. Idinagdag ang likas na Tagalog na “nila” upang malinaw na ang takot ay nararanasan ng mga bantay, samantalang ang “sa kanya” ang layon nito.
- source_word: ἐσείσθησαν
  choice: nanginig
  rationale: Ang pasibong anyo ng σείω ay maaaring literal na “nayanig,” ngunit sa reaksiyon ng tao dahil sa takot, natural at tumpak ang “nanginig.” Pinananatili sa talababa ang mas literal na alternatibo.
- source_word: οἱ τηροῦντες
  choice: ang mga bantay
  rationale: Literal itong “ang mga nagbabantay.” Sa konteksto ng pagbabantay sa libingan, malinaw at maikli ang “mga bantay.”
- source_word: ἐγενήθησαν
  choice: naging
  rationale: Ipinahihiwatig ng γίνομαι ang pagbabago ng kalagayan, na wastong naipapahayag ng “naging.”
- source_word: ὡς νεκροί
  choice: parang mga patay
  rationale: Ang ὡς ay naghahayag ng paghahambing, hindi ng aktuwal na pagkamatay. Pinananatili ng “parang” ang gayong paghahambing nang hindi dinaragdagan ang teksto.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ (“kanya”)
  choice: Ang anghel o mensaherong inilarawan sa naunang talata
  alternative: Ang makalangit na pangyayari sa kabuuan
  rationale: Ang pinakamalapit at pinakanatural na tinutukoy ng panghalip ay ang anghel na ang anyo ay inilarawan sa Mateo 28:3. Hindi kinakailangang ipaliwanag ito sa mismong talata, kaya pinanatili ang panghalip.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Dahil sa takot nila sa kanya” upang natural na maipahayag ang ugnayang sanhi sa Griyego, at “parang mga patay” upang mapanatili ang paghahambing nang hindi ipinapalagay na tunay silang namatay.
