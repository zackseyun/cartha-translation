  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: tl
  text: na tinuturuan silang tuparin ang lahat ng iniutos ko sa inyo. At narito, Ako ay kasama ninyo araw-araw hanggang sa katapusan ng kapanahunan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang sa pagtatapos ng kapanahunan.” Tradisyonal na isinasalin itong “hanggang sa wakas ng mundo.” Ang Griyego ay tumutukoy sa katapusan ng isang kapanahunan (αἰών), hindi partikular sa pisikal na daigdig.
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: na tinuturuan
  rationale: Ipinagpapatuloy ng kasalukuyang pandiwaring Griyego ang paraan ng paggawa ng mga alagad mula sa naunang talata. Likas sa Filipino ang pang-ugnay na “na” sa pagpapatuloy ng pangungusap.
- source_word: τηρεῖν
  choice: tuparin
  rationale: Saklaw nito ang maingat na pagsunod at pagsasagawa sa mga utos; mas natural ito sa Filipino kaysa sa literal na “ingatan” sa kontekstong ito.
- source_word: πάντα ὅσα
  choice: ang lahat ng
  rationale: Pinananatili nito ang ganap at komprehensibong saklaw ng parirala nang hindi mabigat pakinggan.
- source_word: ἐνετειλάμην
  choice: iniutos ko
  rationale: Tumpak na ipinapahayag ang awtoritatibong lakas ng ἐντέλλομαι.
- source_word: ἰδοὺ
  choice: narito
  rationale: Isang marangal at madaling maunawaang panandang pantawag-pansin na nagpapanatili sa diin ng Griyego.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: kasama ninyo ako
  rationale: Direkta at natural na ipinapahayag ang patuloy na presensiya ni Jesus sa mga kausap niya.
- source_word: πάσας τὰς ἡμέρας
  choice: sa bawat araw
  rationale: Pinananatili ang tahasang araw-sa-araw na diwa ng literal na “lahat ng mga araw,” ngunit mas natural sa modernong Filipino.
- source_word: συντελείας
  choice: pagtatapos
  rationale: Ipinahihiwatig ang pagdating ng isang kapanahunan sa ganap nitong wakas, hindi lamang biglaang paghinto.
- source_word: αἰῶνος
  choice: kapanahunan
  rationale: Ang αἰών ay panahon o yugto, hindi partikular na pisikal na daigdig; malinaw at tumpak dito ang “kapanahunan.”
theological_decisions:
- issue: Ang pariralang temporal na ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: hanggang sa pagtatapos ng kapanahunan
  alternative: hanggang sa wakas ng mundo
  rationale: Pinananatili ng salin ang eskatolohikal na diwa ng pagdating ng kapanahunan sa kaganapan nito, nang hindi ipinapalagay na ang tinutukoy ay pagkawasak ng pisikal na daigdig.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “narito” upang mapanatili ang taimtim na diin, at “sa bawat araw” upang natural na maipahayag ang literal na araw-sa-araw na saklaw.
