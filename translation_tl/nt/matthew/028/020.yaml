  terminology: Ang “tuparin” para sa τηρεῖν at “iniutos” para sa ἐνετειλάμην ay angkop sa marangal na rehistro. Ang “narito” ay ligtas na panandang nagbibigay-diin para sa ἰδού. Pinananatili ang “kapanahunan” bilang pangunahing salin ng αἰών.
