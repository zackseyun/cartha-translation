  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: tl
  text: Pumunta ang labing-isang alagad sa Galilea, sa bundok na itinakda ni Jesus para sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinalaga ni Jesus para sa kanila” o “iniutos ni Jesus sa kanila.” Ang pandiwang Griyego ay maaaring mangahulugang magtakda, magtalaga, o mag-utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (hindi tahasang isinalin)
  rationale: Mahinang pang-ugnay ito na nagpapalipat sa susunod na pangyayari. Likas sa modernong Tagalog na simulan nang tuwiran ang pangungusap kaysa dagdagan ng “Ngayon” o “Ngunit,” na maaaring magpahiwatig ng panahon o pagsalungat na hindi tahasan sa Griyego.
- source_word: ἕνδεκα μαθηταὶ
  choice: ang labing-isang alagad
  rationale: Pinananatili ng “labing-isa” ang tiyak na bilang ng pangkat matapos mawala si Judas, at ang “alagad” ang karaniwan at angkop na katawagan sa μαθητής sa salaysay ng mga Ebanghelyo.
- source_word: ἐπορεύθησαν
  choice: Pumunta
  rationale: Payak at likas na katumbas ng pandiwang nagsasaad ng pagpunta; hindi kailangan ang mas mataas na estilong “naglakbay.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Sa Tagalog, ang “pumunta sa” ay likas na nagpapahayag ng kilos patungo sa isang pook o rehiyon.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Pinananatili ng “bundok” ang karaniwang kahulugan ng ὄρος at ang pagiging tiyak ng lugar sa pamamagitan ng kasunod na sugnay.
- source_word: οὗ
  choice: na … puntahan nila
  rationale: Isinaayos ang panlaping pook na “kung saan” bilang isang likas na sugnay na Tagalog na naglalarawan sa bundok.
- source_word: ἐτάξατο αὐτοῖς
  choice: itinakda ni Jesus na puntahan nila
  rationale: Ipinahahayag nito na dati nang itinalaga o itinuro ni Jesus ang lugar ng pagkikita, nang hindi ginagawang mas pormal o mas mariin kaysa sa saklaw ng τάσσω.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalang Ἰησοῦς sa modernong Tagalog.
theological_decisions:
- issue: Antas ng awtoridad na ipinahihiwatig ng ἐτάξατο
  choice: itinakda ni Jesus na puntahan nila
  alternative: iniutos ni Jesus na puntahan nila
  rationale: Maaaring mangahulugan ang pandiwa ng pagtatakda, pagtatalaga, o pag-uutos. Ang “itinakda” ay nagpapanatili sa pangunahing diwa na dati nang tinukoy ni Jesus ang lugar, nang hindi ipinapasok ang mas mariing diin ng isang tahasang utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “alagad” bilang nakasanayang terminong biblikal, ngunit iniwasan ang lipas o labis na pormal na ayos. Inilagay ang talababa sa pariralang may tunay na leksikal na kalabuan.
