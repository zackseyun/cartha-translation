id: MAT.28.2
reference: Matthew 28:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: tl
  text: At masdan, nagkaroon ng malakas na lindol, sapagkat bumaba mula sa langit ang isang anghel ng Panginoon, lumapit, iginulong palayo ang bato, at umupo sa ibabaw nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang panghikayat na bigyang-pansin ang bigla at mahalagang pangyayari, sa isang marangal ngunit nauunawaang anyo.
- source_word: σεισμὸς ... μέγας
  choice: malakas na lindol
  rationale: Likas na modernong Tagalog para sa isang lindol na matindi o malaki ang lakas.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Tuwirang pinananatili ang di-tiyak na ἄγγελος at ang karaniwang biblikal na katawagang κύριος.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: bumaba mula sa langit
  rationale: Malinaw na inilalahad ang pinagmulan at kilos ng participle nang hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: προσελθὼν
  choice: lumapit
  rationale: Tumpak at natural na salin ng paglapit; hindi nililinaw nang higit sa Griyego kung sa bato o sa libingan siya lumapit.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: iginulong palayo ang bato
  rationale: Pinananatili ang tiyak na kilos na paggulong at ang diwang pag-aalis palayo.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: umupo sa ibabaw nito
  rationale: Ang panghalip ay likas na tumutukoy sa pinakamalapit na pangngalang 'bato'; hindi dinaragdagan ang detalye.
theological_decisions:
- issue: Kaugnayan ng lindol at pagbaba ng anghel
  choice: Pinanatili ang 'sapagkat' upang ipakita ang paliwanag na ugnayan ng γάρ.
  alternative: Pagdugtungin lamang bilang magkakasunod na pangyayari nang walang sanhi o paliwanag.
  rationale: Tahasan sa Griyego ang γάρ, kaya dapat manatili ang paliwanag na ang lindol ay kaugnay ng pagbaba at pagkilos ng anghel.
- issue: Panahunan at pagkakasunod ng mga kilos ng anghel
  choice: 'Isinalin bilang magkakasunod na kilos: bumaba, lumapit, iginulong, at umupo.'
  alternative: Gumamit ng pluperfect gaya ng 'nakababa na' o 'bumaba na noon.'
  rationale: Ang aorist participles at finite verbs ay naglalahad ng salaysay nang hindi kinakailangang ipasok ang mas tiyak na pluperfect na interpretasyon ng Ingles.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'masdan' upang mapanatili ang pansin-tawag ng ἰδοὺ; iniwasan ang mas lipas na 'narito' dahil hindi isang bagay o taong itinuturo ang pangunahing gamit nito rito. Walang kinakailangang talababa.
