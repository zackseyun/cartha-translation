base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: tl
  text: Habang sila’y naglalakbay[a], narito[b], dumating sa lungsod ang ilan sa mga bantay at iniulat sa mga punong pari ang lahat ng nangyari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Habang sila ay nagpapatuloy sa kanilang paglalakbay.” Ang anyong Griyego ay nagtatakda ng panahon ng sumunod na pangyayari nang hindi sinasabi ang kanilang patutunguhan.
    reason: lexical_alternative
  - marker: b
    text: Ang “narito” ay salin ng Griyegong panandang pantawag-pansin na ἰδού, na nagpapahiwatig ng bigla o kapansin-pansing pangyayari sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Habang naglalakad sila
  rationale: Isinasalin ang genitive absolute bilang likurang pangyayaring kasabay ng sumunod na kaganapan; hindi tinutukoy ang destinasyong wala sa Griyego.
- source_word: ἰδού
  choice: narito
  rationale: Pinananatili ang pantawag-pansing panandang nagsasaad ng bigla o kapansin-pansing pagbabago sa salaysay.
- source_word: τινες τῆς κουστωδίας
  choice: ang ilan sa mga bantay
  rationale: Natural sa makabagong Tagalog at malinaw na bahagi lamang ng pangkat ng mga bantay ang tinutukoy.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: pumunta sa lungsod
  rationale: Natural na inilalahad ang naunang kilos ng aorist participle; ang neutral na 'pumunta' ay hindi nag-aangkat ng hindi tiyak na pananaw-deiktiko.
- source_word: ἀπήγγειλαν
  choice: iniulat
  rationale: Ipinapakita ang pormal na paghahatid ng balita o salaysay sa mga pinuno.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: sa mga punong pari
  rationale: Karaniwang salin sa konteksto ng pamunuang Judio noong panahon ng Ikalawang Templo.
- source_word: ἅπαντα τὰ γενόμενα
  choice: ang lahat ng nangyari
  rationale: Pinananatili ang masaklaw na diwa ng ἅπαντα at natural na ipinahahayag ang mga naganap na pangyayari.
