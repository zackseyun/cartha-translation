id: MAT.28.5
reference: Matthew 28:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: tl
  text: Ngunit sumagot ang anghel at sinabi sa mga babae, “Huwag kayong matakot[a], sapagkat alam kong hinahanap ninyo si Jesus na ipinako sa krus[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tahasang nakasaad sa Griyego ang panghalip na “kayo” bilang pagbibigay-diin: ang katiyakan ay partikular na para sa mga babae.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “si Jesus, ang ipinako sa krus” o “si Jesus na napako sa krus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: Ngunit sumagot ang anghel at sinabi
  rationale: Pinananatili ang karaniwang pormulang pasalaysay na ‘sumagot ... at sinabi,’ habang ipinahahayag ng ‘ngunit’ ang banayad na paglipat o pagsalungat ng δέ.
- source_word: ταῖς γυναιξίν
  choice: sa mga babae
  rationale: Tuwirang tumutukoy sa mga babaeng kausap ng anghel.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Huwag kayong matakot
  rationale: Ito ang natural na modernong Tagalog para sa pagbabawal at pagtiyak. Likas nang lantad sa ‘kayo’ ng ‘kayong’ ang panghalip, ngunit ipinaliliwanag sa talababa ang natatanging diin ng hiwalay na ὑμεῖς.
- source_word: οἶδα γὰρ ὅτι
  choice: sapagkat alam kong
  rationale: Ipinakikita ng ‘sapagkat’ ang pagbibigay-katwiran ng γάρ, at natural na ikinakabit ng ‘alam kong’ ang nilalaman ng ὅτι.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: τὸν ἐσταυρωμένον
  choice: na ipinako sa krus
  rationale: Natural at malinaw na salin ng perpektong pasibong participle; tinutukoy nito si Jesus bilang siyang napako sa krus, nang hindi nagdaragdag ng interpretasyong teolohikal.
- source_word: ζητεῖτε
  choice: hinahanap ninyo
  rationale: Ang aspektong di-ganap ng ‘hinahanap’ ay angkop sa nagpapatuloy na paghahanap sa tagpo at mas natural kaysa sa mas pormal na ‘pinaghahanap.’
theological_decisions:
- issue: Diin ng tahasang panghalip na ὑμεῖς
  choice: Natural na ‘Huwag kayong matakot’ sa pangunahing teksto, na may talababa tungkol sa diin
  alternative: ‘Kayo, huwag kayong matakot’
  rationale: May natatanging diin ang ὑμεῖς at partikular sa mga babae ang katiyakan, ngunit magiging mabigat at maaaring magmukhang labis na pagsalungat ang dobleng ‘kayo’ sa Tagalog. Pinananatili ng talababa ang tunay na pahiwatig nang hindi ito nilulubos ang interpretasyon.
- issue: Aspekto at paglalarawan sa τὸν ἐσταυρωμένον
  choice: ‘si Jesus na ipinako sa krus’
  alternative: ‘si Jesus, ang ipinako sa krus’ / ‘si Jesus na napako sa krus’
  rationale: Pinananatili ang pasibong pagkilos at malinaw na pagkakakilanlan sa ipinakong si Jesus. Hindi dinaragdagan ng salin ang teolohikal na kahulugan ng perpektong aspekto, ngunit binabanggit sa talababa ang mas lantad na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang ‘ngunit’ at ‘sapagkat’ upang mapanatili ang malinaw na ugnayang pasalaysay at pangangatwiran, samantalang iniwasan ang artipisyal na pag-uulit ng emphatic pronoun.
