  text: na nagsabi, “Sabihin ninyo, ‘Dumating sa gabi ang kanyang mga alagad at ninakaw nila siya[b] habang natutulog kami.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sa Griyego, “siya,” hindi “ang kanyang katawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Ang kasalukuyang participle ay nagpapakilala sa nilalaman ng tagubilin; natural itong iniuugnay sa naunang sugnay sa pamamagitan ng “na nagsasabi.”
- source_word: Εἴπατε
  choice: Sabihin ninyo
  rationale: Pinananatili ang tuwirang pautos at ang pangmaramihang ikalawang panauhan.
- source_word: ὅτι
  choice: ipinahiwatig sa pamamagitan ng tuwirang sipi
  rationale: Bilang pananda ng nilalaman, likas itong naipapahayag sa Filipino sa pamamagitan ng bantas at tuwirang sipi nang hindi nagdaragdag ng “na.”
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Natural na anyong paari sa modernong Filipino at malinaw ang pagtukoy kay Jesus mula sa konteksto.
- source_word: νυκτὸς
  choice: sa gabi
  rationale: Ang genitibong ginagamit na pang-abay ay nagsasaad ng panahon ng kanilang pagdating; “sa gabi” ang pinakanatural at tumpak na katumbas.
- source_word: ἐλθόντες
  choice: Dumating
  rationale: Ang aorist participle na nauuna sa pangunahing kilos ay natural na ginagawang pandiwang may hangganang anyo sa Filipino.
- source_word: ἔκλεψαν
  choice: ninakaw
  rationale: Tuwirang katumbas ng pandiwang nagsasaad ng pagnanakaw.
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ang personal na panghalip ng Griyego at hindi ito pinalalawak bilang “ang kanyang katawan.”
- source_word: ἡμῶν κοιμωμένων
  choice: habang natutulog kami
  rationale: Malinaw at natural na salin ng genitive absolute na nagsasaad ng kasabay na kalagayan.
theological_decisions:
- issue: Tinutukoy ng αὐτόν sa gawa-gawang ulat
  choice: Panatilihin ang personal na panghalip na “siya.”
  alternative: “ang kanyang katawan”
  rationale: Personal na panghalip ang nasa Griyego. Ang “katawan” ay paliwanag na wala sa teksto at hindi kailangan upang maunawaan ang tinutukoy.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang tuwirang pautos at ang personal na panghalip nang walang interpretibong pagpapalawak. Walang talababa dahil sapat na malinaw sa Filipino ang mga leksikal na pagpili.
