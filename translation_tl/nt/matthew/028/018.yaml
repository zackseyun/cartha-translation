source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: tl
  text: 'Lumapit si Jesus at nagsalita sa kanila: “Ibinigay na sa akin[a] ang lahat ng awtoridad[b] sa langit at sa lupa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ibinigay sa akin.” Ang aorist na balintiyak sa Griyego ay maaari ring isaling ganito; ginagamit sa pangunahing teksto ang “ibinigay na” upang ipahiwatig ang naganap nang pagkakaloob na may bisa pa rin sa kasalukuyan.
    reason: lexical_alternative
  - marker: b
    text: O “kapangyarihan.” Ang salitang Griyego na ἐξουσία ay mas tiyak na tumutukoy sa awtoridad, karapatan, o lehitimong pamamahala kaysa sa lakas lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Lumapit
  rationale: Ipinahahayag ng aorist participle ng προσέρχομαι ang paglapit ni Jesus sa mga alagad bago siya magsalita. Likas at malinaw sa makabagong Tagalog ang “lumapit.”
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: nagsalita sa kanila
  rationale: Ang ἐλάλησεν ay “nagsalita,” at ang λέγων ay nagsisilbing pananda sa kasunod na tuwirang pahayag. Sa natural na Tagalog, sapat na ang kuwit at panipi upang katawanin ang tungkulin ng λέγων nang hindi gumagamit ng matigas na “na sinasabi.”
- source_word: Ἐδόθη μοι
  choice: Ibinigay na sa akin
  rationale: Pinananatili ang balintiyak na anyo at si Jesus bilang tumanggap. Ang “na” ay naghahayag ng natapos na pagkakaloob na may bisa sa kasalukuyang tagpo.
- source_word: πᾶσα ἐξουσία
  choice: ang lahat ng awtoridad
  rationale: 'Sa isahang abstraktong pangngalan, ang πᾶσα ay kabuuan: “lahat.” Ang ἐξουσία ay tumutukoy sa lehitimong kapamahalaan o karapatang mamahala, hindi lamang sa lakas o kakayahan.'
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: sa langit at sa lupa
  rationale: Ito ang natural at karaniwang pares sa Tagalog para sa dalawang saklaw ng buong nilalang.
theological_decisions:
- issue: Ang paraan ng pagtataglay ni Jesus ng pansansinukob na awtoridad
  choice: Ibinigay na sa akin ang lahat ng awtoridad
  alternative: Nasa akin ang lahat ng awtoridad
  rationale: Pinananatili ng salin ang balintiyak na Ἐδόθη at hindi ito ginagawang payak na pahayag lamang ng pag-aari. Sa gayon, nananatili ang pahayag ng teksto na ipinagkaloob ang awtoridad sa muling nabuhay na Jesus, nang hindi tinutukoy sa salin kung sino ang tahasang gumawa ng pagkakaloob.
- issue: Kahulugan ng ἐξουσία
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Ang “awtoridad” ay higit na tiyak sa lehitimong karapatan at pamamahala; ang “kapangyarihan” ay maaari ring maunawaan bilang lakas o kakayahan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang di-likas na literal na “na sinasabi” bago ang tuwirang pahayag, ngunit pinanatili ang pagkilos ng paglapit at pagsasalita. Ginamit ang “awtoridad” bilang karaniwang hiram na salitang mas eksakto kaysa “kapangyarihan” sa kontekstong ito.
