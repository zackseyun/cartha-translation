    rationale: Bagaman ang mga πρεσβύτεροι ay may tungkuling pamunuan sa konteksto, hindi tahasang idinagdag ng Griyego ang salitang “pinuno.” Ang “mga nakatatanda” ay mas tapat at nananatiling malinaw sa rehistrong biblikal.
  - severity: low
    issue: Hindi tumpak ang talababa na “maraming salaping pilak.”
    rationale: Ang ἱκανὰ ay nagsasaad ng malaking/malaki-laking halaga sa kontekstong ito, hindi lamang ng maraming piraso o dami. Dapat ipakita ng alternatibo ang halaga o kasapatan ng kabuuan.
