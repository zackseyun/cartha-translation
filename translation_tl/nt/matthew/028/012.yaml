  source_fidelity: Tumpak na naihahatid ng draft ang pagkakasunod ng mga kilos, ang pakikipagtipon sa mga πρεσβύτεροι, ang pagsasanggunian, at ang pagbibigay ng malaking halaga ng pilak sa mga kawal. Gayunman, ang “matatandang pinuno” ay nagdaragdag ng paglalarawang wala sa Griyego at maaaring magpahiwatig na ang pagiging pinuno ay hiwalay na pagpapakahulugan sa katawagang πρεσβύτεροι.
  naturalness: Malinaw at natural ang pangungusap, ngunit mas maayos at mas karaniwan sa makabagong Filipino sa kontekstong ito ang “mga nakatatanda” kaysa “matatandang pinuno.”
  terminology: Ang “mga nakatatanda” ay isang angkop na katumbas ng πρεσβύτεροι bilang kinikilalang pangkat ng matatanda/elder sa pamayanang Judio, nang hindi nagdaragdag ng titulo. Ang “mga kawal” at “salaping pilak” ay angkop. Inaayos din ang talababa upang hindi gawing “marami” ang ἱκανά, na tumutukoy sa malaking o malaki-laking halaga kaysa simpleng dami.
  issues:
