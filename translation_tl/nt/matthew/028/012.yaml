  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: tl
  text: Nagtipon sila kasama ng mga nakatatanda at, matapos magsanggunian, nagbigay sila sa mga kawal ng malaking halaga ng salaping pilak[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaki-laking halaga ng pilak.” Literal na tumutukoy ang Griyego sa “malaki-laking pilak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: Nagtipon sila
  rationale: Ang aorist participle ay tumutukoy sa pagtipon nila bago ang pangunahing kilos. Natural sa modernong Tagalog ang tahasang sugnay na “Nagtipon sila.”
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: kasama ng matatandang pinuno
  rationale: Ipinahihiwatig ng μετά na kasama nila ang mga πρεσβύτεροι. Nililinaw ng “pinuno” na mga lider ang tinutukoy, hindi lamang matatanda sa edad.
- source_word: συμβούλιόν τε λαβόντες
  choice: at, matapos magsanggunian
  rationale: Ang idyomang συμβούλιον λαμβάνω ay nangangahulugang sama-samang pagsangguni o pagbuo ng pasiya. Pinananatili ng “matapos” ang pagkakasunod ng kilos sa Griyego.
- source_word: ἀργύρια ἱκανὰ
  choice: malaking halaga ng salaping pilak
  rationale: Ang ἀργύρια ay salaping pilak, at sa kontekstong ito ang ἱκανὰ ay tumutukoy sa malaking dami o halaga. Natural ang parirala sa Tagalog habang pinananatili ang pagtukoy sa pilak.
- source_word: ἔδωκαν
  choice: nagbigay sila
  rationale: Tuwirang salin ito ng pangunahing pandiwang δίδωμι sa aorist.
- source_word: τοῖς στρατιώταις
  choice: sa mga kawal
  rationale: Ang στρατιώταις ay literal na “mga kawal.” Bagaman naglilingkod silang mga bantay sa konteksto, hindi iyon ipinapalit sa leksikal na kahulugan.
theological_decisions:
- issue: Pagkakakilanlan ng di-binanggit na simuno
  choice: Ang “sila” ay ang mga punong pari na tinutukoy sa naunang talata.
  alternative: Isang di-tiyak na pangkat
  rationale: Ang mga panaguri at pangunahing pandiwa sa Griyego ay panlalaking maramihan at nagpapatuloy sa simuno ng Mateo 28:11. Hindi muling idinagdag ang “mga punong pari” dahil hindi rin ito inuulit sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy ng πρεσβύτεροι. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata sa ibinigay na anyo.
