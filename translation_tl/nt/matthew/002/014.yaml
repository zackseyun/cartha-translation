  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: tl
  text: Kaya bumangon siya, isinama ang bata at ang ina nito noong gabi, at umalis patungong Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, papunta sa Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Kaya
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay at, sa konteksto, nag-uugnay sa ginawa ni Jose sa naunang utos.
- source_word: ἐγερθεὶς
  choice: bumangon siya
  rationale: Likas at makabagong pananalita ito para sa agarang pagkilos ni Jose; naipahihiwatig ng pagkakasunod ng mga pandiwa ang diwang ‘pagkabangon.’
- source_word: παρέλαβε
  choice: isinama
  rationale: Sa kontekstong ito, ang παραλαμβάνω ay tumutukoy sa pagdadala o pagsasama ng ibang tao sa pag-alis, hindi lamang sa pagtanggap sa kanila.
- source_word: τὸ παιδίον
  choice: ang bata
  rationale: Payak at tuwirang katumbas ito ng παιδίον nang hindi nagdaragdag ng diin sa murang edad.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ang ina nito
  rationale: Nililinaw ng ‘nito’ na ang tinutukoy ay ang ina ng bata, hindi ang ina ni Jose.
- source_word: νυκτὸς
  choice: nang gabing iyon
  rationale: Ipinahahayag nito ang panahong gabi na tinutukoy sa salaysay. Ginagawang natural sa Filipino ng ‘iyon’ ang kontekstuwal na pagtukoy, nang hindi binabago ang pangyayari.
- source_word: ἀνεχώρησεν
  choice: umalis
  rationale: Sa konteksto, nangangahulugan itong lumisan patungo sa ibang lugar. Ang ‘umalis’ ay natural at hindi labis na nagpapakahulugan sa motibo.
- source_word: εἰς Αἴγυπτον
  choice: patungong Ehipto
  rationale: Ipinahahayag ng εἰς ang direksiyon at hantungan; likas sa Filipino ang ‘patungong Ehipto’ kasunod ng ‘umalis.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na pagkakasunod-sunod ng mga kilos at iniwasan ang masyadong literal ngunit alanganing anyo gaya ng ‘pagkabumangon.’
