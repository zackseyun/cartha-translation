  naturalness: Mas likas at malinaw sa modernong Filipino Tagalog ang “na nagsasabi” at “dumating kami upang magbigay-pugay sa kanya.” Ang “magbigay-pugay” ay marangal ngunit natural, at mas tiyak na inilalarawan ang pagpupugay sa isang hari kaysa sa mas malawak na “magbigay-galang.”
  terminology: Ang “Hari ng mga Judio” ay pinananatili bilang pamagat. Ang “magbigay-pugay” ay naglalarawan ng maharlikang homage at hindi pa ipinapasya na ang προσκυνέω rito ay tahasang pagsamba; ang alternatibong “sambahin siya” ay nararapat manatili sa talababa.
