id: MAT.2.2
reference: Matthew 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: tl
  text: na nagsasabi, “Nasaan ang ipinanganak na Hari ng mga Judio? Sapagkat nakita namin ang kanyang bituin sa silangan[a], at dumating kami upang magbigay-pugay sa kanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagsikat nito.” Maaaring mangahulugan ang pariralang Griego na “sa silangan” o tumukoy sa pagsikat ng bituin.
    reason: alternative_reading
  - marker: b
    text: O “upang sambahin siya.” Maaaring tumukoy ang pandiwang Griego sa pagpupugay sa isang hari o sa pagsamba, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagtatanong
  rationale: Ang participle ay nagpapakilala sa tuwirang pananalita; dahil tanong ang nilalaman nito, natural sa Tagalog ang “na nagtatanong” nang hindi binabago ang diwa.
- source_word: Ποῦ ἐστιν
  choice: Nasaan
  rationale: Tuwiran at natural na katumbas ng lokatibong tanong.
- source_word: ὁ τεχθεὶς
  choice: ang ipinanganak
  rationale: Pinananatili ang pokus sa kapanganakan at hindi idinaragdag ang mas tiyak na diwa ng “bagong silang.”
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: hari ng mga Judio
  rationale: Likas na Tagalog para sa titulong maharlika at pinananatili ang pampolitika at mesiyanikong bigat nito.
- source_word: εἴδομεν γὰρ
  choice: Sapagkat nakita namin
  rationale: Ipinakikita ng “sapagkat” na dahilan ito ng kanilang tanong, at ang “nakita namin” ay natural na salin ng aorist sa konteksto.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: ang kanyang bituin
  rationale: Natural na pagpapahayag ng possessive genitive nang hindi tinutukoy kung anong uri ng tanda sa kalangitan ang bituin.
- source_word: ἐν τῇ ἀνατολῇ
  choice: sa silangan
  rationale: Posibleng tumukoy sa direksiyong silangan; pinananatili sa talababa ang tunay na astronomikal na alternatibong “sa pagsikat nito.”
- source_word: ἤλθομεν
  choice: naparito kami
  rationale: Natural sa tuwirang pananalita at ipinahihiwatig ang pagdating nila sa kasalukuyang lugar bilang bunga ng paglalakbay.
- source_word: προσκυνῆσαι αὐτῷ
  choice: upang magbigay-galang sa kanya
  rationale: Ipinahahayag ang paggalang sa isang hari nang hindi agad nilulutas kung ang kilos ay tahasang pagsamba; inilalahad sa talababa ang alternatibo.
theological_decisions:
- issue: Ang kahulugan ng προσκυνῆσαι kaugnay ng batang si Jesus
  choice: upang magbigay-galang sa kanya
  alternative: upang sambahin siya
  rationale: Maaaring tumukoy ang pandiwa sa pagpupugay sa hari o sa pagsamba. Dahil hinahanap nila ang “hari ng mga Judio,” ang agarang balangkas ay maharlikang paggalang, ngunit pinananatili sa talababa ang mas teolohikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Judio” bilang karaniwang biblikal na katawagan at “magbigay-galang” upang mapanatili ang saklaw at teolohikal na tensiyon ng προσκυνέω.
