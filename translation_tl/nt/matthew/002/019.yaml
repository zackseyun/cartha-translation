id: MAT.2.19
reference: Matthew 2:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: tl
  text: Ngunit pagkamatay ni Herodes, narito, nagpakita sa panaginip kay Jose sa Ehipto ang isang anghel ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang anghel ng Panginoon.” Walang pantukoy bago ang salitang “anghel” sa Griyego.
    reason: Pinananatili ang posibleng tiyak na pagbasa at ang mga kaugnay nitong intertekstuwal na pahiwatig, bagaman hindi ito hinihingi ng anyong Griyego.
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: pagkamatay
  rationale: Ang aorist participle sa genitive absolute ay temporal; likas at malinaw sa Tagalog ang “pagkamatay ni Herodes.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagsasaad ito ng banayad na pagsalungat at paglipat sa kasunod na pangyayari.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang matingkad at marangal na panawagan ng tagapagsalaysay na bigyang-pansin ang sumunod na pangyayari.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Walang pantukoy ang ἄγγελος, kaya malinaw na naihahayag ng “isang anghel” ang pinakasimpleng pagbasa, samantalang ang κύριος ay likas na isinasaling “Panginoon.”
- source_word: φαίνεται
  choice: nagpakita
  rationale: Bagaman nasa present tense bilang historical present ang Griyego, mas natural sa salaysay na Tagalog ang aspektong naganap na “nagpakita,” habang nananatili ang bigla at matingkad na dating sa tulong ng “narito.”
- source_word: κατ’ ὄναρ
  choice: sa panaginip
  rationale: Ito ang natural na katumbas ng idyomang tumutukoy sa pagpapahayag na natanggap sa isang panaginip.
- source_word: τῷ Ἰωσὴφ
  choice: kay Jose
  rationale: Karaniwang anyo sa Tagalog ng pangalan at wastong pananda para sa taong pinakitaan.
- source_word: ἐν Αἰγύπτῳ
  choice: sa Ehipto
  rationale: Tuwirang lokatibong parirala na nagsasaad kung nasaan si Jose.
theological_decisions:
- issue: Pagsasalin ng κύριος sa ἄγγελος κυρίου
  choice: Panginoon
  alternative: panginoon o amo
  rationale: Sa kontekstong ito, ang κύριος ay titulong tumutukoy sa Diyos; pinananatili ng “Panginoon” ang kinikilalang kahulugan nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Pantukoy sa ἄγγελος
  choice: isang anghel ng Panginoon
  alternative: ang anghel ng Panginoon
  rationale: Walang pantukoy bago ang ἄγγελος sa Griyego, kaya “isang anghel” ang pinakatapat na pangunahing salin. Gayunman, hindi laging tiyak na di-tiyak ang pangngalang walang pantukoy sa Griyego, kaya inilalahad sa talababa ang tradisyonal at posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “narito” upang mapanatili ang pampanitikang diin ng ἰδοὺ, at inayos ang pangungusap upang maging likas sa Tagalog nang hindi nawawala ang lokasyon ni Jose o ang paraan ng pagpapakita.
