id: MAT.2.11
reference: Matthew 2:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: tl
  text: Pagpasok nila sa bahay, nakita nila ang bata na kasama ng kanyang inang si Maria. Nagpatirapa sila at nagbigay-pugay sa kanya.[a] At nang buksan nila ang kanilang mga kayamanan, naghandog sila sa kanya ng mga regalo—ginto, kamangyan, at mira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanya.” Maaaring mangahulugan ang pandiwang Griego ng pagsamba o ng taimtim na pagpupugay, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: bahay
  rationale: Tuwirang tumutukoy ang οἰκία sa isang bahay o tirahan; natural at tiyak ang “bahay” sa kontekstong ito.
- source_word: παιδίον
  choice: bata
  rationale: Ang παιδίον ay tumutukoy sa isang bata o batang paslit. Hindi na kailangang dagdagan ng kasarian o mas tiyak na edad na hindi hayag sa salita.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: kasama ng kanyang inang si Maria
  rationale: Pinananatili nito ang diwang “kasama ni Maria, na kanyang ina” sa natural na ayos ng modernong Tagalog.
- source_word: πεσόντες
  choice: nagpatirapa
  rationale: Ipinahahayag nito ang pisikal na pagyukod o pagbagsak sa harap ng bata nang hindi lamang inilalarawan bilang aksidenteng pagkadapa.
- source_word: προσεκύνησαν
  choice: nagbigay-pugay
  rationale: Maaaring tumukoy ang προσκυνέω sa pagsamba o sa taimtim na pagpupugay. Pinananatili ng “nagbigay-pugay” ang posibleng maharlikang paggalang nang hindi isinasara ang mas malakas na diwa ng pagsamba, na inilagay sa talababa.
- source_word: θησαυροὺς
  choice: mga sisidlan ng kayamanan
  rationale: Sa konteksto ng pagbubukas at paglalabas ng mga regalo, natural na ipinahihiwatig ng maramihang θησαυρούς ang mga sisidlan o imbakan ng kanilang mahahalagang dala. Iniiwasan nitong tukuyin ang mga iyon bilang partikular na “baul.”
- source_word: προσήνεγκαν
  choice: naghandog
  rationale: Ang προσφέρω rito ay pag-aalay o pormal na paghaharap ng mga regalo; ang “naghandog” ay angkop sa marangal na tagpo.
- source_word: δῶρα
  choice: mga regalo
  rationale: Ang δῶρα ay karaniwang mga regalo o kaloob. Ang “mga regalo” ay malinaw at hindi agad nagbibigay rito ng teknikal na kahulugang panrelihiyon.
- source_word: λίβανον
  choice: kamangyan
  rationale: Ang λίβανος ay frankincense, isang mabangong dagta; “kamangyan” ang tiyak at kinikilalang katawagang Filipino rito.
- source_word: σμύρναν
  choice: mira
  rationale: Ang σμύρνα ay myrrh; “mira” ang tuwiran at tradisyonal na salin sa Filipino.
theological_decisions:
- issue: Ang puwersa ng προσκυνέω kaugnay ng batang si Jesus
  choice: nagbigay-pugay
  alternative: sumamba sa kanya
  rationale: Maaaring ilarawan ng pandiwa ang taimtim na pagpupugay sa isang hari o ang pagsamba. Hindi tiyak na nilulutas ng agarang konteksto ang buong teolohikal na puwersa nito, kaya pinanatili sa pangunahing teksto ang mas malawak na “nagbigay-pugay” at inilagay sa talababa ang “sumamba.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagpatirapa” para sa hayag na kilos ng katawan at ang “nagbigay-pugay” upang mapanatili ang saklaw at teolohikal na tensiyon ng προσκυνέω. Inilagay ang talababa sa mismong pariralang tinutukoy nito.
