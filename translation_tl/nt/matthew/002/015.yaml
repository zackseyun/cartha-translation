id: MAT.2.15
reference: Matthew 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: tl
  text: 'At naroon siya hanggang sa kamatayan ni Herodes, upang matupad ang sinabi ng Panginoon sa pamamagitan ng propeta: “Mula sa Ehipto ay tinawag ko ang aking anak.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Oseas 11:1. Sa orihinal na konteksto, ang “anak” ay tumutukoy sa Israel; dito ay inihaharap ni Mateo si Jesus bilang katuparan ng Kasulatang iyon.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: nanatili siya roon
  rationale: Bagaman literal na ‘naroon siya,’ hinihingi ng konteksto at ng aspektong imperpektibo ang likas na Tagalog na ‘nanatili siya roon,’ nang hindi nagdaragdag ng diwa na wala sa talata.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: hanggang sa kamatayan ni Herodes
  rationale: Ang τελευτή ay tumutukoy rito sa kamatayan o wakas ng buhay; pinananatili ng salin ang nominal na anyo at natural ito sa Tagalog.
- source_word: ἵνα πληρωθῇ
  choice: upang matupad
  rationale: Pinananatili nito ang layunin o kinalabasang ipinahihiwatig ng ἵνα at ang pasibong anyo ng πληρόω.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: ang sinabi ng Panginoon sa pamamagitan ng propeta
  rationale: Ipinakikita nito ang Panginoon bilang pinagmulan ng pahayag at ang propeta bilang tagapamagitan, ayon sa pagkakaiba ng ὑπό at διά.
- source_word: λέγοντος
  choice: ':'
  rationale: Sa natural na makabagong Tagalog, sapat at malinaw ang tutuldok upang ipakilala ang tuwirang sipi; hindi kailangang ulitin ang ‘na nagsasabi.’
- source_word: Ἐξ Αἰγύπτου
  choice: Mula sa Ehipto
  rationale: Ang ‘mula sa’ ang pinakanatural na katumbas ng ἐξ sa Tagalog at pinananatili ang ideya ng pagtawag palabas ng Ehipto.
- source_word: ἐκάλεσα
  choice: tinawag ko
  rationale: Tuwirang katumbas ito ng καλέω at pinananatili ang pagkakaugnay ng sipi sa Oseas 11:1.
- source_word: τὸν υἱόν μου
  choice: ang aking Anak
  rationale: Ang υἱός ay tiyak na ‘anak na lalaki/anak’; ang ‘Anak’ ay natural sa sipi at pinananatili ang mahalagang wikang pang-anak nang hindi ipinapaliwanag sa mismong teksto kung sino ang tinutukoy.
theological_decisions:
- issue: Pormula ng katuparan at pagsipi sa Oseas 11:1
  choice: Panatilihin ang pahayag na natupad kay Jesus ang sinabi ng Panginoon, nang hindi tinutukoy sa teksto ang eksaktong paraan ng katuparan.
  alternative: Ipaliwanag sa pangunahing teksto na ito ay tuwirang hula lamang o tipolohikal na pag-uulit ng kasaysayan ng Israel.
  rationale: Malinaw na gumagamit si Mateo ng wikang katuparan, ngunit hindi niya rito ipinapaliwanag ang mekanismo nito. Dapat mapanatili ang tensiyon sa pagitan ng orihinal na pagtukoy sa Israel at ng pagkakapit ni Mateo kay Jesus.
- issue: Pagpapahayag sa κύριος
  choice: Panginoon
  alternative: YHWH o PANGINOON
  rationale: Ang tekstong Griyego ay may κυρίου. Ang ‘Panginoon’ ang tuwirang salin at hindi nagdaragdag ng anyong wala sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘nanatili’ para sa natural na daloy ng salaysay, ‘Herodes’ at ‘Ehipto’ bilang nakaugaliang anyong Filipino, at tutuldok upang maayos na ipakilala ang sipi.
