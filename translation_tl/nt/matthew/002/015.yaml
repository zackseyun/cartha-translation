  naturalness: Ang “At naroon siya roon” ay hindi kailangan ang dobleng pook; “At naroon siya hanggang sa kamatayan ni Herodes” ay likas, malinaw, at marangal sa makabagong Filipino. Ang tutuldok bago ang sipi ay natural.
  terminology: Ang “Panginoon,” “propeta,” “Ehipto,” at “Herodes” ay angkop. Ginawang maliit na titik ang “anak ko” sa sipi upang hindi ipasok sa anyo ng salin ang interpretatibong kapitalisasyon na wala sa Griyego; ang talababa ang nagbibigay ng kinakailangang intertekstuwal na paglilinaw.
