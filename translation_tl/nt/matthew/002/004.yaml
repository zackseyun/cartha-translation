revisions:
- from: Tinipon niya ang lahat ng mga punong pari at mga eskriba ng bayan, at tinanong niya sila kung saan isisilang ang Mesiyas.[a]
  to: Matapos niyang tipunin ang lahat ng punong pari at eskriba ng bayan, nagtatanong siya sa kanila kung saan isisilang ang Mesiyas.[a]
  rationale: Pinalitan ang simpleng “tinanong niya” ng “nagtatanong siya” upang maipakita ang imperfective na aspekto ng ἐπυνθάνετο. Pinalitan din ang “Tinipon niya ... at” ng “Matapos niyang tipunin ...” upang malinaw at natural na maipahayag ang naunang kilos ng aorist participle. Walang binago sa kahulugan ng mga titulo o sa hinaharap na oryentasyon ng inaasahang kapanganakan.
