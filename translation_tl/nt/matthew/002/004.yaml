  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: tl
  text: Matapos niyang tipunin ang lahat ng punong pari at eskriba ng bayan, nagtatanong siya sa kanila kung saan isisilang ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang Cristo.” Ang “Mesiyas” at “Cristo” ay kapuwa nangangahulugang “ang Pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: Tinipon niya
  rationale: Ang aorist participle ay nagsasaad ng kilos na kaugnay at likas na nauuna sa pagtatanong; sa Tagalog, malinaw at natural itong ihayag bilang sunod na pandiwang may aspektong naganap.
- source_word: πάντας
  choice: ang lahat
  rationale: Pinananatili ang saklaw na komprehensibo ng salitang Griyego.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa nakatataas na pamunuang makapari, hindi sa maraming kasalukuyang may tungkuling mataas na pari.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Direktang salin na kinikilalang katawagan sa mga dalubhasa at tagapagturo ng Kautusan; hindi pinalalawak ang kahulugan sa pangunahing teksto.
- source_word: τοῦ λαοῦ
  choice: ng bayan
  rationale: Natural na salin ng genitive na hindi nagdaragdag ng tahasang etnikong paliwanag.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: tinanong niya sila
  rationale: Natural na Tagalog para sa paghingi ng impormasyon mula sa kanila. Bagaman imperfect ang anyo, hindi kailangang gawing paulit-ulit ang kilos kung walang malinaw na diin sa pag-uulit.
- source_word: ποῦ
  choice: kung saan
  rationale: Angkop na anyo sa di-tuwirang tanong sa Tagalog.
- source_word: ὁ χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang titulong Χριστός sa kontekstong Judio ng inaasahang pinahiran ng Diyos, sa halip na ituring itong personal na pangalan.
- source_word: γεννᾶται
  choice: isisilang
  rationale: Ang present passive sa di-tuwirang tanong ay tumutukoy sa inaasahang kapanganakan; ang panghinaharap na aspektong Tagalog ay natural na naghahayag nito nang hindi inilalagay sa bibig ng teksto ang mas tiyak na modal na kahulugan.
theological_decisions:
- issue: Pagpapahayag sa titulong Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa konteksto, itinatanong ni Herodes ang tungkol sa inaasahang pinahirang hari sa propesiya ng Israel. Kaya ang “Mesiyas” ay malinaw na nagpapanatili sa titulong Judio, habang ang “Cristo” ay maaari ring gamiting katumbas ngunit mas madaling mabasa bilang pangalan.
- issue: Panahunan ng γεννᾶται sa di-tuwirang tanong
  choice: isisilang
  alternative: ipinanganganak / nakatakdang isilang
  rationale: Pinananatili ang hinaharap na oryentasyon ng tanong tungkol sa inaasahang kapanganakan, ngunit hindi dinaragdagan ng tahasang ideya ng itinakdang pangyayari na wala mismo sa pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “punong pari,” “eskriba,” at “Mesiyas” bilang mga kinikilalang katawagang biblikal; iniwasan ang masalimuot at di-natural na literal na hulma ng participle at imperfect.
