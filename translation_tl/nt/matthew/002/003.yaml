id: MAT.2.3
reference: Matthew 2:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: tl
  text: Nang marinig ito ni Haring Herodes, nabagabag siya, pati ang buong Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buong Jerusalem” ay tumutukoy sa mga naninirahan sa lungsod. Maaaring ito ay pangkalahatan o pagmamalabis na paglalarawan sa pagkabagabag ng lungsod.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig ito
  rationale: Ang aorist participle ay ginagamit nang temporal. Likas sa modernong Tagalog ang sugnay na “Nang marinig ito”; ang “ito” ay tumutukoy sa balitang sinabi ng mga pantas sa naunang konteksto.
- source_word: δὲ
  choice: ipinahihiwatig sa daloy ng “Nang”
  rationale: Mahinang pang-ugnay at panandang transisyon ang δέ. Hindi na kailangan ng hiwalay na “ngunit” o “at” sapagkat maayos nang naihahatid ng temporal na pagbubukas ang daloy.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Haring Herodes
  rationale: Ito ang natural at marangal na ayos ng titulo at pangalan sa Tagalog, gamit ang nakaugaliang anyo ng pangalang Herodes.
- source_word: ἐταράχθη
  choice: nabagabag
  rationale: Ipinahahayag nito ang matinding pagkabalisa o panloob na kaguluhan nang hindi tiyak na dinaragdagan ang sanhi o antas ng damdamin.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: ang buong Jerusalem
  rationale: Pinananatili nito ang metonimiya ng Griyego, kung saan ang pangalan ng lungsod ay kumakatawan sa mga naninirahan dito, at hindi ito nililimitahan sa mga pinuno lamang.
- source_word: μετ’ αὐτοῦ
  choice: pati
  rationale: Natural na ipinahahayag ng “pati” na kasama ni Herodes ang buong Jerusalem sa pagkabagabag; naiiwasan din ang malabong Tagalog na “kasama niya.”
theological_decisions:
- issue: Saklaw ng πᾶσα Ἱεροσόλυμα
  choice: Pinanatili ang korporatibo at metonimikong “ang buong Jerusalem.”
  alternative: Maaaring ito ay pangkalahatan o pagmamalabis para sa maraming taga-Jerusalem, o maaaring lalo nitong tinutukoy ang mga namumuno sa lungsod.
  rationale: Lungsod mismo ang tahasang pinangalanan ng Griyego. Hindi ito dapat paliitin sa mga pinuno o palawakin sa isang literal na pahayag tungkol sa bawat indibidwal; pinananatili ng salin at talababa ang tunay na lawak at tensiyon ng pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nabagabag” upang mapanatili ang emosyonal na lakas ng ἐταράχθη, at “pati” upang maipahayag nang likas ang μετ’ αὐτοῦ. Inilagay ang marker [a] pagkatapos ng buong pariralang tinatalabaan.
