  terminology: Ang 'Herodes,' 'Bethlehem,' 'mga mago,' 'batang lalaki,' at 'ipinapatay' ay angkop. Ang 'ipinapatay' ay likas na paraan upang ipakita na si Herodes ang nag-utos matapos siyang magsugo ng mga tauhan, samantalang nananatili ang kanyang pananagutan sa kilos.
