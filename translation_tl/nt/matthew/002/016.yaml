id: MAT.2.16
reference: Matthew 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: tl
  text: Noon, nang mapagtanto ni Herodes na nilinlang[a] siya ng mga mago[b], lubha siyang nagalit. Nagsugo siya ng mga tauhan at ipinapatay ang lahat ng batang lalaki sa Bethlehem at sa lahat ng karatig na lugar nito, mula sa dalawang taong gulang pababa, batay sa panahong tumpak niyang nalaman mula sa mga mago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinagtawanan” o “ginawang katawa-tawa.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga mago ay mga pantas na taga-Silangan na kaugnay ng pag-aaral sa mga bituin; tradisyonal na isinasaling “mga pantas.”
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Nang magkagayon
  rationale: Likas at marangal na panandang temporal na nag-uugnay sa kasunod na pangyayari.
- source_word: ἰδὼν ὅτι
  choice: nang makita ... na
  rationale: Pinananatili ang diwa ng pagkakita o pagkaunawa ni Herodes sa nangyari nang hindi ito labis na ipinapaliwanag.
- source_word: ἐνεπαίχθη
  choice: nilinlang
  rationale: Sa konteksto, hindi bumalik ang mga mago kaya nadama ni Herodes na napaglalangan siya; inilalagay sa talababa ang mas literal na diwang ‘pinagtawanan’ o ‘ginawang katawa-tawa.’
- source_word: μάγων
  choice: mga mago
  rationale: Transliterasyon ito ng tiyak na katawagang Griyego para sa mga pantas na taga-Silangan na kaugnay ng astrolohiya; hindi nito ipinapasok ang mga detalye ng kalaunang tradisyon.
- source_word: ἐθυμώθη λίαν
  choice: galit na galit siya
  rationale: Malinaw at natural na ipinapahayag ang matinding galit na ipinahihiwatig ng pandiwa at ng λίαν.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Nagsugo siya ng mga tauhan at ipinapatay
  rationale: Ipinapakita kapuwa ang pagsusugo at ang pananagutan ni Herodes sa pagpatay, sa natural na anyong Filipino.
- source_word: πάντας τοὺς παῖδας
  choice: lahat ng batang lalaki
  rationale: Sa konteksto ng paghahanap sa batang lalaki at ng utos ni Herodes, ang παῖδας ay tumutukoy sa mga batang lalaki, hindi sa lahat ng bata anuman ang kasarian.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: sa lahat ng karatig na lugar nito
  rationale: Ang ὅρια rito ay tumutukoy sa mga teritoryo o lugar sa palibot ng Bethlehem, hindi lamang sa mismong hangganan.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: mula dalawang taong gulang pababa
  rationale: Karaniwang pahayag sa Filipino para sa inklusibong pinakamataas na edad na dalawang taon.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: batay sa panahong maingat niyang tiniyak mula sa mga mago
  rationale: Pinananatili ang ideya na ang saklaw ng edad ay ibinatay ni Herodes sa eksaktong impormasyong nakuha niya sa mga mago.
theological_decisions:
- issue: Pagpapakahulugan sa μάγοι
  choice: mga mago
  alternative: mga pantas
  rationale: Mas tuwirang kumakatawan ang ‘mga mago’ sa katawagang Griyego at sa historikal-kultural na pagkakakilanlan ng mga bisita, nang hindi sila basta inuugnay sa kalaunang tradisyon.
- issue: Pagpapakahulugan sa ἐνεπαίχθη
  choice: nilinlang
  alternative: pinagtawanan / ginawang katawa-tawa
  rationale: Ang ‘nilinlang’ ang malinaw na kontekstuwal na diwa, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad ng panunuya o pangungutya.
- issue: Pamamagitan ng mga tauhan sa pagpatay
  choice: Nagsugo siya ng mga tauhan at ipinapatay
  alternative: nagsugo siya at pinatay
  rationale: Nililinaw ng Filipino causative na si Herodes ang nag-utos at may pananagutan, samantalang ang mga isinugo ang agarang nagsagawa; hindi nito binabawasan ang aktibong pananagutan niya sa salaysay.
translation_notes:
  register: Makabagong Filipino na malinaw, tuwiran, at marangal. Ginamit ang ‘Herodes,’ ‘Bethlehem,’ at ‘mga mago’ bilang pamilyar na anyong biblikal; iniwasan ang makaluma o labis na teknikal na pananalita.
