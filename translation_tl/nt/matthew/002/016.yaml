  source_fidelity: Tumpak na naipapahayag ng draft ang pagkadama ni Herodes na siya ay nalinlang o napaglaruan ng mga mago, ang tindi ng kanyang galit, ang pagsugo ng mga tauhan, ang pagpatay sa lahat ng batang lalaki, ang sakop na Bethlehem at mga karatig-lugar nito, at ang edad na dalawang taon pababa. Gayunman, ang 'maingat niyang tiniyak mula sa' ay hindi pinakamalinaw na katumbas ng ἠκρίβωσεν παρὰ τῶν μάγων, na tumutukoy sa panahong tumpak na nalaman o masusing inalam niya mula sa mga mago.
