revisions:
- from: Nang magkagayon, nang makita ni Herodes na nilinlang[a] siya ng mga mago[b], galit na galit siya. Nagsugo siya ng mga tauhan at ipinapatay ang lahat ng batang lalaki sa Bethlehem at sa lahat ng karatig na lugar nito, mula dalawang taong gulang pababa, batay sa panahong maingat niyang tiniyak mula sa mga mago.
  to: Noon, nang mapagtanto ni Herodes na nilinlang[a] siya ng mga mago[b], lubha siyang nagalit. Nagsugo siya ng mga tauhan at ipinapatay ang lahat ng batang lalaki sa Bethlehem at sa lahat ng karatig na lugar nito, mula sa dalawang taong gulang pababa, batay sa panahong tumpak niyang nalaman mula sa mga mago.
  rationale: Pinakinis ang pambungad upang maging idiomatiko sa modernong Filipino at pinalitan ang 'maingat niyang tiniyak' ng 'tumpak niyang nalaman' upang mas malinaw na maipahayag ang masusing pagkuha ni Herodes ng impormasyon mula sa mga mago. Napanatili ang lahat ng kahulugan at ang mga umiiral na talababa.
