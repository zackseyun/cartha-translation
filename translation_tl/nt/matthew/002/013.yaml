id: MAT.2.13
reference: Matthew 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: tl
  text: Pagkaalis nila, narito, nagpakita kay Jose sa panaginip ang isang anghel ng Panginoon[a] at sinabi, “Bumangon ka, isama mo ang bata at ang kanyang ina, at tumakas ka patungong Ehipto. Manatili ka roon hanggang sa sabihin ko sa iyo, sapagkat malapit nang hanapin ni Herodes ang bata upang patayin siya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang anghel ng Panginoon.” Walang artikulo bago ang “anghel” sa Griyego, ngunit maaaring maunawaan ang parirala bilang pamilyar na katawagang biblikal.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “upang lipulin siya”; sa kontekstong ito, nangangahulugan itong sanhiin ang kanyang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Pagkaalis nila
  rationale: Ang genitive absolute ay nagsasaad ng naunang pangyayari. Likas sa Tagalog ang “Pagkaalis nila” at malinaw na tumutukoy ang “nila” sa mga panauhing nabanggit sa naunang konteksto.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang masiglang panandang pasalaysay ni Mateo na tumatawag ng pansin sa biglaang pangyayari.
- source_word: ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  rationale: Walang artikulo ang ἄγγελος sa Griyego, kaya ang di-tiyak na “isang anghel” ang pangunahing salin. Pinananatili ng talababa ang posibilidad na marinig ito bilang pamilyar na pariralang “ang anghel ng Panginoon.”
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: nagpakita kay Jose sa panaginip
  rationale: Bagaman nasa present tense ang φαίνεται bilang vivid narrative present, mas likas sa salaysay na Tagalog ang nagdaang panahunan. Ang κατ’ ὄναρ ay idyomang nangangahulugang “sa panaginip.”
- source_word: Ἐγερθεὶς παράλαβε
  choice: Bumangon ka, isama mo
  rationale: Ang participle na Ἐγερθεὶς ay gumaganap bilang unang utos sa sunod-sunod na kilos. Ang παράλαβε ay hindi lamang “kunin” kundi dalhin o isama ang isang tao.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: ang bata at ang kanyang ina
  rationale: Tapat at likas na tumutukoy ang panghalip sa bata, at iniiwasang ipangalan si Maria kung hindi siya pinangalanan sa talata.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: tumakas kayo patungong Ehipto
  rationale: Ipinahihiwatig ng φεύγω ang agarang pag-iwas sa panganib. Ginawang maramihan ang “kayo” dahil si Jose ay tatakas kasama ang bata at ina nito, bagaman isahan ang utos sa Griyego.
- source_word: ἴσθι ἐκεῖ
  choice: Manatili kayo roon
  rationale: Literal itong “maging naroon,” ngunit sa konteksto ay nangangahulugang patuloy na mamalagi roon. Ang “manatili” ang malinaw at likas na katumbas.
- source_word: ἕως ἂν εἴπω σοι
  choice: hanggang sabihin ko sa iyo
  rationale: Ipinapahayag ng ayos na ito ang isang di-tiyak na hangganan sa hinaharap; hindi dinaragdagan ang hindi sinabi kung ano ang ipagbibigay-alam.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: sapagkat malapit nang hanapin ni Herodes
  rationale: Ang μέλλει ay nagsasaad ng napipintong layunin o kilos. Pinananatili ng “malapit nang” ang diwa ng pagiging nalalapit nang hindi ginagawang naganap na ang paghahanap.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: upang patayin siya
  rationale: Ang ἀπόλλυμι ay maaaring mangahulugang wasakin o lipulin; kapag tao ang tuwirang layon sa kontekstong ito, malinaw na ang layunin ay sanhiin ang kanyang kamatayan. Ang “patayin” ang natural na modernong Tagalog, habang itinatala sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa ἄγγελος κυρίου
  choice: Panginoon
  alternative: panginoon / amo
  rationale: Sa pamilyar na biblikal na pariralang ito, ang “Panginoon” ang kinikilalang titulo para sa Diyos at hindi nagdaragdag ng mas makitid na doktrinal na pakahulugan.
- issue: Tiyak o di-tiyak na pagkakakilanlan ng ἄγγελος κυρίου
  choice: isang anghel ng Panginoon
  alternative: ang anghel ng Panginoon
  rationale: Sinusunod ng pangunahing teksto ang kawalan ng artikulo sa Griyego, ngunit pinananatili sa talababa ang posibilidad na basahin ito bilang pamilyar at tiyak na pariralang biblikal nang hindi nagpapasya sa isang partikular na teolohiya tungkol sa pagkakakilanlan ng anghel.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang “narito” bilang sadyang pampanitikang pananda ni Mateo, ngunit gumamit ng karaniwang mga pandiwang “bumangon,” “isama,” “tumakas,” at “manatili.” Ang “Ehipto,” “Herodes,” “Jose,” at “Panginoon” ay sumusunod sa nakaugaliang anyong Tagalog sa Bibliya.
