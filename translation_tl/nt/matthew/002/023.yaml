id: MAT.2.23
reference: Matthew 2:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: tl
  text: 'At pagdating niya, nanirahan siya sa isang bayang tinatawag na Nazaret[a], upang matupad ang sinabi sa pamamagitan ng mga propeta: “Tatawagin siyang Nazareno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nazoreo.” Pinagtatalunan ang eksaktong propetikong pinagmulan ng “Tatawagin siyang Nazareno.” Maaaring binubuod ni Mateo ang mga tema mula sa mga propeta sa halip na sumipi ng isang tiyak na teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: pagdating niya roon
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Likas sa Tagalog ang ganitong ayos at hindi kailangang gawing hiwalay na pandiwa.
- source_word: κατῴκησεν
  choice: nanirahan
  rationale: Malinaw na ipinahihiwatig ng κατοικέω ang paninirahan o pagtira sa isang lugar; ang “nanirahan” ay natural at marangal sa modernong Tagalog.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: sa isang bayang tinatawag na Nazaret
  rationale: Bagaman maaaring literal na “papasok sa,” hinihingi ng pandiwang panirahan ang natural na “sa.” Ang “bayan” ay mas angkop sa karaniwang pagkaunawa sa Nazaret kaysa “lungsod,” habang nananatili sa saklaw ng πόλις.
- source_word: ὅπως πληρωθῇ
  choice: upang matupad
  rationale: Pinananatili ng “upang” ang layunin/resultang diwa ng ὅπως, at ang “matupad” ang karaniwang malinaw na katumbas ng passive fulfillment formula.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: ang sinabi sa pamamagitan ng mga propeta
  rationale: Ang “sa pamamagitan ng” ay nagpapanatili sa tagapamagitang diwa ng διά, at ang maramihang “mga propeta” ay mahalaga sa pormula ni Mateo.
- source_word: Ναζωραῖος
  choice: Nazareno
  rationale: Ito ang natural at nakaugaliang katawagan sa Tagalog para sa isang taong kaugnay ng Nazaret. Inilalagay sa talababa ang mas pormal na alternatibong “Nazoreo” at ang kawalang-katiyakan sa propetikong pinagmulan.
- source_word: κληθήσεται
  choice: Tatawagin siyang
  rationale: Tumpak at natural na isinasalin ang future passive ng καλέω, habang pinananatili ang estilong propetiko.
theological_decisions:
- issue: Kalikasan ng katuparang binanggit ni Mateo na walang eksaktong katumbas na iisang teksto sa Lumang Tipan
  choice: Panatilihin sa pangunahing teksto ang maramihang “mga propeta” nang hindi nagtuturo ng isang tiyak na pinagmulan.
  alternative: Iugnay nang tahasan sa Isaias 11:1, sa tema ng hinamak na Mesiyas, o sa panata ng isang Nazareo.
  rationale: Maramihan ang προφητῶν, kaya maaaring buod o pinagsamang temang propetiko ang tinutukoy. Hindi dapat lutasin ng salin ang isang debateng hindi nilulutas ng Griyegong teksto. Hindi rin nararapat ang “Nazareo” sa diwa ng panata sapagkat ang Ναζωραῖος dito ay kaugnay ng Nazaret.
- issue: Pagsasalin ng Ναζωραῖος
  choice: Nazareno
  alternative: Nazoreo
  rationale: Mas madaling maunawaan at karaniwan sa Filipino ang “Nazareno,” samantalang maitatala sa talababa ang mas pormal na “Nazoreo” upang mapanatili ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bayan” sa halip na “lungsod” dahil mas natural ito para sa Nazaret, at iniwasan ang makaluma o sektaryong pananalita.
