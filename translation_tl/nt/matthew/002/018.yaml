  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: tl
  text: '“Isang tinig ang narinig sa Rama—


    pag-iyak at matinding pagtangis.


    Umiiyak si Raquel para sa kanyang mga anak,


    at ayaw niyang tumanggap ng kaaliwan[a],


    sapagkat wala na sila[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumanggi siyang tumanggap ng kaaliwan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sapagkat wala sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: May tinig na narinig sa Rama
  rationale: Pinananatili ng “tinig” ang personipikado at makahulang himig, samantalang natural na isinasalin ng “narinig” ang aorist passive na ἠκούσθη. Ang Rama ay karaniwang transliterasyon ng pangalan ng lugar.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: pag-iyak at matinding pagtangis
  rationale: Ipinakikita ng dalawang magkaugnay ngunit magkahiwalay na salita ang naririnig na pag-iyak at matinding pagluluksa. Isinasalin ng “matinding” ang pagpapalakas na dala ng πολύς nang hindi nagdaragdag ng di-hayag na detalye.
- source_word: Ῥαχὴλ κλαίουσα
  choice: Umiiyak si Raquel
  rationale: Ang kasalukuyang pandiwaring κλαίουσα ay nagpapahiwatig ng nagpapatuloy na pagkilos. Ginamit ang nakaugaliang modernong anyong Tagalog na “Raquel.”
- source_word: τὰ τέκνα αὐτῆς
  choice: kanyang mga anak
  rationale: Ang τέκνα ay pangkalahatang tumutukoy sa mga anak at hindi lamang sa mga lalaki.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ayaw niyang tumanggap ng kaaliwan
  rationale: Malapit ang “ayaw” sa diwa ng οὐκ ἤθελεν na hindi pagnanais o hindi pagpayag. Mas malinaw sa modernong Tagalog ang “tumanggap ng kaaliwan” kaysa “maaliw,” na maaari ring mangahulugang malibang.
- source_word: ὅτι οὐκ εἰσίν
  choice: sapagkat wala na sila
  rationale: Pinananatili nito ang matinding kaiklian ng Griyegong idyoma at ipinahihiwatig ang pagkawala nang hindi tahasang nagdaragdag ng salitang “patay.”
theological_decisions:
- issue: Ang katauhan ni Raquel sa sipi
  choice: Pinanatili si Raquel bilang inang umiiyak sa makahulang sipi nang hindi ipinaliliwanag sa pangunahing teksto ang kanyang simbolikong papel.
  alternative: Tahasang tukuyin si Raquel bilang sagisag ng mga ina ng Israel o bilang literal na inang nagsasalita.
  rationale: Si Raquel lamang ang tuwirang inihaharap ng Griyegong teksto. Ang pagpapaliwanag sa simbolismo ay magpapasya sa isang interpretasyong hindi tahasang sinasabi ng talata.
- issue: Kahulugan ng “wala na sila”
  choice: Pinanatili ang hindi tahasang anyo ng pahayag tungkol sa pagkawala ng mga anak.
  alternative: Isalin bilang “sapagkat patay na sila.”
  rationale: Sa konteksto ay tumutukoy ito sa mga anak na nawala, ngunit ang Griyego ay literal na nagsasabing “wala sila.” Iniiwasan ng salin ang hindi kailangang pagpapalinaw habang nananatiling natural sa Tagalog.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Ang anyong patula at mga paghahati ng linya ay tumutulong na mapanatili ang himig ng siping makahula. Iniwasan ang “maaliw” dahil maaari itong maunawaan bilang paglilibang sa halip na pag-aliw sa nagdadalamhati.
