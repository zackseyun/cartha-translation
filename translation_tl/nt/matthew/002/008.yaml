  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: tl
  text: Pagkatapos niya silang ipadala sa Betlehem, sinabi niya, “Humayo kayo at hanapin ninyong mabuti ang bata. Kapag natagpuan ninyo siya, ipagbigay-alam ninyo sa akin upang ako rin ay pumunta at sumamba sa kanya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay-pugay sa kanya” o “yumukod sa harap niya.” Ang pandiwang Griyego ay maaaring tumukoy sa pagsamba o sa paggalang na ipinakikita sa isang hari o pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Pagkatapos niya silang ipadala
  rationale: Ipinapahayag ng aorist participle ang kilos na nauna sa pangunahing pandiwang “sinabi”; natural sa Tagalog ang tahasang pagkakasunod na “Pagkatapos … ipadala.”
- source_word: Πορευθέντες
  choice: Humayo kayo
  rationale: Gumaganap itong panimulang utos kasama ng ἐξετάσατε. Ang “Humayo kayo” ay malinaw, marangal, at angkop sa direktang pananalita.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: hanaping mabuti
  rationale: Pinagsasama nito ang masusing pagsisiyasat at aktuwal na paghahanap sa bata. Ang “hanaping mabuti” ay natural sa modernong Tagalog at hindi labis na teknikal.
- source_word: περὶ τοῦ παιδίου
  choice: ang bata
  rationale: Sa konteksto ng pandiwa ng paghahanap o pagsisiyasat, ang περί ay likas na naipapahayag sa Tagalog sa pamamagitan ng tuwirang layon na “ang bata.”
- source_word: παιδίου
  choice: bata
  rationale: Ang παιδίον ay tumutukoy sa isang bata; hindi kailangan ng salitang Griyego mismo ang mas tiyak na “munting bata.”
- source_word: ἐπὰν δὲ εὕρητε
  choice: Kapag natagpuan ninyo siya
  rationale: Ang ἐπάν na may subjunctive ay nagsasaad ng inaasahang pangyayari na may pasubaling katangian. Pinananatili ng “kapag” ang likas na tensiyong ito nang hindi ginagawang tiyak ang pagkakatagpo.
- source_word: ἀπαγγείλατέ μοι
  choice: ipagbigay-alam ninyo sa akin
  rationale: Ipinahihiwatig ng ἀπαγγέλλω ang paghahatid ng ulat pabalik. Mas malinaw itong naipapahayag ng “ipagbigay-alam … sa akin” kaysa sa payak na “sabihin.”
- source_word: ὅπως
  choice: upang
  rationale: Malinaw na ipinakikilala ng “upang” ang layunin na ipinahahayag ng ὅπως.
- source_word: κἀγὼ
  choice: rin ako
  rationale: Pinananatili ng “rin” ang pahiwatig na sinasabi ni Herodes na makikibahagi siya sa layunin ng mga pantas.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: makapunta rin ako at sumamba sa kanya
  rationale: Natural na pinagsama sa Tagalog ang kilos ng pagpunta at ang layuning kasunod nito. Ang “sumamba” ay nasa leksikal na saklaw ng προσκυνέω, habang inilalahad sa talababa ang ibang posibleng diwa.
theological_decisions:
- issue: Ang kahulugan ng προσκυνήσω αὐτῷ kapag ang bata ang tinutukoy
  choice: sumamba sa kanya
  alternative: magbigay-pugay sa kanya; yumukod sa harap niya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagsamba o sa pagyukod bilang pagpupugay sa isang maharlikang tao. Pinananatili ng “sumamba” ang posibleng mas mataas na teolohikal na diwa sa salaysay ni Mateo, ngunit hindi ikinukubli ng talababa ang tunay na leksikal na kalabuan. Ang mapanlinlang na layunin ni Herodes ay hindi ginagamit upang paliitin ang saklaw ng mismong pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Humayo” bilang dignified ngunit madaling maunawaang utos; iniwasan ang sobrang teknikal na “magsiyasat nang masusi.” Inilagay ang talababa pagkatapos ng “sumamba sa kanya,” ang mismong pariralang nangangailangan ng paliwanag.
