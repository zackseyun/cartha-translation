id: MAT.2.22
reference: Matthew 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: tl
  text: Ngunit nang mabalitaan niyang si Arquelao ay naghahari sa Judea kapalit ng ama nito na si Herodes, natakot siyang pumunta roon. Matapos siyang balaan sa isang panaginip,[a] umalis siya patungo sa mga bahagi ng Galilea,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang isinaling “balaan” ay karaniwang nagpapahiwatig ng babala o tagubiling mula sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Ngunit nang marinig niya
  rationale: Ipinapahayag ng aorist participle ang pangyayaring nauna sa pagkatakot, samantalang ang δέ ay naghuhudyat ng pagsalungat sa naunang balak.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: ang naghahari sa Judea
  rationale: Pinananatili ng “naghahari” ang maharlikang diwa ng βασιλεύω at likas sa Filipino ang paggamit ng “sa” para sa nasasakupang lupain.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: bilang kahalili ng ama nitong si Herodes
  rationale: Ipinahahayag ng ἀντί ang paghalili o pagkuha sa puwesto. Nililinaw ng “nitong” na si Herodes ang ama ni Arquelao, hindi ng pangunahing tauhan.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: natakot siyang pumunta roon
  rationale: Natural at tuwiran itong katumbas ng pagkatakot na tumungo sa Judea.
- source_word: χρηματισθεὶς
  choice: matapos siyang balaan
  rationale: Pinananatili ang anyong balintiyak at hindi tahasang dinaragdagan ang di-binanggit na tagapagbabala, bagaman sa konteksto ni Mateo ay karaniwang pahiwatig nito ang babala o tagubiling mula sa Diyos.
- source_word: κατ’ ὄναρ
  choice: sa isang panaginip
  rationale: Likas na salin ng karaniwang parirala ni Mateo para sa kapahayagang natanggap habang natutulog.
- source_word: ἀνεχώρησεν
  choice: nagtungo siya
  rationale: Sa kontekstong ito, inilalarawan ng pandiwa ang sinadyang pag-alis patungo sa ibang lugar. Ang “nagtungo” ay natural at hindi nagpapahiwatig nang labis ng pag-atras sa labanan.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: sa mga sakop ng Galilea
  rationale: Sinasalamin ng maramihang μέρη ang mga lugar o nasasakupang bahagi ng Galilea nang hindi nagmumungkahi ng mahigpit na mga rehiyong administratibo.
theological_decisions:
- issue: Kung tahasang tutukuyin ang Diyos bilang pinagmulan ng babala sa χρηματισθείς
  choice: Hindi idinagdag ang “ng Diyos” sa pangunahing teksto; ginamit ang “matapos siyang balaan.”
  alternative: “matapos siyang balaan ng Diyos” o “matapos tumanggap ng tagubilin mula sa Diyos”
  rationale: Karaniwang may pahiwatig ng banal na komunikasyon ang pandiwa sa Mateo, ngunit hindi tahasang binabanggit ng Griyego ang gumagawa. Pinananatili ng salin ang balintiyak at ang tunay na antas ng pahayag ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Arquelao,” “Herodes,” at “Galilea” bilang mga anyong pangalang karaniwan sa Bibliyang Filipino. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
