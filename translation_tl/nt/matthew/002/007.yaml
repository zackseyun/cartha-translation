  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: tl
  text: Pagkatapos, palihim na ipinatawag ni Herodes ang mga mago[a] at masusing inalam sa kanila kung kailan lumitaw ang bituin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pantas.” Ang salitang Griyego na μάγοι (magoi) ay tumutukoy rito sa mga edukadong pantas mula sa Silangan na nag-aaral ng mga bituin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbi itong panandang temporal na nag-uugnay sa kasunod na pangyayari sa daloy ng salaysay.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Karaniwang anyong Tagalog ng pangalang Herod.
- source_word: λάθρᾳ καλέσας
  choice: palihim na ipinatawag
  rationale: Ipinahahayag ng λάθρᾳ ang paglilihim, at ang ipinatawag ay likas na Tagalog para sa sinadya at may awtoridad na pagtawag na ipinahihiwatig ng καλέσας sa kontekstong ito.
- source_word: τοὺς μάγους
  choice: ang mga mago
  rationale: Mas tuwirang inililipat ng mago ang μάγοι at hindi nito basta ipinapalit ang mas malawak na katawagang mga pantas; ipinaliliwanag sa talababa ang kahulugan at pamilyar na alternatibo.
- source_word: ἠκρίβωσεν
  choice: masusing inalam
  rationale: Ipinahahayag nito ang maingat at tiyak na pag-alam nang hindi gumagamit ng matigas o teknikal na pananalita.
- source_word: παρ’ αὐτῶν
  choice: sa kanila
  rationale: Sa likas na Tagalog, ang inalam sa kanila ay malinaw na nagsasaad na sila ang pinagmulan ng impormasyong hinanap ni Herodes.
- source_word: τὸν χρόνον τοῦ φαινομένου ἀστέρος
  choice: kung kailan lumitaw ang bituin
  rationale: Likas na ginagawang sugnay na temporal sa Tagalog ang pariralang Griyego at pinananatili ang pokus sa panahon ng pagpapakita ng bituin.
