  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: tl
  text: Matapos nilang marinig ang hari, nagpatuloy sila sa kanilang paglalakbay. At narito, ang bituing nakita nila sa silangan[a] ay nanguna sa kanila hanggang sa dumating ito at tumigil sa ibabaw ng kinaroroonan ng bata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “nang ito’y sumikat.” Maaaring tumukoy ang pariralang Griyego sa silangan bilang direksiyon o rehiyon, o sa pagsikat ng isang bituin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Pagkarinig nila sa hari
  rationale: Ang aorist participle ay likas na isinalin bilang sugnay na temporal na nauuna sa pangunahing kilos. Ipinahihiwatig ng genitive ang taong kanilang pinakinggan, nang hindi idinaragdag ang pangalang Herodes na wala sa talata.
- source_word: ἐπορεύθησαν
  choice: nagpatuloy sila sa kanilang paglalakbay
  rationale: Ipinapahayag ng πορεύομαι ang paglakad o paglalakbay. Likas sa makabagong Tagalog ang pariralang ito at malinaw na ipinagpatuloy nila ang kanilang lakad matapos marinig ang hari.
- source_word: ἰδοὺ
  choice: At narito
  rationale: Pinananatili nito ang panandang pandiskurso na tumatawag ng pansin sa biglang kapansin-pansing pangyayari.
- source_word: ὁ ἀστήρ
  choice: ang bituin
  rationale: Ito ang tuwiran at karaniwang katumbas sa Tagalog.
- source_word: ὃν εἶδον
  choice: nakita nila
  rationale: Sa Tagalog, sapat na ang aspektong perpektibo upang ipakitang nauna ang pagkakita sa kasalukuyang kilos ng bituin.
- source_word: ἐν τῇ ἀνατολῇ
  choice: sa silangan
  rationale: Pinananatili sa pangunahing teksto ang karaniwan at heograpikong pakahulugan, habang inilalagay sa talababa ang posibleng astronomikal na diwang “nang ito’y sumikat.”
- source_word: προῆγεν αὐτούς
  choice: nanguna sa kanila
  rationale: Ipinahahayag nito ang pagpunta sa unahan o pangunguna nang hindi tinutukoy kung paano sila ginabayan ng bituin.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: hanggang sa dumating ito at tumigil
  rationale: Pinananatili ang pagkakasunod ng pagdating at paghinto. Sa kontekstong ito, ang “tumigil” ay natural na katumbas ng pagtayo o pananatili ng bituin.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: sa ibabaw ng kinaroroonan ng bata
  rationale: Malinaw nitong ipinapahayag na ang bituin ay nasa ibabaw ng lugar kung saan naroon ang bata, nang hindi nagdaragdag ng mas tiyak na lokasyon.
theological_decisions:
- issue: Kahulugan ng ἐν τῇ ἀνατολῇ sa salaysay tungkol sa bituin
  choice: sa silangan
  alternative: nang ito’y sumikat
  rationale: Maaaring tumukoy ang pariralang Griyego sa silangan bilang direksiyon o rehiyon, o sa pagsikat ng isang bituin. Hindi nilulutas ng salin ang interpretatibong usapin; ginagamit sa teksto ang pamilyar na heograpikong pagbasa at pinananatili sa talababa ang astronomikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa karaniwang mambabasa. Pinanatili ang “At narito” upang maihatid ang biglang pagtawag-pansin ng salaysay, at iniwasan ang pagdaragdag ng pangalang Herodes o anumang paliwanag tungkol sa likas na katangian ng bituin.
