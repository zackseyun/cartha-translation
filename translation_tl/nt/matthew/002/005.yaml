id: MAT.2.5
reference: Matthew 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Sa Betlehem ng Judea, sapagkat ganito ang nasusulat[a] sa pamamagitan ng propeta:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakasulat.” Ang Griyego ay gumagamit ng perpektong balintiyak, isang karaniwang pormula sa pagsipi ng Kasulatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: At … nila
  rationale: Ang pantukoy ay tumutukoy sa mga punong pari at mga tagapagturo ng Kautusan sa naunang talata. Ang “At” ay banayad na pang-ugnay na hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: εἶπαν αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Tuwirang ipinapahayag nito ang karaniwang kahulugan ng λέγω na may di-tuwirang layon.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Sa Betlehem ng Judea
  rationale: Ang “sa” ay natural para sa ἐν na tumutukoy sa lugar, at ang “ng Judea” ay nagpapanatili sa genitibong pagkakakilanlan kung aling Betlehem ang tinutukoy.
- source_word: οὕτως γὰρ
  choice: sapagkat ganito
  rationale: Ipinakikilala ng γάρ ang batayan ng sagot, habang ang οὕτως ay tumuturo sa siping kasunod.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Ang perpektong balintiyak ay karaniwang pormula sa pagsipi ng Kasulatan. Ang “nasusulat” ay natural sa marangal na biblikal na Filipino at nagpapahiwatig ng isang naisulat na pahayag na nananatiling may bisa.
- source_word: διὰ τοῦ προφήτου
  choice: sa pamamagitan ng propeta
  rationale: Pinananatili nito ang diwa ng διά na ang propeta ang tagapamagitan o kasangkapan ng pahayag, nang hindi dinaragdagan ang sinabi ng teksto.
theological_decisions:
- issue: Pormula ng pagpapahayag sa pamamagitan ng propeta
  choice: sa pamamagitan ng propeta
  alternative: ng propeta
  rationale: Pinananatili ng napiling anyo ang posibleng pagkakaiba sa pagitan ng pinagmulan ng pahayag at ng propetang ginamit upang ihatid ito, alinsunod sa διά na may genitibo.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Pinanatili ang “Betlehem” at “Judea” bilang karaniwang anyo ng mga pangalang pantangi, at gumamit ng tutuldok dahil nagpapatuloy sa susunod na talata ang sipi mula sa propeta.
