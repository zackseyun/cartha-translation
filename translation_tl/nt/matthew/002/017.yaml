    rationale: Ang “sa pamamagitan ni propeta Jeremias” ay maiintindihan, ngunit ang “sa pamamagitan ng propetang si Jeremias” ang mas likas at malinaw na modernong Tagalog para sa τοῦ προφήτου.
  - severity: low
    issue: Hindi kailangang talababa para sa λέγοντος
    rationale: Ang ibinigay na alternatibong “Jeremias, na nagsasabi” ay hindi natural sa Tagalog at maaaring magmukhang si Jeremias mismo ang kasalukuyang nagsasalita. Sapat ang tutuldok sa pangunahing teksto upang ipakilala ang direktang sipi sa susunod na talata.
