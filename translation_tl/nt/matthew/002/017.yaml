  verdict: revise
  source_fidelity: Ang “natupad,” “ang sinabi,” at “sa pamamagitan” ay tapat sa ἐπληρώθη, τὸ ῥηθέν, at διά. Ang tutuldok ay sapat na paraan sa Tagalog upang ipakilala ang siping kasunod at maipahiwatig ang tungkulin ng λέγοντος nang hindi gumagawa ng di-natural na sugnay.
  naturalness: Mas natural at malinaw sa makabagong Tagalog ang “sa pamamagitan ng propetang si Jeremias” kaysa “sa pamamagitan ni propeta Jeremias.” Ang “Nang magkagayon” ay katanggap-tanggap ngunit mas matayog at hindi gaanong karaniwan; ang “Noon” ay maikli, marangal, at angkop sa sunod-sunod na salaysay.
  terminology: Pinananatili ang “natupad,” isang mahalagang pormula ng katuparan sa Mateo, at ang karaniwang pangalan na “Jeremias.”
  issues:
