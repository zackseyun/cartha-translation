  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: tl
  text: 'Noon, natupad ang sinabi sa pamamagitan ng propetang si Jeremias:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Nang magkagayon
  rationale: Nagpapakita ito ng kasunod na pangyayari sa salaysay at natural na nag-uugnay sa naunang konteksto.
- source_word: ἐπληρώθη
  choice: natupad
  rationale: Pinananatili nito ang tahasang wika ng katuparan na katangian ng pormula ni Mateo.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Natural at tuwirang katumbas ito ng substantival participle na tumutukoy sa ipinahayag na salita.
- source_word: διὰ Ἰερεμίου
  choice: sa pamamagitan ni ... Jeremias
  rationale: Ipinakikita ng διά na si Jeremias ang tagapamagitan ng propetikong pahayag.
- source_word: τοῦ προφήτου
  choice: propeta
  rationale: Tuwirang kinikilala ang tungkulin ni Jeremias sa isang natural na pariralang Tagalog.
- source_word: λέγοντος
  choice: na nagsasabi
  rationale: Ipinakikilala nito ang siping susunod at pormal na pinananatili ang participial na ideya ng pagsasabi.
theological_decisions:
- issue: Pormula ng katuparan sa Mateo
  choice: Panatilihin ang tahasang “natupad.”
  alternative: “nangyari upang matupad” o “tinupad ang mga salita”
  rationale: Inilalarawan ni Mateo ang pangyayari bilang katuparan ng propetikong pahayag; hindi ito dapat palambutin o palawakin nang lampas sa Griyego.
- issue: Ugnayan ng λέγοντος sa pangungusap
  choice: Iugnay ang “na nagsasabi” kay Jeremias sa talababa, habang gumamit ng tutuldok sa pangunahing teksto.
  alternative: Tahasan itong isama bilang “na nagsasabi” sa pangunahing teksto.
  rationale: Sa Griyego, ang genitive participle ay gramatikal na kaugnay ni Jeremias, ngunit sa natural na Tagalog sapat na ang tutuldok upang ipakilala ang sipi. Pinananatili ng talababa ang mas pormal na anyo at ang bahagyang tensiyon ng konstruksiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Nang magkagayon” para sa maayos na daloy ng salaysay at “sa pamamagitan ni propeta Jeremias” upang mapanatili ang diwa ng propetikong pamamagitan.
