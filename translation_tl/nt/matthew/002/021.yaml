  register: Makabagong, malinaw, at marangal na salaysay. Ginamit ang “isinama” upang natural na ipahayag ang pagdadala kasama sa paglalakbay, at “ang ina nito” upang maiwasan ang kalabuan sa tinutukoy ng panghalip.
