id: MAT.2.21
reference: Matthew 2:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: tl
  text: Kaya bumangon siya, isinama ang bata at ang ina nito, at pumasok sa lupain ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Kaya
  rationale: Nag-uugnay ito sa naunang utos at nagsusulong ng salaysay, hindi nagpapahayag ng matinding pagsalungat.
- source_word: ἐγερθεὶς
  choice: bumangon siya
  rationale: Sa kontekstong ito, ang anyong participle ay ginagamit na intransitibo at tumutukoy sa pagkilos na nauna sa pagsama niya sa bata at sa ina nito.
- source_word: παρέλαβε
  choice: isinama
  rationale: Ang παραλαμβάνω dito ay nangangahulugang isama ang iba sa paglalakbay; mas natural at mas tiyak ito kaysa simpleng “kinuha.”
- source_word: τὸ παιδίον
  choice: ang bata
  rationale: Payak at likas na katumbas ng παιδίον, nang hindi nagdaragdag ng hindi tahasang espesipikong edad.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ang ina nito
  rationale: Malinaw na ipinakikitang ang αὐτοῦ ay tumutukoy sa bata, habang pinananatili ang bata bilang sentro ng parirala.
- source_word: εἰσῆλθεν
  choice: pumasok
  rationale: Natural na Tagalog para sa pagpasok o pagpunta sa loob ng isang lupain.
- source_word: εἰς γῆν Ἰσραήλ
  choice: sa lupain ng Israel
  rationale: Pinananatili ang heograpiko at pambansang diwa ng pariralang Griyego.
