id: MAT.2.20
reference: Matthew 2:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: tl
  text: na nagsasabi, “Bumangon ka, isama mo ang bata at ang kanyang ina, at pumunta ka sa lupain ng Israel, sapagkat patay na ang mga naghahangad na kitlin ang buhay ng bata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: na nagsasabi
  rationale: Pinananatili ang participial na kaugnayan nito sa naunang talata, yamang bahagi ito ng pangungusap na nagsimula roon.
- source_word: Ἐγερθεὶς
  choice: Bumangon ka
  rationale: Ang aorist participle ay ginagamit dito bilang utos na kasunod ng isa pang utos; natural itong ipinahahayag sa Filipino bilang “Bumangon ka.”
- source_word: παράλαβε
  choice: isama mo
  rationale: Sa konteksto, ang παραλαμβάνω ay nangangahulugang dalhin o isama ang isang tao sa paglalakbay; mas malinaw at natural ang “isama mo” kaysa sa payak na “kunin mo.”
- source_word: τὸ παιδίον
  choice: ang bata
  rationale: Tumpak at karaniwang katumbas ng παιδίον nang hindi nagdaragdag ng di-tiyak na edad.
- source_word: τὴν μητέρα αὐτοῦ
  choice: ang kanyang ina
  rationale: Likas na isinasalin ang panghalip na tumutukoy sa bata bilang “kanyang ina.”
- source_word: πορεύου
  choice: pumunta ka
  rationale: Tuwirang ipinahahayag ang utos na maglakbay patungo sa tinukoy na lugar.
- source_word: εἰς γῆν Ἰσραήλ
  choice: sa lupain ng Israel
  rationale: Pinananatili ang heograpikong diwa ng γῆ at ang anyong genitibo ng Israel.
- source_word: τεθνήκασιν
  choice: patay na
  rationale: Ipinahahayag ng perfect tense ang kasalukuyang kalagayang bunga ng pagkamatay; natural itong nahuhuli ng “patay na.”
- source_word: οἱ ζητοῦντες
  choice: ang mga naghahangad
  rationale: Pinananatili ang patuloy na layunin ng substantival participle nang hindi nililimitahan sa simpleng paghahanap ng kinaroroonan.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: na kitlin ang buhay ng bata
  rationale: Sa idyomang ito at sa konteksto ng mortal na banta, ang ψυχή ay “buhay”; ang pandiwang “kitlin” ay nililinaw ang layuning patayin na likas sa pariralang Griyego.
theological_decisions:
- issue: Kahulugan ng ψυχή sa konteksto ng banta sa buhay
  choice: buhay
  alternative: kaluluwa
  rationale: Ang pariralang “hanapin/hangarin ang ψυχή” ay tumutukoy rito sa pagtatangkang patayin ang bata. Ang “kaluluwa” ay magpapasok ng teolohikal na diwang hindi hinihingi ng konteksto.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ang bersikulo ay syntactically nakaugnay sa naunang talata sa pamamagitan ng “na nagsasabi.” Ginamit ang “isama mo” at “kitlin ang buhay” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang diwa ng Griyego.
