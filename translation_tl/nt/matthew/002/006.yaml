reference: Matthew 2:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: tl
  text: 'At ikaw, Bethlehem, lupain ng Juda,

    hinding-hindi ikaw ang pinakamababa sa mga pinuno ng Juda;

    sapagkat mula sa iyo ay lalabas[a] ang isang pinuno

    na magpapastol[b] sa aking bayang Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magmumula”; mas literal, “lalabas.”
    reason: lexical_alternative
  - marker: b
    text: Ang “magpapastol” ay maaari ring magtaglay ng diwang “mamumuno,” kaya pinagsasama nito ang larawan ng maharlikang pamumuno at pag-aaruga ng pastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: lupain
  rationale: Sa pariralang tumutukoy sa Bethlehem kaugnay ng Juda, heograpikong sakop ang diwa, hindi lupa bilang materyal.
- source_word: οὐδαμῶς
  choice: hinding-hindi
  rationale: Natural at mariing pagtanggi ito sa modernong Tagalog, katumbas ng malakas na diin ng Griyego.
- source_word: ἐλαχίστη
  choice: pinakamababa
  rationale: Tumutukoy ito sa katayuan o kahalagahan, hindi lamang sa pisikal na laki.
- source_word: ἡγεμόσιν
  choice: mga pinuno
  rationale: Pinananatili nito ang malawak na diwa ng mga namumuno nang hindi nililimitahan sa isang tiyak na katungkulang pampolitika.
- source_word: ἐξελεύσεται
  choice: lalabas
  rationale: Tuwirang pinananatili ang larawan ng paglabas o paglitaw mula sa Bethlehem; inilalahad sa talababa ang natural na alternatibong 'magmumula.'
- source_word: ἡγούμενος
  choice: isang pinuno
  rationale: Ipinahahayag ng substantibong participle ang tungkulin ng darating na tao bilang namumuno.
- source_word: ποιμανεῖ
  choice: magpapastol
  rationale: Pinananatili ang metaporang pastoral ng ποιμαίνω at hindi ito pinapantay lamang sa 'mamumuno.'
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: aking bayang Israel
  rationale: Natural na salin ito ng tipanang parirala at malinaw na ipinakikilalang Israel ang bayan ng Diyos.
theological_decisions:
- issue: Maharlikang pamumuno at pastoral na pag-aaruga sa paglalarawan sa darating na tao
  choice: Isinalin ang ἡγούμενος bilang 'isang pinuno' at ang ποιμανεῖ bilang 'magpapastol.'
  alternative: Gawing purong pampolitika ang dalawang salita ('lider' at 'mamumuno') o gawing kapwa pastoral.
  rationale: Magkasamang nasa talata ang pamamahala at pagpapastol. Pinananatili ng salin ang dalawang larawang ito nang hindi pinapawi ang kanilang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'hinding-hindi' upang natural na maipahayag ang mariing pagtanggi, at pinanatili ang magkatambal na larawang 'pinuno' at 'magpapastol.'
