  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: tl
  text: Nang makita nila ang bituin, nagalak sila nang labis na labis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “nagalak sila ng malaking galak nang labis,” isang napakadiing pagpapahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita nila
  rationale: Ang aorist participle ay temporal na kaugnay ng pangunahing pandiwa. Likas sa modernong Tagalog ang “Nang makita nila” at malinaw na ipinapakitang ang pagkakita ang nagbunsod sa kasunod na pagkagalak.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi matinding pagsalungat. Sa Tagalog, sapat na ang temporal na pambungad na “Nang” upang maging natural ang daloy nang hindi nagdaragdag ng mabigat na pang-ugnay.
- source_word: τὸν ἀστέρα
  choice: ang bituin
  rationale: Tumutukoy ito sa tiyak na bituing nauna nang binanggit; likas na ipinahihiwatig ng “ang” ang pagiging tiyak nito.
- source_word: ἐχάρησαν
  choice: nagalak sila
  rationale: Bagaman anyong aorist passive/deponent, aktibo ang kahulugan. Pinananatili ng “nagalak” ang pandiwang puwersa at marangal na tono.
- source_word: χαρὰν μεγάλην
  choice: nang labis
  rationale: Ang cognate accusative ay nagpapatingkad sa pandiwang “nagalak.” Sa halip na di-likas na literal na pag-uulit ng “galak,” ginamit ang pang-abay na anyo.
- source_word: σφόδρα
  choice: na labis
  rationale: Lalo pa nitong pinatitindi ang buong pahayag. Ang pinagsamang “labis na labis” ay natural na Tagalog at pinananatili ang mariing tindi ng Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ang “labis na labis” ay piniling tumbas sa pinagsamang diin ng cognate accusative at σφόδρα, samantalang inilalagay sa talababa ang mas literal na anyo.
