  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: tl
  text: At matapos silang balaan[a] sa panaginip na huwag nang bumalik kay Herodes, umuwi sila sa sarili nilang bayan sa ibang daan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matapos silang bigyan ng babala mula sa Diyos.” Ipinahihiwatig ng pasibong pandiwa sa Griyego na mula sa Diyos ang babala, bagaman hindi tahasang binanggit ang Diyos sa talata.
    reason: lexical_alternative
  - marker: b
    text: O “sa ibang ruta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: matapos silang balaan
  rationale: Ang pasibong pandiwari ay nagpapahiwatig na tumanggap sila ng babala, na sa konteksto ay mula sa Diyos, ngunit hindi tahasang pinapangalanan sa talata ang gumawa nito.
- source_word: κατ’ ὄναρ
  choice: sa isang panaginip
  rationale: Natural at malinaw itong katumbas ng idyomatikong Griyegong parirala para sa pahayag na natanggap sa panaginip.
- source_word: μὴ ἀνακάμψαι
  choice: huwag nang bumalik
  rationale: Ipinapahayag ng μή at pawatas ang nilalaman ng babala; ang “nang” ay likas sa Filipino at angkop dahil nakapunta na sila kay Herodes.
- source_word: πρὸς Ἡρῴδην
  choice: kay Herodes
  rationale: Ang πρός na may akusatibo ay tumutukoy sa pagbabalik patungo sa isang tao; “kay Herodes” ang natural na anyo sa Filipino.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: sa ibang daan
  rationale: Ang ὁδός ay literal na daan o ruta rito. Pinananatili ng “ibang daan” ang kongkretong larawan at natural itong pakinggan sa Filipino.
- source_word: ἀνεχώρησαν
  choice: umuwi sila
  rationale: Bagaman maaari itong mangahulugang umalis o lumayo, nililinaw ng kasunod na patutunguhan na bumalik sila sa sariling bayan; “umuwi” ang natural na salaysay sa Filipino.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: sa sarili nilang bayan
  rationale: Ang χώρα ay maaaring bayan, lupain, o rehiyon. Sa konteksto ng kanilang pagbabalik, malinaw at likas ang “sarili nilang bayan.”
theological_decisions:
- issue: Hindi tahasang pinangalanang banal na pinagmulan ng babala
  choice: Pasibong “matapos silang balaan,” nang hindi idinaragdag ang “ng Diyos” sa pangunahing teksto.
  alternative: “matapos silang bigyan ng babala ng Diyos” o “matapos silang balaan mula sa Diyos”
  rationale: Malakas na ipinahihiwatig ng χρηματισθέντες at ng konteksto ang banal na pinagmulan, ngunit hindi tahasang binabanggit ang Diyos sa mismong talata. Pinananatili ng salin ang pahiwatig nang hindi nagdaragdag ng lantad na tagaganap.
translation_notes:
  register: Makabagong Filipino na malinaw, natural, at marangal. Ginamit ang “umuwi” upang likas na ipahayag ang pagbalik sa sariling bayan, habang ang mga talababa ay nagpapanatili sa ipinahihiwatig na banal na pinagmulan ng babala at sa alternatibong kahulugan ng ὁδός.
