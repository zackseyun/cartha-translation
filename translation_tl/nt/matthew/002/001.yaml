id: MAT.2.1
reference: Matthew 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: tl
  text: Matapos ipanganak si Jesus sa Betlehem ng Judea noong panahon ni Haring Herodes, narito, dumating sa Jerusalem ang mga pantas[a] mula sa silangan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga mago.” Ang salitang Griyego ay tumutukoy sa mga pantas mula sa silangan, na maaaring kaugnay ng astrolohiya o karunungan sa korte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Matapos ipanganak si Jesus
  rationale: Ang genitive absolute ay nagbibigay ng pangyayaring nauna at nagsisilbing kaligiran ng pangunahing kilos. Likas sa modernong Tagalog ang “Matapos ipanganak si Jesus,” at hindi na kailangang tumbasan nang hiwalay ang mahinang panandang pasalaysay na δέ.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betlehem ng Judea
  rationale: Karaniwang anyong Tagalog ang “Betlehem,” at pinananatili ng “ng Judea” ang panandang heograpikal na nagtatangi sa bayang ito.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: noong panahon ni Haring Herodes
  rationale: Ito ang natural at dignified na katumbas ng idyomang naglalagay sa salaysay sa isang tiyak na panahon. Malinaw rin nitong ipinapahayag ang titulo ni Herodes nang hindi nagiging lipas ang himig.
- source_word: ἰδοὺ
  choice: narito
  rationale: Ang ἰδού ay panandang pantukoy-pansin. Pinananatili ng “narito” ang kapansin-pansing puwersa nito, sa halip na tuluyang alisin sa salin.
- source_word: μάγοι
  choice: mga pantas
  rationale: Nauunawaan ito ng karaniwang mambabasa bilang mga taong may natatanging karunungan. Hindi nito ipinapalagay na sila ay mga hari o na tiyak ang kanilang bilang; inilalahad sa talababa ang mas teknikal na katawagan at kaugnay na konteksto.
- source_word: ἀπὸ ἀνατολῶν
  choice: mula sa silangan
  rationale: Bagaman maramihan ang anyong Griyego, ang kolektibong “mula sa silangan” ang likas na pahayag sa Tagalog at pinananatili ang heograpikal na di-tiyak na kahulugan.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: dumating sa Jerusalem
  rationale: Tiyak na ipinahahayag ng pandiwa ang pagdating, at natural sa Tagalog ang hulma na “dumating sa” kasunod ang patutunguhan.
theological_decisions:
- issue: Pagsasalin sa μάγοι nang hindi nagdaragdag ng tradisyon sa teksto
  choice: mga pantas
  alternative: mga mago
  rationale: Tumutukoy ang salita sa mga edukadong tao mula sa silangan na maaaring kaugnay ng astrolohiya o karunungan sa korte. Hindi sila tinatawag ng teksto na mga hari, at hindi rin sinasabi rito ang kanilang bilang. Pinananatili sa talababa ang mas teknikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “narito” upang mapanatili ang pantawag-pansing puwersa ng ἰδού. Inilagay ang pananda ng talababa pagkatapos ng “mga pantas,” ang mismong salitang nililinaw nito. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
