base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: tl
  text: May apat na libong lalaking kumain, bukod pa sa mga babae at mga bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Ang mga kumain
  rationale: Ang artikulo at participle ay likas na isinalin bilang pangkat na ‘ang mga kumain.’ Hindi kailangang tahasang katawanin ang mahinang pang-ugnay na δέ sa Tagalog, at ipinahihiwatig ng konteksto na natapos na ang pagkain.
- source_word: ἦσαν τετρακισχίλιοι
  choice: ay apat na libo
  rationale: Pinananatili ang payak na konstruksiyong kopula at ang tiyak na bilang.
- source_word: ἄνδρες
  choice: lalaki
  rationale: Tumutukoy ang ἀνήρ sa mga lalaki, hindi sa mga tao sa pangkalahatan; mahalaga ang pagkakaibang ito dahil hiwalay na binanggit ang mga babae at mga bata.
- source_word: χωρὶς
  choice: bukod pa sa
  rationale: Sa pormulang ito ng pagbibilang, ipinakikita ng χωρίς na hindi kabilang sa apat na libo ang kasunod na mga pangkat. Likas sa modernong Tagalog ang ‘bukod pa sa’ at malinaw na dagdag sila sa bilang.
- source_word: γυναικῶν καὶ παιδίων
  choice: mga babae at mga bata
  rationale: Ang pangkalahatang kahulugang ‘mga babae’ ay hindi nagpapalagay na mga asawa lamang sila; sapat ang ‘mga bata’ para sa παιδίων nang hindi labis na nililimitahan ang edad.
theological_decisions:
- issue: Pormula ng pagbibilang ayon sa kasarian
  choice: Panatilihin ang ‘lalaki’ at hiwalay na banggitin ang mga babae at mga bata.
  alternative: Gamitin ang ‘tao’ bilang mas inklusibong katawagan.
  rationale: Tiyak na ‘mga lalaki’ ang ἄνδρες, samantalang hiwalay na tinutukoy ng Griyego ang mga babae at mga bata. Mabubura ng ‘tao’ ang pagkakaibang nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak at natural na ‘Ang mga kumain’ at ang idyomatikong ‘bukod pa sa.’ Walang footnote dahil malinaw na naipapahayag sa pangunahing teksto ang diwa ng χωρίς.
