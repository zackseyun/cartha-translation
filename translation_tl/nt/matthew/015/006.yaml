  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: tl
  text: tiyak na hindi na niya kailangang parangalan ang kanyang ama.[a] At pinawalang-bisa ninyo ang salita ng Diyos dahil sa inyong tradisyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “parangalan” dito ay malamang na kabilang ang praktikal na tungkuling tustusan at alagaan ang sariling mga magulang, hindi lamang ang pagpapakita ng paggalang.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “utos ng Diyos” ang mababasa sa halip na “salita ng Diyos.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ
  choice: tiyak na hindi na niya kailangang
  rationale: Ang mariing pagtangging οὐ μή, sa kontekstong ito, ay nagpapahayag na inaalis ng tradisyunal na pasiya ang obligasyon; pinananatili ng “tiyak” ang diin.
- source_word: τιμήσει
  choice: parangalan
  rationale: Pinananatili nito ang tuwirang kahulugan ng τιμάω at ang ugnay nito sa utos tungkol sa mga magulang, habang hindi nililimitahan ang diwa sa paggalang lamang.
- source_word: πατέρα αὐτοῦ
  choice: ang kanyang ama
  rationale: Isahan at ama lamang ang tahasang nasa tekstong Griyego; hindi ito pinalawak upang isama ang ina.
- source_word: ἠκυρώσατε
  choice: pinawalang-bisa ninyo
  rationale: 'Malinaw na ipinahahayag ang malakas na diwa ng ἀκυρόω: gawing walang bisa o bisaing wala.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Direktang sinusunod ang λόγον sa SBLGNT; ang mahalagang baryanteng “utos” ay inilagay sa talababa.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: dahil sa inyong tradisyon
  rationale: Ang διά na may akusatibo ay likas na nagsasaad ng sanhi o dahilan; natural ito sa modernong Filipino.
theological_decisions:
- issue: Kung tahasang sasabihing kasama sa “parangalan” ang materyal na pagtustos sa magulang
  choice: Panatilihin ang “parangalan” sa pangunahing teksto at ipaliwanag ang praktikal na saklaw sa talababa.
  alternative: Isaling “tustusan” o “alagaan.”
  rationale: Ang pagtatalo ay may kinalaman sa materyal na tungkulin, ngunit τιμάω ang ginamit, hindi isang mas makitid na pandiwa para sa pagtustos.
- issue: Kung iaayon ang talata sa kalapit na konteksto o sa mga baryante
  choice: Isalin ang isahang “kanyang ama” at ang “salita ng Diyos” ayon sa nakalimbag na tekstong Griyego.
  alternative: Palawakin bilang “ama o ina” at/o gamitin ang “utos ng Diyos.”
  rationale: Iniiwasan ang harmonisasyon; ang mahalagang tekstuwal na baryante ay pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hindi na niya kailangang” upang likas na maipahayag ang pag-aalis ng obligasyon sa konteksto, at “pinawalang-bisa” para sa matinding paratang ng talata. Inilagay ang bawat panandang talababa kaagad sa kaugnay na parirala.
