id: MAT.15.32
reference: Matthew 15:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: tl
  text: At tinawag ni Jesus ang kanyang mga alagad palapit sa kanya at sinabi, “Nahahabag ako sa karamihan, sapagkat tatlong araw na silang nananatili sa piling ko at wala silang makain. Ayokong paalisin sila nang walang pagkain[a], dahil baka manghina sila sa daan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “na gutom” o “nang hindi nakakakain.” Ang salitang Griyego ay literal na tumutukoy sa pagiging walang pagkain o nag-aayuno; dito, hindi ito nangangahulugang nagsasagawa sila ng panrelihiyong pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag ... upang lumapit sa kanya
  rationale: 'Ipinahahayag nito ang direksiyonal na diwa ng middle participle: tinawag ni Jesus ang mga alagad papunta sa kanyang kinaroroonan.'
- source_word: Σπλαγχνίζομαι
  choice: Nahahabag ako
  rationale: Likas at marangal na modernong Tagalog ito para sa matinding pagkahabag na ipinahahayag ng pandiwa.
- source_word: ὄχλον
  choice: mga tao
  rationale: Sa kontekstong pasalaysay, natural itong tumutukoy sa nagkakatipong karamihan nang hindi gumagamit ng mabigat na salitang “pulutong.”
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: tatlong araw na silang nananatili sa piling ko
  rationale: Pinananatili nito ang diwa ng patuloy na pananatiling kasama ni Jesus at likas ang ayos na “tatlong araw na” sa Tagalog.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: wala silang makain
  rationale: Ito ang tuwiran at idiomatikong katumbas sa Tagalog ng kawalan nila ng pagkain.
- source_word: ἀπολῦσαι
  choice: pauwiin
  rationale: Sa konteksto, ang pagpapayaon sa nagkakatipong mga tao ay natural na ipinahahayag bilang pagpapauwi, bagaman hindi tahasang binabanggit sa Griyego ang tahanan.
- source_word: νήστεις
  choice: nang walang kain
  rationale: Mas malapit ito sa literal na “walang pagkain/di nakakain” kaysa “gutom,” at hindi nito ipinahihiwatig ang kusang pag-aayuno bilang gawaing panrelihiyon.
- source_word: μήποτε
  choice: dahil baka
  rationale: Natural na ipinahahayag nito sa Tagalog ang kinatatakutang maaaring mangyari.
- source_word: ἐκλυθῶσιν
  choice: manghina
  rationale: Saklaw nito ang pagkaubos ng lakas o panlalata sa paglalakbay nang hindi labis na tinutukoy na tiyak silang babagsak o mahihimatay.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Karaniwan at malinaw na katumbas ito ng pangyayari habang sila ay naglalakbay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mga tao” para sa nagkakatipong karamihan at “sa piling ko” upang malinaw na maipahayag ang patuloy nilang pananatili kay Jesus. Iniwasan ang arkayko o labis na teknikal na pananalita.
