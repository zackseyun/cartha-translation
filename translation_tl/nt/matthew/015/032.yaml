revisions:
- from: Pagkatapos, tinawag ni Jesus ang kanyang mga alagad upang lumapit sa kanya at sinabi, “Nahahabag ako sa mga tao, sapagkat tatlong araw na silang nananatili sa piling ko at wala silang makain. Ayaw ko silang pauwiin nang walang kain[a], dahil baka manghina sila sa daan.”
  to: At tinawag ni Jesus ang kanyang mga alagad palapit sa kanya at sinabi, “Nahahabag ako sa karamihan, sapagkat tatlong araw na silang nananatili sa piling ko at wala silang makain. Ayokong paalisin sila nang walang pagkain[a], dahil baka manghina sila sa daan.”
  rationale: Pinalitan ang “pauwiin” ng “paalisin” upang hindi magdagdag ng destinasyong wala sa pinagmulan. Inayos din ang pariralang “nang walang kain” bilang “nang walang pagkain” para sa likas at malinaw na modernong Filipino, kasama ang katugmang pagwawasto sa talababa.
