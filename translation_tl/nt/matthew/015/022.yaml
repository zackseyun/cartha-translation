id: MAT.15.22
reference: Matthew 15:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: tl
  text: At narito, isang babaeng Cananea mula sa mga lupaing iyon ang lumabas at patuloy na sumisigaw, “Maawa ka sa akin, Panginoon, Anak ni David! Ang anak kong babae ay lubhang sinasapian ng demonyo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matinding pinahihirapan ng demonyo” o “dumaranas ng matinding paniniil ng demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing puwersa at kasiglahan ng salaysay nang hindi nagiging lubhang makaluma sa makabagong Filipino.
- source_word: Χαναναία
  choice: Cananea
  rationale: Tuwirang pinananatili ang katawagan ni Mateo at ang kaugnayan nito sa kasaysayan ng Israel; hindi ipinalit ang “Sirofenicia,” na nasa kaugnay na salaysay ni Marcos.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: mula sa mga lupaing iyon
  rationale: Ang ὅρια ay tumutukoy dito sa mga nasasakupan o rehiyon. Pinananatili ng “mga lupaing iyon” ang anyong maramihan sa natural na Filipino.
- source_word: ἐξελθοῦσα
  choice: ang lumabas
  rationale: Isinalin ang aorist participle bilang likas na pandiwang Filipino na nauuna sa patuloy na pagsigaw ng babae.
- source_word: ἔκραζεν
  choice: patuloy na sumisigaw
  rationale: Ipinahahayag ang aspektong nagpapatuloy o paulit-ulit ng imperfect sa halip na gawing minsanang sigaw lamang.
- source_word: Ἐλέησόν με
  choice: Maawa ka sa akin
  rationale: Natural at tuwirang pakiusap ito na pinananatili ang bokabularyo ng awa at ang matinding pangangailangan ng nagsasalita.
- source_word: κύριε
  choice: Panginoon
  rationale: Sa pagkakaugnay nito sa titulong “Anak ni David,” pinananatili ang marangal at posibleng mesianikong bigat, bagaman hindi ipinipilit ang higit sa sinasabi ng konteksto.
- source_word: υἱὸς Δαυίδ
  choice: Anak ni David
  rationale: Literal na pinananatili ang kinikilalang titulong mesianiko at ang maharlikang kaugnayan kay David.
- source_word: κακῶς
  choice: lubha
  rationale: Malinaw at natural na ipinahahayag ang tindi ng kalagayan ng anak nang hindi gumagamit ng masyadong klinikal na pananalita.
- source_word: δαιμονίζεται
  choice: sinasapian ng demonyo
  rationale: Ito ang maikli at karaniwang salin sa Filipino para sa kalagayang iniuugnay ng pandiwa sa kapangyarihan ng demonyo; inilalahad sa talababa ang mga saling hindi gaanong tiyak tungkol sa pagsapi.
theological_decisions:
- issue: Kahulugan ng κύριε sa isang mesianikong pagtawag
  choice: Panginoon
  alternative: ginoo / amo
  rationale: Dahil kasunod nito ang “Anak ni David,” malamang na higit ito sa karaniwang magalang na pagtawag. Gayunman, hindi dinaragdagan ng salin ang antas ng pagkilalang teolohikal na tahasang ipinahahayag ng babae.
- issue: Saklaw ng kahulugan ng δαιμονίζεται
  choice: sinasapian ng demonyo
  alternative: matinding pinahihirapan ng demonyo / dumaranas ng matinding paniniil ng demonyo
  rationale: Tiyak sa teksto ang pagkilos ng demonyo ngunit hindi nito detalyadong inilalarawan ang eksaktong anyo ng kalagayan. Ginamit sa teksto ang nakaugaliang maikling salin at pinanatili sa talababa ang mga leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang markadong “narito” upang madama ang pantawag-pansing ἰδοὺ, samantalang ang natitirang pangungusap ay likas sa karaniwang pagbasa. Ginamit ang tuwirang isahang “ka” sa pakiusap, ayon sa gramatika ng pinagmulan, nang walang pagdaragdag ng “po” na wala sa Griyego.
