  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: tl
  text: At matapos niyang utusan ang mga tao na maupo sa lupa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humilig sa lupa.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpuwesto para kumain, na kadalasa’y nakahilig.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay na nagpapatuloy sa salaysay.
- source_word: παραγγείλας
  choice: matapos niyang utusan
  rationale: Ang aorist participle ay tumutukoy sa naunang kilos ni Jesus bago ang pangunahing kilos sa kasunod na talata. Pinananatili ng “utusan” ang malinaw na puwersa ng tagubilin.
- source_word: τῷ ὄχλῳ
  choice: ang mga tao
  rationale: Natural sa makabagong Tagalog bilang pagtukoy sa nagkakatipong karamihan, nang hindi gumagamit ng mas mabigat na “karamihan” sa pangungusap na ito.
- source_word: ἀναπεσεῖν
  choice: na maupo
  rationale: Sa konteksto ng pagkain, tumutukoy ito sa pagpuwesto upang kumain, na maaaring nakaupo o nakahilig. “Maupo” ang pinakanatural sa Tagalog, habang inilalahad sa talababa ang mas tiyak na sinaunang postura.
- source_word: ἐπὶ τὴν γῆν
  choice: sa lupa
  rationale: Dito, ang γῆ ay ang ibabaw ng lupang pinuwestuhan ng mga tao, hindi ang daigdig sa pangkalahatan.
