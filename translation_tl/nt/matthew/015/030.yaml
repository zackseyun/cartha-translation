id: MAT.15.30
reference: Matthew 15:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: tl
  text: At lumapit sa kanya ang napakaraming tao, dala ang mga hindi makapagsalita[a], mga bulag, mga pilay, mga may kapansanan sa mga biyas[b], at marami pang iba. Inilapag nila ang mga taong ito sa paanan niya, at pinagaling niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hindi makarinig.” Ang salitang Griego na κωφούς ay maaaring tumukoy sa mga taong bingi, pipi, o kapuwa hindi makarinig at hindi makapagsalita, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga may pinsala o deformidad sa mga biyas.” Malawak ang saklaw ng salitang Griego na κυλλούς at maaaring tumukoy sa kapansanan sa kamay, braso, paa, o binti.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: lumapit
  rationale: Likas at tuwirang salin ng paglapit kay Jesus sa daloy ng salaysay.
- source_word: ὄχλοι πολλοί
  choice: napakaraming tao
  rationale: Natural sa modernong Filipino at malinaw na nagpapahayag ng malaking bilang ng mga taong nagkatipon, bagaman hindi nito ginagaya nang mekanikal ang pangmaramihang anyo ng ὄχλοι.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: na kasama nila
  rationale: Pinananatili ang literal na diwang 'may kasama sila' nang hindi ipinapalagay nang higit sa teksto ang paraan ng pagdadala.
- source_word: κωφούς
  choice: mga hindi makapagsalita
  rationale: Maaaring tumukoy ang κωφός sa hindi makarinig, hindi makapagsalita, o kapuwa; ang pangunahing salin ay angkop sa konteksto, at inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: τυφλούς
  choice: mga bulag
  rationale: Karaniwan, malinaw, at eksaktong katumbas ng τυφλούς.
- source_word: χωλούς
  choice: mga pilay
  rationale: Maikli at pamilyar na salin para sa mga may kapansanan sa paglakad.
- source_word: κυλλούς
  choice: mga may kapansanan sa mga kamay o paa
  rationale: Iniiwasan ang mapanlait o sobrang makitid na katawagan at ipinahahayag ang malawak na saklaw ng salitang tumutukoy sa may depekto, pinsala, o kapansanan sa mga biyas.
- source_word: ἑτέρους πολλούς
  choice: marami pang iba
  rationale: Natural na Filipino na tumutukoy sa iba pang mga taong hindi isa-isang binanggit.
- source_word: ἔρριψαν
  choice: inilagay
  rationale: Bagaman maaaring literal na 'inihagis,' sa konteksto ay tumutukoy ito sa paglalagay sa mga maysakit sa harap ni Jesus; hindi ipinahihiwatig ng salin ang kalupitang hindi hinihingi ng teksto.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: sa paanan niya
  rationale: Natural at marangal na idyomang Filipino para sa lokasyong nasa tabi o harap ng kanyang mga paa.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Karaniwang salin sa mga salaysay ng pagpapagaling at malinaw na tumutukoy sa ginawa ni Jesus.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang person-first phrasing sa κυλλούς upang maiwasan ang mapanlait na dating habang pinananatili ang kahulugan. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
