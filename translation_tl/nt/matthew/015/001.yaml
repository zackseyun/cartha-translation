  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: tl
  text: Pagkatapos, lumapit kay Jesus ang mga Pariseo at mga eskriba[a] mula sa Jerusalem at nagsabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga eskriba” ay maaari ding isaling “mga dalubhasa sa Kautusan” o “mga guro ng Kautusan” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa makabagong Tagalog at malinaw na nag-uugnay sa susunod na pangyayari.
- source_word: προσέρχονται
  choice: lumapit
  rationale: Tumpak na ipinapahayag ang paglapit kay Jesus. Ginamit ang karaniwang nagdaang panahunan sa Tagalog sapagkat hindi likas dito ang pagpapanatili ng Griyegong historical present sa salaysay.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Ang datibo ay tumutukoy sa taong nilapitan; likas itong ipinahahayag sa Tagalog sa pamamagitan ng “kay.”
- source_word: ἀπὸ Ἱεροσολύμων
  choice: na mula sa Jerusalem
  rationale: Pinananatili ang kahulugan ng pinagmulan nang hindi ipinahihiwatig na opisyal silang isinugo.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang katawagang Tagalog para sa makasaysayang pangkat na ito.
- source_word: γραμματεῖς
  choice: mga eskriba
  rationale: Pinananatili ang tradisyonal at pormal na katawagan habang nililinaw sa talababa ang tungkulin nila bilang mga dalubhasa o guro sa Kautusan.
- source_word: καὶ
  choice: at
  rationale: Payak na pag-uugnay sa dalawang pangkat.
- source_word: λέγοντες
  choice: Sinabi nila,
  rationale: Likas na pambungad sa tuwirang pananalitang susunod sa kasunod na talata; ginawang hiwalay na sugnay upang maging malinaw at natural sa Tagalog.
theological_decisions:
- issue: Historical present sa salaysay
  choice: 'Isinalin sa nagdaang panahunan: “lumapit” at “Sinabi nila”'
  alternative: 'Panatilihin ang pangkasalukuyang anyo: “lumalapit” at “sinasabi”'
  rationale: Karaniwang ginagamit ng Griyego ang historical present upang pasiglahin ang salaysay, ngunit magiging pilit o magbabago ang aspektuwal na dating sa Tagalog. Ang nagdaang panahunan ang likas na salaysay at hindi binabago ang pangyayaring tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang katawagang “mga eskriba,” ngunit nilagyan ng talababa para sa mas madaling maunawaang mga katumbas. Inayos ang ayos ng pangungusap upang malinaw na kapuwa mula sa Jerusalem ang mga Pariseo at mga eskriba.
