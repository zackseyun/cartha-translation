  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: tl
  text: Ang mga ito ang nagpaparumi sa tao,[a] ngunit ang kumain nang hindi naghugas ng mga kamay ay hindi nagpaparumi sa tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginagawang marumi ang tao.” Sa Griyego, maaaring tumukoy ang pandiwa sa pagpaparumi sa isang tao ayon sa ritwal; dito, saklaw ng “nagpaparumi” kapwa ang usapin ng ritwal na kalinisan at ang mas malawak na diwa ng karumihan sa turo ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: nagpaparumi / nagpaparumi
  rationale: Sa konteksto ng ritwal na kalinisan, ang κοινόω ay tumutukoy sa pagpaparumi o paggawa sa isang tao na marumi. Likas sa modernong Tagalog ang “nagpaparumi,” at naipahihiwatig nito kapwa ang ritwal na karumihan at ang mas malawak na moral na kabuluhan ng turo ni Jesus.
- source_word: ἄνθρωπον
  choice: sa tao
  rationale: Ang isahang ἄνθρωπον ay ginagamit bilang pangkalahatang katawagan sa sinumang tao. Pinananatili ng “sa tao” ang isahan at ang pangkalahatang diwa nang hindi nagdaragdag ng kasariang hindi kailangang ipahayag sa Tagalog.
- source_word: ἀνίπτοις χερσὶν
  choice: nang hindi naghuhugas ng mga kamay
  rationale: Ito ang natural at malinaw na paraan sa Tagalog upang tukuyin ang pagkain na hindi muna hinuhugasan ang mga kamay, ayon sa usapin ng paghuhugas sa konteksto.
- source_word: φαγεῖν
  choice: ang pagkain
  rationale: Ang infinitive na φαγεῖν ay natural na naisasalin bilang pandiwang pangngalan na “ang pagkain” sa kayariang Tagalog na ito.
- source_word: ταῦτά ἐστιν τὰ
  choice: Ang mga bagay na ito ang
  rationale: Pinananatili ng parirala ang diin sa demonstratibong ταῦτα at malinaw na inuugnay ang mga naunang binanggit sa mga bagay na nagpaparumi.
- source_word: δέ
  choice: ngunit
  rationale: Malinaw na ipinakikita ng “ngunit” ang pagsalungat sa pagitan ng tunay na nagpaparumi at ng pagkain nang hindi naghuhugas ng mga kamay.
theological_decisions:
- issue: Kahulugan ng κοινόω sa pagtatalo tungkol sa ritwal na kalinisan
  choice: Isinalin bilang “nagpaparumi.”
  alternative: “ginagawang marumi” o “ginagawang di-malinis”
  rationale: Ang “nagpaparumi” ay sapat na malawak upang mapanatili kapwa ang ritwal na konteksto at ang moral na puwersa ng sinabi ni Jesus, nang hindi nililimitahan ang kahulugan sa seremonyal na karumihan lamang.
- issue: Pangkalahatang isahang ἄνθρωπον
  choice: Isinalin bilang “sa tao.”
  alternative: “sa isang tao” o “sa mga tao”
  rationale: Ang “sa tao” ay idiomatikong pangkalahatan sa Tagalog at pinananatili ang isahang anyo ng Griyego; hindi ito ginawang maramihan o nilagyan ng di-kinakailangang pagtukoy sa kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “nang hindi naghuhugas ng mga kamay” kaysa sa mas literal ngunit di-gaanong likas na “na may mga kamay na hindi nahugasan.”
