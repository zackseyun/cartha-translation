id: MAT.15.3
reference: Matthew 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Bakit nilalabag din ninyo ang utos ng Diyos dahil sa tradisyon ninyo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “alang-alang sa tradisyon ninyo.”
    reason: Pinananatili ang posibleng alternatibong diin ng διὰ na ang tradisyon ang pinapaboran o ipinagsasanggalang, hindi lamang ang sanhi ng paglabag.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ngunit sumagot siya sa kanila
  rationale: Ang participle at finite verb na ἀποκριθεὶς εἶπεν ay karaniwang pormulang Griyego na may impluwensiyang Semitiko. Likas sa modernong Tagalog ang payak na “sumagot siya”; ang “Ngunit” ay nagpapakita ng tugon at pagsalungat na dala ng δέ nang hindi gumagamit ng mabigat at paulit-ulit na “sumagot at sinabi.”
- source_word: Διὰ τί
  choice: Bakit
  rationale: Ito ang likas at tuwirang tanong sa Tagalog tungkol sa dahilan.
- source_word: καὶ ὑμεῖς
  choice: din ninyo
  rationale: 'Pinananatili ng “din” ang diwa ng “kayo rin”: ibinabalik ni Jesus sa mga nagtatanong ang paratang na may paglabag.'
- source_word: παραβαίνετε
  choice: nilalabag
  rationale: Malinaw at kasalukuyang salitang Tagalog ang “nilalabag” para sa paglabag sa isang utos; mas eksakto ito kaysa sa pangkalahatang “sinusuway” at mas natural kaysa sa arkaikong pananalita.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: ang utos ng Diyos
  rationale: Ang “utos” ay natural, marangal, at malinaw na katumbas ng ἐντολή. Pinananatili ng “ng Diyos” ang tahasang kaibahan sa tradisyon ng mga kausap.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: dahil sa tradisyon ninyo
  rationale: Ang διά na may accusative ay pangunahing nagsasaad rito ng dahilan o batayan. Tuwirang pinananatili ng “tradisyon ninyo” ang παράδοσις bilang bagay na ipinamana o ipinasa, at nililimitahan ang puna sa tradisyong kanilang sinusunod sa kontekstong ito.
theological_decisions:
- issue: Pagkakaiba ng utos ng Diyos at tradisyon ng tao
  choice: “utos ng Diyos” at “tradisyon ninyo”
  alternative: “kautusan ng Diyos” at “kaugalian ninyo”
  rationale: Pinananatili ng salin ang tuwirang tensiyon sa pagitan ng banal na utos at ng tradisyong ipinasa ng mga kausap. Hindi ginagawang “kaugalian” ang παράδοσις, sapagkat maaari nitong paliitin ang diwa sa simpleng gawi; hindi rin ipinahihiwatig na hinahatulan dito ang lahat ng tradisyon.
- issue: Ugnayang ipinahihiwatig ng διά
  choice: “dahil sa tradisyon ninyo” bilang dahilan o batayan
  alternative: “alang-alang sa tradisyon ninyo” bilang kapakanan o layuning pinapaboran
  rationale: Mas karaniwang ipinahihiwatig ng parirala rito na ang kanilang tradisyon ang dahilan o batayan ng paglabag. Gayunman, inilalagay sa talababa ang posibleng diin na pinapaboran nila ang tradisyon, upang hindi lubusang mawala ang saklaw ng Griyegong parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang di-likas na hulma na “sumagot at sinabi” habang pinanatili ang retorikal na pagtugon. Ang “nilalabag,” “utos,” at “tradisyon” ay karaniwan ngunit angkop sa dignidad ng tekstong biblikal.
