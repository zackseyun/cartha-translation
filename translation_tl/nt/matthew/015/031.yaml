  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: tl
  text: Kaya namangha ang mga tao nang makita nilang nakapagsasalita ang mga pipi[a], gumaling ang mga may kapansanan sa mga kamay o paa[b], nakalalakad ang mga pilay, at nakakakita ang mga bulag. At niluwalhati nila ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bingi.” Ang salitang Griyego ay maaaring tumukoy sa mga bingi o pipi; “mga pipi” ang ginamit dito dahil ang tuwirang diin ay sa kanilang pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga may kapansanan sa mga kamay o paa ay naging malusog.” Inilalarawan ng Griyego ang mga taong may kapansanan o napinsalang mga kamay o paa na gumaling.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Likas na ipinahahayag sa Tagalog ang bunga ng naunang mga pagpapagaling.
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Natural at malinaw na pantukoy sa nagkakatipong karamihan sa salaysay.
- source_word: θαυμάσαι
  choice: namangha
  rationale: Ipinahahayag ang matinding pagtataka at paghanga ng karamihan.
- source_word: βλέποντας
  choice: nang makita nilang
  rationale: Ipinakikita na ang kanilang nasaksihan ang dahilan ng pagkamangha.
- source_word: κωφοὺς λαλοῦντας
  choice: nakapagsasalita ang mga pipi
  rationale: Bagaman maaaring tumukoy ang κωφός sa bingi o pipi, ang kasunod na λαλοῦντας ay tuwirang nagbibigay-diin sa naibalik na kakayahang magsalita.
- source_word: κυλλοὺς ὑγιεῖς
  choice: gumaling ang mga may kapansanan sa mga kamay o paa
  rationale: Ipinahahayag ang kalagayan ng mga taong may baldado o napinsalang mga biyas na naging maayos, nang hindi pinaghahalo sa kasunod na χωλούς.
- source_word: χωλοὺς περιπατοῦντας
  choice: nakalalakad ang mga pilay
  rationale: Natural na Tagalog para sa tuwirang kaibahan ng dating pilay at ngayo'y lumalakad.
- source_word: τυφλοὺς βλέποντας
  choice: nakakakita ang mga bulag
  rationale: Direkta at natural na paglalarawan sa naibalik na paningin.
- source_word: ἐδόξασαν
  choice: niluwalhati
  rationale: Pinananatili ang malakas na diwa ng pagbibigay-luwalhati sa Diyos.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: ang Diyos ng Israel
  rationale: Tuwirang pinananatili ang pagkakakilanlan ng Diyos sa tekstong Griyego.
theological_decisions:
- issue: Kahulugan ng κωφούς sa κωφοὺς λαλοῦντας
  choice: mga pipi
  alternative: mga bingi
  rationale: Maaaring mangahulugan ang κωφός ng bingi o pipi, ngunit sa kontekstong ito ang 'nagsasalita' ang pinakamalinaw na kaibahan; inilalahad sa talababa ang tunay na alternatibo.
- issue: Pagpapakahulugan sa κυλλοὺς ὑγιεῖς
  choice: gumaling ang mga may kapansanan sa mga kamay o paa
  alternative: naging buo ang mga napinsala ang mga biyas
  rationale: Pinananatili ang kaibahan sa 'mga pilay' at ang ideya ng paggaling o pagpapanumbalik nang hindi dinaragdagan ang teolohikal na paliwanag.
- issue: Paglilipat ng δοξάζω tungkol sa Diyos
  choice: niluwalhati nila
  alternative: pinuri nila / nagbigay sila ng kaluwalhatian sa
  rationale: Ang 'niluwalhati' ay maikli, dignipikado, at malapit sa diwa ng pagkilala at pagbibigay-kaluwalhatian sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang 'mga taong may kapansanan sa mga kamay o paa' upang maging malinaw at magalang, habang pinananatili ang pagkakaiba ng κυλλοί sa χωλοί. Lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
