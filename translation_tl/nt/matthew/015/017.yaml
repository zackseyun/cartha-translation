  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: tl
  text: Hindi ba ninyo nauunawaan na anumang pumapasok sa bibig ay napupunta sa sikmura at inilalabas sa palikuran?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang pumapasok sa bibig … ay inilalabas sa latrina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νοεῖτε
  choice: nauunawaan
  rationale: Tumutukoy ito sa pag-intindi sa punto ni Jesus, hindi lamang sa pagkakita o pagdama; natural ang “nauunawaan” sa isang mapagsaway na tanong.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: anumang pumapasok
  rationale: Pinananatili nito ang pangkalahatang saklaw ng neuter singular na konstruksiyon at likas itong pakinggan sa modernong Tagalog.
- source_word: εἰς τὸ στόμα
  choice: sa bibig
  rationale: Sa pandiwang “pumapasok,” malinaw na ang “sa bibig” ay nagsasaad ng paggalaw papasok at mas natural kaysa sa paulit-ulit na “papasok sa bibig.”
- source_word: κοιλίαν
  choice: sikmura
  rationale: Sa konteksto ng pagtunaw ng pagkain, “sikmura” ang tiyak, karaniwan, at marangal na katumbas.
- source_word: χωρεῖ
  choice: napupunta
  rationale: Malinaw nitong inilalarawan ang pagdaan ng kinain patungo sa sikmura nang hindi nagiging labis na literal o teknikal.
- source_word: ἀφεδρῶνα
  choice: palikuran
  rationale: Ang salita ay tumutukoy sa lugar ng pagdumi o latrina. Ang “palikuran” ay natural at disente sa modernong Filipino, bagaman maaari ring ipakahulugan ang parirala bilang paglabas sa imburnal o hukay ng palikuran.
- source_word: ἐκβάλλεται
  choice: inilalabas
  rationale: Pinananatili nito ang pasibong diwa at malinaw na tumutukoy sa pag-aalis ng dumi sa katawan, nang hindi nagiging magaspang.
theological_decisions:
- issue: Kaugnayan ng sinabi ni Jesus sa mga kautusan tungkol sa rituwal na kalinisan
  choice: Isinalin nang tuwiran ang paglalarawan sa prosesong pisyolohikal, nang walang dagdag na pahayag na idinedeklarang malinis ang lahat ng pagkain.
  alternative: Dagdagan ang talata ng interpretasyong tahasang nagsasabing nilinis o ipinahintulot na ang lahat ng pagkain.
  rationale: Ang mismong talata ay naglalarawan sa pagpasok at paglabas ng kinakain bilang bahagi ng argumento ni Jesus tungkol sa tunay na nagpaparumi. Wala rito ang tahasang komentaryong matatagpuan sa Marcos 7:19, kaya hindi iyon idinagdag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “ninyo” para sa maramihang ikalawang panauhan at ang “palikuran” bilang disenteng karaniwang termino. Ang “pagkatapos” ay nagpapalinaw sa likas na pagkakasunod ng prosesong ipinahihiwatig ng dalawang sugnay.
