base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: tl
  text: Ngunit sinasabi ninyo, ‘Sinumang magsabi sa kanyang ama o ina, “Anumang maitutulong ko sana sa iyo ay kaloob[a],”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog.” Ang diwa ay ipinahayag na itinalaga sa Diyos ang anumang maaari sanang gamitin upang matustusan ang mga magulang; ihambing sa Marcos 7:11, na gumagamit ng salitang “Corban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ngunit sinasabi ninyo
  rationale: Ipinapahayag ng δὲ ang pagsalungat sa naunang utos, at natural na inilalahad ng pangkasalukuyang λέγετε ang karaniwang itinuturo o sinasabi nila.
- source_word: Ὃς ἂν εἴπῃ
  choice: Sinumang magsabi
  rationale: Ang panghalip na may ἄν at aorist subjunctive ay nagpapahayag ng di-tiyak at pangkalahatang kondisyon; natural itong tumbasan ng “sinumang magsabi.”
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: sa kanyang ama o ina
  rationale: Ang datibo ang tumutukoy sa pinagsasabihan. Natural sa Tagalog ang “kanyang,” habang sapat na ang minsanang paggamit nito para sa parehong magulang.
- source_word: Δῶρον
  choice: kaloob
  rationale: Maaaring mangahulugan ang δῶρον ng regalo o handog. Pinananatili ng “kaloob” ang payak na diwa ng isang bagay na ibinigay o itinalaga nang hindi ipinapasok sa teksto ang terminong “Corban” mula sa Marcos 7:11.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Ang anumang pakinabang na matatanggap mo sana mula sa akin
  rationale: Pinananatili ng “mula sa akin” ang direksiyon ng ἐξ ἐμοῦ, samantalang ang “matatanggap mo sana” ay natural na nagpapahayag ng di-natamong pakinabang na nasa anyong pasibo sa ὠφεληθῇς.
theological_decisions:
- issue: Kung ipapasok sa Mateo ang teknikal na katawagang “Corban”
  choice: Panatilihin ang salita ni Mateo bilang “kaloob”
  alternative: “handog,” “Corban,” o “kaloob na itinalaga sa Diyos”
  rationale: δῶρον ang ginamit ni Mateo, hindi κορβᾶν na nasa Marcos 7:11. Kaya hindi ipinapasok sa pangunahing teksto ang terminong wala sa pinagmulang teksto; sa talababa ipinapaliwanag ang implikasyon ng pag-aalay sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakinabang na matatanggap mo sana” upang maging natural ngunit mapanatili ang di-natamong tulong na ipinahihiwatig ng Griyego.
