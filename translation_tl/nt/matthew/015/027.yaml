id: MAT.15.27
reference: Matthew 15:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Oo, Panginoon[a], sapagkat maging ang maliliit na aso[b] ay kumakain ng mga mumong nahuhulog mula sa hapag ng kanilang mga amo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Panginoon” ay maaari ring unawain dito bilang magalang na “ginoo,” ngunit pinananatili ng salin ang karaniwang katawagan kay Jesus sa Ebanghelyo.
    reason: alternative_reading
  - marker: b
    text: O “mga aso,” “mga asong-bahay,” o “mga tuta.” Diminutibo ang salitang Griyego at maaaring tumukoy sa maliliit na asong nasa sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Oo
  rationale: Likas at tuwirang pagsang-ayon sa Filipino; ipinapakita nitong tinatanggap ng babae ang sinabi ni Jesus bago niya pinalawak ang larawan.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang salin sa Ebanghelyo at ang posibleng lalim ng pagkilala sa awtoridad ni Jesus, habang ang talababa ay nagpapakitang maaari rin itong maging magalang na pantawag.
- source_word: καὶ γὰρ
  choice: sapagkat maging
  rationale: 'Ang “sapagkat” ay naghahayag ng paliwanag, at ang “maging” ay nagpapanatili sa pandagdag o nagpapatingkad na diwa ng καί: kahit ang maliliit na aso ay nakikinabang sa nahuhulog na mumo.'
- source_word: κυνάρια
  choice: maliliit na aso
  rationale: Ipinahahayag nito ang anyong diminutibo ng salitang Griyego nang hindi ipinapalagay na mga tuta lamang ang tinutukoy; maaari rin itong magpahiwatig ng mga asong nasa bahay.
- source_word: ἐσθίει
  choice: kumakain
  rationale: Payak na katumbas ng pandiwa. Bagaman isahan ang anyong Griyego dahil sa tuntuning panggramatika sa neuter plural, maramihan ang wastong tugma sa Filipino.
- source_word: ψιχίων
  choice: mga mumo
  rationale: Tiyak at likas na tawag sa maliliit na piraso ng pagkaing nahuhulog mula sa hapag.
- source_word: τῶν πιπτόντων
  choice: nahuhulog
  rationale: Pinananatili ang kasalukuyan o pangkalahatang diwa ng participle at natural na naglalarawan sa “mga mumo.”
- source_word: τραπέζης
  choice: hapag
  rationale: Ang “hapag” ay natural, marangal, at angkop sa larawan ng pagkain sa loob ng sambahayan.
- source_word: τῶν κυρίων αὐτῶν
  choice: kanilang mga amo
  rationale: Sa talinghaga, tumutukoy ang κύριοι sa mga taong nagmamay-ari o namamahala sa mga aso, hindi sa banal na titulong “Panginoon.” Ang “mga amo” ang likas na salin sa ugnayang tao at hayop.
theological_decisions:
- issue: Ang kahulugan ng κύριε bilang direktang tawag kay Jesus
  choice: Panginoon
  alternative: ginoo
  rationale: Maaaring magamit ang κύριε bilang magalang na “ginoo,” ngunit sa Mateo maaari rin itong magpahayag ng pagkilala sa awtoridad ni Jesus. Pinananatili ng “Panginoon” ang saklaw na iyon nang hindi inaalis ang posibleng magalang na gamit.
- issue: Ang diminutibong anyo ng κυνάρια sa isang matinding paghahambing
  choice: maliliit na aso
  alternative: mga aso; mga asong-bahay; mga tuta
  rationale: Pinananatili ang tunay na diminutibong pahiwatig upang hindi gawing mas mabagsik kaysa sa Griyego ang paghahambing, ngunit hindi rin ito pinapalambot sa isang malayang paraphrase.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “hapag” sa halip na mas kolokyal na “mesa,” at iniwasan ang pagdaragdag ng “po” dahil wala itong tuwirang katumbas sa Griyego, samantalang naipahahayag na ng “Panginoon” ang paggalang.
