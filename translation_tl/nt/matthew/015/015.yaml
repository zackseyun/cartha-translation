  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: tl
  text: Sumagot si Pedro sa kaniya, “Ipaliwanag mo sa amin ang talinghagang ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: sumagot
  rationale: Ang aorist passive participle ng ἀποκρίνομαι ay deponent at likas na isinasalin sa Filipino bilang “sumagot.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat o paglipat mula sa naunang sinabi ni Jesus patungo sa tugon ni Pedro.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili nito ang karaniwang anyong salaysay ng λέγω at ang dative na αὐτῷ bilang pinatutungkulan ng pagsasalita.
- source_word: Φράσον
  choice: Ipaliwanag mo
  rationale: Sa kontekstong ito, ang pautos na φράζω ay humihiling na gawing malinaw ang kahulugan ng matalinghagang pahayag.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Ito ang likas na katumbas sa Filipino ng dative pronoun kasama ng pandiwang “ipaliwanag.”
- source_word: τὴν παραβολὴν ταύτην
  choice: ang talinghagang ito
  rationale: Ang “talinghaga” ang kinikilalang katumbas ng παραβολή sa Ebanghelyo, at ang “ito” ay tumutukoy sa kagyat na naunang pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang paulit-ulit na estrukturang “sumagot ... at sinabi” upang katawanin ang Ἀποκριθεὶς ... εἶπεν, ngunit gumamit ng karaniwang bokabularyo. Walang talababa dahil sapat na saklaw ng “ipaliwanag” ang kontekstuwal na diwa ng φράζω nang hindi inaalis ang posibilidad na “sabihin nang malinaw.”
