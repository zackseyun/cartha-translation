  to: Kinuha niya ang pitong tinapay at ang mga isda, at pagkatapos magpasalamat[a], pinagpira-piraso niya ang mga iyon at patuloy na ibinibigay sa mga alagad; patuloy naman itong ibinibigay ng mga alagad sa mga pulutong.
  rationale: Inayos ang aspekto ng pandiwang pamamahagi upang maipahayag ang imperpektong ἐδίδου, ibinalik ang “mga pulutong” para sa ὄχλοις, at isinalin ang audit-trail na alternatibo para sa εὐχαριστήσας. Pinanatili ang diwa ng paghahati ng tinapay at ang tahasang pandiwang kailangan sa natural na Filipino para sa eliptikong ikalawang sugnay.
