  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: tl
  text: Kinuha niya ang pitong tinapay at ang mga isda, at pagkatapos magpasalamat[a], pinagpira-piraso niya ang mga iyon at patuloy na ibinibigay sa mga alagad; patuloy naman itong ibinibigay ng mga alagad sa mga pulutong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang makapagpasalamat na siya.” Maaaring isalin nang mas pormal ang participio sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: Kinuha niya
  rationale: Likas na panumbas sa kontekstong inilalarawan ang paghawak ni Jesus sa pagkain bago ito hatiin at ipamahagi.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ang pitong tinapay
  rationale: Sa Filipino, ang bilang na “pitong” ay sapat upang ipahiwatig ang magkakahiwalay na tinapay; hindi natural sa karaniwang salin ang “pitong piraso ng tinapay” maliban kung kailangang idiin ang anyo.
- source_word: τοὺς ἰχθύας
  choice: ang mga isda
  rationale: Pinananatili ang tahasang maramihang anyo ng Griyego sa natural na Filipino.
- source_word: εὐχαριστήσας
  choice: Matapos magpasalamat
  rationale: Malinaw na ipinapakita ang naunang kilos ng aorist participle nang hindi nagdaragdag ng tahasang layon gaya ng “sa Diyos,” na wala sa teksto.
- source_word: ἔκλασεν
  choice: pinagputol-putol niya ang mga iyon
  rationale: Ang pandiwa ay tumutukoy sa paghahati para maipamahagi. Ang “mga iyon” ay likas na ipinapahiwatig ng konteksto bagaman walang tahasang layon sa Griyego.
- source_word: ἐδίδου
  choice: patuloy na ibinigay
  rationale: Ipinahihiwatig ng imperfect tense ang nagpapatuloy o paulit-ulit na pagbibigay habang namamahagi.
- source_word: τοῖς μαθηταῖς
  choice: sa mga alagad
  rationale: Pinananatili ang mga tumanggap nang hindi idinaragdag ang “kaniyang,” na hindi tahasang nasa Griyego.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ibinigay naman ng mga alagad ang mga iyon sa mga tao
  rationale: Tahasang inuulit sa Filipino ang pandiwang ipinauunawa lamang sa Griyego. Ang “mga tao” ang pinakanatural na katawagan sa mga pulutong sa kontekstong ito.
theological_decisions:
- issue: Posibleng alusyong Eukaristiko ng εὐχαριστήσας
  choice: 'Isinalin bilang karaniwang kilos sa salaysay: “Matapos magpasalamat.”'
  alternative: Gumamit ng mas liturhikal na pananalita upang idiin ang kaugnayan sa Eukaristiya.
  rationale: Maaaring mapansin ang pagkakahawig sa pananalita tungkol sa Hapunan ng Panginoon, ngunit ang talata mismo ay nagsasalaysay lamang na nagpasalamat si Jesus bago ipamahagi ang pagkain. Hindi dapat palawakin ng salin ang teolohikal na pahiwatig nang higit sa sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging madaling basahin, habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang nagpapatuloy na diwa ng ἐδίδου.
