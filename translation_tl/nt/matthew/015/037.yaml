  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: tl
  text: Kumain silang lahat at nabusog, at tinipon nila ang mga natirang piraso—pitong basket na punô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong malalaking basket na punô.” Ang salitang Griyego rito (σπυρίδας, spyridas) ay maaaring tumukoy sa isang uri ng basket na mas malaki kaysa sa mga basket na binanggit sa ilang ibang salaysay tungkol sa pagpapakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: kumain
  rationale: Tuwirang salin ng aorist ng ἐσθίω; walang tahasang layon sa Griyego, kaya likas ang payak na “kumain.”
- source_word: πάντες
  choice: silang lahat
  rationale: Ipinahahayag ang pangkalahatang saklaw at ang ipinahihiwatig na maramihang simuno sa natural na Tagalog.
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Ipinahihiwatig ng χορτάζω na nakakain sila hanggang sa mapuno o masiyahan; “nabusog” ang pinakanatural at tiyak na katumbas sa konteksto ng pagkain.
- source_word: τὸ περισσεῦον
  choice: mga natira
  rationale: Ang substantival participle ay tumutukoy sa anumang labis o naiwan; “mga natira” ay malinaw at idiomatiko.
- source_word: κλασμάτων
  choice: mga piraso
  rationale: Tumutukoy ang κλάσματα sa mga naputol na piraso ng pagkain, malamang na tinapay; hindi idinaragdag ang “tinapay” sapagkat hindi ito tahasang nasa talata.
- source_word: ἦραν
  choice: tinipon nila
  rationale: Sa kontekstong kinokolekta ang mga natira, ipinapahayag ng “tinipon” ang diwa ng αἴρω nang natural sa Tagalog.
- source_word: ἑπτὰ
  choice: pitong
  rationale: Tuwirang salin ng bilang na ἑπτά, na ginamitan ng pang-angkop sa Tagalog.
- source_word: σπυρίδας
  choice: basket
  rationale: Ang σπυρίς ay isang basket at maaaring tumukoy sa mas malaking uri; pinananatiling payak ang pangunahing teksto, habang inilalagay sa talababa ang posibleng pahiwatig tungkol sa laki.
- source_word: πλήρεις
  choice: na punô
  rationale: Tuwirang inilalarawan nito na punô ang pitong basket; nilagyan ng tuldik ang “punô” upang luminaw ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “basket” dahil ito ang natural na gamit sa kasalukuyang Tagalog; iniwasang tukuyin bilang tinapay ang mga piraso dahil “mga piraso” lamang ang tahasang nasa Griyego.
