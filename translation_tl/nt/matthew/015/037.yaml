  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing bahagi ng Griyego: ang lahat ay kumain at nabusog; ang natirang piraso ay tinipon; at ang dami nito ay pitong basket na punô. Hindi idinagdag ang isang layon sa “kumain,” at nananatili ang saklaw ng πάντες sa “silang lahat.”'
