base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: tl
  text: Pagkaalis niya roon, lumisan si Jesus patungo sa mga lupain ng Tiro at Sidon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pagkaalis niya roon, umalis si Jesus patungo sa mga lupain ng Tiro at Sidon.” Mas neutral ang “umalis” para sa pandiwang Griyego; ang “lumisan” ay pinananatili ang banayad na diwa ng pag-withdraw na paulit-ulit na gamit ni Mateo sa pandiwang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[implicit narrative connection]'
  rationale: Hindi na isinalin nang hiwalay ang simpleng pang-ugnay upang maging natural ang daloy sa Filipino; naipahihiwatig na ng “Pagkaalis” ang pagpapatuloy ng salaysay.
- source_word: ἐξελθὼν
  choice: Pagkaalis
  rationale: Ipinapakita ng anyong ito na ang pag-alis ang kilos na nauna sa pangunahing pandiwang ἀνεχώρησεν, nang hindi dinaragdagan ang motibo ni Jesus.
- source_word: ἐκεῖθεν
  choice: doon
  rationale: Natural at tuwirang katumbas ng pagtukoy sa lugar na pinanggalingan.
- source_word: ἀνεχώρησεν
  choice: lumayo
  rationale: Pinananatili nito ang diwang paglayo o pag-urong na madalas taglay ng pandiwa sa Mateo, ngunit hindi kasing-tindi ng “umatras,” na maaaring magpahiwatig ng pagkatalo o takot.
- source_word: εἰς τὰ μέρη
  choice: patungo sa rehiyon
  rationale: Ipinahahayag ang pagkilos patungo sa pangkalahatang nasasakupan, nang hindi ipinapalagay na pumasok siya sa mismong mga lungsod.
- source_word: Τύρου καὶ Σιδῶνος
  choice: ng Tiro at Sidon
  rationale: Ginagamit ang karaniwang anyong Filipino ng mga pangalan at iniuugnay ang dalawang lungsod sa rehiyong tinutukoy.
theological_decisions:
- issue: Diwa ng pagkilos ni Jesus patungo sa teritoryong kaugnay ng mga Hentil
  choice: Isinalin ang ἀνεχώρησεν bilang “lumayo” nang hindi nagsasaad ng dahilan.
  alternative: Maaaring isalin nang mas neutral bilang “umalis” o mas mariin bilang “umatras.”
  rationale: Maaaring may diwa ng sinadyang paglayo ang pandiwa, ngunit hindi tahasang sinasabi ng talata ang dahilan. Pinananatili ng salin ang pahiwatig nang hindi nagdaragdag ng teolohikal o sikolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rehiyon” bilang karaniwang salitang nauunawaan ng mga mambabasa, at ang “lumayo” upang mapanatili ang banayad na diwa ng withdrawal nang hindi lumilikha ng impresyong tumakas o natalo si Jesus.
