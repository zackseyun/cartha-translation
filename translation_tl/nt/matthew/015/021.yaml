  naturalness: Natural at marangal ang binagong pangungusap. Ang “Pagkaalis niya roon” ay malinaw na tumutukoy kay Jesus, at ang “lumisan patungo sa mga lupain” ay mas maayos na daloy kaysa “lumayo ... patungo sa rehiyon.”
  terminology: Pinanatili ang karaniwang mga pangalang “Jesus,” “Tiro,” at “Sidon.” Walang idinagdag na motibo tungkol sa pagpunta ni Jesus sa teritoryong kaugnay ng mga Hentil.
