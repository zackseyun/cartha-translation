  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: tl
  text: Sinabi sa kanya ng mga alagad, “Saan tayo kukuha ng gayon karaming tinapay sa ilang na ito[a] upang mapakain hanggang mabusog ang napakalaking pulutong[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilang” o “sa isang liblib na lugar.”
    reason: lexical_alternative
  - marker: b
    text: O “upang mabusog ang ganito kalaking pulutong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Sinabi
  rationale: Ang historikal na pangkasalukuyan sa salaysay na Griyego ay likas na isinasalin sa pangnagdaan sa modernong Tagalog.
- source_word: οἱ μαθηταί
  choice: ang mga alagad
  rationale: Tinutukoy ng pantukoy ang tiyak at dati nang kilalang pangkat; hindi idinagdag ang “niya” sapagkat hindi ito tahasang nasa Griyego.
- source_word: Πόθεν ἡμῖν
  choice: Saan tayo kukuha
  rationale: Ipinahihiwatig ng tanong ang pinagmumulan o pagkukunan ng pagkain; ito ang natural na anyo sa Tagalog.
- source_word: ἐν ἐρημίᾳ
  choice: sa ilang na lugar na ito
  rationale: Ang ἐρημία ay isang liblib o walang taong lugar, hindi kinakailangang tigang na disyerto. Ang “na ito” ay likas na tumutukoy sa kinaroroonan nila.
- source_word: ἄρτοι τοσοῦτοι
  choice: gayon karaming tinapay
  rationale: Pinananatili nito ang diin sa dami. Ginamit ang “tinapay” bilang likas na kolektibong katawagan sa Tagalog sa halip na ang mas literal na “mga tinapay.”
- source_word: ὥστε χορτάσαι
  choice: upang mapakain nang husto
  rationale: Ipinahahayag nito ang layon o bunga at ang diwa ng χορτάζω na pakainin hanggang mabusog, hindi lamang bigyan ng pagkain.
- source_word: ὄχλον τοσοῦτον
  choice: ang napakaraming taong ito
  rationale: Natural sa Tagalog na tukuyin ang malaking pulutong bilang “napakaraming tao,” habang pinananatili ang diin ng τοσοῦτον.
