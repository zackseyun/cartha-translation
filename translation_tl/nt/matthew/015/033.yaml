- from: Sinabi sa kanya ng mga alagad, “Saan tayo kukuha ng gayon karaming tinapay sa ilang na lugar na ito[a] upang mapakain nang husto ang napakaraming taong ito[b]?”
  to: Sinabi sa kanya ng mga alagad, “Saan tayo kukuha ng gayon karaming tinapay sa ilang na ito[a] upang mapakain hanggang mabusog ang napakalaking pulutong[b]?”
  rationale: Inayos ang di-likas na “ilang na lugar” tungo sa “ilang,” at ginawang “napakalaking pulutong” ang pagtukoy sa ὄχλος. Nilinaw rin ng “hanggang mabusog” ang saklaw ng χορτάσαι, samantalang napanatili ang ambigwidad at retorikal na anyo ng Griyego.
