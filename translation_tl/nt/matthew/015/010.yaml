  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang "At nang tawagin niya ang karamihan upang lumapit sa kanya, sinabi niya sa kanila..." Ang "karamihan" ay higit na tiyak para sa nagkakatipong ὄχλος kaysa sa pangkalahatang "mga tao." Ang magkatambal na "Makinig kayo at unawain ninyo" ay angkop sa marangal ngunit payak na pampublikong pananalita.
  terminology: Walang isyung teolohikal o pangalang dapat ayusin. Ang "unawain" ay tumpak para sa συνίετε bilang pag-intindi sa kahulugan. Inilipat ang panandang talababa upang malinaw na tumukoy ito sa "Makinig kayo," ang salin ng Ἀκούετε.
