translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “mga tao” para sa natural na daloy ng salaysay at ang magkatugmang pautos na “Makinig kayo at unawain ninyo” para sa malinaw na pampublikong pananalita.
