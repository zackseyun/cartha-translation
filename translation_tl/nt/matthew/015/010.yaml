  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: tl
  text: At nang tawagin niya ang karamihan upang lumapit sa kanya, sinabi niya sa kanila, “Makinig kayo[a] at unawain ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pakinggan ninyo at unawain ninyo.”
    reason: Ipinapakita ang posibleng salin ng Ἀκούετε bilang “Pakinggan ninyo,” bagaman mas natural dito bilang tuwirang utos ang “Makinig kayo.”
lexical_decisions:
- source_word: Καὶ προσκαλεσάμενος
  choice: Matapos niyang tawagin
  rationale: Likas sa Tagalog ang sugnay na may “matapos” para sa aorist participle na nauuna sa pangunahing pandiwa. Ipinapakita nito ang pagkakasunod ng mga kilos nang hindi binabago ang diwa ng salaysay.
- source_word: τὸν ὄχλον
  choice: ang mga tao
  rationale: Sa kontekstong ito, ang ὄχλος ay tumutukoy sa nagkatipong karamihan. Mas natural sa modernong Tagalog ang “mga tao” kaysa “karamihan” bilang layon ng pandiwang “tawagin.”
- source_word: προσκαλεσάμενος
  choice: tawagin ... palapit sa kanya
  rationale: Ipinahahayag ng “palapit sa kanya” ang direksiyonal na diwa ng προσκαλέομαι, hindi lamang ang pagtawag nang walang pahiwatig na lumapit.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwirang katumbas ito ng karaniwang gamit ng λέγω na may di-tuwirang layon na αὐτοῖς.
- source_word: Ἀκούετε
  choice: Makinig kayo
  rationale: Ang pangmaramihang pautos ay natural na ipinahahayag sa Tagalog sa pamamagitan ng “makinig kayo.” Pinananatili nito ang panawagang bigyang-pansin ang sasabihin.
- source_word: συνίετε
  choice: unawain ninyo
  rationale: Tumutukoy ang συνίημι sa pag-intindi sa kahulugan, hindi lamang sa pandinig. Ang “unawain ninyo” ay malinaw at marangal na modernong Tagalog.
