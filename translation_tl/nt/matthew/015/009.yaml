  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: tl
  text: Ngunit walang kabuluhan ang pagsamba nila sa akin; itinuturo nila bilang mga aral ang mga utos ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “itinuturo nila ang mga utos ng tao bilang mga doktrina.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: walang kabuluhan
  rationale: Ipinahahayag nito na ang kanilang pagsamba ay walang saysay o pakinabang, at pinananatili ang matinding tono ng pagsaway.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang banayad na pagsalungat sa naunang pahayag; natural dito ang “Ngunit.”
- source_word: σέβονταί με
  choice: ang pagsamba nila sa akin
  rationale: Ang σέβομαι, kapag Diyos ang pinatutungkulan, ay likas na tumutukoy sa pagsamba o paggalang na panrelihiyon. Ginawang pangngalang parirala ang anyo upang maging natural sa Tagalog kasunod ng “walang kabuluhan.”
- source_word: διδάσκοντες
  choice: itinuturo nila
  rationale: Pinananatili ang ugnayan nito sa walang-kabuluhang pagsamba nang hindi labis na tinutukoy kung ito ay temporal, pamaraan, o sanhi.
- source_word: διδασκαλίας
  choice: mga aral
  rationale: Ang “mga aral” ay malinaw at kasalukuyang Tagalog para sa mga doktrinang itinuturo, nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: ἐντάλματα
  choice: mga utos
  rationale: Pinananatili nito ang pormal at panrelihiyong diwa ng mga ipinag-uutos.
- source_word: ἀνθρώπων
  choice: ng tao
  rationale: Generic ang ἀνθρώπων at ikinokontra ang pinagmulan sa tao sa pinagmulan sa Diyos. Sa Tagalog, likas at inklusibo ang “ng tao” para sa sangkatauhan o mga tao sa pangkalahatan.
theological_decisions:
- issue: Ugnayan ng διδασκαλίας at ἐντάλματα ἀνθρώπων
  choice: itinuturo nilang mga aral ang mga utos ng tao
  alternative: itinuturo bilang mga aral ang mga utos ng tao
  rationale: Siksik ang pariralang Griyego at maaaring unawain na ang mga utos ng tao ay itinuturo na may awtoridad bilang mga aral. Pinananatili ng pangunahing salin ang ugnayang ito nang hindi nilulutas nang labis ang sintaktikong pagkakasiksik; ibinibigay sa talababa ang mas tahasang anyo.
- issue: Generic na kahulugan ng ἀνθρώπων
  choice: ng tao
  alternative: ng mga tao
  rationale: Hindi lalaki lamang ang tinutukoy. Ang “ng tao” ay natural na generic sa Tagalog at malinaw na inilalaban ang utos na nagmula sa tao sa utos na nagmula sa Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang semicolon upang malinaw na iugnay ang walang-kabuluhang pagsamba sa nilalaman ng kanilang pagtuturo, habang pinananatili ang masikip na anyo ng sipi mula sa Isaias.
