  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: tl
  text: Pagkatapos, lumapit ang mga alagad at sinabi sa kanya, “Alam mo bang nagdamdam[a] ang mga Pariseo nang marinig nila ang pahayag na ito?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “natisod”; mas literal, “napatisod.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pahayag na ito” ay tumutukoy sa naunang pahayag ni Jesus.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang pasalaysay sa Filipino para sa kasunod na pangyayari; hindi nito ipinahihiwatig na matagal na panahon ang lumipas.
- source_word: προσελθόντες
  choice: lumapit
  rationale: Tuwirang ipinahahayag ang paglapit kay Jesus at natural na naiuugnay sa pangunahing pandiwang “sinabi.”
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Karaniwang salin ng μαθηταί; hindi idinagdag ang “niya” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: λέγουσιν αὐτῷ
  choice: sinabi sa kanya
  rationale: Isinalin sa nakaraang panahunan ang historical present upang maging natural ang salaysay sa Filipino.
- source_word: Οἶδας
  choice: Alam mo ba
  rationale: Tuwiran at likas na katumbas ng tanong; hindi dinagdagan ng interpretatibong diwang “napagtanto.”
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Pamantayang katawagan sa Filipino para sa pangkat na ito.
- source_word: ἀκούσαντες τὸν λόγον
  choice: nang marinig nila ang sinabi mong iyon
  rationale: Sa konteksto, ang λόγος ay isang naunang pahayag ni Jesus. Ang “sinabi mong iyon” ay natural at malinaw sa Filipino habang ang talababa ay nililinaw ang reperensiya.
- source_word: ἐσκανδαλίσθησαν
  choice: natisod
  rationale: Pinananatili ang metaporikal na lakas at posibleng lawak ng σκανδαλίζω sa halip na ikulong ito sa damdaming nasaktan lamang; nililinaw sa talababa ang kontekstuwal na diwang nagdamdam o nagalit.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζω sa reaksiyon ng mga Pariseo
  choice: natisod
  alternative: nagdamdam / natisod ang damdamin
  rationale: Ang “natisod” ay nagpapanatili sa metapora at tunay na lawak ng pandiwa, samantalang ipinakikita ng talababa na sa kontekstong ito maaari itong tumukoy sa pagkagalit o pagdaramdam sa sinabi ni Jesus, nang hindi nagpapasya sa mas malalim na espirituwal na implikasyon.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kanya” sa halip na mas pormal na “kaniya,” at pinanatili ang “natisod” upang hindi mawala ang metapora ng orihinal. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
