  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: tl
  text: Hayaan ninyo sila. Sila ay mga bulag na tagaakay ng mga bulag. Ngunit kung ang isang bulag ay umaakay sa isang bulag, kapwa sila mahuhulog sa hukay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kanal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Hayaan ninyo sila
  rationale: Ang aorist imperative na ἄφετε ay nangangahulugang pabayaan o huwag nang pakialaman sa kontekstong ito, hindi 'patawarin.' Likas at tuwiran sa modernong Tagalog ang 'Hayaan ninyo sila.'
- source_word: τυφλοί
  choice: mga bulag
  rationale: Pinananatili ang metapora ng pagkabulag nang hindi ipinapaliwanag sa mismong talata bilang espirituwal na kakulangan.
- source_word: ὁδηγοὶ τυφλῶν
  choice: mga tagaakay ng mga bulag
  rationale: Ang 'tagaakay' ay nagpapanatili sa konkretong larawan ng ὁδηγός at umaayon sa pandiwang ὁδηγῇ sa kasunod na pangungusap.
- source_word: τυφλὸς ... τυφλὸν
  choice: bulag ... kapwa bulag
  rationale: Sa Tagalog, hindi kailangang markahan ang kasarian sa pangngalang 'bulag.' Ang 'kapwa bulag' ay natural na nagpapahayag na bulag din ang inaakay, habang nananatiling pangkalahatan ang kasabihan.
- source_word: δὲ
  choice: At
  rationale: Ang δέ rito ay banayad na pagpapatuloy o paglipat sa babalang kasabihan. Mas natural ang 'At' kaysa sa matinding panalungat na 'Ngunit' sa Tagalog.
- source_word: ἐὰν ὁδηγῇ
  choice: kung ... ang umaakay
  rationale: Ipinapahayag ng ἐὰν kasama ng present subjunctive ang isang pangkalahatang kondisyon. Natural sa Tagalog ang hulma na 'kung ... ang umaakay.'
- source_word: ἀμφότεροι
  choice: kapwa sila
  rationale: Tumpak at natural na ipinapahayag ng 'kapwa sila' na ang dalawang tinutukoy ay sasapitin ang parehong bunga.
- source_word: εἰς βόθυνον
  choice: sa hukay
  rationale: Ang βόθυνος ay maaaring tumukoy sa hukay o kanal. Ang 'hukay' ay malawak, malinaw, at nagpapanatili sa matingkad na larawan.
- source_word: πεσοῦνται
  choice: mahuhulog
  rationale: Natural na anyong panghinaharap sa Tagalog para sa tiyak na kahihinatnan ng kondisyong binanggit.
theological_decisions:
- issue: Metaporikal na diwa ng 'bulag'
  choice: Panatilihin ang 'bulag' bilang metapora nang walang paliwanag sa pangunahing teksto.
  alternative: Mga bulag sa espirituwal na bagay; mga pinunong walang pagkaunawa
  rationale: Hindi tahasang nililinaw ng Griyego ang kahulugan ng metapora. Ang pagpapalawak dito ay magpapasok ng interpretasyon at magpapahina sa puwersa ng kasabihan.
- issue: Kasarian sa pangkalahatang kasabihan
  choice: Gamitin ang walang markang-kasariang salitang Tagalog na 'bulag.'
  alternative: Lalaking bulag ... lalaking bulag
  rationale: Bagaman panlalaking isahan ang anyong Griyego, kinatawan at pangkalahatan ang gamit nito. Hindi karaniwang minamarkahan ng Tagalog ang kasarian sa 'bulag,' kaya naipapahayag nito ang layunin ng orihinal nang walang di-likas na pagdaragdag ng 'lalaki.'
- issue: Ugnayan ng unang dalawang sugnay
  choice: 'Basahin ang SBLGNT bilang dalawang pahayag: ''Sila''y mga bulag na tagaakay ng mga bulag.'''
  alternative: Sila'y mga bulag na tagaakay.
  rationale: Sinusunod nito ang ibinigay na pangunahing teksto ng SBLGNT, na may τυφλῶν, habang kinikilalang may baryanteng tekstuwal na hindi kabilang ang mga salitang katumbas ng 'ng mga bulag.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikli at matalim na anyo ng kasabihan, gayundin ang pag-uulit ng larawang 'bulag' at 'tagaakay.'
