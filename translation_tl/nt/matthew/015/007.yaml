  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: tl
  text: 'Mga mapagkunwari! Tama[a] ang ipinropesiya ni Isaias tungkol sa inyo nang sabihin niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Mahusay na ipinropesiya ni Isaias ang tungkol sa inyo.”
    reason: leksikal na alternatibo para sa καλῶς; ang pangunahing salin na “Tama” ang mas malinaw na naghahatid ng kawastuhan at kaangkupan sa kontekstong ito.
lexical_decisions:
- source_word: ὑποκριταί
  choice: Mga mapagkunwari!
  rationale: Tuwirang panawag na maramihan at matinding pagsaway. Ang “mapagkunwari” ay natural at malinaw sa modernong Tagalog, at pinananatili ang moral na bigat ng salita.
- source_word: καλῶς
  choice: Tama
  rationale: Ipinapahayag na ang propesiya ni Isaias ay angkop at totoo tungkol sa mga kausap ni Jesus. Mas natural dito ang “Tama” kaysa “Mabuti.”
- source_word: ἐπροφήτευσεν
  choice: ipinropesiya
  rationale: Pinananatili ang tahasang propetikong diwa ng pandiwa at ang kaugnayan ni Isaias bilang propeta.
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Karaniwan at eksaktong katumbas ng περί na may genitive, nang hindi dinaragdagan ang kahulugan.
- source_word: Ἠσαΐας
  choice: Isaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga Bibliyang Tagalog.
- source_word: λέγων
  choice: 'nang sabihin niya:'
  rationale: Likas na panimula sa siping kasunod at malinaw na si Isaias ang nagsasalita sa propesiya.
theological_decisions:
- issue: Lakas ng tuwirang panawag ni Jesus
  choice: “Mga mapagkunwari!” bilang tahasang paghatol
  alternative: Mas banayad na “Mga nagkukunwari” o “Mga mapagpanggap”
  rationale: Ang ὑποκριταί ay isang mariing moral at relihiyosong paratang. Hindi ito dapat palambutin, sapagkat iniuugnay nito ang mga kausap sa kasunod na puna ni Isaias.
- issue: Diwa ng καλῶς kaugnay ng propesiya
  choice: “Tama ang ipinropesiya”
  alternative: “Mahusay ang ipinropesiya” o “Mabuti ang pagkakapropesiya”
  rationale: Sa konteksto, pinagtitibay ni Jesus ang katumpakan at kaangkupan ng propesiya sa kanyang mga kausap, hindi ang istilo o husay ng pagkakapahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Pinanatili ang matalas na pagsaway sa pamamagitan ng hiwalay na padamdam. Walang footnote dahil walang tunay na kailangang markahang alternatibo sa talatang ito; ang footnote sa consultation layer ay tila hindi tugma sa salitang minarkahan.
