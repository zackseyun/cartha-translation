id: MAT.15.19
reference: Matthew 15:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: tl
  text: Sapagkat mula sa puso lumalabas ang masasamang pag-iisip, mga pagpaslang, pangangalunya, mga imoral na gawaing seksuwal, pagnanakaw, mga huwad na patotoo, at paninirang-puri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga paglapastangan.” Maaaring tumukoy ang salitang Griyego sa paninirang-puri sa mga tao o sa lapastangang pananalita laban sa Diyos, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Sapagkat mula sa puso
  rationale: Pinananatili ng “sapagkat” ang paliwanag na diwa ng γάρ, ng “mula sa” ang pinagmumulang ipinahihiwatig ng ἐκ, at ng “puso” ang biblikal na larawan ng panloob na pagkatao bilang bukal ng kilos.
- source_word: ἐξέρχονται
  choice: lumalabas
  rationale: Tuwirang ipinapahayag ang paglabas o pagmumula ng mga kasamaan sa puso at pinananatili ang larawan ng Griyego.
- source_word: διαλογισμοὶ πονηροί
  choice: masasamang pag-iisip
  rationale: Saklaw nito ang masasamang kaisipan, pangangatwiran, at pagbabalak nang hindi nililimitahan ang salita sa pakana lamang.
- source_word: φόνοι
  choice: mga pagpaslang
  rationale: Mas tiyak ang “pagpaslang” kaysa sa pangkalahatang “pagpatay” para sa pagkitil ng buhay na may moral na bigat.
- source_word: μοιχεῖαι
  choice: pangangalunya
  rationale: Karaniwan at malinaw na tawag ito sa pakikipagtalik na lumalabag sa katapatan sa pag-aasawa; natural sa Filipino ang kolektibong anyo kahit maramihan ang Griyego.
- source_word: πορνεῖαι
  choice: mga imoral na gawaing seksuwal
  rationale: Pinananatili ang malawak na saklaw ng πορνεῖαι para sa sari-saring ipinagbabawal na gawaing seksuwal, sa halip na paliitin ito sa isang uri lamang.
- source_word: κλοπαί
  choice: pagnanakaw
  rationale: Likas at tuwirang katumbas sa Filipino; gumagana bilang kolektibong tawag sa mga gawa ng pagnanakaw.
- source_word: ψευδομαρτυρίαι
  choice: mga huwad na patotoo
  rationale: Pinananatili ang maramihang anyo at ang legal o testimonial na diwa ng salita.
- source_word: βλασφημίαι
  choice: paninirang-puri
  rationale: Sa pangkalahatang talaan ng kasamaan, malinaw nitong ipinahahayag ang mapanirang pananalita laban sa kapwa, habang inilalahad sa talababa ang posibleng pagtukoy sa paglapastangan sa Diyos.
theological_decisions:
- issue: Saklaw ng βλασφημίαι sa talaan ng mga kasamaan
  choice: paninirang-puri
  alternative: mga paglapastangan sa Diyos; mapang-abusong pananalita
  rationale: Maaaring tumukoy ang Griyego sa paninirang salita laban sa tao o sa lapastangang pananalita laban sa Diyos. Hindi tahasang nililimitahan ng konteksto ang pinatutungkulan, kaya pinili ang mas malawak na angkop sa ugnayang pantao at pinanatili sa talababa ang ibang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang metapora ng “puso” at ang anyong talaan, ngunit gumamit ng mga kolektibong pangngalan kung mas natural iyon sa Tagalog. Inilagay ang [a] sa “paninirang-puri,” ang salitang tinutukoy ng talababa.
source_grounding:
  english_pob_role: consult_only
