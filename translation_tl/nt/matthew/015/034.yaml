source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: tl
  text: Tinanong sila ni Jesus, “Ilang tinapay ang mayroon kayo?” Sumagot sila, “Pito, at ilang maliliit na isda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Tinanong
  rationale: Bagaman literal na “sinabi” at nasa historical present ang Griyego, ang kasunod ay isang tanong; likas sa makabagong Tagalog ang “tinanong” at pinananatili nito ang tungkulin ng pahayag sa salaysay.
- source_word: Πόσους ἄρτους
  choice: Ilang tinapay
  rationale: Ang ἄρτους ay mabibilang na mga tinapay, ngunit natural sa Tagalog ang “ilang tinapay” nang hindi na kailangang idagdag ang “piraso” o “bilog.”
- source_word: ἔχετε
  choice: ang mayroon kayo
  rationale: Natural na anyo ng tanong sa makabagong Tagalog na malinaw na tumutukoy sa taglay nilang tinapay.
- source_word: οἱ δὲ εἶπαν
  choice: Sumagot sila
  rationale: Sa konteksto ng tuwirang tanong, malinaw at likas na inilalarawan ng “sumagot” ang εἶπαν; hindi kailangang gawing panalungat ang δέ.
- source_word: Ἑπτά
  choice: Pito
  rationale: Tuwirang salin ng bilang.
- source_word: ὀλίγα
  choice: ilang
  rationale: Ipinapahayag ang maliit at di-tiyak na dami nang natural sa Tagalog, kasama ng pang-uring “maliliit.”
- source_word: ἰχθύδια
  choice: maliliit na isda
  rationale: Pinananatili ang diminutibong anyo ng salitang Griyego, na nagpapahiwatig ng maliliit na isda.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, natural, at marangal. Ginamit ang “Tinanong” at “Sumagot” upang maging maayos ang daloy ng diyalogo, habang pinanatili ang kahulugan ng orihinal. Walang talababa dahil maisasalin nang tuwiran sa pangunahing teksto ang diminutibong diwa ng ἰχθύδια.
