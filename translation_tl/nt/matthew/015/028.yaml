id: MAT.15.28
reference: Matthew 15:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: tl
  text: Pagkatapos, sumagot si Jesus sa kanya, “Ginang, napakalaki ng iyong pananampalataya![a] Mangyari sa iyo ayon sa nais mo.” At gumaling ang anak niyang babae mula sa oras na iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtitiwala.” Maaari ring ipahiwatig ng salitang Griyego na πίστις ang pagtitiwala o pagiging tapat, ngunit “pananampalataya” ang pangunahing salin dito.
    reason: lexical_alternative
  - marker: b
    text: 'O “mula sa sandaling iyon.” Literal sa Griyego: “mula sa oras na iyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa tugon ni Jesus sa naunang pag-uusap; natural ito sa salaysay sa Tagalog.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: sumagot si Jesus sa kanya
  rationale: Pinagsama ang idiomatikong participle at pandiwa ng pagsasalita upang maiwasan ang di-likas na pag-uulit, habang pinananatili ang αὐτῇ bilang “sa kanya.”
- source_word: Ὦ γύναι
  choice: Ginang
  rationale: Magalang at mariing tuwirang pagtawag ang diwa sa konteksto. Ang literal na “O babae” ay maaaring tumunog na magaspang o lipas sa modernong Tagalog, samantalang hindi rin dapat palambutin nang labis ang pananalita.
- source_word: μεγάλη σου ἡ πίστις
  choice: napakalaki ng iyong pananampalataya
  rationale: Pinananatili ang diin sa laki ng πίστις at gumagamit ng natural na ayos sa Tagalog.
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwang katumbas sa kontekstong pinupuri ni Jesus ang nananalig na paglapit ng babae; maaari ring idiin ng salita ang pagtitiwala.
- source_word: γενηθήτω σοι
  choice: Mangyari sa iyo
  rationale: Pinananatili ang pautos at performatibong lakas ng aorist passive imperative nang hindi ipinapaliwanag kung paano ito isasakatuparan.
- source_word: ὡς θέλεις
  choice: ang ayon sa nais mo
  rationale: Ipinapahayag ang pagkakatugma ng mangyayari sa ninanais ng babae sa natural at marangal na Tagalog.
- source_word: ἰάθη
  choice: gumaling
  rationale: Natural na katumbas sa Tagalog ng pasibong diwang “was healed”; malinaw sa pangungusap na ang anak ang tumanggap ng paggaling.
- source_word: ἡ θυγάτηρ αὐτῆς
  choice: ang anak niyang babae
  rationale: Tumpak na tinutukoy ang babaeng anak at malinaw na pinananatili ang kaugnayan nito sa babae.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: mula sa oras na iyon
  rationale: Malapit sa literal na anyo ng Griyego at pinananatili ang temporal na punto kung kailan nagsimula ang paggaling.
theological_decisions:
- issue: Kahulugan ng πίστις sa papuri ni Jesus
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Sa konteksto, pinupuri ni Jesus ang nananalig na paglapit ng babae. “Pananampalataya” ang pangunahing salin, habang inilalagay sa talababa ang lehitimong himig ng “pagtitiwala” nang hindi nilulutas nang labis ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ginang” upang maipakita ang magalang na tuwirang pagtawag sa babae nang hindi nagmumukhang mapanlait sa kasalukuyang gamit. Pinanatili ang maigsi at makapangyarihang anyo ng pahayag ni Jesus.
