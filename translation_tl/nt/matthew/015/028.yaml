  to: Pagkatapos, sumagot si Jesus sa kanya, “Ginang, napakalaki ng iyong pananampalataya![a] Mangyari sa iyo ayon sa nais mo.” At gumaling ang anak niyang babae mula sa oras na iyon.[b]
  rationale: Isang maliit na pagbabago lamang ang ginawa upang gawing mas likas ang Tagalog na utos ni Jesus. Napanatili ang magalang na rehistro, ang diwa ng “para sa iyo ayon sa nais mo,” at ang mga talababa sa wastong mga panandang [a] at [b].
