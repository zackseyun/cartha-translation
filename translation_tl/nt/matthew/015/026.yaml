  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: tl
  text: Ngunit sumagot siya, “Hindi nararapat na kunin ang tinapay ng mga anak at ihagis ito sa maliliit na aso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga asong alaga sa bahay” o “mga tuta.” Diminutibo ang salitang Griyego at maaaring magpahiwatig ng maliliit o alagang aso, sa halip na mga asong gala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Karaniwang ekspresyon ito sa Griyego na literal na ‘sumagot at sinabi’; likas at tumpak sa modernong Tagalog ang pinaikling ‘sumagot siya,’ na nagpapanatili sa diwang tugon.
- source_word: καλὸν
  choice: nararapat
  rationale: Sa pahayag na ito, tumutukoy ang καλόν sa pagiging angkop o marapat, hindi lamang sa pagiging mabuti sa moral na diwa.
- source_word: λαβεῖν
  choice: kunin
  rationale: Ipinapahayag ng pawatas ang pagkuha o pagdakot sa tinapay; ‘kunin’ ang tuwiran at likas na katumbas.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: ang tinapay ng mga anak
  rationale: Pinananatili ng ‘tinapay’ ang kongkretong larawan, at ang ‘mga anak’ ay hindi nagtatakda ng kasarian, gaya ng τέκνα.
- source_word: βαλεῖν
  choice: ihagis
  rationale: Pinananatili ng ‘ihagis’ ang masiglang literal na larawan ng βάλλω sa halip na palambutin ito bilang ‘ibigay.’
- source_word: τοῖς κυναρίοις
  choice: sa maliliit na aso
  rationale: Ang κυνάρια ay anyong diminutibo ng ‘aso’ at maaaring tumukoy sa maliliit o alagang aso; tuwirang naipapakita ng saling ito ang diminutibong anyo nang hindi isinasara ang ibang posibleng pahiwatig.
theological_decisions:
- issue: Ang talinghaga tungkol sa mga anak at mga aso ay maaaring ipaliwanag ayon sa etnisidad, priyoridad ng misyon, o tono ng nagsasalita.
  choice: Panatilihin nang tuwiran ang mga larawang ‘tinapay ng mga anak’ at ‘maliliit na aso’ nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin sa mismong salin kung sino ang kinakatawan ng mga anak at mga aso.
  rationale: Hindi tahasang pinapangalanan ng talata ang mga tinutukoy ng bawat larawan. Ang tuwirang salin ay nagpapanatili sa tindi, ambiguity, at teolohikal na tensiyon ng pahayag upang ang konteksto ang gumabay sa pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang ‘nararapat’ para sa angkop na diwa ng καλόν at ‘ihagis’ upang mapanatili ang talas ng larawan. Inilagay ang panandang [a] pagkatapos ng ‘maliliit na aso,’ ang salitang aktuwal na tinatalakay ng talababa.
