  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: tl
  text: Ngunit hindi siya sinagot ni Jesus kahit isang salita. Lumapit kay Jesus ang kanyang mga alagad at paulit-ulit na humiling, “Paalisin mo siya[a], dahil sumisigaw siya sa likuran natin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi ng mga alagad kung ibig nilang pagbigyan ni Jesus ang kahilingan ng babae at saka siya paalisin, o basta paalisin siya mula sa kanila.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sumusunod sa atin.” Ang Griyego ay maaaring tumukoy sa kinaroroonan sa likuran o sa pagsunod sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῇ λόγον
  choice: hindi siya sinagot ni Jesus kahit isang salita
  rationale: 'Pinananatili nito ang mariing diwa ng idyoma: wala siyang ibinigay na anumang tugon. Nilinaw ang simuno bilang si Jesus para maging likas at malinaw sa Tagalog.'
- source_word: προσελθόντες
  choice: Lumapit sa kanya
  rationale: Tuwirang ipinahahayag ang paglapit ng mga alagad kay Jesus at likas ito sa salaysay sa Tagalog.
- source_word: ἠρώτουν
  choice: patuloy na nakiusap
  rationale: Ipinakikita ng imperpektong anyo ang nagpapatuloy o paulit-ulit na pakiusap. Ang “nakiusap” ay angkop sa kasunod na pautos nang hindi labis na pinatitindi bilang pagmamakaawa.
- source_word: Ἀπόλυσον αὐτήν
  choice: Paalisin mo siya
  rationale: Likas na salin ito ng utos na ipadala o paalisin ang babae, habang hindi tahasang tinutukoy kung pagbibigyan muna ang kahilingan niya.
- source_word: κράζει
  choice: sumisigaw
  rationale: Ipinahahayag nito ang malakas at patuloy na pagtawag ng babae sa konteksto.
- source_word: ὄπισθεν ἡμῶν
  choice: sa likuran natin
  rationale: Pinananatili ang pangunahing pang-espasyong kahulugan, habang inilalagay sa talababa ang posibleng diwang sumusunod o humahabol.
theological_decisions:
- issue: Layunin ng mga alagad sa Ἀπόλυσον αὐτήν
  choice: Paalisin mo siya
  alternative: Pagbigyan mo siya at paalisin; o basta paalisin siya mula sa kanila
  rationale: Hindi sinasabi ng Griyegong utos kung ibig ng mga alagad na pagbigyan muna ni Jesus ang babae o basta itaboy siya. Pinananatiling bukas ng salin at talababa ang dalawang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at angkop sa karaniwang mambabasa. Ginamit ang “kanya/niya” sa halip na mas pormal o makalumang mga anyo, at iniwasang lutasin sa pangunahing teksto ang tunay na kalabuan ng utos ng mga alagad.
