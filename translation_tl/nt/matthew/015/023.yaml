  to: Ngunit hindi siya sinagot ni Jesus kahit isang salita. Lumapit kay Jesus ang kanyang mga alagad at paulit-ulit na humiling, “Paalisin mo siya[a], dahil sumisigaw siya sa likuran natin[b].”
  rationale: Pinalitan ang “patuloy na nakiusap” ng “paulit-ulit na humiling” upang mas tumpak na maipahayag ang paulit-ulit o nagpapatuloy na ἠρώτουν nang hindi dinaragdagan ang antas ng pagsusumamo. Pinanatili ang natitirang salin at mga talababa sapagkat tumpak, natural, at maayos na pinangangalagaan ng mga ito ang mga kalabuan sa Griyego.
