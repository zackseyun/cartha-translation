id: MAT.15.13
reference: Matthew 15:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: tl
  text: Ngunit sumagot siya, “Bawat halamang hindi itinanim ng aking Ama sa langit ay bubunutin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bawat tanim na hindi itinanim ng aking Ama sa langit ay bubunutin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Karaniwang pormulang pasalaysay ito na may impluwensiyang Semitiko. Sa natural na makabagong Tagalog, sapat na ang “sumagot siya”; ang literal na “sumagot at sinabi” ay labis na paulit-ulit.
- source_word: Πᾶσα
  choice: Bawat
  rationale: Ipinahahayag ng “Bawat” ang distributibong diwa at tumutugma sa isahang pangngalang sumusunod.
- source_word: φυτεία
  choice: halaman
  rationale: Maaaring tumukoy ang salita sa isang bagay na itinanim o sa pagtatanim. Ang “halaman” ay natural at pinananatiling malinaw ang larawang bubunutin ito.
- source_word: ἐφύτευσεν
  choice: itinanim
  rationale: Tuwirang pinananatili ang larawang pang-agrikultura at ang ugnayang leksikal nito sa φυτεία.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: aking Ama sa langit
  rationale: Natural at marangal na Tagalog ito na pinananatili kapwa ang “aking Ama” at ang paglalarawan sa kaniya bilang nasa langit.
- source_word: ἐκριζωθήσεται
  choice: bubunutin
  rationale: Ipinahahayag nito ang hinaharap na balintiyak na pagkilos ng pagbunot sa halaman. Sa Tagalog, likas nang ipinahihiwatig ng “bubunutin” sa kontekstong ito ang pagbunot mula sa ugat.
theological_decisions:
- issue: Ang tinutukoy ng metaporang “bawat halaman”
  choice: Panatilihin bilang “Bawat halaman” nang hindi tinutukoy kung mga aral, tradisyon, o mga tao ang ibig sabihin.
  alternative: Bawat aral; bawat tradisyon; bawat taong hindi itinanim ng Ama
  rationale: Hindi tahasang nilulutas ng Griyego ang tinutukoy ng metapora. Pinananatili ng salin ang larawan at ang teolohikal na tensiyon sa halip na magpasok ng isang tiyak na pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Iniwasan ang masalimuot na literalismong “sumagot at sinabi,” ngunit pinanatili ang bukas na metapora at ang larawang pang-agrikultura.
