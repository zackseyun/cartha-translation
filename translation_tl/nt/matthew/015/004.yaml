  source_fidelity: 'Ang pangunahing salin ay tapat sa Griyego: malinaw ang sanhi sa “Sapagkat,” ang utos na magbigay-galang, ang malawak na saklaw ng κακολογῶν, at ang pormulang legal na θανάτῳ τελευτάτω nang hindi nagdadagdag ng tahasang tagapagpatupad ng parusa. Ang “dapat mamatay” ay katanggap-tanggap na salin ng pormulang ito.'
  naturalness: Likas at angkop sa modernong Filipino Tagalog ang pangunahing teksto. Gayunman, ang “sumusumpa sa ama o ina” sa talababa ay maaaring mabasa bilang “nanunumpa sa” isang magulang, hindi bilang pagsumpa o pagmumura laban sa magulang. Kailangan ang “laban sa” upang maging malinaw ang nilalayong alternatibong diwa.
  terminology: Ang “igalang” ay angkop para sa τιμάω. Ang “nagsasalita ng masama laban sa” ay maingat na malawak para sa κακολογῶν; ang “sumusumpa laban sa” sa talababa ay isang malinaw na mas tiyak na alternatibo. Pinananatili ng pangunahing teksto ang legal na bigat nang walang doktrinal o interpretatibong dagdag.
