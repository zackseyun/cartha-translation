base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: tl
  text: Sapagkat sinabi ng Diyos, “Igalang mo ang iyong ama at ang iyong ina,” at, “Ang sinumang nagsasalita ng masama laban sa ama o ina ay dapat mamatay.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang sinumang sumusumpa laban sa ama o ina ay dapat patayin.”
    reason: Ipinakikita nito ang mas tiyak na posibleng diwa ng κακολογῶν at ang tahasang legal na pagkakasalin sa θανάτῳ τελευτάτω.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Sapagkat sinabi ng Diyos
  rationale: Ipinahahayag ng γάρ ang dahilan na sumusuporta sa argumento ni Jesus. Likas sa Tagalog ang “Sapagkat,” at hindi nito dinaragdagan ang diin sa Diyos.
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang ipinakikilala ng λέγω ang isang sipi. Pinananatili ng “sinabi” ang payak na diwa at hindi ito pinatitindi bilang “iniutos,” kahit pautos ang nilalaman ng sipi.
- source_word: Τίμα
  choice: Igalang mo
  rationale: Ipinahahayag ng τιμάω ang pagbibigay ng nararapat na dangal. Ang “igalang” ay malinaw, marangal, at mas mabigat kaysa sa mas mahinang “irespeto.”
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ang iyong ama at ang iyong ina
  rationale: Likas sa Tagalog ang paglalagay ng “iyong” sa sipi ng utos, at tumutugma ito sa ipinahihiwatig at sa pinagmulang utos sa Exodo.
- source_word: Ὁ κακολογῶν
  choice: Ang sinumang nagsasalita ng masama laban sa
  rationale: Ang κακολογέω ay maaaring tumukoy sa pagsasalita ng masama, paglalait, o pagsumpa. Pinananatili ng pangunahing salin ang mas malawak na saklaw ng salita; inilalagay sa talababa ang mas tiyak na “sumusumpa.”
- source_word: πατέρα ἢ μητέρα
  choice: ama o ina
  rationale: Pangkalahatan ang mga layon sa Griyego. Malinaw at maikli ang “ama o ina” nang hindi nagdaragdag ng panghalip na wala sa parirala.
- source_word: θανάτῳ τελευτάτω
  choice: ay dapat mamatay
  rationale: Isa itong mariing pormulang legal para sa parusang kamatayan. Ipinapakita ng “dapat mamatay” ang sapilitang bigat ng pautos ngunit hindi tahasang nagdaragdag ng tagapagsagawa ng kamatayan.
theological_decisions:
- issue: Pagkakasalin sa pormulang legal na θανάτῳ τελευτάτω
  choice: ay dapat mamatay
  alternative: ay dapat patayin
  rationale: Pinananatili ng pangunahing salin ang tindi ng parusang nasa kasulatang sinipi nang hindi ginagawang tahasan ang taong magsasagawa nito, sapagkat hindi tahasang binabanggit ng pariralang Griyego ang tagapagsagawa. Ang “dapat patayin” ay lehitimong alternatibo at inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na likas ngunit marangal. Ginamit ang “Sapagkat” upang malinaw na maiugnay ang talata sa naunang argumento, at pinanatili ang tuwirang anyo ng dalawang sipi. Ang panandang [a] ay inilagay pagkatapos ng ikalawang sipi dahil kapuwa ang pandiwang κακολογῶν at ang pormula ng parusa ang nililinaw ng talababa.
