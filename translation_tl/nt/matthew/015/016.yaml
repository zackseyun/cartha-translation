  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: tl
  text: Ngunit sinabi niya, “Kayo rin ba ay hindi pa rin nakauunawa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o pagbaling tungo sa tugon ni Jesus; likas itong naipapahayag ng “Ngunit” sa Filipino.
- source_word: ὁ … εἶπεν
  choice: sinabi niya
  rationale: Ang artikulong ὁ ay ginagamit na panghalip at tumutukoy kay Jesus, samantalang ang εἶπεν ay karaniwang pandiwang pasalaysay na “sinabi.”
- source_word: Ἀκμὴν
  choice: pa rin
  rationale: Ipinahahayag ng ἀκμήν na nagpapatuloy hanggang sa kasalukuyang sandali ang kakulangan nila sa pagkaunawa. Sa tanong na ito, likas at malinaw itong naihahatid ng “pa rin.”
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Binibigyang-diin ng καί na maging ang mga alagad ay kabilang sa mga hindi nakaunawa; pinananatili ng “kayo rin” ang diin ng tahasang ὑμεῖς.
- source_word: ἀσύνετοί ἐστε
  choice: hindi … nakauunawa
  rationale: Ang ἀσύνετος ay tumutukoy sa kawalan ng pagkaunawa o kabatiran. Ang pandiwang “nakauunawa” ay natural sa Filipino at hindi pinatitindi ang salita tungo sa mas mabigat na moral na hatol gaya ng “mangmang.”
theological_decisions:
- issue: Tono ng pagsaway ni Jesus sa mga alagad
  choice: Isang tuwirang tanong tungkol sa patuloy nilang hindi pagkaunawa
  alternative: “Kayo rin ba ay hanggang ngayon ay walang pang-unawa?”
  rationale: Pinananatili ng salin ang matalas na pagsaway sa Griyego nang hindi ito ginagawang mas mabigat na paghatol kaysa sa ipinahihiwatig ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakauunawa” sa halip na mas kolokyal na “nakakaunawa,” at iniwasan ang kalabisan ng sabay na “hanggang ngayon” at “pa rin.”
