  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: tl
  text: Pagkatapos niyang paalisin ang mga tao, sumakay siya sa bangka at pumunta sa rehiyon ng Magadan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Magdala” ang mababasa sa halip na “Magadan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Pagkatapos niyang paalisin
  rationale: Ipinahahayag ng aorist participle ang kilos na nauna sa pagsakay niya. Likas sa modernong Tagalog ang ganitong ayos at hindi ito nagdaragdag ng diwang wala sa Griyego.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Tumutukoy ito sa mga pulutong na naroon. Ang “mga tao” ang pinakanatural at malinaw na tawag sa kontekstong ito sa modernong Tagalog.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: sumakay siya sa bangka
  rationale: Ang parirala ay tumutukoy sa pagsakay o pagpasok sa isang sasakyang-dagat. Ang “sumakay sa bangka” ay natural at tiyak sa Tagalog.
- source_word: ἦλθεν
  choice: pumunta
  rationale: Bagaman karaniwang nangangahulugang “dumating” o “pumaroon” ang ἔρχομαι, ang “pumunta” ay natural sa salaysay ng paglalakbay mula sa pananaw ng tagapagsalaysay.
- source_word: τὰ ὅρια
  choice: nasasakupan
  rationale: Ang pangmaramihang salitang literal na tumutukoy sa mga hangganan ay ginagamit dito para sa heograpikong distrito o teritoryo. Ipinahahayag ng “nasasakupan” ang lugar, hindi lamang ang mismong guhit ng hangganan.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: Sinusunod at tinutumbasan sa baybay ang pangalang nasa SBLGNT. Hindi pinapalitan sa pangunahing teksto ng mas tradisyonal na ibang pagbasa.
theological_decisions:
- issue: Anyo ng pangalan ng lugar sa hulihan ng talata
  choice: Magadan
  alternative: Magdala
  rationale: Usaping tekstuwal at pangheograpiya ito, hindi pagpapasyang doktrinal. Sinusunod ng pangunahing teksto ang Μαγαδάν sa ibinigay na edisyong Griyego, habang inilalagay sa talababa ang kilalang ibang pagbasa upang maging malinaw ang ebidensiyang manuskrito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang karaniwang “bangka” at ang heograpikong “nasasakupan”; iniwasan ang lipas o labis na teknikal na pananalita.
