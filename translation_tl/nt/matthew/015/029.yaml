  naturalness: Mas natural at hindi malabo sa modernong Filipino ang «Pagkaalis ni Jesus doon» kaysa «Pag-alis doon ni Jesus». Ang natitirang ayos ng pangungusap ay malinaw at angkop sa marangal na pagsasalaysay.
