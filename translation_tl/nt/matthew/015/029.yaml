  register: Modernong Filipino na natural at marangal ang himig. Ginamit ang “Dagat ng Galilea” upang panatilihin ang tradisyonal at tuwirang katumbas ng θάλασσα, at iniwasan ang labis na literal na mga participial construction na magiging asiwa sa Tagalog.
