  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: tl
  text: Pagkaalis ni Jesus doon, pumunta siya sa tabi ng Dagat ng Galilea.[a] Pagkaakyat sa bundok, nakaupo siya roon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kahabaan ng Dagat ng Galilea.” Ang pang-ukol sa Griyego ay maaaring tumukoy sa pagpunta sa tabi ng dagat o sa pagkilos sa kahabaan nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naupo siya roon.” Gayunman, maaaring ipakita ng anyo ng pandiwa sa Griyego ang nagpapatuloy na kalagayan ng pag-upo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Pag-alis doon
  rationale: Ipinahahayag nang natural sa Tagalog ang kilos na nauna sa pangunahing pandiwa, habang tuwirang pinananatili ang ideya ng pag-alis mula sa dating lugar.
- source_word: ἦλθεν
  choice: pumunta siya
  rationale: Sa salaysay na Tagalog, ang “pumunta” ang natural na katumbas kapag inilalarawan ang pagkilos ni Jesus mula sa isang lugar patungo sa iba; hindi kailangan ng deiktikong “pumarito.”
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: sa tabi ng Dagat ng Galilea
  rationale: Ang παρά na may accusative at pandiwa ng pagkilos ay maaaring tumukoy sa pagpunta sa tabi o pagkilos sa kahabaan nito. Ang pangunahing teksto ay gumagamit ng natural na “sa tabi,” at inilalahad sa talababa ang tunay na posibleng kahulugang “sa kahabaan.”
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: Pagkaakyat sa bundok
  rationale: Pinananatili ng “pagkaakyat” ang pagkakasunod ng mga kilos ng aorist participle at ng pangunahing pandiwa. Ang “sa bundok” ay natural na paglalarawan ng pag-akyat patungo at paibabaw rito.
- source_word: ἐκάθητο ἐκεῖ
  choice: naupo siya roon
  rationale: Ang “naupo” ay malinaw at natural sa salaysay. Yamang maaaring idiin ng imperfect ang nagpapatuloy na kalagayan, ibinibigay sa talababa ang “nakaupo siya roon” bilang alternatibo.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng personal na pangalan sa modernong Filipino.
theological_decisions: []
