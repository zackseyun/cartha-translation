base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: tl
  text: “Pinararangalan ako ng bayang ito sa pamamagitan ng kanilang mga labi, ngunit malayo sa akin ang kanilang puso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang mga puso.” Isahan ang “puso” sa Griyego, malamang na ginamit nang kolektibo para sa buong bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ang bayang ito
  rationale: Ang λαός ay tumutukoy sa isang sambayanan bilang kabuuan. Pinananatili ng “ang bayang ito” ang demonstratibong οὗτος at ang himig ng sipi mula sa propeta.
- source_word: τοῖς χείλεσίν
  choice: sa pamamagitan ng kanilang mga labi
  rationale: Instrumental ang datibo. Pinananatili ng salin ang konkretong larawan ng mga labi sa halip na gawing abstraktong “mga salita” o “pananalita.”
- source_word: με τιμᾷ
  choice: Pinararangalan ako
  rationale: Ang τιμάω ay nangangahulugang magbigay o magpakita ng karangalan. Ang “pinararangalan” ay natural at marangal nang hindi pinalalakas ang diwa tungo sa “niluluwalhati.”
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ngunit ... ang kanilang puso
  rationale: Adbersatibo ang δέ, kaya “ngunit.” Pinananatili ang isahang καρδία bilang kolektibong paglalarawan sa panloob na saloobin ng buong bayan.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: malayo sa akin
  rationale: Tuwirang ipinahahayag nito ang distansiya at ugnayang pagkakahiwalay na isinasaad ng parirala, sa likas na ayos ng modernong Tagalog.
theological_decisions:
- issue: Kolektibong isahang “puso” o pamahaging maramihang “mga puso”
  choice: 'Pinanatili ang isahan: “ang kanilang puso”'
  alternative: “ang kanilang mga puso”
  rationale: Isahan ang καρδία sa Griyego at malamang na inilalarawan ang bayan bilang isang kabuuang may iisang panloob na saloobin. Iniiwasan nitong pakinisin nang labis ang retorika ng siping propetiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang konkretong “mga labi” at ang kolektibong isahang “puso,” habang ginamit ang likas na ayos na “malayo sa akin ang kanilang puso.”
