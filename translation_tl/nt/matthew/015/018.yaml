  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: tl
  text: Ngunit ang mga bagay na lumalabas mula sa bibig ay nagmumula sa puso, at ang mga iyon ang nagpaparumi sa tao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ginagawang marumi ang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: ang mga bagay na lumalabas
  rationale: Ang pangmaramihang participle ay ginagamit bilang pangngalan at tumutukoy sa pangkalahatang lumalabas sa bibig; pinananatili ng salin ang maramihan at ang konkretong larawan.
- source_word: ἐκ τοῦ στόματος
  choice: sa bibig
  rationale: Natural ito sa Filipino para sa pinanggagalingan ng sinasabi, habang pinananatili ang larawang pisikal ng teksto.
- source_word: ἐκ τῆς καρδίας ἐξέρχεται
  choice: ay nagmumula sa puso
  rationale: Malinaw na ipinahahayag ang pinagmulan. Ang “puso” ay nagpapanatili sa biblikal na larawan ng kalooban at panloob na pagkatao nang hindi ito nililimitahan sa damdamin lamang.
- source_word: κἀκεῖνα
  choice: at ang mga iyon
  rationale: Tuwirang itinuturo nito pabalik ang mga bagay na lumalabas sa bibig at pinananatili ang pangmaramihang reperensiya.
- source_word: κοινοῖ
  choice: nagpaparumi
  rationale: Sa konteksto ng kalinisan, ang pandiwa ay nangangahulugang gawing marumi o di-malinis ang isang tao. Ang “nagpaparumi” ay natural at pinananatili ang ugnayan sa usapin ng karumihan.
- source_word: τὸν ἄνθρωπον
  choice: sa tao
  rationale: Ang “tao” ay natural na kumakatawan sa sinumang tao sa Filipino at tumpak na naghahatid sa pangkalahatang gamit ng isahang ἄνθρωπος.
theological_decisions:
- issue: Pinagmumulan ng karumihang moral
  choice: Ipinakikita ng salin na ang nagpaparumi ay nagmumula sa puso at lumalabas sa bibig.
  alternative: Unawain ang talata bilang tumutukoy lamang sa ritwal na karumihan na dulot ng pananalita.
  rationale: Ipinaghahambing ng konteksto ang pumapasok mula sa labas at ang lumalabas mula sa loob. Pinananatili ng “puso” at “nagpaparumi” ang parehong antropolohikal at pangkalinisang diin nang hindi nilulutas nang labis ang tensiyon ng teksto.
- issue: Pangkalahatang isahang τὸν ἄνθρωπον
  choice: sa tao
  alternative: sa isang lalaki
  rationale: Bagaman isahan ang Griyego, pangkalahatan ang reperensiya nito. Sa Filipino, ang “tao” ay likas na pangkalahatan at hindi kinakailangang gawing tiyak sa kasariang lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong paralelismo ng “bibig” at “puso,” pati ang bokabularyo ng pagdudulot ng karumihan.
