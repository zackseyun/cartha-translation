base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: tl
  text: Ngunit lumapit siya at lumuhod sa harap niya[a], at sinabi, “Panginoon, tulungan mo ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang yumukod bilang paggalang, magbigay-pugay, o sumamba, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang bahagyang pagsalungat sa naunang tugon: sa kabila nito, nagpumilit ang babae.'
- source_word: ἐλθοῦσα
  choice: lumapit siya
  rationale: Ang aorist participle ng ἔρχομαι ay likas na isinalin bilang pandiwang may panahunan; sa konteksto, ipinakikita nitong lumapit siya kay Jesus.
- source_word: προσεκύνει αὐτῷ
  choice: lumuhod sa harap niya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagyukod o pagpapatirapa bilang paggalang, pagbibigay-pugay, o pagsamba. Inilalarawan ng salin ang nakikitang kilos nang hindi ipinapasya ang buong teolohikal na kahulugan nito.
- source_word: λέγουσα
  choice: na nagsasabi
  rationale: Pinananatili nito ang kasabay na kilos at tuwirang ipinakikilala ang sinabi ng babae.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang κύριε ay isang magalang at mabigat na pantawag kay Jesus; pinananatili ng “Panginoon” ang karaniwang salin at ang posibleng mas malalim na kabuluhan nito.
- source_word: βοήθει μοι
  choice: tulungan mo ako
  rationale: Direkta at likas nitong ipinahahayag sa modernong Tagalog ang maikli at apurahang pakiusap.
theological_decisions:
- issue: Kahulugan ng προσκυνέω na nakatuon kay Jesus
  choice: lumuhod sa harap niya
  alternative: sumamba sa kanya
  rationale: Saklaw ng pandiwa ang pisikal na pagyukod o pagpapatirapa, pagbibigay-pugay, at pagsamba. Ang pangunahing salin ay hindi labis na nagpapasya sa intensiyong teolohikal ng babae, habang pinananatili sa talababa ang lehitimong kahulugang “sumamba.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lumapit” sa halip na literal na “dumating” dahil ang kilos ay patungo kay Jesus. Ang “lumuhod sa harap niya” ay natural at pinananatili ang pisikal na diwa ng kilos, kasama ang talababa para sa mas teolohikal na alternatibo.
