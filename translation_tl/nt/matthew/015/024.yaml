id: MAT.15.24
reference: Matthew 15:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: tl
  text: Ngunit sumagot siya, “Hindi ako isinugo kundi sa mga nawawalang tupa ng sambahayan ng Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ngunit sumagot siya
  rationale: Likas na pinagsasama sa Tagalog ang participle na ἀποκριθείς at ang finite verb na εἶπεν bilang “sumagot siya”; ipinahihiwatig na nito na nagsalita siya bilang tugon. Ang “Ngunit” ay angkop sa bahagyang pagsalungat ng δέ sa daloy ng salaysay.
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: Hindi ako isinugo kundi
  rationale: Pinananatili nito ang tahasang anyong pasibo at ang mapaghigpit na konstruksiyong οὐκ ... εἰ μή. Natural sa marangal na modernong Tagalog ang “hindi ... kundi” at mas malapit ito sa anyo ng Griyego kaysa sa pagpapakahulugang “para lamang.”
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: mga nawawalang tupa
  rationale: Pinananatili ang metapora ng πρόβατα. Ang perfect participle na ἀπολωλότα ay tumutukoy sa mga tupang nasa kalagayang naligaw o nawala; ang “nawawalang” ay natural at hindi nagpapahiwatig ng ganap nang pagkapahamak.
- source_word: οἴκου Ἰσραήλ
  choice: sambahayan ng Israel
  rationale: Ang “sambahayan” ay malinaw at dignidad na katumbas ng οἶκος bilang kolektibong sambahayan o bayan, habang pinananatili ang biblikal na idyoma at iniiwasang ipakahulugan ito bilang literal na gusali.
theological_decisions:
- issue: Saklaw ng ipinahayag na pagsusugo kay Jesus sa salitang ito
  choice: 'Panatilihin ang tahasang paglilimita: “Hindi ako isinugo kundi...”'
  alternative: Gawing prayoridad lamang ang Israel, gaya ng “Una akong isinugo...” o idagdag ang kalaunang misyon sa mga bansa.
  rationale: Hayagang mapaghigpit ang Griyegong Οὐκ ... εἰ μή. Dapat manatili ang tensiyong teolohikal sa tagpong ito at hindi ito palambutin o lutasin sa pamamagitan ng ideyang hindi nakasaad sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “isinugo” upang mapanatili ang diwa ng banal na atas o misyon, at “sambahayan ng Israel” upang maingatan ang kolektibo at biblikal na larawan ng οἶκος Ἰσραήλ.
