  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: tl
  text: Hindi ang pumapasok sa bibig ang nagpaparumi sa tao,[a] kundi ang lumalabas mula sa bibig—iyon ang nagpaparumi sa tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpapaging di-malinis.” Ang pandiwang Griyego ay maaaring tumukoy sa paggawa sa isang tao na di-malinis sa usapin ng kadalisayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: nagpaparumi
  rationale: Sa usapin ng kadalisayan, ipinahihiwatig ng pandiwa ang paggawa sa isang tao na marumi o di-malinis, hindi ang simpleng pagdungis lamang. Likas sa modernong Tagalog ang “nagpaparumi” at naiiwan nitong bukás ang ritwal at moral na pahiwatig.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ang pumapasok sa bibig
  rationale: Ang substantibong participle ay natural na naipapahayag bilang “ang pumapasok,” at malinaw na napapanatili ng “sa bibig” ang kongkretong larawan.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ang lumalabas sa bibig
  rationale: Ang “lumalabas” ay kasalukuyan at natural na katumbas ng participle, habang ipinakikita ng “sa bibig” ang pinagmumulan ayon sa karaniwang gamit sa Tagalog.
- source_word: ἄνθρωπον
  choice: sa tao
  rationale: Ang “tao” ay eksaktong karaniwang katumbas ng ἄνθρωπος sa Tagalog at likas nang maaaring tumukoy sa sinumang tao, kaya hindi kailangang magpasok ng kasarian na wala sa kahulugan ng konteksto.
- source_word: τοῦτο
  choice: iyon
  rationale: Tahasan nitong pinananatili ang demonstratibong diin sa bagay na kalalabas lamang banggitin; mas natural ang “iyon” sa pagtukoy pabalik sa “ang lumalabas sa bibig.”
- source_word: οὐ ... ἀλλὰ
  choice: Hindi ... kundi ...
  rationale: Ito ang natural at malinaw na Tagalog na balangkas para sa mariing pagtanggi at pagsalungat ng dalawang sugnay.
theological_decisions:
- issue: Saklaw ng wikang pangkadalisayan sa κοινοῖ
  choice: Isinalin bilang “nagpaparumi” upang mapanatili ang parehong ritwal at moral na pahiwatig.
  alternative: “nagpapaging di-malinis” o “dumudungis”
  rationale: Ang konteksto ay tungkol sa kadalisayan, ngunit hindi dapat paliitin ang pahayag sa seremonyal na kalagayan lamang. Ang “nagpaparumi” ay madaling maunawaan at may sapat na lawak.
- issue: Pangkalahatang gamit ng ἄνθρωπον
  choice: Isinalin bilang “tao,” na likas na pangkalahatan sa Tagalog.
  alternative: “isang tao” o “lalaki”
  rationale: Bagaman akusatibong panlalaking anyo ang nasa Griyego, ang ἄνθρωπος dito ay kumakatawan sa isang tao sa pangkalahatan. Ang “lalaki” ay maling maglilimita sa kasarian; ang “tao” ang tumpak at natural na katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang magkatapat na ayos at pag-uulit ng orihinal, pati ang diin ng demonstratibong τοῦτο. Ang tandang [a] ay inilagay kaagad pagkatapos ng unang “tao” upang malinaw ang saklaw ng leksikal na paliwanag.
