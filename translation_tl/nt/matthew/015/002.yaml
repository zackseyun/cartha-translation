  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: tl
  text: “Bakit nilalabag ng mga alagad mo ang tradisyon ng mga nakatatanda? Sapagkat hindi nila hinuhugasan ang kanilang mga kamay kapag kumakain sila ng tinapay[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang kaugaliang paghuhugas ng kamay na hinihingi ng tradisyon ng mga nakatatanda, hindi lamang ang karaniwang paghuhugas para sa kalinisan.
    reason: cultural_note
  - marker: b
    text: O “kapag kumakain sila.” Ang salitang Griego para sa “tinapay” ay maaari ring tumukoy sa pagkain o kainan sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Bakit
  rationale: Ito ang natural at tuwirang paraan sa modernong Tagalog upang itanong ang dahilan.
- source_word: οἱ μαθηταί σου
  choice: mga alagad mo
  rationale: Ang “alagad” ay malinaw at karaniwang katawagan para sa μαθητής sa konteksto ng pagsunod sa isang guro.
- source_word: παραβαίνουσιν
  choice: nilalabag
  rationale: Ipinapahayag nito ang paglabag sa isang kinikilalang tuntunin o tradisyon nang hindi gumagamit ng labis na teknikal na salita.
- source_word: τὴν παράδοσιν
  choice: ang tradisyon
  rationale: Tumutukoy ito sa kaugaliang itinuro at ipinamana na may kinikilalang awtoridad; mas eksakto ito kaysa sa payak na “kaugalian.”
- source_word: τῶν πρεσβυτέρων
  choice: ng mga nakatatanda
  rationale: Pinananatili nito ang katawagang “elders” para sa mga kinikilalang naunang tagapagturo o awtoridad, sa halip na ipakahulugang mga ninuno lamang o matatanda ayon sa edad.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: Sapagkat hindi nila hinuhugasan ang kanilang mga kamay
  rationale: Tuwirang inililipat ang paliwanag na γάρ at ang paghuhugas ng isang bahagi ng katawan, kasama ang tahasang pagmamay-ari ng mga kamay.
- source_word: ὅταν
  choice: kapag
  rationale: Ang “kapag” ay natural na nagpapahayag ng paulit-ulit o karaniwang pangyayari.
- source_word: ἄρτον
  choice: tinapay
  rationale: Ito ang literal na kahulugan ng ἄρτος. Pinananatili ito sa teksto habang inilalagay sa talababa ang posibleng mas malawak na kahulugang “pagkain” o “kainan.”
- source_word: ἐσθίωσιν
  choice: kumakain sila
  rationale: Ang payak na pangkasalukuyang anyo ay angkop sa pangkalahatan o nakaugaliang kilos na ipinahihiwatig ng sugnay.
theological_decisions:
- issue: Kalikasan ng tinutukoy na paghuhugas ng kamay
  choice: Inilahad sa pangunahing teksto bilang usapin ng pagsunod sa tradisyon ng mga nakatatanda, nang hindi tahasang tinatawag na ritwal o seremonyal na paghuhugas.
  alternative: Tahasang isalin bilang seremonyal na paghuhugas, o ituring lamang na karaniwang kalinisan.
  rationale: Ang mismong talata ay nag-uugnay sa paghuhugas sa “tradisyon ng mga nakatatanda.” Hindi nito ganap na ipinapaliwanag sa pangungusap kung paano isinasagawa o inuuri ang paghuhugas, kaya hindi iyon dapat tahasang ipasya sa pangunahing teksto.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinili ang “mga nakatatanda” upang ipahiwatig ang mga kinikilalang tagapagdala ng tradisyon, bagaman nililinaw ng konteksto at talababa na hindi lamang edad ang tinutukoy. Napanatili ang literal na “tinapay” at ang paliwanag na “Sapagkat” upang masundan ang anyo at lohika ng tekstong Griego.
