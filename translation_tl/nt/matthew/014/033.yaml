  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “At ang mga nasa bangka” ay wastong tumutukoy sa οἱ ... ἐν τῷ πλοίῳ; ang “sumamba sa kanya” ay isang makatuwirang pagsasalin ng προσεκύνησαν αὐτῷ sa kontekstong ito. Napanatili ang mariing pagpapatunay ng Ἀληθῶς sa “Tunay ngang,” gayundin ang titulong “ang Anak ng Diyos” para sa θεοῦ υἱὸς.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “at sinabi” ay katanggap-tanggap na idiomatikong paghahayag ng kasabay na participle na λέγοντες, kahit mas malapit sa estruktura ng Griyego ang “na nagsasabi.”
  terminology: Ang “sumamba,” “Anak ng Diyos,” at “Diyos” ay pare-pareho, angkop sa rehistro, at hindi nagpapasok ng doktrinang lampas sa saklaw ng teksto. Maayos ring inilalahad ng mga talababa ang leksikal na saklaw ng προσκυνέω at ang pagiging titulo ng θεοῦ υἱὸς.
