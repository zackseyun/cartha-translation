id: MAT.14.33
reference: Matthew 14:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: tl
  text: At ang mga nasa bangka ay sumamba sa kanya[a] at sinabi, “Tunay ngang ikaw ang Anak ng Diyos.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumukod sa kanya,” “nagpatirapa sa harap niya,” o “nagbigay-pugay sa kanya.” Maaaring tumukoy ang pandiwang Griyego sa paggalang na ipinapakita sa pagyukod o pagpapatirapa; sa kontekstong ito, sinusuportahan ang saling “sumamba.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Anak ka ng Diyos.” Walang pantukoy sa Griyego bago ang “Diyos,” ngunit sa kontekstong ito, ang “Anak ng Diyos” ay ginagamit bilang titulo at hindi nangangahulugang “isang anak ng Diyos” lamang.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: At ang mga
  rationale: Mahinang pang-ugnay ang δέ at hindi kinakailangang magpahiwatig ng pagsalungat; natural sa salaysay ang “At.” Ang οἱ ay tumutukoy sa mga taong nasa bangka.
- source_word: ἐν τῷ πλοίῳ
  choice: nasa bangka
  rationale: Ito ang natural at malinaw na modernong Tagalog para sa mga taong nasa loob o sakay ng bangka.
- source_word: προσεκύνησαν αὐτῷ
  choice: sumamba sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagyukod, pagpapatirapa, pagbibigay-pugay, o pagsamba. Dahil sa kapangyarihang ipinakita ni Jesus sa dagat at sa kasunod na pagkilalang siya ang Anak ng Diyos, “sumamba” ang pinakamalamang na diwa rito; pinananatili sa talababa ang pisikal at leksikal na alternatibo.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Bagaman pandiwaring pangkasalukuyan ang λέγοντες, mas natural sa Tagalog na ihayag ang kasabay na pananalita bilang “at sinabi” kaysa “na nagsasabi.”
- source_word: Ἀληθῶς
  choice: Tunay nga
  rationale: Ang Ἀληθῶς ay mariing pagpapatunay. Pinananatili ng “Tunay nga” ang bigat ng pahayag sa natural na Tagalog.
- source_word: θεοῦ υἱὸς
  choice: ang Anak ng Diyos
  rationale: Bagaman walang pantukoy sa Griyego bago ang θεοῦ, hindi nito hinihingi ang di-tiyak na kahulugang “isang anak ng Diyos.” Sa konteksto, gumaganap ang parirala bilang isang tiyak na titulo.
- source_word: εἶ
  choice: ikaw ang
  rationale: Natural na ayos ito sa Tagalog para sa tuwirang pagpapahayag na “you are,” kasunod ang tiyak na titulo.
theological_decisions:
- issue: Diwa ng προσκυνέω na iniukol kay Jesus
  choice: sumamba sa kanya
  alternative: yumukod sa kanya / nagbigay-pugay sa kanya
  rationale: Sinusuportahan ng agarang konteksto—ang kapangyarihan ni Jesus sa dagat at ang kasunod na pagkilala sa kanya bilang Anak ng Diyos—ang diwang “sumamba.” Gayunman, hindi ikinukubli ng talababa na maaari ring ilarawan ng pandiwa ang paggalang na ipinapakita sa pagyukod o pagpapatirapa.
- issue: Pagkatiyak ng θεοῦ υἱὸς
  choice: ang Anak ng Diyos
  alternative: Anak ng Diyos / isang anak ng Diyos
  rationale: Ang kawalan ng pantukoy sa anyong Griyego ay hindi awtomatikong nagpapaging di-tiyak sa parirala. Sa eksenang ito sa Mateo, ang parirala ay isang pagkilala o titulo; magiging kulang sa lakas ang “isang anak ng Diyos.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kanya” sa halip na mas pormal o makalumang anyo, at “bangka” bilang karaniwang salita. Ang “Tunay nga” ay nagpapanatili ng taimtim na tono nang hindi nagiging lipas o labis na teknikal.
