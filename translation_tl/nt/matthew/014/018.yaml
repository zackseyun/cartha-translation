  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: tl
  text: Ngunit sinabi niya[a], “Dalhin ninyo rito sa akin ang mga iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang mga tinapay at isdang binanggit sa naunang talata.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Isang banayad na pang-ugnay ang δέ; ang “Ngunit” ay likas na nagpapakita ng pagsalungat ng tugon ni Jesus sa sinabi ng mga alagad sa naunang talata.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Tuwirang isinasalin nito ang aorist ng λέγω nang hindi idinaragdag ang diwang mas tahasang pag-uutos na maaaring ipahiwatig ng “inutusan.”
- source_word: Φέρετέ
  choice: Dalhin ninyo
  rationale: Ang present active imperative na pangmaramihan ay isang utos sa mga alagad na dalhin ang tinutukoy na mga bagay; natural at tumpak ito sa makabagong Filipino.
- source_word: μοι
  choice: sa akin
  rationale: Malinaw at likas na ipinapahayag ng pariralang ito ang direksiyon ng kilos patungo kay Jesus.
- source_word: ὧδε
  choice: rito
  rationale: Ang ὧδε ay tumutukoy sa lugar na kinaroroonan ng nagsasalita; sa utos na may kilos patungo sa nagsasalita, natural sa Filipino ang “rito.”
- source_word: αὐτούς
  choice: ang mga iyon
  rationale: Ang panlalaking pangmaramihang panghalip ay tumutukoy ayon sa konteksto sa mga tinapay at isda sa naunang talata. Pinananatili ng “ang mga iyon” ang panghalip sa pangunahing teksto, habang nililinaw ng talababa ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ninyo” upang ipakita ang pangmaramihang kausap, at ang “rito” bilang likas na katumbas ng kilos patungo sa nagsasalita.
