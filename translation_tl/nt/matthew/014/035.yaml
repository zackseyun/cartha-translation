  source_fidelity: Tumpak ang “makilala siya,” “mga lalaki,” “dinala sa kanya,” at “lahat ng maysakit.” Gayunman, ang “nagpadala sila sa buong karatig na lupain” ay nag-iiwan ng pandiwang Tagalog na walang likas na layon at hindi natural na naipahahayag ang ipinahiwatig na pagpapadala sa Griyego.
  naturalness: Kailangan ang ligtas na pag-aayos sa sugnay na “nagpadala sila.” Ang “nagsugo sila” ay likas na modernong Filipino at angkop sa konteksto, kung saan ang mga tao mula sa paligid ay nagdala ng mga maysakit kay Jesus.
  terminology: Ang “mga lalaki” ay wastong katumbas ng ἄνδρες; ang “maysakit” ay malinaw at natural para sa κακῶς ἔχοντας. Ginamit ang “karatig na pook” para sa περίχωρος bilang nakapaligid na rehiyon, hindi bilang isang bansa o malawak na lupain.
