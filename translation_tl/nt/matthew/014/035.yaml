translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tiyak na pagtukoy sa mga lalaki at ang di-binanggit na layon ng “nagpadala,” habang ginawang natural ang idyoma para sa pagkakasakit.
