  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: tl
  text: At nang makilala siya ng mga lalaki sa lugar na iyon, nagsugo sila sa buong karatig na pook at dinala sa kanya ang lahat ng maysakit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lahat ng masama ang lagay,” isang idyomang Griyego para sa mga may sakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες αὐτόν
  choice: nang makilala siya
  rationale: Ipinahihiwatig ng aorist participle na nakilala o natukoy nila si Jesus nang makita siya; hindi ito tumutukoy sa mas malawak na pagkakilala sa kanya sa ugnayang personal.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: ang mga lalaki sa lugar na iyon
  rationale: Tiyak na tumutukoy ang ἄνδρες sa mga lalaki, samantalang ang τόπος ay ang lokalidad na iyon.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: nagpadala sila sa buong karatig na lupain
  rationale: Pinananatili ng salin ang di-tiyak na layon ng pandiwang ἀπέστειλαν; maaaring mensahe o mga sugo ang ipinadala. Ang περίχωρος ay ang nakapaligid o karatig na lugar.
- source_word: προσήνεγκαν αὐτῷ
  choice: dinala sa kanya
  rationale: Sa kontekstong ito, ang προσφέρω ay karaniwang pagdadala ng mga tao kay Jesus, hindi paghahandog sa rituwal na diwa.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ang lahat ng maysakit
  rationale: Ang κακῶς ἔχειν ay idyomang Griyego para sa pagiging may sakit o masama ang lagay; natural at malinaw sa Filipino ang “maysakit.”
