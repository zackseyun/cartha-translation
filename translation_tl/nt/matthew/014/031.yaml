id: MAT.14.31
reference: Matthew 14:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: tl
  text: Agad na iniunat ni Jesus ang kanyang kamay at hinawakan siya. Sinabi niya sa kanya, “Kay liit ng iyong pananampalataya! Bakit ka nag-alinlangan[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-urong-sulong.” Ang pandiwang Griyego ay maaaring tumukoy sa pag-aatubili o pag-uurong-sulong, gayundin sa pag-aalinlangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Agad
  rationale: Likas at malinaw na ipinahahayag ang agarang pagkilos at ang apurahang daloy ng salaysay.
- source_word: δὲ
  choice: —
  rationale: Hindi na tahasang isinalin sapagkat sapat na ang natural na pagkakasunod ng mga pangyayari; ang pagdaragdag ng “ngunit” o “at” ay maaaring maging pilit.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat ... ang kanyang kamay
  rationale: Pinananatili ang kongkretong larawan at ang pagkilos na nauna sa paghawak.
- source_word: ἐπελάβετο αὐτοῦ
  choice: hinawakan siya
  rationale: Natural na Tagalog para sa mahigpit o mapagligtas na paghawak, nang hindi dinaragdagan ang paraan ng pagkilos na hindi tahasang sinasabi ng Griyego.
- source_word: λέγει αὐτῷ
  choice: Sinabi niya sa kanya
  rationale: Ginamit ang karaniwang nagdaang panahunan sa salaysay sa Tagalog sa halip na gayahin nang mekanikal ang makasaysayang pangkasalukuyan ng Griyego.
- source_word: Ὀλιγόπιστε
  choice: Kay liit ng iyong pananampalataya!
  rationale: Direktang panawag at pagsaway ito tungkol sa kulang na pananampalataya, hindi ganap na kawalan nito. Natural itong pakinggan sa modernong Tagalog.
- source_word: εἰς τί
  choice: Bakit
  rationale: Pinakanatural na katumbas ng pariralang patanong sa kontekstong ito.
- source_word: ἐδίστασας
  choice: nag-alinlangan
  rationale: Sinasaklaw ang pag-aalinlangan o pag-uurong-sulong nang hindi ito pinatitindi tungo sa ganap na kawalan ng pananampalataya.
theological_decisions:
- issue: Kahulugan ng Ὀλιγόπιστε kaugnay ng πίστις
  choice: Kay liit ng iyong pananampalataya!
  alternative: Ikaw na may maliit na pananampalataya
  rationale: Pinananatili ang diin sa kulang na pananampalataya at hindi inilalarawan si Pedro bilang lubusang walang pananampalataya.
- issue: Saklaw ng ἐδίστασας
  choice: nag-alinlangan
  alternative: nag-urong-sulong
  rationale: 'Hindi nilulutas nang makitid ang leksikal na tensiyon: maaaring tumukoy ang pandiwa sa pagdududa, pag-aalinlangan, o pag-uurong-sulong.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maging natural ang salaysay at tuwirang pananalita, habang pinananatili ang agarang pagkakasunod ng mga kilos.
