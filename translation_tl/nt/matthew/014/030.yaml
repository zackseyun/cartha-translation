id: MAT.14.30
reference: Matthew 14:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: tl
  text: Ngunit nang makita niya ang malakas na hangin[a], natakot siya. At nang magsimula siyang lumubog, sumigaw siya, “Panginoon, iligtas mo ako![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “marahas na hangin.”
    reason: lexical_alternative
  - marker: b
    text: O, “sagipin mo ako.” Ang pandiwang Griyego ay maaaring tumukoy sa pagliligtas mula sa agarang panganib, gayundin sa kaligtasan sa mas malawak na diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: nang makita niya
  rationale: Ipinahahayag ang kasabay na pangyayari sa natural na Tagalog habang pinananatili ang ugnayan ng pagkakita niya sa hangin at ng pagkatakot niya.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ang biglang pagbaligtad mula sa naunang matagumpay na paglakad ni Pedro sa ibabaw ng tubig.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: ang malakas na hangin
  rationale: Tuwiran at likas na salin ng pariralang tumutukoy sa lakas ng hangin; hindi nito pinalalabis ang paglalarawan.
- source_word: ἐφοβήθη
  choice: natakot siya
  rationale: Ipinakikita ng anyong pandiwa ang pagsisimula ng takot bilang tugon sa nakita niya.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: nang magsimula siyang lumubog
  rationale: 'Pinananatili ang aspektong pasimula: nagsisimula pa lamang siyang lumubog, kaya hindi ito isinaling parang tuluyan na siyang nalunod.'
- source_word: ἔκραξεν λέγων
  choice: sumigaw siya
  rationale: Natural na Tagalog para sa malakas at apurahang pagsamo; hindi na kailangang idagdag ang literal ngunit paulit-ulit na “na sinasabi.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang katumbas ng κύριος sa tuwirang pagtawag kay Jesus at pinananatili ang bigat ng titulo.
- source_word: σῶσόν με
  choice: iligtas mo ako
  rationale: Tumpak sa apurahang utos-pakiusap para sa pagliligtas mula sa agarang panganib, habang pinananatili rin ang mas malawak na saklaw ng pandiwang σῴζω.
theological_decisions:
- issue: Pagtutumbas sa κύριος bilang tuwirang tawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ang karaniwang katumbas ng κύριος at nagpapanatili ng posibleng kristolohikal na bigat nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Pagtutumbas sa σῴζω sa konteksto ng agarang pisikal na panganib
  choice: iligtas mo ako
  alternative: sagipin mo ako
  rationale: Ang “iligtas” ay angkop sa agarang panganib at pinananatili rin ang mas malawak na semantikong kaugnayan ng pandiwa sa kaligtasan; hindi nito nililimitahan ang salita sa pisikal na pagsagip lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na mga sugnay na “nang” para katawanin ang mga participle ng Griyego nang hindi nagiging matigas o labis na literal. Inilipat ang panandang [b] sa mismong pariralang “iligtas mo ako,” sapagkat iyon ang salitang tinatalakay ng talababa.
