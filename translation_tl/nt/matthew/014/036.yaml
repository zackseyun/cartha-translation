  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: tl
  text: At nagmakaawa sila sa kanya na mahipo man lamang nila ang laylayan[a] ng kanyang damit. At lahat ng nakahipo rito ay gumaling[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gilid” o “palawit.” Ang salitang Griyego ay maaaring tumukoy sa laylayan o gilid ng kasuotan, at posibleng kasama rito ang palawit nito.
    reason: lexical_alternative
  - marker: b
    text: O “naibalik sa mabuting kalagayan.” Maaari ring mangahulugan ang pandiwang Griyego na “naligtas,” ngunit pisikal na paggaling ang tinutukoy sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: nagmakaawa
  rationale: Ipinapahayag nito ang taimtim at patuloy na pakiusap na ipinahihiwatig ng imperfect na pandiwa, at mas matindi ito kaysa sa simpleng “nakiusap.”
- source_word: ἵνα μόνον ἅψωνται
  choice: na mahawakan man lamang nila
  rationale: Likas sa modernong Tagalog ang pariralang “man lamang” at naipakikita nito na ang hinihiling nila ay kahit simpleng paghipo lamang.
- source_word: τοῦ κρασπέδου
  choice: ang laylayan
  rationale: Ang κράσπεδον ay maaaring tumukoy sa gilid, laylayan, o palawit ng kasuotan. Malinaw at hindi labis na espesipiko ang “laylayan,” habang ipinapaliwanag sa talababa ang ibang posibilidad.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ng kanyang damit
  rationale: Pangkalahatang tawag sa kasuotan ang ἱμάτιον. Hindi ipinapalagay ng “damit” kung balabal o damit na mahaba ang tinutukoy.
- source_word: ὅσοι
  choice: lahat ng
  rationale: Natural na Tagalog ito para sa distributibong diwang “sinumang/lahat ng” at malinaw na saklaw nito ang bawat humawak.
- source_word: ἥψαντο
  choice: humawak dito
  rationale: Sa kontekstong ito, ang ἅπτω ay nangangahulugang humipo o humawak. Ang “dito” ay natural na tumutukoy pabalik sa laylayan ng damit.
- source_word: διεσώθησαν
  choice: gumaling
  rationale: Bagaman maaaring mangahulugan ang διασῴζω ng pagliligtas o ganap na pagpapanumbalik, pisikal na pagpapagaling ang malinaw na konteksto rito. Pinananatili ng talababa ang mas malawak na saklaw ng salita.
theological_decisions:
- issue: Kahulugan ng διεσώθησαν sa salaysay ng himalang pagpapagaling
  choice: pisikal na paggaling (“gumaling”)
  alternative: “naligtas” o “lubusang napabuti ang kalagayan”
  rationale: Ang agarang konteksto ay pagpapagaling sa mga maysakit. Hindi ginagawang tahasang pahayag tungkol sa espirituwal na kaligtasan ang talata, ngunit binabanggit sa talababa ang mas malawak na maaaring kahulugan ng pandiwa.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang taimtim na tono ng pakiusap at iniwasang gawing labis na espesipiko ang uri ng kasuotan o ang anyo ng laylayan.
