  naturalness: Natural ang pangungusap sa kabuuan, ngunit mas malinaw at mas eksakto ang "mahipo" at "nakahipo" kaysa "mahawakan" at "humawak."
  terminology: Ang "laylayan ng kanyang damit" ay angkop na malawak na katumbas ng κράσπεδον τοῦ ἱματίου αὐτοῦ. Pinananatili ng talababa ang mga posibleng alternatibo nang hindi ipinipilit na tassel ang tinutukoy. Ang talababa sa διεσώθησαν ay inayos upang hindi magmungkahi ng di-kinakailangang diwang "lubusan."
