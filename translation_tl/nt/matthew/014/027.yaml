base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: tl
  text: 'Ngunit agad na nagsalita si Jesus sa kanila: “Lakasan ninyo ang inyong loob! Ako ito.[a] Huwag kayong matakot.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Ako ay.” Sa kontekstong ito, maaari itong maging payak na pagkilala ni Jesus sa sarili, bagaman maaaring marinig ng ilan ang posibleng alingawngaw ng pagpapakilala ng Diyos sa sarili.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: agad
  rationale: Malinaw at likas na ipinahahayag ang agarang pagkilos sa makabagong Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa takot ng mga alagad sa naunang talata.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: silang kinausap ni Jesus at sinabi
  rationale: Likas sa Tagalog at pinananatili ang kilos ng pagsasalita at ang pagpapakilala sa tuwirang sinabi.
- source_word: Θαρσεῖτε
  choice: Lakasan ninyo ang inyong loob
  rationale: Karaniwang panawagan sa Tagalog na humihimok ng tapang at pagtitiwala; naipakikita rin ng “ninyo” na maramihan ang utos.
- source_word: ἐγώ εἰμι
  choice: Ako ito
  rationale: Likas na pansariling pagkakakilanlan sa konteksto ng pagpapapanatag sa mga natatakot na alagad.
- source_word: μὴ φοβεῖσθε
  choice: Huwag kayong matakot
  rationale: Malinaw at natural na salin ng maramihang negatibong pautos nang hindi labis na tinutukoy ang aspekto.
theological_decisions:
- issue: Kung ang ἐγώ εἰμι ay simpleng pagkakakilanlan o posibleng alingawngaw ng banal na pagpapakilala
  choice: Ginamit sa pangunahing teksto ang “Ako ito” bilang likas na pagkakakilanlan sa agarang konteksto.
  alternative: “Ako nga” o mas literal na “Ako ay”
  rationale: Pinapanatag ni Jesus ang mga alagad sa pamamagitan ng pagkilala sa sarili. Pinananatili ng talababa ang mas literal na anyo at ang posibleng mas malalim na teolohikal na alingawngaw nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Lakasan ninyo ang inyong loob” bilang natural na panawagan sa tapang, at ang maramihang “ninyo/kayo” upang mapanatili ang bilang ng mga utos sa Griyego.
