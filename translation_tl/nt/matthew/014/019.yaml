  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: tl
  text: At matapos niyang utusan ang mga tao na maupo nang nakahilig sa damuhan, kinuha niya ang limang tinapay at ang dalawang isda, tumingala sa langit, bumasbas[a], at matapos niyang pagputul-putulin ang mga tinapay, ibinigay niya ang mga ito sa mga alagad; at ibinigay naman ito ng mga alagad sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “pinuri niya ang Diyos” o “nagbigkas siya ng basbas.” Sa Griyego, “bumasbas” lamang ang nakasaad; hindi tahasang binabanggit ang layon.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: matapos niyang utusan
  rationale: Ipinahahayag ang naunang kilos ng aorist participle at pinananatili ang lakas ng isang malinaw na utos.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Natural sa makabagong Filipino para sa mga nagkakatipong karamihan; ang maramihang diwa ay sapat na naipahahayag sa konteksto.
- source_word: ἀνακλιθῆναι
  choice: humilig
  rationale: Pinananatili ang diwa ng pag-upo nang nakahilig para sa pagkain, sa halip na gawing pangkalahatang 'umupo' lamang.
- source_word: ἐπὶ τοῦ χόρτου
  choice: sa damuhan
  rationale: Tuwirang nagsasaad ng lugar at hindi idinaragdag ang 'luntian,' na wala sa teksto ni Mateo.
- source_word: λαβὼν
  choice: kinuha niya
  rationale: Ginawang tahasang pandiwa para sa natural na daloy ng salaysay habang pinananatili ang pagkakasunod-sunod ng kilos.
- source_word: τοὺς πέντε ἄρτους
  choice: ang limang tinapay
  rationale: Sa Filipino, natural na tumutukoy ang binilang na 'tinapay' sa mga buong piraso o loaf nang hindi kailangang idagdag ang 'bilog' o ibang anyo.
- source_word: τοὺς δύο ἰχθύας
  choice: ang dalawang isda
  rationale: Karaniwang modernong Filipino at eksaktong pinananatili ang bilang.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: tumingala siya sa langit
  rationale: Natural at tuwirang salin ng kilos at direksiyon ng tingin.
- source_word: εὐλόγησεν
  choice: binasbasan
  rationale: Pinananatiling walang tahasang layon ang pandiwa, gaya ng Griyego, upang huwag ipasiya kung ang tinutukoy ay ang Diyos, ang pagkain, o ang pagbigkas ng basbas.
- source_word: κλάσας
  choice: pinagpira-piraso niya ang mga tinapay
  rationale: Ipinahahayag ang aktuwal na paghahati-hati ng tinapay bago ito ibigay; nililinaw ang ipinahiwatig na layon mula sa konteksto.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: ibinigay sa mga alagad
  rationale: Natural ang Filipino na hindi na ulitin ang layon dahil malinaw itong tumutukoy sa mga tinapay na pinagpira-piraso.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ibinigay naman ng mga alagad sa mga tao
  rationale: Ipinapahayag ang pandiwang eliptikal sa Griyego upang maging malinaw at natural sa Filipino; ipinakikita ng 'naman' ang paglipat ng tagapagbigay.
theological_decisions:
- issue: Hindi tahasang layon ng εὐλόγησεν
  choice: 'Panatilihing walang layon: ''binasbasan.'''
  alternative: Binendisyunan niya ang pagkain; o nagpuri siya sa Diyos/nagbigkas ng basbas.
  rationale: Walang tahasang layon ang pandiwang Griyego. Ang hindi pagdaragdag ng 'ang mga ito' o 'ang Diyos' ay nagpapanatili sa tunay na kalabuan at umiiwas sa sapilitang teolohikal na pagpapasiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'humilig' upang mapanatili ang kaugalian ng paghilig habang kumakain, at iniwasan ang sobrang pormal na 'karamihan' kung saan mas natural ang 'mga tao.'
