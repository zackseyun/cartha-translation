  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: tl
  text: Kumain silang lahat at nabusog, at tinipon nila ang labindalawang basket na punô ng mga pirasong natira[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga putol-putol na piraso.” Ang salitang Griyego ay maaaring tumukoy sa mga pirasong nabali o naputol, lalo na ng tinapay, na natira pagkatapos kumain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: kumain
  rationale: Payak na aspektong perpektibo ang likas na salin sa salaysay at tuwirang naghahayag ng ginawang pagkain.
- source_word: πάντες
  choice: silang lahat
  rationale: Ginagawang hayag ang ipinahihiwatig na simuno at pinananatili ang saklaw na walang naiiwan sa karamihan.
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Likas at maikli sa modernong Tagalog; ipinahihiwatig na nakakain sila nang sapat hanggang sa lubos na mabusog.
- source_word: ἦραν
  choice: tinipon nila
  rationale: Bagaman pangunahing nangangahulugang ‘buhatin’ o ‘kunin,’ sa konteksto ng mga natira ay natural na tumutukoy sa pangangalap o pagtitipon ng mga ito.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: ang mga pirasong natira
  rationale: Natural na ipinapahayag sa Tagalog ang natirang labis mula sa mga pinagputul-putol na piraso, nang hindi pinabibigat ang pangungusap.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: labindalawang basket na punô
  rationale: Pinananatili ang bilang, sisidlan, at ganap na pagkapuno ng mga basket sa maikli at malinaw na parirala.
theological_decisions:
- issue: Paglalarawan sa kaganapan ng mahimalang pagpapakain sa karaniwang wika ng pagkabusog
  choice: nabusog
  alternative: napuno
  rationale: Tapat itong naghahayag na nakakain ang lahat nang sapat, nang hindi nagdaragdag ng teolohikal na paliwanag o nagpapahina sa ganap na paglalaan na isinasalaysay.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “basket” bilang karaniwang salitang Filipino; ang gitling-pahaba ay malinaw na nag-uugnay sa dami ng natipong mga natira.
