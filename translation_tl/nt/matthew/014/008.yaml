  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: tl
  text: At siya, na inudyukan ng kanyang ina, ay nagsabi, “Ibigay mo sa akin dito, sa isang bandehado, ang ulo ni Juan na Tagapagbautismo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa nakagawiang tawag, “Juan Bautista.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: dahil sinulsulan
  rationale: Ipinahihiwatig ng pasibong pandiwari na naimpluwensiyahan muna siya ng kanyang ina. Likas sa Filipino ang “sinulsulan” para sa pag-uudyok sa isang masamang kahilingan, nang hindi ito ginagawang pormal na tagubilin.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: ng kanyang ina
  rationale: Ang ὑπό na may genitive ang tumutukoy sa gumagawa ng kilos sa pasibong konstruksyon.
- source_word: Δός μοι
  choice: Ibigay mo sa akin
  rationale: Tuwirang utos ito at natural na naihahayag sa Filipino sa anyong “Ibigay mo sa akin.”
- source_word: φησίν
  choice: ay nagsabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Filipino ang pangnagdaang “nagsabi,” nang hindi binabago ang kahulugan.
- source_word: ὧδε
  choice: dito
  rationale: Pinananatili ang tuwirang deiktikong kahulugan na tumutukoy sa lugar at posibleng agarang paghaharap.
- source_word: ἐπὶ πίνακι
  choice: sa isang bandehado
  rationale: Sa konteksto ng piging, ang πίναξ ay malaking pinggan o bandehado na mapaglalagyan at mapaghahainan; “bandehado” ang malinaw at likas na katumbas.
- source_word: τὴν κεφαλὴν
  choice: ang ulo
  rationale: Tuwirang pinananatili ang tahasan at marahas na detalye ng salaysay.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: ni Juan na Tagapagbautismo
  rationale: Ang βαπτιστής ay pangngalang tumutukoy sa taong nagbabautismo. Inililinaw ng “Tagapagbautismo” ang gawain ni Juan, samantalang inilalagay sa talababa ang nakagawiang titulo.
theological_decisions:
- issue: Pagsasalin sa titulong βαπτιστής ni Juan
  choice: Juan na Tagapagbautismo
  alternative: Juan Bautista
  rationale: Pinananatili ng “Tagapagbautismo” ang mapaglarawang diwa ng Griyegong agent noun at iniiwasang ituring lamang itong bahagi ng pangalan. Inilalahad sa talababa ang pamilyar at tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bandehado” bilang karaniwang salita sa malaking pinggang panghain at “Tagapagbautismo” upang maipakita ang mapaglarawang lakas ng titulo.
