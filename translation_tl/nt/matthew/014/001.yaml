  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: tl
  text: Nang panahong iyon, narinig ng tetrarkang si Herodes ang balita tungkol kay Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ulat tungkol kay Jesus.”
