lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa modernong Tagalog na nagpapanatili sa kahulugang “sa panahong iyon.”
- source_word: ἤκουσεν
  choice: nabalitaan
  rationale: Sa konteksto ng kasunod na τὴν ἀκοὴν, natural na ipinahahayag nito na narinig o nalaman ni Herodes ang kumakalat na balita, nang hindi dinaragdagan ang nilalaman.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Karaniwang anyo ng pangalang ito sa mga saling Tagalog ng Bibliya.
- source_word: ὁ τετραάρχης
  choice: na tetrarka
  rationale: Pinananatili ang tiyak na makasaysayang titulong pampolitika sa halip na palitan ito ng mas malawak na “pinuno.”
- source_word: τὴν ἀκοὴν Ἰησοῦ
  choice: ang tungkol kay Jesus
  rationale: Kasama ng “nabalitaan,” ito ay natural na Tagalog para sa ulat o balitang narinig tungkol kay Jesus; iniiwasan ang di-likas na pag-uulit na “nabalitaan ang balita.”
