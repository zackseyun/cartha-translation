  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: tl
  text: Ngunit nang makita nilang naglalakad siya sa ibabaw ng dagat, nasindak ang mga alagad at sinabi nila, “Multo[a] iyon!” At sumigaw sila dahil sa takot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aparisyon” o “multong anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ito ng banayad na pagsalungat o biglang pagbabago mula sa naunang tagpo tungo sa takot ng mga alagad.
- source_word: οἱ μαθηταὶ ἰδόντες αὐτόν
  choice: nang makita siya ng mga alagad
  rationale: Ginawang likas na temporal na sugnay sa Tagalog ang aorist participle, habang pinananatili ang pagkakasunod ng pangyayari.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: na naglalakad sa ibabaw ng lawa
  rationale: Malinaw na ipinahahayag ng “sa ibabaw” ang paglakad sa rabaw ng tubig. “Lawa” ang likas na katawagan sa anyong-tubig na tinutukoy sa konteksto, bagaman θάλασσα ang salitang Griyego.
- source_word: ἐταράχθησαν
  choice: nasindak sila
  rationale: Ipinahahayag ng “nasindak” ang matinding pagkabigla at takot na ipinakikita ng kasunod nilang pagsigaw, nang hindi dinaragdagan ang diwa.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Likas na Tagalog na paraan ito upang ipakilala ang kanilang kasabay na bulalas.
- source_word: Φάντασμά ἐστιν
  choice: Multo iyan!
  rationale: Ang “multo” ang pinakakaraniwan at madaling maunawaang katumbas ng φάντασμα sa makabagong Tagalog. Ang “iyan” ay likas sa pagtukoy nila sa nakikitang anyo sa malayo.
- source_word: καὶ ἀπὸ τοῦ φόβου ἔκραξαν
  choice: At napasigaw sila sa takot
  rationale: Ipinakikita ng “napasigaw” ang malakas at di-kusang sigaw, samantalang malinaw na pinananatili ng “sa takot” ang sanhi nito.
theological_decisions:
- issue: Ang kalikasan ng φάντασμα sa bulalas ng mga alagad
  choice: “Multo” sa pangunahing teksto
  alternative: “Anyo” o “aparisyon”
  rationale: Iniuulat ng talata ang maling palagay ng mga alagad dahil sa takot, hindi nito pinagtitibay bilang doktrina ang pag-iral o kalikasan ng mga multo. Pinananatili ng salin ang pananaw nila sa tagpo nang hindi gumagawa ng dagdag na teolohikong pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lawa” bilang likas na katawagan sa Dagat ng Galilea sa Filipino, at “sa ibabaw” upang hindi mapagkamalang naglalakad lamang sa tabing-lawa. Inilipat ang talababa sa “Multo,” ang salitang talagang tinutukoy ng leksikal na alternatibo.
