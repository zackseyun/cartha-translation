  source_fidelity: Kailangang baguhin ang “lawa” tungo sa “dagat.” Bagaman ang Dagat ng Galilea ay isang lawa sa heograpiya, θάλασσα ang terminong nasa Griyego at “dagat” ang tuwirang katumbas nito sa talata. Napananatili ng “sa ibabaw ng dagat” ang diwang paglakad sa ibabaw ng anyong-tubig.
  naturalness: Likas at malinaw ang pangkalahatang daloy, ngunit mas tuwiran at natural ang “nang makita nilang naglalakad siya” kaysa sa konstruksyong maaaring pansamantalang magmukhang ang “mga alagad” ang inilalarawan ng kasunod na parirala. Ang “sumigaw sila dahil sa takot” ay mas neutral na katumbas ng ἔκραξαν kaysa “napasigaw,” na maaaring magpahiwatig ng di-kusang reaksyon.
  terminology: Ang “mga alagad,” “multo,” at “takot” ay angkop sa modernong Filipino Tagalog at sa antas ng salaysay. Ang “multo” ay wastong pangunahing salin para sa φάντασμα bilang iniulat na akala ng mga alagad; pinananatili ng talababa ang mga leksikal na alternatibo.
