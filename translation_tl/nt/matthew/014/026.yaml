- from: Ngunit nang makita siya ng mga alagad na naglalakad sa ibabaw ng lawa, nasindak sila at sinabi, “Multo[a] iyan!” At napasigaw sila sa takot.
  to: Ngunit nang makita nilang naglalakad siya sa ibabaw ng dagat, nasindak ang mga alagad at sinabi nila, “Multo[a] iyon!” At sumigaw sila dahil sa takot.
  rationale: Pinalitan ang “lawa” ng “dagat” upang sundin ang θάλασσα sa pinagmulan. Inayos ang ayos ng pangungusap para maging malinaw na si Jesus ang naglalakad, at ginawang “sumigaw sila dahil sa takot” ang huling sugnay upang maipahayag nang neutral ang ἀπὸ τοῦ φόβου ἔκραξαν. Napanatili ang “Multo” at ang talababa, na nagpapakita na ang bulalas ay pananaw ng mga alagad at hindi pahayag na doktrinal.
