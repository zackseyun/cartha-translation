id: MAT.14.23
reference: Matthew 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: tl
  text: Pagkatapos niyang paalisin ang mga pulutong ng tao, umakyat siya sa bundok nang mag-isa[a] upang manalangin. Pagsapit ng gabi, nag-iisa siya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang sarilinan.”
    reason: Ipinakikita ang alternatibong diwa ng κατ’ ἰδίαν, na maaaring tumukoy sa pagiging mag-isa o sa pagkilos nang pribado.
lexical_decisions:
- source_word: ἀπολύσας
  choice: Pagkatapos niyang paalisin
  rationale: Ipinapahayag ng aorist participle ang kilos na nauna sa pag-akyat; natural sa Tagalog ang sugnay na temporal na “Pagkatapos niyang…”. Ang “paalisin” ay angkop sa pagpapauwi o pagpapaalis sa mga nagkakatipon nang walang idinadagdag na diwa.
- source_word: τοὺς ὄχλους
  choice: ang mga pulutong ng tao
  rationale: Pinananatili nito ang maramihang anyo at ang diwa ng magkakatipong mga tao, samantalang malinaw pa rin sa karaniwang mambabasa.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: umakyat siya sa bundok
  rationale: Natural at tuwirang inilalarawan nito ang pagpunta sa mataas na bahagi ng bundok, ayon sa ἀναβαίνω at εἰς τὸ ὄρος.
- source_word: κατ’ ἰδίαν
  choice: nang mag-isa
  rationale: Natural sa modernong Tagalog at angkop sa konteksto ng paglayo niya sa iba upang manalangin. Inilalahad sa talababa ang posibleng diwang “nang sarilinan.”
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin ng pag-akyat, gaya ng infinitive of purpose sa Griyego.
- source_word: ὀψίας δὲ γενομένης
  choice: Pagsapit ng gabi
  rationale: Maikli at natural na salin ng genitive absolute na nagsasaad ng temporal na kalagayan o paglipat sa susunod na tagpo.
- source_word: μόνος ἦν ἐκεῖ
  choice: nag-iisa siya roon
  rationale: Pinananatili nito ang diin sa pagiging nag-iisa at ang lokatibong ἐκεῖ sa natural na ayos ng Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “upang” sa halip na mas kolokyal na “para” upang mapanatili ang dignidad ng salaysay, at “mga pulutong ng tao” upang mapanatili ang plural at kolektibong diwa ng Griyego.
