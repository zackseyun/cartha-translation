  source_fidelity: 'Tapat ang salin sa pagkakasunod ng mga kilos at sa mahahalagang detalye ng Griyego: nauna ang pagpapauwi/pagpapaalis sa mga pulutong, saka ang pag-akyat sa bundok upang manalangin; malinaw rin ang pag-iisa niya nang dumating ang gabi. Ang “nang mag-isa” at “nag-iisa” ay angkop na pinananatili ang magkahiwalay na paglitaw ng κατ’ ἰδίαν at μόνος.'
  naturalness: Natural, malinaw, at marangal ang modernong Tagalog. Ang “Pagkatapos niyang paalisin,” “umakyat siya sa bundok,” at “Pagsapit ng gabi” ay maayos at hindi pilit. Ang “mga pulutong ng tao” ay bahagyang mas pormal kaysa “mga tao,” ngunit malinaw at wasto para sa kolektibong maramihang diwa ng ὄχλους.
  terminology: Wasto at pare-pareho ang mga pangunahing termino. Ang “upang manalangin” ay malinaw na nagpapahayag ng layunin. Ang talababa ay wastong nagbibigay ng leksikal na alternatibo para sa κατ’ ἰδίαν nang hindi binabago ang kahulugan ng teksto.
