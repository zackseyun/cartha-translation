base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: tl
  text: Kaagad niyang pinilit ang mga alagad na sumakay sa bangka at mauna sa kanya patungo sa kabilang panig, hanggang sa paalisin niya[a] ang mga pulutong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, pauwiin ang mga pulutong.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Kaagad
  rationale: Likas at malinaw na ipinahahayag ang biglaan at mabilis na paglipat ng salaysay.
- source_word: ἠνάγκασεν
  choice: pinilit
  rationale: Pinananatili ang diwa ng matinding pag-uutos o pamimilit, nang hindi nagdaragdag ng pisikal na dahas na hindi tahasang nasa teksto.
- source_word: τοὺς μαθητάς
  choice: ang mga alagad
  rationale: Tumutukoy ang pantukoy sa kilala nang pangkat; hindi idinagdag ang “niya” dahil hindi ito tahasang kasama sa parirala.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: na sumakay sa bangka
  rationale: Natural na modernong Tagalog para sa pagsakay o pagpasok sa isang bangka.
- source_word: πλοῖον
  choice: sa bangka
  rationale: Bagaman walang pantukoy sa Griyego, isang tiyak na bangka ang ipinahihiwatig ng konteksto, at natural sa Tagalog ang anyong ito.
- source_word: προάγειν αὐτόν
  choice: at mauna sa kanya
  rationale: Tumpak na ipinahahayag na mauunang umalis ang mga alagad kaysa kay Jesus.
- source_word: εἰς τὸ πέραν
  choice: patungo sa kabilang ibayo
  rationale: Karaniwang pariralang tumutukoy sa kabilang panig ng lawa at angkop sa marangal na salaysay.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: hanggang sa mapaalis niya
  rationale: Pinananatili ang inaasahang pangyayaring susunod sa pangunahing utos at ang hangganang ipinahahayag ng ἕως οὗ.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Natural sa modernong Tagalog bilang kolektibong tawag sa mga nagkakatipon; hindi kailangang piliting gawing tahasang maramihan ang “mga pulutong.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinilit” upang mapanatili ang lakas ng ἀναγκάζω, at “kabilang ibayo” bilang pamilyar ngunit hindi lipas na pananalita para sa kabilang panig ng lawa.
