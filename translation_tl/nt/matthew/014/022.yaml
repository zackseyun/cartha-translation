  - severity: low
    issue: '"kabilang ibayo" para sa εἰς τὸ πέραν'
    rationale: Hindi ito ang pinakanatural na modernong Filipino at semantikong magkakapatong ang "kabilang" at "ibayo." "Kabilang panig" ang malinaw na katumbas.
  revised_text: Kaagad niyang pinilit ang mga alagad na sumakay sa bangka at mauna sa kanya patungo sa kabilang panig, hanggang sa paalisin niya[a] ang mga pulutong.
