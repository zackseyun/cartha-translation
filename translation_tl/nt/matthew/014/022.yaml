- from: Kaagad niyang pinilit ang mga alagad na sumakay sa bangka at mauna sa kanya patungo sa kabilang ibayo, hanggang sa mapaalis niya[a] ang mga tao.
  to: Kaagad niyang pinilit ang mga alagad na sumakay sa bangka at mauna sa kanya patungo sa kabilang panig, hanggang sa paalisin niya[a] ang mga pulutong.
  rationale: Pinalitan ang "kabilang ibayo" ng mas natural na "kabilang panig." Pinalitan ang "mapaalis" ng "paalisin" upang maipahayag ang karaniwang kahulugan ng ἀπολύω sa konteksto—ang pormal na pagpapauwi o pagpapalis sa mga pulutong—nang walang pahiwatig ng pagpapataboy. Ginawang "mga pulutong" ang ὄχλους upang mapanatili ang hayag na maramihan ng pinagmulan.
