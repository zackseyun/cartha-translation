base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: tl
  text: At bagaman gusto niya itong patayin[a], natakot siya sa karamihan, sapagkat itinuturing nila itong propeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas malapit sa anyong Griyego: “At gusto niyang patayin ito, natakot siya sa karamihan.” Ipinakikita ng “bagaman” ang concessive na ugnayang ipinahihiwatig ng konteksto.'
    reason: lexical_alternative
  - marker: b
    text: O “kinikilala nila itong propeta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: bagaman gusto niya
  rationale: 'Ang participle ay literal na ‘gusto’ o ‘nagnanais,’ ngunit sa konteksto ay concessive ang ugnayan nito sa pangunahing pandiwa: gusto niya itong patayin, subalit napigilan siya ng takot. Likas sa makabagong Tagalog ang ‘bagaman gusto niya.’'
- source_word: ἀποκτεῖναι
  choice: patayin
  rationale: Tuwirang katumbas ito ng infinitive na nangangahulugang pumatay; hindi idinaragdag ang moral na pahiwatig ng ‘paslangin.’
- source_word: ἐφοβήθη
  choice: natakot siya sa
  rationale: Natural at tumpak na salin ng aorist ng φοβέομαι sa salaysay.
- source_word: τὸν ὄχλον
  choice: mga tao
  rationale: Sa kontekstong ito, ang ὄχλος ay ang nagkakatipong karamihan. Mas natural sa karaniwang Tagalog ang ‘mga tao’ kaysa ‘karamihan,’ habang hindi ito ginagawang sangkatauhan sa pangkalahatan.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng takot; ang ‘sapagkat’ ay malinaw at marangal na pangsalaysay.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: kinikilala nila itong isang propeta
  rationale: Ang idiom na ἔχω na may predicate accusative ay nagpapahayag ng pagturing o pagkilala sa isang tao bilang propeta. Pinananatili ng ‘kinikilala’ ang pagtataya ng mga tao nang hindi sinasabing tiyak na hatol ito ng tagapagsalaysay.
theological_decisions:
- issue: Hindi tahasang pinangalanan sa Griyego ang simuno at layon
  choice: Panatilihin ang mga panghalip na ‘niya’ at ‘ito’
  alternative: Tukuyin sila bilang Herodes at Juan
  rationale: Malinaw sa kalapit na konteksto kung sino ang tinutukoy, at ang hindi pagdaragdag ng mga pangalan ay mas malapit sa anyo ng tekstong Griyego.
- issue: Ugnayan ng participle na θέλων sa pangunahing pandiwa
  choice: 'Isalin bilang concessive: ‘bagaman gusto niya’'
  alternative: Mas literal na ‘sa kagustuhan niyang’ o ‘gusto niyang’
  rationale: Ipinakikita ng konteksto ang tensiyon sa pagitan ng hangaring pumatay at ng takot sa mga tao. Ginagawang malinaw ng concessive na salin ang likas na lohika ng pangungusap nang hindi inaalis ang literal na alternatibo, na nakatala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘mga tao’ bilang natural na katumbas ng crowd sa konteksto at ang ‘kinikilala’ para sa idiom ng pagturing bilang propeta. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
