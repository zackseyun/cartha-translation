source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: tl
  text: Nang gumagabi na, lumapit sa kanya ang mga alagad at sinabi, “Liblib ang lugar na ito, at huli na ang oras. Paalisin mo ang mga tao upang pumunta sila sa mga nayon at bumili ng pagkain para sa sarili nila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Nang gumagabi na
  rationale: Ang genitive absolute ay nagsasaad ng paglipat ng panahon. Natural sa makabagong Tagalog ang “Nang gumagabi na,” at hindi na kailangang tumbasan nang hiwalay ang δέ bilang panimulang pantukoy sa takbo ng salaysay.
- source_word: προσῆλθον αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at natural na katumbas ng paglapit o pagpunta sa isang tao.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tinutukoy ng artikulo ang kilalang pangkat ng mga alagad; hindi kailangang idagdag ang “niya,” na hindi tahasang nasa Griyego.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Liblib ang lugar na ito
  rationale: Sa konteksto, inilalarawan ang lugar na malayo sa pamayanan, hindi kinakailangang isang disyerto o ganap na tiwangwang. Ang “na ito” ay likas na paraan sa Tagalog upang tukuyin ang kasalukuyang lugar.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: gabi na
  rationale: Idyomatikong ipinahihiwatig ng parirala na lumampas na ang oras at huli na sa araw. Ang “gabi na” ay malinaw at natural sa konteksto, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Paalisin mo na ang mga tao
  rationale: Ang ἀπολύω rito ay nangangahulugang paalisin o pauwiin ang mga nagkakatipon. Ang “mga tao” ay natural na tumutukoy sa mga pulutong sa Tagalog; ang “na” ay angkop sa agarang mungkahi dahil gabi na.
- source_word: ἵνα ἀπελθόντες
  choice: upang makapunta sila
  rationale: Pinagsasama nang natural sa Tagalog ang layuning ipinahahayag ng ἵνα at ang kilos ng participle na ἀπελθόντες.
- source_word: εἰς τὰς κώμας
  choice: sa mga nayon
  rationale: Ang κώμη ay maliit na pamayanan o nayon. Hindi idinagdag ang “kalapit,” sapagkat ipinahihiwatig lamang iyon ng konteksto at hindi tahasang sinabi.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: makabili ng pagkain para sa kanilang sarili
  rationale: Pinananatili ang layuning bumili ng pagkain at ang reflexive na diin ng ἑαυτοῖς.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “liblib” sa halip na “disyerto” upang hindi magdagdag ng heograpikong kahulugang hindi hinihingi ng ἔρημος. Isang talababa lamang ang inilagay sa tunay na idyomatikong pag-aangkop; ang mga marker sa tekstong Ingles ay tila hindi tugma sa kani-kanilang talababa, kaya ibinatay ang marker sa mismong Griyego.
