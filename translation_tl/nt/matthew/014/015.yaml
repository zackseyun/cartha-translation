- from: Nang gumagabi na, lumapit sa kanya ang mga alagad at sinabi, “Liblib ang lugar na ito, at gabi na.[a] Paalisin mo na ang mga tao upang makapunta sila sa mga nayon at makabili ng pagkain para sa kanilang sarili.”
  to: Nang gumagabi na, lumapit sa kanya ang mga alagad at sinabi, “Liblib ang lugar na ito, at huli na ang oras. Paalisin mo ang mga tao upang pumunta sila sa mga nayon at bumili ng pagkain para sa sarili nila.”
  rationale: Pinalitan ang “gabi na” ng “huli na ang oras” upang mapanatili ang idyomatikong kahulugan ng Griyego nang hindi itinatakda ang mas tiyak na oras ng gabi. Inalis ang talababa sapagkat ang literal na alternatibo ay hindi kinakailangan kapag malinaw na isinalin sa pangunahing teksto. Pinagaan din ang layuning sugnay para mas tuwirang maipahayag ang pag-alis patungo sa mga nayon.
