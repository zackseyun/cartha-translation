  - severity: low
    issue: Ang “makapunta sila” ay bahagyang may modal na himig.
    rationale: 'Ang ἵνα ἀπελθόντες ay layunin ng pagpapalis: upang umalis/pumunta sila. Mas tuwiran ang “upang pumunta sila.”},{'
