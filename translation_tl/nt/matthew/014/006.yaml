id: MAT.14.6
reference: Matthew 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: tl
  text: Ngunit nang sumapit ang pagdiriwang ng kaarawan ni Herodes[a], sumayaw sa gitna[b] ang anak na babae ni Herodias at nalugod si Herodes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang sumapit ang kaarawan ni Herodes” o “sa pagdiriwang ng kaarawan ni Herodes.” Tumutukoy ang Griyego sa okasyon ng paggunita sa kanyang kaarawan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kalagitnaan.” Malamang na nangangahulugang sumayaw siya sa gitna ng mga nagtitipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: nang sumapit ang pagdiriwang ng kaarawan ni Herodes
  rationale: Ipinahihiwatig ng parirala ang pagdating o pagdaraos ng okasyon ng kaarawan, hindi lamang ang petsa nito. Likas sa Tagalog ang “nang sumapit ang pagdiriwang” bilang temporal na panimula.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinananatili nito ang banayad na pagsalungat o paglipat sa takbo ng salaysay.
- source_word: ὠρχήσατο
  choice: sumayaw
  rationale: Tuwiran at natural itong katumbas ng pandiwang Griyego, nang hindi dinaragdagan ang uri o paraan ng pagsayaw.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ang anak na babae ni Herodias
  rationale: Tapat ito sa ugnayang ipinahahayag ng genitive at hindi ipinapasok ang pangalang Salome, na hindi binabanggit sa talata.
- source_word: ἐν τῷ μέσῳ
  choice: sa gitna
  rationale: Pinananatili nito ang literal na diwa ng parirala habang natural sa makabagong Tagalog; malamang na tumutukoy ito sa gitna ng mga nagtitipon.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: nalugod si Herodes
  rationale: Natural itong pagpapahayag sa Tagalog na nasiyahan o natuwa si Herodes sa sayaw, nang walang idinadagdag na motibo.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herodes
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog na Bibliya.
theological_decisions: []
