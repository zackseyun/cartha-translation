  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: tl
  text: Ngunit sinabi nila sa kanya, “Wala kaming iba rito kundi limang tinapay at dalawang isda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit ... nila
  rationale: Ang οἱ ay tumutukoy sa mga alagad na naunang binanggit, at ang δέ ay nagpapahayag ng banayad na pagsalungat sa naunang utos ni Jesus. Likas sa Tagalog na katawanin ang paksa sa panghalip na “nila” sa pandiwang parirala.
- source_word: λέγουσιν αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa salaysay na Tagalog ang pangnagdaan na “sinabi,” nang hindi binabago ang tungkulin nito sa diskurso.
- source_word: Οὐκ ἔχομεν
  choice: Wala tayo
  rationale: Ang negadong pahayag ng pag-aari ay likas na ipinahahayag sa Tagalog sa pamamagitan ng “wala.” Ginamit ang inklusibong “tayo” dahil kausap ng mga alagad si Jesus at ang pahayag ay tungkol sa pagkaing nasa kanilang kinaroroonan; hindi tahasang itinatangi ng Griyego ang inklusibo at eksklusibong 'we'.
- source_word: ὧδε
  choice: rito
  rationale: Ang ὧδε ay pang-abay na panlunan na nangangahulugang “dito.” Ang “rito” ay likas pagkatapos ng salitang nagtatapos sa patinig at tumutukoy sa kanilang kinaroroonan.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Pagkatapos ng negadong sugnay, ang εἰ μή ay naghahayag ng eksepsiyon, kaya ang “maliban sa” ang tumpak at natural na katumbas.
- source_word: πέντε ἄρτους
  choice: limang tinapay
  rationale: Ang ἄρτους ay tumutukoy sa mabibilang na mga tinapay. Sa modernong Tagalog, sapat at natural ang “limang tinapay”; hindi kailangang idagdag ang “piraso” o “bilog.”
- source_word: δύο ἰχθύας
  choice: dalawang isda
  rationale: Ang ἰχθύας ay maramihang anyo ng “isda,” na natural na ipinahahayag bilang “dalawang isda” sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang tuwirang sagot at banayad na pagsalungat ng mga alagad. Walang talababa dahil ang literal na negadong konstruksyon ng Griyego ay natural at ganap nang naipahahayag ng “Wala tayo rito maliban sa...”
