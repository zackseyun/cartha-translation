  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: tl
  text: Sumagot sa kanya si Pedro, “Panginoon, kung ikaw nga iyan, utusan mo akong lumapit sa iyo sa ibabaw ng tubig[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pangmaramihan ang salitang isinaling “tubig” sa Griyego: “mga tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Sumagot sa kanya si Pedro
  rationale: Likas na pormulang pasalaysay sa Tagalog. Hindi kailangang isalin nang hiwalay ang δέ at εἶπεν dahil sapat nang naipahihiwatig ng “sumagot” ang pag-uugnay at pagsasalita.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag at ang posibleng bigat na kristolohikal ng κύριος nang hindi iyon nilulutas nang lampas sa teksto.
- source_word: εἰ σὺ εἶ
  choice: kung ikaw nga iyan
  rationale: Natural na pagpapahayag sa Tagalog ng pagkilala sa taong nakikita sa di-kalayuan; ang “nga” ay angkop na nagbibigay-diin sa pagkakakilanlan nang hindi ginagawang katiyakan ang kondisyon.
- source_word: κέλευσόν με
  choice: utusan mo ako
  rationale: Malinaw na ipinapakita ang awtoritatibong utos na hinihingi ni Pedro, hindi isang karaniwang paanyaya lamang.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: lumapit sa iyo
  rationale: Sa Tagalog, “lumapit sa iyo” ang pinakanatural para sa pagkilos patungo kay Jesus at iniiwasan ang alanganing “pumarito sa iyo” mula sa pananaw ng nagsasalita.
- source_word: ἐπὶ τὰ ὕδατα
  choice: sa ibabaw ng mga tubig
  rationale: Pinananatili ang pangmaramihang anyo ng Griyego at ang larawan ng paglakad sa ibabaw, bagaman mas karaniwan sa Tagalog ang pang-isahang “tubig.”
theological_decisions:
- issue: Bigat ng pagtawag ni Pedro kay Jesus na κύριε
  choice: Panginoon
  alternative: Guro; Ginoo
  rationale: Maaaring higit ito sa karaniwang magalang na pagtawag sa konteksto ng Mateo. Pinananatili ng “Panginoon” ang posibleng teolohikal na bigat ngunit hindi tahasang dinaragdagan ang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kung ikaw nga iyan” bilang natural na pagkilala sa taong nasa malayo, at pinanatili sa pangunahing teksto ang di-karaniwang pangmaramihang “mga tubig” dahil gayon ang anyo ng Griyego.
