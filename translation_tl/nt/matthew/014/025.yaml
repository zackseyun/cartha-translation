  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: tl
  text: At sa ikaapat na pagbabantay ng gabi[b], lumapit siya sa kanila, na naglalakad sa ibabaw ng dagat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong parirala ay maaari ring isaling “naglalakad sa dagat.” May ilang nagpapakahulugan dito na “naglalakad sa tabi ng dagat,” ngunit malinaw na pinapaboran ng konteksto ang paglakad sa ibabaw mismo ng tubig.
    reason: alternative_reading
  - marker: b
    text: Ang “ikaapat na pagbabantay ng gabi” ang huling yugto ng pagbabantay sa gabi, humigit-kumulang alas-tres hanggang alas-sais ng umaga ayon sa sistemang Romano.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: sa ikaapat na pagbabantay ng gabi
  rationale: Pinananatili nito ang makasaysayang paghahati ng gabi sa mga yugto ng pagbabantay, habang nananatiling mauunawaan sa modernong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; natural dito ang “At.”
- source_word: ἦλθεν πρὸς αὐτούς
  choice: lumapit siya sa kanila
  rationale: Ipinapahayag ng ἦλθεν kasama ng πρὸς αὐτούς ang pagkilos patungo sa mga alagad. Mas natural sa Tagalog ang “lumapit” kaysa literal na “dumating sa kanila.”
- source_word: περιπατῶν
  choice: na naglalakad
  rationale: Ipinakikita ng kasalukuyang participle ang kilos na kasabay ng paglapit.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: sa ibabaw ng lawa
  rationale: Sa konteksto, inilalarawan nito ang paglakad sa ibabaw ng tubig. Ginamit ang “lawa” bilang natural na katawagan sa Dagat ng Galilea, samantalang nililinaw ng “sa ibabaw” ang puwersa ng parirala.
theological_decisions:
- issue: Ang mahimalang paglakad ni Jesus sa tubig
  choice: naglalakad sa ibabaw ng lawa
  alternative: naglalakad sa tabi ng lawa
  rationale: Bagaman maaaring magkaroon ng ibang gamit ang ἐπί, malinaw na pinapaboran ng agarang konteksto ang paglakad sa ibabaw ng tubig. Hindi pinahihina o dinaragdagan ng salin ang mahimalang paglalarawan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang makasaysayang ekspresyong “ikaapat na pagbabantay,” na ipinaliliwanag sa talababa; ginamit ang “lawa” para sa heograpikong anyong-tubig ngunit binanggit sa talababa ang mas literal na “dagat.”
