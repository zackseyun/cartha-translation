  naturalness: Natural at marangal ang hulma ng pangungusap sa modernong Filipino. Ang 'lumapit siya sa kanila' ay idiomatiko at sapat na naghahatid ng ἦλθεν πρὸς αὐτούς. Ang 'ikaapat na pagbabantay ng gabi' ay bahagyang pormal ngunit angkop at naipapaliwanag sa talababa.
