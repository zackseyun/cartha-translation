  text: And he sent and beheaded John in the prison[a].
translation:
  language: tl
  text: At nagsugo siya, at pinugutan niya ng ulo si Juan sa bilangguan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At matapos siyang magsugo, pinugutan niya ng ulo si Juan sa bilangguan.” Gumagamit ang Griyego ng aorist participle bago ang pangunahing pandiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Kaya
  rationale: Ipinagpapatuloy nito ang salaysay at natural na iniuugnay ang utos sa naunang pangyayari. Ang καί ay payak na pang-ugnay, ngunit sa kontekstong ito ang “Kaya” ay malinaw at likas sa modernong Tagalog nang hindi nagdaragdag ng bagong detalye.
- source_word: πέμψας
  choice: nagsugo siya
  rationale: Ang aorist participle ng πέμπω ay nagpapahiwatig na may isinugo muna bago isinagawa ang pagpugot. Iniiwasan nitong ipahiwatig na personal na ginawa ni Herodes ang pagpatay.
- source_word: ἀπεκεφάλισεν
  choice: pinugutan ng ulo
  rationale: Tiyak na nangangahulugan ang ἀποκεφαλίζω na pugutan ng ulo. Pinananatili ng anyong ito ang pag-uugnay ng kilos sa simuno, gaya ng Griyego, nang hindi ito pinalalawak bilang tahasang “nag-utos na pugutan.”
- source_word: τὸν Ἰωάννην
  choice: si Juan
  rationale: Ang pangalang Juan lamang ang nasa talata at sapat itong nakikilala mula sa agarang konteksto; hindi idinagdag ang “Bautista.”
- source_word: ἐν τῇ φυλακῇ
  choice: sa bilangguan
  rationale: Ang φυλακή rito ay kongkretong lugar ng pagkakakulong. Ang “sa bilangguan” ay natural, marangal, at malinaw na salin sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang maigsi at matinding daloy ng salaysay, pati ang pahiwatig na may isinugong tagapagpatupad, nang hindi tahasang nilulutas kung sino ang aktuwal na pumugot.
