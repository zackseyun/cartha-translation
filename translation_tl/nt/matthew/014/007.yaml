  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: tl
  text: Kaya nangako siya sa dalaga, nang may panunumpa, na ibibigay niya ang anumang hihingin ng dalaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anuman ang hihingin niya.” Ang Griyego ay gumagamit ng isang di-tiyak na sugnay (ὃ ἐὰν αἰτήσηται) na tumutukoy sa anumang kahilingang maaaring gawin sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Kaya
  rationale: Ipinapahayag nito ang bunga ng naunang pangyayari at natural itong pakinggan sa makabagong Tagalog.
- source_word: μετὰ ὅρκου
  choice: nang may panunumpa
  rationale: Pinananatili nito ang diwang ang pangako ay pinagtibay sa pamamagitan ng isang sumpa, sa paraang marangal at madaling maunawaan.
- source_word: ὡμολόγησεν
  choice: nangako siya
  rationale: Sa konteksto, tumutukoy ang pandiwa sa matibay na pangakong ibigay ang hihingin, hindi sa pagtatapat.
- source_word: αὐτῇ
  choice: sa dalaga
  rationale: Nililinaw ng pangngalan ang babaeng tinutukoy ng panghalip ayon sa naunang konteksto, habang iniiwasan ang kalituhan sa sunod-sunod na panghalip.
- source_word: δοῦναι
  choice: na ibibigay niya
  rationale: Natural na ipinapahayag sa Tagalog ang nilalaman ng pangako sa pamamagitan ng sugnay na may 'na,' at napapanatili ang hinaharap na katuparan.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: ang anumang hingin nito
  rationale: Ang 'anumang' kasama ng pandiwang nasa anyong kontemplatibo ay naghahatid ng bukás at hindi pa tiyak na kahilingan na ipinahihiwatig ng ἐάν at subjunctive.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “dalaga” upang maging malinaw ang tinutukoy ng αὐτῇ, at ang “nito” upang maiwasan ang alanganing pag-uulit ng “niya.”
