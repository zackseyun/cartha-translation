id: MAT.14.9
reference: Matthew 14:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: tl
  text: Bagaman nalungkot ang hari, dahil sa kanyang mga panunumpa at sa mga kasalo niya[a], iniutos niyang ibigay iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga nakahilig na kasalo niya.” Karaniwang nakahilig sa tabi ng hapag ang mga kumakain sa mga piging noong panahong iyon.
    reason: cultural_note
  - marker: b
    text: Walang tahasang binanggit sa Griyego kung ano ang ipabibigay; tumutukoy ito sa kahilingang binanggit sa naunang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Bagaman nalungkot
  rationale: Ang aorist passive participle ay nagpapahayag na nalungkot o nabagabag ang hari. Ginawang pasalungat ang diwa sa Tagalog dahil sa kabila ng lungkot niya ay nag-utos pa rin siya.
- source_word: ὁ βασιλεὺς
  choice: ang hari
  rationale: Tuwirang katumbas ng βασιλεύς at angkop sa pormal na salaysay.
- source_word: διὰ τοὺς ὅρκους
  choice: dahil sa kanyang mga panunumpa
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Pinananatili ng “mga panunumpa” ang plural ng ὅρκους; ang “kanyang” ay likas na ipinahihiwatig ng konteksto.
- source_word: τοὺς συνανακειμένους
  choice: mga kasalo niya
  rationale: Tumutukoy ito sa mga taong nakahilig na kasabay niyang kumakain. Ang “mga kasalo niya” ay natural sa modernong Tagalog at pinananatili ang panlipunang tagpo ng piging.
- source_word: ἐκέλευσεν
  choice: iniutos
  rationale: Malinaw na ipinapahayag ng κελεύω ang pag-uutos, at ang “iniutos” ay maikli at marangal sa salaysay.
- source_word: δοθῆναι
  choice: ibigay iyon
  rationale: Ang passive infinitive ay nangangahulugang “maibigay/ibigay.” Walang tahasang layon sa Griyego; ang “iyon” ay tumutukoy nang hindi nagpapaliwanag nang labis sa kahilingang nasa naunang konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “bagaman” upang ihayag ang pasalungat na ugnayan ng lungkot ng hari at ng utos niya. Itinama ang pagkakalagay ng mga talababa ayon sa aktuwal na mga salitang tinutukoy ng mga ito.
