  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: tl
  text: Sapagkat sinasabi noon ni Juan sa kanya, “Hindi naaayon sa batas na maging asawa mo siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: paulit-ulit na sinasabi
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng nagpapatuloy o inuulit na pagsasalita sa nakaraan. Sa salaysay na Filipino, malinaw na naihahayag ng “paulit-ulit na sinasabi” ang puwersang ito.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag sa naunang pahayag; natural at malinaw itong naiuugnay ng “Sapagkat.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang isinasalin ang datibong di-tuwirang layon ng λέγω nang hindi inuulit ang pangalang Herodes na hindi tahasang nasa talata.
- source_word: ὁ Ἰωάννης
  choice: ni Juan
  rationale: Juan lamang ang ipinangalan sa Griyego, at sapat ang agarang konteksto upang makilala siya.
- source_word: Οὐκ ἔξεστίν
  choice: Hindi ipinahihintulot
  rationale: Ang ἔξεστιν ay tumutukoy sa kung ano ang pinahihintulutan o naaayon sa batas. Pinananatili ng “hindi ipinahihintulot” ang legal-moral na puwersa nang hindi ipinapalagay na batas lamang ng pamahalaan ang tinutukoy.
- source_word: σοι
  choice: sa iyo
  rationale: Natural na katumbas sa Filipino ng datibong taong hindi pinahihintulutan.
- source_word: ἔχειν
  choice: angkinin … bilang asawa
  rationale: Sa konteksto, ang ἔχειν ay tumutukoy sa pagkakaroon sa babae bilang asawa o kinakasama, hindi sa literal na pagmamay-ari. Ang “angkinin siya bilang asawa” ay natural at nililinaw ang relasyong ipinahihiwatig ng konteksto.
- source_word: αὐτήν
  choice: siya
  rationale: Pinananatili ang panghalip na tumutukoy kay Herodias at hindi inuulit ang pangalang wala sa Griyegong talata.
theological_decisions:
- issue: Kalikasan ng pagsaway ni Juan
  choice: “Hindi ipinahihintulot sa iyo” bilang legal-moral na pagbabawal
  alternative: “Hindi tama para sa iyo” bilang mas pangkalahatang moral na pagtutol
  rationale: Ang ἔξεστιν ay nakatuon sa pahintulot o pagiging naaayon sa batas. Pinananatili ng salin ang matalim na legal-moral na diwa nang hindi tahasang idinaragdag kung aling kautusan ang nilalabag.
- issue: Kahulugan ng “pagkakaroon” kay Herodias
  choice: “angkinin siya bilang asawa”
  alternative: Mas pormal na “taglayin siya” o mas literal na “magkaroon sa kanya”
  rationale: Idyomatiko sa konteksto ng pag-aasawa ang ἔχειν. Iniiwasan ng napiling salin ang malabo o di-natural na Filipino habang hindi tinutukoy nang higit sa konteksto ang eksaktong legal na katayuan ng relasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa naunang talata, at “paulit-ulit na sinasabi” upang maipakita ang imperpektong aspekto. Walang talababa dahil walang kailangang alternatibong pagbasa na hindi kayang katawanin ng pangunahing salin.
