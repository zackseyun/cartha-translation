id: MAT.14.12
reference: Matthew 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: tl
  text: Lumapit ang mga alagad niya, kinuha ang bangkay at inilibing siya. Pagkatapos, pumunta sila kay Jesus at ibinalita ang nangyari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ng mga alagad at natural sa makabagong salaysay sa Filipino.
- source_word: μαθηταὶ αὐτοῦ
  choice: ang mga alagad niya
  rationale: Pinananatili ang nakaugaliang salitang “alagad” at ang panghalip ng Griyego; malinaw sa konteksto na mga alagad ni Juan ang tinutukoy.
- source_word: ἦραν
  choice: kinuha
  rationale: Ang αἴρω ay maaaring mangahulugang buhatin o kunin; sa konteksto ng paglilibing, natural at hindi labis na mapagpakahulugan ang “kinuha.”
- source_word: πτῶμα
  choice: bangkay
  rationale: Tiyak na tumutukoy ang πτῶμα sa patay na katawan. Ang “bangkay” ang malinaw at karaniwang katumbas sa Filipino, kaya hindi na kailangan ng leksikal na talababa.
- source_word: ἔθαψαν αὐτόν
  choice: inilibing siya
  rationale: Tuwirang salin ng pandiwa at panghalip, nang hindi nagdaragdag ng libingan o puntod na hindi binanggit sa talata.
- source_word: ἐλθόντες
  choice: Pagkatapos, pumunta sila
  rationale: Ginagawang likas na sunod-sunod na kilos sa Filipino ang aorist participle habang pinananatili ang diwa ng pagpunta.
- source_word: ἀπήγγειλαν
  choice: ibinalita ang nangyari
  rationale: Ang pandiwa ay nangangahulugang mag-ulat o magbalita. Ginagawang malinaw sa Filipino ang ipinahiwatig na nilalaman ng ulat nang hindi nililimitahan ito sa iisang detalye.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Gumagamit ng karaniwang anyo ng pangalan sa Filipino at wastong panandang pantangi para sa pinagsabihan.
theological_decisions:
- issue: Pagkakakilanlan ng “mga alagad niya”
  choice: Pinanatili ang “mga alagad niya,” na sa konteksto ay tumutukoy sa mga alagad ni Juan Bautista.
  alternative: Tahasan itong gawing “mga alagad ni Juan.”
  rationale: Ang pinakamalapit na konteksto ay ang pagkamatay ni Juan, kaya siya ang likas na tinutukoy ng αὐτοῦ. Ang pagpapanatili sa panghalip ay tapat sa anyo ng Griyego at hindi nangangailangan ng paglilinaw sa pangunahing teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Maikli ang mga sugnay upang mapanatili ang mabilis na daloy ng salaysay. Ginamit ang “bangkay” dahil iyon ang tiyak na kahulugan ng πτῶμα at karaniwang salita ito sa Filipino, bagaman mas tahasan kaysa sa “katawan.”
