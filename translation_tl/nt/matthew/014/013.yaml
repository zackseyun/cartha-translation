id: MAT.14.13
reference: Matthew 14:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: tl
  text: Nang mabalitaan ito ni Jesus, umalis siya roon sakay ng bangka patungo sa isang liblib na lugar[a] upang mapag-isa. Ngunit nang mabalitaan ito ng mga tao, sinundan nila siya nang naglalakad mula sa mga bayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay tumutukoy sa isang liblib o halos walang naninirahang lugar, hindi kinakailangang isang mabuhanging disyerto.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa mga lungsod.” Maaaring tumukoy ang salitang Griyego sa mga bayan o mga lungsod ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Nang mabalitaan ito ni Jesus
  rationale: Ipinapahayag ang aorist participle bilang temporal na sugnay. Ang “mabalitaan” ay natural sa konteksto ng pagtanggap ng balita; ang “ito” ay ipinahihiwatig ng naunang salaysay, bagaman walang tahasang layon sa Griyego.
- source_word: ἀνεχώρησεν ἐκεῖθεν
  choice: umalis siya roon
  rationale: Likas at neutral na Filipino para sa paglayo o pag-alis mula sa lugar, nang hindi nagpapasok ng tiyak na motibo gaya ng pagtakas.
- source_word: ἐν πλοίῳ
  choice: sakay ng bangka
  rationale: Karaniwang modernong Filipino para sa paraan ng paglalakbay.
- source_word: εἰς ἔρημον τόπον
  choice: sa isang liblib na lugar
  rationale: Ang ἔρημος ay tumutukoy rito sa lugar na hiwalay o kakaunti ang naninirahan, hindi kinakailangang mabuhanging disyerto.
- source_word: κατ’ ἰδίαν
  choice: nang mag-isa
  rationale: Pinananatili ang diwa ng pagpunta nang bukod o pribado.
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: nang mabalitaan ito ng mga tao
  rationale: Temporal ang participle; ang “mga tao” ay natural na kolektibong katumbas ng plural na οἱ ὄχλοι sa Filipino.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: naglakad sila ... at sumunod sa kanya
  rationale: Malinaw na ipinahahayag ang πεζῇ bilang paglalakad at ang ἀκολουθέω bilang aktuwal na pagsunod sa paglalakbay.
- source_word: ἀπὸ τῶν πόλεων
  choice: mula sa mga bayan
  rationale: Maaaring tumukoy ang πόλις sa bayan o lungsod; ang “mga bayan” ay angkop sa kontekstong Galilea at hindi labis na nagpapalaki sa mga pamayanan.
theological_decisions:
- issue: Dahilan ng pag-alis ni Jesus
  choice: Hindi tinukoy ang motibo; isinalin lamang na “umalis siya roon.”
  alternative: “umurong siya,” “lumayo siya upang magluksa/manalangin,” o “tumakas siya”
  rationale: Iniuugnay ng talata ang pag-alis sa narinig ni Jesus ngunit hindi nito tahasang sinasabi kung iyon ay dahil sa kaligtasan, pagluluksa, panalangin, o ibang layunin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “liblib na lugar” upang maiwasan ang maling larawan ng disyerto, at pinanatiling neutral ang dahilan ng pag-alis ni Jesus.
