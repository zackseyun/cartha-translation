  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: tl
  text: Pag-ahon ni Jesus sa pampang[a], nakita niya ang isang malaking pulutong. Nahabag siya sa kanila[b] at pinagaling niya ang mga maysakit sa karamihang iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Paglabas niya” o “nang lumabas siya.” Sa konteksto, malamang na tumutukoy ito sa pag-ahon niya mula sa bangka patungo sa pampang.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Naantig siya sa habag para sa kanila” o “Napuspos siya ng habag para sa kanila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Pagdating ni Jesus sa pampang
  rationale: Ang participle ay literal na tumutukoy sa paglabas, ngunit sa konteksto ng pagdating sakay ng bangka, likas at malinaw sa Tagalog ang “pagdating ... sa pampang.” Inulit ang pangalang Jesus upang maging malinaw ang simuno sa malayang sipi.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang salin ng aorist ng ὁράω at natural sa modernong Tagalog.
- source_word: πολὺν ὄχλον
  choice: ang napakaraming tao
  rationale: Ipinahahayag nito ang malaking bilang ng ὄχλος sa natural na Tagalog; mas karaniwan ito kaysa sa pormal na “malaking pulutong.”
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: Nahabag siya sa kanila
  rationale: Ang “nahabag” ay likas, marangal, at nagpapahayag ng matinding malasakit nang hindi dinaragdagan ang diwa ng Griyego.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Sa kontekstong ito, ang θεραπεύω ay tumutukoy sa pisikal na pagpapagaling.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: ang mga maysakit sa kanila
  rationale: Pinananatili nito ang ugnayang ipinahahayag ng αὐτῶν habang iniiwasan ang posibleng di-likas o mapang-angking dating ng “kanilang mga maysakit.”
theological_decisions:
- issue: Paglalarawan sa emosyonal na tugon ni Jesus
  choice: Nahabag siya sa kanila
  alternative: Naantig siya sa matinding awa para sa kanila
  rationale: Tapat na ipinakikita ng “nahabag” ang malalim na habag ni Jesus bilang tugon sa mga tao, ngunit hindi nito pinaiigting o ipinapaliwanag nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa dalawang pangungusap para sa madaling pagbasa nang hindi binabago ang ugnayan ng mga kilos. Ginamit ang “mga maysakit” bilang karaniwang katawagan at iniwasan ang mas makaluma o teknikal na pananalita.
