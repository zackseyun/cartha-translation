  rationale: Pinili ang “Pag-ahon ni Jesus sa pampang” upang maipakita ang kontekstuwal na kahulugan ng ἐξελθών nang hindi binubura ang literal na posibilidad, na nakasaad sa talababa. Inayos ang katawagan para sa crowd at sa mga maysakit upang maging mas likas at malinaw sa modernong Filipino Tagalog. Idinagdag ang nawawalang talababa sa “Nahabag” upang masubaybayan ang lexical alternative para sa malalim na habag na ipinahahayag ng Griyego.
