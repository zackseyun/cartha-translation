id: MAT.14.29
reference: Matthew 14:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: tl
  text: Sinabi niya, “Halika.” Kaya bumaba si Pedro mula sa bangka, lumakad sa ibabaw ng tubig, at nagtungo kay Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at nakarating kay Jesus.” Ang Griyego ay maaaring maglarawan ng pagtungo sa direksiyon ni Jesus nang hindi tahasang sinasabing nakarating na siya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Halika
  rationale: Tuwirang pautos ito mula sa ἔρχομαι. Ang “Halika” ang maikli, natural, at wastong katumbas sa Tagalog.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: bumaba ... mula sa bangka
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa paglakad ni Pedro. Natural sa Tagalog ang finite na “bumaba” kasunod ng pang-ugnay na “kaya.”
- source_word: πλοίου
  choice: bangka
  rationale: Bagaman maaaring tumukoy ang πλοῖον sa bangka o sasakyang-dagat, “bangka” ang angkop sa tagpo sa Lawa ng Galilea at sa modernong gamit.
- source_word: περιεπάτησεν
  choice: lumakad
  rationale: Karaniwang kahulugan dito ng περιπατέω ang paglakad; hindi kailangan ang dagdag na diwang “nagsimulang” o “nagpalakad-lakad.”
- source_word: ἐπὶ τὰ ὕδατα
  choice: sa ibabaw ng tubig
  rationale: Malinaw at likas na ipinapahayag nito ang paggalaw sa ibabaw ng tubig. Mas natural sa Tagalog ang pang-isahang di-mabilang na “tubig” kaysa “mga tubig.”
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: at nagtungo kay Jesus
  rationale: Ang “nagtungo” ay natural na nagsasaad ng pagkilos sa direksiyon ni Jesus nang hindi tahasang iginigiit na nakarating na si Pedro sa kaniya. Pinananatili nito ang puwang ng kahulugan ng ἦλθεν ... πρός.
- source_word: δὲ
  choice: Sinabi niya
  rationale: Mahinang pang-ugnay sa salaysay ang δέ. Hindi kailangang tumbasan ng hiwalay na salita sa Tagalog; sapat ang maayos na pagpapatuloy ng pangungusap.
theological_decisions:
- issue: Kung nakarating ba si Pedro kay Jesus o kumikilos lamang siya patungo sa kaniya
  choice: at nagtungo kay Jesus
  alternative: at nakarating kay Jesus
  rationale: Maaaring magpahiwatig ang ἦλθεν πρὸς ng paglapit o pagtungo sa isang tao, ngunit hindi kailangang ipilit na natapos ang pagdating. Pinananatili ng salin ang direksiyon ng kilos at ang tensiyon ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “bangka,” “lumakad,” at “nagtungo” bilang karaniwang salitang madaling maunawaan, habang iniiwasan ang labis na literal o makalumang ayos.
