  to: Ngunit ang bangka ay marami nang estadyo[b] ang layo mula sa lupa[a], at hinahampas ito ng mga alon[c], sapagkat laban ang hangin.
  rationale: Pinalitan lamang ang “salungat ang hangin” ng mas likas na “laban ang hangin.” Idinagdag ang “ito” pagkatapos ng “hinahampas” upang maging malinaw sa Filipino na ang bangka ang tinutukoy ng pandiwaring pasibo. Hindi binago ang kahulugan, antas ng katiyakan, mga pangalan, sukat, o mga anchor ng talababa.
