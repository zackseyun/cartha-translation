base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: tl
  text: Ngunit ang bangka ay marami nang estadyo[b] ang layo mula sa lupa[a], at hinahampas ito ng mga alon[c], sapagkat laban ang hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa pampang.” Ang Griyego ay literal na nagsasabing “mula sa lupa.”
    reason: lexical_alternative
  - marker: b
    text: Ang isang estadyo ay sinaunang yunit ng distansiya na humigit-kumulang 185 metro.
    reason: cultural_note
  - marker: c
    text: O “pinapalo ng mga alon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: bangka
  rationale: Sa konteksto ng pagtawid sa Lawa ng Galilea, ang “bangka” ang natural na makabagong katawagan at hindi nagpapahiwatig ng sasakyang-dagat na mas malaki kaysa sa malamang na tinutukoy.
- source_word: ἤδη
  choice: na
  rationale: Ipinahihiwatig ng ayos na “marami nang … ang layo” na umabot na sa ganitong kalayuan ang bangka sa puntong ito ng salaysay.
- source_word: σταδίους πολλούς
  choice: maraming estadyo
  rationale: Pinananatili ang sinaunang yunit ng distansiya upang maging malinaw ang anyo ng pinagmulang teksto; ipinaliliwanag ito sa talababa.
- source_word: ἀπὸ τῆς γῆς
  choice: mula sa lupa
  rationale: Tuwirang sinasalamin nito ang γῆ, na sa konteksto ay tumutukoy sa lupaing nasa gilid ng tubig; ang “pampang” ay inilalahad bilang alternatibo sa talababa.
- source_word: ἀπεῖχεν
  choice: ang layo mula
  rationale: Likas sa Filipino ang kayariang ito para ipahayag ang agwat sa espasyo nang hindi gumagamit ng matigas na literal na anyo.
- source_word: βασανιζόμενον
  choice: hinahampas
  rationale: Sa kontekstong pandagat, inilalarawan nito ang marahas at paulit-ulit na pagtama ng mga alon sa bangka, habang pinananatili ang tindi ng pandiwa.
- source_word: ὑπὸ τῶν κυμάτων
  choice: ng mga alon
  rationale: Karaniwang salin ng κύματα ang “mga alon,” at malinaw nitong tinutukoy ang sanhi ng paghampas sa bangka.
- source_word: ἐναντίος
  choice: salungat
  rationale: Ipinapahayag ng “salungat ang hangin” na ang direksiyon ng hangin ay laban sa tinatahak ng bangka, nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang banayad na paglipat at pagsalungat mula kay Jesus na nasa lupa tungo sa mahirap na kalagayan ng bangka.
- source_word: γάρ
  choice: sapagkat
  rationale: Malinaw nitong pinananatili ang paliwanag kung bakit hinahampas at nahihirapan ang bangka.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang sinaunang yunit na “estadyo” dahil tiyak itong nasa Griyego, kalakip ang maikling paliwanag. Hindi nilagyan ng tahasang layon ang “salungat ang hangin” upang mapanatili ang bahagyang pagkaimpisit ng orihinal.
