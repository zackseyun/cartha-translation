  source_fidelity: 'Tumpak ang pangunahing diwa: ang bangka ay nasa malayong agwat na mula sa lupa, marahas na sinasalanta ng mga alon, at may hanging laban sa paglalayag. Pinananatili rin ang sinaunang sukat na σταδίους sa pamamagitan ng “estadyo.” Gayunman, ang “salungat ang hangin” ay hindi gaanong likas na paglalarawan sa Filipino ng ἐναντίος sa kontekstong pandagat.'
  naturalness: Ang “marami nang estadyo ang layo” at “hinahampas ng mga alon” ay malinaw at makabago. Mas natural at idiomatiko ang “laban ang hangin” kaysa “salungat ang hangin,” habang iniiwan pa rin nitong implicit, gaya sa Griyego, ang bangka o direksiyong sinasalungat.
  terminology: Ang “bangka,” “estadyo,” “lupa,” at “mga alon” ay angkop. Ang talababa sa “pampang” ay wastong alternatibong pangkonteksto para sa γῆ. Ang “pinapalo” ay katanggap-tanggap, ngunit mas karaniwang natural ang “binubugbog” bilang alternatibo para sa marahas na pagkakabayo ng alon; hindi ito kailangang ipasok sa pangunahing teksto.
