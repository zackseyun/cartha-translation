  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: tl
  text: At nang sumakay sila sa bangka[a], tumigil ang hangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “matapos silang umakyat papasok sa bangka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Ipinagpapatuloy nito ang sunod-sunod na salaysay nang hindi nagdaragdag ng mas tiyak na ugnayang temporal.
- source_word: ἀναβάντων αὐτῶν
  choice: nang makasakay sila
  rationale: Ang genitive absolute ay likas na naipapahayag sa Tagalog bilang sugnay na temporal. Sa konteksto ng pagpasok sa isang bangka, ang “makasakay” ay mas natural kaysa sa literal na “umakyat,” habang nananatili ang diwa ng ἀναβαίνω kasama ng εἰς τὸ πλοῖον.
- source_word: πλοῖον
  choice: bangka
  rationale: Tumutukoy ito sa sasakyang pantubig ng mga alagad sa Lawa ng Galilea; ang “bangka” ang natural at makabagong katumbas, samantalang maaaring magpahiwatig ng napakalaking sasakyang-dagat ang “barko.”
- source_word: ἐκόπασεν
  choice: tumigil
  rationale: Ang κοπάζω ay nangangahulugang huminto o humupa, lalo na tungkol sa hangin. Direktang ipinahahayag ng “tumigil” ang ganap na pangyayaring isinasalaysay nang hindi nagdaragdag ng ideya ng unti-unting paghupa.
- source_word: ὁ ἄνεμος
  choice: ang hangin
  rationale: Tuwiran at natural na katumbas ito ng simuno sa Griyego.
theological_decisions:
- issue: Pahiwatig ng salaysay tungkol sa kapangyarihan ni Jesus sa kalikasan
  choice: Payak na isinalaysay na tumigil ang hangin nang makasakay sila sa bangka.
  alternative: Magdagdag ng pananalitang tahasang nag-uugnay sa pagtigil ng hangin sa mahimalang kapangyarihan ni Jesus.
  rationale: Malinaw sa mas malawak na konteksto ang teolohikal na kahalagahan, ngunit hindi tahasang ipinapaliwanag ng talata ang sanhi o kahulugan nito. Kaya hindi nagdagdag ng interpretasyong wala sa Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “makasakay” bilang karaniwang pagpapahayag sa pagpasok sa bangka, habang inilagay sa talababa ang mas literal na larawan ng pag-akyat.
