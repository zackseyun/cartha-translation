translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang tahasan at mabigat na larawan ng orihinal nang walang eupemismo. Inilagay ang pananda ng talababa kaagad pagkatapos ng “bandehado,” ang salitang tinutukoy nito.
