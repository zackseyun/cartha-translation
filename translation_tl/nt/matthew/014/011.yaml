  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: tl
  text: Dinala ang kanyang ulo na nasa isang bandehado[a] at ibinigay sa batang babae. Dinala niya ito sa kanyang ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaking pinggan” o “tray.” Ang salitang Griyego na πίναξ ay tumutukoy sa isang bandehado, tray, o pinggang ginagamit sa paghahain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: Dinala
  rationale: Ang aorist passive ng φέρω ay likas na maisasalin sa Filipino bilang “dinala.” Bagaman hindi tahasang ipinapakita ng anyong Filipino ang passive voice, nananatiling hindi binabanggit ang gumawa at malinaw ang kilos sa salaysay.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: ang kanyang ulo
  rationale: Tuwiran nitong pinananatili ang tahasang pananalita ng Griyego; walang batayan para gumamit ng eupemismo.
- source_word: ἐπὶ πίνακι
  choice: na nasa isang bandehado
  rationale: Sa kontekstong ito, ang πίναξ ay isang malaking pinggan o tray na ginagamit sa paghahain. Ang “bandehado” ay natural at tiyak sa modernong Filipino; ginamit ang “na nasa” upang maging malinaw na ang ulo ang nakalagay rito.
- source_word: ἐδόθη
  choice: ibinigay
  rationale: Tuwirang katumbas ng aorist passive ng δίδωμι. Ang pagkakasunod na “Dinala ... at ibinigay” ay maayos at malinaw sa salaysay.
- source_word: τῷ κορασίῳ
  choice: sa dalagita
  rationale: Ang diminutive noun na κοράσιον ay tumutukoy sa isang batang babae o dalagita. Ang “dalagita” ay natural na katawagang Filipino para sa isang babaeng nasa murang edad at angkop sa konteksto.
- source_word: ἤνεγκεν
  choice: Dinala naman niya iyon
  rationale: Ang aktibong aorist ng φέρω ay isinaling “dinala.” Idinagdag ang “iyon,” na likas na kailangan sa Filipino upang malinaw na tumukoy sa ulo, at ang “naman” ay mahinahong nagpapakita ng paglipat sa kilos ng dalagita.
- source_word: τῇ μητρὶ αὐτῆς
  choice: sa kanyang ina
  rationale: Tuwirang isinasalin ang dative phrase at malinaw na ang ina ay ina ng dalagita.
