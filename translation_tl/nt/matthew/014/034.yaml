  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: tl
  text: Pagkatawid nila[a], dumating sila sa lupain ng Genesaret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Pagkatawid nila, dumaong sila sa Genesaret.” Pinagsasama ng Griyego ang mga diwang “sa/patungo sa lupa” at “patungo sa Genesaret,” kaya inilalarawan nito ang pagdating o paglapag sa lupa, o sa dalampasigan, sa sakop ng Genesaret.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Pagkatawid nila
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang “Pagkatawid nila,” at pinananatili nitong hindi tahasang binabanggit ang sasakyang ginamit.
- source_word: ἦλθον
  choice: dumating sila
  rationale: Sa konteksto ng paglalakbay patungo sa isang pook, natural na ipinahahayag ng “dumating sila” ang pagkilos at pag-abot sa destinasyon.
- source_word: ἐπὶ τὴν γῆν εἰς
  choice: sa lupain ng
  rationale: Pinagsasama ng Griyego ang pagdating sa lupa at ang direksiyon patungong Genesaret. Ang “sa lupain ng” ay malinaw at malapit sa anyo ng teksto, habang ang talababa ay nagpapanatili sa posibleng diin sa pagdaong sa lupa o dalampasigan.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: Isinalin sa karaniwang anyong transliterado sa Filipino ang pangalan ng pook.
theological_decisions: []
translation_notes:
  register: Natural, maikli, at marangal na modernong Tagalog. Ginamit ang “lupain” upang mapanatili ang γῆ, at inilagay sa talababa ang mas kontekstuwal na “dumaong” nang hindi labis na tinutukoy ang dalampasigan sa pangunahing teksto.
