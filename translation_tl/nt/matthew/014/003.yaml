id: MAT.14.3
reference: Matthew 14:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: tl
  text: Sapagkat dinakip ni Herodes si Juan, iginapos siya, at ibinilanggo dahil kay Herodias, na asawa ng kapatid niyang si Felipe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag at natural itong pakinggan sa makabagong Tagalog.
- source_word: κρατήσας
  choice: ipinadakip
  rationale: Sa konteksto ng pagkakabilanggo, tumutukoy ito sa pagdakip kay Juan; ipinahihiwatig ng anyong pandiwa na iniutos o ipinatupad ito ni Herodes.
- source_word: ἔδησεν
  choice: iginapos
  rationale: Pinananatili ang kongkretong diwa ng pagtali o paggapos nang hindi tinutukoy kung lubid o tanikala ang ginamit.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: ipinabilanggo
  rationale: Natural at malinaw na katumbas sa Tagalog ng paglalagay sa bilangguan, habang ang causative na anyo ay angkop sa ginawa ng pinuno sa pamamagitan ng kanyang mga tauhan.
- source_word: διὰ Ἡρῳδιάδα
  choice: dahil kay Herodias
  rationale: Malinaw na ipinapahayag ang sanhi o dahilan, gaya ng διά na may accusative.
- source_word: γυναῖκα
  choice: asawa
  rationale: Sa relasyonal na pariralang ito, ang kontekstuwal na kahulugan ng γυνή ay asawa.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: ng kapatid niyang si Felipe
  rationale: Natural sa Tagalog at malinaw na si Felipe ang kapatid ni Herodes.
theological_decisions:
- issue: Paglalarawang moral at historikal sa kaugnayan ni Herodias kay Felipe
  choice: na asawa ng kapatid niyang si Felipe
  alternative: na dating asawa ng kapatid niyang si Felipe
  rationale: Tinatawag lamang ng talata si Herodias na asawa ni Felipe; hindi nito sinasabing “dating asawa,” at sa susunod pang talata tahasang lilitaw ang hatol sa relasyon. Hindi dapat unahan o lutasin ng salin ang tensiyong nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinadakip” at “ipinabilanggo” bilang likas na pananalita tungkol sa mga kilos na iniutos o ipinatupad ng isang pinuno. Walang talababa dahil sapat na malinaw ang salin at hindi kailangang ilahad ang mas literal na alternatibo upang mapanatili ang tunay na kahulugan.
