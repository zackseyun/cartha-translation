  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: tl
  text: At sinabi niya sa kanyang mga lingkod, “Ito si Juan na Tagapagbautismo. Siya ay ibinangon mula sa mga patay, at dahil dito ay kumikilos sa kanya ang mga kapangyarihan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapangyarihang gumagawa ng himala,” o, sa mas malayang salin, “mga himala.” Literal na “mga kapangyarihan” ang Griyego (αἱ δυνάμεις), na tumutukoy dito sa sobrenatural na kapangyarihang nahahayag sa makapangyarihang mga gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: mga lingkod
  rationale: Maaaring tumukoy ang παῖς sa anak, bata, lingkod, o tagapaglingkod ayon sa konteksto. Dito, kausap ni Herodes ang mga nasa kanyang sambahayan o hukuman, kaya likas at hindi labis na tiyak ang “mga lingkod.”
- source_word: ὁ βαπτιστής
  choice: Tagapagbautismo
  rationale: Malinaw nitong ipinahahayag ang tungkulin ni Juan bilang nagbabautismo at malapit ito sa anyo at diwa ng Griyego, habang nananatiling marangal at nauunawaan sa makabagong Filipino.
- source_word: ἠγέρθη
  choice: ibinangon
  rationale: Pinananatili ng “ibinangon” ang balintiyak na anyo ng pandiwang Griyego, sa halip na ipahiwatig na sariling bumangon si Juan.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: mula sa mga patay
  rationale: Ito ang natural at tuwirang katumbas ng parirala, na tumutukoy sa pagbangon mula sa kalagayan o hanay ng mga patay.
- source_word: διὰ τοῦτο
  choice: dahil dito
  rationale: 'Malinaw nitong pinananatili ang ugnayang sanhi: ayon kay Herodes, ang pagbangon ni Juan ang dahilan ng pagkilos ng mga kapangyarihan.'
- source_word: αἱ δυνάμεις
  choice: mga kapangyarihang ito
  rationale: Pinananatili nito ang tahasang pangngalang “mga kapangyarihan” at ang pagtukoy sa mga naiulat na makapangyarihang gawa, nang hindi agad pinapaliit ang kahulugan tungo lamang sa “mga himala.”
- source_word: ἐνεργοῦσιν
  choice: kumikilos
  rationale: Natural na ipinahahayag ng “kumikilos” ang aktibo at mabisang paggawa na isinasaad ng ἐνεργέω.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili nito ang pinakadirektang diwa ng ἐν bilang kinaroroonan o saklaw ng pagkilos. Ang “sa pamamagitan niya” ay posible sa diwa ngunit mas interpretatibo.
theological_decisions:
- issue: Kalikasan ng sinasabing pagbabalik ni Juan
  choice: Siya ay ibinangon mula sa mga patay
  alternative: Bumangon siya mula sa mga patay
  rationale: Balintiyak ang ἠγέρθη, kaya pinananatili ng salin ang gramatikal na pahiwatig na si Juan ay ibinangon. Hindi nito dinaragdagan ang pahayag ni Herodes ng paliwanag kung sino ang gumawa nito.
- issue: Kahulugan ng δυνάμεις sa konteksto
  choice: kumikilos sa kanya ang mga kapangyarihang ito
  alternative: gumagawa siya ng mga himala / kumikilos sa kanya ang mga kapangyarihang gumagawa ng himala
  rationale: Malamang na tumutukoy ang salita sa sobrenatural na kapangyarihang nahahayag sa makapangyarihang mga gawa, ngunit pinananatili ng pangunahing teksto ang mas malawak na salitang “mga kapangyarihan” upang hindi alisin ang leksikal na saklaw o lutasin nang tahasan ang ugnayan ng kapangyarihan at ng mga gawang bunga nito.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang “mga lingkod” bilang natural na katawagan sa mga tauhan ng sambahayan o hukuman ni Herodes. Ang “Tagapagbautismo” ay mas malinaw sa tungkulin kaysa sa hiniram na “Bautista.” Inilagay ang talababa [a] pagkatapos ng “mga kapangyarihang ito,” sapagkat iyon ang salitang ipinaliliwanag nito.
