  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: tl
  text: Ang mga kumain ay humigit-kumulang limang libong lalaki, hindi kasama ang mga babae at mga bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Ang mga kumain
  rationale: Ang artikulong may pangkasalukuyang participle ay tumutukoy sa mga taong nakibahagi sa pagkain. Natural sa Tagalog ang “ang mga kumain” at hindi nito labis na binibigyang-diin ang aspekto. Hindi kailangang isalin nang hiwalay ang mahinang pang-ugnay na δέ sa pangungusap na ito.
- source_word: ἦσαν
  choice: ay
  rationale: Ang di-ganap na anyo ng εἰμί ay payak na nag-uugnay sa mga kumain at sa tinatayang bilang nila; ang “ay” ang natural na katumbas sa kayariang ito.
- source_word: ἄνδρες
  choice: lalaki
  rationale: Tiyak na tumutukoy ang ἀνήρ sa mga lalaking tao, hindi sa mga tao sa pangkalahatan. Pinananatili ito dahil bukod na binabanggit ang mga babae at mga bata.
- source_word: ὡσεὶ
  choice: humigit-kumulang
  rationale: Nagsasaad ang ὡσεί ng pagtataya. Ang “humigit-kumulang” ay malinaw, natural, at angkop sa dignidad ng salaysay.
- source_word: πεντακισχίλιοι
  choice: limang libo
  rationale: Tuwirang katumbas ng bilang na naglalarawan sa mga lalaki.
- source_word: χωρὶς
  choice: bukod pa sa
  rationale: Ang χωρίς na may genitive ay nagpapahiwatig na hindi kasama sa bilang ang kasunod na mga pangkat. Malinaw na ipinahihiwatig ng “bukod pa sa” na dagdag sa limang libong lalaki ang mga babae at mga bata.
- source_word: γυναικῶν
  choice: mga babae
  rationale: Bagaman maaaring mangahulugang “asawa” ang γυνή sa ibang konteksto, walang relasyong pangmag-asawa rito; “mga babae” ang angkop.
- source_word: παιδίων
  choice: mga bata
  rationale: Ang παιδίον ay tumutukoy sa isang bata. Hindi kailangang paliitin ang kahulugan sa napakabatang mga bata sa kontekstong ito.
theological_decisions:
- issue: Tiyak-sa-kasariang katawagan sa pagbibilang ng isang halo-halong karamihan
  choice: Isalin ang ἄνδρες bilang “lalaki” at panatilihin ang tahasang pariralang “bukod pa sa mga babae at mga bata.”
  alternative: Isalin bilang “tao” o “mga tao.”
  rationale: Partikular na binibilang ng Griyego ang mga lalaki at pagkatapos ay bukod na tinutukoy ang mga babae at mga bata. Ang “mga tao” ay mag-aalis sa mahalagang leksikal at panlipunang detalye ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “humigit-kumulang” para sa eksaktong diwa ng pagtataya at “bukod pa sa” upang luminaw na hindi kabilang sa limang libong bilang ang mga babae at mga bata. Walang talababa sapagkat sapat na malinaw sa pangunahing teksto ang saklaw ng χωρίς.
