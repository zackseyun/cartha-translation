  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus sa kanila, “Hindi nila kailangang umalis. Kayo mismo ang magbigay sa kanila ng makakain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang banayad na pagsalungat ng tugon ni Jesus sa mungkahi ng mga alagad na paalisin ang mga tao.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi ni Jesus sa kanila
  rationale: Likas at tuwirang salin ng panimulang pahayag, na pinananatili ang mga alagad bilang kinakausap.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: Hindi nila kailangang umalis
  rationale: Natural na Filipino para sa idyomang Griyego na literal na nagsasabing wala silang pangangailangang umalis.
- source_word: δότε αὐτοῖς
  choice: magbigay sa kanila
  rationale: Pinananatili ang tuwirang utos sa maramihang kausap nang hindi dinaragdagan ang lakas ng pandiwa.
- source_word: ὑμεῖς
  choice: Kayo mismo
  rationale: 'Ipinahahayag ang diin ng tahasang panghalip sa Griyego: ang mga alagad mismo ang inuutusang kumilos.'
- source_word: φαγεῖν
  choice: ng makakain
  rationale: Likas na Filipino sa konstruksiyong ‘bigyan sila upang kumain,’ habang hindi nagdaragdag ng espesipikong uri ng pagkain.
theological_decisions:
- issue: Diin sa papel ng mga alagad sa utos ni Jesus
  choice: Kayo mismo ang magbigay
  alternative: Kayo ang magbigay
  rationale: Pinananatili ng “mismo” ang diin ng ὑμεῖς nang hindi nagpapasok ng karagdagang teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kailangang umalis” at “makakain” bilang karaniwang pananalita, habang pinanatili sa “Kayo mismo” ang mahalagang diin ng orihinal.
