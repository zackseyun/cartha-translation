revisions:
- from: 'Ngunit humayo kayo at alamin kung ano ang ibig sabihin nito: “Habag ang nais ko, at hindi handog.”[a] Sapagkat naparito ako hindi upang tawagin ang mga matuwid, kundi ang mga makasalanan.[b]'
  to: 'Humayo kayo at unawain ninyo kung ano ang ibig sabihin nito: “Habag ang nais ko, at hindi hain.”[a] Sapagkat hindi ako naparito upang tawagin ang mga matuwid,[b] kundi ang mga makasalanan.'
  rationale: Nilinaw ang θυσίαν bilang “hain,” inayos ang pananalita upang mas tuwirang ihatid ang panawagang unawain ang sipi, at inilipat ang marker ng talababa upang nakaangkla ito sa “mga matuwid,” na siyang salitang ipinaliliwanag. Hindi binago ang kalabuan ng “mga matuwid” o pinalawak ang teolohikal na puwersa ng sipi.
