  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: tl
  text: 'Humayo kayo at unawain ninyo kung ano ang ibig sabihin nito: “Habag ang nais ko, at hindi hain.”[a] Sapagkat hindi ako naparito upang tawagin ang mga matuwid,[b] kundi ang mga makasalanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sipi mula sa Oseas 6:6. Mas literal: “Humayo kayo at alamin ninyo kung ano ito.”'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Maaaring tumukoy sa “mga nag-aakalang matuwid sila”; payak na “mga matuwid” ang nasa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: humayo kayo
  rationale: Ang aorist participle ay ginagamit na kaagapay ng kasunod na pautos; ang “humayo kayo at alamin” ay likas at marangal na katumbas ng idyomang “go and learn.”
- source_word: μάθετε
  choice: alamin
  rationale: Pinananatili nito ang utos na pag-aralan at unawain ang kahulugan ng sipi, pati ang tono ng pagsaway.
- source_word: τί ἐστιν
  choice: kung ano ang ibig sabihin nito
  rationale: Likas na Filipino para sa idyomang nagpapakilala sa kahulugan ng kasunod na sipi; ang mas literal na anyo ay inilagay sa talababa.
- source_word: Ἔλεος
  choice: habag
  rationale: Karaniwan at malinaw na katumbas ng ἔλεος, na nagpapanatili sa diwa ng maawaing pagkilos nang hindi labis na nagpapaliwanag.
- source_word: θέλω
  choice: nais ko
  rationale: Ang “nais” ay angkop sa marangal na rehistro ng sipi at tapat na nagpapahayag ng kalooban o pagnanais.
- source_word: θυσίαν
  choice: handog
  rationale: Sa konteksto ng Oseas 6:6, malinaw na tumutukoy ito sa handog na sakripisyo; mas natural sa modernong Filipino ang “handog” kaysa “sakripisyo” sa ganitong sipi.
- source_word: ἦλθον
  choice: naparito ako
  rationale: Tumutukoy sa pagdating at misyon ni Jesus; natural itong katumbas ng simpleng aorist sa pangungusap.
- source_word: καλέσαι
  choice: upang tawagin
  rationale: Pinananatili ng “tawagin” ang malawak na diwa ng pag-anyaya o pagpapatawag nang hindi nililimitahan ang kahulugan.
- source_word: δικαίους
  choice: ang mga matuwid
  rationale: Tuwirang salin ng substantival adjective at hindi ipinapasok sa pangunahing teksto ang posibleng ironikong pakahulugan.
- source_word: ἁμαρτωλούς
  choice: ang mga makasalanan
  rationale: Karaniwang katumbas na nagpapanatili sa matalas na paghahambing sa “mga matuwid.”
theological_decisions:
- issue: Ang sipi mula sa Oseas 6:6 at ang puwersa ng paghahambing
  choice: “Habag ang nais ko, at hindi handog.”
  alternative: Paraprasang nagsasabing lubusang itinatakwil ng Diyos ang lahat ng handog, o pinahinang saling nagsasabing mas gusto lamang niya ang habag sa pagkakataong ito.
  rationale: Pinananatili ng salin ang mariing propetikong paghahambing at ang pagsaway ni Jesus nang hindi ito ginagawang ganap na pag-aalis sa lahat ng paghahandog.
- issue: Ang tinutukoy ng “mga matuwid”
  choice: Panatilihin ang payak na “ang mga matuwid.”
  alternative: “Ang mga nag-aakalang matuwid sila” o “ang mga mapagmagaling sa sariling katuwiran.”
  rationale: Maaaring may ironya sa konteksto, ngunit hindi iyon tahasang minamarkahan ng Griyego. Kaya pinananatili sa teksto ang tunay na kalabuan at ipinapaliwanag lamang sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “humayo” upang mapanatili ang biblikal na bigat ng pautos, samantalang ang kabuuang ayos ng pangungusap ay nananatiling natural. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
