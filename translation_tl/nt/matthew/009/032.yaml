base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: tl
  text: Habang lumalabas sila, narito, dinala sa kanya ang isang lalaking pipi[a] na sinasapian ng demonyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bingi.” Maaaring mangahulugang “pipi” o “bingi” ang salitang Griyego, depende sa konteksto. Dito, sinusuportahan ng pahayag sa kasunod na talata na nagsalita siya ang saling “pipi.”
    reason: lexical_alternative
  - marker: b
    text: O “na nasa kapangyarihan ng demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Nang paalis na sila
  rationale: Likas na isinasalin nito ang genitive absolute bilang pangyayaring kasabay ng kasunod na kilos, habang ang δέ ay nagsisilbing banayad na paglipat sa susunod na tagpo.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili nito ang pantawag-pansing bisa at sigla ng salaysay nang hindi inaalis ang salitang nasa Griyego.
- source_word: προσήνεγκαν αὐτῷ
  choice: dinala sa kanya
  rationale: Malinaw nitong ipinahahayag ang pagdadala o paghaharap ng lalaki kay Jesus at tahasang kinakatawan ang αὐτῷ.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Sa salaysay, tumutukoy ito sa isang lalaking nasa hustong gulang; natural at tiyak sa kasarian ang salin.
- source_word: κωφὸν
  choice: pipi
  rationale: Maaaring mangahulugang bingi o pipi ang κωφός ayon sa konteksto. Mas angkop dito ang “pipi” dahil sinasabi sa kasunod na talata na nagsalita siya; pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: δαιμονιζόμενον
  choice: na sinasapian ng demonyo
  rationale: Ito ang malinaw at karaniwang paraan sa modernong Tagalog upang ilarawan ang kalagayang ipinahahayag ng pandiwaring Griyego, nang hindi nagpapaliwanag nang higit sa sinasabi ng teksto.
theological_decisions:
- issue: Paglalarawan sa kapinsalaang dulot ng demonyo
  choice: na sinasapian ng demonyo
  alternative: na nasa kapangyarihan ng demonyo
  rationale: Tuwirang inilalahad ng talata ang tunay na kapinsalaang may kaugnayan sa demonyo. Pamilyar at malinaw ang piniling salin, ngunit hindi nito tinutukoy nang mas detalyado kaysa sa Griyego ang eksaktong paraan o antas ng pagsapi.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Pinanatili ang “narito” upang katawanin ang biglang pantawag-pansin ng ἰδού. Ginamit ang payak at madaling maunawaang “pipi” at “sinasapian ng demonyo,” habang inilagay sa mga talababa ang mahahalagang alternatibo at leksikal na kalabuan.
