  source_fidelity: Ang “Nang paalis na sila” ay nagpapahiwatig na malapit pa lamang silang umalis, samantalang ang ἐξερχομένων ay nagsasaad na sila ay lumalabas na. Mas tumpak ang “Habang lumalabas sila.” Napananatili ng “narito” ang pantawag-pansing ἰδού, at tapat ang “dinala sa kanya” sa προσήνεγκαν αὐτῷ. Ang “lalaking pipi” ay naaayon sa kontekstuwal na kahulugan ng κωφός, at ang “na sinasapian ng demonyo” ay isang malinaw na salin ng δαιμονιζόμενον nang walang dagdag na pagpapaliwanag.
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Habang lumalabas sila, narito, dinala sa kanya ang isang lalaking pipi na sinasapian ng demonyo.” Ang pagbabago ay nag-aalis sa di-ganap na aspekto ng “paalis na.”
  terminology: Ang “pipi” ay angkop, na may talababa para sa leksikal na alternatibong “bingi.” Ang “sinasapian ng demonyo” ay pamilyar at nauunawaan sa Filipino, habang ang talababa ay nagbibigay ng mas malawak na alternatibong paglalarawan nang hindi nagtatakda ng eksaktong paraan ng demonyakong pagdurusa.
  issues:
