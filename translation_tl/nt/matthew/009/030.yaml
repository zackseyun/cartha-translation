  source_fidelity: 'Tapat ang salin sa Griyego: ang “nabuksan ang kanilang mga mata” ay maayos na katumbas ng aorist passive na ἠνεῴχθησαν, at hindi nagdaragdag ng tahasang gumawa. Naipapahayag ng “mahigpit silang binalaan” ang mariing puwersa ng ἐνεβριμήθη. Ang “Tiyakin ninyong walang sinumang makaalam nito” ay wastong idyomatikong pagsasalin ng Ὁρᾶτε μηδεὶς γινωσκέτω, na ang paksa ng “nito” ay kontekstuwal na ipinahihiwatig.'
