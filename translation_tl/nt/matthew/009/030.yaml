  terminology: Ang “mga mata,” “mahigpit silang binalaan,” at “makaaalam nito” ay angkop at malinaw. Wastong pinananatili ang pangalang “Jesus.” Hindi ipinapasok ng salin ang anumang paliwanag sa dahilan ng utos ni Jesus.
