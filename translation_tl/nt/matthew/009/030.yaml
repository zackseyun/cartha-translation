  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: tl
  text: At nabuksan ang kanilang mga mata. At mahigpit silang binalaan ni Jesus[a], “Tiyakin ninyong walang sinumang makaalam nito.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit silang inutusan” o “mariin silang pinagsabihan.” Nagpapahiwatig ang pandiwang Griyego ng matinding damdamin at puwersa sa babala.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Tiyakin ninyong walang sinumang makaalam.” Ang “nito” ay ipinahihiwatig ng konteksto ng pagpapagaling.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: nabuksan
  rationale: Pinananatili ng anyong balintiyak ang Griyegong aorist passive at likas na ipinahihiwatig ang panunumbalik ng paningin nang hindi tahasang nagdaragdag ng gumagawa.
- source_word: οἱ ὀφθαλμοί
  choice: ang kanilang mga mata
  rationale: Likas na salin ito ng tahasang pagmamay-ari sa Griyego at angkop sa modernong Tagalog.
- source_word: ἐνεβριμήθη
  choice: mahigpit silang binalaan
  rationale: Ipinahahayag ng pandiwa ang matinding damdamin at mariing babala o utos; malinaw itong naihahatid ng “mahigpit na binalaan” nang hindi ipinapalagay ang dahilan ni Jesus.
- source_word: Ὁρᾶτε
  choice: Tiyakin ninyo
  rationale: Ang pautos na anyo ay idyomatikong panawagan na mag-ingat at tiyaking masusunod ang kasunod na pagbabawal.
- source_word: μηδεὶς γινωσκέτω
  choice: walang sinumang makaalam nito
  rationale: Ipinahahayag nito ang pagbabawal sa ikatlong panauhan. Idinagdag ang “nito” para sa likas at malinaw na Tagalog, samantalang ang tinutukoy nito ay ipinahihiwatig lamang ng konteksto.
- source_word: λέγων
  choice: tuwirang sipi kasunod ng “binalaan”
  rationale: Sa Tagalog, likas na naipapahayag ang kasabay na pagsasalita sa pamamagitan ng tuwirang sipi nang hindi na isinasalin nang hiwalay ang participle bilang “na sinasabi.”
theological_decisions:
- issue: Lakas at layunin ng utos ni Jesus matapos ang pagpapagaling
  choice: Inilahad bilang isang mariing pagbabawal na huwag malaman ng iba ang nangyari.
  alternative: “Pinagsabihan sila ni Jesus” o “mahigpit silang inutusan ni Jesus”
  rationale: Malakas ang puwersa ng utos sa talata, ngunit hindi nito ipinaliliwanag ang dahilan ni Jesus. Pinananatili ng salin ang diin nang hindi nagdaragdag ng teolohikal na motibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang dalawang magkasunod na pang-ugnay na “At” upang katawanin ang καὶ … καὶ ng Griyego, habang ginawang likas sa Tagalog ang participle na λέγων sa pamamagitan ng tuwirang sipi.
