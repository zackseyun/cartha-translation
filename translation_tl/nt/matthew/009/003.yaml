    issue: Hindi pinakamainam ang “sa kanilang sarili” bilang pangunahing salin ng ἐν ἑαυτοῖς
    rationale: Maaari itong unawain bilang kanya-kanyang tahimik na pag-iisip, samantalang ang parirala ay maaari ring tumukoy sa pribadong pag-uusap ng pangkat. Mas natural ang “sa isa’t isa” bilang pangunahing salin kung may talababa para sa alternatibong panloob na pagbasa.
