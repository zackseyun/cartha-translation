  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: tl
  text: At narito, sinabi ng ilan sa mga eskriba sa isa’t isa[a], “Ang taong ito ay nagsasalita ng kalapastanganan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinabi sa kanilang sarili.” Ang pananalitang Griyego ay maaaring tumukoy sa pribadong pag-uusap o sa panloob na pag-iisip.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagpapatuloy sa salaysay.
- source_word: ἰδού
  choice: masdan ninyo
  rationale: Ipinahahayag ang panawag-pansing lakas ng salitang Griyego sa dignified ngunit nauunawaang makabagong Tagalog.
- source_word: τινες τῶν γραμματέων
  choice: ilan sa mga eskriba
  rationale: Tumpak na ipinahahayag ang isang di-tiyak na bahagi ng pangkat; ang “eskriba” ay karaniwang katawagan sa konteksto ng Ebanghelyo.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: sinabi ... sa kanilang sarili
  rationale: Pinananatili ang literal na diwa ng “sinabi” at ang posibleng kahulugan ng pribadong pagsasalita o panloob na pag-iisip, nang hindi ito nililimitahan sa tahimik na pag-iisip lamang.
- source_word: Οὗτος
  choice: ang taong ito
  rationale: Natural na tumutukoy kay Jesus at naipahihiwatig ang mapanuring tono nang hindi dinaragdagan ang tindi nito.
- source_word: βλασφημεῖ
  choice: Lumalapastangan
  rationale: Direktang ipinahahayag ang paratang na nagsasalita siya laban sa karangalan ng Diyos; ang aspektong nagaganap ay angkop sa kasalukuyang kilos sa salaysay.
theological_decisions:
- issue: Ang paratang ng mga eskriba laban kay Jesus
  choice: “Lumalapastangan ang taong ito.”
  alternative: “Nagsasalita ng kalapastanganan ang taong ito.”
  rationale: Pinananatili ang tuwirang bigat ng paratang at ang teolohikal na tensiyon ng salaysay, nang hindi ipinapaliwanag o hinahatulan dito kung bakit nila iyon sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “masdan ninyo” upang mapanatili ang panawag-pansing ἰδού, at nilagyan ng talababa ang tunay na kalabuan ng ἐν ἑαυτοῖς.
