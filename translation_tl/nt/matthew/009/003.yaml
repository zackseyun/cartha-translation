  source_fidelity: Kailangang ayusin ang ἰδού at ang ἐν ἑαυτοῖς. Ang “masdan ninyo” ay isang tuwirang utos sa mambabasa at hindi likas na katumbas ng pangmarkang pansalaysay na ἰδού; mas tumpak at natural ang “narito.” Ang “sa kanilang sarili” ay posible ngunit hindi gaanong natural para sa pangmaramihang paksa at mas malakas na itinutulak ang diwang panloob na pag-iisip. Ang “sa isa’t isa” ay malinaw na sumasaklaw sa pribadong pag-uusap, habang itinatala ng talababa ang alternatibong panloob na diwa.
  naturalness: Ang “At narito” ay makabago ngunit marangal na Tagalog sa salaysay. Ang “Ang taong ito ay nagsasalita ng kalapastanganan” ay mas likas na Tagalog na pagpapahayag ng paratang kaysa sa walang-layong “Lumalapastangan ang taong ito,” at pinananatili nito ang demonstratibong mapanuring tono.
  terminology: Pinananatili ang “mga eskriba,” na matatag na katawagan para sa γραμματεῖς. Ang “nagsasalita ng kalapastanganan” ay malinaw na katumbas ng βλασφημεῖ sa paratang na ito at hindi nagdaragdag ng pagpapaliwanag o doktrinal na paghatol.
