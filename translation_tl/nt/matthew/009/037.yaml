  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa kanyang mga alagad, “Sagana ang aanihin, ngunit kakaunti ang mga manggagawa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Pagkatapos, sinasabi niya sa kanyang mga alagad.” Gumagamit ang Griyego ng pangkasalukuyang pandiwa sa salaysay; maaari rin itong isalin sa pangnagdaan gaya ng nasa teksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas at maikling panandang temporal sa modernong Filipino na nagpapakita ng kasunod na pangyayari.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman nasa historical present ang Griyego, mas natural sa salaysay na Filipino ang pangnagdaang “sinabi niya”; itinatala sa talababa ang anyong literal.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ at ang karaniwang salin ng μαθηταί bilang “mga alagad.”
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: … ngunit …
  rationale: Malinaw at likas na ipinahahayag ng “ngunit” ang paghahambing na binubuo ng μέν...δέ nang hindi nagiging mabigat ang pangungusap.
- source_word: θερισμός
  choice: aanihin
  rationale: Pinananatili ang larawang pang-agrikultura ng θερισμός, habang ang “aanihin” ay natural na Filipino para sa ani na handa o nararapat tipunin.
- source_word: πολύς
  choice: sagana
  rationale: Ang “sagana” ay malinaw at idyomatikong nagsasaad ng kasaganaan ng aanihin.
- source_word: ἐργάται
  choice: mga manggagawa
  rationale: Karaniwan, makabago, at tumpak na tawag sa mga gumagawa sa pag-aani.
- source_word: ὀλίγοι
  choice: kakaunti
  rationale: Tuwirang ipinapakita ang matinding kaibahan sa saganang aanihin.
theological_decisions:
- issue: Metaporikal na diwa ng pag-aani
  choice: Pinanatili ang larawang pang-agrikultura nang hindi ipinapaliwanag sa teksto kung sino ang tinutukoy ng aanihin.
  alternative: Ipaliwanag na ang aanihin ay mga taong handang tumanggap sa ministeryo ni Jesus.
  rationale: Metapora lamang ang tahasang ibinibigay ng talata; ang pagpapaliwanag sa tinutukoy nito ay magdaragdag ng interpretasyong wala mismo sa pangungusap.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “alagad,” “aanihin,” at “manggagawa” upang mapanatili ang pamilyar na metaporang biblikal nang hindi nagiging makaluma. Inilipat ang marker sa dulo ng buong pangungusap sapagkat ang talababa ay tumutukoy sa anyo ng pandiwang pambungad.
