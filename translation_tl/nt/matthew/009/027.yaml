  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: tl
  text: Habang nagpapatuloy si Jesus mula roon, sinundan siya ng dalawang bulag na lalaki na sumisigaw at nagsasabi, “Maawa ka sa amin, Anak ni David!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ni David” ay isang titulong panghari at mesiyaniko na tumutukoy kay Jesus bilang ipinangakong tagapagmana ng angkan ni David.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: Habang papaalis ... mula roon
  rationale: Ipinahahayag ng kasalukuyang participle at ng ἐκεῖθεν na kasabay ng pagsunod ng mga lalaki ang pag-alis ni Jesus sa lugar na iyon. Likas sa makabagong Tagalog ang “habang papaalis ... mula roon” at hindi nito ipinapalagay na basta dumaan lamang siya sa tabi nila.
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sa kanya
  rationale: Ito ang tuwiran at likas na salin ng pisikal na pagsunod sa daloy ng salaysay.
- source_word: δύο τυφλοὶ
  choice: dalawang lalaking bulag
  rationale: Pang-uri ang τυφλοί ngunit panlalaking maramihan ang anyo nito; malinaw at magalang sa Tagalog ang paglalagay ng ipinahihiwatig na “lalaki.”
- source_word: κράζοντες καὶ λέγοντες
  choice: na sumisigaw
  rationale: Ipinakikita ng “sumisigaw” ang malakas at apurahang panawagan. Ang mismong siniping pananalita ang likas na gumaganap sa diwa ng “at nagsasabi,” kaya iniiwasan ang mabigat at paulit-ulit na “sumisigaw at nagsasabi.”
- source_word: Ἐλέησον ἡμᾶς
  choice: Maawa ka sa amin
  rationale: Pinananatili nito ang tuwiran at isahang pakiusap kay Jesus. Hindi idinagdag ang “po” o ginawang “kayo,” sapagkat walang katumbas na panandang panggalang sa Griyego at maaaring mapagkamalang maramihan ang tinutukoy.
- source_word: υἱὲ Δαυίδ
  choice: Anak ni David
  rationale: Pinananatili ang kinikilalang maharlika at mesiyanikong titulo sa halip na paliitin ito sa paliwanag na “inapo ni David.”
theological_decisions:
- issue: Mesiyanikong kahulugan ng “Anak ni David”
  choice: Panatilihin sa pangunahing teksto ang titulong “Anak ni David.”
  alternative: “Mesiyas na Anak ni David” o “inapo ni David”
  rationale: Ang Griyego ay gumagamit ng tradisyonal na titulo nang walang idinagdag na paliwanag. Pinananatili ng salin ang maharlika at mesiyanikong pahiwatig habang hinahayaan ang konteksto at talababa na magpaliwanag, sa halip na magdagdag ng interpretasyon sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang “ka” dahil iisang tao si Jesus na kinakausap at gayon din ang bilang sa Griyego; hindi ito nilalayong maging walang galang. Inilagay ang talababa pagkatapos ng “Anak ni David,” ang pariralang aktuwal nitong ipinapaliwanag.
