id: MAT.9.29
reference: Matthew 9:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: tl
  text: Pagkatapos, hinipo niya ang kanilang mga mata at sinabi, “Mangyari sa inyo ayon sa inyong pananampalataya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagtitiwala.” Ang salitang Griyego na pistis ay maaari ring mangahulugang “pagtitiwala,” at sa ilang konteksto ay “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa modernong Tagalog.
- source_word: ἥψατο
  choice: hinipo
  rationale: Ang anyong ito ng ἅπτω ay tumutukoy sa pisikal na paghipo; tuwiran at angkop sa tagpo ng pagpapagaling ang “hinipo.”
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: ang kanilang mga mata
  rationale: Ang genitibo pagkatapos ng ἅπτομαι ay nagsasaad ng bagay na hinipo; ito ang natural na ayos sa Tagalog.
- source_word: λέγων
  choice: at sinabi
  rationale: Kasabay ng paghipo ang pagsasalita. Mas natural sa salaysay na Tagalog ang koordinasyong “at sinabi” kaysa literal na anyong pandiwari.
- source_word: Κατὰ
  choice: ayon sa
  rationale: Ipinapahayag ng κατά na may akusatibo ang pagkakatugma o sukat; hindi nito ipinipilit ang mas malakas na diwang sanhi.
- source_word: τὴν πίστιν ὑμῶν
  choice: inyong pananampalataya
  rationale: Sa konteksto, tumutukoy ang πίστις sa pananalig o pagtitiwala ng mga bulag kay Jesus. Ang “pananampalataya” ang karaniwang terminong biblikal, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: γενηθήτω
  choice: Mangyari
  rationale: Ang aorist passive imperative ng γίνομαι ay isang makapangyarihang pahayag na nag-uutos o nagpapahintulot na maganap ang bagay. Pinananatili ng “Mangyari” ang puwersang ito nang hindi dinaragdagan ang diwa.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Ang datibo ay tumutukoy sa mga tatanggap o makikinabang sa ipinahahayag na mangyayari; likas sa Tagalog ang “sa inyo.”
theological_decisions:
- issue: Pagsasalin ng πίστις sa pahayag tungkol sa pagpapagaling
  choice: pananampalataya
  alternative: pagtitiwala; katapatan sa ilang ibang konteksto
  rationale: Ang agarang konteksto ay ang pananalig ng dalawang bulag sa kakayahan ni Jesus. Pinananatili ng “pananampalataya” ang kinikilalang teolohikal na termino, ngunit hindi itinatago ng talababa na maaari ring idiin ng πίστις ang pagtitiwala. Hindi pinili ang “katapatan” sa pangunahing teksto dahil hindi iyon ang pinakamalamang na diwa rito.
- issue: Ugnayan ng pananampalataya at paggaling sa κατά
  choice: ayon sa inyong pananampalataya
  alternative: batay sa inyong pananampalataya
  rationale: Ang “ayon sa” ay nagpapanatili sa diwa ng pagkakatugma o sukat at umiiwas sa tahasang pagpapakahulugang ang pananampalataya ang nagsasariling sanhi ng paggaling.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Ang “Mangyari sa inyo” ay bahagyang pormal ngunit malinaw at angkop sa isang makapangyarihang pahayag ni Jesus; iniiwasan nito ang labis na pagpapaliwanag sa mismong talata.
