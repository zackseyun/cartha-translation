  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: tl
  text: Ngunit sinasabi ng mga Pariseo, “Sa pamamagitan ng pinuno ng mga demonyo ay nagpapalayas siya ng mga demonyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat ng masasamang paratang ng mga Pariseo sa positibong tugon ng mga tao sa naunang talata.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwan at malinaw na katawagan sa Filipino para sa pangkat na ito ng mga Judio.
- source_word: ἔλεγον
  choice: patuloy na sinasabi
  rationale: Pinananatili ang di-ganap na aspekto ng imperfect, na maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Sa kapangyarihan ng pinuno
  rationale: Instrumental ang gamit ng ἐν kasama ng dative; likas sa Filipino ang pariralang ito at malinaw na ipinakikitang ang ibinibintang na pinagmumulan ng kapangyarihan ay ang pinuno.
- source_word: ἄρχοντι
  choice: pinuno
  rationale: Tuwirang modernong katumbas ng ἄρχων na nagpapahayag ng awtoridad nang hindi nagpapahiwatig ng dugong maharlika.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: ng mga demonyo / mga demonyo
  rationale: Tumpak na tinutukoy ang mga demonyo at pinananatili ang pag-uulit sa paratang ng orihinal.
- source_word: ἐκβάλλει
  choice: nagpapalayas
  rationale: Natural at kinikilalang Filipino para sa pagpapalabas o pagtataboy ng mga demonyo sa konteksto ng eksorsismo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δαιμόνια sa konteksto ng pagpapalayas
  choice: mga demonyo
  alternative: masasamang espiritu
  rationale: Espesipikong δαιμόνια ang salitang Griyego, hindi πνεύματα; pinananatili ng “mga demonyo” ang eksaktong supernatural na pahayag.
- issue: Instrumental na kahulugan ng ἐν τῷ ἄρχοντι
  choice: Sa kapangyarihan ng pinuno
  alternative: Sa pamamagitan ng pinuno
  rationale: Kapuwa maaaring magpahayag ng instrumento o ahensiya, ngunit malinaw at natural sa Filipino ang napiling anyo nang hindi pinapasyahan kung personal na ahensiya o ipinagkaloob na kapangyarihan ang eksaktong diin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “patuloy na sinasabi” upang maipakita ang imperfect aspect, at “nagpapalayas” bilang natural na bokabularyo sa konteksto ng mga demonyo.
