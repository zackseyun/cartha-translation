  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: tl
  text: Nang makita iyon ng maraming tao, natakot sila[a] at niluwalhati ang Diyos, na nagbigay ng gayong awtoridad sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “napuspos sila ng mapitagang pagkamangha.” Mas literal na “natakot” ang pandiwang Griyego, ngunit maaaring kasama sa takot ang matinding pagpipitagan at pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita iyon
  rationale: Isinalin ang aorist participle bilang sugnay na panahunan para maging natural sa Tagalog. Ang “iyon” ay tumutukoy sa pangyayaring nasaksihan nila sa naunang konteksto.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Nagsisilbi itong banayad na paglipat sa reaksiyon ng mga tao. Sa Tagalog, sapat nang ipinahihiwatig ng bagong sugnay ang paglipat; ang “ngunit” ay maaaring magdagdag ng mas matinding pagsalungat kaysa nasa Griyego.
- source_word: οἱ ὄχλοι
  choice: ang maraming tao
  rationale: Pinananatili nito ang diwa ng maramihang pulutong sa natural at pangkaraniwang modernong Tagalog; mas likas ito rito kaysa “mga karamihan” o “mga pulutong.”
- source_word: ἐφοβήθησαν
  choice: natakot sila
  rationale: Ito ang tuwirang kahulugan ng pandiwa at pinananatili ang tensiyon sa pagitan ng takot at mapitagang pagkamangha.
- source_word: ἐδόξασαν
  choice: niluwalhati
  rationale: Pinananatili ang mahalagang teolohikal na diwa ng pagbibigay-luwalhati, sa halip na paliitin ito sa “pinuri” lamang.
- source_word: τὸν θεὸν
  choice: ang Diyos
  rationale: Karaniwang tuwirang salin ng layon ng pandiwang ἐδόξασαν.
- source_word: τὸν δόντα
  choice: na nagbigay
  rationale: Natural na sugnay na panuring sa Tagalog para sa articular aorist participle; malinaw na ang Diyos ang nagbigay.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinahahayag nito ang karapatan o awtoridad na kumilos, hindi lamang kakayahan o lakas.
- source_word: τοιαύτην
  choice: gayong
  rationale: Natural na katumbas na tumutukoy sa uri ng awtoridad na nasaksihan sa pangyayari.
- source_word: τοῖς ἀνθρώποις
  choice: sa mga tao
  rationale: Ang ἄνθρωποι ay maaaring tumukoy sa mga tao o sangkatauhan sa pangkalahatan. Ang “mga tao” ay natural sa Tagalog at hindi nilulutas kung si Jesus lamang o ang mga tao bilang uri ang nasa isip ng mga pulutong.
theological_decisions:
- issue: Kung papahinain ang reaksiyon mula sa takot tungo sa pagkamangha
  choice: natakot sila
  alternative: namangha sila / napuspos sila ng pagpipitagan
  rationale: Karaniwang ipinahahayag ng ἐφοβήθησαν ang takot. Maaaring kasama rito ang mapitagang pagkamangha, ngunit hindi ito dapat ipalit nang tahasan sa mas matinding leksikal na diwa.
- issue: Ang saklaw ng τοῖς ἀνθρώποις
  choice: sa mga tao
  alternative: sa sangkatauhan
  rationale: Maaaring gamitin ang panlalaking maramihan sa Griyego para sa mga tao sa pangkalahatan. Pinananatili ng “sa mga tao” ang likas na lawak at ang tensiyong lumilitaw nang iugnay ng mga pulutong kay Jesus ang awtoridad na ibinigay sa mga tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “awtoridad” bilang karaniwang kasalukuyang salita para sa ἐξουσία, at iniwasan ang mas lumang o madaling mapagkamalang pampolitikang “kapamahalaan.”
