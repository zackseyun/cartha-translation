id: MAT.9.11
reference: Matthew 9:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: tl
  text: Nang makita ito ng mga Pariseo,[a] sinabi nila sa mga alagad niya, “Bakit kumakain ang guro ninyo kasama ng mga maniningil ng buwis at mga makasalanan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At pagkakita nito ng mga Pariseo, sinabi nila sa mga alagad niya…” Hindi tahasang binabanggit sa Griyego ang layon ng “makita”; ipinahihiwatig ng konteksto na nakita nila ang tagpo ng pagkain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita ito
  rationale: Likas sa Tagalog ang temporal na pagkakasalin sa aorist participle. Idinagdag ang “ito” upang tukuyin ang tagpo ng pagkain na ipinahihiwatig ng konteksto, bagaman walang tahasang layon sa Griyego.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Bagaman imperfect ang anyo at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, ang karaniwang “sinabi nila” ang pinakanatural sa salaysay na Tagalog; hindi sapat ang konteksto upang igiit ang “paulit-ulit nilang sinasabi.”
- source_word: μαθηταῖς
  choice: mga alagad
  rationale: Karaniwan at angkop na salin sa Ebanghelyo, at pinananatili ang ugnayan ng guro at alagad.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Tuwiran at likas na katumbas ng tanong tungkol sa dahilan.
- source_word: τελωνῶν
  choice: mga maniningil ng buwis
  rationale: Malinaw at kasalukuyang katawagan sa mga taong nangongolekta ng buwis, nang hindi nagdaragdag ng teknikal na detalye.
- source_word: ἁμαρτωλῶν
  choice: mga makasalanan
  rationale: Tuwiran at nakaugaliang salin na nagpapanatili sa moral at panlipunang bansag sa konteksto.
- source_word: ἐσθίει
  choice: kumakain
  rationale: Pinananatili ang pangkasalukuyang anyo ng tanong at ang payak na kahulugan ng pandiwa.
- source_word: διδάσκαλος
  choice: guro
  rationale: Payak at malinaw na salin ng titulo, nang hindi ipinapasok ang mas tiyak na titulong “rabbi.”
theological_decisions:
- issue: Kung gagawing tahasan ang layon ng “makita”
  choice: Idinagdag ang “ito,” na tumutukoy sa tagpo ng pagkain
  alternative: “Pagkakita ng mga Pariseo” o “Nang makita ng mga Pariseo” na walang tahasang layon
  rationale: Hindi tahasang binanggit ng Griyego ang layon, ngunit nangangailangan ang natural na Tagalog ng malinaw na reperensiya rito. Ang “ito” ay tumutukoy lamang sa tagpong nasa konteksto at hindi nagdaragdag ng teolohikal na pakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “mga Pariseo,” “mga alagad,” at “mga makasalanan” bilang malinaw at nakaugaliang mga terminong biblikal; iniwasan ang labis na teknikal o makalumang pananalita.
