base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: tl
  text: Ngunit lumingon si Jesus, at nang makita niya siya, sinabi niya, “Lakasan mo ang iyong loob, anak; iniligtas ka ng iyong pananampalataya.[a]” At gumaling ang babae mula sa oras na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “iniligtas” ay maaari ring mangahulugang “pinagaling” o “ginawang magaling”; ang “pananampalataya” ay maaari ring isaling “pagtitiwala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: lumingon
  rationale: Ipinahahayag ang intransitibong pagkilos na pagharap ni Jesus sa babae nang hindi dinaragdagan ang direksiyon ng paglingon.
- source_word: ἰδὼν
  choice: nang makita siya
  rationale: Natural na Filipino ang sugnay na panahunan at malinaw na inuugnay ang pagkakita sa sumunod na pagsasalita.
- source_word: Θάρσει
  choice: Lakasan mo ang iyong loob
  rationale: Karaniwan at malinaw na pananalitang Filipino para sa utos na magkaroon ng tapang o tiwala.
- source_word: θύγατερ
  choice: anak
  rationale: Sa Filipino, ang “anak” ay likas na magiliw na pantawag at hindi kinakailangang tukuyin ang kasarian na malinaw na sa konteksto.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinananatili ang karaniwang teolohikal at leksikal na saklaw ng πίστις; maaari rin itong magpahiwatig ng pagtitiwala sa kontekstong ito.
- source_word: σέσωκέν σε
  choice: iniligtas ka
  rationale: Pinananatili ang malawak na saklaw ng σῴζω—pagliligtas at pagpapagaling—sa mismong sinabi ni Jesus.
- source_word: ἐσώθη
  choice: gumaling
  rationale: Sa pangwakas na salaysay, malinaw na pisikal na paggaling ng babae ang agarang kinalabasan.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: mula nang oras na iyon
  rationale: Malapit sa anyo ng Griyego at nauunawaan bilang paggaling na nagsimula sa mismong oras na iyon.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang “pananampalataya” ay nagpapanatili ng mas malawak na gamit ng salita, samantalang ang personal na pagtitiwala ay nananatiling bahagi ng kahulugan sa konteksto.
- issue: Magkaibang pagsasalin ng dalawang anyo ng σῴζω
  choice: “iniligtas ka” sa sinabi ni Jesus; “gumaling” sa salaysay
  alternative: “pinagaling ka” sa parehong pagkakataon
  rationale: Hindi nililimitahan ng unang parirala ang salita sa pisikal na paggaling lamang, ngunit nililinaw ng pangalawa ang kongkretong kinalabasan sa babae.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “anak” bilang likas at magiliw na pantawag, at iniwasan ang labis na pormal o makalumang ayos.
