- from: Ngunit lumingon si Jesus at, nang makita siya, sinabi, “Lakasan mo ang iyong loob, anak; iniligtas ka ng iyong pananampalataya.[a]” At gumaling ang babae mula nang oras na iyon.
  to: Ngunit lumingon si Jesus, at nang makita niya siya, sinabi niya, “Lakasan mo ang iyong loob, anak; iniligtas ka ng iyong pananampalataya.[a]” At gumaling ang babae mula sa oras na iyon.
  rationale: Wasto ang pangunahing pagsasalin at pinanatili ang leksikal at teolohikal na tensiyon ng σῴζω. Kinailangan lamang ang ligtas na pagwawasto ng “mula nang oras na iyon” tungo sa “mula sa oras na iyon,” kasama ang bahagyang pagpapalinaw ng sintaksis sa unang sugnay.
