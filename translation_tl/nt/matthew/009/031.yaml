  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: tl
  text: Ngunit pagkalabas nila, ipinamalita nila siya sa buong lupaing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong rehiyong iyon.” Ang salitang Griyego na γῆ ay maaaring mangahulugang “lupain,” “rehiyon,” o “pook.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat sa naunang utos ni Jesus na huwag itong ipaalam.
- source_word: ἐξελθόντες
  choice: pagkalabas nila
  rationale: Likas sa modernong Tagalog at malinaw na nauuna ang paglabas sa pangunahing kilos na pagpapamalita.
- source_word: διεφήμισαν
  choice: ipinamalita nila
  rationale: Ipinapahayag nito ang malawakang pagpapalaganap ng balita o katanyagan, nang hindi nagiging mabigat o di-likas ang pananalita.
- source_word: αὐτὸν
  choice: ang tungkol sa kanya
  rationale: Bagaman tuwirang layon sa Griyego, hinihingi ng likas na Tagalog na ipahayag na ang ipinamalita ay tungkol sa kanya.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: sa buong lupaing iyon
  rationale: Pinananatili ng “lupain” ang saklaw ng γῆ, na maaaring tumukoy sa isang lokal na lupain, pook, o rehiyon; ang “buong” ay tumutugma sa ὅλῃ.
theological_decisions:
- issue: Heograpikong saklaw ng γῆ
  choice: lupain
  alternative: rehiyon o pook
  rationale: Hindi tiyak sa Griyego kung dapat itong unawain bilang lupain, rehiyon, o pook. Ang “lupain” ay natural at marangal sa Tagalog at hindi nagpapahiwatig ng pandaigdigang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “ipinamalita” upang maging natural sa karaniwang mambabasa, at pinanatili sa talababa ang tunay na lawak ng kahulugan ng γῆ.
