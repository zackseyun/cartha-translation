id: MAT.9.28
reference: Matthew 9:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: tl
  text: Pagpasok niya sa bahay, lumapit sa kanya ang mga bulag na lalaki. Sinabi sa kanila ni Jesus, “Naniniwala ba kayong kaya kong gawin ito?” Sumagot sila sa kanya, “Oo, Panginoon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Oo, ginoo.” Ang Griyegong κύριε ay maaaring magalang na pagtawag, ngunit maaari rin nitong ipahiwatig ang pagkilala sa awtoridad ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Pagpasok niya sa bahay
  rationale: Likas na ipinapahayag sa Filipino ang pansamantalang ugnayan ng aorist participle at ang pagpasok sa bahay, nang hindi ginagawang mabigat ang pangungusap.
- source_word: προσῆλθον αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at natural na katumbas ng paglapit sa isang tao; naiiba rin ito sa naunang kilos ng pagpasok.
- source_word: οἱ τυφλοί
  choice: ang mga lalaking bulag
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa dalawang lalaking binanggit sa konteksto; malinaw ito nang hindi gumagamit ng mapanlibak na katawagan.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Sinabi sa kanila ni Jesus
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Filipino ang aspektong naganap; hindi nito binabago ang kahulugan.
- source_word: Πιστεύετε
  choice: Naniniwala ba kayo
  rationale: Direkta at pangkaraniwang katumbas ng πιστεύω sa tanong tungkol sa pagtitiwala sa kakayahan ni Jesus.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: kayong kaya kong gawin ito
  rationale: Ang “kaya” ay natural na Filipino para sa δύναμαι at malinaw na tumutukoy sa kakayahang gawin ang hinihinging pagpapagaling.
- source_word: λέγουσιν αὐτῷ
  choice: Sumagot sila sa kanya
  rationale: Bagaman literal na “sinabi nila,” ipinakikita ng “sumagot” ang tungkulin ng pahayag sa usapan at natural ito sa Filipino.
- source_word: Ναί
  choice: Opo
  rationale: Ipinahahayag nito kapuwa ang pagsang-ayon at paggalang na likas sa sagot sa kontekstong Filipino.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang posibleng pagkilala sa awtoridad ni Jesus, habang nililinaw sa talababa na maaari rin itong maging magalang na pagtawag.
theological_decisions:
- issue: Pagtawag na κύριε kay Jesus
  choice: Panginoon
  alternative: ginoo
  rationale: Maaaring magalang na tawag lamang ang κύριε, ngunit ang “Panginoon” ay nagpapanatili rin sa posibleng pagkilala sa awtoridad ni Jesus nang hindi ipinipilit na isa na itong ganap na pahayag tungkol sa kanyang pagka-Diyos.
- issue: Mga historical present na λέγει at λέγουσιν
  choice: 'Isinalin bilang naganap na kilos: “Sinabi” at “Sumagot”'
  alternative: 'Panatilihin sa pangkasalukuyang anyo: “Sinasabi” at “Sumasagot”'
  rationale: Hindi minamarkahan ng pandiwang Filipino ang panahunan sa paraang katulad ng Griyego. Sa tuloy-tuloy na salaysay, mas natural ang aspektong naganap at buo na, habang nananatili ang pagkakasunod-sunod ng mga pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Opo” upang maging likas ang magalang na pagsang-ayon, at “mga lalaking bulag” upang malinaw na tukuyin ang mga tauhan nang hindi ginagawang katawagan ang kanilang kapansanan.
