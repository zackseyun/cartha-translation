  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: tl
  text: At, batid ni Jesus ang kanilang mga iniisip, sinabi niya, “Bakit kayo nag-iisip ng masama sa inyong mga puso?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: batid
  rationale: Ipinahahayag ng participle ang malinaw na pagkaalam ni Jesus sa panloob nilang pangangatwiran. Likas at marangal sa Tagalog ang “batid” at hindi nito dinaragdagan ang pahayag ng teksto.
- source_word: ἐνθυμήσεις
  choice: mga iniisip
  rationale: Tumutukoy ito sa mga kaisipan o panloob na pagninilay. Ang “mga iniisip” ay natural sa modernong Tagalog at angkop sa konteksto.
- source_word: Ἱνατί
  choice: Bakit
  rationale: Tuwirang itinatanong ng salita ang dahilan o motibo; “Bakit” ang malinaw at karaniwang katumbas.
- source_word: ἐνθυμεῖσθε
  choice: kayo nag-iisip
  rationale: Pinananatili nito ang nagpapatuloy na kilos ng present tense at ang ugnayang leksikal nito sa naunang “mga iniisip.”
- source_word: πονηρὰ
  choice: ng masama
  rationale: Ang neuter plural adjective ay ginagamit bilang pangngalan para sa masasamang kaisipan o bagay. Sa Tagalog, natural na maipahayag ang di-tiyak na layon bilang “ng masama” nang hindi nililimitahan sa isang mas tiyak na kahulugan.
- source_word: καρδίαις
  choice: mga puso
  rationale: Pinananatili ng “mga puso” ang metapora ng Griyego para sa panloob na pagkatao, kabilang ang pag-iisip at hangarin, sa halip na paliitin ito sa “isip.”
theological_decisions:
- issue: Ang pagkaalam ni Jesus sa hindi binigkas na mga iniisip
  choice: batid ni Jesus ang mga iniisip nila
  alternative: napansin ni Jesus ang mga iniisip nila
  rationale: Tahasang inilalarawan ng talata na alam ni Jesus ang panloob nilang pangangatwiran. Pinananatili ng “batid” ang bigat ng pahayag nang hindi ito pinalalawak tungo sa isang doktrinal na paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “batid” upang maging maikli at dignified; pinanatili ang biblikal na metapora ng “puso.”
