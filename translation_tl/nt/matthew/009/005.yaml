  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: tl
  text: 'Sapagkat alin ang mas madaling sabihin: ‘Pinatawad na[a] ang iyong mga kasalanan,’ o sabihin: ‘Bumangon ka at lumakad’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinatatawad ang iyong mga kasalanan.” Ang pangkasalukuyang balintiyak sa Griyego ay maaari ring unawain bilang isang kalagayang bunga ng naganap na pagpapatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: Sapagkat alin ang mas madaling
  rationale: Ang τί kasama ng pahambing na εὐκοπώτερον ay nagtatanong kung alin sa dalawang pagpipilian ang mas madali. Pinananatili ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata.
- source_word: εἰπεῖν
  choice: sabihin
  rationale: Karaniwang pananalita ang tinutukoy, kaya natural at pare-parehong ginamit ang “sabihin” sa dalawang sugnay.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Pinatatawad ang iyong mga kasalanan
  rationale: Ang ἀφίενταί ay pangkasalukuyang balintiyak at ang “mga kasalanan” ang simuno. Pinananatili ng salin ang balintiyak at hindi tahasang tinutukoy ang gumagawa ng pagpapatawad. Inilalagay sa talababa ang posibleng diwang kalagayang bunga na “Pinatawad na.”
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Ito ang tuwiran, karaniwan, at malinaw na katumbas sa modernong Tagalog.
- source_word: Ἔγειρε
  choice: Bumangon ka
  rationale: Sa konteksto ng pagpapagaling, ang pautos na ἔγειρε ay natural na nangangahulugang bumangon.
- source_word: καὶ περιπάτει
  choice: at lumakad
  rationale: Ang pautos ay humihiling ng aktuwal na paglakad pagkatapos bumangon; “lumakad” ang likas at marangal na katumbas.
- source_word: σου
  choice: iyong
  rationale: Pinananatili nito ang ikalawang panauhang isahan at ang dignidad ng direktang pahayag.
theological_decisions:
- issue: Pahayag ni Jesus tungkol sa kapatawaran
  choice: Pinatatawad ang iyong mga kasalanan
  alternative: Pinatawad na ang iyong mga kasalanan
  rationale: Hindi sapilitang nilulutas ng pangkasalukuyang balintiyak sa Griyego ang eksaktong panahon ng pagpapatawad. Pinananatili sa pangunahing teksto ang payak na balintiyak, habang kinikilala sa talababa ang posibleng diwang kalagayang bunga.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Sapagkat” upang malinaw na mapanatili ang paliwanag na ugnayan sa naunang pangungusap; iniwasan ang mas kolokyal na “kasi.”
