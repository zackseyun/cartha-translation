  verdict: revise
  source_fidelity: Ang pangunahing suliranin ay ang “Pinatatawad ang iyong mga kasalanan.” Bagaman pangkasalukuyang balintiyak ang ἀφίενται, ang anyong “pinatatawad” sa modernong Tagalog ay karaniwang nagpapahiwatig ng nagpapatuloy na proseso (“are being forgiven”), na hindi ang pinakanatural na diwa ng pahayag sa kontekstong ito. Ang “Pinatawad na” ay likas na naghahayag ng kasalukuyang kalagayang bunga ng kapatawaran nang hindi tinutukoy kung sino ang nagpapatawad.
  naturalness: Natural at marangal ang kabuuang ayos, kabilang ang “Sapagkat,” “Bumangon ka,” at “lumakad.” Gayunman, ang pagpapalit sa pangunahing pandiwa ng kapatawaran ay kailangan upang maiwasan ang di-likas at progresibong pagbasa.
  terminology: Wasto ang “mga kasalanan,” “Bumangon ka,” at “lumakad.” Ang “Pinatawad na” ay ang mas idiomatiko at angkop na Tagalog na katumbas ng deklarasyong balintiyak tungkol sa kapatawaran.
