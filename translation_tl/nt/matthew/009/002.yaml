id: MAT.9.2
reference: Matthew 9:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: tl
  text: At narito, dinala nila sa kanya ang isang paralitikong nakahiga sa isang higaan. Nang makita ni Jesus ang kanilang[a] pananampalataya, sinabi niya sa paralitiko, “Lakasan mo ang iyong loob, anak; pinatawad na ang iyong mga kasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kanilang” ay pangmaramihan. Maaaring tumukoy ito sa mga nagdala sa paralitiko, o sa pangkat na kinabibilangan din niya; hindi ito tahasang nililinaw ng teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang masigla at pantawag-pansing panandang pandiskurso ni Mateo nang hindi nagiging lipas o labis na pormal.
- source_word: προσέφερον
  choice: may mga taong nagdadala
  rationale: Ipinahahayag ang di-ganap na aspekto ng imperfect bilang kilos na nagaganap sa tagpo; ang 'may mga taong' ay likas na paraan upang katawanin ang di-tinukoy na pangmaramihang simuno.
- source_word: παραλυτικὸν
  choice: isang paralitiko
  rationale: Maikli, karaniwan, at hindi nagdaragdag ng salitang tumutukoy sa kasarian na wala sa mismong pangngalan sa Griyego.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: nakahiga sa isang higaan
  rationale: Likas na Filipino para sa kalagayan o posisyon ng paralitiko; ang 'higaan' ay hindi labis na nagpapasiya kung kama, teheras, o banig ang tinutukoy.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Karaniwang salin na angkop dito sa pagtitiwalang nahahayag sa pagkilos.
- source_word: Θάρσει
  choice: Lakasan mo ang iyong loob
  rationale: Likas at tuwirang utos ng pagpapalakas ng loob, na pinananatili ang lakas ng imperative.
- source_word: τέκνον
  choice: anak
  rationale: Magiliw na pantawag na hindi kailangang tumukoy sa kasarian at natural sa makabagong Filipino.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: pinatatawad na ang iyong mga kasalanan
  rationale: Pinananatili ang kasalukuyang deklarasyon at ang di-binanggit na tagaganap ng passive, nang hindi ipinapasok sa salin ang isang ganap na paliwanag teolohikal.
theological_decisions:
- issue: Saklaw ng τὴν πίστιν αὐτῶν
  choice: Pinanatili ang pangmaramihang 'kanilang pananampalataya' at nilinaw sa talababa ang saklaw na hindi tiyak.
  alternative: Tukuying pananampalataya lamang ng mga nagdala sa kanya, o ng paralitiko lamang.
  rationale: Ang αὐτῶν ay pangmaramihan ngunit hindi tiyak kung kasama rito ang paralitiko. Hindi dapat lutasin ng salin ang hindi nilulutas ng teksto.
- issue: Lakas ng pahayag ng kapatawaran
  choice: 'Isang deklarasyong passive: ''pinatatawad na ang iyong mga kasalanan.'''
  alternative: 'Gawing tahasang Diyos ang tagapagpatawad, o isalin bilang ganap nang natapos na kilos: ''napatawad na.'''
  rationale: Hindi binabanggit sa anyong passive sa Griyego ang tagaganap, at ang present tense ay angkop na ihayag bilang kasalukuyang pahayag nang hindi isinasara ang teolohikal na pahiwatig ng awtoridad ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang masiglang himig ng “narito,” ngunit iniwasan ang mga lipas na salita. Ang “paralitiko” ay maikli at pamilyar sa kontekstong biblikal; ang “higaan” ay sadyang malawak upang hindi labis na tukuyin ang uri ng κλίνη.
