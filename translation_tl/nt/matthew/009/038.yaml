  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: tl
  text: Kaya taimtim kayong manalangin sa Panginoon ng ani na magpadala siya ng mga manggagawa sa kanyang ani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magpalabas” ng mga manggagawa. Mas mariin ang pandiwang Griyego kaysa sa payak na “magpadala,” bagaman dito ay tumutukoy ito sa pagpapadala ng mga manggagawa tungo sa ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: taimtim kayong manalangin
  rationale: Ang pandiwang δέομαι ay tumutukoy sa masidhing pakiusap. Pinananatili ng “taimtim kayong manalangin” ang konteksto ng panalangin at ang diwa ng pagsusumamo sa natural na modernong Tagalog.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito ang kongklusyon mula sa naunang pahayag na sagana ang ani ngunit kakaunti ang mga manggagawa. Ang “Kaya” ay malinaw at natural na pang-ugnay sa Tagalog.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang kahulugan ng awtoridad na nasa κύριος at ang karaniwang katawagang biblikal.
- source_word: θερισμοῦ
  choice: ani
  rationale: Ang “ani” ang tuwirang kahulugan at pinananatili nito ang talinghaga ng pag-aani nang hindi ito ipinapaliwanag o pinapalitan.
- source_word: ὅπως
  choice: na
  rationale: Natural na ipinakikilala ng “na” ang hinihiling sa panalangin sa balangkas ng pangungusap sa Tagalog.
- source_word: ἐκβάλῃ
  choice: magpadala
  rationale: Bagaman mas malakas ang literal na puwersa ng ἐκβάλλω, sa kontekstong ito ay tumutukoy ito sa pagpapakilos o pagsusugo ng mga manggagawa. Ang “magpadala” ay malinaw at natural, habang inilalahad sa talababa ang mas mariing alternatibo.
- source_word: ἐργάτας
  choice: mga manggagawa
  rationale: Tuwirang tumutukoy ito sa mga taong gumagawa sa ani; karaniwan, malinaw, at angkop ang “mga manggagawa” sa modernong Tagalog.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: sa kanyang ani
  rationale: Ipinahihiwatig ng εἰς ang pagpapadala tungo sa gawain o saklaw ng ani. Pinananatili ng “sa kanyang ani” ang talinghaga at ang panghalip na αὐτοῦ nang hindi idinaragdag ang salitang “bukid,” na wala sa Griyego.
theological_decisions:
- issue: Ang pagkakakilanlan ng “Panginoon ng ani”
  choice: Panatilihin ang katawagang “Panginoon ng ani” nang hindi tinutukoy kung ito ay ang Ama, si Jesus, o ang Diyos sa mas pangkalahatang diwa.
  alternative: Tukuyin nang tahasan ang Ama o si Jesus bilang tinutukoy.
  rationale: Hindi tahasang kinikilala ng talata kung sino ang tinutukoy bukod sa katawagang “Panginoon ng ani.” Pinananatili ng salin ang tunay na kalabuan at iniiwasang magpasok ng mas makitid na teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “taimtim kayong manalangin” upang maipahayag ang masidhing pakiusap nang hindi nagiging lipas o labis na pormal; pinanatili ang talinghaga ng ani at ang hindi tiyak na pagkakakilanlan ng Panginoon ng ani.
