  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: tl
  text: Ngunit walang naglalagay ng tagpi na mula sa telang hindi pa umurong[a] sa lumang damit, sapagkat hihilahin ng tagpi ang damit at lalo pang lalaki ang punit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “telang hindi pa nafull.” Ang salitang Griyego ay tumutukoy sa telang hindi pa napoproseso upang umurong; kaya, kapag umurong ito, hinihila nito ang lumang damit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: walang
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang pangkalahatang negatibong simuno na ‘walang sinuman.’
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita ang banayad na pagsalungat o paglipat mula sa naunang pahayag.
- source_word: ἐπιβάλλει
  choice: naglalagay
  rationale: Pinananatili ang pangkalahatang diwa ng paglalapat o paglalagay; hindi tahasang idinaragdag ang ‘tinatahi,’ bagaman ipinahihiwatig iyon ng tagpo.
- source_word: ἐπίβλημα
  choice: tagpi
  rationale: Ito ang malinaw at karaniwang tawag sa piraso ng telang inilalagay upang takpan ang punit.
- source_word: ῥάκους ἀγνάφου
  choice: tagping telang hindi pa umurong
  rationale: Ipinahahayag ang praktikal na katangian ng telang hindi pa naproseso nang lubos at maaari pang umurong, na siyang mahalaga sa ilustrasyon.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: sa lumang damit
  rationale: Ang ‘damit’ ay natural at sapat na malawak para sa ἱμάτιον, samantalang tuwirang isinasalin ng ‘lumang’ ang παλαιῷ.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: hihilahin ... ang damit
  rationale: Inilalarawan ang puwersang dulot ng tagpi laban sa lumang damit. Natural ito sa Tagalog at ipinauunawa kung bakit lumalala ang punit nang hindi labis na tinutukoy ang mekanismo.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: ang tagpi
  rationale: Bagaman literal na ‘panakip’ o ‘pampuno,’ ang tinutukoy sa konteksto ay ang tagpi mismo.
- source_word: χεῖρον σχίσμα γίνεται
  choice: lalo pang lalaki ang punit
  rationale: Natural na Tagalog para sa kinalabasang mas malubhang punit at pinananatili ang paghahambing na nasa χεῖρον.
