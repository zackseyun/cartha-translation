translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Ang ‘tagping telang hindi pa umurong’ ay madaling maunawaan ng karaniwang mambabasa, samantalang inilalagay sa talababa ang mas teknikal na diwa ng pagpoproseso ng tela.
