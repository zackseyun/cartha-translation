  source_fidelity: 'Tumpak ang pangunahing daloy ng talata: pinananatili ang panawag-pansin na Καὶ ἰδού, ang labindalawang-taóng tagal ng pagdurugo, ang paglapit mula sa likuran, ang paghipo, at ang κράσπεδον ng kasuotan. Ang tahasang paggamit ng “Jesus” ay katanggap-tanggap na paglilinaw ng tinutukoy ng panghalip sa konteksto. Gayunman, ang “dinudugo” ay maaaring maging masyadong kolokyal at maaari ring magpahiwatig ng karaniwang pagreregla; ang “may pagdurugo” ay mas neutral at mas malinaw na naghahatid ng patuloy na kondisyong ipinahihiwatig ng αἱμορροοῦσα.'
