  terminology: Ang “palawit” ay isang mabuti at hindi labis na tiyak na katumbas ng κράσπεδον. Pinananatili ng talababa ang mga leksikal na posibilidad na “borlas,” “laylayan,” at “gilid.” Inayos ang pananalita sa talababa upang malinaw na ang kautusan ang nag-uutos ng mga palawit, hindi ang kasuotan mismo.
