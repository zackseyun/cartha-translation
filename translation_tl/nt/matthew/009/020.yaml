id: MAT.9.20
reference: Matthew 9:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: tl
  text: At narito, isang babaeng labindalawang taon nang may pagdurugo ang lumapit mula sa likuran ni Jesus at hinipo ang palawit[a][b] ng kanyang damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “borlas,” “laylayan,” o “gilid.” Ang salitang Griyego ay maaaring tumukoy sa palawit o gilid ng isang kasuotan, posibleng kabilang ang borlas na kaugnay ng pananamit ng mga Judio.
    reason: lexical_alternative
  - marker: b
    text: Tingnan ang Mga Bilang 15:38 at Deuteronomio 22:12 tungkol sa mga palawit o borlas sa kasuotan na iniutos ng kautusan ng Israel.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: At narito
  rationale: Pinananatili ang pang-ugnay at ang masiglang panawag-pansin ng ἰδού sa natural ngunit marangal na Tagalog.
- source_word: γυνὴ αἱμορροοῦσα δώδεκα ἔτη
  choice: isang babaeng labindalawang taon nang dinudugo
  rationale: Ang “dinudugo” ay karaniwang modernong Filipino para sa patuloy na abnormal na pagdurugo; malinaw na ipinapahayag ng “labindalawang taon nang” ang tagal.
- source_word: προσελθοῦσα ὄπισθεν
  choice: lumapit mula sa likuran ni Jesus
  rationale: Ipinahahayag ang paglapit mula sa likuran; ginawang tahasan si Jesus upang maging malinaw ang tinutukoy sa Tagalog.
- source_word: ἥψατο
  choice: hinipo
  rationale: Tumpak na inilalarawan ang pagdampi nang hindi pinalalakas tungo sa paghawak o pagkapit.
- source_word: τοῦ κρασπέδου
  choice: ang palawit
  rationale: Maaaring tumukoy ang κράσπεδον sa palawit, borlas, laylayan, o gilid. Ang “palawit” ay nagpapanatili sa malamang na sanggunian sa palawit sa hangganan ng kasuotang Judio nang hindi labis na nagiging teknikal.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ng kanyang damit
  rationale: Ang “damit” ay malawak at natural na katumbas ng ἱμάτιον; hindi nito nililimitahan ang kasuotan bilang balabal o bata.
theological_decisions:
- issue: Posibleng kahulugang Judio ng κράσπεδον bilang palawit o borlas sa gilid ng kasuotan
  choice: Gamitin ang “palawit” sa pangunahing teksto at ipaliwanag ang saklaw sa talababa.
  alternative: “laylayan,” “gilid,” o “borlas”
  rationale: Ang “palawit” ay nagpapanatili sa posibleng kaugnayan sa iniutos na mga palawit sa kasuotang Israelita, ngunit hindi ipinipilit na ang talata mismo ay nagbibigay ng teolohikong diin dito. Inilalahad sa talababa ang leksikal at kultural na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang masiglang “At narito,” habang iniwasan ang arkaiko o sobrang teknikal na pananalita. Inayos ang mga marker bilang [a][b] upang tumugma sa pagkakasunod ng mga talababa.
