  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: tl
  text: Pagkatapos, lumapit kay Jesus ang mga alagad ni Juan at nagtanong, “Bakit kami at ang mga Pariseo ay madalas mag-ayuno,[a] ngunit hindi nag-aayuno ang mga alagad mo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maraming beses kaming nag-aayuno”; ang Griyegong πολλά, kapag kasama ng pandiwang “mag-ayuno,” ay nagpapahayag ng madalas na pagsasagawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa kasunod na pangyayari; natural at malinaw ito sa modernong Tagalog.
- source_word: προσέρχονται αὐτῷ
  choice: lumapit kay Jesus
  rationale: Ang προσέρχομαι ay nangangahulugang lumapit o pumunta sa isang tao. Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ang mga alagad ni Juan
  rationale: Karaniwang anyo sa Tagalog para sa genitibong ugnayan at pinananatili ang kinikilalang pangalang Juan.
- source_word: λέγοντες
  choice: at nagtanong
  rationale: Bagaman literal na “na nagsasabi,” ang kasunod ay tuwirang tanong; ang “nagtanong” ay natural na paglalahad ng tungkulin ng participle sa konteksto.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Direkta at karaniwang katumbas ng pariralang nagtatanong ng dahilan.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: kami at ang mga Pariseo
  rationale: Pinananatili ang mariing panghalip na first-person plural at ang paghahambing sa mga Pariseo.
- source_word: νηστεύομεν
  choice: mag-ayuno
  rationale: Ang “mag-ayuno” ang karaniwan at wastong terminong panrelihiyon para sa kusang hindi pagkain bilang gawaing debosyonal.
- source_word: πολλά
  choice: madalas
  rationale: Ginagamit dito ang πολλά bilang pang-abay kasama ng νηστεύω at malamang na tumutukoy sa dalas ng nakagawiang pag-aayuno.
- source_word: οἱ δὲ μαθηταί σου
  choice: ngunit ... ang mga alagad mo
  rationale: Ang δέ ay nagpapakita ng malinaw na pagsalungat sa dalawang pangkat; natural itong ipinahahayag ng “ngunit.”
- source_word: οὐ νηστεύουσιν
  choice: hindi nag-aayuno
  rationale: Ang pangkasalukuyang pandiwa ay inuunawa bilang nakagawiang gawain, hindi lamang bilang kilos sa isang tiyak na sandali.
theological_decisions:
- issue: Likas ng reklamo tungkol sa pag-aayuno
  choice: Inilahad ang tanong bilang paghahambing ng nakagawiang gawaing panrelihiyon.
  alternative: Maaaring ipahiwatig na pinababayaan ng mga alagad ni Jesus ang isang obligadong gawain, o na isang partikular na araw lamang ng ayuno ang tinutukoy.
  rationale: Ang mga pandiwang nasa pangkasalukuyan at ang adverbial na πολλά ay nagpapahiwatig ng pangkalahatang kaugalian. Hindi dinaragdagan ng salin ang tanong ng hatol na hindi tahasang nasa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “alagad,” “Pariseo,” at “mag-ayuno” bilang mga pamilyar na terminong biblikal nang hindi nagiging lipas o labis na pormal.
