  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang tagpong nasa bahay, ang kapansin-pansing ἰδού, ang dalawang pangkat ng mga dumalo, at ang pakikisalo nila kay Jesus at sa kanyang mga alagad. Gayunman, ang δεύτεrong “humilig” ay perpektibo at maaaring magmukhang isang natapos na kilos, samantalang ang συνανέκειντο ay imperpektibo at inilalarawan ang kanilang kasabay na pagkakahilig/pagkakaupo sa hapag.
  naturalness: Natural at marangal ang kabuuang Tagalog. Ang “nakahilig sa hapag” ay medyo literal ngunit katanggap-tanggap at naaangkop dahil nililinaw ng talababa ang sinaunang postura sa pagkain. Mas maayos at mas tapat sa aspekto ang “nakahilig din sa hapag” kaysa “humilig din sa hapag.”
  terminology: Ang “mga maniningil ng buwis,” “mga makasalanan,” at “mga alagad” ay malinaw, karaniwan, at angkop. Hindi tinutukoy ng teksto kung kaninong bahay ito, gaya ng nararapat. Wasto ang pangalang “Jesus.”
