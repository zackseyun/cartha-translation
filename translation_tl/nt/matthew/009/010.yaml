id: MAT.9.10
reference: Matthew 9:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: tl
  text: At habang nakahilig siya sa hapag[a] sa loob ng bahay[b], narito, maraming maniningil ng buwis at mga makasalanan ang dumating at nakahilig din sa hapag kasama ni Jesus at ng kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas idiomatiko: “habang kumakain siya.” Mas tiyak na inilalarawan ng Griyego ang paghilig sa hapag, na karaniwang postura noon sa pagkain.'
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang sinasabi sa talatang ito kung kaninong bahay iyon.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: Καὶ ἐγένετο ...
  choice: At habang ...
  rationale: Ang pariralang ito ay nagsisilbing salaysay na transisyon at panandang temporal. Ang “At habang” ay natural sa makabagong Tagalog at hindi labis na binibigyang-diin ang literal na “nangyari.”
- source_word: ἀνακειμένου
  choice: nakahilig siya sa hapag
  rationale: Sa konteksto ng pagkain, tumutukoy ang pandiwa sa paghilig habang kumakain, hindi lamang sa pag-upo. Idinagdag ang “sa hapag” upang maging malinaw ang tagpo ng salu-salo.
- source_word: ἐν τῇ οἰκίᾳ
  choice: sa loob ng bahay
  rationale: Pinananatili nito ang tiyak ngunit hindi pinangalanang bahay sa Griyego, nang hindi ipinapalagay kung kaninong bahay iyon.
- source_word: ἰδοὺ
  choice: narito
  rationale: Ang “narito” ay isang kapansin-pansing panandang pansalaysay na tumatawag ng pansin sa sumunod na pangyayari, gaya ng ἰδού.
- source_word: τελῶναι
  choice: mga maniningil ng buwis
  rationale: Ito ang malinaw at karaniwang salin sa Tagalog para sa mga taong nangongolekta ng buwis sa kontekstong ito.
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Ginagamit ang pang-uri bilang pangngalan dito; pinananatili ng salin ang panlipunan at panrelihiyong pagtukoy ng teksto.
- source_word: ἐλθόντες
  choice: ang dumating
  rationale: Ang participle ay natural na isinalin bilang tuwirang kilos sa daloy ng salaysay.
- source_word: συνανέκειντο
  choice: humilig din sa hapag kasama
  rationale: Pinananatili nito kapwa ang sinaunang postura sa pagkain at ang diwa ng pakikisalo kay Jesus at sa kanyang mga alagad.
- source_word: τῷ Ἰησοῦ
  choice: ni Jesus
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Tagalog.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ng kanyang mga alagad
  rationale: Ang “mga alagad” ay natural at tumpak na tumutukoy sa mga tagasunod na tinuturuan ng isang guro.
theological_decisions:
- issue: Postura sa pagkain at pakikisalo
  choice: Panatilihin ang larawan ng paghilig sa hapag.
  alternative: Kumakain o nakikisalo
  rationale: Mahalaga sa tagpo ang sama-samang pakikisalo. Iniiwasan ng salin na alisin ang kongkretong larawan ng postura at hapag, ngunit hindi ito dinaragdagan ng doktrinal na pagpapakahulugan.
- issue: Pagkakakilanlan ng bahay
  choice: Huwag tukuyin kung kaninong bahay iyon.
  alternative: Sa bahay niya o sa bahay ni Mateo
  rationale: “Sa bahay” lamang ang hayagang sinasabi ng Griyego. Bagaman maaaring magbigay ng hinuha ang mas malawak na konteksto, hindi iyon dapat ipasok bilang tiyak sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang kapansin-pansing “narito” at ang kongkretong larawan ng paghilig sa hapag, habang iniwasang tukuyin ang may-ari ng bahay.
