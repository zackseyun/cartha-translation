revisions:
- from: Pagdating ni Jesus sa bahay ng pinuno[a], nakita niya ang mga manunugtog ng plauta[b] at ang nagkakagulong[c] mga tao.
  to: Nang dumating si Jesus sa bahay ng pinuno[a], nakita niya ang mga manunugtog ng plauta[b] at ang pulutong na nagkakagulo[c].
  rationale: Pinalitan ang nominal na pambungad ng mas natural na pandiwang Tagalog at ginawang “pulutong na nagkakagulo” upang mas malinaw na maipakita ang ὄχλος at θορυβούμενον. Inayos din ang talababa tungkol sa kaugalian upang ilarawan ang pagluluksa, hindi ang isang paglilibing na hindi pa tahasang binabanggit sa talata. Napanatili ang malawak na “pinuno” para sa ἄρχων at ang lahat ng talababa ay nananatiling nakaangkla sa kaugnay na salita.
