id: MAT.9.23
reference: Matthew 9:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: tl
  text: Nang dumating si Jesus sa bahay ng pinuno[a], nakita niya ang mga manunugtog ng plauta[b] at ang pulutong na nagkakagulo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “opisyal”; o, batay sa mga kahalintulad na salaysay, “pinuno ng sinagoga.” Ang ginamit lamang na salita ni Mateo rito ay “pinuno.”
    reason: alternative_reading
  - marker: b
    text: Ang mga manunugtog ng plauta ay kabilang sa mga propesyonal na tagapanaghoy na karaniwang naroroon sa pagluluksa sa patay noong panahong iyon.
    reason: cultural_note
  - marker: c
    text: Maaari ring “maingay na nagkakagulo” o “nasa kaguluhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Pagdating ni Jesus
  rationale: Likas na ipinapahayag sa Tagalog ang temporal na diwa ng aorist participle at ang pagkakasunod ng pangyayari nang hindi nagiging matigas ang pangungusap.
- source_word: οἰκίαν
  choice: bahay
  rationale: Tuwiran at karaniwang katumbas ng οἰκία sa tagpong ito.
- source_word: ἄρχοντος
  choice: pinuno
  rationale: Pinananatili ang pangkalahatang katawagan ni Mateo at hindi ipinapasok sa pangunahing teksto ang mas tiyak na pagkakakilanlan mula sa mga kahalintulad na salaysay.
- source_word: ἰδὼν
  choice: nakita niya
  rationale: Payak, malinaw, at natural na salaysay sa modernong Tagalog.
- source_word: αὐλητὰς
  choice: mga manunugtog ng plauta
  rationale: Malinaw na tumutukoy sa mga tumutugtog ng instrumentong hinihipan na karaniwang kasama sa pagluluksa noong panahong iyon.
- source_word: ὄχλον
  choice: mga tao
  rationale: Mas natural sa Tagalog kaysa literal na “karamihan” o “pulutong” sa pangungusap na ito, habang naipahihiwatig pa rin ang isang nagtipong pangkat.
- source_word: θορυβούμενον
  choice: nagkakagulong
  rationale: Inilalarawan ang maingay at magulong kalagayan ng mga tao nang hindi labis na tinutukoy ang kanilang damdamin o gawain.
theological_decisions:
- issue: Pagkakakilanlan ng may-ari ng bahay
  choice: pinuno
  alternative: opisyal; pinuno ng sinagoga
  rationale: Ἄρχων lamang ang ginamit ni Mateo. Pinananatili ng “pinuno” ang lawak ng salitang Griyego at iniiwasang ipasok ang mas tiyak na pagkakakilanlan mula sa mga kahalintulad na salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pinuno” upang mapanatili ang pagiging pangkalahatan ng orihinal, at “nagkakagulong mga tao” upang maipahayag nang maikli ang maingay na kaguluhan.
