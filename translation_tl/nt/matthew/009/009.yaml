id: MAT.9.9
reference: Matthew 9:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: tl
  text: Habang nagpapatuloy si Jesus mula roon, nakita niya ang isang lalaking nagngangalang Mateo na nakaupo sa puwesto ng paniningil ng buwis. Sinabi[a] niya rito, “Sumunod ka sa akin.” Tumayo si Mateo at sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, anyong pangkasalukuyan ang pandiwa: “sinasabi niya”; ginagamit ito sa salaysay upang gawing mas buhay ang tagpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: Pag-alis … mula roon
  rationale: Ipinahahayag ang patuloy na pagkilos ni Jesus palayo sa naunang lugar sa natural na modernong Tagalog, nang hindi nagdaragdag ng tiyak na paraan ng paglalakbay.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Tumutukoy ito rito sa isang tiyak na lalaking si Mateo.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: nakaupo sa puwesto ng paniningil ng buwis
  rationale: Ang τελώνιον ay lugar o puwesto kung saan kinokolekta ang buwis o bayad; iniiwasan ng saling ito ang makabagong institusyonal na dating ng “tanggapan ng buwis.”
- source_word: Μαθθαῖον λεγόμενον
  choice: nagngangalang Mateo
  rationale: Natural at tuwirang paraan sa Tagalog upang ipakilala ang pangalan ng taong tinutukoy.
- source_word: λέγει αὐτῷ
  choice: Sinabi niya rito
  rationale: Ginagamit ang karaniwang aspektong pangkuwento sa Tagalog. Ang “rito” ay malinaw na tumutukoy kay Mateo at iniiwasan ang sunod-sunod na malabong panghalip.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Tuwirang utos na nagpapanatili kapwa sa literal na pagsunod at sa pahiwatig ng pagiging alagad, nang walang idinagdag na paliwanag.
- source_word: ἀναστὰς ἠκολούθησεν αὐτῷ
  choice: Tumayo si Mateo at sumunod sa kanya
  rationale: Pinananatili ang sunod-sunod at agarang tugon. Inuulit ang pangalang Mateo para sa likas at malinaw na daloy sa Tagalog.
theological_decisions:
- issue: Kalikasan ng paanyaya o utos ni Jesus kay Mateo
  choice: “Sumunod ka sa akin”
  alternative: “Halika, maging alagad kita”
  rationale: Malinaw na pagtawag ito sa pagiging alagad, ngunit hindi pinalalawak ang payak na utos ng Griyego sa isang paliwanag na wala mismo sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “puwesto ng paniningil ng buwis” sa halip na “tax booth” o “tanggapan ng buwis” upang maging madaling maunawaan ngunit hindi magpahiwatig ng makabagong ahensiya. Isinaayos sa karaniwang aspektong pasalaysay ang makasaysayang pangkasalukuyan ng Griyego, at itinabi sa talababa ang anyong mas literal.
