    rationale: Ang present participle ay naglalarawan kay Jesus na nagpapatuloy o dumaraan mula roon habang nagaganap ang kasunod na pagkakita. Ang “Pag-alis” ay maaaring magmukhang isang natapos nang pangyayari.
