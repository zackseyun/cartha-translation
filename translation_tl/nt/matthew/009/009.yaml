  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tumpak: nakita ni Jesus si Mateo sa puwesto ng paniningil ng buwis, tinawag niya itong sumunod, at tumugon si Mateo. Gayunman, ang “Pag-alis ni Jesus” ay mas tumutukoy sa natapos na pag-alis kaysa sa participial at nagpapatuloy na kilos ng παράγων (“habang nagpapatuloy/dumaraan”).'
  naturalness: Malinaw, moderno, at marangal ang Tagalog. Mas natural at mas malapit sa aspektong Griyego ang pambungad na “Habang nagpapatuloy si Jesus mula roon.” Ang iba pang mga pangungusap ay maayos ang daloy.
  terminology: Ang “puwesto ng paniningil ng buwis” ay angkop para sa τελώνιον at hindi anakronistikong institusyonal. Ang “Sumunod ka sa akin” ay tumpak at hindi nagpapalawak sa tawag ni Jesus. Ang “Mateo” at “Jesus” ay wastong karaniwang anyo sa modernong Filipino Tagalog.
  issues:
