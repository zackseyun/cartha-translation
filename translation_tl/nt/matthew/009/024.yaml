id: MAT.9.24
reference: Matthew 9:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: tl
  text: Sinabi niya, “Umalis kayo, sapagkat hindi namatay ang batang babae, kundi natutulog siya.” At pinagtawanan nila siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nililibak nila siya.” Ang pandiwang Griyego ay tumutukoy sa pagtawa sa isang tao bilang pangungutya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Sinabi niya
  rationale: Bagaman maaaring magpahiwatig ang imperfect ng nagpapatuloy o inuulit na pagsasalita, ang “Sinabi niya” ang likas na anyong pasalaysay sa modernong Tagalog at hindi nagpapasok ng di-tiyak na pag-uulit.
- source_word: Ἀναχωρεῖτε
  choice: Umalis kayo
  rationale: Tuwirang utos ito sa maramihan; natural at malinaw ang “Umalis kayo” para sa pagpapalayo sa mga naroon.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: sapagkat hindi namatay
  rationale: Pinananatili ng “sapagkat” ang pagbibigay ng dahilan ng γάρ, at inilalarawan ng “hindi namatay” ang kamatayan bilang pangyayari ayon sa aorist na ἀπέθανεν.
- source_word: τὸ κοράσιον
  choice: ang batang babae
  rationale: Karaniwan at dignified na tawag ito sa isang batang babae, nang hindi nagdaragdag ng diin na wala sa talata.
- source_word: ἀλλὰ καθεύδει
  choice: kundi natutulog siya
  rationale: Pinananatili nito ang tuwirang salungatan at ang larawang “natutulog” nang hindi ipinapaliwanag o nilulutas ang kahulugan nito.
- source_word: κατεγέλων αὐτοῦ
  choice: pinagtawanan nila siya
  rationale: Likas sa Tagalog at pinananatili ang larawan ng pagtawa laban sa isang tao, kasabay ng malinaw na diwang mapanlibak.
theological_decisions:
- issue: Ang pahayag ni Jesus na hindi namatay ang batang babae kundi natutulog
  choice: Panatilihin sa pangunahing teksto ang literal na “natutulog” nang walang paliwanag.
  alternative: Idagdag ang “natutulog lamang” o ipaliwanag na talinghaga ito para sa kamatayan.
  rationale: Sadyang kapansin-pansin at may tensiyon ang pahayag sa salaysay. Hindi tahasang nilulutas ng Griyegong teksto kung paano dapat unawain ang “natutulog,” kaya hindi rin ito nilulutas ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sapagkat” upang mapanatili ang bahagyang pormal na himig ng Kasulatan nang hindi nagiging makaluma; iniwasan ang dagdag na “lamang” upang hindi palakasin ang sinabi nang higit sa tahasang anyo ng Griyego.
