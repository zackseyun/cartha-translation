source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: tl
  text: Ngunit upang malaman ninyo na ang Anak ng Tao[a] ay may awtoridad sa lupa na magpatawad ng mga kasalanan—saka niya sinabi sa lalaking paralitiko, “Bumangon ka, buhatin mo ang iyong higaan[b], at umuwi ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Anak ng Sangkatauhan.” Pinanatili ang tradisyonal na “Anak ng Tao” sapagkat ito ay titulo ni Jesus at malamang na may kaugnayan sa Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: O “banig” o “kama.” Ang Griyegong κλίνη ay maaaring tumukoy sa kama, sopa, o payak na higaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Ngunit upang malaman ninyo
  rationale: Pinananatili ng “ngunit” ang banayad na pagsalungat o paglipat na ipinahihiwatig ng δέ, at malinaw na ipinapahayag ng “upang” ang layunin ng ἵνα.
- source_word: ἐξουσίαν ἔχει
  choice: ay may awtoridad
  rationale: Ang ἐξουσία ay tumutukoy rito sa lehitimong kapamahalaan o karapatang magpatawad, hindi lamang sa kakayahang gumawa nito.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo ni Jesus at ang posibleng alusyon sa Daniel 7 nang hindi nilulutas ang saklaw ng kahulugan nito.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Natural itong katumbas ng parirala sa konteksto at pinananatili ang makalupang saklaw na tahasang binanggit.
- source_word: ἀφιέναι ἁμαρτίας
  choice: na magpatawad ng mga kasalanan
  rationale: Sa kontekstong ito, ang ἀφίημι ay nangangahulugang magpatawad o magpawalang-sala sa mga kasalanan.
- source_word: τότε λέγει
  choice: saka niya sinabi
  rationale: Ipinahihiwatig ng τότε ang kasunod na kilos. Ginamit ang karaniwang nagdaang panahunan sa Filipino para sa natural na salaysay, sa halip na tularan nang mekanikal ang historikal na kasalukuyan ng Griyego.
- source_word: τῷ παραλυτικῷ
  choice: sa lalaking paralitiko
  rationale: Ang pang-uri ay ginagamit bilang pangngalan. Nililinaw ng “lalaking paralitiko” ang tinutukoy sa natural na modernong Filipino.
- source_word: Ἐγερθεὶς
  choice: Bumangon ka
  rationale: Bagaman anyong participle sa Griyego, gumaganap ito bilang tuwirang utos sa magkakasunod na pautos.
- source_word: ἆρόν
  choice: buhatin mo
  rationale: Ipinapahayag nito ang pag-angat at pagdadala sa higaan; malinaw at natural ang “buhatin” sa Filipino.
- source_word: κλίνην
  choice: higaan
  rationale: Malawak at natural na salitang Filipino ito para sa κλίνη, na maaaring tumukoy sa kama, higaan, sopa, o banig na hinihigaan.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: umuwi ka
  rationale: Natural na ipinapahayag ng “umuwi” ang pagpunta sa sariling bahay o tahanan, na siyang diwa ng pariralang Griyego.
theological_decisions:
- issue: Kristolohikal na titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Pinananatili ng tradisyonal na titulo ang gamit nito bilang pagtukoy ni Jesus sa sarili at ang posibleng ugnayan sa Daniel 7, nang hindi ito ginagawang tahasang interpretatibong paraphrase.
- issue: Kalikasan ng ἐξουσία sa pagpapatawad ng mga kasalanan
  choice: awtoridad
  alternative: kapangyarihan / karapatan
  rationale: Binibigyang-diin ng talata ang lehitimong awtoridad ni Jesus na magpatawad, hindi lamang ang kakayahan o lakas na gawin iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” dahil karaniwan at tiyak ito sa kasalukuyang gamit; “higaan” ang napili bilang malawak na katawagang hindi labis na nagpapasya sa anyo ng κλίνη. Ang “umuwi ka” ay natural na katumbas ng literal na “pumunta ka sa iyong bahay.”
