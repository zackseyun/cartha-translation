  text: And this report went out into all that region[a].
translation:
  language: tl
  text: At kumalat ang balitang ito sa buong lupaing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa buong rehiyong iyon” o “sa buong nasasakupang lugar na iyon.” Ang salitang Griyego na γῆ ay maaaring tumukoy sa lupa, lupain, teritoryo, o rehiyon; dito, malamang na ang ibig sabihin ay ang nakapaligid na lugar, hindi ang buong daigdig.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang daloy ng salaysay.
- source_word: ἐξῆλθεν
  choice: kumalat
  rationale: Bagaman literal na nangangahulugang “lumabas,” sa pagtukoy sa balita ay likas sa makabagong Tagalog ang “kumalat” at malinaw nitong ipinahahayag na umabot ang balita sa iba’t ibang lugar.
- source_word: ἡ φήμη αὕτη
  choice: ang balitang ito
  rationale: Ang “balita” ay natural na katumbas ng φήμη sa kontekstong ito at, di-gaya ng “tsismis” o “usap-usapan,” hindi nagpapahiwatig na maaaring hindi totoo ang ulat. Tinutukoy ng αὕτη ang partikular na balita tungkol sa naganap.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: sa buong lupaing iyon
  rationale: Maaaring mangahulugan ang γῆ ng lupa, lupain, o rehiyon. Ang “buong lupaing iyon” ay nagpapanatili sa leksikal na lawak nito habang malinaw na lokal ang saklaw ayon sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na payak ngunit marangal. Pinili ang “kumalat ang balita” bilang natural na idyoma, samantalang pinanatili sa “buong lupaing iyon” at sa talababa ang tunay na saklaw at kalabuan ng γῆ.
