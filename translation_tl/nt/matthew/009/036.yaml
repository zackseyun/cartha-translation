  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: tl
  text: Nang makita niya ang mga tao, nahabag siya sa kanila, sapagkat sila'y pinahihirapan at lupaypay[a], gaya ng mga tupang walang pastol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nililigalig at walang magawa.” Ang mga salitang Griyego ay maaari ring unawain bilang paglalarawan sa mga taong pinahihirapan, lupaypay, at hindi kayang pangalagaan ang kanilang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Nang makita niya
  rationale: Ang aorist participle ay natural na ipinahahayag bilang sugnay na panahunan sa Tagalog. Hindi na tahasang isinalin ang banayad na pang-ugnay na δέ upang maging likas ang daloy ng salaysay.
- source_word: τοὺς ὄχλους
  choice: ang mga tao
  rationale: Tumutukoy ang ὄχλοι sa maraming taong nagkakatipon. Mas natural sa kasalukuyang Tagalog ang “mga tao” kaysa “karamihan” o “mga pulutong” sa kontekstong ito.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: nahabag siya sa kanila
  rationale: Ipinahahayag ng pandiwa ang matindi at taos-pusong habag. Ang “nahabag” ay malinaw, marangal, at likas sa modernong Tagalog.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagkahabag ni Jesus.
- source_word: ἐσκυλμένοι
  choice: api
  rationale: Maaaring ilarawan ng σκύλλω ang mga taong niligalig, pinahirapan, o masamang tinrato. Maikli at natural na naipahahayag ng “api” ang kalagayang bunga ng pagmamalupit nang hindi labis na nililiteral ang salita.
- source_word: καὶ ἐρριμμένοι
  choice: at nakabulagta
  rationale: Ang perfect passive participle ng ῥίπτω ay may larawan ng pagiging itinapon o ibinagsak. Pinananatili ng “nakabulagta” ang matingkad na larawan at ang patuloy na kalagayan ng mga tao.
- source_word: ὡσεὶ πρόβατα
  choice: gaya ng mga tupa
  rationale: Natural na Tagalog na paghahambing ito para sa ὡσεί at pinananatili ang pastoral na larawan.
- source_word: μὴ ἔχοντα ποιμένα
  choice: walang pastol
  rationale: Maikli at idyomatikong ipinahahayag nito ang mga tupang walang nag-aalaga at gumagabay.
theological_decisions:
- issue: Paglalarawan sa habag ni Jesus
  choice: nahabag siya sa kanila
  alternative: naantig siya sa matinding habag sa kanila
  rationale: Pinananatili ng “nahabag” ang lalim ng awa ni Jesus nang hindi gumagamit ng mabigat o di-likas na pagpapahayag.
- issue: Kalagayan ng mga tao
  choice: api at nakabulagta
  alternative: pinahihirapan at walang magawa
  rationale: 'Mas malapit ang piniling pahayag sa dalawang pasibong larawang Griyego: masamang tinatrato at ibinagsak. Hindi nito agad pinapaliit ang ikalawang salita sa interpretasyong “walang magawa,” ngunit inilalagay ang alternatibong pagkaunawa sa talababa.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Iniwasan ang makalumang “mga pulutong” at pinanatili ang matingkad na larawang pastoral ng tekstong Griyego.
