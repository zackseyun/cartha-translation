lexical_decisions:
- source_word: καὶ
  choice: Kaya
  rationale: Sa konteksto, iniuugnay ng pangatnig ang pagbangon ng lalaki sa naunang utos ni Jesus. Ang “Kaya” ay likas sa makabagong Tagalog at nagpapakita ng pagsunod nang hindi labis na dinaragdagan ang salaysay.
- source_word: ἐγερθεὶς
  choice: tumayo siya
  rationale: Ang aorist passive participle ay ginagamit dito sa diwang intransitibo. Ang “tumayo siya” ay natural at malinaw na katumbas ng pagbangon mula sa pagkakahiga.
- source_word: ἀπῆλθεν
  choice: umuwi
  rationale: Ipinahihiwatig ng pandiwa ang pag-alis, at nililinaw ng kasunod na parirala na patungo siya sa sarili niyang bahay. Sa Tagalog, likas na pinagsasama ng “umuwi” ang dalawang ideyang ito.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: umuwi
  rationale: Ang parirala ay tumutukoy sa pagpunta sa sarili niyang bahay. Ang “umuwi” ang pinakanatural na pagpapahayag nito sa Tagalog, bagaman hindi nito hiwalay na inuulit ang konkretong salitang “bahay.”
theological_decisions: []
translation_notes:
  register: Maikli, natural, at marangal na makabagong Tagalog. Ginamit ang “umuwi” bilang idiomatikong katumbas ng pag-alis patungo sa sariling bahay; inilagay sa talababa ang mas pormal at mas tahasang anyo ng Griyego.
