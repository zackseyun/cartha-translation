  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: tl
  text: Ngunit nang mailabas na ang karamihan, pumasok siya at hinawakan niya ang kamay ng batang babae, at bumangon[a] ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “at ibinangon ang batang babae.”'
    reason: Pinahihintulutan ng anyong Griyego ang intransitibong “bumangon” o ang pasibong “ibinangon.”
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Ipinahahayag ng ὅτε ang panahon (“nang”), samantalang ang δέ ay banayad na pang-ugnay; natural na naihahatid ng “Ngunit nang” ang paglipat sa susunod na pangyayari.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: mapalabas na ang mga tao
  rationale: Pinananatili ng “mapalabas” ang diwang pasibo ng pandiwa nang hindi nagpapahiwatig ng labis na puwersa; ang “mga tao” ay likas na salin sa konteksto para sa ὁ ὄχλος, ang nagkakatipong karamihan.
- source_word: εἰσελθὼν
  choice: pumasok siya
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing kilos; ang sugnay na ito ay malinaw at natural sa modernong Tagalog.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: hinawakan sa kamay ang batang babae
  rationale: Ang κρατέω na may genitive ay nangangahulugang humawak o dumakma. Ang “hinawakan sa kamay” ay natural at hindi nagpapahiwatig ng higit na puwersa kaysa sa hinihingi ng teksto.
- source_word: ἠγέρθη
  choice: bumangon
  rationale: Maaaring unawain ang anyong pasibo bilang intransitibong “bumangon” o bilang pasibong “ibinangon.” Natural ang “bumangon” sa salaysay habang hindi itinatanggi ang posibleng pasibong pagbasa.
- source_word: τὸ κοράσιον
  choice: ang batang babae
  rationale: Tumutukoy ang κοράσιον sa isang batang babae; malinaw, makabago, at marangal ang saling ito.
theological_decisions:
- issue: Pagkasalin sa ἠγέρθη sa konteksto ng muling pagbuhay
  choice: bumangon
  alternative: ibinangon
  rationale: Hinahayaan ng “bumangon” na makita ang resulta ng himala nang hindi tahasang tinutukoy ang ahensiya. Inilalagay sa talababa ang posibleng pasibong salin upang mapanatili ang tunay na gramatikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang makaluma o sobrang marahas na pananalita, at pinanatili ang maikli at tuwirang daloy ng salaysay.
