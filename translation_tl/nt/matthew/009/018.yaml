  source_fidelity: 'Tumpak na naihahatid ng draft ang takbo ng talata: nagpapatuloy pa ang pagsasalita ni Jesus, dumating ang isang di-tinukoy na pinuno, nagpatirapa siya, at nagpahayag siya ng tiyak na pag-asang mabubuhay ang anak. Ang “nagpatirapa sa harap niya” ay maingat na pinananatili ang kilos na ipinahihiwatig ng προσεκύνει nang hindi sapilitang itinatakda kung pagsamba o pagpipitagan ang kahulugan.'
  naturalness: Natural at marangal ang kabuuan. Gayunman, mas tuwiran at mas malinaw ang pang-ugnay na “at nagsabi” kaysa “Sinabi nito,” na maaaring maging bahagyang di-karaniwan at mas malabo ang pagtukoy sa nagsasalita. Mas likas din ang “pumunta ka” sa utos na ἐλθών sa ganitong salaysay kaysa “halika,” bagaman hindi mali ang huli.
  terminology: Ang “pinuno” ay angkop para sa ἄρχων at hindi nagdaragdag ng di-nasa teksto na katungkulan. Ang “anak kong babae,” “kamay,” at “mabubuhay siya” ay tumpak. Pinananatili ng tala ang semantikong saklaw ng προσκυνέω; ang alternatibong “yumukod” ay mas malapit sa kilos kaysa “lumuhod.”
