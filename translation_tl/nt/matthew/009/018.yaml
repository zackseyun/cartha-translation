    rationale: Mas malinaw na ikabit ang pangungusap sa naunang “isang pinuno” sa pamamagitan ng “at nagsabi,” na tumutugma rin sa λέγων.
  - severity: low
    issue: Ang “halika” ay may deiktikong himig na hindi tahasang nasa Griyego.
    rationale: Ang ἐλθών ay “pagdating/pumunta”; “pumunta ka” ay natural na utos at hindi nagdaragdag ng pananaw na “lumapit ka rito.”
  - severity: low
    issue: Hindi lubos na saklaw ng “lumuhod” ang pisikal na larawan ng προσεκύνει sa tala.
    rationale: Ang “yumukod” ay mas malawak at mas angkop na alternatibong kilos, samantalang ang paliwanag ay patuloy na nag-iingat sa pagitan ng pagsamba at pagpipitagan.
