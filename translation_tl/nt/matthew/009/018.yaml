  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: tl
  text: Habang sinasabi niya ang mga bagay na ito sa kanila, narito, dumating ang isang pinuno at nagpatirapa sa harap niya[a], at nagsabi, “Ngayon lang namatay ang anak kong babae. Ngunit pumunta ka at ipatong mo ang iyong kamay sa kanya, at mabubuhay siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yumukod sa harap niya”; ang salitang Griyego ay maaari ring magpahiwatig ng pagsamba o matinding pagpipitagan.
    reason: Nililinaw ang saklaw ng προσκυνέω nang hindi sapilitang nilulutas ang kahulugan nito sa konteksto.
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing bisa ng salitang Griyego sa isang natural at marangal na paraang Tagalog.
- source_word: ἄρχων
  choice: pinuno
  rationale: Malawak ang kahulugan ng salitang Griyego; hindi tinutukoy sa talata ang tiyak na katungkulan ng lalaki.
- source_word: προσεκύνει
  choice: nagpatirapa sa harap niya
  rationale: Inilalarawan ang kilos ng matinding pagpipitagan nang hindi ipinipilit kung ito ay pagsamba o paggalang sa isang nakatataas.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ngayon lang namatay
  rationale: Natural na ipinapahayag sa modernong Tagalog ang diwang kagaganap lamang ng kamatayan.
- source_word: ζήσεται
  choice: mabubuhay siya
  rationale: Tuwirang pinananatili ang katiyakan ng panghinaharap na anyo sa Griyego.
theological_decisions:
- issue: Ang kahulugan ng προσκυνέω bilang pagsamba o pagpipitagan
  choice: nagpatirapa sa harap niya
  alternative: sumamba sa kanya
  rationale: Maaaring tumukoy ang pandiwa sa pagsamba o sa pagpipitagan ayon sa konteksto. Ang saling pinili ay nagpapanatili sa nakikitang kilos at sa tunay na semantikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “anak kong babae” upang tahasang mapanatili ang θυγάτηρ, at iniwasan ang pagdaragdag ng tiyak na titulo sa “pinuno.”
