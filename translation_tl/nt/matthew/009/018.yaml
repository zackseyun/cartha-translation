  to: Habang sinasabi niya ang mga bagay na ito sa kanila, narito, dumating ang isang pinuno at nagpatirapa sa harap niya[a], at nagsabi, “Ngayon lang namatay ang anak kong babae. Ngunit pumunta ka at ipatong mo ang iyong kamay sa kanya, at mabubuhay siya.”
