  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: tl
  text: At naglibot si Jesus sa lahat ng lungsod at nayon, nagtuturo sa kanilang mga sinagoga, ipinapahayag ang magandang balita ng kaharian,[a] at nagpapagaling ng bawat sakit at bawat karamdaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ebanghelyo ng kaharian.”
    reason: lexical_alternative
  - marker: b
    text: O “bawat sakit at bawat panghihina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: nilibot
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang patuloy na paglalakbay ni Jesus sa iba't ibang lugar; natural na naihahayag ito ng “nilibot” sa Filipino.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: ang lahat ng mga lungsod at nayon
  rationale: Pinananatili ang pagkakaiba ng mas malalaking sentrong panirahan at mas maliliit na pamayanan, pati ang malawak na saklaw ng πάσας.
- source_word: διδάσκων
  choice: Nagtuturo siya
  rationale: Malinaw at natural itong paglalahad ng kasabay at nagpapatuloy na gawain ni Jesus.
- source_word: συναγωγαῖς αὐτῶν
  choice: kanilang mga sinagoga
  rationale: Pinananatili ang makasaysayan at panrelihiyong katawagang “sinagoga” at ang panghalip na αὐτῶν.
- source_word: κηρύσσων
  choice: ipinapahayag
  rationale: Inihahatid nito ang diwa ng hayagang paghahayag ng isang tagapagbalita nang hindi labis na nililimitahan sa pormal na pangangaral.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ang magandang balita tungkol sa kaharian
  rationale: Ginagawang malinaw sa karaniwang mambabasa ang εὐαγγέλιον, habang ang “tungkol sa kaharian” ay natural na Filipino at hindi nagpapasya nang labis sa posibleng ugnayan ng genitibo.
- source_word: θεραπεύων
  choice: pinagagaling
  rationale: Ito ang natural na salitang Filipino para sa aktuwal na pagpapagaling sa konteksto ng mga gawa ni Jesus.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ang bawat uri ng sakit at karamdaman
  rationale: Ang “bawat uri” ay natural na paraan sa Filipino upang ipahayag ang komprehensibong saklaw ng dalawang inuulit na πᾶσαν, habang pinananatiling magkaiba ang dalawang kaugnay na termino.
theological_decisions:
- issue: Pagpapakahulugan sa εὐαγγέλιον τῆς βασιλείας
  choice: magandang balita tungkol sa kaharian
  alternative: ebanghelyo ng kaharian
  rationale: Ang pangunahing salin ay madaling maunawaan at pinananatili ang mensahe ng kaharian; inilalagay sa talababa ang tradisyonal at mas pormal na alternatibo nang hindi ipinipilit ang isang tiyak na pagbasa sa genitibo.
- issue: Saklaw ng πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: bawat uri ng sakit at karamdaman
  alternative: bawat sakit at bawat panghihina
  rationale: Pinananatili ang komprehensibong saklaw ng pahayag at ang dalawang magkaugnay ngunit hindi ganap na magkaparehong katawagan, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy, ngunit pinanatiling magkakaugnay ang paglalakbay, pagtuturo, pagpapahayag, at pagpapagaling. Ginamit ang “sinagoga” bilang wastong makasaysayang katawagan at iniwasan ang labis na eklesiastikong pananalita.
