revisions:
- from: At nilibot ni Jesus ang lahat ng mga lungsod at nayon. Nagtuturo siya sa kanilang mga sinagoga, ipinapahayag ang magandang balita tungkol sa kaharian,[a] at pinagagaling ang bawat uri ng sakit at karamdaman.[b]
  to: At naglibot si Jesus sa lahat ng lungsod at nayon, nagtuturo sa kanilang mga sinagoga, ipinapahayag ang magandang balita ng kaharian,[a] at nagpapagaling ng bawat sakit at bawat karamdaman.[b]
  rationale: Pinalitan ang pandiwang nagpapahiwatig ng natapos na paglibot ng “naglibot” upang masalamin ang imperpektong περιῆγεν. Ibinigay nang magkahiwalay ang “bawat sakit at bawat karamdaman” upang mapanatili ang inuulit na πᾶσαν at ang pagkakaiba ng νόσος at μαλακία. Ginawang “magandang balita ng kaharian” ang parirala upang maging mas tuwiran sa Griyego, habang pinanatili ang alternatibong “ebanghelyo ng kaharian” sa talababa.
