id: MAT.9.1
reference: Matthew 9:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: tl
  text: At pagkasakay niya sa isang bangka, tumawid siya at dumating sa sarili niyang lungsod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sarili niyang bayan.” Literal sa Griyego, “sarili niyang lungsod”; malamang na Capernaum ang tinutukoy ayon sa konteksto ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: pagkasakay niya
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa mga pangunahing pandiwa. Likas sa modernong Tagalog ang “pagkasakay niya” at napapanatili nito ang pagkakasunod-sunod ng mga kilos.
- source_word: πλοῖον
  choice: isang bangka
  rationale: Pangkalahatang tawag ito sa sasakyang pantubig; sa konteksto ng Lawa ng Galilea, mas angkop at natural ang “bangka” kaysa “barko.”
- source_word: διεπέρασεν
  choice: tumawid siya
  rationale: Ipinahihiwatig ng pandiwa ang pagtawid mula sa isang panig patungo sa kabila, karaniwan sa pamamagitan ng tubig. Sapat na naipahahayag ito ng “tumawid” sa Tagalog.
- source_word: ἦλθεν
  choice: dumating
  rationale: Bagaman maaaring mangahulugang “pumunta” o “dumating” ang ἔρχομαι ayon sa pananaw ng salaysay, natural dito ang “dumating” bilang kasunod ng pagtawid.
- source_word: ἰδίαν πόλιν
  choice: sarili niyang lungsod
  rationale: Direktang pinananatili nito ang diwa ng pag-aari o kaugnayan sa ἴδιος nang hindi agad ipinakahulugang lugar ng kapanganakan o tiyak na tinutukoy bilang Capernaum.
- source_word: Καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ng mga pang-ugnay ang payak na pagkakasunod-sunod ng salaysay ni Mateo; sa ikalawang bahagi, likas sa Tagalog ang koordinasyong “tumawid siya at dumating.”
theological_decisions:
- issue: Ang tinutukoy ng “sarili niyang lungsod”
  choice: Pinanatiling hindi tiyak sa pangunahing teksto bilang “sarili niyang lungsod.”
  alternative: Maaaring unawain bilang Capernaum o bilang lungsod na nagsilbing himpilan niya sa Galilea.
  rationale: Hindi pinangalanan ng tekstong Griyego ang lungsod. Pinananatili ng salin ang tunay na kawalang-tiyak sa halip na ipasok sa pangunahing teksto ang malamang na pagkakakilanlan mula sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkasakay niya” upang natural na maipakita ang naunang kilos, at “sarili niyang lungsod” upang mapanatili ang literal na diwa at kawalang-tiyak ng Griyego.
