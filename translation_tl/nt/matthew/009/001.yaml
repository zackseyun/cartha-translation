  source_fidelity: 'Tumpak na naisasalin ang sunod-sunod na kilos sa Καὶ ἐμβὰς εἰς πλοῖον διεπέρασεν καὶ ἦλθεν: naunang sumakay, tumawid, at dumating. Ang “isang bangka” ay angkop para sa anarthrous na πλοῖον, at ang “sarili niyang lungsod” ay pinananatili ang ἰδίαν πόλιν nang hindi ipinapasok sa pangunahing teksto ang Capernaum.'
