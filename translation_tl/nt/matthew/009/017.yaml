  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: tl
  text: Hindi rin sila naglalagay ng bagong alak sa mga lumang sisidlang balat. Kung hindi, pumuputok ang mga sisidlan, natatapon ang alak, at nasisira ang mga sisidlan. Sa halip, inilalagay nila ang bagong alak sa mga bagong sisidlang balat[a], at kapwa napapanatili ang alak at ang mga sisidlan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang mga salitang Griyego para sa “bago”: ang νέος ay tumutukoy sa alak na bago, samantalang ang καινός ay tumutukoy sa mga sisidlang bago o sariwa pa ang kalagayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: Hindi rin naglalagay ang mga tao
  rationale: Pinananatili ng “Hindi rin” ang ugnayan sa naunang negatibong halimbawa, samantalang natural na katumbas ng βάλλουσιν sa konteksto ng pag-iimbak ang “naglalagay.”
- source_word: οἶνον νέον
  choice: bagong alak
  rationale: Direkta at karaniwang salin para sa alak na bago o sariwa ang pagkagawa.
- source_word: ἀσκοὺς παλαιούς
  choice: mga lumang sisidlang balat
  rationale: Tumutukoy ang ἀσκός sa sisidlang yari sa balat; pinananatili ng “luma” ang tuwirang kaibahan sa mga sisidlang bago ang kalagayan.
- source_word: εἰ δὲ μή γε
  choice: Kung gagawin nila iyon
  rationale: Natural na ipinahahayag sa Filipino ang bunga ng pagsuway sa nakasaad na kaugalian, nang hindi binabago ang kondisyunal na diwa.
- source_word: ῥήγνυνται
  choice: puputok
  rationale: Malinaw at angkop na inilalarawan ang pagkapunit o pagputok ng sisidlan dahil sa presyon.
- source_word: ἐκχεῖται
  choice: matatapon
  rationale: Ipinahahayag ang di-sinasadyang pagkaubos at pagkawala ng alak kapag pumutok ang sisidlan.
- source_word: ἀπόλλυνται
  choice: masisira
  rationale: Sa konteksto, ang mga sisidlan ay nawawasak o hindi na mapapakinabangan; natural itong ipinahahayag ng “masisira.”
- source_word: ἀλλὰ βάλλουσιν
  choice: Sa halip, inilalagay nila
  rationale: Malinaw na ipinakikita ang pagtutuwid at pagsalungat sa maling gawain.
- source_word: ἀσκοὺς καινούς
  choice: mga bagong sisidlang balat
  rationale: Ang καινός ay tumutukoy sa pagiging bago o angkop ng kalagayan. “Bago” ang pinakanatural na salin sa Filipino, at ipinaliliwanag sa talababa ang pagkakaiba nito sa νέος.
- source_word: ἀμφότεροι συντηροῦνται
  choice: kapwa napapanatili ang alak at ang mga sisidlan
  rationale: Nililinaw ang dalawang tinutukoy ng “kapwa” habang pinananatili ang diwang parehong naililigtas sa pagkasira o pagkawala.
theological_decisions:
- issue: Pagkakaiba ng νέος at καινός sa iisang talata
  choice: Isalin kapwa bilang “bago” sa pangunahing teksto at ipaliwanag ang pagkakaiba sa talababa
  alternative: Gamitin ang “bagong alak” at “sariwang sisidlang balat”
  rationale: Hindi natural sa karaniwang Filipino ang “sariwang sisidlang balat.” Pinananatili ng talababa ang leksikal na pagkakaiba ng Griyego nang hindi lumilikha ng alanganing pahayag o nagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinili ang “sisidlang balat” bilang maikli ngunit tiyak na katawagan sa sinaunang sisidlang yari sa balat. Inulit sa hulihan ang “alak” at “mga sisidlan” upang maging malinaw ang tinutukoy ng ἀμφότεροι.
