base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: tl
  text: Sapagkat sinasabi niya sa kanyang sarili, “Kung mahawakan ko lamang ang kanyang damit, maliligtas ako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gagaling ako” o “mapapagaling ako.” Sa Griego, “maliligtas ako” ang nakasaad, gamit ang pandiwang maaari ring tumukoy sa paggaling sa ganitong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: paulit-ulit niyang sinasabi
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng nagpapatuloy o inuulit na panloob na pagsasalita; malinaw itong naihahayag sa natural na Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang salaysay.
- source_word: ἐν ἑαυτῇ
  choice: sa sarili
  rationale: Natural na Tagalog para sa panloob na pagsasalita o pag-iisip.
- source_word: Ἐὰν μόνον
  choice: lamang
  rationale: Sa hulmaing “Mahawakan ko lamang,” naipahahayag ang kundisyong nakatuon sa isang minimum na kilos.
- source_word: ἅψωμαι
  choice: Mahawakan ko
  rationale: Ang pandiwa ay tumutukoy sa paghipo o paghawak; ang “mahawakan” ay natural sa kundisyunal na pahayag at hindi nagpapahiwatig ng mahigpit na pagkapit.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ang kanyang damit
  rationale: Ang ἱμάτιον ay kasuutan, karaniwang panlabas na damit; pinananatili ng “damit” ang lawak ng salita nang hindi labis na tinutukoy ang uri nito.
- source_word: σωθήσομαι
  choice: maliligtas ako
  rationale: Maaaring mangahulugan ang σῴζω ng pagliligtas o paggaling. Pinananatili sa pangunahing teksto ang mas malawak na literal na diwa, habang nililinaw sa talababa ang kahulugang angkop sa konteksto ng pagpapagaling.
theological_decisions:
- issue: Pagpapakahulugan sa σωθήσομαι sa konteksto ng pagpapagaling
  choice: maliligtas ako
  alternative: gagaling ako; mapapabuti ang aking kalagayan
  rationale: Pisikal na paggaling ang agarang konteksto, ngunit mas malawak kaysa isang tiyak na terminong medikal ang ginamit na pandiwang Griego. Pinananatili ng salin ang lexical at posibleng teolohikal na lawak nito nang hindi nagdaragdag ng doktrina; inilalagay sa talababa ang malinaw na kahulugan nito sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “paulit-ulit niyang sinasabi” upang ipakita ang aspektong imperpekto, at “damit” upang maiwasang labis na tukuyin ang anyo ng kasuutan.
