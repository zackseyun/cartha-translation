  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: tl
  text: At nang mapalayas na ang demonyo, nakapagsalita ang lalaking hindi makapagsalita.[a] Namangha ang mga tao at sinabi nila, “Kailanman ay wala pang nakitang ganito sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang lalaking bingi.” Maaaring mangahulugan ang salitang Griyego na hindi makarinig o hindi makapagsalita; dito, pinapaboran ng konteksto ang “hindi makapagsalita” dahil ang diin ay nakapagsalita siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: nang mapalayas na
  rationale: Ipinahihiwatig ng aorist passive participle sa genitive absolute na nauna ang pagpapalayas sa pagsasalita; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “nang ... na.”
- source_word: δαιμονίου
  choice: ang demonyo
  rationale: Tuwirang katumbas ito ng δαιμόνιον sa konteksto ng pagpapalayas ng demonyo sa mga Ebanghelyo.
- source_word: ἐλάλησεν
  choice: nakapagsalita
  rationale: Malinaw nitong ipinapahayag na nagsalita ang dating hindi makapagsalita, nang hindi idinaragdag ang di-tiyak na diwang “nagsimulang magsalita.”
- source_word: ὁ κωφός
  choice: ang lalaking hindi makapagsalita
  rationale: Maaaring tumukoy ang κωφός sa bingi o pipi/hindi makapagsalita, ngunit ang kasunod na ἐλάλησεν ay nagpapakitang kawalan ng kakayahang magsalita ang diin dito. Iniiwasan din ng pariralang ito ang posibleng mapanlait o lipas na dating ng ilang katawagan.
- source_word: ἐθαύμασαν
  choice: namangha
  rationale: Natural at marangal na modernong Tagalog para sa matinding pagtataka o paghanga na ipinahihiwatig ng pandiwa.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Sa kontekstong ito, natural na tumutukoy ang maramihang ὄχλοι sa mga taong nagkatipon; mas karaniwan ito sa modernong Tagalog kaysa “mga karamihan.”
- source_word: Οὐδέποτε
  choice: kailanman ay wala pang
  rationale: Natural na Tagalog na nagpapahayag na hindi pa nangyari o nakita ang gayong bagay sa anumang naunang panahon.
- source_word: ἐφάνη
  choice: nakitang
  rationale: Bagaman literal na maaaring “lumitaw,” ang passive na anyo ay idiomatikong nauunawaan dito bilang “nakita,” na angkop sa reaksiyon ng mga tao sa nasaksihan nilang pangyayari.
- source_word: οὕτως
  choice: ganito
  rationale: Tumutukoy ito sa uri o paraan ng pangyayaring kasasaksi lamang ng mga tao.
- source_word: ἐν τῷ Ἰσραήλ
  choice: sa Israel
  rationale: Maikli at likas na katumbas na maaaring tumukoy sa loob ng Israel o sa gitna ng bayang Israel nang hindi kinakailangang magtakda ng isa lamang.
theological_decisions:
- issue: Saklaw ng kahulugan ng κωφός sa konteksto ng pagpapagaling at pagpapalayas ng demonyo
  choice: Isinalin sa pangunahing teksto bilang “lalaking hindi makapagsalita.”
  alternative: “lalaking bingi”
  rationale: Maaaring mangahulugan ang κωφός ng bingi o hindi makapagsalita. Pinapaboran ng agarang konteksto ang ikalawa sapagkat ang binigyang-diin na bunga ay ang kanyang pagsasalita, ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
- issue: Kahulugan ng ἐφάνη sa pahayag ng mga tao
  choice: “nakitang”
  alternative: “lumitaw” o “nangyari”
  rationale: Pinananatili ng “nakitang” ang passive/phenomenal na diwa sa natural na Tagalog at hindi nito ipinapaliwanag nang labis kung ang tinutukoy ay ang himala, ang pagpapalayas, o ang buong pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “hindi makapagsalita” sa halip na katawagang maaaring tunog lipas o mapanlait. Pinanatili ang maikli at masiglang daloy ng salaysay at ang ambiguwidad ng “sa Israel.”
