  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: tl
  text: At tumayo si Jesus at sumunod sa kanya, at sumunod din ang kanyang mga alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: tumayo
  rationale: Ang aorist participle ay nagpapakilala sa pagkilos ni Jesus mula sa pagkakaupo tungo sa pagsama. Natural at malinaw sa modernong Tagalog ang “tumayo,” samantalang mas mabigat ang “pagkatayo.”
- source_word: ἠκολούθει
  choice: sumunod
  rationale: Bagaman imperfect ang anyo at maaaring magpahiwatig ng nagpapatuloy na kilos, natural na isinasalaysay ito sa Tagalog sa aspektong naganap bilang “sumunod.” Napananatili rin nito ang diwa ng paglakad sa likuran o pagsama sa pinangungunahan.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy sa pinuno sa naunang talata. Hinihingi ng pandiwang Tagalog na “sumunod” ang pariralang “sa kanya.”
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Ang “mga alagad” ang kinagawiang salin sa konteksto ng mga Ebanghelyo at pinananatili ang ugnayan ng guro at tagasunod.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: kasama ang kanyang mga alagad
  rationale: Hindi inuulit sa Griyego ang pandiwa. Ang “kasama ang kanyang mga alagad” ay natural na Tagalog na nagpapahiwatig na sumunod din sila, nang hindi nangangailangan ng mabigat na pag-uulit.
