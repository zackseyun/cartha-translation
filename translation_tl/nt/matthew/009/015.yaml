reference: Matthew 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: tl
  text: At sinabi ni Jesus sa kanila, “Hindi ba maaaring magdalamhati ang mga kasama ng lalaking ikakasal[a] habang kapiling nila ang lalaking ikakasal? Ngunit darating ang mga araw na kukunin palayo sa kanila ang lalaking ikakasal[b], at saka sila mag-aayuno.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “mga anak ng bulwagan ng kasalan,” isang idyoma para sa mga kasamahan ng lalaking ikakasal o mga dumadalo sa pagdiriwang ng kasalan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aalisin mula sa kanila.” Ang pasibong pananalita ay nagpapahiwatig ng higit pa sa karaniwang pag-alis.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: mga kasama ng lalaking ikakasal
  rationale: Ang literal na ‘mga anak ng bulwagan ng kasalan’ ay isang idyoma para sa mga kasamahan ng lalaking ikakasal na kabilang sa pagdiriwang. Ang salin ay malinaw at likas sa modernong Tagalog habang pinananatili ang kanilang kaugnayan sa lalaking ikakasal.
- source_word: πενθεῖν
  choice: magdalamhati
  rationale: Tumutukoy ito sa pagdadalamhati o pagluluksa at angkop sa paghahambing sa pag-aayuno.
- source_word: ἐφ’ ὅσον
  choice: habang ... pa
  rationale: Likas na temporal na parirala sa Tagalog na naghahayag ng tagal.
- source_word: νυμφίος
  choice: lalaking ikakasal
  rationale: Karaniwang katawagan sa Tagalog na malinaw na nagpapanatili sa talinghaga ng kasalan.
- source_word: ἀπαρθῇ
  choice: kukunin mula sa kanila
  rationale: Pinananatili ang pasibong diwa at ang pahiwatig ng pag-aalis, sa halip na karaniwang kusang pag-alis lamang.
- source_word: νηστεύσουσιν
  choice: mag-aayuno
  rationale: Tuwiran at natural na salin ng pandiwang tumutukoy sa pag-aayuno sa hinaharap.
- source_word: Μὴ δύνανται ... ;
  choice: Maaari bang ...?
  rationale: Sa konteksto, ang tanong ay retorikal at umaasang ‘hindi’ ang sagot; likas itong naipahihiwatig ng anyong tanong sa Tagalog.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ngunit darating ang mga araw
  rationale: Pinananatili ang karaniwang pahayag tungkol sa darating na panahon at ang banayad na pagsalungat ng δέ.
theological_decisions:
- issue: Posibleng kristolohikal na kahulugan ng larawan ng lalaking ikakasal
  choice: Panatilihin ang larawan ng lalaking ikakasal nang hindi tahasang kinikilala sa salin kung sino ang tinutukoy nito.
  alternative: Palawakin ang salin upang tahasang tukuyin si Jesus bilang mesiyanikong lalaking ikakasal.
  rationale: Ginagamit mismo ng talata ang talinghaga ngunit hindi nito tahasang ipinaliliwanag ang buong teolohikal na kahulugan; dapat manatili ang pahiwatig at tensiyon ng teksto.
- issue: Pahiwatig ng pasibong ἀπαρθῇ
  choice: Isalin bilang ‘kukunin mula sa kanila,’ na maaaring magpahiwatig ng sapilitang pag-aalis nang hindi ito ipinaliliwanag.
  alternative: Isalin bilang simpleng ‘aalis’ o tahasang tukuyin ang kamatayan ni Jesus.
  rationale: Mas malakas ang pandiwa kaysa sa karaniwang pag-alis, ngunit hindi tahasang binabanggit ng talata ang paraan o pangyayari ng pagkuha.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘magdalamhati,’ ‘lalaking ikakasal,’ at ‘mag-aayuno’ bilang pamilyar ngunit may sapat na bigat na mga salita. Ang mga talababa [a] at [b] ay nakalagay sa mismong teksto.
