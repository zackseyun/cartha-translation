id: MAT.9.12
reference: Matthew 9:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: tl
  text: Ngunit nang marinig niya iyon, sinabi niya, “Hindi nangangailangan ng manggagamot ang mga malusog, kundi ang mga maysakit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: nang marinig niya iyon
  rationale: Ang aorist participle ay likas na naipapahayag bilang sugnay na panahunan sa Tagalog. Ipinahihiwatig ng konteksto ang layon, kaya natural na idinagdag ang “iyon.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat sa naunang sinabi ng mga Pariseo; ang “Ngunit” ay angkop at malinaw.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Pinananatili nito ang karaniwang kahulugan ng pandiwang λέγω nang hindi ginagawang mas tahasang “sumagot,” na hindi mismong nakasaad sa Griyego.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Hindi nangangailangan
  rationale: Natural at tuwirang katumbas ito ng idyomang χρείαν ἔχειν sa modernong Tagalog.
- source_word: οἱ ἰσχύοντες
  choice: ang mga malusog
  rationale: Bagaman literal na may diwang “malalakas,” sa paghahambing na medikal sa mga maysakit ay tumutukoy ito nang idyomatiko sa mga nasa mabuting kalusugan.
- source_word: ἰατροῦ
  choice: ng manggagamot
  rationale: Ang “manggagamot” ay dignificado, malinaw, at karaniwang salin ng ἰατρός; ang pang-ugnay na “ng” ay angkop sa pandiwang “nangangailangan.”
- source_word: οἱ κακῶς ἔχοντες
  choice: ang mga maysakit
  rationale: Ang idyomang κακῶς ἔχω ay karaniwang nangangahulugang may sakit. Ang “maysakit” ay maikli at natural sa Tagalog.
theological_decisions:
- issue: Metaporikal o pisikal lamang na diwa ng kasabihan
  choice: Isinalin ang pangungusap sa tuwirang larawang medikal nang hindi tahasang idinaragdag ang espirituwal na aplikasyon.
  alternative: Ipaliwanag sa salin na ang “maysakit” ay tumutukoy sa mga makasalanan o sa mga nangangailangan sa espirituwal.
  rationale: Ang konteksto ang nagbibigay ng espirituwal na aplikasyon, samantalang ang mismong Griyegong pangungusap ay nananatili sa wikang medikal. Pinananatili nito ang larawan at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang “manggagamot” sa halip na mas kolokyal na “doktor” upang mapanatili ang anyong kawikaan, at “mga malusog” upang natural na maitapat sa “mga maysakit.”
