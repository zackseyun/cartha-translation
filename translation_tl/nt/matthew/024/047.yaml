  source_fidelity: Ang “Tinitiyak ko sa inyo” ay isang katanggap-tanggap na idyomatikong pagpapahayag ng solemne ἀμὴν λέγω ὑμῖν. Gayunman, ang “pamamahalain niya siya” ay hindi ang pinakalinaw o pinakanatural na paraan upang ipahayag ang καταστήσει αὐτόν, na tumutukoy sa pagtatalaga ng lingkod sa tungkuling mamahala. Ang “itatalaga niya siyang mamahala” ay malinaw na naghahayag kapwa ng pagtatalaga at ng saklaw ng pananagutan.
  naturalness: Mas natural at makinis sa makabagong Filipino ang “itatalaga niya siyang mamahala” kaysa “pamamahalain niya siya.” Pinananatili rin nito ang pormal ngunit malinaw na rehistro ng talinghaga.
