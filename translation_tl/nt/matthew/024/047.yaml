  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: tl
  text: Tinitiyak ko sa inyo na itatalaga niya siyang mamahala sa lahat ng kanyang ari-arian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa lahat ng kanyang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Natural at marangal na Filipino para sa pormulang nagpapakilala ng isang taimtim at makapangyarihang pahayag. Iniiwasan nito ang di-likas na literalismong “Amen, sinasabi ko sa inyo” habang pinananatili ang diin ng ἀμὴν.
- source_word: ὅτι
  choice: na
  rationale: Malinaw na ipinakikilala ang nilalaman ng taimtim na pahayag.
- source_word: καταστήσει αὐτόν
  choice: pamamahalain niya siya
  rationale: Sa konteksto, ang καθίστημι ay pagtatalaga sa isang tungkuling nangangasiwa, hindi simpleng paglalagay sa isang lugar. Pinananatili ng “siya” ang panlalaking isahang reperensiya ng αὐτόν ayon sa naunang lingkod.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: sa lahat ng kanyang ari-arian
  rationale: Ipinahahayag ang saklaw ng ipinagkatiwalang pamamahala. Ang τοῖς ὑπάρχουσιν ay tumutukoy sa mga bagay na pag-aari niya; ang “ari-arian” ay maikli, natural, at angkop sa konteksto.
theological_decisions:
- issue: Kalikasan ng gantimpala o ipinagkatiwalang tungkulin ng panginoon
  choice: Isinalin bilang pamamahala sa lahat ng ari-arian ng panginoon ayon sa tuwirang diwa ng talinghaga.
  alternative: Ipaliwanag ito sa salin bilang awtoridad sa iglesya o bilang gantimpala sa langit sa wakas ng panahon.
  rationale: Ang mismong talata ay nagsasaad ng mas malawak na pananagutan sa loob ng talinghaga. Hindi dapat isingit sa salin ang isang partikular na eklesiyolohikal o eskatolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “Tinitiyak ko sa inyo” ay natural na katumbas ng taimtim na pormulang ἀμὴν λέγω ὑμῖν; ang “pamamahalain” ay nagpapakita ng pagtatalaga sa pangangasiwa.
