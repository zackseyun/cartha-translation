source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: tl
  text: Paglabas ni Jesus mula sa templo[a], papalayo na siya nang lumapit ang kanyang mga alagad upang ipakita sa kanya ang mga gusali ng templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa kabuuang bakuran o kompleks ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Paglabas
  rationale: 'Ang aorist participle ay nagsasaad ng kilos na nauna sa κύρια pandiwa: lumabas muna si Jesus. Likas sa Tagalog ang pang-abay na anyong “Paglabas.”'
- source_word: ἱεροῦ
  choice: templo
  rationale: Ang ἱερόν ay tumutukoy sa buong lugar o complex ng templo, hindi lamang sa panloob na santuwaryo. “Templo” ang natural at karaniwang salin; nililinaw ang lawak ng kahulugan sa talababa.
- source_word: ἐπορεύετο
  choice: nagpatuloy siya sa pag-alis
  rationale: Pinananatili nito ang nagpapatuloy na kilos ng imperfect na ἐπορεύετο at ang diwang papalayo, sa halip na gawing isang payak at natapos na kilos lamang.
- source_word: προσῆλθον
  choice: Lumapit
  rationale: Tuwirang ipinahahayag ng “lumapit” ang paglapit ng mga alagad kay Jesus at natural itong sundan ng pariralang nagsasaad ng layunin.
- source_word: ἐπιδεῖξαι
  choice: upang ipakita
  rationale: Ipinahahayag ng infinitive ang layunin ng paglapit ng mga alagad; malinaw at natural sa Tagalog ang “upang ipakita.”
- source_word: οἰκοδομὰς
  choice: mga gusali
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa mga itinayong gusali o estruktura. “Mga gusali” ang pinakatuwiran at madaling maunawaang katumbas.
- source_word: τοῦ ἱεροῦ
  choice: ng templo
  rationale: Pinananatili ang pag-uulit ng ἱερόν at ipinakikitang ang mga gusali ay bahagi ng kabuuang lugar ng templo.
theological_decisions:
- issue: Pagkakaiba ng ἱερόν at ναός
  choice: templo, na may paliwanag sa talababa na buong lugar o complex ang tinutukoy
  alternative: lugar ng templo / kabuuang complex ng templo
  rationale: Ang “templo” ay dignificado, natural, at nakasanayang katawagan, ngunit maaaring mapagkamalang panloob na santuwaryo lamang. Pinananatili ng talababa ang mahalagang leksikal na pagkakaiba nang hindi pinabibigat ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Ginamit ang “Paglabas” para sa natural na daloy ng salaysay at “nagpatuloy siya sa pag-alis” upang maipakita ang nagpapatuloy na kilos ng imperfect. Ang marker na [a] ay inilagay kaagad pagkatapos ng unang banggit sa templo, na siyang tinutukoy ng paliwanag.
