id: MAT.24.27
reference: Matthew 24:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: tl
  text: Sapagkat kung paanong ang kidlat ay nagmumula sa silangan at nakikita hanggang sa kanluran, gayundin ang magiging pagdating[a] ng Anak ng Tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “presensiya.” Ang salitang Griyego na παρουσία ay maaaring mangahulugang “presensiya” o “pagdating,” ngunit sa kontekstong ito ay tumutukoy ito sa pagdating ng Anak ng Tao sa hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ at ng “kung paanong” ang paghahambing na ipinahihiwatig ng ὥσπερ, sa natural na ayos ng Filipino.
- source_word: ἀστραπή
  choice: kidlat
  rationale: Karaniwan at tuwirang katumbas ito ng pangngalang tumutukoy sa kidlat bilang nakikitang pangyayari.
- source_word: ἐξέρχεται
  choice: nagmumula
  rationale: Sa paglalarawan ng kidlat, likas sa Filipino ang “nagmumula” at naipahahayag nito ang paglabas o pagsisimula mula sa isang direksiyon.
- source_word: ἀπὸ ἀνατολῶν
  choice: sa silangan
  rationale: Sa tambalang “nagmumula sa silangan,” malinaw at idyomatiko nitong inilalarawan ang direksiyon, kaayon ng pagsalungat sa kanluran.
- source_word: φαίνεται
  choice: nakikita
  rationale: Pinananatili nito ang pasibong diwa ng anyo at binibigyang-diin ang hayag na pagkakakita, nang hindi dinaragdagan ang kahulugan bilang “nagniningning.”
- source_word: ἕως δυσμῶν
  choice: hanggang sa kanluran
  rationale: Ipinahahayag ng “hanggang” ang lawak o hangganan mula silangan hanggang kanluran.
- source_word: οὕτως ἔσται
  choice: gayundin ang magiging
  rationale: Pinananatili nito ang paghahambing at ang panghinaharap na diwa, sa natural na kayarian ng Filipino.
- source_word: παρουσία
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, malinaw na naipahahayag ng “pagdating” ang pangyayaring tinutukoy, habang pinananatili sa talababa ang posibleng leksikal na diwang “presensiya.”
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ng Anak ng Tao
  rationale: Ito ang nakaugaliang salin ng titulong ginagamit ni Jesus at pinananatili nito ang kaugnayan sa tradisyon at sa Daniel 7.
theological_decisions:
- issue: Pagsasalin ng παρουσία sa isang pahayag tungkol sa hinaharap
  choice: pagdating
  alternative: presensiya
  rationale: Inihahambing ng talata ang lantad at di-maipagkakamaling pagkakita sa kidlat sa hinaharap na παρουσία ng Anak ng Tao. Ang “pagdating” ang pinakamalinaw na pangunahing salin sa konteksto, ngunit hindi itinatago ang leksikal na alternatibong “presensiya,” kaya inilalagay iyon sa talababa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kung paanong … gayundin” upang malinaw na mapanatili ang paghahambing, at ang tradisyonal ngunit buhay pa ring titulong “Anak ng Tao.”
