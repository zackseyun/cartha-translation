  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: tl
  text: Saanman naroon ang bangkay, doon magtitipon ang mga buwitre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga agila.” Maaaring tumukoy sa mga agila ang salitang Griyego, ngunit higit na angkop sa larawan ng mga ibong nagtitipon sa bangkay ang “mga buwitre.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Saanman naroon
  rationale: Ipinahihiwatig ng ὅπου na may ἐάν at pandiwang nasa subjunctive ang di-tiyak na lugar; likas at maikli itong naipapahayag sa Tagalog bilang “saanman naroon.”
- source_word: πτῶμα
  choice: bangkay
  rationale: Ang πτῶμα ay tumutukoy sa patay na katawan. Ang “bangkay” ang pinakatumpak at likas na salita sa makabagong Tagalog nang hindi nililimitahan ang larawan sa bangkay ng hayop.
- source_word: συναχθήσονται
  choice: mag titipon
  rationale: Bagaman anyong future passive ang Griyego, likas sa Tagalog ang di-transitibong “magtipon” para sa mga ibong nagkakatipon sa isang lugar. Sa pinagsamang anyo sa teksto, “magtitipon” ang wastong baybay at nagpapanatili sa hinaharap na aspekto.
- source_word: ἀετοί
  choice: mga buwitre
  rationale: Maaaring mangahulugan ang ἀετοί ng “mga agila,” ngunit higit na angkop sa larawang nagtitipon sa bangkay ang “mga buwitre.” Pinananatili sa talababa ang tunay na alternatibong leksikal.
theological_decisions:
- issue: Kahulugan ng larawang nasa kasabihan
  choice: Tuwirang isalin ang larawan nang hindi tinutukoy kung ano ang sinasagisag ng bangkay at mga ibon.
  alternative: Ipaliwanag ito bilang tiyak na larawan ng paghuhukom, ng lantad na pagdating ng Anak ng Tao, ng pagkawasak ng Jerusalem, o ng mga sagisag ng Roma.
  rationale: Hindi tahasang ipinakikilala ng Griyegong teksto ang sinasagisag ng bangkay o ng mga ibon. Ang di-tiyak na ugnayang eskatolohikal ay dapat manatili sa teksto sa halip na lutasin sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maikli at kawikaang ayos na “Saanman… doon…” upang mapanatili ang diin at balanse ng Griyego.
