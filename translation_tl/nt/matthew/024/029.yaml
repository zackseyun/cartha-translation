id: MAT.24.29
reference: Matthew 24:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: tl
  text: Ngunit kaagad pagkatapos ng matinding paghihirap sa mga araw na iyon, magdidilim ang araw, hindi magbibigay ng liwanag ang buwan, malalaglag mula sa langit[a] ang mga bituin, at mayayanig ang mga kapangyarihan ng kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papawirin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapangyarihan ng kalangitan” ay maaaring tumukoy sa mga puwersang kosmiko, mga katawang makalangit, o mga makalangit na kapangyarihan; malawak ang saklaw ng pariralang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Ngunit kaagad
  rationale: Pinananatili ng “kaagad” ang mariing temporal na diwa ng Εὐθέως, samantalang ang “ngunit” ay natural na naghuhudyat ng paglipat na may bahagyang pagsalungat mula sa naunang pahayag.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: pagkatapos ng matinding paghihirap sa mga araw na iyon
  rationale: Ang “matinding paghihirap” ay malinaw at likas na modernong Tagalog para sa θλῖψις. Ang “sa mga araw na iyon” ay natural na nagpapahayag na ang paghihirap ay nauugnay sa tinukoy na mga araw nang hindi binabago ang kahulugan.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: magdidilim ang araw
  rationale: Likas itong pahayag sa Tagalog para sa magiging pagdidilim ng araw. Bagaman pasibo ang anyong Griyego, ang tahasang pasibong salin ay magiging mabigat o di-likas sa modernong Tagalog.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: hindi magbibigay ng liwanag ang buwan
  rationale: Pinananatili nito ang larawan sa Griyego na ang buwan ay hindi magbibigay ng sarili nitong liwanag, sa malinaw at karaniwang pananalita.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: malalaglag mula sa langit ang mga bituin
  rationale: Ang “malalaglag” ay angkop sa maramihang mga bituin at natural sa Tagalog. Maaaring tumukoy ang οὐρανός sa langit o papawirin, kaya nilalagyan ng talababa ang leksikal na alternatibo.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ang mga kapangyarihan ng kalangitan
  rationale: Pinananatili ng “mga kapangyarihan” ang lawak ng δυνάμεις, at hindi ito nililimitahan sa mga katawang makalangit, puwersang kosmiko, o mga espirituwal na nilalang lamang. Ang “kalangitan” ay isang natural at maringal na katumbas ng maramihang οὐρανῶν sa pariralang ito.
- source_word: σαλευθήσονται
  choice: mayayanig
  rationale: Ang “mayayanig” ay malinaw na nagpapahayag ng hinaharap at tumutugma sa pasibong diwa ng Griyego, habang angkop sa maringal na larawang propetiko.
theological_decisions:
- issue: Kalikasan ng mga tandang kosmiko sa diskursong apokaliptiko
  choice: Panatilihin nang tuwiran ang larawang propetiko nang hindi ipinapasiya kung ito ay literal, simboliko, o kapwa.
  alternative: Ipaliwanag ang mga tanda bilang eksklusibong literal na pangyayaring astronomiko, o eksklusibong sagisag ng pampolitika o panghukom na kaguluhan.
  rationale: Hindi nilulutas ng tekstong Griyego ang ugnayan ng literal at simbolikong pagbasa. Dapat panatilihin ng salin ang teolohikal at apokaliptikong tensiyong iyon.
- issue: Tinutukoy ng “mga kapangyarihan ng kalangitan”
  choice: Panatilihin ang malawak at di-tiyak na parirala.
  alternative: Tukuyin ang mga ito bilang mga anghel, masasamang espiritu, katawang makalangit, o likas na puwersang kosmiko lamang.
  rationale: Sadyang malawak ang αἱ δυνάμεις τῶν οὐρανῶν sa kontekstong ito; ang mas tiyak na salin ay magpapasok ng interpretasyong hindi tahasang itinakda ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maringal, at angkop sa propetikong pananalita. Iniwasan ang teknikal na “kapighatian” bilang pangunahing salin upang maging madaling maunawaan, ngunit pinanatili ang bigat ng θλῖψις sa “matinding paghihirap.” Inilagay ang mga talababa sa mismong mga pariralang tinutukoy nito, itinatama ang hindi pagtutugma ng mga pananda sa ibinigay na English consultation layer.
