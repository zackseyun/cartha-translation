  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: tl
  text: at hahatiin niya siya sa dalawa[a] at itatalaga niya ang kanyang lugar sa piling ng mga mapagkunwari.[b] Doon magkakaroon ng pagtangis at pagngangalit ng mga ngipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas idyomatikong pananalita, “paparusahan niya siya nang matindi.” Literal na nangangahulugan ang pandiwang Griyego na “hatiin sa dalawa.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “itatalaga niya ang kanyang bahagi kasama ng mga mapagkunwari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: hahatiin siya sa dalawa
  rationale: Pinananatili ang tuwiran at marahas na larawan ng pandiwang Griyego, na literal na nangangahulugang hatiin sa dalawa, sa halip na agad itong gawing pangkalahatang pahayag tungkol sa matinding parusa.
- source_word: μέρος
  choice: lugar
  rationale: Bagaman literal itong ‘bahagi’ o ‘parte,’ sa pariralang ito tumutukoy ito sa kalagayan o lugar na itinatalaga sa isang tao. Ang ‘lugar’ ay natural sa makabagong Tagalog at hindi labis na nagtatakda kung ito ay lokasyon, kapalaran, o bahagi sa kahatulan.
- source_word: ὑποκριτῶν
  choice: mga mapagkunwari
  rationale: Karaniwan at malinaw itong katumbas ng terminong Griyego at pinananatili ang mahalagang gamit nito sa Mateo para sa mga taong hindi tugma ang panlabas na anyo at tunay na pagkatao.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Tuwirang tumutukoy sa lugar o kalagayang kababanggit lamang at likas ang ayos nito sa Tagalog.
- source_word: κλαυθμὸς
  choice: pagtangis
  rationale: Ang ‘pagtangis’ ay marangal at malinaw na salin na akma sa paulit-ulit na pormula ng paghuhukom sa Mateo.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Pinananatili nito ang matingkad na larawan at ang nakagawiang biblikal na pagpapahayag sa Tagalog.
theological_decisions:
- issue: Kung palalambutin ang διχοτομήσει bilang pangkalahatang matinding parusa
  choice: Panatilihin sa pangunahing teksto ang kongkretong ‘hahatiin siya sa dalawa.’
  alternative: ‘paparusahan siya nang matindi’
  rationale: Konkretong paghiwa sa dalawa ang payak na leksikal na diwa ng pandiwa. Ang pagpapanatili nito ay gumagalang sa marahas na larawan ng babala nang hindi ipinapasya kung literal o matalinghaga ang katuparan nito.
- issue: Kung paano ihahayag ang τὸ μέρος αὐτοῦ ... θήσει
  choice: ‘itatalaga ang kanyang lugar sa piling ng mga mapagkunwari’
  alternative: ‘itatalaga ang kanyang bahagi kasama ng mga mapagkunwari’
  rationale: Ipinahihiwatig ng parirala ang itinakdang bahagi, kalagayan, o lugar ng alipin. Ang ‘lugar’ ay natural sa Tagalog habang hindi labis na nililinaw kung anong uri ng bahagi o kapalaran ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding larawan ng paghahati sa dalawa at ang pormulang ‘pagtangis at pagngangalit ng mga ngipin,’ habang ginawang natural ang idyoma tungkol sa itinakdang bahagi sa pamamagitan ng ‘lugar sa piling ng.’
