id: MAT.24.10
reference: Matthew 24:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: tl
  text: At sa panahong iyon, marami ang tatalikod[a], at ipagkakanulo nila ang isa’t isa[b] at kapopootan ang isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matitisod” o “magdaramdam.”
    reason: lexical_alternative
  - marker: b
    text: O “ibibigay nila ang isa’t isa sa kamay ng iba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: sa panahong iyon
  rationale: Malinaw na nagpapahayag ng panahon at likas sa makabagong Filipino; inuugnay nito ang pangyayari sa naunang sinabi ni Jesus.
- source_word: σκανδαλισθήσονται
  choice: tatalikod
  rationale: Sa konteksto ng pag-uusig, ipinahihiwatig ng pandiwa ang malubhang pagkatisod na humahantong sa pagtalikod, hindi lamang panandaliang pagkainis. Inilalagay sa talababa ang mas literal at iba pang posibleng diwa upang mapanatili ang saklaw ng salitang Griyego.
- source_word: πολλοὶ
  choice: marami
  rationale: Tuwirang salin ng pang-uring ginagamit bilang pangngalan at natural sa Filipino.
- source_word: ἀλλήλους
  choice: ang isa’t isa
  rationale: Malinaw na pinananatili ang katumbasang kilos sa magkabilang panig.
- source_word: παραδώσουσιν
  choice: ipagkakanulo
  rationale: Sa konteksto ng pag-uusig at pagkamuhi, likas na ipinahahayag nito ang mapagtaksil na pagsasakdal o pagbibigay ng kapwa sa mga kalaban. Ang mas literal na ‘ibibigay sa kamay ng iba’ ay nasa talababa.
- source_word: μισήσουσιν
  choice: kapopootan
  rationale: Tuwirang naghahayag ng aktibong pagkamuhi at ang anyong panghinaharap ng pandiwang Griyego.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: At sa panahong iyon ... at ... at ...
  rationale: Pinananatili ang pagkakaugnay sa naunang talata at ang sunod-sunod, tumitinding ritmo ng mga pangyayari.
theological_decisions:
- issue: Diwa ng σκανδαλισθήσονται sa konteksto ng pag-uusig sa wakas ng panahon
  choice: tatalikod
  alternative: matitisod; magdaramdam o masasaktan
  rationale: Ang kasunod na pagkakanulo at pagkamuhi ay nagpapakitang seryoso ang pagbagsak o paglayo. Hindi naman nililinaw ng salin ang isang partikular na sistemang doktrinal tungkol sa apostasya; pinananatili ng talababa ang tunay na lawak ng posibleng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ipagkakanulo” at “kapopootan” bilang karaniwang mga salitang angkop sa bigat ng konteksto, habang pinananatili sa mga talababa ang mahahalagang literal na alternatibo.
