  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: tl
  text: Mapalad ang aliping iyon na, pagdating ng kanyang panginoon, ay masumpungan niya itong gumagawa nang gayon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Mapalad
  rationale: Likas at marangal na katumbas ng pahayag tungkol sa taong nasa kalugod-lugod na kalagayan; hindi lamang ito tumutukoy sa pansamantalang damdaming masaya.
- source_word: δοῦλος
  choice: alipin
  rationale: Pinananatili ang tuwirang kahulugan ng salitang Griyego at ang ugnayang panlipunan sa talinghaga, sa halip na palambutin ito bilang karaniwang lingkod.
- source_word: κύριος
  choice: panginoon
  rationale: Pinananatili ang malawak na saklaw ng κύριος at ang pagtutugma nito sa konsultasyong Ingles na “lord”; sa konteksto, tumutukoy ito sa panginoon ng alipin.
- source_word: οὕτως ποιοῦντα
  choice: gumagawa nang gayon
  rationale: Tapat na pinananatili ang pabalik na pagtukoy ng οὕτως sa gawaing inilarawan sa naunang konteksto nang hindi nagdaragdag ng paliwanag.
theological_decisions:
- issue: Kahulugan ng κύριος sa talinghaga
  choice: panginoon
  alternative: amo
  rationale: Ang “panginoon” ay angkop sa ugnayan ng panginoon at alipin at pinananatili rin ang posibleng mas malalim na pahiwatig ng talinghaga, nang hindi tahasang ipinapasok iyon sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ang hulma na “sa pagdating ... ay matagpuan nitong” ay nagpapanatili sa kilos ng panginoon bilang tagahanap at sa alipin bilang gumagawa pa rin ng iniutos.
