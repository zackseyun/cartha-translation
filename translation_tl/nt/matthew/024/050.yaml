translation:
  language: tl
  text: Darating ang amo[a] ng aliping[b] iyon sa araw na hindi niya inaasahan at sa oras na hindi niya alam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panginoon.” Ang Griyegong kyrios ay maaaring mangahulugang “panginoon” o “amo”; dito, tumutukoy ito sa taong nakatataas sa alipin sa loob ng talinghaga.
    reason: lexical_alternative
  - marker: b
    text: O “lingkod.” Ang Griyegong doulos ay tumutukoy sa isang alipin o sa taong nasa nakataling paglilingkod; ginamit dito ang “alipin” dahil malinaw sa konteksto ang katayuang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: darating
  rationale: Ang panghinaharap na anyo ng ἥκω ay tumutukoy sa pagdating; natural at tuwiran ang “darating” sa konteksto ng di-inaasahang pagbabalik.
- source_word: κύριος
  choice: amo
  rationale: Sa loob ng talinghaga, ang κύριος ay taong nakatataas sa alipin. Malinaw na ipinahihiwatig ng “amo” ang ugnayang panlipunan nang hindi agad ginagawa itong banal na titulo.
- source_word: δούλου
  choice: alipin
  rationale: Ang δοῦλος ay taong nasa nakataling paglilingkod. Sa tahasang ugnayan ng amo at alipin dito, mas tumpak ang “alipin” kaysa sa mas malambot na “lingkod.”
- source_word: ἐκείνου
  choice: iyon
  rationale: Itinuturo ng demonstratibo ang partikular na aliping nabanggit; natural sa Filipino ang “aliping iyon.”
- source_word: ἐν ἡμέρᾳ ᾗ
  choice: sa araw na
  rationale: Pinananatili nito ang temporal na di-tiyak na pahayag ng Griyego at ang paralelismo sa kasunod na “sa oras na.”
- source_word: οὐ προσδοκᾷ
  choice: hindi inaasahan
  rationale: Ang προσδοκάω ay nangangahulugang umasa o maghintay sa isang inaakalang mangyayari. Ang “hindi inaasahan” ay payak at likas sa modernong Filipino.
- source_word: ἐν ὥρᾳ ᾗ
  choice: sa oras na
  rationale: Pinananatili nito ang retorikal na pagtutugma ng araw at oras sa Griyego.
- source_word: οὐ γινώσκει
  choice: hindi niya alam
  rationale: Tuwirang ipinahahayag nito ang payak na diwa ng γινώσκω at pinananatili ang pagkakaiba ng hindi pag-asam at hindi pagkaalam.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa konteksto ng sambahayan sa talinghaga
  choice: amo
  alternative: panginoon
  rationale: Ang agarang tinutukoy ay ang taong nakatataas sa alipin sa loob ng kuwento. Iniiwasan ng “amo” ang tahimik na paglalagay ng isang tuwirang kristolohikal na titulo, habang hindi itinatanggi ang mas malawak na eskatolohikal na kahulugan ng talinghaga.
- issue: Pagpapakahulugan sa δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Matingkad sa talata ang ugnayang amo–alipin, kaya pinananatili ng “alipin” ang nakataling katayuang panlipunan at ang retorikal na bigat ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “alipin” sa sugnay na “hindi inaasahan ng alipin” upang luminaw na ang alipin—hindi ang amo—ang hindi umaasa sa araw ng pagdating. Pinanatili ang pares na “araw” at “oras” mula sa Griyego.
