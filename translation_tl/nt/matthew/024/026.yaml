  to: Kaya, kung sabihin nila sa inyo, “Tingnan ninyo, naroon siya sa ilang,” huwag kayong lumabas; “Tingnan ninyo, siya ay nasa mga silid sa loob[a],” huwag ninyo itong paniwalaan.
