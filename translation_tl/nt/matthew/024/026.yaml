  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: tl
  text: Kaya, kung sabihin nila sa inyo, “Tingnan ninyo, naroon siya sa ilang,” huwag kayong lumabas; “Tingnan ninyo, siya ay nasa mga silid sa loob[a],” huwag ninyo itong paniwalaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga silid sa loob” ay maaari ding isaling “mga bodega,” “mga pribadong silid,” o “mga lihim na silid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kaya, kung
  rationale: Pinananatili ng “kaya” ang ugnayang lohikal sa naunang babala, at ng “kung” ang kondisyong ipinahihiwatig ng ἐὰν.
- source_word: εἴπωσιν ὑμῖν
  choice: sabihin nila sa inyo
  rationale: Tuwirang inilalarawan ang di-tiyak na ikatlong panauhang maramihan nang hindi tinutukoy kung sino ang mga nagsasalita.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang likas at makabagong panawag-pansin na nagpapanatili sa diin at agarang himig ng ἰδού.
- source_word: ἐν τῇ ἐρήμῳ
  choice: sa ilang
  rationale: Ang “ilang” ay maaaring tumukoy sa ilang o ilang na pook at hindi ito nililimitahan sa larawang mabuhanging disyerto.
- source_word: ἐστίν
  choice: naroon siya / nasa … siya
  rationale: Kailangang ilantad sa Tagalog ang paksang ipinahihiwatig ng konteksto; “siya” lamang ang idinagdag, nang hindi pinapangalanang Mesiyas o Jesus.
- source_word: μὴ ἐξέλθητε
  choice: huwag kayong pumunta roon
  rationale: Sa konteksto, ang ipinagbabawal ay ang paglabas o pagpunta sa sinasabing kinaroroonan; natural sa Tagalog ang “pumunta roon” at malinaw ang direksiyon ng kilos.
- source_word: ἐν τοῖς ταμείοις
  choice: sa mga silid sa loob
  rationale: Ipinahihiwatig ng ταμεῖον ang mga panloob o pribadong silid; hindi ipinapalagay ng salin na tiyak na bodega o lihim na silid ang mga ito.
- source_word: μὴ πιστεύσητε
  choice: huwag ninyo itong paniwalaan
  rationale: Ang “ito” ay tumutukoy sa iniulat na pahayag, hindi kinakailangang sa mga nagsasalita mismo.
theological_decisions:
- issue: Ipinahihiwatig na paksa ng ἐστίν
  choice: Isinalin bilang “siya” nang walang idinagdag na titulo.
  alternative: “naroon ang Mesiyas” o “naroon si Jesus”
  rationale: Bagaman tinutukoy ng konteksto ang ipinapahayag na pagkanaroroon ni Jesus/Mesiyas, walang hayag na pangngalan o titulo sa sugnay; pinananatili ng “siya” ang ipinahihiwatig ngunit hindi tahasang tinukoy.
- issue: Ugnayan ng dalawang iniulat na pahayag
  choice: Pinanatili ang magkatabing paralel na mga pahayag na pinaghihiwalay ng tuldok-kuwit, nang walang idinagdag na “o.”
  alternative: Lagyan ng “o” bago ang ikalawang pahayag.
  rationale: Magkaparalel ang dalawang sitwasyon sa ilalim ng iisang kondisyong sugnay, ngunit walang tahasang katumbas ng “o” sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo” sa halip na arkaikong panawag-pansin, at “sa ilang” upang mapanatili ang lawak ng kahulugan ng ἔρημος. Ang panandang [a] ay inilagay matapos ang buong pangungusap dahil tumutukoy ito sa pariralang nasa ikalawang iniulat na pahayag.
