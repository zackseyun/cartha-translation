id: MAT.24.36
reference: Matthew 24:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: tl
  text: Ngunit tungkol sa araw at oras na iyon, walang nakaaalam—kahit ang mga anghel sa langit, ni ang Anak[a]—kundi ang Ama lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi kasama sa ilang manuskrito ang “ni ang Anak.” Sinusunod ng pangunahing teksto ang pagbasa ng SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ngunit tungkol sa
  rationale: Ipinakikilala ng περί na may genitive ang paksa, samantalang ang δέ ay naghuhudyat ng banayad na paglipat o pagsalungat. Likas sa modernong Tagalog ang “Ngunit tungkol sa” at napapanatili nito ang dalawang tungkulin.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: araw at oras na iyon
  rationale: Ang iisang demonstrative na ἐκείνης ay tumutukoy sa pinagsamang pariralang “araw at oras.” Ang pagkakalagay ng “na iyon” sa hulihan ay natural sa Tagalog at saklaw ang dalawang pangngalan.
- source_word: οὐδεὶς οἶδεν
  choice: walang nakaaalam
  rationale: Tuwirang ipinahahayag nito ang pangkalahatang pagtanggi ng οὐδείς at ang kasalukuyang diwa ng οἶδεν. Ang “nakaaalam” ay dignified ngunit malinaw sa karaniwang mambabasa.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: kahit ang mga anghel sa langit
  rationale: Ipinahahayag ng “kahit” ang mariing inklusibong pagtanggi ng οὐδέ. Ang “sa langit” ay mas natural kaysa sa literal na “ng mga langit” sa modernong Tagalog.
- source_word: οὐδὲ ὁ υἱός
  choice: ni ang Anak
  rationale: Ipinagpapatuloy ng “ni” ang negatibong hanay nang hindi inuulit nang alanganin ang “kahit.” Pinananatili ang “Anak” bilang kinikilalang titulo at hindi pinahihina ang pahayag.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Kasunod ng negatibong pahayag, ang εἰ μή ay nagtatakda ng eksepsiyon. Natural sa Tagalog ang hulma na “walang… kundi…”.
- source_word: ὁ πατὴρ μόνος
  choice: ang Ama lamang
  rationale: Nililimitahan ng μόνος ang kaalamang ito sa Ama. Malinaw at natural na ipinahahayag ng “lamang” ang pagiging bukod-tangi, habang pinananatili ang “Ama” bilang banal na titulo.
theological_decisions:
- issue: Implikasyong Kristolohikal ng οὐδὲ ὁ υἱός (“ni ang Anak”)
  choice: Panatilihin sa pangunahing teksto ang buong pariralang “ni ang Anak” nang walang pagpapalambot o paliwanag na idinadagdag sa salin.
  alternative: Alisin ang parirala ayon sa ilang manuskrito, o ipakahulugan ito sa paraang nagpapahina sa hayagang pahayag na hindi alam ng Anak ang araw at oras.
  rationale: Kasama ang οὐδὲ ὁ υἱός sa ibinigay na teksto ng SBLGNT. Pinananatili ng salin ang tunay na tensiyong teolohikal at hindi ito nilulutas sa pamamagitan ng pag-aalis, pagpapalawak, o pagpapakahulugang sektaryan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “nakaaalam” sa halip na mas kolokyal na “alam,” at pinanatili ang maiikling titulong “Anak” at “Ama.” Ang footnote marker [a] ay inilagay kaagad pagkatapos ng tekstuwal na pariralang pinagtatalunan.
