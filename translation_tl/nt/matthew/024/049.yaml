translation:
  language: tl
  text: at magsimulang bugbugin ang mga kapwa niya alipin[a], at kumain at uminom kasama ng mga naglalasing[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapwa niya lingkod.” Literal na tumutukoy ang salitang Griyego sa mga kapwa alipin sa ilalim ng iisang panginoon.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga lasinggero.” Ang salitang Griyego ay maaaring tumukoy sa mga taong nakikilala sa paglalasing.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: magsimulang bugbugin
  rationale: Pinananatili ng “magsimulang” ang ingressive na diwa ng ἄρξηται na may infinitive, at ipinahihiwatig ng “bugbugin” ang marahas at maaaring paulit-ulit na pananakit na mas angkop dito kaysa simpleng “hampasin.”
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: ang mga kapwa niya alipin
  rationale: Ang σύνδουλος ay kapwa alipin sa ilalim ng iisang panginoon. Natural sa Filipino ang ayos na “mga kapwa niya alipin,” at pinananatili nito ang kanilang magkatulad na kalagayan sa sambahayan.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: at makisalo sa pagkain at inuman
  rationale: Ipinahahayag ng parirala ang patuloy na pagkain at pag-inom kasama ng isang pangkat. Ang “makisalo” ay natural sa Filipino sa konstruksiyong μετὰ, habang ang “pagkain at inuman” ay hindi nagsasabing piging iyon ngunit malinaw na ipinakikitang kasama siya sa gawain.
- source_word: μετὰ τῶν μεθυόντων
  choice: sa mga naglalasing
  rationale: Ang present participle ay tumutukoy sa mga taong umiinom hanggang malasing o nakikilala sa gayong asal. Mas tuwirang nagpapanatili ng aktibong diwa ang “mga naglalasing” kaysa sa statikong “mga lasing.”
- source_word: δὲ
  choice: at
  rationale: Mahina lamang ang pag-uugnay o paghahambing dito; natural na ipinagpapatuloy ng “at” ang talaan ng masamang asal nang hindi nagpapasok ng labis na pagsalungat.
theological_decisions:
- issue: Paglalarawan sa mga σύνδουλοι sa sambahayan ng panginoon
  choice: mga kapwa niya alipin
  alternative: mga kapwa niya lingkod
  rationale: Mahalaga sa talinghaga ang kanilang magkakatulad na nakapailalim na kalagayan sa iisang panginoon. Kaya mas tumpak dito ang “alipin,” samantalang maaaring pagaanin ng “lingkod” ang panlipunang realidad ng salitang Griyego.
- issue: Saklaw ng μεθυόντων
  choice: mga naglalasing
  alternative: mga lasinggero
  rationale: Pinananatili ng napiling anyo ang aktibong at posibleng nakagawiang paglalasing nang hindi ginagawang permanenteng bansag ang participle.
translation_notes:
  register: Makabago at dignified na Filipino, na angkop sa tuloy-tuloy na pangungusap ng Mateo 24:48–49. Ginamit ang “bugbugin” para sa malinaw na pang-aabuso at “mga naglalasing” upang maiwasan ang mas kolokyal at mapanuring tunog ng “mga lasinggero.”
