base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: tl
  text: Kaya maging handa rin kayo, sapagkat darating ang Anak ng Tao sa oras na hindi ninyo inaasahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa oras na hindi ninyo inaakala.” Ang pandiwang Griyego ay maaaring mangahulugang “mag-isip,” “mag-akala,” o, ayon sa ipinahihiwatig ng konteksto, “umasang mangyayari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Tumutukoy ito pabalik sa naunang babala at naghahayag ng bunga o konklusyon. Likas at malinaw sa makabagong Tagalog ang “Kaya.”
- source_word: καὶ ὑμεῖς
  choice: rin kayo
  rationale: Pinananatili ng “rin” ang diwa ng pagdaragdag o pagsasama ng καί, habang ang lantad na “kayo” ay nagpapanatili ng diin sa mga kausap.
- source_word: γίνεσθε ἕτοιμοι
  choice: maging handa
  rationale: Ang kasalukuyang pautos na anyo ay nananawagan sa patuloy na kalagayan ng kahandaan. Natural sa Tagalog ang “maging handa” at malinaw ang puwersang pautos nito.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala rito ng ὅτι ang dahilan ng utos. Ang “sapagkat” ay malinaw, marangal, at angkop sa nakasulat na Tagalog.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: sa oras na hindi ninyo inaasahan
  rationale: Ang parirala ay temporal, at sa kontekstong ito ay ipinahihiwatig ng δοκεῖτε ang pag-aakala o pag-asang mangyayari. Pinakamalinaw sa karaniwang Tagalog ang “hindi ninyo inaasahan,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang tuwiran at kinikilalang salin ng titulong Griyego. Pinananatili nito ang Semitikong pinagmulan at posibleng kaugnayan sa Daniel nang hindi ipinapaliwanag nang labis ang titulo.
- source_word: ἔρχεται
  choice: darating
  rationale: Bagaman nasa anyong pangkasalukuyan ang Griyego, ginagamit ito rito para sa tiyak na panghinaharap na pagdating. Ang “darating” ang pinakanatural at malinaw na katumbas sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Pinananatili ng “Anak ng Tao” ang mismong anyo ng titulo, ang lalim ng kahulugan nito, at ang posibleng alusyon sa Daniel. Ang mga alternatibo ay higit na mapagpaliwanag at maaaring magtakda ng kahulugang sadyang hindi nililinaw ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog; tuwiran ang utos at pinananatili ang kinikilalang titulong “Anak ng Tao.”
