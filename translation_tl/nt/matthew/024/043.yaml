  source_fidelity: 'Ang diwa at pangunahing mga larawan ng Griyego ay naipapasa nang tapat: ang may pananagutan sa bahay, ang takdang pagbabantay sa gabi, ang magnanakaw, ang pagpupuyat, at ang pagbutas/paghuhukay upang makapasok. Gayunman, mas malinaw na maipapahayag sa Tagalog ang kontrapaktuwal na kondisyon ng εἰ ᾔδει at ang idiomatikong kahulugan ng διορυχθῆναι.'
  naturalness: Nauunawaan ang kasalukuyang salin, ngunit mas natural ang “kung nalaman sana” para sa kondisyong salungat sa nangyari, at “sa anong yugto ng pagbabantay sa gabi” kaysa “sa aling pagbabantay sa gabi.” Ang “mabutas ang bahay niya” ay mas maayos na Tagalog kaysa “butasin ang kaniyang bahay” pagkatapos ng “hinayaang,” habang pinananatili ang pasibong diwa.
  terminology: Katanggap-tanggap ang “panginoon ng bahay” para sa οἰκοδεσπότης at pinananatili nito ang papel ng pinuno ng sambahayan nang hindi inaangkin na ang usapin ay legal na pagmamay-ari. Ang “pagbabantay sa gabi” ay angkop para sa φυλακή; nililinaw ng talababa na ito ay isang takdang yugto ng gabi.
  issues:
