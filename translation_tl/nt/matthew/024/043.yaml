  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: tl
  text: 'Ngunit unawain ninyo ito: kung nalaman sana ng panginoon ng bahay kung sa anong yugto ng pagbabantay sa gabi[a] darating ang magnanakaw, nanatili sana siyang gising at hindi niya hinayaang mabutas[b] ang bahay niya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang gabi noon ay hinahati sa mga takdang yugto ng pagbabantay.
    reason: cultural_note
  - marker: b
    text: Literal na “mahukay nang tuluyan” o “mabutas.” Maaaring mapasok ang ilang bahay noon sa pamamagitan ng pagbutas sa dingding o bubong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Ngunit unawain ninyo ito
  rationale: Pinananatili ang paglipat ng diwa na hudyat ng δέ at ang tuwirang panawagan ng γινώσκετε; natural at malinaw ito sa modernong Tagalog.
- source_word: οἰκοδεσπότης
  choice: panginoon ng bahay
  rationale: Tumutukoy sa pinuno o may kapangyarihan sa sambahayan, nang hindi ipinapalagay ang makabagong konsepto ng legal na pagmamay-ari na maaaring ipahiwatig ng “may-ari ng bahay.”
- source_word: ποίᾳ φυλακῇ
  choice: sa aling pagbabantay sa gabi
  rationale: Ang φυλακή rito ay isang takdang yugto ng pagbabantay sa gabi. Pinananatili ng salin ang sinaunang paghahati ng gabi, at nililinaw ito sa talababa.
- source_word: ὁ κλέπτης ἔρχεται
  choice: darating ang magnanakaw
  rationale: Bagaman nasa pangkasalukuyang anyo ang ἔρχεται, ang hinaharap na “darating” ay natural sa Tagalog sa loob ng di-tunay na kondisyong nagsasaad ng inaasahang pagdating.
- source_word: ἐγρηγόρησεν ἂν
  choice: nanatili sana siyang gising
  rationale: Ipinapahayag ang kontrapaktuwal na diwa ng ἄν at ang literal na larawang manatiling gising laban sa magnanakaw sa gabi.
- source_word: οὐκ ἂν εἴασεν
  choice: hindi niya hinayaang
  rationale: Natural na katumbas sa Tagalog ng hindi pagpapahintulot, na pinananatili ang kontrapaktuwal na diwa sa tulong ng “sana” sa naunang sugnay.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: butasin ang kaniyang bahay
  rationale: Pinananatili ang kongkretong larawan ng διορύσσω, ang paghuhukay o pagbutas sa dingding ng bahay upang makapasok, sa halip na palitan ito ng pangkalahatang “pasukin.”
theological_decisions:
- issue: Larawan ng οἰκοδεσπότης
  choice: panginoon ng bahay
  alternative: may-ari ng bahay; puno ng sambahayan
  rationale: Ang talinghaga ay tumutukoy sa taong may pamamahala sa bahay. Iniiwasan ng salin ang hindi kinakailangang modernong pagpapalagay tungkol sa legal na pagmamay-ari habang pinananatili ang papel ng tauhan.
- issue: Larawan ng pagpasok ng magnanakaw
  choice: butasin ang kaniyang bahay
  alternative: pasukin ang kaniyang bahay; looban ang kaniyang bahay
  rationale: Ang mas kongkretong salin ay nagpapanatili sa sinaunang larawang nakapaloob sa διορύσσω at hindi binubura ang kultural na detalye; ipinapaliwanag ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “ninyo” para sa maramihang kausap at “kaniyang” para sa malinaw na pormal na anyo. Pinanatili ang kultural na larawan ng mga pagbabantay sa gabi at pagbutas sa bahay, na may maiikling paliwanag sa talababa.
