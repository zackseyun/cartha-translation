base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: tl
  text: Ngunit kung sabihin ng masamang lingkod[a] na iyon sa kanyang puso, “Nagtatagal ang amo[b] ko,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “masamang alipin.” Maaaring mangahulugan ang salitang Griyego na doulos ng “lingkod” o “alipin,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “panginoon ko.” Sa tagpo ng sambahayan sa talinghaga, ang salitang Griyego na kyrios ay isinaling “amo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπῃ
  choice: Ngunit kung sabihin
  rationale: Pinananatili ng “kung” ang kondisyonal na diwa ng ἐὰν kasama ng subjunctive, habang ang “ngunit” ay nagpapahayag ng banayad na pagsalungat ng δέ.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ang masamang lingkod na iyon
  rationale: Ang “masama” ay likas na makabagong salin ng κακός bilang moral na paglalarawan. Ang “lingkod” ay angkop sa papel niya sa sambahayan, habang pinananatili sa talababa ang posibleng “alipin” para sa δοῦλος. Isinasalin ng “na iyon” ang diin ng ἐκεῖνος.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sa kanyang puso
  rationale: Pinananatili nito ang metapora ng Griyego para sa lihim na pag-iisip o pagsasalita sa sarili, at malinaw pa rin ito sa modernong Tagalog.
- source_word: Χρονίζει
  choice: Nagtatagal
  rationale: Ipinahahayag nito ang patuloy na pagkaantala o pagtagal nang hindi idinaragdag ang “pagdating” o “pagbabalik,” na wala sa mismong parirala.
- source_word: μου ὁ κύριος
  choice: ang amo ko
  rationale: Sa tagpo ng sambahayan, likas na ipinahahayag ng “amo” ang ugnayan ng κύριος sa lingkod. Inilalagay ng Tagalog ang panghalip na “ko” pagkatapos ng pangngalan.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa talinghaga
  choice: amo
  alternative: Panginoon
  rationale: Ang agarang tagpo ay ang ugnayan ng isang lingkod at ng namamahala sa sambahayan. Kaya malinaw ang “amo” sa antas ng salaysay at hindi nito ipinipilit ang tuwirang kristolohikal na titulo, bagaman maaaring maunawaan ng mambabasa ang mas malawak na tinutukoy ng talinghaga.
- issue: Pagpapakahulugan sa δοῦλος
  choice: lingkod
  alternative: alipin
  rationale: Nakatutok ang talata sa ipinagkatiwalang tungkulin at asal ng tauhan sa sambahayan, kaya mas natural ang “lingkod.” Gayunman, maaaring tukuyin ng δοῦλος ang isang alipin, kaya itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang “sa kanyang puso” at iniwasang idagdag ang “pagdating” o “pagbabalik” sa Χρονίζει upang hindi sumobra sa tahasang sinasabi ng tekstong Griyego.
