base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: tl
  text: At hindi nila namalayan hanggang sa dumating ang baha at tinangay silang lahat; gayon din ang pagdating ng Anak ng Tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: hindi nila nalaman ang mangyayari
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa na hindi nila napagtanto o namalayan ang nalalapit na pangyayari. Idinagdag ang “ang mangyayari” bilang likas na layon sa Tagalog nang hindi tinutukoy nang higit sa ipinahihiwatig ng Griyego.
- source_word: κατακλυσμός
  choice: baha
  rationale: Karaniwan at malinaw na tawag sa malaking baha sa salaysay ni Noe.
- source_word: ἦρεν ἅπαντας
  choice: tinangay silang lahat
  rationale: Ipinahahayag ang marahas at lubusang pagdala sa kanilang lahat ng baha; mas angkop sa konteksto kaysa sa neutral na “kinuha.”
- source_word: παρουσία
  choice: pagdating
  rationale: Sa kontekstong eskatolohikal, tumutukoy ito sa pagdating o pagharap ng Anak ng Tao; ang “pagdating” ang natural at hindi denominasyonal na salin.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Kinikilalang titularyong biblikal at karaniwang salin sa Tagalog.
theological_decisions:
- issue: Saklaw ng paghahambing sa panahon ni Noe at sa παρουσία ng Anak ng Tao
  choice: Gayundin ang mangyayari sa pagdating ng Anak ng Tao
  alternative: Gayundin ang pagdating ng Anak ng Tao
  rationale: Pinananatili ang paghahambing nang hindi ipinapakahulugang ang mismong pagdating ang katumbas ng baha; ang punto ay ang biglaan at di-napansing pagdating ng paghuhukom ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “tinangay” upang mapanatili ang matingkad na larawan ng baha at ang “Gayundin ang mangyayari” upang maging likas ang paghahambing sa Tagalog.
