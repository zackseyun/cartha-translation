source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: tl
  text: At kung hindi pinaikli[a] ang mga araw na iyon, walang sinumang tao[b] ang maliligtas sana; ngunit alang-alang sa mga hinirang, paiikliin ang mga araw na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinaiksi ... paiiksihin.” Ang pandiwang Griyego ay maaaring mangahulugang paikliin o putulin ang tagal.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lahat ng laman.” Isa itong idyomang biblikal na tumutukoy sa lahat ng tao; sa negatibong sugnay na ito, nangangahulugan itong walang sinumang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: hindi pinaikli / paiikliin
  rationale: Ang κολοβόω ay tumutukoy sa pagpapaikli o pagputol. Ang “pinaikli/paiikliin” ay natural sa Filipino kapag mga araw o haba ng panahon ang tinutukoy at malinaw na ipinahihiwatig na babawasan ang tagal ng mga iyon.
- source_word: οὐκ ἂν ἐσώθη
  choice: ang maliligtas
  rationale: Ipinahahayag ng anyong Griyego ang resultang hindi sana mangyayari. Pinananatili ng “maliligtas” ang saklaw ng σῴζω—iligtas o panatilihing buhay—nang hindi nililimitahan ang kahulugan sa “makaliligtas nang buhay” lamang.
- source_word: πᾶσα σάρξ
  choice: walang sinumang tao
  rationale: Sa sugnay na may pagtanggi, ang idyomang “lahat ng laman” ay nangangahulugang walang tao. Hindi natural at maaaring mapagkamalang karne sa modernong Filipino ang literal na “walang laman,” kaya malinaw na isinalin ang kahulugang pantao habang ipinaliliwanag sa talababa ang literal na anyo.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ngunit alang-alang sa mga hinirang
  rationale: Ipinahahayag ng διά na may accusative ang dahilan o kapakinabangan. Ang “alang-alang sa” ay natural na katumbas, at ang “mga hinirang” ay tumpak na tumutukoy sa ἐκλεκτοί nang hindi tinutukoy kung aling pangkat teolohikal sila.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ang mga araw na iyon
  rationale: Tuwirang pinananatili nito ang demonstratibong diin ng ἐκεῖναι sa natural na Filipino.
- source_word: καὶ εἰ μὴ
  choice: At kung hindi
  rationale: Pinananatili nito ang tahasang kondisyunal na anyo at ang pang-ugnay na καί.
theological_decisions:
- issue: Ang pagkakakilanlan ng οἱ ἐκλεκτοί sa diskursong eskatolohikal
  choice: mga hinirang
  alternative: mga pinili ng Diyos; mga mananampalataya; tapat na nalabi
  rationale: Hindi nililinaw ng talatang ito ang buong saklaw o tiyak na pagkakakilanlan ng pangkat. Ang “mga hinirang” ay nagpapanatili sa katawagan ng teksto at umiiwas sa denominasyonal na pagpapasiya.
- issue: Ang diwa ng σῴζω sa konteksto
  choice: maliligtas
  alternative: mananatiling buhay; makaliligtas nang buhay
  rationale: Ipinahihiwatig ng konteksto ang pisikal na pag-iingat ng buhay, ngunit mas malawak ang maaaring saklaw ng σῴζω. Pinananatili ng “maliligtas” ang leksikal at teolohikal na tensiyon nang hindi ito ginagawang purong espirituwal o purong pisikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hinirang” bilang pormal ngunit karaniwang katawagang biblikal. Iniwasan ang literal na “laman” sa pangunahing teksto dahil hindi nito likas na naihahatid sa modernong Filipino ang idyomang tumutukoy sa sangkatauhan.
