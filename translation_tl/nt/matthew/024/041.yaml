  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: tl
  text: Dalawang babae ang maggigiling sa gilingan[a][b]; ang isa ay kukunin at ang isa ay iiwan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Dalawang babaeng naggigiling sa gilingan.” Ang pandiwari sa Griyego ay nasa anyong pambabaeng maramihan, kaya tiyak na mga babae ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa gilingang-kamay” o “gamit ang batong panggiling”; maaaring tumukoy ang salitang Griyego sa gilingan o, mas tiyak, sa kagamitang panggiling.
    reason: lexical_alternative
  - marker: c
    text: Payak na sinasabi ng Griyego na “kukunin ang isa at iiwan ang isa.” Hindi nito tinutukoy rito kung ang pagkuha ay para sa kaligtasan o sa hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο
  choice: Dalawang
  rationale: Pamilang na tumutukoy sa pares; ikinakabit nang natural sa tahasang “babae,” na ipinahihiwatig ng pambabaeng anyo ng kasunod na pandiwari.
- source_word: ἀλήθουσαι
  choice: babae ang maggigiling
  rationale: Ang pandiwari ay nasa pambabaeng maramihan at nangangahulugang “gumigiling.” Kailangang tahasang banggitin ang “babae” sa Filipino upang maipakita ang kasariang nasa Griyego. Ginamit ang aspektong magaganap dahil bahagi ito ng paglalarawan ni Jesus sa darating na pangyayari.
- source_word: ἐν τῷ μύλῳ
  choice: sa gilingan
  rationale: Maaaring tumukoy ang μύλος sa gilingan o sa batong panggiling. Ang “sa gilingan” ay natural at hindi labis na nagtatakda kung anong uri ng kagamitan ang gamit.
- source_word: μία
  choice: ang isa
  rationale: Likas na Filipino para sa pamamahaging paghahambing na “ang isa … at ang isa …” at malinaw na tumutukoy sa dalawang babae.
- source_word: παραλαμβάνεται
  choice: kukunin
  rationale: Tuwirang salin na hindi nagpapasiya kung ang pagkuha ay para sa kaligtasan o sa hatol. Ang aspektong magaganap ay umaayon sa kontekstong propetiko.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pang-ugnay ng Griyego nang hindi nagdaragdag ng tahasang pagsalungat.
- source_word: μία
  choice: ang isa
  rationale: Ikalawang pamamahaging pamilang, katapat ng unang “ang isa.”
- source_word: ἀφίεται
  choice: iiwan
  rationale: Tuwirang salin na hindi dinaragdagan ng “sa likuran” o “pababayaan,” na maaaring magpasok ng interpretasyong hindi tahasang sinasabi ng talata.
theological_decisions:
- issue: Kung tahasang babanggitin na mga babae ang tinutukoy ng pandiwari
  choice: Tahasan ang “Dalawang babae”
  alternative: Dalawa ang maggigiling sa gilingan
  rationale: Pambabaeng maramihan ang ἀλήθουσαι. Dahil walang kasariang gramatikal ang katumbas na pandiwa sa Filipino, kailangang sabihin ang “babae” upang mapanatili ang impormasyong nasa Griyego.
- issue: Kung bibigyang-kahulugan ang “kukunin” at “iiwan” bilang kaligtasan o hatol
  choice: Pinanatiling walang tiyak na paliwanag ang “kukunin” at “iiwan”
  alternative: Ang isa ay kukunin para sa hatol at ang isa ay ililigtas; o ang isa ay kukunin para sa kaligtasan at ang isa ay iiwan para sa hatol
  rationale: Inilalarawan ng talata ang paghihiwalay ngunit hindi nito tahasang sinasabi rito kung alin sa dalawang kilos ang tumutukoy sa kaligtasan o sa hatol. Pinananatili ng salin ang tunay na teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang “gilingan” sa halip na mas teknikal na katawagan, at ang balanseng hulma na “ang isa … at ang isa …” upang mapanatili ang maikli at mariing paghahambing ng Griyego.
