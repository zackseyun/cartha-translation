  text: But all these things are the beginning of birth pains[a].
translation:
  language: tl
  text: Ngunit ang lahat ng ito ay simula pa lamang ng mga kirot sa panganganak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sakit sa panganganak” o “mga hirap sa panganganak.” Ginagamit ng Griyego ang mga kirot ng panganganak bilang larawan ng pasimulang yugto ng dumarating na paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ang lahat
  rationale: Kasama ng ταῦτα, tumutukoy ito sa kabuuan ng mga pangyayaring kababanggit lamang.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa naunang talaan tungo sa pagsusuri ni Jesus.
- source_word: ταῦτα
  choice: ng ito
  rationale: Sa pariralang “ang lahat ng ito,” malinaw na tumutukoy ang demonstratibo sa mga pangyayaring naunang binanggit.
- source_word: ἀρχὴ
  choice: pasimula pa lamang
  rationale: Ipinapakita ng ἀρχή na ang mga pangyayaring ito ay unang yugto, hindi pa ang wakas; ang “pa lamang” ay likas na Filipino at nililinaw ang diin nang hindi dinaragdagan ang tiyak na iskema.
- source_word: ὠδίνων
  choice: mga hirap sa panganganak
  rationale: Tuwirang pinananatili nito ang larawan ng mga kirot o paghihirap na kaugnay ng panganganak sa natural at dignified na modernong Tagalog.
theological_decisions:
- issue: Metaporikal na puwersa ng ὠδίνων
  choice: Panatilihin ang metapora ng panganganak bilang “mga hirap sa panganganak.”
  alternative: “mga pagdurusa” o “mga kaguluhan”
  rationale: Inilalarawan ng talata ang mga naunang kaguluhan bilang unang yugto ng dumarating na paghihirap. Pinananatili ng salin ang eskatolohikal na tensiyon nang hindi naglalagay ng mas tiyak na doktrinal na balangkas kaysa sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “pasimula pa lamang” ay natural sa karaniwang pananalita ngunit angkop pa rin sa pagbasa ng Kasulatan; pinananatili ang metapora sa halip na gawing pangkalahatang “pagdurusa.”
