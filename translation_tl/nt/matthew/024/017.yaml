lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Ang nasa bubungan
  rationale: Ang pariralang may pantukoy ay tumutukoy sa sinumang taong nasa ibabaw ng bahay. Likas at maikli sa Tagalog ang “ang nasa bubungan,” at hindi nito dinaragdagan ang kasariang hindi kailangang tahasang banggitin.
- source_word: δώματος
  choice: bubungan
  rationale: Tumutukoy ito sa ibabaw o patag na bubong ng bahay na maaaring gamitin at puntahan. Pinananatili ng “bubungan” ang konkretong tagpuan sa bahay.
- source_word: μὴ καταβάτω
  choice: ay huwag nang bumaba
  rationale: Nagpapahayag ito ng mariin at apurahang pagbabawal. Ang “huwag nang bumaba” ay natural sa konteksto at nagpapahiwatig na hindi na dapat mag-aksaya ng oras sa pagbaba.
- source_word: ἆραι
  choice: upang kunin
  rationale: 'Ang pawatas ay nagpapahayag ng layunin ng pagbaba: ang pagkuha ng mga bagay.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: ang mga bagay mula sa loob ng kanyang bahay
  rationale: Ang neuter plural na may ἐκ ay tumutukoy sa mga gamit o bagay na kukunin mula sa bahay. Hindi ginawang “mga ari-arian” upang maiwasan ang labis na pagpapakahulugan.
- source_word: οἰκίας
  choice: bahay
  rationale: Ang pisikal na gusali ang tinutukoy, kaya mas angkop ang “bahay” kaysa “tahanan.”
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili ang isahang reperensiya ng Griyego. Sa Tagalog, hindi tinutukoy ng “kanyang” ang kasarian, kaya likas nitong naihahatid ang representative singular nang walang dagdag na espesipikasyon.
theological_decisions:
- issue: Representative masculine reference
  choice: Gamitin ang isahang “kanyang”
  alternative: Gamitin ang maramihang “kanilang” o tahasang “kaniyang sariling”
  rationale: Ang Griyego ay isahan at gramatikal na panlalaki ngunit may pangkalahatang bisa. Ang “kanyang” sa Tagalog ay isahan at walang markang pangkasarian, kaya tapat ito sa bilang at hindi nagdaragdag ng teolohikal na diin sa kasarian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bubungan” upang mapanatili ang sinaunang konteksto ng isang patag at nagagamit na bubong; ipinaliliwanag ito sa talababa.
