  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: tl
  text: Kaya, kapag nakita ninyo ang kasuklam-suklam na bagay ng pagkatiwangwang[a] na binanggit sa pamamagitan ni propetang Daniel, na nakatayo sa isang banal na lugar[b]—unawain ito ng bumabasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kasuklam-suklam na bagay na nagdudulot ng pagkatiwangwang” o “ang mapangwasak na kasuklam-suklam na bagay,” bilang alusyon sa Daniel.
    reason: lexical_alternative
  - marker: b
    text: O “sa banal na lugar,” ayon sa mas tradisyonal na salin.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Kaya, kapag
  rationale: Ipinapakita ng “kaya” ang kaugnayan sa naunang pahayag, at natural na inilalahad ng “kapag” ang pangyayaring inaasahan sa hinaharap.
- source_word: ἴδητε
  choice: nakita ninyo
  rationale: Tuwirang salin ng pandiwang ὁράω; pinananatili rin ang maramihang kausap.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ang kasuklam-suklam na bagay ng pagkawasak
  rationale: Pinananatili ang di-tiyak na ugnayan ng genitive at ang alusyon sa Daniel, sa halip na ipasiya agad kung ang bagay ang sanhi ng pagkawasak o inilalarawan bilang mapangwasak.
- source_word: τὸ ῥηθὲν
  choice: na binanggit
  rationale: Natural sa Filipino para sa isang bagay na naunang sinabi o ipinahayag sa propesiya.
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: sa pamamagitan ni propetang Daniel
  rationale: Pinananatili ng “sa pamamagitan” ang instrumental na diwa ng διά; ang “propetang Daniel” ay natural na ayos sa makabagong Filipino.
- source_word: ἑστὸς
  choice: na nakatayo
  rationale: Tuwirang inililipat ang perpektong participle ng ἵστημι nang hindi ipinapalagay kung ito ay tao, larawan, o ibang bagay.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: sa isang banal na lugar
  rationale: Sinasalamin ng “isang” ang kawalan ng pantukoy sa Griyego, habang hindi itinatanggi ang posibleng pagtukoy sa templo.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: unawain ito ng bumabasa
  rationale: Natural at maikli itong paanyaya sa mambabasa na unawain ang pahiwatig, at pinananatili ang puwersa ng pautos.
theological_decisions:
- issue: Ang katiyakan o definiteness ng τόπῳ ἁγίῳ at ang posibleng tiyak na pagtukoy sa templo
  choice: sa isang banal na lugar
  alternative: sa banal na lugar
  rationale: Walang pantukoy ang pariralang Griyego, kaya hindi ginagawang tahasang templo ang lugar sa pangunahing teksto. Gayunman, kinikilala sa talababa ang tradisyonal at posibleng kontekstuwal na pagbasa.
- issue: Ang kahulugan ng Danielikong pariralang βδέλυγμα τῆς ἐρημώσεως
  choice: ang kasuklam-suklam na bagay ng pagkawasak
  alternative: ang kasuklam-suklam na bagay na nagdudulot ng pagkawasak; ang mapangwasak na kasuklam-suklam na bagay
  rationale: Pinananatili ng pangunahing salin ang anyong genitive at ang teolohikal na tensiyon ng alusyon sa Daniel, sa halip na tukuyin nang walang katiyakan ang eksaktong ugnayan ng kasuklam-suklam na bagay at ng pagkawasak.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan, ngunit pinananatili ang apokaliptikong parirala at ang pagiging parentetikal ng huling utos. Ginamit ang “kasuklam-suklam na bagay” upang maging malinaw na pangngalan ang βδέλυγμα, at iniwasan ang pagtukoy sa referent bilang tao o rebulto.
