  to: Kaya, kapag nakita ninyo ang kasuklam-suklam na bagay ng pagkatiwangwang[a] na binanggit sa pamamagitan ni propetang Daniel, na nakatayo sa isang banal na lugar[b]—unawain ito ng bumabasa.
  rationale: Pinalitan ang “pagkawasak” ng “pagkatiwangwang” upang mas tapat na maipahayag ang ἐρήμωσις at ang Danielikong pahiwatig, nang hindi nilulutas ang pinagtatalunang eksaktong ugnayan ng parirala. Inayos din ang pangwakas na bantas ng parentetikal na utos. Hindi binago ang di-tiyak na “isang banal na lugar,” ang impersonal na “na nakatayo,” o ang puwersang pautos ng ὁ ἀναγινώσκων νοείτω.
