  naturalness: Malinaw at makabago ang salin. Inayos ang huling parentetikal na utos upang hindi magtapos sa nakalilitong pambukas/pansarang gitling at upang maging likas ang daloy sa Filipino.
  terminology: Ang “kasuklam-suklam na bagay” ay angkop para sa βδέλυγμα at hindi nagpapasya sa referent. Ang “pagkatiwangwang” ay mas tumpak para sa ἐρήμωσις at pinananatili ang pormal at alusyong-Daniel na parirala.
