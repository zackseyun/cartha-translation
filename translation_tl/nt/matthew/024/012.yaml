  source_fidelity: 'Tumpak ang pangunahing salin: ang διὰ τὸ πληθυνθῆναι ay naipahahayag bilang sanhi, ang ἀνομία bilang “pagsuway sa kautusan,” at ang ψυγήσεται bilang metaporikong “lalamig.” Ang “ng marami” ay maingat na pinananatiling hindi tiyak ang saklaw ng τῶν πολλῶν.'
