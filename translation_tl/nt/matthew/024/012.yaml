  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: tl
  text: At dahil lalaganap ang pagsuway sa kautusan, lalamig ang pag-ibig ng marami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: dahil lalaganap
  rationale: Ang διά kasama ng articular infinitive ay nagsasaad ng sanhi. Pinananatili ng pandiwang “lalaganap” ang pagdami o paglawak na nakatuon sa hinaharap at natural ito sa modernong Tagalog.
- source_word: ἀνομίαν
  choice: pagsuway sa kautusan
  rationale: Tumutukoy ang ἀνομία sa paglabag o kawalang-pakundangan sa kautusan, lalo na sa kautusan ng Diyos. Mas malinaw ito sa karaniwang mambabasa kaysa “kawalan ng kautusan,” at mas tiyak kaysa “kasamaan.”
- source_word: ψυγήσεται
  choice: lalamig
  rationale: Pinananatili ng “lalamig” ang metapora ng paglamig ng damdamin o katapatan at natural itong pakinggan sa Tagalog.
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang tuwiran at karaniwang katumbas ng ἀγάπη.
- source_word: τῶν πολλῶν
  choice: ng marami
  rationale: Pinananatili nito ang malawak ngunit hindi tiyak na saklaw ng parirala nang hindi ipinapalagay na tumutukoy ito sa karamihan o sa isang partikular na grupo.
theological_decisions:
- issue: Saklaw ng “pag-ibig ng marami”
  choice: Hindi tinukoy kung sino ang “marami.”
  alternative: “pag-ibig ng mga mananampalataya” o “pag-ibig ng mga tao sa lipunan”
  rationale: Hindi tahasang kinikilala ng τῶν πολλῶν ang grupo. Pinananatili ng salin ang sadyang hindi tiyak na saklaw at hindi nag-aangkat ng makitid na interpretasyong teolohikal.
- issue: Ahensiya sa paglaganap ng pagsuway
  choice: “lalaganap ang pagsuway sa kautusan”
  alternative: “pararamihin ang pagsuway sa kautusan”
  rationale: Bagaman pasibo ang πληθυνθῆναι sa anyo, hindi tinutukoy ng Griyego ang gumagawa. Ang likas na Tagalog na “lalaganap” ay hindi rin nagdaragdag ng tahasang ahensiya.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kautusan” upang panatilihin ang ugnayan ng ἀνομία sa batas nang hindi nagiging sobrang teknikal; iniwasan ang mas kolokyal na “mawawalan ng gana” at ang tradisyonal ngunit di-gaanong tiyak na “kasamaan.”
