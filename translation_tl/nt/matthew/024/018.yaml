  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: tl
  text: At ang nasa bukid ay huwag nang bumalik para kunin ang kanyang balabal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang damit” o “kanyang panlabas na kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: ang nasa bukid
  rationale: Likas sa modernong Tagalog ang substantibong pariralang ito, nananatiling isahan at pangkalahatan, at hindi nililimitahan ang tinutukoy sa lalaki.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: huwag nang bumalik
  rationale: Ipinapahayag nito ang mariing pagbabawal sa agarang konteksto. Natural sa Tagalog ang “bumalik,” at ang “nang” ay angkop na nagpapahiwatig na huwag na siyang magbalik mula sa kanyang pag-alis.
- source_word: ἆραι
  choice: para kunin
  rationale: Ipinapakita ng pariralang ito ang layunin ng pagbabalik at tuwirang katumbas ng gamit ng infinitive na ἆραι sa konteksto.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: ang kanyang balabal
  rationale: Ang ἱμάτιον ay karaniwang tumutukoy sa panlabas na kasuotan o balabal. Mas tiyak at angkop sa tagpo ng agarang pagtakas ang “balabal” kaysa sa malawak na “damit.”
theological_decisions:
- issue: Kasariang ipinahihiwatig ng substantibong panlalaking artikulo
  choice: ang nasa bukid
  alternative: ang lalaking nasa bukid
  rationale: Bagaman panlalaki ang anyong gramatikal sa Griyego, pangkalahatan ang tinutukoy sa babalang ito. Iniiwasan ng salin na limitahan ang utos sa mga lalaki habang pinananatili ang isahang representatibong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinili ang “ang nasa bukid” para sa natural at inklusibong pagtukoy, at “huwag nang bumalik” para maihatid ang kagyat at mariing pagbabawal.
