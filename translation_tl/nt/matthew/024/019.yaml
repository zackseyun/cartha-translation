  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: tl
  text: Ngunit sa aba ng mga nagdadalang-tao at ng mga nagpapasuso sa mga araw na iyon!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: kaawa-awa
  rationale: Likas sa makabagong Tagalog bilang bulalas ng matinding habag at kapahamakang sasapitin; pinananatili nito ang bigat ng propetikong οὐαί nang hindi nagiging lipas o di-natural ang pananalita.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagbibigay ng banayad na paglipat at pagsalungat kaugnay ng naunang babala.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ang mga nagdadalang-tao
  rationale: Natural at malinaw na salin ng idyomang Griyego na nangangahulugang buntis, habang pinananatili ang tinutukoy ng pambabaeng anyo.
- source_word: ταῖς θηλαζούσαις
  choice: ang mga nagpapasuso
  rationale: Tuwirang ipinahahayag ang pagpapasuso ng sanggol na likas nang nauunawaan sa pandiwang Griyego, nang hindi na kailangang idagdag ang layon.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: sa mga araw na iyon
  rationale: Karaniwan, malinaw, at tapat na temporal na parirala sa makabagong Tagalog.
theological_decisions:
- issue: Tinutukoy ng mga pambabaeng pang-uri/pandiwang μετοχή
  choice: Isinalin bilang “mga nagdadalang-tao” at “mga nagpapasuso,” nang hindi tahasang idinaragdag ang “mga babae.”
  alternative: “mga babaeng nagdadalang-tao” at “mga babaeng nagpapasuso”
  rationale: Malinaw na babae ang tinutukoy ng mga pambabaeng anyong Griyego, ngunit likas at sapat sa Tagalog ang mga pariralang pinili. Hindi nito inililihis ang diin mula sa kanilang matinding kahinaan sa mga araw na iyon.
- issue: Lakas ng οὐαί bilang bulalas
  choice: “kaawa-awa …!”
  alternative: “sa aba ng …!”
  rationale: Ang “sa aba” ay maaaring marinig bilang paghatol o sumpa, samantalang sa konteksto ay nangingibabaw ang dalamhati sa hirap na sasapitin. Ang “kaawa-awa” ay nagpapanatili ng matinding panaghoy at habag.
translation_notes:
  register: Makabago, dignified, at madaling maunawaan. Ginamit ang “nagdadalang-tao” sa halip na mas kolokyal na “buntis,” at “nagpapasuso” bilang natural at maikli ngunit tiyak na katumbas ng θηλαζούσαις.
