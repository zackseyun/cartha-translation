  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: tl
  text: At maraming bulaang propeta ang lilitaw[a] at ililigaw nila ang marami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibabangon sila.”
    reason: lexical_alternative
  - marker: b
    text: O “lilinlangin nila ang marami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: maraming
  rationale: Likas at tuwirang katumbas ng pang-uring nagsasaad ng malaking bilang.
- source_word: ψευδοπροφῆται
  choice: bulaang propeta
  rationale: Karaniwang katawagang biblikal sa mga propetang huwad o mapanlinlang; malinaw at pamilyar sa modernong Filipino.
- source_word: ἐγερθήσονται
  choice: lilitaw
  rationale: Sa konteksto, tumutukoy sa paglitaw o pagbangon ng mga mapanlinlang na tauhan. Natural sa Filipino at hindi nagpapahiwatig ng pagkabuhay na muli.
- source_word: πλανήσουσιν
  choice: ililigaw
  rationale: Pinananatili ang larawan ng pagpapalihis sa tamang landas at ang malawak na saklaw ng pandiwa—maaaring doktrinal, moral, o espirituwal ang pagkaligaw.
- source_word: πολλούς
  choice: ang marami
  rationale: Tuwirang layon ng pandiwa at malapit sa payak na di-tiyak na pagtukoy ng Griyego sa maraming tao.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang payak na koordinasyon at pinagsama-samang diin ng dalawang pangyayari.
theological_decisions:
- issue: Saklaw ng panlilinlang sa πλανήσουσιν
  choice: Isinalin bilang “ililigaw” nang hindi tinutukoy kung doktrinal, moral, o eskatolohikal ang paraan o saklaw.
  alternative: “lilinlangin,” na higit na nagtatampok sa pandaraya kaysa sa larawan ng paglihis sa landas.
  rationale: Malawak ang kahulugan ng Griyegong pandiwa. Pinananatili ng “ililigaw” ang metapora at hindi nilulutas ang teolohikal na tensiyong hindi nililinaw ng talata.
- issue: Diatesis ng ἐγερθήσονται
  choice: Ginamit sa pangunahing teksto ang idyomatikong “lilitaw.”
  alternative: “ibabangon,” na mas tahasang nagpapakita ng anyong balintiyak ngunit maaaring magpahiwatig na may partikular na ahenteng nagbangon sa kanila.
  rationale: Ang konteksto ay tungkol sa paglitaw ng mga bulaang propeta. Iniiwasan ng pangunahing salin ang di-kinakailangang pahiwatig tungkol sa pagkabuhay na muli o sa pagkakakilanlan ng ahente, habang itinatala sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang pamilyar na katawagang “bulaang propeta” at ang metaporikal na “ililigaw,” habang inilagay sa mga talababa ang mahahalagang alternatibong leksikal.
