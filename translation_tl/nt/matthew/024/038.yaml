  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: tl
  text: Sapagkat kung paanong sa mga araw bago ang baha, ang mga tao ay kumakain at umiinom, nag-aasawa at ibinibigay sa pag-aasawa[a], hanggang sa araw na pumasok si Noe sa arka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-aasawa at nagbibigay ng iba sa pag-aasawa.” Magkaiba ang mga pandiwang Griyego na γαμοῦντες at γαμίζοντες; ang ikalawa ay maaaring tumukoy sa pagbibigay ng isang tao sa pag-aasawa o sa pagiging ibinigay sa pag-aasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili nito ang paliwanag na diwa ng γάρ at ang paghahambing ng ὡς, habang natural na iniuugnay ang talata sa nauna.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: ang mga tao ay kumakain at umiinom
  rationale: Ipinahahayag ng imperpektong periprastiko ang nagpapatuloy na karaniwang gawain. Ginawang tahasan ang likas na paksa sa Filipino upang maging malinaw at natural.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: sa mga araw bago ang Baha
  rationale: Malinaw na panahong parirala ito. Ang malaking titik sa “Baha” ay tumutukoy sa natatanging baha sa salaysay ni Noe.
- source_word: γαμοῦντες
  choice: nag-aasawa
  rationale: Karaniwan at dignidad na katumbas ng pag-aasawa, at pinananatili ang pagkakaiba nito sa kasunod na pandiwa.
- source_word: γαμίζοντες
  choice: nagpapapag-asawa
  rationale: Ipinahihiwatig nito ang pagpapakasal o pagbibigay ng iba sa pag-aasawa, sa halip na ipagsama ang kahulugan nito sa γαμοῦντες.
- source_word: ἄχρι ἧς ἡμέρας
  choice: hanggang sa araw na
  rationale: Natural na Filipino para sa hangganang panahong itinatakda ng parirala.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: pumasok si Noe sa daong
  rationale: Tapat sa payak at tiyak na kilos ng aoristo. Ang “daong” ay kinikilalang terminong Filipino para sa sasakyang-dagat ni Noe at pinananatili ang ugnay sa Genesis.
theological_decisions:
- issue: Kung ang mga gawaing binanggit ay dapat ilarawang makasalanang pagpapakalabis o karaniwang buhay na nagpapatuloy bago ang paghuhukom
  choice: Inilahad nang walang dagdag na negatibong kulay ang pagkain, pag-inom, at pag-aasawa.
  alternative: Gumamit ng mga salitang nagpapahiwatig ng labis na pagpapakasasa o hayagang kapabayaan.
  rationale: Ang mga participle sa Griyego ay tumutukoy sa karaniwang gawain at walang tahasang moral na panuring. Sa konteksto, binibigyang-diin ang pagpapatuloy ng normal na buhay bago ang biglang pangyayari, kaya hindi nagdagdag ng hatol na wala sa mismong pananalita.
- issue: Ang saklaw ng γαμίζοντες
  choice: Pinanatili sa pangunahing teksto ang diwang aktibo na “nagpapapag-asawa,” na may talababa para sa alternatibong anyo.
  alternative: “ipinag-aasawa” o “nag-aasawa” lamang
  rationale: Maaaring tumukoy ang pandiwa sa pagbibigay ng isang tao sa pag-aasawa, at sa ilang pagbasa ay sa pagiging ibinigay sa pag-aasawa. Pinananatili ng talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Sapagkat kung paanong” upang mapanatili ang paliwanag at paghahambing, at “daong” bilang nakikilalang terminong biblikal. Hindi nilagyan ng pahiwatig ng pagpapakalabis ang mga karaniwang gawain.
