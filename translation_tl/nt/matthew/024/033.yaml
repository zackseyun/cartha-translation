review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: naipapakita ang paghahambing sa halimbawa ng puno ng igos, ang kondisyon na “kapag nakita ninyo,” ang saklaw na “lahat ng ito,” at ang di-hayag na simuno ng ἐγγύς ἐστιν. Gayunman, ang “dapat ninyong malaman” ay nagdaragdag ng modal na “dapat/ought to” na wala sa γινώσκετε, na isang tuwirang pangmaramihang pautos.'
  naturalness: Natural at malinaw ang “kapag nakita ninyo ang lahat ng ito” at ang walang-simunong “malapit na.” Mas tuwiran at mas angkop sa register ng pangaral ang “alamin ninyo” kaysa “dapat ninyong malaman.” Ang “Gayundin kayo” ay mas payak at likas kaysa sa magkapatong na “Gayundin naman kayo.”
  terminology: Wasto ang “mga pintuan” para sa maramihang θύραις. Wasto ring iwang walang hayag na simuno ang pangunahing teksto upang huwag pagpasyahan kung ang tinutukoy ay isang tao o isang pangyayari. Pinananatili ng talababa ang dalawang pangunahing posibilidad nang hindi nagtatakda ng interpretasyong teolohikal.
  issues:
  - severity: medium
    issue: Ang “dapat ninyong malaman” ay nagdaragdag ng modal na kahulugang “ought to/should.”
    rationale: Ang γινώσκετε ay imperatibo (“know/recognize”), hindi isang pahayag ng obligasyong “dapat.” Ang dagdag na modal ay bahagyang nagpapalambot at naglilihis sa direktang puwersa ng utos.
  - severity: low
    issue: Ang “Gayundin naman kayo” ay may bahagyang kalabisan sa pagpapalakas.
    rationale: Sapat na ang “Gayundin kayo” upang ihatid ang οὕτως καὶ ὑμεῖς nang mas payak at natural, habang nananatili ang paghahambing at diin sa kausap.
  revised_text: 'Gayundin kayo: kapag nakita ninyo ang lahat ng ito, alamin ninyo na malapit na—nasa mga pintuan na.'
