  rationale: Pinalitan ang “dapat ninyong malaman” ng “alamin ninyo” upang maihatid ang direktang imperatibong γινώσκετε nang walang idinagdag na modal na kahulugan. Pinasimple ang pambungad sa “Gayundin kayo.” Pinanatili ang walang hayag na simuno sa “malapit na,” ang maramihang “mga pintuan,” at ang talababa para sa mga posibleng hayag na simuno.
