  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: tl
  text: 'Gayundin kayo: kapag nakita ninyo ang lahat ng ito, alamin ninyo na malapit na—nasa mga pintuan na.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Gayundin naman kayo
  rationale: Ipinahihiwatig ng οὕτως ang paghahambing sa naunang halimbawa ng puno ng igos, at binibigyang-diin ng καὶ ὑμεῖς ang mga alagad bilang katumbas na mga tagamasid.
- source_word: ὅταν ἴδητε
  choice: kapag nakita ninyo
  rationale: Likas na ipinapahayag nito sa Filipino ang panghinaharap na kalagayang tinutukoy ng ὅταν kasama ng aorist subjunctive, nang hindi nagbibigay ng di-kailangang paulit-ulit na diwa.
- source_word: πάντα ταῦτα
  choice: ang lahat ng ito
  rationale: Pinananatili nito ang kabuuang saklaw ng πάντα at natural na tinutukoy sa Filipino ang maramihang mga bagay o pangyayaring nauna nang binanggit.
- source_word: γινώσκετε
  choice: dapat ninyong malaman
  rationale: Ipinahahayag nito nang natural ang mapag-utos o mapagtagubiling puwersa ng anyo sa konteksto. Iniwasan ang “alamin,” na sa kasalukuyang Filipino ay maaaring mangahulugang magsiyasat upang makatuklas.
- source_word: ἐγγύς ἐστιν
  choice: malapit na
  rationale: Natural sa Filipino ang walang hayag na simuno, kaya napapanatili ang tunay na kalabuan ng Griyego kung ang malapit ay isang tao o isang pangyayari.
- source_word: ἐπὶ θύραις
  choice: nasa mga pintuan na
  rationale: Pinananatili ang maramihang θύραις at ang larawang nagsasaad na napakalapit na nito.
theological_decisions:
- issue: Hindi hayag na simuno ng ἐγγύς ἐστιν
  choice: 'Iwanang walang hayag na simuno: “malapit na”'
  alternative: “malapit na siya” o “malapit na iyon”
  rationale: Walang nakasaad na simuno sa Griyego. Maaaring tumukoy ang pahayag sa Anak ng Tao o sa nalalapit na pangyayari o katuparan. Dahil likas sa Filipino ang pag-aalis ng simuno, napapanatili sa pangunahing teksto ang kalabuan nang hindi pumipili ng isang interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tutuldok upang maayos na iugnay ang paghahambing sa tagubilin, at ang gitling upang mapanatili ang mariing pag-uugnay ng “malapit na” at “nasa mga pintuan na.”
