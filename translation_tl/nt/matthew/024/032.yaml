  terminology: Ang “talinghaga” ay angkop at matatag na katumbas ng παραβολή. Wasto ang “puno ng igos” para sa συκῆ at “tag-araw” para sa θέρος sa kontekstong ito. Hindi ipinapasok ng teksto ang anumang pinagtatalunang simbolikong pagkakakilanlan ng puno ng igos.
