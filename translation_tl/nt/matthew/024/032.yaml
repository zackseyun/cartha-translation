  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: tl
  text: 'Matuto kayo sa talinghaga ng puno ng igos[a]: kapag lumalambot na ang sanga nito at nagsisibol ang mga dahon[b], alam ninyong malapit na ang tag-araw[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aral” o “paglalarawan” sa halip na “talinghaga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naglalabas ng mga dahon.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego na θέρος ay maaaring mangahulugang “tag-araw” at, sa ilang konteksto, panahon ng pag-aani. Dito, higit na angkop ang “tag-araw” dahil sa pana-panahong larawan ng puno ng igos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: sa … ng puno ng igos
  rationale: Ipinahahayag ng ἀπό na ang puno ng igos ang pinagmumulan ng aral. Ang “Matuto kayo sa talinghaga ng puno ng igos” ay likas sa modernong Tagalog at pinananatili ang ugnayang ito nang hindi nagdaragdag ng tahasang temporal na “ngayon” para sa mahinang pang-ugnay na δέ.
- source_word: μάθετε
  choice: Matuto kayo
  rationale: Tuwirang utos ang aorist imperative ng μανθάνω. Ang “Matuto kayo” ay malinaw, kasalukuyan, at hindi inililipat ang diin tungo lamang sa kinalabasang “unawain.”
- source_word: τὴν παραβολήν
  choice: talinghaga
  rationale: Karaniwang katumbas sa wikang biblikal ang “talinghaga” para sa παραβολή at pinananatili nito ang anyo ng isang mapagtuturang paghahalintulad. Nililinaw sa talababa ang mga posibleng katumbas na “aral” at “paglalarawan.”
- source_word: ὅταν ἤδη
  choice: kapag … na
  rationale: Ang “kapag” ay angkop sa pangkalahatang kondisyong temporal ng ὅταν, at ang “na” ay naghahatid ng diwa ng ἤδη na nagsimula na ang nakikitang pagbabago.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: lumalambot na ang sanga nito
  rationale: Ipinakikita ng γένηται ang pagbabago ng kalagayan, at ang ἁπαλός ay tumutukoy sa paglambot o pagiging mura ng bagong usbong. Ang “lumalambot” ay natural at umiiwas sa kalituhan ng salitang “mura.”
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: at nagsisibol ang mga dahon
  rationale: Ang ἐκφύῃ ay nangangahulugang sumibol o maglabas ng bagong tubo. Likas sa Tagalog ang “nagsisibol ang mga dahon” at malinaw ang larawang botanikal.
- source_word: γινώσκετε
  choice: alam ninyo
  rationale: Present indicative na pangmaramihan ito, kaya inilalarawan nito ang karaniwang pagkilala sa palatandaan, hindi isang panibagong utos.
- source_word: ἐγγὺς τὸ θέρος
  choice: malapit na ang tag-araw
  rationale: Sa larawang kaugnay ng puno ng igos, ang θέρος ay pangunahing tumutukoy sa tag-araw. Ang “malapit na” ay likas na katumbas ng ἐγγύς sa kontekstong temporal.
theological_decisions:
- issue: Kahulugan ng larawan ng puno ng igos
  choice: Iniharap bilang isang pana-panahong paghahalintulad tungkol sa pagkilala sa nalalapit na pangyayari mula sa mga palatandaan.
  alternative: Tahasang tukuyin ang puno ng igos bilang sagisag ng Israel, o sabihing isa lamang itong karaniwang halimbawa mula sa kalikasan.
  rationale: Hindi tahasang kinikilala ng talata ang puno ng igos bilang Israel. Pinananatili ng salin ang larawan at ang puwang para sa mas malawak na pagbasa nang hindi ipinapasok sa mismong teksto ang isang pinagtatalunang simbolikong pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo/ninyo” ayon sa mga anyong Griyego. Iniwasan ang labis na teknikal na pananalita at ang paglalagay ng isang tiyak na simbolikong pagkakakilanlan sa puno ng igos.
