  source_fidelity: Tumpak na naipapahayag ng salin ang utos na matuto mula sa larawan ng puno ng igos, ang paglambot ng sanga, pagsibol ng mga dahon, at ang pagkilala na malapit na ang tag-araw. Ang “kapag … na” ay angkop na naghahatid ng pangkalahatang panahong kondisyon ng ὅταν ἤδη, at ang “alam ninyo” ay wastong pahayag, hindi karagdagang utos, para sa γινώσκετε.
