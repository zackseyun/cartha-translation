  naturalness: Hindi natural ang ayos na “pribadong lumapit.” Mas idiomatiko at malinaw sa modernong Filipino ang “lumapit sa kanya nang sarilinan.”
  terminology: Ang “Bundok ng mga Olibo,” “mga alagad,” “tanda,” “pagdating,” at “kapanahunan” ay angkop at nasa dignipikadong modernong rehistro. Pinanatili ng mga talababa ang leksikal na saklaw ng παρουσία at ang alternatibo para sa συντέλεια.
