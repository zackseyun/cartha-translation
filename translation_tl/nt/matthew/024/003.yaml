id: MAT.24.3
reference: Matthew 24:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: tl
  text: Habang nakaupo siya sa Bundok ng mga Olibo, lumapit sa kanya nang sarilinan ang mga alagad at nagtanong, “Sabihin mo sa amin, kailan mangyayari ang mga ito, at ano ang magiging tanda ng iyong pagdating[a] at ng katapusan ng kapanahunan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “presensiya” o “pagdating at pananatili.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kaganapan ng kapanahunan”; ayon sa tradisyon, “katapusan ng mundo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Habang nakaupo siya
  rationale: Ang genitive absolute ay likas na naipapahayag bilang sugnay na temporal; pinananatili ng “habang” ang nagpapatuloy na aspekto ng pagkakaupo.
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: sa Bundok ng mga Olibo
  rationale: Ito ang malinaw at nakaugaliang pangalang heograpiko sa Tagalog.
- source_word: προσῆλθον αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at natural na inilalarawan ang pagkilos ng mga alagad patungo kay Jesus.
- source_word: κατ’ ἰδίαν
  choice: pribadong
  rationale: Maikli at natural na pagpapahayag na sila ay lumapit nang bukod sa iba.
- source_word: λέγοντες· Εἰπὸν ἡμῖν
  choice: at nagtanong, “Sabihin mo sa amin
  rationale: Bagaman literal na “nagsasabi,” ipinakikita ng kasunod na tanong ang tungkulin nito sa salaysay; ang “Sabihin mo sa amin” ay tuwirang katumbas ng utos na Εἰπὸν ἡμῖν.
- source_word: πότε ταῦτα ἔσται
  choice: kailan mangyayari ang mga ito
  rationale: Mas natural sa modernong Tagalog kaysa sa literal na “kailan magiging ang mga ito,” habang pinananatili ang malawak na diwa ng hinaharap.
- source_word: σημεῖον
  choice: tanda
  rationale: Karaniwan at malinaw na katumbas sa kontekstong eskatolohikal.
- source_word: παρουσίας
  choice: pagdating
  rationale: Sa tanong na nakatuon sa hinaharap, malinaw na naihahayag ng “pagdating” ang diwa ng pagdating o pagpapakita, habang inilalagay sa talababa ang leksikal na “presensiya.”
- source_word: συντελείας τοῦ αἰῶνος
  choice: katapusan ng kapanahunang ito
  rationale: Ipinahahayag ang pagtatapos o kaganapan ng kasalukuyang panahon, hindi tahasang ang pagkalipol ng pisikal na mundo. Ang “ito” ay likas sa Tagalog at nililinaw ang tinutukoy na kapanahunan nang hindi lumalampas sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa παρουσία sa pahayag tungkol sa hinaharap
  choice: pagdating
  alternative: presensiya; pagdating at pananatili
  rationale: Maaaring tumukoy ang salita sa pagdating o presensiya. Pinakamalinaw sa tanong na nakatuon sa hinaharap ang “pagdating,” ngunit pinananatili sa talababa ang tunay na lawak ng kahulugan.
- issue: Pagpapakahulugan sa συντελείας τοῦ αἰῶνος
  choice: katapusan ng kapanahunang ito
  alternative: kaganapan ng kapanahunang ito; katapusan ng mundo
  rationale: Ang Griyego ay tumutukoy sa pagtatapos o kaganapan ng isang kapanahunan, hindi tahasang sa pisikal na mundo. Iniiwasan ng pangunahing salin ang higit na matinding kosmolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “pribadong” bilang natural na pang-abay, at “kapanahunan” upang maiba ang αἰών sa pisikal na “mundo.” Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
