  to: Habang nakaupo siya sa Bundok ng mga Olibo, lumapit sa kanya nang sarilinan ang mga alagad at nagtanong, “Sabihin mo sa amin, kailan mangyayari ang mga ito, at ano ang magiging tanda ng iyong pagdating[a] at ng katapusan ng kapanahunan[b]?”
  rationale: Pinalitan ang hindi idiomatikong “pribadong” ng “nang sarilinan” at inalis ang “ito,” na wala sa Griyegong pinagmulan. Hindi binago ang kahulugan, rehistro, mga pangunahing terminong teolohikal, o mga pananda at nilalaman ng talababa.
