base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: tl
  text: Ngunit sumagot siya at sinabi sa kanila, “Hindi ba ninyo nakikita ang lahat ng ito? Katotohanang sinasabi ko sa inyo, walang batong maiiwang nakapatong sa isa pang bato rito na hindi gigibain[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibabagsak.” Maaaring tumukoy ang pandiwang Griyego sa paggiba o pagbaklas ng isang gusali; ang “ibabagsak” ay nagpapanatili ng larawan ng mga batong inaalis mula sa kanilang kinalalagyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya at sinabi
  rationale: Pinananatili ang dalawang pandiwa ng karaniwang Semitikong paraan ng pagpapahayag sa Griyego, ngunit nananatiling natural sa Tagalog.
- source_word: Οὐ βλέπετε
  choice: Hindi ba ninyo nakikita
  rationale: Inihahayag nito ang retorikal na tanong na umaasang sasang-ayon ang mga kausap, habang pinananatili ang literal na diwa ng pagkakita.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Malinaw na tumutukoy sa kabuuan ng mga gusali ng templo na binanggit sa konteksto.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Likas at marangal na pahayag sa modernong Tagalog na nagpapanatili sa mariin at taimtim na bisa ng ἀμήν.
- source_word: οὐ μὴ ἀφεθῇ
  choice: walang maiiwan
  rationale: Ipinahahayag ng οὐ μή kasama ng aorist subjunctive ang mariing pagtanggi; natural na naipapakita ito sa Tagalog sa konstruksiyong “walang maiiwan.”
- source_word: ὧδε
  choice: rito
  rationale: Tuwirang lokatibong pagtukoy sa kinaroroonang nasasakupan ng templo.
- source_word: λίθος ἐπὶ λίθον
  choice: bato ... na nakapatong sa isa pang bato
  rationale: Natural na Tagalog para sa larawang arkitektural ng isang batong nananatili sa ibabaw ng iba.
- source_word: καταλυθήσεται
  choice: ibabagsak
  rationale: Pinananatili ang kongkretong larawan ng mga batong inaalis o ibinabagsak mula sa kanilang kinalalagyan, sa halip na gumamit lamang ng mas pangkalahatang salitang “wawasakin.”
theological_decisions:
- issue: Saklaw at diin ng hula ni Jesus tungkol sa templo
  choice: Isinalin bilang kongkretong hula ng ganap na paggiba sa gusali.
  alternative: Unawain ito bilang pangunahing simbolikong pahayag tungkol sa paghatol o itali sa isang tiyak na sistemang eskatolohikal.
  rationale: Kongkreto at arkitektural ang pananalita tungkol sa mga bato. Pinananatili ng salin ang puwersang iyon nang hindi nagdaragdag ng balangkas na teolohikal na wala mismo sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang retorikal na tanong, ang taimtim na pormulang pambungad, at ang konkretong larawan ng lubusang paggiba.
