  to: Ngunit sumagot siya at sinabi sa kanila, “Hindi ba ninyo nakikita ang lahat ng ito? Katotohanang sinasabi ko sa inyo, walang batong maiiwang nakapatong sa isa pang bato rito na hindi gigibain[a].”
  rationale: Pinalitan ang pangunahing salin ng καταλυθήσεται ng “gigibain” upang maipahayag nang mas tumpak ang demolisyon ng estruktura, at inayos ang ayos ng pangungusap para sa mas malinaw at natural na Tagalog. Pinanatili ang mariing ganap na saklaw ng hula, ang retorikal na tanong, at ang solemne nitong rehistro.
