  naturalness: Nauunawaan ang draft, ngunit medyo mabigat at posibleng lumabo ang saklaw ng “na hindi ibabagsak.” Ang “Walang batong maiiwang nakapatong sa isa pang bato rito na hindi gigibain” ay mas likas at malinaw sa modernong Filipino Tagalog.
