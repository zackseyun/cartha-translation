translation:
  language: tl
  text: Ngunit ang magtitiis hanggang sa wakas ay maliligtas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang katapusan.”
    reason: lexical_alternative
  - marker: b
    text: O “maililigtas.” Maaaring tumukoy ang salitang Griyego sa kaligtasan o sa pagliligtas mula sa panganib; pinanatili rito ang mas malawak na pananalita sapagkat hindi hinihingi ng konteksto na limitahan ang kahulugan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: ang magtitiis
  rationale: Ang artikulo at aorist participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang taong nananatiling matatag. Natural sa modernong Tagalog ang “ang magtitiis,” at hindi nito nililimitahan ang tinutukoy ayon sa kasarian.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng banayad na pagsalungat sa naunang babala tungkol sa pagtalikod at pagkamuhi; malinaw at marangal na naihahayag ito ng “Ngunit.”
- source_word: ὑπομείνας (ὑπομένω)
  choice: magtitiis
  rationale: Saklaw ng pandiwa ang pananatiling matatag sa ilalim ng pagsubok o pag-uusig. Ang “magtitiis” ay tuwiran, karaniwan, at hindi labis na nagpapakahulugan.
- source_word: εἰς τέλος
  choice: hanggang wakas
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy hanggang sa hantungan. Ang “hanggang wakas” ay natural at pinananatili ang posibleng pagtukoy sa itinakdang wakas, hindi lamang sa pagtatapos ng personal na buhay.
- source_word: οὗτος
  choice: ay
  rationale: Ang οὗτος ay resumptive at nagbibigay-diin sa taong naunang tinukoy. Sa Tagalog, natural nang naipapahiwatig ang diin sa hulma na “ang magtitiis … ay”; ang tahasang “ang taong iyon” ay magiging mabigat at di-likas.
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Maaaring tumukoy ang future passive ng σῴζω sa pagliligtas o pagligtas mula sa panganib. Pinananatili ng “maliligtas” ang malawak na saklaw nito sa kontekstong eskatolohikal.
theological_decisions:
- issue: Saklaw ng σωθήσεται sa konteksto ng pagtitiis hanggang wakas
  choice: maliligtas
  alternative: maililigtas mula sa panganib; tatanggap ng pangwakas na kaligtasan
  rationale: Hindi tahasang nililinaw ng talata kung ang tinutukoy ay pangwakas na kaligtasan, pagliligtas sa kapighatian, o kapwa. Ang “maliligtas” ay nagpapanatili sa sinadyang lawak at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “magtitiis” sa halip na mas teknikal na “magpupursigi,” at iniwasan ang mabigat na literal na pag-uulit ng οὗτος. Nasa pangunahing teksto ang lahat ng panandang talababa.
