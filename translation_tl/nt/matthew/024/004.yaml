  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanila, “Mag-ingat kayo na huwag kayong iligaw[a] ng sinuman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “linlangin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Sumagot ... sa kanila
  rationale: Pinagsama sa natural na Filipino ang karaniwang Griyegong pormulang ‘sumagot at nagsabi sa kanila,’ habang pinananatili ang diwang tugon at ang pagpapahayag ni Jesus.
- source_word: Βλέπετε
  choice: Mag-ingat kayo
  rationale: Sa kontekstong ito, ang pangmaramihang pautos ay nangangahulugang maging mapagbantay o mag-ingat, hindi lamang literal na tumingin.
- source_word: μή τις
  choice: na huwag ... ng sinuman
  rationale: 'Natural nitong ipinapahayag sa Filipino ang pag-iwas na hinihingi ng μή kasunod ng pautos: dapat nilang bantayang walang taong makapaglihis sa kanila.'
- source_word: πλανήσῃ
  choice: iligaw
  rationale: Pinananatili ng ‘iligaw’ ang larawan ng paglihis mula sa tamang landas at saklaw rin nito ang panlilinlang; hindi nito nililimitahan ang babala sa maling pagkaunawa lamang.
theological_decisions:
- issue: Saklaw ng babala sa πλανήσῃ
  choice: Babala laban sa pagkaligaw o paglihis sa tamang landas
  alternative: Babala laban sa panlilinlang, na isasaling ‘linlangin’
  rationale: Mas malawak ang maaaring saklaw ng πλανάω kaysa intelektuwal na panlilinlang lamang. Pinananatili ng ‘iligaw’ ang tensiyon sa pagitan ng pagiging nalinlang at ng aktuwal na paglihis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang ‘kayo’ ayon sa Griyego at iniwasan ang matigas na literal na ‘sumagot at nagsabi.’
