  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: tl
  text: Sa panahong iyon, dalawang lalaki ang nasa bukid; ang isa ay kukunin[a] at ang isa ay iiwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isasama.” Hindi tinutukoy ng pandiwa mismo kung ang pagkuha ay para sa pagliligtas o para sa paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Sa panahong iyon
  rationale: Nag-uugnay ito sa naunang kontekstong tungkol sa pagdating ng Anak ng Tao; natural at malinaw sa modernong Tagalog.
- source_word: δύο ἔσονται
  choice: dalawang lalaki ang nasa
  rationale: Bagaman 'dalawa' lamang ang tahasang nasa parirala, panlalaki ang kasunod na εἷς ... εἷς at katambal nito ang eksena ng mga babae sa susunod na talata; kaya ang 'dalawang lalaki' ay tumpak sa kasarian at natural sa Tagalog.
- source_word: ἐν τῷ ἀγρῷ
  choice: sa bukid
  rationale: Direkta at karaniwang salin ng lokatibong parirala.
- source_word: παραλαμβάνεται
  choice: kukunin
  rationale: Ginawang panghinaharap ayon sa konteksto. Pinananatili ng 'kukunin' ang kalabuan kung ang pagkuha ay para sa pagliligtas o paghatol.
- source_word: ἀφίεται
  choice: iiwan
  rationale: Direkta at hindi labis na interpretatibong salin; iniiwasan ang mas mabigat o teolohikal na kargadong mga anyo gaya ng 'pababayaan' o 'iiwan sa likuran.'
theological_decisions:
- issue: Kung ang παραλαμβάνεται ay nagpapahiwatig ng pagliligtas o paghatol
  choice: Neutral na 'kukunin' sa pangunahing teksto
  alternative: '''isasama'' o isang saling tahasang nagpapahiwatig na kukunin sa paghatol'
  rationale: Hindi tiyak sa pandiwa mismo kung para sa pagliligtas o paghatol ang pagkuha. Pinananatili ng salin ang tunay na teolohikal na tensiyon ng konteksto.
- issue: Kung dapat tahasang tukuyin na mga lalaki ang dalawa
  choice: dalawang lalaki
  alternative: dalawa
  rationale: Ang panlalaking anyo ng εἷς ... εἷς at ang kaagapay na halimbawa ng mga babae sa kasunod na talata ay sumusuporta sa eksenang may dalawang lalaki, nang hindi ginagawang pangkalahatang neutral ang pagkakaiba sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang panghinaharap na mga pandiwa upang maging natural sa Tagalog at maipakita ang hinaharap na tagpo, bagaman present passive ang anyong Griyego sa isang panghinaharap na konteksto.
