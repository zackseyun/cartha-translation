  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: tl
  text: Sapagkat babangon ang isang bansa laban sa ibang bansa[a], at ang isang kaharian laban sa ibang kaharian, at magkakaroon ng mga taggutom at mga lindol sa iba’t ibang lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babangon laban sa isang bansa.” Ipinahihiwatig ng idyomang Griyego ang pagsiklab ng alitan sa pagitan ng mga bayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa sari-saring lugar” o “sa lugar-lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: babangon
  rationale: Ang anyong panghinaharap na passive/middle ng ἐγείρω sa idyomang ito ay tumutukoy sa pagbangon laban sa iba o sa pagsiklab ng alitan. Pinananatili ng “babangon” ang larawan ng orihinal nang hindi nagdaragdag ng tahasang banal na sanhi.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag na kaugnay ng naunang pahayag. Malinaw at marangal na panandang pangdiskurso ang “Sapagkat.”
- source_word: ἔθνος ἐπὶ ἔθνος
  choice: ang isang bansa laban sa ibang bansa
  rationale: Ang ἔθνος ay tumutukoy rito sa malalaking pangkat ng mamamayan o bansang nagkakasalungatan, at ang ἐπί na may accusative ay may diwang “laban sa.” Nililinaw ng “isang … ibang” ang ugnayan sa natural na Filipino.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: ang isang kaharian laban sa ibang kaharian
  rationale: Ang βασιλεία ay tumutukoy sa kaharian bilang nasasakupang pampolitika at kapantay ng “bansa” sa paralelismo.
- source_word: ἔσονται
  choice: Magkakaroon ng
  rationale: Eksistensiyal ang gamit ng εἰμί; natural sa Filipino ang “magkakaroon ng” upang ipahayag na mangyayari o lilitaw ang mga sumusunod.
- source_word: λιμοὶ
  choice: mga taggutom
  rationale: Tumutukoy ang pangmaramihang ουσιαστικό sa matitinding kakulangan ng pagkain. Ang “mga taggutom” ang tuwiran at karaniwang katumbas.
- source_word: σεισμοὶ
  choice: mga lindol
  rationale: Sa kontekstong ito, malinaw na mga lindol ang tinutukoy ng σεισμοί.
- source_word: κατὰ τόπους
  choice: sa iba’t ibang lugar
  rationale: Distributibo ang parirala at nagsasaad ng mga pangyayaring magaganap sa maraming lokasyon, hindi sa iisang tiyak na lugar.
theological_decisions:
- issue: Saklaw ng ἔθνος sa pahayag tungkol sa pangwakas na alitan
  choice: bansa
  alternative: bayan o pangkat ng mga tao
  rationale: Kaagapay ito ng “kaharian” at tumutukoy sa malawakang kaguluhang panlipunan at pampolitika. Iniiwasan ng “bansa” ang di-kinakailangang pagpapakitid nito sa etnisidad o sa mga Hentil lamang.
- issue: Diwa ng future passive/middle na ἐγερθήσεται
  choice: babangon laban sa
  alternative: lalaban sa; ibabangon laban sa
  rationale: Inilalarawan ng idyoma ang pagsiklab ng alitan. Hindi ginawang tahasang passive sa Filipino upang hindi magpahiwatig ng isang kumikilos na sanhi—lalo na ng banal na sanhi—na hindi naman tahasang binanggit sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang paralelismo ng “bansa … bansa” at “kaharian … kaharian,” habang ginamit ang “isang … ibang” para sa natural at malinaw na daloy. Inilagay ang ikalawang talababa sa “iba’t ibang lugar,” ang pariralang aktuwal nitong ipinaliliwanag.
