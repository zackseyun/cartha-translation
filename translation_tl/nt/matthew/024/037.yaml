reference: Matthew 24:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: tl
  text: Sapagkat kung paano ang mga araw ni Noe, magiging gayon din ang pagdating[a] ng Anak ng Tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “presensiya.” Ang salitang Griyego ay maaaring tumukoy sa presensiya o pagdating; dito, tumutukoy ito sa panghinaharap na pagdating ng Anak ng Tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: kung paano ... magiging gayon din
  rationale: Pinananatili ang magkaugnay na paghahambing na “kung paano ... gayon din,” habang likas na naipapahayag sa Filipino ang aspektong hinaharap.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang sinabi.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: ang mga araw ni Noe
  rationale: Tuwirang pinananatili ang larawang nasa Griyego at ang karaniwang anyo ng pangalan sa Filipino.
- source_word: ἔσται
  choice: magiging
  rationale: Malinaw na ipinapahayag ang hinaharap na anyo ng pandiwang εἰμί nang hindi dinaragdagan ang kahulugan nito.
- source_word: παρουσία
  choice: pagdating
  rationale: Sa kontekstong ito, malinaw at natural na tumutukoy ito sa panghinaharap na pagdating ng Anak ng Tao; inilalahad sa talababa ang posibleng kahulugang “presensiya.”
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ng Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo ni Jesus at ang kaugnayan nito sa wikang biblikal, lalo na sa Daniel.
theological_decisions:
- issue: Kahulugan ng παρουσία sa pahayag tungkol sa wakas
  choice: pagdating
  alternative: presensiya
  rationale: Ang “pagdating” ang pinakanatural na salin sa panghinaharap na kontekstong ito, ngunit hindi itinatago ang mas malawak na saklaw ng salitang Griyego; ang “presensiya” ay inilagay sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino. Pinanatili ang bahagyang eliptikal na paghahambing ng Griyego sa halip na idagdag ang interpretibong “kung ano ang nangyari,” at ginamit ang “magiging gayon din” upang maging malinaw at maayos ang pangungusap.
