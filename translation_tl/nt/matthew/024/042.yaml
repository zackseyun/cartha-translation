id: MAT.24.42
reference: Matthew 24:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: tl
  text: Kaya manatili kayong gising[a], sapagkat hindi ninyo alam kung anong araw darating ang inyong Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patuloy kayong magbantay” o “maging mapagbantay.”
    reason: lexical_alternative
  - marker: b
    text: O “dumarating ang inyong Panginoon.” Pangkasalukuyan ang anyo ng pandiwang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: manatili kayong gising
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng patuloy na pagbabantay. Pinananatili ng salin ang talinghaga ng pagiging gising at natural ito sa modernong Filipino.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita nito na ang utos ay kongklusyon mula sa naunang turo; malinaw at natural ang “Kaya” sa Filipino.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos. Ang “sapagkat” ay malinaw, dignified, at angkop sa kasalukuyang salin ng Kasulatan.
- source_word: οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Tuwirang isinasalin ang negatibong pandiwa ng pagkaalam nang walang idinagdag na katiyakan o paliwanag.
- source_word: ποίᾳ ἡμέρᾳ
  choice: kung anong araw
  rationale: Natural na Filipino para sa pariralang datibo na tumutukoy sa panahong hindi alam; pinananatili nito ang pagiging tiyak sa isang araw.
- source_word: ὁ κύριος ὑμῶν
  choice: ang inyong Panginoon
  rationale: Natural na ayos sa Filipino na pinananatili ang titulo at kapangyarihang ipinahihiwatig ng κύριος, pati ang panghalip na maramihan.
- source_word: ἔρχεται
  choice: darating
  rationale: Bagaman pangkasalukuyan ang anyong Griyego, may hinaharap na diwa ito sa kontekstong eskatolohikal. Ang “darating” ang pinakanatural sa Filipino; inilalahad sa talababa ang literal na alternatibong nagpapanatili sa anyong pangkasalukuyan.
theological_decisions:
- issue: Eskatolohikal na puwersa ng pangkasalukuyang ἔρχεται
  choice: darating
  alternative: dumarating
  rationale: Ang pangkasalukuyang Griyego ay ginagamit sa konteksto ng isang pagdating na inaasahan. Isinasalin itong “darating” para sa natural at malinaw na Filipino, habang itinatala sa talababa ang “dumarating” upang mapanatili ang vividness at tunay na tensiyon ng anyong pangkasalukuyan nang hindi nagtatakda ng mas tiyak na doktrina tungkol sa panahon.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang maramihang “kayo/ninyo/inyong” ayon sa Griyego. Iniwasan ang sobrang teknikal o denominasyonal na pananalita, at inilagay kaagad ang bawat pananda ng talababa sa pangunahing teksto.
