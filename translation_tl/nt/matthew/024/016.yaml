lexical_decisions:
- source_word: τότε
  choice: kung gayon
  rationale: Sa konteksto ng sunod-sunod na tagubilin, ipinahihiwatig nito ang kasunod na pagkilos sa oras na mangyari ang naunang tanda; natural sa Filipino ang “kung gayon” habang nananatili ang temporal na ugnayan.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ang mga nasa Judea
  rationale: Ang artikulo at pariralang pang-ukol ay tumutukoy sa mga taong naroroon sa Judea; maikli at likas sa modernong Filipino ang salin.
- source_word: Ἰουδαίᾳ
  choice: Judea
  rationale: Ito ang karaniwang anyong Filipino ng heograpikong pangalang Ioudaia.
- source_word: φευγέτωσαν
  choice: ay tumakas
  rationale: Ang ikatlong panauhang pangmaramihang pautos ay inihahayag bilang tuwirang utos. Sa Filipino, malinaw at apurahan ang “tumakas” nang hindi na kailangang dagdagan ng “dapat.”
- source_word: ἐπὶ τὰ ὄρη
  choice: patungo sa mga bundok
  rationale: Kasama ng pandiwa ng paggalaw, ang ἐπί na may akusatibo ay nagsasaad ng destinasyon. Pinananatili ng “mga bundok” ang pangmaramihan at lakas ng ὄρη.
theological_decisions:
- issue: Lakas ng pautos sa babalang eskatolohikal
  choice: 'Tuwirang utos: “tumakas”'
  alternative: “dapat tumakas” o “tumakas sila”
  rationale: Ang anyong Griyego ay pautos at apurahan. Ang tuwirang pautos sa Filipino ang pinakamalinaw, nang hindi nagdaragdag ng partikular na pagpapakahulang eskatolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Judea” bilang karaniwang pangalang heograpiko at “patungo sa” upang malinaw ang direksiyon ng pagtakas.
