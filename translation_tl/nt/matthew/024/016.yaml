  text: Sa panahong iyon, ang mga nasa Judea ay dapat tumakas patungo sa mga bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “tumakas sila patungo sa mga bundok.”'
