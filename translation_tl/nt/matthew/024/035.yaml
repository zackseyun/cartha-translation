id: MAT.24.35
reference: Matthew 24:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: tl
  text: Lilipas ang langit at ang lupa, ngunit tiyak na hindi lilipas ang mga salita ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinding-hindi lilipas.” Mariin ang anyo ng pagtanggi sa Griyego (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ang langit at ang lupa
  rationale: Sa eskatolohikal na tambalang ito, tumutukoy ang parirala sa kasalukuyang nilikhang kaayusan, hindi lamang sa nakikitang langit o sa isang partikular na lupain. Likas at malinaw sa Tagalog ang “ang langit at ang lupa.”
- source_word: παρελεύσεται
  choice: lilipas
  rationale: Ipinahahayag dito ng future form ng παρέρχομαι ang paglipas ng kasalukuyang nilikhang kaayusan. Maikli, natural, at marangal ang “lilipas,” at hindi nito ipinapaliwanag nang labis kung paano ito magaganap.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita ng δέ ang matinding pagkakaiba sa pagitan ng paglipas ng langit at lupa at ng hindi paglipas ng mga salita ni Jesus. Malinaw na naihahatid ito ng “ngunit.”
- source_word: οἱ λόγοι μου
  choice: ang mga salita ko
  rationale: Tumutukoy ang λόγοι sa mga pahayag o itinuro ni Jesus. Ang “mga salita ko” ang tuwiran at natural na katumbas sa modernong Tagalog at pinananatili ang malawak na saklaw ng sinabi niya.
- source_word: οὐ μὴ παρέλθωσιν
  choice: tiyak na hindi lilipas
  rationale: Ang οὐ μή na sinusundan ng aorist subjunctive ay mariing pagtanggi. Malinaw na ipinahahayag ng “tiyak na hindi lilipas” ang katiyakan at diin nang hindi gumagamit ng lipas o masalimuot na pananalita.
theological_decisions:
- issue: Ang bigat ng pahayag ni Jesus tungkol sa pananatili ng kanyang mga salita
  choice: 'Isinalin ito bilang isang mariing pagkakaiba: lilipas ang nilikhang kaayusan, ngunit tiyak na hindi lilipas ang mga salita ni Jesus.'
  alternative: Gumamit ng mas mapagpaliwanag na salin na tahasang nagdaragdag ng doktrinal na pahayag tungkol sa banal na awtoridad.
  rationale: Mabigat na mismo ang pahayag ng talata tungkol sa katiyakan at pananatili ng mga salita ni Jesus. Pinananatili ng salin ang bigat na iyon nang hindi nagdaragdag ng doktrinang hindi tahasang binabanggit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang payak na ayos ng pangungusap at ang karaniwang “mga salita ko” sa halip na mas pormal o makalumang pananalita. Inilagay ang talababa sa mariing negatibong parirala na siyang aktuwal na tinutukoy nito.
