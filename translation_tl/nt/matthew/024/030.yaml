id: MAT.24.30
reference: Matthew 24:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: tl
  text: At saka, lilitaw sa langit[a] ang tanda ng Anak ng Tao, at saka mananaghoy ang lahat ng lipi ng daigdig[b], at makikita nila ang Anak ng Tao na dumarating sa ibabaw ng mga ulap ng langit[c], taglay ang kapangyarihan at dakilang kaluwalhatian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa himpapawid.” Ang salitang Griyego ay maaaring mangahulugang “langit” o “himpapawid,” depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “ang lahat ng lipi sa lupain.” Ang salitang Griyego ay maaaring mangahulugang “daigdig” o “lupain.”
    reason: alternative_reading
  - marker: c
    text: Ang pariralang “dumarating sa ibabaw ng mga ulap ng langit” ay umaalingawngaw sa Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: lilitaw
  rationale: Likas at tuwirang salin ng intransitibong diwa na magiging hayag o makikita.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: ang tanda ng Anak ng Tao
  rationale: Pinananatili ang genitibong pagkakabuo at ang tunay na kalabuan kung ito ay tandang kaugnay sa Anak ng Tao o kung siya mismo ang tanda.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Ang 'langit' ay angkop sa mataas at apokaliptikong himig; inilalagay sa talababa ang posibleng kahulugang 'himpapawid.'
- source_word: κόψονται
  choice: mananaghoy
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa matinding pagdadalamhati; malinaw ito nang hindi ipinipilit ang tiyak na kilos na pagdagok sa dibdib.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: ang lahat ng lipi sa buong mundo
  rationale: Ang 'lipi' ay malapit sa φυλαί, samantalang ang 'buong mundo' ay natural na Filipino para sa pangkalahatang saklaw ng γῆ sa kosmiko at apokaliptikong konteksto.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: na dumarating sakay ng mga ulap sa langit
  rationale: Ipinahahayag ng 'sakay ng' ang larawang pagdating sa ibabaw ng mga ulap at pinananatili ang alusyon sa Daniel 7:13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: taglay ang kapangyarihan at dakilang kaluwalhatian
  rationale: Pinananatili ang gramatikal na tuon ng 'dakila' sa kaluwalhatian at nagbibigay ng marangal, natural na Filipino.
theological_decisions:
- issue: Kahulugan ng 'tanda ng Anak ng Tao'
  choice: Pinanatili ang pariralang 'ang tanda ng Anak ng Tao.'
  alternative: Maaaring unawain bilang tandang pag-aari o kaugnay niya, o bilang Anak ng Tao mismo na siyang tanda.
  rationale: Hindi nilulutas ng Griyego ang genitibong kalabuan, kaya hindi ito dapat pasiyahan ng salin.
- issue: Saklaw ng γῆ
  choice: Isinalin bilang 'buong mundo.'
  alternative: Maaaring tumukoy sa 'lupain,' lalo na sa isang pagbabasang nakatuon sa lupain ng Israel.
  rationale: Mas pinapaboran ng kosmiko at apokaliptikong konteksto ang pandaigdig na saklaw, ngunit nananatiling posible ang 'lupain' at itinatala ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang kinikilalang titulong “Anak ng Tao” at pinanatili ang apokaliptikong himig nang hindi gumagamit ng labis na makaluma o denominasyonal na pananalita.
