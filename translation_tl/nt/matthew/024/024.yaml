id: MAT.24.24
reference: Matthew 24:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: tl
  text: Sapagkat lilitaw ang mga huwad na Mesiyas[a] at mga huwad na propeta, at gagawa sila ng mga dakilang tanda at kababalaghan upang iligaw[b], kung maaari[c], maging ang mga hinirang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga huwad na Cristo.” Ginagamit sa Griyego ang titulong Christos; isinalin itong “Mesiyas” dito dahil titulo ang gamit nito, hindi pangalang pantangi.
    reason: alternative_reading
  - marker: b
    text: O, “linlangin.” Maaari ring mangahulugan ang pandiwa na ilayo ang isang tao sa tamang landas, kaya “iligaw” ang ginamit sa teksto.
    reason: lexical_alternative
  - marker: c
    text: O, “kung posible.” Payak na “kung maaari” ang sinasabi ng Griyego; hindi nito tahasang ipinapasiya ang teolohikal na implikasyon ng kundisyon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: lilitaw
  rationale: Sa kontekstong ito, ang anyong pasibo ng ἐγείρω ay tumutukoy sa paglitaw o pagharap ng mga tao sa eksena, hindi sa pagkabuhay na muli. Natural at malinaw sa modernong Tagalog ang “lilitaw.”
- source_word: ψευδόχριστοι
  choice: mga huwad na Mesiyas
  rationale: Titular ang Χριστός dito, kaya pinananatili ng “Mesiyas” ang kontekstong mesiyaniko. Tuwirang isinasalin ng “huwad” ang unlaping ψευδο-.
- source_word: ψευδοπροφῆται
  choice: mga huwad na propeta
  rationale: Tuwiran, karaniwan, at malinaw na salin ng tambalang pangngalan.
- source_word: δώσουσιν
  choice: gagawa sila
  rationale: Bagaman karaniwang nangangahulugang “magbibigay” ang δίδωμι, sa tambalang “mga tanda at kababalaghan” ang idiomatikong diwa ay paggawa o pagpapamalas ng mga ito.
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: mga dakilang tanda at kababalaghan
  rationale: Pinananatili ng “tanda” ang evidensiyal o makahulang saklaw ng σημεῖα, samantalang ipinahahayag ng “kababalaghan” ang kamangha-manghang katangian ng τέρατα.
- source_word: ὥστε πλανῆσαι
  choice: upang iligaw
  rationale: Ang ὥστε na may pawatas ay maaaring magpahiwatig ng layunin o kinalabasan. Sapat na natural ang “upang” sa Tagalog habang hindi kinakailangang ipasiya nang mahigpit ang pagkakaibang iyon.
- source_word: εἰ δυνατὸν
  choice: kung maaari
  rationale: Tuwirang pinananatili nito ang maikli at kondisyunal na pahayag ng Griyego nang hindi dinaragdagan ng tahasang kontrapaktuwal na diwa.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: maging ang mga hinirang
  rationale: Ascensive ang καί dito, kaya “maging.” Ang “mga hinirang” ay malinaw at matatag na katumbas ng ἐκλεκτούς sa kontekstong biblikal.
theological_decisions:
- issue: Paglalarawan sa ψευδόχριστοι
  choice: mga huwad na Mesiyas
  alternative: mga huwad na Cristo
  rationale: Gumaganap bilang titulo ang Χριστός dito, kaya mas malinaw na naihahayag ng “Mesiyas” ang inaangking papel ng mga huwad na tao nang hindi ginagawang pangalang pantangi ang katawagan.
- issue: Lakas ng εἰ δυνατὸν tungkol sa mga hinirang
  choice: kung maaari
  alternative: kung maaari nga sana
  rationale: Hindi tahasang nilulutas ng Griyego kung imposible sa ganap na diwa ang pagkaligaw ng mga hinirang. Pinananatili ng salin ang kondisyunal na pananalita at ang kaugnay na teolohikal na tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sapagkat” upang ipakita ang paliwanag na ugnayan ng γάρ sa naunang pahayag. Iniwasan ang sobrang teknikal o denominasyonal na pananalita, at pinanatili ang kondisyunal na tensiyon ng talata.
