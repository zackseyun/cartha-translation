reference: Matthew 24:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: tl
  text: At isusugo niya ang kanyang mga anghel kasabay ng malakas na tunog ng trumpeta[a], at titipunin nila ang kanyang mga pinili[b] mula sa apat na hangin[c], mula sa isang dulo ng kalangitan hanggang sa kabilang dulo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kasabay ng isang dakilang trumpeta” o “kasabay ng pag-ihip ng trumpeta.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga hinirang.”
    reason: lexical_alternative
  - marker: c
    text: Ang “apat na hangin” ay isang idyomang tumutukoy sa pinakamalalayong dako sa lahat ng direksiyon.
    reason: cultural_note
  - marker: d
    text: Sa Griyego, “mula sa mga dulo ng kalangitan hanggang sa mga dulo ng mga iyon,” isang idyomang nangangahulugang mula sa isang sukdulan hanggang sa kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: isusugo niya
  rationale: Ang pandiwang nasa panghinaharap ay nagpapahayag ng pagpapadala na may atas. Likas at marangal sa Tagalog ang “isusugo” at higit na angkop dito kaysa sa payak na “ipapadala.”
- source_word: ἀγγέλους
  choice: mga anghel
  rationale: Sa kontekstong eskatolohikal, mga makalangit na nilalang ang tinutukoy, hindi mga taong mensahero.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: kasabay ng malakas na tunog ng trumpeta
  rationale: Ipinahihiwatig ng μετά ang pagsabay, at maaaring tumukoy ang parirala sa malakas o dakilang trumpeta o sa tunog nito. Ang pangunahing salin ay natural sa Tagalog at malinaw na tunog ng trumpeta ang kasama sa pagsusugo, habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: ἐπισυνάξουσιν
  choice: titipunin nila
  rationale: Pinananatili ang pangmaramihang simuno—ang mga anghel—at ipinapahayag ng “titipunin” ang pagsasama-sama nang hindi nagiging paulit-ulit.
- source_word: ἐκλεκτούς
  choice: mga pinili
  rationale: Direkta at madaling maunawaan ang “mga pinili,” at hindi nito ipinapasok ang isang partikular na sistematikong paliwanag sa katawagan.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: mula sa apat na hangin
  rationale: Pinananatili ang biblikal na larawan at ang tunay na idyoma sa halip na agad itong gawing “apat na direksiyon.”
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: mula sa isang dulo ng kalangitan hanggang sa kabilang dulo
  rationale: Natural na idyomatikong Tagalog ito para sa kabuuang lawak ng parirala. Ang “kalangitan” ay maaaring kolektibong katawanin ang pangmaramihang οὐρανῶν nang hindi nagiging alanganin ang salin.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ἐκλεκτούς sa eskatolohikal na konteksto
  choice: mga pinili
  alternative: mga hinirang
  rationale: Tinutukoy ng talata ang mga titipunin ngunit hindi nito ipinaliliwanag ang isang mas malawak na sistemang teolohikal. Pinananatili ng “mga pinili” ang payak na leksikal na diwa; inilalagay sa talababa ang tradisyonal na “mga hinirang.”
- issue: Saklaw ng larawan ng pagtitipon
  choice: mula sa apat na hangin, mula sa isang dulo ng kalangitan hanggang sa kabilang dulo
  alternative: mula sa apat na direksiyon ng daigdig
  rationale: Pinananatili ang malawak at kosmikong larawan ng Griyego sa halip na paliitin ito sa isang heograpikong pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at pinanatili ang mga larawang “trumpeta,” “apat na hangin,” at “kalangitan” nang may paliwanag sa mga talababa.
