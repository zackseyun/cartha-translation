  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: tl
  text: Sapagkat marami ang darating sa pangalan ko at magsasabi, “Ako ang Mesiyas[a],” at ililigaw nila ang marami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Cristo.” Ang salitang Griyego ay ὁ χριστός, isang titulong nangangahulugang “ang Pinahiran.”
    reason: Ibinibigay ang tradisyonal na alternatibong salin at nililinaw na titulo ang salitang Griyego.
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Karaniwan at natural na katumbas ng pang-uring nagsasaad ng malaking bilang.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang babala.
- source_word: ἐλεύσονται
  choice: darating
  rationale: Likas na salin ng anyong panghinaharap ng ἔρχομαι sa kontekstong ito.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Pinananatili ang malawak na saklaw ng parirala—maaaring tumukoy sa paggamit, pag-angkin, o pag-apela sa pangalan at awtoridad ni Jesus—nang hindi ito nililimitahan sa iisang paliwanag.
- source_word: λέγοντες
  choice: at magsasabi
  rationale: Natural sa Filipino ang koordinadong pandiwa rito; tapat nitong ipinapakilala ang nilalaman ng kanilang sasabihin nang hindi dinaragdagan ang diwang ‘mag-aangkin.’
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Ako ang Mesiyas
  rationale: Titular ang ὁ χριστός sa pahayag ng mga nagpapanggap; malinaw na ipinahahayag ng ‘Mesiyas’ ang pag-angkin sa mesiyanikong pagkakakilanlan.
- source_word: πλανήσουσιν
  choice: ililigaw
  rationale: Sinasaklaw ng ‘ililigaw’ kapuwa ang panlilinlang at ang pag-akay palayo sa tamang landas.
- source_word: πολλοὺς
  choice: marami
  rationale: Maikli at natural bilang layon; nauunawaan sa Filipino na maraming tao ang tinutukoy.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa pahayag ng mga huwad na nagpapanggap
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang may artikulong ὁ χριστός ay isang titulo rito, hindi pangalang pantangi lamang. Mas malinaw na ipinakikita ng ‘Mesiyas’ na inaangkin ng mga nagsasalita ang mesiyanikong katayuan; inilalagay sa talababa ang tradisyonal na katumbas na ‘Cristo.’
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘sapagkat’ upang mapanatili ang paliwanag na ugnayan, at ‘sa pangalan ko’ upang hindi paliitin ang tunay na saklaw ng pariralang Griyego. Ang panipi at ayos ng pangungusap ay natural sa kasalukuyang gamit.
