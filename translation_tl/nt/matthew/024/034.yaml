  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: tl
  text: 'Tinitiyak ko sa inyo: Hinding-hindi lilipas ang salinlahing ito hanggang sa mangyari ang lahat ng ito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bayang ito” o “ang lahing ito.” Maaaring magkaroon ng mas malawak na kahulugan ang salitang Griyego, ngunit “salinlahi” ang pinakadirektang salin dito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Tinitiyak ko
  rationale: Sa panimulang pormulang ἀμὴν λέγω ὑμῖν, natural at marangal sa modernong Tagalog ang “Tinitiyak ko sa inyo,” na naghahatid ng taimtim at mariing pagpapatotoo nang hindi umaasa sa transliterasyong “Amen.”
- source_word: λέγω ὑμῖν
  choice: ko sa inyo
  rationale: Isinama sa likas na pormulang “Tinitiyak ko sa inyo” upang mapanatili ang tuwirang pakikipag-usap sa maramihang tagapakinig.
- source_word: ὅτι
  choice: ':'
  rationale: Ang tutuldok ay natural na nagpapakilala sa nilalaman ng taimtim na pahayag sa Tagalog; hindi kailangang tumbasan ng hiwalay na “na.”
- source_word: οὐ μὴ παρέλθῃ
  choice: Hinding-hindi lilipas
  rationale: Ang inuulit na “hindi” sa “hinding-hindi” ay malinaw at likas na naghahatid ng mariing pagtanggi ng οὐ μή, samantalang ang “lilipas” ay tuwirang katumbas ng παρέρχομαι sa konteksto.
- source_word: ἡ γενεὰ αὕτη
  choice: ang salinlahing ito
  rationale: Ang “salinlahi” ang pinakadirektang salin ng γενεά rito at pinananatili nito ang interpretatibong tensiyon ng pahayag.
- source_word: ἕως ἂν
  choice: hanggang sa
  rationale: Karaniwang Tagalog ito para sa hangganang panahong nakatuon sa isang mangyayari sa hinaharap.
- source_word: πάντα ταῦτα
  choice: ang lahat ng ito
  rationale: Malinaw nitong kinakatawan ang kabuuan ng mga bagay o pangyayaring tinutukoy sa naunang diskurso.
- source_word: γένηται
  choice: mangyari
  rationale: Natural na modernong Tagalog para sa pagdating o pagganap ng mga tinutukoy na pangyayari.
theological_decisions:
- issue: Kahulugan ng ἡ γενεὰ αὕτη sa diskursong eskatolohikal
  choice: Isinalin bilang “ang salinlahing ito” nang walang dagdag na interpretasyon.
  alternative: “ang bayang ito” o “ang lahing ito”
  rationale: Ang “salinlahi” ang pinakadirektang leksikal na kahulugan sa konteksto. Hindi dapat lutasin ng salin ang pinagtatalunang saklaw ng pahayag o magpasok ng isang partikular na balangkas tungkol sa mga huling panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “hinding-hindi” upang likas na maipahayag ang mariing negasyon, at pinanatili ang “salinlahi” upang hindi ikandado ang talatang pinagtatalunan sa iisang interpretasyong teolohikal.
