    text: Maaari ring “matinding paghihirap” o “matinding kagipitan.” Ang salitang Griyego ay maaaring tumukoy sa matinding pagdurusa, kagipitan, panggigipit, o paniniil.
    reason: lexical_alternative
  revision_rationale: 'Pinalitan ang “hindi pa nangyayari” ng “hindi pa nangyari” upang maipahayag ang perpektong aspekto ng γέγονεν: walang ganitong kapighatiang naganap mula sa pasimula ng mundo hanggang sa kasalukuyan. Pinino rin ang paglalarawan sa talababa upang mas wastong maipakita ang semantikong bigat ng θλῖψις. Walang binagong kahulugan o idinagdag na doktrinal na pagpapakahulugan.'
