  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: tl
  text: Sapagkat sa panahong iyon ay magkakaroon ng matinding kapighatian[a] na ang katulad nito ay hindi pa nangyari mula sa pasimula ng mundo hanggang ngayon, at hindi na kailanman mangyayari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matinding paghihirap” o “matinding kagipitan.” Ang salitang Griyego ay maaaring tumukoy sa matinding pagdurusa, kagipitan, panggigipit, o paniniil.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Sapagkat sa panahong iyon
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang babala, at malinaw na ipinahahayag ng “sa panahong iyon” ang χρονικό na diwa ng τότε.
- source_word: ἔσται
  choice: ay magkakaroon
  rationale: Likas sa modernong Tagalog ang eksistensiyal na “magkakaroon” kapag ipinahahayag na darating o iiral ang isang kalagayan.
- source_word: θλῖψις μεγάλη
  choice: matinding kapighatian
  rationale: Ipinahahayag ng “matindi” ang antas ng μεγάλη, samantalang pinananatili ng “kapighatian” ang bigat ng θλῖψις bilang matinding paghihirap, kagipitan, o paniniil nang hindi ito nililimitahan sa isang partikular na uri ng pagdurusa.
- source_word: οἵα
  choice: na ang katulad nito
  rationale: 'Ipinakikita nito ang kwalitatibong paghahambing: ang kapighatiang tinutukoy ay walang naging katulad.'
- source_word: οὐ γέγονεν
  choice: ay hindi pa nangyayari
  rationale: Ang perpektong anyo ng γίνομαι ay tumutukoy sa hindi pa naganap hanggang sa kasalukuyang hangganan; natural itong naihahatid ng “hindi pa nangyayari.”
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: mula sa pasimula ng mundo
  rationale: Tuwirang pinananatili ang κόσμος bilang “mundo” at ang temporal na saklaw mula sa simula nito, nang hindi ipinapasok ang salitang “paglikha,” na hindi tahasang nasa Griyego.
- source_word: ἕως τοῦ νῦν
  choice: hanggang ngayon
  rationale: Maikli, natural, at eksaktong temporal na katumbas.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: at hindi na kailanman mangyayari
  rationale: Inihahatid ng “hindi na kailanman” ang mariing pagtanggi sa hinaharap na ipinahahayag ng οὐ μή; ang “mangyayari” ay nagpapanatili ng pagkakaugnay sa naunang γέγονεν.
theological_decisions:
- issue: Pagpapakahulugan sa θλῖψις sa kontekstong eskatolohikal
  choice: matinding kapighatian
  alternative: matinding paghihirap; matinding kagipitan
  rationale: May bigat at kinikilalang eskatolohikal na himig ang “kapighatian,” ngunit hindi nito ipinapasok ang isang tiyak na sistemang doktrinal o itinatakda ang eksaktong anyo ng pagdurusa.
- issue: Saklaw ng mariing pangwakas na pagtanggi
  choice: hindi na kailanman mangyayari
  alternative: hindi na magkakaroon kailanman ng katulad nito
  rationale: Pinananatili ng napiling anyo ang lakas at kaiklian ng οὐ μὴ γένηται. Dahil sa naunang “ang katulad nito,” malinaw na ang pagtanggi ay tungkol sa muling paglitaw ng gayong kapighatian nang hindi dinaragdagan ang teksto ng paliwanag.
translation_notes:
  register: Gumamit ng moderno ngunit marangal na Tagalog. Ang “sa panahong iyon” ay mas malinaw sa karaniwang mambabasa kaysa sa payak na “noon,” at ang “matinding kapighatian” ay nagpapanatili ng solemneng bigat ng pahayag. Ang footnote marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
