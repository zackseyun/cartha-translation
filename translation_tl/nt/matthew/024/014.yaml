base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: tl
  text: At ang Mabuting Balitang ito tungkol sa kaharian[a] ay ipahahayag sa buong mundo[b] bilang patotoo sa lahat ng bansa[c], at pagkatapos ay darating ang wakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ebanghelyong ito ng kaharian.”
    reason: lexical_alternative
  - marker: b
    text: O “sa buong mundong tinatahanan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa lahat ng mga pangkat ng tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: ay ipahahayag
  rationale: Ang hinaharap na balintiyak ay nagpapahiwatig ng hayag at pampublikong pagpapahayag. Natural sa Filipino ang “ipahahayag” at hindi nito nililimitahan ang kilos sa pormal na pangangaral sa loob ng simbahan.
- source_word: εὐαγγέλιον
  choice: Mabuting Balita
  rationale: Tuwirang ipinapahayag nito ang pangunahing kahulugan ng salitang Griyego at malinaw sa karaniwang mambabasa, habang pinananatili ang kinikilalang katawagang biblikal.
- source_word: τῆς βασιλείας
  choice: tungkol sa kaharian
  rationale: Bagaman pormal na genitibo ang Griyego, ang “tungkol sa kaharian” ay likas sa modernong Filipino at malinaw na ang kaharian ang nilalaman o paksa ng Mabuting Balita, nang hindi tinutukoy rito kung paano eksaktong inuunawa ang paghahari.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: sa buong mundo
  rationale: Natural at malinaw na Filipino ito para sa saklaw ng οἰκουμένη. Ang mas literal na “buong mundong tinatahanan” ay inilalagay sa talababa upang mapanatili ang heograpikong himig ng salita.
- source_word: εἰς μαρτύριον
  choice: bilang patotoo
  rationale: 'Pinananatili nito ang puwersa ng layunin o kinalabasan: ang pagpapahayag ay nagsisilbing patotoo. Hindi nito ipinapasya kung ang patotoo ay para sa o laban sa mga nakikinig.'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: sa lahat ng bansa
  rationale: Pinananatili ng “mga bansa” ang karaniwang leksikal at biblikal na diwa ng ἔθνη. Ang “lahat ng mga bayan” ay posibleng alternatibo kapag ang diin ay nasa mga pangkat ng tao.
- source_word: ἥξει
  choice: darating
  rationale: Ito ang pinakanatural na katumbas sa Filipino sa kontekstong tumutukoy sa pagdating ng wakas.
- source_word: τὸ τέλος
  choice: ang wakas
  rationale: Payak at mabigat ang “wakas” nang hindi nagdaragdag ng isang tiyak na sistemang eskatolohikal o kronolohiya.
theological_decisions:
- issue: Saklaw ng οἰκουμένη at ἔθνη sa isang pahayag tungkol sa wakas
  choice: Gumamit ng malawak na pananalitang “sa buong mundo” at “sa lahat ng bansa.”
  alternative: “sa buong mundong tinatahanan” at/o “sa lahat ng mga bayan”
  rationale: Pinananatili ng salin ang pangkalahatang saklaw ng pahayag nang hindi ito nililimitahan sa Imperyong Romano lamang o itinatali sa isang tiyak na makabagong kategoryang misyonal. Hindi rin nito nilulutas ang mga pagtatalo tungkol sa eksaktong katuparan o iskedyul ng wakas.
- issue: Ugnayan ng εἰς μαρτύριον sa mga bansa
  choice: “bilang patotoo sa lahat ng bansa”
  alternative: “upang maging patotoo sa lahat ng bansa” o “bilang patotoo laban sa lahat ng bansa”
  rationale: Ang Griyego ay maaaring magpahiwatig ng layunin o kinalabasan, ngunit hindi nito hayagang sinasabing “laban sa.” Kaya pinananatiling bukas ng “bilang patotoo” ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Mabuting Balita” sa halip na mas teknikal na “Ebanghelyo” sa pangunahing teksto, at iniwasan ang denominasyonal o sistematikong pagpapakahulugan sa “wakas.”
