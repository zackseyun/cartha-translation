id: MAT.24.45
reference: Matthew 24:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: tl
  text: Kaya, sino ang tapat at matalinong alipin[a] na itinalaga ng amo niya[b] upang mamahala sa sambahayan nito at magbigay sa kanila ng pagkain sa tamang panahon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang salitang Griyego ay tumutukoy sa isang taong nasa ilalim ng kapangyarihan ng amo; pinananatili rito ng “alipin” ang mas matinding diwang iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Panginoon.” Ginamit ang “amo” dahil sambahayan at mga alipin ang agarang larawan ng talinghaga.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Kaya, sino
  rationale: Ipinahihiwatig ng ἄρα na ang tanong ay bunga o pagpapatuloy ng naunang turo. Likas sa makabagong Tagalog ang “Kaya, sino” para sa ganitong retorikal na tanong.
- source_word: πιστὸς
  choice: tapat
  rationale: Ipinahahayag dito ang pagiging mapagkakatiwalaan sa pagtupad ng iniatas na tungkulin, habang napapanatili ang moral na bigat ng salita.
- source_word: δοῦλος
  choice: alipin
  rationale: Ang δοῦλος ay taong nasa ilalim ng kapangyarihan ng isang amo. Mas malinaw na naipapakita ng “alipin” kaysa “lingkod” ang ugnayang panlipunan sa larawan ng sambahayan; inilagay sa talababa ang mas banayad na alternatibo.
- source_word: φρόνιμος
  choice: matalino
  rationale: Tumutukoy ang φρόνιμος sa praktikal na karunungan at maingat na pagpapasiya. Ang “matalino” ay natural at nauunawaan sa konteksto bilang mahusay humawak ng pananagutan.
- source_word: κατέστησεν
  choice: itinalaga
  rationale: Ipinakikita ng pandiwa ang paglalagay sa isang tungkulin na may ipinagkatiwalang awtoridad.
- source_word: κύριος
  choice: amo
  rationale: Sa agarang larawan ng isang sambahayang may alipin, malinaw na ipinahahayag ng “amo” ang panlipunang ugnayan. Hindi nito itinatanggi ang mas malawak na pahiwatig ng “Panginoon,” na pinanatili bilang alternatibo sa talababa.
- source_word: οἰκετείας
  choice: sambahayan
  rationale: Saklaw ng οἰκετεία ang sambahayan bilang pangkat o establisimyentong nasa ilalim ng pamamahala, lalo na ang mga taong kabilang dito. Ang kasunod na “sa kanila” ay nagpapatunay na mga tao ang binibigyan ng pagkain.
- source_word: τοῦ δοῦναι
  choice: upang ... magbigay
  rationale: Ang articular infinitive ay nagpapahayag ng layunin ng pagtatalaga; tuwirang naipapakita ito ng “upang.”
- source_word: τροφὴν
  choice: pagkain
  rationale: Ang τροφή ay pagkain o panustos. Hindi dinagdagan ng “rasyon” o “takal” upang hindi maging mas tiyak kaysa sa Griyego.
- source_word: ἐν καιρῷ
  choice: sa tamang panahon
  rationale: Ang καιρός ay ang angkop o itinakdang pagkakataon, hindi lamang oras ayon sa orasan. Natural na naihahatid ito ng “sa tamang panahon.”
theological_decisions:
- issue: Paglilipat ng κύριος sa larawan ng sambahayan
  choice: amo
  alternative: Panginoon
  rationale: Ang agarang diwa ay ang amo ng alipin sa isang sambahayan. Pinananatili ng “amo” ang ibabaw na larawan ng talinghaga nang hindi sapilitang ginagawang tahasang titulo ang salita; gayunman, kinikilala sa talababa ang “Panginoon” bilang posibleng salin at ang mas malawak na pahiwatig nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “amo niya” at “sambahayan nito” upang malinaw na ang sambahayan ay sa amo, hindi sa alipin. Pinanatili ang retorikal na tanong at ang layunin ng pagtatalaga.
