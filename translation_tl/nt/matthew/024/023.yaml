base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: tl
  text: Kung magkagayon, kung may magsabi sa inyo, ‘Tingnan ninyo, narito ang Mesiyas!’[a] o, ‘Narito siya!’ huwag ninyo itong paniwalaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ang Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kung magkagayon
  rationale: Nag-uugnay ito sa naunang bahagi ng diskurso at nagpapahiwatig ng panahong o kalagayang kasunod; natural at marangal ito sa modernong Tagalog.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: kung may magsabi sa inyo
  rationale: Pinananatili ang kondisyong may di-tiyak na simuno nang natural sa Tagalog.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Isang panawag-pansin na mas natural sa kasalukuyang Tagalog kaysa sa makalumang ‘Narito!’ bilang hiwalay na utos.
- source_word: ὧδε
  choice: narito / nariyan
  rationale: Ang unang anyo ay tumutukoy sa ipinakikitang lokasyon ng Mesiyas; sa ikalawang eliptikong pahayag, ‘Nariyan siya’ ang natural na Tagalog na nagpapanatili sa puwersang deiktiko nang hindi labis na nagpapaliwanag.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Ginagamit dito ang χριστός bilang tiyak na titulong mesiyaniko, hindi bilang pangalang pantangi.
- source_word: μὴ πιστεύσητε
  choice: huwag ninyo itong paniwalaan
  rationale: Ang ‘ito’ ay tumutukoy sa ipinahayag na pag-aangkin, at hindi nagdaragdag ng personal na layong wala sa Griyego.
theological_decisions:
- issue: Pagkasalin sa ὁ χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Malinaw na titulo ang gamit sa konteksto ng pag-aangking natagpuan ang inaasahang pinahiran; pinananatili sa talababa ang tradisyonal na katawagang ‘Cristo.’
- issue: Tinutukoy ng pagbabawal na μὴ πιστεύσητε
  choice: huwag ninyo itong paniwalaan
  alternative: huwag ninyo siyang paniwalaan
  rationale: Mas malamang na ang tinutukoy ay ang mismong pag-aangkin. Iniiwasan ng ‘ito’ ang pagtakda na ang nagsasalita o ang taong itinuturo ang tuwirang layon ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Isinalin nang natural ang ikalawang eliptikong Ὧδε bilang ‘Nariyan siya!’ habang pinananatili ang maikli at mariing pahayag. Ang marker na [a] ay inilagay kaagad pagkatapos ng ‘Mesiyas!’ upang malinaw ang salitang tinutukoy.
