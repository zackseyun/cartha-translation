  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang inaasahang makarinig ng mga digmaan at mga balita tungkol sa mga ito, ang babalang huwag mabagabag, ang pangangailangang maganap ito, at ang pahayag na hindi pa ang wakas. Ang “ito” sa “kailangang mangyari ito” ay katanggap-tanggap na pagpapanatili ng di-tahasang simuno ng γενέσθαι.'
