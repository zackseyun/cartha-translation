id: MAT.24.6
reference: Matthew 24:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: tl
  text: At makaririnig kayo ng mga digmaan at mga balita tungkol sa mga digmaan.[a] Tiyakin ninyong huwag kayong mabagabag, sapagkat kailangang mangyari ito, ngunit hindi pa iyon ang wakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga usap-usapan tungkol sa mga digmaan.” Ang pariralang Griyego ay maaaring tumukoy sa mga ulat, balita, o usap-usapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: makaririnig kayo
  rationale: Likas sa modernong Tagalog ang panghinaharap na anyong ito at ipinahahayag nito ang inaasahang mangyayari, nang hindi pinipilit ang mas tiyak na diwa ng agarang pagkanalapit.
- source_word: πολέμους
  choice: mga digmaan
  rationale: Karaniwang tumutukoy ang πόλεμος sa digmaan, hindi lamang sa isang labanan.
- source_word: ἀκοὰς πολέμων
  choice: mga balita tungkol sa mga digmaan
  rationale: Maaaring tumukoy ang ἀκοή sa narinig na ulat o balita. Hindi ipinahihiwatig ng 'balita' na maaaring hindi totoo ang narinig, gaya ng maaaring ipahiwatig ng 'alingawngaw' o 'usap-usapan.'
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Tiyakin ninyong huwag kayong mabagabag
  rationale: Ginagamit dito ang ὁρᾶτε bilang panawagan na mag-ingat o tiyakin ang kasunod na utos; ang θροεῖσθε ay tumutukoy sa pagkabalisa o pagkataranta.
- source_word: δεῖ γὰρ γενέσθαι
  choice: sapagkat kailangang mangyari ito
  rationale: Pinananatili ng 'kailangang' ang diwa ng pangangailangan sa δεῖ, at ang 'ito' ay payak na tumutukoy sa naunang binanggit nang hindi nagdaragdag ng tahasang maramihang simuno.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ngunit hindi pa iyon ang wakas
  rationale: Malapit ito sa kayarian at diin ng Griyego at iniiwang malawak ang kahulugan ng eskatolohikal na 'wakas.'
theological_decisions:
- issue: Saklaw ng τὸ τέλος
  choice: ang wakas
  alternative: ang ganap na katuparan
  rationale: Hindi tinutukoy ng Griyego ang isang partikular na sistemang eskatolohikal; pinananatiling malawak ng 'ang wakas' ang parirala at ang teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang 'kayo/ninyo' bilang natural na maramihang pagtukoy sa mga kausap; iniwasan ang makaluma o labis na teknikal na pananalita.
