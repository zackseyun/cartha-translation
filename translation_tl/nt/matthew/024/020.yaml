  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: tl
  text: Ngunit manalangin kayo na huwag mangyari ang paglikas ninyo sa taglamig o sa araw ng Sabbath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa Sabbath.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ipanalangin ninyo
  rationale: Ang kasalukuyang pautos na nasa ikalawang panauhang maramihan ay likas na naipapahayag sa Filipino bilang “ipanalangin ninyo”; hindi na kailangang tahasang idagdag ang patuloy na aspekto.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ang δέ ng banayad na pagsalungat o paglipat mula sa naunang babala; pinananatili ito ng “Ngunit.”
- source_word: ἵνα μὴ γένηται
  choice: na ... ay huwag mangyari
  rationale: Ipinapahayag ng ἵνα kasama ng aorist subjunctive ang nilalaman ng panalangin, at natural sa Filipino ang “huwag mangyari.”
- source_word: ἡ φυγὴ ὑμῶν
  choice: ang pagtakas ninyo
  rationale: Ang φυγή ay pagtakas o paglikas mula sa panganib. Pinananatili ng “pagtakas” ang kilos nang hindi ipinahihiwatig na tiyak na matagumpay ang pagligtas.
- source_word: χειμῶνος
  choice: sa taglamig
  rationale: Genitibo ito na tumutukoy sa panahon; ang karaniwang katumbas sa Filipino ay “sa taglamig.”
- source_word: μηδὲ σαββάτῳ
  choice: o sa araw ng Sabbath
  rationale: Nag-uugnay ang μηδέ ng ikalawang kalagayang saklaw ng pagtanggi. Nililinaw ng “araw ng Sabbath” na araw ang tinutukoy, habang hindi pinipilit ng Filipino ang usapin ng artikulong tiyak o di-tiyak gaya sa Ingles.
theological_decisions:
- issue: Kung ipahahayag ang σαββάτῳ bilang “isang Sabbath” o “ang Sabbath”
  choice: sa araw ng Sabbath
  alternative: sa Sabbath
  rationale: Walang artikulo ang Griyego, ngunit hindi natural sa Filipino ang “sa isang Sabbath” sa kontekstong ito at maaari itong magmukhang tumutukoy sa isa lamang na partikular na Sabbath. Ang “sa araw ng Sabbath” ay tumpak at malinaw nang hindi nagpapataw ng denominasyonal na paliwanag. Inilalagay sa talababa ang mas maikling posibleng anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipanalangin ninyo” upang maging natural ang pautos, at “pagtakas” upang mapanatili ang diwa ng agarang paglayo sa panganib.
