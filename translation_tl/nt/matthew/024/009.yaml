  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: tl
  text: Pagkatapos, ibibigay nila kayo upang dumanas ng kapighatian[a] at papatayin kayo, at kapopootan kayo ng lahat ng bansa[b] dahil sa aking pangalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa matinding paghihirap,” “sa panggigipit,” o “sa pag-uusig.” Ang salitang Griyego ay maaaring tumukoy sa matinding hirap, pagdarahop, o kapighatian.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ng lahat ng mga bayan” o, bagaman hindi gaanong malamang sa kontekstong ito, “ng lahat ng Hentil.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “dahil sa aking pangalan”; ibig sabihin, dahil sa katapatan kay Jesus at sa lahat ng kinakatawan ng kaniyang pangalan.
    reason: lexical_explanation
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Ipinahihiwatig ng temporal na pang-abay ang kasunod na pangyayari sa pahayag ni Jesus; natural at malinaw ang “Pagkatapos” sa makabagong Filipino.
- source_word: παραδώσουσιν ὑμᾶς
  choice: ibibigay nila kayo
  rationale: Ang παραδίδωμι ay tumutukoy sa pagbibigay o pagsasalin ng isang tao sa kapangyarihan ng iba. Hindi idinagdag ang di-tiyak na diwa ng pagtataksil.
- source_word: εἰς θλῖψιν
  choice: sa kapighatian
  rationale: Saklaw ng θλῖψις ang matinding hirap, panggigipit, at pag-uusig. Nananatili sa “kapighatian” ang bigat at posibleng eskatolohikal na pahiwatig nang hindi ito ginagawang teknikal na termino.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: papatayin kayo
  rationale: Tuwiran at natural na salin ng pandiwang nangangahulugang pumatay; hindi nito idinaragdag ang moral na espesipikasyon ng “papaslangin.”
- source_word: ἔσεσθε μισούμενοι
  choice: kapopootan kayo
  rationale: Natural na Filipino para sa periphrastic future passive na “kayo ay magiging kinapopootan.”
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: ng lahat ng bansa
  rationale: Sa konteksto, mas malamang na pandaigdigang saklaw ang ἔθνη kaysa espesipikong pagtukoy sa mga Hentil.
- source_word: διὰ τὸ ὄνομά μου
  choice: dahil sa aking pangalan
  rationale: Pinananatili ang hulma at teolohikal na lawak ng “pangalan,” na kumakatawan kay Jesus, sa kaniyang pagkakakilanlan, at sa katapatan sa kaniya.
theological_decisions:
- issue: Ang saklaw ng θλῖψις sa isang eskatolohikal na pahayag
  choice: kapighatian
  alternative: pagdurusa; panggigipit; pag-uusig
  rationale: Pinananatili ng “kapighatian” ang tensiyon sa pagitan ng aktuwal na pag-uusig at ng mas malawak na eskatolohikal na paghihirap, nang hindi ipinapasok ang isang partikular na sistema tungkol sa mga huling panahon.
- issue: Ang kahulugan ng ἔθνη
  choice: lahat ng bansa
  alternative: lahat ng Hentil
  rationale: Mas natural dito ang pandaigdigang pagsalungat kaysa isang mahigpit na paghahambing ng mga Judio at mga Hentil.
- issue: Ang kahulugan ng “aking pangalan”
  choice: pinanatili bilang “aking pangalan”
  alternative: dahil sa katapatan ninyo sa akin
  rationale: Hindi pinalitan ng paliwanag ang mayamang biblikal na konsepto ng pangalan; ipinaliwanag lamang ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at mariing daloy ng Griyego, pati ang “pangalan” bilang mahalagang biblikal na larawan. Ginamit ang “kapighatian” bilang salitang madaling maunawaan ngunit may sapat na bigat para sa konteksto.
