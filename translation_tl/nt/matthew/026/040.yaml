  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: tl
  text: At lumapit siya sa mga alagad at nadatnan silang natutulog. Sinabi niya kay Pedro, “Kaya hindi ninyo nakayang manatiling gising[a] kasama ko nang isang oras?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “magbantay.”'
    reason: Ang γρηγορέω ay maaaring mangahulugang manatiling gising o magbantay/mapagmatyag.
lexical_decisions:
- source_word: ἔρχεται
  choice: lumapit siya
  rationale: Ginamit ang aspektong perpektibo na karaniwan sa salaysay sa Filipino. Likas nitong inilalahad ang kilos sa konteksto, kahit nasa makasaysayang pangkasalukuyan ang Griyego.
- source_word: πρὸς τοὺς μαθητὰς
  choice: sa mga alagad
  rationale: Ang “sa mga alagad” ang likas na katumbas ng πρός na nagpapahiwatig ng paglapit sa kanila.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: nadatnan silang natutulog
  rationale: Natural sa Filipino ang “nadatnan” para sa pagkakitang nasa isang kalagayan ang mga tao; pinananatili ng “natutulog” ang berbal na diwa ng participle.
- source_word: λέγει τῷ Πέτρῳ
  choice: sinabi niya kay Pedro
  rationale: Ginamit ang pangalang “Pedro” ayon sa nakaugaliang anyong Filipino at ang likas na anyong pasalaysay na “sinabi.”
- source_word: Οὕτως
  choice: Ganoon ba—
  rationale: Sa tanong na ito, ang οὕτως ay naghahayag ng pagtataka at banayad na pagsaway. Ang “Ganoon ba—” ay natural na naghahatid ng himig na iyon nang hindi nagpapaliwanag nang labis.
- source_word: οὐκ ἰσχύσατε
  choice: hindi ninyo nakayang
  rationale: Ipinahihiwatig ng ἰσχύω ang kakayahan o lakas. Pinananatili ng “ninyo” ang pangmaramihang anyo ng pandiwa kahit si Pedro ang tahasang kinakausap.
- source_word: μίαν ὥραν
  choice: nang isang oras
  rationale: Likas itong pagpapahayag sa Filipino ng tagal na nasa accusative sa Griyego.
- source_word: γρηγορῆσαι
  choice: manatiling gising
  rationale: Sa agarang paghahambing sa kanilang pagtulog, ang konkretong diwang “manatiling gising” ang pinakamalinaw; inilalagay sa talababa ang posibleng diwang pagbabantay.
- source_word: μετ’ ἐμοῦ
  choice: na kasama ko
  rationale: Tuwirang ipinapahayag nito ang pagsama kay Jesus na tinutukoy ng μετ’ ἐμοῦ.
theological_decisions:
- issue: Si Pedro ang tahasang kinakausap, ngunit pangmaramihan ang ἰσχύσατε.
  choice: Pinanatili ang isahang pinatutungkulan sa “kay Pedro” at ang pangmaramihang pagsaway sa “ninyo.”
  alternative: Gawing “mo” ang panghalip upang si Pedro lamang ang tahasang saklaw, o ipaliwanag na kinakatawan niya ang buong pangkat.
  rationale: Malinaw sa Griyego ang paglipat mula sa tahasang pakikipag-usap kay Pedro tungo sa pangmaramihang pandiwa. Hindi ito pinakinis o ipinaliwanag sa mismong teksto upang manatili ang tunay na tensiyon ng pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Likas ang daloy ng salaysay, ngunit pinanatili ang banayad na pagsaway at ang paglipat mula sa tahasang pagtukoy kay Pedro tungo sa pangmaramihang “ninyo.”
