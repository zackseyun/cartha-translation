  source_fidelity: Tumpak na naihahatid ng draft ang paglapit ni Jesus sa mga alagad, ang pagkakatagpo sa kanilang pagtulog, ang pagtukoy kay Pedro, at ang pangmaramihang “ninyo” ng ἰσχύσατε. Ang “manatiling gising” ay angkop sa γρηγορῆσαι sa kontekstong kabaligtaran ng pagtulog.
  naturalness: Bahagyang hindi likas ang “Ganoon ba—hindi ninyo ...?” bilang pambungad sa tanong sa makabagong Filipino. Ang “Kaya hindi ninyo ...?” ay mas natural na naghahatid ng mapanuyang/pasaway na puwersa ng Οὕτως nang walang dagdag na pagpapaliwanag. Mas tuwiran din ang “kasama ko” kaysa “na kasama ko.”
  terminology: Ang “mga alagad,” “Pedro,” “natutulog,” at “manatiling gising” ay angkop sa marangal ngunit makabagong rehistro. Pinananatili ng “ninyo” ang mahalagang paglipat mula sa isahang pinangalanang kausap tungo sa pangmaramihang pandiwa.
