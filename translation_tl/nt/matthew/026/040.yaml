  to: At lumapit siya sa mga alagad at nadatnan silang natutulog. Sinabi niya kay Pedro, “Kaya hindi ninyo nakayang manatiling gising[a] kasama ko nang isang oras?”
  rationale: Pinakinis ang pambungad ng retorikal na tanong at ang ayos ng pariralang nagpapahayag ng pakikisama, habang pinananatili ang lahat ng pangunahing sangkap ng Griyego, lalo na ang tahasang pagtukoy kay Pedro at ang pangmaramihang “ninyo.”
