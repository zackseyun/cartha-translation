  to: Makalipas ang ilang sandali, lumapit kay Pedro ang mga nakatayo roon at sinabi, “Tiyak na isa ka rin sa kanila, sapagkat pati ang paraan ng pagsasalita mo ay nagpapahalata sa iyo.”[a]
  rationale: Inayos ang sanhi at diin ng huling sugnay upang mas malinaw na maipakita ang καὶ γάρ, habang pinanatili ang malawak na kahulugan ng λαλιά. Binago rin ang alternatibong talababa para maging gramatikal at likas sa Filipino Tagalog.
