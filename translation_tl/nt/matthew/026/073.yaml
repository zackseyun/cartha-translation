  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: tl
  text: Makalipas ang ilang sandali, lumapit kay Pedro ang mga nakatayo roon at sinabi, “Tiyak na isa ka rin sa kanila, sapagkat pati ang paraan ng pagsasalita mo ay nagpapahalata sa iyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “nahahalata ka dahil sa punto mo.” Ang salitang Griego na λαλιά ay maaaring tumukoy sa pananalita, paraan ng pagsasalita, o punto.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Makalipas ang ilang sandali
  rationale: Likas na temporal na parirala sa modernong Tagalog na nagpapahayag ng maikling agwat ng panahon.
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; sapat na sa Tagalog ang ayos ng pangungusap nang walang hiwalay na katumbas.
- source_word: προσελθόντες
  choice: lumapit
  rationale: Tuwirang ipinahahayag ang paglapit ng mga tao kay Pedro at natural sa konteksto.
- source_word: οἱ ἑστῶτες
  choice: ang mga nakatayo roon
  rationale: Pinananatili ang participial na paglalarawan at hindi ipinapalagay nang higit sa sinasabi ng teksto.
- source_word: εἶπον τῷ Πέτρῳ
  choice: sinabi ... kay Pedro
  rationale: Karaniwan at malinaw na katumbas ng pandiwa at datibong layon sa Tagalog.
- source_word: Ἀληθῶς
  choice: Tiyak na
  rationale: Ipinahahayag ang matibay na katiyakan ng nagsasalita sa isang likas na paraan sa usapan.
- source_word: καὶ σὺ
  choice: isa ka rin
  rationale: Ang “rin” ay nagpapanatili sa diin na kabilang din si Pedro sa grupong tinutukoy.
- source_word: ἐξ αὐτῶν
  choice: sa kanila
  rationale: Sa pariralang “isa ... sa kanila,” natural na ipinahahayag ang pagiging kabilang sa grupo.
- source_word: καὶ γὰρ
  choice: dahil
  rationale: Malinaw na inihahayag ang pagbibigay ng dahilan; ang posibleng dagdag na diin ng καί ay naihahatid na ng kabuuang akusasyon nang hindi pinipilit ang di-likas na “maging.”
- source_word: ἡ λαλιά σου
  choice: paraan ng pagsasalita mo
  rationale: Pinananatili ang saklaw ng λαλιά bilang pananalita, paraan ng pagsasalita, o punto, sa halip na paliitin agad sa “accent.”
- source_word: δῆλόν σε ποιεῖ
  choice: nahahalata ka
  rationale: Likas at malinaw na Tagalog para sa literal na ideyang “ginagawa kang hayag,” habang pinananatili ang tuwirang pagtukoy kay Pedro.
