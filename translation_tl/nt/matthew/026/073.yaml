  register: Makabagong Filipino Tagalog na marangal ngunit pangkaraniwan. Ginamit ang “nahahalata ka sa paraan ng pagsasalita mo” upang maging likas sa usapan at mapanatili ang leksikal na lawak ng λαλιά; inilagay agad ang talababa pagkatapos ng kaugnay na pangungusap.
