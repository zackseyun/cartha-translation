    issue: Hindi hayag ang pampadiin na καί sa καὶ γάρ.
    rationale: Bagaman maaaring hindi laging kailangan ang hiwalay na katumbas, ang “pati” ay likas sa Tagalog at mahusay na naghahatid ng diin sa ebidensiyang ibinibigay ng kanilang kausap.
  - severity: medium
    issue: 'Hindi natural ang alternatibong pananalita sa talababa: “ibinubunyag ka ng punto mo.”'
    rationale: Ang “ibinubunyag” ay karaniwang nangangailangan ng bagay na ibinubunyag o ibang ayos ng pangungusap. Ang “nahahalata ka dahil sa punto mo” ay natural at tumutugma sa diwa ng δῆλόν σε ποιεῖ.
