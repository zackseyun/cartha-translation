  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: tl
  text: Ngunit sinasabi nila, “Huwag sa panahon ng kapistahan[a], baka magkaroon ng kaguluhan[b] sa hanay ng mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pista” o “festival.” Ang Griyegong ἑορτή ay maaaring tumukoy sa isang kapistahan o pista.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkakagulo” o “pag-aalsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Pinananatili ng aspektong di-ganap ang nagpapatuloy na pagsasalita o pag-uusap; hindi ito ginawang payak na “sinabi nila.”
- source_word: δέ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pagbabago sa takbo ng salaysay habang inilalahad ang kanilang pag-iingat.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Huwag sa panahon ng kapistahan
  rationale: Ang Μὴ ay eliptikong nagpapahayag ng pasiya o pagbabawal, at ang ἐν ay temporal dito. Likas sa Tagalog ang “Huwag sa panahon…” habang naiiwan sa konteksto ang kilos na hindi nila gagawin.
- source_word: ἵνα μὴ
  choice: baka
  rationale: Sa kontekstong ito, likas na ipinahahayag ng “baka” ang layuning iwasan ang isang hindi kanais-nais na pangyayari.
- source_word: θόρυβος
  choice: kaguluhan
  rationale: Tumutukoy sa pampublikong ingay, gulo, o ligalig. Hindi ipinapalagay ng “kaguluhan” na umabot na ito sa ganap na pag-aalsa.
- source_word: γένηται
  choice: magkaroon
  rationale: Kasama ng “kaguluhan,” natural nitong ipinapahayag ang paglitaw o pangyayari ng gulo.
- source_word: ἐν τῷ λαῷ
  choice: sa gitna ng mga tao
  rationale: Ipinakikita nitong sa kalipunan ng mga tao maaaring lumitaw ang kaguluhan, nang hindi ginagawang simpleng “karamihan” ang λαός.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang eliptikong “Huwag…” ng Griyego at ang nagpapatuloy na aspekto ng ἔλεγον, habang ginamit ang likas na “baka” para sa layuning umiwas sa kaguluhan.
