  to: Pagkatapos ay pinunit ng punong pari ang kanyang mga kasuotan[a] at sinabi, “Namusong siya! Bakit kailangan pa natin ng mga saksi? Masdan ninyo, ngayon ay narinig na ninyo ang pamumusong.”
