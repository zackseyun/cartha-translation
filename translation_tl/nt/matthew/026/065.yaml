reference: Matthew 26:65
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: tl
  text: Pagkatapos ay pinunit ng punong pari ang kanyang mga kasuotan[a] at sinabi, “Namusong siya! Bakit kailangan pa natin ng mga saksi? Masdan ninyo, ngayon ay narinig na ninyo ang pamumusong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pagpunit ng sariling kasuotan ay hayagang tanda ng matinding pagkagulat, dalamhati, o galit.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos ay
  rationale: Likas na panandang temporal sa salaysay na nagpapakilala sa sumunod na pangyayari.
- source_word: ὁ ἀρχιερεὺς
  choice: ang pinakapunong pari
  rationale: Karaniwang katawagan sa Filipino para sa nag-iisang may pinakamataas na katungkulan sa pagkapari sa kontekstong Judio.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: pinunit ... ang kanyang mga kasuotan
  rationale: Tuwirang inilalarawan ang marahas at hayagang pagpunit; ang “mga kasuotan” ay hindi labis na tumutukoy sa partikular na uri ng damit.
- source_word: Ἐβλασφήμησεν
  choice: Namusong siya
  rationale: Pinananatili ang relihiyoso at legal na bigat ng paratang sa maikli at natural na anyong Filipino.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Bakit kailangan pa natin ng mga saksi?
  rationale: Natural na Filipino para sa idyomang Griyego, habang malinaw na naipahahayag ng “pa” ang ἔτι.
- source_word: ἴδε
  choice: Tingnan ninyo!
  rationale: Ginagamit bilang panawag-pansin sa mga nakikinig; pinananatili ang tahasang lakas ng pautos.
- source_word: νῦν ἠκούσατε
  choice: Ngayon ay narinig na ninyo
  rationale: Pinananatili ang νῦν at ipinahahayag ng “na” ang agarang kabuluhan ng kanilang kararinig.
- source_word: τὴν βλασφημίαν
  choice: ang pamumusong
  rationale: Pinananatili ang tiyak at mabigat na katawagang ginamit ng pinakapunong pari sa kanyang paratang.
theological_decisions:
- issue: Ang paratang na βλασφημέω / βλασφημία
  choice: “Namusong siya” / “ang pamumusong”
  alternative: “Nagsalita siya laban sa Diyos” / “ang pananalitang laban sa Diyos”
  rationale: Ang tradisyonal at malinaw na terminong “pamumusong” ang pinakamahusay na nagpapanatili sa legal at relihiyosong bigat ng paratang. Iniuulat ito bilang sinabi ng pinakapunong pari, hindi bilang tahasang pagsang-ayon ng tagapagsalaysay.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakapunong pari” at “pamumusong” bilang mga pamilyar na katawagang biblikal na nauunawaan pa rin ng karaniwang mambabasa. Inayos ang ibinigay na maling pagkakatapat ng mga talababa: ang paliwanag tungkol sa pagpunit ng kasuotan ay inilagay sa marker [a] pagkatapos ng “mga kasuotan.”'
