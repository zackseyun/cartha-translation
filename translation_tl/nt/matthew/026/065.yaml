    issue: “pinakapunong pari” para sa ὁ ἀρχιερεύς
    rationale: Ang “pinaka-” ay hindi ipinahihiwatig ng Griyego at maaaring magmungkahi ng superlatibong ranggo na wala sa termino. Ang “punong pari” ang tuwiran, matatag, at natural na katumbas ng singular na katungkulan.
