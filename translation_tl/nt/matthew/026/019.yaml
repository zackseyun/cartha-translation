id: MAT.26.19
reference: Matthew 26:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: tl
  text: At ginawa ng mga alagad ang iniutos sa kanila ni Jesus, at inihanda nila ang Paskuwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang hapunan ng Paskuwa”; maaaring tumukoy ang salitang Griyego sa pagdiriwang ng Paskuwa sa mas malawak na diwa, kasama ang hapunang inihahanda para rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: ginawa
  rationale: Karaniwang katumbas ng pandiwang ‘gawin.’ Kasama ng ὡς συνέταξεν, ipinahihiwatig nitong isinagawa ng mga alagad ang tagubilin ni Jesus.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Kinikilalang natural at karaniwang salin sa mga Ebanghelyo para sa mga tagasunod na tinuturuan ni Jesus.
- source_word: ὡς
  choice: ang iniutos
  rationale: Isinama ang diwa ng pagsunod o pag-ayon sa sugnay na ‘ginawa ... ang iniutos,’ na mas natural sa modernong Tagalog kaysa sa literal na ‘ginawa ... gaya ng iniutos.’
- source_word: συνέταξεν
  choice: iniutos
  rationale: Maaaring mangahulugang nag-utos, nagbilin, o nagtagubilin. Pinananatili ng ‘iniutos’ ang awtoridad ni Jesus at natural ito sa konteksto.
- source_word: ἡτοίμασαν
  choice: inihanda
  rationale: Tuwiran at likas na katumbas ng paghahanda o paggawa ng mga kailangang bagay upang maging handa.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Pinananatili ang lawak ng salitang Griyego, na maaaring tumukoy sa pagdiriwang at, ayon sa konteksto, sa hapunang kaugnay nito.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Bibliyang Tagalog.
theological_decisions:
- issue: Saklaw ng τὸ πάσχα
  choice: ang Paskuwa
  alternative: ang hapunan ng Paskuwa; ang kordero ng Paskuwa
  rationale: Maaaring tumukoy ang termino sa kapistahan, sa hapunan, o sa kaugnay na hain. Bagaman paghahanda para sa hapunan ang malamang na tinutukoy sa konteksto, hindi iyon tahasang nililimitahan ng Griyego; kaya pinanatili sa pangunahing teksto ang mas malawak na ‘Paskuwa’ at ipinaliwanag ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘mga alagad,’ ‘iniutos,’ at ‘Paskuwa’ bilang mga pamilyar na katawagang biblikal; iniwasan ang sobrang literal ngunit alanganing ayos ng pangungusap.
