  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: tl
  text: Pagdating niyang muli, natagpuan niya silang natutulog, sapagkat mabibigat ang kanilang mga mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
