lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Muli siyang lumapit
  rationale: Ang aorist participle na ἐλθών ay ginawang likas na sugnay sa Tagalog, at pinananatili ng “muli” ang diwa ng pag-uulit sa πάλιν.
- source_word: εὗρεν αὐτοὺς
  choice: natagpuan sila
  rationale: Tuwirang ipinapahayag ang karaniwang salaysay na diwa ng εὑρίσκω; ang panghalip na “siya” ay tumutukoy kay Jesus ayon sa konteksto.
- source_word: καθεύδοντας
  choice: natutulog
  rationale: Pinananatili ng aspektong nagpapatuloy ang kalagayan nilang natutulog nang matagpuan sila.
- source_word: ἦσαν γὰρ
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang paliwanag na ugnayan ng γάρ sa naunang pahayag.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι
  choice: nabibigatan ang kanilang mga mata
  rationale: Ipinahihiwatig ng “nabibigatan” ang pasibo at nagpatuloy na kalagayan ng perfect passive participle βεβαρημένοι, habang nananatiling natural sa modernong Tagalog.
