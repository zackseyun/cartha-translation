translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “lumapit” upang maging likas ang kilos ng pagpunta sa kontekstong salaysay, at iniwasang dagdagan ang teksto ng tahasang paliwanag na antok ang dahilan ng bigat ng kanilang mga mata.
