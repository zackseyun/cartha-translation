  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: tl
  text: Sinabi niya, “Ano ang handa ninyong ibigay sa akin, at ibibigay ko siya sa inyo?[a]” At tinimbang nila para sa kanya ang tatlumpung pirasong pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipagkanulo ko siya sa inyo.” Ang pandiwang Griyego ay maaaring mangahulugang “ibigay,” “ipasakamay,” o, sa kontekstong ito, “ipagkanulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Ano ang ibibigay ninyo sa akin
  rationale: Sa konteksto ng tawaran, natural itong nagpapahayag ng hinihinging kabayaran. Hindi kailangang isalin nang tahasan ang θέλετε bilang “nais” dahil ang kusang-loob na pagbibigay ay malinaw na sa tanong.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: kung ibibigay ko siya sa inyong mga kamay
  rationale: Ipinahahayag nito ang aktuwal na pagpapasakamay kay Jesus sa mga pinuno. Pinananatili nitong mas malawak ang παραδίδωμι kaysa sa tuwirang “ipagkanulo,” habang natural sa modernong Tagalog ang buong pangungusap.
- source_word: οἱ δὲ
  choice: At
  rationale: Ang δέ ay banayad na pang-ugnay dito; sapat ang “At” para sa tuloy-tuloy na daloy ng salaysay.
- source_word: ἔστησαν αὐτῷ
  choice: binayaran nila siya
  rationale: Sa idyomang ito, maaaring tumukoy ang ἔστησαν sa pagtatakda o pagbibigay ng halagang salapi. Mas natural sa Tagalog ang “binayaran” kaysa sa literal na “tinimbang,” bagaman posibleng pinatutungkulan ng Griyego ang pagtitimbang o pagtatakda ng halaga.
- source_word: τριάκοντα ἀργύρια
  choice: tatlumpung pirasong pilak
  rationale: Ang ἀργύρια ay mga piraso o salaping pilak, ngunit hindi tinutukoy ng teksto ang eksaktong denominasyon. Iniiwasan ng “pirasong pilak” ang pagdaragdag ng hindi nakasaad na uri ng barya.
theological_decisions:
- issue: Pagpapakahulugan sa παραδώσω sa alok ni Judas
  choice: ibibigay ko siya sa inyong mga kamay
  alternative: ipagkakanulo ko siya sa inyo
  rationale: 'Totoong pagtataksil ang ginawa ni Judas ayon sa konteksto, ngunit mas malawak ang kahulugan ng pandiwang παραδίδωμι: ibigay, ipasa, o ipasakamay. Pinananatili ng pangunahing salin ang lawak na ito, at inilalagay sa talababa ang tahasang moral na kahulugang “ipagkanulo.”'
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sa inyong mga kamay” bilang idyomatikong paglilinaw sa pagpapasakamay, at iniwasang tukuyin ang denominasyon ng salaping pilak.
