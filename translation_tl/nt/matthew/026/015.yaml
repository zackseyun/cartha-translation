  to: Sinabi niya, “Ano ang handa ninyong ibigay sa akin, at ibibigay ko siya sa inyo?[a]” At tinimbang nila para sa kanya ang tatlumpung pirasong pilak.
  rationale: Idinagdag ang “handa” upang katawanin ang θέλετε sa konteksto ng tawaran. Pinalitan ang kondisyunal na “kung” ng “at” upang mapanatili ang anyo ng alok sa Griyego. Inalis ang dagdag na “sa inyong mga kamay,” na hindi kailangan upang maging malinaw ang παραδώσω, at ginawang “tinimbang” ang pandiwa sa huling sugnay upang higit na maipakita ang idyomatikong larawan ng halagang pilak na itinakda o ibinilang/tinimbang. Napanatili ang leksikal na alternatibo para sa “ipagkanulo” sa talababa.
