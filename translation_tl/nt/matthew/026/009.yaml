translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “maipagbibili sana” upang likas na maipahayag ang nakaraang posibilidad na hindi natupad, at pinanatili ang paliwanag na “Sapagkat.”
