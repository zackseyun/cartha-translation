  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: tl
  text: Sapagkat maaari sanang naipagbili ito sa malaking halaga at naibigay sa mahihirap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa napakalaking halaga” o “sa mataas na presyo.” Ginamit sa Griyego ang henitibo ng presyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: maipagbibili sana … at maibibigay
  rationale: Ang imperpektong anyo ng δύναμαι kasama ng mga pawatas ay nagpapahayag ng posibilidad sa nakaraan na hindi naisakatuparan; likas itong ipinahihiwatig sa Filipino ng mga pandiwang may “sana.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na ugnayan ng pangungusap sa naunang reklamo.
- source_word: τοῦτο
  choice: ito
  rationale: Pinananatili ang demonstratibo ng Griyego at ang pagtukoy nito sa bagay na nabanggit na, nang hindi inuulit ang pangngalan.
- source_word: πραθῆναι
  choice: maipagbibili
  rationale: Ang aorist passive infinitive ng πιπράσκω ay nangangahulugang maibenta; ang anyong “maipagbibili sana” ay natural na nagsasaad ng hindi natupad na posibilidad sa nakaraan.
- source_word: πολλοῦ
  choice: sa malaking halaga
  rationale: Ito ay henitibo ng presyo at tumutukoy sa malaking halagang maaaring ipagbili sa bagay, nang hindi nagtatakda ng eksaktong halaga.
- source_word: δοθῆναι
  choice: maibibigay
  rationale: Ang aorist passive infinitive ng δίδωμι ay katambal ng πραθῆναι; pinananatili ng “maibibigay” ang pasibong diwa at ang parehong posibilidad.
- source_word: πτωχοῖς
  choice: sa mahihirap
  rationale: Ang pang-uring datibong maramihan na ginagamit bilang pangngalan ay tumutukoy nang sama-sama sa mga taong dukha; natural at maikli ang “sa mahihirap.”
