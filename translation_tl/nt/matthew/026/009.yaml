  source_fidelity: Ang "Sapagkat" ay tapat sa paliwanag na γάρ; ang "ito" ay hindi nagdaragdag ng pangngalang wala sa Griyego; at ang "sa mahihirap" ay wastong tumutukoy sa πτωχοῖς. Gayunman, mas malinaw na maipapahayag ang nakaraang hindi naisakatuparang posibilidad ng ἐδύνατο kasama ng dalawang aorist infinitive sa pamamagitan ng "maaari sanang naipagbili ... at naibigay."
  naturalness: Nauunawaan ang "maipagbibili sana ... at maibibigay," ngunit ang "maipagbibili" ay maaari ring marinig bilang pangkalahatan o inaasahang pagbebenta. Ang "maaari sanang naipagbili" ay mas likas at tiyak para sa 'could have been sold' sa kontekstong ito.
  terminology: Ang "malaking halaga" ay angkop para sa πολλοῦ (henitibo ng presyo) at hindi nagtatakda ng halaga. Ang "mahihirap" ay karaniwan, marangal, at angkop na katumbas ng substantival na πτωχοῖς.
