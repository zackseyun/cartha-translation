id: MAT.26.47
reference: Matthew 26:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: tl
  text: Habang nagsasalita pa siya, narito, dumating si Judas, isa sa labindalawa. Kasama niya ang isang malaking pangkat ng mga taong may mga tabak at pamalo[b], mula sa mga punong pari at matatandang pinuno ng bayan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinugo ng mga punong pari at matatandang pinuno ng bayan.” Mas literal sa Griyego ang “mula sa mga punong pari at matatandang pinuno ng bayan.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “mga patpat.” Literal na tumutukoy ang salitang Griyego sa mga piraso ng kahoy, na malamang na ginamit dito bilang mga pamalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa siya
  rationale: Ipinahahayag ng pariralang genitive absolute ang kilos na kasabay ng pagdating ni Judas; natural na naihahatid ng “habang” at “pa” ang temporal na diwa ng ἔτι.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang panandang diskurso na nagbibigay ng diin at kasiglahan sa biglang pagtuon ng salaysay, nang hindi idinaragdag ang tahasang kahulugang “bigla.”
- source_word: Ἰούδας
  choice: Judas
  rationale: Karaniwang anyo ng pangalan sa Filipino.
- source_word: εἷς τῶν δώδεκα
  choice: isa sa labindalawa
  rationale: Tuwirang inilalarawan ang kaugnayan ni Judas sa pangkat nang hindi ginagawang pantanging titulo ang bilang.
- source_word: ἦλθεν
  choice: dumating
  rationale: Natural na salaysay na katumbas ng aorist ng ἔρχομαι sa kontekstong ito.
- source_word: ὄχλος πολὺς
  choice: isang malaking pangkat ng mga tao
  rationale: Malinaw at natural sa modernong Filipino; pinananatili ang dami nang hindi ipinapalagay sa salitang ὄχλος lamang na sila ay isang marahas na “mandurumog.”
- source_word: μετὰ μαχαιρῶν
  choice: may mga tabak
  rationale: Ang μάχαιρα ay tumutukoy sa tabak o sandatang tulad nito; “mga tabak” ang malawak at nakagawiang katumbas sa tagpong ito.
- source_word: καὶ ξύλων
  choice: at pamalo
  rationale: Bagaman literal na kahoy o piraso ng kahoy ang ξύλον, ipinakikita ng konteksto ng mga sandata na ginagamit ang mga ito bilang pamalo.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: mula sa mga punong pari at matatandang pinuno ng bayan
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan sa ἀπό nang hindi nagdaragdag ng pandiwang “isinugo.” Ang “matatandang pinuno” ay nagpapalinaw na ang πρεσβύτεροι ay mga kinikilalang pinuno, hindi lamang matatanda sa edad.
theological_decisions:
- issue: Kung tahasang sasabihing isinugo ng mga pinunong Judio ang pangkat
  choice: mula sa mga punong pari at matatandang pinuno ng bayan
  alternative: isinugo ng mga punong pari at matatandang pinuno ng bayan
  rationale: Ang ἀπό ay nagsasaad ng pinagmulan at maaaring magpahiwatig ng awtorisasyon sa konteksto, ngunit walang tahasang pandiwa ng pagsusugo sa Griyego. Kaya pinananatili sa pangunahing teksto ang tunay na lawak ng pahayag.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “narito” bilang maikli at bahagyang tradisyonal na panandang salaysay. Hinati sa dalawang pangungusap upang maging malinaw at natural ang mahabang estruktura nang hindi binabago ang pagkakasunod ng mga pangyayari. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng mga ito; dahil dito, nauuna sa teksto ang [b] kaysa [a], alinsunod sa mga marker na ibinigay sa source package.
