  source_fidelity: Tumpak na naihahatid ng salin ang genitive absolute na “habang nagsasalita pa siya,” ang panandang ἰδού sa “narito,” ang pagkakakilanlan kay Judas bilang isa sa labindalawa, at ang pagdating ng malaking pangkat na may tabak at pamalo. Ang “mula sa” ay wastong maingat na salin ng ἀπό at hindi nagdaragdag ng pandiwang pagsusugo.
