  yaml_path: translation/nt/matthew/026/020.yaml
  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: tl
  text: Pagsapit ng gabi, nakahilig siya sa hapag kasama ang labindalawang alagad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “kasama ang labindalawa” lamang at wala ang salitang “alagad.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Pagsapit ng gabi
  rationale: Likas at malinaw na salin ng genitive absolute na nagtatakda ng panahon; pinananatili nito ang diwang temporal nang hindi matigas ang Tagalog.
- source_word: ἀνέκειτο
  choice: nakahilig siya sa hapag
  rationale: Tumutukoy ang pandiwa sa kaugalian ng paghilig habang kumakain, hindi sa simpleng pag-upo o paghiga. Idinagdag ang “sa hapag” upang likas na maipahayag sa Tagalog ang konteksto ng pagkain na taglay ng pandiwa.
- source_word: μετὰ
  choice: kasama ang
  rationale: Tuwirang ipinahahayag nito ang pakikisama o pagiging kapiling na tinutukoy ng μετά na may genitive.
- source_word: τῶν δώδεκα μαθητῶν
  choice: ang labindalawang alagad
  rationale: Isinasalin ang μαθητῶν na nasa SBLGNT. Ang “alagad” ang karaniwan, malinaw, at angkop na tawag sa mga μαθηταί ni Jesus sa mga Ebanghelyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “nakahilig sa hapag” upang ilarawan ang sinaunang ayos ng pagkain nang hindi ipinapalagay ang modernong pag-upo sa mesa.
