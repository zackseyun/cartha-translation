  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: tl
  text: Pagkatapos, dinuraan nila siya sa mukha at sinuntok siya. Sinampal naman siya ng iba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa makabagong Filipino.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: dinuraan nila siya sa mukha
  rationale: Ang ἐμπτύω ay nangangahulugang dumura, at ang pariralang εἰς τὸ πρόσωπον ay tumutukoy sa tuwirang pagdura sa mukha bilang hayag na paghamak.
- source_word: ἐκολάφισαν αὐτόν
  choice: sinuntok
  rationale: Ang κολαφίζω ay tumutukoy sa paghampas gamit ang kamao; pinananatili ng “sinuntok” ang tiyak at marahas na kilos nang natural sa Filipino.
- source_word: οἱ δὲ ἐράπισαν
  choice: Sinampal naman siya ng iba
  rationale: Ginagamit nang substantibo ang οἱ upang tukuyin ang “iba,” samantalang ang ῥαπίζω ay karaniwang paghampas gamit ang bukás na palad. Ipinahihiwatig ng konteksto na si Jesus ang layon.
- source_word: δέ
  choice: naman
  rationale: Mahinang paglilipat ito sa kilos ng ibang mga tao, hindi matinding pagsalungat; ang “naman” ay natural na naghihiwalay sa dalawang grupo o kilos.
theological_decisions:
- issue: Paglalarawan sa paghamak at pananakit kay Jesus
  choice: Tahasang isalin ang pagdura, pagsuntok, at pagsampal.
  alternative: Gumamit ng pangkalahatang paglalarawan gaya ng “binugbog” o “pinagmalupitan.”
  rationale: Tiyak na pinapangalanan ng Griyego ang bawat kilos. Ang kongkretong salin ay hindi nagpapalabnaw sa kahihiyan at pisikal na pananakit, at hindi rin nagdaragdag ng komentaryong teolohikal.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang payak ngunit tiyak na mga pandiwang “dinuraan,” “sinuntok,” at “sinampal” upang madaling maunawaan at mapanatili ang lakas ng orihinal.
