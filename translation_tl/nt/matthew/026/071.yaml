  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: tl
  text: Ngunit paglabas niya patungo sa tarangkahan, nakita siya ng isa pang babae at sinabi nito sa mga naroon, “Ang taong ito ay kasama ni Jesus na taga-Nazaret.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: tarangkahan
  rationale: Tumutukoy sa pasukan o gateway ng bakuran; ang “tarangkahan” ay natural at malinaw sa modernong Filipino.
- source_word: ἄλλη
  choice: isa pang babae
  rationale: Ang pambabaeng anyo ng pang-uri ay tumutukoy sa isa pang babae, kasunod ng alilang babae sa naunang talata.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman nasa historical present ang Griyego (“sinasabi”), mas natural sa salaysay na Filipino ang pangnagdaang “sinabi” nang hindi binabago ang kahulugan.
- source_word: τοῦ Ναζωραίου
  choice: na taga-Nazaret
  rationale: Likas na Filipino para sa gentilisyong tumutukoy kay Jesus bilang mula sa Nazaret.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at angkop sa salaysay. Pinanatili ang pagtukoy na “ang taong ito” upang maihatid ang demonstratibong Οὗτος at ang pampublikong pagkilala kay Pedro.
