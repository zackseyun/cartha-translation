  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: tl
  text: O iniisip mo bang hindi ko kayang makiusap sa aking Ama[a], at agad niyang ipagkakaloob sa akin[b] ang mahigit sa labindalawang lehiyon[c] ng mga anghel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumawag sa aking Ama” o “humingi sa aking Ama.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ilalagay niya sa tabi ko”; ibig sabihin, gagawing handang tumulong sa akin.
    reason: lexical_alternative
  - marker: c
    text: Ang lehiyon ay isang malaking yunit ng hukbong Romano. Idinidiin ng pahayag ang napakalaking puwersang makalangit.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinagpapatuloy nito ang pagsaway ni Jesus sa pamamagitan ng isang alternatibong retorikal na tanong.
- source_word: δοκεῖς
  choice: iniisip mo ba
  rationale: Natural sa makabagong Tagalog at pinananatili ang tuwirang lakas ng retorikal na tanong.
- source_word: οὐ δύναμαι
  choice: hindi ako maaaring
  rationale: Ipinapahayag ng pandiwa ang kakayahan, hindi ang pahintulot o kagustuhan.
- source_word: παρακαλέσαι
  choice: humingi sa
  rationale: Sa konteksto, tumutukoy ito sa paghingi ng tulong sa Ama; malinaw at natural ito sa Tagalog nang hindi pinahihina ang diwa ng pagsusumamo.
- source_word: τὸν πατέρα μου
  choice: aking Ama
  rationale: Pinananatili ang tuwirang ugnayang Anak-Ama at ang karaniwang marangal na pagsulat para sa Diyos.
- source_word: παραστήσει μοι
  choice: ilalagay sa tabi ko
  rationale: Malapit sa larawan ng Griyego na paglalagay o paghaharap sa tabi ng isang tao upang maging handang tumulong.
- source_word: ἄρτι
  choice: agad
  rationale: Ipinahihiwatig ang agarang pagkakaroon ng tulong sa mismong pagkakataong iyon.
- source_word: πλείω δώδεκα
  choice: mahigit sa labindalawa
  rationale: Tuwirang ipinapahayag ang daming lumalampas sa labindalawa.
- source_word: λεγιῶνας
  choice: lehiyon
  rationale: Pinananatili ang Romanong terminong militar at ang larawan ng napakalaking hukbo.
- source_word: ἀγγέλων
  choice: ng mga anghel
  rationale: Malinaw sa konteksto na mga makalangit na nilalang ang tinutukoy.
theological_decisions:
- issue: Kung ang pahayag ni Jesus ay tungkol sa kakayahan, pahintulot, o kagustuhang humingi ng tulong sa Diyos
  choice: hindi ako maaaring humingi sa aking Ama
  alternative: ayaw kong humingi sa aking Ama
  rationale: Ang δύναμαι ay tumutukoy sa kakayahan o kapangyarihan. Pinananatili ng salin na lubos na kaya ni Jesus na humingi ng napakalaking makalangit na tulong, nang hindi ipinapaliwanag kung bakit hindi niya iyon ginagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong, ang agarang diwa ng ἄρτι, at ang militar na larawang “lehiyon.”
