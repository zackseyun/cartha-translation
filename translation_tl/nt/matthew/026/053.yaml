revisions:
- from: O iniisip mo bang hindi ako maaaring humingi sa aking Ama[a], at agad niyang ilalagay sa tabi ko[b] ang mahigit sa labindalawang lehiyon ng mga anghel?[c]
  to: O iniisip mo bang hindi ko kayang makiusap sa aking Ama[a], at agad niyang ipagkakaloob sa akin[b] ang mahigit sa labindalawang lehiyon[c] ng mga anghel?
  rationale: Nilinaw ang diwa ng kakayahan sa οὐ δύναμαι, ginawang mas natural ang pagsasalin ng παραστήσει μοι nang hindi inaalis ang literal na larawan sa talababa, at inayos ang angkla ng talababang pangkultura. Pinananatili ng salin ang retorikal na tanong, ang agarang diwa ng ἄρτι, at ang hindi tinutukoy na eksaktong bilang na “mahigit sa labindalawa.”
