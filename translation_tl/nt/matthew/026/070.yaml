  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: tl
  text: Ngunit ikinaila niya ito sa harap ng lahat at sinabi, “Hindi ko alam ang sinasabi mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ikinaila niya iyon
  rationale: Ang pandiwa ay tumutukoy sa pagtanggi ni Pedro sa paratang na kababanggit lamang. Idinagdag ang likas na ipinahihiwatig na layon na “iyon” upang maging malinaw at natural sa Tagalog nang hindi tinutukoy nang higit sa sinasabi ng konteksto.
- source_word: ἔμπροσθεν πάντων
  choice: sa harap nilang lahat
  rationale: Pinananatili nito ang pampublikong katangian ng pagkakaila at ang pagtukoy sa lahat ng naroon.
- source_word: λέγων
  choice: at sinabi
  rationale: Natural na inililipat sa Tagalog bilang sugnay na magkakaugnay; hindi binabago nito ang ugnayan ng participle sa pangunahing pandiwa.
- source_word: Οὐκ οἶδα
  choice: Hindi ko alam
  rationale: Tuwiran at karaniwang modernong Tagalog para sa tahasang pagkakaila ng kaalaman.
- source_word: τί λέγεις
  choice: ang sinasabi mo
  rationale: Malapit sa literal na diwa ng Griyego at natural pa rin sa Tagalog; hindi nito dinaragdagan ang pahayag ng kahulugang “ang ibig mong sabihin.”
theological_decisions:
- issue: Ang tiyak na layon ng pagkakaila ni Pedro
  choice: Ang ipinahihiwatig na paratang ang kanyang ikinaila, na tinukoy lamang bilang “iyon.”
  alternative: Tahasang sabihing ikinaila niya si Jesus o ikinaila niyang kilala niya si Jesus.
  rationale: Walang tahasang layon ang ἠρνήσατο sa talata. Ang “iyon” ay tumutulong sa natural na Tagalog ngunit hindi nagpapasok ng mas tiyak na interpretasyon kaysa sa agarang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ikinaila” sa halip na mas kolokyal na “itinanggi” upang umangkop sa salaysay at sa pampublikong pagtanggi, habang nananatiling madaling maunawaan.
