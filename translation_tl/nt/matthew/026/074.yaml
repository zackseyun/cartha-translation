base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: tl
  text: Noon ay nagsimula siyang manawagan ng sumpa at manumpa[a], “Hindi ko kilala ang taong iyon.” At agad na tumilaok ang isang tandang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “nagsimula siyang tumawag ng mga sumpa at manumpa.” Malamang na tumawag siya ng sumpa sa kanyang sarili upang pagtibayin ang kanyang pagkakaila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Nang magkagayo’y
  rationale: Likas at marangal na panandang pasalaysay para sa kasunod na pangyayari.
- source_word: ἤρξατο
  choice: nagsimula siyang
  rationale: Pinananatili ang pasimulang diwa at ang paglala ng pagkakaila ni Pedro.
- source_word: καταθεματίζειν
  choice: manumpa nang may panunumpa ng sumpa
  rationale: Ipinahihiwatig ang pagtawag ng sumpa bilang pagpapatibay sa sinabi, hindi simpleng pagmumura o pagsumpa kay Jesus; iniiwasan ding gawing tahasan sa teksto ang hindi hayagang layong 'sa sarili.'
- source_word: ὀμνύειν
  choice: manumpa
  rationale: Tumutukoy sa taimtim na panunumpa; isinama sa pariralang nagpapakita ng dalawang magkaugnay na kilos sa Griyego.
- source_word: ὅτι
  choice: panandang tuwirang sipi
  rationale: Ipinapakilala nito ang nilalaman ng panunumpa; pinakamalinaw sa Filipino ang tuwirang sipi.
- source_word: Οὐκ οἶδα
  choice: Hindi ko kilala
  rationale: Sa konteksto ng pagkakaila sa isang tao, mas likas ang 'hindi ko kilala' kaysa 'hindi ko alam.'
- source_word: τὸν ἄνθρωπον
  choice: ang taong iyon
  rationale: Tumutukoy kay Jesus habang pinananatili ang mapaglayong tono ng pagkakaila; likas itong katumbas sa Filipino ng 'the man' sa kontekstong ito.
- source_word: καὶ εὐθέως
  choice: At kaagad
  rationale: Pinananatili ang biglaang pagtupad sa naunang sinabi ni Jesus.
- source_word: ἀλέκτωρ
  choice: isang tandang
  rationale: Ang pangngalan ay walang artikulo; natural sa Filipino ang 'isang tandang.'
- source_word: ἐφώνησεν
  choice: tumilaok
  rationale: Ito ang tiyak at likas na pandiwang Filipino para sa sigaw ng tandang.
theological_decisions:
- issue: Diwa ng καταθεματίζειν sa pagkakaila ni Pedro
  choice: Isinalin bilang panunumpang may kaakibat na sumpa, at ipinaliwanag sa talababa na malamang ay pagtawag ng sumpa sa sarili.
  alternative: Simpleng 'nagmura' o tahasang 'isinumpa niya si Jesus.'
  rationale: Dahil kaugnay ito ng ὀμνύειν, pinakanatural itong unawain bilang panunumpang pinatibay ng sumpa. Hindi ipinapalagay na si Jesus ang isinumpa, at hindi rin ginagawang tiyak sa pangunahing teksto ang ipinahihiwatig lamang na sumpa sa sarili.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang 'Nang magkagayo’y' ay pasalaysay at pormal nang bahagya; ang natitirang pangungusap ay tuwiran at madaling maunawaan. Ginamit ang talababa upang mapanatili sa teksto ang tunay na lawak ng kahulugan ng καταθεματίζειν.
