  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: tl
  text: Pagkatapos, lumapit siya sa mga alagad at sinabi sa kanila[a], “Matulog pa kayo at magpahinga. Tingnan ninyo, malapit na ang oras[b], at ang Anak ng Tao ay ipinauubaya sa kamay ng mga makasalanan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Natutulog at nagpapahinga pa rin ba kayo?” Maaaring isang retorikal na tanong na may bahid ng panunumbat ang pananalitang Griyego.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “dumating na ang oras” o “narito na ang oras.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “ipinagkakanulo.” Mas malawak ang salitang Griyego at maaari itong mangahulugang “ibinibigay” o “isinasalin sa kapangyarihan ng iba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa makabagong Tagalog para sa kasunod na pangyayari.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: lumapit siya sa mga alagad
  rationale: Ang makasaysayang pangkasalukuyan ng Griyego ay natural na isinasalaysay sa pangnagdaan sa Tagalog; malinaw na ipinahihiwatig ng πρός ang paglapit.
- source_word: λέγει αὐτοῖς
  choice: sinabi sa kanila
  rationale: Natural na katumbas sa salaysay na Tagalog, kasuwato ng pangnagdaang anyo ng naunang pandiwa.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Matulog pa kayo at magpahinga
  rationale: Pinananatili ang panlabas na anyong pautos at ang posibleng mapait o mapagparayang himig, nang hindi tahasang ginagawang tanong ang tunay na malabong puwersa ng Griyego.
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Makabago ngunit marangal na panawag-pansin, na mas natural kaysa sa makalumang “Narito.”
- source_word: ἤγγικεν ἡ ὥρα
  choice: malapit na ang oras
  rationale: Ipinahahayag ang kasalukuyang pagkalapit na bunga ng perfect na ἤγγικεν, nang hindi ito tahasang pinapakahulugang lubos nang dumating.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng mahalagang katawagan sa sarili ni Jesus.
- source_word: παραδίδοται
  choice: ay ibinibigay
  rationale: Pinananatili ang mas malawak na diwa ng pagsasalin o pagbibigay sa kapangyarihan ng iba, sa halip na paliitin agad sa “ipinagkakanulo.”
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: sa mga kamay ng mga makasalanan
  rationale: Malinaw at likas sa Tagalog ang kongkretong idyoma ng Griyego.
theological_decisions:
- issue: Puwersa ng Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: “Matulog pa kayo at magpahinga.”
  alternative: “Natutulog at nagpapahinga pa rin ba kayo?”
  rationale: Maaaring unawain ang pananalita bilang mapait o retorikal na tanong, ngunit walang tahasang tandang pananong sa Griyego. Pinananatili ng pangunahing teksto ang anyong pautos at ang tensiyon sa kasunod na pahayag.
- issue: Kahulugan ng παραδίδοται sa salaysay ng paghihirap
  choice: “ay ibinibigay”
  alternative: “ay ipinagkakanulo” o “ay ibinibigay sa kapangyarihan”
  rationale: Saklaw ng pandiwa ang pagkakanulo ngunit mas malawak rito. Iniiwasan ng salin na ituon lamang kay Judas ang kilos o tukuyin nang labis ang ahensiya sa pasibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangnagdaan para sa natural na pagsasalaysay sa Tagalog, bagaman makasaysayang pangkasalukuyan ang Griyego. Iningatan ang kalabuan ng unang pangungusap at ang malawak na diwa ng παραδίδοται.
