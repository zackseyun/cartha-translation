  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: tl
  text: Manatili kayong gising at manalangin[a] upang hindi kayo pumasok sa tukso. Ang espiritu ay handa, ngunit mahina ang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagsubok” o “matinding pagsubok” para sa “tukso” (πειρασμόν). Ang salitang Griyego ay maaaring tumukoy sa pag-akit na magkasala o sa isang pagsubok na dinaranas.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Manatili kayong gising
  rationale: Tuwirang ipinapahayag ang utos na huwag matulog sa konteksto ng Getsemani, habang taglay pa rin ang diwa ng patuloy na pagbabantay.
- source_word: προσεύχεσθε
  choice: manalangin
  rationale: Likas, malinaw, at marangal na salin ng pangmaramihang utos; kasabay ng naunang utos, ipinahihiwatig nito ang patuloy na pananalangin.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: upang hindi kayo mapasok
  rationale: Pinananatili ang layunin o pag-iwas na ipinahahayag ng ἵνα μή at ang larawan ng pagpasok sa isang kalagayan, sa halip na ipakahulugang agad bilang pagkahulog.
- source_word: πειρασμόν
  choice: tukso
  rationale: Sa agarang konteksto, nagbababala si Jesus tungkol sa panganib ng pagkabigo sa ilalim ng matinding panggigipit. Gayunman, inilalahad sa talababa ang maaari ring kahulugang pagsubok.
- source_word: τὸ μὲν πνεῦμα
  choice: Ang espiritu
  rationale: Maliit na titik ang ginamit sapagkat malamang na tumutukoy ito sa panloob na hangarin o disposisyon ng tao, bagaman hindi lubusang isinasara ng salin ang ibang pagbasa.
- source_word: πρόθυμον
  choice: handa
  rationale: Saklaw ng πρόθυμος ang pagiging handa, bukal, o masigasig. Ang 'handa' ay natural at maikli, at akma sa kaibahan sa kahinaan ng laman.
- source_word: ἡ δὲ σὰρξ
  choice: ngunit mahina ang laman
  rationale: Pinananatili ang biblikal na larawang 'laman' at ang kaibahan nito sa espiritu, nang hindi ito ipinapakahulugan bilang 'makasalanang kalikasan' o simpleng 'katawan.'
- source_word: ἀσθενής
  choice: mahina
  rationale: Ito ang tuwiran at natural na katumbas sa konteksto ng kahinaan at pagkukulang ng tao.
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: espiritu ng tao o panloob na disposisyon, na may maliit na titik
  alternative: ang Banal na Espiritu
  rationale: Ang kaibahan sa 'laman' at ang konteksto ng tapat na hangarin ngunit aktuwal na pagkabigo ng mga alagad ay pumapabor sa espiritu ng tao. Hindi dinaragdagan ng salin ang teksto ng isang tiyak na pahayag tungkol sa Banal na Espiritu.
- issue: Kahulugan ng σάρξ
  choice: laman
  alternative: katawan; makasalanang kalikasan
  rationale: Dito ay nakatuon ang salita sa kahinaan ng tao bilang nilalang na may katawan, hindi sa isang hayagang binuong konsepto ng 'makasalanang kalikasan.' Pinananatili ng 'laman' ang metapora at teolohikal na tensiyon.
- issue: Saklaw ng πειρασμός
  choice: tukso sa pangunahing teksto
  alternative: pagsubok
  rationale: Ang nalalapit na pagkabigo ng mga alagad ay umaayon sa 'tukso,' ngunit maaaring tumukoy ang salitang Griyego sa isang pagsubok na dinaranas. Kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang pangmaramihang kausap sa 'kayong/kayo,' ang metapora ng pagpasok sa tukso, at ang biblikal na kaibahan ng 'espiritu' at 'laman.'
