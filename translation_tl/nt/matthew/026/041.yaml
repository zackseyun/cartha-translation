review_pass:
  verdict: revise
  source_fidelity: Kailangang itama ang “upang hindi kayo mapasok sa tukso.” Ang εἰσέλθητε ay aktibong “pumasok,” kaya ang mga alagad ang hindi dapat pumasok sa πειρασμόν; ang kasalukuyang salin ay nagiging tila ang tukso ang pumapasok sa kanila. Ang iba pang bahagi ay tapat sa Griyego at maayos na pinananatili ang kaibahan ng espiritu at laman.
  naturalness: Natural at marangal ang “Manatili kayong gising at manalangin,” “Ang espiritu ay handa,” at “mahina ang laman.” Mas natural at wastong larawan sa Filipino ang “upang hindi kayo pumasok sa tukso.”
  terminology: Ang “tukso,” “espiritu,” at “laman” ay angkop. Ang maliit na titik sa “espiritu” ay hindi nagpipilit ng pagbasa na Banal na Espiritu. Dapat ding panatilihin ng talababa ang saklaw na “pagsubok” at “matinding pagsubok,” hindi lamang isang alternatibo.
  issues:
  - severity: high
    issue: Mali ang direksiyon ng pandiwang “mapasok.”
    rationale: Ang Griyegong ἵνα μὴ εἰσέλθητε εἰς πειρασμόν ay “upang hindi kayo pumasok sa tukso/pagsubok,” hindi “upang hindi kayo mapasok sa tukso.” Ang kasalukuyang anyo ay naglilipat ng pagkilos sa tukso.
  - severity: low
    issue: Hindi ganap na naipapakita ng talababa ang saklaw ng πειρασμόν.
    rationale: Maaaring mangahulugan ang termino ng tukso, pagsubok, o matinding pagsubok/pagdaraan sa pagsubok. Makabubuting isaad ang dalawang alternatibong saklaw upang mapanatili ang leksikal na kalabuan.
  revised_text: Manatili kayong gising at manalangin[a] upang hindi kayo pumasok sa tukso. Ang espiritu ay handa, ngunit mahina ang laman.
