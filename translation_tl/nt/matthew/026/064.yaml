  to: 'Sinabi sa kanya ni Jesus, “Ikaw ang nagsabi.[a] Ngunit sinasabi ko sa inyo: mula ngayon, makikita ninyo ang Anak ng Tao na nakaupo sa kanan ng Kapangyarihan[b] at dumarating sa mga ulap ng langit.”[c]'
