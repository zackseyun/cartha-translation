  source_fidelity: 'Ang salin ay tapat sa Griyego: nananatili ang paglipat mula sa isahang kausap ("sa kanya") tungo sa maramihang kausap ("sa inyo/ninyo"), ang titulong “Anak ng Tao,” ang mapitagang “Kapangyarihan,” at ang magkatuwang na larawan ng pag-upo sa kanan at pagdating sa mga ulap. Gayunman, ang “na” sa “Ikaw na ang nagsabi” ay maaaring magdagdag ng diin na wala sa Σὺ εἶπας. Mas tuwiran at mas ligtas ang “Ikaw ang nagsabi.”'
