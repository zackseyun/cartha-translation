  terminology: Wastong pinanatili ang “Anak ng Tao” at “Kapangyarihan.” Ang “Kapangyarihan” ay angkop bilang mapitagang di-tuwirang pagtukoy sa Diyos. Ang talababa para sa alusyon ay mas malinaw kung tatawaging “Alusyon” kaysa sa malabong panghalip na “Tumutukoy ito.”
