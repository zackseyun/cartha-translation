id: MAT.26.64
reference: Matthew 26:64
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: tl
  text: 'Sinabi sa kanya ni Jesus, “Ikaw ang nagsabi.[a] Ngunit sinasabi ko sa inyo: mula ngayon, makikita ninyo ang Anak ng Tao na nakaupo sa kanan ng Kapangyarihan[b] at dumarating sa mga ulap ng langit.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ikaw ang nagsabi niyan.” Ang pananalitang Griyego ay isang idyomatikong sagot na nagpapatibay.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kapangyarihan” ay isang mapitagang paraan ng pagtukoy sa Diyos.
    reason: cultural_note
  - marker: c
    text: Alusyon ito sa Daniel 7:13 at Awit 110:1.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Ikaw na ang nagsabi
  rationale: Pinananatili ang anyo ng idyomatikong sagot sa Griyego at ang di-tahasang paraan ng pagpapatibay, sa halip na gawing payak na “Oo.”
- source_word: πλὴν
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat na naghahatid mula sa sagot tungo sa solemneng pahayag.
- source_word: ἀπ’ ἄρτι
  choice: mula ngayon
  rationale: Malinaw na ipinahihiwatig ang panahong nagsisimula sa puntong ito, nang hindi nililimitahan sa mismong sandaling iyon.
- source_word: ὄψεσθε
  choice: makikita ninyo
  rationale: Tuwirang salin ng panghinaharap na anyo ng ὁράω; ipinakikita rin ng maramihang “ninyo” ang pagbabago mula sa isahang kausap tungo sa pangkat.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang titulo at ang kaugnayan nito sa Daniel 7.
- source_word: καθήμενον
  choice: nakaupo
  rationale: Natural na Tagalog para sa participle at, sa konteksto ng kanan ng Kapangyarihan, nananatili ang larawan ng pagluklok at karangalan.
- source_word: ἐκ δεξιῶν
  choice: sa kanan ng
  rationale: Natural na katumbas sa Tagalog ng posisyon ng karangalan at awtoridad.
- source_word: τῆς δυνάμεως
  choice: Kapangyarihan
  rationale: Pinananatili ang magalang na di-tuwirang pagtukoy sa Diyos nang hindi ipinapalit ang tahasang “Diyos” sa salita ng teksto.
- source_word: ἐρχόμενον
  choice: dumarating
  rationale: Pinananatili ang galaw at ang alusyon sa Daniel 7 nang hindi ito binibigyang ng mas makitid na interpretasyong temporal.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: sa mga ulap ng langit
  rationale: Natural at malinaw na Tagalog na nagpapanatili sa imahen ng Daniel 7:13.
theological_decisions:
- issue: Lakas ng sagot na Σὺ εἶπας
  choice: “Ikaw na ang nagsabi,” bilang idyomatikong pagpapatibay na nagpapanatili sa mismong pormulasyon ni Jesus.
  alternative: Tahasang “Oo” o pagbasa rito bilang pag-iwas sa sagot.
  rationale: Ang pahayag ay may puwersang nagpapatibay sa konteksto, ngunit ang simpleng “Oo” ay nag-aalis sa natatanging anyo ng Griyego, samantalang ang pagbasa rito bilang pag-iwas ay nagpapahina sa tugon.
- issue: Tinutukoy ng “Kapangyarihan”
  choice: Panatilihin bilang magalang na di-tuwirang pagtukoy sa Diyos.
  alternative: Isalin nang tahasan bilang “Diyos” o bilang “Makapangyarihan.”
  rationale: Malamang na mapitagang pagpapalit ito sa tuwirang pagbanggit sa Diyos; pinananatili ng salin ang pagpipigil at rehistrong teolohikal ng pinagmulan.
- issue: Saklaw at panahon ng “makikita ninyo”
  choice: Panatilihing magkasama ang pagkaluklok sa kanan at pagdating sa mga ulap, nang hindi nagtatakda ng iisang iskedyul ng katuparan.
  alternative: Ituring ang lahat bilang agarang katuparan lamang o bilang eksklusibong pagtukoy sa malayong muling pagparito.
  rationale: Kapwa participle ang bumubuo sa nilalaman ng makikita nila; hindi nilulutas ng salin ang tunay na tensiyong eskatolohikal ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang titulong “Anak ng Tao,” ang di-tuwirang banal na katawagang “Kapangyarihan,” at ang maramihang “ninyo” ng Griyego. Inilagay ang mga talababa sa mismong pariralang kanilang ipinapaliwanag.
