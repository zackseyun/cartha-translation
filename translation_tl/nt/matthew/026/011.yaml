translation:
  language: tl
  text: Sapagkat palagi ninyong kasama ang mga mahihirap, ngunit hindi ninyo ako palaging kasama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: lagi / laging
  rationale: Likas sa makabagong Tagalog at pinananatili ang pag-uulit at temporal na paghahambing sa dalawang sugnay.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan nito sa naunang pahayag sa isang malinaw at marangal na paraan.
- source_word: τοὺς πτωχοὺς
  choice: ang mga dukha
  rationale: Tumutukoy ito sa mga taong mahihirap bilang isang pangkat. Ang “mga dukha” ay maikli, dignified, at hindi nagpapahiwatig na pag-aari sila ng mga alagad.
- source_word: ἔχετε
  choice: ninyong kasama / ninyo ... kasama
  rationale: Sa kontekstong ito, ang ἔχω ay nagsasaad ng patuloy na presensiya o pagiging kasama, hindi ng pagmamay-ari. Mas natural sa Tagalog ang ganitong ayos kaysa literal na “mayroon kayo.”
- source_word: μεθ’ ἑαυτῶν
  choice: ninyong kasama
  rationale: Malinaw na inilalarawan ang presensiya sa piling ng mga kausap, nang hindi gumagamit ng alanganing literal na “kasama ng inyong sarili.”
- source_word: ἐμὲ
  choice: ako
  rationale: Tuwirang tumutukoy kay Jesus bilang layon ng ἔχετε; hinihingi ng natural na konstruksiyong Tagalog ang anyong “ako” sa “hindi ninyo ako ... kasama.”
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na minamarkahan ang pagsalungat ng palagiang presensiya ng mga dukha at ng hindi palagiang presensiya ni Jesus.
- source_word: οὐ πάντοτε
  choice: hindi ... laging
  rationale: Pinananatili ang temporal na pagtanggi at ang malinaw na pag-uulit ng πάντοτε nang hindi pinalalawak ang kahulugan.
theological_decisions:
- issue: Ipinahihiwatig ng presensiya ni Jesus
  choice: 'Pinananatili ang temporal na paghahambing: laging kasama ng mga alagad ang mga dukha, ngunit hindi laging kasama nila si Jesus.'
  alternative: Unawain ang talata bilang pagmamaliit sa pangangalaga sa mga dukha.
  rationale: Temporal na pagsalungat ang tahasang ipinahahayag ng Griyego, hindi moral na paghamak sa mga dukha. Hindi dinaragdagan ng salin ang teksto ng paliwanag tungkol sa paraan ng presensiya ni Jesus o ng aral na laban sa pagkakawanggawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga dukha” bilang maikli at dignified na kolektibong tawag, habang inilagay sa talababa ang mas pangkaraniwang “mahihirap.” Pinanatili ang magkatapat na “lagi/laging” upang marinig ang pag-uulit sa Griyego.
