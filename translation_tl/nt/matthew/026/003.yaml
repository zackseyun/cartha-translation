    text: Maaari ring “tinipon ang mga punong pari at ang mga nakatatanda ng bayan.” Balintiyak ang anyo ng pandiwang Griyego; ang “nagkatipon” ay likas na Tagalog na paglalarawan ng kanilang pagsasama-sama.
