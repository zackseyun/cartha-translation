lexical_decisions:
- source_word: Τότε
  choice: Nang panahong iyon
  rationale: Nagsisilbi itong panandang temporal na nag-uugnay sa pangyayaring ito sa naunang sinabi; natural ito sa Tagalog at hindi labis na nililinaw ang eksaktong pagitan ng oras.
- source_word: συνήχθησαν
  choice: nagkatipon
  rationale: Likas na Tagalog para sa pagdating at pagsasama-sama ng pangkat. Hindi nito tinutukoy kung may tahasang ahenteng nagtipon sa kanila; nililinaw sa talababa na balintiyak ang anyong Griyego.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa mga pangunahing awtoridad na pari, hindi sa maraming may hawak ng nag-iisang tungkulin ng pinakapunong pari.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: mga nakatatanda sa bayan
  rationale: Ipinahihiwatig ang kinikilalang matatandang pinuno ng sambayanan habang pinananatili ang payak na ugnayang genitibo.
- source_word: εἰς τὴν αὐλὴν
  choice: sa patyo
  rationale: Sa pandiwa ng pagtitipon, natural sa Tagalog na banggitin ang kinalalagyan ng nagtipong pangkat. Ang αὐλή ay maaaring tumukoy sa patyo ng isang malaking tirahan, kaya pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: τοῦ ἀρχιερέως
  choice: ng pinakapunong pari
  rationale: Malinaw na tumutukoy sa nag-iisang may hawak ng mataas na katungkulang ito sa konteksto at iniiwasang ipagkamali sa pangmaramihang “mga punong pari.”
- source_word: τοῦ λεγομένου Καϊάφα
  choice: na tinatawag na Caifas
  rationale: Malapit na sinasalamin ang participial na pariralang Griyego at natural na ipinakikilala ang pangalan sa Tagalog.
