id: MAT.26.54
reference: Matthew 26:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: tl
  text: Kung gayon, paano matutupad ang mga Kasulatan na nagsasabing kailangang mangyari ito sa ganitong paraan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung gayon, paano matutupad ang mga Kasulatan, na kailangang mangyari ito sa ganitong paraan?”
    reason: Mas pormal na salin na pinananatili ang tuwirang pagkakaugnay ng ὅτι (“na”) at ng kasunod na sugnay.
lexical_decisions:
- source_word: πῶς οὖν
  choice: Kung gayon, paano
  rationale: Likas sa modernong Tagalog bilang panimulang retorikal na tanong at malinaw na nag-uugnay sa naunang sinabi ni Jesus.
- source_word: πληρωθῶσιν
  choice: matutupad
  rationale: Ipinahahayag ng anyong pasibo at pasakali sa retorikal na tanong na, kung hahadlangan ang mga pangyayari, paano pa matutupad ang Kasulatan.
- source_word: αἱ γραφαὶ
  choice: ang mga Kasulatan
  rationale: Tumutukoy sa mga banal na kasulatan ng Israel, hindi sa mga karaniwang sulatin.
- source_word: ὅτι
  choice: na nagsasabing
  rationale: Nililinaw sa natural na Tagalog na ipinakikilala ng ὅτι ang nilalaman ng sinasabi ng mga Kasulatan, nang hindi dinaragdagan ang diwa.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Tumutukoy sa paraan ng pagyayari ng pagdakip at pagdurusa ni Jesus; malinaw at kasalukuyang gamit sa Tagalog.
- source_word: δεῖ γενέσθαι
  choice: kailangang mangyari ito
  rationale: Pinananatili ang mariing pangangailangan ng δεῖ at ang pangyayaring tinutukoy ng γενέσθαι nang hindi tahasang nagdaragdag ng paliwanag tungkol sa pinagmumulan ng pangangailangan.
theological_decisions:
- issue: Uri ng pangangailangang ipinahahayag ng δεῖ
  choice: kailangang mangyari ito
  alternative: kailangang mangyari ito ayon sa kalooban ng Diyos
  rationale: Ipinahihiwatig ng katuparan ng Kasulatan ang banal na pangangailangan, ngunit hindi tahasang sinasabi ng Griyego ang idinagdag na pariralang “ayon sa kalooban ng Diyos.”
- issue: Ugnayan ng ὅτι sa “mga Kasulatan”
  choice: na nagsasabing
  alternative: sapagkat
  rationale: Mas malamang na ipinakikilala rito ng ὅτι ang nilalaman ng Kasulatan. Pinananatili ng salin ang ugnayang ito sa natural na Tagalog, habang kinikilala sa talababa ang mas pormal at mas malapit sa estruktura ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Kasulatan” bilang nakagawiang pantukoy sa banal na kasulatan, at iniwasan ang makaluma o sobrang pormal na “maganap” at “sa gayong paraan.”
