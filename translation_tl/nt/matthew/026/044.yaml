  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: tl
  text: At iniwan niya sila at muling lumayo. Nanalangin siya sa ikatlong pagkakataon habang muli niyang sinasabi ang gayon ding sinabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gayon ding mga salita” o “iyon ding sinabi.” Sa Griyego, isahan ang λόγον, na maaaring mangahulugang “salita,” “sinabi,” o “pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: iniwan niya sila
  rationale: Ipinahahayag ng aorist participle ang pag-iwan ni Jesus sa mga alagad bago siya lumayo; natural sa Tagalog ang tahasang sugnay.
- source_word: πάλιν ἀπελθὼν
  choice: muli ... lumayo
  rationale: Pinananatili ang unang πάλιν bilang tanda na inulit niya ang paglayo sa mga alagad.
- source_word: προσηύξατο
  choice: nanalangin siya
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang manalangin; ang pangnagdaan ay angkop sa salaysay.
- source_word: ἐκ τρίτου
  choice: sa ikatlong pagkakataon
  rationale: Natural at malinaw na Filipino para sa idyomang tumutukoy sa ikatlong pag-ulit ng kilos.
- source_word: τὸν αὐτὸν λόγον
  choice: ang gayon ding pananalita
  rationale: Pinananatili ang isahang anyo at ang diwa ng parehong sinabi, nang hindi nililimitahan ang λόγος sa isang literal na salita lamang.
- source_word: εἰπὼν πάλιν
  choice: muling sinabi
  rationale: Pinananatili ang ikalawang πάλιν at ipinakikitang inulit ang nilalaman ng panalangin.
theological_decisions:
- issue: Pag-uulit ng panalangin
  choice: Malinaw na sinasabing ito ang ikatlong pananalangin at muli niyang sinabi ang gayon ding pananalita.
  alternative: Maaaring alisin ang ikalawang “muli” upang maging mas maikli ang pangungusap.
  rationale: May dalawang πάλιν sa teksto ng SBLGNT; ang pagpapanatili sa dalawa ay nag-iingat sa diin ng salaysay nang hindi nagbibigay ng dagdag na teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na participle, habang pinananatili ang ayos at pag-uulit ng mga kilos sa Griyego.
