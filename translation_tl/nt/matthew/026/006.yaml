  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: tl
  text: Nang nasa Betania si Jesus[a], sa bahay ni Simon na ketongin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Habang nasa Betania si Jesus.” Isang konstruksiyong Griyego ang nagtatakda rito ng panahong pinangyarihan ng tagpo.
    reason: lexical_alternative
  - marker: b
    text: Ang “ketongin” ay tumutumbas sa bansag na Griyego kay Simon. Hindi nito mismo sinasabi kung taglay pa niya noon ang kondisyon o kung dati niya itong taglay; hindi rin nito tiyak na tinutukoy lamang ang sakit na kilala ngayon bilang Hansen’s disease.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Nang nasa ... si Jesus
  rationale: Ang genitive absolute ay nagtatakda ng panahong pinangyarihan ng salaysay. Likas sa Tagalog ang “Nang nasa” at hindi nito pilit na isinasalin ang γίνομαι bilang “naging.” Ang banayad na paglipat na ipinahihiwatig ng δέ ay sapat nang naipapakita ng daloy ng pangungusap at hindi nangangailangan ng hiwalay na “ngayon.”
- source_word: ἐν Βηθανίᾳ
  choice: nasa Betania
  rationale: Tuwirang lokatibong pahayag, gamit ang karaniwang anyo ng pangalan ng lugar sa Filipino.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: sa bahay ni Simon
  rationale: Natural na Tagalog na pagpapahayag ng lokasyon at pagmamay-ari; bahay bilang pisikal na tagpuan ang tinutukoy.
- source_word: τοῦ λεπροῦ
  choice: na ketongin
  rationale: Pinananatili ang maikli at tradisyonal na bansag na ginagamit ng Griyego, nang hindi ipinapalagay kung kasalukuyan o dating kalagayan iyon. Ipinaliliwanag sa talababa ang lawak at limitasyon ng katawagan.
theological_decisions:
- issue: Kung ipinahihiwatig ng bansag kay Simon na kasalukuyan pa siyang may ketong
  choice: Panatilihin ang “Simon na ketongin” bilang bansag nang hindi tinutukoy ang panahon ng kondisyon
  alternative: Simon na dating ketongin; Simon na may sakit sa balat
  rationale: Bansag lamang ang ibinibigay ng Griyego; hindi nito sinasabi kung may kondisyon pa siya noon, gumaling na, o kung ano ang tiyak na modernong diagnosis.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Nang nasa” para sa malinaw na temporal na pagbubukas at “sa bahay ni Simon” para sa idiomatikong lokasyon. Pinanatili ang tradisyonal na bansag ngunit nilagyan ng paliwanag upang maiwasan ang di-makatwirang medikal o kronolohikal na pagpapalagay.
