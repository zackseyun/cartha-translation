  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: tl
  text: 'Sinabi niya, “Pumunta kayo sa lungsod, sa isang tao[a], at sabihin ninyo sa kanya, ‘Sinasabi ng Guro: Malapit na ang takdang panahon ko. Sa inyo ko ipagdiriwang ang Paskuwa[b] kasama ang mga alagad ko.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, tumutukoy ito sa isang tiyak ngunit sadyang hindi pinangalanang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa inyo” ay literal na malapit sa “sa piling mo” o “sa lugar mo”; sa konteksto, maaaring mangahulugang “sa bahay ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Pumunta kayo
  rationale: Natural na pangmaramihang pautos sa modernong Filipino; malinaw na ipinahahayag ang utos na humayo nang hindi nagdaragdag ng di-kailangang diin.
- source_word: πρὸς τὸν δεῖνα
  choice: sa isang taong kilala na
  rationale: Ang δεῖνα ay tumutukoy sa isang tiyak ngunit sadyang hindi pinangalanang tao. Ang parirala ay natural sa Filipino at hindi nagpapahiwatig na hindi kilala ng mga alagad ang pupuntahan.
- source_word: Ὁ διδάσκαλος
  choice: ang Guro
  rationale: Tuwirang katumbas ng διδάσκαλος at angkop bilang titulong ginagamit ni Jesus para sa sarili sa mensahe.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Malapit na ang takdang panahon ko
  rationale: Ipinahahayag ng καιρός ang makabuluhan o itinakdang panahon. Pinananatili ng salin ang lawak ng tinutukoy nito sa halip na paliitin iyon sa oras ng kamatayan o pagkain lamang.
- source_word: πρὸς σὲ
  choice: Sa inyo
  rationale: Pinananatili ang literal na ugnayang ‘sa piling/lugar mo’ nang hindi tahasang nagdaragdag ng ‘bahay,’ na wala sa Griyego. Ginamit ang magalang na maramihang anyo sa Filipino sa pakikipag-usap sa di-pinangalanang taong ito.
- source_word: ποιῶ τὸ πάσχα
  choice: ipagdiriwang ang Paskuwa
  rationale: Ang ποιέω kasama ng πάσχα ay isang idyomang nangangahulugang ipagdiwang o ganapin ang Paskuwa; natural at malinaw ito sa modernong Filipino.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Karaniwang katawagan sa Filipino para sa kapistahang Judio at sapat na naiiba sa modernong Pasko.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: kasama ang mga alagad ko
  rationale: Pinananatili ng ‘mga alagad’ ang kinikilalang ugnayan ng μαθηταί kay Jesus sa salaysay ng Ebanghelyo.
theological_decisions:
- issue: Saklaw ng nalalapit na καιρός ni Jesus
  choice: Malapit na ang takdang panahon ko
  alternative: Malapit na ang oras ko
  rationale: Hindi ganap na nililinaw ng talata kung ang καιρός ay tumutukoy lamang sa kamatayan ni Jesus, sa hapunan ng Paskuwa, o sa mas malawak na katuparan ng kanyang misyon. Pinananatili ng ‘takdang panahon’ ang tensiyong ito at iniiwasang ipasok ang bokabularyong Johannine na ‘oras.’
- issue: Lugar o pakikisama sa πρὸς σέ
  choice: Sa inyo ko ipagdiriwang
  alternative: Sa bahay ninyo ko ipagdiriwang
  rationale: Ipinahihiwatig ng konteksto ang lugar at pagtanggap ng maybahay, ngunit hindi tahasang binabanggit ng Griyego ang bahay. Kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kayo/ninyo” para sa natural at magalang na pakikipag-usap. Ang mga sipi sa loob ng sipi ay inayos nang malinaw, at ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
