  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Jesus[a], “Kaibigan, gawin mo ang ipinunta mo rito.” Pagkatapos, lumapit sila, sinunggaban si Jesus, at dinakip siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kaibigan, ano ang ipinunta mo rito?” Napakaikli ng pahayag sa Griyego at maaari itong unawain bilang isang tanong.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Kaibigan
  rationale: Likas na katawagan sa makabagong Filipino. Pinananatili nito ang pigil at hindi tahasang mapagmahal na tono ng pagtawag ni Jesus kay Judas.
- source_word: ἐφ’ ὃ πάρει
  choice: gawin mo ang ipinunta mo rito
  rationale: Inihahayag nito ang malamang na eliptikal at tila pautos o mapagpahintulot na diwa ng napakaikling parirala, nang hindi dinaragdagan ang layunin ni Judas. Inilalagay sa talababa ang posibleng pagbasa bilang tanong.
- source_word: προσελθόντες
  choice: lumapit sila
  rationale: Malinaw at natural na pagsasalaysay ng paglapit ng mga dadakip kay Jesus.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: sinunggaban si Jesus
  rationale: Ang idyoma ay tumutukoy sa marahas na pagdakma o paghawak. Ang “sinunggaban” ay likas sa Filipino at malinaw na naghahatid ng pisikal at mapanlabang kilos.
- source_word: ἐκράτησαν αὐτόν
  choice: dinakip siya
  rationale: Sa konteksto, ang κρατέω ay sapilitang paghawak at pagbihag. Ang “dinakip” ay natural sa Filipino at angkop sa pangyayari, bagaman hindi nito kinakailangang ipahiwatig ang lahat ng pormal na prosesong legal.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat o paglipat mula sa ginawa ni Judas tungo sa tugon ni Jesus.
theological_decisions:
- issue: Kahulugan ng tugon ni Jesus kay Judas
  choice: “Kaibigan, gawin mo ang ipinunta mo rito.”
  alternative: “Kaibigan, ano ang ipinunta mo rito?”
  rationale: Napakaikli at sintaktikong siksik ng Griyegong parirala. Pinananatili ng pangunahing salin ang malamang na tila pautos o mapagpahintulot na diwa, samantalang ang tunay na posibleng pagbasa bilang tanong ay inilalahad sa talababa. Hindi rin ginagawang labis na magiliw o tahasang mapanghatol ang pagtawag na “Kaibigan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinunggaban” upang likas na maipahayag ang mapanlabang idyoma ng paghawak, at pinanatili sa talababa ang tunay na kalabuan ng maikling tugon ni Jesus.
