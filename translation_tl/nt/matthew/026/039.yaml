id: MAT.26.39
reference: Matthew 26:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: tl
  text: At lumayo siya nang kaunti, nagpatirapa siya at nanalangin, na sinasabi, “Ama ko, kung maaari, nawa’y lumampas sa akin ang kopang ito[a]. Gayunman, hindi ayon sa kalooban ko, kundi ayon sa kalooban mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kopa” ay larawang biblikal para sa bahaging itinakda sa isang tao, lalo na sa pagdurusa; ihambing ang Mateo 20:22 at 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: lumakad siya nang kaunti pa
  rationale: Ipinapahayag nito ang pag-usad ni Jesus sa maikling distansiya at pinananatili ang diwa ng μικρόν nang natural sa modernong Tagalog.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: nagpatirapa siya
  rationale: Ang parirala ay tumutukoy sa pagbagsak nang nakaharap sa lupa; natural at marangal na salin ang “nagpatirapa” para sa ganitong tindig ng pananalangin.
- source_word: προσευχόμενος καὶ λέγων
  choice: nanalangin, na sinasabi
  rationale: Pinananatili nito ang magkasabay na kilos ng pananalangin at pagsasalita nang hindi dinaragdagan ang teksto.
- source_word: Πάτερ μου
  choice: Ama ko
  rationale: Tuwirang ipinapahayag ang malapit ngunit mapitagang pagtawag sa Ama.
- source_word: εἰ δυνατόν ἐστιν
  choice: kung maaari
  rationale: Natural na Tagalog ito para sa kondisyon ng posibilidad at hindi nagdaragdag ng tahasang simuno na wala sa Griyego.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: lumampas sana sa akin
  rationale: Ipinahihiwatig ng “sana” ang pakiusap ng ikatlong panauhang pautos, habang pinananatili ng “lumampas sa akin” ang larawan ng pagdaan ng kopa.
- source_word: τὸ ποτήριον τοῦτο
  choice: ang kopang ito
  rationale: Pinananatili ang literal na larawang “kopa,” na may mas malawak na biblikal na kahulugan bilang itinakdang bahagi, lalo na ng pagdurusa.
- source_word: πλὴν
  choice: Gayunman
  rationale: Malinaw nitong ipinakikita ang matibay na paglilimita o pagsalungat sa naunang pakiusap sa isang marangal ngunit kasalukuyang rehistro.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: hindi ayon sa kalooban ko, kundi ayon sa kalooban mo
  rationale: Natural sa Tagalog ang paggamit ng “kalooban” upang ipahayag ang θέλω bilang volisyon, at malinaw nitong pinupunan ang elipsis sa ikalawang sugnay.
theological_decisions:
- issue: Ang talinghaga ng “kopa” sa panalangin ni Jesus
  choice: Pinanatili sa pangunahing teksto ang literal na larawang “ang kopang ito.”
  alternative: ang pagdurusang ito
  rationale: Ang ποτήριον ay literal na kopa ngunit ginagamit dito bilang biblikal na larawan ng itinakdang bahagi, lalo na ng pagdurusa. Ang pagpapanatili sa larawan ay hindi agad naglilimita sa buong kahulugan nito.
- issue: Ang kalooban ni Jesus kaugnay ng kalooban ng Ama
  choice: Isinalin ang θέλω sa pamamagitan ng “kalooban” sa magkatapat na mga sugnay.
  alternative: hindi ang gusto ko, kundi ang gusto mo
  rationale: Pinananatili ng “kalooban” ang bigat ng tunay na volisyon ni Jesus at ang pagpapasakop nito sa Ama, nang hindi ito pinaliliit tungo sa karaniwang personal na kagustuhan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nagpatirapa” bilang likas na katumbas ng buong pisikal na larawan, kaya hindi na kailangan ang hiwalay na leksikal na talababa. Pinanatili ang “kopa” at “kalooban” upang mapangalagaan ang imahen at teolohikal na tensiyon ng Griyego.
