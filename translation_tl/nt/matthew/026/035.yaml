id: MAT.26.35
reference: Matthew 26:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: tl
  text: Sinabi sa kanya ni Pedro, “Kahit kailangan kong mamatay na kasama mo, hinding-hindi kita ikakaila.[a]” Gayundin ang sinabi ng lahat ng alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tiyak na hindi kita ikakaila.” Mariin ang pagtanggi sa Griyego (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaang “Sinabi,” habang napapanatili ang tungkulin nito sa daloy ng kuwento.
- source_word: Κἂν
  choice: Kahit
  rationale: Ipinahahayag ng κἄν ang isang pasubaling pagpapahinuhod; natural na naihahatid ito ng “Kahit” sa modernong Tagalog.
- source_word: δέῃ με
  choice: kailangan kong
  rationale: Ipinahahayag ng pandiwa ang pangangailangan o obligasyon; malinaw at likas sa Tagalog ang “kailangan kong.”
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: mamatay na kasama mo
  rationale: Tuwirang pinananatili nito ang diwa ng pagkamatay na kapiling si Jesus nang hindi nagdaragdag ng paliwanag.
- source_word: οὐ μή
  choice: hinding-hindi
  rationale: Ang dobleng negatibo ay isang mariing pagtanggi. Ang “hinding-hindi” ang natural at malakas na katumbas nito sa Tagalog.
- source_word: ἀπαρνήσομαι
  choice: ikakaila
  rationale: Sa konteksto ng pagkakaila ni Pedro kay Jesus, ang “ikakaila” ang malinaw at nakaugaliang katumbas, at hindi ito nagdaragdag ng mas matinding diwa ng pagtatakwil.
- source_word: ὁμοίως
  choice: Gayundin
  rationale: Tuwirang ipinahahayag ng “Gayundin” na kapareho ng sinabi ni Pedro ang sinabi ng iba.
- source_word: πάντες οἱ μαθηταὶ
  choice: lahat ng alagad
  rationale: Ang “mga alagad” ang karaniwang katumbas ng μαθηταί; sa pariralang may “lahat,” natural sa Tagalog ang “lahat ng alagad.”
- source_word: εἶπαν
  choice: ang sinabi
  rationale: Ang konstruksyong “Gayundin ang sinabi...” ay natural na Tagalog at tapat na nag-uugnay sa kaparehong pahayag ng lahat ng alagad.
theological_decisions:
- issue: Lakas ng pangako ni Pedro na hindi niya ikakaila si Jesus
  choice: “hinding-hindi kita ikakaila” bilang mariing pagtanggi sa hinaharap
  alternative: “tiyak na hindi kita ikakaila”
  rationale: Mariin ang οὐ μή. Pinananatili ng “hinding-hindi” ang matinding pagtitiwala ni Pedro sa sarili at ang tensiyon ng salaysay, nang hindi ipinapaliwanag o nilulutas ito sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Sinabi” para sa natural na salaysay, “hinding-hindi” para sa mariing negasyon, at “Gayundin ang sinabi...” upang maiwasan ang mabigat at paulit-ulit na hulma habang pinananatili ang diwa ng ὁμοίως.
