  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: tl
  text: At wala silang natagpuan[a], kahit maraming bulaang saksi ang humarap. Ngunit kalaunan, dalawa ang humarap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi sa Griyego kung ano ang hindi nila natagpuan; ipinahihiwatig ng konteksto ang patotoo o paratang na hinahanap nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: wala silang natagpuan
  rationale: Hindi tahasang binabanggit sa Griyego ang layon ng pandiwa. Likas din sa Tagalog na iwang di-binanggit ang layon, kaya napapanatili ang pahiwatig na wala silang natagpuang sapat na patotoo o paratang.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: kahit maraming bulaang saksi ang humarap
  rationale: Ipinahahayag ng “kahit” ang diwang pasalungat ng genitive absolute sa konteksto. Ang “bulaang saksi” ay angkop sa paglilitis, at ang “humarap” ay likas na salin ng paglapit upang magbigay ng patotoo.
- source_word: ὕστερον δὲ
  choice: Ngunit nang dakong huli
  rationale: Ipinakikita ng parirala ang sumunod na yugto ng paglilitis, samantalang pinananatili ng “ngunit” ang banayad na salungat o pagbaling ng salaysay.
- source_word: προσελθόντες δύο
  choice: dalawa ang humarap
  rationale: Pinananatili ang bilang at hindi inuulit ang “saksi,” sapagkat ipinahihiwatig lamang iyon ng konteksto sa Griyego. Ang “humarap” ay natural sa tagpong panghukuman.
