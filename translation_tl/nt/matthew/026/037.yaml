  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: tl
  text: At isinama niya si Pedro at ang dalawang anak ni Zebedeo, at nagsimula siyang makadama ng kalungkutan at matinding pagkabagabag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magdalamhati at labis na mabagabag.”
    reason: Leksikal na alternatibo para sa dalawang pandiwang naglalarawan sa kalagayan ni Jesus.
lexical_decisions:
- source_word: παραλαβὼν
  choice: isinama niya
  rationale: Ipinapahayag ng aorist participle na isinama ni Jesus ang mga piling alagad bilang mga kasama niya. Likas sa modernong Tagalog ang “isinama niya” at hindi na kailangang idagdag ang “kasama niya.”
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ang dalawang anak ni Zebedeo
  rationale: Pinananatili ang mismong pagkakakilanlan sa Griyego at hindi idinaragdag ang mga pangalang Santiago at Juan, na wala sa talatang ito.
- source_word: ἤρξατο
  choice: nagsimula siyang
  rationale: Malinaw na pinananatili ang ingressive na diwa ng pandiwa at ang ugnayan nito sa dalawang kasunod na infinitive.
- source_word: λυπεῖσθαι
  choice: malungkot
  rationale: Tuwirang ipinapahayag ang tunay na pagdanas ng dalamhati sa natural at malinaw na Tagalog, nang hindi pinapahina sa karaniwang lungkot lamang o pinatitindi nang lampas sa teksto.
- source_word: ἀδημονεῖν
  choice: lubhang mabagabag
  rationale: Ang “mabagabag” ay nagpapahayag ng matinding panloob na pagkabalisa; ipinakikita ng “lubhang” na masidhi ang paghihirap na tinutukoy.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ng inuulit na “at” ang pagkakaugnay at naiipong daloy ng mga kasama at ng dalawang paglalarawan sa damdamin.
theological_decisions:
- issue: Paglalarawan sa damdamin ni Jesus kaugnay ng kristolohiya
  choice: Tuwirang isinalin ang dalawang pandiwa bilang tunay na lungkot at matinding pagkabagabag
  alternative: Palambutin ang mga salita upang mabawasan ang emosyonal na kahinaan, o patindihin ang mga ito bilang sindak o kawalan ng pag-asa
  rationale: Ipinakikita ng Griyego ang tunay at masidhing pagdurusang emosyonal ni Jesus. Pinananatili ng salin ang buong bigat nito nang hindi ikinakaila ang kaniyang tunay na pagkatao at nang hindi rin nagdaragdag ng kawalan ng pag-asa na hindi tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pambungad na “At” upang maipakita ang pagkakaugnay ng talata sa naunang salaysay, at hindi pinalitan ng mga pangalan ang “dalawang anak ni Zebedeo.”
