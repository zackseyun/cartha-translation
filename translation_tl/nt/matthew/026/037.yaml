  verdict: revise
  source_fidelity: Tumpak na kinikilala ng draft ang piling pagsama ni Jesus kina Pedro at sa dalawang anak ni Zebedeo, at pinananatili ang ingressive na “nagsimula.” Gayunman, ang “malungkot” ay maaaring tumukoy sa karaniwang pagiging malungkot at hindi gaanong malinaw na ipinapares sa masidhing panloob na pagkabagabag ng ἀδημονεῖν. Ang “makadama ng kalungkutan at matinding pagkabagabag” ay malinaw na naihahayag ang dalawang magkaiba ngunit magkaugnay na pandiwa nang walang pagdaragdag ng kahulugang lampas sa Griyego.
  naturalness: Nauunawaan ang kasalukuyang pangungusap, ngunit mas natural at mas balanseng Tagalog ang paralelong mga pangngalang “kalungkutan” at “matinding pagkabagabag” pagkatapos ng “nagsimula siyang makadama ng.” Iniiwasan din nito ang bahagyang hindi pantay na pagtutugma ng “malungkot” at “mabagabag.”
  terminology: Ang “Zebedeo” at “Pedro” ay angkop at pare-pareho sa karaniwang modernong Filipino Tagalog na anyo ng mga pangalan. Ang “kalungkutan” para sa λυπεῖσθαι at “matinding pagkabagabag” para sa ἀδημονεῖν ay nagpapapanatili ng pagkakaiba at tindi ng dalawang termino. Ang alternatibong “mabahala” sa talababa ay masyadong karaniwang pag-aalala at hindi kasingangkop ng “mabagabag” para sa ἀδημονεῖν.
  issues:
  - severity: low
    issue: Bahagyang kulang ang semantikong bigat at paralelismo ng “malungkot at lubhang mabagabag.”
    rationale: Ang λυπεῖσθαι at ἀδημονεῖν ay kapwa pandiwang naglalarawan ng pagdanas ng lungkot at matinding panloob na pagkabalisa. Ang nirebisang parirala ay mas natural at mas malinaw na pinananatili ang pares na ito.
  - severity: low
    issue: Hindi pinakamalapit na leksikal na alternatibo ang “labis na mabahala” sa talababa.
    rationale: Mas karaniwang tumutukoy ang “mabahala” sa pag-aalala o pagkabahala hinggil sa isang bagay; mas naihahatid ng “mabagabag” ang acute inner distress ng ἀδημονεῖν.
  revised_text: At isinama niya si Pedro at ang dalawang anak ni Zebedeo, at nagsimula siyang makadama ng kalungkutan at matinding pagkabagabag.[a]
