- from: Pagkatapos ay sinabi niya sa kanila, “Lubhang nalulumbay[a] ang kaluluwa ko, hanggang sa kamatayan.[b] Manatili kayo rito at magbantay na kasama ko.[c]”
  to: Pagkatapos ay sinabi niya sa kanila, “Lubhang namimighati[a] ang kaluluwa ko, hanggang sa kamatayan.[b] Manatili kayo rito at magbantay kayo kasama ko.[c]”
  rationale: Munting rebisyon lamang ang ginawa upang higit na maging idiomatiko ang Tagalog at mas maipahayag ang tindi ng περίλυπος. Pinanatili ang literal at sadyang masaklaw na “hanggang sa kamatayan,” gayundin ang “kaluluwa” at ang mas malawak na diwa ng “magbantay.”
