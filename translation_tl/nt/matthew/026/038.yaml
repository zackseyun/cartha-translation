  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa kanila, “Lubhang namimighati[a] ang kaluluwa ko, hanggang sa kamatayan.[b] Manatili kayo rito at magbantay kayo kasama ko.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lubhang nalulumbay,” “labis na namimighati,” o “puspos ng matinding dalamhati.”
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa punto ng kamatayan.”
    reason: lexical_alternative
  - marker: c
    text: O “manatiling gising kasama ko.” Maaaring taglay ng salitang Griyego ang diwa kapwa ng pananatiling gising at ng mapagmatyag na pagbabantay.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa makabagong Tagalog na nagpapatuloy sa pagkakasunod-sunod ng salaysay.
- source_word: λέγει αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Bagaman historical present ang λέγει, mas likas sa salaysay na Tagalog ang pangnagdaan; hindi nito binabago ang pangyayari o ang nagsasalita at kinakausap.
- source_word: Περίλυπός
  choice: Lubhang nalulumbay
  rationale: Ipinahahayag ang napakatinding kalungkutan at paghihirap ng kalooban nang malinaw at marangal, nang hindi dinaragdagan ang teksto ng tiyak na sanhi o doktrinal na paliwanag.
- source_word: ἡ ψυχή μου
  choice: ang kaluluwa ko
  rationale: Pinananatili ang tahasang ψυχή sa halip na gawing simpleng “ako,” kaya naihahayag ang matinding panloob na dalamhati nang hindi nagpapataw ng teknikal na antropolohiya.
- source_word: ἕως θανάτου
  choice: hanggang sa kamatayan
  rationale: Malapit sa anyo at sadyang matindi ng Griyego, habang pinananatili ang posibilidad na tumukoy ito sa dalamhating umaabot sa punto ng kamatayan.
- source_word: μείνατε ὧδε
  choice: Manatili kayo rito
  rationale: Tuwirang ipinapahayag ang utos na huwag umalis sa lugar; ang “manatili” ay natural ngunit angkop sa taimtim na tagpo.
- source_word: γρηγορεῖτε
  choice: magbantay
  rationale: Sinasaklaw ang mapagmatyag na pagbabantay sa konteksto, habang itinatala sa talababa ang literal ding diwang manatiling gising.
- source_word: μετ’ ἐμοῦ
  choice: na kasama ko
  rationale: Tuwirang pinananatili ang diwa ng pakikisama kay Jesus sa utos.
theological_decisions:
- issue: Paglilipat ng ψυχή sa pahayag ni Jesus
  choice: ang kaluluwa ko
  alternative: lubha akong nalulumbay
  rationale: Pinananatili ang tahasang pangngalan sa Griyego at ang ganap na realidad ng panloob at makataong dalamhati ni Jesus, nang hindi ginagawang teknikal na pahayag tungkol sa pagkakabuo ng tao.
- issue: Saklaw ng γρηγορεῖτε
  choice: magbantay
  alternative: manatiling gising
  rationale: Maaaring taglay ng pandiwa ang literal na pagpupuyat at ang mapagmatyag na pagbabantay. Pinananatili ng pangunahing teksto ang mas malawak na diwa at ng talababa ang literal na posibilidad.
- issue: Lakas at posibleng saklaw ng ἕως θανάτου
  choice: hanggang sa kamatayan
  alternative: hanggang sa puntong ikamamatay ko
  rationale: Hindi nilulutas nang tahasan kung ang parirala ay idyomatikong sukdulan lamang o tumutukoy sa dalamhating umaabot sa punto ng kamatayan; inilalahad ang mas paliwanag na pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nalulumbay” at “kaluluwa” upang mapanatili ang taimtim at mabigat na tono nang hindi nagiging lipas o labis na teknikal. Ang historical present ng Griyego ay ginawang likas na pangnagdaan sa salaysay na Tagalog.
