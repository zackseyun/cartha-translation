base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: tl
  text: Alam ninyo na pagkalipas ng dalawang araw ay sasapit ang Paskuwa, at ang Anak ng Tao ay ibibigay[a] upang maipako sa krus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “ipagkakanulo.” Ang pandiwang Griyego ay maaaring tumukoy sa pagtataksil, ngunit mas malawak ang kahulugan nito: “ibigay” o “ipaubaya sa iba.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Alam ninyo
  rationale: Ang pandiwa ay nasa ikalawang panauhang maramihan at may pangkasalukuyang diwa; natural at tuwirang salin ang “Alam ninyo.”
- source_word: μετὰ δύο ἡμέρας
  choice: pagkalipas ng dalawang araw
  rationale: Ipinahahayag ng μετά na may akusatibo ang panahong lilipas bago mangyari ang tinutukoy; malapit ito sa anyong Griyego at likas sa Tagalog.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Tumutukoy ang πάσχα sa Paskuwa; hindi idinagdag ang “pista” sapagkat hindi iyon tahasang nasa teksto.
- source_word: γίνεται
  choice: sasapit
  rationale: Sa konteksto, tumutukoy ang γίνομαι sa nalalapit na pagdating o pagdaraos ng Paskuwa. Ang “sasapit” ay natural at pinananatili ang diwa ng nalalapit na pangyayari.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulong ginagamit ni Jesus para sa sarili at ang biblikal at teolohikal na kabuluhan nito.
- source_word: παραδίδοται
  choice: ibibigay
  rationale: Ang pandiwang pasibo ay tumutukoy sa nalalapit na pagbibigay o pagsasalin sa kamay ng iba. Hindi ito nilimitahan sa “ipagkakanulo,” bagaman maaari ring saklawin ng salita ang pagtataksil.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: upang ipako sa krus
  rationale: Ipinahahayag ng εἰς kasama ng articular infinitive ang layunin o kahihinatnan; malinaw at natural itong naipapahayag ng “upang ipako sa krus.”
theological_decisions:
- issue: Ang kahulugan ng παραδίδοται sa hula tungkol sa paghihirap ni Jesus
  choice: ibibigay
  alternative: ipagkakanulo
  rationale: Kasama sa konteksto ang pagtataksil ni Judas, ngunit mas malawak ang pandiwang Griyego at maaari nitong saklawin kapwa ang pagtataksil ng tao at ang pagbibigay kay Jesus sa kamay ng iba. Pinananatili ng “ibibigay” ang teolohikal na tensiyon nang hindi ito nililimitahan sa pagtataksil lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Paskuwa” bilang kinikilalang terminong biblikal at ang “Anak ng Tao” bilang nakaugaliang titulo. Iniwasan ang sobrang teknikal o makalumang pananalita.
