  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: tl
  text: Ngunit sumagot sa kanya si Pedro, “Kahit tumalikod[a] silang lahat dahil sa iyo, ako nama’y hinding-hindi tatalikod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matisod” o “mapatisod.” Ang pandiwang Griyego ay maaaring tumukoy sa pagkatisod, pagkatisod dahil sa isang tao o bagay, o pagtalikod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: sumagot sa kanya
  rationale: Ang participyo at kasunod na pandiwa ng pagsasalita ay isang karaniwang Griyegong pormula. Likas itong ipinahahayag sa Filipino bilang “sumagot sa kanya” nang hindi inuulit ang “at sinabi.”
- source_word: δὲ
  choice: Ngunit
  rationale: 'Nagpapakita ang δέ ng banayad na pagsalungat: taliwas ang matapang na tugon ni Pedro sa naunang pahayag ni Jesus.'
- source_word: Εἰ πάντες
  choice: Kahit … silang lahat
  rationale: Bagaman karaniwang nangangahulugang “kung” ang εἰ, may diwang pagpapalagay na pasalungat dito dahil inihihiwalay ni Pedro ang sarili niya sa lahat ng iba pa.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: tumalikod / tatalikod
  rationale: Sa konteksto ng mga alagad na iiwan si Jesus sa oras ng panganib, mas malinaw sa karaniwang Filipino ang “tumalikod” kaysa sa literal na “matisod.” Pinanatili ang iisang salin sa dalawang paglitaw ng pandiwa.
- source_word: ἐν σοί
  choice: dahil sa iyo
  rationale: 'Sa pagkakaugnay nito sa σκανδαλίζω, ipinahahayag ng ἐν σοί ang sanhi o kaugnayan: ang pagkatisod o pagtalikod ay mangyayari dahil sa nangyayari kay Jesus.'
- source_word: ἐγὼ
  choice: ako nama’y
  rationale: Tahasan at mariin ang panghalip sa Griyego. Ipinakikita ng “ako nama’y” ang matinding paghahambing ni Pedro sa sarili niya at sa “lahat.”
- source_word: οὐδέποτε
  choice: hinding-hindi
  rationale: Ang inuulit na pagtanggi ay natural at mariing katumbas sa Filipino ng absolutong χρονική negasyon na οὐδέποτε.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζω sa kabiguan ng mga alagad
  choice: tumalikod
  alternative: matisod; magkasala; mawalan ng loob dahil kay Jesus
  rationale: Ipinahihiwatig ng konteksto ang pag-urong sa katapatan at pag-iwan kay Jesus, hindi lamang pisikal na pagkatisod o pagkayamot. Gayunman, hindi ginawang teknikal o pangwakas na pahayag tungkol sa apostasya ang salita; inilalahad sa talababa ang mas malawak na saklaw ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “si Pedro” at “sa kanya” sa likas na ayos, at ang “ako nama’y hinding-hindi” upang mapanatili ang mariing pagtutol ni Pedro nang hindi nagiging mabigat o makaluma.
