id: MAT.26.26
reference: Matthew 26:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: tl
  text: Habang kumakain sila[a], kumuha si Jesus ng tinapay. Matapos siyang magbasbas[b], pinagputol-putol niya ito at ibinigay sa mga alagad. Sinabi niya, “Kunin ninyo, kainin ninyo[c]; ito ang aking katawan.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Samantalang kumakain sila.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “matapos magbasbas.” Maaari itong tumukoy sa pagbigkas ng basbas kaugnay ng tinapay o sa pagpuri at pasasalamat sa Diyos.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “Kunin ninyo at kainin.”
    reason: lexical_alternative
  - marker: d
    text: Literal sa Griyego, “ito ang aking katawan.” Ipinaliliwanag ito ng ilan bilang “ito ay nangangahulugan ng aking katawan” o “ito ay sumasagisag sa aking katawan,” ngunit pinananatili rito ang mismong pananalita ng pinagmulang teksto.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Habang kumakain sila
  rationale: Ang genitive absolute ay nagtatakda ng kasabay at nagpapatuloy na pangyayari. Natural sa modernong Tagalog ang “Habang kumakain sila,” at hindi kailangang gawing mariin ang mahinang pang-ugnay na δέ.
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: kumuha si Jesus ng tinapay
  rationale: Ginawang sunod-sunod na pandiwang pasalaysay ang aorist participle upang maging natural sa Tagalog. Ang ἄρτος ay karaniwang “tinapay”; hindi tiyak na kailangang tukuyin itong isang buong piraso o loaf.
- source_word: εὐλογήσας
  choice: matapos niyang bigkasin ang basbas
  rationale: Pinananatili nito ang kilos ng pagbasbas nang hindi tahasang nagdaragdag ng layon na wala sa Griyego. Hindi rin nito awtomatikong ipinapantay ang εὐλογέω sa εὐχαριστέω, bagaman maaaring maunawaan ang kilos bilang pasasalamat o pagpuri sa Diyos kaugnay ng tinapay.
- source_word: ἔκλασεν
  choice: pinira-piraso niya iyon
  rationale: Ang κλάω ay “baliin” o “pagpira-pirasuhin,” lalo na ng tinapay. Ang “iyon” ay natural na tumutukoy pabalik sa tinapay.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: ibinigay sa mga alagad
  rationale: Isinalin ang participle bilang kasunod na pandiwa para sa malinaw na daloy. Ang “mga alagad” ay tumutukoy sa kilalang pangkat nang hindi idinaragdag ang “kaniyang,” na hindi tahasang nasa teksto.
- source_word: Λάβετε φάγετε
  choice: Kunin ninyo, kainin ninyo
  rationale: Pinananatili ang dalawang magkasunod na pautos at ang kawalan ng pang-ugnay sa Griyego. Ang pag-uulit ng “ninyo” ay malinaw at natural sa Tagalog.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: ito ang aking katawan
  rationale: Ito ang tuwirang at natural na pangungusap na panumbas sa Tagalog. Hindi nangangailangan ang Tagalog ng lantad na copula para maipahayag ang “this is my body,” kaya hindi ito pinakahulugang “sumasagisag” o “nangangahulugan.”
theological_decisions:
- issue: Pananalita ni Jesus tungkol sa tinapay at sa kaniyang katawan
  choice: “ito ang aking katawan”
  alternative: “ito ay nangangahulugan ng aking katawan” o “ito ay sumasagisag sa aking katawan”
  rationale: Simple at tuwiran ang copula na ἐστιν sa Griyego. Pinananatili ng salin ang mismong pahayag at ang teolohikal na tensiyon nito sa halip na magtakda ng isang partikular na paliwanag tungkol sa Hapunan ng Panginoon.
- issue: Saklaw ng εὐλογήσας
  choice: “matapos niyang bigkasin ang basbas” nang walang tahasang layon
  alternative: “matapos niyang basbasan ang tinapay” o “matapos niyang magpasalamat sa Diyos”
  rationale: Walang tahasang layon ang participle sa Griyego. Ang pangunahing salin ay hindi nagpapasya kung ang diin ay nasa basbas sa tinapay o sa pagpuri at pasasalamat sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “alagad” bilang karaniwang katawagan sa μαθητής. Hinati sa maiikling pangungusap ang mahabang Griyegong pagkakasunod-sunod upang luminaw ang salaysay, ngunit pinanatili ang ayos ng mga kilos at ang maigting na dalawang pautos.
