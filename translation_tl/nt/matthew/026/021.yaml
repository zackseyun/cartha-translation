  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: tl
  text: Habang kumakain sila, sinabi niya, “Katotohanang sinasabi ko sa inyo, ipagkakanulo[a] ako ng isa sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “isusuko ako” o “ibibigay ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Habang kumakain sila
  rationale: Ipinahahayag ng genitive absolute ang kilos na kasabay ng pagsasalita ni Jesus. Likas sa modernong Tagalog ang “Habang kumakain sila” at malinaw nitong pinananatili ang ugnayang temporal.
- source_word: Ἀμὴν
  choice: Katotohanan
  rationale: Sa pananalita ni Jesus, ang ἀμήν ay taimtim na panimulang pagpapatibay. Sa pariralang “Katotohanang sinasabi ko sa inyo,” naihahatid nito ang diin at awtoritatibong tono nang hindi ginagamit ang “Amen” sa di-karaniwang posisyon nito sa Tagalog.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili nito ang tuwirang pagsasalita at tahasang pagtukoy sa mga kausap, sa isang pamilyar at marangal na anyo sa Tagalog.
- source_word: εἷς ἐξ ὑμῶν
  choice: isa sa inyo
  rationale: Ito ang tuwiran at natural na katumbas ng partitive expression na tumutukoy sa isang taong kabilang sa pangkat ng mga kausap.
- source_word: παραδώσει
  choice: ipagkakanulo
  rationale: Malawak ang saklaw ng pandiwa at maaari itong mangahulugang “isuko” o “ibigay sa kapangyarihan ng iba,” ngunit sa kontekstong ito ang mapagtaksil na pagsuko kay Jesus ng isa sa kanyang mga alagad ang nangingibabaw. Pinananatili ng anyong “ipagkakanulo” ang aspektong prospektibo ng future indicative.
- source_word: με
  choice: ako
  rationale: Ang “ako” ang natural na tuwirang layon ng pandiwang “ipagkakanulo” at tumutukoy kay Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa παραδώσει sa salaysay ng paghihirap ni Jesus
  choice: ipagkakanulo ako
  alternative: isusuko ako / ibibigay ako sa kamay ng iba
  rationale: Ang “ipagkakanulo” ang pinakamalinaw na nagpapahayag sa kontekstong ito ng pagtataksil ng isang alagad, ngunit hindi nito lubos na sinasaklaw ang mas malawak na literal na diwa ng pandiwang Griyego. Kaya inilalahad sa talababa ang mga alternatibong “isusuko” at “ibibigay sa kamay ng iba” upang mapanatili ang leksikal na lawak at hindi maitago ang tunay na posibilidad ng ibang salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang tono. Pinanatili ang nakaugaliang taimtim na pormulang “Katotohanang sinasabi ko sa inyo,” habang ginawang natural ang temporal na sugnay at ang ayos ng huling pahayag. Inilagay ang talababa pagkatapos ng “isa sa inyo” upang malinaw na tumukoy ito sa pandiwang “ipagkakanulo,” hindi sa “kumakain.”
