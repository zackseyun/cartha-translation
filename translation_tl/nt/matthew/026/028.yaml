  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: tl
  text: Sapagkat ito ang aking dugo, ang dugo ng tipan[a], na ibinubuhos para sa marami[b] para sa kapatawaran ng mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “ang aking dugo ng bagong tipan.”'
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “alang-alang sa marami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Tuwirang isinasalin ang panghalip na panturo. Hindi idinaragdag ang “kopang ito” dahil walang salitang “kopa” sa sugnay na Griyego.
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan nito sa naunang utos na uminom; marangal at likas ang “sapagkat” sa kontekstong ito.
- source_word: τὸ αἷμά μου
  choice: ang dugo ko
  rationale: Tuwirang salin na nagpapanatili sa sakripisyal at pangtipang diwa ng “dugo.”
- source_word: τῆς διαθήκης
  choice: ng tipan
  rationale: Ang SBLGNT ay may “ng tipan” lamang; hindi isinasama sa pangunahing teksto ang “bago,” na isang variant sa ilang manuskrito.
- source_word: περὶ πολλῶν
  choice: para sa marami
  rationale: Sa sakripisyal na konteksto, ipinahahayag nito ang kapakinabangan o pagkilos alang-alang sa marami. Likas ito sa modernong Tagalog at hindi nito nilulutas ang mas malawak na debateng teolohikal.
- source_word: ἐκχυννόμενον
  choice: na ibinubuhos
  rationale: Pinananatili ang kasalukuyang pasibong participle at ang larawan ng pagbubuhos ng dugo; mas malinaw ito kaysa sa isang malayang paraphrase.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: upang mapatawad ang mga kasalanan
  rationale: Likas at malinaw na ipinahahayag sa Tagalog ang layunin o bunga nang hindi pinapahina ang ugnayan nito sa ibinubuhos na dugo.
theological_decisions:
- issue: Kung isasama ang “bago” sa “tipan”
  choice: ng tipan
  alternative: ng bagong tipan
  rationale: Wala ang καινῆς (“bago”) sa ibinigay na SBLGNT. Sinusunod ng pangunahing teksto ang pinagbatayang Griyego, habang inilalagay sa talababa ang mahalagang variant.
- issue: Ang saklaw ng “para sa marami” sa wika ng pagtubos
  choice: para sa marami
  alternative: para sa lahat
  rationale: Ang Griyego ay πολλῶν, “marami.” Pinananatili ang mismong pananalita at hindi ipinapasok sa talata ang isang pasiya tungkol sa mas malawak na debateng teolohikal.
- issue: Diwa ng περί sa περὶ πολλῶν
  choice: para sa marami
  alternative: alang-alang sa marami
  rationale: Parehong maaaring ihayag ang kapakinabangan o pagkilos para sa iba. Pinili ang mas karaniwang “para sa marami,” at itinala ang mas tahasang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikli at taimtim na anyo ng pahayag, ang sakripisyal na larawang “dugo” at “ibinubuhos,” at ang tunay na tekstuwal at leksikal na mga alternatibo sa mga talababa.
