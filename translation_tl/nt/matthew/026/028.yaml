  naturalness: Ang “dugo ko ng tipan” ay nauunawaan ngunit medyo mabigat at kalkado sa modernong Filipino. Ang appositional na “aking dugo, ang dugo ng tipan” ay mas malinaw at likas, habang pinananatili ang ugnayan ng dugo at tipan. Ang “Sapagkat” at “na ibinubuhos” ay angkop sa marangal ngunit modernong rehistro.
  terminology: Ang “tipan,” “dugo,” “ibinubuhos,” at “kapatawaran ng mga kasalanan” ay angkop at nagpapanatili ng sakripisyal at pangtipang bokabularyo. Hindi dapat idagdag ang “bago” sa pangunahing teksto, ngunit dapat manatili ito sa talababa bilang tekstuwal na variant.
  issues:
  - severity: medium
    issue: Hindi nakalagay ang talababa para sa tekstuwal na variant sa mismong “tipan.”
    rationale: Ang talababa [a] ay tumutukoy sa alternatibong pagbasa na “dugo ko ng bagong tipan,” kaya dapat nakaangkla ito sa “tipan,” hindi sa dulo pagkatapos ng “mga kasalanan.”
  - severity: low
    issue: Medyo di-likas ang “dugo ko ng tipan.”
    rationale: Bagaman literal na nauunawaan, mas malinaw sa modernong Filipino ang “aking dugo, ang dugo ng tipan,” na hindi nagdaragdag ng teolohikal na paliwanag.
  - severity: low
    issue: Ang “upang mapatawad ang mga kasalanan” ay mas malayang paglalapat ng pangngalang ἄφεσιν.
    rationale: Ang “para sa kapatawaran ng mga kasalanan” ay mas malapit sa estruktura at saklaw ng Griyego, nang nananatiling natural sa Tagalog.
  revised_text: Sapagkat ito ang aking dugo, ang dugo ng tipan[a], na ibinubuhos para sa marami[b] para sa kapatawaran ng mga kasalanan.
