base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: tl
  text: Sapagkat nang ibuhos niya ang pabangong ito sa aking katawan, ginawa niya iyon upang ihanda ako para sa aking libing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “para sa aking libing.” Ang pandiwang Griego ay may diwang paghahanda ng katawan para sa libing.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: nang ibuhos niya
  rationale: Ang aorist participle ng βάλλω ay tumutukoy rito sa pagbubuhos o paglalagay ng pabangong langis. Ang temporal na sugnay ay likas sa Tagalog at malinaw ang kaugnayan nito sa pangunahing pandiwa.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala ng γάρ ang paliwanag ni Jesus sa ginawa ng babae; pinananatili ng “Sapagkat” ang paliwanag na ugnayan sa naunang pahayag.
- source_word: μύρον
  choice: pabango
  rationale: Ang μύρον ay mabangong langis o pamahid. Ang “pabango” ay madaling maunawaan sa modernong Tagalog at ang konteksto ang nagpapakitang ito ay likidong ibinuhos.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: sa aking katawan
  rationale: Ang ἐπί na may genitive ay nagsasaad dito ng paglalagay sa ibabaw o sa katawan; natural sa Tagalog ang “sa aking katawan.”
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: upang ihanda ako sa paglilibing
  rationale: Ang πρὸς na may articular infinitive ay nagpapahayag ng layunin, at ang ἐνταφιάζω ay maaaring tumukoy sa paghahanda ng katawan para sa libing. Nililinaw ito ng salin nang hindi nagdaragdag ng doktrinal na paliwanag.
- source_word: ἐποίησεν
  choice: ginawa niya iyon
  rationale: Malawak ang gamit ng ποιέω rito at tumutukoy pabalik sa pagbubuhos. Ang “iyon” ay likas na panumbalik sa Tagalog at umiiwas sa hindi kailangang pag-uulit.
- source_word: αὕτη
  choice: niya
  rationale: Bagaman may demonstratibong diwa ang αὕτη (“ang babaeng ito”), malinaw na ang tinutukoy sa konteksto; natural sa Tagalog ang panghalip na “niya.”
theological_decisions:
- issue: Kahulugan ng ἐνταφιάζω kaugnay ng kamatayan ni Jesus
  choice: Ang ginawa ng babae ay inilalarawan bilang paghahanda kay Jesus sa paglilibing.
  alternative: Ginawa niya iyon para sa paglilibing sa akin.
  rationale: Saklaw ng ἐνταφιάζω ang paghahanda ng katawan para sa libing o paglalagak sa libingan. Pinananatili ng salin ang paunang pagtukoy ni Jesus sa kaniyang libing nang hindi pinalalawak ang teolohikal na implikasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “paglilibing” kaysa mas teknikal o makalumang pananalita, at pinanatili ang paliwanag na “Sapagkat” mula sa γάρ.
