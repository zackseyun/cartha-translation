  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: tl
  text: Labis silang nalungkot at isa-isa[a] silang nagsimulang magtanong sa kanya, “Hindi naman ako, Panginoon?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat isa” o “sunod-sunod.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang salitang Griyego na μήτι ay bumubuo ng tanong na umaasang negatibo ang sagot: “Hindi naman ako, Panginoon?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: Labis silang nalungkot
  rationale: Pinagsama ang participle at intensifying adverb upang natural na maipahayag sa Filipino ang matinding kalungkutan nila sa sandaling iyon.
- source_word: ἤρξαντο λέγειν
  choice: nagsimulang magsabi
  rationale: Pinananatili ang ingressive na diwa ng konstruksiyon—nagsimula silang magsalita—nang hindi nagiging mabigat ang pangungusap.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang katumbas ng dative indirect object, na malinaw na tumutukoy kay Jesus sa konteksto.
- source_word: εἷς ἕκαστος
  choice: isa-isa
  rationale: Natural na idyomang Filipino na nagpapahayag na bawat alagad ay magkakasunod na nagtanong.
- source_word: Μήτι ἐγώ εἰμι
  choice: Hindi naman ako
  rationale: Ang μήτι ay nagpapahiwatig na negatibo ang inaasahang sagot. Ang “Hindi naman ako?” ay natural na tanong sa Filipino at pinananatili ang pag-asang hindi siya ang tinutukoy.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang titulo para kay Jesus at ang teolohikal at pasalaysay na bigat ng προσφώνησις, sa halip na paliitin ito sa simpleng magalang na tawag.
theological_decisions:
- issue: Pagtutumbas sa κύριε bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo; panginoon o amo
  rationale: Bagaman maaaring mangahulugang magalang na “ginoo” ang κύριος sa ilang konteksto, ang “Panginoon” ay angkop dito bilang kinikilalang titulo ni Jesus at hindi nito inaalis ang posibleng mas malalim na bigat ng tawag.
- issue: Pahiwatig ng tanong na may μήτι
  choice: Hindi naman ako?
  alternative: Ako ba?
  rationale: Pinananatili ng napiling anyo ang inaasahang negatibong sagot nang hindi ipinapaliwanag kung sino talaga ang magkakanulo kay Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isa-isa” at “Hindi naman ako?” bilang natural na mga parirala, habang pinanatili ang pamagat na “Panginoon.”
