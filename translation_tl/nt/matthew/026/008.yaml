  source_fidelity: Ang “Ngunit,” “nang makita ito ng mga alagad,” at “nagalit sila” ay tapat sa pangunahing diwa ng δέ, ἰδόντες, οἱ μαθηταί, at ἠγανάκτησαν. Gayunman, ang “Bakit ganito ang pag-aaksaya?” ay mas madaling unawain bilang pagtatanong kung bakit ganito ang paraan ng pag-aaksaya, sa halip na ang retorikal na “Bakit/para saan ang pag-aaksayang ito?” na nasa Εἰς τί ἡ ἀπώλεια αὕτη.
  naturalness: Ang binagong tanong na “Bakit ang pag-aaksayang ito?” ay isang likas na retorikal na tanong sa marangal ngunit modernong Filipino. Ang tala ay nagbibigay ng mas tahasang alternatibong “Para saan ang pag-aaksayang ito?”
  terminology: Ang “mga alagad” ay wastong karaniwang katumbas ng μαθηταί. Ang “pag-aaksaya” ay angkop sa ἀπώλεια sa konteksto ng mamahaling pabango. Ang “nagalit” ay natural na salin ng ἠγανάκτησαν, bagaman hindi nito lubos na inilalantad ang bahaging pagkasuklam/pagkayamot ng salita; hindi kailangan ang mas matinding o mas lipas na pananalita.
  issues:
