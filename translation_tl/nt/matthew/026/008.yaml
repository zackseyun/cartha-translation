    issue: Hindi sapat na malinaw ang sintaks ng “Bakit ganito ang pag-aaksaya?” para sa Εἰς τί ἡ ἀπώλεια αὕτη.
    rationale: Ang demonstratibong αὕτη ay tumutukoy sa mismong pag-aaksaya (“ang pag-aaksayang ito”), at ang Εἰς τί ay nagtatanong ng layunin o saysay nito. Ang “ganito” ay naglilipat ng diin sa paraan o uri ng pag-aaksaya.
  - severity: low
    issue: Walang isinaling tala para sa alternatibong kahulugan ng Εἰς τί.
    rationale: Ang maikling tala ay kapaki-pakinabang upang maipakita ang mas tahasang purposive na pagbasa nang hindi binabago ang natural na pangunahing salin.
