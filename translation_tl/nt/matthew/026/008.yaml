base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: tl
  text: Ngunit nang makita ito ng mga alagad, nagalit sila at sinabi, “Bakit ang pag-aaksayang ito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Para saan ang pag-aaksayang ito?”
    reason: Ipinapakita ang mas tahasang kahulugang “para sa anong layunin?” ng Εἰς τί.
lexical_decisions:
- source_word: ἰδόντες
  choice: nang makita ito
  rationale: Isinalin ang aorist participle bilang sugnay na panahunan para sa likas na daloy sa Tagalog. Ang “ito” ay hango sa konteksto—ang ginawa ng babae—bagaman walang tahasang layon sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagliko o pagsalungat mula sa naunang kilos tungo sa negatibong reaksiyon ng mga alagad.
- source_word: οἱ μαθηταὶ
  choice: mga alagad
  rationale: Karaniwang salin ng μαθηταί sa salaysay ng mga Ebanghelyo. Hindi idinagdag ang “niya” sapagkat hindi ito tahasang nasa Griyego.
- source_word: ἠγανάκτησαν
  choice: nagalit sila
  rationale: Ipinapahayag ng ἀγανακτέω ang matinding pagkainis o galit. Ang “nagalit” ay natural at malinaw sa modernong Tagalog nang hindi pinapahina ang tindi ng reaksiyon.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ginawang koordinadong pandiwa ang participle upang maging natural ang pagsasalaysay sa Tagalog habang pinananatili ang kaugnayan nito sa kanilang galit.
- source_word: Εἰς τί
  choice: Bakit
  rationale: Idyomatikong tanong ito tungkol sa layunin o dahilan. Ang “Bakit” ang pinakamaikli at pinakanatural na katumbas sa kasalukuyang Tagalog.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ganito ang pag-aaksaya
  rationale: Sa konteksto ng mamahaling pabangong ibinuhos, ang ἀπώλεια ay tumutukoy sa itinuturing nilang pag-aaksaya. Ang anyong “ganito ang pag-aaksaya” ay natural sa tanong na Tagalog at pinananatili ang demonstratibong diin ng αὕτη.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang karaniwang “nagalit” sa halip na mas pormal na “nagngitngit” o “nagalit nang matuwid,” na maaaring magdagdag ng di-tahasang moral na paghatol.
