  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: tl
  text: Ngunit, nang malaman ito ni Jesus, sinabi niya sa kanila, “Bakit ninyo ginugulo ang babae? Isang magandang gawa[a] ang ginawa niya para sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mabuting gawa” o “marangal na gawa.”
    reason: Pinagsasama ng καλός ang mga diwa ng pagiging mabuti, maganda, marangal, at angkop.
lexical_decisions:
- source_word: γνοὺς
  choice: batid ito
  rationale: Ipinahahayag ng aorist participle ang pagkaalam ni Jesus sa naunang pagpuna ng mga alagad. Likas sa Tagalog ang “batid ito” at hindi nito ipinahihiwatig na noon lamang niya nalaman ang nangyayari.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa reklamo ng mga alagad at ang kasunod na pagtutuwid ni Jesus.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Bakit ninyo ginugulo ang babae?
  rationale: Ang idyomang κόπους παρέχετε ay tumutukoy sa pagdudulot ng hirap o panggugulo sa isang tao. Direkta, natural, at may sapat na puwersa ng pagsaway ang salin.
- source_word: ἔργον καλὸν
  choice: isang magandang gawa
  rationale: Pinananatili ng “magandang gawa” ang positibong pagpapahalaga at ang saklaw ng καλός na maaaring magpahiwatig ng kabutihan, kagandahan, at pagiging marangal o angkop.
- source_word: ἠργάσατο
  choice: ang ginawa niya
  rationale: Natural na Tagalog ito para sa natapos na gawa na siyang kasalukuyang pinupuri ni Jesus.
- source_word: εἰς ἐμέ
  choice: para sa akin
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “para sa akin” ang pagkakaukol ng ginawa ng babae kay Jesus, habang hindi nagdaragdag ng tiyak na doktrinal na kahulugan.
theological_decisions:
- issue: Pagpapahalaga sa ginawa ng babae
  choice: isang magandang gawa
  alternative: isang mabuting gawa; isang marangal na gawa
  rationale: Pinupuri ng teksto ang ginawa ng babae. Pinananatili ng salin ang malawak na diwa ng καλός nang hindi naglalakip ng katuruan tungkol sa merito, sakramento, o anumang denominasyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “batid” upang maging maikli at dignified, at ang “ginugulo” bilang karaniwang salitang tuwirang nagpapahayag ng pagsaway.
