id: MAT.26.56
reference: Matthew 26:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: tl
  text: Ngunit nangyari ang lahat ng ito upang matupad ang mga Kasulatan ng mga propeta. Pagkatapos, iniwan siya[a] ng lahat ng alagad at tumakas sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinabayaan siya”; maaaring taglayin dito ng ἀφέντες ang mas matinding diwa ng pagtalikod o pag-iwan sa gitna ng panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Ngunit ... ang lahat ng ito
  rationale: Likas sa modernong Filipino ang pariralang ito bilang pagtukoy sa kabuuan ng naganap, at pinananatili ng “Ngunit” ang banayad na pagsalungat o pag-uugnay ng δέ.
- source_word: γέγονεν
  choice: nangyari
  rationale: Ang “nangyari” ang pinakanatural na katumbas sa Filipino; sa konteksto, sapat nitong ipinahahayag ang naganap na pangyayaring may kaugnayan sa kasalukuyang tagpo.
- source_word: ἵνα πληρωθῶσιν
  choice: upang matupad
  rationale: Pinananatili nito ang layunin o kinalabasang ipinahihiwatig ng ἵνα na may subjunctive, nang hindi pinipilit na pumili nang higit sa ambiguwidad ng Griyego.
- source_word: αἱ γραφαὶ
  choice: ang mga Kasulatan
  rationale: Tumutukoy ang γραφαί rito sa mga banal na kasulatan; ang malaking titik ay malinaw at nakaugaliang gamit sa Filipino.
- source_word: τῶν προφητῶν
  choice: ng mga propeta
  rationale: Tuwirang pinananatili ang genitive at iniiwasang idagdag kung ang mga ito ay “isinulat” o “sinabi” ng mga propeta.
- source_word: τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang sumunod na pangyayari sa salaysay. Mas natural dito ang “Pagkatapos” kaysa sa literal ngunit bahagyang matigas na “Nang magkagayon.”
- source_word: οἱ μαθηταὶ πάντες
  choice: lahat ng alagad
  rationale: Malinaw na pinananatili ang kabuuang saklaw ng πάντες nang hindi idinaragdag ang “niya,” na ipinahihiwatig lamang ng konteksto.
- source_word: ἀφέντες αὐτὸν
  choice: iniwan siya
  rationale: Natural at tumpak ang “iniwan siya,” habang maaaring taglayin ng pandiwa sa konteksto ang mas matinding diwang “pinabayaan”; inilalahad ang alternatibong iyon sa talababa.
- source_word: ἔφυγον
  choice: tumakas sila
  rationale: Tumpak na ipinahahayag ng “tumakas” ang ἔφυγον at pinananatili ang bigat ng kanilang biglang paglayo.
theological_decisions:
- issue: Wika ng katuparan at ang mga Kasulatan ng mga propeta
  choice: “upang matupad ang mga Kasulatan ng mga propeta”
  alternative: “upang magkatotoo ang isinulat ng mga propeta”
  rationale: Pinananatili ng napiling anyo ang tahasang wika ng katuparan at ang maramihang “mga Kasulatan,” nang hindi pinapaliit ito sa isang malayang paraphrase o idinaragdag na ang tinutukoy ay espesipikong isinulat.
- issue: Layunin o kinalabasan sa ἵνα πληρωθῶσιν
  choice: Panatilihin ang “upang,” na maaaring magpahayag ng layunin o kinalabasan sa konteksto.
  alternative: “kaya natupad”
  rationale: Hindi tahasang nilulutas ng salin ang teolohikal na tensiyon sa pagitan ng layunin at kinalabasan; mas malapit ang “upang” sa pagkakabuo ng Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang labis na pormal na “magsitakas” at ang mas kolokyal na “nagsitakbuhan.” Ang pag-uulit ng “sila” sa hulihan ay nagpapalinaw at nagpapadaloy sa pangungusap.
