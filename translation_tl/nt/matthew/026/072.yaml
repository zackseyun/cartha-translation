  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: tl
  text: 'At muli niya itong itinanggi nang may panunumpa: “Hindi ko kilala ang lalaking iyon.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At muli siyang nagkaila” sa halip na “At muli niya itong itinanggi”; sa Griyego, sinusundan ang pandiwa ng sugnay na nagsasaad ng nilalaman ng pagkakaila.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay ng salaysay nang hindi nagdaragdag ng mas tiyak na temporal na diwa.
- source_word: πάλιν
  choice: muli
  rationale: Malinaw at likas na ipinahihiwatig ang pag-uulit ng pagkakaila ni Pedro.
- source_word: ἠρνήσατο
  choice: niya itong itinanggi
  rationale: Ang pandiwa ay nangangahulugang tumanggi o magkaila. Likas sa Filipino na lagyan ito ng layong “ito” bago ihayag ang nilalaman ng pagtanggi, bagaman walang tahasang layon sa Griyego.
- source_word: μετὰ ὅρκου
  choice: nang may panunumpa
  rationale: Tumpak na ipinapahayag na sinamahan niya ng panunumpa ang kanyang pagtanggi; hindi nito ipinahihiwatig ang isang pormal na paglilitis.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala nito ang nilalaman ng pagtanggi; natural sa Filipino ang tutuldok at tuwirang sipi.
- source_word: Οὐκ οἶδα
  choice: Hindi ko kilala
  rationale: Sa pagtukoy sa isang tao, ang “kilala” ang likas na katumbas ng kaalamang may personal na pagkakilala.
- source_word: τὸν ἄνθρωπον
  choice: ang taong iyon
  rationale: Tumutukoy ito sa isang lalaking indibidwal. Ginagawang natural ng “iyon” ang parirala sa Filipino habang pinananatili ang mapaglayong paraan ng pagtukoy ni Pedro.
theological_decisions:
- issue: Ang tinutukoy ng “τὸν ἄνθρωπον” sa pagkakaila ni Pedro
  choice: Panatilihin ang tahasang “ang taong iyon” sa halip na palitan ng “siya” o “si Jesus.”
  alternative: “siya” o “si Jesus”
  rationale: Tahasan sa Griyego ang “ang tao,” na nagpapakita ng mapaglayong pananalita ni Pedro. Ang paglalagay ng pangalang Jesus ay magpapasok ng interpretasyon at magpapahina sa retorikal na bigat ng kanyang pagkakaila.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panunumpa” sa halip na “panunumpa sa ilalim ng panunumpa” o ibang pormal na katawagang maaaring magpahiwatig ng hukuman. Ang “taong iyon” ay natural na Filipino at pinananatili ang mapaglayong tono ng pahayag.
