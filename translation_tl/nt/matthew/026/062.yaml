  source_fidelity: Ang unang tanong na “Hindi ka ba sasagot?” ay tapat at natural na katumbas ng Οὐδὲν ἀποκρίνῃ;. Ang “Tumayo ang mataas na pari at sinabi sa kanya” ay wastong naghahatid ng ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ. Ngunit ang “Ano itong pinatotohanan nila laban sa iyo?” ay hindi malinaw ang sintaks at hindi sapat na naipapakita ang demonstratibong οὗτοί (“mga taong ito”) at ang patuloy na pandiwang καταμαρτυροῦσιν.
  naturalness: Natural at angkop ang kabuuang rehistro, ngunit kailangang ayusin ang ikalawang tanong. Ang “Ano itong pinatotohanan nila” ay maaaring basahing ang “ito” bilang bagay na pinatotohanan, sa halip na tumukoy sa mga saksi. Ang “Ano ang pinatototohanan ng mga taong ito laban sa iyo?” ay malinaw, tuwiran, at natural sa dignified na modernong Filipino.
  terminology: Ang “mataas na pari” ay isang katanggap-tanggap na salin ng ὁ ἀρχιερεὺς sa natatanging katungkulan sa kontekstong ito. Ang “pinatototohanan ... laban sa iyo” ay pinananatili upang katawanin ang forensikong diwa ng καταμαρτυροῦσιν at ang adversatibong “laban sa iyo.”
