  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: tl
  text: Tumayo ang mataas na pari at sinabi sa kanya, “Hindi ka ba sasagot? Ano ang pinatototohanan ng mga taong ito laban sa iyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: Tumayo
  rationale: Likas at tuwirang ipinapahayag ang pisikal na pagtayo ng mataas na pari bago siya magsalita.
- source_word: ὁ ἀρχιερεὺς
  choice: ang mataas na pari
  rationale: Karaniwang salin sa Filipino para sa natatanging katungkulang tinutukoy sa kontekstong Judio.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili ang panghalip ng Griyego sa halip na palitan ito ng pangalan ni Jesus.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Hindi ka ba sasagot?
  rationale: Natural na tanong sa modernong Filipino na naghihimok ng tugon at tapat sa diwa ng kasalukuyang anyo ng pandiwa.
- source_word: τί
  choice: Ano itong
  rationale: Inihahayag ang nilalaman ng patotoo sa isang maikli at natural na tanong, nang hindi dinaragdagan ang pahayag.
- source_word: οὗτοί
  choice: nila
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking saksi na naroon; likas sa Filipino na gamitin ang panghalip na maramihan kaysa sa mabigat na “mga taong ito.”
- source_word: σου
  choice: laban sa iyo
  rationale: Kasama ng καταμαρτυροῦσιν, ipinahihiwatig ng genitibo ang salungat at legal na direksiyon ng patotoo.
- source_word: καταμαρτυροῦσιν
  choice: pinatotohanan ... laban
  rationale: Pinananatili ang legal na diwa ng pagbibigay ng patotoo laban sa nasasakdal at ang nagpapatuloy na kilos sa kasalukuyang usapan.
