  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mataas na pari” bilang malinaw at nakaugaliang katawagan sa katungkulan. Ang dalawang tanong ay pinanatiling matalas at tuwiran upang maipakita ang tensiyon ng pagdinig.
