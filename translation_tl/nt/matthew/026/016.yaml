  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang ἀπὸ τότε ay ‘Mula noon,’ ang εὐκαιρία ay ‘pagkakataon,’ at ang ‘isuko si Jesus’ ay maingat na pinananatili ang mas malawak na diwa ng παραδῷ kaysa sa interpretibong ‘ipagkanulo.’ Gayunman, ang imperpektibong ἐζήτει ay mas tuwirang naipapakita ng ‘naghahanap’ kaysa ‘naghanap.’'
