  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: tl
  text: Mula noon ay patuloy siyang naghahanap ng pagkakataong isuko si Jesus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipagkanulo si Jesus.” Ang pandiwang Griyego ay mas literal na nangangahulugang “isuko” o “ibigay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Mula noon
  rationale: Likas at malinaw na ipinapahayag nito ang panahong pinagsimulan ng kilos.
- source_word: ἐζήτει
  choice: patuloy siyang naghanap
  rationale: Ipinahahayag ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na paghahanap; nililinaw ito ng “patuloy.”
- source_word: εὐκαιρίαν
  choice: pagkakataon
  rationale: Natural na katumbas ito ng isang angkop o kanais-nais na pagkakataon, na sapat nang ipinahihiwatig ng konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na ipinapahayag nito ang layunin ng paghahanap.
- source_word: παραδῷ
  choice: isuko
  rationale: Pinananatili nito ang malawak na diwa ng paghahatid o pagbibigay ng isang tao sa kapangyarihan ng iba, nang hindi agad pinakikitid sa “ipagkanulo.”
- source_word: αὐτὸν
  choice: si Jesus
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Tagalog, kung saan parehong “siya” ang maaaring tumukoy kay Judas at kay Jesus.
theological_decisions:
- issue: Pagpapakahulugan sa παραδῷ sa konteksto ng ginawa ni Judas
  choice: isuko si Jesus
  alternative: ipagkanulo si Jesus
  rationale: 'Tunay na pagtataksil ang ginawa ni Judas, ngunit mas malawak ang kahulugan ng παραδίδωμι: ihatid, ibigay, o isuko sa iba. Kaya pinananatili sa pangunahing teksto ang mas malawak na diwa, habang inilalagay sa talababa ang kontekstuwal na alternatibo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy” upang maipakita ang nagpapatuloy na kilos ng imperpektibong pandiwa, at tahasang pinangalanan si Jesus upang maiwasan ang malabong sunuran ng mga panghalip.
