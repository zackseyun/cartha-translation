source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: tl
  text: Ngunit sumusunod si Pedro sa kanya mula sa malayo, hanggang sa patyo ng mataas na pari. Pagpasok niya sa loob, naupo siya kasama ng mga tauhan[a] upang makita ang kahihinatnan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagapaglingkod,” “mga attendant,” o “mga opisyal.” Ang Griyegong ὑπηρέται ay maaaring tumukoy sa mga tauhang nasa ilalim ng isang nakatataas; hindi tiyak sa salita lamang kung ano ang eksaktong tungkulin nila rito.
    reason: lexical_alternative
  - marker: b
    text: O “upang makita ang wakas.” Ang Griyegong τὸ τέλος ay literal na “ang wakas,” ngunit sa kontekstong ito ay maaari ring tumukoy sa kahihinatnan ng mga pangyayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: sumunod
  rationale: Ang di-ganap na aspekto ay naglalarawan sa pagsunod ni Pedro bilang nagpapatuloy na pangyayaring nasa likuran; sa natural na Tagalog, sapat na itong naihahatid ng pandiwang “sumunod” sa konteksto.
- source_word: ἀπὸ μακρόθεν
  choice: mula sa malayo
  rationale: Likas at tuwirang parirala ito para sa pisikal na distansiya.
- source_word: ἕως τῆς αὐλῆς
  choice: hanggang sa patyo
  rationale: Pinananatili ng “hanggang” ang diwa ng hangganan o lawak, at ang αὐλή ay ang nakapaloob na patyo.
- source_word: ἀρχιερέως
  choice: pinakapunong pari
  rationale: Malinaw na tumutukoy sa mataas na saserdoteng katungkulan sa salaysay; iniiwasan nito ang pagkalito sa pangkalahatang “punong pari.”
- source_word: εἰσελθὼν ἔσω
  choice: Pumasok siya
  rationale: 'Natural na Tagalog na nagpapanatili sa pagkakasunod: pumasok muna si Pedro bago umupo.'
- source_word: ἐκάθητο
  choice: umupo
  rationale: Bagaman imperfect ang Griyego at maaaring magpahiwatig ng nagpapatuloy na pag-upo, mas natural sa Tagalog ang “umupo” dito; nauunawaan sa konteksto na nanatili siyang nakaupo.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: kasama ng mga bantay
  rationale: Sa konteksto ng pagdakip at sambahayan ng pinakapunong pari, ang ὑπηρέται ay mga tauhang gumaganap bilang mga bantay o opisyal, hindi lamang mga katulong sa bahay.
- source_word: ἰδεῖν
  choice: upang makita
  rationale: Tuwirang ipinapahayag ang layunin at hindi labis na binibigyang-kahulugan ang pandiwa.
- source_word: τὸ τέλος
  choice: kung ano ang magiging wakas
  rationale: Pinananatili ang literal na “wakas” habang natural na ipinahihiwatig na nais malaman ni Pedro ang kahihinatnan ng mga pangyayari.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pinakapunong pari” para sa tiyak na katungkulan at “mga bantay” para sa kontekstuwal na tungkulin ng ὑπηρέται. Inilagay ang tanging talababa sa tunay na leksikal na kalabuan ng τὸ τέλος.
