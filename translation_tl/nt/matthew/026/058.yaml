  to: Ngunit sumusunod si Pedro sa kanya mula sa malayo, hanggang sa patyo ng mataas na pari. Pagpasok niya sa loob, naupo siya kasama ng mga tauhan[a] upang makita ang kahihinatnan.[b]
  rationale: Pinalitan ang sobrang-tiyak na “mga bantay” ng “mga tauhan” at nilagyan ito ng talababa upang mapanatili ang leksikal na kalabuan ng ὑπηρέται. Ginawang “sumusunod” ang unang pandiwa upang mas maipakita ang imperfect na aspekto. Ginamit ang “mataas na pari” bilang likas at pamantayang Filipino, at pinanatili ang “kahihinatnan” para sa τὸ τέλος, kasama ang literal na alternatibong “wakas” sa talababa.
