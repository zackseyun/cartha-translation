    rationale: Mas tuwirang ipinahihiwatig ng “sumusunod” ang imperfect na paglalarawan sa kilos ni Pedro.
  - severity: low
    issue: Ang “pinakapunong pari” ay hindi kasing-karaniwan ng “mataas na pari” sa makabagong Filipino.
    rationale: Ang “mataas na pari” ay malinaw, natural, at karaniwang terminong pang-Biblia para sa ἀρχιερεύς.
