  source_fidelity: Kailangang itama ang “mga bantay,” dahil ang ὑπηρέται ay mas malawak na tumutukoy sa mga tauhan o opisyal na tagapaglingkod ng sambahayan/hukuman, hindi tiyak na mga bantay. Mas malinaw rin ang aspektong nagpapatuloy ng ἠκολούθει sa “sumusunod.” Napananatili ng “kahihinatnan” ang kontekstuwal na diwa ng τὸ τέλος nang hindi inaalis ang literal na alternatibong “wakas.”
  naturalness: Natural at makabagong Filipino ang binagong pangungusap. Ang “mataas na pari” ay karaniwan at malinaw na katumbas ng ἀρχιερεύς; ang “pagpasok niya sa loob” ay likas na naghahayag ng εἰσελθὼν ἔσω.
  terminology: Ginamit ang “mataas na pari” bilang pamantayang katawagan para sa high priest. Isinalin ang ὑπηρέται bilang “mga tauhan,” na hindi naglilimita sa kahulugan sa mga armadong bantay o sa mga katulong sa bahay lamang.
  issues:
  - severity: medium
    issue: Ang “mga bantay” ay masyadong tiyak para sa ὑπηρέται.
    rationale: Maaaring tumukoy ang salita sa mga attendant, tagapaglingkod, o mababang opisyal. Hindi pinatutunayan ng talata lamang na pawang mga bantay sila.
  - severity: low
