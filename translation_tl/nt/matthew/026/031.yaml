  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi sa kanila ni Jesus, “Ngayong gabi, kayong lahat ay tatalikod dahil sa akin[a], sapagkat nasusulat: ‘Hahampasin ko ang pastol, at mangangalat ang mga tupa ng kawan.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matitisod dahil sa akin” o “mawawalan ng katapatan dahil sa akin.” Saklaw ng salitang Griyego ang pagkatisod o pagtalikod; sa kontekstong ito, tumutukoy ito sa pag-iwan ng mga alagad kay Jesus.
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Zacarias 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag ang kasunod na pangyayari sa salaysay. Ang λέγει ay historikal na pangkasalukuyan sa Griyego; mas natural sa makabagong salaysay na Tagalog ang pangnagdaan na “sinabi.”
- source_word: Πάντες ὑμεῖς
  choice: kayong lahat
  rationale: Pinananatili ang diin ng tahasang panghalip at ng “lahat.”
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: tatalikod sa akin
  rationale: Sa konteksto ng pag-iwan ng mga alagad kay Jesus, malinaw at natural nitong ipinahahayag ang pagkabigo ng kanilang katapatan nang hindi ipinapalagay na ito ay pangwakas na apostasya.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: Ngayong gabi
  rationale: Karaniwan at malinaw na katumbas sa Tagalog ng “sa gabing ito.”
- source_word: γέγραπται γάρ
  choice: sapagkat nasusulat
  rationale: Pinananatili ang nakaugaliang pormulang nagpapakilala ng sipi mula sa Kasulatan at ang sanhi na ipinahihiwatig ng γάρ.
- source_word: Πατάξω τὸν ποιμένα
  choice: Hahampasin ko ang pastol
  rationale: Tuwirang pinananatili ang hinaharap na pandiwa at ang larawang pastoral nang hindi dinaragdagan ang bunga ng paghampas.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: mangangalat ang mga tupa ng kawan
  rationale: Natural na Tagalog na nagpapanatili sa larawan ng pagkakawatak-watak at sa tahasang pagbanggit sa mga tupa at kawan.
theological_decisions:
- issue: Saklaw ng kahulugan ng σκανδαλισθήσεσθε kaugnay ni Jesus
  choice: Tatalikod ang mga alagad kay Jesus sa gabing iyon.
  alternative: Matitisod sila, magdaramdam, o mahuhulog sa kasalanan sa mas pangkalahatang diwa.
  rationale: Ang agarang konteksto at ang sipi tungkol sa nagkalat na mga tupa ay tumutukoy sa pag-iwan nila kay Jesus. Hindi nito ipinapasiya na ang pagtalikod ay pangwakas o di-na-mababawi.
- issue: Historikal na pangkasalukuyan na λέγει
  choice: Isinalin bilang pangnagdaang “sinabi.”
  alternative: Panatilihin ang pangkasalukuyang “sinabi/sinasabi” na tekstuwal na historikal na present.
  rationale: Mas likas sa modernong salaysay na Tagalog ang pangnagdaan, habang hindi nagbabago ang pagkakasunod o saysay ng pangyayari.
- issue: Tagaganap sa Πατάξω
  choice: Pinanatili ang unang panauhang “Hahampasin ko.”
  alternative: Gawing balintiyak o tukuyin nang tahasan kung sino ang “ako.”
  rationale: Pinananatili ang gramatikal at teolohikal na tensiyon ng sipi nang hindi ipinapaliwanag sa mismong talata ang pagkakakilanlan ng nagsasalita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Ngayong gabi” at “tatalikod sa akin” bilang likas na pananalita, habang pinanatili ang pormal na pormulang “sapagkat nasusulat” at ang pastoral na larawan ng sipi.
