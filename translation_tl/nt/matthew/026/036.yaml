  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: tl
  text: Pagkatapos, pumunta si Jesus kasama nila sa isang lugar na tinatawag na Getsemani. Sinabi niya sa mga alagad, “Maupo kayo rito habang[a] pupunta ako roon upang manalangin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Maupo kayo rito hanggang sa pumunta ako roon at manalangin.” Mas literal na “hanggang sa” ang Griyego, ngunit mas natural sa Filipino rito ang “habang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa makabagong Filipino na nag-uugnay sa kasunod na pangyayari sa salaysay.
- source_word: ἔρχεται
  choice: pumunta
  rationale: Isinalin sa karaniwang panahunang nagdaan ng salaysay sa Filipino; hindi kailangang tularan ang historikal na pangkasalukuyan ng Griyego upang mapanatili ang buhay at natural na daloy.
- source_word: μετ’ αὐτῶν
  choice: kasama nila
  rationale: Tuwirang ipinahahayag ang diwa ng pagsama ng μετά na may genitive.
- source_word: χωρίον
  choice: isang lugar
  rationale: Malawak at hindi mapagpalagay na katumbas; hindi idinaragdag ang ‘hardin,’ na hindi tahasang sinabi sa talatang ito ni Mateo.
- source_word: λεγόμενον Γεθσημανί
  choice: tinatawag na Getsemani
  rationale: Natural na pormula sa Filipino para sa pangalan ng isang lugar; ang pangalang Griyego ay tinumbasan ayon sa nakaugaliang transliterasyong Filipino.
- source_word: λέγει τοῖς μαθηταῖς
  choice: Sinabi niya sa mga alagad
  rationale: Natural na salaysay sa Filipino; malinaw na pinananatili ang mga alagad bilang pinatutungkulan.
- source_word: Καθίσατε αὐτοῦ
  choice: Maupo kayo rito
  rationale: Ang simpleng utos at ang lokatibong αὐτοῦ ay likas na naihahayag sa kasalukuyang Filipino.
- source_word: ἕως οὗ
  choice: habang
  rationale: Natural na ipinahahayag ang pansamantalang paghihintay ng mga alagad samantalang aalis si Jesus upang manalangin; itinala sa talababa ang mas literal na ‘hanggang sa.’
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: pumupunta ako roon upang manalangin
  rationale: Ginagawang natural na sugnay sa Filipino ang participle at subjunctive, habang pinananatili ang pagpunta sa ibang lugar at ang layuning manalangin.
theological_decisions:
- issue: Katangian ng Getsemani
  choice: ‘lugar’ ang ginamit para sa χωρίον
  alternative: ‘hardin’
  rationale: Lugar o lupain lamang ang tahasang tinutukoy ng salita ni Mateo. Ang ‘hardin’ ay mag-aangkat ng detalye mula sa ibang salaysay sa halip na panatilihin ang sariling pananalita ng tekstong ito.
- issue: Tagal ng paghihintay ng mga alagad
  choice: ‘habang’ sa pangunahing teksto
  alternative: ‘hanggang sa’
  rationale: Hindi pinatitigas ang pahayag bilang eksaktong hangganan kung kailan maaari nang umalis ang mga alagad. Pinananatili sa talababa ang mas literal na anyo ng Griyego at ang posibleng pagkakaiba ng diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang panahunang nagdaan para sa salaysay, sa halip na piliting tularan ang historikal na pangkasalukuyan ng Griyego. Iniwasan ang salitang ‘hardin’ upang hindi magdagdag ng detalyeng wala sa mismong teksto ni Mateo.
