review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang sunod na pangyayari, pagsama ni Jesus sa mga alagad, ang hindi-tiyak na χωρίον bilang “lugar,” ang pangalang Getsemani, at ang utos na manatili roon habang siya ay pupunta sa ibang lugar upang manalangin. Gayunman, ang “pumupunta ako” ay aspektuwal na hindi angkop sa prospektibong kilos kasunod ng utos at medyo lumilihis sa natural na pagpapahayag ng ἀπελθὼν ... προσεύξωμαι.
  naturalness: Ang “Maupo kayo rito habang pumupunta ako roon” ay hindi likas sa modernong Filipino; ang pangkasalukuyang imperpektibo na “pumupunta” ay karaniwang nagsasaad ng paulit-ulit o kasalukuyang nagaganap na pagkilos. Mas natural ang “habang pupunta ako roon upang manalangin.”
  terminology: Ang “mga alagad,” “Getsemani,” at “manalangin” ay angkop at marangal na modernong Filipino. Ang “lugar” para sa χωρίον ay wastong hindi nagdaragdag ng “hardin.”
  issues:
  - severity: medium
    issue: Hindi natural ang aspektong “pumupunta ako” sa direktang utos.
    rationale: Ang Griyegong aorist participle na ἀπελθὼν, kasama ng subjunctive na προσεύξωμαι, ay tumutukoy sa kilos na balak gawin ni Jesus pagkatapos niyang iwan ang mga alagad. Sa Filipino, mas malinaw at likas ang prospektibong “pupunta ako.”
  - severity: low
    issue: Maaaring linawin nang bahagya ang talababa upang iwasang magmukhang ang pagdating lamang ni Jesus sa lugar ang hangganan ng paghihintay.
    rationale: Saklaw ng Griyegong alternatibong “hanggang sa” ang pag-alis/pagpunta at pananalangin; dapat panatilihin ng saling alternatibo ang dalawang kilos.
  revised_text: Pagkatapos, pumunta si Jesus kasama nila sa isang lugar na tinatawag na Getsemani. Sinabi niya sa mga alagad, “Maupo kayo rito habang[a] pupunta ako roon upang manalangin.”
