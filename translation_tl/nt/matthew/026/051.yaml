revisions:
- from: At masdan, iniunat ng isa sa mga kasama ni Jesus ang kanyang kamay, binunot ang kanyang tabak, at tinaga ang alipin ng pinakapunong pari, at natigpas ang tainga nito.[a]
  to: At masdan, iniunat ng isa sa mga kasama ni Jesus ang kanyang kamay, binunot ang kanyang tabak, at tinaga ang alipin[a] ng punong pari, at tinagpas ang tainga nito.
  rationale: Ginawang aktibo at tahasan ang huling kilos upang maipakita ang ἀφεῖλεν, pinalitan ang hindi gaanong natural na «pinakapunong pari» ng «punong pari,» at inilipat ang footnote anchor sa salitang «alipin» na siyang tinutukoy ng talababa. Pinanatili ang naratibong diin ng «At masdan» at ang hindi pagtukoy sa identidad ng isa sa mga kasama ni Jesus.
  reviewer_model: gpt-5.6-terra
