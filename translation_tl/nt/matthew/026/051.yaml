reference: Matthew 26:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: tl
  text: At masdan, iniunat ng isa sa mga kasama ni Jesus ang kanyang kamay, binunot ang kanyang tabak, at tinaga ang alipin[a] ng punong pari, at tinagpas ang tainga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod” para sa “alipin” (δοῦλος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang biglaan at malinaw na pagtuon ng pansin sa salaysay; dignified ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: isa sa mga kasama ni Jesus
  rationale: Natural na Tagalog para sa partitive construction at hindi tinutukoy kung sino ang taong iyon.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat ... ang kanyang kamay
  rationale: Tuwirang inilalarawan ang kilos na nauna sa pagbunot, alinsunod sa aorist participle.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: binunot ang kanyang tabak
  rationale: Karaniwang Filipino para sa pagkuha ng sandata mula sa kinalalagyan nito, nang hindi dinaragdagan ang detalye ng kaluban.
- source_word: μάχαιραν
  choice: tabak
  rationale: Sapat na malawak upang katawanin ang maikling espada o malaking patalim na maaaring tukuyin ng μάχαιρα, nang hindi labis na tinutukoy ang uri.
- source_word: πατάξας
  choice: tinaga
  rationale: Sa konteksto ng tabak at pagkatigpas ng tainga, ipinahahayag nito ang marahas na hampas na may talim nang natural sa Filipino.
- source_word: δοῦλον
  choice: alipin
  rationale: Pinananatili ang kongkretong kalagayang panlipunan ng δοῦλος sa sambahayan o institusyon ng pinakapunong pari, sa halip na palambutin bilang karaniwang lingkod.
- source_word: ἀρχιερέως
  choice: pinakapunong pari
  rationale: Maliwanag at nakaugaliang katumbas ng singular na ἀρχιερεύς sa kontekstong Judio.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: natigpas ang tainga nito
  rationale: Natural na inilalahad sa Filipino ang resultang literal na 'naalis' ang tainga dahil sa taga; hindi nito nililimitahan ang ὠτίον sa pingol lamang.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa isang kongkretong ugnayang panlipunan
  choice: alipin
  alternative: lingkod
  rationale: Ang alipin ay mas tapat sa bonded status na ipinahihiwatig ng δοῦλος. Inilalagay sa talababa ang mas malambot ngunit posibleng saling 'lingkod' nang hindi ikinukubli ang pangunahing kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang “masdan” upang mapanatili ang estilong pasalaysay ni Mateo, at “pinakapunong pari” bilang pormal ngunit madaling maunawaang katawagan. Ang panghalip na “nito” ay tumutukoy sa alipin at umiiwas sa sunod-sunod na “kanyang” na maaaring maging malabo.
