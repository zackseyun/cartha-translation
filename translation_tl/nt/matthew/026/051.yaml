review_pass:
  verdict: revise
  source_fidelity: Ang «natigpas ang tainga nito» ay nagpapahayag ng resulta ngunit ginagawang di-tuwiran ang pandiwang ἀφεῖλεν, na may tahasang tagaganap na ang kasama ni Jesus. Ang «tinagpas ang tainga nito» ay mas malinaw na tumutugon sa aktibong pagkakabuo ng Griyego at sa kahulugang naputol/naalis ang tainga dahil sa hampas ng tabak. Ang «isa sa mga kasama ni Jesus,» «iniunat ... ang kanyang kamay,» «binunot ang kanyang tabak,» at «alipin» ay tapat sa pinagmulan at hindi nagpapakilala sa taong hindi pinangalanan ni Mateo.
  naturalness: Natural at malinaw ang inayos na pangungusap sa modernong Filipino. Ang «tinaga ... at tinagpas ang tainga nito» ay may bahagyang sinadyang pag-uulit upang mapanatili ang dalawang magkaibang kilos sa Griyego—ang paghampas at ang pagkaputol ng tainga—nang hindi lumabo kung sino ang gumawa ng huling kilos.
  terminology: Ang «alipin» ay angkop para sa δοῦλος sa kongkretong ugnayang panlipunan. Ang «punong pari» ay mas natural na katawagang Filipino para sa singular na ἀρχιερεύς kaysa «pinakapunong pari,» na maaaring magmungkahi ng isang di-kinakailangang antas ng paghahambing. Inilagay ang talababa kasunod mismo ng «alipin,» ang salitang tinutukoy nito.
  issues:
  - severity: medium
    issue: Di-tuwiran ang «natigpas ang tainga nito.»
    rationale: Ang Griyegong ἀφεῖλεν ay aktibong pandiwa at ang taong kasama ni Jesus ang tagaganap. Ang dating salin ay maaaring basahing basta napigtas ang tainga, samantalang ang teksto ay nagsasabing siya ang nag-alis/nagputol nito.
  - severity: low
    issue: Ang «pinakapunong pari» ay hindi ang pinakanatural na titulo sa Filipino.
    rationale: Ang ἀρχιερεύς ay «high priest» bilang titulo, hindi kinakailangang isang superlatibong paghahambing. Mas tuwiran ang «punong pari.»
  - severity: low
    issue: Malayo ang footnote anchor sa «alipin.»
    rationale: Dahil ang talababa ay alternatibo para sa δοῦλος, dapat itong ikabit agad sa saling «alipin» upang malinaw ang tinutukoy.
  revised_text: At masdan, iniunat ng isa sa mga kasama ni Jesus ang kanyang kamay, binunot ang kanyang tabak, at tinaga ang alipin[a] ng punong pari, at tinagpas ang tainga nito.
  revised_footnotes:
  - marker: a
    text: O “lingkod” para sa “alipin” (δοῦλος).
    reason: lexical_alternative
  revision_rationale: Ginawang aktibo at tahasan ang huling kilos upang maipakita ang ἀφεῖλεν, pinalitan ang hindi gaanong natural na «pinakapunong pari» ng «punong pari,» at inilipat ang footnote anchor sa salitang «alipin» na siyang tinutukoy ng talababa. Pinanatili ang naratibong diin ng «At masdan» at ang hindi pagtukoy sa identidad ng isa sa mga kasama ni Jesus.
