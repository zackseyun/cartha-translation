  source_fidelity: Tumpak ang diwa ng patuloy na pananahimik, ang pormal na pag-uutos sa ilalim ng panunumpa, at ang mga titulong “Mesiyas” at “Anak ng Diyos.” Gayunman, ang “sa harap ng Diyos” ay mas malapit sa lokasyon/pagharap kaysa sa panawagang “sa pamamagitan/ngalan ng” Diyos na ipinahihiwatig ng κατὰ kasunod ng ἐξορκίζω. Ang “punong pari” ay mas tuwiran at karaniwang katumbas ng ἀρχιερεύς kaysa “kataas-taasang pari.”
  naturalness: Natural ang pangungusap sa makabagong Filipino. Mas idiomatiko at mas malinaw sa hudisyal na rehistro ang “Iniuutos ko sa iyo, sa ngalan ng Diyos na buháy” kaysa “Pinanunumpa kita sa harap ng Diyos na buháy.”
  terminology: Panatilihin ang “Mesiyas” bilang salin ng titulong Χριστός, kasama ang “Cristo” bilang alternatibo sa talababa. “Anak ng Diyos” ay tumpak. “Punong pari” ang inirerekomendang katawagan para sa ἀρχιερεύς.
