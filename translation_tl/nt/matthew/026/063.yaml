  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: tl
  text: Ngunit nanatiling tahimik si Jesus. Sinabi sa kanya ng punong pari, “Iniuutos ko sa iyo, sa ngalan ng Diyos na buháy[b], na sabihin mo sa amin kung ikaw ang Mesiyas[a], ang Anak ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong titulong Christos ay isinaling “Mesiyas” dito dahil ginagamit ito bilang titulo, hindi bilang pangalan.
    reason: alternative_reading
  - marker: b
    text: O “Pinanunumpa kita sa ngalan ng Diyos na buháy.” Ang Griyego ay isang taimtim na pormula ng panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: nanatiling tahimik
  rationale: Ipinahihiwatig ng aspektong imperpekto ang patuloy na pananahimik ni Jesus, hindi lamang ang isang saglit na hindi pagsagot.
- source_word: ἀρχιερεὺς
  choice: kataas-taasang pari
  rationale: Karaniwan at malinaw na katawagan sa punong paring Judio sa konteksto ng paglilitis.
- source_word: Ἐξορκίζω σε
  choice: Pinanunumpa kita
  rationale: Ipinahahayag nito ang taimtim at hudisyal na pag-aatas sa ilalim ng panunumpa, hindi ang diwang may kaugnayan sa pagpapalayas ng espiritu.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: sa harap ng Diyos na buháy
  rationale: Likas sa Filipino bilang taimtim na pormula ng panunumpa at malinaw na ipinakikitang ang Diyos ang saksi at batayan ng pag-aatas.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: sabihin mo sa amin
  rationale: Natural at tuwirang ipinahahayag ang hinihinging sagot matapos ang pormula ng panunumpa.
- source_word: ὁ χριστὸς
  choice: ang Mesiyas
  rationale: Dito ay titulo ito ng inaasahang Pinahiran, hindi isang pangalang pantangi; pinananatili sa talababa ang alternatibong “Cristo.”
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Tuwirang pinananatili ang tiyak na titulong kristolohikal nang hindi ito pinalalawak o pinahihina.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ngunit ... si Jesus
  rationale: Ipinakikita ng “Ngunit” ang banayad na pagsalungat sa naunang mga paratang at patotoo.
theological_decisions:
- issue: Paglilipat ng Χριστός sa tuwirang tanong tungkol sa pagkakakilanlan ni Jesus
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang salita ay gumaganap dito bilang titulo ng inaasahang Pinahiran. Ang “Mesiyas” ang mas malinaw na naghahatid ng tungkulin nitong titulo, habang inilalagay ang “Cristo” bilang lehitimong alternatibo sa talababa.
- issue: Lakas ng pormulang Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Taimtim na pag-aatas sa ilalim ng panunumpa
  alternative: Karaniwang utos lamang
  rationale: Pormal na dinadalang saksi ang Diyos sa konteksto ng paglilitis; kaya dapat mapanatili ang bigat ng panunumpa at hindi ito gawing simpleng utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nanatiling tahimik” upang ipakita ang nagpapatuloy na kilos, at “Pinanunumpa kita” upang mapanatili ang bigat ng tagpong hudisyal. Ang mga panandang talababa ay itinugma sa mismong mga salitang nililinaw.
