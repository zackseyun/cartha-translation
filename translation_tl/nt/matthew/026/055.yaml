id: MAT.26.55
reference: Matthew 26:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: tl
  text: Noong oras na iyon, sinabi ni Jesus sa mga tao, “Lumabas ba kayo na may dalang mga espada at pamalo upang hulihin ako, na para bang ako'y isang tulisan[a]? Araw-araw ay nakaupo ako sa templo[b] at nagtuturo, at hindi ninyo ako dinakip.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bandido” o “rebelde.” Ang salitang Griego ay maaaring tumukoy sa isang marahas na tulisan o, sa ilang konteksto, sa isang naghihimagsik.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griego rito ay tumutukoy sa templo kasama ang mga looban at iba pang bahagi ng kompleks nito, hindi lamang sa panloob na santuwaryo.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Nang oras na iyon
  rationale: Likas na salin sa modernong Tagalog na pinananatili ang tiyak at agarang pagtukoy sa oras.
- source_word: τοῖς ὄχλοις
  choice: sa mga tao
  rationale: Bagaman maramihan ang ὄχλοις, ang “mga tao” ang pinakanatural na tawag sa mga pangkat na naroon; ang “mga karamihan” ay hindi likas sa Tagalog.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: Para ba akong tulisan
  rationale: Inihahatid nito bilang natural na retorikal na tanong ang diwang ‘na para bang laban sa isang tulisan’ nang hindi nililimitahan ang λῃστής sa isang tiyak na uri ng kriminal o rebelde.
- source_word: ἐξήλθατε
  choice: lumabas kayo
  rationale: Pinananatili ang pangunahing larawan ng paglabas o pagpunta ng armadong pangkat, sa halip na gawing simpleng ‘dumating.’
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: na may dalang mga espada at pamalo
  rationale: Ang μάχαιραι ay mga sandatang patalim at ang ξύλα rito ay mga kahoy na ginagamit na pamalo; malinaw sa Tagalog ang gamit ng mga ito bilang sandata.
- source_word: συλλαβεῖν με
  choice: upang hulihin ako
  rationale: Ang “hulihin” ay natural para sa layunin ng pag-aresto at nagbibigay-daan upang maiba nang bahagya ang kasunod na κρατέω.
- source_word: καθ’ ἡμέραν
  choice: Araw-araw
  rationale: Tuwirang ipinapahayag ang paulit-ulit at nakaugaliang kilos.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Karaniwang nauunawaan ang ἱερόν bilang templo o buong kompleks nito; simple at malinaw ang pangunahing salin, habang nililinaw sa talababa ang saklaw.
- source_word: ἐκαθεζόμην διδάσκων
  choice: nakaupo ako ... at nagtuturo
  rationale: Pinananatili ang nagpapatuloy o nakaugaliang kilos ng imperfect at ang kasabay na pagtuturo.
- source_word: οὐκ ἐκρατήσατέ με
  choice: hindi ninyo ako dinakip
  rationale: Ang “dinakip” ay nagpapahayag ng aktuwal na marahas o sapilitang pagsunggab at bahagyang naiiba sa naunang “hulihin.”
theological_decisions:
- issue: Saklaw ng kahulugan ng λῃστής
  choice: tulisan
  alternative: bandido o rebelde
  rationale: Maaaring tumukoy ang λῃστής sa marahas na magnanakaw, bandido, o sa ilang konteksto ay rebelde. Hindi hinihingi ng talata na gawing tiyak ang politikal na diwa, kaya malawak at natural ang “tulisan,” at inilalahad sa talababa ang ibang posibilidad.
- issue: Saklaw ng ἱερόν
  choice: templo
  alternative: looban o buong kompleks ng templo
  rationale: Hindi ito ang ναός na mas tiyak na tumutukoy sa santuwaryo. Gayunman, natural at sapat ang “templo” sa pangunahing teksto, kalakip ang paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang malinaw na retorikal na ayos na “Para ba akong tulisan kaya…” upang maihatid ang puwersa ng tanong nang hindi nagiging matigas o banyaga ang sintaks. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
