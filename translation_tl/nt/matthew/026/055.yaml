  source_fidelity: 'Tumpak na naihahatid ng draft ang mga pangunahing elemento ng Griyego: ang armadong paglabas, layuning hulihin si Jesus, ang pang-araw-araw na pagtuturo niya sa templo, at ang hindi nila pagdakip noon. Gayunman, ang “Nang oras na iyon” ay hindi likas na pangungusap na pang-abay sa Tagalog; ang “Noong oras na iyon” ang wastong katumbas ng ἐν ἐκείνῃ τῇ ὥρᾳ. Inayos din ang tanong upang malinaw na ang paghahambing na “para bang ... tulisan” ang tumutukoy sa paraan ng pagtrato sa kanya.'
