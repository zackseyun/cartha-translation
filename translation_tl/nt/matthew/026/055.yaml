  terminology: Ang “tulisan” ay angkop na pangunahing salin ng λῃστής nang hindi ipinipilit ang mas tiyak na kahulugang politikal. Ang “espada at pamalo,” “hulihin,” at “dinakip” ay malinaw at angkop sa konteksto. Ang “templo” ay sapat sa teksto, at wastong ipinapaliwanag ng talababa ang mas malawak na saklaw ng ἱερόν.
