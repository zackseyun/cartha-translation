- from: Ngunit sinasabi ko sa inyo, mula ngayon ay tiyak na hindi na ako iinom ng bungang ito ng ubas hanggang sa araw na iyon, kapag iinumin ko itong bago[a] na kasama ninyo sa kaharian ng aking Ama.
  to: 'Ngunit sinasabi ko sa inyo: mula ngayon, tiyak na hindi na ako iinom mula sa bungang ito ng puno ng ubas hanggang sa araw na iyon, kapag muli ko itong inumin[a] kasama ninyo sa kaharian ng aking Ama.'
  rationale: Pinalitan ang di-natural na “iinumin ko itong bago” ng idiomatikong “muli ko itong inumin,” na angkop sa pang-abay na gamit ng καινόν. Dahil hindi ganap na nalulutas ng konteksto kung ang diin ay ‘muli’ o ‘sa bagong paraan/bagong kalidad,’ iningatan ang alternatibong pagbasa sa talababa. Pinahusay din ang katumbas ng ἐκ at ng idyomang ‘fruit of the vine.’
