  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: mula ngayon, tiyak na hindi na ako iinom mula sa bungang ito ng puno ng ubas hanggang sa araw na iyon, kapag muli ko itong inumin[a] kasama ninyo sa kaharian ng aking Ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang bagong paraan.” Ang pang-uri sa Griyego ay maaaring tumukoy sa pagiging bago sa uri o katangian; maaari rin itong mangahulugang “muli.” Maaaring ipinahihiwatig ng parirala ang pag-inom nito sa isang bagong paraan sa darating na kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Ginamit ang “ngunit” upang mapanatili ang banayad na pagsalungat o paglipat na ipinahihiwatig ng δέ, habang natural pa rin sa Filipino.
- source_word: οὐ μὴ πίω
  choice: tiyak na hindi na ako iinom
  rationale: Ang οὐ μή na sinusundan ng aorist subjunctive ay mariing pagtanggi tungkol sa hinaharap. Ipinahahayag ng “tiyak na hindi na” ang diin nang hindi gumagamit ng lipas o sobrang absolutong pananalita.
- source_word: ἀπ’ ἄρτι
  choice: mula ngayon
  rationale: Tuwirang ipinakikita nito na ang tinutukoy na panahon ay nagsisimula sa kasalukuyang sandali.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: ng bungang ito ng ubas
  rationale: Pinananatili nito ang idyomang “bunga ng ubas” sa halip na tahasang gawing “alak,” sapagkat γένημα ang ginamit sa Griyego at hindi οἶνος.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: hanggang sa araw na iyon
  rationale: Pinananatili ng “iyon” ang demonstratibong diin ng ἐκείνης sa isang tiyak na araw sa hinaharap.
- source_word: ὅταν αὐτὸ πίνω
  choice: kapag iinumin ko ito
  rationale: Ipinahahayag ng “kapag” ang panghinaharap na pangyayaring tinutukoy ng ὅταν kasama ng subjunctive; ang “ito” ay tumutukoy sa naunang binanggit na bunga ng ubas o laman ng kopa.
- source_word: καινὸν
  choice: bago
  rationale: Ang καινός ay maaaring tumukoy sa pagiging bago sa uri o katangian. Ang payak na “bago” ang pinakamalapit na salin at hindi nagpapasya kung ang diwa ay “muli” o “sa isang bagong paraan.”
- source_word: μεθ’ ὑμῶν
  choice: na kasama ninyo
  rationale: Malinaw at likas nitong ipinahahayag ang pakikisama o pag-inom na kapiling ang mga alagad.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: sa kaharian ng aking Ama
  rationale: Malapit ito sa ayos ng Griyego at pinananatili ang marangal na pagtukoy ni Jesus sa “aking Ama.”
theological_decisions:
- issue: Kung tahasang isasalin bilang “alak” ang laman ng kopa o pananatilihin ang idyoma
  choice: Pinanatili sa pangunahing teksto ang “bungang ito ng ubas.”
  alternative: alak
  rationale: “Bunga/ani ng ubas” ang literal na pahayag ng Griyego, hindi ang karaniwang salita para sa alak. Ang pagpapanatili sa idyoma ay umiiwas sa pagdaragdag ng sakramental o simbolikong katiyakang hindi tahasang sinasabi ng talata.
- issue: Ang kahulugan ng καινὸν sa darating na piging ng kaharian
  choice: Ginamit ang “bago” nang hindi tinutukoy kung ito ay bagong uri o kalidad, muling pakikibahagi, o pag-inom sa isang bagong paraan.
  alternative: panibago; muli; sa isang bagong paraan
  rationale: Hindi lubos na nilulutas ng talata ang eksaktong himig ng καινόν. Pinananatili ng “bago” at ng talababa ang tunay na leksikal at teolohikal na puwang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang diin ng panghinaharap na pagtanggi at ang tradisyonal ngunit nauunawaang idyomang “bunga ng ubas.” Ang bahagyang di-karaniwang pariralang “iinumin ko itong bago” ay sadyang nagpapanatili sa pagkakaugnay ng καινόν sa iniinom nang hindi pinipili nang tahasan ang diwang “muli” o “sa bagong paraan.”
