review_pass:
  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay wastong naipapasa: mariing pagtanggi ni Jesus na uminom mula ngayon hanggang sa tiyak na araw sa hinaharap, kasama ang mga alagad sa kaharian ng kanyang Ama. Gayunman, ang “iinumin ko itong bago” ay hindi ligtas na Filipino: ang “bago” ay likás na mababasa bilang pang-uring naglalarawan sa “ito,” hindi bilang pang-abay na katumbas ng καινόν. Nilinaw ang pang-abay na gamit nang hindi isinasara ang leksikal na puwang sa talababa. Isinauli rin ang ἐκ (“mula sa”) at ginawang mas tumpak ang “fruit/product of the vine” bilang “bungang ito ng puno ng ubas.”'
  naturalness: Ang rebisadong pangungusap ay makabago, malinaw, at marangal na Filipino. Ang “kapag muli ko itong inumin” ay likás na panghinaharap na sugnay; itinatala ng talababa na ang Griyego ay maaari ring mangahulugang pag-inom sa bagong paraan o bilang bago sa uri/katangian.
  terminology: Pinanatili ang “kaharian ng aking Ama” at hindi pinalitan ang idyoma ng tahasang “alak.” Ang “muli” sa pangunahing teksto ay ang pinakaidiomatikong Filipino para sa pang-abay na gamit ng καινόν dito, habang pinapanatili ng talababa ang posibilidad na “sa isang bagong paraan” at bagong kalidad/uri.
  issues:
  - severity: medium
    issue: Hindi natural at posibleng mali ang saklaw ng “bago” sa “kapag iinumin ko itong bago na kasama ninyo.”
    rationale: Sa Filipino, ang “bago” sa ayos na ito ay karaniwang naglalarawan sa “ito” bilang isang bagong bagay, at ang “na kasama ninyo” ay lalo pang nagpapabigat at nagpapalabo sa pangungusap. Ang καινόν ay gumaganap nang pang-abay kaugnay ng pag-inom; kailangan itong isalin nang idiomatiko.
  - severity: low
    issue: Nawala ang “mula sa” na katapat ng ἐκ sa “iinom ng bungang ito.”
    rationale: Nauunawaan ang draft, ngunit ang “iinom mula sa bungang ito” ay mas malinaw na pinananatili ang preposisyonal na ugnayan ng Griyego.
  - severity: low
    issue: Ang “bungang ito ng ubas” ay maaaring mangahulugang ‘ang bungang ito na pag-aari ng ubas’ sa halip na ‘fruit of the vine.’
    rationale: Ang “bungang ito ng puno ng ubas” ay mas malinaw na katapat ng γενήματος τῆς ἀμπέλου at pinananatili ang idyoma nang hindi tahasang ipinapasok ang “alak.”
