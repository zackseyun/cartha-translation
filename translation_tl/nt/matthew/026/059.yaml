  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: tl
  text: Ang mga punong pari at ang buong konseho[a] ay patuloy na naghahanap ng huwad na patotoo[b] laban kay Jesus upang maipapatay nila si Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang buong Sanhedrin.” Ito ang namamahalang konseho ng mga Judio.
    reason: cultural_note
  - marker: b
    text: O, “huwad na saksi.” Ang salitang Griyego ay maaaring tumukoy sa huwad na patotoo o sa huwad na saksi sa isang paglilitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito sa daloy ng salaysay. Hindi kailangan ang artipisyal na panimulang “Ngayon” o ang mas mariing “Ngunit” sa natural na Tagalog.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwan at tumpak na tawag sa nakatataas na pamunuang makapari; hindi nito ipinahihiwatig na maraming sabay-sabay na nanunungkulang pinakapunong pari.
- source_word: συνέδριον ὅλον
  choice: ang buong kapulungan
  rationale: Isinalin ang katawagan para maging malinaw sa pangkalahatang mambabasa, habang pinananatili ng “buong” ang diin ng ὅλον sa lupon bilang kabuuan.
- source_word: ἐζήτουν
  choice: patuloy na naghahanap
  rationale: Ipinahahayag ng pariralang ito ang nagpapatuloy na kilos ng imperfect, hindi lamang isang minsanang paghahanap.
- source_word: ψευδομαρτυρίαν
  choice: huwad na patotoo
  rationale: Natural ito sa makabagong Tagalog at malinaw na tumutukoy sa nilalaman ng pagsaksi sa isang usaping panghukuman.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: laban kay Jesus
  rationale: Tuwirang ipinapahayag nito ang pagsalungat at paratang na nakatuon kay Jesus sa kontekstong panghukuman.
- source_word: ὅπως
  choice: upang
  rationale: Pinananatili nito nang maikli at natural ang layuning ipinahahayag ng sugnay.
- source_word: θανατώσωσιν
  choice: maipapatay nila siya
  rationale: Ipinapakita nito ang layunin ng mga pinuno na maisagawa ang pagpatay kay Jesus sa kontekstong panghukuman, nang hindi idinaragdag na napatunayan muna siyang nagkasala.
theological_decisions:
- issue: Panghukumang himig ng layunin ng mga pinuno
  choice: Inilarawan ang patuloy nilang paghahanap ng huwad na patotoo upang maipapatay si Jesus.
  alternative: “upang patayin nila siya”
  rationale: Magkasamang inilalarawan ng imperfect na ἐζήτουν at ng layuning ὅπως…θανατώσωσιν ang sinasadya at nagpapatuloy na pagkilos upang humantong sa kamatayan ni Jesus. Pinananatili ito nang hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” sa teksto para madaling maunawaan, at inilagay sa talababa ang teknikal na katawagang “Sanhedrin.”
