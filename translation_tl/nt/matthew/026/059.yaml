  to: Ang mga punong pari at ang buong konseho[a] ay patuloy na naghahanap ng huwad na patotoo[b] laban kay Jesus upang maipapatay nila si Jesus.
  rationale: Pinalitan ang “buong kapulungan” ng “buong konseho” upang mas tumpak na matukoy ang συνέδριον bilang ruling council, nang hindi kinakailangang gumamit ng teknikal na transliterasyon sa pangunahing teksto. Inayos din ang lexical-alternative na talababa upang maging natural na Tagalog at mapanatili ang saklaw ng terminong Griyego. Walang binago sa daloy ng imperfect o sa layuning ipinahahayag ng ὅπως…θανατώσωσιν.
