  terminology: Pinananatili ang “mga punong pari,” “huwad na patotoo,” at “Sanhedrin” bilang naaangkop na mga terminong pangkasaysayan at panghukuman. Ang “maipapatay nila si Jesus” ay pinananatili upang maipahayag ang layuning ipapatay siya nang walang dagdag na pahayag na nahatulan o opisyal na isinagawa ang pagbitay.
