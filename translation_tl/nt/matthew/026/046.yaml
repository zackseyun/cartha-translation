  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: tl
  text: Bumangon kayo, umalis na tayo. Tingnan ninyo, lumapit na ang nagkakanulo sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “ang nagbibigay sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bumangon kayo
  rationale: Pautos na maramihan ang pandiwa; tuwiran at natural itong panawagan ni Jesus sa mga alagad na bumangon.
- source_word: ἄγωμεν
  choice: umalis na tayo
  rationale: Ang hortatory subjunctive ay paanyayang kumilos silang magkakasama. Sa konteksto, natural na ipinahihiwatig ng “umalis na tayo” ang agarang pagkilos, nang hindi kinakailangang tukuyin ang destinasyon.
- source_word: ἰδού
  choice: Tingnan ninyo
  rationale: Itinatawag-pansin nito ang isang kagyat na pangyayari; pinananatili ng anyong maramihan ang pakikipag-usap sa mga alagad.
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Ipinahahayag ng perpektong anyo ang paglapit na may kasalukuyang resulta. Natural na naihahatid ng “malapit na” ang nalalapit at kagyat na pagdating.
- source_word: ὁ παραδιδούς με
  choice: ang magkakanulo sa akin
  rationale: Sa konteksto ng salaysay ng paghihirap, ang taong magbibigay kay Jesus sa mga kaaway ay nagkakanulo sa kaniya. Pinananatili sa talababa ang mas kongkretong diwang “magbibigay sa akin sa kamay ng iba.”
theological_decisions:
- issue: Pagpapakahulugan sa παραδιδούς sa konteksto ng paghihirap ni Jesus
  choice: ang magkakanulo sa akin
  alternative: ang magbibigay sa akin sa kamay ng iba
  rationale: Ang participle ay literal na tumutukoy sa taong nagbibigay o nagsasakamay kay Jesus sa iba, at sa kontekstong ito ang gawaing iyon ay pagkakanulo. Gumagamit ang pangunahing teksto ng natural na terminong Filipino, habang inilalahad ng talababa ang kongkretong kilos ng pandiwa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino para sa agarang pananalita. Ginamit ang “kayo/ninyo” upang malinaw na maipakita ang maramihang kausap, at iniwasan ang mga salitang lipas gaya ng “narito” bilang salin ng ἰδού.
