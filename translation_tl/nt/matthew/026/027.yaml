id: MAT.26.27
reference: Matthew 26:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: tl
  text: At kumuha siya ng isang kopa at nagpasalamat. Ibinigay niya iyon sa kanila at sinabi, “Uminom kayong lahat mula rito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: kumuha siya
  rationale: Ang aorist participle ay ginawang likas na pandiwang Filipino; malinaw pa rin na nauna ang pagkuha sa pagbibigay.
- source_word: ποτήριον
  choice: isang kopa
  rationale: Walang artikulo ang pangngalan sa Griyego. Pinananatili ng “isang” ang anyong di-tiyak, at ang “kopa” ay angkop at marangal sa konteksto ng salu-salo.
- source_word: εὐχαριστήσας
  choice: nagpasalamat
  rationale: Tuwirang ipinahahayag ang pagbibigay ng pasasalamat at hindi nagdaragdag ng sakramental na terminolohiyang wala sa pandiwa.
- source_word: ἔδωκεν αὐτοῖς
  choice: Ibinigay niya iyon sa kanila
  rationale: Likas na salin ng pandiwa at datibo; ang “iyon” ay tumutukoy sa kopang hayag sa konteksto.
- source_word: λέγων
  choice: at sinabi
  rationale: Ang participle na nagpapakilala sa tuwirang pananalita ay likas na isinasalin bilang finite verb sa modernong Filipino.
- source_word: Πίετε
  choice: Uminom kayo
  rationale: Maramihang pautos ang anyo; tahasang ipinakikita ng “kayo” na grupo ang kinakausap.
- source_word: ἐξ αὐτοῦ
  choice: mula rito
  rationale: Ipinahahayag ang pinagmumulan ng pag-inom. Ang “rito” ay natural na tumutukoy sa kopang hawak at ibinigay ni Jesus.
- source_word: πάντες
  choice: lahat
  rationale: Kasama ng “kayo,” malinaw na tumutukoy ito sa lahat ng kausap, hindi sa dami ng iinumin.
theological_decisions:
- issue: Posibleng sakramental na pahiwatig ng εὐχαριστήσας
  choice: nagpasalamat
  alternative: binasbasan niya iyon
  rationale: Ang εὐχαριστέω ay nangangahulugang magpasalamat. Pinananatili ng salin ang leksikal na diwa nang hindi ipinapasok ang isang partikular na doktrinal na pagpapakahulugan.
- issue: Saklaw ng πάντες sa utos
  choice: Uminom kayong lahat
  alternative: Inumin ninyo itong lahat
  rationale: Ang πάντες ay tumutukoy sa lahat ng taong kinakausap, hindi sa pag-ubos sa buong laman ng kopa.
- issue: Pagiging tiyak ng ποτήριον
  choice: isang kopa
  alternative: ang kopa
  rationale: Walang artikulo ang ποτήριον, bagaman maaaring ituring na tiyak ang tinutukoy dahil sa konteksto. Pinanatili sa pangunahing teksto ang di-tiyak na anyo nang hindi ginagawang doktrinal ang pagkakaiba.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Hinati sa dalawang pangungusap ang magkakasunod na participle at pangunahing pandiwa upang maging natural sa Tagalog, habang pinananatili ang ayos ng mga pangyayari. Walang footnote dahil hindi kailangan para maunawaan nang wasto ang talata.
