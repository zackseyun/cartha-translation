id: MAT.26.69
reference: Matthew 26:69
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: tl
  text: Samantala, nakaupo si Pedro sa labas, sa looban. Lumapit sa kaniya ang isang batang babaeng lingkod[a] at sinabi, “Kasama ka rin ni Jesus na taga-Galilea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang aliping babae.” Ang salitang Griyego na παιδίσκη ay maaaring tumukoy sa isang batang babaeng lingkod, kung minsan ay isang alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Samantala
  rationale: Banayad na panandang diskurso na nagbabalik ng salaysay kay Pedro at kasabay na inilalarawan ang nangyayari; hindi ito ginawang tahasang temporal na “ngayon.”
- source_word: ἐκάθητο ἔξω
  choice: nakaupo ... sa labas
  rationale: Ipinahihiwatig ng imperpektibo ang nagpapatuloy na kalagayan ni Pedro, at pinananatili ng “sa labas” ang kaibahan sa paglilitis na nagaganap sa loob.
- source_word: ἐν τῇ αὐλῇ
  choice: sa looban
  rationale: Ang αὐλή ay bukás na looban ng tirahan; natural at tiyak sa modernong Tagalog ang “looban.”
- source_word: προσῆλθεν αὐτῷ
  choice: Lumapit sa kaniya
  rationale: Tuwirang ipinapahayag ang pisikal na paglapit nang natural sa Tagalog.
- source_word: μία παιδίσκη
  choice: isang batang babaeng lingkod
  rationale: Ipinakikilala ng μία ang isang partikular na babae, at ang παιδίσκη ay maaaring tumukoy sa batang babaeng lingkod, kung minsan ay alipin; hindi ipinagpapalagay sa pangunahing teksto ang tiyak na katayuang alipin.
- source_word: λέγουσα
  choice: at sinabi
  rationale: Mas natural sa Tagalog na gawing sugnay na may pandiwa ang kasalukuyang participle, habang pinananatili ang daloy ng pagkilos.
- source_word: Καὶ σὺ
  choice: Kasama ka rin
  rationale: Ang “rin” ay nagpapanatili sa diing si Pedro ay kabilang din sa mga nakasama ni Jesus.
- source_word: ἦσθα μετὰ
  choice: Kasama ka ... ni
  rationale: Payak at likas na katumbas ng relasyonal na “you were with,” nang walang dagdag na pagpapakahulugang alagad siya.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jesus na taga-Galilea
  rationale: Natural na pagkakakilanlan sa Tagalog na tapat sa bansag na Γαλιλαῖος.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “looban” para sa courtyard at “taga-Galilea” bilang natural na bansag. Inilagay ang talababa sa “lingkod” upang ipakita ang posibleng katayuang alipin nang hindi iyon sapilitang itinatakda sa pangunahing teksto.
