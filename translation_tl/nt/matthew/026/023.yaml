    issue: Hindi ganap na malinaw ang “kasabay kong” para sa μετ’ ἐμοῦ.
    rationale: Maaaring tumukoy ang “kasabay” sa sabayang oras lamang. Ang μετ’ ἐμοῦ ay nagsasaad na ang taong iyon ay nakisawsaw na kasama ni Jesus.
  - severity: medium
    issue: Hindi tumpak na literal na alternatibo ang talababa b.
    rationale: Ang “magbibigay sa akin sa kamay ng iba” ay nagdaragdag ng pariralang “sa kamay ng iba,” na wala sa παραδώσει. Ang “ibibigay ako” ay mas malapit at natural na alternatibo.
