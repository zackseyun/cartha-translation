  source_fidelity: Ang “kasabay kong” ay maaaring mangahulugang kasabay lamang sa oras at hindi sapat na malinaw na isinasalin ang μετ’ ἐμοῦ (“kasama ko”). Ang salin ng ἐμβάψας, τὴν χεῖρα, ἐν τῷ τρυβλίῳ, at παραδώσει ay kung hindi man eksakto ay mahusay na naipapahayag sa iminungkahing rebisyon.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino Tagalog. Ang “kasama ko” ay mas tuwiran at idiomatiko para sa pakikibahaging ipinahihiwatig ng Griyego kaysa “kasabay kong.”
  terminology: Ang “mangkok” ay malinaw para sa τρυβλίον, na may “pinggan” bilang angkop na alternatibo. Ang “magkakanulo sa akin” ay angkop sa kontekstong ito. Ang talababa para sa παραδώσει ay dapat maging mas malapit sa literal na “hand over” nang hindi nagdaragdag ng “sa kamay ng iba,” na wala sa Griyego.
  issues:
