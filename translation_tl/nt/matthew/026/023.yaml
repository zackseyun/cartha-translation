  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: tl
  text: Sumagot siya, “Ang nagsawsaw ng kamay kasama ko sa mangkok[a]—siya ang magkakanulo sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinggan.”
    reason: lexical_alternative
  - marker: b
    text: O “ibibigay ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Ang participle at finite verb ay karaniwang pariralang Griyego na natural na naipapahayag sa modernong Tagalog bilang “Sumagot siya,” nang hindi inuulit nang mekanikal ang “sumagot at sinabi.”
- source_word: ἐμβάψας
  choice: nagsawsaw
  rationale: Ipinapahayag ng aorist participle ang natapos na kilos na nagsisilbing pagkakakilanlan; natural sa konteksto ng pagkain ang “nagsawsaw.”
- source_word: μετ’ ἐμοῦ
  choice: kasabay ko
  rationale: Pinananatili nito ang diwa ng pakikisama o sabayang pagkilos na ipinahihiwatig ng μετά na may genitive.
- source_word: τὴν χεῖρα
  choice: ng kamay
  rationale: Sa Tagalog, sapat at natural ang “nagsawsaw ng kamay”; hindi kailangang gawing tahasang “ang kaniyang kamay” dahil malinaw na kamay ng gumagawa ang tinutukoy.
- source_word: ἐν τῷ τρυβλίῳ
  choice: sa mangkok
  rationale: Ang τρύβλιον ay sisidlan ng pagkain na maaaring mangkok o pinggan; malinaw at karaniwan ang “mangkok,” habang inilalagay sa talababa ang alternatibo.
- source_word: οὗτός
  choice: siya ang
  rationale: Ang ayos na “siya ang” ay natural sa Tagalog at pinananatili ang mariing pagtukoy ng demonstrative, sa halip na isang payak na panghalip lamang.
- source_word: παραδώσει
  choice: magkakanulo sa akin
  rationale: Sa konteksto ng salaysay tungkol kay Judas, ipinahihiwatig ng παραδίδωμι ang mapanlinlang na pagbibigay kay Jesus sa mga kaaway; malinaw itong naipapahayag ng “magkakanulo,” habang pinananatili sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Pagpapakahulugan sa παραδίδωμι sa konteksto ni Judas
  choice: magkakanulo sa akin
  alternative: magbibigay sa akin sa kamay ng iba
  rationale: Maaaring mangahulugan ang pandiwa na “ibigay” o “ipasa sa kapangyarihan ng iba,” ngunit sa ugnayan at konteksto ng Pasyon, pangunahing ipinahihiwatig ang pagtataksil. Hindi nito dinaragdagan ang doktrina, at inilalahad sa talababa ang mas literal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kasabay kong nagsawsaw” upang malinaw na ang tinutukoy ay ang taong nakibahagi kay Jesus sa iisang sisidlan, at ang em dash upang idiin ang “siya ang.”
