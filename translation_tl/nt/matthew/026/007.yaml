- from: Lumapit sa kanya ang isang babae na may dalang sisidlang alabastro na puno ng napakamahal na mabangong langis[a]. Habang nakahilig siya sa hapag[b], ibinuhos iyon ng babae sa kanyang ulo.
  to: Lumapit sa kanya ang isang babae na may dalang sisidlang alabastro na may napakamahal na mabangong langis[a]. Habang nakahilig si Jesus sa hapag[b], ibinuhos ng babae iyon sa kanyang ulo.
