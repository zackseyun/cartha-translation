  source_fidelity: Kailangang ayusin ang dalawang maliit ngunit mahalagang punto. Ang “puno ng” ay nagdaragdag ng ideyang hindi tahasang nasa Griyego; ang ἀλάβαστρον μύρου ay sisidlang may/para sa mabangong langis o pamahid. Bukod dito, ang walang-tiyak na “siya” sa “Habang nakahilig siya” ay maaaring iugnay sa babae sa Tagalog, samantalang si Jesus ang tinutukoy ng ἀνακειμένου.
  naturalness: Natural at angkop ang pangkalahatang rehistro. Mas malinaw at likas ang tahasang pagbanggit kay Jesus sa sugnay tungkol sa pagkakahilig sa hapag.
  terminology: Ang “sisidlang alabastro,” “napakamahal,” at “mabangong langis” ay angkop. Pinananatili ng talababa ang leksikal na saklaw ng μύρον, kabilang ang “pamahid.”
