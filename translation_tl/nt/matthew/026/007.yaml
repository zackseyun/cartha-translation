base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: tl
  text: Lumapit sa kanya ang isang babae na may dalang sisidlang alabastro na may napakamahal na mabangong langis[a]. Habang nakahilig si Jesus sa hapag[b], ibinuhos ng babae iyon sa kanyang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sisidlang alabastro na may napakamahal na mabangong pamahid.” Ang salitang Griyego na μύρον ay maaaring tumukoy sa mabangong langis o pamahid.
    reason: lexical_alternative
  - marker: b
    text: Nakaugalian noon na humilig sa isang higaan o upuang pahaba habang kumakain sa hapag.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν
  choice: Lumapit
  rationale: Tuwirang ipinahahayag ang paglapit ng babae kay Jesus at natural sa makabagong Tagalog.
- source_word: γυνή
  choice: isang babae
  rationale: Walang ibinigay na pagkakakilanlan o panuring sa babae sa talata.
- source_word: ἔχουσα
  choice: na may dalang
  rationale: Natural na inilalarawan ang pagdadala ng babae sa sisidlan habang lumalapit siya.
- source_word: ἀλάβαστρον μύρου
  choice: sisidlang alabastro na puno ng ... mabangong langis
  rationale: Ang ἀλάβαστρον ay sisidlang karaniwang yari sa alabastro, at ang μύρον ay mabangong langis o pamahid; iniiwasan ng salin ang makitid na modernong diwa ng 'pabango.'
- source_word: βαρυτίμου
  choice: napakamahal
  rationale: Pinananatili ang matinding diin ng salita sa napakataas na halaga.
- source_word: κατέχεεν
  choice: ibinuhos
  rationale: Malinaw at natural na katumbas ng pagbuhos ng laman ng sisidlan sa ulo.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sa kanyang ulo
  rationale: Payak at tumpak na nagpapahayag ng pinagbuhusan.
- source_word: ἀνακειμένου
  choice: Habang nakahilig siya sa hapag
  rationale: Ipinahahayag ang nakaugaliang posisyon sa pagkain noong panahong iyon at nililinaw na nasa hapag siya, nang hindi sinasabing nakaupo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mabangong langis” upang maipakita ang saklaw ng μύρον, at ang “nakahilig sa hapag” upang maipaliwanag nang maikli ang sinaunang postura sa pagkain.
