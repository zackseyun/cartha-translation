reference: Matthew 26:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: tl
  text: Ang Anak ng Tao ay umaalis ayon sa nakasulat tungkol sa kanya, ngunit aba sa taong iyon na sa pamamagitan niya ay ipinagkanulo[a] ang Anak ng Tao. Mas mabuti sana para sa taong iyon kung hindi siya ipinanganak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibinigay.” Ang pandiwang Griyego ay maaaring mangahulugang “ipagkanulo” o, sa mas literal na diwa, “ibigay.” “Ipinagkanulo” ang ginamit dito dahil ang pagtataksil ni Judas ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Ang Anak ng Tao ay
  rationale: Pinananatili ang kinikilalang titulong “Anak ng Tao.” Ang paghahambing na μὲν...δὲ ay likas na naipahihiwatig ng kasunod na “ngunit,” kaya hindi na dinagdagan ng mabigat na katumbas ang μὲν.
- source_word: ὑπάγει
  choice: yumaon
  rationale: Ang “yumaon” ay marangal at sapat na bukás upang tukuyin ang paglakad ni Jesus tungo sa nalalapit na kamatayan nang hindi iyon tahasang ipinapasok sa salin.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: ayon sa nasusulat tungkol sa kanya
  rationale: Natural na idyomang Filipino ito para sa nakasulat na patotoo ng Kasulatan at pinananatili ang nananatiling bisa ng perfect passive na γέγραπται.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ngunit kasawian ang taong iyon
  rationale: Ipinahahayag ng “kasawian” ang matinding babala at hatol ng οὐαί; pinananatili ng “ngunit” ang malinaw na pagsalungat ng δέ.
- source_word: δι’ οὗ
  choice: na sa pamamagitan niya
  rationale: Pinananatili ang diwa ng ahensiya o pamamagitan sa διά na may genitive, sa halip na gawing payak lamang na “na siyang.”
- source_word: παραδίδοται
  choice: ipinagkanulo
  rationale: Sa konteksto ng ginawa ni Judas, malinaw at natural ang “ipinagkanulo.” Gayunman, ang mas literal at mas malawak na “ibinigay sa kamay” ay inilagay sa talababa upang mapanatili ang leksikal na saklaw.
- source_word: καλὸν ἦν αὐτῷ
  choice: Mas mabuti pa para sa taong iyon
  rationale: Ito ang natural na katumbas sa Filipino ng idyomatikong counterfactual na nagsasaad kung ano sana ang higit na mainam para sa kanya.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: kung hindi na siya ipinanganak
  rationale: Natural na ipinahahayag sa Filipino ang di-makatotohanang kundisyon; ang “siya” ay malinaw na tumutukoy sa inuulit na “taong iyon” nang hindi nagiging mabigat ang pangungusap.
theological_decisions:
- issue: Ugnayan ng katuparan ng Kasulatan at pananagutan ng tao
  choice: Kapuwa pinananatili na ang pagyaon ng Anak ng Tao ay ayon sa nasusulat at na ang nagkanulo sa kanya ay nasa ilalim ng matinding kasawian.
  alternative: Bigyang-diin ang itinakdang pangyayari sa paraang nagpapahina sa pananagutan ni Judas, o bigyang-diin ang pagkilos ni Judas sa paraang nagpapahina sa katuparan ng Kasulatan.
  rationale: Magkatabing ipinahahayag ng Griyego ang dalawang katotohanan; hindi dapat lutasin ng salin ang tensiyong hindi nilulutas ng teksto.
- issue: Lakas ng pahayag tungkol sa hindi pagkakapanganak
  choice: Isinalin bilang matinding pahayag ng paghatol nang walang idinagdag na tiyak na sistematikong doktrina.
  alternative: Ituring lamang itong pagmamalabis, o gamitin itong tahasang patunay ng isang detalyadong doktrina tungkol sa hantungan ni Judas.
  rationale: Sinasabi ng teksto na mas mabuti sana para sa taong iyon kung hindi siya ipinanganak, ngunit hindi nito dito ipinaliliwanag ang lahat ng implikasyong doktrinal.
translation_notes:
  register: Makabago, dignipikado, at madaling maunawaang Filipino. Ginamit ang “yumaon” bilang marangal ngunit hindi labis na arkaikong pandiwa, at iniwasan ang denominasyonal o sistematikong pagpapaliwanag na lampas sa talata.
