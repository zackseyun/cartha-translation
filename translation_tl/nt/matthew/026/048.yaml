  to: Ang nagkakanulo sa kanya ay nagbigay na sa kanila ng isang palatandaan[a], na sinasabi, “Kung sino ang hahalikan ko, siya iyon. Dakpin ninyo siya.”
  rationale: Pinalitan ang di-likas at labis na “ang siyang taong iyon” ng “siya iyon,” na hindi nagdaragdag ng katawagang wala sa pinagmulan at natural sa modernong Filipino. Isinaayos ang pagkakaugnay ng pananalita upang maipakita ang participial na λέγων nang hindi binabago ang kahulugan.
