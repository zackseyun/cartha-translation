source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: tl
  text: Ang nagkakanulo sa kanya ay nagbigay na sa kanila ng isang palatandaan[a], na sinasabi, “Kung sino ang hahalikan ko, siya iyon. Dakpin ninyo siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hudyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: nagkakanulo
  rationale: Sa salaysay ng pagpapakasakit, ang pandiwa ay tumutukoy sa pagkakanulo ni Judas, hindi lamang sa neutral na pagsasalin o pagbibigay ng isang tao sa iba.
- source_word: σημεῖον
  choice: palatandaan
  rationale: Ang palatandaan ay isang napagkasunduang kilos na magtuturo kung sino ang dadakpin; likas ito sa Filipino at saklaw ang diwang 'sign' o 'signal.'
- source_word: Ὃν ἂν φιλήσω
  choice: Ang hahalikan ko
  rationale: Pinananatili ng anyong ito ang di-tiyak na sugnay na ginagamit upang tukuyin ang taong hinahanap, at natural ito sa modernong Tagalog.
- source_word: φιλήσω
  choice: hahalikan
  rationale: Tuwirang inilalarawan ng pandiwa ang halik bilang kilos na pagkakakilanlan, nang hindi idinaragdag na iyon ay isang pagbati.
- source_word: αὐτός ἐστιν
  choice: ang siyang taong iyon
  rationale: Malinaw nitong ipinakikilala ang tinutukoy na tao at pinananatili ang diin ng αὐτός, bagaman mas mariin ito kaysa sa karaniwang 'siya iyon.'
- source_word: κρατήσατε
  choice: Dakpin ninyo
  rationale: Ipinahihiwatig nito ang mahigpit na paghawak sa konteksto ng pagdakip, nang hindi nililimitahan ang pandiwa sa isang pormal na prosesong legal.
theological_decisions:
- issue: Moral na puwersa ng παραδιδοὺς bilang pagtukoy kay Judas
  choice: Isinalin bilang “ang nagkakanulo sa kanya”
  alternative: ang nagsasalin sa kanya sa kanilang mga kamay
  rationale: Maliwanag sa agarang konteksto na ang kilos ni Judas ay pagkakanulo. Ipinahahayag ito ng salin nang hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagkakanulo” upang ihayag ang moral na bigat ng konteksto, “palatandaan” para sa σημεῖον, at “dakpin” upang mapanatili ang pisikal at mapilit na diwa ng κρατέω.
