  source_fidelity: 'Tumpak ang pangunahing diwa: ang nagkakanulo ay nagbigay ng palatandaan, ang halik ang pagkakakilanlan, at iniutos ang pagdakip. Gayunman, ang “ang siyang taong iyon” ay nagdaragdag ng “taong” na wala sa Griyego at hindi likas na paraan ng pagtukoy sa Tagalog. Ang “siya iyon” ay sapat at mas malapit sa αὐτός ἐστιν.'
  naturalness: Maayos at marangal ang karamihan ng salin. Mas natural sa makabagong Filipino ang “Kung sino ang hahalikan ko, siya iyon” kaysa “Ang hahalikan ko ang siyang taong iyon.” Pinagsama rin ang pahayag sa isang pangungusap upang masundan ang λέγων (“na sinasabi”).
  terminology: Ang “nagkakanulo,” “palatandaan,” at “dakpin” ay angkop sa konteksto. Ang “hudyat” ay wastong alternatibo para sa σημεῖον sa talababa.
