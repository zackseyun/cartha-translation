  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: tl
  text: Ngunit pagkatapos akong muling buhayin[a], mauuna ako sa inyo patungong Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “pagkatapos akong muling mabuhay.” Sa Griyego, anyong pasibo ang mas literal na ginamit: “pagkatapos akong muling buhayin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Ngunit matapos
  rationale: Ipinahahayag ng μετά kasama ng articular infinitive ang panahong kasunod, at pinananatili ng “ngunit” ang banayad na pagsalungat ng δέ sa naunang pahayag.
- source_word: τὸ ἐγερθῆναί με
  choice: matapos akong muling buhayin
  rationale: Pinananatili nito ang pasibong anyo ng aorist infinitive at likas na ipinahahayag sa Filipino ang muling pagkabuhay, nang hindi tahasang tinutukoy kung sino ang kumilos.
- source_word: προάξω ὑμᾶς
  choice: mauuna ako sa inyo
  rationale: Natural na Filipino ito para sa pagpunta bago o nangunguna sa iba, nang hindi ipinapalagay na pormal na pamumuno ang diwa.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: patungong Galilea
  rationale: Malinaw na ipinahahayag ng “patungo” ang direksiyon o hantungan na taglay ng εἰς at mas natural kaysa sa literal na “papasok sa Galilea.”
theological_decisions:
- issue: Pasibong pananalita tungkol sa muling pagkabuhay sa ἐγερθῆναί
  choice: matapos akong muling buhayin
  alternative: matapos akong muling mabuhay
  rationale: Pinananatili sa pangunahing teksto ang pasibong puwersa ng Griyego at ang maaaring ipinahihiwatig na pagkilos ng Diyos, ngunit hindi nagdaragdag ng tahasang tagaganap. Inilalagay sa talababa ang natural na alternatibong Filipino na hindi pasibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mauuna ako sa inyo patungong Galilea” upang maging natural ang direksiyonal na diwa habang pinananatili ang bahagyang pormalidad ng pahayag.
