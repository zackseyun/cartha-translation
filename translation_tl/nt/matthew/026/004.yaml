  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: tl
  text: At nagplano sila upang dakpin si Jesus sa pamamagitan ng pandaraya at patayin siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: nagkasundo
  rationale: Ipinahahayag ang sama-samang pag-uusap at pagbuo ng pasiya o balak, nang hindi dinaragdagan ang teksto ng hayagang terminong gaya ng “sabuwatan.”
- source_word: δόλῳ
  choice: sa pamamagitan ng pandaraya
  rationale: Tuwirang inililipat ang diwa ng δόλος bilang panlilinlang o mapanlinlang na paraan; mas tiyak ito kaysa “palihim” lamang.
- source_word: κρατήσωσιν
  choice: dakpin
  rationale: Sa konteksto, nangangahulugan itong hulihin o dakpin si Jesus, hindi lamang hawakan.
- source_word: ἀποκτείνωσιν
  choice: patayin
  rationale: Karaniwan at tuwirang katumbas ng pagkitil ng buhay.
theological_decisions:
- issue: Lakas ng ἵνα bilang layunin ng kanilang pagkakasundo
  choice: Isinama ang layunin sa infinitibong pariralang “dakpin ... at patayin.”
  alternative: “upang dakpin ... at patayin”
  rationale: Sa natural na Tagalog, ang “nagkasundo silang…” ay malinaw nang nagpapakilala sa nilayon nilang gawin; hindi nito binabago ang nilalamang layunin ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang dalawang magkaugnay na layunin—ang pagdakip sa pamamagitan ng pandaraya at ang pagpatay—nang walang idinagdag na paliwanag.
