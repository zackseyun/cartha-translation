    rationale: Bagaman posible ang infinitibong konstruksiyon sa Tagalog, mas tapat at malinaw ang «upang» para sa layuning «upang dakpin ... at patayin».
  - severity: medium
    issue: Ang «nagkasundo» ay kulang sa diwa ng συνεβουλεύσαντο.
    rationale: Ang pandiwang Griyego ay tumutukoy sa sama-samang pagsangguni o pagpaplano; ang «nagplano sila» ay mas malapit dito at nananatiling natural.
  revised_text: At nagplano sila upang dakpin si Jesus sa pamamagitan ng pandaraya at patayin siya.
