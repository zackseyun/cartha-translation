  verdict: revise
  source_fidelity: Kailangang maipakita nang mas malinaw ang ἵνα na layunin ng kanilang sama-samang pagpaplano. Ang «nagkasundo» ay maaaring tumukoy lamang sa pag-abot sa pagkakasundo at hindi ganap na naihahatid ang συνεβουλεύσαντο, ang sama-samang pagpaplano o pagsangguni.
  naturalness: Natural sa modernong Filipino ang «Nagplano sila upang ...». Ang pag-uulit ng «siya» pagkatapos ng «patayin» ay nagpapalinaw sa magkakaugnay na pandiwa nang hindi nagiging mabigat.
  terminology: Ang «dakpin» ay angkop para sa κρατήσωσιν sa kontekstong ito, at ang «sa pamamagitan ng pandaraya» ay wastong nagsasaad na ang δόλῳ ay paraan ng pagdakip. Ang «patayin» ay tuwirang katumbas ng ἀποκτείνωσιν.
