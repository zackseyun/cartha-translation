  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: tl
  text: Noong unang araw ng Tinapay na Walang Pampaalsa[a][b], lumapit kay Jesus ang mga alagad at sinabi, “Saan mo gustong maghanda kami para sa iyo upang kainin mo ang Paskuwa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas tahasang pananalita, “unang araw ng Kapistahan ng Tinapay na Walang Pampaalsa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “unang araw ng Tinapay na Walang Pampaalsa” ay tuwirang sumusunod sa pananalita ng Griyego; hindi dapat lutasin ng salin lamang ang mga usapin tungkol sa kronolohiya ng Paskuwa.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Nang unang araw ng Tinapay na Walang Pampaalsa
  rationale: Ang dative temporal na Τῇ πρώτῃ ay likas na isinasalin na “nang unang araw.” Ang τῶν ἀζύμων ay tumutukoy sa kilalang panahon ng kapistahan at pinanatili bilang pangalang pangkapistahan nang hindi dinaragdagan ang teksto ng salitang “Kapistahan.” Hindi kailangang katawanin nang hiwalay ang banayad na pang-ugnay na δέ sa natural na Tagalog.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: lumapit kay Jesus ang mga alagad
  rationale: Ang προσῆλθον ay “lumapit” o “pumaroon,” at ang τῷ Ἰησοῦ ang taong nilapitan. Pinananatili ng “ang mga alagad” ang οἱ μαθηταί nang hindi idinaragdag ang “kaniyang.”
- source_word: λέγοντες
  choice: at sinabi
  rationale: Bagaman participle ang λέγοντες, ang koordinadong “at sinabi” ay mas natural sa kasalukuyang Tagalog at pinananatili ang kasabay na pagkilos nang hindi ito mas tiyak na ginagawang “nagtanong.”
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Saan mo gustong ipaghanda ka namin
  rationale: Ang θέλεις ay likas na “gusto,” at ang deliberative subjunctive na ἑτοιμάσωμεν ay maayos na naihahayag ng “ipaghanda ka namin.” Isinasama ng hulaping ipag- at ng “ka” ang diwang paghahanda para kay Jesus mula sa σοι.
- source_word: φαγεῖν τὸ πάσχα
  choice: upang makakain ng Paskuwa
  rationale: Ang φαγεῖν ay infinitive na kaugnay ng layunin ng paghahanda. Ang πάσχα ay maaaring tumukoy sa kapistahan o sa pagkaing Paskuwa; dahil kinakain ito rito, malinaw sa konteksto ang pagkain ngunit hindi ito tahasang idinagdag sa pangunahing teksto.
theological_decisions:
- issue: Ang kronolohikal na pariralang “unang araw ng Tinapay na Walang Pampaalsa” kaugnay ng pagkain ng Paskuwa
  choice: Panatilihin ang mismong festal na pananalita nang hindi ito iniaayon sa isang kronolohikal na harmonisasyon.
  alternative: Isalin nang interpretatibo bilang “araw bago ang Kapistahan ng Tinapay na Walang Pampaalsa” o “unang araw ng Paskuwa.”
  rationale: Mismong sinasabi ng Griyego ang “unang araw ng [mga] walang pampaalsa.” Hindi dapat pasiyahan ng salin lamang ang pinagtatalunang ugnayan ng mga kronolohiya sa mga Ebanghelyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tinapay na Walang Pampaalsa” bilang pamilyar na katawagang biblikal at “Paskuwa” bilang natural na transliterasyon. Inilipat ang marker [b] sa dulo ng pangungusap upang hindi mapagkamalang tala sa pandiwang “sinabi,” sapagkat ang nilalaman nito ay tumutukoy sa kronolohikal na parirala.
