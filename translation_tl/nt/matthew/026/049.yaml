base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: tl
  text: At agad siyang lumapit kay Jesus at nagsabi, “Pagbati, Rabbi!”[a] at hinalikan niya si Jesus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magalak ka, Rabbi!”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring magpahiwatig ang pandiwa ng mariin o paulit-ulit na paghalik: “hinalikan niya nang mariin” o “hinalikan niya nang paulit-ulit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: agad
  rationale: Likas at malinaw na ipinapahayag ang dagliang pagkilos at pinananatili ang pagmamadali ng salaysay.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: lumapit kay Jesus
  rationale: Tuwirang inilalarawan ang paglapit ni Judas kay Jesus sa natural na ayos ng pangungusap sa Filipino.
- source_word: εἶπεν
  choice: nagsabi
  rationale: Karaniwang pandiwa sa pagsasalaysay na maayos na nagpapakilala sa tuwirang pananalita.
- source_word: Χαῖρε
  choice: Mabuhay ka
  rationale: Pinananatili ang anyo ng isang magalang na pagbati at ang bahagyang pormal na himig nang hindi gumagamit ng lipas o sobrang kaswal na pananalita.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang Semitikong titulong ginamit sa Griyego; kilala rin ito sa Filipino at hindi pinapantay agad sa interpretatibong saling “Guro.”
- source_word: κατεφίλησεν
  choice: hinalikan
  rationale: Natural ang payak na pandiwa sa pangunahing teksto. Maaaring magpahiwatig ang tambalang pandiwang Griyego ng mariin o paulit-ulit na paghalik, kaya inilagay ang posibilidad na iyon sa talababa.
- source_word: αὐτόν
  choice: si Jesus
  rationale: Inulit ang pangalang tinutukoy ng panghalip upang maging malinaw at natural sa Filipino kung sino ang hinalikan.
theological_decisions:
- issue: Pagpapakahulugan sa pagbating Χαῖρε
  choice: Mabuhay ka
  alternative: Pagbati sa iyo
  rationale: Karaniwang pagbati ang salita sa kontekstong ito, hindi isang teolohikal na pagpupugay. Pinananatili ng salin ang magalang na anyo at hinahayaang manggaling sa salaysay ang kabalintunaan ng pagtataksil ni Judas.
- issue: Lakas o paraan ng paghalik sa κατεφίλησεν
  choice: hinalikan
  alternative: hinalikan nang mariin o paulit-ulit
  rationale: Posibleng pinalalakas ng κατα- ang kilos, ngunit hindi tiyak kung diin, init, o pag-uulit ang partikular na ipinahihiwatig. Iniwasang lutasin ang tunay na kalabuan sa pangunahing teksto at pinanatili ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “agad” para sa mabilis na takbo ng salaysay, pinanatili ang titulong “Rabbi,” at iniwasan ang sobrang kaswal na “Kumusta” at ang lipas na himig ng ibang pormal na pagbati.
