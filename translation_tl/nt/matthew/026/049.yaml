    issue: Hindi angkop ang “Mabuhay ka” bilang pangunahing salin ng Χαῖρε.
    rationale: Bagaman may kaugnayan sa tradisyonal na “Hail,” ang “Mabuhay ka” sa modernong Filipino ay mas madaling basahin bilang “long live” o isang sigaw ng pagpupugay kaysa bilang karaniwang pagbati. Maaari nitong baguhin ang pragmatikong puwersa ng sinabi ni Judas.
