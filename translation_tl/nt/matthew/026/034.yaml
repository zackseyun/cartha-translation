  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Katotohanang sinasabi ko sa iyo, sa mismong gabing ito[a], bago tumilaok ang tandang[b], tatlong beses mo akong ikakaila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ngayong gabi.” Sa Griyego, “sa gabing ito,” na may diin mula sa “ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bago tumilaok ang isang tandang.” Walang pantukoy ang Griyego bago ng “tandang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Likas itong ayos sa makabagong Tagalog at malinaw na pinananatili si Jesus bilang nagsasalita at ang lalaki bilang kausap.
- source_word: Ἀμὴν λέγω σοι
  choice: Katotohanang sinasabi ko sa iyo
  rationale: Pinananatili nito ang taimtim at may-awtoridad na panimulang pahayag ni Jesus nang hindi iniiwan sa anyong Hebreo ang Ἀμήν.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: sa gabi ring ito
  rationale: Inihahatid ng “ring” at “ito” ang diin ng demonstratibong ταύτῃ; mas malapit ito sa anyo ng Griyego kaysa sa mas payak na “ngayong gabi.”
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: bago tumilaok ang isang tandang
  rationale: Ang “tumilaok” ang likas na pandiwang Tagalog para sa tinig ng tandang. Ang “isang tandang” ay angkop sa pangngalang walang artikulo sa Griyego, bagaman maaari rin ang panlahatang “ang tandang.”
- source_word: τρὶς
  choice: tatlong beses
  rationale: Ito ang malinaw at karaniwang makabagong Tagalog para sa tatlong ulit.
- source_word: ἀπαρνήσῃ με
  choice: mo akong ikakaila
  rationale: Ang “ikakaila” ay tuwirang naghahayag ng pagtangging kilalanin o iugnay ang sarili kay Jesus, nang hindi dinaragdagan ang kahulugan ng mas interpretibong “itatakwil.”
theological_decisions:
- issue: Paglilipat ng taimtim na pormulang Ἀμὴν λέγω σοι
  choice: Katotohanang sinasabi ko sa iyo
  alternative: Tinitiyak ko sa iyo
  rationale: Mas malinaw na pinananatili ng pinili ang anyo at bigat ng sariling pagpapatotoo ni Jesus. Ang alternatibo ay mas kolokyal ngunit bahagyang nagpapaliwanag sa halip na direktang magsalin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang taimtim na himig ng pahayag ni Jesus at ang diin sa mismong gabing iyon, habang inilalahad sa talababa ang tunay na posibilidad sa artikulo ng “tandang.”
