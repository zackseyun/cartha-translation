  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: tl
  text: Nang matapos ni Jesus ang lahat ng salitang ito,[a] sinabi niya sa kanyang mga alagad,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At nangyari, nang matapos ni Jesus ang lahat ng salitang ito, sinabi niya sa kanyang mga alagad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Nang
  rationale: Ang pariralang ito ay isang Semitikong pormula ng pagsasalaysay. Sa modernong Tagalog, likas na naihahatid ng “Nang” ang paglipat at χρονological na ugnayan nang hindi ginagamit ang matigas na “At nangyari.”
- source_word: ὅτε
  choice: nang
  rationale: Ipinakikilala nito ang sugnay na panahunan. Pinananatili ng “nang” ang kahulugang “when” nang hindi ito ginagawang mas tiyak na “pagkatapos.”
- source_word: ἐτέλεσεν
  choice: matapos
  rationale: Ipinahihiwatig nito na nakumpleto muna ni Jesus ang kanyang pananalita bago siya nagsalita sa mga alagad. Ang “matapos” ang pinakanatural sa ganitong sugnay sa Tagalog.
- source_word: πάντας τοὺς λόγους τούτους
  choice: ang lahat ng pananalitang ito
  rationale: Ang λόγους ay literal na tumutukoy sa mga salita ngunit sa konteksto ay sa kabuuan ng katatapos na diskurso. Ang “pananalita” ay natural at pinananatili ang pormulang nagsasara sa isang mahabang pagtuturo.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Payak at tuwirang salin ng pandiwang λέγω sa isang pagsasalaysay, nang walang idinaragdag na diwang wala sa Griyego.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ at ginagamit ang nakaugaliang salin na “mga alagad” para sa μαθηταί.
