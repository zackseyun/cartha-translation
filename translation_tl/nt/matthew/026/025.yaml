  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: tl
  text: Sumagot at sinabi ni Judas, na magkakanulo sa kanya, “Hindi naman ako, Rabbi?” Sinabi ni Jesus sa kanya, “Ikaw na ang nagsabi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: na magkakanulo sa kanya
  rationale: Ipinahahayag ng substantival present participle kung sino si Judas sa salaysay; natural sa Tagalog ang hinaharap na anyo dahil hindi pa nagaganap ang aktuwal na pagsuko kay Jesus sa puntong ito.
- source_word: Μήτι ἐγώ εἰμι
  choice: Hindi naman ako
  rationale: Pinananatili ang tanong na umaasa sa negatibong sagot, sa natural at maikling anyong Tagalog.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang tiyak na katawagang Judio at ang kaibahan nito sa pagtawag ng ibang mga alagad kay Jesus bilang Panginoon sa kalapit na konteksto.
- source_word: Σὺ εἶπας
  choice: Ikaw na ang nagsabi
  rationale: Malapit sa idyomatikong Griyego at hindi tahasang nilulutas kung ito ay direkta o di-tuwirang pagpapatibay.
theological_decisions:
- issue: Lakas ng tugon ni Jesus na Σὺ εἶπας
  choice: Ikaw na ang nagsabi
  alternative: Oo, ikaw nga
  rationale: Hindi ginawang lantad na simpleng pagsang-ayon ang sadyang di-tuwirang pahayag; pinananatili ang tensiyon at ambiguwidad ng orihinal.
- issue: Pagkilala sa nagsasalita sa ikalawang pangungusap
  choice: Sinabi ni Jesus sa kanya
  alternative: Sinabi niya sa kanya
  rationale: Bagaman nasa pandiwa lamang ang paksa sa Griyego, malinaw sa konteksto na si Jesus ang sumagot; ang tahasang pangalan ay natural sa Tagalog at umiiwas sa kalituhan nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “magkakanulo” bilang karaniwang salitang nauunawaan sa konteksto, at pinanatili ang “Rabbi” bilang makabuluhang katawagan.
