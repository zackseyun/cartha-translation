  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: tl
  text: “Ano ang pasya ninyo?” Sumagot sila, “Karapat-dapat siya sa kamatayan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Siya ay mananagot sa kamatayan” o “Siya ay dapat patawan ng parusang kamatayan.” Ang pananalitang Griyego ay isang legal na hatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Ano ang pasya ninyo?
  rationale: Sa kontekstong panghukuman, ang tanong ay humihingi hindi lamang ng karaniwang opinyon kundi ng kanilang pasya. Likas sa makabagong Filipino ang pariralang ito at pinananatili nito ang tuwirang tanong.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Sumagot sila
  rationale: Ang participle na ἀποκριθέντες kasama ng εἶπαν ay natural na ipinahahayag sa Filipino sa iisang pandiwang “sumagot.” Mahina lamang ang pag-uugnay ng δέ, kaya hindi kailangang gawing mariing “ngunit.”
- source_word: ἔνοχος θανάτου
  choice: Nararapat siyang hatulan ng kamatayan
  rationale: Ang ἔνοχος na may genitibong θανάτου ay isang pormulang legal na nagsasaad na ang isang tao ay mananagot o nararapat sa parusang kamatayan. Ipinahahayag ng salin ang hatol ng kapulungan nang hindi ipinapalagay na iyon ang hatol ng Diyos.
- source_word: ἐστίν
  choice: siya
  rationale: Sa Filipino, hindi kailangan ang hiwalay na katumbas ng copula na ἐστίν sa ganitong pangungusap; ang “siya” ay malinaw na tumutukoy kay Jesus at bumubuo ng natural na pahayag.
theological_decisions:
- issue: Ang legal na bigat ng hatol ng kapulungan
  choice: Nararapat siyang hatulan ng kamatayan
  alternative: May sala siyang nararapat sa kamatayan; Mananagot siya ng kamatayan
  rationale: Inilalahad ng talata ang pasya ng mga sumasagot tungkol kay Jesus. Pinananatili ng salin ang katangiang legal ng pahayag ngunit hindi nito ginagawang obhetibong pahayag ng tagapagsalaysay na talagang may sala si Jesus sa harap ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pasya” at “hatulan ng kamatayan” upang mapanatili ang tagpong panghukuman nang hindi nagiging labis na teknikal.
