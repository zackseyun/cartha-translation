  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: tl
  text: na nagsasabi, “Magpropesiya ka sa amin, Mesiyas[a]! Sino ang humampas sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang Griyegong titulong Χριστός ay isinaling “Mesiyas” dito dahil ginagamit ito bilang titulo at hindi bilang anyong tulad ng pangalan.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Ang pangkasalukuyang pandiwaring ito ang nagpapakilala sa panunuya; pinananatili ng “na nagsasabi” ang kaugnayan nito sa naunang talata.
- source_word: Προφήτευσον
  choice: Manghula ka
  rationale: Ang pautos na pandiwa ay mapanuyang humihingi ng makahulang pagkilala sa nanakit. Sa kontekstong ito, natural sa Filipino ang “manghula” at naipadarama nito ang panunuya, bagaman hindi nito ibig sabihing basta manghula lamang si Jesus.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Ipinakikita ng panghalip na datibo kung kanino dapat sabihin ang hinihinging pahayag.
- source_word: χριστέ
  choice: Mesiyas
  rationale: Ito ay bokatibong titulo at hindi pangalang pantangi; inililipat ng “Mesiyas” ang kahulugang ‘Pinahiran’ at pinananatili ang puwersa ng kanilang panunuya.
- source_word: τίς ἐστιν
  choice: Sino ang
  rationale: Natural na tanong sa Filipino para tukuyin ang taong gumawa ng kilos.
- source_word: ὁ παίσας
  choice: humampas
  rationale: Ang aorist participle ay tumutukoy sa taong nanakit sa pamamagitan ng isang hampas; tuwiran at kongkreto ang “humampas.”
- source_word: σε
  choice: sa iyo
  rationale: Tuwirang tumutukoy kay Jesus bilang tumanggap ng hampas.
theological_decisions:
- issue: Paglilipat sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Bokatibo at malinaw na titulo ang χριστέ sa mapanuyang pananalita. Ang “Mesiyas” ang higit na nagpapahayag sa kahulugan at mesiyanikong puwersa ng panunuya, samantalang ibinibigay sa talababa ang nakaugaliang anyong “Cristo.”
translation_notes:
  register: Makabago at madaling maunawaang Filipino, ngunit pinananatili ang matalim at mapanuyang tono. Ang pambungad na “na nagsasabi” ay sadyang nakaugnay sa kilos na isinalaysay sa naunang talata.
