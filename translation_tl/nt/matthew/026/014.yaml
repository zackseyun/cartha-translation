  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: tl
  text: Pagkatapos, pumunta sa mga punong pari ang isa sa labindalawa[a], ang tinatawag na Judas Iscariote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isa sa Labindalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa susunod na pangyayari sa salaysay; natural ito sa modernong Filipino.
- source_word: πορευθεὶς
  choice: pumunta
  rationale: Ang aorist participle ay natural na isinasalin bilang pandiwang may hangganan sa Filipino, at malinaw na ipinahihiwatig ang paglapit sa mga punong pari.
- source_word: εἷς τῶν δώδεκα
  choice: ang isa sa labindalawa
  rationale: Pinananatili ang partitive na pahayag at ang maliit na titik upang hindi magdagdag ng interpretatibong kapitalisasyon; may talababa para sa kinikilalang katawagan sa pangkat.
- source_word: ὁ λεγόμενος
  choice: ang tinatawag na
  rationale: Pinananatili ang appositional na pagkakakilanlan at bahagyang diin ng Griyego, habang nananatiling natural sa Filipino.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judas Iscariote
  rationale: Ginagamit ang nakasanayang anyong Filipino ng pangalan at bansag.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: sa mga punong pari
  rationale: Ipinahahayag ng pariralang ito ang patutunguhan. Ang “mga punong pari” ang natural at tumpak na tawag sa mga nakatataas na awtoridad ng pagkasaserdote, hindi sa maraming nag-iisang mataas na pari.
theological_decisions:
- issue: Pagkakasalin sa katawagang pangkat na τῶν δώδεκα
  choice: isa sa labindalawa
  alternative: isa sa Labindalawa
  rationale: Ang maliit na titik ay hindi nagdaragdag ng interpretatibong kapitalisasyon, ngunit pinananatili ng talababa ang lehitimong pagbasa rito bilang kinikilalang katawagan sa pangkat.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Inuna ang pandiwang “pumunta” at inilagay pagkatapos nito ang patutunguhan upang maging malinaw at tuloy-tuloy ang salaysay, habang pinananatili ang appositional na paglalarawan kay Judas.
