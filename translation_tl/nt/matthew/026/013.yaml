  source_fidelity: 'Tapat ang salin sa pangunahing mga bahagi ng Griyego: ang taimtim na ἀμὴν λέγω ὑμῖν, ang di-tiyak na saklaw ng ὅπου ἐὰν, ang pagpapahayag ng εὐαγγέλιον sa buong mundo, at ang pag-uulat ng ginawa ng babae bilang alaala sa kanya. Ang “ikukuwento” ay isang likas na paraan upang ilahad ang λαληθήσεται kapag ang tinutukoy ay isang ginawa.'
