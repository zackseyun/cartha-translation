id: MAT.26.13
reference: Matthew 26:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: tl
  text: 'Tinitiyak ko sa inyo: Saanman ipahayag sa buong mundo ang mabuting balitang ito[a], ikukuwento rin ang ginawa ng babaeng ito bilang pag-alaala sa kanya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ebanghelyong ito.”
    reason: lexical_alternative
  - marker: b
    text: O, “babanggitin din ang ginawa ng babaeng ito sa pag-alaala sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tinitiyak ko sa inyo
  rationale: Ang ἀμήν sa pasimula ng sinabi ni Jesus ay isang taimtim na pagpapatibay. Likas at malinaw sa makabagong Tagalog ang “Tinitiyak ko sa inyo,” at isinama rito ang λέγω ὑμῖν upang maiwasan ang di-likas na “Tunay na sinasabi ko sa inyo.”
- source_word: ὅπου ἐὰν
  choice: Saanman
  rationale: Ipinapahayag ng kombinasyon ang di-tiyak at pangkalahatang lugar; tuwirang katumbas nito sa Tagalog ang “saanman.”
- source_word: κηρυχθῇ
  choice: ipahayag
  rationale: Pinananatili ng “ipahayag” ang diwa ng pampublikong paghahayag ng κηρύσσω nang hindi nililimitahan sa pormal na pangangaral.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ang mabuting balitang ito
  rationale: Ang “mabuting balita” ay malinaw na naghahatid ng pangunahing kahulugan ng εὐαγγέλιον sa karaniwang mambabasa; inilalagak sa talababa ang tradisyonal na “ebanghelyong ito.”
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: sa buong mundo
  rationale: Natural at tuwirang salin ng malawak at pangkalahatang saklaw ng parirala.
- source_word: λαληθήσεται καὶ ὃ ἐποίησεν αὕτη
  choice: ikukuwento rin ang ginawa ng babaeng ito
  rationale: Dahil ang bagay na sasabihin ay isang ginawa, natural sa Tagalog ang “ikukuwento.” Ginagawang hayag ng “babaeng ito” ang tinutukoy ng αὕτη ayon sa konteksto.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: bilang pag-alaala sa kanya
  rationale: Pinananatili nito ang layunin at commemorative na diwa ng μνημόσυνον, habang iniiwasang ipakahulugan nang higit sa sinasabi ng Griyego kung ang gawa ba mismo o ang pagsasalaysay nito ang nagsisilbing alaala.
theological_decisions:
- issue: Pagpapakahulugan sa εὐαγγέλιον
  choice: mabuting balita
  alternative: ebanghelyo
  rationale: Pangunahing leksikal ang pasya. Ang “mabuting balita” ay madaling maunawaan at tapat sa kahulugan ng salita, samantalang kinikilala sa talababa ang tradisyonal at teolohikal na terminong “ebanghelyo.”
- issue: Ugnayan ng pagsasalaysay at μνημόσυνον
  choice: ikukuwento rin ... bilang pag-alaala sa kanya
  alternative: babanggitin din ... sa pag-alaala sa kanya
  rationale: Pinananatili ang commemorative na layon ng εἰς μνημόσυνον αὐτῆς nang hindi nililinaw nang labis kung ang mismong gawa o ang pagkukuwento nito ang gumaganap bilang memorial.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “Tinitiyak ko sa inyo” bilang likas na pormula ng taimtim na pagpapatibay, at “ikukuwento” upang idiomatikong ilarawan ang pagsasalita tungkol sa isang ginawa. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
