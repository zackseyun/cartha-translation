  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: utos na ibalik ang sandata at pangkalahatang kasabihang ang mga dumudulog sa tabak ay mamamatay sa pamamagitan nito. Gayunman, ang “sa kinalalagyan nito” ay mas tumutukoy sa kasalukuyang lokasyon kaysa sa “sa lugar nito” (εἰς τὸν τόπον αὐτῆς), at hindi gaanong malinaw na ibinabalik ang tabak sa nararapat nitong lugar.'
  naturalness: Malinaw ang pangungusap, ngunit mas natural at tuwiran sa modernong Tagalog ang “sa lugar nito” kaysa “sa kinalalagyan nito.” Ang “Noon” ay mas malapit ding katumbas ng τότε sa daloy ng salaysay kaysa “Pagkatapos,” na maaaring magbigay ng mas matibay na diwang ‘afterward.’
  terminology: Ang “tabak,” “mamamatay sa tabak,” at “Jesus” ay angkop sa register at sa nakaugaliang terminolohiyang biblikal sa Filipino. Ang “gumagamit ng tabak” ay katanggap-tanggap na pagpapahayag ng pangkalahatang pagdulog sa marahas na puwersa, nang hindi ipinapataw ang isang doktrinal na pagpapaliit sa saklaw ng kasabihan.
  issues:
  - severity: low
    issue: “Pagkatapos” para sa τότε
    rationale: Katanggap-tanggap ito sa konteksto, ngunit ang “Noon” ang mas tuwirang panandang pangyayari at hindi nagdaragdag ng bahagyang diwang ‘matapos ang isang yugto.’
  - severity: medium
    issue: “sa kinalalagyan nito” para sa εἰς τὸν τόπον αὐτῆς
    rationale: Ang parirala ay maaaring unawaing ‘sa lugar kung saan ito naroroon,’ samantalang ang Griyego ay nagsasaad na ibalik ang tabak sa sarili/nararapat nitong lugar. Ang “sa lugar nito” ay mas tapat at mas natural, nang hindi tinutukoy na kaluban ang lugar.
  revised_text: Noon, sinabi ni Jesus sa kanya, “Ibalik mo ang iyong tabak sa lugar nito, sapagkat ang lahat ng gumagamit ng tabak[a] ay mamamatay sa tabak.”
