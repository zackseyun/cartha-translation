base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: tl
  text: Noon, sinabi ni Jesus sa kanya, “Ibalik mo ang iyong tabak sa lugar nito, sapagkat ang lahat ng gumagamit ng tabak[a] ay mamamatay sa tabak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humahawak sa tabak”; malamang na ang pananalita ay tumutukoy sa paggamit ng marahas na puwersa, hindi lamang sa paghawak ng sandata.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay na nagpapakita ng kasunod na pangyayari.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: sinabi sa kanya ni Jesus
  rationale: Isinalin ang makasaysayang pangkasalukuyan bilang pangnagdaan, gaya ng karaniwang daloy ng salaysay sa modernong Tagalog.
- source_word: Ἀπόστρεψον
  choice: Ibalik mo
  rationale: Ipinahihiwatig ng pautos na agarang ibalik ang inilabas na sandata.
- source_word: τὴν μάχαιράν σου
  choice: ang iyong tabak
  rationale: Bagaman maaaring tumukoy ang μάχαιρα sa punyal o maikling espada, ang “tabak” ang malinaw at nakaugaliang katumbas sa tagpong ito.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: sa kinalalagyan nito
  rationale: Pinananatili ang di-tahasang pagtukoy ng Griyego sa wastong lalagyan ng sandata nang hindi idinaragdag ang salitang “kaluban.”
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: sapagkat ang lahat ng gumagamit ng tabak
  rationale: Ang articular participle ay nagsasaad ng pangkalahatang tuntunin; ipinahahayag ng “gumagamit” ang pagdulog sa marahas na puwersa, hindi lamang ang pisikal na paghawak.
- source_word: ἐν μαχαίρῃ
  choice: sa tabak
  rationale: Likas na pariralang Tagalog para sa instrumental na datibo at pinananatili ang paralelismo ng kasabihan.
- source_word: ἀπολοῦνται
  choice: ay mamamatay
  rationale: Sa konteksto, tumutukoy ito sa pagkamatay sa pamamagitan ng tabak; malinaw at natural ang “mamamatay” sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng sinabi ni Jesus tungkol sa tabak
  choice: 'Isinalin bilang pangkalahatang simulain: “ang lahat ng gumagamit ng tabak ay mamamatay sa tabak.”'
  alternative: Unawain bilang ganap na pagbabawal sa lahat ng paggamit ng puwersa, o bilang hula lamang tungkol sa agarang sitwasyon ng alagad.
  rationale: Pangkalahatan ang anyo ng Griyego. Pinananatili ng salin ang lawak nito nang hindi nagpapasok ng isang tiyak na denominasyonal na paninindigan hinggil sa karahasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “iyong” sa halip na “mong” upang mapanatili ang bahagyang pormal at biblikal na himig nang hindi nagiging lipas.
