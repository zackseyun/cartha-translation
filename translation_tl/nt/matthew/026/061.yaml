id: MAT.26.61
reference: Matthew 26:61
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: tl
  text: Sinabi nila, “Sinabi ng taong ito, ‘Kaya kong gibain ang templo ng Diyos at itayo ito sa loob ng tatlong araw[a].’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Griego ay maaaring magpahiwatig na matatapos ang pagtatayo sa loob ng panahong iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Juan 2:19–21, ipinaliwanag na ang templong tinutukoy sa sinabi ni Jesus ay ang kanyang katawan.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Sinabi nila
  rationale: Ang aorist indicative ay naglalahad ng patotoo bilang isang payak na pangyayari sa nakaraan; natural ito sa salaysay sa Filipino.
- source_word: Οὗτος
  choice: ang taong ito
  rationale: Pinananatili nito ang panturo at bahagyang mapanuyang puwersa ng οὗτος sa konteksto ng pag-aakusa.
- source_word: ἔφη
  choice: sinabi
  rationale: Payak na pag-uulat ito ng diumano’y sinabi ni Jesus; hindi kailangang dagdagan ng puwersang gaya ng “ipinahayag” o “inangkin.”
- source_word: Δύναμαι
  choice: Kaya kong
  rationale: Natural na Filipino ito para sa kakayahang ipinahahayag ng δύναμαι, nang hindi binabago ang diwa.
- source_word: καταλῦσαι
  choice: gibain
  rationale: Sa konteksto ng isang gusali, malinaw at likas na ipinahahayag ng “gibain” ang pagsira o pagbuwag.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: ang templo ng Diyos
  rationale: Ang “templo” ang malinaw at karaniwang katawagan sa Filipino; pinananatili rin ng “ng Diyos” ang tuwirang ugnayang genitive.
- source_word: διὰ τριῶν ἡμερῶν
  choice: sa loob ng tatlong araw
  rationale: Natural nitong ipinahahayag sa Filipino ang pagkumpleto sa panahon o saklaw na tatlong araw, ayon sa gamit ng διά na may genitive.
- source_word: οἰκοδομῆσαι
  choice: itayo ito
  rationale: Ang “ito” ay likas na ipinapalit sa naunang “templo.” Hindi idinagdag ang “muli,” sapagkat bagaman ipinahihiwatig ng konteksto ang muling pagtatayo, ang pandiwang Griego mismo ay “itayo/buuin.”
theological_decisions:
- issue: Ang tinutukoy ng “templo ng Diyos” sa paratang
  choice: Isinalin ang paratang ayon sa lantad nitong pagtukoy sa templo, nang hindi ipinapasok sa pangunahing teksto ang paliwanag na tumutukoy ito sa katawan ni Jesus.
  alternative: Isalin o ipaliwanag sa pangunahing teksto ang “templo” bilang katawan ni Jesus at ang muling pagkabuhay.
  rationale: Iniuulat ni Mateo rito ang paratang ng mga saksi. Dapat panatilihin ng salin ang mismong anyo ng paratang at ilagay sa talababa ang kaugnay na paliwanag ng Juan 2:19–21, sa halip na pag-isahin agad ang dalawang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya kong” at “gibain” bilang natural na pananalita, habang pinanatili ang pormal at maparatang na himig sa “ang taong ito.”
