base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: tl
  text: Ang mga dumakip kay Jesus ay dinala siya palayo kay Caifas, ang punong pari, kung saan nagkatipon na[a] ang mga eskriba at mga nakatatanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “natipon na.” Maaaring unawain ang pandiwang Griyego bilang intransitibong “nagkatipon na” o bilang pasibo/resultatibong “natipon na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν
  choice: Ang mga dumakip kay Jesus
  rationale: Ginawang pangngalang parirala ang artikulo at participle. Ang “dumakip” ay natural sa Filipino at ipinahihiwatig ng konteksto ang naunang pagdakip nang hindi kailangang gawing tahasang legal ang termino.
- source_word: ἀπήγαγον
  choice: ay nagdala sa kanya
  rationale: Ipinapahayag ang pagdadala kay Jesus habang siya ay nasa kustodiya; natural ito sa Filipino at hindi nagdaragdag ng detalyeng wala sa Griyego.
- source_word: πρὸς Καϊάφαν τὸν ἀρχιερέα
  choice: kay Caifas na pinakapunong pari
  rationale: Ang “kay” ay nagpapahayag ng patungo sa isang tao, at ang “pinakapunong pari” ay malinaw na titulo para sa natatanging ἀρχιερεύς sa kontekstong ito.
- source_word: ὅπου
  choice: Doon
  rationale: Hinati sa dalawang pangungusap para sa likas at malinaw na daloy sa Filipino habang pinananatili ang pagtukoy sa lugar na kinaroroonan ni Caifas.
- source_word: οἱ γραμματεῖς
  choice: ang mga eskriba
  rationale: Pinananatili ang tumpak at nakaugaliang katawagan sa pangkat na ito sa kontekstong panrelihiyon at panghukuman.
- source_word: οἱ πρεσβύτεροι
  choice: ang mga matatandang pinuno
  rationale: Nililinaw na ang tinutukoy ay mga kinikilalang pinuno ng bayan, hindi lamang mga taong may edad.
- source_word: συνήχθησαν
  choice: nagkatipon na
  rationale: Natural na intransitibong anyo ito sa Filipino at ipinakikita ng “na” na naroon na silang nagkakatipon o natipon bago dinala si Jesus.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “eskriba” bilang tumpak na katawagang biblikal at ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy. Inilipat ang pananda ng talababa sa pandiwang may tunay na leksikal na alternatibo.
