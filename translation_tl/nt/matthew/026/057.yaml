- from: Ang mga dumakip kay Jesus ay nagdala sa kanya kay Caifas na pinakapunong pari. Doon ay nagkatipon na[a] ang mga eskriba at ang mga matatandang pinuno.
  to: Ang mga dumakip kay Jesus ay dinala siya palayo kay Caifas, ang punong pari, kung saan nagkatipon na[a] ang mga eskriba at mga nakatatanda.
