  verdict: revise
  source_fidelity: Ang "nagdala" ay hindi malinaw na naipapakita ang ἀπάγω na pagdadala o pag-akay palayo. Ang "pinakapunong pari" ay hindi angkop na katumbas ng titulo; ang "punong pari" ay mas tumpak. Ang "matatandang pinuno" ay nagpapasok ng pagpapaliwanag na wala sa mismong Griyego.
  naturalness: Mas natural at malinaw ang "dinala palayo" at ang sugnay na "kung saan," na tuwirang nag-uugnay sa lugar na tinutukoy ng ὅπου. Ang "mga nakatatanda" ay marangal at karaniwang katawagan para sa grupong ito sa kontekstong biblikal.
  terminology: Ginamit ang "Caifas" ayon sa karaniwang anyong Filipino, "punong pari" para sa ἀρχιερεύς, "mga eskriba" para sa γραμματεῖς, at "mga nakatatanda" para sa πρεσβύτεροι. Iniingatan ng talababa ang leksikal na ambigwidad ng συνήχθησαν.
  issues:
  - severity: medium
    issue: Hindi naipahahayag ng "nagdala" ang aspektong "palayo" ng ἀπήγαγον.
    rationale: Ang ἀπάγω ay nangangahulugang magdala o umakay palayo; ang "dinala palayo" ay tumpak at natural.
  - severity: medium
    issue: Ang "pinakapunong pari" ay sobrang anyong pasukdol at hindi wastong titulo para sa τὸν ἀρχιερέα.
    rationale: Ang Griyego ay tumutukoy sa tituladong "ang punong pari," hindi sa paghahambing na "pinaka-."
  - severity: low
    issue: Ang "matatandang pinuno" ay interpretibong pagpapalawak ng οἱ πρεσβύτεροι.
    rationale: Ang "mga nakatatanda" ay mas malapit sa termino at pinananatili ang historikal na katawagan nang hindi nagdaragdag ng "pinuno."
  revised_text: Ang mga dumakip kay Jesus ay dinala siya palayo kay Caifas, ang punong pari, kung saan nagkatipon na[a] ang mga eskriba at mga nakatatanda.
