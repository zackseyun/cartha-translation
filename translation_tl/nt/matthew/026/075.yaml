source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: tl
  text: 'At naalala ni Pedro ang sinabi ni Jesus: “Bago tumilaok ang isang tandang[a], tatlong beses mo akong ipagkakaila.” Lumabas siya at umiyak nang mapait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang tandang.” Walang pantukoy sa Griyego, ngunit maaaring gamitin sa Tagalog ang “isang tandang” o “ang tandang” para sa pangyayaring ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: naalala
  rationale: Likas at tuwirang ipinapahayag nito sa modernong Tagalog ang muling paggunita ni Pedro, nang hindi pinipilit ang anyong pasibo ng Griyego.
- source_word: ῥήματος Ἰησοῦ εἰρηκότος
  choice: ang sinabi ni Jesus
  rationale: Ang ῥῆμα ay tumutukoy rito sa binigkas na salita o pahayag. Mas natural sa Tagalog ang “ang sinabi ni Jesus” kaysa sa literal ngunit mabigat na “ang salitang sinalita ni Jesus,” at naipahihiwatig na rin ng konteksto na nauna itong sinabi.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Bago tumilaok ang isang tandang
  rationale: Ginagawang likas na sugnay na panahunan ang infinitival construction. Ang “isang tandang” ay tumutugma sa kawalan ng pantukoy sa ἀλέκτορα, habang inilalahad sa talababa ang idiomatikong alternatibo.
- source_word: τρὶς
  choice: tatlong beses
  rationale: Ito ang malinaw at karaniwang modernong Tagalog para sa tatlong ulit.
- source_word: ἀπαρνήσῃ
  choice: ipagkakaila mo ako
  rationale: Ang “ipagkakaila” ay natural sa konteksto ng pagtatanggi ni Pedro sa kaniyang kaugnayan kay Jesus at pinananatili ang bigat ng pandiwa nang walang dagdag na paliwanag.
- source_word: ἐξελθὼν ἔξω
  choice: Pagkalabas niya
  rationale: Likas na pinaiikli nito sa Tagalog ang bahagyang inuulit na Griyegong participle at adverb, habang malinaw na nananatili ang pag-alis niya sa lugar.
- source_word: ἔκλαυσεν πικρῶς
  choice: umiyak siya nang buong kapaitan
  rationale: Pinananatili nito ang matinding dalamhati ng parirala nang hindi nagdaragdag ng kilos gaya ng paghagulgol na hindi tahasang nasa teksto.
theological_decisions:
- issue: Pagtukoy kay Jesus sa pangalan lamang
  choice: Jesus
  alternative: Panginoong Jesus
  rationale: Ἰησοῦ lamang ang nasa Griyego; hindi nagdagdag ng titulong kristolohikal na wala sa pinagmulang teksto.
- issue: Kahulugan ng pagkakaila ni Pedro
  choice: ipagkakaila mo ako
  alternative: itatatwa mo ako
  rationale: Pinananatili ng “ipagkakaila” ang pagtatanggi sa kaugnayan kay Jesus nang hindi nililimitahan ang diwa sa isang mas tiyak na doktrinal o sikolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang likas na ayos ng pangungusap at iniwasan ang sobrang literal o makalumang pananalita. Nasa pangunahing teksto ang lahat ng marker ng talababa.
