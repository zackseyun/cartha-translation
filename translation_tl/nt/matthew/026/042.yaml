base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: tl
  text: Muli, sa pangalawang pagkakataon, lumayo siya at nanalangin. Sinabi niya, “Ama ko, kung hindi ito maaaring mawala[a] malibang inumin ko ito[b], mangyari ang kalooban mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ito” ay tumutukoy sa kopang binanggit sa naunang talata, na larawan ng pagdurusa; “ito” lamang ang nakasulat sa Griyego sa talatang ito.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin: “kung hindi posibleng mawala ito malibang inumin ko ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Muli, sa ikalawang pagkakataon
  rationale: Pinananatili ang dalawang panandang nagsasaad ng pag-uulit sa Griyego—πάλιν (‘muli’) at ἐκ δευτέρου (‘sa ikalawang pagkakataon’)—kahit may bahagyang pag-uulit din sa Tagalog.
- source_word: ἀπελθὼν
  choice: lumayo siya
  rationale: Ang aorist participle ay ginawang likas na pandiwang pasalaysay sa Tagalog at ipinakikitang nauna ang paglayo sa pananalangin.
- source_word: προσηύξατο λέγων
  choice: nanalangin. Sinabi niya
  rationale: Likas sa makabagong Tagalog ang paghahati sa dalawang pangungusap; malinaw pa ring ipinakikilala ng ‘Sinabi niya’ ang mismong nilalaman ng panalangin.
- source_word: Πάτερ μου
  choice: Ama ko
  rationale: Tuwirang isinasalin ang bokatibo at panghalip na paari, habang pinananatili ang malapit na ugnayang ipinahahayag ng pananalita.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: kung hindi ito maaaring lumipas
  rationale: Pinananatili ang demonstratibong ‘ito’ bilang simuno at ang diwa ng kawalan ng posibilidad sa οὐ δύναται, nang hindi idinaragdag sa teksto ang salitang ‘kopa.’
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: malibang inumin ko ito
  rationale: Ang ἐὰν μή ay likas na isinaling ‘malibang,’ at ang αὐτό ay pinanatiling ‘ito’ upang tumukoy sa naunang demonstratibo nang hindi nililinaw nang higit sa Griyego.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: mangyari ang kalooban mo
  rationale: Ang ‘mangyari’ ay nagpapanatili sa puwersa ng pautos na panalangin at sa diwa ng γίνομαι, gayundin sa ugnay nito sa pananalita sa Mateo 6:10.
theological_decisions:
- issue: Kung tahasang babanggitin ang ‘kopa’ para sa τοῦτο at αὐτό
  choice: Panatilihin sa pangunahing teksto ang ‘ito … ito.’
  alternative: ‘ang kopang ito … ito’ o ‘ang kopang ito … ang kopang ito’
  rationale: Malinaw sa Mateo 26:39 na ang tinutukoy ay ang kopa, ngunit hindi inuulit ng talatang ito ang ποτήριον. Pinananatili ng salin ang pahiwatig at ambiguwidad ng mismong talata, at inilalagay sa talababa ang paliwanag mula sa konteksto.
- issue: Paglalarawan sa pagpapasakop ni Jesus sa kalooban ng Ama
  choice: mangyari ang kalooban mo
  alternative: masunod ang kalooban mo
  rationale: Mas tuwirang kumakatawan ang ‘mangyari’ sa γενηθήτω at hindi nito tahimik na pinapalitan ang larawan ng pagkatupad ng kalooban ng ideya lamang ng pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pag-uulit sa pambungad dahil kapuwa naroon sa Griyego ang πάλιν at ἐκ δευτέρου. Iniwasan ang pagdaragdag ng ‘kopa’ sa pangunahing teksto at pinanatili ang matimbang na pananalitang ‘mangyari ang kalooban mo.’
