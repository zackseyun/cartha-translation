  terminology: Ang 'Ama ko' at 'mangyari ang kalooban mo' ay wasto, marangal, at angkop sa pananalanging ito. Dapat itama ang 'kopa' sa talababa bilang 'kopa' lamang kung iyon ang piniling katawagan, ngunit mas natural at karaniwan sa Filipino ang 'kopa' kaysa 'kopa ng pagdurusa'; ang paliwanag ay dapat ding kilalaning kontekstuwal ang reperensiya at hindi ipinapangalan sa pangunahing teksto.
