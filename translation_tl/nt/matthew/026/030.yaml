  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: tl
  text: At matapos silang umawit ng papuri[a], lumabas sila patungo sa Bundok ng mga Olibo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umawit ng isang himno.” Ang pandiwang Griyego ay maaaring tumukoy sa pangkalahatang pag-awit ng papuri; ang pag-awit ng himno ay angkop din sa konteksto ng hapunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: matapos silang umawit ng papuri
  rationale: Ang aorist participle ng ὑμνέω ay tumutukoy sa pag-awit ng papuri o himno bago ang kilos ng pangunahing pandiwa. Natural sa modernong Tagalog ang “umawit ng papuri” at hindi nito ipinapalagay na iisang awit lamang ang inawit.
- source_word: ἐξῆλθον
  choice: pumunta sila
  rationale: Sa konteksto, ang ἐξέρχομαι ay paglabas o pag-alis patungo sa isang lugar. Ang “pumunta sila” ay likas sa Tagalog kapag tahasang kasunod ang destinasyon, habang ang ideya ng pag-alis ay malinaw sa daloy.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sa Bundok ng mga Olibo
  rationale: Pinananatili nito ang nakaugaliang pangalang heograpiko at ang genitibong kahulugang tumutukoy sa mga punong olibo.
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang salaysay at hindi nagdaragdag ng temporal na kahulugang higit sa nasa Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “papuri” sa pangunahing teksto upang mapanatili ang lawak ng pandiwang Griyego, at inilagay sa talababa ang mas tiyak na “isang himno.”
