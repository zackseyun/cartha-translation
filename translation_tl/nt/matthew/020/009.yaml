  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: tl
  text: At ang mga dumating nang bandang ikalabing-isang oras ay tumanggap ng tig-iisang denario.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang denario ay isang karaniwang baryang pilak ng Roma at madalas na katumbas ng isang araw na sahod ng manggagawa.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa naunang pangyayari sa salaysay.
- source_word: ἐλθόντες
  choice: nang dumating
  rationale: Likas na Filipino para sa aorist participle at malinaw na inuugnay ang pagdating sa pagtanggap ng bayad.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: ang mga manggagawang pumasok nang bandang ikalabing-isang oras
  rationale: Ang 'bandang' ay nagpapahayag ng tinatayang oras na taglay ng περὶ. Idinagdag ang 'manggagawa' at ginamit ang 'pumasok' upang maging malinaw at natural sa konteksto ng talinghaga, nang hindi sinasabing muli na sila ay inupahan.
- source_word: ἔλαβον
  choice: tumanggap
  rationale: Angkop sa konteksto ng pagbabayad at hindi nagpapahiwatig na basta nila kinuha ang salapi.
- source_word: ἀνὰ
  choice: tig-iisang
  rationale: 'Malinaw na ipinahahayag ang distributibong diwa: isang denario para sa bawat isa.'
- source_word: δηνάριον
  choice: denario
  rationale: Pinananatili ang makasaysayang pangalan ng baryang tahasang binanggit sa Griyego; ipinaliliwanag ang halaga nito sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'bandang ikalabing-isang oras' upang panatilihin ang sinaunang paraan ng pagtukoy sa oras; sa konteksto, ito ay bandang alas-singko ng hapon. Nasa pangunahing teksto ang marker na [a].
