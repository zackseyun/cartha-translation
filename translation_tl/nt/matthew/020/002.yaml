  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: tl
  text: Matapos siyang makipagkasundo sa mga manggagawa na isang denario ang sahod para sa isang araw[a], pinapunta niya sila sa kanyang ubasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang denario ay karaniwang sahod ng isang manggagawa para sa isang araw.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Matapos siyang makipagkasundo
  rationale: Ang aorist participle ay nagsasaad ng pagkilos na nauna sa pangunahing pandiwa; natural itong ipinapahayag sa Tagalog bilang “Matapos siyang makipagkasundo.”
- source_word: δὲ
  choice: —
  rationale: Mahinang pang-ugnay lamang ito sa salaysay at hindi kailangang katawanin nang tahasan sa Tagalog.
- source_word: ἐργατῶν
  choice: mga manggagawa
  rationale: Karaniwan, malinaw, at angkop sa konteksto ng mga inupahang magtrabaho sa ubasan.
- source_word: ἐκ δηναρίου
  choice: isang denario ang bayad
  rationale: Ipinahahayag ng parirala ang napagkasunduang halaga ng sahod. Pinananatili ang pangalan ng sinaunang salapi at nililinaw ang tungkulin nito bilang bayad.
- source_word: τὴν ἡμέραν
  choice: sa maghapon
  rationale: Ipinahahayag nito ang haba ng panahong saklaw ng napagkasunduang sahod nang hindi nagdaragdag ng detalye.
- source_word: ἀπέστειλεν
  choice: pinapunta niya
  rationale: Sa kontekstong ito, natural na Tagalog ito para sa pagpapadala sa mga manggagawa patungo sa ubasan.
- source_word: ἀμπελῶνα
  choice: ubasan
  rationale: Ito ang karaniwan at tumpak na salin ng vineyard sa Tagalog.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tuwirang ipinakikita ang pag-aari ng may-ari ng lupa sa ubasan.
