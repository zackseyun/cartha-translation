  to: Matapos siyang makipagkasundo sa mga manggagawa na isang denario ang sahod para sa isang araw[a], pinapunta niya sila sa kanyang ubasan.
  rationale: Pinalitan ang “sa maghapon” ng “para sa isang araw” upang mas malinaw na maipahayag na ang isang denario ang napagkasunduang arawang sahod, alinsunod sa Griyego, habang pinananatili ang natural na modernong Filipino at ang lahat ng iba pang kahulugan ng draft.
