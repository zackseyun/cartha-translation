  naturalness: Natural sa pangkalahatan ang daloy. Ang “isang denario ang bayad sa maghapon” ay naiintindihan, ngunit mas malinaw at mas idiomatiko sa modernong Filipino ang “isang denario ang sahod para sa isang araw.”
