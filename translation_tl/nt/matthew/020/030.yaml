id: MAT.20.30
reference: Matthew 20:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: tl
  text: At narito, may dalawang bulag na lalaki na nakaupo sa tabi ng daan. Nang marinig nilang dumaraan si Jesus, sumigaw sila, “Panginoon, maawa po kayo sa amin, Anak ni David!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tingnan ninyo
  rationale: Pinananatili ang panawag-pansing puwersa at kasiglahan ng salaysay, sa natural ngunit marangal na makabagong Tagalog.
- source_word: δύο τυφλοὶ
  choice: dalawang lalaking bulag
  rationale: Tumutukoy ang panlalaking pangmaramihang anyo sa dalawang tiyak na lalaki; malinaw at natural ang person-first na ayos sa Tagalog.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: nakaupo sa tabi ng daan
  rationale: Tuwirang pinananatili ang kilos at pisikal na lugar sa natural na Tagalog.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Nang marinig nilang dumaraan si Jesus
  rationale: Ipinahahayag nang temporal ang aorist participle at likas na isinasalin ang παράγει bilang “dumaraan.”
- source_word: ἔκραξαν λέγοντες
  choice: sumigaw sila
  rationale: Naipahihiwatig na ng “sumigaw” ang malakas na pagsasalita, kaya hindi na inuulit ang literal na “na sinasabi,” na magiging mabigat sa Tagalog.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang magalang at posibleng kristolohikal na bigat ng direktang pagtawag kay Jesus, lalo na kasabay ng titulong “Anak ni David.”
- source_word: ἐλέησον ἡμᾶς
  choice: maawa po kayo sa amin
  rationale: Natural na pakiusap sa Tagalog para sa mahabaging tulong; ipinapahayag ng “po” ang paggalang na angkop sa direktang panawagan.
- source_word: υἱὸς Δαυίδ
  choice: Anak ni David
  rationale: Pinananatili ang kinikilalang titulong mesyaniko at ang kaugnayan nito sa maharlikang angkan ni David, sa halip na gawing pangkaraniwang “inapo.”
theological_decisions:
- issue: Kahulugan ng κύριος sa direktang pagtawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring mangahulugan ang κύριος ng magalang na “Ginoo,” ngunit ang pagkakatambal nito sa “Anak ni David” ay may mapitagang at mesyanikong bigat. Pinananatili ng “Panginoon” ang puwersang iyon nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Mesyanikong puwersa ng υἱὸς Δαυίδ
  choice: Anak ni David
  alternative: inapo ni David
  rationale: Sa Mateo, gumaganap ang parirala bilang isang kinikilalang titulong mesyaniko. Pinananatili ng tradisyonal at literal na anyo ang parehong ugnayang angkan at maharlikang pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “At tingnan ninyo” upang mapanatili ang panawag-pansing καὶ ἰδού nang hindi gumagamit ng lipas na “narito.” Ang “po kayo” ay natural na magalang na direktang panawagan sa Filipino; ang pangmaramihang “kayo” ay maaari ring tumugma sa paggalang sa iisang kausap.
