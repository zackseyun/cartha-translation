  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: tl
  text: At ang sinumang nagnanais na maging una sa inyo ay magiging alipin ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lingkod.” Ang salitang Griyego ay doulos, na mas matindi kaysa sa salitang ginamit sa naunang talata at karaniwang tumutukoy sa isang alipin o taong nakatali sa paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: sinumang nagnanais
  rationale: Ipinahahayag ng panghalip na may ἄν at pandiwang nasa subjunctive ang isang pangkalahatan at di-tiyak na kondisyon. Likas sa modernong Tagalog ang “sinumang nagnanais” at pinananatili nito ang diwa ng kusang paghahangad.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Sa konteksto ng katayuan sa loob ng pamayanan, natural na ipinahahayag ng “sa inyo” ang kahulugang “among you,” hindi lamang pisikal na lokasyon.
- source_word: εἶναι πρῶτος
  choice: maging una
  rationale: Tuwirang ipinapahayag nito ang hangaring magkaroon ng pinakamataas na katayuan o ranggo.
- source_word: ἔσται
  choice: ay magiging
  rationale: Pinananatili ang anyong panghinaharap ng Griyego. Sa konteksto, may normatibong puwersa ito nang hindi kailangang tahasang gawing “dapat maging.”
- source_word: ὑμῶν
  choice: ninyo
  rationale: 'Ipinapakita ng genitive ang kaugnayan sa buong pangkat: siya ay magiging alipin ninyo.'
- source_word: δοῦλος
  choice: alipin
  rationale: Mas malakas ang δοῦλος kaysa διάκονος sa naunang talata. Pinananatili ng “alipin” ang diin sa mababang katayuan at lubos na paglilingkod, sa halip na pahinain ito bilang karaniwang “lingkod.”
theological_decisions:
- issue: Pagkakasalin ng δοῦλος sa isang aral tungkol sa pagiging alagad
  choice: alipin
  alternative: lingkod
  rationale: Binabaligtad ng sinabi ni Jesus ang paghahangad sa mataas na katayuan at pinatitindi ang wika ng paglilingkod mula sa naunang talata. Ang “alipin” ang mas tapat sa lakas ng salitang Griyego at hindi nagpapasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nagnanais” sa halip na mas kolokyal na “gustong,” at “alipin” upang mapanatili ang sadyang pag-igting mula sa διάκονος sa talata 26 tungo sa δοῦλος dito.
