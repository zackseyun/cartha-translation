  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: tl
  text: Hindi magiging gayon sa gitna ninyo.[a] Sa halip, ang sinumang nagnanais na maging dakila sa gitna ninyo ay magiging lingkod ninyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi gayon sa gitna ninyo.” Gumagamit ang Griyego ng pandiwang panghinaharap (“magiging”), na maaaring magpahayag kung ano ang hindi dapat mangyari sa mga tagasunod ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Hindi magiging gayon sa inyo
  rationale: Pinananatili ng “magiging” ang panghinaharap na ἔσται at ang normatibong diin ng tagubilin ni Jesus; likas na ipinapahayag ng “sa inyo” ang ugnayang panlipunan ng ἐν ὑμῖν.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Sa halip, ang sinumang nagnanais
  rationale: Ipinahahayag ng “ang sinumang” ang di-tiyak at pangkalahatang kondisyon ng ὃς ἂν, at malinaw na pinananatili ng “nagnanais” ang bolisyunal na kahulugan ng θέλῃ.
- source_word: μέγας γενέσθαι
  choice: na maging dakila
  rationale: Ang “maging” ay nagpapakita ng pagbabago tungo sa pagiging dakila, kaya napapanatili ang ingresibong diwa ng γενέσθαι sa halip na isang kalagayan lamang.
- source_word: διάκονος
  choice: lingkod
  rationale: Sa kontekstong ito, ang διάκονος ay taong naglilingkod. Ang “lingkod” ay natural at konkreto, at hindi ito nag-aangkat ng mas huling katungkulan sa iglesya gaya ng “diyakono.”
- source_word: ὑμῶν
  choice: ninyo
  rationale: Likas na inihahayag ng “lingkod ninyo” ang relasyonal na genitibong ὑμῶν nang hindi nagiging pilit ang Tagalog.
theological_decisions:
- issue: Ang likas na katangian ng kadakilaan sa pamayanan ng mga tagasunod ni Jesus
  choice: Ihayag ang sinabi bilang normatibong pagbaligtad sa makamundong herarkiya, habang pinananatili ang kongkretong wika ng paglilingkod
  alternative: Unawain ang διάκονος bilang opisyal na katungkulan ng diyakono, o gawing pangkalahatang pahayag lamang tungkol sa pagpapakumbaba
  rationale: Ikinukumpara ng konteksto ang paraan ng pamumuno ng mga pinuno ng mga bansa sa pamantayan ni Jesus para sa kanyang mga alagad. Hindi ginagawang institusyonal ng salin ang termino at hindi rin pinapalabo ang larawan ng pagiging lingkod.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinili ang “Sa halip” upang maging natural ang matinding pagsalungat ng ἀλλά. Pinanatili ang kuwit sa hulihan dahil bahagi ang talata ng nagpapatuloy na pangungusap sa kasunod na bersikulo.
