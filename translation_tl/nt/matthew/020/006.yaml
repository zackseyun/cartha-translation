  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang “ikalabing-isang oras” dahil mahalaga ito sa balangkas ng talinghaga; sa sinaunang pagbibilang mula pagsikat ng araw, ito ay bandang ikalima ng hapon. Inilagay ang marker [a] kaagad pagkatapos ng pariralang tinutukoy nito.
