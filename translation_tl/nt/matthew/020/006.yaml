- from: At nang mag-iikalabing-isang oras na, lumabas siya at nakakita pa ng iba na nakatayo roon. Sinabi niya sa kanila[a], “Bakit maghapon kayong nakatayo rito na walang ginagawa?”
  to: Bandang ikalabing-isang oras, lumabas siya at nakita niya ang iba pang mga taong nakatayo roon. Sinabi niya sa kanila[a], “Bakit maghapon kayong nakatayo rito na walang ginagawa?”
  rationale: Pinalitan ang pambungad upang tumpak at natural na maipahayag ang περί (“bandang”) kasama ng “ikalabing-isang oras.” Ginawang “nakita niya ang iba pang mga taong nakatayo” ang kasunod na parirala upang maging mas likas sa Filipino habang pinananatili ang kahulugang “found others standing.” Hindi binago ang diwa ng tanong o ang talababa hinggil sa historical present.
