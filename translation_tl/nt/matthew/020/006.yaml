base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: tl
  text: Bandang ikalabing-isang oras, lumabas siya at nakita niya ang iba pang mga taong nakatayo roon. Sinabi niya sa kanila[a], “Bakit maghapon kayong nakatayo rito na walang ginagawa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griego, “sinasabi niya sa kanila.” Ginamit dito ang historical present upang gawing mas buhay ang salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: At nang mag-iikalabing-isang oras na
  rationale: Ipinananatili ang sinaunang paraan ng pagbibilang ng oras at ang diwa ng pagtataya ng περί; sa konteksto, ito ay bandang ikalima ng hapon.
- source_word: ἐξελθὼν εὗρεν
  choice: lumabas siya at nakakita
  rationale: Natural na isinasalaysay sa Filipino ang sunod na kilos ng aorist participle at pangunahing pandiwa nang hindi nawawala ang pagkakasunod-sunod.
- source_word: ἄλλους ἑστῶτας
  choice: iba na nakatayo roon
  rationale: Ang ἄλλους ay substantival na “iba,” at ang perfect participle ay tumutukoy sa patuloy na kalagayan ng pagkakatayo.
- source_word: καὶ λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ginawang pangnagdaan sa natural na salaysay sa Filipino; ang anyong Griyego ay historical present at itinatala sa talababa.
- source_word: Τί ὧδε ἑστήκατε
  choice: Bakit ... kayong nakatayo rito
  rationale: Sa ganitong tanong, ang τί ay idiomatikong “bakit”; ipinahahayag ng perfect ang nagpapatuloy na kalagayan.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: maghapon ... na walang ginagawa
  rationale: Ang “maghapon” ay natural na katumbas ng buong araw, at ang “walang ginagawa” ay malinaw at di-mapanghusgang salin ng ἀργοί sa konteksto.
