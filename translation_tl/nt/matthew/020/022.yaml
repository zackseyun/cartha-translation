reference: Matthew 20:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: tl
  text: Ngunit sumagot si Jesus, “Hindi ninyo alam kung ano ang hinihingi ninyo. Kaya ba ninyong inumin ang kopa na malapit ko nang inumin?[a]” Sinabi nila sa kanya, “Kaya namin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “kopa” ay karaniwang larawan sa Biblia para sa bahaging itinakda sa isang tao, lalo na sa pagdurusa; mas tahasang salin: “ang kopa ng pagdurusa na malapit ko nang inumin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ngunit sumagot si Jesus
  rationale: Natural sa modernong Tagalog ang pinaikling pormulang ito; ipinahihiwatig na ng “sumagot” ang pagsasalita, samantalang inilalarawan ng “Ngunit” ang banayad na pagsalungat ng δέ.
- source_word: Οὐκ οἴδατε
  choice: Hindi ninyo alam
  rationale: Tuwirang isinasalin ang kahulugan ng οἶδα bilang kaalaman, nang hindi ito binibigyang-kahulugang “nauunawaan.”
- source_word: τί αἰτεῖσθε
  choice: kung ano ang hinihingi ninyo
  rationale: Likas na Tagalog para sa bagay na kasalukuyan nilang hinihiling; ang “hinihingi” ay angkop sa naunang pakiusap.
- source_word: δύνασθε
  choice: Kaya ba ninyo
  rationale: Karaniwang paraan sa Tagalog upang itanong ang kakayahan o kapasidad, at angkop sa bigat ng sinabi.
- source_word: πιεῖν τὸ ποτήριον
  choice: inumin ang kopa
  rationale: Pinananatili ang kongkretong talinghagang nasa Griyego sa halip na palitan ito ng paliwanag tungkol sa pagdurusa.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: na malapit ko nang inumin
  rationale: Ipinapakita ng “malapit ... nang” ang nalalapit na kilos na ipinahihiwatig ng μέλλω, habang pinananatili ang talinghaga.
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Isinasalin ang historical present bilang nakaraang panahunan, na mas natural sa salaysay sa Tagalog.
- source_word: Δυνάμεθα
  choice: Kaya namin
  rationale: Likas at mariing tugon sa Tagalog, at inuulit ang parehong salitang ginamit sa tanong tungkol sa kakayahan.
theological_decisions:
- issue: Talinghagang “ang kopa”
  choice: Panatilihin ang “kopa” sa pangunahing teksto nang hindi tahasang tinutumbasan ng pagdurusa o kamatayan.
  alternative: “ang pagdurusang malapit ko nang danasin” o “ang kopa ng pagdurusa na malapit ko nang inumin”
  rationale: Mahalaga at sadyang bukas ang talinghaga sa konteksto. Itinuturo nito ang nalalapit na pagdurusa ni Jesus ngunit hindi dapat paliitin sa iisang paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo/nila” sa halip na mas pormal o makalumang anyo. Pinili ang “kopa” upang mapanatili ang biblikal na talinghaga nang hindi tunog-kolokyal.
