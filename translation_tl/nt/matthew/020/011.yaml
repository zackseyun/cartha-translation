  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: tl
  text: Nang matanggap nila iyon, nagbulung-bulungan sila laban sa amo ng sambahayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may-ari ng lupain.”
    reason: Ang οἰκοδεσπότης ay maaaring tumukoy sa amo ng sambahayan o sa may-ari ng ari-arian; ang ikalawang salin ay angkop sa tagpuan ng talinghaga.
lexical_decisions:
- source_word: λαβόντες
  choice: Nang matanggap nila iyon
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Likas sa Tagalog ang temporal na sugnay na “Nang matanggap nila iyon.” Ang “iyon” ay tumutukoy sa denario o bayad na ipinahihiwatig ng konteksto ngunit hindi tahasang binabanggit sa Griyego.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay. Sapat nang ipinahihiwatig ng pagkakasunod ng mga sugnay sa natural na Tagalog, kaya hindi kailangan ang tahasang “at” o “ngunit.”
- source_word: ἐγόγγυζον
  choice: nagbulung-bulungan sila
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy o nagsisimulang pagkilos. Pinananatili ng “nagbulung-bulungan” ang diwa ng pabulong at di-nasisiyahang pagrereklamo.
- source_word: κατὰ
  choice: laban sa
  rationale: Kasama ng genitive, ipinahahayag ng κατά ang pagtutol na nakatuon sa isang tao. Malinaw itong naipapahayag ng “laban sa.”
- source_word: τοῦ οἰκοδεσπότου
  choice: amo ng sambahayan
  rationale: Ang οἰκοδεσπότης ay pinuno o amo ng isang sambahayan o ari-arian. Pinananatili ng “amo ng sambahayan” ang saklaw ng salitang Griyego nang hindi ito nililimitahan sa pagmamay-ari lamang ng lupa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagbulung-bulungan” upang mapanatili ang mas tiyak na himig ng γογγύζω kaysa sa pangkalahatang “nagreklamo.”
