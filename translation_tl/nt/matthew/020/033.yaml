  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Panginoon[a], nawa’y mabuksan ang aming mga mata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ginoo.”
    reason: Leksikal na alternatibo para sa κύριε, na maaaring mangahulugang marangal na “Panginoon” o magalang na “Ginoo” ayon sa konteksto.
lexical_decisions:
- source_word: λέγουσιν
  choice: Sinabi nila
  rationale: Ang pangkasalukuyang anyo ay isang karaniwang historical present sa salaysay na Griyego; natural itong isinasalin sa aspektong naganap sa modernong Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang ipinahahayag ang panghalip na datibo bilang pinag-ukulan ng sinabi.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang marangal na pagtawag kay Jesus at ang posibleng pagkilala sa kanyang awtoridad, nang hindi inaalis ang leksikal na posibilidad na isa rin itong magalang na tawag.
- source_word: ἵνα ἀνοιγῶσιν
  choice: nawa’y mabuksan
  rationale: 'Natural na pormang pakiusap sa Tagalog na pinananatili ang diwang subjunctive at ang balintiyak na anyo: ang mga mata ang tumatanggap ng kilos.'
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: ang aming mga mata
  rationale: Tumpak at natural na katumbas ng pangngalang maramihan na may panghalip na paari; ang “aming” ay angkop dahil kausap nila si Jesus, na hindi kabilang sa nagsasalitang pangkat.
theological_decisions:
- issue: Ang pagtawag na κύριος kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay nagpapanatili sa bigat ng κύριος sa salaysay ni Mateo at sa posibleng pagkilala sa awtoridad ni Jesus. Gayunman, hindi pinapawi ang posibilidad na magalang na “Ginoo” lamang ang diin sa bibig ng mga nagsasalita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nawa’y mabuksan” upang maipahayag ang pakiusap nang hindi ginagawang tahasang utos at upang mapanatili ang balintiyak na anyo ng Griyego.
