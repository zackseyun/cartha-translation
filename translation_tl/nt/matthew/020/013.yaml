base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: tl
  text: Ngunit sumagot siya sa isa sa kanila, ‘Kaibigan, hindi kita tinatrato nang hindi makatarungan. Hindi ba’t nagkasundo tayo sa isang denario?[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang denario ay isang karaniwang pilak na salaping Romano, na karaniwang itinuturing na sahod ng isang manggagawa para sa isang araw.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Likas sa modernong Tagalog at tumpak na naghahayag na tugon ito ng may-ari; hindi kailangang gayahin ang participial na anyo ng Griyego.
- source_word: ἑνὶ αὐτῶν
  choice: sa isa sa kanila
  rationale: Pinananatili ang dative singular at ang diwang isang tao mula sa pangkat ang tuwirang kinausap.
- source_word: Ἑταῖρε
  choice: Kaibigan
  rationale: Karaniwang katumbas sa Tagalog na maaari ring magtaglay ng mapagpigil o bahagyang dumidistansiyang tono sa konteksto, hindi lamang mainit na pagkakaibigan.
- source_word: οὐκ ἀδικῶ σε
  choice: hindi kita ginagawan ng masama
  rationale: Natural at malinaw na ipinapahayag ang personal na layon na σε at ang kahulugang hindi siya tinatrato nang mali o di-makatarungan.
- source_word: οὐχὶ
  choice: Hindi ba't
  rationale: Nagpapakilala ng retorikal na tanong na umaasa ng pagsang-ayon, sa natural ngunit marangal na Tagalog.
- source_word: δηναρίου
  choice: sa isang denario
  rationale: Pinananatili ang makasaysayang pangalan ng salaping Romano at ang genitive of price, sa halip na palitan agad ng paliwanag na 'isang araw na sahod.'
- source_word: συνεφώνησάς μοι
  choice: nagkasundo tayo
  rationale: Natural na Tagalog para sa naunang kasunduan ng dalawang panig; ang inklusibong 'tayo' ay malinaw na tumutukoy sa nagsasalita at sa kausap.
