  terminology: Wasto ang “huling taong ito” para sa panlalaking isahang manggagawa sa konteksto. Pinananatili ng “ibigay” ang saklaw ng δίδωμι at hindi nito isinasara ang kahulugan sa “bayaran” o “sahod.”
