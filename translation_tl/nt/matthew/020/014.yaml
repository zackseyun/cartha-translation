  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: tl
  text: Kunin mo ang sa iyo at umalis ka. Ngunit nais kong ibigay sa huling taong ito[a] ang kapareho rin ng ibinigay ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa huling ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆρον
  choice: Kunin mo
  rationale: Ang aorist imperative ng αἴρω ay tuwirang utos na kunin ng manggagawa ang nauukol sa kaniya; natural at malinaw sa modernong Tagalog ang “Kunin mo.”
- source_word: τὸ σὸν
  choice: ang sa iyo
  rationale: Pinananatili nito ang malawak na kahulugan ng substantibong parirala (“ang pag-aari o nauukol sa iyo”) nang hindi tahasang idinaragdag ang “sahod,” bagaman iyon ang tinutukoy sa konteksto.
- source_word: ὕπαγε
  choice: umalis ka
  rationale: Sa konteksto, ang ὕπαγε ay isang pagpapaalis o pagsasabing humayo na. Mas natural dito ang “umalis ka” kaysa sa payak na “pumunta ka,” nang hindi kinakailangang palalain ang tono.
- source_word: θέλω δὲ
  choice: Ngunit nais kong
  rationale: Ipinahahayag ng θέλω ang pasiya o kagustuhan ng nagsasalita, at ipinakikita ng “Ngunit” ang banayad na pagsalungat ng δέ.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: sa huling taong ito
  rationale: Tumutukoy ang panlalaking isahan sa isang partikular na manggagawang lalaki na huling dumating. Malinaw at natural ang “huling taong ito,” habang itinatala sa talababa ang mas literal at maikling alternatibo.
- source_word: δοῦναι
  choice: ibigay
  rationale: Pinananatili ng “ibigay” ang karaniwang kahulugan ng δίδωμι at ang diin sa malayang pagpapasiya ng may-ari, sa halip na gawing mas tiyak na “bayaran.”
- source_word: ὡς καὶ σοί
  choice: ang katulad ng ibinigay ko sa iyo
  rationale: Ipinahahayag nito sa natural na Tagalog ang paghahambing at pagkakapantay na ipinahihiwatig ng ὡς καὶ σοί. Ang bagay na ibinibigay ay eliptiko rin sa Griyego at nauunawaan mula sa konteksto.
theological_decisions:
- issue: Paglalarawan sa panlalaking isahang tinutukoy
  choice: huling taong ito
  alternative: huling ito
  rationale: Isang partikular na lalaking manggagawa ang tinutukoy sa talinghaga. Pinananatili ng pangunahing teksto ang personal at panlalaking reperensiya, habang ang alternatibo ay lehitimong mas malapit sa maikling anyo ng Griyego.
- issue: Hindi tahasang binanggit na bagay na ibinibigay
  choice: ang katulad ng ibinigay ko sa iyo
  alternative: ang kaparehong halaga na ibinigay ko sa iyo
  rationale: Hindi tahasang inuulit ng Griyego ang bagay na ibinibigay. Iniiwasan ng piniling salin ang pagdaragdag ng “halaga” o “sahod,” bagaman malinaw iyon sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tuwiran ang mga pautos, ngunit hindi dinaragdagan ng masungit na himig. Pinananatili ang elipsis ng bagay na ibinibigay hangga’t maaari sa natural na Tagalog.
