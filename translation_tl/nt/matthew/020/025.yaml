    issue: Ang "naghahari-harian" ay maaaring magpahiwatig ng pagpapanggap o paglalaro ng pagiging hari.
    rationale: Ang κατακυριεύουσιν ay tumutukoy sa mapangibabaw na pag-aangkin o pagsasagawa ng paghahari, hindi sa huwad o kunwaring paghahari.
  - severity: low
    issue: Medyo mabigat ang "tinawag sila ni Jesus palapit sa kanya."
    rationale: Ang "ipinatawag sila ni Jesus sa kanya" ay mas idiomatiko at malinaw na isinasama ang paglapit kay Jesus na ipinahihiwatig ng gitnang anyo ng προσκαλεσάμενος.
