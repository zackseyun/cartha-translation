id: MAT.20.25
reference: Matthew 20:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: tl
  text: Ngunit ipinatawag sila ni Jesus sa kanya at sinabi, “Alam ninyo na ang mga pinuno ng mga Hentil[a] ay nangingibabaw sa kanila, at ang kanilang mga makapangyarihan[b] ay nagpapairal ng kapangyarihan sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: alternative_reading
  - marker: b
    text: O “kanilang mga dakila” o “kanilang matataas na opisyal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag sila ... palapit sa kanya
  rationale: Ipinahahayag nito nang natural sa Tagalog ang kilos ni Jesus na tawagin ang mga alagad upang lumapit sa kanya bago siya magsalita.
- source_word: Οἴδατε
  choice: Alam ninyo
  rationale: Bagaman perpekto ang anyo ng pandiwa sa Griyego, pangkasalukuyan ang diwa nito; “Alam ninyo” ang likas at tumpak na katumbas.
- source_word: ἄρχοντες
  choice: mga pinuno
  rationale: Malawak at malinaw itong tumutukoy sa mga namamahala o naghahari, nang hindi nililimitahan sa isang tiyak na katungkulan.
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa kontekstong Judio ng sinabi ni Jesus, tumutukoy ito sa mga bayang hindi Judio; pinananatili sa talababa ang posibleng saling “mga bansa.”
- source_word: κατακυριεύουσιν
  choice: naghahari-harian
  rationale: Pinananatili ng salitang ito ang mapangibabaw at negatibong himig ng tambalang pandiwa, higit kaysa sa neutral na “namamahala.”
- source_word: οἱ μεγάλοι
  choice: ang kanilang mga makapangyarihan
  rationale: Tumutukoy ang substantibong pang-uri sa mga prominenteng tao o mataas na opisyal. Natural sa Tagalog ang “mga makapangyarihan,” habang inilalahad sa talababa ang mas literal at opisyal na mga alternatibo.
- source_word: κατεξουσιάζουσιν
  choice: nagpapairal ng kapangyarihan sa
  rationale: Ipinahahayag nito ang aktibong paggamit ng awtoridad sa iba at umaayon sa negatibong paralelismo ng naunang pandiwa.
- source_word: αὐτῶν
  choice: sa kanila
  rationale: Malinaw na ibinabalik ng panghalip ang tinutukoy sa mga taong nasasakupan ng mga pinuno, nang hindi inuulit ang “mga Hentil.”
theological_decisions:
- issue: Kahulugan ng ἐθνῶν sa kontekstong Judio ng sinabi ni Jesus
  choice: mga Hentil
  alternative: mga bansa
  rationale: Mas malinaw na naipapakita ng “mga Hentil” ang kaibahan sa pagitan ng karaniwang pamamahala ng mga hindi Judio at ng paraang ituturo ni Jesus sa kanyang mga alagad, ngunit nananatiling lehitimong kahulugan ang “mga bansa.”
- issue: Paglalarawan sa οἱ μεγάλοι
  choice: kanilang mga makapangyarihan
  alternative: kanilang mga dakila; kanilang matataas na opisyal
  rationale: Walang gramatikal na kasarian ang mga pangngalang Tagalog, kaya hindi natural na piliting tumbasan ang panlalaking anyo ng Griyego. Ang napiling salita ay tumutukoy sa mga prominenteng may kapangyarihan nang hindi nagdaragdag ng tiyak na katungkulang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naghahari-harian” upang marinig ang mapanuring himig ng Griyego, at “nagpapairal ng kapangyarihan” upang mapanatili ang paralelismo nang hindi maging sobrang teknikal.
