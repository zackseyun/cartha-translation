  source_fidelity: Ang "naghahari-harian" ay hindi ligtas na katumbas ng κατακυριεύουσιν. Sa modernong Filipino, karaniwan itong nangangahulugang nagpapanggap na hari o naglalaro ng pagiging hari, na hindi ipinahihiwatig ng Griyego. Ang "nangingibabaw" ay naghahatid ng mapangibabaw na paggamit ng pamumuno nang hindi nagdaragdag ng pagpapanggap.
  naturalness: Natural at marangal ang karamihan ng salin. Mas malinaw at mas likas ang "ipinatawag sila ni Jesus sa kanya" para sa προσκαλεσάμενος kaysa "tinawag sila ... palapit sa kanya."
  terminology: Ang "mga Hentil" ay katanggap-tanggap para sa τῶν ἐθνῶν sa kontekstong ito, at ang talababa ay wasto ring nagtatala ng "mga bansa." Ang "mga makapangyarihan" at "nagpapairal ng kapangyarihan" ay katanggap-tanggap na magkaparis para sa οἱ μεγάλοι at κατεξουσιάζουσιν.
