id: MAT.20.20
reference: Matthew 20:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: tl
  text: Pagkatapos, lumapit sa kanya ang ina ng mga anak ni Zebedeo, kasama ang kanyang mga anak. Yumukod siya sa harap niya[a] at may hiniling sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang yumukod bilang paggalang, magbigay-pugay, o sumamba, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa Filipino na nag-uugnay sa pangyayaring ito sa naunang salaysay.
- source_word: προσῆλθεν αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak na ipinahahayag ang paglapit sa isang tao nang hindi nagdaragdag ng impormasyong wala sa Griyego.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ang ina ng mga anak ni Zebedeo
  rationale: Malinaw at malapit sa genitibong ayos ng Griyego, habang nananatiling natural sa Filipino.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: kasama ang kanyang mga anak
  rationale: Ipinahahayag ng μετά na may genitibo ang pagsama; malinaw rin na ang mga anak ni Zebedeo ay mga anak ng babae.
- source_word: προσκυνοῦσα
  choice: Yumukod siya sa harap niya
  rationale: Pinananatili ang pisikal at mapitagang kilos nang hindi ipinipilit kung ito ay simpleng pagbibigay-galang o pagsamba.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: at may hiniling sa kanya
  rationale: Natural na Filipino para sa paghingi ng isang bagay mula sa kanya; pinananatili ang di-tiyak na τι sa anyong “may hiniling.”
theological_decisions:
- issue: Kahulugan ng προσκυνοῦσα kaugnay ni Jesus
  choice: Yumukod siya sa harap niya
  alternative: sumamba siya sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagyukod bilang paggalang, pagbibigay-pugay, o pagsamba. Pinili sa pangunahing teksto ang mas malawak na pisikal at mapitagang kahulugan, habang inilalagay sa talababa ang posibleng kahulugang “sumamba” upang mapanatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang estrukturang participyal ng Griyego upang maging natural at madaling maunawaan, ngunit pinanatili ang pagkakasunod-sunod at ugnayan ng mga kilos.
