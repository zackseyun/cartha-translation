id: MAT.20.10
reference: Matthew 20:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: tl
  text: Nang dumating ang mga manggagawang unang tinanggap[a], inakala nilang mas malaki ang matatanggap nila. Ngunit tumanggap din sila ng tig-iisang denario[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “ang mga nauna”; tumutukoy ito sa mga manggagawang unang tinanggap sa talinghaga.
    reason: lexical_alternative
  - marker: b
    text: Ang isang denario ay karaniwang sahod ng isang manggagawa para sa isang araw.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: Nang dumating
  rationale: Ginawang sugnay na panahunan ang aorist participle upang natural na ipahayag sa Tagalog ang pagkakasunod ng mga pangyayari.
- source_word: οἱ πρῶτοι
  choice: ang mga manggagawang unang tinanggap
  rationale: Tumutukoy ito sa pangkat ng mga manggagawang unang kinuha sa talinghaga. Nilinaw ang ipinahihiwatig ng konteksto nang hindi ito ginagawang pahayag tungkol sa ranggo.
- source_word: ἐνόμισαν
  choice: inakala nilang
  rationale: Ipinapahayag ng νομίζω rito ang palagay o inaasahan nila, hindi ang tiyak na kaalaman.
- source_word: πλεῖον
  choice: mas malaki
  rationale: Ang neuter comparative ay tumutukoy sa mas malaking halaga ng bayad; mas natural sa Tagalog ang “mas malaki” kapag halaga ang pinag-uusapan.
- source_word: λήμψονται
  choice: ang matatanggap nila
  rationale: Inilalahad ang inaasahan nila mula sa pananaw ng nakaraang salaysay, kaya ang anyong kontemplatibo ay likas sa Tagalog.
- source_word: τὸ ἀνὰ δηνάριον
  choice: tig-iisang denario
  rationale: Ang ἀνά na may accusative ay distributibo, kaya malinaw na bawat isa ay tumanggap ng isang denario.
- source_word: καὶ αὐτοί
  choice: tumanggap din sila
  rationale: Pinananatili ng “din sila” ang diin na ang unang pangkat ay tumanggap ng kaparehong bayad gaya ng iba.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “denario” bilang kinikilalang katawagan sa sinaunang salapi, at ang “tig-iisang” upang natural na maipahayag ang distributibong diwa.
