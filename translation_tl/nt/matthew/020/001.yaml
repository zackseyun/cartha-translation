  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: tl
  text: Sapagkat ang kaharian ng langit ay katulad ng isang lalaki, isang may-ari ng bahay, na lumabas nang maagang-maaga sa umaga upang umupa ng mga manggagawa para sa kanyang ubasan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: isang lalaking may-ari ng sambahayan
  rationale: Pinananatili ang tahasang ἀνθρώπῳ (“isang lalaki”) at ang papel na ipinahihiwatig ng οἰκοδεσπότῃ, nang hindi nagiging mabigat ang salin.
- source_word: ἅμα πρωῒ
  choice: nang madaling-araw
  rationale: Likas na modernong Tagalog para sa paglabas sa pinakamaagang bahagi ng umaga.
- source_word: μισθώσασθαι ἐργάτας
  choice: upang umupa ng mga manggagawa
  rationale: Ipinahahayag ang layunin at bayad na paggawa na nasa pandiwang μισθόομαι.
- source_word: ἀμπελῶνα
  choice: ubasan
  rationale: Karaniwan at tiyak na katumbas ng vineyard sa Tagalog.
theological_decisions:
- issue: Ang paghahambing sa kaharian ng langit
  choice: ang kaharian ng langit ay tulad ng isang lalaking may-ari ng sambahayan
  alternative: ang kaharian ng langit ay tulad ng nangyari sa isang may-ari ng sambahayan
  rationale: Pinananatili ang tuwirang anyo at bahagyang retorikal na tensiyon ng Griyego, na ikinakabit ang paghahambing sa tao bago ilahad ang kilos niya.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “sambahayan” upang katawanin ang saklaw ng οἶκος sa οἰκοδεσπότης, at iniwasan ang mas kolokyal na “amo ng bahay.”
