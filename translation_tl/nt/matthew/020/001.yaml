review_pass:
  verdict: revise
  source_fidelity: Ang draft ay wastong naghahatid ng pangunahing paghahambing, ang paglabas nang maaga, ang pagkuha ng mga manggagawa, at ang ubasan. Gayunman, ang “lalaking may-ari ng sambahayan” ay hindi likas na pagtutumbas sa ἀνθρώπῳ οἰκοδεσπότῃ at bahagyang malabo ang saklaw ng pagiging “may-ari.”
  naturalness: Ang “may-ari ng sambahayan” ay hindi karaniwang modernong Tagalog; mas natural ang “may-ari ng bahay.” Ang “nang madaling-araw” ay maaaring magpahiwatig ng bago sumikat ang araw, samantalang ἅμα πρωῒ ay mas malawak na “maagang-maaga sa umaga.”
  terminology: Pinanatili ang “kaharian ng langit,” “manggagawa,” at “ubasan,” na angkop at malinaw. Ang “isang lalaki, isang may-ari ng bahay” ay nagpapanatili sa parehong ἀνθρώπῳ at οἰκοδεσπότῃ nang hindi isinasakripisyo ang natural na Tagalog.
  issues:
  - severity: medium
    issue: Hindi likas at bahagyang malabong parirala ang “lalaking may-ari ng sambahayan.”
    rationale: Ang οἰκοδεσπότης ay may-bahay o pinuno/may-ari ng sambahayan. Sa modernong Tagalog, ang “may-ari ng bahay” ang mas malinaw at idiomatiko; ang appositional na “isang lalaki, isang may-ari ng bahay” ay naghahatid din ng ἀνθρώπῳ.
  - severity: low
    issue: Masyadong tiyak ang “nang madaling-araw.”
    rationale: Ang ἅμα πρωῒ ay “maaga sa umaga,” hindi kinakailangang madaling-araw bago magbukang-liwayway. Ang “maagang-maaga sa umaga” ay mas tumpak at nananatiling natural.
  revised_text: Sapagkat ang kaharian ng langit ay katulad ng isang lalaki, isang may-ari ng bahay, na lumabas nang maagang-maaga sa umaga upang umupa ng mga manggagawa para sa kanyang ubasan.
