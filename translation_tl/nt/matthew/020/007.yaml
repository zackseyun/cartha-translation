    issue: Maaaring malabo ang “walang umupa sa amin.”
    rationale: Sa modernong Filipino, ang “umupa sa amin” ay maaari ring mangahulugang may nangupahan ng isang bagay o lugar mula sa nagsasalita. Sa Griyego, malinaw na ang mga tao mismo ang inupahan para magtrabaho. Ang “walang kumuha sa amin bilang manggagawa” ay inaalis ang kalabuan.
  revised_text: Sumagot sila sa kanya, “Dahil walang kumuha sa amin bilang manggagawa.” Sinabi niya sa kanila, “Pumunta rin kayo sa ubasan.”
