base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: tl
  text: Sumagot sila sa kanya, “Dahil walang kumuha sa amin bilang manggagawa.” Sinabi niya sa kanila, “Pumunta rin kayo sa ubasan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Sumagot sila
  rationale: Bagaman literal na “sinasabi nila,” gamit ito bilang makasaysayang pangkasalukuyan sa salaysay. Ang “sumagot sila” ay likas sa modernong Tagalog at malinaw na ipinakikitang tugon ito sa naunang tanong.
- source_word: Ὅτι
  choice: Dahil
  rationale: Ipinakikilala ng ὅτι dito ang dahilan kung bakit naroon pa sila; natural at tumpak ang “Dahil” sa tuwirang sagot.
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: walang umupa sa amin
  rationale: Ang μισθόομαι ay tumutukoy sa pag-upa ng mga manggagawa. Karaniwang ekspresyon sa Filipino ang “umupa sa amin” at sapat na ipinahihiwatig ang pagkuha sa kanila para magtrabaho.
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ang makasaysayang pangkasalukuyan ay ginawang pangnagdaan upang maging maayos at likas ang daloy ng salaysay sa Tagalog nang hindi binabago ang kahulugan.
- source_word: Ὑπάγετε
  choice: Pumunta
  rationale: Tuwirang utos itong magtungo sa lugar ng gawain; malinaw at natural ang “Pumunta.”
- source_word: καὶ ὑμεῖς
  choice: rin kayo
  rationale: Pinananatili ng “rin kayo” ang diwa ng pagsama sa grupong ito sa mga nauna nang pinapunta.
- source_word: ἀμπελῶνα
  choice: ubasan
  rationale: Ang “ubasan” ang karaniwan at tumpak na katumbas sa Tagalog ng vineyard.
