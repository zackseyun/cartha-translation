translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang pangnagdaan para sa dalawang makasaysayang pangkasalukuyan ng Griyego upang maging tuloy-tuloy ang salaysay. Walang talababa dahil hindi kailangang ilantad ang aspektong ito para maunawaan ang talata.
