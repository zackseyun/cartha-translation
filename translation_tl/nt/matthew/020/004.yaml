  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: tl
  text: At sinabi niya sa kanila, “Pumunta rin kayo sa ubasan, at ibibigay ko sa inyo ang anumang nararapat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang tama,” “anumang makatarungan,” o “anumang patas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: sa kanila
  rationale: Likas na panghalip sa Tagalog para sa datibong maramihan na tumutukoy sa mga manggagawang kababanggit lamang.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Karaniwang salin sa salaysay at malinaw na panimula sa tuwirang sinabi.
- source_word: Ὑπάγετε
  choice: Pumunta
  rationale: Tuwirang pautos na angkop sa pagpapapunta sa ubasan; hindi kailangang idagdag ang diwang 'umalis.'
- source_word: καὶ ὑμεῖς
  choice: rin kayo
  rationale: 'Pinananatili ang inklusibo at madiing diwa: sila man, tulad ng mga nauna, ay papupuntahin.'
- source_word: ἀμπελῶνα
  choice: ubasan
  rationale: Karaniwan, malinaw, at likas na katumbas ng lugar na tinataniman ng ubas.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ang anumang nararapat
  rationale: Ipinahahayag ang anumang naaayon sa tama o katarungan nang hindi nililimitahan ang salita sa legal na kahulugan o sa makabagong pansariling ideya ng pagiging patas.
- source_word: δώσω ὑμῖν
  choice: ibibigay ko sa inyo
  rationale: Pinananatili ang payak na pandiwang 'magbigay' sa Griyego; malinaw pa rin sa konteksto na kabayaran ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng δίκαιον sa konteksto ng kabayaran
  choice: nararapat
  alternative: tama; makatarungan; patas
  rationale: Ang 'nararapat' ay natural sa pangako tungkol sa kabayaran at pinananatili ang moral na diwa ng kung ano ang tama o makatarungan, nang hindi ginagawang tahasang legal o pansariling pagtataya lamang ang salita.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “ubasan” bilang pamilyar na terminong biblikal at pang-araw-araw. Inilagay ang talababa pagkatapos ng buong sinabi upang linawin ang saklaw ng mga alternatibong salin para sa “nararapat.”
