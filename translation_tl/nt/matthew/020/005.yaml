  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: tl
  text: At umalis sila. Muli siyang lumabas nang bandang ikaanim at ikasiyam na oras[a] at gayundin ang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, bandang tanghali at alas-tres ng hapon ayon sa paraan ng mga Hudyo sa pagbilang ng oras.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Kaya umalis sila
  rationale: Ang οἱ ay tumutukoy sa mga manggagawang kinausap sa naunang talata; ang δέ ay banayad na pang-ugnay, at natural dito ang “kaya.” Tuwirang ipinahahayag ng “umalis” ang ἀπῆλθον.
- source_word: πάλιν
  choice: Muli
  rationale: Malinaw nitong pinananatili ang diwa ng paulit-ulit na pagkilos.
- source_word: ἐξελθὼν
  choice: siyang lumabas
  rationale: Isinama sa likas na ayos ng pangungusap sa Tagalog ang aorist participle nang hindi labis na nililinaw kung ito ay kasabay o bahagyang nauna sa pangunahing kilos.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: nang bandang ikaanim at ikasiyam na oras
  rationale: Ang “bandang” ay natural na katumbas ng περὶ, samantalang pinananatili ang sinaunang paraan ng pagbilang ng oras; ipinaliliwanag sa talababa ang modernong katumbas.
- source_word: ἐποίησεν ὡσαύτως
  choice: gayundin ang ginawa niya
  rationale: Natural at malinaw na Tagalog ito para sa magkaugnay na ἐποίησεν at ὡσαύτως, at ipinauunawa na inulit niya ang naunang ginawa nang hindi nagdaragdag ng detalye.
