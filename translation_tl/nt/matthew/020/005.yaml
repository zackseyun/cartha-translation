translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili sa pangunahing teksto ang sinaunang pagtukoy sa oras upang mapangalagaan ang anyo at kulturang pinagmulan, habang ibinigay sa talababa ang katumbas na modernong oras.
