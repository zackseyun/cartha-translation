    issue: Ang “Kaya” ay mas malakas kaysa sa δέ.
    rationale: Ang δέ ay karaniwang banayad na pang-ugnay sa salaysay, hindi kinakailangang nagsasaad ng resulta. Ang “At” ay umiiwas sa pagdaragdag ng ugnayang sanhi-bunga.
  - severity: low
    issue: Maaaring gawing mas makabago ang katawagan sa talababa.
    rationale: Ang “mga Hudyo” ay mas karaniwang kontemporaryong Filipino para sa Jewish/Jews, habang hindi nagbabago ang kahulugan ng paliwanag.
  revised_text: At umalis sila. Muli siyang lumabas nang bandang ikaanim at ikasiyam na oras[a] at gayundin ang ginawa niya.
