  verdict: revise
  source_fidelity: Ang pangunahing diwa ay tapat sa Griyego. Gayunman, ang “Kaya” ay maaaring magpahiwatig ng bunga o konklusyon na hindi taglay ng banayad na pang-ugnay na δέ; mas tumpak ang “At.” Napananatili ng “Muli siyang lumabas” ang πάλιν ἐξελθών, at ang “gayundin ang ginawa niya” ay wastong katumbas ng ἐποίησεν ὡσαύτως.
  naturalness: Malinaw at likas ang pangungusap sa makabagong Filipino. Ang “At umalis sila” ay kapwa natural at mas malapit sa mahinang naratibong pag-uugnay ng orihinal.
  terminology: Ang “ikaanim at ikasiyam na oras” ay angkop na pagpapanatili ng sinaunang pagtukoy sa oras. Sa talababa, “mga Hudyo” ang mas karaniwang makabagong anyo sa Filipino kaysa “mga Judio.”
  issues:
