  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: tl
  text: At habang umaalis sila mula sa Jerico, sumunod sa kanya ang isang malaking pulutong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: habang paalis sila
  rationale: Ang pangkasalukuyang participle na genitive plural ay gumaganap na panandang panahunan. Likas sa modernong Tagalog ang “habang paalis sila” at naipahihiwatig nito ang nagpapatuloy na kilos.
- source_word: ἀπὸ Ἰεριχὼ
  choice: sa Jerico
  rationale: Kasama ng “paalis,” sapat at natural ang “sa Jerico” upang ipahayag ang pinanggagalingang lugar; ang “paalis mula sa Jerico” ay mas mabigat sa Tagalog.
- source_word: ἠκολούθησεν
  choice: sumunod
  rationale: Karaniwang katumbas ito ng ἀκολουθέω sa konteksto ng paglakad kasunod ng isang tao, at ang aspektong ganap ng pandiwang Tagalog ay angkop sa aorist na salaysay.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang isahang panghalip ng Griyego, na sa konteksto ay tumutukoy kay Jesus, sa halip na pakinisin ito bilang maramihang “sa kanila.”
- source_word: ὄχλος πολύς
  choice: napakaraming tao
  rationale: Natural at malinaw itong paraan sa modernong Tagalog upang ipahayag ang isang napakalaking pulutong nang hindi gumagamit ng mas pormal o makalumang “karamihan.”
theological_decisions:
- issue: Ang tinutukoy ng isahang αὐτῷ pagkatapos ng maramihang αὐτῶν
  choice: Kay Jesus sumunod ang mga tao (“sa kanya”).
  alternative: Sa buong pangkat sumunod ang mga tao (“sa kanila”).
  rationale: Sadyang pinananatili ang paglipat ng tekstong Griyego mula sa maramihang “sila” tungo sa isahang “kanya,” na natural na nagtutuon kay Jesus bilang sinusundan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jerico,” ang karaniwang anyong Filipino ng pangalan. Hindi kinailangan ang talababa dahil naipahahayag nang natural ng “habang paalis sila sa Jerico” ang temporal na participle at paglayo mula sa lugar.
