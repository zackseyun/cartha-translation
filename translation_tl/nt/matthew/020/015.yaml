  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: tl
  text: Hindi ba malaya akong gawin ang gusto ko sa sarili kong pag-aari? O masama ba ang mata mo dahil mabuti ako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Naiinggit ka ba dahil mabuti ako?” Ang “masama ang mata mo” ay isang idyomang tumutukoy sa inggit o sa sama ng loob dahil sa kabutihang ipinakita sa iba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: maaari
  rationale: Ipinahihiwatig ng pandiwa ang pinahihintulutan o nararapat gawin. Ang “Hindi ba ako maaaring” ay natural sa modernong Tagalog at pinananatili ang diwa ng karapatan sa retorikal na tanong.
- source_word: ὃ θέλω ποιῆσαι
  choice: gumawa ng anumang nais ko
  rationale: Tuwirang ipinahahayag nito ang personal na kagustuhan, sa paraang natural at marangal sa Tagalog.
- source_word: ἐν τοῖς ἐμοῖς
  choice: sa ari-arian ko
  rationale: Sa konteksto ng talinghaga, tumutukoy ito sa mga bagay na pag-aari ng may-ari. Malinaw na naihahayag ng “ari-arian ko” ang pagmamay-ari.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: masama ba ang mata mo
  rationale: Pinananatili nito ang literal na larawang Griyego at ang kaibahan nito sa kabutihan ng nagsasalita; ipinapaliwanag sa talababa ang idyomatikong diwa.
- source_word: ἀγαθός
  choice: mabuti
  rationale: Ito ang tuwirang katumbas ng salita at pinananatili ang sadyang paghahambing ng “masamang mata” at “mabuti,” nang hindi agad nililimitahan ang kahulugan sa pagiging bukas-palad.
theological_decisions:
- issue: Kung bibigyang-kahulugan agad sa pangunahing teksto ang idyomang ὁ ὀφθαλμός σου πονηρός
  choice: Panatilihin ang literal na idyomang “masama ba ang mata mo” sa pangunahing teksto
  alternative: “Naiinggit ka ba dahil mabuti ako?”
  rationale: Pinananatili ng literal na anyo ang imahen at tensiyon ng orihinal sa pagitan ng masamang mata ng manggagawa at kabutihan ng may-ari. Inilalahad sa talababa ang malamang na idyomatikong kahulugan upang maging malinaw sa modernong mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang retorikal na anyo at ang konkretong imahen ng “masamang mata,” habang ipinaliwanag sa talababa ang idyoma.
