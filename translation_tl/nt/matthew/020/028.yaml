  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: tl
  text: kung paanong ang Anak ng Tao ay hindi naparito upang siya’y paglingkuran, kundi upang maglingkod at ibigay ang kanyang buhay bilang pantubos para sa marami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, mas tahasan, “bilang pantubos kapalit ng marami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: kung paanong
  rationale: Ipinakikita ang paghahambing sa naunang turo at natural itong pakinggan sa makabagong Tagalog.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng titulong ginagamit ni Jesus para sa sarili; pinananatili nito ang kaugnayan sa Daniel 7.
- source_word: οὐκ ἦλθεν
  choice: hindi naparito
  rationale: Tuwirang ipinahahayag ang pagdating; ang unlaping “pa-” ay likas sa Tagalog sa kontekstong ito nang hindi nagdaragdag ng tiyak na lugar.
- source_word: διακονηθῆναι
  choice: upang paglingkuran
  rationale: Pinananatili ang balintiyak na anyo at gumagamit ng karaniwang salita sa halip na terminong pansimbahan.
- source_word: ἀλλὰ διακονῆσαι
  choice: kundi upang maglingkod
  rationale: Pinananatili ang malinaw na kasalungat ng “paglingkuran” at ang aktibong diwa ng pandiwa.
- source_word: καὶ δοῦναι
  choice: at ibigay
  rationale: Kapantay na pawatas ito ng “maglingkod” at tuwirang ipinapahayag ang kusang pagbibigay.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ang kanyang buhay
  rationale: Sa konteksto, ang ψυχή ay ang buhay na ibinibigay hanggang kamatayan, hindi lamang ang di-materyal na kaluluwa.
- source_word: λύτρον
  choice: pantubos
  rationale: Tumutukoy sa halagang ibinabayad upang mapalaya ang isang tao; maikli, malinaw, at nakaugat sa karaniwang gamit sa Tagalog.
- source_word: ἀντὶ πολλῶν
  choice: para sa marami
  rationale: Natural na Tagalog na nagpapanatili sa diwang kapakinabangan o pagkatawan; inilalahad sa talababa ang mas tahasang diwang pamalit ng ἀντί.
theological_decisions:
- issue: Lakas ng ἀντί sa pahayag tungkol sa pantubos
  choice: “para sa marami” sa pangunahing teksto
  alternative: “kapalit ng marami”
  rationale: May diwang pamalit o pagpapalit ang ἀντί. Natural ang “para sa marami” sa pangunahing teksto, habang pinananatili ng talababa ang mas tahasang posibleng kahulugan nang hindi ipinipilit ang isang paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang magkatapat na “paglingkuran” at “maglingkod,” gayundin ang kinikilalang titulong “Anak ng Tao.” Inilagay ang tandang [a] pagkatapos ng pariralang tinutukoy nito, ang “para sa marami.”
