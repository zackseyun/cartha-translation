review_pass:
  verdict: revise
  source_fidelity: Tumpak na naisasalin ng draft ang paghahambing na ὥσπερ, ang titulong “Anak ng Tao,” ang magkasalungat na layunin ng διακονηθῆναι at διακονῆσαι, at ang “buhay” para sa ψυχή sa kontekstong ito. Ang “pantubos para sa marami” ay idiomatiko at ang talababa ay wastong nagtatala ng mas tahasang puwersang pamalit ng ἀντί.
  naturalness: Marangal at modernong Tagalog ang kabuuan. Gayunman, ang hubad na “upang paglingkuran” ay maaaring mabasa bilang aktibong “upang maglingkod sa [isang tao],” dahil walang malinaw na tagaganap o tumatanggap. Ang pagdaragdag ng “siya’y” ay natural at nililinaw ang balintiyak na “upang siya’y paglingkuran.”
  terminology: Ang “Anak ng Tao,” “maglingkod,” “buhay,” at “pantubos” ay angkop, pare-pareho, at hindi mapagpasyang doktrinal. Pinananatili ng talababa ang lexical na lakas ng ἀντί nang hindi ito ipinipilit sa pangunahing teksto.
  issues:
  - severity: medium
    issue: Hindi ganap na malinaw ang balintiyak na “upang paglingkuran.”
    rationale: Ang διακονηθῆναι ay “upang paglingkuran siya / upang siya ay paglingkuran.” Sa Tagalog, ang “paglingkuran” na walang ipinahahayag na layon ay maaaring maunawaang aktibo. Ang “siya’y” ay ligtas na paglilinaw ng implicit na paksa ng Griyegong passive.
  revised_text: kung paanong ang Anak ng Tao ay hindi naparito upang siya’y paglingkuran, kundi upang maglingkod at ibigay ang kanyang buhay bilang pantubos para sa marami.[a]
