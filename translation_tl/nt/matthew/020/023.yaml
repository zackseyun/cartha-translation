  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Iinumin nga ninyo ang aking kopa,[a] ngunit hindi sa akin ang ipagkaloob ang pag-upo sa aking kanan at sa aking kaliwa,[b] kundi para sa mga pinaghandaan na ng aking Ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kopa” ay larawang tumutukoy sa pagdurusa o kapalarang itinakda para kay Jesus, na mararanasan din ng kanyang mga alagad.
    reason: cross_reference
  - marker: b
    text: Sa literal, “ibigay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Bagaman nasa historikal na pangkasalukuyan ang pandiwang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Iinumin nga ninyo ang aking kopa
  rationale: Pinanatili ang larawan ng “kopa” at hindi ito ipinaliwanag sa pangunahing teksto. Ipinahihiwatig ng “nga” ang pagpapatibay na kaakibat ng μὲν bago ang kasunod na pagsalungat.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: ang maupo sa aking kanan at sa aking kaliwa
  rationale: Natural itong pahayag sa Tagalog para sa mga puwesto sa magkabilang tabi ni Jesus, na sa konteksto ay mga lugar ng karangalan.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ay hindi sa akin ang ipagkaloob
  rationale: Pinananatili nito ang tuwirang diwa na ang pagbibigay ng mga puwestong iyon ay hindi kay Jesus, habang ang “ipagkaloob” ay angkop sa konteksto ng pagtatalaga ng karangalan.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: kundi para iyon sa mga pinaghandaan nito
  rationale: Tambilugan ang Griyego; idinagdag ang “para iyon” at “nito” upang maging malinaw sa Tagalog nang hindi tinutukoy nang higit sa sinasabi ng teksto kung ano mismo ang inihanda.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: ng aking Ama
  rationale: Tuwirang ipinapahayag ang Ama bilang gumawa ng paghahanda; walang idinagdag na “lamang,” sapagkat wala iyon sa Griyego.
theological_decisions:
- issue: Ang implikasyong kristolohikal ng “hindi sa akin ang ipagkaloob”
  choice: Tuwirang pinanatili ang pahayag ni Jesus nang walang paliwanag na naglilimita o nagpapalabnaw rito.
  alternative: Dagdagan ng pariralang gaya ng “nang hiwalay sa Ama” o muling ipahayag upang alisin ang tensiyong teolohikal.
  rationale: Hindi nilulutas ng salin ang tensiyong nasa mismong teksto. Iniiwasan nitong magpasok ng paliwanag na wala sa Griyego.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Pinanatili ang metapora ng kopa, ang mga puwesto sa kanan at kaliwa, at ang teolohikal na tensiyon ng pahayag. Inilagay ang mga talababa sa mga salitang aktuwal nilang ipinapaliwanag.
