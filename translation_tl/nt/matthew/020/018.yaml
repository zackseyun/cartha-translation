id: MAT.20.18
reference: Matthew 20:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: tl
  text: “Narito[a], aakyat tayo sa Jerusalem, at ang Anak ng Tao[b] ay isusuko[c] sa mga punong pari at mga eskriba. Hahatulan nila siya ng parusang kamatayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Masdan ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ng Tao” ay natatanging katawagan ni Jesus sa kanyang sarili at maaaring alusyon sa Daniel 7:13–14.
    reason: cross_reference
  - marker: c
    text: Maaari ring isalin na “ibibigay sa kapangyarihan ng iba”; sa mas makitid na konteksto, ang pandiwa ay maaari ring mangahulugang “ipagkakanulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pinananatili ang tungkuling tumawag ng pansin sa natural at madaling maunawaang modernong Tagalog. Hindi ito nililimita sa literal na pagtingin lamang sa isang bagay.
- source_word: ἀναβαίνομεν
  choice: aakyat tayo
  rationale: Ipinapahayag ang kasalukuyang paglalakbay na patungo sa Jerusalem at pinananatili ang diwa ng pag-akyat, na angkop kapuwa sa heograpiya at sa nakaugaliang pananalita tungkol sa pagpunta roon.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa Tagalog.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng natatanging pagtukoy ni Jesus sa sarili; pinananatili rin nito ang posibleng kaugnayan sa Daniel 7:13–14.
- source_word: παραδοθήσεται
  choice: ay isusuko
  rationale: Ipinahihiwatig ang paglalagay sa kanya sa kapangyarihan o pag-iingat ng iba nang hindi agad nililimitahan ang kahulugan sa pagtataksil ni Judas.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: sa mga punong pari
  rationale: Tumutukoy sa mga pangunahing pinunong pari, hindi lamang sa nag-iisang pinakapunong pari.
- source_word: γραμματεῦσιν
  choice: mga tagapagturo ng Kautusan
  rationale: Mas malinaw sa karaniwang modernong mambabasa kaysa “mga eskriba” at ipinapahayag ang kinikilalang papel ng pangkat na ito sa konteksto.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: Hahatulan nila siya ng kamatayan
  rationale: Natural na legal na pahayag sa Tagalog para sa paghatol na kamatayan ang kaparusahan.
theological_decisions:
- issue: Pagsasalin sa kristolohikal na katawagang ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Makataong Isa
  rationale: Pinananatili ang tradisyonal at tekstuwal na anyo ng sariling pagtukoy ni Jesus at ang posibleng alusyon sa Daniel nang hindi ito ginagawang pangkalahatang tawag lamang sa isang tao.
- issue: Saklaw ng kahulugan ng παραδοθήσεται
  choice: ay isusuko
  alternative: ay ipagkakanulo
  rationale: Ang “isusuko” ay nagpapanatili sa malawak na diwa ng paglilipat sa kapangyarihan ng mga kalaban; ang “ipagkakanulo” ay maaaring magtakda nang labis sa mas makitid na kilos ng isang taksil.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “tayo” dahil kasama ni Jesus ang kanyang mga kausap sa pag-akyat sa Jerusalem. Hinati sa dalawang pangungusap upang maging natural ang daloy sa Tagalog habang pinananatili ang lohikal na pagkakaugnay ng mga sugnay.
