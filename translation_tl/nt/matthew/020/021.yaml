- from: At sinabi niya sa kanya, “Ano ang gusto mo?” Sinabi nito sa kanya, “Ipag-utos mong[a] maupo ang dalawang anak kong ito—isa sa kanan mo at isa sa kaliwa mo—sa iyong kaharian.”[b]
  to: At sinabi niya sa kanya, “Ano ang gusto mo?” Sinabi naman niya sa kanya, “Sabihin mong maupo ang dalawang anak kong ito—isa sa kanan mo at isa sa kaliwa mo—sa iyong kaharian.”[a]
  rationale: Ibinalik ang Εἰπὲ sa mas tuwirang “Sabihin mong,” alinsunod sa Griyego at sa audit trail, habang pinanatiling likas ang kasunod na sugnay na “maupo.” Inayos din ang panghalip sa ikalawang sugnay ng salaysay. Dahil hindi na kailangan ang talababa upang ipagtanggol ang mas interpretibong “ipag-utos,” inalis ito at muling itinalaga ang natitirang talababa sa “kaharian.”
