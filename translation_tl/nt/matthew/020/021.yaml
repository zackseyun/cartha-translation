  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ano ang gusto mo?” Sinabi naman niya sa kanya, “Sabihin mong maupo ang dalawang anak kong ito—isa sa kanan mo at isa sa kaliwa mo—sa iyong kaharian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaharian” ay maaari ring tumukoy sa “paghahari” o “maharlikang pamamahala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Ano ang gusto mo?
  rationale: Direkta at natural itong tanong sa makabagong Tagalog tungkol sa kahilingang nais niyang iharap; hindi nito pinapormal nang labis ang θέλεις.
- source_word: Εἰπὲ
  choice: Ipag-utos mong
  rationale: Ang literal na diwa ng pandiwa ay “sabihin mo,” ngunit sa kasunod na ἵνα-clause humihiling ang babae ng makapangyarihang pasiya o utos mula kay Jesus. Natural sa Tagalog ang “ipag-utos mong” sa ganitong pakiusap, habang itinatala sa talababa ang mas literal na anyo.
- source_word: ἵνα καθίσωσιν
  choice: maupo
  rationale: Ipinahahayag ng sugnay ang nilalaman ng kahilingan—na mabigyan ang mga anak niya ng mga puwesto. Ang “maupo” ay likas at hindi nagpapahiwatig nang higit sa hinihingi ng Griyego.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: ang dalawang anak kong ito
  rationale: Pinananatili ng “ito” ang demonstratibong οὗτοι at natural na ipinapahayag ng “anak kong” ang personal na kaugnayan ng μου.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: isa sa kanan mo at isa sa kaliwa mo
  rationale: Malinaw at magkatimbang na salin ito ng mga puwesto sa kanan at kaliwa, na mga lugar ng karangalan sa kontekstong maharlika.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: sa iyong kaharian
  rationale: Ang “kaharian” ang pinakanatural at kinikilalang katumbas sa konteksto, ngunit hindi nito dapat alisin ang posibleng diin ng βασιλεία sa paghahari o pamamahalang maharlika.
theological_decisions:
- issue: Ang kahulugan ng pag-upo sa kanan at kaliwa ni Jesus kaugnay ng kanyang pagkahari
  choice: Isinalin bilang mga puwesto sa kanan at kaliwa “sa iyong kaharian,” nang hindi tinutukoy kung anong yugto o anyo ng kaharian ang nasa isip.
  alternative: Tukuyin ito bilang makalupang kaharian ng Mesiyas o bilang ganap na kaharian sa langit.
  rationale: Hindi nililinaw ng Griyego kung makalupa o makalangit na katuparan ang tinutukoy. Pinananatili ng salin ang maharlika at marangal na larawan nang hindi nagpapasok ng isang tiyak na sistemang eskatolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanan mo” at “kaliwa mo” sa halip na mas mabigat na “sa iyong kanan/kaliwa,” at em dash upang malinaw na maipakita ang magkatimbang na mga puwesto.
