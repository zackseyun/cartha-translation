base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: tl
  text: Pagsapit ng gabi, sinabi ng may-ari ng ubasan sa kanyang katiwala, “Tawagin mo ang mga manggagawa at ibigay mo sa kanila ang sahod, simula sa mga huli hanggang sa mga una.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Pagsapit ng gabi
  rationale: Natural at maikli sa modernong Tagalog, habang pinananatili ang temporal na diwa ng parirala.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ang may-ari ng ubasan
  rationale: Sa konteksto ng talinghaga, tumutukoy ito sa taong may kapangyarihan sa ubasan; ang “may-ari” ay malinaw at likas kaysa literal na “panginoon.”
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: sa kanyang katiwala
  rationale: Ang ἐπίτροπος ay tagapangasiwa o katiwalang pinagkatiwalaang mamahala at magbayad sa mga manggagawa.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: ibigay sa kanila ang kanilang sahod
  rationale: Ipinahahayag ang pagbabayad ng nararapat na upa o sahod sa mga manggagawa sa natural na Tagalog.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: simula sa mga huling dumating hanggang sa mga nauna
  rationale: Nililinaw mula sa konteksto na ang “huli” at “una” ay ang pagkakasunod ng pagdating o pagkuha sa trabaho, hindi ranggo o halaga ng mga tao.
theological_decisions:
- issue: Makasaysayang kasalukuyan sa λέγει (“sinasabi”)
  choice: sinabi
  alternative: sinabi niya / sinabi ng may-ari ...; o “sinasabi”
  rationale: Ang aoristic na salaysay sa Tagalog ay likas na gumagamit ng “sinabi.” Hindi nito binabago ang pangyayari o kahulugan; iniiwasan lamang ang di-likas na biglang paglipat sa kasalukuyang panahunan.
- issue: Pagpapakahulugan sa κύριος bilang titulo
  choice: may-ari
  alternative: panginoon
  rationale: Dito, ang κύριος ay papel ng taong namamahala o nagmamay-ari ng ubasan sa loob ng talinghaga, hindi tahasang banal na titulo. Iniiwasan nitong magpasok ng teolohikal na pagkakakilanlan na hindi tahasang isinasaad sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Gumamit ng “katiwala,” “manggagawa,” at “sahod,” na karaniwan ngunit angkop sa pormal na salaysay. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na nangangailangan nito sa mismong talata.
