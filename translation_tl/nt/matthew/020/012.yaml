  terminology: Ang “ipinantay ninyo sila sa amin” ay mahusay na katumbas ng ἴσους ... ἐποίησας. Ang “matinding init” ay angkop para sa καύσων. Pinalitan ang “bigat ng maghapong trabaho” ng “pasanin ng maghapon” upang mas malapit na mapanatili ang metapora ng βάρος nang walang di-kinakailangang pagdaragdag.
