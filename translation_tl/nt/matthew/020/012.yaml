base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: tl
  text: na nagsasabi, “Ang mga huling ito ay isang oras lang nagtrabaho, ngunit ipinantay ninyo sila sa amin[a] na nagdala ng pasanin ng maghapon at nagtiis sa matinding init.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinuring ninyo silang kapantay namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsasabi
  rationale: Pinananatili nito ang anyong participle at ang pagkakaugnay ng talata sa naunang sugnay, habang natural pa rin sa salaysay na Filipino.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Itong mga huli
  rationale: Tumutukoy ito sa mga manggagawang nahuling dumating o kinuha; pinananatili ng maikling salin ang mariing paghahambing nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: μίαν ὥραν ἐποίησαν
  choice: isang oras lang nagtrabaho
  rationale: Sa ganitong konteksto, ang ποιέω kasama ng haba ng panahon ay tumutukoy sa pagtatrabaho sa loob ng panahong iyon. Ipinahahayag ng “lang” ang reklamo at likas na diin ng pagkakasalungat.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: ipinantay ninyo sila sa amin
  rationale: Direkta at natural nitong ipinahahayag ang paggawa sa kanila na kapantay ng mga nagsasalita, at pinananatili ang puwersa ng kanilang reklamo.
- source_word: τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας
  choice: na nagtiis sa bigat ng maghapong trabaho
  rationale: Saklaw ng βαστάζω ang pagdadala at pagtitiis. Pinananatili ng “bigat” ang larawan ng βάρος, samantalang nililinaw ng “maghapong trabaho” ang likas na kahulugan sa konteksto ng mga manggagawa.
- source_word: τὸν καύσωνα
  choice: sa matinding init
  rationale: Ang καύσων ay mapanupil o nakapapasong init; malinaw at natural sa modernong Filipino ang “matinding init.”
theological_decisions:
- issue: Reklamo sa talinghaga tungkol sa pagkakapantay-pantay at pagiging makatarungan
  choice: Tuwirang isinalin ang protesta ng mga manggagawa bilang “ipinantay ninyo sila sa amin.”
  alternative: Gawing tahasang paratang ng di-makatarungang pagtrato.
  rationale: Iniuulat ng talata ang reklamo ng mga manggagawa ngunit hindi nito tahasang binibigyang-hatol ang may-ari. Kaya pinananatili ang tensiyon ng talinghaga nang hindi ipinapasok sa salin ang isang teolohikal na konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magalang na pangmaramihang “ninyo” para sa pakikipag-usap ng mga manggagawa sa may-ari. Ang “na nagsasabi” ay sadyang nag-uugnay sa naunang salaysay.
