  rationale: Inayos ang daloy sa modernong Tagalog sa pamamagitan ng pag-alis ng hindi kailangang unang pangatnig at pagpapalit ng “para” ng bahagyang mas pormal ngunit natural na “upang.” Inilipat ang pananda ng talababa b upang tuwirang tumukoy sa “Anak ni David.” Walang binago sa kahulugan o sa sinadyang ambigwidad ng Griyego.
