  naturalness: Natural at marangal ang Tagalog, ngunit mas maayos ang daloy kung aalisin ang magkakasunod na “Ngunit ... Pero.” Mas malinaw ding ilagay ang talababa ng titulo mismo sa “Anak ni David.”
