id: MAT.20.31
reference: Matthew 20:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: tl
  text: Sinaway sila ng mga tao upang patahimikin sila. Ngunit lalo pa silang sumigaw[a], “Panginoon, maawa kayo sa amin, Anak ni David[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mas malakas silang sumigaw.” Maaaring tumukoy ang pahambing na salitang Griyego sa higit na tindi sa pangkalahatan o, mas tiyak, sa mas malakas na boses.
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ni David” ay isang mesiyanikong titulo, hindi lamang pahayag tungkol sa angkan.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Sa tagpong ito, tumutukoy ito sa nagkakatipong karamihan. Ang “mga tao” ang pinakanatural na makabagong Tagalog; naipahihiwatig na ng konteksto na sila ay isang pulutong.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ipinahahayag ng “sinaway” ang matindi at tahasang pagsita ng mga tao nang hindi dinaragdagan ang sinabi ng Griyego.
- source_word: ἵνα σιωπήσωσιν
  choice: para patahimikin sila
  rationale: Pinananatili nito ang layunin ng pagsaway at natural itong mababasa sa kasalukuyang Tagalog.
- source_word: μεῖζον
  choice: lalo pa
  rationale: Ang pahambing na anyo ay nagpapalakas sa kasunod na pagsigaw ngunit hindi tiyak kung lakas ng boses lamang ang tinutukoy; pinananatili ng “lalo pa” ang lawak na iyon.
- source_word: ἔκραξαν
  choice: sumigaw
  rationale: Malinaw at natural na katumbas ito ng malakas at apurahang pagtawag.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang magalang na pagtawag kay Jesus at ang maaaring mas malalim na kristolohikal na diwa ng titulo.
- source_word: ἐλέησον ἡμᾶς
  choice: maawa kayo sa amin
  rationale: Ito ang natural at marangal na pakiusap sa Tagalog para sa paghingi ng awa; ang “kayo” ay ang magalang na isahang pagtukoy kay Jesus.
- source_word: υἱὸς Δαυίδ
  choice: Anak ni David
  rationale: Literal nitong pinananatili ang kinikilalang mesiyanikong titulo sa Mateo sa halip na paliitin ito sa karaniwang pahayag lamang ng angkan.
theological_decisions:
- issue: Ang mesiyanikong titulong υἱὸς Δαυίδ na itinawag kay Jesus
  choice: Anak ni David
  alternative: inapo ni David
  rationale: Ang literal na titulo ay nagdadala ng maharlika at mesiyanikong pahiwatig sa salaysay ng Mateo; hindi ito dapat gawing payak na tala ng pinagmulan.
- issue: Ang κύριος bilang tuwirang pagtawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Ang “Panginoon” ay maaaring magpahayag kapwa ng magalang na pagtawag at ng mas malalim na kristolohikal na kabuluhan, kaya pinananatili nito ang tensiyon ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “para patahimikin sila” bilang malinaw na layunin ng pagsaway, at ang magalang na “kayo” sa pakiusap kay Jesus nang hindi nilulutas ang posibleng mas malalim na diwa ng “Panginoon.”
