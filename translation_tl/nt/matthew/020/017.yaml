  verdict: revise
  source_fidelity: Tumpak na naisasalin ng draft ang pag-akyat ni Jesus patungong Jerusalem, ang pagtukoy sa labindalawang alagad, at ang pagsasalita niya sa kanila habang naglalakbay. Gayunman, ang “isinama niya nang bukod sa iba” ay hindi likas na paraan upang ipahayag ang παρέλαβεν ... κατ’ ἰδίαν at malabo ang saklaw ng “bukod.”
  naturalness: Kailangan ng maliit ngunit mahalagang pag-aayos. Ang “isinama niya sa isang tabi” ay likas na modernong Filipino at malinaw na nagpapahiwatig na inilayo niya ang Labindalawa upang kausapin sila nang hiwalay.
  terminology: Ang “Jesus,” “Jerusalem,” at “labindalawang alagad” ay angkop at pare-pareho sa karaniwang gamit sa Filipino. Walang isyung teolohikal o pangalang pantangi.
