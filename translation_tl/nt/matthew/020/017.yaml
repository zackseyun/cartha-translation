  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: tl
  text: Habang umaakyat si Jesus patungong Jerusalem, isinama niya sa isang tabi ang labindalawang alagad, at habang nasa daan ay sinabi niya sa kanila,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: habang umaahon
  rationale: Ipinapahayag ng kasalukuyang pandiwaring Griyego ang kilos na kasabay ng pangunahing pandiwa. Pinananatili ng “umaahon” ang direksiyong paakyat patungong Jerusalem at natural ito sa salaysay.
- source_word: εἰς Ἱεροσόλυμα
  choice: patungong Jerusalem
  rationale: Likas sa Filipino ang “patungong” para sa paglalakbay tungo sa isang lungsod, at malinaw nitong ipinapakita ang destinasyon.
- source_word: παρέλαβεν
  choice: isinama niya
  rationale: Saklaw ng pandiwa ang pagkuha o pagsama sa isang tao. Ang diwang paghiwalay sa iba ay ipinahahayag ng kasunod na “nang bukod sa iba.”
- source_word: τοὺς δώδεκα μαθητὰς
  choice: ang labindalawang alagad
  rationale: Tahasang naroon sa tekstong Griyego ang μαθητάς, kaya hindi lamang “ang Labindalawa” ang ginamit. Ang “alagad” ang kinikilalang natural na katumbas sa kontekstong ito.
- source_word: κατ’ ἰδίαν
  choice: nang bukod sa iba
  rationale: Ipinahahayag ng parirala ang paghiwalay sa ibang mga tao upang makausap sila nang pribado, habang iniiwasan ang mabigat o di-likas na pagkakasabi.
- source_word: ἐν τῇ ὁδῷ
  choice: habang nasa daan
  rationale: Natural na Filipino ito na pinananatili ang tagpuan ng paglalakbay at ang kasabay na panahon ng pagsasalita.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwirang kinakatawan nito ang karaniwang pandiwa ng pagsasalita at iniiwang nakabukas ang nilalaman para sa susunod na talata.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang iisang dumadaloy na pangungusap at ang pangwakas na kuwit sapagkat nagpapatuloy sa susunod na talata ang sinabi ni Jesus.
