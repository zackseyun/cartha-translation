  source_fidelity: 'Tumpak na naisalin ang οὕτως bilang “Kaya,” ang futurong ἔσονται bilang “ay magiging,” at ang magkabalanseng substantival na parirala: “ang mga huli … una” at “ang mga una … huli.” Hindi nito nililimitahan ang saklaw ng pagbabaligtad, gaya ng nasa Griyego at English audit trail.'
  naturalness: 'Likas, malinaw, at marangal sa modernong Filipino Tagalog ang: “Kaya ang mga huli ay magiging una, at ang mga una ay magiging huli.” Ang ayos ay maigsi at mahusay na pinananatili ang retorikal na paralelismo ng kasabihan.'
  terminology: Ang “mga huli” at “mga una” ay angkop at neutral na katumbas ng οἱ ἔσχατοι at οἱ πρῶτοι. Hindi ginagamit ang mga terminong gaya ng “hamak” o “pinakamataas,” na magdaragdag ng interpretasyong wala sa teksto. Walang pangalan o natatanging terminong teolohikal na kailangang isaayos.
