  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: tl
  text: Kaya ang mga huli ay magiging una, at ang mga una ay magiging huli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Ipinakikilala nito ang pangwakas na aplikasyon o bunga ng talinghaga. Likas sa modernong Tagalog ang “Kaya” at pinananatili nito ang inferensiyal o resultang diwa.
- source_word: ἔσονται
  choice: ay magiging
  rationale: Tuwirang ipinahahayag ng anyong panghinaharap ng εἰμί ang magiging kalagayan.
- source_word: οἱ ἔσχατοι
  choice: ang mga huli
  rationale: Ginagamit bilang pangngalan ang pang-uri sa Griyego. Ang “mga huli” ay natural at hindi ito labis na binibigyang-kahulugang “mga hamak” o “pinakamababa.”
- source_word: πρῶτοι
  choice: una
  rationale: Pinananatili ang maikli at tuwirang paghahambing ng kasabihan.
- source_word: καὶ
  choice: at
  rationale: Payak na pag-uugnay ang nasa Griyego; ang “ngunit” ay magdaragdag ng tahasang pagsalungat na hindi nakasaad.
- source_word: οἱ πρῶτοι
  choice: ang mga una
  rationale: Pinananatili ang balanseng estruktura at malinaw na pagtutumbas sa “ang mga huli.”
- source_word: ἔσχατοι
  choice: huli
  rationale: Tuwirang kinukumpleto ang baligtarang pahayag at pinananatili ang paralelismo ng “una” at “huli.”
theological_decisions:
- issue: Saklaw ng pagbabaligtad sa kasabihan
  choice: Isinalin bilang maikli at pangkalahatang kasabihan tungkol sa pagbabaligtad, nang hindi tinutukoy kung ang “huli/una” ay tumutukoy sa pagkakasunod-sunod, katayuan, gantimpala, o kaligtasan.
  alternative: Tahasang ipakahulugan ito bilang pagbabaligtad ng katayuang panlipunan, gantimpala sa pagiging alagad, o kaayusan ng kaligtasan.
  rationale: Hindi nililimitahan ng mismong Griyego ang saklaw ng pahayag. Pinananatili ng salin ang tunay na teolohikal na tensiyon at hinahayaang ang konteksto ang gumabay sa pag-unawa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Pinanatili ang simetriya at matalas na anyo ng orihinal na kasabihan. Walang talababa dahil walang alternatibong kinakailangan upang maipaliwanag ang teksto.
