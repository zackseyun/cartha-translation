  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: tl
  text: Nang lumabas siya bandang ikatlong oras[a], nakita niya ang iba na nakatayong walang ginagawa[b] sa pamilihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bandang alas-nuwebe ng umaga.” Ang “ikatlong oras” ay batay sa pagbibilang ng mga oras sa maghapon mula sa pagsikat ng araw.
    reason: cultural_note
  - marker: b
    text: O “walang trabaho.” Inilalarawan ng salitang Griyego na hindi sila nagtatrabaho noon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: paglabas niya
  rationale: Likas na salaysay sa Tagalog para sa aorist participle at ipinapakitang nauna ang paglabas bago ang pagkakita.
- source_word: περὶ τρίτην ὥραν
  choice: nang mag-ikatlong oras
  rationale: Pinananatili ang sinaunang paraan ng pagbilang ng oras mula sa pagsikat ng araw; ang περὶ ay ipinahihiwatig ng anyong “mag-,” na nangangahulugang bandang oras na iyon.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Tuwirang katumbas ng payak na pandiwang αφηγηματικό; hindi dinaragdagan ng kahulugang gaya ng “napansin.”
- source_word: ἄλλους
  choice: ang iba
  rationale: Tumutugma sa substantival na pang-uri at hindi nagdaragdag ng kasariang hindi tahasang binanggit sa Griyego.
- source_word: ἑστῶτας
  choice: nakatayo
  rationale: Ipinahahayag ang stative force ng perfect participle bilang kalagayan o tindig ng mga tao.
- source_word: ἀγορᾷ
  choice: pamilihan
  rationale: Malinaw at likas na tawag sa pampublikong lugar ng bilihan at pagtitipon ng mga naghahanap ng trabaho.
- source_word: ἀργούς
  choice: walang ginagawa
  rationale: Likas na modernong Tagalog para sa pagiging hindi abala sa trabaho, nang hindi ipinapasok ang makabagong kategoryang pang-ekonomiya ng pagiging walang hanapbuhay.
