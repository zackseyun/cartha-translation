id: MAT.20.34
reference: Matthew 20:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: tl
  text: Nahabag si Jesus at hinipo niya ang kanilang mga mata. Agad silang nakakita[a], at sumunod sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “muli silang nakakita.” Ang pandiwang Griyego ay maaaring mangahulugang “magkaroon” o “muling magkaroon ng paningin” o, sa mas literal na diwa, “tumingala”; ngunit sa kontekstong ito, tumutukoy ito sa pagkakaroon ng paningin.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: Nahabag
  rationale: Ipinahahayag ng pandiwaring Griyego ang matindi at taos-pusong habag. Ang “nahabag” ay natural, malinaw, at marangal sa modernong Filipino.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; hindi kailangang lagyan ng mariing pagsalungat.
- source_word: ἥψατο
  choice: hinipo
  rationale: Sa konteksto ng pagpapagaling, tumutukoy ito sa pisikal na paghipo.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: ang kanilang mga mata
  rationale: Likas na paraan ito sa Filipino upang ipahayag ang layon ng paghipo, bagaman genitive ang anyo sa Griyego.
- source_word: εὐθέως
  choice: Agad na
  rationale: Pinananatili nito ang diin sa kagyat na bunga ng ginawa ni Jesus.
- source_word: ἀνέβλεψαν
  choice: nanumbalik ang kanilang paningin
  rationale: Sa konteksto ng pagpapagaling sa mga bulag, ang pandiwa ay tumutukoy sa pagtanggap o muling pagkakaroon ng paningin. Malinaw at natural ito sa Filipino habang inilalagay sa talababa ang tunay na saklaw ng salitang Griyego.
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sila sa kanya
  rationale: Pinananatili nito kapuwa ang literal na pagsunod kay Jesus at ang posibleng pahiwatig ng pagiging tagasunod, nang hindi ipinapalagay ang higit sa tahasang sinasabi ng talata.
theological_decisions:
- issue: Likas ng pagpapagaling na ipinahahayag ng ἀνέβλεψαν
  choice: Kagyat na nanumbalik ang kanilang paningin
  alternative: Tumingala sila o nagsimula lamang silang makakita
  rationale: Dahil bulag ang mga lalaki sa agarang konteksto at kasama ang εὐθέως, malinaw na inilalarawan ng salaysay ang tunay at kagyat na pagpapanumbalik ng paningin. Gayunman, hindi itinatago sa talababa ang leksikal na alternatibo.
- issue: Diwa ng ἠκολούθησαν αὐτῷ
  choice: sumunod sila sa kanya
  alternative: naging mga alagad niya sila
  rationale: Maaaring may pahiwatig ng pagiging alagad ang pandiwa, ngunit hindi tahasang tinutukoy ng talata ang lalim o tagal ng kanilang pagsunod.
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Ang “nahabag,” “hinipo,” at “nanumbalik ang kanilang paningin” ay madaling maunawaan ng karaniwang mambabasa at nananatiling malapit sa puwersa ng tekstong Griyego. Inilipat ang marker [a] sa pariralang tinutukoy nito, sa halip na ilagay pagkatapos ng pangalan ni Jesus.
