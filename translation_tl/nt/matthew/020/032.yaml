id: MAT.20.32
reference: Matthew 20:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: tl
  text: Huminto si Jesus, tinawag sila, at sinabi, “Ano ang gusto ninyong gawin ko para sa inyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: Huminto
  rationale: Ang aorist participle ng ἵστημι ay idyomatikong nagsasaad na tumigil si Jesus sa paglakad bago niya sila tawagin; natural at malinaw ang “huminto” sa makabagong Tagalog.
- source_word: ἐφώνησεν
  choice: tinawag
  rationale: Ang φωνέω ay maaaring mangahulugang tumawag o magpatawag. Sa konteksto, maikli at natural ang “tinawag” habang pinananatili ang tuwirang pagkilos ni Jesus.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ang panghalip na maramihan sa dalawang lalaking bulag sa agarang konteksto.
- source_word: Τί θέλετε
  choice: Ano ang gusto ninyo
  rationale: Tuwiran at pangkaraniwan sa modernong Tagalog ang pariralang ito, at tapat nitong ipinahahayag ang tanong tungkol sa kanilang nais.
- source_word: ποιήσω
  choice: gawin ko
  rationale: Ang aorist subjunctive pagkatapos ng θέλετε ay nagpapahayag ng gawaing nais nilang isagawa ni Jesus; natural itong isalin bilang “gawin ko.”
- source_word: ὑμῖν
  choice: para sa inyo
  rationale: 'Benefaktibo ang datibo rito: ang tinutukoy ay ang gagawin ni Jesus para sa kanilang kapakanan.'
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Tagalog, kasama ang pantukoy na “si” para sa personal na pangalan.
theological_decisions:
- issue: Himig at lakas ng tanong ni Jesus
  choice: “Ano ang gusto ninyong gawin ko para sa inyo?”
  alternative: “Ano ang ninanais ninyong gawin ko para sa inyo?”
  rationale: Pinananatili ng napiling anyo ang tuwiran at personal na paanyaya ng tanong nang hindi nagiging makaluma o labis na pormal. Hindi nito dinaragdagan o binabawasan ang teolohikal na pahiwatig ng teksto.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ninyo/inyo” bilang pangmaramihang pagtukoy sa dalawang lalaki, hindi bilang pormal na paggalang. Hindi kailangan ng talababa dahil malinaw at sapat na napapanatili sa pangunahing teksto ang kahulugan ng Griyego.
source_grounding:
  english_pob_role: consult_only
