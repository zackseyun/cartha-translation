  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: tl
  text: at ibibigay nila siya sa mga Hentil upang kutyain, hagupitin, at ipako sa krus; at sa ikatlong araw ay bubuhayin siyang muli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “muli siyang mabubuhay.” Pasibo ang pandiwang Griyego (“bubuhayin siyang muli”), isang karaniwang pahayag tungkol sa muling pagkabuhay na maaaring magpahiwatig na Diyos ang kumikilos.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: ibibigay nila siya
  rationale: Ipinapahayag ng παραδίδωμι ang pagsasalin ng isang tao sa kapangyarihan ng iba. Natural sa Tagalog ang “ibibigay nila siya” sa kontekstong ito at hindi nito idinaragdag ang mas tiyak na diwa ng pagtataksil.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa konteksto ng hula tungkol sa pagpapakasakit ni Jesus, tumutukoy ito sa mga hindi Judio, lalo na sa mga awtoridad na Romano, hindi sa mga bansa sa pangkalahatan.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: upang kutyain
  rationale: Ipinapakita ng εἰς kasama ng infinitive ang layunin o kahihinatnan. Ang “upang kutyain” ay malinaw, likas, at dignified na modernong Tagalog.
- source_word: μαστιγῶσαι
  choice: hagupitin
  rationale: Ang “hagupitin” ay malinaw na tumutukoy sa marahas at parusang pagpalo, at mas angkop dito kaysa sa pangkalahatang “paluin.”
- source_word: σταυρῶσαι
  choice: ipako sa krus
  rationale: Ito ang karaniwan at madaling maunawaang Tagalog para sa pagpatay sa pamamagitan ng pagpapako sa krus. Ang pinagsasaluhang layon na “siya” ay malinaw mula sa naunang sugnay.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Tuwirang pinananatili nito ang temporal na pahayag ng Griyego at natural ito sa Tagalog.
- source_word: ἐγερθήσεται
  choice: bubuhayin siyang muli
  rationale: Ang anyong pokus-sa-layon ay nagpapanatili sa pasibong diwa ng Griyego at nagpapahiwatig ng pagkilos ng Diyos nang hindi Siya tahasang idinaragdag bilang simuno. Nililinaw ng “muli” ang konteksto ng muling pagkabuhay.
theological_decisions:
- issue: Tinig ng pandiwa para sa muling pagkabuhay
  choice: bubuhayin siyang muli
  alternative: muli siyang mabubuhay
  rationale: Nasa future passive ang Griyegong ἐγερθήσεται. Pinananatili ng napiling salin ang pasibong anyo at ang posibleng pahiwatig ng pagkilos ng Diyos, habang ang alternatibo ay mas natural na mababasa bilang tahasang aktibo o kusang pagbangon.
translation_notes:
  register: Gumamit ng kasalukuyan, malinaw, at marangal na Tagalog. Pinanatili ang “Hentil” bilang pamilyar na katawagang biblikal, at ginamit ang tutuldok-kuwit upang malinaw na paghiwalayin ang pagpapakasakit at ang pangako ng muling pagkabuhay.
