revisions:
- from: Sapagkat dumating sa inyo si Juan sa daan ng katuwiran[a], ngunit hindi kayo naniwala sa kanya[b]. Subalit naniwala sa kanya ang mga maniningil ng buwis at ang mga prostituta. At kahit nakita ninyo ito, hindi pa rin kayo nagbago ng isip[c] kalaunan upang maniwala sa kanya.
  to: Sapagkat dumating sa inyo si Juan sa daan ng katuwiran[a], ngunit hindi kayo naniwala sa kanya[b]. Subalit naniwala sa kanya ang mga maniningil ng buwis at ang mga prostituta. Ngunit kayo, kahit nakita ninyo ito, ay hindi man lamang nagbago ng isip pagkatapos upang maniwala sa kanya[c].
