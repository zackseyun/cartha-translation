id: MAT.21.32
reference: Matthew 21:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: tl
  text: Sapagkat dumating sa inyo si Juan sa daan ng katuwiran[a], ngunit hindi kayo naniwala sa kanya[b]. Subalit naniwala sa kanya ang mga maniningil ng buwis at ang mga prostituta. Ngunit kayo, kahit nakita ninyo ito, ay hindi man lamang nagbago ng isip pagkatapos upang maniwala sa kanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa matuwid na paraan” o “sa landas ng katuwiran.” Maaaring tumukoy ang pariralang Griyego sa paraan ng pamumuhay at paglilingkod ni Juan o sa matuwid na daang ipinangaral niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi kayo nagtiwala sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang maniwala o magtiwala sa isang tao.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hindi man lamang kayo nagsisi pagkatapos upang maniwala sa kanya.” Hindi ang mas karaniwang μετανοέω ang ginamit dito kundi μεταμέλομαι, na higit na nagpapahiwatig ng pagbabago ng isip o panghihinayang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ Ἰωάννης πρὸς ὑμᾶς
  choice: Sapagkat dumating sa inyo si Juan
  rationale: Ang “sapagkat” ay nagpapakita ng paliwanag na kaugnay ng naunang pagsaway; ang “dumating sa inyo” ay tuwirang nagpapahayag ng paglapit ni Juan sa kanyang mga tagapakinig.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: sa daan ng katuwiran
  rationale: Pinananatili ang metapora ng ὁδός bilang “daan” at ang moral at maka-Diyos na diwa ng δικαιοσύνη bilang “katuwiran,” nang hindi ipinipirmi kung tumutukoy ito sa pamumuhay ni Juan o sa daang ipinangaral niya.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: hindi kayo naniwala sa kanya / naniwala sa kanya
  rationale: Ang πιστεύω na may datibo ay tumutukoy sa paniniwala o pagtitiwala sa isang tao. Ang “naniwala sa kanya” ay likas sa Filipino at hindi nagdaragdag ng pormulang “sumampalataya kay” na maaaring magpahiwatig ng higit sa tahasang sinasabi rito.
- source_word: τελῶναι
  choice: mga maniningil ng buwis
  rationale: Ito ang malinaw at karaniwang makabagong katumbas ng mga taong nangongolekta ng buwis.
- source_word: πόρναι
  choice: mga prostituta
  rationale: Tuwiran at nauunawaang makabagong katawagan ito na nagpapanatili sa panlipunan at moral na bigat ng salita nang hindi gumagamit ng malabong eupemismo.
- source_word: ἰδόντες
  choice: kahit nakita ninyo ito
  rationale: 'Ipinakikita ng “kahit” ang pagsalungat: nasaksihan nila ang pagtugon ng mga maniningil ng buwis at mga prostituta, ngunit hindi sila nagbago. Ang “ito” ay likas na tumutukoy sa naunang pangyayari.'
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: hindi pa rin kayo nagbago ng isip kalaunan
  rationale: Ang “hindi pa rin” ay nagdadala ng diin ng οὐδὲ, at ang “kalaunan” ay katumbas ng ὕστερον. Ang “nagbago ng isip” ay nagpapanatili sa tiyak na diwa ng μεταμέλομαι nang hindi agad ipinapantay sa mas karaniwang terminong “magsisi.”
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: upang maniwala sa kanya
  rationale: 'Ipinahahayag ang bunga o layunin ng inaasahang pagbabago ng isip: ang paniniwala kay Juan at sa kanyang mensahe.'
theological_decisions:
- issue: Saklaw ng “daan ng katuwiran”
  choice: Panatilihin ang metaporang “sa daan ng katuwiran”
  alternative: “sa matuwid na paraan” o “sa landas ng katuwiran”
  rationale: Maaaring ilarawan ng parirala ang matuwid na pamumuhay at ministeryo ni Juan o ang matuwid na daang kanyang ipinahayag. Pinananatili ng salin ang tunay na kalabuan.
- issue: Diwa ng πιστεύω na may αὐτῷ
  choice: “naniwala sa kanya”
  alternative: “nagtiwala sa kanya” o “sumampalataya sa kanya”
  rationale: Nakasentro ang talata sa pagtanggap sa mensahe at awtoridad ni Juan. Hindi ipinapasok ng napiling salin ang mas malawak na teolohikal na pormula na hindi tahasang hinihingi ng Griyego.
- issue: Pagkakaiba ng μεταμέλομαι at μετανοέω
  choice: “nagbago ng isip”
  alternative: “nagsisi” o “nakadama ng pagsisisi”
  rationale: Hindi μετανοέω ang pandiwang ginamit. Pinananatili ng “nagbago ng isip” ang ideya ng muling pag-iisip o panghihinayang na humahantong sana sa paniniwala, habang inilalahad sa talababa ang posibleng saling “nagsisi.”
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang biblikal na metaporang “daan ng katuwiran,” habang ginawang likas ang ayos ng mga sugnay. Ginamit ang “mga prostituta” bilang tuwiran at kasalukuyang katawagan, at iniwasan ang mas lumang “mga patutot” at ang malabong eupemismo.
