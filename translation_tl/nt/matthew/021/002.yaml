  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: tl
  text: na sinabi sa kanila, “Pumunta kayo sa nayong nasa tapat ninyo. Agad kayong makakakita roon ng isang inahing asno na nakatali, at ng isang batang asno na kasama niya. Kalagan ninyo ang dalawa at dalhin sila sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: na sinasabi sa kanila
  rationale: Pinananatili ang participial na pag-uugnay nito sa naunang sugnay habang natural pa rin sa salaysay na Tagalog.
- source_word: Πορεύεσθε
  choice: Pumunta kayo
  rationale: Likas at malinaw na pautos sa modernong Tagalog para sa pagpunta sa isang tiyak na lugar.
- source_word: κώμην
  choice: nayon
  rationale: Tumutukoy ang κώμη sa isang pamayanang mas maliit kaysa lungsod; ang “nayon” ang maikli at karaniwang katumbas.
- source_word: κατέναντι ὑμῶν
  choice: nasa tapat ninyo
  rationale: Pinananatili ang panandang-lugar na maaaring mangahulugang nasa harap o katapat ng mga alagad nang hindi labis na tinutukoy ang eksaktong ayos ng lugar.
- source_word: εὐθέως
  choice: agad
  rationale: Malinaw na ipinahahayag ang agarang pagkakita at natural sa kasalukuyang Tagalog.
- source_word: ὄνον δεδεμένην
  choice: isang inahing asno na nakatali
  rationale: Ipinahahayag ng anyong pambabae at ng kasunod na αὐτῆς na babaeng asno ang tinutukoy; ang perfect participle ay kalagayang nakatali.
- source_word: πῶλον μετ’ αὐτῆς
  choice: isang batang asno na kasama nito
  rationale: Bagaman maaaring tumukoy ang πῶλος sa batang hayop sa pangkalahatan, nililinaw ng konteksto na batang asno ito; ang “kasama nito” ay nagpapanatili sa ugnayan nang hindi nagdaragdag na anak nga niya ito.
- source_word: λύσαντες
  choice: Kalagan ninyo ang dalawa
  rationale: Ang participle ay nagsasaad ng kilos na kaakibat at nauuna sa pangunahing utos. Ginawang tuwirang pautos sa natural na Tagalog, at nilinaw ng “ang dalawa” na parehong hayop ang tinutukoy.
- source_word: ἀγάγετέ μοι
  choice: dalhin sa akin
  rationale: Ang “dalhin” ay natural na katumbas sa utos na ihatid o akayin ang mga hayop patungo kay Jesus.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Pinili ang “inahing asno” upang natural na maipakita ang babaeng referent, ngunit hindi sinabing tahasan na anak nito ang batang asno dahil hindi iyon direktang ipinahahayag ng parirala.
