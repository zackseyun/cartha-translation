  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: tl
  text: Muli siyang nagsugo ng iba pang mga lingkod[a], na mas marami kaysa sa mga nauna, at gayon din ang ginawa sa kanila ng mga magsasaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iba pang mga alipin.” Ang salitang Griyego na doulous ay maaaring tumukoy sa “mga lingkod” o “mga alipin,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Likas at maikling panandang inuulit ang naunang pagkilos sa daloy ng salaysay.
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Ang pandiwa ay tumutukoy sa pagpapadala ng mga kinatawan; mas angkop sa konteksto ang “nagsugo” kaysa sa payak na “nagpadala.”
- source_word: ἄλλους δούλους
  choice: iba pang mga lingkod
  rationale: Maaaring mangahulugan ang δοῦλος ng lingkod o alipin. Sa talinghagang ito, ang kanilang tungkulin bilang mga isinugo ang pangunahing diin, kaya natural ang “mga lingkod,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: πλείονας τῶν πρώτων
  choice: na mas marami kaysa sa mga nauna
  rationale: Malinaw nitong ipinahahayag na mas malaki ang bilang ng ikalawang pangkat kaysa sa unang pangkat.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: gayon din ang ginawa sa kanila ng mga magsasaka
  rationale: Pinananatili ang pagbalik sa kaparehong pagtrato sa naunang mga lingkod. Ipinahahayag ang di-tahasang simuno mula sa agarang konteksto upang maging malinaw at natural sa Tagalog nang hindi dinaragdagan ang pangyayari.
theological_decisions:
- issue: Pagsasalin ng δοῦλος sa talinghaga
  choice: mga lingkod
  alternative: mga alipin
  rationale: Hindi itinatanggi ng “mga lingkod” ang kanilang mababang katayuan, ngunit mas malinaw nitong itinatampok dito ang papel nila bilang mga sugo ng may-ari. Ang “mga alipin” ay tunay na posibleng kahulugan at kaya'y itinala sa talababa.
- issue: Di-tahasang simuno ng ἐποίησαν
  choice: ang mga magsasaka
  alternative: sila
  rationale: Ang hulaping pandiwa sa Griyego ay nangangahulugang “ginawa nila,” at ang mga magsasaka sa naunang konteksto ang malinaw na tinutukoy. Ang tahasang pagbanggit sa kanila ay nag-aalis ng malabong reperensiya sa Tagalog, ngunit hindi binabago ang kahulugan.
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Ginamit ang “nagsugo” bilang natural na salitang pampanitikan ngunit karaniwan pa rin; iniwasan ang lipas na ayos at pinanatili ang maikling daloy ng salaysay.
