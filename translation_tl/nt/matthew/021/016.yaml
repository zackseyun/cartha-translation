  source_fidelity: 'Tapat ang salin sa Griyego: napananatili ang tanong na may bahagyang mapanghamak na “mga ito,” ang retorikal na “Hindi ba ninyo kailanman nabasa,” at ang anyo ng sipi na “inihanda mo ang papuri.” Hindi nito inihahalo sa pangunahing teksto ang Hebreong anyong “itinatag mo ang lakas.” Ang paggamit ng nakaraang-panahong “sinabi” para sa makasaysayang pangkasalukuyang λέγει ay isang katanggap-tanggap na pag-aangkop sa likas na salaysay na Tagalog at hindi nagbabago ng kahulugan.'
  naturalness: Malinaw, marangal, at natural sa modernong Filipino Tagalog ang kabuuan. Ang “mga musmos at mga sanggol na sumususo” ay nauunawaan at napapanatili ang pagkakaiba ng dalawang katawagan sa sipi.
  terminology: Ang “papuri,” “mga musmos,” at “mga sanggol na sumususo” ay angkop na mga terminong Tagalog. Wasto ring tinutukoy ng talababa ang tradisyong Griyego ng Kasulatan at ang karaniwang Hebreong anyo ng Awit 8:2.
