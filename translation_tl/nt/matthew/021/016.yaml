id: MAT.21.16
reference: Matthew 21:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Naririnig mo ba ang sinasabi ng mga ito?” Ngunit sinabi sa kanila ni Jesus, “Oo. Hindi ba ninyo kailanman nabasa, ‘Mula sa bibig ng mga musmos at mga sanggol na sumususo ay inihanda mo ang papuri’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinisipi rito ni Jesus ang Awit 8:2 ayon sa tradisyong Griyego ng Kasulatan. Ang tekstong Hebreo ay karaniwang isinasaling, “Mula sa bibig ng mga musmos at mga sanggol na sumususo ay itinatag mo ang lakas.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Naririnig mo ba
  rationale: Tuwirang inilalarawan ang pandinig sa kasalukuyan at pinananatili ang mapanghamong tanong kay Jesus.
- source_word: τί οὗτοι λέγουσιν
  choice: ang sinasabi ng mga ito
  rationale: Ang “sinasabi” ay likas na katumbas ng kasalukuyang kilos, at ang “mga ito” ay nagpapanatili sa bahagyang mapanghamak na himig ng οὗτοι nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: λέγει
  choice: sinabi
  rationale: Ginawang likas na salaysay sa modernong Tagalog ang makasaysayang pangkasalukuyan ng Griyego; hindi binabago ang nilalaman ng tugon.
- source_word: Ναί
  choice: Oo
  rationale: Payak at tuwirang katumbas ng paninindigang sagot.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Hindi ba ninyo kailanman nabasa
  rationale: Pinananatili ang anyo ng retorikal na tanong at ang banayad na pagsaway tungkol sa kanilang kaalaman sa Kasulatan.
- source_word: Ἐκ στόματος
  choice: Mula sa bibig ng
  rationale: Malapit sa larawan at kayarian ng sipi sa Griyego habang nananatiling malinaw sa Tagalog.
- source_word: νηπίων
  choice: mga musmos
  rationale: Ipinahihiwatig ang napakabatang mga bata at naihihiwalay sa kasunod na mas tiyak na paglalarawan sa mga sanggol na sumususo.
- source_word: θηλαζόντων
  choice: mga sanggol na sumususo
  rationale: Malinaw at kasalukuyang pananalita para sa mga batang dumedede, nang walang makalumang katawagan.
- source_word: κατηρτίσω
  choice: inihanda mo
  rationale: Ipinapahayag ang diwang naglaan o naghanda sa anyo ng sipi ni Mateo, nang hindi ipinapasok ang Hebreong “itinatag mo ang lakas.”
- source_word: αἶνον
  choice: papuri
  rationale: Tuwirang katumbas ng pangngalan at natural na ginagamit bilang di-mabilang na konsepto sa Tagalog.
theological_decisions:
- issue: Pagkakasalin sa sipi mula sa Awit 8:2 sa pangangatwiran ni Jesus
  choice: 'Pinanatili sa pangunahing teksto ang anyong Griyego ni Mateo: “inihanda mo ang papuri.”'
  alternative: Ang tekstong Hebreo ng Awit ay karaniwang isinasaling “itinatag mo ang lakas.”
  rationale: Dapat isalin ang sipi ayon sa aktuwal na anyong ibinigay ni Mateo, na sumusunod sa tradisyong Griyego ng Kasulatan, sa halip na tahimik itong itugma sa tekstong Hebreo. Inilalagay sa talababa ang pagkakaiba upang mapanatili ang mahalagang tekstuwal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang retorikal na diin ng tanong at ang bahagyang mapanghamak na bisa ng “mga ito,” habang ginawang likas sa salaysay na Tagalog ang makasaysayang pangkasalukuyan.
