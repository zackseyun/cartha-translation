base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: tl
  text: “Ngunit ano sa palagay ninyo? Isang tao ang may dalawang anak.[a] Lumapit siya sa una at sinabi, ‘Anak, pumunta ka sa ubasan ngayong araw at magtrabaho.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dalawang anak na lalaki.” Maraming salin ang gumagamit ng “mga anak na lalaki,” ngunit ang salitang Griyego rito (τέκνα) ay pangkalahatang tumutukoy sa “mga anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Ngunit ano sa palagay ninyo?
  rationale: Likas na ipinahahayag sa Tagalog ang tanong na humihingi ng pasiya o palagay ng mga kausap, habang pinananatili ng “Ngunit” ang banayad na puwersang pang-ugnay ng δέ.
- source_word: ἄνθρωπος
  choice: Isang tao
  rationale: Tumutukoy ito sa isang tao sa talinghaga. Hindi kailangang tahasang idagdag ang “lalaki” upang maipahayag ang papel niya bilang magulang sa pangungusap.
- source_word: τέκνα δύο
  choice: dalawang anak
  rationale: Ang τέκνα ay pangkalahatang salitang nangangahulugang “mga anak” at hindi partikular na “mga anak na lalaki.” Natural din sa Tagalog ang “anak” nang hindi tinutukoy ang kasarian.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Lumapit siya sa una
  rationale: Malinaw at natural na isinasalaysay ang paglapit sa unang anak bago siya nagsalita.
- source_word: Τέκνον
  choice: Anak
  rationale: Pinananatili ang malawak na kahulugan ng τέκνον at ang tuwirang pagtawag ng magulang sa anak, nang hindi dinaragdagan ng kasariang wala sa salitang Griyego.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: pumunta ka ngayon at magtrabaho
  rationale: Natural na utos sa modernong Tagalog na pinananatili ang pagpunta, ang panahong “ngayon,” at ang utos na magtrabaho.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: sa ubasan
  rationale: Ang “ubasan” ang karaniwan at tumpak na katumbas ng ἀμπελών at pinananatili nito ang larawang pang-agrikultura ng talinghaga.
theological_decisions:
- issue: Kung isasalin ang τέκνα/τέκνον bilang mga anak na lalaki/anak na lalaki ayon sa nakaugaliang salin
  choice: dalawang anak / Anak
  alternative: dalawang anak na lalaki / Anak na lalaki
  rationale: Mas malawak ang τέκνα at τέκνον kaysa sa υἱοί at υἱέ. Kaya hindi nililimitahan ng salin ang kasarian na hindi tahasang tinukoy sa talatang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang karaniwang “anak” at “ubasan”; iniwasan ang mas luma o matigas na “humayo” at “gumawa sa ubasan.”
