  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: tl
  text: 'At sinunggaban ng mga umuupang magsasaka ang kanyang mga alipin: binugbog nila ang isa, pinatay ang isa, at binato nila ng mga bato ang isa pa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “binato.” Ang pandiwang Griyego ay maaaring tumukoy sa pagbato hanggang mamatay, ngunit hindi nito tahasang sinasabing namatay ang taong binato.'
    reason: Pinananatili ang saklaw ng ἐλιθοβόλησαν at iniiwasang ipahayag bilang tiyak na resulta ang kamatayan ng ikatlong alipin.
lexical_decisions:
- source_word: γεωργοὶ
  choice: mga magsasakang umuupa
  rationale: Sa konteksto ng talinghaga, sila ang mga nagbubungkal ng ubasan bilang mga umuupa sa may-ari; ipinahahayag ng parirala ang gawaing pagsasaka at ang ugnayan nila sa may-ari.
- source_word: λαβόντες
  choice: sinunggaban
  rationale: Bagaman literal na maaaring 'kinuha,' ipinakikita ng kasunod na karahasan na marahas ang pagdakip; natural at hindi labis ang 'sinunggaban' sa Filipino.
- source_word: δούλους
  choice: mga alipin
  rationale: Ang δοῦλοι ay mga taong nasa ilalim ng kapangyarihan ng panginoon at isinugo bilang kanyang mga kinatawan. Pinananatili ng 'mga alipin' ang mas tiyak na katayuang ipinahihiwatig ng salitang Griyego, sa halip na palambutin bilang pangkalahatang 'mga lingkod.'
- source_word: ἔδειραν
  choice: binugbog
  rationale: Natural na katumbas ng marahas at paulit-ulit na pananakit; hindi nito labis na tinutukoy ang paraan gaya ng 'hinagupit.'
- source_word: ἀπέκτειναν
  choice: pinatay
  rationale: Tuwirang katumbas ng pandiwang Griyego at hindi nagdaragdag ng legal na kulay ng kahulugang gaya ng 'pinaslang.'
- source_word: ἐλιθοβόλησαν
  choice: binato ng mga bato
  rationale: Malinaw na ipinapahayag ang pag-atake sa pamamagitan ng pagbato at iniiwasan ang anumang kalabuan ng payak na 'binato.'
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: ang isa ... ang isa ... ang isa pa
  rationale: Likas na distributibong ayos sa Filipino na malinaw na naghihiwalay sa sinapit ng bawat alipin.
theological_decisions:
- issue: Paglalarawan sa δοῦλος sa salaysay na talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Pinananatili ng 'alipin' ang tunay na posibilidad ng bonded status at ang malinaw na pagpapailalim sa may-ari. Ang 'lingkod' ay mas banayad at maaaring ikubli ang saklaw ng salitang Griyego.
translation_notes:
  register: Makabago, dignidadong Filipino na madaling maunawaan. Ginamit ang 'mga magsasakang umuupa' sa halip na teknikal o hindi likas na 'mga nangungupahang magsasaka.' Napanatili ang mabilis at sunod-sunod na ritmo ng tatlong mararahas na kilos.
