  terminology: Ang “mga alipin,” “binugbog,” at “pinatay” ay malinaw at angkop sa modernong Filipino Tagalog. Pinanatili ang “binato ... ng mga bato” upang maging malinaw na pagbato ang tinutukoy, hindi simpleng paghagis ng isang bagay.
