id: MAT.21.21
reference: Matthew 21:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: tl
  text: Sumagot naman si Jesus sa kanila, “Katotohanang sinasabi ko sa inyo, kung may pananampalataya kayo at hindi kayo nag-aalinlangan[a], hindi lamang ninyo magagawa ang ginawa sa puno ng igos, kundi kahit sabihin ninyo sa bundok na ito, ‘Iangat ka at ihagis sa dagat,’ mangyayari iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi kayo nag-uurong-sulong” o “hindi hati ang inyong kalooban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Sumagot naman
  rationale: Ipinahahayag ang tugon ni Jesus at ang banayad na paglipat na minamarkahan ng δέ, nang hindi nagpapahiwatig ng mas matinding pagsalungat kaysa nasa Griyego.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Pinananatili ang taimtim at may-awtoridad na pormula ni Jesus sa likas ngunit marangal na modernong Tagalog.
- source_word: ἐὰν ἔχητε πίστιν
  choice: kung may pananampalataya kayo
  rationale: Ang πίστις dito ay tumutukoy sa nagtitiwalang pananalig; ang “pananampalataya” ang malinaw at karaniwang katumbas sa kontekstong ito.
- source_word: μὴ διακριθῆτε
  choice: hindi kayo nag-aalinlangan
  rationale: Ipinapahayag ang diwa ng panloob na pag-aalinlangan o pag-uurong-sulong. Inilalagay sa talababa ang iba pang posibleng himig ng salita.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: hindi lamang ninyo magagawa ang ginawa sa puno ng igos
  rationale: Ginagawang malinaw sa natural na Tagalog ang eliptikong pariralang tumutukoy sa pangyayaring kinasangkutan ng puno ng igos.
- source_word: κἂν
  choice: kundi kahit
  rationale: Pinananatili ang pagpapalawak at pagtindi mula sa halimbawa ng puno ng igos tungo sa bundok.
- source_word: τῷ ὄρει τούτῳ
  choice: sa bundok na ito
  rationale: Tuwirang pinananatili ang demonstratibo at ang karaniwang kahulugan ng ὄρος.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Maiangat ka at maitapon sa dagat
  rationale: Pinananatili ang pasibong anyo at malinaw na pisikal na larawan ng pag-angat at paghahagis, sa halip na paliitin ito sa mas abstraktong “maalis.”
- source_word: γενήσεται
  choice: mangyayari iyon
  rationale: Likas na modernong Tagalog para sa katiyakang magaganap ang ipinahayag na pangyayari.
theological_decisions:
- issue: Kahulugan ng πίστις sa pahayag tungkol sa pambihirang pagkilos
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa konteksto, ang salita ay tumutukoy sa nagtitiwalang pananalig, hindi pangunahing sa katapatan bilang ugali.
- issue: Kalikasan ng pahayag tungkol sa paglilipat ng bundok
  choice: Panatilihin ang matindi at matalinghagang larawan nang hindi ipinapasiya kung ito ay dapat unawain lamang bilang literal o lamang bilang metapora.
  alternative: Mahigpit na literal na pangako; purong metapora para sa pagdaig sa mga suliranin
  rationale: Ang salin ay nagpapanatili sa lakas at tensiyon ng orihinal na larawan nang hindi nagdaragdag ng makitid na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal, tuwiran, at madaling maunawaan. Ginamit ang “naman” para sa banayad na narratibong δέ; iniwasan ang arkaikong pananalita at pinanatili ang matingkad na larawan ng bundok.
