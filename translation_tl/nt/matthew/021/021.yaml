  to: Sumagot naman si Jesus sa kanila, “Katotohanang sinasabi ko sa inyo, kung may pananampalataya kayo at hindi kayo nag-aalinlangan[a], hindi lamang ninyo magagawa ang ginawa sa puno ng igos, kundi kahit sabihin ninyo sa bundok na ito, ‘Iangat ka at ihagis sa dagat,’ mangyayari iyon.”
