review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang tugon ni Jesus, ang taimtim na pormulang “Katotohanang sinasabi ko sa inyo,” pananampalataya, kawalan ng pag-aalinlangan, ang pangyayari sa puno ng igos, at ang katiyakang magaganap ang sinabi. Gayunman, ang “Maiangat ka at maitapon” ay mas madaling basahin bilang posibilidad o panghinaharap kaysa bilang dalawang utos na pasibo (Ἄρθητι ... βλήθητι).
  naturalness: Marangal at likas sa pangkalahatan ang modernong Tagalog. Mas malinaw at mas natural ang anyong pautos na “Iangat ka at ihagis sa dagat” sa tuwirang pagsasalin ng iniutos sa bundok.
  terminology: Ang “pananampalataya,” “nag-aalinlangan,” “puno ng igos,” “bundok,” at “dagat” ay angkop. Napananatili rin ng talababa ang saklaw ng διακριθῆτε nang hindi ipinipilit ang isang interpretasyon.
  issues:
  - severity: medium
    issue: Ang “Maiangat ka at maitapon sa dagat” ay hindi malinaw na pautos.
    rationale: Ang Griyegong Ἄρθητι at βλήθητι ay aorist passive imperatives. Sa Tagalog, ang ma- forms dito ay maaaring maunawaan bilang ‘maaaring/ magiging maiangat at maitapon,’ kaya humihina ang direktang utos sa bundok. Ang “Iangat ka at ihagis sa dagat” ay malinaw na anyong pautos at pinananatili ang pasibong diwa sa konteksto.
  revised_text: Sumagot naman si Jesus sa kanila, “Katotohanang sinasabi ko sa inyo, kung may pananampalataya kayo at hindi kayo nag-aalinlangan[a], hindi lamang ninyo magagawa ang ginawa sa puno ng igos, kundi kahit sabihin ninyo sa bundok na ito, ‘Iangat ka at ihagis sa dagat,’ mangyayari iyon.”
