id: MAT.21.1
reference: Matthew 21:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: tl
  text: Nang malapit na sila sa Jerusalem at dumating sa Betfage, sa Bundok ng mga Olibo, saka nagsugo si Jesus ng dalawang alagad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: malapit na sila
  rationale: Ipinahahayag ng aorist ng ἐγγίζω ang paglapit sa isang lugar. Natural sa makabagong Tagalog ang “malapit na sila” at pinananatili nito ang kilos patungo sa Jerusalem.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Ito ang karaniwang anyo ng pangalan ng lungsod sa Filipino.
- source_word: ἦλθον
  choice: dumating
  rationale: Sa kontekstong heograpikal, malinaw at natural na ipinahahayag ng “dumating” ang pagdating nila sa Betfage, habang naihihiwalay ito sa naunang kilos na paglapit.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Transliterasyong angkop sa baybay at bigkas ng Filipino para sa pangalan ng lugar.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sa Bundok ng mga Olibo
  rationale: Sa sunud-sunod na mga pariralang heograpikal, inilalarawan nito ang kinaroroonan ng Betfage kaugnay ng Bundok ng mga Olibo. Ang “sa” ay natural at hindi nagpapahiwatig na pumasok sila sa loob ng bundok.
- source_word: τότε
  choice: '[ipinahiwatig ng pagkakasunod ng pangungusap]'
  rationale: Sapat nang ipinahahayag ng Tagalog na ayos ng pangungusap ang kasunod na pangyayari; ang tahasang “pagkatapos” o “noon” ay magiging mabigat at hindi kailangan.
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Tumpak at dignified na pandiwa para sa pagpapadala ni Jesus sa mga alagad upang gumanap ng isang atas.
- source_word: δύο μαθητὰς
  choice: dalawang alagad
  rationale: Karaniwang salin sa konteksto ng mga Ebanghelyo; malinaw na pinananatili ang bilang.
theological_decisions:
- issue: Paksa ng mga pandiwang maramihan bago tahasang banggitin si Jesus
  choice: Panatilihin ang “sila” at saka lamang pangalanan si Jesus sa sugnay na “nagsugo si Jesus.”
  alternative: Tukuyin agad ang pangkat bilang “si Jesus at ang kanyang mga alagad.”
  rationale: May ipinahihiwatig na pangkat bilang paksa sa Griyego, ngunit hindi ito tahasang pinangalanan sa talata. Hindi dinaragdagan ng salin ang sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Nang” upang likas na iugnay ang paglapit at pagdating sa kasunod na pagkilos ni Jesus. Walang talababa dahil hindi kailangan ng lexical alternative upang mapanatili ang mahalagang kahulugan o tunay na kalabuan.
