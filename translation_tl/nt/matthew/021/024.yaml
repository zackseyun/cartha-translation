id: MAT.21.24
reference: Matthew 21:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: tl
  text: Ngunit sumagot si Jesus sa kanila, “Magtatanong din ako sa inyo ng isang bagay[a]. Kung sasagutin ninyo ako, sasabihin ko rin sa inyo kung sa anong awtoridad ko ginagawa ang mga bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tanong,” “isang usapin,” o mas literal, “isang salita.” Maaaring tumukoy ang Griegong λόγον ἕνα sa isang tanong o bagay na pinag-uusapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ngunit sumagot si Jesus sa kanila
  rationale: Pinagsama sa likas na salaysay sa Filipino ang idiomatikong participle at pandiwa ng pagsasalita, habang pinananatili ng “Ngunit” ang banayad na pagsalungat ng δέ.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Magtatanong din ako sa inyo
  rationale: 'Ipinahihiwatig ng “din” ang gantihang diin ng κἀγώ: yamang tinanong nila si Jesus, magtatanong naman siya sa kanila.'
- source_word: λόγον ἕνα
  choice: isang bagay
  rationale: Maaaring tumukoy ang λόγον ἕνα sa isang salita, usapin, o tanong. Likas sa Filipino ang “isang bagay” at hindi nito labis na nililimitahan ang saklaw sa pormal na tanong lamang.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Kung sasagutin ninyo ako
  rationale: Sa konteksto ng itatanong ni Jesus, ang εἴπητέ μοι ay tumutukoy sa pagbibigay sa kanya ng sagot; malinaw at natural ito sa Filipino.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: sasabihin ko rin sa inyo
  rationale: Pinananatili ng “rin” ang ikalawang gantihang κἀγώ at ng “sasabihin” ang karaniwang diwa ng ἐρῶ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kung sa anong awtoridad
  rationale: Ang “sa anong awtoridad” ay natural na paraan sa Filipino upang ipahayag ang batayan o kapangyarihang nagbibigay-karapatan sa pagkilos.
- source_word: ταῦτα ποιῶ
  choice: ginagawa ang mga bagay na ito
  rationale: Pinananatili ang kasalukuyang pagkilos ng ποιῶ at ang maramihang reperensiya ng ταῦτα sa mga gawa ni Jesus na pinagtatalunan.
theological_decisions:
- issue: Saklaw ng ἐξουσία
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Maaaring may kaugnayan ang salita sa kapangyarihan, ngunit ang tanong dito ay lalo na tungkol sa karapatan o pahintulot na gawin ang mga ito; “awtoridad” ang nagpapanatili sa pokus na iyon nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “awtoridad” dahil karaniwan at eksakto ito sa kontekstong ito; iniwasan ang makalumang ayos at ang labis na literal na pag-uulit ng mga pandiwa ng pagsasalita.
