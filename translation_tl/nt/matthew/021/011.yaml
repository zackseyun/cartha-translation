id: MAT.21.11
reference: Matthew 21:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: tl
  text: At sinasabi ng mga tao, “Ito ang propetang si Jesus, na taga-Nazaret sa Galilea.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang propeta.” Nasa Griyego ang “ang propeta,” na maaaring nagpapakita na kinikilala ng mga tao si Jesus bilang isang kilalang propetikong tauhan.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: At ... ng mga tao
  rationale: Ang pangmaramihang ὄχλοι ay tumutukoy sa mga nagkakatipong tao. Natural sa modernong Tagalog ang “mga tao,” samantalang pinananatili ng “At” ang banayad na pagpapatuloy na ipinahihiwatig ng δέ.
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Ang aspektong imperpektibo ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita; malinaw at natural itong naihahayag ng “sinasabi” sa kontekstong pasalaysay.
- source_word: Οὗτός ἐστιν
  choice: Ito ang
  rationale: Natural na pormula ito ng pagkilala sa Tagalog at tumpak na naghahatid sa demonstratibo at pandiwang pantukoy ng Griyego.
- source_word: ὁ προφήτης
  choice: ang propeta
  rationale: Pinananatili ang tiyak na artikulo ng Griyego at ang posibleng pagkilala ng karamihan kay Jesus bilang kilalang propetikong tauhan, nang hindi ito pinalalawak.
- source_word: Ἰησοῦς
  choice: si Jesus
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa Tagalog at ang personal marker na “si” matapos ang titulong “propeta.”
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: na taga-Nazaret sa Galilea
  rationale: Ang “taga-Nazaret” ay likas na Tagalog para sa pinagmulan, at malinaw na inilalagay ng “sa Galilea” ang Nazaret sa rehiyong iyon.
theological_decisions:
- issue: Kung tiyak o di-tiyak ang pagkakasalin sa ὁ προφήτης
  choice: ang propeta
  alternative: isang propeta
  rationale: May tiyak na artikulo ang Griyego, kaya pinananatili ng salin ang posibleng pagkilala sa isang inaasahan o kinikilalang propetikong tauhan. Hindi nito tahasang nilulutas kung iyon mismo ang buong pagkaunawa ng mga tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga tao” sa halip na mas mabigat na “mga pulutong,” at ang “taga-Nazaret sa Galilea” para sa idiomatikong paglalahad ng pinagmulan.
