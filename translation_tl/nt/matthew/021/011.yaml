  source_fidelity: Tumpak na naihahatid ng salin ang δέ sa “At,” ang pangmaramihang οἱ ὄχλοι sa “mga tao,” ang pagkilalang Οὗτός ἐστιν sa “Ito ang,” at ang tiyak na ὁ προφήτης sa “ang propeta.” Ang “sinasabi” ay isang katanggap-tanggap na Tagalog na paraan upang ipakita ang nagpapatuloy/paulit-ulit na diwa ng imperpektong ἔλεγον. Ang “na taga-Nazaret sa Galilea” ay malinaw at tapat sa pangheograpiyang pantukoy na ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
