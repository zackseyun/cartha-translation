id: MAT.21.31
reference: Matthew 21:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: tl
  text: “Sino sa dalawa ang tumupad sa kalooban ng ama?” Sumagot sila, “Ang una.” Sinabi sa kanila ni Jesus, “Totoong sinasabi ko sa inyo, ang mga maniningil ng buwis at ang mga prostituta ay nauuna sa inyo papasok sa kaharian ng Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumapasok sa kaharian ng Diyos bago kayo.” Sa Griyego, literal na “nauuna sa inyo,” na nagdiriin sa kanilang pag-una ngunit hindi kinakailangang nagsasabing hindi na makapapasok ang mga kausap.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Sino sa dalawa
  rationale: Natural na tanong sa Tagalog na pinananatili ang partitive na diwa ng ἐκ τῶν δύο.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: tumupad sa kalooban ng ama
  rationale: Ang “tumupad sa kalooban” ay likas at malinaw sa Tagalog; ipinahahayag nito ang paggawa ng ipinasiya o ninanais ng ama nang hindi ginagawang tuwirang pagtukoy sa Diyos ang ama sa talinghaga.
- source_word: Ὁ πρῶτος
  choice: Ang una
  rationale: Maikli at natural na sagot na katumbas ng eliptikong Griyego.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Totoong sinasabi ko sa inyo
  rationale: Pinananatili ang mariin at taimtim na pormula ni Jesus sa malinaw na makabagong Tagalog.
- source_word: τελῶναι
  choice: mga maniningil ng buwis
  rationale: Karaniwan at malinaw na tawag sa mga ahente ng pangongolekta ng buwis na mababa ang tingin ng lipunan noong panahong iyon.
- source_word: πόρναι
  choice: mga babaeng nagbibili ng aliw
  rationale: Tiyak at dignified na makabagong katawagan para sa mga babaeng tinutukoy, nang hindi gumagamit ng lipas o mapanlait na salita.
- source_word: προάγουσιν ὑμᾶς
  choice: nauuna sa inyo
  rationale: Pinananatili ang larawan ng pag-una at ang kasalukuyang kilos, nang hindi ipinahihiwatig na tiyak nang hindi makapapasok ang mga kausap.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: papasok sa kaharian ng Diyos
  rationale: Likas na ipinapahayag sa Tagalog ang direksiyon tungo sa loob ng kaharian, kasabay ng pandiwang nagsasaad ng pag-una.
theological_decisions:
- issue: Diwa ng προάγουσιν ὑμᾶς kaugnay ng pagpasok sa kaharian
  choice: nauuna sa inyo papasok sa kaharian ng Diyos
  alternative: pumapasok sa kaharian ng Diyos bago kayo
  rationale: Ang napiling salin ay nagpapanatili sa larawan ng pag-una at sa babalang nakatuon sa mga kausap, ngunit hindi nito tahasang ipinapasiyang lubusan silang hindi makapapasok.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang pamilyar na biblikal na pariralang “kalooban ng ama” at iniwasan ang mga lipas o labis na teknikal na salita.
