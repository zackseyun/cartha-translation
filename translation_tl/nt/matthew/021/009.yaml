id: MAT.21.9
reference: Matthew 21:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: tl
  text: 'At ang mga pulutong na nauuna sa kanya at ang mga sumusunod sa kanya ay patuloy na sumisigaw: “Hosanna[a] sa Anak ni David![b] Pinagpala ang dumarating sa pangalan ng Panginoon![c] Hosanna sa kaitaasan!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Hosanna” ay hango sa Hebreo at nangangahulugang humigit-kumulang na “iligtas, pakiusap” o “iligtas ngayon.” Dito, ginagamit din ito bilang sigaw ng pagbubunyi at pagpupuri.
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ni David” ay isang titulong maharlika at mesiyaniko.
    reason: cultural_note
  - marker: c
    text: Umaalingawngaw rito ang Awit 118:26. Sa tekstong Hebreo ng Awit, ang “Panginoon” ay kumakatawan sa banal na pangalang YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Likas sa modernong Tagalog ang “mga tao” para sa mga pangkat na kasama sa prusisyon; naipahihiwatig na ng maramihan at ng konteksto ang karamihan nang hindi gumagamit ng mas mabigat na “mga pulutong.”
- source_word: οἱ προάγοντες αὐτὸν
  choice: mga taong nauuna sa kanya
  rationale: Malinaw nitong inilalarawan ang mga naglalakad sa unahan ni Jesus at hindi ipinahihiwatig na sila ang pormal na namumuno sa kanya.
- source_word: οἱ ἀκολουθοῦντες
  choice: mga sumusunod
  rationale: Tuwirang katumbas ito ng participle at natural na kapareha ng “mga taong nauuna sa kanya” sa tagpo ng prusisyon.
- source_word: ἔκραζον λέγοντες
  choice: patuloy na sumisigaw
  rationale: Ipinahahayag ng “patuloy” ang nagaganap o paulit-ulit na kilos ng imperfect na ἔκραζον. Hindi na isinama ang literal na “na nagsasabi” sapagkat magiging mabigat at hindi natural bago ang tuwirang sipi sa Tagalog.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Pinanatili ang kinikilalang transliterasyong liturhikal sapagkat sa kontekstong ito ay sigaw itong may himig ng pagpupuri, habang ipinaliliwanag sa talababa ang pinagmulan nitong pakiusap na magligtas.
- source_word: τῷ υἱῷ Δαυίδ
  choice: sa Anak ni David
  rationale: Pinananatili nito ang dative na inuukulan ng sigaw at ang makapangyarihang titulong Davidiko nang hindi ito pinapalitan ng interpretatibong “Mesiyas.”
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Pinagpala ang dumarating
  rationale: Natural at marangal itong Tagalog na nagpapanatili sa substantival participle at sa kasalukuyang/lapit na pagdating na ipinahihiwatig ng parirala.
- source_word: ἐν ὀνόματι κυρίου
  choice: sa pangalan ng Panginoon
  rationale: Ito ang malinaw at nakaugaliang salin na nagpapanatili sa alusyon sa Kasulatan at sa diwa ng pagkilos sa kapangyarihan o pahintulot ng Panginoon nang hindi iyon ginagawang paraphrase.
- source_word: ἐν τοῖς ὑψίστοις
  choice: sa kaitaasan
  rationale: Maikli, marangal, at sadyang hindi labis na espesipiko ang “sa kaitaasan”; napapanatili nito ang posibilidad na tumukoy sa pinakamataas na dako o makalangit na larangan.
theological_decisions:
- issue: Ang maharlika at mesiyanikong titulo sa τῷ υἱῷ Δαυίδ
  choice: Panatilihin ang “Anak ni David” bilang titulo sa pangunahing teksto.
  alternative: “sa Mesiyas”
  rationale: “Anak ni David” mismo ang nasa Griyego at may natatanging historikal at teolohikal na bigat. Ang pagpapalit dito ng “Mesiyas” ay magpapasok ng interpretasyon sa halip na isalin ang mismong titulo.
- issue: Ang gamit ng Ὡσαννά
  choice: Panatilihin ang “Hosanna” sa pangunahing teksto at ipaliwanag ang saligang kahulugan sa talababa.
  alternative: “Iligtas mo kami, nakikiusap kami” o “Iligtas mo ngayon”
  rationale: Bagaman nagmula ito sa isang Hebreong pakiusap na magligtas, gumaganap ito rito bilang liturhikal na pagbubunyi na may himig ng pagpupuri. Pinananatili ng transliterasyon ang parehong alusyon at gamit.
- issue: Ang κυρίου sa sipi mula sa Awit 118:26
  choice: Isalin bilang “Panginoon” at banggitin sa talababa ang likurang Hebreo.
  alternative: Gamitin ang “YHWH” o isang anyong pantanging pangalan sa pangunahing teksto.
  rationale: κύριος ang mababasa sa tekstong Griyego ng Mateo. Gayunman, tunay na mahalaga ang alusyon sa Hebreong Awit, kung saan naroon ang banal na pangalang YHWH, kaya ipinapakita ito sa talababa nang hindi pinapalitan ang nasa Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kanya” sa halip na mas pormal na “kaniya,” at ang malinaw na “patuloy na sumisigaw” upang maipakita ang aspektong durative. Pinanatili ang mga pormulang “Anak ni David,” “pangalan ng Panginoon,” at “sa kaitaasan” dahil mahalaga ang kanilang biblikal at liturhikal na bigat. Ang mga marker na [a], [b], at [c] ay inilagay mismo sa mga pariralang kanilang ipinaliliwanag.
