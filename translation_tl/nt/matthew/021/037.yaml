id: MAT.21.37
reference: Matthew 21:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: tl
  text: Ngunit nang bandang huli, isinugo niya sa kanila ang kanyang anak. Sinabi niya, “Igagalang nila ang anak ko.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: nang bandang huli
  rationale: Ipinahahayag ang mas huling yugto sa pagkakasunod-sunod, nang hindi ipinipilit na ito ang ganap na pinakahuling kilos sa labas ng daloy ng talinghaga.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ang banayad na pagsalungat at mahalagang pag-unlad mula sa pagsusugo ng mga alipin tungo sa pagsusugo ng anak.
- source_word: ἀπέστειλεν
  choice: isinugo niya
  rationale: Likas at marangal na katumbas ng pandiwang nangangahulugang magpadala; hindi nito ipinapasok ang teknikal na diwa ng pagkaapostol.
- source_word: πρὸς αὐτοὺς
  choice: sa kanila
  rationale: Sa pandiwa ng pagsusugo, ipinahahayag ng πρός at akusatibo ang patutunguhan sa mga tao.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ang kanyang anak
  rationale: Natural na Filipino para sa pariralang tumutukoy sa natatanging mensaherong anak, nang walang idinagdag na diin gaya ng “sarili niyang anak.”
- source_word: λέγων
  choice: Sinabi niya
  rationale: Ginawang hiwalay na pangungusap ang participle upang maging malinaw at natural sa modernong Filipino habang pinananatili ang pagpapakilala sa tuwirang sinabi.
- source_word: Ἐντραπήσονται
  choice: Igagalang nila
  rationale: Sa konstruksiyong may tuwirang layon, ang pandiwa ay tumutukoy sa pagpapakita ng paggalang o konsiderasyon. Malinaw at kasalukuyang gamit ang “igagalang.”
- source_word: τὸν υἱόν μου
  choice: ang anak ko
  rationale: Natural na tuwirang layon sa Filipino at pinananatili ang personal at relasyonal na lakas ng sinabi.
theological_decisions:
- issue: Paglalarawan sa anak sa talinghaga nang hindi labis na ipinapaliwanag ang Cristolohikal na tinutukoy
  choice: kanyang anak / anak ko
  alternative: minamahal niyang anak / ang Anak
  rationale: Karaniwang υἱός ang ginamit sa talata, walang ἀγαπητός at walang gramatikal na batayan upang gawing titulo sa mismong salaysay. Hinahayaang lumitaw sa konteksto ang pagtukoy kay Jesus.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinili ang “isinugo” upang bumagay sa tono ng talinghaga, at ang “Igagalang” upang ihatid ang kontekstuwal na diwa ng ἐντρέπω nang hindi gumagamit ng makaluma o labis na panrelihiyong salita.
