  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Nasusulat[a], ‘Ang bahay ko ay tatawaging bahay ng panalangin,’ ngunit ginagawa ninyo itong lungga ng mga tulisan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pinagsasama rito ni Jesus ang Isaias 56:7 at Jeremias 7:11.
    reason: cross_reference
  - marker: b
    text: O “mga magnanakaw.” Ang salitang Griyego ay maaaring tumukoy sa mga magnanakaw o mararahas na bandido.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ang pangkasaysayang kasalukuyang panahunan sa Griyego ay likas na isinasalaysay sa nakaraang panahunan sa modernong Tagalog; pinananatili nito ang kilos nang hindi nagiging pilit ang salaysay.
- source_word: Γέγραπται
  choice: Nasusulat
  rationale: Karaniwang pormula ito sa Tagalog para sa isang umiiral at may-awtoridad na sipi mula sa Kasulatan, at angkop sa perpektong balintiyak ng Griyego.
- source_word: οἶκός μου
  choice: Ang bahay ko
  rationale: Pinananatili ang literal na “bahay” sa halip na ang mas makitid at interpretatibong “templo,” gaya ng pagkakasipi sa Isaias.
- source_word: οἶκος προσευχῆς
  choice: bahay ng panalangin
  rationale: Likas at malinaw na Tagalog ito para sa genitibong parirala, habang nananatiling makikilala ang pahayag mula sa Isaias 56:7.
- source_word: κληθήσεται
  choice: tatawaging
  rationale: Tuwirang ipinapahayag ang panghinaharap na balintiyak ng Griyego.
- source_word: ποιεῖτε
  choice: ginagawa ninyo itong
  rationale: Pinananatili ang tuwirang diwa ng ποιεῖτε at ipinahihiwatig ang nagpapatuloy na gawain sa konteksto.
- source_word: σπήλαιον
  choice: lungga
  rationale: Mas natural kaysa literal na “yungib” para sa taguan o kuta ng mga tulisan, at pinananatili ang larawan mula sa Jeremias 7:11.
- source_word: λῃστῶν
  choice: mga tulisan
  rationale: Maaaring tumukoy ang λῃστής sa mga magnanakaw o mararahas na bandido; ipinahahayag ng “tulisan” ang mas malakas na diwa ng salitang Griyego nang hindi isinasara ang alternatibo.
theological_decisions:
- issue: Pagsipi at pagpapahiwatig mula sa Lumang Tipan
  choice: Pinanatiling makikilala ang “bahay ng panalangin” mula sa Isaias 56:7 at “lungga ng mga tulisan” mula sa Jeremias 7:11.
  alternative: Gumamit ng mas malayang makabagong pananalita na hindi gaanong nagpapakita ng ugnayan sa dalawang talata.
  rationale: Binubuo ni Jesus ang pahayag mula sa dalawang tekstong propetiko; mahalagang makita ng mambabasa ang parehong ugnayan nang hindi dinaragdagan ang mismong talata.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Tagalog. Ginamit ang “Nasusulat” bilang pamilyar na pormula sa pagsipi ng Kasulatan, ngunit iniwasan ang labis na makaluma o denominasyonal na pananalita.
