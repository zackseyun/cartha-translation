  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang banayad na pagsalungat, ang temporal na kaugnayan ng participle na ἰδόντες, ang mga punong pari at mga γραμματεῖς, ang malawak na τὰ θαυμάσια, ang mga batang bumubunyi, at ang reaksyong ἠγανάκτησαν. Ang “Anak ni David” at “Hosanna” ay wastong napanatili. Gayunman, kailangang ayusin ang pagkakabuo at bantas ng pangungusap sa dulo ng tuwirang sipi upang malinaw na ang “nagalit sila” ang pangunahing pandiwa.
  naturalness: Natural ang karamihan ng bokabularyo at ang rehistro ay angkop sa modernong Filipino Tagalog. Ang kasalukuyang ayos na nagtatapos sa “Hosanna sa Anak ni David!” nagalit sila ay may depektong bantas at mahirap basahin. Ang paglalagay ng pangunahing sugnay sa unahan ay nagbibigay ng malinaw at natural na daloy nang hindi binabago ang diin o kahulugan.
  terminology: Ang “mga punong pari,” “mga tagapagturo ng Kautusan,” “templo,” “Hosanna,” at “Anak ni David” ay angkop. Ang “mga tagapagturo ng Kautusan” ay isang maingat na pagpapaliwanag ng γραμματεῖς at hindi nagpapasok ng di-inihihiwatig na doktrina. Inayos lamang ang talababa ng Hosanna upang mas tuwirang maipahayag ang kahulugang “Save, please/now.”
