id: MAT.21.15
reference: Matthew 21:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: tl
  text: Ngunit nagalit ang mga punong pari at ang mga tagapagturo ng Kautusan nang makita nila ang mga kamangha-manghang bagay na ginawa niya at ang mga batang sumisigaw sa templo[a] at nagsasabing, “Hosanna sa Anak ni David!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na ἱερόν ay tumutukoy sa buong lugar o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: Ang “Hosanna” ay isang pagbubunying nagmula sa Hebreo at nangangahulugang humigit-kumulang na “Iligtas mo kami, pakiusap” o “Iligtas mo kami ngayon.” Sa panahong ito, ginagamit din ito bilang sigaw ng papuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: nang makita
  rationale: Ipinapahayag ng aorist participle ang pangyayaring nagbigay-daan sa pangunahing pandiwa; natural sa Tagalog ang temporal na pariralang “nang makita.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapakita ito ng banayad na pagsalungat sa naunang tagpo ng pagpapagaling at pagpupuri.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa mga pangunahing pinunong makasaserdote, hindi lamang sa iisang pinakapunong pari.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, malinaw nitong ipinahihiwatig sa karaniwang mambabasa ang tungkulin ng mga γραμματεῖς bilang mga dalubhasa at guro ng Kautusan; mas nauunawaan ito kaysa sa literal ngunit di-gaanong malinaw na “mga eskriba.”
- source_word: τὰ θαυμάσια
  choice: mga kamangha-manghang bagay
  rationale: Pinananatili ang malawak na kahulugan ng kapansin-pansing mga ginawa nang hindi nililimitahan ang mga ito sa salitang “mga himala.”
- source_word: ἐποίησεν
  choice: ginawa niya
  rationale: Payak at tuwirang salin ng aorist na pandiwa at angkop sa malawak na layon na τὰ θαυμάσια.
- source_word: παῖδας
  choice: mga bata
  rationale: Ito ang pinakaangkop na kahulugan sa konteksto; hindi hinihingi ng teksto na tukuyin lamang silang mga batang lalaki.
- source_word: κράζοντας
  choice: sumisigaw
  rationale: Ipinahihiwatig ang malakas at hayagang pagpapahayag nang hindi ito awtomatikong ginagawang sigaw ng pagkapoot.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Natural na salin sa Tagalog; ipinaliliwanag sa talababa na ang ἱερόν ay ang buong lugar o bakuran ng templo, hindi lamang ang panloob na santuwaryo.
- source_word: λέγοντας
  choice: at nagsasabing
  rationale: Pinananatili ang ikalawang participle na kaagapay ng “sumisigaw” at maayos na ipinakikilala ang tuwirang sipi.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Pinananatili ang kinikilalang liturhikal na pagbubunyi at ang sabay nitong pinagmulan bilang pakiusap para sa pagliligtas; inilalahad sa talababa ang kahulugan.
- source_word: τῷ υἱῷ Δαυίδ
  choice: sa Anak ni David
  rationale: Tuwirang pinananatili ang mesiyanikong titulo at ang datibong kaugnayan nito sa pagbubunying “Hosanna.”
- source_word: ἠγανάκτησαν
  choice: nagalit sila
  rationale: Natural at malinaw na ipinapahayag ang matinding pagkayamot o galit ng mga pinuno nang hindi dinaragdagan ang dahilan nito.
theological_decisions:
- issue: Mesiyanikong kabuluhan ng “Anak ni David”
  choice: Pinanatili ang literal at kinikilalang titulong “Anak ni David.”
  alternative: “tagapagmana ni David” o “anak ni David” bilang karaniwang paglalarawan lamang
  rationale: Sa salaysay ni Mateo, gumaganap ang parirala bilang mesiyanikong titulo; pahihinain ng malayang pagpapakahulugan ang teolohikal at pasalaysay na kabuluhan nito.
- issue: Kahulugan at gamit ng Ὡσαννά
  choice: “Hosanna” sa pangunahing teksto, na may paliwanag sa talababa.
  alternative: “Iligtas mo kami” o “Iligtas mo ngayon” sa pangunahing teksto
  rationale: Ang salita ay kapuwa nag-ugat sa isang pakiusap na magligtas at ginagamit dito bilang nakaugaliang sigaw ng papuri. Pinananatili ng transliterasyon at talababa ang dalawang aspektong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga tagapagturo ng Kautusan” sa halip na “mga eskriba” upang malinaw ang tungkulin sa ordinaryong mambabasa. Pinanatili ang “Hosanna” at “Anak ni David” dahil mahalaga ang kanilang liturhikal at mesiyanikong bisa.
