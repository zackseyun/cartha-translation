  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: tl
  text: Kaya sinasabi ko sa inyo na aalisin sa inyo ang kaharian ng Diyos at ibibigay sa isang bansa[a] na nagdudulot ng mga bunga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang bayan.” Ang Griyegong ἔθνει ay maaaring tumukoy sa isang bansa o pangkat ng mga tao. Dito, inilalarawan ang isang kolektibong pangkat ayon sa mga bungang idinudulot nito, nang hindi mas tiyak na sinasabi kung sino ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Likas at malinaw na ipinahahayag ang konklusyong hinango sa naunang talinghaga at sipi.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang personal na pahayag sa kasalukuyan at natural ito sa modernong Filipino.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: aalisin sa inyo
  rationale: Ipinapakita ang hinaharap na pasibo at ang paghihiwalay o pagkawala mula sa mga kausap.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Karaniwan at tumpak na salin na nagpapanatili sa lawak ng βασιλεία bilang paghahari at kaharian nang hindi ito pinakikitid sa isa lamang.
- source_word: δοθήσεται
  choice: ibibigay
  rationale: Pinananatili ang hinaharap na pasibo at natural na ikinakabit sa naunang pandiwa.
- source_word: ἔθνει
  choice: sa isang bansa
  rationale: Tuwirang katumbas na tumutukoy sa isang kolektibong tatanggap; hindi nito tiyak na kinikilala ang grupo bilang mga Hentil, iglesya, o ibang pangkat.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: na nagbubunga ng mga bunga nito
  rationale: Pinananatili ang patuloy na katangian ng kolektibong katawan, ang maramihang 'mga bunga,' at ang panghalip na pinakanatural na tumutukoy sa kaharian.
theological_decisions:
- issue: Ang tinutukoy ng ἔθνει
  choice: Isinaling pangkalahatan bilang “isang bansa,” na may tala sa alternatibong “isang bayan.”
  alternative: Tahasang tukuyin bilang iglesya, mga Hentil, o isang pinanibagong bayan ng Diyos.
  rationale: Ang Griyego ay tumutukoy sa isang kolektibong katawan na nakikilala sa bunga nito, ngunit hindi nito tahasang nilulutas ang tiyak na pagkakakilanlan ng grupong iyon.
- issue: Kahulugan ng “kaharian ng Diyos” sa pahayag ng paghatol
  choice: Pinanatili bilang “kaharian ng Diyos.”
  alternative: Ipaliwanag bilang paghahari ng Diyos o mga pribilehiyo ng pagiging kabilang sa bayan ng Diyos.
  rationale: Ang tuwirang salin ay nagpapanatili sa buong saklaw at tensiyong teolohikal ng parirala sa halip na paliitin ito sa isang interpretasyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Kaya” at “sinasabi ko sa inyo” para sa natural na daloy, habang pinanatili ang mga pangunahing metapora at pasibong anyo ng Griyego.
