  to: 'Sinabi ni Jesus sa kanila, “Hindi ba ninyo kailanman nabasa sa mga Kasulatan: ‘Ang batong itinakwil ng mga tagapagtayo—ito ang naging batong-panulok[a]. Ito ay mula sa Panginoon[b], at kamangha-mangha sa ating paningin’?”'
