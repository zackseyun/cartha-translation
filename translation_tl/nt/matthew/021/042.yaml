id: MAT.21.42
reference: Matthew 21:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: tl
  text: 'Sinabi ni Jesus sa kanila, “Hindi ba ninyo kailanman nabasa sa mga Kasulatan: ‘Ang batong itinakwil ng mga tagapagtayo—ito ang naging batong-panulok[a]. Ito ay mula sa Panginoon[b], at kamangha-mangha sa ating paningin’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pangulong bato sa panulok” o “batong pang-ibabaw”; literal, “ulo ng panulok.”
    reason: lexical_alternative
  - marker: b
    text: Griyego, “mula sa Panginoon”; ang Hebreong pinagmulan ng sipi ay may “mula sa PANGINOON” (YHWH).
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: Sinabi
  rationale: Ang makasaysayang pangkasalukuyan sa Griyego ay likas na isinasalaysay sa nakaraang panahunan sa modernong Tagalog.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Hindi ba ninyo kailanman nabasa
  rationale: Pinananatili ng “kailanman” ang diin ng Οὐδέποτε at ang retorikal na puwersa ng tanong.
- source_word: γραφαῖς
  choice: mga Kasulatan
  rationale: Tumutukoy ito sa kinikilalang mga banal na kasulatan ng Israel, hindi lamang sa pangkalahatang mga sulatin.
- source_word: ἀπεδοκίμασαν
  choice: itinakwil
  rationale: Ipinahihiwatig ng pandiwa ang pagtanggi sa isang bagay matapos itong ituring na hindi karapat-dapat; malinaw at marangal ang “itinakwil.”
- source_word: οἱ οἰκοδομοῦντες
  choice: mga tagapagtayo
  rationale: Ginagamit ang pandiwari bilang pangngalan; pinananatili nito ang talinghaga ng pagtatayo.
- source_word: οὗτος
  choice: ito
  rationale: Pinananatili ang mariing pagtukoy sa mismong batong itinakwil.
- source_word: ἐγενήθη εἰς
  choice: naging
  rationale: Malinaw nitong ipinapahayag ang pagbabago tungo sa bagong katayuan ng bato.
- source_word: κεφαλὴν γωνίας
  choice: batong-panulok
  rationale: Ito ang malinaw at karaniwang tawag sa pangunahing batong nasa panulok, habang inilalahad sa talababa ang literal na anyo at posibleng alternatibo.
- source_word: παρὰ κυρίου
  choice: Mula sa Panginoon
  rationale: Ang παρά na may genitive ay nagpapahayag dito ng pinagmulan; pinananatili rin ang κύριος bilang “Panginoon.”
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: kamangha-mangha sa ating paningin
  rationale: Pinananatili nito ang matayog na himig at ang larawang nakapaloob sa “sa ating mga mata/paningin” nang natural sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa κεφαλὴ γωνίας
  choice: batong-panulok
  alternative: pangulong bato sa panulok; batong pang-ibabaw
  rationale: Hindi tiyak kung ang larawan ay pangunahing bato sa sulok o batong nasa itaas. Ang “batong-panulok” ang pinakakilala at malamang na kahulugan, ngunit hindi itinatago ang leksikal na posibilidad sa talababa.
- issue: Pagsasalin ng κύριος sa sipi mula sa Awit
  choice: Panginoon
  alternative: PANGINOON (YHWH)
  rationale: κύριος ang nasa tekstong Griyego, kaya “Panginoon” ang nasa pangunahing teksto. Gayunman, ang pinagmulan nitong Hebreo ay may banal na pangalang YHWH, kaya tahasang binabanggit iyon sa talababa.
- issue: Mesiyanikong paglalapat ng larawan ng bato
  choice: Panatilihin ang talinghaga nang walang paliwanag na idinagdag
  alternative: Tahasan sa pangunahing teksto na tukuyin ang bato bilang Mesiyas o si Jesus
  rationale: Inilalapat ni Jesus sa sarili niya ang sipi ayon sa konteksto, ngunit hindi tahasang pinapangalanan ng mismong pangungusap ang bato. Ang hindi pagdaragdag ng paliwanag ay nagpapanatili sa anyo at teolohikal na puwersa ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kasulatan,” “itinakwil,” at “batong-panulok” upang mapanatili ang matayog na himig ng sipi nang hindi nagiging lipas o sobrang teknikal.
