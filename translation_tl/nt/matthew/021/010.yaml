  source_fidelity: Tapat ang salin sa temporal na genitive absolute ("nang pumasok siya"), sa pangalan ng lugar, sa saklaw ng "ang buong lungsod," at sa direktang tanong. Ang "nayanig" ay lehitimong pagpapanatili ng larawan ng ἐσείσθη habang ang talababa ay wastong nagpapaliwanag ng matalinghagang konteksto. Ang pagbanggit sa "mga tao" sa huling sugnay ay likas na pagpapalinaw ng metonimiya ng lungsod na nagsasalita at hindi nagdaragdag ng nilalaman sa tanong.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang "nayanig ang buong lungsod" ay mauunawaan bilang malakas na kolektibong pagkagambala; nakatutulong ang talababa upang maiwasang ikulong ito sa pisikal na pagyanig. Ang "at sinabi ng mga tao" ay malinaw at idiomatiko sa Filipino.
  terminology: Wasto at karaniwan ang "Jerusalem" at "lungsod." Walang problemang teolohikal o di-kinakailangang interpretatibong dagdag. Ang lexical-alternative footnote ay nakaangkla nang wasto sa "nayanig."
