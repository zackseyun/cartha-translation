id: MAT.21.10
reference: Matthew 21:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: tl
  text: At nang pumasok siya sa Jerusalem, nayanig[a] ang buong lungsod at sinabi ng mga tao, “Sino ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagkagulo” o “nabalisa.” Ang salitang Griyego ay literal na maaaring tumukoy sa pagyanig, ngunit dito ay inilalarawan nito ang matinding pagkabalisa o pagkagulo ng mga tao sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: nang pumasok siya
  rationale: Isinasalin ang genitive absolute bilang likas na sugnay na temporal; hindi nito ipinapalagay kung kasabay o katatapos lamang ng pagpasok ang reaksiyon.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: ἐσείσθη
  choice: nayanig
  rationale: Pinananatili ang larawang ‘pagyanig’ ng pandiwang σείω habang natural ding naipahihiwatig ang matinding pagkabalisa o pagkagulo ng lungsod.
- source_word: πᾶσα ἡ πόλις
  choice: ang buong lungsod
  rationale: Likas na Filipino para sa kolektibong pagtukoy sa lahat ng Jerusalem at sa mga naninirahan dito.
- source_word: λέγουσα
  choice: at sinabi ng mga tao
  rationale: Bagaman ‘lungsod’ ang gramatikal na gumagawa ng pagsasalita, sa Filipino ay nililinaw ng metonimikong ‘mga tao’ na ang mga naninirahan ang nagsalita; hindi ginagawang ‘nagtanong’ upang mapanatili ang literal na gamit ng λέγω.
- source_word: Τίς ἐστιν οὗτος;
  choice: Sino ito?
  rationale: Direkta at natural; hindi idinaragdag ang ‘lalaki’ na wala sa Griyego.
theological_decisions:
- issue: Literal o matalinghagang puwersa ng reaksiyon ng lungsod
  choice: nayanig
  alternative: nagkagulo; nabalisa
  rationale: Sa konteksto, inilalarawan ang matinding kolektibong reaksiyon sa pagpasok ni Jesus, hindi tahasang lindol. Ang ‘nayanig’ ay nagpapanatili sa talinghaga at sa posibleng diin ng pinagmulang salita nang hindi nilulutas nang labis ang larawan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘lungsod’ sa halip na mas pormal o makalumang ‘lunsod.’
