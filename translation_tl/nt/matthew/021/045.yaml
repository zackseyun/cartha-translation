id: MAT.21.45
reference: Matthew 21:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: tl
  text: Nang marinig ng mga punong pari at mga Fariseo ang kanyang mga talinghaga, nalaman nilang tungkol sa kanila ang sinasabi niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinggil sa kanila.” Naunawaan nilang sila ang tinutukoy ng mga talinghaga. Isinasalin ito ng ilan nang mas interpretibo bilang “laban sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig
  rationale: Ang aorist participle ay likas na isinasalin bilang sugnay na panahunan; malinaw at natural sa modernong Tagalog ang “Nang marinig.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag ito sa nakatataas na pamunuang pari at hindi nagpapahiwatig na sabay-sabay na maraming may katungkulang pinakapunong pari.
- source_word: Φαρισαῖοι
  choice: mga Fariseo
  rationale: Ginamit ang nakaugaliang transliterasyon sa Tagalog para sa pangalang pantangi ng pangkat na ito.
- source_word: παραβολὰς
  choice: mga talinghaga
  rationale: Ito ang kinikilalang salin sa Tagalog para sa matalinghagang mga salaysay at pahayag ni Jesus.
- source_word: ἔγνωσαν
  choice: nalaman
  rationale: Ipinahahayag ng aorist ng γινώσκω ang pagkilala o pagkaunawa nila sa sandaling iyon; natural na naihahatid ito ng “nalaman.”
- source_word: περὶ αὐτῶν
  choice: tungkol sa kanila
  rationale: Ang περί na may genitive ay karaniwang nangangahulugang “tungkol sa” o “hinggil sa”; hindi nito tahasang sinasabi ang mas matinding “laban sa kanila.”
- source_word: λέγει
  choice: ang sinasabi niya
  rationale: Pinananatili nito ang aspektong nagpapatuloy ng present tense habang natural na umaayon sa di-tuwirang pahayag sa Tagalog.
theological_decisions:
- issue: Kung tahasang ilalarawan na mapanuligsa o laban sa mga pinuno ang mga talinghaga ni Jesus
  choice: tungkol sa kanila ang sinasabi niya
  alternative: laban sa kanila ang sinasabi niya
  rationale: Ipinahihiwatig ng konteksto na pinupuna sila, ngunit ang περὶ αὐτῶν ay literal na “tungkol sa kanila.” Pinananatili ng salin ang pahiwatig nang hindi dinaragdagan ang mismong sinabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “punong pari,” “Fariseo,” at “talinghaga” bilang pamilyar na mga katawagang biblikal; iniwasan ang labis na pormal o makalumang ayos.
