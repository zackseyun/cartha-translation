id: MAT.21.27
reference: Matthew 21:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: tl
  text: Sumagot sila kay Jesus, “Hindi namin alam.” Sinabi rin niya sa kanila, “Hindi ko rin sasabihin sa inyo kung sa anong awtoridad ko ginagawa ang mga ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Sumagot
  rationale: Ang aorist participle ay nagpapakilala sa kanilang tugon; natural sa modernong Tagalog ang finite verb na “Sumagot” nang hindi dinaragdagan ang diwa.
- source_word: Οὐκ οἴδαμεν
  choice: Hindi namin alam
  rationale: Tuwirang ipinapahayag ang kawalan ng kaalaman. Ang “namin” ang angkop na anyong eksklusibo sapagkat kausap nila si Jesus.
- source_word: ἔφη
  choice: Sinabi
  rationale: Karaniwan at hindi mabigat na pandiwa sa pagsasalita, na tapat sa payak na gamit ng Griyego.
- source_word: καὶ αὐτός
  choice: rin niya
  rationale: 'Ipinakikita ang katumbas na pagtugon ni Jesus: kung paanong hindi sila sumagot, hindi rin niya sasabihin sa kanila.'
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Hindi ko rin sasabihin sa inyo
  rationale: Bagaman present ang λέγω, ang pahayag ay isang pagtangging magbigay ng sagot; ang “hindi ko rin sasabihin” ang natural na Tagalog at pinananatili ang reciprocal force ng οὐδέ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: kung sa anong awtoridad
  rationale: Pinananatili ng “awtoridad” ang ideya ng lehitimong karapatan o kapahintulutang kumilos, samantalang ang “sa anong” ay malapit sa anyo ng ἐν ποίᾳ.
- source_word: ταῦτα
  choice: ang mga bagay na ito
  rationale: Pinananatili ang plural na demonstrative at ang pagtukoy nito sa mga kilos ni Jesus na pinagtatalunan.
- source_word: ποιῶ
  choice: ginagawa ko
  rationale: Ang aspektong pangkasalukuyan ay natural na naihahayag sa “ginagawa ko,” na tumutukoy sa mga kilos ni Jesus sa kontekstong ito.
theological_decisions:
- issue: Diwa ng ἐξουσία sa tugon ni Jesus
  choice: awtoridad
  alternative: karapatan; kapangyarihan
  rationale: Sa pagtatalo, ang usapin ay ang lehitimong batayan at pinagmulan ng pagkilos ni Jesus, hindi lamang ang kakayahan niyang kumilos. Hindi rin nilulutas ng salin kung kanino nagmula ang awtoridad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “awtoridad,” isang karaniwang hiram na salita sa kasalukuyang Filipino, upang mapanatili ang juridical at teolohikal na saklaw ng ἐξουσία. Walang kailangang talababa sa talatang ito.
