  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: tl
  text: 'Nangyari ito upang matupad ang sinabi sa pamamagitan ng propeta[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang sinabi ng propeta.” Mas literal sa Griyego ang “sa pamamagitan ng propeta,” na nagbibigay-diin sa propeta bilang tagapamagitan ng pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ito
  rationale: Ang panghalip na isahang neutral ay tumutukoy sa kabuuan ng pangyayaring kagagawan lamang.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahina lamang ang pang-ugnay na puwersa nito rito; sapat na ang likas na daloy ng pangungusap sa Filipino, at ang pagdaragdag ng “ngayon” o “ngunit” ay maaaring magbigay ng di-kailangang temporal o pagsalungat na diwa.
- source_word: γέγονεν
  choice: nangyari
  rationale: Likas at kasalukuyang Filipino para sa pangyayaring tinutukoy ng pormulang pangkatuparan.
- source_word: ἵνα πληρωθῇ
  choice: upang matupad
  rationale: Pinananatili ng “upang” ang layunin o bungang diwa ng ἵνα, habang ang “matupad” ay angkop sa pasibong anyo at sa konteksto ng pahayag ng propeta.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Maikli at likas na pagsasalin ng substantibong pasibong participle; pinananatili nitong nakatuon ang pangungusap sa naunang ipinahayag.
- source_word: διὰ τοῦ προφήτου
  choice: sa pamamagitan ng propeta
  rationale: Malinaw nitong pinananatili ang diwa ng propeta bilang tagapamagitan ng pahayag, sa halip na ipakitang sa kaniya lamang nagmula ang salita.
- source_word: λέγοντος
  choice: ':'
  rationale: Sa Filipino, likas na ginagampanan ng tutuldok ang tungkulin ng participle na nagpapakilala sa tuwirang sipi sa susunod na talata. Ang tahasang “na nagsasabi” ay mabigat at di-likas dito.
theological_decisions:
- issue: Katuparan at pamamagitan ng propeta
  choice: “ang sinabi sa pamamagitan ng propeta”
  alternative: “ang sinabi ng propeta”
  rationale: Pinananatili ng napiling anyo ang tunay na diwa ng διά na ang propeta ang tagapamagitan ng naunang pahayag, nang hindi tahasang nagdaragdag ng pinagmulan ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang pormulang “upang matupad” at iniwasan ang lipas na “nangyari nga ito” o “nagkatotoo.”
