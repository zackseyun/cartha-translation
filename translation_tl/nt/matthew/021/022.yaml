translation:
  language: tl
  text: At tatanggapin ninyo ang anumang hingin ninyo sa panalangin[a] nang may pananampalataya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang nananalangin.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sumasampalataya.” Maaari ring “nang may pagtitiwala”; ipinahihiwatig ng participio sa Griyego ang pananampalataya kasabay ng paghiling sa panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: anuman ang
  rationale: 'Likas na komprehensibong pahayag ito sa Tagalog at pinananatili ang bukás na saklaw ng ekspresyong Griyego: anumang bagay na hihingin.'
- source_word: ἂν αἰτήσητε
  choice: hingin ninyo
  rationale: Ang ἄν kasama ng aorist subjunctive ay bahagi ng di-tiyak na sugnay na nagsisimula sa πάντα ὅσα. Sapat na likas sa Tagalog ang “anuman ang hingin ninyo” nang hindi pilit na dinaragdagan ng modal na salita.
- source_word: ἐν τῇ προσευχῇ
  choice: sa panalangin
  rationale: Tuwirang katumbas ito na natural sa modernong Tagalog at hindi kailangang gawing tiyak ang artikulong Griyego.
- source_word: πιστεύοντες
  choice: na nananampalataya
  rationale: Pinananatili nito ang participial na ugnayan sa paghiling at ipinahihiwatig na ang pananampalataya ay kasabay ng pananalangin, nang hindi ito ginagawang tahasang kondisyong “kung.”
- source_word: λήμψεσθε
  choice: tatanggapin ninyo
  rationale: Likas at marangal na salin ito ng future form ng λαμβάνω; hindi kailangang katawanin nang bukod ang middle morphology rito.
theological_decisions:
- issue: Ugnayan ng pananampalataya sa tinutugong panalangin
  choice: na nananampalataya
  alternative: kung nananampalataya kayo
  rationale: Participio ang gamit sa Griyego, hindi tahasang kondisyunal na sugnay. Pinananatili ng salin ang malinaw na kaugnayan ng panalangin at pananampalataya nang hindi nilulutas ang teolohikal na tensiyon hinggil sa saklaw at paraan ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “anuman ang hingin ninyo” para sa komprehensibong saklaw, at iniwasang gawing tahasang “kung” ang participio upang mapanatili ang anyo at teolohikal na tensiyon ng Griyego.
