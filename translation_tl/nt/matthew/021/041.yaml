  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang mga kausap ang nagsasalita kay Jesus, ang masasamang umuupa ay pupuksain, ang ubasan ay ipauupa sa iba, at ibibigay ng mga iyon ang ani sa mga takdang panahon. Gayunman, ang “nang kasindak-sindak” ay mas tumutukoy sa pagiging nakatatakot kaysa sa idiomatikong diin ng Κακοὺς κακῶς. Mas tumpak at natural ang “nang lubusan,” habang ipinapaliwanag sa talababa ang paglalaro ng magkaugnay na salita.'
  naturalness: Malinaw at marangal ang daloy. Ang “sa mga takdang panahon” ay mas tuwiran kaysa “sa kani-kanilang takdang panahon,” na maaaring magpahiwatig ng magkakaibang panahon para sa bawat magsasaka. Ang binagong talababa sa pagpapaupa ay mas eksakto at mas natural kaysa sa alternatibong “ipagkakatiwala.”
  terminology: Ang “ubasan,” “pauupahan,” “magsasaka,” at “mga bunga” ay angkop sa talinghaga at sa modernong Filipino Tagalog. Pinananatili ng “pupuksain” ang lawak ng ἀπολέσει nang hindi tinutukoy ang paraan ng paghatol.
