base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Lubusan niyang pupuksain ang masasamang taong iyon,[a] at pauupahan niya ang ubasan sa ibang mga magsasaka,[b] na magbibigay sa kanya ng mga bunga sa mga takdang panahon.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, magkaugnay ang mga salitang isinaling “masasamang” at “lubusan,” na nagpapatingkad sa hatol. Maaari ring isalin: “Pupuksain niya nang masama ang masasamang taong iyon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “iparirenta niya ang ubasan sa ibang mga nangungupahang magsasaka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “na magbibigay sa kanya ng ani sa mga angkop na panahon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present sa salaysay; mas natural sa modernong Tagalog ang pangnagdaan.
- source_word: Κακοὺς κακῶς
  choice: nang kasindak-sindak ang masasamang taong iyon
  rationale: Pinananatili nito ang matinding paghatol at ang pag-uugnay ng kasamaan ng mga tao sa kakila-kilabot nilang sasapitin, bagaman hindi likas ulitin sa Tagalog ang magkaugnay na pang-uri at pang-abay ng Griyego.
- source_word: ἀπολέσει
  choice: pupuksain
  rationale: Ipinahahayag nito ang tiyak at matinding pagwasak nang hindi tinutukoy ang isang partikular na paraan ng pagpatay o kaparusahan.
- source_word: τὸν ἀμπελῶνα
  choice: ang ubasan
  rationale: Karaniwang salin ito at pinananatili ang larawang pang-agrikultura ng talinghaga.
- source_word: ἐκδώσεται
  choice: pauupahan
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pagpapaupa ng lupain sa mga magsasakang nangungupahan.
- source_word: ἄλλοις γεωργοῖς
  choice: sa ibang mga magsasaka
  rationale: Natural at malinaw itong tawag sa mga naglilinang ng ubasan; ipinahihiwatig na ng “pauupahan” na sila ay mga nangungupahan.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: magbibigay sa kanya
  rationale: Saklaw nito ang pagbibigay ng nararapat na bahagi mula sa inupahang ubasan nang hindi ginagawang salaping bayad ang ani.
- source_word: τοὺς καρποὺς
  choice: ng mga bunga
  rationale: Pinananatili nito kapuwa ang literal na larawang pang-agrikultura at ang posibleng mas malawak na pahiwatig ng bunga.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: sa kani-kanilang takdang panahon
  rationale: Ipinahahayag nito ang maramihang mga angkop o itinakdang panahon kung kailan dapat ibigay ang mga bunga.
theological_decisions:
- issue: Tindi at uri ng paghatol sa sagot ng mga kausap ni Jesus
  choice: Pupuksain niya nang kasindak-sindak ang masasamang taong iyon
  alternative: Dadalhin niya sa masamang wakas ang masasamang taong iyon
  rationale: Pinananatili ng salin ang tindi ng paghatol at ang pandiwang “pupuksain,” ngunit hindi nito nililimitahan ang pahayag sa isang tiyak na doktrina tungkol sa paraan o pangwakas na kalagayan ng kaparusahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ubasan,” “pauupahan,” at “mga bunga” upang manatiling buhay ang larawang pang-agrikultura, habang ang “nang kasindak-sindak” ay naghahatid ng diin ng Griyegong paglalaro sa magkaugnay na salita nang hindi lumilikha ng pilit na Tagalog.
