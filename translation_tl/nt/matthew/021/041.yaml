  to: Sinabi nila sa kanya, “Lubusan niyang pupuksain ang masasamang taong iyon,[a] at pauupahan niya ang ubasan sa ibang mga magsasaka,[b] na magbibigay sa kanya ng mga bunga sa mga takdang panahon.”[c]
  rationale: Pinalitan ang idiomatikong hindi gaanong angkop na “nang kasindak-sindak” ng “lubusan” upang maihatid ang mariing hatol nang walang hindi sinasabing detalye tungkol sa paraan nito. Inayos din ang mga talababa at ang pariralang pangpanahon upang maging mas tapat sa konteksto ng pagpapaupa at mas malinaw sa modernong Tagalog.
