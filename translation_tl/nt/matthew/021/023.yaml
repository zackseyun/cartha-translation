id: MAT.21.23
reference: Matthew 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: tl
  text: Pagdating niya sa templo[a], lumapit sa kanya ang mga punong pari at ang mga matatanda ng bayan habang nagtuturo siya. Sinabi nila, “Sa anong awtoridad mo ginagawa ang mga bagay na ito? At sino ang nagbigay sa iyo ng awtoridad na ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa buong bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Pagpasok niya
  rationale: Ang genitive absolute ay may temporal na diwa. Likas sa Tagalog ang “Pagpasok niya” at ipinahihiwatig nitong pumasok siya sa nasasakupan ng templo nang hindi dinaragdagan ang detalye.
- source_word: ἱερὸν
  choice: templo
  rationale: Tumutukoy ang ἱερόν sa buong bakuran o nasasakupan ng templo, hindi lamang sa panloob na santuwaryo. “Templo” ang malinaw at karaniwang salin; ipinaliliwanag sa talababa ang lawak ng kahulugan.
- source_word: προσῆλθον αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at likas na ipinapahayag ng “lumapit sa kanya” ang pisikal na paglapit na nasa προσέρχομαι.
- source_word: διδάσκοντι
  choice: habang nagtuturo siya
  rationale: Ipinakikita ng present participle na kasabay ng pagtuturo ni Jesus ang paglapit ng mga pinuno.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Sa kontekstong ito, tumutukoy ang pangmaramihan sa mga pangunahing pinunong makapari, hindi sa maraming taong sabay-sabay na humahawak sa katungkulan ng kataas-taasang pari.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: mga nakatatanda sa bayan
  rationale: Pinananatili nito ang katawagang tumutukoy sa kinikilalang matatandang lider ng sambayanan nang hindi sila basta tinatawag na pangkalahatang “mga pinuno.”
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Sa anong awtoridad
  rationale: Ipinahahayag nito ang batayan ng karapatang kumilos. Ang “awtoridad” ay malinaw na tumutukoy sa lehitimong kapahintulutan, hindi lamang sa lakas o kapangyarihan.
- source_word: ταῦτα ποιεῖς
  choice: mo ginagawa ang mga bagay na ito
  rationale: Pinananatili ng pangkasalukuyang anyo ang tuwirang paghamon tungkol sa mga ginagawa ni Jesus sa kontekstong iyon.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: sino ang nagbigay sa iyo ng awtoridad na ito
  rationale: Likas na isinasalin ng payak na nagdaang aspekto ang tiyak na gawa ng pagbibigay ng awtoridad.
theological_decisions:
- issue: Kahulugan ng ἐξουσία sa paghamon ng mga pinuno
  choice: awtoridad
  alternative: karapatan; kapangyarihan; pahintulot
  rationale: Ang tanong ay tungkol sa lehitimong batayan at pinagmulan ng karapatan ni Jesus na kumilos at magturo sa templo, hindi lamang sa taglay niyang lakas. Pinananatili ng “awtoridad” ang institusyonal at teolohikal na bigat nang hindi nagpapasok ng karagdagang doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punong pari,” “mga nakatatanda sa bayan,” at “awtoridad” bilang mga katawagang madaling maunawaan ngunit angkop sa pormal na pagtatalo sa templo.
