    issue: “mga nakatatanda sa bayan”
    rationale: Hindi sapat na malinaw na ito ay katawagan para sa kinikilalang mga elder/lider; maaari itong mangahulugang matatandang residente ng bayan. Ang “mga matatanda ng bayan” ay mas idiomatiko at tapat sa tungkuling tinutukoy ng πρεσβύτεροι.
  - severity: low
    issue: “Pagpasok niya sa templo”
    rationale: Posible ang salin, ngunit ang ἐλθόντος αὐτοῦ εἰς τὸ ἱερόν ay pangunahing nagsasaad na dumating siya sa loob/ng lugar ng templo. Mas neutral ang “Pagdating niya sa templo” at iniiwasan ang labis na pagtuon sa aktong pagpasok.
