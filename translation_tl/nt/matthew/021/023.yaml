  to: Pagdating niya sa templo[a], lumapit sa kanya ang mga punong pari at ang mga matatanda ng bayan habang nagtuturo siya. Sinabi nila, “Sa anong awtoridad mo ginagawa ang mga bagay na ito? At sino ang nagbigay sa iyo ng awtoridad na ito?”
  rationale: Binago ang katawagan para sa πρεσβύτεροι upang malinaw na tumukoy sa mga kinikilalang elder ng bayan, hindi lamang sa mga taong may edad. Ginawang mas neutral ang pambungad na temporal na parirala. Napanatili ang lahat ng mahalagang kahulugan, ang pormal na rehistro, ang dalawang magkakaugnay na tanong, at ang talababa tungkol sa lawak ng ἱερόν.
