  source_fidelity: 'Tumpak na naipapahayag ng salin ang mga umuupang magsasaka, ang pagkakita nila sa anak, ang usapan nila sa loob ng pangkat, ang pagkilala sa kanya bilang tagapagmana, at ang dalawang magkasunod na panukala: patayin siya at kunin ang kanyang mana. Ang “angkinin” ay angkop sa kontekstuwal na puwersa ng σχῶμεν nang hindi itinatanggi ng talababa ang mas literal na saklaw nito.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “mga magsasakang umuupa” ay nauunawaan bilang tenant farmers, at ang “Halikayo, patayin natin siya” ay may marangal na rehistrong angkop sa salaysay at sa sama-samang panawagan.
  terminology: Ang “tagapagmana” at “mana” ay magkakatugma at wasto para sa κληρονόμος at κληρονομία. Ang “ang anak” ay wastong nananatili sa antas ng talinghaga at hindi nagdaragdag ng interpretasyong Kristolohikal sa pangunahing teksto.
