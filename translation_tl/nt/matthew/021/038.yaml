id: MAT.21.38
reference: Matthew 21:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: tl
  text: Ngunit nang makita ng mga magsasakang umuupa ang anak, sinabi nila sa isa’t isa, “Ito ang tagapagmana. Halikayo, patayin natin siya at angkinin ang kanyang mana.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mapasaatin ang kanyang mana”; sa konteksto, ang ibig sabihin ay angkinin o kunin nila iyon para sa kanilang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: mga magsasakang umuupa
  rationale: Sa konteksto ng talinghaga, sila ang mga umuupa at nagsasaka ng ubasan ng may-ari, hindi lamang mga karaniwang manggagawang bukid. Nililinaw ng parirala ang kanilang papel nang hindi sila tinatawag na mga katiwala.
- source_word: ἰδόντες
  choice: nang makita
  rationale: Likas na naipapahayag ng sugnay na panahunan ang aorist participle at ang pagkakasunod-sunod ng mga pangyayari.
- source_word: τὸν υἱόν
  choice: ang anak
  rationale: Tuwirang isinasalin ang may artikulong pangngalan nang hindi nagdaragdag ng tahasang panghalip na paari; malinaw na sa konteksto kung kaninong anak siya.
- source_word: ἐν ἑαυτοῖς
  choice: sa isa’t isa
  rationale: Ipinahihiwatig nito na nag-usap-usap ang mga magsasaka sa loob ng sarili nilang pangkat.
- source_word: κληρονόμος
  choice: tagapagmana
  rationale: Ito ang karaniwan at malinaw na terminong Filipino para sa taong may karapatang tumanggap ng mana.
- source_word: δεῦτε
  choice: Halikayo
  rationale: Natural na panawagang nag-aanyaya sa pangkat na sama-samang gawin ang kasunod na balak.
- source_word: ἀποκτείνωμεν
  choice: patayin natin
  rationale: Pinananatili nito ang hortatory subjunctive at ang tuwirang puwersa ng pandiwa nang hindi dinaragdagan ang legal na kulay ng salitang 'paslangin' o 'ipapatay.'
- source_word: σχῶμεν
  choice: angkinin
  rationale: Bagaman literal na mula sa pandiwang 'magkaroon,' sa konteksto ng pagpatay sa tagapagmana ay tumutukoy ito sa pagkuha ng mana para sa kanilang sarili. Natural na ipinahahayag ng 'angkinin' ang gayong sapilitang pag-aari.
- source_word: κληρονομίαν αὐτοῦ
  choice: ang kanyang mana
  rationale: Tuwirang pinananatili ang kahulugan ng κληρονομία at ang panghalip na αὐτοῦ, at malinaw ang ugnayan nito sa 'tagapagmana.'
theological_decisions:
- issue: Ang parabolikong pagtukoy sa anak
  choice: Isinalin lamang bilang “ang anak,” nang hindi tahasang kinikilala sa mismong talata bilang si Jesus.
  alternative: Gumamit ng mas interpretatibong pananalita upang ipahiwatig na kumakatawan kay Jesus ang anak.
  rationale: Malinaw sa mas malawak na salaysay ni Mateo ang ugnayan ng talinghaga kay Jesus, ngunit nasa antas ng kuwento ang pananalita ng talatang ito. Pinananatili ng payak na salin ang teolohikal na pahiwatig nang hindi isinasama ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” bilang natural na maramihang panawagan at “mga magsasakang umuupa” upang mailarawan ang katayuang panlipunan ng γεωργοί nang hindi gumagamit ng teknikal o makalumang katawagan.
