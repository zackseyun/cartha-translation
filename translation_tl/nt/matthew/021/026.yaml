    rationale: Bagaman nauunawaan, mas tuwiran ang “itinuturing ng lahat si Juan bilang propeta,” na malinaw na ang lahat ay ang kumikilala.
  revised_text: Ngunit kung sasabihin nating[a], ‘Mula sa mga tao,’ natatakot tayo sa karamihan, sapagkat itinuturing ng lahat si Juan bilang propeta.
