  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: tl
  text: Ngunit kung sasabihin nating[a], ‘Mula sa mga tao,’ natatakot tayo sa karamihan, sapagkat itinuturing ng lahat si Juan bilang propeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagmula sa mga tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ngunit kung sasabihin nating
  rationale: Likas sa modernong Tagalog ang kondisyunal na anyong ito at pinananatili nito ang posibilidad na pinag-iisipan ng mga nagsasalita.
- source_word: Ἐξ ἀνθρώπων
  choice: Mula sa tao
  rationale: Ipinapahayag nito ang pinagmulan sa tao bilang kabaligtaran ng ‘mula sa langit’; generic ang ‘tao’ at hindi tumutukoy lamang sa kalalakihan.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: natatakot tayo sa mga tao
  rationale: Sa konteksto, ang ὄχλος ay ang nagkakatipong madla; mas natural sa Tagalog ang ‘mga tao’ kaysa ‘karamihan’ sa tuwirang pahayag na ito.
- source_word: πάντες
  choice: nilang lahat
  rationale: Malinaw nitong pinananatili ang saklaw na ang buong madla ang may ganitong pagkilala kay Juan.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: itinuturing nilang lahat na propeta si Juan
  rationale: Ang ‘itinuturing ... na’ ay natural na katumbas ng idyomang ἔχω + layon + ὡς, na nagsasaad ng pagkilala o pagtingin sa isang tao bilang isang bagay.
- source_word: Ἰωάννην
  choice: Juan
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
theological_decisions:
- issue: Ang kaibahan ng makalangit at pantaong pinagmulan sa ἀνθρώπων
  choice: Mula sa tao
  alternative: Galing sa mga tao / Nagmula sa tao
  rationale: Pinananatili ng ‘Mula sa tao’ ang maikli at matalas na pagsalungat sa ‘mula sa langit’ nang hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- issue: Ang pagkilala ng madla kay Juan
  choice: itinuturing nilang lahat na propeta si Juan
  alternative: kinikilala nilang lahat si Juan bilang propeta
  rationale: Iniuulat lamang nito ang pananaw ng madla, gaya ng Griyego, nang hindi nagdaragdag ng doktrinal na pagpapasiya o paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang ‘mga tao’ para sa madla sa ikalawang sugnay, habang ‘tao’ ang generic na pinagmulan sa pagsalungat sa ‘langit.’
