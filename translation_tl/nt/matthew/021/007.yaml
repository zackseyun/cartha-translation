  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: tl
  text: Dinala nila ang inahing asno at ang batang asno, ipinatong sa mga ito ang kanilang mga balabal, at umupo siya sa mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “umupo siya sa mga balabal” na ipinatong sa mga hayop.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  choice: Dinala nila
  rationale: Ang aorist ng ἄγω ay maaaring mangahulugang ‘dinala’ o ‘inakay.’ Sa kontekstong ito, natural sa Filipino ang ‘dinala’ at malinaw na ipinahahayag na iniharap ng mga alagad ang mga hayop kay Jesus.
- source_word: τὴν ὄνον
  choice: ang inahing asno
  rationale: Ang ὄνος ay asno, at ang pambabaeng artikulo ay tumutukoy rito bilang inahin. Ang tahasang ‘inahing asno’ ay natural sa Filipino at nililinaw ang pagkakaugnay nito sa batang asno.
- source_word: τὸν πῶλον
  choice: ang batang asno
  rationale: Ang πῶλος ay batang hayop; sa konteksto, batang asno. Mas malinaw ito sa karaniwang mambabasa kaysa sa salitang ‘bisiro,’ na maaari ring ipakahulugang batang kabayo.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: ipinatong sa mga ito ang kanilang mga balabal
  rationale: Ang ἱμάτια ay mga panlabas na kasuotan o balabal. Ang ‘kanilang’ ay likas na ipinahihiwatig ng konteksto bilang mga balabal ng mga alagad. Pinananatili ng ‘mga ito’ ang plural na pagtukoy sa dalawang hayop.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: umupo siya sa ibabaw ng mga iyon
  rationale: Plural ang αὐτῶν at maaaring tumukoy sa mga hayop o sa mga balabal. Pinananatili ng salin ang plural at ang tunay na kalabuan ng Griyego sa halip na tahasang pumili ng isang referent.
theological_decisions:
- issue: Ang tinutukoy ng panghuling plural na αὐτῶν
  choice: Panatilihin sa pangunahing teksto ang plural na ‘sa ibabaw ng mga iyon.’
  alternative: ‘umupo siya sa ibabaw ng mga balabal’ o ‘umupo siya sa isa sa mga hayop’
  rationale: Sintaktiko at pasalaysay ang kalabuan, hindi isang usaping dapat lutasin sa pamamagitan ng pagpapakahulugan sa pangunahing teksto. Maaaring tumukoy ang panghalip sa mga hayop o sa mga balabal; ipinapaliwanag sa talababa ang karaniwang pag-unawa nang hindi binabago ang anyo ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘inahing asno’ at ‘batang asno’ para sa katumpakan at agarang pagkaunawa. Ang ‘mga iyon’ ay sadyang nagpapanatili sa plural at sa kalabuan ng huling panghalip sa Griyego.
