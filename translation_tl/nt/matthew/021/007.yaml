    issue: Hindi gaanong idiomatiko ang “umupo siya sa ibabaw ng mga iyon.”
    rationale: Bagaman literal na masasalamin nito ang ἐπάνω, ang karaniwang Filipino ay “umupo sa” kapag ang kahulugan ay pag-upo sa ibabaw ng isang bagay o hayop. Hindi kailangan ang “sa ibabaw” upang mapanatili ang kahulugan o ang kalabuan ng plural na panghalip.
  revised_text: Dinala nila ang inahing asno at ang batang asno, ipinatong sa mga ito ang kanilang mga balabal, at umupo siya sa mga iyon.[a]
