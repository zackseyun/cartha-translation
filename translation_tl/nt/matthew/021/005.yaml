base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: tl
  text: Sabihin ninyo sa anak na babae ng Sion, “Narito, dumarating sa iyo ang iyong hari, maamo[a] at nakasakay sa isang asno, at sa isang batang hayop[b], ang inakay ng isang hayop na pantrabaho.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahinahon” o “mapagpakumbaba.” Ang Griyegong πραΰς ay maaaring mangahulugang “maamo,” “mahinahon,” o “mapagpakumbaba,” at umaalingawngaw sa pananalita ng Zacarias 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Pinananatili ni Mateo ang magkaugnay na dalawang paglalarawan sa hayop: “sa isang asno, at sa isang batang hayop, ang inakay ng isang hayop na pantrabaho.”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Sabihin ninyo
  rationale: Pinananatili ang lakas ng pangmaramihang pautos at likas itong pakinggan sa makabagong Filipino.
- source_word: τῇ θυγατρὶ Σιών
  choice: sa anak na babae ng Sion
  rationale: Pinananatili ang propetikong personipikasyon sa halip na gawing tahasang ‘mga taga-Sion’ o ‘Jerusalem.’
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Isang likas at tuwirang panawag-pansin sa Filipino na hindi gumagamit ng makalumang pananalita.
- source_word: ὁ βασιλεύς σου
  choice: ang iyong hari
  rationale: Tuwirang pinananatili ang pagmamay-ari at ang maharlika o mesiyanikong diwa.
- source_word: ἔρχεταί σοι
  choice: dumarating sa iyo
  rationale: Ipinahahayag ang masiglang kasalukuyang pagdating na nasa pandiwang Griyego.
- source_word: πραῢς
  choice: maamo
  rationale: Saklaw ng ‘maamo’ ang kahinahunan at kawalan ng marahas na pagmamataas; inilalagay sa talababa ang tunay na alternatibong ‘mapagpakumbaba.’
- source_word: ἐπιβεβηκὼς
  choice: nakasakay
  rationale: Natural sa Filipino at ipinahahayag ang kalagayan ng isang nakasampa at nakaupo sa sinasakyang hayop.
- source_word: ἐπὶ ὄνον
  choice: sa isang asno
  rationale: Ang ‘asno’ ang malinaw at karaniwang salin ng ὄνος sa dignipikadong biblikal na Filipino.
- source_word: πῶλον
  choice: isang batang asno
  rationale: Mas malinaw sa karaniwang mambabasa kaysa ‘bisiro,’ at ipinakikita ng konteksto na batang hayop na mula sa hayop na pantrabaho ang tinutukoy.
- source_word: υἱὸν ὑποζυγίου
  choice: na anak ng hayop na pantrabaho
  rationale: Pinananatili ang Semitikong ‘anak’ at ang mas malawak na diwa ng hayop na ginagamit sa pagpasan o paghila, nang hindi basta ipinapalit ang ‘inakay ng asno.’
theological_decisions:
- issue: Sipi mula sa Zacarias 9:9 at kung dapat itugma sa ibang anyo ng propesiya
  choice: 'Pinanatili ang sariling Griyegong pananalita ni Mateo: ‘maamo ... nakasakay sa isang asno, at sa isang batang asno, na anak ng hayop na pantrabaho.’'
  alternative: Gamitin ang ‘mapagpakumbaba’ at/o pagsamahin ang dalawang pariralang tumutukoy sa hayop bilang iisang payak na pahayag.
  rationale: Dapat katawanin ng salin ang aktuwal na anyo ng sipi sa Mateo, hindi ang isang pinagtugmang bersiyon ng Zacarias. Pinananatili rin ang dobleng parirala tungkol sa mga hayop dahil nasa tekstong Griyego ito, habang hindi ipinapasya sa salin kung paano eksaktong magkakaugnay ang dalawang paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang propetikong personipikasyong ‘anak na babae ng Sion’ at ang sadyang magkatabing paglalarawan sa mga hayop, kahit bahagyang hindi karaniwan ang anyo nito sa pang-araw-araw na pananalita.
