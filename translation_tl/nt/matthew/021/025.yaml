id: MAT.21.25
reference: Matthew 21:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: tl
  text: '“Saan nagmula ang bautismo ni Juan? Mula sa langit[a] o mula sa mga tao[b]?” Nag-usap-usap sila sa isa’t isa: “Kung sasabihin nating, ‘Mula sa langit,’ sasabihin niya sa atin, ‘Kung gayon, bakit hindi kayo naniwala sa kanya?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa Diyos”; ang “mula sa langit” ay isang magalang na paraan ng pagtukoy sa banal na pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: Ang “mula sa mga tao” ay tumutukoy sa pantao lamang na pinagmulan, bilang kabaligtaran ng pinagmulan mula sa langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: bautismo
  rationale: Karaniwang tumutukoy ang βάπτισμα sa ritwal o gawain ng pagbautismo. Ang “bautismo” ang natural at nakaugaliang salin dito at maaaring tumukoy sa bautismo o ministeryo ni Juan bilang kabuuan.
- source_word: τὸ Ἰωάννου
  choice: ni Juan
  rationale: Ipinakikilala ng genitibo ang bautismo bilang kaugnay at pag-aari ni Juan. Ang “ni Juan” ang likas na anyo nito sa Tagalog.
- source_word: πόθεν
  choice: saan ito nagmula
  rationale: Nagtatanong ang πόθεν tungkol sa pinagmulan. Malinaw at natural sa modernong Tagalog ang “saan ito nagmula.”
- source_word: ἐξ οὐρανοῦ
  choice: sa langit
  rationale: Pinananatili nito ang literal na larawan at ang magalang na di-tuwirang pagtukoy sa banal na pinagmulan.
- source_word: ἐξ ἀνθρώπων
  choice: sa mga tao
  rationale: Tumutukoy ang ἀνθρώπων sa sangkatauhan sa pangkalahatan, hindi lamang sa mga lalaki. Pinananatili ng “sa mga tao” ang paghahambing sa makalangit na pinagmulan.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: nag-usap-usap sila
  rationale: Ipinahihiwatig ng parirala ang patuloy na pagsasanggunian at pangangatwiran nila sa isa’t isa. Natural na ipinapahayag ito ng “nag-usap-usap sila.”
- source_word: λέγοντες
  choice: na sinasabi
  rationale: Ipinapasok nito ang mismong nilalaman ng kanilang pag-uusap habang pinananatili ang participial na ugnayan sa naunang pandiwa.
- source_word: Ἐὰν εἴπωμεν
  choice: Kung sasabihin nating
  rationale: Natural nitong inilalahad sa Tagalog ang kondisyonal na haka-haka tungkol sa posibleng sagot nila.
- source_word: ἐρεῖ ἡμῖν
  choice: sasabihin niya sa atin
  rationale: Pinananatili nito ang tuwirang pananalita at ang pag-uulit ng pandiwang “sabihin.”
- source_word: Διὰ τί οὖν
  choice: Kung gayon, bakit
  rationale: Ipinapakita ng “kung gayon” ang konklusyong ibabatay sa kanilang inaakalang sagot.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: hindi kayo naniwala sa kanya
  rationale: Sa kontekstong ito, ang πιστεύω na may datibo ay ang pagtanggap o paniniwala sa isang tao at sa kanyang mensahe. Pinakamalinaw dito ang “naniwala sa kanya.”
theological_decisions:
- issue: Kahulugan ng “mula sa langit” sa tanong
  choice: Panatilihin sa pangunahing teksto ang “sa langit.”
  alternative: mula sa Diyos
  rationale: Ang literal na pananalita ay nagpapanatili sa magalang na di-tuwirang pagtukoy sa banal na pinagmulan at hindi ginagawang tahasang interpretasyon ang ipinahihiwatig lamang ng Griyego.
- issue: Saklaw ng ἀνθρώπων sa paghahambing sa langit
  choice: Gamitin ang “sa mga tao” bilang pinagmulan sa tao.
  alternative: sa mga lalaki
  rationale: Hindi kasarian ang punto ng ἀνθρώπων kundi ang kaibahan ng pinagmulan sa tao at pinagmulan sa langit.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang nakaugaliang terminong “bautismo,” ang inklusibong “mga tao,” at malinaw na usapang tuwiran. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang nililinaw ng mga talababa.
