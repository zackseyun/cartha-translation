  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘panahon ng pamumunga’ bilang likas na ekspresyong agrikultural, at ‘mga magsasakang umuupa’ upang maipahayag ang papel ng γεωργοί ayon sa konteksto nang hindi pinapalitan ang larawan ng talinghaga.
