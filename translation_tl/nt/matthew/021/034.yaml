  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: tl
  text: Nang malapit na ang panahon ng pamumunga, isinugo niya ang kanyang mga lingkod[a] sa mga magsasakang umuupa[b] upang kunin ang kanyang mga bunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin.” Ang salitang Griego na doulous ay maaaring mangahulugang “mga lingkod” o “mga alipin.” Dito, “mga lingkod” ang ginamit dahil binibigyang-diin ng talinghaga ang kanilang papel bilang mga kinatawan ng may-ari.
    reason: lexical_alternative
  - marker: b
    text: O “mga magsasaka,” “mga umuupa,” o “mga nagtatanim ng ubas.” Ang salitang Griego na geōrgous ay tumutukoy sa mga nagsasaka o nagtatanim; ipinakikita ng konteksto na inuupahan nila ang ubasan ng may-ari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nang
  rationale: Ipinapahayag nito ang temporal na paglipat sa salaysay; hindi kailangang isalin nang hiwalay ang banayad na pang-ugnay na δέ upang maging natural sa Tagalog.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: malapit na ang panahon ng pamumunga
  rationale: Ang ἤγγισεν ay ‘lumapit/malapit na,’ ang καιρός ay ang angkop na panahon, at ang genitibong τῶν καρπῶν ay natural na naipapahayag bilang panahon ng pamumunga.
- source_word: ἀπέστειλεν
  choice: isinugo niya
  rationale: Ang ‘isinugo’ ay natural at marangal na salin ng pagpapadala ng mga kinatawan, nang hindi nagdaragdag ng teolohikal na kahulugan.
- source_word: τοὺς δούλους αὐτοῦ
  choice: ang kanyang mga lingkod
  rationale: Maaaring tumukoy ang δοῦλος sa mga alipin o lingkod. Pinili ang ‘mga lingkod’ dahil nakatuon dito ang salaysay sa kanilang tungkulin bilang mga kinatawan ng may-ari; inilalahad sa talababa ang ibang leksikal na posibilidad.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: sa mga magsasakang umuupa
  rationale: Ang γεωργοί ay mga tagapagsaka o magsasaka; nililinaw ng konteksto ng talinghaga na sila ang umuupa at nagsasaka sa ubasan ng ibang tao.
- source_word: λαβεῖν
  choice: upang kunin
  rationale: Pinananatili nito ang malawak na diwa ng λαμβάνω na ‘kunin/tanggapin’ nang hindi labis na tinutukoy ang paraan ng pagsingil.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: ang mga bunga na para sa kanya
  rationale: Pinananatili ang pangmaramihang ‘mga bunga’ at ang pag-aangkin ng αὐτοῦ, habang iniiwasan ang maaaring hindi natural o malabong ‘kanyang mga bunga’ sa Tagalog.
