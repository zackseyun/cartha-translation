source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: tl
  text: '“Pakinggan ninyo ang isa pang talinghaga: May isang may-ari ng lupain na nagtanim ng ubasan, nilagyan iyon ng bakod sa palibot[b], humukay roon ng pisaan ng ubas, at nagtayo ng isang tore[a]. Pagkatapos, pinaupahan niya ang ubasan sa mga magsasaka[c] at umalis.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang larawan ng pagtatanim ng ubasan, paglalagay ng bakod, paghuhukay ng pisaan ng ubas, at pagtatayo ng tore ay umaalingawngaw sa Isaias 5:1–2.
    reason: cross_reference
  - marker: b
    text: Maaari ring “nilagyan iyon ng halamang-bakod sa palibot.” Ang salitang Griyego ay maaaring tumukoy sa nakapalibot na harang gaya ng bakod o halamang-bakod.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ipinaupa niya ang ubasan sa mga magsasaka.” Tumutukoy ang pananalita sa pagpapaupa ng ubasan sa mga tagapagsakang maglilinang nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Pakinggan ninyo ang isa pang talinghaga
  rationale: Ang maramihang pautos na ἀκούσατε ay likas na ipinahahayag sa Filipino bilang “Pakinggan ninyo,” at ang “talinghaga” ang karaniwang katumbas ng παραβολή sa pagtuturo ni Jesus.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: May isang may-ari ng lupain
  rationale: Sa konteksto ng ubasan at mga nangungupahang magsasaka, malinaw at natural na ipinahahayag ng “may-ari ng lupain” ang papel ng οἰκοδεσπότης nang hindi mahigpit na kinokopya ang literal na “panginoon ng sambahayan.”
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: nagtanim ng ubasan
  rationale: Pinananatili nito ang tuwirang kilos ng φυτεύω at ang konkretong larawan ng ἀμπελών.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: nilagyan iyon ng bakod sa palibot
  rationale: Ang φραγμός ay maaaring bakod, halamang-bakod, o iba pang harang. Malinaw ang “bakod” ngunit hindi nito itinatakda ang materyales.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: humukay roon ng pisaan ng ubas
  rationale: Inilalarawan ng ὀρύσσω ang paghuhukay at ng ληνός ang pisaan ng ubas. Ang parirala ay konkreto at madaling maunawaan sa modernong Filipino.
- source_word: ᾠκοδόμησεν πύργον
  choice: nagtayo ng isang tore
  rationale: Ang πύργος ay “tore.” Hindi ginamit ang “toreng bantayan” dahil hindi tahasang binanggit sa Griyego ang gamit nito.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: pinaupahan niya ang ubasan sa mga magsasaka
  rationale: Ang gitnang anyo ng ἐκδίδωμι rito ay tumutukoy sa pagpapaupa, at ang γεωργοί ay mga magsasakang maglilinang sa ubasan. Nilinaw ang “ubasan” bilang tinutukoy ng panghalip upang maging natural sa Filipino.
- source_word: ἀπεδήμησεν
  choice: umalis papunta sa malayong lugar
  rationale: Ipinahihiwatig ng ἀποδημέω ang pag-alis mula sa sariling lugar para maglakbay. Pinananatili ng salin ang paglayo nang hindi nagdaragdag ng tiyak na destinasyon o bansang hindi binanggit.
theological_decisions:
- issue: Ang alusyon sa larawan ng ubasan sa Isaias 5:1–2
  choice: Panatilihin sa pangunahing teksto ang konkretong larawan ng ubasan, bakod, pisaan, at tore; ilagay sa talababa ang paliwanag sa alusyon.
  alternative: Gumamit ng mas tradisyonal na pananalita o tahasang banggitin ang Isaias sa pangunahing teksto.
  rationale: Malakas ang pagkakahawig sa Isaias 5, ngunit hindi ito tahasang tinukoy sa mismong pangungusap. Iniiwasan ng salin na gawing lantad sa pangunahing teksto ang isang intertekstuwal na pahiwatig na nananatiling implicit sa Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “talinghaga,” “ubasan,” “pisaan ng ubas,” at “tore” upang mapanatili ang biblikal at agrikultural na larawan nang hindi nagiging lipas o labis na teknikal.
