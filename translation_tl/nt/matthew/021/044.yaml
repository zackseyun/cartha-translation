  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: tl
  text: At[a] ang sinumang mahulog sa batong ito ay madudurog; ngunit ang sinumang mabagsakan nito ay dudurugin nito nang lubusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa ilang manuskrito ng Mateo, bagaman may katumbas ito sa Lucas 20:18.
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin ang huling parirala na “pagkakalatin nito na parang ipa” o “gagawin nitong pulbos.” Ang pandiwa ay maaaring maglarawan ng lubos na pagdurog o ng pagpapakalat na gaya ng ipa sa pagtatahip.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: ang bumagsak
  rationale: Ang articular participle ay tumutukoy sa sinumang tao sa pangkalahatan; natural sa Tagalog ang isahang pariralang “ang bumagsak” at napapanatili nito ang anyong kasabihan.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: sa batong ito
  rationale: Tuwirang ipinapahayag ang ugnayang panlunan at pinananatili ang konkretong larawan ng λίθος bilang “bato.”
- source_word: συνθλασθήσεται
  choice: ay madudurog
  rationale: Ipinahihiwatig ng future passive ang matinding pagkabasag na sasapitin ng tao. Ang “madudurog” ay malinaw at natural, ngunit hindi nito inuulit ang natatanging larawan ng kasunod na λικμήσει.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ngunit ang sinumang bagsakan nito
  rationale: Ipinakikita ng sugnay na ang bato na ngayon ang bumabagsak. Ang “sinumang bagsakan nito” ay natural na Tagalog at pinananatili ang bukás at di-tiyak na pagtukoy ng relative construction na may ἄν.
- source_word: λικμήσει
  choice: ay pagliliparin nitong parang ipa
  rationale: Ang λικμάω ay may larawang mula sa pagtatahip—pagpapalipad o pagpapakalat na gaya ng ipa—at maaari ring magpahiwatig ng lubos na pagdurog. Pinananatili ng salin ang mas matingkad at natatanging larawan nito kaysa gawing kapareho lamang ng συνθλασθήσεται.
- source_word: αὐτόν
  choice: ang sinumang
  rationale: Ang masculine singular pronoun ay tumutukoy pabalik sa di-tiyak na isahang tao. Sa Tagalog, na walang kasariang gramatikal sa ganitong panghalip, naipapahayag ito nang tumpak sa “ang sinumang” bilang simuno ng pandiwang “bagsakan.”
theological_decisions:
- issue: Larawan ng bato at paghatol
  choice: Panatilihin ang konkretong “bato” at ang dalawang magkaibang larawan ng kapahamakan nang walang tahasang pagkilala sa bato sa loob ng talata.
  alternative: Tahasang tukuyin ang bato bilang Mesiyas o si Jesus, o pag-isahin ang dalawang pandiwa bilang pangkalahatang “wawasakin.”
  rationale: Ipinapaliwanag ng nakapaligid na konteksto ang larawan ng bato, ngunit ang talata mismo ay nasa anyong kasabihan. Pinananatili ng salin ang tindi at tensiyon ng dalawang kilos nang hindi nagdaragdag ng interpretasyong teolohikal.
- issue: Pagkakaiba ng συνθλασθήσεται at λικμήσει
  choice: Isalin bilang “madudurog” at “pagliliparin ... parang ipa.”
  alternative: Gamitin ang “madudurog” o “wawasakin” para sa dalawang pandiwa.
  rationale: Pinananatili nito ang pagkakaiba ng pagkabasag dahil sa pagkahulog sa bato at ng mas matingkad na paglipad o pagkalat na kaugnay ng pagtatahip kapag ang bato naman ang bumagsak.
- issue: Katayuang tekstuwal ng talata
  choice: Isama ang talata sa pangunahing teksto at ilagay sa talababa ang mahalagang variant.
  alternative: Alisin ang talata sa pangunahing teksto o lagyan ito ng mga bracket.
  rationale: Kasama ang talata sa ibinigay na SBLGNT text ngunit may malinaw na tanda ng tekstuwal na pag-aalinlangan; ang talababa ay tapat na nagpapaalam na wala ito sa ilang sinaunang manuskrito ng Mateo at may katumbas sa Lucas 20:18.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bagsakan” upang likas na ipakita ang pagbabaligtad ng direksiyon ng pagbagsak, at ang “parang ipa” upang mapanatili ang natatanging larawang maaaring taglay ng λικμήσει. Ang bawat talababa ay may katugmang pananda sa pangunahing teksto.
