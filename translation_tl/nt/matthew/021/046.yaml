  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: tl
  text: Kahit sinisikap nilang dakpin si Jesus, natakot sila sa mga tao, sapagkat itinuturing ng mga tao na propeta si Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: Gusto man nilang
  rationale: 'Ipinahahayag ng kasalukuyang participle ang patuloy na hangaring dakpin siya. Ginamit ang “man” upang natural na maipakita sa Filipino ang pagsalungat sa pangunahing kilos: gusto nila siyang dakpin, ngunit napigilan sila ng takot.'
- source_word: κρατῆσαι
  choice: dakpin
  rationale: Sa mapanlabang konteksto, tumutukoy ito sa sapilitang paghuli sa isang tao, hindi lamang sa paghawak sa kaniya.
- source_word: ἐφοβήθησαν
  choice: natakot sila
  rationale: Payak at natural na salin ng aorist deponent, nang hindi ipinipilit kung ang diin ay sa pagsisimula o sa mismong kalagayan ng pagkatakot.
- source_word: τοὺς ὄχλους
  choice: sa mga tao
  rationale: Natural itong tawag sa Filipino sa mga pangkat ng taong naroon; iniiwasan ang mas mabigat at di-gaanong karaniwang “mga pulutong.”
- source_word: ἐπεὶ εἰς
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan kung bakit natakot ang mga pinuno.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: itinuturing ng mga ito na isang propeta si Jesus
  rationale: Ang idyomang Griyego ay nangangahulugang ituring o kilalanin ang isang tao bilang isang bagay. Nililinaw ng “mga ito” na ang mga tao ang may ganitong palagay, at inuulit ang “si Jesus” upang maiwasan ang malabong sunod-sunod na panghalip.
- source_word: προφήτην
  choice: isang propeta
  rationale: Ang pangngalan ay walang pantukoy at inilalagay si Jesus, ayon sa pananaw ng mga tao, sa kategorya ng isang propeta.
theological_decisions:
- issue: Paglalahad sa pananaw ng mga tao kay Jesus bilang προφήτην nang hindi dinaragdagan o nililimitahan ang kaniyang pagkakakilanlan
  choice: itinuturing ng mga ito na isang propeta si Jesus
  alternative: kinikilala ng mga ito si Jesus bilang propeta
  rationale: Inilalahad lamang ng talata ang pagtataya ng mga tao. Hindi nito sinasabing propeta lamang si Jesus, ni ginagawa nitong ganap na pahayag ng tagapagsalaysay ang pananaw nila.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dakpin” para sa sapilitang paghuli at “mga tao” bilang likas na katumbas ng mga pulutong sa kontekstong ito. Ang pag-uulit sa pangalang “Jesus” ay sadyang ginawa para luminaw ang mga tinutukoy ng mga panghalip.
