  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: tl
  text: Sumagot siya, “Ayoko.” Ngunit nang maglaon, nagbago ang isip niya[a] at pumunta siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsisi siya” o “nagbago ang loob niya.” Maaaring kasama sa salitang Griyego ang panghihinayang na humahantong sa pagbabago ng pasiya o pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: sumagot siya
  rationale: Karaniwang pormula ito sa salaysay. Likas sa modernong Tagalog na gawing tahasang pandiwa ang participle.
- source_word: Οὐ θέλω
  choice: Ayoko
  rationale: Tuwiran at natural itong pagpapahayag ng personal na pagtanggi o kawalan ng pagnanais, nang hindi ito pinatitindi sa ganap na pagtangging gaya ng “Hindi ako pupunta.”
- source_word: ὕστερον
  choice: nang maglaon
  rationale: Malinaw nitong ipinapahayag na nangyari ang kasunod na pagkilos pagkaraan ng ilang panahon.
- source_word: μεταμεληθεὶς
  choice: nagbago ang isip niya
  rationale: Ipinahahayag nito ang pagbabago ng pasiya na humantong sa pagsunod, habang pinananatiling bukas ang kalakip na diwa ng pagsisisi o panghihinayang.
- source_word: ἀπῆλθεν
  choice: pumunta siya
  rationale: Sa konteksto, tumutukoy ito sa pagpunta upang gawin ang ipinag-utos, hindi lamang sa pag-alis.
theological_decisions:
- issue: Diwa ng μεταμεληθεὶς sa talinghaga
  choice: nagbago ang isip niya
  alternative: nagsisi siya; nagbago ang loob niya
  rationale: Ang pokus ng talata ay ang pagtalikod sa unang pagtanggi at ang kasunod na pagsunod. Ang “nagsisi” ay maaaring magtakda ng mas tiyak na teolohikal na kahulugan kaysa sa hinihingi ng salitang Griyego, samantalang ang napiling salin ay nagpapanatili sa posibleng diwa ng panghihinayang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, natural, at marangal. Ginamit ang “Ayoko” bilang karaniwang tuwirang pagtanggi at ang “nang maglaon” upang mapanatili ang malinaw na daloy ng salaysay.
