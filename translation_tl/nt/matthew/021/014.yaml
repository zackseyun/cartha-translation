id: MAT.21.14
reference: Matthew 21:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: tl
  text: Lumapit sa kanya sa templo[a] ang mga bulag at mga pilay, at pinagaling niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na ἱερόν ay tumutukoy sa kabuuang lugar o nasasakupan ng templo, hindi partikular sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: Lumapit sa kanya
  rationale: Tumpak at likas na ipinahahayag ng “lumapit sa kanya” ang pagkilos patungo kay Jesus at ang ugnayang ipinakikita ng datibong αὐτῷ.
- source_word: τυφλοὶ
  choice: ang mga bulag
  rationale: Ang pang-uri ay ginagamit bilang pangngalang maramihan. Ang “mga bulag” ay maikli, malinaw, at likas sa modernong Tagalog.
- source_word: χωλοὶ
  choice: mga pilay
  rationale: Ang substantibong pang-uring χωλοί ay tumutukoy sa mga taong nahihirapang lumakad. Ang “mga pilay” ay karaniwan at hindi kasintindi ng ibang katawagang maaaring maging mapanakit.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Likas sa Tagalog ang “sa templo.” Ang ἱερόν ay tumutukoy sa kabuuang lugar o nasasakupan ng templo, hindi lamang sa panloob na santuwaryo; nililinaw ito sa talababa.
- source_word: ἐθεράπευσεν αὐτούς
  choice: pinagaling niya sila
  rationale: Sa salaysay ng mga himala sa Ebanghelyo, ang θεραπεύω ay malinaw na nangangahulugang magpagaling. Pinananatili rin ng “sila” ang maramihang layon.
theological_decisions:
- issue: Saklaw ng lugar na tinutukoy ng ἱερόν
  choice: sa templo, na inuunawa bilang kabuuang nasasakupan ng templo
  alternative: sa mga patyo ng templo
  rationale: Karaniwang tumutukoy ang ἱερόν sa mas malawak na kompleks o nasasakupan ng templo, hindi partikular sa panloob na santuwaryo. Pinananatili ng pangunahing salin ang likas na “sa templo,” habang inilalahad ng talababa ang eksaktong saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang bokabularyong “lumapit,” “mga bulag,” “mga pilay,” at “pinagaling,” at iniwasan ang labis na pormal o teknikal na pananalita.
