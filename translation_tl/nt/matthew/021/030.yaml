  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: tl
  text: Lumapit naman siya sa ikalawang anak at gayon din ang sinabi niya. Sumagot ito, “Pupunta po ako[a],” ngunit hindi siya pumunta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, mas literal na “Ako, ginoo.” Isa itong pinaikling tugon na nangangahulugang “Pupunta ako.” Ipinahahayag ng “po” ang paggalang; ang Griyegong κύριε ay maaari ring isaling “ginoo,” “panginoon,” o “amo.” Dito, magalang na tinatawag ng anak ang kaniyang ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Lumapit naman siya
  rationale: Ipinahahayag ng aorist participle ang paglapit ng ama, samantalang ang “naman” ay natural na nagmamarka ng pagpapatuloy at paglipat sa ikalawang anak.
- source_word: τῷ δευτέρῳ
  choice: sa ikalawang anak
  rationale: Ang “ikalawa” ang tahasang nasa Griyego; idinagdag ang “anak,” na malinaw na ipinahihiwatig ng konteksto, upang maging natural at hindi malabo sa Tagalog.
- source_word: ὡσαύτως
  choice: gayon din ang sinabi niya
  rationale: Tumutukoy ito sa kaparehong utos na sinabi sa naunang anak. Pinananatili ng salin ang maikli at malinaw na pagtukoy.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot ito
  rationale: Likas na katumbas ito sa Tagalog ng karaniwang Griyegong pariralang literal na “sumagot at nagsabi,” nang hindi inuulit ang magkaparehong diwa.
- source_word: Ἐγώ, κύριε
  choice: Pupunta po ako
  rationale: Ang Ἐγώ ay isang pinaikling pagsang-ayon na may ipinahihiwatig na kilos mula sa utos. Ang “po” ay likas na pagpapahayag ng magalang na pagtawag sa ama at iniiwasang bigyan ng di-angkop na teolohikal na himig ang κύριε.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: ngunit hindi siya pumunta
  rationale: Bagaman karaniwang pang-ugnay ang καί, malinaw ang pagsalungat dito ng ipinangako at ginawa; likas na ipinahahayag iyon ng “ngunit” sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa κύριε bilang tawag sa ama
  choice: po
  alternative: Panginoon; ginoo
  rationale: Ang kausap ay ang taong ama sa talinghaga, kaya ang κύριε ay magalang na tawag at hindi kinakailangang banal o mesianikong titulo. Sa makabagong Tagalog, ang “po” ang pinakanatural na naghahatid ng paggalang ng anak sa ama; nakatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “po” upang maging likas sa ugnayang anak at ama, habang pinanatili sa talababa ang literal na anyo at lawak ng kahulugan ng κύριε.
