  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: tl
  text: Nang makita iyon ng mga alagad,[a] namangha sila at nagtanong, “Paanong natuyo kaagad ang puno ng igos?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, walang tahasang layon ang “makita”; ipinahihiwatig ng konteksto na nakita nila ang punong igos na natuyo.
    reason: supplied_object
lexical_decisions:
- source_word: ἰδόντες
  choice: Nang makita iyon
  rationale: Isinalin ang aorist participle bilang sugnay na panahunan. Idinagdag ang “iyon” ayon sa konteksto, sapagkat walang tahasang layon sa Griyego ngunit tumutukoy ang pagkakita sa nangyari sa puno ng igos.
- source_word: οἱ μαθηταί
  choice: ng mga alagad
  rationale: Karaniwang katawagan sa mga tagasunod ni Jesus at likas na paksa ng sugnay sa Filipino.
- source_word: ἐθαύμασαν
  choice: namangha sila
  rationale: Ipinahahayag ng pandiwa ang matinding pagtataka o paghanga; natural at marangal sa makabagong Filipino ang “namangha.”
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ginawang koordinadong pandiwa ang participle upang maging natural ang daloy sa Filipino habang pinananatili ang kasabay na pagsasalita.
- source_word: Πῶς
  choice: Paanong
  rationale: Likas na panimula sa tanong tungkol sa paraan o dahilan ng biglang pangyayari, nang hindi ipinapaliwanag kung paano ito naganap.
- source_word: παραχρῆμα
  choice: kaagad
  rationale: Tuwirang ipinapahayag ang kahulugang “agad/kaagad” at ang pagtataka sa bilis ng pagkatuyo.
- source_word: ἐξηράνθη
  choice: natuyo
  rationale: Sa konteksto ng puno, likas na katumbas ito ng pagiging tuyot o lantang-lanta. Pinananatili ng anyong “na-” ang pangyayaring sumapit sa puno nang hindi tahasang tinutukoy ang gumawa.
- source_word: ἡ συκῆ
  choice: ang puno ng igos
  rationale: Tiyak na tumutukoy ang συκῆ sa punong igos; malinaw at karaniwang anyo ito sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paanong … kaagad” upang mapanatili ang diin ng tanong sa kagyat na pagkatuyo nang hindi nagdaragdag ng paliwanag na wala sa teksto.
