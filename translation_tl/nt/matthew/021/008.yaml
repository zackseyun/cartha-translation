base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: tl
  text: Karamihan sa pulutong[a] ay naglatag ng kanilang mga damit[b] sa daan; ang iba naman ay pumuputol ng mga sanga mula sa mga puno at inilalatag ang mga ito sa daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mas malaking bahagi ng pulutong.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga balabal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: karamihan sa mga tao
  rationale: Ang πλεῖστος kasama ng kolektibong ὄχλος ay tumutukoy sa karamihan o mas malaking bahagi ng nagkakatipong mga tao. Natural at malinaw sa modernong Tagalog ang “karamihan sa mga tao”; ipinahihiwatig ng “naman” sa kasunod na sugnay ang pag-usad at paghahati ng tagpo na minamarkahan ng δέ.
- source_word: ἔστρωσαν
  choice: inilatag
  rationale: Ang στρώννυμι rito ay paglalatag o paglaladlad ng isang bagay sa ibabaw ng daan. Tumpak at natural ang “inilatag.”
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: ang kanilang mga damit
  rationale: Malawak ang saklaw ng ἱμάτια at maaaring tumukoy sa mga kasuotan, lalo na sa panlabas na kasuotan. Sapat na ipinahahayag ng “kanilang” ang reflexive na ἑαυτῶν nang hindi nagiging mabigat ang Tagalog.
- source_word: ἐν τῇ ὁδῷ
  choice: sa daan
  rationale: Sa kontekstong ito, pisikal na daan ang ὁδός at idiomatikong ipinahahayag sa Tagalog bilang “sa daan.”
- source_word: ἄλλοι δὲ
  choice: ang iba naman
  rationale: Ipinakikilala nito ang isa pang pangkat sa loob ng maraming tao. Ang “naman” ay banayad na naghihiwalay sa dalawang kilos nang hindi ginagawang matindi ang pagsalungat.
- source_word: ἔκοπτον
  choice: pumuputol
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy na kilos sa tagpo. Naipahahayag ito ng aspektong kontemplatibo ng “pumuputol.”
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: mga sanga mula sa mga puno
  rationale: Tuwiran at malinaw na katumbas ito ng parirala, nang hindi tinutukoy kung anong uri ng puno ang hindi naman sinasabi ng teksto.
- source_word: καὶ ἐστρώννυον
  choice: at inilalatag ang mga iyon
  rationale: Pinananatili ng “inilalatag” ang nagpapatuloy na kilos ng imperfect at malinaw na itinutukoy ng “mga iyon” ang mga sanga.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga damit” bilang malawak at karaniwang katumbas ng ἱμάτια, habang inilagay sa talababa ang mas tiyak na “mga balabal.” Pinanatili ang pagkakaiba ng natapos na paglalatag sa unang sugnay at ng nagpapatuloy na pagputol at paglalatag sa ikalawa.
