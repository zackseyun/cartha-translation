base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: tl
  text: Kaya pumunta ang mga alagad at ginawa nila ayon mismo sa iniutos sa kanila ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinagubilin sa kanila.” Ang pandiwang Griyego ay maaaring tumukoy sa pagbibigay ng utos o mga tagubilin; sa kontekstong ito, tumutukoy ito sa mga tagubilin ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: umalis
  rationale: Ang aorist participle ay nagsasaad ng pagkilos bago ang kasunod na ginawa; natural itong isinasalaysay sa Filipino bilang “umalis.”
- source_word: δὲ
  choice: Kaya
  rationale: Nagpapatuloy ito sa salaysay at iniuugnay ang pagkilos ng mga alagad sa naunang tagubilin ni Jesus.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Karaniwan at malinaw na salin sa konteksto ng mga tagasunod ni Jesus sa mga Ebanghelyo.
- source_word: ποιήσαντες
  choice: ginawa nila
  rationale: Natural na Filipino para sa ikalawang aorist participle at malinaw na ipinapahayag ang pagsasagawa ng sinabi ni Jesus.
- source_word: καθὼς
  choice: ang mismong
  rationale: Sa pariralang “ginawa nila ang mismong…,” ipinahahayag nito ang ganap na pagsunod sa iniutos, na siyang diwa ng καθώς sa konteksto.
- source_word: συνέταξεν
  choice: iniutos
  rationale: Ang συντάσσω ay maaaring mangahulugang magbigay ng utos o tagubilin. Ang “iniutos” ay maikli, natural, at angkop sa awtoritatibong bilin ni Jesus, habang itinatala sa talababa ang mas banayad na alternatibo.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang katumbas ng di-tuwirang layon sa natural na ayos ng Filipino.
- source_word: ὁ Ἰησοῦς
  choice: ni Jesus
  rationale: Ang simuno ng pandiwang Griyego ay likas na ipinapahayag bilang tagaganap na may “ni” sa sugnay na pasibo ang anyo sa Filipino.
