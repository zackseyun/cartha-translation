revisions:
- from: Kaya umalis ang mga alagad at ginawa nila ang mismong iniutos sa kanila ni Jesus.[a]
  to: Kaya pumunta ang mga alagad at ginawa nila ayon mismo sa iniutos sa kanila ni Jesus.[a]
  rationale: Pinalitan ang “umalis” ng “pumunta” upang mas tumpak na maipahayag ang pagkilos ng mga alagad bilang pagtungo upang tuparin ang naunang bilin. Inayos ang parirala para malinaw na ang kanilang ginawa ay umaayon sa iniutos ni Jesus, habang pinananatili ang maikling salaysay at ang alternatibong leksikal sa talababa.
