    rationale: Ang “pinalabas mula sa ubasan” ay maaaring mangahulugang pinayagang o pinasunod lamang na lumabas at hindi sapat na naipapakita ang lakas ng ἐκβάλλω. Ang “pinalayas palabas ng ubasan” ay mas angkop na alternatibo, bagaman mas mahina pa rin kaysa “itinapon.”
