  source_fidelity: 'Tumpak ang pangunahing pagkakasunod ng Griyego: kinuha nila ang anak, itinapon siya palabas ng ubasan, at saka pinatay. Gayunman, ang kasalukuyang pasibong “itinapon sa labas ng ubasan” ay walang hayag na layon at maaaring mabasa nang hindi gaanong malinaw; ang “palabas ng ubasan” ay mas tuwirang naghahayag ng direksiyong ipinapakita ng ἐξέβαλον ἔξω τοῦ ἀμπελῶνος.'
  naturalness: Natural at marangal ang rehistro sa kabuuan, ngunit magiging higit na malinaw at likas ang aktibong ayos na may hayag na “siya” pagkatapos ng “itinapon nila.”
  terminology: Wasto ang “ubasan” para sa ἀμπελών at “pinatay” para sa ἀπέκτειναν. Ang alternatibong talababa na “pinalabas” ay mas mahina kaysa sa ἐκβάλλω sa kontekstong ito at hindi rin malinaw na katumbas ng pisikal na pagtatapon/pagpapalayas.
