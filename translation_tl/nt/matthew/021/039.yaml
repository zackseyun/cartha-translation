  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: tl
  text: At kinuha nila siya, itinapon nila siya palabas ng ubasan[a], at pinatay nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinalayas siya palabas ng ubasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: kinuha nila siya
  rationale: Ang aorist participle ng λαμβάνω ay naglalahad ng unang kilos bago ang kasunod na mga pandiwa. Ang “kinuha” ay tuwiran at hindi nagdaragdag ng puwersang maaaring ipahiwatig ng “dinakip.”
- source_word: ἐξέβαλον
  choice: itinapon sa labas
  rationale: Sa kontekstong ito, ang ἐκβάλλω kasama ng ἔξω ay tumutukoy sa marahas na pagpapalabas. Ang “itinapon sa labas” ay natural sa modernong Tagalog at pinananatili ang pisikal na kilos.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: sa labas ng ubasan
  rationale: Malinaw nitong ipinapakita ang paggalaw mula sa loob patungo sa labas ng ubasan.
- source_word: ἀμπελῶνος
  choice: ubasan
  rationale: Ang “ubasan” ang karaniwan at tiyak na katumbas ng ἀμπελών sa konteksto ng talinghaga.
- source_word: ἀπέκτειναν
  choice: pinatay
  rationale: Tuwiran at natural na salin ito ng ἀποκτείνω. Hindi ginamit ang “pinaslang” o “minurder” upang hindi magdagdag ng himig na higit sa tahasang sinasabi ng pandiwa.
theological_decisions:
- issue: Pagkakasunod ng pagpapalabas at pagpatay kumpara sa mga kahalintulad na salaysay
  choice: Pinanatili na itinapon muna ang anak sa labas ng ubasan at saka pinatay.
  alternative: Ipahiwatig na pinatay muna siya bago itinapon sa labas, upang iayon sa Marcos o Lucas.
  rationale: 'Tahasan ang pagkakasunod-sunod sa Griyego ng Mateo: λαβόντες … ἐξέβαλον … καὶ ἀπέκτειναν. Hindi ito pinag-isa o iniayon sa pagkakasunod sa ibang mga Ebanghelyo.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, malinaw, at marangal. Pinanatili ang maikling pagkakasunod-sunod ng tatlong kilos sa Griyego at iniwasan ang sobrang pormal o denominasyonal na pananalita.
