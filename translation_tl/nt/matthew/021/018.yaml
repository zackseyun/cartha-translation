  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: tl
  text: Maagang-maaga, habang bumabalik siya sa lungsod, nagutom siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: Maagang-maaga
  rationale: Tumutukoy ang pang-abay sa maagang bahagi ng umaga. Likas sa makabagong Tagalog ang “maagang-maaga” at malinaw nitong naipapahayag ang diin sa oras nang hindi ipinapalagay na bukang-liwayway mismo.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapahiwatig ng matinding pagsalungat. Sapat nang naipakikita ng ayos ng pangungusap sa Tagalog ang pagpapatuloy, kaya magiging di-likas at labis ang “ngunit” o “ngayon.”
- source_word: ἐπανάγων
  choice: habang bumabalik siya
  rationale: Ang kasalukuyang aktibong participle ay nagsasaad ng kilos na kasabay ng pangunahing pandiwa. Pinananatili ng “habang bumabalik siya” ang aspektong ito at ang diwang pagbabalik.
- source_word: εἰς τὴν πόλιν
  choice: sa lungsod
  rationale: Ipinahihiwatig ng εἰς ang pagkilos patungo o papasok sa lungsod. Sa pariralang “bumabalik ... sa lungsod,” likas at sapat ang “sa” nang hindi sinasabing nakapasok na siya roon.
- source_word: ἐπείνασεν
  choice: nagutom siya
  rationale: Likas na ipinapahayag ng “nagutom” ang pagdating ng gutom bilang pangyayari, kaya naisasalin ang posibleng ingressive na puwersa ng aorist nang hindi gumagamit ng matigas na “siya ay naging gutom.”
theological_decisions:
- issue: Ang implikasyong Kristolohikal ng pagkagutom ni Jesus
  choice: Tahasang ilarawan ang tunay niyang pagkagutom
  alternative: Palambutin o ipaliwanag ang pagkagutom bilang matalinghaga
  rationale: Inilalahad ng salaysay ang pagkagutom bilang tunay na karanasang pantao ni Jesus. Pinananatili ito ng payak na salin nang walang idinadagdag na paliwanag o doktrinang wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang di-kailangang panimulang pang-ugnay at ang makalumang balangkas na “siya ay.”
