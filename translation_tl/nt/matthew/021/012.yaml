  source_fidelity: 'Tapat ang salin sa SBLGNT: malinaw na isinasalin ang pagpasok ni Jesus sa mas malawak na bahagi ng templo (ἱερόν), ang pagpapaalis sa lahat ng nagtitinda at namimili, at ang pagtataob ng mga mesa at upuan. Ang panghalip na “roon” ay natural na tumutukoy pabalik sa “mga patyo ng templo” at hindi nagpapabago sa saklaw ng ikalawang ἱερόν.'
