id: MAT.21.12
reference: Matthew 21:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: tl
  text: At pumasok si Jesus sa mga patyo ng templo at pinalayas niya ang lahat ng nagtitinda at namimili roon.[a] Itinaob niya ang mga mesa ng mga nagpapalit ng salapi at ang mga upuan ng mga nagtitinda ng mga kalapati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa templo” o “sa nasasakupan ng templo.” Ang salitang Griyego ay tumutukoy sa mas malawak na kabuuan ng templo, hindi lamang sa panloob na santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: mga patyo ng templo
  rationale: Tumutukoy ito sa mas malawak na bakuran o mga nasasakupan ng templo, hindi partikular sa panloob na santuwaryo; malinaw rin dito kung saan nagaganap ang kalakalan.
- source_word: ἐξέβαλεν
  choice: pinalayas
  rationale: Likas at malinaw sa modernong Tagalog, at ipinahihiwatig ang mariin at mapagpasiyang pagpapaalis.
- source_word: πάντας
  choice: lahat
  rationale: Pinananatili ang tahasang saklaw ng Griyego sa lahat ng mga taong sangkot sa pagtitinda at pamimili.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: ang lahat ng nagtitinda at namimili
  rationale: Natural na Tagalog na tapat sa dalawang kasalukuyang pandiwaring naglalarawan sa mga taong gumagawa ng mga gawaing ito.
- source_word: τράπεζας
  choice: mga mesa
  rationale: Ito ang karaniwan at tuwirang kahulugan; sapat na nililinaw ng konteksto na ginagamit ang mga ito sa pagpapalit ng salapi.
- source_word: κολλυβιστῶν
  choice: mga nagpapalit ng salapi
  rationale: Malinaw na tumutukoy sa mga taong nagpapalit ng mga barya o salapi at natural pakinggan sa Tagalog.
- source_word: κατέστρεψεν
  choice: itinaob
  rationale: Angkop sa pagbaligtad ng mga mesa at upuan, masigla ngunit hindi ipinahihiwatig na winasak ang mga ito.
- source_word: καθέδρας
  choice: mga upuan
  rationale: Tuwirang katumbas na sapat ang lawak upang saklawin ang mga silya o luklukang ginamit ng mga nagtitinda.
- source_word: περιστεράς
  choice: mga kalapati
  rationale: Karaniwang tawag sa Tagalog sa ibong tinutukoy at angkop sa konteksto ng mga handog sa templo.
theological_decisions:
- issue: Saklaw ng ἱερόν kaugnay ng ginawa ni Jesus
  choice: Pumasok si Jesus sa mga patyo o mas malawak na bakuran ng templo, hindi partikular sa panloob na santuwaryo.
  alternative: Pumasok si Jesus sa templo, nang hindi tinutukoy kung aling bahagi.
  rationale: Pinananatili ng saling ito ang makasaysayan at pang-espasyong pagkakaiba ng ἱερόν sa ναός, nang hindi nagdaragdag ng aral na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga patyo ng templo” upang maipakita ang mas malawak na saklaw ng ἱερόν; iniwasan ang mas teknikal o arkitekturang salitang maaaring hindi agad maunawaan ng karaniwang mambabasa.
