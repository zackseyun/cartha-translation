  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: tl
  text: Kaya, kapag dumating ang may-ari[a] ng ubasan, ano ang gagawin niya sa mga magsasakang iyon[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “amo ng ubasan.” Ang salitang Griyego na kyrios ay madalas isaling “Panginoon,” ngunit dito ay tumutukoy ito sa may-ari ng ubasan sa loob ng talinghaga.
    reason: lexical_alternative
  - marker: b
    text: O “mga umuupang magsasaka.” Ipinakikita ng mas malawak na konteksto ng talinghaga na nangungupahan sila ng ubasan, bagaman ang salitang Griyego ay mas pangkalahatang nangangahulugang mga magsasaka o tagapagsaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Nagsisimula ito ng sugnay na tumutukoy sa inaasahang pagdating sa loob ng talinghaga. Likas sa Tagalog ang “kapag” at hindi nito ipinahihiwatig na paulit-ulit ang pangyayari.
- source_word: οὖν
  choice: kaya
  rationale: Ipinakikita nito na ang tanong ay bunga ng naunang salaysay. Mas natural sa kasalukuyang Tagalog ang “kaya” kaysa sa mas mabigat na “samakatuwid.”
- source_word: ἔλθῃ
  choice: dumating
  rationale: Ang aorist subjunctive pagkatapos ng ὅταν ay tumutukoy sa inaasahang pangyayari sa hinaharap. Ang “kapag dumating” ang likas na katumbas sa Tagalog.
- source_word: κύριος
  choice: may-ari
  rationale: Sa konteksto ng talinghaga, ang κύριος ay ang nagmamay-ari ng ubasan, hindi tuwirang titulong “Panginoon.” Malinaw at natural ang “may-ari.”
- source_word: ἀμπελῶνος
  choice: ubasan
  rationale: Karaniwang Tagalog na tawag sa vineyard at angkop sa kontekstong agrikultural.
- source_word: τί ποιήσει
  choice: ano ang gagawin niya
  rationale: Pinananatili nito ang tuwirang tanong tungkol sa magiging kilos ng may-ari.
- source_word: γεωργοῖς
  choice: mga magsasaka
  rationale: Ang γεωργός ay pangkalahatang tumutukoy sa magsasaka o tagapagsaka. Bagaman mga umuupang magsasaka sila ayon sa mas malawak na konteksto, hindi tahasang nakapaloob sa salitang Griyego ang pag-upa.
- source_word: ἐκείνοις
  choice: iyon
  rationale: Pinananatili ng “iyon” ang tiyak at bahagyang mapaglayong pagtukoy ng demonstratibong Griyego sa mga nasabing magsasaka.
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa loob ng talinghaga
  choice: may-ari
  alternative: panginoon o amo
  rationale: Ang agarang pariralang “ng ubasan” at ang papel ng tauhan sa salaysay ay tumutukoy sa nagmamay-ari ng ubasan. Iniiwasan ng “may-ari” ang di-kinakailangang pagpasok ng banal o kristolohikal na titulo, habang hindi itinatanggi ang mas malawak na simbolismo ng talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at likas pakinggan. Ginamit ang “kaya” at “kapag dumating” para sa maayos na daloy, at inilagay ang mga panandang talababa sa mismong mga salitang may leksikal na alternatibo.
