lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: iniwan niya sila
  rationale: Ipinahahayag nang natural sa Tagalog ang kilos na nauna sa pangunahing pandiwa, habang pinananatili ang payak na panghalip na tumutukoy sa mga taong kausap niya sa naunang konteksto.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: lumabas siya ng lungsod
  rationale: Malinaw at likas na ipinapahayag ang paglabas mula sa lungsod nang hindi ginagaya ang di-natural na pag-uulit ng Griyego.
- source_word: εἰς Βηθανίαν
  choice: patungong Betania
  rationale: Ang “patungong” ay natural na panandang direksiyon para sa εἰς at hindi nagpapahiwatig nang higit sa pagpunta sa lugar.
- source_word: ηὐλίσθη ἐκεῖ
  choice: doon nagpalipas ng gabi
  rationale: Tumpak at makabagong pagpapahayag ito ng panunuluyan o pagpapagabi roon; malinaw nitong naihahatid ang temporal na diwa ng αὐλίζομαι.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inilipat ang talababa sa pariralang “nagpalipas ng gabi,” na siyang katumbas ng salitang Griyegong may leksikal na alternatibo; ang pagkakabit nito sa “sila” sa English consultation layer ay hindi tumutugma sa nilalaman ng talababa.
