  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: tl
  text: At iniwan niya sila, lumabas siya ng lungsod patungong Betania at doon nagpalipas ng gabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “doon nanuluyan.”
