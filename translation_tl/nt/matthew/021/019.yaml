id: MAT.21.19
reference: Matthew 21:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: tl
  text: At nang makita niya ang isang puno ng igos sa tabi ng daan, nilapitan niya ito, ngunit wala siyang nakitang anuman sa puno kundi mga dahon lamang. Sinabi niya sa puno, “Nawa’y wala nang bungang magmula sa iyo magpakailanman.” At agad na natuyo ang puno ng igos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: isang puno ng igos
  rationale: Likas sa Tagalog ang tahasang “isang,” at maayos nitong ipinakikilala ang isang partikular na punong nakita ni Jesus nang hindi labis na idinidiin ang bilang.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: sa tabi ng daan
  rationale: Ipinahihiwatig ng pariralang lokatibo na nasa gilid o tabi ng daan ang puno; mas natural at angkop ito kaysa “nasa ibabaw ng daan.”
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: nilapitan niya iyon
  rationale: Malinaw na ipinapahayag ang paglapit ni Jesus sa puno at natural sa makabagong Tagalog.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: wala siyang natagpuan doon
  rationale: Ang “doon” ay natural na tumutukoy sa puno bilang kinaroroonan ng hinahanap, nang hindi gumagamit ng alanganing literal na “sa loob nito.”
- source_word: εἰ μὴ φύλλα μόνον
  choice: kundi mga dahon lamang
  rationale: Pinananatili ng “lamang” ang diin na walang anumang bunga at mga dahon lang ang naroon.
- source_word: λέγει αὐτῇ
  choice: Sinabi niya rito
  rationale: Isinaayos sa nakaraang panahunan ang makasaysayang pangkasalukuyan upang maging natural ang salaysay sa Tagalog; ang “rito” ay nagpapakitang sa puno nakatuon ang sinabi.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Huwag nang magkaroon pa ng bunga mula sa iyo magpakailanman
  rationale: Pinananatili ang diwang jussive o mapagpahayag na pagbabawal, ang larawang “mula sa iyo,” at ang panghabang-panahong bisa ng εἰς τὸν αἰῶνα.
- source_word: ἐξηράνθη
  choice: natuyo
  rationale: Karaniwang salitang Tagalog para sa punong nawalan ng sigla at pagkatubig; malinaw at hindi teknikal.
- source_word: παραχρῆμα
  choice: agad
  rationale: Tuwirang ipinahahayag ang dagliang pangyayari.
theological_decisions:
- issue: Lakas at anyo ng pahayag ni Jesus sa puno ng igos
  choice: 'Isinalin bilang jussive o mariing pagbabawal: “Huwag nang magkaroon pa ng bunga mula sa iyo magpakailanman.”'
  alternative: “Hindi ka na kailanman mamumunga” bilang isang tuwirang prediksyon o deklarasyon.
  rationale: Ang subjunctive na γένηται kasama ng Μηκέτι ay sumusuporta sa isang mariing pahayag ng permanenteng pagtigil. Pinananatili ng salin ang anyong ito nang hindi ipinapaliwanag sa talata ang posibleng simbolikong kahulugan ng pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang literal na ayos na magiging asiwa, ngunit pinanatili ang pag-uulit at solemneng lakas ng orihinal. Walang talababa dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilagay sa publikasyong teksto.
