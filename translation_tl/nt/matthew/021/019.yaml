  to: At nang makita niya ang isang puno ng igos sa tabi ng daan, nilapitan niya ito, ngunit wala siyang nakitang anuman sa puno kundi mga dahon lamang. Sinabi niya sa puno, “Nawa’y wala nang bungang magmula sa iyo magpakailanman.” At agad na natuyo ang puno ng igos.
