  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing daloy at mga detalye: isang puno ng igos sa tabi ng daan, paglapit, mga dahon lamang, at agarang pagkatuyo. Gayunman, ang “Huwag nang magkaroon pa ng bunga mula sa iyo” ay hindi ganap na idiomatiko at maaaring magmukhang direktang pagbabawal na kulang ang malinaw na paksa. Mas malinaw na jussive/imprecatory ang “Nawa’y wala nang bungang magmula sa iyo magpakailanman.”'
