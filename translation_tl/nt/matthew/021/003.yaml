  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: tl
  text: At kung may magsabi sa inyo ng anuman, sabihin ninyo, “Kailangan ng Panginoon[a] ang mga iyon,” at ipapadala niya agad ang mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “amo.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binanggit sa Griyego kung sino ang “niya”; pinakamalamang na ito ang taong kumausap sa mga alagad, na agad magpapadala sa mga hayop.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: kung may
  rationale: Likas na pariralang Filipino para sa bukás at di-tiyak na kondisyon na tumutukoy sa sinumang maaaring magsalita.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Pinananatili ang maramihang kausap, ang mga alagad.
- source_word: εἴπῃ τι
  choice: magsabi sa inyo ng anuman
  rationale: Malawak ang λέγω at τι; hindi ito nililimitahan sa pagtatanong o pagtutol lamang.
- source_word: ἐρεῖτε
  choice: sabihin ninyo
  rationale: Isinasalin ang future indicative na may puwersang tagubilin sa natural na pautos sa Filipino.
- source_word: Ὁ κύριος
  choice: ang Panginoon
  rationale: Pinananatili ang karaniwang titulong katumbas ng κύριος at ang posibleng kristolohikal na bigat nito, habang itinatala sa talababa ang kontekstuwal na posibilidad na 'amo.'
- source_word: αὐτῶν
  choice: ang mga iyon
  rationale: Tumutukoy sa dalawang hayop sa naunang konteksto. Mas natural sa Filipino ang 'mga iyon' kaysa gamitin ang panghalip na karaniwang inuukol sa tao.
- source_word: χρείαν ἔχει
  choice: kailangan ... ang mga iyon
  rationale: Natural at malinaw na Filipino para sa idyomang 'may pangangailangan sa kanila,' nang hindi dinaragdagan ang kahulugan.
- source_word: εὐθὺς
  choice: agad
  rationale: Tumpak at karaniwang salitang Filipino para sa agarang pagkilos.
- source_word: ἀποστελεῖ αὐτούς
  choice: ipapadala niya ... ang mga iyon
  rationale: Pinananatili ang payak na diwa ng 'ipadala' at ang di-binanggit na simuno ng pandiwa; hindi idinaragdag ang ideya ng pagbabalik o pagpapalaya.
theological_decisions:
- issue: Kahulugan at tinutukoy ng Ὁ κύριος
  choice: Panginoon
  alternative: amo
  rationale: Ang 'Panginoon' ay nagpapanatili kapuwa sa agarang pahayag ng awtoridad ni Jesus at sa posibleng bigat ng titulo. Gayunman, maaaring maunawaan ang κύριος sa karaniwang diwang 'amo,' kaya inilagay ang alternatibo sa talababa.
- issue: Di-binanggit na simuno ng ἀποστελεῖ
  choice: Pinanatiling 'niya' nang hindi pinapangalanan ang simuno
  alternative: Tahasan itong tukuying ang taong kumausap sa mga alagad ang magpapadala sa mga hayop
  rationale: Walang tahasang simuno sa Griyego. Pinananatili ng salin ang gramatikal na kalabuan, samantalang ipinapaliwanag sa talababa na ang taong kinausap ang pinakamalamang na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sabihin ninyo' bilang natural na tagubilin at 'mga iyon' para sa mga hayop. Iniwasan ang labis na pormal na 'may pangangailangan' at ang kolokyal na 'kaagad-agad.'
