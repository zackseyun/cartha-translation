  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: tl
  text: Mapagkunwari ka! Alisin mo muna ang biga[a] sa sarili mong mata, at saka ka makakakita nang malinaw upang alisin ang puwing[b] sa mata ng iyong kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tahilan” o “malaking bigang kahoy.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “munting piraso ng kahoy” o “munting hibla ng dayami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Mapagkunwari ka
  rationale: Tuwirang tawag na may matinding pagsaway. Likas sa makabagong Tagalog ang paglalagay ng “ka” sa ganitong pantawag.
- source_word: ἔκβαλε
  choice: Alisin mo
  rationale: Ang pautos na anyo ay pinananatili, at ang “alisin” ay natural para sa larawang may bagay na kailangang tanggalin sa mata.
- source_word: πρῶτον
  choice: muna
  rationale: Sa pautos na pangungusap, natural na ipinahahayag ng “muna” ang kinakailangang maunang hakbang.
- source_word: δοκόν
  choice: troso
  rationale: Tumutukoy sa isang napakalaking piraso ng kahoy, kaya malinaw na naipakikita ang eksaheradong paghahambing sa napakaliit na κάρφος. Ang mas teknikal na “tahilan” ay posibleng salin ngunit hindi gaanong karaniwan.
- source_word: ὀφθαλμοῦ
  choice: mata
  rationale: Karaniwan at tuwirang katumbas sa pisikal na talinghaga.
- source_word: διαβλέψεις
  choice: makakakita nang malinaw
  rationale: 'Pinananatili ang pinatinding diwa ng pandiwa: hindi lamang makakita kundi makakita nang malinaw.'
- source_word: ἐκβαλεῖν
  choice: upang alisin
  rationale: Inuulit ang “alisin” para mapanatili ang ugnayan sa naunang pautos at maipahayag ang layunin ng malinaw na pagkakita.
- source_word: κάρφος
  choice: puwing
  rationale: Natural na salitang Tagalog para sa maliit na butil o bagay na nakapasok sa mata; pinananatili nito ang matinding pagkakaiba sa “troso.”
- source_word: ἀδελφοῦ
  choice: iyong kapatid
  rationale: Pinananatili ang literal na relasyonal na katawagan ng Griyego nang hindi ito ginagawang mas malawak na “kapuwa” o “ibang tao.”
theological_decisions:
- issue: Saklaw ng relasyonal na katawagang ἀδελφοῦ
  choice: iyong kapatid
  alternative: iyong kapuwa / ibang tao
  rationale: Ang Griyego ay pang-isahang “kapatid na lalaki,” ngunit sa Tagalog ang “kapatid” ay likas na hindi nagpapahiwatig ng kasarian. Pinananatili nito ang ugnayang ipinahahayag ng teksto nang hindi nagdaragdag ng salitang “lalaki,” na magiging mabigat at hindi natural sa konteksto.
- issue: Kaugnayan ng malinaw na pagkakita at pag-aalis ng puwing
  choice: upang alisin
  alternative: at saka alisin
  rationale: 'Pinananatili ang infinitive na kaugnay ng “makakakita nang malinaw”: ang sariling pagwawasto ang nagbibigay ng malinaw na kakayahang tumulong, hindi isang ganap na pagbabawal sa pagtulong o pagtutuwid sa kapatid.'
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang “troso” sa pangunahing teksto dahil mas madaling maunawaan ng karaniwang mambabasa kaysa “tahilan,” habang pinananatili sa talababa ang mas espesipikong larawang pangkonstruksiyon. Ang “puwing” ay idiomatiko sa Tagalog at akma sa konteksto ng mata.
