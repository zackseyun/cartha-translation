  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: tl
  text: Hindi maaaring mamunga ng masamang bunga[b] ang mabuting puno[a], at hindi rin maaaring mamunga ng mabuting bunga ang bulok na puno[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malusog na puno.”
    reason: lexical_alternative
  - marker: b
    text: O “balakyot na bunga.”
    reason: lexical_alternative
  - marker: c
    text: O “nabubulok na puno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: mabuting puno
  rationale: Karaniwang nangangahulugang “mabuti” ang ἀγαθός. Pinananatili ng “mabuting puno” ang literal na larawan at ang pagpapahalagang moral nang hindi ito nililimitahan sa pisikal na kalusugan.
- source_word: οὐ δύναται ... ποιεῖν
  choice: hindi maaaring mamunga
  rationale: Malinaw na nagpapahayag ng kawalan ng kakayahan ang δύναται na may οὐ. Sa konteksto ng puno at bunga, likas sa Tagalog ang “mamunga” para sa ποιεῖν καρπούς at pinananatili nito ang mariing imposibilidad.
- source_word: καρποὺς πονηρούς
  choice: masamang bunga
  rationale: Maaaring tumukoy ang πονηρός sa masama, balakyot, o walang mabuting kalidad. Ang “masamang bunga” ay natural at sapat na malawak upang mapanatili kapuwa ang literal at moral na bisa ng talinghaga.
- source_word: οὐδέ
  choice: at hindi rin
  rationale: Ikinakabit ng οὐδέ ang ikalawang sugnay bilang katumbas na pagtanggi. Natural sa modernong Tagalog ang “at hindi rin” at malinaw nitong pinananatili ang paralelismo.
- source_word: δένδρον σαπρόν
  choice: bulok na puno
  rationale: Ang σαπρός ay tumutukoy sa bulok, nabubulok, o sirang bagay. Matingkad at tuwiran ang “bulok na puno,” at akma ito sa kongkretong larawan.
- source_word: καρποὺς καλούς
  choice: mabuting bunga
  rationale: Dito, inilalarawan ng καλός ang bungang may mabuting kalidad. Ang “mabuting bunga” ang natural na katapat ng “masamang bunga” at pinananatili ang balanse ng pangungusap.
theological_decisions:
- issue: Likas na katangian ng imposibilidad sa talinghaga
  choice: 'Isinalin bilang tahasang kawalan ng kakayahan: “hindi maaaring.”'
  alternative: “hindi karaniwang namumunga” o “hindi dapat mamunga”
  rationale: Tahasang nagsasaad ng kawalan ng kakayahan ang οὐ δύναται. Pinananatili ng salin ang mariing puwersa ng sinabi ni Jesus nang hindi nagdaragdag ng doktrinal na konklusyon lampas sa talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang payak na “mamunga” upang natural na maipahayag ang idyomang Griyego, habang pinanatili ang mahigpit na paralelismo at ang mariing “hindi maaaring.”
