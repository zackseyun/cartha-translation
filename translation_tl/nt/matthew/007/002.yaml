  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: tl
  text: Sapagkat kung paano kayo humatol, gayon din kayo hahatulan; at sa panukat na ginagamit ninyo, susukatin din kayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “susukatin din kayo pabalik.” Hindi tahasang nasa Griyego ang “pabalik,” bagaman ipinahihiwatig ito ng katumbasang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι ... κρίνετε ... κριθήσεσθε
  choice: hatol ... iginagawad ... igagawad
  rationale: Pinananatili ang ugnayan ng pangngalan at mga pandiwa sa Griyego sa pamamagitan ng iisang larangan ng salita. Ang “hatol” ay mas natural sa modernong Tagalog kaysa “paghatol” sa pariralang ito, at hindi nito nililimitahan ang diwa sa “pagkondena” lamang.
- source_word: μέτρῳ ... μετρεῖτε ... μετρηθήσεται
  choice: panukat ... ginagamit ... ipanunukat
  rationale: Ang “panukat” ay malinaw na tumutukoy sa pamantayang ginagamit sa iba. Ang “ipanunukat sa inyo” ay nagpapanatili sa talinghaga at sa pasibong anyo nang hindi tahasang dinaragdagan ng “pabalik.”
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: kung anong ... kung anong
  rationale: Likas na ipinapahayag sa Tagalog ang pamantayan o kasangkapang diwa ng dalawang magkatulad na parirala, habang pinananatili ang paralelismo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Malinaw na iniuugnay nito ang talata sa naunang pagbabawal sa Mateo 7:1 bilang paliwanag o batayan.
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwirang inililipat ang datibong parirala nang hindi tinutukoy kung sino ang gagawa ng paghatol o pagsukat.
theological_decisions:
- issue: Sino ang ahente ng katumbas na paghatol at pagsukat
  choice: Hindi tinukoy ang ahente; pinanatili ang mga anyong “igagawad sa inyo” at “ipanunukat sa inyo.”
  alternative: Tahasan itong gawing “hahatulan kayo ng Diyos” o “gagawin din ito sa inyo ng ibang tao.”
  rationale: Pasibo at walang tahasang ahente ang mga pandiwa sa Griyego. Kaya hindi dapat lutasin ng salin kung Diyos lamang o mga tao ang tinutukoy.
- issue: Saklaw ng κρίνω
  choice: Pangkalahatang paghatol, hindi partikular na pagkondena.
  alternative: “Kung paano ninyo kinokondena ang iba, gayon din kayo kokondenahin.”
  rationale: Maaaring mangahulugan ang κρίνω ng pagsusuri, paghatol, o pagkondena. Ang konteksto at pag-uulit ng magkakaugnay na salita ay pumapabor sa mas malawak na diwang “hatol.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang balanseng paralelismo upang mapanatili ang kasabihang anyo ng pangungusap. Iniwasan ang mas teknikal na “pamantayan” sa pangunahing teksto upang manatili ang konkretong talinghaga ng pagsukat.
