revisions:
- from: Kaya, ang bawat nakikinig sa mga salita kong ito at tumutupad sa mga ito ay maihahalintulad sa isang matalinong lalaki na nagtayo ng kanyang bahay sa ibabaw ng bato.[a][b]
  to: Kaya, ang bawat taong nakikinig sa mga salita kong ito at tumutupad sa mga ito ay maitutulad sa isang matalinong lalaki na nagtayo ng kanyang bahay sa ibabaw ng bato.[a][b]
  rationale: Idinagdag ang “taong” upang maging likas at malinaw ang distributive na paksa. Pinalitan ang “maihahalintulad” ng mas payak na “maitutulad,” at iniayon ang talababa a upang maging tunay na leksikal na alternatibo sa piniling salita. Walang binagong kahulugan o idinagdag na interpretasyon.
