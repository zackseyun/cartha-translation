  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: tl
  text: Kaya, ang bawat taong nakikinig sa mga salita kong ito at tumutupad sa mga ito ay maitutulad sa isang matalinong lalaki na nagtayo ng kanyang bahay sa ibabaw ng bato.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ihahalintulad sa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “isang matalinong lalaki”; panlalaki ang anyong gramatikal ng taong nasa paghahambing sa orihinal na teksto.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Kaya, ang bawat
  rationale: Ipinahihiwatig ng Πᾶς kasama ng ὅστις ang bawat taong kabilang sa inilalarawang pangkat, at ang οὖν ay nagpapakita ng kongklusyon mula sa naunang turo.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: nakikinig sa mga salita kong ito
  rationale: Ang 'nakikinig' ay likas sa Filipino at maaaring magpahiwatig ng masusing pakikinig, samantalang tuwirang pinananatili ng 'mga salita kong ito' ang λόγους at μου.
- source_word: καὶ ποιεῖ αὐτούς
  choice: at tumutupad sa mga ito
  rationale: Sa kontekstong ito, ang ποιεῖ ay hindi lamang paggawa kundi pagsasagawa ng narinig; malinaw at likas na Filipino ang 'tumutupad' nang hindi dinaragdagan ang diwa.
- source_word: ὁμοιωθήσεται
  choice: ay maihahalintulad sa
  rationale: Pinananatili nito ang hinaharap na pasibong anyo at ang tahasang paghahambing ng Griyego.
- source_word: ἀνδρὶ φρονίμῳ
  choice: isang matalinong lalaki
  rationale: Tiyak na lalaking tao ang ἀνήρ, at ang φρόνιμος ay ang taong may karunungan at mabuting pagpapasiya; tuwiran itong naihahatid ng 'matalinong lalaki.'
- source_word: ᾠκοδόμησεν
  choice: nagtayo
  rationale: Karaniwan at natural na pandiwang Filipino ito para sa pagtatayo ng bahay.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: ng kanyang bahay
  rationale: Pinananatili nito ang pagmamay-ari at ang konkretong larawan ng isang gusali.
- source_word: ἐπὶ τὴν πέτραν
  choice: sa ibabaw ng bato
  rationale: Tuwiran nitong pinananatili ang larawan ng bahay na itinayo sa matibay na bato nang hindi isinasapantaha na espesipikong bedrock ang tinutukoy.
theological_decisions:
- issue: Panlalaking katawagan sa taong nasa paghahambing
  choice: isang matalinong lalaki
  alternative: isang matalinong tao
  rationale: Ginagamit ng Griyego ang ἀνδρί, na partikular na tumutukoy sa isang lalaki sa loob ng ilustrasyon. Gayunman, nananatiling pangkalahatan ang saklaw ng pambungad na 'ang bawat.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Kaya' bilang natural na inferensiyal na pang-ugnay, 'tumutupad' para sa pagsasagawa ng mga salita, at 'maihahalintulad' upang mapanatili ang pasibong paghahambing. Ang mga pananda ng talababa [a] at [b] ay kapwa nasa pangunahing teksto.
