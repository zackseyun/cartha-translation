    issue: Hindi ganap na likas ang “ang bawat nakikinig.”
    rationale: Bagaman nauunawaan, mas idiomatiko at mas malinaw na ilahad ang taong ipinahihiwatig ng Πᾶς ὅστις bilang “ang bawat taong nakikinig.”
  - severity: low
    issue: Medyo mabigat ang “maihahalintulad.”
    rationale: Ang “maitutulad” ay mas karaniwan at natural na modernong Filipino para sa ὁμοιωθήσεται at pinananatili ang pasibo at hinaharap na paghahambing.
