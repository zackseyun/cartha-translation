  text: So then[a], you will recognize them by their fruits.
translation:
  language: tl
  text: Kaya nga[a], makikilala ninyo sila sa kanilang mga bunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Samakatuwid nga, mula sa kanilang mga bunga ay makikilala ninyo sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα γε
  choice: Kaya nga
  rationale: Naghahayag ang parirala ng kongklusyon na may bahagyang pagdiriin; likas at malinaw itong naipapahayag ng “Kaya nga” sa modernong Tagalog.
- source_word: ἀπὸ
  choice: sa
  rationale: Kasama ng pandiwang ἐπιγινώσκω, ipinapakita nito ang batayan ng pagkilala. Ang “sa kanilang mga bunga” ay natural na Tagalog para sa pagkilalang batay sa nakikitang bunga.
- source_word: καρπῶν
  choice: mga bunga
  rationale: Pinananatili ang tahasang pangmaramihan at ang metapora ng bunga, sa halip na paliitin ang kahulugan sa “mga gawa” o “mga resulta.”
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na anyong paari sa Tagalog na tumutukoy sa mga taong pinag-uusapan.
- source_word: ἐπιγνώσεσθε
  choice: makikilala ninyo
  rationale: Ang future middle indicative na pangalawang panauhang maramihan ay tumutukoy sa pagkilala o pagtukoy sa kanila batay sa mapapansing ebidensiya.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy ito pabalik sa mga taong pinag-uusapan at natural na isinasalin bilang “sila” sa kayariang Tagalog.
theological_decisions:
- issue: Metaporikal na gamit ng “mga bunga” sa pagkilala sa mga tao
  choice: Panatilihin ang metaporang “mga bunga.”
  alternative: Isalin bilang “mga gawa” o “mga resulta.”
  rationale: Ang konteksto ay tungkol sa pagkilala batay sa nakikitang kinalabasan, ngunit bunga mismo ang larawang ginamit ng teksto. Pinananatili nito ang ugnayan sa mga naunang talata at iniiwasang paliitin ang posibleng saklaw ng metapora.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang bahagyang pagdiriin ng ἄρα γε sa “Kaya nga” at ang metaporang pangmaramihan na “mga bunga.”
