source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: tl
  text: Marami ang magsasabi sa akin sa araw na iyon, “Panginoon, Panginoon, hindi ba kami nagpropesiya sa iyong pangalan, nagpalayas ng mga demonyo sa iyong pangalan, at gumawa ng maraming makapangyarihang gawa[a] sa iyong pangalan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumawa ng maraming himala” o “gumawa ng maraming gawa ng kapangyarihan.” Literal na tumutukoy ang pariralang Griyego sa maraming “kapangyarihan,” isang pananalitang madalas gamitin sa mga Ebanghelyo para sa mga mahimalang gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Marami
  rationale: Ginamit ang pang-uri bilang pangngalan sa Griyego; natural sa Tagalog ang “Marami” nang hindi idinaragdag ang salitang “tao.”
- source_word: ἐροῦσίν μοι
  choice: ang magsasabi sa akin
  rationale: Tuwirang pinananatili ang hinaharap na aspekto at ang datibong “sa akin.”
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: sa araw na iyon
  rationale: Ito ang natural na temporal na idyoma sa Tagalog at hindi nito tahasang dinaragdagan ang pahiwatig tungkol sa paghuhukom.
- source_word: Κύριε κύριε
  choice: Panginoon, Panginoon
  rationale: Pinananatili ang pag-uulit, na nagpapahayag ng mariing pagsusumamo, at ang karaniwang titulong may bigat na kristolohikal.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: hindi ba’t nagpahayag kami ng propesiya
  rationale: Ang negatibong tanong ay umaasang sasang-ayon ang kausap. Mas malinaw sa ordinaryong mambabasa ang pariralang ito kaysa sa “nagpropesiya,” habang nananatiling malapit sa kahulugan.
- source_word: τῷ σῷ ὀνόματι
  choice: sa iyong pangalan
  rationale: Likas na Tagalog para sa pagkilos sa ilalim ng awtoridad o sa pagtawag sa pangalan ng isang tao; pinanatili ang tatlong ulit na pagbanggit para sa retorikal na diin.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: nagpalayas ng mga demonyo
  rationale: Karaniwan at malinaw na katumbas ng pagpapaalis ng mga demonyo.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: gumawa ng maraming makapangyarihang gawa
  rationale: Pinananatili ang ugnayan ng δύναμις sa kapangyarihan nang hindi agad nililimitahan ang kahulugan sa salitang “himala.”
theological_decisions:
- issue: Pagtutumbas sa κύριος sa tuwirang pagtawag kay Jesus
  choice: Panginoon
  alternative: Guro / Amo
  rationale: Pinananatili ng “Panginoon” ang karaniwang kahulugan ng titulo at ang bigat nitong kristolohikal nang walang idinaragdag na higit sa teksto.
- issue: Eskatolohikal na diwa ng “araw na iyon”
  choice: sa araw na iyon
  alternative: sa araw ng paghuhukom
  rationale: Malinaw sa konteksto ang kaugnayan sa huling paghuhukom, ngunit “araw na iyon” lamang ang tahasang sinasabi ng Griyego; kaya hindi ginawang lantad sa pangunahing teksto ang ipinahihiwatig lamang.
- issue: Saklaw ng δυνάμεις bilang mga gawa
  choice: makapangyarihang gawa
  alternative: mga himala
  rationale: Maaaring tumukoy ang salita sa mga himala, ngunit ang mas literal na larawan ay mga pagpapamalas ng kapangyarihan; pinananatili sa teksto ang lawak at nililinaw sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang retorikal na pag-uulit ng “sa iyong pangalan” at “Panginoon, Panginoon.”
