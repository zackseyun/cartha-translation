  source_fidelity: 'Ang pangkalahatang estruktura ay tapat sa Griyego: ikalawang halimbawa ito, may hinihinging isda, at retorikal na tanong na umaasa ng negatibong sagot. Gayunman, ang “ito” para sa αὐτῷ ay hindi ang pinakaligtas na salin ng datibong panghalip na tumutukoy sa isang tao at maaaring magmukhang deiktiko o tumukoy sa bagay.'
  naturalness: Likas ang “O kung humingi siya ng isda” at ang paggamit ng em dash. Mas malinaw at mas karaniwang Tagalog ang pag-uulit ng “siya” para sa taong tatanggap, kahit nakasalalay ang pagkakaiba ng ama at anak sa naunang konteksto.
  terminology: Wasto at moderno ang “isda” at “ahas.” Napananatili ng “bibigyan ba ...?” ang puwersa ng μή bilang tanong na inaasahang negatibo, nang hindi nagdaragdag ng interpretatibong pananalita.
