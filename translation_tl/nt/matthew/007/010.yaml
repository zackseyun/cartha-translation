  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: tl
  text: O kung humingi siya ng isda—bibigyan ba niya siya ng ahas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: O kung
  rationale: Ipinagpapatuloy nito ang ikalawang halimbawa sa magkaugnay na mga tanong. Likas sa Tagalog ang “O kung” at hindi kailangang isalin nang hiwalay ang καί.
- source_word: ἰχθὺν
  choice: isda
  rationale: Karaniwang kahulugan ng salita at angkop sa konteksto ng pagkaing hinihingi.
- source_word: αἰτήσει
  choice: humingi
  rationale: Bagaman nasa anyong panghinaharap sa Griyego, natural sa Tagalog ang aspektong kontemplatibo sa isang pangkalahatang kundisyon.
- source_word: μὴ
  choice: bibigyan ba ...?
  rationale: Ang μή ay nagpapahiwatig ng tanong na inaasahang sasagutin ng hindi. Sapat na ipinahihiwatig ito ng retorikal na tanong sa Tagalog.
- source_word: ὄφιν
  choice: ahas
  rationale: Ito ang malinaw at karaniwang modernong salin ng pangkalahatang katawagan sa Griyego para sa snake o serpent.
- source_word: ἐπιδώσει
  choice: bibigyan
  rationale: Sa konteksto, nangangahulugan itong magbigay o mag-abot. Pinakanatural dito ang “bibigyan.”
- source_word: αὐτῷ
  choice: ito
  rationale: Ginagamit ang “ito” bilang panghalip sa taong tinutukoy upang maiwasan ang malabong pag-uulit ng “siya” at mapanatili ang tatanggap ng ibinibigay.
theological_decisions:
- issue: Lakas ng retorikal na tanong
  choice: 'Panatilihin bilang tanong na malinaw na umaasa ng sagot na hindi: “bibigyan ba niya ito ng ahas?”'
  alternative: 'Isalin bilang tahasang pahayag: “hindi niya ito bibigyan ng ahas.”'
  rationale: Ang μή sa tuwirang tanong ay nagpapahiwatig ng inaasahang negatibong sagot. Mahalaga ang retorikal na anyo sa pangangatwiran ni Jesus sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang em dash upang ipakita ang mariing paglipat mula sa kundisyon tungo sa retorikal na tanong. Hindi idinagdag ang “anak” o “ama” sa mismong talata, yamang mga panghalip lamang ang nasa Griyego at malinaw ang mga tinutukoy mula sa naunang konteksto.
