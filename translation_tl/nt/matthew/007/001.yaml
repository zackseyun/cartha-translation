id: MAT.7.1
reference: Matthew 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: tl
  text: Huwag kayong humatol[a], upang hindi kayo hatulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kayong magkondena, upang hindi kayo kondenahin.” Sa ilang konteksto, maaaring mangahulugan ang pandiwang Griyego ng pagkondena, ngunit mas malawak ang “humatol” at pinananatili nito ang pag-uulit ng parehong salitang-ugat sa talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Huwag
  rationale: Kasama ng pangkasalukuyang pautos na κρίνετε, nagpapahayag ito ng pagbabawal; natural itong isalin sa Filipino bilang “Huwag.”
- source_word: κρίνετε
  choice: humatol
  rationale: 'Malawak ang saklaw ng κρίνω: maaari itong tumukoy sa paghatol, pagsusuri, o pagparusa. Pinananatili ng “humatol” ang ugnayang leksikal sa passive na κριθῆτε at hindi nito nililimitahan ang diwa sa pagpaparusa lamang.'
- source_word: ἵνα
  choice: upang
  rationale: Ipinahahayag ng ἵνα kasama ng pasakali ang layunin o bunga. Ang “upang” ay malinaw, marangal, at natural sa makabagong Filipino.
- source_word: μὴ
  choice: hindi
  rationale: Tuwirang itinatanggi nito ang kasunod na passive subjunctive.
- source_word: κριθῆτε
  choice: kayo hatulan
  rationale: Ang anyong aorist passive subjunctive ng κρίνω ay isinalin gamit ang parehong salitang-ugat ng “humatol,” kaya napapanatili ang pag-uulit at retorikal na balanse ng Griyego.
theological_decisions:
- issue: Saklaw ng κρίνω sa pagbabawal ni Jesus
  choice: Pinanatili ang mas malawak na “humatol” sa halip na paliitin ang kahulugan tungo sa “humatol na may parusa” o “kondenahin.”
  alternative: Huwag kayong humatol na may parusa, upang hindi kayo hatulan ng parusa.
  rationale: Hindi tahasang itinatakda ng talatang ito lamang ang lahat ng hangganan ng ipinagbabawal na paghatol; nililinaw iyon ng kasunod na konteksto. Pinananatili ng “humatol” ang likas na lawak at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Makabagong Filipino na maikli, natural, at marangal. Ginamit ang maramihang “kayo” ayon sa anyong pangmaramihan ng mga pandiwa sa Griyego. Ang “upang hindi” ay nagpapanatili sa layunin/bungang ugnayan ng dalawang sugnay.
