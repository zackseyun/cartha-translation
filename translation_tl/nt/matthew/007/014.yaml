  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: tl
  text: Sapagkat makipot ang pintuan at masikip ang daang patungo sa buhay, at kakaunti ang nakakahanap nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: makipot
  rationale: Tuwirang inilalarawan ang maliit na luwang ng pintuan at natural na katambal ng “masikip” para sa daan.
- source_word: τεθλιμμένη
  choice: masikip
  rationale: Pinananatili ang larawan ng daang nasisikipan o napipigilan, sa halip na gawing tahasang “mahirap” lamang; maaari ring ipahiwatig ng larawan ang hirap ng pagdaan.
- source_word: ἀπάγουσα
  choice: patungo
  rationale: Likas na Filipino para sa daang humahantong o umaakay sa isang hantungan.
- source_word: ζωήν
  choice: buhay
  rationale: Pinananatili ang malawak at teolohikal na kahulugan ng ζωή nang hindi dinaragdagan ng paliwanag na wala sa talata.
- source_word: εὑρίσκοντες
  choice: nakakahanap
  rationale: Karaniwan at malinaw na modernong Filipino para sa mga taong nakasusumpong sa daan.
theological_decisions:
- issue: Kahulugan ng τεθλιμμένη bilang kalagayan ng daan
  choice: masikip
  alternative: mahirap
  rationale: Mas malapit ang “masikip” sa konkretong metapora ng Griyego at pinananatili nito ang kaugnayan sa makipot na pintuan, habang hindi inaalis ang pahiwatig na mahirap tahakin ang daan.
- issue: Kahulugan ng “buhay”
  choice: buhay
  alternative: buhay na walang hanggan
  rationale: Hindi tahasang sinasabi sa talata ang “walang hanggan”; ang payak na “buhay” ay nagpapanatili sa saklaw at tensiyong nasa orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinili ang “nakakahanap” kaysa mas makalumang “nakasusumpong,” at pinanatili ang magkaugnay na larawang “makipot” at “masikip.”
