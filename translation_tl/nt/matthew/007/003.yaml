id: MAT.7.3
reference: Matthew 7:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: tl
  text: Ngunit bakit mo nakikita ang puwing[a] sa mata ng kapatid[b] mo, pero hindi mo napapansin ang biga[c] sa sarili mong mata?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin ang κάρφος bilang “munting piraso ng dayami,” “ipa,” o “tuyong hibla.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, panlalaking isahan ang salitang isinaling “kapatid.”
    reason: lexical_alternative
  - marker: c
    text: O “malaking troso” o “makapal na tabla” para sa biga (δοκός).
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: bakit
  rationale: Sa tanong na ito kasama ng βλέπεις, ang τί ay idyomatikong nagpapahayag ng “bakit,” hindi ng literal na “ano.”
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na pagsalungat o paglipat mula sa naunang turo.
- source_word: βλέπεις
  choice: nakikita
  rationale: Pinananatili nito ang konkretong larawan ng pagtingin at ang pagkakaiba nito sa κατανοεῖς.
- source_word: κάρφος
  choice: puwing
  rationale: Ang κάρφος ay maliit na tuyong piraso gaya ng munting dayami o tinik. Ang “puwing” ay natural sa Filipino para sa maliit na bagay na napunta sa mata, nang hindi tiyak na tinutukoy ang materyal.
- source_word: ἀδελφοῦ
  choice: kapatid
  rationale: Ang “kapatid” ang karaniwang likas na katumbas sa Filipino; hindi nito minamarkahan ang kasarian, bagaman panlalaking isahan ang anyong Griyego.
- source_word: σῷ
  choice: sarili mong
  rationale: Ipinakikita nito ang diin at malinaw na pagsalungat sa mata ng kapatid.
- source_word: δοκόν
  choice: biga
  rationale: Ang δοκός ay malaking kahoy na ginagamit bilang pangunahing suporta sa gusali. Tumpak na katumbas ang “biga” at pinananatili ang eksaheradong paghahambing.
- source_word: οὐ κατανοεῖς
  choice: hindi mo napapansin
  rationale: Ang κατανοέω ay tumutukoy sa maingat na pagpansin o pagkilala. Natural itong ipinakikitang kaiba sa simpleng “nakikita.”
- source_word: ὀφθαλμῷ
  choice: mata
  rationale: Ito ang tuwiran at karaniwang katumbas ng ὀφθαλμός sa larawang ginamit.
theological_decisions:
- issue: Ang panlalaking katawagang ἀδελφοῦ
  choice: kapatid
  alternative: kapatid na lalaki
  rationale: Walang natural na pagkakaiba sa Tagalog sa pagitan ng “brother” at “sibling” sa salitang “kapatid.” Ang “kapatid na lalaki” ay magiging mas tahasang espesipiko ngunit mabigat at hindi likas sa pangungusap; ipinababatid ng talababa ang gramatikal na anyo ng pinagmulan nang hindi pinipilit ang di-likas na kasarian sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinili ang “puwing” dahil karaniwan ito sa larawang may maliit na bagay sa mata, at ang “biga” upang mapanatili ang arkitektural at eksaheradong larawan. Ginamit ang magkatulad ngunit magkaibang “nakikita” at “napapansin” upang katawanin ang retorikal na kaibhan ng βλέπεις at κατανοεῖς.
