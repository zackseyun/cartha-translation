id: MAT.7.16
reference: Matthew 7:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: tl
  text: Makikilala ninyo sila sa kanilang mga bunga.[a] Namimitas ba ang mga tao ng ubas mula sa mga halamang matinik, o ng mga igos mula sa mga dawag?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Malalaman ninyo kung sino sila sa kanilang mga bunga.”
    reason: lexical_alternative
  - marker: b
    text: 'Negatibo ang inaasahang sagot sa tanong: hindi namimitas ang mga tao ng ubas mula sa mga halamang matinik ni ng mga igos mula sa mga dawag.'
    reason: rhetorical_force
lexical_decisions:
- source_word: καρπῶν
  choice: mga bunga
  rationale: Pinananatili ang tahasang maramihan at ang kongkretong larawang agrikultural, na metaporikal na tumutukoy sa nakikitang kinalabasan ng buhay at gawain.
- source_word: ἐπιγνώσεσθε
  choice: Makikilala ninyo
  rationale: Likas sa modernong Tagalog at angkop sa pagkilala o pag-unawa sa pagkatao batay sa napapansing ebidensiya; hindi nito pinalalabis bilang lubos na pagkakilala.
- source_word: μήτι
  choice: ba
  rationale: Ang tanong na may “ba” ay natural na retorikal na tanong sa Tagalog; ipinahihiwatig ng konteksto ang inaasahang sagot na hindi.
- source_word: συλλέγουσιν
  choice: namimitas
  rationale: Natural na pandiwa para sa pagkuha ng ubas at igos mula sa halaman at malinaw na nagpapanatili sa larawang agrikultural.
- source_word: ἀκανθῶν
  choice: mga halamang matinik
  rationale: Sinasaklaw nito ang kahulugang mga tinik o halamang matinik at iniiwasan ang di-likas na larawan ng pamimitas mula sa hiwa-hiwalay na tinik.
- source_word: σταφυλάς
  choice: ubas
  rationale: Tuwirang katumbas at likas bilang pangngalang pangmasa sa Tagalog.
- source_word: τριβόλων
  choice: mga dawag
  rationale: Ang “dawag” ay tumutukoy sa matinik na damo o palumpong at nagpapanatili sa pagkakaiba nito sa unang halamang matinik.
- source_word: σῦκα
  choice: mga igos
  rationale: Karaniwang malinaw na katumbas ng maramihang σύκα.
- source_word: αὐτῶν / αὐτούς
  choice: kanilang / sila
  rationale: Pinananatili ang personal na pagtukoy sa mga taong tinatalakay sa konteksto.
theological_decisions:
- issue: Metaporikal na diwa ng “mga bunga” sa pagkilala sa mga tao
  choice: Panatilihin ang metaporang “mga bunga.”
  alternative: “mga gawa” o “mga ibinubunga ng kanilang buhay”
  rationale: Ang konkretong metapora ang sentro ng paghahambing at hindi dapat paliitin sa iisang interpretasyon gaya ng mga gawa lamang o mga resulta lamang.
- issue: Inaasahang negatibong sagot ng μήτι
  choice: Gumamit ng natural na retorikal na tanong at ipaliwanag sa talababa.
  alternative: “Hindi naman namimitas… hindi ba?”
  rationale: Mas natural at marangal sa Tagalog ang payak na tanong, habang nililinaw ng talababa ang puwersa ng Griyegong μήτι nang hindi ginagawang mabigat ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “makikilala” sa halip na mas abstraktong “malalaman,” at “namimitas” para sa idiomatikong larawang agrikultural. Ang “dawag” ay bahagyang mas tiyak na bokabularyo ngunit madaling maunawaan sa konteksto at nagpapanatili sa paralelismo ng dalawang uri ng halamang matinik.
