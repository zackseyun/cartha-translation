revisions:
- from: At pagkatapos ay hayagan kong sasabihin sa kanila, ‘Hindi ko kayo kailanman nakilala.[a] Lumayo kayo sa akin, kayong mga gumagawa ng labag sa kautusan.[b]’
  to: At pagkatapos ay hayagan kong ipahahayag sa kanila, ‘Hindi ko kayo kailanman nakilala.[a] Lumayo kayo sa akin, kayong gumagawa ng paglabag sa kautusan.[b]’
  rationale: Ang rebisyon ay nag-aayos ng isang di-likas na konstruksyong Tagalog sa huling sugnay. Pinanatili nito ang aspektong nakaugaliang ipinahihiwatig ng participle, ang moral-legal na diin ng ἀνομία, at ang hindi nilulutas na relasyonal/hudisyal na saklaw ng “Hindi ko kayo kailanman nakilala.” Iningatan din ang mga anchor ng talababa at ang kanilang kaugnay na alternatibong leksikal.
