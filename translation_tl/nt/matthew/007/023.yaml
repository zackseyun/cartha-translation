  source_fidelity: 'Tumpak ang pangunahing diwa ng salin: napapanatili ang pagkakasunod na καὶ τότε, ang hayag na pahayag ng ὁμολογήσω, ang mariing “hindi ... kailanman,” ang relasyonal na bukas na diwa ng ἔγνων, at ang utos ng pagtataboy. Gayunman, ang “gumagawa ng labag sa kautusan” ay hindi ganap na likas o kumpleto bilang pariralang Tagalog; kailangan nitong ipahayag ang abstraktong ἀνομία bilang “paglabag sa kautusan.”'
  naturalness: Ang “At pagkatapos ay” at “Lumayo kayo sa akin” ay malinaw at angkop sa marangal na modernong Filipino. Ang “hayagan kong ipahahayag” ay mas tuwiran at pormal na katumbas ng pampublikong pagpapahayag kaysa “hayagan kong sasabihin.” Ang binagong huling parirala ay mas natural at nananatiling tiyak sa moral-legal na diwa ng Griyego.
  terminology: Pinanatili ang “nakilala” upang hindi ipasok sa pangunahing teksto ang interpretasyong “kinilala” o “sinang-ayunan.” Isinalin ang ἀνομία bilang “paglabag sa kautusan,” na mas malinaw na Tagalog kaysa sa dating “labag sa kautusan” at hindi ito pinapalabnaw sa pangkalahatang “kasamaan.”
