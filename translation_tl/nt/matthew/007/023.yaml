  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: tl
  text: At pagkatapos ay hayagan kong ipahahayag sa kanila, ‘Hindi ko kayo kailanman nakilala.[a] Lumayo kayo sa akin, kayong gumagawa ng paglabag sa kautusan.[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hindi ko kayo kailanman kinilala.” Ang salitang Griyego para sa “nakilala” ay maaaring tumukoy sa personal o relasyonal na pagkilala, hindi lamang sa pagkaalam.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kayong gumagawa ng kasamaan” o “kayong gumagawa ng katampalasanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: At pagkatapos
  rationale: Pinananatili nito ang ugnayan at pagkakasunod-sunod sa naunang pahayag sa natural na modernong Tagalog.
- source_word: ὁμολογήσω
  choice: hayagan kong sasabihin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa lantad at tahasang pagpapahayag, hindi sa pag-amin ng kasalanan.
- source_word: Οὐδέποτε
  choice: kailanman
  rationale: 'Kasama ng “hindi,” malinaw at mariing ipinapahayag nito ang ganap na pagtanggi: “hindi ... kailanman.”'
- source_word: ἔγνων
  choice: nakilala
  rationale: Pinananatili ng “nakilala” ang idyomang maaaring tumukoy sa personal o relasyonal na pagkilala, hindi lamang sa pagkaalam ng impormasyon.
- source_word: ἀποχωρεῖτε
  choice: Lumayo kayo
  rationale: Natural itong utos ng pagtataboy sa modernong Tagalog at angkop sa taimtim na tono ng pahayag.
- source_word: ἐργαζόμενοι
  choice: mga gumagawa
  rationale: Ipinahihiwatig ng participle ang patuloy o nakaugaliang paggawa; malinaw itong naipapahayag ng pariralang “mga gumagawa.”
- source_word: ἀνομίαν
  choice: ng labag sa kautusan
  rationale: Pinananatili nito ang moral at legal na diwa ng ἀνομία bilang pagsuway o pagkilos na salungat sa kautusan, sa halip na gawing pangkalahatang “kasamaan” lamang.
theological_decisions:
- issue: Kahulugan ng “Hindi ko kayo kailanman nakilala”
  choice: Pinanatili ang tuwirang relasyonal na pananalitang “Hindi ko kayo kailanman nakilala.”
  alternative: “Hindi ko kayo kailanman kinilala” o “Hindi ko kayo kailanman sinang-ayunan.”
  rationale: Maaaring magpahiwatig ang Griyego ng relasyonal o hudisyal na pagkilala, ngunit hindi tahasang nilulutas ng talata ang lahat ng teolohikal na implikasyon nito. Iniiwasan ng salin ang pagpasok ng paliwanag na doktrinal sa pangunahing teksto.
- issue: Diwa ng ἀνομία
  choice: Isinalin bilang “ng labag sa kautusan.”
  alternative: “ng kasamaan” o “ng katampalasanan.”
  rationale: Pinananatili nito ang tiyak na moral-legal na diin ng salita nang hindi nagdaragdag ng isang makitid na paliwanag na denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “hayagan kong sasabihin” ay nagpapanatili sa pormal at lantad na lakas ng pahayag; ang “Lumayo kayo” ay taimtim ngunit hindi lipas na pananalita.
