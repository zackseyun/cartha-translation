  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: tl
  text: Ang bawat punong hindi namumunga ng mabuting bunga ay pinuputol at itinatapon sa apoy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi nagbubunga ng mabuting bunga.”
    reason: lexical_alternative
  - marker: b
    text: Ang “apoy” ay larawan ng paghatol; hindi mismo tinutukoy ng talata kung ang diin ay sa paghatol sa kasalukuyang panahon, sa pangwakas na paghatol, o sa kapwa ito.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Ang bawat puno
  rationale: Ang πᾶν na kasama ng pang-isahang δένδρον ay distributibo at tumutukoy sa bawat puno; natural at tuwiran ito sa modernong Tagalog.
- source_word: μὴ ποιοῦν
  choice: hindi namumunga
  rationale: Bagaman literal na may diwang “hindi gumagawa/nagbubunga,” ang “namumunga” ang likas na ekspresyon sa Tagalog para sa punong nagluluwal ng bunga at naipahihiwatig ang patuloy o karaniwang katangian ng kilos.
- source_word: καρπὸν καλὸν
  choice: ng mabuting bunga
  rationale: Pinananatili ng “mabuting bunga” ang tuwirang larawang agrikultural at ang moral o mapanuring diwa ng καλός sa konteksto.
- source_word: ἐκκόπτεται
  choice: ay pinuputol
  rationale: Ang kasalukuyang pasibong anyo ay inilalarawan bilang karaniwang nangyayari sa gayong puno. Sa Tagalog, sapat at natural ang “pinuputol”; sa konteksto ng puno, nauunawaang ibinabagsak o inaalis ito.
- source_word: εἰς πῦρ βάλλεται
  choice: at itinatapon sa apoy
  rationale: Pinananatili nito ang pasibong kilos at ang paggalaw tungo sa apoy, nang hindi dinaragdagan ang teksto ng mas tiyak na paliwanag sa kahulugan ng apoy.
theological_decisions:
- issue: Larawan ng paghatol sa pamamagitan ng apoy
  choice: Panatilihin ang larawan ng punong pinuputol at itinatapon sa apoy nang hindi tinutukoy nang eksakto kung ano ang tinutukoy ng apoy.
  alternative: Tahasang tukuyin ito bilang pansamantalang paghatol, pangwakas na paghatol, o impiyerno.
  rationale: Malinaw na babala ng paghatol ang larawan, ngunit hindi mismo nililinaw ng talata ang tiyak na panahon o saklaw nito. Pinananatili ng salin ang teolohikal na tensiyon nang hindi nagpapasok ng mas makitid na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “namumunga” bilang pinakanatural na kolokasyon para sa puno, habang pinanatili ang “mabuting bunga,” “pinuputol,” at “itinatapon sa apoy” upang manatiling malapit sa estruktura at larawan ng Griyego.
