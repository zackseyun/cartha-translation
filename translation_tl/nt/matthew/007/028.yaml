  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: tl
  text: At[b] nang matapos ni Jesus ang mga salitang ito[a], namangha ang mga pulutong sa kanyang pagtuturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sinabi niyang ito.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal na ayos ng Griyego: “At nangyari na nang matapos …” Isa itong pormulang pasalaysay na likas na pinaikli sa Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Nang
  rationale: Ang buong parirala ay isang pormulang pasalaysay na naghuhudyat ng paglipat at naglalagay sa sumunod na pangyayari sa panahon. Sa natural na makabagong Tagalog, sapat at malinaw itong naihahayag ng “Nang”; ang mas literal na “At nangyari na nang” ay mabigat at hindi likas.
- source_word: ἐτέλεσεν
  choice: matapos
  rationale: Ipinahihiwatig ng pandiwa na dinala ni Jesus sa wakas ang kasalukuyang pahayag o diskurso. Ang “matapos” ay natural at pinananatili ang diwa ng pagkumpleto.
- source_word: τοὺς λόγους τούτους
  choice: ang mga salitang ito
  rationale: Pinananatili ng “mga salitang ito” ang pangmaramihang λόγους at ang panturong τούτους, nang hindi nagdaragdag ng katawagang gaya ng “sermon.” Maaari ring unawain ang λόγους bilang “mga sinabi,” kaya inilagay ang alternatibo sa talababa.
- source_word: ἐξεπλήσσοντο
  choice: namangha
  rationale: Ipinapahayag ng “namangha” ang matinding pagkagulat at paghanga ng mga tao. Bagaman imperfect ang Griyego at inilalarawan ang sama-sama o nagpapatuloy na reaksiyon, natural na ipinapahayag ito sa Tagalog sa aspektong naganap sa ganitong buod ng salaysay.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Sa kontekstong ito, likas na tumutukoy ang “ang mga tao” sa mga pulutong na nakikinig. Ang mas literal na “mga pulutong” ay tumpak sa bilang ngunit hindi gaanong natural sa karaniwang makabagong Tagalog.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sa kanyang pagtuturo
  rationale: Kasama ng ἐξεπλήσσοντο, ipinakikita ng ἐπί na ang pagtuturo ni Jesus ang dahilan o bagay na ikinamamangha. Ang “sa kanyang pagtuturo” ay maikli, natural, at hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Tinutukoy ng “mga salitang ito”
  choice: Tumutukoy ito sa kagagaling na pagtuturo ni Jesus, nang hindi ito pinapangalanang “sermon.”
  alternative: “mga sinabi niyang ito” o “sermon na ito”
  rationale: Malinaw na binubuod ng talata ang natapos na diskurso, ngunit walang teolohikal o pampanitikang bansag na “sermon” sa Griyego. Pinananatili ng salin ang tuwirang reperensiya at ang saklaw ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kanyang” sa halip na kolokyal na anyo, at iniwasan ang mabigat na literalismong “At nangyari na nang…” sa pangunahing teksto habang itinala ito sa talababa.
