  naturalness: Natural at marangal sa makabagong Filipino Tagalog ang “At nang matapos …, namangha ang mga pulutong …” Hindi kailangang ipilit sa pangunahing teksto ang hindi likas na “At nangyari na nang …”; maaaring ipaliwanag sa talababa na ang pariralang ito ay isang pormulang pasalaysay.
  terminology: Ang “mga salitang ito” ay angkop at pinananatili ang demonstrative at pangmaramihang anyo. Ang “mga pulutong” ay malinaw at likas sa pampanitikan/Biblikal na rehistro, at mas eksakto kaysa sa pangkalahatang “mga tao.” Walang isyung teolohikal o pangalang pantangi.
