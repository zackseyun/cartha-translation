base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: tl
  text: Humingi kayo[a], at bibigyan kayo; maghanap kayo, at makasusumpong kayo; kumatok kayo, at bubuksan para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang mga pangkasalukuyang pautos sa Griyego ay maaari ring unawain na may nagpapatuloy na diwa: “Patuloy kayong humingi ... patuloy kayong maghanap ... patuloy kayong kumatok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Humingi kayo
  rationale: Ang pangkasalukuyang aktibong pautos na maramihan ay likas na isinasalin sa modernong Tagalog bilang “Humingi kayo.” Nananatili ang lakas ng utos nang hindi sapilitang ginagawang tahasan ang nagpapatuloy na aspekto.
- source_word: δοθήσεται ὑμῖν
  choice: bibigyan kayo
  rationale: Likas sa Tagalog ang pokus-sa-tumatanggap na pandiwang “bibigyan,” na pinananatiling di-binabanggit ang ipinahihiwatig na nagbibigay, gaya ng balintiyak sa Griyego.
- source_word: ζητεῖτε
  choice: humanap kayo
  rationale: Ang “humanap” ay natural at kasalukuyang Tagalog para sa paghahanap, at maaari itong gamitin kapwa sa literal at matalinghagang diwa. Mas karaniwan ito sa ordinaryong mambabasa kaysa “maghanap” sa ganitong magkatambal na pahayag.
- source_word: εὑρήσετε
  choice: makakatagpo kayo
  rationale: Ipinapahayag ng “makakatagpo” ang matagumpay na kinalabasan ng paghahanap at pinananatili ang panghinaharap na pahayag. Naiiwasan din nito ang hindi natural na pag-uulit na “humanap ... makahanap.”
- source_word: κρούετε
  choice: kumatok kayo
  rationale: Ito ang natural at tuwirang pautos sa modernong Tagalog para sa pagkatok sa pinto.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: bubuksan para sa inyo
  rationale: Pinananatili ng “bubuksan” ang balintiyak na anyo at hindi tinutukoy kung sino ang magbubukas. Ang “para sa inyo” ay malinaw at natural na nagpapahayag ng kaugnayan ng ὑμῖν.
- source_word: καὶ
  choice: at
  rationale: Ang paulit-ulit na “at” ay nagpapanatili sa payak na koordinasyon at maindayog na paralelismo ng Griyego nang hindi nagdaragdag ng diwa ng “pagkatapos.”
theological_decisions:
- issue: Aspekto ng tatlong pangkasalukuyang pautos
  choice: 'Isalin bilang payak na mga pautos: “Humingi kayo ... humanap kayo ... kumatok kayo,” habang ipinapaliwanag sa talababa ang posibleng nagpapatuloy na diwa.'
  alternative: 'Gawing tahasan sa pangunahing teksto: “Patuloy kayong humingi ... patuloy kayong humanap ... patuloy kayong kumatok.”'
  rationale: Maaaring magpahiwatig ang mga pangkasalukuyang pautos ng nagpapatuloy o paulit-ulit na pagkilos, ngunit hindi nito kinakailangang ipasok ang “patuloy” sa pangunahing salin. Pinananatili ng payak na pautos ang likas na Tagalog at ang lehitimong kaluwagan ng aspekto.
- issue: Di-binanggit na kumikilos sa mga balintiyak na pandiwa
  choice: Panatilihing di-binanggit kung sino ang nagbibigay at nagbubukas.
  alternative: Tukuyin ang Diyos bilang nagbibigay at nagbubukas.
  rationale: Bagaman maaaring maunawaan sa konteksto na ang Diyos ang kumikilos, hindi Siya tahasang pinangalanan sa talata. Ang “bibigyan” at “bubuksan” ay nagpapanatili sa anyo at teolohikal na pagpipigil ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang magalang o maramihang “kayo” upang katawanin ang pangalawang panauhang maramihan. Pinanatili ang tatlong magkakatulad na utos at pangako, pati ang mga balintiyak na pahayag na hindi pinapangalanan ang kumikilos.
