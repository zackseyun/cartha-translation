base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: tl
  text: Pumasok kayo sa pamamagitan ng makipot na pintuan. Sapagkat maluwang ang pintuan at malapad ang daang patungo sa kapahamakan[a], at marami ang pumapasok sa pamamagitan nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkawasak,” “pagkapariwara.” Ang salitang Griyego ay maaaring tumukoy sa pagkawasak, kapahamakan, o pagkapariwara.
    reason: lexical_alternative
  - marker: b
    text: Ang “nito” ay literal na “sa pamamagitan nito.” Maaaring tumukoy ang panghalip sa pintuan o sa daan; karaniwan itong inuunawa na tumutukoy sa maluwang na pintuan.
    reason: referent_clarification
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Pumasok kayo
  rationale: Tuwirang pautos sa maramihan; natural sa modernong Tagalog at pinananatili ang lakas ng aorist imperative.
- source_word: διὰ τῆς στενῆς πύλης
  choice: sa makipot na pintuan
  rationale: Sa Tagalog, ang “pumasok sa pintuan” ay likas na nagpapahayag ng pagdaan sa isang pasukan; ang “makipot” ay malinaw na katapat ng στενός sa konteksto.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang utos, gaya ng gamit ng ὅτι rito.
- source_word: πλατεῖα ἡ πύλη
  choice: maluwang ang pintuan
  rationale: Ipinananatili ang diin ng nauunang pang-uri at ang tahasang paghahambing sa makipot na pintuan.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: malapad ang daan
  rationale: Ang εὐρύχωρος ay maaaring mangahulugang malapad o maluwag; “malapad” ang pinakanatural na paglalarawan sa daan at malinaw na kaagapay ng “maluwang” na pintuan.
- source_word: ἡ ἀπάγουσα
  choice: patungo
  rationale: Maikli at likas na Tagalog na naghahayag na ang daan ay humahantong sa isang hantungan.
- source_word: εἰς τὴν ἀπώλειαν
  choice: sa kapahamakan
  rationale: Sinasaklaw ng “kapahamakan” ang malubhang pagkawasak o kapinsalaang ipinahihiwatig ng ἀπώλεια nang hindi labis na tinutukoy ang eksaktong teolohikal na katangian nito.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: marami ang pumapasok doon
  rationale: Natural na Tagalog na pinananatili ang diin sa “marami.” Ang “doon” ay umiiwas sa alanganing kasarian ng panghalip at hindi tahasang nagdaragdag ng pangngalang wala sa huling parirala; ipinaliliwanag sa talababa ang posibleng tinutukoy.
theological_decisions:
- issue: Kahulugan ng ἀπώλεια sa babala ni Jesus
  choice: kapahamakan
  alternative: pagkawasak
  rationale: Nagpapahayag ang talata ng isang kakila-kilabot na hantungan ngunit hindi nito ganap na inilalarawan ang teolohikal na kalikasan niyon. Pinananatili ng “kapahamakan” ang bigat at saklaw ng babala nang hindi ito nililimitahan sa isang mas tiyak na doktrinal na paliwanag.
- issue: Tinutukoy ng αὐτῆς sa huling parirala
  choice: doon, na may talababa tungkol sa malamang na pagtukoy sa pintuan
  alternative: sa pintuang iyon
  rationale: Babae ang anyo ng panghalip at maaaring tumukoy sa πύλη (“pintuan”), na babae rin sa Griyego; gayunman, hindi inuulit ng teksto ang pangngalan. Pinananatili sa pangunahing salin ang anyong hindi labis na nagpapaliwanag habang nililinaw sa talababa ang malamang na sanggunian.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang balanseng paralelismo—“makipot na pintuan,” “maluwang ang pintuan,” at “malapad ang daan”—nang hindi ginagawang artipisyal ang ayos ng pangungusap.
