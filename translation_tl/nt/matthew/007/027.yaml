base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: tl
  text: Bumuhos ang ulan, rumagasa ang mga ilog[a], umihip ang mga hangin at humampas sa bahay na iyon, at bumagsak iyon—at napakalubha ng pagbagsak nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dumating ang mga baha.” Ang salitang Griyego ay literal na “mga ilog,” ngunit sa kontekstong ito maaari itong tumukoy sa rumaragasang tubig-baha.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Bumuhos ang ulan
  rationale: Ang literal na ideya ay bumaba ang ulan, ngunit ang “bumuhos ang ulan” ang natural na ekspresyon sa modernong Tagalog at malinaw na naghahatid ng malakas na pag-ulan sa tagpo.
- source_word: ἦλθον οἱ ποταμοί
  choice: rumagasa ang mga ilog[a]
  rationale: Pangunahing kahulugan ng ποταμοί ang “mga ilog.” Ginamit ang “rumagasa” upang natural na maipahayag sa Tagalog ang pagdating ng tubig na may puwersa sa konteksto ng bagyo, habang inilalahad sa talababa ang posibleng pag-unawa rito bilang baha.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: humihip ang mga hangin
  rationale: Tuwirang isinasalin ang pandiwa at pinananatili ang maramihang anyo ng “mga hangin,” ayon sa Griyego.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: humampas sa bahay na iyon
  rationale: Sa konteksto, ang προσκόπτω ay tumutukoy sa malakas na pagtama sa bahay. Ang “humampas” ay natural at nagpapahiwatig ng puwersa nang hindi dinaragdagan ang kahulugan.
- source_word: ἔπεσεν
  choice: Bumagsak iyon
  rationale: Pinananatili ang payak at mariing pandiwang “bumagsak” sa halip na palawakin ito bilang lubusang pagkawasak.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: napakalubha ng pagbagsak nito
  rationale: Pinananatili ang ugnayan ng πίπτω at πτῶσις sa pamamagitan ng “bumagsak” at “pagbagsak.” Ang “napakalubha” ay natural na Tagalog para sa laki at tindi ng kinahinatnan.
theological_decisions:
- issue: Tindi ng larawang nagpapahiwatig ng paghatol sa wakas ng talinghaga
  choice: napakalubha ng pagbagsak nito
  alternative: ganap itong nawasak bilang larawan ng pangwakas na paghatol
  rationale: Sinasabi lamang ng Griyego na malaki o matindi ang pagbagsak ng bahay. Pinananatili ng salin ang bigat ng babala ngunit hindi tahasang ginagawang pahayag tungkol sa pangwakas na paghatol ang larawang nasa talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang sunod-sunod na ritmo ng ulan, mga ilog, at mga hangin, habang iniwasan ang sobrang literal ngunit di-natural na “bumaba ang ulan” at “dumating ang mga ilog.”
