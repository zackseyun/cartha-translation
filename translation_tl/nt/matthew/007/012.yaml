id: MAT.7.12
reference: Matthew 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: tl
  text: Kaya, sa lahat ng bagay, anuman ang nais ninyong gawin ng mga tao para sa inyo, iyon din ang gawin ninyo para sa kanila; sapagkat ito ang Kautusan at ang mga Propeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Kaya, sa lahat ng bagay, anuman
  rationale: Pinananatili ng “sa lahat ng bagay” ang malawak at pansaklaw na diwa ng Πάντα ὅσα, habang ang “Kaya” ay malinaw na nag-uugnay sa talata bilang bunga ng naunang turo.
- source_word: ἐὰν θέλητε
  choice: nais ninyo
  rationale: Likas at marangal na katumbas ito ng pangkalahatang kundisyong ipinahahayag ng ἐὰν kasama ng subjunctive.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: gawin ng mga tao para sa inyo
  rationale: Ang “mga tao” ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa mga lalaki. Ang “para sa inyo” ay natural sa Filipino at angkop sa konteksto ng pakikitungo.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: iyon din ang gawin ninyo para sa kanila
  rationale: Malinaw na ipinapahayag ng “iyon din” ang pagtutumbas na nasa οὕτως καί. Ang anyong pautos na “gawin ninyo” ay pinananatili ang direktang panawagan ng teksto.
- source_word: οὗτος γάρ ἐστιν
  choice: sapagkat ito ang
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ipinakikilala ng γάρ, samantalang ang “ito ang” ay tuwirang katumbas ng equative clause.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: ang Kautusan at ang mga Propeta
  rationale: Pinananatili ang kinikilalang pormulang tumutukoy sa mga pangunahing bahagi ng Kasulatan, sa halip na palitan ito ng isang interpretatibong paliwanag.
theological_decisions:
- issue: Pangkalahatang gamit ng οἱ ἄνθρωποι
  choice: mga tao
  alternative: mga lalaki
  rationale: Sa konteksto, ang salita ay pangkalahatang tumutukoy sa mga tao at hindi partikular sa kalalakihan.
- issue: Saklaw ng “ang Kautusan at ang mga Propeta”
  choice: Pinanatili bilang pormulang tumutukoy sa Kasulatan
  alternative: ang kabuuan ng etikang itinuturo ng Kasulatan
  rationale: Ang mismong pormula ng Griyego ay may mahalagang ugnayang pampanitikan at teolohikal; ang pagpapaliwanag nito sa pangunahing teksto ay maaaring magtakda ng higit sa tahasang sinasabi ng talata.
- issue: Kahulugan ng equative na “ito ang Kautusan at ang mga Propeta”
  choice: Pinanatili ang tuwirang pananalita
  alternative: ito ang buod ng Kautusan at ng mga Propeta
  rationale: Hindi tahasang taglay ng Griyego ang salitang “buod.” Ang tuwirang salin ay nagpapanatili ng lakas at posibleng lawak ng pahayag nang hindi ito nililimitahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” sa halip na mas pormal na “Samakatuwid,” at pinanatili ang tradisyonal ngunit madaling maunawaang “Kautusan at ang mga Propeta.” Hindi na kailangan ang talababa tungkol sa kasarian sapagkat ang “mga tao” sa Filipino ay likas nang pangkalahatan at walang pahiwatig na lalaki lamang.
