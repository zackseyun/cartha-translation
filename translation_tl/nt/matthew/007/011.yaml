  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: tl
  text: Kaya, kung kayo, bagaman masasama, ay marunong magbigay ng mabubuting kaloob sa inyong mga anak, gaano pa kaya ang inyong Ama na nasa mga langit[a] ay magbibigay ng mabubuting bagay[b] sa mga humihingi sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “nasa langit,” gaya ng mas nakagawiang salin. Plural ang Griyego: “nasa mga langit.”'
    reason: lexical_alternative
  - marker: b
    text: Isinasalin ng ilan na “mabubuting kaloob,” ngunit “mabubuting bagay” lamang ang nasa ikalawang sugnay sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: bagaman masasama
  rationale: Ipinahahayag ng pariralang ito ang tuwirang paglalarawan sa mga kausap habang natural na ipinakikita ang diwang pasalungat ng participle sa konteksto. Hindi nito pinahihina o pinalalawak ang hatol ng teksto.
- source_word: οἴδατε ... διδόναι
  choice: marunong magbigay
  rationale: Ang “marunong” ay likas na Filipino para sa praktikal na kaalaman o kakayahang ipinahahayag ng οἴδατε na may kasunod na infinitive.
- source_word: δόματα ἀγαθὰ
  choice: mabubuting kaloob
  rationale: Ang “kaloob” ay marangal at karaniwang salin ng δόματα, at pinananatili ng “mabubuti” ang tuwirang diwa ng ἀγαθά.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: sa inyong mga anak
  rationale: Saklaw ng τέκνα ang mga anak anuman ang kasarian; natural at eksakto ang “mga anak.”
- source_word: πόσῳ μᾶλλον
  choice: lalo nang
  rationale: Ito ang natural na paraang Filipino upang ipahayag ang argumentong mula sa mas maliit tungo sa mas dakila, nang hindi nawawala ang diin ng “how much more.”
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ang inyong Ama na nasa kalangitan
  rationale: Pinananatili nito ang Ama bilang pangngalan at ang kasunod na parirala bilang paglalarawan sa kinaroroonan. Ang “kalangitan” ay mas malinaw na kumakatawan sa plural na οὐρανοῖς kaysa sa nakagawiang singular na “langit.”
- source_word: δώσει ἀγαθὰ
  choice: magbibigay ... ng mabubuting bagay
  rationale: Ginamit ang “mabubuting bagay,” hindi “mabubuting kaloob,” sapagkat walang katumbas ng δόματα sa ikalawang sugnay; substantival ang ἀγαθά.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: sa mga humihingi sa kanya
  rationale: Natural nitong ipinahahayag ang pangkalahatang uri ng mga taong patuloy o karaniwang humihingi sa Ama.
theological_decisions:
- issue: Lakas ng paglalarawang “πονηροὶ ὄντες” sa kalagayan ng tao
  choice: Panatilihin ang tuwirang “bagaman masasama.”
  alternative: “bagaman makasalanan” o “bagaman may mga pagkukulang”
  rationale: Ang “masasama” ay nagpapanatili sa tahasang paghahambing ni Jesus sa masamang tao at sa higit na kabutihan ng Ama, nang hindi nagdaragdag ng isang mas malawak na sistematikong doktrina o nagpapalambot sa sinabi.
- issue: Paglalarawan sa Ama bilang “ὁ ἐν τοῖς οὐρανοῖς”
  choice: “inyong Ama na nasa kalangitan”
  alternative: “inyong Ama sa langit” o “inyong makalangit na Ama”
  rationale: Mas hayag nitong pinananatili ang locative na parirala at ang plural ng Griyego, sa halip na gawin itong pang-uring titulo o awtomatikong sundin ang tradisyonal na singular.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaloob” para sa δόματα ngunit “mabubuting bagay” para sa substantival na ἀγαθά, at pinanatili ang diin ng paghahambing sa pamamagitan ng natural na “lalo nang.”
