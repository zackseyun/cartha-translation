id: MAT.7.29
reference: Matthew 7:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: tl
  text: sapagkat nagtuturo siya sa kanila bilang isang may awtoridad[a], at hindi gaya ng kanilang mga tagapagturo ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas karaniwan, “nang may awtoridad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: sapagkat nagtuturo siya
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa pagk.mangha ng mga tao sa naunang talata. Likas sa Tagalog ang aspektong imperpektibo ng “nagtuturo” para sa nagpapatuloy na kilos sa nakaraang tagpo.
- source_word: αὐτούς
  choice: sa kanila
  rationale: Tumutukoy sa mga taong nakikinig kay Jesus at likas na layon ng pandiwang “nagtuturo” sa Tagalog.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: bilang isang may awtoridad
  rationale: 'Malapit itong sumusunod sa personal na paghahambing ng Griyego: nagtuturo siya bilang isang taong nagtataglay ng ἐξουσία, hindi lamang nang may kumpiyansa.'
- source_word: καὶ οὐχ ὡς
  choice: at hindi gaya ng
  rationale: Malinaw na pinananatili ang paghahambing at pagsalungat ng Griyego.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: kanilang mga tagapagturo ng Kautusan
  rationale: Sa kontekstong ito, ang γραμματεῖς ay mga kinikilalang dalubhasa at guro ng Kautusan. Mas madaling maunawaan ito ng karaniwang modernong mambabasa kaysa sa teknikal at posibleng malabong “mga eskriba,” habang pinananatili ng “kanilang” ang αὐτῶν.
theological_decisions:
- issue: Ang likas ng awtoridad ni Jesus sa pagtuturo
  choice: Ilarawan ang paraan ng kanyang pagtuturo bilang “bilang isang may awtoridad.”
  alternative: Tahasan itong palawakin bilang banal na awtoridad, o paliitin sa karaniwang kumpiyansa at husay sa pagsasalita.
  rationale: Ipinakikita ng talata na tunay ang awtoridad ni Jesus at inihahambing siya sa mga tagapagturo ng Kautusan, ngunit hindi nito tahasang ipinaliliwanag dito ang ganap na pinagmulan o teolohikal na batayan ng awtoridad na iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “awtoridad” bilang karaniwang salin ng ἐξουσία at “mga tagapagturo ng Kautusan” upang ihatid ang tungkulin ng γραμματεῖς nang hindi nangangailangan ng teknikal na terminong “eskriba.”
