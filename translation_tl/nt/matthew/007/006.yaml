  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: tl
  text: Huwag ninyong ibigay sa mga aso ang banal na bagay[a], at huwag ninyong ihagis ang inyong mga perlas sa harap ng mga baboy, baka yapakan nila ang mga iyon sa ilalim ng kanilang mga paa at, pagkabaling sa inyo, ay pagpira-pirasuhin kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang banal” o “ang sagradong bagay.” Malawak ang pananalitang Griyego at hindi tiyak kung ano ang tinutukoy na banal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ang banal na bagay
  rationale: Ang pang-uring neuter singular na ginamit bilang pangngalan ay sadyang malawak ang tinutukoy. Pinananatili nitong bukas kung ito ay banal na aral, bagay na itinalaga, o iba pang sagrado.
- source_word: κυσίν
  choice: sa mga aso
  rationale: Tuwirang salin ng pangmaramihang datibo; pinananatili ang matalas at nakasasakit na puwersa ng talinghaga.
- source_word: βάλητε
  choice: ihagis
  rationale: Natural at kasalukuyang Filipino para sa βάλλω at angkop sa larawan ng paghahagis ng mga perlas.
- source_word: μαργαρίτας
  choice: mga perlas
  rationale: Karaniwang kahulugan ng salita, na pinananatili sa anyong maramihan.
- source_word: χοίρων
  choice: mga baboy
  rationale: Malinaw at natural sa modernong Filipino at pinananatili ang orihinal na talinghaga.
- source_word: μήποτε
  choice: baka
  rationale: Natural na pananda sa Filipino ng babala tungkol sa maaaring masamang resulta.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: yurakan nila ang mga iyon
  rationale: Sapat nang ipinahihiwatig ng pandiwang “yurakan” ang pag-apak sa ilalim ng mga paa, kaya iniiwasan ang mabigat na pag-uulit habang pinananatili ang buong larawan.
- source_word: στραφέντες
  choice: pagkatapos ay balingan kayo
  rationale: Ipinahahayag ang kasunod na pagkilos ng pagharap o pagbaling ng mga baboy laban sa mga tao, nang hindi ginagawang sabay lamang sa pagyurak.
- source_word: ῥήξωσιν
  choice: lapain
  rationale: Sa konteksto ng mababangis na hayop, natural na ipinahahayag ng “lapain” ang marahas na pagpunit o pagwasak na taglay ng ῥήγνυμι.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Pinananatili ang pangmaramihang ikalawang panauhan, na malinaw sa anyong “ninyong/kayo” sa Filipino.
theological_decisions:
- issue: Kahulugan ng “banal na bagay,” “mga aso,” “mga perlas,” at “mga baboy”
  choice: Panatilihin ang mga talinghaga nang walang idinagdag na paliwanag sa pangunahing teksto.
  alternative: Tukuyin ang “banal na bagay” bilang banal na aral o mensahe ng kaharian, at ang mga aso at baboy bilang masasama o mga taong laban sa ebanghelyo.
  rationale: Hindi tiyak na ipinapaliwanag ng talata ang bawat larawan. Ang hindi pagpapakitid sa mga ito ay nagpapanatili sa tunay na lawak at tensiyong teolohikal ng teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang pangmaramihang “ninyo/kayo” upang katawanin ang ὑμᾶς. Pinanatili ang matitinding talinghaga at iniwasan ang tradisyonal ngunit hindi gaanong natural na mga parirala. Ang “lapain” ay pinili bilang malinaw at buhay na paglalarawan ng marahas na pagpunit ng hayop.
