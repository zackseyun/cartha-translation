  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: tl
  text: Gayundin[a], bawat mabuting puno ay namumunga ng mabubuting bunga, ngunit ang bulok[b] na puno ay namumunga ng masasamang bunga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kaya naman” o “Sa ganitong paraan.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na isinaling “bulok” ay maaari ring mangahulugang “sira,” “masama,” o “walang silbi.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego na isinaling “masasama” ay maaari ring mangahulugang “masama,” “buktot,” o “nakapipinsala.” Sa konteksto ng puno at bunga, pinananatili ng salin ang konkretong larawang agrikultural at ang moral na pahiwatig nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Likas na ipinahahayag sa modernong Tagalog ang pagbubuod o paghinuha mula sa naunang larawan; hindi nito inaalis ang posibilidad ng diwang “sa ganitong paraan.”
- source_word: πᾶν δένδρον
  choice: ang bawat ... puno
  rationale: Pinananatili ang distributibong diwa ng πᾶν na may pangngalang isahan at ang pangkalahatang bisa ng kasabihan.
- source_word: ἀγαθὸν
  choice: mabuting
  rationale: Malawak at payak na katumbas ito na maaaring tumukoy sa kalidad ng puno nang hindi labis na binibigyang-kahulugan ang talinghaga.
- source_word: καρποὺς καλοὺς
  choice: mabuting bunga
  rationale: Natural sa Tagalog ang kolektibong isahang “bunga” matapos ang “namumunga”; malinaw nitong naihahatid ang positibong kalidad ng mga bunga kahit maramihan ang anyong Griyego.
- source_word: ποιεῖ
  choice: namumunga ng
  rationale: Sa larawan ng puno at bunga, ito ang karaniwan at natural na paraan sa Tagalog upang ipahayag ang paggawa o pagluwal ng bunga.
- source_word: τὸ δὲ
  choice: ngunit ang
  rationale: Malinaw na pinananatili ang pagsalungat sa pagitan ng dalawang uri ng puno.
- source_word: σαπρὸν
  choice: bulok
  rationale: Tuwirang inilalarawan ang bagay na nabulok, nasira, o wala nang silbi; mas matingkad at mas tiyak ito kaysa sa pangkalahatang “masama.”
- source_word: καρποὺς πονηροὺς
  choice: masamang bunga
  rationale: Natural sa agrikultural na larawan ang “masamang bunga,” habang nananatili rin ang posibleng moral na pahiwatig ng πονηρός ayon sa konteksto.
theological_decisions:
- issue: Moral na diwa kumpara sa literal na larawang agrikultural
  choice: Panatilihin ang tuwirang larawan ng puno at bunga at hayaang ang konteksto ang magbigay ng moral na aplikasyon.
  alternative: Gumamit ng mas nagpapaliwanag na pananalita gaya ng “tiwaling puno” at “masasamang gawa.”
  rationale: Talinghaga mismo ang sinasabi ng Griyego, hindi ang tahasang paliwanag nito. Sa ganitong salin, hindi ipinapalit ang interpretasyon sa mismong larawan at napapanatili ang tensiyon sa pagitan ng konkretong larawan at moral na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang karaniwang idyomang “namumunga ng” sa halip na literal na “gumagawa ng.” Ang kolektibong “bunga” ay natural sa Tagalog at hindi nagpapawalang-bisa sa maramihang καρπούς. Inilagay ang bawat panandang talababa sa mismong teksto.
