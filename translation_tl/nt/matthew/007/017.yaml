  terminology: Ang “bulok” ay matapat at matingkad para sa σαπρός. Ang “masasamang bunga” ay natural para sa καρποὺς πονηρούς sa loob ng larawang agrikultural at hindi ipinipilit ang isang partikular na moral na pagpapakahulugan. Hindi dapat palitan ng “buktot” sa pangunahing teksto, sapagkat mas interpretatibo iyon.
