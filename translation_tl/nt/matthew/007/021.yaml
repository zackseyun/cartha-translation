id: MAT.7.21
reference: Matthew 7:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: tl
  text: Hindi lahat ng nagsasabi sa akin, ‘Panginoon, Panginoon,’ ay makakapasok sa kaharian ng langit[a], kundi ang gumagawa ng kalooban ng aking Ama na nasa langit[b] ang makakapasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “kaharian ng mga langit.” Madalas gamitin ni Mateo ang pananalitang ito kung saan “kaharian ng Diyos” naman ang ginagamit sa ibang konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga langit” din sa dulo ng talata; isinalin dito sa natural na Tagalog bilang “langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Hindi lahat ng nagsasabi sa akin
  rationale: Pinananatili ng “hindi lahat” ang bahagyang pagtanggi ng Οὐ πᾶς, sa halip na gawing “walang sinuman.” Likas sa Tagalog ang sugnay na “nagsasabi” para sa articular present participle.
- source_word: Κύριε κύριε
  choice: Panginoon, Panginoon
  rationale: Ang “Panginoon” ang malinaw at nakaugaliang katumbas ng κύριος sa ganitong tuwirang pagtawag; pinanatili ang pag-uulit bilang pagbibigay-diin.
- source_word: εἰσελεύσεται
  choice: makakapasok
  rationale: Likas na ipinahahayag ng “makakapasok” ang hinaharap na pagpasok at ang usapin kung sino ang tatanggap ng pagpasok, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: sa kaharian ng langit
  rationale: Ang “kaharian ng langit” ay natural at malinaw na Tagalog para sa natatanging parirala ni Mateo; ang πληθυντικός na “mga langit” ay ipinapaliwanag sa talababa.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: kundi ang gumagawa
  rationale: Pinananatili ng “kundi” ang matalas na pagsalungat at ng “ang gumagawa” ang isahang substantival participle, nang hindi ginagawang makaluma ang pahayag.
- source_word: τὸ θέλημα
  choice: ang kalooban
  rationale: Ang “kalooban” ay dignified at karaniwang katumbas ng θέλημα sa kontekstong tumutukoy sa nais at layunin ng Ama.
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: ng aking Ama na nasa langit
  rationale: Direktang pinananatili ang “aking Ama” at ang kasunod na pariralang tumutukoy sa kaniyang kinaroroonan; idiomatiko sa Tagalog ang isahang “langit.”
theological_decisions:
- issue: Pagpasok sa kaharian kaugnay ng pagtawag kay Jesus bilang Panginoon at paggawa ng kalooban ng Ama
  choice: Pinaghaharap ng talata ang basta pagsasabi ng “Panginoon” at ang paggawa ng kalooban ng Ama, nang hindi binubuo rito ang isang mas malawak na sistema ng kaligtasan.
  alternative: Maaaring basahin ito bilang pagtuturo na sapat ang mga gawa upang maging matuwid, o sa kabaligtaran na sapat ang berbal na pagpapahayag lamang.
  rationale: Malinaw sa Griyego ang kaibahan ng λέγων at ποιῶν. Dapat panatilihin ng salin ang babala at teolohikal na tensiyon nang hindi ipinapasok ang mga konklusyong denominasyonal na hindi tahasang sinasabi ng talata.
- issue: Di-nakasulat na pandiwa sa ikalawang sugnay
  choice: Inulit sa Tagalog ang “ang makakapasok” upang maging buo at malinaw ang paghahambing.
  alternative: 'Iwan itong eliptikal: “kundi ang gumagawa ng kalooban…”'
  rationale: Bagaman ipinahihiwatig lamang ng Griyego ang pandiwa sa ikalawang sugnay, kailangan itong ulitin sa natural na Tagalog upang maiwasan ang bitin o malabong pangungusap; walang bagong kahulugang idinaragdag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kundi” upang idiin ang contrast, at iniwasan ang masyadong kolokyal o makalumang anyo. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
