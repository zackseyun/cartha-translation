  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: tl
  text: O paano mo sasabihin sa iyong kapatid[a], ‘Hayaan mo akong alisin ang puwing sa mata mo,’ at heto, may biga sa sarili mong mata?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking isahan ang salitang Griyego; literal na “kapatid na lalaki.”
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinakikilala nito ang kasunod na retorikal na tanong bilang isa pang posibilidad sa pangangatwiran ni Jesus.
- source_word: πῶς ἐρεῖς
  choice: paano mo sasabihin
  rationale: Pinananatili ang anyong panghinaharap at ang mapanghamong puwersa ng retorikal na tanong.
- source_word: τῷ ἀδελφῷ σου
  choice: sa iyong kapatid
  rationale: Ang “kapatid” ay likas sa Tagalog at hindi kailangang tukuyin ang kasarian, bagaman panlalaking isahan ang anyong Griyego.
- source_word: Ἄφες ἐκβάλω
  choice: Hayaan mong alisin ko
  rationale: Likas na pakiusap ng pahintulot sa Tagalog at malinaw na inilalarawan ang pag-aalis mula sa mata.
- source_word: τὸ κάρφος
  choice: ang puwing
  rationale: Sa konteksto ng mata, ang “puwing” ay natural at madaling maunawaang katawagan para sa maliit na tuyong bagay o munting pirasong nakapasok sa mata.
- source_word: καὶ ἰδοὺ
  choice: gayong, tingnan mo
  rationale: Ang “tingnan mo” ay nagpapanatili sa pantawag-pansing puwersa ng ἰδού; ang “gayong” ay natural na naghahayag ng matinding pagsalungat sa ipinapanukalang kilos.
- source_word: ἡ δοκὸς
  choice: isang tahilan
  rationale: Ang δοκός ay malaking piraso ng kahoy na ginagamit bilang structural beam; “tahilan” ang tumpak na katumbas sa Tagalog at nagpapanatili sa eksaheradong paghahambing.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: nasa sarili mong mata
  rationale: Pinananatili ang lokasyon at ginagawang malinaw ang mariing pagtut contrast sa mata ng kausap.
theological_decisions:
- issue: Kasarian at saklaw ng ἀδελφῷ
  choice: kapatid
  alternative: kapatid na lalaki; kapwa mananampalataya
  rationale: Hindi minamarkahan ng salitang Tagalog na “kapatid” ang kasarian, kaya likas nitong maisinasalin ang ugnayang tinutukoy nang hindi nagdaragdag ng interpretibong paglilinaw sa pangunahing teksto. Ipinaliliwanag sa talababa ang panlalaking isahan ng Griyego.
- issue: Eksaheradong paghahambing ng κάρφος at δοκός
  choice: puwing / tahilan
  alternative: munting piraso / malaking troso; tinik / biga
  rationale: Pinananatili ng pares ang sadyang napakalaking agwat sa dalawang bagay at ang matingkad na larawang ginamit ni Jesus, nang hindi binabawasan ang retorikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “puwing” bilang natural na salita sa konteksto ng mata at “tahilan” upang tumpak na maipakita ang malaking structural beam. Ang “tingnan mo” ay mas kasalukuyan kaysa “narito” o isang makalumang katumbas ng “behold.”
