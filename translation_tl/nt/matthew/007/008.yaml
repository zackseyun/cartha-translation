  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: tl
  text: Sapagkat ang bawat humihingi ay tumatanggap; ang naghahanap ay nakasusumpong; at ang kumakatok ay pagbubuksan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at para sa kumakatok, bubuksan ito.” Hindi tahasang binabanggit sa Griyego ang “pinto”; ipinahihiwatig lamang iyon ng larawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: bawat
  rationale: Ginamit na panuring sa substantival participle upang ipahayag ang pangkalahatan at saklaw na walang itinatanging humihingi.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang panghihikayat.
- source_word: ὁ αἰτῶν
  choice: ang bawat humihingi
  rationale: Likas na salin ng articular present participle bilang pangkalahatang uri; pinananatili rin ang diwang palagian o pangkalahatan.
- source_word: λαμβάνει
  choice: tumatanggap
  rationale: Karaniwan at marangal na katumbas na nagpapanatili sa payak na paralelismo ng pahayag.
- source_word: ὁ ζητῶν
  choice: ang naghahanap
  rationale: Pinananatili ang substantival participle at ang maindayog na pagkakatulad ng tatlong sugnay.
- source_word: εὑρίσκει
  choice: nakasusumpong
  rationale: Malinaw na ipinapakita ang resulta ng paghahanap at iniiwasan ang paulit-ulit na 'naghahanap—nakakahanap.'
- source_word: τῷ κρούοντι
  choice: ang kumakatok
  rationale: Isinasalin nang natural sa Tagalog bilang benepisyaryo ng pagbubukas, nang hindi idinaragdag ang salitang 'pinto.'
- source_word: ἀνοιγήσεται
  choice: ay pagbubuksan
  rationale: Pinananatili ang future passive sense sa likas na konstruksiyong Tagalog at hindi tahasang nagdaragdag ng bagay na bubuksan.
theological_decisions:
- issue: Saklaw at bisa ng pangako
  choice: Isang pangkalahatang katiyakang ipinahayag sa malawak na pananalita, nang walang idinagdag na limitasyon o absolutong paliwanag.
  alternative: Isang walang-pasubaling garantiya na bawat partikular na kahilingan ay ibibigay nang eksakto ayon sa hiniling, o isang pangakong para lamang sa ilang espirituwal na kahilingan.
  rationale: Malawak ang pananalita ng Griyego at dapat itong panatilihin. Hindi nililimitahan o pinalalawak ng salin ang pangako nang higit sa mismong sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang semicolon upang mapanatili ang tatlong magkakatulad at madaling tandaan na sugnay. Ang “nakasusumpong” ay bahagyang mataas ang register ngunit karaniwan pa ring nauunawaan at angkop sa dignidad ng teksto.
