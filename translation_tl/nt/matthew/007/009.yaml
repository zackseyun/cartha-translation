  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: tl
  text: O sinong tao sa inyo ang magbibigay ng bato sa kanyang anak na lalaki kapag humingi ito sa kanya ng tinapay?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Likas na pang-ugnay sa Tagalog na nagpapatuloy sa retorikal na paghahambing mula sa naunang talata.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: sino sa inyong mga tao
  rationale: Pinananatili ang pagtukoy sa isang tao mula sa mga kausap, ngunit inayos sa likas na tanong sa Tagalog.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: kapag humingi ito sa kanya ang kanyang anak
  rationale: Ang panghinaharap na αἰτήσει ay gumaganap sa isang pangkalahatang sitwasyong ipinapalagay; ang 'kapag humingi' ay natural sa Tagalog at hindi nagpapahiwatig ng iisang tiyak na pangyayari. Ginamit ang 'ito' upang maiwasan ang paulit-ulit na 'anak'.
- source_word: ἄρτον
  choice: tinapay
  rationale: Tuwirang katumbas at malinaw ang kaibahan nito sa bato; hindi pinalawak tungo sa pangkalahatang 'pagkain'.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: ang bibigyan ng bato ang kanyang anak
  rationale: Ang μή ay naghuhudyat ng tanong na umaasa sa sagot na hindi. Sa Tagalog, naihahatid ito nang natural ng retorikal na ayos ng buong tanong.
theological_decisions:
- issue: Kasariang kinakatawan ng ἄνθρωπος at υἱός
  choice: mga tao ... anak
  alternative: mga lalaki ... anak na lalaki
  rationale: Ang ἄνθρωπος ay tumutukoy sa tao sa pangkalahatan, hindi tahasang sa adultong lalaki, kaya 'mga tao' ang angkop. Ang υἱός ay literal na 'anak na lalaki,' ngunit sa karaniwang Tagalog ang 'anak' ay likas at sapat sa relasyong magulang-anak; hindi nito binabago ang punto ng paghahambing.
- issue: Retorikal na tanong na may μή
  choice: positibong anyo ng tanong na malinaw na umaasa sa sagot na 'wala'
  alternative: hindi ba't hindi niya ito bibigyan ng bato?
  rationale: Pinananatili ang retorikal na puwersa nang hindi nagdaragdag ng dobleng pagtanggi o paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Inuna ang likas na ayos ng retorikal na tanong kaysa sa mekanikal na pagsunod sa sintaks ng Griyego.
