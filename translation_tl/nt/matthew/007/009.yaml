  source_fidelity: 'Kailangang itama ang baligtad na gampanin sa pangunahing sugnay: ang ama/tao ang nagbibigay, hindi siya ang binibigyan. Dapat ding panatilihin ang tiyak na kahulugan ng υἱός bilang “anak na lalaki.” Ang retorikal na tanong ay maayos na naihahatid ng “Sinong tao ... ang magbibigay...?” na likas na umaasa ng sagot na wala.'
