  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: tl
  text: At bumagsak ang ulan, dumating ang mga ilog[a], umihip ang mga hangin at humampas[b] sa bahay na iyon. At hindi ito bumagsak, sapagkat ang pundasyon nito ay nasa bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumating ang mga baha” o “rumagasa ang mga tubig”; ang salitang Griyego na ποταμοί ay mas literal na nangangahulugang “mga ilog.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumalpok” o, sa mas literal na pananalita, “bumagsak laban sa” bahay na iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: bumagsak ang ulan
  rationale: Likas sa makabagong Tagalog ang pariralang ito at pinananatili nito ang pababang galaw ng καταβαίνω nang hindi dinaragdagan ang tindi na maaaring ipahiwatig ng “bumuhos.”
- source_word: οἱ ποταμοί
  choice: ang mga ilog
  rationale: Ang ποταμοί ay literal na “mga ilog.” Bagaman maaaring tumukoy ang tagpo sa mga rumaragasang tubig o baha, pinananatili sa pangunahing teksto ang karaniwang leksikal na kahulugan at inilalagay sa talababa ang kontekstuwal na alternatibo.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: umihip ang mga hangin
  rationale: Tuwirang salin ito ng pandiwa at simuno, at malinaw at natural sa Tagalog.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: humampas sa bahay na iyon
  rationale: Ipinahahayag ng “humampas” ang marahas na pagtama sa konteksto ng bagyo, habang ang talababa ay nagpapanatili sa mas literal na mga posibilidad ng προσπίπτω.
- source_word: οὐκ ἔπεσεν
  choice: hindi iyon bumagsak
  rationale: Tuwiran at natural itong katumbas ng ἔπεσεν; hindi nito pinatitindi ang diwa sa “gumuho.”
- source_word: τεθεμελίωτο
  choice: naitatag iyon
  rationale: Ipinahihiwatig ng anyong pluperfect passive ang nauna nang pagkakatatag ng bahay. Ang “naitatag” ay dignified at nauunawaan, bagaman hindi kasing-lantad ng “nakapundasyon” ang imahen ng pundasyon.
- source_word: ἐπὶ τὴν πέτραν
  choice: sa ibabaw ng bato
  rationale: Pinananatili nito ang karaniwang kahulugan ng πέτρα at hindi ito ginagawang mas tiyak na “batong-buô” o bedrock.
theological_decisions:
- issue: Larawan ng pundasyon sa talinghaga
  choice: sa ibabaw ng bato
  alternative: sa ibabaw ng batong-buô
  rationale: Hindi tahasang ipinakikilala ng talatang ito kung sino o ano ang sinasagisag ng bato. Pinananatili ng salin ang larawan nang hindi ipinapasok ang isang partikular na teolohikal na pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sunod-sunod na galaw ng bagyo at ang pag-uulit ng “bumagsak,” na nasa Griyego rin. Ginamit ang “iyon” upang malinaw na tumukoy sa bahay.
