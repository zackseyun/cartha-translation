  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: tl
  text: At ang bawat nakikinig sa mga salita kong ito at hindi ginagawa ang mga iyon ay matutulad sa isang hangal na lalaki,[a] na nagtayo ng kanyang bahay sa buhangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang taong hangal.” Sa Griyego, “isang hangal na lalaki” ang gamit sa paghahambing, bilang panlalaking katawagang kumakatawan sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: ang bawat nakikinig
  rationale: Ang substantival na present participle ay panlahat. Likas sa Filipino ang “ang bawat nakikinig” at pinananatili nito ang patuloy o pangkalahatang diwa ng pakikinig.
- source_word: μου τοὺς λόγους τούτους
  choice: sa mga salita kong ito
  rationale: Pinananatili nito ang diin ng demonstrative na “ito” at ang kaugnayang paari ng “kong,” habang natural ang ayos sa modernong Filipino.
- source_word: μὴ ποιῶν αὐτούς
  choice: hindi ginagawa ang mga iyon
  rationale: Ang ποιέω ay tumutukoy sa paggawa o pagsasakatuparan ng narinig. Ang “ginagawa” ay tuwiran at pinananatili ang anyo at paralelismo sa naunang talata; ang “mga iyon” ay malinaw na tumutukoy sa mga salita.
- source_word: ὁμοιωθήσεται
  choice: matutulad
  rationale: Ipinahahayag ng anyong future passive ang paghahambing. Ang “matutulad” ay maikli, natural, at hindi nawawala ang hinaharap na diwa.
- source_word: ἀνδρὶ μωρῷ
  choice: sa isang hangal na lalaki
  rationale: Ang ἀνήρ ay espesipikong lalaking tao, at ang μωρός ay angkop na isaling “hangal.” Pinananatili ang panlalaking larawan ng paghahambing nang hindi nililimitahan ang pangkalahatang aplikasyon nito.
- source_word: ὅστις
  choice: na
  rationale: Natural na iniuugnay ng “na” ang paglalarawan sa lalaking tinutukoy; hindi kailangang gawing mas mabigat ang konstruksiyon.
- source_word: ᾠκοδόμησεν
  choice: nagtayo
  rationale: Tuwiran at karaniwang salin ito para sa pagtatayo ng isang bahay.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: ng kanyang bahay
  rationale: Ang “bahay” ay tumutukoy sa pisikal na gusali sa paghahambing, at natural na ipinahahayag ng “kanyang” ang paari.
- source_word: ἐπὶ τὴν ἄμμον
  choice: sa buhanginan
  rationale: Sa konteksto ng pundasyon ng bahay, natural sa Filipino ang “sa buhanginan,” na tumutukoy sa mabuhanging lugar o ibabaw na pinagtayuan.
theological_decisions:
- issue: Panlalaking wikang kumakatawan sa pangkalahatang paghahambing
  choice: isang hangal na lalaki
  alternative: isang taong hangal
  rationale: Gumagamit ang Griyego ng panlalaking pangngalang ἀνήρ sa isang paghahambing na may pangkalahatang aplikasyon. Pinananatili ng salin ang espesipikong larawang lalaki, habang ipinapaliwanag sa talababa na saklaw ng babala ang sinumang nakikinig ngunit hindi gumagawa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang tuwirang paralelismo ng pakikinig at paggawa, pati ang panlalaking detalye ng orihinal, na nilinaw sa talababa.
