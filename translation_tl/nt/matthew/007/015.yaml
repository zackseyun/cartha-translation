base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: tl
  text: Mag-ingat kayo sa mga huwad na propeta[a] na lumalapit sa inyo na nakasuot ng damit ng mga tupa[b], ngunit sa loob ay mga lobong mandaragit sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Magbantay kayo laban sa mga huwad na propeta.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nakasuot ng mga damit ng mga tupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Mag-ingat kayo sa
  rationale: Ipinahahayag ng pangkasalukuyang pautos na maramihan ang patuloy na pagbabantay laban sa isang panganib. Likas sa modernong Tagalog ang pariralang “mag-ingat sa” at malinaw ang lakas ng babala.
- source_word: ψευδοπροφητῶν
  choice: mga huwad na propeta
  rationale: Tuwirang tumutukoy sa mga nag-aangking propeta ngunit hindi tunay o nagsasalita nang may huwad na awtoridad. Ang “huwad na propeta” ang malinaw at kinikilalang katumbas sa Tagalog.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: na lumalapit sa inyo
  rationale: Natural na inilalarawan ang kanilang sadyang paglapit sa mga tagapakinig. Bahagyang higit na malinaw sa konteksto ang “lumalapit” kaysa sa payak na “pumupunta.”
- source_word: ἐν ἐνδύμασι προβάτων
  choice: na nakadamit-tupa
  rationale: Pinananatili ang matingkad na talinghaga ng panlabas na anyong tila tupa nang hindi ipinapalit ang “balat,” na hindi tahasang sinasabi ng Griyego.
- source_word: ἔσωθεν δέ
  choice: ngunit sa loob
  rationale: Pinananatili ang tuwirang pagsalungat ng panlabas na anyo at panloob na realidad. Ang “sa loob” ay hindi nagpapaliit sa talinghaga sa damdamin o intensiyon lamang.
- source_word: λύκοι ἅρπαγες
  choice: mga lobong mandaragit
  rationale: Ang ἅρπαγες ay naglalarawan ng mapanamsam at mapaminsalang katangian. Mas eksakto ang “mandaragit” kaysa sa salitang nakatuon lamang sa gutom, at nananatiling malinaw at masidhi ang larawan.
theological_decisions:
- issue: Saklaw ng babala laban sa mga mapanlinlang na lider na panrelihiyon
  choice: Isinalin ang larawan bilang pangkalahatang babalang moral at espirituwal laban sa mga huwad na propeta.
  alternative: Tukuyin sila nang mas makitid bilang mga erehe o bilang isang partikular na uri ng opisyal sa institusyon ng iglesya.
  rationale: Ang talata mismo ay nakatuon sa pagkakaiba ng mapanlinlang na panlabas na anyo at mapaminsalang panloob na realidad. Hindi nito tahasang itinatakda ang mga kategoryang pang-institusyon o pangdenominasyon na umusbong kalaunan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang maramihang “kayo/inyo” upang katawanin ang maramihang anyo sa Griyego. Pinanatili ang talinghaga sa halip na ipaliwanag ito sa mismong teksto.
