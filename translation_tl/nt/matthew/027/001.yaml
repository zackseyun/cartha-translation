  naturalness: Natural at marangal sa modernong Filipino ang “nagsanggunian” para sa pormal na sama-samang pag-uusap o deliberasyon ng mga pinuno. Mas malinaw nitong naipapahayag ang ginawa kaysa “nagpulong” nang hindi nagdaragdag ng diwa ng lihim na sabwatan.
  terminology: Ang “mga punong pari,” “mga nakatatanda ng bayan,” at “Jesus” ay angkop at dapat panatilihin. Walang terminong teolohikal na nangangailangan ng pagbabago.
