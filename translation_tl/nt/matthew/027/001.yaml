  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: tl
  text: Pagsapit ng umaga, nagsanggunian ang lahat ng mga punong pari at mga nakatatanda ng bayan laban kay Jesus upang patayin siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Pagsapit ng umaga
  rationale: Likas na temporal na panimula sa Filipino na malinaw na nagpapahiwatig ng pagsapit ng umaga; hindi na kailangang isalin nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: συμβούλιον ἔλαβον
  choice: nagpulong
  rationale: Sa kontekstong ito, ipinahihiwatig ng idyoma ang pormal na pagsasangguni o pagpupulong ng mga pinuno. Ang “nagpulong” ay natural at hindi nagdaragdag ng higit na sabwatan kaysa sa sinasabi ng Griyego.
- source_word: πάντες
  choice: lahat
  rationale: Hayagang pinananatili ang diin sa kabuuan ng tinutukoy na pangkat ng mga pinuno.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa Filipino para sa uring namumuno sa mga pari sa Jerusalem; iniiwasan nitong magpahiwatig na maraming sabay-sabay na may iisang katungkulan ng Kataas-taasang Pari.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: mga nakatatanda ng bayan
  rationale: Pinananatili ang pormal na katawagan sa mga kinikilalang pinuno ng bayan sa natural at marangal na Filipino.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: laban kay Jesus
  rationale: Ang κατά na may genitive sa mapanlabang kontekstong ito ay nagpapahayag ng pagsalungat, hindi lamang ng paksa ng pag-uusap.
- source_word: ὥστε
  choice: upang
  rationale: Maikli at natural na nagpapahayag ng nilalayong bunga o layunin nang hindi sapilitang pinipili sa pagitan ng mahigpit na layunin at resulta.
- source_word: θανατῶσαι αὐτόν
  choice: ipapatay siya
  rationale: Ipinahihiwatig ng causative na “ipapatay” na hinahangad ng mga pinuno na maisagawa ang pagpatay kay Jesus, na angkop sa kasunod na paglilipat sa awtoridad ng Roma; nananatili rin itong mas pormal kaysa “patayin.”
theological_decisions:
- issue: Kalikasan ng ginawa ng mga pinuno laban kay Jesus
  choice: Ilarawan ito bilang pormal na pagpupulong na laban kay Jesus at naglalayong ipapatay siya.
  alternative: “Nagbalak laban kay Jesus na patayin siya” o mas mahinang “nagsangguni tungkol kay Jesus.”
  rationale: Malinaw sa Griyego ang pagsalungat (κατὰ τοῦ Ἰησοῦ) at ang nakamamatay na layunin (ὥστε θανατῶσαι αὐτόν). Ang “nagpulong” ay hindi nagdaragdag ng tiyak na diwa ng lihim na sabwatan, samantalang pinananatili ng “laban” at “upang ipapatay” ang bigat at direksiyon ng kanilang pasiya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga nakatatanda” bilang pormal ngunit karaniwang katawagan sa mga pinuno, at “ipapatay” upang akma sa hudisyal at causative na konteksto.
