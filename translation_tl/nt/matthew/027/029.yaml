id: MAT.27.29
reference: Matthew 27:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: tl
  text: At matapos silang magtirintas ng koronang tinik, ipinutong nila iyon sa kanyang ulo at inilagay ang isang tambo sa kanyang kanang kamay. Pagkatapos, lumuhod sila sa harap niya at nilibak siya. Sinabi nila, “Mabuhay ang Hari ng mga Hudyo![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hari ng mga taga-Judea.” Maaaring tumukoy ang salitang Griyego na Ἰουδαίων sa mga taga-Judea o sa mga Hudyo; dito, bahagi ito ng mapanuyang titulong maharlika na itinawag kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: matapos silang magtirintas
  rationale: Ipinapakita ng aorist participle ang kilos na nauna sa pagputong; natural sa Tagalog ang ganitong pagkakasunod-sunod.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: koronang tinik
  rationale: Likas at malinaw na parirala sa Tagalog para sa koronang yari sa mga tinik, at pinananatili ang larawan ng pangungutya sa pagkahari.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ipinutong nila iyon sa kanyang ulo
  rationale: Ang “ipinutong” ang tiyak at natural na pandiwa para sa paglalagay ng korona sa ulo.
- source_word: κάλαμον
  choice: isang tambo
  rationale: Pinananatili ang literal na bagay nang hindi tahasang tinatawag na setro, bagaman ginagamit ito bilang huwad na sagisag ng hari.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: sa kanyang kanang kamay
  rationale: Malinaw na ipinahahayag ang kinalalagyan ng tambo at ang detalyeng nasa Griyego.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: lumuhod sila sa harap niya
  rationale: Natural na Tagalog na nagpapanatili sa kilos at posisyon ng kunwaring pagpupugay.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: nilibak siya
  rationale: Ang “nilibak” ay angkop sa marangal na salaysay at malinaw na nagpapahayag ng mapanlait na pangungutya.
- source_word: Χαῖρε
  choice: Mabuhay
  rationale: Sa konteksto ng mapanuyang pagbati sa isang hari, ang “Mabuhay” ay natural na pormula ng pagpupugay at mas angkop kaysa karaniwang pagbati.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Hari ng mga Hudyo
  rationale: Pinananatili ang tuwirang royal title at ang karaniwang malawak na etnorelihiyosong kahulugan sa salaysay ng pagpapakasakit.
theological_decisions:
- issue: Pagpapanatili sa ironya ng mapanuyang pagpupugay nang hindi pinahihina ang titulong maharlika
  choice: “Mabuhay ang Hari ng mga Hudyo!”
  alternative: “Binabati ka namin, Hari ng mga Hudyo!”
  rationale: Ang “Mabuhay” ay may tono ng pampublikong pagpupugay sa pinuno at malinaw na gumagana rito bilang mapanuyang pagbati.
- issue: Saklaw ng Ἰουδαίων sa titulong ibinibigay kay Jesus
  choice: mga Hudyo
  alternative: mga taga-Judea
  rationale: Maaaring tumukoy ang salitang Griyego sa mga Judeano o sa mga Hudyo sa mas malawak na diwang etnorelihiyoso. Sa pormula ng paratang at pangungutya sa salaysay na ito, “mga Hudyo” ang mas natural, ngunit itinatala ang tunay na alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinutong,” “tambo,” at “nilibak” upang mapanatili ang kongkretong larawan at solemneng himig ng salaysay. Inilipat ang talababa sa “mga Hudyo,” ang salitang talagang tinutukoy ng paliwanag.
