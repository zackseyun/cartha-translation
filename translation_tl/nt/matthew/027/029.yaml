  source_fidelity: 'Tapat ang salin sa mga pangunahing elemento ng Griyego: ang pagtitirintas ng koronang yari sa tinik, pagputong nito sa ulo, paglalagay ng tambo sa kanang kamay, pagluhod sa harap ni Jesus, panlilibak, at ang mapanuyang pagbati. Ang paghahati sa pangungusap ay hindi nagbabago sa ugnayan o pagkakasunod ng mga kilos.'
  naturalness: Natural at malinaw ang makabagong Tagalog. Ang “ipinutong,” “tambo,” at “nilibak” ay angkop sa marangal na himig ng salaysay. Ang “Mabuhay ang Hari ng mga Hudyo!” ay isang likas na pormula ng pampublikong pagpupugay at epektibong naihahatid ang ironya ng panunuya.
  terminology: Ang “koronang tinik,” “tambo,” at “Hari ng mga Hudyo” ay wastong mga katumbas. Sapat at tumpak ang talababa sa “mga Hudyo,” sapagkat kinikilala nito ang leksikal na posibilidad na “mga taga-Judea” nang hindi ipinipilit ang isang mas makitid na kahulugan.
