  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: tl
  text: na nagsabi, “Ginoo, naalala namin na sinabi ng manlilinlang na iyon noong nabubuhay pa siya[b], ‘Pagkalipas ng tatlong araw, babangon ako.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Pagkalipas ng tatlong araw, ibabangon ako.” Kasalukuyang anyo ang pandiwa sa Griyego: “bumabangon ako” o “binabangon ako.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring ayusin: “na noong nabubuhay pa ang manlilinlang na iyon ay sinabi niya.”'
    reason: previous_rendering
lexical_decisions:
- source_word: λέγοντες
  choice: na nagsabi
  rationale: Ang kasalukuyang pandiwaring ito ay nag-uugnay sa pagsasalita sa kilos sa naunang talata; natural sa Tagalog ang pang-ugnay na “na nagsabi.”
- source_word: Κύριε
  choice: Ginoo
  rationale: Magalang na pantawag ito kay Pilato. Pinananatili ng “Ginoo” ang anyo ng κύριος nang hindi ipinahihiwatig na kinikilala siya bilang Diyos.
- source_word: ἐμνήσθημεν
  choice: naalala namin
  rationale: Bagaman aorist ang anyo, ang “naalala namin” ay natural na simpleng nagdaang kilos sa Tagalog at ipinapakitang may kasalukuyang saysay ang kanilang pag-alaala.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: ang manlilinlang na iyon
  rationale: Ang “manlilinlang” ay malinaw na tumutukoy sa taong nanlilinlang o nagliligaw; ang “na iyon” ay nagpapanatili sa mapanlibak at mapaglayong himig ng demonstratibo.
- source_word: ἔτι ζῶν
  choice: noong nabubuhay pa siya
  rationale: Natural at malinaw nitong ipinapahayag na sinabi niya ito bago siya namatay.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Pagkalipas ng tatlong araw
  rationale: Tuwirang inilalarawan nito ang μετά na may akusatibo bilang “pagkatapos,” nang hindi iniaayon sa ibang pormulang “sa ikatlong araw.”
- source_word: ἐγείρομαι
  choice: babangon ako
  rationale: Sa konteksto ng pagkabuhay na muli, natural na katumbas sa Tagalog ang “babangon.” Ginamit ang anyong panghinaharap dahil sa pariralang “pagkalipas ng tatlong araw”; inilalahad sa talababa ang maaaring pasibong pagbasa at ang kasalukuyang anyo ng Griyego.
theological_decisions:
- issue: Pagkakasalin sa hulang sinipi tungkol sa muling pagkabuhay ni Jesus
  choice: Pagkalipas ng tatlong araw, babangon ako
  alternative: Pagkalipas ng tatlong araw, ibabangon ako
  rationale: Maaaring unawain ang ἐγείρομαι bilang gitna/intransitibo o pasibo. Ang “babangon ako” ang pinakanatural sa pangunahing teksto, ngunit hindi ipinagpapalagay na tiyak ang tinig ng pandiwa; pinananatili sa talababa ang pasibong posibilidad at ang di-karaniwang kasalukuyang anyo ng Griyego.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ang “Ginoo” ay magalang na pantawag kay Pilato; ang “manlilinlang na iyon” ay nagpapanatili sa mapanlibak na tono ng mga nagsasalita. Inilagay ang mga marker sa mismong bahaging tinutukoy ng bawat talababa.
