  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: tl
  text: Ngunit sumagot sa kanila ang gobernador, “Sino sa dalawa ang gusto ninyong palayain ko para sa inyo?” Sinabi nila, “Si Barabbas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Ngunit sumagot sa kanila ang gobernador
  rationale: Ang participle na ἀποκριθείς at pandiwang εἶπεν ay isang Semitikong/Griyegong pormula ng pagsagot; pinagsama bilang natural na “sumagot” upang maiwasan ang alanganing “sumagot at sinabi.” Ang δέ ay banayad na paglipat o pagsalungat, kaya “Ngunit,” at ang ἡγεμών ay tiyak na gobernador na Romano sa konteksto.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Sino sa dalawa
  rationale: Humihingi ang tanong ng pagpili sa dalawang taong nabanggit. Ang “Sino sa dalawa” ang natural at tumpak na anyo sa modernong Tagalog.
- source_word: θέλετε
  choice: ang gusto ninyo
  rationale: Ipinahahayag ng θέλω dito ang kagustuhan o pinipiling pasiya; malinaw at karaniwan ang “gusto” sa kasalukuyang Tagalog.
- source_word: ἀπολύσω ὑμῖν
  choice: palayain ko para sa inyo
  rationale: 'Legal ang diwa ng ἀπολύω: pakawalan o palayain mula sa pagkakapiit. Pinananatili ng “para sa inyo” ang benepaktibong datibo na ὑμῖν.'
- source_word: οἱ δὲ εἶπαν
  choice: Sinabi nila
  rationale: Ipinagpapatuloy ng δέ ang salaysay at hindi kailangang laging katawanin ng tahasang pang-ugnay sa Tagalog. Ang “Sinabi nila” ay natural na pambungad sa tuwirang sagot.
- source_word: Τὸν Βαραββᾶν
  choice: Si Barabbas
  rationale: Karaniwang transliterasyon ang “Barabbas,” at ang pantukoy na “Si” ang natural na pananda para sa personal na pangalan bilang sagot sa tanong na “Sino.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “gobernador” bilang tiyak na katawagang pampamahalaan, at pinanatili ang direkta at maigting na palitan sa paglilitis.
