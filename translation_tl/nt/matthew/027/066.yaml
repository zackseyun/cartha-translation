  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: tl
  text: Pagkatapos, pumunta sila at tiniyak nilang ligtas ang libingan sa pamamagitan ng pagtatatak sa bato kasama ang pangkat ng mga bantay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Tinatakan nila ang bato at naglagay sila ng pangkat ng mga bantay.” Maikli ang pariralang Griyego at maaari ring tumukoy sa pagtatatak na ginawa habang kasama o naroon ang pangkat ng mga bantay.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Kaya pumunta sila
  rationale: Ang participle na πορευθέντες ay likas na isinasaling pandiwang may buong anyo sa Filipino. Ang δέ ay nagpapatuloy sa salaysay; ipinahahayag ito ng “Kaya” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ἠσφαλίσαντο
  choice: tiniyak nilang ligtas
  rationale: Ang ἀσφαλίζω ay nangangahulugang gawing ligtas o matiyak na hindi madaling mapakialaman. Natural sa modernong Filipino ang pariralang ito at hindi nito dinaragdagan ang tiyak na paraang hindi naman tahasang sinabi sa Griyego.
- source_word: τὸν τάφον
  choice: ang libingan
  rationale: Ang τάφος ay tumutukoy sa pinaglibingan kay Jesus. Malinaw, dignipikado, at karaniwan sa Filipino ang “libingan.”
- source_word: σφραγίσαντες
  choice: sa pamamagitan ng pagtatatak
  rationale: Maaaring ipahayag ng aorist participle ang paraan kung paano nila tiniyak ang libingan. Ang “sa pamamagitan ng” ay malinaw na naghahatid ng instrumental na diwa.
- source_word: τὸν λίθον
  choice: sa bato
  rationale: Ang λίθος ay ang batong nasa libingan. Hindi idinagdag sa pangunahing teksto ang “nasa pasukan” sapagkat hindi iyon tahasang nakasaad sa talata.
- source_word: μετὰ τῆς κουστωδίας
  choice: kasama ang pangkat ng mga bantay
  rationale: Ang κουστωδία ay isang salitang hiram sa Latin na tumutukoy sa pangkat o detatsment ng mga bantay. Karaniwang nagsasaad ng pagsama ang μετά na may genitive; pinananatili ng salin ang maikling pagkakaugnay nang hindi tiyakang sinasabing doon pa lamang inilagay ang mga bantay.
theological_decisions:
- issue: Kaugnayan ng μετὰ τῆς κουστωδίας sa pagtatatak at pagtiyak sa libingan
  choice: Kasama o sangkot ang pangkat ng mga bantay nang tatakan ang bato.
  alternative: Tinatakan nila ang bato at naglagay sila ng mga bantay.
  rationale: Maikli at maaaring magkaroon ng higit sa isang ugnayang sintaktiko ang pariralang Griyego. Pinananatili ng pangunahing salin ang diwa ng pagsama at iniiwasang gawing hiwalay na kilos ang paglalagay ng mga bantay, samantalang inilalahad sa talababa ang makatwirang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangkat ng mga bantay” upang maipakita ang kolektibong diwa ng κουστωδία nang hindi nagpapasya kung sila ay mga kawal na Romano o mga bantay ng templo.
