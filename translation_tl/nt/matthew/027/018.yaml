  text: For he knew that they had handed him over because of envy[a].
translation:
  language: tl
  text: Sapagkat alam niya na dahil sa inggit ay isinuko nila sa kanya si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa pagkainggit” o “dahil sa paninibugho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alam niya
  rationale: Tuwirang ipinahahayag ng οἶδα ang kaalaman o pagkabatid ni Pilato; natural at malinaw sa modernong Tagalog ang “alam niya.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag kaugnay ng naunang pahayag; pinananatili ng “Sapagkat” ang lohikal na ugnayang ito.
- source_word: ὅτι
  choice: -ng … ang dahilan
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng nalalaman ni Pilato. Isinaayos ang pangungusap nang natural sa Tagalog nang hindi ito ginawang hiwalay na sugnay na sanhi.
- source_word: διὰ φθόνον
  choice: inggit ang dahilan
  rationale: Ang διά na may akusatibo ay nagpapahayag ng sanhi, at ang φθόνος ay inggit o masamang saloobin dahil sa kalagayan ng iba. Malinaw na naihahatid ng pariralang ito ang sanhi nang hindi dinaragdagan ang diwa.
- source_word: παρέδωκαν
  choice: ibinigay sa kanya
  rationale: Sa konteksto ng paglilitis, ang παραδίδωμι ay tumutukoy sa pagdadala at pagbibigay kay Jesus sa kapangyarihan ni Pilato. Ang “ibinigay sa kanya” ay likas sa Tagalog at hindi nagpapakitid sa kahulugan tungo lamang sa pagtataksil.
- source_word: αὐτόν
  choice: si Jesus
  rationale: Ang panghalip ay tumutukoy kay Jesus. Ginamit ang tahasang pangalan upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
theological_decisions:
- issue: Dahilan ng mga nagdala kay Jesus kay Pilato
  choice: Kinilala ni Pilato na inggit ang dahilan ng kanilang ginawa.
  alternative: Kinilala ni Pilato na paninibugho ang dahilan ng kanilang ginawa.
  rationale: Pinananatili ng “inggit” ang moral at sikolohikal na bigat ng φθόνος nang hindi nagpapasok ng paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang bahagyang muling pagsasaayos na “inggit ang dahilan kung bakit” upang maging natural ang sanhi sa Tagalog habang pinananatili ang paliwanag ng Griyego.
