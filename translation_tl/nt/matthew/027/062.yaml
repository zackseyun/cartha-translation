  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: tl
  text: Kinabukasan, na siyang araw pagkatapos ng Araw ng Paghahanda[a], nagtipon sa harap ni Pilato ang mga punong pari at ang mga Pariseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkatapos ng Paghahanda.” Ang salitang Griyego ay maaaring tumukoy sa araw ng paghahanda bago ang Sabbath; ang pagsasalin dito bilang “Biyernes” ay magiging mas tiyak kaysa sa hinihingi ng tekstong pinagmulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Kinabukasan
  rationale: Likas at maikli itong katumbas ng idyomang tumutukoy sa sumunod na araw. Hindi na isinalin nang hiwalay ang mahinang pang-ugnay na δέ upang maiwasan ang di-kinakailangang “ngayon” o “at.”
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: na siyang araw pagkatapos ng Araw ng Paghahanda
  rationale: Pinananatili nito ang paliwanag na sugnay at nililinaw ang ugnayang pangpanahon nang hindi tuwirang pinapalitan ang katawagan ng “Biyernes.”
- source_word: παρασκευήν
  choice: Araw ng Paghahanda
  rationale: Sa kontekstong Judio, karaniwang tumutukoy ito sa araw ng paghahanda bago ang Sabbath. Mas tapat ito sa katawagang Griyego kaysa sa mas interpretibong “Biyernes.”
- source_word: συνήχθησαν
  choice: nagtipon
  rationale: 'Natural na Filipino para sa anyong pasibo na ginagamit dito sa diwang intransitibo: nagsama-sama o nagtipon.'
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Karaniwang salin para sa mga nangungunang awtoridad na pari, hindi sa maraming kasalukuyang may katungkulang mataas na pari.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat na Judio.
- source_word: πρὸς Πιλᾶτον
  choice: sa harap ni Pilato
  rationale: Sa kasunod ng pandiwa ng pagtitipon, maaaring ipahiwatig ng πρός ang paglapit at pagharap sa isang tao; ang saling ito ay angkop sa opisyal na konteksto.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Karaniwang anyong Filipino ng pangalang Πιλᾶτος.
theological_decisions: []
