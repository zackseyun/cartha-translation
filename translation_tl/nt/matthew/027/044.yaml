  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: tl
  text: Gayon din, maging ang mga tulisan na ipinako sa krus na kasama niya ay patuloy na lumalait sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Gayon din
  rationale: Ginagamit dito ang τὸ αὐτό bilang pariralang pang-abay na tumutukoy sa kaparehong pag-alipusta na naunang inilarawan. Likas at malinaw sa makabagong Tagalog ang “Gayon din.”
- source_word: καὶ
  choice: maging
  rationale: 'May diin ang καί sa konteksto: pati ang mga tulisan ay nakibahagi sa pag-alipusta. Ipinahahayag ng “maging” ang ganitong pasukdol na diin.'
- source_word: λῃσταὶ
  choice: mga tulisan
  rationale: Ang λῃστής ay karaniwang tumutukoy sa magnanakaw o bandido. Ang “mga tulisan” ay maikli, dignified, at hindi nagpapasok ng tiyak na pampolitikang pakahulugan.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: na ipinako sa krus na kasama niya
  rationale: Tinutukoy ng pandiwaring balintiyak ang mga tulisan bilang mga ipinakong kasama ni Jesus. Pinananatili ng salin ang balintiyak at ang diwa ng pagkakapako nilang magkakasama.
- source_word: ὠνείδιζον
  choice: ay patuloy na lumalait
  rationale: Ang aspektong imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na kilos. Malinaw na ipinahahayag ng “patuloy na lumalait” ang duratibong diwa at ang kahulugan ng panlalait o pag-alipusta.
- source_word: αὐτόν
  choice: sa kanya
  rationale: Tahasang layon ito na tumutukoy kay Jesus; natural sa Tagalog ang pang-ukol na “sa” kasunod ng “lumalait.”
theological_decisions:
- issue: Kung pag-aayusin ang salaysay ni Mateo sa salaysay ni Lucas tungkol sa isang kriminal na nagsalita nang naiiba
  choice: Panatilihin ang pangmaramihang pagtukoy ni Mateo sa mga tulisan nang walang pagpapalambot o paglilimita.
  alternative: Gawing malabo o isahan ang tinutukoy upang maiwasan ang tila tensiyon sa salaysay ni Lucas.
  rationale: Malinaw na pangmaramihan ang οἱ λῃσταὶ at ang pandiwa sa Griyego. Dapat panatilihin ng salin ang sariling paglalahad ni Mateo at huwag tahimik na lutasin ang tensiyon sa pagitan ng mga Ebanghelyo.
translation_notes:
  register: Makabagong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tulisan” sa halip na mas kolokyal na “magnanakaw,” at “patuloy na lumalait” upang maipakita ang nagpapatuloy na kilos ng imperfect. Walang talababa sapagkat sapat na naihahayag sa pangunahing teksto ang mga leksikal na diwa.
