  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: tl
  text: at sinasabi, “Ikaw na gigiba sa templo at magtatayo[a] nito sa loob ng tatlong araw, iligtas mo ang iyong sarili! Kung ikaw ang Anak ng Diyos, bumaba ka sa krus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “muling magtatayo.” Ang pandiwang Griyego ay payak na “magtayo,” ngunit maaaring ipinahihiwatig ng konteksto ng panunuya ang muling pagtatayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: at sinasabi
  rationale: Ang pangkasalukuyang pandiwaring ito ay nagpapatuloy sa kilos sa naunang salaysay; pinananatili ng salin ang ugnayang ipinahihiwatig ng καί nang hindi inuulit ang simuno.
- source_word: Ὁ καταλύων
  choice: Ikaw na gigiba
  rationale: Ang artikulo at pandiwari ay ginagamit bilang tuwirang pagtawag. Ang anyong “gigiba” ay natural sa panunuyang tumutukoy sa ibinibintang na gagawin ni Jesus, sa halip na magmukhang kasalukuyan nang nagaganap ang paggiba.
- source_word: καταλύω
  choice: gigiba
  rationale: Sa konteksto ng templo, malinaw at karaniwang ipinapahayag ng “gibain” ang pagwasak o pagpapabagsak ng isang gusali.
- source_word: ναός
  choice: templo
  rationale: Bagaman maaaring tumukoy ang ναός nang mas tiyak sa santuwaryo, “templo” ang natural at madaling maunawaang katumbas sa panunuyang ito.
- source_word: ἐν τρισὶν ἡμέραις
  choice: sa loob ng tatlong araw
  rationale: Ito ang natural na ekspresyong Filipino para sa panahong inilalarawan ng parirala, nang hindi dinaragdagan ang detalye nito.
- source_word: οἰκοδομῶν
  choice: magtatayo nito
  rationale: Ang pandiwa ay payak na “magtayo.” Idinagdag ang “nito” bilang likas na pantukoy pabalik sa templo; ang “muling magtatayo” ay posibleng kahulugan ayon sa konteksto ngunit hindi tahasang nasa pandiwa.
- source_word: σῶσον σεαυτόν
  choice: iligtas mo ang iyong sarili
  rationale: Tuwirang inililipat ang pautos at ang reflexive na panghalip, habang pinananatili ang mapanuyang hamon.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Kung ikaw ang Anak ng Diyos
  rationale: Pinananatili ang kondisyonal na panunuya at ang malinaw at kinikilalang anyo ng titulong kristolohikal.
- source_word: κατάβηθι
  choice: bumaba ka
  rationale: Natural na pautos sa Filipino para sa pagkilos pababa mula sa kinalalagyan sa krus.
- source_word: σταυρός
  choice: krus
  rationale: Ito ang pamantayan at angkop na katumbas sa salaysay ng pagpapakasakit.
theological_decisions:
- issue: Paglilipat sa titulong υἱὸς τοῦ θεοῦ sa konteksto ng panunuya
  choice: ang Anak ng Diyos
  alternative: Anak ka ng Diyos
  rationale: Pinananatili ng napiling anyo ang titulong kristolohikal at ang puwersa ng hamon nang hindi pinahihina o pinalalawak ang sinasabi ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maigsi at matalim na himig ng panunuya, kasama ang tunay na puwang sa kahulugan sa pagitan ng “magtayo” at “muling magtayo.”
