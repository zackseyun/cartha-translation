  text: And sitting there[a], they kept watch over him.
translation:
  language: tl
  text: At habang nakaupo sila roon, patuloy nilang binabantayan siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At nang makaupo sila roon, binabantayan nila siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito na nagpapatuloy sa salaysay nang hindi nagdaragdag ng tahasang temporal o sanhi-bungang diwa.
- source_word: καθήμενοι
  choice: habang nakaupo
  rationale: Ipinahahayag ng participle ang kalagayang kasabay ng pangunahing kilos. Likas sa modernong Tagalog ang 'habang nakaupo' at hindi nito ipinipilit kung ang diin ay nasa pag-upo o sa pagiging nakaupo.
- source_word: ἐτήρουν
  choice: patuloy nila siyang binantayan
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy na kilos. Ang 'patuloy ... binantayan' ay naghahatid ng duratibong diwa at ng pagbabantay sa isang taong nasa kustodiya.
- source_word: αὐτὸν
  choice: siyang
  rationale: Tuwirang tumutukoy kay Jesus bilang layon ng pagbabantay; natural itong ikinabit sa pandiwa sa Tagalog.
- source_word: ἐκεῖ
  choice: roon
  rationale: Ang locative adverb ay tumutukoy sa lugar ng tagpo. Ang paglalagay nito kasunod ng 'nakaupo' ay natural sa Tagalog habang nananatiling malinaw na doon naganap ang buong kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang tuloy-tuloy na diwa ng imperfect at ang attendant-circumstance na participle, nang hindi nagdaragdag ng pagkakakilanlan ng mga tagapagbantay na hindi tahasang nasa talata.
