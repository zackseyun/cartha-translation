  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: tl
  text: 'Nang magkagayon, natupad ang sinabi sa pamamagitan ni propeta Jeremias[a]: “At kinuha nila ang tatlumpung pirasong pilak, ang halaga ng taong pinahalagahan, na pinahalagahan nila mula sa mga anak ni Israel,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Iniuukol ni Mateo kay Jeremias ang pahayag na ito. Pinakamalapit ang pananalita sa Zacarias 11:12–13. Iba-iba ang paliwanag dito: maaaring pinagsamang sipi ito, pagtukoy sa isang kalipunan ng mga propeta, o suliranin sa pagkakahatid ng teksto.'
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: Nang magkagayon
  rationale: Likas at marangal na panandang temporal sa Filipino na nag-uugnay sa katuparan sa naunang pangyayari.
- source_word: ἐπληρώθη
  choice: natupad
  rationale: Pinananatili ang karaniwang pormula ni Mateo tungkol sa katuparan ng pahayag ng propeta at ang pasibong diwa.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Natural na salin ng articular passive participle na tumutukoy sa naunang pahayag.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: sa pamamagitan ni propeta Jeremias
  rationale: Ipinapakita ng διά na ang propeta ang tagapamagitan ng pahayag, hindi kinakailangang ang pangunahing pinagmulan nito.
- source_word: λέγοντος
  choice: ':'
  rationale: Sa modernong Filipino, malinaw at natural na ipinakikilala ng tutuldok ang tuwirang sipi; hindi kailangang idagdag ang mabigat na “na nagsasabi.”
- source_word: ἔλαβον
  choice: kinuha nila
  rationale: Tuwirang pinananatili ang aktibong kilos at ang di-tiyak na maramihang simuno ng Griyego.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ang tatlumpung pirasong pilak
  rationale: Malinaw na tumutukoy sa salaping pilak nang hindi nagtatakda ng espesipikong uri ng barya na hindi binanggit sa teksto.
- source_word: τὴν τιμὴν
  choice: ang halagang itinakda
  rationale: Ang τιμή sa konteksto ay halagang itinakda o presyo; ang parirala ay mas natural sa Filipino kaysa simpleng “presyo” kasunod ng participle.
- source_word: τοῦ τετιμημένου
  choice: para sa isang pinahalagahan
  rationale: Pinananatili ang perpektong pasibong diwa at ang sinadyang pag-uulit ng ugat τιμάω, habang kinikilala ang komersiyal at mapait na pahiwatig ng pagpapahalaga.
- source_word: ὃν ἐτιμήσαντο
  choice: na pinahalagahan
  rationale: Inuulit ang “pinahalagahan” upang masalamin ang lexical repetition sa Griyego, kahit nananatiling mahirap ang sintaks.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: ng ilan sa mga anak ni Israel
  rationale: Ipinapahayag ang malamang na partitive na diwa ng ἀπό at pinananatili ang literal na ugnayang pampamilya ng υἱῶν bilang “mga anak.”
theological_decisions:
- issue: Ang pag-uukol kay Jeremias bagaman pinakamalapit ang pananalita sa Zacarias 11:12–13
  choice: Pinanatili sa pangunahing teksto ang tahasang pangalang “propeta Jeremias.”
  alternative: Palitan ng “Zacarias,” ituring na pinagsamang sipi, o gawing pangkalahatan bilang “isang propeta.”
  rationale: Jeremias ang malinaw na mababasa sa ibinigay na tekstong Griyego. Hindi dapat lutasin ng salin ang matagal nang usaping tekstuwal at intertekstuwal sa pamamagitan ng pagwawasto o pagpapalabo sa pangunahing teksto.
- issue: Ang mahirap na pariralang ἀπὸ υἱῶν Ἰσραήλ
  choice: Isinalin bilang “ng ilan sa mga anak ni Israel,” na nagpapakita ng malamang na partitive na diwa.
  alternative: “mula sa mga anak ni Israel”
  rationale: Tunay na malabo at mahirap ang parirala. Ang pangunahing salin ay kailangang maging nauunawaan, samantalang inilalahad sa talababa ang mas literal na alternatibo nang hindi ipinipilit na ganap na tiyak ang pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang prophetic fulfillment formula, ang pag-uulit ng salitang kaugnay ng pagpapahalaga, at ang hindi nalulutas na tensiyon sa pag-uukol kay Jeremias. Ginamit ang “mga anak ni Israel” bilang natural at tapat na salin ng υἱῶν Ἰσραήλ.
