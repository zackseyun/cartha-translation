revisions:
- from: 'Nang magkagayon, natupad ang sinabi sa pamamagitan ni propeta Jeremias[a]: “At kinuha nila ang tatlumpung pirasong pilak, ang halagang itinakda para sa isang pinahalagahan[b], na pinahalagahan ng ilan sa mga anak ni Israel,”'
  to: 'Nang magkagayon, natupad ang sinabi sa pamamagitan ni propeta Jeremias[a]: “At kinuha nila ang tatlumpung pirasong pilak, ang halaga ng taong pinahalagahan, na pinahalagahan nila mula sa mga anak ni Israel,”'
  rationale: Pinalitan ang di-likas at di-tiyak na “para sa isang pinahalagahan” ng “ng taong pinahalagahan,” na mas tapat sa tiyak na participle at mas natural sa Filipino. Iningatan sa pangunahing teksto ang kalabuan ng ἀπὸ υἱῶν Ἰσραήλ sa “mula sa mga anak ni Israel,” samantalang inilagay sa talababa ang posibleng partitive na pagbasa. Hindi binago ang pag-uukol ng sipi kay Jeremias o ang mahalagang pag-uulit ng “pinahalagahan.”
