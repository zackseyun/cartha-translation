id: MAT.27.53
reference: Matthew 27:53
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: tl
  text: At pagkalabas nila sa mga libingan pagkatapos ng kanyang muling pagkabuhay,[a] pumasok sila sa banal na lungsod[b] at nagpakita sa marami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas madulas ding isalin: “At pagkatapos ng kanyang muling pagkabuhay, lumabas sila sa mga libingan, pumasok sa banal na lungsod, at nagpakita sa marami.” Sa Griyego, ang “pagkatapos ng kanyang muling pagkabuhay” ay nasa pagitan ng “mula sa mga libingan” at “pumasok sila.”'
    reason: alternative_reading
  - marker: b
    text: Ang “banal na lungsod” ay tumutukoy sa Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: pagkalabas nila
  rationale: Ipinahahayag ang nauunang kilos ng aorist participle sa natural na Tagalog at pinananatili itong nakaugnay sa pangunahing pandiwang “pumasok.”
- source_word: μνημείων
  choice: mga libingan
  rationale: Karaniwang tumutukoy ang μνημεῖον sa pinaglibingan o puntod; ang “mga libingan” ay malinaw at angkop sa naunang talata tungkol sa nabuksang mga libingan.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: pagkatapos ng kanyang muling pagkabuhay
  rationale: Temporal ang μετά na may accusative. Sa konteksto, si Jesus ang tinutukoy ng αὐτοῦ; natural at pamilyar sa Tagalog ang “muling pagkabuhay.”
- source_word: εἰσῆλθον
  choice: pumasok sila
  rationale: Tuwirang salaysay ng simpleng aorist at natural na ayos sa Tagalog.
- source_word: τὴν ἁγίαν πόλιν
  choice: ang banal na lungsod
  rationale: Pinananatili ang biblikal na katawagan para sa Jerusalem nang hindi ito tahasang ipinapalit sa pangunahing teksto.
- source_word: ἐνεφανίσθησαν
  choice: nagpakita
  rationale: Sa konteksto, nangangahulugan itong sila ay naging nakikita o nagpakita sa iba; “nagpakita” ang pinakanatural na salaysay sa Tagalog.
- source_word: πολλοῖς
  choice: sa marami
  rationale: Pinananatili ang di-tiyak na pangmaramihang diwa ng Griyego; nauunawaan nang mga tao ang tinutukoy.
theological_decisions:
- issue: Ugnayan ng “pagkalabas sa mga libingan” at ng pariralang “pagkatapos ng kanyang muling pagkabuhay”
  choice: Inilagay ang panahong “pagkatapos ng kanyang muling pagkabuhay” sa loob ng pariralang tumutukoy sa pagkalabas nila, bago ang pangunahing pandiwang “pumasok.”
  alternative: 'Maaaring gawing mas madulas: “At pagkatapos ng kanyang muling pagkabuhay, lumabas sila sa mga libingan, pumasok sa banal na lungsod, at nagpakita sa marami.”'
  rationale: Kasunod mismo ng ἐκ τῶν μνημείων ang temporal na parirala sa Griyego at nauuna ang buong participial clause sa εἰσῆλθον. Pinananatili ng salin ang pagkakasunod na ito nang hindi nagpapasya nang higit sa sinasabi ng teksto kung kailan eksaktong nabuhay ang mga banal o kung paano ito iuugnay sa naunang talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pagkalabas nila” upang maiwasan ang mabigat na literalismo habang pinananatili ang participial na ugnayan. Hindi ginamit ang mas kolokyal na “sementeryo” dahil ang teksto ay tumutukoy sa mga libingan o puntod, hindi sa isang buong pook-libingan.
