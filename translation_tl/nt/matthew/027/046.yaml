  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: tl
  text: Noong bandang ikasiyam na oras, sumigaw nang malakas si Jesus, na nagsasabi, “Eli, Eli, lema sabachthani?”[a] Ibig sabihin nito, “Diyos ko, Diyos ko, bakit mo ako pinabayaan?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang ito ay umaalingawngaw sa Awit 22:1.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “bakit mo ako iniwan?” Ang pandiwang Griyego ay nasa aorist at inilalahad ang pagkilos bilang isang kabuuan; ang “pinabayaan” ay likas sa Tagalog at nagpapanatili sa taimtim na himig ng sigaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Nang bandang ikasiyam na oras
  rationale: Ang περί na may accusative sa pagtukoy ng oras ay nangangahulugang ‘bandang’ o ‘humigit-kumulang.’ Hindi na isinalin nang hiwalay ang mahinang pang-ugnay na δέ upang maging likas ang daloy sa Tagalog.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: sumigaw nang malakas
  rationale: Pinagsasama ng likas na pariralang Tagalog ang pandiwang tumutukoy sa malakas na pagdaing o pagsigaw at ang tahasang diin ng φωνῇ μεγάλῃ.
- source_word: λέγων
  choice: at sinabi
  rationale: Ipinakikilala nito ang mismong nilalaman ng sigaw. Mas likas sa modernong Tagalog ang koordinasyong ‘at sinabi’ kaysa sa literal na ‘na nagsasabi.’
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lema sabachthani?
  rationale: Pinananatili ang Semitikong sigaw sapagkat gayon din ang ginawa ni Mateo bago niya ibinigay ang kahulugan nito.
- source_word: τοῦτ’ ἔστιν
  choice: Ibig sabihin nito
  rationale: Likas at malinaw itong pormula sa Tagalog para ipakilala ang salin o paliwanag.
- source_word: Θεέ μου θεέ μου
  choice: Diyos ko, Diyos ko
  rationale: Pinananatili ang tuwirang pagtawag at pag-uulit, pati ang alingawngaw nito sa Awit 22:1.
- source_word: ἱνατί με ἐγκατέλιπες
  choice: bakit mo ako pinabayaan?
  rationale: Tuwirang isinasalin ng ‘bakit’ ang ἱνατί. Ang ‘pinabayaan’ ay marangal at likas na katumbas ng ἐγκατέλιπες sa kontekstong ito, at pinananatili ang bigat ng sigaw nang hindi ito nilalambutan.
theological_decisions:
- issue: Kaugnayan ng sigaw ni Jesus sa Awit 22:1
  choice: Isinalin ito bilang tunay at tuwirang sigaw habang pinananatili ang pananalita ng Awit.
  alternative: Ipaliwanag ito sa mismong talata bilang isa lamang pagsipi sa Awit, o palambutin ang diwa ng pagkapabaya.
  rationale: Walang idinagdag na paliwanag ang Griyego tungkol sa teolohikal na lalim ng sigaw. Kaya pinananatili ng salin ang tunay na bigat at tensiyon ng mga salita nang hindi iginigiit ang isang partikular na doktrinal na paliwanag.
- issue: Pagpapanatili sa Semitikong sigaw
  choice: Pinanatili ang ‘Eli, Eli, lema sabachthani?’ at sinundan ng kahulugang ibinigay mismo sa teksto.
  alternative: Ibigay lamang ang kahulugan sa Tagalog.
  rationale: Kapuwa ang orihinal na sigaw at ang salin nito ay sadyang inilalahad ni Mateo. Mahalaga rin ito sa kasunod na maling pagkaunawa ng mga nakarinig kay Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Semitikong pananalita at ang pag-uulit sa direktang sipi. Ginamit ang ‘ikasiyam na oras’ upang sundan ang sinaunang paraan ng pagtukoy sa oras sa teksto, nang hindi nagdaragdag sa pangunahing talata ng modernong katumbas na oras.
