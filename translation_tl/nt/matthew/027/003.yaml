id: MAT.27.3
reference: Matthew 27:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: tl
  text: Nang makita ni Judas, na nagkanulo kay Jesus, na nahatulan na si Jesus, pinagsisihan niya ito[a] at isinauli ang tatlumpung pirasong pilak[b] sa mga punong pari at mga nakatatanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakadama siya ng matinding panghihinayang.”
    reason: Ang μεταμεληθείς ay nagpapahayag ng paghinayang o remorse at hindi mismo nagpapasiya ng ganap na espirituwal na pagsisisi.
  - marker: b
    text: O “tatlumpung salaping pilak.”
    reason: Ang ἀργύρια ay mga piraso o yunit ng salaping pilak; hindi tahasang tinutukoy ng salita ang eksaktong uri ng barya.
lexical_decisions:
- source_word: Τότε
  choice: Nang
  rationale: Ang kasunod na temporal na sugnay ay natural na nagpapahayag sa Filipino ng pag-usad ng salaysay at ng ugnayan ng pagkakita ni Judas sa sumunod niyang ginawa.
- source_word: ἰδὼν
  choice: makita
  rationale: Isinalin ang aorist participle bilang temporal na sugnay na “Nang makita,” na malinaw at likas sa modernong Filipino.
- source_word: Ἰούδας
  choice: Judas
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: na nagkanulo sa kanya
  rationale: Sa kontekstong ito, ang παραδίδωμι ay higit sa simpleng pag-aabot o pagsuko; tinutukoy nito ang pagkakanulo ni Judas kay Jesus.
- source_word: ὅτι κατεκρίθη
  choice: na hinatulan na siya
  rationale: Pinananatili ang pasibong tinig at ipinakikita ng “na” na nauna na ang paghatol nang malaman ito ni Judas. Ang panghalip ay tumutukoy kay Jesus ayon sa konteksto.
- source_word: μεταμεληθεὶς
  choice: nagsisi siya sa ginawa niya
  rationale: Sa karaniwang Filipino, malinaw nitong ipinahahayag ang matinding panghihinayang o remorse, ngunit maaaring mapagkamalang ganap na espirituwal na pagsisisi; kaya nilagyan ng talababa upang mapanatili ang leksikal at teolohikal na hangganan ng μεταμέλομαι.
- source_word: ἔστρεψεν
  choice: isinauli
  rationale: Likas at tiyak na pandiwa para sa pagbabalik ng salapi sa mga dating nagbigay nito.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ang tatlumpung pirasong pilak
  rationale: Pinananatili ang tradisyonal at intertekstuwal na anyo habang iniiwasang tiyaking mga barya ang tinutukoy ng ἀργύρια.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: sa mga punong pari at matatandang pinuno
  rationale: “Mga punong pari” ang karaniwang salin ng ἀρχιερεῖς. Nilinaw ng “matatandang pinuno” na ang πρεσβύτεροι ay mga nakatatandang kabilang sa pamunuan, hindi lamang matatanda sa edad.
theological_decisions:
- issue: Kahulugan ng μεταμεληθεὶς sa tugon ni Judas
  choice: nagsisi siya sa ginawa niya, na may talababa tungkol sa panghihinayang
  alternative: nagsisi siya; nagbago ang isip niya; nakadama siya ng matinding panghihinayang
  rationale: Hindi dapat ipasiya ng salin na ang tugon ni Judas ay ganap na μετάνοια o espirituwal na pagsisisi. Ang pangunahing teksto ay natural sa Filipino, samantalang ang talababa ay nagtatakda sa diwa bilang pagsisisi o panghihinayang sa nagawa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang temporal na sugnay upang maging natural ang ayos ng pangungusap. Ang “matatandang pinuno” ay nagbibigay-linaw sa tungkulin ng mga elder, at ang mga talababa ay nagpapanatili sa leksikal na ambiguwidad nang hindi nagpapasok ng denominasyonal na paliwanag.
