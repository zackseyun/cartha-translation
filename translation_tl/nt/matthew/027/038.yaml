base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: tl
  text: Pagkatapos, ipinako sa krus kasama niya ang dalawang tulisan[a]—isa sa kanan at isa sa kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bandido”; ang salitang Griyego ay maaaring tumukoy sa mararahas na magnanakaw at, sa ilang konteksto, maaaring maiugnay sa mga nag-aalsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang sumunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa modernong Filipino.
- source_word: σταυροῦνται
  choice: ipinako rin sa krus
  rationale: Isinasalin ang pangkasalukuyang anyong balintiyak ayon sa gamit nitong masiglang pagsasalaysay. Ang “ipinako sa krus” ang karaniwan at tumpak na katumbas ng σταυρόω; idinagdag ang “rin” upang likas na maipahayag na ang dalawa ay ipinako kasama ni Jesus.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Tuwirang ipinapahayag ang pakikisama o magkasabay na kalagayang tinutukoy ng σύν na may datibo.
- source_word: δύο λῃσταί
  choice: ang dalawang tulisan
  rationale: Ang λῃστής ay karaniwang tumutukoy sa magnanakaw o bandido na maaaring gumagamit ng karahasan. Ang “tulisan” ay maikli, natural, at hindi labis na nagtatakda ng pampolitikang pagkakakilanlan.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: isa sa kanan at isa sa kaliwa
  rationale: Natural na panandang-posisyon sa Filipino at tapat sa paghahambing ng kanan at kaliwa sa Griyego.
theological_decisions:
- issue: Pagkakakilanlan ng λῃσταί
  choice: Isinalin bilang “mga tulisan” nang hindi sila tiyak na tinawag na mga rebelde.
  alternative: mga bandido; mga rebelde
  rationale: Maaaring tumukoy ang salita sa mararahas na magnanakaw o bandido at, sa ilang konteksto, maaaring may kaugnayan sa paghihimagsik. Gayunman, hindi hinihingi ng talatang ito ang mas makitid na pampolitikang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tulisan” bilang malinaw na pangunahing salin, habang pinanatili sa talababa ang lawak at posibleng pampolitikang kulay ng salitang Griyego.
