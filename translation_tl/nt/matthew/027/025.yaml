- from: At sumagot ang buong bayan[a], “Mapasaamin ang dugo niya at sa aming mga anak.”
  to: At sumagot ang buong karamihan[a], “Mapasaamin at sa aming mga anak ang kaniyang dugo.”
  rationale: Pinalitan ang “buong bayan” ng “buong karamihan” upang maiwasang ang pahayag ng mga taong nasa tagpo ay mabasa bilang pahayag ng buong bansa o lahat ng Judio. Inayos din ang ayos ng mga parirala sa pagsipi upang maging natural sa modernong Filipino habang pinananatili ang pandiwang mapasa at ang kolektibong, imprecatory na lakas ng Griyego. Ang talababa ay nananatiling paglilinaw, hindi pagpapahina o pagpapalawak ng pangunahing teksto.
