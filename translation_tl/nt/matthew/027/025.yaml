  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: tl
  text: At sumagot ang buong karamihan[a], “Mapasaamin at sa aming mga anak ang kaniyang dugo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang mga taong nagkakatipon na nagsasalita sa tagpong ito; hindi dapat unawain ang pananalitang ito bilang pag-aangkin ng walang hanggang pagkakasala ng lahat ng Judio sa bawat salinlahi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Ang participle na ἀποκριθείς kasama ng εἶπεν ay isang idyomatikong panimula sa tugon; likas itong maisasalin sa Filipino bilang “sumagot” nang hindi inuulit ang “sinabi.”
- source_word: πᾶς ὁ λαὸς
  choice: ang buong bayan
  rationale: Ipinapahayag ng πᾶς kasama ng isahang pangngalang may artikulo ang kolektibong kabuuan ng mga taong nasa tagpo. Pinananatili ng “buong bayan” ang salitang λαός, bagaman sa konteksto ay tumutukoy ito sa nagkakatipong mga tao.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: ang dugo niya
  rationale: Tuwirang pinananatili ang larawang “dugo.” Sa kontekstong panghukuman, ipinahihiwatig nito ang pananagutan sa kaniyang kamatayan, ngunit hindi iyon tahasang idinaragdag sa pangunahing teksto.
- source_word: ἐφ’ ἡμᾶς
  choice: Mapasaamin
  rationale: Walang tahasang pandiwa sa Griyego. Ang “mapasaamin” ay natural at marangal na paraan upang ipahayag ang hinihiling o ipinapataw na diwa ng parirala nang hindi ito labis na binibigyang-kahulugan.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: at sa aming mga anak
  rationale: Ang τέκνα ay karaniwang nangangahulugang “mga anak,” hindi ang mas malawak na “mga salinlahi.” Nananatili rin ang ikalawang pang-ukol upang mapanatili ang paralelismo.
theological_decisions:
- issue: Posibleng anti-Jewish na maling pagbasa sa πᾶς ὁ λαὸς
  choice: Isinalin bilang kolektibong pahayag ng “buong bayan” na naroon sa mismong tagpo.
  alternative: ang buong karamihan
  rationale: Iniuulat ng talata ang tugon ng nagkakatipong mga tao sa tagpo. Hindi dapat pahinain ang kolektibong pananalita, ngunit hindi rin ito dapat palawakin bilang walang hanggang pananagutan ng lahat ng Judio sa bawat salinlahi. Nililinaw ito ng talababa nang hindi binabago ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “mapasaamin” upang mapanatili ang maigsi at mabigat na pormula ng orihinal; ang talababa ay humahadlang sa transhistorikal at anti-Jewish na pagpapalawak ng sinabi.
