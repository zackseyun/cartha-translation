  source_fidelity: Tumpak na naihahatid ng draft ang tugon ng kolektibong grupo at ang panawagang may ipinahihiwatig na pananagutan sa dugo. Gayunman, ang “buong bayan” sa makabagong Filipino ay karaniwang nangangahulugang buong bansa o sambayanan, at kaya mas malawak kaysa sa pangkat na nasa tagpo. Ang “buong karamihan” ay mas tapat sa saklaw na pangyayari nang hindi binabago ang kolektibong diin ng πᾶς ὁ λαός.
  naturalness: Ang “Mapasaamin ang dugo niya at sa aming mga anak” ay nauunawaan ngunit hindi ganap na natural ang pagkakabit ng “at sa aming mga anak.” Mas malinaw at matatas ang “Mapasaamin at sa aming mga anak ang kaniyang dugo,” na pinananatili ang maigsi, imprecatory na anyo at ang paralelismo ng orihinal.
  terminology: Ang “dugo,” “mga anak,” at “mapasaamin” ay angkop at marangal. Ang talababa ay mahalagang paglilinaw laban sa transhistorikal na anti-Jewish na pagbasa; inayos lamang ang pananalita nito upang maging mas tuwiran at likas sa Filipino.
  issues:
