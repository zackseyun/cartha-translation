lexical_decisions:
- source_word: οἱ δὲ
  choice: At … ng mga
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay; natural itong isinalin na “At.” Ang artikulo at pandiwaring kasama nito ay tumutukoy sa isang pangkat ng mga tao.
- source_word: παραπορευόμενοι
  choice: mga nagdaraan
  rationale: Ipinahihiwatig ng kasalukuyang pandiwari ang mga taong dumaraan sa lugar; likas at malinaw sa modernong Tagalog ang “mga nagdaraan.”
- source_word: ἐβλασφήμουν
  choice: nilalapastangan
  rationale: Ipinapakita ng aspektong imperpekto ang nagpapatuloy na mapang-abusong pananalita. Mas malakas ang “nilalapastangan” kaysa “nilalait” at hindi nito nililimitahan ang kahulugan sa pagsasalita laban sa Diyos lamang.
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang layon na tumutukoy kay Jesus.
- source_word: κινοῦντες
  choice: habang iniiling
  rationale: Ang pandiwari ay nagsasaad ng kilos na kasabay ng panlalapastangan. Ang “iniiling” ang natural na paglalarawan sa kilos ng paghamak sa Tagalog.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: ang kanilang mga ulo
  rationale: Pinananatili ang maramihang anyo at ang tahasang pagtukoy sa mga ulo.
theological_decisions:
- issue: Lakas at saklaw ng βλασφημέω kapag si Jesus ang pinatutungkulan
  choice: nilalapastangan
  alternative: nilalait
  rationale: Pinananatili ng “nilalapastangan” ang matinding himig ng pandiwang Griyego at ang posibleng teolohikal na bigat nito nang hindi ipinapalagay na ang salita ay tumutukoy lamang sa teknikal na pamumusong laban sa Diyos. Inilalagay sa talababa ang mas pangkalahatang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nilalapastangan” upang mapanatili ang lakas ng orihinal, habang ang “mga nagdaraan” at “iniiling ang kanilang mga ulo” ay natural sa karaniwang salaysay.
