  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: tl
  text: Agad na tumakbo ang isa sa kanila, kumuha ng espongha, pinuno ito ng maasim na alak[a], ikinabit ito sa isang tambo, at patuloy niya siyang pinainom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “suka.” Maaaring tumukoy ang Griyegong ὄξος sa maasim na alak o sa sukang alak.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Agad na
  rationale: Likas at malinaw na ipinahahayag sa modernong Filipino ang biglaang pagsunod ng kilos.
- source_word: δραμὼν
  choice: tumakbo
  rationale: Ginawang pandiwang may tahasang anyo ang aorist participle upang maging natural ang sunod-sunod na salaysay sa Filipino habang napapanatili ang madaliang kilos.
- source_word: εἷς ἐξ αὐτῶν
  choice: ang isa sa kanila
  rationale: Karaniwang katumbas sa Filipino ng partitive expression at malinaw na isang tao mula sa pangkat ang kumilos.
- source_word: λαβὼν σπόγγον
  choice: kumuha ng espongha
  rationale: Natural na pagsasalin ng kasunod na kilos; ang “espongha” ang tuwirang modernong katawagan.
- source_word: πλήσας τε ὄξους
  choice: pinuno iyon ng maasim na alak
  rationale: Pinananatili ng “pinuno” ang kahulugan ng πλήσας, at mas tumpak na inilalarawan ng “maasim na alak” ang ὄξος bilang maasim o sukaing alak kaysa sa karaniwang modernong pagkaunawa sa “suka.”
- source_word: περιθεὶς καλάμῳ
  choice: ikinabit sa isang tambo
  rationale: Natural na ipinahahayag sa Filipino ang paglalagay ng espongha sa tambo nang hindi tinutukoy ang eksaktong paraan ng pagkakabit na hindi sinasabi ng teksto.
- source_word: ἐπότιζεν αὐτόν
  choice: pinainom siya
  rationale: Tuwirang ipinahahayag ang causative na diwa ng ποτίζω. Ang payak na anyo ay mas natural sa salaysay; hindi ipinipilit na ang imperfect ay nangangahulugang paulit-ulit o bigong pagtatangka.
theological_decisions:
- issue: Uri ng inuming ibinigay kay Jesus
  choice: maasim na alak
  alternative: suka
  rationale: Maaaring tumukoy ang ὄξος sa maasim o sukaing alak. Ang “maasim na alak” ay malapit sa sinaunang inuming tinutukoy at umiiwas sa maling impresyon na karaniwang pampalasa lamang ang ibinigay.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang magkakapantay na pandiwang “tumakbo, kumuha, pinuno, ikinabit, at pinainom” upang natural na katawanin ang sunod-sunod na participle at pangunahing pandiwa sa Griyego.
