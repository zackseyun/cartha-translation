    issue: “Matatandang pinuno” para sa πρεσβυτέρων
    rationale: Bagaman nauunawaan ang nilalayong institusyonal na diwa, ang parirala ay maaaring magpabigat sa edad (“matatanda”) at magdagdag ng paglalarawang wala sa payak na terminong “elders.” Ang “mga nakatatanda” ay mas karaniwan at mas tapat sa terminong pangkasaysayan.
  - severity: low
    issue: Ayos ng alternatibong footnote
    rationale: Mas karaniwang isulat ang alternatibo bilang “Sa gayon ding paraan,” na may hiwalay na “ding.”
