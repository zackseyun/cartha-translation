  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: tl
  text: 'Gayon din[a], habang nililibak siya ng mga punong pari, kasama ng mga eskriba at mga nakatatanda, sinasabi nila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Sa gayon ding paraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Gayon din
  rationale: Likas at maikli itong panandang naghahambing sa panunuya sa naunang tagpo, habang pinananatili ang diwang “sa gayunding paraan.”
- source_word: καὶ
  choice: din
  rationale: Ipinakikitang nadagdag ang mga punong pari sa mga nauna nang nanunuya.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa mga pangunahing awtoridad ng mga pari; hindi nito ipinahihiwatig na marami ang humahawak sa natatanging tungkulin ng pinakapunong pari.
- source_word: ἐμπαίζοντες
  choice: habang nililibak siya
  rationale: Ipinahahayag ang kasabay at nagpapatuloy na mapanuyang pagkilos. Ang “siya” ay malinaw na tumutukoy kay Jesus ayon sa konteksto.
- source_word: μετὰ
  choice: kasama ng
  rationale: Ipinakikita ang pakikisama ng mga eskriba at matatandang pinuno sa kilos, hindi lamang ang kanilang pisikal na presensiya.
- source_word: γραμματέων
  choice: mga eskriba
  rationale: Direkta at kinikilalang katawagan sa uring ito sa salaysay ng mga Ebanghelyo; hindi gaanong interpretibo kaysa “mga tagapagturo ng Kautusan.”
- source_word: πρεσβυτέρων
  choice: matatandang pinuno
  rationale: Nililinaw ang institusyonal na papel ng mga tinutukoy at iniiwasang ipakahulugang matatandang lalaki lamang.
- source_word: ἔλεγον
  choice: ganito ang sinasabi nila
  rationale: Pinananatili ang diwang nagpapatuloy o inuulit na pagsasalita na taglay ng imperpektong pandiwa, at natural na nagpapakilala sa susunod na sipi.
theological_decisions:
- issue: Pagkakakilanlan ng mga kasali sa panlilibak
  choice: Ang mga punong pari, kasama ang mga eskriba at matatandang pinuno, ay inilalarawang magkakasamang nanlilibak kay Jesus.
  alternative: Maaaring unawain na ang mga punong pari lamang ang nanlilibak habang naroon ang mga eskriba at matatandang pinuno.
  rationale: Ang μετὰ na may genitive ay pinakanatural na nagpapahiwatig ng pakikisama sa kilos, hindi lamang ng pagkanaroon.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga eskriba” bilang tiyak na katawagang pangkasaysayan, samantalang ginamit ang “matatandang pinuno” upang luminaw ang institusyonal na diwa ng πρεσβύτεροι. Ang hulihang tutuldok ay angkop dahil ipinakikilala ng talata ang tuwirang pananalita sa kasunod na talata.
