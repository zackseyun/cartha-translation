  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: tl
  text: Maraming babae ang naroon, na nagmamasid mula sa malayo.[a] Sumunod sila kay Jesus mula sa Galilea at naglilingkod sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakatingin mula sa malayo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nag-asikaso sa kanya.” Ang pandiwang Griyego ay maaaring tumukoy sa praktikal na paglilingkod o pagsuporta.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Naroon din
  rationale: Ipinahahayag ng Ἦσαν ... ἐκεῖ na naroon sila sa tagpo, at ang banayad na pang-ugnay na δέ ay likas na naipahahayag dito sa “din” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: γυναῖκες πολλαὶ
  choice: ang maraming babae
  rationale: Tuwirang pinananatili ang dami at kasarian sa natural na modernong Tagalog.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: na nagmamasid mula sa malayo
  rationale: Ipinahahayag ng kasalukuyang pandiwaring θεωροῦσαι ang patuloy at masusing pagtanaw; ang “nagmamasid” ay mas angkop kaysa sa payak na “nakatingin.”
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: Sila ang sumunod kay Jesus
  rationale: Ang “Sila ang” ay natural na nagpapakilala sa mga babae bilang mismong mga taong sumunod kay Jesus, na pinananatili ang bahagyang mapaglarawang diin ng αἵτινες.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: mula pa sa Galilea
  rationale: Ang “mula pa” ay malinaw na tumutukoy sa Galilea bilang pinagmulan ng naunang pagsunod nila hanggang sa kasalukuyang tagpo.
- source_word: διακονοῦσαι αὐτῷ
  choice: naglingkod sa kanya
  rationale: Malawak ang kahulugan ng διακονέω at maaaring tumukoy sa praktikal na paglilingkod o pagtustos; hindi ito nililimitahan ng salin sa isang pormal na katungkulan sa iglesya.
theological_decisions:
- issue: Ang papel ng mga babae na ipinahahayag ng διακονοῦσαι
  choice: naglingkod sa kanya
  alternative: nag-asikaso sa kanya / nagministeryo sa kanya
  rationale: Pinananatili ng “naglingkod” ang lawak ng pandiwa—kabilang ang praktikal na pag-aasikaso at pagsuporta—nang hindi ipinapalagay na tumutukoy ito sa isang pormal na ministeryal na tungkulin.
- issue: Ang kaugnayang temporal ng pagsunod ng mga babae sa tagpo ng pagpapako
  choice: sumunod kay Jesus mula pa sa Galilea
  alternative: sumusunod kay Jesus mula sa Galilea
  rationale: Ipinakikita ng aspektong naganap ng ἠκολούθησαν na nagsimula ang pagsunod bago ang kasalukuyang tagpo; likas na naipahahayag sa Tagalog ng “sumunod” at ng “mula pa” ang naunang simula nang hindi labis na pinipino ang panahon.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Hinati sa dalawang pangungusap upang maging malinaw at natural ang mahabang sugnay na Griyego. Ginamit ang “Galilea” bilang karaniwang anyong Filipino ng pangalang heograpiko at iniwasan ang salitang “ministeryo,” na maaaring magpasok ng pormal na kahulugang eklesiastiko.
