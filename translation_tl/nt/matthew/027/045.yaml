id: MAT.27.45
reference: Matthew 27:45
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: tl
  text: Mula sa ikaanim na oras, nagdilim sa buong lupain hanggang sa ikasiyam na oras.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang ikaanim na oras ay bandang tanghali, at ang ikasiyam na oras ay bandang alas-tres ng hapon.
    reason: cultural_note
  - marker: b
    text: O “sa buong daigdig.” Ang salitang Griyego ay maaaring mangahulugang “lupain” o “daigdig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Mula sa
  rationale: Ang ἀπό ay tumutukoy sa simula ng panahon. Banayad lamang ang δέ bilang pang-ugnay, kaya hindi na ito tahasang isinalin upang maging likas ang daloy sa Filipino at hindi magpahiwatig ng matinding pagsalungat.
- source_word: ἕκτης ὥρας
  choice: ikaanim na oras
  rationale: Pinananatili ang sinaunang paraan ng pagbibilang ng oras sa pangunahing teksto; ipinaliliwanag sa talababa na ito ay bandang tanghali.
- source_word: σκότος ἐγένετο
  choice: nagdilim
  rationale: Ipinapahayag ng ἐγένετο ang pagsisimula ng kalagayang tinutukoy ng σκότος. Ang “nagdilim” ay maikli, natural, at malinaw sa modernong Filipino.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: sa buong lupain
  rationale: Maaaring mangahulugan ang γῆ ng “lupain” o “daigdig.” Ang “buong lupain” ay ang mas maingat na pagbasa ayon sa agarang tagpuan, habang pinananatili sa talababa ang tunay na alternatibong “buong daigdig.”
- source_word: ἕως ὥρας ἐνάτης
  choice: hanggang sa ikasiyam na oras
  rationale: Pinananatili ang pahayag ng oras sa Griyego; ang katumbas nitong bandang alas-tres ng hapon ay nasa talababa.
theological_decisions:
- issue: Saklaw ng γῆ sa pahayag tungkol sa pagdidilim
  choice: buong lupain
  alternative: buong daigdig
  rationale: Malawak ang semantikong saklaw ng γῆ. Hindi ipinipilit ng “lupain” ang pandaigdigang saklaw, ngunit hindi rin itinatago ang posibleng kosmikong pagbasa, na malinaw na ibinibigay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sinaunang pagtukoy sa oras sa pangunahing teksto at iniwasan ang mas lumang anyong “kadiliman ang sumapit” upang maging natural sa karaniwang mambabasa.
