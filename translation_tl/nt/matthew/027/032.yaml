id: MAT.27.32
reference: Matthew 27:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: tl
  text: Paglabas nila, nakita nila ang isang lalaking taga-Cirene na nagngangalang Simon. Pinilit nila siyang pasanin ang krus niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang krus ni Jesus.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Paglabas nila
  rationale: Ang pangkasalukuyang participle ay may temporal na gamit. Natural sa modernong Tagalog ang “Paglabas nila,” at ang mahinang pang-ugnay na δέ ay hindi kailangang isalin nang hiwalay.
- source_word: εὗρον
  choice: nakita nila
  rationale: Sa kontekstong ito, ang εὑρίσκω ay tumutukoy sa pagkakita o pagkakatagpo sa isang tao; “nakita nila” ang pinakanatural at malinaw sa Tagalog.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: isang lalaking taga-Cirene
  rationale: Ipinapahayag ng Κυρηναῖον ang pinagmulan ng lalaki. Ang “taga-Cirene” ay karaniwang paraan sa Tagalog upang tukuyin ang lugar na pinagmulan.
- source_word: ὀνόματι Σίμωνα
  choice: na nagngangalang Simon
  rationale: Likas at marangal na katumbas ito ng idyomang Griyego na nangangahulugang “named Simon.”
- source_word: τοῦτον
  choice: siya
  rationale: Bagaman demonstrative ang Griyego, sapat at mas natural sa Tagalog ang panghalip na “siya” dahil malinaw na si Simon ang tinutukoy.
- source_word: ἠγγάρευσαν
  choice: pinilit nila
  rationale: Ang pandiwa ay tumutukoy sa sapilitang paglilingkod na ipinapataw ng may awtoridad. Napananatili ng “pinilit” ang diwa ng pamimilit nang hindi nagpapasok ng paliwanag sa pangunahing teksto.
- source_word: ἵνα ἄρῃ
  choice: pasanin
  rationale: Ang ἵνα at subjunctive ay nagpapahayag ng layunin, at saklaw ng αἴρω dito ang pagbuhat o pagdadala. Ang “pasanin” ay natural at tiyak sa konteksto ng krus.
- source_word: τὸν σταυρὸν
  choice: ang krus
  rationale: Ang “krus” ang karaniwan at tumpak na salin ng σταυρός; hindi hinihingi ng salitang Griyego rito ang mas makitid na “pahalang na biga.”
- source_word: αὐτοῦ
  choice: niya
  rationale: Pinananatili ang panghalip ng Griyego sa halip na palitan ito ng pangalang Jesus. Nililinaw sa talababa ang tinutukoy upang maiwasan ang pansamantalang kalabuan sa Tagalog.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ (“niya”)
  choice: Ang panghalip ay tumutukoy kay Jesus, ngunit pinanatili bilang “niya” sa pangunahing teksto.
  alternative: 'Gawing tahasan: “ang krus ni Jesus.”'
  rationale: Malinaw sa mas malawak na salaysay na krus ni Jesus ang ipinapapasan kay Simon. Gayunman, pinananatili ng salin ang anyong panghalip ng pinagmulang teksto at inilalagay ang paglilinaw sa talababa, sa halip na tahasang palitan ang panghalip sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na simple, natural, at marangal. Ginamit ang “pasanin” para sa kongkretong pagdadala ng krus at “pinilit” upang malinaw na maipahayag ang sapilitang paglilingkod. Inilagay ang tanging marker na [a] kaagad pagkatapos ng pariralang nililinaw nito.
