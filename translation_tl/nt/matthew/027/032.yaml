  source_fidelity: 'Tumpak ang pagsasalin ng daloy at mahahalagang bahagi ng Griyego: ang paglabas, pagkakatagpo sa lalaking taga-Cirene na si Simon, ang sapilitang pagpapasan, at ang krus. Ang “Pinilit nila siyang pasanin” ay sapat na naihahayag ang sapilitang serbisyong nasa ἠγγάρευσαν. Nananatili rin ang panghalip na katumbas ng αὐτοῦ.'
