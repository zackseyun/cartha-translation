base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: tl
  text: Sinabi ni Pilato sa kanila, “Mayroon kayong pangkat ng mga bantay.[a] Humayo kayo at tiyakin ninyong ligtas ito sa paraang alam ninyo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kumuha kayo ng pangkat ng mga bantay,” o posibleng “May sarili kayong pangkat ng mga bantay.” Maaaring mangahulugan ang Griyego na binibigyan sila ni Pilato ng mga bantay o na tinutukoy niya ang mga bantay na maaari na nilang gamitin.
    reason: alternative_reading
  - marker: b
    text: O “gawin ninyo itong ligtas sa abot ng inyong makakaya.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Karaniwang pandiwang ginagamit sa pagsasalaysay upang ipakilala ang tuwirang sinabi ng isang tao.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Ipinahahayag ng panghalip na datibo kung kanino nagsalita si Pilato.
- source_word: Ἔχετε
  choice: Mayroon kayong
  rationale: Pinananatili ang tuwirang kahulugan ng pangkasalukuyang anyo ng ἔχω at ang kalabuan kung ito ay pahintulot na kumuha ng mga bantay o pagtukoy sa mga bantay na maaari na nilang gamitin.
- source_word: κουστωδίαν
  choice: mga bantay
  rationale: Ang salitang hiram sa Latin na custodia ay tumutukoy sa isang pangkat na nagbabantay. Mas natural sa modernong Filipino ang maramihang “mga bantay” kaysa sa literal ngunit maaaring malabong “isang bantay.”
- source_word: ὑπάγετε
  choice: Pumunta kayo
  rationale: Tuwirang ipinapahayag ang pautos na umalis o magtungo upang isagawa ang iniutos.
- source_word: ἀσφαλίσασθε
  choice: tiyakin ninyong ligtas iyon
  rationale: Ipinahahayag ang pautos na gawing ligtas o matatag ang binabantayang lugar, nang hindi dinaragdagan ang paraan ng pagsasagawa nito.
- source_word: ὡς οἴδατε
  choice: ayon sa alam ninyong paraan
  rationale: Natural na Filipino para sa paggawa ayon sa kanilang nalalaman, habang iniiwasang tahasang gawing “sa abot ng makakaya” ang parirala.
theological_decisions:
- issue: Kung ang Ἔχετε κουστωδίαν ay pagbibigay ni Pilato ng mga Romanong bantay o pagtukoy sa mga bantay na mayroon o magagamit na ng mga pinuno
  choice: “Mayroon kayong mga bantay” sa pangunahing teksto
  alternative: “Kumuha kayo ng mga bantay” o “May sarili kayong mga bantay”
  rationale: Maaaring unawain ang Griyego bilang pahintulot o utos na kumuha ng mga bantay, o bilang pahayag na mayroon na silang magagamit na mga bantay. Pinananatili ng pangunahing salin ang kalabuan sa halip na pagpasyahan ang pinagtatalunang historikal na detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bantay” bilang natural na pagtukoy sa isang pangkat ng mga nagbabantay. Ang “iyon” ay tumutukoy sa libingan na binanggit sa konteksto, nang hindi inuulit ang pangngalan na wala sa mismong talata.
