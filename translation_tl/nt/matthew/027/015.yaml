  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: tl
  text: Tuwing kapistahan[a], nakaugalian ng gobernador na magpalaya para sa karamihan ng isang bilanggo na gusto nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: pista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Tuwing kapistahan
  rationale: Ang κατά na may accusative ay temporal dito. Ipinahihiwatig ng εἰώθει na paulit-ulit na kaugalian ito, kaya likas sa Filipino ang “tuwing kapistahan.” Hindi na isinama nang hiwalay ang mahinang pang-ugnay na δέ upang hindi maging mabigat ang daloy.
- source_word: ἑορτὴν
  choice: kapistahan
  rationale: Ang ἑορτή ay kapistahan o pista. Marangal at malinaw ang “kapistahan,” at tumutugma ito sa konteksto ng Paskuwa.
- source_word: εἰώθει
  choice: nakaugalian
  rationale: Ipinapahayag ng imperfect na anyo ang nakasanayang gawain noon; malinaw itong naihahatid ng “nakaugalian.”
- source_word: ὁ ἡγεμὼν
  choice: ang gobernador
  rationale: Sa konteksto, tumutukoy ito sa Romanong gobernador ng lalawigan; “gobernador” ang malinaw at karaniwang katawagan.
- source_word: ἀπολύειν
  choice: na palayain
  rationale: Tumutukoy ito sa pagpapalaya mula sa pagkakapiit o kustodiya.
- source_word: ἕνα ... δέσμιον
  choice: ang isang bilanggo
  rationale: Pinananatili nito ang tiyak na bilang na isa at ang kahulugan ng taong nakagapos o nakakulong.
- source_word: τῷ ὄχλῳ
  choice: para sa mga tao
  rationale: Ang dative ay nagpapakitang ang pagpapalaya ay ginagawa para sa kapakanan o kahilingan ng nagkakatipong mga tao. Mas natural sa modernong Filipino ang “para sa mga tao” kaysa literal na “sa karamihan” sa pangungusap na ito.
- source_word: ὃν ἤθελον
  choice: na gusto nilang palayain
  rationale: Literal itong tumutukoy sa bilanggo na gusto nila. Idinagdag ang nauunawaang pandiwang “palayain” upang maging malinaw at likas sa Filipino kung ano ang gusto nilang mangyari, nang hindi binabago ang tinutukoy.
