revisions:
- from: Tuwing kapistahan[a], nakaugalian ng gobernador na palayain para sa mga tao ang isang bilanggo na gusto nilang palayain.
  to: Tuwing kapistahan[a], nakaugalian ng gobernador na magpalaya para sa karamihan ng isang bilanggo na gusto nila.
  rationale: Inalis ang idinagdag na “palayain” sa relative clause upang mapanatili ang saklaw ng Griyegong ὃν ἤθελον. Pinalitan ang “mga tao” ng “karamihan” upang maihatid ang ὄχλος nang mas tiyak, habang pinananatili ang natural na ayos at habitual na diwa ng εἰώθει.
