  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: tl
  text: Pagkatapos, dinala ng mga kawal ng gobernador si Jesus sa loob ng pretorio[a] at tinipon nila sa paligid niya ang buong kohorte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “himpilan ng gobernador.” Ang salitang Griyego ay tumutukoy sa opisyal na tirahan o himpilang militar ng Romanong gobernador.
    reason: lexical_alternative
  - marker: b
    text: Ang “kohorte” ay katawagang Romano para sa isang yunit ng mga kawal; hindi nito kinakailangang sabihin na naroon ang bawat kawal ng isang kumpletong kohorte.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa Filipino na nagpapakita ng kasunod na pangyayari sa salaysay.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: mga kawal ng gobernador
  rationale: Malinaw at natural na ipinapahayag ang kaugnayan ng mga kawal sa Romanong gobernador.
- source_word: παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον
  choice: dinala ... si Jesus sa pretorio
  rationale: Isinasama ang participle sa pangunahing sugnay para sa natural na Filipino habang pinananatili ang kilos ng pagkuha at pagdadala kay Jesus papasok sa lugar.
- source_word: πραιτώριον
  choice: pretorio
  rationale: Pinananatili ang tiyak na katawagang pangkasaysayan sa anyong angkop sa Filipino; nililinaw sa talababa ang kahulugan nito.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: tinipon sa paligid niya
  rationale: Ipinahahayag ang pagtitipon ng mga kawal patungo at nakapalibot kay Jesus, na siyang pinakamalamang na diwa sa konteksto.
- source_word: ὅλην τὴν σπεῖραν
  choice: ang buong kohorte
  rationale: Pinananatili ang Romanong terminong militar at ang diin ng ὅλην na 'buo,' habang nililinaw sa talababa ang saklaw nito.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kawal” at “kohorte” upang mapanatili ang kontekstong militar, at nilagyan ng mga talababa ang mga terminong pangkasaysayang maaaring hindi pamilyar sa karaniwang mambabasa.
