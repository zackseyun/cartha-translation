id: MAT.27.42
reference: Matthew 27:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: tl
  text: “Iniligtas niya ang iba, ngunit hindi niya mailigtas ang kanyang sarili. Siya ang Hari ng Israel; bumaba siya ngayon mula sa krus,[a] at maniniwala kami sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung siya ang Hari ng Israel, bumaba siya ngayon mula sa krus, at maniniwala kami sa kanya.” Ginagawang tahasan ng ilang salin ang kondisyunal na diwa ng panunuya, ngunit tuwirang isinasaad ng Griyego rito ang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Iniligtas niya ang iba
  rationale: Likas at maikli sa modernong Tagalog; pinananatili ang mapanuyang paghahambing sa pagliligtas niya sa sarili.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: hindi niya mailigtas ang kanyang sarili
  rationale: Tuwirang ipinapahayag ang kawalan ng kakayahang ipinupukol sa kanya bilang panunuya, habang pinananatili ang reflexive na diin.
- source_word: βασιλεὺς Ἰσραήλ ἐστιν
  choice: Siya ang Hari ng Israel
  rationale: Pinananatili ang tuwirang pahayag ng Griyego at hindi dinaragdagan ng kondisyunal na “kung”; ang malaking titik ay angkop sa titulong tumutukoy kay Jesus.
- source_word: καταβάτω νῦν
  choice: bumaba siya ngayon
  rationale: Ang ikatlong-panauhang pautos ay natural na naihahayag sa Tagalog sa anyong ito at pinananatili ng “ngayon” ang agarang hamon.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: mula sa krus
  rationale: Tuwiran at karaniwang katumbas ng pariralang Griyego sa konteksto ng pagpapako.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: maniniwala kami sa kanya
  rationale: Ang πιστεύω na may ἐπί at accusative ay tumutukoy sa pananampalatayang nakatuon sa isang tao; likas sa Tagalog ang “maniniwala ... sa kanya.”
theological_decisions:
- issue: Paglalahad sa mapanuyang pag-angkin na hari si Jesus
  choice: Siya ang Hari ng Israel
  alternative: Kung siya ang Hari ng Israel
  rationale: Ang Griyego ay tuwirang nominal na pahayag at walang tahasang kondisyunal. Pinananatili ng salin ang anyo at tensiyon ng panunuya nang hindi nagdaragdag ng “kung.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mailigtas” upang mapanatili ang pag-uulit ng iisang pandiwang Griyego, at iniwasang gawing tahasang kondisyunal sa pangunahing teksto ang mapanuyang titulo.
