  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: tl
  text: Ngunit sinabi niya[a], “Ano bang masama ang ginawa niya?” Ngunit lalo pa silang nagsisigaw, “Ipako siya sa krus!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang tanong nang mas idiomatiko: “Bakit, ano bang masama ang ginawa niya?”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, ang pandiwa ay passive na pautos, na mas literal na maaaring ipahayag: “Hayaan siyang maipako sa krus.” Ang “Ipako siya sa krus” ay natural na pautos sa Filipino at hindi rin tahasang nagsasaad kung sino ang gagawa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Ngunit sinabi niya
  rationale: Ang δέ ay nagpapakita ng pagsalungat sa tugon ng karamihan, at ang aorist na ἔφη ay likas na isinasalin bilang payak na panimulang pananalita.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Ano bang masama ang ginawa niya?
  rationale: Ang “Ano bang” ay natural na Filipino para sa mapanghamong tanong na may γάρ, habang pinananatili ng “masama” ang moral na bigat ng κακόν nang hindi ito nililimitahan sa isang tiyak na krimen o kasalanan.
- source_word: περισσῶς
  choice: lalo pa
  rationale: Ipinapahayag nito ang tumitinding tugon ng karamihan nang hindi ipinapalagay na lakas ng tinig lamang ang tinutukoy.
- source_word: ἔκραζον
  choice: sumigaw
  rationale: Natural itong salin ng malakas na pagdaing o pagsigaw ng karamihan. Kasama ng “lalo pa,” naipapakita ang nagpapatuloy at tumitinding kilos ng imperfect.
- source_word: λέγοντες
  choice: sumigaw, “…”
  rationale: Sa Filipino, ang nilalaman ng sigaw ay natural na tuwirang kasunod ng pandiwang “sumigaw”; hindi kailangang idagdag ang mabigat na “na sinasabi.”
- source_word: Σταυρωθήτω
  choice: Ipako siya sa krus!
  rationale: Ang patient-focus na pautos na “Ipako siya” ay pinananatiling hindi tahasang binabanggit ang gagawa, gaya ng passive imperative sa Griyego, at malinaw na ipinapahayag ang kahilingan para sa pagpapako sa krus.
theological_decisions:
- issue: Anyo ng kahilingan ng karamihan tungkol sa pagpapako sa krus
  choice: Ipako siya sa krus!
  alternative: Dapat siyang ipako sa krus!
  rationale: Ang “Ipako siya sa krus” ay isang natural at mariing pautos sa Filipino na nakatuon sa tatanggap ng kilos at hindi nagdaragdag ng tahasang gumagawa. Ang alternatibong “Dapat siyang…” ay higit na parang pahayag ng nararapat kaysa tuwirang kahilingan.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “masama” sa halip na mas teknikal o mas makitid na “kasalanan,” at iniwasan ang mabigat na literalismo sa participle na λέγοντες.
