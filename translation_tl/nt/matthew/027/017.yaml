id: MAT.27.17
reference: Matthew 27:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: tl
  text: 'Kaya nang nagkatipon na sila, sinabi sa kanila ni Pilato, “Sino sa dalawa ang gusto ninyong palayain ko para sa inyo: si Jesus Barabbas[a], o si Jesus na tinatawag na Mesiyas[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Barabbas” lamang ang mababasa sa halip na “Jesus Barabbas.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “Cristo.” Ang titulong Griego ay Christos; isinalin dito bilang “Mesiyas” dahil ginagamit ito bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: nang nagkatipon na sila
  rationale: Ang genitive absolute ay temporal at nagpapahiwatig na naganap na ang pagtitipon bago nagtanong si Pilato. Likas sa modernong Tagalog ang “nang nagkatipon na sila.”
- source_word: οὖν
  choice: Kaya
  rationale: Pinananatili nito ang ugnayang pasalaysay at lohikal sa naunang pangyayari nang hindi nagiging labis na pormal.
- source_word: Τίνα
  choice: Sino sa dalawa
  rationale: Tumutukoy ito sa pagpili sa pagitan ng dalawang taong kasunod na pinangalanan. Nililinaw ng “sa dalawa” ang kontrastong nasa tanong.
- source_word: θέλετε
  choice: ang gusto ninyo
  rationale: Ang θέλω ay nagsasaad dito ng kagustuhan o pinipiling pasiya; karaniwan at malinaw ang “gusto” sa modernong Tagalog.
- source_word: ἀπολύσω ὑμῖν
  choice: palayain ko para sa inyo
  rationale: Sa kontekstong hudisyal, ang ἀπολύω ay pagpapalaya sa isang bilanggo, hindi kinakailangang pagpapatawad sa sala. Isinasalin din ang ὑμῖν bilang “para sa inyo.”
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: si Jesus Barabbas
  rationale: Kasama ang Ἰησοῦν sa ibinigay na tekstong SBLGNT, kaya pinananatili ang buong pangalan at ang retorikal na paghahambing ng dalawang lalaking nagngangalang Jesus.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: si Jesus na tinatawag na Mesiyas
  rationale: Tuwirang naipapahayag ng “na tinatawag na” ang λεγόμενον nang hindi idinaragdag ang mapanghamak na diwa ng “di-umano.” Ginamit ang “Mesiyas” dahil titulo ang χριστός sa pariralang ito.
theological_decisions:
- issue: Pagsasalin ng χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito, hayagang gumaganap ang χριστός bilang titulo sa pariralang “tinatawag na,” kaya isinalin ang kahulugan nito bilang “Mesiyas” sa halip na tratuhing parang apelyido.
- issue: Paglalagay ng “Jesus” bago ang Barabbas
  choice: Isinama sa pangunahing teksto bilang “Jesus Barabbas”
  alternative: Barabbas lamang
  rationale: Sinusunod ng salin ang ibinigay na SBLGNT na may Ἰησοῦν. Inilalahad sa talababa ang mahalagang pagkakaiba sa mga manuskrito nang hindi binabago ang pangunahing source text.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ninyo” at “para sa inyo” para sa pangmaramihang kausap. Inilagay ang bawat pananda ng talababa sa mismong bahaging tinutukoy nito.
