revisions:
- from: Ngunit kinuha ng mga punong pari ang mga salaping pilak at sinabi, “Hindi ipinahihintulot na ilagay ang mga ito sa kabang-yaman ng templo[a], sapagkat kabayaran ito sa dugo[b].”
  to: Ngunit kinuha ng mga punong pari ang mga salaping pilak at sinabi, “Hindi ipinahihintulot na ilagay ang mga ito sa kabang-yaman ng templo[a], sapagkat salaping ibinayad ito kapalit ng dugo[b].”
  rationale: Pinahusay ang huling sugnay upang maging likas at malinaw sa modernong Tagalog ang kahulugang “price of blood,” nang hindi nilulutas ang saklaw ng “dugo” sa paraang interpretatibo. Inayos din ang talababa upang maging mas malapit na leksikal na alternatibo. Napanatili ang mga umiiral na footnote anchor at ang kahulugan ng talata.
