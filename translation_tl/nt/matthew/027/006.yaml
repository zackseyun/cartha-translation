id: MAT.27.6
reference: Matthew 27:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: tl
  text: Ngunit kinuha ng mga punong pari ang mga salaping pilak at sinabi, “Hindi ipinahihintulot na ilagay ang mga ito sa kabang-yaman ng templo[a], sapagkat salaping ibinayad ito kapalit ng dugo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: κορβανᾶν (korban), na tumutukoy sa kabang-yaman o mga sagradong pondo ng templo.'
    reason: lexical_alternative
  - marker: b
    text: 'O: “salapi ng dugo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang tawag sa mga nakatataas na awtoridad ng mga pari; malinaw at likas sa modernong Tagalog.
- source_word: λαβόντες
  choice: kinuha
  rationale: Likas na isinasama sa pangunahing pangungusap ang kilos ng aorist participle nang hindi pinabibigat ang ayos.
- source_word: τὰ ἀργύρια
  choice: mga salaping pilak
  rationale: Tumutukoy sa salaping yari sa pilak na nabanggit sa konteksto, nang hindi nagtatakda ng partikular na uri ng barya na hindi pinangalanan dito.
- source_word: Οὐκ ἔξεστιν
  choice: Hindi ipinahihintulot
  rationale: Ipinahahayag ang pagbabawal batay sa legal o panrelihiyong kaangkupan nang hindi tahasang nagdaragdag ng salitang ‘Kautusan.’
- source_word: βαλεῖν
  choice: ilagay
  rationale: Sa konteksto ng kabang-yaman, ito ang likas na kahulugan ng βάλλω; iniiwasan ang di-kinakailangang matingkad na ‘ihagis.’
- source_word: κορβανᾶν
  choice: kabang-yaman ng templo
  rationale: Malinaw na ipinahahayag ang banal na pondong kaugnay ng templo; pinananatili sa talababa ang katawagang Griyego.
- source_word: ἐπεὶ
  choice: sapagkat
  rationale: Likas at marangal na panandang nagpapakilala sa dahilan ng pagbabawal.
- source_word: τιμὴ αἵματός
  choice: kabayaran ito sa dugo
  rationale: Malapit sa anyo at diwa ng Griyego at pinananatili ang matinding ngunit bahagyang bukas na pahayag sa halip na agad ipaliwanag bilang kabayaran sa pagpatay.
theological_decisions:
- issue: Kung paano isasalin ang κορβανᾶν nang malinaw ngunit hindi nawawala ang kontekstong panrelihiyon
  choice: kabang-yaman ng templo
  alternative: korban; kabang-yaman
  rationale: Ang tinutukoy ay ang sagradong pondong nasa templo. Ang pagsasalin ng kahulugan ay mas mauunawaan ng karaniwang mambabasa, habang inilalahad sa talababa ang orihinal na katawagan.
- issue: Kung pananatilihin ang literal na ugnayan ng τιμὴ αἵματός o ipapaliwanag ito bilang salaping ibinayad sa pagpatay
  choice: kabayaran sa dugo
  alternative: salaping may bahid ng dugo; kabayaran sa pagpatay
  rationale: Pinananatili ng napiling anyo ang talinghaga at teolohikal na bigat ng ‘dugo’ nang hindi tahasang nilulutas ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘mga punong pari,’ ‘mga salaping pilak,’ at ‘kabang-yaman ng templo’ bilang mga likas na katumbas; iniwasan ang arkaiko o labis na teknikal na pananalita.
