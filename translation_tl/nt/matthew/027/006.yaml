  source_fidelity: 'Tumpak na naihahatid ng draft ang mga pangunahing elemento ng Griyego: ang mga punong pari, ang salaping pilak, ang pagbabawal na ilagay ito sa kaban ng templo, at ang dahilan na kaugnay ng τιμὴ αἵματος. Gayunman, ang “kabayaran ito sa dugo” ay medyo di-likas at maaaring basahing kabayarang ibinibigay bilang danyos dahil sa dugo, sa halip na salaping ibinayad kapalit ng dugo. Ang “salaping may bahid ng dugo” sa talababa ay higit ding interpretatibo kaysa sa alternatibong “blood money.”'
  naturalness: Likas sa pangkalahatan ang pangungusap at ang rehistro nito ay angkop sa modernong Filipino Tagalog. Mas malinaw at mas natural ang “salaping ibinayad kapalit ng dugo” para sa huling parirala, habang pinananatili ang sadyang maigsi at mabigat na pananalita ng orihinal.
  terminology: Ang “mga punong pari,” “mga salaping pilak,” at “kabang-yaman ng templo” ay angkop. Ang talababa sa κορβανᾶν ay wastong nakatali sa [a]. Ang talababa sa [b] ay dapat magbigay ng tunay na leksikal na alternatibo para sa τιμὴ αἵματος, gaya ng “salapi ng dugo,” sa halip na magdagdag ng ideyang “may bahid.”
