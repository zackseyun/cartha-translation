  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: tl
  text: at inilagay niya iyon sa sarili niyang bagong libingan na inukit niya sa bato. Pagkatapos, iginulong niya ang isang malaking bato sa tapat ng bukana ng libingan at saka umalis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν
  choice: inilagay
  rationale: Likas at malinaw na tumutukoy sa paglalagay ng katawan ni Jesus sa libingan; pinananatili ang payak na kilos ng τίθημι.
- source_word: μνημείῳ / μνημείου
  choice: libingan
  rationale: Sa kontekstong ito, ang μνημεῖον ay isang libingang inukit sa bato. Ang “libingan” ang natural at dignified na katawagan sa modernong Filipino.
- source_word: καινῷ
  choice: bagong
  rationale: Tuwirang katumbas ng καινός. Hindi idinagdag ang implikasyong “hindi pa nagagamit,” sapagkat hindi iyon tahasang sinasabi rito.
- source_word: αὐτοῦ
  choice: sarili niyang
  rationale: Malinaw na ipinahahayag ang pag-aari ni Jose at natural na nagbibigay-diin sa possessive na diwa ng Griyego.
- source_word: ἐλατόμησεν
  choice: ipinaukit niya
  rationale: Ang λατομέω ay tumutukoy sa pagtabas o pag-ukit sa bato. Ang anyong causative ay natural sa Filipino para sa isang libingang inihanda ni Jose, nang hindi kinakailangang ipalagay na personal niyang ginawa ang pisikal na pag-ukit.
- source_word: ἐν τῇ πέτρᾳ
  choice: sa bato
  rationale: Natural na Filipino para sa libingang inukit sa buo o matibay na bato; pinananatili ang lokatibong diwa ng parirala.
- source_word: προσκυλίσας
  choice: Pagkatapos, iginulong niya
  rationale: Ipinakikita ng aorist participle na nauna ang pagpapagulong ng bato bago ang pag-alis; malinaw itong naihahayag sa sunod-sunod na salaysay sa Filipino.
- source_word: λίθον μέγαν
  choice: isang malaking bato
  rationale: Tuwiran, malinaw, at natural na katumbas ng λίθον μέγαν.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: sa bukana ng libingan
  rationale: Maaaring mangahulugan ang θύρα ng pinto o pasukan. Ang “bukana” ay angkop sa isang libingang inukit sa bato at hindi nagpapahiwatig ng modernong pintong may bisagra.
- source_word: ἀπῆλθεν
  choice: saka umalis
  rationale: Natural na ipinahahayag ang pag-alis at ang pagkakasunod ng mga pangyayari sa salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “libingan” at “bukana” upang ilarawan nang natural ang rock-cut tomb, habang iniwasan ang makaluma o labis na teknikal na pananalita.
