base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: tl
  text: Kaya, pagkatapos nilang magsanggunian, binili nila ang Bukid ng Magpapalayok gamit ang mga iyon[a], upang gawing libingan para sa mga dayuhan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit ang salaping iyon.” Sa literal, “mula sa mga iyon,” na tumutukoy sa mga baryang pilak na binanggit sa naunang konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “mga estranghero” o “mga taga-ibang lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: matapos silang mag-usap-usap
  rationale: Ipinahahayag nito ang sama-samang pagsangguni at pagpapasya ng mga punong pari sa natural na modernong Tagalog, habang pinananatili ang naunang kilos ng participle.
- source_word: δὲ
  choice: Kaya
  rationale: Dito, ang δέ ay nagpapatuloy sa salaysay at nag-uugnay sa pasya sa naunang pangyayari, hindi nagpapakita ng matinding pagsalungat.
- source_word: ἠγόρασαν ἐξ αὐτῶν
  choice: ipinambili nila ang mga iyon
  rationale: Ang 'ipinambili' ay likas na Tagalog para sa paggamit ng mga salaping tinutukoy ng panghalip bilang pambayad; pinananatili ng 'ang mga iyon' ang panghalip na maramihan ng Griyego.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Bukid ng Magpapalayok
  rationale: Tuwirang isinasalin ang genitibong parirala at ginagamitan ng malaking titik bilang katawagan sa isang tiyak na lugar sa salaysay.
- source_word: εἰς ταφὴν
  choice: upang gawing libingan
  rationale: Malinaw at natural nitong ipinapahayag ang layunin ng pagbili sa εἰς ταφήν.
- source_word: τοῖς ξένοις
  choice: ng mga dayuhan
  rationale: Sa konteksto ng libingan, ang ξένοις ay tumutukoy sa mga taga-ibang lugar o tagalabas; ang 'mga dayuhan' ang pinakamaikli at malinaw na modernong katumbas.
theological_decisions:
- issue: Tinutukoy ng αὐτῶν
  choice: Ang panghalip ay tumutukoy sa mga salaping pilak sa naunang konteksto, ngunit pinanatili bilang 'ang mga iyon.'
  alternative: Maaaring linawin bilang 'ang salaping iyon.'
  rationale: Malinaw sa agarang konteksto ang tinutukoy, at ang pagpapanatili ng panghalip ay umiiwas sa labis na pagpapaliwanag habang ang talababa ay nagbibigay ng paglilinaw.
- issue: Saklaw ng ξένοις
  choice: mga dayuhan
  alternative: mga estranghero; mga taga-ibang lugar
  rationale: Hindi tiyak sa mismong salita kung banyagang mamamayan lamang o mas malawak na mga tagalabas ang tinutukoy; pinananatili sa talababa ang alternatibong saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mag-usap-usap' para sa sama-samang pagsangguni at ang likas na konstruksiyong 'ipinambili' upang maiwasan ang alanganing literal na 'bumili mula sa mga iyon.' Parehong nakalagay sa pangunahing teksto ang mga marker na [a] at [b].
