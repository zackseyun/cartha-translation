id: MAT.27.47
reference: Matthew 27:47
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: tl
  text: Ngunit nang marinig iyon ng ilan sa mga nakatayo roon, sinabi nila, “Tinatawag ng taong ito si Elias.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: ilan
  rationale: Likas at maikling katumbas para sa di-tiyak na bahagi ng pangkat.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pag-usad ng salaysay mula sa naunang sigaw ni Jesus.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: sa mga nakatayo roon
  rationale: Pinananatili ang malinaw na larawan at ang substantival na gamit ng participle.
- source_word: ἀκούσαντες
  choice: nang marinig iyon
  rationale: Ipinapakita na nauna ang pagkarinig sa kanilang pagsasalita; ang “iyon” ay likas na tumutukoy sa sigaw sa naunang talata.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Natural sa salaysay sa Tagalog; maaaring ipahiwatig ng imperpektibo ang patuloy o paulit-ulit na pagsasalita, ngunit magiging mabigat ang literal na “sinasabi nila noon” dito.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ito ang nakaugaliang modernong anyo ng pangalan ng propetang Elijah sa Bibliyang Tagalog.
- source_word: φωνεῖ
  choice: Tinatawag
  rationale: Direktang sinasalamin ang pandiwa at hindi idinaragdag kung siya ay tinatawag na lumapit o sinasambit lamang.
- source_word: οὗτος
  choice: ng taong ito
  rationale: Natural na naipapahayag ang demonstratibong puwersa ng “this one” nang hindi kinakailangang lagyan ng mapanghamak na himig.
theological_decisions:
- issue: Kung ipahihiwatig na talagang tinawag ni Jesus si Elias o iuulat lamang ang pagkaunawa ng mga nakarinig
  choice: 'Inilagay bilang tuwirang sinabi ng mga nakatayo: “Tinatawag ng taong ito si Elias.”'
  alternative: “Humihingi ng tulong kay Elias ang taong ito.”
  rationale: Iniulat lamang ng Griyego ang sinabi ng mga nakarinig. Hindi ipinapasok sa pangunahing teksto ang interpretasyong humihingi siya ng tulong, kaya nananatili ang dramatikong tensiyon at ang malamang na maling pagkaunawa nila.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “nang marinig iyon” para sa maayos na daloy, at “Tinatawag … si Elias” upang manatiling malapit sa Griyego nang hindi labis na ipinapaliwanag ang layon ng pagtawag.
