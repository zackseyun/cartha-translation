    issue: Ang “ayon sa” para sa καθὰ ay bahagyang hindi gaanong tuwiran kaysa “gaya ng.”
    rationale: Ang καθὰ ay nagpapahayag ng “just as/as,” samantalang ang “ayon sa” ay maaaring magtunog na “according to” o “in accordance with.” Ligtas na gamitin ang “gaya ng” upang mas malinaw na mapanatili ang paghahambing.
  - severity: low
    issue: Hindi tugma ang unang alternatibo sa talababa sa kasalukuyang salin.
    rationale: Inililista ng talababa ang “gaya ng iniutos ...” bilang alternatibo, ngunit mas mainam itong gawing mismong pangunahing salin; kaya kailangang iayon ang talababa upang hindi ito maging redundant.
