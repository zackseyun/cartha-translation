  source_fidelity: Tumpak ang pangunahing pag-unawa sa ἔδωκαν αὐτὰ bilang “ibinigay nila ang mga iyon,” at ang “para sa bukid” ay angkop sa gamit ng εἰς sa kontekstong ito. Napananatili rin nang tama ang unang panauhang μοι (“sa akin”). Gayunman, mas tuwirang naihahayag ng “gaya ng” ang καθὰ (“just as”) kaysa “ayon sa,” na mas madaling magmungkahi ng simpleng pagsunod sa isang utos kaysa pagtutugma sa sipi/alusyon.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Ang “bukid ng magpapalayok” ay malinaw at katanggap-tanggap. Ang “gaya ng iniutos” ay mas likas at mas malapit sa puwersa ng Griyego kaysa “ayon sa iniutos.”
  terminology: Ang “Panginoon” para sa κύριος ay angkop. Ang “magpapalayok” ay isang katanggap-tanggap na katawagan para sa κεραμεύς. Napananatili ang mahalagang unang panauhan nang walang pagpapakahulugang doktrinal.
  issues:
