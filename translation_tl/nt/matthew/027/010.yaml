  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: tl
  text: at ibinigay nila ang mga iyon para sa bukid ng magpapalayok, gaya ng iniutos sa akin ng Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng itinagubilin sa akin ng Panginoon.” Pinananatili rito ang unang panauhang “sa akin” na nasa tekstong Griyego.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: ibinigay nila
  rationale: Pinananatili ang karaniwang kahulugan ng aorist active indicative ng δίδωμι na “ibinigay,” sa halip na gawing mas interpretatibong “ibinayad.”
- source_word: αὐτὰ
  choice: ang mga iyon
  rationale: Pinananatili ang pangmaramihang pagtukoy sa mga salaping nabanggit sa konteksto.
- source_word: εἰς τὸν ἀγρὸν
  choice: para sa bukid
  rationale: Bagaman karaniwang nangangahulugang “papasok sa” ang εἰς, sa konteksto ng paggamit ng salapi para sa bukid, natural at tumpak sa Filipino ang “para sa bukid.”
- source_word: τοῦ κεραμέως
  choice: ng magpapalayok
  rationale: 'Likas na ipinahahayag ng pariralang ito ang kaugnayang paari: ang bukid na tinutukoy bilang sa magpapalayok.'
- source_word: καθὰ
  choice: ayon sa
  rationale: Natural na Filipino para sa pagtutugmang ipinahahayag ng καθὰ; ipinakikitang ang ginawa ay alinsunod sa kasunod na pahayag.
- source_word: συνέταξέν
  choice: iniutos
  rationale: Ang συντάσσω ay maaaring mangahulugang mag-utos, magtagubilin, o magbilin. Ang “iniutos” ay malinaw na naghahatid ng may-awtoridad na tagubilin.
- source_word: μοι
  choice: sa akin
  rationale: Tuwirang pinananatili ang unang panauhang dative na μοι at hindi ito inaangkop sa nakapaligid na salaysay.
- source_word: κύριος
  choice: ang Panginoon
  rationale: Karaniwan at marangal na salin ng κύριος sa kontekstong ito; sinasalamin din nito ang tiyak na pagtukoy ng tekstong Griyego.
theological_decisions:
- issue: Unang panauhang tinutukoy sa sipi o alusyon
  choice: Pinanatili ang “sa akin” ayon sa μοι ng tekstong Griyego.
  alternative: Iangkop ang pahayag sa nakapaligid na salaysay o gawing mas tahasang kaayon ng pinagmulan sa Lumang Tipan.
  rationale: Ang pagpapanatili sa unang panauhan ay tapat sa SBLGNT at hindi tahimik na nilulutas ang tensiyon hinggil sa paraan ng pagsipi o pag-uugnay ni Mateo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “magpapalayok” bilang malinaw na katawagan sa gumagawa ng mga palayok, at pinanatili ang “sa akin” upang huwag pakinisin ang tunay na tensiyon sa sipi.
