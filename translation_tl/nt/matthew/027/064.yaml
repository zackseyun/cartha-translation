revisions:
- from: Kaya ipag-utos mong tiyaking ligtas ang libingan hanggang sa ikatlong araw, baka dumating ang kanyang mga alagad[a] at nakawin siya, at sabihin sa mga tao, ‘Ibinangon siya mula sa mga patay,’[b] at ang huling panlilinlang ay magiging mas masahol kaysa sa una.
  to: Kaya ipag-utos mong siguraduhing ligtas ang libingan hanggang sa ikatlong araw, baka dumating ang kanyang mga alagad[a] at nakawin siya at sabihin sa mga tao, ‘Ibinangon siya mula sa mga patay,’[b] at ang huling panlilinlang ay magiging mas masahol kaysa sa una.
  rationale: Inayos ang pandiwang kaugnay ng pagseseguro sa libingan upang maging mas natural na modernong Filipino at mas malinaw na maipakita ang paghingi ng isang opisyal na utos. Inalis ang kuwit sa pagitan ng magkaugnay na pandiwang “nakawin” at “sabihin.” Pinalitan ang talababa b ng isang aktuwal na alternatibong salin at pinanatili ang paliwanag tungkol sa balintiyak na anyo ng Griyego.
