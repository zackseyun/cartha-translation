  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: tl
  text: Kaya ipag-utos mong siguraduhing ligtas ang libingan hanggang sa ikatlong araw, baka dumating ang kanyang mga alagad[a] at nakawin siya at sabihin sa mga tao, ‘Ibinangon siya mula sa mga patay,’[b] at ang huling panlilinlang ay magiging mas masahol kaysa sa una.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang manuskritong nagdaragdag ng “sa gabi” pagkatapos ng “dumating”: “baka dumating sa gabi ang kanyang mga alagad at nakawin siya.” Sinusunod dito ang mas maikling pagbasa.'
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “Binuhay siyang muli mula sa mga patay.” Balintiyak ang pandiwang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: ipag-utos mo
  rationale: Tuwirang pautos na humihiling kay Pilato ng tiyak at opisyal na pagkilos.
- source_word: οὖν
  choice: kaya
  rationale: Likas na makabagong Tagalog na nagpapakita ng kongklusyon mula sa naunang pahayag.
- source_word: ἀσφαλισθῆναι
  choice: tiyaking ligtas
  rationale: Saklaw nito ang pagpapaseguro sa libingan nang hindi nililimitahan ang paraan sa pagbabantay lamang.
- source_word: τὸν τάφον
  choice: ang libingan
  rationale: Karaniwang dignipikadong katawagan sa Tagalog para sa pinaglibingan ni Jesus.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: hanggang sa ikatlong araw
  rationale: Pinananatili ang temporal na pahayag at ugnay nito sa hula tungkol sa muling pagkabuhay.
- source_word: μήποτε
  choice: baka
  rationale: Natural na naghahayag ng kinatatakutang posibilidad na nais pigilan.
- source_word: ἐλθόντες οἱ μαθηταὶ αὐτοῦ
  choice: dumating ang kanyang mga alagad
  rationale: Natural na isinasalin ang aorist participle bilang kilos na nauuna sa pagnanakaw; hindi idinagdag sa talata ang ‘sa gabi.’
- source_word: κλέψωσιν αὐτόν
  choice: nakawin siya
  rationale: Pinananatili ang personal na panghalip ng Griyego sa halip na tahasang palitan ng ‘ang kanyang bangkay.’
- source_word: εἴπωσιν τῷ λαῷ
  choice: sabihin sa mga tao
  rationale: Ang λαός ay tumutukoy sa mga tao sa pangkalahatan, hindi lamang sa isang naroroong pulutong.
- source_word: Ἠγέρθη
  choice: Ibinangon siya
  rationale: Pinananatili ang balintiyak na tinig ng Griyego at hindi tahasang pinapangalanan ang gumawa ng pagkilos.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: mula sa mga patay
  rationale: Malapit sa maramihang anyo ng Griyego at malinaw sa konteksto ng muling pagkabuhay.
- source_word: ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης
  choice: ang huling panlilinlang ay magiging mas masahol kaysa sa una
  rationale: Pinananatili ang paghahambing ng huli at unang itinuturing nilang panlilinlang.
theological_decisions:
- issue: Paglalarawan sa pahayag tungkol sa muling pagkabuhay
  choice: Ibinangon siya mula sa mga patay
  alternative: Bumangon siya mula sa mga patay
  rationale: Balintiyak ang Ἠγέρθη. Pinananatili ng ‘Ibinangon siya’ ang gramatikal at teolohikal na pahiwatig nang hindi idinaragdag kung sino ang nagbangon sa kanya.
- issue: Tinutukoy ng panghalip na αὐτόν
  choice: nakawin siya
  alternative: nakawin ang kanyang bangkay
  rationale: Ang teksto ay gumagamit ng personal na panghalip. Hindi tahasang idinaragdag ang ‘bangkay,’ bagaman iyon ang malinaw na tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at dignipikadong Filipino. Ginamit ang ‘kaya’ at ‘baka’ bilang natural na katumbas ng lohikal at pang-iwas na mga pang-ugnay. Pinanatili ang balintiyak na anyo sa pahayag ng muling pagkabuhay at ang personal na panghalip sa ‘nakawin siya.’
