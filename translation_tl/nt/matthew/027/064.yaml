review_pass:
  verdict: revise
  source_fidelity: 'Ang pangkalahatang diwa ay tapat sa Griyego: naipapahayag ang opisyal na utos, ang pag-iingat sa libingan hanggang ikatlong araw, ang kinatatakutang pagnanakaw ng mga alagad, ang balintiyak na pahayag ng pagkabuhay, at ang paghahambing ng huli at unang panlilinlang. Gayunman, ang “tiyaking ligtas ang libingan” ay hindi gaanong tuwirang katumbas ng ἀσφαλισθῆναι at medyo hindi natural sa ayos na ito.'
  naturalness: Kailangan ng maliit na rebisyon. Mas likas at malinaw ang “ipag-utos mong siguraduhing ligtas ang libingan,” na ipinapakita ring ang kausap ang magpapautos ng pagkakatiyak, hindi siya mismo ang tuwirang gagawa nito. Maayos ang iba pang daloy ng pangungusap.
  terminology: Ang “libingan,” “mga alagad,” “mga patay,” at “panlilinlang” ay angkop. Ang “Ibinangon siya mula sa mga patay” ay napapanatili ang balintiyak na tinig ng Ἠγέρθη at hindi pinapangalanan ang gumagawa ng pagkilos. Kailangang itama ang talababa b sapagkat inuulit ng kasalukuyang diumano’y alternatibong salin ang mismong salin sa teksto at hindi aktuwal na nagbibigay ng alternatibo.
  issues:
  - severity: medium
    issue: Hindi sapat na natural ang “ipag-utos mong tiyaking ligtas ang libingan.”
    rationale: Ang κέλευσον ay utos na ipaakto sa iba, samantalang ang “tiyaking” ay maaaring magpahiwatig na ang kausap mismo ang tuwirang titiyak. Ang “ipag-utos mong siguraduhing” ay mas malinaw na tumutugma sa causative/official na puwersa ng Griyego at nananatiling hindi tiyak sa paraan ng pagseseguro.
  - severity: medium
    issue: Hindi tunay na alternatibo ang talababa b.
    rationale: Ang nakasaad na alternatibong “Ibinangon siya mula sa mga patay” ay kapareho ng teksto. Dapat itong palitan ng isang tunay na posibleng salin habang ipinapaliwanag na balintiyak ang pandiwang Griyego.
