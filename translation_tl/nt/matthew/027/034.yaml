- from: Binigyan nila siya ng alak na hinaluan ng apdo upang inumin[a], ngunit nang matikman niya iyon, ayaw niyang uminom.
  to: Binigyan nila siya ng alak na hinaluan ng apdo upang kanyang inumin, ngunit nang matikman niya ito, hindi niya ninais na inumin iyon.[a]
  rationale: Nilinaw ang sintaksis ng layuning infinitibo upang hindi maging malabo kung sino ang iinom. Inayos din ang paglalapat ng nakaraang bolisyonal na kilos, nang pinananatili ang saklaw at antas ng ἠθέλησεν. Walang binago sa leksikal na pagpapasya tungkol sa χολή o sa talababa.
