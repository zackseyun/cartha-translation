    rationale: Ang infinitibong πιεῖν ay may ipinahiwatig na tagaganap na ‘siya’ (Jesus). Sa Filipino, ang “alak na hinaluan ng apdo upang inumin” ay maaaring maging sintaktikong malabo; kailangan ang “upang kanyang inumin” o katumbas nito.
  - severity: low
    issue: Ang “ayaw niyang uminom” ay maaaring magpahiwatig ng pangkasalukuyan o habitual na aspekto.
    rationale: Ang ἠθέλησεν ay aorist at tumutukoy sa isang pangyayari sa nakaraan. Ang “hindi niya ninais na inumin iyon” ay mas malinaw na nakapaloob sa nakaraang pagsasalaysay habang hindi pinatitindi ang kahulugan bilang tahasang pagtanggi.
  revised_text: Binigyan nila siya ng alak na hinaluan ng apdo upang kanyang inumin, ngunit nang matikman niya ito, hindi niya ninais na inumin iyon.[a]
