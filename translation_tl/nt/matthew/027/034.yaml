  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: tl
  text: Binigyan nila siya ng alak na hinaluan ng apdo upang kanyang inumin, ngunit nang matikman niya ito, hindi niya ninais na inumin iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang χολή ay maaaring mangahulugang “apdo” o, sa mas malawak na diwa, isang mapait na sangkap. Pinanatili rito ang “apdo” upang masalamin ang pananalita ni Mateo; ihambing ang kaugnay na salaysay sa Marcos 15:23, na bumabanggit ng mira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Binigyan nila siya ... upang inumin
  rationale: Tuwirang ipinapahayag ang pagbibigay sa kaniya ng maiinom at pinananatili ang layon ng infinitibong πιεῖν.
- source_word: οἶνον
  choice: alak
  rationale: Karaniwan at natural na salitang Filipino para sa wine sa kontekstong biblikal.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: na hinaluan ng apdo
  rationale: Ang μεμιγμένον ay nangangahulugang hinaluan, at pinananatili ng apdo ang mas tiyak na kahulugan at kaugnayang kasulatan ng χολή, habang ipinapaliwanag sa talababa ang mas malawak nitong saklaw.
- source_word: καὶ γευσάμενος
  choice: ngunit nang matikman niya iyon
  rationale: Ipinapakita ng ngunit ang salungat na kinalabasan sa daloy ng salaysay; ang nang matikman ay natural na Filipino para sa aorist participle na 'pagkatikim.'
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: ayaw niyang uminom
  rationale: Pinananatili nito ang diwang kusang hindi pagnanais ng θέλω nang hindi ito pinatitindi bilang tahasang pagtanggi.
theological_decisions:
- issue: Pagpapakahulugan sa χολή kaugnay ng salaysay ng paghihirap at ng alusyong kasulatan
  choice: apdo
  alternative: mapait na sangkap
  rationale: Maaaring tumukoy ang χολή sa apdo o, sa mas malawak na diwa, sa isang mapait na sangkap. Pinananatili ng 'apdo' ang tiyak na anyo ng pananalita ni Mateo at ang posibleng alusyong kasulatan, nang hindi nilulutas sa pangunahing teksto ang tunay na leksikal na lawak nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na 'ayaw niyang uminom' upang natural na maipahayag ang volisyon, at iniwasan ang mas matinding 'tumanggi siyang uminom.'
