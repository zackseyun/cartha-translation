  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: tl
  text: Kaya tinawag na “Bukid ng Dugo” ang bukid na iyon hanggang sa araw na ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Likas at malinaw na nagpapahayag ng bunga o kongklusyon mula sa naunang paliwanag.
- source_word: ἐκλήθη
  choice: tinawag na
  rationale: Tuwirang ipinapahayag ang aorist passive ng καλέω sa natural na Tagalog; ang patuloy na paggamit ng pangalan ay ipinahihiwatig ng “hanggang sa araw na ito.”
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ang bukid na iyon
  rationale: Pinananatili ang karaniwang kahulugan ng ἀγρός at ang demonstratibong ἐκεῖνος, pati ang pag-uulit ng salita sa pangalan ng lugar.
- source_word: Ἀγρὸς Αἵματος
  choice: Bukid ng Dugo
  rationale: Malinaw na pangalan ng lugar na pinananatili ang ugnayang genitibo at ang pag-uulit ng ἀγρός.
- source_word: αἵματος
  choice: Dugo
  rationale: Tumpak na salin ng genitive singular ng αἷμα bilang bahagi ng pangalan ng lugar.
- source_word: ἕως τῆς σήμερον
  choice: hanggang sa araw na ito
  rationale: Natural at marangal na idyomang Tagalog para sa pangalang nananatiling ginagamit hanggang sa panahon ng manunulat.
