  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang “bukid” upang mapanatili ang leksikal na pag-uulit sa karaniwang pagtukoy sa lugar at sa pangalan nitong “Bukid ng Dugo.”
