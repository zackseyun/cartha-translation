  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang pangungutya, pag-aalis ng balabal, muling pagbibihis kay Jesus ng sarili niyang mga damit, at layuning pagpapako sa krus. Gayunman, ang simpleng “dinala siya” ay hindi lubos na naipapakita ang ἀπήγαγον, na may diwang pagdadala o pag-akay palayo.
  naturalness: Natural at marangal ang kabuuang Filipino. Ang pagdaragdag ng “nila” at “palayo” sa huling sugnay ay nagpapalinaw ng patuloy na paksa at mas likas na naghahatid ng galaw na nasa Griyego.
  terminology: Ang “kutyain,” “balabal,” “mga damit,” at “ipako sa krus” ay angkop sa modernong Filipino Tagalog at wasto sa kahulugan ng mga terminong Griyego. Ang talababa ay nakatutulong at hindi nagpapataw ng interpretasyong doktrinal.
  issues:
