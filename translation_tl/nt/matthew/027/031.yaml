base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: tl
  text: At matapos nila siyang kutyain, hinubaran nila siya ng balabal[a], isinuot sa kanya ang sarili niyang mga damit, at dinala nila siya palayo upang ipako sa krus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapa.” Ang salitang Griyego na χλαμύς ay tumutukoy sa isang balabal o panlabas na kasuotan, na madalas isuot ng mga sundalo; sa kontekstong ito, ito ang kasuotang ipinasuot kay Jesus upang libakin siya bilang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: matapos nila siyang kutyain
  rationale: Ang aorist na ἐνέπαιξαν ay tumutukoy sa mapanlait at malupit na pangungutya. Ang “kutyain” ay mas angkop sa bigat ng tagpo kaysa sa mas magaang na “pagtawanan,” at likas ang “matapos” para sa temporal na sugnay na may ὅτε.
- source_word: χλαμύδα
  choice: balabal
  rationale: Ang χλαμύς ay isang panlabas na kasuotan o balabal, madalas na kaugnay ng sundalo o opisyal. Ang “balabal” ay tumpak at hindi nagdaragdag ng tiyak na pormal o maharlikang kahulugan, bagaman sa konteksto ay ginamit ito bilang huwad na kasuotang maharlika.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: hinubaran nila siya ng balabal
  rationale: Ipinahihiwatig ng ἐκδύω ang paghuhubad o sapilitang pag-aalis ng kasuotan. Pinananatili ng “hinubaran” ang lakas ng pandiwa at natural ito sa Filipino.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: isinuot sa kanya ang sarili niyang mga damit
  rationale: Ang ἐνδύω ay pananamit sa isang tao, at malawak ang kahulugan ng ἱμάτια bilang mga kasuotan. Malinaw na ipinakikita ng “sarili niyang” ang pagkakaiba ng mga damit ni Jesus sa balabal na katatanggal lamang.
- source_word: ἀπήγαγον
  choice: dinala siya
  rationale: Ang ἀπάγω ay nangangahulugang akayin o dalhin palayo. Sa Filipino, natural na ipinahihiwatig ng “dinala siya” na nasa kustodiya siya ng mga kawal.
- source_word: εἰς τὸ σταυρῶσαι
  choice: upang ipako sa krus
  rationale: Ang εἰς na may articular infinitive ay nagpapahayag ng layunin. Ang “upang ipako sa krus” ay malinaw at karaniwang paraan sa Filipino upang ilarawan ang layuning pagkapako kay Jesus.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kutyain” upang mapanatili ang kalupitan ng pangungutya, at ang “ipako sa krus” bilang natural at pamilyar na katumbas ng σταυρόω nang hindi nagdaragdag ng interpretasyong teolohikal.
