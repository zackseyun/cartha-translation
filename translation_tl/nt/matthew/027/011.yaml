id: MAT.27.11
reference: Matthew 27:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: tl
  text: Tumayo si Jesus sa harap ng gobernador. Tinanong siya ng gobernador, “Ikaw ba ang Hari ng mga Judio[a]?” Sinabi ni Jesus, “Ikaw ang nagsasabi niyan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hari ng mga taga-Judea.” Ang salitang Griyego ay maaaring tumukoy sa mga Judio sa pangkalahatan o, sa ilang konteksto, sa mga taga-Judea.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Ikaw ang nagsasabi,” “Ikaw ang nagsabi niyan,” o “Gaya ng sinabi mo.” Maikli at bahagyang di-tuwiran ang tugon ni Jesus sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: Tumayo
  rationale: Likas na katumbas ng aorist na anyo sa kontekstong ito. Hindi nito ipinapalagay na may tahasang nagpatayo kay Jesus, at hindi rin nito pinalalabis ang tagal ng pagkakatayo.
- source_word: ἔμπροσθεν
  choice: sa harap ng
  rationale: Malinaw at natural sa Filipino, habang pinananatili ang pormal na tagpo ng paglilitis.
- source_word: ἡγεμών / ἡγεμόνος
  choice: gobernador
  rationale: Ito ang pinakakaraniwan at madaling maunawaang tawag sa Romanong opisyal sa kontekstong ito; ang “prefekto” ay mas teknikal at ang “pinuno” ay napakalawak.
- source_word: ἐπηρώτησεν
  choice: Tinanong
  rationale: Natural na Filipino para sa pormal na pagtatanong. Ang “sinal interrogate” o “inutisa” ay maaaring magdagdag ng tinding hindi tahasang ipinahihiwatig ng Griyego.
- source_word: βασιλεὺς
  choice: Hari
  rationale: Tumutukoy sa tiyak na maharlikang titulong nasa tanong kay Jesus; ang malaking titik ay angkop sa ganitong gamit bilang titulo.
- source_word: τῶν Ἰουδαίων
  choice: ng mga Judio
  rationale: Sa salaysay ng pagpapakasakit, ito ang natural at malawak na nauunawaang katawagang etniko-politikal. Posible rin ayon sa leksikon ang “mga taga-Judea,” kaya inilagay iyon sa talababa.
- source_word: ἔφη
  choice: Sinabi
  rationale: Direkta at hindi mapagpalagay na katumbas ng pandiwang nagpapakilala sa tugon ni Jesus.
- source_word: Σὺ λέγεις
  choice: Ikaw ang nagsasabi niyan
  rationale: Pinananatili nito ang maikli, di-tuwiran, at bahagyang malabong tugon ng Griyego nang hindi ito ginagawang tahasang pagsang-ayon o pagtanggi.
theological_decisions:
- issue: Diwa ng tugon ni Jesus na Σὺ λέγεις
  choice: 'Di-tuwiran at may pagpipigil na tugon: “Ikaw ang nagsasabi niyan.”'
  alternative: 'Mas tahasang pagsang-ayon: “Gaya ng sinabi mo,” o mas literal: “Ikaw ang nagsasabi.”'
  rationale: Hindi tahasang itinatanggi ng Griyego ang titulo, ngunit hindi rin nito inuulit ang pahayag ayon sa pampolitikang balangkas ng gobernador. Pinananatili ng salin ang tensiyong ito sa halip na lutasin ito bilang lubos na pagsang-ayon o pagtanggi.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Hindi isinalin ang δέ bilang panimulang “Ngayon” sapagkat wala itong tahasang temporal na diwa rito; hinayaang dalhin ng pagkakasunod ng mga pangungusap ang ugnayan sa naunang salaysay. Inayos ang mga marker ayon sa mismong paksang ipinapaliwanag ng bawat talababa.
