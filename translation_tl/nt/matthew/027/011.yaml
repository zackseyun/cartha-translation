  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Griyego: si Jesus ay tumayo sa harap ng gobernador, tinanong siya ng gobernador, at tumugon si Jesus sa maikli at di-tuwirang paraan. Ang “Tumayo” ay hindi nagdaragdag ng sapilitang pagpapapatayo, at ang “Tinanong” ay angkop sa ἐπηρώτησεν.'
