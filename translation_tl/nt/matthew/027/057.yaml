id: MAT.27.57
reference: Matthew 27:57
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: tl
  text: Pagsapit ng gabi, dumating ang isang mayamang lalaki mula sa Arimatea na nagngangalang Jose. Siya rin ay naging alagad ni Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ginawang alagad ni Jesus” o “alagad din ni Jesus.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Pagsapit ng gabi
  rationale: Likas na temporal na parirala sa modernong Tagalog para sa genitive absolute; ipinahihiwatig nito ang paglipat ng tagpo nang hindi nagdaragdag ng tahasang “ngayon.”
- source_word: ἦλθεν
  choice: dumating
  rationale: Tuwirang salaysay ng pagdating; mas natural dito kaysa sa simpleng “pumarito” dahil walang tahasang tinutukoy na deiktikong pananaw sa Tagalog.
- source_word: ἄνθρωπος πλούσιος
  choice: isang mayamang lalaki
  rationale: Malinaw at karaniwang katumbas ng pariralang Griyego.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: mula sa Arimatea
  rationale: Pinananatili ang diwa ng pinagmulan na ipinahahayag ng ἀπό.
- source_word: τοὔνομα Ἰωσήφ
  choice: na nagngangalang Jose
  rationale: Natural at maikli sa Tagalog habang malinaw na ipinakikilala ang pangalan.
- source_word: ὃς καὶ αὐτὸς
  choice: Siya rin
  rationale: 'Ipinananatili ang pandagdag at bahagyang mariing diwa ng καὶ αὐτός: kabilang din si Jose sa mga alagad.'
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: ay naging alagad ni Jesus
  rationale: Natural na Tagalog na pinananatili ang resultang kalagayan ng pasibong pandiwa nang hindi ipinapalagay ang tiyak na paraan kung paano siya ginawang alagad.
theological_decisions:
- issue: Diwa ng ἐμαθητεύθη kaugnay ni Jesus
  choice: naging alagad ni Jesus
  alternative: ginawang alagad ni Jesus; alagad din ni Jesus
  rationale: Maaaring ipahiwatig ng pasibong μαθητεύω ang pagiging o pagkagawang alagad. Ang pangunahing salin ay malinaw at hindi labis na nagtatakda kung si Jesus mismo ang tuwirang nagturo o gumawa sa kanya bilang alagad; itinatala sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na may payak ngunit marangal na himig. Hinati sa dalawang pangungusap upang maging natural at malinaw ang salaysay, habang pinananatili ng “Siya rin” ang diin ng ὃς καὶ αὐτός.
