  source_fidelity: Tumpak na naisasalin ang temporal na genitive absolute (Ὀψίας δὲ γενομένης), ang pagdating ni Jose, ang kanyang yaman at pinagmulan sa Arimatea, at ang pagkakakilanlan niya bilang alagad ni Jesus. Ang “Siya rin” ay sapat na natural na paraan upang maipakita ang pandagdag na diin ng ὃς καὶ αὐτός nang hindi nagiging mabigat ang Tagalog.
  naturalness: Natural ang modernong Filipino Tagalog. Ang “Pagsapit ng gabi” at “dumating ang isang mayamang lalaki” ay malinaw at marangal nang hindi lipas. Ang paghahati sa dalawang pangungusap ay hindi nagbabago ng ugnayan o diin ng salaysay.
  terminology: Ang “alagad ni Jesus” ay angkop at matatag na katumbas ng μαθητής/μαθητεύω sa kontekstong ito. Hindi nito ipinipilit na si Jesus mismo ang tuwirang nagturo kay Jose. Ang talababa ay maayos na nagtatala ng mga posibleng salin ng pasibong ἐμαθητεύθη.
