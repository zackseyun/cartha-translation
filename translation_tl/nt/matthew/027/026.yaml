base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: tl
  text: Pagkatapos, pinalaya niya si Barabas para sa kanila, ngunit matapos niyang ipahagupit si Jesus, ibinigay niya ito upang ipako sa krus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay tumutukoy sa parusang Romano na matinding paghagupit o paglatigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinapakita nito nang natural ang pagsunod-sunod ng salaysay.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: pinalaya niya para sa kanila
  rationale: Sa kontekstong panghukuman, ang pandiwa ay tumutukoy sa pagpapalaya sa isang bilanggo, at ang datibo ay maaaring magpahiwatig na ginawa iyon para sa kapakanan o ayon sa kahilingan ng mga tao.
- source_word: τὸν Βαραββᾶν
  choice: si Barabas
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: τὸν δὲ Ἰησοῦν
  choice: ngunit ... si Jesus
  rationale: Ang δέ ay nagpapakita rito ng matinding paghahambing sa pagpapalaya kay Barabas at sa sinapit ni Jesus.
- source_word: φραγελλώσας
  choice: ipinahagupit muna niya
  rationale: Ang aorist participle ay likas na nagpapahiwatig ng kilos na nauna sa pangunahing pandiwa. Ang causative na 'ipinahagupit' ay angkop sa awtoridad ni Pilato at hindi kinakailangang mangahulugang siya mismo ang humagupit.
- source_word: παρέδωκεν
  choice: ibinigay
  rationale: Inihahayag nito ang pagsuko o pagbibigay kay Jesus sa mga magsasagawa ng hatol nang hindi nagdaragdag ng tahasang tagaganap na wala sa sugnay.
- source_word: ἵνα σταυρωθῇ
  choice: upang ipako sa krus
  rationale: Pinananatili ng 'upang' ang layunin o nilalayong kinalabasan ng ἵνα at malinaw na isinasalin ang pasibong pagpapako sa krus.
theological_decisions:
- issue: Pagkakasunod-sunod at ahensiya sa paghatol kay Jesus
  choice: Ipinahagupit muna ni Pilato si Jesus bago niya ibinigay upang ipako sa krus.
  alternative: Ibinigay muna ni Pilato si Jesus at pagkatapos ay hinagupit siya.
  rationale: Ang φραγελλώσας ay aorist participle na pinakanatural na tumutukoy sa kilos na nauna sa παρέδωκεν. Hindi tinutukoy ng salin kung sino mismo ang humagupit o kung kanino eksaktong ibinigay si Jesus, sapagkat hindi iyon tahasang sinasabi sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'ipinahagupit' sa halip na mas teknikal o makalumang 'hinalupit,' at pinanatili ang maigsi at mabigat na takbo ng salaysay.
