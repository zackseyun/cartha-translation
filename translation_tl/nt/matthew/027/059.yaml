  text: καὶ λαβὼν τὸ σῶμα ὁ Ἰωσὴφ ἐνετύλιξεν ⸀αὐτὸ σινδόνι καθαρᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: tl
  text: At kinuha ni Jose ang katawan at binalot iyon sa isang malinis na telang lino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang malinis na telang panlibing na lino.” Maaaring tumukoy ang salitang Griyego sa telang lino na ginagamit sa paglilibing.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: kinuha
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa; natural itong ipinapahayag sa Tagalog bilang sunod na pandiwang “kinuha.”
- source_word: σῶμα
  choice: ang katawan
  rationale: Tuwirang katumbas ito ng σῶμα. Walang tahasang panghalip na paari sa Griyego, at malinaw sa konteksto na katawan ni Jesus ang tinutukoy.
- source_word: ἐνετύλιξεν
  choice: binalot
  rationale: Ang ἐντυλίσσω ay nangangahulugang balutin o ilukob sa isang tela; “binalot” ang natural at malinaw na salita sa konteksto ng paglilibing.
- source_word: αὐτὸ
  choice: iyon
  rationale: Neuter singular ang panghalip at tumutukoy sa σῶμα, “katawan.” Ang “iyon” ay natural sa Tagalog at pinananatili ang gramatikal na pagtukoy sa katawan sa halip na tahasang gawing “siya.”
- source_word: σινδόνι
  choice: sa isang ... telang lino
  rationale: Ang σινδών ay telang lino at maaari ring tumukoy sa telang panlibing. Ang “telang lino” ay malinaw at hindi nagdaragdag ng espesipikong kahulugang hindi tiyak sa salita mismo.
- source_word: καθαρᾷ
  choice: malinis
  rationale: Sa kontekstong ito, ang καθαρός ay likas na tumutukoy sa pagiging malinis ng telang lino; hindi kailangan ang mas abstraktong “dalisay.”
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: At ... ni Jose
  rationale: Pinananatili ng “At” ang payak na daloy ng salaysay na ipinahihiwatig ng καί, samantalang natural sa Tagalog ang ayos na “kinuha ni Jose.”
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “iyon” upang malinaw na tumukoy sa “katawan” nang hindi nagiging malamig ang pananalita; ang posibleng mas espesipikong kahulugang telang panlibing ay inilagay sa talababa.
