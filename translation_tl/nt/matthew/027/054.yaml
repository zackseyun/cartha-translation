id: MAT.27.54
reference: Matthew 27:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: tl
  text: Nang makita ng senturyon at ng mga kasama niyang nagbabantay kay Jesus ang lindol at ang mga nangyari, labis silang natakot at sinabi, “Tunay ngang ito ang Anak ng Diyos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang anak ng Diyos.” Walang artikulo ang pariralang Griyego na θεοῦ υἱός; ayon sa konteksto at sa paglalahad ni Mateo tungkol kay Jesus, isinalin dito bilang titulong “ang Anak ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: senturyon
  rationale: Karaniwang katawagan sa Filipino para sa Romanong opisyal-militar na namumuno sa humigit-kumulang isang daang kawal; mas tiyak kaysa sa pangkalahatang “kapitan.”
- source_word: τηροῦντες
  choice: nagbabantay
  rationale: Sa tagpo ng pagbitay, tumutukoy ito sa pagbabantay kay Jesus, hindi lamang sa pagmamasid.
- source_word: ἰδόντες
  choice: nang makita
  rationale: Ipinapahayag nang natural sa Filipino ang temporal na kaugnayan ng aorist participle sa pangunahing pandiwa.
- source_word: σεισμόν
  choice: lindol
  rationale: Payak at karaniwang katumbas ng σεισμός sa kontekstong ito.
- source_word: τὰ γενόμενα
  choice: ang mga nangyari
  rationale: Pinananatili ang malawak at maramihang pagtukoy sa mga pangyayaring nakapaligid sa kamatayan ni Jesus, hindi lamang sa lindol.
- source_word: ἐφοβήθησαν σφόδρα
  choice: labis silang natakot
  rationale: Natural na modernong Filipino na nagpapanatili sa matinding lakas ng σφόδρα.
- source_word: Ἀληθῶς
  choice: Tunay ngang
  rationale: Nagpapahayag ng mariin at taimtim na pagkilala nang hindi dinaragdagan ang teolohikal na katiyakan ng mga nagsasalita.
- source_word: θεοῦ υἱὸς
  choice: ang Anak ng Diyos
  rationale: Bagaman walang artikulo ang pariralang Griyego, sinusuportahan ng predicative construction at ng gamit ni Mateo ang tiyak o titularyong kahulugan. Inilalagay sa talababa ang posibleng di-tiyak na pagbasa.
- source_word: οὗτος
  choice: ito
  rationale: Direktang pinananatili ang demonstratibong anyo at ang agarang pagtukoy kay Jesus.
theological_decisions:
- issue: Kahulugan ng θεοῦ υἱὸς sa pahayag ng senturyon at ng mga kasama niya
  choice: ang Anak ng Diyos
  alternative: isang anak ng Diyos
  rationale: Sa kabuuang salaysay ni Mateo, ang “Anak ng Diyos” ay isang mahalagang titulo para kay Jesus. Gayunman, dahil walang artikulo ang pariralang Griyego at maaaring pagtalunan ang pagiging tiyak nito, pinananatili sa talababa ang alternatibong pagbasa sa halip na ikubli ang tensiyong interpretatibo.
- issue: Sino ang nagsalita ayon sa maramihang λέγοντες
  choice: at sinabi
  alternative: at sinabi nila
  rationale: Ang maramihang participle ay tumutukoy sa senturyon kasama ng mga kawal. Sa Filipino, ang “sinabi” pagkatapos ng maramihang simuno ay likas na sumasaklaw sa buong pangkat nang hindi nangangailangan ng inuulit na panghalip.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa publikong pagbasa. Ginamit ang “senturyon” bilang tiyak at nakasanayang terminong biblikal; iniwasan ang labis na pormal o lipas na ayos ng pangungusap.
