  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: tl
  text: Ngunit hinikayat ng mga punong pari at ng mga nakatatanda ang mga pulutong na hilingin si Barabas at ipapatay si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “puksain si Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinapakita nito ang pagsalungat sa naunang pangyayari; natural na katumbas sa Filipino ang “Ngunit.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ito sa pangkat ng mga nangungunang pari sa Jerusalem, hindi lamang sa isang mataas na pari.
- source_word: πρεσβύτεροι
  choice: mga matatandang pinuno
  rationale: Nililinaw ng “pinuno” na ang tinutukoy ay mga kinikilalang lider ng bayan, habang pinananatili ng “matatanda” ang historikal na diwa ng salita.
- source_word: ἔπεισαν
  choice: hinikayat
  rationale: Ipinahihiwatig nito ang matagumpay na pag-impluwensiya sa mga tao nang hindi ipinapalagay na lubos silang nakumbinsi sa isip.
- source_word: ὄχλους
  choice: mga pulutong ng tao
  rationale: Pinananatili nito ang maramihang anyo at ang larawan ng mga nagkakatipong grupo ng mga tao.
- source_word: ἵνα
  choice: na
  rationale: Pagkatapos ng pandiwa ng paghikayat, natural na ipinakikilala ng “na” ang nais nilang ipagawa sa mga tao.
- source_word: αἰτήσωνται
  choice: hingin nila
  rationale: Likas sa Filipino ang “hingin” kapag isang tao ang hinihiling na ibigay o palayain; isinasaad ng “nila” ang tahasang gumagawa ng kilos.
- source_word: Βαραββᾶν
  choice: Baribas
  rationale: Isinasa-Filipino ang baybay ng pangalang pantangi ayon sa karaniwang anyo sa mga saling Tagalog.
- source_word: ἀπολέσωσιν
  choice: puksain
  rationale: Pinananatili ng “puksain” ang malawak at matinding diwa ng pagwasak o pagpapahamak hanggang sa kamatayan, sa halip na agad paliitin ito sa teknikal na wikang panghukuman.
- source_word: τὸν δὲ Ἰησοῦν
  choice: ngunit puksain si Jesus
  rationale: Ang ikalawang “ngunit” ay malinaw na naghaharap ng magkasalungat na nais para kay Barabas at kay Jesus.
theological_decisions:
- issue: Kahulugan ng ἀπολέσωσιν sa konteksto ng paghatol at pagbitay
  choice: puksain si Jesus
  alternative: ipapatay si Jesus
  rationale: Mas malawak ang pandiwang Griyego kaysa sa isang teknikal na salita para sa pagbitay at maaaring mangahulugang wasakin o hayaang mapahamak. Pinananatili sa teksto ang lawak na iyon, habang ibinibigay sa talababa ang mas tahasang kahulugang hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga matatandang pinuno” upang maunawaan ang institusyonal na papel ng πρεσβύτεροι, at “mga pulutong ng tao” upang mapanatili ang maramihang anyo ng ὄχλους.
