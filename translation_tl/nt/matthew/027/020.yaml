  naturalness: Mas natural at marangal sa modernong Filipino ang “mga nakatatanda” para sa institusyonal na πρεσβύτεροι kaysa “mga matatandang pinuno.” Ang “ipapatay si Jesus” ay malinaw at angkop sa kontekstong hudisyal; pinananatili ng talababa ang mas malawak na leksikal na posibilidad.
