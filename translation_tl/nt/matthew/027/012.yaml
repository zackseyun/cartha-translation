- from: At habang inaakusahan siya ng mga punong pari at mga nakatatanda, hindi siya sumagot ng anuman.[a]
  to: At habang inaakusahan siya ng mga punong pari at mga matatanda, hindi siya sumagot ng anuman.[a]
  rationale: Pinalitan ang “mga nakatatanda” ng mas karaniwan at institusyonal na “mga matatanda,” habang pinananatili ang kahulugan ng πρεσβυτέρων. Inayos din ang pambungad ng talababa sa mas natural na Filipino. Walang binago sa kahulugan o sa antas ng katiyakan ng talata.
