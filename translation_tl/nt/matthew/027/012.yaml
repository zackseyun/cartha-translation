  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: tl
  text: At habang inaakusahan siya ng mga punong pari at mga matatanda, hindi siya sumagot ng anuman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “wala siyang isinagot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: habang inaakusahan siya
  rationale: Ang ἐν na sinusundan ng articular present infinitive ay nagpapahayag ng kilos na kasabay at nagpapatuloy; natural itong naihahayag sa Tagalog sa pamamagitan ng “habang,” at napananatili ng “inaakusahan” ang diwang pasibo at nagpapatuloy.
- source_word: κατηγορεῖσθαι
  choice: inaakusahan
  rationale: Tumutukoy ito sa paghaharap ng mga paratang laban kay Jesus. Ang “inaakusahan” ang karaniwan at malinaw na salin sa kontekstong legal.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: ng mga punong pari at mga nakatatanda
  rationale: Ang ἀρχιερεῖς ay tumutukoy sa mga pinuno ng mga pari, kaya “mga punong pari” ang nakaugaliang tumpak na salin. Ang “mga nakatatanda” ay likas na katawagan sa mga elder na kabilang sa pamunuang Judio.
- source_word: οὐδὲν
  choice: ng anuman
  rationale: Gumaganap itong layon ng pandiwang “sumagot” at nangangahulugang walang anumang sagot; pinananatili ng parirala ang tuwirang anyo ng Griyego.
- source_word: ἀπεκρίνατο
  choice: sumagot
  rationale: Ang aorist middle deponent ay payak na nangangahulugang “sumagot.” Kasama ng οὐδέν, natural itong mababasa bilang “hindi siya sumagot ng anuman.”
- source_word: καὶ
  choice: At
  rationale: Ipinagpapatuloy nito ang salaysay nang hindi nagdaragdag ng pagsalungat na hindi tahasang nasa Griyego.
theological_decisions:
- issue: Ang pananahimik ni Jesus sa harap ng mga nag-aakusa sa kanya
  choice: Inilahad nang payak na hindi siya sumagot ng anuman.
  alternative: Gumamit ng mas interpretatibong pananalita na tahasang nagpapahiwatig ng katuparan ng Isaias 53.
  rationale: Iniuulat ng talata ang pananahimik ni Jesus ngunit hindi nito tahasang binabanggit ang katuparan ng propesiya. Kaya hindi idinagdag sa salin ang gayong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “habang” upang natural na ipahayag ang kasabay na kilos, at ang “hindi siya sumagot ng anuman” upang mapanatili ang tuwirang lakas ng οὐδὲν ἀπεκρίνατο. Inilagay ang talababa sa sugnay na aktuwal nitong nililinaw.
