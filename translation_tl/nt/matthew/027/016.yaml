base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: tl
  text: Noong panahong iyon, mayroon silang isang bilanggo na bantog sa kasamaan na tinatawag na Jesus Barabbas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “Barabbas” lamang ang mababasa; wala ang “Jesus.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: mayroon silang
  rationale: Pinananatili ang di-tiyak na pangmaramihang simuno at ang diwa ng pagkakaroon o pag-iingat sa bilanggo, sa halip na gawing simpleng 'may isang bilanggo.'
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito; sapat na sa natural na daloy ng salaysay sa Filipino ang pagsisimula sa pariralang temporal, at ang tahasang 'ngunit' o 'at' ay maaaring magbigay ng labis na diin.
- source_word: τότε
  choice: Noong panahong iyon
  rationale: Malinaw at likas na ipinapahayag ang tiyak na sangguniang temporal ng τότε.
- source_word: δέσμιον
  choice: bilanggo
  rationale: Karaniwan, malinaw, at angkop sa konteksto ng isang taong nasa kustodiya.
- source_word: ἐπίσημον
  choice: bantog sa kasamaan
  rationale: Ipinapahayag ang pagiging kilala sa masamang diwa na malamang na taglay ng salita sa kontekstong ito, nang hindi ginagamit ang mas kolokyal na 'notoryus.'
- source_word: λεγόμενον
  choice: tinatawag na
  rationale: Likas na katumbas kapag nagpapakilala ng pangalan o katawagan.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jesus Barabbas
  rationale: Tuwirang sinusunod ang anyo ng pangalang nasa SBLGNT; ang mas maikling tekstuwal na anyo ay inilalagay sa talababa.
theological_decisions:
- issue: Tekstuwal na anyo ng buong pangalan ni Barabbas
  choice: 'Isinama sa pangunahing teksto ang ''Jesus'': ''Jesus Barabbas.'''
  alternative: Barabbas lamang, na walang 'Jesus'
  rationale: Binabasa ng ibinigay na SBLGNT ang Ἰησοῦν Βαραββᾶν. Pinananatili sa talababa ang mahalagang alternatibong pagbasa sa mga manuskrito sa halip na tahimik itong piliin o alisin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'bantog sa kasamaan' upang ihatid ang negatibong diwa ng ἐπίσημον sa paraang madaling maunawaan at hindi sobrang kolokyal. Ang panandang [a] ay nakalagay agad pagkatapos ng pangalang tinutukoy.
