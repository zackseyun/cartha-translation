  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: tl
  text: Sinabi sa kanila ni Pilato, “Kung gayon, ano ang gagawin ko kay Jesus na tinatawag na Mesiyas[a]?” Sumagot silang lahat, “Ipakrus siya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: Ibinibigay ang tradisyonal na alternatibong salin ng titulong Χριστός.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Kung gayon, ano ang gagawin ko
  rationale: Ang aorist subjunctive na ποιήσω ay ginagamit sa isang deliberative na tanong. Likas itong ipahayag sa Filipino bilang “ano ang gagawin ko,” habang ang “kung gayon” ay naghahatid sa inferential na diwa ng οὖν.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng personal na pangalang ito sa modernong Filipino.
- source_word: τὸν λεγόμενον χριστόν
  choice: na tinatawag na Mesiyas
  rationale: Ang λεγόμενον ay attributive present passive participle, kaya ang “na tinatawag na” ay nagpapanatili sa pasibong diwa nito. Dito, ang Χριστός ay gumaganap bilang titulo, kaya “Mesiyas” ang ginamit upang maipahayag ang kahulugang Judio-mesiyaniko nito.
- source_word: λέγουσιν πάντες
  choice: Sumagot silang lahat
  rationale: Isinalin sa nakaraang panahon ang historical present para sa likas na salaysay sa Filipino. Ang “sumagot” ay angkop sa palitan ng tanong at sagot, at pinananatili ng “silang lahat” ang kolektibong diin ng πάντες.
- source_word: Σταυρωθήτω
  choice: Ipako siya sa krus!
  rationale: Ang pandiwang patient-focus na “ipako” ay natural na pautos sa Filipino at nananatiling nakatuon sa taong tatanggap ng kilos, kaayon ng aorist passive imperative. Ang tandang padamdam ay nagpapakita ng mariing sigaw ng karamihan nang hindi nagdaragdag ng nilalaman.
theological_decisions:
- issue: Pagkakasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang ito, ang Χριστός ay malinaw na titulo—“na tinatawag na Mesiyas”—sa halip na bahagi lamang ng pangalan ni Jesus. Isinalin ang kahulugan ng titulo, habang inilagay sa talababa ang tradisyonal na anyong “Cristo.”
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Kung gayon” para sa lohikal na daloy ng tanong at ang tuwirang pautos na “Ipako siya sa krus!” para sa lakas ng tugon ng buong karamihan.
