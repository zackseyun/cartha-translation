  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: tl
  text: At nang makarating sila sa isang lugar na tinatawag na Golgota, na ang ibig sabihin ay “Lugar ng Bungo,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “na tinatawag na Lugar ng Bungo.” Ang Griyego ay nagbibigay ng paliwanag sa pangalang Golgota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: pagdating nila
  rationale: Likas na ipinapahayag sa Tagalog ang pansamantalang diwa ng aorist participle at napapanatili ang daloy ng salaysay.
- source_word: τόπον
  choice: isang lugar
  rationale: Karaniwang kahulugan ng τόπος ang “lugar,” at ang “isang” ay angkop sa anyong walang pantukoy sa Griyego.
- source_word: λεγόμενον
  choice: tinatawag na
  rationale: Sa idyomang ito, nangangahulugan ang participle na ang lugar ay tinatawag o pinangalanang gayon.
- source_word: Γολγοθᾶ
  choice: Golgota
  rationale: Isinalin sa karaniwang transliterasyong Tagalog ang pangalan ng lugar sa halip na isalin ang pangalan mismo.
- source_word: ὅ ἐστιν
  choice: na ang ibig sabihin ay
  rationale: Malinaw nitong naihahatid na ang kasunod ay paliwanag sa kahulugan ng pangalang Golgota, hindi lamang isang payak na pagtutumbas.
- source_word: Κρανίου Τόπος
  choice: Lugar ng Bungo
  rationale: Tuwirang isinasalin ang genitibong parirala bilang pangalan o tawag sa lugar; hindi pinipilit ng Tagalog na tukuyin kung “isang bungo” o “ang bungo.”
- source_word: λεγόμενος
  choice: ibig sabihin ay
  rationale: Sa paliwanag ng pangalan, mas natural sa Tagalog na ihatid ang explanatory gloss kaysa ulitin nang alanganin ang “tinatawag na.”
