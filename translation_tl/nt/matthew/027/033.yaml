translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang “pagdating nila” para sa natural na daloy ng salaysay at pinanatili ang paliwanag sa pangalang Golgota. Ang “Lugar ng Bungo” ay sadyang hindi nilagyan ng “isang” o “ang” upang hindi magpasok ng katiyakang hindi malinaw sa pariralang Griyego.
