id: MAT.27.19
reference: Matthew 27:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: tl
  text: Habang nakaupo siya sa luklukan ng hukom, nagpasabi sa kanya ang kanyang asawa, “Huwag kang magkaroon ng anumang kinalaman sa taong matuwid[a] na iyan, sapagkat labis akong nagdusa ngayon sa isang panaginip dahil sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang sala.” Ang salitang Griyego ay maaaring mangahulugang “matuwid,” “makatarungan,” o, sa konteksto ng paglilitis, “walang sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Habang nakaupo siya
  rationale: Ang genitive absolute na may present participle ay nagsasaad ng kasabay at nagpapatuloy na kalagayan; likas itong ipinahahayag sa Filipino sa pamamagitan ng “habang.”
- source_word: ἐπὶ τοῦ βήματος
  choice: sa luklukan ng hukom
  rationale: Sa kontekstong ito, ang βῆμα ay opisyal na upuang pinagmumulan ng paghatol. Iniiwasan ng salin ang di-pamilyar na “tribunal” habang pinananatili ang hudisyal na diwa.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ
  choice: nagpasabi sa kanya ang kanyang asawa
  rationale: Ipinahihiwatig ng parirala ang pagpapadala ng mensahe sa pamamagitan ng iba; ang “nagpasabi” ay maikli at likas sa modernong Filipino.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Huwag kang magkaroon ng anumang kinalaman sa taong matuwid na iyan
  rationale: Ang eliptikong idyoma ay babala na huwag makisangkot o gumawa ng anuman laban sa taong tinutukoy. Pinananatili ng “anumang kinalaman” ang lawak ng orihinal nang hindi ipinapalagay ang tiyak na uri ng pagkilos.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: sa taong matuwid na iyan
  rationale: Karaniwang kahulugan ng δίκαιος ang “matuwid” o “makatarungan.” Sa konteksto ng paglilitis, maaari rin itong mangahulugang “walang sala,” kaya inilagay ang alternatibo sa talababa.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον
  choice: sapagkat labis akong nagdusa ngayon
  rationale: Ang πολλὰ πάσχω ay idyomang nangangahulugang labis na pagdurusa. Ang aorist ay isinalin sa payak na naganap na anyo, at ang σήμερον ay likas na “ngayon” sa Filipino.
- source_word: κατ’ ὄναρ δι’ αὐτόν
  choice: sa isang panaginip dahil sa kanya
  rationale: 'Ang κατ’ ὄναρ ay karaniwang ekspresyon para sa karanasan sa panaginip, samantalang ang διά na may accusative ay nagsasaad ng sanhi: “dahil sa kanya.”'
theological_decisions:
- issue: Kahulugan ng δίκαιος bilang paglalarawan kay Jesus
  choice: taong matuwid
  alternative: taong walang sala
  rationale: Pinananatili ng “matuwid” ang moral at teolohikal na bigat ng δίκαιος sa Mateo, sa halip na paliitin ito sa legal na kawalang-sala lamang. Gayunman, tunay na posible ang legal na diwang “walang sala” sa tagpo ng paglilitis, kaya malinaw itong itinala bilang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “luklukan ng hukom” upang malinaw na maipakita ang opisyal na lugar ng paghatol, at ang “nagpasabi” upang likas na ipahayag ang mensaheng ipinadala sa pamamagitan ng isang tagapagdala.
