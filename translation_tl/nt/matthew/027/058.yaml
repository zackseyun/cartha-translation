  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: tl
  text: Lumapit siya kay Pilato at hiningi ang katawan ni Jesus. Pagkatapos, iniutos ni Pilato na ibigay iyon sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: siya
  rationale: Tumutukoy ang demonstratibo kay Jose ng Arimatea sa naunang talata; natural sa salaysay na Tagalog ang panghalip na “siya” kapag malinaw ang tinutukoy.
- source_word: προσελθὼν
  choice: lumapit kay
  rationale: Ipinahihiwatig ng aorist participle ang paglapit kay Pilato bago ang paghiling; tuwiran at natural ang “lumapit kay.”
- source_word: ᾐτήσατο
  choice: hiningi
  rationale: Sa kontekstong ito, ang αἰτέω ay paghiling na maibigay ang isang bagay. Ang “hiningi” ay malinaw at idiomatiko sa Tagalog.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: ang katawan ni Jesus
  rationale: Pinananatili ng “katawan” ang karaniwang kahulugan ng σῶμα nang hindi gumagamit ng mas klinikal na “bangkay.”
- source_word: τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural dito ang “Pagkatapos.”
- source_word: ἐκέλευσεν
  choice: iniutos
  rationale: Ipinapahayag ng κελεύω ang pagbibigay ng utos, na angkop sa kapangyarihang administratibo ni Pilato.
- source_word: ἀποδοθῆναι
  choice: na ibigay iyon sa kanya
  rationale: Ang passive infinitive ay tumutukoy sa pagpapahintulot na mailipat ang katawan kay Jose. Ginagawang malinaw ng “iyon” at “sa kanya” ang mga ipinahihiwatig na layon at tatanggap, nang hindi isinasalin bilang “ibalik,” na maaaring magdagdag ng di-tiyak na diwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “katawan” sa halip na “bangkay” upang manatiling malapit sa Griyego at maiwasan ang hindi kailangang klinikal o marahas na tono.
