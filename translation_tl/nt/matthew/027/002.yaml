  naturalness: Likas at marangal sa modernong Filipino Tagalog ang “Matapos nila siyang gapusin, inakay nila siya palayo at ibinigay kay Pilato, ang gobernador.” Mas malinaw ang appositive na “ang gobernador” kaysa “na gobernador.”
  terminology: Pinananatili ang nakaugaliang “Pilato” at ang malawak na katumbas na “gobernador” para sa ἡγεμών. Hindi dinaragdagan ng salin ang anumang teolohikal o panghukom na pagpapakahulugan.
