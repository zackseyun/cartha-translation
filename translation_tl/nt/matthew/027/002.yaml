  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: tl
  text: At matapos nila siyang gapusin[a], inakay nila siya palayo at ibinigay kay Pilato, ang gobernador.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matapos siyang gapusin.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinasa kay Pilato, ang gobernador.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: matapos nila siyang gapusin
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa mga pangunahing pandiwa. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang kongkretong diwa ng pagtatali.
- source_word: ἀπήγαγον
  choice: dinala nila siya
  rationale: Ang ἀπάγω ay nangangahulugang akayin o dalhin palayo. Sa konteksto ng isang taong nasa kustodiya, malinaw at natural ang “dinala nila siya”; hindi na kailangang idagdag ang “palayo,” na maaaring maging mabigat sa pangungusap.
- source_word: παρέδωκαν
  choice: ibinigay
  rationale: Dito, ang παραδίδωμι ay tumutukoy sa pagbibigay ng isang tao sa kustodiya o kapangyarihan ng iba. Ang “ibinigay” ay malinaw sa ordinaryong Tagalog at hindi nagdaragdag ng interpretasyong wala sa teksto.
- source_word: Πιλάτῳ
  choice: Pilato
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng personal na pangalang Pilate.
- source_word: ἡγεμόνι
  choice: gobernador
  rationale: Ang ἡγεμών ay isang opisyal na namamahala. Ang “gobernador” ay madaling maunawaan at hindi kasing-tiyak ng “prefekto,” kaya mas malapit sa saklaw ng salitang Griyego.
- source_word: καὶ δήσαντες αὐτὸν
  choice: At matapos nila siyang gapusin
  rationale: Pinanatili ang panimulang καί bilang “At” para sa daloy ng salaysay, at tahasang isinalin ang αὐτόν bilang “siya.”
- source_word: καὶ παρέδωκαν
  choice: at ibinigay
  rationale: Pinanatili ang koordinasyon ng ikalawang καί. Hindi na inulit ang simuno sapagkat malinaw ito at mas natural ang ganitong ayos sa Tagalog.
theological_decisions:
- issue: Pagkakasalin ng παραδίδωμι sa salaysay ng paghihirap ni Jesus
  choice: ibinigay
  alternative: ipinaubaya
  rationale: Pinananatili ng “ibinigay” ang agarang diwa ng pagsasalin kay Jesus sa awtoridad ni Pilato nang hindi nilulutas o inaalis ang mas malawak na teolohikal na alingawngaw ng pandiwa. Posible ang “ipinaubaya,” ngunit maaari itong magpahiwatig ng mas kusang pagpapabaya kaysa sa malinaw na sinasabi ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “gapusin” sa halip na mas kolokyal na “talian,” at “gobernador” sa halip na teknikal na “prefekto.” Ang mga marker na [a] at [b] ay kapuwa lumilitaw sa pangunahing teksto.
