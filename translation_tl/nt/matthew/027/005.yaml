base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: tl
  text: At pagkahagis niya ng mga salaping pilak sa loob ng templo[a], umalis siya[b], at saka nagbigti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa loob ng santuwaryo.” Ang salitang Griyego na ginamit dito ay naos, na madalas tumukoy sa mismong santuwaryo, hindi sa buong kompleks ng templo.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “umalis siya, at pag-alis niya ay nagbigti.” Dalawang magkahiwalay na anyo ng pandiwang nagsasaad ng pag-alis o pagyaon ang ginamit sa Griyego.'
    reason: source_form
lexical_decisions:
- source_word: ῥίψας
  choice: pagkahagis niya
  rationale: Ipinahihiwatig ng aorist participle ang kilos na nauna sa pag-alis. Ang “pagkahagis niya” ay likas sa Filipino at malinaw ang pagkakasunod-sunod ng mga pangyayari.
- source_word: τὰ ἀργύρια
  choice: mga salaping pilak
  rationale: Tumutukoy ang pangmaramihang ἀργύρια sa mga piraso o salaping yari sa pilak na ibinalik ni Judas. Mas natural at tiyak sa Filipino ang “mga salaping pilak” kaysa sa “mga pilak,” nang hindi binabanggit sa talata ang bilang.
- source_word: εἰς τὸν ναόν
  choice: sa loob ng templo
  rationale: Ipinakikita ng εἰς ang paghagis papasok. Karaniwang tumutukoy ang ναός sa santuwaryo o gusaling banal mismo, ngunit pinanatili sa pangunahing teksto ang mas madaling maunawaang “templo,” na may paglilinaw sa talababa.
- source_word: ἀνεχώρησεν
  choice: umalis siya
  rationale: Ang pandiwa ay nangangahulugang umalis o lumayo. Ang “umalis siya” ay malinaw, natural, at angkop sa marangal na salaysay.
- source_word: ἀπελθὼν
  choice: at saka
  rationale: Ang participle na ito ay literal na nagsasaad ng pagyaon o pag-alis bago ang pagbibigti. Sa Filipino, magiging mabigat at paulit-ulit ang dalawang magkasunod na katumbas ng “umalis”; ipinahahayag ng “at saka” ang pagkakasunod ng kilos, habang iniingatan sa talababa ang mas literal na anyo.
- source_word: ἀπήγξατο
  choice: nagbigti
  rationale: Ang middle form ay nagsasaad ng kilos na ginawa niya sa sarili. Sa kontekstong ito, ang “nagbigti” ang malinaw at karaniwang katumbas sa Filipino ng pagpapakamatay sa pamamagitan ng pagbitin sa sarili.
theological_decisions:
- issue: Tiyak na saklaw ng ναός kumpara sa mas malawak na kompleks ng templo
  choice: “templo” sa pangunahing teksto, na may “santuwaryo” bilang paliwanag sa talababa
  alternative: “santuwaryo” o “gusali ng santuwaryo” sa pangunahing teksto
  rationale: Madalas tumukoy ang ναός sa mismong santuwaryo at hindi sa buong bakuran ng templo. Pinananatili ng pangunahing teksto ang madaling maunawaang katawagan, habang hindi nawawala ang mas tiyak na kahulugang arkitektural.
- issue: Dalawang magkasunod na pandiwa ng pag-alis
  choice: Isinalin ang ἀνεχώρησεν bilang “umalis siya” at ipinahiwatig sa “at saka” ang pagkakasunod na dala ng ἀπελθών
  alternative: “umalis siya, at pag-alis niya ay nagbigti”
  rationale: Pinananatili nito ang daloy at pagkakasunod ng Griyego nang hindi lumilikha ng di-likas na pag-uulit sa Filipino. Inilalagay sa talababa ang higit na literal na anyo upang makita ang ikalawang pahayag ng pagyaon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga salaping pilak” para sa likas na pagpapahayag, “sa loob ng templo” upang maipakita ang direksiyong papasok, at “nagbigti” bilang tuwiran at hindi malabong paglalarawan sa kilos.
