  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: tl
  text: At matapos nila siyang hubaran, sinuotan nila siya ng iskarlatang balabal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “iskarlatang roba.” Ang salitang Griyego ay maaari ring tumukoy nang mas malawak sa isang panlabas na kasuotan o balabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Tuwirang pinananatili ang pang-ugnay na καί at ang pagpapatuloy ng salaysay.
- source_word: ἐκδύσαντες
  choice: matapos nila siyang hubaran
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na nauna sa pangunahing pandiwa; likas itong naipahahayag sa Filipino sa pariralang “matapos nila siyang hubaran.”
- source_word: χλαμύδα
  choice: balabal
  rationale: Ang χλαμύς ay isang panlabas na kasuotan o maikling balabal, na madalas iugnay sa mga kawal o opisyal. Ang “balabal” ay tuwiran at hindi nagdaragdag ng maharlikang kahulugang wala mismo sa salita.
- source_word: κοκκίνην
  choice: kulay-iskarlata
  rationale: Ang κόκκινος ay matingkad na pulang kulay, partikular na iskarlata. Pinananatili ng “kulay-iskarlata” ang espesipikong kulay sa halip na gawing pangkalahatang “pula.”
- source_word: περιέθηκαν αὐτῷ
  choice: sinuotan nila siya ng
  rationale: Sa kontekstong ito, ang περιτίθημι na may datibo ay nangangahulugang maglagay o magsuot ng isang bagay sa isang tao. Ang “sinuotan nila siya ng” ay natural sa Filipino at malinaw na naghahatid ng kilos.
theological_decisions:
- issue: Uri ng kasuotang ginamit sa pangungutya kay Jesus
  choice: balabal na kulay-iskarlata
  alternative: panlabas na damit na kulay-iskarlata
  rationale: Inilalarawan ng talata ang kunwaring pagbibihis kay Jesus ng mga kawal. Pinananatili ng “balabal” ang karaniwang leksikal na diwa ng χλαμύς nang hindi ipinapasok ang higit na tiyak na maharlikang pahiwatig ng ibang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kulay-iskarlata” upang mapanatili ang espesipikong kulay ng Griyego, habang nililinaw sa talababa ang mas malawak na saklaw ng katawagan sa kasuotan.
