  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: tl
  text: 'At inilagay nila sa itaas ng kanyang ulo ang sakdal laban sa kanya[a], na nakasulat: “Ito si Jesus, ang Hari ng mga Judio[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang paratang laban sa kanya.” May diwang legal dito ang salitang Griyego na αἰτίαν.
    reason: lexical_alternative
  - marker: b
    text: O “ang Hari ng mga taga-Judea.” Maaaring mangahulugan ang Griyegong Ἰουδαίων ng “mga Judio” o “mga taga-Judea,” depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: inilagay nila
  rationale: Tuwirang ipinahahayag ang pisikal na paglalagay ng nakasulat na paratang; natural ito sa makabagong Tagalog.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: sa itaas ng kanyang ulo
  rationale: Pinananatili ang lokasyong ipinahihiwatig ng ἐπάνω na may genitive, nang hindi nagpapahiwatig na nakapatong mismo sa ulo.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: ang sakdal laban sa kanya
  rationale: Ang “sakdal” ay malinaw na terminong legal sa Tagalog at naipapahayag ang hudisyal na diwa ng αἰτία sa konteksto.
- source_word: γεγραμμένην
  choice: na nakasulat
  rationale: Natural na inilalarawan ang sakdal bilang nakasulat, habang pinananatili ang resulta ng perfect passive participle.
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: Ito si Jesus
  rationale: Ito ang tuwiran at natural na anyo sa Tagalog para sa demonstrative, copula, at personal na pangalan.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  rationale: Pinananatili ang maharlikang titulo at ang nakaugaliang pagtukoy sa pangkat sa pormula ng paratang sa pagpapako sa krus.
theological_decisions:
- issue: Legal na diwa ng αἰτία
  choice: sakdal laban sa kanya
  alternative: paratang laban sa kanya
  rationale: Mas tiyak na naipahahayag ng “sakdal” ang pormal at hudisyal na batayan ng paghatol, nang hindi nagdaragdag ng teolohikal na interpretasyon.
- issue: Saklaw ng Ἰουδαίων
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Sa pormula ng maharlika at pampolitikang paratang, “mga Judio” ang nakaugaliang at angkop na pagbasa; gayunman, maaaring tumukoy ang salitang Griyego sa mga taga-Judea, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sakdal” upang mapanatili ang legal na puwersa ng teksto, at “mga Judio” bilang natural at kinikilalang katawagan. Inilagay ang [b] pagkatapos ng buong sipi upang malinaw na tumutukoy ito sa alternatibong salin ng “mga Judio.”
