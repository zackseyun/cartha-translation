    issue: Hindi sapat ang pagtukoy sa mga kamay ni Pilato.
    rationale: Ang ἀπενίψατο τὰς χεῖρας ay tumutukoy sa paghuhugas niya ng sarili niyang mga kamay. Ang “naghugas ng mga kamay” ay maaaring basahing pangkalahatang paghuhugas o paghuhugas ng mga kamay ng iba.
  - severity: medium
    issue: Masyadong malawak ang “Kayo na ang bahala.”
    rationale: 'Ang ὑμεῖς ὄψεσθε ay maaaring literal na “kayo ang makakakita,” ngunit sa konteksto ay isang idyomatikong pagpapaubaya: sila ang tumingin o humawak sa usapin. Ang “Kayo na ang tumingin dito” ay mas malapit at likas.'
  - severity: low
    issue: Ang “nagkakagulo ang mga tao” ay bahagyang inililipat ang diin mula sa umuusbong na kaguluhan tungo sa kilos ng mga tao.
    rationale: Ang θόρυβος γίνεται ay mas tuwirang “nagkakaroon ng kaguluhan” o “may namumuong gulo.”
