source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: tl
  text: Nang makita ni Pilato na wala siyang nagagawa at sa halip ay lalo pang nagkakaroon ng kaguluhan,[a] kumuha siya ng tubig at naghugas ng kaniyang mga kamay sa harap ng maraming tao. Sinabi niya, “Wala akong sala sa dugong ito.[b] Kayo na ang tumingin dito.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa halip ay may namumuong gulo” o “lalo pang lumalala ang kaguluhan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Wala akong sala mula sa dugong ito.” Ang “dugo” rito ay idyomang tumutukoy sa pananagutan sa pagkamatay ng isang tao.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “Kayo ang makakakita.” Sa kontekstong ito, maaari itong mangahulugang “kayo na ang tumingin dito” o “kayo na ang managot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Nang makita ni Pilato
  rationale: Ginawang likas sa salaysay na Tagalog ang aorist participle at ang banayad na paglipat na δέ; hindi kailangan ang tahasang “ngunit” sa puntong ito.
- source_word: οὐδὲν ὠφελεῖ
  choice: wala siyang nagagawa
  rationale: Ipinahihiwatig ng parirala na hindi nagbubunga ang pagsisikap ni Pilato. Mas malinaw ito kaysa “wala siyang napapala,” na maaaring magpahiwatig ng pansariling pakinabang.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: at sa halip ay lalo pang nagkakagulo ang mga tao
  rationale: Ipinapahayag ang namumuong pampublikong kaguluhan at ang paglala na taglay ng μᾶλλον. Ang θόρυβος ay maaari ring tumukoy sa ingay, kaguluhan, o gulo na maaaring humantong sa pag-aalsa.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: kumuha siya ng tubig at naghugas ng mga kamay
  rationale: Likas na pinagsunod-sunod sa Tagalog ang dalawang kilos, habang pinananatili ang nakikitang simbolikong paghuhugas.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: sa harap ng maraming tao
  rationale: Ipinakikita na hayagang ginawa ni Pilato ang kilos sa presensiya ng nagkakatipong mga tao. Ang “maraming tao” ay karaniwang katumbas ng ὄχλος sa kontekstong ito.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Wala akong kasalanan sa dugong ito
  rationale: Pinananatili ang larawan ng “dugo” at ang pahayag ni Pilato na wala siyang sala o pananagutan sa kamatayan, nang hindi pinatutunayang tama ang kanyang sinabi.
- source_word: ὑμεῖς ὄψεσθε
  choice: Kayo na ang bahala
  rationale: Ang future middle na ito ay idyomatikong utos na sila ang tumingin o humawak sa usapin. Binibigyang-diin ng “kayo” ang tahasang ὑμεῖς; inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Ang pahayag ni Pilato na wala siyang kasalanan
  choice: Iniharap bilang sariling pahayag ni Pilato, hindi bilang hatol ng tagapagsalaysay na tunay siyang walang sala.
  alternative: 'Maaaring isalin nang higit na literal: “Wala akong sala mula sa dugong ito.”'
  rationale: 'Pinananatili nito ang moral at teolohikal na tensiyon: sinikap ni Pilato na itanggi ang pananagutan, ngunit hindi hinahatulan ng salin kung naging mabisa ang kanyang simbolikong kilos.'
- issue: Ang pananagutan ng mga tao sa ὑμεῖς ὄψεσθε
  choice: “Kayo na ang bahala,” na nagpapasa ng pag-asikaso at pananagutan ayon sa pahayag ni Pilato.
  alternative: “Kayo ang makakakita” o “Tingnan ninyo mismo.”
  rationale: Idyomatiko ang parirala sa konteksto, ngunit hindi dinaragdagan ng salin ang saklaw ng kolektibong pagkakasala lampas sa mga taong kausap ni Pilato.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang “nagkakagulo” at “kayo na ang bahala” para sa likas na daloy, habang pinanatili sa teksto at mga talababa ang legal na pahayag, idyoma ng dugo, at posibleng literal na pagbasa.
