  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: tl
  text: Ngunit muling sumigaw nang malakas si Jesus at ibinigay niya ang kanyang espiritu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nalagutan siya ng hininga.” Literal na sinasabi sa Griyego, “ibinigay ang espiritu,” isang idyoma para sa pagkamatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng pagpapatuloy na may banayad na pagsalungat o pagbabago sa daloy; natural dito ang “Ngunit.”
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinahihiwatig ng πάλιν ang pag-uulit; maikli at natural sa Filipino ang “muling.”
- source_word: κράξας
  choice: sumigaw
  rationale: Ang aorist participle ng κράζω ay tumutukoy sa malakas na pag-iyak o pagsigaw. Ang “sumigaw” ay malinaw at natural, at naikakabit sa pangunahing pandiwa sa pamamagitan ng “at.”
- source_word: φωνῇ μεγάλῃ
  choice: nang malakas
  rationale: Ang parirala ay nagsasaad ng paraan at binibigyang-diin ang lakas ng tinig; mas natural sa modernong Filipino ang “nang malakas” kaysa sa literal na “sa malakas na tinig.”
- source_word: ἀφῆκεν
  choice: ibinigay niya
  rationale: Sa idyomang kasama ang τὸ πνεῦμα, inilalarawan nito ang pagpanaw bilang pagbibigay o pagpapakawala ng espiritu. Pinananatili ng “ibinigay niya” ang aktibong anyo at larawan ng Griyego.
- source_word: τὸ πνεῦμα
  choice: ang kanyang espiritu
  rationale: Bagaman may artikulong “ang” sa Griyego, natural sa Filipino ang paggamit ng panghalip na paari sa ganitong pahayag. Pinananatili ng “espiritu” ang saklaw at teolohikal na bigat ng πνεῦμα nang hindi ito nililimitahan sa “hininga.”
theological_decisions:
- issue: Paglalarawan sa kamatayan sa idyomang ἀφῆκεν τὸ πνεῦμα
  choice: ibinigay niya ang kanyang espiritu
  alternative: nalagutan siya ng hininga
  rationale: Maaaring ipakahulugan ang idyoma bilang pagpanaw, ngunit ang “nalagutan siya ng hininga” ay inililipat ang πνεῦμα tungo sa “hininga” at ginagawang di-aktibo ang pahayag. Pinananatili ng napiling salin ang larawan, aktibong balarila, at posibleng teolohikal na pahiwatig ng orihinal nang hindi nagpapataw ng tiyak na doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “sumigaw nang malakas” para sa natural na daloy, habang pinanatili ang mas literal at makahulugang “ibinigay niya ang kanyang espiritu.”
