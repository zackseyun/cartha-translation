  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Pilato sa kanya, “Hindi mo ba naririnig kung gaano karaming bagay ang pinatototohanan[a] nila laban sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kung gaano karaming bagay ang pinagsasasaksihan nila laban sa iyo” o “kung gaano karaming bagay ang kanilang pinatotohanan laban sa iyo.” May diwang legal ang pandiwang Griyego: pagbibigay ng patotoo laban sa isang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa susunod na pangyayari sa salaysay; natural ito sa makabagong Filipino.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, karaniwang ginagamit sa natural na salaysay sa Filipino ang aspektong perpektibo para sa naganap na pagsasalita.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatiling panghalip ang tahasang panghalip sa Griyego sapagkat malinaw sa konteksto na si Jesus ang tinutukoy.
- source_word: ὁ Πιλᾶτος
  choice: ni Pilato
  rationale: Ang pantukoy sa Griyego ay hindi kailangang tumbasan bago ang pangalang pantangi; ipinahahayag ng “ni” ang tagaganap sa ayos ng pangungusap.
- source_word: Οὐκ ἀκούεις
  choice: Hindi mo ba naririnig
  rationale: Pinananatili ang anyong negatibong tanong at ang pangunahing diwa ng ἀκούω bilang aktuwal na pagdinig.
- source_word: πόσα
  choice: kung gaano karami
  rationale: Ipinahahayag ang dami ng mga bagay o pahayag na inihaharap nang hindi tahasang dinaragdagan ng salitang “paratang,” na wala sa Griyego.
- source_word: σου
  choice: laban sa iyo
  rationale: 'Sa pagkakaugnay nito sa καταμαρτυρέω, adversatibo ang diwa ng genitive: ang patotoo ay laban kay Jesus.'
- source_word: καταμαρτυροῦσιν
  choice: ipinapatotoo nila laban
  rationale: Pinananatili ang legal-forensic na diwa ng pagbibigay ng patotoo laban sa isang tao, sa halip na paliitin ito sa mas interpretatibong “inaakusahan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na aspektong pasalaysay sa Filipino habang pinananatili ang negatibong tanong at ang legal na himig ng pandiwa.
