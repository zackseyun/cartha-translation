translation:
  language: tl
  text: At nabuksan ang mga libingan, at ibinangon ang maraming katawan ng mga banal na nakatulog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nakakatulog” ay karaniwang matalinghagang pananalita para sa “namatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa salaysay at pinananatili ang payak na koordinasyon ng Griyego nang hindi dinaragdagan ng tiyak na temporal na diwa.
- source_word: τὰ μνημεῖα
  choice: ang mga libingan
  rationale: Karaniwang tumutukoy ang μνημεῖον sa lugar na pinaglibingan; malinaw at natural sa makabagong Filipino ang “mga libingan.”
- source_word: ἀνεῴχθησαν
  choice: nabuksan
  rationale: Ipinahahayag ng aorist passive na tumanggap ng kilos ang mga libingan; hindi nito dinaragdagan ang teksto ng paraan kung paano nabuksan ang mga iyon.
- source_word: πολλὰ σώματα
  choice: ang maraming katawan
  rationale: Pinananatili ng “mga katawan” ang neutral na kahulugan ng σώματα at iniiwasan ang mas mariing “mga bangkay.”
- source_word: τῶν κεκοιμημένων
  choice: na natutulog na sa kamatayan
  rationale: Pinananatili nito ang talinghaga ng pagtulog habang nililinaw sa karaniwang mambabasa na kamatayan ang tinutukoy.
- source_word: ἁγίων
  choice: ng mga banal
  rationale: Ang substantibong ἁγίων ay tumutukoy sa mga taong banal o nakatalaga sa Diyos; ang “mga banal” ay maikli at kinikilalang gamit sa Bagong Tipan.
- source_word: ἠγέρθησαν
  choice: ibinangon
  rationale: Tumpak itong passive na katumbas ng ἐγείρω sa konteksto ng kamatayan, ngunit hindi nito paunang tinutukoy kung anong uri ng muling pagkabuhay ang naganap.
theological_decisions:
- issue: Ang uri ng pangyayaring tinutukoy ng ἠγέρθησαν
  choice: ibinangon
  alternative: muling binuhay
  rationale: Pinananatili ng “ibinangon” ang malawak na saklaw ng pandiwang Griyego at ang tensiyong teolohikal; hindi nito ipinapasya sa talatang ito lamang kung ito ay pansamantalang pagbabalik sa buhay o ganap na pagkabuhay na muli.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkakaugnay na sugnay ng Griyego at ang talinghaga ng pagtulog, ngunit nilinaw ang kahulugan nito sa mismong parirala at talababa.
