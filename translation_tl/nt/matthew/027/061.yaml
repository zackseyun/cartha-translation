  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: tl
  text: Naroon sina Maria Magdalena at ang isa pang Maria, na nakaupo sa tapat ng libingan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: Naroon
  rationale: Ang anyong ito ay likas na nagpapahayag sa Tagalog ng presensiya ng mga babaeng kasunod na pinangalanan. Hindi na ginawang hiwalay na salita ang banayad na pang-ugnay na δὲ, sapagkat sapat na ang daloy ng salaysay at walang matinding pagsalungat dito.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Ito ang nakasanayan at malinaw na anyo ng pangalan sa Filipino, habang pinananatili ang pagkakakilanlan niya bilang Maria na taga-Magdala.
- source_word: ἡ ἄλλη Μαρία
  choice: ang isa pang Maria
  rationale: Tuwirang ipinakikita ng ἄλλη na ibang Maria ito kaysa kay Maria Magdalena; natural sa modernong Tagalog ang 'isa pang Maria.'
- source_word: καθήμεναι
  choice: na nakaupo
  rationale: Inilalarawan ng kasalukuyang participle ang kanilang patuloy na posisyon o tindig sa tagpo; malinaw at natural ang 'nakaupo.'
- source_word: ἀπέναντι τοῦ τάφου
  choice: sa tapat ng libingan
  rationale: Ang ἀπέναντι ay tumutukoy sa lokasyong kaharap o katapat, at ang τάφος sa kontekstong ito ay isang libingan. Ang pariralang 'sa tapat ng libingan' ay natural at tumpak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at natural. Pinanatili ang ayos ng tagpo at ang pagkakaupo ng dalawang Maria sa lugar na katapat ng libingan, nang walang idinagdag na interpretasyong teolohikal.
