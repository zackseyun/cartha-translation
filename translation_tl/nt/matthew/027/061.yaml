    issue: Gamit ng "si" para sa dalawang pinangalanang babae
    rationale: Sa modernong Tagalog, "si" ay para sa isahang pantanging pangngalan; "sina" ang ginagamit para sa dalawa o higit pang taong pinangalanan. Ang pagbabago ay nagpapalinaw na kapwa naroon ang dalawang Maria.
