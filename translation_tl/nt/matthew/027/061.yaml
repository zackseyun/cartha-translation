  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: kapwa naroon si Maria Magdalena at ang isa pang Maria, at nakaupo sila sa katapat ng libingan. Gayunman, ang "si" sa kasalukuyang pangungusap ay karaniwang pananda ng iisang pantanging pangalan, samantalang dalawang Maria ang magkatuwang na paksa. Ang "sina" ang wastong pananda para sa pinagsamang mga pangalang pantao at mas malinaw na tumutugma sa kahulugan ng Griyego.'
  naturalness: Natural ang "isa pang Maria," "nakaupo," at "sa tapat ng libingan." Mas natural at gramatikal ang "Naroon sina ..." kaysa "Naroon si ... at ..." kapag dalawang taong pinangalanan ang tinutukoy.
  terminology: Ang "Maria Magdalena" ay ang nakasanayang anyong Filipino. Ang "libingan" ay angkop na salin ng τάφος sa kontekstong ito at hindi nagpapasok ng dagdag na pagpapakahulugan.
  issues:
