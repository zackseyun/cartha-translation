base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: tl
  text: Sinabi niya, “Nagkasala ako dahil ipinagkanulo ko ang dugong walang sala.[a]” Ngunit sinabi nila, “Ano iyon sa amin? Ikaw na ang bahala riyan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “matapos kong ipagkanulo ang dugong walang sala.”'
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “Ikaw ang makakakita riyan.” Dito, ang anyong ito ay isang mapagtaboy na pananalita na nangangahulugang, “Ikaw na ang bahala riyan” o “Pananagutan mo iyan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Nagkasala ako
  rationale: Ang payak na aspektong naganap sa Filipino ay natural para sa tuwirang pag-amin at malinaw na ipinahahayag ang kasalanang nagawa nang hindi dinaragdagan ang diwa.
- source_word: παραδοὺς
  choice: dahil ipinagkanulo ko
  rationale: Maaaring ipahayag ng aorist participle ang sanhi o batayan ng pag-amin. Ang “ipinagkanulo” ay angkop sa ginawa ni Judas sa konteksto at mas tiyak dito kaysa sa literal na “ibinigay” o “ipinaubaya.”
- source_word: αἷμα ἀθῷον
  choice: dugong walang sala
  rationale: Pinananatili nito ang maikli at matinding biblikal na idyoma ng Griyego, pati ang pahiwatig ng pananagutan sa di-makatarungang kamatayan, nang hindi tahasang idinaragdag kung sino ang tinutukoy.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Ano iyon sa amin?
  rationale: Malapit ito sa anyo ng Griyego at natural na nagpapahayag ng pagwawalang-bahala at pagtangging managot.
- source_word: σὺ ὄψῃ
  choice: Ikaw na ang bahala riyan
  rationale: 'Ang future middle ng ὁράω ay ginagamit dito bilang matalim at mapagtaboy na idyoma: ang kausap mismo ang dapat humarap sa usapin. Ang salin ay natural sa modernong Filipino; inilalahad sa talababa ang mas literal na anyo.'
theological_decisions:
- issue: Kung tahasang tutukuyin na si Jesus o isang taong walang sala ang tinutukoy ng “dugong walang sala”
  choice: 'Panatilihing hindi tahasan ang tinutukoy: “dugong walang sala.”'
  alternative: “dugo ng isang taong walang sala” o “dugo ni Jesus na walang sala”
  rationale: Hindi tahasang pinapangalanan ng Griyego ang tinutukoy. Ang pagdaragdag ng “Jesus” o “isang tao” ay magpapaliwanag ngunit lalampas sa mismong pananalita at magpapahina sa biblikal na idyoma.
- issue: Kung ang σὺ ὄψῃ ay isasalin bilang literal na panghinaharap o bilang utos na nakapaloob sa idyoma
  choice: Isalin ang gamit nitong mapagtaboy na idyoma bilang “Ikaw na ang bahala riyan.”
  alternative: “Ikaw ang makakakita riyan” o “Ikaw ang tumingin diyan.”
  rationale: Bagaman panghinaharap ang anyong Griyego, sa konteksto ay ipinapasa nito kay Judas ang buong pananagutan. Pinananatili sa talababa ang literal na posibilidad upang hindi maitago ang anyo at bahagyang kalabuan ng pinagmulan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ipinagkanulo” dahil ito ang natural na salitang angkop sa konteksto ni Judas, samantalang pinanatili ang biblikal na idyomang “dugong walang sala.” Ang “Ikaw na ang bahala riyan” ay pangkaraniwan ngunit hindi magaspang na katumbas ng mariing pagtanggi sa pananagutan.
