  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: tl
  text: Kabilang sa kanila ay sina Maria Magdalena, Maria na ina nina Santiago at Jose[a], at ang ina ng mga anak ni Zebedeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, ang mababasa ay “Joses” sa halip na “Jose.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Kabilang sa kanila
  rationale: Tumutukoy ang parirala sa pangkat ng mga babaeng binanggit sa naunang talata. Likas sa modernong Tagalog ang “Kabilang sa kanila” at pinananatili nito ang diwa ng pagiging bahagi ng pangkat.
- source_word: ἦν
  choice: sina
  rationale: Bagaman isahan ang anyong Griyego, ginagamit ito rito sa paglalahad ng sunod-sunod na pangalan. Ang “sina” ang natural na panandang Tagalog para sa maramihang taong pinapangalanan.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Ito ang malinaw at nakagawiang anyo ng pangalan at pantukoy sa modernong Tagalog.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Maria na ina nina Santiago at Jose
  rationale: Malinaw na ipinakikilala si Maria sa pamamagitan ng kaniyang dalawang anak. Ang “nina” ay natural sa Tagalog kapag dalawang pangalang pantangi ang magkasamang tumutukoy sa kaugnayan.
- source_word: Ἰάκωβος
  choice: Santiago
  rationale: Ang “Santiago” ang nakagawiang anyo sa saling Tagalog para sa pangalang ito sa Bagong Tipan at madaling makilala ng karaniwang mambabasa.
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Direktang kinakatawan ng “Jose” ang pagbasa ng SBLGNT na Ἰωσήφ; inilalagay sa talababa ang ibang pagbasa.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ang ina ng mga anak ni Zebedeo
  rationale: Malinaw at malapit ito sa kayarian ng Griyego habang nananatiling natural sa Tagalog. Hindi idinaragdag ang pangalan ng ina na hindi tahasang ibinigay sa talata.
- source_word: Ζεβεδαίου
  choice: Zebedeo
  rationale: Ito ang nakagawiang anyong Tagalog ng pangalang Ζεβεδαῖος.
