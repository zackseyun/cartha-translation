source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: tl
  text: At biglang napunit sa dalawa ang tabing ng santuwaryo[a], mula sa itaas hanggang sa ibaba, yumanig ang lupa, at nabiyak ang mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabing ng templo.” Ang salitang Griyego ay tumutukoy rito sa tabing sa loob ng santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan ninyo
  rationale: Pinananatili ang biglaang pagtawag-pansin at maringal na diin ng salaysay; mas natural ito sa kasalukuyang Filipino kaysa sa literal na “narito.”
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: tabing ng santuwaryo
  rationale: Ang καταπέτασμα ay tabing o kurtina, at ang ναός dito ay tumutukoy nang mas tiyak sa santuwaryo, hindi sa buong bakuran ng templo.
- source_word: ἐσχίσθη ... εἰς δύο
  choice: napunit sa dalawa
  rationale: Ang “napunit” ay likas para sa tela at pinananatili ng anyong balintiyak ang hindi pagbanggit sa gumagawa.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: mula sa itaas hanggang sa ibaba
  rationale: Direkta at natural na katumbas na pinananatili ang mahalagang direksiyon ng pagkapunit.
- source_word: ἡ γῆ ἐσείσθη
  choice: yumanig ang lupa
  rationale: Natural na Filipino para sa pagyanig; ang “lupa” ay maaaring tumukoy sa lupa o daigdig nang hindi sapilitang pinalalawak ang saklaw.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: nabiyak ang mga bato
  rationale: Ang “nabiyak” ang karaniwang pandiwa para sa pagkahati o pagbitak ng malalaking bato at tumutugma sa σχίζω ayon sa konteksto.
theological_decisions:
- issue: Kahulugan ng pagkapunit ng tabing
  choice: Inilahad lamang ang pangyayari nang walang idinagdag na paliwanag sa simbolikong kahulugan nito.
  alternative: Ipaliwanag itong tanda ng paglapit sa Diyos o ng hatol sa sistema ng templo.
  rationale: Hindi mismo ipinapaliwanag ng talata ang teolohikal na kahulugan ng pangyayari; pinananatili ng salin ang tensiyon at iniiwasang magpasok ng komentaryo.
- issue: Saklaw ng ἡ γῆ
  choice: “ang lupa”
  alternative: “ang daigdig” o “ang lupain”
  rationale: Maaaring tumukoy ang γῆ sa lupa, lupain, o daigdig. Ang “lupa” ay natural at hindi tiyakang nagpapasya kung lokal o kosmiko ang saklaw ng pagyanig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “masdan ninyo” upang mapanatili ang dramatikong ἰδοὺ, at “santuwaryo” upang maipakita ang mas tiyak na diwa ng ναός sa kontekstong ito.
