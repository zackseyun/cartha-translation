id: MAT.27.49
reference: Matthew 27:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: tl
  text: Ngunit sinabi ng iba, “Hayaan mo siya. Tingnan natin kung darating si Elias upang iligtas siya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ngunit sinabi ng iba
  rationale: Ang λοιποί ay tumutukoy sa ibang naroon, bilang kaibahan sa naunang kumilos; natural sa modernong Tagalog ang “ang iba,” at pinananatili ng “ngunit” ang pagsalungat ng δέ.
- source_word: ἔλεγον
  choice: sinabi
  rationale: Bagaman maaaring magpahiwatig ang imperfect ng nagpapatuloy o paulit-ulit na pagsasalita, likas sa salaysay na Tagalog ang payak na “sinabi” nang hindi labis na tinutukoy ang aspekto.
- source_word: Ἄφες
  choice: Hayaan mo siya
  rationale: Ang pang-isahang pautos ay nakatuon sa taong nagbibigay ng maasim na alak. Ginagawang malinaw ng “siya” ang ipinahihiwatig na layon, si Jesus, habang nananatiling maikli at natural.
- source_word: ἴδωμεν
  choice: Tingnan natin
  rationale: Tuwirang inililipat nito ang hortatoryong unang panauhang maramihan at ang diwa ng pagmamasid kung ano ang mangyayari.
- source_word: εἰ ἔρχεται
  choice: kung darating
  rationale: Ang εἰ ay nagpapakilala ng di-tuwirang tanong. Bagaman pangkasalukuyan ang anyong ἔρχεται, maaari itong magpahayag ng nalalapit na kilos; ang “kung darating” ang pinakanatural sa Tagalog at hindi nagtatakda kung tiyak na darating siya.
- source_word: Ἠλίας
  choice: Elias
  rationale: Ito ang tradisyonal at malawak na nakikilalang anyo ng pangalan ng propeta sa Bibliyang Tagalog.
- source_word: σώσων αὐτόν
  choice: upang iligtas siya
  rationale: Ipinapahayag ng future participle ang layunin ng pagdating. Pinananatili ng “iligtas” ang karaniwang saklaw ng σῴζω at ang ironiyang naratibo, habang sa konteksto ay tumutukoy sa pisikal na pagliligtas mula sa krus.
theological_decisions:
- issue: Posibleng teolohikal na pahiwatig ng σῴζω sa salaysay ng pagpapako sa krus
  choice: upang iligtas siya
  alternative: upang sagipin siya
  rationale: Ang agarang diwa ay nakikitang pagliligtas mula sa krus, hindi isang tahasang pahayag tungkol sa walang-hanggang kaligtasan. Gayunman, pinananatili ng “iligtas” ang leksikal at naratibong ugnayan ng σῴζω nang hindi nilulutas ang ironiyang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang pamilyar na pang-isahang “mo” dahil pang-isahan ang Ἄφες at nakatuon ito sa naunang taong kumilos. Walang talababa dahil ang mga alternatibong pagbasa ay sapat na kinakatawan sa mga desisyong leksikal at walang mahalagang tekstuwal na pagkakaiba sa ibinigay na pinagmulan.
