  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: tl
  text: At matapos nila siyang ipako sa krus, pinaghati-hatian nila ang kanyang mga damit sa pamamagitan ng palabunutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: matapos nila siyang ipako sa krus
  rationale: Ang aorist participle ay tumutukoy sa kilos na nauna sa pangunahing pandiwa. Likas sa makabagong Tagalog ang “matapos” at malinaw nitong pinananatili ang pagkakasunod-sunod ng mga pangyayari.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; ang “At” ay payak at natural na katumbas.
- source_word: διεμερίσαντο
  choice: pinaghati-hatian nila
  rationale: Ipinapahayag ng pandiwa ang paghahati-hati o pamamahagi sa kanilang sarili. Ang “pinaghati-hatian” ay malinaw at likas sa konteksto ng mga damit.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ang kanyang mga damit
  rationale: Malawak ang kahulugan ng ἱμάτια bilang mga kasuotan. Mas natural at madaling maunawaan sa modernong Tagalog ang “mga damit” kaysa sa mas pormal na “mga kasuotan,” nang hindi ito nililimitahan sa panlabas na damit lamang.
- source_word: βάλλοντες κλῆρον
  choice: sa pamamagitan ng palabunutan
  rationale: Ipinakikita ng participial phrase ang paraan ng paghahati. Ang “palabunutan” ang malinaw at karaniwang Tagalog para sa pagpapasya sa pamamagitan ng lot, at ang “sa pamamagitan ng” ay tahasang nagpapakita ng kaugnayan nito sa pangunahing pandiwa.
theological_decisions:
- issue: Kaugnayan ng βάλλοντες κλῆρον sa διεμερίσαντο
  choice: 'Itinuring ang palabunutan bilang paraan ng paghahati: “pinaghati-hatian nila ... sa pamamagitan ng palabunutan.”'
  alternative: “pinaghati-hatian nila ang kanyang mga damit habang nagpapalabunutan” o “... at nagpalabunutan sila”
  rationale: Likas na ipinapaliwanag ng Greek participle kung paano isinagawa ang paghahati. Nililinaw ng salin ang ugnayang ito nang walang idinaragdag na teolohikal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang “mga damit” at “palabunutan”; iniwasan ang labis na pormal o makalumang pananalita. Hindi kailangan ang talababa sapagkat naipapahayag nang maayos sa pangunahing teksto ang temporal at instrumental na relasyon ng mga participle.
