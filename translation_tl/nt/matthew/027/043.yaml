id: MAT.27.43
reference: Matthew 27:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: tl
  text: Nagtiwala siya sa Diyos[a]; iligtas siya ngayon ng Diyos, kung nais siya ng Diyos, sapagkat sinabi niya[b], ‘Ako ang Anak ng Diyos.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nagtitiwala siya sa Diyos.” Ipinahihiwatig ng anyong Griyego ang isang matatag na pagtitiwala.
    reason: alternative_rendering
  - marker: b
    text: Malapit na inuulit ng panunuyang ito ang Awit 22:8, na nag-uugnay sa paghamak kay Jesus sa matuwid na nagdurusa sa awit na iyon. Sa alusyong ito, ang “kung nais siya ng Diyos” ay maaari ring unawaing “kung kinalulugdan siya ng Diyos.”
    reason: cross_reference_and_alternative_reading
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Nagtiwala siya sa Diyos
  rationale: Ang perfect na πέποιθεν ay nagpapahiwatig ng matatag na pagtitiwalang bunga ng naunang pagkilos. Natural sa modernong Tagalog ang “nagtiwala sa Diyos,” bagaman hindi ganap na naipapakita ng anyong pandiwa sa Tagalog ang aspektong perfect ng Griyego.
- source_word: ῥυσάσθω
  choice: iligtas siya
  rationale: Ang ῥύομαι ay tumutukoy sa pagsagip o pagliligtas mula sa panganib. Ang “iligtas” ay malinaw at natural sa konteksto ng pagkakapako sa krus.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang diin ng panunuya sa agarang pagkilos ng Diyos.
- source_word: εἰ θέλει αὐτόν
  choice: kung nais siya ng Diyos
  rationale: Karaniwang kahulugan ng θέλω ang “nais” o “gusto.” Inulit ang “Diyos” upang luminaw sa Tagalog kung sino ang paksa, habang ang posibilidad na tumukoy ito sa pagkakalugod ng Diyos ay inilagay sa talababa.
- source_word: εἶπεν γὰρ
  choice: sapagkat sinabi niya
  rationale: Ang aorist na εἶπεν ay natural na isinasalin bilang payak na nagdaang kilos; ipinakikita ng γάρ ang dahilan ng mapanuyang hamon.
- source_word: Θεοῦ εἰμι υἱός
  choice: Ako ang Anak ng Diyos
  rationale: Sa konteksto ng Mateo, ang parirala ay isang kinikilalang titulong kristolohikal, hindi lamang pangkalahatang pahayag na anak siya ng Diyos.
theological_decisions:
- issue: Kahulugan ng Θεοῦ εἰμι υἱός
  choice: Ako ang Anak ng Diyos
  alternative: Ako ay anak ng Diyos
  rationale: Bagaman walang artikulo ang υἱός sa Griyego, ang ayos ng panaguring pangngalan at ang konteksto ng Mateo ay sumusuporta sa tiyak at titular na diwa. Hindi kailangang magpasok ng mas huling pormulasyong doktrinal.
- issue: Kahulugan ng εἰ θέλει αὐτόν sa alusyon sa Awit 22:8
  choice: kung nais siya ng Diyos
  alternative: kung kinalulugdan siya ng Diyos
  rationale: Mas tuwirang ipinapahayag ng θέλω ang pagnanais, ngunit dahil malinaw ang alusyon sa Awit 22:8, pinananatili sa talababa ang makahulugang alternatibong “kinalulugdan.”
- issue: Pagtukoy sa paksa ng ῥυσάσθω
  choice: iligtas siya ngayon ng Diyos
  alternative: iligtas niya siya ngayon
  rationale: Ipinahihiwatig ng naunang “Diyos” ang paksa sa Griyego. Ang tahasang pag-uulit nito sa Tagalog ay umiiwas sa malabong magkasunod na panghalip nang hindi binabago ang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nais” sa halip na mas kolokyal na “gusto,” at tahasang inulit ang “Diyos” upang maging malinaw ang mga sanggunian ng panghalip.
