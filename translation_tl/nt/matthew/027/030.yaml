  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: tl
  text: At matapos nila siyang duraan, kinuha nila ang tambo[a] at paulit-ulit nilang ipinampas iyon sa kaniyang ulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaaring tumukoy sa “tambo” o, sa pinalawak na diwa, sa isang tungkod na tulad ng tambo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at patuloy nila itong ipinampalo sa kaniyang ulo.” Ang imperfect na pandiwang Griyego ay maaaring magdiin sa paulit-ulit o nagpapatuloy na kilos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: matapos nila siyang duraan
  rationale: Ang aorist participle ay nagpapakita ng kilos na nauna sa mga pangunahing pandiwa. Natural sa modernong Tagalog ang pariralang ito at malinaw nitong pinananatili ang pagkakasunod-sunod ng mga kilos.
- source_word: ἔλαβον
  choice: kinuha nila
  rationale: Tuwirang katumbas ng karaniwang gamit ng λαμβάνω sa konteksto.
- source_word: τὸν κάλαμον
  choice: ang tambo
  rationale: Ang κάλαμος ay pangunahing tumutukoy sa tambo at dito ay yaong naunang inilagay sa kamay ni Jesus. Pinananatili ng 'tambo' ang ugnayang leksikal at ang kabalintunaan ng kunwaring pagkahari.
- source_word: ἔτυπτον
  choice: paulit-ulit siyang hinampas
  rationale: Ang imperfect ay maaaring magpahiwatig ng paulit-ulit o nagpapatuloy na kilos. Malinaw at natural na ipinahahayag ng 'paulit-ulit ... hinampas' ang aspektong ito.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: sa ulo
  rationale: Ipinakikita ng εἰς dito ang pinatutungkulan ng mga hampas; natural itong ihayag sa Tagalog bilang 'sa ulo.'
theological_decisions:
- issue: Paglalarawan sa pang-aabuso ng mga kawal kay Jesus
  choice: Ihayag nang tuwiran ang pagdura at paulit-ulit na paghampas, nang hindi pinahihina o dinaragdagan ang salaysay.
  alternative: 'Gumamit ng mas pormal na ayos: ''At pagkadura sa kanya, kinuha nila ang tambo at hinahampas siya sa ulo.'''
  rationale: Salaysay ang talata at hindi nito kailangan ang dagdag na pagpapaliwanag. Pinananatili ng salin ang kahihiyan at karahasang dinanas ni Jesus, pati ang posibleng paulit-ulit o nagpapatuloy na bisa ng imperfect.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Ginamit ang 'duraan' at 'hinampas' bilang tuwiran ngunit hindi mapagpalabis na paglalarawan. Inilagay ang mga panandang [a] at [b] sa mismong teksto.
