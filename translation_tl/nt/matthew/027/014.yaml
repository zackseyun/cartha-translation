  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: tl
  text: At hindi man lang sumagot si Jesus sa kanya kahit isang salita, kaya labis na namangha ang gobernador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: sinagot
  rationale: Ang deponent na anyong aorist ay nangangahulugang “sumagot.” Ang “hindi ... sinagot” ay likas sa Filipino at pinananatili ang tuwirang ugnayan sa taong kinakausap.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip na datibo ay tumutukoy sa taong hindi sinagot—sa konteksto, ang gobernador. Sa Filipino, likas itong ipahayag bilang “siya” sa pariralang “hindi siya sinagot.”
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: kahit isang salita
  rationale: Pinananatili nito ang mariing pagtanggi ng οὐδὲ ἕν at ang karaniwang kahulugan ng ῥῆμα bilang “salita” o pahayag, nang hindi ito nililimitahan sa isang paratang o usapin.
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahahayag ng ὥστε ang resulta. Ang “kaya” ay natural at malinaw na panandang bunga sa modernong Filipino.
- source_word: θαυμάζειν
  choice: namangha
  rationale: Ang “namangha” ay natural at marangal na salin ng matinding pagtataka o paghanga na ipinahahayag ng pandiwa sa kontekstong ito.
- source_word: τὸν ἡγεμόνα
  choice: ang gobernador
  rationale: Sa kontekstong Romano, ang ἡγεμών ay gobernador, partikular si Pilato; “gobernador” ang tumpak at karaniwang tawag.
- source_word: λίαν
  choice: labis
  rationale: Ang “labis” ay malinaw na nagpapanatili sa matinding antas ng pagkakamangha.
theological_decisions:
- issue: Pagkilala sa di-binanggit na simuno ng ἀπεκρίθη
  choice: Tahasan ang “ni Jesus” upang maging malinaw ang simuno sa Filipino.
  alternative: 'Iwanang di-binanggit ang pangalan: “Ngunit hindi man lang niya siya sinagot...”'
  rationale: Bagaman implicit lamang sa Griyego ang simuno, malinaw sa konteksto na si Jesus iyon. Kailangan ang paglilinaw upang maiwasan ang malabong dalawang panghalip sa natural na Filipino; wala itong idinaragdag na teolohikal na interpretasyon.
translation_notes:
  register: Modernong Filipino na natural, dignified, at madaling maunawaan. Ginamit ang “hindi man lang ... kahit isang salita” upang maipakita ang mariing ganap na pananahimik, at “labis na namangha” upang mapanatili ang lakas ng λίαν.
