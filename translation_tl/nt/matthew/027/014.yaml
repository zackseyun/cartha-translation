    issue: Ang "Ngunit" para sa καί
    rationale: Ang καί ay karaniwang "at"; bagaman maaaring maging adversative ayon sa konteksto, hindi iyon hayagang minamarka ng talata. Ang "At" ay mas malapit sa pinagmulan at hindi nagdaragdag ng diin sa pagsalungat.
  - severity: low
    issue: Medyo alanganing paglalapat ng "kahit isang salita" sa "sinagot"
    rationale: 'Sa Filipino, mas malinaw na ikabit ang paraan ng pagtugon sa pandiwang "sumagot": "sumagot ... kahit isang salita." Napananatili nito ang mariing πρὸς οὐδὲ ἓν ῥῆμα.'
  revised_text: At hindi man lang sumagot si Jesus sa kanya kahit isang salita, kaya labis na namangha ang gobernador.
