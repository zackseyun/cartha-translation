base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: tl
  text: At ang sinumang hindi pumapasan ng sarili niyang krus[a] at sumusunod sa likuran ko[b] ay hindi karapat-dapat sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, “kanyang krus”; pangkalahatan ang diwa: bawat alagad ay kailangang pumasan ng sarili niyang krus.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sumusunod sa akin.” Mas tahasang sinasabi ng Griyego na “sumusunod sa likuran ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ang sinumang
  rationale: Likas na ipinahahayag ng “ang sinumang” ang di-tiyak at pangkalahatang pagtukoy ng panghalip na Griyego.
- source_word: λαμβάνει τὸν σταυρὸν αὐτοῦ
  choice: pumapasan ng sarili niyang krus
  rationale: Sa kontekstong ito, ang “pumapasan” ang likas na katumbas sa Filipino ng pagkuha at pagdadala ng sariling krus. Pinananatili nito ang kongkretong larawan ng krus at ang personal na pananagutan ng bawat alagad.
- source_word: σταυρὸν
  choice: krus
  rationale: Ang “krus” ang pamantayan at madaling maunawaang salin ng σταυρός, at pinananatili nito ang makasaysayan at teolohikal na bigat ng larawan.
- source_word: αὐτοῦ
  choice: sarili niyang
  rationale: Ipinahahayag nito ang isahang pansariling kaugnayan—sariling krus ng bawat tinutukoy—nang hindi nagpapasok ng kasariang wala namang kailangang ipakita sa gramatika ng Filipino.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: sumusunod sa likuran ko
  rationale: Pinananatili ng “sa likuran ko” ang tahasang ὀπίσω μου, hindi lamang ang payak na diwang “sumusunod sa akin.”
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ay hindi karapat-dapat sa akin
  rationale: Direkta at maringal na katumbas ito ng pasyang nagpapahayag ng pagiging hindi karapat-dapat kaugnay ni Jesus, nang walang dagdag na paliwanag tungkol sa pagiging kabilang sa kaniya.
theological_decisions:
- issue: Ang larawan ng pagpasan ng krus bilang kundisyon ng pagiging alagad
  choice: Panatilihin ang kongkretong pahayag na “pumapasan ng sarili niyang krus.”
  alternative: Ipaliwanag bilang “tumatanggap ng pagdurusa” o “itinatanggi ang sarili.”
  rationale: Ang teksto mismo ay gumagamit ng larawan ng krus. Hindi ito dapat paliitin sa isa lamang sa mga posibleng implikasyon nito, gaya ng pagdurusa, kahihiyan, o pagkakait sa sarili.
- issue: Ang pangkalahatang gamit ng isahang αὐτοῦ
  choice: Isalin bilang “sarili niyang,” na tumutukoy sa sariling krus ng bawat alagad.
  alternative: Isalin lamang bilang “kanyang” o gawing maramihan.
  rationale: Walang hiwalay na panghalip na panlalaki at pambabae sa Filipino. Pinananatili ng isahang anyo ang istruktura at pangkalahatang bisa ng Griyego nang hindi nagdaragdag ng kasariang hindi likas sa target na wika.
translation_notes:
  register: Makabago ngunit maringal na Filipino. Ginamit ang “sinumang,” “pumapasan,” at “karapat-dapat” dahil malinaw ang mga ito sa karaniwang mambabasa at angkop sa solemneng tono ng pananalita ni Jesus. Pinanatili ang “sa likuran ko” upang maipakita ang bahaging ὀπίσω μου sa Griyego.
