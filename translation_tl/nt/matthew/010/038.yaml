  source_fidelity: 'Tapat ang salin sa pangunahing mga elemento ng Griyego: ang pangkalahatang ὃς (“ang sinumang”), ang kongkretong larawan ng pagdadala/pagpasan ng krus, ang pansariling kaugnayan ng αὐτοῦ (“sarili niyang”), ang tahasang ὀπίσω μου (“sa likuran ko”), at ang paghatol na “hindi karapat-dapat sa akin.” Ang “pumapasan” ay isang matatag at kontekstuwal na Filipino para sa λαμβάνει ... σταυρόν sa kasabihang ito, kahit mas literal na “kumukuha” ang βασikong pandiwa sa ibang konteksto.'
  naturalness: Makabago, malinaw, at angkop ang maringal na rehistro. Ang “sumusunod sa likuran ko” ay bahagyang mas tahasan kaysa sa karaniwang “sumusunod sa akin,” ngunit nananatiling natural at matagumpay na naipapakita ang ὀπίσω.
  terminology: Ang “krus,” “pumapasan,” at “karapat-dapat” ay matatag, nauunawaan, at angkop na mga terminong Filipino para sa kontekstong ito. Hindi pinalalabnaw ng salin ang kongkretong imahen ng krus o dinaragdagan ang teolohikal na pakahulugan nito.
