  to: At ipinatawag ni Jesus sa kaniya ang labindalawa niyang alagad at binigyan sila ng awtoridad[a] laban sa maruruming espiritu[b], upang palayasin ang mga ito at pagalingin ang bawat sakit at bawat karamdaman.[c]
