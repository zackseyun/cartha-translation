reference: Matthew 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: tl
  text: At ipinatawag ni Jesus sa kaniya ang labindalawa niyang alagad at binigyan sila ng awtoridad[a] laban sa maruruming espiritu[b], upang palayasin ang mga ito at pagalingin ang bawat sakit at bawat karamdaman.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapangyarihan.” Ang salitang Griego ay maaari ring tumukoy sa ipinagkaloob na karapatang kumilos o mamahala.
    reason: lexical_alternative
  - marker: b
    text: O “masasamang espiritu.” Sa literal, “maruruming espiritu.”
    reason: lexical_alternative
  - marker: c
    text: Ang “sakit” at “karamdaman” ay salin ng dalawang magkaugnay na salitang Griego; maaari ring isalin ang ikalawa bilang “kahinaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: tinawag ... ang
  rationale: Ipinahihiwatig ng aorist middle participle ang pagtawag ni Jesus sa mga alagad upang lumapit sa kaniya. Sa natural na Filipino, sapat na ang “tinawag ni Jesus,” yamang malinaw sa konteksto na sila ay ipinatawag niya sa sarili niya.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: ang labindalawa niyang alagad
  rationale: Karaniwang salin sa konteksto ng Ebanghelyo ang “alagad” para sa μαθητής. Pinananatili ng “niyang” ang kaugnayang ipinahahayag ng αὐτοῦ.
- source_word: ἔδωκεν
  choice: binigyan
  rationale: Direkta at natural na katumbas ng δίδωμι sa pangungusap na may tumatanggap at ipinagkakaloob na awtoridad.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinahahayag ng ἐξουσία ang ipinagkaloob na karapatang mamahala o kumilos, hindi lamang ang taglay na lakas. Mas tiyak dito ang “awtoridad” kaysa “kapangyarihan.”
- source_word: πνευμάτων ἀκαθάρτων
  choice: laban sa masasamang espiritu
  rationale: Ang genitive na kaugnay ng ἐξουσία ay tumutukoy sa mga espiritung saklaw ng kanilang awtoridad. Natural sa Filipino ang “awtoridad laban sa.” Isinalin ang ἀκάθαρτος bilang “masama” sa pangunahing teksto para sa malinaw na kasalukuyang gamit, habang itinatala sa talababa ang literal at tradisyonal na “maruming espiritu.”
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: upang palayasin ang mga ito
  rationale: Ang ὥστε na may infinitive ay maaaring magpahiwatig ng layunin o kinalabasan; hindi ito labis na nililimitahan ng “upang” sa kontekstong ito. Ang “mga ito” ay malinaw na tumutukoy sa mga espiritu.
- source_word: θεραπεύειν
  choice: pagalingin
  rationale: Sa konteksto, ang θεραπεύω ay tumutukoy sa pagpapagaling ng mga maysakit.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ang bawat uri ng sakit at karamdaman
  rationale: Pinananatili ang magkaugnay ngunit magkaibang mga salitang νόσος at μαλακία sa pamamagitan ng “sakit” at “karamdaman.” Idinagdag ang “uri ng” bilang natural na Filipino upang maipahayag na malawak at walang itinatanging klase ang πᾶσαν.
theological_decisions:
- issue: Likas ng ipinagkaloob sa labindalawa
  choice: awtoridad
  alternative: kapangyarihan
  rationale: Mas malinaw na ipinapakita ng “awtoridad” na ang kakayahan nilang magpalayas at magpagaling ay ipinagkaloob ni Jesus. Hindi nito ginagawang simpleng di-personal na lakas ang ἐξουσία.
- issue: Kahulugan ng ὥστε kasama ng mga infinitive
  choice: upang
  alternative: kaya nagawa nilang
  rationale: Pinananatili ng “upang” ang ugnayang layunin/kinalabasan nang hindi ipinapahayag na ang talata ay nag-uulat na agad na naisagawa ang lahat ng ito.
- issue: Paglalarawan sa πνεύματα ἀκάθαρτα
  choice: masasamang espiritu
  alternative: maruruming espiritu
  rationale: Ang “masasamang espiritu” ay natural at madaling maunawaan sa modernong Filipino. Gayunman, pinananatili sa talababa ang literal na metapora ng ritwal o moral na karumihan upang hindi mawala ang saklaw ng ἀκάθαρτος.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “labindalawa” bilang kilalang katawagan sa pangkat ngunit pinanatili rin ang “alagad.” Iniwasan ang sobrang teknikal na pananalita sa pangunahing teksto; ang mahahalagang alternatibong leksikal ay inilagay sa mga talababa.
