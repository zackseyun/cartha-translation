  source_fidelity: 'Kailangang ibalik sa pangunahing teksto ang dalawang elementong mas tuwirang tumutugon sa Griego: ang pagtawag ni Jesus sa mga alagad na lumapit sa kaniya (προσκαλεσάμενος) at ang paglalarawan sa mga espiritu bilang “marurumi” (ἀκάθαρτοι), hindi “masasama.” Ang “bawat sakit at bawat karamdaman” ay mas malapit sa inuulit na πᾶσαν kaysa “bawat uri ng sakit at karamdaman.”'
  naturalness: Natural at angkop sa modernong Filipino ang “ipinatawag ni Jesus sa kaniya ang labindalawa niyang alagad,” “binigyan sila ng awtoridad,” at “upang palayasin ... at pagalingin.” Ang binagong ayos ay malinaw rin sa pampublikong pagbasa.
  terminology: Pinananatili ang “alagad,” “awtoridad,” at “karamdaman.” Ang “maruruming espiritu” ay mahalaga bilang karaniwang terminong Ebanghelyo at tapat na salin ng ἀκάθαρτα; huwag itong palitan ng mas makitid na “masasama.”
  issues:
  - severity: medium
    issue: Hindi naipahayag sa pangunahing teksto ang aspektong “sa kaniya” ng προσκαλεσάμενος.
    rationale: Ang pandiwang προσκαλέομαι ay nangangahulugang tumawag o magpatawag sa sarili. Bagaman maaaring mahinuha sa konteksto, ligtas at natural itong ihayag sa Filipino bilang “ipinatawag ... sa kaniya.”
  - severity: high
    issue: “Masasamang espiritu” ang salin ng πνευμάτων ἀκαθάρτων.
    rationale: Ang ἀκάθαρτος ay “marumi/di-malinis,” isang natatanging terminong may ritwal at relihiyosong saklaw. Ang “masama” ay interpretibong paglilipat at hindi katumbas nito; dapat manatili ang “maruruming espiritu” sa teksto.
  - severity: low
    issue: Ang “bawat uri ng sakit at karamdaman” ay hindi ganap na nagpapakita ng inuulit na πᾶσαν.
    rationale: Ang Griego ay “bawat sakit at bawat karamdaman.” Hindi kinakailangan ang dagdag na “uri ng,” at ang pag-uulit ng “bawat” ay mas tapat at natural.
