  source_fidelity: Tapat ang salin sa Griyego. Ang “kapopootan kayo ng lahat” ay maayos na naghahayag ng hinaharap na pasibong kalagayan ng ἔσεσθε μισούμενοι ὑπὸ πάντων; ang “dahil sa aking pangalan” ay pinananatili ang sanhi sa διὰ τὸ ὄνομά μου. Naipapahayag din ng “ang magtitiis hanggang wakas ang siyang maliligtas” ang saklaw, kondisyonal na pokus, at diin ng ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται nang walang pagdagdag na doktrinal na pagpapakahulugan.
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “ang siyang” ay likas na paraan upang maipahiwatig ang mariing resumptibong οὗτος, at ang “hanggang wakas” ay angkop sa rehistro ng talata.
  terminology: Ang “kapopootan,” “magtitiis,” at “maliligtas” ay angkop at pare-pareho sa kahulugang hinihingi ng konteksto. Hindi nililimitahan ng “maliligtas” ang σωθήσεται sa pisikal na pagsagip o sa isang partikular na doktrina ng pangwakas na kaligtasan.
