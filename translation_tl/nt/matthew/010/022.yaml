  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: tl
  text: At kapopootan kayo ng lahat dahil sa aking pangalan.[a] Ngunit ang magtitiis hanggang wakas ang siyang maliligtas.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa aking pangalan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang mananatiling matatag hanggang wakas.”
    reason: lexical_alternative
  - marker: c
    text: Ang “maliligtas” ay maaari ring unawaing “maililigtas” o “masasagip,” ayon sa pagkaunawa sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: kapopootan
  rationale: 'Likas at malinaw na katumbas ito ng hinaharap na kalagayang ipinahahayag ng ἔσεσθε μισούμενοι: magiging tudlaan sila ng poot.'
- source_word: ὑπὸ πάντων
  choice: ng lahat
  rationale: Ipinahahayag ng ὑπό na ang ‘lahat’ ang gumagawa ng pagkapoot; pinananatili ng ‘ng lahat’ ang malawak na saklaw ng πάντων nang natural sa Tagalog.
- source_word: διὰ τὸ ὄνομά μου
  choice: dahil sa aking pangalan
  rationale: Ang διά na may akusatibo ay nagsasaad ng dahilan. Pinananatili rin ng ‘pangalan’ ang saklaw nito bilang pagkatao, awtoridad, at pakikiugnay kay Jesus.
- source_word: ὁ δὲ ὑπομείνας
  choice: ang magtitiis
  rationale: Sa konteksto ng pag-uusig, malinaw na ipinahahayag ng ‘magtitiis’ ang matatag na pananatili nang hindi nagdaragdag ng teknikal na katawagang teolohikal.
- source_word: εἰς τέλος
  choice: hanggang wakas
  rationale: Natural na ipinahahayag nito ang pagpapatuloy ng pagtitiis hanggang sa huling hantungan.
- source_word: οὗτος
  choice: ang siyang
  rationale: Likas na paraan ito sa Tagalog upang mapanatili ang resumptibo at mariing diin ng οὗτος nang hindi nagiging asiwa ang pangungusap.
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Pinananatili ng ‘maliligtas’ ang malawak na kahulugan ng σῴζω—kaligtasan, pagliligtas, o pagsagip—nang hindi nililimitahan sa pisikal o eskatolohikal na pagliligtas lamang.
theological_decisions:
- issue: Kahulugan ng kaligtasan kaugnay ng pagtitiis hanggang wakas
  choice: maliligtas
  alternative: masasagip o maililigtas mula sa panganib
  rationale: Hindi nilulutas ng salin kung pisikal na pagliligtas, pangwakas na kaligtasan, o isang tiyak na doktrina ng pagpapatuloy ang pangunahing tinutukoy. Pinananatili nito ang lawak at tensiyong teolohikal ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang ‘kapopootan’ upang maging tuwiran ang hinaharap na pasibo, at ang ‘ang siyang’ upang mapanatili ang diin ng οὗτος nang hindi tunog-salin.
