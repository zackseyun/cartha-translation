base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: tl
  text: si Simon na Cananeo[a], at si Judas Iscariote, na siya ring nagkanulo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Simon na Zelote.” Ang Griyego rito ay Cananeo, na malamang ay sumasalamin sa isang katawagang Aramaiko o Hebreo na karaniwang inuunawang tumutukoy sa isang “Zelote.”
    reason: lexical_alternative
  - marker: b
    text: O “na siya ring ipinasa.” Ang pandiwang Griyego ay maaari ring mangahulugang “ibinigay” o “ipinasa,” ngunit sa kaso ni Judas, ang “nagkanulo” ang angkop sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Cananeo
  rationale: Isinalin sa anyong transliterado upang mapanatili ang mismong katawagang Griyego na mula sa Aramaiko/Hebreo, sa halip na ilagay agad sa teksto ang interpretasyong “Makabayan.”
- source_word: Ἰσκαριώτης
  choice: Iscariote
  rationale: Ginamit ang nakasanayang anyong Filipino ng personal na katawagang ito.
- source_word: παραδοὺς
  choice: nagkanulo
  rationale: Bagaman literal na maaaring mangahulugang “nagbigay” o “nagpaubaya,” malinaw sa konteksto ni Judas na ang tinutukoy ay mapanlinlang na pagbibigay kay Jesus sa kanyang mga kaaway.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: na siya ring nagkanulo sa kanya
  rationale: Likas na kamag-anak na sugnay sa Filipino ang nagpapahayag sa artikulo at pandiwaring Griyego; pinanatili ng “rin” ang καί bilang karagdagang pagkakakilanlan kay Judas.
theological_decisions:
- issue: Kung ang παραδοὺς ay isasaling neutral na “nagbigay sa kanya” o kontekstuwal na “nagkanulo sa kanya”
  choice: nagkanulo sa kanya
  alternative: nagbigay sa kanya sa mga kaaway
  rationale: Ang talaan ay kumikilala kay Judas sa gawaing kilala sa salaysay ng Ebanghelyo. Ipinahahayag ng “nagkanulo” ang moral at ugnayang bigat ng konteksto, samantalang inilalahad sa talababa ang mas malawak at literal na saklaw ng pandiwang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang transliteradong “Cananeo” sa pangunahing teksto upang hindi gawing tiyak ang interpretasyon; inilagay ang karaniwang pagkaunawang “Makabayan” sa talababa. Ginamit ang “nagkanulo” para sa likas at kontekstuwal na Filipino, habang pinanatili sa talababa ang mas literal na alternatibo.
