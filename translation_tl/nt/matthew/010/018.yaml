  source_fidelity: 'Tumpak na naipapahayag ng salin ang lahat ng pangunahing bahagi ng Griyego: ang pagdadala sa harap ng mga gobernador at hari, ang dahilan na kaugnay ni Jesus, at ang layuning/resultang maging patotoo sa mga awtoridad at sa mga Hentil. Ang neutral na “sa kanila” ay wastong pinananatili ang di-tahasang puwersa ng αὐτοῖς.'
  naturalness: Natural, malinaw, at dignificado ang modernong Filipino. Ang “dadalhin kayo sa harap ng” ay angkop sa kontekstong pagharap sa mga awtoridad; ang “upang maging patotoo” ay maayos at nauunawaan.
  terminology: Ang “mga gobernador,” “mga hari,” “patotoo,” at “mga Hentil” ay pare-pareho sa karaniwang rehistrong biblikal sa Filipino. Ang kapitalisasyon ng “Hentil” ay katanggap-tanggap para sa pangkat na tinutukoy ng ἔθνη sa kontekstong ito. Wasto rin ang talababa na nagbibigay ng literal na alternatibong “mga bansa.”
