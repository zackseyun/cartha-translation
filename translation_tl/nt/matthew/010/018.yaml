id: MAT.10.18
reference: Matthew 10:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: tl
  text: At dadalhin kayo sa harap ng mga gobernador at mga hari dahil sa akin, upang maging patotoo sa kanila[b] at sa mga Hentil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ding unawain ang “sa kanila” bilang “laban sa kanila” sa kontekstong ito, bagaman hindi ito tahasang ipinahihiwatig ng anyong datibo sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: sa harap ng mga gobernador at mga hari
  rationale: Sa ἐπί na may akusatibo pagkatapos ng pandiwa ng pagdadala, ang diwa ay pagharap sa mga may kapangyarihan. Ang “gobernador” at “hari” ay malinaw at karaniwang katumbas sa makabagong Filipino.
- source_word: ἀχθήσεσθε
  choice: dadalhin kayo
  rationale: Ang future passive ng ἄγω ay likas na maisasalin bilang “dadalhin.” Hindi nito idinaragdag ang puwersa o karahasang ipinahihiwatig ng “kakaladkarin.”
- source_word: ἕνεκεν ἐμοῦ
  choice: dahil sa akin
  rationale: Ipinahahayag ng ἕνεκεν na may genitibo ang dahilan. Ang “dahil sa akin” ay natural at tuwirang tumutukoy kay Jesus.
- source_word: εἰς μαρτύριον
  choice: upang maging patotoo
  rationale: Maaaring ipahayag ng parirala ang layunin o bunga. Pinananatili ng “upang maging patotoo” ang nominal na diwa ng μαρτύριον at natural ito sa Filipino.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Pinakanatural na tumutukoy ang panghalip sa mga gobernador at hari. Hindi hayagang adversatibo ang datibo, kaya pinananatili ng “sa kanila” ang pagiging bukas ng kahulugan.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga Hentil
  rationale: Sa Mateo, madalas tumukoy ang ἔθνη sa mga di-Judio. Ang “mga Hentil” ang karaniwang katawagang biblikal, habang inilalahad sa talababa ang literal na alternatibong “mga bansa.”
theological_decisions:
- issue: Diwa ng μαρτύριον αὐτοῖς
  choice: neutral na “patotoo sa kanila”
  alternative: “patotoo laban sa kanila”
  rationale: Hindi tahasang ipinahihiwatig ng datibong αὐτοῖς ang paghatol o pagsalungat. Pinananatili ng neutral na salin ang tensiyong maaaring magsilbing pahayag sa kanila ang patotoo o maging patotoo laban sa kanila ayon sa konteksto at tugon nila.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “gobernador” bilang tiyak at pamilyar na katawagan sa ἡγεμών; pinanatili ang “mga Hentil” bilang karaniwang terminong biblikal, na may paliwanag sa talababa.
