  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: tl
  text: Huwag kayong magdala ng supot para sa paglalakbay, ni dalawang tunika, ni mga sandalyas, ni tungkod[a]; sapagkat karapat-dapat ang manggagawa sa kanyang pagkain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga nagpapakahulugan na ekstrang tungkod ang ipinagbabawal, lalo na dahil pinahihintulutan sa Marcos 6:8 ang pagdadala ng tungkod.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: supot
  rationale: Ang πήρα ay supot na dinadala sa paglalakbay, lalo na para sa pagkain o iba pang panustos. Natural at malinaw sa modernong Filipino ang “supot” sa kontekstong ito.
- source_word: εἰς ὁδὸν
  choice: sa paglalakbay
  rationale: Ipinahihiwatig ng parirala ang pagdadala ng isang bagay bilang panustos sa biyahe; malinaw at natural ang “sa paglalakbay.”
- source_word: δύο χιτῶνας
  choice: dalawang tunika
  rationale: Ang χιτών ay pangunahing kasuotang isinusuot sa katawan noong unang siglo. Pinananatili ng “tunika” ang historikal na katumpakan nang hindi ito ginagawang modernong kamiseta.
- source_word: ὑποδήματα
  choice: mga sandalyas
  rationale: Tumutukoy ang ὑπόδημα sa isinusuot at itinatali sa paa; ang “mga sandalyas” ang angkop sa konteksto ng unang siglo.
- source_word: ῥάβδον
  choice: tungkod
  rationale: Sa konteksto, ang ῥάβδος ay tungkod na ginagamit sa paglalakad. Literal itong pinanatili upang huwag pag-isahin nang sapilitan ang Mateo at Marcos 6:8.
- source_word: ἄξιος
  choice: karapat-dapat tumanggap
  rationale: Ipinahahayag ng ἄξιος na nararapat sa manggagawa ang pagkain. Idinagdag ang “tumanggap” upang maging natural sa Filipino habang pinananatili ang diwang evaluative.
- source_word: ὁ ἐργάτης
  choice: ang manggagawa
  rationale: Ang ἐργάτης ay taong gumagawa o nagpapagal. Malinaw at pangkaraniwan ang “manggagawa” at hindi ito nag-aangkat ng teknikal na katawagang pansimbahan.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: ng pagkain
  rationale: Ang τροφή ay tuwirang tumutukoy sa pagkain o sustansiya. Pinananatili ng “pagkain” ang kongkretong kahulugan sa halip na palawakin ito bilang pangkalahatang suporta.
theological_decisions:
- issue: Posibleng pag-aayon sa magkakatulad na salaysay tungkol sa kagamitang maaaring dalhin
  choice: Pinanatili sa pangunahing teksto ang pagbabawal na magdala ng “tungkod,” ayon sa tahasang pagkakasulat ng Mateo.
  alternative: Unawain ito bilang pagbabawal lamang sa ekstrang tungkod, lalo na dahil pinahihintulutan sa Marcos 6:8 ang pagdadala ng tungkod.
  rationale: Tahasang kabilang ang ῥάβδον sa listahan ng mga ipinagbabawal sa tekstong Griyego ng Mateo. Pinananatili ng salin ang tensiyon sa pagitan ng mga salaysay sa halip na palihim na pag-isahin ang mga ito.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang historikal na “tunika” ngunit ang karaniwang “supot,” “sandalyas,” “tungkod,” at “manggagawa” upang manatiling madaling maunawaan.
