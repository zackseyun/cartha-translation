  naturalness: Natural sa modernong Filipino ang “supot para sa paglalakbay,” “dalawang tunika,” at “mga sandalyas.” Mas tuwiran at idiomatiko ang “karapat-dapat ang manggagawa sa kanyang pagkain” kaysa “karapat-dapat tumanggap ng pagkain ang manggagawa.”
  terminology: Ang “tunika,” “sandalyas,” “tungkod,” at “manggagawa” ay angkop at tapat sa mga terminong Griyego. Ang “supot para sa paglalakbay” ay mas tiyak kaysa “supot” lamang, na maaaring magpahiwatig ng karaniwang maliit na lalagyan sa modernong gamit.
