id: MAT.10.8
reference: Matthew 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: tl
  text: Pagalingin ninyo ang mga maysakit, buhayin ang mga patay[b], linisin ang mga may ketong[a], at palayasin ang mga demonyo. Tinanggap ninyo nang walang bayad; magbigay kayo nang walang bayad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mga may sakit sa balat.” Ang salitang tradisyonal na isinasaling “ketong” ay maaaring tumukoy sa iba’t ibang malubhang kondisyon sa balat sa gamit ng Biblia, hindi lamang sa sakit na tinatawag ngayong sakit na Hansen.
    reason: cultural_note
  - marker: b
    text: Wala ang “buhayin ang mga patay” sa ilang sinaunang manuskrito.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: mga maysakit
  rationale: Sa konteksto ng pagpapagaling, tumutukoy ito sa mga taong may karamdaman; natural at malinaw ang “mga maysakit” sa modernong Tagalog.
- source_word: θεραπεύετε
  choice: Pagalingin ninyo
  rationale: Ipinapahayag nito ang tuwirang utos na magpagaling, hindi lamang mag-alaga o gumamot.
- source_word: νεκροὺς ἐγείρετε
  choice: buhayin ang mga patay
  rationale: Sa kontekstong ito, ang ἐγείρω ay pagbangon mula sa kamatayan. Mas natural sa Tagalog ang “buhayin” kaysa sa literal ngunit maaaring malabong “ibangon.”
- source_word: λεπροὺς
  choice: mga may ketong
  rationale: Pinananatili ang tradisyonal at madaling makilalang katawagan, habang nililinaw sa talababa na mas malawak ang maaaring saklaw ng terminong biblikal kaysa sa modernong Hansen’s disease.
- source_word: καθαρίζετε
  choice: linisin
  rationale: Pinananatili nito ang pisikal at ritwal na diwa ng pagiging malinis, sa halip na paliitin ang kahulugan sa “pagalingin” lamang.
- source_word: δαιμόνια ἐκβάλλετε
  choice: palayasin ang mga demonyo
  rationale: Ang “palayasin” ay natural na Tagalog para sa sapilitang pagpapaalis na ipinahihiwatig ng ἐκβάλλω.
- source_word: δωρεὰν
  choice: nang walang bayad
  rationale: Tahasang ipinahihiwatig ng adverb ang pagtanggap at pagbibigay nang libre o walang kapalit na bayad; pinananatili rin ng pag-uulit ang balanse ng Griyego.
- source_word: ἐλάβετε
  choice: Tinanggap ninyo
  rationale: Pinananatili ang payak na aspektong nakaraan at ang hindi binanggit na layon ng pandiwa.
- source_word: δότε
  choice: magbigay kayo
  rationale: Tuwirang pautos ito sa maramihang kausap; ang paraan ng pagbibigay ay ipinahahayag ng kasunod na “nang walang bayad.”
theological_decisions:
- issue: Saklaw ng mga mahimalang utos
  choice: Isinalin ang mga pandiwa bilang tuwirang mga utos sa Labindalawa sa konteksto ng misyong ito.
  alternative: Unawain ang ilan sa mga gawain bilang talinghaga lamang o bilang mga gawaing para lamang sa iglesya sa kalaunan.
  rationale: Ang Griyego ay naghaharap ng magkakasunod at kongkretong pautos sa maramihang kausap. Hindi pinalalabo, nililimitahan, o pinalalawak ng salin ang aplikasyon ng mga ito nang lampas sa sinasabi ng teksto.
- issue: Diwa ng καθαρίζετε kaugnay ng ketong
  choice: Ginamit ang “linisin” upang mapanatili ang parehong pisikal at ritwal na diwa.
  alternative: Isalin lamang bilang “pagalingin.”
  rationale: Ang “pagalingin” ay maaaring mag-alis sa mahalagang konsepto ng kalinisan na nasa salitang Griyego at sa mundong panlipunan at ritwal ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, tuwiran, at marangal. Pinanatili ang magkakasunod na pautos at ang retorikal na pag-uulit ng “nang walang bayad.” Inilagay ang talababa sa “mga may ketong,” na siyang terminong nililinaw nito.
