  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: tl
  text: Huwag kayong kumuha ng ginto, pilak, o tanso[a] upang ilagay sa inyong mga sinturon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bronse.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, salaping inilalagay sa sinturon o sa supot ng pera na isinusuot sa baywang.
