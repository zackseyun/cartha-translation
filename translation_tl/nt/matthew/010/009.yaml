lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Huwag kayong kumuha
  rationale: Ang κτάομαι ay nangangahulugang kumuha, magtamo, o maglaan para sa sarili. Pinananatili ng “huwag kayong kumuha” ang utos na huwag silang maghanda o kumuha ng salapi para sa paglalakbay, sa halip na ipakahulugang huwag lamang itong dalhin.
- source_word: χρυσὸν
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na salita; sa konteksto, tumutukoy ito sa salaping ginto.
- source_word: ἄργυρον
  choice: pilak
  rationale: Tuwirang katumbas; sa konteksto, tumutukoy ito sa salaping pilak.
- source_word: χαλκὸν
  choice: tanso
  rationale: Maaaring mangahulugan ang χαλκός ng tanso o bronse. Ang “tanso” ang mas likas na tawag sa karaniwang Filipino para sa mababang-halagang salaping metal, habang inilalagay sa talababa ang “bronse” bilang posibleng salin.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: na ilalagay sa inyong mga sinturon
  rationale: Ang ζώνη ay sinturon o pamigkis na maaari ring paglagyan ng salapi. Nililinaw ng parirala ang direksiyon o layunin ng εἰς nang hindi inilalagay sa pangunahing teksto ang buong paliwanag tungkol sa supot ng pera.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang tatlong uri ng metal at ang diwa ng pagkuha o paglalaan, sa halip na gawing “magdala,” sapagkat higit na malawak ang kahulugan ng pandiwang Griyego. Ang kuwit sa hulihan ay sumusunod sa anyo ng ibinigay na talata bilang bahagi ng nagpapatuloy na pangungusap.
