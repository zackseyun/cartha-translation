id: MAT.10.41
reference: Matthew 10:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: tl
  text: Ang tumatanggap sa isang propeta sa pangalan ng isang propeta[a] ay tatanggap ng gantimpala ng isang propeta; at ang tumatanggap sa isang matuwid na tao sa pangalan ng isang matuwid na tao[b] ay tatanggap ng gantimpala ng isang matuwid na tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil siya ay propeta” o “bilang isang propeta.” Sa literal, “sa pangalan ng isang propeta.”
    reason: lexical_alternative
  - marker: b
    text: O “dahil siya ay matuwid” o “bilang isang matuwid na tao.” Sa literal, “sa pangalan ng isang matuwid na tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: ang tumatanggap
  rationale: Ang substantivized present participle ay tumutukoy sa sinumang karaniwang gumagawa ng kilos. Likas sa Tagalog ang “ang tumatanggap,” at napapanatili nito ang pangkalahatang diwa at pag-uulit ng Griyego.
- source_word: προφήτην
  choice: isang propeta
  rationale: Tuwirang katumbas ito ng accusative object at pinananatili ang kinikilalang tungkulin ng propeta nang walang dagdag na pagpapakahulugan.
- source_word: εἰς ὄνομα προφήτου
  choice: sa pangalan ng isang propeta
  rationale: Pinananatili nito ang natatanging anyo at posibleng teolohikal na alingawngaw ng idyomang Griyego. Dahil maaari itong mangahulugang pagtanggap batay sa pagkakakilanlan o tungkulin ng tao, nililinaw sa talababa ang mga likas na alternatibo.
- source_word: μισθὸν προφήτου
  choice: gantimpala ng isang propeta
  rationale: 'Pinananatili ng pariralang ito ang kalabuan ng genitive: maaaring gantimpalang tinatanggap ng propeta o gantimpalang nauugnay sa pagtanggap sa isang propeta.'
- source_word: λήμψεται
  choice: ay tatanggap
  rationale: Ang payak na hinaharap na “tatanggap” ay angkop sa future form at mas marangal kaysa sa mas kolokyal na mga alternatibo.
- source_word: δίκαιον
  choice: isang taong matuwid
  rationale: Natural at malinaw ito sa modernong Tagalog. Walang gramatikal na kasarian ang “tao,” kaya hindi kinakailangang idagdag ang “lalaki,” na maaaring magmukhang eksklusibo at lumampas sa kinatawang gamit ng masculine singular sa Griyego.
- source_word: εἰς ὄνομα δικαίου
  choice: sa pangalan ng isang taong matuwid
  rationale: Sinasalamin nito ang unang sugnay at pinananatili ang inuulit na idyoma. Ang kahulugang “dahil matuwid siya” o “bilang isang taong matuwid” ay ibinibigay sa talababa.
- source_word: μισθὸν δικαίου
  choice: gantimpala ng isang taong matuwid
  rationale: Pinananatili nito ang paralelismo at hindi nilulutas nang sapilitan kung ang gantimpala ay ibinibigay sa taong matuwid o kapantay ng gantimpalang nauukol sa kanya.
theological_decisions:
- issue: Kahulugan ng idyomang εἰς ὄνομα + genitive
  choice: Panatilihin sa pangunahing teksto ang “sa pangalan ng,” at ilahad sa talababa ang kahulugang “dahil siya ay” o “bilang.”
  alternative: Isalin nang tuwiran bilang “dahil siya ay propeta/matuwid” o “bilang propeta/isang taong matuwid.”
  rationale: Ang parirala ay tumutukoy sa pagtanggap sa isang tao batay sa kinikilalang pagkakakilanlan, katangian, o tungkulin niya. Ang literal na anyo ay nagpapanatili ng pag-uulit at posibleng kaugnayan sa iba pang pahayag tungkol sa “pangalan,” habang ang talababa ay umiiwas sa kalabuan para sa mambabasa.
- issue: Masculine singular na δίκαιον / δικαίου sa Tagalog
  choice: Gamitin ang “isang taong matuwid.”
  alternative: “Isang matuwid na lalaki” o “isang matuwid.”
  rationale: Hindi minamarkahan ng salitang Tagalog na “tao” ang kasarian. Ang “lalaki” ay magdaragdag ng tahasang limitasyong hindi kailangang ipahiwatig ng kinatawang masculine form sa konteksto, samantalang ang “isang matuwid” ay hindi gaanong natural sa kasalukuyang Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang balanseng paralelismo ng dalawang sugnay at ang inuulit na “tumatanggap / tatanggap.” Ang “sa pangalan ng” ay sadyang source-transparent at nililinaw sa mga talababa upang hindi ito mapagkamalang tumutukoy lamang sa pagbigkas ng pangalan o sa pormal na awtorisasyon.
