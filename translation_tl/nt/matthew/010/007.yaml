  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: tl
  text: 'At habang humahayo kayo, ipahayag ninyo: “Lumapit na[a] ang kaharian ng langit[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malapit na.” Ipinahihiwatig ng perpektong anyo ng pandiwang Griyego na naganap na ang paglapit at nananatili ang kabuluhan nito.
    reason: lexical_alternative
  - marker: b
    text: Madalas gamitin ni Mateo ang “kaharian ng langit,” samantalang madalas namang gamitin sa ibang mga Ebanghelyo ang “kaharian ng Diyos.”
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: habang humahayo kayo
  rationale: Ipinapakita ng kasalukuyang pandiwaring Griyego ang kilos na kasabay ng utos. Ang “habang humahayo kayo” ay natural at may dignidad, at hindi ito ginagawang hiwalay na utos.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito sa naunang tagubilin; pinananatili ng “At” ang daloy nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: κηρύσσετε
  choice: ipahayag ninyo
  rationale: Tumutukoy ito sa hayagan at may-awtoridad na pagpapahayag. Mas malawak at hindi gaanong eklesyastikal ang “ipahayag” kaysa “mangaral.”
- source_word: λέγοντες
  choice: ipinakikita sa tutuldok bago ang tuwirang sipi
  rationale: Tinutukoy ng pandiwari ang nilalaman ng ipahahayag. Sa natural na modernong Tagalog, sapat na ang tutuldok upang ipakilala ang mismong mensahe nang hindi gumagamit ng paulit-ulit na “ipahayag ninyo, na sinasabi.”
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Natural itong katumbas sa Tagalog ng paglapit na naganap na at nananatiling may bisa. Dahil maaari rin itong mapagkamalang tumutukoy lamang sa isang bagay na mangyayari sa madaling panahon, nililinaw sa talababa ang aspektong perpekto ng Griyego.
- source_word: ἡ βασιλεία
  choice: ang kaharian
  rationale: Pinananatili ng “kaharian” ang lawak ng kahulugan—kapuwa paghahari at sakop—nang hindi nililimitahan sa isa lamang.
- source_word: τῶν οὐρανῶν
  choice: ng langit
  rationale: Ito ang natural na anyong Tagalog ng natatanging pananalita ni Mateo at hindi ito ipinapantay nang tahasan sa “kaharian ng Diyos.”
theological_decisions:
- issue: Kahulugan ng “kaharian ng langit”
  choice: Pinanatili bilang “kaharian ng langit.”
  alternative: “paghahari ng Diyos” o “kaharian ng Diyos”
  rationale: Pinananatili nito ang natatanging pananalita ni Mateo at ang saklaw ng βασιλεία, nang hindi hinaharmonisa sa pananalita ng ibang Ebanghelyo o nilulutas kung paghahari lamang o sakop ang tinutukoy.
- issue: Aspekto ng ἤγγικεν
  choice: “malapit na,” na may talababa tungkol sa paglapit na naganap at nananatiling may bisa
  alternative: “papalapit na” o “darating na”
  rationale: Ang perpektong anyo ay hindi lamang nagsasabing may mangyayari pa; ipinapahayag nitong ang paglapit ay naganap na at may patuloy na resulta. Hindi nito nilulutas ang mas malawak na teolohiya tungkol sa panahon ng kaharian.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “humahayo” upang panatilihin ang diwa ng misyong pagpunta nang hindi nagiging masyadong kolokyal; ginamit ang “ipahayag” sa halip na mas eklesyastikal na “mangaral.”
