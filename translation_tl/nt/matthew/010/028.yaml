id: MAT.10.28
reference: Matthew 10:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: tl
  text: At huwag kayong matakot sa mga pumapatay ng katawan ngunit hindi kayang pumatay ng kaluluwa. Sa halip, matakot kayo sa may kakayahang pumuksa sa kaluluwa at katawan sa Gehenna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa impiyerno.” Ang salitang Griyego na “Gehenna” ay nagmula sa pangalan ng Lambak ng Hinnom at ginamit bilang tawag sa dako ng pangwakas na paghatol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: matakot
  rationale: Pinananatili ang iisang salitang-ugat sa magkasalungat na utos—“huwag kayong matakot” at “matakot kayo”—gaya ng pag-uulit sa Griyego.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: sa mga pumapatay
  rationale: Likas na salin sa Tagalog ng substantibong participle at pinananatili ang pangkalahatang pagtukoy sa uri ng mga taong pumapatay.
- source_word: σῶμα
  choice: katawan
  rationale: Tuwiran at karaniwang katumbas ng pisikal na katawan.
- source_word: ψυχήν
  choice: kaluluwa
  rationale: Sa malinaw na pagsalungat dito sa katawan, pinananatili ng “kaluluwa” ang pagkakaibang ipinahahayag ng teksto; palalabnawin ito ng “buhay.”
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: hindi kayang pumatay
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang kawalan ng kakayahan.
- source_word: μᾶλλον
  choice: sa halip
  rationale: 'Ipinakikita ang pagtutuwid at matinding pagsalungat: huwag silang katakutan; sa halip, ang isa ang katakutan.'
- source_word: τὸν δυνάμενον
  choice: sa may kakayahang
  rationale: Natural ngunit hindi tahasang pinapangalanan ang tinutukoy, gaya ng substantibong participle sa Griyego.
- source_word: ἀπολέσαι
  choice: pumuksa
  rationale: Ipinahahayag ang mabigat at tiyak na kapahamakan o paghatol nang hindi nililinaw nang higit sa sinasabi ng pandiwang Griyego ang eksaktong kalikasan nito.
- source_word: ἐν γεέννῃ
  choice: sa Gehenna
  rationale: Pinananatili ang partikular na terminong Griyego at ang pinagmulang Hudyo nito, sa halip na agad itong palitan ng isang salitang may mas malawak na tradisyunal na pakahulugan.
theological_decisions:
- issue: Pagkakakilanlan ng “may kakayahang pumuksa sa kaluluwa at katawan sa Gehenna”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto
  alternative: Diyos; Satanas
  rationale: Bagaman pinakamalamang na ang Diyos ang tinutukoy bilang may pangwakas na kapangyarihang humatol, hindi siya tahasang pinangalanan ng pariralang Griyego. Pinananatili ng salin ang pagiging di-tahas ng teksto.
- issue: Pagsasalin ng γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Pinangangalagaan ng transliterasyon ang terminong nasa orihinal at ang kaugnayan nito sa Lambak ng Hinnom; ibinibigay sa talababa ang pamilyar na interpretibong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang matinding pag-uulit ng “matakot,” ang pagkakaiba ng katawan at kaluluwa, at ang di-tahas na pagkakakilanlan ng may kapangyarihang humatol.
