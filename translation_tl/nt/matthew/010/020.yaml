  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: tl
  text: Sapagkat hindi kayo ang nagsasalita, kundi ang Espiritu ng inyong Ama ang nagsasalita sa loob ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ninyo.” Ang Griego ay literal na “sa loob ninyo,” ngunit sa kontekstong ito maaari rin itong magpahiwatig na ang pagsasalita ng Espiritu ay naipahahayag sa pamamagitan ng mga alagad.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang pangako, at tuwirang inilalahad ng “hindi” ang pagtanggi.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: kayo ang nagsasalita
  rationale: Ang hayag at may-diin na ὑμεῖς at ang konstruksyong οἱ λαλοῦντες ay likas na naipapahayag sa Tagalog sa hulma na “hindi kayo ang nagsasalita.”
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong sugnay, ang “kundi” ang natural at malinaw na panandang Tagalog para sa matibay na pagsalungat at pagtutuwid.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: ang Espiritu ng inyong Ama
  rationale: Tuwirang pinananatili nito ang kaugnayan ng Espiritu sa Ama ng mga alagad; hindi idinaragdag ang “makalangit” sapagkat wala iyon sa talata.
- source_word: τὸ λαλοῦν
  choice: ang nagsasalita
  rationale: Ang pag-uulit ng “ang nagsasalita” ay natural sa Tagalog at malinaw na iniuugnay ang kasalukuyan at nagpapatuloy na kilos sa Espiritu.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Ang “sa inyo” ang natural na Tagalog na malapit sa literal na “in you” at hindi agad nagpapasya kung ang diin ay panloob na presensiya o pagsasalitang naipahahayag sa pamamagitan nila.
theological_decisions:
- issue: Kung ang ἐν ὑμῖν ay tumutukoy sa presensiya sa loob ng mga alagad o sa instrumental na pagkilos sa pamamagitan nila
  choice: sa inyo
  alternative: sa pamamagitan ninyo
  rationale: Ang ἐν ay tuwirang “in,” ngunit sa konteksto ng pagsasalita maaari rin itong magpahiwatig na ang Espiritu ay nagsasalita sa pamamagitan ng mga alagad. Pinananatili ng pangunahing salin ang mas malapit at bahagyang bukas na pananalita; inilalagay sa talababa ang mas instrumental na pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang ipakita ang paliwanag na ugnayan sa naunang talata, at pinanatili ang pag-uulit ng “nagsasalita” upang maipakita ang diin at pagtutuwid ng orihinal.
