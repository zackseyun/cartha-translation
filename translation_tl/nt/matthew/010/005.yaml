id: MAT.10.5
reference: Matthew 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: tl
  text: 'Isinugo ni Jesus ang labindalawang ito at binigyan sila ng tagubilin: “Huwag kayong pumunta sa daang patungo sa mga Hentil[a], at huwag kayong pumasok sa alinmang bayan ng mga Samaritano[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa daan ng mga Hentil.” Mas literal na pananalita tungkol sa daan o landas ang Griyego at malamang na tumutukoy sa pagtungo sa teritoryo ng mga Hentil.
    reason: lexical_alternative
  - marker: b
    text: O “sa alinmang bayang Samaritano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ang labindalawang ito
  rationale: Tuwirang pinatutungkulan ng demonstratibo at bilang ang pangkat na kababanggit lamang; hindi idinagdag ang ‘alagad’ sapagkat wala ito sa Griyego.
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Ipinahihiwatig ng pandiwa ang pagpapadala para sa isang atas o misyon; natural at marangal sa Filipino ang ‘isinugo.’
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: at binigyan sila ng tagubilin
  rationale: Isinasalin nang natural ang magkakaugnay na mga participle habang pinananatili ang malinaw na puwersang nag-uutos ng παραγγέλλω; hindi na kailangang ulitin ang literal na ‘na sinasabi.’
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: sa daang patungo sa mga Hentil
  rationale: Pinananatili ang larawan ng daan sa ὁδός at ipinahahayag ang malamang na diwa ng pagtungo sa teritoryo ng mga di-Judio, nang hindi lubusang inaalis ang leksikal na kalabuan.
- source_word: ἐθνῶν
  choice: mga Hentil
  rationale: Sa kontekstong Judio ng misyong ito, tumutukoy ito sa mga di-Judio; ‘mga Hentil’ ang karaniwang terminong biblikal sa Filipino.
- source_word: μὴ ἀπέλθητε
  choice: Huwag kayong pumunta
  rationale: Natural at tuwirang ipinahahayag ang pagbabawal ng μή kasama ng aorist subjunctive.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: sa alinmang bayan ng mga Samaritano
  rationale: Ang πόλις ay maaaring lungsod o bayan; mas hindi tiyak sa laki ang ‘bayan.’ Ang ‘alinmang’ ay natural na nagpapahayag sa Filipino ng di-tiyak na πόλιν sa saklaw ng pagbabawal.
- source_word: μὴ εἰσέλθητε
  choice: huwag kayong pumasok
  rationale: Tuwiran at natural na katumbas ng pagbabawal na pumasok.
theological_decisions:
- issue: Saklaw at tagal ng pagbabawal tungkol sa mga Hentil at mga Samaritano
  choice: Inilahad ito bilang tiyak na tagubilin sa pagsusugong ito sa labindalawa, nang walang idinagdag na pahiwatig na permanente ang pagbabawal.
  alternative: Gumamit ng pananalitang maaaring magmukhang ganap at panghabang-panahong pagbubukod sa mga Hentil at mga Samaritano.
  rationale: Malakas ang pagbabawal sa mismong talata, ngunit hindi nito tahasang tinatalakay ang tagal nito; kaya pinananatili ang puwersa at ang teolohikal na tensiyon nang walang idinadagdag na doktrina.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang ‘isinugo’ upang ipakita ang misyong ipinagkatiwala, at ‘tagubilin’ upang panatilihin ang puwersang direktiba nang hindi nagiging labis na militar ang tono. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
