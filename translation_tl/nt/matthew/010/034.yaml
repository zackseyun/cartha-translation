source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: tl
  text: “Huwag ninyong isipin na naparito ako upang magdala ng kapayapaan sa lupa.[a] Hindi ako naparito upang magdala ng kapayapaan kundi ng tabak.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pumarito ako.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “tabak.” Sa konteksto, inilalarawan nito ang pagkakabaha-bahaging idudulot ng pagdating ni Jesus, hindi ang paghimok sa karahasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Huwag ninyong isipin
  rationale: Ang μή kasama ng aorist subjunctive ay nagsasaad ng pagbabawal. Ang pariralang ito ay tuwiran at likas sa modernong Tagalog.
- source_word: ἦλθον
  choice: naparito ako
  rationale: Sa pahayag tungkol sa layunin ng misyon, likas at marangal sa Tagalog ang “naparito ako”; naipahihiwatig nito ang pagdating nang hindi dinaragdagan ang kahulugan.
- source_word: βαλεῖν
  choice: upang magdala
  rationale: Bagaman literal na “ihagis” o “ilagay” ang βάλλω, ang “magdala” ang malinaw na katumbas sa idyomang ito na may mga layong “kapayapaan” at “tabak.”
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Karaniwan at eksaktong katumbas ng εἰρήνη sa kontekstong ito.
- source_word: ἐπὶ τὴν γῆν
  choice: sa lupa
  rationale: Ipinahahayag nito ang malawak na saklaw ng γῆ. Ang “sa lupa” ay natural sa Tagalog at tumutukoy rito sa daigdig, hindi lamang sa isang lupain.
- source_word: ἀλλὰ μάχαιραν
  choice: kundi ng tabak
  rationale: Pinananatili ang matinding pagsalungat at ang kongkretong larawan ng μάχαιρα. Ang “tabak” ang malinaw at kinikilalang katumbas.
theological_decisions:
- issue: Kung papalitan ba ng interpretasyong “pagkakabaha-bahagi” ang larawang “tabak” sa pangunahing teksto
  choice: Panatilihin ang “tabak” sa pangunahing teksto
  alternative: pagkakabaha-bahagi
  rationale: Tahasang μάχαιραν (“tabak”) ang nasa Griyego. Ipinakikita ng kasunod na konteksto ang bunga nitong pagkakabaha-bahagi, ngunit hindi dapat alisin sa salin ang matinding talinghaga o ipakahulugan itong paghimok sa karahasan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “naparito” bilang angkop na biblikal ngunit hindi lipas na pananalita; pinanatili ang “tabak” upang huwag pahupain o lutasin sa pangunahing teksto ang talinghaga.
