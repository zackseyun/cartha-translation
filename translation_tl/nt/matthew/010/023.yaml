  to: Ngunit kapag inuusig nila kayo sa lungsod na ito, tumakas kayo sa ibang lungsod.[a] Sapagkat katotohanang sinasabi ko sa inyo, tiyak na hindi ninyo matatapos ang pagdaan sa mga lungsod ng Israel[b] hanggang sa dumating ang Anak ng Tao.[c]
