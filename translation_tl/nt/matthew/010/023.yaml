id: MAT.10.23
reference: Matthew 10:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: tl
  text: Ngunit kapag inuusig nila kayo sa lungsod na ito, tumakas kayo sa ibang lungsod.[a] Sapagkat katotohanang sinasabi ko sa inyo, tiyak na hindi ninyo matatapos ang pagdaan sa mga lungsod ng Israel[b] hanggang sa dumating ang Anak ng Tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumakas kayo sa kasunod na lungsod.” Sa Griyego, literal itong “sa iba/isa pang [lungsod],” at ipinahihiwatig lamang ang salitang “lungsod” mula sa naunang sugnay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tiyak na hindi ninyo matatapos ang mga lungsod ng Israel.” Nililinaw ng “matatapos ang pagdaan sa” ang ipinahihiwatig na paglalakbay sa mga lungsod bilang bahagi ng kanilang misyon.
    reason: lexical_alternative
  - marker: c
    text: Sadyang hindi nililinaw ang “hanggang sa dumating ang Anak ng Tao.” Iba-iba ang pagkaunawa kung tumutukoy ito sa pagbibigay-katwiran kay Jesus, sa isang pagdating para humatol, o sa kanyang pangwakas na pagbabalik.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: kapag
  rationale: Likas sa modernong Tagalog at naipahihiwatig ang isang maaaring mangyari o maulit na kalagayan, sa halip na isang tiyak at minsanang pangyayari lamang.
- source_word: διώκωσιν
  choice: inuusig nila
  rationale: Sa konteksto ng pagsusugo, tumutukoy ito sa mapusok at mapanganib na pag-uusig, hindi lamang sa literal na paghabol.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: sa lungsod na ito
  rationale: Pinananatili ang tahasang demonstratibong ταύτῃ at ang tuwirang himig ng tagubilin.
- source_word: φεύγετε
  choice: tumakas kayo
  rationale: Malinaw at agarang pautos ito na lumayo upang makaiwas sa pag-uusig.
- source_word: εἰς τὴν ἑτέραν
  choice: sa ibang lungsod
  rationale: Ang salitang 'lungsod' ay ipinahihiwatig mula sa naunang parirala; ang ἑτέραν ay natural na maisasalin bilang 'ibang' nang hindi ipinapalagay na tiyak na susunod na lungsod sa isang ruta.
- source_word: ἀμὴν
  choice: katotohanang
  rationale: Ang pormulang 'katotohanang sinasabi ko sa inyo' ay marangal at nauunawaan, at ipinapakita ang taimtim at makapangyarihang pagpapahayag.
- source_word: οὐ μὴ τελέσητε
  choice: tiyak na hindi ninyo matatapos na daanan
  rationale: Ipinakikita ng 'tiyak na hindi' ang mariing pagtanggi ng οὐ μή. Ginagawang hayag ng 'matatapos na daanan' ang gawaing ipinahihiwatig ng layong 'mga lungsod,' habang nilalagyan ng talababa ang literal na posibilidad.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: ang mga lungsod ng Israel
  rationale: Tuwirang pinananatili ang genitibong parirala at ang saklaw nito sa konteksto ng misyon.
- source_word: ἕως ἂν ἔλθῃ
  choice: bago dumating
  rationale: Sa negatibong pangunahing sugnay, natural sa Tagalog ang 'hindi ... bago dumating' at pinananatili nito ang hinaharap na hangganang ipinahihiwatig ng Griyego.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng titulong ito na nagpapanatili sa literal na anyo at sa biblikal at teolohikal na mga pahiwatig nito.
theological_decisions:
- issue: Kahulugan ng pagdating ng Anak ng Tao sa kontekstong ito
  choice: Panatilihin ang payak na 'bago dumating ang Anak ng Tao' nang hindi tinutukoy kung anong pangyayari ang tinutukoy.
  alternative: Tukuyin ito bilang muling pagkabuhay o pagbibigay-katwiran kay Jesus, paghatol sa Jerusalem, o pangwakas na pagbabalik.
  rationale: Hindi nililinaw ng tekstong Griyego rito kung alin sa mga pinagtatalunang pangyayari ang tinutukoy. Pinananatili ng salin ang sadyang pagiging bukas at ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lungsod' sa halip na mas lumang anyo, at ang 'tumakas kayo' upang mapanatili ang lakas ng pautos. Iniwasan ang paglalagay sa pangunahing teksto ng isang tiyak na eskatolohikal na interpretasyon.
