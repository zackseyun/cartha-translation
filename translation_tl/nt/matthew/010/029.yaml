- from: Hindi ba ipinagbibili ang dalawang maya sa halagang isang asarion[b]? Gayunman, ni isa sa kanila ay hindi mahuhulog sa lupa nang bukod sa inyong Ama.[a]
  to: Hindi ba ipinagbibili ang dalawang maya sa halagang isang asarion[b]? Gayunman, ni isa sa kanila ay hindi mahuhulog sa lupa nang wala ang inyong Ama.[a]
  rationale: Pinalitan ang di-likas na “nang bukod sa inyong Ama” ng “nang wala ang inyong Ama,” na mas natural na katumbas ng ἄνευ at nananatiling hindi doktrinal na pagpapaliwanag. Inayos din ang alternatibong pagbasa sa talababa upang hindi lamang ulitin ang pangunahing teksto habang pinananatili ang parehong kalabuan.
