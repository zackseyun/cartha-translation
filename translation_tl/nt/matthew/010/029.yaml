  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: tl
  text: Hindi ba ipinagbibili ang dalawang maya sa halagang isang asarion[b]? Gayunman, ni isa sa kanila ay hindi mahuhulog sa lupa nang wala ang inyong Ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hindi kasama ang inyong Ama.” Maaaring ipahiwatig ng parirala ang kanyang kaalaman, pangangalaga, o kalooban, ngunit hindi tinutukoy ng Griyego kung alin dito.
    reason: alternative_reading
  - marker: b
    text: Ang asarion ay isang maliit na baryang tanso ng Roma na napakababa ng halaga.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: maya
  rationale: Sa kontekstong ito, karaniwang tumutukoy ang salita sa mga maya, maliliit at karaniwang ibong mababa ang halaga. Mas tiyak at mas natural ang “maya” kaysa sa pangkalahatang “maliliit na ibon.”
- source_word: ἀσσαρίου
  choice: asarion
  rationale: Pangalan ito ng isang tiyak na maliit na baryang tanso ng Roma. Pinanatili ang makasaysayang katawagan at ipinaliwanag ang halaga nito sa talababa sa halip na tumbasan ng isang makabagong salapi.
- source_word: πωλεῖται
  choice: ipinagbibili
  rationale: Likas na katumbas sa Filipino ng pangkasalukuyang balintiyak na anyo at malinaw na ipinahahayag ang komersiyal na diwa.
- source_word: ἓν ἐξ αὐτῶν
  choice: ni isa sa kanila
  rationale: Natural na Filipino para sa partitive expression; kasama ng negatibong pandiwa, malinaw nitong ipinahahayag na walang kahit isang ibon ang eksepsiyon.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: mahuhulog sa lupa
  rationale: Tuwirang at likas na salin ng kilos na ipinahahayag ng parirala.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: nang bukod sa inyong Ama
  rationale: Pinananatili nito ang malawak at di-tiyak na kaugnayang ipinahahayag ng ἄνευ, nang hindi nililimitahan sa kaalaman, kalooban, pahintulot, o pangangalaga ng Ama.
- source_word: οὐχὶ ... ;
  choice: Hindi ba ...?
  rationale: Karaniwang anyo ng retorikal na tanong sa Filipino na umaasa ng sagot na oo.
- source_word: καὶ
  choice: Gayunman
  rationale: 'Inihahayag ang kontras: bagaman napakababa ng halaga ng mga maya, wala ni isa ang nahuhulog nang bukod sa Ama.'
theological_decisions:
- issue: Ang kahulugan ng “nang bukod sa inyong Ama” kaugnay ng banal na pagkalinga at pamamahala
  choice: Pinanatili sa pangunahing teksto ang di-tiyak na pariralang “nang bukod sa inyong Ama.”
  alternative: “nang hindi nalalaman ng inyong Ama” o “nang hindi ayon sa kalooban ng inyong Ama”
  rationale: Ipinahahayag ng talata ang kaugnayan ng Ama sa pangyayari, ngunit hindi tahasang tinutukoy ng Griyego kung kaalaman, kalooban, pahintulot, presensiya, o pangangalaga ang partikular na tinutukoy. Kaya hindi nilutas sa salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maya” bilang karaniwang katawagan sa ibon at pinanatili ang “asarion” para sa makasaysayang katiyakan. Ang bahagyang di-karaniwang “nang bukod sa inyong Ama” ay sinadyang panatilihin upang hindi gawing kaalaman lamang o kalooban lamang ang masaklaw na pahayag ng Griyego.
