  source_fidelity: Tumpak ang pagsasalin ng στρουθία bilang “maya,” ng ἀσσαρίου bilang “asarion,” ng presyo, at ng “ni isa sa kanila ... mahuhulog sa lupa.” Napapanatili rin ng “Gayunman” ang kontras na ipinahihiwatig sa konteksto. Gayunman, ang “nang bukod sa inyong Ama” ay hindi likas na Filipino at maaaring lumabo ang tungkulin ng ἄνευ. Ang “nang wala ang inyong Ama” ay mas idiomatiko at pinananatili ang hindi tinutukoy na uri ng pakikilahok ng Ama.
  naturalness: Makabago at angkop ang karamihan ng pahayag. Ang kinakailangang pagbabago ay ang pariralang “nang bukod sa,” na hindi karaniwang kolokasyon sa ganitong gamit. Ang “nang wala ang inyong Ama” ay malinaw, marangal, at natural sa Filipino.
  terminology: Ang “maya,” “asarion,” at “Ama” ay angkop. Ang talababa tungkol sa asarion ay wastong makasaysayang paliwanag. Ang talababa sa “Ama” ay maingat na hindi ipinapasok ang kaalaman, pangangalaga, o kalooban bilang tanging kahulugan.
