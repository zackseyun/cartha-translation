  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: tl
  text: Ngunit kapag isinuko nila kayo, huwag kayong mag-alala kung paano o kung ano ang sasabihin ninyo. Sapagkat sa oras na iyon ay ibibigay sa inyo[a] ang sasabihin ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang sinasabi rito kung sino ang magbibigay; ipinakikilala sa kasunod na talata ang Espiritu bilang ang nagsasalita sa pamamagitan nila.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ang ὅταν ay tumutukoy sa isang pangyayaring maaaring maganap sa hinaharap, samantalang ang δέ ay banayad na panandang nag-uugnay at naglilipat ng diwa; likas itong naipapahayag dito bilang “Ngunit kapag.”
- source_word: παραδῶσιν ὑμᾶς
  choice: ibinigay nila kayo
  rationale: Pinananatili nito ang diwa ng pag-abot o pagsuko sa kapangyarihan ng iba nang hindi idinaragdag sa talata kung kanino sila ibibigay. Hindi ginamit ang “ipagkanulo” sapagkat mas makitid iyon kaysa sa saklaw ng παραδίδωμι sa kontekstong panghukuman.
- source_word: μὴ μεριμνήσητε
  choice: huwag kayong mag-alala
  rationale: Natural at malinaw ito sa modernong Tagalog para sa pagbabawal sa balisang pag-iisip tungkol sa nalalapit na pagsasalita.
- source_word: πῶς ἢ τί λαλήσητε
  choice: kung paano o kung ano ang sasabihin ninyo
  rationale: Pinananatili ng “o” ang ἤ at ang pagkakaiba ng paraan ng pagsasalita at ng nilalaman ng sasabihin. Ang “sasabihin” ay mas likas sa Tagalog kaysa sa literal na “sasalitain.”
- source_word: δοθήσεται
  choice: ibibigay sa inyo
  rationale: Pinananatili ang panghinaharap na balintiyak na anyo ng Griyego at hindi tahasang pinapangalanan ang nagbibigay.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: sa oras na iyon
  rationale: Malapit ito sa anyo at diwa ng Griyego habang nananatiling natural at marangal sa kasalukuyang Tagalog.
- source_word: τί λαλήσητε
  choice: ang dapat ninyong sabihin
  rationale: Ipinapahayag nito ang nilalaman ng pananalitang kakailanganin nila sa sandaling iyon. Ang “dapat” ay likas na naghahatid ng diwa ng nakatakdang sabihin sa di-tuwirang tanong.
theological_decisions:
- issue: Hindi tahasang pinangalanang tagapagbigay sa δοθήσεται
  choice: Panatilihin ang balintiyak na “ibibigay sa inyo” at ipaliwanag sa talababa ang di-tahasang gumagawa.
  alternative: “ibibigay sa inyo ng Diyos” o “ibibigay sa inyo ng Espiritu”
  rationale: Hindi pinapangalanan ng Griyego ang nagbibigay sa talatang ito. Tinutukoy ng kasunod na talata ang Espiritu bilang nagsasalita sa pamamagitan nila, kaya hindi dapat unahan ng salin ang paglilinaw ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Iniwasan ang masyadong teknikal na pananalita at ang pagdaragdag ng “mga awtoridad,” sapagkat hindi tahasang binabanggit sa talata ang tatanggap sa kanila.
