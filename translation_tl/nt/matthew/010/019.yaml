    issue: Hindi idiomatiko ang “kapag ibinigay nila kayo.”
    rationale: Bagaman maaaring literal na iugnay sa παραδίδωμι, hindi ito ang karaniwang modernong Tagalog para sa paghandog o pagsuko ng isang tao sa iba. Ang “isinuko nila kayo” ay mas malinaw na naghahatid ng ‘hand over’ nang hindi ipinipilit ang ‘ipagkanulo.’
  - severity: low
