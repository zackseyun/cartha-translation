  source_fidelity: 'Ang pangkalahatang diwa at ayos ng talata ay tapat sa Griyego: napananatili ang kondisyong panghinaharap, ang pagbabawal sa pag-aalala, ang pagkakaiba ng “paano” at “ano,” at ang di-tahasang balintiyak na “ibibigay.” Gayunman, ang “ibinigay nila kayo” ay hindi likas para sa παραδῶσιν sa kontekstong ito at maaaring marinig na karaniwang “gave you” sa halip na “handed you over.” Ang “dapat ninyong sabihin” ay bahagyang nagdaragdag ng ideya ng obligasyon na hindi kailangang ipilit ng τί λαλήσητε.'
  naturalness: Natural ang karamihan ng pangungusap, ngunit mas idiomatiko at malinaw sa modernong Filipino ang “kapag isinuko nila kayo” para sa isang pag-abot sa iba, lalo na sa mapanganib o panghukom na kalagayan. Mas neutral din ang “ang sasabihin ninyo” kaysa “ang dapat ninyong sabihin.”
  terminology: Wasto ang “Espiritu” at ang pagpapanatili ng di-pinangalanang tagapagbigay sa pangunahing teksto. Walang kailangang dagdag na pangalang teolohikal o pagpapaliwanag sa teksto.
