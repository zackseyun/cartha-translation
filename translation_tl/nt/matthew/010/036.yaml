  text: And a man's enemies will be those of his own household[a].
translation:
  language: tl
  text: At ang magiging mga kaaway ng isang tao ay ang mga kasapi ng kanyang sambahayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang magiging mga kaaway ng isang tao ay ang mga kabilang sa sarili niyang sambahayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa naunang pahayag nang hindi nagdaragdag ng paliwanag.
- source_word: ἐχθροὶ
  choice: mga kaaway
  rationale: Likas at tuwirang katumbas ng pangngalang tumutukoy sa mga taong may pagkapoot o kumakalaban.
- source_word: τοῦ ἀνθρώπου
  choice: ng isang tao
  rationale: Ginagawang likas sa Tagalog ang genitibong parirala; ang “tao” ay maaaring kumatawan sa sinumang tao at hindi kailangang tukuying lalaki sa modernong Tagalog.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: ang mga kasambahay niya
  rationale: Tumutukoy sa mga kabilang sa sambahayan, hindi sa gusali; pinananatili rin ng “niya” ang tahasang kaugnayan sa taong tinutukoy.
theological_decisions:
- issue: Saklaw ng ἀνθρώπου bilang katawagang kumakatawan
  choice: isang tao
  alternative: isang lalaki
  rationale: Bagaman panlalaking isahan ang anyong Griyego, karaniwang kumakatawan dito ang ἄνθρωπος sa isang tao sa pangkalahatan. Ang “isang tao” ay parehong tumpak at likas sa Tagalog nang hindi nilulutas nang lampas sa pinagmulan ang kasarian ng tinutukoy.
- issue: Saklaw ng οἰκιακοί
  choice: mga kasambahay
  alternative: mga kapamilya
  rationale: Mas malawak ang οἰκιακοί kaysa sa pamilyang may ugnayan sa dugo at maaaring tumukoy sa lahat ng kabilang sa sambahayan. Kaya hindi ito nilimitahan sa “mga kapamilya.”
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “kasambahay” sa kahulugang mga kabilang sa sambahayan, hindi lamang mga empleyadong pantahanan; nililinaw ng talababa ang mas malawak na saklaw.
