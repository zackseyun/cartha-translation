id: MAT.10.11
reference: Matthew 10:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: tl
  text: Sa alinmang lungsod o nayon na pasukin ninyo, alamin ninyo[a] kung sino roon ang karapat-dapat[b], at manatili kayo roon hanggang sa umalis kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magtanong” o “magsiyasat.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “karapat-dapat” ay malamang na tumutukoy sa isang taong angkop o handang tumanggap sa mga isinugo, hindi sa isang taong nagtamo ng pabor ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: Sa alinmang lungsod o nayon
  rationale: Likas sa modernong Tagalog ang “sa alinmang” para sa di-tiyak na sugnay, habang pinananatili ng “lungsod o nayon” ang pagkakaiba ng πόλις at κώμη.
- source_word: εἰσέλθητε
  choice: na pasukin ninyo
  rationale: Ipinahahayag nito ang pagpasok sa alinmang pamayanan at maayos na umuugnay sa naunang pariralang panlunan.
- source_word: ἐξετάσατε
  choice: alamin ninyo
  rationale: Malinaw at natural itong utos na magsagawa ng sinadyang pagtatanong o pagsisiyasat upang matukoy ang isang tao, nang hindi gumagamit ng sobrang teknikal na salita.
- source_word: τίς ἐν αὐτῇ
  choice: kung sino roon
  rationale: Natural sa Tagalog ang “kung sino roon” at malinaw na tumutukoy sa taong nasa nabanggit na lungsod o nayon.
- source_word: ἄξιός ἐστιν
  choice: ang karapat-dapat
  rationale: Pinananatili nito ang evaluative na lakas at tunay na lawak ng ἄξιος, sa halip na tahasang paliitin ang kahulugan sa “mapagpatuloy” o “handang tumanggap.”
- source_word: κἀκεῖ μείνατε
  choice: at manatili kayo roon
  rationale: Ang “at” ay kumakatawan sa καί at ang “roon” sa ἐκεῖ; hindi dinaragdagan ng tahasang “sa bahay niya” ang hindi tuwirang sinabi sa Griyego.
- source_word: ἕως ἂν ἐξέλθητε
  choice: hanggang sa umalis kayo
  rationale: Likas at malinaw itong Tagalog para sa hangganang panahong umaabot sa kanilang pag-alis.
theological_decisions:
- issue: Kahulugan ng ἄξιος sa tagubilin sa mga isinugo
  choice: Panatilihin sa teksto ang “karapat-dapat,” na may talababa tungkol sa kontekstuwal na pagiging angkop o handang tumanggap sa mga isinugo.
  alternative: Isalin sa pangunahing teksto bilang “angkop,” “mapagpatuloy,” o “handang tumanggap.”
  rationale: Hindi tuwirang nililinaw ng talata ang lahat ng saklaw ng ἄξιος. Ang “karapat-dapat” ay nagpapanatili sa pagpapahalagang nasa salita, samantalang nililinaw ng talababa na hindi kailangang unawain ito bilang pagtatamo ng pabor ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang magalang na maramihang “ninyo/kayo,” at iniwasan ang sobrang pormal o makalumang pananalita. Nasa pangunahing teksto ang lahat ng panandang talababa.
