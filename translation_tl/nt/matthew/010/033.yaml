id: MAT.10.33
reference: Matthew 10:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: tl
  text: Ngunit ang sinumang magkaila sa akin sa harap ng mga tao, ikakaila ko rin siya sa harap ng aking Ama na nasa langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nasa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Ngunit ang sinumang
  rationale: Ipinakikita ng δέ ang pagsalungat sa naunang talata, at ang ὅστις kasama ng ἄν ay nagpapahayag ng pangkalahatang kondisyon. Likas sa makabagong Tagalog ang “ang sinumang” para sa saklaw na ito.
- source_word: ἀρνήσηταί με
  choice: magkaila sa akin
  rationale: Ang ἀρνέομαι ay maaaring mangahulugang magkaila o magtakwil. Ang “magkaila sa akin” ay malinaw sa konteksto ng hayagang pagkilala o pagtanggi kay Jesus at maaari ring ulitin sa kasunod na sugnay upang mapanatili ang paralelismo.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Ang ἔμπροσθεν ay “sa harap” o “sa presensya ng,” at ang ἀνθρώπων dito ay pangkalahatang tumutukoy sa mga tao. Hindi kailangang markahan ang kasarian sa Tagalog.
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: ikakaila ko rin siya
  rationale: Pinananatili ng “ikakaila” ang parehong pandiwa at ang matinding pagtutumbasan ng dalawang sugnay; isinasalin ng “rin” ang dagdag na diin ng κἀγώ, “ako rin.”
- source_word: τοῦ πατρός μου
  choice: aking Ama
  rationale: Tuwirang pinananatili ang ugnayang ipinahahayag ni Jesus sa “aking Ama,” nang walang dagdag na pagpapaliwanag.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: na nasa langit
  rationale: Bagaman maramihan ang οὐρανοῖς sa Griyego, “nasa langit” ang likas at karaniwang katumbas sa Tagalog. Itinatala sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Tumbasang pagkakaila
  choice: magkaila sa akin … ikakaila ko rin siya
  alternative: magtakwil sa akin … itatakwil ko rin siya
  rationale: Ang pag-uulit ng iisang salitang-ugat ay nagpapanatili sa solemne at retorikal na pagtutumbasan ng ἀρνέομαι sa dalawang sugnay, nang hindi dinaragdagan ang teksto ng mas tiyak na paliwanag tungkol sa uri o lawak ng pagtanggi.
- issue: Pangkalahatang pagtukoy ng ἀνθρώπων at αὐτόν
  choice: mga tao … siya
  alternative: mga lalaki … ang taong iyon
  rationale: Sa konteksto, pangkalahatan ang ἀνθρώπων at tumutukoy sa mga tao, hindi lamang sa kalalakihan. Ang “siya” ay likas na panghalip sa Tagalog at hindi nagtatakda ng kasarian na hindi kinakailangang ipahayag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magkaila” upang mapanatili ang pampublikong diwa ng pagtanggi at ang eksaktong paralelismo ng dalawang sugnay. Nasa wastong lugar sa pangunahing teksto ang marker na [a].
