id: MAT.10.17
reference: Matthew 10:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: tl
  text: Ngunit mag-ingat kayo sa mga tao,[a] sapagkat ibibigay nila kayo sa mga konseho, at hahagupitin nila kayo sa kanilang mga sinagoga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lalaki”; panlalaking maramihan ang salitang Griyego, ngunit tumutukoy rito sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: mag-ingat kayo
  rationale: Ang pautos na maramihan ay isang malinaw na babala laban sa panganib; natural at tuwiran sa modernong Tagalog ang “mag-ingat kayo.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat tungo sa babala; ang “Ngunit” ay angkop sa daloy.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: sa mga tao
  rationale: Kasama ng προσέχετε, tinutukoy ng ἀπό ang pinagmumulan ng panganib. Pangkalahatan ang ἀνθρώπων dito at hindi lamang mga lalaki.
- source_word: παραδώσουσιν
  choice: ibibigay ... sa
  rationale: Tumutukoy ito sa pagsasalin o pagbibigay ng isang tao sa kapangyarihan ng mga awtoridad; hindi nito kinakailangang ipahiwatig ang personal na pagtataksil.
- source_word: συνέδρια
  choice: mga konseho
  rationale: Ang maramihang anyo ay tumutukoy sa mga lokal na lupon na may tungkuling mamahala o humatol, hindi kinakailangang sa Sanhedrin ng Jerusalem.
- source_word: συναγωγαῖς
  choice: mga sinagoga
  rationale: Karaniwang salin ito para sa tiyak na mga lugar ng pagtitipon ng mga Judio.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na inuugnay ng panghalip ang mga sinagoga sa mga taong binanggit.
- source_word: μαστιγώσουσιν
  choice: hahagupitin
  rationale: Ipinapahayag nito ang pagpaparusa sa pamamagitan ng paghampas o paglatigo; dignified at malinaw ang “hahagupitin” sa Tagalog.
theological_decisions:
- issue: Pagpapahayag ng kasarian sa ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: 'Bagaman panlalaking maramihan ang anyong Griyego, pangkalahatan ang kahulugan nito rito: mga taong magiging kalaban, hindi lamang mga lalaking kalaban.'
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang hudisyal na diwa ng “mga konseho” at ang kongkretong katawagang “mga sinagoga,” nang hindi ipinapalagay na iisang sentral na Sanhedrin ang tinutukoy.
