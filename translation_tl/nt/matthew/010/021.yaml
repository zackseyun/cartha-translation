revisions:
- from: Isusuko ng isang kapatid na lalaki ang kapatid niyang lalaki upang patayin[a], at isusuko ng isang ama ang kanyang anak. Tatayo ang mga anak laban sa kanilang mga magulang at papatayin sila.
  to: Isusuko ng isang kapatid na lalaki ang kapatid niyang lalaki upang ipapatay[a], at isusuko ng isang ama ang kanyang anak. Tatayo ang mga anak laban sa kanilang mga magulang at papatayin sila.
  rationale: Pinalitan ang “upang patayin” ng “upang ipapatay” upang maipakita na ang kapatid at ama ay nagsusuko ng kanilang kaanak para ipapatay, hindi kinakailangang sila mismo ang tuwirang pumatay. Pinasimple rin ang talababa upang ang alternatibong “ipagkakanulo” ay tumukoy nang direkta sa παραδώσει at hindi lumikha ng hindi kailangang kalabuan sa layuning parirala.
