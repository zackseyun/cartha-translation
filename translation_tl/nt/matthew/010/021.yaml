review_pass:
  verdict: revise
  source_fidelity: Ang draft ay wastong nagpapakita ng magkakatugmang ugnayang pampamilya, ng pagbangon ng mga anak laban sa mga magulang, at ng pagpatay sa mga magulang. Gayunman, ang “upang patayin” pagkatapos ng “isusuko” ay maaaring basahing ang kapatid mismo ang papatay, samantalang ang παραδώσει ... εἰς θάνατον ay tumutukoy sa pagsuko/pagbibigay sa iba tungo sa kamatayan. Ang “upang ipapatay” ay mas malinaw na naghahayag ng pagsasalin sa kamay ng papatay nang hindi nagdaragdag ng tiyak na awtoridad o proseso.
  naturalness: Makabago at malinaw ang Tagalog. Ang “Tatayo ... laban sa” ay nauunawaan at malapit sa matingkad na pandiwang Griyego. Mas natural at mas tumpak sa ugnayan ng unang sugnay ang “upang ipapatay.”
  terminology: Ang “kapatid na lalaki,” “ama,” “anak,” at “mga magulang” ay angkop sa saklaw ng mga terminong Griyego. Ang “isusuko” ay mabuting katumbas ng παραδίδωμι; dapat lamang linawin ang hantungang “sa kamatayan” sa pamamagitan ng causative na “ipapatay.”
  issues:
  - severity: medium
    issue: Hindi sapat na malinaw ang “upang patayin” bilang katumbas ng εἰς θάνατον kasunod ng “isusuko.”
    rationale: Maaaring ipakahulugan nito na ang nagsusukong kapatid o ama ang tuwirang papatay. Ang Griyego ay nagsasaad ng pagbigay o pagsuko ng isang tao tungo sa kamatayan; ang “upang ipapatay” ay pinananatili ang relasyong ito.
  revised_text: Isusuko ng isang kapatid na lalaki ang kapatid niyang lalaki upang ipapatay[a], at isusuko ng isang ama ang kanyang anak. Tatayo ang mga anak laban sa kanilang mga magulang at papatayin sila.
