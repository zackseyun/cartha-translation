  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: tl
  text: Isusuko ng isang kapatid na lalaki ang kapatid niyang lalaki upang ipapatay[a], at isusuko ng isang ama ang kanyang anak. Tatayo ang mga anak laban sa kanilang mga magulang at papatayin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipagkakanulo”; ang pandiwa ay maaari ring magpahiwatig ng pagtataksil sa mga kontekstong may kataksilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: isusuko
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay ng isang tao sa kapangyarihan ng mga kalaban o mga awtoridad. Likas sa makabagong Tagalog ang “isusuko” at hindi nito ipinapalagay na pagtataksil ang pangunahing diwa, bagaman posible iyon sa konteksto.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: isang kapatid na lalaki ... kapatid niyang lalaki
  rationale: Pinananatili nito ang panlalaking kahulugan ng dalawang anyo ng ἀδελφός at ang madiing pag-uulit ng ugnayang pampamilya, habang ginagawang natural ang ayos sa Tagalog.
- source_word: εἰς θάνατον
  choice: upang patayin
  rationale: Ipinapahayag ng parirala ang hantungan o layon ng pagsuko—ang kamatayan. Mas natural sa Tagalog ang “upang patayin” kaysa sa literal ngunit alanganing “sa kamatayan.”
- source_word: πατὴρ τέκνον
  choice: isang ama ... kanyang anak
  rationale: Ang τέκνον ay anak anuman ang kasarian. Ang pag-uulit ng “isusuko” ay nilinaw mula sa elipsis ng Griego upang maging malinaw at natural sa Tagalog.
- source_word: ἐπαναστήσονται
  choice: tatayo ... laban sa
  rationale: Pinananatili ng “tatayo laban sa” ang matingkad na larawan ng pagbangon upang sumalungat, nang hindi ito nililimitahan sa pampolitikang paghihimagsik.
- source_word: τέκνα
  choice: mga anak
  rationale: Saklaw ng τέκνα ang mga anak anuman ang kasarian; ito ang karaniwan at tumpak na katumbas sa Tagalog.
- source_word: ἐπὶ γονεῖς
  choice: laban sa kanilang mga magulang
  rationale: Sa konteksto ng pagkapoot, ang ἐπί ay nangangahulugang “laban sa.” Ang “kanilang” ay likas na paglilinaw sa Tagalog.
- source_word: θανατώσουσιν
  choice: papatayin
  rationale: Tuwirang ipinahahayag nito ang pagsanhi ng kamatayan at pinananatili ang bigat ng kilos.
- source_word: αὐτούς
  choice: sila
  rationale: Ang panghalip ay tumutukoy sa pinakamalapit na pangngalan, ang mga magulang, at malinaw rin ang ugnayan sa Tagalog.
theological_decisions:
- issue: Kasarian at mga katawagang kumakatawan sa ugnayang pampamilya
  choice: Panatilihin ang “kapatid na lalaki” para sa ἀδελφός, ngunit gamitin ang malawak na “mga anak” at “mga magulang” para sa τέκνα at γονεῖς.
  alternative: Gamitin lamang ang “kapatid,” na maaaring tumukoy sa anumang kasarian.
  rationale: Tiyak na panlalaki ang ἀδελφός sa dalawang paglitaw nito rito, samantalang hindi tiyak sa kasarian ang τέκνα at γονεῖς. Pinananatili ng salin ang mga saklaw na ito nang hindi nagpapasok ng dagdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding pag-uulit ng mga ugnayang pampamilya at ang tuwirang larawan ng pagtindig laban sa mga magulang.
