lexical_decisions:
- source_word: Φίλιππος
  choice: Felipe
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan, sa halip na isalin ang kahulugan nito.
- source_word: Βαρθολομαῖος
  choice: Bartolome
  rationale: Ito ang natural at nakikilalang anyong Filipino ng personal na pangalan.
- source_word: Θωμᾶς
  choice: Tomas
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: Μαθθαῖος
  choice: Mateo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalan.
- source_word: ὁ τελώνης
  choice: na maniningil ng buwis
  rationale: Malinaw at likas sa modernong Filipino; saklaw nito ang opisyal na nangongolekta ng buwis o singil nang hindi gumagamit ng makalumang katawagan.
- source_word: Ἰάκωβος
  choice: Santiago
  rationale: Ginamit ang tradisyonal at madaling makilalang anyong Filipino para sa apostol sa mga talaan ng Bagong Tipan.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: na anak ni Alfeo
  rationale: Ginawang hayag ang ugnayang ama-anak na ipinahihiwatig ng Griyegong konstruksiyong genitibo.
- source_word: Ἁλφαίου
  choice: Alfeo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng personal na pangalan.
- source_word: Θαδδαῖος
  choice: Tadeo
  rationale: Tuwirang kumakatawan sa pagbasa ng SBLGNT at gumagamit ng natural na anyong Filipino.
- source_word: καὶ
  choice: at
  rationale: Pinanatili ang payak na koordinasyon ng talaan sa pamamagitan ng karaniwang pang-ugnay na Filipino.
theological_decisions:
- issue: Pagkakakilanlan ng huling apostol sa talata
  choice: Tadeo
  alternative: Lebeo; Lebeo na tinatawag na Tadeo; Judas na anak ni Santiago
  rationale: Θαδδαῖος ang nasa ibinigay na tekstong SBLGNT, kaya Tadeo ang nasa pangunahing teksto. Inilagay sa talababa ang ibang pagbasa ng mga manuskrito at ang katumbas na pangalan sa mga talaan ni Lucas, sa halip na pag-isahin ang magkakaibang tradisyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga nakaugaliang anyong Filipino ng mga pangalan at ang malinaw na pariralang “maniningil ng buwis.” Pinanatili ang anyo ng isang nagpapatuloy na talaan, kasama ang kuwit sa hulihan.
