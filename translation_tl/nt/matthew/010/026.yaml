  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: tl
  text: Kaya huwag kayong matakot sa kanila, sapagkat walang natatakpan na hindi malalantad, at walang nakatago na hindi malalaman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Kaya huwag kayong matakot sa kanila
  rationale: Ang “Kaya” ay natural na naghahatid ng inferensiyang ipinahihiwatig ng οὖν, habang pinananatili ng “sa kanila” ang malinaw na layon ng pagkatakot.
- source_word: κεκαλυμμένον
  choice: natatakpan
  rationale: Pinananatili nito ang kongkretong larawan ng isang bagay na may takip, sa halip na gawing mas abstrakto lamang na “inilihim.”
- source_word: ἀποκαλυφθήσεται
  choice: malalantad
  rationale: Natural na katumbas ito ng pag-aalis ng takip o paghahayag at akma sa kaibahan sa “natatakpan.”
- source_word: κρυπτὸν
  choice: nakatago
  rationale: Tuwirang inilalarawan nito ang bagay na nakubli o lihim.
- source_word: γνωσθήσεται
  choice: malalaman
  rationale: Tapat nitong ipinapahayag na ang nakatago ay magiging hayag sa kaalaman, nang hindi tinutukoy kung sino ang makaaalam.
theological_decisions:
- issue: Hindi tahasang tinutukoy kung sino ang maglalantad o kung sino ang makaaalam
  choice: Gumamit ng mga anyong “malalantad” at “malalaman” na walang idinagdag na gumaganap
  alternative: “ihahayag ng Diyos” o “malalaman ng lahat”
  rationale: Pasibo at walang tahasang ahente ang tekstong Griyego; ang pagdaragdag ng Diyos o ng lahat bilang gumaganap ay magpapaliit sa tunay na saklaw at ambiguwidad ng pahayag.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang balanseng paralelismo ng “walang natatakpan…” at “walang nakatago…,” nang walang di-kailangang talababa.
