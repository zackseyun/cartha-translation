  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: tl
  text: Katotohanang sinasabi ko sa inyo,[a] sa araw ng paghuhukom ay mas magaan ang sasapitin ng lupain[b] ng Sodoma at Gomorra kaysa sa bayang iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Amen, sinasabi ko sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring paikliin bilang “Sodoma at Gomorra”; literal na sinasabi ng Griyego na “lupain ng Sodoma at Gomorra.”
    reason: lexical_alternative
  - marker: c
    text: O “lungsod na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Ipinahahayag nito sa natural na modernong Tagalog ang mariin at taimtim na pormulang paniniguro ni Jesus. Nananatili sa talababa ang mas literal na anyong may “Amen.”
- source_word: ἀνεκτότερον
  choice: mas magaan ang sasapitin
  rationale: Ang συγκριτικό na ἀνεκτότερον ay tumutukoy sa isang bagay na mas kayang tiisin. Sa Tagalog, ang “mas magaan ang sasapitin” ay natural at malinaw sa konteksto ng paghuhukom nang hindi tinutukoy kung ano mismo ang hatol.
- source_word: γῇ Σοδόμων καὶ Γομόρρων
  choice: ng lupain ng Sodoma at Gomorra
  rationale: Pinananatili ang tahasang γῇ (“lupain”) at ang kaugnayang ipinapahayag ng mga henitibong pangalan ng lugar.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: sa araw ng paghuhukom
  rationale: Likas at tumpak itong katumbas ng parirala, at pinananatili ang pagtukoy sa takdang araw ng banal na paghatol nang hindi nagdaragdag ng sistematikong detalye.
- source_word: τῇ πόλει ἐκείνῃ
  choice: sa bayang iyon
  rationale: Maaaring tumukoy ang πόλις sa isang lungsod o bayan. Ang “bayan” ay angkop sa konteksto ng mga pamayanang pinupuntahan ng mga alagad, habang pinananatili ng “iyon” ang tiyak na pagtukoy.
theological_decisions:
- issue: Kalikasan ng “araw ng paghuhukom”
  choice: Isinalin bilang isang takdang araw ng banal na paghuhukom, nang walang idinagdag na paliwanag tungkol sa eksaktong kaayusan o paraan nito.
  alternative: Unawain bilang mas pangkalahatang panahon ng paghatol.
  rationale: Likas na ipinahihiwatig ng parirala ang panghinaharap na banal na paghuhukom, ngunit hindi dapat dagdagan ng salin ang sinasabi ng talata.
- issue: Paghahambing ng bigat ng sasapitin
  choice: Pinanatili na mas magaan ang sasapitin ng Sodoma at Gomorra kaysa sa bayang tumanggi sa mga isinugo.
  alternative: Gawing tahasang paghahambing ng mga antas ng kaparusahan.
  rationale: Ipinahihiwatig ng teksto ang magkaibang bigat ng sasapitin, ngunit hindi nito tahasang ginagamit ang salitang “parusa”; kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Tinitiyak ko sa inyo” para sa taimtim na pormula, “sasapitin” upang maging natural ang eliptikong paghahambing sa Griyego, at “bayan” bilang angkop na katumbas ng πόλις sa konteksto.
