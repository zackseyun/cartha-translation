id: MAT.10.6
reference: Matthew 10:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: tl
  text: Sa halip, pumunta kayo sa mga nawawalang tupa ng sambahayan ng Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga tupang nawala mula sa sambahayan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: pumunta kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay likas na ipinapahayag sa modernong Tagalog sa pamamagitan ng “pumunta kayo.”
- source_word: δὲ μᾶλλον
  choice: Sa halip
  rationale: Magkasamang ipinahihiwatig ng mga salita ang pagsalungat at paglilipat ng patutunguhan mula sa mga ipinagbawal sa naunang talata.
- source_word: πρὸς
  choice: sa
  rationale: Kasunod ng pandiwa ng paggalaw, natural na ipinakikita ng “sa” ang patutunguhan.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: mga nawawalang tupa
  rationale: Pinananatili nito ang lantad na talinghaga at ang kalagayang ipinahihiwatig ng perpektong participle nang hindi nililimitahan sa pisikal na pagkawasak.
- source_word: οἴκου Ἰσραήλ
  choice: ng sambahayan ng Israel
  rationale: Ang “sambahayan” ay nagpapanatili sa korporatibo at biblikal na diwa ng οἶκος, sa halip na gawing payak lamang na “mga Israelita.”
theological_decisions:
- issue: Matalinghagang paglalarawan sa Israel
  choice: Panatilihin ang “mga nawawalang tupa ng sambahayan ng Israel.”
  alternative: “mga Israelitang naligaw”
  rationale: Hayag sa Griyego ang larawan ng mga tupa at may mahalagang ugnayan ito sa pastoral at propetikong paglalarawan sa Kasulatan; hindi ito dapat tahimik na gawing paliwanag.
- issue: Ugnayan ng genitive na οἴκου Ἰσραήλ sa “mga nawawalang tupa”
  choice: Sa pangunahing teksto, unawain bilang mga nawawalang tupa na kabilang sa sambahayan ng Israel.
  alternative: Mga tupang nawala mula sa sambahayan ng Israel.
  rationale: Maaaring ipahiwatig ng konstruksiyon ang pagiging kabilang o ang pinagmulan ng pagkaligaw. Pinili sa teksto ang pinakanatural na pagbasa ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang biblikal na talinghagang “tupa” at ang korporatibong katawagang “sambahayan ng Israel,” habang ginawang natural ang pautos at pagsalungat.
