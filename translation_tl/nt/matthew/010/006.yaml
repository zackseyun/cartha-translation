  source_fidelity: Tumpak na naipapahayag ng “Sa halip, pumunta kayo” ang utos na πορεύεσθε at ang paglilihis na ipinahihiwatig ng δὲ μᾶλλον sa kaagad na naunang pagbabawal. Pinananatili ng “mga nawawalang tupa” ang hayag na metapora ng τὰ πρόβατα τὰ ἀπολωλότα, at ang “ng sambahayan ng Israel” ay maayos na katumbas ng οἴκου Ἰσραήλ nang hindi ito ipinapaliwanag bilang simpleng “mga Israelita.”
  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino Tagalog. Ang “pumunta kayo” ay karaniwang anyo ng maramihang utos, at ang “sambahayan ng Israel” ay marangal ngunit nauunawaan at angkop sa biblikal na rehistro.
  terminology: Ang “tupa,” “nawawalang,” at “sambahayan ng Israel” ay pare-pareho sa metaporikal at korporatibong wika ng pinagmulan. Hindi nagdaragdag ang salin ng doktrinal na pagpapakahulugan.
