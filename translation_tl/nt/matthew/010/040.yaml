  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: tl
  text: Ang tumatanggap sa inyo ay tumatanggap sa akin[a], at ang tumatanggap sa akin ay tumatanggap sa nagsugo sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinatanggap” o “malugod na tinatanggap.” Ang pandiwang Griyego ay maaaring mangahulugang tumanggap, tanggapin, o malugod na tanggapin, lalo na sa pagtanggap sa isang sugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Ang tumatanggap
  rationale: Ang articular present participle ay ginamit bilang pangngalan at tumutukoy nang pangkalahatan sa sinumang tumatanggap. Natural sa modernong Tagalog ang “ang tumatanggap” at napapanatili nito ang anyong pangkalahatan ng Griyego.
- source_word: δέχομαι / δέχεται
  choice: tumatanggap
  rationale: 'Inulit ang iisang pandiwa upang bumuo ng sadyang kawing ng pagtanggap: sa mga alagad, kay Jesus, at sa nagsugo sa kanya. Saklaw ng “tumatanggap” ang pagtanggap, pagkilala, at malugod na pagtanggap sa isang sugo.'
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Pangalawang panauhang maramihan ito at tumutukoy sa mga alagad ni Jesus. Malinaw na maramihan ang “inyo” sa Tagalog.
- source_word: ἐμέ
  choice: sa akin
  rationale: Tuwirang tumutukoy kay Jesus bilang unang panauhang isahan; hinihingi ng pandiwang Tagalog na “tumatanggap” ang pariralang may “sa” kapag tao ang layon.
- source_word: τὸν ἀποστείλαντά με
  choice: sa nagsugo sa akin
  rationale: Ang articular aorist participle ay gumaganap bilang pangngalan. Maikli at natural ang “nagsugo sa akin” at hindi nito tahasang dinaragdagan ng “Ama” ang sinabi ng Griyego.
theological_decisions:
- issue: Pagkakakilanlan ng nagsugo kay Jesus
  choice: nagsugo sa akin
  alternative: Ama na nagsugo sa akin
  rationale: Malinaw sa konteksto at teolohiya ni Mateo na ang Ama ang tinutukoy, ngunit “ang nagsugo sa akin” lamang ang tahasang sinasabi ng Griyego. Pinananatili ng salin ang mismong pahayag at hindi isinasama sa pangunahing teksto ang isang paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang tatlong ulit na “tumatanggap” upang maipakita ang retorikal na kawing sa orihinal. Ginamit ang “sa inyo” sa halip na mas mabigat na “sa inyong lahat,” sapagkat malinaw na maramihan na ang panghalip.
