  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng labindalawang apostol: una[a], si Simon na tinatawag na Pedro, at ang kapatid niyang si Andres; si Santiago na anak ni Zebedeo, at ang kapatid niyang si Juan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, maaaring magpahiwatig ang “una” na may natatanging katayuan si Simon sa labindalawa, hindi lamang na siya ang una sa pagkakasunod-sunod.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Hindi tahasang isinalin
  rationale: Mahinang panandang pandiskurso ito na likas nang naipahihiwatig sa paglipat sa talaan; ang pagdaragdag ng “ngayon” o “at” ay hindi kailangan sa natural na Tagalog.
- source_word: δώδεκα ἀποστόλων
  choice: labindalawang apostol
  rationale: Ang “apostol” ang kinikilalang salin sa kontekstong ito para sa natatanging pangkat na isinugo ni Jesus.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Ito ang mga pangalan
  rationale: Pinananatili nito ang demonstratibong kayarian habang natural sa modernong Tagalog.
- source_word: πρῶτος
  choice: una
  rationale: Tuwirang ipinapakita nito ang unang pangalan sa talaan nang hindi sapilitang nagpapasya kung may pahiwatig ding katanyagan o pangunguna.
- source_word: ὁ λεγόμενος
  choice: na tinatawag na
  rationale: Malinaw at likas na ipinakikilala nito ang pangalang Pedro bilang katawagan kay Simon.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: ang kapatid niyang
  rationale: Natural na Tagalog ito para sa literal na ugnayang magkapatid; tumutukoy muna kay Simon at pagkatapos ay kay Santiago.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: na anak ni Zebedeo
  rationale: Ipinahahayag nito ang ipinahihiwatig na ugnayang ama-anak sa genitibong pagkakakilanlan.
theological_decisions:
- issue: Kahulugan ng πρῶτος kaugnay ni Simon/Pedro
  choice: Isinalin bilang “una” sa talaan nang walang tahasang pag-aangkin tungkol sa primasiya ng awtoridad.
  alternative: Maaaring magpahiwatig ang “una” ng katanyagan o pangunguna sa labindalawa.
  rationale: Maaaring tumukoy ang salita sa pagkakasunod-sunod at maaari ring magdala ng diwang katanyagan. Pinananatili ng pangunahing teksto ang payak na kahulugan, habang inilalahad sa talababa ang posibleng karagdagang pahiwatig nang hindi pumapanig sa isang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang mga nakaugaliang pangalang biblikal na Pedro, Andres, Santiago, Juan, at Zebedeo; iniwasan ang di-kinakailangang panandang “ngayon” para sa δὲ.
