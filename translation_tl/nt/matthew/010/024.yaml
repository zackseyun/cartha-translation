id: MAT.10.24
reference: Matthew 10:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: tl
  text: Hindi nakahihigit ang alagad sa guro, ni ang alipin[a] sa kanyang amo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang salitang Griyego na δοῦλος ay maaaring tumukoy sa alipin o lingkod, ayon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “panginoon.” Ang κύριος ay maaaring mangahulugang “Panginoon,” ngunit dito ay tumutukoy ito sa taong nakatataas sa alipin sa paghahambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: alagad
  rationale: Pinananatili ng “alagad” ang diwa ng isang taong natututo sa ilalim ng isang guro at sumusunod sa kanya; mas malawak ito kaysa sa akademikong “mag-aaral.”
- source_word: ὑπέρ
  choice: nakahihigit sa
  rationale: Sa paggamit na may akusatibo, ipinahihiwatig ng ὑπέρ ang pagiging mas mataas sa katayuan o antas. Likas at malinaw sa Filipino ang “nakahihigit sa.”
- source_word: διδάσκαλος
  choice: guro
  rationale: Ang “guro” ang tuwiran at karaniwang katumbas ng διδάσκαλος at malinaw itong naiiba sa “amo” sa ikalawang paghahambing.
- source_word: δοῦλος
  choice: alipin
  rationale: Sa paghahambing na ito, mahalaga ang mababang katayuan at pagpapailalim ng δοῦλος sa κύριος; mas tumpak itong naipapahayag ng “alipin” kaysa sa mas malawak na “lingkod.”
- source_word: κύριος
  choice: amo
  rationale: Sa pares na alipin–amo, tumutukoy ang κύριος sa taong may kapangyarihan sa alipin, hindi sa isang banal na titulo. Ang “amo” ang pinakanatural na katumbas sa kontekstong ito.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tumutukoy ang panghalip sa amo ng alipin; likas na ipinahahayag ito ng “kanyang” sa Filipino.
- source_word: οὐδέ
  choice: ni
  rationale: Maikli at natural na iniuugnay ng “ni” ang ikalawang negatibong paghahambing sa una.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa paghahambing tungkol sa katayuang panlipunan
  choice: alipin
  alternative: lingkod
  rationale: Itinatampok ng pares na δοῦλος–κύριος ang pagpapailalim ng isang alipin sa kanyang amo. Gayunman, maaaring masaklaw ng salitang Griyego ang “lingkod” sa ibang konteksto, kaya inilagay ang alternatibo sa talababa.
- issue: Pagpapakahulugan sa κύριος sa di-banal na konteksto
  choice: amo
  alternative: Panginoon
  rationale: Bagaman maaari ring mangahulugan ang κύριος na “Panginoon,” malinaw na bahagi ito rito ng paghahambing sa ugnayang alipin–amo at hindi ginagamit bilang banal na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos na “Hindi nakahihigit…” upang maging natural sa kasalukuyang pananalita, habang pinananatili ang magkatimbang na pares na alagad–guro at alipin–amo.
