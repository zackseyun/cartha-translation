  text: As you enter the house[a], greet it.
translation:
  language: tl
  text: Sa pagpasok ninyo sa bahay[a], batiin ninyo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “batiin ninyo ang sambahayan.” Sinasabi sa Griyego na “batiin ninyo ito,” na tumutukoy sa bahay at malamang na ginagamit bilang metonimiya para sa mga nakatira roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Pagpasok ninyo
  rationale: Ang kasalukuyang participle na maramihan ay gumaganap na pang-abay kaugnay ng pautos; ang temporal na pariralang ito ay natural sa makabagong Tagalog at pinananatili ang magkasabay na diwa ng pagpasok at pagbati.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang pang-ugnay ang δέ. Sapat nang ipinahihiwatig ng daloy at ng temporal na pariralang “Pagpasok ninyo” ang ugnayan, kaya hindi kailangan ang mas mariing “ngunit” o “at.”
- source_word: οἰκίαν
  choice: sa bahay
  rationale: Maaaring tumukoy ang οἰκία sa gusali o sa sambahayan. Ang “bahay” ang pinakatuwirang kahulugan sa konteksto ng pagpasok, habang naiiwang posible ang metonimikong pagtukoy sa mga naninirahan doon.
- source_word: ἀσπάσασθε
  choice: batiin ninyo
  rationale: Ang aorist middle imperative na ikalawang panauhang maramihan ay isang tuwirang utos. Ang “batiin ninyo” ay malinaw, likas, at magalang sa modernong Tagalog.
- source_word: αὐτήν
  choice: ito
  rationale: Ang pambabaeng panghalip na isahan ay umaayon sa οἰκίαν. Bagaman walang kasariang pambalarila ang panghalip sa Tagalog, pinananatili ng “ito” ang tahasang pagtukoy ng Griyego sa bahay sa halip na agad itong gawing “sila.”
theological_decisions:
- issue: Metonimikong pagbati sa bahay o tahasang pagbati sa mga nakatira rito
  choice: Panatilihin sa pangunahing teksto ang “batiin ninyo ito”
  alternative: “batiin ninyo ang sambahayan” o “batiin ninyo ang mga naroon”
  rationale: Tahasang tumutukoy ang αὐτήν sa οἰκίαν. Pinananatili nito ang anyo at bahagyang tensiyon ng orihinal, samantalang nililinaw sa talababa na malamang na ang mga nakatira sa bahay ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay” sa halip na mas pormal na “sambahayan” sa pangunahing teksto upang mapanatili ang konkretong larawan ng pagpasok, at ang pangmaramihang “ninyo” ay tumutugma sa mga alagad na kinakausap.
