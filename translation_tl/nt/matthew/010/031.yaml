  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: tl
  text: Kaya huwag kayong matakot; higit kayong mahalaga kaysa sa maraming maya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Kaya huwag
  rationale: Ang οὖν ay naghahayag ng konklusyon mula sa naunang pangangatwiran tungkol sa pagkalinga ng Ama, at ang μὴ kasama ng pautos na φοβεῖσθε ay pagbabawal. Likas at malinaw sa modernong Tagalog ang “Kaya huwag.”
- source_word: φοβεῖσθε
  choice: kayong matakot
  rationale: Ang “matakot” ang likas na katumbas ng φοβέομαι sa kontekstong ito; ang “huwag kayong matakot” ay nagpapanatili sa maramihang utos.
- source_word: πολλῶν στρουθίων
  choice: sa maraming maya
  rationale: Sa agarang konteksto ng Mateo 10:29, ang στρουθία ay maliliit na ibong karaniwang tinutukoy bilang mga maya. Ang “sa maraming maya” ay natural na kasunod ng paghahambing.
- source_word: διαφέρετε
  choice: higit ... mahalaga kaysa
  rationale: Dito ang διαφέρω ay nangangahulugang nakahihigit sa halaga o kabuluhan, hindi lamang naiiba. Ang “higit na mahalaga kaysa” ay malinaw at natural sa Tagalog.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Ang hayag na panghalip ay nagbibigay-diin sa mga alagad bilang inihahambing sa mga maya. Naipahahayag ito ng “kayo” nang hindi kinakailangang dagdagan ng “mismo.”
theological_decisions:
- issue: Paghahambing sa halaga ng mga alagad at ng mga maya
  choice: higit kayong mahalaga kaysa sa maraming maya
  alternative: mas mahalaga kayo kaysa sa maraming maya
  rationale: Pinananatili ng salin ang paghahambing na ipinahihiwatig ng διαφέρετε at ang diin sa higit na pagkalinga ng Diyos sa mga alagad, nang hindi ipinahihiwatig na wala siyang pagkalinga sa mga hayop.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Kaya” upang malinaw na iugnay ang talata sa naunang pangangatwiran, at “maya” bilang karaniwang katawagan sa maliliit na ibong tinutukoy sa konteksto.
