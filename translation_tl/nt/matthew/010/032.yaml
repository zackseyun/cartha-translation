id: MAT.10.32
reference: Matthew 10:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: tl
  text: Kaya, ang sinumang kumilala sa akin sa harap ng mga tao ay kikilalanin ko rin sa harap ng aking Ama na nasa langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Kaya, ang sinumang
  rationale: Ang “sinuman” ay likas na Filipino para sa pangkalahatan at saklaw-lahat na pahayag ng Πᾶς...ὅστις. Pinananatili ng “Kaya” ang ugnayang lohikal ng οὖν sa naunang konteksto.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: kumilala sa akin
  rationale: Sa kontekstong ito, ang ὁμολογέω ay tumutukoy sa hayagang pagkilala kay Jesus. Ang “kumilala sa akin” ay likas sa Filipino at hindi kahoy na salin ng ἐν.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Tumpak na ipinapahayag ng parirala ang pampublikong pagkilala sa presensya ng ibang tao. Ang ἀνθρώπων ay pangkalahatang tumutukoy sa mga tao, kaya hindi kailangang gumamit ng salitang tumutukoy lamang sa mga lalaki.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: kikilalanin ko rin
  rationale: Pinananatili ang magkatugmang gamit ng ὁμολογέω sa dalawang sugnay. Ipinahahayag ng “rin” ang diin ng κἀγώ, habang ang layon ay malinaw mula sa “ang sinumang” at sa estruktura ng pangungusap.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: aking Ama na nasa langit
  rationale: Ito ay malinaw at likas na modernong Filipino para sa karaniwang pahayag ni Mateo. Ang isahang “langit” ang normal na idyoma sa Filipino bagaman maramihan ang anyo ng οὐρανοῖς.
theological_decisions:
- issue: Ang pampublikong pagkilala kay Jesus at ang katumbas na pagkilala ni Jesus
  choice: Isinalin bilang tuwirang pangako ng katumbas na pagkilala sa harap ng Ama.
  alternative: Tahasang tukuyin ito bilang pangyayari sa huling paghuhukom o bilang pormula tungkol sa paraan ng kaligtasan.
  rationale: Hindi tahasang nililinaw ng talata ang panahon o ang mas malawak na sistematikong mekanismo. Pinananatili ng salin ang bigat ng pangako nang hindi nagdaragdag ng doktrinal na detalye.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kumilala/kikilalanin” upang mapanatili ang pag-uulit sa Griyego at ang diwa ng hayagang pagkilala, nang hindi nagdaragdag ng denominasyonal o sistematikong paliwanag.
