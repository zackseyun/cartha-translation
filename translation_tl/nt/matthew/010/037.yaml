  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: tl
  text: Ang umiibig sa ama o ina nang higit kaysa sa akin[a] ay hindi karapat-dapat sa akin; at ang umiibig sa anak na lalaki o anak na babae nang higit kaysa sa akin ay hindi karapat-dapat sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang higit sa akin.” Ipinahahayag ng pariralang Griyego ang pagmamahal sa isang tao nang higit kaysa kay Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ang umiibig
  rationale: Ang artikulo at pangkasalukuyang pandiwaring ginamit bilang pangngalan ay tumutukoy sa sinumang kinikilala sa ganitong pag-ibig. Likas at marangal sa Tagalog ang “ang umiibig” at napapanatili nito ang pangkalahatang isahan.
- source_word: πατέρα ἢ μητέρα
  choice: sa ama o ina
  rationale: Tuwirang isinalin ang mga pangngalang pampamilya nang hindi idinaragdag ang “kanyang,” na ipinahihiwatig lamang ngunit wala sa Griyego.
- source_word: ὑπὲρ ἐμέ
  choice: nang higit kaysa sa akin
  rationale: Sa kontekstong paghahambing, ipinahahayag ng ὑπέρ ang mas malaking pag-ibig o pagbibigay-priyoridad. Malinaw at likas sa modernong Tagalog ang pariralang ito.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ay hindi karapat-dapat sa akin
  rationale: Pinananatili nito ang tuwirang ugnayan ng ἄξιος at μου nang hindi idinaragdag ang mga paliwanag na “maging alagad ko” o “mapabilang sa akin.”
- source_word: καὶ
  choice: at
  rationale: Ang payak na pangatnig ay tapat sa magkatulad at inuulit na kayarian ng dalawang sugnay.
- source_word: υἱὸν ἢ θυγατέρα
  choice: sa anak na lalaki o anak na babae
  rationale: Nililinaw ng Tagalog ang pagkakaibang kasarian sa υἱός at θυγάτηρ. Hindi idinagdag ang panghalip na paari na wala sa tekstong Griyego.
theological_decisions:
- issue: Ang kahilingan ni Jesus kaugnay ng pag-ibig at katapatan sa pamilya
  choice: Inilalarawan ang pag-ibig kay Jesus bilang dapat manaig kahit sa pag-ibig sa pinakamalalapit na kapamilya.
  alternative: Palambutin ito bilang “hindi ako minamahal nang gayon din,” o palakasin bilang pagkapoot sa pamilya.
  rationale: Paghahambing ng prayoridad ang ipinahahayag ng ὑπὲρ ἐμέ. Pinananatili ng salin ang matinding kahilingan at hatol ng talata nang hindi itinatanggi ang kabutihan ng pag-ibig sa pamilya at nang hindi inaangkat ang mas matinding pananalita mula sa ibang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “umiibig” sa halip na mas kolokyal na “nagmamahal” upang mapanatili ang marangal na rehistro at ang magkatulad na anyo ng dalawang sugnay. Pinanatili ang matalim na “hindi karapat-dapat sa akin” sa halip na lagyan ng paliwanag na wala sa orihinal.
