  text: But even the hairs of your head are all numbered[a].
translation:
  language: tl
  text: Ngunit maging ang lahat ng buhok sa inyong ulo ay nabilang na[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang na.” Maaaring idiin ng perpektong balintiyak na anyo sa Griyego ang isang natapos na kilos na may nagpapatuloy na resulta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: inyong
  rationale: Pangalawang panauhang maramihan na paari; likas itong ipinapahayag sa Tagalog bilang “inyong.”
- source_word: δὲ
  choice: Ngunit
  rationale: Pinananatili ang banayad na pagsalungat o paglipat ng diwa mula sa naunang pangungusap.
- source_word: καὶ
  choice: maging
  rationale: 'May mapagdiing diwa rito: maging ang maliliit at paisa-isang buhok ay kabilang sa sinasabi.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: ang lahat ng buhok sa inyong ulo
  rationale: Ang “buhok sa inyong ulo” ang natural na makabagong Tagalog para sa genitibong parirala; inilapit ang “lahat” dito upang malinaw ang kabuuang saklaw.
- source_word: πᾶσαι
  choice: lahat
  rationale: Ipinahahayag ang ganap na kabuuan ng mga buhok nang hindi nagpapalawak sa teksto.
- source_word: ἠριθμημέναι εἰσίν
  choice: ay bilang na
  rationale: Natural na Tagalog na naghahayag ng kalagayang bunga ng natapos na pagbibilang, na angkop sa periphrastic perfect passive.
theological_decisions:
- issue: Lawak ng kaalaman o pangangalaga ng Diyos na ipinahihiwatig
  choice: Tuwirang panatilihin ang konkretong larawan na ang lahat ng buhok ay bilang na.
  alternative: Palawakin bilang tahasang pahayag tungkol sa pangangalaga, pagkontrol, o probidensiya ng Diyos.
  rationale: Hindi tahasang binabanggit sa talata ang doktrinal na paliwanag; dapat hayaang lumitaw ang implikasyon mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang “inyong” ayon sa ὑμῶν at ang “bilang na” upang likas na maipahayag ang kasalukuyang kalagayang bunga ng naunang pagbibilang.
