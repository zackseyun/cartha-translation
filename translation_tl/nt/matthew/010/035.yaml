  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: tl
  text: Sapagkat naparito ako upang pag-alitin ang isang lalaki at ang kanyang ama[a], ang isang anak na babae at ang kanyang ina, at ang isang manugang na babae at ang kanyang biyenang babae[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “upang paghiwalayin.” Ang pandiwang Griyego ay nangangahulugang maghati o lumikha ng pagkakahati, ngunit ipinakikita ng mga kasunod na konstruksyong Griyego ang pagsalungat sa ugnayan ng mga kapamilya.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na νύμφη ay maaari ring mangahulugang “babaeng ikakasal” o “nobya” sa ibang konteksto; dito, “manugang na babae” ang kahulugan dahil itinatambal ito sa “biyenang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: naparito ako
  rationale: Ang aorist ng ἔρχομαι ay tumutukoy sa pagparito o misyon ni Jesus; natural at malinaw sa Tagalog ang “naparito ako.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita nitong paliwanag ang pangungusap kaugnay ng naunang sinabi, kaya pinanatili ang pang-ugnay.
- source_word: διχάσαι
  choice: upang pag-alitin
  rationale: Batayang diwa nito ang paghahati o paglikha ng pagkakahati. Dahil sa sunod-sunod na κατά na nagpapahayag ng pagsalungat, malinaw na naihahayag ng “pag-alitin” ang hidwaan sa pagitan ng mga kapamilya, hindi lamang ang pisikal o abstraktong paghihiwalay.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Bagaman maaari itong tumukoy sa tao sa pangkalahatan, lalaki ang tinutukoy sa paralelismong kasama ng anak na babae at manugang na babae.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: at ang kanyang ama
  rationale: Sa konstruksyong “pag-alitin ang X at Y,” ang pagsalungat na ipinahahayag ng κατά ay natural na naipapakita sa Tagalog sa pamamagitan ng paglalagay sa dalawang panig bilang magkatunggali.
- source_word: θυγατέρα
  choice: isang anak na babae
  rationale: Tuwiran, tiyak, at natural na katumbas sa modernong Tagalog.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: at ang kanyang ina
  rationale: Kasama ng pandiwang “pag-alitin,” malinaw nitong ipinahahayag ang pagsalungat ng anak na babae at ng kanyang ina.
- source_word: νύμφην
  choice: isang manugang na babae
  rationale: Maaari ring mangahulugang “babaeng ikakasal” o “nobya,” ngunit ang pagkatambal nito sa πενθερά ay tumutukoy rito sa manugang na babae.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: at ang kanyang biyenang babae
  rationale: Pinananatili nito ang tiyak na ugnayang pampamilya at ang paralelismong nasa Griyego.
theological_decisions:
- issue: Ang diwa ng ipinahayag na layunin ng pagparito ni Jesus
  choice: Panatilihin ang matinding pananalitang nagsasaad na ang pagparito ni Jesus ay nagdudulot ng hidwaan maging sa loob ng pamilya.
  alternative: Ipaliwanag sa mismong talata na ang hidwaan ay bunga lamang ng magkakaibang pagtugon kay Jesus, o pahinain ito bilang karaniwang paghihiwalay.
  rationale: Tahasan ang Griyego tungkol sa paghahati at pagsalungat sa pamilya. Hindi dapat alisin ang tensiyong ito, ngunit hindi rin dapat idagdag sa salin ang paliwanag na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Tagalog. Ginamit ang “pag-alitin” upang maging natural ang paulit-ulit na pagsalungat sa loob ng pamilya habang pinananatili ang matinding puwersa ng pahayag. Ang “biyenang babae” ay sadyang tiyak upang tumugma sa pambabaeng anyo ng πενθερά.
