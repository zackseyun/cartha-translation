id: MAT.10.25
reference: Matthew 10:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: tl
  text: Sapat na sa alagad ang maging tulad ng kanyang guro, at sa alipin ang maging tulad ng kanyang amo. Kung tinawag nilang Beelzebul[a] ang pinuno ng sambahayan, gaano pa kaya ang mga kabilang sa kanyang sambahayan!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Beelzebub,” isang nakaugaliang ibang anyo ng pangalan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Sapat na
  rationale: Likas at tuwirang katumbas ng predikatibong pang-uri na nagpapahayag ng kasapatan.
- source_word: μαθητῇ
  choice: sa alagad
  rationale: Pinananatili ng “alagad” ang ugnayan ng tagasunod at guro, hindi lamang ang akademikong diwa ng “estudyante.”
- source_word: ἵνα γένηται
  choice: ang maging
  rationale: Likas sa Filipino pagkatapos ng “Sapat na sa alagad” at pinananatili ang diwa ng pag-abot sa kalagayang katulad ng guro.
- source_word: διδάσκαλος
  choice: guro
  rationale: Malinaw na katambal ng “alagad” at hindi nalilito sa κύριος sa kasunod na parirala.
- source_word: δοῦλος
  choice: alipin
  rationale: Ipinapakita ang mababang katayuan at pagkakasailalim na mahalaga sa paghahambing sa κύριος.
- source_word: κύριος
  choice: amo
  rationale: Sa paghahambing na alipin–amo, ito ang likas na katawagang Filipino at hindi nagpapahiwatig dito ng tuwirang titulong kristolohikal.
- source_word: οἰκοδεσπότην
  choice: pinuno ng sambahayan
  rationale: Ipinahahayag ang awtoridad sa buong sambahayan at iniuugnay nang malinaw sa οἰκιακούς.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Sinusunod ang anyong nasa tekstong Griyego ng SBLGNT.
- source_word: ἐπεκάλεσαν
  choice: tinawag nilang
  rationale: Tuwirang ipinapahayag ang pagtawag o pagtukoy sa isang tao sa isang pangalan.
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kaya
  rationale: Karaniwang idyomang Filipino para sa mas-matinding pangangatwiran ng parirala.
- source_word: οἰκιακοὺς
  choice: mga kabilang sa kanyang sambahayan
  rationale: Sinasaklaw nito ang lahat ng kasapi ng sambahayan at hindi lamang ang mga alipin o tagapaglingkod.
theological_decisions:
- issue: Kahulugan ng κύριος sa paghahambing tungkol sa sambahayan
  choice: amo
  alternative: Panginoon
  rationale: Ang agarang katambal na δοῦλος at ang larawang pansambahayan ay tumutukoy sa relasyong panlipunan ng alipin at amo, hindi tahasang sa isang banal na titulo.
- issue: Kahulugan ng δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Binibigyang-diin ng paghahambing sa κύριος ang pagkakasailalim at katayuang nakatali sa amo; mas tumpak dito ang “alipin” kaysa sa mas malawak na “lingkod.”
- issue: Di-binanggit na pandiwa sa huling sugnay
  choice: Pinanatili ang elipsis sa “gaano pa kaya ang mga kabilang…”
  alternative: “gaano pa kaya nila tatawaging gayon ang mga kabilang…”
  rationale: Walang inuulit na pandiwa sa Griyego; malinaw at natural din sa Filipino ang biglang paghahambing, kaya hindi kailangang tahasang idagdag ang ipinahihiwatig na kilos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sambahayan” upang mapanatili ang ugnayan ng οἰκοδεσπότης at οἰκιακοί. Inilagay ang tandang-talababa pagkatapos ng “Beelzebul,” ang salitang aktuwal na tinutukoy nito.
