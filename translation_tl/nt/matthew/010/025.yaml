  source_fidelity: Tumpak na naipapahayag ang ἀρκετόν, ang magkatambal na μαθητής–διδάσκαλος at δοῦλος–κύριος, at ang a fortiori na πόσῳ μᾶλλον. Ang “pinuno ng sambahayan” ay isang katanggap-tanggap na modernong katumbas ng οἰκοδεσπότης at ang “mga kabilang sa kanyang sambahayan” ay pinananatiling malawak gaya ng οἰκιακούς.
