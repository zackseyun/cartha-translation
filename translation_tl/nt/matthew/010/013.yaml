  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: tl
  text: At kung karapat-dapat[b] ang bahay[a], dumating nawa rito ang inyong kapayapaan; ngunit kung hindi ito karapat-dapat, bumalik nawa sa inyo ang inyong kapayapaan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sambahayan” o “tahanan.” Ang salitang Griyego para sa “bahay” ay maaaring tumukoy sa tirahan at, sa pagpapalawak ng diwa, sa mga taong nakatira roon.
    reason: lexical_alternative
  - marker: b
    text: Ang “karapat-dapat” dito ay nangangahulugang angkop na tumanggap sa mga sugo at sa kanilang kapayapaan, hindi walang kasalanan sa moral na diwa.
    reason: cultural_note
  - marker: c
    text: O “muling bumaling sa inyo ang inyong kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: bahay
  rationale: Pinanatili ang tuwirang kahulugan ng salitang Griyego. Sa konteksto, maaari rin itong tumukoy sa sambahayan o sa mga taong nakatira roon, kaya nilinaw ang saklaw sa talababa.
- source_word: ἀξία
  choice: karapat-dapat
  rationale: Pinananatili nito ang evaluative na diwa ng ἄξιος nang hindi ito pinakikitid sa pagiging tumatanggap lamang. Sa konteksto, tumutukoy ito sa pagiging angkop na tumanggap sa mga sugo at sa kanilang pagbati ng kapayapaan.
- source_word: ἐλθάτω
  choice: dumating
  rationale: Isinasalin ang ikatlong panauhang pautos bilang tuwirang pahayag na nagpapahintulot o nag-uutos na dumating ang kapayapaan, nang hindi pinahihina bilang isang hangarin lamang.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Ito ang karaniwang katumbas at pinananatili ang mas malawak na diwa ng kabutihan at pagpapalang kaugnay ng pagbati nang hindi iyon tahasang idinaragdag sa teksto.
- source_word: ἐπ’ αὐτήν
  choice: dito
  rationale: Likas sa Tagalog ang deiktikong 'dito' para sa kapayapaang dumarating sa bahay na tinutukoy; naiiwasan din nito ang mabigat na literal na 'sa ibabaw nito' habang pinananatili ang direksiyon.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Tuwirang ipinahahayag ang direksiyon pabalik sa mga alagad; ang ideya ng 'pabalik' ay nasa pandiwang bumalik.
- source_word: ἐπιστραφήτω
  choice: bumalik
  rationale: Natural na ipinahahayag sa Tagalog ang utos na ang kapayapaan ay hindi manatili sa bahay kundi magbalik sa mga alagad.
- source_word: μὲν ... δὲ
  choice: kung ...; ngunit kung ...
  rationale: Malinaw at likas na naihahatid ang magkatapat na kondisyon nang hindi gumagamit ng mabigat na pormulasyon.
theological_decisions:
- issue: Kalikasan ng “inyong kapayapaan”
  choice: Pinanatili ang “inyong kapayapaan” bilang kapayapaang ipinahahayag o hatid ng mga alagad, na maaaring dumating sa bahay o bumalik sa kanila.
  alternative: “inyong pagbati ng kapayapaan” o “pagpapala ng kapayapaang binibigkas ninyo”
  rationale: Inilalarawan ng teksto ang kapayapaan sa kongkreto at halos naililipat na paraan, ngunit hindi nito ipinaliliwanag kung isa lamang itong pagbati o isang hiwalay na espirituwal na bisa. Pinananatili ng salin ang larawang ito at ang teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang maikli at balanseng estruktura ng dalawang kondisyon, gayundin ang personipikadong larawan ng kapayapaang dumarating at bumabalik.
