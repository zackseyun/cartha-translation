  to: At kung karapat-dapat[b] ang bahay[a], dumating nawa rito ang inyong kapayapaan; ngunit kung hindi ito karapat-dapat, bumalik nawa sa inyo ang inyong kapayapaan.[c]
  rationale: Pinalitan ang dalawang payak na anyo ng pandiwa ng “dumating nawa” at “bumalik nawa” upang malinaw na maipahayag ang mga pautos ng Griyego nang likas sa Filipino. Pinalitan ang “dito” ng “rito,” na mas angkop na deiktikong pagtukoy sa bahay na kababanggit lamang. Walang binago sa kahulugan, sa ambigwidad hinggil sa kalikasan ng “inyong kapayapaan,” o sa mga talababa.
