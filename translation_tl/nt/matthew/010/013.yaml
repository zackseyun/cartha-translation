  naturalness: Kailangan ng maliit na pagwawasto upang gawing di-malabo ang puwersang pautos ng dalawang pandiwa at ang pagtukoy sa bahay. Ang “nawa” ay likas na paraan sa makabagong Filipino upang ihayag ang ikatlong panauhang pautos o panawagan sa ganitong konteksto.
  terminology: Ang “bahay,” “karapat-dapat,” at “kapayapaan” ay angkop at matapat na mga katumbas. Ang mga talababa ay kapaki-pakinabang, maingat, at hindi nagdadagdag ng doktrinal na pagpapakahulugan.
  issues:
