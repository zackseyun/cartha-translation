id: MAT.10.14
reference: Matthew 10:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: tl
  text: At sinumang hindi tumanggap sa inyo o makinig sa inyong mga salita[a], sa paglabas ninyo mula sa bahay o bayang iyon[c], ipagpag ninyo ang alikabok mula sa inyong mga paa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “o dinggin ang inyong mga salita.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ipagpag ang alikabok mula sa inyong mga paa” ay isang simbolikong paraan ng paglayo at pagpapahayag ng paghatol laban sa mga tumanggi sa mensahe.
    reason: cultural_note
  - marker: c
    text: O “sa bahay o lungsod na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: sinumang hindi
  rationale: Likas na ipinapahayag sa Tagalog ang di-tiyak at pangkalahatang diwa ng konstruksiyong may ἄν, nang hindi pinahihina ang kaugnayan nito sa kasunod na utos.
- source_word: δέξηται ὑμᾶς
  choice: tumanggap sa inyo
  rationale: Saklaw nito kapuwa ang magiliw na pagtanggap sa mga sugo at ang pagtanggap sa kanilang misyon, nang hindi nililimitahan sa simpleng pagpapatuloy sa bahay.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: o makinig sa inyong mga salita
  rationale: Ang 'makinig' ay likas sa modernong Tagalog at nagpapahiwatig ng pakikinig sa mensahe, ngunit hindi ipinapasok ang mas tiyak na diwa ng pagsunod.
- source_word: ἐξερχόμενοι ἔξω
  choice: paglabas ninyo
  rationale: Tumpak at maikli nitong inilalahad ang kasabay na kalagayan ng pag-alis bago isagawa ang pangunahing utos.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: sa bahay o bayang iyon
  rationale: Ang 'iyon' ay likas na sumasaklaw sa dalawang pinag-uugnay na lokasyon sa Tagalog. Ang 'bayan' ay hindi nagpapalagay na malaking lungsod ang πόλις.
- source_word: ἐκτινάξατε
  choice: ipagpag ninyo
  rationale: Ito ang malinaw at karaniwang pandiwang Tagalog para sa marahas o mariing pag-aalis ng alikabok sa pamamagitan ng pagpag.
- source_word: τὸν κονιορτὸν
  choice: ang alikabok
  rationale: Tiyak na tumutukoy ang κονιορτός sa alikabok, hindi sa pangkalahatang dumi.
- source_word: τῶν ποδῶν ὑμῶν
  choice: mula sa inyong mga paa
  rationale: Malinaw nitong ipinapahayag ang pag-aalis ng alikabok mula sa mga paa.
theological_decisions:
- issue: Simbolikong pagkilos laban sa mga tumatanggi sa mensahe ng mga alagad
  choice: Panatilihin sa pangunahing teksto ang kongkretong utos na 'ipagpag ninyo ang alikabok mula sa inyong mga paa.'
  alternative: Idagdag ang paliwanag na 'bilang patotoo laban sa kanila' o ipakahulugang tuwiran bilang paghatol.
  rationale: Hindi tahasang ipinaliliwanag ng talatang ito ang simbolo. Ang pagpapanatili sa larawan ay umiiwas sa pagpasok ng mga salita mula sa mga kahalintulad na salaysay; inilalagay sa talababa ang maikling kontekstuwal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'tumanggap,' 'makinig,' at 'ipagpag' bilang natural at tumpak na mga salita; iniwasan ang labis na pormal o makalumang ayos. Inilagay ang bawat talababa kaagad sa bahaging tinutukoy nito.
