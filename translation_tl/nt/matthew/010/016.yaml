  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: tl
  text: “Tingnan ninyo, isinusugo ko kayo na gaya ng mga tupa sa gitna ng mga lobo. Kaya maging matalino kayo tulad ng mga ahas at dalisay tulad ng mga kalapati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Likas at tuwirang panawag-pansin sa modernong Filipino; pinananatili ang diin ng ἰδού.
- source_word: ἀποστέλλω
  choice: isinusugo
  rationale: Ipinahahayag ang awtoritatibong pagpapadala, hindi lamang karaniwang pagpapaalis o pagpapunta.
- source_word: φρόνιμοι
  choice: matalino
  rationale: Saklaw nito ang praktikal na karunungan at maingat na paghatol na hinihingi sa mapanganib na kalagayan.
- source_word: ἀκέραιοι
  choice: walang halong masama
  rationale: Ang salita ay literal na may diwang ‘walang halo’ at sa konteksto ay tumutukoy sa pagiging dalisay at hindi mapaminsala; iniiwasan ng saling ito ang pahiwatig na lubos na walang kasalanan.
- source_word: ὄφεις
  choice: mga ahas
  rationale: Karaniwan at tumpak na katumbas sa Filipino, nang walang di-kailangang arkaikong kulay.
- source_word: περιστεραί
  choice: mga kalapati
  rationale: Karaniwan at malinaw na tawag sa ibong ginagamit sa paghahambing.
theological_decisions:
- issue: Ugnayan ng karunungan at kadalisayan
  choice: Pinanatili ang magkatabing utos na maging matalino at walang halong masama.
  alternative: Ipaliwanag ang talata bilang utos na maging tuso ngunit inosente.
  rationale: Hindi ginagawang ‘tuso’ ang φρόνιμος, na maaaring magpahiwatig ng panlilinlang, at hindi rin pinapawi ang sinadyang tensiyon sa pagitan ng pag-iingat at di-pananakit.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘kayo na gaya’ upang maging likas ang paghahambing, at pinanatili ang matingkad na larawan ng mga tupa, lobo, ahas, at kalapati.
