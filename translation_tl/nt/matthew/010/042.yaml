  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: tl
  text: At sinumang magpainom sa isa sa maliliit na ito[a] ng kahit isang tasa lamang ng malamig na tubig dahil alagad siya[b]—tunay na sinasabi ko sa inyo—tiyak na hindi niya mawawala ang kanyang gantimpala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “maliliit na ito” ay malamang na tumutukoy sa mga hamak o mababa ang katayuan sa mga tagasunod ni Jesus, hindi lamang sa mga bata.
    reason: cross_reference
  - marker: b
    text: 'Mas pormal: “sa pangalan ng isang alagad.” Ipinahihiwatig ng pariralang Griyego na ginawa ito dahil kinikilalang alagad ang tumatanggap.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: sinumang
  rationale: Likas na ipinapahayag ng “sinumang” ang di-tiyak at pangkalahatang diwa ng panghalip na may ἄν.
- source_word: ποτίσῃ
  choice: magpainom
  rationale: Tuwirang ipinahahayag nito ang pagbibigay ng maiinom at natural itong gamitin kasama ng “isang tasa ... ng malamig na tubig.”
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: isa sa maliliit na ito
  rationale: Pinananatili nito ang talinghagang μικροί nang hindi ito nililimitahan sa mga bata o tahasang pinapalitan ng isang interpretasyong panlipunan.
- source_word: ποτήριον ψυχροῦ
  choice: isang tasa ... ng malamig na tubig
  rationale: Ang “tubig” ay likas na ipinahihiwatig ng pang-uri sa Griyego; malinaw at karaniwan ang ganitong pahayag sa Filipino.
- source_word: μόνον
  choice: kahit ... lamang
  rationale: Ipinakikita nito ang kaliitan ng handog—isang tasa lamang—habang naipahahayag ng “kahit” ang diin na maging ang gayong payak na gawa ay kabilang sa pangako.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: dahil sa pagiging alagad nito
  rationale: Ipinahahayag nito na ang pagkilos ay batay sa pagkakakilanlan ng tumatanggap bilang alagad, nang hindi nagdaragdag ng ritwal o pormulang diwa sa “pangalan.”
- source_word: ἀμὴν λέγω ὑμῖν
  choice: tunay na sinasabi ko sa inyo
  rationale: Pinananatili nito ang taimtim at may-awtoridad na diin ng pormula sa malinaw at marangal na makabagong Filipino.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: tiyak na hindi niya mawawala
  rationale: Ang “tiyak na hindi” ay malinaw na naghahatid ng mariing pagtanggi ng οὐ μή.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: ang kanyang gantimpala
  rationale: Ang “gantimpala” ang natural na katumbas sa konteksto at hindi nito nililimitahan ang μισθός sa literal na sahod.
theological_decisions:
- issue: Ang tinutukoy ng “maliliit na ito”
  choice: Pinanatili bilang “maliliit na ito,” na sa konteksto ay maaaring tumukoy sa mga alagad na mababa o tila walang halaga sa paningin ng iba.
  alternative: Mga literal na bata lamang, o mga baguhan/mahihinang mananampalataya lamang.
  rationale: Ang konteksto ay tungkol sa pagtanggap sa mga alagad, ngunit hindi tahasang nililimitahan ng teksto ang ekspresyon; kaya pinanatili ang lawak at talinghaga nito.
- issue: Diwa ng εἰς ὄνομα μαθητοῦ
  choice: “dahil sa pagiging alagad nito”
  alternative: “sa pangalan ng isang alagad” o “bilang isang alagad”
  rationale: Nililinaw ng salin ang batayan ng gawa—ang pagkakakilanlan ng tumatanggap bilang alagad—habang ibinibigay sa talababa ang mas pormal na anyo upang mapanatili ang tunay na saklaw ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nito” upang malinaw na iugnay ang pagiging alagad sa tumatanggap at maiwasan ang di-kailangang pagtukoy sa kasarian. Pinanatili ang “maliliit” sa pangunahing teksto upang hindi tahasang lutasin ang lawak ng tinutukoy.
