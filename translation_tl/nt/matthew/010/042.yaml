  source_fidelity: Tumpak na naisasalin ang pangkalahatang kondisyon (ὃς ἂν), ang payak na kaloob na isang tasa ng malamig na tubig, ang mariing katiyakan ng οὐ μή, at ang gantimpala. Ang “maliliit na ito” ay wastong pinananatiling hindi nililimitahan sa literal na mga bata. Ang “dahil sa pagiging alagad nito” ay tumutukoy sa batayang ipinahihiwatig ng εἰς ὄνομα μαθητοῦ, ngunit maaari pang gawing mas malinaw at natural nang hindi binabago ang diwa.
