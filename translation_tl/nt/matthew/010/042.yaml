  terminology: Ang “magpainom,” “maliliit,” “malamig na tubig,” at “gantimpala” ay angkop sa modernong Filipino Tagalog at sa konteksto. Ang talababa sa “maliliit” ay maingat na hindi nagpapasya nang lampas sa teksto; ang alternatibong pormal para sa εἰς ὄνομα μαθητοῦ ay angkop.
