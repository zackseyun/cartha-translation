base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: tl
  text: Ang sinasabi ko sa inyo sa dilim[a] ay sabihin ninyo sa liwanag; at ang naririnig ninyo sa tainga[b] ay ipahayag ninyo sa mga bubungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang palihim … nang hayagan”; pinananatili ng Griyego ang larawang “sa dilim … sa liwanag.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa tainga,” isang larawan ng pribadong pagsasabi. Ang mga bubong ng mga bahay noon ay karaniwang patag at maaaring gamiting lantad at mataas na lugar para sa pampublikong pagpapahayag.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ang sinasabi ko sa inyo
  rationale: Natural na Filipino para sa substantival relative clause at sa tuwirang pagtuturo ni Jesus; pinananatili rin ang aspektong kasalukuyan ng λέγω.
- source_word: ἐν τῇ σκοτίᾳ
  choice: sa dilim
  rationale: Pinananatili ang malinaw na larawan at ang pagtutunggali nito sa 'sa liwanag,' sa halip na agad itong ipakahulugang 'nang palihim.'
- source_word: εἴπατε
  choice: sabihin ninyo
  rationale: Tuwiran at natural na pautos sa Filipino, na angkop sa aorist imperative.
- source_word: ἐν τῷ φωτί
  choice: sa liwanag
  rationale: Pinananatili ang metaporikal na kaparis ng 'sa dilim' at ang diwa ng hayagang pagsasalita.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: ang naririnig ninyo nang pabulong
  rationale: Ang literal na 'naririnig ninyo sa tainga' ay alanganin at maaaring maging walang saysay sa modernong Filipino. Ang 'nang pabulong' ay likas na naghahatid ng idyomatikong diwa ng pribadong pagsasabi, bagaman ipinaliliwanag ito sa talababa.
- source_word: κηρύξατε
  choice: ipahayag ninyo
  rationale: Nagpapahayag ng lantad at pampublikong pagbabalita nang hindi nililimitahan ang salita sa pormal na pangangaral.
- source_word: ἐπὶ τῶν δωμάτων
  choice: mula sa mga bubungan
  rationale: Natural na Filipino para sa pagpapahayag mula sa mataas at lantad na bubong; ipinapakita ng 'mula sa' ang pinagmumulan ng tinig habang pinananatili ang sinaunang larawan.
theological_decisions:
- issue: Kung literal na pananatilihin o ipapaliwanag ang mga larawan ng dilim/liwanag at tainga/bubungan
  choice: Panatilihin ang dilim, liwanag, at mga bubungan sa pangunahing teksto, ngunit isalin ang idyoma ng tainga bilang 'nang pabulong.'
  alternative: Isalin ang lahat bilang 'nang palihim ... hayagan ... ibinulong ... ipahayag sa madla,' o panatilihin ang literal na 'sa tainga.'
  rationale: Pinananatili nito ang pangunahing antitesis at retorika ni Jesus habang iniiwasan ang hindi natural at malabong pariralang Filipino na 'sa tainga.' Hindi nito binabago ang teolohikal na diin sa paglalantad at pampublikong pagpapahayag ng natanggap na mensahe.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'bubungan' sa halip na hiram na 'rooftop,' at ang 'nang pabulong' upang maging natural ang idyoma habang inilalagay sa talababa ang mas literal na anyo.
