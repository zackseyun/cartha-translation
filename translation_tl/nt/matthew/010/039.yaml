  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: tl
  text: Ang nakasusumpong ng kanyang buhay ay mawawalan nito,[a] at ang nawawalan ng kanyang buhay alang-alang sa akin ay makasusumpong nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa” sa dalawang sugnay. Ang Griyegong ψυχή ay maaaring mangahulugang “buhay” o “kaluluwa,” ngunit sa kontekstong ito, higit na angkop ang “buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Ang nakasusumpong
  rationale: Ang artikulo at aorist participle ay tumutukoy sa isang kinatawang tao. Likas sa makabagong Tagalog ang substantibong “ang nakasusumpong” at napananatili nito ang pagtutumbas sa “makasusumpong” sa hulihan.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ng kanyang buhay
  rationale: Sa konteksto ng pagiging alagad, ang ψυχή ay tumutukoy sa sariling buhay, hindi lamang sa di-materyal na kaluluwa. Napananatili ng “kanyang” ang pang-isahang kinatawang anyo ng Griyego.
- source_word: ἀπολέσει αὐτήν
  choice: ay mawawalan nito
  rationale: Dito, ang ἀπόλλυμι ay nagpapahayag ng pagkawala o pagkakait sa sarili, hindi tahasang paglipol. Ang “mawawalan” ay natural sa Tagalog at malinaw na kasalungat ng “makasusumpong.”
- source_word: ὁ ἀπολέσας
  choice: ang nawawalan
  rationale: Bagaman aorist ang participle, pangkalahatan at kawikaang diwa ang konstruksyon. Ang aspektong kontemplatibo ng “nawawalan” ay angkop sa sinumang isinusuko o nawawala ang buhay sa ganitong paraan.
- source_word: ἕνεκεν ἐμοῦ
  choice: dahil sa akin
  rationale: Ang parirala ay nagsasaad ng dahilan o batayan. Ang “dahil sa akin” ay tuwiran at likas sa kasalukuyang Tagalog, habang pinananatili ang personal na kaugnayan kay Jesus.
- source_word: εὑρήσει αὐτήν
  choice: ay makasusumpong nito
  rationale: Pinananatili ng “makasusumpong” ang sinadyang pag-uulit ng ugat na εὑρίσκω at ang simetriya ng kabalintunaang pahayag.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa kabalintunaan tungkol sa pagiging alagad
  choice: buhay
  alternative: kaluluwa
  rationale: Ang konteksto ay tungkol sa pagtatangkang ingatan o sa pagsuko ng sariling buhay dahil sa katapatan kay Jesus. Hindi nito pangunahing ipinaghihiwalay ang katawan at kaluluwa. Gayunman, kinikilala sa talababa ang mas malawak na saklaw ng ψυχή.
- issue: Kahulugan ng ἕνεκεν ἐμοῦ
  choice: dahil sa akin
  alternative: alang-alang sa akin
  rationale: Maaaring tukuyin ng parirala ang sanhi at motibo. Pinananatili ng “dahil sa akin” ang tunay na kaluwagan nito nang hindi nililimitahan sa isang tiyak na uri ng kusang pagsasakripisyo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nakasusumpong/makasusumpong” upang mapanatili ang retorikal na pag-uulit, at “kanyang” upang katawanin ang pang-isahang panlalaking anyo ng Griyego nang hindi ginagawang tahasang lalaki ang tinutukoy.
