  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: tl
  text: At matapos siyang mag-ayuno nang apatnapung araw at apatnapung gabi, nagutom siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύσας
  choice: matapos siyang mag-ayuno
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa. Likas sa modernong Tagalog ang “matapos siyang mag-ayuno” at malinaw nitong ipinapakita ang pagkakasunod ng mga pangyayari.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: nang apatnapung araw at apatnapung gabi
  rationale: Ang accusative ay nagpapahayag ng haba ng panahon. Ginagamit ang “nang” upang likas na ipahayag ang tagal sa Tagalog habang pinananatili ang biblikal na pariralang “apatnapung araw at apatnapung gabi.”
- source_word: ὕστερον
  choice: matapos
  rationale: Ipinahihiwatig ng ὕστερον na sumunod ang pagkagutom sa pag-aayuno. Isinama ang temporal na diwa sa “matapos” upang maiwasan ang mabigat at paulit-ulit na “pagkatapos... saka.”
- source_word: ἐπείνασεν
  choice: nagutom siya
  rationale: Ang “nagutom” ay natural at tuwirang salin na maaaring magpahayag ng pagdating ng gutom o ng kalagayan ng pagiging gutom, nang hindi gumagamit ng lipas o mabigat na pananalita.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ng “At” ang payak na pagkakaugnay ng talata sa naunang salaysay nang hindi nagdaragdag ng interpretatibong diin.
theological_decisions:
- issue: Ang tunay na pisikal na pagkagutom ni Jesus pagkatapos ng pag-aayuno
  choice: nagutom siya
  alternative: nakaramdam siya ng gutom
  rationale: Malinaw na ipinapahayag ng “nagutom siya” ang tunay na pangangailangang pantao ni Jesus, ngunit hindi nito pinalalabis ang isang doktrinal na punto o dinaragdagan ang sinasabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang payak na daloy ng salaysay at ang tradisyonal ngunit pangkaraniwang pariralang “apatnapung araw at apatnapung gabi.” Hindi kailangan ang talababa sapagkat sapat na naihahatid ng pangunahing teksto ang temporal na relasyon ng participle at ng ὕστερον.
