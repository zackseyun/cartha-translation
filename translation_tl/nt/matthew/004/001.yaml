  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: tl
  text: Pagkatapos, inakay paitaas ng Espiritu si Jesus patungo sa ilang upang tuksuhin siya ng diyablo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “subukin.” Ang pandiwang Griyego ay maaaring mangahulugang “tuksuhin” o “subukin,” ngunit sa agarang konteksto, mas angkop ang “tuksuhin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas at malinaw na panandang temporal sa modernong Tagalog para sa kasunod na pangyayari sa salaysay.
- source_word: ἀνήχθη
  choice: inakay
  rationale: Pinananatili ang diwang si Jesus ay pinatnubayan ng Espiritu. Hindi isinama ang literal na nuances na “pataas” sapagkat magiging pilit at maaaring magpahiwatig ng tiyak na topograpiyang hindi siyang pangunahing diin dito.
- source_word: εἰς τὴν ἔρημον
  choice: sa ilang
  rationale: Ang “ilang” ay dignitado at pamilyar na salin para sa liblib at hindi tinatahanang lupain, nang hindi labis na tinutukoy kung ito ay purong disyerto.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Ang malaking titik at tiyak na anyo ay angkop sa agarang konteksto ng bautismo ni Jesus, kung saan ang tinutukoy ay ang Espiritu ng Diyos, nang hindi idinaragdag sa teksto ang salitang “Banal.”
- source_word: πειρασθῆναι
  choice: upang tuksuhin siya
  rationale: Ang “tuksuhin” ang pinakamalinaw na kahulugan dahil ang diyablo ang gumagawa at ang kasunod na salaysay ay pag-uudyok sa maling gawain. Idinagdag ang panghalip na “siya” para sa natural at malinaw na balangkas ng pangungusap sa Tagalog.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ng diyablo
  rationale: Ang “diyablo” ang karaniwan at malinaw na katawagan sa personal na kalaban sa kontekstong ito; hindi sapat dito ang literal na “maninirang-puri.”
theological_decisions:
- issue: Pagkakakilanlan ng τοῦ πνεύματος
  choice: Ang Espiritu ang umakay kay Jesus
  alternative: isang espiritu o ang sariling espiritu ni Jesus
  rationale: Ang agarang konteksto ng bautismo ni Jesus ay malinaw na tumutukoy sa Espiritu ng Diyos. Pinananatili ng salin ang payak na “Espiritu” at hindi idinaragdag ang “Banal.”
- issue: Saklaw ng kahulugan ng πειρασθῆναι
  choice: tuksuhin
  alternative: subukin
  rationale: Pinapaboran ng diyablo bilang tagaganap at ng kasunod na pangyayari ang “tuksuhin,” ngunit maaari ring mangahulugan ang pandiwang Griyego na “subukin”; kaya pinanatili ang alternatibo sa talababa upang hindi mawala ang tunay na tensiyong leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang aktibong ayos na “inakay ng Espiritu si Jesus” dahil mas likas ito sa Tagalog kaysa sa pilit na pasibong anyo, habang pinananatili ang parehong mga kalahok at ugnayan ng pagkilos. Ang “sa ilang” ay maikli at pamilyar sa biblikal na salaysay.
