id: MAT.4.10
reference: Matthew 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi sa kanya ni Jesus, “Lumayas ka, Satanas! Sapagkat nasusulat: ‘Ang Panginoon mong Diyos ang sasambahin mo[a], at siya lamang ang paglilingkuran mo[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang Panginoon mong Diyos ang yuyukuran mo.” Ang pandiwang Griyego ay maaari ring literal na tumukoy sa pagyukod o pagpapatirapa bilang pagpaparangal.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang isinaling “paglilingkuran” ay maaaring tumukoy lalo na sa banal o panrelihiyong paglilingkod na inihahandog sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural at malinaw sa modernong Filipino.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: sinabi sa kanya ni Jesus
  rationale: Ang λέγει ay historikal na pangkasalukuyan, ngunit ang pangnagdaan ang mas natural na paraan ng pagsasalaysay sa Filipino nang hindi binabago ang kahulugan.
- source_word: Ὕπαγε
  choice: Lumayas ka
  rationale: Malakas na utos ito na umalis; ang “Lumayas ka” ay natural at angkop sa mariing pagtataboy kay Satanas.
- source_word: Σατανᾶ
  choice: Satanas
  rationale: Karaniwang anyong Filipino ng pangalang pantangi o titulong ito, na ginagamit dito bilang pantawag.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Itinatago nito ang pormulang ginagamit sa pagpapakilala ng sipi mula sa Kasulatan at ang diwang nananatiling nakasulat.
- source_word: Κύριον τὸν θεόν σου
  choice: Ang Panginoon mong Diyos
  rationale: Natural na Filipino para sa pariralang tumutukoy sa Panginoon bilang Diyos ng kinakausap.
- source_word: προσκυνήσεις
  choice: sasambahin mo
  rationale: Sa konteksto ng debosyon sa Diyos, “sasambahin” ang malinaw na katumbas; maaaring literal ding tumukoy sa pagyukod bilang pagpaparangal.
- source_word: αὐτῷ μόνῳ
  choice: siya lamang
  rationale: Inilalagay ng μόνος ang diin sa pagiging bukod-tangi ng Diyos bilang tatanggap ng paglilingkod.
- source_word: λατρεύσεις
  choice: paglilingkuran mo
  rationale: Pinananatili nito ang pagkakaiba sa προσκυνήσεις at maaaring saklawin ang banal o panrelihiyong paglilingkod sa Diyos.
theological_decisions:
- issue: Pagkakaiba ng προσκυνέω at λατρεύω
  choice: Isalin bilang “sumamba” at “maglingkod”
  alternative: Gamitin ang wikang “pagsamba” para sa dalawang pandiwa, o isalin ang una bilang “yumukod”
  rationale: Magkaugnay ngunit magkaiba ang dalawang pandiwa. Pinananatili ng salin ang parehong pagsamba at tapat na paglilingkod na ukol lamang sa Diyos, nang hindi pinag-iisa ang kanilang mga kahulugan.
- issue: Saklaw ng μόνῳ
  choice: “siya lamang ang paglilingkuran mo”
  alternative: “paglilingkuran mo lamang siya”
  rationale: Mas malinaw sa napiling ayos na ang pagiging eksklusibo ay tumutukoy sa persona—siya lamang—alinsunod sa αὐτῷ μόνῳ.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “Lumayas ka” upang mapanatili ang tindi ng utos, at ang “nasusulat” bilang pamilyar ngunit hindi lipas na pormula sa pagsipi ng Kasulatan.
