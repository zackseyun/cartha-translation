  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: tl
  text: 'upang matupad ang sinabi sa pamamagitan ng propetang si Isaias, na nagsabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na panandang Filipino para sa layunin o kinalabasan; pinananatili ang puwersa ng ἵνα nang hindi mabigat pakinggan.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Ang anyong balintiyak na ito sa sugnay na ἵνα ay tumutukoy sa katuparan ng Kasulatan. Sapat na ipinahihiwatig ng “upang” ang subjunctive na diwa sa natural na Filipino.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Natural na pagsasalin ng substantival passive participle; hindi kailangang gawing “ang bagay na sinabi,” na magiging mabigat.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Pinananatili ang diwa ng pagkilos sa pamamagitan ng isang tagapamagitan, sa halip na ang mas patag na “ni Isaias.”
- source_word: Ἠσαΐου
  choice: Isaias
  rationale: Karaniwang anyo ng pangalan ng propeta sa tradisyong Biblikal na Filipino at malinaw sa mga modernong mambabasa.
- source_word: τοῦ προφήτου
  choice: propetang
  rationale: Tahasan nitong kinikilala ang tungkulin ni Isaias at natural na ikinakabit sa pangalan sa Filipino.
- source_word: λέγοντος
  choice: 'na nagsasabi:'
  rationale: Pinananatili ang present participle at malinaw na ipinakikilala ang kasunod na tuwirang sipi.
theological_decisions:
- issue: Pormula ng katuparan sa Mateo
  choice: Gamitin ang “matupad” at panatilihin ang tahasang ugnayan sa sinabi sa pamamagitan ng propeta.
  alternative: “magkatotoo” o “nangyari ang ipinahayag”
  rationale: Ang “matupad” ay nagpapanatili sa mahalagang bokabularyo ng katuparan ng Kasulatan sa Mateo nang hindi dinaragdagan o nilulutas ang teolohikal na kahulugan nito.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang “sa pamamagitan ng” upang maipakita ang propetikong pamamagitan, at ginamit ang tradisyonal ngunit buhay pa ring anyong “Isaias.”
