base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: tl
  text: 'Sinabi ni Jesus sa kanya, “Muli, nasusulat: ‘Huwag mong subukin[a] ang Panginoon[b] mong Diyos.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag mong ilagay sa pagsubok ang Panginoon mong Diyos.” Ang pandiwang Griyego na ἐκπειράζω ay maaaring mangahulugang “subukin” o “ilagay sa pagsubok.”'
    reason: lexical_alternative
  - marker: b
    text: Sipi ito mula sa Deuteronomio 6:16. Ang “Panginoon” sa Griyego ay sumusunod sa salin ng Septuagint para sa banal na pangalan ng Diyos.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Likas na panimulang pangungusap sa modernong Filipino; malinaw na naipapakita ng “sa kanya” ang di-tuwirang layon ng αὐτῷ nang hindi dinaragdagan ang lakas ng payak na ἔφη.
- source_word: Πάλιν
  choice: din
  rationale: Sa tugon ni Jesus, ipinakikita ng πάλιν ang isa pang sipi mula sa Kasulatan bilang panimbang sa naunang sipi. Ang “din” ay natural sa Filipino at pinananatili ang retorikal na diwa ng “muli/sa kabilang banda.”
- source_word: γέγραπται
  choice: Nasusulat
  rationale: Karaniwang pormula ito sa Filipino para sa pagsipi sa Kasulatan at ipinahihiwatig ang nananatiling bisa ng isinulat, gaya ng perpektong pasibo sa Griyego.
- source_word: Οὐκ ἐκπειράσεις
  choice: Huwag mong subukin
  rationale: Ang future indicative ay gumaganap bilang pagbabawal. Ang “subukin” ay maikli, dignificado, at kayang dalhin ang diwa ng paglalagay sa Diyos sa pagsubok nang hindi sobrang nagpapaliwanag.
- source_word: κύριον τὸν θεόν σου
  choice: ang Panginoon mong Diyos
  rationale: Natural na appositional na anyo sa Filipino, pinananatili ang κύριος bilang “Panginoon” at ang personal na kaugnayan ng σου bilang “mong.”
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa siping tumutukoy sa Diyos ng Israel
  choice: Panginoon
  alternative: YAHWE / PANGINOON na kumakatawan sa banal na pangalan
  rationale: Ang agarang pinagkunang teksto ay Griyegong κύριον, kaya “Panginoon” ang tuwirang salin. Hindi tahimik na ipinapalit sa pangunahing teksto ang anyo ng pinagbabatayang Hebreong banal na pangalan; ipinaliliwanag sa talababa ang kaugnayan nito sa Septuagint at Deuteronomio 6:16.
- issue: Lakas at saklaw ng ἐκπειράζω
  choice: subukin
  alternative: ilagay sa pagsubok
  rationale: Parehong posible ang payak na “subukin” at ang mas tahasang “ilagay sa pagsubok.” Pinili ang natural at maigsi na “subukin,” habang pinananatili sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “Nasusulat din” sa halip na mas literal ngunit di-gaanong natural na “Muli, nasusulat.” Pinanatiling maikli at mariin ang pagbabawal, at inilagay ang dalawang marker sa pangunahing teksto.
