  source_fidelity: Tumpak na naihahatid ang panawagan ni Jesus, ang pangakong gagawin niya silang iba, at ang metaporang ἁλιεῖς ἀνθρώπων. Ang “Sumunod kayo sa akin” ay isang likas na Tagalog na pagsasalin ng pinagsamang Δεῦτε ὀπίσω μου, kahit mas idiomatiko kaysa salita-sa-salitang anyo. Ang nakaraang panahong “sinabi niya” ay hindi pinananatili ang Griyegong historical present, ngunit ito ay katanggap-tanggap at likas sa Tagalog na salaysay nang walang pagbabagong semantiko.
