  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Sumunod kayo sa akin, at gagawin ko kayong mga mangingisda ng mga tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas likas sa makabagong salaysay sa Tagalog ang pangnagdaang “sinabi niya.”
- source_word: Δεῦτε ὀπίσω μου
  choice: Sumunod kayo sa akin
  rationale: Idyomatikong ipinahahayag nito sa Tagalog ang paanyayang “halikayo sa likuran ko,” nang hindi nagiging asiwa o labis na literal.
- source_word: ποιήσω ὑμᾶς
  choice: gagawin ko kayong
  rationale: Tuwirang pinananatili ang pangako ni Jesus na siya ang kikilos upang baguhin sila.
- source_word: ἁλιεῖς
  choice: mga mangingisda
  rationale: Ito ang likas at karaniwang katumbas sa Tagalog ng mga taong nangingisda.
- source_word: ἀνθρώπων
  choice: ng mga tao
  rationale: Ang ἄνθρωπος dito ay tumutukoy sa mga tao sa pangkalahatan; hindi likas o kinakailangang kasarianin ang parirala sa Tagalog.
theological_decisions:
- issue: Metapora ng ἁλιεῖς ἀνθρώπων
  choice: mga mangingisda ng mga tao
  alternative: mga mamamalakaya ng tao
  rationale: Pinananatili ang lantad at bahagyang matalinghagang larawan ng pangingisda sa halip na ipaliwanag ito bilang simpleng pag-akay o pangangaral, kaya hindi nilulutas ang buong kahulugan ng metapora sa mismong salin.
- issue: Saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Sa kontekstong ito, pangkalahatan ang saklaw ng salita—mga nilalang na tao—kaya ang “mga tao” ang tumpak at natural na salin sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sumunod kayo sa akin” bilang natural na utos sa maramihan at pinanatili ang kilalang metapora na “mga mangingisda ng mga tao.”
