id: MAT.4.23
reference: Matthew 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: tl
  text: Naglibot si Jesus sa buong Galilea, nagtuturo sa kanilang mga sinagoga, ipinapahayag ang mabuting balita ng kaharian[a], at nagpapagaling ng bawat karamdaman at bawat sakit sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang ebanghelyo ng kaharian”; maaari ring unawain bilang “ang mabuting balita tungkol sa kaharian.”
    reason: Ipinapakita ang tradisyonal na terminong “ebanghelyo” at ang lehitimong pagpapaliwanag ng ugnayang genitive nang hindi idinaragdag ang “Diyos” sa pangunahing teksto.
lexical_decisions:
- source_word: περιῆγεν
  choice: nilibot
  rationale: Ipinahihiwatig ng imperfect na pandiwa ang patuloy na paglalakbay ni Jesus sa iba't ibang dako; likas at maikli sa Tagalog ang “nilibot.”
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: ang buong Galilea
  rationale: Kasama ng pandiwang nagsasaad ng paggalaw, ipinakikita ng parirala ang malawak na saklaw ng paglilibot sa rehiyon.
- source_word: διδάσκων
  choice: nagtuturo
  rationale: Pinananatili nito ang kasabay at nagpapatuloy na gawain kaugnay ng pangunahing pandiwa.
- source_word: συναγωγαῖς αὐτῶν
  choice: kanilang mga sinagoga
  rationale: Tumutukoy ang συναγωγή sa mga sinagoga ng mga pamayanang Judio, at pinananatili ng “kanilang” ang αὐτῶν.
- source_word: κηρύσσων
  choice: ipinapahayag
  rationale: Ipinakikita nito ang hayagan at may-awtoridad na pagpapahayag nang hindi umaasa sa mas makitid na gamit ng “nangangaral.”
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ang mabuting balita tungkol sa paghahari ng Diyos
  rationale: Direktang ipinahahayag ng “mabuting balita” ang diwa ng εὐαγγέλιον. Sa kontekstong Mateo, ang βασιλεία ay pangunahing tumutukoy sa aktibong paghahari ng Diyos, hindi lamang sa isang nasasakupang kaharian; ang “tungkol sa” ay isang natural na paglalantad ng ugnayang genitive.
- source_word: θεραπεύων
  choice: nagpapagaling
  rationale: Likas na Tagalog ito para sa aktuwal na pagpapagaling na inilalarawan ng pandiwa.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: bawat uri ng karamdaman at sakit
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong katawagan. Ang “bawat uri” ay natural na naghahayag ng komprehensibong distributibong diwa sa Tagalog nang ipahiwatig na bawat indibidwal sa Galilea ay gumaling.
- source_word: ἐν τῷ λαῷ
  choice: sa gitna ng mga tao
  rationale: Natural na ipinakikita nito ang pangkat na pinangyarihan ng mga pagpapagaling.
theological_decisions:
- issue: Kahulugan ng βασιλεία
  choice: paghahari ng Diyos
  alternative: kaharian
  rationale: Mas malinaw na naihahayag ng “paghahari” ang dinamikong diwa ng βασιλεία bilang pamamahala o paghahari. Idinagdag ang “ng Diyos” bilang kontekstuwal na paglilinaw sa tinutukoy na paghahari, habang inilalagay sa talababa ang mas pormal na anyo upang hindi maitago ang ibang lehitimong pagbasa.
- issue: Saklaw ng πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: bawat uri ng karamdaman at sakit
  alternative: bawat karamdaman at bawat kahinaan
  rationale: Nananatili ang mariing lawak ng pahayag at ang dalawang pangngalan, ngunit iniiwasang ipakahulugan na tahasang sinasabi ng talata na walang sinumang maysakit sa rehiyon ang hindi gumaling.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sinagoga” dahil karaniwan na itong terminong biblikal at mas eksakto kaysa “pook-sambahan.” Tahasang pinangalanan si Jesus sa halip na gumamit ng “siya” upang maging malinaw ang talatang nakahiwalay, bagaman ang Griyego ay may implicit na simuno.
