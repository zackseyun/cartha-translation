- from: At nilibot ni Jesus ang buong Galilea, nagtuturo sa kanilang mga sinagoga, ipinapahayag ang mabuting balita tungkol sa paghahari ng Diyos[a], at nagpapagaling ng bawat uri ng karamdaman at sakit sa gitna ng mga tao.
  to: Naglibot si Jesus sa buong Galilea, nagtuturo sa kanilang mga sinagoga, ipinapahayag ang mabuting balita ng kaharian[a], at nagpapagaling ng bawat karamdaman at bawat sakit sa mga tao.
  rationale: Binago ang pangunahing salin upang tuwirang maipahayag ang εὐαγγέλιον τῆς βασιλείας nang walang di-nakasulat na pagdaragdag na “Diyos” at walang paglimita sa genitive sa “tungkol sa.” Pinanatili ang dalawang inuulit na “bawat” para sa πᾶσαν νόσον καὶ πᾶσαν μαλακίαν, at ginawang “Naglibot” ang pangunahing pandiwa upang mas maipakita ang aspektong imperfect. Pinanatili ang modernong Filipino Tagalog at ang marangal na rehistro.
