id: MAT.4.6
reference: Matthew 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Kung ikaw ang Anak ng Diyos, ihagis mo ang iyong sarili pababa[a], sapagkat nasusulat:


    ‘Mag-uutos siya sa kanyang mga anghel tungkol sa iyo,’


    at,


    ‘Sa kanilang mga kamay ay bubuhatin ka nila[b],

    upang hindi mo mauntog ang iyong paa sa isang bato.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibagsak mo ang iyong sarili pababa.”
    reason: lexical_alternative
  - marker: b
    text: O, “Sa kanilang mga kamay ay dadalhin ka nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present sa salaysay; mas natural sa modernong Tagalog ang pangnagdaang “sinabi.”
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili nito ang puwersa ng kondisyunal na hamon nang hindi ipinapalagay o itinatanggi ang kundisyon.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Sa konteksto ng Mateo, ang parirala ay tumutukoy sa kinikilalang titulo, kaya natural at tumpak ang “ang Anak ng Diyos.”
- source_word: βάλε σεαυτὸν κάτω
  choice: magpatihulog ka
  rationale: Natural itong modernong Tagalog para sa utos na kusang ihulog ng kausap ang kanyang sarili mula sa mataas na lugar; naipahihiwatig na ng pandiwa ang direksiyong pababa.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula ito sa Tagalog para sa pagsipi sa Kasulatan at pinananatili ang diwang nananatiling nakasulat.
- source_word: ἐντελεῖται
  choice: Mag-uutos siya
  rationale: Ipinapahayag nito ang awtoritatibong pag-uutos na nasa pandiwang Griyego at ang panahong panghinaharap.
- source_word: περὶ σοῦ
  choice: tungkol sa iyo
  rationale: Tuwirang inililipat nito ang περί na may genitive at hindi dinaragdagan ang saklaw ng utos.
- source_word: ἐπὶ χειρῶν
  choice: sa kanilang mga kamay
  rationale: Natural sa Tagalog ang “sa kanilang mga kamay” para sa larawang iniaangat at sinusuportahan ang isang tao ng mga kamay.
- source_word: ἀροῦσίν σε
  choice: Bubuhatin ka nila
  rationale: Saklaw ng αἴρω dito ang pag-angat o pagdala; malinaw at natural ang “bubuhatin” habang pinananatili ang larawan ng proteksiyon.
- source_word: μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: upang hindi tumama sa bato ang iyong paa
  rationale: Ipinahahayag nito ang layuning makaiwas sa pagtama ng paa sa isang bato, pinananatili ang isahang “paa” at ang di-tiyak na “bato.”
theological_decisions:
- issue: Puwersang kristolohikal ng “υἱὸς ... τοῦ θεοῦ” sa hamon ng manunukso
  choice: Isinalin bilang titulong “ang Anak ng Diyos.”
  alternative: “anak ng Diyos” na walang pantukoy
  rationale: Sa salaysay ng Mateo, gumaganap itong kinikilalang katawagan kay Jesus. Pinananatili ng salin ang puwersang iyon nang hindi nagdaragdag ng paliwanag na doktrinal.
- issue: Pagsipi ng diyablo sa Awit 91
  choice: Pinanatili ang sipi ayon sa pagkakabigkas nito, nang walang interpretatibong pagsaway sa pangunahing teksto.
  alternative: Magdagdag sa pangunahing teksto ng paliwanag na mali ang paggamit niya sa sipi.
  rationale: Inilalahad ng talata ang manunukso na sumisipi sa Kasulatan; dapat manatili ang tensiyong iyon at hindi ito tahimik na lutasin ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “nasusulat” bilang pamilyar na pormula sa pagsipi sa Kasulatan, samantalang ang “magpatihulog ka” at “bubuhatin ka nila” ay natural sa kasalukuyang gamit. Pinanatili ang estruktura ng dalawang sipi at ang kondisyunal na “Kung.”
