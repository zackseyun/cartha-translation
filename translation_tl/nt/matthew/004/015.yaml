id: MAT.4.15
reference: Matthew 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: tl
  text: “Lupain ng Zebulun at lupain ng Neftali, daang patungo sa dagat, sa ibayo ng Jordan, Galilea ng mga Hentil[a]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Galilea ng mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Lupain
  rationale: Tumutukoy ito sa isang heograpikong nasasakupan, hindi sa lupa bilang materyal o sa buong daigdig; inulit upang mapanatili ang paralelismo ng Griyego.
- source_word: Ζαβουλὼν
  choice: Zebulun
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi at pook sa Bibliya.
- source_word: Νεφθαλίμ
  choice: Neftali
  rationale: Karaniwang anyong Filipino ng pangalan ng lipi at pook sa Bibliya.
- source_word: ὁδὸν θαλάσσης
  choice: daang patungo sa dagat
  rationale: Natural sa makabagong Tagalog at pinananatili ang posibilidad na tumukoy sa isang kilalang ruta o sa lupaing kaugnay ng dagat, nang hindi ito nililimitahan sa lansangang nasa baybayin.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sa ibayo ng Jordan
  rationale: Pinananatili ang heograpikong idyoma at hindi labis na tinutukoy kung saang pananaw nagmumula ang paglalarawan.
- source_word: Γαλιλαία
  choice: Galilea
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa kontekstong Judio at sa siping mula kay Isaias, malamang na tumutukoy ito sa mga di-Judio; ang literal na alternatibong “mga bansa” ay inilagay sa talababa.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ἐθνῶν sa siping mula kay Isaias
  choice: mga Hentil
  alternative: mga bansa
  rationale: Ipinahihiwatig ng konteksto ang mga taong di-Judio at ang etnorelihiyosong kaibahan, ngunit tunay ding posible sa leksikon ang “mga bansa,” kaya pinanatili iyon sa talababa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula at heograpikong pagkakasunod-sunod ng sipi; ginamit ang em dash dahil nagpapatuloy ang pangungusap sa kasunod na talata.
source_grounding:
  english_pob_role: consult_only
