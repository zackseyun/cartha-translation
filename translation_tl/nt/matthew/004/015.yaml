  source_fidelity: 'Tapat ang salin sa Griyegong sipi: naipapakita ang inuulit na γῆ sa “Lupain ... at lupain,” ang mga pangalang heograpiko, ang ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, at ang pangwakas na Γαλιλαία τῶν ἐθνῶν. Ang “sa ibayo ng Jordan” ay hindi nagtatakda ng pananaw na wala sa teksto, at ang em dash ay angkop dahil nagpapatuloy ang sipi sa kasunod na talata.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “daang patungo sa dagat” ay malinaw at maayos na katumbas ng pormal at bahagyang bukás na pariralang “way of the sea”; hindi nito ipinipilit na tiyak na baybaying-daan ang tinutukoy.
  terminology: Ang “Zebulun,” “Neftali,” “Jordan,” at “Galilea” ay mga karaniwan at angkop na anyong Filipino. Ang “mga Hentil” ay mahusay na pangunahing salin para sa τῶν ἐθνῶν sa kontekstong ito, samantalang wastong naingatan sa talababa ang leksikal na alternatibong “mga bansa.”
