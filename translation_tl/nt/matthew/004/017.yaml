  rationale: Pinalitan ang panandang temporal ng “Simula noon” upang malinaw na maipahiwatig ang paglipat ng salaysay at ang pagpapatuloy mula sa puntong iyon. Inayos ang pagpapakilala sa sipi upang maging likas sa modernong Filipino nang hindi isinasantabi ang dalawang pandiwa sa Griyego; ang literal na ayos ay nasa talababa. Pinalitan ang “malapit na” ng “lumapit na” upang mas maingat na maipahayag ang perpektong aspekto ng ἤγγικεν, at inayos ang kaugnay na talababa.
