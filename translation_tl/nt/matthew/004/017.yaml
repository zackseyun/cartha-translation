  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: tl
  text: Simula noon, nagsimulang magpahayag si Jesus sa mga salitang ito:[a] “Magsisi kayo,[b] sapagkat lumapit na[c] ang kaharian ng langit.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “nagsimulang magpahayag at magsabi.”'
    reason: previous_rendering
  - marker: b
    text: Ang utos na “magsisi” ay humihiling ng pagbabago ng isip, puso, at landas ng pamumuhay; maaari ring isaling “manumbalik kayo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “malapit na.” Binibigyang-diin ng perpektong pandiwa sa Griyego na lumapit na ang kaharian at nananatili itong malapit.
    reason: lexical_alternative
  - marker: d
    text: Sa Griyego, “ang kaharian ng mga langit.” Madalas gamitin ni Mateo ang pananalitang ito kung saan “ang kaharian ng Diyos” naman ang ginagamit sa ibang mga talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Mula noon
  rationale: Likas at malinaw na panandang temporal sa Tagalog na nagpapakita ng isang mahalagang pagbabago sa takbo ng salaysay.
- source_word: ἤρξατο
  choice: nagsimulang
  rationale: Tuwirang ipinahahayag ang pagsisimula ng patuloy na gawain ni Jesus.
- source_word: κηρύσσειν
  choice: magpahayag
  rationale: Ipinananatili ang diwa ng hayagang pagpapahayag sa madla nang hindi nililimitahan ang salita sa makabagong konsepto ng sermon.
- source_word: καὶ λέγειν
  choice: na sinasabi
  rationale: 'Natural na ipinakikilala sa Tagalog ang nilalaman ng ipinahayag, bagaman ang Griyego ay literal na may dalawang magkaugnay na pawatas: ‘magpahayag at magsabi.’'
- source_word: Μετανοεῖτε
  choice: Magsisi kayo
  rationale: Karaniwan at teolohikong sapat na katumbas na tumutukoy sa pagbabago ng isip, puso, at landas ng pamumuhay, hindi lamang sa pagkalungkot.
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Pinakanatural na pahayag sa Tagalog para sa paglapit ng kaharian. Ipinaliliwanag sa talababa ang perpektong aspekto ng Griyego, na nagpapahiwatig ng kalapitang dumating na at nananatili.
- source_word: βασιλεία
  choice: kaharian
  rationale: Pamilyar at malawak na katumbas na maaaring tumukoy kapwa sa paghahari at sa nasasakupan ng hari, kaya hindi pinipili nang sapilitan ang isa lamang na diwa.
- source_word: τῶν οὐρανῶν
  choice: ng langit
  rationale: Bagaman maramihan ang anyo sa Griyego, ang isahang ‘langit’ ang natural at nakaugaliang anyo sa Tagalog at pinananatili nito ang natatanging pananalita ni Mateo.
theological_decisions:
- issue: Kahulugan ng Μετανοεῖτε
  choice: Magsisi kayo
  alternative: Magbago kayo ng isip at pamumuhay; Manumbalik kayo
  rationale: Pinananatili ng ‘magsisi’ ang moral at espirituwal na bigat ng utos nang hindi ito ginagawang simpleng pagbabago lamang ng opinyon o ikinukulong sa isang partikular na sistemang denominasyonal.
- issue: Paglalarawan sa βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  alternative: ang paghahari ng langit; ang kaharian ng mga langit
  rationale: Pinananatili ang katangi-tanging parirala ni Mateo at ang tunay na lawak ng βασιλεία, na maaaring magpahiwatig ng maharlikang paghahari gayundin ng kaharian, nang hindi ito ginagawang isang lugar lamang.
- issue: Aspekto ng ἤγγικεν
  choice: malapit na
  alternative: lumapit na; dumating na nang malapit
  rationale: 'Ang ‘malapit na’ ang pinakanatural sa modernong Tagalog, samantalang ang talababa ang nag-iingat sa perpektong aspekto: ang pagkalapit ay naganap na at nananatiling may bisa. Hindi nito tiyakang nilulutas kung temporal, pansarili, o eskatolohiko ang lahat ng saklaw ng pagkalapit.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘magpahayag’ sa halip na mas eklesyastikong ‘mangaral,’ at pinanatili ang pamilyar na ‘kaharian ng langit.’ Ang bahagyang pormal na ‘na sinasabi’ ay nag-iingat sa dalawang pandiwa ng Griyego habang nananatiling nababasa nang natural.
