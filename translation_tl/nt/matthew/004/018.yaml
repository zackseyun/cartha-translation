  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: tl
  text: 'Habang naglalakad siya sa tabi ng Dagat ng Galilea, nakita niya ang dalawang magkapatid: sina Simon, na tinatawag na Pedro, at Andres, na kapatid ni Simon. Naghahagis sila ng lambat[a] sa dagat, sapagkat mga mangingisda sila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lambat na inihahagis”; ang salitang Griyego ay tumutukoy sa isang uri ng lambat na inihahagis sa pangingisda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν
  choice: Habang naglalakad siya
  rationale: Ipinahahayag ng pangkasalukuyang pandiwari ang kilos na nagpapatuloy kasabay ng pangunahing kilos; likas itong naihahatid sa Filipino sa sugnay na may “habang.”
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: sa tabi ng Dagat ng Galilea
  rationale: Ang παρά na may akusatibo ay nagpapahiwatig ng paggalaw sa kahabaan o tabi ng isang lugar. Pinananatili ng “Dagat ng Galilea” ang katawagang θάλασσα at ang nakaugaliang pangalang heograpiko.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Payak na salaysay ng naganap na pagkakita; ang “nakita” ang tuwiran at likas na katumbas.
- source_word: δύο ἀδελφούς
  choice: ang magkapatid
  rationale: Tumutukoy ito sa dalawang lalaking tunay na magkapatid. Sa Filipino, malinaw na naipahihiwatig ng mga pangalang kasunod na dalawa sila.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simon, na tinatawag na Pedro
  rationale: Pinananatili ng sugnay na “na tinatawag na” ang diwa ng λεγόμενον, at ginagamit ang nakaugaliang Filipino na anyo ng pangalang Peter, “Pedro.”
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: at Andres
  rationale: Naipahayag na ng “magkapatid na sina” ang ugnayan ni Andres kay Simon, kaya hindi na kailangang ulitin ang “kapatid niya.” Ginagamit ang nakaugaliang Filipino na anyo ng Andrew, “Andres.”
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: Naghahagis sila ng lambat[a] sa dagat
  rationale: Ang pangkasalukuyang pandiwari ay inilalarawan bilang kilos na ginagawa nila nang makita sila. Ang ἀμφίβληστρον ay isang lambat na inihahagis; “lambat” ang natural na pangunahing salita, habang nasa talababa ang higit na tiyak na kahulugan.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: sapagkat mga mangingisda sila
  rationale: Ipinapakita ng γάρ ang paliwanag kung bakit sila naghahagis ng lambat. Ang “sapagkat” ay malinaw at marangal na pang-ugnay sa salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang pangungusap na Griyego upang maging natural sa karaniwang mambabasa nang hindi binabago ang ugnayan ng mga kilos at paliwanag.
