    rationale: Ang “magkapatid” ay hindi kinakailangang nagsasaad ng eksaktong dalawang tao sa Filipino; malinaw na sinasabi ng Griyego na “dalawang magkapatid.”
  - severity: low
    issue: Hindi naihahayag ang “Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ.”
    rationale: Bagaman ipinahihiwatig ng “magkapatid” ang relasyon, tahasang kinikilala ng Griyego si Andres bilang kapatid ni Simon; ligtas at natural itong ibalik bilang “na kapatid ni Simon.”
