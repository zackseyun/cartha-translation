  terminology: Ang “tao” ay likas na pangkalahatan sa Tagalog at angkop para sa kinatawang ὁ ἄνθρωπος. Ang “Nasusulat” ay angkop na pormula sa pagsipi ng Kasulatan. Ang “salita,” “tinapay,” at “Diyos” ay wasto, malinaw, at nasa angkop na rehistro.
