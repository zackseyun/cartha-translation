  source_fidelity: 'Tumpak ang salin sa Griyego: ang “sumagot siya,” “Nasusulat,” “Hindi lamang sa tinapay mabubuhay ang tao,” at “sa bawat salitang lumalabas sa pamamagitan ng bibig ng Diyos” ay naipapahayag ang pangunahing diwa at larawan ng ἀποκριθεὶς εἶπεν, Γέγραπται, ἄρτῳ μόνῳ, ζήσεται ὁ ἄνθρωπος, παντὶ ῥήματι, at ἐκπορευομένῳ διὰ στόματος θεοῦ. Pinananatili rin nito ang hinaharap na puwersa ng ζήσεται sa “mabubuhay.”'
