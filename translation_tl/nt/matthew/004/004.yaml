id: MAT.4.4
reference: Matthew 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: tl
  text: 'Ngunit sumagot siya, “Nasusulat: ‘Hindi lamang sa tinapay mabubuhay ang tao, kundi sa bawat salitang lumalabas sa pamamagitan ng bibig ng Diyos.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “lumalabas sa pamamagitan ng bibig ng Diyos” bilang “lumalabas mula sa bibig ng Diyos.” Literal na gumagamit ang Griyego ng pariralang “sa pamamagitan ng bibig ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Likas at maikli sa modernong Tagalog; ipinahahayag ang tugon nang hindi ginagaya ang kalabisan ng Semitikong pariralang ‘sumagot at nagsabi.’
- source_word: Γέγραπται
  choice: Nasusulat
  rationale: Karaniwang pormula sa pagsipi ng Kasulatan at naipahihiwatig ang nananatiling bisa ng nakasulat.
- source_word: ἄρτῳ μόνῳ
  choice: lamang sa tinapay
  rationale: Pinananatili ang tuwirang kahulugan ng ἄρτος bilang ‘tinapay’ at ang diin ng μόνος bilang ‘lamang.’
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: mabubuhay ang tao
  rationale: Ang ‘tao’ sa Tagalog ay likas na tumutukoy sa sinumang tao o sa sangkatauhan, kaya malinaw ang pangkalahatang puwersa ng Griyego nang hindi nililimitahan sa lalaki.
- source_word: παντὶ ῥήματι
  choice: sa bawat salita
  rationale: Ang ῥῆμα ay tumutukoy rito sa bawat ipinahahayag ng Diyos; natural at sapat na tiyak ang ‘salita.’
- source_word: ἐκπορευομένῳ
  choice: lumalabas
  rationale: Pinananatili ang larawan ng salitang lumalabas o nagmumula sa bibig, sa payak at kasalukuyang Tagalog.
- source_word: διὰ στόματος θεοῦ
  choice: sa pamamagitan ng bibig ng Diyos
  rationale: Malapit na sinusundan ang διά na may genitive bilang ‘sa pamamagitan ng,’ habang pinananatili ang metapora ng banal na pagsasalita.
theological_decisions:
- issue: Pangkalahatang puwersa ng ὁ ἄνθρωπος
  choice: ang tao
  alternative: ang sangkatauhan / ang isang tao
  rationale: Ang pahayag ay pangkalahatang katotohanan tungkol sa buhay ng tao. Inclusive na sa karaniwang Tagalog ang ‘tao,’ kaya hindi kailangang magdagdag ng kasariang wala sa puntong binibigyang-diin ng sipi.
- issue: Pormula ng pagsipi na Γέγραπται
  choice: Nasusulat
  alternative: Nakasulat
  rationale: Ang ‘Nasusulat’ ay pormal ngunit madaling maunawaan at angkop bilang kinikilalang pormula ng pagsipi, nang hindi nagdaragdag ng paliwanag tungkol sa awtoridad ng Kasulatan.
- issue: διά sa pariralang διὰ στόματος θεοῦ
  choice: sa pamamagitan ng bibig ng Diyos
  alternative: mula sa bibig ng Diyos
  rationale: Pinananatili sa pangunahing teksto ang posibleng instrumental na diwa ng διά at ang larawan ng salita ng Diyos na ipinahahayag sa pamamagitan ng kanyang bibig; inilalahad sa talababa ang mas likas na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang tradisyonal at madaling makilalang ‘Nasusulat,’ ngunit iniwasan ang lipas o labis na pormal na ayos. Ang sipi ay may likas na daloy habang nananatiling malapit sa Griyegong larawan ng tinapay, salita, at bibig.
