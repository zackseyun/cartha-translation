id: MAT.4.5
reference: Matthew 4:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: tl
  text: Pagkatapos, isinama siya ng diyablo sa banal na lungsod[a] at pinatayo sa taluktok ng templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, Jerusalem.
    reason: cross_reference
  - marker: b
    text: O “nakausling dulo ng templo”; maaaring tumukoy ang Griyego sa isang nakausling gilid o sa pinakamataas na bahagi ng buong nasasakupan ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang sunuran sa salaysay; ipinakikitang ito ang kasunod na pangyayari.
- source_word: παραλαμβάνει
  choice: isinama
  rationale: Ipinahihiwatig ng pandiwa na dinala ng diyablo si Jesus na kasama niya; ginamit ang nagdaang anyo na mas natural sa salaysay sa Tagalog kaysa tularan ang historikal na kasalukuyan ng Griyego.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Karaniwang katawagan sa personal na tauhang tumutukoy kay Satanas sa kontekstong ito.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: sa banal na lungsod
  rationale: Pinananatili ang titulong ginamit sa Griyego nang hindi agad pinapalitan ng pangalang Jerusalem; natural na ipinapahayag ng 'sa' ang patutunguhan sa Tagalog.
- source_word: ἔστησεν
  choice: pinatayo
  rationale: 'Causative at transitive ang anyo: pinatayo siya ng diyablo sa isang lugar, hindi basta kusang tumayo si Jesus.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: sa taluktok
  rationale: Ang πτερύγιον ay maaaring tumukoy sa nakausling dulo o mataas na bahagi; ang 'taluktok' ay malinaw at natural, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: τοῦ ἱεροῦ
  choice: ng templo
  rationale: Natural na katumbas sa Tagalog; sa Griyego, ang ἱερόν ay maaaring tumukoy sa buong nasasakupan o complex ng templo, hindi lamang sa panloob na santuwaryo.
theological_decisions:
- issue: Pagkakakilanlan ng “banal na lungsod”
  choice: Pinanatili sa pangunahing teksto ang “banal na lungsod.”
  alternative: Jerusalem
  rationale: Iginagalang nito ang mismong marangal na katawagang nasa Griyego at iniiwasang palitan iyon ng isang interpretatibong tiyak na pangalan; nililinaw ang pagkakakilanlan sa talababa.
- issue: Kahulugan ng πτερύγιον τοῦ ἱεροῦ
  choice: “taluktok ng templo”
  alternative: “nakausling dulo/pakpak ng templo” o “pinakamataas na bahagi ng nasasakupan ng templo”
  rationale: Hindi lubos na tiyak ang tinutukoy na bahaging arkitektural. Ang 'taluktok' ay madaling maunawaan at kapani-paniwala, ngunit pinananatili sa talababa ang ibang posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang nagdaang panahunan para sa natural na pagsasalaysay sa Filipino, sa halip na mekanikal na tularan ang historikal na kasalukuyan ng Griyego. Inilagay ang mga talababa kaagad matapos ang pariralang nililinaw ng bawat isa.
