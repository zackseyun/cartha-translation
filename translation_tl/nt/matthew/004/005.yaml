  source_fidelity: 'Tumpak na naihahatid ang sunod-sunod na kilos: dinala/isinigama ng diyablo si Jesus sa banal na lungsod at pinatayo siya sa taluktok ng templo. Ang nagdaang panahunan ay isang natural na pagsasalaysay sa modernong Tagalog at hindi nagpapabago sa diwa ng historikal na kasalukuyan sa Griyego.'
  naturalness: Malinaw, natural, at angkop ang rehistro. Ang “isinama siya,” “banal na lungsod,” at “pinatayo sa taluktok ng templo” ay madaling unawain at marangal nang hindi labis na pormal.
  terminology: Ang “diyablo,” “banal na lungsod,” at “templo” ay angkop. Maingat na isinasalin ng “taluktok” ang tradisyonal na pagbasa ng πτερύγιον, habang pinananatili ng talababa ang kawalang-katiyakan tungkol sa eksaktong bahaging arkitektural at ang malawak na saklaw ng ἱερόν.
