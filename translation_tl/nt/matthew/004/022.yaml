  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: tl
  text: At kaagad nilang iniwan ang bangka at ang kanilang ama, at sumunod sila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “agad-agad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; natural sa Filipino ang “At” at hindi nito pinatitindi ang pagsalungat o pagkakasunod-sunod.
- source_word: εὐθέως
  choice: kaagad
  rationale: Malinaw nitong ipinapahayag ang dagliang pagtugon at pinananatili ang diin ng salitang madalas gamitin ni Mateo.
- source_word: ἀφέντες
  choice: iniwan
  rationale: Ipinahihiwatig ng aorist participle na nauna ang pag-iwan bago ang pagsunod. Natural na naipapahayag ito sa Filipino sa pamamagitan ng magkasunod na pandiwa nang hindi gumagamit ng mas matinding salitang gaya ng “tinalikuran.”
- source_word: τὸ πλοῖον
  choice: ang bangka
  rationale: Sa konteksto ng pangingisda, mas angkop at karaniwan ang “bangka” kaysa “barko.”
- source_word: τὸν πατέρα αὐτῶν
  choice: ang kanilang ama
  rationale: Tuwirang ipinakikilala ng parirala ang ama ng magkapatid at pinananatili ang bigat ng kanilang pag-alis nang walang dagdag na pagpapakahulugan.
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sila sa kanya
  rationale: Pinananatili ng “sumunod” ang literal na pagkilos at ang pahiwatig ng pagiging alagad na taglay ng ἀκολουθέω sa mga Ebanghelyo.
- source_word: οἱ
  choice: nila / sila
  rationale: Ang artikulo ay ginagamit bilang panghalip at tumutukoy sa magkapatid na nabanggit. Sa natural na Filipino, ipinapahayag ang tinutukoy sa “nilang” at muling nililinaw bilang “sila” sa pangunahing pandiwa.
theological_decisions:
- issue: Ang pagtugon bilang mga alagad at ang paghiwalay sa ama
  choice: Tuwirang inilalarawan ang dagliang pag-iwan nila sa bangka at sa kanilang ama upang sumunod kay Jesus.
  alternative: Ipakahulugang permanente nilang tinalikuran ang kanilang ama, o pansamantala lamang silang lumayo.
  rationale: Binibigyang-diin ng teksto ang maagap at tiyak na pagtugon, ngunit hindi nito tahasang sinasabi kung permanente o pansamantala ang pag-alis. Kaya “iniwan” ang ginamit sa halip na mas mabigat at mapagpasyang “tinalikuran.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay at ang pagkakasunod ng pag-iwan at pagsunod, nang hindi gumagamit ng arkaiko o labis na teolohikal na pananalita.
