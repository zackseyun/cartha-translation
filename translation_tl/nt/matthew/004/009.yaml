base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ibibigay ko sa iyo ang lahat ng ito kung magpapatirapa ka at sasamba[a] sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yuyukod sa akin” o “magbibigay-galang sa akin.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpapatirapa o pagbibigay-galang, ngunit sa kontekstong ito, mas angkop ang “sasamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay sa daloy ng salaysay nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: εἶπεν αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Pinananatili ang mga panghalip ng Griyego at hindi ipinapasok sa talata ang mga pangalang wala rito.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Ibibigay ko sa iyo ang lahat ng ito
  rationale: Likas na ayos sa Tagalog na pinananatili ang pangako, ang di-tuwirang layon, at ang saklaw ng πάντα na ‘lahat.’
- source_word: ἐὰν
  choice: kung
  rationale: Payak at tuwirang pananda ng kondisyong ipinahahayag sa Griyego.
- source_word: πεσὼν
  choice: magpapatirapa ka
  rationale: Inihahayag ang kongkretong kilos ng pagbagsak o pagyukod ng katawan bago o kasabay ng pagsamba; mas likas ito kaysa sa literal ngunit alanganing ‘mahulog ka.’
- source_word: προσκυνήσῃς μοι
  choice: sasamba sa akin
  rationale: Sa konteksto ng tukso at ng sagot sa kasunod na talata, relihiyosong pagsamba ang nangingibabaw na diwa, habang inilalagay sa talababa ang mas malawak na mga posibleng kahulugan.
theological_decisions:
- issue: Pagpapakahulugan sa προσκυνέω sa hinihingi ng diyablo kay Jesus
  choice: sasamba sa akin
  alternative: yuyukod sa akin; magbibigay-galang sa akin
  rationale: Ipinakikita ng konteksto, lalo na ng pagtukoy sa tanging Diyos na dapat sambahin sa kasunod na talata, na higit sa karaniwang paggalang ang hinihingi. Gayunman, pinananatili sa talababa ang tunay na lawak ng kahulugan ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “magpapatirapa” upang malinaw na maipakita ang pisikal na kilos ng πεσών, at “sasamba” upang maihatid ang relihiyosong bigat ng προσκυνέω sa konteksto.
