id: MAT.4.21
reference: Matthew 4:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: tl
  text: Mula roon ay nagpatuloy siya at nakita niya ang dalawa pang magkapatid na lalaki—si Santiago na anak ni Zebedeo at si Juan, na kapatid ni Santiago. Nasa bangka sila kasama ng kanilang amang si Zebedeo at nagkukumpuni ng kanilang mga lambat. Tinawag niya sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Pagkaalis niya roon
  rationale: Ipinahahayag ng aorist participle at ng pang-abay ang pagpapatuloy ni Jesus mula sa naunang lugar. Natural sa modernong Tagalog ang parirala at hindi nito dinaragdagan ang kilos.
- source_word: εἶδεν
  choice: nakita niya
  rationale: Payak na salaysay ng pagkakita; hindi ito pinatindi bilang “napansin.”
- source_word: ἄλλους δύο ἀδελφούς
  choice: ang dalawa pang magkapatid
  rationale: Pinananatili ng “pa” na karagdagan sila sa naunang pares, samantalang natural na ipinahahayag ng “magkapatid” na magkapatid sa isa't isa ang dalawa.
- source_word: Ἰάκωβον
  choice: Santiago
  rationale: Karaniwan at kinikilalang anyo ng pangalang ito sa mga saling Bibliya sa Tagalog.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: na anak ni Zebedeo
  rationale: Nililinaw ang eliptikong genitive ng Griyego bilang ugnayang ama-anak, gaya ng hinihingi ng natural na Tagalog.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: si Juan na kapatid niya
  rationale: Tinutukoy si Juan bilang kapatid ni Santiago nang malinaw at natural.
- source_word: ἐν τῷ πλοίῳ
  choice: Nasa bangka sila
  rationale: Ang πλοῖον sa kontekstong pangingisda ay bangka, hindi malaking sasakyang-dagat. Ginawang hiwalay na pangungusap para sa malinaw at likas na daloy sa Tagalog.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: kasama ng kanilang amang si Zebedeo
  rationale: Tumpak na ipinahahayag ang pagsama at ang relasyon ni Zebedeo sa dalawang anak.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: nagkukumpuni ng kanilang mga lambat
  rationale: Sa konteksto, ang καταρτίζω ay pag-aayos o pagkukumpuni ng mga lambat upang maging maayos muli.
- source_word: ἐκάλεσεν αὐτούς
  choice: Tinawag niya sila
  rationale: Pinananatili ang payak na pandiwang “tinawag” at hinahayaang ang konteksto ang magpahiwatig ng panawagan sa pagiging alagad.
theological_decisions:
- issue: Pahiwatig ng pagiging alagad sa ἐκάλεσεν
  choice: Tinawag niya sila
  alternative: Tinawag niya silang sumunod sa kanya
  rationale: Malinaw sa konteksto na ito ay panawagan sa pagiging alagad, ngunit hindi tahasang nakasaad sa talatang ito ang “sumunod sa kanya.” Kaya pinanatili ang tunay na saklaw ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang estrukturang Griyego upang maging natural ang salaysay nang hindi binabago ang mga ugnayan o nilalaman.
