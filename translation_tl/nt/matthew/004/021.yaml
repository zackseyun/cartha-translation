  source_fidelity: 'May maliit ngunit mahalagang pagkakaiba ang “Pagkaalis niya roon”: mas madaling unawain ito bilang ‘pagkatapos niyang umalis’ kaysa sa pag-usad/pagpapatuloy mula sa naunang lugar na ipinahihiwatig ng προβὰς ἐκεῖθεν. Mas tumpak ang “Mula roon ay nagpatuloy siya.” Ang natitira ay tapat sa Griyego, kabilang ang bangka, si Zebedeo bilang ama ng dalawa, pagkukumpuni ng mga lambat, at payak na ‘tinawag niya sila.’'
  naturalness: Natural at marangal ang Tagalog ng salaysay. Ang bahagyang rebisyon sa pambungad ay mas malinaw at idiomatiko. Ang tahasang “magkapatid na lalaki” ay nakapagpapanatili rin ng saklaw ng ἀδελφούς nang hindi nagiging di-likas.
  terminology: Ang “Santiago,” “Juan,” “Zebedeo,” “bangka,” “lambat,” at “tinawag” ay angkop sa modernong Filipino Tagalog at sa karaniwang rehistro ng Bibliya. Hindi pinalalawak ang ‘tinawag’ bilang utos na sumunod.
