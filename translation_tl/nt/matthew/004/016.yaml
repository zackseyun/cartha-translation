  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: tl
  text: Ang mga taong nakaupo sa kadiliman ay nakakita ng dakilang liwanag; at sa mga nakaupo sa lupain at lilim ng kamatayan[a], sumikat ang liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring isalin ang parirala bilang “matinding kadiliman,” ngunit tahasang binabanggit sa Griyego ang “kamatayan”; kaya pinanatili rito ang “lilim ng kamatayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: mga tao
  rationale: Likas itong tumutukoy sa isang kolektibong pangkat ng mga tao nang hindi ipinahihiwatig ang makabagong politikal na diwa ng “bansa.”
- source_word: καθήμενος / καθημένοις
  choice: nakaupo / nakaupo
  rationale: Pinananatili ang literal at matingkad na larawan ng pag-upo, pati ang magkatulad na ayos ng dalawang sugnay at ang alingawngaw nito sa Isaias.
- source_word: σκοτίᾳ
  choice: kadiliman
  rationale: Pinananatili nito ang literal at matalinghagang lakas ng salita nang hindi nililimitahan ang kahulugan sa kasalanan, kamangmangan, o paghihirap.
- source_word: φῶς εἶδεν μέγα
  choice: nakakita ng dakilang liwanag
  rationale: Ang “nakakita” ay natural na anyong naganap para sa aorist, at ang “dakilang liwanag” ay marangal at malinaw na katumbas ng μέγα.
- source_word: χώρᾳ
  choice: lupain
  rationale: Ang “lupain” ay natural na heograpikong katawagan at hindi nagpapahiwatig ng makabagong bansang politikal.
- source_word: σκιᾷ θανάτου
  choice: lilim ng kamatayan
  rationale: Tahasan nitong pinananatili ang θανάτου, “kamatayan,” at ang pamilyar na larawang biblikal sa halip na tunawin ito bilang “napakadilim.”
- source_word: ἀνέτειλεν
  choice: sumikat
  rationale: Natural itong ginagamit sa Filipino para sa pagsikat ng araw o liwanag at pinananatili ang larawang tila pagsikat ng isang makalangit na tanglaw.
- source_word: αὐτοῖς
  choice: sa mga nakaupo
  rationale: Ang pariralang datibo ay natural na naipahahayag sa Filipino sa pamamagitan ng “sa,” at malinaw na tinutukoy ang mga tumatanggap ng liwanag.
theological_decisions:
- issue: Kalikasan ng larawan ng kadiliman at liwanag
  choice: Panatilihin ang malawak na propetikong larawan nang hindi tinutukoy kung ang kadiliman ay espirituwal, moral, politikal, o umiiral na kalagayan.
  alternative: Tahasang ipakahulugan ang kadiliman bilang kasalanan o kamangmangan, at ang liwanag bilang nagliligtas na kapahayagan ng Mesiyas.
  rationale: Hindi nililimitahan ng mismong sugnay sa Griyego ang kahulugan ng kadiliman o liwanag. Ang di-tahasang larawan ay nagpapanatili sa yaman at tensiyong teolohikal ng sipi mula sa Isaias.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang balanseng paralelismo, ang kongkretong larawang “nakaupo,” at ang tradisyonal ngunit malinaw na pariralang “lilim ng kamatayan.”
