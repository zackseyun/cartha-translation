base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: tl
  text: Pagkaalis niya sa Nazara[a], pumunta siya at nanirahan sa Capernaum, sa tabi ng dagat, sa lupain ng Zebulun at Neftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: “Nazara”; sa maraming salin ay “Nazaret.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: pagkalisan niya
  rationale: Ipinahahayag ng aorist participle ang pag-alis na nauna sa pagpunta at paninirahan; likas sa Tagalog ang konstruksiyong “pagkalisan niya.”
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Sinusunod ang anyong Ναζαρά na nasa tekstong Griyego, sa halip na tahimik na palitan ng mas pamilyar na “Nazaret.”
- source_word: ἐλθὼν
  choice: pumunta siya
  rationale: Ginawang pandiwang may tahasang simuno upang malinaw at natural na maipakita sa Tagalog ang sunod-sunod na kilos.
- source_word: κατῴκησεν
  choice: nanirahan
  rationale: Ipinahahayag ng κατοικέω rito ang paninirahan o pagtira sa isang lugar; ang “nanirahan” ay dignified at natural nang hindi nagdaragdag ng ideya ng permanenteng paninirahan.
- source_word: Καφαρναοὺμ
  choice: Capernaum
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalan sa mga saling Tagalog.
- source_word: τὴν παραθαλασσίαν
  choice: sa tabi ng lawa
  rationale: Inilalarawan nito ang Capernaum bilang nasa tabi ng tinatawag na Dagat ng Galilea, na heograpikong isang lawa; natural at malinaw sa karaniwang mambabasa ang “sa tabi ng lawa.”
- source_word: ἐν ὁρίοις
  choice: sa nasasakupan ng
  rationale: Maaaring tumukoy ang ὅρια sa mga hangganan o teritoryo; ang “nasasakupan” ay natural na heograpikong pahayag at hindi masyadong makitid.
- source_word: Ζαβουλὼν
  choice: Zebulun
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantribo at panrehiyon sa Tagalog.
- source_word: Νεφθαλίμ
  choice: Neftali
  rationale: Ginamit ang nakaugaliang anyo ng pangalang pantribo at panrehiyon sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at madaling basahin. Pinanatili ang pangalang “Nazara” ayon sa mismong anyong Griyego at inilagay ang mas pamilyar na “Nazaret” sa talababa. Ginamit ang “lawa” upang maging heograpikong malinaw, habang hindi binabago ang lokasyong tinutukoy.
