review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing pagkakasunod ng mga kilos at ang pagpapanatili ng anyong «Nazara». Gayunman, ang «sa tabi ng lawa» ay nagpapalit sa hayag na salitang Griyego na παραθαλασσίαν (“tabing-dagat/tabi ng dagat”). Kahit ang Dagat ng Galilea ay isang lawa sa heograpiya, ang salin ay dapat panatilihin ang katawagang “dagat” ng pinagmulan.
  naturalness: Hindi likas ang «pagkalisan niya sa Nazara» sa modernong Tagalog. Ang «Pagkaalis niya sa Nazara» ay malinaw at idiomatiko. Mas natural at mas neutral sa heograpikong diwa ang «sa lupain ng Zebulun at Neftali» kaysa «sa nasasakupan ng».
  terminology: Ang Nazara, Capernaum, Zebulun, at Neftali ay katanggap-tanggap na mga anyo. Ang «Dagat» ay dapat gamitin para sa θαλάσσης/παραθαλασσίαν, nang hindi ipinapasok ang makabagong heograpikong paglalarawang “lawa.”
  issues:
  - severity: medium
    issue: «pagkalisan niya sa Nazara»
    rationale: Hindi ito karaniwang o maayos na konstruksiyon sa modernong Tagalog para sa «leaving Nazara». Ang «Pagkaalis niya sa Nazara» ay wastong nominal na panandang nagpapakita ng kilos na nauna sa pangunahing pandiwa.
  - severity: medium
    issue: «sa tabi ng lawa» para sa τὴν παραθαλασσίαν
    rationale: Ang Griyego ay tahasang naglalarawan sa Capernaum bilang tabing-dagat. Ang pisikal na katangiang lawa ng Dagat ng Galilea ay hindi sapat na dahilan upang palitan ang terminong nasa pinagmulan.
  - severity: low
    issue: «sa nasasakupan ng Zebulun at Neftali»
    rationale: Maaaring magpahiwatig ang «nasasakupan» ng isang umiiral na administratibong hurisdiksiyon. Ang ἐν ὁρίοις ay tumutukoy sa rehiyon o teritoryong kaugnay ng dalawang pangalan; mas neutral ang «sa lupain ng».
  revised_text: Pagkaalis niya sa Nazara[a], pumunta siya at nanirahan sa Capernaum, sa tabi ng dagat, sa lupain ng Zebulun at Neftali.
