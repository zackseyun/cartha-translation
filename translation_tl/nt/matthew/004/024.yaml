review_pass:
  verdict: approve
  source_fidelity: 'Tapat ang salin sa daloy at saklaw ng Griyego: kumalat ang balita tungkol kay Jesus sa buong Siria, dinala sa kanya ang lahat ng may karamdaman sa magkakaibang kalagayan, at pinagaling niya sila. Ang mga pangkat na δαιμονιζομένους, σεληνιαζομένους, at παραλυτικούς ay malinaw na naipahayag nang hindi pinagsasama o inaalis.'
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang ayos na “lahat ng maysakit—ang mga ...—at pinagaling niya sila” ay mabisang naghuhudyat na ang sumusunod ay paglalarawan ng mga dinala. Ang “kumalat ... ang balita” at “Dinala sa kanya ...” ay maayos ang daloy.
  terminology: Ang “mga sinasapian ng mga demonyo” ay tradisyonal at malinaw na Tagalog para sa δαιμονιζομένους; ang talababa ay wasto at kapaki-pakinabang na nagsasaad ng mas malawak na alternatibo. Ang “mga nangingisay” ay natural na pagsasalin ng malamang na tinutukoy ng σεληνιαζομένους, habang ang talababa ay maingat na pinananatili ang literal/tradisyonal na usapin tungkol sa buwan. Ang “mga paralitiko” ay karaniwang nauunawaan at tumpak sa konteksto.
