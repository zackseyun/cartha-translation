id: MAT.4.24
reference: Matthew 4:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: tl
  text: At kumalat sa buong Siria ang balita tungkol sa kanya. Dinala sa kanya ng mga tao ang lahat ng maysakit—ang mga pinahihirapan ng sari-saring karamdaman at matinding kirot, ang mga sinasapian ng mga demonyo,[a] ang mga nangingisay,[b] at ang mga paralitiko—at pinagaling niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga pinahihirapan ng mga demonyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: σεληνιαζομένους; ayon sa tradisyon, “mga epileptiko”; mas literal, mga taong inaakalang naaapektuhan ng buwan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: balita tungkol sa kanya
  rationale: Tumutukoy ito sa naririnig at kumakalat na ulat tungkol kay Jesus, hindi sa kakayahang makarinig.
- source_word: ἀπῆλθεν
  choice: kumalat
  rationale: Likas sa modernong Tagalog para sa paglaganap ng balita, bagaman ang literal na larawan ng Griyego ay ‘lumabas’ o ‘umalis.’
- source_word: Συρίαν
  choice: Siria
  rationale: Karaniwang anyong Tagalog ng pangalan ng rehiyon.
- source_word: προσήνεγκαν
  choice: Dinala ... ng mga tao
  rationale: Sa konteksto, nangangahulugan itong magdala ng mga tao kay Jesus. Idinagdag ang ‘ng mga tao’ bilang likas na di-tiyak na simuno sa Tagalog.
- source_word: κακῶς ἔχοντας
  choice: lahat ng maysakit
  rationale: Ang idyoma ay tumutukoy sa mga may masamang kalagayang pangkatawan o may sakit.
- source_word: ποικίλαις νόσοις
  choice: sari-saring karamdaman
  rationale: Pinananatili ang diwa ng iba’t ibang uri ng sakit sa natural na Tagalog.
- source_word: βασάνοις συνεχομένους
  choice: pinahihirapan ng ... matinding kirot
  rationale: Ipinahahayag ng συνεχομένους ang matinding pagkapit o pagpapahirap ng karamdaman, at ng βάσανοι ang matinding sakit o paghihirap.
- source_word: δαιμονιζομένους
  choice: mga sinasapian ng mga demonyo
  rationale: Malinaw at karaniwang salin sa Tagalog na nagpapanatili sa tunay na demonyong sanhi, ngunit hindi ginagawang teknikal na kategorya ang termino.
- source_word: σεληνιαζομένους
  choice: mga nangingisay
  rationale: Inilalahad ang nakikitang kalagayan sa paraang mauunawaan ngayon nang hindi pinagtitibay ang sinaunang pag-uugnay nito sa buwan.
- source_word: παραλυτικούς
  choice: mga paralitiko
  rationale: Maikli, malinaw, at karaniwang katawagan sa Tagalog para sa mga paralisado.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya sila
  rationale: Tuwirang ipinahahayag ang pagpapagaling ni Jesus sa lahat ng dinala sa kanya.
theological_decisions:
- issue: Saklaw ng δαιμονιζομένους
  choice: mga sinasapian ng mga demonyo
  alternative: mga pinahihirapan ng mga demonyo
  rationale: Hindi inaalis ang supernatural na sanggunian ng Griyego. Inilalagay sa talababa ang mas malawak na alternatibo sapagkat hindi tiyak na itinatakda ng anyong Griyego ang eksaktong antas ng impluwensiya o kontrol.
- issue: Pagpapakahulugan sa σεληνιαζομένους
  choice: mga nangingisay
  alternative: mga epileptiko; mas literal, mga inaakalang naaapektuhan ng buwan
  rationale: Ipinahahayag ang malamang na nakikitang sintomas nang hindi itinuturo bilang katotohanan ang sinaunang kaugnayan sa buwan; pinananatili sa talababa ang literal at tradisyonal na impormasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga gitling upang ipakitang ang kasunod na talaan ay naglalarawan sa ‘lahat ng maysakit.’ Iniwasan ang sobrang teknikal na wikang medikal at pinanatili ang pagkakaiba ng mga karamdaman, demonyong pagpapahirap, pangingisay, at pagkaparalisa.
