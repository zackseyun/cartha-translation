  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: tl
  text: At napakaraming tao ang sumunod sa kanya mula sa Galilea, Decapolis, Jerusalem, Judea, at mula sa ibayo ng Ilog Jordan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa kabilang panig ng Ilog Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: sumunod
  rationale: Likas na katumbas sa salaysay; maaari itong tumukoy sa aktuwal na pagsunod kay Jesus nang hindi ipinapalagay na ganap nang mga alagad ang lahat.
- source_word: ὄχλοι πολλοὶ
  choice: napakaraming tao
  rationale: Mas natural sa modernong Filipino kaysa sa literal na “maraming pulutong,” habang malinaw na ipinahahayag ang napakalaking bilang ng mga taong nagtipon.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Karaniwang pananda ng pinagmulan; saklaw nito ang buong talaan ng mga lugar.
- source_word: Γαλιλαίας
  choice: Galilea
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
- source_word: Δεκαπόλεως
  choice: Decapolis
  rationale: Pinananatili ang nakikilalang pangalang pantangi ng rehiyon ng sampung lungsod.
- source_word: Ἱεροσολύμων
  choice: Jerusalem
  rationale: Karaniwang anyong Filipino ng pangalan ng lungsod.
- source_word: Ἰουδαίας
  choice: Judea
  rationale: Karaniwang anyong Filipino ng pangalan ng rehiyon.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sa ibayo ng Ilog Jordan
  rationale: Ipinapahayag ang pook na nasa kabila ng Jordan at pinananatili ang pananaw na heograpiko ng Griyego; idinagdag ang “Ilog” bilang likas na pagtukoy sa Jordan sa Filipino.
- source_word: καὶ ... καὶ ... καὶ
  choice: mga kuwit at pangwakas na “at”
  rationale: Natural na paraan sa Filipino ng pag-uugnay sa magkakasunod na pangalan ng mga lugar habang pinananatili ang pinagsama-samang lawak ng talaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sumunod” upang mapanatili ang maaaring pisikal at maka-alagad na diwa ng ἀκολουθέω nang hindi pinalalabis ang antas ng pagtatalaga ng mga tao.
