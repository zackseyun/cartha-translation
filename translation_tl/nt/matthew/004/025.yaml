  source_fidelity: 'Tumpak ang pangunahing diwa: maraming tao ang sumunod kay Jesus mula sa limang heograpikong pinagmulan. Gayunman, ang huling pariralang “at sa ibayo ng Ilog Jordan” ay mas madaling mabasa bilang simpleng lokasyon kaysa bilang huling pinagmulang saklaw ng ἀπό. Ang pag-uulit ng “mula sa” ay ligtas at nililinaw ang saklaw nang hindi binabago ang kahulugan.'
