  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: tl
  text: Nang marinig niyang ipinasa na si Juan[a], umalis siya patungong Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tiyak na diwa sa konteksto, “inaresto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Nang marinig niya
  rationale: Ang aorist participle ay temporal kaugnay ng pangunahing pandiwa. Likas sa modernong Tagalog ang “Nang marinig niya,” at ang ipinahihiwatig na simuno ay si Jesus.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang pang-ugnay ito na naghuhudyat ng pagpapatuloy o paglipat sa salaysay, hindi ng matinding pagsalungat. Sapat nang ipinahihiwatig ng natural na daloy ng pangungusap sa Tagalog.
- source_word: Ἰωάννης
  choice: Juan
  rationale: Ito ang nakagawiang anyo ng pangalang Ἰωάννης sa Bibliyang Tagalog.
- source_word: παρεδόθη
  choice: ipinasa sa mga awtoridad
  rationale: Pinananatili nito ang diwang ‘ibinigay o ipinasa sa kapangyarihan ng iba’ nang hindi agad nililimitahan ang pandiwa sa teknikal na kahulugang ‘inaresto.’ Idinagdag ang “sa mga awtoridad” upang maging malinaw at natural sa Tagalog ang kontekstuwal na diwa ng pasibong pandiwa.
- source_word: ἀνεχώρησεν
  choice: umalis siya
  rationale: Sa konteksto, tumutukoy ito sa pag-alis o pagpunta sa ibang lugar bilang tugon sa balita. Ang “umalis” ay natural at hindi nagpapahiwatig nang labis ng takot na maaaring idulot ng “umatras.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: patungong Galilea
  rationale: Likas na ipinahahayag ng “patungo” ang direksiyon ng εἰς; ang “Galilea” ang nakagawiang anyo ng pangalan sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa παραδίδωμι kaugnay ni Juan
  choice: ipinasa sa mga awtoridad
  alternative: inaresto
  rationale: Mas malawak ang pandiwang Griyego kaysa sa teknikal na ‘inaresto’ at maaari itong magtaglay ng diwang inilagay sa kapangyarihan ng iba. Pinananatili ng pangunahing teksto ang lawak na iyon, habang inilalagay sa talababa ang mas tiyak na kahulugang hinihingi ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Iniwasan ang makalumang “nang mabalitaan” at ang malabong literal na “ibinigay,” habang pinanatili sa talababa ang kontekstuwal na alternatibo.
