  text: And they immediately left the nets and followed him.
translation:
  language: tl
  text: Agad nilang iniwan ang mga lambat at sumunod sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (hindi isinalin nang hiwalay)
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa salaysay. Sa natural na modernong Tagalog, sapat na ang tuwirang pagsisimula sa “Agad”; ang pagdaragdag ng “at” o “ngunit” sa unahan ay magiging pilit o magpapahiwatig ng kontrast na wala sa Griyego.
- source_word: εὐθέως
  choice: Agad
  rationale: Malinaw nitong pinananatili ang diin sa mabilis at walang-pag-aatubiling pagtugon.
- source_word: ἀφέντες
  choice: iniwan
  rationale: 'Ang aorist participle ay tumutukoy sa pagkilos na nauuna sa pagsunod. Natural itong ipinahahayag sa Tagalog bilang sunod na mga pandiwa: “iniwan … at sumunod.” Hindi ginamit ang mas matinding “tinalikuran” o “pinabayaan.”'
- source_word: τὰ δίκτυα
  choice: ang mga lambat
  rationale: Ang “mga lambat” ay karaniwan at malinaw sa konteksto ng pangingisda, at pinananatili ang tiyak na pantukoy ng Griyego nang hindi idinaragdag ang “kanilang” o “pangisda.”
- source_word: ἠκολούθησαν αὐτῷ
  choice: sumunod sa kanya
  rationale: Natural na katumbas ito ng pandiwa at datibo sa Tagalog. Napananatili nito kapwa ang literal na pagsunod kay Jesus at ang umuusbong na diwa ng pagiging alagad.
theological_decisions:
- issue: Diwa ng pagiging alagad sa ἠκολούθησαν αὐτῷ
  choice: sumunod sa kanya
  alternative: sumama sa kanya
  rationale: Ang “sumunod sa kanya” ay maaaring tumukoy kapwa sa pisikal na pagsunod at sa pagkapit bilang alagad. Hindi nito nililimitahan ang pahayag sa simpleng pagsama lamang at hindi rin ito nagdaragdag ng mas tahasang wikang doktrinal kaysa sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak, natural, at marangal. Ang ayos na “Agad nilang iniwan…” ay idiomatiko at pinananatili ang diin ng εὐθέως sa unahan.
