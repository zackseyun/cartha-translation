base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: tl
  text: Pagkatapos nito, iniwan siya ng diyablo, at narito, lumapit ang mga anghel at naglingkod sa kaniya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “at patuloy na naglingkod sa kaniya.” Ang pandiwang Griyego ay maaaring mangahulugang “naglingkod” o “nag-asikaso”; ang anyong imperfect nito ay maaaring magpahiwatig ng nagpapatuloy na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay na nagpapakita ng kasunod na pangyayari.
- source_word: ἀφίησιν
  choice: iniwan
  rationale: Isa itong historical present sa Griyego; ginamit ang pangnagdaan upang maging natural ang daloy ng salaysay sa Tagalog.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Sa salaysay ng pagtukso, ito ang malinaw at kinikilalang katawagan sa personal na kalaban; ang literal na 'maninirang-puri' ay makalalabo sa tinutukoy.
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang panawag-pansing lakas at biglang kasiglahan ng eksena sa isang marangal ngunit nauunawaang anyo.
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Malinaw sa konteksto na mga makalangit na nilalang ang tinutukoy, hindi karaniwang mga mensahero.
- source_word: προσῆλθον
  choice: dumating
  rationale: Natural at maikli sa Tagalog, at sapat na ipinahihiwatig ang paglapit kay Jesus.
- source_word: διηκόνουν
  choice: pinaglingkuran
  rationale: Ipinapahayag ang paglilingkod at pag-aasikaso sa kaniya. Bagaman hindi tahasang minamarkahan ng anyong ito ang tuloy-tuloy na kilos gaya ng imperfect sa Griyego, inilalahad sa talababa ang aspektong iyon.
- source_word: αὐτῷ
  choice: siya
  rationale: Tinutukoy si Jesus bilang tumanggap ng paglilingkod; natural sa Tagalog ang tuwirang layon sa pandiwang 'pinaglingkuran'.
theological_decisions:
- issue: Pagpapakahulugan sa διάβολος bilang katawagan sa salaysay ng pagtukso
  choice: ang diyablo
  alternative: ang maninirang-puri
  rationale: Bagaman maaaring literal na mangahulugang 'maninirang-puri,' ginagamit dito ang salita bilang personal na katawagan sa kalaban ni Jesus. Pinananatili ng 'diyablo' ang linaw nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang “masdan” upang maipahayag ang panawag-pansing ἰδού, habang iniwasan ang labis na arkaiko o denominasyonal na pananalita.
