  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: tl
  text: Muli, isinama siya ng diyablo sa isang napakataas na bundok at ipinakita sa kanya ang lahat ng kaharian ng mundo at ang kanilang kaluwalhatian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karangyaan.”
    reason: Ang δόξα sa kontekstong ito ay maaaring tumukoy sa nakikitang dingal, kaningningan, o karangyaan ng mga kaharian.
lexical_decisions:
- source_word: Πάλιν
  choice: Muli
  rationale: Likas at maikling panandang inuulit ang pangyayari sa magkakasunod na tukso.
- source_word: παραλαμβάνει
  choice: isinama
  rationale: Ipinahihiwatig ng pandiwa ang pagdadala o pagsama sa isang tao; natural sa Tagalog ang “isinama” sa ganitong konteksto. Ginamit ang pangnagdaan para sa karaniwang daloy ng salaysay sa Tagalog, bagaman pangkasalukuyan ang anyong Griyego.
- source_word: ὁ διάβολος
  choice: ang diyablo
  rationale: Karaniwan at malinaw na katawagan sa modernong Tagalog para sa kinikilalang tauhan sa salaysay.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: sa isang napakataas na bundok
  rationale: Pinananatili ng “napakataas” ang mariing diwa ng λίαν at natural ang pariralang ito sa Tagalog.
- source_word: δείκνυσιν
  choice: ipinakita
  rationale: Direkta at hindi pinalabis na katumbas ng pandiwa; ginamit ang pangnagdaan ayon sa natural na salaysay sa Tagalog.
- source_word: πάσας τὰς βασιλείας
  choice: ang lahat ng kaharian
  rationale: Pinananatili ang kabuuang saklaw ng πάσας at ang pampolitika at makaharing diwa ng βασιλείας.
- source_word: τοῦ κόσμου
  choice: sa mundo
  rationale: Natural na salin ng κόσμος sa kontekstong tumutukoy sa buong daigdig o kaayusan ng mundo.
- source_word: τὴν δόξαν αὐτῶν
  choice: ang kanilang kaluwalhatian
  rationale: Pinananatili ang malawak na saklaw at teolohikal na ugnayang leksikal ng δόξα; maaaring tumukoy rito sa nakikitang karangyaan o kaningningan ng mga kaharian.
theological_decisions:
- issue: Kalikasan ng pagpapakita ng lahat ng kaharian mula sa bundok
  choice: Isinalaysay nang tuwiran ang pagdadala at pagpapakita, nang hindi ipinaliliwanag kung ito ay literal, pangitain, o sobrenatural.
  alternative: Tukuying tahasan bilang literal na tanawin mula sa bundok o bilang isang pangitain o sobrenatural na pagpapakita.
  rationale: Hindi nililinaw ng Griyegong teksto ang paraan ng pagpapakita; dapat panatilihin ng salin ang gayong kawalang-tiyak at hindi magpasok ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Pinili ang pangnagdaang mga pandiwa para sa likas na daloy ng salaysay sa Tagalog. Inilagay ang panandang talababa pagkatapos ng “kaluwalhatian,” ang salitang tinutukoy nito.
