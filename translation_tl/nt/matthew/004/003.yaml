  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: tl
  text: Lumapit ang manunukso at sinabi sa kanya, “Kung ikaw ang Anak ng Diyos,[a] sabihin mong maging mga tinapay[b] ang mga batong ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “Yamang ikaw ang Anak ng Diyos.” Maaaring magsilbing hamon ang pasubaling Griyego sa halip na magpahayag lamang ng pag-aalinlangan.'
    reason: alternative_reading
  - marker: b
    text: Pangmaramihan ang salitang Griyego at maaari ring isaling “mga tinapay” o “mga bilog ng tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Lumapit
  rationale: Ipinahahayag ng aorist participle ng προσέρχομαι ang paglapit kay Jesus bago nagsalita; tuwiran at natural ang “lumapit” sa Tagalog.
- source_word: ὁ πειράζων
  choice: ang manunukso
  rationale: Ang substantival present participle ay tumutukoy sa gumagawa ng panunukso. Ang “manunukso” ay likas at angkop na katawagan sa konteksto.
- source_word: εἶπεν αὐτῷ
  choice: sinabi sa kanya
  rationale: Tuwirang katumbas ng karaniwang gamit ng λέγω na may di-tuwirang layon, nang hindi dinaragdagan ang lakas ng pandiwa.
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ng “kung” ang anyong pasubali at ang posibleng puwersa nito bilang hamon, nang hindi ipinapasyang ito ay pag-aalinlangan o pagkilala.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: ang Anak ng Diyos
  rationale: Bagaman walang artikulo ang υἱός sa predikatibong konstruksiyon, sa konteksto ng Mateo ito ay natatanging titulo ni Jesus; natural sa Tagalog ang “ang Anak ng Diyos.”
- source_word: εἰπὲ
  choice: sabihin mong
  rationale: Pinananatili nito ang pangunahing kahulugan ng λέγω at naipahahayag nang natural ang performatibong utos, nang hindi gumagamit ng mas malakas na “iutos,” na hindi tahasang nasa Griyego.
- source_word: ἵνα
  choice: -ng (sa “sabihin mong maging”)
  rationale: Ang pang-angkop na konstruksiyong Tagalog ay natural na naghahatid ng nilalaman o nilalayong resulta ng pautos na εἰπὲ.
- source_word: οἱ λίθοι οὗτοι
  choice: ang mga batong ito
  rationale: Pinananatili ang pangmaramihang anyo at ang diin ng demonstratibong οὗτοι.
- source_word: ἄρτοι
  choice: mga tinapay
  rationale: Ang Griyego ay pangmaramihan at maaaring tumukoy sa mga piraso o limpak ng tinapay. Ang “mga tinapay” ay nagpapanatili sa bilang nang nauunawaan sa modernong Tagalog.
- source_word: γένωνται
  choice: maging
  rationale: Neutral at tuwirang ipinahahayag ng “maging” ang kahulugan ng γίνομαι na pagbabago o pagdating sa isang kalagayan.
theological_decisions:
- issue: Puwersa ng pasubaling Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: “Kung ikaw ang Anak ng Diyos”
  alternative: “Yamang ikaw ang Anak ng Diyos” o “Kung tunay ngang ikaw ang Anak ng Diyos”
  rationale: Maaaring gumana ang pasubali bilang isang hamon at hindi lamang bilang pagpapahayag ng pag-aalinlangan. Pinananatili ng payak na “kung” ang sinadyang tensiyon at kalabuan.
- issue: Kristolohikal na titulong υἱὸς τοῦ θεοῦ
  choice: “ang Anak ng Diyos”
  alternative: “isang anak ng Diyos”
  rationale: Sa salaysay ni Mateo, ang parirala ay tumutukoy sa natatanging titulo ni Jesus at hindi sa pagiging kabilang lamang sa isang pangkalahatang uri. Hindi ito pinalalawak nang lampas sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “manunukso,” “Anak ng Diyos,” at payak na ayos ng pangungusap upang mapanatili ang dignidad at linaw, habang hindi pinapawi ang retorikal na kalabuan ng pasubali.
