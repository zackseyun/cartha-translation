  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: tl
  text: At narito, lumapit ang isang lalaking may ketong at nagpatirapa sa harap niya[a], at sinabi, “Panginoon, kung kalooban mo, kaya mo akong linisin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sa kaniya.” Ang pandiwang Griyego ay maaaring tumukoy sa pagpapatirapa bilang paggalang, pagbibigay-pugay, o pagsamba, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang puwersang pantawag-pansin at ang sigla ng salaysay sa isang dignidad ngunit nauunawaang anyong Tagalog.
- source_word: λεπρὸς
  choice: isang lalaking may ketong
  rationale: Tumutukoy ang substantibong pang-uri sa isang taong may sakit sa balat na tradisyonal na tinatawag na ketong. Natural ito sa modernong Tagalog at hindi inuuwi ang pagkakakilanlan ng tao sa kaniyang karamdaman.
- source_word: προσελθὼν
  choice: lumapit
  rationale: Tuwirang ipinahahayag ang paglapit ng lalaki kay Jesus.
- source_word: προσεκύνει
  choice: nagpatirapa sa harap niya
  rationale: Inilalarawan ang kilos ng malalim na paggalang nang hindi agad nilulutas kung ang kilos ay pagsamba sa ganap na diwa nito.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang saklaw ng magalang na pagkilala sa awtoridad ni Jesus at ang posibleng kristolohikal na bigat ng tawag.
- source_word: ἐὰν θέλῃς
  choice: kung kalooban mo
  rationale: Natural at marangal na pahayag ito ng kondisyon hinggil sa kagustuhan o pagpapasya ni Jesus.
- source_word: δύνασαί
  choice: kaya mo
  rationale: Malinaw at natural na ipinahahayag sa modernong Tagalog ang kakayahan o kapangyarihan.
- source_word: καθαρίσαι
  choice: linisin
  rationale: Pinananatili ang pisikal at ritwal na pahiwatig ng καθαρίζω sa konteksto ng ketong, sa halip na paliitin ito sa pangkalahatang pagpapagaling.
theological_decisions:
- issue: Kahulugan ng προσκυνέω bilang kilos na iniukol kay Jesus
  choice: nagpatirapa sa harap niya
  alternative: sumamba sa kaniya
  rationale: Maaaring tumukoy ang pandiwa sa pagpapatirapa, pagbibigay-galang, o pagsamba. Inilalarawan ng pangunahing teksto ang malinaw na kilos ng matinding paggalang habang pinananatiling bukas ang buong teolohikal na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “isang lalaking may ketong” bilang makataong paglalarawan; pinanatili ang “linisin” upang maipahayag ang higit sa karaniwang pagpapagaling.
