  to: At sinabi niya sa kanila, “Humayo kayo.” Lumabas sila at pumasok sa mga baboy. At narito, rumagasa ang buong kawan pababa sa matarik na dalisdis, papasok sa dagat, at namatay sa tubig.[a][b]
  rationale: Pinalitan ang 'patungo sa dagat' ng 'papasok sa dagat' upang tapat na maipahayag ang εἰς. Inalis ang 'Kaya,' na maaaring magdagdag ng mas malakas na ugnayang resulta kaysa sa payak na pagpapatuloy ng δέ. Inayos din ang ayos ng salita para sa likas na daloy sa modernong Filipino, nang hindi binabago ang kahulugan o ang sinadyang hindi-interpretatibong 'namatay sa tubig.'
