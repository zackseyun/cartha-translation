  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: tl
  text: At sinabi niya sa kanila, “Humayo kayo.” Lumabas sila at pumasok sa mga baboy. At narito, rumagasa ang buong kawan pababa sa matarik na dalisdis, papasok sa dagat, at namatay sa tubig.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pababa sa bangin.” Ang salitang Griyego ay maaaring tumukoy sa matarik na dalisdis, pampang, o bangin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nalunod sa tubig.” Mas literal na sinasabi ng Griyego na “namatay sa tubig.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Humayo kayo
  rationale: Maikli at tuwirang pautos ito, gaya ng Griyego. Dignified ang “humayo” ngunit malinaw pa rin sa karaniwang mambabasa.
- source_word: οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς τοὺς χοίρους
  choice: Kaya lumabas sila at pumasok sa mga baboy
  rationale: Tinutukoy ng pangmaramihang “sila” ang mga demonyo ayon sa konteksto, nang hindi inuulit ang pangngalan na wala sa mismong sugnay. Ang “pumasok sa” ang likas na salin ng kilos tungo sa mga baboy.
- source_word: ἰδοὺ
  choice: At narito
  rationale: Pinananatili nito ang pantawag-pansing bisa ng salitang Griyego sa halip na alisin ito o gawing tahasang “bigla,” na hindi nito tuwirang sinasabi.
- source_word: πᾶσα ἡ ἀγέλη
  choice: ang buong kawan
  rationale: Likas na ipinahahayag sa Filipino ang kabuuan ng kolektibong pangngalan.
- source_word: ὥρμησεν
  choice: rumagasa
  rationale: Ipinahihiwatig ng pandiwa ang biglaan at marahas na pagkilos; malinaw itong naihahatid ng “rumagasa.”
- source_word: κατὰ τοῦ κρημνοῦ
  choice: pababa sa matarik na dalisdis
  rationale: Maaaring tumukoy ang κρημνός sa matarik na dalisdis, pampang, o bangin. Ang pangunahing salin ay malinaw nang hindi ipinapalagay na patayong bangin iyon.
- source_word: εἰς τὴν θάλασσαν
  choice: patungo sa dagat
  rationale: Pinananatili ang karaniwang kahulugan ng θάλασσα na “dagat” sa halip na palitan ito ng heograpikong pagpapaliwanag na “lawa.”
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: namatay sa tubig
  rationale: Tuwirang sinasabi ng Griyego na namatay sila sa tubig. Likas sa Filipino ang isahang kolektibong “tubig,” kahit pangmaramihan ang anyo sa Griyego.
theological_decisions:
- issue: Antas ng interpretasyon sa paglalarawan ng pagkamatay ng kawan
  choice: “namatay sa tubig” sa pangunahing teksto
  alternative: “nalunod sa tubig”
  rationale: Malakas na ipinahihiwatig ng salaysay na nalunod ang mga baboy, ngunit “namatay” lamang ang tahasang sinasabi ng pandiwang Griyego. Pinananatili ng pangunahing salin ang pagkakaiba ng sinabi at ng makatwirang hinuha.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinili ang “Humayo kayo” upang mapanatili ang maigsi at mariing utos, samantalang ang ibang bahagi ay gumagamit ng karaniwang sintaks at bokabularyo. Ang “At narito” ay sadyang bahagyang mataas ang register upang mapanatili ang pantawag-pansing puwersa ng ἰδοὺ.
