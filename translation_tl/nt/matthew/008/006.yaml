base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: tl
  text: at nagsabi siya, “Panginoon, nakahiga sa bahay ang lingkod ko[a], paralisado at lubhang naghihirap[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang lalaki ko” o “anak ko.” Maaaring tumukoy ang salitang Griyego sa isang lingkod o sa isang bata, bagaman mas angkop sa konteksto ng senturyon ang “lingkod.”
    reason: lexical_alternative
  - marker: b
    text: O “labis na pinahihirapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: at sinabi niya
  rationale: Bagaman kasalukuyang pandiwaring-partisipyo ang λέγων, likas sa makabagong Tagalog na gawin itong tiyak na pandiwa upang maipagpatuloy nang malinaw ang salaysay.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang maaaring simpleng magalang o mas mataas na pagkilala kay Jesus, nang hindi ipinipilit ang alinman.
- source_word: ὁ παῖς μου
  choice: ang lingkod ko
  rationale: Maaaring mangahulugan ang παῖς na lingkod, batang lalaki, o anak. Sa konteksto ng senturyon, pinakamalamang ang “lingkod,” ngunit inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: nakahiga sa bahay
  rationale: Ipinahihiwatig ng perpektong pasibo ang kalagayang kinasasadlakan niya; natural na ipinapahayag ito sa Tagalog bilang “nakahiga sa bahay.”
- source_word: παραλυτικός
  choice: Paralisado siya
  rationale: Direkta, kasalukuyan, at madaling maunawaang paglalarawan ito sa kaniyang kalagayan.
- source_word: δεινῶς βασανιζόμενος
  choice: lubhang naghihirap
  rationale: Ipinahahayag nito ang tindi ng pagdurusa nang hindi nagdaragdag ng tiyak na sanhi o tagapagpahirap na hindi binanggit sa teksto.
theological_decisions:
- issue: Lakas ng κύριε bilang tawag kay Jesus
  choice: Panginoon
  alternative: Ginoo
  rationale: Maaaring magpahiwatig ang tawag ng magalang na pakikipag-usap o ng mas malalim na pagkilala. Pinananatili ng “Panginoon” ang teolohikal na pagiging bukás ng tagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang pahayag sa loob ng sipi upang maging natural at madaling maunawaan, habang pinananatili ang lahat ng nilalaman at tindi ng Griyego.
