  source_fidelity: 'Tumpak ang pangunahing diwa: ang senturyon ay nagsasalita kay Jesus tungkol sa kaniyang παῖς na nasa bahay, paralisado, at matinding nagdurusa. Gayunman, mas maayos na panatilihing magkakaugnay ang mga paglalarawang nakasalalay sa «ang lingkod ko»; ang paghahati sa “Paralisado siya” ay hindi mali ngunit bahagyang nagpapaluwag sa estruktura ng Griyego. Ang talababa sa [b] ay dapat ding magbigay ng mas likas at malinaw na alternatibo para sa pasibong βασανιζόμενος.'
  naturalness: 'Likas ang “Panginoon,” “lingkod ko,” “nakahiga sa bahay,” at “lubhang naghihirap.” Mas matatas at mas marangal sa modernong Tagalog ang isang magkakaugnay na pangungusap: “nakahiga sa bahay ang lingkod ko, paralisado at lubhang naghihirap.”'
