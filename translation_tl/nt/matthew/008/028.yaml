revisions:
- from: Pagdating niya sa kabilang ibayo, sa lupain ng mga Gadareno[a], sinalubong siya ng dalawang lalaking sinasapian ng mga demonyo. Lumabas sila mula sa mga libingan at napakabangis nila, kaya walang sinumang makadaan sa daang iyon.
  to: Nang makarating siya sa kabilang panig, sa lupain ng mga Gadareno[a], sinalubong siya ng dalawang lalaking sinasapian ng mga demonyo. Lumabas sila mula sa mga libingan at napakabangis nila, kaya walang sinumang makadaan sa daang iyon.
