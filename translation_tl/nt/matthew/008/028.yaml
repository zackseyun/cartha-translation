id: MAT.8.28
reference: Matthew 8:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: tl
  text: Nang makarating siya sa kabilang panig, sa lupain ng mga Gadareno[a], sinalubong siya ng dalawang lalaking sinasapian ng mga demonyo. Lumabas sila mula sa mga libingan at napakabangis nila, kaya walang sinumang makadaan sa daang iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “mga Gergeseno” o “mga Geraseno” sa halip na “mga Gadareno.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Pagdating niya
  rationale: Likas na temporal na sugnay sa Tagalog para sa genitive absolute; pinananatili ang pagkakasunod ng pangyayari.
- source_word: τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Tumutukoy sa kabilang panig ng lawa sa konteksto at angkop sa dignidad ng salaysay.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: sa lupain ng mga Gadareno
  rationale: Ang χώρα ay isang lupain o rehiyon; sinusunod ng Gadareno ang pangunahing pagbasa ng SBLGNT.
- source_word: ὑπήντησαν αὐτῷ
  choice: sinalubong siya
  rationale: Ipinahihiwatig ng ὑπαντάω ang pagharap o pagsalubong sa isang dumarating; natural ito sa tagpong inilalarawan.
- source_word: δύο δαιμονιζόμενοι
  choice: dalawang lalaking sinasapian ng mga demonyo
  rationale: Malinaw at karaniwang Tagalog na naghahayag ng kapangyarihan ng mga demonyo sa mga lalaki nang hindi gumagamit ng di-likas na teknikal na termino.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: Lumabas sila mula sa mga libingan
  rationale: Ginawang hiwalay na pangungusap para sa malinaw at natural na daloy; ang μνημεῖον dito ay mga libingan.
- source_word: χαλεποὶ λίαν
  choice: napakabangis nila
  rationale: Sinasaklaw ng bangis ang pagiging mabagsik at mapanganib nang hindi nililimitahan ang kahulugan sa aktuwal na karahasang pisikal.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: kaya walang sinumang makadaan sa daang iyon
  rationale: Natural na ipinapahayag ang resultang sugnay; ang ἰσχύειν ay kakayahan dito at ang διὰ τῆς ὁδοῦ ay pagdaan sa mismong daan.
theological_decisions:
- issue: Paglalarawan sa impluwensiya ng mga demonyo
  choice: sinasapian ng mga demonyo
  alternative: nasa kapangyarihan ng mga demonyo
  rationale: Ang piniling parirala ay malinaw at pamilyar sa modernong Tagalog, at pinananatili ang personal na demonyong ahensiya sa teksto nang hindi nagdaragdag ng mas teknikal na paliwanag.
- issue: Pagkakaiba-iba ng pangalan ng lugar sa mga manuskrito
  choice: mga Gadareno
  alternative: mga Gergeseno o mga Geraseno
  rationale: Sinusunod ng pangunahing teksto ang Γαδαρηνῶν ng SBLGNT, samantalang inilalagay sa talababa ang mahahalagang variant.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa karaniwang mambabasa. Iniwasan ang sobrang literal na ayos ng Griyego, ngunit pinanatili ang nilalaman, tindi, at resultang ugnayan ng mga sugnay.
