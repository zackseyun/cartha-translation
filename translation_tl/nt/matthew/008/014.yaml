  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: tl
  text: Nang dumating si Jesus sa bahay ni Pedro, nakita niya ang biyenan ni Pedro na nakahiga[a] at nilalagnat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaratay.” Literal na inilalarawan ng Griyego na siya ay nakahiga at nilalagnat; ipinahihiwatig ng konteksto ang pagkakasakit, ngunit hindi tahasang binabanggit ang higaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Nang dumating si Jesus
  rationale: Isinasalin ang aorist participle bilang natural na sugnay na temporal sa Tagalog, habang pinananatili ang pagkakasunod ng pangyayari.
- source_word: οἰκίαν Πέτρου
  choice: bahay ni Pedro
  rationale: Tuwiran at likas na pagpapahayag ng pagmamay-ari; ang “bahay” ang karaniwang katumbas ng οἰκία sa kontekstong ito.
- source_word: πενθερὰν αὐτοῦ
  choice: biyenang babae ni Pedro
  rationale: Tiyak na babaeng biyenan ang πενθερά. Inuulit ang pangalang Pedro upang luminaw na sa kanya tumutukoy ang αὐτοῦ at hindi kay Jesus.
- source_word: βεβλημένην
  choice: nakahiga
  rationale: Ipinahahayag ng perfect passive participle ang kalagayan niyang nakahiga o nailagay sa pagkakahiga. Hindi idinagdag ang “sa higaan,” sapagkat hindi iyon tahasang sinabi sa Griyego.
- source_word: πυρέσσουσαν
  choice: nilalagnat
  rationale: Natural at tuwirang modernong Tagalog para sa nagpapatuloy na kalagayang may lagnat, nang hindi dinaragdagan ang tindi ng paglalarawan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ sa pariralang πενθερὰν αὐτοῦ
  choice: Si Pedro ang tinutukoy; ang babae ay biyenan ni Pedro.
  alternative: Maaaring mapagkamalang kay Jesus tumutukoy ang panghalip kung gagamiting “ang kanyang biyenang babae.”
  rationale: Batay sa sintaks at konteksto, ang bahay at ang biyenan ay kapuwa kaugnay ni Pedro. Nilinaw ito ng salin nang hindi humahango ng karagdagang doktrinal na konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang “nilalagnat” kaysa mas mahaba o mas matinding paglalarawan. Ang pag-uulit sa “Pedro” ay sinadya upang alisin ang kalituhan sa tinutukoy ng panghalip.
