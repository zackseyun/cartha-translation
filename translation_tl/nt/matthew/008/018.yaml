  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: tl
  text: Nang makita ni Jesus ang maraming taong nakapaligid sa kanya, iniutos niyang pumunta sa kabilang panig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: maraming tao
  rationale: Likas sa modernong Tagalog bilang kolektibong pagtukoy sa maraming taong nagkakatipon; ang literal na “maraming pulutong” ay mabigat at di-karaniwan.
- source_word: ἐκέλευσεν
  choice: iniutos
  rationale: Pinananatili ang diwa ng makapangyarihang utos, hindi lamang mungkahi.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: tumawid sila sa kabilang ibayo
  rationale: Sa konteksto, ang τὸ πέραν ay kabilang panig ng lawa. Ginagawang malinaw sa Tagalog ang ipinahiwatig na mga gagawa ng utos nang hindi ipinapalagay na si Jesus lamang ang aalis.
theological_decisions:
- issue: Hindi tahasang paksa ng infinitive na ἀπελθεῖν
  choice: tumawid sila
  alternative: tumawid / pumunta siya
  rationale: Ang utos ay natural na nauukol sa mga alagad o kasamang sasakay, at malamang na kabilang si Jesus; iniiwasang gawing si Jesus lamang ang tahasang paksa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kabilang ibayo” bilang natural na pananalita para sa kabilang panig ng lawa; walang idinagdag na “lawa” dahil hindi ito tahasang nasa talata.
