  verdict: revise
  source_fidelity: Ang “maraming tao” ay katanggap-tanggap na likas na kolektibong salin ng πολλοὺς ὄχλους. Gayunman, ang “tumawid sila” ay tahasang nagtatalaga ng maramihang paksa sa infinitive na ἀπελθεῖν, samantalang hindi ito tinukoy sa Griyego. Ang ἀπελθεῖν ay mas malawak na “pumunta/umalis,” at hindi kailangang tahasang sabihing “tumawid.”
  naturalness: Natural ang pangungusap sa kabuuan, ngunit mas maayos at mas tapat sa ipinahiwatig na paksa ang impersonal na kayariang “iniutos niyang pumunta.” Ang “sa kabilang panig” ay payak at karaniwan sa modernong Filipino Tagalog.
  terminology: Wasto ang “Jesus” at ang marangal ngunit modernong rehistro. Walang natatanging terminong teolohikal sa talata.
  issues:
  - severity: medium
    issue: Tahasan ang maramihang paksa sa “tumawid sila.”
    rationale: Walang hayag na paksa ang ἀπελθεῖν sa Griyego. Bagaman malamang na ang mga alagad o kasamahan ang tinutukoy, mas mabuting huwag itong tukuyin bilang “sila” sa salin.
  - severity: low
    issue: Ang “tumawid” ay mas tiyak kaysa sa ἀπελθεῖν.
    rationale: Ipinahihiwatig ng “sa kabilang panig” ang pagpunta sa kabila, ngunit ang pandiwa mismo ay “umalis/pumunta,” hindi tahasang “tumawid.”
  revised_text: Nang makita ni Jesus ang maraming taong nakapaligid sa kanya, iniutos niyang pumunta sa kabilang panig.
  revised_footnotes: []
