source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: tl
  text: At sinabi sa kanya ni Jesus, “May mga lungga ang mga soro, at may mga pugad ang mga ibon sa langit, ngunit ang Anak ng Tao[a] ay walang mapaghimlayan ng kanyang ulo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ng Tao” ay sariling tawag ni Jesus. Isinasalin ito ng ilan bilang “ang Isang Tao,” ngunit interpretatibong salin iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaan na “sinabi.”
- source_word: ἀλώπεκες
  choice: mga soro
  rationale: Tuwirang katumbas sa Tagalog ng pangmaramihang pangngalan.
- source_word: φωλεοὺς
  choice: mga lungga
  rationale: Natural na tawag sa tirahan o taguan ng mga hayop at angkop sa mga soro.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa langit
  rationale: Pinananatili ang larawang οὐρανός habang natural sa Tagalog ang pariralang “mga ibon sa langit.”
- source_word: κατασκηνώσεις
  choice: mga pugad
  rationale: Sa konteksto ng mga ibon, “mga pugad” ang malinaw at karaniwang katumbas, bagaman maaari ring tumukoy ang salita sa mga pahingahan o tuluyan.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang sariling tawag ni Jesus at ang posibleng teolohikal na alusyon nito nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: οὐκ ἔχει ποῦ
  choice: walang
  rationale: Natural na ipinahahayag sa Tagalog ang pinagsamang pagtanggi at ποῦ sa pamamagitan ng “walang” kasunod ang bagay o lugar na tinutukoy.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: mahimlayan ng kanyang ulo
  rationale: Ang “mahimlayan ng kanyang ulo” ay dignidad at natural na idyomang Tagalog na nagpapanatili sa konkretong larawan ng paghilig o pagpapahinga ng ulo.
theological_decisions:
- issue: Pagsasalin sa sariling tawag ni Jesus na ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Ang tradisyonal ngunit malinaw pa ring “Anak ng Tao” ay nagpapanatili sa anyo, ambiguwidad, at posibleng alusyon sa Daniel 7. Ang mas interpretatibong mga alternatibo ay maaaring magpahina sa mga resonansiyang iyon.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “sinabi” sa halip na literal na pangkasalukuyang “sinasabi” upang maging likas ang salaysay, at “mahimlayan” upang mapanatili ang konkretong larawan at solemneng himig.
