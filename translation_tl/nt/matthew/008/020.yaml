  terminology: Ang “Anak ng Tao” ay wastong panatilihin bilang sariling tawag ni Jesus. Ang “Taong Anak” ay hindi natural na Tagalog at maaaring magmukhang ibang titulo; alisin ito sa talababa. Ang “ang Isang Tao” ay maaaring banggitin lamang bilang isang interpretatibong salin, hindi bilang kapalit na kapantay ng pamagat.
