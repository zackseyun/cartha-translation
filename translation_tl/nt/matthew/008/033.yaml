  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: tl
  text: Tumakas ang mga tagapag-alaga, at nang pumunta sila sa lungsod, ibinalita nila ang lahat, pati ang nangyari sa mga lalaking sinasapian ng mga demonyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at ang mga bagay tungkol sa mga lalaking sinasapian ng mga demonyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: ang mga tagapag-alaga
  rationale: Ang participle ay literal na tumutukoy sa mga nagpapakain o nagpapastol; sa konteksto, sila ang nag-aalaga sa kawan ng mga baboy. Likas at malinaw sa modernong Filipino ang “mga tagapag-alaga.” Hindi na hiwalay na isinalin ang δέ sapagkat sapat ang sunod-sunod na daloy ng salaysay.
- source_word: ἔφυγον
  choice: tumakas
  rationale: Tuwirang ipinahahayag ng aorist ng φεύγω ang mabilis na paglayo dahil sa panganib o takot; malinaw at masigla ang “tumakas.”
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: pagpunta nila sa lungsod
  rationale: Ginawang sugnay na pangyayari ang aorist participle upang maging natural sa Filipino, habang pinananatili ang kilos patungo sa lungsod na ipinahahayag ng εἰς.
- source_word: ἀπήγγειλαν
  choice: ibinalita nila
  rationale: Ang ἀπαγγέλλω ay nangangahulugang mag-ulat o magbalita. Ang “ibinalita” ay natural sa salaysay at nagpapahiwatig ng paghahatid ng pangyayari sa mga tao sa lungsod.
- source_word: πάντα
  choice: ang lahat
  rationale: Pinananatili nito ang komprehensibong diwa ng πάντα sa maikli at karaniwang paraan.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: pati ang nangyari sa mga lalaking sinasapian ng mga demonyo
  rationale: Ang literal na parirala ay “at ang mga bagay tungkol sa mga sinasapian.” Ipinahahayag ng “pati ang nangyari” ang kontekstuwal na diwa sa natural na Filipino; ang “mga lalaki” ay makatuwirang isinusuplay mula sa naunang konteksto, kung saan dalawa ang tinutukoy.
- source_word: δαιμονιζομένων
  choice: sinasapian ng mga demonyo
  rationale: Ito ang malinaw at kinikilalang salin para sa mga taong nasa ilalim ng kapangyarihan ng mga demonyo, nang hindi nagdaragdag ng mga teknikal na pagkakaibang hindi sinasabi ng teksto.
theological_decisions:
- issue: Paglalarawan sa δαιμονιζομένων nang kinikilala ang tunay na kapighatiang dulot ng mga demonyo ngunit hindi nagdaragdag ng doktrinal na detalye
  choice: mga lalaking sinasapian ng mga demonyo
  alternative: mga lalaking pinahihirapan ng mga demonyo
  rationale: Ang “sinasapian” ay tuwiran at madaling maunawaan sa Filipino, at naaayon sa konteksto ng salaysay. Hindi nito tinutukoy ang mga sistematikong kategorya o antas ng impluwensiyang hindi nililinaw ng mismong salita.
- issue: Saklaw ng pariralang καὶ τὰ τῶν δαιμονιζομένων
  choice: pati ang nangyari sa mga lalaking sinasapian ng mga demonyo
  alternative: at ang mga bagay tungkol sa mga lalaking sinasapian ng mga demonyo
  rationale: Ang pangunahing teksto ay nagbibigay ng natural na kontekstuwal na kahulugan, samantalang inilalagay sa talababa ang mas literal at sadyang malabong anyo upang hindi maitago ang lawak ng posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lungsod” para sa πόλις at “tagapag-alaga” para sa mga nag-aalaga ng kawan. Iniwasan ang arkayko o labis na teknikal na pananalita; pinanatili sa talababa ang mas literal na anyo ng huling parirala.
