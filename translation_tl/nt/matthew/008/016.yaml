  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: tl
  text: Pagsapit ng gabi, dinala nila sa kanya ang maraming sinasapian ng mga demonyo[a]. Pinalayas niya ang mga espiritu sa pamamagitan ng isang salita, at pinagaling niya ang lahat ng maysakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maraming pinahihirapan ng mga demonyo.” Ang salitang Griyego ay tumutukoy sa mga taong nasa ilalim ng impluwensiya ng mga demonyo; ang “sinasapian ng mga demonyo” ang maikli at nakaugaliang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Pagsapit ng gabi
  rationale: Likas na pariralang Filipino para sa genitive absolute na nagsasaad ng oras; pinananatili nito ang diwang “nang dumating ang gabi.”
- source_word: προσήνεγκαν αὐτῷ
  choice: dinala sa kanya
  rationale: Tuwiran at natural na salin ng pagdadala ng mga tao kay Jesus; hindi na kailangang idagdag kung sino ang mga nagdala sapagkat hindi sila tinutukoy sa Griyego.
- source_word: δαιμονιζομένους πολλούς
  choice: ang maraming sinasapian ng mga demonyo
  rationale: Ang “sinasapian ng mga demonyo” ay maikli, pamilyar, at malinaw na salin sa Filipino, habang ang talababa ay nagpapanatili ng mas malawak na posibilidad na tumutukoy ito sa mga taong nasa ilalim ng mapaminsalang impluwensiya ng mga demonyo.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: Pinalayas niya ang mga espiritu
  rationale: Ang “pinalayas” ay natural sa konteksto ng pagpapalayas ng masasamang espiritu, samantalang “mga espiritu” ay tumutugma nang tuwiran sa bagay ng pandiwa sa Griyego.
- source_word: λόγῳ
  choice: sa pamamagitan ng isang salita
  rationale: Pinananatili ang instrumental na diwa at ang diin sa bisa ng isang salita ni Jesus nang hindi tahasang pinapalitan ito ng “utos,” bagaman ipinahihiwatig iyon ng konteksto.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ang lahat ng maysakit
  rationale: Ang idyomang Griyego ay nangangahulugang mga taong may karamdaman; “maysakit” ang pinakanatural at malinaw na katumbas sa modernong Filipino.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Karaniwang salin ng θεραπεύω sa mga salaysay ng pagpapagaling at malinaw na nagpapahayag ng pagbabalik sa kalusugan.
theological_decisions:
- issue: Kalagayan ng δαιμονιζομένους at pagkakakilanlan ng τὰ πνεύματα
  choice: Panatilihin ang tunay na pagdurusang dulot ng mga demonyo sa “sinasapian ng mga demonyo” at ang tuwirang “mga espiritu.”
  alternative: “mga pinahihirapan ng mga demonyo” o isang paliwanag na tumutukoy lamang sa sakit sa isip
  rationale: Malinaw na ibinubukod ng talata ang pagpapalayas sa mga espiritu mula sa pagpapagaling sa mga maysakit. Kaya hindi dapat gawing sikolohikal lamang ang sariling mga kategorya ng teksto. Gayunman, inilalahad sa talababa ang mas malawak na leksikal na posibilidad ng participle.
- issue: Pahiwatig ng λόγῳ
  choice: Isalin bilang “sa pamamagitan ng isang salita.”
  alternative: “sa pamamagitan ng kanyang salita” o “sa isang utos”
  rationale: Ipinakikita ng parirala ang awtoridad ng salita ni Jesus nang hindi idinaragdag ang possessive na “kanyang” o nililimitahan ang “salita” sa mas tiyak na “utos.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagsapit ng gabi” at “maysakit” para sa likas na daloy, habang pinanatili ang pagkakaiba ng pagpapalayas sa mga espiritu at pagpapagaling sa mga may karamdaman.
