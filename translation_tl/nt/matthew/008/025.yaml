id: MAT.8.25
reference: Matthew 8:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: tl
  text: Lumapit sila at ginising siya. Sinabi nila, “Panginoon, iligtas mo kami[a]! Mamamatay na kami!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sagipin mo kami.” Ang Griyegong pautos na σῶσον ay maaaring tumukoy sa agarang pagsagip mula sa panganib at sa mas malawak na kahulugang “iligtas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: Lumapit sila
  rationale: Ipinahahayag ng aorist participle ang paglapit nila kay Jesus bago nila siya ginising. Likas sa modernong Tagalog ang “lumapit sila” at hindi ito nagdaragdag ng detalyeng wala sa Griyego.
- source_word: ἤγειραν
  choice: ginising siya
  rationale: Sa kontekstong ito, ang ἐγείρω ay tumutukoy sa paggising sa isang natutulog, hindi sa pagbabangon o muling pagkabuhay.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Ipinakikilala ng participle ang mismong sinabi nila. Hinati ito sa bagong pangungusap upang maging natural at malinaw sa Tagalog, nang hindi nagdaragdag ng emosyonal na paglalarawan gaya ng “sumigaw.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang karaniwang katumbas ng κύριος at ang posibleng lalim ng titulo sa konteksto ng Mateo.
- source_word: σῶσον
  choice: iligtas mo kami
  rationale: Ang aorist imperative ng σῴζω ay agarang pakiusap na mailayo sila sa panganib. Likas sa Tagalog na ipahayag ang ipinahihiwatig na layon na “kami,” na malinaw rin sa kasunod na pandiwang nasa unang panauhang maramihan.
- source_word: ἀπολλύμεθα
  choice: Mamamatay na kami
  rationale: Sa agarang panganib ng bagyo, natural na ipinahahayag nito ang nalalapit na kamatayan. Ang “na” ay naghahatid ng kasalukuyan at napipintong kalagayan ng pandiwang Griyego nang hindi nagdaragdag ng tiyak na paraan ng pagkamatay.
theological_decisions:
- issue: Ang bigat ng titulong κύριος na itinatawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Maaaring saklawin ng pagtawag na ito ang magalang na pakikipag-usap at ang mas malalim na pagkilala kay Jesus. Hindi nililimitahan ng “Panginoon” ang kahulugan sa isa lamang sa mga posibilidad na iyon.
- issue: Ang ipinahihiwatig na layon ng σῶσον
  choice: iligtas mo kami
  alternative: iligtas mo
  rationale: Walang hiwalay na panghalip na layon sa Griyego, ngunit malinaw sa konteksto at sa ἀπολλύμεθα na ang nagsasalita ang humihingi ng pagliligtas. Kailangan ang “kami” para sa likas at malinaw na Tagalog.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang maiikling pangungusap at padamdam ay nagpapanatili sa agarang tensiyon ng eksena; iniwasan ang “nalulunod na kami” dahil mas tiyak iyon kaysa sa mismong Griyego.
