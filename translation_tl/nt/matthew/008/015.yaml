  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: tl
  text: At hinipo niya ang kamay ng babae, at iniwan siya ng lagnat. Bumangon siya at naglingkod sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagsimula siyang maglingkod sa kanya.” Maaaring ilarawan ng imperpektong pandiwa sa Griyego ang nagpapatuloy na kilos, bagaman maaari rin itong magpahiwatig ng pagsisimula ng kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: hinipo
  rationale: Ang gitnang anyo ng ἅπτω rito ay nangangahulugang humipo o dumikit. Tumpak at likas ang “hinipo” at hindi nito pinalalabis ang kilos bilang mahigpit na paghawak.
- source_word: τῆς χειρὸς αὐτῆς
  choice: ang kamay nito
  rationale: Karaniwang nangangahulugang “kamay” ang χείρ. Ginagawang likas na layon sa Tagalog ang genitibong konstruksiyon pagkatapos ng ἅπτομαι.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: nawala ang lagnat nito
  rationale: Ang ἀφίημι ay nangangahulugang umalis o lumisan. Ang “nawala ang lagnat nito” ang malinaw at likas na paraan sa modernong Tagalog upang ipahayag ang paggaling nang hindi nagdaragdag ng paliwanag.
- source_word: πυρετός
  choice: lagnat
  rationale: Tuwirang tumutukoy sa lagnat ang pangngalan; hindi kailangang palawakin bilang isang di-tiyak na karamdaman.
- source_word: ἠγέρθη
  choice: bumangon ito
  rationale: Maaaring gamiting intransitibo ang pasibong anyo ng ἐγείρω rito. Sa agarang salaysay, tumayo o bumangon ang babae matapos gumaling; hindi kailangang ipahiwatig ang muling pagkabuhay.
- source_word: διηκόνει αὐτῷ
  choice: naglingkod sa kanya
  rationale: Ang διακονέω ay nangangahulugang maglingkod o mag-asikaso. Ang “naglingkod sa kanya” ay natural sa tagpong ito at hindi ipinipilit kung inchoative o nagpapatuloy lamang ang imperpektong Griyego.
theological_decisions:
- issue: Posibleng teolohikal na labis na pagbasa sa ἠγέρθη bilang “ibinangon”
  choice: Isinalin bilang “bumangon ito” sa karaniwang diwa ng salaysay
  alternative: ibinangon ito
  rationale: Bagaman maaaring iugnay ang ἐγείρω sa muling pagkabuhay sa ibang konteksto, ang agarang diwa rito ay bumangon ang babae matapos gumaling. Hindi dapat magpasok ng teolohiyang hindi hinihingi ng talata.
- issue: Kung ang imperpektong διηκόνει ay pasimulang kilos o nagpapatuloy na paglilingkod
  choice: naglingkod sa kanya
  alternative: nagsimula itong maglingkod sa kanya
  rationale: Hindi tahasang ipinahahayag ng imperpektong anyo ang pagsisimula. Pinananatiling payak ang pangunahing teksto at inilalagay sa talababa ang posibleng pasimulang pagbasa upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nito” para sa babae at “kanya” para kay Jesus upang mabawasan ang kalituhan ng magkakasunod na panghalip; nananatili pa ring likas ang daloy ng salaysay.
