  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: tl
  text: Lumapit sa kanya ang isang eskriba at nagsabi, “Guro, susunod ako sa iyo saan ka man pumunta.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “saan ka man umalis” o “saan ka man magtungo.” Ang pandiwang Griyego ay maaaring mas tiyak na mangahulugang pag-alis, bagaman natural dito ang “pumunta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Lumapit
  rationale: Likas na ipinapahayag sa Tagalog ang paglapit kay Jesus bago magsalita, nang hindi mabigat o paulit-ulit ang parirala.
- source_word: εἷς
  choice: ang isang
  rationale: Pinananatili ang numerong ginagamit nang idyomatiko upang ipakilala ang isang indibidwal.
- source_word: γραμματεὺς
  choice: tagapagturo ng Kautusan
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa “eskriba” at ipinapakita ang tungkulin ng γραμματεύς sa kontekstong Judio nang hindi siya basta tinatawag na tagakopya.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Direkta at natural na salin ng pantawag na διδάσκαλε, nang hindi nagdaragdag ng mas mabigat na diwang teolohikal.
- source_word: ἀκολουθήσω
  choice: susunod ako
  rationale: Pinananatili ang tahasang pangako sa hinaharap at ang posibleng diwa ng pagiging alagad.
- source_word: ὅπου ἐὰν
  choice: saan ka man
  rationale: Natural na Tagalog para sa di-tiyak at walang takdang saklaw na “wherever.”
- source_word: ἀπέρχῃ
  choice: pumunta
  rationale: Idyomatikong angkop sa konteksto; ang mas tiyak na diwang “umalis” ay inilalahad sa talababa.
theological_decisions:
- issue: Pantawag na διδάσκαλος para kay Jesus
  choice: Guro
  alternative: Panginoon / Rabbi
  rationale: Ang “Guro” ang tuwirang kahulugang leksikal at nagpapanatili sa magalang na pagtawag nang hindi nagdaragdag ng titulong mas mabigat sa teolohiya o ng transliterasyong wala sa Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagapagturo ng Kautusan” upang maipaliwanag nang natural ang makasaysayang tungkulin ng γραμματεύς; pinanatiling tuwiran at payak ang pangako ng nagsasalita.
