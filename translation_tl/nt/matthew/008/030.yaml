  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: tl
  text: May malaking kawan ng mga baboy na kumakain sa malayo mula sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malayo sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: may
  rationale: Ipinahahayag ng “may” ang pag-iral ng kawan sa natural na Tagalog. Hindi na ginawang hiwalay na panandang pandiskurso ang banayad na δέ, sapagkat sapat ang daloy ng pangungusap sa konteksto.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: sa may kalayuan mula sa kanila
  rationale: Natural itong pahayag ng di-tiyak na agwat at pinananatili ang ideya ng pagkakalayo nang hindi tiyak kung gaano kalayo.
- source_word: ἀγέλη
  choice: kawan
  rationale: Ang “kawan” ang karaniwan at malinaw na kolektibong tawag sa isang pangkat ng mga hayop.
- source_word: χοίρων
  choice: ng mga baboy
  rationale: Ang “mga baboy” ang tuwiran at makabagong katumbas ng χοίρων.
- source_word: πολλῶν
  choice: malaking
  rationale: Bagaman literal na “marami,” natural sa Tagalog na ilarawan ang isang kawan bilang “malaki” upang ipahiwatig ang dami ng mga hayop.
- source_word: βοσκομένη
  choice: na nanginginain
  rationale: Ipinapakita nito na ang mga hayop ay kasalukuyang kumakain sa pastulan; hindi nito idinaragdag ang ideyang may nagpapastol sa kanila.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nanginginain” bilang likas na salin ng kilos ng kawan, at pinanatili sa talababa ang mas tahasang posibilidad na “malayo.”
