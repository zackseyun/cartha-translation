  source_fidelity: Tumpak na naipahahayag ng draft ang pag-iral ng isang malaking kawan ng baboy na nasa malayo at kumakain. Gayunman, ang “nanginginain” ay maaaring magpahiwatig nang mas tiyak ng pagpapastol o pagkain ng damo; ang participle na βοσκομένη ay mas ligtas na isalin dito bilang “kumakain.”
  naturalness: Ang “Sa may kalayuan mula sa kanila” ay nauunawaan ngunit medyo mabigat at paulit-ulit ang pahiwatig ng layo. Mas likas sa modernong Tagalog ang “sa malayo mula sa kanila.”
