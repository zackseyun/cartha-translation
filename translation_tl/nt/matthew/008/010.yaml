- from: Nang marinig ito ni Jesus, namangha siya at sinabi sa mga sumusunod sa kanya, “Tunay na sinasabi ko sa inyo, sa buong Israel ay wala akong natagpuang sinumang may ganito kalaking pananampalataya.”[a]
  to: Nang marinig ito ni Jesus, namangha siya at sinabi niya sa mga sumusunod sa kanya, “Tunay na sinasabi ko sa inyo, wala akong natagpuang ganito kalaking pananampalataya sa sinuman sa Israel.”
  rationale: Inalis ang di-kinakailangang “buong” upang hindi magdagdag sa saklaw ng ἐν τῷ Ἰσραήλ. Inayos ang pangungusap para sa mas likas na modernong Tagalog at ginawang pangunahing teksto ang malinaw na ayos na tumutugma sa kahulugan ng παρ’ οὐδενὶ ... ἐν τῷ Ἰσραήλ. Hindi kailangan ang talababa sapagkat ang dating tala ay estilistikong alternatibo lamang at hindi nag-iingat ng mahalagang tekstuwal o semantikong kalabuan.
