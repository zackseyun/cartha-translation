id: MAT.8.10
reference: Matthew 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: tl
  text: Nang marinig ito ni Jesus, namangha siya at sinabi niya sa mga sumusunod sa kanya, “Tunay na sinasabi ko sa inyo, wala akong natagpuang ganito kalaking pananampalataya sa sinuman sa Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Nang marinig ito ni Jesus
  rationale: Ang aorist participle ay ginawang likas na temporal na sugnay sa Tagalog. Idinagdag ang “ito” upang malinaw na tumukoy sa naunang sinabi ng senturyon.
- source_word: ἐθαύμασεν
  choice: namangha siya
  rationale: Likas at dignified na salitang nagsasaad ng matinding paghanga o pagkamangha, nang hindi nagdaragdag ng ideya ng kamangmangan o pagkakamali.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: sa mga sumusunod sa kanya
  rationale: Pinananatili nito ang participial na diwa ng mga taong kasalukuyang sumasama at sumusunod kay Jesus, sa halip na gawing pormal na titulo ang parirala.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tunay na sinasabi ko sa inyo
  rationale: Pinananatili ang solemneng diin ng pormulang ἀμήν habang malinaw at pamilyar sa makabagong Tagalog.
- source_word: παρ’ οὐδενὶ
  choice: wala akong natagpuang sinumang may
  rationale: Likas na ipinapahayag sa Tagalog ang kahulugang “sa kaso ng wala ni isa” sa pamamagitan ng pagtukoy sa taong nagtataglay ng gayong pananampalataya.
- source_word: τοσαύτην πίστιν
  choice: ganito kalaking pananampalataya
  rationale: Ang τοσαύτην ay nagbibigay-diin sa antas o laki, kaya tahasang pinananatili ito sa “ganito kalaking”; ang πίστις ay isinaling “pananampalataya.”
- source_word: ἐν τῷ Ἰσραὴλ
  choice: sa buong Israel
  rationale: Ang “sa Israel” ay tumutukoy sa Israel bilang bayan o kalipunan. Ang “buong” ay likas na tumutugma sa negatibong paghahambing ngunit hindi nagbabago sa saklaw nito.
- source_word: εὗρον
  choice: natagpuan
  rationale: Ang aorist ay tuwirang naipapahayag ng aspektong pangnagdaan sa “natagpuan,” na angkop sa karanasan ni Jesus hanggang sa sandaling iyon.
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Sa konteksto, tumutukoy ito sa pagtitiwala ng senturyon sa awtoridad ni Jesus. Ang “pananampalataya” ang pinakatuwirang salin at hindi nito inaalis ang bahaging pagtitiwala.
- issue: Saklaw ng paghahambing sa Israel
  choice: sa buong Israel ay wala akong natagpuang sinumang may ganito kalaking pananampalataya
  alternative: wala akong natagpuang ganito kalaking pananampalataya sa sinuman sa Israel
  rationale: Parehong maaaring ipahayag ng mga ayos na ito ang ugnayan ng παρ’ οὐδενὶ at ἐν τῷ Ἰσραήλ. Pinili sa pangunahing teksto ang mas natural na person-centered na ayos sa Tagalog, habang inilalagay sa talababa ang mas malapit sa pormal na kayarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pamilyar na solemneng pormulang “Tunay na sinasabi ko sa inyo,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
