  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: tl
  text: At sinabi ni Jesus sa senturyon, “Humayo ka. Mangyari sa iyo ayon sa iyong pananampalataya.” At gumaling ang lingkod[a] sa oras ding iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batang lalaki” o “bata.” Ang salitang Griyego na παῖς ay maaaring tumukoy sa isang lingkod o sa isang kabataan. Sa kontekstong ito, ang “lingkod” ang pinakaangkop na salin para sa tauhan ng senturyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: senturyon
  rationale: Ang “senturyon” ang tumpak at pamilyar na tawag sa opisyal ng hukbong Romano na karaniwang namumuno sa humigit-kumulang isang daang kawal.
- source_word: Ὕπαγε
  choice: Humayo ka
  rationale: Pinananatili nito ang tuwirang pautos na umalis, sa dignified ngunit nauunawaang modernong Tagalog.
- source_word: ὡς ἐπίστευσας
  choice: ayon sa iyong pinaniwalaan
  rationale: Pinananatili ang pandiwang anyo at ang personal na pagkilos ng paniniwala, sa halip na gawing pangngalang “ayon sa iyong pananampalataya.”
- source_word: γενηθήτω σοι
  choice: Mangyari sa iyo
  rationale: 'Inihahatid nito nang maikli at natural ang jussive na diwa ng aorist passive imperative: mangyari para o sa kapakanan ng kausap ang kanyang pinaniwalaan.'
- source_word: παῖς
  choice: lingkod
  rationale: Sa konteksto ng nasasakupan ng senturyon at ng δοῦλος sa naunang talata, “lingkod” ang pinakamalamang na kahulugan; inilalahad sa talababa ang tunay na leksikal na posibilidad na “batang lalaki” o “bata.”
- source_word: ἰάθη
  choice: gumaling
  rationale: Natural na Tagalog ito para sa pasibong kinalabasan ng pagpapagaling, nang hindi nagdaragdag kung sino ang tahasang gumaganap sa sugnay.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: nang oras ding iyon
  rationale: Pinananatili ang temporal na pahayag at ang diin sa agarang pagaling, nang hindi kinakailangang gawing eksaktong “sandaling iyon.”
theological_decisions:
- issue: Paglilipat ng πιστεύω bilang wika ng paniniwala o pananampalataya
  choice: pinaniwalaan
  alternative: pinagtiwalaan; ayon sa iyong pananampalataya
  rationale: Dahil pandiwa ang ἐπίστευσας, pinananatili ng “pinaniwalaan” ang personal na kilos ng paniniwala at iniiwasang palitan ito ng mas interpretatibong pangngalang “pananampalataya.”
- issue: Kaugnayan ng paniniwala at ng naganap
  choice: Mangyari sa iyo ayon sa iyong pinaniwalaan
  alternative: Mangyari ito sa iyo dahil naniwala ka
  rationale: Ang ὡς ay pinanatiling “ayon sa,” hindi ginawang tahasang sanhi na “dahil,” upang hindi higitan ang sinasabi ng Griyego tungkol sa kaugnayan ng paniniwala at ng kinalabasan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pamilyar na terminong biblikal na “senturyon,” ang dignified na pautos na “Humayo ka,” at ang natural na “gumaling.” Ang panandang talababa [a] ay nakalagay kaagad pagkatapos ng “lingkod.”
