  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: si Jesus ay nagsalita sa senturyon, ipinahayag ang kinalabasan na kaugnay ng kanyang pananampalataya, at gumaling ang παῖς sa oras na iyon. Ngunit ang “ayon sa iyong pinaniwalaan” ay karaniwang tumutukoy sa nilalaman o bagay na pinaniwalaan, samantalang ang ἐπίστευσας dito ay walang hayag na layon at tumutukoy sa pananampalataya/paniniwala ng senturyon. Ang “sa oras ding iyon” ay mas tapat at mas natural para sa ἐν τῇ ὥρᾳ ἐκείνῃ kaysa “nang oras ding iyon.”'
  naturalness: Malinaw ang draft, ngunit mas natural sa modernong Filipino ang “sa oras ding iyon.” Ang “Humayo ka” ay katanggap-tanggap na marangal na rehistro sa salaysay ng Ebanghelyo. Ang rebisyon sa sugnay tungkol sa paniniwala ay nag-aalis din ng hindi likas na kahulugang maaaring ipahiwatig ng “pinaniwalaan.”
  terminology: Ang “senturyon” at “lingkod” ay angkop. Ang “pananampalataya” ay ang natural at matatag na Filipino para sa walang-layong paggamit ng πιστεύω sa konstruksiyong ito; hindi nito ipinipilit ang isang doktrinal na pagbasa. Pinananatili ng talababa ang leksikal na kalabuan ng παῖς.
  issues:
  - severity: medium
    issue: Ang “ayon sa iyong pinaniwalaan” ay maaaring mangahulugang ayon sa bagay o pahayag na pinaniwalaan mo.
    rationale: Walang tahasang layon ang ἐπίστευσας. Sa kontekstong ito, tumutukoy ito sa paniniwala/pananampalataya ng senturyon, hindi sa isang tinukoy na nilalaman ng kanyang paniniwala.
  - severity: low
    issue: Hindi likas ang “nang oras ding iyon” bilang pantukoy ng panahon.
    rationale: Ang “sa oras ding iyon” ang karaniwang modernong Filipino na katumbas ng ἐν τῇ ὥρᾳ ἐκείνῃ at hindi nagpapahiwatig ng mas eksaktong sandali kaysa sa Griyego.
