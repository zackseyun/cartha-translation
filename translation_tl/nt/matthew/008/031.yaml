  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: tl
  text: Patuloy na nagmakaawa[a] sa kanya ang mga demonyo, “Kung palalayasin mo kami, ipadala mo kami sa kawan ng mga baboy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagmakaawa” o “nakikiusap.” Ang pandiwang Griyego ay nasa aspektong imperpekto, na maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: mga demonyo
  rationale: Karaniwan at malinaw na katawagan sa modernong Tagalog para sa mga personal na masamang espiritung inilalarawan sa talata.
- source_word: παρεκάλουν
  choice: patuloy na nagmakaawa
  rationale: Ipinahahayag ng aspektong imperpekto ng pandiwang Griyego ang nagpapatuloy o paulit-ulit na pagsusumamo; natural itong naihahatid ng “patuloy na nagmakaawa.”
- source_word: λέγοντες
  choice: tuwirang sinundan ng sipi
  rationale: Sa halip na idagdag ang medyo mabigat na “na sinasabi,” natural na ipinakikilala ng kuwit ang mismong sinabi nila habang nananatiling malinaw ang ugnayan ng participle sa pangunahing pandiwa.
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ang hayag na kondisyong ipinahahayag ng Griyego at hindi ito binabago tungo sa tiyak na “yamang” o “dahil.”
- source_word: ἐκβάλλεις
  choice: palalayasin mo
  rationale: Ang “palayasin” ay natural at tumpak sa konteksto ng pagpapaalis sa mga demonyo; ang anyong prospektibo ay angkop sa kondisyong ipinahahayag sa Tagalog.
- source_word: ἀπόστειλον ἡμᾶς
  choice: ipadala mo kami
  rationale: Tuwirang naghahatid sa pautos na kahilingan para sa agarang pagkilos nang hindi dinaragdagan ang diwa ng pahintulot na wala sa napiling tekstong Griyego.
- source_word: ἀγέλην τῶν χοίρων
  choice: kawan ng mga baboy
  rationale: Ang “kawan” ay angkop na katawagan sa pangkat ng mga hayop, at ang “mga baboy” ay malinaw at pangkasalukuyang pananalita.
theological_decisions:
- issue: Paglalarawan sa masasamang espiritu
  choice: mga demonyo
  alternative: masasamang espiritu
  rationale: Inilalarawan ng teksto ang mga nilalang na personal na nagsasalita kay Jesus. Pinananatili ng “mga demonyo” ang tahasang supernatural na paglalarawan nang walang idinaragdag na paliwanag na doktrinal.
- issue: Kondisyon sa pakiusap ng mga demonyo
  choice: Kung palalayasin mo kami
  alternative: Yamang palalayasin mo kami
  rationale: Pinananatili ng “Kung” ang tunay na anyong kondisyonal ng Εἰ at iniiwasang gawing tahasang katiyakan ang maaaring ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang karaniwang “mga demonyo,” “palalayasin,” at “mga baboy,” at iniwasan ang mga salitang masyadong pormal o lipas. Inayos nang natural sa Tagalog ang participle na λέγοντες sa pamamagitan ng tuwirang pagsunod ng sipi.
