base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: tl
  text: Nang bumaba siya mula sa bundok, maraming tao[a] ang sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “maraming pulutong.” Maramihan ang salitang Griyego para sa “pulutong,” ngunit mas natural sa Tagalog ang “maraming tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Nang bumaba siya
  rationale: Ang genitive absolute na may aorist participle ay likas na isinasalin sa Tagalog bilang sugnay na panahunan. Ipinapakita ng “nang” ang pagkakasunod ng pangyayari nang hindi labis na nililinaw ang eksaktong ugnayan sa oras; hindi na kailangang hiwalay na tumbasan ang mahinang pang-ugnay na δέ.
- source_word: ἀπὸ τοῦ ὄρους
  choice: mula sa bundok
  rationale: Karaniwang tumutukoy ang ὄρος sa bundok o mataas na burol. Ang “bundok” ay natural at inuugnay ang talata sa tagpuan ng naunang salaysay.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ang sumunod sa kanya
  rationale: Ang ἀκολουθέω na may datibong layon ay natural na ipinahahayag sa Tagalog bilang “sumunod sa kanya,” at dito ay pangunahing tumutukoy sa pisikal na pagsunod sa salaysay.
- source_word: ὄχλοι πολλοί
  choice: maraming tao
  rationale: Bagaman maramihan ang ὄχλοι at literal na maaaring sabihing “maraming pulutong,” mas natural sa modernong Tagalog ang “maraming tao.” Pinananatili nito ang diwa ng malaking bilang nang hindi gumagamit ng alanganing parirala; itinatala sa talababa ang mas pormal na anyo.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Pinanatili ang panghalip na “siya” sa halip na idagdag ang pangalang Jesus, sapagkat panghalip din ang nasa Griyego at malinaw ang tinutukoy mula sa konteksto.
