revisions:
- from: Sinabi sa kanya ni Jesus, “Tiyakin mong huwag itong sabihin kaninuman. Sa halip, pumunta ka at magpakita sa pari. Pagkatapos, ihandog mo ang kaloob na iniutos ni Moises,[a] bilang patotoo sa kanila.”[b]
  to: Sinabi ni Jesus sa kanya, “Mag-ingat kang huwag magsabi kaninuman. Sa halip, pumunta ka, magpakita sa pari, at ihandog mo ang kaloob na iniutos ni Moises,[a] bilang patotoo sa kanila.”[b]
  rationale: Inayos ang ayos ng pangungusap para sa likas na modernong Tagalog, inalis ang idinagdag na layong “ito,” at pinalitan ang “Pagkatapos” ng simpleng pag-uugnay ng mga utos. Hindi binago ang mga pangunahing katawagan o ang kalabuan ng “sa kanila.”
