    rationale: Ang μηδενὶ εἴπῃς ay hindi nagsasaad ng tuwirang layon. Maaaring mahinuha ang paksa mula sa konteksto, ngunit mas tapat at mas bukas ang “huwag magsabi kaninuman.”
  - severity: low
    issue: Ang “Pagkatapos” ay mas tiyak kaysa sa pangatnig na καί.
    rationale: Ang Griyego ay nag-uugnay lamang ng mga utos. Hindi kailangang tahasang ipakita ang sunod-sunod na hakbang sa salin.
