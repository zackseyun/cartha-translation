  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Mag-ingat kang huwag magsabi kaninuman. Sa halip, pumunta ka, magpakita sa pari, at ihandog mo ang kaloob na iniutos ni Moises,[a] bilang patotoo sa kanila.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ang tagubiling ito sa paraang itinakda sa Kautusan ni Moises para sa taong gumaling sa ketong; tingnan ang Levitico 14.
    reason: cross_reference
  - marker: b
    text: Maaaring tumukoy ang “bilang patotoo sa kanila” sa katibayang ihaharap sa mga pari; nauunawaan din ito ng ilan bilang patotoo laban sa mga ayaw maniwala.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Tiyakin mong huwag itong sabihin kaninuman
  rationale: Ang ὅρα ay isang mariing tagubilin o babala, at ang μηδενὶ εἴπῃς ay pagbabawal. Likas sa modernong Tagalog ang “Tiyakin mong huwag…” at malinaw na tumutukoy ang “ito” sa nangyaring pagpapagaling.
- source_word: ὕπαγε
  choice: pumunta ka
  rationale: Payak at natural na katumbas ng pautos na pandiwa ng paggalaw.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: magpakita sa pari
  rationale: Pinananatili ang reflexive na diwa at ang konteksto ng pagpapasuri sa nararapat na pari, nang hindi nagdaragdag ng paliwanag sa mismong teksto.
- source_word: προσένεγκον τὸ δῶρον
  choice: ihandog mo ang kaloob
  rationale: Ang “ihandog” ay angkop sa kontekstong panrelihiyon ng προσένεγκον, samantalang pinananatili ng “kaloob” ang tuwirang kahulugan ng δῶρον.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: na iniutos ni Moises
  rationale: Tuwirang ipinapahayag ang awtoritatibong utos na tinutukoy ng προστάσσω.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo sa kanila
  rationale: Pinananatili ang bukas na kahulugan ng μαρτύριον at ang hindi tahasang tinukoy na reperente ng αὐτοῖς.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Isinalin ang historical present bilang nakaraang panahunan para sa natural na salaysay sa Tagalog.
theological_decisions:
- issue: Ang reperente at puwersa ng εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo sa kanila
  alternative: bilang patunay sa mga pari / bilang patotoo laban sa kanila
  rationale: Hindi tahasang kinikilala ng Griyego kung sino ang “kanila,” at maaaring neutral, positibo, o mapanuligsa ang puwersa ng “patotoo.” Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa publikong pagbasa. Ginamit ang “pari” bilang karaniwang katawagan sa ἱερεύς at pinanatili ang “patotoo sa kanila” upang hindi lutasin ang kalabuan ng orihinal.
