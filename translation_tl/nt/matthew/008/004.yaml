  source_fidelity: Malapit ang salin sa Griyego at napapanatili ang hindi tiyak na reperente ng αὐτοῖς sa “kanila.” Gayunman, ang “ito” ay dagdag na tuwirang layon na wala sa Griyego, at ang “Pagkatapos” ay nagdaragdag ng mas tahasang pagsunod-sunod kaysa sa simpleng καί. Ang rebisyon ay mas malapit sa saklaw at pagkakaugnay ng mga pautos sa orihinal.
  naturalness: Nauunawaan ang draft, ngunit mas natural ang ayos na “Sinabi ni Jesus sa kanya.” Ang “Mag-ingat kang huwag magsabi kaninuman” ay likas na pananalitang Tagalog para sa mariing babala at pagbabawal, nang hindi kailangang idagdag ang “ito.”
  terminology: Ang “pari,” “ihandog,” “kaloob,” “Moises,” at “patotoo” ay angkop sa kontekstong ito. Pinananatili ng “bilang patotoo sa kanila” ang sinadyang kalabuan ng εἰς μαρτύριον αὐτοῖς.
