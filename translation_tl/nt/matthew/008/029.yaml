  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: tl
  text: At masdan, sumigaw sila, “Ano ang pakialam mo sa amin?[a] Anak ng Diyos, pumarito ka ba upang pahirapan kami bago ang takdang panahon?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “Ano ang kinalaman namin sa iyo?”
    reason: lexical_alternative
  - marker: b
    text: O “bago ang panahon.” Ang salitang Griyego ay maaaring tumukoy sa isang itinakdang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: At masdan
  rationale: Pinananatili ang biglaang pantawag-pansin ng ἰδού sa isang maikli at marangal na anyong nauunawaan sa makabagong Tagalog.
- source_word: ἔκραξαν λέγοντες
  choice: sumigaw sila
  rationale: Ipinahahayag ng κράζω ang malakas na pagsigaw. Hindi na isinama nang tahasan ang λέγοντες dahil likas nang ipinakikilala ng panipi ang kanilang sinabi at magiging mabigat ang “sumigaw sila, na sinasabi.”
- source_word: Τί ἡμῖν καὶ σοί
  choice: Ano ang pakialam mo sa amin
  rationale: Natural na Tagalog na naghahatid sa mapanghamon at naglalayong lumayo na diwa ng idyoma, nang hindi ito nililimitahan sa simpleng tanong tungkol sa gusto ni Jesus.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Tuwirang salin ng titulong itinawag kay Jesus.
- source_word: ἦλθες ὧδε
  choice: Pumarito ka ba
  rationale: Likas at maikli itong nagpapahayag ng pagparito ni Jesus sa lugar na iyon.
- source_word: πρὸ καιροῦ
  choice: bago ang takdang panahon
  rationale: Maaaring tumukoy ang καιρός sa itinakda o angkop na panahon; pinananatili ng “takdang panahon” ang posibleng pahiwatig ng panahong itinakda para sa paghatol.
- source_word: βασανίσαι
  choice: upang pahirapan
  rationale: Inihahatid ang matinding pagdurusang ipinahihiwatig ng pandiwa nang hindi ipinapalagay na pisikal na pagpapahirap lamang.
- source_word: ἡμᾶς
  choice: kami
  rationale: Tuwirang tumutukoy sa mga nagsasalita sa pamamagitan ng mga lalaking sinapian.
theological_decisions:
- issue: Pagkilala ng mga demonyo sa pagkakakilanlan ni Jesus
  choice: Anak ng Diyos
  alternative: anak ng Diyos
  rationale: Pinananatili ang tahasang katawagang υἱὲ τοῦ θεοῦ bilang titulo kay Jesus, nang walang pagpapahina o pagpapalawak sa sinasabi ng teksto.
- issue: Pahiwatig ng καιρός tungkol sa paghatol
  choice: bago ang takdang panahon
  alternative: bago ang panahon
  rationale: Ipinahihiwatig ng tanong na may panahong nakalaan para sa kanilang pagpapahirap o paghatol, ngunit hindi tinutukoy ng salin ang anumang mas detalyadong sistemang eskatolohikal.
- issue: Saklaw ng idyomang Τί ἡμῖν καὶ σοί
  choice: Ano ang pakialam mo sa amin
  alternative: Ano ang kinalaman namin sa iyo
  rationale: Pinipili ang natural na hamon sa Tagalog habang inilalagay sa talababa ang mas literal na anyo upang mapanatili ang tunay na lawak ng idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “masdan” upang mapanatili ang pansin-pukaw na puwersa ng ἰδού; iniwasan ang salitang “narito” dahil maaari itong mapagkamalang lokatibong pahayag. Natural ang ayos ng tanong at hindi labis na teknikal ang bokabularyo.
