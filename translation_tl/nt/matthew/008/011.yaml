id: MAT.8.11
reference: Matthew 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na marami ang darating mula sa silangan at kanluran at makikisalo[a] kina Abraham, Isaac, at Jacob sa kaharian ng langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “hihilig sa hapag.” Sa sinaunang panahon, ang mga panauhin ay humihilig habang kumakain sa isang piging.
    reason: cultural_note
  - marker: b
    text: Ang “mula sa silangan at kanluran” ay malamang na tumutukoy sa mga taong manggagaling sa malalayong lupain, kabilang ang mga nasa labas ng Israel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Ang δέ ay nagpapahiwatig ng banayad na pagsalungat o paglipat mula sa naunang pahayag; natural itong naipahahayag ng “Ngunit,” habang tuwirang isinasalin ng “sinasabi ko sa inyo” ang λέγω ὑμῖν.
- source_word: πολλοὶ
  choice: marami
  rationale: Ginagamit ang pang-uri bilang pangngalan; sapat at natural sa Tagalog ang “marami” nang hindi nagdaragdag ng tahasang “mga tao.”
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: mula sa silangan at kanluran
  rationale: Ang mga anyong maramihan sa Griyego ay tumutukoy nang idyomatiko sa mga direksiyon o malalayong rehiyon. Pinananatili ng salin ang malawak na heograpikong pahiwatig.
- source_word: ἥξουσιν
  choice: darating
  rationale: Tuwirang ipinahahayag nito ang pagdating ng mga taong nagmumula sa malalayong lugar.
- source_word: ἀνακλιθήσονται
  choice: makikisalo
  rationale: Ang pandiwa ay literal na tumutukoy sa paghilig sa hapag ayon sa sinaunang kaugalian ng pagkain. Ang “makikisalo” ay natural sa modernong Tagalog at malinaw na nagpapanatili sa larawan ng sama-samang piging; ipinaliliwanag sa talababa ang literal na kilos.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: kina Abraham, Isaac, at Jacob
  rationale: Sa pariralang “makikisalo kina,” natural na ipinahahayag ng “kina” ang pakikisama sa tatlong patriyarka.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: sa kaharian ng langit
  rationale: Ito ang natural at nakaugaliang salin sa Tagalog ng natatanging parirala ni Mateo, nang hindi pilit na ginagawang maramihan ang “mga langit.”
theological_decisions:
- issue: Larawan ng piging at pakikisama sa darating na kaharian
  choice: Panatilihin ang konteksto ng pagkain sa pamamagitan ng “makikisalo,” na may paliwanag sa literal na paghilig sa hapag.
  alternative: “hihilig sa hapag” o “uupo upang kumain”
  rationale: Ang talata ay naglalarawan ng pakikibahagi sa isang piging, hindi lamang ng pagiging naroon. Pinananatili ng “makikisalo” ang diwa ng pakikisama sa pagkain sa natural na Tagalog, habang iniiwasan ang nakalilitong literalismo.
- issue: Saklaw ng “marami” mula sa silangan at kanluran
  choice: Panatilihin ang heograpikong pahayag at huwag idagdag sa pangunahing teksto ang “mga Hentil.”
  alternative: “maraming Hentil ang darating mula sa silangan at kanluran”
  rationale: Malakas ang pahiwatig sa konteksto na kabilang dito ang mga nasa labas ng Israel, ngunit “marami” lamang ang tahasang sinabi ng Griyego. Pinananatili ng salin ang pahiwatig nang hindi ito ginagawang tahasang pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makikisalo” upang natural na maiparating sa ordinaryong mambabasa ang sinaunang larawan ng piging, at inilagay ang literal na detalye sa talababa. Ang mga pangalang Abraham, Isaac, at Jacob ay pinanatili sa karaniwang anyong Filipino/Biblikal.
