  terminology: Wasto at pare-pareho ang “kaharian ng langit.” Ang mga pangalang Abraham, Isaac, at Jacob ay nasa malaganap na anyong Biblikal sa Filipino. Ang dalawang talababa ay may wastong angkla at hindi lumalampas sa ipinahihiwatig ng teksto.
