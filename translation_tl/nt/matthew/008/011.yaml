  source_fidelity: Tapat ang salin sa Griyego. Naipapahayag ng “Ngunit sinasabi ko sa inyo” ang δέ at λέγω, “marami” ang substantival πολλοί, at “mula sa silangan at kanluran” ang malawak ngunit hindi labis na tinutukoy na heograpikong saklaw. Ang “makikisalo” ay natural na katumbas sa Filipino ng larawan ng pakikibahagi sa hapag na nasa ἀνακλιθήσονται, habang ang talababa ay maayos na nagpapanatili ng literal na sinaunang gawi ng paghilig sa hapag. Hindi idinagdag sa pangunahing teksto ang “mga Hentil,” na wala namang tahasang sinabi ng Griyego.
