id: MAT.8.22
reference: Matthew 8:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Jesus, “Sumunod ka sa akin, at hayaan mong ilibing ng mga patay ang sarili nilang mga patay.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang unang “mga patay” ay madalas unawain sa matalinghagang paraan: maaaring ilibing ng mga taong hindi tumutugon sa espirituwal na panawagan ang mga namatay sa pisikal.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat sa naunang kahilingan at angkop sa mapagtuwid na tugon ni Jesus.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang aspektong pangnagdaan; hindi nito binabago ang nilalaman ng tugon.
- source_word: Ἀκολούθει μοι
  choice: Sumunod ka sa akin
  rationale: Direktang pautos ito na maaaring tumukoy kapwa sa aktuwal na pagsunod at sa pagiging alagad.
- source_word: ἄφες
  choice: hayaan mong
  rationale: Natural na Tagalog para sa pautos na ipaubaya sa iba ang gawain; pinananatili nito ang tuwiran at matinding pananalita.
- source_word: νεκρούς ... νεκρούς
  choice: mga patay ... mga patay
  rationale: Pinananatili ang sadyang pag-uulit at laro ng kahulugan nang hindi idinaragdag sa pangunahing teksto ang interpretasyong “patay sa espiritu.”
- source_word: θάψαι
  choice: ilibing
  rationale: Ang pandiwang pawatas matapos ang ἄφες ay likas na naipahahayag sa Tagalog bilang layong pandiwa sa konstruksyong “hayaan mong ilibing.”
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: ang sarili nilang mga patay
  rationale: Ipinananatili ng “sarili nilang” ang reflexive at mariing pagmamay-ari ng ἑαυτῶν.
theological_decisions:
- issue: Kahulugan ng unang “mga patay” sa sinabi ni Jesus
  choice: Pinanatili sa pangunahing teksto ang magkaparehong salitang “mga patay” sa dalawang paglitaw.
  alternative: Ipaliwanag ang una bilang “mga patay sa espiritu” at ang ikalawa bilang mga namatay sa pisikal.
  rationale: Iisang salitang Griyego ang ginamit sa dalawang lugar, kaya dapat mapanatili ang sadyang talinghaga, laro ng salita, at teolohikal na tensiyon sa halip na lutasin iyon sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinabi” sa halip na literal na historical present na “sinasabi” dahil higit itong natural sa salaysay sa Tagalog. Inilagay ang marker [a] pagkatapos ng sipi upang malinaw na tumukoy sa buong palaisipang pahayag.
