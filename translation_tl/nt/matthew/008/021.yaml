base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: tl
  text: May isa pa sa mga alagad na nagsabi sa kanya, “Panginoon, pahintulutan[a] po ninyo akong umalis muna at ilibing ang aking ama[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Payagan” o “Hayaan.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang kahilingan sa agarang paglilibing, o sa mas malawak na pagtupad sa tungkulin ng isang anak hanggang sa mamatay ang kanyang ama; hindi ito nililinaw ng Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: naman ... isa pa sa mga alagad
  rationale: Ipinahahayag ng ἕτερος ang isa pang tao bukod sa naunang nagsalita, at ipinakikita ng genitibong τῶν μαθητῶν na kabilang siya sa mga alagad. Ang “naman” ay banayad na pang-ugnay na angkop sa δέ.
- source_word: εἶπεν αὐτῷ
  choice: Sinabi ... sa kanya
  rationale: Likas at tuwirang salin ng pagsasalita na nakatuon kay Jesus.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang magalang na pagtawag at ang posibleng teolohikal na bigat ng κύριος nang hindi ito nililimitahan sa kahulugang “Guro.”
- source_word: ἐπίτρεψόν μοι
  choice: payagan po ninyo ... akong
  rationale: Ang pandiwa ay humihingi ng pahintulot. Ang “po ninyo” ay natural na paraan sa makabagong Filipino upang ipahayag ang magalang na tono ng kahilingan sa Panginoon.
- source_word: πρῶτον
  choice: muna
  rationale: Sa kontekstong ito, natural na ipinahahayag ng “muna” ang prayoridad o pagkakasunod na tinutukoy ng πρῶτον.
- source_word: ἀπελθεῖν
  choice: umalis
  rationale: Pinananatili ng “umalis” ang diwang paglayo mula sa kasalukuyang kinaroroonan.
- source_word: θάψαι τὸν πατέρα μου
  choice: ilibing ang aking ama
  rationale: Tuwiran at likas na salin na hindi nagpapasiya kung patay na ang ama o kung mas malawak na tungkuling pampamilya ang tinutukoy.
theological_decisions:
- issue: Kahulugan at panahon ng kahilingang ilibing ang ama
  choice: Isinalin nang tuwiran bilang kahilingang umalis muna upang ilibing ang ama.
  alternative: Maaaring tumukoy ito sa agarang paglilibing sa amang kamamatay lamang, o sa pananatili sa tahanan upang gampanan ang tungkulin sa ama hanggang sa mamatay ito.
  rationale: Hindi tinutukoy ng Griyego kung kailan mamamatay o namatay ang ama. Kaya hindi nilutas sa pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “po ninyo” upang maipahayag ang paggalang sa tuwirang pakiusap nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
