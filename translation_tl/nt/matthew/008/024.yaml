id: MAT.8.24
reference: Matthew 8:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: tl
  text: At narito, nagkaroon ng isang matinding unos sa dagat, anupat natatakpan ng mga alon ang bangka[a]; ngunit natutulog siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego na σεισμός ay madalas na nangangahulugang “lindol” o “pagyanig”; dito, ayon sa konteksto, tumutukoy ito sa isang marahas na unos sa dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang biglaan at pansin-tawag na puwersa ng panandang diskurso, habang nananatiling malinaw at marangal sa makabagong Tagalog.
- source_word: σεισμὸς μέγας
  choice: isang napakalakas na unos
  rationale: Bagaman ang σεισμός ay karaniwang tumutukoy sa lindol o pagyanig, ipinakikita ng dagat, bangka, at mga alon na isang marahas na unos sa dagat ang tinutukoy rito.
- source_word: ἐγένετο
  choice: bumangon
  rationale: Likas itong paglalarawan sa pagsisimula ng unos at naipapahayag ang paglitaw ng pangyayari nang hindi dinaragdagan ang detalye.
- source_word: ἐν τῇ θαλάσσῃ
  choice: sa dagat
  rationale: Pinananatili ang salitang dagat na katumbas ng θάλασσα sa halip na palitan ito ng heograpikong paliwanag na lawa.
- source_word: ὥστε
  choice: kaya
  rationale: Malinaw at natural na ipinahahayag ang resulta ng lakas ng unos.
- source_word: τὸ πλοῖον
  choice: ang bangka
  rationale: Ang bangka ang likas na tawag sa sasakyang-dagat sa kontekstong ito; ang barko ay magmumungkahi ng mas malaking sasakyan.
- source_word: καλύπτεσθαι
  choice: natatabunan
  rationale: Pinananatili ang patuloy na pasibong diwa ng pagkakatakip ng bangka ng mga alon, nang hindi tahasang sinasabing lumubog na ito.
- source_word: ὑπὸ τῶν κυμάτων
  choice: ng mga alon
  rationale: Ipinakikita ng parirala na ang mga alon ang tumatabon sa bangka.
- source_word: αὐτὸς δὲ
  choice: Ngunit ... siya
  rationale: Pinananatili ang matinding paghahambing sa pagitan ng unos at ng kalagayan niya, ngunit hindi labis na binibigyang-diin ang panghalip.
- source_word: ἐκάθευδεν
  choice: natutulog
  rationale: Ipinahahayag ng anyong ito ang nagpapatuloy na kilos o kalagayan sa nakaraan ayon sa takbo ng salaysay.
theological_decisions:
- issue: Kalikasan ng pangyayaring tinutukoy ng σεισμός
  choice: Isinaling ayon sa konteksto bilang “unos.”
  alternative: “Lindol” o “malakas na pagyanig.”
  rationale: Leksikal at kontekstuwal ang pasiya, hindi doktrinal. Ang dagat, bangka, at mga alon ay nagpapakitang marahas na kaguluhan sa dagat ang tinutukoy, habang ipinababatid sa talababa ang literal na saklaw ng salitang Griyego.
- issue: Pagkakakilanlan ng αὐτός
  choice: Pinanatili bilang panghalip na “siya.”
  alternative: Tahasan itong gawing “si Jesus.”
  rationale: Malinaw sa mas malawak na konteksto kung sino ang tinutukoy, ngunit panghalip ang nasa talata; iniiwasang palitan ng tahasang pangalan ang anyo ng pinagmulan.
translation_notes:
  register: Makabago ngunit marangal ang wika. Ginamit ang “narito” upang mapanatili ang pansin-tawag na ἰδού, at ang “natatabunan” upang maipakita ang patuloy na panganib nang hindi magdagdag na lumubog na ang bangka.
