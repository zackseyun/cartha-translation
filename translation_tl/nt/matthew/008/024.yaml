  rationale: 'Inayos ang pananalita upang maging mas natural sa modernong Filipino Tagalog nang hindi binabago ang kahulugan: ang malakas na pangyayari sa dagat, ang resultang patuloy na pagtatakip ng mga alon sa bangka, at ang kontrast na siya ay natutulog. Inilipat ang unang talababa sa “unos,” kung saan nakapaloob ang salitang σεισμός; nananatili ang ikalawang talababa bilang alternatibo para sa “natatakpan.”'
