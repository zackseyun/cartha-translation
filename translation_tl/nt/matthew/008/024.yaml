  terminology: Ang “unos,” “dagat,” “bangka,” at “alon” ay angkop. Ang “narito” ay katanggap-tanggap na marangal na katumbas ng ἰδού. Nananatiling wasto ang talababa tungkol sa σεισμός at ang alternatibong salin para sa καλύπτεσθαι.
