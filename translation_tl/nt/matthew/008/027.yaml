  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: tl
  text: Namangha ang mga lalaki at nagsabi, “Anong uri ng tao[a] ito na pati ang mga hangin at ang dagat ay sumusunod sa kanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Anong klaseng tao ito?” Itinatanong ng salitang Griyego kung anong uri o katangian ng taong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: ang mga lalaki
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking kasama ni Jesus sa bangka. Pinananatili ng salin ang tiyak na pagtukoy sa kanila sa halip na gawing pangkalahatang ‘mga tao.’
- source_word: ἐθαύμασαν
  choice: namangha
  rationale: Likas at malinaw itong nagpapahayag ng matinding pagtataka at paghanga bilang agarang reaksiyon sa nangyari.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Mas natural sa makabagong salaysay sa Tagalog ang sugnay na ito kaysa sa literal na ‘na nagsasabi,’ habang napapanatili ang ugnayan ng kanilang pagk (sic)amangha at pagsasalita.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Anong uri ng tao ito
  rationale: Ipinahahayag ng ποταπός ang tanong tungkol sa uri o katangian ng taong ito. Ang ‘uri ng tao’ ay dignified at malinaw, at hindi nagdaragdag ng sagot sa tanong.
- source_word: ὅτι
  choice: at
  rationale: Sa tanong na ito, ipinakikilala ng ὅτι ang batayan ng kanilang pagkamangha. Ang ‘at’ ay natural sa Tagalog at nag-uugnay sa tanong sa pambihirang katotohanang sumusunod sa kanya ang hangin at dagat.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: maging ang mga hangin at ang dagat
  rationale: 'Ang ‘maging’ ay naghahatid ng diin ng καί: pati ang mga puwersang ito ng kalikasan ay nasa ilalim ng kanyang awtoridad. Pinanatili ang ‘dagat’ bilang tuwirang katumbas ng θάλασσα.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: sumusunod sa kanya
  rationale: Ang ‘sumusunod’ ay natural na Tagalog para sa pagtalima sa utos o awtoridad at angkop kahit ang simuno ay hangin at dagat.
theological_decisions:
- issue: Puwersang Kristolohikal ng tanong ng mga alagad
  choice: Panatilihin ang tanong at ang ipinahihiwatig na pambihirang awtoridad ni Jesus sa sangnilikha nang walang dagdag na paliwanag.
  alternative: Gawing tahasan ang isang doktrinal na konklusyon tungkol sa pagkakakilanlan ni Jesus, o gawing karaniwang paghanga lamang ang kanilang reaksiyon.
  rationale: Ang talata mismo ay nagtatanong at hindi pa tahasang sumasagot. Pinananatili ng salin ang tensiyong ito habang malinaw na ipinakikitang maging ang hangin at dagat ay sumusunod sa kanya.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang ‘namangha’ at ‘uri ng tao’ upang mapanatili ang bigat ng salaysay nang hindi nagiging makaluma. Ang talababa ay inilagay sa pariralang aktuwal nitong ipinapaliwanag.
