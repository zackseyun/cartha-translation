  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: tl
  text: Sumagot ang senturyon, “Panginoon, hindi ako karapat-dapat na pumasok ka sa ilalim ng bubong ko. Ngunit sabihin mo lamang ang salita[a], at gagaling ang aking lingkod[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magsalita ka lamang.” Ang Griyego ay literal na, “sabihin sa pamamagitan ng isang salita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bata” o “kabataan.” Ang salitang Griyego ay maaaring tumukoy sa isang bata, kabataan, o lingkod depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: Sumagot
  rationale: Ang participle na ἀποκριθείς at pandiwang ἔφη ay magkasamang bumubuo ng karaniwang panimulang pahayag sa salaysay. Isang pandiwang “Sumagot” ang natural sa Tagalog at nagpapanatili sa diwang tumutugon ang senturyon.
- source_word: ἑκατόνταρχος
  choice: senturyon
  rationale: Ito ang kinikilalang katawagan sa opisyal na namumuno sa humigit-kumulang isang daang kawal sa hukbong Romano.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang pangunahing kahulugan ng κύριος at ang posibleng bigat na higit sa karaniwang magalang na pagtawag, nang hindi ipinipilit kung gaano kalawak ang pagkaunawa ng nagsasalita.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: hindi ako karapat-dapat
  rationale: Sa konteksto, ipinahahayag ng senturyon ang kababaang-loob at kawalan niya ng pagiging karapat-dapat, hindi lamang kakulangan ng kakayahan.
- source_word: ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς
  choice: na pumasok ka sa ilalim ng bubong ko
  rationale: Pinananatili ang malinaw na larawang “sa ilalim ng bubong” sa Griyego habang gumagamit ng maunawaang ayos sa Tagalog.
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: Ngunit magsalita ka lamang ng isang salita
  rationale: Pinananatili ang paghihigpit ng μόνον at ang tahasang pagtukoy sa λόγος. Bagaman may bahagyang pag-uulit sa Tagalog, malinaw nitong ipinakikita na salita lamang ni Jesus ang kailangan.
- source_word: ἰαθήσεται
  choice: gagaling
  rationale: Natural at malinaw itong Tagalog para sa magiging bunga ng pagpapagaling na ipinahahayag ng future passive na ἰαθήσεται.
- source_word: παῖς
  choice: lingkod
  rationale: Maaaring mangahulugan ang παῖς ng anak, bata, binata, o lingkod. Sa kalagayan ng senturyon at sa kaugnay na salaysay, “lingkod” ang pinakamalamang, ngunit pinananatili sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Pagtawag kay Jesus sa salitang κύριος
  choice: Panginoon
  alternative: Ginoo
  rationale: Ang “Panginoon” ay nagpapanatili kapuwa sa magalang na pagtawag at sa posibleng kristolohikal na pahiwatig ng salita, nang hindi tahasang nilulutas kung alin ang nasa isip ng senturyon.
- issue: Kahulugan ng παῖς
  choice: lingkod
  alternative: batang lalaki o anak
  rationale: Pinakamainam sa konteksto ang “lingkod,” ngunit malawak ang saklaw ng salitang Griyego kaya hindi dapat burahin ang ibang posibleng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “senturyon” bilang eksaktong katawagang pangkasaysayan; pinanatili ang larawang “sa ilalim ng bubong ko” at ang bahagyang literal na “magsalita … ng isang salita” upang hindi mawala ang diin ng orihinal.
