  text: And he says to him[a], “I will come and heal him.”
translation:
  language: tl
  text: At sinabi niya sa kanya[a], “Pupunta ako at pagagalingin ko siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pupunta ba ako at pagagalingin ko siya?” Itinuturing ng ilang tagapagpaliwanag na tanong ang sinabi ni Jesus batay sa konteksto, ngunit ang mismong pagkakabuo sa Griyego ay mas likas basahin bilang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay sa daloy ng salaysay nang hindi nagdaragdag ng tiyak na diwang temporal o pasaklaw.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaang “sinabi,” nang hindi binabago ang pangyayaring isinasalaysay.
- source_word: αὐτῷ
  choice: rito
  rationale: Likas na anyong Tagalog para sa datibong di-tuwirang layon na tumutukoy sa kausap ni Jesus.
- source_word: Ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip; sapat na naihahatid ng “ako” ang bahagyang diin nang hindi ito pinalalabis.
- source_word: ἐλθὼν
  choice: pupunta ako at
  rationale: Ang aorist participle ay likas na naihahayag sa Tagalog bilang kilos na mauuna at kaugnay ng pangunahing pandiwa; ang “pupunta ako at” ay malinaw at natural.
- source_word: θεραπεύσω
  choice: pagagalingin ko
  rationale: Sa konteksto ng karamdaman, tuwirang ipinahahayag nito ang pagpapagaling at pinananatili ang hinaharap na diwa ng pandiwa.
- source_word: αὐτόν
  choice: siya
  rationale: Natural na panghalip na tuwirang layon para sa lalaking maysakit na tinutukoy.
theological_decisions:
- issue: Kung pahayag o tanong ang sinabi ni Jesus
  choice: 'Pahayag: “Pupunta ako at pagagalingin ko siya.”'
  alternative: 'Tanong: “Pupunta ba ako at pagagalingin siya?”'
  rationale: Walang partikulang patanong sa Griyego, at ang anyo nito ay likas na mababasa bilang pahayag. Gayunman, maaaring unawain ng ilan bilang tanong batay sa konteksto, kaya inilalahad ang posibilidad sa talababa nang hindi ipinapalit sa pangunahing pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinabi” sa halip na literal na historical present upang maging natural sa salaysay. Ang “rito” ay tumutukoy sa lalaking kausap ni Jesus, hindi sa maysakit.
