  rationale: Idinagdag ang “mula sa” upang tuwirang maipahayag ang ἀπό at pinalitan ang “nasasakupan” sa pangunahing teksto ng mas malinaw na “lupain.” Inayos din ang pagbuo ng pakiusap upang maging likas na modernong Tagalog, nang hindi dinaragdagan ang hindi sinasabing motibo ng salaysay.
