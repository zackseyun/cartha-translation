  verdict: revise
  source_fidelity: 'Tumpak ang karamihan ng salin: napapanatili ang pansin-tawag ng καὶ ἰδού, ang kolektibong idyoma ng πᾶσα ἡ πόλις, ang paglabas upang salubungin si Jesus, at ang matinding pakiusap na umalis siya. Gayunman, ang “umalis siya sa kanilang nasasakupan” ay maaaring mangahulugang umalis siya habang nasa loob pa ng kanilang sakop, hindi malinaw na “umalis mula sa” kanilang rehiyon. Kailangang ilahad ang ἀπό (“mula sa”).'
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang “Narito,” “buong lungsod,” at “upang salubungin.” Mas malinaw at mas maayos ang sintaks na “nagmakaawa sila sa kanya na umalis mula sa kanilang lupain” kaysa “nagmakaawa silang umalis siya sa kanilang nasasakupan.”
  terminology: Ang “lupain” ay malinaw na katumbas ng ὅρια sa kontekstong ito bilang rehiyon/teritoryo. Hindi nito ipinipilit na ang tinutukoy ay ang mismong mga guhit ng hangganan; ang literal na posibilidad na iyon ay maipapakita sa talababa. Pinanatili ang pangalang “Jesus” at walang idinagdag na paliwanag hinggil sa motibo ng mga taga-lungsod.
  issues:
