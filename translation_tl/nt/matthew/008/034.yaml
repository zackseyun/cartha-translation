source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: tl
  text: At narito, lumabas ang buong lungsod upang salubungin si Jesus. Nang makita nila siya, nagmakaawa sila sa kanya na umalis mula sa kanilang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kanilang nasasakupan”; mas literal, “mula sa kanilang mga hangganan.”
    reason: 'Ipinakikita ang saklaw ng kahulugan ng ὅρια: maaari itong tumukoy sa teritoryo o rehiyon, bagaman literal itong “mga hangganan.”'
lexical_decisions:
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang tungkulin nitong tumawag ng pansin at magbigay-sigla sa salaysay, ngunit gumagamit ng likas at marangal na pananalita sa modernong Tagalog.
- source_word: πᾶσα ἡ πόλις
  choice: ang buong lungsod
  rationale: Tinutukoy nito ang mga mamamayan ng lungsod bilang isang kabuuan. Ang pariralang ito ang pinakamalapit na likas na katumbas nang hindi iginigiit na bawat indibidwal ay lumabas.
- source_word: ἐξῆλθεν
  choice: lumabas
  rationale: Tuwirang ipinahahayag ang paggalaw mula sa lungsod patungo kay Jesus.
- source_word: εἰς ὑπάντησιν
  choice: upang salubungin
  rationale: Likas na Tagalog para sa sadyang paglabas upang makipagtagpo sa isang paparating o nasa labas na tao.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Ginagamit ang karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: ἰδόντες αὐτὸν
  choice: Nang makita nila siya
  rationale: Ginagawang malinaw at natural ang panahong ugnayan ng aorist participle sa kasunod na kilos.
- source_word: παρεκάλεσαν
  choice: nagmakaawa
  rationale: Ipinahahayag ang taimtim at mariing pakiusap na higit sa payak na paghiling.
- source_word: ὅπως μεταβῇ
  choice: umalis siya
  rationale: Likas na inilalahad sa Tagalog ang nilalaman ng kanilang pakiusap, habang pinananatili ang ideya ng pag-alis sa lugar.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: sa kanilang nasasakupan
  rationale: Bagaman literal na tumutukoy ang ὅρια sa mga hangganan, dito ay sakop na lupain o rehiyon ang diwa. Ang “nasasakupan” ay natural at hindi labis na nakatuon sa mismong guhit ng hangganan.
theological_decisions:
- issue: Dahilan ng pakiusap ng mga taga-lungsod
  choice: Hindi tinukoy ang kanilang motibo; iniulat lamang na nagmakaawa silang umalis si Jesus.
  alternative: Maaaring ipalagay na takot sila sa kapangyarihan ni Jesus, galit sa pagkawala ng mga baboy, o nabahala sa buong pangyayari.
  rationale: Hindi tahasang sinasabi ng Griyegong teksto ang dahilan. Pinananatili ng salin ang naratibo at teolohikal na pag-igting sa halip na magdagdag ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “narito” bilang pansin-tawag at ang “nagmakaawa” upang mapanatili ang tindi ng παρεκάλεσαν. Ang “buong lungsod” ay kolektibong pagtukoy sa mga mamamayan, ayon sa idyoma ng pinagmulan.
