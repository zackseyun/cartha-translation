    issue: Hindi malinaw ang direksiyong “mula sa” sa pariralang “umalis siya sa kanilang nasasakupan.”
    rationale: Ang ἀπὸ τῶν ὁρίων αὐτῶν ay nangangahulugang pag-alis mula sa kanilang rehiyon/teritoryo. Maaaring basahin ang kasalukuyang Tagalog na para bang umalis si Jesus habang nasa loob ng nasasakupan, sa halip na lisanin ito.
  - severity: low
    issue: Bahagyang di-likas ang sintaks na “nagmakaawa silang umalis siya.”
    rationale: 'Mas malinaw sa modernong Tagalog na ipahayag ang pinag-ukulan at nilalaman ng pakiusap: “nagmakaawa sila sa kanya na umalis …”'
