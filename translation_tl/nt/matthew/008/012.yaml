id: MAT.8.12
reference: Matthew 8:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: tl
  text: Ngunit ang mga anak ng kaharian[a] ay itatapon sa kadiliman sa labas. Doon ay magkakaroon ng pagtangis at pagngangalit ng mga ngipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “mga anak na lalaki ng kaharian,” isang idyoma para sa mga itinuturing na nararapat magmana o inaasahang kabilang sa kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ τῆς βασιλείας
  choice: ang mga anak ng kaharian
  rationale: Pinananatili ang Semitikong idyoma at ang kabalintunaan na ang mga inaasahang kabilang sa kaharian ang siyang palalayasin. Likas na hindi tinutukoy ng salitang Tagalog na “anak” ang kasarian; nililinaw ng talababa ang diwang idiomatiko.
- source_word: ἐκβληθήσονται
  choice: itatapon
  rationale: Ipinahihiwatig ng pandiwang balintiyak sa hinaharap ang marahas at sapilitang pagpapaalis; malinaw at buhay sa makabagong Tagalog ang “itatapon.”
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: ang kadiliman sa labas
  rationale: Pinananatili ang larawang spatial ng kadilimang nasa labas nang hindi ito pinapalitan ng mas tiyak na katawagang teolohikal.
- source_word: κλαυθμός
  choice: pagtangis
  rationale: Ang “pagtangis” ay marangal at karaniwang salin para sa matinding pag-iyak o panaghoy sa ganitong pahayag.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Ito ang kinikilalang pariralang Filipino na tumpak na naglalarawan sa pagkiskis o pagngangalit ng mga ngipin.
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na ipinapakita ang pagsalungat sa naunang pahayag tungkol sa maraming darating at makikisalo sa kaharian.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Inilalagay sa unahan ng pangungusap upang mapanatili ang diin ng Griyego sa lugar ng paghuhukom.
theological_decisions:
- issue: Larawan ng pagbubukod at paghuhukom
  choice: Panatilihin ang kongkretong mga larawan ng pagtatapon sa kadiliman sa labas, pagtangis, at pagngangalit ng mga ngipin.
  alternative: Tahasang ipakahulugan bilang “impiyerno” o “walang hanggang kaparusahan.”
  rationale: Matindi at eskatolohikal ang larawang ginamit, ngunit hindi ginagamit ng talata ang mga tiyak na katawagang iyon. Ang pagpapanatili sa mismong larawan ay umiiwas sa pagdaragdag ng sistematikong paliwanag.
- issue: Paglilipat ng gramatikal na panlalaking υἱοί sa Tagalog
  choice: Gamitin ang likas na salitang “mga anak” at ipaliwanag sa talababa ang idyoma.
  alternative: “Mga lalaking anak” o ang ganap na interpretibong “mga tagapagmana.”
  rationale: Walang likas na markang pangkasarian ang “anak” sa Tagalog. Ang “mga lalaking anak” ay magiging pilit at maaaring magpahiwatig na lalaki lamang ang tinutukoy, samantalang ang idyoma ay tumutukoy sa mga itinuturing na nararapat o inaasahang kabilang sa kaharian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matitinding larawan ng orihinal at iniwasan ang arkaikong pananalita at labis na pagpapakahulugang teolohikal.
