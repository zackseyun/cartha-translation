id: MAT.8.17
reference: Matthew 8:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: tl
  text: 'upang matupad ang sinabi sa pamamagitan ng propetang si Isaias, na nagsabi:


    “Siya mismo ang kumuha ng ating mga karamdaman[a]


    at nagpasan ng ating mga sakit.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kahinaan.” Ang salitang Griyego ay maaaring tumukoy sa mga kahinaan, karamdaman, o karamdaman dulot ng karamdaman.
    reason: lexical_alternative
  - marker: b
    text: O “nagdala ng ating mga sakit.” Pinananatili ng “nagpasan” ang diwa ng pagdadala at ang tradisyonal na ugnay sa Isaias 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: upang matupad
  rationale: Likas na Filipino para sa layunin o kinalabasan ng pormulang katuparan ni Mateo, habang pinananatili ang diwang teliko.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Malinaw at natural na katumbas ng articular passive participle nang hindi dinaragdagan ang kahulugan.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: sa pamamagitan ni propeta Isaias
  rationale: 'Pinananatili ng “sa pamamagitan” ang instrumental na diwa ng διά: ang pahayag ay ipinaabot sa pamamagitan ng propeta.'
- source_word: λέγοντος
  choice: ipinakilala sa pamamagitan ng tutuldok
  rationale: Sa Filipino, sapat at mas natural ang tutuldok bago ang tuwirang sipi; magiging mabigat at paulit-ulit ang tahasang “na nagsasabi.”
- source_word: Αὐτὸς
  choice: Siya mismo
  rationale: Pinananatili ang diin ng tahasang panghalip sa Griyego.
- source_word: ἀσθενείας
  choice: mga karamdaman
  rationale: Sa konteksto ng mga pagpapagaling, natural itong tumutukoy sa pisikal na kapansanan o pagkakasakit, ngunit hindi nito lubusang isinasara ang mas malawak na diwa ng kahinaan.
- source_word: ἔλαβεν
  choice: kumuha
  rationale: Tuwirang katumbas ng λαμβάνω at hindi ipinapalagay ang interpretatibong “nag-alis.”
- source_word: νόσους
  choice: mga sakit
  rationale: Karaniwan, malinaw, at tiyak na Filipino para sa disease o illness.
- source_word: ἐβάστασεν
  choice: nagpasan
  rationale: Pinananatili ang diwa ng pagdala o pagbatá at ang ugnayan ng sipi sa Isaias 53:4.
theological_decisions:
- issue: Paglalarawan sa mga paghihirap sa sipi ng Isaias 53:4 sa konteksto ng pagpapagaling ni Mateo
  choice: “mga karamdaman” at “mga sakit”
  alternative: “mga kahinaan” at “mga sakit,” o mas malawak na mga salitang maaaring tumukoy sa dalamhati
  rationale: Iniuugnay ni Mateo ang sipi sa pisikal na pagpapagaling sa agarang konteksto. Gayunman, kinikilala sa talababa na mas malawak ang saklaw ng ἀσθένεια upang hindi tahimik na lutasin ang leksikal at teolohikal na tensiyon.
- issue: Kahulugan ng ἐβάστασεν
  choice: “nagpasan”
  alternative: “nagdala”
  rationale: Ang “nagpasan” ay natural at malapit sa diwa ng βαστάζω, habang pinananatili ang posibleng bigat ng ugnayan sa Isaias nang hindi tahasang nagdaragdag ng isang partikular na paliwanag tungkol sa pagtubos.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang ayos-panulaan sa sipi upang malinaw ang dalawang magkatugmang sugnay. Inilagay ang bawat pananda ng talababa sa mismong tekstong tinutukoy nito.
