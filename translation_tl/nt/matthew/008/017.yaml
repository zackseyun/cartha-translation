  to: 'upang matupad ang sinabi sa pamamagitan ng propetang si Isaias, na nagsabi:


    “Siya mismo ang kumuha ng ating mga karamdaman[a]


    at nagpasan ng ating mga sakit.”[b]'
  rationale: Idinagdag ang “na nagsabi” upang katawanin ang λέγοντος at ginawang mas idiomatiko ang pagtukoy kay Isaias. Pinanatili ang pisikal na pokus na angkop sa agarang konteksto ni Mateo, nang hindi nagdaragdag ng doktrinal na paliwanag. Nilinaw ang mga talababa upang maging tumpak ang saklaw ng leksikon at ang uri ng ugnay sa Isaias 53:4.
