- from: Sinabi niya sa kanila, “Bakit kayo natatakot, kayong kakaunti ang pananampalataya?” Pagkatapos ay bumangon siya at sinaway ang mga hangin at ang lawa, at biglang naging ganap na payapa ang lahat.
