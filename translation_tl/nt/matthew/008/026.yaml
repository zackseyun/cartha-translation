  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Bakit kayo natatakot, kayong maliit ang pananampalataya?” Pagkatapos, bumangon siya at sinaway ang mga hangin at ang dagat, at nagkaroon ng malaking katahimikan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: natatakot
  rationale: Natural at malinaw sa modernong Tagalog; ipinapahayag ang takot ng mga alagad sa gitna ng unos nang hindi dinaragdagan ang tindi ng salita.
- source_word: ὀλιγόπιστοι
  choice: kayong kakaunti ang pananampalataya
  rationale: Pinananatili ang tuwirang anyo at pagsaway ng Griyego, pati ang ideya ng kulang o maliit na pananampalataya.
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Karaniwang salin sa kontekstong may awtoritatibong pagpigil o pagsaway.
- source_word: τῇ θαλάσσῃ
  choice: ang lawa
  rationale: Sa konteksto, tumutukoy ito sa Lawa ng Galilea; mas natural at heograpikong malinaw sa Tagalog kaysa literal na “dagat.”
- source_word: γαλήνη μεγάλη
  choice: ganap na payapa ang lahat
  rationale: Natural na ipinahahayag ang napakatinding katahimikan ng hangin at tubig; ang “malaki” ay idiomatikong inililipat bilang ganap na kapayapaan.
theological_decisions:
- issue: Ang paglalarawan sa pananampalataya ng mga alagad
  choice: kayong kakaunti ang pananampalataya
  alternative: kayong mahina ang pananampalataya
  rationale: Pinananatili ang metapora ng ὀλιγόπιστοι at hindi ipinapakahulugang wala silang pananampalataya.
- issue: Saklaw ng kapayapaan pagkatapos ng pagsaway
  choice: biglang naging ganap na payapa ang lahat
  alternative: nagkaroon ng malaking katahimikan
  rationale: Ipinakikita ang biglaan at lubos na paghupa ng unos nang hindi nagdaragdag ng paliwanag tungkol sa pagkakakilanlan o kapangyarihan ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lawa” ayon sa aktuwal na heograpiya ng salaysay, at natural na inangkop ang Griyegong idyomang γαλήνη μεγάλη.
