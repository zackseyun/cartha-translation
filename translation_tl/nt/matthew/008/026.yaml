review_pass:
  verdict: revise
  source_fidelity: Ang draft ay pangkalahatang sumusunod sa pagkakasunod at diwa ng Griyego, ngunit ang “lawa” ay nagpapalit sa literal na τῇ θαλάσσῃ (“dagat”), at ang “biglang,” “ganap,” at “ang lahat” ay mga dagdag na wala sa teksto. Ang γαλήνη μεγάλη ay mas tumpak na maisasalin bilang “malaking katahimikan.”
  naturalness: Natural ang pangungusap sa modernong Tagalog, ngunit hindi idiomatiko ang “kayong kakaunti ang pananampalataya.” Mas malinaw at natural ang bokatibong “kayong maliit ang pananampalataya.”
  terminology: Pinananatili ng “natatakot” ang diwa ng δειλοί nang hindi labis na pinatitingkad ito bilang “duwag.” Ang “sinaway” ay angkop para sa ἐπετίμησεν. Ang “dagat” ang dapat panatilihin para sa θαλάσσῃ, kahit ang tinutukoy sa salaysay ay ang Lawa ng Galilea; hindi dapat palitan ng heograpikong interpretasyon ang salita ng pinagmulan.
  issues:
  - severity: medium
    issue: “lawa” para sa τῇ θαλάσσῃ
    rationale: Ang SBLGNT ay may θαλάσσῃ, “dagat.” Bagaman maaaring tumukoy ito sa Lawa ng Galilea sa konteksto, ang pagpapalit sa “lawa” ay interpretibong espesipikasyon at hindi tugma sa English POB audit trail na “sea.”
  - severity: medium
    issue: Mga dagdag sa pangwakas na sugnay
    rationale: Ang “biglang,” “ganap,” at “ang lahat” ay nagpapalawak sa ἐγένετο γαλήνη μεγάλη. Ipinahihiwatig ng konteksto ang paghupa ng unos, ngunit hindi dapat idagdag sa salin ang biglaang pangyayari o saklaw na “lahat.”
  - severity: low
    issue: “kayong kakaunti ang pananampalataya”
    rationale: Naiintindihan ang kahulugan ngunit hindi ito likas na Tagalog. Ang “kayong maliit ang pananampalataya” ay mas maayos na katumbas ng ὀλιγόπιστοι at pinananatili ang metapora ng kaunting/maliit na pananampalataya.
  revised_text: Sinabi niya sa kanila, “Bakit kayo natatakot, kayong maliit ang pananampalataya?” Pagkatapos, bumangon siya at sinaway ang mga hangin at ang dagat, at nagkaroon ng malaking katahimikan.
