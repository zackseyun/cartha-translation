  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: tl
  text: Pagpasok ni Jesus sa Capernaum, lumapit sa kanya ang isang senturyon at taimtim na nakiusap sa kanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Pagpasok ni Jesus
  rationale: Likas na temporal na parirala ito para sa genitive absolute na may aorist participle. Ginawang tahasan ang pangalang “Jesus” sapagkat siya ang malinaw na tinutukoy sa konteksto, at iniiwasang labis na tukuyin kung kasabay o ganap na nauna ang pagpasok.
- source_word: εἰς Καφαρναοὺμ
  choice: sa Capernaum
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa mga saling Tagalog; kasama ng “pagpasok,” natural na ipinahahayag ng “sa” ang pagpasok sa bayan.
- source_word: προσῆλθεν αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at natural na katumbas ng προσέρχομαι sa kontekstong personal na paglapit kay Jesus.
- source_word: ἑκατόνταρχος
  choice: isang senturyon
  rationale: Pinananatili ang tiyak na ranggong militar na tumutukoy sa opisyal na namumuno sa humigit-kumulang isang daang kawal, sa halip na gawing pangkalahatang “opisyal na Romano.”
- source_word: παρακαλῶν αὐτὸν
  choice: taimtim na nakiusap sa kanya
  rationale: Ipinahahayag ang seryosong pakiusap na ipinakikilala ng participle, nang hindi ito pinatitindi sa “nagmamakaawa.” Natural din itong naghahanda sa mismong kahilingan sa kasunod na talata.
