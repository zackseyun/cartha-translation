  source_fidelity: 'Tumpak ang salin sa daloy at ugnayan ng Griyego: ang genitive absolute ay natural na naipahayag sa “Pagpasok ni Jesus sa Capernaum,” ang προσῆλθεν bilang “lumapit,” ang ἑκατόνταρχος bilang “senturyon,” at ang παρακαλῶν bilang taimtim na pakikiusap. Hindi nito labis na tinutukoy ang temporal na ugnayan ng pagpasok at paglapit.'
