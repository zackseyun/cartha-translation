  source_fidelity: Tumpak ang pangunahing pagkakasunod ng kilos at napapanatili ang wika ng paglilinis sa utos. Gayunman, ang pangwakas na “luminis ang kanyang ketong” ay intransitibong anyo at hindi sapat na katumbas ng pasibong ἐκαθαρίσθη. Ang “nalinis ang kanyang ketong” ay mas malapit sa Griyego at pinananatili ang ketong bilang paksa.
  naturalness: Malinaw at angkop ang makabagong Filipino. Ang pag-uugnay ng pagsasalita sa kilos sa iisang pangungusap ay mas maayos ang daloy kaysa sa hiwalay na “Sinabi niya,” nang hindi binabago ang kahulugan.
  terminology: Ang “ketong” ay angkop na tradisyonal na salin ng λέπρα kung may paliwanag na hindi ito kinakailangang tumukoy lamang sa modernong Hansen’s disease. Ang “maging malinis ka” at “nalinis” ay angkop na pinananatili ang dimensiyon ng paglilinis sa καθαρίζω.
