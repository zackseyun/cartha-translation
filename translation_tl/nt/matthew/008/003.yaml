source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: tl
  text: At iniunat niya ang kanyang kamay, hinipo siya, at sinabi, “Nais ko; maging malinis ka.” At agad na nalinis ang kanyang ketong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ketong” ay salin ng Griyegong λέπρα, na maaaring tumukoy sa mas malawak na uri ng malulubhang sakit sa balat at hindi lamang sa tinatawag ngayong Hansen’s disease.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: iniunat niya ang kanyang kamay
  rationale: Likas at malinaw sa modernong Tagalog, at pinananatili ang kongkretong kilos bago ang paghipo.
- source_word: ἥψατο αὐτοῦ
  choice: hinipo siya
  rationale: Ito ang payak na kahulugan ng ἅπτομαι na may genitive na layon sa kontekstong ito.
- source_word: Θέλω
  choice: Nais ko
  rationale: Tuwirang ipinapahayag ang kusang-loob na pagsang-ayon ni Jesus bilang tugon sa tanong tungkol sa kanyang kalooban; iniiwasan din nito ang maaaring hinaharap na diwa ng “gagawin ko.”
- source_word: καθαρίσθητι
  choice: Maging malinis ka
  rationale: Pinananatili ang wika ng paglilinis na may pisikal at ritwal na saklaw, sa halip na paliitin ito sa “gumaling ka.”
- source_word: εὐθέως
  choice: Agad
  rationale: Maikli at natural na katumbas na nagpapanatili sa biglaang resulta.
- source_word: ἐκαθαρίσθη
  choice: luminis
  rationale: Pinananatili ang ugnayang leksikal sa utos na καθαρίσθητι at ang wika ng paglilinis.
- source_word: ἡ λέπρα
  choice: ang kanyang ketong
  rationale: Ang “ketong” ang kinikilalang tradisyonal na salin, habang ang panghalip na paari ay kumakatawan sa αὐτοῦ; nililinaw sa talababa na mas malawak ang saklaw ng terminong Griyego kaysa sa modernong Hansen’s disease.
theological_decisions:
- issue: Wika ng kadalisayan at pagpapagaling sa καθαρίζω
  choice: Gamitin ang “maging malinis” at “luminis” sa utos at resulta
  alternative: Gamitin ang “gumaling” sa utos at resulta
  rationale: Ang Griyego ay tahasang gumagamit ng wikang paglilinis, na maaaring magtaglay kapwa ng pisikal at ritwal na kahulugan. Ang “gumaling” lamang ay magpapakitid sa saklaw nito.
- issue: Kahulugan ng Θέλω sa tugon ni Jesus
  choice: Nais ko
  alternative: Gagawin ko / Handa ako
  rationale: Ang tugon ay tumutukoy sa kalooban ni Jesus, hindi sa simpleng kilos sa hinaharap. Ang “Nais ko” ay tuwiran ngunit pinananatili ang maikling anyo at lakas ng Griyego.
- issue: Paksa ng huling sugnay
  choice: Panatilihing “ang kanyang ketong” ang paksa
  alternative: Siya ay nalinis sa kanyang ketong
  rationale: Sa Griyego, ἡ λέπρα ang gramatikal na paksa ng ἐκαθαρίσθη. Ang salin ay nananatiling natural sa Tagalog habang tapat sa estruktura ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap upang maging natural ang daloy, ngunit pinanatili ang pagkakasunod ng kilos, ang maigsi at mariing tugon ni Jesus, at ang wikang paglilinis ng Griyego.
