  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: tl
  text: Nang sumakay siya[b] sa bangka[a], sumunod sa kanya ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, walang tiyak na artikulo rito; maaari itong unawain bilang “isang bangka” o “ang bangka.” Hindi karaniwang ipinahahayag sa Tagalog ang pagkakaibang ito.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “Habang sumasakay siya” o, sa mas pormal na paraan, “Pagkasakay niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: Nang sumakay siya
  rationale: Ang aorist participle ay likas na isinasalin sa Tagalog bilang sugnay na temporal. Ang “sumakay” ang karaniwang pandiwa para sa pagpasok at pagsakay sa isang sasakyang-tubig; pinananatili ng “nang” ang posibleng ugnayang ‘noong/habang/pagkatapos’ nang hindi ginagawang mabigat ang pangungusap.
- source_word: πλοῖον
  choice: bangka
  rationale: Maaaring tumukoy ang πλοῖον sa bangka o barko. Sa tagpuan sa Lawa ng Galilea, “bangka” ang natural at angkop na makabagong salita. Bagaman walang tiyak na artikulo sa Griyego, hindi karaniwang minamarkahan sa Tagalog ang pagkakaibang ‘a/the,’ kaya likas na naiiwan itong ayon sa konteksto.
- source_word: ἠκολούθησαν
  choice: sumunod
  rationale: Pinananatili ng “sumunod” kapwa ang tuwirang kilos ng pagpunta kasunod ni Jesus at ang mas malawak na himig ng pagiging alagad, nang hindi ito pinalalawak sa isang teolohikal na paliwanag.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Ang “mga alagad” ang nakasanayang salin sa Ebanghelyo para sa mga μαθηταί ni Jesus at mas mahusay na naghahayag ng kanilang ugnayan sa kanya kaysa “mga estudyante” o “mga mag-aaral.”
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: siya / kanya / kanyang
  rationale: Ang lahat ng panghalip ay tumutukoy kay Jesus ayon sa konteksto. Natural sa Tagalog ang paggamit ng “siya,” “kanya,” at “kanyang” sa kani-kanilang tungkulin sa pangungusap.
theological_decisions:
- issue: Posibleng himig ng pagiging alagad sa ἀκολουθέω
  choice: sumunod
  alternative: sumama sa kanya; naging mga tagasunod niya
  rationale: Ang agarang kahulugan ay pisikal na pagsunod sa bangka, ngunit madalas ding may kaugnayan sa pagiging alagad ang pandiwa sa Mateo. Pinananatili ng “sumunod” ang dalawang himig nang hindi ipinipilit ang alinman.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang karaniwang “bangka,” “sumunod,” at “mga alagad,” at iniwasan ang labis na pormal o makalumang ayos. Ang mga talababa ay nagpapanatili sa temporal at artikular na kalabuan ng Griyego.
