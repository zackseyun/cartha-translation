id: MAT.8.9
reference: Matthew 8:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: tl
  text: Sapagkat ako man ay isang taong nasa ilalim ng awtoridad at mayroon akong mga kawal na nasa ilalim ko. Sinasabi ko sa isa, ‘Humayo ka,’ at humahayo siya; at sa iba naman, ‘Halika,’ at lumalapit siya; at sa alipin ko[a], ‘Gawin mo ito,’ at ginagawa niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “lingkod” (Griyego: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng sinabi ng senturyon; natural sa modernong Tagalog ang “Sapagkat.”
- source_word: ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: ako man ay taong nasa ilalim ng awtoridad
  rationale: Pinananatili ng “ako man” ang paghahambing na ipinahihiwatig ng καὶ at ang diin ng ἐγώ, habang malinaw na inilalarawan ang nakatataas na awtoridad sa kaniya.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: may mga kawal na nasa ilalim ko
  rationale: Likas at malinaw na paglalarawan ng ranggo at hanay ng utos sa militar.
- source_word: λέγω τούτῳ
  choice: Sinasabi ko sa isa
  rationale: Ang “sa isa” ay natural sa Tagalog at nananatiling indibidwal at distributibo ang halimbawa, bagaman hindi literal na inuulit ang demonstratibong “ito.”
- source_word: Πορεύθητι
  choice: Humayo ka
  rationale: Tuwirang utos na umalis o pumunta; marangal at madaling maunawaan sa kontekstong biblikal.
- source_word: Ἔρχου
  choice: Halika
  rationale: Karaniwan at tuwirang katumbas ng utos na lumapit.
- source_word: δοῦλος
  choice: alipin
  rationale: Ang δοῦλος ay karaniwang tumutukoy sa isang taong nasa katayuang alipin, hindi lamang sa isang pangkalahatang tagapaglingkod; pinananatili rito ang panlipunang pagpapasakop na kaayon ng argumento tungkol sa awtoridad.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa halimbawa ng senturyon
  choice: alipin
  alternative: lingkod
  rationale: Mas tuwirang inilalarawan ng “alipin” ang katayuang panlipunan at lubos na pagpapasakop na taglay ng δοῦλος. Inilalagay sa talababa ang “lingkod” bilang mas malawak at tradisyonal na salin nang hindi ikinukubli ang lakas ng salitang Griyego.
- issue: Ugnayan ng awtoridad ng senturyon at ng awtoridad ni Jesus
  choice: Pinanatili ang “ako man” at ang payak na paglalarawan sa hanay ng utos
  alternative: Ipaliwanag sa teksto na si Jesus ay nasa ilalim din ng awtoridad
  rationale: May tunay na interpretatibong tensiyon sa analogiya, ngunit hindi tahasang sinasabi ng talata kung kaninong awtoridad nasa ilalim si Jesus. Hindi ito dapat lutasin sa pamamagitan ng dagdag na paliwanag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na ritmo. Ginamit ang “kawal” at “humayo” bilang pormal ngunit karaniwang nauunawaang mga salita; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
