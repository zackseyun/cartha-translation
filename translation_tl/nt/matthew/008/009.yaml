  to: Sapagkat ako man ay isang taong nasa ilalim ng awtoridad at mayroon akong mga kawal na nasa ilalim ko. Sinasabi ko sa isa, ‘Humayo ka,’ at humahayo siya; at sa iba naman, ‘Halika,’ at lumalapit siya; at sa alipin ko[a], ‘Gawin mo ito,’ at ginagawa niya ito.
  rationale: Inayos ang estruktura ng unang pangungusap upang malinaw na maipahayag na ang nagsasalita ay kapuwa nasa ilalim ng awtoridad at may mga kawal na nasa ilalim niya, gaya ng ἔχων ὑπ’ ἐμαυτὸν στρατιώτας. Idinagdag ang “ito” sa huling tugon upang malinaw na matukoy ang bagay na ginagawa, na likas sa Tagalog at katumbas ng ipinahihiwatig ng Griyego. Napanatili ang payak na hanay ng mga utos at pagsunod, pati ang lexical na alternatibo para sa δοῦλος.
