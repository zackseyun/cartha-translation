  source_fidelity: 'Tumpak sa kabuuan ang mga pangunahing ugnayan: ang senturyon ay nasa ilalim ng awtoridad, may mga kawal na nasa ilalim niya, at ang mga utos ay agad sinusunod. Ang “alipin” para sa δοῦλος ay isang ligtas at mas tuwirang salin; ang “lingkod” ay angkop na alternatibo sa talababa.'
