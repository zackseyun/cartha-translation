id: MAT.25.43
reference: Matthew 25:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: tl
  text: Ako ay isang estranghero at hindi ninyo ako pinatuloy[a]; hubad ako at hindi ninyo ako dinamitan; may sakit ako at nasa bilangguan, at hindi ninyo ako dinalaw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinanggap” o “kinupkop.” Literal na nangangahulugang “tinipon” ang pandiwang Griyego, ngunit dito ay tumutukoy ito sa magiliw na pagtanggap at pagpapatuloy sa isang estranghero.
    reason: lexical_alternative
  - marker: b
    text: Ang “dinalaw” ay maaari ring magtaglay ng diwang “inalagaan” o “iningatan”; hindi lamang ito karaniwang pagbisita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: isang estranghero
  rationale: Tumutukoy ito sa isang taong hindi kabilang sa sambahayan o pamayanan at nangangailangan ng pagtanggap. Ang “estranghero” ay nagpapanatili sa diwa ng pagiging hindi kilala o tagalabas nang hindi ito nililimitahan sa etnisidad o pagkamamamayan.
- source_word: συνηγάγετέ
  choice: pinatuloy
  rationale: Bagaman literal na may diwang “tipunin” ang συνάγω, sa pagsama nito sa ξένος ay tumutukoy ito sa magiliw na pagtanggap at pagpapatuloy sa isang estranghero. Likas at malinaw sa Filipino ang “pinatuloy” para sa kongkretong gawa ng pagtanggap sa tahanan.
- source_word: γυμνός
  choice: hubad
  rationale: Maaaring tumukoy ang salita sa ganap na kahubaran o kakulangan ng sapat na damit. Pinananatili ng “hubad” ang tuwiran at matinding pananalita ng Griyego.
- source_word: περιεβάλετέ
  choice: dinamitan
  rationale: Ang pandiwa ay literal na nagpapahiwatig ng paglalagay ng isang bagay sa palibot at sa kontekstong ito ay nangangahulugang pagbibigay o pagsusuot ng damit. Ang “dinamitan” ay maikli, natural, at tuwirang katapat ng gawa ng awa na binabanggit.
- source_word: ἀσθενής
  choice: may sakit
  rationale: Bagaman maaari rin itong mangahulugang “mahina,” ang konteksto ng mga gawa ng habag ay pinakanatural na tumutukoy sa karamdaman. Karaniwan at malinaw sa modernong Filipino ang “may sakit.”
- source_word: ἐν φυλακῇ
  choice: nasa bilangguan
  rationale: Dito, ang φυλακή ay tumutukoy sa kalagayan ng pagkakabilanggo. Ang “bilangguan” ay dignified at malawak na katumbas, hindi kasing-kolokyal o makitid ng “kulungan.”
- source_word: ἐπεσκέψασθέ
  choice: dinalaw
  rationale: Ang ἐπισκέπτομαι ay pagdalaw na may malasakit at maaaring magpahiwatig ng pag-aalaga, hindi lamang isang sosyal na pagbisita. Pinananatili ng “dinalaw” ang kongkretong kilos, habang inililinaw sa talababa ang mas malawak na diwa.
theological_decisions:
- issue: Diwa ng mahabaging pagkilos sa ἐπεσκέψασθέ με
  choice: dinalaw ako
  alternative: inalagaan ako / kinumusta at tinulungan ako
  rationale: Pinananatili ng “dinalaw” ang kongkretong pagkilos na nasa Griyego at hindi labis na binibigyang-kahulugan ang talata. Gayunman, ang pandiwa ay may kasamang diwa ng mapagmalasakit na pagtingin at pag-aasikaso, na ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “estranghero,” “pinatuloy,” at “bilangguan” upang mapanatili ang panlipunang kahinaan at kongkretong mga gawa ng awa sa teksto. Ang mga semicolon ay naghihiwalay sa tatlong magkatugmang kalagayan habang pinananatili ang daloy ng isang pangungusap.
