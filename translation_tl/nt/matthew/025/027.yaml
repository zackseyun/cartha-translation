  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: tl
  text: Kaya dapat ay inilagak mo ang salapi ko sa mga tagabangko, at pagdating ko ay natanggap ko sana ang sa akin kasama ang tubo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ang interes.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: dapat ay
  rationale: Ipinahahayag ng imperpektong impersonal na anyo ang nararapat sanang ginawa noon at pinananatili ang diwa ng pagsaway.
- source_word: οὖν
  choice: Kaya
  rationale: Likas at malinaw na ipinakikita sa modernong Tagalog ang hinuha mula sa naunang paratang.
- source_word: βαλεῖν
  choice: inilagak
  rationale: Sa kontekstong pinansyal, tumutukoy ito sa paglalagay ng salapi sa pangangalaga ng mga bangkero; ang 'inilagak' ay natural at may angkop na dignidad.
- source_word: τὰ ἀργύριά μου
  choice: ang salapi ko
  rationale: Maaaring mangahulugang pilak o salapi ang ἀργύρια. Ang 'salapi' ang malinaw na functional na kahulugan sa kontekstong pangkalakalan habang naiiwasan ang sobrang makitid na 'mga barya.'
- source_word: τραπεζίταις
  choice: sa mga bangkero
  rationale: Dahil may binabanggit na tubo, ang tinutukoy ay mga taong tumatanggap at nagpapatubo ng salapi, hindi lamang mga tagapagpalit ng pera.
- source_word: ἐλθὼν ἐγὼ
  choice: pagdating ko
  rationale: Natural na ipinapahayag ang temporal na ugnayan ng participle sa kasunod na kilos.
- source_word: ἐκομισάμην ἂν
  choice: natanggap ko sana
  rationale: Ang gitnang anyo kasama ng ἄν ay nagsasaad ng resulta sa isang hindi natupad na kalagayan; malinaw itong naipahahayag ng 'sana.'
- source_word: τὸ ἐμὸν
  choice: ang sa akin
  rationale: Pinananatili ang substantibong pagmamay-ari at ang diin na ang salaping kukunin ay pag-aari ng nagsasalita.
- source_word: σὺν τόκῳ
  choice: kasama ang tubo
  rationale: Ang τόκος dito ay interes o kinita sa inilagak na salapi. Ang 'tubo' ay karaniwan at neutral sa modernong Tagalog.
theological_decisions:
- issue: Wikang pinansyal ng talinghaga at posibleng moral na pagbasa sa pagpapatubo
  choice: Isinalin nang tuwiran at neutral ang mga terminong pinansyal bilang bahagi ng larawan ng talinghaga.
  alternative: Gumamit ng salitang may negatibong pahiwatig, gaya ng 'patubo' sa diwang mapagsamantala, o magdagdag ng moral na paghatol.
  rationale: Hindi tahasang itinataguyod o hinahatulan ng talata ang lahat ng anyo ng interes. Ang neutral na salin ay hindi nag-aangkat ng mas huling debate sa teolohiya o etika.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang 'salapi' at 'bangkero' para sa tumpak na kontekstong pinansyal. Inilagay ang pananda ng talababa sa pangunahing teksto.
