id: MAT.25.25
reference: Matthew 25:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: tl
  text: Dahil sa takot, umalis ako at itinago ko sa lupa ang talento[a] mo. Tingnan mo, narito ang sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento ay isang yunit ng salapi na napakalaki ng halaga; hindi ito tumutukoy rito sa likas na kakayahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Dahil sa takot
  rationale: Ginagamit ang aorist participle bilang pang-abay na nagpapahayag ng dahilan o kalagayan ng kilos. Likas ito sa modernong Tagalog at hindi nito binibigyang-kahulugan ang takot bilang paggalang na may panrelihiyong diwa.
- source_word: ἀπελθὼν
  choice: umalis ako
  rationale: 'Isinama ang participle sa sunod-sunod na mga kilos sa natural na Tagalog: umalis muna ang alipin at saka nagtago.'
- source_word: ἔκρυψα
  choice: itinago ko
  rationale: Tuwirang katumbas ito ng ‘nagtago/nagkubli.’ Hindi ginamit ang ‘ibinaon’ sapagkat ang ideya ng paglalagay sa lupa ay malinaw nang nasa kasunod na parirala.
- source_word: τὸ τάλαντόν σου
  choice: ang talento mo
  rationale: Pinananatili ang makasaysayang tawag sa napakalaking yunit ng salapi o timbang. Nililinaw sa talababa na hindi ito tumutukoy sa likas na kakayahan.
- source_word: ἐν τῇ γῇ
  choice: sa lupa
  rationale: Natural at tuwirang salin ng lugar kung saan itinago ang salapi.
- source_word: ἴδε
  choice: Tingnan mo
  rationale: Pinananatili ang panawag-pansing puwersa ng προστακτικό na ἴδε sa kasalukuyang Tagalog.
- source_word: ἔχεις τὸ σόν
  choice: narito ang sa iyo
  rationale: Pinananatili ang diin sa pag-aari ng panginoon habang likas na ipinahahayag sa Tagalog ang eliptikong Griyego na literal na ‘taglay mo ang iyo.’
theological_decisions:
- issue: Kahulugan ng τάλαντον sa talinghaga
  choice: Panatilihin ang ‘talento’ bilang makasaysayang yunit ng salapi at ipaliwanag ito sa talababa.
  alternative: malaking halaga ng salapi
  rationale: Sa Griyego, tumutukoy ito sa isang yunit na napakataas ang halaga, hindi sa likas na kakayahan. Pinananatili ng pangunahing teksto ang makasaysayan at pampanitikang termino nang hindi ipinapasok ang makabagong metaporikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘Dahil sa takot’ upang malinaw na maipahayag ang motibo ng alipin, at ang ‘Tingnan mo’ sa halip na mas arkaikong panawag-pansin. Inilipat ang talababa sa ‘talento,’ ang salitang aktuwal nitong ipinapaliwanag.
