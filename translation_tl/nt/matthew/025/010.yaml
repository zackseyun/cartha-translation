  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: tl
  text: Ngunit habang umaalis sila upang bumili, dumating ang lalaking ikakasal. Ang mga nakahanda ay pumasok kasama niya sa handaan ng kasal[a], at isinara ang pinto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa piging ng kasal,” o “sa kasalan.” Ang pangmaramihang anyo sa Griyego ay maaaring tumukoy sa buong pagdiriwang ng kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων ... αὐτῶν
  choice: habang umaalis sila
  rationale: Ipinapahayag ng genitive absolute ang kasabay na pagkilos. Pinananatili ng “umaalis” ang diwa ng paglayo na taglay ng ἀπέρχομαι.
- source_word: ἀγοράσαι
  choice: upang bumili
  rationale: Nagsasaad ng layunin ang aorist infinitive. Hindi idinagdag sa teksto ang bagay na bibilhin, bagaman malinaw sa naunang talata na langis iyon.
- source_word: ὁ νυμφίος
  choice: ang lalaking ikakasal
  rationale: Ito ang malinaw at likas na makabagong Tagalog para sa lalaking nasa sentro ng tagpo ng kasalan, nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
- source_word: αἱ ἕτοιμοι
  choice: ang mga nakahanda
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy sa mga dalagang handa. Likas sa Tagalog ang anyong ito at hindi kailangang ulitin ang “mga dalaga.”
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: pumasok na kasama niya
  rationale: Tumpak at natural itong nagpapahayag ng sabay nilang pagpasok kasama ng lalaking ikakasal.
- source_word: εἰς τοὺς γάμους
  choice: sa handaan ng kasal
  rationale: Bagaman pangmaramihan ang γάμους sa Griyego, maaari itong tumukoy sa buong pagdiriwang ng kasal. Nililinaw ng “handaan ng kasal” ang tagpo nang hindi labis na nagpapakahulugan.
- source_word: ἐκλείσθη ἡ θύρα
  choice: isinara ang pinto
  rationale: Pinananatili ng balangkas na ito ang pasibong diwa nang hindi tinutukoy kung sino ang nagsara, at malinaw nitong ipinadarama ang pangwakas na kilos.
theological_decisions:
- issue: Paglalarawan sa kasalan sa loob ng talinghaga
  choice: Panatilihin bilang karaniwang salaysay ang “lalaking ikakasal” at “handaan ng kasal.”
  alternative: Gawing tahasan sa salin ang kristolohikal na kahulugan ng lalaking ikakasal.
  rationale: Dapat lumitaw mula sa konteksto ng talinghaga ang teolohikal na kahulugan, hindi mula sa paliwanag na idinagdag sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod-sunod at bigat ng mga kilos sa Griyego. Inilagay ang talababa sa “handaan ng kasal,” na siyang salitang tinutukoy ng paliwanag.
