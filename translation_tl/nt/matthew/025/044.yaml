reference: Matthew 25:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: tl
  text: Pagkatapos, sasagot din sila, ‘Panginoon, kailan ka namin nakitang gutom o uhaw, isang estranghero o hubad, may sakit o nasa bilangguan, at hindi ka namin pinaglingkuran[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “inasikaso” o “pinagmalasakitan” para sa “pinaglingkuran” (Griyego: διακονέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinapakita ang kasunod na pangyayari sa tagpo ng paghatol; natural ito sa makabagong Tagalog.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: sasagot din sila
  rationale: Pinananatili ng “din” ang diin na ang pangkat na ito, gaya ng nauna, ay sasagot.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang marangal na salin ng pamagat na κύριος sa tuwirang pagtawag kay Jesus.
- source_word: πεινῶντα ἢ διψῶντα
  choice: gutom o nauuhaw
  rationale: Natural na panaguring Tagalog para sa mga kasalukuyang kalagayang inilalarawan ng mga participle.
- source_word: ξένον
  choice: isang dayuhan
  rationale: Tumutukoy sa taong hindi kabilang sa sambahayan o pamayanan at nangangailangan ng pagtanggap; hindi nito nililimitahan ang kahulugan sa isang tiyak na etnisidad.
- source_word: γυμνὸν
  choice: hubad
  rationale: Tuwiran nitong pinananatili ang lakas ng salitang Griyego, bagaman maaaring saklawin sa konteksto ang kulang sa damit.
- source_word: ἀσθενῆ
  choice: may sakit
  rationale: Sa talaan ng mga pisikal at panlipunang pangangailangan, ito ang pinakanatural na kahulugan.
- source_word: ἐν φυλακῇ
  choice: nasa bilangguan
  rationale: Malinaw at karaniwang makabagong Tagalog para sa pagkakabilanggo.
- source_word: οὐ διηκονήσαμέν σοι
  choice: hindi ka namin pinaglingkuran
  rationale: Pinananatili ang malawak na diwa ng διακονέω bilang praktikal na paglilingkod o pag-aasikaso, at ang tuwirang bagay na “ikaw.”
theological_decisions:
- issue: Pagtawag kay Jesus bilang κύριος
  choice: Panginoon
  alternative: Ginoo
  rationale: Pinananatili ng “Panginoon” kapwa ang magalang na pagtawag at ang kristolohikal na alingawngaw ng titulo nang hindi nagdaragdag sa sinasabi ng teksto.
- issue: Saklaw ng διακονέω sa huling sugnay
  choice: pinaglingkuran
  alternative: inasikaso
  rationale: Mas malawak ang “pinaglingkuran” at pinananatili nito ang ugnayan ng praktikal na pagtulong at paglilingkod sa Hari; ipinapaliwanag sa talababa ang ibang posibleng pagpapahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Pinanatili ang anyong tanong at ang sunod-sunod na kalagayan sa Griyego, habang ginawang likas sa Tagalog ang ayos ng pangungusap.
