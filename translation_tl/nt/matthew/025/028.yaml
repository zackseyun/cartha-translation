  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: tl
  text: Kaya kunin ninyo sa kaniya ang talento[a][b] at ibigay ninyo ito sa taong may sampung talento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “alisin ninyo sa kaniya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “talento” ay isang malaking yunit ng timbang at, kaugnay nito, ng salapi.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: kunin ninyo
  rationale: Tuwirang utos sa maramihan ang aorist imperative. Natural sa modernong Filipino ang “kunin ninyo,” habang ipinahihiwatig ng kasunod na “sa kaniya” ang pag-aalis nito sa kaniya.
- source_word: οὖν
  choice: kaya
  rationale: Ipinakikita ang kongklusyon o bunga ng naunang hatol; malinaw at natural na pang-ugnay sa Filipino ang “kaya.”
- source_word: ἀπ’ αὐτοῦ
  choice: sa kaniya
  rationale: Kasama ng “kunin,” malinaw nitong ipinahahayag ang paghihiwalay o pagkuha mula sa lalaking hinatulan.
- source_word: τὸ τάλαντον
  choice: ang isang talento
  rationale: Pinananatili ang makasaysayang tawag na “talento.” Ginagawang hayag ng “isang” ang tiyak na nag-iisang talentong ipinagkatiwala sa kaniya ayon sa konteksto.
- source_word: δότε
  choice: ibigay
  rationale: Karaniwan at tuwirang katumbas ng aorist imperative na δίδωμι, na nagpapanatili sa lakas ng utos.
- source_word: τῷ ἔχοντι
  choice: sa may
  rationale: Maikli, natural, at impersonal na paraan sa Filipino upang isalin ang substantival participle na “sa isang nagtataglay.”
- source_word: τὰ δέκα τάλαντα
  choice: sampung talento
  rationale: Tumutukoy sa tiyak na sampung talentong nabanggit na sa salaysay; natural sa Filipino na hindi ulitin ang pantukoy pagkatapos ng “may.”
theological_decisions:
- issue: Kahulugan ng τάλαντον sa talinghaga
  choice: Pinanatili bilang makasaysayang yunit na “talento,” na nililinaw sa talababa bilang yunit ng timbang at salapi.
  alternative: salapi; malaking halaga ng salapi
  rationale: Ang talinghaga ay tungkol sa ipinagkatiwalang mga halaga, hindi sa likas na kakayahan. Pinananatili ng “talento” ang makasaysayang termino nang hindi ipinapasok sa teksto ang makabagong kahulugan nitong kakayahan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “kaya” para sa natural na daloy at “sa may” bilang idiomatikong salin ng articular participle.
