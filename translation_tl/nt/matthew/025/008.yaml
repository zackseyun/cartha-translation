id: MAT.25.8
reference: Matthew 25:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: tl
  text: Ngunit sinabi ng mga hangal sa marurunong, “Bigyan ninyo kami ng kaunti sa inyong langis, sapagkat namamatay na ang aming mga ilawan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sulo.” Ang salitang Griyego na λαμπάδες ay maaaring tumukoy sa hawak-kamay na ilawan o sulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: mga hangal
  rationale: Substantivong pang-uri ito na tumutukoy sa pangkat ng mga dalaga sa talinghaga. Likas sa Filipino ang “mga hangal” at pinananatili nito ang tuwirang pagsalungat sa marurunong.
- source_word: φρονίμοις
  choice: marurunong
  rationale: Tumutukoy ito sa praktikal na karunungan at kahandaan. Ang “marurunong” ay natural na katapat ng “mga hangal” nang hindi labis na nililimitahan ang diwa sa pagiging maingat lamang.
- source_word: Δότε
  choice: Bigyan ninyo kami
  rationale: Ang aorist imperative plural ay isang tuwirang pakiusap o utos sa marami. Malinaw sa Filipino ang “Bigyan ninyo kami” at tahasang ipinapakita ang tumatanggap.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: ng kaunti sa inyong langis
  rationale: 'Partitibo ang ἐκ: humihingi sila ng bahagi mula sa suplay ng langis ng iba. Likas na ipinahahayag ito sa Filipino bilang “ng kaunti sa inyong langis.”'
- source_word: λαμπάδες
  choice: mga ilawan
  rationale: Maaaring tumukoy ang λαμπάς sa ilawan o sulo. Ang “mga ilawan” ay pamilyar at angkop sa konteksto ng langis, samantalang pinananatili sa talababa ang tunay na alternatibong “mga sulo.”
- source_word: σβέννυνται
  choice: namamatay na
  rationale: Ipinahihiwatig ng kasalukuyang anyong passive/middle ang apoy na unti-unti nang nauupos. Ang “namamatay na” ay natural na Filipino para sa apoy ng ilawan na kasalukuyang nawawala.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kanilang kahilingan. Ang “sapagkat” ay malinaw, dignificado, at likas sa salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang karaniwang maramihang anyong “ninyo” at pinanatili ang tuwirang paghahambing ng mga hangal at marurunong. Ang panandang talababa [a] ay inilagay kaagad pagkatapos ng salitang tinutukoy nito.
