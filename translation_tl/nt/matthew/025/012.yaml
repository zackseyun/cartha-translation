  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: tl
  text: Ngunit sumagot siya, “Tinitiyak ko sa inyo, hindi ko kayo kilala.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi ko kayo kinikilala.” Mas literal sa Griyego ang “hindi ko kayo kilala,” na sa kontekstong ito ay maaaring magpahiwatig ng hindi pagkilala sa kanila bilang may kaugnayan sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ngunit sumagot siya
  rationale: Likas na isinasalin sa Tagalog ang participle at finite verb bilang payak na “sumagot siya”; pinananatili ng “Ngunit” ang pagsalungat na ipinahihiwatig ng δέ.
- source_word: Ἀμὴν
  choice: Tinitiyak ko
  rationale: Sa pormulang Ἀμὴν λέγω ὑμῖν, malinaw at marangal sa modernong Tagalog ang “Tinitiyak ko sa inyo,” na naghahatid ng solemneng pagpapatunay nang hindi gumagamit ng di-gaanong malinaw na “Amen” sa pangungusap.
- source_word: λέγω ὑμῖν
  choice: ko sa inyo
  rationale: Kasama ng “Tinitiyak,” natural nitong ipinapahayag ang direktang pananalita sa maramihang kausap.
- source_word: οὐκ οἶδα
  choice: hindi ko ... kilala
  rationale: Ang οἶδα ay karaniwang nangangahulugang “alam/kilala.” Dahil mga tao ang layon, “kilala” ang natural na Tagalog at pinananatili nito ang maaaring relasyonal na diwa nang hindi ito labis na ipinapaliwanag.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tumpak na kumakatawan ang “kayo” sa pangalawang panauhang maramihan na layon.
theological_decisions:
- issue: Diwa ng “οὐκ οἶδα ὑμᾶς” sa talinghaga
  choice: hindi ko kayo kilala
  alternative: hindi ko kayo nakikilala
  rationale: Pinananatili ng salin ang payak ngunit mabigat na pananalita ng Griyego, kabilang ang pahiwatig ng pagtatakwil o kawalan ng ugnayan, nang hindi dinaragdagan ng mas malawak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Tinitiyak ko sa inyo” bilang malinaw na katumbas ng solemneng pormulang Ἀμὴν λέγω ὑμῖν; iniwasan ang mas interpretibong pagpapalawak sa huling sugnay.
