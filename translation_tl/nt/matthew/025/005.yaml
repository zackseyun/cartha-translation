  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: tl
  text: Ngunit habang natatagalan ang lalaking ikakasal[a], inantok silang lahat at nakatulog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang nagtatagal ang lalaking ikakasal” o “habang naaantala ang lalaking ikakasal.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “inantok silang lahat at natutulog na.” Pinag-iiba ng Griyego ang pagkaantok (ἐνύσταξαν) at ang patuloy na pagtulog (ἐκάθευδον).
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: habang natatagalan
  rationale: Ipinahahayag nito ang nagpapatuloy na pagkaantala o pagtatagal sa genitive absolute, nang hindi ipinapalagay kung ano ang sanhi nito.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Minamarkahan nito ang banayad na pagsalungat o pagbabago sa salaysay: naghintay sila, ngunit natagalan ang lalaking ikakasal.'
- source_word: νυμφίου
  choice: ang lalaking ikakasal
  rationale: Ito ang natural at malinaw na makabagong Tagalog para sa νυμφίος sa tagpo ng kasalan, at pinananatili ang larawan ng talinghaga.
- source_word: ἐνύσταξαν
  choice: inantok
  rationale: Ipinakikita nito ang pagpasok sa kalagayan ng pagkaantok bago ang aktuwal na pagtulog.
- source_word: πᾶσαι
  choice: silang lahat
  rationale: Malinaw nitong tinutukoy ang lahat ng sampung dalaga at pinananatili ang diin sa kabuuan nila.
- source_word: ἐκάθευδον
  choice: nakatulog
  rationale: Natural nitong ipinahahayag ang pagsulong mula sa pagkaantok tungo sa pagtulog; ang di-ganap na aspekto ng Griyego ay maaari ring unawaing patuloy silang natutulog.
theological_decisions:
- issue: Larawan ng lalaking ikakasal sa talinghaga
  choice: Panatilihin ang “lalaking ikakasal” bilang larawan sa mismong salaysay nang walang tahasang pagkakakilanlang Kristolohikal.
  alternative: Ipaliwanag sa teksto na ang lalaking ikakasal ay tumutukoy kay Cristo.
  rationale: May teolohikal na kabuluhan ang larawang ito sa mas malawak na konteksto ng Mateo, ngunit hindi tahasang ibinibigay ng talatang ito ang interpretasyong iyon. Dapat panatilihin ng salin ang larawan nang hindi nagdaragdag ng paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking ikakasal” sa halip na mas kolokyal o hiram na katawagan, at pinanatili ang dalawang yugto—pagkaantok at pagtulog—sa payak na salaysay.
