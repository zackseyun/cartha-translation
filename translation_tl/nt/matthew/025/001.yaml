base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: tl
  text: Sa panahong iyon, maitutulad[a] ang kaharian ng langit sa sampung birhen[b] na kumuha ng kanilang mga ilawan[c] at lumabas upang salubungin ang nobyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “magiging tulad.” Balintiyak ang pandiwang Griyego: “maihahambing” o “maitutulad.”'
    reason: lexical_alternative
  - marker: b
    text: O, “sampung dalaga.” Ang salitang Griyego ay tumutukoy sa mga kabataang babaeng hindi pa kasal at maaari ring tahasang mangahulugang mga birhen.
    reason: lexical_alternative
  - marker: c
    text: O, “mga sulo.” Maaaring tumukoy ang salitang Griyego sa ilawang tangan sa kamay o sa sulo na ginagamit sa isang prusisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Sa panahong iyon
  rationale: Likas na panandang temporal sa Filipino at malinaw na nag-uugnay sa talinghaga sa naunang konteksto.
- source_word: ὁμοιωθήσεται
  choice: maitutulad
  rationale: Pinananatili ang hinaharap at balintiyak na anyo ng pandiwang Griyego, habang natural pa rin sa makabagong Filipino.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Karaniwan at malinaw na salin ng natatanging parirala ni Mateo; idiomatiko sa Filipino ang isahang “langit.”
- source_word: δέκα παρθένοις
  choice: sa sampung dalaga
  rationale: Sa konteksto ng kasalan, natural na tumutukoy ang “dalaga” sa mga kabataang babaeng hindi pa kasal; inilalagay sa talababa ang mas tahasang “birhen” upang mapanatili ang buong saklaw ng παρθένος.
- source_word: αἵτινες
  choice: na
  rationale: Natural na pang-ugnay sa Filipino para ipakilala ang paglalarawan sa sampung dalaga.
- source_word: λαβοῦσαι
  choice: kumuha
  rationale: Ang aorist participle ay likas na naisasalin bilang pandiwang may hangganan; malinaw pa rin na nauna ang pagkuha sa paglabas.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: kanilang mga ilawan
  rationale: Ang λαμπάς ay maaaring ilawan o sulo; “ilawan” ang tradisyonal at malinaw na pangunahing salin, habang itinatala ang “sulo” bilang lehitimong alternatibo.
- source_word: ἐξῆλθον
  choice: lumabas
  rationale: Direkta at natural na katumbas ng kilos na palabas.
- source_word: εἰς ὑπάντησιν
  choice: upang salubungin
  rationale: Ipinapahayag ang layunin ng paglabas at ang diwa ng pagharap upang tanggapin ang dumarating.
- source_word: τοῦ νυμφίου
  choice: ang lalaking ikakasal
  rationale: Malinaw at natural na modernong Filipino para sa lalaking ikakasal sa konteksto ng kasalan.
theological_decisions:
- issue: Pormula ng paghahambing sa talinghaga
  choice: maitutulad ang kaharian ng langit
  alternative: magiging tulad ang kaharian ng langit
  rationale: Pinananatili ng “maitutulad” ang balintiyak na anyo at hinaharap na pananaw ng ὁμοιωθήσεται nang hindi ginagawang mabigat ang Filipino.
- issue: Kahulugan ng παρθένοις
  choice: mga dalaga
  alternative: mga birhen
  rationale: Mas natural ang “mga dalaga” sa tagpo ng prusisyon sa kasalan, ngunit hindi isinasaisantabi ang mas tahasang kahulugan na “mga birhen,” na inilalahad sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maitutulad” upang mapanatili ang gramatikal na hugis ng Griyego, at ang “lalaking ikakasal” bilang mas natural kaysa sa mas luma o mas teknikal na katawagan.
