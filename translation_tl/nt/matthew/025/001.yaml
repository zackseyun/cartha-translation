  source_fidelity: 'Ang “maitutulad” ay wastong naghahatid ng hinaharap na balintiyak na ὁμοιωθήσεται, at tapat ang pagkakasunod ng mga kilos: pagkuha ng mga ilawan, paglabas, at pagsalubong sa nobyo. Gayunman, ang pangunahing “mga dalaga” ay hindi tahasang naipapahayag ang leksikal na diin ng παρθένοις na karaniwang “mga birhen.” Maaaring nasa saklaw nito ang mga dalagang hindi pa kasal, ngunit mas ligtas na panatilihin ang espesipikong katawagan sa pangunahing teksto at ilagay ang “mga dalaga” bilang alternatibo.'
