  terminology: Panatilihin ang “kaharian ng langit,” “maitutulad,” at “mga ilawan,” kasama ang mga lehitimong alternatibo sa talababa. Gamitin ang “mga birhen” para sa παρθένοις at “nobyo” para sa νυμφίος upang maging mas tiyak ang terminolohiyang pangkasalan.
