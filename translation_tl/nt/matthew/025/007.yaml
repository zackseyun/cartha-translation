  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: tl
  text: Noon, bumangon ang lahat ng dalagang iyon at inayos ang kanilang mga ilawan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga sulo” sa halip na “mga ilawan” (Griyego: λαμπάδας). Maaaring tumukoy ang salita sa ilaw na dinadala sa kamay; kapuwa posibleng salin ang “mga ilawan” at “mga sulo” sa konteksto ng langis at paghahanda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa salaysay; natural sa modernong Tagalog ang “Pagkatapos.”
- source_word: ἠγέρθησαν
  choice: tumindig
  rationale: Sa konteksto ng pagkakatulog, tumutukoy ito sa pagbangon mula sa pagkakahiga o pagkakaupo. Hindi nito tahasang sinasabing may gumising sa kanila.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: ang lahat ng dalagang iyon
  rationale: Pinananatili ng “dalaga” ang diwa ng παρθένος sa konteksto ng kasalan at mas natural ito kaysa sa mas teknikal na “birhen” bilang katawagan sa mga tauhan.
- source_word: ἐκόσμησαν
  choice: inayos
  rationale: Ang κοσμέω ay nangangahulugang ayusin o ihanda. Hindi tinutukoy ng Griyego ang eksaktong ginawa sa mitsa, kaya pinananatili ng “inayos” ang lawak ng kahulugan.
- source_word: λαμπάδας
  choice: mga ilawan
  rationale: Maaaring tumukoy ang λαμπάς sa ilawan o sulo. Ang langis at paghahanda sa konteksto ay umaayon sa “ilawan,” habang inilalagay sa talababa ang lehitimong alternatibo.
- source_word: ἑαυτῶν
  choice: kanilang
  rationale: Ipinahihiwatig ng reflexive genitive ang pag-aari ng mga dalaga; sapat at natural sa Tagalog ang “kanilang” nang walang dagdag na pagdidiin.
