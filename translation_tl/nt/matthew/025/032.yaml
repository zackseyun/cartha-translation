id: MAT.25.32
reference: Matthew 25:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: tl
  text: At titipunin sa harap niya ang lahat ng bansa[a], at ihihiwalay niya sila sa isa’t isa, gaya ng paghihiwalay ng pastol sa mga tupa mula sa mga kambing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng mga bayan”; sa Griyego, “ang lahat ng bansa” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na ἐρίφων ay maaari ring tumukoy nang mas tiyak sa “mga batang kambing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: titipunin
  rationale: Hinaharap na balintiyak ang anyo sa Griyego. Ang “titipunin” ay natural sa Filipino at hindi tahasang nagdaragdag kung sino ang tagapagtipon.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: sa harap niya
  rationale: Tuwirang katumbas na malinaw at angkop sa tagpo ng paghatol.
- source_word: πάντα τὰ ἔθνη
  choice: ang lahat ng bansa
  rationale: Pinananatili nito ang malawak na kahulugan ng ἔθνη bilang mga bansa o mga bayan, nang hindi ito nililimitahan sa mga Hentil lamang.
- source_word: ἀφορίσει
  choice: pagbubukod-bukurin
  rationale: Ipinahahayag nito ang paghihiwalay ng mga kabilang sa isang natipong kalipunan tungo sa magkakaibang pangkat.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: niya sila
  rationale: Sa Filipino, ang ideya ng paghihiwalay nila sa isa’t isa ay natural nang naipapahayag ng pandiwang “pagbubukod-bukurin”; ang pagdaragdag ng “sa isa’t isa” ay magiging mabigat at maaaring magmungkahi ng indibiduwal na paghihiwalay.
- source_word: ὥσπερ
  choice: gaya ng
  rationale: Natural at malinaw na pananda ng paghahambing sa modernong Filipino.
- source_word: ὁ ποιμὴν
  choice: ang pastol
  rationale: Karaniwan at madaling maunawaang katawagan sa tagapag-alaga ng mga tupa; pinananatili ang pangkalahatang paglalarawan ng Griyegong may pantukoy.
- source_word: τὰ πρόβατα
  choice: mga tupa
  rationale: Tiyak na pinananatili ang kongkretong larawan ng tupa sa halip na gawing pangkalahatang “kawan.”
- source_word: τῶν ἐρίφων
  choice: mga kambing
  rationale: Natural ang tradisyonal na paghahambing na tupa at kambing sa Filipino; ipinapaliwanag sa talababa na maaaring tumukoy nang mas tiyak sa mga batang kambing.
theological_decisions:
- issue: Saklaw ng πάντα τὰ ἔθνη
  choice: ang lahat ng bansa
  alternative: ang lahat ng mga bayan; ang lahat ng Hentil
  rationale: Pinananatili ang leksikal na lawak at tunay na kalabuan ng parirala, nang hindi ipinapasiya kung mga bansang pampolitika, lahat ng mga sambayanan, o mga Hentil lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “titipunin” upang mapanatili ang balintiyak na diwa nang hindi pinapangalanan ang tagaganap, at “pagbubukod-bukurin” para sa natural na paghihiwalay sa dalawang pangkat. Kumpleto at tugma ang mga marker na [a] at [b] sa pangunahing teksto at mga talababa.
