id: MAT.25.20
reference: Matthew 25:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: tl
  text: At lumapit ang tumanggap ng limang talento[b] at nagdala ng lima pang talento. Sinabi niya, “Panginoon[a], limang talento ang ibinigay mo sa akin. Tingnan mo, kumita ako ng lima pang talento.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “Amo.” Griyego: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: Ang talento ay isang malaking yunit ng salapi.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: lumapit
  rationale: Tuwirang ipinapahayag ang paglapit ng alipin upang humarap at mag-ulat sa kanyang panginoon.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ang tumanggap ng limang talento
  rationale: Pinananatili ang articular participial construction nang hindi nagdaragdag ng tahasang pangngalang wala sa Griyego; malinaw sa konteksto kung sino ang tinutukoy.
- source_word: τάλαντα
  choice: talento
  rationale: Pinananatili ang tradisyonal na katawagang hinango sa Griyego at nililinaw sa talababa na isa itong malaking yunit ng salapi, sa halip na limitahan ito sa ginto o sa isang tiyak na modernong halaga.
- source_word: προσήνεγκεν
  choice: nagdala
  rationale: Likas at tuwirang salin ng pagdadala ng karagdagang halaga sa harap ng panginoon; iniiwasan ang maaaring kultikong dating ng “naghandog.”
- source_word: ἄλλα πέντε τάλαντα
  choice: lima pang talento
  rationale: Natural sa modernong Tagalog at malinaw na tumutukoy sa karagdagang kapantay na halaga.
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang posibleng mas malawak na alingawngaw nito sa Mateo, habang ipinapakita sa talababa ang agarang kahulugang panlipunan na “Amo.”
- source_word: παρέδωκας
  choice: ibinigay mo sa akin
  rationale: Malinaw at natural na ipinapahayag ang paghahatid o pagbibigay ng halaga sa alipin. Hindi ipinapasok sa pangunahing teksto ang mas interpretibong “ipinagkatiwala.”
- source_word: ἴδε
  choice: Tingnan mo
  rationale: Pinananatili ang deiktikong panawag-pansin sa tuwiran at kasalukuyang Tagalog.
- source_word: ἐκέρδησα
  choice: kumita ako
  rationale: Likas na salitang Filipino para sa pagkakaroon ng tubo o pakinabang; hindi nito ipinahihiwatig na sahod ang natanggap.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang tawag sa loob ng talinghaga
  choice: Panginoon
  alternative: Amo
  rationale: Sa agarang tagpo, ang tinutukoy ay ang amo ng alipin, ngunit ang “Panginoon” ay nagpapanatili ng leksikal na pagkakapare-pareho at ng posibleng naratibo-teolohikal na alingawngaw nang hindi ipinipilit ang isang tiyak na kristolohikal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang “mo” ayon sa anyo ng Griyego; hindi nagdagdag ng “po” upang hindi magpasok ng elementong wala sa pinagmulan. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal na nililinaw ng bawat tala.
