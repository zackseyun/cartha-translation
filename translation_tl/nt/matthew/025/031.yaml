  source_fidelity: 'Tumpak ang salin sa mga pangunahing yunit ng Griyego: ang panghinaharap na sugnay na “kapag dumating,” ang titulong “Anak ng Tao,” ang “kanyang kaluwalhatian,” ang lahat ng anghel na kasama niya, at ang kasunod na pag-upo sa trono. Hindi idinagdag ang “kanyang” sa “lahat ng anghel,” alinsunod sa tekstong Griyego.'
