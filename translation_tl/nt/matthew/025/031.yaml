  terminology: Ang “Anak ng Tao,” “kaluwalhatian,” at “trono” ay wastong mga terminong biblikal sa Filipino. Ang “kanyang maluwalhating trono” ay idiomatiko at tapat sa kahulugan ng θρόνου δόξης αὐτοῦ. Wasto ring itinatala ng talababa ang mas literal na alternatibo.
