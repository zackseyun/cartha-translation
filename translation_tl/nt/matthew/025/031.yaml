id: MAT.25.31
reference: Matthew 25:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: tl
  text: Ngunit kapag dumating ang Anak ng Tao sa kanyang kaluwalhatian, at kasama niya ang lahat ng anghel, saka siya uupo sa kanyang maluwalhating trono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa trono ng kanyang kaluwalhatian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ngunit kapag
  rationale: Ang “kapag” ay likas na nagpapahayag ng isang tiyak na pangyayari sa hinaharap, at ang “ngunit” ay nagpapanatili sa banayad na paglilipat o pagsalungat na hatid ng δέ.
- source_word: ἔλθῃ
  choice: dumating
  rationale: Ang aorist subjunctive kasunod ng ὅταν ay tumutukoy sa pangyayari sa hinaharap; natural itong ipahayag sa Filipino bilang “kapag dumating.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo ni Jesus at ang kaugnayan nito sa Daniel 7 nang hindi ito pinapaliwanag nang labis.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: sa kanyang kaluwalhatian
  rationale: Ang “kaluwalhatian” ay nagpapanatili sa diwa ng hayag na kadakilaan at karangalan, gayundin sa biblikal na taginting ng δόξα.
- source_word: πάντες οἱ ἄγγελοι
  choice: lahat ng anghel
  rationale: Sinusunod nito ang Griyegong “lahat ng mga anghel” nang hindi nagdaragdag ng tahasang panghalip na paari na wala sa parirala.
- source_word: μετ’ αὐτοῦ
  choice: kasama niya
  rationale: Direkta at natural nitong ipinapahayag ang pagsama ng mga anghel sa Anak ng Tao.
- source_word: τότε
  choice: saka
  rationale: Malinaw na ipinahihiwatig ng “saka” ang kasunod na kilos matapos ang kanyang pagdating.
- source_word: καθίσει ἐπὶ θρόνου
  choice: uupo sa … trono
  rationale: Direkta nitong isinasalin ang aktibong pandiwa at ang posisyon sa trono nang hindi dinaragdagan ng interpretasyong “luluklok.”
- source_word: θρόνου δόξης αὐτοῦ
  choice: kanyang maluwalhating trono
  rationale: Ito ang natural na makabagong Filipino para sa genitibong parirala, habang inilalahad sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Ang kristolohikal na titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Pinananatili ang tradisyonal at intertekstuwal na titulo upang huwag pahinain ang kaugnayan nito sa Daniel 7 o ipasok ang isang paliwanag na wala mismo sa teksto.
- issue: Ang kahulugan ng θρόνου δόξης αὐτοῦ
  choice: kanyang maluwalhating trono
  alternative: trono ng kanyang kaluwalhatian
  rationale: Ang pangunahing salin ay natural sa Filipino at ipinapakitang ang trono ay nauugnay sa kanyang kaluwalhatian; pinananatili sa talababa ang mas literal at bahagyang mas bukas na kayarian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kinikilalang titulong “Anak ng Tao” at ang salitang “kaluwalhatian” dahil sa kanilang mahalagang biblikal na taginting.
