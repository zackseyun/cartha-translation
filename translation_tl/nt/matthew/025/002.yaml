  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: tl
  text: Ang lima sa kanila ay hangal, at ang lima ay matalino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: lima
  rationale: Tuwirang salin ng bilang na πέντε. Inulit upang mapanatili ang balanseng paghahambing ng dalawang pangkat sa Griyego.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay dito ang δέ, hindi mariing pagsalungat. Likas sa Filipino ang “at” at hindi nito pinalalakas nang labis ang kaibahan.
- source_word: ἐξ αὐτῶν
  choice: sa kanila
  rationale: Ipinahihiwatig ng partitive na parirala na ang lima ay bahagi ng naunang binanggit na pangkat. Ang “sa kanila” ang natural at malinaw na katumbas sa Filipino.
- source_word: ἦσαν
  choice: ay
  rationale: Ang imperfect ng εἰμί ay ginagamit bilang copula sa paglalarawang ito. Hindi minamarkahan ng Filipino ang panahunan sa copula gaya ng Griyego; sapat at natural ang “ay” sa konteksto ng nakaraang salaysay.
- source_word: μωραὶ
  choice: hangal
  rationale: Ang μωρός ay tumutukoy sa kawalan ng wastong pag-iisip o sentido. Ang “hangal” ay tuwiran, dignified, at nagpapanatili sa matalas na kaibahan sa φρόνιμοι.
- source_word: καὶ πέντε φρόνιμοι
  choice: at ang lima ay matalino
  rationale: Ang φρόνιμος ay maaaring mangahulugang matalino, maingat, o may wastong pagpapasiya. Pinili ang “matalino” dahil natural itong katapat ng “hangal” sa talinghaga. Inulit ang “ay” para sa malinaw at balanseng pangungusap sa Filipino.
