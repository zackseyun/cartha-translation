  verdict: revise
  source_fidelity: Kailangang isalin nang hayag ang μεθ’ ἑαυτῶν (“kasama nila”). Hindi ito naipapahayag ng “hindi sila nagdala ng langis” lamang, sapagkat ang Griyego ay tiyak na nagsasabing hindi sila nagdala ng langis na kasama nila. Ang “Sapagkat,” “mga hangal,” “mga ilawan,” at ang temporal na “nang” ay tapat sa teksto at konteksto.
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “hindi sila nagdala ng langis kasama nila.” Pinananatili rin nito ang sadyang pag-uulit ng “dalhin/nagdala,” na tumutugon sa λαβοῦσαι/ἔλαβον.
  terminology: Ang “mga hangal” ay angkop para sa μωραί at hindi kailangang ulitin ang “mga dalaga,” na malinaw mula sa naunang talata. Ang “mga ilawan” ay angkop para sa λαμπάδας; ang alternatibong “mga sulo” ay wastong inilalagay sa talababa.
  issues:
