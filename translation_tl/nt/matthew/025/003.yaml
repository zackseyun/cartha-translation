base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: tl
  text: Sapagkat nang dalhin ng mga hangal ang kanilang mga ilawan[a], hindi sila nagdala ng langis kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga sulo” para sa “mga ilawan” (Griyego: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag sa naunang pahayag at pinananatili ang ugnayang lohikal ng talata.
- source_word: μωραὶ
  choice: mga hangal
  rationale: Ang pang-uring pambabae at maramihan ay tumutukoy pabalik sa mga dalaga sa talinghaga; natural sa Tagalog ang substantibong “mga hangal” nang hindi inuulit ang “mga dalaga.”
- source_word: λαβοῦσαι
  choice: nang dalhin
  rationale: Ang aorist participle ay natural na ipinapahayag bilang sugnay na temporal; sa konteksto, ang pagdadala ang malinaw na diwa.
- source_word: λαμπάδας
  choice: mga ilawan
  rationale: Karaniwan at angkop na salin sa konteksto ng langis, habang kinikilala sa talababa na maaari rin itong tumukoy sa mga sulo.
- source_word: οὐκ ἔλαβον
  choice: hindi sila nagdala
  rationale: Pinananatili ang pag-uulit ng parehong pandiwang λαμβάνω sa participle at pangunahing pandiwa sa pamamagitan ng “dalhin/nagdala.”
- source_word: μεθ’ ἑαυτῶν
  choice: kasama nila
  rationale: Likas na katumbas sa Tagalog ng reflexive phrase; nakapaloob ang diwa sa pariralang “hindi sila nagdala ng langis,” kaya hindi na kailangang gawing mabigat ang pangunahing teksto.
- source_word: ἔλαιον
  choice: langis
  rationale: Tuwirang salin; sa konteksto, ito ang langis na gagamitin para sa mga ilawan o sulo.
