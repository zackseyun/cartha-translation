  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: tl
  text: At ang mga ito ay aalis patungo sa walang hanggang kaparusahan[a], ngunit ang mga matuwid ay sa walang hanggang buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaparusahang ukol sa kapanahunan” … “buhay na ukol sa kapanahunan.” Pinagtatalunan ang diwa ng pang-uring Griyego na αἰώνιος sa ilang konteksto. Dito, iisang salita ang naglalarawan sa “kaparusahan” at sa “buhay,” kaya pinanatili sa dalawang parirala ang magkatumbas na saling “walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: tutungo
  rationale: Ang panghinaharap na anyo ng ἀπέρχομαι ay nagsasaad ng pag-alis o pagpunta. Likas sa modernong Tagalog ang “tutungo” kapag binabanggit ang kahihinatnan o patutunguhan, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Tumutukoy ang panghalip na pamatlig sa pangkat na naunang inilarawan. Pinananatili ng “ang mga ito” ang maikli at tuwirang paghahambing sa “ang mga matuwid.”
- source_word: κόλασιν
  choice: kaparusahan
  rationale: Sa konteksto ng paghuhukom, tumutukoy ang κόλασις sa kaparusahang bunga ng hatol. Ang “kaparusahan” ang malinaw at karaniwang salin, nang hindi ipinapalagay na ito ay panandaliang pagtutuwid lamang.
- source_word: αἰώνιον
  choice: walang hanggan
  rationale: Iisang pang-uri ang ginagamit para sa “kaparusahan” at “buhay.” Pinananatili ng “walang hanggan” sa dalawang parirala ang mahigpit na paralelismo ng Griyego. Inilalahad sa talababa ang alternatibong may kaugnayan sa “kapanahunan.”
- source_word: δίκαιοι
  choice: ang mga matuwid
  rationale: Ginamit bilang pangngalan ang pang-uri at tumutukoy sa mga taong matuwid o ibinibilang na matuwid. Ang “ang mga matuwid” ay natural at nagpapanatili sa moral at pakikipagtipang diwa ng salita.
- source_word: ζωὴν
  choice: buhay
  rationale: Ang “buhay” ang tuwiran at karaniwang katumbas ng ζωή; walang dahilan sa konteksto upang palawakin pa ito.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita ng δὲ ang malinaw na pagsalungat ng dalawang pangkat at ng kani-kanilang kahihinatnan. Likas at malinaw itong naipapahayag ng “ngunit.”
theological_decisions:
- issue: Pagpapakahulugan sa αἰώνιον sa magkatambal na κόλασιν αἰώνιον at ζωὴν αἰώνιον
  choice: Isalin bilang “walang hanggan” sa dalawang parirala
  alternative: “ukol sa kapanahunan” o “tumatagal sa kapanahunan”
  rationale: Iisang pang-uri ang naglalarawan sa kaparusahan at sa buhay, kaya hindi dapat pag-ibahin ng salin ang saklaw o tagal nito sa dalawang sugnay. Ang “walang hanggan” ang natural at karaniwang salin sa kontekstong ito. Gayunman, dahil maaaring iugnay ang αἰώνιος sa isang “kapanahunan” at pinagtatalunan ang diwa nito sa ilang konteksto, itinatala ang alternatibo sa talababa sa halip na burahin ang tunay na usaping leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang maikli at balanseng kayarian ng Griyego, kabilang ang elipsis sa ikalawang sugnay (“ngunit ang mga matuwid ay sa…”). Ang “tutungo” ay mas natural kaysa sa literal ngunit mabigat na “aalis patungo,” at malinaw nitong ipinahihiwatig ang patutunguhan.
