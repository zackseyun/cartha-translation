  naturalness: Mas malinaw ang ayos na “sasagot ang Hari sa kanila.” Ang “sa lawak na” ay bahagyang pormal ngunit natural at angkop sa marangal na rehistro, at mas tapat kaysa sa sanhiang “yamang.” Inilagay ang mga panandang talababa agad pagkatapos ng mga salitang tinutukoy ng mga ito.
  terminology: Ang “Hari,” “Katotohanang sinasabi ko sa inyo,” “mga kapatid,” “mga pinakamababa,” at “sa akin” ay angkop na mga katumbas. Ang “mga kapatid” ay nananatiling likas na Tagalog nang hindi idinadagdag ang isang makitid na biyolohikal o teolohikal na pagpapakahulugan; ipinaliliwanag ng talababa ang anyong panlalaking maramihan ng Griyego.
