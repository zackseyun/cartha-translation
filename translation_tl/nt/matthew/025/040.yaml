reference: Matthew 25:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: tl
  text: At sasagot ang Hari sa kanila, ‘Katotohanang sinasabi ko sa inyo[a], sa lawak na ginawa ninyo ito sa isa sa mga pinakamababa sa mga kapatid kong ito[b], ginawa ninyo ito sa akin.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Amen, sinasabi ko sa inyo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego na isinaling “mga kapatid” ay anyong panlalaking maramihan. Maaaring tumukoy ang “mga kapatid kong ito” lalo na sa mga alagad ni Jesus, sa mga mananampalataya sa pangkalahatan, o sa mas malawak na pangkat ng mahihina at nangangailangan; hindi pinagpapasiyahan ng salin ang usaping ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: sasagot
  rationale: Pinagsasama ng pandiwaring participle at ng pandiwang panghinaharap ang diwang “sasagot at magsasabi.” Likas sa makabagong Tagalog ang “sasagot,” at malinaw na kasunod nito ang tuwirang sinabi.
- source_word: ὁ βασιλεὺς
  choice: ang Hari
  rationale: Pinananatili ang tahasang titulong βασιλεύς. Ginamit ang malaking titik sapagkat sa konteksto ang Hari ang pangwakas na hukom na kaugnay ng Anak ng Tao.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Ipinahahayag nito ang taimtim at mariing pormula ni Jesus sa natural ngunit marangal na Tagalog. Ang mas literal na “Amen, sinasabi ko sa inyo” ay inilagay sa talababa.
- source_word: ἐφ’ ὅσον
  choice: yamang
  rationale: Sa kontekstong ito, ipinakikita ng parirala na ang ginawa sa isa sa grupong tinutukoy ay itinuring na ginawa sa Hari. Ang “yamang” ay malinaw at natural sa Tagalog nang hindi ginagawang malayang paraphrase ang pangungusap.
- source_word: ἐποιήσατε
  choice: ginawa ninyo ito
  rationale: Ang “ito” ay natural na tumutukoy sa mga gawaing binanggit sa naunang mga talata at nagpapanatili ng pag-uulit sa dalawang sugnay.
- source_word: ἑνὶ τούτων
  choice: sa isa ... sa mga ... ito
  rationale: Pinananatili ang indibiduwalisadong lakas ng ἑνί, “isa,” at ang deiktikong τούτων, “mga ... ito.”
- source_word: τῶν ἀδελφῶν μου
  choice: mga kapatid kong ito
  rationale: Ang “kapatid” sa Tagalog ay likas na hindi nagtatakda ng kasarian, bagaman ang Griyegong ἀδελφῶν ay anyong panlalaking maramihan. Hindi dinaragdagan ang teksto ng “mga kapatid na lalaki,” na sa Tagalog ay maaaring magpahiwatig ng biyolohikal na kasarian nang higit sa hinihingi ng konteksto; nililinaw ito sa talababa.
- source_word: τῶν ἐλαχίστων
  choice: pinakamababa
  rationale: Ipinahahayag ng “pinakamababa” ang superlatibong katayuan ng ἐλαχίστων at iniiwasang paliitin ang kahulugan sa pisikal na kaliitan lamang.
- source_word: ἐμοὶ
  choice: sa akin
  rationale: Tuwirang pinananatili ang datibo at ang matinding pagkakaugnay ng ginawa sa mga kapatid ng Hari at ng ginawa sa Hari mismo.
theological_decisions:
- issue: Tinutukoy ng “mga kapatid kong ito”
  choice: Pinanatili ang parirala nang hindi tinutukoy kung sila ay mga alagad, mga mananampalataya sa pangkalahatan, o mga mahihina at nangangailangan.
  alternative: Tahasang tukuyin sila bilang mga alagad o misyonero ni Jesus, lahat ng mananampalataya, o lahat ng mahihina at nangangailangan.
  rationale: Hindi tahasang nilulutas ng mismong talata ang usaping ito. Pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
- issue: Kasarian sa ἀδελφῶν
  choice: “mga kapatid,” na siyang natural na katumbas sa Tagalog, kalakip ang talababa tungkol sa anyong panlalaki ng Griyego.
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae.”
  rationale: Walang karaniwang salitang Tagalog na eksaktong tumutugma sa semantikong lawak ng Griyegong panlalaking maramihan nang hindi nagdaragdag ng biyolohikal na diin o isang inklusibong pagpapalawak. Ang “mga kapatid” ang pinakaeksaktong likas na salin, at pinangangalagaan ng talababa ang impormasyong morpolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang solemne at panghukom na tono, ang pag-uulit ng “ginawa ninyo ito,” at ang interpretibong kalabuan ng “mga kapatid kong ito.” Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
