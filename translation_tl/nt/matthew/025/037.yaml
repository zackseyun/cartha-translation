id: MAT.25.37
reference: Matthew 25:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: tl
  text: Pagkatapos ay sasagot sa kanya ang mga matuwid, “Panginoon, kailan ka namin nakitang nagugutom at pinakain, o nauuhaw at pinainom[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “binigyan ng maiinom.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos ay
  rationale: Natural na panandang temporal sa Filipino na nagpapakita ng kasunod na pangyayari sa tagpo.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: sasagot sa kanya
  rationale: Ipinahahayag nang natural ang kinabukasang kilos at ang di-tuwirang layon ng pandiwa.
- source_word: οἱ δίκαιοι
  choice: ang mga matuwid
  rationale: Pinananatili ang substantibong gamit ng pang-uri at ang moral-teolohikal na diwa nang hindi dinaragdagan ang kahulugan.
- source_word: λέγοντες
  choice: '[ipinakilala sa tuwirang sipi]'
  rationale: Sa natural na Filipino, sapat nang tuwirang isunod ang sinabi matapos ang “sasagot”; magiging mabigat at paulit-ulit ang “na sinasabi.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang katumbas ng κύριος sa tuwirang pagtawag at pinananatili ang paggalang at posibleng kristolohikal na bigat ng titulo.
- source_word: πότε σε εἴδομεν
  choice: kailan ka namin nakita
  rationale: Natural na ayos ng tuwirang tanong sa Filipino at tapat sa aorist na εἴδομεν.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: nagugutom at pinakain
  rationale: Ang mga anyong ito ay malinaw at idiomatiko, at pinananatili ang kalagayan at kasunod na konkretong pagtulong.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: nauuhaw at pinainom
  rationale: Ang “pinainom” ay maikli, natural, at tuwirang nagpapahayag ng pagbibigay ng inumin sa nauuhaw.
theological_decisions:
- issue: Pagtukoy sa κύριος sa tuwirang pakikipag-usap kay Jesus
  choice: Panginoon
  alternative: Guro / Amo
  rationale: Ang “Panginoon” ang nakaugaliang katumbas na nagpapanatili kapuwa ng magalang na pagtawag at ng teolohikal na pahiwatig ng salaysay, nang hindi ito higit na ipinapaliwanag.
- issue: Paglalarawan sa οἱ δίκαιοι
  choice: ang mga matuwid
  alternative: ang mga taong matuwid
  rationale: Pinananatili ng mas maikling anyo ang ambiguwidad kung ang pagiging matuwid ay paglalarawan, pagkilala, o hatol sa mga taong ito sa tagpo.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Iniwasan ang salitang-salitang “na sinasabi” pagkatapos ng “sasagot” upang maging natural ang tuwirang pananalita, habang pinananatili ang lahat ng pangunahing nilalaman ng Griyego.
