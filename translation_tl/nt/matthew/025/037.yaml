  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang sunod na pangyayari (τότε), ang sagot ng mga matuwid sa kanya, at ang magkatulad na pares na ‘nakitang nagugutom at pinakain’ / ‘nauuhaw at pinainom.’ Ang hindi tahasang pagsasalin ng λέγοντες bilang hiwalay na ‘na nagsasabi’ ay natural na Filipino at hindi nagbabawas ng nilalaman.'
  naturalness: Natural, malinaw, at marangal ang daloy sa makabagong Filipino Tagalog. Ang ‘sasagot sa kanya’ at ang kasunod na tuwirang tanong ay idiomatiko. Ang ‘pinainom’ ay isang maikli at likas na katumbas sa kontekstong ito.
