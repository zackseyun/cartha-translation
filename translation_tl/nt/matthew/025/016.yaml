id: MAT.25.16
reference: Matthew 25:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: tl
  text: Umalis ang tumanggap ng limang talento[a], ginamit ang mga iyon sa negosyo[b], at kumita ng lima pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento rito ay isang malaking yunit ng salapi, hindi likas na kakayahan.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “ipinangalakal ang mga iyon”; inilalarawan ng Griyego ang aktibong paggamit sa salapi upang tumubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: Umalis
  rationale: Ang aorist participle ay nagsasaad ng kilos na kasunod ng pagtanggap. Likas sa Tagalog ang finite verb na “umalis”; hindi idinagdag ang “kaagad,” sapagkat wala itong tuwirang katumbas sa Griyego.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ang tumanggap ng limang talento
  rationale: Pinananatili nito ang pagkakakilanlan sa tauhan ayon sa halagang tinanggap niya, nang hindi nagdaragdag ng katawagang wala sa parirala.
- source_word: τάλαντα
  choice: talento
  rationale: Pinananatili ang tradisyonal na terminong ginagamit sa talinghagang ito, habang nililinaw sa talababa na isa itong malaking yunit ng salapi at hindi likas na kakayahan.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: ginamit ang mga iyon sa negosyo
  rationale: Ipinahahayag nito ang aktibong paggamit sa salapi upang tumubo. Mas malinaw ito kaysa sa literal ngunit malabong “nagtrabaho sa pamamagitan ng mga iyon,” habang hindi nililimitahan ang kilos sa isang partikular na uri ng pangangalakal.
- source_word: ἐκέρδησεν
  choice: kumita
  rationale: Sa kontekstong pangkabuhayan, natural na ipinahahayag ng “kumita” ang pagkakaroon ng pakinabang o tubo.
- source_word: ἄλλα πέντε
  choice: lima pa
  rationale: Maikli at likas itong katumbas ng dagdag na limang talento.
theological_decisions:
- issue: Kung dapat tukuyin bilang partikular na pangangalakal ang paggamit sa salapi
  choice: ginamit ang mga iyon sa negosyo
  alternative: ipinangalakal ang mga iyon
  rationale: Ang ἐργάζομαι ἐν ay nagpapahiwatig ng aktibong paggamit para sa pakinabang ngunit hindi tahasang tumutukoy sa isang tiyak na transaksiyon. Pinananatili ng salin ang lawak ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga iyon” upang malinaw na tumukoy sa limang talento, at ang “lima pa” upang maiwasan ang hindi kailangang pag-uulit habang nananatiling malinaw ang dagdag na halaga.
