base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: tl
  text: Ngunit sumagot ang kanyang panginoon at sinabi sa kanya, “Masama at tamad na alipin, alam mo pala na umaani ako kung saan hindi ako naghasik at nagtitipon kung saan hindi ako nagkalat ng binhi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Maaari ring basahin bilang pahayag: “Alam mong umaani ako kung saan hindi ako naghasik at nagtitipon kung saan hindi ako nagkalat ng binhi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ngunit sumagot
  rationale: Likas na salaysay sa Filipino na pinananatili ang banayad na pagsalungat ng δέ at ang diwa ng ἀποκριθείς.
- source_word: ὁ κύριος αὐτοῦ
  choice: ang kanyang panginoon
  rationale: Sa konteksto ng talinghaga, tumutukoy ito sa taong may kapangyarihan sa alipin. Ang maliit na titik ay umiiwas na awtomatikong gawin itong tahasang titulong kristolohikal.
- source_word: Πονηρὲ
  choice: Masama
  rationale: Malinaw at kasalukuyang salitang Filipino para sa moral na paghatol na ipinahihiwatig ng πονηρός.
- source_word: δοῦλε
  choice: alipin
  rationale: Ang δοῦλος ay tumutukoy rito sa isang taong nasa ilalim ng kapangyarihan ng panginoon; mas tuwirang inilalarawan ng “alipin” ang ugnayang panlipunan kaysa “lingkod.”
- source_word: ὀκνηρέ
  choice: tamad
  rationale: Karaniwan at malinaw na katumbas ng pag-aatubili o kawalang-sigasig na ipinahihiwatig ng ὀκνηρός.
- source_word: ᾔδεις ὅτι
  choice: Alam mo palang
  rationale: Ipinapahayag ang sinasabing kaalaman ng alipin, habang ang “pala” at tandang pananong ay nagbibigay ng ironiko o retorikal na diin nang hindi ginagawang payak na tanong na “Alam mo ba?”
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: umaani ako sa hindi ko hinasikan
  rationale: Pinananatili ang malinaw na paghahambing ng pag-aani at paghahasik sa natural na Filipino.
- source_word: καὶ συνάγω ὅθεν οὐ διεσκόρπισα
  choice: at nagtitipon mula sa hindi ko ikinalat
  rationale: Tapat sa συνάγω at sa literal na “ikalat” ng διασκορπίζω, nang hindi nagdaragdag ng tahasang bagay gaya ng “binhi,” na wala sa Griyego.
theological_decisions:
- issue: Puwersa at bantas ng huling pangungusap
  choice: 'Retorikal na tanong: “Alam mo palang …?”'
  alternative: 'Pahayag: “Alam mong umaani ako ….”'
  rationale: Walang tandang pananong ang sinaunang tekstong Griyego, kaya maaari itong unawain bilang ironikong tanong na ibinabalik ang katuwiran ng alipin laban sa kanya, o bilang tuwirang pahayag. Pinanatili sa talababa ang tunay na kalabuan.
- issue: Pagkatao ng panginoon sa loob ng talinghaga
  choice: “panginoon” na may maliit na titik
  alternative: “Panginoon” bilang tahasang titulong kristolohikal
  rationale: Sa antas ng salaysay, inilalarawan ng κύριος ang panginoon ng alipin. Hindi dapat lutasin ng salin lamang ang mas malawak na teolohikal na pagkakakilanlan ng tauhan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “alipin” upang tahasang katawanin ang δοῦλος, at “panginoon” sa maliit na titik dahil ugnayan ng panginoon at alipin ang agarang konteksto. Ang bahagyang di-karaniwang “mula sa hindi ko ikinalat” ay nagpapanatili sa elipsis ng Griyego at umiiwas sa pagdaragdag ng “binhi.”
