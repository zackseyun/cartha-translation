    issue: Ang ‘yamang’ para sa ἐφ’ ὅσον
    rationale: Pangunahing nagsasaad ang ‘yamang’ ng dahilan, samantalang ang Griyego ay nagsasaad ng lawak o kondisyon (‘hangga’t’/‘sa lawak na’).
  - severity: medium
    issue: Ang ayos na ‘isa sa pinakamaliit sa mga ito’
    rationale: Maaaring maging hindi malinaw kung ang ‘mga ito’ ba ang tinutukoy na pinakamaliit. Ang ‘isa sa mga pinakamaliit na ito’ ay malinaw na pinananatili ang isahan, ang pasukdol, at ang deiktikong ‘ito.’
