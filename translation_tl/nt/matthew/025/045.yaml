  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: tl
  text: Pagkatapos ay sasagot siya sa kanila, “Katotohanang sinasabi ko sa inyo[a], hangga’t hindi ninyo ginawa ito para sa isa sa mga pinakamaliit na ito[b], hindi rin ninyo ito ginawa para sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na anyo, “Amen, sinasabi ko sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga pinakamaliit na ito” ay maaaring unawain bilang natatanging pagtukoy sa mga alagad ni Jesus o, sa mas malawak na diwa, sa mga aba at nangangailangan. Hindi nilulutas ng salin ang tanong na ito.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinahihiwatig ang kasunod na pangyayari sa tagpo ng paghatol; natural ito sa makabagong Tagalog.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: sasagot siya sa kanila
  rationale: Malinaw na naipapahayag ang sagot at ang mga kinausap; hindi na kailangang isalin nang hiwalay ang participle na λέγων dahil magiging paulit-ulit at di-likas sa Tagalog.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Pinananatili ang taimtim at mariing pormula ni Jesus sa malinaw na makabagong Tagalog; inilalagay sa talababa ang mas pormal na anyong gumagamit ng “Amen.”
- source_word: ἐφ’ ὅσον
  choice: yamang
  rationale: Sa kontekstong ito, likas na iniuugnay ng “yamang” ang hindi nila ginawa sa konklusyong hindi rin nila iyon ginawa kay Jesus. Bahagyang hindi nito naipapakita ang literal na diwa ng sukat o lawak, ngunit iniiwasan ang pilit at malabong Tagalog.
- source_word: οὐκ ἐποιήσατε
  choice: hindi ninyo ito ginawa
  rationale: Ang “ito” ay likas na tumutukoy sa mga gawaing binanggit sa naunang konteksto.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: para sa isa sa pinakamaliit sa mga ito
  rationale: Pinananatili ang isahang “isa,” ang pasukdol na “pinakamaliit,” at ang hindi tiyak na tinutukoy ng “mga ito.” Ang “para sa” ay natural para sa paggawa ng kabutihan sa isang tao.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: hindi rin ninyo ito ginawa para sa akin
  rationale: Pinananatili ang negatibong pagkakatulad at ang mariing pag-uugnay ni Jesus sa sarili niya at sa “pinakamaliit.”
theological_decisions:
- issue: Kung sino ang tinutukoy ng “pinakamaliit sa mga ito”
  choice: Hindi tinukoy sa salin kung sino ang saklaw ng grupo; pinanatili ang mismong pananalita ng teksto.
  alternative: Maaaring tukuyin nito nang natatangi ang mga alagad o sugo ni Jesus, o mas malawak ang mga aba at nangangailangan.
  rationale: Tuwirang iniuugnay ng talata kay Jesus ang ginawa o hindi ginawa sa grupong ito, ngunit hindi nito lamang nilulutas ang tanong kung sino ang buong saklaw ng grupo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang sobrang literal na ayos na magiging pilit, habang pinanatili ang solemneng tono, pag-uulit, at interpretatibong kalabuan ng talata.
