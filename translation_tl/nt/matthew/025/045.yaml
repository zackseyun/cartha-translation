revisions:
- from: Pagkatapos ay sasagot siya sa kanila, “Katotohanang sinasabi ko sa inyo[a], yamang hindi ninyo ito ginawa para sa isa sa pinakamaliit sa mga ito[b], hindi rin ninyo ito ginawa para sa akin.”
  to: Pagkatapos ay sasagot siya sa kanila, “Katotohanang sinasabi ko sa inyo[a], hangga’t hindi ninyo ginawa ito para sa isa sa mga pinakamaliit na ito[b], hindi rin ninyo ito ginawa para sa akin.”
  rationale: Pinalitan ang pang-ugnay upang maipakita ang saklaw/kondisyong ipinahihiwatig ng ἐφ’ ὅσον, at inayos ang pariralang tumutukoy sa ‘pinakamaliit’ upang maging malinaw at tapat sa estruktura ng Griyego. Pinanatili ang pag-uulit, solemneng rehistro, mga panandang talababa, at interpretatibong kalabuan ng talata.
