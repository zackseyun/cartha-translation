  verdict: revise
  source_fidelity: Ang salin ay wastong naghahatid ng hinaharap na pagsagot, ang taimtim na pormulang Ἀμὴν λέγω ὑμῖν, ang pag-uulit ng negatibong pahayag, at ang tuwirang pag-uugnay ng ginawa sa ‘pinakamaliit’ kay Jesus. Gayunman, ang ‘isa sa pinakamaliit sa mga ito’ ay maaaring mangahulugang isa mula sa isang pangkat na binubuo ng ‘pinakamaliit,’ sa halip na ang mas tiyak na ‘isa sa mga pinakamaliit na ito,’ na mas malinaw na tumutugma sa ἑνὶ τούτων τῶν ἐλαχίστων. Ang ‘yamang’ ay mas sanhi kaysa lawak/kondisyon; ‘hangga’t’ ay mas malapit sa ἐφ’ ὅσον nang nananatiling likas.
  naturalness: Marangal at madaling basahin ang Tagalog. Mas natural at mas malinaw sa kasalukuyang gamit ang ‘isa sa mga pinakamaliit na ito.’ Ang ‘Hangga’t hindi ninyo ginawa ito...’ ay nagpapanatili rin ng maigting na lohika ng pananalita.
  terminology: Ang ‘Katotohanang sinasabi ko sa inyo’ ay angkop para sa Ἀμὴν λέγω ὑμῖν. Ang ‘mga pinakamaliit na ito’ ay pinananatiling bukas ang pinagtatalunang saklaw ng parirala at hindi nagpapasok ng interpretasyong pangdoktrina.
  issues:
