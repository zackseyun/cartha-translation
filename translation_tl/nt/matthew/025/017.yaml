translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “talento” mula sa agarang konteksto upang maiwasan ang kalabuan ng hubad na “dalawa,” habang hindi ipinapakahulugan dito ang salita bilang likas na kakayahan.
