lexical_decisions:
- source_word: ὡσαύτως
  choice: Gayon din
  rationale: Likas na panandang naghahambing sa ginawa ng aliping ito sa ginawa ng naunang alipin sa talata 16.
- source_word: ὁ τὰ δύο
  choice: ang may dalawang talento
  rationale: Pinananatili ang maikling eliptikong anyo ng Griyego habang nililinaw mula sa konteksto na mga talento ang tinutukoy.
- source_word: ἐκέρδησεν
  choice: kumita
  rationale: Ang pandiwa ay tumutukoy sa pagkakaroon ng karagdagang salapi sa pamamagitan ng matagumpay na paggamit nito; natural ang “kumita” sa kontekstong pinansiyal.
- source_word: ἄλλα δύο
  choice: pa ng dalawa
  rationale: Malinaw at natural nitong ipinahahayag na nakakuha siya ng karagdagang dalawa na kapareho ng naunang tinutukoy.
