  text: Likewise[a], the one with the two gained two more.
translation:
  language: tl
  text: Gayon din, ang may dalawang talento ay kumita pa ng dalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa gayunding paraan, ang tumanggap ng dalawang talento ay kumita pa ng dalawa.”
