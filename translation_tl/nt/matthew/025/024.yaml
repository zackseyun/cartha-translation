  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: tl
  text: Pagkatapos, lumapit din ang tumanggap ng isang talento at nagsabi, “Panginoon, alam kong mahigpit kang tao[a], umaani ka kung saan hindi ka naghasik at nagtitipon ka kung saan hindi ka nagsabog.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mabagsik” o “matigas.” Ang salitang Griyego ay maaaring tumukoy sa pagiging mahigpit, matigas, o mabagsik.
    reason: lexical_alternative
  - marker: b
    text: Literal, “nagtitipon mula sa kung saan hindi mo ikinalat.” Walang tahasang layon ang pandiwa sa Griyego; ang “kung saan hindi ka nagsabog” ay idiomatikong Tagalog na pinananatili ang elipsis.
    reason: source_ambiguity
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: Pagkatapos, lumapit din
  rationale: Ipinakikita ng δέ ang pagsulong ng salaysay, ng καί ang pagdaragdag sa lingkod na ito, at ng προσελθών ang paglapit niya bago magsalita.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ang tumanggap ng isang talento
  rationale: Tinutukoy ng pariralang may participle ang lingkod ayon sa natanggap niya. Likas sa Tagalog ang payak na “tumanggap”; malinaw na sa konteksto na nauna na ang pagtanggap.
- source_word: τάλαντον
  choice: talento
  rationale: Pinananatili ang sinaunang yunit ng salapi sa halip na tukuyin nang labis ang anyo o halaga nito.
- source_word: Κύριε
  choice: Panginoon
  rationale: Ang κύριε ay magalang na tuwirang tawag sa amo ng talinghaga; pinananatili ng “Panginoon” ang karaniwang salin at ang posibleng mas malawak na alingawngaw nito.
- source_word: ἔγνων σε ὅτι
  choice: alam kong
  rationale: Sa konstruksiyong ito, likas na ipinahahayag sa Tagalog ang inaangking pagkakilala sa ugali ng kausap bilang “alam kong…,” nang hindi pinipilit ang di-likas na tahasang panghalip na layon.
- source_word: σκληρὸς ἄνθρωπος
  choice: mabagsik na tao
  rationale: Maaaring mangahulugan ang σκληρός ng matigas, mahigpit, o mabagsik. Sa paglalarawan sa asal ng isang tao, natural ang “mabagsik” at hindi nito pinapahina ang paratang ng lingkod.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: umaani ka sa hindi mo hinasikan
  rationale: Pinananatili ang magkaugnay na larawang agrikultural ng pag-aani at paghahasik.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: nagtitipon mula sa hindi mo ikinalat
  rationale: Pinananatili ang “mula sa” na puwersa ng ὅθεν at hindi nagdaragdag ng tahasang layon na wala sa Griyego, kahit nananatiling bahagyang bukás ang larawan.
theological_decisions:
- issue: Pagtawag na κύριε sa amo sa talinghaga
  choice: Panginoon
  alternative: Amo
  rationale: Ang “Panginoon” ay wastong magalang na tawag at nagpapanatili ng leksikal at teolohikal na posibilidad ng κύριος nang hindi ipinipilit na ang tauhan ay tahasang kinikilala bilang Diyos sa mismong pangungusap.
- issue: Paratang ng lingkod tungkol sa ugali ng panginoon
  choice: Inilahad bilang sinabi at pananaw ng lingkod, gamit ang “mabagsik,” nang hindi ito pinagtitibay o pinahihina ng tagapagsalaysay.
  alternative: “mahigpit” o “matigas”
  rationale: Ang teksto ay nag-uulat ng paratang ng lingkod. Dapat manatili ang tensiyon kung tama ba ang kaniyang pagkakilala sa panginoon.
- issue: Hindi tahasang layon ng διεσκόρπισας
  choice: Hindi dinagdagan ng “binhi” sa pangunahing teksto.
  alternative: “kung saan hindi ka nagsabog ng binhi”
  rationale: Hindi nakasaad ang layon sa Griyego. Ang pagdaragdag ng “binhi” ay posibleng paglilinaw, ngunit isinasara nito ang tunay na elipsis ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “talento” bilang makasaysayang yunit ng salapi. Ang “hinasikan” ay likas na salin ng paghahasik sa isang lugar, at pinanatili ang bahagyang elipsis sa huling sugnay upang hindi magdagdag sa pinagmulan.
