id: MAT.25.29
reference: Matthew 25:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: tl
  text: Sapagkat ang sinumang mayroon ay bibigyan, at mananagana siya[a]; ngunit ang sinumang wala, kahit ang anumang mayroon siya ay kukunin sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magkakaroon siya ng kasaganaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Sapagkat ang sinumang mayroon
  rationale: Ipinapakita ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag. Ang “sinumang mayroon” ay likas na Filipino at pinananatili ang panlahat ngunit pang-isahang diwa ng articular participle na may παντί, nang hindi tinutukoy kung ano ang mayroon.
- source_word: δοθήσεται
  choice: ay bibigyan pa
  rationale: Pinananatili ng “bibigyan” ang balintiyak na anyo. Ang “pa” ay likas na nagpapahayag ng karagdagang pagbibigay na ipinahihiwatig ng konteksto at ng kasunod na περισσευθήσεται.
- source_word: καὶ περισσευθήσεται
  choice: at mananagana siya
  rationale: Ang “mananagana” ay maikli, dignificado, at likas na katumbas ng pagdating sa kalagayang may kasaganaan o higit sa sapat.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: ngunit ang sinumang wala
  rationale: Pinananatili ng “ngunit” ang matinding pagsalungat ng δέ. Ang “sinumang wala” ay pang-isahan at panlahat, at hindi nagdaragdag ng tahasang layon na wala rin sa Griyego.
- source_word: καὶ ὃ ἔχει
  choice: kahit ang mayroon siya
  rationale: Ang “kahit” ay naghahatid ng ascensive na gamit ng καί at pinatitingkad ang kabalintunaan ng pahayag.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ay kukunin sa kaniya
  rationale: Likas na ipinapahayag nito ang hinaharap na balintiyak at ang paghihiwalay na tinutukoy ng ἀπό.
theological_decisions:
- issue: Panlahat na pagtukoy sa pang-isahang mga participle
  choice: Gamitin ang “sinumang ... siya/kaniya”
  alternative: Gamitin ang maramihang “mga taong ... sila/kanila”
  rationale: Pinananatili ng pang-isahang “sinuman” at ng mga panghalip na “siya/kaniya” ang pang-isahang kinatawang balangkas ng Griyego habang nananatiling pangkalahatan at likas sa modernong Filipino.
- issue: Hindi tahasang layon ng “mayroon/wala”
  choice: Iwang hindi tinutukoy kung ano ang mayroon o wala
  alternative: Idagdag ang “mga kaloob,” “salapi,” o “pananampalataya”
  rationale: Walang tahasang layon sa talata. Ang hindi pagdaragdag nito ay nagpapanatili sa lawak at tensiyong likas sa kasabihan at umiiwas sa isang makitid na teolohikal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mananagana” bilang maikli at natural na pandiwa; pinanatili ang balintiyak na “bibigyan” at “kukunin,” gayundin ang pang-isahang panlahat na estruktura ng kasabihan.
