  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: tl
  text: At kailan ka namin nakitang may sakit o nasa bilangguan, at pinuntahan ka namin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dinalaw ka namin.” Mas literal sa Griyego, “pumunta kami sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kailan
  rationale: Likas na pananong sa Tagalog tungkol sa panahon ng isang pangyayari.
- source_word: δέ
  choice: at
  rationale: Mahinang pang-ugnay ito sa sunod-sunod na mga tanong; ang “at” ang natural na katumbas nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: εἴδομεν
  choice: nakita namin
  rationale: Pinananatili ang nakaraang kilos ng aorist sa natural na anyong pananong sa Tagalog.
- source_word: ἀσθενοῦντα
  choice: may sakit
  rationale: Sa konteksto, tumutukoy ito sa pisikal na karamdaman; malinaw at karaniwan ang “may sakit” sa modernong Tagalog.
- source_word: ἐν φυλακῇ
  choice: nasa bilangguan
  rationale: Tumutukoy ang φυλακή sa lugar ng pagkakakulong; dignificado at malawak ang “bilangguan” kumpara sa mas kolokyal na “kulungan.”
- source_word: ἤλθομεν πρός σε
  choice: pinuntahan ka namin
  rationale: Natural nitong ipinapahayag sa Tagalog ang literal na paglapit o pagpunta sa isang tao, nang hindi tahasang nililimitahan ang kahulugan sa isang pormal na pagdalaw.
theological_decisions:
- issue: Kung isasalin ang ἤλθομεν πρός σε bilang “dinalaw ka namin” o mas malapit sa literal na “pinuntahan ka namin”
  choice: pinuntahan ka namin
  alternative: dinalaw ka namin
  rationale: Karaniwang kilos ng pagpunta sa isang tao ang mismong salitang Griyego, hindi isang tiyak na pandiwang nangangahulugang “dumalaw.” Pinananatili ng pangunahing teksto ang lawak nito, habang inilalagay sa talababa ang idiomatikong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at dignificado. Ginamit ang “bilangguan” para sa pormal ngunit madaling maunawaang rehistro, at “pinuntahan” upang mapanatili ang payak at malawak na diwa ng Griyego.
