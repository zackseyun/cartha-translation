  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: tl
  text: Sapagkat nagutom ako at binigyan ninyo ako ng makakain; nauhaw ako at binigyan ninyo ako ng maiinom; ako ay isang estranghero at pinatuloy ninyo ako[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinanggap ninyo ako.” Ang pandiwang Griego ay literal na nangangahulugang “tinipon” o “pinagsama,” ngunit sa kontekstong ito ay tumutukoy sa magiliw na pagtanggap sa isang estranghero.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: nagutom ako
  rationale: Likas na modernong Tagalog para sa nakaraang karanasan ng gutom; hindi kailangang gawing mas mabigat na “ako ay nagdanas ng gutom.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnay ng naunang pahayag at angkop sa marangal ngunit madaling maunawaang rehistro.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: binigyan ninyo ako ng makakain
  rationale: Natural na katumbas ng δίδωμι kasama ang datibo at infinitive, at pinananatili ang di-tiyak na bagay na ibinigay upang kainin.
- source_word: ἐδίψησα
  choice: nauhaw ako
  rationale: Karaniwang modernong Tagalog para sa nakaraang karanasan ng uhaw.
- source_word: ἐποτίσατέ με
  choice: binigyan ninyo ako ng maiinom
  rationale: Malinaw na ipinahahayag ang pagbibigay ng inumin at pinananatili ang paralelismo sa “binigyan ninyo ako ng makakain,” nang hindi ipinapalagay na tubig lamang iyon.
- source_word: ξένος
  choice: estranghero
  rationale: Saklaw nito ang taong hindi kakilala o walang kinikilalang lugar sa pangkat; iniiwasang paliitin ang kahulugan sa legal o etnikong kategoryang “dayuhan.”
- source_word: συνηγάγετέ με
  choice: pinatuloy ninyo ako
  rationale: Sa konteksto ng ξένος, ipinahihiwatig ng συνάγω ang magiliw na pagtanggap at pagkupkop sa isang estranghero. Likas sa Tagalog ang “pinatuloy” para sa ganitong pagkamapagpatuloy, habang inilalahad sa talababa ang mas malawak na alternatibo.
theological_decisions:
- issue: Pagkamapagpatuloy sa pariralang ξένος … συνηγάγετέ με
  choice: “naging estranghero ako at pinatuloy ninyo ako”
  alternative: “naging estranghero ako at tinanggap ninyo ako”
  rationale: Binibigyang-diin ng konteksto ang personal at praktikal na pagtanggap sa nangangailangan. Hindi nito nililimitahan ang estranghero sa isang makabagong legal o politikal na kategorya, at hindi rin nito tinutukoy nang higit sa teksto ang eksaktong anyo o tagal ng pagpapatuloy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tatlong magkakatulad na sugnay at ang paliwanag na pang-ugnay na γάρ. Inilagay ang talababa sa sugnay na talagang tinutukoy nito, pagkatapos ng “pinatuloy ninyo ako.”
