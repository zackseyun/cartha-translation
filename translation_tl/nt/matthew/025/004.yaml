  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: tl
  text: Ngunit ang matatalino ay nagdala ng langis sa kanilang mga sisidlan kasama ng kanilang mga ilawan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga sulo” sa halip na “mga ilawan” (Griyego: lampadas); maaaring tumukoy ang salita sa sulo o ilawan depende sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: matatalino
  rationale: Ipinahahayag ang praktikal na karunungan at pinananatili ang tuwirang kaibahan sa mga hangal sa nakapaligid na salaysay, nang hindi ito nililimitahan sa pagiging handa lamang.
- source_word: ἔλαβον
  choice: nagdala
  rationale: Sa kontekstong pasalaysay, ang pandiwa ay tumutukoy sa pagkuha at pagdadala nila ng langis; mas natural sa Tagalog ang “nagdala” kaysa literal na “kumuha.”
- source_word: ἔλαιον
  choice: langis
  rationale: Sapat na katumbas ito ng pangkalahatang katawagan sa langis; hindi idinaragdag ang “olibo,” na hindi tahasang tinukoy.
- source_word: ἀγγείοις
  choice: mga sisidlan
  rationale: Pinananatili ang pangkalahatang diwa ng lalagyan nang hindi nagpapalagay ng tiyak na hugis o materyal.
- source_word: λαμπάδων
  choice: mga ilawan
  rationale: Likas at tradisyonal itong salin sa konteksto ng talinghaga, ngunit maaari ring tumukoy ang salitang Griyego sa mga sulo kaya inilagay ang alternatibo sa talababa.
- source_word: ἑαυτῶν
  choice: kanilang
  rationale: Natural na ipinahahayag sa Tagalog ang pag-aari; hindi kailangang idagdag ang “sarili” sa pangunahing teksto.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: kasama ng kanilang mga ilawan
  rationale: Malinaw na ipinakikita na ang langis sa mga sisidlan ay dinala kasabay ng mga ilawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sisidlan” upang mapanatili ang pangkalahatang kahulugan ng ἀγγεῖον, at pinanatili sa talababa ang tunay na leksikal na alternatibo para sa λαμπάς.
