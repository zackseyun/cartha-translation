revisions:
- from: Binigyan niya ang isa ng limang talento[a], ang isa naman ng dalawa, at ang isa pa ng isa—ang bawat isa ayon sa sarili nitong kakayahan.[b] Pagkatapos ay agad siyang umalis.[c]
  to: Binigyan niya ang isa ng limang talento[a], ang isa naman ng dalawa, at ang isa pa ng isa, bawat isa ayon sa sariling kakayahan ng bawat isa[b]; at siya'y umalis. Agad[c]...
  rationale: Inalis ang di-singaw na “Pagkatapos ay,” pinanatili ang simpleng pang-ugnay na “at,” at ginawang malinaw ang distributibong parirala. Ang εὐθέως ay isinaling “Agad” sa posisyong ipinakikita ng ibinigay na Griyegong teksto. Dahil napuputol ang yunit ng pangungusap sa hangganan ng talata, ginagamit ang ellipsis upang ipakitang nagpapatuloy ang pang-abay sa susunod na talata; ipinapaliwanag ng talababa ang tunay na sintaktikong posibilidad nang hindi ipinipilit ang isang pagbasa.
