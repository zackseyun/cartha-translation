  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: tl
  text: Binigyan niya ang isa ng limang talento[a], ang isa naman ng dalawa, at ang isa pa ng isa, bawat isa ayon sa sariling kakayahan ng bawat isa[b]; at siya'y umalis. Agad[c]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “talento” ay isang napakalaking sinaunang yunit ng timbang at, sa kontekstong ito, ng halaga ng salapi; hindi ito tumutukoy sa likas na husay o kakayahan.
    reason: lexical_clarification
  - marker: b
    text: O “ayon sa kakayahan ng bawat isa.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, ang “Agad” ay nagsisimula sa kasunod na pangungusap at malamang na tumutukoy sa agarang pagkilos ng tumanggap ng limang talento sa susunod na talata. Maaari rin itong iugnay sa pag-alis ng panginoon.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: talento
  rationale: Pinananatili ang makasaysayang tawag sa napakalaking yunit ng timbang o salapi. Nililinaw sa talababa na hindi ito tumutukoy sa likas na husay, na siyang karaniwang kahulugan ng “talento” sa modernong Filipino.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: ang isa ... ang isa naman ... at ang isa pa
  rationale: Natural na Filipino ang ganitong sunuran at malinaw nitong naipapakita ang paghahati-hati sa tatlong lingkod.
- source_word: ἕν
  choice: isa
  rationale: Nauunawaan mula sa naunang pagbanggit na isang talento ang tinutukoy; hindi na kailangang ulitin ang pangngalan.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: ang bawat isa ayon sa sarili nitong kakayahan
  rationale: 'Pinananatili ang isahang distributibong diwa: ang halagang ipinagkatiwala sa bawat lingkod ay tugma sa sariling kakayahan niya. Ang δύναμις dito ay kapasidad o kakayahan, hindi makahimalang kapangyarihan.'
- source_word: ἀπεδήμησεν
  choice: umalis
  rationale: Tumpak at natural na salin para sa paglayo ng panginoon, habang ang posibilidad na paglalakbay sa malayo ang tinutukoy ay inilalagay sa talababa.
- source_word: εὐθέως
  choice: agad
  rationale: Isinasama sa pangunahing teksto sa pag-alis, ayon sa ibinigay na saklaw ng talata, ngunit kinikilala sa talababa na maaari rin itong iugnay sa kilos ng tumanggap ng limang talento sa kasunod na pangungusap.
theological_decisions:
- issue: Kahulugan ng τάλαντα sa talinghaga
  choice: mga yunit ng salapi o timbang, hindi likas na kakayahan
  alternative: malalaking halaga ng salapi
  rationale: Ang konteksto ay ari-ariang ipinagkatiwala ng panginoon. Ang makabagong kahulugan ng “talento” bilang likas na husay ay hindi dapat ipalit sa literal na bagay na ibinigay sa salaysay.
- issue: Distributibong pariralang κατὰ τὴν ἰδίαν δύναμιν
  choice: ayon sa sarili nitong kakayahan
  alternative: ayon sa kakayahan ng bawat isa
  rationale: Kapuwa posible ang dalawang anyo. Pinili ang unang anyo upang mapanatili ang isahang anyo at ang diwa ng ἰδίαν, nang hindi ipinahihiwatig na ang mga talento mismo ay mga kakayahan.
- issue: Ugnayan ng εὐθέως
  choice: iniuugnay sa agarang pag-alis ng panginoon
  alternative: iniuugnay sa agarang pagkilos ng tumanggap ng limang talento sa kasunod na pangungusap
  rationale: Maaaring iugnay ang pang-abay sa naunang pandiwa o sa sumusunod na kilos. Sinusunod ng pangunahing teksto ang pagkakalakip nito sa ibinigay na talata at ang audited consultation layer, habang pinananatili sa talababa ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang “talento” para sa pamilyaridad sa talinghaga, ngunit nilinaw agad sa talababa ang makasaysayang kahulugan nito. Iniwasan ang “kani-kaniyang” upang hindi gawing tahasang maramihan ang isahang distributibong anyo ng Griyego.
