id: MAT.25.41
reference: Matthew 25:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: tl
  text: Pagkatapos, sasabihin din niya sa mga nasa kaliwa, “Lumayo kayo sa akin, kayong mga isinumpa,[a] tungo sa apoy na walang hanggan na inihanda para sa diyablo at sa mga anghel niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayong nasa ilalim ng sumpa”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Minamarkahan nito ang kasunod na pangyayari sa tagpo ng paghuhukom; natural ito sa makabagong Tagalog.
- source_word: ἐρεῖ
  choice: sasabihin niya
  rationale: Pinananatili ang payak na diwa ng hinaharap na pagsasalita nang hindi dinaragdagan ang puwersa nito.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: sa mga nasa kaliwa
  rationale: Malinaw at natural na tumutukoy sa pangkat na nakapuwesto sa kaliwa ng hari ayon sa konteksto.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Lumayo kayo sa akin
  rationale: Ipinahahayag ang utos na umalis at mawalay sa nagsasalita sa natural ngunit marangal na Tagalog.
- source_word: οἱ κατηραμένοι
  choice: kayong mga isinumpa
  rationale: Ipinapanatili ang pasibong diwa ng ganap na pandiwaring ginagamit bilang tuwirang pagtawag.
- source_word: εἰς τὸ πῦρ
  choice: tungo sa apoy
  rationale: Ipinapanatili ng “tungo sa” ang direksiyon patungo sa itinakdang hantungan.
- source_word: τὸ αἰώνιον
  choice: na walang hanggan
  rationale: Ito ang malinaw at karaniwang salin ng αἰώνιον sa kontekstong ito ng pangwakas na paghuhukom.
- source_word: τὸ ἡτοιμασμένον
  choice: na inihanda
  rationale: Ipinahahayag ang kalagayang bunga ng naunang paghahanda.
- source_word: τῷ διαβόλῳ
  choice: para sa diyablo
  rationale: Ang διάβολος dito ay kinikilalang personal na katawagan, hindi pangkalahatang paglalarawan lamang sa isang maninirang-puri.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: sa mga anghel niya
  rationale: Sa konteksto ng paghuhukom, tumutukoy ito sa mga espirituwal na nilalang na kapanig ng diyablo, hindi sa mga taong mensahero.
theological_decisions:
- issue: Kahulugan ng αἰώνιον sa konteksto ng paghuhukom
  choice: na walang hanggan
  alternative: pangmatagalan / ukol sa kapanahunan
  rationale: Ang “walang hanggan” ang karaniwan at pinakatuwirang kahulugan sa kontekstong ito at hindi nito pinapahina ang bigat ng pangwakas na paghuhukom.
- issue: Tinutukoy ng διάβολος at ἄγγελοι
  choice: ang diyablo at ang mga anghel niya
  alternative: ang maninirang-puri at ang mga mensahero niya
  rationale: Sa eskatolohikal na tagpong ito, ang parirala ay kinikilalang pagtukoy sa diyablo at sa mga espirituwal na nilalang na kapanig niya; magiging kulang ang pangkalahatang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding tuwirang pananalita at ang direksiyon mula sa nagsasalita patungo sa apoy, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
