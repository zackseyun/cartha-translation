  source_fidelity: Tumpak na naipapahayag ang pagkakasunod-sunod (τότε), ang panghinaharap na pagsasalita, ang pangkat sa kaliwa, ang utos na lumayo mula sa nagsasalita, ang pasibong pagtawag na “isinumpa,” at ang hantungang apoy na walang hanggan na inihanda para sa diyablo at sa kanyang mga anghel. Ang “tungo sa” ay sapat na naghahatid ng direksiyong εἰς nang hindi nagiging di-natural sa Tagalog.
  naturalness: Makabago, malinaw, at angkop ang marangal na rehistro. Ang “Lumayo kayo sa akin” ay tuwiran at natural para sa utos na Πορεύεσθε ἀπ’ ἐμοῦ. Ang “mga nasa kaliwa” ay maayos na idyoma sa agarang konteksto ng tagpo.
  terminology: Ang “walang hanggan,” “diyablo,” at “mga anghel niya” ay matatag, malinaw, at angkop sa kontekstong eskatolohikal. Hindi nito idinadagdag o nilulutas ang mga usaping doktrinal na lampas sa teksto. Ang talababa ay may wastong anchor at nagbibigay ng katanggap-tanggap na leksikal na alternatibo.
