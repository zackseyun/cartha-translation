  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang papuri (Εὖ), ang paglalarawang “mabuti at tapat,” ang katapatan sa kaunting ipinagkatiwala, ang pangakong italaga sa mas marami, at ang utos na pumasok sa kagalakan ng panginoon. Ang “pamamahalain kita” ay angkop na salin ng καταστήσω sa kontekstong pagtatalaga sa pananagutan.'
