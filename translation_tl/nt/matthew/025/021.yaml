id: MAT.25.21
reference: Matthew 25:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang panginoon, “Magaling! Mabuti at tapat na alipin![a] Naging tapat ka sa kaunting bagay; pamamahalain kita sa maraming bagay. Pumasok ka sa kagalakan ng iyong panginoon.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod.” Ang salitang Griyego na doulos ay karaniwang tumutukoy sa isang alipin, ngunit maaari ring isaling “lingkod” depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “panginoon” bilang “amo” sa ugnayan ng tauhan at ng kanyang alipin sa talinghaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: Sinabi sa kanya
  rationale: Natural at tuwirang salin ng panimulang pahayag sa salaysay.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: kanyang panginoon / iyong panginoon
  rationale: Sa Tagalog, likas na ipinahihiwatig ng “panginoon” ang may kapangyarihan sa alipin at pinananatili rin nito ang posibleng teolohikal na alingawngaw ng κύριος nang hindi iyon ginagawang tahasang titulo.
- source_word: Εὖ
  choice: Magaling!
  rationale: Karaniwang pahayag ng papuri sa makabagong Tagalog at angkop sa konteksto ng pagkilala sa mahusay na paglilingkod.
- source_word: δοῦλε
  choice: alipin
  rationale: Mas tuwirang inilalarawan ang legal at panlipunang katayuang ipinahihiwatig ng δοῦλος sa talinghaga; ang mas banayad na “lingkod” ay inilalagay bilang alternatibo sa talababa.
- source_word: ἀγαθὲ καὶ πιστέ / πιστός
  choice: mabuti at tapat / naging tapat
  rationale: Pinananatili ang pag-uulit ng πιστός at ang kaugnayan ng papuri sa napatunayang katapatan.
- source_word: ἐπὶ ὀλίγα
  choice: sa kaunting bagay
  rationale: Ipinahihiwatig ang saklaw ng ipinagkatiwalang pananagutan sa natural na Tagalog.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: pamamahalain kita sa maraming bagay
  rationale: Ipinapahayag ng καθίστημι ang pagtatalaga sa isang mas malawak na pananagutan; mas natural at tiyak ito kaysa sa literal na “ilalagay kita sa ibabaw.”
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Pumasok ka sa kagalakan
  rationale: Pinananatili ang metapora ng pagpasok na nasa Griyego sa halip na ipakahulugan lamang bilang pakikibahagi.
theological_decisions:
- issue: Ang κύριος sa loob ng talinghaga ay maaaring tumukoy sa amo sa antas ng kuwento at umalingawngaw bilang Panginoon sa teolohikal na antas.
  choice: panginoon
  alternative: amo
  rationale: Ang “panginoon” ay angkop sa ugnayan ng panginoon at alipin at pinananatili ang sadyang bukas na teolohikal na alingawngaw. Hindi ito ginawang malaking titik upang hindi sapilitang gawing tahasang banal na titulo ang tauhan sa mismong usapan.
- issue: Ang katayuang ipinahihiwatig ng δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Ang “alipin” ang mas tuwirang katumbas at malinaw na nagpapanatili sa hindi pantay na ugnayang panlipunan sa talinghaga. Dahil natural at matagal nang ginagamit ang “lingkod” sa saling biblikal, itinala ito bilang lehitimong alternatibo.
- issue: Ang “kagalakan ng iyong panginoon” ay maaaring tumukoy sa pagdiriwang ng panginoon o sa pakikibahagi sa kanyang kagalakan.
  choice: kagalakan ng iyong panginoon
  alternative: pakikibahagi sa kagalakan ng iyong panginoon
  rationale: Pinananatili ng literal ngunit natural na anyo ang ambiguwidad ng genitive at ang metapora ng εἴσελθε εἰς, sa halip na tahasang ipaliwanag ang paraan ng pakikibahagi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Magaling!” bilang likas na papuri, “pamamahalain” para sa pagtatalaga sa pananagutan, at “panginoon” upang mapanatili kapwa ang antas ng kuwento at ang posibleng teolohikal na alingawngaw.
