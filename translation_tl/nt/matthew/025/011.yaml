base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: tl
  text: Pagkaraan, dumating din ang iba pang mga dalaga[a] at nagsabi, “Panginoon, Panginoon,[b] pagbuksan mo kami!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang natitirang mga dalaga.”
    reason: lexical_alternative
  - marker: b
    text: 'O “Ginoo, Ginoo” o “Amo, Amo.” Sa Griyego: Kyrios, kyrios.'
    reason: alternative_reading
  - marker: c
    text: Sa Griyego, “pagbuksan mo kami” lamang; ipinahihiwatig ng konteksto ang pinto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Pagkaraan
  rationale: Temporal na pang-abay ito na nagpapakitang sumunod ang pangyayari; natural at malinaw sa makabagong Tagalog ang “Pagkaraan.”
- source_word: δὲ
  choice: —
  rationale: Banayad na pang-ugnay ang δέ. Sapat nang naipahihiwatig ng “Pagkaraan” ang paglipat sa susunod na pangyayari, kaya hindi na ito isinalin nang hiwalay.
- source_word: ἔρχονται
  choice: dumating
  rationale: Narrative present ang anyong Griyego. Sa natural na pagsasalaysay sa Tagalog, ang aspektong naganap na “dumating” ang malinaw na katumbas sa kontekstong ito.
- source_word: καὶ
  choice: din
  rationale: 'May dagdag na diwa ang καί: ang iba pang mga dalaga ay dumating gaya ng naunang pangkat. Likas itong ipinahahayag ng “din.”'
- source_word: αἱ λοιπαὶ παρθένοι
  choice: ang iba pang mga dalaga
  rationale: Ang λοιπαί ay maaaring mangahulugang iba pa o natitira, at ang παρθένοι sa konteksto ng talinghaga ay mga dalagang kasama sa kasalan. Natural ang “mga dalaga” sa Tagalog nang hindi nagdaragdag ng impormasyong wala sa parirala.
- source_word: λέγουσαι
  choice: at nagsabi
  rationale: Ipinakikilala ng participle ang tuwirang pananalita. Mas natural sa Tagalog na gawin itong kasunod na pandiwang “at nagsabi.”
- source_word: Κύριε κύριε
  choice: Panginoon, Panginoon
  rationale: Pinananatili nito ang pag-uulit na nagpapahayag ng matinding pakiusap at ang saklaw ng κύριος bilang magalang na tawag at titulong maaaring may teolohikal na bigat.
- source_word: ἄνοιξον ἡμῖν
  choice: pagbuksan mo kami
  rationale: Inihahayag ng “pagbuksan mo kami” ang utos at ang kapakinabangan o pagpasok na hinihingi, nang hindi tahasang idinaragdag ang “pinto,” na ipinahihiwatig lamang ng konteksto.
theological_decisions:
- issue: Paglalarawan sa κύριος sa tuwirang pagtawag
  choice: Panginoon
  alternative: Ginoo / Amo
  rationale: Maaaring maging magalang na tawag ang κύριος sa loob ng kuwento, ngunit maaari rin itong umalingawngaw bilang titulong may teolohikal na bigat sa Mateo. Pinananatili ng “Panginoon” ang dalawang posibilidad sa halip na limitahan ito sa panlipunang paggalang lamang.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “mga dalaga” bilang madaling maunawaang katawagan sa mga παρθένοι sa tagpo ng kasalan; pinanatili ang apurahang pag-uulit sa panawagan at hindi idinagdag sa pangunahing teksto ang salitang “pinto.”
