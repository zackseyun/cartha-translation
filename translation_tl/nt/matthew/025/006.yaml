id: MAT.25.6
reference: Matthew 25:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: tl
  text: 'Ngunit nang hatinggabi, isang sigaw ang umalingawngaw[a]: “Narito ang lalaking ikakasal![b] Lumabas kayo upang salubungin siya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “may sumigaw.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Tingnan ninyo, ang lalaking ikakasal!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Ngunit nang hatinggabi
  rationale: Ang μέσης νυκτός ay idyomatikong tumutukoy sa oras na hatinggabi. Isinasalin ng “Ngunit” ang δέ bilang banayad na paglipat na may bahagyang pagsalungat sa naunang pangyayari.
- source_word: κραυγὴ γέγονεν
  choice: isang sigaw ang umalingawngaw
  rationale: Ipinahahayag ng parirala ang biglaang paglitaw ng isang malakas na sigaw. Natural sa makabagong Tagalog ang “umalingawngaw” at hindi ito nagdaragdag ng tiyak na taong sumigaw.
- source_word: Ἰδού
  choice: Narito
  rationale: Ang ἰδού ay panawag-pansin na itinuturo ang biglang pagdating o paglitaw ng isang tao. Ang “Narito” ay natural at marangal nang hindi gumagamit ng makalumang pananalita.
- source_word: ὁ νυμφίος
  choice: ang lalaking ikakasal
  rationale: Tiyak na tumutukoy ang νυμφίος sa lalaking ikakasal sa tagpo ng isang kasalan. Mas malinaw ito kaysa “kasintahang lalaki,” na maaaring mangahulugang nobyo lamang.
- source_word: ἐξέρχεσθε
  choice: Lumabas kayo
  rationale: Maramihang pautos ang pandiwa. Ang “Lumabas kayo” ay tuwiran at natural na panawagan sa mga nakikinig.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: upang salubungin siya
  rationale: Ang εἰς ἀπάντησιν ay idyomang nangangahulugang lumabas upang makatagpo at sumalubong sa dumarating na tao; mahusay itong ipinahahayag ng “salubungin.”
theological_decisions:
- issue: Ang tinutukoy ng νυμφίος sa talinghaga
  choice: Isinaling “ang lalaking ikakasal” nang walang malaking titik o tahasang pagkilala kay Jesus.
  alternative: “ang Lalaking Ikakasal” o tahasang “si Jesus”
  rationale: Bagaman kumakatawan kay Jesus ang lalaking ikakasal sa mas malawak na konteksto ng talinghaga, inilalahad siya ng talatang ito bilang tauhan sa kuwento. Pinananatili ng salin ang antas ng talinghaga at hindi isinasama sa teksto ang pagpapakahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “lalaking ikakasal” para sa malinaw na larawang pangkasal at ang “salubungin” para sa kilos ng paglabas upang harapin ang dumarating.
