id: MAT.25.22
reference: Matthew 25:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: tl
  text: Lumapit din ang tumanggap ng dalawang talento at sinabi, “Panginoon[a], ipinagkatiwala mo sa akin ang dalawang talento[b]. Tingnan mo, kumita ako ng dalawa pang talento.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Amo.” Ang salitang Griego na kyrios ay karaniwang isinasaling “Panginoon,” ngunit sa talinghagang ito maaari rin itong maging magalang na tawag sa isang amo.
    reason: alternative_reading
  - marker: b
    text: Ang talento ay isang malaking yunit ng timbang at halaga ng salapi, hindi likas na kakayahan.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: Lumapit din
  rationale: Ipinahihiwatig ng aorist participle ang paglapit niya upang magsalita, samantalang ipinagpapatuloy ng δὲ καὶ ang pagkakasunod-sunod at ipinapakitang kasama rin siya sa mga nag-ulat.
- source_word: ὁ τὰ δύο τάλαντα
  choice: ang tumanggap ng dalawang talento
  rationale: Substantival ang parirala at tinutukoy ang alipin ayon sa halagang ibinigay sa kanya; malinaw at likas sa Tagalog ang paglalagay ng “tumanggap” mula sa konteksto.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang katumbas ng κύριος ang “Panginoon.” Sa tagpo ng talinghaga, maaari rin itong maging magalang na tawag sa isang amo, kaya pinanatili sa talababa ang alternatibo.
- source_word: παρέδωκας
  choice: ipinagkatiwala mo
  rationale: Bagaman literal na “ibinigay” o “iniabot,” malinaw sa konteksto na ang salapi ay ipinamahala sa alipin. Ang “ipinagkatiwala” ay natural at tumpak sa relasyong inilalarawan.
- source_word: μοι
  choice: sa akin
  rationale: Tuwirang ipinapahayag ang di-tuwirang layon ng pandiwa.
- source_word: ἴδε
  choice: Tingnan mo
  rationale: Pinananatili nito ang deiktikong diin ng utos na ituon ang pansin sa naging bunga, sa natural na modernong Tagalog.
- source_word: ἄλλα δύο τάλαντα
  choice: dalawa pa
  rationale: Likas na Tagalog ito para sa karagdagang kapantay na bilang; hindi na kailangang ulitin ang “talento” dahil malinaw ang tinutukoy.
- source_word: ἐκέρδησα
  choice: kumita ako
  rationale: Sa konteksto ng salapi, natural na ipinahahayag ng “kumita” ang kahulugan ng κερδαίνω na magkaroon ng pakinabang o tubo.
- source_word: τάλαντα
  choice: talento
  rationale: Pinananatili ang tradisyonal na katawagan sa malaking yunit ng timbang o halaga, habang nililinaw sa talababa na hindi ito likas na kakayahan.
theological_decisions:
- issue: Pagsasalin ng κύριος bilang tawag sa loob ng talinghaga
  choice: Panginoon
  alternative: Amo
  rationale: Pinananatili ng “Panginoon” ang karaniwang salin ng κύριος at ang posibleng mas malawak na pahiwatig nito, ngunit hindi itinatanggi na maaari itong gumana rito bilang magalang na tawag sa amo; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “Lumapit din” para sa maayos na daloy ng salaysay at “Tingnan mo” upang mapanatili ang tuwirang diin ng ἴδε. Parehong nakalagay sa pangunahing teksto ang mga marker na [a] at [b].
