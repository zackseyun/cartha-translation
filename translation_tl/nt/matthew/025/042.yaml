  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: tl
  text: Sapagkat nagutom ako, at hindi ninyo ako binigyan ng makakain; nauhaw ako, at hindi ninyo ako binigyan ng maiinom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείνασα
  choice: nagutom ako
  rationale: Likas na modernong Tagalog para sa nakaraang kalagayan ng pagkagutom; pinananatili ang unang panauhan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan kaugnay ng hatol sa nakapaligid na konteksto.
- source_word: καὶ οὐκ ἐδώκατέ μοι φαγεῖν
  choice: ngunit hindi ninyo ako binigyan ng makakain
  rationale: Ang καί sa ganitong salungat na konteksto ay likas na maisasaling “ngunit.” Ang “binigyan ... ng makakain” ay malinaw at karaniwang Tagalog na nagpapanatili sa personal na pokus ng μοι at sa pandiwang diwa ng φαγεῖν.
- source_word: ἐδίψησα
  choice: nauhaw ako
  rationale: Likas na katumbas sa Tagalog at kaagapay ng “nagutom ako.”
- source_word: καὶ οὐκ ἐποτίσατέ με
  choice: ngunit hindi ninyo ako binigyan ng maiinom
  rationale: Sa kontekstong ito, ang ποτίζω ay tumutukoy sa pagbibigay ng maiinom. Pinananatili ng salin ang personal na layon na με at ang paralelismo sa unang sugnay.
theological_decisions:
- issue: Antas ng pagiging literal sa mga sugnay tungkol sa hindi pagbibigay
  choice: “hindi ninyo ako binigyan ng makakain ... hindi ninyo ako binigyan ng maiinom”
  alternative: “hindi ninyo ako pinakain ... hindi ninyo ako pinainom”
  rationale: Mas malapit ang napiling anyo sa konstruksiyon ng Griyego at malinaw na pinananatili ang pagkakait ng kailangan, nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “ninyo” bilang karaniwang maramihang ikalawang panauhan at pinanatili ang magkatulad na ayos ng dalawang sugnay.
