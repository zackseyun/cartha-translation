  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: tl
  text: At ilalagay niya ang mga tupa sa kaniyang kanan[b], ngunit ang mga batang kambing sa kaliwa niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kambing”; mas tiyak na tumutukoy ang salitang Griyego sa mga batang kambing.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa kaniyang kanan ... mula sa kaliwa”; isang idyoma para sa paglalagay sa kanan at sa kaliwang panig.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: ilalagay
  rationale: 'Ang future active ng ἵστημι na may tuwirang layon ay causative: ilagay o itayo sa isang puwesto. Likas at malinaw sa modernong Filipino ang “ilalagay” sa tagpong ito.'
- source_word: πρόβατα
  choice: mga tupa
  rationale: Karaniwang katawagan ang πρόβατα para sa mga tupa; ipinahihiwatig ng konteksto na ito ang pangkat na nauna nang binanggit.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: sa kaniyang kanan
  rationale: Sa kontekstong nagsasaad ng paglalagay, ang ἐκ na may genitive ay idyomatikong tumutukoy sa puwesto sa kanan niya. Natural sa Filipino ang “sa kaniyang kanan.”
- source_word: ἐρίφια
  choice: mga batang kambing
  rationale: Mas tiyak na tumutukoy ang ἐρίφια sa mga batang kambing. Naipapanatili ng saling ito ang leksikal na detalye nang hindi gumagamit ng salitang maaaring malabo gaya ng “kids” sa Ingles.
- source_word: ἐξ εὐωνύμων
  choice: sa kaliwa niya
  rationale: Idyomatikong nangangahulugan ang parirala ng puwesto sa kaliwang panig. Bagaman hindi inuulit sa Griyego ang αὐτοῦ, natural at malinaw sa Filipino na idagdag ang “niya.”
- source_word: μὲν ... δὲ
  choice: ngunit
  rationale: Minamarkahan ng pares na μὲν ... δὲ ang paghahambing at pagkakaiba ng dalawang pangkat. Maikli at marangal na ipinahahayag ito ng “ngunit.”
theological_decisions:
- issue: Kung ilalantad sa salin ang simbolikong kahulugan ng kanan at kaliwa
  choice: 'Ipakita lamang ang aktuwal na paglalagay: “sa kaniyang kanan ... sa kaliwa niya.”'
  alternative: Palawakin bilang puwesto ng pagsang-ayon at puwesto ng pagtanggi.
  rationale: Pisikal na pagpoposisyon ang tuwirang sinasabi ng talata. Nasa mas malawak na tagpo ang evaluative o simbolikong bisa ng kanan at kaliwa; ang pagpapaliwanag nito sa pangunahing teksto ay lalampas sa Griyego.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang maikling balanseng paghahambing ng dalawang pangkat at ang spatial na diwa ng mga idyomang Griyego.
