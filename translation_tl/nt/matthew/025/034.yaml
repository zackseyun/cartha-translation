id: MAT.25.34
reference: Matthew 25:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: tl
  text: Pagkatapos, sasabihin ng Hari sa mga nasa kanan niya, “Halikayo, kayong mga pinagpala ng aking Ama. Manahin ninyo ang kahariang inihanda para sa inyo mula pa nang itatag ang sanlibutan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa pagkakatatag ng sanlibutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinapakita ang kasunod na pangyayari sa tagpo ng paghatol sa natural na modernong Tagalog.
- source_word: ἐρεῖ
  choice: sasabihin
  rationale: Tuwirang katumbas ng panghinaharap na anyo ng λέγω at angkop na pambungad sa tuwirang pananalita.
- source_word: ὁ βασιλεὺς
  choice: ang Hari
  rationale: Tiyak na titulo ito ng hari sa talinghaga; ginamit ang malaking titik bilang pantukoy sa natatanging Hari sa konteksto.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: sa mga nasa kanan niya
  rationale: Malinaw na pinananatili ang puwesto ng pangkat sa kanang panig ng Hari nang hindi ginagawang mabigat ang pahayag.
- source_word: Δεῦτε
  choice: Halikayo
  rationale: Isang marangal at natural na paanyaya sa maramihan na tumutugma sa imperatibong panawagan.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: kayong mga pinagpala ng aking Ama
  rationale: Pinananatili ang pasibong diwa ng participle at ipinapahayag ang Ama bilang pinagmumulan o gumagawa ng pagpapala.
- source_word: κληρονομήσατε
  choice: Manahin ninyo
  rationale: Pinananatili ang diwa ng mana at hindi lamang pangkalahatang pagtanggap o pag-aari.
- source_word: τὴν ... βασιλείαν
  choice: ang kaharian
  rationale: Sa konteksto ng isang inihandang mana, ang “kaharian” ang pinakanatural na salin habang nananatili ang diwa ng paghahari.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: inihanda para sa inyo
  rationale: Natural na ipinahahayag ang natapos nang paghahanda na patuloy na mahalaga para sa mga kinakausap.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: mula pa nang itatag ang sanlibutan
  rationale: Pinananatili ang panimulang punto sa pagkakatatag ng daigdig at ang pagkakaugnay nito sa paghahanda ng kaharian.
theological_decisions:
- issue: Ang kaugnayan ng genitibong τοῦ πατρός μου sa οἱ εὐλογημένοι
  choice: “mga pinagpala ng aking Ama,” na inuunawa ang Ama bilang pinagmumulan o gumagawa ng pagpapala
  alternative: Mas mahigpit na “mga pinagpala ng Ama ko,” na maaaring mapanatiling mas bukas ang ugnayan ng genitibo
  rationale: Sa natural na Tagalog, ang “pinagpala ng aking Ama” ay malinaw at hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Kahulugan ng βασιλεία bilang minamana
  choice: kaharian
  alternative: paghahari
  rationale: Ang bagay na “manahin” at “inihanda” ay pinakamadaling maunawaan bilang kaharian, bagaman hindi nito itinatanggi ang diwa ng paghahari.
- issue: Pagkakabit ng ἀπὸ καταβολῆς κόσμου
  choice: Ikinabit sa “inihanda para sa inyo”
  alternative: Unawain bilang mas maluwag na panahong kaugnay ng buong paanyaya
  rationale: Ang pinakamalapit at pinakanatural na sintaktikong kaugnayan nito ay sa participleng “inihanda,” nang hindi nagpapasok ng mas malawak na sistemang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Halikayo” para sa isang taimtim na paanyaya at “Manahin ninyo” upang mapanatili ang larawang pampamilya at pangmana. Ang tanging talababa ay naglalahad ng mas literal na anyo ng pariralang temporal.
