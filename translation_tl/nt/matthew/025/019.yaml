source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: tl
  text: Pagkaraan ng mahabang panahon, dumating ang amo ng mga aliping iyon[a] at nakipagtuos sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panginoon ng mga lingkod na iyon.” Ang κύριος ay maaaring mangahulugang “amo” o “panginoon,” at ang δοῦλοι ay maaaring isaling “mga alipin” o “mga lingkod.” Pinili rito ang “amo” at “mga alipin” dahil malinaw sa talinghaga ang ugnayang pangsambahayan at pangkabuhayan.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Pagkaraan ng mahabang panahon
  rationale: Ipinapahayag ng μετά na may akusatibo ang paglipas ng panahon. Banayad lamang ang δέ, at likas nang ipinahihiwatig ng “Pagkaraan” ang pagpapatuloy ng salaysay kaya hindi na dinagdagan ng hiwalay na pang-ugnay.
- source_word: ἔρχεται
  choice: dumating
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa salaysay na Tagalog ang aspektong naganap na “dumating”; hindi nito dinaragdagan ang diwang “bumalik,” na wala sa teksto.
- source_word: ὁ κύριος
  choice: ang amo
  rationale: Sa tagpong pangsambahayan at pangkabuhayan ng talinghaga, ang κύριος ay tumutukoy sa may kapangyarihan sa mga alipin. Malinaw at natural dito ang “amo,” samantalang inilalagay sa talababa ang posibleng “panginoon.”
- source_word: τῶν δούλων ἐκείνων
  choice: ng mga aliping iyon
  rationale: Litaw sa konteksto ang nakatali at mababang katayuan ng δοῦλοι sa ilalim ng isang amo, kaya mas tiyak ang “mga alipin” kaysa sa mas malambot na “mga lingkod.”
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: nakipagtuos sa kanila
  rationale: Ang idyoma ay nangangahulugang magsuri at magpasiya tungkol sa mga kuwentang ipinagkatiwala. Ang “nakipagtuos” ay maikli, natural, at angkop sa kontekstong pinansiyal.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa loob ng talinghaga
  choice: amo
  alternative: panginoon
  rationale: Ang tuwirang papel ng tauhan ay amo ng mga alipin, kaya hindi sapilitang ginawang titulong kristolohikal ang salita. Gayunman, pinananatili sa talababa ang lehitimong kahulugang “panginoon” at ang posibleng teolohikal na alingawngaw nito.
- issue: Pagbibigay-kahulugan sa δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga rito ang ugnayan ng kapangyarihan at pagmamay-ari na ipinahihiwatig ng κύριος at δοῦλος. Hindi ito pinalambot sa “lingkod,” ngunit kinikilala sa talababa ang lawak ng kahulugan ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang idyomang “nakipagtuos” para sa pagsasaayos at pagsusuri ng pananagutang pinansiyal; iniwasan ang mas lumang “nagsulit ng kuwenta.”
