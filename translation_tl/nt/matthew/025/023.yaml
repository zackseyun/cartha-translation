  terminology: Ang magkapares na “tapat” para sa πιστέ at πιστός ay mahusay na napanatili. Ang “panginoon” ay angkop para sa κύριος sa loob ng talinghaga at hindi dapat i-capitalize. Ang “lingkod” ay natural; ang talababa ay sapat na nagtatala ng mas matibay na kahulugang “alipin.”
