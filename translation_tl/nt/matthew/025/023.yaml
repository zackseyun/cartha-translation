id: MAT.25.23
reference: Matthew 25:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang panginoon, “Magaling! Mabuti at tapat na lingkod[a]. Sa kaunting bagay ay naging tapat ka; ilalagay kitang mamahala sa maraming bagay. Pumasok ka sa kagalakan ng iyong panginoon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alipin.” Ang salitang Griyego na δοῦλος ay maaaring tumukoy sa lingkod o alipin, ayon sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Likas at tuwirang panumbas sa karaniwang pambungad ng tuwirang pananalita.
- source_word: κύριος
  choice: panginoon
  rationale: Sa tagpong ito, tumutukoy ito sa nakatataas na tao sa loob ng talinghaga. Ang “panginoon” ay dignipikado at natural sa ugnayan ng panginoon at lingkod, nang hindi kinakailangang gawing titulong tuwirang tumutukoy sa Diyos.
- source_word: δοῦλε
  choice: lingkod
  rationale: Natural sa modernong Tagalog at malinaw na nagpapahayag ng pagpapailalim at paglilingkod; inilalagay sa talababa ang mas tiyak na alternatibong “alipin.”
- source_word: Εὖ
  choice: Magaling!
  rationale: Idyomatikong pahayag ng papuri na tumutugma sa evaluative na gamit ng εὖ.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: mabuti at tapat
  rationale: Pinananatili ang magkaparis na katangian at ang leksikal na ugnayan ng πιστέ sa sumunod na πιστός.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Naging tapat ka sa kaunting bagay
  rationale: Malinaw na ipinahihiwatig ang pagiging mapagkakatiwalaan sa ipinagkatiwalang maliit na saklaw nang hindi dinaragdagan ang teksto.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: pamamahalain kita sa maraming bagay
  rationale: Ipinapahayag ng pandiwang καθίστημι kasama ng ἐπί ang paghirang o paglalagay sa pamamahala; natural itong Tagalog at pinananatili ang kaunti-marami na paghahambing.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Pumasok ka sa kagalakan
  rationale: Pinananatili ang metapora ng pagpasok sa kagalakan sa halip na ipakahulugan lamang bilang pakikibahagi.
theological_decisions:
- issue: Pagbibigay-kahulugan sa κύριος sa isang talinghaga tungkol sa nakatataas na tao
  choice: panginoon
  alternative: Panginoon; amo
  rationale: Ang tinutukoy sa antas ng salaysay ay ang panginoon ng lingkod. Ginamit ang maliit na titik upang hindi ito tahasang gawing banal na titulo, habang hinahayaang lumitaw sa konteksto ang mas malawak na teolohikal na kabuluhan ng talinghaga.
- issue: Pagbibigay-kahulugan sa δοῦλος
  choice: lingkod
  alternative: alipin
  rationale: Ang diin ng talata ay ang tapat na pangangasiwa, ngunit tunay na maaaring tumukoy ang δοῦλος sa isang alipin. Kaya “lingkod” ang nasa teksto para sa natural na pagbasa at “alipin” ang tahasang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang “panginoon” sa maliit na titik para sa taong nakatataas sa loob ng talinghaga. Pinanatili ang pag-uulit ng “tapat,” ang paghahambing ng kaunti at marami, at ang metapora ng pagpasok sa kagalakan.
