  to: Sinabi sa kanya ng kanyang panginoon, “Magaling! Mabuti at tapat na lingkod[a]. Sa kaunting bagay ay naging tapat ka; ilalagay kitang mamahala sa maraming bagay. Pumasok ka sa kagalakan ng iyong panginoon.”
  rationale: Pinalitan ang “pamamahalain kita” ng mas likas at tumpak na “ilalagay kitang mamahala,” upang malinaw na maipahayag ang paghirang sa mas malawak na pananagutan. Bahagyang inayos din ang ayos ng unang sugnay upang idiin ang kaunti–marami na paralelismo ng Griyego, nang hindi binabago ang kahulugan.
