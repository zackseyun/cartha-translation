  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: tl
  text: At itapon ninyo sa kadiliman sa labas ang walang-silbing alipin[a]. Doon ay magkakaroon ng pagtangis at pagngangalit ng mga ngipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego na doulos ay maaaring mangahulugang “alipin” o “lingkod”; ginamit dito ang “alipin” dahil litaw sa tagpo ng talinghaga ang kanyang nakatali at di-pantay na katayuan sa panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: walang-silbi
  rationale: Ipinahihiwatig ng salita na ang alipin ay walang pakinabang sa pagsusuri ng kanyang panginoon. Ang “walang-silbi” ay natural sa makabagong Filipino at pinananatili ang tindi ng hatol nang hindi gumagamit ng lipas na pananalita.
- source_word: δοῦλον
  choice: alipin
  rationale: Sa tagpo ng talinghaga, malinaw ang nakatali at di-pantay na katayuan sa pagitan ng panginoon at ng doulos. Mas tuwirang inilalarawan ito ng “alipin” kaysa “lingkod,” habang inilalagay sa talababa ang lehitimong alternatibo.
- source_word: ἐκβάλετε
  choice: itapon ninyo
  rationale: Ang pautos na pandiwa ay mariin at nagpapahayag ng sapilitang pagpapalayas. Ang “itapon ninyo” ay buhay at natural na katumbas sa Filipino.
- source_word: σκότος τὸ ἐξώτερον
  choice: kadiliman sa labas
  rationale: Pinananatili nito ang larawan ng kadilimang nasa labas at ng pagkakait ng pagpasok, sa mas natural na ayos ng mga salita sa Filipino.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Tuwirang tumutukoy ito sa lugar na kababanggit lamang at natural na nagpapatuloy sa pangungusap sa Filipino.
- source_word: κλαυθμὸς
  choice: pagtangis
  rationale: Ang “pagtangis” ay marangal at malinaw na salita para sa matinding pag-iyak o pagdadalamhati, at angkop sa paulit-ulit na pormulang ito sa Mateo.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Ito ang nakaugaliang at malinaw na katumbas sa Filipino, at pinananatili ang maaaring pahiwatig ng matinding dalamhati at/o galit nang hindi nilulutas ang ambiguwidad.
theological_decisions:
- issue: Likas ng larawang paghuhukom sa talinghaga
  choice: Panatilihin ang larawan ng pagkakait at matinding pagdurusa nang hindi tahasang tinutukoy kung ito ay impiyerno, panghuling paghuhukom, o ibang uri ng kaparusahan.
  alternative: Tahasang ipakahulugan ang larawan bilang impiyerno o, sa kabilang dako, bilang pansamantala o talinghagang pagkakait lamang.
  rationale: Gumagamit ang talata ng karaniwang wika ng paghuhukom sa Mateo, ngunit hindi dapat idagdag ng salin ang isang mas tiyak na doktrinal na paliwanag kaysa sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang-silbi” bilang natural ngunit mariing paglalarawan, at pinanatili ang pamilyar na pariralang “pagtangis at pagngangalit ng mga ngipin.”
