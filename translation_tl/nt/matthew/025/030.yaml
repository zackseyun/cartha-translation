  verdict: approve
  source_fidelity: 'Tumpak ang salin sa lahat ng pangunahing bahagi ng Griyego: ang mariing utos na ἐκβάλετε ay naipahayag sa “itapon ninyo”; ang ἀχρεῖον δοῦλον sa “walang-silbing alipin”; at ang Matthean na pormulang “kadiliman sa labas ... pagtangis at pagngangalit ng mga ngipin” ay pinananatili nang walang dagdag na pagpapakahulugan. Ang “Doon ay magkakaroon” ay sapat na katumbas ng ἐκεῖ ἔσται.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang ayos na “sa kadiliman sa labas ang walang-silbing alipin” ay idiomatiko at binibigyang-diin nang wasto ang lugar ng pagtatapon. Pamilyar at angkop sa rehistrong biblikal ang “pagtangis at pagngangalit ng mga ngipin.”
  terminology: Ang “alipin” ay isang ligtas at tumpak na salin ng δοῦλος sa tagpong may panginoon at alipin; ang talababa ay wastong nagtatala ng “lingkod” bilang alternatibo. Hindi ipinipilit ng teksto ang anumang partikular na doktrina hinggil sa larawan ng paghatol.
