  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: tl
  text: Kaya, manatili kayong gising[a], sapagkat hindi ninyo alam ang araw ni ang oras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy kayong magbantay” o “maging mapagbantay kayo.” Ang pautos sa Griyego ay nagpapahiwatig ng patuloy na pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: manatili kayong gising
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng patuloy na pagbabantay. Pinananatili ng salin ang larawan ng pagiging gising sa talinghaga at natural ito sa makabagong Filipino.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kongklusyon o bunga mula sa naunang talinghaga sa natural at malinaw na Filipino.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng utos, habang pinananatili ang marangal at madaling maunawaang himig.
- source_word: οὐκ οἴδατε
  choice: hindi ninyo alam
  rationale: Tuwirang isinasalin ang ikalawang panauhang maramihan na may pagtanggi, nang walang idinagdag na katiyakan o paliwanag.
- source_word: τὴν ἡμέραν
  choice: ang araw
  rationale: Pinananatili ang tiyak na pantukoy at hindi tahasang idinaragdag kung anong araw ang tinutukoy.
- source_word: οὐδὲ τὴν ὥραν
  choice: ni ang oras
  rationale: Likas na iniuugnay ng “ni” ang ikalawang sangkap sa naunang pagtanggi at pinananatili ang kahulugang ‘ni ang oras.’
theological_decisions:
- issue: Larawan ng utos na maging mapagbantay
  choice: manatili kayong gising
  alternative: patuloy kayong magbantay; maging mapagbantay kayo
  rationale: Pinananatili nito ang larawan ng pagiging gising sa konteksto ng talinghaga at ang diwa ng patuloy na kahandaan, nang hindi ito nililimitahan sa isang partikular na sistemang eskatolohikal.
- issue: Saklaw ng “ang araw ni ang oras”
  choice: panatilihin ang pahayag nang walang tahasang paliwanag
  alternative: ang araw ni ang oras ng pagdating ng Anak ng Tao; ang takdang panahon
  rationale: Bagaman nagbibigay ng mas malawak na konteksto ang diskurso, araw at oras lamang ang tahasang binabanggit ng talata. Hindi nagdaragdag ang salin ng teolohikal na pagtukoy na wala sa mismong Griyego.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “manatili kayong gising” upang mapanatili ang metapora ng talinghaga; ang “sapagkat” ay bahagyang pormal ngunit karaniwan at malinaw sa saling biblikal.
