base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: tl
  text: Hubad ako at dinamitan ninyo; may sakit ako at dinalaw ninyo[a]; nasa bilangguan ako at pinuntahan ninyo ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inalagaan ninyo ako”; ang pandiwang Griyego ay maaaring tumukoy sa pagdalaw na may malasakit o pagkalinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: hubad
  rationale: Tuwirang katumbas ito ng pang-uri at malinaw na kaagapay ng kilos na “dinamitan.” Maaari ring ipahiwatig ng konteksto ang kakulangan sa sapat na damit, ngunit hindi iyon kailangang idagdag sa teksto.
- source_word: περιεβάλετέ
  choice: dinamitan
  rationale: Likas at maikli sa Tagalog para sa paglalagay ng damit sa isang taong hubad.
- source_word: ἠσθένησα
  choice: may sakit ako
  rationale: Bagaman maaari ring mangahulugang nanghina, sakit ang malamang na diwa sa konteksto ng pagkalinga.
- source_word: ἐπεσκέψασθέ
  choice: dinalaw
  rationale: Pinananatili nito ang tuwirang diwa ng pagdalaw; ang kasamang malasakit o pagkalinga ay ipinahihiwatig ng pandiwa at ng konteksto, kaya itinatala bilang alternatibo sa talababa.
- source_word: φυλακῇ
  choice: bilangguan
  rationale: Karaniwan, malinaw, at sapat na malawak na katawagan para sa lugar ng pagkakapiit.
- source_word: ἤλθατε πρός με
  choice: pinuntahan ninyo
  rationale: Natural na Tagalog para sa literal na “lumapit/pumarito kayo sa akin,” at hindi nito idinaragdag ang ideya ng pagdalaw na tahasang nasa naunang sugnay.
theological_decisions:
- issue: Antas ng pagpapalawak sa paglalarawan ng mga gawa ng awa
  choice: Panatilihin ang kongkretong mga kilos na “dinamitan,” “dinalaw,” at “pinuntahan” nang walang paliwanag na idinaragdag sa pangunahing teksto.
  alternative: Isalin bilang “inalagaan ninyo ako” at “dinalaw ninyo ako sa bilangguan.”
  rationale: Payak at kongkreto ang Griyego. Ang mas malawak na diwa ng malasakit ay maaaring marinig sa konteksto, ngunit hindi dapat gawing tahasang dagdag sa bawat sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “bilangguan” sa halip na mas kolokyal na “kulungan,” at “pinuntahan” upang maging natural nang hindi dinaragdagan ang payak na Griyego.
