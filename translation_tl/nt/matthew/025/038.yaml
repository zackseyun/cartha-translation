  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: tl
  text: At kailan ka namin nakitang estranghero[a] at pinatuloy[b], o walang sapat na damit[c] at dinamtan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhan.” Ang salitang Griyego ay maaaring tumukoy sa isang estranghero, taong hindi kilala, o taong mula sa labas ng sariling pangkat; dito, ang diwa ay isang taong nangangailangan ng pagtanggap.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tinipon” o “tinanggap.” Dito, ang diwa ay pagtanggap sa isang tao bilang panauhin at pagbibigay ng matutuluyan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hubad.” Ang salitang Griyego ay maaaring tumukoy sa pagiging hubad o sa kawalan ng sapat na damit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: kailan
  rationale: Likas na salitang pananong sa Filipino para sa oras o pagkakataon ng nakaraang kilos.
- source_word: δέ
  choice: At
  rationale: Banayad nitong iniuugnay ang tanong sa naunang tanong sa magkakasunod na pahayag.
- source_word: ξένον
  choice: isang dayuhan
  rationale: Tumutukoy rito sa isang taong hindi kabilang sa sariling pangkat at nangangailangan ng pagtanggap; mas likas ito sa konteksto ng pagpapatuloy kaysa sa 'estranghero'.
- source_word: συνηγάγομεν
  choice: pinatuloy
  rationale: Bagaman literal na may diwang 'tinipon' o 'tinanggap,' sa kontekstong ito ay tumutukoy ito sa pagtanggap sa isang tao bilang panauhin at pagbibigay ng matutuluyan.
- source_word: γυμνὸν
  choice: walang sapat na damit
  rationale: Maaaring mangahulugan ang salita ng lubos na hubad o kulang sa maayos na kasuotan; malinaw na naihahayag ng pariralang ito ang masaklaw na diwa sa konteksto ng pagtulong.
- source_word: περιεβάλομεν
  choice: dinamtan
  rationale: Tumpak at marangal na salitang Filipino para sa paglalagay o pagbibigay ng damit sa isang tao.
theological_decisions:
- issue: Ang saklaw ng ξένος sa konteksto ng paghatol at pagtanggap sa nangangailangan
  choice: dayuhan
  alternative: taong hindi kilala
  rationale: Pinananatili ng 'dayuhan' ang diwa ng isang taong mula sa labas ng sariling pangkat na nangangailangan ng pagpapatuloy, nang hindi nililimitahan ang teksto sa isang tiyak na legal o pambansang katayuan.
- issue: Ang saklaw ng γυμνός
  choice: walang sapat na damit
  alternative: hubad
  rationale: 'Hindi tahimik na nilulutas ang leksikal na saklaw: inilalagay sa teksto ang likas na kahulugang angkop sa gawa ng awa, habang itinatala sa talababa na maaari rin itong tumukoy sa pagiging hubad.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pinatuloy' para sa likas na pagpapahayag ng hospitality at 'dinamtan' bilang maikli ngunit dignified na pandiwa. Inilagay ang bawat marker kaagad pagkatapos ng salitang o pariralang nililinaw nito.
