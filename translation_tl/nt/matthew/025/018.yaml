  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: tl
  text: Ngunit ang tumanggap ng iisang talento ay umalis, humukay sa lupa, at itinago ang salapi ng kanyang panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “ang pilak ng kanyang panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit ang
  rationale: Ipinakikita ng δέ ang paghahambing at pagsalungat sa ginawa ng naunang mga alipin; likas sa Tagalog ang “Ngunit ang” bilang panimula sa tinutukoy na tao.
- source_word: τὸ ἓν
  choice: isang talento
  rationale: Elliptical ang Griyego na “ang isa,” ngunit malinaw mula sa Mateo 25:15 na talento ang tinutukoy. Ang pagbanggit dito ay kailangan para sa likas at malinaw na Tagalog.
- source_word: λαβὼν
  choice: tumanggap
  rationale: Tumutukoy ito sa alipin bilang tumanggap ng ipinagkatiwalang halaga. Naipahihiwatig na ng pagkakasunod ng salaysay ang naunang kilos kaya hindi kailangang gawing tahasang pangnagdaan nang higit pa.
- source_word: ἀπελθὼν
  choice: umalis
  rationale: Payak at likas na katumbas na nagpapanatili sa sunod-sunod na kilos.
- source_word: ὤρυξεν γῆν
  choice: humukay sa lupa
  rationale: Pinananatili nito ang konkretong larawan ng paghuhukay nang hindi idinaragdag nang tahasan ang “butas,” na ipinahihiwatig lamang ng konteksto.
- source_word: ἔκρυψεν
  choice: itinago
  rationale: Karaniwan at tuwirang katumbas ng κρύπτω sa kontekstong ito.
- source_word: τὸ ἀργύριον
  choice: salapi
  rationale: Maaaring mangahulugan ang ἀργύριον ng pilak o salapi. Ang “salapi” ang likas at marangal na katawagan sa ipinagkatiwalang pera, habang pinananatili sa talababa ang literal na “pilak.”
- source_word: τοῦ κυρίου αὐτοῦ
  choice: ng kanyang panginoon
  rationale: Sa loob ng talinghaga, tumutukoy ang κύριος sa taong may awtoridad sa alipin. Ang “panginoon” ay likas sa biblikal na Tagalog at hindi nangangailangan ng malaking titik sapagkat hindi ito tuwirang titulong pantukoy sa Diyos dito.
theological_decisions:
- issue: Paglilipat ng κύριος sa di-tuwirang banal na sanggunian sa talinghaga
  choice: panginoon
  alternative: amo
  rationale: Ang “panginoon” ay nagpapanatili sa ugnayan ng awtoridad na nasa κύριος at sa posibleng bigat ng talinghaga, nang hindi tahasang ipinapasiya sa mismong salita na ang tauhan ay banal. Maliit na titik ang ginamit dahil tao ang agarang referent sa salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “talento” bilang yunit ng salapi sa konteksto, “salapi” sa halip na mas kolokyal na “pera,” at maliit na titik sa “panginoon” upang malinaw ang agarang papel nito sa talinghaga.
