base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: tl
  text: Ngunit sumagot ang matatalino, “Hindi, baka hindi talaga sasapat para sa amin at sa inyo.[a] Pumunta kayo sa halip sa mga nagtitinda at bumili para sa inyong mga sarili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, ang “baka” ay isinama sa isang mariing negatibo. Ipinahihiwatig nito ang matinding pangambang hindi sasapat ang suplay para sa amin at sa inyo.
    reason: Nililinaw ang di-pangkaraniwang pagsasama ng μήποτε at ng mariing negatibo nang hindi ginagawang ganap na imposibilidad ang pahayag.
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: sumagot
  rationale: Karaniwang pandiwa sa salaysay para sa pagtugon sa sinabi ng iba; malinaw at likas sa modernong Filipino.
- source_word: αἱ φρόνιμοι
  choice: ang matatalino
  rationale: Pinananatili ang pang-uring ginamit bilang pangngalan at hindi inuulit ang pangngalang binanggit na sa konteksto. Sa Tagalog, nauunawaan mula sa naunang talata kung sino ang tinutukoy.
- source_word: λέγουσαι
  choice: hindi isinalin nang hiwalay
  rationale: Ang literal na “sumagot na sinasabi” ay paulit-ulit at hindi likas sa Tagalog; sapat nang ipinakikilala ng “sumagot” at ng tuwirang sipi ang pagsasalita.
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: Hindi, baka hindi talaga magkasya
  rationale: Ipinahahayag ng “Hindi” ang pagtangging ipinahihiwatig sa tugon, samantalang pinananatili ng “baka” ang pag-aalala at ipinahahayag ng “talaga” ang mariing negatibo ng Griyego.
- source_word: ἀρκέσῃ
  choice: magkasya
  rationale: Likas na salitang Filipino para sa suplay na maaaring hindi maging sapat para sa dalawang pangkat.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: para sa amin at sa inyo
  rationale: Malinaw at idiomatikong pagsasalin ng mga datibong nagsasaad kung para kanino dapat maging sapat ang suplay.
- source_word: πορεύεσθε
  choice: pumunta kayo
  rationale: Tuwiran at natural na pautos sa maramihan.
- source_word: μᾶλλον
  choice: sa halip
  rationale: Malinaw na ipinakikita ang ibang hakbang na dapat piliin.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: sa mga nagtitinda
  rationale: Pinananatili ang substantibong participle nang hindi idinaragdag ang bagay na ipinagbibili, bagaman nauunawaan iyon sa konteksto.
- source_word: ἀγοράσατε
  choice: bumili
  rationale: Payak at karaniwang pautos sa modernong Filipino.
- source_word: ἑαυταῖς
  choice: para sa inyong sarili
  rationale: 'Malinaw na ipinahahayag ang reflexive na diwa: sila mismo ang bibili para sa sarili nilang pangangailangan.'
