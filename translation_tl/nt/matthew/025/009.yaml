translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Iniwasan ang di-likas na pag-uulit na “sumagot na sinasabi,” gayundin ang pagdaragdag ng “langis” na hindi tahasang inuulit sa talatang Griyego.
