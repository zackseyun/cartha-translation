  to: Ngunit sumagot ang matatalino, “Hindi, baka hindi talaga sasapat para sa amin at sa inyo.[a] Pumunta kayo sa halip sa mga nagtitinda at bumili para sa inyong mga sarili.”
  rationale: Pinalitan ang “magkasya” ng “sasapat” upang mas angkop sa suplay na maaaring kulangin; ginawang plural ang reflexive na parirala; inayos ang puwesto ng “sa halip” para sa mas natural na Filipino; at muling isinulat ang talababa upang mapanatili ang pag-aalalang nasa Griyego sa halip na gawing absolutong pagtanggi o imposibilidad.
