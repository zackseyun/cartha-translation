  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: tl
  text: Sapagkat ito ay tulad ng isang lalaking maglalakbay, na tumawag sa sarili niyang mga alipin[a] at ipinagkatiwala sa kanila ang kanyang mga ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griyego na doulos ay maaaring tumukoy sa alipin o lingkod, depende sa konteksto; dito, binibigyang-diin ang kapangyarihan ng panginoon sa kanila at sa mga ari-ariang ipinagkatiwala niya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Sapagkat tulad ito ng
  rationale: Ipinakikilala nito ang isang paliwanag na paghahambing kaugnay ng naunang pahayag. Idinagdag ang “ito” upang maging likas at buo ang pangungusap sa Tagalog habang pinananatili ang elipsis ng Griyego.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang lalaking tauhan sa talinghaga, hindi sa sangkatauhan sa pangkalahatan.
- source_word: ἀποδημῶν
  choice: papaalis upang maglakbay
  rationale: Ipinahihiwatig ng pandiwaring Griyego ang pag-alis patungo sa ibang lugar. Likas sa kasalukuyang Tagalog ang pariralang ito at hindi nito labis na tinutukoy na sa ibang bansa ang lakad.
- source_word: ἐκάλεσεν
  choice: Tinawag
  rationale: Tuwiran at natural na katumbas ito; hindi kailangan ang mas pormal na “ipinatawag.”
- source_word: τοὺς ἰδίους δούλους
  choice: ang sarili niyang mga alipin
  rationale: Ipinakikita ng δοῦλος ang nakatali at nasasakupang kalagayan ng mga tauhan sa sambahayan, at binibigyang-diin ng ἰδίους na sila ay sa lalaki mismo. Pinananatili ng “alipin” ang panlipunang bigat ng termino.
- source_word: παρέδωκεν
  choice: ipinagkatiwala
  rationale: Sa konteksto, hindi lamang niya iniabot ang mga ari-arian kundi inilagay ang mga ito sa kanilang pangangasiwa at pananagutan.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ang kanyang mga ari-arian
  rationale: Malinaw at dignified na tumutukoy sa mga pag-aari ng lalaki sa kontekstong pangkabuhayan ng talinghaga.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος sa sambahayan ng talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas malinaw na pinananatili ng “mga alipin” ang pagmamay-ari at kapangyarihan ng panginoon na kapansin-pansin sa salaysay. Nasa talababa ang “mga lingkod” bilang posibleng salin upang kilalanin ang lawak ng kahulugan ng salitang Griyego nang hindi pinapahina ang panlipunang katotohanan nito sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap para sa likas na daloy, nang hindi binabago ang ugnayan ng paghahambing at ang sunod-sunod na kilos sa Griyego.
