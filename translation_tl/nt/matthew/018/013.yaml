base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: tl
  text: At kung sakaling makita at matagpuan niya ito[a], tinitiyak ko sa inyo, higit siyang nagagalak dahil sa tupa na iyon kaysa sa siyamnapu’t siyam na hindi naligaw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasabi, “kung mangyaring matagpuan niya ito.”
    reason: lexical_alternative
  - marker: b
    text: O “na hindi lumihis ng landas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang tuloy-tuloy na daloy ng paglalarawan ni Jesus.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: kung sakaling matagpuan niya ito
  rationale: Likas sa makabagong Tagalog ang “kung sakaling” bilang pagpapahayag ng tunay na posibilidad, samantalang malinaw na ang pastol ang nakatagpo sa tupa. Inilalagay sa talababa ang mas pormal na anyong nagpapakita sa diwa ng γένηται.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: totoong sinasabi ko sa inyo
  rationale: Pinananatili ang maringal at mariing pormula ni Jesus nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: nagagalak dahil dito
  rationale: Ipinahahayag ng “nagagalak” ang malakas na damdamin ng χαίρει, at natural na tinutukoy ng “dahil dito” ang natagpuang tupa bilang dahilan ng kagalakan.
- source_word: μᾶλλον ἢ
  choice: higit ... kaysa
  rationale: Tuwirang pinananatili ang paghahambing sa Griyego at hindi ito ginagawang eksklusibong pagpili.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: sa siyamnapu’t siyam
  rationale: Hindi inuulit ang salitang “tupa,” gaya ng Griyego, sapagkat malinaw na ito mula sa konteksto.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: na hindi naligaw
  rationale: Ang “naligaw” ay natural sa larawan ng mga tupa at nagpapahayag ng kalagayang bunga ng hindi paglihis sa wastong landas.
theological_decisions:
- issue: Lakas ng paghahambing sa kagalakan ng pastol
  choice: Pinananatiling tuwiran na higit ang kagalakan niya sa isang natagpuan kaysa sa siyamnapu’t siyam na hindi naligaw.
  alternative: Palambutin ang paghahambing upang hindi magmukhang may pagtatangi sa halaga ng mga tupa.
  rationale: Ang μᾶλλον ἢ ay tunay na paghahambing. Hindi sinasabi ng salin na walang malasakit ang pastol sa siyamnapu’t siyam, ngunit hindi rin nito nilulutas o pinapahina ang tensiyon ng sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “totoong sinasabi ko sa inyo” upang mapanatili ang taimtim na diin ng pormula, at ang “higit ... kaysa” upang hindi mapahina ang tunay na paghahambing sa orihinal.
