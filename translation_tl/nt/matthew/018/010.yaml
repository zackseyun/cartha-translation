  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: tl
  text: “Mag-ingat kayo na huwag hamakin ang isa man sa maliliit na ito.[a] Sapagkat sinasabi ko sa inyo na ang kanilang mga anghel[b] sa langit[c] ay palaging nakikita ang mukha ng aking Ama na nasa langit.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maliitin ang isa man sa maliliit na ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kanilang mga anghel” ay maaaring tumukoy sa mga anghel na kaugnay ng mga maliliit na ito o kumakatawan sa kanila. Hindi sapat ang talatang ito lamang upang tiyakin ang buong doktrina tungkol sa mga personal na anghel na tagapagbantay.
    reason: alternative_reading
  - marker: c
    text: Sa Griyego, “sa mga langit”; isinalin dito sa likas na Tagalog bilang “sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Mag-ingat kayo na huwag hamakin
  rationale: Ang Ὁρᾶτε ay isang pautos na nagpapakilala ng mariing babala, at ang kasunod na μή na may aorist subjunctive ay nagpapahayag ng pagbabawal. Likas sa makabagong Tagalog ang “Mag-ingat kayo na huwag,” samantalang pinananatili ng “hamakin” ang bigat ng καταφρονέω.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ang isa man sa maliliit na ito
  rationale: Pinananatili ng “maliliit na ito” ang posibleng pagtukoy sa mga bata at, sa konteksto, sa mga aba o mapagpakumbabang alagad; hindi ito nililimitahan sa literal na maliliit na bata lamang. Ipinahahayag ng “isa man” ang diin sa kahit isang kabilang sa pangkat.
- source_word: λέγω γὰρ ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo
  rationale: Tuwirang ipinapakita ng “Sapagkat” ang paliwanag na gamit ng γάρ, at natural ngunit marangal ang “sinasabi ko sa inyo.”
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: ang kanilang mga anghel
  rationale: Tuwirang pinananatili ang ugnayang paari ng Griyego nang hindi ipinapasiya kung bawat isa ay may nakatalagang personal na anghel.
- source_word: ἐν οὐρανοῖς
  choice: sa langit
  rationale: Bagaman maramihan ang anyo sa Griyego, idiomatiko sa Tagalog ang isahang “langit” sa ganitong pahayag.
- source_word: διὰ παντὸς
  choice: laging
  rationale: Maikli at natural na katumbas ng idyomang nangangahulugang palagi o sa lahat ng panahon.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: nakakakita sa mukha
  rationale: Pinananatili ang larawang biblikal ng tuwirang pagharap at paglapit sa presensiya ng Diyos, nang hindi ito pinapalitan ng paliwanag.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: ng aking Ama na nasa langit
  rationale: Pinananatili ang tahasang “aking Ama” at ang kasunod na pariralang nagsasaad ng kinaroroonan.
theological_decisions:
- issue: Kahulugan ng “kanilang mga anghel”
  choice: Panatilihin ang literal na “kanilang mga anghel” nang hindi tinutukoy ang isang ganap na doktrina ng personal na anghel na tagapagbantay.
  alternative: Unawain ito bilang mga personal na anghel na nakatalaga sa bawat bata o mananampalataya, o bilang mga anghel na kumakatawan o naglilingkod sa kanila sa mas pangkalahatang diwa.
  rationale: Sinasabi ng teksto ang kaugnayan ng mga anghel sa “maliliit na ito,” ngunit hindi nito ipinaliliwanag ang eksaktong kaayusan o tungkulin nila. Kaya pinananatili ang tunay na kalabuan.
- issue: Saklaw ng “maliliit na ito”
  choice: Gamitin ang “maliliit na ito” upang huwag ilimita ang tinutukoy sa pisikal na edad lamang.
  alternative: Isalin bilang “maliliit na batang ito,” na tahasang maglilimita sa mga bata.
  rationale: Maaaring tumukoy ang μικροί sa mga bata, ngunit sa konteksto ng Mateo 18 maaari rin itong sumaklaw sa mga abang alagad. Ang mas malawak na anyo ang nagpapanatili sa posibleng saklaw.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kayo” bilang tahasang maramihang kausap. Iniwasan ang sobrang teknikal o denominasyonal na pananalita, at pinanatili ang larawang “makakita sa mukha” sa halip na ipaliwanag ito sa mismong talata.
