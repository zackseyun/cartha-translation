  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: tl
  text: Kaya, ang sinumang magpapakumbaba gaya ng batang ito, siya ang pinakadakila sa kaharian ng langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις οὖν
  choice: Kaya, ang sinuman
  rationale: Ipinapahayag ang konklusyon mula sa naunang halimbawa ni Jesus at pinananatili ang pangkalahatang saklaw ng ὅστις.
- source_word: ταπεινώσει ἑαυτόν
  choice: magpapakumbaba
  rationale: Likas na salin sa modernong Tagalog para sa kusang pagpapakababa sa sarili; hindi ito pinalalabo bilang simpleng pagiging mahiyain o mababang-loob.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: gaya ng batang ito
  rationale: Tuwirang pinananatili ang paghahambing at ang pagtukoy sa batang nasa harap nila.
- source_word: οὗτός ἐστιν ὁ μείζων
  choice: siya ang pinakadakila
  rationale: Pinananatili ang emphatic resumptive pronoun na οὗτος sa pamamagitan ng “siya,” at natural na ipinapahayag ang superlatibong diwa ng ὁ μείζων sa konteksto.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: sa kaharian ng langit
  rationale: Karaniwan, malinaw, at matapat na katumbas ng pariralang Mateo na βασιλεία τῶν οὐρανῶν.
theological_decisions:
- issue: Batayan ng kadakilaan sa kaharian
  choice: Pinanatili ang tahasang ugnayan ng pagpapakumbaba gaya ng bata at pagiging pinakadakila.
  alternative: Ipaliwanag ang katangian ng bata bilang kawalang-malay, pananampalataya, o mababang katayuan.
  rationale: Hindi tinutukoy ng talata kung aling katangian ng bata ang sentro bukod sa utos na magpakumbaba; ang pagdaragdag ng tiyak na paliwanag ay magpapasya sa ambiguwidad na hindi nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “magpapakumbaba” sa halip na mas mabigat na pariralang “magpapakababa sa sarili,” at pinanatili ang “siya” upang katawanin ang diin ng Griyegong οὗτος.
