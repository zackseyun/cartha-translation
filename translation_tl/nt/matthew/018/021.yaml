base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: tl
  text: Pagkatapos, lumapit si Pedro sa kanya at sinabi, “Panginoon, ilang beses magkakasala laban sa akin ang kapatid ko[a] at patatawarin ko siya? Hanggang pitong beses?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa panlalaking isahang anyo (“kapatid na lalaki”); sa kontekstong ito, maaari itong tumukoy nang mas malawak sa isang kapwa alagad.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Ipinapakita ang sunod na pangyayari at likas na nag-uugnay sa naunang turo ni Jesus.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: lumapit si Pedro sa kanya at sinabi
  rationale: Pinananatili ang paglapit ni Pedro kay Jesus bago siya nagsalita, pati ang karaniwang pandiwang εἶπεν na ‘sinabi.’
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος sa tuwirang pagtawag kay Jesus; pinananatili ang paggalang at posibleng teolohikal na pahiwatig.
- source_word: ποσάκις
  choice: ilang beses
  rationale: Tumutukoy sa bilang ng mga pag-uulit at natural na kaakibat ng kasunod na mungkahing hangganan.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: magkakasala sa akin
  rationale: Pinananatili ang anyong panghinaharap at ang kasalanang nakatuon laban sa nagsasalita.
- source_word: ὁ ἀδελφός μου
  choice: ang kapatid ko
  rationale: Ang ‘kapatid’ ang natural na katumbas sa Filipino; hindi nito sapilitang nililinaw ang kasariang maaaring mahalaga lamang sa gramatikal na anyo ng Griyego.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: at patatawarin ko siya
  rationale: Ang ἀφίημι sa kontekstong ito ay pagpapatawad. Pinananatili rin ang panghinaharap at ang pagkakaugnay nito sa naunang sugnay.
- source_word: ἕως ἑπτάκις
  choice: Hanggang pitong beses?
  rationale: Ipinapahayag ang mungkahing pinakamataas na bilang nang tuwiran at natural.
theological_decisions:
- issue: Saklaw at kasarian ng ἀδελφός
  choice: Isinalin bilang ‘kapatid’ sa pangunahing teksto at ipinaliwanag sa talababa ang panlalaking anyo ng Griyego.
  alternative: kapatid na lalaki; kapatid na lalaki o babae; kapwa alagad
  rationale: Panlalaking isahan ang anyo sa Griyego, ngunit maaari itong tumukoy nang mas malawak sa isang kapwa alagad. Ang natural na salitang Filipino na ‘kapatid’ ay hindi nagtatakda ng kasarian, kaya pinananatili sa talababa ang impormasyong nasa anyong Griyego nang hindi nilulutas ang saklaw nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘ilang beses’ at ‘hanggang pitong beses’ bilang likas na pananalita, habang pinanatili ang bahagyang di-karaniwang pagkakahanay ng dalawang panghinaharap na kilos sa tanong ni Pedro.
