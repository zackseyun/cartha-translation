  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: tl
  text: Dahil dito, ang kaharian ng langit ay inihalintulad sa isang hari na nagnais na makipagtuos ng mga kuwenta sa kaniyang mga alipin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod.” Ang Griyegong δοῦλοι ay tumutukoy sa mga alipin, na binibigyang-diin ang kanilang pagiging pag-aari at sakop ng hari.
    reason: alternative_reading
  - marker: b
    text: Maaaring isalin ang Griyego na “itinulad” o “inihalintulad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas sa modernong Tagalog at pinananatili ang ugnayang sanhi o paghinuha sa naunang turo.
- source_word: ὡμοιώθη
  choice: ay inihalintulad
  rationale: Pinananatili ang pasibong anyo at tahasang paghahambing ng Griyegong aorist passive; hindi nito ipinahihiwatig na talagang nagbago o 'naging' hari ang kaharian.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Karaniwan at malinaw na salin ng natatanging parirala ni Mateo tungkol sa paghahari ng Diyos.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: sa isang hari
  rationale: Ang βασιλεῖ ay tumutukoy nang mas tiyak sa ἀνθρώπῳ; natural itong pinaiikli sa Tagalog nang walang pagkawala ng diwa.
- source_word: ἠθέλησεν
  choice: nagnais
  rationale: Ipinapahayag ang kusang hangarin o layunin sa dignified ngunit madaling maunawaang modernong Tagalog.
- source_word: συνᾶραι λόγον
  choice: makipagtuos
  rationale: Natural na idyomang Tagalog para sa pagsusuri at pagsasaayos ng mga pananagutang pinansiyal.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: sa kaniyang mga alipin
  rationale: Ang 'alipin' ay malinaw na nagpapakita ng nakagapos at nasasakupang kalagayan ng δοῦλοι sa ilalim ng hari, na mahalaga sa konteksto ng kuwenta at pananagutan.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος sa kontekstong maharlika at pangkabuhayan ng talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas tuwirang pinananatili ng 'mga alipin' ang katayuang nasasakupan ng hari at ang matinding kapangyarihan niya sa kanila. Inilalagay sa talababa ang 'mga lingkod' bilang lehitimong alternatibo upang hindi ikubli ang lawak ng kahulugan ng δοῦλος.
- issue: Pasibong paghahambing sa ὡμοιώθη
  choice: ay inihalintulad
  alternative: ay tulad
  rationale: Pinananatili nito ang gramatikal na pasibo at ang kilos ng paghahambing, sa halip na gawing payak na pahayag lamang ng pagkakatulad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “inihalintulad” upang mapanatili ang pasibong paghahambing, “makipagtuos” para sa idyomang pinansiyal, at “mga alipin” upang hindi palabuin ang katayuang ipinahihiwatig ng δοῦλοι.
