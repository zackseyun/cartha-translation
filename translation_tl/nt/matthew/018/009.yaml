id: MAT.18.9
reference: Matthew 18:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: tl
  text: At kung ang mata mo ang nagiging sanhi ng pagkakasala mo[a], dukitin mo ito at itapon palayo sa iyo. Mas mabuti para sa iyo na pumasok sa buhay nang iisa ang mata kaysa maitapon sa Gehenna[b] ng apoy na may dalawang mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagiging sanhi ng pagkatisod mo.” Ang pandiwang Griyego ay maaaring mangahulugang maging sanhi ng pagkatisod, pagbagsak, o pagkakasala.
    reason: lexical_alternative
  - marker: b
    text: Ang “Gehenna” ay tumutukoy rito sa lugar ng panghuling paghuhukom; karaniwan din itong isinasaling “impiyerno.”
    reason: term_explanation
lexical_decisions:
- source_word: σκανδαλίζει
  choice: nagiging sanhi ng pagkakasala mo
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pag-udyok o pagdala sa isang tao sa pagkatisod at pagkakasala. Natural sa makabagong Tagalog ang pariralang ito, habang inilalahad sa talababa ang mas literal na larawang 'pagkatisod.'
- source_word: ἔξελε
  choice: dukitin
  rationale: Pinananatili nito ang marahas at apurahang larawan ng pautos na anyo, at ito ang karaniwang salitang Tagalog para sa pag-aalis ng mata sa ganitong pahayag.
- source_word: βάλε ἀπὸ σοῦ
  choice: itapon palayo sa iyo
  rationale: Ipinahahayag nito ang tiyak at lubusang pag-aalis na nasa βάλε ἀπὸ σοῦ.
- source_word: καλόν σοί ἐστιν
  choice: Mas mabuti para sa iyo
  rationale: Dahil may paghahambing na kasunod na ἤ, ang kahulugan dito ay kung ano ang higit na mabuti o kanais-nais, hindi lamang kung ano ang 'mabuti.'
- source_word: μονόφθαλμον
  choice: nang iisa ang mata
  rationale: Natural itong katumbas sa Tagalog ng 'one-eyed' at pinananatili ang pisikal na larawan.
- source_word: εἰς τὴν ζωὴν
  choice: pumasok sa buhay
  rationale: Hindi idinagdag ang 'walang hanggan' sapagkat wala itong tahasang katumbas sa Griyego, bagaman may eskatolohikal na bigat ang 'buhay' sa konteksto.
- source_word: βληθῆναι
  choice: maitapon
  rationale: Tuwirang pinananatili ang balintiyak na anyo at ang malakas na kilos ng βάλλω.
- source_word: γέενναν
  choice: Gehenna
  rationale: Pinananatili ang tiyak na terminong Griyego at ang kaugnay nitong makasaysayan at panghuling-paghuhukom na diwa, sa halip na agad itong gawing mas malawak na terminong 'impiyerno.'
- source_word: τοῦ πυρός
  choice: ng apoy
  rationale: Tuwirang pinananatili ang henitibong parirala at ang matingkad na larawan ng apoy.
theological_decisions:
- issue: Pagpapakahulugan sa γέεννα
  choice: Gehenna
  alternative: impiyerno
  rationale: Ang teksto ay gumagamit ng tiyak na terminong γέεννα. Ang transliterasyong 'Gehenna' ay hindi agad nag-aangkat ng lahat ng kalaunang kahulugang teolohikal na maaaring kasama sa 'impiyerno'; nililinaw naman sa talababa ang gamit nito rito.
- issue: Pagpapakahulugan sa εἰς τὴν ζωὴν
  choice: pumasok sa buhay
  alternative: pumasok sa buhay na walang hanggan
  rationale: Bagaman malamang na tumutukoy ito sa buhay sa darating na panahon, walang salitang 'walang hanggan' sa Griyego. Pinananatili ng saling 'buhay' ang tunay na anyo at bigat ng teksto nang hindi nagdaragdag.
- issue: Talinghagang σκανδαλίζει
  choice: nagiging sanhi ng pagkakasala mo
  alternative: nagiging sanhi ng pagkatisod mo
  rationale: Mas malinaw sa karaniwang mambabasang Tagalog ang moral na diwa sa konteksto, ngunit pinananatili sa talababa ang literal na talinghaga at lawak ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'mata mo' at 'para sa iyo' upang maging natural sa ordinaryong mambabasa. Pinanatili ang matinding larawan ng pagdukit at pagtatapon, ang payak na 'buhay,' at ang terminong 'Gehenna.'
