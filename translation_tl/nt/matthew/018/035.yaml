  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: tl
  text: Gayon din ang gagawin sa inyo ng aking Ama sa langit kung hindi patatawarin ng bawat isa sa inyo ang kanyang kapatid[b] nang taos-puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mula sa inyong mga puso.” Maaari ring isalin ang kondisyon: “maliban kung patatawarin ng bawat isa ang kanyang kapatid.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “kanyang kapatid” ay salin ng panlalaking isahan sa Griyego; sa konteksto, kinakatawan nito ang bawat kapuwa alagad o kapuwa mananampalataya.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Gayon din
  rationale: Likas na panandang naghahambing at naglalapat sa naunang talinghaga, habang pinananatili ang diwang “sa gayunding paraan.”
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: aking Ama sa langit
  rationale: Natural at marangal sa makabagong Tagalog; pinananatili ang “aking Ama” at malinaw na ipinahahayag ang makalangit na katangian.
- source_word: ποιήσει ὑμῖν
  choice: ang gagawin sa inyo
  rationale: Pinananatili ang malawak na pandiwang ποιέω at ang pagtukoy nito sa ginawa ng panginoon sa naunang talinghaga, nang hindi dinaragdagan ang uri ng hatol.
- source_word: ἐὰν μὴ
  choice: kung hindi
  rationale: Tuwirang pinananatili ang negatibong kondisyon; ang “maliban kung” ay maaari rin ngunit bahagyang naiiba ang ayos ng diin.
- source_word: ἀφῆτε
  choice: patatawarin
  rationale: Sa konteksto ng pagkakautang at kasalanang ginawa sa kapuwa, ang kahulugan ay malinaw na pagpapatawad.
- source_word: ἕκαστος
  choice: bawat isa sa inyo
  rationale: Ipinakikita ang pamamahaging diwa ng isahan sa loob ng maramihang kausap.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: ang kanyang kapatid
  rationale: Pinananatili ang isahang anyo at ang ugnayang ipinahahayag ng Griyego; nililinaw sa talababa ang kinatawang gamit nito sa konteksto.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: nang taos-puso
  rationale: Natural na idyomang Tagalog para sa pagpapatawad na nagmumula sa kalooban. Iniiwasan nito ang pilit na “mula sa inyong mga puso” ngunit pinananatili ang diin sa tunay at panloob na pagpapatawad.
theological_decisions:
- issue: Saklaw at bigat ng babala
  choice: Tuwirang babala na gagawin ng Ama sa mga alagad ang katumbas ng ginawa sa naunang talinghaga
  alternative: Palambutin bilang “ganyan din kayo pakikitunguhan” o tukuyin nang tahasan kung ito ay walang hanggang kaparusahan o pagkawala ng gantimpala
  rationale: Mabigat ang kondisyunal na babala sa Griyego, ngunit hindi tinutukoy ng mismong talata ang buong sistematikong kategorya ng hatol. Pinananatili ang tensiyong teolohikal nang walang dagdag na paliwanag.
- issue: Saklaw ng ἀδελφῷ
  choice: kanyang kapatid
  alternative: kapatid na lalaki o babae; kapuwa mananampalataya
  rationale: Ang anyong Griyego ay panlalaking isahan, ngunit sa konteksto ay maaari itong kumatawan sa kapuwa alagad o mananampalataya. Pinanatili ang anyo sa teksto at inilagay ang paliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “taos-puso” bilang karaniwang idyoma para sa panloob at tapat na pagpapatawad, samantalang iniingatan sa talababa ang literal na maramihang “mga puso.”
