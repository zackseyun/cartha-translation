  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Hindi ko sinasabi sa iyo na hanggang pitong beses lamang, kundi hanggang pitumpu't pitong beses[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pitumpung ulit na pito.”
    reason: Pinananatili ang alternatibong pagbasa sa malabong pariralang Griyego na ἑβδομηκοντάκις ἑπτά.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Sinabi sa kanya ni Jesus
  rationale: Natural na salaysay sa modernong Filipino ang aspektong naganap na “Sinabi,” kahit nasa historical present ang Griyego. Pinanatili ang panghalip na “sa kanya” sa halip na ipalit ang pangalang Pedro.
- source_word: Οὐ λέγω σοι
  choice: Hindi ko sinasabi sa iyo
  rationale: Direkta at natural na katumbas na nagpapanatili sa pandiwang “sinasabi” at sa tahasang kausap na “sa iyo.”
- source_word: ἕως ἑπτάκις
  choice: hanggang pitong beses lamang
  rationale: Sa konteksto ng pagbibilang, malinaw na ipinapahayag ng “hanggang” ang iminungkahing hangganan; nililinaw ng “lamang” ang paghahambing nang hindi binabago ang diwa.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ang natural na panalungat sa hulmaing negatibong “hindi … kundi …” sa Filipino.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: pitumpu't pitong beses
  rationale: Pinipili nito ang tuwirang pagbasa na “pitumpu't pito,” habang inilalagay sa talababa ang posibleng pagbasa na “pitumpung ulit na pito” upang mapanatili ang tunay na kalabuan ng Griyego.
theological_decisions:
- issue: Malabong bilang sa turo ni Jesus tungkol sa pagpapatawad
  choice: pitumpu't pitong beses
  alternative: pitumpung ulit na pito
  rationale: Maaaring unawain ang ἑβδομηκοντάκις ἑπτά bilang 77 o bilang 70 × 7. Pinili sa pangunahing teksto ang mas tuwirang pagbasa ngunit pinanatili sa talababa ang tradisyonal na alternatibo, nang hindi ipinapakahulugan sa salin kung ang bilang ay literal na pinakamataas na hangganan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “beses lamang” sa halip na mas kolokyal na “beses lang.” Inilagay ang pananda ng talababa kaagad pagkatapos ng malabong bilang.
