  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: tl
  text: Nang magsimula siyang magtuos ng mga kuwenta, dinala sa kanya ang isang may utang na sampung libong talento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talento ay napakalaking yunit ng salapi; sa talinghagang ito, ang “sampung libong talento” ay kumakatawan sa di-malirip na laki ng utang.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Nang magsimula na siya
  rationale: Ang genitive absolute ay nagbibigay ng pangyayaring kasabay o panimulang panahon ng pangunahing kilos. Likas sa Tagalog ang “Nang magsimula na siya” at hindi nito labis na tinutukoy ang eksaktong pagkakasunod-sunod.
- source_word: συναίρειν
  choice: magtuos ng mga kuwenta
  rationale: Sa kontekstong pinansiyal, tumutukoy ito sa pagsusuri at pagsasaayos ng mga pagkakautang. Ang “magtuos ng mga kuwenta” ay malinaw at likas na salin na nagpapanatili sa larawang pampinansiya.
- source_word: προσηνέχθη
  choice: dinala
  rationale: Ipinapakita ng aorist passive na may ibang nagdala sa may utang sa harap ng hari. Ang “dinala” ang tuwiran at natural na katumbas.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na naihahayag ng “sa kanya” ang dative kasama ng pasibong anyo ng προσφέρω, nang hindi dinaragdagan ang teksto.
- source_word: εἷς ὀφειλέτης
  choice: ang isang may utang
  rationale: Pinananatili ng “isang” ang tahasang εἷς at ipinakikilala ang isang partikular na kaso. Mas karaniwan at madaling maunawaan sa modernong Tagalog ang “may utang” kaysa “debtor” o mas teknikal na katawagan.
- source_word: μυρίων ταλάντων
  choice: sampung libong talento
  rationale: Ang μύριοι ay literal na “sampung libo” at nagpapahiwatig din ng napakalaking bilang. Pinanatili ang “talento” bilang makasaysayang yunit sa halip na tumbasan ng makabagong salapi, sapagkat hindi tiyak ang eksaktong modernong halaga.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magtuos ng mga kuwenta” upang mapanatili ang larawang pampinansiya, at ang “talento” ay ipinaliwanag sa talababa upang maiwasan ang maling pagkaunawa rito bilang likas na kakayahan.
