  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: tl
  text: Kaya, nang makita ng mga kapwa niyang alipin[a] ang nangyari, labis silang nalungkot, at lumapit sila sa sarili nilang amo[b] at iniulat dito ang lahat ng nangyari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kapwa niyang lingkod.” Ang salitang Griyego ay tumutukoy sa mga kapwa alipin; sa talinghaga, sila ay nasa ilalim ng iisang amo.
    reason: lexical_alternative
  - marker: b
    text: O “panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig nito ang bunga o pagpapatuloy ng salaysay mula sa naunang pangyayari, at natural itong pakinggan sa makabagong Tagalog.
- source_word: σύνδουλοι
  choice: mga kapwa niya alipin
  rationale: Ang tambalang salita ay tumutukoy sa mga taong kapwa nasa kalagayan ng pagkaalipin sa ilalim ng iisang amo. Pinananatili ng “alipin” ang mahalagang ugnayang panlipunan sa talinghaga.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ang nangyari / ang lahat ng nangyari
  rationale: Natural na salin ito ng substantibong participle ng γίνομαι; pinananatili ng “lahat” sa ikalawang banggit ang diin ng πάντα.
- source_word: ἐλυπήθησαν σφόδρα
  choice: labis silang nalungkot
  rationale: Ipinapahayag ng λυπέω ang matinding dalamhati o pagkalungkot, at malinaw na naihahatid ng “labis” ang pagpapalakas ng σφόδρα.
- source_word: ἐλθόντες
  choice: Lumapit sila
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pag-uulat. Sa konteksto, likas sa Tagalog ang “lumapit” para sa pagpunta ng mga alipin sa kanilang amo.
- source_word: διεσάφησαν
  choice: iniulat
  rationale: Ang pandiwa ay maaaring mangahulugang ipaliwanag nang malinaw o iulat nang buo. Ang “iniulat” ay angkop sa pagsasabi ng mga nasasakupan sa kanilang amo, habang ang saklaw nito ay ipinakikita na ng “lahat.”
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: sa kanilang amo
  rationale: Bagaman maaaring tumbasan ang κύριος ng “panginoon,” mas natural at tiyak sa kontekstong ito ang “amo” para sa taong may kapangyarihan sa mga alipin sa talinghaga.
theological_decisions:
- issue: Pagsasalin sa salitang mula sa pamilyang δοῦλος sa kalagayang panlipunan ng talinghaga
  choice: mga kapwa niya alipin
  alternative: mga kapwa niya lingkod
  rationale: Mahalaga sa takbo ng talinghaga na sila ay magkakapantay sa kalagayan sa ilalim ng iisang amo. Hindi pinapalambot ng “alipin” ang katayuang ipinahahayag ng σύνδουλοι.
- issue: Pagsasalin sa κύριος kapag tumutukoy sa taong nakatataas
  choice: amo
  alternative: panginoon
  rationale: Tao at may-ari ng mga alipin ang tinutukoy sa loob ng talinghaga. Iniiwasan ng “amo” ang di-kinakailangang pagpapahiwatig na tuwirang banal ang tinutukoy, ngunit kinikilala sa talababa ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “alipin” at “amo” upang maging tiyak ang ugnayang panlipunan sa talinghaga; nananatiling maikli at natural ang ayos ng salaysay.
