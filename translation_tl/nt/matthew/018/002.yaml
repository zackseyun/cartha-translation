lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Tinawag ni Jesus
  rationale: Likas na salin ng participle na nangangahulugang tumawag o magpatawag upang lumapit. Ginawang tahasan ang simuno na si Jesus ayon sa konteksto.
- source_word: παιδίον
  choice: isang bata
  rationale: Karaniwang katawagan sa isang batang paslit o bata; hindi tinutukoy ng Griyego ang kasarian.
- source_word: ἔστησεν αὐτό
  choice: pinatayo ito
  rationale: Ang causative transitive form ay nagpapahiwatig na inilagay o pinatayo ni Jesus ang bata; pinananatili ng 'pinatayo' ang larawan ng pagtayo sa gitna.
- source_word: ἐν μέσῳ αὐτῶν
  choice: sa gitna nila
  rationale: Tuwirang at natural na katumbas ng pariralang nagsasaad ng lokasyon sa kalagitnaan ng pangkat.
