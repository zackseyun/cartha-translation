base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: tl
  text: At ang sinumang tumanggap[a] ng isang batang tulad nito[b] sa aking pangalan ay tumatanggap sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malugod na tumanggap.” Ang pandiwang Griyego ay maaaring mangahulugang “tumanggap,” “malugod na tumanggap,” o “tanggapin.”
    reason: lexical_alternative
  - marker: b
    text: Literal na, “isang batang tulad nito”; walang salitang “maliit” sa Griyego ng talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: ang sinuman
  rationale: Ang panghalip na may ἐάν ay nagpapahayag ng pangkalahatan at di-tiyak na kondisyon; natural itong naihahayag sa Filipino bilang “ang sinuman.”
- source_word: δέξηται / δέχεται
  choice: tumanggap / tumatanggap
  rationale: 'Pinananatili ng magkaugnay na anyo ng “tumanggap” ang pag-uulit ng iisang pandiwang Griyego at ang tuwirang ugnayan: ang pagtanggap sa bata ay pagtanggap kay Jesus. Maaari rin itong mangahulugang “malugod na tumanggap” o “tumalima,” ngunit hindi kailangang paliitin ang saklaw sa pangunahing teksto.'
- source_word: ἓν παιδίον τοιοῦτο
  choice: sa isang batang tulad nito
  rationale: Tumutukoy ang παιδίον sa isang bata, at inilalarawan ng τοιοῦτο ang batang ito bilang “tulad nito.” Hindi idinagdag ang “maliit” sapagkat walang katumbas na μικρόν sa talata.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: sa pangalan ko
  rationale: Natural at nakaugaliang pahayag ito sa Filipino para sa pagtanggap na ginagawa kaugnay ng pangalan, awtoridad, o pagkilala kay Jesus, nang hindi nililimitahan sa iisang kahulugan.
- source_word: ἐμὲ
  choice: sa akin
  rationale: Ang mariing panghalip na Griyego ay natural na isinasalin bilang “sa akin”; ang pag-uulit ng pandiwa at hulíng puwesto nito sa pangungusap ay sapat upang idiin ang pagkakakilanlan.
theological_decisions:
- issue: Kinatawang pagkakakilanlan ng bata at ni Jesus
  choice: Ang pagtanggap sa isang batang tulad nito sa pangalan ni Jesus ay pagtanggap mismo kay Jesus.
  alternative: Maaaring palambutin bilang simpleng pagbibigay-galang kay Jesus sa pamamagitan ng pagtanggap sa bata.
  rationale: Ang paglipat ng layon mula sa “isang batang tulad nito” tungo sa “akin,” habang inuulit ang δέχομαι, ay nagpapahayag ng matibay na kinatawang pagkakakilanlan. Hindi dinaragdagan ang talata ng sakramental o eklesyal na implikasyong hindi nito tahasang sinasabi.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang pag-uulit ng “tumanggap” upang maipakita ang tuwirang ugnayan ng dalawang sugnay, at iniwasan ang tradisyonal na pagdaragdag ng “maliit” na wala sa tekstong Griyego.
