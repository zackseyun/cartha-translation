base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: tl
  text: Ngunit dahil wala siyang maibayad, iniutos ng kanyang amo[a] na ipagbili siya, ang kanyang asawa at mga anak, at lahat ng kanyang ari-arian, at mabayaran ang pagkakautang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panginoon niya.” Ang Griyegong κύριος ay maaaring mangahulugang “panginoon” o “amo”; dito, tumutukoy ito sa nakatataas sa alipin sa loob ng talinghaga.
    reason: lexical_alternative
  - marker: b
    text: Iniutos na ipagbili ang lalaki at ang kanyang pamilya, pati ang kanyang mga ari-arian, upang makalikom ng pambayad sa pagkakautang.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Ngunit dahil wala siyang maibayad
  rationale: Ang genitive absolute ay nagsasaad ng dahilan o kalagayan. Likas sa modernong Tagalog ang “wala siyang maibayad,” at ipinahihiwatig nito ang kawalan niya ng kakayahang magbayad nang hindi nagdaragdag ng tahasang bagay na wala sa Griyego.
- source_word: ἐκέλευσεν
  choice: iniutos
  rationale: Ipinapahayag ng κελεύω ang makapangyarihang pag-uutos; malinaw at natural ang “iniutos” sa konteksto.
- source_word: ὁ κύριος
  choice: ang panginoon niya
  rationale: Sa talinghaga, ang κύριος ay ang taong nakatataas sa alipin, hindi isang tuwirang banal na titulo. Pinananatili ng maliit-na-titik na “panginoon” ang pangunahing diwa, at nililinaw ng “niya” ang ugnayan na malinaw sa konteksto.
- source_word: πραθῆναι
  choice: na ipagbili siya
  rationale: 'Ang pasibong infinitive ay natural na isinasalin bilang nilalaman ng utos: “na ipagbili siya.” Pinananatili nito ang diwa ng pagbebenta sa isang taong nasa pagkaalipin o pagkakautang.'
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: pati ang kanyang asawa at mga anak
  rationale: Likas sa Tagalog ang paggamit ng pang-angkop na pag-aari para sa pamilya; ang “pati” ay malinaw na nag-uugnay sa kanila bilang kasama sa ipagbibili.
- source_word: πάντα ὅσα ἔχει
  choice: ang lahat ng kanyang ari-arian
  rationale: Tumutukoy ang parirala sa kabuuan ng kanyang pag-aari. Ang “ari-arian” ay malinaw na nagbubukod sa mga bagay na pag-aari mula sa naunang binanggit na pamilya.
- source_word: καὶ ἀποδοθῆναι
  choice: upang may maibayad
  rationale: Bagaman koordinado sa Griyego bilang isa pang pasibong infinitive, ipinakikita ng sugnay ang layunin o resulta ng pagbebenta. Ang “upang may maibayad” ay natural at hindi tahasang nagdaragdag ng salitang “utang.”
theological_decisions:
- issue: Pagpapakahulugan sa κύριος sa loob ng talinghaga
  choice: ang panginoon niya
  alternative: ang amo niya
  rationale: Ang tinutukoy ay ang taong nakatataas sa alipin sa kuwento. Pinananatili ng “panginoon” ang saklaw ng κύριος, samantalang nililinaw ng talababa na maaari rin itong isaling “amo” at hindi ito rito isang tuwirang banal na titulo.
- issue: Saklaw ng iniutos na pagbebenta
  choice: ipagbili siya, pati ang kanyang asawa at mga anak at ang lahat ng kanyang ari-arian
  alternative: ipagbili siya at ang kanyang asawa at mga anak, at ipagbili ang lahat ng kanyang ari-arian
  rationale: Pinananatili ng salin ang magkakasunod na mga bagay ng πραθῆναι ayon sa Griyego, habang ipinapaliwanag sa talababa ang kultural at pinansiyal na layunin ng buong utos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maibayad” sa magkabilang bahagi upang mapanatili ang ugnayan ng aktibo at pasibong anyo ng ἀποδίδωμι, at “panginoon” sa maliit na titik upang maiwasang ipakahulugan ito bilang tuwirang banal na titulo.
