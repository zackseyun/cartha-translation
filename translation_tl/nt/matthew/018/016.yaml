base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: tl
  text: Ngunit kung hindi siya makinig, isama mo pa ang isa o dalawa upang sa bibig ng dalawa o tatlong saksi ay mapagtibay ang bawat usapin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “sa patotoo ng dalawa o tatlong saksi.”
    reason: lexical_alternative
  - marker: b
    text: Alusyon sa Deuteronomio 19:15, kung saan pinagtitibay ang isang usapin sa pamamagitan ng dalawa o tatlong saksi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: makinig
  rationale: Sa konteksto, tumutukoy ito hindi lamang sa pandinig kundi sa pakikinig na may pagtugon o pagsunod.
- source_word: παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο
  choice: magsama ka pa ng isa o dalawa
  rationale: Likas na utos sa Filipino na ipinapahayag ang pagsama sa mga karagdagang tao; pinananatili ng “pa” ang diwa ng ἔτι.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ang layunin ng susunod na sugnay sa isang marangal ngunit karaniwang rehistro.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: sa bibig ng dalawa o tatlong saksi
  rationale: Pinananatili ang Semitikong idyomang legal at ang malinaw na alusyon sa Deuteronomio 19:15, habang maipaliliwanag sa talababa ang kahulugang “sa patotoo.”
- source_word: σταθῇ
  choice: mapagtibay
  rationale: Ang pasibong anyo sa kontekstong legal ay tumutukoy sa pagkumpirma o pagtatatag ng bisa ng isang usapin.
- source_word: πᾶν ῥῆμα
  choice: bawat usapin
  rationale: Bagaman maaaring literal na “bawat salita,” sa legal na konteksto at alusyon sa Deuteronomio ay mas natural at tumpak ang “bawat usapin,” nang hindi ito nililimitahan sa isang paratang lamang.
theological_decisions:
- issue: Ang pormula ng mga saksi mula sa Kautusan sa konteksto ng pagtutuwid sa komunidad
  choice: Panatilihin ang idyomang “sa bibig ng dalawa o tatlong saksi” at ang malawak na “bawat usapin.”
  alternative: Isalin nang higit na interpretibo bilang “sa patotoo ng dalawa o tatlong saksi ay mapagtibay ang bawat paratang.”
  rationale: Pinananatili nito ang alusyon sa Deuteronomio 19:15 at ang legal na bigat ng teksto nang hindi ipinapalagay na ang ῥῆμα ay tumutukoy lamang sa isang pormal na paratang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang neutral na “siya,” ang likas na utos na “magsama ka pa,” at ang pormal ngunit madaling maunawaang “mapagtibay” at “usapin.”
