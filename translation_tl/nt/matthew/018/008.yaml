id: MAT.18.8
reference: Matthew 18:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: tl
  text: At kung ang kamay mo o ang paa mo ay nagpapatisod sa iyo[a], putulin mo ito at itapon mo palayo sa iyo. Mas mabuti para sa iyo na pumasok sa buhay na naputulan ng kamay o pilay kaysa maitapon sa apoy na walang hanggan nang may dalawang kamay o dalawang paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagtutulak sa iyo na magkasala.” Literal na nangangahulugan ang pandiwang Griyego na “nagpapatisod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: nagpapatisod sa iyo
  rationale: Pinananatili nito ang konkretong talinghaga ng pagkatisod sa Griyego habang nauunawaan pa rin sa konteksto ang pahiwatig na pagkakasala.
- source_word: ἔκκοψον
  choice: putulin mo ito
  rationale: Tuwiran at mariing katumbas ito ng utos na putulin ang kamay o paa; hindi nito pinalalambot ang matinding larawan.
- source_word: βάλε ἀπὸ σοῦ
  choice: itapon palayo sa iyo
  rationale: Ipinahahayag nito kapwa ang marahas na pagtatapon at ang ganap na paglalayo sa sarili.
- source_word: καλόν σοί ἐστιν
  choice: Mas mabuti para sa iyo
  rationale: Bagaman maaaring mangahulugang 'mabuti' ang καλόν, ang kasunod na paghahambing ay humihingi ng likas na Filipino na 'mas mabuti.'
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: pumasok sa buhay
  rationale: Pinananatili ang payak ngunit teolohikal na mabigat na 'buhay' nang hindi idinaragdag sa bahaging ito ang salitang 'walang hanggan.'
- source_word: κυλλὸν
  choice: putol ang isang kamay
  rationale: Sa agarang konteksto ng pagputol ng kamay, malinaw at natural nitong ipinahahayag ang kalagayang tinutukoy ng κυλλός, na napinsala o nawalan ng kamay o biyas.
- source_word: χωλόν
  choice: pilay
  rationale: Ang 'pilay' ang tuwiran, kasalukuyan, at kontekstuwal na katumbas para sa kapansanan sa paa o paglakad.
- source_word: ἔχοντα
  choice: nang may
  rationale: Likas itong Filipino para sa participyal na diwang 'having' at malinaw na pinananatili ang paghahambing.
- source_word: βληθῆναι
  choice: maitapon
  rationale: Pinananatili nito ang balintiyak na anyo at ang malakas na kilos ng βάλλω.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: apoy na walang hanggan
  rationale: Ito ang malinaw at natural na Filipino para sa αἰώνιος sa konteksto ng panghuling paghatol.
theological_decisions:
- issue: Kung isasalin ang σκανδαλίζει bilang tuwirang pagkakasala o pananatilihin ang talinghaga ng pagkatisod
  choice: nagpapatisod sa iyo
  alternative: nagtutulak sa iyo na magkasala
  rationale: Pinananatili ng pangunahing teksto ang talinghaga ng Griyego; inilalagay sa talababa ang malinaw na moral na kahulugan nang hindi pinapawi ang larawan.
- issue: Kahulugan ng buhay sa εἰς τὴν ζωὴν
  choice: buhay
  alternative: buhay na walang hanggan
  rationale: Eskatolohikal ang diwa ayon sa konteksto, ngunit 'buhay' lamang ang tahasang nasa Griyego. Hinahayaang linawin ng kaibahan sa apoy na walang hanggan ang bigat nito.
- issue: Kung ipaliliwanag bilang eksaherasyon ang utos na putulin ang kamay o paa
  choice: panatilihin ang literal at matinding anyo ng utos
  alternative: iparaprasang alisin ang anumang nagtutulak sa pagkakasala
  rationale: Hindi tahasang nilulutas ng talata kung paano dapat unawain ang larawan. Dapat panatilihin ng salin ang tindi at teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding larawan ng talata at iniwasan ang lumang pananalitang gaya ng “ihagis” o “pingkaw” kung makahahadlang sa karaniwang mambabasa.
