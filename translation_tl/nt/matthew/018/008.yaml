  to: At kung ang kamay mo o ang paa mo ay nagpapatisod sa iyo[a], putulin mo ito at itapon mo palayo sa iyo. Mas mabuti para sa iyo na pumasok sa buhay na naputulan ng kamay o pilay kaysa maitapon sa apoy na walang hanggan nang may dalawang kamay o dalawang paa.
  rationale: Inayos ang paglalarawan sa κυλλόν upang maging natural na Filipino at maiwasan ang di-kinakailangang bilang na “isang,” habang pinananatili ang kaibahan ng kapinsalaan sa kamay at pagkapilay. Ginawang mas tuwiran ang ikalawang utos at itinama ang paglalarawan ng literal na diwa sa talababa. Walang pagbabagong doktrinal o pagpapaliwanag na idinagdag.
