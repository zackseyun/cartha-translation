  naturalness: Natural at marangal ang rehistro sa pangkalahatan. Ang ‘mas mabuti pa para sa kanya,’ ‘bitinan siya,’ at ‘ilubog siya’ ay mas idiomatiko at mas malinaw sa modernong Filipino kaysa sa kasalukuyang sintaks.
  terminology: Ang ‘sumasampalataya sa akin,’ ‘mga maliliit na ito,’ ‘batong panggiling,’ at ‘laot’ ay angkop. Napananatili ng ‘matisod’ ang talinghaga nang hindi ito nililimitahan sa pagkakasala lamang.
