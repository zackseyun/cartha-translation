id: MAT.18.6
reference: Matthew 18:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: tl
  text: Ngunit ang sinumang maging dahilan upang matisod[a] ang isa sa mga maliliit na ito na sumasampalataya sa akin, mas mabuti pa para sa kanya na bitinan siya sa leeg ng isang malaking batong panggiling na iniikot ng asno[b] at ilubog siya sa laot.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging dahilan upang magkasala ang isa sa mga maliliit na ito na sumasampalataya sa akin.” Ang pandiwang Griyego ay maaaring mangahulugang maging dahilan ng pagkatisod, pagkakasala, o pagtalikod.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa malaking batong panggiling na pinaiikot ng asno, hindi sa maliit na gilingang-kamay.
    reason: cultural_note
  - marker: c
    text: O “sa malalim na bahagi ng dagat.” Ang Griyego ay tumutukoy sa laot o malawak na dagat na malayo sa pampang.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: maging dahilan upang matisod
  rationale: Pinananatili ang talinghaga ng pagkatisod at ang malawak na diwa ng pag-akay sa pagkakasala, pagbagsak, o pagtalikod, sa halip na paliitin ito sa isang resulta lamang.
- source_word: μικρῶν τούτων
  choice: maliliit na ito
  rationale: Hindi nililimitahan sa mga batang musmos lamang; maaari rin itong tumukoy sa mga alagad na mababa ang kalagayan o madaling mapinsala.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: na sumasampalataya sa akin
  rationale: Tuwirang ipinapahayag ang pagtitiwala at pananampalataya kay Jesus sa natural at marangal na Filipino.
- source_word: συμφέρει αὐτῷ
  choice: mas mabuti pa sa kanya
  rationale: Likas na Filipino para sa paghahambing ng kapakinabangan sa matinding babalang ito.
- source_word: μύλος ὀνικὸς
  choice: isang malaking batong panggiling na iniikot ng asno
  rationale: Nililinaw ang uri ng malaking batong panggiling na pinaiikot ng asno, bilang kaibahan sa maliit na gilingang-kamay.
- source_word: καταποντισθῇ
  choice: lunurin siya
  rationale: Malinaw na ipinapakita ang paglubog at pagkamatay sa malalim na tubig na ipinahihiwatig ng pandiwang pasibo.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: sa laot
  rationale: Ang 'laot' ay maikli at tumpak na tumutukoy sa malawak at malalim na bahagi ng dagat na malayo sa pampang.
theological_decisions:
- issue: Saklaw ng “maliliit na ito”
  choice: Pinanatiling malawak bilang “maliliit na ito na sumasampalataya sa akin.”
  alternative: “mga batang ito na sumasampalataya sa akin”
  rationale: Bagaman may bata sa agarang konteksto, ang pariralang “sumasampalataya sa akin” ay maaaring magpalawak ng tinutukoy sa mga alagad na itinuturing na aba, mababa, o madaling mapinsala. Hindi nilulutas ng salin ang tunay na pag-igting na ito.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “matisod” upang mapanatili ang talinghaga at ang “laot” para sa maikli ngunit tumpak na paglalarawan. Ipinaliwanag sa talababa ang batong panggiling upang maging malinaw ang sinaunang larawang kultural.
