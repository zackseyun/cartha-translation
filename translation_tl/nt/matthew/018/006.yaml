  to: Ngunit ang sinumang maging dahilan upang matisod[a] ang isa sa mga maliliit na ito na sumasampalataya sa akin, mas mabuti pa para sa kanya na bitinan siya sa leeg ng isang malaking batong panggiling na iniikot ng asno[b] at ilubog siya sa laot.[c]
