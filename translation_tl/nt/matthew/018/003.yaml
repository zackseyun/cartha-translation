source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: tl
  text: At sinabi niya, “Katotohanang sinasabi ko sa inyo, malibang bumaling[a] kayo at maging tulad ng mga bata, hinding-hindi kayo makapapasok sa kaharian ng langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maibaling kayo.” Maaaring unawain ang anyong Griyego bilang kusang pagbaling o bilang isang pagbaling na hindi tinutukoy ang gumagawa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμὴν
  choice: Katotohanang
  rationale: Ipinahahayag nito ang marubdob at may-awtoridad na panimulang pormula ni Jesus. Likas ito sa marangal na Filipino at malinaw ang diwa kaysa panatilihin lamang ang ‘Amen.’
- source_word: στραφῆτε
  choice: bumaling
  rationale: Pinananatili nito ang larawan ng isang tiyak na pagbaling o pagbabago ng direksiyon nang hindi gumagamit ng teknikal at makadenominasyong katawagang ‘makumberte.’ Maaari ring unawain ang anyong Griyego bilang ‘ibaling,’ kaya nilagyan ng talababa.
- source_word: γένησθε
  choice: maging
  rationale: Tuwirang ipinahahayag ang pagbabago ng kalagayan at likas na kaagapay ng ‘bumaling’ sa Filipino.
- source_word: ὡς τὰ παιδία
  choice: tulad ng mga bata
  rationale: Natural na pangkalahatang paghahambing ito sa Filipino at hindi nagdaragdag ng katangiang gaya ng kawalang-malay o kapakumbabaan na hindi tahasang binanggit sa talata.
- source_word: οὐ μὴ εἰσέλθητε
  choice: hinding-hindi kayo makapapasok
  rationale: Ang ‘hinding-hindi’ ay malinaw na naghahatid ng mariing pagtanggi ng οὐ μή; ang ‘makapapasok’ ay natural sa Filipino para sa pagpasok sa kaharian.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: kaharian ng langit
  rationale: Ito ang likas at nakaugaliang salin sa Filipino ng natatanging parirala ni Mateo, nang hindi pinipilit ang literal na pangmaramihang ‘mga langit.’
theological_decisions:
- issue: Ang kahulugan ng στραφῆτε bilang panawagang kahawig ng pagbabalik-loob
  choice: bumaling
  alternative: makumberte; magbalik-loob; ibaling
  rationale: Ipinakikita ng ‘bumaling’ ang tiyak na muling pagtuon na hinihingi ng teksto ngunit hindi ito ginagawang teknikal na termino ng isang partikular na tradisyong teolohikal. Kinikilala sa talababa ang maaaring pasibong pagbasa.
- issue: Kung anong katangian ng mga bata ang tinutukoy
  choice: tulad ng mga bata
  alternative: maging mapagpakumbaba o walang-malay na tulad ng mga bata
  rationale: Paghahambing sa mga bata mismo ang nasa Griyego. Hindi tahasang tinutukoy ng talatang ito lamang kung aling katangian nila ang mahalaga, kaya pinananatiling bukas ang interpretasyon.
- issue: Lakas ng babala tungkol sa pagpasok sa kaharian
  choice: hinding-hindi kayo makapapasok
  alternative: hindi kayo makapapasok
  rationale: Pinananatili ng mariing anyo ang puwersa ng dobleng negasyong οὐ μή nang hindi ipinapaliwanag kung paano kaugnay nito ang mas malawak na doktrina ng kaligtasan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘Katotohanang sinasabi ko sa inyo’ bilang pormal ngunit malinaw na pormula, ‘bumaling’ upang iwasan ang teknikal na salitang panrelihiyon, at ‘hinding-hindi’ upang mapanatili ang mariing negasyon.
