  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: tl
  text: Noong oras na iyon, lumapit kay Jesus ang mga alagad at nagtanong, “Sino nga ang mas dakila sa kaharian ng langit?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Nang oras na iyon
  rationale: Likas at malinaw na panandang temporal sa modernong Tagalog, habang pinananatili ang tuwirang kahulugan ng pariralang Griyego.
- source_word: προσῆλθον
  choice: lumapit
  rationale: Tuwirang inilalarawan ang paglapit ng mga alagad kay Jesus.
- source_word: λέγοντες
  choice: at nagtanong
  rationale: Bagaman literal na “na nagsasabi,” ang kasunod ay isang tuwirang tanong; mas natural sa Tagalog ang “at nagtanong” nang hindi binabago ang kilos sa salaysay.
- source_word: Τίς ἄρα
  choice: Sino nga
  rationale: Ang “nga” ay naghahatid ng inferensiyal o deliberatibong himig ng ἄρα nang hindi ito labis na ipinapaliwanag.
- source_word: μείζων
  choice: mas dakila
  rationale: Pinananatili ang anyong pahambing na “greater,” hindi ginagawang pasukdol na “pinakadakila.” Ang “dakila” ay angkop sa ranggo o katayuan sa kontekstong ito.
- source_word: βασιλείᾳ τῶν οὐρανῶν
  choice: kaharian ng langit
  rationale: Karaniwan, marangal, at malapit sa anyong Mateo ng pariralang Griyego.
theological_decisions:
- issue: Pahambing o pasukdol na diwa ng μείζων
  choice: mas dakila
  alternative: pinakadakila
  rationale: Ang anyong Griyego ay pahambing. Pinananatili ng salin ang tunay na pormang “mas dakila” at hindi tahimik na binabago tungo sa pasukdol.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang sobrang literal na “na nagsasabi” at pinanatili ang mahalagang pahambing na anyo ng tanong.
