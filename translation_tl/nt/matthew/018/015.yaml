base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: tl
  text: Ngunit kung magkasala laban sa iyo ang kapatid mo[a], puntahan mo siya at ipakita sa kaniya ang pagkakamali niya nang kayong dalawa lamang. Kung makinig siya sa iyo, napanalo mo ang kapatid mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito, wala ang “laban sa iyo,” kaya ganito ang pagbasa: “Kung magkasala ang kapatid mo, puntahan mo siya at ipakita sa kaniya ang pagkakamali niya nang kayong dalawa lamang.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: magkasala
  rationale: Pinananatili nito ang moral at panrelihiyong bigat ng pandiwang Griyego, at natural na naihahayag sa Filipino ang pangkalahatang kondisyon.
- source_word: εἰς σέ
  choice: sa iyo
  rationale: Likas na katumbas ito ng pariralang tumutukoy na ang kasalanan ay laban sa kausap; isinama ayon sa SBLGNT at itinala sa talababa ang mas maikling pagbasa.
- source_word: ἀδελφός σου
  choice: ang kapatid mo
  rationale: Tapat ito sa pang-isahang anyo at natural sa Filipino; maaaring tumukoy sa kapwa alagad ayon sa konteksto nang hindi iyon ipinapasok bilang pagpapaliwanag sa pangunahing teksto.
- source_word: ὕπαγε
  choice: puntahan mo siya
  rationale: Sa konteksto, malinaw at natural nitong ipinahahayag ang utos na personal na lumapit sa nagkasala.
- source_word: ἔλεγξον
  choice: ipakita sa kaniya ang pagkakamali niya
  rationale: Ipinahahayag nito ang diwa ng paglalantad o pagpapatunay ng pagkakamali nang hindi nagbibigay ng di-kinakailangang bagsik na maaaring taglayin ng 'sawayin'.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: nang kayong dalawa lamang
  rationale: Natural at maikli nitong pinananatili ang diin sa pribado at eksklusibong pag-uusap.
- source_word: ἀκούσῃ
  choice: makinig siya sa iyo
  rationale: Saklaw nito ang pagtugon at pagbibigay-pansin, ngunit hindi labis na nililinaw bilang ganap na pagsunod.
- source_word: ἐκέρδησας
  choice: nabawi mo
  rationale: Sa konteksto ng nasirang ugnayan, natural nitong ipinahahayag ang metapora ng pagkamit sa kapatid; bahagya itong mas kontekstuwal kaysa literal na 'natamo mo'.
theological_decisions:
- issue: Saklaw ng salitang ἀδελφός
  choice: ang kapatid mo
  alternative: ang kapwa mo mananampalataya
  rationale: Pinananatili ng pangunahing teksto ang pang-isahang anyo ng pinagmulan at ang likas na salitang Filipino; hindi tahasang nilalawak ang reperensiya kahit maaari itong tumukoy sa kapwa alagad.
- issue: Kalagayang tekstuwal ng εἰς σέ
  choice: isama ang 'sa iyo' sa pangunahing teksto
  alternative: 'alisin ito: ''kung magkasala ang kapatid mo'''
  rationale: Kasama ang parirala sa ibinigay na SBLGNT, ngunit mahalaga ang mas maikling baryante sapagkat naaapektuhan nito kung personal na kasalanan lamang o mas malawak na kasalanan ang tinutukoy; kaya itinala ito sa talababa.
- issue: Metapora ng κερδαίνω
  choice: nabawi mo ang kapatid mo
  alternative: natamo mo ang kapatid mo
  rationale: Ang 'nabawi' ay likas sa konteksto ng pagkakasundo, bagaman ang pandiwa ay literal na 'nakamit/natamo'; hindi nito ipinapakahulugang awtomatikong nalutas ang lahat ng usapin.
translation_notes:
  register: Makabagong Filipino na dignipikado at madaling maunawaan. Ginamit ang “kapatid” dahil natural itong hindi tahasang nagtatakda ng kasarian sa Filipino, samantalang pinananatili ang pang-isahang reperensiya. Ang ayos na “nang kayong dalawa lamang” ay mas natural kaysa literal na “sa pagitan mo at niya lamang.”
