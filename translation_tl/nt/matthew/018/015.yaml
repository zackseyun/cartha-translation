  terminology: Pinanatili ang “magkasala,” “kapatid,” at “makinig,” na angkop sa moral, pangkapatirang, at kontekstuwal na puwersa ng Griyego. Ang “napanalo mo ang kapatid mo” ay mas malapit sa metapora ng κερδαίνω kaysa “nabawi mo.”
