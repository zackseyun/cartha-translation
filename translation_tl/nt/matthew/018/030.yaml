  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: tl
  text: Ngunit ayaw niya[a]. Sa halip, umalis siya at ipinakulong[b] ang kapwa niya lingkod hanggang sa mabayaran nito ang pagkakautang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumanggi siya”; literal sa Griyego, “hindi niya ibig.”
    reason: lexical_alternative
  - marker: b
    text: O “itinapon niya sa bilangguan.” Mas marahas ang literal na pandiwang Griyego kaysa sa karaniwang “ipinakulong.”
    reason: lexical_alternative
  - marker: c
    text: O “halagang dapat bayaran” o “utang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit … niya
  rationale: Tinutukoy ng substantibong artikulo ang unang lingkod; likas sa Tagalog ang panghalip na nakapaloob sa pandiwang/panaguring “ayaw niya,” habang pinananatili ng “Ngunit” ang pagsalungat.
- source_word: οὐκ ἤθελεν
  choice: ayaw niya
  rationale: Natural at tuwirang ipinahahayag nito ang kawalan ng kagustuhan; hindi nito pinatitindi agad ang kahulugan tungo sa mas tahasang “tumanggi.”
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw nitong ipinakikita ang matinding pagsalungat sa pakiusap na nauna.
- source_word: ἀπελθὼν
  choice: umalis siya
  rationale: Ginawang sugnay na may pandiwa ang aorist participle upang maging natural sa Tagalog at mapanatili ang pagkakasunod ng kilos.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: ipinakulong ang kapwa niya lingkod
  rationale: Ang “ipinakulong” ay natural na Tagalog para sa pagpapapasok o pagpapakulong sa bilangguan. Idinagdag ang kontekstuwal na “kapwa niya lingkod” upang luminaw ang tinutukoy ng panghalip nang hindi binabago ang identidad nito.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Karaniwang Tagalog na panandang temporal na nagtatakda sa hangganan ng pagkakabilanggo.
- source_word: ἀποδῷ
  choice: mabayaran nito
  rationale: Ang pokus sa halagang dapat mabayaran ay natural sa Tagalog at pinananatili ang inaasahang ganap na pagbabayad sa sugnay na may “hanggang sa.”
- source_word: τὸ ὀφειλόμενον
  choice: ang pagkakautang
  rationale: Likas at maikli itong salin ng substantibong participle na tumutukoy sa bagay o halagang dapat bayaran, habang pinananatili ang posibilidad na unawain ito bilang utang o halagang inutang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Iniwasan ang arkaikong “bilangguan” sa pangunahing daloy pabor sa idiomatikong “ipinakulong,” ngunit inilagay sa talababa ang mas literal at marahas na larawan ng Griyego. Ang bawat talababa ay may katumbas na marker sa teksto.
