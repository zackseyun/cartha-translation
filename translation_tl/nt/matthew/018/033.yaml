translation:
  language: tl
  text: Hindi ba dapat ay nagpakita ka rin ng awa sa kapwa mo alipin[a], kung paanong nagpakita rin ako ng awa sa iyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapwa mo lingkod.” Ang salitang Griyego na σύνδουλος ay tumutukoy sa isang taong kapwa alipin sa ilalim ng iisang panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Hindi ba dapat
  rationale: Ipinahahayag ng ἔδει ang moral na pananagutan o nararapat gawin; natural sa makabagong Tagalog ang retorikal na tanong na “Hindi ba dapat.”
- source_word: καὶ σὲ
  choice: mo rin
  rationale: Ang καί ay nagpapakita na ang awa na inaasahan sa alipin ay katumbas ng awang una niyang tinanggap; ipinahahayag ito nang natural ng “rin.”
- source_word: ἐλεῆσαι / ἠλέησα
  choice: kinaawaan / kinaawaan
  rationale: Pinananatili ang pag-uulit ng iisang pandiwang Griyego sa pamamagitan ng iisang salitang-ugat na “awa.” Ang “kinaawaan” ay natural, tuwiran, at may sapat na bigat sa konteksto.
- source_word: τὸν σύνδουλόν σου
  choice: ang kapwa mo alipin
  rationale: Ang σύνδουλος ay isang taong kapwa alipin sa ilalim ng iisang panginoon. Pinananatili ng “kapwa mo alipin” ang ideya ng magkatulad na nakagapos na katayuan at ng σύν-.
- source_word: ὡς κἀγὼ
  choice: kung paanong ... din
  rationale: Malinaw na ipinahahayag ng “kung paanong” ang paghahambing, at ng “din” ang diin ng κἀγώ sa pagkakatulad ng inaasahang awa at ng awang ipinakita ng hari.
theological_decisions:
- issue: Paglalarawan sa σύνδουλος, isang salita sa pamilya ng δοῦλος
  choice: kapwa mo alipin
  alternative: kapwa mo lingkod
  rationale: Sa talinghaga, mahalaga ang nakagapos at nasasakupang katayuan sa ilalim ng hari o panginoon. Mas tumpak dito ang “alipin” kaysa sa mas malambot na “lingkod,” habang inilalahad sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Pinanatili ang anyo ng retorikal na pagsaway at ang tahasang pagkakatulad ng awang tinanggap at awang dapat sanang ipinakita.
