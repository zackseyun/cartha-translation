  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: tl
  text: Kaya nagpatirapa sa harap niya ang kapwa niya alipin[a] at nakiusap, ‘Pagpasensiyahan mo ako, at babayaran kita.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapwa niya lingkod.” Ang salitang Griyego na σύνδουλος ay tumutukoy sa isang taong may kaparehong panginoon; ginamit dito ang “kapwa alipin” dahil mahalaga sa talinghaga ang kanilang kalagayang nasa ilalim ng kapangyarihan ng panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: πεσὼν
  choice: nagpatirapa sa harap niya
  rationale: Ipinahahayag nito ang pisikal na pagbagsak o pagpapatirapa bilang kilos ng mapagpakumbabang pagsusumamo. Nililinaw ng “sa harap niya” ang ugnayan ng kilos sa kausap nang hindi binabago ang diwa.
- source_word: οὖν
  choice: Kaya
  rationale: Iniuugnay nito ang tugon ng kapwa alipin sa naunang pangyayari at natural na isinusulong ang salaysay.
- source_word: σύνδουλος
  choice: kapwa niya alipin
  rationale: Ang σύνδουλος ay taong alipin ng iisang panginoon kasama ng isa pa. Pinananatili ng “kapwa alipin” ang nakagapos na kalagayang mahalaga sa talinghaga, sa halip na palambutin ito bilang karaniwang paglilingkod.
- source_word: παρεκάλει
  choice: nakiusap
  rationale: Sa konteksto, tumutukoy ito sa taimtim na paghingi ng awa. Natural at marangal sa modernong Filipino ang “nakiusap,” habang ipinahihiwatig na ng pagpapatirapa ang tindi ng pagsusumamo.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Pagpasensiyahan mo muna ako
  rationale: Natural na Filipino itong pakiusap na magtimpi at magbigay ng palugit sa isang tao. Ang “muna” ay angkop sa konteksto ng pansamantalang pagtitiis habang hinihintay ang pagbabayad, ngunit hindi nagdaragdag ng tiyak na haba ng panahon.
- source_word: ἀποδώσω σοι
  choice: babayaran kita
  rationale: Malinaw nitong ipinapahayag sa konteksto ng utang ang pangakong magbayad sa pinagkakautangan. Hindi idinagdag ang “lahat” sapagkat wala iyon sa ginamit na tekstong Griyego.
theological_decisions:
- issue: Pagsasalin ng wikang δοῦλος sa σύνδουλος
  choice: Gamitin ang “kapwa niya alipin” sa pangunahing teksto
  alternative: kapwa niya lingkod
  rationale: Ang tagpo ay tungkol sa hari, utang, at mga taong nasa ilalim ng kapangyarihan ng isang panginoon. Mas tapat na pinananatili ng “alipin” ang kalagayang panlipunan at legal na ipinahihiwatig ng σύνδουλος; inilalagay sa talababa ang mas banayad na salin.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nagpatirapa” upang mapanatili ang malinaw na kilos ng pagsusumamo, at ang direktang pananalita ay pinasimple upang madaling maunawaan ng karaniwang mambabasa.
