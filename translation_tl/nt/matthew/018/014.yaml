  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: tl
  text: Gayon din, hindi kalooban ng inyong Ama na nasa langit na mapahamak kahit isa sa maliliit na ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mawala kahit isa sa maliliit na ito.” Ang pandiwang Griyego ay maaaring mangahulugang “mapahamak” o “mawala”; sinusuportahan ng naunang salaysay tungkol sa tupang naligaw ang ikalawang diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Gayon din
  rationale: Likas na inuugnay nito ang pahayag sa naunang talinghaga tungkol sa tupang naligaw at pinananatili ang paghahambing.
- source_word: θέλημα
  choice: kalooban
  rationale: Karaniwan, malinaw, at marangal na katumbas para sa layunin o ninanais ng isang tao.
- source_word: ἔμπροσθεν
  choice: ng
  rationale: Sa pariralang ito, likas sa Tagalog ang ‘kalooban ng inyong Ama.’ Ang literal na ‘sa harapan ng’ ay maaaring magbigay ng maling lokatibong diin at magiging asiwa sa pangungusap.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: inyong Ama na nasa langit
  rationale: Malapit sa anyo ng Griyego at likas sa modernong Tagalog; hindi kailangang tularan ang maramihang anyo ng οὐρανοῖς.
- source_word: ἵνα ἀπόληται
  choice: na mapahamak
  rationale: Pinananatili nito ang mabigat na posibilidad ng kapahamakan, samantalang inilalahad sa talababa ang kahulugang ‘mawala’ na pinatitibay ng agarang konteksto.
- source_word: ἓν
  choice: ang isa man
  rationale: Ang ‘isa man’ ay likas na Tagalog para sa negatibong diwa na ‘kahit isa’ at hindi nangangailangang magdagdag ng hiwalay na salitang walang tuwirang katapat.
- source_word: τῶν μικρῶν τούτων
  choice: sa maliliit na ito
  rationale: Pinananatili ang malawak na pagtukoy sa ‘maliliit’ sa konteksto ng mga alagad at hindi ito nililimitahan sa mga batang maliit ang edad.
theological_decisions:
- issue: Kahulugan ng ἀπόληται kaugnay ng naunang tupang naligaw
  choice: mapahamak
  alternative: mawala
  rationale: Maaaring tumukoy ang pandiwa sa kapahamakan o sa pagkawala/pagkaligaw. Pinananatili ng pangunahing teksto ang bigat ng babala, habang iniingatan ng talababa ang kahulugang itinatampok ng talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘inyong’ upang panatilihin ang maramihang ὑμῶν at ang ‘Ama na nasa langit’ bilang natural ngunit malapit na paglilipat ng pariralang Griyego.
