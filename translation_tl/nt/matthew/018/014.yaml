  source_fidelity: 'Tapat ang pangunahing diwa sa Griyego: ang οὕτως ay maayos na naiuugnay sa naunang talinghaga, ang ‘kalooban ng inyong Ama na nasa langit’ ay idiomatikong katumbas ng θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν, at ang ‘mapahamak’ ay maaaring kumatawan sa ἀπόληται. Wasto ring ingatan sa talababa ang alternatibong ‘mawala,’ na umaayon sa agarang konteksto ng tupang naligaw.'
