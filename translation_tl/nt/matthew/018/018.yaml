  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: tl
  text: '“Katotohanang sinasabi ko sa inyo: Anumang itali ninyo sa lupa ay magiging nakatali na sa langit, at anumang kalagan ninyo sa lupa ay magiging nakalagan na sa langit.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin sa mas tradisyonal na paraan: “Anumang itali ninyo sa lupa ay itatali sa langit, at anumang kalagan ninyo sa lupa ay kakalagan sa langit.” Ang anyong Griyego ay may pandiwang nasa hinaharap na sinamahan ng perfect passive participle; kaya maaari rin itong magpahiwatig ng isang kalagayang naitatag na sa langit.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Tinitiyak ko
  rationale: Ipinahahayag nito sa natural at marangal na modernong Filipino ang taimtim at makapangyarihang pagpapatibay na ipinakikilala ng ἀμήν, nang hindi umaasa sa di-gaanong malinaw na transliterasyong “Amen.”
- source_word: λέγω ὑμῖν
  choice: sa inyo
  rationale: Kasama ng “Tinitiyak ko,” malinaw nitong pinananatili ang tuwirang pakikipag-usap sa maramihang kausap nang hindi inuulit ang di-natural na “sinasabi ko.”
- source_word: ὅσα ἐὰν
  choice: Anumang
  rationale: Natural nitong ipinahahayag ang malawak at di-tiyak na saklaw ng kondisyong Griyego.
- source_word: δήσητε
  choice: itali
  rationale: Pinananatili ang pangunahing metapora ng δέω at ang ugnayan nito sa kabaligtarang λύω, nang hindi ito agad nililimitahan sa “ipagbawal.”
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Karaniwang Filipino para sa makalupang dako na inihahambing sa langit.
- source_word: ἔσται δεδεμένα
  choice: ay nakatali na
  rationale: Ang periphrastic na future na may perfect passive participle ay inilalarawan bilang kalagayang umiiral na sa langit. Mas natural ito sa Filipino kaysa sa mabigat na literal na future perfect.
- source_word: ἐν οὐρανῷ
  choice: sa langit
  rationale: Malinaw at karaniwang katumbas ng singular na οὐρανῷ bilang banal na dako.
- source_word: λύσητε
  choice: kalagan
  rationale: Pinananatili ang konkretong kabaligtaran ng “itali” at ang sadyang lawak ng λύω, sa halip na paliitin agad sa “pahintulutan.”
- source_word: ἔσται λελυμένα
  choice: ay nakalagan na
  rationale: Tumutugma sa perfect-result sense ng unang sugnay at ipinahahayag ang umiiral nang kalagayan sa langit.
theological_decisions:
- issue: Pamanahon at teolohikal na puwersa ng pagtali at pagkakalag
  choice: “ay nakatali na ... ay nakalagan na sa langit”
  alternative: “ay tatalian ... ay kakalagan sa langit” o “ay matatali ... ay makakalag sa langit”
  rationale: Ang ἔσται na kasama ng perfect passive participle ay maaaring tumukoy sa isang kalagayang naitatag na at umiiral sa langit. Pinananatili ng salin ang ugnayan ng makalupang kilos at makalangit na kalagayan nang hindi nagpapasya para sa isang partikular na doktrina tungkol sa awtoridad ng iglesya. Inilalagay sa talababa ang mas tradisyonal na simpleng-future na pagbasa dahil posible rin itong paraan ng pagsasalin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang metaporang “itali/kalagan” upang huwag paliitin ang kahulugan sa juridikal na “ipagbawal/ipahintulot.” Ginamit ang hulaping -in sa “kalagan,” na angkop kapag ang bagay na kinakalagan ang tuwirang layon. Ang marker na [a] ay nasa pangunahing teksto.
