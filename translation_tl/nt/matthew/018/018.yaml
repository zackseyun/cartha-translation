review_pass:
  verdict: revise
  source_fidelity: Kailangang maipakita sa pangunahing salin ang aspektong hinaharap ng ἔσται kasama ng perfect passive participle. Ang “ay nakatali na/ay nakalagan na” ay malinaw na kasalukuyan o nakaraang kalagayan sa Filipino at nawawala ang pahiwatig na panghinaharap ng Griyego. Ang “magiging nakatali na/magiging nakalagan na” ay mas malinaw na katumbas ng isang kalagayang sa panahong iyon ay naitatag na. Ang “Katotohanang sinasabi ko sa inyo” ay mas tuwirang kumakatawan sa ἀμὴν λέγω ὑμῖν kaysa “Tinitiyak ko sa inyo,” na pinagsasama at bahagyang binabago ang dalawang sangkap ng pormula.
  naturalness: Natural at marangal ang “Katotohanang sinasabi ko sa inyo” sa modernong Filipino, lalo na sa rehistrong pang-Kasulatan. Ang “magiging nakatali na” at “magiging nakalagan na” ay bahagyang mas pormal ngunit malinaw at kinakailangan upang mapanatili ang pamanahong puwersa ng pinagmulan. Nananatiling natural ang pares na “itali/kalagan.”
  terminology: 'Ang “itali” at “kalagan” ay angkop na magkaparis at hindi nagpapaliit sa saklaw ng δήσητε at λύσητε tungo lamang sa pagbabawal o pagpapahintulot. Ang “langit” ay angkop para sa ἐν οὐρανῷ. Inayos ang talababa upang ang alternatibong tradisyonal na salin ay tunay na passive sa Filipino: “itatali ... kakalagan.”'
  issues:
  - severity: medium
    issue: Nawawala sa pangunahing teksto ang aspektong hinaharap ng ἔσται.
    rationale: Ang “ay nakatali na ... ay nakalagan na” ay hindi tahasang nagmamarka ng hinaharap, samantalang ang Griyego ay may future εἰμί na may perfect passive participle. Ang “magiging ... na” ay pinananatili kapwa ang hinaharap na punto at ang resultang kalagayan.
  - severity: low
    issue: Ang pambungad na “Tinitiyak ko sa inyo” ay hindi tuwirang isinasalin ang λέγω.
    rationale: Bagaman naipahihiwatig nito ang awtoritatibong pagpapatibay, ang “Katotohanang sinasabi ko sa inyo” ay mas malapit sa ἀμὴν λέγω ὑμῖν at natural pa rin sa rehistrong ito.
  - severity: medium
    issue: Ang alternatibong salin sa talababa ay gumagamit ng “tatalian,” na karaniwang nangangailangan ng malinaw na tagaganap at hindi ang pinakamalinaw na katumbas ng passive na “will be bound.”
    rationale: Ang “itatali” ay mas malinaw na object-focus/passive na katumbas sa kontekstong ito.
