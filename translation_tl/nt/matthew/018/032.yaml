id: MAT.18.32
reference: Matthew 18:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: tl
  text: Pagkatapos, ipinatawag siya ng kanyang amo at sinabi sa kanya, “Masama kang alipin[a]! Ipinatawad ko sa iyo ang buong utang na iyon[b] dahil nakiusap ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang Griyegong δοῦλος ay maaaring tumukoy sa lingkod o alipin; dito, binibigyang-diin ng “alipin” ang pagkakagapos niya sa kanyang amo.
    reason: lexical_alternative
  - marker: b
    text: O “Kinansela ko ang buong utang na iyon para sa iyo.” Ang Griyegong pandiwa ay maaaring mangahulugang magpalaya o magpawalang-bisa ng utang, gayundin ang magpatawad.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang pasalaysay sa Filipino na nagpapakita ng kasunod na pangyayari sa talinghaga.
- source_word: προσκαλεσάμενος
  choice: ipinatawag siya
  rationale: Ipinahihiwatig ng pandiwa ang makapangyarihang pagpapalapit o pagpapatawag ng amo sa alipin.
- source_word: ὁ κύριος αὐτοῦ
  choice: kanyang amo
  rationale: Sa konteksto, tumutukoy ang κύριος sa amo ng alipin, hindi bilang banal na titulo.
- source_word: λέγει αὐτῷ
  choice: sinabi sa kanya
  rationale: Isinalin ang historikal na pangkasalukuyan bilang pangnagdaan, na natural sa salaysay na Filipino.
- source_word: Δοῦλε πονηρέ
  choice: Masama kang alipin
  rationale: Pinananatili ng “alipin” ang nakagapos at nakabababang katayuan ng δοῦλος, habang malinaw na moral na paghatol ang “masama.”
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ang buong utang na iyon
  rationale: Tuwirang ipinapahayag ang kabuuan ng pagkakautang nang natural sa Filipino.
- source_word: ἀφῆκά σοι
  choice: Ipinatawad ko sa iyo
  rationale: Ang “ipinatawad” ay likas gamitin sa utang at pinananatili rin ang ugnayan ng larawan ng pagkakautang sa tema ng pagpapatawad sa Mateo.
- source_word: ἐπεὶ παρεκάλεσάς με
  choice: dahil nakiusap ka sa akin
  rationale: Malinaw na ipinapakita ang dahilan at ang taimtim na paghiling nang hindi dinaragdagan ang tindi ng orihinal.
theological_decisions:
- issue: Pagbibigay-kahulugan sa δοῦλος sa ugnayang amo–alipin ng talinghaga
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga rito ang legal at panlipunang pagkakagapos ng taong may utang sa kanyang amo; mas malinaw itong naihahatid ng “alipin,” habang itinatala sa talababa ang posibleng “lingkod.”
- issue: Pagbibigay-kahulugan sa ἀφίημι sa konteksto ng utang
  choice: ipinatawad
  alternative: kinansela / pinawalang-bisa
  rationale: Literal na maaaring tumukoy ang pandiwa sa pagpapawalang-bisa ng utang, ngunit ang “ipinatawad” ay akma rin sa utang at pinananatili ang sinadyang pagkakaugnay sa mas malawak na tema ng pagpapatawad.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “amo” para sa relasyong panlipunan sa talinghaga at “alipin” upang hindi mapahina ang katayuang ipinahihiwatig ng δοῦλος. Pinanatili sa “ipinatawad” ang leksikal at teolohikal na pagsasanib ng pagpapawalang-bisa sa utang at pagpapatawad.
