  source_fidelity: 'Tumpak ang salin sa pagkakasunod ng pangyayari at sa lahat ng pangunahing yunit: ang amo ay nagpatawag, nagsalita sa alipin, tinukoy ang buong utang, at ibinigay ang dahilan na nakiusap ito. Ang “ipinatawad” ay wastong pinananatili ang sinadyang pagsasanib ng pagpapatawad at pagpapawalang-bisa ng utang sa ἀφῆκά.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “Pagkatapos,” “ipinatawag,” “kanyang amo,” at “dahil nakiusap ka sa akin” ay angkop sa marangal ngunit madaling basahing rehistro ng talinghaga. Ang “Masama kang alipin!” ay idiomatiko bilang tuwirang pagsaway.
  terminology: Ang “amo” at “alipin” ay wastong naghahatid ng relasyong κύριος–δοῦλος sa talinghaga; hindi nito pinahihina ang nakagapos na katayuang mahalaga sa tagpo. Ang “ipinatawad” para sa utang ay kapwa natural at semantically angkop, habang ang talababa ay maayos na nagbibigay ng alternatibong pagpapawalang-bisa ng utang.
