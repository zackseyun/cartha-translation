id: MAT.18.26
reference: Matthew 18:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: tl
  text: Kaya nagpatirapa sa harap niya ang alipin at nakiusap[a], “Pagpasensiyahan mo ako, at babayaran ko sa iyo ang lahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpatirapa sa harap niya bilang pagpupugay at nagsabi”; sa ibang konteksto, ang pandiwang Griyego ay maaari ring isaling “sumamba,” ngunit dito ay tumutukoy ito sa mapagpakumbabang pagpupugay sa isang taong panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: nagpatirapa
  rationale: Ipinahahayag ng aorist participle ang pisikal na pagbagsak at pagpapakumbaba ng alipin. Likas sa Tagalog ang “nagpatirapa” at malinaw nitong inilalarawan ang kilos.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang bunga ng sinabi at iniutos sa naunang talata, habang pinananatili ang natural na daloy ng salaysay.
- source_word: δοῦλος
  choice: alipin
  rationale: Tuwirang ipinahahayag ng “alipin” ang kalagayang nakapaloob sa δοῦλος at ang lubos na pananagutan ng tauhan sa talinghaga.
- source_word: προσεκύνει αὐτῷ
  choice: nagpatirapa sa harap niya
  rationale: Sa kontekstong ito, tumutukoy ang προσκυνέω sa mapagpakumbabang pagpupugay sa isang taong panginoon, hindi kinakailangang sa pagsambang panrelihiyon. Iniiwasan ng salin ang labis na pagbasa habang pinananatili ang kilos ng pagpapasakop.
- source_word: λέγων
  choice: at nakiusap
  rationale: Bagaman literal na “nagsasabi,” malinaw na isang pakiusap ang kasunod na tuwirang pananalita. Natural na inilalahad ng “nakiusap” ang gamit nito sa eksena.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Pagpasensiyahan mo ako
  rationale: Hinihiling ng pautos na anyo ang pagtitimpi at pagpapaliban ng paghatol o paniningil. Karaniwan at malinaw ito sa modernong Tagalog.
- source_word: πάντα
  choice: ang lahat
  rationale: Komprehensibo ang neuter plural at tumutukoy sa buong pagkakautang.
- source_word: ἀποδώσω σοι
  choice: babayaran ko sa iyo
  rationale: Sa konteksto ng utang, nangangahulugan ang ἀποδίδωμι ng pagbabayad o pagsasauli ng dapat bayaran; malinaw at natural ang napiling anyo sa Tagalog.
theological_decisions:
- issue: Kahulugan ng προσκυνέω kapag ang tinutukoy ay isang taong panginoon
  choice: Isinalin bilang mapagpakumbabang pagpapatirapa
  alternative: “sumamba sa kanya” o “yumukod sa harap niya”
  rationale: Ang tagpo sa talinghaga ay nagpapakita ng pagpupugay at pagsusumamo ng alipin sa harap ng hari o panginoon. Maaaring magpahiwatig ng higit na panrelihiyong kahulugan ang “sumamba,” na hindi hinihingi ng konteksto; pinananatili ng “nagpatirapa” ang pisikal na kilos at pagpapasakop nang hindi nilulutas nang labis ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “alipin” upang panatilihin ang panlipunang katayuan ng δοῦλος. Hindi idinagdag ang “po” o pangmaramihang panggalang upang hindi magpasok ng elementong wala sa Griyego; ang pagpapakumbaba ay sapat nang ipinakikita ng pagpapatirapa at pakiusap.
