base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: tl
  text: Kahabag-habag ang sanlibutan dahil sa mga katitisuran[a]! Sapagkat kailangang dumating ang mga katitisuran, ngunit kahabag-habag ang taong iyon[b]; sa pamamagitan niya dumarating ang katitisuran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ikatitisod,” “mga sanhi ng pagkakasala,” o “mga bitag.” Ang salitang Griyego ay tumutukoy sa anumang nagpapatisod sa isang tao—sa pamamagitan man ng pag-uudyok, pang-aakit, o pagkakataong magkasala.
    reason: lexical_alternative
  - marker: b
    text: Isahan ang “taong iyon” rito at kumakatawan sa sinumang indibidwal na sa pamamagitan niya dumarating ang gayong katitisuran.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Kahabag-habag
  rationale: Naghahatid ito ng taimtim na pahayag ng kapahamakan at paghatol, hindi lamang ng simpleng lungkot; inulit upang mapanatili ang retorikal na pagkakatugma.
- source_word: κόσμῳ
  choice: ang sanlibutan
  rationale: Malawak na tumutukoy sa daigdig ng sangkatauhan; ang “sanlibutan” ay dignified at karaniwang biblikal na salitang Filipino nang hindi nililimitahan sa pisikal na sangnilikha.
- source_word: ἀπὸ
  choice: dahil sa
  rationale: Likas na ipinapahayag sa Filipino ang sanhi ng kapighatian o kapahamakan.
- source_word: σκάνδαλα / σκάνδαλον
  choice: mga katitisuran / katitisuran
  rationale: 'Pinananatili ang metapora ng pagkatisod at ang lawak ng kahulugan: anumang bitag, pang-akit, o dahilan upang magkasala. Pinanatili rin ang pagkakaiba ng maramihan at isahan.'
- source_word: ἀνάγκη
  choice: kailangang
  rationale: Malinaw na pinananatili ang diwa ng pangangailangan o hindi maiiwasang pagdating nang hindi tinutukoy kung ano ang batayan nito.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na ugnayan sa naunang pahayag.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: dumating ... pinagdaraanan
  rationale: Ang “dumating” ay tuwirang nagpapanatili sa unang pandiwang metapora. Sa ikalawang sugnay, ang “pinagdaraanan” ay likas na Filipino para sa personal na daluyan at pinananatili ang δι’ οὗ, bagaman hindi nito inuulit nang literal ang “dumating.”
- source_word: πλήν
  choice: ngunit
  rationale: Malinaw na naghuhudyat ng matinding pagsalungat sa pagitan ng pangkalahatang pangangailangan at ng pananagutan ng indibidwal.
- source_word: ἀνθρώπῳ
  choice: ang taong
  rationale: Pinananatili ang isahang pagtukoy sa tao; sa Filipino, ang “tao” ay likas na maaaring kumatawan sa sinumang indibidwal nang magdagdag ng kasariang hindi ipinahihiwatig ng leksikal na anyo sa target language.
- source_word: δι’ οὗ
  choice: pinagdaraanan
  rationale: Ipinahahayag ang tao bilang daluyan o ahensiyang sa pamamagitan niya ay dumarating ang katitisuran.
theological_decisions:
- issue: Ang uri ng pangangailangan sa ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: “kailangang dumating” nang hindi ipinapaliwanag ang pinagmumulan ng pangangailangan
  alternative: “tiyak na darating” o pananalitang tahasang nag-uugnay nito sa pasiya ng Diyos
  rationale: Nagsasaad ang Griyego ng pangangailangan ngunit hindi nito sinasabi kung ito ay lohikal, makasaysayan, o providensiyal. Pinananatili ng salin ang tensiyon nang hindi nag-aangkin ng tuwirang banal na sanhi.
- issue: Ang kinakatawang saklaw ng ἀνθρώπῳ
  choice: “ang taong,” na tumutukoy sa sinumang indibidwal na pinagdaraanan ng katitisuran
  alternative: “ang lalaki” o “sinuman”
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ang ἄνθρωπος ay karaniwang tumutukoy sa tao. Sa modernong Filipino, “tao” ang tumpak at natural na katumbas at hindi kailangang gawing “lalaki.”
translation_notes:
  register: Modernong Filipino na may dignified na tonong angkop sa propetikong babala. Ginamit ang “sanlibutan” at “katitisuran” bilang pamilyar ngunit hindi lipas na bokabularyong biblikal. Ang bantas na padamdam ay naghahatid ng bigat ng dobleng οὐαί.
