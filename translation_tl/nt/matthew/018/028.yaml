id: MAT.18.28
reference: Matthew 18:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: tl
  text: Ngunit pagkalabas ng aliping iyon, nakita niya ang isa sa mga kapwa niya alipin na may utang sa kanya na sandaang denario.[a] Sinunggaban niya ito at sinimulang sakalin, habang sinasabi, “Bayaran mo ang anumang utang mo!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang denario ay karaniwang sahod para sa isang araw ng isang manggagawa o kawal.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “Bayaran mo kung mayroon kang anumang utang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: alipin
  rationale: Tuwirang inilalarawan ang kalagayang nakatali sa panginoon at ang mapamilit na kapangyarihan sa talinghaga; mas tumpak dito kaysa sa mas malambot na “lingkod.”
- source_word: ἐξελθὼν δὲ
  choice: Ngunit pagkalabas
  rationale: Likas na salin sa Tagalog ng panandang salungat at ng naunang kilos ng paglabas.
- source_word: συνδούλων
  choice: mga kapwa niya alipin
  rationale: Pinananatili ang diwa ng σύν- na “kapwa” at ang pagkakatugma sa salin ng δοῦλος.
- source_word: ὤφειλεν
  choice: may utang
  rationale: Karaniwan at malinaw na pananalita para sa pagkakautang na salapi.
- source_word: ἑκατὸν δηνάρια
  choice: sandaang denario
  rationale: Pinananatili ang makasaysayang yunit ng salapi at ang mahalagang paghahambing nito sa napakalaking naunang utang.
- source_word: κρατήσας
  choice: Sinunggaban
  rationale: Ipinahahayag ang biglaan at marahas na pagdakma.
- source_word: ἔπνιγεν
  choice: sinimulang sakalin
  rationale: Ipinakikita ang nagsisimula at nagpapatuloy na kilos na maaaring ipahiwatig ng imperfect tense.
- source_word: Ἀπόδος
  choice: Bayaran mo
  rationale: Matalim at likas na pautos sa konteksto ng paniningil ng utang.
- source_word: εἴ τι ὀφείλεις
  choice: ang anumang utang mo
  rationale: Pinananatili ang di-tiyak na diwa ng εἴ τι nang hindi ginagawa itong tiyak na isang alam nang halaga.
theological_decisions:
- issue: Salin ng δοῦλος sa talinghaga
  choice: alipin / kapwa alipin
  alternative: lingkod / kapwa lingkod
  rationale: Mahalaga sa tagpo ang pagkakatali sa panginoon, utang, at mapamilit na kapangyarihan; kaya pinananatili ang mas matibay na panlipunang kahulugan nang hindi nilalambutan.
- issue: Di-tiyak na pahayag sa εἴ τι ὀφείλεις
  choice: ang anumang utang mo
  alternative: ang utang mo; kung mayroon kang utang
  rationale: Pinananatili ang tunay na di-tiyak na anyo ng Griyego at ang mapanakot, bukás na singil; ibinibigay sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” upang tumpak na maipakita ang kalagayang panlipunan sa talinghaga; pinanatili ang “denario” at ipinaliwanag sa talababa.
