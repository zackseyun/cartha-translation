language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: tl
  text: 'Muli, sinasabi ko sa inyo ang totoo: kung magkasundo sa lupa ang dalawa sa inyo tungkol sa anumang bagay na hihingin nila,[a] gagawin iyon para sa kanila ng aking Ama na nasa langit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kasunod ito ng turo ni Jesus tungkol sa pakikitungo ng komunidad sa nagkasala at sa awtoridad nitong magbigkis at magkalag (18:15–18), ngunit malawak ang mismong pananalita rito tungkol sa mga kahilingang pinagkasunduan.
    reason: cross_reference
  - marker: b
    text: Sa Griego, “nasa mga langit”; isinalin dito sa likas na Tagalog bilang “nasa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Muli
  rationale: Ipinahihiwatig nito ang isa pang mariing pahayag na kaugnay ng naunang turo, at likas itong pakinggan sa makabagong Tagalog.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: sinasabi ko sa inyo ang totoo
  rationale: Likas at marangal na salin ng mariing pananalita ni Jesus; pinananatili ang puwersa ng ἀμήν nang hindi kinakailangang hiramin ang salitang “amen.”
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: kung magkasundo ... ang dalawa sa inyo
  rationale: Ang συμφωνέω ay tumutukoy rito sa pagkakaroon ng iisang pasiya o pagkakasundo; malinaw at natural na naipapahayag ng “dalawa sa inyo” ang ἐξ ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: dito sa lupa
  rationale: Pinananatili ang kaibahan ng makalupang kalagayan at ng Ama na nasa langit; ang “dito” ay likas na ipinahihiwatig ng pananaw ng pahayag.
- source_word: περὶ παντὸς πράγματος
  choice: tungkol sa anumang bagay
  rationale: Malawak ang saklaw ng πρᾶγμα—bagay, usapin, o pangyayari—kaya hindi ito nilimitahan sa isang tiyak na uri ng kahilingan.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: na hihingin nila
  rationale: Maayos nitong naihahayag ang di-tiyak na sugnay at ang diwa ng αἰτέω bilang paghingi o paghiling.
- source_word: γενήσεται αὐτοῖς
  choice: gagawin iyon para sa kanila
  rationale: Sa ugnayan nito sa kasunod na pariralang tumutukoy sa Ama, ang pangungusap ay natural na nagsasaad na ang hinihingi ay isasagawa para sa kanila.
- source_word: παρὰ τοῦ πατρός μου
  choice: ng aking Ama
  rationale: Sa kayariang ito, ang παρά na may genitive ay maaaring magpahiwatig ng pinagmulan o gumagawa; akma ang “ng” sa pandiwang “gagawin” habang hindi labis na ipinapaliwanag ang relasyon.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: na nasa langit
  rationale: Karaniwang idiomatikong isinasalin sa Tagalog bilang isahan ang pangmaramihang οὐρανοῖς, ngunit itinala sa talababa ang literal na anyo.
theological_decisions:
- issue: Saklaw ng pangako ayon sa konteksto
  choice: Isinalin nang tuwiran ang malawak na pananalita ng talata, nang hindi nagdaragdag ng tahasang limitasyon tungkol sa pagdidisiplina sa kapulungan, panalangin, o kalooban ng Diyos.
  alternative: Tahasang limitahan ang pahayag sa mga pasiya tungkol sa pagdidisiplina sa kapulungan, o ituring itong walang-pasubaling pangako para sa lahat ng uri ng kahilingan.
  rationale: Ang agarang konteksto ay tungkol sa pakikitungo ng komunidad sa nagkasala at sa awtoridad na magbigkis at magkalag, samantalang ang αἰτέω ay nagsasaad ng paghingi. Gayunman, hindi tahasang inilalagay ng mismong talata ang alinman sa mga interpretasyong iyon bilang paliwanag o limitasyon, kaya pinanatili ang lawak at tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “magkasundo,” “hihingin,” at “gagawin” upang maging madaling maunawaan nang hindi pinapaliit ang saklaw o nilulutas ang interpretibong tensiyon ng talata.
