translation:
  language: tl
  text: Sapagkat dumating ang Anak[a] ng Tao upang iligtas ang nawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay wala sa pinakamaagang mga manuskritong Griyego, kabilang ang Codex Sinaiticus at Codex Vaticanus noong ika-4 na siglo, at sa mga sinaunang salin sa wikang Coptic. Gayunman, matatagpuan ito sa Codex Bezae noong ikalimang siglo, sa karamihan ng mga manuskrito ng tradisyong Byzantine, at sa Latin Vulgate. Malamang na idinagdag ito ng mga tagakopya kalaunan upang iayon sa Lucas 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: iligtas
  rationale: Karaniwang salin ng pandiwa sa kontekstong tumutukoy sa pagliligtas mula sa kapahamakan; malinaw at natural sa modernong Tagalog.
- source_word: τὸ ἀπολωλός
  choice: ang naligaw
  rationale: Ang perpektong aktibong pandiwaring neuter singular ay ginamit bilang pangngalan at tumutukoy sa nasa kalagayan ng pagkawala. Ang “ang naligaw” ay natural sa Tagalog at umaayon sa talinghaga ng tupang naligaw sa konteksto, habang hindi nililimitahan ang diwa sa pisikal na pagkawala.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na marangal at literal na salin ng titulong Griyego, na pinananatili ang biblikal at teolohikal na pahiwatig nito.
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
