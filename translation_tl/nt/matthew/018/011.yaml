  verdict: revise
  source_fidelity: Ang «Sapagkat dumating ang Anak ng Tao upang iligtas ang …» ay tapat sa Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι. Gayunman, ang τὸ ἀπολωλός ay perpektong pandiwaring ginawang pangngalan, na pangunahing tumutukoy sa nawala o napahamak, hindi partikular sa pagkaligaw ng landas. Ang “ang nawala” ay mas malapit at pinananatili ang malawak na saklaw ng Griyego.
  naturalness: Natural, malinaw, at marangal sa modernong Filipino Tagalog ang “Sapagkat dumating ang Anak ng Tao upang iligtas ang nawala.” Inayos din ang ilang parirala sa talababa upang maging mas likas sa Tagalog.
  terminology: Napananatili ang itinatag na titulong “Anak ng Tao” at ang soteriological na “iligtas.” Ang “nawala” ay mas tumpak na katumbas ng ἀπολωλός kaysa “naligaw,” bagaman umaayon ang huli sa malapit na larawan ng nawawalang tupa.
  issues:
  - severity: medium
    issue: Ang “naligaw” ay mas makitid kaysa τὸ ἀπολωλός.
    rationale: Ang Griyego ay hindi tahasang nagsasabing “lumihis” o “naligaw”; ang perpektong participle ng ἀπόλλυμι ay nagsasaad ng isa/yaong nawala o napahamak. Ang “nawala” ay hindi nagdaragdag ng partikular na paraan ng pagkawala at mas mahusay na pinananatili ang ambiguity ng pinagmulan.
  - severity: low
    issue: May ilang di-gaanong likas na parirala sa talababa.
    rationale: Mas natural ang “mga sinaunang salin sa wikang Coptic” kaysa “mga sinaunang saling Coptic,” at “noong ikalimang siglo” kaysa “noong ika-5 siglo.”
  revised_text: Sapagkat dumating ang Anak[a] ng Tao upang iligtas ang nawala.
