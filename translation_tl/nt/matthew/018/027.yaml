  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: tl
  text: Kaya nahabag ang amo[a] ng aliping iyon; pinawalan niya siya at ipinatawad sa kanya ang pautang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panginoon”; ang tinutukoy rito ng Griyegong κύριος ay ang taong amo sa talinghaga, hindi isang tuwirang pagtukoy sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “utang”; ang pangngalang Griyego ay mas tiyak na tumutukoy sa pautang o sa bagay na ipinautang.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: nahabag
  rationale: Likas at marangal na Filipino ito para sa matinding awa o habag na ipinahihiwatig ng pandiwa.
- source_word: δὲ
  choice: Kaya
  rationale: Sa konteksto, iniuugnay nito ang pagsusumamo ng alipin sa mahabaging tugon ng amo; mas natural ito sa Filipino kaysa sa mekanikal na “at” o “ngunit.”
- source_word: κύριος
  choice: amo
  rationale: Ang tinutukoy ay ang taong may kapangyarihan sa alipin sa loob ng talinghaga. Iniiwasan ng “amo” ang maling pagbasa rito bilang tuwirang titulong banal.
- source_word: δοῦλου
  choice: alipin
  rationale: Pinananatili nito ang kongkretong kalagayang nakagapos at ang di-pantay na ugnayan ng kapangyarihan sa talinghaga.
- source_word: ἀπέλυσεν αὐτόν
  choice: pinawalan niya ito
  rationale: Ipinahahayag nito ang pagpapahintulot na makaalis nang hindi tiyak na nagsasabing pinalaya na siya mula sa pagkaalipin.
- source_word: τὸ δάνειον
  choice: ang pautang
  rationale: Mas tiyak ang δάνειον sa salapi o bagay na ipinautang; pinananatili ng “pautang” ang espesipikong kahulugang ito.
- source_word: ἀφῆκεν αὐτῷ
  choice: ipinatawad dito
  rationale: Pinananatili ng “ipinatawad” ang saklaw ng ἀφίημι na pagpapatawad o pagpapawalang-bisa, habang nililinaw ng “pautang” na obligasyong pinansiyal ang tinutukoy.
theological_decisions:
- issue: Maaaring mabasa ang κύριος bilang titulong banal
  choice: amo
  alternative: panginoon
  rationale: Sa agarang tagpo, ang tinutukoy ay ang taong amo ng alipin. Hindi nito inaalis ang mas malawak na teolohikal na saysay ng talinghaga, ngunit hindi rin nito ipinapasok ang tuwirang pagkakakilanlan sa Diyos sa mismong salaysay.
- issue: Konkretong katayuan ng δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Mahalaga sa talinghaga ang lubos na kapangyarihan ng amo at ang nakagapos na kalagayan ng tauhan; maaaring palambutin ng “lingkod” ang ugnayang iyon.
- issue: Pagpapatawad o pagkansela ng obligasyong pinansiyal
  choice: ipinatawad dito ang pautang
  alternative: kinansela ang utang nito
  rationale: Pinananatili ng napiling anyo ang sadyang pagkakaugnay ng bokabularyo ng pagpapatawad at pagpapatawad sa utang, nang hindi ikinukubli na pautang ang tuwirang bagay ng pandiwa.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “amo” at “alipin” upang malinaw ang ugnayang panlipunan, at ang tuldok-kuwit upang natural na pagdugtungin ang habag at ang dalawang kasunod na kilos.
