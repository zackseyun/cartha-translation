id: MAT.18.20
reference: Matthew 18:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: tl
  text: Sapagkat kung saan nagkakatipon ang dalawa o tatlo sa pangalan ko, naroon ako sa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: kung saan
  rationale: Natural na panumbas sa sugnay na nagsasaad ng lugar; hindi pinalawak sa “saanman,” na posible ngunit mas malawak kaysa hinihingi ng Griyego.
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng pahayag sa naunang konteksto.
- source_word: δύο ἢ τρεῖς
  choice: dalawa o tatlo
  rationale: Tuwirang pinananatili ang bilang at alternatibong ugnayan ng parirala.
- source_word: συνηγμένοι
  choice: nagkakatipon
  rationale: Likas at malinaw sa modernong Tagalog para sa mga taong magkakasamang natipon; inuuna ang natural na pagpapahayag kaysa sa mas literal ngunit alanganing “mga natipon.”
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: sa pangalan ko
  rationale: Karaniwang idyoma sa Tagalog para sa pagtitipong may kaugnayan kay Jesus, sa ilalim ng kanyang awtoridad, o bilang pagkilala sa kanya, nang hindi ipinapasok ang lahat ng mga kahulugang ito sa mismong teksto.
- source_word: ἐκεῖ
  choice: naroon
  rationale: Tumutugon sa “kung saan” at pinananatili ang kayariang “kung saan… naroon” ng Griyego.
- source_word: εἰμι
  choice: ako
  rationale: Sa pariralang “naroon ako,” malinaw na naihahayag ang payak at tuwirang εἰμι nang hindi dinaragdagan ng interpretatibong “naroroon ako bilang presensiya.”
- source_word: ἐν μέσῳ αὐτῶν
  choice: sa gitna nila
  rationale: Malapit sa larawang panlunan ng Griyego at natural sa Tagalog; posible rin ang “kasama nila.”
theological_decisions:
- issue: Ang implikasyong Kristolohikal ng presensiya ni Jesus sa mga nagkakatipon sa kanyang pangalan
  choice: Tuwirang sabihing “naroon ako sa gitna nila,” nang hindi ipinaliliwanag ang paraan ng kanyang presensiya.
  alternative: “Kasama nila ako,” o isang mas tahasang paliwanag na nakatali sa partikular na doktrina tungkol sa iglesya o sakramento.
  rationale: Malinaw na ipinahahayag ng talata ang presensiya ni Jesus ngunit hindi nito tinutukoy ang metapisikal o sakramental na paraan ng presensiyang iyon. Pinananatili ng salin ang pahayag at ang teolohikal na puwang nito.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “nagkakatipon” bilang likas na pananalita, at pinanatili ang pormal ngunit madaling maunawaang “sapagkat” at “naroon.”
