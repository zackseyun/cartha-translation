source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: tl
  text: Nagalit ang kanyang panginoon at ibinigay siya nito sa mga tagapagpahirap hanggang sa mabayaran niya ang lahat ng kanyang pagkakautang.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “amo.” Ang salitang Griyego ay kyrios. Dito ay tumutukoy ito sa panginoon ng alipin sa loob ng talinghaga, hindi tuwirang ginagamit bilang banal na titulo.
    reason: alternative_reading
  - marker: b
    text: O “mga nagpapahirap”; maaari ring isaling, nang mas mahina, na “mga bantay-bilangguan.” Ang salitang Griyego ay tumutukoy sa mga nagpapahirap, hindi lamang sa karaniwang mga bantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: sa galit
  rationale: Ang aorist participle ay ginagamit na pang-abay at nagpapahayag ng damdamin o sanhi ng kasunod na ginawa. Likas sa Tagalog ang “sa galit” at hindi nito labis na pinalalawak ang diwa.
- source_word: κύριος
  choice: panginoon
  rationale: Sa loob ng talinghaga, tumutukoy ito sa taong may kapangyarihan sa alipin. Ang “panginoon” ay natural na katapat sa ugnayang panginoon-alipin, ngunit maaaring mapagkamalang banal na titulo kaya nilinaw sa talababa.
- source_word: παρέδωκεν
  choice: ibinigay ... sa
  rationale: Ipinahahayag nito ang pagsasalin ng isang tao sa kapangyarihan o pangangalaga ng iba. Sa kontekstong ito, malinaw at natural ang “ibinigay siya ... sa mga tagapagpahirap.”
- source_word: βασανισταῖς
  choice: mga tagapagpahirap
  rationale: Ang salita ay tumutukoy sa mga nagpapahirap o nagpapasakit, hindi lamang sa karaniwang mga bantay-bilangguan. Pinananatili ng salin ang tindi ng babala nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Karaniwang pariralang temporal na naghahayag ng inaasahang hangganan ng kalagayan.
- source_word: ἀποδῷ
  choice: mabayaran niya
  rationale: Ang aorist subjunctive pagkatapos ng ἕως οὗ ay tumutukoy sa inaasahang pangyayaring magiging hangganan. Ang “mabayaran niya” ay natural sa Tagalog at nagpapanatili sa diwang pagbabayad o pagsasauli.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: ang lahat ng kanyang pagkakautang
  rationale: Malinaw nitong ipinapahayag ang buong halagang dapat bayaran. Bagaman hindi tahasang ginagamit sa Griyego ang pangngalang “utang,” ipinahihiwatig ito ng participial na ὀφειλόμενον at ng konteksto ng talinghaga.
theological_decisions:
- issue: Kung gagamitin ang “Panginoon” bilang banal na titulo para sa κύριος
  choice: panginoon
  alternative: amo; Panginoon
  rationale: Dito ay tauhan sa talinghaga ang tinutukoy—ang panginoon ng alipin—kaya maliit na titik ang ginamit at hindi ito itinuring na tuwirang titulo para sa Diyos o kay Cristo. Ang “amo” ay posible ngunit mas makitid at bahagyang mas kolokyal.
- issue: Tindi ng βασανισταῖς sa konteksto ng parusa
  choice: mga tagapagpahirap
  alternative: mga tagapagparusa; mga bantay-bilangguan
  rationale: Pinananatili ng “mga tagapagpahirap” ang matinding leksikal na diwa at ang babala ng talinghaga. Hindi nito nilulutas ang mas malawak na usaping teolohikal tungkol sa uri o tagal ng kahatulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang ugnayang panginoon-alipin at ang tindi ng parusa, habang iniwasan ang paglalagay ng malaking titik na maaaring gawing tuwirang banal na titulo ang κύριος.
