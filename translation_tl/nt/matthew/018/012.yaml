  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: tl
  text: Ano sa palagay ninyo? Kung may sandaang tupa ang isang lalaki at maligaw ang isa sa mga iyon[a], hindi ba niya iiwan ang siyamnapu’t siyam sa mga bundok[b] at aalis upang hanapin ang tupang naliligaw[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gumala palayo.” Maaari ring mangahulugan ang pandiwang Griyego na “maligaw,” “gumala,” o, sa ilang konteksto, “mailigaw.”
    reason: lexical_alternative
  - marker: b
    text: O, “sa mga burol.”
    reason: lexical_alternative
  - marker: c
    text: Literal na, “ang naliligaw”; ayon sa tradisyon, “ang nawawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Ano sa palagay ninyo?
  rationale: Likas at tuwirang tanong sa modernong Tagalog na nag-aanyaya sa mga kausap na humatol sa sitwasyon; pinananatili rin ang pangmaramihang ὑμῖν.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Kung may ... ang isang lalaki
  rationale: Ang γίνομαι na may datibo ay nagpapahayag dito ng pag-aari o kalagayan. Pinananatili ng “isang lalaki” ang panlalaking anyong isahan ng ἀνθρώπῳ nang hindi nagpapahiwatig ng isang partikular na kilalang tao.
- source_word: ἑκατὸν πρόβατα
  choice: sandaang tupa
  rationale: Karaniwan at malinaw na paraan sa Tagalog ng pagsasabi ng bilang at ng kolektibong pangngalang πρόβατα.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: maligaw ang isa sa mga iyon
  rationale: Saklaw ng πλανάω ang pagkaligaw, paglayo, o pagkalinlang. Ang “maligaw” ay angkop sa larawan ng tupa at hindi tumutukoy kung may panlabas na nagligaw rito.
- source_word: οὐχὶ ἀφήσει
  choice: hindi ba niya iiwan
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap, pati ang hinaharap na aspekto ng ἀφήσει. Ang “iiwan” ay hindi kasinlakas ng “pababayaan.”
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: ang siyamnapu’t siyam
  rationale: Tuwirang salin ng pariralang pamilang.
- source_word: ἐπὶ τὰ ὄρη
  choice: sa mga bundok
  rationale: Pinananatili ang kongkretong larawan at pangmaramihang anyo ng ὄρη; maaari ring unawain ang lupain bilang mga burol.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: at aalis upang hanapin
  rationale: Natural na ipinahahayag sa Tagalog ang kilos ng pagpunta na may layuning maghanap. Pinananatili ang parehong pag-alis at paghahanap nang hindi ginagawang mabigat ang sugnay.
- source_word: τὸ πλανώμενον
  choice: ang tupang naliligaw
  rationale: Pinananatili ang nagpapatuloy na pandiwang diwa ng kasalukuyang participle at inuulit ang ugat na ginamit sa naunang πλανηθῇ. Idinagdag ang “tupang” bilang likas na pantukoy sa Tagalog, hindi bilang bagong impormasyon.
theological_decisions:
- issue: Panlalaking pangkalahatang gamit ng ἀνθρώπῳ
  choice: isang lalaki
  alternative: isang tao / isang tao man
  rationale: Gramatikal na panlalaki at isahan ang anyo sa Griyego, bagaman kumakatawan ito sa sinumang nasa gayong sitwasyon. Pinananatili ng salin ang anyong iyon nang hindi ito ginagawang doktrinal na pahayag tungkol sa kasarian.
- issue: Diwa ng πλανάω sa talinghaga ng tupa
  choice: maligaw / naliligaw
  alternative: lumayo / mailigaw / ang nawawala
  rationale: Pinananatili nito ang posibleng pastoral at moral na pahiwatig ng salita, ngunit hindi ipinapasya kung kusang lumayo ang tupa o may nagligaw rito. Hindi rin ipinapalit ang mas matinding wika ng ganap na pagkawala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “sandaang,” “siyamnapu’t siyam,” at “sa mga bundok” bilang karaniwang mga anyo; iniwasan ang makaluma o labis na teknikal na pananalita. Ang mga panandang talababa [a], [b], at [c] ay inilagay sa mismong pariralang tinutukoy ng bawat paliwanag.
