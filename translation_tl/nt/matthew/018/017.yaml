  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: tl
  text: Ngunit kung ayaw niyang makinig sa kanila, sabihin mo ito sa kapulungan.[a] At kung ayaw din niyang makinig sa kapulungan, ituring mo siyang gaya ng isang Hentil at isang maniningil ng buwis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “iglesia” o “kongregasyon” para sa “kapulungan” (Griyego: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: ayaw niyang makinig
  rationale: Ipinahihiwatig ng παρακούω sa kontekstong ito ang sadyang pagtangging makinig o tumalima, hindi lamang ang hindi pagkarinig.
- source_word: εἰπὸν
  choice: sabihin mo ito
  rationale: Pinananatili nito ang pautos na anyo at likas na ipinahihiwatig na paksa ng sasabihin mula sa naunang konteksto.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: kapulungan
  rationale: Tumutukoy ang ἐκκλησία sa nagkakatipong pamayanan. Ang “kapulungan” ay malinaw at marangal, at hindi agad nag-aangkat ng mas huling institusyonal na pakahulugan.
- source_word: ἔστω σοι
  choice: ituring mo siya
  rationale: Ito ang natural na salin sa modernong Tagalog ng pautos na pariralang nangangahulugang kung ano ang magiging katayuan niya para sa kausap.
- source_word: ὥσπερ
  choice: gaya ng
  rationale: Direkta nitong pinananatili ang paghahambing sa Griyego.
- source_word: ὁ ἐθνικὸς
  choice: isang Hentil
  rationale: Sa kontekstong Judio, ang ἐθνικός ay karaniwang tumutukoy sa taong kabilang sa mga bansa sa labas ng tipang pamayanan. Natural sa Tagalog ang di-tiyak na “isang” para sa kinatawang uri.
- source_word: ὁ τελώνης
  choice: isang maniningil ng buwis
  rationale: Tuwirang kahulugan ito ng τελώνης at mas karaniwan sa modernong Filipino kaysa sa mas teknikal o lumang katawagan.
theological_decisions:
- issue: Pagpapakahulugan sa ἐκκλησία sa konteksto ng tagubilin ni Jesus tungkol sa pagtutuwid
  choice: kapulungan
  alternative: iglesia; kongregasyon
  rationale: Pinananatili ng “kapulungan” ang diwa ng nagkakatipong pamayanan nang hindi ipinapasok ang partikular na anyong institusyonal o denominasyonal. Inilalahad sa talababa ang mga lehitimong alternatibo.
- issue: Lakas ng utos tungkol sa taong tumatangging makinig
  choice: ituring mo siya na gaya ng isang Hentil at isang maniningil ng buwis
  alternative: ituring mo siyang tagalabas
  rationale: Pinananatili ang mismong paghahambing ng teksto at hindi ito pinapantay sa isang mas ganap na pormula tungkol sa pagtitiwalag na hindi tahasang binibigkas ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kapulungan” bilang pangunahing salin ng ekklēsia, at pinanatili sa talababa ang tradisyonal at iba pang posibleng katawagan.
