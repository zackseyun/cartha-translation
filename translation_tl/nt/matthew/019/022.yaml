  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: tl
  text: Ngunit nang marinig ng binata ang sinabi ni Jesus[a], umalis siyang malungkot[b], sapagkat marami siyang ari-arian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pananalitang ito.” Sa Griyego, “ang salita” ay tumutukoy sa naunang sinabi ni Jesus.
    reason: lexical_alternative
  - marker: b
    text: O “malungkot.” Inilalarawan ng anyong Griyego ang kalagayan niya habang umaalis.
    reason: lexical_alternative
  - marker: c
    text: 'Sa ilang tradisyonal na salin, “malalaking ari-arian.” Higit na tuwirang idiniriin ng Griyego ang dami: “maraming ari-arian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nang marinig
  rationale: Likas na temporal na salin ito ng aorist participle at malinaw na ipinapakita ang pagkakasunod ng pakikinig at pag-alis.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang sinabi ni Jesus at sa naging tugon ng binata.
- source_word: νεανίσκος
  choice: binata
  rationale: Tumutukoy ang salita sa isang lalaking bata pa. Hindi idinagdag ang titulong “pinuno,” na wala sa tekstong ito ni Mateo.
- source_word: τὸν λόγον
  choice: ang sinabi ni Jesus
  rationale: Sa konteksto, tumutukoy ang λόγος sa naunang sinabi ni Jesus. Nilinaw ang tinutukoy sa natural na Tagalog nang hindi binabago ang diwa.
- source_word: ἀπῆλθεν
  choice: umalis
  rationale: Payak at likas na salin ito ng pandiwang nagsasaad na lumayo o umalis siya.
- source_word: λυπούμενος
  choice: nalulungkot
  rationale: Ipinapakita ng present participle ang patuloy na kalagayan ng binata habang umaalis siya.
- source_word: ἦν γὰρ ἔχων
  choice: sapagkat ... siyang
  rationale: Likas na ipinahahayag sa Tagalog ang nagpapatuloy na kalagayan ng pagmamay-ari sa pamamagitan ng sugnay na “sapagkat marami siyang ari-arian.”
- source_word: κτήματα πολλά
  choice: marami siyang ari-arian
  rationale: Pinananatili nito ang diin ng πολλά sa dami at ang kahulugan ng κτήματα bilang mga pag-aari o ari-arian.
theological_decisions:
- issue: Kung idaragdag ang pagkakakilanlang “pinuno” mula sa kahalintulad na salaysay
  choice: Isinalin lamang ang νεανίσκος bilang “binata.”
  alternative: batang pinuno
  rationale: Binata lamang ang tawag sa kaniya sa tekstong Griyego ni Mateo. Ang pagdaragdag ng “pinuno” ay mag-aangkat ng detalye mula sa Lucas sa halip na direktang isalin ang talatang ito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “binata” sa halip na mas teknikal na “kabataang lalaki,” at nilinaw ang tinutukoy ng “salita” bilang sinabi ni Jesus. Pinanatili ang banayad na pagsalungat, ang kalungkutan habang umaalis, at ang diin sa dami ng ari-arian.
