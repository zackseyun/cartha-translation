  text: And after laying his hands on them[a], he went on from there.
translation:
  language: tl
  text: At matapos niyang ipatong sa kanila ang kanyang mga kamay, umalis siya roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Tuwirang nag-uugnay sa pangungusap sa naunang salaysay nang hindi nagdaragdag ng interpretibong diin.
- source_word: ἐπιθεὶς
  choice: matapos niyang ipatong
  rationale: Ang aorist participle ay nagsasaad dito ng kilos na nauna sa pangunahing pandiwa; natural itong ipinahahayag sa Filipino sa pamamagitan ng “matapos niyang.”
- source_word: τὰς χεῖρας αὐτοῖς
  choice: sa kanila ang kanyang mga kamay
  rationale: Pinananatili ang kongkretong kilos ng pagpapatong ng mga kamay. Likas na idinagdag ang “kanyang” dahil si Jesus ang paksa, gaya ng hinihingi ng idyomatikong Filipino.
- source_word: ἐπορεύθη
  choice: umalis siya
  rationale: Sa kontekstong ito, ipinahahayag ng pandiwa ang pag-alis ni Jesus mula sa lugar; malinaw at natural ang “umalis” sa modernong Filipino.
- source_word: ἐκεῖθεν
  choice: roon
  rationale: Karaniwang modernong katumbas ng pang-abay na nangangahulugang “mula sa lugar na iyon”; kalakip na sa pandiwang “umalis” ang diwang “mula.”
theological_decisions:
- issue: Kalikasan ng pagpapatong ni Jesus ng mga kamay
  choice: 'Pinanatili bilang kongkretong pisikal na kilos: “ipatong sa kanila ang kanyang mga kamay.”'
  alternative: Isaling interpretibo bilang “binasbasan niya sila.”
  rationale: Tahasang binabanggit ng Griyego ang pagpapatong ng mga kamay. Bagaman ipinahihiwatig ng konteksto ang pagbabasbas, hindi ito ipinalit sa mismong kilos upang maiwasan ang pagdaragdag ng sakramental o iba pang doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “matapos niyang” upang maipakita ang pagkakasunod ng kilos, at “umalis siya roon” bilang payak na salaysay.
