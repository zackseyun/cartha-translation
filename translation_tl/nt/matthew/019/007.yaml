  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Kung gayon, bakit iniutos ni Moises na bigyan siya ng kasulatan ng diborsiyo at paalisin siya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “diborsiyuhin siya.” Ang pandiwang Griyego ay maaaring mangahulugang “paalisin,” ngunit sa kontekstong ito ay ginagamit para sa pakikipagdiborsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present; ginawang pangnagdaan sa Tagalog para sa natural na daloy ng salaysay.
- source_word: Τί οὖν
  choice: Kung gayon, bakit
  rationale: Ipinahahayag nito ang pagtutol na ibinatay sa naunang sinabi ni Jesus; malinaw na naihahatid ng parirala ang lohikal at patanong na puwersa.
- source_word: ἐνετείλατο
  choice: iniutos
  rationale: Tahasang nangangahulugang nag-utos ang pandiwa. Pinananatili nito ang paraan ng paglalahad ng mga nagtatanong, nang hindi ipinapasok agad ang paglilinaw ni Jesus sa susunod na talata.
- source_word: δοῦναι
  choice: na bigyan siya
  rationale: Natural na Tagalog para sa infinitibong ‘magbigay’; ang tatanggap ng kasulatan ay ang asawang babae na tinutukoy sa sitwasyon.
- source_word: βιβλίον ἀποστασίου
  choice: kasulatan ng diborsiyo
  rationale: Tumutukoy ang parirala sa legal na dokumentong nagpapatunay ng diborsiyo. Makabago at malinaw ang ‘kasulatan’ habang pinananatili ang katangiang legal nito.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: at paalisin siya
  rationale: Maaaring literal na mangahulugang paalisin o palayain ang ἀπολύω, ngunit sa kontekstong ito ay tumutukoy ito sa pagpapaalis sa asawa bilang diborsiyo. Pinananatili ng salin ang kongkretong pananalita at nililinaw sa talababa ang legal na diwa.
theological_decisions:
- issue: Kung isasalin ang ἐνετείλατο ayon sa paglilinaw ni Jesus sa kasunod na talata
  choice: Pinanatili ang ‘iniutos’
  alternative: ‘ipinahintulot’ o ‘pinayagan’
  rationale: ‘Nag-utos’ ang tahasang sinabi sa Griyego at ito ang paglalahad ng mga nagtatanong. Ang paggamit ng ‘ipinahintulot’ ay maagang magpapasok ng pagtutuwid ni Jesus sa talata 8 at mag-aalis ng tensiyon sa pag-uusap.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang ‘kasulatan ng diborsiyo’ ay mas madaling maunawaan kaysa sa mas lumang ‘kasulatan ng paghihiwalay,’ at ang ‘paalisin siya’ ay nagpapanatili sa larawan ng orihinal habang ipinaliliwanag ng talababa ang legal na kahulugan.
