id: MAT.19.18
reference: Matthew 19:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: tl
  text: 'Sinabi niya sa kanya, “Alin-alin?” Sumagot si Jesus, “Ito: Huwag kang papatay; huwag kang mangangalunya; huwag kang magnanakaw; huwag kang sasaksi nang kasinungalingan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Alin-alin?
  rationale: Ang pambabaeng maramihang anyo ay tumutukoy sa mga utos na tinatanong; natural sa modernong Tagalog ang “Alin-alin?”
- source_word: Τὸ
  choice: 'Ito:'
  rationale: Ang artikulong neuter singular ay ginagamit bilang panimula sa sumusunod na talaan. Pinananatili ng “Ito:” ang bahagyang putol na estruktura ng Griyego nang hindi nagiging di-natural.
- source_word: Οὐ φονεύσεις
  choice: Huwag kang papatay
  rationale: Tumutukoy ang φονεύω sa pagpatay ng tao, lalo na sa labag sa batas o maling pagpatay. Sa pormula ng Sampung Utos, “Huwag kang papatay” ang malinaw at kinikilalang katumbas sa Tagalog.
- source_word: Οὐ μοιχεύσεις
  choice: huwag kang mangangalunya
  rationale: Tuwirang isinasalin ang pagbabawal sa pangangalunya at pinananatili ang anyong pandiwa.
- source_word: Οὐ κλέψεις
  choice: huwag kang magnanakaw
  rationale: Natural at tuwirang katumbas ng pagbabawal sa pagnanakaw.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: huwag kang sasaksi nang kasinungalingan
  rationale: Pinananatili ang legal at testimonial na diwa ng ψευδομαρτυρέω, sa halip na palawakin lamang bilang pangkalahatang pagsisinungaling.
theological_decisions:
- issue: Saklaw ng φονεύσεις
  choice: papatay
  alternative: papaslang / papatay nang labag sa batas
  rationale: Ang “papatay” ang tradisyonal at madaling maunawaang pormula ng utos. Hindi idinagdag sa teksto ang paliwanag na “nang labag sa batas,” upang hindi sobrang tukuyin ang saklaw na hindi tahasang binaybay sa sipi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang payak na pangungusap at ang pamilyar na pormula ng mga utos; pinanatili ang pambungad na “Ito:” bilang katumbas ng kapansin-pansing Τὸ sa SBLGNT.
