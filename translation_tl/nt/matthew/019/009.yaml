id: MAT.19.9
reference: Matthew 19:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na ang sinumang diborsiyuhin ang kanyang asawa, maliban sa kaso ng seksuwal na imoralidad[a], at magpakasal sa ibang babae ay nangangalunya; at ang sinumang magpakasal sa babaeng diborsiyada ay nangangalunya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “maliban kung ang dahilan ay seksuwal na imoralidad.” Ang salitang Griyego ay maaari ring isalin nang mas makitid bilang “pakikiapid” o unawain ng ilan bilang “seksuwal na pagtataksil.”
    reason: lexical_alternative
  - marker: b
    text: 'Wala sa ilang manuskrito ang mga salitang: “at ang sinumang magpakasal sa babaeng diborsiyada ay nangangalunya.”'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Ang δέ ay banayad na panalungat o pagpapatuloy sa naunang talakayan; natural sa modernong Tagalog ang “Ngunit sinasabi ko sa inyo” at napapanatili nito ang mariing pahayag ni Jesus.
- source_word: ὃς ἂν
  choice: ang sinuman
  rationale: Ipinahahayag ng panghalip na may ἄν ang isang pangkalahatan at di-tiyak na kondisyon; malinaw itong naihahatid ng “ang sinuman.”
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: humiwalay sa kanyang asawa
  rationale: Sa konteksto ng pag-aasawa, ang ἀπολύω ay tumutukoy sa pagdidiborsiyo o pormal na paghihiwalay, hindi lamang pagpapaalis. Ang “humiwalay sa kanyang asawa” ay natural at malawak na mauunawaan sa Filipino nang hindi nakatali sa modernong legal na terminolohiya lamang.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: maliban kung dahil sa seksuwal na imoralidad
  rationale: Ang parirala ay nagsasaad ng eksepsiyon o batayan. Mas malawak ang saklaw ng πορνεία kaysa pangangalunya lamang, kaya pinananatili ng “seksuwal na imoralidad” ang lawak nito.
- source_word: γαμήσῃ ἄλλην
  choice: mag-asawa ng iba
  rationale: Ang ἄλλην ay pambabae at tumutukoy sa ibang babae; sa Tagalog, likas at sapat ang “mag-asawa ng iba” sa malinaw na kontekstong ito.
- source_word: μοιχᾶται
  choice: nangangalunya
  rationale: Direkta at karaniwang salin ito para sa paggawa ng adultery, at pinananatili ang aspektong pangkasalukuyan ng Griyegong pandiwa nang hindi nagiging mabigat.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: at ang mag-asawa sa babaeng hiniwalayan ay nangangalunya
  rationale: Ang articular participle ay pangkalahatang tumutukoy sa taong gumagawa nito. Ang perfect passive participle na ἀπολελυμένην ay inilalarawan bilang “babaeng hiniwalayan,” na nakatuon sa kalagayang bunga ng paghihiwalay.
theological_decisions:
- issue: Kahulugan ng πορνεία sa sugnay ng eksepsiyon
  choice: seksuwal na imoralidad
  alternative: pakikiapid; seksuwal na pagtataksil
  rationale: Mas malawak ang posibleng saklaw ng πορνεία kaysa μοιχεία, kaya hindi ito pinakitid sa pangangalunya lamang. Inilalahad sa talababa ang mas makitid na mga salin upang mapanatili ang tunay na leksikal at teolohikal na pagtatalo.
- issue: Pagkakasama ng huling sugnay na καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Isama sa pangunahing teksto at lagyan ng talababa tungkol sa variant
  alternative: Alisin dahil wala ito sa ilang manuskrito
  rationale: Kasama ang sugnay sa ibinigay na SBLGNT ngunit minarkahan bilang tekstuwal na variant. Kaya isinasalin ito sa pangunahing teksto at tapat na itinatala ang kawalan nito sa ilang manuskrito.
- issue: Lakas ng μὴ ἐπὶ πορνείᾳ
  choice: maliban kung dahil sa seksuwal na imoralidad
  alternative: hindi dahil sa seksuwal na imoralidad
  rationale: Natural na naihahatid ng anyong eksepsiyon ang lohikal na bisa ng parirala sa konteksto, ngunit hindi nito nilulutas ang mga pagtatalo tungkol sa eksaktong saklaw o aplikasyon ng eksepsiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “humiwalay” sa halip na ang mas teknikal na “diborsiyuhin,” habang pinananatili sa konteksto ang tiyak na kahulugang marital divorce. Inilagay ang [a] pagkatapos ng pinagtatalunang pariralang πορνεία at ang [b] sa dulo ng tekstuwal na variant.
