source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus, “Hayaan ninyong lumapit sa akin ang mga bata, at huwag ninyo silang hadlangang lumapit sa akin, sapagkat sa mga tulad nila nauukol ang kaharian ng langit.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sapagkat sa mga tulad nila ang kaharian ng langit.” Ang “mga tulad nila” ay maaaring tumukoy hindi lamang sa mga batang naroon kundi pati sa mga taong kauri nila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Hayaan ninyo
  rationale: 'Ang pautos na anyo ng ἀφίημι ay nagpapahintulot dito: payagang gawin ng mga bata ang paglapit. Natural at tuwiran ang “hayaan ninyo” sa modernong Filipino.'
- source_word: τὰ παιδία
  choice: ang mga bata
  rationale: Tumutukoy ang παιδία sa mga bata, kadalasa’y musmos, ngunit hindi kailangang dagdagan ng “maliliit” dahil hindi iyon tahasang hinihingi rito.
- source_word: μὴ κωλύετε
  choice: huwag ninyo silang hadlangan
  rationale: Saklaw ng κωλύω ang paghadlang o pagpigil. Pinananatili ng “hadlangan” ang pangkalahatang diwa nang hindi tinutukoy kung nagsimula na ang kilos.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: lumapit sa akin
  rationale: Sa konteksto ng κωλύω, natural sa Filipino na isama ang layon bilang “silang” sa “huwag ninyo silang hadlangan,” habang ang ἐλθεῖν πρός με ay malinaw na “lumapit sa akin.”
- source_word: τῶν γὰρ τοιούτων
  choice: sapagkat sa mga tulad nila
  rationale: Ipinahihiwatig ng τοιοῦτος hindi lamang ang mismong mga batang naroon kundi ang mga taong kauri nila sa isang hindi tinukoy na aspeto. Pinananatili ng “mga tulad nila” ang lawak at kalabuan nito.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Ito ang natural at kinikilalang salin sa Filipino ng natatanging parirala ni Mateo, nang hindi ginagawang di-idiomatikong maramihan ang “mga langit.”
- source_word: ἐστὶν
  choice: nauukol
  rationale: 'Ipinahahayag ng “nauukol” ang diwa ng genitibong τῶν τοιούτων kasama ng ἐστίν: ang kaharian ay para sa o kabilang sa mga tulad nila. Iniiwasan nito ang masyadong literal ngunit alanganing “ay sa mga tulad nila.”'
theological_decisions:
- issue: Kung ang tinutukoy ni Jesus ay ang literal na mga bata lamang o pati ang mga taong katulad nila
  choice: “sa mga tulad nila”
  alternative: “sa mga batang ito” o “sa mga taong tulad ng mga bata”
  rationale: Ang τοιούτων ay lumalampas sa mismong mga batang naroon ngunit hindi nito tahasang sinasabi kung anong katangian nila ang mahalaga. Pinananatili ng salin ang tensiyong ito sa halip na limitahan ang pahayag sa mga bata lamang o ipaliwanag ito bilang isang tiyak na katangiang “parang bata.”
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “lumapit” sa halip na mas literal na “pumarito” upang natural na maipahayag ang ἐλθεῖν πρός με. Inilagay ang talababa pagkatapos ng buong pangungusap upang ipaliwanag ang hindi pangkaraniwang genitibong pahayag at ang saklaw ng “mga tulad nila.”
