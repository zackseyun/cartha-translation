  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Jesus sa kanyang mga alagad, “Tunay na sinasabi ko sa inyo[a]: mahihirapang makapasok sa kaharian ng langit ang isang mayamang lalaki[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Amen, sinasabi ko sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: O, “ang isang mayamang lalaki ay halos hindi makapapasok sa kaharian ng langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Pagkatapos
  rationale: Ipinahihiwatig nito ang pagpapatuloy ng salaysay at natural na inuugnay ang sinabi ni Jesus sa naunang pangyayari.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: εἶπεν
  choice: sinabi
  rationale: Payak at natural na katumbas sa panimulang pangungusap ng salaysay.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ at ang kinaugaliang salin ng μαθηταί sa konteksto ng Ebanghelyo.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tunay na sinasabi ko sa inyo
  rationale: Ipinahahayag ang taimtim at may-awtoridad na pormula ni Jesus sa malinaw na modernong Filipino, habang inilalagay sa talababa ang mas pormal na anyong “Amen.”
- source_word: πλούσιος
  choice: isang mayamang lalaki
  rationale: Ang pang-uri ay ginagamit bilang pangngalang panlalaki, isahan; pinananatili ng salin ang anyong panlalaki at ang tuwirang diwa ng kayamanan.
- source_word: δυσκόλως
  choice: mahirap para ... na
  rationale: Natural na Filipino para sa pang-abay na nagsasaad ng kahirapan, nang hindi agad pinatitingkad ito bilang ganap o halos imposibleng mangyari.
- source_word: εἰσελεύσεται
  choice: makapasok
  rationale: Malinaw na ipinahahayag ang pagpasok; sa konstruksiyong “mahirap para ... na makapasok,” likas sa Filipino ang pangkalahatang pahayag na nasa hinaharap sa Griyego.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: kaharian ng langit
  rationale: Natural at kinikilalang salin ng natatanging pariralang Mateo; pinananatili ang larawan ng paghahari o kaharian at isinasalin sa isahan ang idyomatikong maramihang οὐρανῶν.
theological_decisions:
- issue: 'Panlalaking pang-uring ginamit bilang pangngalan: πλούσιος'
  choice: isang mayamang lalaki
  alternative: isang taong mayaman
  rationale: Ang Griyego ay panlalaki at isahan, at ang konteksto ay tumutukoy sa kinatawang indibidwal na lalaki; hindi ito ginawang neutral sa kasarian.
- issue: Pagsasalin ng Ἀμὴν sa pormula ni Jesus
  choice: Tunay
  alternative: Amen
  rationale: Ipinababatid ng “Tunay” ang taimtim na katiyakan ng pahayag sa madaling maunawaang Filipino, habang pinananatili sa talababa ang maaaring pormal na transliterasyon.
- issue: Lakas ng pahayag na δυσκόλως
  choice: mahirap para ... na makapasok
  alternative: halos hindi makapasok
  rationale: Pinananatili ang kahulugan ng kahirapan nang hindi inuunahan ang mas matinding paghahambing sa kasunod na talata o ginagawang halos imposible ang pahayag dito.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at pinanatili ang tradisyonal ngunit pangkaraniwang mga terminong “alagad” at “kaharian ng langit.”
