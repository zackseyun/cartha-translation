base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Hindi lahat ay kayang tanggapin ang pananalitang ito,[a] kundi ang mga pinagkalooban lamang.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pahayag na ito” o “turong ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring Diyos ang ipinahihiwatig na nagkaloob, ngunit hindi tahasang binabanggit sa Griyego kung sino ang tagapagkaloob.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: sinabi
  rationale: Karaniwang salin ng aorist na anyo ng λέγω sa pagpapakilala ng tuwirang sinabi; natural ito sa makabagong Tagalog.
- source_word: Οὐ πάντες
  choice: Hindi lahat
  rationale: 'Tuwirang pinananatili ang negated universal: hindi ito naaangkop sa bawat isa.'
- source_word: χωροῦσι
  choice: kayang tanggapin
  rationale: Sa idyomang ito, ang χωρέω ay tumutukoy sa pagkakaroon ng puwang o kakayahang tanggapin ang isang pahayag; malinaw at natural ang saling ito nang hindi nawawala ang diwa ng kakayahan.
- source_word: τὸν λόγον τοῦτον
  choice: ang pananalitang ito
  rationale: Ang λόγος dito ay tumutukoy sa naunang sinabi ni Jesus. Ang “pananalita” ay mas natural kaysa literal na “salita” at hindi nito ipinipilit kung ito ay isang pahayag o mas malawak na turo.
- source_word: ἀλλ’ οἷς
  choice: kundi ang mga ... lamang
  rationale: Ipinahahayag ng “kundi” at “lamang” ang mahigpit na pagtatangi sa mga taong tinutukoy ng kasunod na sugnay.
- source_word: δέδοται
  choice: pinagkalooban
  rationale: Pinananatili ng salitang ito ang perpektong pasibo at ang diwang may ipinagkaloob na may patuloy na bunga, habang hindi tahasang pinapangalanan ang nagkaloob.
theological_decisions:
- issue: Ang hindi binanggit na tagapagkaloob sa pasibong δέδοται
  choice: Panatilihing hindi tahasang pinangalanan ang tagapagkaloob sa pangunahing teksto.
  alternative: “kundi ang mga pinagkalooban lamang ng Diyos”
  rationale: Malamang na isang divine passive ito at Diyos ang ipinahihiwatig na tagapagkaloob, ngunit walang tahasang simuno ang Griyego. Pinananatili ng salin ang sadyang di-pagtukoy ng teksto.
- issue: Kung ano mismo ang ipinagkaloob
  choice: Gamitin ang absolutong “pinagkalooban” na tumutukoy sa kakayahang tanggapin ang pananalita.
  alternative: “kundi ang mga binigyan lamang ng kakayahang tanggapin ito”
  rationale: Ipinahihiwatig ng konteksto ang kakayahang tumanggap, ngunit hindi tahasang inuulit ng Griyego ang bagay na ipinagkaloob. Ang mas maikling anyo ay umiiwas sa labis na pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pananalita” upang maging natural ang pagtukoy sa naunang sinabi, at “pinagkalooban” upang mapanatili ang pasibong anyo at ang hindi tahasang pinangalanang tagapagkaloob.
