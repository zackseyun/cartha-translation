id: MAT.19.28
reference: Matthew 19:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: tl
  text: 'Sinabi ni Jesus sa kanila, “Tinitiyak ko sa inyo: kayong mga sumunod sa akin ay uupo rin sa labindalawang trono sa pagpapanibago[a], kapag umupo na ang Anak ng Tao sa kanyang maluwalhating trono, at hahatulan[b] ninyo ang labindalawang lipi ng Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa muling paglikha,” “sa bagong sanlibutan,” o “sa muling pagsilang.” Dito, malamang na tumutukoy ito sa pagpapanibago sa hinaharap na kaugnay ng paghahari ng Anak ng Tao, hindi sa personal na muling kapanganakan.
    reason: lexical_alternative
  - marker: b
    text: Ang “hahatulan” ay maaari ring magtaglay ng diwang “pamamahalaan” o “mamumuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Tinitiyak ko sa inyo
  rationale: Likas at marangal na pormula sa makabagong Tagalog na naghahatid ng taimtim at may-awtoridad na diin ng Ἀμὴν λέγω ὑμῖν.
- source_word: ἀκολουθήσαντές μοι
  choice: kayong mga sumunod sa akin
  rationale: Tinutukoy nito ang mga kausap ayon sa kanilang pagsunod kay Jesus at pinananatiling tahasan ang “sa akin.”
- source_word: παλιγγενεσίᾳ
  choice: sa pagpapanibago
  rationale: Pinananatili ang malawak na diwa ng muling pagpapanibago sa hinaharap nang hindi idinaragdag sa pangunahing teksto ang “ng lahat ng bagay,” na hindi tahasang nasa Griyego.
- source_word: ὅταν καθίσῃ
  choice: kapag umupo na
  rationale: Natural na Tagalog para sa panghinaharap na temporal na sugnay; ipinahihiwatig ng “na” ang pagdating ng itinakdang kalagayan nang hindi ginagawang teknikal ang pangungusap.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Karaniwang salin ng titulo na nagpapanatili sa anyo at sa Danieliko at mesiyanikong alingawngaw nito.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: sa kanyang maluwalhating trono
  rationale: Natural at marangal na Tagalog na tumpak na naghahatid sa katangiang ipinahahayag ng genitibong “ng kanyang kaluwalhatian.”
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: ay uupo rin
  rationale: Ang “rin” ay naghahatid sa καί at malinaw na iniuugnay ang pag-upo ng mga alagad sa pag-upo ng Anak ng Tao.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: sa labindalawang trono
  rationale: Direkta, malinaw, at natural na locative na salin.
- source_word: κρίνοντες
  choice: at hahatulan ninyo
  rationale: Ginawang finite clause para sa natural na Tagalog habang pinananatili ang pangunahing hudisyal na diwa ng pandiwa at ang mga alagad bilang tagaganap.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: ang labindalawang lipi ng Israel
  rationale: Karaniwan at tumpak na salin ng makasaysayang mga lipi ng Israel.
theological_decisions:
- issue: Kahulugan ng παλιγγενεσία sa konteksto
  choice: pagpapanibago sa hinaharap na kaugnay ng paghahari ng Anak ng Tao
  alternative: personal na muling kapanganakan; bagong kapanahunan; bagong sanlibutan
  rationale: Ang agarang konteksto ay ang pagluklok at paghatol sa hinaharap, hindi ang indibidwal na pagbabagong espirituwal. Hindi tinutukoy nang lampas sa teksto ang isang partikular na sistemang pangwakas na panahon.
- issue: Saklaw ng κρίνοντες
  choice: hahatulan
  alternative: pamamahalaan; paghaharian
  rationale: Ang tuwirang diwa ay paghatol, bagaman maaari rin itong magpahiwatig ng paggamit ng kapangyarihang mamahala. Pinanatili sa teksto ang paghatol at inilagay sa talababa ang mas malawak na posibleng diwa.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tinitiyak ko sa inyo” bilang natural na solemneng pormula, “pagpapanibago” upang mapanatili ang eskatolohikong lawak nang hindi nagdaragdag sa teksto, at finite na “hahatulan ninyo” para sa malinaw na sintaks sa Tagalog. Ang lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
