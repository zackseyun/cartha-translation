  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: tl
  text: Sinabi niya sa kanya[a], “Bakit mo ako tinatanong tungkol sa kung ano ang mabuti? Iisa ang mabuti.[b] Ngunit kung nais mong pumasok sa buhay, sundin mo ang mga utos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito at sa mga katumbas na salaysay: “Bakit mo ako tinatawag na mabuti? Walang mabuti maliban sa iisa—ang Diyos.” Sa tekstong SBLGNT ng Mateo naman ay mababasa: “Bakit mo ako tinatanong tungkol sa kung ano ang mabuti? Iisa ang mabuti.”'
    reason: textual_variant
  - marker: b
    text: 'Maaari ring isalin: “May iisa na mabuti.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Bakit mo ako tinatanong tungkol sa kung ano ang mabuti?
  rationale: Ang neuter singular na τοῦ ἀγαθοῦ ay tumutukoy sa kung ano ang mabuti, hindi sa isang taong tinatawag na mabuti. Likas sa makabagong Tagalog ang pariralang ito at hindi nito itinutugma nang sapilitan ang Mateo sa mga katumbas na salaysay sa Marcos at Lucas.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Iisa ang mabuti.
  rationale: Pinananatili ng maikli at mariing pahayag ang εἷς at ang substantival na ὁ ἀγαθός, pati ang ugnayan nito sa naunang pagbanggit sa mabuti. Hindi nito tahasang idinaragdag ang “Diyos,” na wala sa tekstong SBLGNT ng Mateo rito.
- source_word: εἰ δὲ θέλεις
  choice: Ngunit kung nais mong
  rationale: Ang θέλω ay nagsasaad ng pagnanais o layunin. Dignified at pangkaraniwan ang “nais,” at ipinapakita ng “ngunit” ang bahagyang pagsalungat ng δέ.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: pumasok sa buhay
  rationale: Malinaw at natural itong Tagalog para sa pagpasok sa ganap o panghinaharap na buhay. Hindi idinagdag ang “walang hanggan,” sapagkat wala iyon sa mismong sugnay.
- source_word: τήρησον τὰς ἐντολάς
  choice: sundin mo ang mga utos
  rationale: Sa konteksto ng mga utos ng Diyos, likas na katumbas ng τηρέω ang “sundin.” Ang “mga utos” ay malinaw, kasalukuyan, at may sapat na bigat nang hindi nagiging matigas ang pananalita.
theological_decisions:
- issue: Kaugnayan ng sinabi ni Jesus sa kabutihan ng Diyos at sa pagkakakilanlan ni Cristo
  choice: Isinalin ang natatanging anyo ng Mateo bilang tanong tungkol sa kung ano ang mabuti at sagot na “Iisa ang mabuti,” nang hindi ito ginagawang pagtanggi sa kabutihan o pagka-Diyos ni Jesus.
  alternative: 'Itugma sa Marcos at Lucas: “Bakit mo ako tinatawag na mabuti? Walang mabuti maliban sa iisa—ang Diyos.”'
  rationale: Iba ang pagbasa ng tekstong SBLGNT sa Mateo kaysa sa anyo ng mga katumbas na salaysay. Dapat panatilihin ang pagkakaibang iyon at ang teolohikal na tensiyon nang hindi nagdaragdag ng isang konklusyong hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “rito” upang natural na tukuyin ang kausap at maiwasan ang paulit-ulit na panghalip. Ang “Iisa ang mabuti” ay sadyang maikli at bahagyang markado upang mapanatili ang anyo at tunay na kalabuan ng Griyego; hindi ito ginawang mas tiyak kaysa sa pinagmulan.
