  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: tl
  text: at sinabi, “Dahil dito, iiwan ng lalaki ang kanyang ama at ina at mabubuklod[a] sa kanyang asawa, at ang dalawa ay magiging isang laman”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makikiisa sa” o “didikit nang mahigpit sa.” Ang pandiwang Griyego ay nagpapahiwatig ng mahigpit na pagkakadugtong o pagkakaugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: Dahil dito
  rationale: Natural na makabagong Tagalog na nagpapanatili sa sanhi o batayang ipinakikilala ng parirala.
- source_word: καταλείψει
  choice: iiwan
  rationale: Tuwirang ipinapahayag ang kilos sa hinaharap nang hindi gumagamit ng makalumang pananalita.
- source_word: ἄνθρωπος
  choice: ang lalaki
  rationale: Sa siping ito tungkol sa pag-aasawa, tumutukoy ang panlalaking anyo sa lalaking kapareha na iuugnay sa kanyang asawa.
- source_word: κολληθήσεται
  choice: mabubuklod siya sa
  rationale: Ipinahihiwatig ng pandiwang Griyego ang mahigpit na pagkakadugtong o pagkakaugnay. Natural sa Tagalog ang “mabubuklod” at napananatili nito ang anyong tumatanggap ng kilos.
- source_word: γυναικὶ αὐτοῦ
  choice: kanyang asawa
  rationale: Bagaman maaari ring mangahulugang “babae” ang γυνή, malinaw na “asawa” ang kahulugan sa konteksto ng pag-aasawa.
- source_word: οἱ δύο
  choice: ang dalawa
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang tao sa tekstong Griyego.
- source_word: εἰς σάρκα μίαν
  choice: magiging isang laman
  rationale: Pinananatili ang matimbang at kongkretong idyoma ng sipi sa Genesis, pati ang diwa ng pagpasok sa isang bagong pagkakaisa.
theological_decisions:
- issue: Panlalaking katawagan sa sipi tungkol sa pag-aasawa
  choice: ang lalaki … kanyang asawa
  alternative: ang isang tao … kanyang kabiyak
  rationale: Partikular na lalaki ang tinutukoy ng ἄνθρωπος sa pagkakapares nito sa “kanyang asawa”; ang neutral na salin ay magpapalabo sa anyo ng orihinal na sipi.
- issue: Idyoma ng pagkakaisa sa pag-aasawa
  choice: ang dalawa ay magiging isang laman
  alternative: ang dalawa ay magiging iisa
  rationale: Ang “isang laman” ay nagpapanatili sa sadyang kongkreto at teolohikal na matimbang na pananalita ng Genesis sa halip na ipaliwanag o paliitin ang kahulugan nito.
- issue: Tandang pananong sa dulo ng talata
  choice: panatilihin ang tandang pananong pagkatapos ng sipi
  alternative: tapusin ang sipi sa tuldok
  rationale: Ang Griyegong semicolon ay tandang pananong at isinasara nito ang mas malawak na tanong na nagsimula sa naunang talata, bagaman pasalaysay ang mga salitang nasa loob ng sipi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” sa halip na mas pormal na “kaniyang,” at pinanatili ang tradisyonal ngunit madaling maunawaang idyomang “isang laman.”
