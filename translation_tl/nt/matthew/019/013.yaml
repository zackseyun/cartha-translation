  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: tl
  text: Pagkatapos, dinala sa kanya ang mga bata upang ipatong niya sa kanila ang kanyang mga kamay at manalangin; ngunit sinaway sila[a] ng mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sila” ay maaaring tumukoy sa mga bata o sa mga nagdala sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na pangyayari sa salaysay; natural at maikli ang “Pagkatapos” sa makabagong Filipino.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: dinala sa kanya ang mga bata
  rationale: Pinananatili ang diwang pasibo ng προσφέρω at ang payak na kahulugan ng παιδία nang hindi nagdaragdag ng di-tiyak na diin gaya ng “maliliit na bata.”
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: upang ipatong niya sa kanila ang kanyang mga kamay
  rationale: Ipinapahayag ng “upang” ang layunin, at malinaw na inililipat ng parirala ang kilos ng pagpapatong ng mga kamay sa mga bata.
- source_word: καὶ προσεύξηται
  choice: at manalangin
  rationale: Walang tahasang layon ang pandiwang Griyego, kaya hindi idinagdag ang “para sa kanila,” bagaman mahihinuha iyon sa konteksto.
- source_word: οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς
  choice: ngunit sinaway sila ng mga alagad
  rationale: Ipinakikita ng “ngunit” ang banayad na pagsalungat ng δέ, at sapat na matindi ang “sinaway” para sa ἐπιτιμάω. Pinananatili ng “sila” ang kalabuan ng panghalip na αὐτοῖς.
theological_decisions:
- issue: Tinutukoy ng huling αὐτοῖς
  choice: sila
  alternative: ang mga bata; o ang mga nagdala sa mga bata
  rationale: Maaaring tumukoy ang panghalip na Griyego sa mga bata o sa mga nagdala sa kanila. Hindi pumipili ang salin sa dalawang posibilidad at inilalahad ang tunay na kalabuan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “mga bata” at “sinaway,” habang iniwasan ang labis na pormal o denominasyonal na pananalita.
