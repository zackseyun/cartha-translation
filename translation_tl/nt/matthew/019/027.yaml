  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: tl
  text: Pagkatapos ay sumagot si Pedro sa kanya, “Tingnan po ninyo, iniwan namin ang lahat at sumunod kami sa inyo. Ano po kaya ang mapapasaatin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos ay
  rationale: Ipinahahayag ang kasunod na pangyayari sa daloy ng salaysay nang natural sa modernong Tagalog.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: sinabi
  rationale: Ang Semitikong/Griyegong idyomang literal na ‘sumagot at nagsabi’ ay natural na naipahahayag bilang ‘sinabi’; tugon ito sa naunang pangyayari kahit walang tahasang tanong.
- source_word: Ἰδοὺ
  choice: Tingnan po ninyo
  rationale: Panawag-pansin ito, hindi literal na utos lamang na tumingin; pinananatili ang diin at nilalagyan ng magalang na anyo dahil kausap si Jesus.
- source_word: ἀφήκαμεν πάντα
  choice: iniwan namin ang lahat
  rationale: Tuwirang pinananatili ang saklaw ng πάντα at ang perpektibong diwa ng pag-iwan na may kaugnayan sa kasalukuyang kalagayan.
- source_word: ἠκολουθήσαμέν σοι
  choice: sumunod kami sa inyo
  rationale: Likas na Tagalog para sa pagsunod sa isang tao bilang alagad; ang ‘inyo’ ay magalang na isahan sa kontekstong ito.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Ano po kaya ang mapapasaatin?
  rationale: Pinananatili ng ‘kaya’ ang inferensiyal na diin ng ἄρα, at ng ‘mapapasaatin’ ang bukas na tanong kung ano ang magiging bahagi o matatanggap nila.
theological_decisions:
- issue: Kung tahasang gagawing tanong tungkol sa gantimpala ang τί ἄρα ἔσται ἡμῖν
  choice: Ano po kaya ang mapapasaatin?
  alternative: Ano po kaya ang matatanggap namin?
  rationale: Hindi tahasang ginagamit sa Griyego ang pandiwang ‘tumanggap.’ Ang napiling salin ay nagpapanatili sa mas malawak at bahagyang malabong ‘ano ang magiging para sa amin,’ nang hindi ipinagpapalagay na gantimpala lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at dignificado. Ginamit ang ‘po’ at magalang na panghalip para sa pakikipag-usap ni Pedro kay Jesus, habang iniwasan ang labis na makaluma o teknikal na pananalita.
