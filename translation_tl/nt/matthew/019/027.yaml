  verdict: revise
  source_fidelity: Kailangang maipakita ang ἀποκριθεὶς, na nagsasaad na tumugon si Pedro. Ang kasalukuyang “sinabi ni Pedro” ay nakapagpapahayag ng εἶπεν ngunit hindi ng aspekto ng pagtugon. Ang “Pagkatapos ay” ay katanggap-tanggap para sa Τότε; ang “iniwan namin ang lahat,” “sumunod kami sa inyo,” at “Ano po kaya ang mapapasaatin?” ay tapat sa saklaw at maingat na pagkabukas ng Griyego.
  naturalness: Natural at marangal ang register. Mas maayos at mas idiomatiko ang “sumagot si Pedro sa kanya” kaysa “sumagot si Pedro at sinabi,” habang malinaw na ipinahihiwatig ng kasunod na tuwirang pananalita ang pagsasalita.
  terminology: Wasto ang magalang na “po” at “inyo” sa modernong Filipino Tagalog kapag si Jesus ang kausap. Ang “mapapasaatin” ay angkop na pinananatili ang di-tiyak na “ano ang magiging para sa amin,” nang hindi nililimitahan sa “gantimpala” o “matatanggap.”
