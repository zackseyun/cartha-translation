  text: And large crowds followed him, and he healed them there.
translation:
  language: tl
  text: At sinundan siya ng maraming tao, at pinagaling niya sila roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  choice: sinundan siya
  rationale: Likas na salaysay sa Filipino para sa literal na pagsunod kay Jesus; hindi nito dinaragdagan ang teksto ng tiyak na diwang pagiging alagad.
- source_word: ὄχλοι πολλοί
  choice: napakaraming tao
  rationale: Bagaman literal na “maraming mga pulutong,” mas natural sa modernong Filipino ang “napakaraming tao” at malinaw nitong ipinahihiwatig ang malaking bilang ng mga taong sumusunod.
- source_word: ἐθεράπευσεν
  choice: pinagaling
  rationale: Karaniwan at malinaw na katumbas ng pandiwa sa konteksto ng pagpapagaling sa salaysay ng Ebanghelyo.
- source_word: αὐτούς
  choice: sila
  rationale: Tumutukoy pabalik sa napakaraming tao at natural na layon ng pandiwang “pinagaling” sa Filipino.
- source_word: ἐκεῖ
  choice: roon
  rationale: Pinananatili ang payak na pagtukoy sa lugar; “roon” ang angkop dahil ang lugar ay malayo sa nagsasalita o nasa naunang konteksto.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang payak at magkatabing pag-uugnay ng dalawang kilos sa Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “napakaraming tao” sa halip na literal ngunit alanganing “maraming pulutong,” habang pinanatili ang payak na daloy ng salaysay.
