  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Dahil sa katigasan ng inyong puso, pinahintulutan kayo ni Moises na hiwalayan ang inyong mga asawa,[a] ngunit mula pa sa pasimula ay hindi ito naging ganito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “paalisin ang inyong mga asawa”; sa kontekstong ito, ang tinutukoy ay diborsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ang pangkasaysayang pangkasalukuyan sa Griyego ay likas na isinasalin sa pangnagdaan sa makabagong salaysay sa Filipino.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Dahil sa katigasan ng inyong puso
  rationale: Malinaw nitong ipinahahayag ang sanhi o batayan habang pinananatili ang kongkretong biblikal na idyoma ng ‘matigas na puso.’
- source_word: ἐπέτρεψεν
  choice: pinahintulutan
  rationale: Nagsasaad ito ng pagbibigay-pahintulot, hindi ng pag-uutos o pagsang-ayon.
- source_word: ἀπολῦσαι
  choice: hiwalayan
  rationale: Sa konteksto ng pag-aasawa, ang pandiwa ay tumutukoy sa diborsiyo o pormal na paghihiwalay, hindi lamang sa pagpapaalis.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: ang inyong mga asawa
  rationale: Bagaman maaaring mangahulugang ‘mga babae’ ang γυνή, malinaw na ‘mga asawa’ ang kahulugan sa usapin ng kasal at diborsiyo.
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa pasimula
  rationale: Natural at marangal na pananalita ito na pinananatili ang pahiwatig sa kaayusan ng paglikha.
- source_word: οὐ γέγονεν οὕτως
  choice: hindi ganito
  rationale: Ipinahahayag nito ang umiiral na kalagayang tinutukoy ng Griyegong perfect nang hindi pilit na nagpapasok ng panahunan na hindi likas sa Filipino.
theological_decisions:
- issue: Kung ang ginawa ni Moises ay dapat ilarawan bilang utos, konsesyon, o pahintulot
  choice: pinahintulutan kayo ni Moises
  alternative: iniutos sa inyo ni Moises
  rationale: Ang ἐπέτρεψεν ay pahintulot o konsesyon, hindi positibong utos; mahalaga ito sa paghahambing ni Jesus sa probisyong Mosaiko at sa kalagayan mula sa pasimula.
- issue: Kung dapat gawing tahasan ang pahiwatig sa kaayusan ng paglikha
  choice: ngunit hindi ganito mula pa sa pasimula
  alternative: ngunit hindi ito ang disenyo ng Diyos mula sa pasimula
  rationale: Pinananatili ng salin ang mismong antas ng pagpapahayag ng Griyego at hindi nagdaragdag ng paliwanag na teolohikal sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na idyomang “katigasan ng inyong puso” at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
