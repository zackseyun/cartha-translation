  terminology: Ang “katigasan ng inyong puso,” “pinahintulutan,” at “mga asawa” ay angkop. Maaaring manatili ang “hiwalayan” sa pangunahing teksto dahil ito ay karaniwang Filipino sa ganitong konteksto, habang wastong nililinaw ng talababa ang legal na kahulugang diborsiyo.
