  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: tl
  text: Sapagkat may mga bating na isinilang nang gayon mula sa sinapupunan ng kanilang ina, may mga bating na ginawang bating ng mga tao, at may mga bating na ginawa ang sarili nilang bating alang-alang sa kaharian ng langit.[a] Ang may kakayahang tumanggap nito ay tanggapin niya ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kinapon ang kanilang sarili.” Maraming tagapagpaliwanag ang nagpapakahulugan dito bilang pagpili na huwag mag-asawa alang-alang sa kaharian ng Diyos.
    reason: alternative_reading
  - marker: b
    text: O “Ang may kakayahang magbigay-puwang dito ay bigyan niya ito ng puwang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: mga bating
  rationale: Ang “bating” ang tuwirang salitang Tagalog para sa eunuch. Inulit ito sa tatlong sugnay upang mapanatili ang kapansin-pansing pag-uulit sa Griyego at hindi agad ipakahulugang “mga hindi nag-aasawa.”
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: isinilang nang gayon mula sa sinapupunan ng kanilang ina
  rationale: Pinananatili nito ang malinaw at masidhing idyoma ng Griyego tungkol sa kalagayan nila mula pa sa kapanganakan, sa likas at marangal na modernong Tagalog.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: ginawang bating ng mga tao
  rationale: Pinananatili ang ugnayang leksikal ng pangngalan at pandiwa sa Griyego. Hindi nito nililimitahan ang pahayag sa mas tahasang anatomikong salitang “kinapon.”
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: ginawang bating ang kanilang sarili
  rationale: Tuwirang isinasalin ang mapanghamong pananalita nang hindi ipinapasiya sa pangunahing teksto kung literal, eksaherado, o metaporikal ito.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: alang-alang sa kaharian ng langit
  rationale: Ang “alang-alang sa” ay malinaw na naghahayag ng layunin o motibo ng διά na may akusatibo at natural sa marangal na Tagalog.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Ang makatatanggap nito ay tanggapin ito
  rationale: Ipinahahayag ng “tanggapin” ang idyomatikong diwa ng χωρέω bilang pagbibigay-puwang o pagtanggap sa isang mahirap na aral, habang pinananatili ang puwersa ng pautos.
theological_decisions:
- issue: Kung literal o metaporikal ang εὐνούχισαν ἑαυτοὺς
  choice: Panatilihin sa pangunahing teksto ang literal na anyong “ginawang bating ang kanilang sarili.”
  alternative: “kinapon ang kanilang sarili” o “piniling huwag mag-asawa”
  rationale: Hindi tahasang nilulutas ng talata kung literal, hayperboliko, o metaporikal ang ikatlong uri. Pinananatili ng salin ang tunay na tensiyon, at inilalagay sa talababa ang karaniwang interpretasyon tungkol sa kusang hindi pag-aasawa.
- issue: Ang diwa ng χωρεῖν sa pangwakas na pangungusap
  choice: “makatatanggap … tanggapin”
  alternative: “makauunawa … unawain” o “makapagbibigay-puwang … bigyang-puwang”
  rationale: Mas malawak kaysa intelektuwal na pag-unawa lamang ang pandiwa; tumutukoy ito sa kakayahang tanggapin o bigyang-puwang ang mahirap na aral. Ang napiling anyo ay natural at nananatiling malapit sa idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bating,” isang tuwiran ngunit hindi karaniwang salitang biblikal, upang mapanatili ang eksaktong leksikal na pag-uulit at ang sadyang matinding pananalita ng orihinal. Ang “makatatanggap” ay piniling pormal ngunit buhay na anyo; iniwasan ang mas lumang baybay na “makakatanggap” bilang pangunahing anyo.
