base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang mga alagad, “Kung ganyan ang kalagayan[a] ng lalaki sa kanyang asawa, hindi makabubuting mag-asawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kung ganito ang usapin ng lalaki at ng kanyang asawa.” Maikli at masaklaw ang pariralang Griyego; ang salitang isinaling “kalagayan” ay maaari ring mangahulugang “usapin” o “sitwasyon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: Sinabi sa kanya
  rationale: Ang pangkasalukuyang pandiwa sa Griyego ay historical present sa salaysay; natural itong isalin sa nagdaang panahunan sa Tagalog.
- source_word: οἱ μαθηταί
  choice: ng mga alagad niya
  rationale: Ang “mga alagad” ang karaniwan at marangal na katawagan sa mga disipulo ni Jesus at pinananatili ang diwa ng pagkatuto at pagsunod.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Kung ganyan ang kalagayan
  rationale: Likas na ipinahahayag ng “ganyan” ang pagtukoy sa naunang sinabi ni Jesus; ang “kalagayan” ay angkop sa masaklaw na kahulugan ng αἰτία rito bilang usapin o sitwasyon, hindi tuwirang sanhi.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: ng lalaki sa kanyang asawa
  rationale: Pinananatili ang panlalaking anyo at ang kontekstong pangmag-asawa; ang “kanyang” ay likas na ipinahihiwatig sa Tagalog bagaman hindi tahasang nasa Griyego.
- source_word: οὐ συμφέρει
  choice: hindi makabubuti
  rationale: Natural na Tagalog ito para sa kawalan ng pakinabang o kabutihang dulot, nang hindi ginagawang tahasang moral na pagbabawal ang sinabi.
- source_word: γαμῆσαι
  choice: mag-asawa
  rationale: Karaniwang Tagalog na katumbas ng infinitibong “to marry,” at angkop sa dignidad ng salaysay.
theological_decisions:
- issue: Kasariang ipinahahayag ng ἀνθρώπου ... γυναικός
  choice: ng lalaki sa kanyang asawa
  alternative: ng isang tao sa kanyang kabiyak
  rationale: Tahasang lalaki at asawa niyang babae ang nasa agarang konteksto; hindi ginawang neutral ang kasarian ng pinagmulan.
- issue: Lakas ng pahayag na οὐ συμφέρει
  choice: hindi makabubuting mag-asawa
  alternative: hindi nararapat mag-asawa
  rationale: Ang “makabubuti” ay nagpapanatili sa ideya ng kapakinabangan o pagiging kapaki-pakinabang at hindi ito ginagawang utos o ganap na pagbabawal.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “ganyan ang kalagayan” upang tumukoy sa naunang turo ni Jesus, at “hindi makabubuti” upang mapanatili ang praktikal na diwa ng συμφέρει nang hindi ito gawing isang tahasang utos.
