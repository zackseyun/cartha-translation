id: MAT.19.4
reference: Matthew 19:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: tl
  text: Sumagot siya, “Hindi ba ninyo nabasa na ang lumikha sa kanila mula pa sa simula[a] ay ginawa silang lalaki at babae?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa pasimula.”'
    reason: Ang ἀπ’ ἀρχῆς ay maaaring natural na ipahayag bilang “mula pa sa simula” o, sa mas pormal at mas malinaw na alingawngaw ng Genesis, “sa pasimula.”
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Likas na ipinahahayag sa Filipino ng iisang pandiwa ang karaniwang Griyegong pariralang participle at finite verb; hindi kailangang ulitin bilang “sumagot at sinabi.”
- source_word: Οὐκ ἀνέγνωτε
  choice: Hindi ba ninyo nabasa
  rationale: Pinananatili ang mapanghamong tanong tungkol sa dati na nilang pagbasa sa Kasulatan at natural ang aspektong ganap ng “nabasa” sa Filipino.
- source_word: ὁ κτίσας
  choice: ang lumikha sa kanila
  rationale: Tuwirang isinasalin ang articular participle bilang paglalarawan sa gumawa ng paglikha, sa halip na gawing titulong “Maylikha.”
- source_word: ἀπ’ ἀρχῆς
  choice: mula pa sa simula
  rationale: Pinananatili ang alingawngaw ng salaysay ng paglikha sa Genesis at ang diwang nagsimula noong pasimula.
- source_word: ἄρσεν καὶ θῆλυ
  choice: lalaki at babae
  rationale: Ito ang natural at tuwirang pares sa Filipino na tumutugma sa pananalita ng Genesis tungkol sa kasariang nilalang.
- source_word: ἐποίησεν αὐτούς
  choice: ginawa silang
  rationale: Ipinakikita ang kaibhan ng ποιέω sa naunang κτίζω sa pamamagitan ng “ginawa” sa halip na ulitin ang “nilikhang.”
theological_decisions:
- issue: Paglalahad ng pahayag tungkol sa paglikha kaugnay ng Genesis 1:27
  choice: Pinanatili ang pares na “lalaki at babae” nang walang pagpapaliwanag o pagpapalawak.
  alternative: “ginawa silang isang lalaki at isang babae” o “ginawa silang lalake at babae”
  rationale: Tuwirang sumasangguni si Jesus sa salaysay ng paglikha. Ang “lalaki at babae” ang pinakamalapit at pinakanatural na katumbas ng Griyego habang hindi nagdaragdag ng doktrinal na kongklusyon na wala mismo sa talata.
- issue: Ugnayan ng “mula pa sa simula” sa sugnay
  choice: Inilagay ito kasunod ng “lumikha sa kanila,” kaya pinakamalapit itong kaugnay ng pagkilos na lumikha.
  alternative: “mula pa sa simula, ang lumikha sa kanila ay…”
  rationale: Ang ayos na ito ay sumusunod sa pinakamalapit na sintaktikong ugnayan sa Griyego ngunit hindi labis na nilulutas ang bahagyang kaluwagan ng parirala sa kabuuang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” bilang pangmaramihang pagtukoy sa mga kausap at iniwasan ang mabigat na “sumagot at sinabi.”
