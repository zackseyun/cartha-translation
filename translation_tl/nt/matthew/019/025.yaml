  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: tl
  text: Nang marinig ito ng mga alagad, labis silang namangha at sinabi nila, “Kung gayon, sino ang maaaring maligtas?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig ito
  rationale: Ginawang sugnay na temporal ang aorist participle upang maging natural sa Filipino. Idinagdag ang “ito” bilang malinaw na pagtukoy sa naunang sinabi ni Jesus.
- source_word: δὲ
  choice: '[di-tuwirang ipinahiwatig]'
  rationale: Nagpapakita ito ng pagpapatuloy o bahagyang pagtutol, ngunit sapat na sa natural na Filipino ang panimulang “Nang...” upang iugnay ang pangungusap sa nauna.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Karaniwan, malinaw, at kontekstuwal na katawagan sa mga tagasunod na tinuturuan ni Jesus.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: labis silang namangha
  rationale: Pinananatili ng “labis” ang matinding antas ng σφόδρα, samantalang ang “namangha” ay likas at marangal na paglalarawan sa kanilang matinding pagkabigla.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ang participle na nagpapakilala sa kanilang sinabi ay likas na isinalin bilang pandiwang may hangganan sa salaysay na Filipino.
- source_word: Τίς ἄρα
  choice: Kung gayon, sino
  rationale: Ipinahahayag ng “kung gayon” ang paghihinuha at pagkabigla na dala ng inferential particle na ἄρα.
- source_word: δύναται
  choice: maaaring
  rationale: Ipinahahayag ang kakayahan o posibilidad sa natural na Filipino nang hindi dinaragdagan ang diwa.
- source_word: σωθῆναι
  choice: maligtas
  rationale: Ang “maligtas” ang kinikilalang salin sa konteksto ng pagpasok sa kaharian at pinananatili nito ang passive na diwa nang hindi tinutukoy kung paano isinasagawa ang pagliligtas.
theological_decisions:
- issue: Kahulugan ng σωθῆναι sa konteksto
  choice: maligtas
  alternative: mailigtas / masagip
  rationale: Sa konteksto ng pagpasok sa kaharian at ng sinabi tungkol sa mayaman, ang tanong ay tungkol sa kaligtasan sa buong teolohikal na diwa nito, hindi lamang sa pagliligtas mula sa pansamantalang panganib. Hindi tinutukoy ng salin ang mekanismo o sistemang doktrinal ng kaligtasan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “mga alagad” bilang pamilyar na katawagang biblikal, at ang “Kung gayon” upang malinaw na maipakita ang paghihinuha ng mga alagad mula sa naunang sinabi ni Jesus.
