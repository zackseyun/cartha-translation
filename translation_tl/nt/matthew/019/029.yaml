id: MAT.19.29
reference: Matthew 19:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: tl
  text: At ang bawat isa na nag-iwan ng mga bahay o mga kapatid na lalaki o mga kapatid na babae o ama o ina o asawa o mga anak o mga bukid alang-alang sa aking pangalan ay tatanggap ng sandaang ulit at magmamana ng buhay na walang hanggan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: ang bawat
  rationale: 'Likas at maikli sa modernong Tagalog, habang pinananatili ang distributibo at pangkalahatang saklaw: bawat taong tumutupad sa inilalarawang kalagayan.'
- source_word: ἀφῆκεν
  choice: nag-iwan
  rationale: Hindi kasing-bigat ng “tumalikod” o “nagtakwil,” kaya hindi nito dinaragdagan ang diwa; ipinahihiwatig ng konteksto na ang pag-iwan ay alang-alang kay Jesus.
- source_word: οἰκίας
  choice: mga bahay
  rationale: Pinananatili ang kongkretong pangmaramihang katawagan at ang pagkakatulad nito sa mga bukid bilang ari-arian.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: mga kapatid na lalaki o babae
  rationale: Tahasan nitong pinananatili ang magkahiwalay na pagtukoy ng Griyego sa mga kapatid na lalaki at mga kapatid na babae.
- source_word: πατέρα ἢ μητέρα
  choice: ama o ina
  rationale: Tuwirang salin ng mga katawagang pampamilya, na likas sa Tagalog kahit walang pantukoy sa bawat isa.
- source_word: γυναῖκα
  choice: asawa
  rationale: Sa talaan ng mga ugnayang pampamilya, ang kahulugan ay asawa, hindi babae sa pangkalahatan. Hindi na nilagyan ng kasarian dahil natural at tumpak ang “asawa” sa Tagalog.
- source_word: τέκνα
  choice: mga anak
  rationale: Karaniwan at malinaw na katawagan para sa mga supling sa isang talaang pampamilya.
- source_word: ἀγρούς
  choice: mga bukid
  rationale: Kongkreto at sapat na malawak para sa mga lupang sakahan, nang hindi ipinapalagay ang isang tiyak na kaayusan ng pagmamay-ari.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: alang-alang sa aking pangalan
  rationale: Pinananatili ang idyomang “aking pangalan” at ang diwa ng pagkilos dahil sa katapatan kay Jesus, sa paraang marangal at likas sa Tagalog.
- source_word: ἑκατονταπλασίονα
  choice: sandaang ulit
  rationale: Malinaw sa modernong Tagalog at pinananatili ang buong dami ng pangako nang hindi gumagamit ng mas lumang anyong “makaisandaang.”
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: magmamana ng buhay na walang hanggan
  rationale: Pinananatili ang mahalagang larawang legal at pampamilyang “magmana” at ang karaniwang salin ng buhay na walang hanggan.
theological_decisions:
- issue: Kahulugan ng γυνή sa talaan ng pag-iwan
  choice: asawa
  alternative: babae
  rationale: Ang konteksto ay mga ugnayang sambahayan at pamilya; ang “babae” ay magmumungkahi ng pangkalahatang pag-iwan sa mga babae, na hindi hinihingi ng teksto.
- issue: Pagpapanatili sa “aking pangalan”
  choice: alang-alang sa aking pangalan
  alternative: dahil sa akin / alang-alang sa akin
  rationale: Pinananatili nito ang sadyang teolohikal na idyoma ng teksto tungkol sa pangalan ni Jesus—ang kaniyang pagkakakilanlan, kapamahalaan, at ipinahahayag na katayuan—nang hindi ito pinapaliit sa isang paraphrase.
- issue: Lakas ng ἑκατονταπλασίονα
  choice: sandaang ulit
  alternative: makaisandaang dami
  rationale: Kapwa maaaring magpahayag ng hundredfold, ngunit ang “sandaang ulit” ay higit na malinaw sa ordinaryong modernong mambabasa at hindi binabawasan ang cuantitatibong lakas ng pangako.
- issue: Ugnayan ng pagtanggap at pagmamana
  choice: tatanggap ng sandaang ulit at magmamana ng buhay na walang hanggan
  alternative: tatanggap ng sandaang ulit, pati ng buhay na walang hanggan
  rationale: Pinananatili ang dalawang magkaibang pandiwa ng Griyego at hindi pinag-iisa ang gantimpala at mana sa iisang kilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alang-alang” upang mapanatili ang solemne at biblikal na himig nang hindi nagiging lipas. Walang talababa dahil malinaw na naihahayag sa pangunahing teksto ang mga pangunahing alternatibong leksikal, at walang marker na kailangang ilagay.
