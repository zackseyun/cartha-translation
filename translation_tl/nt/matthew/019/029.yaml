  source_fidelity: 'Tumpak ang mga pangunahing kahulugan: ang pag-iwan, magkakahiwalay na pangkat ng pamilya at ari-arian, pagkilos alang-alang sa pangalan ni Jesus, pagtanggap ng sandaang ulit, at pagmamana ng buhay na walang hanggan. Gayunman, ang “ang bawat nag-iwan” ay kulang ng pangngalan at hindi ganap na likas bilang katumbas ng πᾶς ὅστις.'
  naturalness: 'Kailangan ang maliit ngunit mahalagang pag-aayos sa simula: “ang bawat isa na nag-iwan” ay malinaw at likas sa modernong Filipino Tagalog. Ang pag-uulit ng “o” sa talaan ay mas malinaw ding nagpapakita ng magkakahiwalay na aytem sa Griyego.'
  terminology: Ang “asawa,” “alang-alang sa aking pangalan,” “sandaang ulit,” at “magmamana ng buhay na walang hanggan” ay angkop, tumpak, at nasa marangal ngunit modernong rehistro.
