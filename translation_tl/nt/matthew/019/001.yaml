source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: tl
  text: At nang matapos sabihin ni Jesus ang mga salitang ito, umalis siya sa Galilea at pumunta sa rehiyon ng Judea sa kabila ng Jordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: At nang
  rationale: Ginamit bilang likas na panandang pasalaysay sa Tagalog. Iniiwasan nito ang mabigat at di-likas na “At nangyari na,” habang pinananatili ang paglipat sa susunod na pangyayari.
- source_word: ὅτε ἐτέλεσεν
  choice: nang matapos
  rationale: Ipinahihiwatig ang pagkakumpleto ng naunang pananalita bago ang pag-alis ni Jesus.
- source_word: τοὺς λόγους τούτους
  choice: ang mga salitang ito
  rationale: Tumutukoy sa katatapos na diskurso at malapit na sumusunod sa anyo at diwa ng Griyego.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: umalis siya sa Galilea
  rationale: Likas at malinaw na ipinapahayag ang pag-alis mula sa isang lugar nang hindi gumagamit ng lipas o labis na pormal na pananalita.
- source_word: ἦλθεν εἰς
  choice: pumunta sa
  rationale: Sa pananaw ng karaniwang salaysay sa Tagalog, ito ang likas na paglalarawan ng paglalakbay patungo sa bagong lugar.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: rehiyon ng Judea
  rationale: Ang ὅρια ay maaaring tumukoy sa hangganan, nasasakupan, o rehiyon. Sa konteksto ng paglalakbay, malinaw ang “rehiyon” at hindi nito ipinapalagay na mismong guhit ng hangganan ang tinutukoy.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: sa kabila ng Jordan
  rationale: Pinananatili ang heograpikong kahulugan ng πέραν bilang nasa ibayo o kabilang panig ng Jordan.
