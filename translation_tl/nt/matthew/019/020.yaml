id: MAT.19.20
reference: Matthew 19:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: tl
  text: Sinabi sa kanya ng binata, “Tinupad ko ang lahat ng iyan.[a] Ano pa ang kulang sa akin?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sinunod ko ang lahat ng iyan” o “Iningatan ko ang lahat ng iyan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Saan pa ako nagkukulang?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa makabagong salaysay sa Filipino ang pangnagdaang “Sinabi.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na katumbas ng datibong pantukoy matapos ang pandiwang “sinabi.”
- source_word: ὁ νεανίσκος
  choice: ang binata
  rationale: Tuwirang tumutukoy sa isang kabataang lalaki nang hindi nagdaragdag ng titulong “pinuno” mula sa ibang salaysay.
- source_word: Πάντα ταῦτα
  choice: ang lahat ng iyan
  rationale: Malinaw na tumutukoy sa lahat ng mga utos na kababanggit lamang.
- source_word: ἐφύλαξα
  choice: Tinupad ko
  rationale: Sa konteksto ng mga utos, ang φυλάσσω ay nangangahulugang sundin, tuparin, o ingatan; natural at malinaw sa Filipino ang “tinupad.”
- source_word: τί ἔτι ὑστερῶ
  choice: Ano pa ang kulang sa akin?
  rationale: Natural na tanong sa Filipino na pinananatili ang diwa ng natitirang kakulangan o pagkukulang.
theological_decisions:
- issue: Pagtatasa ng binata sa sarili niyang pagsunod
  choice: Inilahad nang tuwiran ang pahayag niyang natupad niya ang lahat ng mga utos, nang hindi ito pinagtitibay o minamarkahang mapanlibak.
  alternative: Ipahiwatig na taos ngunit mali ang kanyang palagay, o na eksaherado ang kanyang sinabi.
  rationale: Tuwiran lamang inilalahad ng Griyego ang kanyang pag-aangkin; dapat panatilihin ng salin ang teolohikal na tensiyon at hayaang ang konteksto ang humatol dito.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “binata” para sa νεανίσκος at iniwasan ang pagdaragdag ng impormasyong wala sa mismong talata. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
source_grounding:
  english_pob_role: consult_only
