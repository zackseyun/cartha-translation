  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: tl
  text: 'Muli kong sinasabi sa inyo: Mas madali para sa isang kamelyo[b] na makadaan sa butas ng karayom[a] kaysa para sa isang mayamang tao na makapasok sa kaharian ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mata ng karayom.”
    reason: lexical_alternative
  - marker: b
    text: May ilan na nagmungkahi ng “lubid” sa halip na “kamelyo,” ngunit “kamelyo” ang mababasa sa tekstong Griyego rito.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Muli kong sinasabi sa inyo
  rationale: Ipinahahayag ng πάλιν ang pag-uulit, samantalang banayad lamang ang pag-uugnay ng δέ at hindi kailangang isalin nang hiwalay. Likas at tuwiran sa modernong Tagalog ang pariralang ito.
- source_word: εὐκοπώτερόν ἐστιν
  choice: Mas madali pang
  rationale: Malinaw nitong ipinapahayag ang pahambing na diwa at pinalalakas ng “pang” ang likas na paghahambing sa Tagalog nang hindi binabago ang kahulugan.
- source_word: κάμηλον
  choice: isang kamelyo
  rationale: Ang salitang Griyego ay nangangahulugang “kamelyo,” hindi “lubid,” at pinananatili nito ang matinding larawan ng paghahambing.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: sa butas ng karayom
  rationale: Tumutukoy ito sa mismong siwang o mata ng karayom. Ang “butas ng karayom” ay malinaw at karaniwang pananalita sa Tagalog.
- source_word: εἰσελθεῖν
  choice: makadaan / makapasok
  rationale: Iisang pandiwang Griyego ang ginamit sa dalawang bahagi. Isinalin itong “makadaan” kaugnay ng pagdaan sa butas at “makapasok” kaugnay ng kaharian upang maging likas ang dalawang larawan sa Tagalog.
- source_word: ἢ πλούσιον
  choice: kaysa ... isang taong mayaman
  rationale: Substantibal ang πλούσιον at tumutukoy sa isang mayamang tao. Walang kasariang gramatikal ang katumbas sa Tagalog, kaya tumpak at natural ang “isang taong mayaman.”
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Pinananatili nito ang mahalagang pariralang “kaharian ng Diyos,” habang ang pandiwang “makapasok” ay likas nang naghahayag ng pagpasok tungo rito.
theological_decisions:
- issue: Kahulugan ng larawan ng kamelyo at butas ng karayom
  choice: Pinanatili ang tuwirang kamelyo-at-karayom na larawan bilang matinding paghahambing.
  alternative: Ipaliwanag ito bilang diumano’y maliit na tarangkahang tinatawag na “Butas ng Karayom,” o palitan ang “kamelyo” ng “lubid.”
  rationale: Tuwirang “kamelyo” at butas ng karayom ang nasa tekstong Griyego. Walang batayang tekstuwal dito upang gawing pangalan ng isang tarangkahan ang larawan o pahinain ang matinding paghahambing.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mas madali pang” at magkaibang likas na katumbas ng εἰσελθεῖν upang mapanatili ang paghahambing at maging maayos ang daloy.
