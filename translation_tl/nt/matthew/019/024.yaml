  terminology: Ang “kamelyo,” “butas ng karayom,” at “kaharian ng Diyos” ay wasto at angkop sa modernong Filipino Tagalog. Ang “mayamang tao” ay natural na katumbas ng substantibal na πλούσιον nang hindi nagdaragdag ng kasariang wala sa Tagalog.
