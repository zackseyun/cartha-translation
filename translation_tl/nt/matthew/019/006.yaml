id: MAT.19.6
reference: Matthew 19:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: tl
  text: Kaya hindi na sila dalawa kundi iisang laman. Kaya nga, ang pinagsama ng Diyos ay huwag paghiwalayin ng tao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “tao” rito ay may pangkalahatang diwa: walang sinumang tao ang dapat maghiwalay sa pinagsama ng Diyos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga ng naunang pahayag tungkol sa dalawa na nagiging iisang laman; natural at malinaw ang “Kaya” sa modernong Tagalog.
- source_word: οὐκέτι εἰσὶν δύο
  choice: hindi na sila dalawa
  rationale: Malinaw na ipinapakita ng “hindi na” ang pagbabagong kalagayan, at likas sa Tagalog ang paglalagay ng ipinahihiwatig na panghalip na “sila.”
- source_word: ἀλλὰ σὰρξ μία
  choice: kundi iisang laman
  rationale: Pinananatili ng “iisang laman” ang mahalagang pananalita mula sa Genesis at ang pagkakaiba ng “dalawa” at “isa,” sa halip na paliitin ito sa “iisang katawan.”
- source_word: ὃ οὖν
  choice: Kaya nga, ang
  rationale: Ang “Kaya nga” ay nagpapanatili sa pangangatwirang ipinahahayag ng οὖν, habang ang “ang pinagsama” ay likas na paraan sa Tagalog upang katawanin ang neuter relative pronoun na ὃ.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Tuwirang katumbas at karaniwang anyo sa Tagalog.
- source_word: συνέζευξεν
  choice: pinagsama
  rationale: Natural itong paglalarawan sa ginawa ng Diyos sa pagsasama ng mag-asawa; naipahihiwatig ng anyong naganap na ang pagkilos ay natapos at nananatili ang bunga nito.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Ang “tao” ay likas na pangkalahatang katawagan sa Tagalog at sumasaklaw sa sinumang tao, ayon sa generic na diwa ng salitang Griyego.
- source_word: μὴ χωριζέτω
  choice: huwag paghiwalayin
  rationale: Malinaw at natural na ipinahahayag nito ang ipinagbabawal ng present imperative na may μή, nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Pangkalahatang saklaw ng ἄνθρωπος sa pagbabawal tungkol sa pag-aasawa
  choice: Isinalin bilang “tao,” na may pangkalahatang diwa
  alternative: sinuman; sinumang tao
  rationale: Sa Tagalog, ang “tao” ay hindi kailangang tumukoy lamang sa lalaki at likas na sumasaklaw sa sinumang tao. Nililinaw ito sa talababa upang mapanatili ang payak na ayos ng pangunahing teksto.
- issue: Pananalita tungkol sa pagsasama sa pag-aasawa na umaalingawngaw sa Genesis
  choice: Pinanatili bilang “iisang laman”
  alternative: iisang katawan
  rationale: Pinananatili ng “iisang laman” ang pagkakaugnay sa Genesis at ang teolohikal na bigat ng parirala nang hindi ito binibigyan ng dagdag na paliwanag o doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kaya” at “Kaya nga” upang maipakita ang magkaugnay ngunit magkahiwalay na inferensiya ng ὥστε at οὖν. Inilagay ang talababa pagkatapos ng “tao,” ang salitang aktuwal nitong nililinaw.
