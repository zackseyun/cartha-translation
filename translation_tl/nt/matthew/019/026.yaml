  source_fidelity: 'Tapat ang salin sa Griyego: naipahayag ang pagtingin ni Jesus sa kausap na grupo, ang kaibhan ng imposible sa larangan ng tao at posible sa Diyos, at ang malawak na saklaw ng πάντα (“ang lahat”). Ang di-pag-uulit ng “sa kanila” pagkatapos ng “tiningnan sila” ay natural na pagpapahiwatig sa Filipino at hindi nagpapabago ng tinutukoy ng αὐτοῖς.'
  naturalness: Natural at malinaw ang modernong Filipino. Ang “Imposible ito sa tao, ngunit sa Diyos ay posible ang lahat” ay maigsi, marangal, at napapanatili ang balanseng retorikal ng kasabihan. Katanggap-tanggap na generic ang isahang “tao” sa ganitong pormulasyon.
