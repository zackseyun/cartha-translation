id: MAT.19.26
reference: Matthew 19:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: tl
  text: Ngunit tiningnan sila ni Jesus at sinabi, “Imposible ito sa tao, ngunit sa Diyos ay posible ang lahat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: tiningnan sila
  rationale: Ipinahahayag nito ang sadyang pagbaling ng tingin ni Jesus sa mga alagad nang hindi pinalalabis ang diin na maaaring ipahiwatig ng “tinitigan.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ang δέ ay nagpapakita rito ng banayad na pagsalungat sa naunang pangamba ng mga alagad at sa kasunod na paghahambing ng kakayahan ng tao at ng Diyos.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi
  rationale: Likas sa Filipino na hindi na ulitin ang “sa kanila” sapagkat malinaw na ang “sila” ang kausap matapos sabihing tiningnan sila ni Jesus; nananatili ang kahulugan nang walang mabigat na pag-uulit.
- source_word: παρὰ ἀνθρώποις
  choice: sa tao
  rationale: Ang ἄνθρωποις ay tumutukoy sa sangkatauhan sa pangkalahatan. Ang “sa tao” ay likas, maikli, at malinaw na pangkalahatan sa Filipino, hindi lamang tumutukoy sa mga lalaki.
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa bagay na pinag-uusapan sa naunang konteksto; sapat at natural ang “ito.”
- source_word: ἀδύνατόν ἐστιν
  choice: Imposible
  rationale: Direkta at karaniwang modernong Filipino ang “imposible” para sa predikatibong ἀδύνατον ἐστιν.
- source_word: παρὰ δὲ θεῷ
  choice: ngunit sa Diyos
  rationale: Pinananatili ng “sa Diyos” ang balanseng retorikal sa “sa tao,” habang ang “ngunit” ay malinaw na naghahayag ng pagsalungat.
- source_word: πάντα δυνατά
  choice: posible ang lahat
  rationale: Pinananatili nito ang saklaw ng πάντα at ang maikli, mariing anyo ng pangungusap sa natural na Filipino.
theological_decisions:
- issue: Pangkalahatang kahulugan ng ἀνθρώποις
  choice: sa tao
  alternative: sa mga tao / para sa tao
  rationale: Bagaman pangmaramihan ang anyong Griyego, generic ang kahulugan nito. Sa Filipino, likas na ginagamit ang isahang “tao” upang tukuyin ang sangkatauhan o kakayahan ng tao sa pangkalahatan, nang walang implikasyong lalaki lamang.
- issue: Saklaw ng πάντα δυνατά
  choice: posible ang lahat
  alternative: magagawa ng Diyos ang lahat
  rationale: Hindi idinaragdag ang tahasang pandiwang “magagawa” o ang Diyos bilang gramatikal na simuno, sapagkat predikatibong pang-uri ang δυνατά at may tunay na lapad ang pahayag. Pinananatili ng salin ang pormulasyon at tensiyong nasa Griyego nang hindi ito ginagawang abstraktong doktrina ng omnipotensiya na hiwalay sa konteksto.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang karaniwang salitang “imposible” at ang simetrikong “sa tao … sa Diyos” upang mapanatili ang maikli at di-malilimutang anyo ng sinabi ni Jesus. Walang talababa dahil walang kinakailangang leksikal na alternatibo na hindi naipahahayag nang malinaw sa pangunahing teksto.
