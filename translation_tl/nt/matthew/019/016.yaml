  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: tl
  text: At masdan, may isang lumapit sa kanya at nagsabi, “Guro, anong mabuting bagay[a] ang dapat kong gawin upang magkaroon ako ng buhay na walang hanggan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Anong mabuting gawa ang dapat kong gawin…?” Ang Griyegong τί ἀγαθὸν ay maaaring tumukoy sa isang “mabuting bagay” o, dahil kasama ang pandiwang “gawin,” sa isang “mabuting gawa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: At masdan
  rationale: Pinananatili ang pang-ugnay na καί at ang pantawag-pansing lakas ng ἰδού sa isang marangal ngunit nauunawaang anyo.
- source_word: εἷς
  choice: may isang
  rationale: Hindi muna tinutukoy kung lalaki o mayaman ang lumapit, ayon sa payak na εἷς ng talatang ito.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: lumapit sa kanya at nagsabi
  rationale: Natural sa makabagong Tagalog at malinaw na nauna ang paglapit bago ang pagsasalita, bagaman ginawang magkasunod na pandiwa ang Griyegong participle at pangunahing pandiwa.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ng titulong nangangahulugang tagapagturo.
- source_word: τί ἀγαθὸν
  choice: anong mabuting bagay
  rationale: Pinananatili ang bukas na anyo ng neuter singular na ἀγαθόν; maaari rin itong tumukoy sa isang mabuting gawa dahil sa kasunod na ποιήσω.
- source_word: ποιήσω
  choice: ang dapat kong gawin
  rationale: Ipinahahayag nang natural ang praktikal at deliberatibong lakas ng aorist subjunctive nang hindi dinaragdagan ang teolohikal na kahulugan.
- source_word: ἵνα σχῶ
  choice: upang magkaroon ako
  rationale: Pinananatili ang layuning ipinahahayag ng ἵνα at ang tuwirang kahulugan ng ἔχω, ‘magkaroon.’
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Likas, malinaw, at nakaugaliang salin ng parirala sa kontekstong ito.
theological_decisions:
- issue: Pagkakakilanlan ng lumapit
  choice: may isang
  alternative: may isang lalaki; isang mayamang binata
  rationale: Hindi ipinapasok sa talatang ito ang mga detalyeng lumilitaw lamang sa kasunod na konteksto o sa mga kaparehong salaysay.
- issue: Ugnayan ng paggawa at buhay na walang hanggan sa tanong
  choice: anong mabuting bagay ang dapat kong gawin upang magkaroon ako ng buhay na walang hanggan?
  alternative: anong mabuting gawa ang gagawin ko para makamit ang buhay na walang hanggan?
  rationale: Pinananatili ang tanong na nakatuon sa pagkilos at ang layuning magkaroon ng buhay na walang hanggan, nang hindi ipinapasiya rito ang usapin ng gawa, merito, o kaligtasan.
translation_notes:
  register: Makabago at dignidad na Tagalog. Ginamit ang “masdan” upang mapanatili ang pantawag-pansing ἰδού; bahagya itong mataas ang rehistro ngunit malinaw pa rin. Ang hulaping-talâ [a] ay inilagay matapos ang buong tanong dahil nililinaw nito ang pariralang nasa loob nito.
