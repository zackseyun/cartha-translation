id: MAT.19.21
reference: Matthew 19:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: tl
  text: Sinabi ni Jesus sa kanya, “Kung nais mong maging ganap[a], humayo ka, ipagbili mo ang iyong mga ari-arian at ibigay mo sa mga mahihirap. Magkakaroon ka ng kayamanan sa langit. Pagkatapos, halika at sumunod ka sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “perpekto,” “lubos,” o “husto.”
    reason: Pinananatili ang saklaw ng kahulugan ng τέλειος, na maaaring tumukoy sa pagiging perpekto, buo, o ganap na umunlad.
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Karaniwang pandiwa sa pagsasalaysay ng tuwirang pananalita; hindi nito dinaragdagan ang paraan o himig ng pagsasalita.
- source_word: τέλειος
  choice: ganap
  rationale: Naipahahayag ng “ganap” ang pagiging buo o walang kulang sa hinihinging pagsunod, habang pinananatili ang posibleng diwang “perpekto” nang hindi ito tahasang nilulutas.
- source_word: ὕπαγε
  choice: humayo ka
  rationale: Tuwirang utos na umalis at gawin ang kasunod na ipinag-uutos; marangal at malinaw sa konteksto.
- source_word: πώλησόν
  choice: ipagbili mo
  rationale: Tuwirang katumbas ng utos na ipagbili ang pag-aari.
- source_word: τὰ ὑπάρχοντα
  choice: ang iyong mga ari-arian
  rationale: Tumutukoy sa mga pag-aaring materyal ng lalaki, hindi lamang sa maliliit na personal na gamit.
- source_word: δὸς πτωχοῖς
  choice: ibigay mo sa mga mahihirap
  rationale: Likas na modernong Tagalog para sa pagbibigay ng ari-arian o napagbentahan sa mga taong dukha.
- source_word: ἕξεις
  choice: Magkakaroon ka
  rationale: Payak at natural na salin ng panghinaharap na anyo ng ἔχω.
- source_word: θησαυρὸν ἐν οὐρανοῖς
  choice: kayamanan sa langit
  rationale: Bagaman maramihan ang οὐρανοῖς sa Griyego, karaniwang isahan ang “langit” sa natural na Tagalog para sa ganitong pahayag.
- source_word: δεῦρο
  choice: Pagkatapos, halika
  rationale: Pinananatili ang paanyayang lumapit at malinaw na ipinakikita ang pagkakasunod nito sa naunang mga utos.
- source_word: ἀκολούθει μοι
  choice: sumunod ka sa akin
  rationale: Karaniwan at tumpak na pananalita para sa panawagan ni Jesus sa pagiging alagad.
theological_decisions:
- issue: Kahulugan ng τέλειος kaugnay ng pagsunod bilang alagad
  choice: ganap
  alternative: perpekto; lubos; husto
  rationale: Ang “ganap” ay maaaring tumukoy sa pagiging buo o walang kulang sa debosyon at pagsunod. Hindi nito awtomatikong ipinapalagay ang doktrina ng kawalan ng kasalanan, ngunit pinananatili nito ang matinding hinihingi ng pahayag at ang tunay na lawak ng kahulugan ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “humayo” bilang bahagyang pormal ngunit malinaw na utos, at “mga mahihirap” sa halip na mas makalumang “mga dukha.”
