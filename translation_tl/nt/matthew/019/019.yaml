  text: Igalang mo ang iyong ama at ina, at mahalin mo ang iyong kapwa gaya ng iyong sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, sa mas pormal na salin: “Igalang mo ang iyong ama at ina, at mamahalin mo ang iyong kapwa gaya ng iyong sarili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Igalang mo
  rationale: Tuwirang pautos ito na tumutukoy sa pagbibigay ng nararapat na dangal, hindi lamang sa panloob na paggalang. Pinananatili rin nito ang bigat ng pananalita sa utos.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ang iyong ama at ina
  rationale: Bagaman mga pantukoy ang nasa Griyego at walang tahasang panghalip na paari, likas sa Tagalog at naaayon sa pormula ng Sampung Utos ang “iyong ama at ina.” Hindi na kailangang ulitin ang “iyong” bago ang “ina.”
- source_word: Ἀγαπήσεις
  choice: ibigin mo
  rationale: Ang anyong panghinaharap ay ginagamit sa pagsipi ng utos mula sa Torah. Isinalin itong tuwirang pautos upang maging natural sa kasalukuyang Tagalog at tumugma sa naunang “Igalang mo,” habang pinananatili sa talababa ang mas pormal na anyo.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Sa kontekstong etikal, ang πλησίον ay tumutukoy sa kapwa-tao o taong kaugnay ng isang tao, hindi lamang sa pisikal na kapitbahay. “Kapwa” ang mas tumpak at likas na salin sa Tagalog.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Pinananatili nito ang maikli at tuwirang paghahambing sa Griyego nang hindi idinaragdag ang pandiwang hindi tahasang inuulit sa parirala.
theological_decisions:
- issue: Anyo ng mga utos sa sipi mula sa Kautusan
  choice: 'Kapuwa isinalin bilang tuwirang pautos: “Igalang mo … at ibigin mo …”'
  alternative: “Igalang mo ang iyong ama at ina, at iibigin mo ang iyong kapwa gaya ng iyong sarili.”
  rationale: Pinagsasama ng Griyego ang pautos na Τίμα at panghinaharap na Ἀγαπήσεις dahil sinisipi ang pananalita ng Kautusan. Ang dalawang tuwirang pautos ay mas natural sa modernong Tagalog at malinaw na pinananatili ang puwersa ng mga utos; inilalahad sa talababa ang mas pormal na pagtutumbas sa ikalawang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “ibigin” sa halip na “mahalin” upang mapanatili ang dignidad at pamilyar na himig ng utos, nang hindi nagiging lipas o labis na pormal.
