id: MAT.19.30
reference: Matthew 19:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: tl
  text: Ngunit marami sa mga nauuna ang magiging huli[a], at ang mga huli ay magiging una.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Ngunit maraming una ang magiging huli, at mga huli ay una.” Kapansin-pansing maikli at parang kasabihan ang Griyego.'
    reason: Ipinakikita ang mas tahasang ayos at maigsi, matalinghagang anyo ng orihinal.
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Ginagamit ang pang-uri bilang pangngalan at tumutukoy sa isang malawak ngunit hindi tinukoy na pangkat. Likas at maikli sa Filipino ang “marami.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat o paglipat mula sa naunang usapan tungkol sa gantimpala at katayuan; malinaw itong naipapahayag ng “Ngunit.”
- source_word: ἔσονται
  choice: magiging
  rationale: Ang anyong panghinaharap ng εἰμί ay likas na isinasalin sa Filipino bilang “magiging.”
- source_word: πρῶτοι
  choice: mga nauuna / una
  rationale: Tumutukoy ito sa posisyon o ranggo, hindi lamang sa pagkakasunod sa panahon. Pinananatili ng “nauuna” at “una” ang malawak at matalinghagang diwa.
- source_word: ἔσχατοι
  choice: mga huli / huli
  rationale: Tuwirang katapat ito ng πρῶτοι at tumutukoy sa huling posisyon o katayuan. Iniwasan ang “mahuhuli,” na maaari ring mangahulugang darating nang huli o madadakip.
- source_word: πολλοὶ … πρῶτοι ἔσχατοι
  choice: marami sa mga nauuna ang magiging huli
  rationale: Nililinaw ng pariralang Filipino ang ipinahihiwatig na pagtukoy sa maraming kabilang sa mga nauuna, nang hindi tinutukoy kung anong uri ng katayuan ang pinag-uusapan.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: at ang mga huli ay magiging una
  rationale: Inuulit ang ipinahihiwatig na pandiwa upang maging natural at malinaw sa modernong Filipino, habang pinananatili ang balanseng pagsalungat ng “huli” at “una.”
theological_decisions:
- issue: Saklaw ng pagbabaligtad ng kalagayan
  choice: Pinanatili itong pangkalahatang pahayag tungkol sa pagbabaligtad ng posisyon o katayuan.
  alternative: Tukuyin ito bilang partikular na pahayag tungkol sa kaligtasan, gantimpala ng mga alagad, pagpasok sa kaharian, o katayuan sa lipunan.
  rationale: Hindi tahasang nililimitahan ng mismong talata ang saklaw ng kasabihan. Kaya hindi nagdagdag ang salin ng isang tiyak na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang buo at likas na estruktura sa pangunahing teksto; inilagay sa talababa ang higit na literal ngunit di-gaanong natural na kaiklian ng Griyego.
