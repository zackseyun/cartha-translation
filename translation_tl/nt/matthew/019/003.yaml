  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: tl
  text: Lumapit kay Jesus ang mga Pariseo upang subukin siya at nagtanong, “Ipinahihintulot ba sa isang lalaki na diborsiyuhin ang kanyang asawa sa anumang dahilan?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa alinmang batayan” o “para sa bawat dahilan.” Ang pariralang Griyego ay tumutukoy sa malawak na legal na tanong tungkol sa mga pinahihintulutang batayan ng diborsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: Lumapit kay Jesus
  rationale: Ang προσέρχομαι ay nangangahulugang lumapit o pumunta sa isang tao. Ginamit ang pangalang “Jesus” sa halip na panghalip upang maging malinaw at natural sa Filipino nang hindi binabago ang tinutukoy.
- source_word: πειράζοντες αὐτόν
  choice: upang subukin siya
  rationale: Maaaring mangahulugan ang πειράζω ng sumubok, tumukso, o maglagay sa pagsubok. Pinananatili ng “subukin” ang lawak ng salita at hinahayaang ang konteksto ang magpahiwatig ng masamang layunin, sa halip na tahasang idagdag ang “bitagin.”
- source_word: λέγοντες
  choice: Tinanong nila
  rationale: Bagaman literal na “nagsasabi,” ang kasunod ay isang tuwirang tanong. Ang “Tinanong nila” ang natural na anyo sa Filipino at tapat sa gamit nito sa pangungusap.
- source_word: ἔξεστιν
  choice: Naaayon ba sa Kautusan
  rationale: Sa konteksto ng legal at panrelihiyong pagtatalo, itinatanong ng ἔξεστιν kung ano ang pinahihintulutan ng Kautusan. Malinaw at likas sa Filipino ang pariralang ito.
- source_word: ἀνθρώπῳ
  choice: ng isang lalaki
  rationale: Bagaman maaaring pangkalahatan ang ἄνθρωπος, nililinaw ng pariralang “kanyang asawa” na ang tinutukoy rito ay isang lalaking asawa. Pinananatili ng salin ang kongkretong kasarian sa konteksto.
- source_word: ἀπολῦσαι
  choice: hiwalayan
  rationale: Ang ἀπολύω ay literal na magpaalis o magpalaya, ngunit sa usaping pag-aasawa ito ang idyomatikong salita para sa pagdidiborsiyo. Ang “hiwalayan” ay natural at malinaw sa ordinaryong Filipino sa kontekstong ito.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ang kanyang asawa
  rationale: Ang γυνή ay maaaring “babae” o “asawang babae”; dahil sa panghalip na paari at sa konteksto ng diborsiyo, “asawa” ang hinihinging kahulugan.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: sa anumang dahilan
  rationale: Saklaw ng parirala ang malawak na tanong kung maaaring makipaghiwalay batay sa alinmang idinadahilan. Ang “sa anumang dahilan” ay maikli, natural, at hindi nagpapasya sa pinagtatalunang pamantayan.
theological_decisions:
- issue: Paglalahad sa legal na tanong tungkol sa mga pinahihintulutang dahilan ng pakikipaghiwalay nang hindi ipinapasok ang isang denominasyonal na paninindigan
  choice: Naaayon ba sa Kautusan na hiwalayan ng isang lalaki ang kanyang asawa sa anumang dahilan?
  alternative: Ipinahihintulot ba sa isang lalaki na hiwalayan ang kanyang asawa sa alinmang batayan?
  rationale: Inilalahad lamang ng talata ang hamong legal na ibinato kay Jesus at hindi pa ang sagot niya. Pinananatili ng salin ang lawak at tensiyon ng tanong nang hindi nililimitahan ito ayon sa isang doktrina tungkol sa diborsiyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mga participle ng Griyego upang maging natural basahin, habang pinananatili ang pagkakasunod ng paglapit, pagsubok, at pagtatanong. Ginamit ang “Kautusan” para sa legal-panrelihiyong diwa ng ἔξεστιν sa kontekstong ito.
