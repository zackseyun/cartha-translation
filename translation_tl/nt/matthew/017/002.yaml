base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: tl
  text: At nagbago ang anyo niya sa harap nila[a], at nagliwanag na gaya ng araw ang kanyang mukha, at ang kanyang mga damit ay pumuting gaya ng liwanag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nabago ang kanyang anyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: nagbagong-anyo
  rationale: Tuwirang ipinapahayag ang nakikitang pagbabago ng anyo nang hindi dinaragdagan ang teksto ng paliwanag tungkol sa likas na katangian ng pagbabagong ito.
- source_word: ἔμπροσθεν αὐτῶν
  choice: sa harap nila
  rationale: Natural at malinaw na katumbas ng pariralang nagsasaad na nangyari ito sa kanilang harapan.
- source_word: ἔλαμψεν
  choice: nagliwanag
  rationale: Karaniwang salitang Filipino para sa pagningning o pagbibigay-liwanag, at angkop sa paghahambing sa araw.
- source_word: πρόσωπον
  choice: mukha
  rationale: Tumutukoy rito sa pisikal na mukha ni Jesus at ito ang pinakakaraniwang katumbas sa Filipino.
- source_word: ὡς ὁ ἥλιος
  choice: gaya ng araw
  rationale: Pinananatili ang tahasang paghahambing na ipinakikilala ng ὡς.
- source_word: ἱμάτια
  choice: mga damit
  rationale: Natural at madaling maunawaang pangkalahatang katawagan sa kasuotan.
- source_word: ἐγένετο λευκὰ
  choice: pumuting
  rationale: Maikli at natural na pagpapahayag sa Filipino ng pagbabago ng kalagayan tungo sa pagiging puti.
- source_word: ὡς τὸ φῶς
  choice: gaya ng liwanag
  rationale: Pinananatili ang larawan at paghahambing sa liwanag sa halip na gawing simpleng pang-uring 'maningning.'
theological_decisions:
- issue: Paglalarawan sa pangyayaring karaniwang tinatawag na transfiguration
  choice: nagbagong-anyo
  alternative: nabago
  rationale: Ang 'nagbagong-anyo' ay malinaw na tumutukoy sa nakikitang pagbabago ng anyo sa konteksto, samantalang ang 'nabago' ay masyadong malawak. Hindi nito tinutukoy o nilulutas ang higit pang tanong tungkol sa likas na katangian ng pagbabago.
translation_notes:
  register: Makabagong, dignificado, at madaling maunawaang Filipino. Ginamit ang 'nagbagong-anyo' sa halip na ang teknikal na hiram na 'transpigura,' at hinati sa dalawang pangungusap upang maging natural ang daloy habang pinananatili ang pagkakasunod-sunod ng mga sugnay.
