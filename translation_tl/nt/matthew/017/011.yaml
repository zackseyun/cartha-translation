  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: tl
  text: Sumagot siya, “Tunay ngang darating si Elias at ipapanumbalik niya ang lahat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Ang participle at finite verb ay karaniwang pormulang Griyego na may impluwensiyang Semitiko. Sapat at likas sa modernong Tagalog ang “Sumagot siya,” habang napapanatili ang diwang tugon.
- source_word: Ἠλίας
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: μέν
  choice: Talagang
  rationale: Nagbibigay ang μέν ng diin at naghahanda sa kasunod na paghahambing o pagtutol sa susunod na talata. Ang “talagang” ay likas na Tagalog na nagpapanatili sa diin nang hindi mabigat.
- source_word: ἔρχεται
  choice: darating
  rationale: Bagaman nasa present tense ang anyong Griyego, malinaw na nakatuon ito sa hinaharap sa konteksto. Natural na ipinahahayag ito sa Tagalog sa pamamagitan ng aspektong kontemplatibo.
- source_word: ἀποκαταστήσει
  choice: ibabalik sa ayos
  rationale: Ipinahahayag ng pandiwa ang pagpapanumbalik o muling pagsasaayos. Ang “ibabalik sa ayos” ay malinaw at natural, nang hindi tinutukoy kung ano mismo ang anyo ng pagpapanumbalik.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Malawak at komprehensibo ang neuter plural. Pinananatili ng “ang lahat ng bagay” ang saklaw nang hindi nagdaragdag ng bagay na hindi tinukoy sa teksto.
theological_decisions:
- issue: Kalikasan at saklaw ng pagpapanumbalik na gagawin ni Elias
  choice: ibabalik sa ayos ang lahat ng bagay
  alternative: panunumbalikin ang lahat; itutuwid ang lahat ng bagay
  rationale: Hindi nililinaw ng talata kung espirituwal, panlipunan, o eskatolohikal ang saklaw. Pinananatili ng salin ang malawak na pahayag at ang teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniwasan ang sobrang literal na “sumagot at sinabi” at ang mas teknikal o hindi gaanong pangkaraniwang “panunumbalikin.”
