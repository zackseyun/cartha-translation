    rationale: Ang μέν ay nagbibigay-diin at naghahanda sa kasunod na pagtutuwid sa v. 12. Mas mahinahon ngunit malinaw ang “Tunay nga.”
  revised_text: Sumagot siya, “Tunay ngang darating si Elias at ipapanumbalik niya ang lahat.”
