  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: tugon ni Jesus, ang pagdating ni Elias, at ang malawak na saklaw ng gagawing pagpapanumbalik. Gayunman, ang “ibabalik sa ayos” ay bahagyang nagpapaliit at nagbibigay-kahulugan sa ἀποκαταστήσει bilang pagsasaayos ng kaayusan. Mas tuwirang naipapahayag ng “ipapanumbalik” ang malawak at hindi tinukoy na ‘restore.’'
  naturalness: Likas ang “Sumagot siya” at ang karaniwang Tagalog na pangalang “Elias.” Ang “Tunay ngang” ay marangal ngunit natural na paraan upang ipakita ang diin at ang anticipatoryong μέν, nang hindi kasing-kolokyal ng “Talagang.”
  terminology: Ang “ipapanumbalik” ay angkop na katumbas ng ἀποκαταστήσει at hindi nagpapasya kung ang pagpapanumbalik ay espirituwal, panlipunan, o eskatolohikal. Ang “lahat” ay sapat na malawak para sa πάντα at mas natural kaysa “lahat ng bagay” sa pangungusap na ito.
