  source_fidelity: Tumpak na naihahayag ng salin ang temporal na aorist participle (ἀκούσαντες), ang paksa na οἱ μαθηταί, ang pagbagsak nang nakaharap sa lupa (ἔπεσαν ἐπὶ πρόσωπον αὐτῶν), at ang matinding takot na pinalalakas ng σφόδρα. Ang “ito” ay katanggap-tanggap na kontekstuwal na pantukoy sa narinig nilang tinig at hindi lumalampas sa ipinahihiwatig ng teksto.
