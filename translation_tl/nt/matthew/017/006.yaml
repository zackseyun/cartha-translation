id: MAT.17.6
reference: Matthew 17:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: tl
  text: Nang marinig ito ng mga alagad,[a] nagpatirapa sila[b] at labis na natakot.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Pagkarinig nila nito”; ang Griyego ay gumagamit ng aorist participle na maaaring isalin bilang “nang marinig” o “pagkarinig.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bumagsak sila sa kanilang mukha”; ang “nagpatirapa” ay likas na pagpapahayag sa Tagalog ng gayong posisyon ng katawan.
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, napakatindi ng kanilang takot; isinasalin ng “labis” ang pang-abay na σφόδρα.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig ito
  rationale: Ang aorist participle ay likas na ipinapahayag sa Tagalog bilang sugnay na panahunan. Ang “ito” ay tumutukoy sa tinig na narinig sa naunang talata, nang hindi labis na nagpapaliwanag.
- source_word: οἱ μαθηταὶ
  choice: mga alagad
  rationale: Karaniwan at malinaw na salin ng μαθηταί sa konteksto ng mga Ebanghelyo, at dito ay tumutukoy sa mga alagad ni Jesus.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: nagpatirapa sila
  rationale: Likas na idyomang Tagalog para sa pagbagsak na nakadapa ang mukha. Inihahayag nito ang pisikal na ayos ng katawan nang hindi ipinagpapalagay kung ito ay pagsamba o bunga lamang ng takot.
- source_word: ἐφοβήθησαν
  choice: natakot
  rationale: Natural na modernong Tagalog para sa aorist na anyo ng φοβέομαι at malinaw na naghahatid ng kanilang reaksiyon.
- source_word: σφόδρα
  choice: labis
  rationale: Direkta at marangal na panuring na nagpapakita ng matinding antas ng takot.
theological_decisions:
- issue: Kalikasan ng tugon ng mga alagad sa tinig mula sa langit
  choice: Inilalarawan ang kanilang pagpapatirapa at matinding takot nang hindi tinutukoy kung ito ay pagsamba, sindak, o mapitagang pagkatakot.
  alternative: Maaaring ipakahulugan ang kilos bilang pangunahing pagpapakita ng pagsamba o, sa kabilang banda, bilang matinding sindak sa harap ng pagpapakita ng Diyos.
  rationale: Iniuulat ng Griyego ang kanilang posisyon at takot ngunit hindi tahasang binibigyan ng tiyak na teolohikal na kahulugan ang reaksiyon. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “nagpatirapa” upang maipahayag nang maikli ang pisikal na kilos, ngunit iniwasang tawagin itong tahasang pagsamba upang mapanatili ang ambiguwidad ng teksto.
