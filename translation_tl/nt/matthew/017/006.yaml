  terminology: Ang “mga alagad” ay angkop na karaniwang salin ng μαθηταί sa mga Ebanghelyo. Hindi pinipilit ng “nagpatirapa” ang isang teolohikal na pagbasa bilang pagsamba; nananatili ang tekstuwal na pag-igting sa pagitan ng pagpapatirapa at takot. Ang mga talababa ay tapat sa mga alternatibo at sa gamit ng σφόδρα.
