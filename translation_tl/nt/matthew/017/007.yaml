  source_fidelity: 'Tumpak na naihahatid ng draft ang sunod-sunod na kilos sa Griyego—lumapit si Jesus, hinipo ang mga alagad, at nagsalita siya—at ang dalawang utos na plural: bumangon at huwag matakot. Walang idinagdag na teolohikal na kahulugan o sobrang pagtutukoy sa paraan ng paghipo.'
