  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: tl
  text: Lumapit si Jesus at hinipo niya sila. Sinabi niya, “Bumangon kayo at huwag kayong matakot.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: Lumapit
  rationale: Karaniwang ipinahihiwatig ng προσέρχομαι ang paglapit sa isang tao. Natural at tuwiran sa modernong Tagalog ang “lumapit.”
- source_word: ἁψάμενος αὐτῶν
  choice: hinipo sila
  rationale: Ang ἅπτω na may genitive ay nangangahulugang humipo. Pinananatili ng “hinipo sila” ang kilos nang hindi nagdaragdag na kamay ang ginamit.
- source_word: εἶπεν
  choice: sinabi
  rationale: Ang “sinabi” ang pinakatuwiran at hindi mapagpakahulugang katumbas ng εἶπεν sa kontekstong ito.
- source_word: Ἐγέρθητε
  choice: Bumangon kayo
  rationale: Sa konteksto, nakasubsob ang mga alagad kaya ang utos ay bumangon sila. Natural sa Tagalog ang “Bumangon kayo” at hindi nito labis na tinutukoy ang huling posisyon ng katawan.
- source_word: μὴ φοβεῖσθε
  choice: huwag kayong matakot
  rationale: Likas at malinaw itong salin ng pagbabawal na matakot. Hindi ipinipilit ang posibleng kahulugang “tumigil na kayong matakot,” na hindi tiyak na hinihingi ng aspektong Griyego rito.
- source_word: καὶ
  choice: at
  rationale: Ang “at” ay payak na nagpapanatili sa sunod-sunod na pagkakaugnay ng mga kilos nang hindi nagdaragdag ng temporal na diin.
theological_decisions:
- issue: Paglalahad sa nakaaaliw na utos ni Jesus nang walang idinagdag na pastoral o doktrinal na paliwanag
  choice: Bumangon kayo at huwag kayong matakot
  alternative: Bumangon kayo at huwag kayong mangamba
  rationale: Tuwirang pinananatili ng salin ang pisikal na utos at katiyakang ibinigay ni Jesus, nang walang pagpapalawak sa teolohikal na kahulugan nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “hinipo” sa halip na mas kolokyal na “humawak,” at “matakot” bilang pinakakaraniwang katumbas ng φοβεῖσθε.
