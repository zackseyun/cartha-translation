  terminology: Ang “lumapit,” “hinipo,” “bumangon kayo,” at “huwag kayong matakot” ay angkop, malinaw, at nasa marangal ngunit modernong rehistro. Ang “Jesus” ay katanggap-tanggap na modernong Filipino anyo ng pangalan.
