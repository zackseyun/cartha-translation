  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: tl
  text: at nagsabi, “Panginoon, maawa po kayo sa anak kong lalaki. Nagkakaroon siya[a] ng mga pangingisay at labis na naghihirap, sapagkat madalas siyang nahuhulog sa apoy at madalas sa tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inuubasan siya”; sa literal, “tinamaan ng buwan.” Ang salitang Griyego ay isang sinaunang idyoma para sa kalagayang may mga pangingisay.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: at nagsabi
  rationale: Ipinapahayag nang natural sa Filipino ang participle na kaugnay ng naunang salaysay; ang tahasang literal na ‘at nagsasabing’ ay asiwa kapag nakahiwalay ang talata.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang marangal na pantawag kay Jesus at tuwirang katumbas ng vocative na κύριε.
- source_word: ἐλέησόν
  choice: maawa po kayo sa
  rationale: Pinananatili ang taimtim na pakiusap para sa habag; ang ‘po kayo’ ay natural na pagpapahayag ng paggalang sa modernong Filipino.
- source_word: μου τὸν υἱόν
  choice: anak kong lalaki
  rationale: Tiyak na anak na lalaki ang υἱός; iniiwasan ng buong parirala ang posibleng di-tiyak na kasarian ng ‘anak’ lamang.
- source_word: σεληνιάζεται
  choice: inuubasan siya
  rationale: Ang ‘inuubasan’ ay tradisyonal na terminong Filipino para sa sumpong na kaugnay sa buwan at nagpapanatili sa sinaunang idyoma nang hindi awtomatikong nagbibigay ng modernong medikal na diyagnosis.
- source_word: κακῶς πάσχει
  choice: labis na naghihirap
  rationale: Natural at marangal na Filipino na naghahatid ng tindi ng κακῶς kasama ng πάσχει.
- source_word: πολλάκις
  choice: madalas
  rationale: Payak at karaniwang katumbas na nagpapahayag ng paulit-ulit na pangyayari.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: bumabagsak sa apoy
  rationale: Tuwirang inilalarawan ang paghulog o pagbagsak patungo sa apoy.
- source_word: εἰς τὸ ὕδωρ
  choice: sa tubig
  rationale: Pinananatili ang paralelismo sa ‘sa apoy’ sa natural na anyong Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa σεληνιάζεται sa konteksto ng pagpapagaling at pagpapalayas ng demonyo
  choice: Inuubasan siya, na may paliwanag sa talababa tungkol sa mga pangingisay
  alternative: May mga pangingisay siya / epileptiko siya
  rationale: Pinananatili ng pangunahing teksto ang sinaunang idyomang may kaugnayan sa buwan, samantalang nililinaw ng talababa ang nakikitang kalagayan. Hindi nito ipinipilit ang modernong diyagnosis o pinagtitibay ang buwan bilang sanhi, at hindi rin nito inuunahan ang paliwanag ng mas malawak na salaysay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘po kayo’ bilang likas na paggalang sa tuwirang pakiusap. Ang di-pangkaraniwang ‘inuubasan’ ay sinamahan ng malinaw na talababa upang mapanatili kapwa ang pinagmulang idyoma at ang pagkaunawa ng karaniwang mambabasa.
