  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: tl
  text: Nang sabihin niya, “Mula sa mga tagalabas,”[a] sinabi sa kanya ni Jesus, “Kung gayon, malaya[b] ang mga anak na lalaki.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Mula sa mga hindi kabilang sa sambahayan ng pinuno” o “Mula sa ibang tao.” Ipinaghahambing ng salitang Griyego ang mga tagalabas at ang sariling mga anak ng pinuno.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi saklaw ng buwis.” Mas literal na “malaya” ang salitang Griyego; sa kontekstong ito, ipinahihiwatig nitong hindi sila obligadong magbayad ng buwis.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga anak,” ngunit partikular na “mga anak na lalaki” ang salitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Nang sabihin niya
  rationale: Ipinahahayag ng genitive absolute ang panahong kaugnayan sa sumunod na sinabi ni Jesus. Likas sa Tagalog ang “Nang sabihin niya,” at hindi nito dinaragdagan ang teksto ng tahasang “sumagot.”
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Sa mga tagalabas
  rationale: Tumutukoy ang ἀλλότριοι sa mga hindi kabilang sa sariling sambahayan ng pinuno, salungat sa kanyang mga anak. Iniiwasan ng “tagalabas” ang posibleng maling pahiwatig ng lahi o nasyonalidad na maaaring idulot ng “dayuhan.”
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: sinabi sa kanya ni Jesus
  rationale: Payak at natural na salaysay ito na malapit sa karaniwang gamit ng φημί.
- source_word: Ἄρα γε
  choice: Kung gayon
  rationale: Malinaw nitong ipinahahayag ang konklusyong hinango ni Jesus mula sa sagot, nang hindi nagiging labis na pormal.
- source_word: ἐλεύθεροί
  choice: malaya
  rationale: Pinananatili nito ang pangunahing kahulugan ng salita at ang mas malawak na paghahambing tungkol sa kalagayan ng mga anak. Sa konteksto, ipinahihiwatig nitong hindi sila obligadong magbayad ng buwis.
- source_word: οἱ υἱοί
  choice: ang mga anak na lalaki
  rationale: Tahasang panlalaki ang υἱοί at tumutukoy sa mga anak na lalaki ng isang hari sa paghahambing. Pinananatili ng salin ang partikular na anyo at ang kaugnay na diwa ng pagiging anak.
theological_decisions:
- issue: Paglalarawan sa kalayaan ng mga anak kaugnay ng buwis
  choice: malaya
  alternative: hindi saklaw ng buwis
  rationale: Ang “malaya” ang mas tuwirang katumbas ng ἐλεύθεροι at hindi nililimitahan ang pahayag sa buwis lamang, bagaman iyon ang agarang implikasyon sa konteksto.
- issue: Paglilipat ng οἱ υἱοί sa paghahambing tungkol sa sambahayan ng hari
  choice: ang mga anak na lalaki
  alternative: ang mga anak
  rationale: Pinananatili ang panlalaking anyo ng pinagmulang teksto at ang larawan ng mga anak na lalaki ng hari, nang hindi pinalalawak o ginagawang neutral ang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagalabas” upang maging natural at maiwasan ang etnikong pahiwatig ng “dayuhan”; ipinaliwanag sa talababa ang ugnayan nito sa sambahayan. Pinanatili ang “malaya” at “mga anak na lalaki” upang maingatan ang leksikal at teolohikal na puwersa ng Griyego.
