  naturalness: Malinaw at marangal ang daloy sa modernong Filipino Tagalog. Ang “nilukuban sila ng isang maningning na ulap” ay natural at mas maayos na tumutugma sa aspektong pagsasalaysay kaysa “nililiman sila.”
