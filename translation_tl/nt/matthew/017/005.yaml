id: MAT.17.5
reference: Matthew 17:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: tl
  text: Habang nagsasalita pa siya, narito, nilukuban sila ng isang maningning na ulap.[a] At narito, may tinig mula sa ulap na nagsabi, “Ito ang minamahal kong Anak, na lubos kong kinalulugdan. Makinig kayo sa kanya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nilukuban” ay maaaring umalingawngaw sa wikang ginagamit sa Biblia para sa pagpapakita ng presensiya ng Diyos.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “Pakinggan ninyo siya.” Ang pandiwang Griyego ay maaaring tumukoy sa pakikinig na may pagtugon o pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa siya
  rationale: Likas na Filipino para sa genitive absolute at pinananatili ang magkasabay na kilos at ang diwang naputol ang pagsasalita.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang dalawang pantawag-pansing panandang nagpapatingkad sa biglang pangyayari, sa dignified ngunit nauunawaang Filipino.
- source_word: νεφέλη φωτεινὴ
  choice: isang maningning na ulap
  rationale: Tuwirang inilalarawan ang ulap bilang maliwanag o nagniningning nang hindi ipinapaliwanag sa pangunahing teksto ang posibleng simbolismo nito.
- source_word: ἐπεσκίασεν
  choice: nililiman
  rationale: Pinananatili ang larawan ng paglukob o pagtabon ng anino at ang posibleng alusyon sa pagpapakita ng presensiya ng Diyos.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: may tinig mula sa ulap na nagsabi
  rationale: Natural na Filipino na ginagawang tahasang pandiwa ang participle habang pinananatili ang pinagmulan ng tinig.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: ang minamahal kong Anak
  rationale: Pinananatili ang pagkakakilanlan bilang Anak at ang diwa ng pag-ibig sa maikli at natural na ayos sa Filipino.
- source_word: ἐν ᾧ εὐδόκησα
  choice: na lubos kong kinalulugdan
  rationale: Inihahayag ang matinding pagsang-ayon at kaluguran ng nagsasalita nang hindi dinaragdagan ang teolohikal na nilalaman.
- source_word: ἀκούετε αὐτοῦ
  choice: Makinig kayo sa kanya
  rationale: Ipinahihiwatig ng pautos ang pakikinig na may pagsasaalang-alang at pagsunod, hindi lamang pandinig.
theological_decisions:
- issue: Pahayag ng Ama tungkol sa pagkakakilanlan ni Jesus
  choice: Ito ang minamahal kong Anak, na lubos kong kinalulugdan
  alternative: Ito ang aking Anak, ang Minamahal; sa kanya ako nalulugod
  rationale: Pinananatili ang tuwirang pagkilala kay Jesus bilang Anak, ang pag-ibig na ipinahahayag ng ἀγαπητός, at ang kaluguran ng εὐδόκησα nang hindi nag-aangkat ng kalaunang terminolohiyang doktrinal.
- issue: Lakas ng ἀκούετε αὐτοῦ
  choice: Makinig kayo sa kanya
  alternative: Pakinggan ninyo siya
  rationale: Ang kasalukuyang pautos ay humihingi ng patuloy at tumutugong pakikinig. Hindi ito pinalawak sa tahasang “sundin” upang mapanatili ang saklaw at bahagyang tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang dalawang “narito” upang katawanin ang inuulit na ἰδού at ang dramatikong diin nito. Ginamit ang “kayo” dahil maramihan ang pautos sa Griyego.
