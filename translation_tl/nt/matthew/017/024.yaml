id: MAT.17.24
reference: Matthew 17:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: tl
  text: Nang dumating sila sa Capernaum, lumapit kay Pedro ang mga naniningil ng buwis na dalawang drakma[a] at nagtanong, “Hindi ba nagbabayad ang inyong guro ng buwis na dalawang drakma?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang dalawang drakma”; tumutukoy ito sa buwis para sa templo na nagkakahalaga ng dalawang drakma.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Nang dumating sila
  rationale: Ang genitive absolute ay nagsasaad ng pangyayaring temporal. Likas sa modernong Tagalog ang “Nang dumating sila”; hindi na kailangang isalin nang tahasan ang mahinang panandang δέ.
- source_word: Καφαρναοὺμ
  choice: Capernaum
  rationale: Ginamit ang karaniwang anyo ng pangalan ng lugar sa mga saling Tagalog.
- source_word: προσῆλθον
  choice: lumapit
  rationale: Tumpak at natural na ipinahahayag ang pagkilos patungo kay Pedro.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: ang mga naniningil ng buwis na dalawang drakma
  rationale: Tinutukoy ng pariralang participial ang mga tao ayon sa kanilang gawain. Sa konteksto, ang pagtanggap sa dalawang drakma ay paniningil ng buwis.
- source_word: δίδραχμα
  choice: buwis na dalawang drakma
  rationale: Ang δίδραχμα ay halagang katumbas ng dalawang drakma. Nililinaw ng “buwis” ang gamit nito sa konteksto, samantalang pinananatili ng “dalawang drakma” ang halagang nasa Griyego.
- source_word: τῷ Πέτρῳ
  choice: kay Pedro
  rationale: Natural na Tagalog para sa dative na nagsasaad ng taong nilapitan.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: ang inyong guro
  rationale: Ang “guro” ang tuwirang at karaniwang katumbas ng διδάσκαλος. Ang “inyong” ay magalang at maaari ring tumukoy sa pangkat, gaya ng maramihang ὑμῶν.
- source_word: οὐ τελεῖ
  choice: Hindi ba nagbabayad
  rationale: Sa usapin ng buwis, ang τελέω ay nangangahulugang magbayad. Pinananatili ng negatibong tanong na “Hindi ba” ang anyo at inaasahang pagsang-ayon ng tanong sa Griyego nang hindi ito tahasang nilulutas.
theological_decisions:
- issue: Pagkilala sa δίδραχμα bilang buwis sa halip na mga barya lamang
  choice: buwis na dalawang drakma sa pangunahing teksto
  alternative: dalawang drakma; buwis na didrakma
  rationale: Ang konteksto ay tungkol sa pagbabayad ng isang takdang singil, hindi lamang sa pagtanggap ng mga barya. Nililinaw ng “buwis” ang kontekstuwal na kahulugan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Pagkilala sa buwis bilang buwis para sa templo
  choice: Ipaliwanag sa talababa, hindi idagdag sa pangunahing teksto
  alternative: buwis para sa templo sa pangunahing teksto
  rationale: Hindi tahasang nasa talata ang salitang “templo,” bagaman ito ang malinaw na kontekstuwal at pangkulturang tinutukoy. Pinananatili ng talababa ang pagkakaiba ng mismong pananalita at ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “naniningil” sa halip na mas teknikal na katawagan, at pinanatili ang yunit na “drakma” upang hindi palitan ng di-tiyak na makabagong halaga. Ang [a] ay nakalagay sa pangunahing teksto at tumutugma sa talababa.
