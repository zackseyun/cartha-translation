  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: tl
  text: Ngunit sumagot si Jesus, “O salinlahing walang pananampalataya[a] at baluktot[b], hanggang kailan pa ako makakasama ninyo? Hanggang kailan ko kayo pagtitiisan? Dalhin ninyo siya rito sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi tapat.” Ang salitang Griyego ay maaaring tumukoy sa kawalan ng paniniwala o ng katapatan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tiwali” o “napilipit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ngunit sumagot si Jesus
  rationale: Ang ἀποκριθεὶς ... εἶπεν ay karaniwang idyomang nangangahulugang “sumagot,” habang ang δέ ay nagpapahiwatig dito ng bahagyang pagsalungat o pagbabago ng himig; natural itong naipahahayag ng “Ngunit.”
- source_word: Ὦ γενεὰ
  choice: O salinlahi
  rationale: Pinananatili ng “O” ang maringal at mapanumbat na pagtawag, at ng “salinlahi” ang pangkat ng magkakapanahong tinutukoy ng γενεά at ang propetikong himig nito.
- source_word: ἄπιστος
  choice: walang pananampalataya
  rationale: Tuwirang ipinahahayag nito ang kakulangan ng pananampalataya sa konteksto, habang inilalagay sa talababa ang posibleng diwang “hindi tapat.”
- source_word: διεστραμμένη
  choice: baluktot
  rationale: Ang perpektong pasibong anyo ay naglalarawan ng isang kalagayang napilipit o nalihis. Pinananatili ng “baluktot” ang matalinghagang puwersa at hindi nito labis na tinutukoy ang uri ng katiwalian.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: hanggang kailan pa ako mananatiling kasama ninyo?
  rationale: Natural na retorikal na tanong sa Tagalog ang “hanggang kailan pa”; nililinaw ng “mananatiling kasama” ang temporal na diwa ng hinaharap na ἔσομαι nang hindi binabago ang tinutukoy.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Hanggang kailan ko kayo pagtitiisan?
  rationale: Ang “pagtitiisan” ay natural ngunit marangal na katumbas ng ἀνέχομαι, na nangangahulugang magtiis o magbata sa isang tao.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Dalhin ninyo siya rito sa akin
  rationale: Tuwirang inihahatid ng “dalhin” ang pautos na φέρετε; ang “siya” ay tumutukoy sa batang lalaki sa konteksto, at ang “rito sa akin” ay kumakatawan sa ὧδε at μοι.
theological_decisions:
- issue: Diwa ng ἄπιστος sa pagsaway ni Jesus
  choice: walang pananampalataya
  alternative: hindi tapat
  rationale: Nakasentro ang kagyat na konteksto sa kakulangan ng pananampalataya kaugnay ng kabiguang mapalayas ang demonyo. Gayunman, maaaring mangahulugan ang salita ng kawalan ng katapatan, kaya pinananatili ang alternatibo sa talababa sa halip na tuluyang alisin ang leksikal na tensiyon.
- issue: Lawak ng tinutukoy ng γενεά
  choice: salinlahi
  alternative: mga tao
  rationale: Hindi tiyak sa mismong talata kung gaano kalawak ang sakop ng pagsaway. Ang “salinlahi” ay hindi nagpapasya kung mga alagad lamang, ang mga naroon, o ang mas malawak na kapanahunan ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang “O” at “salinlahi” upang maihatid ang solemne at propetikong himig ng pagsaway, habang ginamit ang natural na “pagtitiisan” sa halip na mas kolokyal na pananalita.
