  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: tl
  text: at papatayin nila siya, at sa ikatlong araw ay ibabangon siya.[a] At labis silang nalungkot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na, “babangon siya.” Pasibo ang pandiwang Griyego: “ibabangon siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν
  choice: papatayin nila
  rationale: Tuwirang ipinapahayag ng panghinaharap na aktibong pandiwa ang pagpatay; natural ito sa modernong Tagalog at hindi nagdaragdag ng legal o moral na kahulugang wala sa pandiwa.
- source_word: αὐτόν
  choice: siya
  rationale: Tumutukoy ang panghalip sa Anak ng Tao na binanggit sa naunang talata.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: sa ikatlong araw
  rationale: Tumpak at likas na katumbas ng datibong parirala na nagsasaad kung kailan mangyayari ang kilos.
- source_word: ἐγερθήσεται
  choice: muli siyang bubuhayin
  rationale: Pinananatili ang pasibong anyo ng Griyego at malinaw na ipinahihiwatig sa konteksto ang muling pagkabuhay mula sa kamatayan. Mas natural ito sa Tagalog kaysa sa literal na 'ibabangon siya,' na maaaring maunawaang pisikal lamang na pagpapatayo.
- source_word: ἐλυπήθησαν σφόδρα
  choice: labis silang nalungkot
  rationale: Likas at marangal na modernong Tagalog na nagpapahayag ng matinding dalamhati; ang 'labis' ang katumbas ng pampalakas na σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... at ... At
  rationale: Pinananatili ang payak at magkakasunod na daloy ng mga sugnay sa Griyego.
theological_decisions:
- issue: Pasibo o aktibong paglalarawan sa muling pagkabuhay
  choice: muli siyang bubuhayin
  alternative: babangon siyang muli
  rationale: Pasibo ang ἐγερθήσεται. Ang napiling salin ay nagpapanatili sa anyong iyon at sa posibleng pahiwatig na ang Diyos ang kumikilos, nang hindi tahasang idinaragdag ang gumagawa ng kilos. Inilalagay sa talababa ang natural na aktibong alternatibo upang mapanatili ang leksikal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na payak, dignified, at madaling maunawaan. Ginamit ang 'muli siyang bubuhayin' para sa malinaw at natural na pahayag ng muling pagkabuhay habang pinananatili ang pasibong tinig ng orihinal.
