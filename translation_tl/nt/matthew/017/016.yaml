  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: tl
  text: At dinala ko siya sa mga alagad mo, at hindi nila siya nagawang pagalingin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: dinala ko
  rationale: Sa konstruksyong may tuwirang layon at datibo, ang προσφέρω ay nangangahulugang dalhin ang isang tao sa iba. Ang “dinala ko” ay natural at tumpak sa modernong Tagalog.
- source_word: μαθηταῖς σου
  choice: sa mga alagad mo
  rationale: Sa konteksto ng mga Ebanghelyo, ang μαθητής ay tumutukoy sa mga nakatalaga at sumusunod na mag-aaral ng isang guro. Ang “mga alagad mo” ang malinaw at kinikilalang katumbas sa Tagalog.
- source_word: οὐκ ἠδυνήθησαν
  choice: hindi nila ... mapagaling
  rationale: Ipinapahayag ng δύναμαι ang kakayahan. Ang hulma na “hindi nila siya mapagaling” ay likas na paraan sa Tagalog upang sabihin na hindi nila nagawang pagalingin siya, at hindi lamang na walang paggaling na naganap.
- source_word: θεραπεῦσαι
  choice: mapagaling
  rationale: Sa kontekstong ito, ang θεραπεύω ay tumutukoy sa pagpapagaling sa batang may karamdaman. Ang “mapagaling” ay natural na kaugnay ng pahayag ng kawalan ng kakayahan.
- source_word: καὶ ... καὶ
  choice: At ... ngunit
  rationale: Ang unang καί ay nag-uugnay sa salaysay sa naunang sinabi. Isinalin ang ikalawa bilang “ngunit” upang likas na maipahayag sa Tagalog ang malinaw na pagsalungat sa pagitan ng pagdadala sa bata at ng kabiguan ng mga alagad, nang hindi nagdaragdag ng paliwanag sa dahilan nito.
- source_word: αὐτόν
  choice: siya
  rationale: Ang panghalip ay tumutukoy sa anak o batang binanggit sa agarang konteksto; ang “siya” ang tuwiran at natural na katumbas.
theological_decisions:
- issue: Dahilan at uri ng kabiguan ng mga alagad
  choice: Payak na sinabing hindi nila mapagaling ang bata, nang walang idinagdag na dahilan.
  alternative: Tahasang sabihing hindi nila mapalayas ang demonyo o na nabigo sila dahil sa kakulangan ng pananampalataya.
  rationale: Ang talata mismo ay nagsasaad lamang na hindi nila nagawang pagalingin siya. Hindi dapat ipasok rito ang mga paliwanag mula sa nakapaligid na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang “alagad” bilang pamilyar na terminong pang-Ebanghelyo; ginamit ang idiomatikong “hindi nila siya mapagaling” upang tuwirang ipahayag ang kawalan ng kakayahan.
