  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: tl
  text: At tinanong siya ng mga alagad, “Kung gayon, bakit sinasabi ng mga eskriba na kailangang maunang dumating si Elias?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: tinanong
  rationale: Likas at tuwirang katumbas sa makabagong Filipino para sa pandiwang nagpapakilala ng tahasang tanong.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Tumutukoy sa tiyak at kilala nang pangkat sa konteksto. Hindi idinagdag ang “niya” dahil wala itong tahasang katumbas sa Griyego.
- source_word: λέγοντες
  choice: '[ipinahiwatig ng tuwirang sipi]'
  rationale: Sa natural na Filipino, sapat nang sundan ang “tinanong” ng mismong tanong; ang tahasang “na sinasabi” ay magiging mabigat at paulit-ulit.
- source_word: Τί οὖν
  choice: Kung gayon, bakit
  rationale: Ang τί sa kayariang ito ay humihingi ng dahilan, kaya “bakit” ang likas na katumbas; ipinapanatili ng “kung gayon” ang inferensiyal na puwersa ng οὖν.
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinahahayag nito ang ginagampanang papel ng mga γραμματεῖς sa kontekstong Judio at mas madaling maunawaan ng karaniwang modernong mambabasa kaysa sa teknikal na “mga eskriba.”
- source_word: λέγουσιν ὅτι
  choice: sinasabi ... na
  rationale: Pinananatili ang kasalukuyang pahayag at ang sugnay na nagsasaad ng nilalaman nito.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: δεῖ ἐλθεῖν
  choice: kailangang ... dumating
  rationale: Malinaw na ipinapahayag ang puwersa ng pangangailangan sa δεῖ habang nananatiling natural sa Filipino.
- source_word: πρῶτον
  choice: maunang
  rationale: Likas na Filipino para sa pagkakasunod-sunod na ipinahihiwatig ng “first,” at malinaw na inuugnay sa pagdating.
theological_decisions:
- issue: Puwersa ng tanong ng mga alagad tungkol sa pagdating ni Elias
  choice: Inilahad ang tanong nang hindi ipinahihiwatig kung pinagtitibay, kinukuwestiyon, o bahagyang itinutuwid ang turo ng mga tagapagturo ng Kautusan.
  alternative: Maaaring lagyan ng tonong nag-aalinlangan sa kanilang turo o ipaliwanag agad ang kaugnayan nito sa Malakias.
  rationale: Hindi pa nilulutas ng talatang ito ang tensiyon; nasa sumusunod na mga talata ang tugon ni Jesus. Kaya hindi dapat ipasok rito ang paliwanag o konklusyon.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “tagapagturo ng Kautusan” bilang malinaw na functional equivalent ng γραμματεῖς, at iniwasan ang di-likas na literal na “na nagsasabi” pagkatapos ng “tinanong.”
