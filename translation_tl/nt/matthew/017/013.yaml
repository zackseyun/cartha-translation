    issue: Ang “tinutukoy niya sa kanila” ay hindi tuwirang salin ng εἶπεν αὐτοῖς.
    rationale: Ang Griyego ay nagsasabing nagsalita si Jesus sa mga alagad tungkol kay Juan; hindi nito ginagamit ang pandiwang “tinutukoy.” Bagaman katugma ang kahulugan sa konteksto, ang pagbabago ay nagiging mas interpretatibo kaysa kinakailangan.
  revised_text: Noon ay naunawaan ng mga alagad na nagsalita siya sa kanila tungkol kay Juan na Tagapagbautismo[a].
