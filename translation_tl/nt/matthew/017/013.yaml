  verdict: revise
  source_fidelity: Ang draft ay wastong kumikilala na si Juan ang paksa ng pagkaunawa ng mga alagad. Ngunit ang “ang tinutukoy niya sa kanila” ay inililipat ang εἶπεν αὐτοῖς (“nagsalita/ sinabi niya sa kanila”) tungo sa mas interpretatibong “tinutukoy niya.” Mas tapat na panatilihin ang pandiwang pagsasalita at ang περί bilang “tungkol kay.”
  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Noon ay naunawaan ng mga alagad na nagsalita siya sa kanila tungkol kay …” Mas malinaw rin ito kaysa sa hulmaing “ang tinutukoy niya sa kanila.”
  terminology: Pinananatili ang “Juan na Tagapagbautismo,” isang malinaw at tuwirang anyo para sa Ἰωάννης ὁ βαπτιστής. Ang “Juan na Tagapagbinyag” ay maaaring manatili bilang leksikal na alternatibo sa talababa.
  issues:
