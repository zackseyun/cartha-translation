  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: tl
  text: Noon ay naunawaan ng mga alagad na nagsalita siya sa kanila tungkol kay Juan na Tagapagbautismo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Juan na Tagapagbinyag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Noon
  rationale: Likas at maikli itong panandang temporal para sa sandali ng pagkaunawa sa salaysay.
- source_word: συνῆκαν
  choice: naunawaan
  rationale: Ipinapahayag ng anyong aorist ang pagdating nila sa pagkaunawa; malinaw at natural ang “naunawaan” sa modernong Tagalog.
- source_word: οἱ μαθηταὶ
  choice: mga alagad
  rationale: Ito ang kinagawiang katawagan sa mga tagasunod at mag-aaral ni Jesus sa salaysay ng Ebanghelyo.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng kanilang naunawaan, hindi isang sugnay na nagsasaad ng sanhi.
- source_word: περὶ Ἰωάννου τοῦ βαπτιστοῦ
  choice: si Juan na Tagapagbautismo ang tinutukoy
  rationale: Natural na Tagalog ang hulmaing “ang tinutukoy” para sa pagsasalita tungkol sa isang tao, at malinaw nitong pinananatili ang tahasang tinutukoy ng Griyego.
- source_word: εἶπεν αὐτοῖς
  choice: tinutukoy niya sa kanila
  rationale: Inihahatid nito sa natural na Tagalog ang naunang sinabi ni Jesus sa kanila nang hindi nagdaragdag ng nilalaman.
theological_decisions:
- issue: Pagkakakilanlan ng Elias na tinutukoy sa agarang konteksto
  choice: Tahasan na naunawaan ng mga alagad na si Juan na Tagapagbautismo ang tinutukoy ni Jesus.
  alternative: Panatilihing malabo kung sino ang tinutukoy ni Jesus.
  rationale: Ang mismong salaysay ang kumikilala kay Juan bilang tinutukoy; hindi ito dagdag na pagpapakahulugan ng tagapagsalin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “Tagapagbautismo” bilang mas tuwirang katumbas ng βαπτιστής, habang inilagay sa talababa ang karaniwang alternatibong “Tagapagbinyag.”
