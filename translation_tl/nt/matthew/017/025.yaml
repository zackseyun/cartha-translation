id: MAT.17.25
reference: Matthew 17:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: tl
  text: 'Sumagot siya, “Oo.” Pagpasok ni Pedro sa bahay, si Jesus ang unang nagsalita sa kanya: “Ano sa palagay mo, Simon? Kanino naniningil ang mga hari ng daigdig ng mga singil sa adwana o buwis sa bawat tao[a]—sa kanilang sariling mga anak na lalaki o sa iba[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga buwis o tributo.” Magkaiba sa Griyego ang τέλη, na tumutukoy sa mga singil, gaya ng mga singil sa adwana, at κῆνσος, na tumutukoy sa buwis sa bawat tao o tributong buwis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga hindi nila kaanak” o “sa mga tagalabas.” Ang Griyegong ἀλλοτρίων ay tumutukoy rito sa mga hindi kabilang sa sariling pamilya, lalo na sa mga hindi sariling anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Oo
  rationale: Payak at natural na panumbas sa tuwirang pagsang-ayon sa modernong Filipino.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Nang pumasok siya sa bahay
  rationale: Ginagawang malinaw na sugnay na pamanahon ang participle; si Pedro ang tinutukoy ng “siya.”
- source_word: προέφθασεν αὐτὸν
  choice: inunahan siya ni Jesus at sinabi
  rationale: Ipinahihiwatig ng pandiwa na si Jesus ang unang nagsalita bago pa makapagsalita si Pedro; pinananatili ng “inunahan” ang larawan ng orihinal habang nililinaw ito ng “at sinabi.”
- source_word: Τί σοι δοκεῖ
  choice: Ano sa palagay mo
  rationale: Karaniwan at likas na ekspresyon sa Filipino para sa paghingi ng pasiya o pananaw.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ang mga hari sa lupa
  rationale: Tuwirang salin na hindi nagpapakitid sa γῆ bilang isang partikular na lupain.
- source_word: τέλη
  choice: buwis sa mga kalakal
  rationale: Tumutukoy sa mga di-tuwirang buwis, singil sa kalakal, o customs duties, at iniiba ito sa kasunod na κῆνσον.
- source_word: κῆνσον
  choice: buwis sa bawat tao
  rationale: Malinaw na modernong paglalarawan sa poll tax o head tax, bagaman maaari ring tumukoy sa tributo.
- source_word: υἱῶν αὐτῶν
  choice: sarili nilang mga anak na lalaki
  rationale: Pinananatili ang tiyak na kahulugan ng υἱοί na “mga anak na lalaki” at ang ugnayang pampamilya sa paghahambing.
- source_word: ἀλλοτρίων
  choice: mga tagalabas
  rationale: Ipinahahayag ang mga hindi kabilang sa sariling pamilya ng hari; mas tiyak ito kaysa sa pangkalahatang “iba” at hindi naman kinakailangang mangahulugang dayuhan.
theological_decisions:
- issue: Posibleng teolohikal na pahiwatig ng “mga anak na lalaki” sa paghahambing ni Jesus
  choice: Panatilihin ang literal na wikang pampamilya na “sarili nilang mga anak na lalaki” nang hindi ipinapaliwanag sa pangunahing teksto ang kristolohikal na pahiwatig nito.
  alternative: sarili nilang mga anak; kanilang mga nasasakupan
  rationale: Ang agarang punto ay hindi sinisingil ng hari ang sarili niyang pamilya; inihahanda nito ang pahiwatig tungkol sa Anak sa kasunod na talata. Pinananatili ng salin ang tensiyong ito nang hindi ito inuunahan ng interpretasyon.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “Oo” bilang payak na sagot at ang “Ano sa palagay mo” bilang karaniwang pananalita. Ipinaliliwanag sa teksto ang dalawang uri ng buwis nang hindi pinagbubuklod ang magkaibang salitang Griyego. Inilagay ang mga marker [a] at [b] sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
