id: MAT.17.18
reference: Matthew 17:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: tl
  text: At sinaway siya ni Jesus, at lumabas sa kanya ang demonyo; at mula sa oras na iyon ay gumaling ang bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: sinaway
  rationale: Ipinahahayag ng “sinaway” ang matindi at makapangyarihang pagsaway ni Jesus, nang hindi nililimitahan ang kilos sa isang tahasang utos lamang.
- source_word: αὐτῷ
  choice: siya
  rationale: Ang panghalip sa Griyego ay maaaring tumukoy sa bata o sa demonyo, bagaman higit na ipinahihiwatig ng kasunod na sugnay na ang demonyo ang sinaway. Pinananatili ng “siya” ang anyong panghalip at ang bahagyang kalabuan ng pinagmulan.
- source_word: τὸ δαιμόνιον
  choice: ang demonyo
  rationale: Ito ang tuwiran at karaniwang katumbas; hindi idinaragdag ang paglalarawang “maruming espiritu,” na wala sa talata.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: lumabas sa kanya
  rationale: Natural itong pahayag sa Filipino para sa pagpapalayas ng demonyo at malapit sa hayag na larawan ng Griyego.
- source_word: ἐθεραπεύθη
  choice: gumaling
  rationale: Likas at malinaw na Filipino ito para sa pasibong diwa ng pagkagaling, nang hindi pinakikitid ang kahulugan sa medikal na lunas lamang.
- source_word: ὁ παῖς
  choice: ang bata
  rationale: Sa konteksto, anak ng ama ang tinutukoy. Ang “bata” ay natural at hindi nag-aangkat ng posibleng ngunit di-angkop na kahulugang “alipin” o “lingkod.”
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: mula sa oras na iyon
  rationale: Pinananatili nito ang literal na temporal na larawan ng Griyego habang malinaw pa rin sa makabagong Filipino.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῷ sa pagsaway ni Jesus
  choice: Pinanatili ang panghalip na “siya”
  alternative: Tahasan itong isaling “sinaway ni Jesus ang demonyo” o unawaing ang bata ang sinaway
  rationale: Malakas na ipinahihiwatig ng kasunod na “lumabas sa kanya ang demonyo” na ang demonyo ang sinaway, ngunit hindi tahasang inuulit ng Griyego ang pangngalan. Ang panghalip na Filipino ay nagpapanatili sa pormal na kalabuan nang hindi nagpapasok ng tiyak na pagpapakahulugang higit sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanya” sa karaniwang modernong baybay at pinanatili ang maikli at sunod-sunod na daloy ng salaysay sa Griyego.
