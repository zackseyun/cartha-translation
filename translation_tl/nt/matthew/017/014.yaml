translation:
  language: tl
  text: At pagdating nila sa karamihan ng tao, lumapit sa kanya ang isang lalaki at lumuhod sa harap niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito sa naunang salaysay at hindi nagdaragdag ng bagong interpretasyon.
- source_word: ἐλθόντων πρὸς τὸν ὄχλον
  choice: nang makarating sila sa maraming tao
  rationale: Ang aorist participle na nasa genitive plural ay bumubuo ng genitive absolute na may pahiwatig na maramihang simuno mula sa konteksto. Likas sa Filipino ang temporal na pariralang “nang makarating sila,” at ang ὄχλος ay tumutukoy sa nagkatipong maraming tao.
- source_word: προσῆλθεν αὐτῷ
  choice: lumapit sa kanya
  rationale: Tuwirang ipinapahayag ng προσέρχομαι ang paglapit sa isang tao; malinaw at natural ang “lumapit sa kanya.”
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy ito rito sa isang tiyak na lalaking nasa hustong gulang, hindi sa sangkatauhan sa pangkalahatan.
- source_word: γονυπετῶν αὐτόν
  choice: lumuhod sa harap niya
  rationale: Inilalarawan ng participle ang kilos o ayos ng lalaki habang lumalapit. Ipinahihiwatig nito ang pagluhod sa harap ng isang tao, nang hindi kinakailangang tukuyin kung biglaan o marahan ang kilos.
theological_decisions:
- issue: Kung dapat ipahiwatig na pagsamba ang γονυπετῶν
  choice: lumuhod sa harap niya
  alternative: sumamba sa kanya
  rationale: Tiyak na inilalarawan ng Griyego ang pisikal na pagluhod, ngunit hindi nito sa sarili lamang nilulutas ang buong teolohikal na kahulugan ng kilos. Pinananatili ng salin ang nakikitang kilos nang hindi nagdaragdag ng denominasyonal o doktrinal na pagpapakahulugan.
- issue: Paglalarawan sa ἄνθρωπος bilang tiyak na indibidwal
  choice: isang lalaki
  alternative: isang tao
  rationale: Ang anyo at konteksto ay tumutukoy sa isang partikular na lalaking indibidwal; hindi ito pangkalahatang pahayag tungkol sa sangkatauhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “maraming tao” sa halip na mas pormal na “karamihan,” at pinanatili ang mga panghalip dahil malinaw sa konteksto na tumutukoy ang mga ito kay Jesus.
