  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: tl
  text: Ngunit[a] ang ganitong uri ay hindi lumalabas maliban sa pamamagitan ng panalangin at pag-aayuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa pinakamaagang mga manuskritong Griego (kabilang ang Sinaiticus at Vaticanus mula sa ika-4 na siglo) at sa mga sinaunang saling Syriac at Coptic. Gayunman, makikita ito sa karamihan ng mga manuskrito sa tradisyong Byzantine, sa tradisyong Latin, at sa karamihan ng mga manuskritong Syriac. Malamang na idinagdag ito ng mga tagakopya nang maglaon upang iayon sa Marcos 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: ganitong uri
  rationale: Sa konteksto, tumutukoy ito sa isang uri o kategorya ng demonyo; likas at malinaw sa modernong Tagalog ang “ganitong uri.”
- source_word: ἐκπορεύεται
  choice: lumalabas
  rationale: Tumutukoy ito sa paglabas ng demonyo mula sa taong sinapian; tuwiran at natural ang “lumalabas.”
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: 'Eksklusibo ang gamit ng parirala: walang ibang paraan kundi ang kasunod na binanggit.'
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: sa pamamagitan ng panalangin at pag-aayuno
  rationale: Ipinahahayag ng ἐν dito ang paraang kaugnay ng paglabas; malinaw itong naihahatid ng “sa pamamagitan ng.”
