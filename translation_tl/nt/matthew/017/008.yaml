  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: tl
  text: At nang itinaas nila ang kanilang mga mata, wala silang nakitang sinuman kundi si Jesus mismo lamang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, kapuwa ang αὐτόν (“siya mismo”) at μόνον (“lamang”) ay nagbibigay-diin na si Jesus lamang ang kanilang nakita.
    reason: Ipinapaliwanag ang pinagsama-samang diin ng αὐτόν at μόνον, na sinasadyang pinananatili sa “si Jesus mismo lamang.”
lexical_decisions:
- source_word: ἐπάραντες
  choice: nang iangat nila
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwang “nakita”; natural itong naipapahayag sa Tagalog sa pamamagitan ng “nang.”
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay; hindi kailangan ang mas mariing panalungat na “ngunit.”
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: ang kanilang mga mata
  rationale: Pinananatili ang kongkretong idyoma ng Griyego sa halip na gawing abstraktong “tingin.”
- source_word: οὐδένα
  choice: sinuman
  rationale: Malinaw at likas na katumbas sa loob ng negatibong pariralang “wala silang nakitang sinuman.”
- source_word: εἶδον
  choice: nakita nila / wala silang nakitang
  rationale: Payak na aorist ng ὁράω; inayos sa natural na sintaks ng Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Pagkatapos ng negatibong pahayag, ang parirala ay nagtatakda ng tanging eksepsiyon; “kundi” ang likas na katumbas sa Tagalog.
- source_word: αὐτὸν
  choice: si Jesus
  rationale: Ang panghalip ay tumutukoy kay Jesus at may diin sa Griyego. Hindi natural ang literal na “si Jesus mismo lamang” sa pangungusap na ito, kaya ipinahihiwatig ang diin sa kabuuang eksklusibong balangkas.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: μόνον
  choice: lamang
  rationale: Pinatitibay nito ang pagiging bukod-tangi ni Jesus bilang ang tanging nakita at pinananatili ang diin sa hulihan ng pangungusap.
theological_decisions:
- issue: Si Jesus ang tanging nanatiling nakikita matapos ang pangitain
  choice: wala silang nakitang sinuman kundi si Jesus lamang
  alternative: wala silang nakitang sinuman maliban kay Jesus
  rationale: Pinananatili ng napiling salin ang pinagsamang diin ng εἰ μὴ, αὐτόν, at μόνον nang hindi nagdaragdag ng paliwanag o doktrinal na konklusyon. Ipinakikita lamang ng salaysay na hindi na nakikita sina Moises at Elias at si Jesus na lamang ang nakita nila.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Pinanatili ang kongkretong larawang “iangat ang kanilang mga mata” at ang mariing pagiging bukod-tangi ni Jesus nang hindi gumagamit ng asiwa o sobrang literal na parirala.
