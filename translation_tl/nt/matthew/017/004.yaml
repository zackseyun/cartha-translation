id: MAT.17.4
reference: Matthew 17:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: tl
  text: 'Sumagot naman si Pedro at sinabi kay Jesus, “Panginoon, mabuti na narito tayo. Kung nais mo, magtatayo ako rito ng tatlong kubol[a]: isa para sa iyo, isa para kay Moises, at isa para kay Elias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tolda,” “mga silungan,” o “mga tabernakulo.”
    reason: Ipinapakita ang saklaw ng kahulugan ng Griyegong σκηνάς at pinananatili ang posibleng kaugnayan sa mga kubol o tabernakulo nang hindi ito tiyak na ipinapakahulugan sa pangunahing teksto.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Sumagot naman ... at sinabi
  rationale: Pinananatili ang karaniwang pormula sa salaysay na ‘sumagot at sinabi.’ Ang ‘naman’ ay likas na panandang pandiskurso para sa δέ rito, na nagpapatuloy sa salaysay sa halip na magpahiwatig ng mariing pagsalungat.
- source_word: Κύριε
  choice: Panginoon
  rationale: Karaniwang salin ito ng κύριος at pinananatili ang magalang na pagtawag at ang posibleng teolohikal na bigat ng titulo.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: mabuti na narito tayo
  rationale: Likas at malinaw na Filipino ito para sa Griyegong konstruksiyong infinitibo, nang hindi dinaragdagan ang kahulugan.
- source_word: εἰ θέλεις
  choice: Kung nais mo
  rationale: Sinasaklaw ng ‘nais’ ang kahulugang pagnanais o pagkukusa ng θέλω at angkop sa magalang na tuwirang pakikipag-usap kay Jesus.
- source_word: ποιήσω
  choice: magtatayo ako
  rationale: Bagaman malawak ang literal na kahulugang ‘gagawa ako,’ mas likas ang ‘magtatayo’ sa Filipino para sa paggawa ng pansamantalang mga kubol; pinananatili rin ang unang panauhang isahan ng pandiwa.
- source_word: σκηνάς
  choice: mga kubol
  rationale: Ang ‘kubol’ ay tumutukoy sa pansamantalang tirahan o silungan at mas kongkreto sa kontekstong ito kaysa ‘silungan,’ habang hindi tahasang ipinapalagay na ang tinutukoy ay ang Pista ng mga Kubol.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: isa para sa iyo, isa para kay Moises, at isa para kay Elias
  rationale: Inuulit ang ‘isa’ para sa bawat tao upang mapanatili ang distributibong diin ng Griyego.
- source_word: ὧδε
  choice: narito ... rito
  rationale: Kapuwa isinasalin ang dalawang paglitaw ng ὧδε. Ginamit ang natural na anyong ‘narito’ sa unang sugnay at ‘rito’ sa ikalawa.
theological_decisions:
- issue: Ang titulo na κύριος bilang tawag kay Jesus
  choice: Panginoon
  alternative: Guro
  rationale: Pinananatili ng ‘Panginoon’ ang karaniwang kahulugan ng titulo at ang posibleng teolohikal na bigat nito; hindi ito nililimitahan sa kahulugan lamang na guro o pinuno.
- issue: Ang kahulugan ng σκηνάς sa salaysay ng pagbabagong-anyo
  choice: mga kubol
  alternative: mga tolda; mga silungan; mga tabernakulo
  rationale: Hindi tahasang iniuugnay ng talata ang mga istruktura sa isang pista. Kaya gumamit ng karaniwang salitang tumutukoy sa pansamantalang istruktura at inilagay sa talababa ang ibang posibleng salin upang mapanatili ang posibleng alusyong pangkapistahan nang hindi ito ipinipilit sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang ‘sumagot ... at sinabi’ dahil may kapansin-pansing anyong pampanitikan ito sa Griyego, ngunit ginawang likas ang ayos ng pangungusap. Ginamit ang mga pangalang ‘Moises’ at ‘Elias’ ayon sa nakasanayang anyong Filipino.
