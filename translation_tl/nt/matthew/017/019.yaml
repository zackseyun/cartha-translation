  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: tl
  text: Pagkatapos, lumapit nang sarilinan kay Jesus ang mga alagad at sinabi, “Bakit hindi namin iyon[a] kayang palayasin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “siya,” kung ang panghalip ay tumutukoy sa batang lalaki sa halip na sa demonyo.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa kasunod na pangyayari; natural ito sa makabagong Tagalog.
- source_word: προσελθόντες
  choice: lumapit
  rationale: Ang aorist participle ay likas na maisasalin bilang pandiwang kasama ng pangunahing kilos; malinaw na tumutukoy sa paglapit ng mga alagad kay Jesus.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Karaniwan at kinikilalang salin ng μαθηταί sa konteksto ng Ebanghelyo.
- source_word: τῷ Ἰησοῦ
  choice: kay Jesus
  rationale: Likas na Tagalog para sa dative na layon ng προσέρχομαι; ginagamit ang karaniwang anyo ng pangalan.
- source_word: κατ’ ἰδίαν
  choice: nang sarilinan
  rationale: Ipinahahayag ang pribadong kalagayan ng pag-uusap nang natural at marangal.
- source_word: εἶπον
  choice: sinabi
  rationale: Pinananatili ang payak na kahulugan ng λέγω, kahit tanong ang kasunod na pananalita.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Direkta at likas na pananalitang Tagalog para sa pagtatanong ng dahilan.
- source_word: ἡμεῖς
  choice: namin
  rationale: Ang tahasang panghalip sa Griyego ay naipahahayag sa pokus ng tanong; ang eksklusibong 'namin' ay angkop dahil kausap nila si Jesus.
- source_word: οὐκ ἠδυνήθημεν
  choice: hindi ... mapalayas
  rationale: Ang aspektong kakayahan o kawalan nito ay likas na naipahahayag ng ma- na anyo sa Tagalog kasama ng negasyon.
- source_word: ἐκβαλεῖν
  choice: mapalayas
  rationale: Ang 'palayasin' ay natural na terminong Tagalog para sa pagpapaalis o pagtataboy, at ang anyong 'mapalayas' ay kaayon ng δύναμαι.
- source_word: αὐτό
  choice: iyon
  rationale: Ang ουδέτερο na panghalip ay malamang na tumutukoy sa demonyo; ang 'iyon' ay hindi nagtatakda ng kasarian at pinananatili ang posibleng kalabuan ng reperente.
theological_decisions:
- issue: Reperente ng αὐτό sa konteksto ng pagpapalayas
  choice: Ginamit ang walang-kasariang “iyon,” na malamang na tumutukoy sa demonyo.
  alternative: Maaaring tumukoy ang panghalip sa batang lalaki, kaya maaaring unawain bilang “siya.”
  rationale: Sa agarang konteksto, ang kabiguan ng mga alagad ay ang pagpapalayas sa demonyo, ngunit hindi sapilitang nilulutas ng Tagalog na 'iyon' ang tunay na kalabuan ng Griyegong panghalip; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinili ang “nang sarilinan” para sa natural na pribadong tagpo at “mapalayas” para sa karaniwang wika ng pagpapaalis ng demonyo. Ang talababa [a] ay nakalagay mismo pagkatapos ng panghalip na may alternatibong reperente.
