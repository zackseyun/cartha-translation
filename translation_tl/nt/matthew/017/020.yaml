id: MAT.17.20
reference: Matthew 17:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: tl
  text: 'Sinabi niya sa kanila, “Dahil sa maliit ninyong pananampalataya.[a] Sapagkat sinasabi ko sa inyo ang totoo: kung mayroon kayong pananampalatayang gaya ng isang butil ng mustasa,[b] sasabihin ninyo sa bundok na ito, ‘Lumipat ka mula rito papunta roon,’ at lilipat ito. Walang magiging imposible para sa inyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Dahil sa kakulangan ng inyong pananampalataya.” Ang salitang Griyego ay tumutukoy sa salat o maliit na pananampalataya, hindi sa ganap na kawalan ng pananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “pananampalatayang gaya ng isang butil ng mustasa.” Ang paghahambing ay sa isang bagay na napakaliit.
    reason: lexical_clarification
lexical_decisions:
- source_word: λέγει
  choice: Sinabi niya
  rationale: Bagaman pangkasalukuyan ang anyong Griyego bilang historical present, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaan na “sinabi,” nang hindi binabago ang pangyayari.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Dahil maliit ang inyong pananampalataya
  rationale: Ipinahahayag ng ὀλιγοπιστία ang kulang o mahinang pananampalataya, hindi ang lubos na kawalan nito. Pinananatili ng “maliit” ang larawan at paulit-ulit na diwa ng salita sa Mateo.
- source_word: ἀμὴν γὰρ λέγω ὑμῖν
  choice: Sapagkat sinasabi ko sa inyo ang totoo
  rationale: Ginagawang natural sa Tagalog ang solemneng panimulang ἀμήν habang pinananatili ang diin at ang ugnayang ipinahihiwatig ng γάρ.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Sa kontekstong ito, tumutukoy ito sa pagtitiwala sa kapangyarihan ng Diyos; “pananampalataya” ang karaniwan at marangal na katumbas nang hindi nililimitahan ang kahulugan sa isang denominasyonal na pagbasa.
- source_word: ὡς κόκκον σινάπεως
  choice: gaya ng isang butil ng mustasa
  rationale: Pinananatili nito ang anyong paghahambing sa Griyego at hindi tahasang idinaragdag sa teksto ang “kasingliit,” bagaman iyon ang malinaw na ipinahihiwatig sa konteksto.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Lumipat ka mula rito papunta roon
  rationale: Ang “lumipat” ay natural na utos sa isang bundok at tumpak na naghahayag ng pagbabago ng kinalalagyan.
- source_word: μεταβήσεται
  choice: lilipat ito
  rationale: 'Intransitibo ang pandiwa rito: ang bundok ang lilipat, kaya hindi ito isinaling pasibo.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: Walang magiging imposible para sa inyo
  rationale: Ito ang malinaw at natural na katumbas sa Tagalog ng idyomang Griyego, habang pinananatili ang malawak at mariing pahayag.
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng himala
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang konteksto ay tungkol sa salat na pagtitiwala ng mga alagad sa kapangyarihan ng Diyos, ngunit hindi nililinaw ng teksto ang isang sistematikong doktrina ng pananampalataya. Pinananatili ng “pananampalataya” ang karaniwang terminong biblikal nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Saklaw ng pangakong “walang magiging imposible”
  choice: panatilihin ang malawak na pahayag ng teksto
  alternative: limitahan ito nang tahasan sa paggawa ng mga himala o sa kalooban ng Diyos
  rationale: Hindi naglalagay ang talata mismo ng tahasang panaklong o kwalipikasyon. Kaya hindi nagdagdag ang salin ng paliwanag na maaaring makapagpaliit o makapagpalawak sa pahayag ni Jesus.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na pangnagdaan sa salaysay, habang nananatiling pangkasalukuyan ang tuwirang pananalita ni Jesus. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
