revisions:
- from: Ngunit upang hindi natin sila mabigyan ng ikagagalit[a], pumunta ka sa dagat, maghulog ka ng kawil, at kunin mo ang unang isdang iahon mo. Pagkabukas mo sa bibig nito, makakakita ka ng isang stater[b]. Kunin mo iyon at ibigay sa kanila para sa akin at sa iyo.
  to: Ngunit upang hindi natin sila mabigyan ng dahilan para magalit[a], pumunta ka sa dagat, maghulog ka ng kawil, at kunin mo ang unang isdang iahon mo. Pagkabukas mo ng bibig nito, matatagpuan mo ang isang stater[b]. Kunin mo iyon at ibigay sa kanila para sa akin at sa iyo.
  rationale: Itinuwid ang maling konstruksyong Tagalog sa pariralang tungkol sa pagbukas ng bibig ng isda at pinalitan ang “makakakita” ng “matatagpuan” upang tumpak na maipahayag ang εὑρήσεις. Pinakinis din ang pangunahing salin ng σκανδαλίσωμεν upang maging natural sa modernong Tagalog at manatiling kontekstuwal, habang iniingatan sa talababa ang mas literal na alternatibo. Walang idinagdag na doktrinal na pagpapakahulugan.
