  source_fidelity: Tumpak sa kabuuan ang pagkakasunod ng mga utos at ang saklaw ng bayad para kay Jesus at Pedro. Gayunman, ang “makakakita ka” ay mas tumutukoy sa pagkakita kaysa εὑρήσεις (“matatagpuan mo”), at may mali sa balangkas na “Pagkabukas mo sa bibig nito.”
  naturalness: Ang “Pagkabukas mo sa bibig nito” ay hindi likas at hindi wastong pagkakabuo sa modernong Tagalog; kailangan ang “Pagkabukas mo ng bibig nito.” Mas natural din ang “mabigyan ng dahilan para magalit” para sa pragmatikong diwa ng σκανδαλίσωμεν sa kontekstong ito.
  terminology: Ang “dagat,” “kawil,” at “stater” ay angkop. Pinananatili ang “stater” at ang paliwanag nito sa talababa. Ang alternatibong “matitisod” ay maayos bilang lexical na tala, ngunit ang pangunahing teksto ay hindi dapat magpahiwatig nang walang kinakailangang sanhi ng moral na pagkatisod.
  issues:
  - severity: medium
    issue: 'Hindi wastong parirala: “Pagkabukas mo sa bibig nito.”'
    rationale: 'Ang pandiwang “buksan” sa ganitong gamit ay nangangailangan ng tuwirang layon na may “ng”: “Pagkabukas mo ng bibig nito.”'
  - severity: low
    issue: “Makakakita ka” para sa εὑρήσεις.
    rationale: Ang εὑρήσεις ay “matatagpuan mo”/“makasusumpong ka,” hindi lamang “makakakita ka.” Ang rebisyon ay mas tapat sa pandiwa ng pinagmulan.
  - severity: low
    issue: Medyo pilit ang “mabigyan ng ikagagalit.”
    rationale: Bagaman nauunawaan, mas likas ang “mabigyan ng dahilan para magalit,” na pinananatili ang kontekstuwal na kahulugan ng pag-iwas sa di-kinakailangang pagkakasala o offense.
