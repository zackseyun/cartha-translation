id: MAT.17.27
reference: Matthew 17:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: tl
  text: Ngunit upang hindi natin sila mabigyan ng dahilan para magalit[a], pumunta ka sa dagat, maghulog ka ng kawil, at kunin mo ang unang isdang iahon mo. Pagkabukas mo ng bibig nito, matatagpuan mo ang isang stater[b]. Kunin mo iyon at ibigay sa kanila para sa akin at sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang hindi sila matisod dahil sa atin” o “upang hindi natin sila mabigyan ng ikatitisod.”
    reason: lexical_alternative
  - marker: b
    text: Ang stater ay isang baryang nagkakahalaga ng humigit-kumulang apat na drachma, sapat na pambayad ng buwis sa templo para sa dalawang tao.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: mabigyan ng ikagagalit
  rationale: Sa kontekstong ito, tumutukoy ito sa pag-iwas na makapagbigay ng di-kinakailangang sanhi ng pagkagalit o pagkatisod sa mga naniningil. Likas sa modernong Tagalog ang parirala, habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: θάλασσαν
  choice: dagat
  rationale: Pinananatili ang tawag ng Griyego na θάλασσα, bagaman ang tinutukoy ay ang Dagat ng Galilea, na isang lawa ayon sa heograpiya.
- source_word: ἄγκιστρον
  choice: kawil
  rationale: Ang “kawil” ang tuwirang tawag sa fishhook at malinaw sa konteksto ng pangingisda.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: ang unang isdang iahon mo
  rationale: Natural nitong ipinahahayag ang unang isdang aangat mula sa tubig dahil sa kawil, nang hindi inuulit nang alanganin ang diwa ng “una.”
- source_word: ἆρον
  choice: kunin mo
  rationale: Sa pagkakasunod-sunod ng mga utos, ang pandiwa ay tumutukoy sa pagkuha sa isdang naiahon; malinaw at likas dito ang “kunin mo.”
- source_word: στατῆρα
  choice: isang stater
  rationale: Pinananatili ang tiyak na pangalan ng baryang nasa Griyego; ipinaliliwanag sa talababa ang halaga nito.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: para sa akin at sa iyo
  rationale: Ipinahahayag ng ἀντί dito na sasaklawin ng barya ang bayad para sa dalawang tao. Ang saling ito ay natural at hindi nagdaragdag ng doktrinal na pagpapakahulugan.
- source_word: πορευθεὶς
  choice: pumunta ka
  rationale: Ang participle ay nagpapakilala ng kilos na gagawin bago ang kasunod na mga utos; natural itong isinasalin bilang tuwirang utos sa Tagalog.
- source_word: δὸς αὐτοῖς
  choice: ibigay sa kanila
  rationale: Ang tinutukoy na ibibigay ay ang baryang kababanggit lamang, at malinaw sa konteksto na ito ang pambayad.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζω kaugnay ng pagbabayad ni Jesus ng buwis sa templo
  choice: Nag-utos si Jesus na magbayad upang hindi sila mabigyan ng ikagagalit, nang hindi binabawi ang naunang pahayag na malaya ang mga anak.
  alternative: Maaaring unawain na lubos na obligado si Jesus sa buwis, o na ang pagbabayad ay para lamang magpakita ng himala.
  rationale: Itinatakda ng Mateo 17:24–26 ang kalayaan ng mga anak, samantalang idinaragdag ng talatang ito ang praktikal na layuning huwag silang mabigyan ng ikagagalit. Pinananatili ng salin ang tensiyong ito at hindi nagpapasok ng mas malawak na doktrinal na konklusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “dagat” at “stater” bilang mga terminong malapit sa Griyego, na may paliwanag para sa di-pamilyar na barya. Iniwasan ang sobrang literal ngunit alanganing ayos ng mga participle.
