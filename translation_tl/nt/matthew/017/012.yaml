source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: tl
  text: 'Ngunit sinasabi ko sa inyo: dumating na si Elias, at hindi nila siya nakilala[a]. Ngunit ginawa nila sa kanya ang lahat ng nais nila[b]. Gayundin, ang Anak ng Tao ay malapit nang magdusa[c] sa kanilang mga kamay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nila siya kinilala.” Maaaring tumukoy ang Griyego sa kabiguang makilala o matukoy nang wasto ang isang tao, o kilalanin siya ayon sa kaniyang pagkakakilanlan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ginawa nila laban sa kanya ang anumang nais nila” o “trinato nila siya ayon sa kanilang kagustuhan.” Idyomatiko ang pananalitang Griyego at nagpapahiwatig ng malayang pagkilos sa kanya ayon sa kanilang nais.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ay magdurusa” o “ay magdurusa na.” Ipinahihiwatig ng Griyego na nalalapit ang pagdurusa ng Anak ng Tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Natural na panimula ng tuwirang pahayag sa modernong Tagalog; pinananatili ng “Ngunit” ang pagsalungat ng δέ sa naunang inaasahan.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: dumating na si Elias
  rationale: Ipinahahayag ng “na” ang natapos nang pagdating na may kaugnayan sa kasalukuyang usapan; “Elias” ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: hindi nila siya nakilala
  rationale: Sa konteksto, ang ἐπιγινώσκω ay kabiguang makilala o matukoy ang kaniyang papel, hindi lamang kawalan ng personal na pagkakakilala.
- source_word: ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: Sa halip, ginawa nila sa kanya ang anumang gusto nila
  rationale: Natural na inililipat ang idyomang ποιέω ἐν bilang pagkilos na ginawa sa isang tao; pinananatili ng “anumang gusto nila” ang di-nililimitahang pagkilos ayon sa kanilang kagustuhan.
- source_word: οὕτως καὶ
  choice: Gayundin
  rationale: Malinaw at likas na naghahayag ng paghahambing sa sinapit ni Elias at sa sasapitin ng Anak ng Tao.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Nakaugaliang salin ng titulo na nagpapanatili sa biblikal at Danielikong alingawngaw nito.
- source_word: μέλλει πάσχειν
  choice: ay malapit nang magdusa
  rationale: Pinananatili ang diwa ng nalalapit na pagdurusa nang hindi nagdaragdag ng mas matibay na pahayag tungkol sa itinakdang kapalaran.
- source_word: ὑπ’ αὐτῶν
  choice: sa kanilang mga kamay
  rationale: Likas na idyoma sa Tagalog para sa mapanakit na ahensiya ng mga taong tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ng dumating na Elias
  choice: Pinanatili ang pangalang “Elias” nang hindi tuwirang idinagdag na siya ay si Juan na Tagapagbautismo.
  alternative: Maaaring ipaliwanag sa salin na tumutukoy ito kay Juan na Tagapagbautismo.
  rationale: Nililinaw ng kasunod na konteksto ang tinutukoy, ngunit Elias lamang ang tahasang pinangalanan sa talatang ito; hindi dapat ipasok sa pangunahing teksto ang paliwanag.
- issue: Lakas ng μέλλει kaugnay ng pagdurusa ng Anak ng Tao
  choice: “ay malapit nang magdusa”
  alternative: “ay magdurusa” o “nakatakdang magdusa”
  rationale: Ipinahahayag ng Griyego ang nalalapit na pangyayari, ngunit hindi tahasang gumagamit rito ng pormula ng banal na pangangailangan o kapalaran.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kanya” ayon sa kasalukuyang karaniwang baybay, at pinanatili ang tradisyonal na titulong “Anak ng Tao.” Ang ayos ng mga footnote marker ay itinugma sa mismong pariralang kanilang ipinapaliwanag.
