  - severity: low
    issue: Medyo di-karaniwan ang ayos na “sinabi sa kanila ni Jesus.”
    rationale: Wasto ito sa balarila, ngunit mas natural at malinaw sa modernong Filipino ang “Sinabi ni Jesus sa kanila.”
