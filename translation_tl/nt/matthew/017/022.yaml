  rationale: Inayos ang ayos ng pangunahing pangungusap para sa mas likas na Filipino at pinalitan ang hindi angkop na alternatibong “ipasa” ng “isusuko.” Hindi binago ang kahulugan, ang pasibong diwa, o ang sinadyang kalabuan ng παραδίδοσθαι.
