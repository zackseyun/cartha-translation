  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: tl
  text: Habang nagkakatipon sila sa Galilea,[a] sinabi ni Jesus sa kanila, “Ang Anak ng Tao ay malapit nang ibigay[b] sa mga kamay ng mga tao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Habang magkakasama sila sa Galilea.”
    reason: lexical_alternative
  - marker: b
    text: O “isusuko”; maaari ring unawain bilang “ipagkakanulo,” ngunit mas tiyak ang huling salitang iyon kaysa sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: nagkakatipon
  rationale: Ipinahihiwatig ng pandiwaring ito na ang pangkat ay nagtitipon o magkakasama. Pinananatili ng “nagkakatipon” ang kolektibong diwa nang hindi nagdaragdag ng tiyak na kilos o paglalakbay.
- source_word: δὲ
  choice: Habang
  rationale: Sa kayariang genitive absolute, likas na inuugnay ng “Habang” ang kalagayan ng mga alagad sa sinabi ni Jesus; hindi kailangang isalin nang hiwalay ang δέ.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: sa Galilea
  rationale: Tuwirang salin ng pariralang tumutukoy sa lugar.
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila
  rationale: Karaniwan at malinaw na salin ng λέγω na may di-tuwirang layon.
- source_word: Μέλλει
  choice: malapit nang
  rationale: Ipinapahayag nito ang nalalapit o nakaambang pangyayari nang hindi ipinapasok ang mas matibay na ideya ng tadhana.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang literal na titulo at ang mga ugnayang pampanitikan at teolohikal nito.
- source_word: παραδίδοσθαι
  choice: ibigay
  rationale: Pinananatili ang balintiyak na diwa ng pagbibigay o pagsasalin sa kapangyarihan ng iba, nang hindi ito agad nililimitahan sa pagkakanulo ni Judas.
- source_word: εἰς χεῖρας
  choice: sa mga kamay ng
  rationale: Pinananatili ang malinaw at likas ding metapora sa Filipino, sa halip na ipaliwanag bilang “sa kapangyarihan ng.”
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy rito sa mga taong tatanggap ng Anak ng Tao; ang “mga tao” ay likas, tumpak, at hindi nagpapalagay na kalalakihan lamang ang tinutukoy.
theological_decisions:
- issue: Pagsasalin sa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ang Anak ng Tao
  alternative: Ang Taong Anak / Ang Makataong Isa
  rationale: Ang “Anak ng Tao” ang pinakapormal at nakaugaliang salin na nagpapanatili sa natatanging katawagan ni Jesus at sa alusyong biblikal nito; ang mga alternatibo ay mas mapagpaliwanag at maaaring magpahina sa resonansiyang iyon.
- issue: Diwa ng παραδίδοσθαι sa pahayag tungkol sa pagdurusa
  choice: ibigay
  alternative: ipasa / ipagkanulo
  rationale: Ang “ibigay” ay nagpapanatili sa balintiyak at sa hindi tahasang tinukoy na tagaganap. Hindi nito ipinapasiya kung ang diin ay nasa pagkakanulo, pag-aresto, paglilipat sa awtoridad, o mas malawak na teolohikal na pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagkakatipon” para sa kolektibong kalagayan ng pangkat, “malapit nang” para sa nalalapit na pangyayari, at “mga tao” bilang likas na salin ng pangkalahatang ἀνθρώπων. Ang mga talababa ay nag-iingat sa leksikal na lawak nang hindi binibigatan ang pangunahing teksto.
