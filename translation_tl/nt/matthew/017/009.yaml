reference: Matthew 17:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: tl
  text: Habang bumababa sila mula sa bundok, inutusan sila ni Jesus, “Huwag ninyong sabihin kaninuman ang pangitain[a] hanggang sa ibangon ang Anak ng Tao mula sa mga patay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nakita ninyo.” Ang literal na salita sa Griyego ay “ang pangitain.”
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “mula sa gitna ng mga patay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Habang bumababa sila mula sa bundok
  rationale: Ipinahihiwatig ng genitive absolute at present participle ang kilos na kasabay at nagpapatuloy; natural itong naihahayag ng “habang bumababa sila.” Pinananatili rin ng “mula sa bundok” ang tiyak na bundok na nabanggit sa salaysay.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: iniutos sa kanila ni Jesus
  rationale: Malakas na tagubilin o utos ang diwa ng ἐνετείλατο. Sa natural na Filipino, sapat nang ipakilala ng tutuldok at tuwirang sipi ang nilalaman ng λέγων, nang hindi gumagamit ng alanganing “na sinasabi.”
- source_word: Μηδενὶ εἴπητε
  choice: Huwag ninyong sabihin kaninuman
  rationale: Malinaw at natural na pagbabawal ito sa Filipino at pinananatili ang saklaw ng μηδενί—walang sinumang dapat pagsabihan.
- source_word: τὸ ὅραμα
  choice: ang pangitain
  rationale: Tuwirang katumbas ang “pangitain” na nagpapanatili sa posibleng mapaghayag o sobrenatural na himig ng ὅραμα, sa halip na agad itong gawing simpleng “ang nakita ninyo.”
- source_word: ἕως οὗ
  choice: hanggang sa
  rationale: Natural at tumpak itong naghahayag ng hangganan sa panahon ng ipinagbabawal na pagsasabi.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang titulo at pagpapakilala ni Jesus sa sarili, kasama ang biblikal at teolohikal na mga alingawngaw nito, nang hindi ito ipinapaliwanag sa paraphrase.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Karaniwan at malinaw na pananalita ito para sa pagkabuhay na muli, habang pinananatili ang larawan ng paglabas mula sa kalagayan o kapulungan ng mga patay.
- source_word: ἐγερθῇ
  choice: ibangon
  rationale: Pinananatili ng anyong balintiyak ang gramatikal na tinig ng Griyego at hindi tahasang pinapangalanan ang kumikilos, gaya rin ng pinagmulan.
theological_decisions:
- issue: Pananalita at tinig tungkol sa pagkabuhay na muli
  choice: ibangon mula sa mga patay
  alternative: bumangon mula sa mga patay; muling buhayin
  rationale: Balintiyak ang ἐγερθῇ. Pinananatili ng “ibangon” ang tinig na ito at ang pahiwatig ng pagkilos ng Diyos nang hindi tahasang dinaragdagan ang sinabi ng talata. Hindi rin nito pinapawi ang teolohikal na tensiyon sa pagitan ng banal na pagkilos at ng pagkabuhay ng Anak ng Tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tradisyonal ngunit nauunawaang “Anak ng Tao” at ang natural na ayos ng pangungusap sa Filipino. Ang mga panandang talababa ay inilagay mismo sa mga salitang tinutukoy ng bawat tala.
