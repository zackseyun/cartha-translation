id: MAT.17.1
reference: Matthew 17:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: tl
  text: Pagkaraan ng anim na araw, isinama ni Jesus sina Pedro, Santiago, at ang kapatid ni Santiago na si Juan, at pinangunahan niya silang umahon sa isang mataas na bundok nang sila-sila lamang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Pagkaraan ng anim na araw
  rationale: Malapit ito sa temporal na idyoma ng Griyego at malinaw na iniuugnay ang salaysay sa naunang pangyayari.
- source_word: παραλαμβάνει
  choice: isinama
  rationale: Ang παραλαμβάνω ay pagkuha o pagsama sa isang tao. Likas sa Tagalog ang “isinama” at ipinahihiwatig nitong kasama ni Jesus ang tatlong alagad.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pedro, Santiago, at Juan
  rationale: Ginamit ang karaniwang anyo ng mga pangalang ito sa Bibliyang Tagalog.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ang kapatid nitong si Juan
  rationale: Sa ayos ng Griyego, si Juan ang tinutukoy na kapatid, at ang pinakamalapit at likas na pinatutungkulan ng αὐτοῦ ay si Santiago. Ang “nitong” ay nag-uugnay kay Juan kay Santiago nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ἀναφέρει αὐτοὺς
  choice: Dinala niya sila paakyat
  rationale: Ipinahahayag ng ἀναφέρω rito ang pagdadala pataas. Ang “dinala ... paakyat” ay malinaw at likas sa konteksto ng pag-akyat sa bundok.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: sa isang mataas na bundok
  rationale: Likas na ipinahahayag nito sa Tagalog ang patutunguhan ng pag-akyat.
- source_word: κατ’ ἰδίαν
  choice: bukod sa iba
  rationale: Ipinakikita ng parirala na si Jesus at ang tatlong alagad ay humiwalay sa ibang mga tao. Mas malinaw ito kaysa sa “nang sarilinan,” na maaaring magpahiwatig na nag-iisa ang bawat isa.
theological_decisions:
- issue: Mga pandiwang historical present sa pagsasalaysay
  choice: 'Ginamit ang aspektong naganap: “isinama” at “dinala.”'
  alternative: 'Panatilihin ang anyong pangkasalukuyan: “isinasama” at “dinadala.”'
  rationale: Bagaman nasa present tense ang παραλαμβάνει at ἀναφέρει para sa masiglang pagsasalaysay, karaniwang isinasalaysay sa modernong Tagalog ang magkakasunod na naganap na pangyayari sa aspektong perpektibo. Pinananatili nito ang tungkuling pasalaysay nang hindi nagmumukhang kasalukuyang nagaganap ang tagpo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na sugnay, habang pinananatili ang pagkakasunod at ugnayan ng mga kilos sa Griyego.
