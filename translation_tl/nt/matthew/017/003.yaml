  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: tl
  text: At narito[a], nagpakita sa kanila sina Moises at Elias, at nakikipag-usap sila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Masdan.” Ang Griyegong pandiwa ay pormal na pasibo; maaari ring isalin: “nakita nila sina Moises at Elias.”'
    reason: Pinananatili ang alternatibong puwersa ng ἰδού at itinatala ang pormal na pasibong anyo ng ὤφθη.
lexical_decisions:
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang tungkulin nitong pukawin ang pansin at idiin ang bigla at kapansin-pansing pangyayari, sa isang marangal ngunit nauunawaang salitang Filipino.
- source_word: ὤφθη
  choice: nagpakita
  rationale: Likas na salin sa Filipino ng anyong pasibo na ginagamit sa diwang 'lumitaw' o 'nakita.' Ipinahihiwatig nito ang nakikitang pagpapakita nang hindi ipinapaliwanag ang paraan nito.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinakikilala ang mga nakasaksi sa pagpapakita at hindi dinaragdagan ng interpretasyon.
- source_word: Μωϋσῆς
  choice: Moises
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: Ἠλίας
  choice: Elias
  rationale: Karaniwang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: συλλαλοῦντες
  choice: nakikipag-usap
  rationale: Ipinapahayag ang katumbasang kilos ng pag-uusap; mas natural ito kaysa sa mas pormal na 'nakikipagtalastasan.'
- source_word: μετ’ αὐτοῦ
  choice: sa kanya
  rationale: Natural na Filipino para sa pakikisama sa kilos; pinananatili ang panghalip ng Griyego sa halip na palitan ito ng pangalang Jesus.
theological_decisions:
- issue: Tinutukoy ng αὐτοῦ
  choice: Pinanatili ang 'kanya,' na tumutukoy kay Jesus ayon sa konteksto.
  alternative: Palitan ang panghalip ng 'Jesus.'
  rationale: Malinaw sa salaysay na si Jesus ang tinutukoy, ngunit ang pagpapanatili sa panghalip ay mas malapit sa Griyego at hindi kailangan ng pagpapaliwanag sa mismong teksto.
- issue: Kalikasan ng pagpapakita nina Moises at Elias
  choice: Isinalin bilang 'nagpakita sa kanila.'
  alternative: Isalin bilang 'nakita nila' o 'nakita nila roon.'
  rationale: Pinananatili nito ang salaysay tungkol sa isang nakikitang pagpapakita nang hindi nagdaragdag ng doktrina tungkol sa paraan o kalikasan ng kanilang presensya.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang 'masdan' upang mapanatili ang pantawag-pansing ἰδού; bahagya itong pormal ngunit malinaw. Ang 'nakikipag-usap' ay pangkaraniwan at angkop sa kasalukuyang gamit.
