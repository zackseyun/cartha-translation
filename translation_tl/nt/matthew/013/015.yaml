revisions:
- from: Sapagkat naging manhid ang puso ng bayang ito, at hirap silang makarinig, at ipinikit nila ang kanilang mga mata, upang hindi sila makakita sa pamamagitan ng kanilang mga mata, makarinig sa pamamagitan ng kanilang mga tainga, makaunawa sa kanilang puso, at manumbalik[b][c], at pagagalingin ko sila.
  to: Sapagkat naging manhid ang puso ng bayang ito, at hirap silang makarinig, at ipinikit nila ang kanilang mga mata, upang hindi sila makakita sa kanilang mga mata, makarinig sa kanilang mga tainga, makaunawa sa kanilang puso, at manumbalik[b][c], at pagagalingin ko sila.
  rationale: Ginawa lamang ang ligtas na estilistikong pagbabago sa dalawang instrumental na parirala. Pinananatili ng “upang hindi” ang hindi nilulutas na puwersa ng μήποτε, at hindi binago ang pagkakasunod ng mga pandiwa, ang aktibong pagpikit ng mga tao, o ang panghinaharap na “pagagalingin ko sila.”
