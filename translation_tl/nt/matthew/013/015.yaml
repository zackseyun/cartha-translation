id: MAT.13.15
reference: Matthew 13:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: tl
  text: Sapagkat naging manhid ang puso ng bayang ito, at hirap silang makarinig, at ipinikit nila ang kanilang mga mata, upang hindi sila makakita sa kanilang mga mata, makarinig sa kanilang mga tainga, makaunawa sa kanilang puso, at manumbalik[b][c], at pagagalingin ko sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring isaling “bumaling” o “bumalik.”
    reason: lexical_alternative
  - marker: c
    text: Sipi mula sa Isaias 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: naging manhid
  rationale: Ang literal na diwa ay ‘kumapal/tumaba,’ ngunit kapag iniuugnay sa puso ay tumutukoy sa pagkawala ng pakiramdam o pagiging mapurol. Ang ‘naging manhid’ ay natural sa Filipino at pinananatili ang larawang moral at espirituwal.
- source_word: καρδία
  choice: puso
  rationale: Karaniwang salin para sa kaloob-looban ng tao at dito ay tahasang inuugnay sa pag-unawa.
- source_word: λαοῦ τούτου
  choice: ng bayang ito
  rationale: Pinananatili ang demonstratibong diin ng τούτου at natural ang ‘bayang ito’ sa makabagong Filipino.
- source_word: βαρέως ἤκουσαν
  choice: hirap silang makarinig
  rationale: Ang literal na ‘mabigat silang nakinig/nakarinig’ ay hindi likas sa Filipino. Ipinahahayag ng salin ang pandinig na mahirap o may pag-aatubili nang hindi dinaragdagan ang kahulugan.
- source_word: ἐκάμμυσαν
  choice: ipinikit nila
  rationale: Ipinakikita ng aktibong pandiwa na sila mismo ang pumikit; pinananatili nito ang kanilang pananagutan.
- source_word: μήποτε
  choice: upang hindi
  rationale: Natural na Filipino para sa negatibong layunin o kinalabasan, habang pinananatili ang tensiyon ng sipi.
- source_word: ἐπιστρέψωσιν
  choice: manumbalik
  rationale: Saklaw nito ang pagbalik o pagbaling pabalik nang hindi ipinapasok ang mas teknikal na pananalitang ‘makumberte.’
- source_word: ἰάσομαι
  choice: pagagalingin ko
  rationale: Tuwirang hinaharap na anyo na tumutugma sa future middle ng Griyego at malinaw na tumutukoy sa Diyos bilang tagapagpagaling.
theological_decisions:
- issue: Ang tensiyon sa sugnay na μήποτε sa pagitan ng paghatol ng Diyos at pananagutan ng tao
  choice: upang hindi sila makakita ... at manumbalik, at pagagalingin ko sila
  alternative: kung hindi, makakakita sila ... manunumbalik, at pagagalingin ko sila
  rationale: Pinananatili ng ‘upang hindi’ ang lantad na puwersa ng μήποτε at hindi nilulutas ang pagtatalo kung ito ay layunin, bunga, o ironikong paglalarawan. Pinananatili rin ang aktibong papel ng mga tao sa pagpikit ng kanilang mga mata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘hirap silang makarinig’ sa halip na literal ngunit di-likas na ‘mabigat silang nakarinig.’ Walang footnote [a] dahil ang ibinigay na Ingles na tala [a] ay tumatalakay sa βαρέως ἤκουσαν, hindi sa salitang minarkahan nito; ang kinakailangang leksikal na linaw ay naipahayag na sa pangunahing teksto.
