revisions:
- from: At ang naihasik sa gitna ng mga tinik—ito ang taong nakikinig sa salita. Ngunit sinasakal ng mga alalahanin sa panahong ito[a] at ng daya ng kayamanan[b] ang salita, kaya hindi siya namumunga.
  to: Ang naihasik sa mga tinik ay ang taong nakikinig sa salita. Ngunit sinasakal ng mga alalahanin ng panahong ito[a] at ng panlilinlang ng kayamanan[b] ang salita, kaya hindi siya namumunga.
  rationale: Inayos ang pambungad upang maging mas likas ang daloy sa Tagalog, ginawang “ng panahong ito” ang ugnayan ng mga alalahanin sa αἰών, at ginamit ang “panlilinlang” upang mas malinaw na maihatid ang ἀπάτη. Pinanatili ang temporal na “panahong ito,” ang personal na “siya,” at ang talinghagang “sinasakal”/“namumunga.”
