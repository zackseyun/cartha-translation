reference: Matthew 13:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: tl
  text: Ang naihasik sa mga tinik ay ang taong nakikinig sa salita. Ngunit sinasakal ng mga alalahanin ng panahong ito[a] at ng panlilinlang ng kayamanan[b] ang salita, kaya hindi siya namumunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga alalahanin ng mundong ito.” Mas literal sa Griyego ang “mga alalahanin ng panahong ito.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ang daya ng kayamanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: ang naihasik sa gitna ng mga tinik
  rationale: Pinananatili ang personal na pagtukoy ng panlalaking isahan na participle habang likas na ipinahahayag sa Tagalog ang larawan ng paghahasik sa gitna ng mga tinik.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ang taong nakikinig sa salita
  rationale: Nililinaw ng “taong” ang personal na tinutukoy sa paliwanag ng talinghaga; ang “nakikinig” ay natural na katumbas ng kasalukuyang participle, at pinananatili ang “salita” para sa λόγος.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: mga alalahanin sa panahong ito
  rationale: Ipinahahayag ng “mga alalahanin” ang negatibong diwa ng μέριμνα, samantalang pinananatili ng “panahong ito” ang temporal at moral na diwa ng αἰών sa halip na agad itong gawing “mundo.”
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: ang daya ng kayamanan
  rationale: Ang “daya” ay maikli at malinaw na nagpapahayag sa mapanlinlang na katangian ng kayamanan na nasa genitibong parirala.
- source_word: συμπνίγει
  choice: sinasakal
  rationale: Pinananatili ang matingkad na larawang agrikultural ng mga tinik na sumasakal sa tumutubong halaman; ang anyong pangkasalukuyan ay angkop sa kilos na inilalarawan.
- source_word: ἄκαρπος γίνεται
  choice: kaya hindi siya namumunga
  rationale: Natural sa Tagalog ang positibong larawang “namumunga” na may pagtanggi, at pinananatili ng “siya” ang personal na tinutukoy sa paliwanag.
theological_decisions:
- issue: Pagpapakahulugan sa αἰών
  choice: panahong ito
  alternative: mundong ito
  rationale: Karaniwang tumutukoy ang αἰών sa isang panahon o kapanahunan. Pinananatili ng pangunahing salin ang aspektong ito nang hindi inaalis ang posibleng kontekstuwal na diwang “mundo,” na inilagay sa talababa.
- issue: Personal o di-personal na tinutukoy sa huling sugnay
  choice: hindi siya namumunga
  alternative: hindi ito namumunga
  rationale: Bagaman nagsimula ang larawan sa bagay na naihasik, tahasang kinikilala ng paliwanag ang tinutukoy bilang taong nakikinig. Kaya ang personal na panghalip ay umiiwas sa pahiwatig na ang salita mismo ang likas na walang bunga.
- issue: Kaugnayan ng mga alalahanin at kayamanan sa pagsakal sa salita
  choice: kapuwa inilalarawan bilang sumasakal sa salita
  alternative: ang mga tinik lamang ang tuwirang sumasakal
  rationale: Ang dalawang simuno sa Griyego—ang alalahanin at ang daya ng kayamanan—ang tuwirang gumaganap sa συμπνίγει, kaya malinaw itong pinanatili nang hindi dinaragdagan ang teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinasakal” upang mapanatili ang talinghagang agrikultural, at hinati sa dalawang pangungusap upang maging madaling basahin nang hindi binabago ang lohikal na daloy.
