id: MAT.13.12
reference: Matthew 13:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: tl
  text: Sapagkat ang sinumang mayroon[a] ay bibigyan pa, at magkakaroon siya ng kasaganaan; ngunit ang sinumang wala, maging ang nasa kanya ay kukunin sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ay bibigyan, at sasagana siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ang sinumang
  rationale: Ipinahahayag ng di-tiyak na panghalip na ito ang isang pangkalahatang simulaing tumutukoy sa bawat taong saklaw nito.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: ἔχει / οὐκ ἔχει
  choice: mayroon / wala
  rationale: Likas at tuwirang katumbas sa Tagalog; gaya sa Griyego, hindi tinutukoy ang bagay na mayroon o wala.
- source_word: δοθήσεται αὐτῷ
  choice: ay bibigyan pa
  rationale: Ang balintiyak na pandiwa ay nangangahulugang bibigyan siya; ipinahihiwatig ng “pa” ang karagdagang kaloob na pinagtitibay ng kasunod na περισσευθήσεται.
- source_word: περισσευθήσεται
  choice: magkakaroon siya ng kasaganaan
  rationale: Inihahatid ang bungang kalagayan ng pagkakaroon nang sagana sa natural at marangal na modernong Tagalog.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinakikita ang pagsalungat ng dalawang sugnay.
- source_word: καὶ ὃ ἔχει
  choice: maging ang nasa kanya
  rationale: Ang “maging” ay naghahatid sa mapagdiing diwa ng καί, at ang “nasa kanya” ay likas na Tagalog para sa kung ano ang taglay niya.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: ay kukunin sa kanya
  rationale: Tuwirang ipinahahayag ang pag-aalis mula sa taong tinutukoy.
- source_word: αὐτῷ / αὐτοῦ
  choice: siya / sa kanya
  rationale: Ang Tagalog na mga panghalip na ito ay likas na hindi nagpapahiwatig ng kasarian, samantalang napapanatili ang isahang kinatawang pagtukoy.
theological_decisions:
- issue: Hindi tahasang layon ng “mayroon” at “bibigyan”
  choice: Hindi tinukoy sa pangunahing teksto kung ano ang mayroon o ibibigay.
  alternative: Tukuyin ito bilang pagkaunawa, pagtanggap, o kaalaman tungkol sa kaharian.
  rationale: Bagaman maaaring ipahiwatig ng konteksto ang pagtanggap at pagkaunawa sa turo ni Jesus, hindi binanggit ng Griyego ang layon; pinananatili ng salin ang sadyang lawak at tensiyong ito.
- issue: Isahang pangkalahatang pagtukoy
  choice: Pinanatili ang isahan sa “siya” at “sa kanya.”
  alternative: Gawing maramihan ang pangungusap upang idiin ang pagiging pangkalahatan.
  rationale: Ginagamit ng Griyego ang isahang anyo bilang kinatawan ng sinumang tao. Ang Tagalog ay nakapagpapanatili ng isahan nang hindi nagdaragdag ng kasariang wala namang kailangang ipahayag sa target na wika.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinili ang “mayroon” at “wala” upang mapanatiling di-tiyak ang layon; ginamit ang “bibigyan pa” para sa idiomatikong paglilinaw ng ipinahihiwatig na karagdagan. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
