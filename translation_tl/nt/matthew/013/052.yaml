id: MAT.13.52
reference: Matthew 13:52
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Kaya ang bawat eskriba na sinanay para sa kaharian ng langit[a] ay tulad ng isang pinuno ng sambahayan[b] na naglalabas mula sa kaniyang imbakan[c] ng mga bagong bagay at mga lumang bagay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na naging alagad ng kaharian ng langit.” Maaaring tumukoy ang pandiwang Griyego sa pagiging ginawang alagad gayundin sa pagtuturo o pagsasanay; hindi tiyak ang eksaktong ugnayan nito sa “kaharian.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “namamahala sa bahay,” “pinuno ng bahay,” o “may-ari ng bahay.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Griyego ay maaari ring mangahulugang “kayamanan” o “taguan ng kayamanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kaya
  rationale: Likas na panandang naghahayag ng konklusyon o bunga at malinaw na nag-uugnay sa naunang usapan.
- source_word: πᾶς γραμματεὺς
  choice: ang bawat tagapagturo ng Kautusan
  rationale: Sa kontekstong Judio, ang γραμματεύς ay hindi lamang tagasulat kundi taong bihasa at nagtuturo ng Kautusan; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na “eskriba.”
- source_word: μαθητευθεὶς
  choice: na naging alagad
  rationale: Pinananatili nito ang pangunahing diwa ng passive participle ng μαθητεύω—ang gawing alagad o maging alagad—nang hindi ito nililimitahan sa pormal na pagsasanay lamang.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: para sa kaharian ng langit
  rationale: Ang di-karaniwang datibo ay maaaring magpahiwatig ng kaugnayan o oryentasyon; ang “para sa” ay natural ngunit iniiwan sa talababa ang ibang posibleng ugnayan.
- source_word: ὅμοιός ἐστιν
  choice: ay tulad ng
  rationale: Karaniwan at malinaw na pananalita para sa paghahambing sa mga talinghaga.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: isang pinuno ng sambahayan
  rationale: Ipinahahayag ang taong may pamamahala sa bahay at sambahayan nang hindi ipinapalagay na pagmamay-ari lamang ng gusali ang punto.
- source_word: ἐκβάλλει
  choice: naglalabas
  rationale: Sa kontekstong ito, tumutukoy sa pagkuha at paglalabas mula sa imbakan, hindi sa marahas na pagtataboy.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: mula sa kaniyang imbakan ng mahahalagang bagay
  rationale: 'Sinasaklaw nito ang dalawang diwa ng θησαυρός: ang nakaimbak na kayamanan at ang lugar na pinaglalagyan nito.'
- source_word: καινὰ καὶ παλαιά
  choice: ng mga bago at mga luma
  rationale: Pinananatili ang ayos at paghahambing ng mga substantivized neuter adjective sa Griyego habang umaasa sa naunang “mahahalagang bagay” bilang ipinahihiwatig na pangngalan.
theological_decisions:
- issue: Diwa ng μαθητευθεὶς kaugnay ng γραμματεύς at ng kaharian
  choice: Isang tagapagturo ng Kautusan na naging alagad para sa kaharian ng langit
  alternative: Isang tagapagturo ng Kautusan na sinanay para sa kaharian, o naging alagad ng kaharian
  rationale: Mas tuwirang pinananatili ng “naging alagad” ang ugnayan sa μαθητεύω, samantalang kinikilala sa talababa ang maaaring diin sa pagtuturo o pagsasanay at ang kalabuan ng datibo.
- issue: Paglalarawan sa οἰκοδεσπότης
  choice: pinuno ng sambahayan
  alternative: may-ari ng bahay o namamahala sa bahay
  rationale: Pinananatili ang papel ng awtoridad at pangangasiwa sa sambahayan nang hindi nagdaragdag ng doktrinal o modernong legal na pagpapakahulugan.
- issue: Larawan ng θησαυρός
  choice: imbakan ng mahahalagang bagay
  alternative: kayamanan o taguan ng kayamanan
  rationale: Pinananatili ang sadyang pagsasanib ng halaga at lugar na pinagmumulan ng mga inilalabas na bago at luma.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “tagapagturo ng Kautusan” sa halip na teknikal o di-gaanong pamilyar na “eskriba,” at “pinuno ng sambahayan” upang malinaw na maipakita ang papel sa talinghaga. Inilagay ang lahat ng marker sa mismong teksto at pinanatili sa mga talababa ang tunay na leksikal at sintaktikong kalabuan.
