  to: Sinabi niya sa kanila, “Kaya ang bawat eskriba na sinanay para sa kaharian ng langit[a] ay tulad ng isang pinuno ng sambahayan[b] na naglalabas mula sa kaniyang imbakan[c] ng mga bagong bagay at mga lumang bagay.”
  rationale: Inayos ang salin upang mas tumpak na maipahayag ang pasibong diwa ng μαθητευθείς, maiwasan ang labis na pagpapakahulugan sa γραμματεύς, at gawing malinaw at natural ang larawan ng paglalabas ng bago at lumang bagay mula sa θησαυρός. Napanatili ang mahahalagang alternatibong pagbasa sa mga talababa at ang mga marker ay nakatali sa tamang mga salita sa teksto.
