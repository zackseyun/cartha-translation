base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: tl
  text: Sumagot siya, “Ang naghahasik ng mabuting binhi ay ang Anak ng Tao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Anak ng Sangkatauhan.” Ang Griegong titulong “Anak ng Tao” ay umaalingawngaw sa Daniel 7 at pinanatili rito dahil sa matagal nang gamit at teolohikal na bigat nito sa mga Ebanghelyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Pinagsama ang participle at finite verb sa likas na Tagalog. Iniiwasan nito ang paulit-ulit at di-likas na “pagsagot ay sinabi niya,” habang pinananatili ang tungkulin nitong ipakilala ang tugon.
- source_word: Ὁ σπείρων
  choice: Ang naghahasik
  rationale: Ang substantival present participle ay tumutukoy sa persona ayon sa ginagawa niya. Ang “ang naghahasik” ay malinaw at pinananatili ang pandiwang larawan ng talinghaga.
- source_word: τὸ καλὸν σπέρμα
  choice: ng mabuting binhi
  rationale: Ang καλός dito ay tumutukoy sa mabuti o nararapat, hindi lamang sa magandang anyo. Ang “binhi” ay angkop na pangngalang kolektibo sa Tagalog.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang nakaugaliang salin sa Tagalog ng natatanging katawagan ni Jesus sa mga Ebanghelyo at pinananatili nito ang kaugnayan sa Daniel 7.
theological_decisions:
- issue: Pagpapahayag sa kristolohikal na titulong υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isang Tao
  rationale: Pinananatili ng “Anak ng Tao” ang kinikilalang titulong gamit sa mga Ebanghelyo at ang apokaliptiko at mesiyanikong alingawngaw nito, nang hindi nilalantad bilang karaniwang pagtukoy lamang sa isang tao.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “naghahasik” sa halip na mas teknikal o makalumang anyo, at pinanatili ang tradisyonal na titulong “Anak ng Tao.”
