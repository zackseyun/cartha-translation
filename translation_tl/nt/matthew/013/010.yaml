    issue: Ang “sa pamamagitan ng mga talinghaga” ay isang mas malayang paglalapat ng ἐν παραβολαῖς.
    rationale: Bagaman hindi mali ang kahulugang paraan o midyum, ang “sa mga talinghaga” ay mas malapit sa anyo ng Griyego at sapat na natural sa Filipino.
  - severity: low
    issue: Ang talababa sa “lumapit” ay nagmumungkahi ng “lumapit sa kanya,” samantalang ang αὐτῷ ay tuwirang kaugnay ng “sinabi.”
    rationale: Maaaring ipahiwatig ng konteksto na lumapit sila kay Jesus, ngunit hindi ito kailangang ilahad bilang alternatibong salin sa mismong talata. Mas mabuting ipaliwanag na ang participle ay nagpapakitang naganap muna ang paglapit bago ang pagsasalita.
  revised_text: Pagkatapos, lumapit[a] ang mga alagad at sinabi sa kanya, “Bakit ka nagsasalita sa kanila sa mga talinghaga?”
