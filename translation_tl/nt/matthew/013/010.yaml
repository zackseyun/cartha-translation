  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: tl
  text: Pagkatapos, lumapit[a] ang mga alagad at sinabi sa kanya, “Bakit ka nagsasalita sa kanila sa mga talinghaga?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Binibigyang-diin ng pandiwaring Griyego na lumapit muna ang mga alagad bago sila nagsalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Pagkatapos
  rationale: Dito, isinusulong ng καί ang salaysay mula sa pampublikong pagtuturo ni Jesus tungo sa paglapit ng mga alagad. Ang “Pagkatapos” ay likas sa modernong Filipino at hindi nagdaragdag ng tiyak na agwat ng panahon.
- source_word: προσελθόντες
  choice: lumapit
  rationale: Ipinahihiwatig ng aorist participle ng προσέρχομαι na lumapit muna kay Jesus ang mga alagad bago sila nagsalita. Maikli, natural, at tumpak ang “lumapit.”
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Tinutukoy ng pantukoy ang kilala nang pangkat ng mga alagad. Hindi idinagdag ang “niya” sapagkat hindi ito tahasang nasa Griyego.
- source_word: εἶπαν αὐτῷ
  choice: sinabi sa kanya
  rationale: Pinananatili nito ang karaniwang kahulugan ng λέγω kahit ang tuwirang sinabi ay isang tanong. Natural pa rin ito sa Filipino.
- source_word: Διὰ τί
  choice: Bakit
  rationale: Ito ang tuwiran at likas na katumbas ng pariralang patanong na humihingi ng dahilan.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Ang ἐν na may datibo ay nagpapahayag dito ng paraan o kasangkapan. Malinaw na ipinapakita ng parirala na mga talinghaga ang paraan ng pagsasalita ni Jesus.
- source_word: λαλεῖς
  choice: ka nagsasalita
  rationale: Pinananatili nito ang pangkasalukuyang anyo at ang tuwirang pagtukoy sa kausap.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinakikita ng pariralang ito ang mga taong kinakausap ni Jesus.
