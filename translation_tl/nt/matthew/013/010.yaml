- from: Pagkatapos, lumapit[a] ang mga alagad at sinabi sa kanya, “Bakit ka nagsasalita sa kanila sa pamamagitan ng mga talinghaga?”
  to: Pagkatapos, lumapit[a] ang mga alagad at sinabi sa kanya, “Bakit ka nagsasalita sa kanila sa mga talinghaga?”
  rationale: Pinalitan ang mas instrumental na “sa pamamagitan ng mga talinghaga” ng “sa mga talinghaga” upang mas malapit na maipahayag ang ἐν παραβολαῖς. Inayos ang talababa upang ipaliwanag ang pagkakasunod ng paglapit at pagsasalita nang hindi ipinapakita bilang tekstuwal na alternatibo ang isang ipinahihiwatig lamang ng konteksto.
