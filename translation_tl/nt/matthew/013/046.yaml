    rationale: Bagaman katanggap-tanggap, ang parirala ay maaaring tumukoy lamang sa mga pag-aari. Ang “lahat ng mayroon siya” ay mas ganap na sumasaklaw sa “all that he had.”
  revised_text: At nang makatagpo siya ng isang perlas na napakahalaga[a], umalis siya, ipinagbili ang lahat ng mayroon siya, at binili iyon.
