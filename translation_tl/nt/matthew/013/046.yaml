  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: tl
  text: At nang makatagpo siya ng isang perlas na napakahalaga[a], umalis siya, ipinagbili ang lahat ng mayroon siya, at binili iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang mahalagang perlas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: at nang makakita siya
  rationale: Ipinahahayag ng “nang makakita” na nauna ang pagkakatagpo sa mga pangunahing kilos; ang δέ ay banayad na pang-ugnay kaya likas ang “at.”
- source_word: ἕνα
  choice: isang
  rationale: Pinananatili ang tahasang bilang na isa, na nagtatampok sa nag-iisang perlas na pambihira ang halaga.
- source_word: πολύτιμον
  choice: napakahalaga
  rationale: Natural at malinaw itong nagpapahayag ng pambihirang halaga ng perlas sa makabagong Tagalog.
- source_word: μαργαρίτην
  choice: perlas
  rationale: Ito ang karaniwan at tiyak na katumbas sa Tagalog.
- source_word: ἀπελθὼν
  choice: umalis siya
  rationale: Ginawang pandiwang may tahasang simuno upang maging natural ang pagkakasunod-sunod ng salaysay sa Tagalog.
- source_word: πέπρακεν
  choice: ipinagbili
  rationale: Ang ganap nang pagbebenta ay natural na ipinahahayag sa salaysay sa pamamagitan ng aspektong perpektibo.
- source_word: πάντα ὅσα εἶχεν
  choice: ang lahat ng kanyang ari-arian
  rationale: Pinananatili ang ganap na saklaw ng πάντα habang natural na ipinahahayag ang lahat ng pag-aari niya.
- source_word: ἠγόρασεν
  choice: binili
  rationale: Payak at likas na katumbas na nagpapanatili sa natapos na kilos.
- source_word: αὐτόν
  choice: iyon
  rationale: Tumutukoy ito sa perlas; ang “iyon” ay natural na panghalip para sa bagay at umiiwas sa di-likas na paggaya sa kasariang gramatikal ng Griyego.
