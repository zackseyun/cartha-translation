  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bilang na “isang,” ang pagkakasunod-sunod ng mga kilos, at ang pambihirang halaga ng perlas nang hindi nagdaragdag ng interpretasyong teolohikal.
