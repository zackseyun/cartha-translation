id: MAT.13.56
reference: Matthew 13:56
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: tl
  text: At hindi ba narito sa piling natin ang lahat ng kanyang mga kapatid na babae? Saan kung gayon nakuha ng taong ito ang lahat ng ito?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng kamag-anak.” Karaniwang nangangahulugang “mga kapatid na babae” rito ang salitang Griyego, ngunit mas malawak ang pakahulugan dito ng ilan dahil sa mga sumunod na talakayang teolohikal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: mga kapatid na babae
  rationale: Ito ang karaniwan at tuwirang kahulugan ng salitang Griyego sa konteksto ng sambahayan ni Jesus; hindi nito ipinapasok sa salin ang mas malawak na pagpapakahulugang kamag-anak.
- source_word: οὐχὶ πᾶσαι
  choice: hindi ba ... ang lahat
  rationale: Pinananatili nito ang tanong na retorikal na umaasang sasang-ayon ang kausap, pati ang diin sa kabuuan ng mga kapatid na babae.
- source_word: πρὸς ἡμᾶς
  choice: narito sa piling natin
  rationale: Likas na ipinahahayag sa Tagalog ang kanilang presensiya at pakikisama sa lokal na pamayanan, nang hindi labis na nililimitahan ang parirala sa pisikal na lokasyon lamang.
- source_word: πόθεν
  choice: Saan ... nakuha
  rationale: Tuwirang itinatanong nito ang pinagmulan ng mga bagay na tinutukoy, ayon sa diwa ng πόθεν.
- source_word: οὖν
  choice: kung gayon
  rationale: Malinaw na ipinakikita ang paghihinuha sa pangangatwiran ng mga nagsasalita.
- source_word: τούτῳ
  choice: ng taong ito
  rationale: Pinananatili ang demonstratibo at bahagyang mapanghamak na himig ng pagtukoy nila kay Jesus.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Natural sa modernong Tagalog at sapat na malawak upang tumukoy sa karunungan at makapangyarihang mga gawa na binanggit sa konteksto.
theological_decisions:
- issue: Pagkakakilanlan ng mga tinukoy na ἀδελφαὶ ni Jesus
  choice: Isalin sa karaniwang kahulugan bilang “mga kapatid na babae.”
  alternative: “Mga babaeng kamag-anak” o “mga pinsang babae.”
  rationale: Ang payak na kahulugan ng salitang Griyego at ang konteksto ng sambahayan ang pinananatili, nang hindi nilulutas sa mismong salin ang mga sumunod na debateng teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “narito sa piling natin” upang ipahayag ang presensiya sa pamayanan, at “taong ito” upang mapanatili ang bahagyang mapanghamak na himig ng demonstratibo.
