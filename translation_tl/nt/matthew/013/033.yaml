  to: 'Sinabi niya sa kanila ang isa pang talinghaga: “Ang kaharian ng langit ay tulad ng pampaalsa[a] na kinuha ng isang babae at itinago[b] sa tatlong takal ng harina[c] hanggang sa mapaalsa ang buong masa.”'
  rationale: Pinalitan ang “ang lahat” ng “ang buong masa” upang maging malinaw at natural ang kolektibong saklaw ng pangwakas na sugnay. Ang “masa” ay ipinahihiwatig ng larawan ng harina at pampaalsa at tumutugma sa kabuuang bagay na “na-leaven” sa Griyego. Walang binagong teolohikal na pahiwatig o idinagdag na partikular na pagpapakahulugan.
