base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: tl
  text: 'Sinabi niya sa kanila ang isa pang talinghaga: “Ang kaharian ng langit ay tulad ng pampaalsa[a] na kinuha ng isang babae at itinago[b] sa tatlong takal ng harina[c] hanggang sa mapaalsa ang buong masa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lebadura.” Ang salitang Griyego ay tumutukoy sa sangkap na ginagamit upang mapaalsa ang masa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ihinalo” o “isinama nang mabuti.” Sa literal na Griyego, “itinago sa loob.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “tatlong seah ng harina”—isang napakaraming dami.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: isa pang talinghaga
  rationale: Likas na ipinahahayag nito na nagbigay si Jesus ng karagdagang talinghaga, habang pinananatili ang diwa ng ἄλλην.
- source_word: ἐλάλησεν αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Sa pambungad ng isang talinghaga, natural sa modernong Tagalog ang “sinabi niya sa kanila” at tapat ito sa kilos ng pagsasalita.
- source_word: Ὁμοία ἐστὶν
  choice: ay tulad ng
  rationale: Malinaw at karaniwang paraan ito ng paghahambing sa Tagalog, na angkop sa pormula ng mga talinghaga.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Ito ang natural at kinikilalang salin ng natatanging parirala ni Mateo; hindi kailangang panatilihin nang literal ang anyong maramihan ng οὐρανῶν.
- source_word: ζύμῃ
  choice: pampaalsa
  rationale: Tumutukoy ang ζύμη sa sangkap na nagpapaalsa sa masa. Nauunawaan ang “pampaalsa” sa pangkaraniwang Tagalog at hindi nito nililimitahan ang sangkap sa modernong komersiyal na yeast.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: na kinuha ng isang babae
  rationale: Pinananatili nito ang pagkakasunod ng mga kilos at natural na isinasalin ang participle λαβοῦσα.
- source_word: ἐνέκρυψεν εἰς
  choice: itinago sa
  rationale: Pinananatili nito ang literal na puwersa ng ἐγκρύπτω, “itago o ikubli sa loob,” sa halip na tahimik na gawing “ihinalo.”
- source_word: ἀλεύρου σάτα τρία
  choice: tatlong takal ng harina
  rationale: Ang σάτον ay isang panukat ng tuyong sangkap. Madaling maunawaan ang “takal,” samantalang inilalagay sa talababa ang mas tiyak ngunit di-pamilyar na “seah.”
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: hanggang sa mapaalsa ang lahat
  rationale: Pinananatili ng “mapaalsa” ang pasibong diwa ng ἐζυμώθη at ng “ang lahat” ang kabuuang saklaw ng ὅλον, nang hindi nagdaragdag ng salitang “masa” na wala sa Griyego.
theological_decisions:
- issue: Ang maaaring positibo o negatibong pahiwatig ng ζύμη sa talinghaga tungkol sa kaharian
  choice: Isinalin nang neutral bilang “pampaalsa,” nang hindi ipinapasok sa teksto ang positibo o negatibong pagpapakahulugan.
  alternative: Maaaring gamitin ang “lebadura” o hubugin ang salin ayon sa negatibong gamit ng pampaalsa sa ibang talata.
  rationale: Inilalarawan dito ng talinghaga ang nakatagong paglaganap ng pampaalsa. Dapat panatilihin ng salin ang larawan at ang puwang para sa pagpapakahulugan, sa halip na lutasin ang mas malawak na teolohikal na usapin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang konkretong larawan ng pagtatago ng pampaalsa at iniwasan ang denominasyonal o mapagpasyang teolohikal na pagpapakahulugan.
