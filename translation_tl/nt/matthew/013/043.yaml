  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: tl
  text: Sa panahong iyon, ang mga matuwid ay magniningning[a] gaya ng araw sa kaharian ng kanilang Ama. Ang may mga tainga ay makinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magliliwanag.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego, ang panawagang ito ay nasa anyong isahan at kumakatawan sa sinumang may mga tainga: “Ang may mga tainga ay makinig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Kung magkagayon
  rationale: Ipinahahayag nito ang kasunod na pangyayari sa wakas na inilalarawan sa naunang paliwanag; natural ito sa modernong Filipino at mas malinaw kaysa sa payak na “Pagkatapos.”
- source_word: οἱ δίκαιοι
  choice: ang mga matuwid
  rationale: Pinananatili nito ang substantibong gamit ng pang-uri at ang saklaw nitong moral at tipanang diwa nang hindi dinaragdagan ang kahulugan.
- source_word: ἐκλάμψουσιν
  choice: magniningning
  rationale: Ang pandiwa ay nangangahulugang “sisikat/magliliwanag nang maningning.” Ang “magniningning” ay natural at malinaw, at ang paghahambing sa araw ang nagpapatingkad sa larawan.
- source_word: ὡς ὁ ἥλιος
  choice: gaya ng araw
  rationale: Tuwirang pinananatili ang paghahambing at ang larawan ng araw sa natural na Filipino.
- source_word: ἐν τῇ βασιλείᾳ
  choice: sa kaharian
  rationale: Ang pariralang lokatibo at ang kaugnayan nito sa Ama ay pinakamalinaw na naihahayag ng “kaharian,” habang hindi itinatanggi ang diwa ng paghahari.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: ng kanilang Ama
  rationale: Malapit ito sa Griyego at hindi idinaragdag ang salitang “makalangit,” na wala sa talata.
- source_word: ὁ ἔχων ὦτα
  choice: Ang may mga tainga
  rationale: Pinananatili nito ang pangkalahatang tawag na nasa anyong isahan sa Griyego at ang tahasang larawan ng mga tainga, sa natural na paraang Filipino.
- source_word: ἀκουέτω
  choice: ay makinig
  rationale: Ang pautos na “makinig” ay naghahayag hindi lamang ng pisikal na pagkarinig kundi ng masusing pagpansin at pagtugon.
theological_decisions:
- issue: Ang kinatawang panawagan sa anyong isahan
  choice: Ang may mga tainga ay makinig
  alternative: Lahat ng may mga tainga ay makinig
  rationale: Ang Griyego ay gumagamit ng isang kinatawang indibidwal sa anyong isahan. Hindi na kailangang lagyan ng kasariang panlalaki sa Filipino, ngunit hindi rin ito ginawang tahasang maramihan.
- issue: Kahulugan ng βασιλεία sa kontekstong ito
  choice: kaharian
  alternative: paghahari
  rationale: Ang “sa kaharian ng kanilang Ama” ay likas na lokatibo at tumutukoy sa eskatolohikal na kalagayan o saklaw kung saan magniningning ang mga matuwid; hindi nito inaalis ang diwa ng pamamahala ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalinghagang larawan ng pagsikat na gaya ng araw at ang maikli ngunit mariing pangwakas na panawagan. Iniwasan ang mga salitang may di-kailangang denominasyonal na pahiwatig.
