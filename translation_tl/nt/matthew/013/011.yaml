  source_fidelity: 'Tapat ang salin sa Griyego: natural na isinasalin ang ἀποκριθεὶς εἶπεν bilang “Sumagot siya,” ipinapakita ng “Sapagkat” ang paliwanag na ipinakikilala ng ὅτι sa kontekstong ito, at napapanatili ang magkatambal na perpektong pasibo sa “ipinagkaloob.” Wala itong idinadagdag na tahasang tagapagkaloob sa pangunahing teksto.'
