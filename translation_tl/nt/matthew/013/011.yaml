id: MAT.13.11
reference: Matthew 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: tl
  text: Sumagot siya sa kanila, “Sapagkat ipinagkaloob sa inyo na malaman ang mga hiwaga[a] ng kaharian ng langit, ngunit hindi ito ipinagkaloob sa kanila.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lihim.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang sinasabi kung sino ang nagkaloob; ipinahihiwatig ng konteksto na ang kaalamang ito ay kaloob ng Diyos.
    reason: implicit_divine_agent
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Sumagot siya
  rationale: Ang participle at finite verb ay karaniwang idyomang Griyego na likas na nangangahulugang ‘sumagot’; hindi kailangang ulitin bilang ‘sumagot at sinabi’ sa makabagong Tagalog.
- source_word: Ὅτι
  choice: Sapagkat
  rationale: Sa konteksto, ipinakikilala nito ang dahilan bilang sagot sa tanong kung bakit gumagamit si Jesus ng mga talinghaga.
- source_word: ὑμῖν δέδοται γνῶναι
  choice: ipinagkaloob sa inyo na malaman
  rationale: Pinananatili ng ‘ipinagkaloob’ ang perpektong pasibo at ang di-pinangalanang nagkaloob; tuwirang tinutukoy ng ‘sa inyo’ ang mga tumanggap.
- source_word: τὰ μυστήρια
  choice: ang mga hiwaga
  rationale: Ang ‘mga hiwaga’ ay angkop sa mga katotohanang dating nakakubli ngunit inihahayag, at pinananatili nito ang biblikal na diwa nang hindi nililimitahan sa karaniwang lihim lamang.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ng kaharian ng langit
  rationale: Ito ang natural at kinikilalang Tagalog para sa natatanging parirala ni Mateo; hindi kailangan ang literal na maramihang ‘mga langit.’
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: ngunit hindi ito ipinagkaloob sa kanila
  rationale: Malinaw na pinananatili ang pagsalungat sa ‘inyo’ at ang magkatulad na pasibong anyo ng dalawang sugnay.
theological_decisions:
- issue: Di-tahasang banal na tagaganap sa δέδοται
  choice: 'Panatilihin ang pasibo: ‘ipinagkaloob’'
  alternative: ‘Ipinagkaloob ito ng Diyos’
  rationale: Hindi tahasang pinangalanan ng Griyego ang nagkaloob. Bagaman malamang na Diyos ang tinutukoy, hindi ito idinaragdag sa pangunahing teksto upang mapanatili ang anyo at teolohikal na pahiwatig ng orihinal.
- issue: Kahulugan ng μυστήρια sa konteksto ng kaharian
  choice: ‘mga hiwaga’
  alternative: ‘mga lihim’
  rationale: Pinananatili ng ‘mga hiwaga’ ang diwa ng mga banal na katotohanang nakakubli at ngayo’y ipinababatid, nang hindi ito ginagawang palaisipan o karaniwang lihim lamang.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang ‘Sapagkat’ upang ipakita ang ugnayang paliwanag sa naunang tanong, at pinanatili ang balanseng pasibong pagkakabuo ng dalawang magkasalungat na sugnay.
