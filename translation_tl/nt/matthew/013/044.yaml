id: MAT.13.44
reference: Matthew 13:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: tl
  text: Ang kaharian ng langit ay tulad ng isang kayamanang nakatago sa isang bukid[a]. Nang matagpuan ito ng isang lalaki, itinago niya ito. At dahil sa kanyang kagalakan[b], umalis siya, ipinagbili ang lahat ng kanyang ari-arian, at binili ang bukid na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang kaharian ng langit ay tulad ng kayamanang nakatago sa isang bukid.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “Dahil sa kagalakan niya, umalis siya at ipinagbili ang lahat ng kanyang pag-aari.”'
    reason: syntactical_alternative
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: ay tulad ng
  rationale: Likas na pormula ng paghahambing sa modernong Tagalog at malinaw na pinananatili ang anyong pagtutulad ng talinghaga.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Karaniwan at marangal na salin ng natatanging parirala ni Mateo; pinananatili ng “kaharian” ang saklaw ng βασιλεία nang hindi nililimitahan ito sa lugar lamang o sa paghahari lamang.
- source_word: θησαυρῷ
  choice: isang kayamanan
  rationale: Ang walang artikulong pangngalan sa paghahambing ay natural na ipinahahayag bilang di-tiyak na “isang kayamanan.”
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: nakatago sa isang bukid
  rationale: Ipinahahayag ng “nakatago” ang patuloy na kalagayang bunga ng perfect passive participle; natural sa Tagalog ang “sa isang bukid” sa ganitong paghahambing.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: Nang matagpuan iyon ng isang lalaki
  rationale: Natural na inayos ang participial clause bilang sugnay na pangyayari, habang malinaw na ang kayamanan ang natagpuan at pinananatili ang lalaking tauhan ng salaysay.
- source_word: ἔκρυψεν
  choice: muli niya itong itinago
  rationale: 'Tahasan ang layon sa Tagalog para sa kalinawan. Ang “muli” ay likas na ipinahihiwatig ng pagkakasunod: nakatago na ang kayamanan, natagpuan, at pagkatapos ay itinago ng lalaki; hindi ito ginagawang hiwalay na leksikal na detalye ng pandiwa.'
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: dahil sa kanyang kagalakan
  rationale: Malinaw na inihahayag ang sanhi o motibasyong puwersa ng parirala, habang pinananatili ang emosyon ng tauhan.
- source_word: ὑπάγει
  choice: umalis siya
  rationale: Natural na salaysay sa Tagalog at ipinahahayag ang diwa ng pag-alis na nasa ὑπάγει.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: ipinagbili ang lahat ng kanyang ari-arian
  rationale: Malinaw at natural na ipinahahayag ang kabuuan ng kanyang pag-aari, nang hindi nagpapahiwatig ng eksepsiyon.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: binili ang bukid na iyon
  rationale: Direktang komersiyal na pananalita; pinananatili ng “iyon” ang demonstratibong diin sa tiyak na bukid.
theological_decisions:
- issue: Pagpapahayag sa ἄνθρωπος
  choice: isang lalaki
  alternative: isang tao
  rationale: Bagaman maaaring mangahulugan ang ἄνθρωπος ng tao sa pangkalahatan, ang anyo at salaysay dito ay tumutukoy sa isang lalaking tauhan; iniiwasan ng salin ang di-kinakailangang pag-neutralisa.
- issue: Pagpapahayag sa βασιλεία
  choice: kaharian
  alternative: paghahari
  rationale: Maaaring tumukoy ang βασιλεία kapwa sa paghahari at kaharian. Pinananatili ng “kaharian” ang tradisyonal at malawak na saklaw ng termino sa pambungad na paghahambing, nang hindi ipinapasya na lugar lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kagalakan” para sa dignidad ng kasabihan, ngunit pinanatiling payak ang mga pandiwang “umalis,” “ipinagbili,” at “binili.” Ang mga marker na [a] at [b] ay parehong nasa pangunahing teksto at tumutugma sa mga talababa.
