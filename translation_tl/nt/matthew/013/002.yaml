base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: tl
  text: At nagtipon sa kanya ang napakaraming tao, kaya sumakay siya sa isang bangka at naupo, at ang buong karamihan ay nakatayo sa dalampasigan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: nagtipon sa kanya
  rationale: Likas sa modernong Tagalog ang aktibong anyong “nagtipon” para sa pasibong pandiwang Griyego na may diwang kusang pagdagsa, at pinananatili ng “sa kanya” ang direksiyon ng πρός.
- source_word: ὄχλοι πολλοί
  choice: napakaraming tao
  rationale: Bagaman pangmaramihan ang ὄχλοι, mas natural sa Tagalog ang kolektibong “napakaraming tao” kaysa “maraming mga karamihan,” habang malinaw pa rin ang laki ng nagtipon.
- source_word: ὥστε
  choice: kaya
  rationale: Ipinahahayag ng “kaya” ang resultang ipinakikilala ng ὥστε sa maikli at natural na salaysay.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: sumakay siya sa isang bangka at naupo
  rationale: Tumpak at karaniwang pananalita ang “sumakay sa isang bangka”; malinaw na kasunod na kilos ang “naupo” nang hindi dinaragdagan ang teksto.
- source_word: πᾶς ὁ ὄχλος
  choice: ang buong karamihan
  rationale: Pinananatili nito ang paglipat ng Griyego mula sa pangmaramihang mga pulutong tungo sa kolektibong pang-isahang pagtukoy sa lahat ng naroon.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sa dalampasigan
  rationale: Ang “dalampasigan” ay dignificado at malawak na katumbas ng αἰγιαλός, na maaaring tumukoy sa pampang o baybayin.
- source_word: εἱστήκει
  choice: 'nakalagay— correction: nakatayo'
  rationale: Ang “nakatayo” ay natural na naglalarawan sa nagpapatuloy na posisyon ng karamihan na ipinahihiwatig ng anyong pandiwa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “tao” sa unang sugnay para sa idiomatikong daloy at “buong karamihan” sa ikalawa upang mapanatili ang kolektibong pagbabago sa orihinal. Walang footnote dahil walang tunay na tekstuwal o teolohikal na kalabuan na nangangailangan nito sa talatang ito.
