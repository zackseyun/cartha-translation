  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: tl
  text: 'upang matupad ang sinabi sa pamamagitan ng propeta, na nagsasabi: “Bubuksan ko ang aking bibig sa mga talinghaga; bibigkasin ko ang mga bagay na nakatago mula pa sa pagkakatatag[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga manuskritong may “mula pa sa pagkakatatag ng sanlibutan.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: upang matupad
  rationale: Likas na pormula sa modernong Tagalog na pinananatili ang ugnayang layunin/bunga at ang diwang katuparan.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: ang sinabi sa pamamagitan ng propeta
  rationale: Malinaw na isinasalin ang articular participle at pinananatili ang propeta bilang daluyan ng pahayag.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: Bubuksan ko ang aking bibig sa mga talinghaga
  rationale: Pinananatili ang matalinghagang anyo at ang terminong “talinghaga,” kahit bahagyang makata ang ayos.
- source_word: ἐρεύξομαι
  choice: bibigkasin ko
  rationale: Nagpapahayag ng pagsasalita o paglalabas ng mga salita nang hindi nagdaragdag ng ideya ng pagpapaliwanag o pangangaral.
- source_word: κεκρυμμένα
  choice: ang mga bagay na nakatago
  rationale: Pinananatili ang substantival at resultative na diwa ng perfect passive participle sa halip na gawing mas interpretibong “mga lihim.”
- source_word: ἀπὸ καταβολῆς
  choice: mula pa sa pagkakatatag
  rationale: Sinusunod ang ibinigay na tekstong Griyego, na walang tahasang κόσμου (“ng sanlibutan”), habang pinananatili ang temporal na diwa ng parirala.
theological_decisions:
- issue: Pagkakakilanlan ng propetang sinipi
  choice: sa pamamagitan ng propeta
  alternative: sa pamamagitan ni Asaf na propeta
  rationale: “Ang propeta” lamang ang nasa ibinigay na tekstong Griyego; hindi dinaragdagan ang pagkakakilanlan bagaman mula sa Awit 78:2 ang sipi.
- issue: Saklaw ng ἀπὸ καταβολῆς
  choice: mula pa sa pagkakatatag
  alternative: mula pa sa pagkakatatag ng sanlibutan
  rationale: Walang κόσμου sa pangunahing tekstong ibinigay. Iniiwasang tahimik na idagdag ang “ng sanlibutan,” ngunit inilalagay sa talababa ang mas mahabang pagbasa ng ilang manuskrito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bahagyang makatang anyo ng sipi at ang tunay na elipsis sa pangunahing tekstong Griyego.
