  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: tl
  text: Ngunit ang ibang binhi ay nahulog sa matabang lupa at namunga—ang isa ay sandaang ulit, ang isa ay animnapung ulit, at ang isa ay tatlumpung ulit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang ilan ay sandaang ulit, ang ilan ay animnapung ulit, at ang ilan ay tatlumpung ulit.” Ang anyong distributibo sa Griyego ay maaaring katawanin bilang “ang isa…ang isa…ang isa” o “ang ilan…ang ilan…ang ilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ang ibang binhi
  rationale: Ang pang-uring neuter plural ay ginamit bilang pangngalan at tumutukoy sa mga binhing binanggit sa konteksto. Idinagdag ang “binhi” upang maging malinaw at natural sa Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat sa naunang mga binhing hindi nagbunga.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Pinananatili ang literal na larawan ng binhing nahuhulog habang naghahasik, sa halip na gawing “inihasik.”
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: sa matabang lupa
  rationale: Sa kontekstong pansaka, ang καλὴν ay tumutukoy sa lupang mabuti o angkop sa pagtubo; natural na ipinahahayag ito sa Tagalog bilang “matabang lupa.”
- source_word: ἐδίδου καρπόν
  choice: namunga
  rationale: Natural at maikli itong salin ng idyomang Griyego. Sa konteksto ng salaysay, naipahihiwatig ng pandiwa ang naganap na pagbubunga, bagaman maaaring idiin ang aspektong nagpapatuloy sa saling “patuloy na namumunga.”
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ang isa ay sandaang ulit, ang isa ay animnapung ulit, at ang isa ay tatlumpung ulit
  rationale: Ginagaya nito ang distributibong ayos ng Griyego at nililinaw na magkakaiba ang dami ng ani. Inuulit ang “ulit” sa bawat bilang para sa likas at malinaw na Tagalog.
