base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: tl
  text: Inilahad niya sa kanila ang isa pang talinghaga. Sinabi niya, “Ang kaharian ng langit ay tulad ng isang taong naghasik ng mabuting binhi sa kanyang bukid.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: isa pang talinghaga
  rationale: Likas sa modernong Tagalog ang “isa pang” upang ipakilalang karagdagang talinghaga ito sa pagkakasunod-sunod.
- source_word: παρέθηκεν αὐτοῖς
  choice: inilahad niya sa kanila
  rationale: Ang παρατίθημι ay nangangahulugang magharap o maglahad; pinananatili ng “inilahad” ang diwa ng paghaharap ng isang aral nang hindi nagiging literal at alanganing pakinggan.
- source_word: λέγων
  choice: Sinabi niya
  rationale: Ginawang hiwalay na pangungusap ang participle para sa malinaw at natural na daloy sa Tagalog, habang nananatili ang ugnayan nito sa kasunod na tuwirang sinabi.
- source_word: Ὡμοιώθη
  choice: maihahalintulad
  rationale: Ang pariralang ito ay natural na pormula ng paghahambing sa Tagalog at angkop sa aorist passive ng ὁμοιόω; hindi nito ipinahihiwatig na literal na nagbago ang kalagayan ng kaharian.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Karaniwan, malinaw, at marangal na salin ito ng natatanging pahayag ni Mateo tungkol sa paghahari ng Diyos.
- source_word: ἀνθρώπῳ
  choice: isang tao
  rationale: Bagaman panlalaki ang anyong Griyego, ang “isang tao” ay likas sa Tagalog at hindi nag-aalis sa posibilidad na lalaki ang tauhan; walang panghalip na kasarian sa kasunod na sugnay.
- source_word: σπείραντι
  choice: naghasik
  rationale: Tuwirang ipinapahayag ng aspektong perpektibo ang natapos na kilos ng aorist participle.
- source_word: καλὸν σπέρμα
  choice: mabuting binhi
  rationale: Pinananatili nito ang kalidad na ipinahihiwatig ng καλός at inihahanda ang kaibahan sa masasamang damo sa kasunod na salaysay.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: sa kanyang bukid
  rationale: Ang “bukid” ay tuwiran at karaniwang katumbas ng ἀγρός, at malinaw na ipinakikitang pag-aari iyon ng naghahasik.
theological_decisions:
- issue: Pagbibigay-salin sa pormula ni Mateo tungkol sa kaharian
  choice: ang kaharian ng langit
  alternative: ang kaharian ng mga langit
  rationale: Ang isahang “langit” ay natural sa Tagalog at pinananatili ang kahulugan ng katangi-tanging pahayag ni Mateo nang walang alanganing literalismo.
- issue: Lakas ng Ὡμοιώθη sa pambungad ng talinghaga
  choice: maihahalintulad
  alternative: ay tulad / naging tulad
  rationale: Pinananatili ng passive na “maihahalintulad” ang paghahambing at ang ilang pormal na kulay ng Griyego, ngunit iniiwasang ipakahulugang ang kaharian ay literal na nagbago at naging katulad ng tao.
- issue: Saklaw ng paghahambing sa talinghaga
  choice: maihahalintulad sa isang taong naghasik
  alternative: 'ganito ang kaharian ng langit: isang tao ang naghasik'
  rationale: Hindi nilulutas nang tahasan kung ang kaharian ay inihahambing lamang sa tao o sa buong sitwasyong isinasalaysay; pinananatili ang gramatikal na pagkakaugnay ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “talinghaga,” “kaharian ng langit,” “naghasik,” at “binhi” bilang pamilyar ngunit hindi lipas na bokabularyong biblikal. Hinati sa dalawang pangungusap ang pambungad upang maging natural ang daloy.
