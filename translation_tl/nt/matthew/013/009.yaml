  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: tl
  text: Ang may mga tainga ay makinig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ang may
  rationale: Ang artikulo at kasalukuyang participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang taong nagtataglay nito. Likas sa Tagalog ang maikling generic na pariralang “Ang may,” at hindi nito kailangang tukuyin ang kasarian.
- source_word: ὦτα
  choice: mga tainga
  rationale: Maramihan ang salitang Griyego, kaya pinananatili ito sa “mga tainga.”
- source_word: ἀκουέτω
  choice: ay makinig
  rationale: Ipinahahayag ng “makinig” ang utos na tumanggap nang may pansin, hindi lamang ang pisikal na makarinig. Sa ganitong pangungusap, likas na naihahatid ng anyong ito ang pangatlong panauhang pautos.
theological_decisions:
- issue: Generic na panlalaking anyong isahan sa Griyego
  choice: Ang may mga tainga ay makinig.
  alternative: Ang sinumang may mga tainga ay makinig.
  rationale: Bagaman panlalaking isahan ang anyong gramatikal sa Griyego, generic ang gamit nito. Ang Tagalog na “Ang may” ay likas na walang tinutukoy na kasarian at napapanatili ang pangkalahatang saklaw at maigsi, mariing anyo ng kasabihan.
translation_notes:
  register: Maikli, marangal, at natural sa modernong Filipino. Pinili ang “makinig” upang maipahiwatig ang masusing pagtanggap na likas sa konteksto, habang nananatiling malinaw sa karaniwang mambabasa.
