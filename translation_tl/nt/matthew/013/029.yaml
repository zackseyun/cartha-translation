  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: tl
  text: Ngunit sinabi niya, “Huwag, baka habang tinitipon ninyo ang mga damo[a] ay mabunot din ninyo ang trigo kasama ng mga ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy sa darnel, isang uri ng damong kahawig ng trigo lalo na sa unang yugto ng paglaki nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: sinabi niya
  rationale: Ang pangkasaysayang pangkasalukuyan sa Griyego ay likas na isinasalaysay sa Filipino gamit ang pangnagdaan.
- source_word: Οὔ
  choice: Huwag
  rationale: Sa konteksto, hindi lamang ito pagtanggi kundi pagbabawal sa iminungkahing pagbunot; natural sa Filipino ang “Huwag.”
- source_word: μήποτε
  choice: dahil baka
  rationale: Ipinahahayag nito ang babala tungkol sa posibleng di-kanais-nais na bunga nang hindi sinasabing tiyak itong mangyayari.
- source_word: συλλέγοντες
  choice: sa pagbunot ninyo
  rationale: Bagaman literal na “pagtitipon,” ang aktuwal na kilos sa mga damo ay likas na ipinahahayag bilang pagbunot sa Filipino; kasabay ito ng kilos na maaaring makabunot sa trigo.
- source_word: ζιζάνια
  choice: mga damo
  rationale: Malinaw at pangkaraniwang tawag ito sa hindi kanais-nais na halamang tumutubo sa taniman; inilalagay sa talababa ang posibleng mas tiyak na pagkakakilanlan.
- source_word: ἐκριζώσητε
  choice: mabunot ... ang trigo
  rationale: Ipinahihiwatig ng pandiwa ang pag-alis mula sa ugat. Ang “mabunot” ay natural at malinaw, at ang anyong ma- ay angkop sa di-sinasadyang kasamang resulta.
- source_word: ἅμα αὐτοῖς
  choice: kasama ng mga iyon
  rationale: Pinananatili nito ang diwang ang trigo ay maaaring matanggal kasabay ng mga damo.
- source_word: σῖτον
  choice: trigo
  rationale: Sa kontekstong pang-agrikultura at sa paghahambing sa ζιζάνια, trigo ang pinakamalamang na tinutukoy.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ζιζάνια sa kilalang talinghaga
  choice: mga damo
  alternative: mga pangsirang damo; darnel
  rationale: Hindi kailangan ng talata ang tiyak na botanikong pagkakakilanlan. Pinananatiling madaling maunawaan ang pangunahing teksto habang itinatala sa talababa ang posibleng mas tiyak na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “dahil baka” upang malinaw na maiugnay ang pagbabawal sa posibleng bunga, at iniwasan ang arkaiko o labis na teknikal na katawagan sa pangunahing teksto.
