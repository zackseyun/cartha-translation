  source_fidelity: 'Tapat ang pangunahing daloy sa Griyego: ang ibang mga binhi ay nahulog sa mga tinik, umusbong ang mga tinik, at ang mga ito ang pumigil sa binhi. Ang “nahulog,” “sa gitna ng mga tinik,” at “tumubo” ay angkop na mga katumbas. Gayunman, ang panghalip na “ang mga iyon” matapos ang “mga tinik” ay maaaring pansamantalang magmukhang ang mga tinik mismo ang sinakal. Ligtas at makatuwirang tahasang tukuyin ang mga binhi, gaya rin ng ginagawa ng audit trail sa Ingles.'
