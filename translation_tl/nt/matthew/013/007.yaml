  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: tl
  text: Ang ibang mga binhi naman ay nahulog sa gitna ng mga tinik,[a] at tumubo ang mga tinik at sinakal ang mga binhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “sa ibabaw ng mga tinik”; isinaling “sa gitna ng mga tinik” upang maging natural sa kontekstong pang-agrikultura.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Ang ibang mga binhi
  rationale: Pang-uring neutral na maramihan na ginamit bilang pangngalan at tumutukoy sa binhing binanggit sa konteksto; nilinaw ang ipinahihiwatig na referent para maging natural sa Tagalog.
- source_word: δὲ
  choice: naman
  rationale: Banayad na pang-ugnay na nagpapatuloy sa sunod-sunod na pangyayari sa talinghaga, hindi matinding pagsalungat.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Tuwirang pinananatili ang diwa ng πίπτω na ‘mahulog,’ sa halip na palitan ng mas mapagpaliwanag na ‘naihasik.’
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: sa gitna ng mga tinik
  rationale: Bagaman maaaring literal na ‘sa ibabaw ng mga tinik,’ mas likas sa kontekstong pang-agrikultura ang binhing nahulog sa lugar na may mga halamang matinik.
- source_word: ἀκάνθας / ἄκανθαι
  choice: mga tinik
  rationale: Karaniwan at malinaw na katumbas na maaaring tumukoy sa mga halamang matinik, hindi lamang sa mismong tulis ng mga ito.
- source_word: ἀνέβησαν
  choice: tumubo
  rationale: Likas na Tagalog para sa paglitaw at paglaki ng mga halaman, habang pinananatili ang larawan ng mga tinik na umusbong.
- source_word: ἔπνιξαν
  choice: sinakal
  rationale: Pinananatili ang matingkad na metapora ng πνίγω, kung saan hinadlangan ng mga tinik ang paglago ng mga binhi.
- source_word: αὐτά
  choice: ang mga iyon
  rationale: Panghalip na maramihan na tumutukoy sa naunang mga binhi; iniiwasang ulitin at gawing mas tahasan kaysa sa Griyego.
