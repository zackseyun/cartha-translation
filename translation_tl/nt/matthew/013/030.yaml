  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: tl
  text: Hayaan ninyong magkasamang lumago ang dalawa hanggang sa anihan. Sa panahon ng pag-aani, sasabihin ko sa mga mang-aani, ‘Ipunin muna ninyo ang mga damo[a] at talian ang mga ito nang bungkos-bungkos upang sunugin ang mga ito. Ngunit tipunin ninyo ang trigo sa aking kamalig.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga damong darnel,” isang damong kahawig ng trigo; tradisyonal na “mga tare.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Hayaan ninyo
  rationale: Ipinapahayag ang mapagpahintulot na utos ng aorist imperative ng ἀφίημι sa natural na modernong Tagalog.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: lumaking magkasama ang dalawa
  rationale: Pinananatili ang diwa ng συν- na magkasamang paglaki at ang tahasang pagtukoy ng ἀμφότερα sa dalawang uri ng halaman.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: hanggang sa anihan
  rationale: Ang “anihan” ay natural at malinaw na tumutukoy sa tiyak na pangyayari ng pag-aani sa talinghaga.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Sa panahon ng pag-aani
  rationale: Pinananatili ang temporal na diwa ng καιρός bilang panahon o takdang pagkakataon ng pag-aani.
- source_word: θερισταῖς
  choice: mga mang-aani
  rationale: Karaniwan at madaling maunawaang katawagan sa mga taong nagsasagawa ng pag-aani.
- source_word: Συλλέξατε πρῶτον
  choice: Ipunin muna ninyo
  rationale: Ang “muna” ay likas na naghahayag ng pagkakasunod-sunod na ipinahihiwatig ng πρῶτον.
- source_word: τὰ ζιζάνια
  choice: mga damo
  rationale: Madaling maunawaan ng ordinaryong mambabasa; inilalagay sa talababa ang mas tiyak ngunit di-pamilyar na pagkakakilanlang darnel.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: talian ang mga ito nang bungkos-bungkos
  rationale: Inilalarawan nang kongkreto at natural ang pagtatali ng mga damo upang maging mga bungkos.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: upang sunugin
  rationale: Malinaw na pinananatili ang layuning ipinahahayag ng articular infinitive nang hindi dinaragdagan ang larawan.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: Ngunit tipunin ninyo ang trigo sa aking kamalig
  rationale: Ang “ngunit” ay nagpapanatili sa pagsalungat ng δέ, at ang “kamalig” ay angkop na imbakan ng inaning trigo.
theological_decisions:
- issue: Larawan ng pangwakas na paghihiwalay sa talinghaga
  choice: Panatilihin lamang ang larawang pang-agrikultura sa mismong salin.
  alternative: Gawing tahasan sa talata ang paghatol o ganap na pagkapuksa.
  rationale: Ang paliwanag sa eskatolohikal na kahulugan ay ibinibigay sa bandang huli ng kabanata; hindi ito dapat ipasok nang maaga sa pananalita ng talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang magalang na pangmaramihang anyong “ninyo” sa mga utos at iniwasan ang labis na teknikal o makalumang bokabularyo.
