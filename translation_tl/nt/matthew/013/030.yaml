  to: Hayaan ninyong magkasamang lumago ang dalawa hanggang sa anihan. Sa panahon ng pag-aani, sasabihin ko sa mga mang-aani, ‘Ipunin muna ninyo ang mga damo[a] at talian ang mga ito nang bungkos-bungkos upang sunugin ang mga ito. Ngunit tipunin ninyo ang trigo sa aking kamalig.’
