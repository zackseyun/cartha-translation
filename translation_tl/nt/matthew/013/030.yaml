  source_fidelity: Tumpak na naihahatid ng salin ang mapagpahintulot na utos, ang sabayang paglago ng dalawang pananim hanggang anihan, ang pagkakasunod ng mga utos sa mga mang-aani, ang pagbubuklod ng mga damo para sunugin, at ang pagtitipon ng trigo sa kamalig. Ang pagdaragdag ng hayag na layon sa “sunugin ang mga ito” ay tumutugma sa inuulit na αὐτά sa Griyego.
