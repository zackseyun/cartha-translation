  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong agrikultural at pinanatili ang anyo ng talinghaga. Ang kuwit sa hulihan ay tumutugma sa pagpapatuloy ng pangungusap sa kasunod na talata.
