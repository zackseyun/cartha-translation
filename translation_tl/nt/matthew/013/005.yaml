  source_fidelity: 'Tumpak ang pangunahing diwa: ibang binhi ang nahulog sa πετρώδη, kakaunti ang lupa, at mabilis itong sumibol dahil mababaw ang lupa. Gayunman, ang “mababatong lupa, na kakaunti lamang ang lupa” ay paulit-ulit at medyo malabo ang pagkakaugnay ng sugnay. Ang “mababatong lugar” ay mas malapit sa pangmaramihang τὰ πετρώδη at mas malinaw na naghihiwalay sa mabatong kinalagyan at sa manipis na lupang nasa ibabaw nito.'
