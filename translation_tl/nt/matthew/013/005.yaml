  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: tl
  text: Ang ibang binhi naman ay nahulog sa mababatong lugar,[a] kung saan kakaunti lamang ang lupa. Agad itong sumibol dahil mababaw ang lupa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga mababatong lugar”; tumutukoy ito sa manipis na lupa sa ibabaw ng batuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Ang ibang binhi naman
  rationale: Ang pangmaramihang neuter na ἄλλα ay tumutukoy nang eliptiko sa mga binhing nasa naunang talata; idinagdag ang “binhi” para sa linaw, at ipinahahayag ng “naman” ang paghahambing o paglipat ng eksena.
- source_word: ἔπεσεν
  choice: ay nahulog
  rationale: Tuwirang pinananatili ang kilos na “nahulog” sa larawan ng talinghaga, sa halip na ipakahulugang “naihasik.”
- source_word: ἐπὶ τὰ πετρώδη
  choice: sa mababatong lupa
  rationale: Likas sa makabagong Tagalog at tumutukoy sa bahaging manipis ang lupa sa ibabaw ng batuhan; nililinaw sa talababa ang literal na anyo.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: na kakaunti lamang ang lupa
  rationale: Malinaw at likas na paglalarawan sa lugar na walang makapal o maraming lupa, nang hindi nagpapasok ng higit sa sinasabi ng Griyego.
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: Agad itong sumibol
  rationale: Ang “agad” ay nagpapanatili sa temporal na diin ng εὐθέως, at ang “sumibol” ang likas na salitang agrikultural para sa paglitaw ng binhi.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: dahil mababaw ang lupa
  rationale: Natural na Tagalog para sa sanhi na ipinahahayag ng διά at para sa kawalan ng lalim ng lupa; pinananatili ang larawang agrikultural.
