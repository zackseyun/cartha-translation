  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: tl
  text: 'At natutupad sa kanila ang propesiya ni Isaias na nagsasabi: “Makikinig nga kayo, ngunit hinding-hindi kayo makauunawa; at titingin nga kayo, ngunit hinding-hindi kayo makakakita.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Sa pakikinig ay makikinig kayo ... at tumitingin ay titingin kayo.” Isa itong Hebreong paraan ng mariing pagpapahayag na naipasa sa siping Griyego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: natutupad
  rationale: Ang pangkasalukuyang balintiyak ay likas na naipahahayag sa Tagalog sa pamamagitan ng “natutupad,” nang hindi ipinipilit ang mas malakas na diwang “lubos na natutupad.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Ipinakikita ng parirala na ang propesiya ay nagkakaroon ng katuparan sa kalagayan ng mga taong tinutukoy.
- source_word: προφητεία Ἠσαΐου
  choice: ang propesiya ni Isaias
  rationale: Natural at tapat na Tagalog para sa konstruksiyong henitibo ng Griyego.
- source_word: ἡ λέγουσα
  choice: na nagsasabi
  rationale: Pinananatili nito ang tungkulin ng atributibong partisipyong nagpapakilala sa sipi.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Makikinig nga kayo
  rationale: Ipinahahayag ng “nga” ang diin ng Semitikong magkaugnay na pangngalan at pandiwa, habang nananatiling natural sa Tagalog.
- source_word: οὐ μὴ συνῆτε
  choice: ngunit hinding-hindi kayo makauunawa
  rationale: Ang “hinding-hindi” ay naghahatid ng mariing pagtanggi ng οὐ μή; ang “ngunit” ay natural na nagpapakita ng salungatan.
- source_word: βλέποντες βλέψετε
  choice: at titingin nga kayo
  rationale: Pinananatili ang paralelismo at diin ng naunang sugnay nang hindi ginagawang alanganin ang Tagalog.
- source_word: οὐ μὴ ἴδητε
  choice: ngunit hinding-hindi kayo makakakita
  rationale: Pinananatili ang pandiwang “makakita” ng Griyego at ang mariing pagtanggi, nang hindi tahasang ipinapasok sa pangunahing teksto ang interpretasyong “makabatid” o “maunawaan.”
theological_decisions:
- issue: Kalikasan ng katuparan ng propesiya
  choice: “natutupad sa kanila”
  alternative: “lubos na natutupad sa kanila” o “naipakikita sa kanila”
  rationale: Ipinahahayag na nagkakaroon ng katuparan ang propesiya sa kanila, ngunit hindi tinutukoy kung ito ay ganap na pagkumpleto, simpleng halimbawa lamang, o bunga ng isang partikular na mekanismo ng pagpapatigas.
- issue: Pisikal na pagtingin at tunay na pagkakita
  choice: “titingin ... ngunit ... hindi ... makakakita”
  alternative: “makakakita ... ngunit ... hindi makauunawa/makakilala”
  rationale: Pinananatili ang magkaibang pandiwang Griyego at ang sadyang tensiyon sa pagitan ng pagtingin at pagkakita, sa halip na lubusang lutasin ang metapora sa salin.
translation_notes:
  register: Modernong Filipino na dignidad ngunit madaling maunawaan. Ginamit ang “hinding-hindi” upang malinaw na maipahayag ang mariing negatibo, at ang “nga” upang katawanin ang diin ng inuulit na anyong Semitiko.
