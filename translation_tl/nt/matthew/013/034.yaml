  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: tl
  text: Sinabi ni Jesus sa mga tao ang lahat ng ito sa mga talinghaga, at wala siyang sinasabi noon sa kanila nang walang talinghaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at wala siyang sinabi sa kanila nang walang talinghaga.” Ang imperpektong pandiwang Griyego ay maaaring magpahiwatig ng nakaugalian o nagpapatuloy na pagkilos, o maisalin bilang simpleng nagdaang pagkilos.'
    reason: Pinananatili ang aspektuwal na kalabuan ng imperpektong ἐλάλει.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Pinananatili nito kapwa ang pagtuturo sa mga bagay na katatapos banggitin at ang saklaw na ‘lahat.’
- source_word: ἐλάλησεν
  choice: Sinabi
  rationale: Ang aspektong ganap ng aorist ay angkop na naipapahayag ng perpektibong ‘sinabi’ bilang buod ng pagtuturo ni Jesus.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Ipinahahayag nito ang paraan o midyum ng pagsasalita at natural ito sa makabagong Tagalog.
- source_word: τοῖς ὄχλοις
  choice: sa mga tao
  rationale: Ang ‘mga tao’ ay natural at madaling maunawaang tawag sa mga nagkakatipong tagapakinig; ipinananatili ng ‘mga’ ang anyong maramihan.
- source_word: χωρὶς παραβολῆς
  choice: nang walang talinghaga
  rationale: Pinananatili nito ang kahulugang ‘without’ at ang isahang anyo ng παραβολῆς.
- source_word: οὐδὲν ἐλάλει
  choice: hindi siya nagsasalita
  rationale: Ang imperpektibong ‘nagsasalita’ ay nagpapahiwatig ng nagpapatuloy o nakaugaliang paraan ng pagsasalita, samantalang pinananatili ang negatibong pahayag ng Griyego.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Malinaw na tumutukoy ito pabalik sa mga tao nang hindi inuulit ang buong parirala.
theological_decisions:
- issue: Diin ng imperpekto sa ikalawang sugnay
  choice: Isinalin bilang ‘hindi siya nagsasalita’ upang maipahiwatig ang nakaugaliang paraan ng pampublikong pagtuturo ni Jesus sa tagpong ito.
  alternative: 'Maaaring isalin sa simpleng nagdaang anyo: ‘wala siyang sinabi sa kanila nang walang talinghaga.’'
  rationale: Maaaring unawain ang ἐλάλει bilang duratibo o nakaugalian, ngunit maaari rin itong likas na isalin bilang simpleng nagdaan. Hindi pinalalawak ang pahayag bilang ganap na tuntunin para sa lahat ng pagkakataon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ‘mga tao’ sa halip na mas makaluma o di-likas na ‘mga karamihan,’ at pinanatili ang terminong ‘talinghaga.’
