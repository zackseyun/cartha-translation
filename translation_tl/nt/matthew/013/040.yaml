  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: tl
  text: Kaya, kung paanong tinitipon ang mga damong ligaw[a] at sinusunog sa apoy, gayon din ang mangyayari sa katapusan ng kapanahunan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa tradisyonal na salin, “mga tare.” Ang salitang Griyego ay tumutukoy sa mapaminsalang damong ligaw, malamang na darnel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa katapusan ng sanlibutan”; sa Griyego, “ng kapanahunan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Kaya, kung paanong
  rationale: Pinananatili ng “kaya” ang hinuha o pagpapatuloy na ipinahihiwatig ng οὖν, at malinaw na ipinakikilala ng “kung paanong” ang paghahambing ng ὥσπερ.
- source_word: συλλέγεται
  choice: tinitipon
  rationale: Ang pandiwa ay nasa kasalukuyang tinig na balintiyak at naglalarawan sa karaniwang pagtitipon ng mga damo upang itapon o sunugin. Likas sa Tagalog ang “tinitipon” sa larawang pang-agrikultura.
- source_word: τὰ ζιζάνια
  choice: ang mga damo
  rationale: Ang ζιζάνια ay tumutukoy sa mapaminsalang panirang-damo, malamang ay darnel. Ang “mga damo” ay malinaw at karaniwan sa modernong Tagalog; ipinaliliwanag sa talababa ang mas tiyak na kahulugan.
- source_word: πυρὶ καίεται
  choice: sinusunog sa apoy
  rationale: Tahasang pinananatili ang pagbanggit sa apoy at ang balintiyak na diwa ng καίεται. Ang “sa apoy” ay natural na Tagalog para sa paraang ginagamit sa pagsunog.
- source_word: οὕτως ἔσται
  choice: gayon din ang mangyayari
  rationale: Malinaw nitong inuugnay ang paghahambing sa mangyayari sa hinaharap, nang hindi dinaragdagan ang tiyak na detalye ng katuparan.
- source_word: ἐν τῇ συντελείᾳ
  choice: sa katapusan
  rationale: Ang συντέλεια ay maaaring mangahulugang pagtatapos o kaganapan. Ang “sa katapusan” ay malinaw at natural habang naaangkop sa kontekstong eskatolohikal.
- source_word: τοῦ αἰῶνος
  choice: ng kapanahunan
  rationale: Ang αἰών dito ay temporal na “panahon” o “kapanahunan,” hindi pangunahing tumutukoy sa pisikal na daigdig. Pinananatili ng “kapanahunan” ang diwang ito nang hindi nagdaragdag ng demonstratibong “kasalukuyang.”
theological_decisions:
- issue: Ang eskatolohikal na pariralang τοῦ αἰῶνος
  choice: ng kapanahunan
  alternative: ng sanlibutan
  rationale: Pinananatili ng “kapanahunan” ang temporal na diwa ng αἰών at iniiwasang ipakahulugan ito agad bilang pagkawasak o katapusan ng pisikal na daigdig. Hindi rin ito naglalapat ng isang partikular na balangkas tungkol sa mga huling panahon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kung paanong … gayon din” upang mapanatili ang pormal na paghahambing, at iniwasan ang mga salitang labis na teknikal sa pangunahing teksto.
