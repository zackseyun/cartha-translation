  source_fidelity: Tumpak na naipapahayag ng draft ang lohikal na ugnayan ng ὥσπερ οὖν, ang pagtitipon at pagsunog ng ζιζάνια, at ang hinaharap na paghahambing sa ἐν τῇ συντελείᾳ τοῦ αἰῶνος. Gayunman, ang “mga damo” ay maaaring tumukoy nang malawakan sa mga halaman o damo; ang “mga damong ligaw” ay mas malinaw na katumbas ng mapaminsalang weeds sa talinghaga.
  naturalness: Likas at marangal ang hulmaing “kung paanong … gayon din.” Mas natural at mas tiyak sa modernong Filipino ang “mga damong ligaw” kaysa sa payak na “mga damo” sa kontekstong ito. Inilagay ang mga panandang talababa bago ang pangwakas na tuldok.
  terminology: Napananatili ang “kapanahunan” para sa αἰών, na mas tapat kaysa “sanlibutan” sa pangunahing teksto. Ang talababa para sa ζιζάνια ay dapat magbigay ng tunay na tradisyonal na alternatibo (“mga tare”), hindi ng transliterasyong “mga zizania,” at hindi kailangang idagdag ang detalye tungkol sa pagkakahawig nito sa trigo.
  issues:
