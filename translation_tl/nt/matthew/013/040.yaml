    rationale: Ang “zizania” ay transliterasyon ng Griyego, hindi karaniwang tradisyonal na salin sa Filipino. Ang tradisyonal na alternatibong kaugnay ng English “tares” ay mas maayos na ibigay bilang “mga tare.”
