id: MAT.13.42
reference: Matthew 13:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: tl
  text: at itatapon nila ang mga iyon sa nagliliyab na hurno. Doon ay magkakaroon ng pagtangis at pagngangalit ng mga ngipin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: itatapon nila
  rationale: Ipinapahayag ng panghinaharap na anyo ng βάλλω ang sapilitang paghagis o pagtatapon. Ang “itatapon” ay natural sa makabagong Filipino at pinananatili ang tindi ng kilos.
- source_word: αὐτούς
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip sa pangkat na binanggit sa naunang konteksto. Iniwasan ng “ang mga iyon” ang alanganing pag-uulit na “nila sila” habang malinaw na pinananatili ang tinutukoy.
- source_word: κάμινον τοῦ πυρός
  choice: nagliliyab na hurno
  rationale: Natural na inililipat sa Filipino ang pariralang may genitive bilang panuring. Pinananatili nito ang konkretong larawan ng isang hurnong may matinding apoy nang hindi ito pinapalitan ng mas tiyak na terminong doktrinal.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Tuwirang pinananatili ang lokatibong diin na tumutukoy sa hurnong kababanggit lamang.
- source_word: κλαυθμός
  choice: pagtangis
  rationale: Ang “pagtangis” ay dignidad at malinaw na katumbas ng matinding pag-iyak, at angkop sa paulit-ulit na pormula sa Mateo.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Pinananatili nito ang nakagawiang biblikal na idyoma nang hindi nililimitahan kung ito ay nagpapahiwatig ng dalamhati, galit, o kapwa.
- source_word: καὶ
  choice: at
  rationale: Pinanatili ang payak na pang-ugnay upang ipakita ang pagpapatuloy mula sa naunang talata.
theological_decisions:
- issue: Larawan ng paghuhukom sa κάμινον τοῦ πυρός
  choice: Pinanatili bilang konkretong larawan na “nagliliyab na hurno.”
  alternative: Ipaliwanag ito bilang “apoy ng impiyerno.”
  rationale: Ang teksto mismo ay gumagamit ng metapora ng hurno. Hindi ito dapat palitan ng mas tiyak na terminong teolohikal na wala sa parirala.
- issue: Saklaw ng “pagtangis at pagngangalit ng mga ngipin”
  choice: Pinanatili ang buong pormula nang walang paliwanag sa mismong teksto.
  alternative: Ipakahulugan ang pagngangalit bilang galit lamang o ang buong parirala bilang lungkot lamang.
  rationale: Maaaring saklawin ng pahayag ang matinding dalamhati at marahil ay poot o desperasyon; hindi nilulutas ng salin ang nananatiling pag-igting ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hurno” bilang karaniwang salitang nauunawaan sa kasalukuyan, at pinanatili ang pormulang “pagtangis at pagngangalit ng mga ngipin” dahil tumpak at pamilyar ito sa kontekstong biblikal.
