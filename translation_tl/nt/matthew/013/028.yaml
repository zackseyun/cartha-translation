id: MAT.13.28
reference: Matthew 13:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Isang kaaway ang gumawa nito.” Sinabi naman sa kanya ng mga alipin[a], “Kung gayon, gusto mo bang pumunta kami at tipunin ang mga iyon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lingkod.” Ang salitang Griyego ay maaaring mangahulugang mga alipin o mga lingkod, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: Sinabi
  rationale: Karaniwan at tuwirang pandiwa ito para sa pagsasalita sa isang salaysay.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: Isang kaaway
  rationale: Bagaman literal na may salitang ‘tao,’ sapat at likas sa Tagalog ang ‘isang kaaway’ upang tukuyin ang taong gumawa nito.
- source_word: τοῦτο ἐποίησεν
  choice: ang gumawa nito
  rationale: Tuwirang ipinapahayag nito ang natapos na kilos at pinananatili ang demonstratibong ‘ito.’
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili ng ‘mga alipin’ ang nakapailalim at di-malayang kalagayang ipinahihiwatig ng δοῦλοι sa sambahayan; inilalagay sa talababa ang mas banayad na ‘mga lingkod.’
- source_word: Θέλεις
  choice: gusto mo bang
  rationale: Likas at malinaw na makabagong Tagalog para sa pagtatanong tungkol sa kagustuhan.
- source_word: οὖν
  choice: Kung gayon
  rationale: Ipinakikita nito na ang tanong ng mga alipin ay tugon o bunga ng sinabi ng may-ari, nang hindi labis na pinatitindi ang lohikal na ugnayan.
- source_word: ἀπελθόντες
  choice: pumunta kami
  rationale: Likas na isinama sa tanong ang kilos ng pagpunta bago ang pagtitipon.
- source_word: συλλέξωμεν
  choice: tipunin
  rationale: Tumpak na inilalarawan ang pagtitipon ng mga damong tinutukoy, nang hindi idinaragdag ang di-tahasang kilos na pagbunot.
- source_word: αὐτά
  choice: ang mga iyon
  rationale: Ang panghalip na maramihan ay tumutukoy sa mga damong binanggit sa naunang konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλοι sa konteksto ng talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas malinaw na pinananatili ng ‘mga alipin’ ang panlipunang kalagayang ipinahihiwatig ng salitang Griyego, samantalang itinatala ang ‘mga lingkod’ bilang lehitimong alternatibo. Hindi nakasalalay sa pagkakaibang ito ang pangunahing punto ng talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Sinabi naman’ upang maipakita ang paglipat sa tugon ng mga alipin, at iniwasang idagdag ang ‘bunutin’ dahil hindi iyon tahasang nasa talata.
