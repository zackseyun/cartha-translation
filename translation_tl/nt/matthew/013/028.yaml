  source_fidelity: Tapat ang salin sa Griyego. Ang “Isang kaaway ang gumawa nito” ay wastong idiomatikong pagsasalin ng Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. Naipapahayag din ng “gusto mo bang pumunta kami at tipunin ang mga iyon?” ang θέλεις ... ἀπελθόντες συλλέξωμεν αὐτά nang hindi idinaragdag ang ideya ng pagbunot.
