  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: tl
  text: Nang matapos ni Jesus ang mga talinghagang ito, umalis siya roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “At nangyari, nang matapos ni Jesus ang mga talinghagang ito, umalis siya roon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Nang
  rationale: Ang pariralang Griyego ay nagsisilbing likas na transisyong pasalaysay at nagpapakilala ng sugnay na temporal. Ang “Nang” ay malinaw at natural sa makabagong Tagalog nang hindi pinabibigat ang pangungusap sa literal na “At nangyari na nang.”
- source_word: ἐτέλεσεν
  choice: matapos
  rationale: Ang τελέω ay nangangahulugang dalhin sa wakas o tapusin. Sa kayariang “Nang matapos,” malinaw na nauna ang pagtatapos ng pagtuturo bago ang pag-alis.
- source_word: ὁ Ἰησοῦς
  choice: ni Jesus
  rationale: Ang aktor ng pandiwang “matapos” ay likas na ipinapahayag sa Tagalog sa pamamagitan ng “ni Jesus.”
- source_word: τὰς παραβολὰς ταύτας
  choice: ang mga talinghagang ito
  rationale: Ang “talinghaga” ang kinikilalang katumbas ng παραβολή sa konteksto ng pagtuturo ni Jesus, at pinananatili ng “mga” at “ito” ang bilang at pagtukoy sa mga naunang talinghaga.
- source_word: μετῆρεν
  choice: umalis
  rationale: Ipinahihiwatig ng μεταίρω ang paglisan o paglipat mula sa isang lugar. Ang “umalis” ay natural, tumpak, at hindi nagdaragdag ng paraang hindi binanggit sa teksto.
- source_word: ἐκεῖθεν
  choice: roon
  rationale: Ang “roon” ay maikli at likas na katumbas ng adberbyong nangangahulugang “mula sa lugar na iyon”; kasama ng “umalis,” malinaw na ang diwa ng paglisan mula roon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “talinghaga” bilang pamilyar na terminong biblikal, at pinaikli ang Semitikong-Griyegong transisyong pasalaysay upang maging natural sa Filipino. Ang panandang [a] ay inilagay sa dulo ng talata dahil tumutukoy ang talababa sa mas literal na anyo ng buong pangungusap.
