  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: tl
  text: Muli, ang kaharian ng langit ay tulad ng isang mangangalakal[a] na naghahanap ng maiinam na perlas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “isang tao, isang mangangalakal, na naghahanap ng maiinam na perlas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Muli
  rationale: Ipinakikilala nito ang isa pang paghahambing sa magkakasunod na talinghaga tungkol sa kaharian at natural nitong ipinagpapatuloy ang daloy.
- source_word: ὁμοία ἐστὶν
  choice: ay tulad ng
  rationale: Karaniwan at malinaw itong pananalita sa Filipino para sa paghahambing sa isang talinghaga.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Pinananatili nito ang katangi-tanging pananalita ni Mateo at likas itong basahin sa Filipino.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: isang mangangalakal
  rationale: Tuwirang itinuturo ng pariralang Griyego ang mangangalakal bilang kagyat na katulad ng kaharian. Hindi na kailangang ulitin sa pangunahing teksto ang ‘isang tao’ dahil ipinahihiwatig na ito ng ‘mangangalakal,’ ngunit itinala ang mas literal na anyo sa talababa.
- source_word: ζητοῦντι
  choice: na naghahanap
  rationale: Ipinahahayag nito nang natural ang nagpapatuloy na gawain ng mangangalakal.
- source_word: καλοὺς μαργαρίτας
  choice: maiinam na perlas
  rationale: Sa kontekstong pangkalakalan, ang καλός ay tumutukoy sa husay o magandang uri, hindi lamang sa panlabas na ganda. Ang ‘maiinam’ ay natural at hindi labis na nagpapakahulugang mahal ang mga ito.
theological_decisions:
- issue: Saklaw ng paghahambing sa pormula ng talinghaga
  choice: Inihahambing kaagad ang kaharian sa mangangalakal.
  alternative: Ang kaharian ay tulad ng buong pangyayaring kinasasangkutan ng mangangalakal na naghahanap ng maiinam na perlas.
  rationale: Sa pagkakabuo ng Griyego, ang ἀνθρώπῳ ἐμπόρῳ ang tuwirang kasunod na pinaghahambingan. Hindi nililimitahan ng salin ang mas malawak na kabuluhan ng buong tagpo na nagpapatuloy sa susunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘maiinam’ upang ipahiwatig ang mataas na uri o kalidad nang hindi ginagawang teknikal ang pananalita o ipinapalagay na presyo lamang ang tinutukoy.
