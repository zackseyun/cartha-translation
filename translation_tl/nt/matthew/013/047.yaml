    rationale: Inilalarawan ng participle ang lambat bilang kumakalap o nagtitipon; ang "nakahuli" ay nakatuon sa resulta ng paghuli sa halip na sa pagkalap.
  - severity: low
    issue: Ang "ng lahat ng uri ng isda" ay hindi gaanong tuwirang nagpapakita ng "mula sa bawat uri."
    rationale: Ang ἐκ ay mas malinaw na naipapahayag sa "mula sa bawat uri."
