  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: tl
  text: Muli, ang kaharian ng langit ay tulad ng isang malaking lambat[a] na inihagis sa dagat at kumakalap ng isda mula sa bawat uri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pukot”; ang salitang Griyego ay tumutukoy sa isang malaking lambat na inilalatag at hinihila sa tubig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kumakalap mula sa bawat uri.” Hindi tahasang binanggit sa Griyego ang “isda,” ngunit ipinahihiwatig ito ng larawan ng pangingisda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Muli
  rationale: Likas at maikli itong panandang nagpapakilala ng isa pang talinghaga sa pagkakasunod-sunod.
- source_word: ὁμοία ἐστὶν
  choice: ay tulad ng
  rationale: Karaniwang pormula ng paghahambing sa Tagalog at malinaw na nagpapanatili sa anyong pagtutulad.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Pinananatili ang natatanging pananalita ni Mateo nang hindi ito pinapalitan ng “kaharian ng Diyos” o binibigyang-kahulugang “paghahari.”
- source_word: σαγήνῃ
  choice: isang malaking lambat
  rationale: Tumutukoy ang salitang Griyego sa isang malaking lambat na hinihila sa tubig. Mas madaling maunawaan ng karaniwang mambabasa ang “malaking lambat” kaysa sa teknikal o panrehiyong “pukot,” habang ipinapaliwanag sa talababa ang tiyak na uri nito.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: na inihagis sa dagat
  rationale: Pinananatili ang balintiyak na anyo at ang tahasang “dagat” ng Griyego; ang “inihagis” ay likas sa konteksto ng pangingisda.
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: at nakahuli ng lahat ng uri ng isda
  rationale: Ang “nakahuli” ay natural na paglalarawan sa ginagawang pagtipon ng lambat. Idinagdag ang “isda” bilang malinaw na ipinahihiwatig ng larawang pangingisda, at itinala sa talababa na walang tahasang layon ang Griyego.
theological_decisions:
- issue: Kahulugan ng “ἡ βασιλεία τῶν οὐρανῶν”
  choice: Panatilihin bilang “ang kaharian ng langit.”
  alternative: “ang kaharian ng Diyos” o “ang paghahari ng langit”
  rationale: Pinananatili nito ang natatanging pananalita ni Mateo at hindi nilulutas sa pagsasalin kung pangunahing tumutukoy ang parirala sa sakop, pamamahala, o paghahari.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pamilyar na “malaking lambat” sa pangunahing teksto at inilagay sa talababa ang mas tiyak ngunit hindi gaanong pangkalahatang katawagang “pukot.”
