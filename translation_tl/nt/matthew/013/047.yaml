  source_fidelity: Ang "Muli," "ang kaharian ng langit," at "inihagis sa dagat" ay tapat sa Griyego. Gayunman, ang "nakahuli ng lahat ng uri ng isda" ay bahagyang lumilihis sa συναγαγούσῃ, na tumutukoy sa pagkalap/pagtitipon ng lambat, at ang "lahat ng uri" ay hindi gaanong malinaw na naipapakita ang ἐκ παντὸς γένους ("mula sa bawat uri").
  naturalness: Natural at angkop sa makabagong Filipino Tagalog ang rebisyong "kumakalap ng isda mula sa bawat uri." Tahasan nitong tinutukoy ang isda, na malinaw na ipinahihiwatig ng larawan ng pangingisda, habang pinananatili ng talababa na hindi ito tahasang nasa Griyego.
  terminology: Ang "kaharian ng langit" ay dapat panatilihin. Ang "malaking lambat" ay mauunawaan at ang talababa sa "pukot" ay nagbibigay ng mas tiyak na kahulugang leksikal ng σαγήνη nang hindi pinipilit ang isang mas panrehiyong termino sa pangunahing teksto.
