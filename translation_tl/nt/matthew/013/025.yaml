id: MAT.13.25
reference: Matthew 13:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: tl
  text: Ngunit habang natutulog ang mga tao, dumating ang kaaway ng taong iyon, naghasik ng mga damong ligaw sa gitna ng trigo, at umalis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ang mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy sa mga taong nabanggit sa tagpo, malamang sa mga manggagawa; hindi kailangang tukuyin bilang mga lalaking nasa hustong gulang. Likas at malawak ang “mga tao” sa modernong Tagalog.
- source_word: αὐτοῦ ὁ ἐχθρός
  choice: ang kaaway ng taong iyon
  rationale: Malinaw na ipinahihiwatig ng αὐτοῦ na kaaway siya ng may-ari/naghasik sa naunang talata. Iniiwasan ng “kanyang kaaway” ang posibleng malabong reperensiya sa Tagalog.
- source_word: ἐπέσπειρεν
  choice: naghasik
  rationale: Ang pandiwa ay nangangahulugang naghasik sa ibabaw o kasabay ng naunang naihasik; sapat na ipinakikita ng kasunod na “sa gitna ng trigo” ang mapanirang paghahalo.
- source_word: ζιζάνια
  choice: mga damong ligaw
  rationale: Ang ζιζάνια ay mapaminsalang halamang kahawig ng trigo, karaniwang darnel, ngunit walang malawak at tiyak na katawagang Tagalog. Ang “mga damong ligaw” ay natural at hindi nagbibigay ng labis na espesipikong pagkakakilanlan.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: sa gitna ng trigo
  rationale: Tuwirang pinananatili ang larawan ng mga damong inihasik sa pagitan at kahalo ng trigo.
theological_decisions:
- issue: Pagkakakilanlan ng “mga tao”
  choice: ang mga tao
  alternative: ang mga lalaki / mga manggagawa
  rationale: Hindi nililinaw ng talata ang kanilang tiyak na papel o kasarian bilang mahalagang punto. Pinananatili ng salin ang pangkalahatang saklaw ng ἀνθρώπους nang hindi nagdaragdag ng interpretasyon.
- issue: Eksaktong uri ng ζιζάνια
  choice: mga damong ligaw
  alternative: darnel / mapanirang damo
  rationale: Hindi nakasalalay ang punto ng talinghaga sa modernong botanikong pagtukoy. Ang pangkalahatang katawagan ay nagpapanatili sa larawan nang hindi inaangkin ang higit sa tiyak na ipinahihiwatig ng salita.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinili ang payak na ayos ng pangungusap at bokabularyong madaling maunawaan, habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Griyego.
