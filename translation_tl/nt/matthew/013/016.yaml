base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: tl
  text: Ngunit mapapalad ang inyong mga mata[a] sapagkat nakakakita, at ang inyong mga tainga sapagkat nakaririnig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “dahil nakakakita ... dahil nakaririnig.” Ang pangatnig na Griyego ay maaari ring isalin bilang “dahil” sa dalawang parirala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat sa naunang sinabi tungkol sa mga tumitingin ngunit hindi nakakakita at nakikinig ngunit hindi nakakarinig.
- source_word: μακάριοι
  choice: pinagpala
  rationale: Angkop sa pananalitang tulad ng beatitude at nagpapahiwatig ng mabuting kalagayang may pagsang-ayon ng Diyos, hindi lamang pansariling ligaya.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: ang inyong mga mata
  rationale: Likas at marangal na Tagalog para sa pariralang Griyego, habang pinananatili ang tuon sa mga mata ng mga alagad.
- source_word: ὅτι βλέπουσιν
  choice: sapagkat nakakakita ang mga ito
  rationale: Ginagamit ang sanhiang diwa ng ὅτι at tahasang tinutukoy ng panghalip ang mga mata.
- source_word: τὰ ὦτα ὑμῶν
  choice: ang inyong mga tainga
  rationale: Likas na salin ng pariralang may pagmamay-ari at kaagapay ng ‘inyong mga mata.’
- source_word: ὅτι ἀκούουσιν
  choice: sapagkat nakakarinig ang mga ito
  rationale: Pinananatili ang sanhiang diwa ng ὅτι at ang payak na pandiwang pandama.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: nakakakita / nakakarinig
  rationale: Pinananatili ang literal na wikang pandama at hinahayaang ang konteksto ang magpahiwatig ng mas malalim na espirituwal na kahulugan.
theological_decisions:
- issue: Kung gagawing tahasang espirituwal ang pagkakita at pagkarinig
  choice: Panatilihin ang literal na ‘nakakakita’ at ‘nakakarinig.’
  alternative: ‘nakauunawa’ o ‘nakakikilala’
  rationale: Bagaman ipinahihiwatig ng konteksto ang espirituwal na pagtanggap at pagkaunawa, ang talata mismo ay gumagamit ng karaniwang mga pandiwa para sa pagkakita at pagkarinig. Pinananatili nito ang teolohikal na tensiyon.
- issue: Ang ugnayang ipinahahayag ng ὅτι
  choice: 'Unawain bilang sanhi: ‘sapagkat.’'
  alternative: Maaaring katawanin bilang ‘dahil’ o ang mas paliwanag na ‘sa pagkakita ... sa pagkarinig.’
  rationale: Sa konteksto, natural na ibinibigay ng ὅτι ang dahilan kung bakit tinatawag na pinagpala ang mga mata at tainga, ngunit itinatala sa talababa ang alternatibong paraan ng pagpapahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘inyong’ bilang angkop na pangmaramihang anyo at upang mapanatili ang dignidad ng pananalita. Inulit ang ‘ang mga ito’ upang maging malinaw na ang mga mata at tainga ang simuno ng mga pandiwa.
