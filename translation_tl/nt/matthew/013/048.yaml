  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: tl
  text: Nang mapuno ang lambat, iniahon nila ito sa pampang at, pagkaupo nila, tinipon ang mabubuting isda sa mga lalagyan[a], ngunit itinapon sa labas ang mga bulok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sisidlan.” Pangkalahatang salita ang ginamit sa Griyego para sa mga lalagyan; hindi nito tiyak na sinasabing mga basket ang mga ito.
    reason: lexical_alternative
  - marker: b
    text: O “mga hindi mapapakinabangan.” Ang salitang Griyego ay maaaring mangahulugang “bulok,” “panis,” o, sa mas pangkalahatang diwa, “walang silbi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ang lambat ... ito
  rationale: Tumutukoy ang panghalip sa lambat na binanggit sa naunang talata. Ang pag-uulit ng tinutukoy ay likas at malinaw sa Tagalog.
- source_word: ἐπληρώθη
  choice: mapuno
  rationale: Tuwirang inilalarawan ang lambat na napuno ng mga isda; ang anyong “Nang mapuno” ay natural para sa aorist passive sa salaysay.
- source_word: ἀναβιβάσαντες
  choice: iniahon nila
  rationale: Ipinahihiwatig ng pandiwa ang paghila o pagdadala ng lambat mula sa tubig paakyat sa lupa. Ang “iniahon” ay maikli at likas sa konteksto ng pangingisda.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sa pampang
  rationale: Ang αἰγιαλός ay pampang o dalampasigan. Hindi ipinapalagay ng “pampang” na mabuhangin ang lugar.
- source_word: καθίσαντες
  choice: Pagkaupo nila
  rationale: Pinananatili nito ang pagkakasunod-sunod ng mga kilos habang natural ang daloy sa Tagalog.
- source_word: συνέλεξαν
  choice: tinipon nila
  rationale: Ipinapahayag nito ang pagtitipon o pangongolekta habang pinagbubukod ang huli.
- source_word: τὰ καλὰ
  choice: ang mabubuting isda
  rationale: Bagaman hindi inuulit sa Griyego ang salitang “isda,” malinaw itong ipinahihiwatig ng konteksto at kailangang banggitin upang maging natural at malinaw sa Tagalog.
- source_word: εἰς ἄγγη
  choice: sa mga lalagyan
  rationale: Pangkalahatang salita ang ἄγγος para sa sisidlan o lalagyan; hindi nito tiyak na sinasabing mga basket ang ginamit.
- source_word: τὰ δὲ σαπρά
  choice: ngunit ... ang mga bulok
  rationale: Pinananatili ng “bulok” ang konkreto at matinding larawan ng σαπρός, habang kinikilala sa talababa ang mas pangkalahatang kahulugang “hindi mapapakinabangan.”
- source_word: ἔξω ἔβαλον
  choice: itinapon nila
  rationale: Likas itong Tagalog para sa pagtatapon o pag-aalis sa mga hindi dapat itabi; sapat na ipinahihiwatig ng pandiwa at konteksto ang pagtatapon sa labas.
theological_decisions:
- issue: Pagpapakahulugan sa pagbubukod sa talinghaga
  choice: Isinalin ang talata bilang konkretong tagpo ng pangingisda, nang hindi pa inilalapat sa huling paghuhukom.
  alternative: Gumamit ng mga salitang tahasang tumutukoy sa paghuhukom o sa pagbubukod ng mga tao.
  rationale: Ang talatang ito ay nagsasalaysay muna ng larawan ng talinghaga; nasa mga kasunod na talata ang paliwanag. Pinananatili nitong hiwalay ang larawan at ang paliwanag at iniiwasang ipasok nang maaga ang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “lambat,” “iniahon,” at “pampang” upang mapanatili ang konkretong tagpo ng pangingisda. Iniwasan ang labis na pormal na “sisidlan” sa pangunahing teksto, ngunit isinama ito bilang alternatibo sa talababa.
