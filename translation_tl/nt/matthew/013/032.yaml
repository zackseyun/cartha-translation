id: MAT.13.32
reference: Matthew 13:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: tl
  text: Mas maliit nga ito kaysa sa lahat ng binhi, ngunit kapag lumaki na, mas malaki ito kaysa sa mga halaman sa hardin at nagiging isang puno[a], kaya dumarating ang mga ibon sa himpapawid[b] at namumugad sa mga sanga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring umalingawngaw ang larawang ito sa mga paglalarawan sa Lumang Tipan ng isang dakilang puno na kumakatawan sa isang kaharian (halimbawa, Ezekiel 17:23; Daniel 4:12), ngunit hindi tahasang sinasabi ng talata ang kahulugan nito.
    reason: cross_reference
  - marker: b
    text: Sa literal, “mga ibon ng langit”; maaari ring isalin na “mga ibon sa papawirin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: mas maliit ... kaysa sa lahat ng binhi
  rationale: Pinananatili ang anyong pahambing ng Griyego at ang tahasang paghahambing sa lahat ng binhi, sa halip na gawing pasukdol na “pinakamaliit.”
- source_word: μέν ... δέ
  choice: nga ... ngunit
  rationale: Likas na ipinahahayag sa Tagalog ang mariing pagtutunggali sa maliit na simula at malaking kinahinatnan.
- source_word: ὅταν ... αὐξηθῇ
  choice: kapag lumaki na
  rationale: Ipinahihiwatig ng “na” na natapos na ang paglaki bago ilarawan ang kasunod na kalagayan.
- source_word: μεῖζον τῶν λαχάνων
  choice: mas malaki ... kaysa sa mga halaman sa hardin
  rationale: Malawak ang λάχανα at tumutukoy sa mga halamang inaalagaan sa hardin; iniiwasan ng salin ang labis na makitid na “gulay” o “damong-gamot.”
- source_word: γίνεται δένδρον
  choice: nagiging isang puno
  rationale: Tuwirang pinananatili ang matingkad na larawan ng Griyego at hindi ito pinalalambot bilang “mistulang puno.”
- source_word: ὥστε ἐλθεῖν
  choice: kaya dumarating
  rationale: Natural na ipinahahayag ang bunga o resulta ng paglaki ng halaman.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa himpapawid
  rationale: Ang “himpapawid” ay natural at marangal na katumbas ng οὐρανός sa konteksto ng mga ibon, nang hindi ipinahihiwatig ang espirituwal na langit.
- source_word: κατασκηνοῦν
  choice: namumugad
  rationale: Sa konteksto ng mga ibon at mga sanga, malinaw at maikli nitong ipinahahayag ang panunuluyan o paggawa ng pugad.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: sa mga sanga nito
  rationale: Tuwirang lokatibong salin na malinaw ang pagtukoy sa punong binanggit.
theological_decisions:
- issue: Posibleng alusyon sa larawan ng isang malaking punong sinisilungan ng mga ibon
  choice: Panatilihing literal ang larawan sa pangunahing teksto at banggitin lamang sa talababa ang posibleng kaugnayan sa Lumang Tipan.
  alternative: Tukuyin sa salin ang mga ibon bilang sagisag ng mga bansa o mga taong kumakanlong sa kaharian ng Diyos.
  rationale: Maaaring umalingawngaw rito ang Ezekiel 17:23 at Daniel 4:12, ngunit hindi tahasang ipinaliliwanag ng talata ang sagisag; kaya hindi dapat ipasok sa pangunahing teksto ang isang tiyak na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pahambing na anyo ng Griyego, ang matingkad na salitang “puno,” at ang hindi tahasang ipinaliliwanag na teolohikal na alusyon.
