  source_fidelity: 'Tapat ang salin sa mga pangunahing ugnayang Griyego: pahambing ang “mas maliit ... kaysa sa lahat ng binhi,” natapos na paglaki ang “kapag lumaki na,” pahambing sa mga halaman sa hardin, at ang resultang pagiging puno kung saan namumugad ang mga ibon. Hindi ipinapasok sa pangunahing teksto ang anumang interpretasyon sa larawan ng mga ibon.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang “mga halaman sa hardin,” “mga ibon sa himpapawid,” at “namumugad sa mga sanga nito” ay madaling maunawaan at angkop sa marangal ngunit makabagong rehistro.
  terminology: Wasto at magkakatugma ang mga terminong binhi, halaman sa hardin, puno, himpapawid, at namumugad. Ang “himpapawid” ay angkop na di-teolohikal na katumbas ng οὐρανοῦ sa kontekstong ito. Ang mga talababa ay wastong inilalarawan ang literal na alternatibo at ang di-tahasang posibleng alusyong Lumang Tipan.
