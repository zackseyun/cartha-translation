id: MAT.13.58
reference: Matthew 13:58
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: tl
  text: At hindi siya gumawa roon ng maraming makapangyarihang gawa[a] dahil sa kawalan nila ng pananampalataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maraming himala” o “maraming gawa ng kapangyarihan.” Ang salitang Griyego ay tumutukoy sa mga gawang nagpapakita ng kapangyarihan at, sa kontekstong ito, sa mga himalang ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: At hindi siya gumawa
  rationale: Pinananatili ng “At” ang payak na pagpapatuloy ng salaysay; ang aorist na ἐποίησεν ay likas na isinaling “gumawa,” at ang οὐκ ay tuwirang nagkakaila sa kilos nang hindi nagpapahiwatig ng kawalan ng kakayahan.
- source_word: ἐκεῖ
  choice: roon
  rationale: Likas na pang-abay ng lugar sa Filipino, na tumutukoy sa bayang binabanggit sa konteksto.
- source_word: δυνάμεις πολλὰς
  choice: maraming makapangyarihang gawa
  rationale: Sa konteksto ng mga Ebanghelyo, ang δύναμις ay tumutukoy sa mga gawang nagpapakita ng kapangyarihan, karaniwan ay mga himala. Pinananatili ng “makapangyarihang gawa” ang ugnay sa kapangyarihan nang hindi agad pinapantay ang salita sa mas interpretatibong “himala”; ang πολλὰς ay “maraming.”
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: dahil sa kawalan nila ng pananampalataya
  rationale: Ang διά na may accusative ay nagsasaad ng sanhi. Ang ἀπιστία ay kawalan ng pananampalataya o hindi paniniwala; mas natural at marangal sa modernong Filipino ang “kawalan nila ng pananampalataya” sa pangungusap na ito.
theological_decisions:
- issue: Kung ipinahihiwatig ng talata na hindi niya kaya, o na hindi lamang siya gumawa ng maraming makapangyarihang gawa dahil sa kanilang kawalan ng pananampalataya
  choice: “Hindi siya gumawa” — pahayag tungkol sa hindi paggawa.
  alternative: “Hindi siya makagawa” — pahayag na maaaring magpahiwatig ng kawalan ng kakayahan.
  rationale: Gumagamit ang Griyego ng οὐκ ἐποίησεν (“hindi gumawa”), hindi ng pandiwang nagsasaad ng kawalan ng kakayahan. Pinananatili ng salin ang teolohikal na tensiyon at hindi nagdaragdag ng mas matinding pahayag kaysa sa sinabi ni Mateo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “roon” sa halip na mas kolokyal na anyo, at “makapangyarihang gawa” upang mapanatili ang diwa ng δύναμις habang inilalahad sa talababa ang mga natural na alternatibo.
