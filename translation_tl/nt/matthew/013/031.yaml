  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: tl
  text: 'Inilahad niya sa kanila ang isa pang talinghaga at sinabi: “Ang kaharian ng langit ay tulad ng isang butil ng mustasa na kinuha ng isang lalaki at inihasik sa kanyang bukid.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: Inilahad
  rationale: Sa kontekstong ito, ang παρατίθημι ay nangangahulugang iharap o ilahad sa mga tagapakinig. Likas sa modernong Filipino ang “inilahad” at pinananatili nito ang diwang sadyang paghaharap ng isang talinghaga.
- source_word: παραβολὴν
  choice: talinghaga
  rationale: Ang “talinghaga” ang kinikilalang terminong Filipino para sa παραβολή sa mga Ebanghelyo at pinananatili ang natatanging anyo ng pagtuturo nito.
- source_word: Ὁμοία ἐστὶν
  choice: ay tulad ng
  rationale: Ito ang tuwiran at likas na pormulang Filipino para sa paghahambing na ipinahihiwatig ng Griyego.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Pinananatili nito ang natatanging pananalita ni Mateo at ang saklaw ng βασιλεία bilang paghahari at kaharian, nang hindi ito nililimitahan sa isa lamang sa mga diwang iyon.
- source_word: κόκκῳ σινάπεως
  choice: isang butil ng mustasa
  rationale: Maaaring mangahulugang butil o binhi ang κόκκος. Ang “butil ng mustasa” ay malinaw at nakaugat sa karaniwang pananalitang biblikal sa Filipino.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: na kinuha ng isang lalaki
  rationale: Isinasalin ang participle na λαβών sa likas na sugnay na Filipino at pinananatili ang isahang lalaking tauhan ng salaysay.
- source_word: ἔσπειρεν
  choice: inihasik
  rationale: Tumpak na ipinahahayag ng “inihasik” ang tiyak na gawaing agrikultural ng σπείρω, sa halip na ang mas pangkalahatang “itinanim.”
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: sa kanyang bukid
  rationale: Likas at tuwirang katumbas ito ng pariralang Griyego, kasama ang tahasang pagmamay-ari ng bukid.
theological_decisions:
- issue: Pagsasalin sa βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  alternative: ang paghahari ng langit; ang kaharian ng mga langit
  rationale: Pinananatili ng “kaharian ng langit” ang nakaugaliang parirala ni Mateo at hindi tahasang nilulutas kung ang diin ay nasa pamamahala, nasasakupan, o kapuwa mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inilahad” upang maging natural ang idyoma ng Griyego, at “inihasik” upang mapanatili ang tiyak na larawang agrikultural. Walang footnote sapagkat walang tekstuwal o leksikal na kalabuan dito na nangangailangan ng paliwanag para sa karaniwang mambabasa.
