id: MAT.13.50
reference: Matthew 13:50
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: tl
  text: at itatapon nila ang mga iyon sa nagliliyab na hurno.[a] Doon ay magkakaroon ng pagtangis at pagngangalit ng mga ngipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hurno ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: itatapon
  rationale: Likas at malinaw na katumbas ng hinaharap na anyo ng βάλλω; pinananatili ang diwa ng sapilitang paghahagis nang hindi makaluma.
- source_word: αὐτοὺς
  choice: ang mga iyon
  rationale: Tumutukoy sa masasama sa naunang konteksto. Mas malinaw sa Filipino kaysa sa simpleng “sila” kapag layon ng pandiwa.
- source_word: κάμινον τοῦ πυρός
  choice: nagliliyab na hurno
  rationale: Likas na Filipino para sa hurnong may apoy at pinananatili ang kongkretong larawan ng paghatol; inilalagay sa talababa ang mas literal na kayariang Griyego.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Maikli at natural na panandang panlunan na nagpapanatili sa diin ng Griyego.
- source_word: ἔσται
  choice: ay magkakaroon ng
  rationale: Natural na eksistensiyal na pahayag sa Filipino para sa magiging kalagayan sa lugar na iyon.
- source_word: ὁ κλαυθμὸς
  choice: pagtangis
  rationale: Dignified at karaniwang salin ng matinding pag-iyak o panaghoy sa konteksto ng paghatol.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Itinatag na ekspresyong biblikal sa Filipino na malapit sa kongkretong idyomang Griyego at hindi nililimitahan ang maaaring pahiwatig nito sa isang emosyon lamang.
theological_decisions:
- issue: Larawan ng paghatol sa kontekstong eskatolohikal
  choice: Panatilihin ang kongkretong larawan ng nagliliyab na hurno, pagtangis, at pagngangalit ng mga ngipin nang walang pagpapalambot o paliwanag sa mismong talata.
  alternative: Ipaliwanag bilang pagdurusa, dalamhati, o galit, o gawing mas di-tuwiran ang larawan ng apoy.
  rationale: Mabigat at matalinghaga ang pananalita ng talata. Hindi dapat tukuyin ng salin kung ang pagngangalit ay eksklusibong tanda ng sakit, galit, o desperasyon, ni gawing abstrakto ang larawan ng paghatol.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagliliyab na hurno” bilang natural na pangunahing teksto, habang pinanatili sa talababa ang literal na kayariang Griyego. Ang “pagngangalit ng mga ngipin” ay sadyang pinanatili bilang pormulang larawan sa Mateo.
