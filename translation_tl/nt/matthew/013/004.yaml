source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: tl
  text: Habang naghahasik siya, may ilang binhi[a] na nahulog sa tabi ng daan. Dumating ang mga ibon at nilamon ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “may ilang nahulog sa tabi ng daan”; idinagdag ang “binhi” ayon sa konteksto ng manghahasik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Habang naghahasik siya
  rationale: Ang ἐν kasama ng articular infinitive ay nagpapahayag ng kilos na kasabay ng pangunahing pangyayari. Likas sa modernong Tagalog ang “habang naghahasik siya.”
- source_word: ἃ μὲν
  choice: may ilang binhi
  rationale: Literal itong neuter plural na “may ilang [bagay],” ngunit tumutukoy sa ipinahihiwatig na binhi sa konteksto. Nilinaw ang pangngalan sa salin at itinabi ang paliwanag sa talababa.
- source_word: ἔπεσεν
  choice: nahulog
  rationale: Ang aorist indicative ay angkop na isinalin bilang payak na naganap na kilos sa salaysay.
- source_word: παρὰ τὴν ὁδόν
  choice: sa tabi ng daan
  rationale: Ipinapahayag ng παρά kasama ng accusative ang kinalalagyan sa gilid o tabi. Ang “daan” ay karaniwan at angkop sa tagpuang bukirin.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: Dumating ang mga ibon
  rationale: Ginawang sugnay na may pandiwang tahasan ang aorist participle upang maging natural sa Tagalog. Ang πετεινά ay payak na “mga ibon”; walang pariralang “sa himpapawid” sa talatang ito.
- source_word: κατέφαγεν
  choice: nilamon
  rationale: Ang κατεσθίω ay nagpapahiwatig ng masidhing pagkain o pag-ubos. Napananatili ng “nilamon” ang lakas ng pandiwa nang hindi nagdaragdag ng kilos na wala sa teksto.
- source_word: αὐτά
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip sa mga binhing nahulog. Malinaw ang “ang mga iyon” sa Tagalog nang hindi inuulit ang pangngalan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na ritmo ng salaysay at iniwasang idagdag ang “sa himpapawid,” na wala sa tekstong Griyego ng talatang ito.
