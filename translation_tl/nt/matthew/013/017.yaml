  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: tl
  text: 'Sapagkat tinitiyak ko sa inyo: maraming propeta at mga taong matuwid ang nanabik na makita ang nakikita ninyo, ngunit hindi nila iyon nakita, at marinig ang naririnig ninyo, ngunit hindi nila iyon narinig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: tinitiyak ko
  rationale: Sa pormulang ἀμὴν λέγω ὑμῖν, likas sa modernong Tagalog na ipahayag ang taimtim na pagtiyak sa halip na simpleng baybayin bilang “amen.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag; malinaw itong naihahayag ng “sapagkat.”
- source_word: λέγω ὑμῖν
  choice: tinitiyak ko sa inyo
  rationale: Kasama ng ἀμὴν, pinananatili nito ang tuwiran at taimtim na diin ng pormula sa paraang natural sa Tagalog.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: maraming propeta at taong matuwid
  rationale: Tuwirang isinasalin ang dami at ang dalawang pangkat; ginawang tahasang pangngalan ang substantival na δίκαιοι upang maging malinaw sa karaniwang mambabasa.
- source_word: ἐπεθύμησαν
  choice: nanabik
  rationale: Ipinahahayag nito ang matindi at matagal na pagnanais nang hindi nagdadala ng negatibong pahiwatig.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: makita ang nakikita ninyo, ngunit hindi nila iyon nakita
  rationale: Pinananatili ang pagkakaiba ng infinitive, kasalukuyang βλέπετε, at makasaysayang aorist na εἶδαν, habang natural ang daloy sa Tagalog.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: marinig ang naririnig ninyo, ngunit hindi nila iyon narinig
  rationale: Pinananatili ang parallel na kayarian ng ikalawang bahagi at ang pagkakaiba ng kasalukuyan at aorist.
theological_decisions:
- issue: Saklaw ng δίκαιοι
  choice: “taong matuwid” bilang pangkat na kaagapay ng mga propeta
  alternative: “mga matuwid”
  rationale: Substantival at maramihan ang pang-uri sa Griyego. Ang “taong matuwid” ay malinaw at hindi nililimitahan ang pangkat sa mga propeta lamang.
- issue: Kung ano ang nakita at narinig
  choice: Iniwan bilang “ang nakikita ninyo” at “ang naririnig ninyo”
  alternative: Tukuyin bilang ang Mesiyas, si Jesus, o ang mga hiwaga ng kaharian
  rationale: Bagaman nagbibigay ng konteksto ang nakapaligid na talata, hindi tahasang pinapangalanan sa mismong bersikulo ang mga bagay na tinutukoy; pinananatili ng salin ang ganitong pagiging di-tiyak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “taong matuwid” kaysa sa mas abstrakto o bahagyang arkaikong “mga banal/mga matuwid.” Pinanatili ang balanseng parallelismo ng “makita… nakita” at “marinig… narinig.”
