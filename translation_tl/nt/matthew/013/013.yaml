    issue: Ang “kahit” sa pangunahing teksto ay nagtatakda ng concessive na ugnayan ng mga participle.
    rationale: Bagaman posible ang concessive na pagbasa, hindi ito kailangang gawing tahasan sa Filipino. Mas mainam na panatilihin ang sintaktikong di-katiyakan at ang retorikal na pagsalungat ng orihinal.
  - severity: low
    issue: Hindi tugma ang paliwanag ng talababa sa mismong alternatibo nito.
    rationale: Sinasabi ng dahilan ng talababa na hindi tahasang inilalagay ang pasalungat na diwa, ngunit gumagamit ang alternatibo ng “ngunit,” na tahasang pasalungat. Hindi rin kailangan ang talababa kung ang pangunahing salin mismo ay nagpapanatili ng mas pormal na anyo.
  - severity: low
    issue: Ang “sa pamamagitan ng mga talinghaga” ay bahagyang mas instrumental kaysa sa ἐν παραβολαῖς.
    rationale: Ang “sa mga talinghaga” ay tuwiran, natural, at mas malapit sa paraang ipinahihiwatig ng Griyego.
