  to: Dahil dito, nagsasalita ako sa kanila sa mga talinghaga, sapagkat nakakakita sila ngunit hindi nakakakita, at nakaririnig sila ngunit hindi nakaririnig, ni nakauunawa.
  rationale: Inalis ang “kahit” upang hindi resolbahin sa pangunahing salin ang posibleng concessive na lakas ng mga participle. Pinanatili ang kabalintunaang inuulit ng Griyego sa pamamagitan ng “nakakakita ... ngunit hindi nakakakita” at “nakaririnig ... ngunit hindi nakaririnig.” Inalis ang talababa dahil ang dating alternatibo ay siya na ngayong pangunahing salin at ang paliwanag nito ay hindi tugma sa gamit ng “ngunit.”
