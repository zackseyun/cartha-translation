  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: tl
  text: Dahil dito, nagsasalita ako sa kanila sa mga talinghaga, sapagkat nakakakita sila ngunit hindi nakakakita, at nakaririnig sila ngunit hindi nakaririnig, ni nakauunawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Dahil dito
  rationale: Pinananatili nito ang tuwirang ugnayang sanhi na ipinahihiwatig ng parirala nang hindi ito ginagawang purong kongklusyon gaya ng maaaring ipahiwatig ng “kaya.”
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Likas itong Filipino para sa paraang ginagamit ni Jesus sa pagsasalita at malinaw na tumutukoy sa mga talinghaga bilang anyo ng kaniyang pagtuturo.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwiran at sapat na katumbas ng panghalip na datibo ayon sa konteksto.
- source_word: λαλῶ
  choice: nagsasalita ako
  rationale: Pinananatili ang pangkasalukuyang kilos at ang marangal ngunit pangkaraniwang antas ng pananalita.
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikita nitong ang sumusunod na pahayag ang dahilan ng pagsasalita sa mga talinghaga.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: kahit nakakakita sila ay hindi sila nakakakita
  rationale: Pinananatili ang sadyang pag-uulit at kabalintunaan ng Griyego, habang likas na ipinahahayag sa Filipino ang posibleng pasalungat na lakas ng participle.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: kahit nakaririnig sila ay hindi sila nakaririnig
  rationale: Pinananatili ang magkatulad na ugat at estrukturang retorikal ng orihinal; iniwasan ang “nakikinig,” na maaaring magdagdag ng diwa ng kusang pagbibigay-pansin.
- source_word: οὐδὲ
  choice: ni
  rationale: Maikli at likas na ipinagpapatuloy nito ang magkakaugnay na mga pagtanggi.
- source_word: συνίουσιν
  choice: nakauunawa
  rationale: Malinaw nitong ipinahahayag ang pagkabigong maunawaan ang kahulugan nang hindi nagdaragdag ng tiyak na paliwanag na doktrinal.
theological_decisions:
- issue: Lakas ng mga participle na βλέποντες at ἀκούοντες
  choice: Isinaling pasalungat bilang “kahit nakakakita” at “kahit nakaririnig”
  alternative: Mas pormal na “nakakakita sila ngunit hindi nakakakita” at “nakaririnig sila ngunit hindi nakaririnig”
  rationale: Maaaring manatiling di-tiyak ang eksaktong ugnayang panggramatika, ngunit ipinakikita ng konteksto at ng kabalintunaang pag-uulit ang pagsalungat ng panlabas na pandama at tunay na pagkaunawa. Ang talababa ay nagpapanatili ng mas pormal na posibilidad.
- issue: Kahulugan ng συνίουσιν
  choice: “nakauunawa” bilang kawalan ng pagkaunawa sa kahulugan
  alternative: “nakaiintindi” o “nakababatid”
  rationale: Ang “nakauunawa” ay malinaw, marangal, at hindi nagpapasok ng mas tiyak na doktrina tungkol sa dahilan o antas ng kanilang kawalan ng pagkaunawa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang retorikal na pag-uulit ng “nakakakita” at “nakaririnig” sa halip na ipaliwanag ang pagkakaiba bilang pisikal laban sa espirituwal, upang hindi lutasin sa salin ang tensiyong nasa teksto.
