  source_fidelity: Ang pangunahing salin ay wasto sa sanhi, pag-uulit, pagtanggi, at pangwakas na diwa ng pagkaunawa. Gayunman, ang “kahit” ay tahasang nagpapasya sa concessive na pagbasa ng mga participle, samantalang ang Griyego ay maaaring iwanang mas di-tiyak. Ang “sa mga talinghaga” ay mas malapit na katumbas ng ἐν παραβολαῖς kaysa “sa pamamagitan ng mga talinghaga.”
  naturalness: Likas at marangal ang binagong pangungusap sa modernong Filipino. Ang magkatambal na “nakakakita ... hindi nakakakita” at “nakaririnig ... hindi nakaririnig” ay nananatiling malinaw na kabalintunaan nang hindi pinapaliwanag ang nilalaman nito.
  terminology: Ang “mga talinghaga” at “nakauunawa” ay angkop at matatag na mga katawagan. Walang isyung pangngalan o teolohikal na termino.
  issues:
