  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: tl
  text: At natisod sila dahil sa kanya.[a] Ngunit sinabi sa kanila ni Jesus, “Ang isang propeta ay hindi nawawalan ng karangalan maliban sa sarili niyang bayan[b] at sa sarili niyang sambahayan.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Natisod sila sa kanya” o “Hindi nila siya matanggap.” Sa literal, “natisod sila sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O “sarili niyang lugar” o “sariling lupain.”
    reason: lexical_alternative
  - marker: c
    text: O “sarili niyang bahay.” Ang salitang Griyego ay maaaring tumukoy sa bahay bilang gusali o sa sambahayan at pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: natisod sila dahil sa kanya
  rationale: Pinananatili nito ang talinghaga ng pagkatisod sa Griyego habang ipinahihiwatig sa konteksto na hindi nila matanggap si Jesus at nagkaroon sila ng pagtutol sa kanya. Nililinaw sa talababa ang di-literal na diwa.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ngunit sinabi sa kanila ni Jesus
  rationale: Ang “ngunit” ay nagpapakita ng banayad na pagsalungat o pagbabago ng daloy na dala ng δέ pagkatapos ilarawan ang kanilang pagkatisod.
- source_word: προφήτης
  choice: isang propeta
  rationale: Karaniwan, tuwiran, at madaling makilalang salin ng termino; ang “isang” ay natural sa pangkalahatang kasabihan sa Filipino.
- source_word: ἄτιμος
  choice: hindi nawawalan ng karangalan
  rationale: Pinananatili ang anyong pasalungat ng kasabihan at ang konteksto ng karangalan at kahihiyan, sa halip na paliitin ito sa simpleng hindi paggalang.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Ito ang natural na Filipino para sa konstruksiyong nagtatakda ng eksepsiyon.
- source_word: πατρίδι
  choice: sarili niyang bayan
  rationale: Sa konteksto, tumutukoy ito sa bayang pinagmulan ni Jesus, hindi kinakailangang sa buong bansa. Ang “bayan” ay likas at sapat na malawak upang mapanatili ang saklaw ng πατρίς.
- source_word: οἰκίᾳ αὐτοῦ
  choice: sarili niyang sambahayan
  rationale: Naipahihiwatig ng “sambahayan” ang mga taong kabilang sa tahanan o pamilya, hindi lamang ang gusali, habang pinananatili ang domestic na saklaw ng οἰκία.
theological_decisions:
- issue: Saklaw ng kasabihan ni Jesus tungkol sa pagtanggi sa isang propeta
  choice: Isinalin bilang pangkalahatang kasabihan tungkol sa kawalan ng karangalan sa sariling bayan at sambahayan.
  alternative: Gawing tahasang pahayag tungkol lamang sa kawalan ng pananampalataya ng pamilya ni Jesus o palawakin ito bilang pangkalahatang doktrina tungkol sa lahat ng tumatanggi sa kanya.
  rationale: Inilalapat ni Jesus ang isang kasabihan sa kasalukuyang pangyayari. Dapat panatilihin ng salin ang tema ng karangalan at lokal na pagtanggi nang hindi nagdaragdag ng paliwanag na teolohikal na wala sa Griyego.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Pinanatili ang talinghaga ng “pagkatisod” at ang pasalungat na anyo ng kasabihan; ipinaliwanag sa mga talababa ang mga posibleng diwa ng πατρίς at οἰκία.
