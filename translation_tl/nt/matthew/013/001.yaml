  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: tl
  text: Noong araw na iyon,[a] lumabas si Jesus mula sa bahay at naupo sa tabi ng dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Noong araw ding iyon,” kung ang parirala ay inuunawang nagbibigay-diin sa pagpapatuloy ng naunang pangyayari, at hindi lamang nagsasaad ng panahon.
    reason: alternative_reading
  - marker: b
    text: O “sa may dagat.” Ipinahihiwatig ng pariralang Griego ang kinaroroonang malapit sa dagat ngunit hindi nito tinutukoy ang eksaktong layo mula sa pampang.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Nang araw na iyon
  rationale: Likas na temporal na parirala sa modernong Tagalog; pinananatili nito ang pagtukoy sa araw nang hindi tahasang idinaragdag ang diwa ng 'iyon ding araw.'
- source_word: ἐξελθὼν
  choice: lumabas
  rationale: Ang aorist participle ay likas na naihahayag sa Tagalog bilang sunod-sunod na kilos na inuugnay ng 'at.'
- source_word: τῆς οἰκίας
  choice: sa bahay
  rationale: Kasama ng 'lumabas,' ang 'sa bahay' ay karaniwang Tagalog para sa paglabas mula sa loob ng isang bahay; hindi kailangang ulitin ang 'mula.'
- source_word: ἐκάθητο
  choice: naupo
  rationale: Natural na salaysay sa Tagalog para sa pag-upo ni Jesus. Bagaman imperfect ang anyo at maaaring maglarawan ng kalagayang nakaupo, ang 'nakaupo' rito ay madaling magpahiwatig na dati na siyang nakaupo bago lumabas.
- source_word: παρὰ τὴν θάλασσαν
  choice: sa tabi ng lawa
  rationale: Ipinahahayag ng παρά ang pagiging malapit. Sa konteksto ng Galilea, mas malinaw sa karaniwang mambabasang Tagalog ang 'lawa,' bagaman literal na maaaring tawaging 'dagat' ang θάλασσα.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Karaniwang anyo ng personal na pangalang ito sa modernong Bibliyang Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'lawa' sa pangunahing teksto para sa malinaw na heograpikong diwa, habang pinanatili sa talababa ang literal na 'dagat.' Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
