  source_fidelity: Kailangang palitan ang “lawa” ng “dagat.” Ang θάλασσαν ay “dagat” sa teksto; bagaman ang tinutukoy na anyong-tubig ay karaniwang kilala bilang Lawa/Dagat ng Galilea, hindi ito pinapangalanan ng talata at hindi dapat gawing mas tiyak ang pangunahing salin. Ang “mula sa bahay” ay mas malinaw na naghahayag ng genitive na pinagmulan kasunod ng ἐξελθών.
  naturalness: Mas likas ang “Noong araw na iyon” kaysa “Nang araw na iyon” sa modernong Filipino Tagalog. Ang “lumabas si Jesus mula sa bahay at naupo sa tabi ng dagat” ay malinaw at natural na pagsasalaysay.
  terminology: Pinanatili ang karaniwang pangalang “Jesus.” Isinalin ang θάλασσα bilang “dagat,” at ang παρά bilang “sa tabi ng,” nang hindi nagdaragdag ng pangalan o heograpikong pag-uuri ng anyong-tubig.
  issues:
