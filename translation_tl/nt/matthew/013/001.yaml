    rationale: Ang “lawa” ay kontekstuwal na pagpapaliwanag ng Dagat ng Galilea ngunit mas tiyak kaysa sa salitang Griego, na karaniwang “dagat.” Dapat panatilihin ng pangunahing teksto ang terminong “dagat”; maaaring ilahad ang alternatibong “sa may dagat” sa talababa nang hindi ipinapasok ang hindi nakasulat na heograpikong pangalan.
  - severity: low
    issue: “Nang araw na iyon” ay hindi gaanong natural na temporal na panimula.
    rationale: Ang “Noong araw na iyon” ang mas idiomatiko at tuwirang katumbas ng Ἐν τῇ ἡμέρᾳ ἐκείνῃ.
  - severity: low
    issue: Hindi tahasang naipahahayag ng “lumabas ... sa bahay” ang pinanggalingan.
    rationale: Ang pagdaragdag ng “mula sa” ay natural at malinaw na nagdadala ng kahulugang “lumabas mula sa bahay.”
  revised_text: Noong araw na iyon,[a] lumabas si Jesus mula sa bahay at naupo sa tabi ng dagat.[b]
