source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: tl
  text: Kapag may nakakarinig sa salita ng kaharian ngunit hindi niya ito nauunawaan, dumarating ang Masama[a] at inaagaw ang naihasik sa kanyang puso. Ang taong ito ang naihasik sa tabi ng daan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “ang Balakyot.”
    reason: lexical_alternative
  - marker: b
    text: 'O, mas literal: “Ito ang naihasik sa tabi ng daan.” Tuwirang iniuugnay ng larawan ng talinghaga ang taong nakikinig sa “inihasik.”'
    reason: metaphorical_ambiguity
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: kapag may nakakarinig
  rationale: Ipinapahayag nang natural sa modernong Tagalog ang pangkalahatang kalagayang tinutukoy ng genitive participial construction at ang distributibong diwa ng πᾶς.
- source_word: λόγον τῆς βασιλείας
  choice: salita ng kaharian
  rationale: Pinananatili ng “salita” ang ugnayan sa larawan ng binhing inihahasik, habang ang “ng kaharian” ay hindi labis na nagpapasiya kung ang mensahe ay tungkol sa kaharian o nagmumula rito.
- source_word: μὴ συνιέντος
  choice: hindi niya ito nauunawaan
  rationale: Ang συνίημι ay tumutukoy sa pagkaunawa o pag-unawa sa kahulugan; ang “ito” ay likas na tumutukoy pabalik sa salita ng kaharian.
- source_word: ὁ πονηρὸς
  choice: ang Masama
  rationale: Ang may artikulong anyo ay malamang na tumutukoy sa isang personal na masamang tagapagkilos. Ang malaking titik ay tumutulong na ipakitang katauhan ang tinutukoy nang hindi siya pinapangalanan nang higit sa teksto.
- source_word: ἁρπάζει
  choice: inaagaw
  rationale: Napananatili nito ang biglaan at sapilitang pagkuha na ipinahihiwatig ng ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: ang naihasik
  rationale: Likas itong substantival passive rendering at hindi inuulit nang tahasan kung ano ang naihasik, gaya ng Griyego.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sa kanyang puso
  rationale: Pinananatili ang biblikal na larawang “puso” bilang panloob na sentro ng pagtanggap at pagkaunawa, nang walang paliwanag na idinaragdag sa teksto.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Siya ang tulad ng binhing naihasik sa tabi ng daan
  rationale: Nililinaw nang sapat sa Tagalog ang pag-uugnay sa tao at sa binhi, habang pinananatili ang kapansin-pansing metaporikal na pagkakakilanlan sa paliwanag ng talinghaga. Ang “daan” ay natural na katumbas ng ὁδός.
theological_decisions:
- issue: Pagkakakilanlan ng ὁ πονηρός
  choice: isang personal na masamang tagapagkilos (“ang Masama”)
  alternative: abstraktong kasamaan o “ang balakyot”
  rationale: Ang pandiwang “dumarating” at ang kilos na pag-agaw sa konteksto ay nagpapahiwatig ng persona, ngunit hindi pinapangalanan ng salin ang persona nang higit sa sinasabi ng talata.
- issue: Pagkakaugnay ng nakikinig, binhi, at lupang nasa tabi ng daan
  choice: “Siya ang tulad ng binhing naihasik sa tabi ng daan”
  alternative: “Siya ang naihasik sa tabi ng daan”
  rationale: Ang Griyego ay tuwirang nag-uugnay sa tao sa “inihasik,” isang sadyang metaporikal na pagpapalit sa loob ng talinghaga. Ang salin ay ginawang mauunawaan sa Tagalog ngunit ang mas literal na anyo ay inilagay sa talababa upang hindi mawala ang tensiyon ng larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “nakakarinig,” “nauunawaan,” at “inaagaw,” habang pinanatili ang mga pangunahing larawang “salita,” “puso,” “binhi,” at “daan.” Ang mga panghalip na “niya/kanyang” ay likas na walang kasarian sa Tagalog at hindi binabago ang singular na pagtukoy ng Griyego.
