  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: tl
  text: Hindi ba ito ang anak ng karpintero? Hindi ba Maria ang pangalan ng kaniyang ina, at ang kaniyang mga kapatid na lalaki[a] ay sina Santiago, Jose[b], Simon, at Judas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na “mga kamag-anak.” Karaniwang nangangahulugang “mga kapatid na lalaki” ang salitang Griyego, ngunit inuunawa ito ng ilan sa mas malawak na diwang pampamilya sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: “Joses” ang mababasa sa ilang manuskrito sa halip na “Jose.”
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: karpintero
  rationale: Ang τέκτων ay tumutukoy sa isang bihasang manggagawa, lalo na sa kahoy o pagtatayo. “Karpintero” ang pinakanatural at nakaugaliang salin sa kontekstong ito, bagaman mas malawak nang kaunti ang saklaw ng salitang Griyego.
- source_word: υἱός
  choice: anak
  rationale: Malinaw sa konteksto ang tuwirang ugnayang pampamilya. Natural sa Tagalog ang “anak” at hindi kailangang tukuyin pa ang kasarian sapagkat lalaki ang tinutukoy.
- source_word: λέγεται Μαριὰμ
  choice: Maria ang pangalan
  rationale: Ang pasibong idyoma ay nangangahulugang “tinatawag na” o “pinangalanang.” Ang “Maria ang pangalan ng kaniyang ina” ay natural na pagpapahayag sa modernong Tagalog habang pinananatili ang diwa.
- source_word: ἀδελφοὶ
  choice: mga kapatid na lalaki
  rationale: Karaniwang kahulugan ng panlalaking maramihan na ἀδελφοί ang “mga kapatid na lalaki.” Ginawang tahasan ang kasarian sa Tagalog dahil walang kasariang likas ang “kapatid”; inilalahad sa talababa ang posibleng mas malawak na kahulugang pampamilya.
- source_word: Ἰάκωβος
  choice: Santiago
  rationale: Ito ang nakaugaliang anyo ng pangalan sa tradisyong biblikal na Filipino para sa Ἰάκωβος sa Bagong Tipan.
- source_word: Ἰωσὴφ
  choice: Jose
  rationale: Ang teksto ng SBLGNT ay may Ἰωσήφ, na karaniwang isinasaling “Jose” sa Filipino. Nasa talababa ang ibang basa na Ἰωσῆς.
- source_word: Σίμων
  choice: Simon
  rationale: Ito ang karaniwang anyong Filipino ng pangalang Griyego.
- source_word: Ἰούδας
  choice: Judas
  rationale: Ito ang karaniwang anyong Filipino ng pangalang Griyego sa kontekstong ito.
- source_word: οὐχ ... ;
  choice: Hindi ba ...?
  rationale: Ang οὐχ ay nagpapakilala ng retorikal na tanong na umaasang sasang-ayon ang kausap. Likas at malinaw itong naipapahayag sa Tagalog sa pamamagitan ng “Hindi ba...?”
theological_decisions:
- issue: Ang eksaktong ugnayan kay Jesus ng οἱ ἀδελφοὶ αὐτοῦ
  choice: “kaniyang mga kapatid na lalaki” sa pangunahing teksto
  alternative: “kaniyang mga kamag-anak” o ibang mas malawak na ugnayang pampamilya
  rationale: Karaniwang kahulugan ng ἀδελφοί ang mga kapatid na lalaki. Hindi dapat pasiyahan ng salin ang matagal nang pagtatalong teolohikal tungkol sa eksaktong ugnayan nila kay Jesus; kaya pinanatili ang karaniwang kahulugan sa teksto at binanggit ang mas malawak na posibilidad sa talababa.
translation_notes:
  register: Gumamit ng natural, makabago, at marangal na Filipino. Pinanatili ang magkatulad na retorikal na tanong ng Griyego. Ang “mga kapatid na lalaki” ay sadyang tahasan upang maipakita ang panlalaking anyo ng ἀδελφοί, samantalang ang talababa ay nagpapanatili sa posibleng mas malawak na kahulugan. Inilagay ang panandang [b] pagkatapos ng “Jose,” kung saan aktuwal na nauukol ang tekstuwal na variant.
