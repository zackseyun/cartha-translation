  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: tl
  text: “Naunawaan ba ninyo ang lahat ng ito?”[a] Sinabi nila sa kanya, “Oo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nauunawaan ba ninyo ang lahat ng ito?”
    reason: Posibleng isalin ang tanong gamit ang aspektong di-ganap o pangkasalukuyan, bagaman mas tuwirang naipakikita ng “naunawaan” ang aorist na anyo ng pandiwa.
lexical_decisions:
- source_word: Συνήκατε
  choice: Naunawaan ba ninyo
  rationale: Ang aorist indicative na nasa tanong ay likas na tumutukoy sa pagkaunawang nakamit hanggang sa sandaling iyon. Pinananatili ng “naunawaan” ang aspektong ito nang natural sa Tagalog.
- source_word: ταῦτα πάντα
  choice: ang lahat ng ito
  rationale: Malinaw at likas nitong ipinahihiwatig ang kabuuan ng mga aral at talinghagang kababanggit lamang.
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Bagaman historical present ang anyong Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan. Napananatili rin ang di-tuwirang layon na αὐτῷ.
- source_word: Ναί
  choice: Oo
  rationale: Payak na pagsang-ayon lamang ang nasa Griyego. Hindi dinagdagan ng pantawag o titulong wala sa teksto.
theological_decisions:
- issue: Kung daragdagan ng magalang o mapitagang pantawag ang sagot ng mga alagad
  choice: Panatilihin ang payak na “Oo.”
  alternative: “Opo, Panginoon.”
  rationale: Ναί lamang ang mababasa sa SBLGNT. Ang pagdaragdag ng “Panginoon” ay mag-aangkat ng nilalamang wala sa pinagmulang teksto; pinili rin ang “Oo” upang manatiling payak ang mismong sagot.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Ginamit ang “ninyo” dahil maramihan ang pandiwa sa Griyego. Hindi idinagdag ang “Panginoon” o anumang titulong wala sa pinagmulang teksto.
