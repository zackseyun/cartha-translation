  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: tl
  text: 'Ganito ang mangyayari sa katapusan ng kapanahunan: lalabas ang mga anghel at ihihiwalay nila ang masasama mula sa mga matuwid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kaganapan ng kapanahunan.” Karaniwang isinasalin noon na “sa katapusan ng mundo,” ngunit “kapanahunan” (αἰών) ang nasa Griyego, hindi “mundo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ganito
  rationale: Ipinakikilala nito ang paliwanag sa kahulugan ng talinghaga. Likas sa makabagong Tagalog ang “Ganito” at pinananatili nito ang diwang “sa ganitong paraan.”
- source_word: ἔσται
  choice: ang mangyayari
  rationale: Ang payak na anyong panghinaharap ay natural na naipahahayag sa Tagalog bilang “ang mangyayari,” kasunod ng “Ganito.”
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: sa katapusan ng kapanahunan
  rationale: Ang συντέλεια ay tumutukoy sa pagtatapos o kaganapan, at ang αἰών ay isang kapanahunan o kaayusan ng panahon, hindi tuwirang ang pisikal na mundo. Malinaw at likas ang pariralang ito sa karaniwang mambabasa.
- source_word: ἐξελεύσονται
  choice: lalabas
  rationale: Tuwiran at natural itong katumbas ng panghinaharap na anyo ng ἐξέρχομαι.
- source_word: οἱ ἄγγελοι
  choice: ang mga anghel
  rationale: Sa konteksto ng pangwakas na paghuhukom, tumutukoy ito sa mga makalangit na anghel, hindi sa mga taong sugo.
- source_word: ἀφοριοῦσιν
  choice: ihihiwalay nila
  rationale: Ipinahahayag nito ang aktibong pagbubukod ng isang pangkat mula sa isa, at nililinaw ng “nila” na ang mga anghel ang gumagawa nito.
- source_word: τοὺς πονηροὺς
  choice: ang masasama
  rationale: Ang pang-uri ay ginagamit bilang pangngalan at tumutukoy sa masasamang tao bilang isang pangkat.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: sa mga matuwid
  rationale: Sa pandiwang “ihihiwalay,” likas sa Tagalog ang “sa mga matuwid” upang ipahayag ang pagbubukod ng masasama mula sa pangkat ng mga matuwid, nang hindi gumagamit ng mabigat na pariralang “mula sa gitna.”
- source_word: τῶν δικαίων
  choice: ang mga matuwid
  rationale: Karaniwan, malinaw, at angkop sa konteksto ng paghuhukom ang “mga matuwid” para sa substantival na δικαίων.
theological_decisions:
- issue: Kahulugan ng αἰών sa pariralang eskatolohikal
  choice: kapanahunan
  alternative: mundo o sanlibutan
  rationale: Pinananatili ng “kapanahunan” ang kahulugan ng αἰών at iniiwasang ipakahulugan na ang mismong pisikal na daigdig ang tinutukoy, isang pahayag na hindi kinakailangan ng salitang Griyego.
- issue: Pagkakakilanlan ng οἱ ἄγγελοι
  choice: mga makalangit na anghel
  alternative: mga sugo
  rationale: Sa paliwanag ni Jesus tungkol sa pangwakas na paghuhukom, malinaw sa konteksto na mga makalangit na anghel ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ganito ang mangyayari” at “lalabas” bilang mga natural na pahayag, habang pinanatili ang eskatolohikal na diwa at ang pagkakaiba ng “kapanahunan” sa “mundo.”
