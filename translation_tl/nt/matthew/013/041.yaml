  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: tl
  text: Susuguin ng Anak ng Tao ang kanyang mga anghel, at titipunin nila mula sa kanyang kaharian ang lahat ng nagiging sanhi ng pagkakasala[a] at ang mga namumuhay sa pagsuway sa kautusan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng katitisuran.” Maaaring tumukoy ang salitang Griyego sa mga tao, bagay, o impluwensiyang nagiging dahilan upang magkasala o tumalikod ang iba.
    reason: lexical_alternative
  - marker: b
    text: O, “mga gumagawa ng paglabag sa kautusan.” Ipinahihiwatig ng pananalita ang pagsuway bilang kinagawiang asal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: susuguin
  rationale: Ang “susuguin” ay likas na Filipino para sa pagpapadala ng mga inatasang kinatawan at angkop sa panghinaharap na anyo ng pandiwa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo at ang kaugnayan nito sa apokaliptikong larawan ng Daniel 7 nang hindi ito ipinapakahulugan nang labis.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ang kanyang mga anghel
  rationale: Sa konteksto ng paghuhukom, ang ἄγγελοι ay tumutukoy sa mga makalangit na anghel, hindi sa mga taong mensahero.
- source_word: συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ
  choice: titipunin nila mula sa kanyang kaharian
  rationale: Pinananatili ng “titipunin” ang larawan ng pag-aani, samantalang ipinahihiwatig ng “mula sa” ang pag-aalis sa loob ng sakop ng kanyang kaharian.
- source_word: πάντα τὰ σκάνδαλα
  choice: ang lahat ng nagiging sanhi ng pagkakasala
  rationale: Ipinapahayag nito ang aktibong diwa ng σκάνδαλα—mga tao, bagay, o impluwensiyang umaakay sa pagkakasala—nang hindi nililimitahan sa simpleng pagkagalit o pagkatisod.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: ang mga namumuhay sa pagsuway sa kautusan
  rationale: Natural nitong ipinahahayag sa Filipino ang tuloy-tuloy o katangiang asal ng mga tinutukoy, habang pinananatili ang kaugnayan ng ἀνομία sa pagsuway sa kautusan.
theological_decisions:
- issue: Pagsasalin sa titulong ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Isa na Tao
  rationale: Ang tradisyonal at natural na titulong “Anak ng Tao” ang pinakamalinaw na nagpapanatili sa gamit nito kay Jesus at sa posibleng alusyon sa Daniel 7.
- issue: Saklaw ng σκάνδαλα sa tagpo ng paghuhukom
  choice: lahat ng nagiging sanhi ng pagkakasala
  alternative: lahat ng katitisuran
  rationale: Maaaring saklawin ng salita ang mga tao, bagay, o impluwensiyang nagtutulak sa iba na magkasala o tumalikod. Hindi nilulutas ng salin kung alin lamang sa mga ito ang tinutukoy.
- issue: Diwa ng τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: mga namumuhay sa pagsuway sa kautusan
  alternative: mga gumagawa ng paglabag sa kautusan
  rationale: Ipinahihiwatig ng substantival present participle ang katangiang gawain, ngunit hindi dinaragdagan ng salin ang teksto ng isang partikular na paliwanag kung aling aspekto ng kautusan ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” ayon sa karaniwang modernong baybay. Iniwasan ang sobrang teknikal na “kawalan ng kautusan” at pinanatili sa mga talababa ang mahahalagang alternatibong leksikal.
