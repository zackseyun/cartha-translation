id: MAT.13.39
reference: Matthew 13:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: tl
  text: At ang kaaway na naghasik ng mga iyon ay ang diyablo. Ang pag-aani ay ang katapusan ng kapanahunan[a], at ang mga mag-aani ay mga anghel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaganapan ng kapanahunan”; ayon sa tradisyon, “ang katapusan ng mundo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: kaaway
  rationale: Karaniwan, malinaw, at likas na katumbas sa modernong Tagalog; pinananatili nito ang personal na pagsalungat sa paliwanag ng talinghaga.
- source_word: ὁ σπείρας
  choice: na naghasik
  rationale: Tumutukoy ang aorist participle sa kaaway sa pamamagitan ng natapos niyang ginawa; ang “naghasik” ang wastong katawagang pang-agrikultura at tumutugma sa naunang larawan ng talinghaga.
- source_word: αὐτά
  choice: ng mga iyon
  rationale: Tumutukoy pabalik sa masasamang damo na inihasik. Ginagawang malinaw ng maramihang “mga iyon” ang reperensiya nang hindi inuulit ang pangngalan.
- source_word: διάβολος
  choice: ang diyablo
  rationale: Dito ay pantanging katawagan ito sa personal na espirituwal na kalaban, kaya mas malinaw ang kinikilalang katawagang “diyablo” kaysa sa etimolohikal na “maninirang-puri.”
- source_word: θερισμὸς
  choice: pag-aani
  rationale: Natural na pangngalang Tagalog na nagpapanatili sa larawang pang-agrikultura ng talinghaga.
- source_word: συντέλεια αἰῶνός
  choice: ang katapusan ng kapanahunan
  rationale: Ipinapahayag ng “kapanahunan” ang temporal na diwa ng αἰών at iniiwasang ipakahulugan agad ito bilang materyal na daigdig; ang “katapusan” ay natural habang saklaw ang ideya ng paglalagom o kaganapan.
- source_word: θερισταὶ
  choice: mga mag-aani
  rationale: Malinaw at pangkaraniwang tawag sa mga taong gumaganap ng pag-aani; pinananatili nito ang metapora nang mas natural kaysa sa isang mabigat na nominalisasyon.
- source_word: ἄγγελοί
  choice: mga anghel
  rationale: Bagaman maaari ring mangahulugang mga sugo ang ἄγγελοι, malinaw sa kontekstong eskatolohikal na mga makalangit na nilalang ang tinutukoy.
- source_word: δὲ
  choice: at / paghahati sa mga pangungusap
  rationale: Ang paulit-ulit na δέ ay nagpapasulong sa paliwanag. Isinasalin ang una bilang “At,” samantalang ipinahihiwatig ng paghahati at koordinasyon ang kasunod na mga transisyon upang maging likas sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa αἰών sa pariralang eskatolohikal na συντέλεια αἰῶνός
  choice: ang katapusan ng kapanahunan
  alternative: ang kaganapan ng kapanahunan; ang katapusan ng mundo
  rationale: Pinananatili ng “kapanahunan” ang temporal na saklaw ng αἰών nang hindi ipinapasok ang mas tiyak na ideya ng pagkalipol ng materyal na sanlibutan. Nasa talababa ang “kaganapan” upang mapanatili ang saklaw ng συντέλεια at ang tradisyonal na “katapusan ng mundo.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa karaniwang mambabasa. Pinanatili ang magkakaugnay na larawang “naghasik,” “pag-aani,” at “mga mag-aani,” at gumamit ng maikling mga pangungusap para sa natural na daloy.
