  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: tl
  text: Ngunit nang sumikat ang araw, napaso ito, at dahil walang ugat, nalanta ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “natuyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Ngunit nang sumikat ang araw
  rationale: Ang genitive absolute ay nagsasaad ng pangyayaring temporal. Pinananatili ng “ngunit” ang banayad na pagsalungat o pagpapatuloy na ipinahihiwatig ng δέ.
- source_word: ἐκαυματίσθη
  choice: napaso ang mga ito
  rationale: Ang pandiwang passive ay tumutukoy sa pagkakapaso sa init; natural ang “napaso” para sa mga halamang nabilad sa araw nang hindi pinalalabis ang tindi.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: dahil walang
  rationale: Ang διά na may articular infinitive ay nagpapahayag ng sanhi. Ang “dahil walang” ay malinaw at likas na katumbas sa modernong Tagalog.
- source_word: ῥίζαν
  choice: ugat
  rationale: Isahan ang anyo sa Griyego, at likas ding gamitin sa Tagalog ang pangkalahatang “walang ugat.”
- source_word: ἐξηράνθη
  choice: nalanta
  rationale: Sa konteksto ng halaman, ipinahihiwatig ng ξηραίνω ang pagkatuyo o pagkalanta. Ang “nalanta” ang pinakanatural sa pangunahing teksto, habang inilalagay sa talababa ang mas literal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang “mga ito” ayon sa kolektibong binhi o mga halamang tinutukoy sa mas malawak na talinhaga, kahit isahan ang mga pandiwa sa Griyego.
