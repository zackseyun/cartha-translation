  to: Ngunit ang naihasik sa mabuting lupa ay ang taong nakikinig sa salita at nakauunawa nito. Siya nga ay namumunga at nagbibigay ng ani—ang isa ay sandaan, ang isa ay animnapu, at ang isa ay tatlumpu.[a]
