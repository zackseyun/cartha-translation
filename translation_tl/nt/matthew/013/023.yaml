id: MAT.13.23
reference: Matthew 13:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: tl
  text: Ngunit ang naihasik sa mabuting lupa ay ang taong nakikinig sa salita at nakauunawa nito. Siya nga ay namumunga at nagbibigay ng ani—ang isa ay sandaan, ang isa ay animnapu, at ang isa ay tatlumpu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang isa ay sandaan, ang isa ay animnapu, at ang isa ay tatlumpu”; tumutukoy ito sa magkakaibang dami ng ani. Maaari ring ipahayag na “isang daang ulit ... animnapung ulit ... tatlumpung ulit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: sa mabuting lupa
  rationale: Sa konteksto ng paghahasik, likas sa Tagalog ang “lupa” bilang lupang tinatamnan. Ang “mabuti” rito ay tumutukoy sa pagiging angkop o mataba nito, bagaman hindi na idinagdag ang interpretasyong iyon sa teksto.
- source_word: σπαρείς
  choice: naihasik
  rationale: Pinananatili ng anyong pasibo ang larawan ng binhing inihasik at maayos itong nag-uugnay sa taong kinakatawan ng binhi.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: ang taong nakikinig sa salita
  rationale: Ipinahihiwatig ng kasalukuyang participle ang katangiang kilos. Pinanatili ang “salita” upang mapangalagaan ang bokabularyo at ugnayang pampanitikan ng Ebanghelyo.
- source_word: συνιείς
  choice: nakauunawa nito
  rationale: Ipinahahayag nito ang pagkaunawa sa salitang narinig; natural na idinagdag ang “nito” bilang pantukoy sa “salita.”
- source_word: δὴ
  choice: nga
  rationale: Ang “nga” ay natural at magaan na panandang Tagalog sa pagbibigay-diin ng δή.
- source_word: καρποφορεῖ
  choice: namumunga
  rationale: Pinananatili nito ang sentrong larawang agrikultural at ang karaniwang talinghaga ng pagiging mabunga.
- source_word: ποιεῖ
  choice: nagbibigay ng ani
  rationale: Sa konteksto, tumutukoy ang pandiwa sa paglikha o pagbibigay ng ani. Hiwalay itong isinalin sa “namumunga” upang mapanatili ang dalawang pandiwa ng Griyego nang hindi nagiging labis na paulit-ulit.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: may sandaang ulit, may animnapu, at may tatlumpu
  rationale: Malinaw at likas nitong ipinahahayag ang magkakaibang dami ng ani. Ang “ulit” ay ipinahiwatig ng kontekstong agrikultural, bagaman walang hiwalay na salitang katumbas nito sa Griyego.
theological_decisions:
- issue: Likas ng pagtugon sa salita sa talinghaga
  choice: Inilalarawan ang taong kinakatawan ng mabuting lupa bilang nakikinig, nakauunawa, at namumunga sa magkakaibang dami.
  alternative: Maaaring tahasang ipakahulugan ang pamumunga bilang pagtitiyaga, tunay na pagbabalik-loob, o patunay ng muling kapanganakan.
  rationale: Nakatuon mismo ang Griyego sa pakikinig, pagkaunawa, at pamumunga. Hindi idinagdag ang mga kategoryang doktrinal na hindi tahasang sinasabi sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naihasik,” “nakauunawa,” at “namumunga” upang mapanatili ang talinghagang agrikultural, habang ginawang natural ang pariralang tumutukoy sa dami ng ani.
