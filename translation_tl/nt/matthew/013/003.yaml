  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: tl
  text: 'At marami siyang sinabi sa kanila sa pamamagitan ng mga talinghaga: “Tingnan ninyo! Lumabas ang manghahasik upang maghasik.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησεν
  choice: sinabi
  rationale: Natural na salin ng ‘nagsalita/nagpahayag’ sa kontekstong nagtuturo si Jesus.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Ipinahahayag ang gamit o paraan ng pagtuturo; ang ‘talinghaga’ ang karaniwan at angkop na tawag sa παραβολή.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo!
  rationale: Pinananatili ang panawag-pansin ng Ἰδοὺ sa natural na modernong Filipino.
- source_word: ὁ σπείρων
  choice: ang manghahasik
  rationale: Tumutukoy sa taong naghahasik at pinananatili ang substantival na participle.
- source_word: τοῦ σπείρειν
  choice: upang maghasik
  rationale: Ipinahahayag ang layunin ng paglabas ng manghahasik.
