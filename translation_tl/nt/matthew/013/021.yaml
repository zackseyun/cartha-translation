  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: tl
  text: Ngunit wala siyang ugat sa sarili niya; pansamantala lamang siya. Kapag dumating ang paghihirap o pag-uusig dahil sa salita, agad siyang tumatalikod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “agad siyang natitisod.” Ang pandiwang Griyego ay maaari ring mangahulugang matisod o magdamdam dahil sa isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: ugat
  rationale: Pinananatili ang tahasang larawang pang-agrikultura ng talinghaga at likas itong nauunawaan sa Tagalog.
- source_word: ἐν ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Pinananatili ang reflexive at panloob na diwa nang hindi dinaragdagan ang kahulugan.
- source_word: πρόσκαιρός
  choice: panandalian lamang ang kanyang pananatili
  rationale: Likas na ipinahahayag sa Tagalog na hindi siya nagtatagal; iniiwasan nito ang alanganing literal na ‘panandalian lamang siya.’
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: kapag dumating ang paghihirap o pag-uusig
  rationale: Ginagawang temporal na sugnay ang genitive absolute. Ang ‘paghihirap’ ay malinaw at seryoso, samantalang ang ‘pag-uusig’ ang karaniwang tumpak na katumbas ng διωγμός.
- source_word: διὰ τὸν λόγον
  choice: dahil sa salita
  rationale: Pinananatili ang ugnayang leksikal sa λόγος at ang pamilyar na katawagan sa ipinahayag na mensahe sa konteksto ng talinghaga.
- source_word: εὐθὺς
  choice: agad
  rationale: Tuwirang ipinahahayag ang biglaan at mabilis na reaksiyon.
- source_word: σκανδαλίζεται
  choice: tumatalikod
  rationale: Sa konteksto, ipinahihiwatig nito ang hindi pagpapatuloy dahil sa panggigipit. Ang mas literal ngunit malawak na ‘natitisod’ ay inilalagay sa talababa upang mapanatili ang leksikal na kalabuan.
theological_decisions:
- issue: Kahulugan ng σκανδαλίζεται sa konteksto ng pagtugon sa salita
  choice: tumatalikod
  alternative: natitisod; nagdaramdam o nasasaktan dahil dito
  rationale: Ipinakikita ng konteksto ang pagbitiw sa naunang pagtanggap sa salita sa harap ng paghihirap. Gayunman, hindi tinutukoy ng salin ang isang buong doktrina tungkol sa apostasya; itinatala sa talababa ang mas malawak na saklaw ng pandiwang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghaga ng ‘ugat’ at ang katawagang ‘salita,’ habang ginawang likas sa Tagalog ang paglalarawan sa pagiging pansamantala.
