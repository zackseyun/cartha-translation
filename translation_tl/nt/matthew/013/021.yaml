    rationale: Hindi sanhi ang tahasang gramatikal na ugnayan sa οὐκ... ἀλλὰ; isang pagsalungat ito. Dapat iwasan ang dagdag na lohikal na inferensiya.
  - severity: low
    issue: Ang “ang kanyang pananatili” ay dagdag na pagpapakahulugan sa πρόσκαιρος.
    rationale: Ang pang-uri ay tuwirang naglalarawan sa tao bilang pansamantala o hindi nagtatagal; hindi kailangang magdagdag ng pangngalang “pananatili.”
  - severity: medium
    issue: Hindi tumpak ang “pagkadama ng pagkakasala” sa talababa.
    rationale: Hindi ito ang kahulugan ng σκανδαλίζομαι sa alternatibong “take offense.” Ang mas malapit ay “magdamdam” o “magalit dahil sa isang bagay,” bukod sa “matitisod.”
