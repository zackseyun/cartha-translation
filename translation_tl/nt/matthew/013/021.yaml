  source_fidelity: 'Ang “kaya” ay nagdaragdag ng ugnayang sanhi na wala sa Griyego; ang δέ/ἀλλά ay naghahayag ng pagsalungat: wala siyang ugat, kundi siya ay pansamantala. Tumpak ang natitirang daloy, kabilang ang temporal na “Kapag dumating,” ang sanhi na “dahil sa salita,” at ang diin ng “agad.”'
  naturalness: Likas ang “Kapag dumating ang paghihirap o pag-uusig...” at “agad siyang tumatalikod.” Mas maayos at mas tapat ang “pansamantala lamang siya” kaysa “kaya panandalian lamang ang kanyang pananatili,” na kapwa nagpapalit ng ugnayan at nagdaragdag ng “pananatili.”
  terminology: 'Ang “ugat,” “pag-uusig,” at “salita” ay angkop. Ang “tumatalikod” ay katanggap-tanggap sa konteksto para sa σκανδαλίζεται, habang dapat ayusin ang talababa: ang “takes offense” ay hindi “pagkadama ng pagkakasala,” kundi pagdaramdam/pagkatisod o pagkagalit dahil sa isang bagay.'
