  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: tl
  text: Pagkatapos niyang iwan ang mga tao, pumasok siya sa bahay. Lumapit sa kanya ang kanyang mga alagad at sinabi, “Ipaliwanag mo sa amin ang talinghaga ng mga damong ligaw[a] sa bukid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga panirang damo.” Ang salitang Griyego ay maaaring mas partikular na tumukoy sa darnel, isang damong kahawig ng trigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay na nagpapakita ng kasunod na pangyayari.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: iniwan niya ang mga tao
  rationale: Ipinahahayag nang natural sa Tagalog ang naunang kilos ng pag-alis niya mula sa mga nagkakatipon; ang maramihang ὄχλους ay naihahatid ng kolektibong “mga tao.”
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: pumasok sa bahay
  rationale: Malinaw na ipinahahayag ang pagkilos mula sa labas papasok sa tiyak na bahay na tinutukoy ng artikulong Griyego.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Lumapit sa kanya ang kanyang mga alagad
  rationale: Natural at tuwirang katumbas ng paglapit ng mga alagad sa kanya.
- source_word: λέγοντες
  choice: at sinabi
  rationale: Ang koordinadong pandiwa ay mas natural sa makabagong Tagalog kaysa sa literal na anyong “na nagsasabi,” habang pinananatili ang ugnayan ng mga kilos.
- source_word: Διασάφησον ἡμῖν
  choice: Ipaliwanag mo sa amin
  rationale: Tuwirang hinihingi ng pautos na pandiwa na gawing malinaw sa kanila ang kahulugan.
- source_word: τὴν παραβολὴν
  choice: ang talinghaga
  rationale: Karaniwan at angkop na katawagan sa Tagalog para sa παραβολή sa konteksto ng mga Ebanghelyo.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: tungkol sa mga damo sa bukid
  rationale: Nauunawaan ng karaniwang mambabasa at pinananatili ang ugnayan ng mga damo at bukid; inilalagay sa talababa ang posibleng mas tiyak na uri ng damo.
