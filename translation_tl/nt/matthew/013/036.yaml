  source_fidelity: Ang diwa ng talata ay wastong naihahatid, ngunit ang ugnayan ng aorist participle na ἀφεὶς sa pangunahing kilos ay mas malinaw na maipapakita sa “Pagkatapos niyang iwan…”. Ang “mga damong ligaw” ay mas tiyak na katumbas ng ζιζάνια kaysa sa payak na “mga damo,” na maaari ring mangahulugang karaniwang damo o damuhan.
  naturalness: Natural at marangal ang ayos ng pangungusap sa makabagong Tagalog. Ang binagong unang pangungusap ay mas dumadaloy at malinaw ang pagkakasunod ng mga kilos.
  terminology: Ang “mga alagad,” “Ipaliwanag mo sa amin,” at “talinghaga” ay angkop at pare-pareho sa karaniwang terminolohiya ng mga Ebanghelyo. Pinananatili ng talababa ang hindi ganap na tiyak na pagkakakilanlan ng ζιζάνια bilang darnel.
