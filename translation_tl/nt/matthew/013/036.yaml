    rationale: Ang ζιζάνια ay tumutukoy sa mga damong nakapipinsala o ligaw na tumutubo sa pananim. Ang “mga damong ligaw” ay mas natural at mas tumpak, samantalang ang posibleng darnel ay nananatili sa talababa.
