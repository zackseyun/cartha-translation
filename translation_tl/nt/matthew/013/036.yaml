translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tao” bilang natural na kolektibong salin ng maramihang “mga pulutong,” at pinanatili sa talababa ang leksikal na katiyakan hinggil sa ζιζάνια.
