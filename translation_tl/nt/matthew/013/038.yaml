id: MAT.13.38
reference: Matthew 13:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: tl
  text: Ang bukid ay ang mundo, at ang mabuting binhi—sila ang mga anak ng kaharian.[a] Ang mga damo[b] naman ay ang mga anak ng Masama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak” ay isang relasyonal na pananalita para sa mga taong kabilang sa kaharian; gayundin ang gamit nito sa “mga anak ng Masama.”
    reason: cultural_note
  - marker: b
    text: Mas tiyak, isang uri ng damong kahawig ng trigo, na tinatawag na darnel; sa mga lumang salin, “mga pangsirang damo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: bukid
  rationale: Likas at malinaw na katawagan sa Tagalog para sa lupang sinasaka sa konteksto ng talinghagang agrikultural.
- source_word: κόσμος
  choice: mundo
  rationale: Pinananatili ang malawak na saklaw ng κόσμος bilang daigdig na pinangyayarihan ng paghahasik.
- source_word: καλὸν σπέρμα
  choice: mabuting binhi
  rationale: Pinananatili ang larawang agrikultural at ang tuwirang pagsalungat sa mga damo.
- source_word: οὗτοί εἰσιν
  choice: sila ang
  rationale: Ipinakikita ang paglipat mula sa kolektibong sagisag na 'binhi' tungo sa mga taong kinakatawan nito.
- source_word: υἱοὶ τῆς βασιλείας
  choice: mga anak ng kaharian
  rationale: Ang 'anak' ang natural na salin sa Tagalog ng relasyonal na idyomang υἱοί; hindi nito kailangang tukuyin ang kasarian at saklaw nito ang mga taong kabilang sa kaharian.
- source_word: ζιζάνια
  choice: mga damo
  rationale: Madaling maunawaan ng karaniwang mambabasa; inilalagay sa talababa ang mas tiyak na uri ng damo.
- source_word: τοῦ πονηροῦ
  choice: ng Masama
  rationale: Ipinahihiwatig ng may-artikulong panlalaking isahan na anyo ang isang personal na tinutukoy. Ang malaking titik ay tumutulong upang malinaw na basahin ito bilang katawagan sa masamang persona, hindi bilang abstraktong kasamaan.
theological_decisions:
- issue: Kung personal o abstrakto ang τοῦ πονηροῦ
  choice: ng Masama
  alternative: ng kasamaan
  rationale: Mas natural na tumutukoy sa isang persona ang articular masculine singular genitive sa pariralang 'mga anak ng'; pinananatili nitong personal ang tinutukoy nang hindi tahasang idinaragdag ang pangalang 'Satanas' o 'Diyablo.'
- issue: Kung literal na panlalaki ang υἱοί o relasyonal na kinatawan
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Walang likas na gramatikal na kasarian ang Tagalog na 'anak.' Tumpak nitong naihahatid ang relasyonal na idyoma at hindi nagdaragdag ng eksklusibong kasariang hindi kinakailangang ipinahihiwatig ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang em dash upang mapanatili ang diin ng οὗτοί εἰσιν, at ang “naman” upang likas na maipakita sa Tagalog ang paghahambing at pagsalungat na dala ng δέ.
