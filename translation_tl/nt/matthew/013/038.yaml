  source_fidelity: 'Tumpak na naihahatid ang tatlong pagpapaliwanag sa Griyego: ang bukid bilang mundo, ang mabuting binhi bilang mga anak ng kaharian, at ang mga damo bilang mga anak ng Masama. Ang “sila ang” ay wasto para sa maramihang οὗτοί at malinaw na ipinapakita ang paglipat mula sa sagisag tungo sa mga taong tinutukoy.'
