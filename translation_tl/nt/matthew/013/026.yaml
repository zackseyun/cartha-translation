  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: tl
  text: Ngunit nang sumibol na ang pananim at naglabas ng mga butil, saka lumitaw din ang mga damong ligaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tares”; maaaring isang tiyak na uri ng damo, gaya ng darnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ngunit nang
  rationale: Ipinapahayag ng ὅτε ang panahon ng pangyayari, samantalang ang δέ ay banayad na pang-ugnay na may bahagyang pagsalungat sa naunang tagpo.
- source_word: ἐβλάστησεν
  choice: sumibol na
  rationale: Ang pandiwang βλαστάνω ay tumutukoy sa pagsibol o pag-usbong. Ang “na” ay likas na nagpapakita sa Filipino na naganap muna ito bago napansin ang mga damong ligaw.
- source_word: ὁ χόρτος
  choice: ang pananim
  rationale: Bagaman maaari itong mangahulugang damo o halaman, sa konteksto ng bukid ay tumutukoy ito sa itinanim na pananim bilang isang kabuuan.
- source_word: καρπὸν ἐποίησεν
  choice: naglabas ng mga butil
  rationale: Literal itong tumutukoy sa paglalabas o pagbubunga ng ani. Dahil trigo ang pananim sa talinghaga, malinaw at natural ang “mga butil” nang hindi gumagamit ng mas malawak na “bunga.”
- source_word: τότε
  choice: saka
  rationale: Ipinakikita ng τότε ang kasunod na yugto ng pangyayari; natural na katumbas nito rito ang “saka.”
- source_word: ἐφάνη
  choice: lumitaw
  rationale: Ipinahihiwatig ng anyo ng φαίνω na naging nakikita o napansin ang mga ito; maikli at natural ang “lumitaw.”
- source_word: καὶ τὰ ζιζάνια
  choice: rin ... ang mga damong ligaw
  rationale: Ginamit ang madaling maunawaang pangkalahatang katawagan para sa ζιζάνια, habang ipinahahayag ng “rin” ang dagdag na diwa ng καί. Inilagay sa talababa ang posibleng mas tiyak na pagkakakilanlan.
theological_decisions:
- issue: Tiyak na pagkakakilanlan ng ζιζάνια
  choice: “mga damong ligaw” sa pangunahing teksto
  alternative: “mga pangsirang damo,” “mga zizania,” o ang mas tiyak na “darnel”
  rationale: Hindi hinihingi ng talata ang tiyak na botanikong pagkakakilanlan. Pinananatiling malinaw sa karaniwang mambabasa ang pangunahing teksto, habang inilalahad sa talababa ang tradisyonal o posibleng mas tiyak na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pananim” bilang kolektibong katawagan at ang “mga damong ligaw” bilang madaling maunawaang paglalarawan, nang hindi nagpapasok ng tiyak na botanikong pakahulugan sa pangunahing teksto.
