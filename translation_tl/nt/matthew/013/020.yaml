  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: tl
  text: Tungkol naman sa taong naihasik sa mabatong lupa[a], siya ang nakikinig sa salita at agad na tinatanggap ito nang may kagalakan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa mabatong mga lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Tungkol naman sa naihasik sa mabatong lupa
  rationale: Ginagamit ng parirala ang participle bilang pangngalan at ibinabalik ang mambabasa sa larawan ng binhi at lupa. Ang “Tungkol naman” ay likas na paglilipat para sa δέ, at pinananatili ng “naihasik” ang pasibong talinghaga nang hindi tahasang nilulutas kung binhi o taong kinakatawan ang tinutukoy.
- source_word: πετρώδη
  choice: mabatong lupa
  rationale: Tumutukoy ito sa mabato o mabatong kalupaan. Likas sa modernong Tagalog ang “mabatong lupa” at malinaw na nagpapanatili sa larawang pang-agrikultura.
- source_word: σπαρείς
  choice: naihasik
  rationale: Aorist passive participle ito ng σπείρω. Maikli at natural ang “naihasik” at pinananatili nito ang pasibong larawan ng paghahasik.
- source_word: οὗτός ἐστιν
  choice: ito ang
  rationale: Direkta at likas na pangungusap ng pagkakakilanlan sa Tagalog; hindi nito dinaragdagan ng paliwanag na “kumakatawan sa.”
- source_word: ὁ τὸν λόγον ἀκούων
  choice: nakikinig sa salita
  rationale: Ang present participle ay likas na naipapahayag sa Tagalog bilang “nakikinig.” Pinanatili ang “salita” sa halip na ipakahulugang “mensahe” upang mapanatili ang pananalita at tematikong ugnayan ng teksto.
- source_word: εὐθὺς
  choice: agad
  rationale: Karaniwan, malinaw, at eksaktong katumbas na nagpapahayag ng mabilis na pagtugon.
- source_word: μετὰ χαρᾶς
  choice: nang may kagalakan
  rationale: Pinananatili nito ang pangngalang χαρά at nagbibigay ng marangal ngunit madaling maunawaang modernong Tagalog.
- source_word: λαμβάνων αὐτόν
  choice: itong tinatanggap
  rationale: Sa konteksto, ang λαμβάνω ay tumutukoy sa pagtanggap sa salita. Nililinaw ng “ito” ang pagbabalik-tukoy sa “salita” nang hindi nagpapakahulugan nang higit sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng “naihasik” sa paliwanag ng talinghaga
  choice: Panatilihin ang siksik na talinghagang “ang naihasik sa mabatong lupa,” saka tukuyin ito bilang taong nakikinig.
  alternative: 'Isalin nang mas mapagpaliwanag: “Ang binhing naihasik sa mabatong lupa ay kumakatawan sa taong…”'
  rationale: Sa Griyego, nananatiling magkasalikop ang binhing inihasik at ang taong kinakatawan nito. Hindi tahasang nilulutas ng salin ang sinadyang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang talinghagang pang-agrikultura at ang bahagyang pagsisiksik ng orihinal, habang ginawang idiomatiko ang ayos ng pangungusap.
