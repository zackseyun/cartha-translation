  source_fidelity: 'Ang draft ay tapat sa pangunahing kahulugan ng Griyego: ang naihasik sa mabatong kalupaan ay inilalarawan bilang nakikinig sa salita at agad itong tinatanggap nang may kagalakan. Gayunman, ang “ito ang nakikinig” ay hindi sapat na malinaw sa Tagalog dahil ang “ito” ay mas madaling unawaing tumutukoy sa binhi o bagay, samantalang ang panlalaking substantibong participle na ὁ ... σπαρείς ay tumutukoy sa taong inilalarawan sa talinghaga.'
