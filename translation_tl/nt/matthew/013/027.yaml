id: MAT.13.27
reference: Matthew 13:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: tl
  text: Kaya lumapit sa kanya ang mga alipin ng amo ng sambahayan at sinabi, “Panginoon, hindi ba mabuting binhi ang inihasik mo sa iyong bukid? Saan ngayon nanggaling ang mga damo[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “darnel,” isang nakapipinsalang damo na malamang na tinutukoy ng salitang Griyego at kahawig ng trigo habang bata pa ang mga halaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: lumapit sa kanya
  rationale: Ipinapakita ang paglapit sa amo bilang kilos na nauna sa pagsasalita, gaya ng aorist participle sa Griyego.
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili ang kalagayang nakatali sa kapangyarihan ng amo, sa halip na palambutin bilang karaniwang mga lingkod o katulong.
- source_word: οἰκοδεσπότου
  choice: amo ng sambahayan
  rationale: Ipinahahayag kapuwa ang pamamahala niya sa sambahayan at ang kaugnayan niya sa mga alipin; mas natural ito sa modernong Filipino kaysa sa literal na “panginoon ng bahay.”
- source_word: Κύριε
  choice: Panginoon
  rationale: Pinananatili ang karaniwang salin ng κύριος at ang magalang na pagtawag sa amo sa loob ng talinghaga, nang hindi ipinapalagay na tuwirang kristolohikal ang gamit dito.
- source_word: οὐχὶ
  choice: hindi ba
  rationale: Natural na tanong sa Filipino na umaasang oo ang sagot.
- source_word: καλὸν σπέρμα
  choice: mabuting binhi
  rationale: Tuwiran at likas na katumbas sa kontekstong pansakahan.
- source_word: ἔσπειρας
  choice: inihasik mo
  rationale: Ang “inihasik” ang tiyak na salitang pansakahan para sa σπείρω at pinananatili ang nagdaang kilos.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: sa iyong bukid
  rationale: Malinaw at natural na ipinahahayag ang pagmamay-ari at lugar.
- source_word: πόθεν οὖν
  choice: Saan ngayon nanggaling
  rationale: Pinananatili ang tanong tungkol sa pinagmulan at ang inferensiyang ipinahihiwatig ng οὖν, sa natural na ayos ng Filipino.
- source_word: ἔχει ζιζάνια
  choice: nanggaling ang mga damo
  rationale: Isinasalin ang diwa ng tanong tungkol sa pagkakaroon o paglitaw ng ζιζάνια sa paraang natural sa Filipino, nang hindi gamitin ang pilit na literal na “bakit mayroon itong.”
- source_word: ζιζάνια
  choice: mga damo
  rationale: Ito ang malinaw na pangunahing salin para sa pangkalahatang mambabasa; inilalagay sa talababa ang malamang na mas tiyak na uring darnel.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλοι sa sambahayang nasa talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Hindi gumagawa ang talata ng aral tungkol sa pang-aalipin, ngunit ang “mga alipin” ang mas tapat na nagpapanatili sa panlipunang katayuan at ganap na pagpapasakop na ipinahihiwatig ng δοῦλοι.
- issue: Pagpapakahulugan sa κύριε bilang tawag sa amo
  choice: Panginoon
  alternative: Amo
  rationale: Pinananatili ang karaniwang katumbas ng κύριος at ang marangal na anyo ng pagtawag. Sa kontekstong ito, maaari rin itong mangahulugang “Amo,” kaya hindi dapat ituring na tahasang pahayag tungkol sa pagkakakilanlan ni Jesus.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “amo ng sambahayan” upang malinaw ang ugnayan sa “mga alipin,” at ang “Panginoon” bilang magalang na tuwirang pagtawag. Inilagay ang [a] kaagad pagkatapos ng “mga damo,” ang salitang nililinaw ng talababa.
