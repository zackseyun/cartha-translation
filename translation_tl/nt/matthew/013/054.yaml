id: MAT.13.54
reference: Matthew 13:54
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: tl
  text: Pagdating niya sa kanyang bayan, nagtuturo siya sa kanilang sinagoga. Kaya labis silang namangha at sinabi, “Saan nakuha ng taong ito ang ganitong karunungan at ang mga kapangyarihang ito[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga makapangyarihang gawa”; literal, “mga kapangyarihan.” Tumutukoy ito sa mga gawang nagpapakita ng kapangyarihan at madalas na inuunawa bilang mga himala.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: sarili niyang bayan
  rationale: Sa kontekstong ito, tumutukoy ito sa bayang kinalakhan ni Jesus at kung saan kilala siya ng mga tagaroon, hindi sa isang bansa. Likas sa Tagalog ang “sarili niyang bayan” at hindi nito nililimitahan ang kahulugan sa lugar ng kapanganakan.
- source_word: ἐδίδασκεν
  choice: nagtuturo siya
  rationale: Pinananatili ng aspektong imperpektibo ang nagpapatuloy na kilos ng pagtuturo sa nakaraang tagpo.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Ito ang malinaw at karaniwang tawag sa lugar at institusyon ng pagtitipon ng mga Judio sa kontekstong ito.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Dahil dito, labis silang namangha at sinabi
  rationale: Ipinahahayag ng ὥστε ang naging bunga ng kanyang pagtuturo. Ang “labis na namangha” ay naghahatid ng matinding pagkagulat na ipinahihiwatig ng ἐκπλήσσομαι, habang natural sa Tagalog ang mga pandiwang nasa anyong tahasan.
- source_word: Πόθεν
  choice: Saan nakuha
  rationale: Ang tanong ay tungkol sa pinagmulan ng karunungan at makapangyarihang mga gawa. Ang “Saan nakuha” ang natural na katumbas nito sa modernong Tagalog.
- source_word: τούτῳ
  choice: ng taong ito
  rationale: Ang demonstratibo ay may bahagyang mapaglayong tono. Natural itong naipahahayag ng “taong ito” sa siniping pananalita.
- source_word: σοφία
  choice: karunungan
  rationale: Karaniwang katumbas ito ng σοφία at tumutukoy rito sa pambihirang dunong na nahahayag sa pagtuturo ni Jesus.
- source_word: δυνάμεις
  choice: mga makapangyarihang gawa
  rationale: Bagaman literal na “mga kapangyarihan,” ginagamit dito ang salita para sa mga gawang nagpapakita ng kapangyarihan. Ang “mga makapangyarihang gawa” ay mas natural kaysa “mga kapangyarihan” sa Tagalog at hindi kasing-interpretibo ng “mga himala.”
theological_decisions:
- issue: Paglalarawan sa δυνάμεις na kaugnay ng mga pambihirang gawa ni Jesus
  choice: mga makapangyarihang gawa
  alternative: mga kapangyarihan; mga himala
  rationale: Ipinakikita ng parirala na namangha ang mga tao sa mga gawang nahahayag ang kapangyarihan ni Jesus, ngunit hindi nito tahasang ginagamit ang salitang teknikal para sa “himala.” Pinananatili ng salin ang diin sa kapangyarihan at iniiwasang paliitin nang di-kailangan ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sarili niyang bayan” para sa lokal na diwa ng πατρίς at “mga makapangyarihang gawa” upang mapanatili ang ugnayan ng δυνάμεις sa kapangyarihan nang hindi agad pinapalitan ng mas interpretibong “mga himala.”
