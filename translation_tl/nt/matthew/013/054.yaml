  to: Pagdating niya sa kanyang bayan, nagtuturo siya sa kanilang sinagoga. Kaya labis silang namangha at sinabi, “Saan nakuha ng taong ito ang ganitong karunungan at ang mga kapangyarihang ito[a]?”
  rationale: Pinalitan ang “sarili niyang bayan” ng mas natural na “kanyang bayan.” Pinalitan ang “mga makapangyarihang gawang ito” ng “mga kapangyarihang ito” upang mas tapat na maipakita ang δυνάμεις at mapanatili ang pagiging hindi ganap na espesipiko ng salita. Inilipat sa talababa ang kontekstuwal na alternatibong “mga makapangyarihang gawa.”
