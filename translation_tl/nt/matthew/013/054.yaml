  naturalness: Natural ang pangkalahatang daloy, ngunit mas idiomatiko at hindi paulit-ulit ang “kanyang bayan” kaysa “sarili niyang bayan.” Ang “nagtuturo siya” ay katanggap-tanggap na aspektuwal na paglalarawan sa nagaganap na pagtuturo sa nakaraang tagpo.
  terminology: “Sinagoga,” “karunungan,” at “taong ito” ay angkop. Mas mabuting gamitin sa teksto ang “mga kapangyarihang ito” upang mapanatili ang lawak ng δυνάμεις; maaaring ipaliwanag ng talababa ang alternatibong “mga makapangyarihang gawa” at ang kaugnayan nito sa mga himala.
