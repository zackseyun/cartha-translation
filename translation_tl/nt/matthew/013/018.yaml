  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: tl
  text: Kaya, kayo naman, pakinggan ninyo ang talinghaga ng naghasik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Tahasang binanggit at binigyang-diin ang panghalip sa Griyego; pinananatili ito sa Tagalog sa halip na ipaubaya lamang sa anyo ng pandiwa.
- source_word: οὖν
  choice: kaya
  rationale: Ipinahihiwatig ng οὖν ang kaugnayan o paghinuha mula sa naunang sinabi; natural itong naipapahayag ng “kaya” sa modernong Tagalog.
- source_word: ἀκούσατε
  choice: pakinggan ninyo
  rationale: Pautos ito sa maramihan. Mas natural sa Tagalog ang “pakinggan ninyo” kaysa literal na “dinggin ninyo,” habang hindi ito pinalalawak tungo sa “unawain.”
- source_word: παραβολὴν
  choice: talinghaga
  rationale: Ang “talinghaga” ang nakaugaliang salin ng παραβολή sa konteksto ng pagtuturo ni Jesus at nauunawaan sa marangal na modernong Tagalog.
- source_word: τοῦ σπείραντος
  choice: ng naghasik
  rationale: Tuwirang inilalarawan ng articular aorist participle ang taong naghasik. Pinananatili ng “naghasik” ang aspektong naganap na kilos at iniiwasang gawing nakapirming titulo ang parirala.
theological_decisions:
- issue: Kahulugan ng ἀκούσατε
  choice: pakinggan ninyo
  alternative: unawain ninyo
  rationale: Bagaman maaaring magpahiwatig ng pagtanggap at pag-unawa ang pakikinig sa konteksto, ang pandiwa mismo ay ἀκούω. Hindi tahasang isinasalin bilang “unawain” upang hindi alisin ang posibleng lawak at tensiyon ng kahulugan.
translation_notes:
  register: Natural, kasalukuyan, at marangal na Tagalog. Ang ayos na “Kaya kayo” ay sadyang nagpapanatili sa diin ng tahasang Ὑμεῖς; ang “ng naghasik” ay maikli at malapit sa kayariang Griyego.
