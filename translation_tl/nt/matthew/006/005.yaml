id: MAT.6.5
reference: Matthew 6:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: tl
  text: 'At tuwing nananalangin kayo, huwag kayong tumulad sa mga mapagkunwari. Mahilig silang manalangin nang nakatayo sa mga sinagoga at sa mga panulukan ng malalapad na lansangan[a] upang makita sila ng mga tao. Totoong sinasabi ko sa inyo: natanggap na nila nang buo ang kanilang gantimpala.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa mga kanto.” Mas literal sa Griyego: “sa mga panulukan ng malalapad na lansangan.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “natanggap na nila ang kanilang gantimpala.” Ang pandiwang Griyego ay maaari ring magpahiwatig na natanggap na nang buo ang kabayaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: tuwing nananalangin kayo
  rationale: Ipinahahayag ang di-tiyak at paulit-ulit na pagkakataon ng ὅταν kasama ng pangkasalukuyang subjunctive.
- source_word: οὐκ ἔσεσθε ὡς
  choice: huwag kayong tumulad sa
  rationale: Natural na makabagong Tagalog para sa future indicative na may lakas ng pagbabawal.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Karaniwang salitang Tagalog para sa mga nagpapakitang-tao sa kabanalan; hindi nakasandig lamang sa etimolohikong diwa na 'mga artista.'
- source_word: φιλοῦσιν
  choice: mahilig sila
  rationale: Ipinananatili ang diwa ng pagkagusto o pagkahilig sa pampublikong pagpapakitang ito.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: sa mga sinagoga
  rationale: Pinananatili ang tiyak na institusyong Judio at ang makasaysayang tagpuan.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: sa mga panulukan ng malalapad na lansangan
  rationale: Malapit sa anyo ng Griyego habang malinaw pa rin sa modernong Tagalog.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: manalangin nang nakatayo
  rationale: Iniuugnay ang participle sa paraan ng pananalangin nang natural sa Tagalog, nang hindi ipinahihiwatig na ang pagtayo mismo ang pinupuna.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: upang makita sila ng mga tao
  rationale: Malinaw na ipinahahayag ang layunin; ang ἀνθρώποις ay pangkalahatang tumutukoy sa mga tao, hindi lamang sa mga lalaki.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Totoong sinasabi ko sa inyo
  rationale: Pinananatili ang mariing pormula ni Jesus sa dignified ngunit nauunawaang Tagalog.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: natanggap na nila nang buo ang kanilang gantimpala
  rationale: Ipinakikita ang komersiyal na idyoma ng ἀπέχω, na maaaring mangahulugang natanggap na ang kabayaran nang buo.
theological_decisions:
- issue: Saklaw ng ἀνθρώποις
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang tinutukoy sa konteksto, kaya iniiwasang paliitin ang saklaw sa mga lalaking tagamasid lamang.
- issue: Lakas ng ἀπέχουσι sa pahayag tungkol sa gantimpala
  choice: natanggap na nila nang buo ang kanilang gantimpala
  alternative: natanggap na nila ang kanilang gantimpala
  rationale: Pinananatili ang posibleng idyomatikong diwa ng ganap na pagkakatanggap, ngunit inilalagay sa talababa ang mas payak na alternatibo upang hindi ikubli ang leksikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pananalangin,” “sinagoga,” at “gantimpala” bilang pamilyar na bokabularyong biblikal; iniwasan ang labis na sinauna o kolokyal na pananalita.
