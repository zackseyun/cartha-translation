  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Griyego: ang paulit-ulit na panahon ng ὅταν ay naipahayag sa “tuwing,” ang pagbabawal sa “huwag kayong tumulad,” ang layuning magpakita sa mga tao, at ang idyomatikong puwersa ng ἀπέχουσι sa “natanggap na nila nang buo.” Nananatili rin ang makasaysayang tiyak na “mga sinagoga.”'
