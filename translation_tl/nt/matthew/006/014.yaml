base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: tl
  text: Sapagkat kung patatawarin ninyo ang mga tao sa kanilang mga pagkakasala[a], patatawarin din kayo ng inyong Ama na nasa langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga paglabag,” “mga pagkukulang,” o “mga maling ginawa.” Ang salitang Griyego ay tumutukoy sa mga paglabag sa moral o mga maling hakbang.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang inyong Ama, ang makalangit”; tradisyonal ding isinasalin na “inyong Ama sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang panalangin, at likas na ipinahahayag ng “kung” ang kondisyong nasa Griyego.
- source_word: ἀφῆτε … ἀφήσει
  choice: patatawarin … patatawarin
  rationale: Sa kontekstong ito, ang ἀφίημι ay tumutukoy sa pagpapatawad. Iisang salitang-ugat ang ginamit sa dalawang bahagi upang mapanatili ang malinaw na pagtutugma ng mga pandiwa.
- source_word: τοῖς ἀνθρώποις
  choice: ang mga tao
  rationale: Pangkalahatan ang ἄνθρωποι at hindi lamang tumutukoy sa mga lalaki; natural at inklusibo ang “mga tao” sa makabagong Tagalog.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: kanilang mga pagkakasala
  rationale: Ang παράπτωμα ay moral na pagkadapa, paglabag, o pagkakasala. Ang “mga pagkakasala” ay malinaw, marangal, at angkop sa ugnayang pantao sa konteksto.
- source_word: καὶ ὑμῖν
  choice: din kayo
  rationale: Inililipat ng “din” ang diwa ng καί bilang katumbas na tugon, samantalang ang ὑμῖν ay likas na ginagawang tuwirang layon na “kayo” sa Tagalog.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: inyong Ama na nasa langit
  rationale: Likas ito sa Tagalog at tapat sa paglalarawan sa Ama bilang makalangit, nang hindi pinipilit ang hindi gaanong natural na literal na ayos ng Griyego.
theological_decisions:
- issue: Kondisyonal na ugnayan ng pagpapatawad sa kapwa at pagpapatawad ng Diyos
  choice: 'Isinalin bilang tuwirang tunay na kondisyon: “kung … patatawarin din.”'
  alternative: Ipaliwanag na ang pagpapatawad sa kapwa ay alinman sa dahilan upang makamit ang pagpapatawad ng Diyos o patunay lamang ng nauna nang pagpapatawad ng Diyos.
  rationale: Tuwirang kondisyon ang ipinahahayag ng Griyego. Hindi nilulutas ng salin ang teolohikal na tensiyon sa pamamagitan ng pagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo/inyong” bilang pamantayang maramihang anyo, at pinanatili ang maikli at balanseng estruktura ng pangungusap.
