base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: tl
  text: Kaya huwag kayong mag-alala[a] sa pagsasabing, ‘Ano ang kakainin natin?’ o ‘Ano ang iinumin natin?’ o ‘Ano ang isusuot natin?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kayong mabalisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Kaya huwag kayong mag-alala
  rationale: Ang μεριμνάω sa konteksto ay tumutukoy sa balisang pag-aalala tungkol sa mga pangunahing pangangailangan. Likas sa modernong Tagalog ang “huwag kayong mag-alala,” habang pinananatili ng “Kaya” ang inferensiyang ipinahihiwatig ng οὖν.
- source_word: λέγοντες
  choice: at magsabi
  rationale: Ipinapahayag ng participle ang pananalitang kasabay at nagpapakita ng nilalaman ng pag-aalala. Ang “at magsabi” ay malinaw at natural sa Tagalog sa pagsisimula ng mga tuwirang tanong.
- source_word: Τί
  choice: Ano ang
  rationale: Karaniwang panimula ito ng mga tuwirang tanong sa Tagalog tungkol sa kinakailangang pagkain, inumin, at kasuotan.
- source_word: φάγωμεν
  choice: kakainin natin
  rationale: Ang deliberative aorist subjunctive ay tumutukoy sa inaasahang pagkain. Ang “Ano ang kakainin natin?” ay natural na Tagalog at pinananatili ang pag-aalala tungkol sa hinaharap na panustos.
- source_word: πίωμεν
  choice: iinumin natin
  rationale: Kaagapay ito ng φάγωμεν at likas na isinasalin bilang “Ano ang iinumin natin?” sa tanong tungkol sa hinaharap na panustos.
- source_word: περιβαλώμεθα
  choice: isusuot natin
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagsusuot ng damit. Ang “Ano ang isusuot natin?” ang pinakanatural na katumbas sa Tagalog.
- source_word: ἤ ... ἤ ... ἤ
  choice: o ... o ... o
  rationale: Pinananatili ng paulit-ulit na “o” ang tatlong magkakahiwalay na tanong ng tekstong Griyego.
theological_decisions:
- issue: Saklaw ng pagbabawal ni Jesus tungkol sa mga materyal na pangangailangan
  choice: Isinalin ang μεριμνήσητε bilang pagbabawal sa balisang pag-aalala, hindi bilang ganap na pagbabawal sa maingat at responsableng pagpaplano.
  alternative: Huwag kayong mabalisa; huwag kayong mabahala kailanman.
  rationale: Ang agarang konteksto ay tungkol sa pagkabalisa sa panustos. Ang “huwag kayong mag-alala” ay nagpapanatili sa diin ng utos nang hindi ipinapasok ang ideyang ipinagbabawal ang responsableng paghahanda.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang pangmaramihang “kayo/natin” ayon sa kausap at sa mga unang-panauhang maramihang tanong ng Griyego. Pinanatili ang tatlong tanong at ang paulit-ulit na pangatnig.
