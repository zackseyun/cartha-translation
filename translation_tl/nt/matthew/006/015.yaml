base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: tl
  text: Ngunit kung hindi ninyo patatawarin ang mga tao, hindi rin patatawarin ng inyong Ama ang inyong mga paglabag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagsalangsang” o “mga pagkakasala.”
    reason: Mga posibleng katumbas ng παραπτώματα, na tumutukoy sa mga paglabag o pagsalangsang.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Ngunit kung hindi
  rationale: Ipinahahayag ng ἐὰν ang kondisyon, ng δέ ang pagsalungat sa naunang talata, at ng μή ang pagtanggi. Likas at malinaw sa modernong Tagalog ang “Ngunit kung hindi.”
- source_word: ἀφῆτε
  choice: patatawarin
  rationale: Sa kontekstong ito, ang ἀφίημι ay tumutukoy sa pagpapatawad sa kapwa. Ginamit ang aspektong magaganap upang umayon sa kondisyong ipinahahayag ng pangungusap at mapanatili ang pag-uulit ng pandiwa sa dalawang sugnay.
- source_word: τοῖς ἀνθρώποις
  choice: ang mga tao
  rationale: Pangkalahatan ang ἄνθρωποι at hindi lamang tumutukoy sa mga lalaki. Ang “mga tao” ang tuwiran at likas na katumbas sa Tagalog.
- source_word: οὐδὲ
  choice: hindi rin
  rationale: 'Pinananatili ng “hindi rin” ang negatibong pagtutumbas ng dalawang sugnay: kung hindi sila magpapatawad, hindi rin sila patatawarin ng Ama.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: ang inyong Ama
  rationale: “Inyong Ama” lamang ang nasa Griyego; hindi idinagdag ang “nasa langit” na wala sa talatang ito.
- source_word: ἀφήσει
  choice: patatawarin
  rationale: Inulit ang parehong salitang ginamit para sa unang anyo ng ἀφίημι upang mapanatili ang malinaw na pagkakatapat ng pagpapatawad ng tao at ng Ama.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: ang inyong mga pagkakasala
  rationale: Ang παραπτώματα ay tumutukoy sa mga maling gawa, paglabag, o kasalanan. Ang “mga pagkakasala” ay natural, may sapat na bigat na moral, at madaling maunawaan sa modernong Tagalog.
theological_decisions:
- issue: Ang kondisyong ugnayan ng pagpapatawad ng tao at pagpapatawad ng Diyos
  choice: 'Pinanatili ang tuwirang kondisyong pahayag: “kung hindi ... hindi rin.”'
  alternative: Ipaliwanag ito bilang katibayan lamang ng banal na pagpapatawad, o bilang pagkawala lamang ng pakikisama sa Diyos.
  rationale: Tuwirang kondisyon ang ipinahahayag ng Griyego. Hindi dapat lutasin ng salin ang mas malawak na usaping teolohikal sa pamamagitan ng pagpapalambot o pagpapakahulugan sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/inyong” upang katawanin ang ὑμῶν at maiwasan ang kalabuan; pinanatili ang “Ama” bilang katawagang nasa teksto.
