id: MAT.6.26
reference: Matthew 6:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: tl
  text: 'Masdan ninyo ang mga ibon sa himpapawid[a]: hindi sila naghahasik, nag-aani, ni nag-iimbak sa mga kamalig, at pinapakain sila ng inyong Ama sa langit. Hindi ba’t higit kayong mahalaga kaysa sa kanila?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga ibon sa langit.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Hindi ba’t mas mahalaga kayo kaysa sa kanila?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Tingnan ninyo
  rationale: Nagpapahayag ang aorist imperative ng tuwirang utos na ituon ang pansin. Likas at malinaw sa modernong Tagalog ang “Tingnan ninyo” nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: mga ibon sa langit
  rationale: Tumutukoy ang πετεινά sa mga ibon o lumilipad na nilalang, at ang τοῦ οὐρανοῦ rito ay likas na tumutukoy sa nakikitang kalangitan. Ang “mga ibon sa langit” ay tuwiran at nauunawaan sa konteksto.
- source_word: ὅτι
  choice: ':'
  rationale: Ipinakikilala ng ὅτι ang bagay na dapat pagmasdan tungkol sa mga ibon. Ginamit ang tutuldok upang maipahayag ito nang natural sa Tagalog nang hindi sapilitang pinipili sa pagitan ng “sapagkat” at “na.”
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: hindi sila naghahasik, nag-aani, o nag-iipon
  rationale: 'Pinananatili ng mga pandiwang ito ang sunod-sunod na larawang pang-agrikultura: paghahasik, pag-aani, at pag-iipon ng ani.'
- source_word: εἰς ἀποθήκας
  choice: sa mga kamalig
  rationale: Ang ἀποθήκαι ay mga imbakan ng ani. Ang “kamalig” ay tumpak at pamilyar na salitang Tagalog para sa gayong imbakan.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: inyong Ama sa langit
  rationale: Pinananatili nito ang ugnayang ipinahahayag ng “Ama” at ang makalangit na paglalarawan, sa isang likas na pariralang Tagalog.
- source_word: τρέφει
  choice: pinakakain
  rationale: Sa konteksto, ang τρέφω ay tumutukoy sa pagbibigay ng pagkain. Ang “pinakakain” ang pinakadirekta at natural na katumbas.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Hindi ba’t higit kayong mahalaga kaysa sa kanila?
  rationale: Ang retorikal na tanong ay umaasa sa sagot na oo. Ipinahahayag ng διαφέρω kasama ng μᾶλλον ang pagiging higit sa halaga o kahalagahan; malinaw itong naihahatid nang hindi ipinapaliwanag ang teolohikal na batayan nito.
theological_decisions:
- issue: Ang paghahambing sa halaga ng mga tao at mga ibon sa pangangatwiran ni Jesus
  choice: Ipinahahayag na higit na mahalaga ang mga kausap ni Jesus kaysa sa mga ibon, ngunit hindi tinutukoy kung bakit.
  alternative: Ipaliwanag na higit ang halaga ng tao dahil nilikha siya ayon sa larawan ng Diyos, o dahil lamang sa isang natatanging ugnayang tipan.
  rationale: Malinaw sa talata ang paghahambing ng halaga, ngunit hindi nito tahasang ibinibigay ang doktrinal na batayan. Kaya pinananatili ng salin ang pahayag nang walang idinagdag na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” upang katawanin ang plural na anyo ng Griyego. Ang “ngunit” ay natural na naghahayag ng kontras na ipinahihiwatig ng pagkakasunod ng mga sugnay, bagaman καί ang literal na pang-ugnay.
