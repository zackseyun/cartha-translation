  - severity: low
    issue: Ang 'nakadamit' ay mas naglalarawan ng kalagayan kaysa kilos na ipinahihiwatig ng aorist middle na περιεβάλετο.
    rationale: Ang 'nagdamit' ay mas tuwirang naghahatid ng diwang 'clothed himself/dressed' at nananatiling natural sa paghahambing.
