  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na kahit si Solomon, sa buong karangyaan niya, ay hindi nagdamit nang gaya ng isa sa mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Likas na katumbas ng λέγω na may datibong ὑμῖν ang “sinasabi ko sa inyo.” Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang pahayag, kaya ang “Ngunit” ay angkop sa daloy.
- source_word: ὅτι
  choice: ':'
  rationale: Sa modernong Tagalog, malinaw at natural na ipakilala sa tutuldok ang nilalaman ng sinabi; hindi kailangang tumbasan ng hiwalay na “na” ang ὅτι.
- source_word: οὐδὲ
  choice: kahit ... ay hindi
  rationale: 'Naipahahayag ng kayariang ito ang mariing pagtanggi ng οὐδέ: maging si Solomon ay hindi umabot sa paghahambing.'
- source_word: Σολομὼν
  choice: Solomon
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Bibliyang Tagalog.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: sa kabila ng lahat ng kanyang karangyaan
  rationale: Sa konteksto, ang δόξα ay tumutukoy sa maringal na anyo at karangyaan ng isang hari, hindi sa abstraktong dangal o banal na kaluwalhatian. Ang “sa kabila ng” ay natural na nag-uugnay nito sa negatibong paghahambing nang hindi binabago ang diwa.
- source_word: περιεβάλετο
  choice: nakadamit
  rationale: Ang anyong middle/passive ay tumutukoy sa kalagayang nabihisan o nakadamit. Ang “nakadamit” ay malinaw, kasalukuyan, at nagpapanatili sa larawan ng pananamit.
- source_word: ὡς ἓν τούτων
  choice: na gaya ng isa sa mga ito
  rationale: Pinananatili nito ang isahang paghahambing ng ἓν at ang pagtukoy sa mga bulaklak na binanggit sa naunang talata.
theological_decisions:
- issue: Kahulugan ng δόξα tungkol kay Solomon
  choice: karangyaan
  alternative: kaluwalhatian; karingalan
  rationale: Ang konteksto ay ang panlabas na karangyaan ni Solomon bilang hari kumpara sa pagkakabihis ng mga bulaklak. Iniiwasan ng “karangyaan” ang di-sinasadyang pahiwatig na banal na kaluwalhatian ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang tuwirang ayos at karaniwang bokabularyo; pinanatili ang retorikal na diin sa “kahit si Solomon” at ang larawan ng pananamit.
