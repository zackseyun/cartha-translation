  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: tl
  text: 'Kaya, manalangin kayo nang ganito: “Ama namin na nasa mga langit,[a] nawa’y ituring na banal ang pangalan mo.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas nakaugaliang sabihin, “Ama namin na nasa langit.” Pangmaramihan ang nasa Griyego: “nasa mga langit.”'
    reason: lexical_alternative
  - marker: b
