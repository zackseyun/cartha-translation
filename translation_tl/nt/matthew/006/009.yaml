    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: nang ganito
  rationale: Ipinakikilala nito ang paraan o huwaran ng panalangin. Likas sa modernong Tagalog ang “nang ganito” at malinaw ang puwersang panturo.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang kaugnayan at kongklusyon mula sa naunang turo ni Jesus. Mas natural sa karaniwang Tagalog ang “Kaya” kaysa sa mas pormal na “Samakatuwid.”
- source_word: προσεύχεσθε ὑμεῖς
  choice: manalangin kayo
  rationale: Ang pandiwa ay pangmaramihang pautos, at binibigyang-diin ng tahasang ὑμεῖς ang mga kausap. Naipahahayag ito nang natural sa “manalangin kayo.”
- source_word: Πάτερ ἡμῶν
  choice: Ama naming
  rationale: Pinananatili ang tuwirang pagtawag sa Diyos bilang Ama at ang pangmaramihang “aming,” na nagpapakitang panalangin ito ng pamayanan, hindi lamang ng isang tao.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: nasa mga langit
  rationale: Pinananatili ang pangmaramihang anyo ng τοῖς οὐρανοῖς. Nauunawaan ang kaugnay na diwa ng ὁ sa natural na pariralang Tagalog na kasunod ng “Ama naming.”
- source_word: ἁγιασθήτω
  choice: nawa’y ituring na banal
  rationale: Ang aorist passive imperative ay isang kahilingan na kilalanin o pakitunguhan bilang banal ang pangalan ng Diyos. Pinananatili ng “nawa’y” ang panalanging puwersa at ng “ituring na banal” ang diwang pasibo nang hindi ipinahihiwatig na dati itong hindi banal.
- source_word: τὸ ὄνομά σου
  choice: ang pangalan mo
  rationale: Tuwirang salin ito na pinananatili ang “pangalan.” Bagaman maaaring katawanin ng pangalan ang pagkatao, dangal, at nahayag na katangian ng Diyos, hindi iyon pinalalawak sa pangunahing teksto.
theological_decisions:
- issue: Paglalarawan sa Ama bilang nasa τοῖς οὐρανοῖς
  choice: Ama naming nasa mga langit
  alternative: Ama naming nasa langit
  rationale: Pangmaramihan ang Griyegong “mga langit.” Pinananatili ito upang hindi mapantay sa nakaugaliang pang-isahang anyo, habang nananatili ang magkasamang diwa ng pagiging malapit ng Ama at ng kanyang kadakilaan.
- issue: Pagpapahayag sa kahilingang ἁγιασθήτω
  choice: nawa’y ituring na banal ang pangalan mo
  alternative: pakabanalin ang pangalan mo
  rationale: Ang pinili ay malinaw sa kasalukuyang Tagalog at pinananatiling hindi tahasang tinutukoy kung sino ang kikilala o tatrato sa pangalan bilang banal. Iniiwasan din nitong ipahiwatig na kailangang gawing banal ang pangalan ng Diyos na para bang hindi pa ito banal.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at angkop sa pampublikong pagbasa. Ginamit ang “Kaya” at “nang ganito” para sa likas na daloy, habang pinanatili ang “mga langit” dahil tahasang pangmaramihan ang anyong Griyego. Ang “nawa’y ituring na banal” ay madaling maunawaan ngunit nananatiling marangal at may bigat na panalangin.
