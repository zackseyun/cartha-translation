  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: tl
  text: At huwag mo kaming dalhin sa tukso,[a] kundi iligtas mo kami mula sa Masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagsubok.” Ang salitang Griyego ay maaaring tumukoy sa tukso o sa isang mahirap na pagsubok.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kasamaan.” Maaaring tumukoy ang pariralang Griyego sa isang persona (“ang Masama”) o sa masama sa di-personal na diwa (“kasamaan”).
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: huwag mo kaming dalhin
  rationale: Tuwirang pinananatili nito ang pakiusap ng Griyego na huwag silang dalhin o ipasok sa isang kalagayan, nang hindi ito binabago tungo sa mas mapagpaliwanag na ‘huwag mong hayaang mapunta kami.’
- source_word: πειρασμόν
  choice: tukso
  rationale: Ang ‘tukso’ ang likas at kilalang salin sa konteksto ng panalangin, ngunit maaari ring tumukoy ang salitang Griyego sa pagsubok o matinding pagdaranas; kaya inilagay ang saklaw na iyon sa talababa.
- source_word: ῥῦσαι
  choice: iligtas mo
  rationale: Ipinahahayag nito ang aktibong pagsagip na hinihiling sa Diyos. Natural, malinaw, at marangal ito sa modernong Tagalog.
- source_word: τοῦ πονηροῦ
  choice: mula sa Masama
  rationale: Maaaring personal (‘ang Masama’) o di-personal (‘kasamaan’) ang pariralang Griyego. Ginamit sa pangunahing teksto ang personal na pagbasa, habang pinananatili sa talababa ang tunay na alternatibo.
theological_decisions:
- issue: Kahulugan ng τοῦ πονηροῦ
  choice: ang Masama
  alternative: kasamaan
  rationale: Magkapareho ang anyong Griyego para sa posibleng panlalaking pantukoy sa isang masamang persona at sa posibleng walang-kasariang pagtukoy sa masama. Pinili sa pangunahing teksto ang personal na pagbasa, ngunit hindi inalis ang tunay na kalabuan; nakatala sa talababa ang di-personal na pagbasa.
- issue: Ang Diyos at ang pagdadala sa πειρασμός
  choice: huwag mo kaming dalhin sa tukso
  alternative: huwag mong hayaang mapunta kami sa tukso
  rationale: Pinananatili ng tuwirang anyo ang teolohikal na tensiyon ng mismong pakiusap at iniiwasang magdagdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog para sa panalangin. Pinanatili ang tuwirang ikalawang panauhan na ‘mo’ at ang pangmaramihang ‘kami.’ Ginamit ang malaking titik sa ‘Masama’ upang ipahiwatig ang personal na pagbasa nang hindi tahasang idinaragdag ang pangalang Satanas.
