  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: tl
  text: Kaya, huwag kayong maging katulad nila, sapagkat alam ng inyong Ama ang mga kailangan ninyo bago pa kayo humingi sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν
  choice: Kaya, huwag
  rationale: Pinananatili ng “kaya” ang ugnayang lohikal sa naunang babala, habang likas sa Filipino ang “huwag” bilang panimulang pagbabawal.
- source_word: ὁμοιωθῆτε
  choice: maging katulad
  rationale: Likas at malinaw na katumbas ito ng ideyang huwag tumulad o umayon sa kanilang halimbawa; hindi kailangang piliting ilantad sa Filipino ang pasibong anyo ng Griyego.
- source_word: αὐτοῖς
  choice: nila
  rationale: Tumutukoy ito sa mga taong binanggit sa naunang konteksto; sapat at natural ang panghalip.
- source_word: οἶδεν
  choice: alam
  rationale: 'Bagaman perpekto ang anyong Griyego, pangkasalukuyan ang gamit nito: “alam.”'
- source_word: ὁ πατὴρ ὑμῶν
  choice: inyong Ama
  rationale: Tapat ito sa payak na “your Father” ng Griyego at hindi nagdaragdag ng “nasa langit.”
- source_word: ὧν χρείαν ἔχετε
  choice: ang mga kailangan ninyo
  rationale: Malinaw at karaniwang paraan ito sa modernong Filipino upang ipahayag ang nilalaman ng kanilang pangangailangan.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: bago pa ninyo siya hingan
  rationale: Ipinahahayag ng “bago pa” ang naunang panahon, at natural sa Filipino ang “hingan siya” para sa personal na layon ng αἰτέω.
theological_decisions:
- issue: Ang kaalaman ng Diyos bago manalangin ang mga alagad
  choice: Tuwirang sabihing alam na ng Ama ang kanilang mga kailangan bago sila humingi.
  alternative: Ipaliwanag sa salin na ang panalangin ay para sa ugnayan at hindi upang magbigay ng impormasyon sa Diyos, o gumamit ng pananalitang tahasang nagsusulong ng isang sistematikong doktrina ng paunang kaalaman.
  rationale: Ipinahahayag ng talata ang naunang kaalaman ng Ama ngunit hindi nito ipinaliliwanag kung bakit kailangan pa ring manalangin. Pinananatili ng salin ang tensiyong ito nang walang idinagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sapagkat” upang mapanatili ang dignidad ng himig, at iniwasang magdagdag ng “nasa langit,” na wala sa tekstong Griyego ng talatang ito.
