  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: tl
  text: Ngunit kung masama[a] ang mata mo, magiging madilim ang buong katawan mo. Kung gayon, kung ang liwanag na nasa iyo ay kadiliman, kay tindi ng kadiliman!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi maayos” o “maramot.” Ang “masamang mata” ay maaaring tumukoy sa masamang pananaw o hangarin at, ayon sa konteksto, maaari ring maging idyoma para sa pagkamaramot.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: masama
  rationale: 'Malawak ang saklaw ng πονηρός: maaaring masama sa moral, hindi maayos, o—bilang idyoma tungkol sa mata—maramot. Pinananatili ng “masama” ang talinghaga at ang tunay na kalabuan nito.'
- source_word: σκοτεινὸν
  choice: madilim
  rationale: Tuwirang katumbas ito ng pang-uring σκοτεινός at natural sa Filipino bilang panaguri ng buong katawan.
- source_word: φῶς
  choice: liwanag
  rationale: Karaniwang katumbas ng φῶς; pinananatili ang literal na salita upang huwag ipaliwanag nang labis ang talinghaga.
- source_word: σκότος
  choice: kadiliman
  rationale: Pinananatili ang matinding pagsalungat sa “liwanag” at ang pag-uulit sa pangwakas na sugnay.
- source_word: πόσον
  choice: kay tindi
  rationale: Sa maikli at padamdam na sugnay, ipinahahayag ng πόσον ang antas. Ang “kay tindi” ay natural sa modernong Filipino at angkop sa “kadiliman.”
- source_word: ὀφθαλμός
  choice: mata
  rationale: Pinananatili ang literal na larawan ng mata na maaaring tumukoy sa pananaw, hangarin, o asal.
- source_word: ὅλον τὸ σῶμά σου
  choice: ang buong katawan mo
  rationale: Likas at tuwirang salin na pinananatili ang diin ng ὅλον sa kabuuan.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: ang liwanag na nasa iyo
  rationale: Malapit sa anyo ng Griyego at hindi nagpapasok ng mas tiyak na interpretasyong gaya ng “panloob na liwanag.”
theological_decisions:
- issue: Kahulugan ng talinghagang “masamang mata”
  choice: Panatilihin sa pangunahing teksto ang malawak na talinghaga sa pamamagitan ng “masama.”
  alternative: Maaaring unawain bilang matang “hindi maayos,” “masama,” o “maramot.”
  rationale: Ang konteksto ng Mateo 6:19–24 ay maaaring magsanib ng sirang pananaw, kasamaan sa moral, at Semitikong idyoma para sa pagkamaramot. Hindi nilulutas ng salin ang interpretasyong ito nang lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang matitingkad na larawang “mata,” “liwanag,” at “kadiliman,” at ginamit ang padamdam na “kay tindi” upang maipahayag ang puwersa ng eliptikong hulíng sugnay.
