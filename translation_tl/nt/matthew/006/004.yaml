  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: tl
  text: upang ang pagbibigay mo sa mga dukha[a] ay maging lihim; at ang iyong Ama na nakakakita sa lihim ay gagantimpalaan ka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paglilimos.” Ang salitang Griyego ay partikular na tumutukoy sa pagbibigay sa mga dukha.
    reason: lexical_alternative
  - marker: b
    text: O “susuklian ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: upang mailihim
  rationale: Ipinahahayag nito ang layunin ng naunang tagubilin. Ang “upang mailihim” ay natural sa makabagong Tagalog at pinananatili ang diwa na ang pagbibigay ay hindi dapat ilantad sa publiko.
- source_word: ἐλεημοσύνη
  choice: pagbibigay mo sa mga dukha
  rationale: Tiyak na tumutukoy ang salita sa pagkakawanggawa sa mga nangangailangan, hindi sa habag lamang o sa anumang uri ng donasyon.
- source_word: ἐν τῷ κρυπτῷ
  choice: sa lihim
  rationale: Ipinahihiwatig ng parirala ang bagay na lingid sa paningin ng publiko. Pinananatili rin ang kaugnayan nito sa naunang “mailihim.”
- source_word: ὁ πατήρ σου
  choice: iyong Ama
  rationale: “Iyong Ama” lamang ang nasa Griyego; hindi idinagdag ang “Ama sa langit,” na wala sa talatang ito.
- source_word: ὁ βλέπων
  choice: na nakakakita
  rationale: Natural na isinasalin ang substantival participle bilang sugnay na naglalarawan sa Ama at pinananatili ang diwa ng Kaniyang pagkakita.
- source_word: ἀποδώσει σοι
  choice: gagantimpalaan ka
  rationale: Sa konteksto, positibong pagtugon ng Diyos ang tinutukoy. Hindi tinutukoy ng salin kung ano, kailan, o sa anong paraan ibibigay ang gantimpala.
theological_decisions:
- issue: Ang likas na katangian ng banal na pagganti sa ἀποδώσει
  choice: gagantimpalaan ka
  alternative: susuklian ka
  rationale: Malinaw ang positibong tugon ng Diyos, ngunit hindi nililinaw ng talata kung materyal, espirituwal, pansamantala, o walang hanggan ang gantimpala. Iniiwasan ng salin na tukuyin ang hindi tinukoy ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga dukha” upang maging tiyak ang uri ng pagbibigay, at iniwasang idagdag ang “sa langit” sa “iyong Ama.”
