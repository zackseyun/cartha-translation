  naturalness: Ang “ipatawad mo sa amin ang aming mga pagkakautang” ay angkop sa marangal ngunit modernong panalangin. Pinalitan ang “mga nagkakautang sa amin,” na maaaring hindi gaanong karaniwan at maaaring magmungkahi ng magkabilang-panig na pagkakautang, ng mas idiomatikong “mga may utang sa amin.”
  terminology: Ang “mga pagkakautang” ay wastong pangunahing salin sapagkat pinananatili nito ang metapora ng utang sa Griyego. Ang “mga may utang sa amin” ay tumutugma sa “debtors” nang hindi ipinapasok sa pangunahing teksto ang interpretatibong “mga nagkasala sa amin.” Ang tala a ay inayos dahil hindi dapat ilarawan bilang “mas literal” ang isang saling kapareho ng nasa pangunahing teksto.
