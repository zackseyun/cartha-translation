  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: tl
  text: At ipatawad mo sa amin ang aming mga pagkakautang[a], kung paanong pinatawad na rin namin[b] ang mga may utang sa amin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pagkakasala” o “mga kasalanan.” Ang salitang Griyego ay literal na tumutukoy sa mga pagkakautang o bagay na dapat bayaran at malamang na tumutukoy rito sa mga kasalanan o paglabag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagpatawad din kami.” Inilalarawan ng anyong Griyego ang kilos bilang buo; ipinahihiwatig ng “pinatawad na rin namin” na naganap na ang kilos at may kaugnayan pa rin sa panalanging ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ipatawad mo sa amin
  rationale: Ang aorist imperative ng ἀφίημι sa konteksto ng panalangin ay likas na ipinahahayag bilang isang tuwirang pakiusap. Pinananatili ng “ipatawad” ang diwang moral ng pagpapalaya o pagpapawalang-sala nang hindi ito nililimitahan sa literal na transaksiyong pinansyal.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: ang aming mga pagkakautang
  rationale: Literal itong tumutukoy sa mga utang o bagay na dapat bayaran. Pinananatili ng “mga pagkakautang” ang metapora ng Griyego at ang ugnayan nito sa “mga nagkakautang” sa huling bahagi ng talata.
- source_word: ὡς
  choice: kung paanong
  rationale: Malinaw at natural nitong ipinahahayag ang paghahambing sa pagitan ng hinihinging kapatawaran ng Diyos at ng kapatawarang ipinagkaloob ng mga nananalangin. Hindi ito ginawang kondisyunal na “kung” lamang.
- source_word: καὶ ἡμεῖς
  choice: rin namin
  rationale: Ipinahahayag ng “rin” ang dagdag na diin ng καὶ sa panig ng “kami,” habang ang ayos na ito ay natural sa modernong Tagalog.
- source_word: ἀφήκαμεν
  choice: pinatawad na
  rationale: Ipinahahayag ng “na” na ang pagpapatawad ay itinuturing na naganap na, na angkop sa aorist indicative, nang hindi labis na tinutukoy ang eksaktong uri o panahon ng kilos.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ang mga nagkakautang sa amin
  rationale: Pinananatili nito ang salitang-ugat at metapora ng pagkakautang, ngunit mas natural ito sa Tagalog kaysa sa isang teknikal na katawagang gaya ng “mga debitor namin.”
theological_decisions:
- issue: Metaporang moral ng ὀφειλήματα
  choice: Panatilihin sa pangunahing teksto ang “mga pagkakautang” bilang larawan ng mga kasalanan o pagkakasala sa Diyos.
  alternative: “mga kasalanan” o “mga pagkakasala”
  rationale: Utang ang mismong larawang ginamit ng tekstong Griyego, at inuulit ito sa “mga nagkakautang.” Ang tahasang “mga kasalanan” ay maaaring magpaliwanag sa kahulugan ngunit mawawala ang metapora at ang pagkakaugnay ng dalawang parirala.
- issue: Aspektong pamanahon ng ἀφήκαμεν
  choice: Isalin bilang “pinatawad na rin namin.”
  alternative: “pinatatawad din namin” o “nagpatawad din kami”
  rationale: Ipinakikita ng aorist ang kilos bilang buo; ang “pinatawad na” ay nagpapanatili sa pagkakaganap nito at sa kaugnayan nito sa kasalukuyang panalangin. Hindi nito nilulutas ang teolohikal na tensiyon kung paano nauugnay ang kapatawaran sa Diyos at ang pagpapatawad sa kapwa.
translation_notes:
  register: 'Modernong Filipino Tagalog na angkop sa panalangin: payak, marangal, at madaling maunawaan. Ginamit ang “ipatawad mo sa amin” upang maging likas ang pamamahala sa bagay na “mga pagkakautang,” at iniwasan ang sobrang liturhikal o teknikal na mga salita.'
