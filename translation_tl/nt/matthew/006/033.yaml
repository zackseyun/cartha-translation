  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: tl
  text: Ngunit unahin ninyong hanapin ang kanyang kaharian at ang kanyang katuwiran[a], at idaragdag sa inyo ang lahat ng ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “katarungan niya.” Maaaring tumukoy ang salitang Griyego sa katuwiran o katarungan. Ginamit dito ang “katuwiran” dahil saklaw ng konteksto ang tamang kalagayan at pamumuhay sa harap ng Diyos, hindi lamang ang katarungang panghukuman o panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: hanapin ninyo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nagsasaad ng aktibong paghahangad. Likas sa Tagalog ang “hanapin ninyo”; ang patuloy na diwa ay naipahihiwatig ng utos at ng konteksto nang hindi kailangang dagdagan ng “patuloy.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang pagsalungat sa naunang pag-aalala at paghahangad sa pagkain, inumin, at pananamit; malinaw itong naihahatid ng “Ngunit.”
- source_word: πρῶτον
  choice: muna
  rationale: Sa pariralang “hanapin muna ninyo,” natural na ipinahahayag ang unang prayoridad. Hindi nito kailangang ipakahulugang isang gawaing tatapusin muna bago gawin ang iba.
- source_word: βασιλείαν
  choice: kaharian
  rationale: Ang “kaharian” ang malinaw at nakasanayang katumbas na maaari pa ring sumaklaw sa paghahari o pamamahala ng Diyos, hindi lamang sa isang nasasakupan.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Pinananatili ng “katuwiran” ang malawak na diwa ng pagiging matuwid at pamumuhay ayon sa kalooban ng Diyos. Hindi ito nililimitahan sa panlipunan o panghukom na katarungan lamang.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Tuwirang pinananatili ang panghalip ng Griyego. Ang tinutukoy nito ay ang Diyos o Ama batay sa konteksto, ngunit hindi na iyon tahasang idinagdag sa pangunahing teksto.
- source_word: ταῦτα πάντα
  choice: lahat ng ito
  rationale: Tumutukoy ito sa mga pangangailangang materyal na binanggit sa malapit na konteksto. Ang “lahat ng ito” ay natural at sapat na nagpapanatili sa demonstratibong diwa.
- source_word: προστεθήσεται
  choice: idaragdag
  rationale: Pinananatili ng panghinaharap na pandiwang balintiyak ang larawan ng mga bagay na idinaragdag bukod sa pangunahing hinahanap. Iniiwasan nitong palitan ang pandiwa ng mas interpretibong “ipagkakaloob” o “ilalaan.”
- source_word: ὑμῖν
  choice: sa inyo
  rationale: Tuwiran at natural na katumbas ito ng datibo kasunod ng balintiyak na “idaragdag.”
theological_decisions:
- issue: Pagkasalin sa δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Sa kontekstong ito, saklaw ng salita ang pagiging tama sa harap ng Diyos at ang asal na kaayon ng kanyang kalooban. Maaaring mangahulugan din ito ng “katarungan,” kaya pinanatili ang alternatibo sa talababa upang hindi mawala ang leksikal na lawak.
- issue: Tinutukoy ng αὐτοῦ
  choice: kanyang
  alternative: ng Diyos
  rationale: Pinananatili sa pangunahing teksto ang panghalip gaya ng nasa Griyego. Malinaw sa konteksto na Diyos o Ama ang tinutukoy, ngunit ang tahasang “ng Diyos” ay hindi kailangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hanapin muna ninyo” bilang natural na utos na nagbibigay-diin sa prayoridad, habang pinanatili ang tradisyonal ngunit nauunawaang mga terminong “kaharian” at “katuwiran.”
