  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: tl
  text: Ngunit kapag nagbibigay ka sa nangangailangan[a], huwag mong hayaang malaman ng kaliwang kamay mo ang ginagawa ng kanang kamay mo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapag nagbibigay ka ng limos” o “kapag gumagawa ka ng pagkakawanggawa”; ang salitang Griyego ay tumutukoy sa pagbibigay ng tulong sa mahihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Ngunit kapag nagbibigay ka
  rationale: Ang genitive absolute na may δέ ay nagpapakita ng paghahambing o pagsalungat sa naunang tagubilin. Likas sa modernong Tagalog ang “Ngunit kapag…”. Bagaman literal na “gumagawa” ang ποιέω, tumutukoy rito ang parirala sa pagkakawanggawa, kaya malinaw at natural ang “nagbibigay.”
- source_word: ἐλεημοσύνην
  choice: sa nangangailangan[a]
  rationale: Karaniwang tumutukoy ang ἐλεημοσύνη sa paglilimos o pagkakawanggawa para sa mahihirap. Madaling maunawaan sa kasalukuyang Tagalog ang “nagbibigay ka sa nangangailangan,” habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: μὴ γνώτω
  choice: huwag ipaalam
  rationale: Ang ikatlong panauhang aorist imperative na may μή ay isang pagbabawal. Natural na naipapahayag ng “huwag ipaalam sa …” ang diwang “huwag hayaang malaman,” at napapanatili nito ang pagsasatao sa mga kamay.
- source_word: ἡ ἀριστερά σου
  choice: kaliwang kamay mo
  rationale: Tuwirang salin ito na nagpapanatili sa matingkad at madaling tandaan na larawan ng kasabihan.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ang ginagawa ng kanang kamay mo
  rationale: Ang “ginagawa” ay natural na Tagalog para sa kasalukuyang kilos na ipinahihiwatig ng ποιεῖ at pinananatili ang parallel na larawan ng dalawang kamay.
theological_decisions:
- issue: Kahulugan ng kasabihan tungkol sa kaliwa at kanang kamay
  choice: Panatilihin ang metapora bilang matinding panawagan na huwag magpakitang-tao sa pagbibigay.
  alternative: Ipaliwanag ito bilang pangkalahatang pagpapakumbaba o bilang ganap na pagbabawal sa lahat ng hayag na pagkakawanggawa.
  rationale: Gumagamit ang talata ng matingkad na pagsasatao at pagmamalabis. Ang pagpapanatili sa larawan ay umiiwas sa pagtakda ng mas mahigpit na doktrinal na pakahulugan kaysa sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nangangailangan” sa halip na mas makaluma o makitid na “limos,” ngunit pinanatili sa talababa ang literal at tradisyonal na kahulugan.
