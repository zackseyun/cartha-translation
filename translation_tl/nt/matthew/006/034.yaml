id: MAT.6.34
reference: Matthew 6:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: tl
  text: Kaya huwag kayong mag-alala tungkol sa bukas, sapagkat ang bukas ang mag-aalala sa sarili nito. Sapat na sa bawat araw ang sarili nitong problema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sapat na sa bawat araw ang sarili nitong kasamaan.” Ang salitang Griyego ay maaaring mangahulugang “kasamaan,” ngunit dito ay malamang na tumutukoy sa problema o paghihirap ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: huwag kayong mag-alala
  rationale: Ang pandiwa ay tumutukoy sa balisang pag-aalala sa konteksto ng Mateo 6:25–34. Likas at malinaw sa modernong Tagalog ang “mag-alala.”
- source_word: εἰς τὴν αὔριον
  choice: tungkol sa bukas
  rationale: Ipinahahayag nito ang pag-aalalang nakatuon sa darating na araw; idiomatiko sa Tagalog ang “tungkol sa bukas.”
- source_word: ἡ γὰρ αὔριον μεριμνήσει αὑτῆς
  choice: sapagkat ang bukas ang mag-aalala sa sarili nito
  rationale: Pinananatili ang pagsasatao sa “bukas” at ang pag-uulit ng pandiwang “mag-alala,” pati ang mapagpahiwatig na kabalintunaan ng kasabihan.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Sapat na sa bawat araw
  rationale: Malapit ito sa predikatibong ayos ng Griyego habang likas pa rin sa Tagalog. Ipinakikita ng “bawat araw” ang distributibong diwa sa konteksto.
- source_word: ἡ κακία αὐτῆς
  choice: ang sarili nitong problema
  rationale: Sa kontekstong tumatalakay sa pag-aalala at pasanin ng araw-araw, ang κακία ay malamang na tumutukoy sa problema o paghihirap. Pinananatili ng “sarili nitong” ang ugnayan ng panghalip sa “araw.”
theological_decisions:
- issue: Kahulugan ng κακία sa pangwakas na kasabihan
  choice: problema
  alternative: kasamaan; paghihirap
  rationale: Bagaman maaaring mangahulugang moral na “kasamaan” ang κακία, ang agarang konteksto ay tungkol sa alalahanin at hirap ng bawat araw. Ang “problema” ay natural at malawak, habang ang talababa ay nagpapanatili sa tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pagsasatao sa “bukas” at iniwasan ang labis na pormal o makalumang pananalita.
