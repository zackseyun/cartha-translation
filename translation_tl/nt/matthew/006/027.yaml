  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: tl
  text: At sino sa inyo ang makapagdaragdag ng isang siko sa haba ng kanyang buhay[a] sa pamamagitan ng pag-aalala?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanyang tangkad.” Ang salitang Griyego ay maaaring mangahulugang “haba ng buhay/edad” o “tangkad.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: At sino sa inyo
  rationale: Likas na tanong sa modernong Tagalog; ang δέ ay bahagyang pang-ugnay kaya ang “At” ay angkop sa daloy.
- source_word: μεριμνῶν
  choice: sa pamamagitan ng pag-aalala
  rationale: Ipinapahayag ang pag-aalala bilang paraang hindi makapagdudulot ng ipinapalagay na resulta.
- source_word: δύναται προσθεῖναι
  choice: ang makapagdaragdag
  rationale: Pinagsasama nang natural ang diwa ng kakayahan at ng pagdaragdag.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: sa haba ng kanyang buhay
  rationale: Ang ἡλικία ay maaaring tumukoy sa haba ng buhay o sa tangkad. Pinipili rito ang haba ng buhay dahil sa konteksto ng pagkabalisa tungkol sa buhay, habang pinananatili sa talababa ang tunay na alternatibo.
- source_word: πῆχυν ἕνα
  choice: isang siko
  rationale: Ang πῆχυς ay sinaunang sukat ng haba na mula siko hanggang dulo ng daliri; pinananatili ang konkretong larawan sa halip na gawing modernong sukat.
theological_decisions:
- issue: Kahulugan ng ἡλικία sa kasabihang ito
  choice: haba ng kanyang buhay
  alternative: kanyang tangkad
  rationale: Parehong posible sa leksikon. Ang “haba ng buhay” ay umaayon sa konteksto ng pangangalaga ng Diyos sa buhay; gayunman, hindi inaalis ang tradisyonal at literal na posibleng pagbasa na “tangkad.”
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “siko” bilang kinikilalang sinaunang yunit ng haba at ang generic na “kanyang” para sa panlalaking isahan ng Griyego.
