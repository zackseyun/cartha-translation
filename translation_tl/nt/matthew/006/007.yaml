id: MAT.6.7
reference: Matthew 6:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: tl
  text: At kapag nananalangin kayo, huwag kayong magtambak ng mga salitang walang kabuluhan gaya ng mga Hentil[a], sapagkat iniisip nilang pakikinggan sila dahil sa dami ng kanilang sinasabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagano.” Ang salitang Griyego ay literal na tumutukoy sa mga Hentil—ang mga bansang nasa labas ng bayang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: At kapag nananalangin kayo
  rationale: Likas na ipinakikilala ng pariralang ito ang kalagayan kung kailan umiiral ang utos, habang ipinagpapatuloy ng “At” ang daloy ng turo.
- source_word: μὴ βατταλογήσητε
  choice: huwag kayong magtambak ng mga salitang walang kabuluhan
  rationale: Ipinahihiwatig ng bihirang pandiwa ang hungkag, mekanikal, o labis na pananalita. Hindi nito ipinapalagay na ipinagbabawal ang lahat ng pag-uulit sa panalangin.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: gaya ng mga Hentil
  rationale: Sa kontekstong Judio, tumutukoy ito sa mga taong mula sa mga bansang nasa labas ng bayang tipan; mas tuwiran ito kaysa sa interpretatibong “mga pagano.”
- source_word: δοκοῦσιν
  choice: iniisip nila
  rationale: Malinaw at natural nitong ipinapahayag ang kanilang palagay tungkol sa panalangin.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: dahil sa dami ng kanilang sinasabi
  rationale: 'Ipinakikita ng parirala ang maling batayan ng kanilang pag-asang pakikinggan sila: ang labis na dami ng pananalita.'
- source_word: εἰσακουσθήσονται
  choice: pakikinggan sila
  rationale: Pinananatili nito ang diwang bibigyan sila ng pakikinig nang hindi pinalalakas tungo sa mas tiyak na “sasagutin.”
theological_decisions:
- issue: Kung ipinagbabawal ni Jesus ang lahat ng pag-uulit sa panalangin o ang hungkag at labis na pananalita
  choice: Ang ipinagbabawal ay ang pagtatambak ng mga salitang walang kabuluhan.
  alternative: Huwag kayong magpaulit-ulit nang walang saysay; huwag kayong dumaldal.
  rationale: Pinananatili nito ang saklaw ng bihirang pandiwang Griyego at iniiwasang ipakahulugang masama ang bawat taimtim na pag-uulit. Ang pinupuna ay ang pag-asang makukuha ang pakikinig ng Diyos sa pamamagitan ng maraming hungkag na salita.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “manalangin” at “Hentil” bilang pamilyar na bokabularyong biblikal; ang “magtambak ng mga salitang walang kabuluhan” ay malinaw na naghahatid ng hungkag na kasalitaan nang hindi hinahatulan ang lahat ng pag-uulit.
