id: MAT.6.30
reference: Matthew 6:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: tl
  text: Ngunit kung binibihisan ng Diyos nang gayon ang damo sa parang, na naririto ngayon at bukas ay itinatapon sa hurno[a], hindi ba lalo pa niya kayong bibihisan, kayong kulang sa pananampalataya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hurno” dito ay hurnong panluto; maaaring gamitin bilang panggatong ang tuyong damo at iba pang halaman sa parang.
    reason: cultural_note
  - marker: b
    text: Maaari ring “kayong may kakaunting pananampalataya.” Ang Griyegong ὀλιγόπιστοι ay tahasang pagtawag na nagsasaad ng pagsaway dahil sa hindi sapat na pagtitiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: ang damo sa parang
  rationale: Ang χόρτος ay damo o pananim na tumutubo sa lupa, at ang ἀγρός ay bukid o parang. Ang “damo sa parang” ay natural sa modernong Tagalog at hindi nagdaragdag ng espesipikong pagtukoy sa mga bulaklak.
- source_word: σήμερον ὄντα
  choice: na naririto ngayon
  rationale: Ipinahahayag nito sa natural na Tagalog ang literal na diwang “umiiral ngayon” at ang panandaliang pag-iral ng damo.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: at bukas ay itinatapon sa pugon[a]
  rationale: Ang κλίβανος ay pugon o hurnong panluto, hindi kinakailangang tunawang pugon. Pinananatili ng pasibong “itinatapon” ang anyo at larawan ng halamang ginagamit na panggatong.
- source_word: οὕτως ἀμφιέννυσιν
  choice: binibihisan ... nang gayon
  rationale: Ang ἀμφιέννυμι ay “bihisan.” Pinananatili ng “nang gayon” ang paghahambing sa marikit na ayos ng mga halaman sa naunang konteksto nang hindi labis na binibigyang-diin ang palamuti.
- source_word: οὐ πολλῷ μᾶλλον
  choice: hindi ba lalo pa
  rationale: Natural itong anyo ng retorikal na tanong sa Tagalog at malinaw na ipinapakita ang pangangatwiran mula sa mas maliit tungo sa mas mahalaga.
- source_word: ὑμᾶς
  choice: niya kayong bibihisan
  rationale: Ang ὑμᾶς ay maramihang “kayo” at layon ng ipinahihiwatig na pag-uulit ng pandiwang “bihisan.” Inulit ang pandiwa para sa kalinawan sa Tagalog.
- source_word: ὀλιγόπιστοι
  choice: kayong may kakaunting pananampalataya[b]
  rationale: Isa itong tahasang pagtawag sa maramihang kausap at pagsaway sa kakulangan ng kanilang pagtitiwala. Pinananatili ng salin ang literal na diwa ng “kaunting pananampalataya” sa natural na modernong Tagalog.
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Ang δέ ay nagpapahiwatig dito ng banayad na pagsalungat o pagpapatuloy ng argumento; ang “Ngunit kung” ay angkop at malinaw sa konteksto.
theological_decisions:
- issue: Pangangatwiran tungkol sa paglalaan ng Diyos mula sa mas maliit tungo sa mas mahalaga
  choice: Pinanatili bilang retorikal na tanong ang higit na pagkalinga ng Diyos sa mga kausap kaysa sa panandaliang damo.
  alternative: Isalin bilang tuwirang pahayag sa halip na tanong.
  rationale: Sinusuportahan ng Griyegong balangkas at ng panghuling tahasang pagtawag na ὀλιγόπιστοι ang retorikal na tanong. Pinananatili nito ang diin ng pangaral ni Jesus nang hindi nagdaragdag ng ibang doktrinal na pahayag.
- issue: Diwa ng ὀλιγόπιστοι
  choice: “kayong may kakaunting pananampalataya” bilang pagsaway sa hindi sapat na pagtitiwala
  alternative: “kayong mahina ang pananampalataya”
  rationale: Ang piniling anyo ay mas malapit sa leksikal na komposisyon ng salita at hindi nagpapasya kung ang tinutukoy ay pangkalahatang kahinaan, dami ng pananampalataya, o kakulangan ng pagtitiwala sa sitwasyong ito.
translation_notes:
  register: 'Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “parang” ay nagpapanatili sa larawan ng likas na halamang panandalian, samantalang ang “pugon” ay nilinaw sa talababa upang maiwasang ipakahulugang tunawang pugon. Inayos ang mga pananda ng talababa ayon sa mismong salitang tinutukoy: [a] sa pugon at [b] sa kakaunting pananampalataya.'
