  to: Ngunit kung binibihisan ng Diyos nang gayon ang damo sa parang, na naririto ngayon at bukas ay itinatapon sa hurno[a], hindi ba lalo pa niya kayong bibihisan, kayong kulang sa pananampalataya[b]?
