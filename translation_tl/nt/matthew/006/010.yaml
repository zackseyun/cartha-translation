  source_fidelity: 'Tapat ang salin sa dalawang ikatlong-panauhang aorist imperative bilang mga kahilingang panalangin: “Dumating nawa” para sa ἐλθέτω at “mangyari nawa” para sa γενηθήτω. Wasto ang “kaharian” para sa βασιλεία at “kalooban” para sa θέλημα. Ang “kung paano sa langit, gayundin sa lupa” ay maayos na naghahayag ng paghahambing na ὡς … καὶ ἐπὶ γῆς nang hindi nagdaragdag ng kahulugan.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang “nawa” ay angkop sa panalanging rehistro, at ang paralelismong “kung paano … gayundin” ay madaling unawain. Ang “mangyari ang iyong kalooban” ay lehitimo at pinananatili ang mas malawak na diwa ng γίνομαι kaysa isang saling nakatuon lamang sa pagsunod.
  terminology: Ang “iyong kaharian” at “iyong kalooban” ay kapwa matatag, karaniwan, at angkop na mga katawagan sa Tagalog na pagsasalin ng Mateo. Hindi ipinapataw ng mga ito ang isang partikular na doktrinal na pagbasa.
