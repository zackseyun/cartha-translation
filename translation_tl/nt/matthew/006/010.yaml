base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: tl
  text: Dumating nawa ang iyong kaharian; mangyari nawa ang iyong kalooban[a], kung paano sa langit, gayundin sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring unawain: “Dumating nawa ang iyong kaharian; mangyari nawa ang iyong kalooban, kung paano sa langit, gayundin sa lupa,” na ang “kung paano sa langit, gayundin sa lupa” ay tumutukoy sa dalawang kahilingan.'
    reason: alternatibong pagbasa tungkol sa saklaw ng pariralang paghahambing
lexical_decisions:
- source_word: ἐλθέτω
  choice: dumating nawa
  rationale: Ang ikatlong panauhang pautos ay isang kahilingang nakatuon sa Diyos. Likas na ipinahahayag ng “dumating nawa” ang taimtim na panalangin nang hindi ito ginagawang payak na utos.
- source_word: ἡ βασιλεία σου
  choice: ang iyong kaharian
  rationale: Maaaring tumukoy ang βασιλεία sa paghahari o sa kaharian. Pinananatili ng “kaharian” ang malawak at nakaugaliang diwa sa Mateo, kasama ang pahiwatig ng maharlikang paghahari ng Diyos.
- source_word: γενηθήτω
  choice: mangyari nawa
  rationale: Ang aorist passive imperative ng γίνομαι ay nagpapahayag na maganap o matupad ang isang bagay. Sa pariralang kasama ang θέλημα, tapat at likas ang “mangyari nawa,” at hindi nito nililimitahan ang kahulugan sa pagsunod lamang ng tao.
- source_word: τὸ θέλημά σου
  choice: ang iyong kalooban
  rationale: Ang θέλημα ay tumutukoy sa ninanais, niloloob, o layunin ng isang tao. Ang “kalooban” ang karaniwan, marangal, at teolohikal na hindi labis na tiyak na katumbas.
- source_word: ὡς ἐν οὐρανῷ
  choice: kung paano sa langit
  rationale: Ipinakikilala ng ὡς ang paghahambing. Ang “kung paano” ay malinaw na naghahanda sa katapat na “gayundin” habang pinananatili ang elipsis ng Griyego.
- source_word: καὶ ἐπὶ γῆς
  choice: gayundin sa lupa
  rationale: Sa paghahambing na ito, likas na ipinahahayag ng καί ang katumbas na “gayundin,” at ang ἐπί na may genitive ay wastong isinasalin bilang “sa lupa.”
theological_decisions:
- issue: Saklaw ng pariralang ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: Sa pangunahing teksto, pinakamalapit itong inuugnay sa “mangyari nawa ang iyong kalooban.”
  alternative: Maaaring unawaing saklaw nito kapwa ang pagdating ng kaharian at ang pagkaganap ng kalooban ng Diyos.
  rationale: Editoryal lamang ang bantas sa makabagong edisyon ng tekstong Griyego. Pinakanatural sa balarila ang pagkakaugnay ng parirala sa pinakamalapit na kahilingan, ngunit pinahihintulutan ng ayos ng pangungusap ang mas malawak na saklaw; kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang paulit-ulit na “nawa” ay nagpapanatili sa anyo ng taimtim na kahilingan. Pinili ang “mangyari” sa halip na “masunod” upang hindi paliitin ang γενηθήτω sa pagsunod lamang at upang mapanatili ang diwang maganap o matupad ang kalooban ng Diyos.
