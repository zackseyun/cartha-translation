  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: tl
  text: Huwag kayong mag-ipon para sa inyong sarili ng mga kayamanan sa lupa, kung saan sumisira ang gamu-gamo at pagkabulok[a], at kung saan bumubutas[b] at nagnanakaw ang mga magnanakaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalawang.” Mas malawak ang salitang Griyego at maaaring tumukoy sa pag-ubos, pagkasira, o pagkabulok, hindi lamang sa kalawang ng metal.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bumubutas” o “humuhukay upang makapasok.” Malamang na tumutukoy ito sa mga magnanakaw na bumubutas sa pader na yari sa putik upang makapasok.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Huwag kayong mag-ipon
  rationale: Ang μή na may pangkasalukuyang pautos ay naghahayag ng pagbabawal. Natural sa modernong Tagalog ang “mag-ipon” para sa pag-iimbak o patuloy na pagtitipon ng kayamanan.
- source_word: ὑμῖν
  choice: para sa inyong sarili
  rationale: Ipinahihiwatig ng datibo na ang pag-iipon ay para sa sariling pag-aari o kapakinabangan ng mga kausap.
- source_word: θησαυροὺς
  choice: mga kayamanan
  rationale: Pinananatili nito ang malawak na diwa ng mahahalagang ari-arian, hindi lamang salapi.
- source_word: ἐπὶ τῆς γῆς
  choice: dito sa lupa
  rationale: Natural itong lokatibong pahayag sa Tagalog at malinaw na inihahanda ang kaibahan sa langit sa kasunod na talata. Ang “dito” ay idiomatikong nagpapakita ng mundong kinaroroonan nang hindi nagdaragdag ng hiwalay na doktrina.
- source_word: σὴς
  choice: gamu-gamo
  rationale: Karaniwang modernong katumbas ito ng moth at nagpapahiwatig ng insektong sumisira sa nakaimbak na damit o kagamitan.
- source_word: βρῶσις
  choice: kabulukan
  rationale: 'Masaklaw ang salitang Griyego: literal itong kaugnay ng pagkain o pag-ubos at maaaring tumukoy sa pagkasira o pagkabulok, hindi lamang sa kalawang ng metal.'
- source_word: ἀφανίζει
  choice: sumisira
  rationale: Ipinahahayag nito ang pagwasak o pagpapalaho ng halaga ng nakaimbak na kayamanan at angkop sa kapuwa gamu-gamo at kabulukan.
- source_word: κλέπται
  choice: mga magnanakaw
  rationale: Tuwirang modernong katumbas sa Tagalog.
- source_word: διορύσσουσιν
  choice: sapilitang pumapasok
  rationale: Ipinahahayag nito sa natural na Tagalog ang pagpasok ng magnanakaw sa pamamagitan ng pagbutas o pagsira sa harang; inilalagay sa talababa ang literal at pangkulturang detalye.
- source_word: κλέπτουσιν
  choice: nagnanakaw
  rationale: Tuwirang katumbas ng pandiwang tumutukoy sa pagkuha sa pag-aari ng iba.
theological_decisions:
- issue: Saklaw ng ἐπὶ τῆς γῆς at ang kaibahan nito sa langit
  choice: dito sa lupa
  alternative: sa lupa
  rationale: Pinananatili ang konkretong makalupang lokasyon na ihahambing sa langit sa kasunod na talata, nang walang idinadagdag na teolohikal na pagkakaiba na wala sa teksto.
- issue: Pagpapakahulugan sa βρῶσις
  choice: kabulukan
  alternative: kalawang
  rationale: Posible at tradisyonal ang “kalawang,” ngunit mas malawak ang salitang Griyego at tumutukoy sa pag-ubos o pagkasira. Pinananatili sa talababa ang alternatibo upang hindi maitago ang tunay na saklaw at kalabuan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo” ayon sa ὑμῖν at sa anyo ng pandiwa. Iniwasan ang mas lumang “mangalap” o “magtipon” kung magiging pormal o malabo, habang pinanatili ang pag-uulit ng ideya ng pag-iipon at kayamanan.
