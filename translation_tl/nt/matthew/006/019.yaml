    issue: May dagdag na deiktikong "dito" sa "dito sa lupa."
    rationale: Ang ἐπὶ τῆς γῆς ay "sa lupa/sa daigdig"; hindi kinakailangang ipahiwatig ng Griyego ang "dito." Ang "sa lupa" ay natural at pinananatili ang kaibahan sa langit sa kasunod na talata.
  - severity: medium
    issue: Kulang sa semantikong tiyak ang "sapilitang pumapasok."
    rationale: Ang διορύσσουσιν ay "bumubutas" o "humuhukay upang makapasok," hindi lamang sapilitang pagpasok. Ang tuwirang "bumubutas" ay nagpapanatili ng larawan ng pinagmulan; ipinaliliwanag ng talababa ang malamang na pader na putik.
  - severity: low
