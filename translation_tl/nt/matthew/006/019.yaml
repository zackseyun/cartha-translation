  naturalness: Malinaw ang pangkalahatang daloy. Mas natural at mas tiyak sa talata ang "bumubutas at nagnanakaw ang mga magnanakaw." Ang "pagkabulok" ay mas karaniwang modernong salita kaysa "kabulukan" para sa prosesong sumisira sa nakaimbak na kayamanan.
  terminology: Ang "gamu-gamo," "mga kayamanan," at "mga magnanakaw" ay angkop. Ang "pagkabulok" ay pinananatiling malawak na katumbas ng βρῶσις; ang "kalawang" ay nararapat manatiling alternatibo sa talababa.
  issues:
