id: MAT.6.18
reference: Matthew 6:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: tl
  text: upang hindi makita ng mga tao na nag-aayuno ka, kundi ng iyong Ama na nasa lihim[a]; at ang iyong Ama na nakakakita sa lihim ay gagantimpalaan ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nasa lihim” ay maaari ring isaling “nasa lihim na dako.” Gayundin ang kaugnay na pariralang “nakakakita sa lihim” sa kasunod na bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: upang
  rationale: Malinaw na ipinahihiwatig ang layunin ng naunang tagubilin.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: hindi makita ng mga tao na nag-aayuno ka
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng pagiging nakikita o napapansin ng mga tagamasid habang nag-aayuno.
- source_word: τοῖς ἀνθρώποις
  choice: ng mga tao
  rationale: Ang ἄνθρωποι ay tumutukoy rito sa mga taong nakakakita sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: kundi ng iyong Ama
  rationale: Pinananatili ang tuwirang paghahambing sa pagitan ng mga tao at ng Ama bilang siyang nakakakita.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: na nasa lihim
  rationale: Malapit sa Griyego at hindi nililimitahan ang κρυφαίῳ sa isang tiyak na pisikal na lugar.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: na nakakakita sa lihim
  rationale: Pinananatili ang pag-uulit ng pariralang ἐν τῷ κρυφαίῳ at hindi idinaragdag ang hindi tahasang nakasaad na 'mga ginagawa'.
- source_word: ἀποδώσει σοι
  choice: gagantimpalaan ka
  rationale: Sa konteksto ng gawaing debosyonal at tugon ng Diyos, malinaw na ipinahihiwatig ng ἀποδίδωμι ang pagganti o pagbibigay ng gantimpala.
theological_decisions:
- issue: Saklaw ng τοῖς ἀνθρώποις
  choice: mga tao
  alternative: mga lalaki
  rationale: Pangkalahatan ang reperensiya sa mga taong tagamasid; walang batayan sa konteksto upang limitahan ito sa mga lalaking tao.
- issue: Kahulugan ng ἐν τῷ κρυφαίῳ
  choice: sa lihim
  alternative: sa lihim na dako
  rationale: Pinananatili ng 'sa lihim' ang tunay na kalabuan kung ang diin ay sa di-nakikitang kalagayan o sa isang pribadong lugar, at napapanatili rin ang pag-uulit sa dalawang sugnay.
- issue: Ugnayan ng μὴ ... ἀλλὰ
  choice: hindi makita ng mga tao ... kundi ng iyong Ama
  alternative: huwag magmukhang nag-aayuno sa harap ng mga tao, kundi sa harap ng iyong Ama
  rationale: Pinananatili ang paghahambing sa mga nakakakita nang hindi ipinahihiwatig na dapat sadyang magpakitang nag-aayuno sa Ama.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Ama” bilang karaniwang katawagan sa Diyos sa kontekstong ito, at iniwasan ang mas lumang anyong “nag-aayuno ka man” o labis na literal na ayos na magiging alanganin sa kasalukuyang Tagalog.
