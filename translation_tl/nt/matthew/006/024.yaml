  source_fidelity: 'Tapat ang salin sa estruktura at diwa ng Griyego: ang kawalang-kakayahang maglingkod sa dalawang panginoon, ang magkapares na antitesis na ‘kapopootan/iibigin’ at ‘kakapit/hahamakin,’ at ang pangwakas na pagsalungat ng Diyos at mammon ay malinaw na naipahayag.'
