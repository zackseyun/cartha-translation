id: MAT.6.24
reference: Matthew 6:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: tl
  text: Walang sinumang makapaglilingkod sa dalawang panginoon, sapagkat kapopootan niya ang isa at iibigin ang isa pa, o kaya’y kakapit siya sa isa at hahamakin ang isa pa. Hindi kayo makapaglilingkod sa Diyos at sa Mammon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kayamanan” o “salapi.” Ang “Mammon” ay hiram na salita na maaaring kumatawan sa kayamanan bilang isang karibal na panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Walang sinuman
  rationale: Likas at malinaw na panlahat na pagtanggi sa modernong Filipino, habang pinananatili ang dignidad ng pahayag.
- source_word: δύναται / δύνασθε
  choice: makapaglilingkod / Hindi kayo makapaglilingkod
  rationale: Ipinahahayag ng anyong may maka- ang kakayahan o kawalan ng kakayahan at pinananatili ang pag-uulit ng diwa sa dalawang bahagi ng talata.
- source_word: δυσὶ κυρίοις
  choice: dalawang panginoon
  rationale: Sa konteksto ng paglilingkod at pag-aari, tumutukoy ang κύριοι sa mga amo o panginoon, hindi sa banal na titulong Panginoon. Ang 'panginoon' ay angkop sa matayog na talinghaga at malinaw dahil maramihan ang parirala.
- source_word: δουλεύειν
  choice: makapaglilingkod
  rationale: Ang pandiwa ay paglilingkod ng isang alipin o taong nasa ilalim ng kapangyarihan ng amo. Natural sa Filipino ang 'maglingkod sa dalawang panginoon,' at naihahatid ng 'panginoon' ang ugnayang may pagpapasakop.
- source_word: μισήσει
  choice: kapopootan
  rationale: Pinananatili ang matinding tuwirang kahulugan ng μισέω at ang malinaw na pagsalungat nito sa pag-ibig, sa halip na pahinain bilang 'mamahalin nang mas kaunti.'
- source_word: ἀγαπήσει
  choice: iibigin
  rationale: Tuwirang katumbas na angkop sa marangal na rehistro at nagpapanatili sa pagsalungat sa 'kapopootan.'
- source_word: ἑνὸς ἀνθέξεται
  choice: kakapit siya sa isa
  rationale: Pinananatili ang larawan ng mahigpit na pagkapit o pananatili sa isang panig, nang hindi nililimitahan ang salita sa 'katapatan' o 'debosyon' lamang.
- source_word: καταφρονήσει
  choice: hahamakin
  rationale: Naihahatid ang pagtingin nang mababa at pagtrato nang may paghamak, at tumutugma sa bigat ng Griyegong pandiwa.
- source_word: θεῷ
  choice: Diyos
  rationale: Karaniwang tuwirang salin ng θεός sa kontekstong ito.
- source_word: μαμωνᾷ
  choice: Mammon
  rationale: Pinananatili ang hiram na katawagan upang manatili ang retorikal na paglalarawan sa kayamanan bilang karibal na panginoon; ipinaliliwanag ang kahulugan sa talababa.
theological_decisions:
- issue: Kahulugan ng κύριος sa panlipunang konteksto ng paglilingkod
  choice: panginoon
  alternative: amo
  rationale: Ang maramihang κύριοι ay mga taong pinaglilingkuran bilang mga may kapangyarihan, hindi banal na titulo. Ang 'panginoon' ay nagpapanatili sa bigat ng talinghaga, samantalang posible ngunit mas pang-araw-araw ang 'amo.'
- issue: Paglalahad sa μαμωνᾶς bilang karibal ng Diyos
  choice: Mammon
  alternative: kayamanan o salapi
  rationale: Dahil kapwa inilalarawan ang Diyos at Mammon bilang maaaring paglingkuran, pinananatili ng hiram na salita ang pagsasatao at teolohikal na tensiyon. Inilalagay sa talababa ang malinaw na leksikal na kahulugan nang hindi ginagawang pangalan ng isang tiyak na diyos o espiritu.
- issue: Lakas ng pagsalungat sa μισήσει at ἀγαπήσει
  choice: kapopootan ... iibigin
  alternative: mamahalin nang mas kaunti ... iibigin
  rationale: Hindi nilulutas o pinahihina ang matinding antitesis ng tekstong Griyego; nananatiling bukas kung ang pahayag ay absolutong damdamin o matalim na paghahambing ng katapatan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang magkatugmang mga pandiwang panghinaharap—'kapopootan,' 'iibigin,' 'kakapit,' at 'hahamakin'—upang mapanatili ang balanseng retorika ng orihinal. Ang 'Mammon' ay naka-capitalize bilang katawagang isinapersona sa pangungusap, hindi bilang pag-aangking pangalan ito ng isang partikular na diyos.
