id: MAT.6.25
reference: Matthew 6:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: tl
  text: 'Kaya sinasabi ko sa inyo: Huwag kayong mag-alala tungkol sa inyong buhay[a], kung ano ang kakainin ninyo, ni tungkol sa inyong katawan, kung ano ang isusuot ninyo. Hindi ba higit ang buhay kaysa pagkain, at ang katawan kaysa damit?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaluluwa” ang salin sa salitang Griego na ψυχή, ngunit mas angkop dito ang “buhay” dahil pagkain at pananamit ang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kaya
  rationale: Nagpapahayag ito ng konklusyon batay sa naunang turo. Ang “Kaya” ay natural sa modernong Tagalog at malinaw na nagpapanatili ng lohikal na kaugnayan.
- source_word: μεριμνᾶτε
  choice: Huwag kayong mag-alala
  rationale: Tumutukoy ang pandiwa sa balisa at labis na pag-aalala. Karaniwan at malinaw sa Tagalog ang “mag-alala” nang hindi ipinahihiwatig na bawal ang lahat ng maingat na pagpaplano.
- source_word: ψυχῇ
  choice: buhay
  rationale: Sa konteksto ng pagkain at mga pangangailangan ng katawan, ang ψυχή ay tumutukoy sa buhay o sarili ng tao, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: τί φάγητε
  choice: kung ano ang inyong kakainin
  rationale: Natural nitong ipinapahayag sa Tagalog ang hinaharap na bagay na ipinag-aalala.
- source_word: σώματι
  choice: katawan
  rationale: Tuwirang tumutukoy sa pisikal na katawan na inihahambing sa damit.
- source_word: τί ἐνδύσησθε
  choice: kung ano ang inyong isusuot
  rationale: Ang “isusuot” ay natural at maikli para sa pananamit sa hinaharap.
- source_word: οὐχὶ
  choice: Hindi ba
  rationale: Ipinapakita nito ang retorikal na tanong na umaasang sasang-ayon ang nakikinig.
- source_word: πλεῖόν
  choice: higit ... kaysa
  rationale: Pinananatili nito ang paghahambing nang hindi dinaragdagan ang teksto ng tahasang ideya ng halaga o kahalagahan.
- source_word: τροφῆς
  choice: pagkain
  rationale: Malinaw at karaniwang salita para sa bagay na tumutustos sa buhay.
- source_word: ἐνδύματος
  choice: damit
  rationale: Natural na pangkalahatang salita sa modernong Tagalog para sa isinusuot at maayos na katapat ng “pagkain.”
theological_decisions:
- issue: Kahulugan ng ψυχή sa turo ni Jesus
  choice: Isinalin bilang “buhay”
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay pagkain, katawan, at pananamit; kaya ang tinutukoy ay buhay ng tao o ang sarili bilang nabubuhay. Iniiwasan nitong magpasok ng tiyak na paghahating teolohikal sa pagitan ng katawan at di-materyal na kaluluwa na hindi hinihingi ng talata.
translation_notes:
  register: Gumamit ng modernong, magalang, at madaling maunawaang Tagalog. Ang “inyong” ay nagpapanatili ng marangal na rehistro, samantalang ang “Kaya” at “mag-alala” ay natural sa pang-araw-araw na Filipino. Ginamit ang mga gitling upang malinaw na ihiwalay ang mga bagay na ipinag-aalala nang hindi binabago ang ugnayang panggramatika.
