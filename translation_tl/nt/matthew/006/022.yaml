base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: tl
  text: Ang mata ang ilawan ng katawan. Kaya kung malusog[a] ang iyong mata, magiging maliwanag ang buong katawan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iisa,” “malinaw,” o “maayos.” Ang salitang Griyego ay maaari ring magpahiwatig ng pagiging hindi hati o, sa ilang konteksto, pagiging bukas-palad.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ilawan
  rationale: Tumutukoy ito sa isang konkretong ilawan, hindi sa liwanag bilang abstraktong konsepto, kaya napananatili ang talinghaga.
- source_word: σῶμα
  choice: katawan
  rationale: Karaniwan at tuwirang katumbas na angkop sa larawang ginagamit sa talata.
- source_word: ὀφθαλμός
  choice: mata
  rationale: Pinananatili ng literal na salin ang pisikal na larawan at ang mas malawak na talinghaga.
- source_word: ἐὰν οὖν
  choice: Kaya kung
  rationale: Likas sa modernong Tagalog at ipinakikita ang lohikal na kaugnayan ng kondisyong sumusunod sa naunang pahayag.
- source_word: ἁπλοῦς
  choice: maayos
  rationale: Sa agarang talinghaga tungkol sa paningin at liwanag, ipinahihiwatig nito ang matang gumagana nang wasto. Hindi nito lubusang isinasara ang iba pang posibleng diwa ng salitang Griyego, na inilalahad sa talababa.
- source_word: ὅλον
  choice: buong
  rationale: Natural na katumbas na nagpapanatili sa saklaw ng kabuuan.
- source_word: φωτεινὸν
  choice: maliwanag
  rationale: Tuwirang inilalarawan ang katawang naliliwanagan at pinananatili ang talinghaga nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: ἔσται
  choice: magiging
  rationale: Pinananatili ang tahasang panahong hinaharap ng pandiwang Griyego.
theological_decisions:
- issue: Kahulugan ng ἁπλοῦς sa talinghaga tungkol sa mata
  choice: Isinalin bilang “maayos” sa pangunahing teksto.
  alternative: Maaari ring unawain bilang “iisa ang tuon,” “malinaw,” “walang kapintasan,” o “bukas-palad.”
  rationale: Ang agarang larawan ay ang mata bilang ilawan ng katawan at ang kasunod na kaibahan nito sa masamang mata. Kaya ang saling tumutukoy sa wastong paggana ng mata ang pinakamadaling maunawaan sa modernong Tagalog. Gayunman, may saklaw ang salitang Griyego na maaaring tumukoy sa pagiging simple, hindi hati, o bukas-palad, kaya pinananatili ang mga posibilidad na iyon sa talababa sa halip na magtakda ng isang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “ilawan” upang mapanatili ang konkretong talinghaga, at “maayos” upang maging likas at madaling maunawaan habang iniiwan sa talababa ang tunay na lawak ng kahulugan ng ἁπλοῦς.
