  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: tl
  text: Ngunit kapag nananalangin ka, pumasok ka sa iyong panloob na silid[a]. Pagkasara mo ng iyong pinto, manalangin ka sa iyong Ama na nasa lihim; at ang iyong Ama, na nakakakita sa lihim, ay gagantimpalaan ka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pribadong silid” o “silid-imbakan.” Ang salitang Griyego ay tumutukoy sa isang silid sa loob na ginagamit para sa pag-iisa o pag-iimbak.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magbabalik sa iyo” o “babayaran ka.” Ang pandiwang Griyego ay maaaring mangahulugang magbigay bilang kapalit, magbalik, magbayad, o gumantimpala, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ngunit ... ka
  rationale: Ipinananatili ng “Ngunit” ang paghahambing sa mga mapagkunwari sa naunang talata, habang likas na naipahihiwatig ng panghalip na “ka” ang tuwirang pagtukoy sa kausap.
- source_word: ὅταν προσεύχῃ
  choice: kapag nananalangin ka
  rationale: Ang ὅταν na may subjunctive ay tumutukoy sa pangkalahatan o paulit-ulit na pagkakataon; natural itong ipinahahayag ng “kapag” sa modernong Tagalog.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: pumasok ka sa iyong panloob na silid
  rationale: Ang ταμεῖον ay isang silid sa loob na maaaring gamitin sa pag-iimbak o sa pag-iisa. Ang “panloob na silid” ay malapit sa anyong Griyego at hindi nag-uudyok ng makabagong kahulugan ng aparador.
- source_word: κλείσας τὴν θύραν σου
  choice: isara mo ang pinto
  rationale: Ang aorist participle ay nagpapahiwatig ng kilos na nauuna sa pananalangin. Sa Tagalog, malinaw at natural ang magkakasunod na pautos na “isara mo ... at manalangin ka.” Hindi na inulit ang “iyong” sapagkat malinaw sa konteksto at mas likas ito sa Tagalog.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: manalangin ka sa iyong Ama
  rationale: Tuwirang pinananatili ang pautos at ang relasyonal na katawagang “iyong Ama,” nang hindi idinaragdag ang “makalangit” na wala sa talata.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: na nasa lihim
  rationale: Pinananatili nito ang di-tiyak na saklaw ng κρυπτός—maaaring tumukoy sa lihim na dako o sa pagiging nakatago—nang hindi ito ginagawang tiyak na pisikal na lokasyon lamang.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: na nakakakita sa lihim
  rationale: Inuulit ang “sa lihim” upang mapanatili ang retorikal na pag-uulit ng Griyego at ang kaibahan sa hayagang pagpapakitang-tao.
- source_word: ἀποδώσει σοι
  choice: gagantimpalaan ka
  rationale: Sa konteksto ng positibong tugon ng Diyos, likas ang “gagantimpalaan,” habang kinikilala sa talababa na maaari ring mangahulugan ang pandiwa na “gagantihan” o “babayaran.”
theological_decisions:
- issue: Kahulugan ng inuulit na ἐν τῷ κρυπτῷ
  choice: Isinalin sa parehong pagkakataon bilang “sa lihim.”
  alternative: “sa lihim na dako,” “nang palihim,” o “ang ginagawa sa lihim”
  rationale: Pinananatili ng magkaparehong parirala ang sadyang pag-uulit at ang tensiyon sa pagitan ng nakatagong presensiya ng Ama at ng kaniyang pagkakita sa nakatago, nang hindi nilulutas kung ito ay pangunahing lokatibo o adberbiyal.
- issue: Paglalarawan sa Diyos bilang πατήρ
  choice: Ama
  alternative: Amang nasa langit
  rationale: “Ama” lamang ang nasa tekstong Griyego rito. Pinananatili ang tuwiran at relasyonal na katawagan nang walang dagdag na paglilinaw mula sa kalapit na mga talata.
- issue: Diwa ng ἀποδώσει
  choice: gagantimpalaan
  alternative: gagantihan o babayaran
  rationale: Ang konteksto ay positibong tugon ng Ama sa taimtim at lihim na panalangin, ngunit hindi tinutukoy ng salin kung ano o paano ibibigay ang gantimpala.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “panloob na silid” upang maging malinaw nang hindi masyadong kolokyal o makaluma. Pinanatili ang magkatulad na “sa lihim” sa dalawang sugnay upang maingatan ang pag-uulit at ambiguwidad ng orihinal.
