id: MAT.6.2
reference: Matthew 6:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: tl
  text: Kaya, kapag nagbibigay ka sa mga nangangailangan,[a] huwag kang magpatunog ng trumpeta sa harap mo,[b] gaya ng ginagawa ng mga mapagkunwari sa mga sinagoga at sa mga lansangan, upang parangalan sila ng mga tao.[c] Katotohanang sinasabi ko sa inyo, natanggap na nila nang buo ang kanilang gantimpala.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “kapag nagbibigay ka ng limos” o “kapag gumagawa ka ng pagkakawanggawa.” Ang pananalitang Griyego ay tumutukoy sa mapagkawanggawang pagbibigay, lalo na sa mga nangangailangan.
    reason: lexical_alternative
  - marker: b
    text: Maaaring ang larawan ng pagpapatunog ng trumpeta ay pagmamalabis o talinghaga para sa pag-aanunsiyo ng sariling kabutihan; literal na sinasabi ng Griyego, “huwag kang magpatunog ng trumpeta sa harap mo.”
    reason: lexical_alternative
  - marker: c
    text: Maaaring “upang purihin sila” o “upang luwalhatiin sila ng mga tao.”
    reason: lexical_alternative
  - marker: d
    text: 'Ang “natanggap na nila nang buo” ay isang idyomang pangkalakalan: nakuha na nila ang kabuuan ng gantimpalang tatanggapin nila.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Kaya, kapag
  rationale: Pinananatili ng “Kaya” ang ugnayan sa naunang turo, at ipinahahayag ng “kapag” ang pangkalahatan o paulit-ulit na kalagayan ng ὅταν na may subjunctive.
- source_word: ποιῇς ἐλεημοσύνην
  choice: nagbibigay ka sa mga nangangailangan
  rationale: Ang idyoma ay tumutukoy sa pagkakawanggawa, lalo na sa pagbibigay sa mahihirap. Mas likas at malinaw ito sa modernong Filipino kaysa “nagbibigay ka ng limos,” nang hindi nililimitahan ang diwa sa isang ritwal na termino.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: huwag kang magpatunog ng trumpeta sa harap mo
  rationale: Pinananatili ang tahasang larawan ng trumpeta at ang literal na diwa ng ἔμπροσθέν σου, nang hindi ipinapasyang metaporikal lamang o literal na kaugalian ang pahayag.
- source_word: ὑποκριταὶ
  choice: mga mapagkunwari
  rationale: Karaniwan at dignidad na katumbas sa Filipino para sa mga nagpapakitang-tao sa kabanalan.
- source_word: συναγωγαῖς
  choice: mga sinagoga
  rationale: Tumpak na tawag sa mga lugar ng pagtitipong Judio at nauunawaan sa kontekstong biblikal.
- source_word: ῥύμαις
  choice: mga lansangan
  rationale: Likas na salin para sa mga daan o pampublikong lansangan kung saan makikita ng iba ang kanilang ginagawa.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: upang parangalan sila ng mga tao
  rationale: Ipinahahayag ng “upang” ang layunin. Ang “parangalan” ay nagpapanatili sa masidhing diwa ng δοξάζω ngunit mas natural sa Filipino sa konteksto ng papuri o pagkilala ng tao.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Pinananatili ang solemneng diin at tuwirang anyo ng pormula ni Jesus.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: natanggap na nila nang buo ang kanilang gantimpala
  rationale: 'Ipinakikita ang komersiyal na idyoma ng ἀπέχουσιν: lubos nang natanggap at wala nang natitirang kabayaran.'
theological_decisions:
- issue: Saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki; ibang tao
  rationale: Pangkalahatan ang tinutukoy ng ἀνθρώπων dito, hindi mga lalaking tao lamang.
- issue: Lakas ng δοξασθῶσιν
  choice: parangalan sila
  alternative: purihin sila; luwalhatiin sila
  rationale: Ang “parangalan” ay nag-iingat sa lakas ng pandiwa at sa ideya ng pampublikong pagkilala, samantalang ang “luwalhatiin” ay maaaring maging di-likas o magmukhang eksklusibong panrelihiyong termino sa pangungusap na ito.
- issue: Kalikasan ng pagpapatunog ng trumpeta
  choice: pinanatili ang literal na larawan nang hindi ipinapaliwanag sa pangunahing teksto
  alternative: huwag mong ipangalandakan; huwag mong ianunsiyo
  rationale: Maaaring pagmamalabis o talinghaga ang pananalita, ngunit hindi iyon tahasang nilulutas ng Griyegong teksto; kaya pinananatili ang tunay na ambiguity.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “nagbibigay sa mga nangangailangan” para sa agarang pagkaunawa, habang inilagay sa talababa ang mas tradisyonal na “naglilimos.” Pinanatili ang matingkad na larawan ng trumpeta at ang solemneng “Katotohanang sinasabi ko sa inyo.”
