  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: tl
  text: 'At bakit kayo nag-aalala tungkol sa damit? Pagmasdan ninyo kung paano lumalaki ang mga liryo sa parang[a]: hindi sila nagpapakapagod ni nag-iikid ng sinulid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring mas malawak ang tinutukoy na “mga ligaw na bulaklak sa parang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: tungkol sa damit
  rationale: Ang pang-isahang ἐνδύματος ay tumutukoy rito sa damit bilang pangkalahatang pangangailangan, hindi sa isang partikular na kasuotan.
- source_word: τί μεριμνᾶτε
  choice: bakit kayo nag-aalala
  rationale: Sa konteksto, ang μεριμνάω ay pagkabalisa o pag-aalala tungkol sa pangangailangan; natural na ipinapahayag sa Tagalog ang interrogative τί bilang “bakit.”
- source_word: καταμάθετε
  choice: pagmasdan ninyo
  rationale: Ipinahihiwatig ng pandiwa ang maingat na pagmamasid na humahantong sa pagkaunawa; malinaw at natural dito ang “pagmasdan.”
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: ang mga liryo sa parang
  rationale: Ang κρίνα ay pinakatiyak na maisasaling “mga liryo,” samantalang ang ἀγρός ay likas na naipapahayag bilang “parang” sa kontekstong tumutukoy sa mga halamang kusang tumutubo.
- source_word: πῶς αὐξάνουσιν
  choice: kung paano sila lumalaki
  rationale: Tumutukoy ang αὐξάνω sa likas na paglaki ng mga halaman.
- source_word: οὐ κοπιῶσιν
  choice: hindi sila nagpapakapagod
  rationale: Ang κοπιάω ay mabigat o nakapapagod na paggawa; pinananatili ng “nagpapakapagod” ang diin nito nang hindi ipinahihiwatig na walang anumang likas na proseso ang halaman.
- source_word: οὐδὲ νήθουσιν
  choice: ni nag-iikid ng sinulid
  rationale: Ang νήθω ay ang paggawa ng sinulid mula sa hibla. Mas malinaw sa karaniwang mambabasa ang tahasang “nag-iikid ng sinulid” kaysa sa “umiikid” lamang.
theological_decisions:
- issue: Diin ng μεριμνάω sa turo ni Jesus tungkol sa pagkalinga at mga pangangailangan
  choice: nag-aalala
  alternative: nababalisa
  rationale: Sapat na ipinahahayag ng “nag-aalala” ang balisang pagkabahala sa modernong Tagalog nang hindi pinatitindi ito tungo sa klinikal o labis na “pagkabalisa.”
- issue: Pagkilala sa τὰ κρίνα τοῦ ἀγροῦ
  choice: mga liryo sa parang
  alternative: mga bulaklak sa parang
  rationale: Pinananatili sa teksto ang mas tuwirang kahulugang “mga liryo,” habang inilalahad sa talababa ang tunay na posibilidad na mas malawak ang tinutukoy na mga ligaw na bulaklak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo” at mga pandiwang pangmaramihan upang mapanatili ang pangmaramihang ikalawang panauhan ng Griyego. Iniwasan ang mas arkaikong “magsipagmasid” at ang malabong gamit ng “umiikot” para sa pag-iikid ng sinulid.
