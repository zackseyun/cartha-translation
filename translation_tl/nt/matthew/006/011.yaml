  text: Give us today our daily bread[a].
translation:
  language: tl
  text: Ibigay mo sa amin ngayon ang aming pang-araw-araw na tinapay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang aming tinapay para sa araw na ito,” “ang aming tinapay para sa darating na araw,” o “ang tinapay na kailangan namin.” Bihira ang salitang Griyego na ἐπιούσιον, at pinagtatalunan ang tiyak na kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: tinapay
  rationale: Ang ἄρτος ay tuwirang nangangahulugang “tinapay.” Bagaman maaari itong kumatawan sa pagkain o panustos sa mas malawak na diwa, pinananatili rito ang kongkretong larawan.
- source_word: ἡμῶν
  choice: aming
  rationale: Tuwirang paari na tumutukoy sa “tinapay.”
- source_word: ἐπιούσιον
  choice: sa araw-araw
  rationale: Bihira at pinagtatalunang salita ang ἐπιούσιος. Ang “sa araw-araw” ay natural sa makabagong Tagalog at nagpapahayag ng patuloy na pag-asa sa Diyos para sa pang-araw-araw na panustos, nang hindi lubusang itinatakda ang eksaktong diwa ng salita. Inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: δὸς
  choice: Ibigay mo
  rationale: Pautos na anyo ng δίδωμι. Ang “Ibigay mo” ay tuwiran, natural, at angkop sa panalangin; inililitaw rin ng “mo” ang kausap na Diyos na nakasaad sa konteksto.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Tuwirang katumbas ng panghalip na datibo bilang tumatanggap ng hinihinging tinapay.
- source_word: σήμερον
  choice: ngayon
  rationale: Ang σήμερον ay nangangahulugang “ngayon” o “sa araw na ito.” Ang “ngayon” ay malinaw at natural sa kasalukuyang Tagalog.
theological_decisions:
- issue: Kahulugan ng ἐπιούσιον sa Panalangin ng Panginoon
  choice: sa araw-araw
  alternative: para sa araw na ito; para sa darating na araw; tinapay na kailangan namin
  rationale: Maaaring tumukoy ang ἐπιούσιος sa tinapay para sa kasalukuyang araw, sa darating na araw, o sa tinapay na kailangan para mabuhay. Pinili ang pamilyar at natural na “sa araw-araw” sa pangunahing teksto, habang pinananatili sa talababa ang tunay na leksikal at teolohikal na kalabuan.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Pinanatili ang “tinapay” sa halip na palawakin agad bilang “pagkain” o “panustos.” Ginamit ang “sa araw-araw” bilang pamilyar na pananalita, at inilagay sa talababa ang mahahalagang alternatibong kahulugan ng ἐπιούσιον.
