    issue: Ang “doroon” ay itinuring na tagapagpahiwatig ng hinaharap na ἔσται.
    rationale: Ang “doon/doroon” ay pang-abay na panlunan, hindi anyong pandiwang hinaharap. Kaya hindi nito naipapahayag ang tahasang future indicative sa Griyego. Bukod dito, hindi “doroon” ang pinakanatural na makabagong Filipino sa linyang ito.
  - severity: medium
    issue: Hindi tumpak ang paliwanag ng talababa tungkol sa pandiwang Griyego.
    rationale: Sinasabi ng talababa na ang “doroon” ang anyong hinaharap ng pandiwang Griyego, ngunit wala itong aspektong hinaharap sa Filipino. Dapat iugnay ang future ng Griyego sa “mapupunta,” at ang alternatibo ay isang pangkasalukuyan/walang-panahong pahayag.
