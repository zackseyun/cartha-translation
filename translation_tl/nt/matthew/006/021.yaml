  text: For where your treasure is[a], there your heart will be also.
translation:
  language: tl
  text: Sapagkat kung nasaan ang kayamanan mo, doon din mapupunta ang puso mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sapagkat kung nasaan ang kayamanan mo, doon din naroon ang puso mo.” Ginagamit ng ilang salin ang pangkasalukuyan o walang-panahong anyo bilang pangkalahatang katotohanan, ngunit hinaharap ang pandiwang Griyego (“mapupunta”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: kung nasaan
  rationale: Natural na panandang panlunan sa Filipino na nagpapanatili sa ugnayang “kung nasaan … doroon.”
- source_word: γάρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang turo tungkol sa pag-iimpok ng kayamanan.
- source_word: θησαυρός
  choice: kayamanan
  rationale: Karaniwan at malawak ang saklaw nito, kaya naipapahayag ang literal at talinghagang diwa nang hindi nililimitahan sa salapi lamang.
- source_word: σου
  choice: mo
  rationale: Tuwirang ipinapahayag ang ikalawang panauhang isahan at ang pagmamay-ari kaugnay ng “kayamanan” at “puso.”
- source_word: ἐκεῖ
  choice: doroon
  rationale: Tumutugma sa “kung nasaan” at, sa anyong “doroon,” likas na naipahihiwatig ang hinaharap na lakas ng kasunod na pandiwang Griyego.
- source_word: ἔσται
  choice: doroon
  rationale: Ang hinaharap na anyo ng εἰμί ay ipinahahayag sa Filipino sa pamamagitan ng pang-abay na “doroon,” sa halip na ng mas presenteng “naroroon.”
- source_word: καρδία
  choice: puso
  rationale: Pinananatili ang malawak na biblikal na saklaw ng salita—kalooban, pagnanasa, katapatan, at panloob na pagkatao—nang hindi ito pinakikitid sa damdamin lamang.
- source_word: καὶ
  choice: din
  rationale: Likas na panandang pandagdag sa Filipino na nag-uugnay sa kinaroroonan ng puso at ng kayamanan.
theological_decisions:
- issue: Ang panahunan ng ἔσται sa isang kasabihang tila pangkalahatang katotohanan
  choice: Panatilihin ang pahiwatig ng hinaharap sa “doroon”
  alternative: Gamitin ang “naroroon” bilang pangkasalukuyan o walang-tiyak-na-panahong pahayag
  rationale: Hayagang hinaharap ang anyong Griyego. Ang “doroon” ay nagpapanatili rito nang hindi nagdaragdag ng pandiwang gaya ng “mapupunta,” na maaaring magpasok ng mas malinaw na ideya ng pagkilos kaysa sa mismong εἰμί. Nananatili ring bukas ang pahayag sa kapuwa pagtutugma at paghubog ng puso ayon sa kayamanan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “doroon” upang maipahayag ang hinaharap na anyo nang maikli at natural, habang pinananatili ang magkatugmang balangkas na “kung nasaan … doroon.”
