  source_fidelity: Kailangang iwasto ang “doroon.” Isa itong anyong panlunan (at hindi karaniwang makabagong anyo; mas karaniwan ang “doon”), ngunit hindi nito naipapahayag ang hinaharap na ἔσται. Ang “mapupunta” ay likas na paraan sa modernong Filipino upang maipakita ang hinaharap na diin ng pahayag, bagaman ginagawa nitong mas hayag ang ipinahihiwatig na pagtuon/pagkiling ng puso.
  naturalness: Ang “Sapagkat kung nasaan ang kayamanan mo, doon din mapupunta ang puso mo” ay malinaw, likas, at marangal sa modernong Filipino. Napananatili nito ang ugnayang “kung nasaan ... doon din” at ang pagbibigay-dahilan ng γάρ.
  terminology: Ang “kayamanan” para sa θησαυρός at “puso” para sa καρδία ay wasto at matatag na mga katawagang biblikal. Ang “din” ay angkop pagkatapos ng salitang nagtatapos sa katinig. Walang kailangang baguhin sa mga terminong ito.
  issues:
