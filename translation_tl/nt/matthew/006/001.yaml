id: MAT.6.1
reference: Matthew 6:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: tl
  text: Ngunit mag-ingat kayo na huwag ninyong isagawa ang inyong katuwiran[a] sa harap ng mga tao upang makita nila ito; kung hindi, wala kayong gantimpala mula sa inyong Ama na nasa kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga gawa ng katuwiran.” Ang isang tekstuwal na variant ay kababasahan ng “pagkakawanggawa.”
    reason: textual_variant
  - marker: b
    text: Maramihan sa Griyego, “mga langit”; madalas itong isalin na “langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: mag-ingat kayo
  rationale: Ang pangkasalukuyang pautos na maramihan ay nananawagan ng patuloy na pagbabantay; natural at malinaw sa makabagong Tagalog ang “mag-ingat kayo.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang paglipat na may pagsalungat mula sa naunang turo tungo sa isang babala.
- source_word: δικαιοσύνην
  choice: inyong katuwiran
  rationale: Pinananatili nito ang malawak na kahulugan ng matuwid na pamumuhay o gawain sa halip na paliitin agad sa pagkakawanggawa lamang.
- source_word: μὴ ποιεῖν
  choice: huwag ninyong isagawa
  rationale: Ipinapahayag ng infinitive na may μή ang gawaing dapat iwasan; ang “isagawa” ay angkop sa aktuwal na pagsasabuhay ng katuwiran.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: sa harap ng mga tao
  rationale: Tumutukoy ito sa mga taong nakakakita sa pangkalahatan, hindi lamang sa mga lalaki.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: upang makita nila kayo
  rationale: Malinaw na pinananatili ng “upang” ang layunin ng pagpapakitang-tao na ipinahihiwatig ng konstruksiyong Griyego.
- source_word: εἰ δὲ μή γε
  choice: kung hindi
  rationale: Ito ang natural na Tagalog para sa kondisyunal na babala at sa kasunod nitong bunga.
- source_word: μισθὸν
  choice: gantimpala
  rationale: Sa konteksto ng banal na pagganti o pagkilala, mas malinaw at hindi gaanong nakaliligaw ang “gantimpala” kaysa “sahod.”
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: mula sa inyong Ama
  rationale: Sa konteksto ng pagtanggap ng gantimpala, natural na ipinapahayag nito na ang Ama ang pinagmumulan ng gantimpala.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: na nasa kalangitan
  rationale: Ang “kalangitan” ay natural na kolektibong salin na sumasalamin sa maramihang anyo ng Griyegong οὐρανοῖς.
theological_decisions:
- issue: Saklaw ng δικαιοσύνην
  choice: Malawak na “katuwiran,” kabilang ang matuwid na gawain
  alternative: “mga gawa ng katuwiran” o “pagkakawanggawa”
  rationale: δικαιοσύνην ang teksto ng SBLGNT at likas itong mas malawak kaysa pagkakawanggawa lamang. Pinananatili sa pangunahing teksto ang lawak nito, samantalang inilalagay sa talababa ang mas kongkretong kahulugan at ang tekstuwal na variant.
- issue: Kasarian at saklaw ng ἀνθρώπων
  choice: mga tao
  alternative: mga lalaki
  rationale: Mga taong nagmamasid sa pangkalahatan ang tinutukoy, hindi partikular na mga lalaki.
- issue: Maramihang anyo ng τοῖς οὐρανοῖς
  choice: kalangitan
  alternative: langit
  rationale: Sinasalamin ng “kalangitan” ang maramihang anyo at estilo ng Griyego nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Tinutukoy ng θεαθῆναι
  choice: upang makita nila kayo
  alternative: upang makita nila ang inyong ginagawa
  rationale: Pinananatili ng pangunahing salin ang pasibong ideya ng mga taong nagnanais mapansin, habang hindi ipinapalagay na ang panlabas na gawa lamang ang buong paksa ng babala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “kayo/ninyo” upang tumpak na katawanin ang kausap, at iniwasan ang sobrang pormal o makalumang pananalita.
