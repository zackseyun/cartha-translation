id: MAT.6.20
reference: Matthew 6:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: tl
  text: Sa halip, mag-ipon kayo para sa inyong sarili ng mga kayamanan sa langit, kung saan hindi naninira ang gamu-gamo o pagkabulok[a], at kung saan hindi bumubutas ng pader ni nagnanakaw ang mga magnanakaw[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalawang” o “kaagnasan.” Ang salitang Griyego ay maaaring tumukoy nang mas malawak sa pag-ubos, pagkabulok, o anumang sumisirang proseso.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “naghuhukay nang patagos.” Malamang na tumutukoy ito sa pagbutas ng mga magnanakaw sa pader ng isang bahay upang makapasok.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: mag-ipon
  rationale: Ang pautos na nasa kasalukuyang panahunan ay nagpapahiwatig ng patuloy na gawain. Likas sa modernong Tagalog ang “mag-ipon” at pinananatili nito ang larawan ng pagtitipon ng kayamanan.
- source_word: δὲ
  choice: Sa halip
  rationale: Malinaw nitong ipinahahayag ang pagsalungat sa utos sa naunang talata na huwag mag-ipon ng kayamanan sa lupa.
- source_word: ὑμῖν
  choice: para sa inyong sarili
  rationale: Pinananatili ang diwa ng datibo ng kapakinabangan at ang pansariling kaugnayan ng pag-iipon.
- source_word: θησαυροὺς
  choice: mga kayamanan
  rationale: Pinananatili ang maramihang anyo at ang sentrong metapora ng talata.
- source_word: ἐν οὐρανῷ
  choice: sa langit
  rationale: Natural at tuwirang katumbas ng lokatibong parirala sa modernong Tagalog.
- source_word: σὴς
  choice: gamu-gamo
  rationale: Tumutukoy sa insektong sumisira sa nakaimbak na damit; mas tiyak ito kaysa “bukbok,” na karaniwang inuugnay sa kahoy o butil.
- source_word: βρῶσις
  choice: pagkabulok
  rationale: Ipinahahayag ang malawak na diwa ng pag-ubos o pagkasira nang hindi nililimitahan sa kalawang lamang.
- source_word: ἀφανίζει
  choice: naninira
  rationale: Natural itong gamitin kapwa sa gamu-gamo at sa pagkabulok bilang mga sanhi ng pagkawasak ng ari-arian.
- source_word: κλέπται
  choice: mga magnanakaw
  rationale: Karaniwan at eksaktong katumbas ng pangngalang maramihan.
- source_word: διορύσσουσιν
  choice: nagbubutas ng pader
  rationale: Pinananatili ang kongkretong larawan ng pagbutas sa pader ng bahay, na siyang paraan ng pagpasok ng magnanakaw noon.
- source_word: κλέπτουσιν
  choice: nagnanakaw
  rationale: Tuwiran at natural na katumbas ng pandiwa.
theological_decisions:
- issue: Kalikasan ng “mga kayamanan sa langit”
  choice: Pinanatili ang metaporang “mga kayamanan sa langit” nang walang paliwanag na idinagdag sa teksto.
  alternative: mga gantimpala sa langit; espirituwal na kayamanan
  rationale: Hindi tahasang binibigyang-kahulugan ng talata ang metapora. Ang pagpapanatili rito ay umiiwas sa pagpasok ng isang tiyak na doktrina tungkol sa gantimpala o merito.
- issue: Lawak ng kahulugan ng βρῶσις
  choice: pagkabulok
  alternative: kalawang; kaagnasan
  rationale: Pinananatili nito ang mas malawak na ideya ng unti-unting pag-ubos o pagkasira ng makalupang ari-arian, sa halip na limitahan ang tinutukoy sa metal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Sa halip” upang natural na iugnay ang talata sa tahasang pagsalungat sa naunang utos. Pinanatili ang metapora at ang sinaunang larawan ng pagbutas sa pader, habang ipinaliliwanag sa talababa ang literal at kultural na diwa.
