id: MAT.6.16
reference: Matthew 6:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: tl
  text: At tuwing nag-aayuno kayo, huwag kayong magmukhang malungkot gaya ng mga mapagkunwari, sapagkat pinapangit nila ang kanilang mga mukha upang mahalata ng mga tao na nag-aayuno sila. Katotohanang sinasabi ko sa inyo, natanggap na nila nang buo ang kanilang gantimpala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: At tuwing nag-aayuno kayo
  rationale: Ang “tuwing” ay naghahatid ng di-tiyak at paulit-ulit na diwa ng ὅταν, samantalang ang “at” ay likas na nag-uugnay nito sa naunang magkakatulad na mga tagubilin.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: huwag kayong magmukhang malungkot
  rationale: Sa konteksto, ang ipinagbabawal ay ang sadyang pag-aanyong malungkot; mas natural ito sa Tagalog kaysa sa literal na “huwag maging malungkot” at pinananatili ang panlabas na aspektong ipinahihiwatig ng mukha.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: gaya ng mga mapagkunwari
  rationale: Ang “mapagkunwari” ay malinaw at kasalukuyang Tagalog para sa mga taong nagpapakita ng huwad na kabanalan.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: pinapangit nila ang kanilang mga mukha
  rationale: Ipinahihiwatig ng pandiwa ang sadyang pagsira o pagpapabaya sa anyo upang magmukhang naghihirap; ang “pinapangit” ay tuwiran at nauunawaan nang hindi tinutukoy ang eksaktong paraang hindi naman sinabi sa teksto.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: upang mahalata ng mga tao na nag-aayuno sila
  rationale: Pinananatili ng “upang” ang layunin, at ng “mahalata” ang diwang makita o makilalang nag-aayuno. Ang “mga tao” ay ang natural na pangkalahatang kahulugan ng ἀνθρώποις dito.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Katotohanang sinasabi ko sa inyo
  rationale: Pinananatili nito ang mariin at makapangyarihang pormula ni Jesus sa dignified ngunit malinaw na modernong Tagalog.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: natanggap na nila nang buo ang kanilang gantimpala
  rationale: Ang ἀπέχουσιν ay idyomang pangkalakalan na nagsasaad ng ganap na pagtanggap; malinaw na ipinakikita ng “nang buo” na wala nang karagdagang kabayarang hinihintay.
theological_decisions:
- issue: Pangkalahatang saklaw ng τοῖς ἀνθρώποις
  choice: mga tao
  alternative: mga lalaki
  rationale: Bagaman maaaring panlalaki ang anyong Griyego, pangkalahatan ang kahulugan nito sa konteksto. Ang “mga tao” ang tumpak at natural na salin sa Tagalog at hindi naglilimita sa mga lalaki ang tinutukoy.
- issue: Ganap na pagtanggap sa ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: natanggap na nila nang buo ang kanilang gantimpala
  alternative: taglay na nila ang kanilang gantimpala
  rationale: Pinananatili ng napiling salin ang idyomatikong diwa ng lubos nang pagkakabayad at ang tensiyon sa pagitan ng papuri ng tao at gantimpalang mula sa Diyos, nang hindi dinaragdagan ang talata ng tahasang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang labis na arkaikong pananalita at ang denominasyonal na pagpapakahulugan. Walang talababa dahil walang mahalagang tekstuwal o leksikal na alternatibong kailangang ilahad para sa talatang ito.
