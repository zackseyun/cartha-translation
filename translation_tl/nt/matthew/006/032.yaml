  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: tl
  text: Sapagkat masigasig na hinahanap[b] ng mga Hentil[a] ang lahat ng ito; sapagkat alam ng inyong Ama sa langit na kailangan ninyo ang lahat ng ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa” o “mga pagano.” Ang salitang Griyego ay maaaring tumukoy sa mga bansa sa pangkalahatan, ngunit dito ay malamang na tumutukoy sa mga nasa labas ng bayang kabilang sa tipan.
    reason: alternative_reading
  - marker: b
    text: O “hinahangad” o “pinagsisikapang makamtan.” Maaaring magpahiwatig ang pandiwa ng taimtim o patuloy na paghahanap.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa kontekstong ito, tumutukoy ito sa mga bansang hindi kabilang sa bayang Judio at pinananatili ang makasaysayan at panlipunang pagkakaiba nang hindi nagdaragdag ng mapanirang hatol.
- source_word: ἐπιζητοῦσιν
  choice: masigasig na hinahangad
  rationale: Ipinahihiwatig ng pandiwa ang taimtim o patuloy na paghahanap. Likas sa modernong Tagalog ang pariralang ito at hindi nito labis na pinatitindi ang diwa gaya ng “pinagsisikapang makamtan.”
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: inyong Ama sa langit
  rationale: Malinaw at likas na Tagalog ito na pinananatili kapuwa ang kaugnayang ipinahahayag ng “inyong” at ang makalangit na pagtukoy sa Ama.
- source_word: οἶδεν
  choice: alam
  rationale: Bagaman perpekto ang anyong Griyego, pangkasalukuyan ang gamit nito rito; “alam” ang tuwiran at likas na salin.
- source_word: χρῄζετε
  choice: kailangan ninyo
  rationale: Karaniwang modernong Tagalog ito at tumpak na naghahatid ng diwang pagkakaroon ng pangangailangan.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: ang lahat ng ito ... ang lahat ng ito
  rationale: Pinananatili ang pag-uulit sa Griyego sapagkat nagbibigay ito ng diin sa talata.
- source_word: γὰρ ... γὰρ
  choice: Sapagkat ... sapagkat
  rationale: Pinananatili ang dalawang pangatnig upang maipakita ang magkakasunod na paliwanag sa orihinal.
theological_decisions:
- issue: Ang tinutukoy ng τὰ ἔθνη sa turo ni Jesus
  choice: mga Hentil
  alternative: mga bansa; mga pagano; mga di-Judio
  rationale: Pinananatili ng “mga Hentil” ang makasaysayan at tipanang pagkakaiba sa pagitan ng mga alagad at ng mga bansang nakapaligid sa kanila, ngunit hindi ipinahihiwatig na likas na masama ang lahat ng hindi Judio.
- issue: Lakas ng ἐπιζητοῦσιν
  choice: masigasig na hinahangad
  alternative: hinahanap; hinahangad; pinagsisikapang makamtan
  rationale: Ipinakikita ng salin ang taimtim o patuloy na paghahanap na maaaring taglayin ng pandiwa, habang iniiwasan ang mas matinding pahiwatig ng pakikipagpunyagi o sapilitang pagkamit.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pamilyar na katawagang “mga Hentil” at ang likas na pariralang “Ama sa langit.” Pinanatili ang pag-uulit at ang dalawang paliwanag na γάρ, pati ang bahagyang diin ng ἐπιζητοῦσιν.
