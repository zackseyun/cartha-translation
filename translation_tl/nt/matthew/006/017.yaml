id: MAT.6.17
reference: Matthew 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: tl
  text: Ngunit ikaw, kapag nag-aayuno ka, pahiran mo ng langis ang iyong ulo[a] at hugasan mo ang iyong mukha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lagyan mo ng langis ang iyong ulo.” Ang pandiwang Griego ay maaaring tumukoy sa paglalagay ng langis bilang bahagi ng karaniwang pag-aayos sa sarili.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, panatilihin ang karaniwang anyo sa halip na ipahalata sa iba ang iyong pag-aayuno.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ngunit ikaw
  rationale: Pinananatili nito ang mariing pagtukoy sa iisang kausap at ang pagsalungat sa mga mapagkunwari sa naunang konteksto.
- source_word: νηστεύων
  choice: kapag nag-aayuno ka
  rationale: Ang participle ay gumaganap bilang sugnay na panahunan; natural sa modernong Tagalog ang “kapag nag-aayuno ka.”
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: pahiran mo ng langis ang iyong ulo
  rationale: Ipinahahayag nang malinaw ang karaniwang paglalagay ng langis bilang pag-aayos sa sarili, habang pinananatili ang “ulo” bilang tuwirang katumbas ng κεφαλήν.
- source_word: καὶ
  choice: at
  rationale: Payak na pag-uugnay sa dalawang utos.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: hugasan mo ang iyong mukha
  rationale: Tuwirang inilalarawan ng νίπτω ang paghuhugas ng bahagi ng katawan; malinaw at likas ang parirala sa modernong Tagalog.
theological_decisions:
- issue: Likas na katangian ng tagubilin tungkol sa anyo habang nag-aayuno
  choice: Inuutusan ang alagad na panatilihin ang karaniwang pag-aayos at kalinisan habang nag-aayuno upang hindi niya itanghal ito sa ibang tao.
  alternative: Maaaring unawain ang paglalagay ng langis bilang ritwal na pagpapahid, o ang talata bilang pagbabawal sa hayagang pag-aayuno mismo.
  rationale: Ipinakikita ng konteksto ang pagsalungat sa pagpapapangit ng mukha ng mga mapagkunwari. Hindi tahasang ipinagbabawal ang pag-aayuno sa harap ng iba at hindi rin kinakailangang ritwal ang pagpapahid; ang diin ay ang hindi pagpapakitang-tao.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang isahang “ikaw/ka/mo” upang mapanatili ang mariing ikalawang panauhang isahan ng Griego. Ang “pahiran ng langis” ay mas madaling maunawaan kaysa sa maaaring magmukhang ritwal o makalumang “pahiran,” at ang paliwanag sa talababa ay nagpapanatili sa kultural na kahulugan.
