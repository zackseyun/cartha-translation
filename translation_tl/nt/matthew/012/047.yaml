  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: tl
  text: Sinabi ng isang tao sa kanya[a], “Tingnan mo, nakatayo sa labas ang iyong ina at mga kapatid na lalaki, at naghahangad silang makausap ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa ilang manuskrito.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Sinabi sa kanya ng isang tao
  rationale: Ang δέ ay banayad na pang-ugnay at hindi kailangang tumbasan nang tahasan sa natural na salaysay sa Filipino; ang τις ay wastong ipinahahayag bilang “isang tao.”
- source_word: Ἰδοὺ
  choice: Tingnan mo
  rationale: Ginagamit ang ἰδού upang tawagin ang pansin ng kausap; natural at makabagong katumbas ang “Tingnan mo.”
- source_word: ἡ μήτηρ σου
  choice: ang iyong ina
  rationale: Tuwirang pinananatili ang karaniwang kahulugan at ang panghalip na paari.
- source_word: οἱ ἀδελφοί σου
  choice: mga kapatid na lalaki
  rationale: Nililinaw ang panlalaking anyo ng ἀδελφοί sa kontekstong ito nang hindi nagpapasya tungkol sa mas tiyak na uri ng ugnayang pampamilya.
- source_word: ἔξω ἑστήκασιν
  choice: nasa labas
  rationale: Ipinahahayag nito ang kasalukuyang kalagayan na bunga ng pagtayo nila sa labas. Mas natural ito sa Filipino kaysa sa literal na “nakatayo sa labas,” habang hindi nawawala ang mahalagang lokasyon.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: nais kang makausap
  rationale: Sa konteksto, likas na ipinahahayag ng ζητοῦντες ang hangaring makipag-usap; ang “makausap” ay natural na Filipino para sa λαλῆσαι σοι at hindi nagdaragdag ng paksa o layunin ng pag-uusap.
theological_decisions:
- issue: Kalagayang tekstuwal ng Mateo 12:47
  choice: Isinama ang talata sa pangunahing teksto at nilagyan ng talababa tungkol sa pagkakaiba ng mga manuskrito.
  alternative: Alisin ang buong talata dahil wala ito sa ilang manuskrito.
  rationale: Kasama ang talata sa ibinigay na tekstong SBLGNT ngunit minarkahan bilang may usaping tekstuwal. Pinananatili ng pagsasama rito at ng malinaw na talababa ang ibinigay na pagbasa at ang mahalagang ebidensiyang tekstuwal nang hindi palihim na nagpapasya sa pagitan ng mga pagbasa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “ina” at “kapatid na lalaki” para sa malinaw at dignified na pananalita, at “nais kang makausap” upang maiwasan ang matigas na literalismo habang pinananatili ang diwa ng Griyego.
