  naturalness: Natural at angkop sa makabagong Filipino ang “Sinabi ng isang tao sa kanya” at “Tingnan mo.” Ang “nakatayo sa labas at naghahangad na makausap ka” ay malinaw, marangal, at nananatiling natural.
  terminology: Wasto ang “ina” at “mga kapatid na lalaki”; pinananatili ng huli ang panlalaking anyo ng οἱ ἀδελφοί nang hindi nagbibigay ng doktrinal na pagpapakahulugan sa uri ng kanilang ugnayan. Ang talababa tungkol sa mga manuskrito ay tapat sa tekstuwal na kalagayan.
