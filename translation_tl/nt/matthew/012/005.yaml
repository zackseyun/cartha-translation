revisions:
- from: O hindi ba ninyo nabasa sa Kautusan na tuwing Araw ng Pamamahinga[b], nilalapastangan[a] ng mga pari sa templo ang Araw ng Pamamahinga, ngunit wala silang kasalanan? Ang “Kautusan” dito ay tumutukoy sa Kautusan ni Moises na nasa Kasulatan, malamang kasama ang mga tuntunin tungkol sa paglilingkod ng mga pari sa Araw ng Pamamahinga (tingnan ang Bilang 28:9–10).[c]
  to: O hindi ba ninyo nabasa sa Kautusan[c] na tuwing Araw ng Pamamahinga[b], nilalapastangan[a] ng mga pari sa templo ang Araw ng Pamamahinga, at wala silang sala?
