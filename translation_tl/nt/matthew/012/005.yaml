id: MAT.12.5
reference: Matthew 12:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: tl
  text: O hindi ba ninyo nabasa sa Kautusan[c] na tuwing Araw ng Pamamahinga[b], nilalapastangan[a] ng mga pari sa templo ang Araw ng Pamamahinga, at wala silang sala?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilalabag” o “sinusuway.” Ang pandiwang Griyego ay may diwang pagtrato sa isang banal na bagay na parang karaniwan o di-banal.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa mga Sabbath,” na malamang ay tumutukoy sa paulit-ulit na mga Araw ng Pamamahinga, hindi lamang sa isang pagkakataon.
    reason: lexical_alternative
  - marker: c
    text: Ang “Kautusan” dito ay tumutukoy sa Kautusan ni Moises na nasa Kasulatan, malamang kasama ang mga tuntunin tungkol sa paglilingkod ng mga pari sa Araw ng Pamamahinga (tingnan ang Bilang 28:9–10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Nagpapakilala ito ng isa pang argumento mula sa Kasulatan at likas na nagpapatuloy sa retorikal na tanong.
- source_word: οὐκ ἀνέγνωτε
  choice: hindi ba ninyo nabasa
  rationale: Likas na pormula ng retorikal na tanong sa modernong Tagalog at pinananatili ang diwa ng Griyegong aorist nang hindi labis na nililinaw ang aspekto.
- source_word: ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Ang malaking titik ay nagpapakitang tumutukoy ito sa Kautusan ni Moises bilang bahagi ng Kasulatan, hindi sa batas sa pangkalahatan.
- source_word: τοῖς σάββασιν
  choice: tuwing Araw ng Pamamahinga
  rationale: Ipinahihiwatig ng πληθυντικός na anyo ang paulit-ulit na mga araw ng Sabbath; mas natural sa Tagalog ang “tuwing” kaysa literal na “sa mga Sabbath.”
- source_word: οἱ ἱερεῖς
  choice: ang mga pari
  rationale: Tuwirang tumutukoy sa mga paring naglilingkod sa templo.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Natural at malinaw na salin ng ἱερόν sa kontekstong ito, na maaaring tumukoy sa kabuuang pook ng templo.
- source_word: τὸ σάββατον
  choice: ang Araw ng Pamamahinga
  rationale: Pinananatili ang isahan bilang pangalan ng banal na araw o institusyon.
- source_word: βεβηλοῦσιν
  choice: nilalapastangan
  rationale: Pinananatili ang matindi at nakagugulat na diwa ng pagtrato sa banal bilang karaniwan o di-banal; hindi nito pinapahina ang sinadyang tensiyon ng pahayag.
- source_word: ἀναίτιοί εἰσιν
  choice: wala silang kasalanan
  rationale: Natural na Tagalog para sa kawalan ng pananagutang legal o moral at malinaw ang salungat na ugnayan nito sa “nilalapastangan.”
theological_decisions:
- issue: Kung dapat palambutin ang pahayag upang hindi magmukhang tunay na nilalabag ng mga pari ang Sabbath
  choice: Panatilihin ang matinding “nilalapastangan ... ngunit wala silang kasalanan”
  alternative: “nilalabag ... ngunit hindi sila dapat sisihin” o isang paliwanag na agad nagpapawalang-bisa sa tensiyon
  rationale: Sinasadyang magkatabi sa Griyego ang matinding pandiwa at ang kawalan ng sala. Dapat panatilihin ng salin ang retorikal at teolohikal na tensiyong iyon sa halip na lutasin ito sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Araw ng Pamamahinga” para sa Sabbath at “tuwing” upang likas na maipahayag ang Griyegong maramihan. Dapat manatili lamang sa pangunahing pangungusap ang marker [c], hindi ang buong paliwanag.
