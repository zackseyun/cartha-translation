  source_fidelity: 'Kawing na tumpak ang pangunahing salin sa Griyego: napananatili ang retorikal na tanong, ang paulit-ulit na diwa ng τοῖς σάββασιν sa “tuwing,” ang matinding βεβηλοῦσιν, at ang kawalan ng pagkakasala ng mga pari. Gayunman, ang “ngunit” ay mas nagpapaliwanag ng salungatan kaysa sa simpleng καί; mas mabuting “at” upang mapanatili ang retorikal na pagtutumbalik nang hindi dinaragdagan ang ugnayan.'
  naturalness: Natural at marangal ang “O hindi ba ninyo nabasa...” at “Araw ng Pamamahinga.” Ang “wala silang sala” ay mas maikli at higit na likas sa modernong Filipino para sa ἀναίτιοι kaysa “wala silang kasalanan.”
  terminology: Ang “Kautusan,” “mga pari,” “templo,” at “Araw ng Pamamahinga” ay angkop at pare-pareho. Ang “nilalapastangan” ay sapat na matindi upang ihatid ang diwa ng pagtrato sa banal bilang karaniwan, nang hindi nilulutas ang tensiyon sa pahayag.
  issues:
  - severity: high
    issue: Naisama sa pangunahing teksto ang buong nilalaman ng talababa [c].
    rationale: Ang paliwanag tungkol sa Kautusan ni Moises at Bilang 28:9–10 ay dapat manatiling talababa lamang. Ang pagkakalagay nito sa katawan ng talata ay lumalabag sa nakasaad na tala ng salin at inuulit ang footnote.
  - severity: low
    issue: Ang “ngunit” para sa καί ay bahagyang mas interpretatibo.
    rationale: Bagaman umiiral ang malinaw na retorikal na tensiyon, simpleng “at” ang mas malapit sa Griyego at hinahayaan nitong lumitaw ang tensiyon mula sa magkatabing mga pahayag.
