translation:
  language: tl
  text: At mahigpit niya silang pinagbilinan na huwag nila siyang ipakilala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahigpit silang binalaan” o “mahigpit niya silang inutusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay na nagpapatuloy sa salaysay nang walang idinadagdag na interpretasyon.
- source_word: ἐπετίμησεν
  choice: mahigpit na pinagbilinan
  rationale: Sa kontekstong sinusundan ng ipinagbabawal na gawain, ang pandiwa ay nagpapahayag ng mariing babala o utos. Ang “mahigpit na pinagbilinan” ay natural sa modernong Tagalog at hindi nagpapahiwatig, gaya ng maaaring gawin ng “sinaway,” na may nagawa na silang mali.
- source_word: αὐτοῖς
  choice: sila / nilang
  rationale: Tumutukoy ang datibong panghalip na maramihan sa mga taong kinakausap ni Jesus; likas itong isinasama sa pandiwang “pinagbilinan” at sa sugnay na “huwag nilang.”
- source_word: ἵνα μὴ
  choice: na huwag nilang
  rationale: Pagkatapos ng pandiwang naghahayag ng mahigpit na tagubilin, likas na ipinapahayag sa Tagalog ang nilalaman ng pagbabawal sa pamamagitan ng “na huwag nilang.”
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: ipaalam kung sino siya
  rationale: Ang idyoma ay nangangahulugang gawin siyang hayag o ipakilala sa iba. Ang “ipaalam kung sino siya” ay malinaw at natural, habang pinananatili ang personal na tuon ng αὐτόν.
theological_decisions:
- issue: Lakas at uri ng tagubilin ni Jesus tungkol sa pagpapakilala sa kanya
  choice: Mariing tagubilin na huwag siyang ipakilala sa iba
  alternative: Pagsaway sa kanila, o isang tahasang pag-uutos sa kanila
  rationale: Ipinahihiwatig ng ἐπιτιμάω ang matinding diin, ngunit hindi sinasabi ng talata kung may nagawa na silang kasalanan o kung bakit ayaw ni Jesus na siya ay ipakilala. Kaya pinananatili ng salin ang lakas ng tagubilin nang hindi nagdaragdag ng teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pinagbilinan” upang maipahayag ang mariing tagubilin nang hindi masyadong pormal o nagpapahiwatig ng naunang pagkakasala. Ang panandang [a] ay nasa pangunahing teksto.
