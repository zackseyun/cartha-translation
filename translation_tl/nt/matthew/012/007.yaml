id: MAT.12.7
reference: Matthew 12:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: tl
  text: Ngunit kung naunawaan ninyo kung ano ang ibig sabihin nito—“Habag ang nais ko at hindi hain”[a]—hindi sana ninyo hinatulan ang mga walang sala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinipi ni Jesus ang Oseas 6:6.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: naunawaan ninyo
  rationale: Sa kondisyong salungat sa naganap, ipinahihiwatig ng anyo ng pandiwa ang pag-unawang dapat sana ay taglay na nila. Mas natural sa Tagalog ang “kung naunawaan ninyo” kaysa piliting tumbasan ang pluperfect.
- source_word: τί ἐστιν
  choice: kung ano ang ibig sabihin nito
  rationale: Idyomatikong ipinakikilala nito ang kahulugan ng siping Kasulatan, hindi lamang ang pagkakakilanlan nito.
- source_word: ἔλεος
  choice: habag
  rationale: Ang “habag” ay likas at marangal na katumbas ng awa o mahabaging pakikitungo sa kontekstong ito, nang hindi labis na pinalalawak ang saklaw ng salita.
- source_word: θέλω
  choice: nais ko
  rationale: Pinananatili ng “nais ko” ang dignidad at lakas ng pahayag sa siping propetiko.
- source_word: θυσίαν
  choice: hain
  rationale: Ang “hain” ang maikli at karaniwang katawagang biblikal para sa handog na inihahain, at pinananatili nito ang matalim na paghahambing sa habag.
- source_word: κατεδικάσατε
  choice: hindi sana ninyo hinatulan
  rationale: Naipapahayag ng “hindi sana” ang di-naganap na bunga ng kondisyong salungat sa katotohanan, habang taglay ng “hinatulan” ang puwersang hudisyal ng pandiwa.
- source_word: ἀναιτίους
  choice: ang mga walang sala
  rationale: Malinaw at natural sa modernong Tagalog ang “mga walang sala,” at pinananatili nito ang forensic na diwa kasabay ng pandiwang “hinatulan.”
theological_decisions:
- issue: Pagpapanatili sa propetikong paghahambing sa Oseas 6:6 nang hindi ipinapakahulugang lubusang itinatakwil ang paghahain
  choice: “Habag ang nais ko at hindi hain”
  alternative: “Habag ang gusto ko, hindi hain”
  rationale: Tapat ang matalim na anyo ng sipi sa Griyego at hindi nito nilulutas o pinapahina ang teolohikal na tensiyon sa pagitan ng habag at ritwal na paghahain. Ang “nais” ay mas marangal kaysa “gusto” para sa siping propetiko.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “mga walang sala” sa pangunahing teksto dahil ito ang pinakanatural na pagpapahayag ng ἀναιτίους; hindi na kailangan ang hiwalay na talababa para sa “mga inosente,” na hindi nagdaragdag ng mahalagang pagkakaiba sa Tagalog.
