reference: Matthew 12:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: tl
  text: Pagkatapos, dinala sa kanya ang isang lalaking sinasapian ng demonyo, bulag, at hindi makapagsalita.[a] Pinagaling niya ang lalaki, kaya nakapagsalita at nakakita ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bingi.” Maaaring tumukoy ang salitang Griyego sa isang taong hindi nakakarinig o hindi makapagsalita. Dito, mas pinapaboran ng konteksto ang “hindi makapagsalita” dahil pagkatapos siyang pagalingin ay nakapagsalita siya at nakakita.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa Filipino na nag-uugnay sa pangyayaring ito sa naunang salaysay.
- source_word: προσηνέχθη αὐτῷ
  choice: dinala sa kanya
  rationale: Pinananatili ang di-tiyak na tagagawa ng kilos; walang idinagdag na taong nagdala.
- source_word: δαιμονιζόμενος
  choice: sinasapian ng demonyo
  rationale: Malinaw at karaniwang paraan sa Filipino upang ipahayag ang tahasang kaugnayan ng kalagayan ng lalaki sa demonyo, nang hindi ito ginagawang makabagong klinikal na kategorya.
- source_word: τυφλὸς
  choice: bulag
  rationale: Tuwirang katumbas sa Filipino.
- source_word: κωφός
  choice: hindi makapagsalita
  rationale: Maaaring tumukoy ang salita sa hindi nakakarinig o hindi makapagsalita, ngunit ipinakikita ng resultang sugnay na ang kakayahang magsalita ang naibalik. Mas malinaw at makabagong pahayag ito kaysa 'pipi.'
- source_word: ἐθεράπευσεν αὐτόν
  choice: Pinagaling niya ang lalaki
  rationale: Natural na pagpapahayag sa Filipino ng pagpapagaling; nilinaw ng 'ang lalaki' ang tinutukoy ng panghalip.
- source_word: ὥστε
  choice: kaya
  rationale: Maikli at natural na nagpapakilala sa naging resulta ng pagpapagaling.
- source_word: λαλεῖν καὶ βλέπειν
  choice: nakapagsalita at nakakita
  rationale: Ipinahahayag ang naibalik na mga kakayahan bilang aktuwal na resulta, nang hindi idinaragdag ang di-tahasang diwang 'nagsimulang.'
theological_decisions:
- issue: Paglalarawan sa kapangyarihan ng demonyo sa lalaki
  choice: sinasapian ng demonyo
  alternative: pinahihirapan ng demonyo
  rationale: Tahasan ang demonic language ng Griyego. Pinananatili ito nang hindi pinapalitan ng klinikal o malabong paglalarawan.
- issue: Kahulugan ng κωφός sa konteksto
  choice: hindi makapagsalita
  alternative: bingi
  rationale: Bagaman leksikal na posible ang 'bingi,' ang kasunod na sugnay ay nagsasabing nakapagsalita ang lalaki, hindi na nakarinig siya. Inilalagay sa talababa ang tunay na alternatibong kahulugan upang mapanatili ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang mas maigsi ngunit maaaring makaluma o sensitibong katawagang “pipi,” habang pinanatili sa talababa ang tunay na alternatibong kahulugan ng κωφός.
