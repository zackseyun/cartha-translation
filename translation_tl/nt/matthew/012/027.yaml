  source_fidelity: Tumpak na naihahatid ng draft ang instrumental na gamit ng ἐν, ang pagpapaalis ng mga demonyo, ang literal ngunit hindi lubusang tinutukoy na “inyong mga anak,” at ang panghinaharap na “magiging ... hukom.” Pinananatili rin nito ang anyong Beelzebul ng SBLGNT at ang alternatibong Beelzebub sa talababa.
  naturalness: May maliit ngunit malinaw na suliranin sa ayos at anyo ng tanong na “sa pamamagitan naman kanino.” Pagkatapos ng “sa pamamagitan,” ang likas na anyo para sa personal na ahensiya ay “nino” (hal. “sa pamamagitan ni Beelzebul” / “sa pamamagitan nino”). Ang rebisyon ay nagpapanatili ng retorikal na paralelismo habang mas natural at wastong Tagalog.
  terminology: Ang “mga demonyo,” “Beelzebul,” “inyong mga anak,” at “mga hukom ninyo” ay angkop sa modernong Filipino Tagalog at tapat sa mga pangunahing terminong Griyego. Ang talababa ay wasto at nakaangkla sa Beelzebul.
