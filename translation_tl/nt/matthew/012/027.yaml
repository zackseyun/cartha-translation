  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: tl
  text: At kung nagpapalayas ako ng mga demonyo sa pamamagitan ni Beelzebul[a], sa pamamagitan naman nino nagpapalayas ang inyong mga anak? Kaya sila ang magiging mga hukom ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: “Beelzebul”; sa maraming salin ay “Beelzebub.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: sa pamamagitan ni Beelzebul
  rationale: Instrumental ang gamit ng ἐν sa paratang na ito. Likas sa modernong Tagalog ang “sa pamamagitan ni” upang ipahayag ang sinasabing ahensiya o kapangyarihan, at pinananatili ang anyong Beelzebul ng SBLGNT.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: nagpapalayas ako ng mga demonyo
  rationale: Sa konteksto ng eksorsismo, ang ἐκβάλλω ay pagpapalayas o pagpapaalis. Ang “nagpapalayas” ay malinaw, natural, at nagpapanatili sa diwa ng sapilitang pagpapaalis.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ang inyong mga anak
  rationale: Tuwirang pinananatili ang katawagang pampamilya na υἱοί. Bagaman maaaring tumukoy sa mga kabilang sa kanilang pangkat o mga alagad, hindi iyon tahasang nililinaw ng Griyego.
- source_word: ἐν τίνι
  choice: sa pamamagitan naman kanino
  rationale: Instrumental din ang ἐν dito. Ang “kanino” ay angkop dahil personal na ahensiya o kapangyarihan ang ipinantatapat kay Beelzebul; idinagdag ang “naman” upang natural na maipakita ang retorikal na paghahambing.
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Maikli at natural na ipinahahayag ng “Kaya” ang konklusyong ibinubunga ng naunang retorikal na tanong.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: sila ang magiging mga hukom ninyo
  rationale: Pinananatili nito ang pangngalang κριταί at ang panahong panghinaharap, habang natural na naihahayag sa Tagalog ang diin sa “sila.”
theological_decisions:
- issue: Pagkakakilanlan at baybay ng Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Sinusunod ang anyong Griyego sa ibinigay na SBLGNT at tinutumbasan ito sa transliterasyon, sa halip na palitan ng mas pamilyar na tradisyonal na anyo.
- issue: Tinutukoy ng “inyong mga anak”
  choice: Panatilihin ang literal at sadyang maluwag na katawagang “inyong mga anak”
  alternative: “inyong mga alagad” o “mga kabilang sa inyo”
  rationale: Maaaring tumukoy ang parirala sa mga tagasunod o kasapi ng sariling pangkat ng mga kausap, ngunit υἱοί ang mismong ginamit at hindi tahasang nilulutas ng teksto ang eksaktong ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “nagpapalayas” sa halip na mas lumang “nagpapalabas,” at pinanatili ang retorikal na paralelismo at ang bahagyang ambiguity ng “mga anak.”
