id: MAT.12.15
reference: Matthew 12:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: tl
  text: Ngunit nang malaman ito ni Jesus[a], umalis siya roon. Marami ang sumunod sa kanya, at pinagaling niya silang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ngunit si Jesus, nang malaman iyon, ay umalis roon.” Hindi tahasang binabanggit sa Griyego kung ano ang nalaman niya; ipinahihiwatig ito ng naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: nang malaman ito
  rationale: Ang aorist participle ay nagpapahiwatig ng pagkaalam na nauna at kaugnay ng pag-alis ni Jesus. Likas sa Tagalog ang “nang malaman ito,” habang ang “ito” ay tumutukoy sa balak na binanggit sa naunang talata nang hindi ito dinaragdagan ng paliwanag sa mismong teksto.
- source_word: ἀνεχώρησεν
  choice: umalis
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa pag-alis bilang tugon sa pagtutol. Ang “umalis” ay malinaw at natural sa modernong Tagalog at, dahil sa konteksto, naipahihiwatig ang sinasadyang paglayo nang hindi nagdaragdag ng motibong gaya ng takot.
- source_word: ἐκεῖθεν
  choice: roon
  rationale: Maikli at likas na katumbas ng paggalaw mula sa lugar na iyon; kasama ng “umalis,” malinaw na nangangahulugang umalis mula roon.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Marami ang sumunod sa kanya
  rationale: Pinananatili nito ang payak na πολλοί bilang “marami” at hindi ito pinalalawak tungo sa “malalaking pulutong,” na hindi tahasang nasa Griyego.
- source_word: ἐθεράπευσεν
  choice: pinagaling niya
  rationale: Ang “pinagaling” ang karaniwan at malinaw na salin ng θεραπεύω sa mga salaysay ng pagpapagaling sa Ebanghelyo.
- source_word: αὐτοὺς πάντας
  choice: silang lahat
  rationale: 'Natural na Tagalog ito at pinananatili ang saklaw ng πάντας: pinagaling ang lahat ng mga sumunod na tinutukoy.'
theological_decisions:
- issue: Hindi tahasang layon ng γνοὺς
  choice: “nang malaman ito,” na inuugnay sa balak ng mga Pariseo sa naunang talata
  alternative: “nang malaman iyon” o iwang di-tiyak bilang “yamang nalalaman”
  rationale: Walang nakasaad na layon ang γνοὺς sa talatang ito. Ang “ito” ay natural na kumukuha ng tinutukoy mula sa konteksto ngunit hindi tahasang pinapangalanan sa teksto ang hostile counsel, kaya napapanatili ang kaunting pagkaimpisit ng Griyego.
- issue: Diwa ng pag-alis ni Jesus
  choice: umalis
  alternative: lumayo o umurong
  rationale: Ipinahihiwatig ng konteksto ang sinasadyang paglayo dahil sa pagsalungat, ngunit iniiwasan ng “umalis” ang posibleng pahiwatig ng takot o pagkatalo na maaaring idulot ng “umurong.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “kanya” at tuwirang ayos ng pangungusap. Hindi ginawang “mga pulutong” ang πολλοί, at hindi rin ipinaliwanag sa pangunahing teksto ang balak ng mga Pariseo upang mapanatili ang pagkaimpisit ng orihinal.
