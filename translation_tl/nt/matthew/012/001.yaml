id: MAT.12.1
reference: Matthew 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: tl
  text: Nang panahong iyon, dumaan si Jesus sa mga bukirin ng butil noong Sabbath[a]. Nagutom ang kanyang mga alagad at nagsimula silang pumitas ng mga uhay at kumain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “noong mga Sabbath,” isang idyomang maramihan na nangangahulugang “noong Sabbath.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: Nang panahong iyon
  rationale: Likas na panandang temporal sa salaysay at ipinahahayag ang isang panahon o pagkakataon, hindi tiyak na oras sa orasan.
- source_word: ἐπορεύθη
  choice: dumaan
  rationale: Sa konstruksiyong may διὰ, ipinakikita nitong naglakbay si Jesus sa loob o gitna ng mga bukirin; natural sa Tagalog ang “dumaan ... sa.”
- source_word: τοῖς σάββασιν
  choice: noong Sabbath
  rationale: Bagaman nasa anyong maramihan ang Griyego, karaniwang idyoma ito para sa araw ng Sabbath; ang isahan ang malinaw at natural sa Tagalog.
- source_word: διὰ τῶν σπορίμων
  choice: sa mga bukirin ng trigo
  rationale: Ang σπόριμος ay tumutukoy sa mga taniman ng butil. Pinili ang “trigo” bilang madaling maunawaang pananim na may uhay sa kontekstong ito, bagaman hindi espesipikong tinutukoy ng salita ang uri ng butil.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Mahinang pang-ugnay lamang dito ang δέ; hindi kailangan ang salungat na “ngunit.”
- source_word: ἐπείνασαν
  choice: Nagutom
  rationale: Maikli at likas na Tagalog na naipahahayag ang pagsapit ng gutom.
- source_word: ἤρξαντο
  choice: nagsimula silang
  rationale: Tuwirang ipinakikita ang simula ng kasunod na magkakaugnay na mga kilos.
- source_word: τίλλειν στάχυας
  choice: pumitas ng mga uhay
  rationale: Ang τίλλω ay pagpitas o paghila sa pamamagitan ng kamay, at ang στάχυς ay uhay o ulo ng halamang butil.
- source_word: καὶ ἐσθίειν
  choice: at kumain
  rationale: Pinananatili ang koordinasyon ng dalawang infinitive sa ilalim ng “nagsimula,” sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Pagpapahayag sa τοῖς σάββασιν
  choice: noong Sabbath
  alternative: noong mga Sabbath
  rationale: Ang anyong maramihan ay isang idyomang Griyego na sa kontekstong ito ay tumutukoy sa araw ng Sabbath, hindi kinakailangang sa maraming magkakahiwalay na Sabbath. Gramatikal at kontekstuwal ang pasya, hindi doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal at “uhay” bilang eksaktong katawagan sa bahaging pinipitas. Ang “kaya” ay tahasang ipinakikita ang likas na ugnayang bunga sa pagitan ng pagkagutom at ng pagsisimula nilang pumitas at kumain.
