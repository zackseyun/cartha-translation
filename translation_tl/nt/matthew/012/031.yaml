  source_fidelity: Tumpak na naipapahayag ang lohikal na ugnayan ng διὰ τοῦτο, ang tuwirang pahayag na λέγω ὑμῖν, ang saklaw ng πᾶσα ἁμαρτία καὶ βλασφημία, at ang magkatapat na hinaharap na pasibo ng ἀφεθήσεται / οὐκ ἀφεθήσεται. Ang “patatawarin ang mga tao sa bawat kasalanan at paglapastangan” ay natural na Tagalog na pagpapahayag ng pagpapatawad sa mga tao para sa mga ito, nang hindi binabago ang diwa. Ang “sa Espiritu” ay wastong paglalahad ng kontekstuwal na obhetibong genitibo.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino Tagalog. Ang ayos na “Kaya sinasabi ko sa inyo:” ay angkop sa mariin ngunit karaniwang pananalita, at malinaw ang paghahambing na ipinakikilala ng “ngunit.”
  terminology: Ang “kasalanan,” “paglapastangan,” “patatawarin,” at “Espiritu” ay angkop at magkakatugma sa relihiyosong rehistro. Hindi idinagdag sa pangunahing teksto ang “Banal,” alinsunod sa aktuwal na salitang πνεύματος; wastong naipreserba ang kontekstuwal na alternatibo sa talababa.
