  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: tl
  text: 'Kaya sinasabi ko sa inyo: patatawarin ang mga tao sa bawat kasalanan at paglapastangan, ngunit ang paglapastangan sa Espiritu[a] ay hindi patatawarin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Banal na Espiritu.” Malinaw sa kalapit na konteksto na ang tinutukoy ay ang Banal na Espiritu, bagaman “Espiritu” lamang ang nakasulat sa talatang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kaya
  rationale: Likas at malinaw na nagpapahayag ng bunga o kongklusyon mula sa naunang sinabi.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Pinananatili ang tuwirang pakikipag-usap at mariing pormula ng pananalita sa natural na modernong Tagalog.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: bawat kasalanan at paglapastangan
  rationale: Ang “bawat” ay nagpapakita ng distributibong diwa ng πᾶσα; ang “paglapastangan” ay angkop sa mapanghamak na pagsasalita laban sa Diyos.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: patatawarin ang mga tao sa
  rationale: Natural sa Tagalog ang paglalagay sa mga tao bilang tatanggap ng kapatawaran, habang pinananatili ang hinaharap at pasibong diwa ng pandiwa.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ngunit ang paglapastangan sa Espiritu
  rationale: Ang genitibo ay kontekstuwal na obhetibo—ang Espiritu ang pinatutungkulan ng paglapastangan. Hindi idinagdag ang “Banal” sa pangunahing teksto sapagkat πνεύματος lamang ang nasa talatang ito.
- source_word: οὐκ ἀφεθήσεται
  choice: ay hindi patatawarin
  rationale: Tuwirang pinananatili ang mariin at pasibong pahayag ng Griyego.
theological_decisions:
- issue: Kung isasalin ang πνεύματος bilang “Espiritu” o “Banal na Espiritu”
  choice: Espiritu
  alternative: Banal na Espiritu
  rationale: Walang ἁγίου (“banal”) sa mismong talata, kaya “Espiritu” ang nasa pangunahing teksto. Gayunman, malinaw sa kalapit na konteksto na ang tinutukoy ay ang Banal na Espiritu, kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “paglapastangan” bilang malinaw at karaniwang salitang panrelihiyon; iniwasan ang mas teknikal na “blasfemya.”
