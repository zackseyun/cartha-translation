base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: tl
  text: Hindi siya makikipagtalo o sisigaw[a], at walang makaririnig ng tinig niya sa mga lansangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi siya makikipagpunyagi o magtataas ng sigaw, at walang makaririnig ng tinig niya sa mga liwasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρίσει
  choice: makikipagtalo
  rationale: Ipinahahayag ng ἐρίζω ang pakikipagtalo o pakikipag-alitan. Ang “makikipagtalo” ay natural sa makabagong Filipino at inilalarawan ang hindi mapagtunggaling asal ng lingkod nang hindi nagpapahiwatig na hindi siya kailanman mangangatwiran.
- source_word: κραυγάσει
  choice: sisigaw
  rationale: Ang κραυγάζω ay tumutukoy sa malakas na pagsigaw. Direkta at karaniwan ang “sisigaw,” at pinananatili nito ang larawang hindi siya maingay na nagpapakilala sa publiko.
- source_word: ἀκούσει τις
  choice: walang makaririnig
  rationale: Ang negatibong konstruksiyon ay natural na naipahahayag sa Filipino bilang “walang makaririnig,” habang pinananatili ang panghinaharap na diwa.
- source_word: ἐν ταῖς πλατείαις
  choice: sa mga lansangan
  rationale: Ang πλατεῖαι ay malalapad na lansangan o pampublikong daanan. Ang “mga lansangan” ay marangal, malinaw, at angkop sa publikong tagpuan; binabanggit sa talababa ang posibleng “mga liwasan.”
- source_word: φωνὴν αὐτοῦ
  choice: tinig niya
  rationale: Karaniwang kahulugan dito ng φωνή ang tinig. Ang “tinig niya” ay malinaw at likas sa Filipino.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: Hindi…ni…, at walang…
  rationale: Pinananatili ng kayariang ito ang sunod-sunod na tatlong pagtanggi sa paraang natural basahin sa Filipino.
theological_decisions:
- issue: Ugnayan sa sipi tungkol sa lingkod sa Isaias at paglalarawan sa asal ng Mesiyas
  choice: Inilalarawan ang Mesiyas bilang hindi mapagtalo at hindi maingay na nagtatanghal ng sarili sa publiko.
  alternative: Mas pormal na “Hindi siya makikipagpunyagi ni magtataas ng sigaw” upang higit na umalingawngaw ang tradisyonal na pananalita ng sipi.
  rationale: Ang Griyego ay naglalarawan sa mahinahon at hindi palaban na asal ni Jesus bilang katuparan ng Isaias 42:2. Hindi nito itinatanggi ang lahat ng pampublikong pagsasalita niya, kaya iniwasang gawing ganap na pananahimik o kawalang-kibo ang pahayag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lansangan” sa halip na mas kolokyal na “kalye” upang bumagay sa tono ng kasulatan, habang nananatiling madaling maunawaan.
