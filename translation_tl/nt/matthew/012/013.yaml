  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa lalaki, “Iunat mo ang iyong kamay.” Iniunat niya ito, at ang kanyang kamay ay naibalik sa maayos na kalagayan[a], na malusog gaya ng isa pa niyang kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumaling ito”; idinidiin ng pandiwang Griyego ang pagpapanumbalik sa wastong kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “malusog na gaya ng isa pa.” Ang “isa pa” ay tumutukoy sa isa pa niyang kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Ipinahahayag nito ang kasunod na pangyayari sa salaysay at natural itong pakinggan sa makabagong Tagalog.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang anyong Griyego, mas natural sa salaysay na Tagalog ang pangnagdaan nang hindi binabago ang pagkakasunod ng pangyayari.
- source_word: τῷ ἀνθρώπῳ
  choice: sa lalaki
  rationale: Tumutukoy ito sa tiyak na lalaking binanggit sa konteksto.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: Iunat mo ang iyong kamay
  rationale: Pinananatili nito ang tuwirang utos at ang karaniwang kahulugan ng χείρ bilang kamay.
- source_word: ἐξέτεινεν
  choice: Iniunat niya iyon
  rationale: Inuulit nito ang kilos na iniutos; natural na idinagdag ang panghalip na “iyon” upang malinaw na kamay ang tinutukoy.
- source_word: ἀπεκατεστάθη
  choice: naibalik ito sa ayos
  rationale: Ipinahihiwatig ng pandiwa ang pagpapanumbalik sa wastong kalagayan, hindi lamang ang pangkalahatang ideya ng paggaling.
- source_word: ὑγιὴς
  choice: malusog
  rationale: Tuwirang ipinahahayag nito ang pagiging maayos at walang kapansanan ng kamay.
- source_word: ὡς ἡ ἄλλη
  choice: gaya ng isa pa niyang kamay
  rationale: Ang pambabaeng anyo ng “isa pa” ay nagpapahiwatig na ang isa pang kamay ang pinaghahambingan; nilinaw ito sa Tagalog para sa natural na daloy.
theological_decisions:
- issue: Paglalarawan sa himalang nangyari sa kamay
  choice: naibalik ito sa ayos—malusog
  alternative: gumaling ito / naging buo ito
  rationale: Pinananatili ng salin ang diin ng ἀποκαθίστημι sa pagpapanumbalik at ng ὑγιής sa malusog na kalagayan, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sinabi” sa halip na literal na pangkasalukuyang “sinasabi” upang maging natural ang salaysay, at nilinaw ang ipinahihiwatig na “kamay” sa huling paghahambing.
