  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: tl
  text: Pagkatapos, sinasabi nito, “Babalik ako sa bahay ko, na pinanggalingan ko.” At pagdating nito, natatagpuan nito ang bahay na bakante[a], nawalis na, at naisaayos na[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang laman.”
    reason: lexical_alternative
  - marker: b
    text: O “pinalamutian” o “ginayakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas at maikling panandang temporal sa Filipino na nagpapakita ng kasunod na kilos sa salaysay.
- source_word: λέγει
  choice: sinasabi nito
  rationale: Pinananatili ang masiglang pangkasalukuyang panahunan ng salaysay. Ang di-tahasang simuno ay ang maruming espiritu sa naunang konteksto.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Babalik ako sa bahay ko
  rationale: Tuwirang pinananatili ang pagbabalik at ang pag-angkin ng espiritu sa bahay bilang 'akin.'
- source_word: ὅθεν ἐξῆλθον
  choice: kong pinanggalingan
  rationale: Natural na Filipino para sa 'mula sa kung saan ako lumabas,' habang pinananatili ang bahay bilang lugar na iniwan nito.
- source_word: ἐλθὸν
  choice: pagdating nito
  rationale: Ginagawang likas na sugnay na temporal ang aorist participle at pinananatili ang pagkakasunod ng mga kilos.
- source_word: εὑρίσκει
  choice: natatagpuan nito
  rationale: Pinananatili ang pangkasalukuyang panahunan ng masiglang pagsasalaysay at ang payak na diwa ng 'finds.'
- source_word: σχολάζοντα
  choice: walang nakatira roon
  rationale: Ipinapahayag ang kalagayang hindi okupado o bakante ng bahay nang malinaw sa karaniwang Filipino; ang posibleng diwang 'walang laman' ay nasa talababa.
- source_word: σεσαρωμένον
  choice: nawalis na
  rationale: Ipinakikita ng 'na' ang natapos na kilos at nananatiling kalagayan ng bahay, gaya ng perfect passive participle.
- source_word: κεκοσμημένον
  choice: maayos na
  rationale: Ipinahahayag ang maayos na kalagayan ng bahay nang hindi nililimitahan ang salita sa palamuti lamang; inilalagay sa talababa ang alternatibong 'napalamutian' o 'nagagayakan.'
theological_decisions:
- issue: Ang metaporikal na diwa ng 'bahay' sa sinabi tungkol sa nagbabalik na maruming espiritu
  choice: Pinanatili ang 'bahay' bilang kongkretong larawan at hindi ipinaliwanag bilang 'tao' o 'buhay.'
  alternative: Isalin nang tuwiran ang metapora bilang taong iniwan ng espiritu.
  rationale: Bahay ang tahasang larawan sa Griyego. Ang pagpapanatili rito ay umiiwas sa labis na pagpapakahulugan at hinahayaang ang konteksto ang magpaliwanag sa metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong 'sinasabi nito' at 'pagdating nito' upang panatilihin ang masiglang salaysay, at iniwasan ang arkaiko o labis na teknikal na pananalita.
