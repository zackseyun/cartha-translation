  naturalness: Ang “Ngunit sinasabi ko sa inyo” at “rito” ay likas at angkop sa marangal na makabagong Tagalog. Ang “may higit kaysa sa templo” ay maaaring maunawaang “may karagdagan/higit pa” sa halip na isang di-tahasang tinutukoy na nakahihigit. Ang “may higit na dakila kaysa sa templo rito” ay mas idiomatiko at malinaw ang comparative force.
  terminology: Ang “templo” ay wastong katumbas ng ἱερόν sa kontekstong ito. Ang “higit na dakila” ay angkop para sa μεῖζόν at hindi pinapangalanan si Jesus o tinutukoy nang tahasan kung tao o bagay ang referent. Ang mga alternatibong salin sa unang talababa ay kailangang ayusin sapagkat ang “may isang higit” at “may isang taong higit” ay hindi likas na pahayag sa Tagalog.
