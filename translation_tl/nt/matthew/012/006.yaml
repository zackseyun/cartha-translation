  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na may higit na dakila kaysa sa templo rito[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “may isang nakahihigit sa templo rito” o “may isang taong higit na dakila kaysa sa templo rito.” Neuter ang anyo ng salitang Griyego para sa “higit na dakila,” kaya hindi tahasang binabanggit kung ano o sino ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: O, “sa lugar na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Ang δέ ay banayad na nagpapakita ng pagsalungat sa naunang argumento. Likas sa makabagong Tagalog ang pormulang “sinasabi ko sa inyo.”
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng sinasabi ni Jesus at malinaw na nag-uugnay sa dalawang sugnay.
- source_word: τοῦ ἱεροῦ
  choice: kaysa sa templo
  rationale: Karaniwang tumutukoy ang ἱερόν sa buong kompleks ng templo, hindi lamang sa panloob na santuwaryo. “Templo” ang natural at sapat na katumbas sa Tagalog.
- source_word: μεῖζόν
  choice: may higit
  rationale: Neuter singular at ginamit bilang substantibo ang μεῖζόν, ngunit walang kasariang pambalarila ang katumbas na Tagalog. Pinananatili ng “may higit” na hindi tahasang tinutukoy kung ito ay isang bagay o isang persona.
- source_word: ἐστιν
  choice: may
  rationale: Natural na ipinahahayag sa Tagalog ng eksistensiyal na “may” ang diwa ng ἐστιν sa pangungusap na ito.
- source_word: ὧδε
  choice: rito
  rationale: Maikli at natural na katumbas ng lokatibong pang-abay na nangangahulugang “dito” o “sa lugar na ito.” Ginamit ang “rito” ayon sa karaniwang euphonic alternation pagkatapos ng patinig.
theological_decisions:
- issue: Pagkakakilanlan ng di-tahasang tinutukoy ng neuter comparative na μεῖζόν
  choice: Hindi tinukoy sa pangunahing teksto kung isang bagay o isang persona ang “higit.”
  alternative: May isang higit kaysa sa templo rito; may isang taong higit kaysa sa templo rito.
  rationale: Bagaman malinaw na itinuturo ng konteksto kay Jesus at sa kaniyang awtoridad, neuter ang anyong Griyego at hindi tahasang binabanggit ang tinutukoy. Ang “may higit” ay nagpapanatili sa pormal na pagiging di-tiyak at sa teolohikal na tensiyon nang hindi ito nilulutas sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang ayos na “may higit kaysa sa templo rito” ay sadyang hindi tahasang nagsasabing “isang bagay” o “isang tao,” kaya naipapahayag ang tunay na kalabuan ng Griyego nang hindi nagiging mabigat o di-likas ang pangungusap.
