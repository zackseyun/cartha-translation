id: MAT.12.49
reference: Matthew 12:49
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: tl
  text: At iniunat niya ang kanyang kamay patungo sa kanyang mga alagad at sinabi, “Narito[a] ang aking ina at ang aking mga kapatid na lalaki[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tingnan ninyo” o “Masdan ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, panlalaking maramihan ang salitang ginamit; kaya “mga kapatid na lalaki” ang pinanatili rito sa halip na ang mas malawak na “mga kapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: iniunat
  rationale: Likas na inilalarawan sa Filipino ang kilos na kasabay at nauuna sa pagsasalita; malinaw nitong pinananatili ang pisikal na galaw.
- source_word: χεῖρα
  choice: kamay
  rationale: Ito ang karaniwang at kongkretong kahulugan sa konteksto ng pagkumpas ni Jesus.
- source_word: ἐπὶ
  choice: patungo sa
  rationale: Kasama ng akusatibo at ng pandiwang nagsasaad ng pag-unat, ipinahihiwatig nito ang direksiyon ng kilos.
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Karaniwan at eksaktong salin ito para sa mga μαθηταί sa Ebanghelyo at pinananatili ang ugnayan ng guro at alagad.
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Natural ngunit marangal na pantawag-pansin sa Filipino; itinuturo rin nito ang mga taong tinutukoy ni Jesus.
- source_word: μήτηρ
  choice: ina
  rationale: Tuwirang katumbas ng karaniwang katawagang pampamilya.
- source_word: ἀδελφοί
  choice: mga kapatid na lalaki
  rationale: Pinananatili ang panlalaking anyong maramihan ng Griyego sa halip na gawing pangkalahatang 'mga kapatid,' na maaaring tumukoy sa kapwa lalaki at babae sa Filipino.
theological_decisions:
- issue: Wikang pampamilya sa muling pagbibigay-kahulugan ni Jesus sa pagkakamag-anak
  choice: Pinanatili ang literal na mga katawagang “ina” at “mga kapatid na lalaki.”
  alternative: Gumamit ng mas malawak na parapraseng “pamilya” o ng di-tiyak-sa-kasariang “mga kapatid.”
  rationale: Sadyang gumagamit ang talata ng kongkretong mga katawagang pampamilya upang iugnay ang mga alagad sa tunay na pamilya ni Jesus. Ang mas malawak na paraphrase ay magpapahina sa retorikal na diin at magdaragdag ng interpretasyong hindi tahasang nasa Griyego.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Narito” bilang maikli at mariing pantawag-pansin, at “mga kapatid na lalaki” upang malinaw na katawanin ang panlalaking maramihan ng Griyego.
