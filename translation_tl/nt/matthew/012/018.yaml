id: MAT.12.18
reference: Matthew 12:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: tl
  text: “Narito ang lingkod ko na aking pinili, ang minamahal ko na siyang kinalulugdan ng aking kaluluwa.[a] Ilalagay ko sa kanya ang aking Espiritu, at ipahahayag niya ang katarungan[b] sa mga bansa.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na lubos kong kinalulugdan.”
    reason: lexical_alternative
  - marker: b
    text: O “paghatol.”
    reason: lexical_alternative
  - marker: c
    text: O “mga Hentil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Narito
  rationale: Likas at marangal na panawag-pansin sa Filipino na angkop sa isang siping propetiko.
- source_word: παῖς
  choice: lingkod
  rationale: Sa konteksto ng sipi mula sa Isaias, tumutukoy ito sa lingkod, hindi lamang sa anak o bata; pinananatili nito ang ugnayan sa lingkod ng PANGINOON.
- source_word: ᾑρέτισα
  choice: aking pinili
  rationale: Malinaw na ipinahahayag ang natapos na pagpili ng Diyos at natural ang anyo sa Filipino.
- source_word: ἀγαπητός
  choice: minamahal
  rationale: Pinananatili ang diwa ng natatanging pag-ibig at dignidad nang hindi nagdaragdag ng katawagang hindi tahasang nasa salita.
- source_word: εἰς ὃν
  choice: na siyang
  rationale: Iniuugnay nang natural sa Filipino ang minamahal sa kasunod na pahayag ng kaluguran; ang relasyonal na diwa ng Griyego ay nananatili.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: kinalulugdan ng aking kaluluwa
  rationale: Pinananatili ang tahasang ‘aking kaluluwa’ at ang malalim na personal na kaluguran sa orihinal.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Ilalagay ko sa kanya ang aking Espiritu
  rationale: Malapit sa ayos at diwa ng Griyego at malinaw na tumutukoy sa Espiritu ng Diyos sa gawaing ipinagkakatiwala sa lingkod.
- source_word: κρίσιν
  choice: katarungan
  rationale: Sa misyong propetiko ng lingkod, ipinahihiwatig nito ang matuwid na kaayusang ihahayag sa mga bansa; pinananatili sa talababa ang posibleng ‘paghatol.’
- source_word: τοῖς ἔθνεσιν
  choice: sa mga bansa
  rationale: Pinananatili ang malawak na saklaw ng pahayag at ang alingawngaw ng Isaias; maaari rin itong tumukoy sa mga Hentil.
- source_word: ἀπαγγελεῖ
  choice: ipahahayag
  rationale: Angkop sa pormal at hayagang pagpapabatid na taglay ng pandiwa sa kontekstong propetiko.
theological_decisions:
- issue: Pagkakakilanlan ng Mesianikong lingkod sa παῖς
  choice: Isinalin bilang ‘lingkod’ ayon sa konteksto ng sipi mula sa Isaias.
  alternative: anak; bata
  rationale: Pinananatili ng ‘lingkod’ ang intertekstuwal na larawan ng lingkod ng PANGINOON at hindi ipinapasok sa partikular na salitang ito ang ideyang ‘Anak,’ bagaman itinuturo iyon sa ibang mga teksto.
- issue: Kahulugan ng κρίσις sa misyong propetiko
  choice: ‘Katarungan’ sa pangunahing teksto.
  alternative: paghatol
  rationale: Sa konteksto ng ihahayag ng lingkod sa mga bansa, mas malinaw na ipinapakita ng ‘katarungan’ ang matuwid na kaayusan ng Diyos. Gayunman, tunay na kahulugang leksikal din ang ‘paghatol,’ kaya isinama ito sa talababa.
- issue: Pagpapanatili sa ‘aking kaluluwa’
  choice: Pinanatili ang tahasang pariralang ‘ng aking kaluluwa.’
  alternative: lubos kong kinalulugdan; labis akong nalulugod sa kanya
  rationale: Hindi pinapadali ang Hebraikong paraan ng pagpapahayag na nasa Griyegong sipi, upang mapanatili ang personal at masidhing diin nito.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang mataas na himig na angkop sa siping propetiko. Ginamit ang ‘Narito’ sa halip na mas kolokyal na ‘Tingnan,’ at pinanatili ang ‘aking kaluluwa’ upang hindi mawala ang diin ng orihinal. Inayos ang mga pananda ng talababa upang tumapat ang bawat isa sa mismong pariralang ipinapaliwanag.
