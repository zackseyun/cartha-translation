  source_fidelity: 'Tapat ang salin sa lahat ng pangunahing yunit ng Griyego: ang παῖς ay wastong “lingkod” sa kontekstong Isaias; ang ἀγαπητός at ang tahasang “aking kaluluwa” ay napapanatili; ang hinaharap na θήσω at ἀπαγγελεῖ ay malinaw; at ang κρίσις ay isinaling “katarungan” nang may wastong alternatibong “paghatol.” Ang “sa mga bansa” ay pinananatili ang malawak na saklaw ng τοῖς ἔθνεσιν.'
  naturalness: Natural at marangal ang modernong Filipino, na angkop sa isang siping propetiko. Ang “Narito,” “aking pinili,” at “ipahahayag” ay malinaw at hindi labis na archaic. Ang “kinalulugdan ng aking kaluluwa” ay bahagyang mataas ang himig ngunit sinadyang tumutugma sa tahasang pananalita ng pinagmulan at nauunawaan pa rin sa Filipino.
  terminology: 'Wasto at magkakatugma ang mga susing termino: “lingkod,” “minamahal,” “Espiritu,” “katarungan,” at “mga bansa.” Hindi ipinapasok ng “lingkod” ang di-tahasang kahulugang “anak,” at ang kapitalisasyon ng “Espiritu” ay angkop sa pagtukoy sa Espiritu ng Diyos.'
