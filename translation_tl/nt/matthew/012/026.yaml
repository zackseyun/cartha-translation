  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: tl
  text: At kung si Satanas ay nagpapalayas kay Satanas, nahati siya laban sa kanyang sarili.[a] Kaya paano mananatili ang kanyang kaharian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahahati siya laban sa kanyang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na καὶ at ang kondisyong εἰ, at likas sa Tagalog ang “At kung” sa pagpapatuloy ng argumento.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satanas
  rationale: Karaniwang anyong Tagalog ng personal na pangalan o titulong Σατανᾶς.
- source_word: ἐκβάλλει
  choice: nagpapalayas
  rationale: Sa konteksto ng pagpapalayas ng mga demonyo, malinaw at likas ang “nagpapalayas”; ipinahihiwatig nito ang pagpapaalis nang hindi gumagamit ng teknikal na salita.
- source_word: ἐφ’ ἑαυτὸν
  choice: laban sa kanyang sarili
  rationale: Tumpak na ipinapahayag ang pagsalungat o panloob na tunggalian na taglay ng pariralang Griyego.
- source_word: ἐμερίσθη
  choice: nahahati siya
  rationale: Ang aorist passive ay inilalahad bilang kalagayang bunga ng ipinapalagay na kilos. Likas sa modernong Tagalog ang “nahahati” sa ganitong pangkalahatang lohikal na pahayag.
- source_word: πῶς οὖν
  choice: Kaya paano
  rationale: Ang “kaya” ay malinaw na naghahatid ng inferensiyang ipinahihiwatig ng οὖν, habang pinananatili ng “paano” ang tanong.
- source_word: σταθήσεται
  choice: mananatili
  rationale: Sa konteksto, ang μεταφορikal na “tatayo” ay nangangahulugang magpapatuloy o mananatiling matatag. Mas natural sa Tagalog ang “mananatili” at hindi nawawala ang diwa.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ang kanyang kaharian
  rationale: Pinananatili ng “kaharian” ang larawan ng isang nasasakupang paghahari na maaaring mahati at hindi manatili.
theological_decisions:
- issue: Ang diwa ng pagkakahati ni Satanas laban sa sarili
  choice: 'Inilalahad ang talata bilang kondisyong argumento: kung pinalalayas ni Satanas ang sarili niyang panig, nahahati siya laban sa sarili at hindi makapananatili ang kanyang kaharian.'
  alternative: Maaaring palawakin ang salin sa pamamagitan ng larawang “bahay na nahahati,” mula sa naunang konteksto.
  rationale: Ang tekstong Griyego mismo ay tumutukoy sa panloob na pagkakahati at sa kahariang hindi makapananatili; hindi kailangang idagdag ang larawang “bahay” sa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “nagpapalayas” bilang likas na salita sa konteksto at “mananatili” upang maipahayag ang idyomatikong kahulugan ng σταθήσεται.
