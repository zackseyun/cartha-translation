  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: pinananatili ang pang-ugnay at kondisyon, ang paulit-ulit na pangalang Satanas, ang pagpapalayas, ang panloob na pagsalungat, at ang retorikal na tanong tungkol sa pagpapatuloy ng kaharian. Gayunman, ang “nahahati siya” ay mas natural na nagsasaad ng kasalukuyang nagpapatuloy na pagkakahati. Ang aorist passive na ἐμερίσθη ay mas tuwirang maisasalin dito bilang resultang kalagayan na “nahati siya,” nang hindi ipinagpapalagay ang tagal ng kilos.'
