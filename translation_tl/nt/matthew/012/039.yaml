  to: Ngunit sumagot siya sa kanila, “Isang masama at mapangalunyang salinlahi ang naghahanap ng tanda, at walang tanda ang ibibigay rito maliban sa tanda ng propetang Jonas[b].”
  rationale: Inayos ang pang-angkop sa “mapangalunyang” at ang ayos ng sugnay na balintiyak. Pinalitan din ang panloob na “ngunit” ng “at,” na mas tuwirang tumutugma sa καί; ang panimulang “Ngunit” ay sapat nang kumakatawan sa δέ. Hindi binago ang saklaw o ang sadyang bukas na kahulugan ng tanda ni Jonas.
