base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Isang masama at mapangalunyang salinlahi ang naghahanap ng tanda, at walang tanda ang ibibigay rito maliban sa tanda ng propetang Jonas[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Maaari ring isalin: “tanda ni Jonas na propeta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Ang tambalang pariralang Griyego ay karaniwang pormulang pasalaysay. Sapat na naihahayag ng “sumagot siya” ang diwa sa natural na modernong Tagalog; magiging mabigat at paulit-ulit ang “sumagot siya at sinabi.”
- source_word: Γενεὰ
  choice: salinlahi
  rationale: Tumutukoy ito sa isang pangkat ng magkakapanahong tao na inilalarawan ayon sa kanilang asal. Pinananatili ng “salinlahi” ang kolektibong diwa ng pangngalan.
- source_word: πονηρὰ
  choice: masama
  rationale: Direkta, malinaw, at sapat ang bigat ng “masama” para sa moral na paghatol sa konteksto.
- source_word: μοιχαλὶς
  choice: mapangalunya
  rationale: Pinananatili nito ang matalas na larawan ng pangangalunya at hindi agad nilulutas ang maaaring pahiwatig ng pagtataksil sa tipan bilang simpleng “taksil.”
- source_word: σημεῖον
  choice: tanda
  rationale: Ang “tanda” ay malawak at tuwirang katumbas; hindi nito idinaragdag ang “milagroso,” na hindi tahasang sinabi ng Griyego.
- source_word: ἐπιζητεῖ
  choice: naghahanap
  rationale: Natural at tuwirang nagpapahayag ito ng patuloy na paghahangad ng tanda nang hindi labis na pinatitindi bilang “humihingi nang may pagpilit.”
- source_word: δοθήσεται
  choice: ibibigay
  rationale: Natural na inililipat nito sa Tagalog ang panghinaharap na balintiyak ng Griyego.
- source_word: αὐτῇ
  choice: dito
  rationale: Tumutukoy ang panghalip sa “salinlahi.” Ang “dito” ay natural na panghalip sa Tagalog para sa tinutukoy na pangkat at umiiwas sa di-natural na pambabaeng pagtukoy batay lamang sa gramatikang Griyego.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw nitong ipinapahayag ang tanging eksepsiyon sa naunang pagtanggi.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: tanda ng propetang Jonas
  rationale: Natural sa Tagalog at tapat sa parirala, habang iniiwang bukas sa kasunod na konteksto ang eksaktong kalikasan ng tanda.
theological_decisions:
- issue: Kahulugan ng μοιχαλὶς sa pagsaway ni Jesus
  choice: mapangalunya
  alternative: taksil
  rationale: Maaaring umalingawngaw rito ang makahulang larawan ng pagtataksil sa tipan, kasabay ng literal at moral na bigat ng pangangalunya. Pinananatili ng salin ang talinghaga sa halip na paliitin ito sa isang interpretasyon.
- issue: Kalikasan ng “tanda ng propetang Jonas”
  choice: Hindi ipinaliwanag ang tanda sa pangunahing teksto.
  alternative: tandang tulad ng naranasan ni Jonas; tanda na si Jonas mismo
  rationale: Ipinakikilala lamang ng talata ang parirala, at nililinaw pa ito ng kasunod na konteksto. Hindi dapat pangunahan ng salin ang pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “salinlahi,” “tanda,” at “propetang Jonas” bilang pamilyar na bokabularyong biblikal, ngunit iniwasan ang lipas o labis na pormal na ayos. Inilipat sa wastong salita ang mga talababa dahil hindi tugma ang pagkakalagay ng mga marker sa ibinigay na English consultation layer.
