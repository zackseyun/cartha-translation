  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: tl
  text: Kung gayon, gaano nga ba higit na mahalaga ang isang tao kaysa isang tupa! Kaya, naaayon sa Kautusan ang paggawa ng mabuti sa araw ng Sabbath.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, pangmaramihan ang salitang isinaling “Sabbath”; karaniwang idyoma ito para sa araw ng Sabbath o sa pangingilin nito.
    reason: Ipinaliliwanag ang pangmaramihang anyo ng τοῖς σάββασιν, na likas na isinalin sa Tagalog bilang “sa araw ng Sabbath.”
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: Gaano nga ba higit
  rationale: Ipinahahayag nito ang retorikal na paghahambing mula sa mas maliit tungo sa mas mahalaga, habang pinananatili ng “nga ba” ang inferensiya at diin ng tanong.
- source_word: διαφέρει
  choice: higit na mahalaga
  rationale: Sa konteksto, tumutukoy ang pandiwa sa nakahihigit na halaga ng tao, hindi lamang sa pagiging naiiba.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Ang salita ay tumutukoy sa isang tao bilang kinatawan ng sangkatauhan; natural at tumpak sa Tagalog ang “isang tao.”
- source_word: προβάτου
  choice: kaysa sa isang tupa
  rationale: Ipinakikita ng genitive ang bagay na pinaghahambingan.
- source_word: ὥστε
  choice: Kaya
  rationale: Malinaw at natural nitong ipinakikita ang konklusyong hinango sa naunang paghahambing.
- source_word: ἔξεστιν
  choice: naaayon sa Kautusan
  rationale: Ipinahahayag nito ang pagiging legal o pinahihintulutan sa konteksto ng pagtatalo tungkol sa Kautusan at Sabbath, hindi lamang ang praktikal na posibilidad.
- source_word: τοῖς σάββασιν
  choice: tuwing Sabbath
  rationale: Natural na Tagalog itong katumbas ng pangmaramihang anyong Griyego, na isang idyoma para sa Sabbath bilang paulit-ulit na araw ng pangingilin.
- source_word: καλῶς ποιεῖν
  choice: gumawa ng mabuti
  rationale: Direkta at likas na katumbas ito ng idyomang tumutukoy sa paggawa ng kabutihan.
theological_decisions:
- issue: Pangkalahatang saklaw ng ἄνθρωπος
  choice: isang tao
  alternative: isang lalaki
  rationale: Hindi nililimitahan ng ἄνθρωπος dito ang pahayag sa kalalakihan; inihahambing nito ang halaga ng sinumang tao sa isang tupa.
- issue: Legal na diwa ng ἔξεστιν
  choice: naaayon sa Kautusan
  alternative: pinahihintulutan
  rationale: Dahil ang usapan ay tungkol sa kung ano ang nararapat ayon sa Sabbath, pinananatili ng salin ang legal na diwa nang hindi tinutukoy kung sinong nagpapahintulot.
- issue: Pangmaramihang anyo ng σάββασιν
  choice: tuwing Sabbath
  alternative: sa mga Sabbath
  rationale: Karaniwang idyoma sa Griyego ang pangmaramihang anyo. Ang “tuwing Sabbath” ay natural sa Tagalog at pinananatili ang diwang paulit-ulit o pangkalahatang pagsunod sa Sabbath.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nga ba” upang maihatid ang retorikal na diin, at “tuwing Sabbath” upang maging natural nang hindi ikinukubli ang pangmaramihang anyo ng Griyego.
