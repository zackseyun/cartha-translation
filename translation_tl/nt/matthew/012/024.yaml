id: MAT.12.24
reference: Matthew 12:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: tl
  text: Ngunit nang marinig iyon ng mga Pariseo, sinabi nila, “Hindi nagpapalayas ng mga demonyo ang taong ito maliban sa pamamagitan ni Beelzebul[a], ang pinuno ng mga demonyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebul: tradisyonal na “Beelzebub.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang pagsalungat ng tugon ng mga Pariseo sa naunang reaksiyon ng mga tao.
- source_word: ἀκούσαντες
  choice: nang marinig iyon
  rationale: Likas na temporal ang gamit ng aorist participle; ang “iyon” ay tumutukoy sa pangyayaring narinig nila ayon sa konteksto.
- source_word: Οὗτος
  choice: Ang taong ito
  rationale: Pinananatili ang bahagyang mapanlait o mapagwalang-halang tono ng demonstrative nang hindi nagpapasok ng dagdag na interpretasyon.
- source_word: ἐκβάλλει
  choice: nagpapalayas
  rationale: Karaniwan, malinaw, at angkop na salin sa konteksto ng pagpapalayas ng mga demonyo.
- source_word: τὰ δαιμόνια
  choice: ng mga demonyo
  rationale: Tuwirang modernong katumbas ng δαιμόνια sa konteksto ng mga Sinoptikong Ebanghelyo.
- source_word: εἰ μὴ
  choice: sa pamamagitan lamang
  rationale: Ipinapahayag na ayon sa paratang, si Beelzebul ang tanging pinagmumulan o paraan ng kapangyarihan; natural ito sa Filipino kasunod ng negatibong pahayag.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: sa pamamagitan ... ni Beelzebul
  rationale: Ang ἐν ay instrumental dito, kaya ipinakikita nito ang ipinaparatang na ahensiya o paraan nang hindi dinaragdagan ng salitang “kapangyarihan.”
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Sinusunod ang anyo ng pangalang nasa SBLGNT; inilalagay sa talababa ang tradisyonal na anyong Beelzebub.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: ang pinuno ng mga demonyo
  rationale: Malinaw at natural na ipinahahayag ang awtoridad na taglay ng ἄρχων; hindi kasing-arkoiko ng “prinsipe.”
theological_decisions:
- issue: Mapanlait na demonstrative na Οὗτος
  choice: Ang taong ito
  alternative: Siya / Ang isang ito
  rationale: Pinananatili ang mapagwalang-halang himig ng paratang ng mga Pariseo, ngunit hindi ito pinalalakas nang lampas sa ipinahihiwatig ng Griyego.
- issue: Anyo ng pangalang Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Ang pangunahing teksto ay sumusunod sa anyo ng pangalan sa Griyegong sanggunian, samantalang ang pamilyar na tradisyonal na anyo ay pinananatili sa talababa.
- issue: Instrumental na gamit ng ἐν
  choice: sa pamamagitan ... ni Beelzebul
  alternative: sa kapangyarihan ni Beelzebul
  rationale: Pinananatili ang paratang tungkol sa ahensiya o paraan nang hindi tahasang idinaragdag ang “kapangyarihan,” na hindi nakasulat sa Griyego.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga Pariseo,” “nagpapalayas,” at “pinuno” bilang mga karaniwan at madaling maunawaang anyo. Ang talababa ay minarkahan sa pangunahing teksto pagkatapos ng “Beelzebul.”
