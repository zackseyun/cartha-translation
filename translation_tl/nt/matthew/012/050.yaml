  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: tl
  text: Sapagkat ang sinumang gumagawa ng kalooban ng aking Ama na nasa langit, siya ang aking kapatid na lalaki, kapatid na babae, at ina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, panlalaking isahan ang anyong gramatikal ng “sinuman” at “siya,” ngunit ginagamit ito rito sa pangkalahatang diwa at tumutukoy sa sinumang gumagawa ng kalooban ng Ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: ang sinuman
  rationale: Ipinahahayag ng di-tiyak na panghalip na may ἄν ang isang bukás at pangkalahatang kondisyon; natural itong naihahatid ng “ang sinuman” sa modernong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang sinabi ni Jesus.
- source_word: ποιήσῃ
  choice: gumagawa
  rationale: Ang ποιέω kasama ng θέλημα ay tuwirang nangangahulugang gawin o isagawa ang kalooban; hindi ito pinakitid sa mas interpretatibong “sumusunod.”
- source_word: τὸ θέλημα
  choice: ang kalooban
  rationale: Pinananatili ang tahasang teolohikal at relasyonal na diwa ng parirala nang hindi ito ginagawang paraprasis.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: ng aking Ama na nasa langit
  rationale: Malapit ito sa estruktura at kahulugan ng Griyego at malinaw at marangal sa kasalukuyang Tagalog.
- source_word: αὐτός
  choice: siya
  rationale: Inihahatid ng “siya” ang pagbibigay-diin sa mismong taong gumagawa ng kalooban ng Ama, nang hindi nagpapahiwatig ng kasariang hindi kailangang markahan sa Tagalog.
- source_word: ἀδελφὸς
  choice: kapatid na lalaki
  rationale: Tahasang pinananatili ang panlalaking papel sa magkakahiwalay na talaan ng mga ugnayang pampamilya.
- source_word: ἀδελφὴ
  choice: kapatid na babae
  rationale: Tahasang pinananatili ang pambabaeng papel at hindi ito isinasama lamang sa pangkalahatang “kapatid.”
- source_word: μήτηρ
  choice: ina
  rationale: Tuwirang katumbas na nagpapanatili sa isahang bilang at sa ikatlong papel sa talaan.
- source_word: ἐστίν
  choice: ang
  rationale: Ang pangungusap na “siya ang aking…” ang natural na Tagalog na katumbas ng Griyegong kopula sa pagkakakilanlan.
theological_decisions:
- issue: Panlalaking anyong gramatikal sa isang pangkalahatang pahayag
  choice: ang sinuman … siya
  alternative: ang sinumang lalaki … siya
  rationale: Bagaman panlalaking isahan ang anyong gramatikal ng ὅστις at αὐτός sa Griyego, pangkalahatan ang saklaw nito. Hindi minamarkahan ng Tagalog na “sinuman” at “siya” ang kasarian, kaya naipahahayag nito ang tunay na saklaw nang hindi nagdaragdag ng eksklusibong kahulugang wala sa pinagmulan. Pinananatili naman nang tahasan ang “kapatid na lalaki” at “kapatid na babae” sa panaguri.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Sapagkat” upang mapanatili ang paliwanag na ugnayan sa konteksto, at ang magkakahiwalay na “kapatid na lalaki, kapatid na babae, at ina” upang tapat na mapanatili ang tatlong katawagang pampamilya sa Griyego.
