  verdict: revise
  source_fidelity: Ang “lumabas,” “ng mga Pariseo,” “laban sa kanya,” at “kung paano nila siya” ay tapat sa pagkakasunod at ugnayan ng Griyego. Ang “nagsabwatan” ay katanggap-tanggap na kontekstuwal na salin ng συμβούλιον ἔλαβον, dahil ang kasunod na layunin ay hayagang mapanira. Gayunman, ang “maipapahamak” ay karaniwang nangangahulugang mailagay sa panganib o mapinsala at kulang sa tiyak na diwa ng ἀπολέσωσιν na puksain/wasakin/eliminahin. Ang “mapuksa” ay mas malapit habang hindi pa sapilitang isinasara ang kahulugan sa tahasang pagpatay.
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino. Mas tuwiran at natural ang “mapuksa” kaysa “maipapahamak” sa layuning pinag-uusapan ng mga Pariseo.
  terminology: Ang “Pariseo” ay wastong karaniwang Filipino para sa Φαρισαῖοι. Ang “mapuksa” ay nagpapanatili ng mas malawak na saklaw ng ἀπόλλυμι; inilalagay sa talababa ang mas tiyak na alternatibong “patayin” o “ipapatay.”
  issues:
  - severity: medium
    issue: Kulang ang lakas ng “maipapahamak” para sa ἀπολέσωσιν.
    rationale: Maaaring mangahulugan ang “maipapahamak” ng simpleng pagpapinsala o paglalagay sa panganib, samantalang ang ἀπολέσωσιν sa pariralang ito ay tumutukoy sa pagpuksa o pag-aalis sa kanya. Hindi kailangang ipilit ng pangunahing teksto ang “patayin,” ngunit dapat nitong ipahayag ang mas matinding layunin.
  - severity: low
    issue: Hindi angkop ang “mapapatay” bilang pangunahing anyo ng alternatibo sa talababa.
    rationale: Mas malinaw na aktibong Filipino ang “patayin siya” para sa alternatibong pagbasa; ang “ipapatay siya” naman ay maaaring magpahiwatig ng pagpapapatay sa pamamagitan ng iba.
  revised_text: Ngunit lumabas ang mga Pariseo at nagsabwatan laban sa kanya kung paano nila siya mapuksa.[a]
