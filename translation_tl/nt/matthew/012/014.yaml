  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: tl
  text: Ngunit lumabas ang mga Pariseo at nagsabwatan laban sa kanya kung paano nila siya mapuksa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patayin siya” o “ipapatay siya.” Ang pandiwang Griyego ay nangangahulugang “puksain” o “wasakin” at maaaring tumukoy sa pagpatay sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: lumabas
  rationale: Ang aorist participle ay nagsasaad ng naunang kilos; natural na ipinapahayag sa Filipino bilang pangunahing pandiwang kasunod sa daloy ng salaysay.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ng δέ ang pagliko at banayad na pagsalungat sa naunang pangyayari.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat na Φαρισαῖοι.
- source_word: συμβούλιον ἔλαβον
  choice: nagsabwatan
  rationale: Ang idyoma ay literal na 'kumuha ng payo' ngunit dito ay tumutukoy sa sama-samang lihim at masamang pagpaplano, gaya ng nililinaw ng layuning sumunod.
- source_word: κατ’ αὐτοῦ
  choice: laban sa kanya
  rationale: Ang κατά na may genitive ay may salungat o mapanlabang diwa sa kontekstong ito.
- source_word: ὅπως
  choice: kung paano nila
  rationale: Ipinakikilala nito ang nilalaman o layunin ng kanilang pagsasabwatan at pinananatili ang deliberatibong diwa ng paraan.
- source_word: ἀπολέσωσιν
  choice: maipapahamak
  rationale: Pinananatili nito ang mas malawak na saklaw ng ἀπόλλυμι kaysa sa tahasang 'patayin,' habang ang konteksto at talababa ay nagpapakitang maaaring nakamamatay ang layunin.
theological_decisions:
- issue: Antas ng katiyakan sa nakamamatay na diwa ng ἀπολέσωσιν
  choice: maipapahamak
  alternative: mapapatay / maipapatay
  rationale: Malinaw na mapanira ang hangarin, at malamang na pagpatay ang tinutukoy sa konteksto, ngunit mas malawak ang mismong pandiwang Griyego kaysa sa isang tahasang pandiwa para sa pagpatay. Pinananatili ng pangunahing teksto ang lawak na iyon at inilalagay sa talababa ang mas tiyak na kahulugan.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nagsabwatan” upang malinaw na ihatid ang sama-samang masamang pagpaplano nang hindi ginagawang teknikal o lubhang literal ang idyomang Griyego.
