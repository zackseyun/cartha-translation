  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: tl
  text: At sa kanyang pangalan aasa ang mga bansa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Aasa sa kanyang pangalan ang mga Hentil.”
    reason: Ipinapakita ang posibleng alternatibong kahulugan ng ἔθνη at ang natural na ayos ng buong parirala sa Tagalog.
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay upang malinaw na maikabit ang pangungusap sa naunang bahagi ng sipi.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: sa kanyang pangalan
  rationale: Likas itong katumbas sa Tagalog ng datibong kasama ng ἐλπίζω. Pinananatili rin ng “pangalan” ang saklaw na maaaring tumukoy sa kanyang pagkakakilanlan, kapangyarihan, at reputasyon nang hindi nililimitahan ang kahulugan.
- source_word: ἔθνη
  choice: ang mga bansa
  rationale: Maaaring mangahulugan ang ἔθνη ng “mga bansa” o “mga Hentil.” Sa konteksto ng sipi mula kay Isaias, pinananatili ng “mga bansa” ang malawak na tanaw sa mga bayan sa labas ng Israel; inilalagay sa talababa ang “mga Hentil” bilang posibleng salin.
- source_word: ἐλπιοῦσιν
  choice: aasa
  rationale: Tuwirang ipinapahayag ng pandiwang nasa panghinaharap ang paglalagak ng pag-asa. Ang “aasa” ay natural, maikli, at pinananatili ang himig ng pangako.
theological_decisions:
- issue: Pagpapakahulugan sa ἔθνη sa isang mesiyanikong sipi
  choice: ang mga bansa
  alternative: ang mga Hentil
  rationale: Pinananatili ng “mga bansa” ang malawak na saklaw ng sipi mula kay Isaias, samantalang ang “mga Hentil” ay kinikilalang posibleng kahulugang higit na tahasang tumutukoy sa mga hindi Judio. Hindi tahasang nilulutas ng pangunahing salin ang leksikal at teolohikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “kanyang” sa karaniwang maliit na titik at iniwasan ang masalimuot o makadenominasyong pananalita.
