base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Hindi ba ninyo nabasa kung ano ang ginawa ni David nang magutom siya, kasama ang mga kasamahan niya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “nang magutom si David at ang mga kasamahan niya.” Tahasang kay David tumutukoy ang pandiwang nasa isahan sa Griyego, ngunit maaaring saklawin ng diwa ng pagkagutom ang mga kasamahan niya.'
    reason: Pinananatili ang gramatikal na pagkakaiba sa Griyego at ang posibilidad na ang pagkagutom ay tumutukoy kapwa kay David at sa mga kasamahan niya.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit sinabi niya
  rationale: Ang δέ ay banayad na pang-ugnay na dito ay nagpapakita ng pagsagot ni Jesus sa naunang paratang; natural sa konteksto ang “Ngunit.”
- source_word: εἶπεν αὐτοῖς
  choice: sinabi niya sa kanila
  rationale: Tuwirang katumbas ito ng pandiwang λέγω na may layong αὐτοῖς, at natural sa modernong Tagalog.
- source_word: Οὐκ ἀνέγνωτε
  choice: Hindi ba ninyo nabasa
  rationale: Pinananatili nito ang retorikal na tanong at ang pag-apela sa dati na nilang pagbasa at pagkakilala sa Kasulatan.
- source_word: τί ἐποίησεν
  choice: kung ano ang ginawa
  rationale: Payak at natural na salin ng τί ἐποίησεν nang walang idinagdag na interpretasyon.
- source_word: Δαυὶδ
  choice: David
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: ὅτε ἐπείνασεν
  choice: nang magutom siya
  rationale: Ang πεινάω ay nangangahulugang magutom o maghirap ng gutom; malinaw at kasalukuyang pananalita ang “magutom.”
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: at ang mga kasama niya
  rationale: Malapit ito sa literal na “ang mga kasama niya” at hindi nagdaragdag ng tiyak na uri ng ugnayan gaya ng mga kaibigan o tauhan.
