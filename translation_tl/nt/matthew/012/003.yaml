    issue: Hindi buo ang sintaks ng “nang magutom siya at ang mga kasama niya.”
    rationale: Sa Filipino, ang pariralang “ang mga kasama niya” ay naiwan na walang maliwanag na pandiwa o ibang wastong pagkakaugnay. Ang pagdaragdag lamang ng “ay nagutom din” ay magpapasya nang mas tahasan na kapwa sila gutom; sa halip, ang rebisyon ay nagpapanatili ng saklaw na di-ganap na tinutukoy ng Griyego.
