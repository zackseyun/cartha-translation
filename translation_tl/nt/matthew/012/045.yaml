  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: tl
  text: Pagkatapos, pupunta ito at magsasama ng pito pang espiritu na mas masama kaysa sa sarili nito[a]. Papasok sila at maninirahan doon, at ang huling kalagayan ng taong iyon ay magiging mas masahol kaysa sa una[b]. Gayundin ang mangyayari sa masamang salinlahing ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pito pang espiritu na higit na masama kaysa sa sarili nito.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang mga huling bagay ng taong iyon ay nagiging mas masahol kaysa sa mga una,” isang idyomang tumutukoy sa huling kalagayan niya kung ihahambing sa dati.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Pagkatapos, aalis ito
  rationale: Ipinahahayag ang kasunod na hakbang sa paglalarawan. Ang aspektong buhay ng Griyegong pangkasalukuyan ay likas na naihahatid sa Filipino sa pamamagitan ng panghinaharap na anyo sa ganitong pangkalahatang salaysay.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: magsasama ... sa sarili nito
  rationale: Ipinakikita ng pandiwa at pariralang panarili na isinasama ng espiritu ang iba pang mga espiritu sa pagbalik nito.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: pito pang espiritu
  rationale: Ang “pang” ay natural na naghahayag na ang pito ay karagdagan sa unang espiritu; pinanatili ang “espiritu” sa halip na gawing mas tiyak na “demonyo.”
- source_word: πονηρότερα ἑαυτοῦ
  choice: mas masama kaysa sa sarili nito
  rationale: Pinananatili ang paghahambing ng antas ng kasamaan at ang panariling reperensiya ng Griyego.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Papasok sila at maninirahan doon
  rationale: Ginawang magkakaugnay na mga pandiwa ang participle at pangunahing pandiwa upang malinaw at natural sa Filipino ang pagkakasunod ng pagpasok at paninirahan. Ang maramihang “sila” ay sumusunod sa semantikong tinutukoy na mga espiritu.
- source_word: γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων
  choice: ang huling kalagayan ng taong iyon ay magiging mas masahol kaysa sa una
  rationale: Ang literal na “mga huling bagay” at “mga una” ay isang paghahambing ng pangwakas at dating kalagayan; isinalin ang idyoma nang malinaw habang pinananatili ang estruktura ng paghahambing.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Gayundin ang mangyayari sa masamang salinlahing ito
  rationale: Natural na ipinahahayag ang paglalapat ng ilustrasyon sa kasalukuyang masamang salinlahi.
theological_decisions:
- issue: Paglalarawan sa masasamang nilalang bilang πνεύματα
  choice: mga espiritu
  alternative: mga demonyo
  rationale: “Mga espiritu” ang tuwirang katumbas ng Griyego at sapat nang malinaw ang masamang likas nila mula sa konteksto; iniiwasan nitong magpasok ng mas tiyak na terminong wala sa sugnay.
- issue: Kasarian sa τοῦ ἀνθρώπου ἐκείνου
  choice: taong iyon
  alternative: lalaking iyon
  rationale: Bagaman gramatikal na panlalaki ang anyo sa Griyego, ang ἄνθρωπος dito ay tumutukoy sa tao sa pangkalahatang halimbawa, hindi nagbibigay-diin sa kasariang lalaki. Ang “taong iyon” ang eksakto at natural na salin nang hindi binabago ang reperensiya.
- issue: Pagkakaugnay ng ilustrasyon at ng salinlahi
  choice: Gayundin ang mangyayari
  alternative: Ganito rin ang magiging kalagayan
  rationale: Pinananatili ang puwersa ng paghahambing nang hindi tinutukoy nang higit sa sinabi ng teksto kung eksaktong paano matutupad ang pagkakatulad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” bilang karaniwang biblikal ngunit nauunawaang katumbas ng γενεά. Ang mga pangungusap ay hinati upang maging natural basahin, habang pinananatili ang lohikal na pagkakasunod at paghahambing ng orihinal.
