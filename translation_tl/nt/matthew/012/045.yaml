    rationale: Ang “aalis” ay nakatuon sa pag-alis/departure, samantalang ang pandiwa rito ay nagsasaad na ang espiritu ay pupunta upang magsama ng iba pa. Ang “pupunta ito” ay mas tapat sa kilos at sa daloy ng pangungusap.
  - severity: low
    issue: “kaya” para sa καί
    rationale: Nagpapahiwatig ang “kaya” ng isang hayag na ugnayang sanhi-bunga na hindi tahasang minamarkahan ng simpleng καί. Ang “at” ay nagpapanatili ng bukas at sunod-sunod na ugnayan ng orihinal.
