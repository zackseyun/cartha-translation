  verdict: revise
  source_fidelity: Kailangang itama ang “aalis ito,” na mas tuwirang nangangahulugang ‘departs/leaves.’ Ang πορεύεται ay ‘pumupunta/goes’ sa susunod na kilos, bago nito isama ang pitong espiritu. Ang natitirang diwa—pitong iba pang espiritu, higit na masama, pagpasok at paninirahan, paglala ng kalagayan, at paglalapat sa masamang salinlahi—ay tapat sa Griyego.
  naturalness: Natural at malinaw sa makabagong Filipino ang rebisyong “pupunta ito at magsasama.” Mas maayos din ang simpleng pag-uugnay na “at” kaysa “kaya,” dahil καί ay nagdurugtong ng pangyayari at hindi tahasang nagsasaad ng sanhi.
  terminology: Ang “espiritu,” “taong iyon,” at “masamang salinlahi” ay angkop at hindi nagpapasok ng dagdag na pagpapakahulugan. Ang “huling kalagayan” ay wastong paglilinaw sa idyomatikong τὰ ἔσχατα.
