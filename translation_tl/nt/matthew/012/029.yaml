  naturalness: Kailangan ng bahagyang rebisyon para sa mas idiomatiko at malinaw na modernong Tagalog. Ang “agawin” ay wastong aktibong pandiwa rito. Ang “talian” ay tuwirang natural para sa δήσῃ, samantalang ang “gagapusin” ay maaaring manatili bilang alternatibo sa talababa. Ang “At pagkatapos ay” ay mas malinaw na pagsunod sa temporal na καὶ τότε kaysa sa mas kolokyal na “At saka.”
  terminology: Ang “malakas na lalaki” ay katanggap-tanggap na pagpapanatili ng kongkretong panlalaking larawan ng ἰσχυρός. Ang “mga gamit” ay angkop para sa σκεύη sa kontekstong ito, na may talababa para sa mas malawak na kahulugang “mga ari-arian.” Pinananatili ang pagkakaiba ng “agawin” at “sasamsamin” para sa ἁρπάσαι at διαρπάσει.
