revisions:
- from: O paano makapapasok ang isang tao sa bahay ng malakas na lalaki at maagaw ang mga gamit nito[a], kung hindi muna niya gagapusin[b] ang malakas na lalaki? At saka niya sasamsamin ang bahay nito.
  to: O paano makapapasok ang isang tao sa bahay ng malakas na lalaki at agawin ang kanyang mga gamit[a], malibang talian[b] muna niya ang malakas na lalaki? At pagkatapos ay sasamsamin niya ang kanyang bahay.
  rationale: Inayos ang pokus ng pandiwa para malinaw na aktibo ang pagkuha ng mga gamit, at pinalinaw ang mga panghalip na tumutukoy sa malakas na lalaki. Ginawang pangunahing salin ang “talian,” na tuwirang katumbas ng “bind,” habang iningatan ang “gagapusin” bilang wastong mas mariing alternatibo. Walang idinagdag na alegorikal o doktrinal na pagpapaliwanag.
