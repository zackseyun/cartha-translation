id: MAT.12.29
reference: Matthew 12:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: tl
  text: O paano makapapasok ang isang tao sa bahay ng malakas na lalaki at agawin ang kanyang mga gamit[a], malibang talian[b] muna niya ang malakas na lalaki? At pagkatapos ay sasamsamin niya ang kanyang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ari-arian niya.” Ang salitang Griyego ay maaaring tumukoy nang literal sa mga sisidlan o kagamitan, o nang mas malawak sa mga pag-aari.
    reason: lexical_alternative
  - marker: b
    text: O “gagapusin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Likas at maikling panandang nag-uugnay sa tanong na ito bilang isa pang paliwanag sa naunang argumento.
- source_word: πῶς δύναταί τις
  choice: paano makapapasok ang isang tao
  rationale: Pinananatili ang retorikal na tanong at ang pangkalahatang di-tiyak na paksa sa natural na Tagalog.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: malakas na lalaki
  rationale: Pinananatili ang kongkretong larawan at ang panlalaking anyo ng substantibong pang-uri sa Griyego.
- source_word: τὰ σκεύη αὐτοῦ
  choice: mga gamit nito
  rationale: Maaaring literal na tumukoy ang σκεύη sa mga sisidlan o kagamitan, ngunit sa konteksto ay mas malawak itong tumutukoy sa mga pag-aari sa bahay.
- source_word: ἁρπάσαι
  choice: maagaw
  rationale: Ipinahahayag ang marahas o sapilitang pagkuha nang hindi ito ipinapantay sa mas masidhing διαρπάσει sa hulihan.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: kung hindi muna niya gagapusin
  rationale: Tumpak na pinananatili ang kondisyon, ang pagkakasunod na ipinahihiwatig ng πρῶτον, at ang ideya ng pagtali o paggapos.
- source_word: καὶ τότε
  choice: At saka
  rationale: Pinananatili ang pang-ugnay at ang temporal na pagkakasunod ng kilos.
- source_word: διαρπάσει
  choice: sasamsamin
  rationale: Ang mas masidhing pandiwa ay nagpapahiwatig ng pagdarambong o malawakang pagkuha matapos madaig ang may-ari.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: ang bahay nito
  rationale: Pinananatili ang kongkretong talinghaga ng bahay at hindi ipinapasok sa salin ang isang tiyak na alegorikong paliwanag.
theological_decisions:
- issue: Panlalaking katawagan sa talinghaga
  choice: malakas na lalaki
  alternative: malakas na tao
  rationale: Ang Griyego ay gumagamit ng panlalaking anyo sa isang kongkretong talinghaga; pinananatili ng salin ang larawang ito nang hindi ito ginagawang pahayag tungkol sa kasarian sa pangkalahatan.
- issue: Saklaw ng talinghagang “bahay” at “mga gamit”
  choice: Panatilihin ang kongkretong larawan ng pagpasok, pag-agaw, at pagsamsam
  alternative: Isalin nang interpretibo bilang nasasakupan at mga pag-aari
  rationale: Bagaman tumutukoy ang konteksto sa kapangyarihan laban sa mga demonyo, hindi dapat ipalit sa mismong talinghaga ang isang ganap na paliwanag nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “gagapusin” at “sasamsamin” upang mapanatili ang lakas ng kongkretong talinghaga, habang ang “mga gamit” ay mas natural sa karaniwang mambabasa kaysa sa literal na “mga sisidlan.”
