id: MAT.12.40
reference: Matthew 12:40
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: tl
  text: Sapagkat kung paanong si Jonas ay nasa tiyan ng malaking nilalang sa dagat sa loob ng tatlong araw at tatlong gabi[a], gayundin ang Anak ng Tao ay mapapasa puso ng lupa sa loob ng tatlong araw at tatlong gabi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tatlong araw at tatlong gabi” ay maaaring unawain bilang idyomang sumasaklaw sa mga bahagi ng tatlong araw, bagaman inuunawa naman ito ng iba sa mas mahigpit na paraan.
    reason: alternative_reading
  - marker: b
    text: Ang “puso ng lupa” ay maaaring tumukoy sa paglilibing, sa libingan, o sa kailaliman o dako ng mga patay; pinanatili sa pangunahing teksto ang metapora ng Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ang paliwanag na bisa ng γάρ at ang paghahambing ng ὥσπερ sa likas na ayos ng Tagalog.
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Karaniwang anyo ng pangalang Jonah sa tradisyong biblikal sa Tagalog.
- source_word: ἐν τῇ κοιλίᾳ
  choice: nasa tiyan
  rationale: Ang κοιλία ay tuwirang tumutukoy sa tiyan o sikmura; natural at malinaw dito ang “tiyan.”
- source_word: τοῦ κήτους
  choice: ng malaking nilalang sa dagat
  rationale: Ang κῆτος ay isang malaking nilalang sa dagat at hindi kinakailangang tumukoy sa isang tiyak na uring hayop; iniiwasang gawing mas espesipiko kaysa sa Griyego.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: sa loob ng tatlong araw at tatlong gabi
  rationale: Tuwirang pinananatili ang inuulit na pahayag tungkol sa panahon nang hindi nilulutas ang tanong kung ito ay idyomatiko o mahigpit na literal.
- source_word: οὕτως
  choice: gayundin
  rationale: Likas na ipinahihiwatig ang katumbas na ikalawang bahagi ng paghahambing.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Itinatag na salin ng titulo ni Jesus na nagpapanatili sa mga alingawngaw nito sa Kasulatan.
- source_word: ἔσται
  choice: ay mapapasapuso
  rationale: Ipinahahayag ang panghinaharap ng εἰμί habang pinananatili ang idyomang “sa puso ng lupa”; hindi idinaragdag ang di-tahasang diwang “mananatili.”
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: sa puso ng lupa
  rationale: Pinananatili ang metapora ng καρδία sa halip na ipakahulugan agad bilang libingan, kailaliman, o dako ng mga patay.
theological_decisions:
- issue: Kahulugan ng “puso ng lupa”
  choice: Pinanatili ang metaporang “puso ng lupa.”
  alternative: libingan; kailaliman ng lupa; dako ng mga patay
  rationale: Hindi ipinipilit ng Griyego ang iisang paliwanag, kaya hindi nilulutas sa pangunahing teksto ang tunay na teolohikal na kalabuan.
- issue: Bisa ng “tatlong araw at tatlong gabi”
  choice: Pinanatili nang tuwiran ang temporal na parirala.
  alternative: Idyomang Semitiko na maaaring sumaklaw sa mga bahagi ng tatlong araw; mahigpit na pitumpu't dalawang oras
  rationale: Tahasang ganito ang sabi ng talata; ang usapin sa kronolohiya ay hindi dapat pasiyahan sa mismong salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “malaking nilalang sa dagat” upang tumpak na mapanatili ang lawak ng κῆτος nang hindi ito ginagawang tiyak na “balyena” o “isda.”
