  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: tl
  text: Ngunit kung sa pamamagitan ng Espiritu ng Diyos[a] ay nagpapalayas ako ng mga demonyo, kung gayon, dumating na sa inyo ang kaharian ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa Espiritu ng Diyos.” Maaaring ipahayag ng pariralang Griyego ang saklaw o kaugnayan, o, gaya rito, ang paraan o ahensiya ng pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “umabot na sa inyo” o “sumapit na sa inyo.” Idiniriin ng pandiwang Griyego na nakarating na sa kanila ang kaharian ng Diyos sa mga gawa ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili nito ang kondisyon at ang banayad na pagsalungat ng δέ, at natural ito sa makabagong Filipino.
- source_word: ἐν πνεύματι θεοῦ
  choice: sa pamamagitan ng Espiritu ng Diyos
  rationale: Ipinahahayag nito ang posibleng gamit na paraan o ahensiya ng ἐν kasama ng datibo, habang malinaw na tumutukoy sa Espiritu ng Diyos.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang panghalip na may diin sa argumentong Griyego.
- source_word: ἐκβάλλω
  choice: nagpapalayas
  rationale: Natural at malinaw na katumbas sa Filipino para sa pagpapalabas o pagtataboy ng mga demonyo.
- source_word: τὰ δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang modernong katumbas ng δαιμόνια; hindi kailangang katawanin nang hiwalay ang artikulong Griyego dahil walang katumbas na tiyak na artikulo ang Filipino.
- source_word: ἄρα
  choice: dumating na
  rationale: Ang inferensiyang ipinahihiwatig ng ἄρα ay likas na naipapakita sa Filipino ng kayariang kondisyon at ng pangwakas na sugnay; ang 'na' ay nagtatampok sa naging pagdating.
- source_word: ἔφθασεν
  choice: dumating na
  rationale: Ipinahahayag ang pag-abot o pagdating na may kasalukuyang kabuluhan, nang hindi pinapahina bilang paglapit lamang.
- source_word: ἐφ’ ὑμᾶς
  choice: sa inyo
  rationale: Natural na Filipino para sa pagdating na umabot sa mga kausap; iniiwasan ang di-likas na literal na 'sa ibabaw ninyo'.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ang kaharian ng Diyos
  rationale: Nakaugaliang malinaw na katumbas na nag-iiwan ng saklaw para kapuwa sa paghahari ng Diyos at sa kahariang sakop niya.
theological_decisions:
- issue: Ang kaugnayan ng kaharian ng Diyos sa pagpapalayas ni Jesus ng mga demonyo
  choice: Ipinakikita ng talata na ang kaharian ng Diyos ay tunay nang dumating sa mga nakikinig sa pamamagitan ng mga gawa ni Jesus.
  alternative: Malapit lamang ang kaharian ngunit hindi pa dumating, o tumutukoy lamang ito sa katuparan sa hinaharap.
  rationale: Ang ἔφθασεν ay nagpapahayag ng pagdating o pag-abot. Pinananatili ng salin ang kasalukuyang realidad nito nang hindi gumagawa ng dagdag na pahayag tungkol sa ganap na katuparan sa hinaharap.
- issue: Ang tinutukoy ng πνεύματι θεοῦ
  choice: Ang Espiritu ng Diyos bilang banal na tagaganap o paraan ng gawa ni Jesus.
  alternative: Isang di-personal na kapangyarihang mula sa Diyos lamang.
  rationale: Ang parirala sa konteksto ay natural na tumutukoy sa Espiritu ng Diyos; ang malaking titik sa 'Espiritu' ay naaayon sa malinaw na referensiya nang walang idinaragdag na paliwanag sa mismong teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nagpapalayas” sa halip na mas teknikal o mas arkaikong pananalita. Inilagay ang mga talababa sa mismong pariralang nililinaw ng bawat isa.
