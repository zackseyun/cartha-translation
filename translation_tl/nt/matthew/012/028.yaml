  source_fidelity: Tumpak na naisasalin ang kondisyon, ang ahensiya ng Espiritu ng Diyos, ang pagpapalayas ng mga demonyo, at ang pagdating ng kaharian ng Diyos. Gayunman, hindi malinaw na naipapahayag sa pangunahing teksto ang inferensiyang ἄρα (“kung gayon/kaya nga”); ang simpleng kondisyunal na kayarian ay hindi sapat na kapalit nito sa isang optimal-equivalence na salin.
  naturalness: Natural at marangal ang “sa pamamagitan ng Espiritu ng Diyos,” “nagpapalayas ako,” at “dumating na sa inyo.” Ang pagdaragdag ng “kung gayon” ay likas sa modernong Filipino at nagpapalinaw sa lohikal na daloy.
  terminology: Ang “Espiritu ng Diyos,” “mga demonyo,” at “kaharian ng Diyos” ay angkop, pare-pareho, at tumutugon sa kahulugan ng mga pangunahing terminong Griyego. Ang talababa sa “Espiritu” ay dapat umiwas sa masyadong makitid na paglalarawan ng ἐν bilang “kinaroroonan”; mas tumpak ang “sa loob ng/saklaw ng” bilang alternatibong anyo, kasabay ng paraan o ahensiya.
