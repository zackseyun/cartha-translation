  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: tl
  text: Ngunit nang makita ito ng mga Pariseo, sinabi nila sa kanya, “Tingnan mo, ginagawa ng mga alagad mo ang hindi ipinahihintulot na gawin[a] sa araw ng Sabbath.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang hindi naaayon sa batas na gawin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang pagsalungat ng tugon ng mga Pariseo sa naunang pangyayari.
- source_word: ἰδόντες
  choice: nang makita ito
  rationale: Likas na temporal na salin ng aorist participle; ang “ito” ay tumutukoy sa ginawa ng mga alagad ayon sa konteksto.
- source_word: εἶπαν αὐτῷ
  choice: sinabi nila sa kanya
  rationale: Tuwiran at neutral na pormula ng pagsasalita sa modernong Tagalog.
- source_word: Ἰδοὺ
  choice: Tingnan mo!
  rationale: Pinananatili ang mariing pagtawag ng pansin sa paratang nang hindi gumagamit ng makalumang pananalita.
- source_word: μαθηταί
  choice: mga alagad
  rationale: Karaniwan at angkop na katawagan sa ugnayan ng guro at mga μαθηταί sa mga Ebanghelyo.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: Ginagawa ... gawin
  rationale: Pinananatili ang pag-uulit ng ποιέω na nasa Griyego habang nananatiling natural sa Tagalog.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ang hindi ipinahihintulot
  rationale: Tumpak na naghahayag ng kawalan ng pahintulot nang hindi ipinapasiya kung ang tinutukoy na pamantayan ay nasusulat na Kautusan o tradisyong interpretatibo.
- source_word: ἐν σαββάτῳ
  choice: sa araw ng Sabbath
  rationale: Malinaw at likas na temporal na parirala sa Tagalog para sa araw ng Sabbath.
theological_decisions:
- issue: Batayan ng pagtutol ng mga Pariseo
  choice: hindi ipinahihintulot
  alternative: hindi naaayon sa batas
  rationale: Inilalahad lamang ng talata ang legal-relihiyosong paratang. Hindi tinutukoy ng salin kung ang ipinaparatang na paglabag ay laban sa mismong Kautusan o sa isang interpretatibong tradisyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Pariseo,” “alagad,” at “Sabbath” bilang pamilyar na mga terminong biblikal; iniwasan ang makalumang “Narito” para sa Ἰδοὺ.
