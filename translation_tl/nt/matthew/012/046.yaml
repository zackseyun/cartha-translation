  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: tl
  text: Habang nagsasalita pa siya sa mga pulutong ng tao, narito, nakatayo sa labas ang kanyang ina at mga kapatid na lalaki[a], na naghahangad na makipag-usap sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kapatid”; kung mas malawak ang gamit ng ἀδελφοί, maaari itong tumukoy sa malalapit na kamag-anak. Panlalaking maramihan ang terminong Griyego, kaya “mga kapatid na lalaki” ang nasa pangunahing teksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa siya
  rationale: Ipinahahayag ng genitive absolute ang kasabay at nagpapatuloy na kilos; natural na naihahatid ng “habang… pa” ang ἔτι at ang banayad na pagpapatuloy ng salaysay na dala ng δέ.
- source_word: τοῖς ὄχλοις
  choice: sa mga pulutong ng tao
  rationale: Pinananatili nito ang maramihang anyo ng ὄχλοις habang nililinaw sa karaniwang Tagalog na mga pangkat ng tao ang tinutukoy.
- source_word: ἰδοὺ
  choice: narito
  rationale: Pinananatili ang pantawag-pansing puwersa ng ἰδού na naghaharap ng bagong pangyayari sa salaysay.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ang kanyang ina at mga kapatid na lalaki
  rationale: Likas sa Tagalog na ilapat ang pagmamay-ari sa parehong bahagi ng parirala. Ang “mga kapatid na lalaki” ay tumutugma sa panlalaking maramihang ἀδελφοί nang hindi nagpapasiya sa mas huling pagtatalong teolohikal tungkol sa tiyak nilang kaugnayan kay Jesus.
- source_word: εἱστήκεισαν ἔξω
  choice: nakatayo sa labas
  rationale: Inihahatid ng “nakatayo” ang nagpapatuloy na kalagayang ipinahahayag ng anyong stative, at hindi dinaragdagan ang “sa labas” ng isang lugar na hindi tahasang binanggit.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: nais siyang makausap
  rationale: Natural na Tagalog ito para sa may-layuning hangaring makipag-usap na ipinahahayag ng ζητοῦντες at ng infinitive, nang hindi labis na ipinahihiwatig na nahihirapan silang lumapit.
theological_decisions:
- issue: Ang kahulugan ng ἀδελφοί kaugnay ng pamilya ni Jesus
  choice: mga kapatid na lalaki
  alternative: mga kapatid; malalapit na kamag-anak
  rationale: Panlalaking maramihan ang anyong Griyego at sa ibabaw ng salaysay ay pinakanatural itong isaling “mga kapatid na lalaki.” Hindi ginagamit ng salin ang talata upang pagpasyahan kung sila ay likas na kapatid, ibang uri ng kapatid, o malalapit na kamag-anak; pinananatili ng talababa ang tunay na saklaw ng terminong Griyego.
translation_notes:
  register: Makabago at marangal na Tagalog ang ginamit. Pinanatili ang pantawag-pansing “narito” at ang bilang na maramihan sa “mga pulutong ng tao,” habang ginawang natural ang layuning makipag-usap sa pariralang “nais siyang makausap.”
