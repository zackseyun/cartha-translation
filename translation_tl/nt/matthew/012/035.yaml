  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: tl
  text: Ang mabuting tao ay naglalabas ng mabubuting bagay[a] mula sa mabuti niyang kayamanan, at ang masamang tao ay naglalabas ng masasamang bagay mula sa masama niyang kayamanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang agarang konteksto ay tungkol sa pananalita, kaya maaaring lalo itong tumukoy sa mabubuti at masasamang salita.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθός / ἀγαθά
  choice: mabuti / mabubuting bagay
  rationale: Pinanatili ang pag-uulit at ang malinaw na moral na paghahambing sa Griyego. Ginawang tahasan ang ipinahihiwatig na pangngalan sa neuter plural na ἀγαθά sa pamamagitan ng “mabubuting bagay.”
- source_word: ἄνθρωπος
  choice: tao
  rationale: Ang “tao” ang natural at malawak na katumbas sa Tagalog para sa kinatawang indibidwal sa kasabihang ito; hindi nito kailangang tukuyin ang kasarian kahit masculine singular ang anyong gramatikal sa Griyego.
- source_word: θησαυρός
  choice: kayamanan
  rationale: Pinananatili ng “kayamanan” ang talinghaga ng mahalagang nakaimbak na pinagmumulan ng inilalabas ng tao. Ang “imbakan” ay posible ngunit masyadong kongkreto at mekanikal sa kontekstong ito.
- source_word: ἐκβάλλει
  choice: naglalabas
  rationale: Likas sa Tagalog ang “naglalabas” at pinananatili nito ang larawan ng paglalabas mula sa isang panloob na kayamanan, sa halip na gawing payak na “gumagawa.”
- source_word: πονηρός / πονηρά
  choice: masama / masasamang bagay
  rationale: Ang “masama” ang natural na katawagang moral na katapat ng “mabuti” sa Tagalog. Pinanatili rin ang magkatimbang na anyo ng dalawang sugnay.
- source_word: ἐκ
  choice: mula sa
  rationale: Malinaw na ipinapahayag ng “mula sa” ang pinagmulan ng inilalabas at natural itong kaugnay ng pandiwang “naglalabas.”
theological_decisions:
- issue: Saklaw ng “mabubuting bagay” at “masasamang bagay”
  choice: Pinanatili sa pangunahing teksto ang malawak na pananalita ng Griyego.
  alternative: Tahasang isalin bilang “mabubuting salita” at “masasamang salita.”
  rationale: Tungkol sa pananalita ang agarang konteksto, ngunit walang tahasang pangngalang “salita” sa talata. Kaya hindi nilimitahan ang kahulugan sa pangunahing teksto, at ipinaliwanag na lamang sa talababa ang diin ng konteksto.
- issue: Moral na bukal ng panlabas na bunga
  choice: Inilalarawan ng talata na ang inilalabas ng tao ay nagmumula sa kanyang panloob na moral na kayamanan.
  alternative: Iugnay ito nang tahasan sa isang mas malawak na sistemang doktrinal tungkol sa kalikasan o pagbabagong-loob ng tao.
  rationale: Sapat na pinananatili ng salin ang talinghaga at moral na paghahambing ng teksto nang hindi nagdaragdag ng doktrinang hindi tahasang sinasabi sa talata.
translation_notes:
  register: Gumamit ng makabagong, malinaw, at marangal na Tagalog. Ang balanseng pag-uulit ng “mabuti” at “masama” ay sadyang pinanatili upang maipakita ang paralelismo ng Griyego. Ang “tao” ay natural na hindi tiyak sa kasarian sa Tagalog, kaya hindi kailangan ang hiwalay na talababa tungkol sa masculine singular ng ἄνθρωπος.
