  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: tl
  text: 'upang matupad ang sinabi sa pamamagitan ni propeta Isaias, na nagsabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na panandang Filipino para sa layunin o kinalabasan; pinananatili nito ang puwang ng Griyego sa dalawang ugnayang iyon.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Karaniwang salin sa pormula ng katuparan sa Mateo at angkop sa aorist passive subjunctive kasunod ng ἵνα.
- source_word: τὸ ῥηθὲν
  choice: ang sinabi
  rationale: Natural at maikli sa Filipino, habang pinananatili ang di-tiyak na tinutukoy ng substantival participle.
- source_word: διὰ
  choice: sa pamamagitan ni
  rationale: Ipinahahayag ang tagapamagitang papel ni Isaias sa halip na ituring siyang pinakahuling pinagmulan ng mensahe.
- source_word: Ἠσαΐου
  choice: Isaias
  rationale: Nakaugaliang anyo ng pangalan ng propeta sa Bibliyang Filipino.
- source_word: τοῦ προφήτου
  choice: propeta
  rationale: Tahasang pinananatili ang pagkakakilanlan kay Isaias na nasa tekstong Griyego.
- source_word: λέγοντος
  choice: ':'
  rationale: Sa natural na Filipino, sapat ang tutuldok upang ipakilala ang siping kasunod; ang tahasang “na nagsasabi” ay magiging mabigat at maaaring magbigay ng di-likas na pakahulugan sa tagapagsalita.
theological_decisions:
- issue: Pamamagitan ng propeta sa pormula ng pagsipi
  choice: sa pamamagitan ni propeta Isaias
  alternative: ayon kay propeta Isaias / sinabi ni propeta Isaias
  rationale: Pinananatili nito ang διά na may genitive bilang tagapamagitang ahensiya, nang hindi ipinapalagay na si Isaias ang pinakahuling pinagmulan ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Isaias,” ang nakaugaliang anyong Filipino ng pangalan, at tutuldok upang natural na ipakilala ang sipi sa susunod na talata.
