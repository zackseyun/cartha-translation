id: MAT.12.42
reference: Matthew 12:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: tl
  text: Sa paghuhukom, babangon ang reyna ng Timog[b] kasama ng henerasyong ito at hahatulan niya ito, sapagkat dumating siya mula sa mga dulo ng daigdig upang pakinggan ang karunungan ni Solomon. At masdan, narito ang isang bagay na higit kaysa kay Solomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “narito ang isang higit kaysa kay Solomon.” Neuter ang anyo ng salitang Griyego (“isang bagay na higit”), na maaaring magbigay-diin sa nakahihigit na kadakilaang naroroon kay Jesus at sa kaniyang gawain.
    reason: alternative_reading
  - marker: b
    text: Ang “reyna ng Timog” ay tumutukoy sa reyna ng Sheba (1 Hari 10:1–13; 2 Cronica 9:1–12), bagaman hindi tahasang binabanggit sa Griyego ang Sheba.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: ang reyna ng Timog
  rationale: Pinananatili ang heograpikong katawagang nasa Griyego at hindi ipinapasok sa pangunahing teksto ang interpretibong pangalang 'reyna ng Sheba.'
- source_word: ἐγερθήσεται ἐν τῇ κρίσει
  choice: Sa paghuhukom, babangon
  rationale: Ang 'babangon' ay natural sa Filipino at pinananatili ang maaaring pahiwatig ng muling pagkabuhay at pagtindig bilang saksi sa tiyak na paghuhukom.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: kasama ng salinlahing ito
  rationale: Pinananatili ang karaniwang kahulugan ng μετά na 'kasama'; ang salungatang diwa ay malinaw na sa kasunod na pandiwang 'hahatulan.'
- source_word: κατακρινεῖ αὐτήν
  choice: hahatulan niya ito
  rationale: Tumutukoy ang panghalip sa 'salinlahing ito.' Sa konteksto, ang 'hahatulan' ay nagpapahayag ng paghatol na laban dito nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: mula pa sa mga dulo ng daigdig
  rationale: Likas na idyomang Filipino para sa napakalayong pinagmulan; idinidiin ng 'pa' ang layo nang hindi binabago ang kahulugan.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: upang pakinggan ang karunungan ni Solomon
  rationale: Ipinahahayag ng 'upang' ang layunin ng pagpunta, at mas natural ang 'pakinggan' kaysa literal na 'marinig' para sa sinasadyang pakikinig.
- source_word: ἰδοὺ
  choice: masdan
  rationale: Isang marangal at nauunawaang panawag-pansin na nagpapanatili sa mariing puwersa ng Griyego.
- source_word: πλεῖον Σολομῶνος
  choice: isang bagay na higit kaysa kay Solomon
  rationale: Pinananatili ang neuter na anyo ng πλεῖον at hindi agad nilulutas bilang tuwirang panlalaking katauhan, bagaman si Jesus at ang kaniyang gawain ang tinutukoy sa konteksto.
- source_word: ὧδε
  choice: narito
  rationale: Maikli at natural na katumbas ng 'is here' na angkop sa mariing pahayag.
theological_decisions:
- issue: Ang pagtukoy ng neuter comparative na πλεῖον kaugnay ni Jesus
  choice: isang bagay na higit kaysa kay Solomon
  alternative: isang higit kaysa kay Solomon
  rationale: Pinananatili ng pangunahing salin ang gramatikal na neuter at ang lawak ng pahayag tungkol sa nakahihigit na realidad na naroroon kay Jesus at sa kaniyang gawain. Ang alternatibo ay mas tuwirang personal ngunit mas interpretibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'salinlahi,' 'paghuhukom,' at 'masdan' upang mapanatili ang solemne at biblikal na himig nang hindi nagiging lipas o labis na teknikal.
