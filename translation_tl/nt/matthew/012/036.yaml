  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: tl
  text: Ngunit sinasabi ko sa inyo na sa araw ng paghuhukom, mananagot ang mga tao dahil sa bawat salitang walang kabuluhan[a] na kanilang sasabihin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “salitang walang silbi,” “salitang walang bunga,” o “pabayang salita.” Ang salitang Griyego ay maaaring mangahulugang walang silbi, walang bunga, o pabaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ngunit sinasabi ko sa inyo
  rationale: Ang δέ ay bahagyang panalungat sa naunang konteksto, kaya likas ang “Ngunit”; pinananatili ng “sinasabi ko sa inyo” ang kasalukuyang anyo at tuwirang pakikipag-usap.
- source_word: πᾶν ῥῆμα
  choice: bawat salita
  rationale: Distributibo ang πᾶν kasama ng pangngalang isahan. Sa konteksto, ang ῥῆμα ay binigkas na salita o pahayag; natural at sapat na tiyak ang “salita.”
- source_word: ἀργὸν
  choice: walang kabuluhan
  rationale: Maaaring mangahulugan ang ἀργός na walang ginagawa, walang bunga, o walang pakinabang. Ang “walang kabuluhan” ay dignido at nauunawaan, habang hindi nililimitahan ang diwa sa simpleng pagkakamali o tahasang masamang pananalita.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: na sasabihin ng mga tao
  rationale: Pinananatili ng “sasabihin” ang panghinaharap na λαλήσουσιν, at inilalahad ng “mga tao” ang pangkalahatang saklaw ng οἱ ἄνθρωποι nang hindi ito nililimitahan sa mga lalaki.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: mananagot sila para rito
  rationale: Ang pariralang Griyego ay idyoma para sa pagbibigay-sulit tungkol sa isang bagay. Likas sa modernong Tagalog ang “mananagot ... para rito” at malinaw nitong pinananatili ang pagtukoy ng αὐτοῦ sa bawat salitang binanggit.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: sa araw ng paghuhukom
  rationale: Ang κρίσις ay hudisyal na paghatol; ang “araw ng paghuhukom” ay malinaw, natural, at kinikilalang katumbas sa Tagalog.
theological_decisions:
- issue: Lakas ng moral na diwa ng ἀργόν
  choice: walang kabuluhan
  alternative: pabaya; walang saysay; walang bunga
  rationale: Pinananatili ng salin ang lawak ng salitang Griyego at ang bigat ng pananagutan sa paghuhukom, ngunit hindi nito ipinapalagay na ang tinutukoy ay tahasang mapanirang pananalita lamang.
- issue: Pangkalahatang saklaw ng οἱ ἄνθρωποι
  choice: mga tao
  alternative: mga lalaki; sangkatauhan
  rationale: Pangkalahatan ang tinutukoy ng Griyego at hindi partikular sa kasariang lalaki.
- issue: Indibiduwal na pananagutan sa bawat salita
  choice: Sa bawat ... mananagot sila para rito
  alternative: magbibigay sila ng ulat tungkol dito
  rationale: Ang “mananagot” ay natural na Tagalog para sa idyomang ἀποδίδωμι λόγον at pinananatili ang hudisyal na bigat nang hindi nagdaragdag kung kanino ibibigay ang pagsusulit.
translation_notes:
  register: Modernong Filipino Tagalog na dignido at madaling maunawaan. Ginamit ang “mananagot” sa halip na mas literal ngunit di-likas na “magbibigay ng ulat,” at pinanatili sa talababa ang tunay na lawak ng ἀργός.
