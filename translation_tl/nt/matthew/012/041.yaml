id: MAT.12.41
reference: Matthew 12:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: tl
  text: Sa paghuhukom, babangon ang mga lalaking taga-Nineve kasama ng salinlahing ito at kokondenahin nila ang salinlahing ito, sapagkat nagsisi sila bilang tugon sa pangangaral ni Jonas.[a] At masdan, narito ang higit kaysa kay Jonas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dahil sa pangangaral ni Jonas.”
    reason: lexical_alternative
  - marker: b
    text: O, “narito ang isang higit na dakila kaysa kay Jonas.” Neuter ang anyo ng pananalita sa Griyego, na literal na “isang bagay na higit,” at maaaring magbigay-diin sa higit na realidad na narito, hindi lamang sa paghahambing ng dalawang tao.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: ang mga lalaking taga-Nineve
  rationale: Pinananatili ang tahasang panlalaking ἄνδρες, habang ang “taga-Nineve” ay likas na Filipino para sa Νινευῖται.
- source_word: ἀναστήσονται
  choice: babangon
  rationale: Pinananatili ang malinaw na larawan ng pagbangon at ang posibleng pahiwatig ng muling pagkabuhay sa konteksto ng panghuling paghuhukom.
- source_word: ἐν τῇ κρίσει
  choice: sa paghuhukom
  rationale: Tuwirang tumutukoy sa pangyayaring hudisyal at eskatolohikal nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: kasama ng salinlahing ito
  rationale: Pinananatili ang karaniwang kahulugan ng μετά na may genitive bilang “kasama”; ang pagsalungat ay malinaw sa kasunod na paghatol.
- source_word: κατακρινοῦσιν αὐτήν
  choice: hahatulan nila itong nagkasala
  rationale: Ipinapahayag ang hatol na nagpaparusa o kumokondena, hindi lamang ang neutral na pagsusuri; ang “ito” ay malinaw na tumutukoy sa salinlahing nabanggit.
- source_word: μετενόησαν
  choice: nagsisi sila
  rationale: Ang “nagsisi” ang natural at matatag na salin ng μετανοέω sa konteksto ng pagtugon sa pahayag ng propeta.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: bilang tugon sa pangangaral ni Jonas
  rationale: Malinaw na inilalahad ang tugong ipinahihiwatig ng εἰς kasunod ng μετανοέω, habang pinananatili ang κήρυγμα bilang “pangangaral.”
- source_word: ἰδοὺ
  choice: masdan
  rationale: Pinananatili ang maringal at mapagdiing pantawag-pansin ng ἰδού.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: narito ang higit kaysa kay Jonas
  rationale: Ang “ang higit” ay hindi sapilitang nagtatakda kung tao lamang o mas malawak na realidad ang tinutukoy, kaya naipagsasanggalang ang neuter at sadyang maluwag na pananalita ng Griyego.
theological_decisions:
- issue: Kung ang πλεῖον Ἰωνᾶ ay isasalin bilang isang taong higit kay Jonas o bilang mas malawak na higit na realidad
  choice: narito ang higit kaysa kay Jonas
  alternative: narito ang isang higit na dakila kaysa kay Jonas
  rationale: Hindi tahasang panlalaki ang Griyegong πλεῖον kundi neuter. Ang piniling salin ay hindi naglilimita sa paghahambing sa pagkatao lamang ni Jesus, ngunit hindi rin ikinakaila na sa kanya at sa kanyang gawain tumutukoy ang pahayag.
- issue: Kung pananatilihin ang tahasang kasarian ng ἄνδρες
  choice: mga lalaking taga-Nineve
  alternative: mga taga-Nineve
  rationale: Tahasang ginagamit ng Griyego ang ἄνδρες, kaya pinananatili ang “mga lalaki” sa halip na gawing pangkalahatang “mga tao.”
- issue: Lakas ng κατακρίνω sa hatol ng mga taga-Nineve
  choice: hahatulan nila itong nagkasala
  alternative: hahatulan nila ang salinlahing ito
  rationale: Ang κατακρίνω ay hatol na kumokondena, kaya nilinaw ang diwa ng pagkakasala nang hindi tinutukoy ang uri o kaparusahan nito.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “salinlahi,” “paghuhukom,” at “masdan” upang mapanatili ang solemneng tono, ngunit inayos ang pangungusap sa likas na pagkakasunod sa Filipino. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa kani-kanilang talababa.
