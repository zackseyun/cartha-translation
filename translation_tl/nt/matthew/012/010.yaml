revisions:
- from: At naroon nga ang isang lalaking tuyot ang isang kamay. Tinanong nila siya, “Naaayon ba sa Kautusan ang magpagaling sa mga Sabbath[a]?” Sinabi nila ito upang maparatangan siya.
  to: At naroon ang isang lalaking may tuyot na kamay. Tinanong nila siya, “Pinahihintulutan ba ng Kautusan ang magpagaling sa mga Sabbath[a]?” upang maakusahan nila siya.
  rationale: Inayos ang Tagalog upang maging mas natural at upang malinaw na maipahayag ang layunin ng mga nagtatanong na akusahan si Jesus. Napanatili ang pansin-tawag na daloy ng ἰδού sa "At naroon," ang plural na "mga Sabbath," at ang legal na puwersa ng ἔξεστι sa pamamagitan ng "Pinahihintulutan ba ng Kautusan."
