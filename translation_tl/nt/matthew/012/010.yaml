  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: tl
  text: At naroon ang isang lalaking may tuyot na kamay. Tinanong nila siya, “Pinahihintulutan ba ng Kautusan ang magpagaling sa mga Sabbath[a]?” upang maakusahan nila siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapag Sabbath.” Maramihan sa Griyego ang “mga Sabbath,” isang karaniwang paraan ng pagtukoy sa mga araw ng Sabbath.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: naroon nga
  rationale: Ginagamit bilang natural na panandang pasalaysay na tumatawag ng pansin sa biglang paglitaw ng lalaki sa tagpo, nang hindi gumagamit ng makaluma at di-likas na “masdan.”
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy rito sa isang partikular na lalaking nasa sinagoga, hindi sa sangkatauhan sa pangkalahatan.
- source_word: χεῖρα ἔχων ξηράν
  choice: tuyot ang isang kamay
  rationale: Likas at maikli itong paglalarawan sa kamay na nanlumo, nangayayat, o hindi na normal na nagagamit, nang hindi labis na tinutukoy ang eksaktong kondisyong medikal.
- source_word: ἐπηρώτησαν αὐτόν
  choice: Tinanong nila siya
  rationale: Tuwirang salin ng pandiwa; ang masamang layunin ng pagtatanong ay malinaw na inilalahad sa hulihan ng talata.
- source_word: ἔξεστι
  choice: Naaayon ba sa Kautusan
  rationale: Ipinakikita na ang tanong ay tungkol sa legal at relihiyosong pagpapahintulot, hindi lamang sa karaniwang pahintulot.
- source_word: τοῖς σάββασιν
  choice: sa mga Sabbath
  rationale: Pinananatili sa pangunahing teksto ang anyong maramihan ng Griyego, bagaman karaniwang isahan ang mas idyomatikong gamit sa Tagalog.
- source_word: θεραπεύειν
  choice: magpagaling
  rationale: Natural na pandiwa sa konteksto ng mga pagpapagaling ni Jesus at hindi nagdaragdag ng tiyak na paraang medikal.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: upang maparatangan siya
  rationale: Pinananatili ang layuning ipinahihiwatig ng ἵνα at ang mapanumbat o legal na diwa ng κατηγορέω.
theological_decisions:
- issue: Anyong maramihan ng Sabbath sa isang usaping may kinalaman sa Kautusan
  choice: sa mga Sabbath
  alternative: kapag Sabbath / sa Sabbath
  rationale: Maramihan ang τοῖς σάββασιν sa Griyego at maaari itong tumukoy sa mga araw ng Sabbath sa pangkalahatan. Pinanatili ang maramihan sa teksto at inilagay sa talababa ang mas idyomatikong alternatibo upang hindi palihim na gawing isahan ang pinagmulan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “naroon nga” upang mapanatili ang pansin-tawag na tungkulin ng ἰδού nang hindi nagiging makaluma. Hiniwalay sa sariling pangungusap ang layunin ng mga nagtatanong upang maging malinaw at natural sa Tagalog, habang pinananatili ang kaugnayang lohikal nito sa tanong.
