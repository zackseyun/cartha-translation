  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: tl
  text: Hindi niya babaliin ang tambo na napinsala, at hindi niya papatayin ang mitsang umuusok[a], hanggang sa dalhin niya sa tagumpay ang katarungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “linong umuusok”; tumutukoy ito sa linong ginagamit na mitsa ng ilawan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hanggang sa dalhin niya sa tagumpay ang hatol.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: tambong may lamat
  rationale: Ang κάλαμος ay tambo, at ang συντετριμμένον ay tumutukoy sa napinsala o nadurog. Ang “may lamat” ay likas sa Filipino at nagpapakitang mahina at napinsala na ang tambo ngunit hindi pa lubusang bali, kaya may saysay ang kasunod na “hindi niya babaliin.”
- source_word: οὐ κατεάξει
  choice: hindi niya babaliin
  rationale: Tuwirang ipinahahayag ng κατάγνυμι ang pagbali o pagputol. Ang “babaliin” ay malinaw at likas sa larawan ng tambo.
- source_word: λίνον τυφόμενον
  choice: mitsang umuusok
  rationale: Literal na flax o lino ang λίνον, ngunit dito ay tumutukoy ito sa mitsang yari sa lino. Ang τυφόμενον ay nagsasaad na umuusok ito, gaya ng mitsang halos mamatay na.
- source_word: οὐ σβέσει
  choice: hindi niya papatayin
  rationale: Sa Filipino, karaniwang “patayin” ang apoy o mitsa. Likas at malinaw itong katumbas ng σβέννυμι sa larawang ito.
- source_word: ἕως ἂν
  choice: hanggang sa
  rationale: Pinananatili nito ang panahong hangganan at ang inaasahang katuparan ng kasunod na kilos.
- source_word: ἐκβάλῃ εἰς νῖκος
  choice: dalhin niya sa tagumpay
  rationale: Ipinahahayag ng parirala ang pagdadala sa isang matagumpay na kinalabasan. Ang salin ay likas sa Filipino at pinananatili ang tunguhing ipinahihiwatig ng εἰς.
- source_word: τὴν κρίσιν
  choice: ang katarungan
  rationale: Sa konteksto ng sipi mula sa Isaias, ang κρίσις ay tumutukoy sa pagpapairal ng matuwid na kaayusan, hindi lamang sa pagbigkas ng isang hatol. Gayunman, pinananatili sa talababa ang lehitimong kahulugang “hatol.”
theological_decisions:
- issue: Kahulugan ng κρίσις sa sipi tungkol sa Lingkod
  choice: katarungan
  alternative: hatol
  rationale: Masaklaw na ipinahahayag ng “katarungan” ang gawain ng Lingkod na magpairal ng matuwid na kaayusan. Hindi nito nililimitahan ang salita sa isang pasiyang panghukuman, habang kinikilala sa talababa ang tunay na alternatibong “hatol.”
- issue: Antas ng pagiging literal sa larawan ng λίνον
  choice: mitsa
  alternative: lino
  rationale: Ang bagay na tinutukoy ay mitsang yari sa lino. Mas madaling maunawaan ng makabagong mambabasa ang “mitsa,” samantalang inilalahad sa talababa ang literal na materyal upang manatiling nasusuri ang salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tambong may lamat” upang ilarawan ang napinsala ngunit hindi pa lubusang baling tambo, at “mitsang umuusok” upang mapanatili ang konkretong larawan ng tekstong Griyego.
