id: MAT.12.30
reference: Matthew 12:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: tl
  text: Ang hindi panig sa akin ay laban sa akin, at ang hindi nagtitipong kasama ko ay nagkakalat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang sinumang hindi kasama ko ay laban sa akin, at ang sinumang hindi nagtitipong kasama ko ay nagkakalat.”
    reason: Ipinapakita ang mas literal na paraan ng pagsasalin sa generic na substantival participle at sa μετ’ ἐμοῦ, bagaman hindi gaanong natural sa Tagalog ang unang “kasama ko.”
lexical_decisions:
- source_word: ὁ μὴ ὢν μετ’ ἐμοῦ
  choice: ang hindi panig sa akin
  rationale: Ang artikulo at participle ay tumutukoy sa sinumang inilalarawan ng kawalan ng pakikiisa kay Jesus. Mas natural sa modernong Tagalog ang “hindi panig sa akin” kaysa sa literal ngunit alanganing “hindi kasama ko,” habang pinananatili ang diwa ng pakikiugnay at pagpanig.
- source_word: κατ’ ἐμοῦ
  choice: laban sa akin
  rationale: Malinaw nitong ipinahahayag ang pagsalungat na tinutukoy ng κατά na may genitive at pinananatili ang matinding pagtatapat ng dalawang panig.
- source_word: ὁ μὴ συνάγων μετ’ ἐμοῦ
  choice: ang hindi nagtitipong kasama ko
  rationale: Pinananatili ng “nagtitipon” ang pangkalahatang larawan ng pagtipon nang hindi nililimitahan kung tao, kawan, o ani ang tinutukoy; ang “kasama ko” ay nagpapanatili sa asosasyong ipinahahayag ng μετά.
- source_word: σκορπίζει
  choice: nagkakalat
  rationale: Likas itong katapat ng “nagtitipon” sa Tagalog at pinananatili ang antitetikong paralelismo ng Griyego.
- source_word: καὶ
  choice: at
  rationale: Additibo ang pang-ugnay at nagdurugtong sa dalawang magkatulad na pahayag; hindi kailangang gawing pasalungat na “ngunit.”
theological_decisions:
- issue: Ganap na pagtatapat ng pagpanig o pagsalungat kay Jesus
  choice: Pinanatili ang tuwirang pahayag na ang hindi panig kay Jesus ay laban sa kanya.
  alternative: Palambutin ito bilang pangkalahatang paanyaya lamang na makiisa kay Jesus.
  rationale: Walang pananalitang nagpapaluwag sa matinding dalawang-panig na pahayag ng Griyego. Pinananatili ng salin ang tensiyong ito nang hindi nagdaragdag ng konklusyong doktrinal.
- issue: Larawan ng pagtipon at pagkakalat
  choice: Ginamit ang pangkalahatang “nagtitipon” at “nagkakalat.”
  alternative: Tukuyin ang bagay na tinitipon bilang mga tao, kawan, o ani.
  rationale: Hindi tahasang sinasabi sa talata ang layon ng mga pandiwa, kaya hindi ito tinukoy upang mapanatili ang tunay na kalabuan at lawak ng larawan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “panig sa akin” sa unang sugnay para sa natural na pahayag ng pakikiisa, ngunit iniwang “kasama ko” sa ikalawa upang mapanatili ang larawan ng sama-samang pagtipon. Ang panandang [a] ay nasa pangunahing teksto at may katumbas na talababa.
