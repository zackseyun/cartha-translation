  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: tl
  text: Kapag naman lumabas mula sa isang tao ang maruming espiritu, nagdaraan ito sa mga lugar na walang tubig[a], naghahanap ng kapahingahan, ngunit wala itong matagpuang kapahingahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tuyong lugar.” Literal sa Griyego, “mga lugar na walang tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Kapag naman
  rationale: Ang “kapag” ay likas na nagpapahayag ng pangkalahatang kondisyong temporal, at ang “naman” ay banayad na nagdadala ng transisyunal na puwersa ng δέ nang hindi ginagawang tahasang pagsalungat.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: ang maruming espiritu
  rationale: Pinananatili nito ang tahasang “espiritu” ng Griyego at ang kaugnayan ng ἀκάθαρτος sa karumihan; hindi ito pinapalitan ng mas interpretatibong “demonyo.”
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: lumabas mula sa isang tao
  rationale: Ang pangkasalukuyang anyong “lumabas” pagkatapos ng “kapag” ay natural para sa pangkalahatang kondisyon. Ang “isang tao” ay malinaw at likas sa Filipino para sa taong inilalarawan sa kasabihan.
- source_word: διέρχεται
  choice: nagdaraan ito
  rationale: Ipinapahayag ang patuloy na paggalaw sa mga lugar nang hindi nagdaragdag ng ideya ng tiyak na destinasyon.
- source_word: δι’ ἀνύδρων τόπων
  choice: sa mga lugar na walang tubig
  rationale: Malapit itong sumusunod sa konkretong kahulugan ng ἄνυδρος, “walang tubig,” habang inilalagay sa talababa ang likas na alternatibong “mga tuyong lugar.”
- source_word: ζητοῦν ἀνάπαυσιν
  choice: naghahanap ng kapahingahan
  rationale: Pinananatili ang kasabay at may-layuning paghahanap, at ang “kapahingahan” ay tuwirang katumbas ng ἀνάπαυσις nang gawing “pahingahang lugar” ang di-tiyak na pangngalan.
- source_word: καὶ οὐχ εὑρίσκει
  choice: at hindi ito nakatatagpo niyon
  rationale: Pinananatili ang payak na pang-ugnay na καί at natural na tinutukoy ng “niyon” ang kapahingahang hinahanap, na ipinahihiwatig lamang bilang layon sa Griyego.
theological_decisions:
- issue: Paglalarawan sa πνεῦμα sa konteksto ng pagpapalayas ng masasamang espiritu
  choice: espiritu
  alternative: demonyo
  rationale: Bagaman masamang personal na espiritu ang tinutukoy sa konteksto, “maruming espiritu” ang mismong pananalita ng Griyego. Pinananatili nito ang anyo at teolohikal na pahiwatig ng pinagmulan nang hindi ito ginagawang mas tiyak kaysa sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naman” bilang banayad na panandang transisyon; iniwasan ang mas teknikal o denominasyonal na pananalita. Inilagay ang talababa pagkatapos ng pariralang aktuwal nitong nililinaw.
