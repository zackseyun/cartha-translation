  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: tl
  text: Sapagkat batay sa mga salita mo, pawawalang-sala ka[a], at batay sa mga salita mo, hahatulan kang may sala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipahahayag kang matuwid” o “mapatutunayang nasa tama ka.” Ang pandiwang Griyego ay maaaring tumukoy sa isang pasiyang panghukuman na nagpapahayag na ang isang tao ay nasa tama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: batay sa
  rationale: Sa dalawang sugnay, ipinahihiwatig ng ἐκ ang batayan o ebidensiyang ginagamit sa paghatol. Likas sa modernong Tagalog ang “batay sa” at malinaw nitong napapanatili ang diwang panghukuman.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o dahilan kaugnay ng naunang babala tungkol sa pananalita. Pinananatili ng “Sapagkat” ang ugnayang ito nang hindi dinaragdagan ang kahulugan.
- source_word: λόγων
  choice: mga salita
  rationale: Tumutukoy rito ang maramihang λόγων sa mga binigkas ng isang tao. Tuwiran at natural ang “mga salita,” at napapanatili nito ang pag-uulit at paralelismo ng Griyego.
- source_word: σου
  choice: mo
  rationale: Ang panghalip ay paari at tuwirang kaugnay ng “mga salita” sa dalawang sugnay.
- source_word: δικαιωθήσῃ
  choice: pawawalang-sala ka
  rationale: 'Sa konteksto ng paghuhukom at sa tahasang pagsalungat nito sa καταδικασθήσῃ, panghukuman ang diwa ng pandiwa: pagpapahayag na ang isang tao ay nasa tama o walang sala. Malinaw at natural sa Tagalog ang “pawawalang-sala,” habang inilalahad sa talababa ang iba pang posibleng himig ng salita.'
- source_word: καταδικασθήσῃ
  choice: hahatulan kang may sala
  rationale: Panghukuman ang καταδικάζω at sadyang kasalungat ng δικαιόω. Ang “hahatulan kang may sala” ay malinaw na nagpapahayag ng hatol ng pagkakasala nang hindi ito pinaliliit sa kaparusahan lamang.
theological_decisions:
- issue: Panghukuman na diwa ng δικαιόω kaugnay ng mga salita at paghuhukom
  choice: Isinalin bilang “pawawalang-sala ka,” na nagpapahiwatig ng paborableng hatol batay sa mga salita bilang ebidensiya.
  alternative: “ipahahayag kang matuwid” o “mapatutunayang nasa tama ka”
  rationale: Ginagawang malinaw ng katapat na “hahatulan kang may sala” ang tagpong panghukuman. Hindi ipinapasok ng salin ang isang mas malawak na sistemang doktrinal tungkol sa pagpapawalang-sala; pinananatili lamang nito ang pahayag ng talata at ang posibleng saklaw ng pandiwang Griyego sa pamamagitan ng talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang simetrikong “batay sa mga salita mo” upang mapanatili ang pag-uulit at diin ng Griyego, at ang magkatapat na pariralang panghukuman upang luminaw ang antitesis.
