id: MAT.12.25
reference: Matthew 12:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: tl
  text: Ngunit, alam ni Jesus ang kanilang mga iniisip[a], at sinabi niya sa kanila, “Ang bawat kahariang nahahati laban sa sarili nito ay nagiging tiwangwang[b], at ang bawat lungsod o sambahayan[c] na nahahati laban sa sarili nito ay hindi mananatiling matatag.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pangangatwiran” o “mga balak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nauuwi sa pagkawasak” o “napapariwara.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bahay”; ang salitang Griyego ay maaaring tumukoy sa bahay o sa sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: alam
  rationale: Ipinapahayag nito ang kaalaman ni Jesus nang hindi ipinapaliwanag kung paano niya nalaman, gaya ng pagiging bukas ng tekstong Griyego sa usaping iyon.
- source_word: δὲ
  choice: Ngunit
  rationale: Minamarkahan ng δέ ang banayad na pagsalungat o paglipat mula sa paratang ng mga Fariseo tungo sa tugon ni Jesus.
- source_word: ἐνθυμήσεις
  choice: mga iniisip
  rationale: Natural ito sa modernong Tagalog at maaaring sumaklaw sa mga kaisipan, pangangatwiran, o panloob na balak.
- source_word: Πᾶσα βασιλεία
  choice: Bawat kaharian
  rationale: Pinananatili nito ang pangkalahatang prinsipyong ipinahahayag ng pangungusap.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: nagkakabaha-bahagi
  rationale: Likas na idyomang Tagalog ito para sa pagkakahati-hating panloob na naglalabanan, nang hindi kailangang ulitin ang mabigat na pariralang 'laban sa sarili nito.'
- source_word: ἐρημοῦται
  choice: mawawasak
  rationale: Malinaw at natural na ipinahahayag nito ang kalubhaan ng pagkatiwangwang o pagkagiba na tinutukoy ng pandiwa.
- source_word: πόλις ἢ οἰκία
  choice: lungsod o sambahayan
  rationale: Ang πόλις ay 'lungsod'; ang οἰκία rito ay maaaring bahay o sambahayan. Mas malinaw ang 'sambahayan' bilang pangkat na maaaring magkaroon ng panloob na pagkakahati, habang itinatala sa talababa ang literal na alternatibo.
- source_word: οὐ σταθήσεται
  choice: hindi mananatili
  rationale: Ipinahahayag nito ang idyomatikong diwa ng hindi makatatagal o hindi mananatiling buo at matatag.
theological_decisions:
- issue: Paraan ng pagkaalam ni Jesus sa kanilang mga iniisip
  choice: Sabihing alam ni Jesus ang kanilang mga iniisip nang hindi tinutukoy ang paraan ng pagkaalam.
  alternative: Tukuyin itong sobrenatural na kaalaman o, sa kabilang banda, paghihinuha lamang mula sa sitwasyon.
  rationale: Sinasabi ng talata na alam niya ang kanilang mga iniisip, ngunit hindi nito ipinaliliwanag kung paano; pinananatili ng salin ang ganitong pagiging bukas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'nagkakabaha-bahagi' upang maging natural ang kasabihan at ang 'sambahayan' upang malinaw ang panloob na pagkakahating tinutukoy, habang pinananatili sa talababa ang literal na 'bahay.'
