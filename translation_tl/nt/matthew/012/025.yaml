  naturalness: Natural at marangal ang rebisyong Tagalog. Ang “nahahati laban sa sarili nito” ay malinaw na modernong pananalita para sa panloob na pagkakawatak-watak; ang “nagiging tiwangwang” ay angkop sa matalinghagang, pampublikong rehistrong biblikal.
