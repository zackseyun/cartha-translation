  to: Ngunit, alam ni Jesus ang kanilang mga iniisip[a], at sinabi niya sa kanila, “Ang bawat kahariang nahahati laban sa sarili nito ay nagiging tiwangwang[b], at ang bawat lungsod o sambahayan[c] na nahahati laban sa sarili nito ay hindi mananatiling matatag.”
