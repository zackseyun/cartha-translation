  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: tl
  text: Pagkaalis niya roon, pumunta siya sa kanilang sinagoga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Hindi isinalin nang hiwalay
  rationale: Sa modernong Tagalog, sapat nang ipinahihiwatig ng “Pagkaalis” ang pagkakaugnay at pagsunod ng pangyayaring ito sa naunang salaysay; ang pagdaragdag ng “At” ay magiging mabigat at di-likas.
- source_word: μεταβὰς ἐκεῖθεν
  choice: Pagkaalis niya roon
  rationale: Likas na Tagalog na nagpapahayag ng naunang kilos at paglayo mula sa dating lugar, habang pinananatili ang ugnayan ng participle sa pangunahing pandiwa.
- source_word: ἦλθεν
  choice: pumunta siya
  rationale: Bagaman maaaring mangahulugang “dumating” o “pumaroon” ang ἔρχομαι, ang “pumunta” ang natural na salaysay ng pagkilos mula sa naunang lugar patungo sa bago.
- source_word: εἰς τὴν συναγωγὴν
  choice: sa ... sinagoga
  rationale: Sa Tagalog, karaniwang saklaw ng “sa” ang pagpunta patungo at papasok sa isang lugar; hindi kailangang gawing tahasang “sa loob ng” upang maipahayag ang εἰς sa kontekstong ito.
- source_word: συναγωγὴν
  choice: sinagoga
  rationale: Ito ang kinikilalang termino sa Tagalog para sa lugar ng pagtitipon at pagsamba ng mga Judio.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Direkta at neutral na pang-uring paari; hindi nito tinutukoy nang higit sa isinasaad ng Griyego kung sino ang tinutukoy na pangkat.
theological_decisions:
- issue: Tinutukoy ng “kanilang sinagoga”
  choice: Pinanatili bilang “kanilang sinagoga” nang walang dagdag na pagkakakilanlan o negatibong kulay.
  alternative: “sinagoga ng mga Judio” o “kanilang bahay-pulungan”
  rationale: αὐτῶν ay simpleng panghalip na paari. Hindi tahasang nililinaw ng talata ang tinutukoy nito, kaya hindi dapat magdagdag ng sektaryan o polemikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “Pagkaalis” sa halip na mas pormal na “Pag-alis” o makalumang “pumaroon,” at pinanatili ang “sinagoga” bilang tiyak na katawagang pangkasaysayan.
