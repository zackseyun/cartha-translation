id: MAT.12.34
reference: Matthew 12:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: tl
  text: Lahi ng mga ulupong[a], paano kayo makapagsasalita ng mabubuting bagay gayong masasama kayo? Sapagkat kung ano ang nag-uumapaw sa puso, iyon ang sinasabi ng bibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mga anak ng mga ulupong.”
    reason: lexical_alternative
  - marker: b
    text: O “Sapagkat mula sa kasaganaan ng puso ay nagsasalita ang bibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Lahi ng mga ulupong
  rationale: Pinananatili nito ang matalim na talinghaga ng pinagmulan at likas na pagkatao. Likas at marangal itong pakinggan sa modernong Tagalog; inilalagay sa talababa ang mas tahasang alternatibo.
- source_word: πῶς δύνασθε
  choice: paano kayo makapagsasalita
  rationale: Likas na ipinahahayag sa Tagalog ang retorikal na tanong tungkol sa kawalan ng kakayahang magsalita nang mabuti sa gayong kalagayan.
- source_word: ἀγαθὰ λαλεῖν
  choice: makapagsasalita ng mabubuting bagay
  rationale: Pinananatili ang substantibong pangmaramihang ἀγαθά at ang payak na diwa ng λαλεῖν.
- source_word: πονηροὶ ὄντες
  choice: gayong masasama kayo
  rationale: Malinaw na iniuugnay ng “gayong” ang masamang kalagayan nila sa retorikal na tanong, habang pinananatili ng “masasama” ang moral na bigat ng πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Sapagkat kung ano ang nag-uumapaw sa puso
  rationale: Ipinahahayag ng “nag-uumapaw” ang larawan ng panloob na kapuspusang lumalabas sa pananalita. Hindi nito nililimitahan ang “puso” sa damdamin lamang.
- source_word: τὸ στόμα λαλεῖ
  choice: iyon ang sinasabi ng bibig
  rationale: Natural sa Tagalog ang ayos na ito at malinaw na iniuugnay ang sinasabi ng bibig sa umaapaw mula sa puso.
theological_decisions:
- issue: Talinghagang kahulugan ng καρδία
  choice: puso
  alternative: kalooban; isip
  rationale: Pinananatili ang malawak na biblikal na larawan ng panloob na pagkatao—kasama ang pag-iisip, pagnanais, at pagpapasya—nang hindi ito pinaliliit sa damdamin o isip lamang.
- issue: Moral na paglalarawan sa πονηροὶ ὄντες
  choice: gayong masasama kayo
  alternative: gayong hindi kayo mabuti; gayong napakasama ninyo
  rationale: Nagbibigay ang “masasama” ng malinaw na moral na hatol nang hindi pinahihina o pinalalabis ang sinabi ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang tindi ng pagsaway at ang mga talinghaga ng ulupong, puso, pag-uumapaw, at bibig.
