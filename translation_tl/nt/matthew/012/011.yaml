revisions:
- from: Ngunit sinabi niya sa kanila, “Sino sa inyo ang may isang tupa na, kapag nahulog ito sa isang hukay sa araw ng Sabbath[a], ay hindi hahawak dito at iaahon ito?[b]”
  to: Ngunit sinabi niya sa kanila, “Sinong tao sa inyo ang may isang tupa na, kung mahulog ito sa isang hukay sa Sabbath[a], ay hindi ito hahawakan at iaahon?[b]”
  rationale: Pinalitan ang “kapag” ng “kung” upang maingatan ang kondisyunal na lakas ng ἐὰν. Ginawang “Sinong tao sa inyo” upang katawanin ang ἄνθρωπος sa paraang likas sa modernong Filipino Tagalog. Pinasimple ang “sa araw ng Sabbath” tungo sa “sa Sabbath,” at inayos ang pandiwa sa “hindi ito hahawakan” para sa mas malinaw na transitive na Tagalog. Napanatili ang kahulugan, retorikal na anyo, at mga angkla ng talababa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:11Z'
