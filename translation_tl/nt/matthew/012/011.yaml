reference: Matthew 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Sinong tao sa inyo ang may isang tupa na, kung mahulog ito sa isang hukay sa Sabbath[a], ay hindi ito hahawakan at iaahon?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “sa mga Sabbath,” isang idyomatikong maramihang anyo na nangangahulugang “sa Sabbath.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi ito hahawakan at itataas?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Sino sa inyo
  rationale: Likas na paraan ito sa modernong Tagalog upang ihayag ang retorikal na tanong. Ang ἄνθρωπος ay tumutukoy rito sa isang kinatawang tao; hindi kailangang lagyan ng kasariang wala namang katumbas sa panghalip na Tagalog.
- source_word: ἕξει πρόβατον ἕν
  choice: ang may isang tupa
  rationale: Pinananatili ng “isang tupa” ang diin sa iisang hayop, samantalang likas sa Tagalog ang pangkasalukuyang “may” sa ganitong halimbawang kondisyonal.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: kapag nahulog ito
  rationale: Ang “kapag” ay angkop sa ipinapalagay na sitwasyon sa retorikal na tanong; malinaw na ang “ito” ay tumutukoy sa tupa.
- source_word: τοῖς σάββασιν
  choice: sa araw ng Sabbath
  rationale: Bagaman maramihan ang anyong Griyego, idyomatiko itong tumutukoy sa Sabbath. Nililinaw ng “araw ng Sabbath” na araw ang tinutukoy.
- source_word: εἰς βόθυνον
  choice: sa isang hukay
  rationale: Ang βόθυνος ay hukay o malalim na butas; ang “hukay” ay malawak, malinaw, at hindi labis na tiyak.
- source_word: οὐχὶ κρατήσει αὐτό
  choice: ay hindi hahawak dito
  rationale: Ang οὐχί ay naghihintay ng sagot na oo. Ang “hahawak dito” ay dignidad at natural na salin ng mahigpit na paghawak sa hayop.
- source_word: καὶ ἐγερεῖ
  choice: at iaahon ito
  rationale: Sa konteksto ng tupang nasa hukay, ang ἐγείρω ay nangangahulugang itaas o ilabas mula roon. Ang “iaahon” ay maikli at likas, habang hindi ikinakaila ang mas literal na diwang “itataas.”
theological_decisions:
- issue: Kinatawang pananalita ng ἄνθρωπος
  choice: Sino sa inyo
  alternative: Sinong tao sa inyo
  rationale: Walang kasariang gramatikal ang “sino” sa Tagalog, at natural nitong naihahayag ang pangkalahatang halimbawa nang hindi nagdaragdag o nag-aalis ng taong tinutukoy.
- issue: Idyomatikong maramihan ng σάββασιν
  choice: sa araw ng Sabbath
  alternative: sa mga Sabbath
  rationale: Ang maramihang anyo sa Griyego ay idyomatiko sa kontekstong ito; ang isahang diwa ang malinaw na tumutukoy sa kautusan tungkol sa Sabbath.
- issue: Saklaw ng kahulugan ng ἐγείρω
  choice: iaahon ito
  alternative: itataas ito
  rationale: Ipinahihiwatig ng hukay ang pag-ahon palabas. Pinananatili sa talababa ang mas literal na posibilidad upang hindi maitago ang mas malawak na leksikal na diwa ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng retorikal na tanong at ang inaasahang sagot na oo, habang iniwasan ang pilit na paglalagay ng kasarian sa Tagalog.
