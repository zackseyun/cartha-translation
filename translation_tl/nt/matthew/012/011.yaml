  naturalness: Natural at marangal ang pangkalahatang register. Ang “sa araw ng Sabbath” ay nauunawaan ngunit bahagyang mabigat; mas likas ang “sa Sabbath.” Ang binagong ayos ay pinananatili ang retorikal na tanong habang mas malinaw na ipinakikita ang kondisyon.
  terminology: Ang “Sabbath,” “tupa,” “hukay,” at “iaahon” ay angkop. Ang “iaahon” ay mahusay na kontekstuwal na salin ng ἐγερεῖ; ang alternatibong “itataas” ay dapat manatili sa talababa bilang mas literal na posibilidad.
