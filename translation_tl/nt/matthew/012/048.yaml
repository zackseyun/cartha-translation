id: MAT.12.48
reference: Matthew 12:48
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: tl
  text: Ngunit sumagot siya sa taong nagsasalita sa kanya[a], “Sino ang aking ina, at sino-sino ang aking mga kapatid na lalaki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Ngunit sumagot siya at sinabi sa taong nagsasalita sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ngunit sumagot siya
  rationale: Ang ἀποκριθεὶς εἶπεν ay karaniwang idyomang Griyego na literal na ‘sumagot at sinabi.’ Sapat at natural sa modernong Tagalog ang ‘sumagot siya,’ habang ipinahihiwatig ng ‘Ngunit’ ang pagliko ng usapan na dala ng δέ.
- source_word: τῷ λέγοντι αὐτῷ
  choice: sa taong nagsasalita sa kanya
  rationale: 'Pinananatili nito ang substantibal at pangkasalukuyang diwa ng participle λέγοντι: ang taong kasalukuyang kumakausap kay Jesus.'
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Sino ang aking ina
  rationale: Tuwirang tanong ito tungkol sa pagkakakilanlan. Ang ‘Sino ang aking ina’ ay natural at tapat sa anyong retorikal ng Griyego.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: at sino-sino ang aking mga kapatid na lalaki
  rationale: Ang τίνες ay maramihan, kaya malinaw itong naipapahayag ng ‘sino-sino.’ Ang ἀδελφοί ay panlalaking maramihang katawagang pampamilya sa kontekstong ito, kaya ginamit ang tahasang ‘mga kapatid na lalaki’ sa halip na palawakin ito bilang magkakapatid na may babae.
theological_decisions:
- issue: Posibleng pagpapalambot o pagpapaliwanag sa retorikal na tanong ni Jesus tungkol sa pamilya
  choice: Panatilihin ang literal na mga tanong nang walang dagdag na paliwanag
  alternative: Sino ang maituturing kong ina, at sino-sino ang maituturing kong mga kapatid?
  rationale: Inihahanda ng talata ang muling paglalarawan ni Jesus sa pagkakamag-anak sa kasunod na konteksto, ngunit hindi dapat isingit sa talatang ito ang paliwanag na iyon. Pinananatili ng tuwirang salin ang tensiyong pasalaysay at teolohikal.
- issue: Kasarian sa pagsasalin ng ἀδελφοί
  choice: mga kapatid na lalaki
  alternative: mga kapatid; magkakapatid
  rationale: Panlalaking maramihan ang anyo ng salitang Griyego at tumutukoy sa mga lalaking kapatid ni Jesus sa agarang tagpo. Hindi ito pinalawak upang isama ang mga kapatid na babae.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang ‘aking’ sa mismong tanong upang mapanatili ang bahagyang pormal at mariing himig; malinaw ang ‘mga kapatid na lalaki’ bilang tumpak na katawagang pangkasarian. Ang panandang [a] ay nasa pangunahing teksto.
