id: MAT.12.32
reference: Matthew 12:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: tl
  text: At ang sinumang magsalita laban sa Anak ng Tao, patatawarin siya; ngunit ang sinumang magsalita laban sa Banal na Espiritu, hindi siya patatawarin—hindi sa panahong ito ni sa panahong darating.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “hindi sa panahong ito ni sa darating,” na ang “panahon” sa ikalawang parirala ay nauunawaan mula sa una. Tradisyonal ding isinasalin ang “panahon” bilang “mundo,” ngunit temporal ang paghahambing dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: ang sinumang ... ngunit ang sinumang
  rationale: Ipinapahayag ng mga anyong ito ang pangkalahatan at bukas na kondisyon; likas itong naihahatid ng “ang sinumang” sa Filipino.
- source_word: εἴπῃ λόγον κατὰ
  choice: magsalita laban sa
  rationale: Ang pariralang Griyego ay tumutukoy sa pagsasalitang nakatuon laban sa isang persona. Likas sa Filipino ang “magsalita laban sa,” samantalang magiging mabigat at di-likas ang literal na “magsabi ng isang salita laban sa.”
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Anak ng Tao
  rationale: Pinananatili nito ang kinikilalang titulo at ang mesiyaniko at apokaliptikong mga pahiwatig nito nang hindi ito ginagawang karaniwang pagtukoy lamang sa isang tao.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: patatawarin siya / hindi siya patatawarin
  rationale: Natural na pasibong pagpapahayag ito sa Filipino at malinaw na tumutukoy sa kapatawaran ng taong nagkasala, nang hindi tinutukoy ang gumagawa ng pagpapatawad.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Banal na Espiritu
  rationale: Ito ang malinaw, kasalukuyan, at malawak na kinikilalang salin ng banal na titulo.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: hindi sa panahong ito ni sa panahong darating
  rationale: Temporal, hindi heograpikal, ang paghahambing. Mas natural sa ordinaryong Filipino ang “panahon” kaysa “kapanahunan,” at ang pag-uulit nito sa ikalawang parirala ay nililinaw ang elipsis ng Griyego.
theological_decisions:
- issue: Ang temporal na paghahambing ng αἰών at μέλλων
  choice: hindi sa panahong ito ni sa panahong darating
  alternative: hindi sa mundong ito ni sa mundong darating; hindi sa kapanahunang ito ni sa darating
  rationale: Pinananatili ng salin ang eskatolohikal na paghahambing ng kasalukuyan at darating na panahon, sa halip na magpahiwatig ng dalawang heograpikal na mundo. Ginawang lantad ang nauunawaang pangngalan sa ikalawang parirala upang maging malinaw sa Filipino.
- issue: Ang kalikasan ng kasalanang hindi patatawarin
  choice: Panatilihin ang babala nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag
  alternative: Tukuyin ito bilang isang natatanging makasaysayang paratang laban kay Jesus; tukuyin ito bilang pangwakas na kawalan ng pagsisisi
  rationale: Sinasabi ng talata ang kahihinatnan ng pagsasalita laban sa Banal na Espiritu ngunit hindi nito rito lubusang binibigyang-kahulugan ang kasalanan. Hindi dapat magpasok ang salin ng paliwanag na lampas sa mismong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magsalita laban sa” bilang natural na katumbas ng idyomatikong Griyego; iniwasan ang labis na literal na “magsabi ng salita laban sa.” Pinanatili ang titulong “Anak ng Tao” at ang kaibahan ng kasalukuyan at darating na panahon.
