  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: tl
  text: Pagkatapos, sumagot sa kanya ang ilan sa mga tagapagturo ng Kautusan at mga Pariseo. Sinabi nila, “Guro, nais naming makakita ng isang tanda[a] mula sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mahimalang tanda.” Maaaring tumukoy ang salitang Griyego sa isang tanda na may makahimalang kabuluhan, ngunit pinananatili rito ang mas malawak na salitang “tanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa salaysay na nagpapakilala sa kasunod na pangyayari.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: sumagot sa kanya
  rationale: Pinananatili ang karaniwang idyomang Griyego na ‘sumagot,’ kahit walang tahasang tanong sa mismong talata.
- source_word: τινες τῶν γραμματέων
  choice: ang ilan sa mga tagapagturo ng Kautusan
  rationale: Ipinahihiwatig ng ‘ilan’ na hindi lahat ng kabilang sa pangkat; inililinaw ng ‘mga tagapagturo ng Kautusan’ ang tungkulin ng γραμματεῖς para sa modernong mambabasa.
- source_word: καὶ Φαρισαίων
  choice: at mga Pariseo
  rationale: Karaniwang transliterasyon sa Filipino para sa pangalan ng pangkat na Judio.
- source_word: λέγοντες
  choice: Sinabi nila
  rationale: Likas na Filipino para sa participleng nagpapakilala sa tuwirang pananalita, nang hindi pinipilit ang estrukturang Griyego.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Tuwirang katumbas ng katawagang tumutukoy sa nagtuturo, nang hindi idagdag ang mas malakas na diwa ng ‘Panginoon’ o ‘Amo.’
- source_word: θέλομεν
  choice: nais naming
  rationale: Dignified at natural na pagpapahayag ng tahasang kagustuhan sa modernong Filipino.
- source_word: ἀπὸ σοῦ
  choice: mula sa iyo
  rationale: 'Pinananatili ang diwa ng pinagmulan: ang tandang hinihingi nila ay magmumula kay Jesus.'
- source_word: σημεῖον
  choice: isang tanda
  rationale: Pinananatili ang malawak na leksikal na kahulugan ng σημεῖον; ipinahihiwatig ng konteksto ang pambihira o makahimalang kabuluhan nito.
- source_word: ἰδεῖν
  choice: makakita
  rationale: Tuwirang salin ng infinitive ng ὁράω at natural sa pariralang ‘nais naming makakita.’
theological_decisions:
- issue: Kalikasan ng σημεῖον sa konteksto
  choice: tanda
  alternative: makahimalang tanda
  rationale: Sa konteksto, humihingi sila ng katibayang malamang ay makahimala, ngunit ang salitang Griyego ay mas malawak na ‘tanda.’ Pinananatili ng pangunahing teksto ang saklaw at bahagyang kalabuan ng orihinal.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang ‘tagapagturo ng Kautusan’ sa halip na ‘eskriba’ upang maging malinaw sa ordinaryong mambabasa ang papel ng grupo, habang pinanatili ang ‘Pariseo’ bilang kinikilalang pangalang pangkasaysayan.
