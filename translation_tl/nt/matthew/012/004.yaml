id: MAT.12.4
reference: Matthew 12:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: tl
  text: kung paano pumasok siya sa bahay ng Diyos at kinain nila[a] ang tinapay na inilalagay sa harap ng Diyos[b], na hindi ipinahihintulot na kainin niya ni ng mga kasama niya, kundi para lamang sa mga pari?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito o pagbasa na “kinain niya” sa halip na “kinain nila.”
    reason: textual_variant
  - marker: b
    text: Sa literal, “mga tinapay ng paglalagay sa harap.” Tinutukoy nito ang sagradong tinapay na inilalagay sa harap ng Diyos; tinatawag din itong “Tinapay ng Presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: kung paanong
  rationale: Likas na panimula sa Filipino para sa nilalaman ng salaysay na binabanggit ni Jesus, habang pinananatili ang diwa ng “kung paano.”
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: pumasok siya sa bahay ng Diyos
  rationale: Malapit sa anyo at kahulugan ng Griyego. Hindi pinalitan ng “tabernakulo” o “banal na lugar” sapagkat “bahay ng Diyos” mismo ang nasa teksto.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: ang tinapay na nakahain sa harap ng Diyos
  rationale: Ipinapahayag nang malinaw at natural ang tinapay na sagradong inilalagay sa harap ng Diyos. Ang kolektibong “tinapay” ay karaniwang gamit sa Filipino kahit maramihan ang Griyego.
- source_word: ἔφαγον
  choice: kinain nila
  rationale: Sinusunod ang maramihang pandiwa sa ibinigay na SBLGNT. Ang isahang pagbasa na “kinain niya” ay inilagay sa talababa dahil mahalagang baryante ito.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: na hindi ipinahihintulot ng Kautusan na kainin niya
  rationale: Ginawang hayag ang legal at panrelihiyong puwersa ng ἐξὸν sa konteksto; hindi lamang ito karaniwang pahintulot kundi paghihigpit ayon sa Kautusan.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ni ng mga kasama niya
  rationale: Maikli at natural na katumbas na nagpapanatili sa negatibong pagdaragdag ng οὐδέ.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: kundi ng mga pari lamang
  rationale: Pinananatili ang eksepsiyon at pagiging eksklusibo ng μόνοις sa likas na Filipino.
theological_decisions:
- issue: Legal at panritwal na puwersa ng ἐξὸν
  choice: hindi ipinahihintulot ng Kautusan
  alternative: hindi pinahihintulutan
  rationale: Ang pagbanggit sa Kautusan ay nililinaw ang sagrado at legal na paghihigpit na mahalaga sa argumento, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
- issue: Paksa ng ἔφαγον
  choice: kinain nila
  alternative: kinain niya
  rationale: Maramihan ang pandiwa sa ibinigay na tekstong SBLGNT, kaya iyon ang sinunod sa pangunahing teksto. Pinanatili sa talababa ang isahang baryante.
- issue: Pagkatawan sa tinapay na inilalagay sa harap ng Diyos
  choice: tinapay na nakahain sa harap ng Diyos
  alternative: Tinapay ng Presensya; tinapay na handog
  rationale: Iniiwasan ang malabo o di-likas na “Tinapay ng Presensya” habang pinananatili ang ideya ng sagradong tinapay na inilalagay sa harap ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong patanong at ang estruktura ng pagbanggit ni Jesus sa salaysay tungkol kay David, ngunit inayos ang parirala upang maging natural sa karaniwang mambabasa.
