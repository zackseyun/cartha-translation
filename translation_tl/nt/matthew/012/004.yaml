revisions:
- from: kung paanong pumasok siya sa bahay ng Diyos at kinain nila[a] ang tinapay na nakahain sa harap ng Diyos[b], na hindi ipinahihintulot ng Kautusan na kainin niya ni ng mga kasama niya, kundi ng mga pari lamang?
  to: kung paano pumasok siya sa bahay ng Diyos at kinain nila[a] ang tinapay na inilalagay sa harap ng Diyos[b], na hindi ipinahihintulot na kainin niya ni ng mga kasama niya, kundi para lamang sa mga pari?
  rationale: Inalis ang hindi tahasang “ng Kautusan” upang mapanatili ang saklaw ng Griyego habang nananatiling malinaw ang pagbabawal. Pinalitan ang “nakahain” ng mas tumpak na paglalarawan ng ritwal na paglalagay ng tinapay, at inayos ang alternatibong termino sa talababa. Napanatili ang maramihang pangunahing pagbasa at ang talababa para sa isahang baryante.
