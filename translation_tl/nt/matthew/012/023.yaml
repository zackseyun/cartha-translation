base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: tl
  text: At labis na namangha ang lahat ng mga tao at sinabi nila,[b] “Hindi kaya ito ang Anak ni David?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ni David” ay isang titulong mesiyaniko na tumutukoy sa ipinangakong haring tagapagligtas mula sa angkan ni David.
    reason: cross_reference
  - marker: b
    text: 'O, mas literal ayon sa puwersa ng tanong: “Ito kaya ang Anak ni David?” Ang tanong sa Griyego ay nagpapahiwatig ng pag-aatubili at karaniwang umaasa sa negatibong tugon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: labis na namangha
  rationale: Ipinahahayag nito ang matinding pagkabigla at paghanga ng mga tao. Ang aspektong di-ganap ng pandiwa ay angkop na naihahatid sa daloy ng salaysay nang hindi kinakailangang gawing mabigat ang Filipino.
- source_word: πάντες οἱ ὄχλοι
  choice: ang lahat ng mga tao
  rationale: Bagaman maramihan ang ὄχλοι, mas natural sa modernong Filipino ang “lahat ng mga tao” kaysa “lahat ng mga karamihan,” habang napapanatili ang saklaw na lahat ng naroon.
- source_word: ἔλεγον
  choice: sinabi nila
  rationale: Ang di-ganap na anyo ay maaaring magpahiwatig ng patuloy o paulit-ulit na pagsasalita, ngunit natural sa salaysay na Filipino ang payak na “sinabi nila.”
- source_word: Μήτι
  choice: Ito na kaya
  rationale: Ang “kaya” ay nagpapahayag ng nag-aatubili at nagtatakang tanong. Hindi nito ginagawang tahasang pagtanggi ang tanong, ngunit ipinahihiwatig pa rin ang inaasahang pag-aalinlangan ng Μήτι.
- source_word: ὁ υἱὸς Δαυίδ
  choice: ang Anak ni David
  rationale: Pinananatili nito ang literal at kinikilalang mesiyanikong titulo sa halip na palitan ito ng interpretatibong “Mesiyas.”
theological_decisions:
- issue: Mesiyanikong diwa ng “Anak ni David”
  choice: Panatilihin sa pangunahing teksto ang titulong “Anak ni David.”
  alternative: ang Mesiyas; ang ipinangakong tagapagmana ni David
  rationale: Titulo mismo ang ginamit ng Griyego. Ang pagpapanatili nito ay hindi maagang lumulutas sa teolohikong kahulugan, samantalang maipaliliwanag ng talababa ang mesiyanikong kaugnayan nito.
- issue: Puwersa ng tanong na may Μήτι
  choice: Gamitin ang nag-aatubiling “Ito na kaya…?”
  alternative: “Hindi kaya ito ang Anak ni David?” o “Tiyak na hindi ito ang Anak ni David, hindi ba?”
  rationale: Pinananatili ng salin ang pagkamangha at pag-aalinlangan ng mga tao nang hindi ginagawang tiyak na pagtanggi ang kanilang tanong.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “mga tao” bilang idiomatikong katumbas ng maramihang ὄχλοι, at ang “Ito na kaya” upang mapanatili ang nagtataka at nag-aatubiling himig ng tanong. Ang mga pananda ng talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
