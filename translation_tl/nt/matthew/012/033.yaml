id: MAT.12.33
reference: Matthew 12:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: tl
  text: Gawin[a] ninyong mabuti ang puno at mabuti ang bunga nito, o gawin ninyong bulok ang puno at bulok[b] ang bunga nito; sapagkat nakikilala ang puno sa bunga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “gawin” ay maaari ring unawain dito sa retorikal na diwang “ituring” o “ipakitang gayon,” ngunit pautos ang anyo sa Griyego.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay maaari ring isaling “masama,” “sira,” o “walang pakinabang”; maaari itong tumukoy sa bagay na nabulok o naging tiwali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: gawin ninyong
  rationale: Pinananatili ang tahasang pautos at ang magkatimbang na pag-uulit ng Griyego. Bagaman maaari itong gumana bilang retorikal na ‘ituring’ o ‘ipakitang,’ hindi iyon tahasang ipinapalit sa pangunahing teksto.
- source_word: δένδρον
  choice: puno
  rationale: Ito ang karaniwan at likas na katumbas sa Tagalog at pinananatili ang sentrong larawan ng talinghaga.
- source_word: καλός
  choice: mabuti
  rationale: Saklaw nito ang husay o kaayusan ng puno at ang moral na pahiwatig ng konteksto, nang hindi nililimitahan ang kahulugan sa pisikal na kalusugan lamang.
- source_word: καρπός
  choice: bunga
  rationale: Ito ang tuwiran at likas na katumbas na nagpapanatili sa larawan at matalinghagang gamit.
- source_word: σαπρός
  choice: bulok
  rationale: Matingkad nitong ipinahahayag ang bagay na nabulok, nasira, o wala nang pakinabang at angkop ito kapuwa sa puno at sa bunga.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: sapagkat ... sa bunga nito
  rationale: Ang ‘sapagkat’ ay naghahayag ng paliwanag na ugnayan ng γάρ, at ang ‘sa bunga’ ay likas na Tagalog para sa batayan ng pagkilala na ipinapahayag ng ἐκ.
- source_word: γινώσκεται
  choice: nakikilala
  rationale: 'Pinananatili nito ang pangkasalukuyang balintiyak na diwa: ang puno ay nakikilala batay sa bunga nito.'
- source_word: αὐτοῦ
  choice: nito
  rationale: Malinaw at likas itong tumutukoy sa punong binanggit.
theological_decisions:
- issue: Lakas ng mga pautos sa talinghaga ni Jesus
  choice: 'Pinanatili bilang tuwirang pautos: ‘Gawin ninyong ...’'
  alternative: ‘Ituring ninyong ...’ o ‘Ipakita ninyong ...’
  rationale: Dalawang pautos na aorist ang nasa Griyego. Maaaring retorikal ang gamit, ngunit pinananatili ng salin ang anyong pautos at ang talas ng pangangatwiran sa halip na tahimik na lutasin ang kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit at magkatimbang na kayarian ng Griyego kahit bahagyang matalim ang tunog nito sa Tagalog, sapagkat mahalaga ang retorikal na paghahambing sa pagitan ng mabuting puno at bunga at ng bulok na puno at bunga.
