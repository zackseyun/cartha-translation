  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: tl
  text: Sapagkat ang Anak ng Tao ang Panginoon ng Sabbath.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Anak ng Tao ang may awtoridad sa Sabbath.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ng Tao” ay natatanging katawagang ginagamit ni Jesus sa sarili sa mga Ebanghelyo. Maaari rin itong unawain nang mas pangkalahatan bilang pagtukoy sa isang tao, ngunit pinahihina nito ang malamang na diwa ng parirala bilang titulo.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng pahayag sa naunang pangangatwiran.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang matibay na diwa ng awtoridad at ang bigat ng titulo sa kontekstong tumutukoy kay Cristo.
- source_word: τοῦ σαββάτου
  choice: ng Sabbath
  rationale: Likas na katumbas ng genitibong kasunod ng κύριος at tumutukoy sa banal na araw at institusyong Judio.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinikilalang katawagan ni Jesus sa sarili at ang posibleng ugnay nito sa Daniel 7, sa halip na gawin itong pangkalahatang pagtukoy lamang sa tao.
- source_word: ἐστιν
  choice: ang … ang
  rationale: Sa natural na Tagalog, ipinahahayag ang pangkasalukuyang kopula sa pamamagitan ng ayos na panaguri at paksa, nang hindi nangangailangan ng hiwalay na katumbas ng “ay.”
theological_decisions:
- issue: Lakas ng pahayag na κύριος ... τοῦ σαββάτου
  choice: “ang Anak ng Tao ang Panginoon ng Sabbath” bilang matibay na pahayag ng awtoridad
  alternative: “ang Anak ng Tao ang may kapangyarihan sa Sabbath”
  rationale: Pinananatili ng “Panginoon” ang teolohikal na bigat ng κύριος nang hindi dinaragdagan ang sinasabi ng teksto.
- issue: Pagpapakahulugan sa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Ituring na titulong “ang Anak ng Tao”
  alternative: “ang taong iyon” o “ang isang tao”
  rationale: Ang tradisyonal na titulo ang pinakamahusay na nagpapanatili sa pagkakakilanlan nito bilang katangiang katawagan ni Jesus at sa intertekstuwal na posibilidad nito, habang hindi ipinipilit ang isang ganap na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar na katawagan sa banal na araw ng mga Judio, at pinanatili ang “Anak ng Tao” at “Panginoon” bilang mga titulong may mahalagang intertekstuwal at teolohikal na bigat.
