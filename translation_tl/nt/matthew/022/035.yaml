  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: tl
  text: 'At nagtanong sa kanya ang isa sa kanila, isang dalubhasa sa Kautusan,[a] upang subukin siya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang eksperto sa batas.” Ang terminong Griyego ay tumutukoy rito sa isang dalubhasa sa Kautusang Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay ng pangungusap sa naunang salaysay nang hindi nagdaragdag ng tiyak na pahiwatig sa panahon.
- source_word: ἐπηρώτησεν
  choice: nagtanong sa kanya
  rationale: Likas na salin sa modernong Tagalog ng pandiwang nangangahulugang magtanong o mag-usisa; ang kasunod na talata ang nagbibigay ng mismong tanong.
- source_word: εἷς ἐξ αὐτῶν
  choice: ang isa sa kanila
  rationale: Karaniwang Tagalog para sa partitive expression na nagsasaad na kabilang sa nabanggit na pangkat ang nagtatanong.
- source_word: νομικὸς
  choice: isang dalubhasa sa Kautusan
  rationale: Sa kontekstong Judio, tumutukoy ito sa taong bihasa sa Kautusan, hindi pangunahin sa isang makabagong abogadong humaharap sa hukuman.
- source_word: πειράζων
  choice: upang subukin siya
  rationale: Ipinahahayag ang mapanuring layunin ng pagtatanong. Ang “subukin” ay mas angkop dito kaysa “tuksuhin,” na maaaring magpahiwatig ng pang-aakit na gumawa ng kasalanan.
- source_word: αὐτόν
  choice: sa kanya / siya
  rationale: Ang dalawang panghalip sa salin ay tumutukoy kay Jesus bilang kinakausap at sinusubok.
theological_decisions:
- issue: Diwa ng πειράζων kaugnay ni Jesus
  choice: upang subukin siya
  alternative: habang tinutukso siya
  rationale: Maaaring mangahulugan ang Griyego ng pagsubok o panunukso. Sa salaysay, ang diin ay nasa mapanubok at posibleng palabang pagtatanong, hindi sa tahasang pang-aakit kay Jesus na gumawa ng masama.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa “Kautusan” upang ipakitang ang tinutukoy ay ang Kautusang Judio. Ang tutuldok ay naghahanda sa mismong tanong sa kasunod na talata.
