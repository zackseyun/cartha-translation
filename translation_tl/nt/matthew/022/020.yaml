  source_fidelity: Ang pandiwang “sinabi niya sa kanila” ay wastong pagsasalin ng λέγει αὐτοῖς sa anyong salaysay. Gayunman, ang “ang nakasulat dito” ay nagpapalit sa pangngalang ἐπιγραφή (“inskripsiyon”) tungo sa mas maluwag na paglalarawan at ang “dito” ay dagdag na deiktikong hindi nasa Griyego. Dapat panatilihin ang tanong tungkol sa may-ari o kaugnayan ng larawan at inskripsiyon.
  naturalness: Natural at marangal sa modernong Filipino ang “Kanino ang larawang ito at ang inskripsiyon?” Malinaw na saklaw ng “Kanino” ang dalawang magkaugnay na pangngalan, gaya ng iisang genitibong tanong sa Griyego.
