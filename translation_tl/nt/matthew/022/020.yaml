  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Kanino ang larawang ito at ang inskripsiyon?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas pormal na ayos: “Kaninong larawan ito at kaninong inskripsiyon?” Ang Griyegong Τίνος ay nagtatanong tungkol sa pagmamay-ari o kaugnayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman pangkasalukuyan ang anyong Griyego at maaaring isaling “sinasabi,” mas natural sa makabagong salaysay sa Filipino ang pangnagdaang “sinabi.”
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na katumbas sa Filipino ng panghalip na datibong tumutukoy sa mga kinausap.
- source_word: Τίνος
  choice: Kanino
  rationale: Itinatanong ng genitibong panghalip ang pagmamay-ari o kaugnayan. Pinananatili ng “Kanino” ang saklaw nito sa larawan at sa nakasulat.
- source_word: εἰκὼν
  choice: larawan
  rationale: Karaniwan at malinaw na salita para sa anyo o wangis na makikita sa barya, nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: αὕτη
  choice: ito
  rationale: Natural na katumbas ng demonstratibong tumutukoy sa larawang ipinakikita.
- source_word: ἐπιγραφή
  choice: ang nakasulat dito
  rationale: Tiyak ngunit madaling maunawaang paglalarawan sa inskripsiyong nasa barya; ang “dito” ay natural na nagpapahiwatig na nasa bagay na hawak nila ang sulat.
- source_word: καὶ
  choice: at
  rationale: Tuwirang inuugnay ang dalawang katangian ng barya na itinatanong.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nakasulat dito” sa pangunahing teksto sa halip na ang mas teknikal na “inskripsiyon,” habang pinananatili sa talababa ang mas pormal na alternatibo.
