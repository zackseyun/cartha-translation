  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: tl
  text: Kung tinatawag siya ni David na Panginoon[a], kung gayon, paano siya anak ni David?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasang ayon sa konteksto: “Kung tinatawag ni David ang Mesiyas na ‘Panginoon,’ kung gayon, paano siya anak ni David?”'
    reason: Nililinaw ng alternatibong salin na ang tinutukoy ng panghalip ay ang Mesiyas, batay sa naunang konteksto.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Kung … kung gayon
  rationale: Pinananatili ang kondisyonal na puwersa ng εἰ at ang lohikal na paghinuha ng οὖν. Ang paghahati sa parirala ay natural sa modernong Filipino at malinaw na naipapakita ang daloy ng pangangatwiran.
- source_word: Δαυὶδ
  choice: David
  rationale: Karaniwang anyo sa Filipino ng pangalang pantangi.
- source_word: καλεῖ αὐτὸν κύριον
  choice: tinatawag siya … na Panginoon
  rationale: Tuwirang ipinapahayag ang pagtawag o pagbibigay-tawag sa kaniya bilang κύριος. Pinananatili ng “Panginoon” ang marangal at kristolohikal na alingawngaw ng sipi mula sa Awit 110:1.
- source_word: πῶς υἱὸς αὐτοῦ ἐστιν
  choice: paano siya anak ni David?
  rationale: Natural at tuwirang tanong sa Filipino. Pinananatili ang salitang “anak” sa halip na gawing “inapo,” upang huwag pahinain ang sinasadyang tensiyon ng pangungusap. Inulit ang “David” upang maiwasan ang malabong reperensiya ng “niya” sa Filipino.
theological_decisions:
- issue: Ang Mesiyas ay tinatawag ni David na “Panginoon” ngunit anak din ni David
  choice: Pinanatili sa pangunahing teksto ang “Panginoon” at “anak ni David” nang hindi ipinapaliwanag kung paano magkaugnay ang mga ito.
  alternative: Kung tinatawag ni David ang Mesiyas na “Panginoon,” paano siya anak ni David?
  rationale: Nakasalalay ang bisa ng tanong sa pagpapanatili ng tensiyon sa pagitan ng pagiging anak ni David at pagiging Panginoon niya. Ang tahasang pagdaragdag ng “Mesiyas” sa pangunahing teksto ay lilinaw sa tinutukoy ngunit wala mismo ang pangngalang iyon sa Griyego ng talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang ayos na “Kung … kung gayon” ay bahagyang pormal ngunit natural sa isang lohikal at retorikal na tanong.
