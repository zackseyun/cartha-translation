  source_fidelity: Tapat ang salin sa Griyegong εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν. Naipapahayag ng “Kung … kung gayon” ang kondisyunal at lohikal na ugnayan; ang “tinatawag siya ni David na Panginoon” ay wasto para sa καλεῖ αὐτὸν κύριον; at ang “paano siya anak ni David?” ay pinananatili ang retorikal na tensiyon ng πῶς υἱὸς αὐτοῦ ἐστιν nang hindi ito nilulutas.
  naturalness: Natural at malinaw ang modernong Filipino. Ang pag-uulit ng “David” sa huling parirala ay isang angkop na paglilinaw sa Filipino at hindi nagdaragdag ng kahulugan. Bahagyang pormal ngunit angkop ang “kung gayon” sa pangangatwirang retorikal ni Jesus.
  terminology: Wasto at pare-pareho ang “Panginoon” para sa κύριον at “anak ni David” para sa υἱὸς αὐτοῦ. Hindi idinagdag sa pangunahing teksto ang “Mesiyas,” kaya napananatili ang panghalip at ang pag-asa nito sa naunang konteksto. Ang talababa ay wastong nag-aalok ng kontekstuwal na paglilinaw bilang alternatibo, hindi bilang ipinilit na pakahulugan.
