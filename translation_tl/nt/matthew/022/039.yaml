  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: tl
  text: 'At ang ikalawa ay katulad nito[a]: “Ibigin mo ang iyong kapwa gaya ng iyong sarili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At may isa pang katulad nito.”
    reason: Alternatibong salin ng Δευτέρα bilang di-tiyak na ordinal sa konteksto.
lexical_decisions:
- source_word: Δευτέρα
  choice: may ikalawang
  rationale: Ang pambabaeng pang-uring ordinal ay ginagamit bilang pangngalan at ipinahihiwatig ang ‘utos.’ Pinananatili ng ‘may ikalawang’ ang di-tiyak na anyo ng Griyego habang natural sa modernong Tagalog.
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa sinabi, hindi malakas na pagsalungat.
- source_word: ὁμοία αὐτῇ
  choice: katulad nito
  rationale: Tumutukoy ito pabalik sa unang utos at tuwirang ipinapahayag na ang ikalawa ay katulad niyon.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Ang anyong panghinaharap sa siping ito ay may puwersang pautos. Ang ‘Ibigin mo’ ay natural, marangal, at nagpapanatili sa anyo ng isang utos.
- source_word: τὸν πλησίον σου
  choice: ang iyong kapwa
  rationale: Ang parirala ay idyomatikong tumutukoy sa kapwa, hindi lamang sa taong pisikal na malapit.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Ipinapahayag nito ang pamantayan ng paghahambing at pinananatili ang tuwirang pagtukoy sa sarili.
theological_decisions:
- issue: Ugnayan ng ikalawang utos sa una
  choice: may ikalawang katulad nito
  alternative: ang ikalawa ay katulad nito
  rationale: Ipinakikita ng salin na ang ikalawang utos ay katulad ng una nang hindi pinagsasanib ang dalawang utos o dinaragdagan ang teksto ng paliwanag tungkol sa tiyak na antas ng kanilang pagkakatulad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘ibigin’ sa halip na mas kolokyal na anyo upang umangkop sa kasulatang sipi, ngunit nananatiling madaling maunawaan.
