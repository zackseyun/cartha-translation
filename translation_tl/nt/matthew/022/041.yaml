  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: tl
  text: Habang nagkakatipon ang mga Pariseo, tinanong sila ni Jesus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: Habang nagkakatipon
  rationale: Ang genitive absolute ay nagbibigay ng pangyayaring kasabay o kaligiran ng pangunahing kilos. Natural sa modernong Tagalog ang “Habang nagkakatipon,” at naipapahayag nito ang sama-samang pagtipon nang hindi ginagawang pangunahing kilos ang participle.
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Banayad na panandang diskurso ang δέ rito, hindi malinaw na pagsalungat. Sapat nang naihahatid ng ayos at daloy ng sugnay na “Habang…” ang paglipat; magiging mabigat o labis ang pagdaragdag ng “ngayon” o “ngunit.”
- source_word: τῶν Φαρισαίων
  choice: ang mga Pariseo
  rationale: Karaniwan at malinaw na katawagan sa pangkat na Φαρισαῖοι; ang ugnayang gramatikal nito sa participle ay natural na naipapakita sa sugnay na Tagalog.
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Tuwirang modernong katumbas ng pandiwang nagpapakilala sa tanong ni Jesus. Hindi nito dinaragdagan ang antas ng pakikipagtalo na maaaring ipahiwatig ng “inusisa.”
- source_word: αὐτοὺς
  choice: sila
  rationale: Tumutukoy pabalik sa mga Pariseo at natural na minamarkahan bilang layon sa konstruksiyong “tinanong sila.”
- source_word: ὁ Ἰησοῦς
  choice: ni Jesus
  rationale: Si Jesus ang gumagawa ng pandiwang aktibo; hinihingi ng pokus-layon na “tinanong” ang panandang aktor na “ni.”
