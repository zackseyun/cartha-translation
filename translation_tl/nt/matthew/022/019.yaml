base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: tl
  text: “Ipakita ninyo sa akin ang baryang pambayad ng buwis[a].” At dinalhan nila siya ng isang denario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buwis sa bawat tao” o “buwis ng sensus.” Ang salitang Griyego na κῆνσος ay tumutukoy sa isang buwis ng Imperyo ng Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Ipakita ninyo sa akin
  rationale: Tuwirang ipinapahayag ang pautos na anyong maramihan at pinananatili ang diwang ipakita ang bagay upang masuri.
- source_word: νόμισμα τοῦ κήνσου
  choice: baryang pambayad ng buwis
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa baryang ginagamit sa pagbabayad ng buwis, nang hindi labis na tinutukoy sa pangunahing teksto ang uri ng buwis.
- source_word: προσήνεγκαν
  choice: dinalhan
  rationale: Natural na salaysay sa Tagalog para sa pagdadala ng barya kay Jesus; pinananatili rin nito ang layong ipinahihiwatig ng αὐτῷ.
- source_word: δηνάριον
  choice: isang denario
  rationale: Pinananatili ang tiyak na makasaysayang pangalan ng Romanong barya sa halip na palitan ito ng di-tiyak na katumbas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “barya” bilang karaniwang salita at “denario” upang mapanatili ang makasaysayang katawagan.
