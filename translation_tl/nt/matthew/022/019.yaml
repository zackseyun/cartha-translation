  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “Ipakita ninyo sa akin” ay wastong maramihang pautos para sa ἐπιδείξατέ μοι; ang “baryang pambayad ng buwis” ay natural na tumutugon sa τὸ νόμισμα τοῦ κήνσου nang hindi labis na tinutukoy ang uri ng buwis. Ang “dinalhan nila siya ng isang denario” ay sapat na naghahatid ng προσήνεγκαν αὐτῷ δηνάριον.
