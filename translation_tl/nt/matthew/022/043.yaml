  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Paano nga siya tinatawag ni David na ‘Panginoon’ sa pamamagitan ng Espiritu, nang sabihin niya:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Ang pangkasalukuyang anyo sa Griyego ay makasaysayang pangkasalukuyan; natural itong isinasalaysay sa nakaraang panahunan sa modernong Tagalog.
- source_word: Πῶς οὖν
  choice: Kung gayon, paano
  rationale: Pinananatili nito ang tanong ng πῶς at ang paghihinuha o pagpapatuloy na ipinahihiwatig ng οὖν.
- source_word: Δαυὶδ
  choice: David
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Tagalog.
- source_word: ἐν πνεύματι
  choice: habang nasa ilalim ng kapangyarihan ng Espiritu
  rationale: Likas nitong ipinapahayag sa Tagalog na nagsalita si David sa saklaw o bisa ng Espiritu, habang hindi mahigpit na nilulutas kung esfera o ahensiya ang diin ng ἐν.
- source_word: καλεῖ αὐτὸν κύριον
  choice: siya tinatawag ni David na ‘Panginoon’
  rationale: Ang ‘Panginoon’ ang karaniwan at marangal na salin ng κύριος at pinananatili ang bigat ng titulo sa sipi mula sa Awit 110.
- source_word: λέγων
  choice: Sinabi ni David
  rationale: Ginawang likas na panimulang pahayag sa Tagalog ang participle upang malinaw na ipakilala ang kasunod na sipi.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι
  choice: Espiritu Santo ang malamang na tinutukoy, kaya malaking titik ang ‘Espiritu’
  alternative: sariling espiritu o espirituwal na kalagayan ni David
  rationale: Sa konteksto ng pagsipi ni Jesus sa Kasulatan, malamang na tumutukoy ito sa pagsasalita ni David sa bisa ng Espiritu. Hindi idinagdag ang salitang ‘Santo’ sa mismong teksto dahil wala ito sa Griyego.
- issue: Pagsasalin ng κύριος
  choice: Panginoon
  alternative: amo
  rationale: Ang ‘Panginoon’ ay nagpapanatili sa karaniwang kahulugan ng titulo at sa mesiyanikong bigat nito sa ugnayan sa Awit 110.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Inayos ang participle at ayos ng pangungusap upang maging malinaw sa Tagalog, ngunit pinanatili ang teolohikal na bigat at ang bahagyang ambiguwidad ng ἐν πνεύματι.
