base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: tl
  text: na nagsasabi, “Ano ang palagay ninyo tungkol sa Mesiyas?[a] Kaninong anak siya?” Sumagot sila sa kanya, “Ni David.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego ay Χριστός (Christos), na ginagamit dito bilang titulong mesiyaniko.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na sinasabi
  rationale: Ang pangkasalukuyang pandiwaring ito ng λέγω ang nagpapakilala sa sinabi ni Jesus. Ang “na sinasabi” ay malapit sa anyo ng Griyego at maayos na nag-uugnay sa naunang talata.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Ano ang palagay ninyo
  rationale: Ang δοκέω na may datibo ay humihingi ng pasiya o opinyon. Likas at magalang sa modernong Filipino ang “Ano ang palagay ninyo.”
- source_word: περὶ τοῦ χριστοῦ
  choice: tungkol sa Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulong mesiyaniko sa isang usapin tungkol sa inaasahang hari mula sa angkan ni David, kaya “Mesiyas” ang malinaw at angkop na salin.
- source_word: τίνος υἱός ἐστιν
  choice: Kaninong anak siya?
  rationale: Pinananatili nito ang tuwirang tanong tungkol sa anak o pinagmulan sa angkan, nang hindi nililinaw nang higit sa sinasabi ng Griyego.
- source_word: λέγουσιν αὐτῷ
  choice: Sumagot sila sa kanya
  rationale: Bagaman literal na “sinabi nila sa kanya,” gumaganap itong tugon sa tanong; natural sa Filipino ang “sumagot.” Isinalin sa nagdaang panahon ang makasaysayang pangkasalukuyan ng salaysay.
- source_word: Τοῦ Δαυίδ
  choice: Kay David
  rationale: Elliptical ang sagot sa Griyego at ipinahihiwatig ang “anak.” Karaniwang paraan sa Filipino ang “Kay David” bilang maikli at tuwirang sagot sa “Kaninong anak?”
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titular at malinaw na mesiyaniko ang gamit sa kontekstong Hudyo. Iniiwasan ng “Mesiyas” na mapagkamalan itong personal na pangalan habang pinananatili ang parehong titulong “pinahiran.”
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang magalang na maramihang “ninyo” at natural na “palagay.” Ang “Kay David” ay nagpapanatili sa maigsi at elliptical na sagot ng orihinal.
