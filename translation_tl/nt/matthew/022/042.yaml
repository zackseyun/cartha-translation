  source_fidelity: 'Tumpak ang pangunahing diwa: ang tanong ay tungkol sa Mesiyas, sa kaniyang pinagmulan bilang anak o inapo, at ang tugon ay tumutukoy kay David. Ang “Ni David” ay mas malapit sa elliptical genitive na Τοῦ Δαυίδ kaysa “Kay David.”'
  naturalness: Ang “na sinasabi” ay hindi likas bilang panimulang pandiwaring nag-uugnay sa kasunod na tuwirang sipi; “na nagsasabi” ang wastong anyo kung pananatilihin ang participial na ugnayan. Para sa “Kaninong anak siya?”, mas natural at maigsi ang sagot na “Ni David” kaysa “Kay David.”
  terminology: Ang “Mesiyas” ay angkop para sa titular na gamit ng Χριστός sa kontekstong ito. Ang talababa na nagbibigay ng “Cristo” bilang alternatibo ay maayos at hindi nagpapataw ng interpretasyong doktrinal.
  issues:
  - severity: medium
    issue: Hindi angkop ang aspekto sa “na sinasabi.”
    rationale: Ang λέγων ay participle na tumutukoy sa nagsasalita. Sa Filipino, “na nagsasabi” ang natural na katumbas sa ganitong estruktura; ang “na sinasabi” ay karaniwang nangangahulugang ‘na sinasabi [ng iba]’ o ‘that is being said.’
  - severity: medium
    issue: “Kay David” ay hindi ang pinakanatural na elliptical na sagot sa “Kaninong anak siya?”
    rationale: Ang “Ni David” ay karaniwang sagot na genitive/possessive sa Filipino at pinananatili ang maikling ellipsis ng Griyego. Ang “Kay David” ay mas karaniwang gamit para sa direksiyon o tagatanggap at tunog hindi ganap sa tanong na ito.
  revised_text: na nagsasabi, “Ano ang palagay ninyo tungkol sa Mesiyas?[a] Kaninong anak siya?” Sumagot sila sa kanya, “Ni David.”
