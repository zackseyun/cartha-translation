  source_fidelity: 'Tumpak ang pangunahing diwa ng sipi: isang lalaking namatay na walang anak, ang kapatid niyang lalaki, ang asawa ng namatay, at ang pagkakaroon ng supling para sa namatay na kapatid. Gayunman, ang sunod-sunod na “kanyang” sa draft ay maaaring maling maunawaang tumutukoy sa kapatid na siyang magpapakasal, lalo na sa huling “para sa kanyang kapatid.” Kailangang gawing hayag na ang asawa at ang kapatid na pinatutungkulan ay yaong namatay.'
  naturalness: Likas ang “Guro,” “Kung mamatay,” at “dapat pakasalan.” Mas malinaw at natural sa modernong Filipino ang pagtukoy na “ang asawa ng namatay” at “para sa namatay niyang kapatid” kaysa sa magkakasunod na panghalip. Ang “magkaroon ng supling” ay malinaw na katumbas ng idyomang “raise up offspring” sa kontekstong legal.
  terminology: Ang “batas ng levirato” ay angkop na teknikal na katawagan sa talababa. Sa pangunahing teksto, hindi kailangang ipasok ang teknikal na termino. Ang binagong talababa ay nagpapaliwanag ng natatanging tungkulin nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
  issues:
