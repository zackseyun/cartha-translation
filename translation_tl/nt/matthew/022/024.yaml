source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: tl
  text: na nagsasabi, “Guro, sinabi ni Moises, ‘Kung mamatay ang isang lalaki na walang mga anak, dapat pakasalan ng kapatid niyang lalaki ang asawa ng namatay[a] at magkaroon ng supling para sa namatay niyang kapatid.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas pormal na salin, “dapat gampanan ng kapatid ang tungkulin ng kapatid ng namatay na asawa sa balo.” Ang pandiwang Griyego ay partikular na tumutukoy sa pag-aasawa sa balo ng namatay na kapatid ayon sa batas ng levirato.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Likas at malinaw na katawagan kay Jesus bilang tagapagturo; hindi nito ipinapasok ang ibang diwa ng “Panginoon” o “amo.”
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: Kung mamatay ang isang lalaki nang walang anak
  rationale: Pinananatili ang partikular na lalaking tinutukoy sa kasong legal, habang ang τέκνα ay wastong isinasaling “anak” at hindi nililimitahan sa mga anak na lalaki.
- source_word: ἐπιγαμβρεύσει
  choice: dapat pakasalan
  rationale: Ipinahahayag ang pag-aasawang hinihingi sa bayaw ayon sa batas ng levirato. Ang “dapat” ay naghahatid ng puwersang legal ng anyong panghinaharap sa sipi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: ang kanyang asawa
  rationale: Tuwirang pinananatili ang reperensiya sa asawa ng namatay; malinaw sa konteksto na balo na siya.
- source_word: ἀναστήσει σπέρμα
  choice: magpatuloy ng lahi
  rationale: Natural na Filipino para sa idyomang tumutukoy sa pagkakaroon ng supling na kikilalaning nagpapatuloy sa linya ng namatay, nang hindi gumagamit ng artipisyal na “magbangon ng binhi.”
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: para sa kanyang kapatid
  rationale: Pinananatili ang diwang kapakinabangan o pagkakabilang sa namatay na kapatid na ipinahahayag ng datibo.
theological_decisions:
- issue: Kasariang tinutukoy sa halimbawang legal
  choice: “isang lalaki” at “kanyang kapatid na lalaki”
  alternative: “isang tao” at “kapatid”
  rationale: Ang batas na binabanggit ay sadyang nakabalangkas sa tungkulin ng lalaking kapatid ng namatay; pinananatili ito sa halip na gawing neutral ang kasarian.
- issue: Pagkakabilang ng magiging supling
  choice: “magpatuloy ng lahi para sa kanyang kapatid”
  alternative: “magkaroon ng anak sa kanyang kapatid” o “magbangon ng binhi para sa kanyang kapatid”
  rationale: Ipinakikita na ang supling ay ituturing na nagpapatuloy sa linya ng namatay, nang ipahiwatig na literal na anak ito ng namatay o gumamit ng hindi likas na pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kanyang” sa halip na mas mataas o makalumang “kaniyang.” Inilagay ang talababa sa “asawa,” kung saan pinakamalinaw ang kaugnayan nito sa natatanging uri ng pag-aasawang tinutukoy.
