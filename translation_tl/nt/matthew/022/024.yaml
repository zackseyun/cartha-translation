    issue: Malabo ang mga panghalip na “kanyang asawa” at “para sa kanyang kapatid.”
    rationale: Sa Griyego, ang mga panghalip sa dalawang parirala ay tumutukoy sa lalaking namatay. Sa Tagalog na draft, maaari itong basahin na asawa at kapatid ng lalaking kapatid na inatasang magpakasal, na bumabago sa ugnayang legal na inilalarawan.
  - severity: low
    issue: 'Ang pormal na alternatibo sa talababa ay hindi gaanong likas: “gampanan sa balo ang tungkulin...”'
    rationale: Mas malinaw ang pagpapahayag na ang kapatid ay gaganap ng tungkulin ng kapatid ng namatay na asawa sa balo.
