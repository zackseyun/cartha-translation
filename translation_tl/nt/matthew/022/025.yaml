id: MAT.22.25
reference: Matthew 22:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: tl
  text: May pitong magkakapatid na lalaki sa amin. Ang una ay nag-asawa at namatay, at wala siyang supling,[a] iniwan niya ang kanyang asawa sa kanyang kapatid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “walang binhi.” Dito, ang “binhi” ay tumutukoy sa anak, supling, o inapo.
    reason: lexical_alternative
  - marker: b
    text: 'Tumutukoy ito sa kaugalian ng pag-aasawang levirato: inaasahang pakakasalan ng kapatid ng namatay ang balo upang magkaroon ng anak para sa namatay. Tingnan ang Deuteronomio 25:5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: sa amin
  rationale: Ang παρά na may datibo ay nagpapahiwatig ng pagkanaroon o pakikisama sa pangkat. Likas at maikli sa Filipino ang “sa amin” para sa ganitong paglalahad.
- source_word: ἑπτὰ ἀδελφοί
  choice: pitong magkakapatid na lalaki
  rationale: Sa konteksto ng pag-aasawang levirato, tunay na magkakapatid na lalaki ang tinutukoy; nililinaw ito ng “magkakapatid na lalaki” nang hindi ipinapalagay na ang una ang pinakamatanda.
- source_word: ὁ πρῶτος
  choice: ang una
  rationale: Pagkakasunod-sunod ang ipinahihiwatig ng πρῶτος, hindi tiyak na ranggo ayon sa edad.
- source_word: γήμας
  choice: nag-asawa
  rationale: Ipinapakita ng aorist participle na naganap ang pag-aasawa bago ang pagkamatay. Natural sa Filipino ang tuwirang “nag-asawa.”
- source_word: ἐτελεύτησεν
  choice: namatay
  rationale: Tuwiran at malinaw itong katumbas ng pandiwang nangangahulugang mamatay o sumapit sa wakas ng buhay.
- source_word: μὴ ἔχων σπέρμα
  choice: dahil wala siyang anak
  rationale: Literal na “binhi” ang σπέρμα ngunit tumutukoy rito sa anak o supling. Mas karaniwan at malinaw sa modernong Filipino ang “anak,” samantalang pinananatili sa talababa ang literal at mas malawak na kahulugan.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: iniwan niya ang kanyang asawa
  rationale: Sa konteksto ng kamatayan, ang ἀφίημι ay nangangahulugang iniwan niya ang asawa pagkamatay niya, hindi diniborsiyo o pinabayaan.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: sa kanyang kapatid
  rationale: Tinutukoy ng datibo ang kapatid na lalaki na pinag-iwanan sa balo ayon sa kaugaliang ipinapalagay ng salaysay. Hindi idinagdag sa pangunahing teksto ang “upang pakasalan” sapagkat hindi iyon tahasang nakasaad sa Griyego.
theological_decisions:
- issue: Kung tahasang ilalagay sa pangunahing teksto ang pag-aasawang levirato
  choice: Panatilihing pahiwatig lamang ang kaugalian at isalin kung ano ang tahasang sinasabi ng Griyego.
  alternative: “iniwan niya ang kanyang asawa upang pakasalan ng kanyang kapatid”
  rationale: Ipinapalagay ng pahayag ang batas at kaugaliang nasa Deuteronomio 25:5, ngunit hindi tahasang nakasulat sa talata ang “upang pakasalan.” Ipinaliliwanag ito sa talababa upang hindi lumampas ang pangunahing salin sa pinagmulan.
translation_notes:
  register: Modernong Filipino na malinaw, tuwiran, at marangal. Ginamit ang karaniwang “anak” sa pangunahing teksto sa halip na ang mas literal ngunit maaaring malabong “binhi,” at ipinaliwanag ang legal-kultural na konteksto sa talababa. Ang lahat ng panandang talababa ay nakalagay mismo sa pangunahing teksto.
