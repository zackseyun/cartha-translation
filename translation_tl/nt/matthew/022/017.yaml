  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: tl
  text: Kaya sabihin ninyo sa amin, ano sa palagay mo? Pinahihintulutan bang ibigay kay Cesar ang buwis sa ulo, o hindi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔξεστιν
  choice: Ipinahihintulot ba ng Kautusan
  rationale: Sa konteksto ng tanong sa isang guro tungkol sa relihiyoso at legal na katumpakan, ipinahahayag nito ang ideya ng pagiging pinahihintulutan ayon sa Kautusan, hindi lamang ayon sa batas ng Roma.
- source_word: δοῦναι
  choice: ibigay
  rationale: Pinananatili ang karaniwang kahulugan ng aorist infinitive na 'magbigay' at ang sadyang pagkakagamit nito sa tanong, sa halip na awtomatikong gawing 'magbayad.'
- source_word: κῆνσον
  choice: buwis
  rationale: Tumutukoy ito sa census o poll tax na ipinapataw ng Roma; natural at madaling maunawaan ang 'buwis' sa Filipino, bagaman hindi nito espesipikong binabanggit ang uri.
- source_word: Καίσαρι
  choice: kay Cesar
  rationale: Ang 'Cesar' ang nakaugaliang anyong Filipino para sa titulo at pangalan ng Romanong emperador.
- source_word: τί σοι δοκεῖ
  choice: ano sa palagay mo?
  rationale: Natural na Filipino para sa paghingi ng pasya o opinyon ng isang tao, habang pinananatili ang isahang 'mo.'
theological_decisions:
- issue: Saklaw ng pagiging 'lawful' (ἔξεστιν)
  choice: Ipinahihintulot ba ng Kautusan
  alternative: Naaayon ba sa batas / Nararapat ba
  rationale: Nililinaw ang relihiyosong puwersa ng patibong na tanong nang hindi tinutukoy kung ano ang magiging sagot ni Jesus; sa konteksto, ang usapin ay hindi lamang pahintulot ng batas Romano.
- issue: Pagbibigay o pagbabayad ng buwis
  choice: ibigay ... ang buwis
  alternative: bayaran ... ang buwis
  rationale: Pinananatili ang leksikal na anyong δοῦναι ('ibigay'), na mahalaga sa kaugnay na sagot sa talata 21 at hindi dapat tahimik na gawing teknikal na 'magbayad.'
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang paglipat mula pangmaramihang 'ninyo/amin' tungo sa isahang 'mo' na nasa Griyego.
