reference: Matthew 22:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: tl
  text: Muli siyang nagsugo ng iba pang mga alipin[a] at sinabi, “Sabihin ninyo sa mga inanyayahan, ‘Tingnan ninyo, naihanda ko na ang aking handaan[b]. Nakatay na ang aking mga toro at mga pinatabang hayop, at handa na ang lahat. Halina kayo sa kasalan[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iba pang mga lingkod.” Ang salitang Griego na doulous ay maaaring mangahulugang “mga alipin” o “mga lingkod,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “pagkain.” Ang salitang Griego ay tumutukoy sa isang inihandang pagkain, na madalas ay mas maagang pangunahing pagkain.
    reason: lexical_alternative
  - marker: c
    text: O “sa pagdiriwang ng kasalan.” Maaaring tumukoy ang pangmaramihang salitang Griego sa buong pagdiriwang ng kasalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Likas at maikling panandang nagsasaad na inulit ang kilos.
- source_word: ἀπέστειλεν
  choice: nagsugo
  rationale: Ang “nagsugo” ay angkop sa pagpapadala ng mga tauhan na may dalang mensahe at natural sa salaysay.
- source_word: ἄλλους δούλους
  choice: iba pang mga alipin
  rationale: Sa sambahayan ng isang hari sa talinghaga, malinaw ang kalagayang nasa ilalim ng pagmamay-ari at awtoridad; pinananatili ng “alipin” ang lakas ng δοῦλος, habang inilalahad sa talababa ang posibleng “mga lingkod.”
- source_word: λέγων
  choice: at sinabi
  rationale: Natural na isinasalin sa Filipino bilang koordinadong pandiwa upang ipakilala ang ipinapasabing mensahe.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Sabihin ninyo sa mga inanyayahan
  rationale: Ipinahihiwatig ng perpektong balintiyak na pandiwari ang mga taong naanyayahan na at nananatiling kabilang sa mga inanyayahan.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Makabagong panawag-pansin na nagpapanatili sa tuwirang lakas ng Ἰδοὺ nang hindi makaluma.
- source_word: τὸ ἄριστόν μου
  choice: ang aking handaan
  rationale: Tumutukoy sa inihandang pagkain, marahil ay mas maagang pangunahing kainan; sa konteksto ng kasalan, mas natural ang “handaan” kaysa sa literal ngunit hindi tiyak na oras ng “tanghalian.”
- source_word: ἡτοίμακα
  choice: naihanda ko na
  rationale: Pinananatili ng “na…na” ang natapos na paghahanda at ang kasalukuyang bunga nito.
- source_word: οἱ ταῦροί μου
  choice: ang aking mga toro
  rationale: Tuwirang tumutukoy sa mga lalaking baka at iniiwasang ipakahulugan na tiyak na kinastrang hayop ang tinutukoy.
- source_word: τὰ σιτιστὰ
  choice: mga pinatabang baka
  rationale: Ang pang-uri ay tumutukoy sa mga hayop na sadyang pinakain at pinataba para katayin; ipinahahayag ng “baka” ang konteksto nang hindi nililimitahan ang mga ito sa guya.
- source_word: τεθυμένα
  choice: Nakatay na
  rationale: Sa konteksto ng pagkain, tumutukoy ito sa pagkatay ng mga hayop, hindi kinakailangang sa rituwal na paghahandog; ipinakikita ng “na” ang natapos na kilos at kasalukuyang pagiging handa.
- source_word: καὶ πάντα ἕτοιμα
  choice: at handa na ang lahat
  rationale: Natural at tuwirang Filipino na pinananatili ang malawak na saklaw ng πάντα.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Halina kayo sa kasalan
  rationale: Ang “halina kayo” ay buhay at marangal na paanyaya. Maaaring tumukoy ang pangmaramihang γάμους sa kasalan o sa kabuuan ng mga pagdiriwang nito.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa sambahayan ng hari
  choice: mga alipin
  alternative: mga lingkod
  rationale: Mas malinaw sa “mga alipin” ang panlipunang kalagayan at lubos na pagpapasakop sa awtoridad ng hari. Gayunman, dahil maaari ring idiomatikong tukuyin ng salita ang mga lingkod ayon sa konteksto, pinanatili ang alternatibo sa talababa nang hindi dinaragdagan ng doktrinal na kahulugan.
- issue: Saklaw ng τοὺς γάμους
  choice: sa kasalan
  alternative: sa pagdiriwang ng kasalan
  rationale: Ang pangmaramihang anyo ay maaaring tumukoy sa kasalan bilang buong pagdiriwang. Ang maikli at natural na “sa kasalan” ay sapat sa pangunahing teksto, habang nililinaw sa talababa ang mas malawak na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagsugo,” “halina,” at tuwirang pagsasalita upang mapanatili ang anyong salaysay at paanyaya, habang iniwasan ang sobrang makaluma o teknikal na bokabularyo.
