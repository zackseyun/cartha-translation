  source_fidelity: 'Tapat ang salin sa Griyego: naipapahayag ang banayad na pang-ugnay na δέ, ang tuwirang pananalita, at ang utos na Ἀγαπήσεις. Napananatili ang tatluhang καρδία, ψυχή, at διάνοια, pati ang paulit-ulit na kabuuan sa bawat parirala.'
  naturalness: Natural at marangal ang modernong Filipino na “Ibigin mo ang Panginoon mong Diyos nang buong puso mo, nang buong kaluluwa mo, at nang buong pag-iisip mo.” Ang “Ibigin mo” ay bahagyang mataas na rehistro ngunit angkop sa siping pangkasulatan at malinaw pa rin sa kasalukuyang gamit.
  terminology: Ang “Panginoon mong Diyos,” “puso,” “kaluluwa,” at “pag-iisip” ay angkop at magkakahiwalay na tumutugon sa mga pangunahing katawagang Griyego. Ang talababa ay maingat na nagpapakita ng saklaw ng ψυχή at ng alternatibo para sa διάνοια nang hindi nagpapataw ng doktrinal na pagbasa.
