reference: Matthew 22:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ibigin mo ang Panginoon mong Diyos nang buong puso mo, nang buong kaluluwa mo, at nang buong pag-iisip mo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaluluwa” ay maaari ring tumukoy sa “buhay” o “sarili,” at ang “pag-iisip” ay maaari ring isaling “pang-unawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa usapan; natural sa Filipino ang “At” at hindi ito nagpapahiwatig ng matinding pagsalungat.
- source_word: ἔφη αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Tuwirang inilalarawan ng φημί ang pagsasalita; hindi idinaragdag ang di-tiyak na diwang “sumagot.”
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Ang anyong panghinaharap ay gumaganap bilang utos sa siping ito mula sa Deuteronomio. Ang “Ibigin mo” ay natural, marangal, at may malinaw na lakas ng utos.
- source_word: κύριον τὸν θεόν σου
  choice: ang Panginoon mong Diyos
  rationale: Pinananatili ang tipanang katawagang “Panginoon” at isinasalin ang possessive construction sa natural na pariralang Filipino.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: nang buong puso mo
  rationale: Bagaman literal na “sa buong puso mo,” ang “nang buong puso mo” ang natural na Filipino para sa paraan at kabuuan ng pag-ibig.
- source_word: ψυχῇ
  choice: kaluluwa
  rationale: Pinananatili nito ang pagkakaiba sa puso at pag-iisip at ang tradisyonal na diwa ng buong buhay o sarili, nang hindi ito nililiitan sa isang teknikal na kahulugan.
- source_word: διανοίᾳ
  choice: pag-iisip
  rationale: Natural nitong ipinahahayag ang kakayahang mag-isip at umunawa; mas karaniwan ito sa modernong Filipino kaysa “kaisipan” sa ganitong konstruksyon.
theological_decisions:
- issue: Paglalahad sa tatluhang “puso ... kaluluwa ... pag-iisip”
  choice: Panatilihing magkakahiwalay ang tatlong katawagan
  alternative: Pagsamahin ang mga ito bilang “buong pagkatao”
  rationale: Tapat ito sa mga natatanging salitang καρδία, ψυχή, at διάνοια at pinananatili ang lawak at tensiyon ng mismong sipi nang walang dagdag na doktrinal na pagpapakahulugan.
- issue: Pagpapakahulugan sa ψυχή
  choice: kaluluwa
  alternative: buhay o sarili
  rationale: Ang “kaluluwa” ang pinakapamilyar sa anyo ng dakilang utos, ngunit maaaring saklawin ng ψυχή ang buhay o sarili; nililinaw ito sa talababa upang hindi gawing labis na teknikal ang kahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Ibigin mo” upang mapanatili ang anyo at bigat ng utos, at ang paulit-ulit na “nang buong” upang maging malinaw ang kabuuang pagtalima.
