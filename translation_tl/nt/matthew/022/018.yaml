  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: tl
  text: Ngunit batid ni Jesus ang masama nilang balak[a], at sinabi niya, “Bakit ninyo ako sinusubok[b], mga mapagkunwari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang kasamaan” o “kanilang malisya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tinutukso.” Ang pandiwang Griyego ay maaaring mangahulugang “subukin,” “tangkaing ilagay sa pagsubok,” o “tuksuhin,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: batid
  rationale: Ipinahahayag ng aorist participle na alam o napagtanto ni Jesus ang kanilang motibo bago siya nagsalita. Ang “batid” ay maikli, natural, at marangal sa modernong Filipino.
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ang δέ ng banayad na pagsalungat sa mapanlinlang nilang paglapit kay Jesus.
- source_word: πονηρίαν
  choice: masama nilang balak
  rationale: Maaaring tumukoy ang πονηρία sa kasamaan, masamang hangarin, o malisyosong layunin. Sa konteksto, malinaw na ang tinutukoy ay ang masamang motibo sa likod ng kanilang tanong.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Karaniwan at natural na salin ng aorist ng λέγω sa salaysay.
- source_word: Τί
  choice: Bakit
  rationale: Sa ganitong gamit, idiomatiko ang τί bilang tanong tungkol sa dahilan; “Bakit” ang likas na katumbas sa Filipino.
- source_word: πειράζετε
  choice: sinusubok
  rationale: Saklaw ng πειράζω ang pagsubok, pagtatangka, o panunukso. Ang “sinusubok” ay nagpapanatili ng lawak ng salita habang akma sa pagtatangka nilang hulihin si Jesus sa kaniyang sasabihin.
- source_word: ὑποκριταί
  choice: mga mapagkunwari
  rationale: Tumutukoy ito sa mga taong nagkukunwaring tapat habang itinatago ang masamang motibo. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na “mga hipokrito.”
theological_decisions:
- issue: Ang pagkaalam ni Jesus sa nakatagong motibo ng mga sumasalungat sa kaniya
  choice: Inilalarawan si Jesus na batid ang masama nilang balak.
  alternative: Napansin ni Jesus ang kanilang kasamaan o malisya.
  rationale: Pinananatili ng salin ang tahasang pahayag na nakilala ni Jesus ang moral na katangian ng kanilang layunin, nang hindi ito pinalalawak tungo sa isang doktrinang hindi mismong ipinapahayag ng talata.
- issue: Ang diwa ng πειράζετε
  choice: sinusubok
  alternative: tinutukso
  rationale: Sa konteksto, sinusubukan nilang mabitag si Jesus sa kaniyang sagot. Hindi inaalis ng “sinusubok” ang masamang layunin, ngunit hindi rin nito nililimitahan ang pandiwa sa moral na panunukso lamang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “masama nilang balak” upang likas na maipahayag ang kontekstuwal na diwa ng πονηρία, at “mga mapagkunwari” bilang madaling maunawaang katumbas ng ὑποκριταί. Ang ayos na “batid ... kaya sinabi” ay natural sa Filipino at pinananatili ang ugnayan ng participle at pangunahing pandiwa.
