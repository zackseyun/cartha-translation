  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: tl
  text: “Ako ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob.” Hindi siya ang Diyos ng mga patay, kundi ng mga buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ang Diyos ay hindi ang Diyos ng mga patay, kundi ng mga buhay.” Sa ilang manuskritong Griyego, inuulit ang “Diyos” sa ikalawang pangungusap; ginagamit sa pangunahing teksto ang “siya” para sa mas natural na Filipino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ako ang
  rationale: Sa Filipino, ang hulma na “Ako ang Diyos…” ang natural na tuwirang pagpapakilala sa sarili. Nasa kasalukuyang anyo ito at hindi dinaragdagan ng paliwanag.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob
  rationale: Pinananatili ang tatlong ulit na pagbanggit sa “Diyos” upang maingatan ang diin at retorikal na anyo ng Griyego.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Hindi siya ang Diyos
  rationale: Natural sa modernong Filipino ang panghalip na “siya,” na malinaw na tumutukoy sa Diyos na kababanggit lamang. Nananatili sa talababa ang mas literal na pag-uulit.
- source_word: νεκρῶν
  choice: ng mga patay
  rationale: Ang pang-uri sa maramihang anyo ay ginagamit bilang pangngalan; ang “mga patay” ang maikli at likas na katumbas sa Filipino.
- source_word: ζώντων
  choice: ng mga buhay
  rationale: Pinananatili nito ang maikli at tuwirang pagsalungat sa “mga patay” nang hindi nagdaragdag ng paliwanag tungkol sa kalagayan nila.
theological_decisions:
- issue: Ang ipinahihiwatig ng patuloy na pagiging buhay ng mga patriyarka sa harap ng Diyos sa argumento ni Jesus tungkol sa muling pagkabuhay
  choice: Isinalin nang tuwiran bilang “Hindi siya ang Diyos ng mga patay, kundi ng mga buhay.”
  alternative: Hindi siya ang Diyos ng mga taong patay, kundi ng mga taong patuloy na nabubuhay sa kanya.
  rationale: Iniiwasan ng salin ang pagpapalawak tungo sa tahasang paliwanag tungkol sa muling pagkabuhay o kalagayan sa pagitan ng kamatayan at muling pagkabuhay. Pinananatili nito ang lakas at tensiyong teolohikal ng mismong pahayag.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang retorikal na pag-uulit sa sipi, samantalang ginamit ang panghalip sa kasunod na pangungusap para sa malinaw at likas na daloy.
