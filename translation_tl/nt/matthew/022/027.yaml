  text: Last of all[a], the woman died.
translation:
  language: tl
  text: Pagkatapos nilang lahat[a], namatay rin ang babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa wakas, namatay rin ang babae”; sa Griyego, “Pagkatapos/sa huli sa kanilang lahat, namatay ang babae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Sa huli
  rationale: Sa pagkakagamit na kasama ang πάντων, ipinapahayag nito ang panghuling pangyayari sa pagkakasunod-sunod; natural itong tumbasan ng “sa huli.”
- source_word: δὲ
  choice: hindi hiwalay na isinalin
  rationale: Mahinang pang-ugnay ang δέ, at likas nang naipahihiwatig sa Filipino ng paglipat sa panghuling pangyayari sa pariralang “Sa huli sa kanilang lahat.”
- source_word: πάντων
  choice: sa kanilang lahat
  rationale: Tumutukoy ang pangmaramihang genitive sa lahat ng naunang binanggit na magkakapatid; nililinaw ng “kanilang” ang reperensiya nang hindi binabago ang diwa.
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at payak na katumbas ito ng aorist na nagsasaad ng pagkamatay, nang walang eupemismo.
- source_word: ἡ γυνή
  choice: ang babae
  rationale: Maaaring mangahulugang “babae” o “asawang babae” ang γυνή. Sa sitwasyong kinasangkutan ng sunod-sunod na pag-aasawa, pinananatili ng “ang babae” ang mismong reperensiya ng Griyego nang hindi siya iniuugnay sa iisang asawa lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak, marangal, at tuwiran. Ginamit ang “sa kanilang lahat” upang maipahayag nang malinaw ang idyomang ὕστερον πάντων at ang pagtukoy nito sa lahat ng naunang binanggit na lalaki.
