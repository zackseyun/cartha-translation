source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: tl
  text: Pagkatapos, umalis ang mga Pariseo at nag-usap-usap kung paano nila siya mabibitag sa kanyang sasabihin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagbalak sila kung paano siya mabibitag sa pamamagitan ng kanyang sasabihin.”
    reason: Alternatibong leksikal at sintaktikong paglalahad ng συμβούλιον ἔλαβον at ἐν λόγῳ.
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsasaad ito ng kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa modernong Tagalog.
- source_word: πορευθέντες
  choice: umalis
  rationale: Ang aorist participle ay bahagi ng sunod-sunod na kilos; ipinahahayag ng “umalis” ang pagpunta nila nang hindi gumagamit ng pilit na literal na anyo.
- source_word: οἱ Φαρισαῖοι
  choice: ang mga Pariseo
  rationale: Karaniwang katawagan sa Tagalog para sa grupong Φαρισαῖοι, na may pangmaramihang panandang “mga.”
- source_word: συμβούλιον ἔλαβον
  choice: nag-usap-usap
  rationale: Ipinahahayag ng idyoma ang sama-samang pagsangguni o pagbubuo ng plano. Pinananatiling hindi labis na interpretatibo ang parirala, habang nililinaw ng kasunod na sugnay ang masamang layunin.
- source_word: ὅπως
  choice: kung paano
  rationale: Ipinakikilala nito ang nilalaman at layunin ng kanilang pagsangguni; natural ang “kung paano” kasunod ng “nag-usap-usap.”
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang panghalip na tumutukoy kay Jesus.
- source_word: παγιδεύσωσιν
  choice: mabibitag
  rationale: Pinananatili ang larawang mula sa pagbibitag o pagsilo at malinaw na ipinahahayag ang kanilang mapanirang layunin.
- source_word: ἐν λόγῳ
  choice: sa kanyang sasabihin
  rationale: Tumutukoy ang λόγος dito sa pananalita o bibigkasing sagot. Ang “sa kanyang sasabihin” ay likas sa Tagalog at pinananatili ang ideya na ang bitag ay nakasalalay sa mismong pananalita ni Jesus.
theological_decisions:
- issue: Antas ng poot na ipinahahayag sa συμβούλιον ἔλαβον
  choice: Isinalin nang medyo neutral bilang “nag-usap-usap,” at hinayaang ang “mabibitag” ang tahasang magpahayag ng masamang layunin.
  alternative: “nagbalak” o “nagsabwatan”
  rationale: Malinaw sa layuning sugnay ang kanilang poot, ngunit hindi kailangang ipasok ang buong negatibong diin sa idyomang συμβούλιον ἔλαβον mismo.
- issue: Paraan ng pagbibitag sa ἐν λόγῳ
  choice: “sa kanyang sasabihin”
  alternative: “sa pamamagitan ng kanyang sasabihin”
  rationale: Kapuwa posible ang larangan o paraan ng pagbibitag. Pinananatili ng pangunahing salin ang maikli at likas na pahayag, habang inilalahad sa talababa ang mas hayag na instrumentong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mabibitag” upang mapanatili ang talinghaga ng pagsilo, at iniwasan ang mas mabigat na “nagsabwatan” upang hindi dagdagan ang ipinahahayag ng unang parirala.
