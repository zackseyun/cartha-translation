    issue: Ang “masasama man o mabubuti” ay nagiging alternatibo sa halip na inklusibong pares.
    rationale: Ang τε καὶ ay nag-uugnay sa dalawang pangkat bilang kapwa natipon. Ang “kapwa masasama at mabubuti” ay nagpapanatili ng saklaw at diin ng Griyego.
  - severity: low
    issue: Bahagyang hindi natural ang “Lumabas sa mga daan,” at maaaring malabo ang “lahat ng natagpuan nila.”
    rationale: Ang “Lumabas … patungo sa mga daan” ay malinaw na naghahayag ng ἐξελθόντες εἰς τὰς ὁδούς, samantalang ang pagdaragdag ng “taong” ay nililinaw ang personal na saklaw ng πάντας χωρίς pagbabago sa kahulugan.
  - severity: low
    issue: Ang “nakahilig sa hapag” ay maaaring maunawaang simpleng nakasandal sa mesa.
    rationale: Ang ἀνακειμένων ay ang nakaugaliang paghilig o pagre-recline sa isang handaan; ang “nakahilig habang kumakain” ay mas malinaw na naghahatid ng konteksto nito.
