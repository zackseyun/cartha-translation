- from: Lumabas sa mga daan ang mga aliping iyon at tinipon ang lahat ng natagpuan nila, masasama man o mabubuti. At napuno ng mga panauhing nakahilig sa hapag[b] ang bulwagan ng kasalan.[a]
  to: Lumabas ang mga aliping iyon patungo sa mga daan at tinipon ang lahat ng taong natagpuan nila, kapwa masasama at mabubuti. At napuno ng mga panauhing nakahilig habang kumakain[b] ang bulwagan ng kasalan.[a]
  rationale: Pinalitan ang pang-ugnay na “man o” ng “kapwa … at …” upang tumpak na maipakita ang inklusibong τε καὶ. Pinakinis din ang panimulang kilos at nilinaw ang mga taong tinipon. Inayos ang paglalarawan sa mga panauhin upang maihatid ang posisyong pang-piging ng ἀνακειμένων nang natural sa modernong Filipino Tagalog. Nananatili ang kontekstuwal na “bulwagan ng kasalan,” kasama ang talababa na nagpapanatili ng saklaw ng γάμος.
