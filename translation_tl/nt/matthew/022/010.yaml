base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: tl
  text: Lumabas ang mga aliping iyon patungo sa mga daan at tinipon ang lahat ng taong natagpuan nila, kapwa masasama at mabubuti. At napuno ng mga panauhing nakahilig habang kumakain[b] ang bulwagan ng kasalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang kasal”; maaaring tumukoy rito sa piging ng kasal o sa bulwagang pinagdarausan nito, yamang sinasabing napuno ito ng mga kumakain.
    reason: lexical_alternative
  - marker: b
    text: Noong panahong iyon, karaniwang nakahilig ang mga panauhin sa paligid ng hapag sa isang pormal na piging.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili nito ang kalagayang panlipunan ng mga tauhan bilang mga taong nasa ilalim ng kapangyarihan ng hari, sa halip na palambutin ito bilang simpleng mga lingkod.
- source_word: ὁδοὺς
  choice: mga daan
  rationale: Malawak at likas na katumbas ito ng mga pampublikong daanan kung saan makakakita ng mga tao; hindi ipinapalagay na mga lansangang panlungsod lamang ang tinutukoy.
- source_word: συνήγαγον πάντας οὓς εὗρον
  choice: tinipon ang lahat ng natagpuan nila
  rationale: Tuwirang ipinahahayag ang ganap na saklaw ng πάντας at ang kilos ng pagtitipon.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: masasama man o mabubuti
  rationale: Pinananatili ang malinaw na moral na pagsalungat at ang di-pamimiling pagtitipon, sa natural na anyong Tagalog.
- source_word: γάμος
  choice: bulwagan ng kasalan
  rationale: Bagaman literal na tumutukoy ang salita sa kasal o piging ng kasal, ang sinasabing napuno ng mga nakahilig upang kumain ay malinaw na isang lugar; ginagawang hayag ng salin ang ipinahihiwatig ng konteksto.
- source_word: ἐπλήσθη
  choice: napuno
  rationale: Natural at tuwirang katumbas ng pasibong pandiwang nagsasaad na naging punô ang lugar.
- source_word: ἀνακειμένων
  choice: mga panauhing nakahilig sa hapag
  rationale: Ipinahahayag nito kapwa ang mga taong dumalo at ang nakaugaliang posisyon sa pormal na pagkain noong panahong iyon.
theological_decisions:
- issue: Moral na paglalarawan sa mga tinipon
  choice: masasama man o mabubuti
  alternative: masama man o mabuti
  rationale: Pinananatili ng pangmaramihang anyo ang pagtukoy sa mga tao at ang moral na diin ng Griyego, nang hindi ipinapaliwanag nang higit sa teksto ang kahulugan nito sa kabuuan ng talinghaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga alipin” upang huwag palambutin ang δοῦλοι, at ang “bulwagan ng kasalan” upang maging natural ang larawang napuno ng mga panauhin, habang inilalahad sa talababa ang mas literal na anyo.
