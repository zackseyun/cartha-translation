  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: tl
  text: At isinugo niya ang kanyang mga lingkod[a] upang tawagin ang mga inanyayahan[b] sa handaan ng kasal[c], at ayaw nilang pumunta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga alipin.” Maaaring mangahulugan ang salitang Griyego ng mga lingkod o mga alipin.
    reason: lexical_alternative
  - marker: b
    text: O, “mga tinawag na.” Magkaugnay ang mga salitang Griyego para sa “tawagin” at “mga inanyayahan”; dito, tumutukoy ang huli sa mga naanyayahan na noon pa.
    reason: lexical_alternative
  - marker: c
    text: O, “sa piging ng kasal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: isinugo
  rationale: Likas na katumbas ng aorist na ἀποστέλλω at angkop sa pagpapadala ng mga kinatawan upang gumanap ng isang atas.
- source_word: δούλους
  choice: mga lingkod
  rationale: Maaaring tumukoy ang δοῦλος sa mga alipin o lingkod. Dito, ang diin ay nasa kanilang tungkulin bilang mga isinugo ng hari, kaya malinaw at natural ang “mga lingkod,” habang inilalagay sa talababa ang alternatibo.
- source_word: καλέσαι
  choice: upang tawagin
  rationale: Ipinahahayag ng infinitive ang layunin ng pagsusugo. Pinananatili ng “tawagin” ang karaniwang kahulugan ng καλέω, bagaman hindi ganap na maipapakita sa natural na Tagalog ang pag-uulit ng salitang-ugat sa κεκλημένους.
- source_word: κεκλημένους
  choice: mga inanyayahan
  rationale: Ang perfect passive participle ay tumutukoy sa mga taong naanyayahan na noon. Pinakamalinaw sa konteksto ng kasalan ang “mga inanyayahan.”
- source_word: εἰς τοὺς γάμους
  choice: sa handaan ng kasal
  rationale: Sa kontekstong ito, ang pangmaramihang γάμοι ay tumutukoy sa pagdiriwang o piging ng kasal, hindi lamang sa seremonya.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: ayaw nilang pumunta
  rationale: Tuwirang ipinahahayag nito ang kawalan nila ng pagnanais o pagkukusang pumunta, nang hindi pinatitindi tungo sa mas mariing “tumanggi sila.”
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa talinghaga
  choice: mga lingkod
  alternative: mga alipin
  rationale: Hindi itinatanggi ng salin ang posibleng kalagayang alipin, ngunit sa pangungusap na ito ang kanilang papel bilang mga tauhan at sugo ng hari ang nasa unahan. Ang alternatibo ay pinananatili sa talababa upang hindi alisin ang saklaw ng salitang Griyego.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “isinugo” upang ipakita ang atas, “handaan ng kasal” bilang karaniwang katawagan sa wedding feast, at “ayaw nilang pumunta” upang mapanatili ang diin sa kanilang kalooban. Pinanatili rin ang ikalawang καί bilang “at” sa halip na gawing “ngunit,” upang hindi dagdagan ang tahasang pagsalungat na wala sa anyong Griyego.
