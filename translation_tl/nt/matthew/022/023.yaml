  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: tl
  text: Noong araw na iyon, lumapit sa kanya ang mga Saduseo, na nagsasabing walang muling pagkabuhay, at tinanong siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Nang araw na iyon
  rationale: Likas na panandang temporal sa modernong Tagalog na malinaw na nag-uugnay sa pangyayari sa araw na binanggit sa naunang salaysay.
- source_word: προσῆλθον αὐτῷ
  choice: lumapit sa kanya
  rationale: Tumpak at natural na salin ng paglapit kay Jesus; hindi kailangan ang mas pormal na pananalitang gaya ng “dumulog.”
- source_word: Σαδδουκαῖοι
  choice: mga Saduseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng grupong Judio, na may pantukoy na “mga” para sa maramihan.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: na nagsasabing walang muling pagkabuhay
  rationale: Ipinahahayag nito ang paniniwalang kaugnay ng mga Saduseo nang hindi ipinapalagay na sinasabi nila mismo ang mga salitang ito kay Jesus sa sandaling iyon.
- source_word: ἀνάστασιν
  choice: muling pagkabuhay
  rationale: Karaniwan, malinaw, at teolohikal na angkop na salin ng ἀνάστασις sa kontekstong tumutukoy sa pagkabuhay ng mga patay.
- source_word: ἐπηρώτησαν αὐτόν
  choice: tinanong siya
  rationale: Natural na Tagalog para sa pagtatanong kay Jesus. Ang mapanghamong katangian ng tanong ay lilitaw sa kasunod na konteksto at hindi kailangang idagdag sa pandiwa.
theological_decisions:
- issue: Paglalarawan sa pagtanggi ng mga Saduseo sa muling pagkabuhay
  choice: na nagsasabing walang muling pagkabuhay
  alternative: habang sinasabing walang muling pagkabuhay
  rationale: Ang “na nagsasabing” ay angkop na naglalarawan sa kinikilalang paninindigan ng mga Saduseo at hindi ipinakikitang sinasang-ayunan ito ng tagapagsalaysay. Iniiwasan din nitong gawing tiyak na tuwirang sinabi nila iyon sa mismong pagkakataong ito, bagay na hindi tahasang nililinaw ng participle.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Nang araw na iyon” at “tinanong siya” para sa likas na daloy ng salaysay; pinanatili ang terminong “muling pagkabuhay” dahil pamilyar at tumpak ito sa konteksto.
