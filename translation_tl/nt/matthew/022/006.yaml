  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: tl
  text: Ngunit dinakip ng iba naman ang kanyang mga alipin[a], pinagmalupitan sila, at pinatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga lingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ngunit … ang iba naman
  rationale: Ang “iba naman” ay tumutukoy sa natitirang mga inimbitahan, samantalang ipinahihiwatig ng “ngunit” ang banayad na pagsalungat ng δέ sa ginawa ng mga nauna.
- source_word: κρατήσαντες
  choice: dinakip
  rationale: Ipinapahayag ng aorist participle ang pagdakip na nauna sa pagmamalupit at pagpatay. Likas sa Filipino ang magkakasunod na pandiwa, at malinaw na nauna ang “dinakip” dahil sa ayos ng pangungusap.
- source_word: τοὺς δούλους αὐτοῦ
  choice: ang kanyang mga alipin[a]
  rationale: Ang δοῦλος ay maaaring tumukoy sa alipin o lingkod. Pinananatili ng “alipin” ang nakataling katayuang panlipunan ng mga tauhan ng hari, habang inilalagay sa talababa ang mas malawak at mas banayad na “lingkod.”
- source_word: ὕβρισαν
  choice: pinagmalupitan sila
  rationale: Saklaw nito ang marahas at kahiya-hiyang masamang pagtrato, hindi lamang panlalait. Likas at malinaw ito sa makabagong Filipino.
- source_word: ἀπέκτειναν
  choice: pinatay
  rationale: Tuwiran at natural na katumbas ito ng ἀποκτείνω at hindi nagdaragdag ng legal na diwang maaaring taglayin ng “pinaslang” o “minurder.”
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος sa konteksto ng talinghaga
  choice: mga alipin
  alternative: mga lingkod
  rationale: Bilang mga tauhang isinugo ng hari, taglay nila ang katayuang ipinahihiwatig ng δοῦλος. Hindi ito ginawang teolohikal na titulo; pinanatili naman sa talababa ang lehitimong alternatibong “mga lingkod.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na pagkakasunod ng mga pandiwa upang natural na maipakita ang kilos ng participle at ng mga pangunahing pandiwa nang hindi binabago ang ugnayan ng mga ito.
