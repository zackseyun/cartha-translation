  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: tl
  text: Sa dalawang utos na ito nakasalalay ang buong Kautusan at ang mga Propeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Kautusan at ang mga Propeta” ay kinikilalang katawagan para sa kabuuang patotoo ng Kasulatan; sinasabi rito na nakasalalay sa dalawang utos na ito ang kabuuan ng turo nito.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: Sa dalawang utos na ito
  rationale: Bagaman ἐν ay karaniwang nangangahulugang “sa” o “nasa,” kasama ng κρέμαται ang parirala ay likas na tumutukoy sa saligan na pinagsasalalayan. Ang “Sa dalawang utos na ito nakasalalay” ay natural sa Filipino at pinananatili ang larawan ng pagdepende.
- source_word: ὅλος ὁ νόμος
  choice: ang buong Kautusan
  rationale: Ipinahahayag ng ὅλος ang kabuuan. Ginamit ang malaking titik sa “Kautusan” sapagkat tumutukoy ang νόμος sa Torah o sa kinikilalang bahagi ng Kasulatan, hindi lamang sa batas bilang pangkalahatang konsepto.
- source_word: κρέμαται
  choice: nakasalalay
  rationale: Ang literal na diwa ay “nakabitin,” ngunit sa Filipino ang “nakasalalay sa” ay malinaw at likas na naghahatid ng metapora ng pagdepende nang hindi ginagawang tahasang paliwanag ang salin.
- source_word: καὶ οἱ προφῆται
  choice: at ang mga Propeta
  rationale: Bahagi ito ng nakaugaliang pormulang “ang Kautusan at ang mga Propeta,” na tumutukoy sa makapangyarihang patotoo ng Kasulatan. Pinananatili ng malaking titik ang kanonikal at pampanitikang diwa.
theological_decisions:
- issue: Kahulugan ng pormulang “ang Kautusan at ang mga Propeta”
  choice: Pinanatili bilang pormulang tumutukoy sa kabuuang patotoo ng Kasulatan na nakasalalay sa dalawang utos
  alternative: Isalin nang mas makitid bilang mga aral na etikal lamang ng kautusan at ng mga propeta
  rationale: Sa Mateo, ang “Kautusan at mga Propeta” ay isang kinikilalang pagtukoy sa Kasulatan o sa kabuuan ng turo nito. Hindi ito pinalitan ng “buong Kasulatan” upang mapanatili ang orihinal na pormula at ang saklaw nitong hindi kailangang higit na ipaliwanag sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “nakasalalay” kaysa sa literal na “nakabitin” dahil ito ang natural na katambal ng “sa” sa Filipino at pinananatili ang diwa ng metapora. Ang footnote marker na [a] ay nasa pangunahing teksto.
