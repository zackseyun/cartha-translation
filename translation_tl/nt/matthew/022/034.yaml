base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: tl
  text: Ngunit nang mabalitaan ng mga Pariseo na napatahimik niya ang mga Saduseo[a], nagtipon sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “binusalan niya ang mga Saduseo.” Ang pandiwang Griyego ay maaaring mangahulugang “busalan,” ngunit dito ay matalinghagang tumutukoy sa pagpapatahimik sa kanila sa pagtatalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Naghuhudyat ng banayad na pagsalungat at paglipat mula sa naunang pakikipagtalo; likas at marangal sa modernong Tagalog.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat na Judio.
- source_word: ἀκούσαντες
  choice: nang mabalitaan
  rationale: Isinasalin ang aorist participle bilang pangyayaring temporal. Ang “mabalitaan” ay natural sa konteksto ng pagkarinig nila tungkol sa kinalabasan ng pagtatalo.
- source_word: ἐφίμωσεν
  choice: napatahimik
  rationale: 'Ipinahahayag ang matalinghagang diwa ng pandiwa: lubusang napigil ang mga Saduseo sa pakikipagtalo. Pinananatili sa talababa ang literal na larawang “busalan.”'
- source_word: Σαδδουκαίους
  choice: mga Saduseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat na Judio.
- source_word: συνήχθησαν
  choice: nagtipon
  rationale: Natural na Tagalog para sa pagkatipon o pagtitipon ng pangkat; hindi kailangang ulitin ang “sama-sama” dahil ipinahihiwatig na iyon ng pandiwa.
- source_word: ἐπὶ τὸ αὐτό
  choice: nagtipon sila
  rationale: Ang idyoma ay nangangahulugang magkakasama o sa iisang lugar. Naipapaloob ito nang natural sa “nagtipon” nang hindi labis na tinutukoy ang lugar o layunin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang karaniwang biblikal na anyong “Pariseo” at “Saduseo,” at pinanatili ang masiglang literal na larawan ng Griyego sa talababa.
