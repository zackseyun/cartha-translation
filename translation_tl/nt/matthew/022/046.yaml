  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: tl
  text: At walang sinumang nakayang sumagot sa kanya kahit isang salita.[a] Mula sa araw na iyon, wala na ring nangahas na magtanong pa sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makasagot sa kanya ng isang salita.” Literal na idyoma sa Griyego ang “sumagot sa kanya ng isang salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς ἐδύνατο
  choice: walang makasagot
  rationale: Likas at malinaw na ipinapahayag sa Tagalog ang ganap na kawalan ng sinumang may kakayahang sumagot.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: makasagot sa kanya kahit isang salita
  rationale: Pinananatili ang tahasang λόγον (“salita”) at ang diin ng Griyegong idyoma, habang gumagamit ng natural na pananalitang Tagalog.
- source_word: οὐδὲ ἐτόλμησέν τις
  choice: wala na ring nangahas
  rationale: Ang “rin” ay nag-uugnay sa ikalawang negatibong pahayag, at ang “nangahas” ay tumpak na naghahatid sa diwa ng τολμάω.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: Mula sa araw na iyon
  rationale: Malinaw na itinatakda ang panimulang punto ng kalagayang nagpatuloy pagkatapos ng araw na iyon.
- source_word: ἐπερωτῆσαι αὐτὸν οὐκέτι
  choice: magtanong pa sa kanya
  rationale: Sa konteksto, tumutukoy ito sa patuloy na pagtatanong kay Jesus; natural na ipinahihiwatig ng “pa” kasama ng “wala na” ang οὐκέτι.
theological_decisions:
- issue: Diwa ng pananahimik ng mga sumasalungat matapos sumagot si Jesus
  choice: Inilahad lamang ang kawalan nila ng kakayahang sumagot at ang hindi na nila pangangahas na magtanong.
  alternative: Tahasan sa salin na idiin ang nakahihigit na karunungan o awtoridad ni Jesus.
  rationale: Ipinahihiwatig ng konteksto ang pagtatagumpay ni Jesus sa pagtatalo, ngunit hindi iyon tahasang sinasabi ng talata; iniiwasan ng salin ang pagdaragdag ng interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap para sa natural na daloy nang hindi binabago ang ugnayan ng dalawang sugnay.
