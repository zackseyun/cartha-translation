  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: tl
  text: Ito ang dakila at unang utos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “Ito ang pangunahing utos.” Mas literal na may dalawang paglalarawan ang Griyego: “ang dakila at unang utos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ito
  rationale: Tumutukoy pabalik sa utos na sinipi sa talata 37; natural sa makabagong Tagalog ang “Ito” at napapanatili nito ang puwersa ng demonstratibo.
- source_word: ἐστὶν
  choice: ang
  rationale: Sa pangungusap na pangngalan sa Tagalog, natural na hindi tahasang isalin ang copula na “ay/is”; ang hulmaing “Ito ang…” ang malinaw at karaniwang katumbas.
- source_word: μεγάλη
  choice: dakila
  rationale: Ipinahahayag dito ang laki ng kahalagahan o ranggo, hindi pisikal na laki. Pinananatili ng “dakila” ang positibong anyo at marangal na rehistro nang hindi ito ginagawang pasukdol na “pinakadakila.”
- source_word: πρώτη
  choice: unang
  rationale: Direktang pinananatili ang kahulugan ng pagiging una sa ayos o ranggo at ang hiwalay na paglalarawan nito kasama ng μεγάλη.
- source_word: ἐντολή
  choice: utos
  rationale: Natural at malinaw sa modernong Tagalog ang “utos” sa konteksto ng kautusan ng Diyos; hindi kailangan ang mas mabigat na “kautusan,” na maaari ring tumukoy sa mas malawak na Torah o batas.
theological_decisions:
- issue: Ugnayan ng μεγάλη at πρώτη bilang mga paglalarawan sa utos
  choice: 'Tahasan at magkatambal na isalin ang dalawang pang-uri: “ang dakila at unang utos.”'
  alternative: “Ito ang pinakamahalagang utos” o “Ito ang pangunahing utos.”
  rationale: Dalawang magkatugmang positibong pang-uri ang nasa Griyego, μεγάλη at πρώτη. Pinananatili ng salin ang parehong kadakilaan at pagiging una, sa halip na pagsamahin ang mga ito sa isang pasukdol o interpretatibong paglalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang natural na hulmaing “Ito ang…” at pinanatili ang dalawang paglalarawan sa Griyego, kahit bahagyang di-karaniwan ang tambalang “dakila at unang,” upang hindi mapawi ang tunay na diin at pagkakaiba ng mga ito.
