lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay at ang tuloy-tuloy na daloy ng salaysay nang hindi nagdaragdag ng tiyak na diwang temporal.
- source_word: ἀποκριθεὶς
  choice: sumagot
  rationale: Karaniwang idyomang pasalaysay ang pandiwa kahit walang tahasang tanong kaagad na nauuna; natural din sa Filipino ang “sumagot” bilang tugon sa naunang pangyayari o pahayag.
- source_word: ὁ Ἰησοῦς
  choice: si Jesus
  rationale: Ginagamit ang karaniwang panandang pantangi sa Filipino para sa pangalan ng tao.
- source_word: πάλιν
  choice: muling
  rationale: Tuwirang ipinahahayag ang pag-uulit ng kilos sa daloy ng diskurso.
- source_word: εἶπεν
  choice: Sinabi niya
  rationale: Natural na panimula sa susunod na tuwirang pagsasalita; inihiwalay bilang bagong pangungusap upang maiwasan ang mabigat at paulit-ulit na estruktura.
- source_word: ἐν παραβολαῖς
  choice: sa pamamagitan ng mga talinghaga
  rationale: Malinaw na ipinapahayag ang paraan o kasangkapang gamit sa pagsasalita; ang maramihang anyo ay pinananatili.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang tinutukoy ang mga kausap ni Jesus.
- source_word: λέγων
  choice: 'Sinabi niya:'
  rationale: Ginagawang natural na panimula sa nilalaman ng pagsasalita habang pinananatili ang tungkulin ng participle na ihanda ang kasunod na pahayag.
theological_decisions:
- issue: Idyomatikong gamit ng “sumagot” kahit walang tahasang tanong kaagad na nauuna
  choice: Pinanatili ang “sumagot.”
  alternative: “nagsalita” o “tumugon”
  rationale: Karaniwang idyomang pasalaysay ito sa Griyego at nagpapahiwatig ng pagpapatuloy o pagtugon sa konteksto, hindi ng isang natatanging doktrinal na pahayag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “talinghaga” bilang pamilyar at angkop na terminong biblikal. Hinati sa dalawang pangungusap ang komplikadong estrukturang Griyego upang maging natural sa Filipino nang hindi nawawala ang kahulugan.
