    issue: Ang “muling” ay ikinabit sa “sumagot.”
    rationale: Ang πάλιν ay nasa sugnay ng εἶπεν at ipinahihiwatig na muling nagsalita si Jesus; hindi nito tuwirang binabago ang ἀποκριθεὶς. Dapat maipakita ang parehong “sumagot” at “muling nagsalita.”
