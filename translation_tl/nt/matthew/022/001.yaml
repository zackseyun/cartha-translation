  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: tl
  text: 'At sumagot si Jesus[a] at muli siyang nagsalita sa kanila sa pamamagitan ng mga talinghaga. Sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumugon.” Karaniwang idyomang pasalaysay sa Griyego ang “sumagot,” kahit walang tahasang tanong na kaagad na nauuna.
