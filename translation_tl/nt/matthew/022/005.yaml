  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: tl
  text: Ngunit hindi nila iyon pinansin at umalis sila[a]—ang isa ay pumunta sa sarili niyang bukid, at ang isa naman ay sa kanyang negosyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “binalewala nila iyon” o “pinabayaan nila iyon.” Sa konteksto, ang “iyon” ay tumutukoy sa paanyaya ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: hindi nila iyon pinansin
  rationale: Ipinahahayag ng pandiwaring ito ang kawalan ng pansin o malasakit. Likas sa makabagong Tagalog ang “hindi nila iyon pinansin,” at ang “iyon” ay tumutukoy sa paanyaya ayon sa konteksto, bagaman walang tahasang layon sa Griyego.
- source_word: ἀπῆλθον
  choice: umalis sila
  rationale: Malinaw at likas na ipinapakita ng “umalis sila” ang paglayo nila matapos matanggap ang paanyaya, nang hindi gumagamit ng labis na pormal na pananalita.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ang isa ... ang isa naman
  rationale: Pinananatili nito ang paghahati at pagtutunggali ng dalawang indibidwal na ipinahihiwatig ng distributibong kayarian sa Griyego.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: sa sarili niyang bukid
  rationale: Tuwirang katumbas ng ἀγρός ang “bukid,” at pinananatili ng “sarili niyang” ang diin ng ἴδιον sa pansariling pag-aari o gawain.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: sa kanyang negosyo
  rationale: Ang ἐμπορία ay tumutukoy sa pangangalakal o gawaing pangnegosyo. Ang “negosyo” ang pinakalikas at malawak na makabagong katumbas sa kontekstong ito.
theological_decisions:
- issue: Hindi tahasang layon ng ἀμελήσαντες
  choice: Ginamit ang “iyon” bilang likas na pahiwatig sa paanyaya ng hari ayon sa konteksto.
  alternative: Maaaring isaling “binalewala nila” nang walang tahasang layon, o “binalewala nila ang paanyaya.”
  rationale: Walang tahasang layon ang pandiwari sa Griyego. Nililinaw ng “iyon” ang ugnayan sa naunang paanyaya nang hindi ito labis na tinutukoy o dinaragdagan ng teolohikal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bukid” at “negosyo” bilang mga karaniwang salitang madaling maunawaan, habang pinananatili ang maikling ritmo at paghahambing ng orihinal.
