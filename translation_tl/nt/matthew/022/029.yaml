  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: tl
  text: Ngunit sumagot sa kanila si Jesus, “Nagkakamali kayo sapagkat hindi ninyo nalalaman ang mga Kasulatan ni ang kapangyarihan ng Diyos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ngunit sumagot sa kanila si Jesus
  rationale: Pinagsama sa likas na pormulang Filipino ang participle na Ἀποκριθεὶς at finite verb na εἶπεν, habang ipinahahayag ng “Ngunit” ang banayad na pagsalungat ng δέ.
- source_word: Πλανᾶσθε
  choice: Nagkakamali kayo
  rationale: Ipinahahayag nito ang kasalukuyang kalagayan ng pagiging mali o naliligaw nang hindi ipinapalagay na may panlabas na manlilinlang.
- source_word: μὴ εἰδότες
  choice: sapagkat hindi ninyo nalalaman
  rationale: 'Ginagawang malinaw ang likas na sanhi na ipinahihiwatig ng participial phrase: ang hindi nila pagkakaalam ang dahilan ng kanilang pagkakamali.'
- source_word: τὰς γραφὰς
  choice: ang mga Kasulatan
  rationale: Ang pangmaramihang γραφαί sa kontekstong Judio ay tumutukoy sa mga sagradong kasulatan; ang kapitalisadong “mga Kasulatan” ang karaniwang malinaw na katumbas sa Filipino.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ni ang kapangyarihan ng Diyos
  rationale: Pinananatili ng “ni” ang ikalawang negatibong kaugnay ng μηδέ, at tuwirang isinasalin ang δύναμις τοῦ θεοῦ bilang “kapangyarihan ng Diyos.”
theological_decisions:
- issue: Dahilan ng pagkakamali ng mga Saduceo
  choice: Iniuugnay ang kanilang pagkakamali sa hindi nila pagkaalam kapwa sa mga Kasulatan at sa kapangyarihan ng Diyos.
  alternative: Ituring ang μὴ εἰδότες bilang hiwalay na paglalarawan lamang at hindi malinaw na sanhi.
  rationale: Likas na nagpapaliwanag ng dahilan ang μὴ εἰδότες sa pangungusap, at ang pares na τὰς γραφὰς ... μηδὲ τὴν δύναμιν τοῦ θεοῦ ay parehong saklaw ng kanilang hindi pagkaalam.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “nalalaman” sa halip na mas kolokyal na “alam” upang mapanatili ang dignidad ng pananalita, ngunit nananatiling madaling maunawaan. Walang talababa dahil sapat na sinasaklaw ng “nagkakamali” ang diwa ng Πλανᾶσθε nang hindi kailangang ilista ang mga malalapit na alternatibo.
