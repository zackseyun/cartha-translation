id: MAT.22.11
reference: Matthew 22:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: tl
  text: Ngunit nang pumasok ang hari upang tingnan ang mga panauhing nakahilig sa hapag[a], nakita niya roon ang isang lalaking hindi nakasuot ng damit na pangkasal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang literal na diwa ay “ang mga nakahilig.” Karaniwang nakahilig sa tabi ng mababang hapag ang mga panauhin sa isang pormal na piging noong panahong iyon.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “isang lalaking hindi nakasuot ng kasuotang pangkasal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: nang pumasok
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa pangunahing pandiwa; likas sa Tagalog ang sugnay na “nang pumasok.”
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ang δέ ng pag-usad ng salaysay na may bahagyang pagsalungat; ang pagpasok ng hari ay naghahatid ng biglang tensiyon sa talinghaga.
- source_word: ὁ βασιλεὺς
  choice: ang hari
  rationale: Tuwirang katumbas ito sa konteksto ng isang maharlikang piging.
- source_word: θεάσασθαι
  choice: upang tingnan
  rationale: Ipinahahayag ng infinitive ang layunin ng pagpasok ng hari. Hindi pinalalabis ng “tingnan” ang diwang ito bilang isang pormal na inspeksiyon.
- source_word: τοὺς ἀνακειμένους
  choice: ang mga panauhing nakahilig sa hapag
  rationale: Sa konteksto ng piging, ang ἀνάκειμαι ay tumutukoy sa kaugaliang paghilig sa tabi ng hapag habang kumakain. Nililinaw ng “mga panauhin” ang kanilang papel nang hindi inaalis ang sinaunang postura.
- source_word: εἶδεν ἐκεῖ
  choice: nakita niya roon
  rationale: Pinananatili nito ang payak na pandiwang pandama at ang pang-abay na tumutukoy sa lugar.
- source_word: ἄνθρωπον
  choice: isang lalaki
  rationale: Ang pangngalan ay panlalaking isahan at tumutukoy sa isang partikular na lalaki sa talinghaga.
- source_word: οὐκ ἐνδεδυμένον
  choice: hindi nakasuot
  rationale: Inilalarawan ng perfect participle ang kasalukuyang kalagayan ng lalaki; natural sa Tagalog ang “hindi nakasuot.”
- source_word: ἔνδυμα γάμου
  choice: damit na pangkasal
  rationale: Pinananatili nito ang isahang “damit” at ang kaugnayan nito sa kasalan, nang hindi tinutukoy kung anong partikular na uri ng kasuotan iyon.
theological_decisions:
- issue: Larawan ng postura sa piging
  choice: Panatilihin ang detalye na nakahilig ang mga panauhin sa hapag.
  alternative: Sabihin lamang na “mga panauhin” o “mga nakaupo sa hapag.”
  rationale: Ang paghilig ay tunay na detalye ng tekstong Griyego at ng sinaunang kaugaliang pampiging. Hindi ito dapat palitan ng makabagong postura, ngunit nililinaw ng “mga panauhin” ang tagpo.
- issue: Kasarian ng ἄνθρωπον
  choice: isang lalaki
  alternative: isang tao; isang panauhin
  rationale: Partikular na panlalaking tauhan ang tinutukoy sa salaysay, kaya pinananatili ang kasarian sa halip na gawing pangkalahatan.
- issue: Kahulugan ng damit sa kasalan
  choice: damit na pangkasal
  alternative: damit na angkop sa kasalan; kasuotang pangkasal
  rationale: Hindi tinutukoy ng talata ang eksaktong anyo o pinagmulan ng damit. Pinananatili ng salin ang larawang nasa talinghaga nang hindi ipinapasok ang paliwanag kung bakit wala nito ang lalaki o kung ano ang sinasagisag nito.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “hapag” upang malinaw na maipakita ang tagpo ng piging, at iniwasan ang salitang maaaring magpahiwatig na nakaupo ang mga panauhin. Ang “damit na pangkasal” ay nauunawaan sa pangkaraniwang Filipino at hindi nililimitahan sa damit ng nobya o nobyo.
