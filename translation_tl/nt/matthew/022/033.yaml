base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: tl
  text: At nang marinig ito ng mga tao[a], namangha sila sa kanyang pagtuturo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos nilang marinig ito” o, sa mas pormal na anyo, “pagkarinig nila nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nang marinig ito
  rationale: Ang aorist active participle ay likas na isinasalin sa modernong Tagalog bilang sugnay na temporal. Ang “ito” ay tumutukoy sa naunang sagot ni Jesus, bagaman walang tahasang layon sa Griyego.
- source_word: οἱ ὄχλοι
  choice: ang mga tao
  rationale: Pinananatili ng “mga tao” ang diwa ng pangmaramihang ὄχλοι at mas natural ito sa kasalukuyang Tagalog kaysa “mga karamihan” o “mga pulutong” sa kontekstong ito.
- source_word: ἐξεπλήσσοντο
  choice: namangha sila
  rationale: Malinaw at likas na ipinahahayag ng “namangha” ang matinding pagtataka ng mga nakarinig. Hindi man tuwirang mamarkahan ang aspektong imperfect, naihahatid nito ang kanilang reaksiyon sa salaysay.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: sa kanyang pagtuturo
  rationale: Ang ἐπί na may dative ay tumutukoy sa sanhi o batayan ng kanilang pagkamangha. Ang “pagtuturo” ay mas natural at hindi teknikal kaysa “doktrina.”
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang tagpo, kaya ang “At” ay nagpapanatili ng tuloy-tuloy na daloy ng salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “mga tao” bilang idiomatikong katumbas ng pangmaramihang “mga pulutong,” at pinanatili sa talababa ang pormal na anyo ng participle.
