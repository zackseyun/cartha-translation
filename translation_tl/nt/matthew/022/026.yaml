lexical_decisions:
- source_word: ὁμοίως
  choice: Gayon din
  rationale: Likas na pariralang Filipino na nagpapakitang naulit sa mga sumunod ang nangyari sa naunang kapatid.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: sa ikalawa at sa ikatlo
  rationale: Pinananatili ang mga ordinal at ang pagkakasunod-sunod. Hindi idinagdag ang salitang “kapatid” dahil ipinahihiwatig na ito ng konteksto at wala sa mismong parirala.
- source_word: ἕως τῶν ἑπτά
  choice: hanggang sa silang pito
  rationale: Ipinahahayag sa likas na Filipino na nagpatuloy ang parehong pangyayari sa buong pangkat ng pitong magkakapatid. Ang mas literal na anyo ay inilagay sa talababa.
- source_word: elliptical clause
  choice: ang nangyari
  rationale: Idinagdag ang pandiwang pariralang hinihingi ng natural na sintaks sa Filipino; malinaw itong kinukuha mula sa naunang pangyayari at hindi nagdaragdag ng bagong diwa.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “Gayon din” bilang maikli ngunit natural na dugtong sa naunang talata, at ang “silang pito” upang maipahayag nang idiomatiko ang buong pangkat.
