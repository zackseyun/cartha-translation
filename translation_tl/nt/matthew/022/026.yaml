translation:
  language: tl
  text: Gayon din naman ang nangyari sa ikalawa at sa ikatlo, hanggang sa lahat ng pito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “hanggang sa pito.”
