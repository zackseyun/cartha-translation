  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: tl
  text: At sinabi niya sa kanya, “Kaibigan, paano ka nakapasok dito na wala kang kasuotang pangkasal?” Ngunit napatameme siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “siya ay pinatahimik.” Maaari ring literal na mangahulugang “binusalan” ang pandiwang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Kaibigan
  rationale: Likas na pantawag sa modernong Tagalog na maaaring maging magalang ngunit may distansiya at pagsaway sa kontekstong ito; hindi nito pinalalabis ang init o pagkapoot ng nagsasalita.
- source_word: πῶς
  choice: paano
  rationale: Nagtatanong ito kung paano nagawang makapasok ng lalaki, hindi tuwirang kung bakit niya iyon ginawa.
- source_word: εἰσῆλθες ὧδε
  choice: ka nakapasok dito
  rationale: Ipinapahayag nang natural ang natapos na pagpasok sa lugar na tinutukoy.
- source_word: μὴ ἔχων
  choice: nang walang
  rationale: Natural na Tagalog para sa kasabay na kalagayang wala sa kanya ang hinihinging kasuotan.
- source_word: ἔνδυμα γάμου
  choice: damit na para sa kasalan
  rationale: Pinananatili ang isahang di-tiyak na kasuotan at ang kaugnayan nito sa kasalan nang hindi ipinapalagay na balabal o isang espesipikong uri ng damit.
- source_word: ἐφιμώθη
  choice: hindi siya makasagot
  rationale: Sa konteksto, inilalarawan ang kawalan niya ng maisagot. Natural ito sa Tagalog, samantalang inilalahad sa talababa ang mas literal na larawan ng pagpapatahimik o pagbusal.
theological_decisions:
- issue: Tono ng pagtawag ng punong-abala sa panauhing walang angkop na damit
  choice: Magalang ngunit mapanaway na “Kaibigan”
  alternative: “Kasama” o isang mas malamig at mas matigas na pantawag
  rationale: Pinananatili ng “Kaibigan” ang magalang ngunit may distansiyang tono ng Ἑταῖρε sa Mateo, nang hindi nagdaragdag ng lambing o paghamak.
- issue: Kahulugan ng ἐφιμώθη
  choice: 'Bunga ng kilos ang itinampok: “hindi siya makasagot”'
  alternative: Mas literal na “siya ay pinatahimik” o “binusalan”
  rationale: Ang konteksto ay nagpapakitang wala siyang maisagot, ngunit ang pasibong anyo at matingkad na literal na diwa ng pandiwa ay pinananatili sa talababa upang hindi lubusang mawala ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “kasalan” para sa okasyon at “damit na para sa kasalan” upang maiwasang tukuyin nang higit sa Griyego ang eksaktong uri ng kasuotan. Inilagay ang panandang [a] pagkatapos ng sugnay na tinutukoy nito.
