id: MAT.22.14
reference: Matthew 22:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: tl
  text: Sapagkat marami ang tinawag[a], ngunit kakaunti ang pinili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inanyayahan”; sa kontekstong ito, maaaring tumukoy ang salita sa pag-anyaya sa isang handaan.
    reason: lexical_alternative
  - marker: b
    text: O “hinirang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Ginamit bilang pangngalan ang pang-uri at tuwirang katumbas ng “marami”; malinaw nitong pinananatili ang paghahambing sa ὀλίγοι.
- source_word: γάρ
  choice: sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o batayan para sa naunang pahayag. Likas at marangal na pang-ugnay sa Filipino ang “sapagkat.”
- source_word: εἰσιν
  choice: ang
  rationale: Karaniwang hindi tahasang isinasalin sa Filipino ang pandiwang εἰμί sa ganitong pangungusap; naipahahayag ang ugnayang panaguri sa pamamagitan ng ayos na “marami ang….”
- source_word: κλητοὶ
  choice: tinawag
  rationale: Saklaw ng κλητοί ang “tinawag” at, sa konteksto ng handaan, “inanyayahan.” Pinananatili ng “tinawag” ang mas malawak na diwa at ang matalim na pagtutulad sa “pinili,” habang inilalagay sa talababa ang diwang panghandaan.
- source_word: ὀλίγοι
  choice: kakaunti
  rationale: Natural na kasalungat ng “marami” at pinananatili ang maikli at kawikaang anyo ng pahayag.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinakikita ng “ngunit” ang pagsalungat ng dalawang sugnay.
- source_word: ἐκλεκτοί
  choice: pinili
  rationale: Tuwirang ipinahahayag ng “pinili” ang leksikal na diwa nang hindi inuuna ang isang teknikal na katawagang teolohikal.
theological_decisions:
- issue: Pagbibigay-kahulugan sa ἐκλεκτοί sa talatang ginagamit sa mga pagtatalo tungkol sa pagtawag at pagpili
  choice: pinili
  alternative: mga hinirang
  rationale: Kapuwa maaaring tumukoy ang salitang Griyego sa mga “pinili” o “hinirang.” Mas malinaw sa karaniwang mambabasa ang “pinili” at hindi nito ipinapasya ang mga susunod na sistemang teolohikal; pinananatili sa talababa ang tradisyonal na “hinirang.”
- issue: Pagbibigay-kahulugan sa κλητοί sa konteksto ng talinghaga tungkol sa handaan sa kasal
  choice: tinawag
  alternative: inanyayahan
  rationale: Ang “inanyayahan” ay angkop sa agarang tagpo ng handaan, ngunit pinananatili ng “tinawag” ang mas malawak na saklaw ng salita at ang ugnayan nito sa ἐκλεκτοί. Inilalahad sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Pinanatili ang kawikaang balanse ng “marami… ngunit kakaunti” at iniwasan ang labis na teknikal na wikang teolohikal.
