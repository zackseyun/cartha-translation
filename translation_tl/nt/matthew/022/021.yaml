id: MAT.22.21
reference: Matthew 22:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Kay Cesar.” Pagkatapos ay sinabi niya sa kanila, “Kung gayon, ibigay ninyo[a] kay Cesar ang para kay Cesar, at sa Diyos ang para sa Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isauli ninyo” o “ibayad ninyo ang nararapat.” Ang pandiwang Griyego ay maaaring mangahulugang magsauli, magbayad, o magbigay ng nararapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Sinabi nila sa kanya
  rationale: Ginawang payak na pangnagdaan ang historikal na pangkasalukuyan upang maging natural ang daloy ng salaysay sa Tagalog, habang pinananatili ang di-tuwirang layon.
- source_word: Καίσαρος
  choice: Kay Cesar
  rationale: Likas na sagot ito sa Tagalog sa tanong kung kanino ang larawan at inskripsiyon; ipinahihiwatig nito ang pag-aari nang hindi pilit ang literal na anyong henitibo.
- source_word: τότε λέγει αὐτοῖς
  choice: Pagkatapos ay sinabi niya sa kanila
  rationale: Ipinapakita ang kasunod na hakbang sa usapan at ginagawang pangnagdaan ang ikalawang historikal na pangkasalukuyan.
- source_word: Ἀπόδοτε
  choice: ibigay ninyo
  rationale: Malinaw at natural na utos sa modernong Tagalog. Maaaring taglayin ng pandiwang Griyego ang diwang pagsasauli, pagbabayad, o pagbibigay ng nararapat; inilalahad ang mga iyon sa talababa.
- source_word: οὖν
  choice: Kung gayon
  rationale: Ipinahahayag ang paghihinuha mula sa sagot nila tungkol sa barya.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: kay Cesar ang para kay Cesar
  rationale: Natural na katumbas sa Tagalog na pinananatili ang ugnayan ng nararapat o nauukol at ang balanseng retorikal ng pangungusap.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: sa Diyos ang para sa Diyos
  rationale: Tumutugma sa naunang sugnay at pinananatili ang malinaw na pagkakaiba ng nauukol kay Cesar at ng nauukol sa Diyos.
theological_decisions:
- issue: Saklaw ng utos ni Jesus tungkol sa pananagutang sibiko at sa pananagutan sa Diyos
  choice: Pinanatili ang magkatimbang na utos na ibigay kay Cesar ang para sa kanya at sa Diyos ang para sa Diyos.
  alternative: Limitahan ito sa pagbabayad lamang ng buwis, o ituring na malawak na pagsang-ayon sa ganap na kapangyarihan ng pamahalaan.
  rationale: Hindi nilulutas ng salin ang tensiyon sa pagitan ng tungkuling sibiko at ng higit na pag-angkin ng Diyos. Iniiwasan nitong magdagdag ng isang buong teoryang pampolitika o doktrinal na wala sa mismong pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Cesar,” ang karaniwang anyong Filipino ng titulong Caesar, at pinanatili ang maikli at balanseng estruktura ng pahayag.
