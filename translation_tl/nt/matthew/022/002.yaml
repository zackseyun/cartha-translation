  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: tl
  text: Inihalintulad[a] ang kaharian ng langit sa isang haring nagdaos ng pagdiriwang ng kasal[b] para sa kanyang anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maihahambing.” Ang pandiwang Griyego ay literal na nasa anyong “inihalintulad” o “ginawang katulad”; karaniwan ding isinasalin ang ganitong pananalita sa mga talinghaga bilang “maihahambing.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga kasalan” ang anyong maramihan—isang idyoma para sa mga pagdiriwang o piging kaugnay ng kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: Inihalintulad
  rationale: Ang aorist passive indicative ay tahasang nagsasaad na “inihalintulad” ang kaharian. Pinananatili nito ang anyong pasibo at pangnagdaan nang hindi nagdaragdag ng modal na diwang wala sa Griyego.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: ang kaharian ng langit
  rationale: Ito ang natural at nakaugaliang salin ng natatanging parirala ni Mateo. Nananatili ang salitang “langit” sa halip na ipalit ang “Diyos,” at hindi nililimitahan kung ang diin ay nasa paghahari o sa nasasakupan.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: sa isang hari
  rationale: Bagaman kapwa naroon ang ἄνθρωπος at βασιλεύς, ang tambalang parirala ay natural na tumutukoy sa isang taong hari. Sa Filipino, ang “isang haring lalaki” o “isang tao, isang hari” ay mabigat at maaaring magbigay ng di-kailangang diin; sapat at tumpak ang “isang hari.”
- source_word: ὅστις
  choice: na
  rationale: Likas sa Filipino ang pang-angkop na “na” upang ipakilala ang ginawa ng hari; hindi kailangan ang mas mabigat na “na siyang.”
- source_word: ἐποίησεν γάμους
  choice: nagdaos ng pagdiriwang ng kasal
  rationale: Sa pagsama sa γάμους, ang ποιέω ay idiomatikong nangangahulugang magdaos o maghanda ng pagdiriwang. Sinasaklaw ng “pagdiriwang ng kasal” ang mga kasayahan at piging na ipinahihiwatig ng konteksto.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: para sa kanyang anak na lalaki
  rationale: Ipinapakita ng “para sa” ang diwa ng dative na ang pagdiriwang ay ukol sa anak, at pinananatili ng “anak na lalaki” ang kasariang tahasang nasa υἱός.
theological_decisions:
- issue: Kahulugan ng pariralang “kaharian ng langit”
  choice: Pinanatili ang “kaharian ng langit” nang walang teolohikal na pagpapalit o pagpapaliwanag sa pangunahing teksto.
  alternative: “paghahari ng langit” o “kaharian ng Diyos”
  rationale: Pinangangalagaan nito ang natatanging pananalita ni Mateo at iniiwang bukas ang saklaw ng “kaharian” bilang paghahari at nasasakupan, sa halip na ipasya iyon sa pagsasalin.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang “nagdaos ng pagdiriwang ng kasal” ay madaling maunawaan at mas malawak kaysa “piging” lamang, samantalang ang “anak na lalaki” ay tahasang nagpapanatili sa υἱός.
