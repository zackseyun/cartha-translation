  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: tl
  text: 'Tungkol naman sa muling pagkabuhay ng mga patay, hindi ba ninyo nabasa ang sinabi sa inyo ng Diyos:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Tungkol naman sa
  rationale: Ipinakikilala ng περί na may genitibo ang paksang tinatalakay, at likas na naipahahayag ng “naman” ang paglipat na minamarkahan ng δέ nang hindi ito ginagawang matinding pagsalungat.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: muling pagkabuhay ng mga patay
  rationale: Tumutukoy ang ἀνάστασις dito sa pagkabuhay ng mga taong patay. Ang “muling pagkabuhay” ay malinaw at karaniwang katawagan sa modernong Filipino, samantalang pinananatili ng “ng mga patay” ang genitibong kayarian ng Griyego.
- source_word: οὐκ ἀνέγνωτε
  choice: hindi ba ninyo nabasa
  rationale: Isang retorikal na tanong ito tungkol sa kanilang pagkakilala sa Kasulatan. Likas sa Filipino ang perpektibong “nabasa” at hindi nito ipinipilit kung minsan o paulit-ulit ang tinutukoy na pagbasa.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: ang sinabi sa inyo ng Diyos
  rationale: Pinananatili ng ayos na ito ang sinabi bilang bagay na tinutukoy, ang mga tagapakinig bilang pinatutungkulan, at ang Diyos bilang pinagmulan o tagapagsalita.
- source_word: λέγοντος
  choice: ':'
  rationale: Ipinakikilala ng participle ang tuwirang sipi sa kasunod na talata. Sa natural na Filipino, sapat at malinaw na ginagampanan ng tutuldok ang tungkuling ito, at iniiwasan nito ang mabigat at paulit-ulit na “sinabi… na nagsasabi.”
theological_decisions:
- issue: Ang Diyos bilang tagapagsalita at ang Kasulatan bilang tuwirang pahayag sa mga nakikinig
  choice: “ang sinabi sa inyo ng Diyos”
  alternative: “ang sinabi ng Diyos sa inyo”
  rationale: Parehong posible ang dalawang ayos, ngunit mas malapit ang pinili sa pagkakasunod ng mga ugnayan sa Griyego at malinaw nitong pinananatili na ang Diyos ang nagsalita at ang pahayag ay nakatuon sa mga kausap ni Jesus. Wala itong idinaragdag na partikular na teorya ng inspirasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” bilang magalang at maramihang panghalip. Ang “Tungkol naman sa” ay natural na panandang paksa at paglipat; ang tutuldok ay naghahanda sa siping sumusunod sa Mateo 22:32.
