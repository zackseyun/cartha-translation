  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: tl
  text: Pagkatapos ay sinabi niya sa kanyang mga lingkod, “Handa na ang handaan sa kasal, ngunit hindi karapat-dapat ang mga inanyayahan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tinawag.” Mas literal itong salin ng Griyegong participle, ngunit sa konteksto ng handaan ay tumutukoy ito sa mga inanyayahan sa kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa makabagong Filipino na malinaw na nagpapatuloy sa pagkakasunod-sunod ng salaysay.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Filipino ang pangnagdaan; hindi nito binabago ang pangyayari o pagkakasunod nito.
- source_word: δούλοις
  choice: mga lingkod
  rationale: Ang “lingkod” ay marangal at karaniwang salin sa konteksto ng sambahayan o maharlikang talinghaga; hindi mahalaga rito ang legal na katayuang maaaring ipahiwatig ng “alipin.”
- source_word: ὁ μὲν γάμος
  choice: ang handaan sa kasal
  rationale: Sa konteksto, ang γάμος ay tumutukoy sa pagdiriwang o piging na inihanda, hindi lamang sa seremonya o pag-aasawa. Ang kontrast ng μὲν…δὲ ay naipapahayag ng “ngunit.”
- source_word: ἕτοιμός ἐστιν
  choice: handa na
  rationale: Tuwiran at natural na katumbas ng pang-uring ἕτοιμος kasama ng copula; ipinahihiwatig ng “na” na dumating na ang kalagayang pagiging handa.
- source_word: οἱ δὲ κεκλημένοι
  choice: ang mga inanyayahan
  rationale: Ang perfect passive participle ng καλέω ay tumutukoy dito sa mga panauhing inimbitahan sa kasal. Pinananatili sa talababa ang mas literal na “mga tinawag.”
- source_word: οὐκ ἦσαν ἄξιοι
  choice: hindi karapat-dapat
  rationale: Pinananatili ang evaluative force ng ἄξιος nang hindi ipinapaliwanag kung bakit sila hindi karapat-dapat.
theological_decisions:
- issue: Posibleng teolohikal na pakahulugan ng κεκλημένοι bilang “mga tinawag”
  choice: mga inanyayahan
  alternative: mga tinawag
  rationale: Sa agarang konteksto ng handaan sa kasal, ang salita ay tumutukoy sa mga inimbitahang panauhin. Ang “mga tinawag” ay maaaring magpasok ng teolohikal na kategorya na hindi kailangang idiin dito, ngunit itinatala ito bilang literal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handaan sa kasal” bilang pangkaraniwang parirala at “mga lingkod” para sa natural na salaysay ng talinghaga.
