source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: tl
  text: Sinabi ng Panginoon sa aking Panginoon, ‘Maupo ka sa aking kanan hanggang sa ilagay ko ang iyong mga kaaway sa ilalim ng iyong mga paa.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa idyomang Hebreo sa Awit 110:1, “gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: Sinabi
  rationale: Likas at tuwirang salin ng aorist na λέγω sa pormula ng pagsipi.
- source_word: κύριος
  choice: Panginoon
  rationale: Iisang titulong κύριος ang ginamit sa dalawang tinutukoy sa tekstong Griyego; pinananatili ng “Panginoon” ang pagkakatulad na ito, samantalang ipinakikita ng “aking” ang kanilang ugnayan.
- source_word: τῷ κυρίῳ μου
  choice: sa aking Panginoon
  rationale: Ipinahihiwatig ng datibo ang kinakausap. Mas angkop dito ang “aking Panginoon” kaysa “aking amo” dahil pinananatili nito ang titulo at ang bigat ng sipi sa argumento ni Jesus.
- source_word: Κάθου
  choice: Maupo ka
  rationale: Natural na modernong Tagalog na pautos para sa κάθημαι; ang “Umupo ka” ay posible, ngunit maaaring magpahiwatig lamang ng kilos ng pag-upo kaysa pananatili sa luklukan.
- source_word: ἐκ δεξιῶν μου
  choice: sa kanan ko
  rationale: Likas na ekspresyon sa Tagalog para sa marangal at makapangyarihang puwesto sa kanan ng nagsasalita.
- source_word: ἕως ἂν θῶ
  choice: hanggang sa mailagay ko
  rationale: Pinananatili ang hinaharap na hangganan ng ἕως ἂν at ang pagkilos ng nagsasalita; natural ang “mailagay ko” sa sugnay na ito.
- source_word: τοὺς ἐχθρούς σου
  choice: ang iyong mga kaaway
  rationale: Tuwiran, malinaw, at karaniwang salin ng ἐχθροί.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sa ilalim ng iyong mga paa
  rationale: Tuwirang kinakatawan ang Griyegong parirala. Hindi idinaragdag sa pangunahing teksto ang “tuntungan,” sapagkat wala iyon sa anyong Griyego ng talatang ito.
theological_decisions:
- issue: Dalawang paggamit ng κύριος sa sipi sa Awit 110:1
  choice: Sinabi ng Panginoon sa aking Panginoon
  alternative: Sinabi ng PANGINOON sa aking Panginoon; Sinabi ng Panginoon sa aking panginoon
  rationale: Parehong κύριος ang nasa tekstong Griyego. Ang magkaparehong “Panginoon” ay hindi nag-aangkat ng pagkakaibang mula sa tekstong Hebreo na hindi nakikita sa Griyego, at pinananatili ang tensiyong mahalaga sa tanong ni Jesus tungkol sa Mesiyas.
- issue: Larawan ng pagpapasuko sa mga kaaway
  choice: mailagay ko ang iyong mga kaaway sa ilalim ng iyong mga paa
  alternative: gawin kong tuntungan ng iyong mga paa ang iyong mga kaaway
  rationale: Ang pangunahing salin ay sumusunod sa aktuwal na Griyegong ὑποκάτω τῶν ποδῶν σου. Ang larawang “tuntungan” ay kaugnay ng Hebreong anyo ng Awit 110:1 at mga tradisyonal na salin, ngunit hindi kailangang ipasok sa talatang Griyego.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na “iyong” sa loob ng banal na sipi at ang magkaparehong titulong “Panginoon” para sa dalawang paglitaw ng κύριος. Walang talababa dahil ang ibinigay na English footnote ay tila hindi tugma sa pangunahing English text: pareho nitong inilalarawan ang alternatibong “footstool,” samantalang ang pangunahing salin na “under your feet” ay siya mismong mas tuwirang katumbas ng Griyego.'
