id: MAT.22.22
reference: Matthew 22:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: tl
  text: Nang marinig nila ito, namangha sila. Pagkatapos, iniwan nila siya at umalis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang marinig nila ito
  rationale: Ang aorist participle ay nagsasaad ng pangyayaring nauna sa pangunahing pandiwa. Likas sa makabagong Tagalog ang temporal na sugnay na “Nang marinig nila ito”; ang “ito” ay ipinahiwatig ng konteksto.
- source_word: ἐθαύμασαν
  choice: namangha sila
  rationale: Malinaw at likas na ipinapahayag ng “namangha” ang pagtataka o paghanga na saklaw ng θαυμάζω.
- source_word: ἀφέντες αὐτὸν
  choice: iniwan nila siya
  rationale: Tuwirang inilalarawan nito ang paglayo nila kay Jesus nang hindi idinaragdag ang di-hayag na diwang “mag-isa.”
- source_word: ἀπῆλθαν
  choice: umalis
  rationale: Ang “umalis” ay natural at malinaw na katumbas ng paglayo o pag-alis sa tagpo.
- source_word: καὶ ... καὶ
  choice: sila. Pagkatapos, ... at
  rationale: Isinaayos ang koordinasyon ayon sa likas na daloy ng Tagalog habang pinananatili ang sunod-sunod na kilos sa salaysay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na sunod-sunod na “at” at maging natural sa karaniwang mambabasa, nang hindi binabago ang pagkakasunod ng mga kilos.
