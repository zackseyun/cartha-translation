  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: tl
  text: “Guro, alin ang pinakadakilang utos sa Kautusan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Guro, aling utos ang dakila sa Kautusan?”
    reason: Pinananatili nito ang positibong anyo ng Griyegong μεγάλη, sa halip na ang idiomatikong superlatibong “pinakadakila.”
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Karaniwang tawag sa isang nagtuturo at likas na katumbas ng bokatibong προσφώνηση kay Jesus; iniiwasan nito ang ibang pahiwatig ng “Panginoon” o “Amo.”
- source_word: ποία
  choice: alin
  rationale: Nagtatanong ito kung alin sa isang tiyak na pangkat—ang mga utos sa Kautusan—ang tinutukoy.
- source_word: ἐντολὴ
  choice: utos
  rationale: Natural at malinaw na katawagan sa isang kautusan o ipinag-uutos ng Diyos sa kontekstong ito.
- source_word: μεγάλη
  choice: pinakadakila
  rationale: Bagaman positibong anyo ang Griyegong μεγάλη, ang tanong ay likas na nauunawaan bilang paghahambing at paghingi ng pinakamataas ang ranggo sa mga utos. Ang mas pormal na “dakila” ay inilalagay sa talababa.
- source_word: ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Tumutukoy sa kinikilalang Kautusan ng mga Judio, kaya ginamit ang malaking titik upang ipakita ang tiyak na kasulatang tinutukoy.
theological_decisions:
- issue: Kung ang μεγάλη ay isasalin bilang positibong “dakila” o idiomatikong superlatibong “pinakadakila”
  choice: pinakadakila
  alternative: dakila
  rationale: Ang anyong Griyego ay positibo, ngunit sa konteksto ng pagpili mula sa mga utos, may paghahambing na puwersa ang tanong. Ginamit sa pangunahing teksto ang natural na Filipino na “pinakadakila,” habang pinananatili sa talababa ang mas pormal na posibilidad.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Hindi ginamitan ng “po” dahil wala itong katumbas sa pinagmulang teksto at hindi kailangang idagdag upang maging magalang ang tawag na “Guro.”
