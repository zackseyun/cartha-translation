id: MAT.22.30
reference: Matthew 22:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: tl
  text: Sapagkat sa muling pagkabuhay[a], hindi sila nag-aasawa ni ipinapakasal, kundi tulad sila ng mga anghel ng Diyos sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagsapit ng muling pagkabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: sa muling pagkabuhay
  rationale: Likas itong tumutukoy sa kalagayan o panahon ng buhay matapos muling mabuhay. Pinananatili ng “sa” ang saklaw ng Griyegong ἐν nang hindi ipinipilit kung panahon lamang o kalagayan ang diin.
- source_word: γαμοῦσιν
  choice: nag-aasawa
  rationale: Karaniwan at natural na makabagong Tagalog para sa pagpasok sa pag-aasawa, nang hindi nililimitahan sa isang kasarian.
- source_word: γαμίζονται
  choice: ipinapakasal
  rationale: 'Pinananatili nito ang anyong balintiyak at ang pagkakaiba nito sa γαμοῦσιν: hindi lamang sila nag-aasawa, ni ibinibigay o ipinapasok sa pag-aasawa ng iba.'
- source_word: ὡς
  choice: tulad
  rationale: Malinaw itong naghahayag ng paghahambing, hindi ng pagiging magkapareho o ng pagbabagong-anyo bilang mga anghel.
- source_word: ἄγγελοι θεοῦ
  choice: mga anghel ng Diyos
  rationale: Tuwirang kinakatawan ang genitibong θεοῦ at natural pa rin sa marangal na Tagalog.
- source_word: ἐν τῷ οὐρανῷ
  choice: sa langit
  rationale: Sa konteksto, ang οὐρανός ay langit bilang kinaroroonan ng mga anghel, hindi ang pisikal na himpapawid.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay nagbibigay ng dahilan o paliwanag sa naunang sinabi.
theological_decisions:
- issue: Saklaw ng paghahambing sa mga anghel
  choice: Ang mga muling binuhay ay tulad ng mga anghel kaugnay ng hindi pag-aasawa o pagpapakasal.
  alternative: Maaaring palawakin ang paghahambing upang ipahiwatig ang isang pangkalahatang kalagayang mala-anghel.
  rationale: Ang ὡς ay tanda ng paghahambing, at ang agarang konteksto ay tungkol sa kawalan ng pag-aasawa sa muling pagkabuhay. Kaya “tulad” ang ginamit upang hindi ipahiwatig na nagiging mga anghel ang mga tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-aasawa” at “ipinapakasal” upang mapanatili sa natural na Tagalog ang pagkakaiba ng aktibo at balintiyak na pandiwa sa Griyego.
