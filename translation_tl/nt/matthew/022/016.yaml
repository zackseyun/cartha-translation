id: MAT.22.16
reference: Matthew 22:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: tl
  text: At isinugo nila sa kanya ang kanilang mga alagad, kasama ang mga Herodiano,[a] at sinabi ng mga ito, “Guro, alam naming tapat ka at itinuturo mo nang tapat ang daan ng Diyos. Hindi ka nagpapaimpluwensiya kaninuman, sapagkat hindi ka tumitingin sa katayuan ng mga tao.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga Herodiano ay mga tagasuporta ng pamamahala ng dinastiya ni Herodes.
    reason: historical_context
  - marker: b
    text: Sa literal, “hindi ka tumitingin sa mukha ng mga tao”; isang idyoma para sa hindi pagtatangi o hindi paghatol batay sa panlabas na katayuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: isinugo nila
  rationale: Ginamit ang karaniwang panahunang pangkuwento sa Filipino; ipinahihiwatig ng pandiwa ang pagpapadala o pagsusugo sa mga kinatawan.
- source_word: μαθητὰς
  choice: mga alagad
  rationale: Karaniwan at angkop na tawag sa mga tagasunod at mag-aaral ng isang guro sa konteksto ng Ebanghelyo.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: kasama ang mga Herodiano
  rationale: Malinaw na pinananatili ang pakikipagsama ng mga alagad sa pangkat na tinatawag na mga Herodiano.
- source_word: Διδάσκαλε
  choice: Guro
  rationale: Natural na modernong tawag na tuwirang nagpapahayag ng tungkuling magturo.
- source_word: ἀληθὴς εἶ
  choice: tapat ka
  rationale: Sa paglalarawan sa pagkatao ni Jesus, natural na ipinahahayag ng “tapat” ang pagiging totoo at mapagkakatiwalaan nang hindi nililimitahan sa pagsasabi lamang ng katotohanan.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ang daan ng Diyos
  rationale: Pinananatili ang metaporang “daan,” na maaaring tumukoy sa kalooban, pamumuhay, o landas na itinuturo ng Diyos.
- source_word: ἐν ἀληθείᾳ
  choice: nang tapat
  rationale: Natural na pang-abay sa Filipino na nagpapanatili sa diwang pagtuturo alinsunod sa katotohanan.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Hindi ka nagpapaimpluwensiya kaninuman
  rationale: Ipinahahayag ang kontekstuwal na diwa na hindi siya nasisindak, napapabor, o napapagalaw ng sinumang tao; iniiwasan ang maling pahiwatig na wala siyang malasakit sa iba.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: sapagkat hindi ka tumitingin sa katayuan ng tao
  rationale: 'Isinasalin ang Griyegong idyoma ayon sa diwa nito: hindi humahatol o kumikilos batay sa panlabas na pagkakakilanlan o katayuan ng mga tao.'
theological_decisions:
- issue: Idyoma tungkol sa hindi pagtatangi
  choice: hindi ka tumitingin sa katayuan ng tao
  alternative: hindi ka tumitingin sa mukha ng mga tao
  rationale: Ang literal na “mukha” ay madaling mapagkamalang pagtukoy lamang sa anyo. Ang pangunahing salin ay naghahatid ng diwa ng kawalang-pagtatangi, habang inilalagay sa talababa ang mas literal na larawan.
- issue: Kahulugan ng οὐ μέλει σοι περὶ οὐδενός
  choice: Hindi ka nagpapaimpluwensiya kaninuman
  alternative: Wala kang pakialam kaninuman
  rationale: Sa konteksto, papuri ito sa kalayaan ni Jesus mula sa impluwensiya ng opinyon o katayuan ng tao, hindi paratang na wala siyang malasakit. Pinipigilan ng napiling salin ang isang mapanlinlang na moral na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga alagad,” “daan ng Diyos,” at “Guro” bilang pamilyar na bokabularyong biblikal; isinalin ayon sa diwa ang dalawang Griyegong idyoma upang maiwasan ang maling pagkaunawa, at pinanatili sa talababa ang literal na larawan ng huling idyoma.
