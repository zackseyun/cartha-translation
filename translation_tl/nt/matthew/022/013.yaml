id: MAT.22.13
reference: Matthew 22:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa mga tagapaglingkod, “Gapusin ninyo ang kanyang mga paa at kamay, at itapon siya sa kadiliman sa labas.[a] Doon ay magkakaroon ng pagtangis at pagngangalit ng mga ngipin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa panlabas na kadiliman.”'
    reason: Pinananatili ng alternatibo ang mas literal na anyo ng pang-uri sa Griyego, samantalang mas natural sa Filipino ang “kadiliman sa labas.”
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Natural na panandang temporal sa pagsasalaysay; malinaw nitong ipinakikita ang kasunod na pangyayari.
- source_word: ὁ βασιλεὺς
  choice: ang hari
  rationale: Tuwirang pinananatili ang maharlikang larawan sa talinghaga.
- source_word: τοῖς διακόνοις
  choice: sa mga tagapaglingkod
  rationale: Sa tagpo ng handaan, tumutukoy ito sa mga naglilingkod sa hari; iniiwasan nito ang di-kinakailangang kahulugang pansimbahan ng termino.
- source_word: Δήσαντες
  choice: Gapusin ninyo
  rationale: Ang aorist participle na nauuna sa pangunahing pautos ay likas na naipapahayag sa Filipino bilang unang pautos na kaugnay ng kasunod na kilos.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: ang kanyang mga paa at kamay
  rationale: Pinananatili ang ayos ng Griyego na 'mga paa at kamay.'
- source_word: ἐκβάλετε αὐτὸν
  choice: itapon siya
  rationale: Ipinahahayag ang marahas at sapilitang pagpapaalis na taglay ng ἐκβάλλω.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: sa kadiliman sa labas
  rationale: Natural sa modernong Filipino at pinananatili ang larawan ng kadilimang nasa labas, nang hindi ito binibigyan ng higit na tiyak na doktrinal na pakahulugan.
- source_word: ἐκεῖ
  choice: Doon
  rationale: Tuwirang locative na tumutukoy sa lugar ng pagkakatapon.
- source_word: ἔσται
  choice: ay magkakaroon
  rationale: Natural na pagpapahayag sa Filipino ng hinaharap na pag-iral ng inilalarawang pagtangis at pagngangalit.
- source_word: ὁ κλαυθμὸς
  choice: pagtangis
  rationale: Ipinahahayag ang matinding pag-iyak at pagdadalamhati nang hindi pinalalabis ang salita.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: pagngangalit ng mga ngipin
  rationale: Kilála at tumpak na katumbas ng idyoma; hinahayaan nitong manatiling bukás kung ang larawan ay nagpapahiwatig ng matinding dalamhati, galit, o kapwa.
theological_decisions:
- issue: Kalikasan ng larawan ng pagpapaalis sa talinghaga
  choice: Panatilihin ang kongkretong larawan ng pagtatapon sa 'kadiliman sa labas' nang hindi ito tahasang ipinapakahulugan bilang impiyerno, huling paghuhukom, o simpleng kahihiyang panlipunan.
  alternative: Tahasang tawagin itong kaparusahan sa impiyerno, o palambutin bilang pagpapaalis lamang sa handaan.
  rationale: Matingkad na larawan ito ng paghatol sa loob ng talinghaga. Hindi nililinaw ng talata mismo ang larawan ayon sa isa lamang na sistematikong paliwanag, kaya dapat panatilihin ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “tagapaglingkod” sa konteksto ng handaan, “gapusin” para sa pormal ngunit kasalukuyang pautos, at ang nakaugaliang pariralang “pagtangis at pagngangalit ng mga ngipin.”
