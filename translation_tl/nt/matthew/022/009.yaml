  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: tl
  text: Kaya pumunta kayo sa mga sangandaan[a], at anyayahan ninyo sa handaan ng kasal[b] ang lahat ng matagpuan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga lugar na labasan ng mga daan” o “sa mga pinagtagpuan ng mga daan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa mga kasalan,” isang idyomang tumutukoy sa pagdiriwang o handaan ng kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: pumunta kayo
  rationale: Likas at tuwirang pautos sa modernong Tagalog; malinaw nitong pinananatili ang lakas ng imperatibo.
- source_word: οὖν
  choice: kaya
  rationale: Ipinapakita ang bunga o lohikal na kaugnayan sa naunang utos sa paraang natural sa Tagalog.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: sa mga sangandaan
  rationale: Ang διέξοδοι ay tumutukoy sa mga labasan o lugar na pinagsasalubungan o pinaghihiwalayan ng mga daan. Ang “mga sangandaan” ay maikli, natural, at hindi labis na nagtatakda ng heograpiya.
- source_word: ὅσους ἐὰν εὕρητε
  choice: ang lahat ng matagpuan ninyo
  rationale: 'Pinananatili ang malawak at di-tiyak na saklaw ng konstruksyon: walang itinatanging sinumang matagpuan nila.'
- source_word: καλέσατε
  choice: anyayahan ninyo
  rationale: Sa konteksto ng kasalan, ang καλέω ay nangangahulugang mag-anyaya, hindi lamang tumawag.
- source_word: εἰς τοὺς γάμους
  choice: sa handaan ng kasal
  rationale: Ang pangmaramihang γάμους ay idyomatikong tumutukoy sa pagdiriwang o piging ng kasal, hindi sa maraming kasal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sangandaan” bilang karaniwang salitang sumasaklaw sa tunay na leksikal na posibilidad ng mga daang nagtatagpo o nagsasanga; nilinaw sa talababa ang ibang posibleng diwa.
