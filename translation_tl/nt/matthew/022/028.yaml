  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: tl
  text: Sa muling pagkabuhay, kung gayon, kanino sa pito siya magiging asawa? Sapagkat naging asawa siya ng lahat ng pito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na, “Sapagkat lahat sila ay nagkaroon sa kaniya,” isang idyomang sa kontekstong ito ay tumutukoy sa pag-aasawa sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: muling pagkabuhay
  rationale: Sa konteksto ng pagtutol ng mga Saduceo, tumutukoy ito sa pagkabuhay na muli ng mga patay. Ang pariralang may ἐν ay nagpapahiwatig ng kalagayan o panahong iyon.
- source_word: οὖν
  choice: kung gayon
  rationale: Ipinagpapatuloy nito ang pangangatwiran at natural na naghahanda sa kasunod na tanong.
- source_word: τίνος τῶν ἑπτὰ
  choice: sino sa pito
  rationale: Natural itong paraan sa Tagalog upang itanong kung alin sa pitong lalaki ang ituturing na asawa niya.
- source_word: ἔσται γυνή
  choice: ang magiging asawa niya
  rationale: Bagaman ang γυνή ay maaari ring mangahulugang “babae,” malinaw na “asawa” ang kahulugan sa kontekstong pangmag-asawa. Inayos ang pananalita ayon sa likas na sintaks ng Tagalog.
- source_word: πάντες
  choice: nilang lahat
  rationale: Tumutukoy ito nang sama-sama sa pitong magkakapatid.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan kung bakit ibinangon ang tanong at pinananatili ang marangal na tono.
- source_word: ἔσχον αὐτήν
  choice: naging asawa siya nilang lahat
  rationale: Ang literal na “nagkaroon silang lahat sa kaniya” ay malabo at di-likas sa modernong Tagalog. Ipinahahayag ng salin ang malinaw na diwang pangmag-asawa ng konteksto, habang itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Kahulugan ng ἀνάστασις sa hamon ng mga Saduceo
  choice: Ang hinaharap na muling pagkabuhay ng mga patay
  alternative: Isang malabong pagtukoy sa buhay pagkatapos ng kamatayan
  rationale: Mismong muling pagkabuhay ang itinatanggi at itinatanong ng mga Saduceo sa konteksto, at iyon din ang paksang sinasagot ni Jesus sa mga kasunod na talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “muling pagkabuhay” bilang malinaw at karaniwang katawagan, at iniwasan ang di-likas na literal na hulma ng ἔσχον αὐτήν.
