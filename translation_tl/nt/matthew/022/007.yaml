source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: tl
  text: Ngunit nagalit ang hari. Isinugo niya ang kanyang mga kawal, pinuksa ang mga mamamatay-taong iyon, at sinunog ang kanilang lungsod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: nagalit
  rationale: Direkta at natural na katumbas sa modernong Tagalog ng pagkapoot o pagkagalit ng hari.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: ang kanyang mga kawal
  rationale: Sa konteksto, tumutukoy ito sa mga puwersang militar ng hari; mas malinaw at likas ang “mga kawal” kaysa abstraktong “hukbo.”
- source_word: ἀπώλεσεν
  choice: pinuksa
  rationale: Ipinahahayag ang marahas at ganap na paglipol sa mga mamamatay-tao nang hindi pinapahina ang pandiwa.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: ang mga mamamatay-taong iyon
  rationale: Tumpak na pinananatili ang tiyak at mapanuring pagtukoy ng Griyego.
- source_word: ἐνέπρησεν
  choice: sinunog
  rationale: Karaniwan at malinaw na Tagalog para sa sadyang pagsunog sa lungsod.
theological_decisions:
- issue: Kung dapat gawing tahasang alegorikal o makahula ang pagkawasak ng lungsod
  choice: Pinanatili bilang tuwirang pangyayari sa salaysay ng talinghaga
  alternative: Ipahiwatig sa salin na tumutukoy ito sa isang tiyak na makasaysayang paghatol
  rationale: Hindi tahasang ibinibigay ng talata ang interpretasyon; ang salin ay hindi dapat magpasok ng denominasyonal o historikal na pagpapakahulugan.
translation_notes:
  register: Makabagong, dignidadong Filipino na madaling maunawaan. Hinati sa dalawang pangungusap para sa likas na daloy, habang pinananatili ang pagkakasunod-sunod ng mga kilos sa Griyego.
