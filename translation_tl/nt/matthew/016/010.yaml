  source_fidelity: 'Tapat ang salin sa eliptikal na pagpapatuloy ng retorikal na tanong: naipapahayag ang pitong tinapay na kaugnay ng apat na libo, ang tanong sa dami, at ang mas malaking uri ng basket (σπυρίδες). Ang “tinipon ninyo” ay angkop sa konteksto ng pagkuha/paglikom matapos ang pagpapakain.'
