  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: tl
  text: O ang pitong tinapay para sa apat na libo[a]—at ilang malalaking basket ang tinipon ninyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ni ang pitong tinapay ng apat na libo—at ilang malalaking basket ang tinipon ninyo?”'
    reason: Pinananatili ng alternatibo ang mas literal na lakas ng οὐδὲ at ng genitibong τῶν τετρακισχιλίων, bagaman hindi ito kasing-natural sa Filipino kapag hiwalay na binabasa ang talata.
lexical_decisions:
- source_word: οὐδὲ
  choice: O
  rationale: Sa sunod-sunod na retorikal na tanong, natural na ipinakikilala ng “O” ang ikalawang pangyayaring dapat nilang maalala. Nananatiling posible ang mas literal na “Ni,” ngunit hindi ito gaanong natural kapag hiwalay na binabasa ang talata.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ang pitong tinapay
  rationale: Sa Filipino, karaniwang ginagamit ang “tinapay” bilang pangmaramihang pangngalang di-binibilang; malinaw sa bilang na pito na mga piraso o buong tinapay ang tinutukoy.
- source_word: τῶν τετρακισχιλίων
  choice: para sa apat na libo
  rationale: Ipinahahayag nito nang natural ang kaugnayan ng mga tinapay sa pagpapakain sa apat na libong tao nang hindi ginagawang pag-aari nila ang tinapay.
- source_word: πόσας
  choice: ilang
  rationale: Ito ang tuwiran at likas na katumbas ng pang-uring pananong na tumutukoy sa bilang ng mga basket.
- source_word: σπυρίδας
  choice: malalaking basket
  rationale: Ang σπυρίς ay tumutukoy sa isang malaking uri ng basket. Pinananatili ng “malalaking basket” ang pagkakaiba nito sa κόφινος na ginamit sa naunang pagpapakain.
- source_word: ἐλάβετε
  choice: tinipon ninyo
  rationale: Sa konteksto ng paglikom sa mga natirang pagkain, malinaw at natural ang “tinipon ninyo,” habang hindi ipinahihiwatig na basta natanggap lamang nila ang mga basket.
