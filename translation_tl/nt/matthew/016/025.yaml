  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: tl
  text: Sapagkat ang sinumang nagnanais iligtas ang kanyang buhay[a] ay mawawalan nito; ngunit ang sinumang mawalan ng kanyang buhay alang-alang sa akin ay makasusumpong nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sarili” o “kaluluwa” sa buong bersikulo; ang salitang Griyego na psychē ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Sapagkat ang sinumang ... ngunit ang sinumang
  rationale: Ang mga di-tiyak na kondisyong may ἐὰν/ἂν ay likas na ipinahahayag sa Tagalog bilang “ang sinumang.” Pinananatili ng “Sapagkat” ang ugnayan ng γάρ sa naunang pahayag, at ipinakikita ng “ngunit” ang pagsalungat na dala ng δέ.
- source_word: θέλῃ
  choice: nagnanais
  rationale: Ipinahahayag nito ang pagkukusa o pagnanais. Ang “nagnanais” ay natural at marangal sa modernong Tagalog.
- source_word: ψυχὴν
  choice: buhay
  rationale: Sa konteksto ng pagsunod kay Jesus at ng magkapares na mga pandiwang magligtas, mawalan, at makatagpo, ang “buhay” ang pinakamalinaw na pangunahing salin. Hindi nito lubusang inuubos ang lawak ng ψυχή, kaya inilalagay sa talababa ang “sarili” at “kaluluwa” bilang tunay na mga posibilidad.
- source_word: σῶσαι
  choice: magligtas
  rationale: Tuwirang pinananatili ng “magligtas” ang diwa ng σῴζω at ang matinding kabalintunaan nito sa “mawawalan.”
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ay mawawalan / mawalan
  rationale: Sa kontekstong ito, ang ἀπόλλυμι ay tumutukoy sa pagkawala ng buhay, hindi kinakailangang sa pagwasak o paglipol. Ang unang anyo ay isinaling panghinaharap, samantalang ang ikalawa ay likas na nasa sugnay na “ang sinumang mawalan.”
- source_word: ἕνεκεν ἐμοῦ
  choice: alang-alang sa akin
  rationale: Ipinahahayag nito ang dahilan o motibong nakasentro kay Jesus at likas na katumbas ng pariralang Griyego.
- source_word: εὑρήσει
  choice: makakatagpo
  rationale: Pinananatili nito ang literal na larawan ng εὑρίσκω na “makatagpo,” sa halip na ipakahulugang agad bilang “makakamit.”
- source_word: αὐτοῦ / αὐτήν
  choice: kanyang / nito
  rationale: Ang “kanyang” ay tumutugma sa kinatawang panlalaking isahan ng Griyego nang hindi kailangang gawing maramihan; ang “nito” ay malinaw na tumutukoy pabalik sa “buhay.”
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa kabalintunaan ng pagsunod
  choice: buhay
  alternative: sarili; kaluluwa
  rationale: Ang pagligtas, pagkawala, at pagkakatagpo sa ψυχή sa harap ng pagsunod kay Jesus at kamatayan ay pinakamadaling maunawaan bilang “buhay.” Gayunman, maaaring tumukoy ang salita sa buong sarili o sa kaluluwa; pinananatili ang semantikong lawak na ito sa talababa upang hindi paliitin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mawawalan ng kanyang buhay” sa halip na ang mas kolokyal na “mawawala ang buhay niya,” upang mapanatili ang magkatulad na ayos at tuon ng dalawang sugnay.
