  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: tl
  text: At isinama ni Pedro si Jesus sa isang tabi at sinimulan niya siyang sawayin. Sinabi niya, “Huwag sana, Panginoon![a] Hinding-hindi ito mangyayari sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kaawaan ka nawa, Panginoon!” o “Malayo nawa ito sa iyo, Panginoon!” Idyomatiko at eliptikal ang pananalitang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος αὐτόν
  choice: isinama ni Pedro si Jesus sa tabi
  rationale: Ipinahihiwatig ng gitnang anyo at ng konteksto na inilayo muna ni Pedro si Jesus upang kausapin nang sarilinan. Ginamit ang pangalang “Jesus” sa halip na panghalip upang maging malinaw at natural sa Filipino.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: sinimulan siyang sawayin
  rationale: Napananatili ng “sinimulan” ang ingressive na puwersa ng ἤρξατο, at tuwirang ipinapahayag ng “sawayin” ang matinding pagtutol o pagsita ng ἐπιτιμάω.
- source_word: Ἵλεώς σοι
  choice: Huwag nawa
  rationale: Idyomatiko at eliptikal ang Griyegong pananalita. Ang “Huwag nawa” ay likas na pahayag ng mariing pagtutol sa modernong Filipino at hindi tahasang nagdaragdag ng “Diyos,” na wala sa teksto. Inilalahad sa talababa ang literal at tradisyonal na mga posibilidad.
- source_word: κύριε
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang kahulugan ng κύριος at ang magalang at kristolohikal na bigat ng pagtawag ni Pedro kay Jesus.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Hinding-hindi ito mangyayari sa iyo
  rationale: Ang inuulit na “hindi” ay natural na naghahatid sa Filipino ng mariing pagtanggi ng οὐ μή kasama ng pandiwang nasa hinaharap.
theological_decisions:
- issue: Kung paano isasalin ang eliptikal na protesta ni Pedro nang hindi nagdaragdag ng teolohikal na paksa
  choice: Huwag nawa, Panginoon!
  alternative: Kaawaan ka nawa, Panginoon! / Huwag nawang ipahintulot ng Diyos, Panginoon!
  rationale: May diwa ng pagiging maawain o mapagpala ang ἵλεως, ngunit idyomatiko ang buong pariralang Ἵλεώς σοι. Ang pangunahing salin ay naghahatid ng mariing pagtutol ni Pedro nang hindi tahasang ipinapasok ang “Diyos.” Pinananatili sa talababa ang tunay na leksikal at idyomatikong kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “isinama … sa tabi” at “sinimulan siyang sawayin” upang maging natural sa karaniwang mambabasa habang nananatiling malapit sa kilos at tindi ng Griyego. Ang tandang [a] ay inilagay kaagad pagkatapos ng pinagtatalunang idyoma.
