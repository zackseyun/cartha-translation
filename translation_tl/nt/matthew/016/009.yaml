base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: tl
  text: Hindi pa rin ba ninyo nauunawaan[a], ni hindi ninyo naaalala ang limang tinapay para sa limang libo at kung ilang basket ang nakuha ninyo[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi pa ba ninyo nauunawaan.”
    reason: lexical_alternative
  - marker: b
    text: O, “kung ilang basket ang inyong inipon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: hindi pa rin
  rationale: 'Ipinahahayag nito ang temporal na diin ng pagsaway: hanggang sa sandaling iyon ay hindi pa rin nila nauunawaan.'
- source_word: νοεῖτε
  choice: nauunawaan
  rationale: Tumutukoy ito sa pag-unawa sa kahulugan ng mga naunang pangyayari, hindi lamang sa pagkakita o pagkapansin.
- source_word: οὐδὲ
  choice: at hindi ba
  rationale: Likas sa modernong Tagalog ang pag-uulit ng tanong upang malinaw na iugnay ang dalawang negatibong pandiwa.
- source_word: μνημονεύετε
  choice: naaalala
  rationale: Direkta at karaniwang salin para sa paggunita sa naunang himala.
- source_word: τοὺς πέντε ἄρτους
  choice: ang limang tinapay
  rationale: Sa konteksto ng pagpapakain, ang ἄρτοι ay mga tinapay; hindi kailangang idagdag ang salitang 'piraso' o 'bilog' na wala sa teksto.
- source_word: τῶν πεντακισχιλίων
  choice: para sa limang libo
  rationale: Malinaw na ipinakikita ang kaugnayan ng limang tinapay sa pagpapakain sa limang libong tao.
- source_word: πόσους κοφίνους
  choice: kung ilang basket
  rationale: Pinananatili ang tanong tungkol sa bilang at ang konkretong larawan ng mga basket.
- source_word: ἐλάβετε
  choice: inyong inipon
  rationale: Sa konteksto, tumutukoy ito sa pagkuha o pagtitipon ng mga natira sa mga basket; natural sa Tagalog ang 'inipon' habang ang mas literal na 'kinuha' ay inilagay sa talababa.
