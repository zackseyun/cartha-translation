base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: tl
  text: Paanong hindi ninyo nauunawaan na hindi tungkol sa tinapay ang sinabi ko sa inyo? Ngunit mag-ingat kayo sa pampaalsa ng mga Pariseo at mga Saduseo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bantayan ninyo ang inyong sarili laban sa pampaalsa ng mga Pariseo at mga Saduseo.”
    reason: lexical_alternative
  - marker: b
    text: Talinghaga rito ang “pampaalsa”; sa kasunod na talata, ipinaliliwanag ito bilang turo ng mga Pariseo at mga Saduseo.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Paanong hindi ninyo nauunawaan
  rationale: Pinananatili nito ang anyo at mapagsaway na puwersa ng retorikal na tanong, habang gumagamit ng likas at malinaw na modernong Tagalog.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: na hindi tungkol sa tinapay ang sinabi ko sa inyo
  rationale: Bagaman pangmaramihan ang ἄρτων, ang pangkalahatang salitang “tinapay” ang likas sa Tagalog sa kontekstong ito. Tuwirang inililipat ng “ang sinabi ko sa inyo” ang εἶπον ὑμῖν.
- source_word: προσέχετε
  choice: mag-ingat kayo
  rationale: Ang pandiwa ay isang pautos na babala, hindi lamang panawagang magbigay-pansin. Karaniwan at malinaw sa modernong Tagalog ang “mag-ingat kayo.”
- source_word: δὲ
  choice: Sa halip
  rationale: Ipinahihiwatig dito ang pagwawasto mula sa maling pagkaunawa tungkol sa literal na tinapay tungo sa tunay na babala. Ang “Sa halip” ay likas na naghahayag ng ganitong salungat na paglipat.
- source_word: ἀπὸ τῆς ζύμης
  choice: sa pampaalsa
  rationale: Kasama ng προσέχετε, ipinapakita ng ἀπό kung ano ang dapat pag-ingatan. Pinananatili ng “pampaalsa” ang talinghaga at mas madaling maunawaan sa kasalukuyang Tagalog kaysa sa mas teknikal o lumang katawagan.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ng mga Pariseo at mga Saduseo
  rationale: Ginagamit ang kinikilalang mga anyong Tagalog para sa dalawang pangkat. Pinananatili ng pariralang may “ng” ang kaugnayang nagsasaad na ang pampaalsa ay kanila o katangian nila.
theological_decisions:
- issue: Matalinghagang gamit ng ζύμη
  choice: Panatilihin sa pangunahing teksto ang “pampaalsa” nang hindi pa ito pinapalitan ng “turo.”
  alternative: mag-ingat kayo sa turo ng mga Pariseo at mga Saduseo
  rationale: Ang mismong talata ay gumagamit ng talinghaga, at sa kasunod na talata pa ito ipinaliliwanag bilang turo. Ang pagpapanatili sa talinghaga ay tapat sa pinagmulan at hindi inuuna ang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang magalang na pangmaramihang “ninyo/kayo,” ang karaniwang katawagang “tinapay,” at ang malinaw na “pampaalsa” upang mapanatili ang talinghaga nang hindi nagiging lipas o labis na teknikal.
