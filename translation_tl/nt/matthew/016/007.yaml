translation:
  language: tl
  text: 'At nag-uusap-usap sila: “Hindi tayo nagdala ng tinapay.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: At sila
  rationale: Ang δέ ay banayad na pang-ugnay sa pagpapatuloy ng salaysay; natural itong isalin bilang “At” nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: διελογίζοντο
  choice: nag-uusap-usap
  rationale: Ipinahihiwatig ng imperfect na anyo ang nagpapatuloy na pagtalakay o pag-iisipan; ang “nag-uusap-usap” ay natural sa makabagong Filipino at angkop sa magkakasamang alagad.
- source_word: ἐν ἑαυτοῖς
  choice: sila
  rationale: Sa Filipino, ipinahihiwatig na ng kapwa-resiprokal na “nag-uusap-usap sila” na sa kanilang sariling pangkat nagaganap ang usapan, kaya hindi na kailangang idagdag ang mabigat na “sa kanilang sarili.”
- source_word: λέγοντες
  choice: “…”
  rationale: Ang nilalaman ng participleng “sinasabi” ay natural na ipinakikilala sa Filipino sa pamamagitan ng tuwirang sipi, nang hindi na inuulit ang pandiwang “sinasabi.”
- source_word: Ἄρτους
  choice: tinapay
  rationale: Bagaman maramihan ang anyong Griyego, tumutukoy ito rito sa tinapay bilang panustos; karaniwan at natural sa Filipino ang pangkalahatang “tinapay.”
- source_word: οὐκ ἐλάβομεν
  choice: Hindi tayo nagdala
  rationale: Sa konteksto ng paglalakbay, ang λαμβάνω ay nangangahulugang kumuha o magdala bilang baon. Ang “nagdala” ay malinaw at idiomatiko; ginamit ang inklusibong “tayo” sapagkat magkakasamang nag-uusap ang mga alagad tungkol sa kanilang sama-samang pagkukulang.
theological_decisions: []
translation_notes:
  register: 'Makabago, natural, at marangal na Filipino. Pinanatiling payak ang tuwirang sabi at hindi idinagdag ang interpretibong “Iyon ay dahil,” yamang maaari lamang ipakilala ng ὅτι ang nilalaman ng kanilang usapan. Hindi kailangan ang talababa: ang alternatibong diwa na “hindi tayo kumuha/nagbaon ng tinapay” ay sapat nang kinakatawan ng natural na “hindi tayo nagdala ng tinapay.”'
