  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: tl
  text: Nang makarating ang mga alagad sa kabilang panig, nalimutan nilang magdala ng mga tinapay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: Nang makarating
  rationale: Ipinapahayag nang natural sa Filipino ang pansamantalang ugnayan ng aorist participle sa pangunahing pandiwa.
- source_word: οἱ μαθηταὶ
  choice: ang mga alagad
  rationale: Karaniwang katawagan sa mga disipulo ni Jesus sa makabagong saling Filipino.
- source_word: εἰς τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Likas na parirala para sa pagdating sa kabilang panig ng lawa; hindi na idinaragdag ang 'lawa' dahil ipinahihiwatig lamang ito ng konteksto.
- source_word: ἐπελάθοντο
  choice: nalimutan nilang
  rationale: Tuwirang ipinapahayag ang pagkalimot; sa Filipino, malinaw na sa salaysay na nauna ang pagkalimot sa kanilang pagdating.
- source_word: ἄρτους
  choice: mga tinapay
  rationale: Pinananatili ang maramihang anyo ng Griyego, na maaaring tumukoy sa mga piraso o bilog na tinapay na baon.
- source_word: λαβεῖν
  choice: magdala
  rationale: Sa konteksto ng paglalakbay, mas natural ang 'magdala' kaysa 'kumuha' at malinaw nitong ipinapahayag na dapat sana nilang naisama ang tinapay.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga alagad” bilang pamilyar na katawagang biblikal at ang “kabilang ibayo” bilang natural na pahayag para sa kabilang panig. Ang talababa ay inilagay matapos ang pariralang tinutukoy nito.
