id: MAT.16.18
reference: Matthew 16:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: tl
  text: At sinasabi ko rin sa iyo, ikaw ay si Pedro, at sa batong ito[a] ay itatayo ko ang aking iglesya, at ang mga pintuan ng Hades[b] ay hindi mananaig laban dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, may larong-salita sa pangalang Pedro (Petros) at sa “bato” (petra). Maaaring unawain ang “batong ito” na tumutukoy kay Pedro, sa ipinahayag ni Pedro, o kay Pedro bilang tagapagpahayag at kinatawang apostol.
    reason: alternative_reading
  - marker: b
    text: Griyego, Hades; samakatuwid, ang daigdig ng mga patay. Ayon sa tradisyon, “impiyerno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ σοι λέγω
  choice: At sinasabi ko rin sa iyo
  rationale: Pinananatili ng “rin” ang pagbibigay-diin ng κἀγώ at ang tugon ni Jesus sa naunang pahayag ni Pedro, samantalang likas sa modernong Tagalog ang kabuuang parirala.
- source_word: Πέτρος
  choice: Pedro
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa Tagalog. Ipinaliliwanag sa talababa ang larong-salita nito sa πέτρα, na hindi lubos na maililipat sa Tagalog.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: sa ibabaw ng batong ito
  rationale: Tuwirang pinananatili ang larawan ng pagtatayo sa isang bato at ang demonstratibong ταύτῃ (“ito”), nang hindi tinutukoy sa salin kung ano o sino ang tinutukoy ng bato.
- source_word: οἰκοδομήσω
  choice: itatayo ko
  rationale: Pinananatili ang metapora ng pagtatayo; natural din ito sa Tagalog para sa pagtatayo ng isang pamayanan.
- source_word: μου τὴν ἐκκλησίαν
  choice: ang aking iglesya
  rationale: Ang “iglesya” ang pamilyar na salitang Tagalog para sa pamayanang kay Jesus at malinaw na pinananatili ang pagmamay-aring μου (“aking”).
- source_word: πύλαι ᾅδου
  choice: ang mga pintuan ng Hades
  rationale: Pinananatili ang kongkretong larawang “mga pintuan” at ang tiyak na terminong Hades, sa halip na ipagkamali ito sa Gehenna o agad na tumbasan ng “impiyerno.”
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: ay hindi mananaig laban dito
  rationale: Ang “mananaig laban dito” ay natural at tumpak na nagpapahayag ng pagdaig o pagiging higit na malakas; ang “dito” ay tumutukoy sa iglesya.
theological_decisions:
- issue: Ang tinutukoy ng “batong ito” (πέτρᾳ)
  choice: Hindi tinukoy sa pangunahing teksto; pinanatili bilang “batong ito.”
  alternative: Maaaring unawain na tumutukoy kay Pedro, sa ipinahayag ni Pedro, o kay Pedro bilang tagapagpahayag at kinatawang apostol.
  rationale: May tunay na larong-salita sa Πέτρος at πέτρα, ngunit hindi tahasang nilulutas ng Griyegong pangungusap ang lahat ng tanong tungkol sa tinutukoy nito. Pinananatili ng salin ang kinikilalang teolohikal na tensiyon.
- issue: Kahulugan ng ᾅδης
  choice: Hades
  alternative: daigdig ng mga patay; ayon sa tradisyon, impiyerno
  rationale: Mas tiyak ang “Hades” sa salitang Griyego at hindi nito ipinapasok ang mga kaugnayang doktrinal ng “impiyerno” bilang pangwakas na kaparusahan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “iglesya” bilang karaniwang terminong biblikal ngunit iniwasang bigyan ito ng denominasyonal na kahulugan. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang tinatalakay ng mga talababa.
