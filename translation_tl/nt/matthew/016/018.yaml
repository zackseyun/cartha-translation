  source_fidelity: Tumpak na naipapahayag ng draft ang diin ng κἀγώ ("rin"), ang pangalang Pedro, ang pagtatayo ng sariling iglesya ni Jesus, at ang pangakong hindi ito madadaig ng mga pintuan ng Hades. Pinananatili rin nito ang hindi paglutas sa pinagtatalunang tinutukoy ng πέτρα. Gayunman, ang "sa ibabaw ng batong ito" ay masyadong nagmumungkahi ng pisikal na lokasyong nasa ibabaw ng bato; sa metapora ng pagtatayo, ang mas likas at tumpak na Tagalog ay "sa batong ito."
  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Ang "sa batong ito ay itatayo ko" ay mas natural na Filipino at mas maayos na naghahatid ng larawan ng pundasyong-bato kaysa "sa ibabaw ng batong ito."
  terminology: Ang "Pedro," "iglesya," at "Hades" ay angkop na mga terminong biblikal sa modernong Filipino Tagalog. Ang talababa tungkol sa Hades ay wastong iniiwasang ipantay ito nang walang pasubali sa impiyerno. Ang talababa tungkol sa bato ay nararapat at hindi nagdidikta ng isang interpretasyong denominasyonal.
