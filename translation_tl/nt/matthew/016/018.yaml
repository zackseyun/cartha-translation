  to: At sinasabi ko rin sa iyo, ikaw ay si Pedro, at sa batong ito[a] ay itatayo ko ang aking iglesya, at ang mga pintuan ng Hades[b] ay hindi mananaig laban dito.
  rationale: Pinalitan ang "sa ibabaw ng batong ito" ng "sa batong ito" upang maging mas natural ang Tagalog at upang mas tumpak na maipahayag ang metapora ng pagtatayo sa bato. Walang binagong kahulugang teolohikal o paglutas sa tinutukoy ng "batong ito."
