id: MAT.16.27
reference: Matthew 16:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: tl
  text: Sapagkat malapit nang dumating[a] ang Anak ng Tao sa kaluwalhatian ng kanyang Ama, kasama ang kanyang mga anghel, at pagkatapos ay gagantihan niya ang bawat isa ayon sa kanyang gawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “darating” o “darating na.” Ang Griyego ay may diwang “malapit nang dumating,” kaya ipinahihiwatig na nalalapit ang pangyayari.
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanyang ginawa.” Pang-isahan sa Griyego ang “gawa” o “kilos,” ngunit ginagamit ito upang tumukoy sa asal o ginawa ng bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: malapit nang
  rationale: Ipinahahayag ng μέλλω na nalalapit o nakaambang mangyari ang kilos; pinananatili ng “malapit nang” ang diwa ng pagiging nalalapit sa halip na gawing payak na panghinaharap lamang.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng dahilan para sa naunang pahayag; likas at malinaw na pang-ugnay sa Filipino ang “Sapagkat.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang kinikilalang tuwirang salin ng titulong ito at pinananatili ang kaugnayan nito sa mas malawak na biblikal na larawan.
- source_word: ἔρχεσθαι
  choice: dumating
  rationale: Ang infinitive na ito ang kilos na tinutukoy ng μέλλει. Likas sa Filipino ang “malapit nang dumating” at nananatili ang diwa ng pagdating.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: sa kaluwalhatian ng kanyang Ama
  rationale: Pinananatili ng “sa” ang diwa ng ἐν bilang kalagayan o pagpapamalas ng pagdating, at hayag na ipinapakita ng “ng kanyang Ama” ang ugnayang nasa genitive.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: kasama ang kanyang mga anghel
  rationale: Tuwirang ipinahahayag nito ang pagsama na tinutukoy ng μετά at pinananatili ang panghalip na paari.
- source_word: καὶ τότε
  choice: at kung magkagayon
  rationale: 'Minamarkahan nito ang pagkakasunod-sunod: una ang pagdating, saka ang pagganti. Ang “at kung magkagayon” ay dignificado at natural sa konteksto.'
- source_word: ἀποδώσει
  choice: gagantihan niya
  rationale: Sa konteksto ng paghatol, nangangahulugan ang ἀποδίδωμι ng pagbibigay sa isang tao ng nararapat sa kanya. Maaaring saklawin ng “gagantihan” ang mabuti o masamang kapalit nang hindi nililimitahan sa gantimpalang positibo.
- source_word: ἑκάστῳ
  choice: ang bawat isa
  rationale: 'Pinananatili nito ang pamamahaging diin ng pang-isahang dative: bawat tao ay hahatulan nang isa-isa.'
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: ayon sa kanyang gawa
  rationale: Pinananatili ng “gawa” ang pang-isahang anyo ng πρᾶξις, habang maaari itong unawain nang pamahagi bilang kilos o asal ng bawat tao.
theological_decisions:
- issue: Ang eskatolohikal na puwersa ng μέλλει kaugnay ng pagdating ng Anak ng Tao
  choice: malapit nang dumating
  alternative: darating; darating na; nakatakdang dumating
  rationale: Tahasan sa Griyego ang μέλλω kasama ng infinitive, na karaniwang nagpapahiwatig ng nalalapit na kilos. Pinananatili ng salin ang tensiyong ito nang hindi nilulutas sa pagsasalin ang mas malawak na pagtatalo tungkol sa panahon ng katuparan.
- issue: Paghatol ayon sa gawa
  choice: gagantihan niya ang bawat isa ayon sa kanyang gawa
  alternative: bibigyan niya ang bawat isa ayon sa kanyang ginawa; susuklian niya ang bawat isa ayon sa kanyang mga gawa
  rationale: Nagsasaad ang talata ng indibidwal na pagganti sa paghatol ngunit hindi nito inilalatag ang isang buong sistemang doktrinal. Pinananatili ng “gagantihan” at “gawa” ang hudisyal na diwa at ang pang-isahang anyo nang walang dagdag na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang kinikilalang titulong “Anak ng Tao,” iniwasan ang makalumang balangkas, at pinanatili ang nalalapit na diwa ng μέλλει at ang hudisyal ngunit hindi sektaryong tono ng ἀποδώσει.
