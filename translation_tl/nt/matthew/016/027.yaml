  to: Sapagkat malapit nang dumating[a] ang Anak ng Tao sa kaluwalhatian ng kanyang Ama, kasama ang kanyang mga anghel, at pagkatapos ay gagantihan niya ang bawat isa ayon sa kanyang gawa.[b]
