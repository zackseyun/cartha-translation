  naturalness: Marangal at likas sa modernong Filipino ang karamihan ng pahayag. Mas malinaw at tuwirang katumbas ng pagkakasunod-sunod ang «at pagkatapos» kaysa «at kung magkagayon.»
  terminology: Ang «Anak ng Tao,» «kaluwalhatian,» «mga anghel,» at «gawa» ay angkop at pare-pareho. Ang «gagantihan» ay maaaring tumukoy sa nararapat na mabuti o masamang tugon at angkop sa kontekstong panghatol.
