  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: tl
  text: Pagkatapos, mahigpit niyang inutusan ang mga alagad na huwag sabihin kaninuman na siya ang Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang Cristo.” Ang salitang Griego na Χριστός ay isang titulong nangangahulugang “pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Pagkatapos
  rationale: Tumutukoy ito sa kasunod na pangyayari sa salaysay; natural at malinaw ang “Pagkatapos” sa modernong Tagalog.
- source_word: διεστείλατο
  choice: mahigpit niyang inutusan
  rationale: Ipinahahayag ng pandiwa ang isang mariing utos o tagubilin. Pinananatili ng salin ang tindi nang hindi nagpapahiwatig ng panganib na maaaring idulot ng “binalaan.”
- source_word: τοῖς μαθηταῖς
  choice: ang mga alagad
  rationale: Tumutukoy sa kilalang pangkat ng mga tagasunod ni Jesus; hindi kailangang idagdag ang “niya” dahil malinaw na ito sa konteksto.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: na huwag sabihin kaninuman
  rationale: Natural na Tagalog para sa nilalaman ng utos at malinaw na pinananatili ang ganap na pagbabawal.
- source_word: ὅτι αὐτός ἐστιν
  choice: na siya ang
  rationale: Tuwirang ipinahahayag ang nilalaman ng hindi nila dapat sabihin, nang hindi dinaragdagan ng diin ang tahasang panghalip na αὐτός.
- source_word: ὁ χριστός
  choice: Mesiyas
  rationale: Dito, ang Χριστός ay titulong tumutukoy sa ipinangakong pinahiran ng Diyos. Ang “Mesiyas” ay natural at kinikilalang anyo sa Tagalog na nagpapanatili sa kahulugan nito bilang titulo.
theological_decisions:
- issue: Pagkakasalin sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, ang Χριστός ay isang titulo, hindi lamang pangalang pantangi. Inilalahad ng “Mesiyas” ang mesiyanikong kahulugan nito, habang itinatala sa talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “kaninuman” upang mapanatili ang pormal ngunit madaling maunawaang himig, at “mahigpit niyang inutusan” upang ihatid ang lakas ng utos.
