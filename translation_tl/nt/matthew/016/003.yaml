id: MAT.16.3
reference: Matthew 16:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: tl
  text: At sa umaga naman, ‘Magiging maunos ngayon, sapagkat mapula at makulimlim ang langit.’ Marunong kayong kumilala sa anyo ng langit,[a] ngunit hindi ninyo kayang kumilala sa mga tanda ng mga panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mukha ng langit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tanda ng mga panahon” ay maaaring tumukoy nang higit na tiyak sa espirituwal na kabuluhan ng kasalukuyang sandali, kasama ang mga gawa ni Jesus bilang Mesiyas.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: sa umaga
  rationale: Pang-abay itong tumutukoy sa oras. Likas sa modernong Tagalog ang “sa umaga,” at ipinakikita ng “naman” ang paghahambing sa naunang kasabihan tungkol sa gabi.
- source_word: χειμών
  choice: magiging maunos
  rationale: Sa kontekstong ito, tumutukoy ang salita sa masamang lagay ng panahon o unos, hindi sa panahong taglamig. Ang “magiging maunos” ay malinaw na hulang-panahon nang hindi nililimitahan sa isang partikular na uri ng bagyo.
- source_word: πυρράζει
  choice: mapula
  rationale: Inilalarawan ng pandiwa ang mapulang anyo ng langit. Maikli at likas ang “mapula” sa paglalarawan ng lagay ng langit.
- source_word: στυγνάζων
  choice: makulimlim
  rationale: Ipinahihiwatig ng participle na madilim, mabigat, o nagbabantang umulan ang langit. Ang “makulimlim” ang pinakanatural na katumbas sa kontekstong meteorolohikal.
- source_word: πρόσωπον
  choice: anyo
  rationale: Literal na “mukha,” ngunit sa idyomang ito ay tumutukoy sa nakikitang kalagayan o hitsura ng langit. Pinananatili sa talababa ang literal na larawan.
- source_word: γινώσκετε διακρίνειν
  choice: marunong kayong kumilala
  rationale: Ipinahahayag ng konstruksiyon ang kaalaman o kakayahang magsuri at umunawa. Ang “marunong kayong kumilala” ay natural at pinananatili ang aspektong mapanuri.
- source_word: σημεῖα
  choice: mga tanda
  rationale: Ang “mga tanda” ay karaniwang katumbas na may saklaw na ebidensiyal at mapaghayag, alinsunod sa gamit ni Mateo.
- source_word: καιρῶν
  choice: mga panahon
  rationale: Tumutukoy ang καιρός sa mahahalaga o itinakdang panahon, hindi lamang sa mga season ng klima. Pinananatili ng “mga panahon” ang malawak na kahulugan at ang posibleng mesiyaniko at eskatolohikal na pahiwatig.
- source_word: οὐ δύνασθε
  choice: hindi ninyo kayang kumilala
  rationale: Tahasang ipinahahayag nito ang kawalan ng kakayahan. Ang pag-uulit sa “kumilala” ay nagpapalinaw sa paghahambing ng dalawang sugnay.
theological_decisions:
- issue: Kahulugan ng “mga tanda ng mga panahon”
  choice: Panatilihin ang malawak na parirala nang hindi ito nililimitahan sa mga tanda ng wakas ng panahon.
  alternative: “mga tanda ng kasalukuyang panahong ito” o “mga mesiyanikong tanda ng kapanahunan”
  rationale: Sinaway ni Jesus ang mga kausap niya dahil hindi nila nauunawaan ang espirituwal na kabuluhan ng kasalukuyang sandali at ng kaniyang mga gawa. Sapat ang lawak ng Griyego upang saklawin ang mesiyaniko at posibleng eskatolohikal na kahulugan, kaya hindi nilulutas ng salin ang tunay na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “maunos” upang mapanatili ang lakas ng χειμών nang hindi ito ginagawang teknikal na pangalan ng isang bagyo. Ang “anyo ng langit” at “mga tanda ng mga panahon” ay natural ngunit nananatiling malapit sa mga larawan at teolohikal na lawak ng Griyego.
