  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: tl
  text: “Katotohanang sinasabi ko sa inyo, may ilan sa mga nakatayo rito na hinding-hindi makatitikim ng kamatayan[a] hanggang sa makita nila ang Anak ng Tao na dumarating sa kanyang kaharian.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na hindi makatitikim ng kamatayan”; mariin ang pagtanggi sa Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang “Anak ng Tao na dumarating sa kanyang kaharian” ay maaaring tumukoy sa pagbabagong-anyo, sa muling pagkabuhay at pagkadakila, sa Pentecostes, sa paghatol sa Jerusalem, o sa huling pagdating. Hindi tinutukoy ng mismong teksto kung alin dito.
    reason: alternative_reading
  - marker: c
    text: O “sa kanyang paghahari” o “sa kanyang maharlikang pamamahala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Likas at marangal na pormula sa modernong Tagalog na naghahatid ng taimtim at may-awtoridad na pagpapatibay ng ἀμήν kasama ng tuwirang λέγω ὑμῖν.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: may ilan sa mga nakatayo rito
  rationale: 'Pinananatili ang partitive na diwa: ilan lamang sa mga taong naroroon at nakatayo ang tinutukoy.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: tiyak na hindi makatitikim ng kamatayan
  rationale: Ang “tiyak na hindi” ay naghahatid ng mariing pagtanggi ng οὐ μή, habang pinananatili ng “makatitikim ng kamatayan” ang matingkad na metapora ng Griyego.
- source_word: ἕως ἂν ἴδωσιν
  choice: hanggang sa makita nila
  rationale: Natural na katumbas sa Tagalog ng temporal na konstruksyong tumutukoy sa isang pangyayaring darating.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo at ang biblikal at apokaliptikong pahiwatig nito nang hindi ito ipinapaliwanag sa loob ng salin.
- source_word: ἐρχόμενον
  choice: na dumarating
  rationale: Tuwirang isinasalin ang participle bilang kilos ng Anak ng Tao; hindi idinaragdag ang “may kapangyarihan,” na wala sa talata.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: sa kanyang kaharian
  rationale: Pinananatili ang kongkretong larawan at pangunahing terminong “kaharian,” habang kinikilala sa talababa na maaari ring idiin ng βασιλεία ang paghahari o pamamahala.
theological_decisions:
- issue: Ang tinutukoy na pangyayari sa pagdating ng Anak ng Tao sa kanyang kaharian
  choice: Hindi tinukoy sa salin kung aling pangyayari ang tinutukoy.
  alternative: Maaaring iugnay sa pagbabagong-anyo, muling pagkabuhay at pagkadakila, Pentecostes, paghatol sa Jerusalem, o huling pagdating.
  rationale: Hindi tahasang kinikilala ng Griyegong teksto ang pangyayari; kaya pinananatili ng salin ang tunay na kalabuan at tensiyong teolohikal.
- issue: Saklaw ng βασιλεία
  choice: kaharian
  alternative: paghahari; maharlikang pamamahala
  rationale: Ang “kaharian” ay nagpapanatili sa tradisyonal at kongkretong larawan nang hindi nililimitahan ang salita sa abstraktong gawain ng pamamahala lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, taimtim, at madaling maunawaan. Pinanatili ang mga pangunahing larawang biblikal na “makatitikim ng kamatayan,” “Anak ng Tao,” at “kaharian,” ngunit gumamit ng idiomatikong pambungad na “Tinitiyak ko sa inyo.”
