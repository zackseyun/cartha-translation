id: MAT.16.6
reference: Matthew 16:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: tl
  text: Ngunit sinabi sa kanila ni Jesus, “Maging mapagmatyag kayo at mag-ingat sa pampaalsa[a] ng mga Pariseo at mga Saduseo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lebadura.” Ang salitang Griyego ay tumutukoy sa pampaalsang inihahalo sa masa. Ginamit ito rito bilang talinghaga na ipinaliliwanag ni Jesus sa kasunod na konteksto kaugnay ng turo ng mga Pariseo at mga Saduseo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang banayad na pagsalungat o paglipat mula sa naunang tagpo; natural sa daloy ng konteksto ang “Ngunit.”
- source_word: εἶπεν αὐτοῖς
  choice: sinabi sa kanila ni Jesus
  rationale: Tuwirang inililipat ang karaniwang gamit ng λέγω kasama ang di-tuwirang layon, sa natural na ayos ng pangungusap sa Tagalog.
- source_word: Ὁρᾶτε καὶ προσέχετε
  choice: Maging mapagmatyag kayo at mag-ingat
  rationale: Kapuwa pautos ang mga pandiwa at magkatuwang na nagpapalakas sa babala. Pinananatili ng salin ang pag-uulit nang hindi nagiging matigas o di-natural.
- source_word: ἀπὸ
  choice: sa
  rationale: Kasunod ng pandiwang “mag-ingat,” ang “sa” ang natural na katumbas sa Tagalog para sa bagay na dapat bantayan o iwasan.
- source_word: ζύμης
  choice: pampaalsa
  rationale: Karaniwan at malinaw na salitang Tagalog para sa sangkap na nagpapaalsa ng masa. Pinananatili nito ang talinghaga sa halip na ipalit agad ang paliwanag na “turo” o “impluwensiya.”
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat; kailangan ang “mga” upang ipahayag ang maramihan.
- source_word: Σαδδουκαίων
  choice: mga Saduseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat; kailangan ang “mga” upang ipahayag ang maramihan.
theological_decisions:
- issue: Talinghagang ζύμη
  choice: Panatilihin bilang “pampaalsa” sa pangunahing teksto.
  alternative: Isalin bilang “turo” o “impluwensiya.”
  rationale: Talinghaga ang mismong ginamit ni Jesus sa talatang ito. Bagaman ipinaliliwanag ito sa kasunod na konteksto kaugnay ng turo, ang maagang pagpapaliwanag nito sa pangunahing teksto ay mag-aalis sa tunay na anyo at unti-unting paglilinaw ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ang “Maging mapagmatyag” at “mag-ingat” ay nagpapanatili sa dobleng babala ng Griyego, samantalang ang “pampaalsa” ay madaling maunawaan ng karaniwang mambabasa at nananatiling matalinghaga.
