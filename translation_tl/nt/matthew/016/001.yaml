id: MAT.16.1
reference: Matthew 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: tl
  text: Lumapit ang mga Pariseo at mga Saduseo at, upang subukin siya,[a] hiniling nilang magpakita siya sa kanila ng isang tanda mula sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang tuksuhin siya” o “upang bitagin siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: Lumapit
  rationale: Likas na Tagalog para sa kilos ng paglapit kay Jesus na nauna sa pangunahing pandiwa.
- source_word: Φαρισαῖοι
  choice: mga Pariseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat.
- source_word: Σαδδουκαῖοι
  choice: mga Saduseo
  rationale: Karaniwang anyong Tagalog ng pangalan ng pangkat.
- source_word: πειράζοντες
  choice: upang subukin siya
  rationale: Ipinapahayag ang layunin ng kanilang paglapit at pinananatili ang diwang mapanubok at salungat nang hindi tahasang ipinakahulugang pagtatangkang bitagin.
- source_word: ἐπηρώτησαν
  choice: hiniling
  rationale: Sa kasunod na infinitive na ἐπιδεῖξαι, ang pandiwa ay likas na naipapahayag sa Tagalog bilang paghiling na gumawa ng isang bagay.
- source_word: σημεῖον
  choice: isang tanda
  rationale: Pinananatili ang payak na leksikal na kahulugan; bagaman mahimalang tanda ang ipinahihiwatig ng konteksto, hindi iyon idinaragdag sa teksto.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: mula sa langit
  rationale: Likas at tuwirang paglalahad ng pinagmulan ng tanda.
- source_word: ἐπιδεῖξαι
  choice: magpakita
  rationale: Malinaw at karaniwang katumbas ng pagpapakita o paghaharap ng hinihinging tanda.
theological_decisions:
- issue: Ang masamang layunin sa kahilingan ng mga Pariseo at Saduseo
  choice: upang subukin siya
  alternative: upang tuksuhin siya; upang bitagin siya
  rationale: Ang “subukin” ay nagpapanatili sa saklaw ng πειράζω at sa tensiyon ng teksto. Ang “tuksuhin” ay maaaring magpahiwatig ng pag-akit sa kasalanan, samantalang ang “bitagin” ay mas tiyak kaysa sa tahasang sinasabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hiniling nilang magpakita siya” bilang natural na ayos sa Tagalog, habang pinananatili ang “tanda mula sa langit” at ang sadyang hindi ganap na tinukoy na diwa ng πειράζοντες.
