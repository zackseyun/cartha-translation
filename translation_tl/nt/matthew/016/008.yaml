  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: tl
  text: Ngunit alam ito ni Jesus, kaya sinabi niya, “Bakit kayo nag-uusap-usap tungkol sa hindi ninyo pagdala ng mga tinapay, kayong mahina ang pananampalataya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: alam ito
  rationale: Ipinahahayag ng aorist participle ang pagkaalam ni Jesus bago siya nagsalita. Likas sa Tagalog ang “alam ito,” at ang “ito” ay kinukuha sa konteksto dahil walang tahasang layon sa Griyego.
- source_word: δὲ
  choice: Ngunit
  rationale: Nagsasaad ng banayad na pagsalungat o paglipat sa tugon ni Jesus sa usapan ng mga alagad.
- source_word: εἶπεν
  choice: sinabi niya
  rationale: Karaniwang salin ng pandiwang λέγω sa salaysay at angkop bilang pambungad sa tuwirang sinabi.
- source_word: Τί
  choice: Bakit
  rationale: Sa idyomang ito, itinatanong ang dahilan ng kanilang pag-uusap, hindi lamang ang paksa nito.
- source_word: διαλογίζεσθε
  choice: pinag-uusapan
  rationale: Tumutukoy sa pag-uusap o pagsasaalang-alang ng mga alagad sa isa't isa; malinaw at natural ito sa modernong Tagalog.
- source_word: ἐν ἑαυτοῖς
  choice: sa isa't isa
  rationale: Maaaring mangahulugang sa kanilang sarili o sa kanilang magkakasama. Dito, ipinakikita ng konteksto na nag-uusap ang mga alagad.
- source_word: ὀλιγόπιστοι
  choice: kayong mga kulang sa pananampalataya
  rationale: Pinananatili ang tuwirang pagsaway tungkol sa kakulangan ng pananampalataya nang hindi dinaragdagan ang teolohikal na diwa.
- source_word: ὅτι
  choice: na
  rationale: 'Ipinakikilala ang nilalaman ng kanilang pinag-uusapan: hindi sila nagdala ng tinapay.'
- source_word: ἄρτους
  choice: mga tinapay
  rationale: Pinananatili ang maramihang anyo ng Griyego at ang konkretong larawan ng mga piraso o buong tinapay na dala para sa pagkain.
- source_word: οὐκ ἐλάβετε
  choice: hindi kayo nagdala
  rationale: Bagaman literal na maaaring “hindi kayo kumuha,” sa konteksto ay tumutukoy ito sa hindi pagdadala ng tinapay sa paglalakbay; natural at tumpak sa Tagalog ang “nagdala.”
theological_decisions:
- issue: Lakas ng pagsaway na ὀλιγόπιστοι
  choice: “kayong mga kulang sa pananampalataya,” bilang tuwirang pagsaway sa hindi sapat na pagtitiwala ng mga alagad
  alternative: Isang mas banayad na paglalarawan lamang ng kanilang hindi pagkaunawa
  rationale: Tahasang tinutuligsa ng salita ang kakulangan ng kanilang pananampalataya sa sitwasyong ito, ngunit hindi ito pinalalawak tungo sa isang doktrinal na pahayag na lampas sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinag-uusapan sa isa't isa” upang maging natural ang deliberatibong diwa, at “mga tinapay” upang mapanatili ang konkretong maramihan ng orihinal.
