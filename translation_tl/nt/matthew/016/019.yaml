id: MAT.16.19
reference: Matthew 16:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: tl
  text: Ibibigay ko sa iyo ang mga susi ng kaharian ng langit[a]. Anuman ang itali mo sa lupa ay magiging nakatali na sa langit[b][c], at anuman ang kalagan mo sa lupa ay magiging nakalagan na sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “kaharian ng mga langit.” Madalas gamitin ni Mateo ang ekspresyong ito.'
    reason: lexical_alternative
  - marker: b
    text: Karaniwang isinasalin ito bilang “itatali … kakalagan.” Mas tiyak na maipahihiwatig ng anyong Griyego ang “magiging nakatali na … magiging nakalagan na.”
    reason: alternative_reading
  - marker: c
    text: Ang “itali” at “kalagan” ay maaaring tumukoy sa pagbabawal at pagpapahintulot, o sa pagpapataw at pag-aalis ng mga obligasyon; pinananatili rito ang talinghaga ng Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Ibibigay ko sa iyo
  rationale: Tuwirang ipinahahayag ng panghinaharap na pandiwa at ng di-tuwirang layon ang pangako ni Jesus. Likas at malinaw ito sa modernong Filipino.
- source_word: τὰς κλεῖδας
  choice: ang mga susi
  rationale: Pinananatili ang kongkretong talinghaga ng orihinal sa halip na ipaliwanag agad bilang isang tiyak na uri ng awtoridad.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: ng kaharian ng langit
  rationale: Ito ang likas at nakaugaliang anyo sa Filipino para sa ekspresyong madalas gamitin ni Mateo; binabanggit sa talababa ang literal na maramihang anyo.
- source_word: ὃ ἐὰν
  choice: anuman ang
  rationale: Likas na katumbas sa Filipino ng di-tiyak na kaugnay na konstruksyon at angkop sa dalawang magkatulad na sugnay.
- source_word: δήσῃς
  choice: itali mo
  rationale: Pinananatili ang talinghagang 'itali' at hindi ito nililimitahan sa isang interpretasyong institusyonal o legal.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Karaniwang Filipino para sa paghahambing ng lupa at langit sa talatang ito.
- source_word: ἔσται δεδεμένον
  choice: ay naitali na
  rationale: Ipinakikita ng 'na-' at 'na' ang natapos nang kilos at ang kalagayang bunga nito, na mas malapit sa future na εἰμί kasama ng perfect passive participle kaysa sa payak na 'itatali.'
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa langit
  rationale: Likas sa Filipino ang isahang 'langit' sa kontekstong ito, bagaman maramihan ang anyong Griyego.
- source_word: λύσῃς
  choice: kalagan mo
  rationale: Pinananatili ang katapat na talinghaga ng pagkalag sa halip na tahasang isalin bilang 'pahintulutan' o 'alisan ng obligasyon.'
- source_word: ἔσται λελυμένον
  choice: ay nakalagan na
  rationale: Tulad ng unang sugnay, ipinahahayag nito ang isang kalagayang bunga ng natapos nang kilos at pinananatili ang aspektuwal na diin ng Griyego.
theological_decisions:
- issue: Aspekto at implikasyon ng pormulang pagtali at pagkalag
  choice: Isinalin bilang “naitali na” at “nakalagan na” sa langit.
  alternative: “itatali” at “kakalagan” sa langit
  rationale: Ang ἔσται kasama ng perfect passive participle ay tumutukoy sa magiging kalagayan ng isang bagay na naitali o nakalagan na. Pinananatili ng salin ang gramatikal na pahiwatig na may kaugnayan ang kilos sa lupa sa nauna nang pasiya sa langit, nang hindi nagpapatibay ng isang partikular na doktrina tungkol sa awtoridad ng simbahan.
- issue: Kahulugan ng mga susi ng kaharian ng langit
  choice: Pinanatili ang talinghagang “mga susi.”
  alternative: “awtoridad na magpapasok at magtaboy” o “awtoridad ng katiwala”
  rationale: Maaaring magpahiwatig ng awtoridad ang larawan, ngunit hindi iyon tahasang nililinaw ng talata. Ang pagpapanatili sa talinghaga ay umiiwas sa pagpasok ng isang partikular na sistemang eklesiyolohikal.
- issue: Saklaw ng “itali” at “kalagan”
  choice: Pinanatili ang mga salitang talinghaga sa pangunahing teksto at ipinaliwanag ang posibleng gamit sa talababa.
  alternative: “ipagbawal” at “ipahintulot”
  rationale: Maaaring taglay ng mga salita ang diwang pagbabawal at pagpapahintulot o pagpapataw at pag-aalis ng obligasyon, ngunit hindi dapat gawing iisang tiyak na kahulugan ang tunay na lawak ng talinghaga.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang mahahalagang talinghagang “mga susi,” “itali,” at “kalagan.” Ginamit ang “naitali na” at “nakalagan na” upang maipakita sa likas na paraan ang aspektuwal na lakas ng periphrastic future-perfect construction sa Griyego.
