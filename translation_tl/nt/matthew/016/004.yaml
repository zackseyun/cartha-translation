reference: Matthew 16:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: tl
  text: “Isang masama at mapangalunyang[a] salinlahi ang naghahanap ng tanda, at walang tanda ang ibibigay rito maliban sa tanda ni Jonas.[b]” At iniwan niya sila at umalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taksil na salinlahi.” Literal na gumagamit ang Griyego ng salitang kaugnay ng pangangalunya, na malamang ay umaalingawngaw sa pananalita ng mga propeta tungkol sa pagtataksil sa Diyos o sa tipan.
    reason: lexical_alternative
  - marker: b
    text: Ipinaliliwanag sa Mateo 12:39–40 ang “tanda ni Jonas” sa pamamagitan ng tatlong araw at tatlong gabi ni Jonas, isang huwarang inilalapat sa Anak ng Tao.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: salinlahi
  rationale: Ang γενεά ay tumutukoy rito sa kasalukuyang pangkat o henerasyon ng mga tao. Pinananatili ng “salinlahi” ang kolektibong diwa nang hindi ito ginagawang mas malawak na “panahon” o mas malabong “mga tao.”
- source_word: πονηρὰ
  choice: masama
  rationale: Tuwirang ipinahahayag ng “masama” ang moral na kabulukan na tinutukoy ng πονηρά at natural ito sa kasalukuyang Filipino.
- source_word: μοιχαλὶς
  choice: mapangalunya
  rationale: Pinananatili nito ang matalas na talinghaga ng pangangalunya sa Griyego, pati ang posibleng alingawngaw ng pananalitang propetiko tungkol sa pagtataksil sa tipan, nang hindi nililimitahan ang kahulugan sa isang paliwanag lamang.
- source_word: σημεῖον
  choice: tanda
  rationale: Ang “tanda” ang tuwirang katumbas at hindi nito idinaragdag sa pangunahing teksto ang salitang “himala,” bagaman maaaring isang pambihirang pagpapatunay ang hinihingi sa konteksto.
- source_word: ἐπιζητεῖ
  choice: naghahanap
  rationale: Tumpak at likas na katumbas ang “naghahanap.” Hindi ipinapasok sa pandiwa ang mas mapagpasyang “humihingi” o “naggigiit,” yamang ang saloobing mapanubok ay makikita na sa konteksto.
- source_word: δοθήσεται
  choice: ibibigay
  rationale: Pinananatili ng “ibibigay” ang payak na anyong panghinaharap at balintiyak ng pandiwa.
- source_word: αὐτῇ
  choice: dito
  rationale: Tumutukoy ang pambabaeng panghalip sa συλλογικό na pangngalang γενεά. Ang “dito” ay natural sa Filipino at malinaw na bumabalik sa “salinlahi.”
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: 'Ipinakikilala nito ang nag-iisang eksepsiyon: walang ibang tanda kundi ang tanda ni Jonas.'
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ang tanda ni Jonas
  rationale: Pinananatili ang maikling pariralang genitibo at ang pagiging bukas ng kahulugan nito, nang hindi ipinapasok sa talata ang paliwanag mula sa Mateo 12:39–40.
- source_word: καταλιπὼν
  choice: iniwan niya sila
  rationale: Ang aorist participle ay likas na naipapahayag sa Filipino bilang kilos na nauna sa pag-alis; malinaw rin ang layon na “sila.”
- source_word: ἀπῆλθεν
  choice: umalis
  rationale: Ang “umalis” ay maikli, natural, at tumpak na nagpapahayag ng paglayo niya sa kanila.
theological_decisions:
- issue: Kahulugan ng “mapangalunyang salinlahi”
  choice: Panatilihin sa pangunahing teksto ang talinghagang “mapangalunya.”
  alternative: Isalin nang nagpapaliwanag bilang “taksil na salinlahi.”
  rationale: Malamang na umaalingawngaw ang pananalita ng mga propeta tungkol sa pagtataksil sa Diyos o sa tipan, ngunit mismong talinghaga ng pangangalunya ang ginamit ng Griyego. Pinananatili ng salin ang parehong talinghaga at teolohikal na tensiyon.
- issue: Kahulugan ng “tanda ni Jonas”
  choice: Panatilihin ang maikli at hindi pinalawak na pariralang “tanda ni Jonas.”
  alternative: Tukuyin sa pangunahing teksto na ito ay ang kamatayan at muling pagkabuhay ni Jesus.
  rationale: Ipinaliliwanag ng Mateo 12:39–40 ang kaugnayan kay Jonas, ngunit hindi ito tahasang pinalalawak sa talatang ito. Hindi dapat ipasok sa pangunahing teksto ang paliwanag na mula sa ibang talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang biblikal na “salinlahi,” “tanda,” at “mapangalunya” dahil mahalaga ang kanilang eksaktong diwa. Inilipat ang marker [b] sa tabi ng “Jonas,” sapagkat iyon mismo ang ipinapaliwanag ng talababa.
