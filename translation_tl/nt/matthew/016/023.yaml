  naturalness: Moderno at malinaw ang karamihan ng salin. Ang “lumingon siya at sinabi kay Pedro” ang mas tuwirang likas na Filipino para sa kilos na nasa Griyego. Ang “sa likod ko” ay mas karaniwan kaysa “sa likuran ko” at pinananatili ang puwestong ipinahihiwatig ng ὀπίσω μου.
  terminology: Ang “Satanas,” “katitisuran,” at “mga bagay ng Diyos” ay angkop at nagpapanatili ng rehistro at metapora ng pinagmulan. Ang pangkalahatang “tao” para sa ἀνθρώπων ay natural sa Filipino at hindi nililimitahan sa mga lalaki.
