  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: tl
  text: Ngunit lumingon siya at sinabi kay Pedro, “Pumunta ka sa likod ko, Satanas! Ikaw ay isang katitisuran sa akin, sapagkat hindi mo itinutuon ang isip mo sa mga bagay ng Diyos kundi sa mga bagay ng tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: humarap
  rationale: Ipinahihiwatig ng participle ang pagbaling ni Jesus kay Pedro bago magsalita. Ang “humarap” ay natural sa Filipino at malinaw na naghahatid ng pisikal na pagharap nang hindi dinaragdagan ang detalye.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Pumunta ka sa likuran ko
  rationale: Pinananatili nito ang pandiwang ὕπαγε at ang makahulugang puwestong ὀπίσω μου. Mas literal ito kaysa “Lumayo ka sa akin” at iniiwan ang posibleng pahiwatig na dapat bumalik si Pedro sa lugar ng tagasunod.
- source_word: Σατανᾶ
  choice: Satanas
  rationale: Ang kinikilalang pangalan o katawagan ang nagpapanatili sa tindi at kanonikal na alingawngaw ng pagsaway; ang “kalaban” ay maaaring labis na magtakda ng interpretasyon.
- source_word: σκάνδαλον
  choice: katitisuran
  rationale: Pinananatili ng “katitisuran” ang larawan ng isang bagay na nagpapatisod o humahadlang. Ang “hadlang” ay mas natural ngunit nawawala ang tiyak na metapora.
- source_word: ἐμοῦ
  choice: sa akin
  rationale: Kasama ng σκάνδαλον, ipinakikita nito na si Pedro ay katitisuran kaugnay ni Jesus. Ito ang natural na anyo sa Filipino.
- source_word: φρονεῖς
  choice: itinutuon ang isip mo
  rationale: Saklaw ng φρονέω ang saloobin at oryentasyon ng pag-iisip, hindi lamang isang panandaliang iniisip. Ang pariralang ito ay naghahatid ng sinasadyang pagtutuon.
- source_word: τὰ τοῦ θεοῦ
  choice: mga bagay ng Diyos
  rationale: Pinananatili ang malawak at bahagyang di-tiyak na substantibong parirala ng Griyego, sa halip na paliitin ito sa “mga layunin” o “mga kapakanan.”
- source_word: τὰ τῶν ἀνθρώπων
  choice: mga bagay ng tao
  rationale: Sa Filipino, ang pangkalahatang “tao” ay likas na tumutukoy sa sangkatauhan at malinaw na ipinakikipagtunggali ang pananaw ng tao sa mga bagay ng Diyos.
theological_decisions:
- issue: Lakas at tinutukoy ng katawagang “Satanas” kay Pedro
  choice: Panatilihin ang tuwirang katawagang “Satanas” nang hindi ipinaliliwanag kung si Pedro ay kinikilalang si Satanas o kumikilos bilang kasangkapan ng pagsalungat.
  alternative: Isalin bilang “kalaban,” o ipaliwanag na si Satanas ang kinakausap sa pamamagitan ni Pedro.
  rationale: Matalim at sadyang bukás sa interpretasyon ang Griyego. Ang transliterasyong “Satanas” ay nagpapanatili sa tensiyong teolohikal at sa kaugnayan nito sa salaysay ng pagtukso.
- issue: Kahulugan ng ὀπίσω μου
  choice: Panatilihin ang puwestong “sa likuran ko.”
  alternative: Isalin lamang bilang “Lumayo ka sa akin.”
  rationale: Ang pananalita ay maaaring kapuwa matinding pagtataboy at pag-uutos kay Pedro na bumalik sa wastong puwesto ng tagasunod. Hindi dapat burahin ng salin ang posibleng dobleng pahiwatig.
- issue: Saklaw ng ἀνθρώπων
  choice: Gamitin ang pangkalahatang “tao.”
  alternative: “mga lalaki” o “mga tao”
  rationale: Bagaman panlalaking anyong maramihan ang Griyego, pangkalahatan ang kahulugan nito rito. Sa modernong Filipino, ang “tao” ang natural at tumpak na pantukoy sa pananaw o mga alalahanin ng sangkatauhan, hindi lamang ng mga lalaki.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matinding pagsaway at ang metapora ng pagkatisod. Hindi nilagyan ng talababa dahil kayang ihatid ng pangunahing teksto ang mga pangunahing kahulugan at walang kailangang marker.
