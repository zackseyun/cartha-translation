id: MAT.16.21
reference: Matthew 16:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: tl
  text: Mula noon, nagsimulang ipakita ni Jesus sa kanyang mga alagad na kailangan niyang pumunta sa Jerusalem, magdusa ng maraming bagay[a] sa kamay ng mga matatandang pinuno, mga punong pari, at mga eskriba[b], mapatay, at sa ikatlong araw ay bubuhaying muli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magdusa nang matindi.” Literal na “magdusa ng maraming bagay” ang Griyego, na nagbibigay-diin sa sari-saring pagdurusa.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ng” ay idiomang tumutukoy sa ahensiya o pananagutan ng mga matatandang pinuno, mga punong pari, at mga eskriba. Ang mga eskriba ay mga dalubhasa at tagapagturo ng Kautusan.
    reason: alternative_reading
  - marker: c
    text: 'Maaari ring isalin na “muling mabubuhay” o “babangon.” Pasibo ang Griyego: “bubuhaying muli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Mula noon
  rationale: Likas at malinaw na panandang temporal sa Filipino; ipinahihiwatig nito ang pagsisimula ng bagong yugto sa salaysay.
- source_word: ἤρξατο δεικνύειν
  choice: sinimulan ... na ipakita
  rationale: Pinananatili ang ideya ng pagsisimula at ang pangunahing diwa ng δεικνύειν na ipakita o gawing malinaw, nang hindi dinaragdagan ang paraan ng pagtuturo.
- source_word: δεῖ αὐτὸν
  choice: kailangan niyang
  rationale: Tapat na ipinahahayag ang matinding pangangailangan nang hindi tinutukoy sa teksto kung saan nagmumula ang pangangailangang iyon.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: pumunta sa Jerusalem
  rationale: Natural na Filipino para sa pagkilos patungo sa isang lugar; hindi kailangan ang mas literal ngunit mabigat na 'umalis patungong.'
- source_word: πολλὰ παθεῖν
  choice: magdusa ng maraming bagay
  rationale: Pinananatili ang pangmaramihang έκφραση ng Griyego at ang maaaring diin sa sari-saring pagdurusa, bagaman mas idiomatiko rin ang 'magdusa nang matindi.'
- source_word: πρεσβυτέρων
  choice: mga nakatatandang pinuno
  rationale: Ipinakikitang ang tinutukoy ay kinikilalang pangkat ng mga pinuno, hindi lamang mga taong matatanda ang edad.
- source_word: ἀρχιερέων
  choice: mga punong pari
  rationale: Karaniwang katumbas ng pangmaramihang ἀρχιερεῖς para sa namumunong pangkat ng mga pari, hindi pahiwatig na sabay-sabay na maraming mataas na pari ang nanunungkulan.
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Inihahatid sa ordinaryong mambabasa ang tungkuling panrelihiyon ng mga eskriba sa kontekstong ito; mas malinaw ito kaysa sa hiram na salitang 'eskriba.'
- source_word: ἀποκτανθῆναι
  choice: siya ay papatayin
  rationale: Malinaw na pasibong anyo na nagpapakitang si Jesus ang tatanggap ng pagpatay.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: sa ikatlong araw ay muling bubuhayin
  rationale: Pinananatili ang pasibong tinig ng Griyego at ang pagkakasunod ng panahon, nang hindi tahasang pinapangalanan ang gumagawa.
theological_decisions:
- issue: Ang puwersa at pinagmulan ng pangangailangan sa δεῖ
  choice: kailangan niyang
  alternative: dapat siyang / itinakdang siya ay
  rationale: Ipinahahayag ng Griyego ang pangangailangan ngunit hindi nito tahasang tinutukoy sa sugnay kung ito ay banal na pasiya, katuparan ng Kasulatan, o ibang uri ng pangangailangan. Hindi ito nilulutas ng salin.
- issue: Ang tinig ng ἐγερθῆναι
  choice: muling bubuhayin
  alternative: muling mabubuhay / babangon
  rationale: Pasibo ang anyong Griyego. Ang 'muling bubuhayin' ay nagpapanatili nito at hindi tahasang pinapangalanan ang kumikilos, samantalang ang mga alternatibo ay mas madaling unawaing aktibo o intransitibo.
- issue: Ugnayan ng ἀπό sa pagdurusa at pagpatay
  choice: dahil sa ...; na siya ay papatayin
  alternative: sa mga kamay ng ... at papatayin nila siya
  rationale: Malinaw na inuugnay ng pangunahing teksto ang mga pinuno sa pagdurusa, ngunit hindi pinipilit ng ayos ng salin na ang pariralang ἀπό ay gramatikal na sumasaklaw rin sa bawat kasunod na pandiwa. Ipinaliliwanag ng talababa ang idiomatikong pagbasa tungkol sa ahensiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga nakatatandang pinuno” upang ipakita ang opisyal na pangkat, at “mga tagapagturo ng Kautusan” upang maging madaling maunawaan ang tungkulin ng γραμματεῖς. Pinanatili ang pasibong pahayag sa muling pagkabuhay at hindi tahasang tinukoy ang pinagmulan ng pangangailangang ipinahahayag ng δεῖ.
