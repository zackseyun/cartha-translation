revisions:
- from: Mula noon, sinimulan ni Jesus na ipakita sa kanyang mga alagad na kailangan niyang pumunta sa Jerusalem at magdusa ng maraming bagay[a] dahil sa mga nakatatandang pinuno, mga punong pari, at mga tagapagturo ng Kautusan[b]; na siya ay papatayin at sa ikatlong araw ay muling bubuhayin[c].
  to: Mula noon, nagsimulang ipakita ni Jesus sa kanyang mga alagad na kailangan niyang pumunta sa Jerusalem, magdusa ng maraming bagay[a] sa kamay ng mga matatandang pinuno, mga punong pari, at mga eskriba[b], mapatay, at sa ikatlong araw ay bubuhaying muli[c].
  rationale: Inayos ang ugnayan ng ἀπό upang maihatid ang ahensiyang ipinahihiwatig ng konteksto, pinanatili ang magkakaugnay na infinitive na ayos ng Griyego, at ginamit ang mas tuwirang katawagang “mga eskriba.” Pinanatili ang “kailangan” para sa δεῖ at ang pasibong “bubuhaying muli” para sa ἐγερθῆναι, nang hindi dinaragdagan ang pinagmulan ng pangangailangan o ang gumaganap sa pagbuhay-muli.
