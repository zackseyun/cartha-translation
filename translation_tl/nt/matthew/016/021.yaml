    reason: alternative_reading
  - marker: c
    text: 'Maaari ring isalin na “muling mabubuhay” o “babangon.” Pasibo ang Griyego: “bubuhaying muli.”'
    reason: lexical_alternative
  revision_rationale: Inayos ang ugnayan ng ἀπό upang maihatid ang ahensiyang ipinahihiwatig ng konteksto, pinanatili ang magkakaugnay na infinitive na ayos ng Griyego, at ginamit ang mas tuwirang katawagang “mga eskriba.” Pinanatili ang “kailangan” para sa δεῖ at ang pasibong “bubuhaying muli” para sa ἐγερθῆναι, nang hindi dinaragdagan ang pinagmulan ng pangangailangan o ang gumaganap sa pagbuhay-muli.
