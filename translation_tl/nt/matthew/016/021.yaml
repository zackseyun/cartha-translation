review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the temporal transition, the necessity expressed by δεῖ, Jerusalem, the sequence of suffering, killing, and being raised on the third day. However, “dahil sa” weakens and can shift the ἀπό phrase away from its source/agency sense, while the semicolon followed by “na siya ay papatayin” disrupts the coordinated infinitive sequence. “Mga tagapagturo ng Kautusan” is a functional interpretation of γραμματεῖς rather than its direct historical designation.
  naturalness: The revision uses fluent modern Filipino while retaining a dignified biblical register. “Nagsimulang ipakita” and the coordinated “magdusa …, mapatay, at … bubuhaying muli” are more natural and structurally clear.
  terminology: “Mga matatandang pinuno” appropriately identifies the elders as a leadership body without treating “elder” as merely an age description. “Mga eskriba” retains the distinct historical term γραμματεῖς; a footnote supplies the functional clarification. “Bubuhaying muli” preserves the passive voice of ἐγερθῆναι without naming the agent.
  issues:
  - severity: medium
    issue: The phrase “dahil sa mga nakatatandang pinuno” does not adequately reflect ἀπό.
    rationale: In this context ἀπό marks the source or agency of the suffering. “Dahil sa” can express a general reason and is less precise. “Sa kamay ng” is idiomatic Filipino for the contextual agency and is identified as an alternative in the audit trail.
  - severity: medium
    issue: The semicolon and “na siya ay papatayin” break the Greek coordinated infinitive construction.
    rationale: The Greek presents going, suffering, being killed, and being raised as coordinated elements governed by the stated necessity. The revised wording keeps these actions in one coordinated sequence.
  - severity: low
    issue: “Mga tagapagturo ng Kautusan” replaces the historical designation γραμματεῖς with an interpretive functional label.
    rationale: Although the explanation is broadly accurate, “mga eskriba” is the closer lexical equivalent and preserves the distinct group designation. A note can clarify their role.
  revised_text: Mula noon, nagsimulang ipakita ni Jesus sa kanyang mga alagad na kailangan niyang pumunta sa Jerusalem, magdusa ng maraming bagay[a] sa kamay ng mga matatandang pinuno, mga punong pari, at mga eskriba[b], mapatay, at sa ikatlong araw ay bubuhaying muli[c].
  revised_footnotes:
