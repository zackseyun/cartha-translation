id: MAT.16.14
reference: Matthew 16:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: tl
  text: Sumagot sila[a], “Sabi ng ilan, si Juan na Tagapagbautismo; sabi naman ng iba, si Elias; at sabi ng iba pa, si Jeremias o isa sa mga propeta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas tahasan: “Sumagot sila, ‘Sabi ng ilan, ikaw ay si Juan na Tagapagbautismo; sabi naman ng iba, si Elias; at sabi ng iba pa, si Jeremias o isa sa mga propeta.’”'
    reason: Ipinapaliwanag ang di-binibigkas ngunit kontekstuwal na layon ng mga pagkakakilanlan sa Griyego.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sumagot sila
  rationale: Sa konteksto ng naunang tanong ni Jesus, natural sa modernong Tagalog ang “Sumagot sila.” Hindi kailangang tumbasan nang hiwalay ang δέ, sapagkat malinaw na ang daloy ng tugon.
- source_word: Οἱ μὲν
  choice: Sabi ng ilan
  rationale: Ipinakikita ng μέν ang unang pangkat sa sunod-sunod na pagkakabahagi. Ang “Sabi ng ilan” ay likas sa Tagalog at pinananatiling di-binibigkas ang layon ng pagkakakilanlan, gaya ng Griyego.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Juan na Tagapagbautismo
  rationale: Ang “Tagapagbautismo” ay malinaw at pormal na katumbas ng βαπτιστής, at naiiwasan ang di-kinakailangang paghiram ng anyong Ingles.
- source_word: ἄλλοι δὲ
  choice: sabi naman ng iba
  rationale: Ipinagpapatuloy nito ang pamamahagi ng magkakaibang sagot; natural na ipinahihiwatig ng “naman” ang paglipat sa ibang pangkat nang hindi ginagawang matinding pagsalungat ang δέ.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Tagalog na Bibliya at madaling makilala ng karaniwang mambabasa.
- source_word: ἕτεροι δὲ
  choice: at sabi ng iba pa
  rationale: Malinaw na ipinakikita ng “iba pa” ang ikatlong pangkat sa talaan at natural nitong naihahatid ang ἕτεροι.
- source_word: Ἰερεμίαν
  choice: Jeremias
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Tagalog at tumutugma sa pangkalahatang gamit ng mga pangalang biblikal.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: o isa sa mga propeta
  rationale: Tuwirang pinananatili ang alternatibong ipinakikilala ng ἤ. Hindi idinagdag ang “iba pang” dahil wala iyon nang tahasan sa Griyego.
theological_decisions:
- issue: Di-binibigkas na layon ng mga pagkakakilanlan
  choice: Pinanatiling di-tahasan sa pangunahing teksto ang “ikaw,” sa anyong “Sabi ng ilan, si Juan...”
  alternative: “Sabi ng ilan, ikaw ay si Juan na Tagapagbautismo...”
  rationale: Patala at eliptikal ang Griyego; mauunawaan ang tinutukoy mula sa naunang tanong ni Jesus. Gayunman, maaaring kailanganin ng ilang mambabasa ang mas tahasang anyo, kaya inilagay iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sabi” sa iniulat na mga palagay at ang mga nakaugaliang anyong Tagalog ng mga pangalang biblikal. Ang semicolon ay tumutulong na linawin ang tatlong pangkat sa talaan.
