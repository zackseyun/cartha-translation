  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jesus sa kanyang mga alagad, “Kung may sinumang nagnanais na lumapit bilang tagasunod ko, itakwil niya ang kanyang sarili, pasanin ang kanyang krus, at patuloy na sumunod sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal sa pagkakasunod ng salaysay; natural ito sa modernong Tagalog.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: sa kanyang mga alagad
  rationale: Ang “mga alagad” ang kinikilalang salin na nagpapanatili sa ugnayan ng guro at tagasunod.
- source_word: Εἴ τις θέλει
  choice: Kung may sinumang nagnanais
  rationale: Pinananatili ang kondisyon, malawak na saklaw ng τις, at diwa ng kusang pagnanais sa θέλει.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: sumunod sa akin
  rationale: Sa Tagalog, ito ang natural na paraan upang ipahayag ang idyomang literal na “pumarito sa likuran ko” bilang pagpasok sa pagiging alagad.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: talikuran niya ang kanyang sarili
  rationale: Ipinahahayag ang mapagpasyang pagtanggi sa paghahari ng sariling kapakanan; mas natural kaysa sa literal na “itakwil ang sarili” nang hindi dinaragdagan ang kahulugan.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: pasanin ang kanyang krus
  rationale: Ang “pasanin” ay likas na kolokasyon sa Tagalog at saklaw ang pag-angat upang dalhin na ipinahihiwatig ng αἴρω.
- source_word: ἀκολουθείτω μοι
  choice: patuloy akong sundan
  rationale: Ginagawang hayag ang nagpapatuloy na aspekto ng present imperative, habang malinaw na iniiba ito sa paunang idyoma ng pagnanais na sumunod.
theological_decisions:
- issue: Pangkalahatang saklaw ng panlalaking isahan sa Griyego
  choice: “Kung may sinuman … talikuran niya ang kanyang sarili”
  alternative: “Kung may sinuman … talikuran nila ang kanilang sarili”
  rationale: Hindi kailangang markahan ng kasarian ang Tagalog na “sinuman” at “niya.” Napananatili ang isahang balarila at pangkalahatang saklaw nang hindi nagdaragdag ng kasariang hindi likas na ipinahahayag sa Tagalog.
- issue: Diwa ng pagtalikod sa sarili
  choice: “talikuran niya ang kanyang sarili”
  alternative: “itakwil niya ang kanyang sarili”
  rationale: Pinananatili ang matinding panawagan ng ἀπαρνέομαι nang hindi ipinahihiwatig na likas na masama ang sarili o katawan; hindi nilulutas ang teolohikal na bigat lampas sa sinabi ng teksto.
- issue: Aspekto ng huling utos
  choice: “patuloy akong sundan”
  alternative: “sundan ako”
  rationale: Ang present imperative ἀκολουθείτω ay maaaring magpahiwatig ng nagpapatuloy na pagsunod; ang “patuloy” ay malinaw ngunit hindi ginagawang hiwalay na doktrinal na pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alagad,” “krus,” at “pasanin” bilang pamilyar at tumpak na bokabularyong biblikal. Iniwasan ang di-likas na gender marking dahil walang gramatikal na kasarian ang mga panghalip na Tagalog.
