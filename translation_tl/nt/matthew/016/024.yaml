review_pass:
  verdict: revise
  source_fidelity: Ang unang ‘sumunod sa akin’ ay pinagsasama ang ὀπίσω μου ἐλθεῖν at ang huling ἀκολουθείτω μοι, samantalang magkaibang pandiwa at larawan ang sinadyang gamitin sa Griyego. Ang ‘pasanin ang kanyang krus’ ay katanggap-tanggap para sa ἀράτω τὸν σταυρὸν αὐτοῦ, ngunit ang ‘itakwil’ ay mas tuwirang katumbas ng ἀπαρνησάσθω kaysa ‘talikuran.’
  naturalness: Marangal at malinaw ang rehistro ng draft. Gayunman, mas natural at mas malinaw ang ‘lumapit bilang tagasunod ko’ para sa unang parirala, upang hindi maging magkapareho ang unang at huling utos. Ang ‘patuloy na sumunod sa akin’ ay likas na Tagalog at ipinahihiwatig ang nagpapatuloy na aspekto nang hindi labis na binibigyang-diin ito.
  terminology: Ang ‘Jesus,’ ‘mga alagad,’ at ‘krus’ ay angkop at pamilyar na modernong Filipino Tagalog. Walang kailangang footnote hinggil sa panlalaking isahan ng Griyego, sapagkat likas na walang gramatikal na kasarian ang ‘sinuman’ at ‘niya’ sa Tagalog.
  issues:
  - severity: medium
    issue: Hindi naipagkaiba ang ὀπίσω μου ἐλθεῖν at ἀκολουθείτω μοι.
    rationale: Parehong naisalin bilang mga anyo ng ‘sumunod,’ kaya nawawala ang pagkakaiba ng ‘pumarito/lumapit sa likuran ko’ at ng kasunod na hayag na utos na ‘sumunod sa akin.’
  - severity: low
    issue: Ang ‘talikuran niya ang kanyang sarili’ ay hindi kasintuwid ng ‘itakwil niya ang kanyang sarili.’
    rationale: Ang ἀπαρνησάσθω ay panawagang itanggi o itakwil ang sarili; ang ‘itakwil’ ay mas eksakto at nananatiling natural sa rehistrong biblikal.
  revised_text: Pagkatapos, sinabi ni Jesus sa kanyang mga alagad, “Kung may sinumang nagnanais na lumapit bilang tagasunod ko, itakwil niya ang kanyang sarili, pasanin ang kanyang krus, at patuloy na sumunod sa akin.”
