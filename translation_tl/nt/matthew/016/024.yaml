  to: Pagkatapos, sinabi ni Jesus sa kanyang mga alagad, “Kung may sinumang nagnanais na lumapit bilang tagasunod ko, itakwil niya ang kanyang sarili, pasanin ang kanyang krus, at patuloy na sumunod sa akin.”
