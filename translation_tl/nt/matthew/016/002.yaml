  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: tl
  text: Ngunit sumagot siya at sinabi sa kanila, “Pagsapit ng gabi, sinasabi ninyo, ‘Magiging maganda ang panahon, sapagkat mapula ang langit[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay maaari ring tumukoy sa “kalangitan,” ngunit sa kasabihang ito tungkol sa panahon, ang tinutukoy ay ang nakikitang langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ngunit bilang sagot ay sinabi niya sa kanila
  rationale: Isinasalin ang karaniwang Griyegong pormulang ‘sumagot at nagsabi’ sa natural na Filipino habang pinananatili ang diwa ng tugon at pagsasalita.
- source_word: Ὀψίας γενομένης
  choice: Pagsapit ng gabi
  rationale: Likas at maikli itong pagpapahayag ng genitive absolute na nagsasaad ng panahon.
- source_word: λέγετε
  choice: sinasabi ninyo
  rationale: Ipinahihiwatig ng pangkasalukuyang anyo ang nakagawiang pagsasabi sa isang kasabihan tungkol sa panahon.
- source_word: Εὐδία
  choice: Maganda ang panahon
  rationale: Tumutukoy ito sa maaliwalas o mabuting lagay ng panahon; ang piniling parirala ay malinaw at karaniwan sa modernong Filipino.
- source_word: πυρράζει
  choice: mapula
  rationale: Tuwirang inilalarawan ang mapulang anyo ng langit nang hindi dinaragdagan ang tindi ng salitang Griyego.
- source_word: οὐρανός
  choice: langit
  rationale: Sa kontekstong meteorolohikal, tumutukoy ito sa nakikitang langit; likas din sa Filipino ang salitang ‘langit’ para rito.
