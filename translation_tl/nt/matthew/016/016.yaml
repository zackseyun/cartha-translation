id: MAT.16.16
reference: Matthew 16:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: tl
  text: Sumagot si Simon Pedro, “Ikaw ang Mesiyas[a], ang Anak ng Diyos na buháy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Cristo”; ginamit dito ang “Mesiyas” upang mapanatili ang diwa nito bilang titulo at ang kontekstong mesiyaniko ng mga Judio.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: Sumagot
  rationale: Magkasamang bumubuo ang participle at pandiwang ito ng karaniwang panimulang pahayag sa salaysay. Likas sa modernong Tagalog ang “Sumagot” at naiiwasan nito ang matigas na “sumagot at sinabi.”
- source_word: δὲ
  choice: —
  rationale: Mahinang panandang pandiskurso ito para sa pagpapatuloy o paglipat. Hindi na kailangang tumbasan nang tahasan dahil malinaw na sa “Sumagot si Simon Pedro” ang daloy ng salaysay.
- source_word: Σίμων Πέτρος
  choice: Simon Pedro
  rationale: Ginamit ang nakaugaliang anyo ng mga pangalang ito sa Tagalog na Bibliya at sa pangkalahatang gamit.
- source_word: Σὺ
  choice: Ikaw
  rationale: Tahasan at may diin ang panghalip sa Griyego. Pinananatili ng pangungusap na nauuna sa “Ikaw” ang diin.
- source_word: ὁ χριστὸς
  choice: ang Mesiyas
  rationale: Titulo ang Χριστός sa kontekstong ito. Ipinahahayag ng “Mesiyas” ang kahulugan nitong pinahiran at ang kontekstong mesiyaniko, sa halip na ituring itong pangalan.
- source_word: ὁ υἱὸς
  choice: ang Anak
  rationale: Ang artikulo at pangngalan ay tumutukoy sa isang tiyak at natatanging titulong pampamilya; pinananatili ito ng “ang Anak.”
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: ng Diyos na buháy
  rationale: Natural sa Tagalog ang pariralang ito at tapat sa atributibong participle na naglalarawan sa Diyos bilang buháy.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo o anyong parang pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: Malinaw na titulong mesiyaniko ang gamit dito. Pinananatili sa talababa ang tradisyonal na “Cristo” bilang lehitimong alternatibong salin.
- issue: Lakas ng titulong “Anak ng Diyos”
  choice: ang Anak ng Diyos na buháy
  alternative: isang anak ng Diyos na buháy
  rationale: Pinananatili ng tiyak na “ang Anak” ang confessional at titular na puwersa ng Griyego nang hindi ito pinalalawak gamit ang mga susunod na pormulasyong doktrinal.
- issue: Saklaw ng atributibong τοῦ ζῶντος
  choice: Diyos na buháy
  alternative: Diyos na nabubuhay
  rationale: Kapwa posible, ngunit mas maikli at marangal ang “Diyos na buháy,” at malinaw na ang Diyos ang inilalarawang buháy.
translation_notes:
  register: Modernong Filipino Tagalog na natural, payak, at marangal. Pinanatili ang diin ng tahasang Σὺ sa pamamagitan ng “Ikaw,” at ginamit ang impit na “buháy” upang luminaw ang bigkas at kahulugan.
