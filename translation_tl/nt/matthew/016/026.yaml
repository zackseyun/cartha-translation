base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: tl
  text: Sapagkat ano ang mapapala ng isang tao kung makamit niya ang buong mundo ngunit mawalan siya ng kanyang buhay? O ano ang maibibigay ng isang tao kapalit ng kanyang buhay?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kaluluwa” ang “buhay” sa dalawang pagkakataon. Ang salitang Griyego na ψυχή ay maaaring mangahulugang “buhay,” “sarili,” o “kaluluwa,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Sapagkat ano
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang sinabi, at ng “ano” ang retorikal na tanong.
- source_word: ὠφεληθήσεται
  choice: ang mapapakinabang
  rationale: Likas na Filipino para sa pakinabang na matatanggap, habang pinananatili ang diwang pasibo ng pandiwa.
- source_word: ἄνθρωπος
  choice: isang tao
  rationale: Ang ἄνθρωπος ay ginagamit dito bilang pangkalahatang katawagan sa isang tao; ito ang natural at tumpak na katumbas sa Filipino.
- source_word: τὸν κόσμον ὅλον
  choice: ang buong mundo
  rationale: Tuwirang ipinahahayag ang kabuuan ng κόσμος na binibigyang-diin ng ὅλον.
- source_word: κερδήσῃ
  choice: makamit
  rationale: Ipinahahayag ang pagkakamit o pagtatamo ng mundo at umaangkop sa natural na gamit sa Filipino.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: ngunit maiwala niya ang kanyang buhay
  rationale: Ang ψυχή ay maaaring tumukoy sa buhay, sarili, o kaluluwa. Ang “buhay” ay malinaw sa konteksto, samantalang inilalagay sa talababa ang mahalagang alternatibong “kaluluwa.”
- source_word: ζημιωθῇ
  choice: maiwala
  rationale: Ipinahahayag ang pagdurusa ng sukdulang pagkawala, nang hindi nagdaragdag ng diwang sadyang pagsuko na maaaring ipahiwatig ng ibang salita.
- source_word: ἀντάλλαγμα
  choice: kapalit
  rationale: Natural at eksaktong katumbas para sa isang bagay na ibinibigay bilang kapalit ng iba.
theological_decisions:
- issue: Kahulugan ng ψυχή sa pahayag tungkol sa sukdulang pagkawala
  choice: buhay
  alternative: kaluluwa
  rationale: Hindi hinihingi ng talata na limitahan ang ψυχή sa teknikal na konsepto ng hiwalay na di-materyal na kaluluwa. Ang “buhay” ay maaaring tumukoy sa buong pag-iral ng tao, ngunit pinananatili sa talababa ang tradisyonal at lehitimong alternatibong “kaluluwa.”
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “isang tao” bilang likas na pangkalahatang katawagan at pinanatili ang magkatugmang retorikal na mga tanong.
