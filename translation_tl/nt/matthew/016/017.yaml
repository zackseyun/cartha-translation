revisions:
- from: Sumagot si Jesus sa kanya, “Mapalad ka, Simon Bar-Jona,[a] sapagkat hindi ito inihayag sa iyo ng laman at dugo,[b] kundi ng aking Ama na nasa mga langit.”[c]
  to: Sumagot si Jesus sa kanya, “Mapalad ka, Simon Bar-Jonah,[a] sapagkat hindi laman at dugo ang naghayag nito sa iyo,[b] kundi ang aking Ama na nasa mga langit.”[c]
  rationale: Inayos ang konstruksyon upang malinaw na ang “laman at dugo” ang hindi pinagmulan o tagapaghayag ng kaalamang tinutukoy, samantalang ang Ama ang kabaligtarang pinagmulan. Hindi pinaliit ng salin ang saklaw ng idyoma. Ginawang “Bar-Jonah” ang pangalan para sa pagkakatugma sa audit trail, at inilipat ang marker c sa pariralang “mga langit.”
