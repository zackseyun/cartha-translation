  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: tl
  text: Sumagot si Jesus sa kanya, “Mapalad ka, Simon Bar-Jonah,[a] sapagkat hindi laman at dugo ang naghayag nito sa iyo,[b] kundi ang aking Ama na nasa mga langit.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Simon na anak ni Jonas.” Ang “Bar-Jonah” ay anyong patronimiko mula sa Aramaiko na pinanatili sa tekstong Griyego.
    reason: lexical_alternative
  - marker: b
    text: Ang “laman at dugo” ay idyomang tumutukoy sa mga tao o sa pinagmumulang pantao lamang.
    reason: cultural_note
  - marker: c
    text: Literal na “nasa mga langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Sumagot si Jesus sa kanya
  rationale: Ang participle at finite verb ay karaniwang konstruksiyong nangangahulugang ‘sumagot at nagsabi.’ Ang ‘Sumagot ... sa kanya’ ay natural sa makabagong Tagalog at hindi inuulit nang di-kailangan ang parehong ideya.
- source_word: Μακάριος
  choice: Mapalad
  rationale: Ang ‘mapalad’ ay karaniwan at marangal na salin ng μακάριος; tumutukoy ito sa kalagayang kinalulugdan o pinagpapala, hindi lamang sa pansariling damdaming masaya.
- source_word: Σίμων Βαριωνᾶ
  choice: Simon Bar-Jona
  rationale: Pinananatili ang anyong patronimikong Aramaiko na nakasalin-titik sa Griyego, habang ipinaliliwanag sa talababa ang kahulugang ‘anak ni Jonas.’
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala ng ὅτι ang dahilan kung bakit tinawag na mapalad si Simon; malinaw at marangal dito ang ‘sapagkat.’
- source_word: σὰρξ καὶ αἷμα
  choice: laman at dugo
  rationale: Pinananatili ang kongkretong idyoma ng teksto sa halip na paliitin ito sa sariling pangangatwiran ni Pedro o sa isang partikular na taong nagturo sa kanya.
- source_word: ἀπεκάλυψέν σοι
  choice: inihayag sa iyo
  rationale: Ang ‘inihayag’ ay natural na katumbas ng ἀποκαλύπτω at pinananatili ang diwa ng pagbubunyag. Ang ‘ito’ ay tumutukoy sa naunang pahayag ni Simon at likas na inilalagay sa Tagalog.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: kundi ng aking Ama
  rationale: Malinaw na ipinakikita ng ‘kundi’ ang matinding pagsalungat sa pagitan ng pinagmumulang tao at ng Ama bilang pinagmulan ng paghahayag.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: na nasa mga langit
  rationale: Pinananatili ng ‘mga langit’ ang pangmaramihang anyo ng Griyegong τοῖς οὐρανοῖς; nananatili rin itong nauunawaan sa marangal na Tagalog.
theological_decisions:
- issue: Pinagmulan ng ipinahayag sa pagtatapat ni Simon
  choice: Ang ‘laman at dugo’ ay malawak na tumutukoy sa tao o pinagmumulang pantao, na ipinakikipagtunggali sa paghahayag ng Ama.
  alternative: Maaaring partikular itong unawain bilang sariling likas na pangangatwiran ni Simon o bilang pagtuturo ng ibang tao.
  rationale: Hindi tinutukoy ng idyoma kung aling uri ng pagkilos ng tao ang isinasaisantabi. Kaya pinananatili ng salin ang malawak na pagsalungat sa pagitan ng pinagmumulang pantao at ng paghahayag mula sa Ama.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang natural na ayos ng pangungusap habang pinananatili ang idyomang ‘laman at dugo,’ ang patronimikong ‘Bar-Jona,’ at ang pangmaramihang ‘mga langit.’
