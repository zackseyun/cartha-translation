    rationale: Ang anyong “itinatanong niya” ay likas sa salaysay na Filipino at mas malapit na nagsasaad ng di-ganap o nagpapatuloy na kilos, nang hindi kinakailangang magpahiwatig ng paulit-ulit na pagtatanong.
  - severity: medium
    issue: Paulit-ulit ang “raw” at “ayon sa sinasabi ng mga tao.”
    rationale: Kapwa nila minamarka ang iniulat na opinyon ng mga tao; sapat at mas malinaw ang “ayon sa mga tao.”
  - severity: low
