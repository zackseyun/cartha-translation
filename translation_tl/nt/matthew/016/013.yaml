  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: tl
  text: Nang dumating si Jesus sa sakop ng Cesarea Filipos, itinatanong niya sa kanyang mga alagad, “Sino, ayon sa mga tao, ang Anak ng Tao[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Anak ng Tao” ang karaniwang katawagan ni Jesus para sa kanyang sarili; isinasalin ito ng ilan bilang “ang Tao.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Pagdating
  rationale: Ipinahahayag ng aorist participle ang pangyayaring nagsisilbing panimulang kalagayan ng bagong tagpo. Likas sa Filipino ang “Pagdating” at hindi na kailangang dagdagan ng tahasang panandang katumbas ng “ngayon.”
- source_word: εἰς τὰ μέρη
  choice: sa lupain
  rationale: Ang μέρη ay tumutukoy dito sa nasasakupang lugar o rehiyon sa paligid ng lungsod, hindi sa literal na mga “bahagi.”
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cesarea Filipos
  rationale: Ginamit ang makabagong anyong Filipino ng kinikilalang pangalan ng lugar na Caesarea Philippi, sa halip na ang mabigat na literal na “Cesarea ni Filipo.”
- source_word: ἠρώτα
  choice: tinanong niya
  rationale: Bagaman imperfect ang pandiwa, sa ganitong salaysay ay natural sa Filipino ang payak na “tinanong.” Ang “patuloy niyang tinatanong” ay maaaring magpahiwatig ng di-tiyak na pag-uulit na hindi hinihingi ng konteksto.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang malinaw at nakaugaliang katumbas ng μαθηταί sa konteksto ng mga Ebanghelyo.
- source_word: λέγων
  choice: —
  rationale: Hindi isinalin bilang hiwalay na “na nagsasabi” sapagkat likas nang ipinakikilala ng kuwit at tuwirang sipi sa Filipino ang nilalaman ng pagtatanong.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Sino raw ... ayon sa sinasabi ng mga tao
  rationale: Ipinapakita ng “raw” ang iniulat na pananalita, habang pinananatili ng huling parirala ang tahasang pagtukoy sa sinasabi ng mga tao. Hindi nililimitahan sa kalalakihan ang pangkalahatang οἱ ἄνθρωποι.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Ito ang nakaugaliang salin ng natatanging pagtukoy ni Jesus sa sarili at pinananatili nito ang ugnay sa ibang gamit ng parirala, kabilang ang alingawngaw ng Daniel 7.
theological_decisions:
- issue: Pagkakasalin ng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  alternative: ang Taong Anak / ang Taong Ito
  rationale: Pinananatili ng tradisyonal na “Anak ng Tao” ang anyo, pagkakaugnay-ugnay sa Kasulatan, at sadyang lawak ng kahulugan ng katawagan. Ang mas malayang mga alternatibo ay maaaring maging mas malinaw sa ilang mambabasa ngunit maagang magtakda ng iisang interpretasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang lipas na “datapwat,” ang sobrang literal na “sa mga bahagi,” at ang mabigat na “na nagsasabi.” Inilagay ang talababa sa mismong pariralang “Anak ng Tao,” na siyang tinatalakay nito.
