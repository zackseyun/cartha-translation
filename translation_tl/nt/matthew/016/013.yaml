  rationale: Inayos ang salin upang maipahayag ang imperfect na ἠρώτα, ang kahulugan ng τὰ μέρη bilang isang rehiyon o sakop, at ang isang beses lamang na pagmamarka sa iniulat na pananaw ng mga tao. Pinanatili ang “Anak ng Tao” at pinalitan ang di-tumpak na alternatibong may demonstratibo sa talababa.
