  naturalness: Mas natural na Filipino ang “Nang dumating si Jesus sa sakop ng Cesarea Filipos” at ang tuwirang tanong na “Sino, ayon sa mga tao, ang Anak ng Tao?” kaysa sa nominal na “Pagdating ni Jesus” at sa dobleng pangmarka ng hearsay.
  terminology: Panatilihin ang “Anak ng Tao” bilang matatag at tradisyonal na salin ng τὸν υἱὸν τοῦ ἀνθρώπου. Ang “ang Taong Ito” sa talababa ay hindi wastong katumbas ng alternatibong “the Human One,” sapagkat nagdaragdag ito ng demonstratibong kahulugang wala sa Griyego.
  issues:
