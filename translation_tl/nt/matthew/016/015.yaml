    issue: Hindi sapat na tuwiran ang “ayon sa sinasabi ninyo” para sa λέγετε εἶναι.
    rationale: Maaaring marinig ito bilang “batay sa inyong sinasabi” o “sa inyong palagay,” samantalang ang Griyego ay nagtatanong kung anong pagkakakilanlan ang aktuwal nilang iniuugnay kay Jesus. Ang “sino ang sinasabi ninyong ako?” ay pinananatili ang pandiwang ‘sinasabi’ at ang di-tuwirang pahayag.
