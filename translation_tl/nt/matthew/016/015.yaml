  text: He says to them[a], “But who do you say that I am?”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Ngunit kayo, sino ang sinasabi ninyong ako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Sinabi niya
  rationale: Ang pangkasalukuyang anyo ay isang makasaysayang pangkasalukuyan sa salaysay na Griyego. Mas natural sa makabagong Tagalog ang pangnagdaan dito, nang hindi binabago ang pangyayari.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tuwirang ipinapahayag ang pangmaramihang di-tuwirang layon ng pagsasalita.
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Ang hayag na panghalip ay may diin at pangmaramihan; pinananatili ito sa “Ngunit kayo” upang itangi ang sagot ng mga alagad sa mga opinyong nauna.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang malinaw na pagsalungat sa sinasabi ng ibang tao sa naunang konteksto.
- source_word: τίνα
  choice: sino
  rationale: Ito ang natural na tanong tungkol sa pagkakakilanlan sa makabagong Tagalog.
- source_word: με … λέγετε εἶναι
  choice: sino ako ayon sa sinasabi ninyo
  rationale: Likas na inililipat sa Tagalog ang accusative-and-infinitive na di-tuwirang pahayag, habang pinananatili ang tanong tungkol sa kung sino si Jesus ayon sa sariling pahayag ng mga alagad.
theological_decisions:
- issue: Diin sa sariling pagkilala ng mga alagad kay Jesus
  choice: “Ngunit kayo, sino ako ayon sa sinasabi ninyo?”
  alternative: “Ngunit para sa inyo, sino ako?”
  rationale: Pinananatili ng napiling salin ang pandiwang “sinasabi” at ang pagkakaiba ng mga alagad sa ibang taong nabanggit sa konteksto, nang hindi pa ipinapasok ang sagot o isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangnagdaang “Sinabi” bilang likas na salaysay sa Tagalog; pinanatili ang diin ng Ὑμεῖς sa tahasang “Ngunit kayo.”
