  verdict: revise
  source_fidelity: 'Ang “Ngunit kayo” ay wastong naghahatid ng kontrast at diin ng Ὑμεῖς δέ, at ang “sa kanila” ay tumutugon sa αὐτοῖς. Gayunman, ang “sino ako ayon sa sinasabi ninyo?” ay hindi ang pinakatumpak na paghubog ng tanong: ang “ayon sa” ay maaaring magpahiwatig lamang ng batayan o opinyon, samantalang ang λέγετε εἶναι ay tuwirang nagtatanong kung sino ang ipinahahayag nilang siya. Ang “sino ang sinasabi ninyong ako?” ay mas malapit sa saklaw ng Griyego at nananatiling idiomatiko.'
  naturalness: Ang kasalukuyang pangungusap ay nauunawaan ngunit medyo mabigat at hindi likas ang “ayon sa sinasabi ninyo” sa ganitong tanong. Mas natural at malinaw sa modernong Filipino ang “sino ang sinasabi ninyong ako?” Ang “Sinabi niya” ay katanggap-tanggap na natural na anyong pasalaysay sa Tagalog, kahit makasaysayang pangkasalukuyan ang λέγει sa Griyego.
  terminology: Walang teknikal o teolohikal na terminong kailangang baguhin. Pinananatili ng “Ngunit kayo” ang personal at pangmaramihang pagtuon sa mga alagad nang hindi dinaragdagan ang kahulugan.
  issues:
