id: MAT.16.12
reference: Matthew 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: tl
  text: Noon, naunawaan nila na hindi niya sinabing mag-ingat sila sa pampaalsa ng tinapay[a], kundi sa turo ng mga Pariseo at mga Saduseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pampaalsa ng mga tinapay.” Pangmaramihan ang pangngalang Griyego rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Noon ay
  rationale: Likas na panandang temporal sa Filipino na tumutukoy sa sandaling naunawaan ng mga alagad ang sinabi ni Jesus.
- source_word: συνῆκαν
  choice: naunawaan nila
  rationale: Tumpak na ipinapahayag ang pagdating nila sa pagkaunawa nang hindi nagdaragdag ng interpretasyon.
- source_word: οὐκ εἶπεν
  choice: hindi niya sinabing
  rationale: Natural sa Filipino ang ganitong ayos upang iugnay ang naunang sinabi sa pagkaunawang natamo nila noon.
- source_word: προσέχειν
  choice: mag-ingat sila
  rationale: Sa konteksto ng babala, ang pandiwa ay nangangahulugang maging mapagbantay o mag-ingat laban sa isang bagay.
- source_word: ἀπὸ τῆς ζύμης
  choice: sa pampaalsa
  rationale: Ang 'pampaalsa' ay karaniwang modernong salitang Filipino para sa yeast o leaven at pinananatili ang metapora ng teksto.
- source_word: τῶν ἄρτων
  choice: ng mga tinapay
  rationale: Pinananatili ang tahasang pangmaramihang anyo ng Griyego, bagaman maaari rin itong unawain bilang pangkalahatang 'tinapay.'
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang 'kundi' ay natural na pananda ng mariing pagtatama matapos ang negatibong sugnay na 'hindi.'
- source_word: διδαχῆς
  choice: turo
  rationale: Malinaw, kasalukuyan, at hindi teknikal na katumbas ng pagtuturo o nilalamang itinuturo.
- source_word: Φαρισαίων
  choice: mga Pariseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat, na may panandang pangmaramihan.
- source_word: Σαδδουκαίων
  choice: mga Saduseo
  rationale: Karaniwang anyong Filipino ng pangalan ng pangkat, na may panandang pangmaramihan.
theological_decisions:
- issue: Metaporikal na diwa ng pampaalsa
  choice: Pinanatili ang 'pampaalsa' at ang paliwanag lamang ng talata na tumutukoy ito sa turo ng mga Pariseo at mga Saduseo.
  alternative: Palawakin ito bilang 'mapagkunwari' o 'masamang turo.'
  rationale: Tinutukoy mismo ng talata ang turo bilang kahulugan ng metapora, ngunit hindi nito tahasang inilalarawan dito ang turo bilang pagpapaimbabaw o kasamaan; kaya hindi iyon idinagdag.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'pampaalsa' sa halip na mas lumang 'lebadura,' at pinanatili sa pangunahing teksto ang pangmaramihang 'mga tinapay' upang katawanin ang anyo ng Griyego.
