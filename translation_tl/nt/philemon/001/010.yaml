base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: tl
  text: Nakikiusap ako sa iyo tungkol sa aking anak[a] na si Onesimo, na aking ipinanganak sa aking mga gapos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “anak” ay isang talinghaga para sa espirituwal na ugnayan ni Pablo kay Onesimo. Maaari ring isalin: “na naging anak ko sa aking pagkabilanggo.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa aking mga gapos” ay maaari ring unawain na “sa aking pagkabilanggo”; pinananatili ng Griyego ang kongkretong larawan ng mga gapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Nakikiusap ako
  rationale: Ipinahahayag nito ang taos-puso at personal na pakiusap ni Pablo, hindi isang utos lamang.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: alang-alang sa aking anak
  rationale: Likas sa Filipino ang “alang-alang sa” para sa taong siyang paksa at kapakanan ng pakiusap; pinananatili ng “aking anak” ang magiliw na talinghaga ng espirituwal na ugnayan.
- source_word: τέκνου
  choice: anak
  rationale: Ang τέκνον ay “anak” at hindi likas na tumutukoy lamang sa anak na lalaki; naaangkop din ito sa matalinghagang espirituwal na relasyon.
- source_word: ὃν ἐγέννησα
  choice: na naging anak ko
  rationale: Natural itong pagpapahayag sa modernong Filipino ng pagkaparing espirituwal na ipinahihiwatig ng talinghaga ng γεννάω, habang iniiwasan ang di-likas na literal na “ipinanganak ko.”
- source_word: ἐν τοῖς δεσμοῖς
  choice: habang ako'y nakagapos
  rationale: Pinananatili nito ang kongkretong larawan ng mga gapos at likas ding nagpapahiwatig ng pagkabilanggo.
- source_word: Ὀνήσιμον
  choice: Onesimo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Onesimus.
theological_decisions:
- issue: Kalikasan ng relasyon ni Pablo kay Onesimo
  choice: Panatilihin ang talinghaga ng espirituwal na pagiging ama sa anyong “naging anak ko.”
  alternative: “na inakay ko sa pananampalataya” o “na naging anak ko sa pananampalataya”
  rationale: Malakas ang pahiwatig na sa pamamagitan ni Pablo ay sumampalataya si Onesimo, ngunit hindi tahasang binabanggit ng Griyego ang “pananampalataya” o “pagbabalik-loob”; kaya hindi ito idinagdag sa pangunahing teksto.
- issue: Mga gapos bilang literal na tanikala o metonimiya para sa pagkabilanggo
  choice: Panatilihin ang larawang “nakagapos.”
  alternative: “habang ako'y nakabilanggo”
  rationale: Ang δεσμοί ay maaaring tumukoy sa mismong mga gapos at, sa pamamagitan nito, sa pagkabilanggo. Pinananatili ng salin ang kongkretong larawan at ang saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino na magalang, magiliw, at angkop sa liham. Ang “Nakikiusap ako” ay personal ngunit marangal; ang “ako'y” ay bahagyang pampanitikan ngunit karaniwan at malinaw sa saling-biblikal.
