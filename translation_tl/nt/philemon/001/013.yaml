  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: tl
  text: Nais ko sana siyang panatilihin na kasama ko, upang sa halip mo ay makapaglingkod siya sa akin habang nakagapos ako dahil sa ebanghelyo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga gapos ng ebanghelyo”—ibig sabihin, mga gapos na may kaugnayan sa ebanghelyo o dahil sa ebanghelyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Onesimo. Likas at malinaw sa modernong Tagalog ang “siya.”
- source_word: ἐβουλόμην
  choice: Gusto ko sana
  rationale: Ipinapahayag ng imperfect na pandiwa ang dating hangarin ni Pablo; ang “sana” ay natural na naghahatid ng hangaring hindi niya basta isinagawa.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: panatilihin siya sa piling ko
  rationale: Ipinahihiwatig ng parirala ang pagpapanatili kay Onesimo na kasama ni Pablo. Mas marangal at relasyonal ang “sa piling ko” kaysa sa literal ngunit matigas na “para sa sarili ko.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinakikita ang layunin at angkop sa dignified na modernong Tagalog.
- source_word: ὑπὲρ σοῦ
  choice: sa ngalan mo
  rationale: Inilalarawan nito ang paglilingkod ni Onesimo bilang ginagawa para kay Filemon o bilang kinatawan niya, nang hindi labis na iginigiit ang ganap na pagpapalit.
- source_word: μοι διακονῇ
  choice: mapaglingkuran niya ako
  rationale: Saklaw ng διακονέω ang personal at praktikal na paglilingkod. Iniiwasan nito ang posibleng makitid na eklesiastikong diwa ng “magministeryo.”
- source_word: ἐν τοῖς δεσμοῖς
  choice: habang nakagapos ako
  rationale: Pinananatili ang kongkretong larawan ng pagkakagapos habang natural na ipinahihiwatig ang pagkabilanggo ni Pablo.
- source_word: τοῦ εὐαγγελίου
  choice: dahil sa ebanghelyo
  rationale: 'Sa Tagalog, ang literal na “mga gapos ng ebanghelyo” ay madaling magmukhang ang ebanghelyo mismo ang gumagapos. Ang causal na salin ay malinaw na naghahatid ng malamang na diwa: nakagapos si Pablo dahil sa kanyang gawain para sa ebanghelyo.'
theological_decisions:
- issue: Ugnayan ng τοῦ εὐαγγελίου sa δεσμοῖς
  choice: dahil sa ebanghelyo
  alternative: mga gapos ng ebanghelyo
  rationale: Maaaring panatilihing siksik ang genitive sa isang napakapormal na salin, ngunit hindi likas at maaaring malabo sa Tagalog ang “mga gapos ng ebanghelyo.” Ang “dahil sa ebanghelyo” ay naghahatid ng malamang na causal na kahulugan nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Gusto ko sana” sa halip na mas pormal na “Ninais ko sana,” at “sa piling ko” upang ipahayag ang personal na konteksto nang hindi kolokyal.
