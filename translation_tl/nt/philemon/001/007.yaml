base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: tl
  text: Sapagkat labis akong nagalak at napalakas ang loob dahil sa iyong pag-ibig, sapagkat sa pamamagitan mo ay nabigyang-ginhawa ang mga puso ng mga banal, kapatid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν γὰρ πολλὴν ἔσχον
  choice: Sapagkat labis akong nagalak
  rationale: Natural na ipinapahayag sa modernong Tagalog ang idyomang ‘nagkaroon ako ng malaking kagalakan’ habang pinananatili ang tindi ng πολλήν at ang sanhi na ipinahihiwatig ng γάρ.
- source_word: παράκλησιν
  choice: napalakas ang loob
  rationale: Saklaw ng παράκλησις ang pag-aliw at pagpapalakas ng loob. Ang pandiwang pariralang ito ay natural sa Tagalog at angkop sa aktibong pampatibay na natanggap ni Pablo.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: dahil sa iyong pag-ibig
  rationale: Ipinapakita ng ἐπί na may datibo rito ang sanhi o batayan ng kagalakan at pagpapalakas ng loob ni Pablo.
- source_word: τὰ σπλάγχνα
  choice: ang puso
  rationale: Ang literal na larawan ng mga laman-loob ay isang idyoma para sa malalim na damdamin at panloob na pagkatao. Ang ‘puso’ ang malinaw at likas na katumbas sa Tagalog; nililinaw ng talababa ang mas literal na diwa.
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Pinananatili nito ang karaniwang katawagang Paulino sa mga taong ibinukod para sa Diyos, nang hindi pinapalitan ng mas interpretatibong ‘mga mananampalataya’ o ‘bayan ng Diyos.’
- source_word: ἀναπέπαυται
  choice: napaginhawa
  rationale: Ipinahihiwatig ng perpektong aspekto ang kasalukuyang bunga ng nagawang pagkakaloob ng ginhawa o kapahingahan.
- source_word: διὰ σοῦ
  choice: sa pamamagitan mo
  rationale: Pinananatili nito ang instrumental o ahentibong diwa ng διά na may henitibo.
- source_word: ἀδελφέ
  choice: kapatid
  rationale: Tuwirang pinananatili ang pangkomunidad at pampamilyang pagtawag kay Filemon nang walang idinagdag na pang-uri.
theological_decisions:
- issue: Pagpapakahulugan sa ἅγιοι
  choice: mga banal
  alternative: bayan ng Diyos; mga taong ibinukod para sa Diyos
  rationale: Ang ‘mga banal’ ay tekstuwal na malinaw at pinananatili ang katawagang ginagamit ni Pablo para sa mga kabilang sa sambayanan ng Diyos, nang hindi ipinahihiwatig ang mas huling konsepto ng opisyal na kanonisasyon.
- issue: Antropolohikal na idyoma ng σπλάγχνα
  choice: puso
  alternative: kaloob-looban; malalim na damdamin
  rationale: Tumutukoy ang Griyegong idyoma sa panloob na buhay at malalim na pagmamahal, hindi lamang sa pisikal na mga sangkap. Natural ang ‘puso’ sa Tagalog, habang pinananatili ng talababa ang lawak ng orihinal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginawang pandiwang parirala ang mga abstraktong pangngalang ‘kagalakan’ at ‘pagpapalakas-loob’ upang maging likas ang daloy, habang pinananatili ang sanhi, tindi, at pastoral na tono ng Griyego.
