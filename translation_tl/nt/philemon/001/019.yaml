source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: tl
  text: 'Ako, si Pablo, ang sumulat nito sa sarili kong kamay: babayaran ko iyon—hindi ko na babanggitin sa iyo na utang mo rin sa akin maging ang sarili mo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Ako, si Pablo, ang sumulat nito sa sarili kong kamay; babayaran ko iyon; upang hindi ko sabihin sa iyo na utang mo rin sa akin maging ang sarili mo.”'
    reason: Pinananatili ng alternatibo ang mas pormal na anyo ng aorist at ng ἵνα μὴ λέγω σοι.
lexical_decisions:
- source_word: ἔγραψα
  choice: ang sumulat nito
  rationale: Pinananatili ang aspektong aorist bilang nakumpletong pagsulat, ngunit natural ang pariralang Filipino habang itinuturo ni Pablo ang personal niyang isinulat na garantiya.
- source_word: τῇ ἐμῇ χειρί
  choice: sa sarili kong kamay
  rationale: Likas at malinaw na pahayag na si Pablo mismo ang sumulat, at hindi lamang nagpaubaya sa isang tagasulat.
- source_word: ἀποτίσω
  choice: babayaran ko iyon
  rationale: Tuwirang ipinapahayag ang pangakong sasagutin ang anumang utang o kawalan na binanggit sa naunang talata.
- source_word: ἵνα μὴ λέγω σοι
  choice: hindi ko na babanggitin sa iyo
  rationale: Inihahatid ang retorikal at bahagyang mapagbiro o mapagparayang diin ng Griyego, sa halip na ituring itong mahigpit na sugnay ng layunin.
- source_word: σεαυτόν
  choice: maging ang sarili mo
  rationale: Ipinakikita ang diin ng καί sa personal na pagkakautang ni Filemon nang hindi tinutukoy kung ano mismo ang pinagmulan nito.
- source_word: προσοφείλεις
  choice: utang mo rin sa akin
  rationale: 'Ang “rin” ay naghahatid ng dagdag na diwa ng πρός sa tambalang pandiwa: bukod sa ibang utang, may personal pang pagkakautang.'
theological_decisions:
- issue: Ang likas at pinagmulan ng pagkakautang ni Filemon kay Pablo
  choice: 'Panatilihin ang matinding ngunit hindi tinukoy na personal na pagkakautang: “maging ang sarili mo ay utang mo rin sa akin.”'
  alternative: Tukuying utang ni Filemon kay Pablo ang kanyang pagbabalik-loob, kaligtasan, o pisikal na buhay.
  rationale: Hindi tahasang sinasabi ng Griyego ang batayan ng pagkakautang. Pinananatili ng salin ang teolohikal at makasaysayang kalabuan sa halip na magdagdag ng tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Akong si Pablo” para mapanatili ang mariing ἐγὼ Παῦλος, at ang “sarili kong kamay” para idiin ang personal na garantiya. Ang hulihang sugnay ay nananatiling matindi at bahagyang ironiko nang hindi nilulutas ang uri ng personal na utang.
