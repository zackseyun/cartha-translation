    rationale: Ang dobleng nominal na “pakikibahaging kaugnay” ay hindi gaanong likas. Ang “pakikibahagi ng iyong pananampalataya” ay mas natural at hindi pa rin nilulutas nang labis ang mahirap na genitibo.
