  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: tl
  text: 'Filemon 1:6


    upang ang pakikibahagi ng iyong pananampalataya[a][b] ay maging mabisa sa pagkilala sa bawat mabuting bagay na nasa atin[c] para sa Mesiyas.[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang pagbabahagi ng iyong pananampalataya,” “ang pakikibahagi sa iyong pananampalataya,” o “ang pakikipagtuwang na bunga ng iyong pananampalataya.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang isinaling “pananampalataya” ay maaari ring magtaglay ng diwang “pagtitiwala” o “katapatan” sa ilang konteksto.
    reason: alternative_reading
  - marker: c
    text: 'Sa ilang manuskrito: “nasa iyo” sa halip na “nasa atin.”'
    reason: textual_variant
  - marker: d
    text: 'Maaari ring: “Cristo.” Ang Χριστός ay isang titulong nangangahulugang “Mesiyas” o “Pinahiran.”'
    reason: lexical_alternative
  - marker: e
    text: Maaari ring unawain ang hulíng parirala bilang “patungo sa Mesiyas” o iugnay sa pagiging mabisa ng pakikibahagi, sa halip na sa “bawat mabuting bagay.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: Idinadalangin ko na
  rationale: Sa konteksto ng panalangin sa mga talata 4–6, ipinahihiwatig ng ὅπως ang nilalayon o hinihiling ni Pablo. Isinama ang diwang ito upang maging buo at natural ang pangungusap sa Filipino.
- source_word: κοινωνία τῆς πίστεώς σου
  choice: ang pakikibahaging kaugnay ng iyong pananampalataya
  rationale: 'Malawak ang saklaw ng κοινωνία: pakikibahagi, pakikipagkaisa, pagbabahagi, o pakikipagtuwang. Hindi tiyak ang ugnayan ng genitibong τῆς πίστεώς σου, kaya ginamit ang “kaugnay ng” upang hindi ipasya kung ito ay pagbabahagi ng pananampalataya o pakikibahagi sa pananampalataya.'
- source_word: πίστεώς
  choice: pananampalataya
  rationale: Ito ang karaniwan at angkop na salin ng πίστις dito, habang pinananatili sa talababa ang posibleng diwang “pagtitiwala” o “katapatan.”
- source_word: ἐνεργὴς γένηται
  choice: ay maging mabisa
  rationale: Ipinapahayag ng ἐνεργής kasama ng γένηται ang pagiging aktibo o mabisa; natural na naihahatid ito ng “maging mabisa.”
- source_word: ἐν ἐπιγνώσει
  choice: sa pagkilala
  rationale: Ang ἐπίγνωσις ay tumutukoy sa tunay o ganap na pagkilala. Ang “sa” ay nagpapanatili sa ἐν nang hindi tiyak na nilulutas kung instrumental (“sa pamamagitan ng”) o tumutukoy sa larangan ng pagiging mabisa.
- source_word: παντὸς ἀγαθοῦ
  choice: sa bawat mabuting bagay
  rationale: Ang neutrong anyo ay natural na isinasalin bilang “bawat mabuting bagay”; hindi ipinapasok ang mas tiyak ngunit hindi nakasaad na “kaloob.”
- source_word: τοῦ ἐν ἡμῖν
  choice: na nasa atin
  rationale: Sinusunod nito ang teksto ng SBLGNT na ἡμῖν, “atin,” at inuugnay ang parirala sa “bawat mabuting bagay.”
- source_word: εἰς Χριστόν
  choice: para sa Mesiyas
  rationale: Ang εἰς ay nagpapahayag dito ng tunguhin o kaugnayan kay Χριστός. Ang “para sa” ay likas sa Filipino ngunit hindi labis na nagpapaliwanag; ang Χριστός bilang titulo ay isinaling “Mesiyas.”
theological_decisions:
- issue: Kahulugan ng κοινωνία τῆς πίστεώς σου
  choice: pakikibahaging kaugnay ng iyong pananampalataya
  alternative: pagbabahagi ng iyong pananampalataya; pakikibahagi sa pananampalataya; pakikipagtuwang na bunga ng iyong pananampalataya
  rationale: Mahirap at sadyang malawak ang parirala. Pinananatili ng pangunahing salin ang kaugnayan sa praktikal at pangkomunidad na pananampalataya nang hindi nililimitahan ito sa pangangaral lamang o sa panloob na pakikisama lamang.
- issue: Kahulugan ng ἐν ἐπιγνώσει
  choice: sa pagkilala
  alternative: sa pamamagitan ng pagkilala; sa ganap na pagkilala
  rationale: Maaaring instrumental o tumukoy sa larangan ang ἐν. Ang payak na “sa” ay nagpapanatili ng puwang para sa dalawang pagbasa.
- issue: Tinutukoy ng “nasa atin”
  choice: kolektibong “atin,” ayon sa ἡμῖν ng SBLGNT
  alternative: “nasa iyo,” ayon sa ilang manuskrito
  rationale: Hindi pinalitan ang piniling teksto ng SBLGNT, ngunit malinaw na itinala ang mahalagang baryanteng tekstuwal.
- issue: Tungkulin ng εἰς Χριστόν
  choice: para sa Mesiyas, na pinakamalapit na inuugnay sa mabubuting bagay na nasa atin
  alternative: patungo sa Mesiyas; alang-alang sa Mesiyas; maaaring iugnay sa pagiging mabisa ng pakikibahagi
  rationale: Malabo ang eksaktong pagkakabit ng hulíng parirala. Pinili ang natural na ayos sa Filipino, habang itinatala sa talababa ang posibleng ibang pagkakabit.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pakikibahaging kaugnay ng” upang mapanatili ang tunay na kalabuan ng pariralang Griyego nang hindi nagiging sobrang teknikal. Ang “Idinadalangin ko na” ay kontekstuwal na pandugtong mula sa panalangin ni Pablo sa mga talata 4–6 at nagbibigay ng likas na buong pangungusap sa Filipino.
