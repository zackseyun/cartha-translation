  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: tl
  text: hindi na bilang isang alipin[a], kundi higit pa sa isang alipin—isang minamahal na kapatid, lalo na sa akin, at gaano pa kaya sa iyo, kapwa sa laman[b] at sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay maaari ring isaling “lingkod” o “aliping nakatali sa paglilingkod,” ngunit sa kontekstong ito ay malamang na tumutukoy sa kalagayang panlipunan ni Onesimo bilang alipin.
    reason: alternative_reading
  - marker: b
    text: Ang “sa laman” dito ay malamang na tumutukoy sa makalupa, personal, o panlipunang ugnayan, hindi sa “likas na makasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas at tuwirang ipinapahayag ang pagbabagong mula sa dating kalagayan.
- source_word: ὡς δοῦλον
  choice: bilang isang alipin
  rationale: Sa kontekstong panlipunan at legal ni Onesimo, mahalagang panatilihin ang diwa ng pagkakaalipin, hindi lamang pangkalahatang paglilingkod.
- source_word: ὑπὲρ δοῦλον
  choice: higit pa sa isang alipin
  rationale: Ipinahahayag ng ὑπέρ ang katayuan o pagpapahalagang lumalampas sa pagiging alipin, at natural ang ganitong paghahambing sa Tagalog.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: isang minamahal na kapatid
  rationale: Pinananatili ang metaporang pampamilya sa sambayanang Cristiano at ang malinaw na diwa ng ἀγαπητός.
- source_word: μάλιστα ἐμοί
  choice: Minamahal ko siya lalo na
  rationale: Ginawang ganap na sugnay upang maging natural at malinaw sa Tagalog habang pinananatili ang natatanging antas ng ugnayan kay Pablo.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: ngunit lalo pa nga para sa iyo
  rationale: Pinananatili ang retorikal na pagtaas mula sa kaugnayan ni Pablo tungo sa higit na kaugnayan ni Filemon.
- source_word: ἐν σαρκὶ
  choice: sa laman
  rationale: Pinananatili ang sadyang malawak at teolohikal na pananalita ni Pablo; nililinaw sa talababa na tumutukoy ito rito sa makalupa, personal, o panlipunang ugnayan.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang ekspresyon ni Pablo tungkol sa ugnayan o kalagayang nakasentro sa Panginoon nang hindi ito labis na ipinapaliwanag.
theological_decisions:
- issue: Pagsasalin ng δοῦλος sa kalagayan ni Onesimo
  choice: alipin
  alternative: lingkod; aliping nakatali sa paglilingkod
  rationale: Sentral sa liham ang panlipunang kalagayan ni Onesimo. Ang “alipin” ang pinakamalinaw na nagpapanatili sa masakit na realidad at sa puwersa ng paghahambing na “higit pa sa isang alipin.”
- issue: Kahulugan ng ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: kapwa sa laman at sa Panginoon
  alternative: kapwa sa personal o makalupang ugnayan at sa Panginoon
  rationale: 'Pinananatili ng literal na anyo ang lawak at tensiyon ng pananalita ni Pablo: may kaugnayan si Onesimo kay Filemon sa antas na makatao at panlipunan, gayundin sa kanilang pakikipag-isa sa Panginoon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “alipin” dahil mahalaga ang kalagayang panlipunan sa konteksto, at ang “sa laman” upang huwag paliitin ang sadyang malawak na pahayag ni Pablo; may mga talababa para sa mahahalagang alternatibo.
