  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: tl
  text: Kasabay nito, ipaghanda mo rin ako ng matutuluyan[a], sapagkat umaasa akong sa pamamagitan ng inyong mga panalangin ay ipagkakaloob ako sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuluyan” o “pagtanggap sa panauhin.” Ang salitang Griyego ay maaaring tumukoy sa pagtanggap at pag-aasikaso sa isang panauhin o sa lugar na inihanda para sa kaniya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ibibigay ako sa inyo.” Ang pandiwang Griyego ay may diwa ng kusang o mapagbiyayang pagbibigay, at malamang na ipinahihiwatig na Diyos ang kumikilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Kasabay nito, ... rin
  rationale: Ipinahahayag nito na may karagdagang kahilingan kasabay ng naunang sinabi. Likas sa Tagalog ang paghahati ng diwa sa “Kasabay nito” at “rin.”
- source_word: ἑτοίμαζέ μοι
  choice: ipaghanda mo ... ako
  rationale: Pinananatili ang tuwirang pautos at ang diwang para sa kapakinabangan ni Pablo ang paghahanda.
- source_word: ξενίαν
  choice: matutuluyan
  rationale: Maaaring tumukoy ang salita sa pagpapatuloy sa panauhin o sa lugar na tutuluyan. Sa pagsama nito sa pautos na “ipaghanda,” pinakamalamang dito ang konkretong matutuluyan.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: sapagkat umaasa akong
  rationale: Ipinapakita ng “sapagkat” na dahilan ito ng kahilingan, at likas na ipinakikilala ng “umaasa akong” ang nilalaman ng pag-asa.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: sa pamamagitan ng inyong mga panalangin
  rationale: Pinananatili ang instrumental na diwa ng διά at ang maramihang anyo ng “mga panalangin” at “inyong.”
- source_word: χαρισθήσομαι ὑμῖν
  choice: ipagkakaloob ako sa inyo
  rationale: Pinananatili ang balintiyak na anyo at ang diwa ng kusang o mapagbiyayang pagkakaloob nang hindi tahasang idinaragdag kung sino ang kumikilos.
theological_decisions:
- issue: Ang ipinahihiwatig na tagaganap at kahulugan ng χαρισθήσομαι
  choice: ipagkakaloob ako sa inyo
  alternative: ibabalik ako sa inyo / palalayain ako upang makapunta sa inyo
  rationale: Malamang na Diyos ang ipinahihiwatig na tagaganap, ngunit hindi Siya tahasang binanggit sa Griyego. Hindi rin tahasang sinasabi rito ang paglaya o pagbabalik, kaya pinananatili ang mas malawak at may tensiyong pananalitang “ipagkakaloob.”
translation_notes:
  register: Modernong Filipino na magalang at dignified. Ginamit ang “matutuluyan” para sa malinaw at pangkaraniwang pananalita, habang pinanatili sa “ipagkakaloob ako sa inyo” ang di-karaniwang ngunit mahalagang balintiyak at teolohikal na pahiwatig ng orihinal.
