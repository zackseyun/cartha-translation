base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: tl
  text: Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos na ating Ama at sa Panginoong Jesus na Mesiyas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Panginoong Jesu-Cristo.” Ang salitang Griyego na Χριστός ay maaaring gamitin bilang titulong “Mesiyas” o, sa ilang konteksto, bilang bahaging halos pangalan na, “Cristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Pinananatili ng “biyaya” ang karaniwang pagbati ni Pablo at ang mas malalim nitong diwang teolohikal; hindi ito nililimitahan sa karaniwang pabor lamang.
- source_word: ὑμῖν
  choice: sumainyo
  rationale: Likas na paraan ito sa makabagong Tagalog upang ipahayag ang pagbati o pagpapalang nakalaan sa mga kausap.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwirang salin na nagpapanatili kapwa sa diwa ng pagbati at sa mas malawak na kahulugan ng ganap na kagalingan na kaugnay ng shalom.
- source_word: ἀπὸ
  choice: mula sa
  rationale: Malinaw nitong ipinapahayag na ang Diyos Ama at ang Panginoong Jesus ang pinagmumulan ng biyaya at kapayapaan.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: 'Ipinapakita nito ang pinaka自然 na appositional na ugnayan: ang Diyos ay ating Ama, hindi ang alternatibong pagbasa na “ating Diyos at Ama.”'
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili nito ang marangal na titulo at ang kristolohikal na bigat ng κύριος sa gamit ni Pablo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring na apelyido; ang “na” ay ginagawang natural at malinaw ang titulo sa Tagalog.
theological_decisions:
- issue: Paglalahad sa Χριστοῦ sa titulong Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesu-Cristo
  rationale: Maaaring gumana ang Χριστός bilang titulo o bilang bahaging halos pangalan na. Pinili ang “Mesiyas” upang hayagang mapanatili ang kahulugan ng titulo, habang inilalagay sa talababa ang nakaugaliang “Cristo” bilang tunay na alternatibo.
- issue: Pahiwatig ng pagbati bilang kahilingan o pagpapala
  choice: Sumainyo nawa
  alternative: Biyaya sa inyo at kapayapaan
  rationale: Walang tahasang pandiwa sa Griyego, ngunit ang nominal na pormula ay gumaganap bilang pagbati at pagpapala. Ang “nawa” ay natural sa Tagalog at hindi nagtatakda kung ito ay panalangin lamang o pormal na pagbati lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang likas na pormulang “Sumainyo nawa” para sa pagbati, habang pinanatili ang simetrikong pinagmulan ng biyaya at kapayapaan sa Diyos Ama at sa Panginoong Jesus.
