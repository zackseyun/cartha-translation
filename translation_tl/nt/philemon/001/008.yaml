  naturalness: Mas likas sa makabagong Tagalog ang “may malaking kalayaan ako kay Mesiyas na utusan kang gawin ang nararapat.” Iniiwasan nito ang hindi makinis na konstruksyong “iutos sa iyo ang nararapat,” na maaaring mangahulugang ipag-utos sa kausap ang isang bagay para sa iba.
  terminology: Ang “Mesiyas” ay angkop na salin ng titularyong Χριστός, alinsunod sa ibinigay na patakaran. Ang “kay Mesiyas” ay idiomatikong Tagalog para sa ugnayang ipinahihiwatig dito ng ἐν Χριστῷ, nang hindi ito nililimitahan sa isang teknikal na pagpapakahulugan. Ang “kalayaan” ay angkop ding saklaw ng παρρησία sa kontekstong may awtoridad na mag-utos.
