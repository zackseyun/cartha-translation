lexical_decisions:
- source_word: Διό
  choice: Kaya
  rationale: Likas na pang-ugnay sa Tagalog na nagpapakita ng kongklusyon o bunga mula sa naunang sinabi.
- source_word: πολλὴν ... παρρησίαν
  choice: may malaking katapangan
  rationale: Pinananatili ang diwa ng matinding tapang, lakas ng loob, o malayang pagsasalita nang hindi nililimitahan ang salita sa isa lamang sa mga aspektong iyon.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Pinananatili ng “sa” ang malawak na ugnayang ipinahihiwatig ng ἐν, samantalang isinasalin ng “Mesiyas” ang Χριστός bilang titulo.
- source_word: ἔχων
  choice: bagaman may ... ako
  rationale: Concessive ang gamit ng participle sa konteksto, bilang paghahanda sa pagsalungat sa talata 9; malinaw at natural itong naipapahayag ng “bagaman.”
- source_word: ἐπιτάσσειν σοι
  choice: na iutos sa iyo
  rationale: Ipinahahayag ang awtoritatibong lakas ng ἐπιτάσσω at pinananatiling malinaw na si Filemon ang pinatutungkulan.
- source_word: τὸ ἀνῆκον
  choice: ang nararapat
  rationale: Maikli at likas na katumbas ng kung ano ang angkop, wasto, o nararapat sa sitwasyon.
theological_decisions:
- issue: Pagsasalin ng Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang Χριστός at ang “Mesiyas” ay tuwirang nagpapahayag ng kahulugan nitong ‘Pinahiran,’ nang walang idinaragdag na doktrinal na paliwanag. Inilalagay sa talababa ang nakaugaliang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang bukas na kahulugan ng “sa Mesiyas” at ang concessive na ugnayan ng “bagaman,” habang hinahayaang magpatuloy ang pangungusap tungo sa talata 9.
