base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: tl
  text: Dahil buo ang tiwala ko sa iyong pagsunod, sumulat ako sa iyo, sapagkat alam kong gagawin mo maging ang higit pa sa sinasabi ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lalampas ka pa sa sinasabi ko.” Maaaring ipinahihiwatig ni Pablo na gagawin ni Filemon ang higit sa espesipikong hiniling niya, ngunit hindi tiyak na sinasabi ng teksto kung ano iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Buong tiwala
  rationale: Ang perpektong aktibong participle ay nagpapahayag ng matatag at nagpapatuloy na pagtitiwala; likas sa modernong Tagalog ang pariralang ito.
- source_word: τῇ ὑπακοῇ σου
  choice: sa iyong pagsunod
  rationale: Pinananatili ng “pagsunod” ang diwa ng ὑπακοή bilang pakikinig at pagtalima, nang hindi ito pinatitindi tungo sa sapilitang pagpapasakop.
- source_word: ἔγραψά σοι
  choice: sumulat ako sa iyo
  rationale: Tuwirang isinasalin ang aorist bilang naganap na kilos at angkop ito sa konteksto ng liham.
- source_word: εἰδὼς
  choice: sapagkat alam kong
  rationale: Inilalahad nito nang natural sa Tagalog ang kaalamang kasabay at saligan ng pagsulat ni Pablo.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: pa nga ang higit sa sinasabi ko
  rationale: Pinananatili ang diwa ng paglampas sa tahasang sinabi ni Pablo at ang sadyang kawalan ng tiyak na paliwanag kung ano ang dagdag na gagawin.
- source_word: ποιήσεις
  choice: gagawin mo
  rationale: Ang payak na pandiwang ito ay tumutugma sa malawak at bukas na kahulugan ng ποιέω at hindi tinutukoy kung anong partikular na kilos ang inaasahan.
theological_decisions:
- issue: Lakas ng ὑπακοή kaugnay ng pakiusap ni Pablo
  choice: Isinalin bilang “pagsunod.”
  alternative: “pagtugon” o “pagpayag”
  rationale: Malinaw na may diwa ng pagtalima ang ὑπακοή. Pinananatili nito ang bigat ng ugnayan at awtoridad sa liham nang hindi nagdaragdag ng pamimilit na wala sa teksto.
- issue: Ipinahihiwatig ng “higit sa sinasabi ko”
  choice: Iniwan itong bukas at hindi tinukoy ang karagdagang kilos.
  alternative: Tahasang sabihing inaasahan ni Pablo na palalayain si Onesimo, o na tatanggapin lamang siya nang bukas-palad.
  rationale: May ipinahihiwatig ang pananalita ni Pablo ngunit hindi nito tiyak na sinasabi kung ano ang higit na gagawin ni Filemon; pinananatili ng salin ang sadyang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “buo ang tiwala ko” upang maihatid ang matatag na kumpiyansa ng participle, at iniwasang tukuyin ang hindi tahasang sinabing dagdag na kilos ni Filemon.
