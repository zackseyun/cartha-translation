id: PHM.1.20
reference: Philemon 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: tl
  text: Oo, kapatid, makinabang naman sana ako sa iyo sa Panginoon.[a] Paginhawahin mo ang puso ko[b] sa Mesiyas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “magkaroon sana ako ng pakinabang mula sa iyo” o “magkaroon sana ako ng kagalakan dahil sa iyo.” Maaaring pinaglalaruan ni Pablo ang pangalan ni Onesimo at ang ideya ng pagiging kapaki-pakinabang.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang aking mga kaloob-looban,” isang idyoma para sa pinakamalalim na damdamin o panloob na pagkatao.
    reason: lexical_alternative
  - marker: c
    text: O “sa Cristo.” Ang Griyegong Χριστός ay titulong nangangahulugang “Pinahiran.”
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Oo
  rationale: Likas at tuwirang panimulang pagsang-ayon sa isang magiliw ngunit mariing pakiusap.
- source_word: ἀδελφέ
  choice: kapatid
  rationale: Tuwirang pantawag kay Filemon bilang kapatid sa pananampalataya; hindi kailangang tukuyin pa ang kasarian sa Tagalog.
- source_word: ἐγώ σου ὀναίμην
  choice: makinabang naman sana ako sa iyo
  rationale: Pinananatili ng “sana” ang himig ng optative na pakiusap, habang ang “makinabang” ay tumutugma sa diwa ng ὀνίνημι at maaari ring magpanatili ng paglalaro sa pangalan ni Onesimo.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Likas na salin ng karaniwang pariralang Paulino na tumutukoy sa saklaw ng kanilang ugnayan at pagkilos bilang mga kabilang sa Panginoon.
- source_word: ἀνάπαυσόν
  choice: Paginhawahin mo
  rationale: Naghahayag ng tiyak na pakiusap na magdulot ng ginhawa o kapahingahan at umaalingawngaw sa kaparehong diwa sa talata 7.
- source_word: μου τὰ σπλάγχνα
  choice: ang puso ko
  rationale: Ang literal na “mga kaloob-looban” ay isang idyoma para sa malalim na damdamin o panloob na pagkatao; “puso ko” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Ipinahahayag ng Χριστός ang titulong “Pinahiran”; pinananatili ng “Mesiyas” ang titular na diwa sa malinaw at pamilyar na anyong Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Kapwa tanggap na pantukoy kay Jesus, ngunit mas hayagang pinananatili ng “Mesiyas” ang titular na kahulugan ng Χριστός kaysa sa nakagawiang transliterasyong “Cristo.”
- issue: Pagbibigay-kahulugan sa κυρίῳ
  choice: Panginoon
  alternative: Ginoo o Amo
  rationale: Sa kontekstong Paulino, “Panginoon” ang angkop na banal na titulo at hindi nito ipinapasok ang mas makitid na himig ng ugnayang amo at alipin.
- issue: Ugnayan ng “sa Panginoon” sa pakiusap
  choice: Pinanatiling kasunod ng “makinabang…sa iyo”
  alternative: Iugnay nang mas tahasan sa paraan o batayan ng pakinabang
  rationale: Hindi nililinaw nang higit sa Griyego kung ang parirala ay pangunahing tumutukoy sa saklaw, batayan, o paraan ng hinihinging pakinabang.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang “naman sana” upang maipahayag ang magiliw na pakiusap nang hindi pinahihina ang bigat nito. Pinanatili ang dalawang pariralang “sa Panginoon” at “sa Mesiyas” at ang posibleng pag-uulit ng diwang “paginhawahin” mula sa talata 7.
