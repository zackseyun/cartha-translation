  naturalness: Natural at angkop sa modernong Filipino Tagalog ang binagong ayos na “marahil ay dahil dito kaya siya’y nahiwalay.” Ang “muli mo siyang makapiling” ay likas na paraan upang ihayag ang relational na diwa ng ἀπέχῃς nang hindi nagbibigay ng di-kailangang impresyon ng pag-aari.
  terminology: Ang “nahiwalay” ay wastong balintiyak at hindi nagtatalaga ng ahensiya. Ang “magpakailanman” ay angkop para sa αἰώνιον at malinaw na katapat ng “nang ilang panahon.”
