  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: tl
  text: Sapagkat marahil ay dahil dito kaya siya’y nahiwalay sa iyo nang ilang panahon, upang muli mo siyang makapiling magpakailanman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umalis siya sa iyo nang ilang panahon.” Ang pandiwang Griyego ay balintiyak, “nahiwalay,” na maaaring maingat na umiiwas sa tuwirang paninisi at maaari ring magpahiwatig ng layunin ng Diyos nang hindi ito tahasang sinasabi.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: marahil
  rationale: Pinananatili ang maingat at di-tiyak na pagpapalagay ni Pablo.
- source_word: γὰρ
  choice: sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan nito sa naunang pahayag.
- source_word: διὰ τοῦτο
  choice: upang
  rationale: Sa likas na ayos ng pangungusap sa Filipino, ang ipinahihiwatig na dahilan ay naihahayag kasama ng sugnay na nagsasaad ng layunin, nang hindi ginagawang tahasang tiyak ang paliwanag ni Pablo.
- source_word: ἐχωρίσθη
  choice: nahiwalay
  rationale: Pinananatili ang anyong balintiyak at hindi tuwirang sinisisi si Onesimo o tahasang itinuturing ang Diyos na gumawa nito.
- source_word: πρὸς ὥραν
  choice: nang sandaling panahon
  rationale: Likas na idyoma para sa limitadong panahon at malinaw na kasalungat ng “magpakailanman”; hindi ito literal na isang oras.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na naghahayag ng layunin o kinalabasan.
- source_word: αἰώνιον
  choice: magpakailanman
  rationale: Likas at marangal na salin ng pang-abay na diwa, na pinananatili ang kaibahan sa pansamantalang pagkakahiwalay.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy kay Onesimo bilang layon ng pandiwa.
- source_word: ἀπέχῃς
  choice: makapiling mo siya
  rationale: Ipinahahayag ang muling pagkakaroon sa kaniya sa paraang likas at may kaugnayang personal sa Filipino, nang hindi idiing parang pag-aari lamang ang isang tao.
theological_decisions:
- issue: Ang ahensiyang ipinahihiwatig ng balintiyak na ἐχωρίσθη
  choice: Panatilihin ang balintiyak na “nahiwalay” nang hindi pinapangalanan ang gumawa.
  alternative: “umalis siya” o “inihiwalay siya ng Diyos”
  rationale: Maaaring maingat na ipinahihiwatig ng pananalita ni Pablo ang pagkilos ng Diyos, ngunit hindi niya ito tahasang sinasabi. Pinananatili ng salin ang kalabuan at teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinili ang “nahiwalay” upang mapanatili ang balintiyak at ang sadyang di-tiyak na ahensiya; ang “makapiling mo siya” ay nagbibigay-diin sa panunumbalik ng ugnayan.
