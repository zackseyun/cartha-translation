id: PHM.1.17
reference: Philemon 1:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: tl
  text: Kaya, kung itinuturing mo akong katuwang, tanggapin mo siya gaya ng pagtanggap mo sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malugod mong tanggapin siya.” Ang pandiwa ay maaaring mangahulugan ng mabuting pagtanggap sa isang tao o pagkilala sa kanya bilang kabilang sa pakikisama.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Kaya, kung
  rationale: Likas na ipinahahayag sa modernong Tagalog ang kondisyong εἰ at ang paghinuha ng οὖν, habang malinaw na iniuugnay ang pakiusap sa naunang sinabi.
- source_word: ἔχεις κοινωνόν
  choice: itinuturing mo akong katuwang
  rationale: Ang κοινωνός ay taong kabahagi o kasama sa isang gawain o ugnayan. Ang “katuwang” ay natural at marangal sa Tagalog at hindi nagpapasok ng teknikal na kahulugang panrelihiyon.
- source_word: προσλαβοῦ
  choice: tanggapin mo
  rationale: Saklaw ng pandiwa ang mabuting pagtanggap o pagkilala sa isang tao bilang kabilang sa pakikisama. Pinananatili ng “tanggapin” ang lawak na ito; maaaring idiin ng “malugod mong tanggapin” ang pagtanggap nang may pabor.
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang tumutukoy kay Onesimo ayon sa konteksto.
- source_word: ὡς ἐμέ
  choice: gaya ng pagtanggap mo sa akin
  rationale: 'Nililinaw sa natural na Tagalog ang eliptikong paghahambing: dapat tanggapin si Onesimo sa paraang tatanggapin si Pablo.'
theological_decisions:
- issue: Relasyonal na diwa ng κοινωνός sa pakiusap ni Pablo
  choice: katuwang
  alternative: kabahagi; kasama
  rationale: Ipinahahayag ng “katuwang” ang magkapantay na pakikibahagi at malapit na ugnayan nina Pablo at Filemon nang hindi ito ginagawang teknikal na katawagang doktrinal.
- issue: Lawak ng προσλαβοῦ
  choice: tanggapin mo
  alternative: malugod mong tanggapin; kilalanin mo bilang kabilang
  rationale: Pinananatili ng salin ang posibleng saklaw mula personal na pagtanggap hanggang relasyonal na pagkilala, sa halip na limitahan ito sa simpleng pagpapatuloy lamang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “katuwang” sa halip na mas teknikal o makalumang pananalita, at pinalawak nang bahagya ang ὡς ἐμέ upang maging malinaw ang eliptikong paghahambing sa Tagalog.
