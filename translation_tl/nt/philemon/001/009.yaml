  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: tl
  text: Dahil sa pag-ibig ay sa halip nakikiusap ako[a]—ako, si Pablo, isang matandang lalaki[b], at ngayo'y bilanggo rin ng Mesiyas na si Jesus[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Alang-alang sa pag-ibig, sa halip ay nakikiusap ako.”
    reason: lexical_alternative
  - marker: b
    text: O, “isang embahador”; ngunit mas likas na nangangahulugang “isang matandang lalaki” ang salitang Griyego.
    reason: alternative_reading
  - marker: c
    text: 'Griyego: “Cristo Jesus.” Isinalin ditong “Mesiyas na si Jesus” sapagkat ginagamit ang Χριστός bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: dahil sa pag-ibig
  rationale: Ang διά na may akusatibo ay nagpapahayag dito ng dahilan. Likas at malinaw sa makabagong Tagalog ang “dahil sa pag-ibig.”
- source_word: μᾶλλον παρακαλῶ
  choice: minabuti kong makiusap
  rationale: Ipinakikita ng μᾶλλον ang paghahambing sa maaaring pag-uutos ni Pablo sa talata 8, samantalang ang παρακαλῶ ay isang personal at mapagpakumbabang pakiusap. Magkasamang ipinahahayag ng parirala ang pagpili niyang makiusap sa halip na mag-utos.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: yamang ako'y si Pablo
  rationale: Eliptiko at medyo alanganing literal sa Griyego ang parirala. Inihahatid ng salin ang pagkilala ni Pablo sa sarili bilang taong inilalarawan ng kasunod na mga katangian, nang hindi dinaragdagan ang kahulugan.
- source_word: πρεσβύτης
  choice: isang matandang lalaki
  rationale: Karaniwang tumutukoy ang salita sa isang lalaking may edad. Iniiwasan nito ang pagpasok ng katungkulan sa iglesya o ng mas malayong pagbasa na “sugo.”
- source_word: νυνὶ δὲ καὶ
  choice: at ngayo'y … rin
  rationale: Pinananatili nito ang temporal na diin ng νυνί at ang pandagdag na bisa ng καί.
- source_word: δέσμιος
  choice: bilanggo
  rationale: Tuwiran at natural itong katumbas ng pangngalang tumutukoy sa taong nakabilanggo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Naririnig dito ang Χριστός bilang titulo. Ang “Mesiyas na si Jesus” ay mas natural sa Tagalog kaysa “Mesiyas Jesus” at pinananatili ang genitibong ugnayan sa “bilanggo.”
theological_decisions:
- issue: Kahulugan ng πρεσβύτης
  choice: matandang lalaki
  alternative: sugo; matanda o elder sa iglesya
  rationale: πρεσβύτης ang tekstong Griyego, hindi πρεσβευτής (“sugo/embahador”). Pinakamalikas dito ang kahulugang may kinalaman sa edad, hindi sa katungkulang pansimbahan.
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo, kaya “Mesiyas” ang pinili upang marinig ang titular na kahulugan nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ugnayan ng δέσμιος at Χριστοῦ Ἰησοῦ
  choice: bilanggo ng Mesiyas na si Jesus
  alternative: bilanggo dahil sa Mesiyas na si Jesus
  rationale: Pinananatili ng salin ang malawak na genitibong ugnayan sa Griyego—maaaring magpahiwatig ng pag-aari, paglilingkod, o pagkakabilanggo alang-alang sa kanya—sa halip na tahasang lutasin ito bilang sanhi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “makikiusap” na anyo sa “minabuti kong makiusap” upang ihayag ang magiliw na apela sa halip na utos. Pinanatili ang gitling-pahaba sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
