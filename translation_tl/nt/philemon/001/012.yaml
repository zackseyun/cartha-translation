  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: tl
  text: Ipinababalik ko siya sa iyo[a]—siya, ang sarili kong puso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ipinabalik ko siya sa iyo” o “Ipinadala ko siyang pabalik sa iyo.” Ang pandiwang Griyego ay nasa aorist; ang anyong pangkasalukuyan dito ay tumitingin sa kilos mula sa pananaw ni Filemon habang dumarating sa kaniya ang liham.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ang aking mga kaloob-looban”; isang idyoma para sa matinding pagmamahal o magiliw na malasakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: siya
  rationale: Ang panghalip na panlalaking isahan ay tumutukoy kay Onesimo. Likas sa modernong Tagalog ang “siya” sa ganitong ayos.
- source_word: ἀνέπεμψά
  choice: Ipinababalik ko
  rationale: Ang ἀναπέμπω ay nangangahulugang ipadala o ibalik. Bagaman aorist ang anyo, ang pangkasalukuyang “ipinababalik ko” ay angkop sa pananaw ng liham habang dumarating ito kay Filemon.
- source_word: σοι
  choice: sa iyo
  rationale: Malinaw at likas na ipinahahayag nito ang tumatanggap ng pagpapabalik.
- source_word: αὐτόν
  choice: siya na mismo
  rationale: Ang muling pagbanggit sa panghalip ay nagbibigay-diin kay Onesimo; pinananatili ito sa Tagalog sa pamamagitan ng “siya na mismo.”
- source_word: τοῦτ’ ἔστιν
  choice: na
  rationale: Sa pariralang “siya na mismong puso ko,” likas na naihahatid ng “na” ang paliwanag na appositional ng Griyegong “iyon ay,” nang hindi nagiging matigas ang pangungusap.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: puso ko
  rationale: Literal itong tumutukoy sa mga kaloob-loobang bahagi ngunit idyomatikong nagpapahayag ng matinding pagmamahal at magiliw na damdamin. Ang “puso ko” ang malinaw at natural na katumbas sa modernong Tagalog.
theological_decisions:
- issue: Metaporang antropolohikal sa σπλάγχνα
  choice: puso ko
  alternative: aking kaloob-looban; pinakamalalim kong pagmamahal
  rationale: Leksikal at idyomatikong pasiya ito, hindi paglalapat ng isang natatanging doktrina. Pinananatili ng “puso ko” ang matinding personal na pagmamahal ni Pablo at ang pagkakaugnay niya kay Onesimo, samantalang ang literal na anatomikal na salin ay maaaring makalito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang madiing pag-uulit ng panghalip sa pamamagitan ng “siya na mismo,” habang isinalin nang idyomatiko ang σπλάγχνα bilang “puso.”
