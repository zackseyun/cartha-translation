  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: tl
  text: Ngunit hindi ko ninais na gumawa ng anuman nang wala ang iyong pagsang-ayon[a], upang ang mabuti mong gagawin[b] ay hindi maging tila sapilitan, kundi kusang-loob[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang wala ang iyong pahintulot” o “nang hindi muna isinasaalang-alang ang iyong palagay.”
    reason: lexical_alternative
  - marker: b
    text: O “ang iyong kabutihan” o “ang iyong kabaitan.” Maaaring tumukoy ang Griyego sa isang mabuting kilos ni Filemon sa bagay na ito o, sa mas abstraktong diwa, sa kanyang kabutihan.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ayon sa kusang-loob”; ibig sabihin, mula sa sarili mong malayang kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: nang wala ang iyong pagsang-ayon
  rationale: Maaaring tumukoy ang γνώμη sa opinyon, pasiya, o pagsang-ayon. Sa konteksto, ang “pagsang-ayon” ang natural na pagpapahayag ng pahintulot ni Filemon nang hindi inaalis ang mas malawak na saklaw ng salita; inilagay sa talababa ang mga alternatibo.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: ayaw kong gumawa ng anuman
  rationale: Ipinahahayag ng θέλω ang pagkukusa o kagustuhan ni Pablo. Natural sa modernong Tagalog ang pariralang ito at hindi nito ipinahihiwatig ang isang pormal at tiyak na kapasiyahan.
- source_word: ἵνα μὴ
  choice: upang ... hindi
  rationale: Malinaw nitong pinananatili ang layuning ipinahahayag ng sugnay na ἵνα.
- source_word: ὡς κατὰ ἀνάγκην
  choice: parang napilitan ka
  rationale: Ipinananatili ng “parang” ang paghahambing na dala ng ὡς, habang ang “napilitan” ay likas na Tagalog para sa pagkilos dahil sa pamimilit o panggigipit.
- source_word: τὸ ἀγαθόν σου
  choice: ang mabuting gagawin mo
  rationale: Malamang na tumutukoy ito sa isang konkretong mabuting kilos ni Filemon, ngunit hindi tinutukoy ng Griyego kung ano mismo iyon. Pinananatili ng salin ang pagiging di-tiyak ng kilos; itinatala rin sa talababa ang posibleng abstraktong kahulugan.
- source_word: ᾖ
  choice: maging
  rationale: Sa sugnay na may “upang,” natural na naihahatid ng “maging” ang subjunctive at layuning diwa.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: kundi kusang-loob
  rationale: Tuwirang inilalarawan nito ang pagkilos na bukal sa sariling kalooban at malinaw na isinasalungat sa pamimilit.
theological_decisions:
- issue: Kalikasan ng tugon ni Filemon
  choice: Idiing ang malayang pagsang-ayon sa halip na pamimilit, habang iniiwang di-tiyak ang eksaktong mabuting kilos.
  alternative: Isalin ang τὸ ἀγαθόν σου bilang abstraktong “iyong kabutihan” o mas tiyak na “iyong kabaitan.”
  rationale: Ang diin ng talata ay ang kusang-loob na katangian ng tugon ni Filemon. Hindi tahasang tinutukoy ng Griyego ang eksaktong kilos, kaya hindi ito dapat pakitirin o lagyan ng doktrinal na detalye na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “pagsang-ayon,” “mabuting gagawin,” at “kusang-loob” upang maging malinaw sa ordinaryong mambabasa habang pinananatili ang leksikal na kalabuan sa pamamagitan ng mga talababa.
