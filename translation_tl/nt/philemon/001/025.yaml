  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: tl
  text: Sumainyong espiritu nawa ang biyaya ng Panginoong Jesus na Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa nakaugaliang katawagan: “Panginoong Jesu-Cristo.”'
    reason: alternative_reading
  - marker: b
    text: Pangmaramihan ang “inyong” sa Griyego; ang pangwakas na basbas ay para hindi lamang kay Filemon kundi sa lahat ng tumatanggap ng liham na nagkakatipon.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salin sa mga pangwakas na pagbati ni Pablo; ipinahahayag nito ang mapagpalang kagandahang-loob ng Diyos.
- source_word: κυρίου
  choice: Panginoon
  rationale: Pinananatili ang titulong may bigat na kristolohikal at likas sa makabagong Tagalog.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Ipinakikita ng “Mesiyas” ang titulong kahulugan ng Χριστός sa halip na tratuhin lamang itong apelyido; inilalagay sa talababa ang nakaugaliang “Jesu-Cristo.”
- source_word: μετὰ
  choice: mapasainyo
  rationale: Ang Griyego ay walang tahasang pandiwa; ang pormulang “nawa’y mapasainyo” ay natural na basbas sa Tagalog at naghahatid ng diwang “maging kasama ninyo.”
- source_word: πνεύματος
  choice: espiritu
  rationale: Maliit na titik ang ginamit sapagkat ang may-angking “inyong” ay tumutukoy sa espiritu o panloob na pagkatao ng mga tumatanggap, nang hindi tahasang ipinapakahulugang Espiritu Santo.
- source_word: ὑμῶν
  choice: inyong
  rationale: Ang panghalip ay pangmaramihan; likas itong naipahahayag ng “inyong,” at nililinaw sa talababa na higit kay Filemon ang saklaw ng basbas.
theological_decisions:
- issue: Pagpapahayag sa Χριστοῦ sa pangwakas na basbas
  choice: Mesiyas
  alternative: Cristo/Kristo
  rationale: May malinaw pa ring puwersa bilang titulo ang Χριστός. Isinalin itong “Mesiyas,” habang pinananatili sa talababa ang tradisyonal at pamilyar na “Jesu-Cristo.”
- issue: Tinutukoy ng “espiritu”
  choice: espiritu o panloob na pagkatao ng mga tumatanggap
  alternative: Espiritu Santo
  rationale: Malakas na ipinahihiwatig ng pangmaramihang “inyong” na espiritu ng mga tumatanggap ang tinutukoy. Hindi ginamit ang malaking titik upang hindi magpasok ng tiyak na doktrinal na pagbasa na hindi tahasang hinihingi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang pormulang pambasbas na “Nawa’y mapasainyo,” na bahagyang pormal ngunit malinaw at angkop sa liham. Pinanatili ang isahang “espiritu” at pangmaramihang “inyong” ayon sa Griyego.
