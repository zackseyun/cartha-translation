base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: tl
  text: Binabati ka ni Epafras, ang kapwa ko bilanggo kay Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sa Mesiyas na si Jesus”; ayon sa mas tradisyonal na pananalita, “kay Cristo Jesus.”
    reason: Nagbibigay ng mas malapit-sa-anyo na alternatibo para sa ἐν Χριστῷ Ἰησοῦ at ng tradisyonal na katumbas ng Χριστός, nang hindi ipinapataw ang isang tiyak na pagpapakahulugan.
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: Binabati
  rationale: Ang ἀσπάζομαι ay karaniwang nangangahulugang bumati o magpaabot ng pagbati. Ang “Binabati” ay maikli at natural sa modernong Tagalog.
- source_word: σε
  choice: ka
  rationale: Isahang panghalip na tumutukoy nang tuwiran kay Filemon; malinaw na naipapakita ito ng Tagalog na “ka.”
- source_word: Ἐπαφρᾶς
  choice: Epafras
  rationale: Isinalin sa karaniwang baybay-Filipino ang personal na pangalang Griyego.
- source_word: ὁ συναιχμάλωτός μου
  choice: na kapwa ko bilanggo
  rationale: Ang σύναιχμάλωτος ay isang taong nakabilanggo kasama ng iba. Natural sa Tagalog ang “kapwa ko bilanggo” at pinananatili nito ang larawan ng pagkakabilanggo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa pakikiisa sa Mesiyas na si Jesus
  rationale: Ginagawang malinaw sa natural na Tagalog ang madalas na Paulinong diwa ng ἐν bilang ugnayan o pakikiisa, nang hindi ito ginagawang sanhi gaya ng “dahil kay.” Isinalin ang Χριστός bilang titulong “Mesiyas,” samantalang pangalan ang “Jesus.”
theological_decisions:
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ kaugnay ng pagkakabilanggo
  choice: sa pakikiisa sa Mesiyas na si Jesus
  alternative: sa Mesiyas na si Jesus; kay Cristo Jesus
  rationale: Maaaring ipahiwatig ng parirala ang pagkakakilanlan at pakikiisa kay Jesus, hindi lamang na nabilanggo si Epafras “dahil sa” kaniya. Iniwasang gawing tiyak ang sanhi at pinanatili sa talababa ang mas literal at tradisyonal na mga anyo.
- issue: Pagpapahayag sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay may aktibong diwa ng titulo rito. Ang “Mesiyas” ang tuwirang katumbas, habang ang tradisyonal na “Cristo” ay nakatala bilang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at malinaw. Ginamit ang “bilanggo” sa halip na mas teknikal o lipas na salita, at “pakikiisa” upang maipahayag nang natural ang Paulinong pariralang ἐν Χριστῷ nang hindi ito ginagawang tahasang sanhi.
