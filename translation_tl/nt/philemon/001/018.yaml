  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: tl
  text: Ngunit kung may nagawa siyang mali sa iyo o may utang siya sa iyo, itala mo iyon sa aking kuwenta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “isingil mo iyon sa akin.” Ang pandiwa ay may diwang pangkuwenta: itala o i-charge ang isang halaga o pananagutan sa kuwenta ng isang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ngunit kung
  rationale: Ipinapahayag ng εἰ ang kondisyon, at ang δέ ay banayad na pagsalungat o pagpapatuloy mula sa naunang talata; natural itong naihahatid ng “Ngunit kung.”
- source_word: τι ἠδίκησέν σε
  choice: may nagawa siyang mali sa iyo
  rationale: 'Malawak ang saklaw ng ἀδικέω: paggawa ng mali o di-makatarungang bagay laban sa isang tao. Hindi nito nililimitahan ang kasalanan sa pandaraya o pinsalang materyal lamang.'
- source_word: ἢ ὀφείλει
  choice: o may utang siya sa iyo
  rationale: Ang ὀφείλω ay tumutukoy sa pagkakautang o obligasyon. Ginawang hayag ang “sa iyo,” na malinaw mula sa konteksto.
- source_word: τοῦτο
  choice: iyon
  rationale: Tinutukoy ng demonstratibo ang anumang pagkakamali o utang na kababanggit lamang; natural sa Filipino ang “iyon” bilang pagtukoy pabalik.
- source_word: ἐμοὶ ἐλλόγα
  choice: singilin mo sa akin
  rationale: Ang ἐλλογέω ay terminong pangkuwenta na nangangahulugang itala o ipataw sa kuwenta ng isang tao. Ang “singilin mo sa akin” ay malinaw at natural habang pinananatili ang larawan ng pananagutang pinansiyal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatiling malawak ang posibleng “mali” at ang hiwalay na pagbanggit sa utang, habang natural na inihahatid ang metaporang pangkuwenta.
