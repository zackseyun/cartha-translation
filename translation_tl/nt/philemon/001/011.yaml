translation:
  language: tl
  text: na dati'y walang pakinabang sa iyo[a], ngunit ngayo'y kapaki-pakinabang kapwa sa iyo at sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na pinaglalaruan dito ni Pablo ang pangalang Onesimo, na kaugnay ng kahulugang “kapaki-pakinabang” o “mapapakinabangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: na
  rationale: Ipinagpapatuloy ng pariralang ito ang pagtukoy kay Onesimo sa naunang talata; ang pang-ugnay na “na” ang likas na paraan sa Tagalog upang buuin ang kaugnay na sugnay.
- source_word: ποτέ
  choice: dati'y
  rationale: Malinaw at maikli nitong ipinahahayag ang nakaraang kalagayan bilang katapat ng νυνί (“ngayon”).
- source_word: σοι
  choice: sa iyo
  rationale: Pinananatili ang personal na ugnayang ipinahahayag ng datibo.
- source_word: ἄχρηστον
  choice: walang pakinabang
  rationale: Likas na modernong Tagalog para sa ‘hindi kapaki-pakinabang’ at malinaw na kabaligtaran ng εὔχρηστον.
- source_word: νυνὶ δὲ
  choice: ngunit ngayo'y
  rationale: Pinananatili ang mariing pagsalungat ng dating kalagayan at ng kasalukuyan.
- source_word: σοὶ καὶ ἐμοὶ
  choice: sa ating dalawa—sa iyo at sa akin
  rationale: Ang “sa ating dalawa” ay likas na nagsasaad ng paired construction, samantalang ang kasunod na paglilinaw ay tahasang pinananatili ang dalawang datibo.
- source_word: εὔχρηστον
  choice: kapaki-pakinabang
  rationale: Tumpak at dignified na katumbas na nagpapanatili sa tuwirang contrast sa ἄχρηστον at sa posibleng paglalaro sa pangalan ni Onesimo.
theological_decisions:
- issue: Posibleng paglalaro sa pangalang Onesimo at pagbabago ng kaniyang kalagayan
  choice: Panatilihin sa pangunahing teksto ang tuwirang contrast na “walang pakinabang” at “kapaki-pakinabang.”
  alternative: Gawing mas tahasang interpretatibo ang biro sa pangalan, gaya ng “dati'y hindi naging tunay na Onesimo, ngunit ngayo'y kapaki-pakinabang.”
  rationale: Sapat nang ipinakikita ng Griyego ang contrast; ang paliwanag sa posibleng wordplay ay mas angkop sa talababa upang maiwasan ang pagdaragdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang magkatapat na “walang pakinabang” at “kapaki-pakinabang” upang mapanatili ang retorikal na contrast at ang posibleng wordplay. Ang elisyong “dati’y/ngayo’y” ay karaniwang anyong pampanitikan at madaling maunawaan.
