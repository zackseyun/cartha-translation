  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: tl
  text: Lagi akong nagpapasalamat sa aking Diyos habang binabanggit kita sa aking mga panalangin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang inaalaala kita sa aking mga panalangin.” Mas literal sa Griyego ang “habang binabanggit kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: nagpapasalamat ako
  rationale: Ang pangkasalukuyang pandiwa ay likas na isinasalin sa Filipino bilang “nagpapasalamat ako,” na nagpapanatili sa tuwirang kilos ng pasasalamat.
- source_word: τῷ θεῷ μου
  choice: sa aking Diyos
  rationale: Ang datibo ang tumutukoy sa pinatutungkulan ng pasasalamat; malinaw at likas sa Filipino ang “sa aking Diyos,” at pinananatili ang personal na panghalip na “aking.”
- source_word: πάντοτε
  choice: lagi
  rationale: Ang “lagi” ay karaniwan, malinaw, at sapat na nagpapahayag ng palagiang gawi sa pormulang ito ng pasasalamat.
- source_word: μνείαν σου ποιούμενος
  choice: habang binabanggit kita
  rationale: Pinananatili nito ang literal na diwa ng idyomang “gumagawa ng pagbanggit sa iyo” sa natural na Filipino at ipinakikitang kasabay ito ng pangunahing pandiwa.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: sa aking mga panalangin
  rationale: Sa idyomang ito, ang ἐπί na may genitive ay tumutukoy sa pagkakataon o konteksto ng pananalangin; natural itong maipahayag bilang “sa aking mga panalangin.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “binabanggit kita” upang mapanatili ang konkretong diwa ng Griyegong parirala, habang inilalagay sa talababa ang mas malayang “inaalaala kita.”
