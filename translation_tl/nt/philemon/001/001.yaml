  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: tl
  text: 'Mula kay Pablo, isang bilanggo ni Mesiyas na si Jesus[a][b], at kay Timoteo na kapatid natin—para kay Filemon, na minamahal namin at aming kamanggagawa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bilanggo dahil sa Mesiyas na si Jesus.” Maaaring ipahiwatig ng anyong Griego ang kaugnayan niya sa Mesiyas o ang dahilan ng kanyang pagkabilanggo.
    reason: alternative_reading
  - marker: b
    text: 'Griego: Christos, na maaari ring isaling “Cristo.” “Mesiyas” ang ginamit dito sapagkat titulo ang kahulugan nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong saling Filipino.
- source_word: δέσμιος
  choice: isang bilanggo
  rationale: Tuwirang ipinahahayag ng salita ang kalagayan ng isang taong nakagapos o nakabilanggo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinalin ang Χριστός bilang titulong “Mesiyas” at pinanatili ang siksik na ugnayang ipinahahayag ng genitive, sa halip na agad itong gawing “dahil kay.”
- source_word: Τιμόθεος ὁ ἀδελφὸς
  choice: Timoteo na kapatid natin
  rationale: Natural sa Filipino ang “kapatid natin” para sa relasyong pampananampalataya na ipinahihiwatig ng parirala.
- source_word: Φιλήμονι
  choice: para kay Filemon
  rationale: Ang datibong tumutukoy sa tatanggap ng liham ay likas na ipinahahayag sa Filipino sa pamamagitan ng “para kay.”
- source_word: τῷ ἀγαπητῷ
  choice: na minamahal namin
  rationale: Pinananatili ang init ng pagmamahal sa orihinal at ang pangmaramihang ἡμῶν.
- source_word: συνεργῷ ἡμῶν
  choice: aming kamanggagawa
  rationale: Ang “kamanggagawa” ay malinaw at natural na katumbas ng taong kasama sa gawain; pinananatili ng “aming” ang pangmaramihang panghalip.
theological_decisions:
- issue: Kahulugan ng genitive sa δέσμιος Χριστοῦ Ἰησοῦ
  choice: bilanggo ng Mesiyas na si Jesus
  alternative: bilanggo dahil sa Mesiyas na si Jesus
  rationale: Hindi tahasang nilulutas ng pangunahing teksto kung ang genitive ay pangunahing nagsasaad ng kaugnayan o ng dahilan ng pagkabilanggo; inilalahad sa talababa ang mas tahasang pagbasa tungkol sa dahilan.
- issue: Pagsasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay nananatiling makabuluhan ang Χριστός bilang titulo, kaya “Mesiyas” ang ginamit sa halip na tratuhin itong parang apelyido o bahagi lamang ng pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang anyong pambungad-liham na “Mula kay … para kay …” at ang gitling upang mapanatili ang iisang pangungusap ng salaming Griego nang hindi nagiging mabigat basahin.
