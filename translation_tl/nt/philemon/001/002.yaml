  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: tl
  text: 'at kay Afia, na kapatid na babae, at kay Arquipo, na kapwa naming kawal, at sa iglesiang nasa iyong bahay:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Afia
  rationale: Isinalin sa baybay na madaling basahin at bigkasin sa modernong Filipino ang personal na pangalang Griyego.
- source_word: ἀδελφῇ
  choice: kapatid
  rationale: Tuwirang katumbas ng pangngalan; sa Filipino, likas na hindi tinutukoy ng salitang “kapatid” ang kasarian, ngunit malinaw na babae si Afia mula sa pangalan at anyong Griyego. Hindi idinagdag sa pangunahing teksto ang “naming” sapagkat wala ang ἡμῶν sa SBLGNT.
- source_word: Ἀρχίππῳ
  choice: Arquipo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng biblikal na pangalan, na malinaw at madaling bigkasin.
- source_word: συστρατιώτῃ ἡμῶν
  choice: kapwa naming kawal
  rationale: Pinananatili ang metaporang militar at malinaw na isinasama ang ἡμῶν; natural ang ayos na ito sa Filipino.
- source_word: ἐκκλησίᾳ
  choice: iglesia
  rationale: Karaniwan at matatag na tawag sa Filipino para sa nagtitipong pamayanang Kristiyano; hindi nito labis na ipinapaliwanag ang anyo o organisasyon ng pagtitipon.
- source_word: κατ’ οἶκόν σου
  choice: nasa iyong bahay
  rationale: Malapit sa Griyego at likas sa Filipino. Hindi idinagdag ang “nagpupulong” upang hindi gawing tahasan ang ipinahihiwatig lamang ng lokatibong parirala.
- source_word: καὶ
  choice: at / kay / sa
  rationale: Pinanatili ang additive na daloy sa pamamagitan ng “at,” habang ang mga datibo ay natural na ipinahayag sa mga pang-ukol na “kay” at “sa.”
theological_decisions:
- issue: Kung idaragdag ang panghalip na paari sa ἀδελφῇ
  choice: “kapatid” sa pangunahing teksto
  alternative: “kapatid naming” ayon sa ilang manuskrito
  rationale: Ang ibinigay na SBLGNT ay may τῇ ἀδελφῇ at walang ἡμῶν. Sinusunod ng pangunahing salin ang tekstong iyon, habang itinatala sa talababa ang tunay na variant ng manuskrito.
- issue: Kung lilinawin na ang iglesia ay nagpupulong sa bahay
  choice: “iglesiang nasa iyong bahay”
  alternative: “iglesiang nagpupulong sa iyong bahay”
  rationale: Ang κατ’ οἶκόν σου ay tumutukoy sa iglesiang nasa bahay, ngunit hindi tahasang ginagamit ang pandiwang “magpulong.” Pinananatili ng salin ang bahagyang pagiging implicit ng orihinal.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang serye ng mga binabati, ang metaporang militar, at ang di-tahasang paglalarawan sa iglesiang nasa bahay. Ginamit ang “iyong” sa halip na “mong” upang maging malinaw at angkop sa pormal na pagbati.
