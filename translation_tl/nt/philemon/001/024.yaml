  text: Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: tl
  text: Sina Marcos, Aristarco, Demas, at Lucas, na mga kamanggagawa ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: Marcos
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa makabagong saling Tagalog, sa halip na tuwirang transliterasyong “Markos.”
- source_word: Ἀρίσταρχος
  choice: Aristarco
  rationale: Ginamit ang nakaugaliang anyo sa Tagalog ng pangalang Griyego, na malinaw at madaling bigkasin para sa karaniwang mambabasa.
- source_word: Δημᾶς
  choice: Demas
  rationale: Tuwirang transliterasyon ng personal na pangalan ayon sa karaniwang anyo nito sa Tagalog.
- source_word: Λουκᾶς
  choice: Lucas
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: οἱ συνεργοί
  choice: mga kamanggagawa
  rationale: Ipinahahayag ng συνεργοί ang mga taong gumagawang kasama ng iba. Likas sa Tagalog ang “mga kamanggagawa” at pinananatili nito ang diwa ng magkatuwang na paglilingkod o paggawa nang hindi nililimitahan ang uri ng gawain.
- source_word: μου
  choice: ko
  rationale: 'Ang panghalip na nasa genitive ay nagpapahayag ng kaugnayan kay Pablo: ang mga binanggit ay kanyang mga kamanggagawa.'
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Sina” upang ipakilala ang talaan ng mga pangalan, at ang pariralang “na mga kamanggagawa ko” bilang malinaw na paglalarawan sa buong pangkat.
