id: PHM.1.5
reference: Philemon 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: tl
  text: sapagkat nababalitaan ko ang iyong pag-ibig at pananampalataya na taglay mo sa Panginoong Jesus at para sa lahat ng mga banal.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasang ayon sa diwa: “ang iyong pananampalataya sa Panginoong Jesus at ang iyong pag-ibig para sa lahat ng mga banal.”'
    reason: alternative_reading
  - marker: b
    text: O “katapatan na taglay mo.” Ang salitang Griyego ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan.
    reason: lexical_alternative
  - marker: c
    text: O “ang iyong pag-ibig at ang pananampalatayang taglay mo.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: sapagkat nababalitaan ko
  rationale: Ang participle ay nakaugnay sa naunang pagpapasalamat at may dahilang diwa. Ang “nababalitaan ko” ay natural sa Tagalog at pinananatili ang diwa ng patuloy na pagkarinig ng mga ulat.
- source_word: ἀγάπην
  choice: pag-ibig
  rationale: Ito ang karaniwan at malinaw na katumbas ng ἀγάπη.
- source_word: πίστιν
  choice: pananampalataya
  rationale: Ito ang pangunahing katumbas ng πίστις sa proyekto. Ang posibleng diwang “katapatan” ay inilagay sa talababa upang hindi mawala ang leksikal na lawak.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: sa Panginoong Jesus
  rationale: Sa natural na Tagalog, ang “sa” ay nagpapahayag ng pagkatuon o kaugnayan kay Jesus nang hindi pilit ang literal na “patungo sa.” Nananatiling naiiba ito sa “para sa” sa kasunod na parirala.
- source_word: κύριον
  choice: Panginoon
  rationale: Ito ang nakaugaliang salin ng titulong kristolohikal na κύριος.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: para sa lahat ng mga banal
  rationale: Ang “para sa” ay natural na nagpapahayag ng pag-ibig na nakatuon sa kapuwa mananampalataya, habang sinusunod ang pagkakaiba ng pang-ukol sa naunang parirala.
- source_word: ἁγίους
  choice: mga banal
  rationale: Maikli at tradisyonal itong katawagan sa mga kabilang sa sambayanan ng Diyos; hindi nito idinaragdag ang paliwanag na wala sa mismong salita.
theological_decisions:
- issue: Kaugnayan ng “pag-ibig” at “pananampalataya” sa dalawang pariralang sumusunod
  choice: 'Pinanatili sa pangunahing teksto ang ayos at ambiguwidad ng Griyego: kapuwa nauuna ang “pag-ibig at pananampalataya,” saka sumusunod ang “sa Panginoong Jesus at para sa lahat ng mga banal.”'
  alternative: Maaaring ipaliwanag ang diwa bilang “ang iyong pananampalataya sa Panginoong Jesus at ang iyong pag-ibig para sa lahat ng mga banal.”
  rationale: Malamang na distributibo ang kahulugan—pananampalataya kay Jesus at pag-ibig sa mga banal—ngunit hindi ito tahasang ipinamahagi ng sintaks ng Griyego. Kaya hindi ito tahimik na nilutas sa pangunahing teksto.
- issue: Saklaw ng kahulugan ng πίστις
  choice: pananampalataya
  alternative: katapatan
  rationale: Ang πίστις ay maaaring tumukoy sa pananampalataya, pagtitiwala, o katapatan. Pinanatili ang pangunahing katumbas at inilagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nababalitaan ko” sa halip na mas literal ngunit di-likas na “naririnig ko tungkol sa,” at pinanatili ang tradisyonal na “mga banal.”
