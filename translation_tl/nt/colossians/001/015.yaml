  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: tl
  text: Siya ang larawan ng di-nakikitang Diyos, ang panganay ng buong sangnilikha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “panganay” ay maaari ring magpahiwatig ng pinakamataas na katayuan at karapatan sa mana, hindi lamang ng pagkakasunod sa kapanganakan. Sa mga kasunod na talata, sinasabing ang lahat ng bagay ay nilikha sa pamamagitan niya at para sa kanya.
    reason: Nililinaw ang isang posibleng kahulugan ng “panganay” batay sa agarang konteksto, nang hindi pinapalitan sa pangunahing teksto ang talinghaga o nilulutas ang pinagtatalunang saklaw ng parirala.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Siya ang
  rationale: Tumutukoy ang panghalip sa Anak sa naunang talata. Likas sa makabagong Tagalog ang “Siya ang” bilang simula ng paglalarawang ito.
- source_word: εἰκὼν
  choice: larawan
  rationale: Pinananatili ng “larawan” ang ideya ng representasyon at paghahayag nang hindi dinaragdagan ang pahayag ng teksto.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: ng Diyos na hindi nakikita
  rationale: Natural at malinaw itong katumbas ng pariralang Griyego at pinananatili ang diin na ang Diyos ay di-nakikita.
- source_word: πρωτότοκος
  choice: panganay
  rationale: Ang “panganay” ang karaniwang katumbas na nagpapanatili sa talinghaga ng katayuan, karapatan sa mana, at pagkakasunud-sunod, sa halip na palitan ito ng interpretatibong salitang gaya ng “kataas-taasan.”
- source_word: πάσης κτίσεως
  choice: sa lahat ng nilikha
  rationale: Ang “sa” ay likas na kaakibat ng “panganay” sa Tagalog at hindi tahasang nagpapasiya kung ang genitibo ay nagpapahayag ng pagkabilang o ng kaugnayan at pamumuno. Ipinaliliwanag sa talababa ang mahalagang kontekstuwal na diwa.
theological_decisions:
- issue: Ang kahulugan ng πρωτότοκος πάσης κτίσεως kaugnay ng Anak at ng sangnilikha
  choice: ang panganay sa lahat ng nilikha
  alternative: ang panganay na namumuno sa buong sangnilikha
  rationale: Pinananatili ng pangunahing salin ang anyo at tunay na tensiyon ng Griyego sa halip na isingit sa teksto ang “namumuno.” Gayunman, ipinahihiwatig ng konteksto sa mga kasunod na talata na ang “panganay” ay tumutukoy sa kataasan ng katayuan at karapatan sa mana, hindi sa pagiging bahagi ng mga nilalang; inilalahad ito sa talababa nang hindi binabago ang mismong talinghaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Diyos na hindi nakikita” sa halip na mas pormal na “di-nakikitang Diyos,” at “lahat ng nilikha” upang madaling maunawaan ng karaniwang mambabasa.
