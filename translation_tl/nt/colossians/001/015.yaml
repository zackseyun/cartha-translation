  source_fidelity: Ang "Siya ang larawan" ay tapat sa ὅς ἐστιν εἰκών, at ang "di-nakikitang Diyos" ay wastong katumbas ng τοῦ θεοῦ τοῦ ἀοράτου. Gayunman, ang "panganay sa lahat ng nilikha" ay hindi ang pinakanatural na paraan upang katawanin ang genitibong πάσης κτίσεως at maaaring magmukhang isang lokatibong "sa/among" na pagpapakahulugan. Ang "panganay ng buong sangnilikha" ay mas tuwirang tumutugon sa Griyego habang pinananatili ang pinagtatalunang saklaw ng parirala.
  naturalness: Mas likas at matalinghaga sa makabagong Filipino ang "di-nakikitang Diyos" kaysa "Diyos na hindi nakikita" sa ganitong marangal na paglalarawang pampanitikan. Ang "buong sangnilikha" ay mas idiomatiko at mas angkop sa κτίσις kaysa "lahat ng nilikha" kasunod ng "panganay."
  terminology: Ang "larawan," "Diyos," "panganay," at "sangnilikha" ay angkop at pare-pareho sa rehistrong biblikal ngunit nauunawaan pa rin sa modernong Filipino. Hindi dapat palitan ang "panganay" ng "pinakamataas" o "namumuno," sapagkat ipaliliwanag na iyon sa halip na isasalin ang πρωτότοκος.
