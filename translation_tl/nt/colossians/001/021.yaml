  source_fidelity: Ang “na gumagawa ng masasama” ay nagdaragdag ng isang tahasang pandiwang participial na wala sa Griyego at maaaring gawing pangunahing paglalarawan ang paggawa, sa halip na panatilihin ang masinsing ugnayan ng ἐν τοῖς ἔργοις τοῖς πονηροῖς. Ang “napalayo” ay katanggap-tanggap ngunit mas mahina kaysa sa ἀπηλλοτριωμένους, na nagsasaad ng kalagayan ng pagkakahiwalay/kaaliena. Ang rebisyon ay mas malapit sa parehong ideya nang hindi ipinipilit na sanhi ang masasamang gawa.
  naturalness: Likas ang “At kayo rin” bilang pagpapatuloy ng naunang pangungusap. Ang “hiwalay” at “may pagkapoot sa inyong pag-iisip” ay malinaw sa modernong Filipino. Ang hulíng “sa inyong masasamang gawa” ay sadyang maigsi upang mapanatili ang masinsing, hindi ganap na tinutukoy na ugnayan ng Griyego.
  terminology: Ginamit ang “hiwalay” para sa kalagayan ng pagkakahiwalay at “pagkapoot” para sa panloob na pagiging kaaway/hostile. Hindi idinagdag ang “dahil sa” o “sa pamamagitan ng,” sapagkat hindi dapat lutasin nang sapilitan ang saklaw ng ἐν.
  issues:
