id: COL.1.21
reference: Colossians 1:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: tl
  text: At kayo rin[a]—na dati’y hiwalay at may pagkapoot sa inyong pag-iisip, sa inyong masasamang gawa—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mga kaaway sa pag-iisip sa masasamang gawa.” Masinsin ang pariralang Griyego; maaaring ilarawan ng “sa inyong masasamang gawa” ang larangan o pagpapahayag ng kanilang pagkapoot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: At kayo naman
  rationale: Ipinagpapatuloy nito ang pangungusap mula sa naunang talata at itinatampok na kabilang ang mga mambabasa sa tinatalakay. Nananatili ang anyong bitin dahil nagpapatuloy ang kaisipan sa kasunod na talata.
- source_word: ποτε
  choice: dati’y
  rationale: Likas at maikli itong panandang temporal para sa dati nilang kalagayan, na ikinukumpara sa kasalukuyang kalagayan sa kasunod na talata.
- source_word: ὄντας
  choice: na dati’y
  rationale: Isinalin ang participle bilang sugnay na panlarawan, na mas natural sa modernong Tagalog kaysa sa tahasang paggaya sa kayariang Griyego.
- source_word: ἀπηλλοτριωμένους
  choice: napalayo
  rationale: Ipinahahayag nito ang kalagayan ng pagkakahiwalay o pagkakalayo nang hindi tahasang nagdaragdag ng bagay na hindi binanggit sa talata.
- source_word: ἐχθροὺς
  choice: may pagkapoot
  rationale: Sa pagkakaugnay nito sa τῇ διανοίᾳ, natural nitong inilalarawan ang mapanlabang kalooban o saloobin, sa halip na ang alanganing literal na 'mga kaaway sa isip.'
- source_word: τῇ διανοίᾳ
  choice: sa inyong isip
  rationale: Ipinakikita ng parirala ang larangan o aspeto ng pagkapoot. Nilinaw ng 'inyong' ang likas na kaugnayan nito sa mga kinakausap.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: na gumagawa ng masasama
  rationale: Natural na Tagalog itong paglalahad sa masinsing pariralang Griyego at pinananatiling magkaugnay ang panloob na pagkapoot at masamang asal nang hindi tahasang sinasabing sanhi ang isa ng isa.
- source_word: ἔργοις
  choice: gumagawa
  rationale: Ang pandiwang anyo ay mas karaniwan at malinaw sa Tagalog sa kontekstong ito kaysa sa abstraktong 'mga gawa.'
- source_word: πονηροῖς
  choice: masasama
  rationale: Direkta at pangkaraniwang salin ito na nagpapanatili sa moral na bigat ng salita.
theological_decisions:
- issue: Ugnayan ng pagkapoot sa isip at masasamang gawa
  choice: 'Inilahad bilang magkaugnay na panloob na saloobin at panlabas na asal: ''may pagkapoot sa inyong isip, na gumagawa ng masasama.'''
  alternative: '''mga kaaway sa isip sa masasamang gawa''; o ''may pagkapoot sa isip dahil sa masasamang gawa'''
  rationale: Maaaring tumukoy ang ἐν sa larangan, pagpapahayag, o kaugnayan ng pagkapoot sa masasamang gawa. Hindi tahasang ginawang sanhi ang masasamang gawa upang mapanatili ang pagiging masinsin at bahagyang malabo ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na likas ngunit marangal. Pinanatili ang gitling sa hulihan sapagkat nagpapatuloy ang pangungusap sa talata 22; iniwasan ang mga terminong may di-kinakailangang denominasyonal na pahiwatig.
