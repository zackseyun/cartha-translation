base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: tl
  text: Siya ang aming ipinapahayag; binabalaan namin ang bawat tao at tinuturuan ang bawat tao nang may buong karunungan, upang maiharap namin ang bawat tao na ganap kay Cristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν
  choice: Siya
  rationale: Tumutukoy ito kay Cristo sa naunang talata; pinananatili ng panghalip ang diin sa kaniya bilang ipinapahayag.
- source_word: καταγγέλλομεν
  choice: ipinapahayag namin
  rationale: Likas at marangal na salin para sa hayagang pagpapahayag o paghahayag ng mensahe.
- source_word: νουθετοῦντες
  choice: Binabalaan namin
  rationale: Saklaw ng pandiwa ang seryosong pagpapaalala o babalang naglalayong ituwid ang isip at asal; tumutugma rin ito sa konteksto ng pagtuturo.
- source_word: πάντα ἄνθρωπον
  choice: ang bawat tao
  rationale: Inuulit nang tatlong beses upang mapanatili ang retorikal na diin ng Griyego sa bawat indibidwal.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: nang may buong karunungan
  rationale: Ipinahahayag ang paraan o katangiang taglay ng pagbababala at pagtuturo; natural ito sa modernong Tagalog.
- source_word: παραστήσωμεν
  choice: maiharap namin
  rationale: Pinananatili ang larawan ng pagdadala o paghaharap ng isang tao sa harap ng iba, na hindi tinutukoy nang tahasan sa talata.
- source_word: τέλειον
  choice: ganap
  rationale: Maaaring mangahulugang ganap, buo, o may sapat na gulang. Ang 'ganap' ay maikli at pinananatili ang teolohikal na lawak nang hindi ito nililimitahan sa edad o simpleng moral na kasakdalan.
- source_word: ἐν Χριστῷ
  choice: kay Cristo
  rationale: Karaniwang natural na salin sa Tagalog ng relasyonal o saklaw na diwa ng pagiging 'in Christ,' nang hindi nagpapasok ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Kahulugan ng τέλειον
  choice: ganap
  alternative: may sapat na gulang / ώ成熟 kay Cristo
  rationale: Ang Griyego ay may tensiyon sa pagitan ng pagiging buo, ganap, at ώ成熟. Pinili ang 'ganap' upang mapanatili ang malawak na kahulugan at maiwasang gawing pisikal o pang-edad lamang ang paglago.
- issue: Pag-uugnay ng ἐν Χριστῷ
  choice: kay Cristo
  alternative: sa loob ni Cristo / kaisa ni Cristo
  rationale: Hindi tahasang nililinaw ng teksto kung lokatibo, relasyonal, o soteriolohikal ang pangunahing diin. Ang 'kay Cristo' ay natural at hindi labis na nagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Hinati sa dalawang pangungusap para sa likas na daloy, ngunit pinanatili ang tatlong ulit na 'bawat tao' bilang mahalagang retorikal na diin ng orihinal.
