translation:
  language: tl
  text: Sa kanya, mayroon tayong katubusan[a], ang kapatawaran ng mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin bilang “pagpapalaya” ang kapwa “katubusan” at “kapatawaran”; malamang na ginagamit dito ni Pablo ang “kapatawaran ng mga kasalanan” upang tukuyin kung ano ang nilalaman ng katubusang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Ang panlalaking panghalip ay tumutukoy sa minamahal na Anak sa naunang talata. Pinananatili ng “sa kanya” ang personal at ugnayang diwa ng Griyegong parirala nang hindi ito ginagawang tahasang instrumental na “sa pamamagitan niya.”
- source_word: ἔχομεν
  choice: mayroon tayong
  rationale: Tuwirang ipinapahayag ng pangkasalukuyang pandiwa na taglay na natin ngayon ang binanggit na pagpapala.
- source_word: ἀπολύτρωσιν
  choice: katubusan
  rationale: Ang “katubusan” ang kinikilalang terminong biblikal na nagpapahiwatig ng pagpapalaya na may halagang kabayaran, habang hindi nililimitahan ang salita sa payak na “paglaya.”
- source_word: ἄφεσιν
  choice: kapatawaran
  rationale: Sa konteksto ng mga kasalanan, malinaw at natural na katumbas ang “kapatawaran.” Nakatayo ito bilang paglilinaw sa “katubusan.”
- source_word: τῶν ἁμαρτιῶν
  choice: ng mga kasalanan
  rationale: Likas sa modernong Tagalog ang pariralang ito upang tukuyin ang mga kasalanan bilang layon ng kapatawaran.
theological_decisions:
- issue: Ugnayan ng “katubusan” at “kapatawaran ng mga kasalanan”
  choice: 'Pinanatili ang magkatabing pariralang nagpapaliwanag: “katubusan, ang kapatawaran ng mga kasalanan.”'
  alternative: “katubusan, ibig sabihin, ang kapatawaran ng mga kasalanan”
  rationale: Magkasingtukoy ang dalawang pariralang pangngalan sa Griyego. Pinananatili ng salin ang ugnayang ito nang hindi nagdaragdag ng tahasang paliwanag na “ibig sabihin,” kaya hindi nito isinasara ang saklaw ng “katubusan” nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “mayroon tayong” upang manatiling malapit sa anyong pangngalan at sa pandiwang ἔχομεν; bahagya itong mas pormal kaysa “taglay natin” ngunit madaling maunawaan.
