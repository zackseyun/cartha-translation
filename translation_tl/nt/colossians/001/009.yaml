  to: Dahil dito, mula noong araw na narinig namin ito, kami rin ay hindi tumitigil sa pananalangin para sa inyo at paghiling na mapuspos kayo ng kaalaman[a] sa kanyang kalooban, kalakip ang buong karunungan at pang-unawang espirituwal[b].
  rationale: Itinuwid ang temporal na pandiwa upang malinaw na tumukoy sa araw ng nakaraang pagkarinig, gaya ng aorist na ἠκούσαμεν. Pinagaan ang paralelismo ng “pananalangin” at “paghiling.” Walang binagong kahulugang teolohikal, at pinanatili ang mga talababa at ang sinadyang pagiging bukas ng “espirituwal.”
