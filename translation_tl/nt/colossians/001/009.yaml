id: COL.1.9
reference: Colossians 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: tl
  text: Dahil dito, mula noong araw na narinig namin ito, kami rin ay hindi tumitigil sa pananalangin para sa inyo at paghiling na mapuspos kayo ng kaalaman[a] sa kanyang kalooban, kalakip ang buong karunungan at pang-unawang espirituwal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubos na kaalaman” o “mas malalim na kaalaman.” Maaaring taglay ng salitang Griyego ang diwa ng higit na ganap o malalim na pagkakilala.
    reason: lexical_alternative
  - marker: b
    text: Ang “espirituwal” ay maaaring mangahulugang espirituwal ang katangian o na ito ay kaloob ng Espiritu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na ipinahahayag sa Tagalog ang sanhi at pagbabalik-tanaw sa naunang ulat tungkol sa pananampalataya at pag-ibig ng mga taga-Colosas.
- source_word: καὶ ἡμεῖς
  choice: kami rin
  rationale: Pinananatili ang diin sa pagsama nina Pablo at ng kanyang mga kasama sa tugong inilalarawan.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: mula noong araw na marinig namin ito
  rationale: Tinutukoy ang simula ng nagpapatuloy na pananalangin. Ang “ito” ay likas na pantukoy sa Tagalog sa naunang balita, nang hindi dinaragdagan ang nilalaman nito.
- source_word: οὐ παυόμεθα
  choice: hindi tumitigil
  rationale: Ipinahahayag ang nagpapatuloy na kilos mula noon hanggang sa kasalukuyan.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Karaniwan at malinaw na pananalita para sa panalanging ukol sa kapakanan ng iba.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: sa pananalangin para sa inyo at sa paghiling
  rationale: Pinananatiling magkahiwalay ngunit magkaugnay ang pangkalahatang pananalangin at ang tiyak na paghiling.
- source_word: ἵνα πληρωθῆτε
  choice: na mapuspos kayo
  rationale: Pinananatili ang larawan ng pagiging ganap na puno at ang balintiyak na anyo, na hindi tahasang pinapangalanan ang Diyos bilang gumagawa.
- source_word: τὴν ἐπίγνωσιν
  choice: ng kaalaman
  rationale: Malinaw at likas sa Tagalog; hindi ginagawang tiyak sa pangunahing teksto ang posibleng pinatinding diwang “lubos na kaalaman.”
- source_word: τοῦ θελήματος αὐτοῦ
  choice: sa kanyang kalooban
  rationale: Tuwirang katumbas na likas sa makabagong wikang panrelihiyon.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: kalakip ang buong karunungan at pang-unawang espirituwal
  rationale: Ang “kalakip” ay nagpapahayag ng kasamang paraan o kalagayan; ang hulíng “espirituwal” ay maaaring tumukoy kapwa sa karunungan at pang-unawa, gaya ng masinsing Griyegong parirala.
- source_word: σοφίᾳ
  choice: karunungan
  rationale: Karaniwang katumbas na sumasaklaw sa wastong paghatol at praktikal na paggamit ng nalalaman.
- source_word: συνέσει
  choice: pang-unawa
  rationale: Malinaw na tumutukoy sa kakayahang umunawa at bumakas ng mga kaugnayan; natural itong kaakibat ng “karunungan.”
theological_decisions:
- issue: Lakas o antas ng kahulugan ng ἐπίγνωσις
  choice: kaalaman
  alternative: lubos na kaalaman; mas malalim na kaalaman
  rationale: Maaaring may pinatinding diwa ang salita, ngunit hindi iyon kailangang tahasang ilagay sa pangunahing teksto. Pinananatili sa talababa ang tunay na leksikal na posibilidad.
- issue: Saklaw at pinagmulan ng πνευματικῇ
  choice: espirituwal, na maaaring maglarawan kapwa sa karunungan at pang-unawa
  alternative: karunungan at pang-unawang kaloob ng Espiritu
  rationale: Maaaring tumukoy ang pang-uri sa katangiang espirituwal o sa pinagmumulang Banal na Espiritu. Hindi tahasang nilulutas ng Griyego ang tanong, kaya pinananatiling bukas ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masinsing daloy ng iisang pangungusap at ang pagkakaiba ng pananalangin at paghiling, habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
