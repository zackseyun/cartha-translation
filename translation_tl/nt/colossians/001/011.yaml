  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: tl
  text: na pinalalakas sa pamamagitan ng bawat kapangyarihan, ayon sa lakas ng kanyang kaluwalhatian[a], upang magtiis at magtimpi sa lahat ng pagkakataon nang may kagalakan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanyang maluwalhating kapangyarihan.” Mas literal sa Griyego ang “ayon sa lakas ng kanyang kaluwalhatian.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring iugnay ang “nang may kagalakan” sa “nagpapasalamat” sa talata 12: “habang may kagalakang nagpapasalamat.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: na pinalalakas nang buong kapangyarihan
  rationale: Ipinananatili ng “pinalalakas” ang patuloy at pasibong diwa ng participle, na ang Diyos ang ipinahihiwatig na gumagawa. Ang “nang buong kapangyarihan” ay natural sa Tagalog at naghahayag ng ganap na saklaw ng pagpapalakas.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: ayon sa lakas ng kanyang kaluwalhatian
  rationale: Ang “ayon sa” ay nagpapakita ng pamantayan o sukat ng pagpapalakas. Pinananatili ng “lakas ng kanyang kaluwalhatian” ang genitive na anyo at ang siksik na pananalita ng Griyego, sa halip na agad itong gawing pang-uring “maluwalhating kapangyarihan.”
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: upang lubos kayong makapagtiis at makapagtiyaga
  rationale: Ipinahahayag ng “upang” ang layunin o bunga ng εἰς. Ginawang mga pandiwa ang dalawang abstraktong pangngalan upang maging natural sa modernong Tagalog, habang pinananatili ang dalawang magkaugnay ngunit bahagyang magkaibang ideya ng matatag na pagtitiis at matiyagang pagtitimpi.
- source_word: μετὰ χαρᾶς
  choice: nang may kagalakan
  rationale: Pinananatili nito ang pangngalang χαρά at hindi nito labis na nililinaw kung ang parirala ay nakakabit sa pagtitiis sa talatang ito o sa pagpapasalamat sa kasunod na talata.
theological_decisions:
- issue: Kaugnayan ng pagpapalakas sa kaluwalhatian ng Diyos
  choice: “ayon sa lakas ng kanyang kaluwalhatian”
  alternative: “ayon sa kanyang maluwalhating kapangyarihan”
  rationale: Pinananatili ng pangunahing teksto ang di-pangkaraniwang genitive na pahayag ng Griyego at hindi ginagawang paliwanag o tiyak na doktrinal na paraphrase ang ugnayan ng lakas at kaluwalhatian.
- issue: Pagkakabit ng “nang may kagalakan”
  choice: Inilagay pagkatapos ng pagtitiis at pagtitiyaga ngunit minarkahang may talababa
  alternative: Iugnay sa “nagpapasalamat” sa talata 12
  rationale: Walang bantas ang pinakamaagang mga manuskrito na tiyak na magpapasya sa pagkakabit. Parehong posible sa balarila at diwa, kaya hindi dapat ikubli ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang anyong nakaugnay sa naunang pangungusap sa pamamagitan ng “na pinalalakas,” at iniwasan ang mga salitang arkaiko gaya ng “pagbabata” o “mahabang pagtitiis” kung magiging mabigat ang daloy.
