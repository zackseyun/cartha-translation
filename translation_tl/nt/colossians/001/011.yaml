  naturalness: Natural at marangal ang daloy ng rebisyon. Ang “sa pamamagitan ng bawat kapangyarihan” ay mas malinaw na ipinakikita ang komprehensibong pagpapalakas, at ang “magtiis at magtimpi” ay mas malinaw na naghihiwalay sa magkaugnay na ὑπομονή at μακροθυμία nang hindi nagiging arkaiko.
  terminology: Pinananatili ang “kaluwalhatian” para sa δόξα at “lakas” para sa κράτος. Ginamit ang “magtiis” para sa ὑπομονή at “magtimpi” para sa μακροθυμία; ang huli ay angkop na modernong Tagalog para sa pagtitimpi/pagtitiis, lalo na sa ugnayan sa iba, habang hindi nililimitahan ng teksto ang saklaw nito.
