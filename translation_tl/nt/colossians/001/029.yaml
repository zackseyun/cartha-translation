id: COL.1.29
reference: Colossians 1:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: tl
  text: Para rito[a], nagpapagal din ako at nagpupunyagi[b] ayon sa kanyang pagkilos[c], na kumikilos sa akin nang may kapangyarihan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa layuning ito” o “para sa bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakikipagpunyagi” o “nakikipaglaban.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego ay “kanyang pagkilos”; hindi tahasang pinapangalanan kung Diyos o ang Mesiyas ang tinutukoy ng “kanyang.”
    reason: alternative_reading
  - marker: d
    text: Maaari ring “na makapangyarihang kumikilos sa akin” o “na kumikilos sa akin sa kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Para rito
  rationale: Tumutukoy ito pabalik sa layunin ng paglilingkod na binanggit sa naunang talata. Likas sa makabagong Tagalog ang “para rito” at hindi nito labis na nililinaw kung layunin o bagay na tinutukoy ang nangingibabaw.
- source_word: καὶ
  choice: din
  rationale: Ipinakikita ng καί ang pagdaragdag ng sariling pagpapagal ni Pablo sa naunang pahayag; natural itong naihahayag ng “din.”
- source_word: κοπιῶ
  choice: nagpapagal
  rationale: Ipinahihiwatig ng κοπιάω ang mabigat at nakapapagod na paggawa. Napananatili ng “nagpapagal” ang tindi nito sa marangal ngunit madaling maunawaang Tagalog.
- source_word: ἀγωνιζόμενος
  choice: nagpupunyagi
  rationale: Nagsasaad ang pandiwaring ito ng matinding pagsisikap o pakikipaglaban. Ang “nagpupunyagi” ay angkop sa konteksto at hindi nangangailangang magdagdag ng tahasang kalaban.
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinakikita rito ng κατά ang pamantayan o sukat ng pagpupunyagi ni Pablo, hindi lamang ang kasangkapang ginagamit niya.
- source_word: ἐνέργειαν
  choice: pagkilos
  rationale: Tumutukoy ang ἐνέργεια sa aktibo at mabisang paggawa. Iniiwasan ng “pagkilos” ang makabagong siyentipikong dating ng “enerhiya” at naiuugnay ito sa kasunod na kaugnay na pandiwa.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Napananatili ng panghalip ang anyo ng Griyego at hindi tahasang ipinapasiya kung Diyos o ang Mesiyas ang tinutukoy.
- source_word: τὴν ἐνεργουμένην
  choice: na kumikilos
  rationale: Ipinahahayag nito ang nagpapatuloy na aktibong paggawa at pinananatili ang ugnayang leksikal sa ἐνέργεια sa pamamagitan ng pag-uulit ng “kilos.”
- source_word: ἐν ἐμοὶ
  choice: sa akin
  rationale: Pinakamalapit ito sa ἐν ἐμοὶ at pinananatili ang diwa ng pagkilos na nagaganap kay Pablo nang hindi ito binabago tungo sa “sa pamamagitan ko.”
- source_word: ἐν δυνάμει
  choice: nang may kapangyarihan
  rationale: Natural sa Tagalog ang pariralang ito bilang paglalarawan sa paraan o bisa ng pagkilos, habang pinananatili ang pangngalang δύναμις.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ (“kanyang”)
  choice: Panatilihin ang panghalip na “kanyang” nang hindi tahasang tinutukoy kung Diyos o ang Mesiyas ang tinutukoy.
  alternative: “pagkilos ng Diyos” o “pagkilos ng Mesiyas”
  rationale: Hindi tahasang pinapangalanan sa talata ang pinagmumulan ng pagkilos. Pinananatili ng panghalip ang tunay na kontekstuwal na kalabuan at iniiwasang ipasok sa salin ang isang pasiyang interpretatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Pinanatili ang pag-uulit ng “pagkilos/kumikilos” upang maipakita ang magkaugnay na ἐνέργεια at ἐνεργουμένην, at pinanatili ang “kanyang” upang huwag lutasin ang di-tahasang referent ng Griyego.
