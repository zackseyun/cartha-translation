id: COL.1.10
reference: Colossians 1:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: tl
  text: upang mamuhay kayo nang karapat-dapat sa Panginoon at maging kalugud-lugod sa lahat ng paraan[a], na namumunga sa bawat mabuting gawa at lumalago sa pagkakilala sa Diyos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang bigyang-lugod siya sa lahat ng paraan.” Walang tahasang layon sa Griyego, ngunit ipinahihiwatig ng konteksto na ang tinutukoy ay ang Panginoon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa ganap na pagkakilala sa Diyos” o “sa malalim na pagkakilala sa Diyos.” Maaaring magtaglay ang salitang Griyego ng diwa ng mas buo o mas malalim na pagkakilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: mamuhay kayo
  rationale: Ang literal na “lumakad” ay metapora para sa paraan ng pamumuhay. Mas likas sa makabagong Tagalog ang “mamuhay,” at ang “kayo” ay mula sa ipinahihiwatig na simuno sa nagpapatuloy na panalangin ni Pablo.
- source_word: ἀξίως τοῦ κυρίου
  choice: nang karapat-dapat sa Panginoon
  rationale: Pinananatili nito ang diwang ang pamumuhay ay dapat maging angkop o marapat kaugnay ng Panginoon, nang hindi dinaragdagan ng isang tiyak na doktrinal na paliwanag.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: at maging kalugod-lugod sa lahat ng paraan
  rationale: Natural itong Tagalog para sa layuning lubos na makalugod. Hindi tahasang idinagdag sa pangunahing teksto ang layon ng pagkalugod, bagaman ipinahihiwatig ng konteksto na ito ang Panginoon.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: sa bawat mabuting gawa
  rationale: Pinananatili ng “bawat” ang distributibong lakas ng παντί at malinaw na inuugnay ang pamumunga sa mabubuting gawa.
- source_word: καρποφοροῦντες
  choice: namumunga
  rationale: Pinananatili ang metaporang organiko at ang pagkakaugnay nito sa kaparehong larawan sa Colosas 1:6.
- source_word: αὐξανόμενοι
  choice: lumalago
  rationale: Likas na katumbas ito sa Tagalog at umaayon sa larawang organiko ng “namumunga.”
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: sa pagkakilala sa Diyos
  rationale: Ang “pagkakilala” ay natural at personal na paraan upang ipahayag ang kaalaman tungkol sa Diyos. Ang datibo ay inuunawa bilang larangan o kaugnayan ng paglago, hindi tiyak na instrumento nito.
theological_decisions:
- issue: Ipinahihiwatig na layon ng ἀρεσκείαν
  choice: 'Hindi tahasang pinangalanan ang layon sa pangunahing teksto: “maging kalugod-lugod sa lahat ng paraan.”'
  alternative: “bigyang-lugod siya sa lahat ng paraan”
  rationale: Walang tahasang layon sa Griyego, bagaman malinaw na ipinahihiwatig ng konteksto ang Panginoon. Pinananatili ng salin ang implicitness habang nananatiling natural sa Tagalog.
- issue: Saklaw ng kahulugan ng ἐπίγνωσις
  choice: “pagkakilala” sa pangunahing teksto
  alternative: “ganap na pagkakilala” o “malalim na pagkakilala”
  rationale: Maaaring magpahiwatig ang salita ng mas ganap o mas malalim na kaalaman, ngunit hindi kailangang gawing teknikal o absolutong ganap ang kahulugan sa pangunahing teksto. Inilalagay ang posibleng diin sa talababa.
- issue: Gamit ng datibo sa τῇ ἐπιγνώσει
  choice: 'Larangan o kaugnayan: “lumalago sa pagkakilala sa Diyos”'
  alternative: 'Instrumento: “lumalago sa pamamagitan ng pagkakilala sa Diyos”'
  rationale: Kapuwa posible sa balarila, ngunit ang pagbasa bilang larangan ay maayos na kaagapay ng larawan ng paglago at hindi ipinipilit na ang pagkakilala ang tanging paraan o sanhi ng paglago.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mamuhay” sa halip na literal na “lumakad” upang maging madaling maunawaan ang Paulinong metapora. Pinanatili ang magkapares na larawang “namumunga” at “lumalago,” at iniwasan ang labis na pormal ngunit di-likas na pariralang gaya ng “tungo sa lahat ng kaluguran.”
