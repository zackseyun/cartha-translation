revisions:
- from: Ngayon ay nagagalak ako sa mga pagdurusa ko alang-alang sa inyo. Sa aking laman ay pinupunan ko ang anumang kulang sa mga kapighatian ng Mesiyas, alang-alang sa kanyang katawan, na siyang iglesya.[a]
  to: Ngayon ay nagagalak ako sa mga pagdurusa ko alang-alang sa inyo, at sa aking laman ay pinupunan ko ang kulang sa mga kapighatian ng Mesiyas[a] alang-alang sa kanyang katawan, na siyang iglesya.[b]
  rationale: 'Ang rebisyon ay maliit lamang: pinalitan ang “anumang kulang” ng mas tiyak na “ang kulang,” pinakinis ang daloy ng pangungusap, at inayos ang mga talababa upang malinaw ang kani-kanilang saklaw at pantukoy. Hindi nito nilulutas o pinahihina ang sadyang tensiyon ng pahayag ni Pablo.'
