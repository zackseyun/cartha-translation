  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: tl
  text: Ngayon ay nagagalak ako sa mga pagdurusa ko alang-alang sa inyo, at sa aking laman ay pinupunan ko ang kulang sa mga kapighatian ng Mesiyas[a] alang-alang sa kanyang katawan, na siyang iglesya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griyego: “Cristo”; isinaling “Mesiyas” dito dahil ginagamit ang Χριστός bilang titulo.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin ang bahaging ito: “kinukumpleto ko ang natitira sa mga kapighatian ng Cristo.” Hindi ipinahihiwatig ni Pablo na may kakulangan ang nagbabayad-salang gawain ng Mesiyas. Ang tinutukoy ay ang pakikibahagi niya sa mga pagdurusang kaugnay ng Mesiyas at ng kanyang katawan, ang iglesya.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Ngayon
  rationale: Likas at maikling panandang temporal para sa kasalukuyang kalagayan ni Pablo.
- source_word: χαίρω
  choice: nagagalak ako
  rationale: Pinananatili ang kasalukuyang saloobin ni Pablo sa natural na modernong Tagalog.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: sa mga pagdurusa ko alang-alang sa inyo
  rationale: Ang idinagdag na “ko” ay malinaw mula sa kontekstong unang panauhan; ipinahahayag ng “alang-alang sa” ang kapakinabangang tinutukoy ng ὑπέρ.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: pinupunan ko ang anumang kulang
  rationale: Pinananatili ang matapang na metapora at ang tunay na tensiyon ng Griyego nang hindi ito pinahihina o labis na ipinapaliwanag sa teksto.
- source_word: τῶν θλίψεων
  choice: sa mga kapighatian
  rationale: Ibinubukod sa naunang παθήματα na isinaling “mga pagdurusa,” habang ipinahahayag ang diwa ng matinding hirap o dalamhati.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay may malinaw na puwersang pantitulo ang Χριστός; ang “Mesiyas” ay natural na salin sa Filipino.
- source_word: ἐν τῇ σαρκί μου
  choice: sa aking laman
  rationale: Pinananatili ang kongkretong σάρξ at tumutukoy sa pisikal at katawang pagdurusa ni Pablo, hindi sa “makasalanang kalikasan.”
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: alang-alang sa kanyang katawan
  rationale: Pinananatili ang benepaktibong diwa ng ὑπέρ at ang metapora ng katawan.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: na siyang iglesya
  rationale: Malinaw at natural na ipinakikilala ang katawan bilang iglesya.
theological_decisions:
- issue: Kahulugan ng “anumang kulang sa mga kapighatian ng Mesiyas”
  choice: Pinananatili sa pangunahing teksto ang pahayag na pinupunan ni Pablo ang anumang kulang, at ipinapaliwanag sa talababa na tumutukoy ito sa pakikibahagi niya sa patuloy na pagdurusang kaugnay ng Mesiyas at ng iglesya.
  alternative: Na kinukumpleto ng pagdurusa ni Pablo ang kulang sa nagbabayad-salang gawain ng Mesiyas; o na isang takdang dami lamang ng mga kapighatian sa huling panahon ang tinutukoy.
  rationale: Hindi tahasang nilulutas ng sintaks ang lahat ng teolohikal na tanong, kaya pinananatili ang tensiyon. Gayunman, ang θλίψεις at ang pariralang “alang-alang sa kanyang katawan” ay pumapabor sa pagdurusang pangmisyon at pang-iglesya, hindi sa kakulangan ng nagbabayad-salang kamatayan ng Mesiyas.
- issue: Pagkasalin sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, gumaganap ang Χριστός bilang titulo at hindi lamang bilang pangalang pantangi.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “iglesya” bilang karaniwang terminong eklesiyastikal, “laman” upang mapanatili ang kongkretong larawan ng Griyego, at “kapighatian” upang maiba ang θλίψεις sa naunang παθήματα. Pinanatili sa teksto ang teolohikal na tensiyon sa “anumang kulang” at inilagay ang kinakailangang paglilinaw sa talababa.
