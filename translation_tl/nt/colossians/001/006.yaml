  to: na nakarating sa inyo[a]. Tulad ng nangyayari sa buong mundo[b], ito ay namumunga at lumalago, gayundin sa gitna ninyo[c], mula noong araw na narinig ninyo at nakilala ninyo ang biyaya ng Diyos sa katotohanan[d].
  rationale: Pinalitan ang infinitive na “marinig ninyo at makilala” ng mga anyong naganap na “narinig ninyo at nakilala ninyo,” ayon sa dalawang aorist ng pinagmulan. Inayos din ang daloy ng paghahambing upang malinaw na ang ebanghelyo ay namumunga at lumalago sa buong mundo at gayundin sa kanilang pamayanan. Nilimitahan ang alternatibo sa talababa para sa ἐν ἀληθείᾳ upang hindi madagdagan ang diin ng teksto.
