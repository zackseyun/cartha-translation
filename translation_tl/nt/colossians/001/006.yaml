source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: tl
  text: na nakarating sa inyo[a]. Tulad ng nangyayari sa buong mundo[b], ito ay namumunga at lumalago, gayundin sa gitna ninyo[c], mula noong araw na narinig ninyo at nakilala ninyo ang biyaya ng Diyos sa katotohanan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nasa piling ninyo” o “na dumating sa gitna ninyo.”
    reason: lexical_alternative
  - marker: b
    text: O “sa lahat ng dako ng mundo.”
    reason: lexical_alternative
  - marker: c
    text: O “gayundin sa inyo”; maaaring tumukoy ang Griyego sa pamayanan bilang kabuuan o sa gawain ng ebanghelyo sa kanila.
    reason: lexical_alternative
  - marker: d
    text: O “nang tunay” o “sa katotohanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: na nakarating sa inyo
  rationale: Ipinagpapatuloy ng pariralang ito ang paglalarawan sa ebanghelyo sa naunang talata. Likas sa makabagong Tagalog ang “nakarating sa inyo,” at naipahihiwatig nito kapuwa ang pagdating at kasalukuyang presensiya ng ebanghelyo.
- source_word: καθὼς καὶ
  choice: kung paanong … gayundin
  rationale: Ginagamit ang likas na magkatambal na paghahambing sa Tagalog upang maipakita ang ugnayan ng nangyayari sa buong mundo at sa mga taga-Colosas.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: sa buong mundo
  rationale: Pinananatili ang malawak at retorikal na saklaw ng κόσμος nang hindi ipinapakahulugang tiyak na naabot na noon ang bawat tao o pook.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: namumunga at lumalago ito
  rationale: Pinananatili ang patuloy na kilos at ang larawang pang-agrikultura ng dalawang pangkasalukuyang pandiwaring Griyego.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: gayundin sa gitna ninyo
  rationale: Ang “sa gitna ninyo” ay natural na tumutukoy sa gawain ng ebanghelyo sa loob ng kanilang pamayanan, habang kinikilala sa talababa na maaari ring tumukoy ang Griyego sa gawa nito sa kanila.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: mula nang araw
  rationale: Malinaw nitong itinatakda ang araw na pinagmulan ng patuloy na pamumunga at paglago ng ebanghelyo sa kanila.
- source_word: ἠκούσατε
  choice: marinig ninyo
  rationale: Tuwirang inilalarawan ang pangyayaring narinig nila ang mensahe; hindi idinagdag ang “unang” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: ἐπέγνωτε
  choice: makilala
  rationale: Ipinahahayag nito ang tunay na pagkilala o pagkaunawa nang hindi labis na pinatitindi ang diwa bilang ganap o lubos na kaalaman.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ang biyaya ng Diyos
  rationale: Ito ang malinaw, likas, at teolohikal na pamilyar na katumbas ng sentral na pariralang Paulino.
- source_word: ἐν ἀληθείᾳ
  choice: sa katotohanan
  rationale: Pinananatili nito ang anyo at tunay na kalabuan ng Griyego, na maaaring tumukoy sa paraan (“nang tunay”) o sa saklaw/nilalaman (“sa katotohanan”).
theological_decisions:
- issue: Saklaw ng “buong mundo”
  choice: Malawak at retorikal na paglalarawan sa paglaganap ng ebanghelyo sa daigdig na tinitirhan ng mga tao
  alternative: Isang mahigpit na literal na pahayag na naabot na noon ang bawat tao at bawat bahagi ng planeta
  rationale: Pinananatili ang pangkalahatang pananalita ni Pablo ngunit hindi nagdaragdag ng paliwanag sa pangunahing teksto na magpapasya sa eksaktong heograpikong lawak nito.
- issue: Diwa ng ἐν ἀληθείᾳ
  choice: sa katotohanan
  alternative: nang tunay; sa mismong katotohanan
  rationale: Nagpapahintulot ang Griyego ng magkaugnay na pakahulugan tungkol sa paraan o saklaw/nilalaman. Pinananatili ng salin ang kalabuan sa halip na tahimik itong lutasin.
- issue: Gawain ng ebanghelyo sa ἐν ὑμῖν
  choice: sa gitna ninyo, bilang pamayanan
  alternative: sa inyo, na maaaring idiin ang panloob na gawain nito sa mga mananampalataya
  rationale: Ang maramihang panghalip at paghahambing sa buong mundo ay umaangkop sa pangkomunidad na diwa, ngunit hindi inaalis ang posibilidad na tumutukoy rin ito sa gawa ng ebanghelyo sa kanilang kalooban.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metaporang “namumunga at lumalago,” ngunit inayos ang paghahambing bilang “kung paanong … gayundin” upang maging natural ang daloy. Ang teksto ay nananatiling kaugnay na sugnay mula sa talata 5.
