revisions:
- from: Naging lingkod ako ng iglesya ayon sa pangangasiwang mula sa Diyos na ipinagkatiwala sa akin para sa inyo, upang ganap na maisakatuparan ang salita ng Diyos.[a]
  to: Naging lingkod ako ng iglesya ayon sa pangangasiwang ibinigay sa akin ng Diyos para sa inyo, upang ganapin ang salita ng Diyos.[a]
  rationale: Binago ang pangunahing pandiwa sa “ganapin” upang mas malapit na maipakita ang πληρῶσαι nang hindi ipinipirmi kung ang diin ay sa ganap na pagpapahayag, pagkumpleto, o pagtupad. Inayos din ang parirala tungkol sa pangangasiwa para sa mas likas na daloy sa Filipino, habang pinananatili na ito ay ibinigay ng Diyos kay Pablo para sa mga taga-Colosas. Iningatan ang talababa upang ipakita ang mahalagang alternatibong pagbasa.
