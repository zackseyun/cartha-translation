  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: tl
  text: Naging lingkod ako ng iglesya ayon sa pangangasiwang ibinigay sa akin ng Diyos para sa inyo, upang ganapin ang salita ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang lubos na maipahayag ang salita ng Diyos” o “upang ganap na maisakatuparan ang salita ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ng iglesya
  rationale: Ang panghalip na pambabae at nasa anyong genitive ay tumutukoy sa ἐκκλησία sa naunang talata. Inulit ang “iglesya” upang maging malinaw at natural sa Tagalog.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: Naging lingkod ako
  rationale: Ipinakikita ng “naging” ang pagpasok ni Pablo sa tungkuling ito, samantalang ang “lingkod” ay malinaw at hindi nag-aangkat ng teknikal na katawagang pansimbahan.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: ayon sa pangangasiwang mula sa Diyos
  rationale: Pinananatili ng “pangangasiwa” ang diwa ng responsibilidad o gawaing ipinagkatiwala, at ipinahihiwatig ng “mula sa Diyos” na ang Diyos ang pinagmulan nito.
- source_word: τὴν δοθεῖσάν μοι εἰς ὑμᾶς
  choice: na ipinagkatiwala sa akin para sa inyo
  rationale: Ang “ipinagkatiwala” ay likas na Tagalog para sa isang pangangasiwang ibinigay bilang pananagutan; ang “para sa inyo” ay nagpapahayag ng pakinabang o layon nito.
- source_word: πληρῶσαι
  choice: upang ganap na maisakatuparan
  rationale: Pinananatili nito ang malawak na diwa ng pagdadala sa kaganapan nang hindi lubusang nililimitahan ang pandiwa sa pagpapahayag lamang o sa pagdaragdag sa kapahayagan.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Karaniwan, malinaw, at mayaman sa biblikal na ugnayan; hindi nito nililimitahan ang λόγος sa isang pangkalahatang “mensahe” lamang.
theological_decisions:
- issue: Kahulugan ng πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: upang ganap na maisakatuparan ang salita ng Diyos
  alternative: upang lubos na maipahayag ang salita ng Diyos; upang gawing ganap ang salita ng Diyos
  rationale: Maaaring tumukoy ang parirala sa lubos na pagpapahayag ng salita, sa pagtupad sa atas na kaugnay nito, o sa pagdadala nito sa kaganapan. Ang pangunahing salin ay sadyang malawak, at inilalahad sa talababa ang mas tiyak na mga posibleng diwa.
translation_notes:
  register: Makabago at marangal na Filipino na mauunawaan ng karaniwang mambabasa. Ginamit ang “pangangasiwa” upang mapanatili ang larawan ng responsibilidad na ipinagkatiwala, at iniwasan ang teknikal na “diakono” o denominasyonal na katawagan.
