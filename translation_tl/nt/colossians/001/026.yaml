  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: tl
  text: ang hiwaga[a] na itinago mula pa sa mga kapanahunan at mula sa mga salinlahi, ngunit ngayo’y inihayag sa kanyang mga banal[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lihim.” Sa gamit ni Pablo, ang “hiwaga” ay karaniwang tumutukoy sa layunin ng Diyos na dating nakatago ngunit ngayo’y inihayag.
    reason: lexical_alternative
  - marker: b
    text: O “sa kanyang mga banal na tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: hiwaga
  rationale: Sa gamit ni Pablo, tumutukoy ito sa layunin ng Diyos na dating nakatago ngunit ngayo’y inihayag. Pinananatili ng “hiwaga” ang teolohikal na bigat nang hindi ipinahihiwatig na isa lamang itong lihim na kaalaman.
- source_word: ἀποκεκρυμμένον
  choice: na itinago
  rationale: Ipinapahayag nito ang pasibong pagkakubli ng hiwaga; natural ito sa Filipino at ang kasunod na “inihayag” ay malinaw na katapat nito.
- source_word: ἀπὸ τῶν αἰώνων
  choice: mula pa sa mga kapanahunan
  rationale: Pinananatili ng “mula” ang lakas ng ἀπό, samantalang ang “mga kapanahunan” ay tumutukoy sa mga yugto ng panahon, hindi sa abstraktong kawalang-hanggan. Ang “pa” ay likas na nagpapakita ng matagal nang pagkakatago.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: at mula sa mga salinlahi
  rationale: Pinananatili nito ang paralelismo at ang inulit na ἀπό sa Griyego nang hindi idinaragdag ang di-hayag na “lahat.”
- source_word: νῦν δὲ
  choice: ngunit ngayo’y
  rationale: Malinaw at likas nitong ipinakikita ang matinding paghahambing ng dating pagkakatago at kasalukuyang paghahayag.
- source_word: ἐφανερώθη
  choice: inihayag
  rationale: Natural na pasibong pandiwa ito sa Filipino at hindi nito dinaragdagan ang aspektong ipinahihiwatig ng payak na aorist.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: sa kanyang mga banal
  rationale: Ang “mga banal” ay tuwirang tumutukoy sa mga taong ibinukod para sa Diyos at hindi sa isang piling uri lamang ng kinanonisang mga santo.
theological_decisions:
- issue: Kahulugan ng “kanyang mga banal”
  choice: Tumutukoy sa banal na bayan ng Diyos, ang sambayanan ng mga mananampalataya.
  alternative: kanyang mga hinirang; kanyang bayan
  rationale: Karaniwang ginagamit ni Pablo ang ἅγιοι para sa mga mananampalatayang ibinukod para sa Diyos. Pinananatili ng “mga banal” ang leksikal at teolohikal na diwa nang hindi ito nililimitahan sa isang natatanging uring eklesiastiko.
- issue: Diwa ng “hiwaga”
  choice: Layunin ng Diyos na dating nakatago ngunit ngayo’y inihayag.
  alternative: lihim
  rationale: Hindi ito simpleng impormasyong sadyang inililihim o esoterikong kaalaman; ang mismong talata ang nagtatanghal ng tensiyon sa pagitan ng dating pagkakatago at kasalukuyang paghahayag.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang paralelismo ng “mula… at mula…” at ang tahasang pagsalungat ng “ngunit ngayo’y.” Ang “mga banal” ay mas natural sa Filipino kaysa “mga banal na tao” at iniiwasan ang mas makitid na dating ng “mga santo.”
