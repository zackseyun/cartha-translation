  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: tl
  text: Si Pablo, isang apostol ng Mesiyas na si Jesus[a] sa pamamagitan ng kalooban ng Diyos, at si Timoteo na ating kapatid[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “ni Cristo Jesus.” Ang Griyegong Χριστός ay isang titulong nangangahulugang “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “ang kapatid”; ginamit ang “ating kapatid” upang natural na maipahayag sa Filipino ang ugnayang ipinahihiwatig sa pambungad ng liham.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Karaniwang anyo sa Filipino ng pangalang Griyego na Παῦλος.
- source_word: ἀπόστολος
  choice: apostol
  rationale: Pinananatili nito ang kinikilalang katungkulan ni Pablo, hindi lamang ang pangkalahatang diwa ng isang sugo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ipinahahayag nang natural sa Filipino ang kaugnayan ng genitibo sa “apostol.”
- source_word: διὰ θελήματος θεοῦ
  choice: ayon sa kalooban ng Diyos
  rationale: Natural at malinaw na Filipino ito para sa ideyang ang pagiging apostol ni Pablo ay nakabatay sa pasiya at pagkukusa ng Diyos.
- source_word: Τιμόθεος
  choice: Timoteo
  rationale: Karaniwang anyo sa Filipino ng pangalang Griyego na Τιμόθεος.
- source_word: ὁ ἀδελφὸς
  choice: ating kapatid
  rationale: Bagaman literal na “ang kapatid,” ipinahihiwatig ng konteksto ang ugnayang pampananampalataya nina Pablo, Timoteo, at ng mga mambabasa; natural itong ipinahahayag sa Filipino bilang “ating kapatid.”
theological_decisions:
- issue: Pagpapahayag sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo ni Jesus; pinananatili ng “Mesiyas” ang kahulugan ng titulo sa halip na ituring lamang itong bahagi ng pangalan.
- issue: Ugnayang ipinahihiwatig ng ὁ ἀδελφός
  choice: ating kapatid
  alternative: ang kapatid
  rationale: Nililinaw ng “ating” ang likas na ugnayang pampamilya sa pamayanan ng mga mananampalataya nang hindi binabago ang pangunahing diwa ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na terminong “apostol” at ang titular na “Mesiyas,” habang iniwasan ang sobrang literal ngunit hindi likas na ayos ng pananalita.
