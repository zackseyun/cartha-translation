source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: tl
  text: at upang sa pamamagitan niya ay ipagkasundo sa sarili niya ang lahat ng bagay[b], sa pamamagitan ng paglikha ng kapayapaan sa pamamagitan ng dugo ng kanyang krus—sa pamamagitan niya[a][d]—maging ang mga bagay na nasa lupa o ang mga bagay na nasa mga kalangitan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang parehong paglitaw ng “sa pamamagitan niya” bilang “sa pamamagitan niya”; sa pariralang “sa pamamagitan ng dugo,” maaari ring “sa pamamagitan nito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “lahat ng bagay” ay sadyang pinananatiling malawak, ayon sa Griyego at sa kasunod na “mga bagay na nasa lupa” at “mga bagay na nasa mga kalangitan.” Hindi tinutukoy ng talatang ito kung paano nauugnay ang pakikipagkasundong ito sa pangwakas na kaligtasan.
    reason: alternative_reading
  - marker: c
    text: Sa Griyego, plural ang “mga kalangitan.”
    reason: lexical_alternative
  - marker: d
    text: Wala sa ilang manuskrito ang ikalawang “sa pamamagitan niya.”
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Ipinapahayag ng διά na may genitive ang paraan o tagapamagitan; pinananatili ng parirala ang diin sa Anak bilang tagapamagitan ng pakikipagkasundo.
- source_word: ἀποκαταλλάξαι
  choice: ipagkasundo
  rationale: Natural sa Filipino ang causative na anyo para sa pagkilos na muling nagdadala sa wastong ugnayan, nang hindi idinaragdag ang interpretibong ‘lubos.’
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili nito ang malawak at kosmikong saklaw ng neuter plural, na nililinaw ng kasunod na pagtukoy sa lupa at kalangitan.
- source_word: εἰς αὐτόν
  choice: sa sarili niya
  rationale: Ipinahahayag ang reflexive na ugnayan sa konteksto habang hindi pinapangalanan sa mismong talata ang ipinahiwatig na simuno mula sa talata 19.
- source_word: εἰρηνοποιήσας
  choice: matapos gumawa ng kapayapaan
  rationale: Ipinakikita ang aspektong aorist participle bilang kilos na kaugnay at malamang na nauna sa pakikipagkasundo; natural at malinaw ito sa modernong Filipino.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: sa pamamagitan ng dugong dumanak sa kanyang krus
  rationale: Pinananatili ang konkretong ‘dugo’ at ‘krus.’ Idinagdag ang ‘dumanak’ bilang likas na Filipino na paglilinaw sa ugnayang genitive na ‘dugo ng kanyang krus,’ nang hindi pinapalitan ang dugo ng pangkalahatang ‘kamatayan.’
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: sa pamamagitan niya
  rationale: Pinananatili ang inuulit na parirala bilang retorikal na pagbibigay-diin at inilalagay sa pagitan ng mga gitling; tinatala sa talababa ang baryanteng tekstuwal.
- source_word: εἴτε ... εἴτε
  choice: maging ... o
  rationale: Natural na correlative construction sa Filipino na pinananatili ang pares na sumasaklaw sa dalawang larangan.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ang mga bagay na nasa lupa
  rationale: Ang ‘lupa’ ay angkop sa kosmikong paghahambing sa mga kalangitan.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: ang mga bagay na nasa kalangitan
  rationale: Ang ‘kalangitan’ ay natural na kolektibong Filipino para sa plural na οὐρανοῖς; itinatala sa talababa na plural ang anyong Griyego.
theological_decisions:
- issue: Saklaw ng pakikipagkasundo sa τὰ πάντα
  choice: Malawak na isinalin bilang ‘ang lahat ng bagay’ nang hindi nililimitahan o ipinapakahulugang tiyak na kaligtasan ng bawat nilalang.
  alternative: ‘lahat ng tao’ o ‘ang buong sansinukob na maliligtas’
  rationale: Kosmiko ang saklaw ng teksto, gaya ng pares na nasa lupa at nasa kalangitan, ngunit hindi nito mismo ipinaliliwanag kung paano nauugnay ang pakikipagkasundong ito sa pangwakas na kaligtasan.
- issue: Tinutukoy ng εἰς αὐτόν
  choice: ‘sa sarili niya,’ na sa daloy mula talata 19 ay malamang na tumutukoy sa Diyos na nakikipagkasundo sa lahat sa pamamagitan ng Anak.
  alternative: Ang Mesiyas ang nakikipagkasundo sa lahat sa sarili niya.
  rationale: Pinananatili ng reflexive na salin ang sintaks at hindi labis na nilulutas sa mismong teksto ang ipinahiwatig na simuno.
- issue: Kahulugan ng ‘dugo ng kanyang krus’
  choice: Pinanatili ang konkretong wika ng dugo at krus bilang ‘dugong dumanak sa kanyang krus.’
  alternative: ‘ang kanyang kamatayan sa krus’
  rationale: Tahasan sa Griyego ang dugo at krus; hindi dapat alisin ang sakripisyal at makasaysayang wika o ikulong ito sa isang partikular na teorya ng pagtubos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang ‘ipagkasundo’ at ‘gumawa ng kapayapaan’ bilang natural ngunit malapit sa Griyego. Ginamit ang ‘dugong dumanak sa kanyang krus’ upang maiwasan ang alanganing literal na ‘dugo ng kanyang krus’ habang pinananatili ang parehong konkretong larawan. Lahat ng marker [a]–[d] ay nasa pangunahing teksto.
