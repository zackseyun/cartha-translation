  source_fidelity: Kailangang iwasto ang “dugong dumanak sa kanyang krus.” Ang Griyego ay literal na “sa pamamagitan ng dugo ng kanyang krus”; bagaman malinaw ang kaugnayan sa pagpapako sa krus, ang “dumanak sa” ay nagdaragdag ng isang relasyong lokatibo na hindi tahasang isinasaad. Ang “matapos” ay maaari ring magmukhang sunod-sunod na panahon; mas malapit ang “sa pamamagitan ng paglikha ng kapayapaan.”
  naturalness: Natural at marangal sa modernong Filipino ang binagong pangungusap. Ang “mga kalangitan” ay bahagyang mas literal kaysa karaniwang kolektibong “kalangitan,” ngunit angkop dito upang maipakita ang plural ng Griyego at nananatiling madaling unawain.
  terminology: Pinananatili ang “ipagkasundo,” “lahat ng bagay,” “dugo,” at “krus.” Pinalitan ang alternatibong “sa bisa niya,” na maaaring magpahiwatig ng awtoridad o kapangyarihan sa halip na pamamagitan/tagapamagitan, ng mas tapat na “sa pamamagitan niya” / “sa pamamagitan nito” ayon sa konteksto.
