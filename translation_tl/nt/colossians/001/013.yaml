  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: tl
  text: Siya ang nagligtas sa atin mula sa kapangyarihan ng kadiliman at inilipat tayo sa kaharian ng kanyang minamahal na Anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Anak na kanyang minamahal”; literal, “Anak ng kanyang pag-ibig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: nagligtas
  rationale: Ipinapahayag ng ῥύομαι ang tiyak na pagliligtas mula sa panganib o mapagharing puwersa. Likas at malinaw sa modernong Tagalog ang “nagligtas.”
- source_word: ἐξουσίας
  choice: kapangyarihan
  rationale: Maaaring tumukoy ang ἐξουσία sa awtoridad o kapangyarihang namamahala. Sa pariralang ito, mas natural sa Tagalog ang “kapangyarihan ng kadiliman” kaysa “awtoridad ng kadiliman,” habang nananatili ang diwa ng mapagharing kapangyarihan.
- source_word: σκότους
  choice: kadiliman
  rationale: Tuwirang katumbas ito ng σκότος. Hindi tahasang pinalawak ang moral at espirituwal na pahiwatig nito.
- source_word: μετέστησεν
  choice: naglipat
  rationale: Ipinakikita ng μεθίστημι ang paglilipat mula sa isang nasasakupan tungo sa iba. Pinananatili ng “naglipat” ang malinaw na larawan ng pagbabago ng kaharian o sakop.
- source_word: βασιλείαν
  choice: kaharian
  rationale: Sa konteksto ng paglilipat tungo sa isang pinamamahalaang sakop, natural ang “kaharian” at ipinahihiwatig din nito ang paghahari ng Anak.
- source_word: υἱοῦ
  choice: Anak
  rationale: Tuwirang salin ito ng υἱός. Ginamit ang malaking titik dahil sa konteksto ay tumutukoy ito sa natatanging Anak ng Diyos.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Tuwirang isinasalin ang ἀγάπη bilang “pag-ibig,” at pinananatili sa pangunahing teksto ang anyong henitibo ng Griyego.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Anak ng kanyang pag-ibig
  rationale: Pinananatili nito ang natatanging kayarian ng Griyegong “the Son of his love.” Bagaman hindi ito ang pinakakaraniwang idyoma sa Tagalog, nauunawaan ito at hindi agad nilulutas ang henitibong pahayag bilang isang tiyak na paraphrase.
theological_decisions:
- issue: Pagpapakahulugan sa henitibong pariralang τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Anak ng kanyang pag-ibig
  alternative: kanyang minamahal na Anak; Anak na kanyang minamahal
  rationale: Pinananatili ng pangunahing salin ang anyo at teolohikal na bigat ng pariralang Griyego nang hindi tahimik na pinipili ang isang mas makinis na pagpapakahulugan. Inilalagay sa talababa ang mga natural na katumbas na malinaw na nagpapahayag ng natatanging pag-ibig ng Ama sa Anak.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinili ang “kapangyarihan” dahil mas natural ito sa parirala kaysa “awtoridad,” ngunit pinananatili ang diwa ng namamahalang kapangyarihan. Sadyang mas pormal ang “Anak ng kanyang pag-ibig” upang mapanatili ang kayarian at tensiyon ng orihinal; nililinaw ng talababa ang mas idyomatikong mga pagbasa.
