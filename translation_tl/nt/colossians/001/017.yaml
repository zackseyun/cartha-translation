  naturalness: Mas natural at malinaw sa makabagong Filipino ang “bago pa ang lahat ng bagay” para sa temporal na pagkauna. Ang “nananatiling buo” ay payak at idiomatiko para sa patuloy na pagkakabuklod ng lahat ng bagay.
  terminology: Pinananatili ang “lahat ng bagay” para sa τὰ πάντα at “sa kanya” para sa ἐν αὐτῷ. Hindi idinaragdag ang anumang doktrinal na pagpapaliwanag sa pangunahing teksto.
