translation:
  language: tl
  text: At siya ay bago pa ang lahat ng bagay[a], at sa kanya ay nananatiling buo ang lahat ng bagay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bago pa ang lahat ng bagay” ay maaari ring magpahiwatig ng pagiging higit sa lahat, ngunit pangunahing ipinahahayag ng Griyego ang pagkauna.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “sa kanya ay magkakabuklod ang lahat ng bagay” o “sa kanya ay magkakaugnay ang lahat ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: siya
  rationale: Ang tahasang “siya” ay natural sa Filipino at pinananatili ang diin ng nakapuwestong panghalip nang hindi dinaragdagan ng paliwanag na wala sa Griyego.
- source_word: πρὸ πάντων
  choice: una sa lahat ng bagay
  rationale: Pangunahing ipinahahayag ng πρό na may genitive ang pag-iral o pagiging nauna kaysa sa lahat. Mas natural ito sa modernong Filipino kaysa “bago sa lahat ng bagay,” na maaaring magtunog na paghahambing ng katangian.
- source_word: τὰ πάντα
  choice: lahat ng bagay
  rationale: Pinananatili nito ang malawak at pangkalahatang saklaw ng parirala at ang pagkakaugnay nito sa naunang konteksto, nang hindi nililimitahan sa salitang “nilikha.”
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang ἐν bilang “sa” sa halip na gawing mas interpretatibong “sa pamamagitan niya,” upang maingatan ang ideya ng saklaw o ugnayang nagpapanatili.
- source_word: συνέστηκεν
  choice: nananatiling magkakaugnay
  rationale: Ipinahihiwatig ng perfect tense ang kasalukuyang kalagayang bunga ng naganap na pagkakabuo o pagkakaugnay. Ang parirala ay malinaw na naghahatid ng patuloy na pagkakaisa at kaayusan nang hindi gumagamit ng teknikal na salita.
theological_decisions:
- issue: Ugnayan ni Cristo sa sangnilikha sa πρὸ πάντων
  choice: 'Ang temporal na pagkauna ang nasa pangunahing teksto: “una sa lahat ng bagay.”'
  alternative: “Higit sa lahat ng bagay,” na tuwirang magpapahayag ng kataas-taasang ranggo.
  rationale: Ang Griyego ay pangunahing nagpapahayag ng pagkauna, samantalang maaaring kaakibat nito sa konteksto ang kataas-taasang kalagayan. Hindi pinalitan ng salin ang temporal na pahayag ng isang doktrinal na pagpapalawak.
- issue: Diwa ng συνέστηκεν
  choice: 'Patuloy na pagkakaugnay at kaayusan: “nananatiling magkakaugnay.”'
  alternative: “Nabubuo” o “umiiral” sa kanya.
  rationale: Ipinakikita ng pandiwa ang kasalukuyang magkakaugnay na kalagayan ng lahat ng bagay. Iniiwasan ng salin na paliitin ito sa materyal na pagkakabuo lamang o gawing labis na teknikal ang ontolohikal na pahayag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “una sa” upang natural na ipahayag ang temporal na priority, at “nananatiling magkakaugnay” upang maipakita ang resultative at patuloy na lakas ng perfect tense.
