revisions:
- from: At siya ay una sa lahat ng bagay[a], at sa kanya nananatiling magkakaugnay ang lahat ng bagay.[b]
  to: At siya ay bago pa ang lahat ng bagay[a], at sa kanya ay nananatiling buo ang lahat ng bagay.[b]
  rationale: Pinalitan ang “una sa” ng “bago pa ang” upang mailahad nang walang alinlangan ang temporal na priority ng πρὸ πάντων. Pinalitan ang “nananatiling magkakaugnay” ng “nananatiling buo” upang mas tumpak na maipahayag ang resultative at kasalukuyang diwa ng συνέστηκεν—ang lahat ng bagay ay nananatiling magkakasama o matatag sa kanya. Napanatili ang mga panandang talababa sa kanilang kaukulang mga parirala.
