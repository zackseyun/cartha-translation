  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: tl
  text: dahil sa pag-asang nakalaan para sa inyo sa kalangitan[a]—ang pag-asang narinig na ninyo noon[b] sa salita ng katotohanan, ang ebanghelyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Griyego, pangmaramihan: “sa mga kalangitan”; maaari ring isaling “sa langit.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “na dati na ninyong narinig” o “na patiuna ninyong narinig.”
    reason: lexical_alternative
  - marker: c
    text: Ang “salita ng katotohanan” ay maaari ring isaling “mensahe ng katotohanan.” Ang “ebanghelyo” ay nasa aposisyon at nagpapakilala sa salita o mensaheng iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: dahil sa pag-asa
  rationale: Ang διά na may akusatibo ay nagpapahayag dito ng dahilan o batayan. Likas at malinaw sa modernong Tagalog ang “dahil sa,” at hindi nito ginagawang basta pansariling pagnanais lamang ang ἐλπίς.
- source_word: ἀποκειμένην ὑμῖν
  choice: inilaan para sa inyo
  rationale: Ipinahihiwatig ng ἀπόκειμαι ang isang bagay na nakatabi, nakalaan, o nakalaan bilang reserba. Ang “inilaan para sa inyo” ay natural sa Tagalog at pinananatili ang diwang nakahandang para sa kanilang kapakinabangan.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Ang “kalangitan” ay dignificado at likas na kolektibong anyo sa Tagalog para sa plural na οὐρανοῖς; itinatala sa talababa ang literal na bilang ng Griyego.
- source_word: ἣν προηκούσατε
  choice: ang pag-asang narinig na ninyo noon
  rationale: Ang ἣν ay pambabaeng isahan at tuwirang tumutukoy sa ἐλπίδα. Ipinapahayag ng “na … noon” ang naunang pagkarinig na nasa tambalang pandiwang προακούω nang hindi nilulutas kung ito ay simpleng dating pagkarinig o pagkarinig nang patiuna.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: sa salita ng katotohanan
  rationale: Pinananatili ng “salita ng katotohanan” ang karaniwang saklaw ng λόγος at ang pormang henitibo ng parirala. Nililinaw ng kasunod na “ang ebanghelyo” na ang tinutukoy ay mensahe.
- source_word: τοῦ εὐαγγελίου
  choice: ang ebanghelyo
  rationale: Ginamit bilang aposisyon na nagpapakilala sa “salita ng katotohanan.” Ang “ebanghelyo” ay maikli, kinikilala sa modernong Filipino, at hindi nagdaragdag ng paliwanag na wala sa teksto.
theological_decisions:
- issue: Tinutukoy ng sugnay na ἣν προηκούσατε
  choice: Tumutukoy ito nang tuwiran sa “pag-asa.”
  alternative: Ituring itong maluwag na pagtukoy sa buong mensahe ng ebanghelyo.
  rationale: Ang pambabaeng isahang ἣν ay kaayon ng pambabaeng isahang ἐλπίδα. Inuulit ang “pag-asang” sa salin upang maging malinaw sa Tagalog nang hindi inililipat ang antecedent.
- issue: Ugnayan ng τοῦ εὐαγγελίου sa “salita ng katotohanan”
  choice: 'Aposisyon: “ang ebanghelyo” ang kumikilala sa “salita ng katotohanan.”'
  alternative: Isalin bilang pagmamay-ari o pinagmulan, gaya ng “salita ng katotohanan ng ebanghelyo.”
  rationale: Ang aposasyonal na pagbasa ang pinakamalinaw sa sintaks at pinananatili ang pagkakakilanlan ng mensahe ng katotohanan at ng ebanghelyo nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Pinanatili ang panimulang “dahil sa” sapagkat nagpapatuloy ang talata mula sa naunang pangungusap. Ginamit ang gitling na em upang malinaw na maikabit ang sugnay tungkol sa pag-asa nang hindi binabago ang lohikal na ugnayan ng Griyego.
