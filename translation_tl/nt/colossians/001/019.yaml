translation:
  language: tl
  text: Sapagkat minabuting manahan sa kanya ang buong kapuspusan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sapagkat” ay maaari ring isalin bilang “dahil”; maaari ring unawain ang ὅτι bilang panandang “na,” depende sa pagkakaugnay nito sa naunang pangungusap.
    reason: lexical_alternative
  - marker: b
    text: 'Hindi tahasang binabanggit sa Griyego ang isang personal na simuno ng “minabuti.” Maraming salin ang nagpapaliwanag: “Sapagkat minabuti ng Diyos [o ng Ama] na manahan sa kanya ang buong kapuspusan.” Maaari ring basahin, batay sa anyo ng pangungusap, na ang “buong kapuspusan” ang simuno ng “minabuti.”'
    reason: alternative_reading
  - marker: c
    text: Karaniwang nauunawaan ang “buong kapuspusan” bilang kapuspusan ng Diyos; ihambing ang Colosas 2:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinahihiwatig nito na ang pahayag ay nagbibigay ng batayan o paliwanag sa naunang paglalarawan sa Anak. Pinananatili rin ng “sapagkat” ang posibilidad na basahin ang ugnayan bilang sanhi o paliwanag.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip sa Anak sa naunang konteksto. Hindi idinagdag sa talata ang titulong “Cristo” o “Mesiyas,” na wala sa mismong parirala.
- source_word: εὐδόκησεν
  choice: minabuti
  rationale: Ipinahahayag ng pandiwa ang mabuting pasiya o ikinalulugod na layunin. Ang anyong “minabuting” ay natural sa Filipino at hindi nangangailangang magdagdag agad ng tahasang simuno gaya ng “Diyos” o “Ama.”
- source_word: πᾶν τὸ πλήρωμα
  choice: ang buong kapuspusan
  rationale: Ang “buong” ay naghahatid ng saklaw ng πᾶν, at ang “kapuspusan” ay nagpapanatili sa mabigat at siksik na kahulugan ng πλήρωμα. Hindi idinagdag ang “ng Diyos,” sapagkat wala itong tahasang katumbas sa Griyego.
- source_word: κατοικῆσαι
  choice: manahan
  rationale: Ang “manahan” ay malinaw na nagpapahayag ng paninirahan o permanenteng pag-iral sa isang dako at angkop sa marangal na himig ng talata.
theological_decisions:
- issue: Hindi tahasang simuno ng εὐδόκησεν
  choice: Gamitin ang “minabuting manahan” nang hindi tahasang idinaragdag ang “Diyos” o “Ama.”
  alternative: Sapagkat minabuti ng Diyos na manahan sa kanya ang buong kapuspusan; o, Sapagkat minabuti ng Ama na ang buo niyang kapuspusan ay manahan sa kanya.
  rationale: Dahil magkapareho ang anyong nominatibo at akusatibo ng neutrong πᾶν τὸ πλήρωμα, maaaring iugnay ang “buong kapuspusan” bilang simuno ng “minabuti” o bilang simuno ng pawatas na “manahan,” habang ipinapalagay ang Diyos bilang simuno ng “minabuti.” Hindi nilulutas ng pangunahing salin ang tunay na sintaktikong kalabuan.
- issue: Tinutukoy ng “buong kapuspusan”
  choice: Panatilihin ang “ang buong kapuspusan” nang walang idinagdag na “ng Diyos.”
  alternative: ang buong kapuspusan ng Diyos; o, ang buo niyang kapuspusan
  rationale: Malakas na ipinahihiwatig ng konteksto, lalo na ng Colosas 2:9, na kapuspusan ng Diyos ang tinutukoy. Gayunman, walang tahasang pariralang “ng Diyos” sa talatang ito, kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinili ang “minabuting manahan” upang maging natural nang hindi tahasang pinupunan ang simuno, at “kapuspusan” upang mapanatili ang teolohikal na bigat at ugnayan sa Colosas 2:9.
