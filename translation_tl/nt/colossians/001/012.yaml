  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: tl
  text: na nagpapasalamat sa Ama, na ginawang karapat-dapat kayo[a] para sa bahagi sa mana ng mga banal sa liwanag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “tayo” sa halip na “kayo.”
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “para sa bahaging nakatalaga sa mga banal sa liwanag”; ipinahihiwatig ng Griyego ang larawan ng manang may bahaging itinakda.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: na nagpapasalamat
  rationale: Ipinananatili ang anyong pandiwaring nagpapatuloy sa daloy ng naunang pangungusap; natural ito sa modernong Tagalog.
- source_word: τῷ πατρὶ
  choice: sa Ama
  rationale: Tuwirang isinasalin ang tiyak na katawagang 'Ama' nang hindi idinaragdag ang 'Diyos,' na wala sa mismong talata.
- source_word: τῷ ἱκανώσαντι
  choice: na gumawa sa inyong karapat-dapat
  rationale: Ipinahahayag ang aktibong diwa ng ἱκανόω—ginawa ng Ama na sapat o karapat-dapat—sa halip na pahintulot lamang.
- source_word: ὑμᾶς
  choice: inyo
  rationale: Sinusunod ang ikalawang panauhang maramihan ng SBLGNT; ang baryanteng 'atin' ay inilalagay sa talababa.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: sa bahagi ng mana
  rationale: Pinananatili ang magkaugnay na larawan ng bahagi at manang ibinabahagi o itinatalaga, bagaman mas siksik ang parirala kaysa karaniwang Tagalog.
- source_word: τῶν ἁγίων
  choice: ng mga banal
  rationale: Karaniwang katawagan ni Pablo sa mga taong itinalaga sa Diyos; hindi ito nililimitahan sa mga pormal na kinanonisang santo.
- source_word: ἐν τῷ φωτί
  choice: sa liwanag
  rationale: Pinananatili ang talinghaga at ang posibilidad na inilalarawan nito ang kalagayan o saklaw ng mana ng mga banal.
theological_decisions:
- issue: Baryante sa panghalip na layon
  choice: inyo/kayo
  alternative: atin/tayo
  rationale: ὑμᾶς ('kayo') ang nasa ibinigay na tekstong SBLGNT. Mahalaga ang baryanteng ἡμᾶς ('tayo'), kaya binabanggit ito sa talababa sa halip na tahimik na piliin o pagsamahin ang dalawa.
- issue: Ugnayan ng 'bahagi,' 'mana,' at 'sa liwanag'
  choice: sa bahagi ng mana ng mga banal sa liwanag
  alternative: sa bahaging nakatalaga sa mga banal sa liwanag
  rationale: Pinananatili sa pangunahing teksto ang siksik at bahagyang malabong kayarian ng Griyego; ibinibigay sa talababa ang mas hayag na pagbasa batay sa larawan ng mana na itinatalaga.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ang talata ay nananatiling bahagi ng mas mahabang pangungusap, kaya nagsisimula sa “na nagpapasalamat.” Ginamit ang “mga banal” bilang biblikal na katawagan sa bayang itinalaga sa Diyos, at pinanatili ang metapora ng liwanag.
