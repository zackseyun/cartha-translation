  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: tl
  text: Ngunit ngayon, ipinagkasundo niya kayo sa kanyang katawang laman sa pamamagitan ng kamatayan[a], upang iharap kayo bilang banal, walang kapintasan[b], at walang maipaparatang sa harap niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ngunit ngayon ay ipinagkasundo kayo.” Passive ang pandiwang Griego; hindi nito tahasang pinapangalanan ang gumawa ng pakikipagkasundo.
    reason: alternative_reading
  - marker: b
    text: Ang “walang kapintasan” ay maaari ring isaling “walang dungis,” na mas malinaw na nagpapanatili sa himig ng wikang ginagamit tungkol sa handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Likas na ipinapahayag ang matinding kaibahan ng dati nilang kalagayan sa talata 21 at ng ginawa na ngayon ng Diyos.
- source_word: ἀποκατηλλάγητε
  choice: ipinagkasundo niya kayo
  rationale: Ang anyo ay aorist passive; pinananatili ng Tagalog na causative-passive na diwa ang pagkilos sa kanila, habang ang 'niya' ay kumukuha ng ipinahihiwatig na tagagawa mula sa konteksto.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: sa katawang laman niya
  rationale: Pinananatili ang kongkreto at pisikal na diin ng σώμα at σάρξ nang hindi ipinahihiwatig na makasalanan ang katawan.
- source_word: διὰ τοῦ θανάτου
  choice: sa pamamagitan ng kamatayan
  rationale: Malinaw na ipinahahayag ang paraan o kasangkapang diwa ng διά na may genitive, habang hindi idinaragdag sa pangunahing teksto ang 'kaniyang' na hindi tahasang inuulit sa parirala.
- source_word: παραστῆσαι
  choice: upang iharap
  rationale: Ipinahahayag ang layunin ng infinitive at ang larawan ng pagdadala sa isang tao sa presensiya ng iba.
- source_word: ἁγίους
  choice: banal
  rationale: Karaniwan at marangal na salin na saklaw ang pagiging itinalaga at ang kadalisayang moral.
- source_word: ἀμώμους
  choice: walang kapintasan
  rationale: Natural sa modernong Tagalog at maaari pa ring magpahiwatig ng pagiging walang dungis; nililinaw sa talababa ang posibleng sakripisyal na himig.
- source_word: ἀνεγκλήτους
  choice: walang maipaparatang
  rationale: Pinananatili ang forensic na diwa ng hindi mapagbintangan o masampahan ng wastong paratang, at iniiwasang gawing halos kasingkahulugan lamang ng 'walang kapintasan.'
- source_word: κατενώπιον αὐτοῦ
  choice: sa harap niya
  rationale: Tuwirang salin na pinananatiling hindi tiyak kung ang tinutukoy ng panghalip ay ang Diyos o si Cristo.
theological_decisions:
- issue: Tagagawa sa passive na ἀποκατηλλάγητε
  choice: Ipinagkasundo niya kayo
  alternative: Nakipagkasundo kayo / naipagkasundo kayo
  rationale: Ang Griego ay passive at hindi tahasang pinapangalanan ang tagagawa. Ang 'niya' ay likas sa daloy ng konteksto, ngunit itinatala sa talababa ang pormal na passive upang hindi maitago ang gramatikal na kalabuan.
- issue: Kahulugan ng σάρξ sa pariralang 'katawang laman'
  choice: 'Literal na pisikal na diwa: laman'
  alternative: Makasalanang kalikasan
  rationale: Ang konteksto ay tungkol sa tunay na katawang namatay; ang 'makasalanang kalikasan' ay magpapasok ng kahulugang hindi hinihingi rito.
- issue: Pagkakaiba ng ἀμώμους at ἀνεγκλήτους
  choice: Walang kapintasan at walang maipaparatang
  alternative: Walang dungis at hindi mapupulaan
  rationale: Pinananatiling magkahiwalay ang posibleng sakripisyal na himig ng una at ang legal o forensic na himig ng ikalawa.
- issue: Tinutukoy ng αὐτοῦ sa κατενώπιον αὐτοῦ
  choice: niya
  alternative: ng Diyos / ni Cristo
  rationale: Hindi pinapangalanan ng Griego ang referent sa mismong parirala; ang panghalip ay nagpapanatili sa tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang 'katawang laman' upang mapanatili ang sadyang pisikal na diin ng orihinal, kahit bahagya itong mas pormal kaysa karaniwang usapan. Ang lahat ng marker na [a] at [b] ay nakalagay sa pangunahing teksto.
