  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: tl
  text: gaya ng natutuhan ninyo mula kay Epafras, ang aming minamahal na kapwa alipin, na isang tapat na lingkod ng Mesiyas para sa amin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang sinaunang manuskrito na mababasang “para sa inyo” sa halip na “para sa amin.” Maaari ring unawain ang “para sa amin” bilang “bilang kinatawan namin.”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na nag-uugnay sa naunang pahayag at pinananatili ang diwa ng pagkakatulad o pagtutugma.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: natutuhan ninyo mula kay Epafras
  rationale: Ang payak na nagdaang anyo ay angkop sa pagtanggap nila ng mensahe; malinaw na ipinakikita ng “mula kay” si Epafras bilang pinagmulan ng kanilang pagkatuto.
- source_word: τοῦ ἀγαπητοῦ συνδούλου ἡμῶν
  choice: ang minamahal naming kapwa alipin
  rationale: Pinananatili ng “minamahal” ang magiliw na paglalarawan, at ng “kapwa alipin” ang larawan ng mga taong magkakasamang nasa ilalim ng iisang Panginoon.
- source_word: πιστὸς
  choice: tapat
  rationale: Saklaw nito ang pagiging maaasahan at matapat ni Epafras sa kaniyang paglilingkod.
- source_word: ὑπὲρ ἡμῶν
  choice: alang-alang sa amin
  rationale: Natural sa Tagalog at naipahahayag ang paglilingkod para sa kapakinabangan o bilang kinatawan nina Pablo, habang hindi labis na nililimitahan ang saklaw ng ὑπέρ.
- source_word: διάκονος
  choice: lingkod
  rationale: Ipinahahayag nito ang aktuwal na paglilingkod kay Mesiyas nang hindi ipinapalagay na tumutukoy ang salita sa pormal na katungkulan ng diyakono.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagawang malinaw ang kahulugan ng Χριστός bilang titulo ng pinahiran, sa halip na ituring lamang itong pangalang pantangi.
theological_decisions:
- issue: Paglalarawan sa σύνδουλος
  choice: kapwa alipin
  alternative: kapwa lingkod
  rationale: Mas tuwirang pinananatili ng “kapwa alipin” ang ugnayang nasa ilalim ng iisang panginoon; ang “kapwa lingkod” ay mas banayad ngunit maaaring mawala ang lakas ng talinghaga.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa pariralang ito, malinaw na tumutukoy ang salita sa titulo ng pinaglilingkuran ni Epafras; ang “Mesiyas” ang nagpapakita ng kahulugan ng titulong Griyego.
- issue: Saklaw ng ὑπὲρ ἡμῶν
  choice: alang-alang sa amin
  alternative: para sa amin / bilang kinatawan namin
  rationale: Ang “alang-alang sa amin” ay nagpapanatili ng posibleng diwa ng kapakinabangan at pagkatawan nang hindi ipinipilit ang isa lamang sa mga iyon.
- issue: Pagkakaiba ng tekstuwal sa panghalip pagkatapos ng ὑπέρ
  choice: amin, kasunod ng tekstong ibinigay na ἡμῶν
  alternative: inyo, ayon sa ibang sinaunang saksi na may ὑμῶν
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT reading, ngunit mahalagang itala ang tunay na variant sapagkat binabago nito kung kanino alang-alang naglilingkod si Epafras.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kapwa alipin” upang mapanatili ang matinding larawan ng σύνδουλος, samantalang “lingkod” ang ginamit para sa διάκονος upang hindi ito awtomatikong ipakahulugan bilang pormal na katungkulan. Ang kuwit sa hulihan ng konsultasyong Ingles ay hindi isinama dahil ang isinumite ay isang buong talata.
