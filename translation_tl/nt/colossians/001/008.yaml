id: COL.1.8
reference: Colossians 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: tl
  text: At siya rin ang nagbalita sa amin tungkol sa pag-ibig ninyo sa Espiritu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pag-ibig ninyo sa espiritu,” ibig sabihin, ang espirituwal ninyong pag-ibig.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: siya ... ang nagbalita
  rationale: Ang artikulo at aorist participle ay tumutukoy kay Epafras sa naunang talata. Likas sa Tagalog ang sugnay na “siya ... ang nagbalita” upang ipahayag na ipinaalam niya kina Pablo at sa mga kasama nito ang tungkol sa pag-ibig ng mga taga-Colosas.
- source_word: καὶ
  choice: At ... rin
  rationale: Pinananatili ng “At” ang ugnayan sa naunang talata, at ipinahahayag ng “rin” ang dagdag na ginawa ni Epafras.
- source_word: ἡμῖν
  choice: sa amin
  rationale: Ang datibo ay di-tuwirang layon at tumutukoy kay Pablo at sa kanyang mga kasama.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: tungkol sa pag-ibig ninyo
  rationale: Ang ἀγάπη ay tuwirang isinaling “pag-ibig.” Idinagdag ang “tungkol sa” bilang likas na Tagalog na katambal ng “nagbalita,” nang hindi binabago ang nilalaman ng ibinalita.
- source_word: ἐν πνεύματι
  choice: sa Espiritu
  rationale: Malamang na tumutukoy ang anarthrous na πνεύματι sa Banal na Espiritu, gaya ng karaniwang gamit ni Pablo. Ang maikling “sa Espiritu” ay nagpapanatili sa anyo at bahagyang kalabuan ng parirala; inilalagay sa talababa ang di-tiyak na alternatibo.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι
  choice: Ang Banal na Espiritu ang malamang na tinutukoy sa “pag-ibig ninyo sa Espiritu.”
  alternative: “pag-ibig ninyo sa espiritu,” ibig sabihin, ang espirituwal ninyong pag-ibig
  rationale: Maaaring tukuyin ng parirala ang Banal na Espiritu o, sa mas pangkalahatang pagbasa, ang espirituwal na saklaw o katangian ng kanilang pag-ibig. Ginamit sa pangunahing teksto ang malamang na pagbasa ayon sa gamit ni Pablo, ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinili ang “nagbalita sa amin tungkol sa” bilang malinaw na pang-araw-araw ngunit angkop na katumbas ng δηλόω; iniwasan ang mas mabigat na “ipinahayag.” Ginamit ang malaking titik sa “Espiritu” para sa pangunahing pagbasa na Banal na Espiritu, habang pinanatili sa talababa ang maliit na titik na alternatibo.
