  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: tl
  text: At siya ang ulo ng katawan, ang iglesya. Siya ang pasimula[a], ang panganay mula sa mga patay, upang siya mismo ay maging pangunahin sa lahat ng bagay[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagmulan” o “tagapamahala” ang salitang isinaling “pasimula” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magkaroon ng unang dako sa lahat ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: siya / siya mismo
  rationale: Pinananatili ng “siya” ang tahasang paksa, at ng “siya mismo” sa huling sugnay ang diin ng Griyegong panghalip.
- source_word: κεφαλή
  choice: ulo
  rationale: Tuwirang katumbas ito na nagpapanatili sa metapora at hindi ito nililimitahan sa kahulugang awtoridad o pinagmulan lamang.
- source_word: σῶμα
  choice: katawan
  rationale: Likas na katumbas sa Filipino at pinananatili ang larawang kaakibat ng “ulo.”
- source_word: ἐκκλησία
  choice: iglesya
  rationale: Karaniwan at nauunawaang katawagan sa sambayanan ng mga mananampalataya sa kontekstong Paulino.
- source_word: ἀρχή
  choice: pasimula
  rationale: Kaayon ito ng kasunod na “panganay mula sa mga patay” at pinananatili ang diwa ng pagsisimula nang hindi isinasara ang posibleng kahulugang pinagmulan o tagapamahala.
- source_word: πρωτότοκος
  choice: panganay
  rationale: Pinananatili nito ang anyong leksikal at ang mga ugnay nitong biblikal sa pagkakasunod at kataasan ng katayuan.
- source_word: ἐκ τῶν νεκρῶν
  choice: mula sa mga patay
  rationale: Natural na pananalita sa Filipino para sa pagkabuhay na muli habang malinaw na tinutukoy ang paglabas mula sa kalipunan ng mga patay.
- source_word: ἵνα γένηται
  choice: upang ... ang manguna
  rationale: Ipinahahayag ng “upang” ang layunin o kinalabasan; sa Filipino, ang kabuuang parirala ay natural na naghahatid ng pagkakaroon ng unang dako.
- source_word: ἐν πᾶσιν
  choice: sa lahat ng bagay
  rationale: Pinananatili nito ang malawak at malamang na neuter na saklaw ng parirala.
- source_word: πρωτεύων
  choice: manguna
  rationale: Natural itong nagpapahayag ng paghawak sa unang dako; nililinaw sa talababa ang mas tahasang alternatibo.
theological_decisions:
- issue: Kahulugan ng κεφαλή sa metaporang Cristo-katawan
  choice: Panatilihin bilang “ulo.”
  alternative: pinuno o pinagmulan
  rationale: Pinananatili ng “ulo” ang mayamang metapora at hindi nilulutas ang pagtatalo kung awtoridad, pinagmulan, o kapwa ang pangunahing diin.
- issue: Kahulugan ng ἀρχή kaugnay ng pagkabuhay na muli at bagong paglikha
  choice: pasimula
  alternative: pinagmulan o tagapamahala
  rationale: Ang “pasimula” ang pinakanababagay sa kalapit na “panganay mula sa mga patay,” ngunit inilalahad sa talababa ang tunay na saklaw ng salitang Griyego.
- issue: Diwa ng πρωτότοκος ἐκ τῶν νεκρῶν
  choice: panganay mula sa mga patay
  alternative: unang nabuhay mula sa mga patay
  rationale: Pinananatili nito ang anyong biblikal at kapwa ang pahiwatig ng pagkakasunod at kataasan, sa halip na gawing pagkakasunod lamang ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga pangunahing metaporang “ulo,” “katawan,” at “panganay.” Ginamit ang “iglesya” bilang malawak na nauunawaang terminong eklesyal, at iniwasan ang pagpapasok ng denominasyonal na paliwanag.
