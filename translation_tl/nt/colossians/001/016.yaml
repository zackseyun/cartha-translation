id: COL.1.16
reference: Colossians 1:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: tl
  text: Sapagkat sa kanya nilikha ang lahat ng bagay—ang nasa mga langit at nasa lupa, ang nakikita at ang hindi nakikita, maging mga trono, mga paghahari, mga pinuno, o mga kapangyarihan[a]; ang lahat ng bagay ay nilikha sa pamamagitan niya at para sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga trono, mga paghahari, mga pinuno, at mga kapangyarihan” ay maaaring tumukoy sa mga ranggo o uri ng nilikhang mga may kapangyarihan; hindi tinutukoy rito kung espirituwal o makalupa ang mga ito.
    reason: Pinananatili ang leksikal at ontolohikal na kalabuan ng listahan.
  - marker: b
    text: O “tungo sa kanya”; ipinahahayag ng Griyego na siya ang layunin o hantungan ng paglikha.
    reason: Itinatala ang mas literal na direksiyonal na diwa ng εἰς αὐτόν.
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang sanhi o batayan ng naunang pahayag tungkol sa kataasan ng Anak.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang diwa ng ἐν at hindi ito ginagawang tahasang instrumental na “sa pamamagitan niya,” sapagkat ginagamit sa hulihan ang δι’ αὐτοῦ para sa ideyang iyon.
- source_word: ἐκτίσθη / ἔκτισται
  choice: nilikha / ay nilikha
  rationale: Ang una ay tumutukoy sa naganap na paglikha; ang ikalawa ay perpektong anyo na nagpapahiwatig ng naganap na paglikha na nananatiling may bisa. Sa natural na Tagalog, kapwa malinaw na naihahatid ng “nilikha,” na may “ay” sa ikalawang sugnay.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak at komprehensibong saklaw nang hindi dinaragdagan ng interpretasyong “buong sansinukob.”
- source_word: ἐν τοῖς οὐρανοῖς
  choice: sa kalangitan
  rationale: Natural na kolektibong Tagalog para sa pangmaramihang Griyegong “mga langit,” habang nananatili ang kosmikong saklaw.
- source_word: ἐπὶ τῆς γῆς
  choice: sa ibabaw ng lupa
  rationale: Malapit sa anyo ng Griyego at malinaw na katambal ng “sa kalangitan.”
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: ang mga nakikita at ang mga hindi nakikita
  rationale: Malinaw at likas na substantibong paggamit sa Tagalog, na pinananatili ang buong paghahambing.
- source_word: εἴτε ... εἴτε ... εἴτε ... εἴτε
  choice: maging ... o ...
  rationale: Likas na Tagalog para sa seryeng nagbibigay ng magkakaibang halimbawa nang hindi binabago ang saklaw nito.
- source_word: θρόνοι
  choice: mga trono
  rationale: Tuwirang salin na pinananatili ang metaporikal o ranggong kahulugan nang hindi ito ipinapaliwanag sa mismong teksto.
- source_word: κυριότητες
  choice: mga paghahari
  rationale: Naghahatid ng ideya ng mga saklaw o ranggo ng pamamahala; hindi tahasang tinutukoy kung espirituwal o makalupa ang mga ito.
- source_word: ἀρχαὶ
  choice: mga pinuno
  rationale: Nauunawaan sa modernong Tagalog at naihihiwalay sa ἐξουσίαι nang hindi gumagamit ng teknikal na “mga prinsipalidad.”
- source_word: ἐξουσίαι
  choice: mga kapangyarihan
  rationale: Natural na tawag sa mga may kapangyarihan o awtoridad; pinananatili ang posibleng pagtukoy sa mga ranggo ng nilikhang kapangyarihan.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Malinaw na ipinahahayag ang mediatorial o instrumental na ugnayan ng Anak sa paglikha.
- source_word: εἰς αὐτόν
  choice: para sa kanya
  rationale: Natural na Tagalog na nagpapahayag na siya ang layunin o hantungan ng paglikha; ang higit na literal na “tungo sa kanya” ay inilalagay sa talababa.
theological_decisions:
- issue: Ugnayan ng Anak sa paglikha sa ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: Panatilihin ang magkakaibang pananalitang “sa kanya ... sa pamamagitan niya ... para sa kanya.”
  alternative: Gawing pare-parehong instrumental, gaya ng “sa pamamagitan niya ... sa pamamagitan niya,” o isalin ang hulihan na “tungo sa kanya.”
  rationale: Sinasadyang gumamit ang Griyego ng magkakaibang pang-ukol. Ang salin ay hindi dapat magpantay sa magkakaibang ugnayan ng Anak bilang konteksto o saklaw, tagapamagitan, at layunin ng paglikha.
- issue: Pagkakakilanlan ng “mga trono, mga paghahari, mga pinuno, o mga kapangyarihan”
  choice: Iwan ang mga ito bilang mga uri o ranggo ng nilikhang kapangyarihan nang hindi tahasang tinatawag na mga anghel o pamahalaang pantao.
  alternative: Tukuyin ang mga ito bilang eksklusibong mga orden ng anghel o bilang mga institusyong pampolitika.
  rationale: Hindi tiyak na nililimitahan ng talata ang mga katawagang ito sa isang uri lamang; pinananatili ng salin ang ambiguwidad ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kalangitan” bilang likas na kolektibong katumbas ng pangmaramihang “mga langit,” at pinanatili ang iisang pangungusap at tuldok-kuwit upang masundan ang estruktura ng Griyego.
