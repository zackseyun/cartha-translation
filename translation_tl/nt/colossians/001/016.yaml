- from: Sapagkat sa kanya nilikha ang lahat ng bagay[a] sa kalangitan at sa ibabaw ng lupa, ang mga nakikita at ang mga hindi nakikita, maging mga trono, mga paghahari, mga pinuno, o mga kapangyarihan[b]; ang lahat ng bagay ay nilikha sa pamamagitan niya at para sa kanya.[c]
  to: Sapagkat sa kanya nilikha ang lahat ng bagay—ang nasa mga langit at nasa lupa, ang nakikita at ang hindi nakikita, maging mga trono, mga paghahari, mga pinuno, o mga kapangyarihan[a]; ang lahat ng bagay ay nilikha sa pamamagitan niya at para sa kanya.[b]
