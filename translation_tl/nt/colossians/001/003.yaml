id: COL.1.3
reference: Colossians 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: tl
  text: Lagi kaming nagpapasalamat sa Diyos, ang Ama ng ating Panginoong Jesu-Cristo,[a] habang ipinapanalangin namin kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jesus na Mesiyas.” Ang “Cristo” ay titulong nangangahulugang “Mesiyas,” o “Pinahiran.”
    reason: Pinananatili ang malinaw na titularyong kahulugan ng Χριστός bilang alternatibong salin.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: nagpapasalamat kami
  rationale: Tuwirang ipinahahayag ng pandiwa ang pasasalamat; natural sa makabagong Tagalog ang aspektong imperpektibo sa paulit-ulit na gawain.
- source_word: τῷ θεῷ πατρὶ
  choice: sa Diyos, na Ama
  rationale: Itinuturing ang πατρί na apposition sa θεῷ; nililinaw ng “na Ama” ang ugnayan nang hindi ito ginagawang dalawang magkahiwalay na titulo.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang pamagat na κύριος bilang “Panginoon” at ang inklusibong unang panauhang maramihan ng ἡμῶν bilang “ating.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Ang “Jesu-Cristo” ang natural, marangal, at malawak na kinikilalang anyo sa Tagalog; ipinapaliwanag sa talababa ang literal na titularyong kahulugan ng Χριστός.
- source_word: πάντοτε
  choice: lagi
  rationale: Tumpak at natural na katumbas ng “palagi/sa lahat ng panahon,” at inilapit sa pangunahing pandiwa.
- source_word: περὶ ὑμῶν
  choice: kayo
  rationale: Sa konteksto ng panalangin, ang περί + genitive ay tumutukoy sa mga taong ipinapanalangin; sapat at idiomatiko ang “ipinapanalangin namin kayo.”
- source_word: προσευχόμενοι
  choice: kapag ipinapanalangin namin kayo
  rationale: Ipinahahayag ang kasabay o kaugnay na kalagayan ng participle sa natural na Tagalog, habang iniiwasang tiyakang ipasya na ang πάντοτε ay pangunahing tumutukoy sa pananalangin.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo o nakaugaliang pangalan
  choice: Jesu-Cristo, na may talababa na “Jesus na Mesiyas”
  alternative: Jesus na Mesiyas
  rationale: May buhay na titularyong diwa ang Χριστός, ngunit sa natural na modernong Tagalog, “Jesu-Cristo” ang nakaugaliang marangal na anyo. Ang talababa ay nagpapanatili sa kahulugang “Mesiyas” nang hindi nagpapakilala ng denominasyonal na pagbasa.
- issue: Ugnayan ng Diyos at Ama sa θεῷ πατρὶ
  choice: sa Diyos, na Ama ng ating Panginoon
  alternative: sa Diyos na Ama ng ating Panginoon
  rationale: Pinananatili ang appositional na posibilidad ng Griyego at nililinaw na ang Diyos ang tinutukoy bilang Ama ng Panginoong Jesus.
- issue: Saklaw ng πάντοτε
  choice: Lagi kaming nagpapasalamat ... kapag ipinapanalangin namin kayo
  alternative: Nagpapasalamat kami ... tuwing lagi namin kayong ipinapanalangin
  rationale: Pinakamalamang na binabago ng πάντοτε ang pangunahing pandiwang “nagpapasalamat,” ngunit hindi sobrang hinihigpitan ang ugnayan nito sa participial na parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lagi” sa halip na mas pormal na “palagi,” at ang tradisyonal ngunit buhay na anyong “Jesu-Cristo.” Ang kuwit at “na” ay tumutulong upang malinaw na apposition ang “Ama.”
