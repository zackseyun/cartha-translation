  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: tl
  text: nang mabalitaan namin ang inyong pananampalataya sa Mesiyas na si Jesus[a] at ang pag-ibig ninyo sa lahat ng mga banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inyong pagtitiwala sa Mesiyas na si Jesus” o “inyong katapatan sa Mesiyas na si Jesus.” Maaaring taglayin ng salitang Griego na pistis ang magkakaugnay na mga kahulugang ito depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: nang mabalitaan namin
  rationale: Ipinapakita ng “nang” ang ugnayan ng aorist participle sa naunang pahayag tungkol sa pagpapasalamat. Likas sa Filipino ang “mabalitaan” kapag ang narinig ay isang ulat tungkol sa kalagayan ng iba.
- source_word: τὴν πίστιν ὑμῶν
  choice: ang inyong pananampalataya
  rationale: Ang “pananampalataya” ang malinaw at karaniwang katumbas ng πίστις sa kontekstong ito, habang pinananatili sa talababa ang kaugnay na mga posibleng diwa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at ang Ἰησοῦ bilang pangalang “Jesus.” Ang “sa” ay natural na Filipino para sa pananampalatayang nakatuon at nakaugnay sa isang persona, nang hindi ito pinapaliit sa simpleng direksiyon lamang.
- source_word: τὴν ἀγάπην ἣν ἔχετε
  choice: ang pag-ibig ninyo
  rationale: Likas na ipinahahayag ng anyong paari sa Filipino ang pag-ibig na taglay nila; hindi kailangang ulitin nang mekanikal ang “na taglay ninyo.”
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: sa lahat ng mga banal
  rationale: Ang “sa” ay idiomatikong nagpapahayag kung kanino iniuukol ang pag-ibig. Pinananatili ng “mga banal” ang katawagan ni Pablo sa mga taong ibinukod para sa Diyos.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ bilang titulo o wari’y bahagi ng pangalan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Ang Χριστός ay isang titulo sa pariralang ito, kaya isinalin itong “Mesiyas,” samantalang pinanatili bilang pangalan ang “Jesus.”
- issue: Saklaw ng kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala o katapatan
  rationale: Sa agarang konteksto, pinakamalamang na tinutukoy ang pananampalataya ng mga taga-Colosas na nakaugnay sa Mesiyas na si Jesus. Gayunman, maaari ring magdala ang πίστις ng magkaugnay na mga diwang “pagtitiwala” at “katapatan,” kaya hindi tahimik na inaalis ang mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mabalitaan” sa halip na literal na “marinig” dahil ulat tungkol sa pananampalataya at pag-ibig ang tinutukoy. Ang talata ay nananatiling nakaugnay sa pangungusap ng naunang bersikulo.
