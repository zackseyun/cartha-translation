  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: tl
  text: 'Sa mga banal at tapat[a] na kapatid[b] sa Colosas, na nasa Mesiyas[c]: Biyaya sa inyo at kapayapaan mula sa Diyos na ating Ama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nananampalataya.” Ang Griyegong πιστοῖς ay maaaring tumukoy sa mga naniniwala o sa mga tapat.
    reason: lexical_alternative
  - marker: b
    text: Panlalaking maramihan ang salitang Griyego, na literal na “mga kapatid na lalaki”; sa kontekstong ito, malamang na kinakausap ni Pablo ang buong pamayanan, kasama ang mga babae.
    reason: lexical_alternative
  - marker: c
    text: 'Tradisyonal na salin: “kay Cristo.” Ang titulong Griyego na Χριστός ay nangangahulugang “Mesiyas”; literal na “nasa Mesiyas” ang parirala rito.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: na nasa Colosas
  rationale: Tinutukoy ng parirala ang kinaroroonan ng mga tatanggap. Likas sa modernong Tagalog ang “nasa Colosas” at malinaw nitong pinananatili ang lokatibong diwa.
- source_word: ἁγίοις
  choice: banal
  rationale: Pang-uri rito ang ἁγίοις at inilalarawan ang mga kapatid bilang nakatalaga sa Diyos. Ang “banal” ang tuwirang katumbas at hindi nagdaragdag ng mas huling teknikal na diwa ng isang natatanging uri ng ‘santo.’
- source_word: πιστοῖς
  choice: tapat
  rationale: Maaaring tumukoy ang πιστοῖς sa pagiging tapat o sa pagiging nananampalataya. Ang “tapat” ay natural na paglalarawan sa kontekstong ito, habang inilalagay sa talababa ang lehitimong alternatibo upang hindi alisin ang semantikong pag-igting.
- source_word: ἀδελφοῖς
  choice: kapatid
  rationale: Ang “mga kapatid” ang natural na panawag sa isang kongregasyon sa Tagalog at maaari nitong saklawin ang mga lalaki at babae. Ipinaliliwanag sa talababa na panlalaking maramihan ang anyo ng salitang Griyego.
- source_word: ἐν Χριστῷ
  choice: kay Mesiyas
  rationale: Sa Tagalog, likas na ipinahahayag ng “kay Mesiyas” ang ugnayan at pagkakakilanlan ng mga kapatid sa Mesiyas. Pinananatili ang titulo sa halip na gawing pangalang pantangi lamang; itinatala sa talababa ang tradisyonal na “Cristo” at ang literal na larawang “nasa Mesiyas.”
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Sumainyo ang biyaya at kapayapaan
  rationale: Natural at marangal itong pormula ng pagbati sa Tagalog at pinananatili ang pagkakasunod ng biyaya at kapayapaan.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: mula sa Diyos na ating Ama
  rationale: 'Binabasa ang πατρὸς ἡμῶν bilang paglilinaw kung sino ang Diyos: siya ang ating Ama. Hindi nagdaragdag ng pangatnig na wala sa Griyego.'
theological_decisions:
- issue: Kahulugan ng πιστοῖς
  choice: tapat
  alternative: nananampalataya
  rationale: Pinahihintulutan ng Griyego ang parehong diwa at hindi lubusang pinagpapasiya ng konteksto kung alin ang nangingibabaw. Pinili ang “tapat” sa pangunahing teksto at pinanatili ang “nananampalataya” sa talababa.
- issue: Saklaw ng kasarian sa ἀδελφοῖς
  choice: kapatid
  alternative: mga kapatid na lalaki
  rationale: Panlalaking maramihan ang anyong Griyego, ngunit karaniwang ginagamit sa mga liham ni Pablo para sa buong pamayanan, malamang kasama ang mga babae. Ang natural na “kapatid” sa Tagalog ay hindi sapilitang naglilimita sa kasarian, at nililinaw ng talababa ang anyo ng orihinal.
- issue: Pagsasalin ng Χριστῷ bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang “Mesiyas.” Pinananatili sa pangunahing teksto ang kahulugan ng titulo, habang ibinibigay sa talababa ang tradisyonal na salin.
- issue: Larawan ng pakikiisa sa ἐν Χριστῷ
  choice: kay Mesiyas
  alternative: nasa Mesiyas
  rationale: Mas natural sa Tagalog ang “kay Mesiyas” para sa ugnayang tinutukoy, ngunit hindi dapat mawala ang masinsing larawang “nasa Mesiyas” ng Griyego; kaya itinatala rin ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pormulang “Sumainyo” bilang likas na pagbating liham, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
