  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ang Diyos ang kusang nagpasiyang magpabatid, ang hiwaga ay iniuugnay sa mga Hentil, at ang nagpapaliwanag na sugnay ay tumutukoy sa Mesiyas na “nasa inyo.” Gayunman, ang “kung gaano kasagana ang kaluwalhatian” ay bahagyang lumalabo sa πλοῦτος (“kayamanan/kasaganaan”) bilang inilalarawan ng δόξης. Ang rebisyon ay mas malinaw na naghahayag ng “maluwalhating kayamanan” nang hindi pinipilit ang siksik na sintaks ng Griyego.'
  naturalness: Marangal at natural ang rehistro. Mas matatas sa modernong Filipino ang “kung gaano kayaman at kaluwalhatian ang hiwagang ito” kaysa “kung gaano kasagana ang kaluwalhatian,” habang pinananatili ang diin sa yaman at kaluwalhatian. Ang “nasa inyo” at ang talababa nitong alternatibo ay kapwa natural.
  terminology: Ang “Diyos,” “hiwaga,” “mga Hentil,” at “Mesiyas” ay angkop at pare-pareho sa biblikal na rehistro. Ang “Mesiyas” ay wastong pagpapanatili sa titulong Χριστός. Napananatili rin ng talababa ang di-nalulutas na saklaw ng ἐν ὑμῖν.
