  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: tl
  text: 'Sa kanila minabuti ng Diyos na ipaalam kung gaano kayaman at kaluwalhatian ang hiwagang ito sa gitna ng mga Hentil: ito ay ang Mesiyas na nasa inyo[a], ang pag-asa sa kaluwalhatian.


    [a] O “nasa gitna ninyo.” Maaaring tumukoy ang pariralang Griyego sa Mesiyas na nananahan sa mga mananampalataya o sa presensiya niya sa gitna nila bilang isang sambayanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa gitna ninyo.” Maaaring tumukoy ang pariralang Griyego sa Mesiyas na nananahan sa mga mananampalataya o sa presensiya niya sa gitna nila bilang isang sambayanan.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Sa kanila
  rationale: Tumutukoy ang panghalip sa mga banal sa naunang talata at nagsisilbing di-tuwirang layon ng γνωρίσαι.
- source_word: ἠθέλησεν
  choice: minabuti
  rationale: Ipinahahayag nito ang kusang pasiya at kalooban ng Diyos sa natural at marangal na Tagalog, nang hindi labis na pinatitigas bilang isang teknikal na pahayag tungkol sa kalooban.
- source_word: γνωρίσαι
  choice: na ipaalam
  rationale: Tuwirang ipinapahayag ang diwang ‘gawing kilala’ o ‘ipabatid’ ng γνωρίζω.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: kung gaano kasagana ang kaluwalhatian
  rationale: Natural na inililipat sa Tagalog ang siksik na pariralang Griyego tungkol sa laki o yaman ng kaluwalhatian; iniiwasan ang hindi likas na ‘kung ano ang kayamanan ng kaluwalhatian.’
- source_word: μυστηρίου
  choice: hiwaga
  rationale: Sa kontekstong Paulino, ito ay layunin ng Diyos na dating nakatago ngunit ngayo’y ipinahayag, hindi isang palaisipang imposibleng malaman.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa gitna ng mga Hentil
  rationale: Ipinakikita ng ‘mga Hentil’ ang kontekstuwal na pagtukoy sa mga hindi Judio, at ng ‘sa gitna’ ang saklaw ng pagpapahayag ng hiwaga.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo sa pagpapakilala sa nilalaman ng hiwaga.
- source_word: ἐν ὑμῖν
  choice: nasa inyo
  rationale: Pinananatili nito ang tuwirang diwa ng Griyego habang hindi ganap na nilulutas kung ang tinutukoy ay panananahan sa mga mananampalataya o presensiya sa gitna ng sambayanan; ibinigay sa talababa ang alternatibo.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: ang pag-asa sa kaluwalhatian
  rationale: Natural na Tagalog ito para sa siksik na genitibong parirala at ipinakikitang ang kaluwalhatian ang inaasahan, nang hindi dinaragdagan ang teksto ng tahasang paliwanag.
theological_decisions:
- issue: Pagtukoy kay Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Malinaw na titulo ang gamit dito sapagkat kinikilala ng sugnay kung ano ang hiwaga; pinananatili rin nito ang mesiyanikong bigat ng salita.
- issue: Kahulugan ng ἐν ὑμῖν
  choice: nasa inyo
  alternative: nasa gitna ninyo
  rationale: Maaaring tumukoy ang maramihang ‘in you’ sa panloob na panananahan o sa presensiya sa loob ng sambayanan. Pinili sa teksto ang mas tuwirang anyo at pinanatili sa talababa ang korporatibong pagbasa.
- issue: Kahulugan ng ἡ ἐλπὶς τῆς δόξης
  choice: ang pag-asa sa kaluwalhatian
  alternative: ang pag-asa ng kaluwalhatian
  rationale: Ang ‘pag-asa sa kaluwalhatian’ ay mas malinaw sa karaniwang Tagalog, ngunit nananatiling maikli at hindi tinutukoy nang higit sa sinasabi ng Griyego kung paano o kailan matatamo ang kaluwalhatian.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Hentil,’ ‘hiwaga,’ at ‘Mesiyas’ bilang pamilyar na terminong biblikal, habang inayos ang siksik na pariralang Griyego sa natural na sintaks ng Tagalog. Pinanatili ang ambiguwidad ng ἐν ὑμῖν sa pamamagitan ng talababa.
