    rationale: Ang “kung gaano kasagana ang kaluwalhatian” ay maaaring unawain bilang dami ng kaluwalhatian, ngunit hindi gaanong malinaw ang “kayamanan/kasaganaan ng kaluwalhatian” na nasa Griyego. Ang “kung gaano kayaman at kaluwalhatian ang hiwagang ito” ay idiomatikong Tagalog na pinananatili ang dalawang diin.
