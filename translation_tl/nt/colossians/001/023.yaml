id: COL.1.23
reference: Colossians 1:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: tl
  text: kung tunay ngang nananatili kayo sa pananampalataya—nakasalig sa pundasyon at matatag, at hindi nailalayo mula sa pag-asa ng magandang balitang inyong narinig. Ang magandang balitang ito ay ipinahayag sa buong sangnilikha sa silong ng langit[a], at ako, si Pablo, ay naging lingkod nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa bawat nilalang sa silong ng langit.” Ang κτίσις ay maaaring mangahulugang “sangnilikha” o, sa ilang konteksto, “nilalang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagapaglingkod” o “ministro.” Ang Griyegong διάκονος ay maaaring tumukoy sa isang lingkod o ministro, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: kung tunay ngang
  rationale: Pinananatili ang tunay na kondisyon ng εἰ at ang diin ng γε nang hindi ipinapalagay na tiyak o imposibleng hindi matupad ang kondisyon.
- source_word: ἐπιμένετε τῇ πίστει
  choice: nananatili kayo sa pananampalataya
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang patuloy na pananatili; ang “pananampalataya” ang likas at pangunahing katumbas ng πίστις sa kontekstong ito.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: nakatatag sa pundasyon at matibay
  rationale: Pinananatili ang larawang panggusali ng τεθεμελιωμένοι at ang katatagan ng ἑδραῖοι sa natural na Filipino.
- source_word: μὴ μετακινούμενοι
  choice: hindi natitinag palayo
  rationale: Ipinahihiwatig ang pag-aalis mula sa isang matatag na kalagayan at pinananatili ang diwang pasibo ng participle.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: mula sa pag-asa ng magandang balita
  rationale: Pinananatili ang ugnayang genitive at ang maaaring saklaw nito—ang pag-asang kaugnay ng o dulot ng magandang balita—nang hindi ito labis na nililinaw.
- source_word: τοῦ κηρυχθέντος
  choice: ipinahayag
  rationale: Inilalarawan ang hayagang pagpapalaganap ng mensahe nang hindi gumagamit ng salitang may di-kinakailangang institusyonal na himig.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: sa buong sangnilikha sa silong ng langit
  rationale: Ang “sangnilikha” ay nagpapanatili sa malawak at kosmikong diwa ng κτίσις, habang inilalagay sa talababa ang posibleng kahulugang tumutukoy sa bawat nilalang.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: at ako, si Pablo, ay naging lingkod nito
  rationale: Malinaw na tumutukoy ang “nito” sa magandang balita; ang “lingkod” ay tuwirang katumbas na umiiwas sa institusyonal na kahulugang maaaring taglayin ng “ministro.”
theological_decisions:
- issue: Kondisyon ng εἴ γε at pagpapatuloy sa pananampalataya
  choice: kung tunay ngang nananatili kayo
  alternative: yamang nananatili kayo; kung magpapatuloy kayo na nagpapahiwatig ng tiyak na posibilidad ng pagkawala ng kaligtasan
  rationale: Naglalahad ang Griyego ng may-diin na kondisyon, ngunit hindi nito mag-isang nilulutas ang mas malawak na pagtatalo tungkol sa katiyakan, pagtitiyaga, o pagtalikod.
- issue: Kahulugan ng πίστις sa τῇ πίστει
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Ang “pananampalataya” ang pinakanatural na pangunahing kahulugan dito at hindi kinakailangang paliitin ito tungo lamang sa pansariling pagtitiwala o asal na katapatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magandang balita” para sa εὐαγγέλιον at pinanatili ang metapora ng pundasyon. Hinati sa dalawang pangungusap ang mahabang estrukturang Griyego para sa likas na daloy, ngunit nananatiling malinaw na ang mga sugnay ay tumutukoy sa magandang balita.
