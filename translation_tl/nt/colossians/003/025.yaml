  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: tl
  text: Sapagkat ang gumagawa ng mali ay tatanggap ng nararapat na balik sa maling ginawa niya[a], at walang pagtatangi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sapagkat ang gumagawa ng mali ay tatanggap ng balik dahil sa maling ginawa niya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “walang pagkiling.” Sa literal, “pagtanggap ng mukha,” isang idyomang tumutukoy sa pagkiling batay sa panlabas na anyo o katayuan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Sapagkat ang gumagawa ng mali
  rationale: Ang may artikulong pangkasalukuyang pandiwaring ἀδικῶν ay tumutukoy sa sinumang gumagawa ng mali. Isinasalin ng “Sapagkat” ang paliwanag na gamit ng γάρ, habang pinananatili ng parirala ang pangkalahatang saklaw nang hindi nililimitahan sa isang partikular na tao.
- source_word: κομίσεται
  choice: ay tatanggap ng kabayaran
  rationale: Sa kontekstong ito, ang κομίσεται ay tumutukoy sa pagtanggap ng nararapat na balik bunga ng ginawa. Natural sa Filipino ang “tatanggap ng kabayaran” at malinaw ang diwa ng makatarungang pagganti nang hindi tinutukoy kung kailan o sa anong paraan ito magaganap.
- source_word: ὃ ἠδίκησεν
  choice: sa maling ginawa niya
  rationale: Tinutukoy ng parirala ang maling gawa na nagawa na. Pinananatili ng “maling ginawa niya” ang malinaw na ugnayan nito sa naunang “gumagawa ng mali.”
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: walang pagtatangi
  rationale: Ang προσωπολημψία ay pagkiling batay sa katayuan o panlabas na kalagayan. Ang “walang pagtatangi” ay maikli, dignificado, at karaniwang nauunawaan sa modernong Filipino.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: ang gumagawa ... niya
  rationale: Bagaman panlalaking isahan ang anyong gramatikal sa Griyego, pangkalahatan ang tinutukoy nito. Ang “niya” sa Filipino ay likas na walang tinutukoy na kasarian at napapanatili ang isahang anyo at pangkalahatang diwa.
theological_decisions:
- issue: Kalikasan at saklaw ng makatarungang pagganti at kawalan ng pagtatangi
  choice: Inihahayag ang pangkalahatang prinsipyo na tatanggap ng nararapat na kabayaran ang gumagawa ng mali at walang pagtatangi.
  alternative: Makitid na pagtukoy lamang sa paghuhukom sa wakas, o sa ugnayan lamang ng mga alipin at panginoon.
  rationale: Malawak ang pahayag ng Griyego at hindi nito tahasang itinatakda ang mekanismo, panahon, o eksklusibong konteksto ng pagganti. Pinananatili ng salin ang babala at ang teolohikal na tensiyon nang hindi dinaragdagan ang sinabi ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at dignificado. Ginamit ang pangkalahatang “ang gumagawa ng mali” at ang likas na walang-kasariang “niya.” Iniwasan ang mas teknikal o arkaikong pananalita at hindi nilimitahan ang pahayag sa isang tiyak na panahon ng paghuhukom.
