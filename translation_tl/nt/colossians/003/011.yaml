  source_fidelity: 'Kailangang iwasto ang panlunang pang-ugnay at ang bahagyang temporal na dagdag: ang ὅπου ay mas tumpak na “Kung saan” kaysa “Dito,” at ang οὐκ ἔνι ay “walang,” hindi kinakailangang “wala nang.” Ang pares na περιτομὴ καὶ ἀκροβυστία ay mga pangngalang abstrakto; “pagtutuli at di-pagtutuli” ang mas tuwirang katumbas. Napananatili ng “ang Mesiyas ang lahat, at nasa lahat” ang saklaw at sadyang pagiging bukás ng τὰ πάντα at ἐν πᾶσιν.'
  naturalness: Ang binagong pangungusap ay marangal, malinaw, at likas sa modernong Filipino Tagalog. Ang mga pares na may “o” pagkatapos ng “walang” ay idiomatiko; ang “pagtutuli at di-pagtutuli” ay bahagyang mas pormal ngunit angkop sa rehistrong pangkasulatan at sa abstraktong anyo ng Griyego.
  terminology: Ang “Griego,” “Judio,” “barbaro,” “Scita,” “alipin,” “malaya,” at “Mesiyas” ay angkop. Iniingatan ang “barbaro” bilang makasaysayang katawagan at ang “Scita” bilang tiyak na pangalang-etniko. Inayos ang talababa upang tukuyin ang aktuwal na Griyegong anyo, hindi ang saling Filipino, bilang maikli at posibleng personal ang sanggunian.
