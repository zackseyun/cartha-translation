  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: tl
  text: Kung saan ay walang Griego o Judio, pagtutuli o di-pagtutuli, barbaro, Scita, alipin o malaya; kundi ang Mesiyas[a] ang lahat, at nasa lahat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griyegong Χριστός; tradisyonal na “Cristo.” Ang kahulugan ng titulo ay “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “nasa bawat isa.” Maikli ang Griyegong pariralang ἐν πᾶσιν at maaaring tumukoy sa lahat ng kabilang sa binagong pamayanan, bagaman hindi nito tahasang nililimitahan ang saklaw.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: Dito
  rationale: Tumutukoy sa saklaw ng binagong pagkatao sa naunang talata. Likas ito sa Tagalog at pinananatili ang diwang panlunan nang hindi nagdaragdag ng paliwanag.
- source_word: οὐκ ἔνι
  choice: wala nang
  rationale: Ipinahahayag na sa saklaw na ito ay hindi na umiiral bilang naghahating batayan ang mga sumusunod na pagkakakilanlan. Ang “nang” ay umaangkop sa konteksto ng pagbabagong inilarawan sa talata 10.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: Griego o Judio
  rationale: Pinananatili ang tiyak na pares na etniko-kultural. Ginamit ang “o” sa ilalim ng negatibong “wala” upang maging natural at malinaw sa Tagalog, nang hindi ginagawang mas malawak na “Hentil” ang Ἕλλην.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: tuli o di-tuli
  rationale: Natural na mga katawagang Filipino para sa magkasalungat na pagkakakilanlang panrelihiyon at panlipunan. Mas madaling maunawaan kaysa sa mabigat na literal na “pagtutuli at di-pagtutuli.”
- source_word: βάρβαρος
  choice: barbaro
  rationale: Pinananatili ang matalim at makasaysayang katawagan para sa itinuturing ng mga Griego na dayuhan o hindi sibilisado, sa halip na palambutin bilang “dayuhan.”
- source_word: Σκύθης
  choice: Scita
  rationale: Karaniwang anyong Filipino ng tiyak na pangalang etniko; hindi ito ginawang pangkalahatang katawagan.
- source_word: δοῦλος
  choice: alipin
  rationale: Malinaw na ipinakikita ang kalagayang hindi malaya, lalo na dahil tuwirang ipinapares ito sa ἐλεύθερος.
- source_word: ἐλεύθερος
  choice: malaya
  rationale: Likas at tuwirang kasalungat ng “alipin” sa Tagalog.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Pagkatapos ng negatibong talaan, natural na ipinakikilala ng “kundi” ang matinding pagsalungat at ang katotohanang nakasentro sa Mesiyas.
- source_word: τὰ πάντα
  choice: ang lahat
  rationale: Pinananatili ang maikli at malawak na pahayag tungkol sa ganap na kahalagahan ng Mesiyas nang hindi ito nililimitahan sa “lahat ng bagay” o pinapalawak sa isang paliwanag.
- source_word: ἐν πᾶσιν
  choice: nasa lahat
  rationale: Pinananatili ang kaiklian at tunay na kalabuan ng Griyego kung ang tinutukoy ay lahat ng tao sa bagong pamayanan o mas malawak na “lahat.”
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Isinasalin ang kahulugan ng titulong Χριστός sa natural na anyong Filipino. Ang tradisyonal na “Cristo” ay ibinibigay sa talababa.
theological_decisions:
- issue: Saklaw ng ἐν πᾶσιν
  choice: nasa lahat
  alternative: nasa bawat isa; nasa lahat ng tao; nasa lahat ng bagay
  rationale: Ang agarang konteksto ay tungkol sa mga taong kabilang sa binagong pamayanan, ngunit maikli at hindi ganap na tinutukoy ng Griyego ang saklaw. Pinananatili ng pangunahing salin ang kalabuang ito.
- issue: Pagsasalin ng Χριστός
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang teolohikal na titulo. Ipinahahayag ng “Mesiyas” ang kahulugan nito, habang kinikilala sa talababa ang nakaugaliang transliterasyon.
- issue: Diwa ng mga pagkakaiba sa talaan
  choice: wala nang Griego o Judio … alipin o malaya
  alternative: walang maaaring maging Griego o Judio …
  rationale: Hindi dinaragdagan ang teksto ng tahasang paliwanag na literal nang naglaho ang lahat ng etniko at panlipunang pagkakakilanlan. Ang pahayag ay nananatili sa kontekstuwal na saklaw ng bagong pagkatao at sa pagiging pangunahin ng Mesiyas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling magkapares na katawagan upang mapanatili ang retorikal na bagsak ng Griyego. Ang tuldok-kuwit bago ang “kundi” ay naghihiwalay sa talaan at sa dalawang magkaugnay na pahayag tungkol sa Mesiyas.
