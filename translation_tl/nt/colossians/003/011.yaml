    issue: “Dito ay wala nang” para sa ὅπου οὐκ ἔνι
    rationale: Ang “Dito” ay demonstratibong “here,” samantalang ang ὅπου ay pang-ugnay na “where/in which.” Dagdag din ng “nang” ang aspektong temporal na wala sa mismong parirala, kahit maaaring mahinuha mula sa konteksto.
