    rationale: Mas madaling mabasa ito bilang mga taong tuli o di-tuli. Gumagamit ang Griyego ng mga pangngalang abstrakto; “pagtutuli at di-pagtutuli” ang mas tapat na katumbas nang hindi binabago ang retorikal na talaan.
