  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: tl
  text: Sapagkat namatay na kayo, at ang buhay ninyo ay nakatago[a] kasama ng Mesiyas[b] sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “naitago na.” Maaaring idiin ng perpektong anyo sa Griyego ang kasalukuyang kalagayang bunga ng isang natapos na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: O, “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: namatay na kayo
  rationale: Ang aorist indicative ay tumutukoy sa tiyak at naganap nang pagkamatay ng mga mananampalataya; natural sa Filipino ang “namatay na kayo” at hindi nito pinalalabis ang aspektong patuloy na resulta.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan o batayan para sa naunang pahayag.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ang buhay ninyo
  rationale: Tuwirang pinananatili ang kahulugan ng ζωή at ang pangmaramihang pagtukoy sa mga kausap nang hindi dinaragdagan ang ipinahihiwatig nitong pakikiisa sa Mesiyas.
- source_word: κέκρυπται
  choice: ay nakatago
  rationale: Ang anyong perfect passive ay naglalarawan ng kasalukuyang kalagayang bunga ng naganap na pagkilos; malinaw at natural itong naipapahayag ng “nak atago” sa Filipino.
- source_word: σὺν τῷ Χριστῷ
  choice: kasama ng Mesiyas
  rationale: Ipinahahayag ng σύν ang pakikisama o pakikiisa. Isinalin ang Χριστός bilang titulong “Mesiyas” upang mapanatili ang kahulugan nitong ang Pinahiran.
- source_word: ἐν τῷ θεῷ
  choice: sa Diyos
  rationale: Pinananatili ng “sa Diyos” ang lokatibo o saklaw na ipinahahayag ng ἐν nang hindi ito ginagawang malayang pagpapakahulugan.
theological_decisions:
- issue: Kung isasalin ang Χριστῷ bilang titulo o anyong wari'y pantanging pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa kontekstong ito, ang Χριστός ay makabuluhang titulo para sa Pinahiran; gayunman, kinikilala sa talababa ang nakasanayang saling “Cristo.”
- issue: Ang ugnayan ng buhay ng mga mananampalataya, ng Mesiyas, at ng Diyos
  choice: “nakatago kasama ng Mesiyas sa Diyos”
  alternative: “nakatago sa piling ng Mesiyas at ng Diyos”
  rationale: Pinananatili ang magkaibang Griyegong parirala—σύν para sa pakikisama sa Mesiyas at ἐν para sa pagiging nasa Diyos—at hindi pinapantay ang dalawang ugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “ninyo” at “kayo” para sa pangmaramihang kausap, at pinanatili ang maikli ngunit teolohikal na masinsing ayos ng orihinal.
