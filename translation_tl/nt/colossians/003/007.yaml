  source_fidelity: Kailangang alisin ang “pa” sa “nabubuhay pa kayo,” dahil wala itong tuwirang katumbas sa ἐζῆτε at maaari itong magdagdag ng pahiwatig na ‘hanggang noon ay nabubuhay pa’ sa halip na ang dating kalagayan ng pamumuhay sa mga gawaing iyon. Ang “ganitong” ay mas malabo kaysa sa deiktikong “mga bagay na ito.” Ang pagpapanatili ng “lumakad” ay ligtas at angkop sa marangal na rehistrong biblikal, at malinaw na ibinubukod nito ang περιεπατήσατε mula sa ἐζῆτε.
  naturalness: Ang “lumakad ... nang namumuhay” ay bahagyang pormal ngunit natural at madaling unawain sa modernong Filipino Tagalog, lalo na sa rehistrong Kasulatan. Mas maayos ito kaysa sa “namuhay ... nabubuhay pa,” na kapwa inuugat sa iisang salita at may dagdag na implikasyon ang “pa.”
  terminology: Ang “lumakad” ay pinananatili bilang karaniwang biblikal na metapora para sa paraan ng pamumuhay; ang “namumuhay” ay isinasalin ang patuloy na dating kalagayan ng ἐζῆτε. Ang “mga bagay na ito” ay tapat na tumutukoy sa mga gawaing nabanggit sa naunang talata.
