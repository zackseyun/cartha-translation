  text: Sa mga bagay na ito ay lumakad din kayo noon, nang namumuhay kayo sa mga ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν οἷς
  choice: sa ganitong mga bagay
  rationale: Tumutukoy ang panghalip na maramihan sa mga masamang gawain sa naunang talata. Likas sa modernong Tagalog ang pariralang ito at naipahihiwatig ang saklaw ng pamumuhay sa mga iyon.
- source_word: καὶ ὑμεῖς
  choice: din kayo
  rationale: Pinananatili ng “din kayo” ang diin na maging ang mga taga-Colosas ay dating kabilang sa ganitong paraan ng pamumuhay.
- source_word: περιεπατήσατε
  choice: Namuhay
  rationale: Metaporikal dito ang literal na “lumakad” at tumutukoy sa asal o paraan ng pamumuhay. Mas malinaw at likas sa karaniwang Tagalog ang “namuhay,” samantalang inilalahad sa talababa ang mas literal na larawan.
- source_word: ποτε
  choice: noon
  rationale: Maikli at natural na ipinahahayag ng “noon” ang dating panahon na hindi na siyang kasalukuyang kalagayan.
- source_word: ὅτε
  choice: nang
  rationale: Ang “nang” ay likas na pang-ugnay sa panahong kasabay ng dating paraan ng pamumuhay.
- source_word: ἐζῆτε
  choice: nabubuhay pa kayo
  rationale: Ipinakikita ng anyong imperpekto ang nagpapatuloy na kalagayan noon. Ang “pa” ay natural na nagpapahiwatig na iyon ang dati nilang kalagayan.
- source_word: ἐν τούτοις
  choice: sa mga ito
  rationale: Muling tumutukoy ito sa mga kasalanan o gawaing nabanggit, at iniiwasan ang mabigat na pag-uulit ng buong parirala.
theological_decisions:
- issue: Ugnayan ng περιεπατήσατε at ἐζῆτε sa paglalarawan ng dating buhay
  choice: Isinalin bilang “Namuhay” at “nabubuhay pa” upang maipakita ang dating asal at ang nagpapatuloy na dating kalagayan, kahit may likas na pag-uulit sa Tagalog.
  alternative: “Lumakad” at “nabubuhay,” na mas mahigpit na nagpapanatili sa magkaibang pandiwang Griyego ngunit maaaring mapagkamalang literal ang paglakad.
  rationale: Hindi dapat ipasok ang karagdagang doktrina sa pagkakaiba ng dalawang pandiwa. Pinananatili ng salin ang magkapatong na paglalarawan ng dating asal at kalagayan, habang inuuna ang malinaw at natural na Tagalog; itinatala sa talababa ang metaporang literal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “namuhay” upang maging malinaw sa ordinaryong mambabasa, at pinanatili sa talababa ang mas literal na metapora ng paglakad.
