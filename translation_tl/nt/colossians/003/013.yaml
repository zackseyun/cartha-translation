base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: tl
  text: Magtiisan kayo at magpatawaran kung ang sinuman ay may reklamo[a] laban sa iba. Kung paanong pinatawad kayo ng Panginoon, gayundin naman ang gawin ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “kung ang sinuman ay may sama ng loob laban sa iba.”'
    reason: lexical_alternative
  - marker: b
    text: Walang pandiwang nakasaad sa hulihan ng Griyego; ipinahihiwatig mula sa konteksto ang “gawin” o “magpatawad.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: Magtiisan kayo
  rationale: Ipinahahayag ng “magtiisan” ang patuloy at kapwa-kapwang pagtanggap at pagtitiis sa loob ng pamayanan, nang hindi nagiging kasimpait ng kolokyal na “magtiis sa isa’t isa.”
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: magpatawaran
  rationale: Likas at maikli itong katumbas sa Filipino para sa kapwa-kapwang pagpapatawad; pinananatili rin nito ang ugnayang semantiko sa kasunod na ἐχαρίσατο.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: kung ang sinuman ay may reklamo laban sa iba
  rationale: Pinananatili nito ang pangkalahatan at di-tiyak na kondisyon. Ang “reklamo” ay karaniwang makabagong salita na hindi nagpapalakas sa diwa tungo sa pormal na paratang.
- source_word: καθὼς καὶ
  choice: Kung paanong ... gayundin naman
  rationale: Malinaw na ipinakikita ang paghahambing sa naunang pagpapatawad ng Panginoon at sa dapat gawin ng mga mananampalataya.
- source_word: ὁ κύριος
  choice: ang Panginoon
  rationale: Karaniwang salin ito ng titulong κύριος at hindi nito labis na tinutukoy sa teksto kung sino ang tinutukoy.
- source_word: ἐχαρίσατο ὑμῖν
  choice: pinatawad kayo
  rationale: Direkta at natural itong salin sa konteksto ng pagpapatawad sa kasalanan o pagkakasala.
- source_word: οὕτως καὶ ὑμεῖς
  choice: gayundin naman ang gawin ninyo
  rationale: Ginagawang natural sa Filipino ang elipsis sa Griyego habang hindi tahasang nagdaragdag ng modal na “dapat”; ang ipinahihiwatig na gawain ay malinaw sa konteksto.
theological_decisions:
- issue: Tinutukoy ng ὁ κύριος
  choice: Panatilihin ang titulong “ang Panginoon”
  alternative: Tahasang tukuyin bilang “si Cristo” o “ang Diyos”
  rationale: Malamang na tumutukoy ito kay Cristo sa konteksto at sa gamit ni Pablo, ngunit hindi iyon tahasang sinasabi ng parirala. Pinananatili ng salin ang anyo at posibleng tensiyon ng pinagmulan.
- issue: Elipsis sa pangwakas na sugnay
  choice: “gayundin naman ang gawin ninyo”
  alternative: “gayundin naman, magpatawad kayo” o panatilihing ganap na bitin ang sugnay
  rationale: Walang inuulit na pandiwa sa Griyego. Ang “ang gawin ninyo” ay nagpapanatili sa ipinahihiwatig na kilos at nagbibigay ng likas na pangungusap sa Filipino, samantalang ipinapaliwanag ng talababa ang elipsis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo/ninyo” ayon sa pakikipag-usap sa buong pamayanan. Iniwasan ang sobrang pormal na “hinanakit” bilang pangunahing salin, ngunit pinanatili sa talababa ang mas malapit na alternatibong “sama ng loob.”
