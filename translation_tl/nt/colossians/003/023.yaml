translation:
  language: tl
  text: Anuman ang inyong ginagawa, gawin ninyo nang buong puso, na para bang ginagawa ninyo ito para sa Panginoon[a] at hindi para sa mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Panginoon” ay maaari ring magpahiwatig ng “Amo” sa konteksto ng mga tagubilin tungkol sa sambahayan.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Anuman ang gawin ninyo
  rationale: 'Likas na ipinahahayag sa Filipino ang pangkalahatan at di-tiyak na saklaw ng parirala: anumang gawain ang gawin nila.'
- source_word: ἐκ ψυχῆς
  choice: nang buong puso
  rationale: Bagaman literal na “mula sa kaluluwa,” ang idyomatikong diwa ay taos, taimtim, at buong pagkataong paggawa. Ang “nang buong puso” ang natural at dignified na katumbas sa modernong Filipino.
- source_word: ἐργάζεσθε
  choice: gawin ninyo ito
  rationale: Ang pandiwa ay isang pautos na tumutukoy sa masikap na paggawa. Dahil nauuna na ang “gawin,” iniiwasan ng hulmaing ito ang mabigat na pag-uulit ng “magtrabaho,” habang pinananatili ang utos.
- source_word: ὡς τῷ κυρίῳ
  choice: na para sa Panginoon
  rationale: 'Ipinapakita ng ὡς ang pananaw o paraan ng paggawa: ituring ang gawain na ginagawa para sa Panginoon. Pinananatili ang karaniwang kristolohikal na titulong “Panginoon.”'
- source_word: καὶ οὐκ ἀνθρώποις
  choice: at hindi para sa mga tao
  rationale: Ang ἀνθρώποις ay pangkalahatang tumutukoy sa mga taong pinaglilingkuran, hindi lamang sa mga lalaking nasa hustong gulang; kaya ang “mga tao” ang tumpak at natural na salin.
theological_decisions:
- issue: Kahulugan ng κύριος sa konteksto ng mga tagubilin sa sambahayan
  choice: Panginoon
  alternative: panginoon o amo
  rationale: Ang κύριος ay pinakamalamang na tumutukoy sa itinaas na Panginoong Cristo, ngunit dahil nasa konteksto ito ng alipin at amo, maaaring marinig din ang bahid ng kahulugang “amo.” Hindi pinalitan ng “Amo” ang pangunahing kristolohikal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “nang buong puso” bilang karaniwang idyoma para sa ἐκ ψυχῆς; hindi kailangan ang talababa para rito dahil hindi nawawala ang pangunahing diwa. Ang “mga tao” ay angkop sa pangkalahatang kahulugan ng ἀνθρώποις.
