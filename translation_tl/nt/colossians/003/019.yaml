  naturalness: Hindi karaniwang idiom sa modernong Filipino ang “maging mapait sa [isang tao]” para sa sama ng loob o mapait na saloobin. Mas malinaw at natural ang “magkimkim ng sama ng loob laban sa kanila.”
  terminology: Ang “Mga asawang lalaki,” “inyong mga asawa,” at “mahalin ninyo” ay tumpak, malinaw, at angkop sa marangal na rehistro. Ang pangmaramihang mga anyo ay tumutugma sa Griyegong pagtawag sa pangkat.
