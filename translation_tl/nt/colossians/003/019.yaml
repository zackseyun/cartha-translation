  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: tl
  text: Mga asawang lalaki, mahalin ninyo ang inyong mga asawa at huwag kayong magkimkim ng sama ng loob laban sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag ninyo silang pakitunguhan nang malupit.” Ang pandiwang Griyego ay maaaring tumukoy sa pagiging mapait o sa pagkikimkim ng sama ng loob; sa kontekstong ito, maaari rin itong tumukoy sa malupit o mapagtanim na pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Mga asawang lalaki
  rationale: Bagaman maaaring mangahulugang “mga lalaki” ang ἄνδρες, malinaw sa konteksto ng mga tagubilin sa sambahayan at sa pagtukoy sa mga asawa na mga lalaking may-asawa ang kinakausap.
- source_word: ἀγαπᾶτε
  choice: mahalin ninyo
  rationale: Tuwirang ipinapahayag nito ang pautos na anyo at natural itong pakinggan sa makabagong Tagalog.
- source_word: τὰς γυναῖκας
  choice: ang inyong mga asawa
  rationale: Maaaring mangahulugang “mga babae” o “mga asawa” ang γυναῖκας, ngunit hinihingi ng kontekstong pangmag-asawa ang ikalawang kahulugan. Likas sa Tagalog na idagdag ang “inyong” upang linawin ang ugnayan.
- source_word: μὴ πικραίνεσθε
  choice: huwag kayong maging mapait
  rationale: Pinananatili nito ang larawang leksikal ng kapaitan at ang posibilidad na tumukoy ang anyong Griyego sa pagiging mapait o pagkikimkim ng sama ng loob, nang hindi ito agad nililimitahan sa panlabas na kalupitan.
- source_word: πρὸς αὐτάς
  choice: sa kanila
  rationale: Natural na Tagalog ito para sa direksiyon ng saloobin o asal na ipinahihiwatig ng πρός kasama ng accusative.
theological_decisions:
- issue: Tiyak na kasarian at ugnayang pangmag-asawa sa tagubilin
  choice: Panatilihin ang “Mga asawang lalaki” at “inyong mga asawa.”
  alternative: Gamitin ang mas malawak na “Mga lalaki” at “mga babae.”
  rationale: Ang konteksto at mga katawagang Griyego rito ay tumutukoy sa mga mag-asawa, hindi sa mga lalaki at babae sa pangkalahatan.
- issue: Kapaitan bilang saloobin o malupit na pakikitungo
  choice: Isalin sa pangunahing teksto bilang “maging mapait sa kanila.”
  alternative: “maging malupit sa kanila” o “pakitunguhan sila nang malupit.”
  rationale: Ang πικραίνεσθε ay maaaring maglarawan ng pagkakaroon ng mapait o mapagtanim na saloobin na nahahayag sa pakikitungo. Pinananatili ng salin ang tunay na leksikal na tensiyon; ipinaliliwanag sa talababa ang maaaring praktikal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “ninyo/kayong/inyong” ayon sa maramihang tuwirang pakikipag-usap ng Griyego. Inilagay ang talababa pagkatapos ng buong sugnay upang saklawin ang diwa ng “maging mapait sa kanila.”
