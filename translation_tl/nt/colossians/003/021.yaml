  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: tl
  text: Mga ama, huwag ninyong inisin ang inyong mga anak, upang hindi sila panghinaan ng loob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mawalan sila ng loob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Mga ama
  rationale: Tuwirang tumutukoy ang pangngalan sa mga ama. Pinananatili nito ang tiyak na kausap sa konteksto ng mga tagubilin sa sambahayan sa halip na gawing pangkalahatang “mga magulang.”
- source_word: μὴ ἐρεθίζετε
  choice: huwag ninyong galitin
  rationale: Sa kontekstong ito, ang ἐρεθίζω ay negatibong pagpukaw o pag-uudyok. Ang “galitin” ay natural sa modernong Tagalog at malinaw na tumutukoy sa asal ng ama na pumupukaw ng masamang tugon sa anak.
- source_word: τὰ τέκνα ὑμῶν
  choice: ang inyong mga anak
  rationale: Ang τέκνα ay inklusibong katawagan sa mga anak; natural at tumpak itong isinasalin bilang “mga anak.”
- source_word: ἵνα μὴ
  choice: upang hindi
  rationale: Pinananatili ng “upang hindi” ang layunin o inaasahang resultang ipinahahayag ng ἵνα na may μή.
- source_word: ἀθυμῶσιν
  choice: sila panghinaan ng loob
  rationale: Ang ἀθυμέω ay tumutukoy sa pagkawala ng sigla, tapang, o pag-asa. Ang “panghinaan ng loob” ay likas at malinaw na katumbas sa Tagalog habang pinananatili ang panloob na pagkasira ng loob.
theological_decisions:
- issue: Saklaw ng πατέρες sa tagubilin sa sambahayan
  choice: Tiyak na kinakausap ang mga ama
  alternative: Pangkalahatang kinakausap ang mga magulang
  rationale: Tahasan ang Griyegong “mga ama.” Bagaman maaaring mas malawak ang aplikasyon ng simulain, hindi dapat palitan ng salin ang tiyak na kausap ng pangkalahatang “mga magulang.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang “ninyong” bilang karaniwang anyo sa tuwirang pakikipag-usap sa maramihang kausap. Inilagay ang pananda ng talababa pagkatapos ng pariralang tinutukoy nito.
