id: COL.3.1
reference: Colossians 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: tl
  text: Kaya kung[a] binuhay kayong muli kasama ng Mesiyas[b], hanapin ninyo ang mga bagay sa itaas, kung saan naroon ang Mesiyas, na nakaupo sa kanan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kaya, yamang binuhay kayong muli kasama ng Mesiyas.” Pasubali ang anyong Griyego (“kung”), bagaman malamang na ipinapalagay nitong totoo ang kundisyon sa konteksto.
    reason: alternative_reading
  - marker: b
    text: 'Griyego: Christos; isinaling “Mesiyas” dito sapagkat ginagamit ito bilang titulo para sa pinahiran ng Diyos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Kaya kung
  rationale: Pinananatili nito kapwa ang pangangatwirang ipinahihiwatig ng οὖν at ang pasubaling anyo ng εἰ, nang hindi ginagawang tahasang katiyakan ang ipinapalagay na totoo sa konteksto.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: binuhay kayong muli kasama ng Mesiyas
  rationale: Ipinakikita ng pasibong pandiwa ang muling pagbuhay sa mga mananampalataya, at ipinahahayag ng kasunod na datibo ang pakikiisa nila sa Mesiyas. Ang “kasama” ang natural na paraan upang maipakita ang diwa ng συνεγείρω at ng datibo ng pakikisama.
- source_word: τὰ ἄνω
  choice: ang mga bagay sa itaas
  rationale: Pinananatili ang malawak at maramihang diwa ng substantibong parirala nang hindi ito nililimitahan sa isang mas tiyak na paliwanag gaya ng “mga bagay na makalangit.”
- source_word: ζητεῖτε
  choice: hanapin ninyo
  rationale: Direkta at likas na katumbas ng pangkasalukuyang pautos; ang patuloy na pagtuon ay mauunawaan mula sa anyo at konteksto nang hindi kailangang dagdagan ang teksto.
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: kung saan naroon ang Mesiyas
  rationale: Ang “kung saan” ay nagpapanatili sa lokatibong ugnayan sa “itaas,” at natural sa Filipino ang “naroon” upang ipahayag ang ἐστιν sa ganitong pangungusap.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: na nakaupo sa kanan ng Diyos
  rationale: Pinananatili ang kilalang larawan ng marangal at makapangyarihang kalagayan sa kanan ng Diyos, nang hindi dinaragdagan ng mas interpretatibong salitang “nakaluklok.”
theological_decisions:
- issue: Lakas ng pasubaling Εἰ
  choice: Panatilihin bilang “kung”
  alternative: “yamang” o “dahil”
  rationale: Bagaman malamang na ipinapalagay ni Pablo na totoo ang kundisyon, pasubali ang mismong anyong Griyego. Pinananatili ng “kung” ang retorikal at teolohikal na tensiyon sa halip na tahimik itong lutasin.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa konteksto ng pakikiisa sa itinaas na pinahiran ng Diyos, nananatiling makabuluhan ang gamit nito bilang titulo. Ang “Mesiyas” ay malinaw sa karaniwang mambabasa at hindi ginagawang pangalan lamang ang titulo.
- issue: Larawan ng pag-upo sa kanan ng Diyos
  choice: nakaupo sa kanan ng Diyos
  alternative: nakaluklok sa kanan ng Diyos
  rationale: Pinananatili ng napiling salin ang tahasang larawan ng teksto at ang pahiwatig ng karangalan at pamamahala, ngunit hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong “nakaluklok.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya kung” upang likas na mapanatili ang inferensiya at pasubali; iniwasan ang mas teknikal o denominasyonal na pananalita.
