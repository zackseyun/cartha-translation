source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: tl
  text: Kayong mga alipin[a], sundin ninyo sa lahat ng bagay ang inyong mga panginoon ayon sa laman[b]. Huwag kayong maglingkod lamang kapag may nagbabantay[c], na parang ang layunin ninyo ay magpalugod sa tao; sa halip, maglingkod kayo nang may tapat na puso, na may takot sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na δοῦλοι ay tumutukoy rito sa mga taong inalipin at nasa ilalim ng kapangyarihan ng isang panginoon; maaari rin itong isaling “mga lingkod,” ngunit maaaring ikubli niyon ang kanilang kalagayan bilang mga alipin.
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon sa laman” ay maaaring isaling “sa mundong ito.” Ipinahihiwatig nitong ang kapangyarihan ng mga panginoong ito ay nasa ugnayang pantao sa kasalukuyang buhay.
    reason: lexical_alternative
  - marker: c
    text: 'Sa Griego, “paglilingkod sa mata”: trabahong ginagawa lamang kapag may nakatingin o nagmamasid.'
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Kayong mga alipin
  rationale: Tuwirang inilalarawan ng δοῦλοι ang mga taong inalipin at nasa ilalim ng kapangyarihan ng panginoon; hindi ito pinalalambot bilang makabagong empleyado o karaniwang lingkod.
- source_word: ὑπακούετε κατὰ πάντα
  choice: sundin ninyo sa lahat ng bagay
  rationale: Likas na utos sa modernong Tagalog at pinananatili ang malawak na saklaw ng κατὰ πάντα.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: ang inyong mga panginoon ayon sa laman
  rationale: Pinananatili ang sadyang pananalita ni Pablo na κατὰ σάρκα at ang kaibahan ng mga panginoong tao sa Panginoon, bagaman nililinaw sa talababa ang diwa nito.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: Huwag kayong maglingkod lamang kapag binabantayan
  rationale: Ipinahahayag nang natural sa Tagalog ang bihirang tambalang salita na tumutukoy sa paglilingkod na ginagawa lamang sa ilalim ng tingin ng panginoon.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: gaya ng mga taong nagpapalugod sa tao
  rationale: Pinananatili ang negatibong diwa ng pagkilos upang makuha lamang ang pagsang-ayon ng tao.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: kundi maglingkod nang may tapat na puso
  rationale: Sa kontekstong ito, ang ἁπλότης ay katapatan at di-hating layunin, hindi pagiging payak sa pag-iisip.
- source_word: φοβούμενοι τὸν κύριον
  choice: at may takot sa Panginoon
  rationale: Pinananatili ang biblikal na konsepto ng pagkatakot sa Panginoon at malinaw na itinatangi siya sa mga panginoong tao.
theological_decisions:
- issue: Utos sa loob ng konteksto ng sinaunang pang-aalipin
  choice: Tahasang isinalin bilang “mga alipin” at “mga panginoon,” nang hindi ginagawang ugnayan ng empleyado at amo.
  alternative: “Mga lingkod” at “mga amo” o “mga empleyado” at “mga employer.”
  rationale: Ang talata ay tumutukoy sa tunay na institusyon ng pang-aalipin sa sinaunang daigdig. Ang paglilipat nito sa makabagong empleyo ay magtatago sa makasaysayan at etikal na tensiyon ng teksto.
- issue: Pagkakakilanlan ng τὸν κύριον
  choice: “Panginoon,” na tumutukoy sa banal na Panginoon at kaiba sa mga panginoon ayon sa laman.
  alternative: “Guro” o “panginoon” bilang isa pang taong may-ari.
  rationale: Ang tiyak na anyo at ang konteksto ng Colosas 3:23–24 ay tumuturo sa Panginoong Cristo, habang pinananatili ng salin ang kaibahan sa mga panginoong tao.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang “ayon sa laman” upang huwag burahin ang pananalita at kaibahang teolohikal ni Pablo, ngunit nilinaw ito sa talababa. Isinalin nang idyomatiko ang ὀφθαλμοδουλία sa pangunahing teksto.
