id: COL.3.14
reference: Colossians 3:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: tl
  text: At higit sa lahat ng ito, isuot ninyo ang pag-ibig, na siyang bigkis ng kasakdalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bigkis ng kaganapan” o “bigkis ng ganap na paglago.”
    reason: 'Ipinapakita ang saklaw ng kahulugan ng τελειότης: kasakdalan, kaganapan, o ganap na paglago.'
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: At higit sa lahat ng ito
  rationale: Ipinahahayag nito ang natatanging pangunguna ng pag-ibig habang nananatiling angkop sa talinghaga ng pananamit mula sa naunang konteksto. Mas natural ito sa makabagong Tagalog kaysa sa literal na “sa ibabaw ng lahat ng ito.”
- source_word: τὴν ἀγάπην
  choice: ang pag-ibig
  rationale: Ang “pag-ibig” ang malinaw at karaniwang katumbas ng ἀγάπη at tumutukoy rito bilang pinakapangunahing katangiang dapat taglayin.
- source_word: '[implicit verb from ἐνδύσασθε in verse 12]'
  choice: isuot ninyo
  rationale: Walang tahasang pandiwa sa talata, ngunit ang accusative na τὴν ἀγάπην ay nakasalalay sa utos na ἐνδύσασθε sa talata 12. Ang paglalagay ng “isuot ninyo” ay kailangan sa natural na Tagalog at pinananatili ang talinghaga ng pananamit.
- source_word: ὅ ἐστιν
  choice: na siyang
  rationale: Natural nitong ipinakikilala ang paliwanag tungkol sa pag-ibig nang hindi pilit na nilulutas ang di-pagkakatugma ng kasarian ng panghalip at ng ἀγάπη sa Griyego.
- source_word: σύνδεσμος
  choice: bigkis
  rationale: Ang “bigkis” ay maikli at marangal na salitang tumutukoy sa nag-uugnay o nagbubuklod sa mga bagay. Pinananatili nito ang larawang-diwa nang hindi gumagamit ng labis na anatomikal na “litid.”
- source_word: τῆς τελειότητος
  choice: ng kasakdalan
  rationale: Pinananatili ng “kasakdalan” ang maikli at malawak na anyo ng Griyego, kabilang ang mga posibleng diwa ng kaganapan, kabuuan, at ganap na paglago.
theological_decisions:
- issue: Ang kahulugan ng pag-ibig bilang σύνδεσμος τῆς τελειότητος
  choice: Inilalarawan ang pag-ibig bilang “bigkis ng kasakdalan,” nang hindi tinutukoy kung ang kasakdalan ay pag-aari, resulta, o kalagayang binubuo ng bigkis.
  alternative: Ang pag-ibig ang bigkis na nagdudulot ng kaganapan o ganap na paglago.
  rationale: Maaaring unawain sa ilang magkakaugnay na paraan ang genitive na τῆς τελειότητος. Pinananatili ng siksik na pariralang “bigkis ng kasakdalan” ang tunay na kalabuan at hindi ipinipilit ang isang tiyak na ugnayang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ninyo” upang tahasang maipakita ang maramihang utos. Pinanatili ang talinghaga ng pananamit sa “isuot” at ang maikli ngunit sadyang maluwag na ugnayang gramatikal sa “bigkis ng kasakdalan.”
