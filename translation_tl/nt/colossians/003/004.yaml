  source_fidelity: Tumpak na naihahatid ng draft ang temporal na sugnay, ang apposisyong ang Mesiyas ang buhay ng mga kausap, ang diin ng «din», ang pakikisama sa kanya, at ang paghahayag sa kaluwalhatian. Gayunman, ang «Kapag mahayag ang Mesiyas» ay hindi gaanong likas na pangungusap sa modernong Filipino. Ang «Kapag nahayag» ay mas idiomatiko; sa konteksto ng «kapag» at ng kasunod na hinaharap na «mahahayag», tumutukoy pa rin ito sa inaasahang panghinaharap na paghahayag.
  naturalness: Ang binagong «Kapag nahayag ang Mesiyas» ay mas natural at malinaw kaysa «Kapag mahayag ang Mesiyas». Nananatiling marangal ngunit madaling unawain ang rehistro.
  terminology: Ang «Mesiyas» ay angkop na salin ng titulong Χριστός ayon sa ibinigay na patakaran. Ang «kaluwalhatian» ay angkop para sa δόξα. Napananatili ng «nahayag … mahahayag» ang ugnayang salitang-ugat ng dalawang anyo ng φανερόω.
