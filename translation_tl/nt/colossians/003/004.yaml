id: COL.3.4
reference: Colossians 3:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: tl
  text: Kapag nahayag ang Mesiyas[a], na siyang buhay ninyo, mahahayag din kayong kasama niya sa kaluwalhatian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego na Χριστός ay maaaring isaling “Mesiyas” o “Cristo.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin ang dalawang anyo ng pandiwa bilang “lumitaw … lilitaw.” Iisang salitang-ugat ang ginamit sa Griyego para sa Mesiyas at sa mga mananampalataya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Kapag
  rationale: Ipinakikilala nito ang isang inaasahang pangyayari sa hinaharap, hindi isang paulit-ulit na pangyayari.
- source_word: ὁ Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit ang Χριστός bilang titulo. Ang “Mesiyas” ay likas at malinaw sa modernong Filipino at pinananatili ang kahulugan ng titulo.
- source_word: φανερωθῇ
  choice: mahayag
  rationale: Ipinahihiwatig ng pandiwa ang pagiging lantad o hayag. Pinananatili rin ng “mahayag” ang ugnayang leksikal nito sa kasunod na “mahahayag.”
- source_word: ἡ ζωὴ ὑμῶν
  choice: na siyang buhay ninyo
  rationale: Nililinaw ng sugnay ang apposisyon sa Griyego—ang Mesiyas ang tinutukoy na buhay nila—nang hindi dinaragdagan ang diwa.
- source_word: τότε καὶ ὑμεῖς
  choice: mahahayag din kayo
  rationale: Ang “din” ay naghahatid sa καί at nagpapakita na makikibahagi rin ang mga mananampalataya sa paghahayag na iyon; likas nang ipinahihiwatig ng ayos ng pangungusap ang τότε.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Likas itong salin ng malapit na pakikisama o pakikibahagi na ipinahihiwatig ng σύν.
- source_word: φανερωθήσεσθε
  choice: mahahayag
  rationale: Pinananatili ang parehong salitang-ugat na ginamit para sa φανερωθῇ at ang hinaharap na diwa ng pandiwa.
- source_word: ἐν δόξῃ
  choice: sa kaluwalhatian
  rationale: Pinananatili ang maikli ngunit mabigat na pariralang maaaring tumukoy sa kalagayan o paraan ng kanilang paghahayag.
theological_decisions:
- issue: Titulo o anyong parang pangalan para sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang may artikulong Χριστός ay may malinaw na puwersa bilang titulo rito. Isinasalin ng “Mesiyas” ang titulo sa halip na tratuhin lamang itong pangalan.
- issue: Pagkakakilanlan ng Mesiyas bilang buhay ng mga mambabasa
  choice: na siyang buhay ninyo
  alternative: ang buhay ninyo
  rationale: Ginagawang likas sa Filipino ang apposisyon habang pinananatili ang tuwirang pagkakakilanlan at hindi ipinapaliwanag nang lampas sa teksto.
- issue: Kaugnayan ng paghahayag ng Mesiyas at ng mga mananampalataya
  choice: mahayag … mahahayag
  alternative: magpakita … lilitaw
  rationale: Ang paggamit ng iisang salitang-ugat ay nagpapanatili sa sinadyang pag-uugnay ng dalawang anyo ng φανερόω at sa teolohikal na pakikibahagi ng mga mananampalataya sa kanya.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ninyo” at “kayo” upang mapanatili ang pangmaramihang ikalawang panauhan. Iniwasan ang mas teknikal na “maipamalas” at pinili ang likas na pares na “mahayag … mahahayag.”
