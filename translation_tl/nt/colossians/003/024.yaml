  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: tl
  text: Alam ninyong mula sa Panginoon ay tatanggapin ninyo ang gantimpala ng mana. Sa Panginoong Mesiyas[a] kayo naglilingkod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na katawagan, “Panginoong Cristo.”
    reason: alternative_reading
  - marker: b
    text: 'Ang pandiwang Griyego ay nasa anyong paturol: “kayo ay naglilingkod,” hindi tuwirang pautos na “maglingkod kayo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Alam ninyong
  rationale: Pinananatili ang ugnayang pandiwari nito sa naunang pangungusap nang hindi tahasang ipinapasok ang isang mas tiyak na panandang sanhi gaya ng “sapagkat.”
- source_word: ἀπὸ κυρίου
  choice: mula sa Panginoon
  rationale: Ipinahahayag ng ἀπό na ang Panginoon ang pinagmumulan ng tatanggaping gantimpala; pinananatili rin ang kristolohikal na titulong “Panginoon.”
- source_word: ἀπολήμψεσθε
  choice: tatanggapin ninyo
  rationale: Likas na katumbas ng future middle indicative; ang diwa ng pagtanggap bilang ganti ay dinadala rin ng kasunod na “gantimpala.”
- source_word: ἀνταπόδοσιν
  choice: gantimpala
  rationale: Malinaw at kasalukuyang salitang Filipino para sa positibong kabayaran o ganti sa kontekstong ito.
- source_word: τῆς κληρονομίας
  choice: ng mana
  rationale: Pinananatili ang maikli at bahagyang malabong ugnayang genitive sa halip na tahasang ipaliwanag na ang mana mismo ang gantimpala.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: sa Panginoong Mesiyas
  rationale: Ang dative ang layon ng paglilingkod. Isinalin ang Χριστός bilang titulong “Mesiyas,” habang pinanatili ang κύριος bilang “Panginoon.”
- source_word: δουλεύετε
  choice: kayo naglilingkod
  rationale: 'Pinananatili ang anyong present active indicative: isang pahayag na nagpapaalala kung sino ang tunay nilang pinaglilingkuran, hindi isang tuwirang utos.'
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ bilang kristolohikal na titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Aktibo rito ang kahulugan ng Χριστός bilang titulo; ang “Mesiyas” ay tuwirang naghahatid ng titulong iyon, habang inilalagay sa talababa ang tradisyonal at pamilyar na anyong “Cristo.”
- issue: Lakas o himig ng δουλεύετε
  choice: 'Paturol: “kayo naglilingkod”'
  alternative: 'Pautos: “paglingkuran ninyo”'
  rationale: Ang morpolohiya ay present active indicative, ikalawang panauhang maramihan. Pinananatili ng salin ang pahayag bilang paalala sa halip na gawin itong tahasang utos.
- issue: Ugnayan ng ἀνταπόδοσιν at τῆς κληρονομίας
  choice: “ang gantimpala ng mana”
  alternative: “ang mana bilang gantimpala”
  rationale: Pinananatili ng napiling anyo ang masinsing genitive ng Griyego at hindi lubusang ipinapasiya kung ito ay appositional o descriptive.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mana” sa karaniwang biblikal na diwa ng pamanang tatanggapin, at inayos ang huling sugnay bilang “Sa Panginoong Mesiyas kayo naglilingkod” upang maging natural sa Filipino at malinaw na paturol.
