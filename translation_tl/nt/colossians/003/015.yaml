  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: tl
  text: At hayaan ninyong maghari[b] sa inyong mga puso ang kapayapaan ng Mesiyas[a]. Tungo sa kapayapaang ito nga kayo tinawag sa iisang katawan[c]. At maging mapagpasalamat kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kristo.” Ang Griyegong Χριστός ay titulong nangangahulugang “Pinahiran” at maaari ring isalin na “Mesiyas.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring mangahulugan ang pandiwa na “maging tagahatol” o “magpasya,” anupat inilalarawan ang kapayapaan ng Mesiyas bilang siyang nagpapasya sa buhay ng pamayanan.
    reason: lexical_alternative
  - marker: c
    text: O posibleng “tungo sa iisang katawan,” na nagbibigay-diin sa pagkakabilang sa isang nagkakaisang katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Ito ang likas at karaniwang katumbas sa Tagalog at angkop sa ugnayang pangkomunidad na binibigyang-diin ng talata.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo ng Pinahiran; pinananatili ng “Mesiyas” ang puwersang ito sa halip na ituring lamang itong pangalan.
- source_word: βραβευέτω
  choice: hayaan ninyong maghari
  rationale: Natural itong utos sa Tagalog at ipinahahayag ang mapagpasya at namamahalang papel ng kapayapaan, habang ang mas literal na larawang tagahatol ay inilalagay sa talababa.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: sa inyong mga puso
  rationale: Pinananatili ang pangmaramihang “mga puso” at ang biblikal na larawan ng panloob na buhay, kalooban, at damdamin.
- source_word: εἰς ἣν
  choice: sa kapayapaang ito
  rationale: Malinaw na ibinabalik nito ang panghalip sa “kapayapaan” at ipinahahayag ang kapayapaan bilang tunguhin ng pagkatawag.
- source_word: καὶ ἐκλήθητε
  choice: nga kayo tinawag
  rationale: Ang “nga” ay natural na nagbibigay-diin sa adberbiyal na gamit ng καί sa kontekstong ito.
- source_word: ἐν ἑνὶ σώματι
  choice: sa iisang katawan
  rationale: Direkta nitong pinananatili ang ἐν at ang talinghaga ni Pablo tungkol sa nagkakaisang katawan nang hindi tahasang pinapalitan iyon ng “iglesia.”
- source_word: εὐχάριστοι γίνεσθε
  choice: maging mapagpasalamat kayo
  rationale: Pinananatili ng “maging” ang puwersa ng γίνεσθε at natural na ipinahahayag ng “mapagpasalamat” ang patuloy na disposisyon, hindi lamang isang minsanang pasasalamat.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Kristo
  rationale: Ang salita ay gumaganap bilang titulong tumutukoy sa Pinahiran. Gayunman, kinikilala sa talababa ang tradisyonal at laganap na anyong “Kristo.”
- issue: Puwersa ng “iisang katawan”
  choice: Pinanatili ang talinghagang “sa iisang katawan” nang walang paliwanag sa pangunahing teksto.
  alternative: Tahasan itong tukuyin bilang iglesia o isaling “tungo sa iisang katawan.”
  rationale: Malakas ang pahiwatig ng sama-samang pagkakaisa ng bayan ng Diyos, ngunit hindi ito pinalalawak lampas sa mismong sinabi ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hayaan ninyong maghari” bilang likas na pangkomunidad na utos; pinanatili ang “mga puso” at “iisang katawan” bilang mahahalagang larawan ng orihinal.
