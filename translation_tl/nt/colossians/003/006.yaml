  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: tl
  text: Dahil sa mga bagay na ito, dumarating ang poot ng Diyos sa mga anak ng pagsuway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taong masuwayin”; ang “mga anak ng pagsuway” ay tumutukoy sa mga taong kinakikitaan ng pagsuway.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἃ
  choice: Dahil sa mga bagay na ito
  rationale: Ang διά na may accusative na ἃ ay nagsasaad ng sanhi. Malinaw na tumutukoy ang “mga bagay na ito” sa mga kasamaang binanggit sa naunang talata.
- source_word: ἔρχεται
  choice: dumarating
  rationale: Pinananatili ng aspektong pangkasalukuyan ang diwang ang paghatol ng Diyos ay paparating, sa halip na gawin itong pangkalahatang pahayag lamang.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ang poot ng Diyos
  rationale: Ang “poot” ay natural at marangal na katumbas ng ὀργή sa konteksto ng makatarungang paghatol ng Diyos, at pinananatili nito ang bigat ng parirala.
- source_word: ἐπὶ
  choice: sa
  rationale: Sa kasamang accusative, itinuturo ng ἐπί ang mga taong patutunguhan o sasapitan ng poot. Ang “sa” ang pinakanatural na anyo nito sa modernong Tagalog.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: mga anak ng pagsuway
  rationale: Pinananatili ang Semitikong idyomang “mga anak ng pagsuway,” na tumutukoy sa mga taong ang buhay ay kinakikitaan ng pagsuway. Sa Tagalog, ang “anak” ay likas na hindi tiyak sa kasarian at hindi kailangang gawing “mga anak na lalaki.”
theological_decisions:
- issue: Kung pananatilihin ang idyomang “mga anak ng pagsuway” o tahasang ipapakahulugang “mga taong masuwayin”
  choice: Panatilihin sa pangunahing teksto ang “mga anak ng pagsuway” at ipaliwanag sa talababa.
  alternative: mga taong masuwayin
  rationale: Pinananatili nito ang anyo at larawan ng Griyegong parirala nang hindi ipinapalagay na literal na kaugnayang pampamilya ang tinutukoy. Nililinaw ng talababa ang idyomatikong kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “dumarating” upang mapanatili ang kasalukuyan at paparating na puwersa ng pandiwa; iniwasan ang mas mabigat ngunit hindi kailangang “sumasapit” o ang mas paliwanag na “darating.”
