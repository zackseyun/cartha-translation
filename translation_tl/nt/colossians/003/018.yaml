translation:
  language: tl
  text: Mga asawang babae, magpasakop kayo sa inyong mga asawa, gaya ng nararapat sa Panginoon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “gaya ng dating nararapat sa Panginoon.” Bagaman anyong nakaraan ang pandiwang Griyego, malamang na pangkalahatang kasalukuyang diwa ang taglay nito rito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Mga asawang babae
  rationale: Sa konteksto ng mga tagubilin sa sambahayan at bilang katapat ng ἀνδράσιν, tumutukoy ito sa mga babaeng may asawa, hindi sa lahat ng babae.
- source_word: ὑποτάσσεσθε
  choice: magpasakop kayo
  rationale: Ipinahahayag nito ang patuloy na utos na kusang ilagay ang sarili sa ilalim ng kaayusang kaugnay ng relasyong binabanggit; natural at malinaw ang “magpasakop” sa makabagong Tagalog.
- source_word: τοῖς ἀνδράσιν
  choice: sa sarili ninyong asawa
  rationale: Sa ugnayang ito, ang ἀνήρ ay nangangahulugang “asawang lalaki.” Ipinahihiwatig ng artikulo at ng konteksto ang kani-kanilang asawa; ang “sarili ninyong” ay nililinaw ito nang hindi ginagawang pangkalahatang pagpapasakop sa mga lalaki.
- source_word: ὡς
  choice: gaya ng
  rationale: Ipinakikilala nito ang pamantayan ng nararapat, hindi tahasang sanhi.
- source_word: ἀνῆκεν
  choice: nararapat
  rationale: Bagaman anyong imperfect ang pandiwa, maaari itong magpahayag dito ng umiiral na pagiging angkop o nararapat sa isang pangkalahatang tagubilin. Pinananatili ng salin at talababa ang posibleng aspektong nakaraan.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Natural na Tagalog ito para sa pariralang naglalagay sa pagiging nararapat ng tagubilin sa saklaw ng kaugnayan at katapatan sa Panginoon.
theological_decisions:
- issue: Saklaw at batayan ng tagubilin
  choice: Pinanatili ang “gaya ng nararapat sa Panginoon” bilang kwalipikasyon sa tagubilin.
  alternative: Unawain ito bilang ganap at walang-kondisyong kaugaliang panlipunan, o iugnay ang “sa Panginoon” sa mga asawang babae lamang.
  rationale: Sa Griyego, ang ἐν κυρίῳ ay kasama ng pahayag tungkol sa kung ano ang nararapat. Hindi pinalalawak ng salin ang talata tungo sa isang tiyak na doktrinal na sistema, ngunit pinananatili nitong nakapaloob ang tagubilin sa katapatan sa Panginoon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “asawang babae” at “sarili ninyong asawa” upang maiwasan ang kalabuan ng “babae” at “lalaki,” at ang “magpasakop” upang mapanatili ang volitional na himig ng utos. Ang tanging talababa ay minarkahan sa pangunahing teksto bilang [a].
