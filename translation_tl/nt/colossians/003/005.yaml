  source_fidelity: 'Ang pangunahing estruktura ay tapat sa Griyego: ang mariing pautos na Νεκρώσατε, ang hinuha ng οὖν, ang metapora ng μέλη na “nasa lupa,” at ang isahang pagtukoy ng “na siyang” sa kasakiman ay napapanatili. Gayunman, ang “pakikiapid” ay sa karaniwang modernong gamit ay maaaring umugnay lalo sa pangangalunya at kaya mas makitid kaysa sa malawak na πορνεία. Ang “mahalay na pagnanasa” naman ay labis na tumitiyak sa saklaw ng πάθος at halos nagiging doblado ng kasunod na “masamang pagnanasa.”'
  naturalness: Natural ang daloy ng pangungusap, bagaman sadyang kakaiba ang “mga bahagi ng katawan na nasa lupa,” na tapat sa metapora ng pinagmulan at nararapat ipaliwanag sa talababa. Ang “seksuwal na imoralidad” at “masidhing pita” ay mas malinaw na modernong Filipino sa talaan ng mga bisyo.
