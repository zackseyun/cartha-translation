    rationale: Ang πάθος ay masidhing/disordered na passion; ang kasunod na parirala ang tahasang may “masama.” Ang “masidhing pita” ay pinananatili ang lakas ng termino nang hindi inuunahan ang kasunod na kwalipikasyon.
