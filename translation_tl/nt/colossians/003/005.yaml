id: COL.3.5
reference: Colossians 3:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: tl
  text: 'Kaya[a], patayin ninyo ang mga bahagi ng katawan na nasa lupa: seksuwal na imoralidad, karumihan, masidhing pita, masamang pagnanasa, at kasakiman[b], na siyang pagsamba sa diyos-diyosan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Kaya nga.” Sa mas literal na pagkakasabi ng Griyego: “patayin ninyo ang mga bahagi ng katawan na nasa lupa.” Maaari ring unawain ang diwa bilang “patayin ninyo ang anumang makalupa sa inyo.”'
    reason: lexical_alternative
  - marker: b
    text: O “pag-iimbot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: patayin ninyo
  rationale: Tuwirang utos ito na humihingi ng tiyak at aktibong pagkilos; pinananatili ng “patayin” ang lakas ng metapora.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal na bunga ng naunang pangangatwiran sa natural na makabagong Tagalog.
- source_word: μέλη
  choice: mga bahagi ng katawan
  rationale: Pinananatili ang metapora ng mga sangkap o bahagi ng katawan habang mas malinaw sa karaniwang mambabasa kaysa sa “mga sangkap.”
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: na nasa lupa
  rationale: Malapit sa literal na larawang pangkalawakan ng Griyego at hindi agad pinapalitan ng abstraktong “makalupa.”
- source_word: πορνείαν
  choice: pakikiapid
  rationale: Karaniwang salitang biblikal sa Tagalog para sa malawak na saklaw ng ipinagbabawal na seksuwal na gawain; hindi ito nilimitahan sa isang partikular na anyo.
- source_word: ἀκαθαρσίαν
  choice: karumihan
  rationale: Natural na katumbas ng moral na kawagasan o impurity sa kontekstong ito.
- source_word: πάθος
  choice: mahalay na pagnanasa
  rationale: Sa listahan ng mga bisyo, ang πάθος ay tumutukoy sa masidhing pagnanasang wala sa wastong ayos; nililinaw ng “mahalay” ang negatibong diwa na maaaring hindi taglay ng payak na “damdamin” o “simbuyo.”
- source_word: ἐπιθυμίαν κακήν
  choice: masamang pagnanasa
  rationale: Tuwirang inililipat ang tahasang moral na paglalarawan ng κακήν sa pagnanasa.
- source_word: πλεονεξίαν
  choice: kasakiman
  rationale: Malinaw at kasalukuyang salita para sa mapang-angking pagnanais na magkaroon pa; maaaring saklawin din ng “pag-iimbot,” kaya inilagay iyon sa talababa.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: na siyang pagsamba sa diyos-diyosan
  rationale: Ang pambabaeng isahang panghalip ay pinakanatural na tumutukoy sa kasakiman; pinananatili ng “siyang” ang mariing pagkakakilanlan sa idolatriya.
theological_decisions:
- issue: Tinutukoy ng “na siyang pagsamba sa diyos-diyosan”
  choice: Partikular itong tumutukoy sa “kasakiman.”
  alternative: Maaaring unawain bilang paglalarawan sa buong naunang talaan.
  rationale: Ang ἥτις ay pambabae at isahan at pinakanatural na umaayon sa pinakamalapit na pambabae at isahang pangngalan na πλεονεξίαν.
- issue: Kahulugan ng “mga bahagi ng katawan na nasa lupa”
  choice: Pinanatili sa pangunahing teksto ang metapora ng mga bahagi ng katawan.
  alternative: “Anumang makalupa sa inyo” o “ang inyong makalupang kalikasan.”
  rationale: Tahasang ginagamit ng Griyego ang μέλη at ang pariralang “nasa lupa”; ang mas abstraktong pagbasa ay tunay na interpretibong posibilidad ngunit hindi dapat tahimik na ipalit sa mismong larawan ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang kakaibang metapora ng Griyego sa pangunahing teksto, at inilagay sa talababa ang mas interpretibong pagbasa. Ang “pakikiapid” ay tradisyonal ngunit buhay pa sa gamit na biblikal; ang iba pang salita ay piniling maging malinaw sa ordinaryong mambabasa.
