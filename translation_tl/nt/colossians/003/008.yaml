id: COL.3.8
reference: Colossians 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: tl
  text: 'Ngunit ngayon, alisin din ninyo ang lahat ng ito: galit, poot, masamang hangarin, paninirang-puri, at malaswang pananalita mula sa inyong bibig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: alisin
  rationale: Ang pandiwa ay literal na maaaring tumukoy sa paghuhubad o pagtatabi; sa kontekstong etikal, natural na ipinahahayag ng “alisin” ang lubusang pagtalikod sa mga bisyong nakalista.
- source_word: ὀργήν
  choice: galit
  rationale: Karaniwang katumbas sa modernong Tagalog at sapat na malawak upang katawanin ang matindi o namamalaging galit.
- source_word: θυμόν
  choice: poot
  rationale: Ipinakikita ang pagkakaiba nito sa ὀργή bilang mas maalab at marahas na damdamin, habang nananatiling dignified at madaling maunawaan.
- source_word: κακίαν
  choice: masamang hangarin
  rationale: Sa listahan ng mga asal, ipinahahayag nito ang masamang kalooban o hangaring manakit, hindi lamang pangkalahatang “kasamaan.”
- source_word: βλασφημίαν
  choice: paninirang-puri
  rationale: Dito, dahil kasama ito sa mga kasalanan ng pananalita at walang tahasang banal na layon, ang diwa ay mapanirang pagsasalita laban sa iba.
- source_word: αἰσχρολογίαν
  choice: malaswang pananalita
  rationale: Tuwirang ipinahahayag ang kahiya-hiya, mahalay, o maruming pananalitang tinutukoy ng salita.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: mula sa inyong bibig
  rationale: Pinananatili ang konkretong larawan ng Griyego at ang ugnayan nito sa dalawang huling kasalanan ng pananalita.
theological_decisions:
- issue: Saklaw ng “τὰ πάντα”
  choice: “ang lahat ng ito,” na tumutukoy sa buong kasunod na listahan
  alternative: Unawain bilang malawak na utos na alisin ang lahat ng kasalanan, na sinusundan lamang ng ilang halimbawa
  rationale: Ang agarang sintaks ay naghaharap ng limang bagay bilang appositional na pagpapaliwanag sa “lahat ng ito”; hindi pinalalawak ng salin ang saklaw nang higit sa malinaw na pahayag.
- issue: Kahulugan ng βλασφημία
  choice: paninirang-puri
  alternative: kalapastanganan o pamumusong
  rationale: Bagaman maaari itong tumukoy sa pamumusong laban sa Diyos, walang tahasang banal na layon dito at ang konteksto ay nakatuon sa mapaminsalang pananalita sa pamayanan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, tuwiran, at marangal. Pinanatili ang serye ng magkakalapit ngunit magkakaibang bisyo at ang konkretong pariralang “mula sa inyong bibig.”
