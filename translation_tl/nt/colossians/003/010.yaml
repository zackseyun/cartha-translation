  source_fidelity: 'Tumpak ang pangunahing diwa ng Griyego: natapos na pagsusuot ng bagong pagkatao, nagpapatuloy na pasibong pagbabago tungo sa pagkakilala, at pagsang-ayon sa larawan ng Maylalang. Gayunman, ang “lumikha rito” ay hindi tumutukoy nang wasto sa αὐτόν; ang rito ay locative (“dito”), hindi panghalip na ‘nito.’'
