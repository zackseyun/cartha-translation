  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: tl
  text: at isinuot na ninyo ang bagong pagkatao[a], na patuloy na binabago tungo sa pagkakilala[b], ayon sa larawan ng lumikha nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong tao.” Inihahambing ng pananalitang Griyego ang bagong pagkatao sa dating pagkatao sa nakapaligid na konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “lubos na pagkakilala.” Maaaring tumukoy ang salitang Griyego sa mas ganap o mas malalim na pagkakilala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: isinuot na ninyo
  rationale: Pinananatili ang metapora ng pagsusuot at ipinahihiwatig ng “na” ang natapos na kilos ng aorist participle, habang natural itong iniuugnay sa naunang konteksto.
- source_word: τὸν νέον
  choice: ang bagong pagkatao
  rationale: Substantibo ang pang-uri sa Griyego at katapat ito ng dating pagkatao sa konteksto. Ang “pagkatao” ay likas sa modernong Filipino at hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
- source_word: ἀνακαινούμενον
  choice: na patuloy na binabago
  rationale: Ipinahahayag ng “patuloy” ang nagpapatuloy na kilos ng present participle, at pinananatili ng anyong balintiyak ang di-tahasang gumagawa ng pagbabago.
- source_word: εἰς ἐπίγνωσιν
  choice: tungo sa pagkakilala
  rationale: Ang “tungo sa” ay nagpapanatili sa diwa ng direksiyon o kinalabasan ng εἰς. Ang “pagkakilala” ay mas personal at angkop kaysa abstraktong “kaalaman,” ngunit hindi sapilitang idinaragdag sa pangunahing teksto ang kahulugang “lubos.”
- source_word: κατ’ εἰκόνα
  choice: ayon sa larawan
  rationale: Ipinahahayag nito ang pamantayan o pagkakatulad at pinananatili ang posibleng alusyon sa wika ng paglalang sa Genesis.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: ng lumikha rito
  rationale: Malinaw na ang lumikha ang pinagmumulan ng huwaran. Ang “rito” ay tumutukoy sa bagong pagkatao at umiiwas sa di-likas o panlalaking panghalip.
theological_decisions:
- issue: Pagpapakahulugan sa τὸν νέον sa kontekstong antropolohikal
  choice: bagong pagkatao
  alternative: bagong tao
  rationale: Pinananatili ng “bagong pagkatao” ang kaibahan sa dating pagkatao at hindi nililimitahan ang tinutukoy ayon sa kasarian. Inilalagay sa talababa ang mas literal na alternatibo.
- issue: Lakas ng kahulugan ng ἐπίγνωσις
  choice: pagkakilala
  alternative: lubos na pagkakilala
  rationale: Maaaring magpahiwatig ang salita ng mas ganap o mas malalim na pagkakilala, ngunit ang tahasang “lubos” sa pangunahing teksto ay maaaring maging labis na pagpapakahulugan. Pinananatili ang posibilidad sa talababa.
- issue: Direksiyon o kinalabasan ng εἰς ἐπίγνωσιν
  choice: tungo sa pagkakilala
  alternative: sa pagkakilala
  rationale: Pinananatili ng “tungo sa” ang galaw patungo sa layon o kinalabasan nang hindi tiyakang pinipili kung layunin o bunga ang pangunahing diin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng pagsusuot, ang nagpapatuloy at balintiyak na pagbabago, at ang wikang “larawan” na umaalingawngaw sa salaysay ng paglalang.
