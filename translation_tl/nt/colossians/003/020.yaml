  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: tl
  text: Mga anak, sundin ninyo ang inyong mga magulang sa lahat ng bagay, sapagkat ito ay kalugud-lugod[a] sa Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katanggap-tanggap.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa Panginoon” ay maaaring tumukoy sa kung ano ang kalugud-lugod sa loob ng kaugnayan ng isang tao sa Panginoon, at hindi lamang sa kung ano ang kalugud-lugod sa Panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Mga anak
  rationale: Ang τέκνα ay pangkalahatang tawag sa mga anak, hindi lamang sa mga lalaki. Natural din itong tuwirang panawagan sa makabagong Filipino.
- source_word: ὑπακούετε
  choice: sundin ninyo
  rationale: Ang pautos na ὑπακούετε ay nangangahulugang tumalima o sumunod. Sa ugnayan ng anak at magulang, malinaw at natural ang “sundin ninyo.”
- source_word: τοῖς γονεῦσιν
  choice: ang inyong mga magulang
  rationale: Ang γονεῦσιν ay “mga magulang.” Ipinahihiwatig ng tuwirang panawagan ang kaugnayang “inyong,” na kailangang sabihin sa natural na Filipino.
- source_word: κατὰ πάντα
  choice: sa lahat ng bagay
  rationale: Ipinapahayag ng parirala ang saklaw o lawak ng pagsunod. Pinananatili nito ang malawak na pahayag nang hindi ito ginagawang temporal na “palagi.”
- source_word: τοῦτο
  choice: ito
  rationale: Tumutukoy ang demonstratibo sa pagsunod na iniutos sa naunang sugnay at pinananatili ang payak na estruktura ng Griyego.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ang γάρ ng dahilan para sa naunang utos; malinaw at marangal na panumbas ang “sapagkat.”
- source_word: εὐάρεστόν ἐστιν
  choice: ay kalugud-lugod
  rationale: Ipinahihiwatig ng εὐάρεστος ang bagay na nakalulugod o katanggap-tanggap. Ang “kalugud-lugod” ay angkop sa dignidad ng teksto at nauunawaan pa rin sa modernong Filipino.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ang “sa Panginoon” ay natural na ekspresyong Filipino na hindi lubusang ipinipirmi kung ang parirala ay tumutukoy sa larangan ng pakikipag-ugnayan sa Panginoon o sa bagay na nakalulugod sa kanya.
theological_decisions:
- issue: Saklaw ng “sa lahat ng bagay” kaugnay ng “sa Panginoon”
  choice: Pinanatili ang dalawang parirala nang walang idinagdag na tahasang eksepsiyon o pagpapaliwanag.
  alternative: Unawain ang “sa Panginoon” bilang tahasang hangganan sa pagsunod, o isalin itong “sapagkat ito ay nakalulugod sa Panginoon.”
  rationale: Walang tahasang sugnay ng eksepsiyon sa Griyego, at ang ἐν κυρίῳ ay sumusunod sa pahayag tungkol sa pagiging kalugud-lugod. Pinananatili ng salin ang lawak ng utos at ang teolohikal na tensiyon nang hindi nagpapasok ng interpretasyong lampas sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak” bilang inklusibong panawagan at ang “sundin ninyo” bilang natural na pautos. Pinanatili ang “sa Panginoon” upang huwag paliitin ang tunay na ambiguwidad ng ἐν κυρίῳ.
