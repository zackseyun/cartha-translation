id: COL.3.9
reference: Colossians 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: tl
  text: Huwag kayong magsinungaling sa isa't isa, yamang hinubad na ninyo[a] ang lumang pagkatao[b] kasama ang mga gawain nito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matapos ninyong hubarin” o, mas literal, “pagkahubad ninyo.” Maaaring ihayag ng participle sa Griyego ang dahilan, panahon, o kasabay na pangyayari; malamang na batayan ng utos ang diin dito.
    reason: grammatical_ambiguity
  - marker: b
    text: Sa literal, “lumang tao.” Maaari ring “dating sarili.” Iniuugnay ito ni Pablo sa “bagong tao” sa susunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Huwag kayong magsinungaling
  rationale: Tuwirang ipinapahayag ang pagbabawal ng pandiwang ψεύδομαι nang hindi ipinapalagay na kasalukuyan na nilang ginagawa ito.
- source_word: εἰς ἀλλήλους
  choice: sa isa't isa
  rationale: Likas na katumbas sa Filipino na nagpapanatili sa kapalitang ugnayan ng ἀλλήλους.
- source_word: ἀπεκδυσάμενοι
  choice: yamang hinubad na ninyo
  rationale: Pinananatili ng “hinubad” ang talinghaga ng pananamit, ipinahihiwatig ng “na” ang naganap na kilos, at inilalahad ng “yamang” ang malamang na dahilang kaugnayan ng participle sa utos.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: ang lumang pagkatao
  rationale: Ang “lumang pagkatao” ay likas at malinaw sa modernong Filipino habang naipagpapatuloy ang paghahambing sa bagong pagkatao sa susunod na talata. Hindi kasing-literal ng “lumang tao,” kaya itinatala ang alternatibo sa talababa.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: kasama ang mga gawain nito
  rationale: Ang “kasama” ay nagpapahayag ng accompaniment, at ang “mga gawain” ay sumasaklaw sa kilos o nakagawiang asal. Ang “nito” ay malinaw na tumutukoy sa lumang pagkatao.
theological_decisions:
- issue: Ugnayan ng participle na ἀπεκδυσάμενοι sa pangunahing utos
  choice: 'Dahilan o batayan: “yamang hinubad na ninyo”'
  alternative: Mas pormal na “matapos hubarin” o “pagkahubad”
  rationale: Sa konteksto, malamang na ibinabatay ng participle ang pagbabawal sa naganap nang pagbabago sa mga mambabasa. Gayunman, hindi ganap na tiyak kung sanhi, panahon, o kasabay na pangyayari ang diin, kaya pinananatili sa talababa ang ibang posibilidad.
- issue: Pagpapakahulugan sa τὸν παλαιὸν ἄνθρωπον
  choice: ang lumang pagkatao
  alternative: ang lumang tao
  rationale: Hindi lamang isang matandang lalaking indibidwal ang tinutukoy, kundi ang dating pagkatao o uri ng buhay na inihuhubad. Pinananatili sa talababa ang literal na anyo upang makita ang ugnayan nito sa “bagong tao” sa susunod na talata at hindi maitago ang antropolohikal na talinghaga ni Pablo.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang karaniwang “magsinungaling sa isa't isa” at ang malinaw na talinghagang “hinubad.” Ang “lumang pagkatao” ay mas natural kaysa “lumang tao,” habang ipinapanatili ng talababa ang literal na anyo at ang mahalagang paghahambing sa susunod na talata.
