  terminology: Ang “Mesiyas” ay angkop para sa Χριστός bilang titulo at sumusunod sa ibinigay na patakaran. Ang “salita,” “karunungan,” “salmo,” “himno,” at “awiting espirituwal” ay pare-pareho ang rehistro at sapat na tumpak. Ang “pasasalamat” at “biyaya” sa talababa ay maayos na nagsasaad ng saklaw ng χάρις nang hindi nagtatakda ng doktrinal na pagbasa.
