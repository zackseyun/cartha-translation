  source_fidelity: 'Tapat ang salin sa pangunahing estruktura at kahulugan ng Griyego: ang “salita ng Mesiyas” ay nagpapanatili sa malawak na λόγος at sa bukás na puwersa ng henitibo; ang “manahan nawa ... nang sagana” ay angkop para sa ἐνοικείτω πλουσίως; at ang maramihang “sa inyo” ay hindi sapilitang pumipili sa pampamayanan o pansariling pagbasa. Napananatili rin ang magkakaibang ψαλμοῖς, ὕμνοις, at ᾠδαῖς πνευματικαῖς, gayundin ang ugnayan ng pag-awit sa Diyos at sa mga puso ng mga mambabasa. Ang “nang may pasasalamat” para sa ἐν χάριτι ay isang makatuwirang kontekstuwal na pagpili, at wastong iniiwan sa talababa ang alternatibong kahulugang “biyaya.”'
