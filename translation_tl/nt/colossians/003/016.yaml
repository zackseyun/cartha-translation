id: COL.3.16
reference: Colossians 3:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: tl
  text: Manahan nawa sa inyo[a] nang sagana ang salita ng Mesiyas. Taglay ang buong karunungan, turuan at paalalahanan ninyo ang isa’t isa sa pamamagitan ng mga salmo, mga himno, at mga awiting espirituwal. Umawit kayo sa Diyos nang may pasasalamat[b] sa inyong mga puso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa inyo” ay pangmaramihan sa Griyego at maaaring tumukoy sa pananahan ng salita sa pamayanan bilang kabuuan o sa kalooban ng bawat mananampalataya.
    reason: alternative_reading
  - marker: b
    text: O “nang may biyaya.” Ang pariralang Griyego na ἐν χάριτι ay maaaring mangahulugang may biyaya, may kagandahang-loob, o may pasasalamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: ang salita ng Mesiyas
  rationale: Pinananatili ng “salita” ang malawak na saklaw ng λόγος, at ng “ng Mesiyas” ang anyong henitibo nang hindi tiyakang nilulutas kung ang salita ay mula sa Mesiyas o tungkol sa kanya. Ang Χριστός ay ginagamit dito bilang titulo.
- source_word: ἐνοικείτω
  choice: Manahan nawa
  rationale: Pinananatili nito ang talinghaga ng permanenteng pananahan at ang diwa ng patuloy na pautos o paghihikayat.
- source_word: ἐν ὑμῖν
  choice: sa inyo
  rationale: Likas itong salin ng pangmaramihang parirala at maaari itong tumukoy kapuwa sa pamayanan bilang kabuuan at sa mga mananampalataya bilang mga indibidwal.
- source_word: πλουσίως
  choice: nang sagana
  rationale: Malinaw at natural nitong ipinahahayag ang kasaganaan o kapuspusan ng pananahan ng salita.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: Taglay ang buong karunungan
  rationale: Natural ito sa Filipino at hindi lubusang isinasara kung ang karunungan ay kaugnay ng pananahan ng salita o, gaya ng ipinahihiwatig ng ayos dito, ng pagtuturo at pagpapaalala.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: turuan at paalalahanan ninyo ang isa’t isa
  rationale: Ang “turuan” ay tuwirang katumbas ng διδάσκω. Ipinahahayag ng “paalalahanan” ang mapagtuwid na diwa ng νουθετέω nang hindi labis na tumitindi bilang pagbabanta; ang pangmaramihang reflexive ay likas na tumbasan ng “isa’t isa.”
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: sa pamamagitan ng mga salmo, mga himno, at mga awiting espirituwal
  rationale: Ginagawang malinaw ng “sa pamamagitan ng” ang instrumental na gamit ng datibo, habang pinananatiling magkakahiwalay ang tatlong uring musikal at ikinakabit ang πνευματικαῖς sa “mga awitin” ayon sa pinakamalapit na anyo ng Griyego.
- source_word: ἐν χάριτι
  choice: nang may pasasalamat
  rationale: Sa konteksto ng pag-awit sa Diyos at ng paulit-ulit na tema ng pasasalamat sa talata 15–17, natural na ipinahahayag nito ang posibleng kahulugan ng χάρις bilang pasasalamat. Pinananatili sa talababa ang tunay na alternatibong “nang may biyaya.”
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: sa Diyos ... sa inyong mga puso
  rationale: Pinananatili ang Diyos bilang pinag-uukulan ng pag-awit at ang puso bilang panloob na dako o saklaw nito, sa natural na ayos ng Filipino.
theological_decisions:
- issue: Kahulugan at gamit ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay gumaganap bilang mesiyanikong titulo; ipinahahayag ng “Mesiyas” ang kahulugan nito sa halip na tratuhin lamang itong pangalang pantangi.
- issue: Pampamayanan o pansariling puwersa ng ἐν ὑμῖν
  choice: sa inyo
  alternative: sa gitna ninyo / sa kalooban ninyo
  rationale: 'Ang pangmaramihang “sa inyo” ay sadyang hindi nilulutas ang tensiyon: maaaring manahan ang salita sa buong pamayanan at sa bawat kabilang dito.'
- issue: Kahulugan ng ἐν χάριτι
  choice: nang may pasasalamat
  alternative: nang may biyaya
  rationale: Pinapaboran ng malapit na konteksto ang pasasalamat, ngunit may tunay na saklaw ang χάρις na biyaya o kagandahang-loob; kaya tahasang pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nawa” upang natural na maipahayag ang pautos na may himig ng paghihikayat, at hinati sa tatlong pangungusap ang mahabang estrukturang Griyego para sa madaling pagbasa nang hindi nawawala ang lohikal na ugnayan.
