    rationale: Ang participial na “na nagpapasalamat” ay walang hayag na tinutukoy sa Filipino at, dahil sa puwesto nito, maaari itong basahing panuring sa “Panginoong Jesus.” Ang εὐχαριστοῦντες ay tumutukoy sa mga kausap habang ginagawa nila ang utos.
