  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: tl
  text: At anuman ang gawin ninyo, sa salita man o sa gawa, gawin ninyo ang lahat sa pangalan ng Panginoong Jesus[a], habang nagpapasalamat kayo sa Diyos Ama sa pamamagitan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa pangalan ng” ay maaari ring mangahulugang “sa ilalim ng awtoridad ng Panginoong Jesus” o “bilang mga kumakatawan sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: anuman ang gawin ninyo
  rationale: 'Likas na Filipino ito para sa di-tiyak ngunit lubos na saklaw ng parirala: walang anumang salita o gawa ang ibinubukod.'
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: sa salita man o sa gawa
  rationale: Pinananatili nito ang maikli at balanseng pagtutumbas ng sinasabi at ginagawa, at malinaw ito sa modernong Filipino.
- source_word: πάντα
  choice: gawin ninyo ang lahat
  rationale: Ipinahahayag nito ang pagbubuod at ganap na saklaw ng naunang 'anuman,' habang likas na naipapahiwatig sa Filipino ang inuulit na pandiwang hinihingi ng diwa.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: sa pangalan ng Panginoong Jesus
  rationale: Direkta nitong pinananatili ang biblikal na idyoma at ang malawak na saklaw nito—awtoridad, pagkatawan, at pakikiisa—nang hindi nililimitahan sa iisang paliwanag.
- source_word: κυρίου
  choice: Panginoon
  rationale: Ang κύριος ay isang titulo kay Jesus sa kontekstong ito; pinananatili ng 'Panginoon' ang karaniwang gamit sa Bagong Tipan at ang teolohikal na bigat nito.
- source_word: εὐχαριστοῦντες
  choice: na nagpapasalamat
  rationale: Ipinakikita ng pariralang ito ang kasabay at nagpapatuloy na pagpapasalamat habang isinasagawa ang utos.
- source_word: τῷ θεῷ πατρὶ
  choice: sa Diyos Ama
  rationale: Malinaw at likas na katumbas ito ng appositional na parirala sa Griyego, nang hindi nagdaragdag ng hindi tahasang ugnayan.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Pinananatili nito ang wika ng pamamagitan at ang panghalip ng Griyego; ang pinakamalapit na tinutukoy nito ay ang Panginoong Jesus.
theological_decisions:
- issue: Diwa ng 'sa pangalan ng Panginoong Jesus'
  choice: Panatilihin sa pangunahing teksto ang idyomang 'sa pangalan ng Panginoong Jesus.'
  alternative: sa ilalim ng awtoridad ng Panginoong Jesus; bilang mga kumakatawan sa Panginoong Jesus
  rationale: Maaaring saklawin ng parirala ang awtoridad, pagkatawan, at pakikiisa. Ang pagpapanatili sa idyoma ay hindi nagsasara sa tunay na lawak ng kahulugan nito.
- issue: Tinutukoy ng 'sa pamamagitan niya'
  choice: Ang panghalip ay tumutukoy sa Panginoong Jesus, na siyang pamamagitan ng pagpapasalamat sa Diyos Ama.
  alternative: Isang pangkalahatang pagtukoy lamang na walang tahasang diin kay Cristo
  rationale: Ang 'Panginoong Jesus' ang pinakamalapit na pinatutungkulan ng panghalip, kaya ito ang pinakalikas na pagbasa ayon sa sintaks.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang 'ninyo' para sa maramihang kausap at pinanatili ang pamilyar na biblikal na idyomang 'sa pangalan ng.'
