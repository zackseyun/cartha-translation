revisions:
- from: At anuman ang gawin ninyo, sa salita man o sa gawa[a], gawin ninyo ang lahat sa pangalan ng Panginoong Jesus[b], na nagpapasalamat sa Diyos Ama sa pamamagitan niya.
  to: At anuman ang gawin ninyo, sa salita man o sa gawa, gawin ninyo ang lahat sa pangalan ng Panginoong Jesus[a], habang nagpapasalamat kayo sa Diyos Ama sa pamamagitan niya.
  rationale: Pinalitan ang nakabitin na participial na parirala ng “habang nagpapasalamat kayo” upang malinaw na ang mga kausap ang nagbibigay-pasalamat kasabay ng paggawa ng lahat sa pangalan ng Panginoong Jesus. Inayos din ang talababa tungkol sa idyomang “sa pangalan ng” upang maging ganap at natural ang Filipino nito. Inilipat ang natitirang talababa sa mismong idyomang ipinaliliwanag nito; ang dating talababa a ay hindi kinakailangan dahil ang “sa salita man o sa gawa” ay tuwirang salin na.
