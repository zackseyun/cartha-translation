  naturalness: Marangal at malinaw ang rehistro. Mas natural at hindi malabo ang “habang nagpapasalamat kayo,” na malinaw na tumutukoy sa “ninyo/kayo.”
  terminology: Ang “Panginoong Jesus,” “Diyos Ama,” at “sa pamamagitan niya” ay angkop at pinananatili ang saklaw ng Griyego. Ang talababa b ay kailangang ayusin sapagkat ang “bilang kumakatawan sa” ay kulang sa likas na Filipino; dapat tukuyin ang mga kumakatawan at ang kinakatawan.
