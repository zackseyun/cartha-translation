  - severity: medium
    issue: Ang “kahinahunan” para sa πραΰτητα ay hindi ang pinakatumpak na katumbas.
    rationale: Ang πραΰτητα ay kaamuan/gentleness. Ang “kahinahunan” ay maaaring tumukoy sa kalmadong pag-uugali, prudence, o pagpipigil, kaya mas maluwag ang saklaw nito.
