base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: tl
  text: Isuot ninyo, kung gayon, bilang mga hinirang ng Diyos—mga banal at minamahal—ang taos-pusong habag, kagandahang-loob, pagpapakumbaba, kaamuan, at pagtitiis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: isuot ninyo
  rationale: Pinananatili ang metapora ng pananamit sa pautos na anyo at natural itong maunawaan bilang pagsasabuhay ng mga katangian.
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw na ipinakikita ang lohikal na kaugnayan ng utos sa naunang talakayan.
- source_word: ὡς
  choice: bilang
  rationale: Ipinahahayag ang pagkilos na naaayon sa kanilang pagkakakilanlan nang hindi ginagawang tahasang sanhi ang salita.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: mga hinirang ng Diyos
  rationale: Tumpak at likas na salin ng mga taong pinili ng Diyos, nang hindi nagdaragdag ng isang tiyak na sistemang teolohikal.
- source_word: ἅγιοι
  choice: mga banal
  rationale: Pinananatili ang katawagang tumutukoy sa kanilang banal o ibinukod na kalagayan.
- source_word: ἠγαπημένοι
  choice: minamahal
  rationale: Inihahatid ang diwa ng mga taong minahal at patuloy na minamahal; sa konteksto, nauunawaang Diyos ang umiibig.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: taos-pusong habag
  rationale: Natural na Filipino para sa literal na larawan ng panloob na damdamin ng awa; ipinakikita ang malalim at taimtim na habag.
- source_word: χρηστότητα
  choice: kabutihan
  rationale: Karaniwan at malinaw na katawagan sa mabait at mapagkalingang pakikitungo, bagaman maaari ring isaling “kagandahang-loob.”
- source_word: ταπεινοφροσύνην
  choice: pagpapakumbaba
  rationale: Likas na modernong Filipino para sa mapagpakumbabang pag-iisip at asal.
- source_word: πραΰτητα
  choice: kahinahunan
  rationale: Ipinahahayag ang maamo at kontroladong pakikitungo nang hindi nagpapahiwatig ng kahinaan.
- source_word: μακροθυμίαν
  choice: pagtitiis
  rationale: Angkop sa matiyagang pagpipigil at pagtitiis sa pakikitungo sa ibang tao.
theological_decisions:
- issue: Paglalarawan sa ἐκλεκτοὶ τοῦ θεοῦ nang hindi ipinapasok ang isang partikular na doktrina tungkol sa paghirang
  choice: mga hinirang ng Diyos
  alternative: mga pinili ng Diyos
  rationale: Pinananatili nito ang pagkukusa ng Diyos at ang pagkakakilanlang ibinibigay ng teksto, ngunit hindi ipinaliliwanag ang paraan o kaayusan ng paghirang na hindi naman tinatalakay sa talata.
- issue: Kung sino ang umiibig sa ἠγαπημένοι
  choice: minamahal
  alternative: mga minamahal ng Diyos
  rationale: Ang gramatika ay nagsasabing “minamahal” nang hindi inuulit ang Diyos bilang tahasang tagaganap; pinananatili ng salin ang anyo at ang bahagyang implicit na ugnayan.
- issue: Pagpapanatili sa metapora ng pananamit
  choice: isuot ninyo
  alternative: taglayin ninyo
  rationale: Ang metapora ay mahalagang bahagi ng exhortasyon at malinaw naman sa Filipino, kaya hindi ito pinaplat o ginagawang abstrakto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng pananamit at ang listahan ng mga birtud. Ginamit ang “taos-pusong habag” upang mailapit sa karaniwang mambabasa ang Semitikong-Griyegong idyoma nang hindi literal na binabanggit ang mga laman-loob.
