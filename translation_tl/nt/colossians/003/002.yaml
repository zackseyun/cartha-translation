id: COL.3.2
reference: Colossians 3:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: tl
  text: Ituon ninyo ang inyong isip sa mga bagay na nasa itaas[a], hindi sa mga bagay na nasa lupa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Isipin ninyo ang mga bagay na nasa itaas.” Saklaw ng pandiwang Griyego hindi lamang ang pag-iisip kundi pati ang pagtutuon ng pananaw, saloobin, o malasakit sa isang bagay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bagay sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: mga bagay na nasa itaas
  rationale: Ang artikulong neuter plural na kasama ng ἄνω ay ginagamit bilang pangngalan at tumutukoy sa mga realidad o bagay sa itaas. Pinananatili ng salin ang maramihan at ang tahasang kaibahan nito sa mga bagay na nasa lupa.
- source_word: φρονεῖτε
  choice: Ituon ninyo ang inyong isip sa
  rationale: Ang φρονέω ay higit sa simpleng pag-iisip; ipinahihiwatig nito ang patuloy na paglalagak ng isip, saloobin, at malasakit sa isang bagay. Natural sa modernong Tagalog ang “ituon ang isip” at angkop ito sa pautos na anyo.
- source_word: μὴ
  choice: hindi
  rationale: Tuwirang itinatanggi ng μή ang ikalawang pinag-uukulan ng utos at pinananatili ang paghahambing ng dalawang saklaw.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: mga bagay na nasa lupa
  rationale: Pinananatili nito ang konkretong pagkakaibang panlunan sa pagitan ng “nasa itaas” at “nasa lupa,” nang hindi ito agad binibigyang-kahulugang moral sa salin.
- source_word: γῆς
  choice: lupa
  rationale: Sa kosmikong paghahambing sa “itaas,” tumutukoy ang γῆ sa lupa o daigdig, hindi sa isang partikular na lupain. Mas natural dito sa Tagalog ang “nasa lupa.”
theological_decisions:
- issue: Saklaw ng utos na φρονεῖτε
  choice: Utos na patuloy na ituon ang isip, saloobin, at pagpapahalaga sa mga realidad sa itaas
  alternative: Isang mas makitid na utos na isipin lamang sa intelektuwal na paraan ang mga bagay sa itaas
  rationale: Kasama sa semantikong saklaw ng φρονέω ang pag-iisip, disposisyon, at pananaw. Ang “ituon ninyo ang inyong isip” ay nagpapanatili sa mas malawak na puwersa nito nang hindi nagdaragdag ng tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang maipakita na maramihan ang kausap. Iniwasan ang “makalangit na mga bagay” dahil mas interpretibo iyon kaysa sa literal na panlunang paghahambing ng Griyego.
