base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: tl
  text: Kayong mga amo, ibigay ninyo sa inyong mga alipin ang nararapat at patas na pagtrato,[a] yamang nalalaman ninyong kayo rin ay may Panginoon sa langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang tama at ang pagkakapantay-pantay.” Ang salitang Griyego na isinaling “patas” ay maaari ring mangahulugang “pagiging patas,” “pagkamakatarungan,” o “pagkakapantay-pantay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Kayong mga amo
  rationale: Sa konteksto ng sambahayan, tumutukoy ito sa mga taong may kapangyarihan sa mga alipin. Ang “mga amo” ang natural at malinaw na katawagan sa makabagong Tagalog; ang “mga panginoon” ay maaaring magbigay ng di-angkop na marangal o teolohikal na dating.
- source_word: τὸ δίκαιον
  choice: ang nararapat
  rationale: Ang substantibong pang-uri ay tumutukoy sa kung ano ang tama o makatarungan. Natural sa Tagalog ang “ang nararapat” at malinaw ang etikal na puwersa nito.
- source_word: τὴν ἰσότητα
  choice: makatarungang pagtrato
  rationale: Maaaring mangahulugan ang ἰσότης ng pagkakapantay-pantay, pagiging patas, o makatarungang pagtrato. Sa ugnayan ng amo at alipin, malinaw at natural ang “makatarungang pagtrato,” habang pinananatili sa talababa ang mahalagang alternatibong “pagkakapantay-pantay.”
- source_word: τοῖς δούλοις
  choice: sa inyong mga alipin
  rationale: Dahil tahasang inilalarawan ang ugnayan sa mga amo, litaw ang kalagayang pagkaalipin. Hindi ito pinalalambot bilang “mga lingkod.”
- source_word: παρέχεσθε
  choice: ibigay ninyo
  rationale: Ipinahahayag ng pautos na pandiwa ang pagkakaloob o pagbibigay ng nararapat na pakikitungo. Karaniwan at tuwiran sa Tagalog ang “ibigay ninyo.”
- source_word: εἰδότες
  choice: yamang nalalaman ninyo
  rationale: Ipinakikita nito ang kaalamang batayan ng utos, ngunit hindi higit na nililimitahan ang ugnayan ng sugnay kaysa sa ipinahihintulot ng participle.
- source_word: καὶ ὑμεῖς
  choice: kayo rin
  rationale: Pinananatili nito ang diin na maging ang mga amo ay nasa ilalim ng kapangyarihan ng iba.
- source_word: κύριον
  choice: Panginoon
  rationale: Pinananatili ng “Panginoon” ang teolohikal na bigat ng titulo at malinaw itong naiiba sa “mga amo” sa lupa.
- source_word: ἐν οὐρανῷ
  choice: sa langit
  rationale: Ito ang karaniwan, malinaw, at tumpak na katumbas sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa δοῦλοι sa kodigo ng sambahayan
  choice: mga alipin
  alternative: mga lingkod
  rationale: Dahil ang mga κύριοι ang tuwirang kinakausap, mahalaga sa konteksto ang kalagayang pagkaalipin. Ang “mga lingkod” ay maaaring magpalabo o magpalambot sa panlipunang realidad ng teksto.
- issue: Saklaw ng kahulugan ng ἰσότητα
  choice: makatarungang pagtrato
  alternative: pagkakapantay-pantay
  rationale: Maaaring tumukoy ang salita sa patas o makatarungang pakikitungo at maaari rin itong mangahulugang pagkakapantay-pantay. Ginamit sa pangunahing teksto ang natural na pahayag ayon sa konteksto, ngunit hindi inalis ang mas literal at makabuluhang alternatibo; inilagay ito sa talababa.
- issue: Pagkakaiba at ugnayan ng dalawang gamit ng κύριος
  choice: mga amo … Panginoon
  alternative: mga panginoon … Panginoon
  rationale: 'Iisang salitang Griyego ang nasa likod ng dalawang gamit, ngunit hinihingi ng natural na Tagalog ang “amo” para sa taong namamahala sa alipin at “Panginoon” para sa nasa langit. Nananatili ang teolohikal na pagtutulad: ang mga amo ay mayroon ding nakatataas sa kanila.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “amo” bilang likas na katawagan sa konteksto at “alipin” upang hindi pagtakpan ang bonded status. Ang “yamang nalalaman” ay bahagyang pormal ngunit angkop sa dignidad ng tekstong biblikal.
