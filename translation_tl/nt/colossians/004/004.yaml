lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas at tuwirang panandang Filipino para sa layunin; pinananatili nito ang telic na puwersa ng sugnay.
- source_word: φανερώσω
  choice: maipahayag ko ... nang malinaw
  rationale: Ipinahahayag ang diwa ng pagpapakita o pagpapakilala sa mensahe sa konteksto ng pangangaral, habang pinananatili ang posibilidad ng malinaw na pagpapahayag.
- source_word: αὐτὸ
  choice: ito
  rationale: Pinananatili ang panghalip ng Griyego at tumutukoy sa naunang binanggit na hiwaga, nang hindi inuulit ang antecedent sa pangunahing teksto.
- source_word: ὡς
  choice: gaya ng
  rationale: Ipinakikilala ang pamantayan o paraang nararapat sa pagsasalita ni Pablo.
- source_word: δεῖ
  choice: nararapat
  rationale: Natural na Filipino para sa obligasyon o pangangailangan, nang hindi labis na pinatitindi ang diwa.
- source_word: με
  choice: kong
  rationale: Ang unang panauhan ay natural na ikinakabit sa pandiwang-pangngalang “pagsasalita” sa pariralang Filipino.
- source_word: λαλῆσαι
  choice: pagsasalita
  rationale: Tuwirang tumutumbas sa malawak na diwa ng pagsasalita; hindi dinaragdagan ng mas tiyak na diwa ng pangangaral na wala sa mismong pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maipahayag ... nang malinaw” upang maging natural sa konteksto ng pagpapahayag ng mensahe, samantalang inilagay sa talababa ang mas literal na mga alternatibo. Ang ayos na “gaya ng nararapat kong pagsasalita” ay sadyang bahagyang pormal upang mapanatili ang ugnayan ng ὡς δεῖ με λαλῆσαι sa pamantayan o obligasyon ng pagsasalita.
