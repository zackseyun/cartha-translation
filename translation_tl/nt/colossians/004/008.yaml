  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: tl
  text: 'Isinugo ko siya sa inyo para mismo sa layuning ito: upang malaman ninyo ang kalagayan namin[a] at upang palakasin niya ang inyong mga puso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “upang malaman namin ang kalagayan ninyo.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Isinugo ko siya sa inyo
  rationale: Tumutukoy ang panghalip kay Tiquico sa naunang talata. Likas sa makabagong Tagalog ang ayos na ito, at ang simpleng aspektong naganap ng “isinugo” ay angkop sa aorist.
- source_word: εἰς αὐτὸ τοῦτο
  choice: para sa layuning ito mismo
  rationale: Pinananatili ng “ito mismo” ang pagbibigay-diin ng αὐτὸ τοῦτο, habang malinaw na layunin ang ipinahahayag ng parirala.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: upang malaman ninyo ang kalagayan namin
  rationale: Ang τὰ περὶ ἡμῶν ay tumutukoy sa mga balita o kalagayan nina Pablo. Mas natural at malinaw ang “kalagayan namin” kaysa sa literal na “mga bagay tungkol sa amin.”
- source_word: παρακαλέσῃ
  choice: palakasin
  rationale: Sa konteksto ng pagdalaw at pagbabalita ni Tiquico, ipinahihiwatig ng παρακαλέω ang pagbibigay-lakas at loob. Hindi nito nililimitahan ang kahulugan sa pag-aliw lamang o sa pangangaral.
- source_word: τὰς καρδίας ὑμῶν
  choice: ang inyong mga puso
  rationale: Pinananatili nito ang biblikal na larawan ng puso bilang sentro ng panloob na buhay, sa halip na ipaliwanag ito sa isang mas makitid na paraphrase.
theological_decisions:
- issue: Pagkakaiba-iba ng teksto sa direksiyon ng pag-alam
  choice: “upang malaman ninyo ang kalagayan namin” (γνῶτε τὰ περὶ ἡμῶν)
  alternative: “upang malaman namin ang kalagayan ninyo” (γνῶμεν τὰ περὶ ὑμῶν o kahalintulad na anyo)
  rationale: Sinusunod ng pangunahing teksto ang ibinigay na SBLGNT. Inilalagay sa talababa ang mahalagang alternatibong pagbasa dahil binabago nito kung sino ang makaaalam at kung kaninong kalagayan ang aalamin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “palakasin ... ang mga puso” upang mapanatili ang biblikal na larawan at ang malawak na diwa ng pagpapalakas ng loob.
