  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: tl
  text: Sapagkat pinatototohanan ko tungkol sa kanya na labis ang kanyang pagpapagal[a] para sa inyo, para sa mga nasa Laodicea, at para sa mga nasa Hierapolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “marami siyang pagpapagal,” “matinding pagpapagal,” o, ayon sa konteksto, “matindi ang kanyang pagmamalasakit.” Ang salitang Griyego ay maaaring tumukoy sa mabigat na paggawa at, ayon sa konteksto, sa matinding pagmamalasakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: Sapagkat mapatutunayan ko
  rationale: Ang “Sapagkat” ay nagpapanatili sa paliwanag na ugnayan ng γάρ sa naunang talata. Ang “mapatutunayan ko” ay likas na Filipino para sa personal na pagpapatotoo ni Pablo; ang tinutukoy ng αὐτῷ ay naipahahayag ng kasunod na “niya,” na tumutukoy kay Epafras, nang hindi gumagamit ng alanganing pariralang “nagpapatotoo ako para sa kanya.”
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: na puspusan ang pagpapagal niya
  rationale: Ipinahahayag ng “puspusan ang pagpapagal” ang matindi at masikap na paggawa na saklaw ng πολὺν πόνον. Likas ito sa modernong Filipino at hindi nililimitahan ang kahulugan sa damdamin lamang, bagaman maaaring kasama sa konteksto ang matinding pagmamalasakit at pakikipagpunyagi sa panalangin.
- source_word: ὑπὲρ ὑμῶν
  choice: para sa inyo
  rationale: Dito, ipinapakita ng ὑπέρ ang pagsisikap na ukol sa kapakanan ng mga taga-Colosas; malinaw at natural ang “para sa inyo.”
- source_word: καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει
  choice: gayundin para sa mga nasa Laodicea at sa mga nasa Hierapolis
  rationale: Pinananatili ang magkakatulad na pagtukoy sa mga mananampalataya sa dalawang lungsod. Nililinaw ng “gayundin para sa” na kapuwa sila saklaw ng pagpapagal ni Epafras.
theological_decisions:
- issue: Saklaw ng kahulugan ng πόνος sa paglilingkod ni Epafras
  choice: puspusan ang pagpapagal
  alternative: matindi ang pagmamalasakit; matinding hirap; maraming pagpapagal
  rationale: Pangunahing tumutukoy ang πόνος sa hirap o masikap na paggawa. Dahil binabanggit sa naunang talata ang pakikipagpunyagi ni Epafras sa panalangin, posible ring madama rito ang matinding pagmamalasakit. Pinananatili ng “pagpapagal” ang mas malawak at kongkretong diwa nang hindi ipinipirmi ang salita sa emosyonal na paghihirap lamang.
- issue: Gamit ng datibong αὐτῷ kasama ng μαρτυρῶ
  choice: Ipinahiwatig bilang pagpapatotoo tungkol kay Epafras sa pamamagitan ng “mapatutunayan ko … niya”
  alternative: nagpapatotoo ako para sa kanya; nagpapatotoo ako tungkol sa kanya
  rationale: Maaaring maunawaan ang datibo bilang patotoong ibinibigay tungkol sa kaniya o pabor sa kaniya. Iniiwasan ng salin ang di-likas na direktang calque sa Filipino habang pinananatili ang diwa na si Pablo mismo ang nagpapatunay sa pagpapagal ni Epafras.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “puspusan ang pagpapagal” upang maging natural at malinaw, habang ang “gayundin” ay nagpapanatili sa maayos na paralelismo ng tatlong pangkat.
