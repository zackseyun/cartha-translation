  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: tl
  text: Kasama niya si Onesimo, ang tapat at minamahal na kapatid, na isa sa inyo.[a] Ipapaalam nila sa inyo ang lahat ng bagay dito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nagmula sa inyo.”
    reason: lexical_alternative
  - marker: b
    text: O “sasabihin nila sa inyo ang lahat ng nangyayari rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: Kasama niya si Onesimo
  rationale: Ipinahihiwatig ng σύν ang pagsama ni Onesimo kay Tiquico na binanggit sa naunang talata. Idinagdag ang panghalip na “niya” upang maging malinaw at natural sa Filipino ang ugnayan, nang hindi binabago ang diwa.
- source_word: πιστῷ
  choice: tapat
  rationale: Saklaw ng πιστός ang pagiging tapat o maaasahan. Ang “tapat” ay likas sa kasalukuyang Filipino at pinananatili ang etikal at espirituwal na himig ng salita.
- source_word: ἀγαπητῷ
  choice: minamahal
  rationale: Ang “minamahal” ay malinaw at marangal na katumbas ng ἀγαπητός, at naipapahayag ang init ng pagmamahal sa loob ng pamayanang Cristiano.
- source_word: ἀδελφῷ
  choice: kapatid
  rationale: Ang ἀδελφός ay tumutukoy rito sa isang lalaking kapwa mananampalataya. Sa Filipino, natural na ginagamit ang “kapatid” para sa ganitong ugnayang espirituwal nang hindi na kailangang palawakin ang teksto.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: na isa sa inyo
  rationale: Maaaring ipahiwatig ng ἐξ ὑμῶν ang pinagmulan o pagiging kabilang sa pamayanan. Ang “isa sa inyo” ay natural at pinananatili ang pagkakakilanlan ni Onesimo sa mga taga-Colosas.
- source_word: γνωρίσουσιν
  choice: Ipapaalam nila
  rationale: Ang γνωρίζω ay nangangahulugang magpabatid o magpaalam ng impormasyon. Ang “ipapaalam” ay natural na Filipino at tumpak na nagpapahayag ng pagpapabatid.
- source_word: πάντα τὰ ὧδε
  choice: ang lahat ng bagay dito
  rationale: Tinutukoy ng parirala ang lahat ng nauukol sa kinaroroonan ni Pablo. Pinananatili ng “lahat ng bagay dito” ang bahagyang pagiging pangkalahatan ng Griego sa halip na tukuying iyon lamang ang ‘mga nangyayari.’
theological_decisions:
- issue: Eklesyal na diwa ng ἀδελφῷ
  choice: kapatid
  alternative: kapatid sa pananampalataya
  rationale: Malinaw sa konteksto na kapwa mananampalataya si Onesimo, ngunit “kapatid” lamang ang nasa Griego. Pinananatili nito ang larawang pampamilya nang walang paliwanag na idinaragdag sa pangunahing teksto.
- issue: Saklaw ng ἐξ ὑμῶν
  choice: na isa sa inyo
  alternative: na nagmula sa inyo
  rationale: Ang piniling anyo ay nagpapakita ng kaugnayan ni Onesimo sa pamayanang taga-Colosas nang hindi nag-aangkat ng mga palagay tungkol sa kaniyang katayuang panlipunan mula sa ibang sulat.
- issue: Kahulugan ng τὰ ὧδε
  choice: ang lahat ng bagay dito
  alternative: ang lahat ng nangyayari rito
  rationale: Hindi tahasang sinasabi ng Griego na mga pangyayari lamang ang tinutukoy. Pinananatili ng pangunahing salin ang mas malawak na saklaw ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “minamahal” sa halip na mas pormal o makalumang “sinisinta,” at pinanatili ang payak na katawagang “kapatid.” Ang mga panandang [a] at [b] ay kapuwa lumilitaw sa pangunahing teksto.
