base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: tl
  text: Kapag nabasa na[a] ang sulat na ito sa inyong kalipunan, tiyakin ninyong mabasa rin ito sa iglesya ng mga taga-Laodicea. Basahin din ninyo ang sulat na mula sa Laodicea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “binasa nang malakas” o “binasa sa harap ng kapulungan.” Payak na “bumasa” ang pandiwang Griyego, bagaman malamang na pampubliko ang pagbasa sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak kung anong sulat ito. Literal na “ang mula sa Laodicea” ang Griyego; maaaring tumukoy ito sa isang sulat na noon ay nasa Laodicea, hindi kinakailangang sa isang sulat na orihinal na para roon.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: nabasa / mabasa / basahin
  rationale: Ang ἀναγινώσκω ay nangangahulugang “bumasa” at sa kontekstong ito ay malamang na tumutukoy sa pagbasa sa harap ng nagkakatipong iglesya. Pinananatili sa pangunahing teksto ang payak at natural na “basa,” habang nililinaw sa talababa ang malamang na pampublikong konteksto.
- source_word: παρ’ ὑμῖν
  choice: sa gitna ninyo
  rationale: Ipinahihiwatig ng pariralang ito ang pagbasa sa komunidad ng mga taga-Colosas, hindi lamang kung sino ang nagsagawa ng pagbasa. Likas sa Filipino ang “sa gitna ninyo” at napapanatili nito ang panlipunan at lokatibong diwa.
- source_word: ἡ ἐπιστολή
  choice: ang sulat na ito
  rationale: Ang artikulo ay tumutukoy sa kasalukuyang sulat na ipinadala sa mga taga-Colosas. Ginagawang malinaw ng “na ito” ang reperensiya nang hindi nagdaragdag ng bagong kahulugan.
- source_word: ποιήσατε ἵνα
  choice: tiyakin ninyong
  rationale: Ang pautos na ποιήσατε na sinusundan ng ἵνα ay idyomatikong humihiling na tiyaking mangyayari ang kasunod na gawain. Ang “tiyakin ninyong” ay natural at nagpapanatili ng lakas ng utos.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: sa iglesya ng mga taga-Laodicea
  rationale: 'Pinananatili ng salin ang estruktura ng Griyego: ang iglesyang binubuo ng o nauugnay sa mga taga-Laodicea. Ang “iglesya” ay karaniwan at angkop sa kontekstong Paulino.'
- source_word: τὴν ἐκ Λαοδικείας
  choice: ang sulat na mula sa Laodicea
  rationale: Bagaman ipinahihiwatig lamang sa Griyego ang pangngalang ἐπιστολή, kailangang ulitin ang “sulat” sa Filipino upang maging malinaw at natural. Ang “mula sa” ay tuwirang kumakatawan sa ἐκ at hindi ipinapalagay na ang sulat ay orihinal na para sa Laodicea.
theological_decisions:
- issue: Pagkakakilanlan ng sulat na mula sa Laodicea
  choice: Hindi tinukoy kung anong sulat ito; isinaling neutral bilang “ang sulat na mula sa Laodicea.”
  alternative: Maaaring sulat itong para sa mga taga-Laodicea, sulat na ipinadala mula roon, o isang umiikot na sulat na kasalukuyang nasa Laodicea.
  rationale: Ang Griyego ay nagsasaad lamang na ang sulat ay “mula sa Laodicea” at hindi nagbibigay ng sapat na batayan upang iugnay ito sa isang tiyak na kanonikal o di-kanonikal na akda.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “iglesya” bilang karaniwang terminong Paulino at iniwasang gawing mas tiyak kaysa sa Griyego ang pagkakakilanlan ng ikalawang sulat.
