translation:
  language: tl
  text: Magtiyaga kayo sa pananalangin[a], na manatiling mapagbantay rito nang may pasasalamat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Magpatuloy kayong matatag sa pananalangin, na maging mapagbantay rito nang may pasasalamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχῇ
  choice: sa pananalangin
  rationale: Ang may-artikulong datibo ay tumutukoy sa pananalangin bilang patuloy na gawain, hindi sa isang partikular na panalangin. Likas sa modernong Tagalog ang “sa pananalangin.”
- source_word: προσκαρτερεῖτε
  choice: Magpatuloy kayong matiyaga
  rationale: Ipinahihiwatig ng pangkasalukuyang pautos ang tuloy-tuloy at matatag na pagtitiyaga. Pinananatili ng parirala ang lakas ng utos at ang diwa ng pagpapatuloy.
- source_word: γρηγοροῦντες
  choice: habang nananatiling mapagbantay
  rationale: Inilalarawan ng pandiwaring ito kung paano isasagawa ang utos tungkol sa pananalangin. Ang “mapagbantay” ay nagpapahayag ng espirituwal na pagkaalisto nang hindi ipinapalagay na literal na hindi pagtulog ang tinutukoy.
- source_word: ἐν αὐτῇ
  choice: rito
  rationale: Ang panghalip ay pinakanatural na tumutukoy pabalik sa pananalangin. Malinaw at natural sa Tagalog ang “rito,” at hindi nito inuulit nang hindi kailangan ang pangngalan.
- source_word: ἐν εὐχαριστίᾳ
  choice: nang may pasasalamat
  rationale: Ipinakikita ng parirala ang saloobin o paraang kaakibat ng mapagbantay na pananalangin. Likas sa Tagalog ang “nang may pasasalamat” at malinaw na pinananatili ang diwa ng pagpapasalamat.
