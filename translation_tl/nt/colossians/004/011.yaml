  verdict: revise
  source_fidelity: Napananatili ng draft ang pangalan, ang pagiging “tinatawag na Justus,” ang diin ng “sila lamang,” ang paglilingkod “para sa kaharian ng Diyos,” at ang aorist na “naging ... sa akin.” Gayunman, ang “mga tuli” ay hindi sapat na malinaw na katumbas ng οἱ ὄντες ἐκ περιτομῆς at maaaring mabasa lamang bilang mga taong pisikal na tuli, sa halip na bilang pangkat na tinutukoy ng “pagtutuli.”
  naturalness: Ang “Sila lamang sa mga tuli” ay medyo putol at hindi likas sa modernong Filipino. Ang “Sila lamang sa mga mula sa pagtutuli” ay mas malinaw, nananatiling malapit sa Griyego, at hindi pa humuhusga kung etnikong Judio o isang mas makitid na pangkat ang tinutukoy.
  terminology: Ang “pagtutuli” ay angkop na terminong pangkasulatan para sa περιτομή. Ang “mga kamanggagawa,” “kaharian ng Diyos,” at “kaaliwan” ay malinaw at angkop sa rehistro.
