id: COL.4.11
reference: Colossians 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: tl
  text: at si Jesus na tinatawag na Justus. Sila lamang sa mga mula sa pagtutuli[a] ang mga kamanggagawa para sa kaharian ng Diyos,[b] at naging kaaliwan sila sa akin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga Judio.” Sa literal, “mga mula sa pagtutuli.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Sila lamang ang mga kamanggagawa para sa kaharian ng Diyos na kabilang sa pagtutuli.”'
    reason: syntactic_ambiguity
  - marker: c
    text: O “at naging kalakasan sila ng loob ko” o “at napatunayan silang kaaliwan sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Bagong Tipan; bagaman katumbas ito ng Josue, mas malinaw sa mga mambabasa ang “Jesus” sa kontekstong ito.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: na tinatawag na Justus
  rationale: Likas sa modernong Tagalog at malinaw na nagpapakilala sa isa pang pangalang ginagamit para sa taong ito.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: sa mga tuli
  rationale: Pinananatili ang larawan ng περιτομή bilang tanda ng pagkakakilanlang Judio, habang iniiwasan ang masyadong literal at alanganing “mula sa pagtutuli.”
- source_word: οὗτοι μόνοι
  choice: Sila lamang
  rationale: Pinananatili ang diin sa pagiging sila lang sa tinutukoy na pangkat.
- source_word: συνεργοὶ
  choice: mga kamanggagawa
  rationale: Karaniwan, malinaw, at marangal na tawag sa mga kasamang gumagawa sa paglilingkod.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: para sa kaharian ng Diyos
  rationale: Ipinahahayag ang layunin o pinaglilingkurang adhikain ng kanilang paggawa nang hindi ginagawang labis na teknikal ang εἰς.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: naging kaaliwan sila sa akin
  rationale: Malapit sa aorist na ἐγενήθησαν at pinananatili ang pangunahing diwa ng παρηγορία bilang kaaliwan, habang inilalagay sa talababa ang posibleng “kalakasan ng loob.”
theological_decisions:
- issue: Saklaw ng “mula sa pagtutuli” at ng “sila lamang”
  choice: Ang “sila lamang sa mga tuli” ay tumutukoy sa mga kasamahang may pinagmulang Judio na siyang tanging mga kamanggagawa ni Pablo mula sa pangkat na iyon.
  alternative: Maaaring unawain na sila lamang ang mga kamanggagawa para sa kaharian ng Diyos na kabilang sa mga tuli, o na tumutukoy ito sa isang mas makitid na partidong nagtataguyod ng pagtutuli.
  rationale: Ang ayos ng Griyego ay unang nagtatakda sa pangkat na οἱ ὄντες ἐκ περιτομῆς at saka nagsasabing οὗτοι μόνοι συνεργοί. Pinananatili ng salin ang ugnayang ito nang hindi tuwirang pinapangalanan ang isang partidong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga tuli” bilang natural ngunit source-conscious na pahayag, at nilinaw sa talababa ang literal at interpretibong mga alternatibo. Inilagay ang bawat panandang [a], [b], at [c] sa pangunahing teksto.
