  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: tl
  text: Ang pananalita ninyo ay laging may biyaya[a], na tinimplahan ng asin[b], upang malaman ninyo kung paano kayo nararapat sumagot sa bawat isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magiliw” o “kaaya-aya.” Ang “may biyaya” ay maaaring tumukoy sa pananalitang kakikitaan ng kabaitan, kagandahang-loob, o pabor.
    reason: lexical_alternative
  - marker: b
    text: Ang “tinimplahan ng asin” ay isang talinghaga para sa pananalitang angkop, kawili-wili, at may karunungan—hindi matabang o nakasasama.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: ang pananalita ninyo
  rationale: Sa kontekstong nagpapayo tungkol sa pakikitungo at pagsagot sa iba, ang λόγος ay tumutukoy sa paraan o nilalaman ng pagsasalita, hindi lamang sa isang salita o pormal na mensahe.
- source_word: πάντοτε
  choice: lagi
  rationale: Natural at malinaw na katumbas ng pang-abay na sumasaklaw sa lahat ng pagkakataon.
- source_word: ἐν χάριτι
  choice: may biyaya
  rationale: Pinananatili nito ang salitang χάρις at ang posibleng mas malawak na Paulinong diwa ng biyaya, habang likas ding nauunawaan bilang pananalitang mabait at kaaya-aya.
- source_word: ἅλατι ἠρτυμένος
  choice: na parang pagkaing tinimplahan ng asin
  rationale: Pinananatili ang metapora ng pagtimpla, ngunit idinaragdag ang tahasang paghahambing sa pagkain upang maging malinaw at natural sa Tagalog; ipinahihiwatig nito ang pananalitang angkop, kawili-wili, at may karunungan.
- source_word: εἰδέναι
  choice: upang malaman ninyo
  rationale: Ang infinitive ay maaaring magpahayag ng layunin o bunga kaugnay ng naunang tagubilin. Ang 'upang' ay malinaw ngunit hindi labis na nilulutas ang ugnayang sintaktiko.
- source_word: πῶς δεῖ
  choice: kung paano nararapat
  rationale: Ipinahahayag ng δεῖ ang kinakailangan o angkop gawin; ang 'nararapat' ay may sapat na bigat nang hindi nagiging labis na mariin.
- source_word: ἑνὶ ἑκάστῳ
  choice: ang bawat isa
  rationale: 'Pinananatili ang distributibong diin: ang sagot ay dapat iangkop sa bawat indibidwal.'
- source_word: ἀποκρίνεσθαι
  choice: sagutin
  rationale: Direkta at natural na katumbas para sa pagbibigay ng sagot sa isang tao.
theological_decisions:
- issue: Saklaw ng χάρις sa paglalarawan ng pananalita
  choice: may biyaya
  alternative: magiliw / kaaya-aya
  rationale: Hindi nililimitahan ang χάρις sa kagandahang-asal lamang; naiiwan ang posibilidad na tumukoy kapuwa sa magiliw na pananalita at sa mas malawak na diwa ng biyaya.
- issue: Ugnayan ng εἰδέναι sa naunang tagubilin
  choice: upang malaman ninyo
  alternative: nang sa gayon ay alam ninyo / malaman kung paano
  rationale: Ipinakikita ang malamang na layunin o bunga, habang kinikilalang hindi ganap na tiyak ang sintaktikong puwersa ng infinitive.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'pananalita' sa halip na literal na 'salita,' at nilinaw ang metapora ng asin sa pamamagitan ng 'parang pagkaing' nang hindi inaalis ang orihinal na larawan.
