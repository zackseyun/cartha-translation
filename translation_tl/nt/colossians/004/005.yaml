  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: tl
  text: Mamuhay kayo nang may karunungan sa pakikitungo sa mga nasa labas[a], at lubos ninyong gamitin ang pagkakataon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nasa labas,” ibig sabihin, mga taong hindi kabilang sa komunidad ng mga mananampalataya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “binibili nang lubusan ang panahon”; ang diwa ay lubos na gamitin ang napapanahong pagkakataon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: nang may karunungan
  rationale: Ipinahahayag nito ang paraan ng pamumuhay habang pinananatili ang pangngalang σοφία at ang bigat nitong etikal; natural din ito sa makabagong Filipino.
- source_word: περιπατεῖτε
  choice: Mamuhay kayo
  rationale: Metaporikal dito ang pandiwa at tumutukoy sa kabuuang asal o paraan ng pamumuhay. Mas malinaw at natural sa Filipino ang “mamuhay” kaysa sa literal na “lumakad,” na maaaring mapagkamalang pisikal na pagkilos.
- source_word: πρὸς τοὺς ἔξω
  choice: sa pakikitungo sa mga nasa labas
  rationale: Ipinakikita ng πρός ang oryentasyon ng asal patungo sa mga hindi kabilang sa komunidad ng mga mananampalataya. Pinananatili ng “mga nasa labas” ang larawan at bahagyang di-tuwirang pahayag ng Griyego.
- source_word: τὸν καιρόν
  choice: ang bawat pagkakataon
  rationale: Ang καιρός ay tumutukoy sa angkop o napapanahong pagkakataon, hindi lamang sa oras bilang abstraktong konsepto. Ang “bawat” ay likas sa idyomang Filipino para sa ganap na paggamit ng pagkakataong tinutukoy ng buong parirala.
- source_word: ἐξαγοραζόμενοι
  choice: samantalahin
  rationale: Sa kontekstong ito, idyomatiko ang pandiwa at nangangahulugang lubos na gamitin ang pagkakataon. Iniiwasan nito ang maling pagpasok ng teolohikal na diwa ng pagtubos, habang inilalahad sa talababa ang literal na larawang pangkalakalan.
theological_decisions:
- issue: Posibleng teolohikal na labis na pagbasa sa ἐξαγοραζόμενοι
  choice: Payo na mamuhay nang may karunungan at lubos na gamitin ang mga pagkakataon sa pakikitungo sa mga hindi kabilang sa komunidad
  alternative: Mas literal na “tubusin ang panahon,” na maaaring magpahiwatig ng doktrina ng pagtubos
  rationale: Idyomatiko rito ang pandiwa at hindi tumutukoy sa pagtubos mula sa kasalanan. Hindi isinasalin ang isang doktrinal na kahulugang wala sa konteksto, ngunit pinananatili sa talababa ang literal na larawan.
- issue: Pagkakakilanlan ng τοὺς ἔξω
  choice: Mga taong nasa labas ng komunidad ng mga mananampalataya
  alternative: Mga tagalabas sa pangkalahatang panlipunang kahulugan
  rationale: Karaniwang tawag ito sa mga hindi kabilang sa komunidad, ngunit ang bahagyang di-tuwirang anyong “mga nasa labas” ay nagpapanatili sa pananalita ng teksto at ipinaliliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamuhay” upang natural na maipahayag ang metaporikal na “lumakad,” at “mga nasa labas” upang mapanatili ang larawan ng orihinal nang walang mapanlait na himig. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
