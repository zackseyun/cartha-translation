id: COL.4.10
reference: Colossians 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: tl
  text: 'Binabati kayo ni Aristarco, na aking kapwa bilanggo, at ni Marcos, na pinsan ni Bernabe (tungkol sa kanya, tumanggap kayo ng mga tagubilin: kung pumunta siya sa inyo, malugod ninyo siyang tanggapin[a]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanggapin ninyo siya.” Maaari ring tumukoy ang pandiwang Griyego sa magiliw na pagtanggap sa isang panauhin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: Binabati kayo
  rationale: Likas at tuwirang paraan ito sa modernong Filipino para sa karaniwang pormula ng pagbati sa isang liham.
- source_word: ὁ συναιχμάλωτός μου
  choice: na kapwa ko bilanggo
  rationale: Pinananatili nito ang tuwirang kahulugan ng tambalang pangngalan nang hindi ipinapasiya kung literal o matalinghaga ang pagkakabilanggo.
- source_word: ὁ ἀνεψιὸς Βαρναβᾶ
  choice: na pinsan ni Bernabe
  rationale: Sa gamit ng Koine Greek, mas tiyak na tumutukoy ang ἀνεψιός sa pinsan, hindi sa pamangkin o sa isang di-tiyak na kamag-anak.
- source_word: ἐλάβετε ἐντολάς
  choice: tumanggap kayo ng mga tagubilin
  rationale: Ipinahahayag ng 'mga tagubilin' ang may-awtoridad na patnubay nang hindi pinatitindi ito bilang mahigpit na mga utos.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: kung pumunta siya sa inyo
  rationale: Natural itong future-oriented na kondisyon sa Filipino at malinaw na pinananatili ang posibilidad na nasa Griyego.
- source_word: δέξασθε αὐτόν
  choice: malugod ninyo siyang tanggapin
  rationale: Sa konteksto ng paglalakbay at pagpapatuloy, ang pandiwa ay nagpapahiwatig ng magiliw na pagtanggap; ipinakikita ng 'malugod' ang aspektong iyon sa natural na Filipino.
theological_decisions:
- issue: Uri ng kaugnayan ni Pablo kay Aristarco sa συναιχμάλωτός μου
  choice: kapwa ko bilanggo
  alternative: kapwa ko bihag sa Panginoon; kasama ko sa paghihirap
  rationale: Pinananatili ang leksikal na kahulugan at hindi idinaragdag ang 'sa Panginoon' o ipinapasiya kung literal o matalinghaga ang pagkakabilanggo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang nakasanayang anyong Tagalog ng mga pangalang Aristarco at Bernabe. Iningatan ang panaklong ng pinagmulang teksto at ang tuwirang pahayag na 'kapwa ko bilanggo.'
