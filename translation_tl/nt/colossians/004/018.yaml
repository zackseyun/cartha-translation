  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: tl
  text: Ako, si Pablo, ang sumulat ng pagbating ito sa sarili kong kamay.[a] Alalahanin ninyo ang aking mga tanikala.[b] Sumainyo ang biyaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Ang pagbati ay sa sarili kong kamay—Pablo.” Ibig sabihin, personal na isinulat ni Pablo ang pangwakas na pagbating ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang aking pagkabilanggo” o “ang aking pagkagapos.” Sa literal, “ang aking mga tanikala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀσπασμός
  choice: pagbating ito
  rationale: Tumutukoy ito sa pangwakas na pagbati ng liham. Likas sa makabagong Filipino ang “pagbati,” at nililinaw ng “ito” ang tinutukoy na pangwakas na linya.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: Akong si Pablo ang sumulat ... sa sarili kong kamay
  rationale: Elliptical ang Griyego at binibigyang-diin na personal itong isinulat ni Pablo. Ginawang ganap na pangungusap upang maging malinaw at natural sa Filipino nang hindi dinaragdagan ang diwa.
- source_word: μνημονεύετέ
  choice: Alalahanin ninyo
  rationale: Ang kasalukuyang pautos ay maaaring magpahiwatig ng patuloy na pag-alala, ngunit sapat at likas ang payak na pautos sa Filipino.
- source_word: μου τῶν δεσμῶν
  choice: ang aking mga tanikala
  rationale: Pinananatili ang kongkretong larawan ng δεσμοί bilang mga tanikala, na metonimiya rin ng pagkabilanggo ni Pablo.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang likas at kinikilalang katumbas ng χάρις sa pangwakas na pagpapala; hindi idinagdag kung kaninong biyaya sapagkat hindi iyon tahasang sinabi sa Griyego.
- source_word: μεθ’ ὑμῶν
  choice: Sumainyo
  rationale: Isang maikli, natural, at marangal na pormula ng pagpapala sa Filipino na nagpapahayag ng ‘maging kasama ninyo’.
theological_decisions:
- issue: Pangwakas na pagpapalang walang tahasang pandiwa
  choice: Sumainyo ang biyaya
  alternative: Ang biyaya ay makasama ninyo
  rationale: Walang pandiwa ang Griyego, ngunit kailangan ng likas na anyo sa Filipino. Ang “Sumainyo” ay naghahatid ng diwa ng pagpapala nang hindi nagdaragdag ng teolohikal na nilalaman.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ninyo” para sa maramihang ὑμῶν at pautos; pinanatili ang konkretong larawan ng mga tanikala at ang maikli at liturhikal na himig ng pangwakas na pagpapala.
