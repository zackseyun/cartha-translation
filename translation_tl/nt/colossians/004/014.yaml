  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: tl
  text: Binabati kayo ni Lucas, ang minamahal na manggagamot, at ni Demas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: Binabati
  rationale: Likas na salin ng pormulang pambati sa liham. Bagaman isahan ang anyo ng pandiwa sa Griyego bago ang tambalang simuno, ang pandiwang Filipino ay hindi minamarkahan ayon sa bilang at angkop sa kapuwa Lucas at Demas.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Ipinahahayag ang ikalawang panauhang maramihan at magalang ding natural sa modernong Filipino.
- source_word: Λουκᾶς
  choice: Lucas
  rationale: Karaniwang anyo ng pangalang biblikal sa Tagalog/Filipino.
- source_word: ἰατρὸς
  choice: manggagamot
  rationale: Tumpak at dignified na katumbas ng taong nagsasagawa ng panggagamot; mas angkop sa kontekstong unang siglo kaysa sa modernong titulong 'doktor'.
- source_word: ἀγαπητὸς
  choice: minamahal
  rationale: Pinananatili ang init ng pagmamahal at pagpapahalagang taglay ng salita nang natural sa Filipino.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay kina Lucas at Demas bilang kapuwa nagpapahatid ng pagbati.
- source_word: Δημᾶς
  choice: Demas
  rationale: Karaniwang transliterasyon ng pangalan sa Filipino.
theological_decisions:
- issue: Saklaw ng pariralang ὁ ἰατρὸς ὁ ἀγαπητός
  choice: Ang “minamahal na manggagamot” ay kapuwa paglalarawan kay Lucas lamang.
  alternative: Maaaring magmukhang nauugnay kay Demas ang “minamahal” kung malabo ang ayos o bantas.
  rationale: Sa Griyego, ang dalawang pariralang may pantukoy ay nasa aposisyon kay Λουκᾶς. Nililinaw ng mga kuwit at ng pag-uulit ng “ni” bago kay Demas na kay Lucas lamang tumutukoy ang paglalarawan.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “manggagamot” sa halip na “doktor” upang maipahayag ang gawain ni Lucas nang hindi nag-aangkat ng mas makabagong propesyonal na titulo.
