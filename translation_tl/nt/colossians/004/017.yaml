  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: tl
  text: At sabihin ninyo kay Arquipo, “Pagtuunan mong mabuti ng pansin ang paglilingkod na tinanggap mo sa Panginoon, upang magampanan mo ito nang lubos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “ang paglilingkod na tinanggap mo mula sa Panginoon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπατε
  choice: sabihin ninyo
  rationale: Ang pangmaramihang pautos ay nakatuon sa kongregasyon; likas at malinaw sa modernong Filipino ang “sabihin ninyo.”
- source_word: Ἀρχίππῳ
  choice: Arquipo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Archippus.
- source_word: Βλέπε
  choice: tiyakin mong
  rationale: Ang pangkasalukuyang pautos ay humihiling ng maingat at patuloy na pagtuon; sa kontekstong ito, natural na ipinahahayag iyon ng “tiyakin mong.”
- source_word: διακονίαν
  choice: paglilingkod
  rationale: Sinasaklaw nito ang ipinagkatiwalang paglilingkod nang hindi nagtatakda ng isang tiyak na katungkulan sa iglesya.
- source_word: παρέλαβες
  choice: tinanggap mo
  rationale: Pinananatili nito ang diwang ang pananagutan ay tinanggap o ipinagkatiwala, hindi basta sariling pinili.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang malawak na ugnayang ipinahihiwatig ng ἐν—maaaring saklaw o kaugnayan—nang hindi tahasang ginagawang “mula sa Panginoon.”
- source_word: ἵνα ... πληροῖς
  choice: lubos mong magampanan
  rationale: Sa Filipino, malinaw na naipapahayag ng pariralang ito ang layuning isakatuparan nang buo ang tinanggap na paglilingkod.
theological_decisions:
- issue: Diwa ng ἐν κυρίῳ
  choice: “sa Panginoon” sa pangunahing teksto
  alternative: “mula sa Panginoon”
  rationale: Ang ἐν ay hindi tahasang panandang pinagmulan. Pinananatili ng pangunahing salin ang ugnayan o saklaw na nasa Griyego, habang inilalagay sa talababa ang posibleng pagkaunawa na ang Panginoon ang pinagmulan ng paglilingkod.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinagsama ang layuning ἵνα at ang diwa ng πληροῖς sa natural na pariralang “tiyakin mong lubos mong magampanan,” habang pinananatili ang alternatibong pagbasa ng ἐν κυρίῳ sa talababa.
