revisions:
- from: Kasabay nito, ipanalangin din ninyo kami, upang buksan ng Diyos para sa amin ang isang pinto para sa salita[a], nang maipahayag namin ang hiwaga ng Mesiyas. Dahil dito, nakagapos din ako.[b]
  to: Kasabay nito, ipanalangin din ninyo kami, upang buksan ng Diyos para sa amin ang isang pinto para sa mensahe[a], nang maipahayag namin ang hiwaga ng Mesiyas. Dahil dito, nakagapos din ako.[b]
  rationale: Pinalitan lamang ang “salita” ng “mensahe” sa pariralang may metapora ng pinto upang maging idiomatiko at malinaw sa modernong Filipino, nang hindi nilulutas ang metapora bilang “pagkakataon.” Idinagdag sa talababa ang literal na anyo upang mapanatili ang audit trail ng λόγος.
