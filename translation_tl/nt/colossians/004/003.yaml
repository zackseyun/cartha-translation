base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: tl
  text: Kasabay nito, ipanalangin din ninyo kami, upang buksan ng Diyos para sa amin ang isang pinto para sa mensahe[a], nang maipahayag namin ang hiwaga ng Mesiyas. Dahil dito, nakagapos din ako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “isang pinto para sa salita.” Maaari ring “isang pagkakataon upang maipahayag ang mensahe.”
    reason: Pinananatili ng pangunahing teksto ang metapora ng pinto sa likas na Filipino; itinatala ng talababa ang mas malapit na anyo ng Griyego at ang pagpapaliwanag sa metapora.
  - marker: b
    text: Maaari ring “nakabilanggo rin ako” o “nasa mga tanikala rin ako.”
    reason: Ang “nakagapos” ay malapit sa anyo ng Griyego; ipinahihiwatig ng konteksto ang pagkabilanggo.
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: Kasabay nito, ipanalangin din ninyo kami
  rationale: Ipinagpapatuloy ng participle ang tagubilin sa naunang talata. Likas sa Tagalog ang tahasang pakiusap na “ipanalangin,” habang naipapahayag ng “kasabay nito” at “din” ang ἅμα καὶ.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: upang buksan ng Diyos para sa amin ang isang pinto para sa salita
  rationale: Pinananatili ang larawan ng pintong binubuksan at ang petitionaryong layon ng ἵνα. Ang “salita” ay maaaring tumukoy sa mensaheng ipinahahayag, kaya nilinaw ang posibleng diwa sa talababa nang hindi inaalis ang metapora sa teksto.
- source_word: λαλῆσαι
  choice: nang maipahayag namin
  rationale: Bagaman literal na “magsalita,” mas likas sa kontekstong misyonero ang “maipahayag.” Hindi nito ipinapasok ang mas makitid na teknikal na diwa ng pormal na pangangaral.
- source_word: τὸ μυστήριον
  choice: ang hiwaga
  rationale: Ang “hiwaga” ay nagpapanatili sa Paulinong diwa ng layunin ng Diyos na dating lingid ngunit ngayo’y inihayag; hindi ito ginagawang simpleng lihim.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulong tumutukoy sa ipinangakong Mesiyas, hindi lamang bilang pangalang pantangi.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: Dahil dito, nakagapos din ako
  rationale: Ipinahahayag ng διά na may accusative ang sanhi. Pinananatili ng “dito” ang bahagyang kaluwagan ng pagtukoy ng relative pronoun, at inilalarawan ng “nakagapos” ang kasalukuyang kalagayang bunga ng pagkakagapos na ipinahihiwatig ng perfect passive.
theological_decisions:
- issue: Kahulugan ng Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang gamit ay titular at makahulugan sa pariralang “hiwaga ng Mesiyas”; pinananatili nito ang kaugnayan sa ipinangakong pinahiran.
- issue: Metapora ng θύραν τοῦ λόγου
  choice: isang pinto para sa salita
  alternative: isang pagkakataon upang maipahayag ang mensahe
  rationale: Hindi nilulutas sa pangunahing teksto ang metapora bilang simpleng “pagkakataon.” Sa halip, pinananatili ang larawan ni Pablo at inilalagay ang malinaw na kahulugan bilang alternatibo sa talababa.
- issue: Tinutukoy ng δι’ ὃ
  choice: Dahil dito
  alternative: Dahil sa hiwaga ng Mesiyas
  rationale: Malamang na tumutukoy ito sa hiwaga o mensaheng kababanggit lamang, ngunit hindi inuulit ng Griyego ang tiyak na pangngalan. Ang “dito” ay nagpapanatili ng lawak ng pagtukoy.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “ipanalangin,” “hiwaga,” at “Mesiyas” para sa malinaw ngunit hindi kolokyal na himig. Pinanatili ang metapora ng pinto at ang bahagyang kalabuan ng “dahil dito.”
