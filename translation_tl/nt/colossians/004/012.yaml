id: COL.4.12
reference: Colossians 4:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: tl
  text: Binabati kayo ni Epafras, na isa sa inyo. Siya ay alipin ng Mesiyas[a] at laging nagpupunyagi para sa inyo sa kanyang mga panalangin, upang makatayo kayong may-gulang at lubos na nakatitiyak[b] sa buong kalooban ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “Cristo.” Ang titulong Griyego na Χριστός ay nangangahulugang “Mesiyas” o “ang Pinahiran.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lubos na kumbinsido” o “lubos na matatag.” Maaaring tumukoy ang salitang Griyego sa ganap na katiyakan o sa isang lubos na matatag na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: binabati
  rationale: Ito ang karaniwang gamit sa pangwakas na pagbati sa mga liham at natural sa makabagong Filipino.
- source_word: ὁ ἐξ ὑμῶν
  choice: na isa sa inyo
  rationale: Malinaw at natural nitong ipinahahayag na kabilang si Epafras sa pamayanang taga-Colosas.
- source_word: δοῦλος
  choice: alipin
  rationale: Pinananatili nito ang matibay na diwa ng pag-aari, lubos na pagpapasakop, at katapatan; higit itong tiyak kaysa sa mas malawak na “lingkod.”
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran o Mesiyas. Walang Ἰησοῦ sa talatang ito, kaya hindi idinagdag ang pangalang Jesus.
- source_word: πάντοτε ἀγωνιζόμενος
  choice: laging nagpupunyagi
  rationale: Ipinahihiwatig ng pandiwa ang masidhi at patuloy na pagsisikap nang hindi labis na nililiteral ang larawang agonistiko.
- source_word: ἐν ταῖς προσευχαῖς
  choice: sa kanyang mga panalangin
  rationale: Nililinaw ng likas na pariralang Filipino na si Epafras ang nananalangin at napapanatili ang pangmaramihang anyo.
- source_word: ἵνα σταθῆτε
  choice: upang makatayo kayo
  rationale: Pinananatili ang larawan ng pagtayo at ang layunin ng panalangin, nang hindi tahasang idinaragdag ang “matatag,” na wala sa Griyego.
- source_word: τέλειοι
  choice: may-gulang
  rationale: Sa kontekstong ito, tumutukoy ito sa espirituwal na pagkahinog o pagiging ganap, hindi kinakailangang sa kawalan ng anumang kasalanan.
- source_word: πεπληροφορημένοι
  choice: lubos na nakatitiyak
  rationale: Ipinapahayag nito ang kalagayan ng ganap na katiyakan, habang inilalagay sa talababa ang posibleng diwa ng lubos na pagkakumbinsi o pagkakatatag.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: sa buong kalooban ng Diyos
  rationale: Natural ito sa Filipino at pinananatili ang lawak ng παντί nang hindi nilulutas kung ang parirala ay tumutukoy sa saklaw, nilalaman, o pakikiayon.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pariralang δοῦλος Χριστοῦ
  choice: alipin ng Mesiyas
  alternative: alipin ni Cristo
  rationale: Isinalin ang kahulugan ng titulo sa halip na ituring lamang itong pangalan. Hindi idinagdag ang “Jesus” sapagkat Χριστοῦ lamang ang nasa tekstong Griyego.
- issue: Lakas ng kahulugan ng δοῦλος
  choice: alipin
  alternative: lingkod
  rationale: Mas tapat na naipapakita ng “alipin” ang lubos na pag-aari at pagpapasakop na ipinahihiwatig ng salita, nang hindi ipinapasok ang isang natatanging denominasyonal na pagbasa.
- issue: Diwa ng πεπληροφορημένοι
  choice: lubos na nakatitiyak
  alternative: lubos na kumbinsido o lubos na matatag
  rationale: Pinili sa pangunahing teksto ang karaniwang diwa ng ganap na katiyakan, ngunit pinanatili sa talababa ang tunay na leksikal na posibilidad ng ganap na pagkakumbinsi o matatag na pagkakatatag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo” at mga tuwirang pangungusap para sa likas na daloy. Pinanatili ang larawang “makatayo,” ang tindi ng “alipin,” at ang ambiguity ng πεπληροφορημένοι; iniwasang idagdag ang “Jesus,” sapagkat wala ito sa SBLGNT ng talatang ito.
