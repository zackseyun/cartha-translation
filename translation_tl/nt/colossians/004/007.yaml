id: COL.4.7
reference: Colossians 4:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: tl
  text: Ipaaalam sa inyo ni Tiquico ang lahat ng tungkol sa akin. Siya ang minamahal na kapatid, tapat na lingkod[a], at kapwa alipin[b] sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tapat na tagapaglingkod” o “tapat na ministro.” Ang salitang Griego na διάκονος ay maaaring mangahulugang lingkod o ministro, at sa ilang konteksto ay tumutukoy sa katungkulan ng diyakono.
    reason: lexical_alternative
  - marker: b
    text: O “kapwa lingkod” o “kapwa aliping lingkod.” Ang salitang Griego na σύνδουλος ay kaugnay ng δοῦλος, na maaaring magpahiwatig ng paglilingkod bilang isang taong nakatali sa panginoon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: ang lahat ng tungkol sa akin
  rationale: Likas sa modernong Tagalog at pinananatili ang malawak na saklaw ng idyoma—ang kalagayan, mga gawain, at iba pang bagay na may kinalaman kay Pablo—nang hindi ito nililimitahan sa 'kalagayan' lamang.
- source_word: γνωρίσει ὑμῖν
  choice: Ipaaalam sa inyo
  rationale: Malinaw na ipinapahayag ang hinaharap na kilos ng γνωρίζω at ang di-tuwirang layon na ὑμῖν; mas natural ito kaysa sa literal na 'gagawing alam sa inyo.'
- source_word: Τυχικὸς
  choice: Tiquico
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal na Tychicus.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: minamahal na kapatid
  rationale: Pinananatili ang init at dangal ng ἀγαπητός at ang panlalaking isahang pagtukoy ng ἀδελφός nang hindi na kailangang idagdag ang 'lalaki.'
- source_word: πιστὸς διάκονος
  choice: tapat na lingkod
  rationale: Sa kontekstong ito, hindi tiyak na διάκονος ay tumutukoy sa pormal na katungkulan ng diyakono. Ang 'lingkod' ay likas at sapat na malawak upang saklawin ang paglilingkod o ministeryo.
- source_word: σύνδουλος
  choice: kapwa alipin
  rationale: Ipinakikita ng tambalang σύνδουλος ang magkabahaging kalagayan ng paglilingkod at pag-aari sa ilalim ng isang panginoon. Pinananatili ng 'kapwa alipin' ang lakas ng elementong δοῦλος.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Natural na katumbas sa Tagalog ng pormulang Paulino, na maaaring magpahiwatig ng ugnayan, saklaw, o paglilingkod sa Panginoon nang hindi pinipili ang isa lamang.
theological_decisions:
- issue: Kahulugan ng διάκονος
  choice: lingkod
  alternative: ministro; diyakono
  rationale: Hindi malinaw sa talata na pormal na katungkulan sa iglesya ang tinutukoy. Iniiwasan ng 'lingkod' ang pagpasok ng isang tiyak na eklesiastikong pagbasa habang pinananatili sa talababa ang ibang posibleng kahulugan.
- issue: Paglalarawan sa σύνδουλος / δοῦλος
  choice: kapwa alipin
  alternative: kapwa lingkod; kapwa aliping lingkod
  rationale: Pinananatili nito ang larawan ng nakataling paglilingkod at magkabahaging pagpapasakop sa Panginoon. Ang talababa ay nagbababala na maaari rin itong ipahayag nang mas banayad bilang 'kapwa lingkod.'
- issue: Ugnayan ng ἐν κυρίῳ sa magkakasunod na titulo
  choice: sa Panginoon
  alternative: lingkod at kapwa alipin ng Panginoon
  rationale: Ang pagkakalagay ng parirala sa hulihan ay maaaring umugnay sa buong paglalarawan o lalo na sa paglilingkod. Pinananatili ng salin ang anyo at hindi tahasang nilulutas ang saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Hinati sa dalawang pangungusap para sa likas na daloy at madaling pag-unawa, habang pinananatili ang lahat ng titulo kay Tiquico. Ang mga marker na [a] at [b] ay inilagay kaagad pagkatapos ng mga salitang may leksikal na alternatibo.
