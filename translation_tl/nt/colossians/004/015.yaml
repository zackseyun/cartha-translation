  source_fidelity: 'Tapat ang salin sa SBLGNT: naipapahayag ang utos na bumati, ang mga kapatid sa Laodicea, si Nimfa, at ang iglesia na nagtitipon sa kanyang bahay. Ang “nagtitipon” ay isang katanggap-tanggap na natural na pagpapalinaw sa idyomang κατ’ οἶκον at hindi nagdaragdag ng doktrinal na kahulugan.'
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang “Batiin ninyo,” “mga kapatid,” at “pati si Nimfa” ay angkop sa liham na rehistro. Ang “iglesiang nagtitipon sa kanyang bahay” ay madaling unawain at maayos ang daloy.
