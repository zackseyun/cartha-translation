id: COL.4.15
reference: Colossians 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: tl
  text: Batiin ninyo ang mga kapatid sa Laodicea, pati si Nimfa at ang iglesiang nagtitipon sa kanyang bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito o pagbasa na sumusuporta sa “Nimfas” at “ang iglesiang nagtitipon sa bahay niya”; ang iba naman ay sumusuporta sa “kanilang bahay.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Tuwirang utos sa maramihan; natural sa makabagong Filipino at pinananatili ang lakas ng pautos.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: ang mga kapatid sa Laodicea
  rationale: Ang “mga kapatid” ay likas na salin sa Filipino at maaaring tumukoy sa kapwa lalaki at babae nang hindi inaalis ang pampamilyang larawan ng salitang Griyego.
- source_word: Νύμφαν
  choice: Nimfa
  rationale: Sinusunod ang pambabaeng anyo ng pangalang nasa SBLGNT at gumagamit ng baybay na madaling basahin sa Filipino.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: ang iglesiang nagtitipon sa kanyang bahay
  rationale: Ipinapahayag nang natural ang idyomang tumutukoy sa kongregasyong nagtitipon sa isang tahanan; ang “kanyang” ay tumutukoy kay Nimfa ayon sa αὐτῆς.
- source_word: ἐκκλησίαν
  choice: iglesia
  rationale: Karaniwan at kontekstuwal na angkop na katawagan sa komunidad ng mga Cristiano na nagtitipon.
theological_decisions:
- issue: Kasarian/pagkakakilanlan ni Νύμφαν at ang kaugnay na panghalip
  choice: Nimfa ... sa kanyang bahay
  alternative: Nimfas ... sa bahay niya; o sa kanilang bahay
  rationale: Ang nakalimbag na teksto ng SBLGNT ay may pambabaeng pangalang Νύμφαν at pambabaeng isahang αὐτῆς. Gayunman, may mga variant na sumusuporta sa panlalaki o maramihang pagbasa, kaya itinatala ang mga iyon sa talababa sa halip na tahimik na lutasin ang pagkakaiba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga kapatid” bilang natural na inklusibong katawagan, at pinalinaw ang idyomang κατ’ οἶκον sa pamamagitan ng “nagtitipon sa kanyang bahay.”
