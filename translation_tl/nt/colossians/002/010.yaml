    issue: Ang “ginawang ganap” para sa πεπληρωμένοι ay nagpapalabo sa metapora ng kapuspusan.
    rationale: Bagaman posible ang “complete” sa ilang salin, ang “ganap” sa Filipino ay madaling maunawaan bilang moral na perpekto o lubos na walang kapintasan. Hindi ito ang tiyak na sinasabi ng talata at hindi rin nito malinaw na inuugnay ang v. 10 sa πλήρωμα sa v. 9.
