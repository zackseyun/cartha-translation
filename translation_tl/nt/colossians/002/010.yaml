  source_fidelity: Ang “ginawang ganap” ay maaaring magpahiwatig ng moral o ganap na kasakdalan, samantalang ang πεπληρωμένοι ay nagpapanatili ng larawang “kapuspusan/pagpupuno” at ng ugnayan nito sa kapuspusan ni Cristo sa naunang talata. Ang “pinuspos” ay mas malapit sa pandiwang Griyego at sapat na naghahayag ng resultang kalagayan ng perpektong pasibo. Ang “ulo ng bawat pamunuan at kapangyarihan” ay tapat na pinananatili ang metapora ng κεφαλή at ang saklaw ng πάσης ἀρχῆς καὶ ἐξουσίας.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “At sa kanya, kayo ay pinuspos” kaysa “kayo ay ginawang ganap sa kanya.” Ang paglalagay ng “sa kanya” sa unahan ay malinaw na nag-uugnay sa pagpupuspos sa kay Cristo nang hindi nagpapalawak ng kahulugan.
  terminology: Pinalitan ang “ganap” ng “pinuspos” upang mapanatili ang mahalagang terminong kapuspusan at maiwasan ang hindi kinakailangang implikasyon ng sinless perfection. Nananatiling angkop ang “ulo,” “pamunuan,” at “kapangyarihan”; ipinaliliwanag ng talababa ang metapora nang hindi ito pinapalitan sa pangunahing teksto.
  issues:
