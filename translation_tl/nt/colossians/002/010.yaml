translation:
  language: tl
  text: At sa kanya, kayo ay pinuspos[a], na siyang ulo[b] ng bawat pamunuan at kapangyarihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawang puspos” o “dinala sa kapuspusan.”
    reason: lexical_alternative
  - marker: b
    text: Pinananatili ng “ulo” ang metapora sa Griyego; dito, ang diwa ay si Cristo ang pinakamataas sa bawat pamunuan at kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang pang-ugnay upang ipakita ang pagpapatuloy ng diwa mula sa naunang talata.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: kayo ay ginawang ganap
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng natapos na pagkilos at pinananatili ang pasibong diwa. Ang “ganap” ay natural sa Filipino at inuugnay ang pahayag sa kapuspusan ni Cristo sa talata 9, bagaman maaaring isalin ding “pinuspos.”
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Likas at maikling salin ng pormulang Paulino; sa konteksto, tumutukoy ito sa pakikiisa kay Cristo nang hindi iyon ipinapaliwanag nang labis sa pangunahing teksto.
- source_word: ὅς ἐστιν
  choice: na siyang
  rationale: Malinaw na ibinabalik ang panghalip kay Cristo at natural na nag-uugnay sa kasunod na paglalarawan.
- source_word: ἡ κεφαλή
  choice: ulo
  rationale: Pinananatili ang metapora ng Griyego sa halip na palitan agad ng interpretatibong “pinuno”; ipinapaliwanag sa talababa ang diwa ng kataas-taasang kapamahalaan.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: ng bawat pamunuan at kapangyarihan
  rationale: Ang “bawat” ay naghahayag ng pagiging saklaw ng lahat. Ang “pamunuan at kapangyarihan” ay natural na pares para sa mga kosmikong kapangyarihang tinutukoy, habang hindi nililimitahan ang mga termino sa mga taong tagapamahala lamang.
theological_decisions:
- issue: Ang kahulugan ng kapuspusan ng mga mananampalataya kay Cristo
  choice: Isinasaad na sa pakikiisa kay Cristo ay ginawa silang ganap o dinala sa kapuspusan.
  alternative: Maaari itong idiing “pinuspos” o unawaing wala silang kakulangan para sa kaligtasan.
  rationale: Hindi tinutukoy ng salin ang isang sistematikong doktrina ng kawalang-kasalanan o nililimitahan ang pahayag sa isang legal na katayuan; pinananatili nito ang malawak na ugnayan sa “kapuspusan” ng talata 9.
- issue: Diwa ng κεφαλή kaugnay ng mga kosmikong kapangyarihan
  choice: Pinananatili ang “ulo,” na sa kontekstong ito ay nagpapahayag ng pagiging kataas-taasan ni Cristo sa lahat ng pamunuan at kapangyarihan.
  alternative: Maaaring tuwirang isaling “pinuno” o unawaing “pinagmulan.”
  rationale: Mas matibay sa konteksto ang diwa ng kataas-taasang kapamahalaan, ngunit pinananatili sa pangunahing teksto ang tunay na metapora at inilalagay ang paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sa kanya” sa halip na mas teknikal na “sa pakikiisa sa kanya,” at pinanatili ang metaporang “ulo.”
