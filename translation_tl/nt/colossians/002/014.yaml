  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: tl
  text: Pinawi niya ang kasulatan ng pagkakautang na laban sa atin, na nakasaad sa mga tuntunin[a] at sumasalungat sa atin. Inalis niya ito sa daan[b] nang ipako niya ito sa krus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na binubuo ng mga tuntunin” o “kalakip ang mga tuntunin.” Mahirap tiyakin ang eksaktong kaugnayan ng pariralang Griyego sa “kasulatan ng pagkakautang.”
    reason: alternative_reading
  - marker: b
    text: Sa literal, “inalis niya ito mula sa gitna”; ang diwa ay inalis niya ito bilang bagay na nakaharang o nakapamagitan.
    reason: idiom
lexical_decisions:
- source_word: ἐξαλείψας
  choice: Pinawi
  rationale: Ipinahihiwatig ng pandiwa ang pagbura o lubusang pag-aalis ng isang nakasulat; natural at marangal sa modernong Tagalog ang “pinawi.”
- source_word: χειρόγραφον
  choice: kasulatan ng pagkakautang
  rationale: Pinananatili nito kapwa ang larawan ng isang nakasulat na dokumento at ang diwa ng pananagutang dapat bayaran, nang hindi ito nililimitahan sa isang tiyak na legal na anyo.
- source_word: καθ’ ἡμῶν
  choice: laban sa atin
  rationale: Direktang ipinapahayag ang masamang bisa o paninindigan ng kasulatan laban sa “atin.”
- source_word: τοῖς δόγμασιν
  choice: na nakasaad sa mga tuntunin
  rationale: Isinasalin ang mahirap na datibo bilang paglalarawan sa pagkakautang na nakapaloob o naipahayag sa mga tuntunin, nang hindi ipinapalagay na tumutukoy lamang ito sa Kautusan ni Moises.
- source_word: ὑπεναντίον
  choice: sumasalungat sa atin
  rationale: Pinananatili ang diwa ng pagiging kontra o salungat sa atin sa malinaw na modernong Tagalog.
- source_word: ἦρκεν
  choice: Inalis niya
  rationale: Ang perpektong anyo ay tumutukoy sa natapos na pag-aalis na may nananatiling bunga; ipinahihiwatig ng konteksto na ang Diyos ang gumagawa.
- source_word: ἐκ τοῦ μέσου
  choice: sa ating gitna
  rationale: Natural nitong inilalarawan ang pag-aalis sa bagay na nakaharang o nakapamagitan, habang malapit sa larawan ng Griyego.
- source_word: προσηλώσας
  choice: nang ipako niya
  rationale: Ipinakikita ang paraan o kasabay na kilos ng pag-aalis at malinaw ang ugnayan nito sa kasulatan.
- source_word: τῷ σταυρῷ
  choice: sa krus
  rationale: Ito ang malinaw, kinikilalang katumbas ng σταυρός sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng χειρόγραφον τοῖς δόγμασιν
  choice: isang kasulatan ng pagkakautang na nakasaad sa mga tuntunin at laban sa atin
  alternative: ang Kautusan ni Moises mismo; isang listahan ng mga kasalanan; isang legal na sakdal
  rationale: Pinananatili ng salin ang metapora ng dokumento at pagkakautang at ang sintaktikong kaugnayan nito sa mga tuntunin, ngunit hindi ito ipinapasok sa iisang sistemang teolohikal.
- issue: Paksa ng ἦρκεν
  choice: “niya,” na tumutukoy sa Diyos ayon sa mas malawak na konteksto
  alternative: panatilihing hindi tahasang binanggit ang gumagawa
  rationale: Kailangan ng natural na pangungusap sa Tagalog ang malinaw na tagaganap, at itinuturo ng konteksto sa Diyos bilang gumagawa; hindi ito pagdaragdag ng hiwalay na doktrina.
- issue: Ugnayan ng προσηλώσας sa pangunahing kilos
  choice: 'paraan ng pag-aalis: “nang ipako niya ito sa krus”'
  alternative: 'hiwalay o sunod lamang na kilos: “at ipinako niya ito sa krus”'
  rationale: Ang participle ay maaaring magpahayag ng paraan o kasabay na pangyayari; pinananatili ng “nang” ang malapit na kaugnayan nang hindi labis na nilulutas ang eksaktong lohikal na uri nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kasulatan ng pagkakautang” upang mapanatili ang legal-dokumentaryong larawan, at “mga tuntunin” upang hindi agad tukuyin ang δόγματα bilang isang partikular na kalipunan ng kautusan. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
