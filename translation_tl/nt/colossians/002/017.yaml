  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: tl
  text: Ang mga ito ay anino ng mga bagay na darating, ngunit ang katawan ay kay Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ngunit ang realidad ay kay Mesiyas.” Maaari ring isalin ang huling parirala na “ngunit ang katawan ay pag-aari ng Mesiyas.”
    reason: Pinananatili ang lehitimong metaporikal na alternatibo para sa σῶμα at ang mas pinalawak na pagpapahayag ng eliptikong genitive na τοῦ Χριστοῦ.
lexical_decisions:
- source_word: ἅ
  choice: Ang mga ito
  rationale: Tumutukoy ang panghalip na neuter plural sa mga usapin tungkol sa pagkain, kapistahan, bagong buwan, at Sabbath sa naunang talata. Likas sa Tagalog ang “ang mga ito” at malinaw ang pabalik na pagtukoy.
- source_word: σκιὰ
  choice: anino
  rationale: Pinananatili ang tuwirang larawang ginagamit ni Pablo at ang paghahambing nito sa σῶμα.
- source_word: τῶν μελλόντων
  choice: ng mga bagay na darating
  rationale: Ipinapahayag nito ang substantival at nakatuon-sa-hinaharap na diwa ng μελλόντων nang hindi tinutukoy nang labis kung eskatolohikal na mga bagay, katuparan sa Mesiyas, o kapuwa ang tinutukoy.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw nitong ipinahihiwatig ang pagsalungat sa pagitan ng anino at katawan.
- source_word: σῶμα
  choice: ang katawan
  rationale: Ito ang pinakapormal at pangunahing kahulugan ng σῶμα. Pinananatili nito ang matapang at bahagyang di-tiyak na metapora sa halip na agad itong ipaliwanag bilang “realidad” o “diwa.”
- source_word: τοῦ Χριστοῦ
  choice: ay sa Mesiyas
  rationale: Inilalarawan ng parirala ang genitive bilang pag-aari o kaugnayan habang pinananatili ang eliptikong copular na ayos ng Griyego. Ginamit ang “Mesiyas” sapagkat titulo ang Χριστός dito.
theological_decisions:
- issue: Kahulugan ng σῶμα bilang katapat ng σκιὰ
  choice: Pinanatili bilang “katawan,” na iniiwan sa mambabasa ang metaporikal na ugnayan nito sa “anino.”
  alternative: “realidad” o “tunay na diwa,” na tahasang nagpapaliwanag sa σῶμα bilang ganap na realidad
  rationale: Ang literal na “katawan” ay may malinaw na batayan sa Griyego at pinananatili ang tunay na ambiguwidad at lakas ng larawan. Ang paliwanag na “realidad” ay ibinigay lamang bilang alternatibo sa talababa.
- issue: Pagpapakahulugan sa genitive τοῦ Χριστοῦ
  choice: “ay sa Mesiyas,” na nagpapahiwatig na ang katawan ay sa kaniya o nauukol sa kaniya
  alternative: “ay ang Mesiyas,” na itinuturing ang Mesiyas mismo bilang realidad na katapat ng anino
  rationale: Pinakamalapit sa anyong genitive ng tekstong Griyego ang pagpapahayag ng pag-aari o kaugnayan. Hindi tahasang ginagawang nominative na panaguri ang “Mesiyas,” ngunit hindi rin nilulutas nang higit sa kailangan ang maikling parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang “katawan” at ang maikling “ay sa Mesiyas” upang hindi alisin ang metaporikal at sintaktikong tensiyon ng Griyego; nilinaw sa talababa ang mas interpretatibong mga salin.
