  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: tl
  text: Sinasabi ko ito upang walang sinumang makapanlinlang sa inyo sa pamamagitan ng mapanghikayat na pangangatwiran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapani-paniwalang pangangatwiran” o “mapanghikayat na pananalita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ito
  rationale: Ang isahang panghalip na pamatlig ay tumutukoy sa naunang sinabi o daloy ng pangangatwiran ni Pablo nang hindi nililimitahan nang higit sa ipinahihiwatig ng Griyego.
- source_word: λέγω
  choice: Sinasabi ko
  rationale: Likas na ipinahahayag sa Filipino ng aspektong imperpektibo ang kasalukuyang kilos ng pagsasalita at pinananatili nito ang tuwirang tono.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na naghahayag ng layunin at angkop sa marangal ngunit makabagong register.
- source_word: μηδεὶς
  choice: walang sinuman
  rationale: Tumpak at likas na katumbas ng negatibong di-tiyak na simuno.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Ipinahihiwatig ng “inyo” ang maramihang kausap, gaya ng Griyegong panghalip.
- source_word: παραλογίζηται
  choice: makapanlinlang
  rationale: Ipinapahayag ang panlilinlang o paglilihis sa pamamagitan ng maling pangangatwiran; natural ito sa Filipino at hindi labis na tinutukoy ang uri ng maling aral.
- source_word: ἐν πιθανολογίᾳ
  choice: sa pamamagitan ng mapanghikayat na pangangatwiran
  rationale: Ang ἐν ay nagsasaad dito ng paraan o kasangkapan. Saklaw ng πιθανολογία ang pananalita o argumentong mapanghikayat o mukhang kapani-paniwala, kaya inilalahad sa talababa ang leksikal na lawak nito.
theological_decisions:
- issue: Saklaw ng babala sa παραλογίζηται ἐν πιθανολογίᾳ
  choice: Pangkalahatang babala laban sa panlilinlang sa pamamagitan ng mapanghikayat na pangangatwiran.
  alternative: Tiyak na babala laban sa huwad na pilosopiya o laban lamang sa mahusay na retorika.
  rationale: Hindi pinapangalanan ng talata mismo ang isang partikular na sistemang doktrinal. Pinananatili ng salin ang pangkalahatang babala at ang tensiyon sa pagitan ng pagiging mapanghikayat at pagiging kapani-paniwala ng pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pangangatwiran” upang ipakita ang aspektong argumentatibo ng πιθανολογία, habang pinananatili sa talababa ang posibilidad na tumukoy ito nang mas malawak sa pananalita.
