  naturalness: Likas at malinaw sa modernong Filipino Tagalog ang “Doon din kayo ibinangon kasama niya” bilang pagtukoy sa bautismo. Ang “mabisang pagkilos ng Diyos” ay marangal ngunit madaling unawain at mas malapit sa saklaw ng ἐνέργεια kaysa “makapangyarihang pagkilos.”
