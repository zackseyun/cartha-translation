  to: Inilibing kayong kasama niya sa bautismo[a]. Doon din kayo ibinangon kasama niya sa pamamagitan ng pananampalataya[b] sa mabisang pagkilos ng Diyos, na siyang bumuhay sa kanya mula sa mga patay.
