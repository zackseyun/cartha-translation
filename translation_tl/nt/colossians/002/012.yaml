  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: tl
  text: Inilibing kayong kasama niya sa bautismo[a]. Doon din kayo ibinangon kasama niya sa pamamagitan ng pananampalataya[b] sa mabisang pagkilos ng Diyos, na siyang bumuhay sa kanya mula sa mga patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, posibleng “sa kanya,” kung ang panghalip ay tumutukoy kay Cristo sa halip na sa bautismo.
    reason: alternative_reading
  - marker: b
    text: O “pagtitiwala.” Maaari ring mangahulugan ang salitang Griyego ng “katapatan” sa ilang konteksto, ngunit “pananampalataya” ang pangunahing salin sa teksto rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: Inilibing kayong kasama niya
  rationale: Pinananatili ang pasibong diwa at ang συν- na nagpapahayag ng pakikiisa sa kanya; natural sa modernong Tagalog ang sugnay na ito bilang pagpapatuloy ng naunang konteksto.
- source_word: ἐν τῷ βαπτισμῷ
  choice: sa bautismo
  rationale: Ang “sa” ay nagpapanatili sa posibleng locative/instrumental na saklaw ng ἐν nang hindi nagtatakda ng isang partikular na teoryang sakramental.
- source_word: ἐν ᾧ
  choice: at dito
  rationale: Tumutukoy sa bautismo bilang pinakamalapit na antecedent ngunit nananatiling natural sa Tagalog; nilalagyan ng talababa ang posibleng pagtukoy kay Cristo.
- source_word: συνηγέρθητε
  choice: muli rin kayong binuhay na kasama niya
  rationale: Ipinahahayag ang muling pagbuhay at ang mahalagang συν- na pakikiisa sa kanya. Ang “binuhay” ay mas angkop kaysa “ibinangon” sa konteksto ng pagkabuhay mula sa mga patay.
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ang “pananampalataya” ang karaniwang at pangunahing katumbas ng πίστις dito, habang kinikilala sa talababa ang posibleng diin sa pagtitiwala.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: sa makapangyarihang pagkilos ng Diyos
  rationale: Ang ἐνέργεια ay aktibong, mabisang pagkilos, hindi lamang abstraktong kapangyarihan. Ang parirala ay malinaw at likas sa Tagalog.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: na muling bumuhay sa kanya mula sa mga patay
  rationale: Likas na isinasalin ang articular participle bilang sugnay na naglalarawan sa Diyos at pinananatili ang karaniwang wikang tumutukoy sa pagkabuhay na muli.
theological_decisions:
- issue: Ang tinutukoy ng ἐν ᾧ
  choice: 'Bautismo: “at dito”'
  alternative: 'Cristo: “at sa kanya”'
  rationale: Ang βαπτισμῷ ang pinakamalapit na gramatikal na antecedent, ngunit maaaring unawain ng ilan ang panghalip bilang tumutukoy kay Cristo. Pinapanatili sa talababa ang tunay na kalabuan.
- issue: Diwa ng pananalitang tungkol sa bautismo
  choice: Panatilihin ang malapit na ugnayan ng paglilibing, muling pagbuhay, bautismo, at pananampalataya
  alternative: Tahasang sakramental o pawang simbolikong pagpapakahulugan
  rationale: Malakas ang pagkakaugnay ng mga ito sa Griyego, ngunit hindi nilulutas ng talata ang mga sumunod na denominasyonal na pagtatalo tungkol sa bisa ng bautismo.
- issue: Diwa ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa kayariang ito, pananampalataya o pagtitiwala ang pinakanaaangkop na paraan ng pakikibahagi sa pagkilos ng Diyos; mas mahina sa konteksto ang “katapatan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bautismo,” “pananampalataya,” at “muling binuhay” bilang pamilyar na bokabularyong biblikal. Hindi pinasidhi ang talata tungo sa alinmang denominasyonal na paliwanag.
