base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: tl
  text: Sa kanya[a], tinuli rin kayo sa pamamagitan ng isang pagtutuling hindi gawa ng mga kamay[b], sa paghuhubad ng katawan ng laman[c][d], sa pagtutuli ng Mesiyas[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung kanino.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng isang pagtutuli na hindi ginawa ng kamay ng tao.”
    reason: lexical_alternative
  - marker: c
    text: O “sa pag-aalis.”
    reason: lexical_alternative
  - marker: d
    text: Ang “laman” ay maaari ring unawain sa mas mapagpaliwanag na diwang “makasalanang kalikasan,” ngunit pinanatili rito ang mas literal na salita sa Griyego.
    reason: lexical_alternative
  - marker: e
    text: O “sa pamamagitan ng pagtutuli ng Mesiyas,” “sa pagtutuling ginawa ng Mesiyas,” o “sa sariling pagtutuli ng Mesiyas.” Maaaring tumukoy ang Griyego sa pagtutuling ginawa ng Mesiyas, nauukol sa kanya, o kaugnay niya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Sa kanya
  rationale: Tumutukoy ang panghalip kay Cristo sa naunang konteksto. Likas sa makabagong Tagalog ang “sa kanya” at pinananatili nito ang diwa ng pakikiisa sa kanya.
- source_word: περιετμήθητε
  choice: tinuli rin kayo
  rationale: Tuwirang inilalarawan ang aorist passive bilang isang natapos na kilos na ginawa sa mga mambabasa, habang pinananatili ang metapora ng pagtutuli.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: sa pamamagitan ng pagtutuling hindi ginawa ng mga kamay
  rationale: Ipinahahayag ang instrumental na gamit ng datibo at pinananatili ang biblikal na idyoma na tumutukoy sa gawaing hindi nagmula sa tao.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: sa paghuhubad
  rationale: Pinananatili ang matingkad na larawan ng ganap na pag-aalis o paghuhubad, sa halip na gawing abstraktong paraphrase.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: ng katawan ng laman
  rationale: Malapit ito sa mahirap na estruktura ng Griyego at hindi agad nagpapasya kung ang tinutukoy ay pisikal na katawan, katawang pinaghaharian ng laman, o dating pag-iral ayon sa laman.
- source_word: σαρκός
  choice: laman
  rationale: Pinananatili ang karaniwang salitang Paulino at iniiwasang ipakahulugan kaagad bilang “makasalanang kalikasan.”
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: sa pagtutuli ng Mesiyas
  rationale: Pinananatili ang paulit-ulit na ἐν bilang “sa” at ang bukas na genitibong “ng Mesiyas,” na maaaring tumukoy sa pagtutuling ginawa niya, nauukol sa kanya, o kaugnay niya.
theological_decisions:
- issue: Kahulugan ng “pagtutuli ng Mesiyas”
  choice: Pinanatili ang bukas na pariralang “sa pagtutuli ng Mesiyas.”
  alternative: “sa pagtutuling ginawa ng Mesiyas” o “sa sariling pagtutuli ng Mesiyas”
  rationale: Malabo ang tiyak na relasyon ng genitibong τοῦ Χριστοῦ. Hindi dapat pumili ang salin ng isang doktrinal na pagbasa kung hindi iyon nililinaw ng Griyego.
- issue: Kahulugan ng “katawan ng laman”
  choice: Pinanatili ang literal at siksik na pariralang “katawan ng laman.”
  alternative: “katawang makalaman,” “makasalanang kalikasan,” o “katawan ng kasalanan”
  rationale: Mahirap at bukas sa pagpapakahulugan ang parirala. Ang mas malayang mga alternatibo ay maaaring magpasok ng antropolohikal o doktrinal na paliwanag na wala nang tahasan sa SBLGNT.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakaugnay na metapora ng pagtutuli at paghuhubad, pati ang sadyang siksik at hindi lubusang tiyak na mga pariralang teolohikal.
