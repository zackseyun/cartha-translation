revisions:
- from: Na sa kanya nakatago ang lahat ng kayamanan ng karunungan at kaalaman.[a][b]
  to: Nakatago sa kanya ang lahat ng kayamanan ng karunungan at kaalaman.[a][b]
  rationale: Inalis ang walang tungkuling “Na” at inayos ang ayos ng salita upang maging ganap at natural na pangungusap sa modernong Tagalog. Nilinaw ang alternatibong antecedent sa talababa nang hindi binabago ang pangunahing pagbasa na si Cristo ang tinutukoy. Pinanatili ang “nakatago,” “karunungan,” at “kaalaman” dahil tapat ang mga ito sa Griyego at hindi nilulutas ang sinasadyang ambigwidad ng ἀπόκρυφοι.
