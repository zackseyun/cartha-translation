    issue: Sobrang pambungad na “Na” sa pangunahing teksto
    rationale: Ang Griyego ay isang malayang relatibong sugnay na natural na maisasalin bilang buong pangungusap sa Tagalog. Sa anyong “Na sa kanya ...,” ang “na” ay nagiging pangatnig na walang pinaghuhugutang pangunahing sugnay.
  - severity: medium
    issue: Hindi malinaw ang “dito” sa talababa a
    rationale: Ang alternatibong pagbasa ay hindi simpleng lokasyong “dito,” kundi pagtukoy sa hiwaga ng Diyos bilang antecedent ng “sa/na kung saan.” Ang “sa hiwagang ito” ang mas malinaw at tapat na Tagalog na alternatibo.
