translation:
  language: tl
  text: Nakatago sa kanya ang lahat ng kayamanan ng karunungan at kaalaman.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa hiwagang ito,” kung ang tinutukoy ay inuunawa nang mas malawak bilang hiwaga ng Diyos sa halip na si Cristo mismo.
    reason: alternative_reading
  - marker: b
    text: O “nakaimbak”; ang salitang Griyego ay maaaring mangahulugang nakatago o nakalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: sa kanya
  rationale: Ang panghalip na panaguri ay datibong isahan at pinakamalikas na tumutukoy sa pinakamalapit na personal na tinutukoy, si Cristo sa 2:2. Pinananatili ng “sa kanya” ang lokatibong diwa ng ἐν nang hindi isinasara ang mas malawak na posibleng pagtukoy.
- source_word: πάντες οἱ θησαυροὶ
  choice: ang lahat ng kayamanan
  rationale: 'Ipinahahayag ng may-artikulong pangmaramihang parirala ang tiyak at kabuuang diwa: ang lahat ng kayamanan, hindi lamang ilang bahagi nito.'
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: ng karunungan at kaalaman
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na konsepto ng σοφία at γνῶσις sa tuwiran at natural na Tagalog.
- source_word: ἀπόκρυφοι
  choice: nakatago
  rationale: Ang “nakatago” ang pinakatuwirang modernong salin at hindi nagpapasya kung ang diin ay lihim na pagkakubli o ligtas na pag-iingat.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: nakatago
  rationale: Likas sa Tagalog na ipahayag ang pandiwang kopula at panaguring pang-uri sa anyong “nakatago,” habang pinananatili ang pahayag ng Griyego.
theological_decisions:
- issue: Kung ang ἀπόκρυφοι ay tumutukoy sa esoterikong paglilihim o sa ligtas na pagkakalagak kay Cristo
  choice: Isinalin nang neutral bilang “nakatago.”
  alternative: “nakaimbak” upang idiin ang pagkakalagak o “inilihim” upang idiin ang pagkakubli
  rationale: Hindi nilulutas ng mismong pang-uri kung ang karunungan ay hindi maaabot o ligtas lamang na nakalaan. Pinananatili ng salin ang tensiyong ito.
- issue: Kung ang ἐν ᾧ ay tumutukoy kay Cristo mismo o nang mas malawak sa hiwaga ng Diyos
  choice: “sa kanya,” na pangunahing tumutukoy kay Cristo
  alternative: “dito” o “sa hiwagang ito,” kung mas malawak ang antecedent
  rationale: Ang pinakamalapit na personal na tinutukoy sa naunang talata ay si Cristo, kaya ito ang pinakamalamang na pagbasa, ngunit itinatala sa talababa ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sa kanya” sa halip na mas pormal na “na kung kanino,” at “nakatago” upang maging malinaw sa karaniwang mambabasa habang nananatiling malapit sa Griyego.
