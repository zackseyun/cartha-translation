base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: tl
  text: Ang lahat ng ito ay nauubos sa paggamit[a]—ayon sa mga utos at turo ng tao[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na nakatakdang masira kapag ginamit.” Binibigyang-diin ng Griyego na pansamantala at nauubos ang mga bagay na saklaw ng mga pagbabawal.'
    reason: lexical_alternative
  - marker: b
    text: Malamang na umaalingawngaw ito sa Isaias 29:13 at idiniriin na ang mga regulasyong ito ay mula sa tao.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Ang lahat ng ito
  rationale: Tumutukoy ang panghalip na ουδέτερο plural sa mga bagay na ipinagbabawal sa naunang talata. Likas sa Tagalog ang “lahat ng ito” at napapanatili nito ang pagtukoy pabalik.
- source_word: εἰς φθορὰν τῇ ἀποχρήσει
  choice: nauubos sa paggamit
  rationale: Ipinahihiwatig ng φθορά at ἀπόχρησις na ang mga bagay ay nasisira o nauubos sa mismong paggamit. Maikli at natural ang parirala nang hindi nililimitahan ang kahulugan sa pagkabulok lamang.
- source_word: κατὰ
  choice: ayon sa
  rationale: Ipinakikilala nito ang pamantayan o pinagmulan ng mga tuntuning tinutukoy sa mas malawak na pangungusap.
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: mga utos at turo
  rationale: Pinananatili ng “utos” ang diwang mapagpanuntunan ng ἐντάλματα, samantalang malinaw at hindi teknikal ang “turo” para sa διδασκαλίας.
- source_word: τῶν ἀνθρώπων
  choice: ng tao
  rationale: Sa Tagalog, ang “tao” ay likas na panlahatan at malinaw na nagpapakitang tao, hindi Diyos, ang pinagmulan ng mga utos at turo.
theological_decisions:
- issue: Ugnayan ng parirala tungkol sa pagkaubos at ng mga tuntuning asetiko
  choice: Inilalarawan ang mga bagay bilang nauubos sa paggamit, habang ang kasunod na parirala ay inuugnay ang mga regulasyon sa mga utos at turo ng tao.
  alternative: Maaaring unawain ang buong talata bilang mas tuwirang pagwawalang-bahala sa mga regulasyong nakatuon sa mga bagay na nauubos.
  rationale: Pinananatili ng maikling ayos at gitling ang pagkaelliptical ng Griyego at ang tensiyon kung ang pangunahing diin ay nasa pansamantalang katangian ng mga bagay o sa makataong pinagmulan ng mga regulasyon.
- issue: Bantas bilang pagpapatuloy ng tanong mula sa Colosas 2:20
  choice: Tandang pananong
  alternative: Tuldok kung ilalathala ang talata bilang hiwalay na pahayag
  rationale: Ang tandang pananong na Griyego sa dulo ay nagsasara sa retorikal na tanong na nagsimula sa talata 20; kaya pinananatili ito kahit nakasalalay ang sintaks sa naunang konteksto.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang pangkaraniwang “utos at turo” sa halip na mas teknikal na mga salita. Pinanatili ang maikli at bahagyang elliptical na anyo dahil pagpapatuloy ito ng pangungusap mula sa mga naunang talata.
