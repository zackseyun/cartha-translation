  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: tl
  text: na kayo’y nakaugat na at patuloy na itinatayo sa kanya, pinatatatag sa pananampalataya[a] ayon sa itinuro sa inyo, at umaapaw sa pasasalamat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagtitiwala”; o “sa katapatan.” Ang salitang Griyego na pistis ay maaaring mangahulugang pananampalataya, pagtitiwala, o katapatan, ngunit dito ay malamang na tumutukoy ito sa pananampalatayang itinuro sa kanila.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: nakaugat na
  rationale: Pinananatili ang larawang agrikultural at ipinahihiwatig ng “na” ang naganap nang pag-uugat na may nagpapatuloy na bunga.
- source_word: ἐποικοδομούμενοι
  choice: patuloy na itinatayo
  rationale: Ipinakikita ng kasalukuyang partisiple ang nagpapatuloy na pagkilos, habang pinananatili ang larawang pangkonstruksiyon.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Cristo sa naunang konteksto; pinananatili rito ang panghalip ng Griyego sa halip na tahasang ulitin ang pangalan o titulo.
- source_word: βεβαιούμενοι
  choice: pinatatatag
  rationale: Natural na Filipino para sa ginagawang matibay o matatag, at ang anyong patuloy ay kaayon ng partisiple.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang karaniwang salin ng πίστις. Ang kasunod na pagtukoy sa itinuro sa kanila ay malamang na tumuturo sa pananampalatayang tinanggap bilang aral, ngunit hindi ito labis na tinutukoy sa pangunahing teksto.
- source_word: καθὼς ἐδιδάχθητε
  choice: ayon sa itinuro sa inyo
  rationale: Natural at malinaw na ipinahahayag ang pagkakaayon ng kanilang pagpapatatag sa naunang pagtuturo.
- source_word: περισσεύοντες
  choice: nag-uumapaw
  rationale: Pinananatili ang masiglang larawan ng kasaganaan at ang nagpapatuloy na diwa ng partisiple.
- source_word: ἐν εὐχαριστίᾳ
  choice: sa pasasalamat
  rationale: Ang “pasasalamat” ay natural, dignidad, at tuwirang katumbas ng εὐχαριστία sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng τῇ πίστει
  choice: pananampalataya, malamang bilang pananampalatayang itinuro at pinanghahawakan
  alternative: personal na pagtitiwala; katapatan
  rationale: Ang artikulo at ang pariralang “ayon sa itinuro sa inyo” ay pumapabor sa pananampalataya bilang nilalaman o larangan ng itinurong mensahe. Gayunman, hindi lubos na inaalis ng Griyego ang diwa ng personal na pagtitiwala, at maaari ring mangahulugan ang πίστις ng katapatan sa ibang konteksto.
translation_notes:
  register: Makabagong Filipino na may marangal at madaling maunawaang himig. Pinananatili ang magkasunod na larawang pag-uugat at pagtatayo, pati ang aspektong naganap na pag-uugat at nagpapatuloy na pagtatayo, pagpapatatag, at pag-uumapaw.
