id: COL.2.8
reference: Colossians 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: tl
  text: Mag-ingat kayo, baka may bumihag sa inyo sa pamamagitan ng pilosopiya at hungkag na panlilinlang, ayon sa tradisyon ng mga tao, ayon sa mga pangunahing simulain ng sanlibutan[a], at hindi ayon sa Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga espiritung elemental ng sanlibutan.” Ang pariralang Griyego ay maaaring tumukoy sa mga pangunahing simulain o sa mga kosmikong kapangyarihang espirituwal.
    reason: alternative_reading
  - marker: b
    text: Griyego, “Cristo”; isinaling “Mesiyas” dito sapagkat litaw ang gamit nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Mag-ingat kayo upang walang
  rationale: Ang pangkasalukuyang pautos na Βλέπετε ay isang mariing babala, at likas sa modernong Tagalog ang “Mag-ingat kayo.” Ipinahahayag ng “upang walang” ang banta na ipinapasok ng μή τις.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: bumihag sa inyo
  rationale: Ang συλαγωγέω ay tumutukoy sa pagdala sa isang tao bilang bihag o samsam. Malinaw na pinananatili ng “bumihag” ang metapora nang hindi labis na nagpapaliwanag.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: sa pamamagitan ng pilosopiya at hungkag na panlilinlang
  rationale: Ang διά na may genitive ay nagsasaad ng kasangkapan o paraan. Pinananatiling magkaugnay ngunit magkahiwalay ang “pilosopiya” at “hungkag na panlilinlang,” gaya ng maaaring pagbasa sa Griyego.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: ayon sa tradisyon ng tao
  rationale: Ang κατά ay nagpapahayag ng pamantayan. Ang “ng tao” ay pangkalahatan at hindi tumutukoy lamang sa mga lalaki.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: ayon sa mga saligang prinsipyo ng sanlibutan
  rationale: 'May malawak at pinagtatalunang saklaw ang στοιχεῖα: maaaring mga pangunahing prinsipyo, sangkap, o mga kapangyarihang espirituwal. Ang pangunahing salin ay madaling maunawaan at hindi ipinipilit ang personal na espirituwal na kahulugan; inilalagay sa talababa ang mahalagang alternatibo.'
- source_word: οὐ κατὰ Χριστόν
  choice: at hindi ayon sa Mesiyas
  rationale: Ang Χριστός ay titulong nangangahulugang “Pinahiran” o “Mesiyas.” Dito, siya ang pamantayang tahasang itinatapat sa tradisyon ng tao at sa στοιχεῖα ng sanlibutan.
theological_decisions:
- issue: Kahulugan ng στοιχεῖα τοῦ κόσμου
  choice: mga saligang prinsipyo ng sanlibutan
  alternative: mga espiritung saligan ng sanlibutan
  rationale: Pinagtatalunan kung ang parirala ay tumutukoy sa mga panimulang prinsipyo o sa mga kosmikong kapangyarihang espirituwal. Pinananatili ng pangunahing teksto ang mas malawak na pagbasa, habang inilalahad sa talababa ang mahalagang alternatibo.
- issue: Pagpapahayag sa Χριστόν bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Litaw rito ang tungkulin ng Χριστός bilang titulo at pamantayan ng turo, kaya “Mesiyas” ang ginamit nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mag-ingat” para sa likas na lakas ng babala, “bumihag” upang mapanatili ang metapora ng pagkabihag, at “sanlibutan” para sa κόσμος sa kontekstong tumutukoy sa kaayusan ng mundo.
