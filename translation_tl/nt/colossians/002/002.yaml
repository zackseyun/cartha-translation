  text: upang mapatibay ang kanilang mga puso,[a] habang pinagkakaisa sila sa pag-ibig,[b] at upang makamtan nila ang buong kayamanan ng lubos na katiyakang dulot ng pagkaunawa, tungo sa pagkakilala[c] sa hiwaga ng Diyos—ang Mesiyas.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapalakas ang kanilang loob” o “maaliw ang kanilang mga puso.” Saklaw ng pandiwang Griyego ang pagpapatibay, pagpapalakas ng loob, at pag-aliw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “habang pinagkakaisa sila sa pag-ibig.” Ang pandiwa ay maaaring mangahulugang tipunin o pag-ugnayin nang mahigpit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ganap na pagkakilala.” Ang salitang Griyego ay maaaring magpahiwatig ng mas buo o mas malalim na kaalaman.
    reason: lexical_alternative
  - marker: d
