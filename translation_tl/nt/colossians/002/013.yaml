  to: At kayo, na patay sa inyong mga pagsuway at sa pagiging di-tuli ng inyong laman,[a] ay binuhay ng Diyos kasama ni Cristo, matapos niyang patawarin tayo sa lahat ng ating mga pagsuway.[b]
