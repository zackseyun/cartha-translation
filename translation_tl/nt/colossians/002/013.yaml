  source_fidelity: Ang “dahil sa” ay nagpapalit sa ἐν (“sa/in”) tungo sa isang tuwirang sanhi. Mas malapit ang “patay sa inyong mga pagsuway.” Ang “binuhay niyang kasama niya” ay hindi malinaw sa Tagalog at maaaring mangahulugang binuhay niya ang isang kasama niya, sa halip na binuhay ang mga kausap kasama ni Cristo. Ang tahasang “ng Diyos ... kasama ni Cristo” ay naglilinaw sa mga referent na malinaw sa agarang konteksto (2:12) nang hindi nagdaragdag ng kahulugan.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang “na patay sa ... ay binuhay ng Diyos kasama ni Cristo.” Iniiwasan nito ang magkakasunod na “niya” na lumilikha ng kalabuan.
  terminology: Pinananatili ang “mga pagsuway” para sa παραπτώματα at “laman” para sa σάρξ. Ang “pagiging di-tuli” ay angkop para sa ἀκροβυστία at hindi ipinapakahulugang “makasalanang kalikasan.”
