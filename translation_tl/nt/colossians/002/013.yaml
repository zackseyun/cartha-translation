translation:
  language: tl
  text: At kayo, na patay sa inyong mga pagsuway at sa pagiging di-tuli ng inyong laman,[a] ay binuhay ng Diyos kasama ni Cristo, matapos niyang patawarin tayo sa lahat ng ating mga pagsuway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagiging di-tuli ng inyong laman” ay pangunahing tumutukoy sa kanilang pisikal na kalagayang di-tuli, bagaman may espirituwal din itong pahiwatig sa konteksto.
    reason: cultural_note
  - marker: b
    text: 'Nagbabago ang Griyego mula sa “kayo” tungo sa “tayo”: “matapos niyang patawarin tayo sa lahat ng ating mga pagsuway.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: na mga patay
  rationale: Likas na inilalarawan sa Tagalog ang kalagayan ng mga kausap habang pinananatili ang diwa ng participial construction.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: dahil sa inyong mga pagsuway
  rationale: Sa modernong Tagalog, malinaw nitong ipinahahayag ang kaugnayan ng kanilang kamatayan sa mga pagkakasala; ang παράπτωμα ay ang paglihis o pagsuway.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: sa pagiging di-tuli ng inyong laman
  rationale: Pinananatili ang kongkretong pagtukoy sa kalagayang di-tuli at ang salitang 'laman,' nang hindi ito agad binibigyang-kahulugang 'makasalanang kalikasan.'
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: binuhay niyang kasama niya
  rationale: Ipinapakita ang pagkilos ng Diyos na pagbibigay-buhay sa kanila kasama ng tinutukoy na 'siya'; pinananatili ang panghalip at ang pakikiugnay.
- source_word: χαρισάμενος
  choice: nang patawarin niya
  rationale: Natural na ikinakabit sa pangunahing pandiwa ang mapagpalayang pagpapatawad na ipinahihiwatig ng χαρίζομαι.
- source_word: ἡμῖν
  choice: tayo
  rationale: Pinananatili ang tahasang paglipat ng Griyego mula sa 'kayo' tungo sa inklusibong 'tayo.'
- source_word: πάντα τὰ παραπτώματα
  choice: lahat ng ating mga pagsuway
  rationale: Pinananatili ang kabuuan ng kapatawaran at ang leksikal na pagkakapareho sa naunang παράπτωμα.
theological_decisions:
- issue: Kahulugan ng σάρξ sa τῆς σαρκὸς ὑμῶν
  choice: literal na 'laman,' na maaaring may espirituwal na pahiwatig
  alternative: '''makasalanang kalikasan'''
  rationale: Sa konteksto ng pagtutuli sa Colosas 2:11, pangunahing tumutukoy ang parirala sa pisikal na kalagayang di-tuli. Ang 'laman' ay nagpapanatili ng posibleng mas malawak na pahiwatig nang hindi ito ipinipilit.
- issue: Tinutukoy ng αὐτῷ sa σὺν αὐτῷ
  choice: panatilihin bilang 'niya,' na sa konteksto ay tumutukoy kay Cristo
  alternative: tahasang isalin na 'kasama ni Cristo'
  rationale: Ang naunang talata ay tungkol sa pagkalibing at muling pagkabuhay kasama ni Cristo, ngunit pinananatili ng panghalip ang anyo at bahagyang implicit na pagtukoy ng Griyego.
- issue: Paglipat mula ὑμᾶς tungo sa ἡμῖν
  choice: panatilihin ang 'kayo' at pagkatapos ay 'tayo'
  alternative: pagtugmain bilang 'kayo' sa buong talata
  rationale: Tunay ang person shift sa Griyego at maaaring nagpapalawak sa saklaw mula sa mga taga-Colosas tungo sa lahat ng mananampalataya, kasama ang may-akda.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga pagsuway' sa halip na mas arkaikong 'mga pagsalangsang.' Ang sintaks ay inayos para maging natural sa Tagalog habang pinananatili ang theological tension, ang panghalip na 'niya,' at ang paglipat mula 'kayo' tungo sa 'tayo.'
