  source_fidelity: Tumpak sa kabuuan ang paghatid ng ἀπεκδυσάμενος bilang pag-aalis ng kakayahan o sandata, ng hayagang pagpapahiya, at ng tagumpay laban sa mga ἀρχαί at ἐξουσίαι. Gayunman, ang hulíng pagkakasunod ng mga panghalip sa draft ay maaaring magmukhang si Jesus ay nagtagumpay ‘sa kanyang sarili,’ samantalang ang ἐν αὐτῷ ay nananatiling may pinagtatalunang tinutukoy. Inilapit ang ayos ng Tagalog nang hindi nilulutas ang kalabuan.
  naturalness: Ang “Nagtagumpay siya laban sa kanila sa kanya” ay hindi likas at nagdudulot ng di-sinasadyang reflexive na pakahulugan. Mas malinaw at mas natural ang pag-uuna sa pariralang “sa kanya,” habang pinananatili ang hindi pagtukoy kung sino o ano ang tinutukoy nito.
  terminology: Pinanatili ang “mga pinuno at mga awtoridad” upang kumatawan sa dalawang katawagang Griyego nang hindi ipinagpapalagay kung makalupa o espirituwal ang mga tinutukoy. Ang “hinubaran ng kapangyarihan” ay isang maunawaing paglalapat ng karaniwang pagbasa ng ἀπεκδυσάμενος; itinatala ng talababa ang alternatibong pagbasa.
