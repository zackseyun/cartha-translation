  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: tl
  text: Hinubaran niya ng kapangyarihan ang mga pinuno at mga awtoridad[a] at hayagan silang inilantad sa kahihiyan. Sa kanya ay nagtagumpay siya laban sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hinubad niya mula sa kanyang sarili ang mga pinuno at mga awtoridad.”'
    reason: Pinananatili ang leksikal at gramatikal na posibilidad ng ἀπεκδυσάμενος.
  - marker: b
    text: O “sa krus.” Ang salitang Griyego ay maaaring tumukoy kay Cristo o sa krus na binanggit sa naunang talata.
    reason: Ipinakikita ang hindi tiyak na tinutukoy ng αὐτῷ.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: Hinubaran niya ng kapangyarihan
  rationale: Ipinahahayag nito sa natural na Tagalog ang pangunahing diwa na inalisan sila ng kapangyarihan o sandata, habang kinikilala sa talababa ang posibleng literal na pagbasa na ‘hinubad niya mula sa sarili.’
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ang mga pinuno at mga may awtoridad
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagan para sa mga kapangyarihang tinutukoy.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: hayagan silang inilantad sa kahihiyan
  rationale: Ang ἐδειγμάτισεν ay pampublikong paglalantad bilang kahiya-hiyang tanawin, at ang ἐν παρρησίᾳ ay nagsasaad ng lantad o hayagang paraan.
- source_word: θριαμβεύσας αὐτοὺς
  choice: Nagtagumpay siya laban sa kanila
  rationale: Inihahatid ang larawan ng matagumpay na pagparada na ipinahihiwatig ng pandiwa, sa malinaw at likas na Tagalog.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panlalaking panghalip ng Griyego at ang pagbasa na tumutukoy kay Cristo, nang hindi ito pinapalitan ng tahasang interpretasyon gaya ng ‘sa pamamagitan ng krus.’
theological_decisions:
- issue: Ang tinutukoy ng ἐν αὐτῷ
  choice: sa kanya
  alternative: sa krus / sa pamamagitan nito
  rationale: Maaaring tumukoy ang panlalaking αὐτῷ kay Cristo o sa ‘krus’ na panlalaki rin sa Griyego. Sinusunod ng pangunahing teksto ang pagbasa na ‘sa kanya,’ ngunit inilalahad sa talababa ang tunay na kalabuan.
- issue: Diwa ng ἀπεκδυσάμενος
  choice: inalisan ng kapangyarihan ang mga pinuno at awtoridad
  alternative: hinubad niya mula sa kanyang sarili ang mga pinuno at awtoridad
  rationale: Ang ‘disarmed’ na pagbasa ang pinakanauunawaan sa konteksto ng tagumpay, ngunit maaaring ipakahulugan ang anyong panggitna bilang paghuhubad o pag-aalis mula sa sarili; hindi ito dapat itago.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘hinubaran ng kapangyarihan’ bilang malinaw na idyoma at iniwasan ang teknikal o denominasyonal na pananalita.
