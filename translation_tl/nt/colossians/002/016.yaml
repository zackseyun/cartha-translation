  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: tl
  text: Kaya, huwag kayong hatulan ninuman tungkol sa pagkain o inumin,[a] o tungkol sa isang kapistahan, pagdiriwang ng bagong buwan, o mga Sabbath.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, tungkol sa mga tuntunin sa pagkain at inumin.
    reason: cultural_note
  - marker: b
    text: Ang pagkakasunod na “kapistahan, pagdiriwang ng bagong buwan, o mga Sabbath” ay umaalingawngaw sa taunang, buwanan, at lingguhang kalendaryong panrelihiyon ng mga Judio.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: Kaya huwag kayong hatulan ng sinuman
  rationale: Ang οὖν ay nagpapakita ng konklusyon mula sa naunang argumento, kaya natural ang “Kaya.” Ang μή kasama ng pangkasalukuyang pautos na κρινέτω ay pagbabawal, at ang balintiyak na anyong Filipino ay malinaw na naghahatid ng diwang “huwag hayaang hatulan kayo ng sinuman.”
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: tungkol sa pagkain o inumin
  rationale: Maaaring tumukoy ang βρῶσις at πόσις sa pagkain/pagkain bilang gawain at inumin/pag-inom. Sa talaan ng mga usaping sinusuri, natural sa Filipino ang kategoryang “pagkain o inumin,” habang nililinaw ng talababa na mga tuntuning kaugnay ng mga ito ang nasa isip.
- source_word: ἐν μέρει ἑορτῆς
  choice: tungkol sa isang kapistahan
  rationale: Ang ἐν μέρει ay idyomatikong nangangahulugang “tungkol sa” o “hinggil sa,” hindi “sa bahagi ng.” Ang ἑορτή ay isang panrelihiyong kapistahan.
- source_word: νουμηνίας
  choice: pagdiriwang ng bagong buwan
  rationale: Tumutukoy ito sa buwanang pagdiriwang kapag bagong buwan; ang tahasang “pagdiriwang” ay mas malinaw sa karaniwang mambabasang Filipino kaysa sa “bagong buwan” lamang.
- source_word: σαββάτων
  choice: mga Sabbath
  rationale: Pinananatili nito ang maramihang anyo ng Griyego at ang katawagang madaling makilala bilang mga araw ng lingguhang pamamahinga sa kalendaryong Judio.
theological_decisions:
- issue: Saklaw ng pagbabawal sa paghatol
  choice: Ipinagbabawal ng talata na hatulan ang mga mananampalataya tungkol sa mga usaping pagkain, inumin, at mga araw ng pagdiriwang.
  alternative: Ipahayag na lubusang pinawawalang-bisa ng talata ang lahat ng gayong pagtalima, o na mga gawa-gawang tuntuning asetiko lamang ang tinutukoy nito.
  rationale: Ang Griyego ay tuwirang nakatuon sa paghatol hinggil sa mga bagay na ito. Hindi nilulutas ng talatang ito lamang ang mas malawak na usapin tungkol sa pagpapatuloy o bisa ng bawat pagtalima, kaya hindi iyon idinaragdag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” para sa natural na inferensiya at “tungkol sa” upang maipahayag ang idyomatikong diwa ng mga pariralang may ἐν. Pinanatili ang “Sabbath” bilang kinikilalang terminong biblikal.
