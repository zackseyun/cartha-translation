id: COL.2.1
reference: Colossians 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: tl
  text: Sapagkat nais kong malaman ninyo kung gaano katindi ang pakikipagpunyagi ko para sa inyo, para sa mga nasa Laodicea, at para sa lahat ng hindi pa nakakita sa akin nang harapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “nang personal” o “sa katawan.” Sa literal, mababasa sa Griyego: “nakakita sa aking mukha sa laman,” na tumutukoy rito sa pisikal na presensiya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ
  choice: Sapagkat nais kong
  rationale: Ipinapakita ng “sapagkat” ang ugnayan sa naunang pahayag, at ang “nais kong” ay tuwiran, natural, at marangal na katumbas ng θέλω.
- source_word: ὑμᾶς εἰδέναι
  choice: malaman ninyo
  rationale: Likas na Filipino ang ayos na “nais kong malaman ninyo” at pinananatili nito ang tuwirang diwa ng konstruksiyong Griyego.
- source_word: ἡλίκον ἀγῶνα
  choice: kung gaano katindi ang pakikipagpunyagi
  rationale: Ipinahahayag ng ἡλίκον ang laki o tindi, samantalang ang ἀγών dito ay masidhing pagsisikap o pakikibaka, hindi literal na paligsahang pampalakasan.
- source_word: ἔχω ὑπὲρ ὑμῶν
  choice: ko para sa inyo
  rationale: Sa Filipino, naipapaloob sa “pakikipagpunyagi ko para sa inyo” ang ἔχω at ang kapakinabangang ipinahihiwatig ng ὑπέρ.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: mga nasa Laodicea
  rationale: Maikli at natural itong salin ng substantival na pariralang tumutukoy sa mga taong nasa Laodicea.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: lahat ng hindi pa nakakita
  rationale: Pinananatili ng “lahat” ang saklaw ng ὅσοι, at ang “hindi pa nakakita” ay natural na nagpapahiwatig ng kalagayang nagpapatuloy hanggang sa kasalukuyan.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: sa akin nang harapan
  rationale: Ang idyomatikong “nang harapan” ay malinaw na tumutukoy sa personal at pisikal na pagkikita. Inilalagay sa talababa ang literal na anyo upang hindi mawala ang larawan ng orihinal.
theological_decisions:
- issue: Kahulugan ng σάρξ sa ἐν σαρκί
  choice: nang harapan
  alternative: sa laman
  rationale: Dito, ang σάρξ ay tumutukoy sa pisikal at personal na presensiya, hindi sa makasalanang pagkatao. Ang “nang harapan” ang likas na salin sa modernong Filipino, habang pinananatili sa talababa ang literal na pananalita at posibleng alternatibo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang diin ng talata sa tindi ng pakikipagpunyagi ni Pablo at ang malawak na saklaw ng “lahat,” habang ginawang malinaw sa pangunahing teksto ang idyomang tumutukoy sa personal na pagkikita.
