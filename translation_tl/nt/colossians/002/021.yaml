  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: tl
  text: “Huwag hawakan[a], ni tikman, ni salingin,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Huwag salingin, ni tikman, ni hipuin.” Ang unang pandiwa (ἅψῃ) ay maaari ring mangahulugang “salingin” o “humawak,” ngunit “hawakan” ang ginamit dito upang maiba sa huling pandiwa na θίγῃς (“salingin” o “hipuin”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Huwag
  rationale: Kasama ng mga aorist subjunctive, naghahayag ito ng pagbabawal; likas at tuwiran sa Filipino ang “Huwag.”
- source_word: ἅψῃ
  choice: hawakan
  rationale: Ang gitnang anyo ng ἅπτω ay maaaring mangahulugang “humawak,” “hawakan,” o “salingin.” Ginamit ang “hawakan” upang maiba sa θίγῃς sa hulihan nang hindi nawawala ang pangunahing diwa.
- source_word: μηδὲ
  choice: ni
  rationale: Ang inuulit na negatibong pang-ugnay ay nagdurugtong sa magkakasunod na pagbabawal; maikli at natural dito ang “ni.”
- source_word: γεύσῃ
  choice: tikman
  rationale: Tuwirang ipinahihiwatig ng γεύομαι ang pagtikim, at ang “tikman” ay angkop sa anyong pautos ng sipi.
- source_word: θίγῃς
  choice: salingin
  rationale: Karaniwang nangangahulugan ang θιγγάνω na “humipo” o “sumaling.” Pinili ang “salingin” upang mapanatili ang pagkakaiba nito sa naunang ἅψῃ, na isinaling “hawakan.”
theological_decisions:
- issue: Kalikasan ng mga pagbabawal ayon sa konteksto
  choice: Panatilihin bilang maikli at tila siniping serye ng mga tuntunin, nang walang idinagdag na paliwanag.
  alternative: Palawakin bilang “Huwag hawakan ito, huwag tikman iyon,” o tahasang iugnay sa mga tuntunin ng tao.
  rationale: Pawang maiikling pagbabawal lamang ang nasa Griyego. Pinananatili ng salin ang biglang anyo at hindi ipinapasok sa talata ang paliwanag mula sa nakapaligid na konteksto.
translation_notes:
  register: Makabago, maikli, at marangal na Filipino. Pinanatili ang tatluhang ritmo at ang tila-siping anyo ng mga pagbabawal. Ginamit ang “salingin” sa hulihan bilang kasalukuyang nauunawaang salitang Filipino, bagaman bahagyang mas pormal kaysa “hipuin,” upang maipakita ang pagkakaiba ng dalawang pandiwang Griyego.
