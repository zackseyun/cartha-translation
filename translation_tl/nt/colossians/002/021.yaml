  naturalness: Natural at maikli ang daloy sa modernong Filipino, lalo na sa estilong pampanitikan/pangkasulatan. Ang “ni … ni …” ay angkop na katumbas ng paulit-ulit na μηδὲ. Ang “salingin” ay bahagyang mas pormal kaysa “hipuin,” ngunit nauunawaan at epektibong nagpapanatili ng pagkakaiba ng mga pandiwa.
  terminology: Ang “hawakan” para sa ἅψῃ, “tikman” para sa γεύσῃ, at “salingin” para sa θίγῃς ay isang maingat at katanggap-tanggap na hanay. Wala itong idinagdag na interpretasyong teolohikal o kontekstuwal na wala sa talata.
