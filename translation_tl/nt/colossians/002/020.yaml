  to: 'Kung namatay kayong kasama ng Mesiyas at nahiwalay sa mga saligang prinsipyo ng sanlibutan[a], bakit kayo nagpapasakop sa mga tuntunin[b], na para bang nabubuhay kayo sa sanlibutan:'
