  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: tl
  text: 'Kung namatay kayong kasama ng Mesiyas at nahiwalay sa mga saligang prinsipyo ng sanlibutan[a], bakit kayo nagpapasakop sa mga tuntunin[b], na para bang nabubuhay kayo sa sanlibutan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga espiritung elemental ng sanlibutan”; o “mga pangunahing sangkap ng sanlibutan.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “bakit kayo pinasasakop sa mga tuntunin?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Kung
  rationale: Pinananatili ang anyong pasubali ng Griyego, kahit ipinapalagay sa konteksto na totoo ang kundisyon para sa mga mananampalataya.
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: namatay kayong kasama ng Mesiyas
  rationale: Ang payak na nakaraang anyo ay nagpapakita ng tiyak na pangyayaring nakaugnay sa pagkamatay ng Mesiyas; isinalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: at nahiwalay sa mga saligang prinsipyo ng sanlibutan
  rationale: Ipinahahayag ng ἀπό ang paghihiwalay. Natural sa Filipino ang “nahiwalay sa,” samantalang pinananatili ng “mga saligang prinsipyo” ang sistemiko at pundamental na diwa ng στοιχεῖα nang hindi tahasang itinatangging maaari itong tumukoy sa mga espirituwal na kapangyarihan.
- source_word: τί
  choice: bakit
  rationale: Ito ang natural na Filipino para sa retorikal na tanong na ipinahahayag ng τί sa pangungusap.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: na para bang nabubuhay pa kayo sa sanlibutan
  rationale: Pinananatili ng “para bang” ang paghahambing o pagpapalagay ng ὡς; nililinaw ng “pa” ang retorikal na kaibahan sa naunang pagkamatay kasama ng Mesiyas.
- source_word: δογματίζεσθε
  choice: nagpapasakop sa mga tuntunin
  rationale: Ipinapakita ng anyong mapagnilay ang aktibong pakikibahagi ng mga mambabasa sa pagpapailalim sa mga itinakdang regulasyon, habang kinikilala sa talababa ang posibleng pasibong diwa.
theological_decisions:
- issue: Kahulugan ng στοιχεῖα sa paggamit ni Pablo
  choice: mga saligang prinsipyo ng sanlibutan
  alternative: mga elementong espiritu ng sanlibutan; mga pangunahing sangkap ng sanlibutan
  rationale: Maaaring tumukoy ang salita sa mga pundamental na prinsipyo, pangunahing sangkap, o kosmiko/espirituwal na kapangyarihan. Ang pangunahing salin ay hindi tahasang nagpapasya sa isang tiyak na kosmolohiya, at inilalahad sa talababa ang iba pang tunay na posibilidad.
- issue: Tinig ng δογματίζεσθε
  choice: nagpapasakop sa mga tuntunin
  alternative: pinasasakop sa mga tuntunin
  rationale: Maaaring maunawaan ang anyo bilang gitna o pasibo. Pinili sa teksto ang kusang pagpapasakop dahil natural ito sa konteksto, ngunit pinanatili sa talababa ang pasibong posibilidad.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang malawak na diwa ng κόσμος at ang pag-uulit nito. Ang tutuldok sa hulihan ay pinanatili sapagkat ipinakikilala ng talata ang mga tuntuning babanggitin sa kasunod na talata.
