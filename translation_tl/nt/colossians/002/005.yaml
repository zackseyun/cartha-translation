source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: tl
  text: Sapagkat kahit wala ako sa inyo sa katawan, kasama ninyo pa rin ako sa espiritu,[a] na nagagalak at nakikita ang inyong kaayusan at ang katatagan ng inyong pananampalataya sa Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama ninyo pa rin ako sa aking espiritu.” Maaaring tumukoy ang “espiritu” sa sariling espiritu ni Pablo; posible ring iugnay ito sa Banal na Espiritu, ngunit hindi ito tahasang nililinaw ng Griyego.
    reason: theological_ambiguity
  - marker: b
    text: 'Maaari ring unawain: “ang katatagan ng inyong katapatan sa Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: sa katawan
  rationale: Sa konteksto, tumutukoy ang σάρξ sa pisikal na pagliban ni Pablo, hindi sa makasalanang pagkatao. Mas natural at malinaw sa makabagong Tagalog ang “sa katawan” kaysa literal na “sa laman.”
- source_word: τῷ πνεύματι
  choice: sa espiritu
  rationale: Tuwirang pinananatili nito ang kaibahan sa pisikal na pagliban at hindi nito ipinipilit na ang tinutukoy ay ang Banal na Espiritu.
- source_word: χαίρων καὶ βλέπων
  choice: Nagagalak ako na makita
  rationale: Natural na ipinapahayag sa Tagalog ang magkasabay na ideya ng kagalakan at pagkakita, nang hindi dinaragdagan ang paraan kung paano “nakikita” ni Pablo ang kanilang kalagayan.
- source_word: τὴν τάξιν
  choice: ang inyong kaayusan
  rationale: Saklaw ng τάξις ang maayos na pagkakaayos o kaayusan ng pamayanan. Hindi idinagdag ang “mabuti” sapagkat ipinahihiwatig na ng papuring konteksto ang positibong diwa.
- source_word: τὸ στερέωμα
  choice: ang katatagan
  rationale: Ipinahahayag ng στερέωμα ang pagiging matibay, matatag, o hindi natitinag; ang “katatagan” ay natural na kaakibat ng pananampalataya sa Tagalog.
- source_word: τῆς ... πίστεως ὑμῶν
  choice: ng inyong pananampalataya
  rationale: Ang “pananampalataya” ang karaniwang at angkop na salin ng πίστις dito, habang nananatiling maaaring marinig ang kaugnay na diwa ng katapatan.
- source_word: εἰς Χριστόν
  choice: sa Mesiyas
  rationale: Ipinakikita ng εἰς ang pinatutungkulan ng pananampalataya. Ginamit ang “Mesiyas” upang panatilihin ang Χριστός bilang titulo sa kontekstong ito.
theological_decisions:
- issue: Ang tinutukoy ng “espiritu” sa kaibahang “sa katawan ... sa espiritu”
  choice: Hindi pisikal na naroroon si Pablo ngunit kasama nila sa espiritu.
  alternative: Kasama nila si Pablo sa pamamagitan ng Banal na Espiritu.
  rationale: Mas pinapaboran ng tuwirang paghahambing sa pisikal na pagliban ang sariling espiritu o di-pisikal na pakikiisa ni Pablo. Gayunman, hindi nililinaw ng salin nang higit sa Griyego ang mekanismo ng presensiyang ito.
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo ng pinananampalatayaan; ang “Mesiyas” ay malinaw na nagpapanatili sa titular na diwa.
- issue: Saklaw ng πίστις
  choice: pananampalataya sa Mesiyas
  alternative: katapatan sa Mesiyas
  rationale: Ang pinakanatural na pagbasa ng εἰς Χριστόν kasama ng πίστις ay ang pananampalatayang nakatuon sa Mesiyas, ngunit maaari ring sumaklaw ang πίστις sa katapatan; pinanatili ang posibilidad na iyon sa talababa.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging natural ang daloy, ngunit pinanatili ang lohikal na ugnayan at ang dalawang papuring larawan: kaayusan at katatagan.'
