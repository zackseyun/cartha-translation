revisions:
- from: Sapagkat kahit wala ako riyan sa katawan, kasama pa rin ninyo ako sa espiritu.[a] Nagagalak ako na makita ang inyong kaayusan at ang katatagan ng inyong pananampalataya sa Mesiyas.[b]
  to: Sapagkat kahit wala ako sa inyo sa katawan, kasama ninyo pa rin ako sa espiritu,[a] na nagagalak at nakikita ang inyong kaayusan at ang katatagan ng inyong pananampalataya sa Mesiyas.[b]
  rationale: Inayos ang salin upang malinaw na maipakita ang magkaugnay ngunit magkahiwalay na kilos na “nagagalak” at “nakikita,” gaya ng χαίρων καὶ βλέπων. Pinakinis din ang ayos ng panghalip para sa natural na Tagalog. Nananatili ang ambigwidad ng “sa espiritu,” ang titular na “Mesiyas,” at ang alternatibong pagbasa ng πίστις sa talababa.
