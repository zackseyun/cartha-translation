  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: tl
  text: Sapagkat sa kanya ay nananahan nang may katawan ang buong kapuspusan ng pagka-Diyos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa katawang anyo.”
    reason: Ipinakikita ang alternatibong paraan ng pagsasalin sa σωματικῶς. Mas natural sa pangunahing teksto ang “nang may katawan,” na pinananatili ang bodily/corporeal na diwa nang walang dagdag na pagpapakahulugan.
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinapakita nito ang sanhi o batayan ng naunang pahayag, habang nananatiling natural at marangal sa modernong Tagalog.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Tuwirang locative na tumutukoy kay Cristo; walang idinagdag na diwa ng pagiging eksklusibo na wala sa Griyego.
- source_word: κατοικεῖ
  choice: nananahan
  rationale: Pinananatili nito ang diwa ng patuloy at matatag na paninirahan, at ang kasalukuyang aspekto ng pandiwang Griyego.
- source_word: πᾶν τὸ πλήρωμα
  choice: ang buong kapuspusan
  rationale: Ipinahahayag nito ang ganap na kabuuan na tinutukoy ng πᾶν kasama ng tiyak na πλήρωμα; ang bahagyang pag-uulit sa Tagalog ay sadyang nagpapanatili sa diin ng Griyego.
- source_word: τῆς θεότητος
  choice: ng pagka-Diyos
  rationale: Ang θεότης ay tumutukoy sa kalagayan o ganap na realidad ng pagiging Diyos, hindi lamang sa ilang katangiang maka-Diyos. Malinaw at likas sa Tagalog ang “pagka-Diyos.”
- source_word: σωματικῶς
  choice: sa katawang anyo
  rationale: Inilalarawan nito ang bodily o corporeal na paraan ng pananahan nang hindi nililimitahan ang pahayag sa isang partikular na interpretasyong teolohikal.
theological_decisions:
- issue: Lakas ng pahayag tungkol sa θεότης at σωματικῶς
  choice: Pinaninindigan ng talata na ang buong realidad ng pagka-Diyos ay nananahan kay Cristo sa katawang anyo.
  alternative: Ang tinutukoy lamang ay mga katangiang maka-Diyos o ang presensiya ng Diyos kay Cristo.
  rationale: Mas malakas ang θεότης kaysa sa pangkalahatang ideya ng pagiging banal o pagkakaroon ng mga katangiang maka-Diyos, at ang σωματικῶς ay tahasang may diwang bodily/corporeal. Pinananatili ng salin ang lakas at tensiyong ito nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang teolohikal na bigat ng “kapuspusan” at “pagka-Diyos,” at iniwasan ang mas lumang terminong “pagka-Diyoshead” o anumang denominasyonal na pagpapaliwanag.
