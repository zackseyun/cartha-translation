  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: tl
  text: Kaya, kung paanong tinanggap ninyo ang Mesiyas na si Jesus, ang Panginoon, patuloy kayong mamuhay sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Kaya, kung paanong
  rationale: Pinagsasama nito ang lohikal na bunga ng οὖν at ang paghahambing ng ὡς sa natural na Filipino.
- source_word: παρελάβετε
  choice: tinanggap ninyo
  rationale: Saklaw ng pandiwa ang naunang pagtanggap nila kay Jesus at sa mensaheng ipinahayag tungkol sa kanya, nang hindi nililimitahan sa intelektuwal na pagkatuto lamang.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: ang Mesiyas na si Jesus
  rationale: Ipinapakita ang Χριστός bilang titulo at ang Ἰησοῦς bilang pangalan; natural sa Filipino ang hulma na “ang Mesiyas na si Jesus.”
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Pinananatili ang kinikilalang kristolohikal na titulo at ang appositional na kaugnayan nito kay Jesus.
- source_word: ἐν αὐτῷ
  choice: na nakaugnay sa kanya
  rationale: Sa Filipino, malinaw at natural nitong ipinahahayag ang patuloy na pamumuhay “sa kanya,” bagaman bahagya itong nagpapaliwanag sa siksik na pahayag ng Griyego.
- source_word: περιπατεῖτε
  choice: patuloy kayong mamuhay
  rationale: Ang present imperative ay nagpapahiwatig ng nagpapatuloy na pagkilos; ang metaporikal na “lumakad” ay karaniwang nangangahulugang asal o paraan ng pamumuhay at mas natural itong ipinahahayag bilang “mamuhay” sa modernong Filipino.
theological_decisions:
- issue: Ang katayuan ng Χριστός bilang titulo
  choice: ang Mesiyas na si Jesus
  alternative: si Cristo Jesus
  rationale: Pinananatili ang kahulugan ng Χριστός bilang titulong “Mesiyas” sa halip na tratuhing bahagi lamang ng pangalan.
- issue: Ang wika ng pakikiisa sa ἐν αὐτῷ
  choice: na nakaugnay sa kanya
  alternative: sa kanya
  rationale: Ipinahahayag ang relasyonal na diwa sa natural na Filipino nang hindi tinutukoy nang mas makitid kung paano nagaganap ang pakikiisang ito.
- issue: Ang metapora ng περιπατεῖτε
  choice: patuloy kayong mamuhay
  alternative: patuloy kayong lumakad
  rationale: Ang tinutukoy ay patuloy na asal at paraan ng pamumuhay, hindi literal na paglalakad. Mas malinaw sa ordinaryong mambabasa ang “mamuhay,” habang pinananatili ang aspektong nagpapatuloy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Mesiyas” bilang titulo, “Panginoon” bilang kinikilalang kristolohikal na katawagan, at “patuloy kayong mamuhay na nakaugnay sa kanya” upang likas na maipahayag ang utos at ang Pauline union language.
