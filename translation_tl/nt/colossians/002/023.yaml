source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: tl
  text: Ang mga ito ay waring may karunungan[a] sa sariling-gawang pagsamba[b], pagpapakumbaba, at mabagsik na pagtrato sa katawan; ngunit walang halaga ang mga ito laban sa pagpapakasasa ng laman.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “may reputasyon sa karunungan.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “pagsambang ipinataw sa sarili”; ayon sa tradisyon, “pagsambang ayon sa sariling kalooban.”'
    reason: lexical_alternative
  - marker: c
    text: 'Mahirap unawain ang huling sugnay. Maaari ring isalin: “hindi sa anumang pagpapahalaga, para sa kabusugan ng laman,” o “walang anumang halaga laban sa kabusugan ng laman.”'
    reason: alternative_reading
  - marker: d
    text: Ang “laman” dito ay maaaring tumukoy sa mga pagnanasa ng makasalanang pagkatao; ihambing ang paggamit ni Pablo sa salitang ito sa ibang kaugnay na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Ang mga ito
  rationale: Tumutukoy pabalik sa mga tuntunin sa talata 21–22 at likas na naipahahayag sa modernong Tagalog.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: waring may karunungan
  rationale: Ipinahahayag ang panlabas na anyo o reputasyon ng karunungan at pinananatili ang mapagbigay-ngunit-sumasalungat na himig ng μέν.
- source_word: ἐθελοθρησκίᾳ
  choice: sariling-gawang pagsamba
  rationale: Ipinahihiwatig ang gawaing panrelihiyon na nagmumula sa sariling pasiya; mas tuwirang tumutugma ang “pagsamba” sa θρησκία kaysa sa mas malawak na “relihiyon.”
- source_word: ταπεινοφροσύνῃ
  choice: pagpapakumbaba
  rationale: Pinananatili ang karaniwang kahulugan ng salita nang hindi tahasang ipinapasiyang huwad ang pagpapakumbaba; ang konteksto ang nagbibigay ng mapanuyang himig.
- source_word: ἀφειδίᾳ σώματος
  choice: mabagsik na pagtrato sa katawan
  rationale: Malinaw na ipinahahayag ang walang-awang paghihigpit o asetismong inilalapat sa katawan.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: walang halaga ang mga ito
  rationale: Sa pangunahing pagbasa, tinutukoy ang kawalan ng bisa o pakinabang ng mga gawaing ito, hindi ang kawalan ng paggalang sa katawan.
- source_word: πρὸς πλησμονὴν
  choice: laban sa pagpapakasasa
  rationale: Sa konteksto, ipinahahayag ang kabiguang pigilin ang lubos na pagbibigay-kasiyahan sa mga pagnanasa.
- source_word: τῆς σαρκός
  choice: ng laman
  rationale: Pinananatili ang salitang teolohikal at ang posibleng lawak ng σάρξ sa halip na paliitin agad ito sa “makasalanang kalikasan.”
theological_decisions:
- issue: Kahulugan ng mahirap na huling pariralang οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Walang halaga ang mga asetiko at sariling-gawang gawaing ito laban sa pagpapakasasa ng laman.
  alternative: “Hindi nagbibigay ng anumang paggalang sa katawan, para sa pagbibigay-kasiyahan sa laman,” o “walang anumang karangalan, kundi para sa pagpapakasasa ng laman.”
  rationale: Siksik at hindi tiyak ang sintaks ng Griyego. Pinakamainam sa daloy ng argumento ang pagbasa na wala itong bisa sa pagpigil sa mga pagnanasa ng laman, ngunit inilalahad sa talababa ang tunay na mga alternatibo.
- issue: Saklaw ng σάρξ
  choice: “laman,” na maaaring tumukoy sa mga pagnanasa ng makasalanang pagkatao
  alternative: “makasalanang kalikasan”
  rationale: Hindi dapat lutasin sa salin ang buong teolohikal na saklaw ng salita; pinananatili ng “laman” ang ambiguity at ugnayan nito sa paggamit ni Pablo sa ibang dako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “waring” upang ihatid ang anyo o reputasyon ng karunungan, at “sariling-gawang pagsamba” upang maging malinaw nang hindi nag-aangkat ng katawagang denominasyonal. Inilagay ang mga marker sa mga bahaging kanilang nililinaw at pinanatili ang ambiguity ng mahirap na huling sugnay sa talababa.
