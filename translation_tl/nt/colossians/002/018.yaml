  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: tl
  text: Huwag ninyong hayaang agawan kayo ninuman ng gantimpala—ng taong nalulugod sa pagpapakumbaba at pagsamba sa mga anghel[a], na nagbubusisi sa mga bagay na nakita niya[b][c], at walang kabuluhang nagpapalalo, na inuudyukan ng pag-iisip ng kanyang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “relihiyon ng mga anghel” o “pagsambang kasama ng mga anghel.” Maaaring unawain sa higit sa isang paraan ang pariralang Griyego.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “masusing pumapasok sa mga bagay na nakita niya” o “nananatili sa mga bagay na nakita niya.” Bihira at mahirap tiyakin ang pandiwang Griyego.
    reason: lexical_alternative
  - marker: c
    text: Sa ilang manuskrito ay “mga bagay na hindi niya nakita,” kaya ang diwa ay tulad ng “nagbubusisi sa mga bagay na hindi niya nakita.”
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: alisan ... ng gantimpala
  rationale: Pinananatili nito ang larawan ng isang tagahatol na nagpapawalang-karapat-dapat at nagkakait ng gantimpala, sa natural na Tagalog.
- source_word: θέλων ἐν
  choice: nasisiyahan sa
  rationale: Ipinahahayag ang kusang pagkagusto o kasiyahan sa mga gawaing binanggit, hindi lamang ang payak na pagnanais.
- source_word: ταπεινοφροσύνῃ
  choice: pagpapakumbaba
  rationale: Pinananatili ang karaniwang kahulugan ng salita; ang mapanuyang o pakunwaring katangian nito ay ipinahihiwatig ng konteksto.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: pagsamba sa mga anghel
  rationale: Ito ang pinakatuwirang pagbasa sa genitive bilang pagsambang iniuukol sa mga anghel, habang inilalahad sa talababa ang tunay na kalabuan.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: nagbabad sa mga bagay na nakita niya
  rationale: Ang bihira at mahirap na pandiwang ἐμβατεύω ay maaaring tumukoy sa masusing pagtutuon o pananatili sa mga pangitain; ang 'nagbabad' ay natural ngunit nananatiling malapit sa larawang ito.
- source_word: εἰκῇ φυσιούμενος
  choice: walang kabuluhang nagmamalaki
  rationale: Ipinahahayag ang walang batayang pagmamataas, bagaman hindi ganap na napapanatili ang literal na larawan ng paglobo.
- source_word: ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ
  choice: dahil sa pag-iisip ng kanyang laman
  rationale: Pinananatili ang 'laman' at ang di-karaniwang ugnayan nito sa pag-iisip upang hindi palitan ng sistematikong paliwanag ang teolohikal na tensiyon ni Pablo.
theological_decisions:
- issue: Kahulugan ng θρησκείᾳ τῶν ἀγγέλων
  choice: pagsambang iniuukol sa mga anghel
  alternative: relihiyon o pagsambang ginagawa ng mga anghel; pagsambang kasama ng mga anghel
  rationale: Ang objective genitive ang karaniwan at angkop na pangunahing pagbasa, ngunit hindi tiyak ang anyo ng genitive kaya pinananatili sa talababa ang ibang posibilidad.
- issue: Kahulugan ng σάρξ sa τῆς σαρκὸς αὐτοῦ
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Iniiwasang ipasok sa salin ang isang mas tiyak na doktrinal na pagpapakahulugan; pinananatili ng 'laman' ang salita at tensiyon ng Griyego.
- issue: Tekstuwal na anyo ng ἃ ἑόρακεν
  choice: mga bagay na nakita niya
  alternative: mga bagay na hindi niya nakita
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT, habang itinatala ang mahalagang variant na may negasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo” bilang pangmaramihang kausap. Pinanatili ang “laman” sa halip na interpretibong “makasalanang kalikasan,” at inilagay ang mga tunay na kalabuan sa mga talababa.
