revisions:
- from: Huwag kayong hayaang alisan ninuman ng gantimpala. Ang gayong tao ay nasisiyahan sa pagpapakumbaba at pagsamba sa mga anghel[a], at nagbabad sa mga bagay na nakita niya[b][c]. Walang kabuluhang nagmamalaki siya dahil sa pag-iisip ng kanyang laman.
  to: Huwag ninyong hayaang agawan kayo ninuman ng gantimpala—ng taong nalulugod sa pagpapakumbaba at pagsamba sa mga anghel[a], na nagbubusisi sa mga bagay na nakita niya[b][c], at walang kabuluhang nagpapalalo, na inuudyukan ng pag-iisip ng kanyang laman.
  rationale: Inayos ang salin upang mas malinaw na ang lahat ng paglalarawan ay tumutukoy sa taong nagtatangkang magkait ng gantimpala. Pinalitan ang “nagbabad” ng mas angkop na “nagbubusisi,” at isinalin ang instrumental na ὑπό bilang “na inuudyukan ng.” Pinanatili ang mga pangunahing terminong teolohikal at ang mga talababa para sa tunay na leksikal, sintaktikong, at tekstuwal na kalabuan.
