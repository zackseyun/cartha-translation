  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: tl
  text: at hindi kumakapit nang mahigpit sa Ulo[a]. Mula sa kanya, ang buong katawan ay binibigyan ng kailangan at pinagbubuklod sa pamamagitan ng mga kasukasuan at litid[b], at lumalago sa paglagong mula sa Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanghahawak nang mahigpit sa Ulo.”
    reason: lexical_alternative
  - marker: b
    text: O “binibigyan ng kailangan at pinagbubuklod sa pamamagitan ng mga kasukasuan at litid.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “lumalago sa paglago ng Diyos.” Maaaring ang ibig sabihin ay paglagong nagmumula sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: kumakapit nang mahigpit
  rationale: Ipinahahayag ng pandiwari ang matatag at patuloy na pagkapit o pananatiling nakaugnay, hindi lamang simpleng paghawak.
- source_word: κεφαλήν
  choice: Ulo
  rationale: Pinananatili ang metapora ng katawan; ang malaking titik ay nagpapahiwatig na si Cristo ang tinutukoy sa konteksto.
- source_word: ἐξ οὗ
  choice: Mula sa kanya
  rationale: Ang panlalaking panghalip ay tumutukoy pabalik sa Ulo, kaya personal na reperensiya ang angkop.
- source_word: πᾶν τὸ σῶμα
  choice: ang buong katawan
  rationale: Natural na Tagalog na nagpapanatili sa larawan ng iisang katawan sa kabuuan nito.
- source_word: διὰ τῶν ἁφῶν καὶ συνδέσμων
  choice: sa pamamagitan ng mga kasukasuan at litid
  rationale: Malinaw at natural na anatomikong paglalarawan sa mga bahaging nag-uugnay at nagbibigkis sa katawan.
- source_word: ἐπιχορηγούμενον
  choice: tinutustusan
  rationale: Saklaw nito ang ideya ng patuloy na paglalaan at pagsuporta nang hindi nililimitahan ang kahulugan sa pagpapakain lamang.
- source_word: συμβιβαζόμενον
  choice: pinagbubuklod
  rationale: Ipinapakita ang pagsasama-sama ng mga bahagi tungo sa isang magkakaugnay na kabuuan.
- source_word: αὔξει
  choice: lumalago
  rationale: Pinananatili ang buhay na metapora ng paglaki ng katawan.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: sa paglago na mula sa Diyos
  rationale: Natural na ipinahahayag ang malamang na diwang pinagmulan—ang Diyos ang nagbibigay ng paglago—habang itinatala sa talababa ang mas literal at tunay na posibleng anyo ng genitibo.
theological_decisions:
- issue: Kahulugan ng genitibo sa τὴν αὔξησιν τοῦ θεοῦ
  choice: paglagong nagmumula sa Diyos
  alternative: paglago ng Diyos
  rationale: Sa konteksto, ang katawan ang lumalago at ang Diyos ang pinagmumulan ng paglago. Gayunman, hindi ganap na tinutukoy ng anyong genitibo ang ugnayan, kaya pinananatili sa talababa ang mas literal na salin.
- issue: Pagkakakilanlan ng κεφαλή
  choice: Ulo, na tumutukoy kay Cristo
  alternative: ulo
  rationale: Malinaw sa mas malawak na konteksto ng Colosas na si Cristo ang Ulo ng katawan; ang malaking titik ay palatandaang tipograpiko lamang at hindi nagdaragdag ng bagong doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metapora ng Ulo at katawan, iniwasan ang sobrang teknikal o makalumang bokabularyo, at ginamit ang mga talababa upang ilahad ang mahahalagang alternatibong leksikal at ang ambiguwidad ng genitibo.
