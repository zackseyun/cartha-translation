  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: tl
  text: Sumainyong lahat nawa ang Diyos ng kapayapaan. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Hindi isinalin nang hiwalay
  rationale: Mahina at panapos na pang-ugnay ang δέ rito, hindi malinaw na pagsalungat o panandang-panahon. Likas sa modernong Tagalog na ihayag ang pangwakas na basbas nang walang panimulang “ngayon,” “at,” o “ngunit.”
- source_word: θεὸς τῆς εἰρήνης
  choice: ang Diyos ng kapayapaan
  rationale: Tuwirang pinananatili ang genitibong titulo ni Pablo at ang tiyak na pantukoy.
- source_word: εἰρήνης
  choice: kapayapaan
  rationale: Karaniwang katumbas ng εἰρήνη at sapat na nagpapahiwatig ng kapayapaan, kabuuan, at mabuting ugnayan nang hindi pinalalawak ang teksto.
- source_word: μετὰ πάντων ὑμῶν
  choice: Sumainyo nawang lahat
  rationale: Ipinapahayag ng “sumainyo nawa” ang diwa ng isang basbas sa likas at marangal na Tagalog; malinaw na pinananatili ng “lahat” ang πάντων.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinanatili ang kinagawiang liturhikal na salita bilang maringal na pangwakas.
theological_decisions:
- issue: Kung ang sugnay na walang hayag na pandiwa ay pahayag o panalanging-basbas
  choice: 'Isinalin bilang panalanging-basbas: “Sumainyo nawang lahat ang Diyos ng kapayapaan.”'
  alternative: “Sumasainyong lahat ang Diyos ng kapayapaan.”
  rationale: Sa konteksto ng pangwakas na pormula ng liham, ang sugnay ay likas na isang hiling o basbas. Ang “nawa” ay naghahayag ng tungkuling ito nang hindi ginagawang karaniwang pasalaysay ang pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at angkop sa pangwakas na basbas. Ginamit ang kinagawiang “sumainyo nawa” sa halip na mas literal ngunit hindi gaanong likas na “makasama ninyo nawa.”
