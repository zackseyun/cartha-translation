  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: tl
  text: 'kundi gaya ng nasusulat:


    “Makakakita ang mga hindi pinagsabihan tungkol sa kanya,[a][b]


    at makauunawa ang mga hindi pa nakarinig.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinisipi ni Pablo ang Isaias 52:15. Sa konteksto ng Isaias, ang “kanya” ay tumutukoy sa lingkod, at dito ay iniugnay ni Pablo ang sipi sa kanyang pagpapahayag ng ebanghelyo.
    reason: cross_reference
  - marker: b
    text: O “Yaong mga hindi pinagsabihan tungkol sa kanya ay makakakita … at ang mga hindi nakarinig ay makauunawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ipinakikita ang pagsalungat sa naunang pahayag ni Pablo tungkol sa layunin ng kanyang ministeryo; natural sa Filipino ang “kundi” sa ganitong pagpapatuloy.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwang pormula ito sa pagsipi sa Kasulatan at natural na naihahayag ang diwa ng perfect passive.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: ang mga hindi pa nasasabihan tungkol sa kanya
  rationale: Isinaayos ang dative relative construction sa natural na Filipino habang pinananatili ang passive na pagpapahayag at ang personal na panghalip.
- source_word: ὄψονται
  choice: makakakita
  rationale: Tuwirang pinananatili ang kahulugan ng future ng ὁράω; hindi ito pinalitan ng interpretatibong “makakikilala” o “makauunawa.”
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: ang mga hindi pa nakarinig
  rationale: Ang “hindi pa” ay natural na nagsasaad ng kalagayang bunga ng hindi pa pagkarinig, na angkop sa Greek perfect.
- source_word: συνήσουσιν
  choice: makauunawa
  rationale: Malinaw at dignified na salin ng future ng συνίημι, na pinananatili ang pangakong nasa hinaharap.
theological_decisions:
- issue: Ang tinutukoy ng αὐτοῦ (“kanya”) sa sipi mula sa Isaias
  choice: Pinanatili ang panghalip na “kanya” nang hindi pinalawak bilang “Mesiyas” o “Cristo.”
  alternative: “tungkol sa Mesiyas” o “tungkol kay Cristo”
  rationale: Panghalip lamang ang nasa Griyego. Pinananatili nito ang pagkakaugnay sa lingkod sa konteksto ng Isaias at ang paggamit ni Pablo sa sipi nang hindi nagdaragdag ng interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “nasasabihan” para sa malinaw na passive construction at pinanatili ang “makakakita” upang hindi alisin ang larawan ng orihinal na sipi.
