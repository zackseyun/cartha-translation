id: ROM.15.7
reference: Romans 15:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: tl
  text: Kaya tanggapin ninyo ang isa't isa, kung paanong tinanggap din kayo ng Mesiyas, para sa kaluwalhatian ng Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas na nagpapahayag ng kongklusyon o bunga mula sa naunang pangangatwiran.
- source_word: προσλαμβάνεσθε ... προσελάβετο
  choice: tanggapin ... tinanggap
  rationale: Pinananatili ang tuwirang pag-uugnay ng dalawang anyo ng iisang pandiwa at ipinahahayag ang bukás na pagtanggap sa kapwa sa konteksto ng pamayanan.
- source_word: ἀλλήλους
  choice: ang isa't isa
  rationale: Karaniwang makabagong Tagalog na malinaw na nagpapanatili sa katumbasang diwa ng panghalip.
- source_word: καθὼς καὶ
  choice: kung paanong ... din
  rationale: Pinananatili ang paghahambing at ang dagdag na diin ng καί sa natural na ayos ng Tagalog.
- source_word: ὁ Χριστὸς
  choice: ang Mesiyas
  rationale: May pantukoy ang Χριστός at gumaganap dito bilang titulo; malinaw sa karaniwang mambabasa ang 'Mesiyas' bilang hinirang na tagapagligtas.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Tuwirang inilalarawan ang pangmaramihang ikalawang panauhan nang hindi dinaragdagan ang kahulugan.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: sa ikaluluwalhati ng Diyos
  rationale: Likas na Tagalog na nagpapanatili sa maaaring layunin o bunga ng εἰς δόξαν, nang hindi pinipili nang mahigpit ang isa lamang.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang may-pantukoy na anyo rito ay angkop unawain bilang titulo. Hindi nito binabago ang pagkakakilanlan ni Jesus kundi inililitaw ang mesiyanikong kahulugan ng termino.
- issue: Saklaw ng προσλαμβάνομαι sa pamayanan
  choice: tanggapin ang isa't isa
  alternative: malugod na tanggapin ang isa't isa / kupkupin ang isa't isa
  rationale: Ang 'tanggapin' ay natural at sapat na malawak para sa personal at pampamayanang pagtanggap, habang iniiwasan ang sobrang pagpapalakas o pagpapakitid ng pandiwa.
- issue: Puwersa ng εἰς δόξαν τοῦ θεοῦ
  choice: sa ikaluluwalhati ng Diyos
  alternative: para sa kaluwalhatian ng Diyos / tungo sa kaluwalhatian ng Diyos
  rationale: Maaaring magpahiwatig ang parirala ng layunin o bunga. Pinananatili ng napiling salin ang dalawang posibilidad at hindi tiyak na itinatali kung ang parirala ay pangunahing kaugnay ng pagtanggap ng Mesiyas o ng buong utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang inklusibong pangmaramihang 'ninyo/kayo' ayon sa Griyego at pinanatili ang paralelismo ng dalawang anyo ng προσλαμβάνομαι.
