id: ROM.15.3
reference: Romans 15:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: tl
  text: Sapagkat maging ang Mesiyas[a] ay hindi niya pinalugdan ang sarili niya; kundi, gaya ng nasusulat, “Ang mga pang-iinsulto ng mga umiinsulto sa iyo ay bumagsak sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: Alternatibong salin ng Χριστός bilang tradisyonal at mas name-like na katawagan.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Sapagkat maging
  rationale: Ipinapakita ng “sapagkat” ang pangangatwirang kaugnay ng naunang pahayag, habang pinananatili ng “maging” ang diin na maging ang Mesiyas ang halimbawa.
- source_word: ὁ Χριστός
  choice: ang Mesiyas
  rationale: May pantukoy ang Χριστός at ginagamit dito bilang titulo sa papel niya bilang huwaran; natural at malinaw sa modernong Filipino ang “Mesiyas.”
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: ay hindi nagbigay-lugod sa sarili niya
  rationale: Malapit itong katumbas ng pandiwang ἀρέσκω at ng reflexive na ἑαυτῷ, nang hindi dinaragdagan ang maikling pahayag ng Griyego.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: Sa halip, gaya ng nasusulat
  rationale: Ang “sa halip” ay malinaw na naghuhudyat ng pagsalungat, at ang “gaya ng nasusulat” ay likas at marangal na pormula para sa pagsipi sa Kasulatan.
- source_word: ὀνειδισμοί
  choice: mga pag-alipusta
  rationale: Saklaw nito ang mapanlait na pananalita at pagdudulot ng kahihiyan, habang angkop ang register sa sipi mula sa Kasulatan.
- source_word: τῶν ὀνειδιζόντων σε
  choice: ng mga lumalapastangan sa iyo
  rationale: Ginagawang likas na parirala sa Filipino ang participle at pinananatili ang diwa ng tahasang pag-insulto o paghamak.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: ay bumagsak sa akin
  rationale: Direktang pinananatili ang larawang “nahulog o bumagsak sa” at ang simpleng pangnagdaan ng aorist.
theological_decisions:
- issue: Pagsasalin ng Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Mas malinaw dito ang gamit bilang titulo dahil sa pantukoy at sa pagharap kay Jesus bilang mesiyanikong huwaran. Inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Pagkakakilanlan ng nagsasalita sa sipi
  choice: Hindi tahasang tinutukoy sa salin kung sino ang “akin.”
  alternative: Idagdag na ang “akin” ay tumutukoy sa Mesiyas/Cristo.
  rationale: Iniuugnay ni Pablo ang Awit 69:9 sa Mesiyas, ngunit hindi pinapangalanan ng mismong sipi ang nagsasalita; pinananatili ng salin ang ambiguwidad ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagbigay-lugod sa sarili niya” upang manatiling malapit sa Griyego, at “pag-alipusta/lumalapastangan” upang mapanatili ang seryosong tono ng sipi nang hindi maging lipas ang wika.
