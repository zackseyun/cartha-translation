revisions:
- from: Sapagkat maging ang Mesiyas[a] ay hindi nagbigay-lugod sa sarili niya. Sa halip, gaya ng nasusulat, “Ang mga pag-alipusta ng mga lumalapastangan sa iyo ay bumagsak sa akin.”
  to: Sapagkat maging ang Mesiyas[a] ay hindi niya pinalugdan ang sarili niya; kundi, gaya ng nasusulat, “Ang mga pang-iinsulto ng mga umiinsulto sa iyo ay bumagsak sa akin.”
  rationale: Inayos ang salin upang maging mas natural sa modernong Filipino at mas tapat sa saklaw at pag-uulit ng mga salitang Griyego para sa panlalait o pag-insulto. Pinananatili ang titulo na “Mesiyas,” ang pormula ng pagsipi, at ang hindi tinutukoy na pagkakakilanlan ng “akin” sa sipi.
