  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: tl
  text: Sapagkat sinasabi ko na ang Mesiyas ay naging lingkod para sa mga tinuli alang-alang sa katotohanan ng Diyos[a], upang pagtibayin ang mga pangakong ibinigay sa mga ninuno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alang-alang sa pagiging tapat ng Diyos,” na nagdiriin sa katapatan niyang tuparin ang kaniyang mga pangako.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Sapagkat sinasabi ko
  rationale: Ang γάρ ay nagpapaliwanag ng kaugnayan sa naunang pahayag, kaya ang “Sapagkat” ay angkop; tuwirang pinananatili ng “sinasabi ko” ang λέγω.
- source_word: Χριστόν
  choice: ang Mesiyas
  rationale: Titular ang gamit sa kontekstong tumatalakay sa Israel, pagtutuli, at mga pangako sa mga ninuno; malinaw sa modernong Filipino ang “Mesiyas.”
- source_word: διάκονον γεγενῆσθαι
  choice: ay naging lingkod
  rationale: Ang διάκονος ay tumutukoy sa isang naglilingkod, hindi kinakailangang sa tungkuling pansimbahan; natural na ipinahahayag ng “naging” ang pagkakaroon ng kalagayang bunga ng γίνομαι.
- source_word: περιτομῆς
  choice: ng mga tuli
  rationale: Ang genitibo ay tumutukoy sa bayang tuli, samakatuwid ay sa mga Judio. Ang “lingkod ng mga tuli” ay maikli at pinananatili ang ugnayang genitibo nang hindi ipinapasok ang salitang “Judio” sa pangunahing teksto.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: alang-alang sa katotohanan ng Diyos
  rationale: Ipinahahayag ng ὑπέρ ang layunin o kapakanan. Maaaring tumukoy ang ἀλήθεια θεοῦ sa katotohanan ng Diyos o sa kaniyang pagiging tapat; pinananatili sa talababa ang huling posibilidad.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: upang pagtibayin
  rationale: Malinaw na layunin ang ipinahahayag ng konstruksyon; ang “pagtibayin” ay angkop sa pagkukumpirma o pagpapatatag ng mga pangako.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: ang mga pangakong ibinigay sa mga ninuno
  rationale: Sa konteksto, ang genitibong τῶν πατέρων ay tumutukoy sa mga pangakong nauukol o ibinigay sa mga ninuno ng Israel. Ang bahagyang pagpapalinaw ay natural sa Filipino at hindi nililimitahan ang mga tinutukoy sa mga patriyarka lamang.
theological_decisions:
- issue: Paglilipat ng Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Gumaganap ito bilang titulo sa argumento tungkol sa Israel at sa mga pangako sa mga ninuno; kaya isinasalin ang kahulugan ng titulo.
- issue: Diwa ng ἀλήθεια θεοῦ
  choice: katotohanan ng Diyos
  alternative: pagiging tapat ng Diyos
  rationale: Maaaring saklawin ng parirala ang katotohanan ng Diyos o ang kaniyang katapatan sa tipan. Hindi nilulutas nang tahimik ang ambiguwidad; inilalagay sa talababa ang malakas na kontekstuwal na alternatibo.
- issue: Tinutukoy ng περιτομῆς
  choice: mga tuli
  alternative: pagtutuli
  rationale: Dito ay metonimikong tumutukoy ang “pagtutuli” sa mga taong tuli, lalo na sa mga Judio. Ang “mga tuli” ay malinaw ngunit hindi nagpapalit ng katawagan sa mismong talata.
- issue: Ugnayan ng τῶν πατέρων sa mga pangako
  choice: mga pangakong ibinigay sa mga ninuno
  alternative: mga pangako ng mga ninuno
  rationale: Sa daloy ng pangungusap, ang mga ninuno ang tumanggap ng mga pangako, hindi ang pinagmulan ng mga iyon. Nililinaw ito sa natural na Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tuli” bilang maunawaing katawagan sa mga Judio sa kontekstong ito, at “mga ninuno” upang maging natural sa karaniwang mambabasa nang hindi sobra ang interpretasyon.
