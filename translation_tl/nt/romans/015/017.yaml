  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: tl
  text: Kaya may dahilan akong magmalaki kay Mesias Jesus sa mga bagay na nauukol sa Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may maipagmamalaki ako.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa/kay Mesias Jesus.” Maaari itong magpahiwatig ng larangan o pakikipag-ugnayan, hindi lamang ng sanhi.
    reason: translation_clarification
lexical_decisions:
- source_word: ἔχω οὖν τὴν καύχησιν
  choice: Kaya may dahilan akong magmalaki
  rationale: Ipinapahayag ng ἔχω ang pagkakaroon ng batayan, samantalang ang οὖν ay nag-uugnay nito bilang bunga ng naunang sinabi. Likas sa modernong Tagalog ang pariralang “may dahilan akong magmalaki” at angkop nitong naihahatid ang idyomatikong diwa ng καύχησις.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dahil kay Mesias Jesus
  rationale: Bagaman literal na “kay/sa loob ni Mesias Jesus” ang ἐν, sa Tagalog ay mas malinaw na ipinakikitang ang pagmamapuri ni Pablo ay nakabatay kay Mesias Jesus, hindi sa sarili niyang kakayahan. Isinalin ang Χριστός bilang titulong “Mesias.”
- source_word: τὰ πρὸς τὸν θεόν
  choice: tungkol sa mga bagay na may kinalaman sa Diyos
  rationale: Pinananatili nito ang malawak na saklaw ng idyoma—mga bagay o gawaing nauukol sa Diyos—nang hindi ito nililimitahan sa paglilingkod o gawaing pari lamang.
theological_decisions:
- issue: Kahulugan ng Χριστός
  choice: Mesias
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo na nakakabit sa pangalang Jesus, kaya isinalin ang kahulugan nito sa halip na transliterahin lamang.
- issue: Batayan at uri ng pagmamalaki ni Pablo
  choice: may dahilan akong magmalaki dahil kay Mesias Jesus
  alternative: may pagmamalaki ako kay Mesias Jesus
  rationale: Ipinakikita ng konteksto at ng ἐν Χριστῷ Ἰησοῦ na hindi ito hiwalay na pagyayabang sa sarili. Gayunman, pinanatili ang matapang at maaaring may tensiyong salitang “magmalaki” sa halip na palitan ng mas banayad na “magalak.”
- issue: Saklaw ng τὰ πρὸς τὸν θεόν
  choice: mga bagay na may kinalaman sa Diyos
  alternative: paglilingkod sa Diyos
  rationale: Hindi nilimitahan ang parirala sa ministeryo o gawaing saserdote, sapagkat mas malawak ang maaaring saklaw ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “magmalaki” upang mapanatili ang leksikal at teolohikal na tensiyon ng καύχησις, habang nilinaw ng “may dahilan” at “dahil kay Mesias Jesus” na hindi simpleng pagyayabang sa sarili ang tinutukoy.
