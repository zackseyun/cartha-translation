id: ROM.15.16
reference: Romans 15:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: tl
  text: upang ako'y maging lingkod ni Mesiyas na si Jesus sa mga Hentil[a], na gumaganap ng makaparing paglilingkod[b] sa magandang balita ng Diyos, upang ang handog ng mga Hentil[c] ay maging kalugod-lugod sa Diyos, na pinabanal ng Espiritu Santo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bansa.” Dito, malamang na tumutukoy ang “mga bansa” sa mga hindi Judio.
    reason: lexical_alternative
  - marker: b
    text: O “naglilingkod bilang pari” o “gumaganap ng paglilingkod na makapari.”
    reason: lexical_alternative
  - marker: c
    text: Malamang na ang mga Hentil mismo ang handog na inihaharap sa Diyos; maaari rin itong mangahulugang “ang handog na mula sa mga Hentil.”
    reason: alternative_reading
  - marker: d
    text: O “pinabanal sa Espiritu Santo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: lingkod
  rationale: Ipinahahayag nito ang paglilingkod na may sagradong katangian nang hindi ipinapalagay na tumutukoy ang salita sa isang pormal na katungkulan sa simbahan.
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Ginagamit dito ang Χριστός bilang titulo; natural sa makabagong Tagalog ang pariralang “Mesiyas na si Jesus” at malinaw na ipinakikitang titulo ang Mesiyas.
- source_word: εἰς τὰ ἔθνη
  choice: para sa mga Hentil
  rationale: Sa konteksto ng misyon ni Pablo, ang ἔθνη ay tumutukoy lalo na sa mga hindi Judio. Pinananatili sa talababa ang mas literal na “mga bansa.”
- source_word: ἱερουργοῦντα
  choice: ginagampanan ko bilang pari ang paglilingkod
  rationale: Malinaw nitong pinananatili ang metaporang makapari sa pandiwang Griyego at iniiwasang gawing pangkalahatang paglilingkod lamang.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ang magandang balita ng Diyos
  rationale: Tuwirang ipinahahayag nito ang kahulugan ng εὐαγγέλιον sa natural at madaling maunawaang Tagalog.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: ang handog ng mga Hentil
  rationale: 'Pinananatili nito ang anyo at tunay na kalabuan ng Griyegong genitive: malamang na ang mga Hentil mismo ang handog, ngunit maaari ring tumukoy sa handog na inihahandog nila.'
- source_word: εὐπρόσδεκτος
  choice: kalugod-lugod sa Diyos
  rationale: Ang “kalugod-lugod” ay angkop sa wikang ginagamit tungkol sa handog; idinagdag ang “sa Diyos” bilang malinaw na ipinahihiwatig na tumatanggap sa konteksto.
- source_word: ἡγιασμένη
  choice: pinabanal
  rationale: Ipinahahayag nito ang naganap nang pagkilos na nagbunga ng kalagayang banal o inilaan sa Diyos.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: ng Espiritu Santo
  rationale: 'Binabasa ang ἐν bilang nagpapahayag ng ahensiya o paraan: ang Espiritu Santo ang nagpapabanal. Nasa talababa ang posibleng pagbasa na “sa Espiritu Santo.”'
theological_decisions:
- issue: Ang paglalarawan ni Pablo sa sarili sa wikang makapari
  choice: Pinanatili ang makaparing metapora bilang paglalarawan sa paglilingkod ni Pablo sa magandang balita para sa mga Hentil.
  alternative: Maaaring gawing pangkalahatang “banal na paglilingkod,” o basahin bilang pag-angkin ng isang pormal na katungkulan ng pari.
  rationale: Magkakaugnay ang λειτουργός, ἱερουργέω, at προσφορά, kaya kailangang manatili ang larawan ng pari at handog. Gayunman, hindi sinasabi ng talata na naghahandog si Pablo ng sakripisyong pantubos o na taglay niya ang isang kalaunang katungkulang pansimbahan.
- issue: Ang tinutukoy ng “handog ng mga Hentil”
  choice: Pinanatiling hindi lubos na tiyak sa pangunahing teksto, habang itinatala na malamang na ang mga Hentil mismo ang handog sa Diyos.
  alternative: Isang handog na ginawa o dinala ng mga Hentil.
  rationale: Mas pinapaboran ng makaparing metapora at konteksto ng misyon ang mga Hentil mismo bilang handog, ngunit pinahihintulutan ng kayariang Griyego ang alternatibong pagkaunawa.
- issue: Ang gamit ng ἐν sa pagpapabanal ng Espiritu Santo
  choice: 'Isinalin bilang ahensiya: “pinabanal ng Espiritu Santo.”'
  alternative: “Pinabanal sa Espiritu Santo,” na maaaring tumukoy sa saklaw o kalagayan ng pagpapabanal.
  rationale: Natural at kontekstuwal ang instrumental na pagbasa, ngunit tunay na posible ang locative o spheric na pagbasa at kaya pinanatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Mesiyas na si Jesus” upang mapanatili ang titular na diwa ng Χριστός, at “magandang balita” upang maging madaling maunawaan. Sadyang pinanatili ang makaparing larawan at ang kalabuan ng “handog ng mga Hentil.”
