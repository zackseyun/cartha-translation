  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: tl
  text: Bigyang-kasiyahan ng bawat isa sa atin ang kanyang kapwa para sa ikabubuti nito[a], upang mapatibay ito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungo sa mabuti” o “para sa kabutihan.” Binibigyang-diin ng Griyego ang tunay na kapakinabangan, hindi ang basta pagpapalugod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa pagpapatibay nito.” Literal na tumutukoy ang salitang Griyego sa “pagtatayo,” ngunit ginagamit dito bilang larawan ng pagpapalakas sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: bawat isa sa atin
  rationale: Likas na salin ng distributibong isahan na may partitive genitive; pinananatili nito ang panawagan sa bawat indibidwal sa loob ng buong pangkat.
- source_word: τῷ πλησίον
  choice: ang kanyang kapwa
  rationale: Ang πλησίον ay tumutukoy sa kapwa sa etikal na diwa. Ang “kanyang kapwa” ay malinaw at natural sa makabagong Tagalog.
- source_word: ἀρεσκέτω
  choice: sikaping ... bigyang-kasiyahan
  rationale: Ipinahahayag nito ang lakas ng pangatlong panauhang pautos habang iniiwasang magtunog na basta pagpapalugod o pagsang-ayon sa lahat ng nais ng kapwa.
- source_word: εἰς τὸ ἀγαθὸν
  choice: para sa ikabubuti nito
  rationale: 'Ipinakikita ng parirala ang layunin o kapakinabangan: ang pagbibigay-kasiyahan ay nakatuon sa tunay na kabutihan ng kapwa, hindi sa pambobola lamang.'
- source_word: πρὸς οἰκοδομήν
  choice: sa pagpapatatag nito
  rationale: Metaporikal ang οἰκοδομή para sa pagpapalakas o pagpapatibay ng isang tao. Natural sa Tagalog ang “pagpapatatag” at naipahahayag ang diwa nang hindi nililimitahan sa pisikal na pagtatayo.
theological_decisions:
- issue: Saklaw ng utos na bigyang-kasiyahan ang kapwa
  choice: Nililimitahan ang utos ng ikabubuti at pagpapatatag ng kapwa; hindi ito walang-takdang pakikisunod o paghahangad ng pagsang-ayon.
  alternative: Unawain ito bilang pangkalahatan at walang pasubaling pagpapalugod sa ibang tao.
  rationale: May dalawang pariralang nagsasaad ng layunin sa Griyego—εἰς τὸ ἀγαθὸν at πρὸς οἰκοδομήν—na nagtatakda kung anong uri ng pagbibigay-kasiyahan ang hinihingi.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nito” bilang natural na pantukoy pabalik sa “kapwa,” nang hindi nagdaragdag ng kasarian. Pinanatili ang dalawang magkahiwalay na layunin ng Griyego at ang metaporikal na diwa ng pagpapatibay sa pamamagitan ng footnote.
