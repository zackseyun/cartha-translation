  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: tl
  text: upang may iisang kalooban at sa iisang bibig[a] ay luwalhatiin ninyo ang Diyos at Ama ng ating Panginoong Jesus na Mesiyas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “sa iisang tinig.” Literal na “sa iisang bibig” ang Griyego, na nagbibigay-diin sa nagkakaisang pagpupuri.
    reason: lexical_alternative
  - marker: b
    text: 'Nakaugaliang salin: “Jesucristo.” Ang Griyegong titulong Χριστός ay nangangahulugang “Mesiyas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag ng “upang” ang layunin o kinalabasang kaugnay ng naunang pangungusap.
- source_word: ὁμοθυμαδόν
  choice: nang may iisang kalooban
  rationale: Ipinahahayag nito ang sama-samang pagkakaisa ng isip at layunin, habang pinananatiling naiiba sa kasunod na larawan ng “iisang bibig.”
- source_word: ἐν ἑνὶ στόματι
  choice: sa iisang bibig
  rationale: Pinananatili ang matingkad na metapora ng Griyego tungkol sa nagkakaisang pagpupuri; mas idyomatiko ang “sa iisang tinig,” ngunit hindi nito lubos na naipapakita ang larawang nasa pinagmulan.
- source_word: δοξάζητε
  choice: luwalhatiin ninyo
  rationale: Ang kasalukuyang pasakali na nakapailalim sa ἵνα ay angkop na naihahayag bilang layunin; ang “luwalhatiin” ay karaniwan at marangal sa kontekstong ito.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: ang Diyos at Ama
  rationale: Pinananatili ang malapit na ugnayan ng dalawang katawagan sa ilalim ng iisang pantukoy nang hindi nilulutas nang higit sa sinasabi ng sintaks.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Tuwirang pinananatili ang titulo at ang panghalip na paari; naging “Panginoong” dahil sa likas na pag-uugnay nito sa pangalang Jesus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” hindi lamang bilang nakaugaliang transliterasyong “Cristo,” at ginagamit ang “na” upang maging natural sa modernong Tagalog.
theological_decisions:
- issue: Pagkakaugnay ng τὸν θεὸν καὶ πατέρα
  choice: ang Diyos at Ama
  alternative: ang Diyos, na siyang Ama
  rationale: Hindi ginagawang tahasang paliwanag o pagtutumbas ang parirala; pinananatili ang siksik at maaaring appositional na anyo ng Griyego.
- issue: Pagpapakahulugan sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo
  rationale: Ang Χριστός ay titulong nangangahulugang “Mesiyas.” Ang salin ay nagpapakita ng kahulugan ng titulo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metaporang “iisang bibig” at ang pagkakaiba nito sa pagkakaisa ng kalooban; iniwasan ang labis na paliwanag sa pangunahing teksto.
