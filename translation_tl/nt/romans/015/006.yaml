  naturalness: Marangal at madaling maunawaan ang Tagalog. Gayunman, mas natural at mas malinaw ang “may iisang kalooban at sa iisang bibig” kaysa “nang may iisang kalooban at sa iisang bibig,” lalo na sa sugnay na ipinakikilala ng “upang.”
  terminology: Ang “luwalhatiin,” “Diyos at Ama,” “Panginoon,” at “Mesiyas” ay angkop sa modernong Tagalog na may marangal na rehistro. Ang “Jesus na Mesiyas” ay natural na pagsasalin ng pangalang may titulong Ἰησοῦ Χριστοῦ at hindi dapat palitan ng transliterasyong “Jesucristo” sa pangunahing teksto.
