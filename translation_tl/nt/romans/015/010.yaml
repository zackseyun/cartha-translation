  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: tl
  text: At muli, sinasabi niya, “Magalak kayo, mga Hentil[a], kasama ng kanyang bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: muli
  rationale: Sa pormula ng pagsipi sa Kasulatan, natural na ipinakikilala ng πάλιν ang isa pang sipi sa pamamagitan ng “muli.”
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang panahunang pangkasalukuyan ng Griyego, na naglalarawan sa Kasulatan bilang patuloy na nagsasalita. Ang “niya” ay nagpapanatili rin sa personal na anyo ng pahayag nang hindi tahasang pinapangalanan ang di-binanggit na simuno.
- source_word: Εὐφράνθητε
  choice: Magalak kayo
  rationale: Malinaw at marangal na utos ang “magalak kayo,” at natural nitong ipinahahayag ang diwang intransitibo ng aorist passive imperative.
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ng Roma 15, tumutukoy ito sa mga hindi Judio na kasama ng bayan ng Diyos sa pagpuri. Gayunman, maaari rin itong mangahulugang “mga bansa,” kaya inilagay ang alternatibo sa talababa.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: kasama ng kanyang bayan
  rationale: Tuwirang ipinahahayag ng “kasama ng” ang pakikisama o pag-uugnay na tinutukoy ng μετά na may genitive. Pinananatili ng “kanyang bayan” ang pahiwatig na tipan nang hindi idinaragdag sa teksto ang “Israel.”
- source_word: λαοῦ
  choice: bayan
  rationale: Mas natural sa marangal na biblikal na Filipino ang “bayan” para sa isang kolektibong bayang pag-aari ng Diyos. Hindi ito pinalawak bilang “bayang Israel” upang hindi lampasan ang tahasang sinasabi ng Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa ἔθνη sa sipi tungkol sa pagkakaisa ng mga Judio at hindi Judio
  choice: mga Hentil
  alternative: mga bansa
  rationale: Itinatampok ng malapit na konteksto ang paglahok ng mga hindi Judio kasama ng bayan ng Diyos. Ang “mga Hentil” ang pinakamalinaw na nagpapahayag ng puntong ito ni Pablo, samantalang pinananatili sa talababa ang mas malawak na posibleng kahulugang “mga bansa.”
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “magalak” at “bayan” upang mapanatili ang bahagyang mataas na himig ng sipi sa Kasulatan nang hindi nagiging lipas o teknikal.
