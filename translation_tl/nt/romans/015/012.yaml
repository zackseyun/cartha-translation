reference: Romans 15:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: tl
  text: 'At muli, sinasabi ni Isaias:


    “Darating ang ugat ni Jesse,

    ang babangon upang mamuno sa mga bansa;

    sa kanya aasa ang mga bansa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται
  choice: Darating
  rationale: Sa siping ito mula sa Isaias 11:10, ang hinaharap na pag-iral o paglitaw ng ‘Ugat ni Jesse’ ay likas na naipapahayag sa Tagalog bilang ‘darating,’ nang hindi dinaragdagan ang pagkakakilanlan ng tinutukoy.
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: ang Ugat ni Jesse
  rationale: Pinananatili ang metaporang mesianiko at ang pangalang Jesse; ginawang malaking titik ang ‘Ugat’ bilang pantukoy sa isang persona sa kontekstong ito.
- source_word: ὁ ἀνιστάμενος
  choice: siya na babangon
  rationale: Pinananatili ang larawan ng pagbangon o pagtindig at ang participial na paglalarawan, sa halip na tahasang gawing ‘magmumula’ o ‘muling mabubuhay.’
- source_word: ἄρχειν
  choice: upang mamuno
  rationale: 'Tuwirang ipinapahayag ang layunin ng pagbangon: ang pamamahala.'
- source_word: ἐθνῶν / ἔθνη
  choice: mga bansa
  rationale: Ang plural na ethnē ay maaaring tumukoy sa mga bansang hindi Judio o sa mga bansa sa pangkalahatan. Pinili ang mas malawak at hindi mapagpasyang ‘mga bansa,’ habang pinananatili ang pag-uulit.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: sa kanya aasa
  rationale: Natural na Tagalog na nagpapanatili sa personal na layon ng pag-asa at sa aspektong hinaharap.
theological_decisions:
- issue: Ang ugnayan ng ‘Ugat ni Jesse’ at ‘siya na babangon’
  choice: Iniharap bilang magkaugnay na paglalarawan sa iisang persona, ngunit hindi nilagyan ng dagdag na paliwanag gaya ng ‘samakatuwid’ o ‘iyon ay.’
  alternative: 'Gawing tahasang apposition: ‘ang Ugat ni Jesse, iyon ay, ang babangon...’'
  rationale: Ang Griyego ay gumagamit ng καί at participial phrase; mas mainam na panatilihin ang estruktura at huwag higit na ipako ang sintaktikong relasyon kaysa sa source.
- issue: Kahulugan ng ἀνιστάμενος
  choice: ‘babangon’ nang walang tahasang pagtukoy sa muling pagkabuhay
  alternative: ‘muling mabubuhay’
  rationale: Bagaman maaaring magkaroon ng resonansiyang muling pagkabuhay ang pandiwa sa ibang konteksto, dito ang infinitive na ‘upang mamuno’ at ang sipi mula sa Isaias ay hindi nangangailangang ipakahulugan ito nang gayon.
- issue: Saklaw ng ἔθνη
  choice: ‘mga bansa’
  alternative: ‘mga Hentil’
  rationale: Pinananatili ang leksikal na lawak at ang kaugnayan sa sipi ng Isaias, nang hindi nililimitahan agad sa isang teknikal na pangkat.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong patula ng sipi sa pamamagitan ng paghahati sa mga linya. Iniwasan ang teknikal o denominasyonal na pananalita.
