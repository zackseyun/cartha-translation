source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: tl
  text: At ako mismo ay kumbinsido tungkol sa inyo, mga kapatid ko[a], na kayo rin mismo ay puspos ng kabutihan, puno ng lahat ng kaalaman, at may kakayahan ding magpaalalahanan[b] ang isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na isinaling “mga kapatid” ay maaaring tumukoy nang sama-sama sa mga kapwa mananampalataya, kabilang ang mga babae at mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magturuan ang isa’t isa,” “magpayuhan ang isa’t isa,” o “magbabalaan ang isa’t isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: kumbinsido
  rationale: Ipinahahayag ng anyong perpekto ang matatag at nagpapatuloy na katiyakan ni Pablo; natural sa modernong Filipino ang “kumbinsido.”
- source_word: δέ
  choice: At
  rationale: Banayad na paglipat ito, hindi matinding pagsalungat, kaya ang “At” ay angkop sa daloy.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang “mga kapatid” ay natural, marangal, at maaaring tumukoy sa buong pamayanan ng mga mananampalataya, babae man o lalaki.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: ako mismo
  rationale: Pinananatili nito ang diin sa personal na katiyakan ni Pablo nang hindi mabigat ang pananalita.
- source_word: περὶ ὑμῶν
  choice: tungkol sa inyo
  rationale: Tuwiran at natural na katumbas ng περί na may genitive.
- source_word: καὶ αὐτοὶ
  choice: kayo rin mismo
  rationale: Pinananatili ng “rin” ang dagdag na diwa ng καί at ng “mismo” ang diin ng αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: puspos ng kabutihan
  rationale: Ang “puspos” ay natural at marangal na paglalarawan ng pagiging ganap na puno; ang “kabutihan” ay nagpapanatili sa moral na diwa ng ἀγαθωσύνη.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: puno ng lahat ng kaalaman
  rationale: Malapit ito sa malawak na saklaw ng πάσης γνώσεως at hindi nililimitahan ang kahulugan sa isang uri lamang ng kaalaman.
- source_word: δυνάμενοι
  choice: may kakayahan
  rationale: Malinaw nitong ipinahahayag ang kakayahang bunga ng mga katangiang naunang binanggit.
- source_word: ἀλλήλους
  choice: sa isa't isa
  rationale: Karaniwang modernong Filipino para sa tumbasang kilos.
- source_word: νουθετεῖν
  choice: magpaalalahanan
  rationale: Sinasaklaw nito ang pagbibigay ng tagubilin na maaaring may pagtutuwid o babala, at mas napapanatili ang corrective nuance kaysa sa payak na “magturo.”
theological_decisions:
- issue: Saklaw ng ἀδελφοί sa isang haluang kongregasyon
  choice: mga kapatid ko
  alternative: mga kapatid kong lalaki; mga kapatid kong lalaki at babae
  rationale: Sa Filipino, ang “kapatid” ay hindi likas na nakatali sa kasarian at natural na tumutukoy sa buong pamayanan, kaya naipapakita ang kolektibong saklaw nang hindi nagdaragdag ng kasariang hindi tahasang minarkahan sa salin.
- issue: Diwa ng νουθετεῖν
  choice: magpaalalahanan sa isa't isa
  alternative: magturuan sa isa't isa; magbabalaan sa isa't isa; magpayuhan sa isa't isa
  rationale: Maaaring tumukoy ang pandiwa sa pagtuturo, pagpapayo, pagsaway, o pagbababala. Ang “magpaalalahanan” ay nagpapanatili sa nakatutulong ngunit posibleng mapagtuwid na diwa, habang inilalahad sa talababa ang ibang posibleng mga salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “puspos” para sa marangal ngunit pamilyar na biblikal na rehistro, samantalang ang “magpaalalahanan” ay nagpapanatili sa lawak at corrective nuance ng νουθετεῖν.
