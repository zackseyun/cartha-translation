  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: tl
  text: Ngunit, sa ilang bahagi, mas matapang akong sumulat sa inyo[a], bilang muling pagpapaalala sa inyo, dahil sa biyayang ibinigay sa akin ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mas matapang akong sumulat sa inyo, sa ilang bagay.” Maaaring tumukoy ang parirala sa ilang usapin na tinatalakay ni Pablo o sa limitadong saklaw ng kaniyang matapang na pagsulat.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “biyayang ibinigay sa akin ng Diyos” ay kaugnay ng ministeryo o atas na ipinagkaloob ng Diyos kay Pablo, hindi lamang ng biyaya sa pangkalahatang diwa.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: nang may higit na tapang
  rationale: 'Pinananatili ang pahambing na diwa ng pang-abay: mas matapang o mas tahasan ang paraan ng pagsulat ni Pablo.'
- source_word: δὲ
  choice: Gayunman
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pagbaling mula sa naunang papuri nang hindi ginagawang napakatindi ang kontrast.
- source_word: ἔγραψα ὑμῖν
  choice: sumulat ako sa inyo
  rationale: Natural na paraan sa Filipino upang tukuyin ang ginawa ni Pablo sa liham na kasalukuyang binabasa.
- source_word: ἀπὸ μέρους
  choice: sa ilang bahagi
  rationale: Ipinahihiwatig na ang matapang na pagsulat ay tumutukoy sa ilang bahagi o usapin, habang inilalahad sa talababa ang tunay na posibilidad na iba ang saklaw ng parirala.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: upang muli kayong paalalahanan
  rationale: Natural sa modernong Filipino at pinananatili ang diwa ng muling pagpapaalala na taglay ng tambalang pandiwa.
- source_word: διὰ τὴν χάριν
  choice: dahil sa biyaya
  rationale: Ang διά na may akusatibo ay nagpapahayag ng dahilan o batayan; pinananatili ng “biyaya” ang malawak na teolohikal na saklaw ng χάρις.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: ibinigay sa akin ng Diyos
  rationale: Malinaw na ipinakikita ang Diyos bilang gumagawa sa pasibong konstruksyon at pinananatili ang personal na pagkakaloob kay Pablo.
theological_decisions:
- issue: Kahulugan ng χάρις sa konteksto
  choice: Pinanatili sa pangunahing teksto ang “biyaya,” na sa konteksto ay kaugnay ng ministeryo o atas na ipinagkaloob ng Diyos kay Pablo.
  alternative: Isalin nang tahasan bilang “atas” o “ministeryong ipinagkaloob.”
  rationale: Iniuugnay ng kasunod na talata ang biyayang ito sa paglilingkod ni Pablo sa mga Hentil, ngunit mas malawak ang salitang χάρις kaysa sa “atas” lamang. Kaya hindi nilimitahan ang kahulugan sa pangunahing teksto at ipinaliwanag ang kontekstuwal na diwa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayunman” para sa banayad na retorikal na pagbaling, at “nang may higit na tapang” upang mapanatili ang pahambing na anyo nang hindi nagiging kahoy o labis na teknikal ang pananalita.
