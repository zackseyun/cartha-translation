base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: tl
  text: Punuin nawa kayo ng Diyos ng pag-asa ng buong kagalakan at kapayapaan sa inyong pagsampalataya, upang managana kayo sa pag-asa sa pamamagitan ng kapangyarihan ng Banal na Espiritu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Diyos ng pag-asa
  rationale: 'Pinananatili ng pariralang ito ang genitibong Griyego at ang tunay na lawak nito: ang Diyos ay kaugnay ng pag-asa bilang pinagmumulan at saligan nito. Hindi na isinalin nang hiwalay ang banayad na pang-ugnay na δὲ, sapagkat hindi ito tahasang pananda ng panahon o matinding pagsalungat.'
- source_word: πληρώσαι
  choice: Puspusin nawa kayo
  rationale: Ang aorist optative ay panalangin o hangad. Likas sa marangal na modernong Tagalog ang hulma na “Puspusin nawa,” at pinananatili nito ang larawan ng lubos na pagpuno.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: ng buong kagalakan at kapayapaan
  rationale: Ang mga genitibo ang nilalaman ng pagpupuspos. Ipinahahayag ng “buong” ang saklaw ng πάσης nang hindi ipinahihiwatig na maraming magkakahiwalay na uri ng kagalakan.
- source_word: ἐν τῷ πιστεύειν
  choice: habang sumasampalataya kayo
  rationale: Pinananatili ang pandiwang diwa ng πιστεύειν at ipinapakita ang kalagayan o pangyayaring kasabay ng pagpupuspos. Mas natural ito sa Tagalog kaysa sa literal na “sa pagsampalataya.”
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: upang managana kayo
  rationale: Ang εἰς τό kasama ng infinitive ay maaaring magpahayag ng layunin o kinalabasan. Ang “upang” ay angkop sa konteksto ng panalangin, at ang “managana” ay malinaw na nagsasaad ng kasaganaan.
- source_word: ἐν τῇ ἐλπίδι
  choice: sa pag-asa
  rationale: Pinananatili ang leksikal na ugnayan sa naunang “Diyos ng pag-asa” at ang larangan kung saan sila mananagana.
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: sa pamamagitan ng kapangyarihan ng Banal na Espiritu
  rationale: 'Malinaw na ipinahahayag ng “sa pamamagitan ng” ang instrumental na diwa: ang kapangyarihan ng Banal na Espiritu ang paraan ng kanilang pananagana sa pag-asa.'
theological_decisions:
- issue: Kahulugan ng θεὸς τῆς ἐλπίδος
  choice: Diyos ng pag-asa
  alternative: Diyos na pinagmumulan ng pag-asa
  rationale: Mas pinananatili ng “Diyos ng pag-asa” ang maikli at sadyang malawak na genitibong pahayag ng Griyego; ang mas paliwanag na alternatibo ay maaaring magtakda lamang sa Diyos bilang pinagmumulan at paliitin ang iba pang posibleng ugnayan.
- issue: Pagkilala sa πνεύματος ἁγίου
  choice: Banal na Espiritu
  alternative: banal na espiritu
  rationale: Sa kontekstong Paulino, tumutukoy ito sa kinikilalang Banal na Espiritu. Ang malaking titik ay malinaw na nagtuturo sa referent nang hindi nagdaragdag ng pahayag na wala sa talata.
- issue: Layunin o kinalabasan sa εἰς τὸ περισσεύειν
  choice: upang managana kayo
  alternative: kaya mananagana kayo
  rationale: Ang konstruksiyon ay maaaring saklawin ang layunin at inaasahang kinalabasan. Sa anyo ng panalangin, ang “upang” ay likas at hindi nito ginagawang tiyak na pahayag ang hinihiling na bunga.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “puspusin,” “sumasampalataya,” at “managana” bilang pamilyar na mga salitang panrelihiyon na nananatiling malinaw sa karaniwang mambabasa. Iniwasan ang labis na pagpapaliwanag sa mismong teksto upang mapanatili ang ikli, ritmo, at teolohikal na lawak ng Griyego.
