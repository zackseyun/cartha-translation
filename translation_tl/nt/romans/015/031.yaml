id: ROM.15.31
reference: Romans 15:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: tl
  text: upang mailigtas ako mula sa mga sumusuway sa Judea[a], at upang ang paglilingkod ko para sa Jerusalem ay maging katanggap-tanggap sa mga banal,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga hindi sumasampalataya sa Judea.” Ang salitang Griyego ay maaaring mangahulugang tumatangging maniwala, at dahil dito ay sumusuway.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang ... at upang
  rationale: Ipinakikita ang layunin ng kahilingan ni Pablo na ipanalangin siya at malinaw na iniuugnay ang dalawang sugnay na nasa ilalim ng iisang ἵνα.
- source_word: ῥυσθῶ
  choice: mailigtas ako
  rationale: Likas na salin sa modernong Tagalog para sa pagliligtas mula sa panganib; pinananatili ang balintiyak at ang diwa ng panalangin.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: mula sa mga sumusuway
  rationale: Sinasaklaw ng 'sumusuway' ang pagtangging maniwala o magpasakop nang hindi nililimitahan ang salita sa intelektuwal na kawalan ng paniniwala lamang.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: sa Judea
  rationale: Karaniwang makabagong anyo ng pangalan ng lugar sa Filipino.
- source_word: διακονία
  choice: paglilingkod
  rationale: Pinananatili ang malawak na diwa ng paglilingkod habang akma sa kongkretong tungkulin ni Pablo kaugnay ng handog para sa Jerusalem.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: para sa Jerusalem
  rationale: Likas na Filipino para sa paglilingkod na nakatuon o patungo sa Jerusalem.
- source_word: εὐπρόσδεκτος
  choice: kalugod-lugod
  rationale: Ipinahahayag ang pagiging kanais-nais at malugod na tinatanggap, hindi lamang ang teknikal na pagiging katanggap-tanggap.
- source_word: τοῖς ἁγίοις
  choice: sa mga banal
  rationale: Pinananatili ang karaniwang katawagan ni Pablo sa mga mananampalataya at ang teolohikal na bigat ng 'mga banal.'
- source_word: γένηται
  choice: maging
  rationale: Natural na ipinahahayag sa Filipino ang inaasahang pagdating sa kalagayang kalugod-lugod o katanggap-tanggap.
theological_decisions:
- issue: Kahulugan ng ἀπειθούντων patungkol sa mga kalaban ni Pablo sa Judea
  choice: mga sumusuway
  alternative: mga hindi sumasampalataya
  rationale: Maaaring tumukoy ang participle sa pagtangging maniwala at sa kaakibat nitong pagsuway. Pinananatili ng pangunahing salin ang mas malawak na saklaw, habang inilalagay sa talababa ang mahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'paglilingkod' sa halip na mas institusyonal na 'ministeryo,' at pinanatili ang katawagang Paulino na 'mga banal.'
