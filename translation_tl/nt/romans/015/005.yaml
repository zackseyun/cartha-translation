id: ROM.15.5
reference: Romans 15:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: tl
  text: Ipagkaloob nawa sa inyo ng Diyos ng pagtitiis at pagpapalakas-loob na magkaroon kayo ng iisang kaisipan sa isa’t isa[a], ayon kay Mesias Jesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magkatulad ang pag-iisip” o “magkaisa ng pag-iisip.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ayon kay Mesias Jesus”; ang “Mesias” ang kahulugan ng titulong Χριστός.
    reason: title_clarification
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: ng Diyos
  rationale: Ang δέ ay mahinang pang-ugnay at hindi kailangang tumbasan ng tahasang salitang panimula sa Filipino; ang puwersa ng panalanging δῴη ay ipinahahayag ng “Ipagkaloob nawa.”
- source_word: τῆς ὑπομονῆς
  choice: ng pagtitiis
  rationale: Ang “pagtitiis” ay likas na Filipino para sa matatag na pananatili sa gitna ng hirap, hindi lamang pasibong paghihintay.
- source_word: τῆς παρακλήσεως
  choice: at pagpapalakas-loob
  rationale: Saklaw nito ang suportang nagbibigay-tatag na tinutukoy ng παράκλησις sa konteksto, habang hindi ito nililimitahan sa aliw lamang o sa pangangaral.
- source_word: δῴη
  choice: Ipagkaloob nawa
  rationale: Pinananatili ng “nawa” ang puwersa ng optatibo bilang panalangin o hangarin, at marangal ngunit nauunawaan ang “ipagkaloob.”
- source_word: τὸ αὐτὸ φρονεῖν
  choice: magkaroon kayo ng iisang kaisipan
  rationale: Tinutukoy ng φρονεῖν ang pag-iisip, pananaw, o disposisyon. Malapit sa Griyego ang parirala nang hindi ipinipilit na dapat magkapareho ang bawat opinyon.
- source_word: ἐν ἀλλήλοις
  choice: sa isa’t isa
  rationale: Pinananatili nito ang mutuwal at pangkomunidad na saklaw ng panawagan, bagaman sadyang maluwag ang ugnayang ipinahihiwatig ng Griyegong ἐν.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: ayon kay Mesias Jesus
  rationale: Ipinahahayag ng κατά ang pagsang-ayon o pag-ayon sa isang pamantayan. Isinalin ang Χριστός bilang titulong “Mesias,” hindi bilang apelyido.
theological_decisions:
- issue: Kahulugan ng τὸ αὐτὸ φρονεῖν
  choice: iisang kaisipan
  alternative: magkatulad na pag-iisip; magkaisa ng pag-iisip
  rationale: Pinananatili ang panawagan sa nagkakaisang pananaw o disposisyon, ngunit hindi dinaragdagan ng pahayag na kailangang maging pareho ang lahat ng opinyon.
- issue: Pag-render sa Χριστός
  choice: Mesias Jesus
  alternative: Cristo Jesus
  rationale: Aktibo rito ang kahulugan ng Χριστός bilang titulo; kaya isinasalin itong “Mesias” upang mapanatili ang mesiyanikong diwa.
- issue: Ugnayan ng mga genitibong τῆς ὑπομονῆς καὶ τῆς παρακλήσεως sa Diyos
  choice: Diyos ng pagtitiis at pagpapalakas-loob
  alternative: Diyos na pinagmumulan ng pagtitiis at pagpapalakas-loob
  rationale: Ang mas maikling anyo ay nagpapanatili sa pormal at bahagyang bukas na ugnayan ng Griyego; hindi nito tahasang nililimitahan ang Diyos sa pagiging pinagmumulan lamang, bagaman iyon ang malamang na diwa sa konteksto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “Ipagkaloob nawa” ay angkop sa panalangin o pagpapala; ang “pagpapalakas-loob” ay karaniwang nauunawaan at mas malawak kaysa “kaaliwan.” Pinanatili ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
