  source_fidelity: Tapat ang salin sa panalanging optatibo ng δῴη sa “Ipagkaloob nawa,” sa mga genitibong “Diyos ng pagtitiis at pagpapalakas-loob,” at sa panawagan sa magkakatulad na pag-iisip na naaayon kay Mesias Jesus. Hindi nito pinalalakas ang τὸ αὐτὸ φρονεῖν tungo sa ganap na pagkakapareho sa lahat ng opinyon.
