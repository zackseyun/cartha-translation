  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: tl
  text: At alam kong kapag pumunta ako sa inyo, darating akong taglay ang buong pagpapala ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Cristo.”
    reason: Alternatibong pagsasalin ng titulong Griego na Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: alam ko
  rationale: Tuwirang ipinapahayag ng οἶδα ang tiyak na kaalaman ni Pablo; pinananatili ng “alam ko” ang kaniyang pagtitiwala nang hindi ito pinahihina bilang opinyon lamang.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ang δέ rito na nagpapatuloy sa daloy ng sinabi ni Pablo; natural sa Filipino ang “At” at hindi ito lumilikha ng di-kinakailangang pagsalungat.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: pagpunta ko sa inyo
  rationale: Ang participle ay may temporal na kaugnayan sa pandiwang panghinaharap; malinaw at likas sa Filipino ang “pagpunta ko sa inyo.”
- source_word: ἐλεύσομαι
  choice: darating ako
  rationale: Ang future form ng ἔρχομαι ay tuwirang tumutukoy sa darating na pagdating ni Pablo; ang “darating ako” ang pinakanatural na katumbas sa konteksto.
- source_word: ἐν πληρώματι
  choice: taglay ang buong
  rationale: Maaaring ipahiwatig ng ἐν ang kalagayan o kasamang taglay sa pagdating. Ipinananatili ng “taglay ang buong” ang diwa ng kasapatan o kapuspusan nang mas natural kaysa sa literal na “sa kapuspusan.”
- source_word: εὐλογίας
  choice: pagpapala
  rationale: Ang εὐλογία rito ay tumutukoy sa pagpapalang nagmumula o nauugnay sa Mesiyas; malinaw at karaniwan ang “pagpapala.”
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran. Pinananatili ng “Mesiyas” ang tungkulin nito bilang titulo sa kontekstong ito.
theological_decisions:
- issue: Pagkakasalin ng Χριστοῦ
  choice: ng Mesiyas
  alternative: ni Cristo
  rationale: Ginagamit dito ang Χριστός bilang kristolohikal na titulo. Ang “Mesiyas” ay naghahayag ng kahulugan ng titulo, samantalang ang “Cristo” ay tradisyonal ding anyo; inilalahad ang alternatibo sa talababa nang hindi binabago ang kahulugan ng pangungusap.
- issue: Kaugnayan ng pagpapala sa Χριστοῦ
  choice: pagpapala ng Mesiyas
  alternative: pagpapalang mula sa Mesiyas
  rationale: Maaaring tukuyin ng genitive ang pinagmulan o malapit na kaugnayan ng pagpapala sa Mesiyas. Pinananatili ng mas pormal na “ng Mesiyas” ang saklaw ng posibleng kahulugan sa halip na ipako lamang ito sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taglay ang buong pagpapala” upang maipahayag nang likas ang ἐν πληρώματι εὐλογίας habang nananatili ang diwa ng kabuuan o kapuspusan. Inilagay ang [a] pagkatapos ng “Mesiyas” dahil iyon ang mismong salitang tinutukoy ng talababa.
