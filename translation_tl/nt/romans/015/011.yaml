reference: Romans 15:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: tl
  text: 'At muli:


    “Purihin ninyo ang Panginoon[a], lahat kayong mga bansa[b];

    at purihin siya ng lahat ng mga bayan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “PANGINOON,” ayon sa Hebreong pinagmulan ng sipi, kung saan ang banal na pangalan ay kinakatawan sa Griyego ng κύριος (“Panginoon”).
    reason: alternative_reading
  - marker: b
    text: O “mga Hentil.” Ang Griyegong ἔθνη ay maaaring mangahulugang “mga bansa” o “mga Hentil.” Pangkalahatan ang diwa ng sipi rito, ngunit ang “mga Hentil” ay angkop din sa argumento ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: At muli
  rationale: Likas na panandang nag-uugnay at nagpapakilala sa isa pang sipi sa magkakasunod na patunay mula sa Kasulatan.
- source_word: Αἰνεῖτε
  choice: Purihin ninyo
  rationale: Tuwirang isinasalin ang pangmaramihang pautos at malinaw na tinutukoy ang mga kinakausap.
- source_word: πάντα τὰ ἔθνη
  choice: lahat kayong mga bansa
  rationale: Pinananatili ang malawak at pangkalahatang diwa ng ἔθνη sa sipi, habang ang salitang “kayong” ay likas na naghahayag sa Filipino na tuwirang kinakausap ang mga bansa.
- source_word: τὸν κύριον
  choice: ang Panginoon
  rationale: Karaniwang katumbas ng κύριος sa Bagong Tipan at tapat sa anyo ng tekstong Griyego; nilalagyan ng talababa ang kaugnayan nito sa banal na pangalan sa Hebreong pinagmulan.
- source_word: ἐπαινεσάτωσαν
  choice: purihin
  rationale: Kasama ng “ng lahat ng mga bayan,” natural nitong ipinahahayag sa Filipino ang pangatlong panauhang pangmaramihang pautos.
- source_word: αὐτὸν
  choice: siya
  rationale: Malinaw na tumutukoy pabalik sa Panginoon nang hindi inuulit nang di-kailangan ang pangngalan.
- source_word: πάντες οἱ λαοί
  choice: lahat ng mga bayan
  rationale: Pinananatili ang pagkakaiba ng λαοί sa ἔθνη sa pamamagitan ng “mga bayan” sa halip na ulitin ang “mga bansa.”
theological_decisions:
- issue: Paglilipat ng κύριος sa isang sipi mula sa Lumang Tipan na tumutukoy sa Diyos ng Israel
  choice: ang Panginoon
  alternative: ang PANGINOON
  rationale: Ang “Panginoon” ang tuwirang katumbas ng Griyegong κύριος sa tekstong sipi ni Pablo. Gayunman, mahalaga ang “PANGINOON” bilang paglalarawan sa banal na pangalan sa Hebreong pinagmulan, kaya iningatan ito sa talababa.
- issue: Kahulugan ng ἔθνη sa konteksto ng pagsasama sa mga Hentil
  choice: lahat kayong mga bansa
  alternative: lahat kayong mga Hentil
  rationale: Ang sipi mismo ay may pangkalahatang panawagan sa lahat ng bansa. Kasabay nito, maaaring mangahulugan ang ἔθνη ng “mga Hentil,” na mahalaga sa argumento ni Pablo, kaya iningatan ang alternatibo sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lahat kayong mga bansa” upang maging natural ang tuwirang panawagan, at “mga bayan” upang mapanatili ang leksikal na pagkakaiba at paralelismo ng Griyego.
