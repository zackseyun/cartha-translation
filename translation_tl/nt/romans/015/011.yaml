  source_fidelity: 'Tapat ang salin sa Griyego: ang “At muli” ay tumutugon sa καὶ πάλιν bilang pagpapakilala ng isa pang sipi; ang “Purihin ninyo” ay nagpapanatili ng pangmaramihang pautos ng Αἰνεῖτε; at ang “purihin siya ng lahat ng mga bayan” ay maayos na naghahayag ng panawagang papuri sa ikatlong panauhang maramihan. Napananatili rin ang natatanging “mga bansa” para sa ἔθνη at “mga bayan” para sa λαοί.'
  naturalness: Likas, malinaw, at marangal ang modernong Filipino. Ang “lahat kayong mga bansa” ay angkop na tuwirang panawagan sa mga bansa, at ang balangkas ng sipi ay madaling basahin bilang tula o panambitan.
