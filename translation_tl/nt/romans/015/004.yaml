  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: tl
  text: Sapagkat anumang isinulat noon ay isinulat upang turuan tayo, nang sa pamamagitan ng pagtitiis at ng pagpapalakas ng loob mula sa mga Kasulatan[a] ay magkaroon tayo ng pag-asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaaliwan mula sa mga Kasulatan” o “pagpapayo mula sa mga Kasulatan.” Ang παράκλησις ay maaaring mangahulugang pagpapalakas ng loob, kaaliwan, o pagpapayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang malawak at saklaw-lahat na diwa ng panghalip na neuter plural, at natural itong pakinggan sa Filipino.
- source_word: προεγράφη
  choice: isinulat noong una
  rationale: Pinananatili nito ang temporal na diwa ng προ- at malinaw na tumutukoy sa mga naunang isinulat, hindi sa hayagang pagpapaskil.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: upang turuan tayo
  rationale: Natural na Filipino ito para sa layuning ipinahahayag ng εἰς; naihahatid nito ang mapaglinang na diwa ng διδασκαλία nang hindi mabigat o teknikal.
- source_word: ἐγράφη
  choice: ay isinulat
  rationale: Inuulit ang pandiwang “isinulat” gaya ng Griyego upang mapanatili ang retorikal na diin.
- source_word: ἵνα
  choice: nang
  rationale: Malinaw at natural na panandang Filipino para sa layunin o nilalayong bunga.
- source_word: διὰ τῆς ὑπομονῆς
  choice: sa pamamagitan ng pagtitiis
  rationale: Ang “pagtitiis” ay tumutukoy sa matatag at matiising pananatili sa gitna ng hirap, na angkop sa ὑπομονή.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: ng pagpapalakas ng loob mula sa mga Kasulatan
  rationale: Ipinahahayag ng “pagpapalakas ng loob” ang pangunahing diwa ng παράκλησις sa konteksto ng pag-asa; ang “mula sa” ay likas sa Filipino at nagpapakitang ang mga Kasulatan ang pinagmumulan nito nang hindi labis na nilulutas ang ugnayang genitive.
- source_word: τῶν γραφῶν
  choice: mga Kasulatan
  rationale: Sa gamit ni Pablo, tumutukoy ito sa mga kinikilalang banal na kasulatan; ang malaking titik ay nagpapakita ng kinikilalang reperente.
- source_word: τὴν ἐλπίδα
  choice: pag-asa
  rationale: Natural sa Filipino ang pangngalang walang tiyak na pantukoy rito at napapanatili ang abstraktong diwa.
- source_word: ἔχωμεν
  choice: magkaroon tayo
  rationale: Ang anyong ito ay natural na naghahatid ng layunin ng subjunctive pagkatapos ng ἵνα, nang hindi nagdaragdag ng di-kinakailangang pag-aalinlangan.
theological_decisions:
- issue: Papel ng mga Kasulatan sa pagkakaroon ng pag-asa
  choice: Ang mga naunang isinulat ay para sa pagtuturo sa atin, at sa pamamagitan ng pagtitiis at pagpapalakas ng loob na nagmumula sa mga Kasulatan ay nagkakaroon tayo ng pag-asa.
  alternative: Maaaring unawain ang pagtitiis at pagpapalakas ng loob bilang mga katangiang inilalarawan o ibinibigay ng mga Kasulatan, sa halip na ang “mula sa mga Kasulatan” ay iugnay lamang sa pagpapalakas ng loob.
  rationale: Hindi lubusang nililinaw ng pagkakasunod ng Griyego ang eksaktong saklaw ng genitive. Pinananatili ng salin ang malapit na ugnayan nito sa “pagpapalakas ng loob” habang hindi ikinakaila ang mas malawak na papel ng mga Kasulatan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Kasulatan” bilang karaniwang katawagan sa banal na mga sulatin, at iniwasan ang teknikal o denominasyonal na pananalita.
