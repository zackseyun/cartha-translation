  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: tl
  text: Sapagkat minabuti ng Macedonia at Acaya na magbigay ng isang ambag para sa mga mahihirap na kabilang sa mga banal na nasa Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbahagi”; idiniriin ng pananalitang Griyego ang pakikibahagi o pakikipagkaisang ipinapahayag sa pamamagitan ng materyal na ambag.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: minabuti
  rationale: Ipinapahayag nito kapwa ang kusang pagpapasya at ang pagsang-ayon o kasiyahan, nang hindi ginagawang simpleng utos o obligasyon ang pagkilos.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Macedonia at Acaya
  rationale: Pinananatili ang mga pangalan ng rehiyon bilang mga simuno, gaya sa Griyego, na metonimikong tumutukoy sa mga pamayanang Cristiano roon.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: magbigay ng tulong
  rationale: Sa konteksto ng koleksiyon, tumutukoy ang parirala sa materyal na ambag na nagpapahayag ng pakikibahagi. Likas sa modernong Tagalog ang 'magbigay ng tulong'; inilalahad sa talababa ang mas literal na diwa ng pakikibahagi.
- source_word: εἰς τοὺς πτωχοὺς
  choice: para sa mga dukha
  rationale: Ipinapakita ng εἰς ang layunin o kapakinabangan, at pinananatili ng 'mga dukha' ang substantibong pang-uri.
- source_word: τῶν ἁγίων
  choice: sa mga banal
  rationale: Ipinakikita ng parirala na ang mga dukha ay kabilang sa pangkat ng mga banal; ang 'mga banal' ay tuwirang salin ng karaniwang tawag ni Pablo sa mga mananampalataya.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: na nasa Jerusalem
  rationale: Malinaw nitong iniuugnay ang lokasyon sa 'mga banal,' alinsunod sa kayarian ng Griyego.
theological_decisions:
- issue: Pagpapakahulugan sa ἅγιοι sa kontekstong Paulino
  choice: mga banal
  alternative: bayan ng Diyos; mga mananampalataya
  rationale: Pinananatili ng 'mga banal' ang susing terminong Paulino at ang pagkakakilanlan ng buong pamayanan, nang hindi ipinapasok ang diwa ng pormal na kanonisasyon.
- issue: Diwa ng κοινωνία bilang materyal na ambag
  choice: tulong, na may talababa tungkol sa pakikibahagi
  alternative: ambag; pakikibahagi
  rationale: Malinaw sa konteksto ang materyal na tulong, ngunit hindi dapat mawala ang mas malalim na diwa ng κοινωνία bilang pakikibahagi; kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga pangalang heograpiko bilang mga simuno at ang katawagang Paulino na 'mga banal.'
