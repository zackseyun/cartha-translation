  terminology: Ang “mga banal” ay angkop na salin ng ἅγιοι sa sulat ni Pablo. Pinanatili ang Macedonia at Acaya bilang metonimikong mga simuno. Ang talababa ay inayos upang maging likas na Tagalog at upang maipakita ang aspektong pakikibahagi ng κοινωνία nang hindi ipinapakahulugang isang teknikal na termino.
