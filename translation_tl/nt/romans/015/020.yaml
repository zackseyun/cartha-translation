  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: tl
  text: At pinagsisikapan kong ipahayag ang magandang balita, hindi sa mga lugar kung saan naipahayag na ang Mesiyas, upang hindi ako magtayo sa pundasyon ng iba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως δὲ
  choice: At sa ganitong paraan
  rationale: Pinananatili ang banayad na pag-uugnay sa naunang paglalarawan ni Pablo ng kaniyang ministeryo at ang kahulugang “sa ganitong paraan.”
- source_word: φιλοτιμούμενον
  choice: hangad kong
  rationale: Likas sa modernong Tagalog at malinaw na nagpapahayag ng masigasig at kusang layunin o ambisyon ni Pablo.
- source_word: εὐαγγελίζεσθαι
  choice: ipahayag ang magandang balita
  rationale: Pinananatili ang pandiwang diwa ng paghahayag at mas madaling maunawaan kaysa sa isang teknikal na katawagang pansimbahan.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: hindi sa mga lugar na naipakilala na ang Mesiyas
  rationale: Ang “naipakilala” ay naghahatid ng kontekstuwal na diwa na si Mesiyas ay naipahayag at nakilala na roon, samantalang ang “na” ay nagpapahiwatig ng naunang gawain nang hindi labis na nagpapaliwanag.
- source_word: Χριστός
  choice: ang Mesiyas
  rationale: Dito, ang Χριστός ay gumaganap bilang titulo ng ipinahahayag na persona; ang “Mesiyas” ay nagpapanatili sa titulong diwa.
- source_word: ἵνα μὴ
  choice: upang hindi ako
  rationale: Malinaw na ipinapahayag ang negatibong layunin ng sugnay.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: magtayo sa pundasyong inilagay ng iba
  rationale: Pinananatili ang larawang panggusali at nililinaw sa natural na Tagalog na ang pundasyon ay bunga ng naunang gawain ng ibang manggagawa, nang hindi nagdaragdag ng kasariang wala sa Griyego.
theological_decisions:
- issue: Pag-render sa Χριστός
  choice: ang Mesiyas
  alternative: si Cristo
  rationale: Sa kontekstong ito, tumutukoy ang salita sa titulo ng Isa na ipinahahayag, kaya pinili ang “Mesiyas” sa halip na ang mas pangalang anyong “Cristo.”
- issue: Saklaw ng simulain ni Pablo sa ministeryo
  choice: Inilahad bilang personal na hangarin ni Pablo
  alternative: Isang pangkalahatang pagbabawal sa paglilingkod sa mga lugar na naipahayag na si Mesiyas
  rationale: Ang anyong unang panauhan at ang pandiwa ng paghahangad ay naglalarawan ng estratehiya ni Pablo, hindi ng tahasang utos para sa lahat.
- issue: Kahulugan ng ὠνομάσθη
  choice: naipakilala na
  alternative: nabanggit na ang pangalan
  rationale: Sa konteksto ng gawaing misyonero, malamang na tumutukoy ito sa naunang pagpapahayag at pagkakilala kay Mesiyas. Gayunman, hindi ito pinalawak upang tukuyin kung gaano kalawak ang naunang pagtanggap.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang di-likas na literalismong “kung saan hindi pinangalanan” at ang pagdaragdag ng “tao/lalaki” na wala sa Griyego; pinanatili ang metapora ng pundasyon.
