  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: tl
  text: Ngunit ngayon, wala na akong puwang[a] sa mga lupaing ito, at maraming taon na akong nananabik na makarating sa inyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkakataon.” Maaaring tumukoy ang salitang Griyego sa kawalan na ng natitirang saklaw para sa kanyang gawain sa mga lupaing iyon, hindi sa kawalan ng literal na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Likas na inililipat ang diwa sa kasalukuyang kalagayan ni Pablo habang pinananatili ang bahagyang pagsalungat ng δέ.
- source_word: μηκέτι τόπον ἔχων
  choice: wala na akong puwang
  rationale: Ipinahahayag ng μηκέτι ang pagtigil ng dating kalagayan, at pinananatili ng “puwang” ang metaporikal na lawak o pagkakataon para sa gawain nang hindi ito lubusang ipinapaliwanag sa pangunahing teksto.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: sa mga lupaing ito
  rationale: Ang κλίματα ay tumutukoy sa malalawak na heograpikong pook o rehiyon; natural at malinaw sa modernong Filipino ang “mga lupain.”
- source_word: ἐπιποθίαν ... ἔχων
  choice: nananabik
  rationale: Natural na pandiwang Filipino para sa matinding pagnanais ng ἐπιποθία, at ang aspektong di-ganap ay angkop sa pagnanais na nagpapatuloy sa loob ng maraming taon.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: na makarating sa inyo
  rationale: Direktang inilalahad ang nilalaman ng pananabik at hindi idinaragdag ang mas tiyak na konsepto ng pagdalaw.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: maraming taon na
  rationale: Karaniwang paraang Filipino upang ipahayag ang tagal mula sa nakaraan hanggang sa kasalukuyan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Pinanatili ang anyong di-tapos ng pangungusap dahil nagpapatuloy ang sintaks sa kasunod na talata. Ang ikalawang δέ ay isinalin sa “at” upang maging natural sa Filipino habang naipapakita ang paglipat mula sa kawalan ng puwang tungo sa matagal nang pananabik.
