  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: tl
  text: Tayong malalakas ay dapat pasanin ang mga kahinaan ng mahihina[a], at huwag bigyang-kasiyahan ang ating sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagkukulang ng mahihina.” Ang salitang Griyego ay maaaring tumukoy sa mga kahinaan, limitasyon, o pagkukulang; dito, malamang na tumutukoy ito sa mga paghihigpit o limitasyon ng budhi na tinalakay sa naunang kabanata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: ay dapat
  rationale: Ipinahahayag ang pananagutang moral at ang tonong mapagpayo ng pangungusap nang hindi ginagawang tahasang pautos ang anyong Griyego.
- source_word: δὲ
  choice: hindi tahasang isinalin
  rationale: Mahinang panandang pangdiskurso ito; natural sa Tagalog na ipahiwatig ang paglipat sa daloy ng konteksto kaysa lagyan ng “ngayon” o “ngunit,” na maaaring magdagdag ng di-angkop na temporal o mariing panalungat na diwa.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: tayo na malalakas
  rationale: Pinananatili ang mariing panghalip at ang pagtutukoy sa mga “malalakas” sa budhi o pananampalataya ayon sa konteksto ng Roma 14–15.
- source_word: τὰ ἀσθενήματα
  choice: mga kahinaan
  rationale: Malawak at di-mapanghusgang katumbas na maaaring tumukoy sa mga limitasyon o pagkukulang, lalo na sa mga pag-aalinlangan ng budhi sa konteksto.
- source_word: τῶν ἀδυνάτων
  choice: ng mahihina
  rationale: Pinananatili ang tuwirang paghahambing ng malalakas at mahihina; sa konteksto, hindi ito pangunahing tumutukoy sa pisikal na lakas.
- source_word: βαστάζειν
  choice: magdala
  rationale: Pinananatili ang metapora ng pagpasan o pagdadala sa pasanin ng iba, sa halip na gawing simpleng pagtitiis lamang.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: at huwag ang sarili natin ang bigyang-kasiyahan
  rationale: Natural na Tagalog na malinaw na ipinakikitang hindi pansariling kagustuhan o kasiyahan ang dapat unahin.
theological_decisions:
- issue: Kahulugan ng “malalakas” at “mahihina”
  choice: Pangunahing tumutukoy sa mga mananampalatayang magkakaiba ang kalayaan o tibay ng budhi sa usaping tinalakay sa Roma 14.
  alternative: Mga makapangyarihan laban sa mahihina sa lipunan, o mga malakas laban sa mahina ang katawan.
  rationale: Ang agarang konteksto ay ang mga pagtatalo tungkol sa pagkain at mga araw; kaya ang panawagan ay tanggapin at alalayan ang mga kapatid na mas mahigpit o limitado ang budhi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang inklusibong “tayo” dahil kabilang ni Pablo ang sarili niya sa mga malalakas. Iniwasan ang “pagbigyan ang sarili,” na maaaring magpahiwatig lamang ng pagpapakasasa, upang mapanatili ang mas malawak na etikal na diwa ng ἀρέσκειν.
