  source_fidelity: Tumpak ang pangunahing diwa at napapanatili ang obligasyong moral, ang paghahambing ng malalakas at mahihina, at ang diwang hindi pag-uuna sa sarili. Gayunman, ang "magdala ng mga kahinaan" ay hindi likas na katumbas ng metaporang βαστάζειν sa ganitong gamit; mas tumpak ang "pasanin."
  naturalness: 'May ilang hindi gaanong natural na ayos: "Tayo na malalakas" ay mas idiomatikong "Tayong malalakas," at "huwag ang sarili natin ang bigyang-kasiyahan" ay mabigat at hindi karaniwang Tagalog. Ang binagong anyo ay malinaw, marangal, at natural sa modernong Filipino.'
  terminology: Ang "malalakas" at "mahihina" ay angkop at pinananatili ang terminolohiya ng konteksto. Ang "mga kahinaan" ay sapat na malawak at di-mapanghusga. Sa talababa, ang "pag-aalinlangan" ay maaaring magmungkahi ng pagdududa; ang konteksto ng Roma 14 ay mas mabuting ilarawan bilang mga paghihigpit o limitasyon ng budhi.
  issues:
  - severity: medium
    issue: Hindi natural ang "magdala ng mga kahinaan."
    rationale: Ang βαστάζειν ay larawan ng pagdadala o pagpasan ng pasanin ng iba. Sa Filipino, "pasanin ang mga kahinaan" ang likas na pagpapahayag at mas malinaw na iniiwasan ang kahulugang simpleng pagdadala ng isang bagay.
  - severity: medium
    issue: Mabigat at di-idiomatiko ang "huwag ang sarili natin ang bigyang-kasiyahan."
    rationale: Mas natural at tuwirang isinasalin ng "at huwag bigyang-kasiyahan ang ating sarili" ang infinitival na καὶ μὴ ἑαυτοῖς ἀρέσκειν nang hindi binabago ang saklaw nito.
  - severity: low
