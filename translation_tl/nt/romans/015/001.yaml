    rationale: Ang "Tayong malalakas" ay karaniwang anyo para sa ἡμεῖς οἱ δυνατοὶ. Ang "mga paghihigpit o limitasyon ng budhi" ay mas akma sa konteksto kaysa "mga pag-aalinlangan."
