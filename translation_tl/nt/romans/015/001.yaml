- from: Tayo na malalakas ay dapat magdala ng mga kahinaan ng mahihina[a], at huwag ang sarili natin ang bigyang-kasiyahan.
  to: Tayong malalakas ay dapat pasanin ang mga kahinaan ng mahihina[a], at huwag bigyang-kasiyahan ang ating sarili.
  rationale: Inayos ang mga parirala upang maging natural na modernong Filipino habang pinananatili ang metapora ng pagpasan, ang moral na obligasyon ng ὀφείλομεν, at ang malawak na etikal na diwa ng hindi pagbibigay-kasiyahan sa sarili. Hindi isinalin nang hiwalay ang mahina at pangdiskursong δέ, sapagkat sapat na ang daloy ng pangungusap sa Filipino at walang idinagdag na temporal o mariing panalungat na kahulugan.
