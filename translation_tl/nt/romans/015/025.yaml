base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: tl
  text: Ngunit ngayon ay pupunta ako sa Jerusalem upang maglingkod sa mga banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang naglilingkod sa mga banal” o “upang maghatid ng tulong sa mga banal.” Ang salitang Griyego ay maaaring tumukoy sa praktikal na paglilingkod; dito, malamang na tinutukoy nito ang pagdadala ni Pablo ng nalikom na tulong para sa mga mananampalataya sa Jerusalem (tingnan ang Roma 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Ipinahahayag ng νυνί ang kasalukuyang panahon nang may diin, samantalang ang δέ ay banayad na panalungat o transisyon. Likas na pinananatili ng “Ngunit ngayon” ang dalawang diwa.
- source_word: πορεύομαι
  choice: pupunta ako
  rationale: Sa konteksto, ipinahahayag ng kasalukuyang anyo ang nalalapit na paglalakbay o matatag na balak ni Pablo. Mas natural sa modernong Tagalog ang “pupunta ako” kaysa “ako ay pumaparoon,” nang hindi idinaragdag na nagsimula na ang biyahe.
- source_word: εἰς Ἰερουσαλὴμ
  choice: sa Jerusalem
  rationale: Ang εἰς na kasama ng pangalan ng lungsod ay tumutukoy sa patutunguhan. Karaniwang Tagalog ang “sa Jerusalem” para sa pagpunta roon.
- source_word: διακονῶν
  choice: upang maglingkod
  rationale: Ang participle ay maaaring maglahad ng layunin o kalagayang kaugnay ng pagpunta. Ang “upang maglingkod” ay malinaw at natural, pinananatili ang praktikal na diwa ng paglilingkod nang hindi ito ginagawang titulo o katungkulan.
- source_word: τοῖς ἁγίοις
  choice: sa mga banal
  rationale: Karaniwang tawag ito ni Pablo sa mga mananampalataya bilang mga itinalaga sa Diyos. Pinananatili ng “mga banal” ang leksikal at teolohikal na anyo ng Griyego, sa halip na agad itong ipaliwanag bilang “mga mananampalataya” o “bayan ng Diyos.”
theological_decisions:
- issue: Ang tinutukoy ng “mga banal”
  choice: Pinanatili sa pangunahing teksto ang “mga banal”; sa konteksto, sila ang mga mananampalataya sa Jerusalem, lalo na ang mga dukha sa kanila.
  alternative: Tahasang isalin bilang “mga mananampalataya sa Jerusalem” o “bayan ng Diyos.”
  rationale: Bagaman nililinaw ng kasunod na talata ang konteksto ng tulong para sa mga dukha sa mga banal sa Jerusalem, hindi tahasang taglay ng pariralang τοῖς ἁγίοις sa talatang ito ang lahat ng detalyeng iyon. Kaya hindi ito idinaragdag sa pangunahing teksto.
- issue: Ugnayan ng διακονῶν sa pagpunta
  choice: 'Isinalin bilang layunin: “upang maglingkod.”'
  alternative: “habang naglilingkod” o “na nagdadala ng tulong.”
  rationale: Maaaring magpahiwatig ang participle ng kasabay na kalagayan o layunin. Ang konteksto ng talata 26 ay sumusuporta sa paglalakbay para sa paglilingkod, ngunit ang tiyak na anyo ng tulong ay hindi isiniksik sa pangunahing teksto; nakasaad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “mga banal” bilang kinikilalang katawagang Paulino, habang iniwasan ang makalumang “pumaparoon” at ang posibleng institusyonal na dating ng “naglilingkod bilang ministro.”
