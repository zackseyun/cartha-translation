id: ROM.15.9
reference: Romans 15:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: tl
  text: "at upang luwalhatiin ng mga Hentil ang Diyos dahil sa kanyang awa,[a] gaya ng nasusulat:\n\n“Dahil dito, pupurihin kita sa gitna ng mga Hentil,\n    at aawit ako ng papuri sa iyong pangalan.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bansa” at “sa gitna ng mga bansa” sa dalawang paglitaw ng salitang Griyego. Partikular na inilalapat ni Pablo ang sipi sa mga Hentil, ngunit ang pinagsiping teksto ay may mas malawak ding kahulugang “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: mga Hentil / sa gitna ng mga Hentil
  rationale: Sa argumento ni Pablo sa Roma, tumutukoy ito sa mga taong hindi Judio. Pinananatili ng “mga Hentil” ang partikular na diwang iyon, samantalang kinikilala sa talababa ang mas malawak na kahulugang “mga bansa” sa sipi.
- source_word: ὑπὲρ ἐλέους
  choice: dahil sa kanyang awa
  rationale: Ipinapahayag ng ὑπέρ na may genitive ang dahilan o batayan ng pagluwalhati. Likas sa Tagalog ang “dahil sa,” at nililinaw ng “kanyang” na awa ito ng Diyos.
- source_word: δοξάσαι
  choice: upang luwalhatiin
  rationale: Ang infinitive ay nakadepende sa naunang pangungusap at nagpapahayag ng layunin o bunga. Ang “upang” ay malinaw at natural na nag-uugnay rito sa talata 8.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwan at marangal na pormula ito sa Tagalog para sa pagsipi sa Kasulatan.
- source_word: ἐξομολογήσομαί
  choice: pupurihin kita
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa hayagang pagpupuri o pasasalamat sa Diyos, hindi sa pagtatapat ng kasalanan. Kaayon ito ng kasunod na ψαλῶ.
- source_word: ψαλῶ
  choice: aawit ako ng papuri
  rationale: Ipinapahayag nito ang pag-awit ng papuri. Natural sa modernong Tagalog ang parirala at hindi nito nililimitahan ang awit sa mga kanonikong salmo.
- source_word: τῷ ὀνόματί σου
  choice: sa iyong pangalan
  rationale: Pinananatili nito ang biblikal na idyoma ng pag-awit ng papuri sa pangalan ng Diyos.
theological_decisions:
- issue: Ugnayan ng pambungad na infinitive sa naunang talata
  choice: 'Isinalin bilang pagpapatuloy ng pangungusap sa talata 8: “at upang luwalhatiin ng mga Hentil...”'
  alternative: Ang mas literal ngunit putol na “at ang mga Hentil ay luwalhatiin ang Diyos dahil sa awa”
  rationale: Nakadepende sa sintaks ng talata 8 ang parirala sa Griyego. Ipinakikita ng “upang” ang layunin o bungang nasa teksto nang hindi nagdaragdag ng hiwalay na teolohikal na paliwanag.
- issue: Saklaw ng ἔθνη sa argumento at sa sipi
  choice: “mga Hentil” sa pangunahing teksto
  alternative: “mga bansa”
  rationale: Partikular na inilalapat ni Pablo ang sipi sa mga hindi Judio, ngunit taglay rin ng salitang nasa pinagsiping teksto ang mas malawak na kahulugang “mga bansa”; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “luwalhatiin” at “gaya ng nasusulat” bilang pamilyar ngunit nauunawaang wikang biblikal; iniwasan ang labis na sinaunang ayos ng pangungusap.
