revisions:
- from: Kaya hinihimok ko kayo, mga kapatid[b], sa pamamagitan ng ating Panginoong Jesus na Mesiyas[a] at sa pamamagitan ng pag-ibig ng Espiritu[c], na makipagpunyagi kayo sa akin sa mga panalangin sa Diyos para sa akin.
  to: Hinihimok ko kayo, mga kapatid[b], sa pamamagitan ng ating Panginoong Jesus na Mesiyas[a] at sa pamamagitan ng pag-ibig ng Espiritu[c], na makipagpunyagi kasama ko sa mga panalanging iniaalay sa Diyos para sa akin.
  rationale: Inalis ang «Kaya» upang hindi magdagdag ng inferensiyang wala sa δέ. Inayos ang pariralang tumutukoy sa panalangin upang maging malinaw at likas sa modernong Filipino habang pinananatili ang sama-sama at puspusang diwa ng συναγωνίσασθαί, ang maramihang «mga panalangin,» ang pagtuon ng panalangin sa Diyos, at ang pamamagitan para kay Pablo. Nilinaw rin ang mga talababa nang walang idinagdag na doktrinal na pagpapasya.
