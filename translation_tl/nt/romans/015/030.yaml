source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: tl
  text: Hinihimok ko kayo, mga kapatid[b], sa pamamagitan ng ating Panginoong Jesus na Mesiyas[a] at sa pamamagitan ng pag-ibig ng Espiritu[c], na makipagpunyagi kasama ko sa mga panalanging iniaalay sa Diyos para sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Cristo.” Ang Griyegong Christos ay titulong nangangahulugang “Pinahiran” o “Mesiyas.”
    reason: alternative_reading
  - marker: b
    text: Panlalaki ang anyong panggramatika ng salitang Griyego, ngunit maaari nitong tukuyin ang buong pamayanan ng mga mananampalataya—mga kapatid na lalaki at babae.
    reason: lexical_alternative
  - marker: c
    text: Maaaring mangahulugan ito ng pag-ibig na taglay ng Espiritu o pag-ibig na nililikha ng Espiritu; ang genitibong Griyego ay maaaring unawain sa higit sa isang paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: hinihimok ko kayo
  rationale: Ipinahahayag nito ang taimtim at mariing pakiusap ni Pablo nang hindi nagiging makaluma o labis na mapag-utos.
- source_word: δὲ
  choice: Kaya
  rationale: Ang δέ ay palipat na pang-ugnay dito, hindi temporal na “ngayon” o matinding pagsalungat. Ang “Kaya” ay likas na nag-uugnay sa pakiusap sa naunang talakayan.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang natural na Tagalog na “mga kapatid” ay hindi nagpapahiwatig ng kasarian, bagaman panlalaking anyong panggramatika ang Griyego; nililinaw ito sa talababa.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ng ating Panginoong Jesus na Mesiyas
  rationale: Pinananatili ng “sa pamamagitan ng” ang διά at ang batayan o pamamagitan ng pakiusap; ang Χριστός ay isinalin bilang titulong “Mesiyas.”
- source_word: ἀγάπης τοῦ πνεύματος
  choice: pag-ibig ng Espiritu
  rationale: Pinananatili ang genitibong kayarian at ang tunay na kalabuan kung ito ba ay pag-ibig ng Espiritu o pag-ibig na nililikha ng Espiritu.
- source_word: συναγωνίσασθαί μοι
  choice: makipagpunyagi kayo sa akin
  rationale: Inihahatid ng “makipagpunyagi” ang sama-sama at puspusang pagsisikap na taglay ng tambalang pandiwa.
- source_word: ἐν ταῖς προσευχαῖς
  choice: sa mga panalangin
  rationale: Hindi dinaragdagan ng “inyong,” na wala sa Griyego, at pinananatili ang maramihang anyo.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: sa Diyos para sa akin
  rationale: Likas na ipinahahayag ang direksiyon ng mga panalangin sa Diyos at ang pamamagitan para kay Pablo.
theological_decisions:
- issue: Tinutukoy ng “Espiritu”
  choice: Banal na Espiritu
  alternative: espiritu ng tao o di-personal na diwa
  rationale: Sa gamit ni Pablo at sa kayariang ito, malamang na Banal na Espiritu ang tinutukoy; ang malaking titik ay nagpapakita nito nang hindi nilulutas ang genitibong kalabuan.
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay isang titulo na nangangahulugang “Pinahiran”; “Mesiyas” ang malinaw at likas na katumbas, habang ibinibigay sa talababa ang tradisyonal na “Cristo.”
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Ang “mga kapatid” ay natural na maaaring tumukoy sa buong pamayanang mananampalataya sa Tagalog; nililinaw sa talababa na panlalaki ang anyong Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “makipagpunyagi” upang mapanatili ang tindi ng agonistikong larawan, at “mga kapatid” bilang karaniwang inklusibong tawag sa Tagalog. Ang mga marker [a], [b], at [c] ay inilagay kaagad sa kaugnay na mga salita sa pangunahing teksto.
