base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: tl
  text: Sapagkat hindi ako mangangahas magsalita ng anuman[b] maliban sa mga isinagawa ng Mesiyas sa pamamagitan ko upang sumunod ang mga Hentil[a], sa pamamagitan ng salita at gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring ayusin ang sugnay bilang: “hindi ako mangangahas magsalita ng anuman maliban sa mga isinagawa ng Mesiyas sa pamamagitan ko.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: mangangahas
  rationale: Pinananatili ng panghinaharap na anyo ang pahayag ni Pablo tungkol sa hindi niya pangangahas na lumampas sa wastong maipagmamalaki niya.
- source_word: τι λαλεῖν ... ὧν οὐ
  choice: magsalita ng anuman maliban sa
  rationale: Likas sa modernong Tagalog ang restriktibong pariralang ito at malinaw nitong ipinahihiwatig na ang tanging babanggitin ni Pablo ay ang ginawa ng Mesiyas sa pamamagitan niya.
- source_word: κατειργάσατο
  choice: ginawa
  rationale: Sa konteksto, tumutukoy ito sa mabisang isinagawa o naisakatuparan ng Mesiyas. Ang payak na “ginawa” ay natural at hindi nagdaragdag ng kahulugang wala sa Griyego.
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: Ginagamit dito ang Χριστός bilang titulo ng kumikilos sa pamamagitan ni Pablo; ang “Mesiyas” ay malinaw na salin ng titulong iyon.
- source_word: δι’ ἐμοῦ
  choice: sa pamamagitan ko
  rationale: Pinananatili nito ang Mesiyas bilang pangunahing gumagawa at si Pablo bilang kasangkapan.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: upang sumunod ang mga Hentil
  rationale: 'Natural nitong ipinapahayag sa Tagalog ang layunin o bunga ng gawain: ang pagsunod ng mga di-Judio, nang hindi tinutukoy nang higit sa teksto kung kanino o sa ano ang pagsunod.'
- source_word: λόγῳ καὶ ἔργῳ
  choice: sa salita at sa gawa
  rationale: Pinananatili ang magkatambal na paraan ng ministeryo—ang sinabi at ang ginawa—sa isang pamilyar at marangal na ekspresyong Tagalog.
theological_decisions:
- issue: Pagkasalin sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang konteksto ay angkop sa titulong “Mesiyas,” habang nananatiling posible sa tradisyonal na gamit ang “Cristo.”
- issue: Kahulugan ng ἐθνῶν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Sa argumento ng Roma, karaniwang tinutukoy nito ang mga di-Judio bilang kaibahan sa mga Judio. Gayunman, maaari ring isalin ang salitang Griyego bilang “mga bansa.”
- issue: Ugnayan ng λόγῳ καὶ ἔργῳ
  choice: Iniuugnay sa paraan ng ginawa ng Mesiyas sa pamamagitan ni Pablo
  alternative: Maaaring basahin bilang mas maluwag na paglalarawan sa ministeryo ni Pablo
  rationale: Pinakamalapit sa ayos ng pangungusap na ang salita at gawa ang mga paraang ginamit sa isinakatuparan ng Mesiyas, ngunit hindi kailangang paghiwalayin ang pagkilos ng Mesiyas at ang ministeryo ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mangangahas” para sa volitional na diin, “Mesiyas” bilang titulo, at em dash upang malinaw na iugnay ang “sa salita at sa gawa” sa naunang sugnay.
