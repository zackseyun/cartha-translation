  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: tl
  text: Kaya, matapos kong magawa ito at maihatid nang ligtas sa kanila ang bungang ito[a], tutuloy ako patungong Espanya sa pagdaan ko sa inyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “maselyuhan para sa kanila ang bungang ito.” Ang “bungang ito” ay ang ambag na nalikom mula sa mga mananampalatayang Hentil para sa mga banal sa Jerusalem.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Maaari ring “sa pamamagitan ninyo.” Malamang na ang ibig sabihin ni Pablo ay daraan siya sa Roma patungong Espanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Kaya, matapos kong magawa ito
  rationale: Ipinapakita ng “Kaya” ang ugnayang lohikal sa naunang talakayan, at ng “matapos” na mauuna ang pagkumpleto sa gawa bago ang paglalakbay.
- source_word: σφραγισάμενος αὐτοῖς
  choice: matiyak na maibibigay sa kanila
  rationale: Ang literal na larawan ng pagseselyo ay hindi likas sa Tagalog sa ganitong ayos. Sa konteksto ng ambag para sa Jerusalem, ipinahihiwatig nito ang pagtiyak o pormal na pagkakaloob nito sa mga tatanggap.
- source_word: τὸν καρπὸν τοῦτον
  choice: ang bungang ito
  rationale: Pinananatili ang talinghaga ni Pablo na “bunga,” habang nililinaw sa talababa na tumutukoy ito sa nalikom na ambag.
- source_word: ἀπελεύσομαι
  choice: tutuloy ako
  rationale: Natural na ipinapahayag sa Tagalog ang pagpapatuloy ni Pablo sa susunod niyang patutunguhan.
- source_word: δι’ ὑμῶν
  choice: na daraan sa inyo
  rationale: Pinananatili ang diwa ng paglalakbay sa pamamagitan o ruta ng mga taga-Roma nang hindi ipinapalagay ang tiyak na uri ng tulong na ibibigay nila.
- source_word: εἰς Σπανίαν
  choice: sa Espanya
  rationale: Karaniwang Tagalog na pahayag ng patutunguhan.
theological_decisions:
- issue: Kahulugan ng σφραγισάμενος kaugnay ng ambag para sa Jerusalem
  choice: Isinalin sa pangunahing teksto bilang “matiyak na maibibigay” at inilagay sa talababa ang literal na “maselyuhan.”
  alternative: maselyuhan para sa kanila ang bungang ito
  rationale: Pinananatili nito ang malamang na diwa ng ligtas o pormal na pagkakaloob, ngunit hindi ikinukubli ang kongkretong talinghaga ng Griyego sapagkat inilalahad iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Iniwasan ang di-likas na literalismong “selyuhan ang bunga,” ngunit pinanatili sa talababa ang larawan ng orihinal at sa teksto ang talinghagang “bunga.”
