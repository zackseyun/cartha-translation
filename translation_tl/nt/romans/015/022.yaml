  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: tl
  text: Dahil dito, madalas din akong nahadlang sa pagpunta sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang maraming ulit” o “paulit-ulit”; ang pariralang Griego na τὰ πολλὰ ay isang idyomang nagpapahayag ng madalas na pag-uulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Dahil dito
  rationale: Malinaw na ipinapakita ang bunga o konklusyon mula sa naunang paliwanag ni Pablo.
- source_word: καὶ
  choice: din
  rationale: Pinananatili ang pandagdag na diwa ng καί sa natural na ayos ng modernong Tagalog.
- source_word: ἐνεκοπτόμην
  choice: akong nahadlang
  rationale: Ipinahihiwatig ng imperpektong anyo ang paulit-ulit o nagpapatuloy na paghadlang noon, nang hindi tinutukoy kung sino o ano ang humadlang.
- source_word: τὰ πολλὰ
  choice: madalas
  rationale: Ang pariralang ito ay idyomang pang-abay na tumutukoy sa madalas o paulit-ulit na pangyayari; natural at malinaw ang “madalas” sa Tagalog.
- source_word: τοῦ ἐλθεῖν
  choice: sa pagpunta
  rationale: Direktang ipinapahayag ang gawaing hindi maisagawa dahil sa paghadlang.
- source_word: πρὸς ὑμᾶς
  choice: sa inyo
  rationale: Ipinapakita ang patutunguhan—ang mga mananampalataya sa Roma—nang hindi nagdaragdag ng ideyang wala sa teksto.
