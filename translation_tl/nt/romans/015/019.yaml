id: ROM.15.19
reference: Romans 15:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: tl
  text: sa pamamagitan ng kapangyarihan ng mga tanda at kababalaghan, at sa pamamagitan ng kapangyarihan ng Espiritu[a], anupat mula sa Jerusalem at sa mga lupain sa paligid nito hanggang sa Ilirico ay lubos kong naipangaral ang magandang balita ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Banal na Espiritu.”
    reason: Nililinaw ang malamang na tinutukoy ng πνεύματος nang hindi idinaragdag ang “Banal” sa pangunahing teksto.
  - marker: b
    text: O “lubos kong naisakatuparan ang magandang balita ng Mesiyas.”
    reason: Pinananatili ang mas literal na saklaw ng πεπληρωκέναι, na maaaring magpahiwatig ng pagdadala ng magandang balita sa ganap na katuparan sa nasabing saklaw.
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: sa kapangyarihan ng
  rationale: Pinananatili ng pariralang ito ang diin sa kapangyarihang gumagawa sa pamamagitan ng mga tanda, kababalaghan, at Espiritu; natural din ito sa modernong Tagalog.
- source_word: σημείων καὶ τεράτων
  choice: mga tanda at mga kababalaghan
  rationale: Ito ang nakaugaliang pares na tumutukoy sa mga pambihirang gawang nagpapatunay sa pagkilos ng Diyos, nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: πνεύματος
  choice: Espiritu
  rationale: Malakas na ipinahihiwatig ng konteksto na ang tinutukoy ay ang Espiritu ng Diyos, ngunit hindi idinagdag sa pangunahing teksto ang salitang “Banal,” na wala sa binasang tekstong Griyego.
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinakikita nito ang bunga ng naunang binanggit na makapangyarihang gawain at mas natural kaysa sa isang mahaba at teknikal na parirala.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: mula sa Jerusalem at sa buong palibot
  rationale: Inilalarawan nito ang malawak na saklaw mula sa Jerusalem at sa mga rehiyong nakapalibot, habang pinananatili ang adberbiyal at medyo maluwag na diwa ng κύκλῳ.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: hanggang sa Ilirico
  rationale: Tuwirang ipinahahayag nito ang hangganan ng heograpikong saklaw ng ministeryo ni Pablo.
- source_word: πεπληρωκέναι
  choice: lubos kong naipahayag
  rationale: Sa pagsama sa “magandang balita” bilang layon, ipinahihiwatig ng pandiwa ang pagdadala o paghahayag nito nang lubusan sa nasabing malawak na lugar. Pinananatili rin ng ganitong salin ang resultang aspekto ng perpektong pawatas.
- source_word: τὸ εὐαγγέλιον
  choice: ang magandang balita
  rationale: Malinaw at likas ito sa ordinaryong modernong Tagalog at tuwirang naghahatid sa kahulugan ng εὐαγγέλιον.
- source_word: τοῦ Χριστοῦ
  choice: tungkol sa Mesiyas
  rationale: Dito ay may saysay bilang titulo ang Χριστός. Ang “tungkol sa” ay isang natural na pagbasa sa henitibong maaaring tumukoy sa nilalaman o paksa ng magandang balita.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματος
  choice: Espiritu, na malamang ay ang Banal na Espiritu
  alternative: espiritu sa mas pangkalahatang diwa; o tahasang “Banal na Espiritu”
  rationale: Ang konteksto ng mga tanda, kababalaghan, at makapangyarihang ministeryo ay malinaw na pumapabor sa Banal na Espiritu. Gayunman, hindi tahasang isinisingit sa pangunahing teksto ang “Banal” sapagkat πνεύματος lamang ang nasa ibinigay na tekstong Griyego.
- issue: Kahulugan ng πεπληρωκέναι τὸ εὐαγγέλιον
  choice: lubos kong naipahayag ang magandang balita
  alternative: lubos kong naisakatuparan ang magandang balita; lubos kong naihatid ang magandang balita
  rationale: Sa kontekstong heograpiko at misyonero, malamang na tumutukoy ito sa ganap na paghahayag o pagpapalaganap ng magandang balita sa buong saklaw, hindi sa pagtupad sa nilalaman nito. Inilalagay sa talababa ang mas pormal na alternatibo upang mapanatili ang saklaw ng pandiwa.
- issue: Ugnayan ng τοῦ Χριστοῦ sa εὐαγγέλιον
  choice: magandang balita tungkol sa Mesiyas
  alternative: magandang balita ng Mesiyas
  rationale: Maaaring ipahiwatig ng henitibo ang paksa o ang kaugnayan/pagmamay-ari. Ang “tungkol sa” ay malinaw sa Tagalog ngunit hindi ipinipilit na ang Mesiyas lamang ang pinagmulan ng mensahe; ang mas literal na anyo ay itinatala bilang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “magandang balita” sa halip na mas teknikal na “ebanghelyo,” at “Mesiyas” upang malinaw na mapanatili ang titulong Χριστός. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa resultang ipinakikilala ng ὥστε nang hindi binabago ang lohikal na ugnayan.
