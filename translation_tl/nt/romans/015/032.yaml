  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: tl
  text: upang, sa pamamagitan ng kalooban ng Diyos, ay makapunta ako sa inyo nang may kagalakan at makapagpahinga akong kasama ninyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makasama ninyo sa pagpapahinga” o “magkasama tayong makasumpong ng pahinga.” Ipinahihiwatig ng pandiwang Griyego ang pinagsasaluhang ginhawa o pahinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na nagpapahayag ng layunin sa Filipino at pinananatili ang telikong diwa ng sugnay.
- source_word: ἐν χαρᾷ
  choice: nang may kagalakan
  rationale: Natural na paglalarawan ng kalagayan o paraan ng pagdating at pinananatili ang pangngalang 'kagalakan.'
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: makarating ako sa inyo
  rationale: Isinasama nang natural ang aorist participle sa sugnay na nagsasaad ng inaasahang layunin ni Pablo.
- source_word: διὰ θελήματος θεοῦ
  choice: sa kalooban ng Diyos
  rationale: Karaniwang dignified na parirala sa Filipino para sa pagdating na nakasalalay at naaayon sa kalooban ng Diyos, nang hindi ginagawang tiyak kung paraan o pahintulot ang pangunahing diin.
- source_word: συναναπαύσωμαι
  choice: makapagpahingang kasama ninyo
  rationale: Ipinahahayag ang pahinga o ginhawang magkakasamang mararanasan; ang 'kasama ninyo' ay nagpapanatili sa συν- na diwa nang natural sa Filipino.
theological_decisions:
- issue: Pagkakasamang nakapaloob sa inaasahang pahinga ni Pablo sa piling ng mga mananampalataya sa Roma
  choice: makapagpahingang kasama ninyo
  alternative: magkaroon tayo ng ginhawa sa isa't isa
  rationale: Pinananatili ng salin ang malinaw na pagbabahagi ng pahinga nang hindi ipinipilit na ang pandiwa ay tahasang nangangahulugan ng ganap na reciprocity; inilalahad sa talababa ang posibleng mas mutual na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'kalooban ng Diyos' bilang pamilyar ngunit hindi denominasyonal na pagpapahayag, at iniwasan ang mas mabigat o makalumang ayos.
