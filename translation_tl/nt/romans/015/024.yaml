  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: tl
  text: kapag pumunta ako sa Espanya—sapagkat umaasa akong makita kayo habang nagdaraan ako at matulungan ninyo akong magpatuloy patungo roon,[a] kung bago iyon ay bahagya muna akong masiyahan sa inyong piling—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maihatid ninyo ako patungo roon.” Maaaring tumukoy ang pandiwa sa pagtulong, paglalaan ng kailangan, o pagsama sa isang manlalakbay sa pagpapatuloy ng kaniyang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: kapag pumunta ako
  rationale: Ipinahahayag ng ὡς ἄν na may kasamang subjunctive ang isang hindi tiyak na panahon sa hinaharap. Likas sa modernong Tagalog ang “kapag pumunta ako” at nananatili rito ang pagiging nakasalalay sa mangyayari.
- source_word: Σπανίαν
  choice: Espanya
  rationale: Ito ang karaniwang pangalan sa Filipino ng Spain.
- source_word: ἐλπίζω γὰρ
  choice: sapagkat umaasa akong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ, at ang “umaasa” ay naghahatid ng inaasahang bagay na may kasamang paghahangad.
- source_word: διαπορευόμενος
  choice: habang nagdaraan ako
  rationale: Ipinakikita ng participle na daraan si Pablo sa Roma habang patungo sa ibang hantungan.
- source_word: θεάσασθαι ὑμᾶς
  choice: makita kayo
  rationale: Natural at tuwirang katumbas ito sa konteksto ng personal na pagdalaw, nang hindi dinaragdagan ang kahulugan.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: matulungan ninyo sa pagpapatuloy ko roon
  rationale: Maaaring saklawin ng προπέμπω ang pagpapahatid, pagsama, o praktikal na pagtulong sa susunod na bahagi ng paglalakbay. Malinaw ang salin ngunit hindi nito tinutukoy ang eksaktong anyo ng tulong.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: matapos ko munang masiyahan
  rationale: Ang ἐάν at subjunctive ay naghahayag ng kalagayang inaasahan ngunit hindi pa tiyak. Mas natural sa Tagalog ang “masiyahan” kaysa sa literal na “mapuno” sa relational na kontekstong ito.
- source_word: ἀπὸ μέρους
  choice: kahit bahagya
  rationale: Pinananatili nito ang limitasyong ipinahahayag ng parirala nang hindi ipinapasiya kung tumutukoy iyon sa tagal ng pagdalaw o sa antas ng kasiyahan.
- source_word: ὑμῶν
  choice: sa inyong piling
  rationale: Idyomatikong inilalahad nito ang relational na diwa ng genitive kasunod ng ἐμπλησθῶ.
theological_decisions:
- issue: Anyo ng inaasahang tulong ng mga mananampalataya sa Roma
  choice: matulungan ninyo sa pagpapatuloy ko roon
  alternative: maihatid ninyo ako patungo roon
  rationale: Hindi nililinaw ng teksto kung ang tulong ay salapi, mga panustos, pagsama, o iba pang praktikal na suporta. Pinananatiling pangkalahatan ng salin ang saklaw ng pandiwa.
- issue: Kahulugan ng inaasahang kasiyahan ni Pablo sa piling nila
  choice: masiyahan, kahit bahagya, sa inyong piling
  alternative: mapuspos, kahit bahagya, sa piling ninyo
  rationale: Ipinahihiwatig ng konteksto ang kasiyahang dulot ng pakikisama, ngunit hindi tiyak kung ang ἀπὸ μέρους ay tumutukoy sa limitadong tagal o limitadong antas. Pinananatili ng “kahit bahagya” ang bukas na kahulugang iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kayo/ninyo/inyong” bilang maramihang ikalawang panauhan. Pinanatili ang gitling sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
