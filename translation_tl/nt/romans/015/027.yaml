  to: Sapagkat ikinalugod nilang gawin iyon, at may utang sila sa kanila. Kung nakibahagi ang mga Hentil[a] sa kanilang mga bagay na espirituwal[b], tungkulin din nilang paglingkuran sila sa mga bagay na materyal.[c]
