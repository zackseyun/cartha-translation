id: ROM.15.27
reference: Romans 15:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: tl
  text: Sapagkat ikinalugod nilang gawin iyon, at may utang sila sa kanila. Kung nakibahagi ang mga Hentil[a] sa kanilang mga bagay na espirituwal[b], tungkulin din nilang paglingkuran sila sa mga bagay na materyal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: O, “kanilang mga pagpapalang espirituwal.” Sa Griyego, “kanilang mga bagay na espirituwal.”
    reason: lexical_alternative
  - marker: c
    text: Literal na, “mga bagay na ukol sa laman”; dito ay tumutukoy sa materyal o pisikal na tulong, bilang katapat ng mga bagay na espirituwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: ikinalugod nilang gawin iyon
  rationale: Ipinahahayag ng pandiwa ang kusang pagsang-ayon at kasiyahan; ang “gawin iyon” ay tumutukoy sa ambag na binanggit sa naunang talata.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: talagang may utang sila sa kanila
  rationale: Pinananatili ang larawan ng pagkakautang at ang diin sa tunay na obligasyon, nang hindi nililimitahan ito sa utang na salapi.
- source_word: τὰ ἔθνη
  choice: mga Hentil
  rationale: Sa kontekstong Paulino, tumutukoy ito sa mga hindi Judio, hindi lamang sa mga bansang pampolitika.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: kanilang mga bagay na espirituwal
  rationale: Malapit ito sa substantivized adjective ng Griyego at hindi tahasang nagdaragdag ng salitang “pagpapala,” bagaman iyon ay posibleng diwa.
- source_word: ἐκοινώνησαν
  choice: nakibahagi
  rationale: Likas na ipinahahayag nito ang pakikibahagi o pagkakaroon ng bahagi sa isang bagay.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: sa mga bagay na materyal
  rationale: Sa konteksto ng ambag para sa mahihirap, ang salita ay tumutukoy sa pisikal o materyal na tulong, hindi sa pagiging makasalanan.
- source_word: λειτουργῆσαι
  choice: paglingkuran
  rationale: Pinananatili nito ang marangal na diwa ng paglilingkod nang hindi ipinahihiwatig na para lamang ito sa mga klerigo.
theological_decisions:
- issue: Kahulugan ng σαρκικοῖς bilang katapat ng πνευματικοῖς
  choice: mga bagay na materyal
  alternative: mga bagay na ukol sa laman
  rationale: Ang agarang konteksto ay tulong na salapi para sa mga banal sa Jerusalem; kaya pisikal o materyal na suporta ang tinutukoy, hindi makasalanang pagnanasa.
- issue: Tinutukoy ng αὐτῶν / αὐτοῖς
  choice: Pinanatili bilang “kanila/sila,” na sa agarang konteksto ay tumutukoy sa mga banal sa Jerusalem
  alternative: Israel o ang mga Judio sa mas malawak na diwa
  rationale: Ang Roma 15:25–26 ay tuwirang tumutukoy sa mga banal sa Jerusalem, bagaman nakaugat ang pangangatwiran ni Pablo sa mas malawak na kaugnayan ng mga Hentil sa mga Judio sa kasaysayan ng pagliligtas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang talinghaga ng pagkakautang at ang bahagyang kalabuan ng mga panghalip, habang nilinaw sa tala ang pinakamalapit na tinutukoy ng mga ito.
