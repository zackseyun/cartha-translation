  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: tl
  text: 'Sa kabila ng kawalan ng maaasahan[a], sumampalataya siya nang may pag-asa, upang siya''y maging ama ng maraming bansa[c], ayon sa sinabi: “Gayon ang magiging lahi mo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lampas sa maaasahan” o “salungat sa pag-asa.”
    reason: lexical_alternative
  - marker: b
    text: O “binhi,” na nagpapanatili sa isahang larawang kolektibo ng Griyego.
    reason: lexical_alternative
  - marker: c
    text: Sipi mula sa Genesis 15:5; ihambing ang Genesis 17:5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: salungat sa maaasahan
  rationale: 'Pinananatili nito ang kabalintunaan ng parirala: ang paniniwala ni Abraham ay salungat sa maaasahan batay sa karaniwang kalagayan, hindi salungat sa pag-asa bilang isang birtud.'
- source_word: ἐπ’ ἐλπίδι
  choice: nang may pag-asa
  rationale: Likas itong pakinggan sa modernong Tagalog at malinaw na ipinantatapat sa “salungat sa maaasahan.”
- source_word: ἐπίστευσεν
  choice: sumampalataya
  rationale: Ang “sumampalataya” ay angkop sa gamit ni Pablo at nagpapanatili ng ugnayang leksikal sa wika ng pananampalataya nang hindi nagdaragdag ng paliwanag.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: upang siya'y maging
  rationale: Pinananatili ng “upang” ang maaaring layunin o inaasahang kinalabasan ng konstruksyong εἰς τό kasama ang pawatas.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: ama ng maraming bansa
  rationale: Ang “bansa” ay umaangkop sa pangako kay Abraham at hindi nagpapasok nang maaga ng mas makitid na paghahating Judio at Hentil.
- source_word: κατὰ τὸ εἰρημένον
  choice: ayon sa sinabi
  rationale: Maikli at likas ito sa Tagalog habang ipinakikitang nakabatay ang pahayag sa naunang sinalitang pangako ng Kasulatan.
- source_word: Οὕτως ἔσται
  choice: Magiging gayon
  rationale: Pinananatili ng “gayon” ang pagtukoy ng οὕτως sa larawan at pangakong nasa konteksto ng Genesis nang hindi tahasang idinaragdag sa pangunahing teksto ang “karami.”
- source_word: τὸ σπέρμα σου
  choice: ang iyong lahi
  rationale: Ang “lahi” ay natural na pangngalang kolektibo sa Tagalog para sa mga magmumula kay Abraham at mas malinaw sa karaniwang mambabasa kaysa sa literal na “binhi.”
theological_decisions:
- issue: Saklaw ng “maraming ἔθνη” sa pangako kay Abraham
  choice: maraming bansa
  alternative: maraming Hentil; maraming bayan
  rationale: Sa talatang ito, umaalingawngaw ang pangako sa Genesis tungkol sa pagiging ama ni Abraham ng maraming bansa. Ang “mga Hentil” ay maaaring magpasok nang labis sa tuwirang pagkakaiba ng Judio at di-Judio.
- issue: Layunin o kinalabasan ng εἰς τὸ γενέσθαι
  choice: upang siya'y maging
  alternative: kaya siya'y naging
  rationale: Ang “upang” ay nagpapanatili sa prospektibong puwersa at sa tunay na posibilidad na mabasa ang konstruksyon bilang layunin o nilalayong kinalabasan, sa halip na lutasin ito bilang kinalabasan lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kabalintunaan ng dalawang pariralang may “pag-asa,” ang posibleng layunin o kinalabasan ng pangungusap, at ang kolektibong diwa ng σπέρμα. Ang pinaikling “siya” ay likas sa tuloy-tuloy na konteksto, kung saan malinaw na si Abraham ang tinutukoy.
