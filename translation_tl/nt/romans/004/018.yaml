  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga ugnayang sintaktiko ay naipapahayag: ang pananampalataya ni Abraham ay kabaligtaran ng karaniwang pag-asa, ngunit nanampalataya siya na may pag-asa, tungo sa pagiging ama ng maraming bansa. Gayunman, ang “Kahit salungat sa maaasahan” ay hindi malinaw kung ano ang “salungat” at hindi likas na pagbuo sa Tagalog. Ang “sa kabila ng kawalan ng maaasahan” ay mas malinaw na naghahayag ng παρ’ ἐλπίδα nang hindi ipinapasok ang dagdag na teolohikal na paliwanag.'
  naturalness: 'Marangal at modernong Tagalog ang karamihan ng salin. Inayos ang pambungad upang maging matatas at ang ayos ng sipi upang maging mas likas na Tagalog: “Gayon ang magiging lahi mo.”'
  terminology: Ang “sumampalataya,” “ama ng maraming bansa,” at “lahi” ay angkop. Ang “bansa” ay wastong pagpili para sa ἐθνῶν sa alusyong Abrahamiko. Pinanatili ang “binhi” sa talababa bilang literal na alternatibo para sa σπέρμα.
