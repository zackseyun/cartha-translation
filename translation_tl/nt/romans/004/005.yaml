  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: tl
  text: Ngunit sa taong hindi gumagawa kundi sumasampalataya[a] sa kanya na nagpapahayag na matuwid[b] sa taong hindi gumagalang sa Diyos, ang kanyang pananampalataya ay ibinibilang[c] na katuwiran[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagtitiwala sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: O, “nagpapawalang-sala.”
    reason: lexical_alternative
  - marker: c
    text: O, “itinuturing” o “kinikilalang bilang katuwiran.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isalin ang salitang Griyego bilang “katarungan” sa ilang konteksto; dito, “katuwiran” ang higit na angkop sa argumento ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: para sa taong hindi gumagawa
  rationale: Pinananatili nito ang substantibong participle at ang tuwirang pagsalungat sa sumasampalataya, nang hindi dinaragdagan ang Griyego ng ideyang “umaasa sa gawa.”
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: kundi sumasampalataya sa
  rationale: Likas sa modernong Tagalog ang “sumasampalataya sa,” at naipahihiwatig nito ang pagtitiwala o pagsandig na taglay ng πιστεύω ἐπί.
- source_word: τὸν δικαιοῦντα
  choice: sa kanya na nagpapawalang-sala
  rationale: Ang “nagpapawalang-sala” ay malinaw at kinikilalang salin ng δικαιόω sa kontekstong ito; pinananatili nito ang legal na puwersa nang hindi ipinapako ang talata sa isang partikular na sistemang teolohikal.
- source_word: τὸν ἀσεβῆ
  choice: sa taong hindi gumagalang sa Diyos
  rationale: Tumpak at madaling maunawaan nitong ipinapahayag ang kawalan ng paggalang o debosyon sa Diyos. Iniiwasan nito ang mas malawak na “masama” at ang di-likas na “di-maka-Diyos.”
- source_word: λογίζεται
  choice: ay ibinibilang
  rationale: Pinananatili ng “ibinibilang” ang konsepto ng pagtutuos o pagkilala bilang isang bagay, na mahalaga sa argumento ni Pablo.
- source_word: ἡ πίστις αὐτοῦ
  choice: ang kanyang pananampalataya
  rationale: Ang “pananampalataya” ang natural at pangunahing katumbas dito; ang kaagapay na participleng “sumasampalataya” ay nagpapakitang pananampalataya, hindi katapatan, ang tinutukoy.
- source_word: εἰς δικαιοσύνην
  choice: na katuwiran
  rationale: Kasama ng “ibinibilang,” natural na ipinapahayag ng “na katuwiran” ang diwang ‘counted as righteousness’ at pinananatili ang mahalagang terminong δικαιοσύνη.
theological_decisions:
- issue: Ang puwersa ng δικαιόω sa argumento ni Pablo
  choice: nagpapawalang-sala
  alternative: nagpapahayag na matuwid
  rationale: Pinananatili ng pangunahing salin ang legal na himig ng pandiwa, habang inilalagay sa talababa ang alternatibong higit na tuwirang naglalarawan ng pagpapahayag na matuwid. Hindi nito nilulutas nang palihim ang teolohikal na usapin.
- issue: Ang ugnayan ng πιστεύω at πίστις
  choice: sumasampalataya / pananampalataya
  alternative: nagtitiwala / pagtitiwala
  rationale: Pinananatili ang leksikal at teolohikal na ugnayan ng faith word-group, ngunit kinikilala sa talababa na may diwa rin itong personal na pagtitiwala.
- issue: Ang kahulugan ng λογίζεται εἰς δικαιοσύνην
  choice: ibinibilang na katuwiran
  alternative: itinuturing na katuwiran
  rationale: Ang “ibinibilang” ay mas malapit sa metapora ng pagtutuos, samantalang ang alternatibo ay posibleng mas pangkaraniwang pagpapahayag; hindi tinutukoy ng salin ang eksaktong mekanismong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kundi” upang maging malinaw ang mariing pagsalungat ng dalawang participle. Hindi idinagdag ang “umaasa sa” bago ang “gawa,” sapagkat wala iyon nang tahasan sa Griyego. Ang “sa kanya na” ay nagpapanatili sa substantibong paglalarawan ng Griyego nang hindi tahasang ipinapalit ang pangalang “Diyos,” bagaman malinaw sa konteksto kung sino ang tinutukoy.
