  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: tl
  text: At hindi siya nanghina sa pananampalataya; isinaalang-alang niya[a] ang sarili niyang katawan na para nang patay—yamang halos sandaang taong gulang na siya—at ang pagiging patay ng sinapupunan ni Sara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ibang tradisyon ng teksto: “hindi niya isinaalang-alang ang sarili niyang katawan, na para nang patay.”'
    reason: textual_variant
  - marker: b
    text: O “pagkabaog” sa halip na “pagiging patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: nanghina
  rationale: 'Sa negatibong pariralang “hindi nanghina,” natural na naipahahayag sa Tagalog ang diwa ng μὴ ἀσθενήσας: hindi nawalan ng lakas ang pananampalataya ni Abraham.'
- source_word: πίστει
  choice: pananampalataya
  rationale: Tumutukoy ito sa pagtitiwala ni Abraham sa pangako ng Diyos; “pananampalataya” ang malinaw at karaniwang katumbas sa kontekstong ito.
- source_word: κατενόησεν
  choice: itinuring niya
  rationale: Ipinahihiwatig ng pandiwa ang maingat na pagsasaalang-alang sa tunay na kalagayan ng kanyang katawan, hindi lamang ang basta pagkakita rito.
- source_word: νενεκρωμένον
  choice: para nang patay
  rationale: Pinananatili nito ang larawan ng kamatayan habang nililinaw na ang tinutukoy ay ang kawalan na ng kakayahang magkaanak, hindi literal na pisikal na kamatayan.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: yamang halos sandaang taong gulang na siya
  rationale: Ang “halos” ay kumakatawan sa nagpapalambot na πού, at ang “yamang” ay natural na naghahayag ng paliwanag na ibinibigay ng pariralang participial.
- source_word: νέκρωσιν
  choice: pagiging patay
  rationale: Pinananatili ang tahasang wikang may kaugnayan sa kamatayan at ang pagkakaparis nito sa “para nang patay” na katawan ni Abraham.
- source_word: μήτρας Σάρρας
  choice: sinapupunan ni Sara
  rationale: Natural at marangal na Tagalog ito para sa konkretong larawan ng μήτρα, nang hindi ginagawang abstraktong “pagkabaog” ang pahayag.
theological_decisions:
- issue: Kung papalambutin ang magkaugnay na larawan ng kamatayan bilang “pagkabaog” o pananatilihin ang tahasang wika ng kamatayan
  choice: Panatilihin ang “para nang patay” at “pagiging patay ng sinapupunan ni Sara.”
  alternative: “Baog na ang kanyang katawan” at “pagkabaog ni Sara.”
  rationale: Sadyang pinag-uugnay ni Pablo ang katawan ni Abraham at sinapupunan ni Sara sa pamamagitan ng magkaugnay na mga salitang tumutukoy sa kamatayan. Pinatitindi nito ang tila imposibleng kalagayang dinaig ng pangako ng Diyos.
- issue: Tekstuwal na pagkakaiba kung may negatibo sa sugnay tungkol sa pagsasaalang-alang sa katawan ni Abraham
  choice: 'Sinunod sa pangunahing teksto ang SBLGNT na κατενόησεν: “itinuring niya.”'
  alternative: 'Ayon sa ibang tradisyon ng teksto: “hindi niya isinaalang-alang ang sarili niyang katawan, na para nang patay.”'
  rationale: Ang ibinigay na SBLGNT ang pangunahing batayan, ngunit mahalagang itala ang ibang sinaunang pagbasa dahil binabago nito ang gramatikal na ugnayan at diin ng pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sinapupunan” upang mapanatili ang konkretong larawan, at ang “pagiging patay” upang huwag mawala ang sinadyang pagkakaparis ng mga salitang may diwa ng kamatayan. Kapwa lumilitaw sa pangunahing teksto ang mga panandang [a] at [b].
