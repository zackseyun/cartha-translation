id: ROM.4.4
reference: Romans 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: tl
  text: Ngunit sa taong nagtatrabaho, ang sahod ay hindi ibinibilang bilang kaloob[a], kundi bilang utang na dapat bayaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa biyaya.”
    reason: lexical_alternative
  - marker: b
    text: O “bilang obligasyon” o “bilang bagay na dapat bayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: sa taong nagtatrabaho
  rationale: Ang may artikulong pangkasalukuyang participle ay tumutukoy sa sinumang gumagawa o nagtatrabaho; natural at pangkalahatan ang pariralang ito sa Filipino.
- source_word: μισθὸς
  choice: ang sahod
  rationale: Sa konteksto ng paggawa at pagbabayad, ang “sahod” ang pinakatumpak na karaniwang salita para sa kabayarang pinaghirapan.
- source_word: λογίζεται
  choice: ibinibilang
  rationale: Pinananatili nito ang diwang pangkuwenta ng λογίζομαι—ang pagturing o pagtatala ng isang bagay sa isang tiyak na batayan.
- source_word: κατὰ χάριν
  choice: bilang kaloob
  rationale: Sa tuwirang paghahambing sa sahod na dapat bayaran, malinaw na ipinahihiwatig ng χάρις ang bagay na ibinibigay nang hindi pinaghirapan; pinananatili sa talababa ang mas pormal na “ayon sa biyaya.”
- source_word: ὀφείλημα
  choice: utang na dapat bayaran
  rationale: Ipinahahayag nito ang isang bagay na nararapat ibigay dahil may pagkakautang o obligasyon, at malinaw nitong pinananatili ang kaibahan sa kaloob.
- source_word: δὲ
  choice: Ngunit
  rationale: Ang δέ ay nag-uugnay at bahagyang naghahambing sa pahayag na nauna; ang “Ngunit” ay natural dito at hindi ito ginagawang panandang temporal.
theological_decisions:
- issue: Pagpapahayag sa χάρις sa paghahambing ng paggawa at kabayaran
  choice: bilang kaloob
  alternative: ayon sa biyaya
  rationale: Binibigyang-linaw ng “bilang kaloob” ang kaibahan ng hindi pinaghirapang ibinigay sa sahod na dapat bayaran, nang hindi itinatanggi ang mas malawak na kahulugang “biyaya.”
- issue: Pagpapahayag sa ὀφείλημα
  choice: utang na dapat bayaran
  alternative: obligasyon; ayon sa pagkakautang
  rationale: Nananatili ang metaporang pinansiyal at ang punto na ang sahod ay nararapat bayaran, hindi isang kusang kaloob.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sahod,” “kaloob,” at “utang na dapat bayaran” upang maging natural sa karaniwang mambabasa habang pinananatili ang larawang pangkuwenta at ang tensiyon sa pagitan ng biyaya at pagkakautang.
