  source_fidelity: 'Tumpak na naipapahayag ang pangunahing paghahambing ng Griyego: ang sahod ng taong nagtatrabaho ay hindi itinuturing sa batayan ng kaloob/biyaya kundi bilang isang bagay na nararapat bayaran. Nananatili ang larawang pangkabuhayan at pangkuwenta ng μισθός at λογίζεται.'
