id: ROM.4.11
reference: Romans 4:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: tl
  text: At tinanggap niya ang tanda ng pagtutuli bilang tatak ng katuwirang[a] kaugnay ng pananampalatayang taglay niya noong hindi pa siya tuli. Upang siya ay maging ama ng lahat ng sumasampalataya habang hindi tuli,[b] upang ang katuwiran ay maibilang[c] din sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan” para sa “katuwiran” (δικαιοσύνη) dito at sa hulihan ng talata.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng pagiging hindi tuli”; ibig sabihin, habang nasa kalagayang hindi tuli.
    reason: lexical_alternative
  - marker: c
    text: O “ikredito” o “ituring na kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: tanda
  rationale: Likas at malinaw na salin na nagpapanatili sa pagtutuli bilang panlabas na palatandaan.
- source_word: περιτομή
  choice: pagtutuli
  rationale: Karaniwan at tiyak na katawagan sa ritwal na tinutukoy sa pangangatwiran ni Pablo.
- source_word: σφραγῖδα
  choice: tatak
  rationale: Pinananatili ang metapora ng pagpapatunay o pagpapatibay, sa halip na palitan ito ng paliwanag lamang.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Angkop sa gamit ni Pablo at pinananatili ang ugnayan nito sa pagiging matuwid; inilagay sa talababa ang posibleng saling “katarungan.”
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinakakaraniwan at angkop na salin dito; ang parirala ay tumutukoy sa ugnayan ng katuwiran at pananampalataya.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: noong hindi pa siya tuli
  rationale: Malinaw na ipinahahayag ang kalagayan ni Abraham nang taglay na niya ang pananampalataya, at pinananatili ang pagkakasunod ng mga pangyayari.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: ama ng lahat ng sumasampalataya
  rationale: Natural na Filipino na nagpapanatili sa kinatawang diwa ng pagiging ama.
- source_word: δι’ ἀκροβυστίας
  choice: kahit hindi sila tuli
  rationale: Ipinahahayag nang natural ang kalagayan ng mga sumasampalataya; ang mas literal na anyo ay nasa talababa upang mapanatili ang anyo ng Griyego.
- source_word: λογισθῆναι
  choice: ibilang
  rationale: Pinananatili ang larawang pangkuwenta ng pandiwa at malinaw sa modernong Filipino; ang “ikredito” at “ituring” ay inilakip bilang mga alternatibo.
- source_word: καί
  choice: din
  rationale: Ipinakikita na ang katuwiran ay ibinibilang pati sa mga mananampalatayang hindi tuli.
theological_decisions:
- issue: Ugnayan ng pagtutuli at katuwiran
  choice: Inilalarawan ang pagtutuli bilang tanda at tatak ng katuwirang kaugnay ng pananampalatayang taglay na ni Abraham bago siya tuli.
  alternative: Maaaring ipahayag ang talata sa paraang waring ang pagtutuli mismo ang nagkakaloob ng katuwiran.
  rationale: Sa Griyego, ang pagtutuli ay kasunod na tanda at pagpapatunay, hindi ang ipinahayag na paraan ng pagtatamo ng katuwiran. Pinananatili ng salin ang pagkakasunod na ito nang hindi nagdaragdag ng doktrinang pansekta.
- issue: Kaugnayan ng δικαιοσύνη at πίστις
  choice: “Katuwirang kaugnay ng pananampalataya”
  alternative: “Katuwirang mula sa pananampalataya” o “katuwiran ng pananampalataya”
  rationale: Ang “kaugnay” ay natural sa Filipino at hindi lubusang nilulutas ang masinsing ugnayang ipinahihiwatig ng sunod-sunod na genitive sa Griyego; iniiwasan din nito ang malabong tunog na ang pananampalataya mismo ay likas na matuwid.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “hindi tuli” sa halip na mas teknikal na “di-tuli,” at pinanatili ang mga metaporang “tanda,” “tatak,” at “ibilang.”
