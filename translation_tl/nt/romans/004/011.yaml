revisions:
- from: At tinanggap niya ang tanda ng pagtutuli bilang tatak ng katuwirang[a] kaugnay ng pananampalatayang taglay niya noong hindi pa siya tuli. Sa gayon, siya ay magiging ama ng lahat ng sumasampalataya kahit hindi sila tuli,[b] upang ibilang[c] din sa kanila ang katuwiran.
  to: At tinanggap niya ang tanda ng pagtutuli bilang tatak ng katuwirang[a] kaugnay ng pananampalatayang taglay niya noong hindi pa siya tuli. Upang siya ay maging ama ng lahat ng sumasampalataya habang hindi tuli,[b] upang ang katuwiran ay maibilang[c] din sa kanila.
  rationale: Inayos ang dalawang sugnay na layunin upang maipakita ang paralelismong εἰς τὸ ... εἰς τὸ, at pinalitan ang concessive na “kahit” ng “habang” upang ipahayag ang kalagayan ng mga mananampalatayang hindi tuli. Hindi binago ang kahulugan, pangunahing terminolohiya, o mga talababa.
