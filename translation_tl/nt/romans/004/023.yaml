id: ROM.4.23
reference: Romans 4:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: tl
  text: Ngunit hindi lamang para sa kanya isinulat na “ito ay ibinilang sa kanya,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinuring,” “ipinalagay,” o “ikinredito sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: isinulat
  rationale: Pinananatili ng payak na anyong balintiyak ang tuwirang pagtukoy sa nakasulat na Kasulatan.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinahihiwatig ng δέ ang paglipat na may bahagyang pagsalungat: ang pahayag ay hindi lamang tungkol kay Abraham, kundi ilalapat din sa mga mananampalataya.'
- source_word: δι’ αὐτὸν μόνον
  choice: lamang para sa kanya
  rationale: Natural itong Tagalog para sa διά na may accusative at pinananatili ang diin na hindi lamang si Abraham ang nilayon ng nakasulat.
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng isinulat; ang panipi ay tumutulong na malinaw na iugnay ito sa siniping pahayag sa naunang talata.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili nito ang diwang pagtutuos o pagkakredit ng λογίζομαι habang nananatiling likas at nauunawaan sa modernong Tagalog.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Tuwirang inilalarawan ang datibong tumatanggap kasabay ng balintiyak na pandiwang “ibinilang.”
theological_decisions:
- issue: Paglalarawan sa λογίζομαι sa konteksto ng pagpapawalang-sala ni Pablo
  choice: ibinilang
  alternative: itinuring; ipinalagay; ikinredito
  rationale: Ang “ibinilang” ay nagpapanatili sa metaporang pagtutuos at sa teolohikal na puwersa ng talata nang hindi ipinapasok ang isang mas tiyak na paliwanag sa kung paano nagaganap ang pagbilang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kanya” sapagkat malinaw sa konteksto na si Abraham ang tinutukoy. Pinanatili ang bahagyang pagsalungat ng δέ sa pamamagitan ng “Ngunit,” at ang panipi ay nagpapakitang ang ὅτι-clause ang nilalaman ng naunang isinulat.
