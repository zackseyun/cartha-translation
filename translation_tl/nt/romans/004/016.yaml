reference: Romans 4:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: tl
  text: Kaya ito ay sa pamamagitan ng pananampalataya[a], upang maging ayon sa biyaya, nang sa gayon ay maging tiyak ang pangako para sa lahat ng inapo[b]—hindi lamang sa mga kabilang sa Kautusan, kundi pati sa mga may pananampalatayang gaya ng kay Abraham[c], na siyang ama nating lahat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pananampalataya” ay maaari ring isaling “pagtitiwala”; hindi gaanong malamang dito ang “katapatan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “binhi”; ginamit dito bilang kolektibong tawag sa mga inapo ni Abraham.
    reason: lexical_alternative
  - marker: c
    text: 'O: “hindi lamang sa mga kabilang sa Kautusan, kundi pati sa mga kabilang sa pananampalataya ni Abraham.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kaya
  rationale: Likas at malinaw na ipinahahayag ang paghinuha mula sa naunang argumento ni Pablo.
- source_word: ἐκ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinakikita ang batayan o paraan nang hindi ginagawang katapatan ang πίστις; pinananatili rin ang di-tahasang simuno ng Griyego sa pamamagitan ng “ito.”
- source_word: ἵνα κατὰ χάριν
  choice: upang maging ayon sa biyaya
  rationale: Pinananatiling hayag ang layuning ipinahihiwatig ng ἵνα at ang ugnayan ng pananampalataya at biyaya.
- source_word: βεβαίαν
  choice: maging tiyak
  rationale: Malinaw na inilalarawan ang pangako bilang maaasahan at matatag.
- source_word: ἐπαγγελίαν
  choice: pangako
  rationale: Karaniwan at angkop na salin sa kontekstong tipan.
- source_word: παντὶ τῷ σπέρματι
  choice: para sa lahat ng inapo
  rationale: Ang σπέρμα ay kolektibo rito; ang “inapo” ay natural sa Filipino at hindi nililimitahan sa isang indibidwal.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: hindi lamang sa mga kabilang sa Kautusan
  rationale: Ipinapahayag sa natural na Filipino ang kolektibong diwa ng isahang anyo sa Griyego nang hindi ipinapalagay na ang Kautusan ang sanhi ng kanilang pag-iral.
- source_word: ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ
  choice: kundi pati sa mga may pananampalatayang gaya ng kay Abraham
  rationale: Nililinaw ang siksik na pariralang Griyego bilang pagtukoy sa mga taong may pananampalatayang katulad ng kay Abraham, habang itinatala sa talababa ang mas literal na anyo.
- source_word: πατὴρ πάντων ἡμῶν
  choice: ama nating lahat
  rationale: Tuwiran, natural, at pinananatili ang pampamilyang paglalarawan ni Pablo.
theological_decisions:
- issue: Ang di-tahasang simuno ng ἐκ πίστεως
  choice: Kaya ito ay sa pamamagitan ng pananampalataya
  alternative: Kaya ang pangako ay nakabatay sa pananampalataya
  rationale: Hindi tahasang inuulit ng Griyego ang simuno. Ang “ito” ay nagpapanatili sa pagkaelliptical ng teksto at umiiwas sa tahimik na pagtakda kung ang tinutukoy ay pangako, mana, o pagtanggap nito.
- issue: Ang kahulugan ng τῷ ἐκ πίστεως Ἀβραάμ
  choice: sa mga may pananampalatayang gaya ng kay Abraham
  alternative: sa nagmula sa pananampalataya ni Abraham
  rationale: Ang piniling salin ay malinaw at natural na tumutukoy sa mga taong nakikibahagi sa uri ng pananampalataya ni Abraham. Isinasama sa talababa ang mas pormal at isahang alternatibo upang mapanatili ang anyo at posibleng pagbasa ng Griyego.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang malaking titik sa “Kautusan” bilang pantukoy sa Kautusan ni Moises. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa susunod na talata.
