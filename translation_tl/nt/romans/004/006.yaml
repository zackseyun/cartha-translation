  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: tl
  text: 'Gaya rin ng sinasabi ni David tungkol sa pagiging mapalad ng taong[a] ibinibilang[b] ng Diyos ang katuwiran[c] bukod sa mga gawa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “tao” ay nasa anyong panlalaki at isahan, ngunit ginagamit dito sa pangkalahatang diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “itinuturing” o “ibinibilang bilang.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “katarungan.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ καὶ
  choice: Gayon din
  rationale: Likas na ipinahahayag sa Filipino ang paghahambing at karagdagang patotoo ni David nang hindi pinabibigat ang pangungusap.
- source_word: λέγει τὸν μακαρισμόν
  choice: sinasabi ... na mapalad
  rationale: Ginagawang natural na sugnay sa Filipino ang abstraktong pangngalang μακαρισμός habang pinananatili ang diwang pagpapahayag ng mapalad na kalagayan.
- source_word: ἀνθρώπου
  choice: tao
  rationale: Ang “tao” ay likas na pangkalahatang katawagan sa Filipino at naaangkop sa kinatawang gamit ng isahang ἀνθρώπου.
- source_word: λογίζεται
  choice: ibinibilang
  rationale: Pinananatili nito ang metaporang pangkuwenta o pagtutuos ng pandiwa, nang hindi gumagamit ng mabigat na teknikal na katawagan.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang salin sa kontekstong Paulino at pinananatili ang ugnayan nito sa pagiging matuwid.
- source_word: χωρὶς ἔργων
  choice: nang hiwalay sa mga gawa
  rationale: Malinaw nitong pinananatili ang pagkakaiba sa pagitan ng pagbilang ng Diyos at ng mga gawa bilang batayan.
theological_decisions:
- issue: Kinatawang gamit ng ἀνθρώπου
  choice: tao
  alternative: lalaki
  rationale: Bagaman anyong panlalaki ang salitang Griyego sa isahan, pangkalahatan ang tinutukoy rito; ang “tao” ay hindi naglilimita sa kahulugan sa mga lalaki.
- issue: Kahulugan ng λογίζεται δικαιοσύνην
  choice: ibinibilang ... ang katuwiran
  alternative: itinuturing na matuwid
  rationale: Pinananatili ng napiling anyo ang tuwirang layon na “katuwiran” at ang metaporang pagtutuos, sa halip na tahimik na gawing pahayag lamang tungkol sa katayuan.
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ang mas angkop sa agarang argumento ni Pablo, ngunit itinatala ang “katarungan” upang hindi mawala ang mas malawak na saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayon din” para sa maayos na pag-uugnay sa naunang argumento, at pinanatili ang metaporang “ibinibilang” dahil mahalaga ito sa daloy ng Roma 4.
