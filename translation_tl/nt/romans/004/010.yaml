id: ROM.4.10
reference: Romans 4:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: tl
  text: Paano nga ito ibinilang[a]? Noong tuli na siya o noong hindi pa siya tuli? Hindi noong tuli na siya, kundi noong hindi pa siya tuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itinuring” o “ipinalagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Paano
  rationale: Karaniwang salitang pananong ito at pinananatili ang retorikal na tanong ni Pablo tungkol sa kalagayan nang maganap ang pagbilang.
- source_word: οὖν
  choice: nga
  rationale: Likas na ipinapakita ng “nga” ang paghinuha at pagpapatuloy ng argumento sa makabagong Tagalog.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili nito ang balintiyak na anyo at ang mahalagang bokabularyo ng Roma 4 nang hindi ipinapasok ang mas makitid na larawang pampinansyal.
- source_word: ἐν περιτομῇ ὄντι
  choice: noong tuli na siya
  rationale: 'Likas na ipinapahayag sa Tagalog ang kalagayang tinutukoy ng Griyegong pangngalan at pandiwaring pantulong bilang isang kalagayang umiiral na: “tuli na siya.”'
- source_word: ἐν ἀκροβυστίᾳ
  choice: noong hindi pa siya tuli
  rationale: Malinaw at likas nitong ipinahahayag ang pagiging di-tuli ni Abraham bago ang pagtutuli, at pinananatili ang temporal na paghahambing.
- source_word: οὐκ ... ἀλλ’
  choice: Hindi ... kundi ...
  rationale: Ito ang karaniwang malinaw na katumbas sa Tagalog ng mariing pagtatambis sa Griyego.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang magkatugmang “tuli na” at “hindi pa tuli” upang likas na maipakita ang temporal na punto ng tanong.
