- from: Pinagpala ang mga taong pinatawad na sa kanilang mga paglabag sa kautusan[a], at ang kanilang mga kasalanan ay tinakpan na.
  to: Pinagpala ang mga taong pinatawad na ang kanilang mga paglabag sa kautusan[a], at tinakpan na ang kanilang mga kasalanan.
  rationale: The revision resolves the awkward first-clause syntax while retaining the completed passive sense, the distinction between lawless acts and sins, and the source’s metaphor of sins being covered. The footnote is revised to offer an alternative that remains semantically close to ἀνομίαι.
