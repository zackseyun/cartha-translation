  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: tl
  text: Pinagpala ang mga taong pinatawad na ang kanilang mga paglabag sa kautusan[a], at tinakpan na ang kanilang mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pagsuway sa kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Pinagpala
  rationale: Pinananatili ang pahayag tungkol sa pagpapala ng Diyos, sa halip na ang mas pansariling damdaming ipinahihiwatig ng “maligaya.”
- source_word: ἀφέθησαν
  choice: pinatawad na
  rationale: Likas sa modernong Tagalog at ipinahahayag ang natapos na pagpapatawad na may nananatiling bunga.
- source_word: ἀνομίαι
  choice: mga paglabag sa kautusan
  rationale: Malinaw na ipinahahayag ang diwa ng paglabag sa batas o kautusan, habang nananatiling madaling maunawaan; maaari rin itong isaling “mga kasamaan.”
- source_word: ἐπεκαλύφθησαν
  choice: tinakpan na
  rationale: Pinananatili ang metapora ng salmong sinipi ni Pablo sa halip na ipaliwanag ito bilang simpleng pagpapatawad o pagtatago.
- source_word: ἁμαρτίαι
  choice: mga kasalanan
  rationale: Karaniwan, malinaw, at tumpak na katumbas ng salitang Griyego.
theological_decisions:
- issue: Ugnayan ng ἀνομίαι at ἁμαρτίαι
  choice: Isinalin nang magkaiba bilang “mga paglabag sa kautusan” at “mga kasalanan.”
  alternative: Isalin ang dalawa sa iisang pangkalahatang katawagang “mga kasalanan.”
  rationale: Pinananatili nito ang magkatulad ngunit hindi magkaparehong mga salita sa patulang paralelismo, nang hindi lumilikha ng mas mahigpit na teolohikal na pagkakaiba kaysa sa ipinahihiwatig ng teksto.
- issue: Metapora ng pagtakip sa kasalanan
  choice: Pinanatili ang “tinakpan na.”
  alternative: Ipaliwanag bilang “pinatawad na” o “hindi na ibinilang.”
  rationale: Ang teksto mismo ay gumagamit ng metapora; ang pagpapanatili rito ay hindi tahimik na lumulutas sa saklaw ng kahulugan nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Pinagpala” para sa deklaratibong diwa ng beatitud at pinanatili ang patulang paralelismo at metapora ng orihinal.
