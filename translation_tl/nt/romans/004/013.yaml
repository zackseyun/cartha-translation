  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: tl
  text: Sapagkat ang pangako kay Abraham o sa kanyang binhi[a]—na siya ay magiging tagapagmana ng sanlibutan—ay hindi sa pamamagitan ng Kautusan, kundi sa pamamagitan ng katuwiran[c] ng pananampalataya[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “supling” o “mga inapo.” Isahan ang salitang Griyego ngunit maaari itong gamitin nang kolektibo.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “sa pamamagitan ng katuwiran dahil sa pananampalataya” o “sa pamamagitan ng katuwirang dumarating sa pamamagitan ng pananampalataya.”'
    reason: alternative_reading
  - marker: c
    text: Ang “katuwiran” ay maaari ring tumukoy sa “pagiging matuwid”; sa ilang konteksto, maaari rin itong isaling “katarungan.”
    reason: lexical_alternative
  - marker: d
    text: Ang “pananampalataya” ay maaari ring magtaglay ng diwang “pagtitiwala” o “katapatan,” ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: pangako
  rationale: Karaniwang tumutukoy ito sa banal na pangako sa pangangatwiran ni Pablo; likas at malinaw ang “pangako” sa modernong Tagalog.
- source_word: σπέρματι
  choice: binhi
  rationale: Isahan ang anyong Griyego ngunit maaari itong tumukoy nang sama-sama sa mga inapo. Pinananatili ng “binhi” ang larawang ito at ang posibilidad ng kolektibong kahulugan.
- source_word: κληρονόμον ... κόσμου
  choice: tagapagmana ng sanlibutan
  rationale: Pinananatili nito ang tahasang wika ng pagmamana at ang malawak na saklaw ng κόσμος nang hindi ito nililimitahan.
- source_word: διὰ νόμου
  choice: sa pamamagitan ng Kautusan
  rationale: Bagaman walang artikulo ang νόμου sa Griyego, natural itong tumutukoy sa Kautusan sa konteksto ng argumento ni Pablo; nililinaw ng malaking titik ang kontekstuwal na pagtukoy na ito.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang pinakanababagay na terminong Paulino at naipag-iiba ito sa mas makitid na diwa ng “katarungan.”
- source_word: πίστεως
  choice: pananampalataya
  rationale: Pinakamalamang na pananampalataya ang tinutukoy sa pagtutol nito sa Kautusan, habang itinatala sa talababa ang mga posibleng diwang pagtitiwala at katapatan.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: sa pamamagitan ng katuwiran ng pananampalataya
  rationale: Pinananatili ng siksik na parirala ang ugnayang henitibo sa Griyego at hindi agad nagpapasya kung ang katuwiran ay dumarating sa pamamagitan ng pananampalataya o inilalarawan bilang nauukol dito.
theological_decisions:
- issue: Ugnayan ng δικαιοσύνης πίστεως
  choice: “katuwiran ng pananampalataya,” na malapit sa siksik na anyo ng Griyego
  alternative: “katuwirang dumarating sa pamamagitan ng pananampalataya” o “katuwiran sa pamamagitan ng pananampalataya”
  rationale: Pinaghahambing ni Pablo ang Kautusan at pananampalataya, ngunit hindi tahasang nilulutas ng henitibong parirala ang eksaktong ugnayan ng dalawang salita. Pinananatili ng salin ang teolohikal na tensiyon.
- issue: Tinutukoy ng αὐτόν sa “magiging tagapagmana”
  choice: “siya,” nang hindi tahasang tinutukoy kung si Abraham o ang kanyang binhi ang pinakamalapit na tinutukoy
  alternative: “si Abraham” o “ang kanyang binhi”
  rationale: Maaaring iugnay ang panghalip sa pangakong ibinigay kay Abraham at sa kanyang binhi. Ang pagpapanatili sa panghalip ay umiiwas sa di-kinakailangang paglutas sa referensiya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sanlibutan” upang mapanatili ang malawak at bahagyang biblikal na himig ng κόσμος, at “Kautusan” bilang pamilyar na katawagan sa kontekstong Paulino. Pinanatili ang siksik na “katuwiran ng pananampalataya” upang hindi gawing labis na interpretatibo ang salin.
