  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: tl
  text: Siya ay ibinigay dahil sa ating mga pagsuway at muling binuhay para sa ating pagpapawalang-sala[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa ating pagpapawalang-sala.”
    reason: alternative_reading
  - marker: b
    text: Ang “pagpapawalang-sala” ay maaari ring ipahayag na “pagpapahayag na matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: ibinigay upang patayin
  rationale: Pinananatili ng “ibinigay” ang balintiyak na anyo at ang maaaring pahiwatig na ang Diyos ang kumikilos; idinagdag ang “upang patayin” upang maging likas at malinaw sa Filipino ang ipinahihiwatig ng konteksto nang hindi tahasang tinutukoy ang gumagawa.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: dahil sa ating mga pagsuway
  rationale: Ang διά na may accusative ay likas na nagsasaad ng sanhi sa unang parirala; malinaw itong naihahayag ng “dahil sa.”
- source_word: παραπτώματα
  choice: mga pagsuway
  rationale: Ipinahahayag ng “mga pagsuway” ang mga paglabag o maling gawa laban sa kalooban ng Diyos at mas natural ito sa modernong Filipino kaysa “mga pagkakasala” sa diwang legal.
- source_word: ἠγέρθη
  choice: muling binuhay
  rationale: Likas na Filipino ito para sa balintiyak na pagkabuhay mula sa kamatayan at pinananatili ang hindi pinangalanang kumikilos.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: para sa ating pagpapawalang-sala
  rationale: Pinananatili ng “para sa” ang prospektibo o layuning pagbasa sa pangunahing teksto, samantalang inilalagay sa talababa ang posible ring pagbasa na sanhi.
- source_word: δικαίωσιν
  choice: pagpapawalang-sala
  rationale: Malinaw at natural nitong ipinahahayag ang legal na diwa ng δικαίωσις bilang hatol na hindi nagkasala o itinuring na matuwid.
theological_decisions:
- issue: Kung ang διὰ τὴν δικαίωσιν ἡμῶν ay nagsasaad ng layunin/bunga o sanhi.
  choice: para sa ating pagpapawalang-sala
  alternative: dahil sa ating pagpapawalang-sala
  rationale: Ang pangunahing salin ay nagpapanatili sa karaniwang prospektibong pagkaunawa na ang muling pagkabuhay ni Cristo ay kaugnay ng pagtatamo o pagsasakatuparan ng pagpapawalang-sala sa mga sumasampalataya. Gayunman, posible rin sa balarila ang pagbasa na sanhi, kaya pinananatili iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “muling binuhay” sa halip na mas tradisyonal na “ibinangon,” at “pagpapawalang-sala” upang mapanatili ang legal at teolohikal na bigat ng δικαίωσις. Ang mga pananda ng talababa ay nakalagay sa mismong teksto.
