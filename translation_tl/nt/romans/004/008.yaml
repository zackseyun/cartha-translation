  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: tl
  text: Pinagpala ang taong hindi kailanman ibibilang ng Panginoon ang kasalanan laban sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “tiyak na hindi ibibilang ng Panginoon ang kasalanan laban sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Pinagpala
  rationale: Pinananatili nito ang bigat ng biblikal na pagpapala at hindi lamang pansariling damdamin ng pagiging masaya.
- source_word: ἀνήρ
  choice: tao
  rationale: Bagaman panlalaking isahan ang anyong Griyego, kinatawan at hindi eksklusibo sa lalaki ang diwa rito; likas sa modernong Tagalog ang “tao” para sa pangkalahatang sangkatauhan.
- source_word: οὗ
  choice: laban sa kanya
  rationale: Ipinahahayag nito sa likas na Tagalog ang kaugnayang genitibo sa pariralang pagbilang ng kasalanan laban sa isang tao.
- source_word: οὐ μὴ
  choice: hindi kailanman
  rationale: Malinaw nitong naihahatid ang mariing pagtanggi ng dobleng negatibo na may subjunctive.
- source_word: λογίσηται
  choice: ibibilang
  rationale: Pinananatili nito ang metapora ng pagtutuos na mahalaga sa konteksto ng Roma 4, nang hindi gumagamit ng mas teknikal na terminong teolohikal.
- source_word: κύριος
  choice: Panginoon
  rationale: Ito ang karaniwan at marangal na katumbas ng κύριος sa konteksto ng sipi mula sa Kasulatan.
- source_word: ἁμαρτίαν
  choice: ang kasalanan
  rationale: Pinananatili ang isahang pangngalan bilang pangkalahatang kategorya, ayon sa Griyego.
theological_decisions:
- issue: Kinatawang panlalaking pananalita
  choice: Isinalin ang ἀνήρ bilang “tao.”
  alternative: “lalaki” o “isang tao”
  rationale: Ang anyong panlalaki sa Griyego ay may pangkalahatan at kinatawang diwa, hindi eksklusibo sa kalalakihan. Sa Tagalog, mas tumpak at likas na naihahatid ito ng “tao” nang hindi binabago ang saklaw.
- issue: Mariing pagtanggi sa pagbibilang ng kasalanan
  choice: “hindi kailanman ibibilang”
  alternative: “tiyak na hindi ibibilang”
  rationale: Kapuwa posible, ngunit mas likas na naihahatid ng “hindi kailanman” ang mariing οὐ μή nang hindi pinapawi ang hinaharap na pananaw ng pandiwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang metapora ng pagtutuos sa “ibibilang” at iniwasan ang teknikal na “iparatang” o “ipagpalagay.”
