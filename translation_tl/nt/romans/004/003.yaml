  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: tl
  text: Sapagkat ano ang sinasabi ng Kasulatan? “Pinaniwalaan ni Abraham ang Diyos, at ito ay ibinilang sa kanya bilang katuwiran.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinuring” o “ikinredito.”
    reason: lexical_alternative
  - marker: b
    text: O “bilang katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Kasulatan
  rationale: Sa gamit ni Pablo, tumutukoy ito sa banal na Kasulatan, hindi lamang sa anumang isinulat. Likas at tiyak sa modernong Filipino ang “Kasulatan.”
- source_word: Ἐπίστευσεν
  choice: Naniwala
  rationale: Tuwirang ipinahahayag ng aorist na anyo ang pagtugon ni Abraham nang may paniniwala. Ang “naniwala” ay natural at hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Ang datibo kasunod ng πιστεύω ay nagpapahiwatig na naniwala si Abraham sa sinabi ng Diyos. Sa Filipino, “naniwala sa Diyos” ang pinakanatural na anyo, bagaman maaari rin itong maunawaan bilang pangkalahatang pananampalataya sa Diyos; nililinaw sa talababa ang mas tiyak na diwa.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili ng “ibinilang” ang pasibong tinig at ang diwa ng pagkilala o pagturing sa isang bagay sa isang tiyak na paraan. Mas natural ito rito kaysa sa mas teknikal na “ipinagkredito.”
- source_word: εἰς δικαιοσύνην
  choice: bilang katuwiran
  rationale: Ipinahahayag ng “bilang katuwiran” ang idiomatikong puwersa ng parirala at ang karaniwang gamit ni Pablo nang hindi nilulutas ang lahat ng teolohikal na implikasyon nito.
theological_decisions:
- issue: Ang kahulugan ng δικαιοσύνη sa konteksto ng pagpapawalang-sala
  choice: katuwiran
  alternative: katarungan
  rationale: Mas angkop ang “katuwiran” sa kontekstong Paulino dahil maaari nitong saklawin ang pagiging matuwid at ang pagkilalang matuwid. Lehitimong kahulugang leksikal ang “katarungan,” kaya pinanatili ito bilang alternatibo sa talababa.
- issue: Ang hindi tahasang simuno ng ἐλογίσθη
  choice: iyon
  alternative: ang pananampalataya niya
  rationale: Hindi tahasang inuulit ng Griyego kung ano ang ibinilang. Pinananatili ng “iyon” ang kaugnayan sa naunang buong pahayag nang hindi idinaragdag sa teksto ang mas tiyak na “ang pananampalataya niya.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” upang panatilihin ang ugnayang paliwanag ng γάρ sa naunang argumento, at ang sipi ay iniharap bilang tuwirang pagsipi mula sa Kasulatan.
