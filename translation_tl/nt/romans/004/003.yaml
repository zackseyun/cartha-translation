revisions:
- from: Sapagkat ano ang sinasabi ng Kasulatan? “Naniwala si Abraham sa Diyos,[a] at iyon ay ibinilang[b] sa kanya bilang katuwiran.”[c]
  to: Sapagkat ano ang sinasabi ng Kasulatan? “Pinaniwalaan ni Abraham ang Diyos, at ito ay ibinilang sa kanya bilang katuwiran.”[a][b]
  rationale: Pinalitan ang “Naniwala si Abraham sa Diyos” ng “Pinaniwalaan ni Abraham ang Diyos” upang maisalin ang konstruksyong πιστεύω + datibo nang mas malapit sa pinagmulan. Inalis ang talababa ng dating pangunahing salin dahil ang dating alternatibo na “Pinaniwalaan ...” ang siyang ginawang pangunahing teksto. Pinanatili ang hindi tiyak na “ito” para hindi ipasok ang “pananampalataya niya,” na hindi tahasang inuulit sa Griyego, at inayos ang mga talababa upang tumugma sa mga salitang kanilang tinutukoy.
