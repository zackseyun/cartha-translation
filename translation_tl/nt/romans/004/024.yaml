id: ROM.4.24
reference: Romans 4:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: tl
  text: 'kundi para rin sa atin: ibibilang[a] ito sa atin na sumasampalataya[b] sa kanya na bumuhay kay Jesus na ating Panginoon mula sa mga patay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ituturing” o “bibilangin.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sumasampalataya sa” ay maaari ring isaling “nagtitiwala sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: kundi para rin
  rationale: 'Pinananatili ang pagsalungat at pagdaragdag sa naunang pahayag: hindi lamang para kay Abraham kundi para rin sa atin.'
- source_word: δι’ ἡμᾶς
  choice: para sa atin
  rationale: Likas na ipinahahayag sa konteksto na isinulat ito na tayo rin ang tinutukoy o isinasaalang-alang.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: sa atin na ibibilang iyon
  rationale: Ipinakikita ng 'ibibilang' ang hinaharap na diwa ng μέλλει at ang pagtutuos na talinghaga ng λογίζεσθαι. Ang 'iyon' ay nagpapanatili sa di-tahasang layon na inuunawa mula sa naunang konteksto.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: na sumasampalataya sa
  rationale: Karaniwan at malinaw na salin ng pananampalataya o pagtitiwalang nakatuon sa isang persona.
- source_word: τὸν ἐγείραντα
  choice: kanya na bumuhay
  rationale: Pinananatili ang pagtukoy sa Diyos sa pamamagitan ng kanyang ginawa, nang hindi nagdaragdag ng pangngalang hindi tahasang naroon.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: kay Jesus na ating Panginoon
  rationale: Natural na ayos sa modernong Tagalog at pinananatili ang titulong κύριος bilang 'Panginoon.'
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tapat sa maramihang νεκρῶν at likas na pahayag tungkol sa muling pagkabuhay sa Tagalog.
theological_decisions:
- issue: Ang di-tahasang layon ng λογίζεσθαι
  choice: 'Gumamit ng panghalip na ''iyon'': ''ibibilang iyon.'''
  alternative: '''Ibibilang sa atin ang katuwiran.'''
  rationale: Ang Griyego ay walang tahasang layon sa talatang ito; nauunawaan ito mula sa naunang konteksto bilang katuwiran. Iniiwasan ng 'iyon' na idagdag mismo sa talata ang pangngalang hindi nakasulat dito.
- issue: Ang tinutukoy ng τὸν ἐγείραντα
  choice: Pinanatiling 'kanya na bumuhay' nang hindi tahasang idinaragdag ang 'Diyos.'
  alternative: '''Diyos na bumuhay.'''
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit ang orihinal ay articular participle lamang; pinananatili ng salin ang anyo at diin ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang 'ibibilang' upang mapanatili ang talinghaga ng pagtutuos sa Roma 4. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
