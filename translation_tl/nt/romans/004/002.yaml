id: ROM.4.2
reference: Romans 4:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: tl
  text: Sapagkat kung itinuring na matuwid si Abraham batay sa mga gawa[a], mayroon siyang maipagmamalaki[b]—ngunit hindi sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “dahil sa mga gawa.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “may dahilan siyang magmalaki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ang ugnayang pangangatwiran ng γάρ at ang pasubaling ipinahihiwatig ng εἰ nang hindi dinaragdagan ng interpretasyon.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Ginamit ang karaniwang anyo ng pangalan sa makabagong saling Filipino.
- source_word: ἐξ ἔργων
  choice: batay sa mga gawa
  rationale: Malinaw na ipinahahayag ang mga gawa bilang batayan o saligan, habang iniiwasang gawing mas tiyak kaysa sa Griyego ang uri ng mga gawang tinutukoy.
- source_word: ἐδικαιώθη
  choice: itinuring na matuwid
  rationale: Likas at nauunawaang salin sa Filipino para sa pasibong anyo ng δικαιόω; pinananatili nito ang diwang deklaratibo nang hindi ipinapasok ang isang denominasyonal na paliwanag.
- source_word: ἔχει καύχημα
  choice: mayroon siyang maipagmamalaki
  rationale: Natural na Filipino na nagpapahayag na may dahilan o bagay siyang maipagmamalaki, bagaman mas pandiwari kaysa sa siksik na pangngalang Griyego.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ngunit hindi sa harap ng Diyos
  rationale: Ang “sa harap ng Diyos” ay natural na pariralang Filipino para sa banal na pagsusuri o katayuan sa Diyos at pinananatili ang maigsi at bahagyang bukas na pahayag ng Griyego.
theological_decisions:
- issue: Kung ang pasubali ay tunay na posibilidad o purong haka-haka lamang
  choice: Isinalin nang tuwiran bilang “kung itinuring na matuwid si Abraham batay sa mga gawa.”
  alternative: “kung talagang itinuring na matuwid” o “kung itinuring sana na matuwid”
  rationale: Hindi tinutukoy ng anyong Griyego rito lamang kung tunay o salungat-sa-katotohanan ang kondisyon. Pinananatili ng tuwirang “kung” ang tensiyon sa argumento ni Pablo.
- issue: Saklaw ng “ngunit hindi sa harap ng Diyos”
  choice: Pinanatili bilang maikli at bahagyang eliptikong pagsalungat.
  alternative: “ngunit wala siyang maipagmamalaki sa harap ng Diyos”
  rationale: Ang pinalawak na anyo ay nagpapalinaw ngunit inuulit ang ipinahihiwatig na pandiwa. Mas malapit sa siksik na Griyego ang maikling anyo at hindi nito sinosobrahan ang pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “itinuring na matuwid” sa halip na teknikal na “inaring-ganap,” at “maipagmamalaki” upang maging natural sa karaniwang mambabasa habang pinananatili ang diwa ng καύχημα.
