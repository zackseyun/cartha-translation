  source_fidelity: 'Tapat ang salin sa Griyego: ang “Sapagkat kung” ay maayos na naghahatid ng γάρ at εἰ; ang “batay sa mga gawa” ay wastong nagpapahayag ng ἐξ ἔργων bilang batayan; ang “itinuring na matuwid” ay angkop para sa pasibong ἐδικαιώθη; at napananatili ang maikling elipsis ng “ngunit hindi sa harap ng Diyos” para sa ἀλλ’ οὐ πρὸς θεόν.'
