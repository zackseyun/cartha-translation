  terminology: Ang “Kautusan,” “mga tagapagmana,” “pananampalataya,” at “pangako” ay angkop at pare-pareho sa rehistrong biblikal. Ang “naging hungkag” ay pinananatili ang metapora ng κεκένωται, samantalang ang “nawalan ng bisa” ay angkop para sa κατήργηται.
