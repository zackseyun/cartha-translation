  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: tl
  text: Sapagkat kung ang mga kabilang sa Kautusan ang mga tagapagmana, naging hungkag ang pananampalataya at nawalan ng bisa ang pangako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ginawang hungkag ang pananampalataya at ginawang walang bisa ang pangako.”'
    reason: Pinananatili ang metapora ng κεκένωται at ang saklaw ng κατήργηται bilang mas literal na alternatibong salin.
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ang mga nasa ilalim ng Kautusan
  rationale: Likas sa modernong Tagalog at inilalarawan ang mga taong ang katayuan ay nakabatay sa Kautusan, nang hindi ito nililimitahan sa simpleng pagsunod lamang.
- source_word: κληρονόμοι
  choice: mga tagapagmana
  rationale: Karaniwan at malinaw na katawagan sa konteksto ng mana at pangako.
- source_word: κεκένωται
  choice: nawalan na ng saysay
  rationale: Inihahatid ang resultang kalagayan ng perfect tense at ang larawang ang pananampalataya ay ginawang walang laman o kabuluhan.
- source_word: πίστις
  choice: pananampalataya
  rationale: Pinakamalinaw na pangunahing salin sa paghahambing ni Pablo sa pananampalataya at Kautusan.
- source_word: κατήργηται
  choice: nawalan na ng bisa
  rationale: Ipinapahayag ang pagiging walang epekto o bisa ng pangako nang hindi pinalalabis bilang ganap na paglipol.
- source_word: ἐπαγγελία
  choice: ang pangako
  rationale: Tuwiran at natural; tumutukoy sa tiyak na pangakong tinatalakay sa konteksto.
theological_decisions:
- issue: Ang kahulugan ng πίστις sa paghahambing kay νόμος
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa Roma 4, ang mana ay inihahambing bilang nakabatay sa Kautusan o dumarating sa pamamagitan ng pananampalataya; pinananatili ng “pananampalataya” ang takbo ng pangangatwiran nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Ugnayan ng οἱ ἐκ νόμου sa Kautusan
  choice: ang mga nasa ilalim ng Kautusan
  alternative: ang mga mula sa Kautusan; ang mga umaasa sa Kautusan
  rationale: Pinananatili ang ugnayan ng mga tao sa Kautusan habang iniiwasang tahasang ipakahulugan kung iyon ay pinagmulan, pagkakakilanlan, o batayan ng pagmamana.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang malaking titik sa “Kautusan” upang malinaw na tumukoy sa Kautusan sa kontekstong biblikal. Inilagay ang talababa pagkatapos ng buong sugnay sapagkat saklaw nito ang dalawang magkaugnay na pandiwa.
