  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: tl
  text: at ama rin ng mga tuli[a], sa mga hindi lamang tuli kundi sumusunod din sa mga yapak ng pananampalatayang ipinakita ng ating amang si Abraham noong hindi pa siya tuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ama ng pagtutuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: ama rin ng mga tuli
  rationale: Bagaman literal na “ama ng pagtutuli,” tumutukoy ang parirala sa pagiging ama ni Abraham ng sambayanang tuli, hindi ng ritwal mismo. Ang “mga tuli” ay malinaw at likas sa modernong Tagalog; inilalahad sa talababa ang mas literal na anyo.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: mga hindi lamang tuli
  rationale: Ipinahahayag nito sa natural na Tagalog ang literal na “hindi mula sa pagtutuli lamang” at pinananatili ang pagtutol sa panlabas na pagtutuli lamang.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: sumusunod din sa mga yapak
  rationale: Pinagsasama ng parirala ang maayos na pagsunod at ang larawan ng mga bakas o yapak. Ang “sumusunod sa mga yapak” ay malinaw, natural, at nananatiling matalinghaga.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa konteksto, tumutukoy ito sa pagtitiwala o paniniwala ni Abraham sa Diyos; “pananampalataya” ang pinakanaaangkop na karaniwang salin.
- source_word: ἐν ἀκροβυστίᾳ
  choice: noong hindi pa siya tuli
  rationale: Ginagawang natural na temporal na parirala ang kalagayan ni Abraham nang sumampalataya siya bago tuliin.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: taglay ng ating amang si Abraham
  rationale: Nililinaw sa Tagalog ang ugnayang henitibo nang hindi inaalis ang mahalagang katawagang “ating ama” para kay Abraham.
theological_decisions:
- issue: Kung ang pagiging ama ni Abraham sa mga tuli ay para sa lahat ng tuli o para lamang sa mga may pananampalatayang gaya ng sa kanya
  choice: Inilalarawan ang mga tuli bilang mga hindi lamang tuli kundi sumusunod din sa mga yapak ng pananampalataya ni Abraham.
  alternative: Unawaing ama si Abraham ng lahat ng tuli nang walang ganitong kondisyon.
  rationale: 'Ang mga pariralang οὐκ … μόνον ἀλλὰ καί ay nag-uugnay sa parehong pangkat: hindi sapat ang pagiging tuli lamang; kabilang din ang pagsunod sa pananampalataya ni Abraham. Pinananatili ito ng salin nang walang karagdagang paliwanag sa mismong talata.'
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “sumusunod sa mga yapak” bilang likas na idyoma na nagpapanatili sa larawan ng Griyego, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
