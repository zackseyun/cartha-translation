  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: tl
  text: Kung gayon, ang pagpapalang ito ba ay para sa mga taong tuli, o para rin sa mga hindi tuli? Sapagkat sinasabi natin, “Ang pananampalataya ay ibinilang kay Abraham bilang katuwiran[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: pagpapala
  rationale: Tumutukoy ito sa pinagpalang kalagayang binanggit sa Roma 4:6–8. Ang “pagpapala” ay natural at malinaw sa makabagong Filipino.
- source_word: περιτομή
  choice: mga tuli
  rationale: Bagaman literal na “pagtutuli,” ginagamit dito ang pangngalan bilang pantukoy sa mga taong tuli; malinaw at idiomatiko ang “mga tuli.”
- source_word: ἀκροβυστία
  choice: mga hindi tuli
  rationale: Tumutukoy ito sa pangkat ng mga taong hindi tuli, katapat ng περιτομή.
- source_word: πίστις
  choice: pananampalataya
  rationale: Ito ang karaniwang salin sa kontekstong Pauline at angkop sa pagtukoy sa pananampalataya ni Abraham.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili nito ang diwang pagtutuos o pagkilala ng λογίζομαι nang hindi nagdaragdag ng sistematikong paliwanag.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ang angkop na salin sa argumento ni Pablo tungkol sa kalagayan ni Abraham; ang “katarungan” ay pinananatili bilang leksikal na alternatibo sa talababa.
- source_word: εἰς δικαιοσύνην
  choice: bilang katuwiran
  rationale: Natural nitong ipinahahayag ang ugnayang predikatibo sa idyoma nang hindi nilulutas ang teolohikal na tensiyon ng pahayag.
theological_decisions:
- issue: Ang ugnayan ng pananampalataya ni Abraham at katuwiran
  choice: Ang pananampalataya ni Abraham ay ibinilang sa kanya bilang katuwiran.
  alternative: Ang pananampalataya ay ibinilang kay Abraham tungo sa katuwiran.
  rationale: Pinananatili ng napiling salin ang pormulasyon ni Pablo at iniiwasang magdagdag ng paliwanag tungkol sa eksaktong mekanismo o sistemang teolohikal na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “para lamang” upang gawing natural ang kaibahan ng ἐπί ... ἢ καὶ ἐπί nang hindi binabago ang diwa. Ang sipi ay nananatiling maikli at may pormal na himig.
