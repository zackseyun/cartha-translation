base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: tl
  text: Gaya ng nasusulat, “Ginawa kitang ama ng maraming bansa[b]”—sa harap ng Diyos na sinampalatayanan niya, ang Diyos na nagbibigay-buhay sa mga patay at tumatawag sa mga bagay na hindi umiiral na para bang umiiral ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas interpretibong salin, “tinatawag upang umiral ang mga bagay na hindi umiiral.”
    reason: alternative_reading
  - marker: b
    text: Ang “mga bansa” rito ay maaari ring unawaing “mga Hentil,” ngunit sa siping ito mula sa Genesis, mas malamang ang mas malawak na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Gaya ng nasusulat
  rationale: Karaniwang pormula ito sa pagsipi sa Kasulatan. Likas sa modernong Tagalog ang “gaya ng nasusulat” at naipahihiwatig nitong nananatiling may bisa ang nakasulat.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: ama ng maraming bansa
  rationale: 'Sa sipi mula sa Genesis, malawak ang kahulugan ng ἐθνῶν: mga bansa o mga bayan, hindi lamang mga Hentil bilang kaibahan sa mga Judio.'
- source_word: τέθεικά σε
  choice: Ginawa kitang
  rationale: Natural na katumbas ng perfect na τέθεικα ang payak na aspektong naganap sa Tagalog; ipinakikita ng konteksto na nananatili ang bisa ng pagkakagawa o pagkatalaga kay Abraham.
- source_word: κατέναντι
  choice: sa harap ng
  rationale: Pinananatili nito ang ugnayang ipinahahayag ng salitang Griyego at mas natural kaysa sa literal ngunit matigas na mga alternatibo.
- source_word: οὗ ἐπίστευσεν
  choice: Diyos na sinampalatayanan niya
  rationale: Ang “sinampalatayanan” ay natural na pagpapahayag ng personal na pagtitiwala ni Abraham sa Diyos, hindi lamang pagsang-ayon sa isang pahayag.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: nagbibigay-buhay sa mga patay
  rationale: Malinaw at likas itong Tagalog at pinananatili ang paglalarawan sa Diyos bilang siyang nagbibigay ng buhay.
- source_word: καλοῦντος
  choice: tumatawag
  rationale: Pinananatili ang payak na diwa ng “tumatawag” sa halip na isingit agad sa pangunahing teksto ang mas interpretibong “lumilikha” o “nagpapairal.”
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: mga bagay na hindi umiiral na para bang umiiral ang mga ito
  rationale: Malapit ito sa siksik na pananalita ng Griyego at hindi agad nilulutas kung ang diin ay sa malikhaing pagtawag upang umiral o sa pagturing at pagtawag sa hindi pa umiiral na para bang umiiral na.
theological_decisions:
- issue: Kung ang huling sugnay ay tahasang isasalin bilang paglikha mula sa wala o pananatilihing mas malapit sa malawak na pananalita ng Griyego.
  choice: tumatawag sa mga bagay na hindi umiiral na para bang umiiral ang mga ito
  alternative: tinatawag upang umiral ang mga bagay na hindi umiiral
  rationale: Maaaring ipahiwatig ng Griyego ang malikhaing kapangyarihan ng Diyos, ngunit siksik at bukas sa higit sa isang pagdidiin ang mismong pananalita. Pinananatili ng pangunahing teksto ang tensiyong ito, habang nasa talababa ang mas interpretibong pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “sinampalatayanan” bilang pormal ngunit pamilyar na salitang biblikal. Ang “Ito ay sa harap ng Diyos” ay tumutulong upang maging mabasa sa Tagalog ang sintaktikong ugnayan ng talata nang hindi dinaragdagan ang teolohikal na nilalaman. Inilagay ang mga marker sa mismong pariralang tinatalakay ng bawat talababa.
