revisions:
- from: Gaya ng nasusulat, “Ginawa kitang ama ng maraming bansa[b].” Ito ay sa harap ng Diyos na sinampalatayanan niya—ang Diyos na nagbibigay-buhay sa mga patay at tumatawag sa mga bagay na hindi umiiral na para bang umiiral ang mga ito.[a]
  to: Gaya ng nasusulat, “Ginawa kitang ama ng maraming bansa[b]”—sa harap ng Diyos na sinampalatayanan niya, ang Diyos na nagbibigay-buhay sa mga patay at tumatawag sa mga bagay na hindi umiiral na para bang umiiral ang mga ito.[a]
  rationale: Inalis ang dagdag at hindi likas na “Ito ay” upang ang pariralang “sa harap ng Diyos na sinampalatayanan niya” ay tuwirang makaugnay sa sipi at sa pananampalataya ni Abraham, gaya ng sintaksis ng Griyego. Hindi binago ang kahulugan, mga terminong teolohikal, o mga angkla at nilalaman ng talababa maliban sa bahagyang pagpapakinis ng introduksiyon sa talababa a.
