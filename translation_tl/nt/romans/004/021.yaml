  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: tl
  text: at lubos siyang nakatitiyak[a] na ang ipinangako niya[c] ay kaya rin niyang gawin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubos na naniniwala” o “ganap na kumbinsido.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang Griyego ay literal na nasa pangkasalukuyan: “kaya niyang gawin.” Sa Filipino, likas na maunawaan ang “kaya” bilang patuloy na kakayahan.'
    reason: lexical_alternative
  - marker: c
    text: Ang “niya” ay tumutukoy sa Diyos, gaya ng malinaw sa nakapaligid na konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: lubos siyang nakatitiyak
  rationale: Ipinahahayag ng pandiwaring Griyego ang ganap at matibay na katiyakan. Likas sa makabagong Filipino ang “lubos na nakatitiyak” at napapanatili nito ang diin ng salita.
- source_word: ὅτι
  choice: na
  rationale: Likas na ipinakikilala ng “na” ang nilalaman ng katiyakan ni Abraham.
- source_word: ὃ
  choice: ang
  rationale: Sa pariralang “ang ipinangako niya,” natural na naihahayag sa Filipino ang diwa ng Griyegong panghalip na nangangahulugang “kung ano” o “yaong.”
- source_word: ἐπήγγελται
  choice: ipinangako niya
  rationale: Ipinahihiwatig ng Griyegong perfect ang pangakong naibigay na at nananatiling may bisa. Ang aspektong natapos ng “ipinangako” ay angkop sa Filipino.
- source_word: δυνατός ἐστιν
  choice: kaya niyang
  rationale: Ang Griyego ay nasa pangkasalukuyang anyo, “kaya niya” o “may kakayahan siya.” Ang “kaya niyang” ay natural sa Filipino at hindi kailangang ilipat sa tahasang panahong nakaraan.
- source_word: καὶ
  choice: rin
  rationale: Ipinakikita rito ng καί na ang nangako ay may kakayahan ding tuparin ang pangako.
- source_word: ποιῆσαι
  choice: gawin
  rationale: Malawak at payak ang kahulugan ng ποιέω rito; pinananatili ng “gawin” ang gayong saklaw nang hindi nagdaragdag ng interpretasyon.
theological_decisions:
- issue: Di-binanggit na simuno ng pangako at kakayahan
  choice: Panatilihin ang panghalip na “niya” sa pangunahing teksto.
  alternative: 'Tahasang sabihing “Diyos”: “ang ipinangako ng Diyos ay kaya rin niyang gawin.”'
  rationale: Malinaw sa konteksto na Diyos ang tinutukoy, ngunit hindi tahasang binabanggit ang kanyang pangalan sa talatang Griyego. Pinananatili ng panghalip ang anyo at kaunting implicitness ng pinagmulan, habang nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balangkas na “ang ipinangako niya ay kaya rin niyang gawin” upang maipakita ang diin ng Griyego sa ipinangako, bagaman bahagyang mas pormal ito kaysa sa karaniwang ayos ng pangungusap.
