  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: tl
  text: Ngunit tungkol sa pangako ng Diyos, hindi siya nag-alinlangan dahil sa kawalan ng pananampalataya[a]; sa halip, pinalakas siya sa pananampalataya[b] at nagbigay siya ng kaluwalhatian sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi siya nagduda dahil sa kawalan ng pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: O “pinalakas siya sa pamamagitan ng pananampalataya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Ngunit tungkol sa pangako ng Diyos
  rationale: Ginamit ang referensiyal na diwa ng εἰς at ang banayad na pagsalungat ng δέ; natural sa modernong Tagalog at malinaw na tumutukoy sa pangako ng Diyos kay Abraham.
- source_word: οὐ διεκρίθη τῇ ἀπιστίᾳ
  choice: hindi siya nag-alinlangan dahil sa kawalan ng pananampalataya
  rationale: Ang διακρίνω rito ay panloob na pag-aatubili o pag-aalinlangan. Ang datibong ἀπιστίᾳ ay maaaring tumukoy sa sanhi o paraan; pinili ang natural na 'dahil sa' nang hindi ginagawang simpleng intelektuwal na pagdududa lamang ang diwa.
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: kundi pinalakas siya
  rationale: Pinananatili ang pasibong anyo ng Griyego at hindi tahasang pinapangalanan ang gumagawa ng pagpapalakas, gaya ng pinagmulang teksto.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Pinananatili ang posibleng diwa ng kalagayan o larangan ng pagpapalakas. Yamang maaari rin itong maging instrumental, inilagay ang alternatibo sa talababa.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: na nagbibigay-luwalhati sa Diyos
  rationale: Isinasalin ang participle bilang kasabay na kilos na kaugnay ng pagpapalakas sa pananampalataya; ang pariralang 'nagbibigay-luwalhati' ay natural at dignified sa Filipino.
theological_decisions:
- issue: Kung ang tugon ni Abraham ay simpleng intelektuwal na pagdududa o mas malawak na pag-aatubili sa pangako
  choice: hindi siya nag-alinlangan dahil sa kawalan ng pananampalataya
  alternative: hindi siya nag-urong-sulong sa kawalan ng pananampalataya
  rationale: Mas natural sa ordinaryong modernong Filipino ang 'nag-alinlangan,' habang pinananatili ng konteksto ang mas malawak na ideya ng hindi pag-uurong-sulong sa pangako ng Diyos.
- issue: Kung ang τῇ πίστει ay lokatibo o instrumental
  choice: pinalakas siya sa pananampalataya
  alternative: pinalakas siya sa pamamagitan ng pananampalataya
  rationale: Pinananatili sa pangunahing teksto ang paralelismo ng kawalan ng pananampalataya at pananampalataya, ngunit kinikilala sa talababa ang tunay na posibilidad na instrumental ang datibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang labis na teknikal o makalumang pananalita. Pinanatili ang pasibong 'pinalakas siya' at ang kalabuan ng datibo sa τῇ πίστει sa pamamagitan ng talababa.
