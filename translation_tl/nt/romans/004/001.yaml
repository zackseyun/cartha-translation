  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: tl
  text: Kaya, ano ang sasabihin natin na natagpuan ni Abraham, ang ating ninuno ayon sa laman?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas idiomatikong pananalita: “ang ating ninuno sa pamamagitan ng pisikal na angkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'May ilan na iniuugnay ang “ayon sa laman” sa “natagpuan”: “Kaya, ano ang sasabihin nating natagpuan ni Abraham ayon sa laman?” Ibig sabihin, kung ano ang natagpuan niya sa paraang pantao o mula sa pananaw ng tao.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Kaya ano ang sasabihin natin
  rationale: Pinananatili ang retorikal na paglipat at mapanuring tanong ni Pablo sa natural na modernong Tagalog.
- source_word: εὑρηκέναι
  choice: natagpuan
  rationale: Tuwirang ipinapahayag ang εὑρίσκω nang hindi dinaragdagan ang kahulugan na maaaring ipahiwatig ng “natuklasan.” Sa sugnay na Tagalog, likas na naihahatid ng aspektong kontemplatibo ang nakamit na resulta.
- source_word: προπάτορα
  choice: ninuno
  rationale: Ang “ninuno” ay natural, marangal, at malinaw na katumbas ng lalaking pinagmulan ng lahi sa kontekstong ito, nang hindi gumagamit ng lipas na pananalita.
- source_word: ἡμῶν
  choice: ating
  rationale: Hayagang pinananatili ang pakikiisa ni Pablo sa mga kausap niya kaugnay ni Abraham.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang mahalagang katawagan ni Pablo at ang posibleng saklaw nito; sa pangunahing pagbasa, tumutukoy ito sa pisikal na angkan.
theological_decisions:
- issue: Saklaw ng κατὰ σάρκα
  choice: Iniuugnay sa “ating ninuno,” kaya si Abraham ang ninuno ayon sa pisikal na angkan.
  alternative: Maaaring iugnay sa “natagpuan,” na ang diwa ay kung ano ang natagpuan ni Abraham sa paraang pantao o mula sa pananaw ng tao.
  rationale: Mas natural sa daloy ng parirala na inilalarawan nito ang kaugnayan ni Abraham bilang ninuno, ngunit tunay ang sintaktikong kalabuan at hindi dapat itago.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang “ayon sa laman” dahil mahalaga itong katawagan ni Pablo, ngunit ipinaliwanag sa talababa ang karaniwang diwa at ang alternatibong sintaktikong pagbasa.
