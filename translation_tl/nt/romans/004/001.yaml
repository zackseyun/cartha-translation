  source_fidelity: Tumpak na naihahatid ng pangunahing teksto ang retorikal na tanong, ang perpektong infinitive na εὑρηκέναι bilang resultang “natagpuan,” si Abraham bilang “ating ninuno,” at ang pangunahing pagbasa ng κατὰ σάρκα bilang paglalarawan sa pagiging ninuno niya. Napananatili rin ng talababa ang tunay na alternatibong saklaw ng parirala.
  naturalness: Natural sa modernong Tagalog ang “Kaya, ano ang sasabihin natin na natagpuan ni Abraham...?” Gayunman, mas malinaw at mas maayos ang appositive na “ang ating ninuno” kaysa “na ating ninuno.” Kailangan ding ayusin ang unang talababa, dahil ang “na ating ninuno sa pisikal na angkan” ay hindi ganap na likas o malinaw na Tagalog.
  terminology: Ang “ninuno” at “ayon sa laman” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ang “ayon sa laman” upang hindi burahin ang Paulinong termino, at ang mas idiomatikong pagpapaliwanag ay inilalagay sa talababa.
