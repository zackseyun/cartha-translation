  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: tl
  text: Kaya ibinilang iyon sa kanya bilang katuwiran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ikinredito” o “itinuring.”
