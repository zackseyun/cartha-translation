lexical_decisions:
- source_word: διό
  choice: Kaya
  rationale: Malinaw at likas na ipinahahayag ang hinuha mula sa naunang pangangatwiran ni Pablo.
- source_word: ἐλογίσθη
  choice: ibinilang
  rationale: Pinananatili ang pasibong anyo at ang larawang may kinalaman sa pagtutuos, nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Likas na katumbas ng datibo at pinananatili ang pagtukoy kay Abraham.
- source_word: εἰς
  choice: bilang
  rationale: Sa pariralang ito, natural nitong ipinahahayag ang itinuring na katayuan o halaga.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Karaniwang salin sa kontekstong Paulino na saklaw ang pagiging matuwid; pinananatili sa talababa ang posibleng diwang 'katarungan.'
theological_decisions:
- issue: Paglalahad sa wika ni Pablo tungkol sa pagtutuos nang hindi nagdaragdag ng doktrinal na paliwanag
  choice: ibinilang iyon sa kanya bilang katuwiran
  alternative: itinuring iyon sa kanya bilang katuwiran; kinilala iyon sa kanya bilang katuwiran
  rationale: Pinananatili nito ang pasibong pahayag at metapora ng pagtutuos, pati ang hindi tahasang binanggit na gumagawa ng kilos, nang hindi nilulutas ang teolohikal na tensiyon sa pamamagitan ng dagdag na salita.
translation_notes:
  register: Makabago, maikli, at marangal na Tagalog. Ginamit ang “iyon” upang katawanin ang hindi tahasang simuno ng pandiwang Griyego, na tumutukoy sa naunang inilalarawang pananampalataya ni Abraham, nang hindi ito inuulit o binibigyang-kahulugan nang higit sa teksto.
