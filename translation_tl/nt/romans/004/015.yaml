base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: tl
  text: Sapagkat ang kautusan ay nagdudulot ng poot[a], ngunit kung saan walang kautusan, wala ring paglabag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy sa poot ng Diyos, ngunit hindi ito tahasang sinasabi sa Griyego.
    reason: genuine_ambiguity
  - marker: b
    text: O “pagsuway.” Ang salitang Griyego ay tumutukoy sa paglabag sa itinakdang utos o hangganan.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: kautusan
  rationale: Pinananatili ang malawak na saklaw ng terminong ginagamit ni Pablo at hindi ito agad nililimitahan sa Kautusan ni Moises; ipinahihiwatig ng konteksto kung aling kautusan ang tinutukoy.
- source_word: ὀργή
  choice: poot
  rationale: Mas angkop ang “poot” kaysa karaniwang “galit” dahil may bigat itong panghukom at teolohikal sa argumento ni Pablo.
- source_word: κατεργάζεται
  choice: nagdudulot
  rationale: Likas sa makabagong Tagalog at malinaw na ipinapahayag ang diwang may ibinubungang resulta.
- source_word: οὗ δὲ
  choice: ngunit kung saan
  rationale: Ipinakikita ang banayad na pagsalungat ng δέ at pinananatili ang lokatibong anyo ng οὗ.
- source_word: παράβασις
  choice: pagsuway
  rationale: Nauunawaan ng karaniwang mambabasa bilang paglabag sa isang utos, bagaman hindi nito ganap na naipahahayag ang larawan ng pagtawid sa itinakdang hangganan.
theological_decisions:
- issue: Saklaw ng νόμος sa argumento ni Pablo
  choice: kautusan
  alternative: ang Kautusan
  rationale: Hindi ginamit sa pangunahing teksto ang pantukoy at malaking titik upang hindi agad ipakahulugang ang Kautusan ni Moises lamang; nananatiling posible ang kaugnayang iyon sa konteksto.
- issue: Tinutukoy ng ὀργή
  choice: poot
  alternative: poot ng Diyos
  rationale: Hindi tahasang binanggit sa Griyego kung kaninong poot ito. Pinanatili ang pagkaelliptical at hindi idinagdag ang “ng Diyos,” kahit malamang na iyon ang teolohikal na diwa sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kautusan” bilang karaniwang terminong biblikal ngunit iniwasang gawing “ang Kautusan” upang mapanatili ang lawak at tensiyon ng orihinal.
