revisions:
- from: Sapagkat ang inyong pagsunod ay nakarating sa kaalaman ng lahat.[a] Kaya nagagalak ako dahil sa inyo; ngunit nais kong maging marunong kayo tungkol sa mabuti at walang bahid ng kasamaan.[b]
  to: Sapagkat ang inyong pagsunod ay naging kilala sa lahat.[a] Kaya nagagalak ako dahil sa inyo; ngunit nais kong maging marunong kayo sa mabuti at walang bahid ng masama.[b]
  rationale: Pinalitan ang mabigat na pagpapahayag na “nakarating sa kaalaman ng lahat” ng mas likas na “naging kilala sa lahat,” habang inilalagay sa talababa ang mas literal na larawan ng Griyego. Inihanay din ang dalawang huling parirala bilang “sa mabuti … sa masama” at itinama ang mga alternatibo sa talababa upang maipakita ang saklaw ng ἀκέραιος nang hindi binabago ang kahulugan.
