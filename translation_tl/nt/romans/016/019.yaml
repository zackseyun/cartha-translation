  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: tl
  text: Sapagkat ang inyong pagsunod ay naging kilala sa lahat.[a] Kaya nagagalak ako dahil sa inyo; ngunit nais kong maging marunong kayo sa mabuti at walang bahid ng masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong pagsunod ay nakarating sa lahat.” Ibig sabihin, ang balita tungkol sa inyong pagsunod ay naging malawak na kilala.
    reason: lexical_alternative
  - marker: b
    text: O “inosente sa masama,” “dalisay sa masama,” o “walang halo sa masama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: pagsunod
  rationale: Karaniwang tumutukoy ito sa masunuring pagtugon, hindi lamang sa pakikinig; natural at malinaw sa modernong Tagalog ang “pagsunod.”
- source_word: εἰς πάντας ἀφίκετο
  choice: nakarating sa kaalaman ng lahat
  rationale: Pinananatili nito ang larawan ng pag-abot o pagdating, habang nililinaw ang di-tahasang diwa na ang balita tungkol sa kanilang pagsunod ang naging malawak na kilala.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: nagagalak ako dahil sa inyo
  rationale: Sa χαίρω, ang ἐπί na may datibo ay maaaring magpahayag ng dahilan o batayan ng kagalakan; ito ang pinakanatural na Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: maging marunong ... tungkol sa mabuti
  rationale: Ipinahahayag ang praktikal na karunungan o wastong pagkilatis na nakatuon sa mabuti.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: walang bahid ng kasamaan
  rationale: Ang ἀκέραιος ay may diwang hindi nahaluan, dalisay, o inosente. Ang “walang bahid” ay likas na Tagalog at nagpapanatili ng moral na diwa nang hindi nagmumungkahi ng kawalang-muwang.
theological_decisions:
- issue: Saklaw ng πάντας
  choice: “lahat” bilang retorikal na pahayag ng malawak na pagkakilala
  alternative: “lahat ng tao” o “lahat ng mga iglesya”
  rationale: Hindi nililimitahan ng teksto ang saklaw sa isang tahasang pangkat, ngunit hindi rin kailangang unawain bilang matematikal na unibersal. Pinananatili ng salin ang malawak at mapagpuring pahayag.
- issue: Pagkakaiba ng σοφούς at ἀκεραίους
  choice: karunungan tungkol sa mabuti at pagiging walang bahid ng kasamaan
  alternative: maging tuso sa mabuti at mangmang sa masama; maging dalisay mula sa masama
  rationale: Pinananatili ang tensiyon sa pagitan ng aktibong moral na pagkilatis at hindi pagkakahalo sa kasamaan, nang hindi ipinapakahulugan ang ἀκέραιος bilang kawalang-kaalaman o pagiging musmos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sapagkat” at “ngunit” upang mapanatili ang lohikal na ugnayan at bahagyang pormal na himig; iniwasan ang arkaikong pananalita at denominasyonal na bokabularyo.
