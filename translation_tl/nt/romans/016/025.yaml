id: ROM.16.25
reference: Romans 16:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: tl
  text: '[a] Sa kanya na makapagpapatatag sa inyo ayon sa aking ebanghelyo at sa pangangaral tungkol kay Jesus na Mesiyas, ayon sa paghahayag ng hiwagang pinanatiling lihim sa loob ng napakahabang panahon,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga talata 25–27 ay bumubuo ng pangwakas na pagpupuri sa Diyos na nasa magkakaibang puwesto sa mga sinaunang manuskrito. Makikita ito sa dulo ng kabanata 14 sa karamihan ng mga manuskritong Bizantino, pagkatapos ng kabanata 15 sa pinakamatandang natitirang papirus, at dito sa dulo ng kabanata 16 sa mahahalagang manuskritong mula sa ikaapat na siglo at sa tradisyong Latin. Inilalagay ito ng ilang manuskrito sa mahigit isang puwesto, samantalang wala naman ito sa iilan. Pinananatili ito rito ng karamihan sa mga makabagong salin bilang pangwakas ng liham ni Pablo.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: patatagin
  rationale: Ipinahahayag nito ang pagkilos ng Diyos na gawing matatag ang mga mananampalataya; natural din ito sa modernong Tagalog.
- source_word: τὸ εὐαγγέλιόν μου
  choice: ebanghelyong ipinangangaral ko
  rationale: Iniiwasan ng natural na pariralang ito ang posibleng maling dating na pag-aari ni Pablo ang ebanghelyo, habang malinaw na naipapahayag ang diwa ng unang panauhang κτήση.
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: pangangaral tungkol kay Jesus na Mesiyas
  rationale: Sa konteksto, ang pagpapahayag na nakasentro kay Jesus ang pinakanatural na pagbasa. Isinalin ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido.
- source_word: ἀποκάλυψιν μυστηρίου
  choice: paghahayag ng hiwaga
  rationale: Ang “paghahayag” ay tumutukoy sa paglalantad ng dating hindi hayag, at ang “hiwaga” ay angkop sa μυστήριον bilang banal na layuning inihayag.
- source_word: σεσιγημένου
  choice: pinanatiling lihim
  rationale: Ang ganap na balintiyak na anyo ay nagpapahiwatig na ang hiwaga ay nanatiling hindi ibinunyag hanggang sa paghahayag nito.
- source_word: χρόνοις αἰωνίοις
  choice: sa napakahabang panahon
  rationale: Sa pariralang ito, tumutukoy ang αἰωνίοις sa napakahabang nagdaang panahon, hindi kinakailangang sa walang-hanggang panahon.
theological_decisions:
- issue: Kaugnayan ng Ἰησοῦ Χριστοῦ sa κήρυγμα
  choice: pangangaral tungkol kay Jesus na Mesiyas
  alternative: pangangaral ni Jesus na Mesiyas
  rationale: Maaaring basahin ang genitibo bilang pangangaral tungkol kay Jesus o pangangaral na ginawa niya. Pinili ang una dahil kaagapay ito ng “ebanghelyong ipinangangaral ko” at karaniwang tumutukoy sa apostolikong pagpapahayag tungkol kay Jesus; hindi ito ginawang batayan ng anumang natatanging doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang talata bilang di-pa-tapos na bahagi ng doxology, kaya nagtatapos ito sa kuwit. Ginamit ang “Mesiyas” bilang malinaw na titulo para sa Χριστός.
