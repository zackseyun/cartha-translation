id: ROM.16.1
reference: Romans 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: tl
  text: Inirerekomenda ko sa inyo si Febe, ang ating kapatid, na isa ring diakono[a] ng iglesya sa Cencrea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapaglingkod” o “ministro.” Ang salitang Griyego na diakonos ay maaaring tumukoy sa isang kinikilalang tungkulin sa paglilingkod o, sa mas pangkalahatang diwa, sa isang taong naglilingkod.
    reason: Pinananatili ang kalabuan kung ang salita ay titulo ng tungkulin o pangkalahatang paglalarawan ng paglilingkod.
lexical_decisions:
- source_word: Συνίστημι
  choice: Ipinagkakatiwala ko sa inyo
  rationale: Sa konteksto ng liham, ipinakikilala at inirerekomenda ni Pablo si Febe sa mga tatanggap. Likas sa Filipino ang pariralang ito at ipinahihiwatig nitong hinihiling niyang tanggapin nila siya nang may pagtitiwala.
- source_word: δὲ
  choice: hindi isinalin nang hiwalay
  rationale: Mahinang panandang pangdiskurso ito na nagbubukas ng bagong bahagi, hindi matinding pagsalungat. Hindi kailangan ang tahasang katumbas sa natural na Filipino.
- source_word: Φοίβην
  choice: Febe
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Griyego na Φοίβη.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: ang ating kapatid
  rationale: Pinananatili ang pampamilyang wika ni Pablo para sa isang kapwa mananampalataya nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: οὖσαν καὶ
  choice: na isa ring
  rationale: Natural na Filipino para sa pandiwaring nagbibigay ng karagdagang pagkakakilanlan, habang pinananatili ang pandagdag na diwa ng καί.
- source_word: διάκονον
  choice: diakono
  rationale: Maaaring tumukoy ang διάκονος sa isang tagapaglingkod sa pangkalahatan o sa kinikilalang tungkulin sa kongregasyon. Pinananatili ng “diakono” ang posibleng pormal na gamit dito, samantalang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: τῆς ἐκκλησίας
  choice: ng iglesya
  rationale: Sa mga liham ni Pablo, karaniwang tumutukoy ang ἐκκλησία sa lokal na kongregasyong Kristiyano; malinaw at pamilyar sa modernong Filipino ang “iglesya.”
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: sa Cencrea
  rationale: Isinalin ang lokatibong parirala sa natural na Filipino at ginamit ang anyong Cencrea para sa pangalan ng lugar.
theological_decisions:
- issue: Kung ang διάκονον ay pangkalahatang katawagan sa paglilingkod o pangalan ng isang kinikilalang tungkulin
  choice: diakono
  alternative: tagapaglingkod; ministro
  rationale: Ang pagkakaugnay nito sa isang tiyak na iglesya sa Cencrea ay maaaring magpahiwatig ng kinikilalang papel, ngunit hindi nito tiyak na inilalarawan ang mga estruktura ng alinmang denominasyon sa kalaunan. Kaya “diakono” ang nasa teksto at ang ibang posibleng kahulugan ay nasa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang maikli at pormal na himig ng pagpapakilala sa liham. Hindi ginawang tahasang “kapatid sa pananampalataya” upang huwag magdagdag sa teksto, at hindi rin nilinaw nang lampas sa ebidensiya ang eksaktong katayuan ng diakonos.
