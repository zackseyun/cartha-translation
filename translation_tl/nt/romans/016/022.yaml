base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: tl
  text: Ako[a], si Tertio, na sumulat ng liham, ay bumabati sa inyo sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, bagaman hindi gaanong malamang: “Ako, si Tertio, na sumulat ng liham sa Panginoon, ay bumabati sa inyo.” Maaaring iugnay ang pariralang Griyego na “sa Panginoon” sa “sumulat,” ngunit mas natural na inilalarawan nito ang pagbati.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: bumabati
  rationale: Karaniwang tumutukoy ang pandiwa sa pagbati o pagpaparating ng pagbati. Natural at maikli ang “bumabati” sa konteksto ng pangwakas na mga pagbati sa isang liham.
- source_word: ὑμᾶς
  choice: sa inyo
  rationale: Ikalawang panauhang maramihan ito; malinaw na naipapakita ng “sa inyo” ang bilang sa Tagalog.
- source_word: ἐγὼ Τέρτιος
  choice: Ako, si Tertio
  rationale: Pinananatili ng tahasang “Ako” ang diin sa pagkakakilanlan ng nagsasalita, at ang “si” ang natural na pananda sa pangalang pantangi sa Tagalog.
- source_word: ὁ γράψας
  choice: na sumulat
  rationale: Natural na isinasalin ng sugnay na “na sumulat” ang articular aorist participle at kinikilala si Tertio bilang aktuwal na tagasulat ng liham.
- source_word: τὴν ἐπιστολήν
  choice: ng liham na ito
  rationale: Makabagong salita ang “liham,” at likas sa Tagalog ang “liham na ito” dahil ang tinutukoy ay ang kasalukuyang liham, bagaman artikulo lamang at hindi demonstratibo ang nasa Griyego.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili nito ang karaniwang Paulinong pahayag at ipinahihiwatig ang saklaw o batayan ng pagbati sa pakikipag-isa sa Panginoon nang hindi ito labis na ipinapaliwanag.
theological_decisions:
- issue: Kaugnayan ng pariralang ἐν κυρίῳ (“sa Panginoon”)
  choice: 'Iniugnay sa pangunahing pandiwang “bumabati”: bumabati si Tertio sa kanila sa Panginoon.'
  alternative: 'Iugnay sa “sumulat”: “Ako, si Tertio, na sumulat ng liham na ito sa Panginoon, ay bumabati sa inyo.”'
  rationale: Sa konteksto ng pangwakas na pagbati sa liham, mas natural na inilalarawan ng parirala ang pagbati bilang nagaganap sa saklaw ng pakikipag-isa sa Panginoon. Gayunman, pinananatili sa talababa ang tunay na posibilidad na iugnay ito sa pagsulat.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Tertio” bilang natural na anyong Tagalog ng pangalang Τέρτιος at ang “Panginoon” para sa κύριος.
