base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: tl
  text: Batiin ninyo si Maria[a], na nagpagal nang husto para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “para sa amin” o “sa gitna ninyo” sa halip na “para sa inyo.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na maramihan ay karaniwang ginagamit sa mga liham upang ipahatid ang pagbati. Likas at malinaw sa modernong Filipino ang “Batiin ninyo.”
- source_word: Μαριάμ
  choice: Maria
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino sa halip na ang tuwirang transliterasyong “Mariam.”
- source_word: ἥτις
  choice: na
  rationale: Natural na ipinakikilala ng “na” ang sugnay na naglalarawan kay Maria; hindi kailangang tahasang idagdag ang bahagyang kwalitatibong diin ng ἥτις.
- source_word: πολλὰ ἐκοπίασεν
  choice: nagpagal nang husto
  rationale: Ang κοπιάω ay tumutukoy sa mabigat at nakapapagod na paggawa, at ang πολλὰ ay nagpapalakas sa lawak o tindi nito. Pinananatili ng “nagpagal nang husto” ang masidhing diwa habang nananatiling marangal at nauunawaan.
- source_word: εἰς ὑμᾶς
  choice: para sa inyo
  rationale: Sa piniling tekstong Griyego, pinakamalinaw na ipinahihiwatig ng parirala ang paggawa para sa kapakinabangan ng mga kausap. Ang “para sa inyo” ay natural at hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Pagkakaiba-iba ng mga manuskrito sa huling parirala
  choice: para sa inyo
  alternative: para sa amin; kasama ninyo
  rationale: Sinusunod ng pangunahing teksto ang SBLGNT na εἰς ὑμᾶς. Inilalahad sa talababa ang mahahalagang alternatibong basa upang hindi maitago ang tekstuwal na pagkakaiba.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinili ang “nagpagal nang husto” upang maipahayag ang masikap at nakapapagod na paggawa nang hindi nagiging masyadong kolokyal.
