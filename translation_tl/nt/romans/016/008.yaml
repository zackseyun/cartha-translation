  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: tl
  text: Batiin ninyo si Ampliatus[a], na minamahal ko sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding isulat ang pangalang Griyego bilang “Amplias”; sinusuportahan ng pagbasa ng SBLGNT dito ang “Ampliatus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na pangmaramihan ay karaniwang utos sa liham na ipaabot ang pagbati. Natural at tuwiran sa modernong Tagalog ang “Batiin ninyo.”
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: Isinalin sa anyong nominative ang pangalang nasa accusative sa Griyego. Sinusunod ng “Ampliatus” ang pagbasa ng SBLGNT na Ἀμπλιᾶτον; inilagay sa talababa ang alternatibong anyong “Amplias.”
- source_word: τὸν ἀγαπητόν μου
  choice: na minamahal ko
  rationale: Ipinahahayag nito nang natural at marangal ang personal na pagmamahal ni Pablo. Mas karaniwan ito sa kasalukuyang Tagalog kaysa sa pangngalang “aking minamahal,” habang pinananatili ang init ng ἀγαπητός at ang μου.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ang “sa Panginoon” ay likas na katumbas sa Tagalog ng karaniwang pahayag ni Pablo at pinananatili ang kaugnayan o saklaw ng buhay kay Cristo nang hindi idinaragdag ang pangalang “Jesus.”
theological_decisions:
- issue: Ugnayan ng pagmamahal ni Pablo at ng ἐν κυρίῳ
  choice: 'Ang “sa Panginoon” ay kaugnay ng pagiging minamahal ni Ampliatus: “na minamahal ko sa Panginoon.”'
  alternative: Maaaring iugnay ang parirala sa utos na bumati, o unawain lamang si Ampliatus bilang isang mahal na kaibigan na walang malinaw na teolohikal na diin.
  rationale: Pinakamadaling iugnay ng ayos ng Griyego ang ἐν κυρίῳ sa τὸν ἀγαπητόν μου. Pinananatili ng salin ang teolohikal na balangkas ng pagmamahalan sa loob ng pakikipag-ugnayan sa Panginoon, nang hindi labis na ipinapaliwanag ito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, magalang, at angkop sa pagbasa sa Bibliya. Ginamit ang “ninyo” upang ipakita ang pangmaramihang utos, at “Panginoon” bilang karaniwang marangal na katumbas ng κύριος.
