source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: tl
  text: Nakikiusap ako sa inyo,[a] mga kapatid, na mag-ingat kayo sa mga lumilikha ng pagkakabaha-bahagi at ng mga katitisuran na salungat sa aral na natutuhan ninyo. Lumayo kayo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay literal na “mga kapatid na lalaki,” ngunit malamang na ang tawag ay para sa buong kongregasyon, kabilang ang mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nakikiusap ako
  rationale: Ipinahahayag nito ang taimtim at pastoral na pakiusap nang natural sa makabagong Tagalog, nang hindi nagiging labis na pormal.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na katawagan sa Tagalog para sa kapwa mananampalataya at maaari ring tumukoy sa buong kongregasyon nang hindi kailangang tukuyin ang kasarian.
- source_word: σκοπεῖν
  choice: na mag-ingat kayo sa
  rationale: Ipinapakita nito kapwa ang maingat na pagmamasid at ang babala tungkol sa mga taong tinutukoy.
- source_word: διχοστασίας
  choice: pagkakabaha-bahagi
  rationale: Malinaw nitong inilalarawan ang mga pagkakahating sinasadya o idinudulot sa komunidad.
- source_word: σκάνδαλα
  choice: mga katitisuran
  rationale: Pinananatili nito ang metapora ng isang bagay na nagiging dahilan ng pagkatisod, sa halip na gawing simpleng pagkakasala ng damdamin.
- source_word: παρὰ τὴν διδαχήν
  choice: salungat sa aral
  rationale: Ipinahahayag nito ang paglihis o pagsalungat sa pamantayan ng aral na tinanggap nila.
- source_word: ἐμάθετε
  choice: natutuhan ninyo
  rationale: Direkta at natural itong tumutukoy sa aral na natutuhan na ng mga mambabasa.
- source_word: ποιοῦντας
  choice: mga lumilikha
  rationale: Sa konteksto, ang pandiwaring ito ay tumutukoy sa mga taong nagdudulot o lumilikha ng pagkakahati at katitisuran.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: Lumayo kayo sa kanila
  rationale: Pinananatili nito ang direksiyonal na larawan at malinaw na puwersa ng pautos.
theological_decisions:
- issue: Saklaw ng ἀδελφοί bilang tawag sa kongregasyon
  choice: Isalin bilang “mga kapatid” at ipaliwanag sa talababa na malamang na kasama ang buong kongregasyon.
  alternative: “mga kapatid na lalaki” o “mga kapatid na lalaki at babae”
  rationale: Bagaman anyong panlalaking maramihan ang Griyego, karaniwang ginagamit ito ni Pablo bilang tawag sa buong kapulungan. Ang “mga kapatid” sa Tagalog ay natural na nagpapanatili sa pampamilyang tawag at sa malamang na malawak na saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging natural ang matibay na pangwakas na utos, habang pinananatili ang ugnayan ng mga sugnay sa Griyego.
