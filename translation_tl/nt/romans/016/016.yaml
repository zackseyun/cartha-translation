  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: tl
  text: Batiin ninyo ang isa’t isa sa banal na halik.[a] Binabati kayo ng lahat ng iglesya ng Mesiyas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “banal na halik” ay isang kinikilalang paraan ng pagbati noon na nagpapahayag ng dalisay na pagmamahal at pakikisama ng mga mananampalataya.
    reason: cultural_note
  - marker: b
    text: O, “lahat ng iglesya ni Cristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Batiin ninyo ang isa’t isa
  rationale: Likas at malinaw na Filipino para sa pautos na Ἀσπάσασθε at sa gantihang panghalip na ἀλλήλους; ipinakikita rin ng “ninyo” na maramihan ang kausap.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: sa pamamagitan ng banal na halik
  rationale: Ipinahahayag ang instrumental o kasamang diwa ng ἐν at pinananatili ang tuwirang kahulugan ng φίλημα at ἁγίῳ nang hindi ginagawang isang pangkalahatang pagbati lamang.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: Binabati kayo
  rationale: Natural na salin sa konteksto ng pangwakas na pagbati sa liham; ang “kayo” ay angkop sa maramihang ὑμᾶς.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: lahat ng iglesya
  rationale: Pinananatili ang kabuuang diin ng πᾶσαι. Ang “iglesya” ay karaniwan at dignified na terminong Filipino para sa mga lokal na kapulungan.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinasalin ang titulong Χριστός ayon sa kahulugang ‘Mesiyas’ at pinananatili ang genitibong ugnayan ng pag-aari o pagkakaugnay.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay isang titulong tumutukoy sa Pinahiran; ang “Mesiyas” ay malinaw na naghahatid ng titulong ito. Inilalagay sa talababa ang tradisyonal na katumbas na “Cristo” upang kilalanin ang lehitimong alternatibong salin.
- issue: Kahulugan ng “banal na halik”
  choice: Panatilihin ang literal na ekspresyon sa pangunahing teksto
  alternative: Batiin nang may banal na pagmamahal
  rationale: Ang teksto ay tahasang nagsasabing φίλημα, ‘halik.’ Ang paglalahat nito bilang pagmamahal lamang ay mag-aalis ng kongkretong anyo ng pagbating binanggit ni Pablo; ang paliwanag sa kulturang gamit nito ay mas angkop sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Batiin ninyo” upang natural na ipakita ang pautos at maramihang kausap, at pinanatili ang kongkretong “banal na halik.”
