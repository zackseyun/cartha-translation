id: ROM.16.11
reference: Romans 16:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: tl
  text: Batiin ninyo si Herodion, na kamag-anak ko.[a] Batiin ninyo ang mga kabilang kay Narciso[b] na nasa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kalahi ko” o “kapwa Judio.” Ang salitang Griyego ay maaaring tumukoy sa isang kamag-anak sa dugo o sa isang kapwa kabilang sa bayan ni Pablo.
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy sa mga kabilang sa sambahayan o ari-arian ni Narciso na sumasampalataya sa Panginoon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang maramihang pautos na ἀσπάσασθε sa konteksto ng pangwakas na pagbati sa liham ay likas na isinasaling “Batiin ninyo.”
- source_word: Ἡρῳδίωνα
  choice: Herodion
  rationale: Isinalin sa karaniwang transliterasyong Filipino ang personal na pangalan.
- source_word: συγγενῆ μου
  choice: kamag-anak ko
  rationale: Natural at dignified ang “kamag-anak ko” sa modernong Filipino. Maaaring tumukoy ang συγγενής sa literal na kamag-anak o, sa gamit ni Pablo, sa isang kapwa Judio; pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: ang mga kabilang kay Narciso
  rationale: Ipinahahayag nito ang kaugnayan nila kay Narciso nang hindi idinaragdag sa pangunahing teksto ang salitang “sambahayan,” na wala namang tahasang katumbas sa Griyego.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: na nasa Panginoon
  rationale: Pinananatili nito ang natatanging idyoma ni Pablo at ang teolohikal na diwa ng pagiging “nasa Panginoon,” sa halip na paliitin ito sa paliwanag na “mga mananampalataya.”
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ang “Panginoon” ang natural at nakaugaliang salin ng κύριος sa Kristiyanong pahayag na ito.
theological_decisions:
- issue: Kahulugan ng συγγενής sa pagbati ni Pablo
  choice: “kamag-anak ko,” na may talababa tungkol sa posibleng kahulugang “kapwa Judio”
  alternative: “kalahi ko” o “kapwa Judio”
  rationale: Hindi tiyak sa talata kung literal na kamag-anak o kapwa kabilang sa bayang Judio ang tinutukoy. Dahil walang isang karaniwang salitang Filipino na likas na sumasaklaw sa dalawang kahulugan, ginamit ang mas tuwirang “kamag-anak” at hayagang pinanatili ang alternatibo sa talababa.
- issue: Saklaw ng mga kaugnay kay Narciso
  choice: “ang mga kabilang kay Narciso” nang hindi tahasang idinaragdag ang “sambahayan”
  alternative: “ang mga kabilang sa sambahayan ni Narciso”
  rationale: Ipinakikita ng Griyego ang kaugnayan kay Narciso ngunit hindi nito tahasang binabanggit ang sambahayan. Pinipigilan ng pangunahing salin ang labis na pagpapaliwanag, samantalang inilalahad sa talababa ang malamang na tinutukoy.
translation_notes:
  register: Modernong Filipino na malinaw, natural, at marangal. Pinanatili ang paulit-ulit na pautos na “Batiin ninyo” at ang idyomang “nasa Panginoon.” Ang “mga kabilang kay Narciso” ay sadyang maingat upang mapanatili ang hindi tiyak na uri ng kanilang kaugnayan sa kaniya.
