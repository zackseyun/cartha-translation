source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: tl
  text: ngunit ngayo'y nahayag na[a] at, sa pamamagitan ng mga kasulatang propetiko, ayon sa utos ng Diyos na walang hanggan, ay ipinaalam sa lahat ng bansa, upang magkaroon ng pagsunod ng pananampalataya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang talatang ito ay pagpapatuloy ng pangwakas na pagpupuri sa Diyos (Roma 16:25–27). Tingnan ang tala sa Roma 16:25 tungkol sa kinalalagyan nito at sa ebidensiya ng mga manuskrito.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: nahayag
  rationale: Tumutukoy ito sa hiwagang binanggit sa talata 25 na dating inilihim ngunit ngayo'y inilantad. Likas at marangal sa Filipino ang “nahayag.”
- source_word: γραφαῖς προφητικαῖς
  choice: mga kasulatan ng mga propeta
  rationale: Ipinahihiwatig ng parirala ang mga sagradong kasulatang may katangiang propetiko. Ang anyong ito ay natural sa Filipino at hindi naglilimita sa kahulugan sa mga aklat lamang na karaniwang tinatawag na Mga Propeta.
- source_word: ἐπιταγήν
  choice: utos
  rationale: Malinaw nitong ipinahahayag ang makapangyarihang tagubilin ng Diyos nang hindi nagdaragdag ng teknikal o denominasyonal na kulay.
- source_word: ὑπακοὴν πίστεως
  choice: sumunod na bunga ng pananampalataya
  rationale: Pinananatili ang ugnayan ng pagsunod at pananampalataya habang inilalahad sa natural na Filipino ang siksik at sadyang malabong genitibong Griyego.
- source_word: πάντα τὰ ἔθνη
  choice: lahat ng bansa
  rationale: Sinasaklaw nito ang pandaigdigang abot ng pagpapakilala at hindi tahasang nililimitahan ang parirala sa mga di-Judio.
- source_word: γνωρισθέντος
  choice: ipinaalam
  rationale: Ipinakikita ng pasibong anyo na ang hiwaga ang ginawang kilala, kaugnay ng pagkahayag nito.
theological_decisions:
- issue: Kahulugan ng ὑπακοὴ πίστεως
  choice: sumunod na bunga ng pananampalataya
  alternative: pagsunod ng pananampalataya / pagsunod na pananampalataya
  rationale: Maaaring tukuyin ng genitibo ang pagsunod na nagmumula sa pananampalataya, pagsunod na binubuo ng pananampalataya, o pagsunod na kaugnay nito. Pinili ang natural na pagbasa sa Filipino, habang iniiwasang gawing merito o hiwalay na gawa ang pagsunod.
- issue: Ugnayan ng διά τε γραφῶν προφητικῶν sa γνωρισθέντος
  choice: ipinaalam ... sa pamamagitan ng mga kasulatan ng mga propeta
  alternative: nahayag sa pamamagitan ng mga kasulatang propetiko
  rationale: Mas malapit sa sintaks na iugnay ang pariralang instrumental sa “ipinaalam,” ngunit nananatili ang malapit na kaugnayan nito sa pagkahayag ng hiwaga.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong nakadepende sa talata 25 at ang gitling sa dulo upang ipakitang nagpapatuloy ang doxolohiya hanggang talata 27. Ang “siya’y” ay tumutukoy sa kolektibong “lahat ng bansa” sa diwa, ngunit ginamit ang “sila’y” para sa natural na Filipino.
