  naturalness: Natural ang karamihan ng pahayag. Ang paglalagay ng “sa pamamagitan ng mga kasulatang propetiko” kasunod ng “nahayag” ay mas malapit sa pagkakasunod at ugnayan ng mga pariralang Griyego. Ang “pagsunod ng pananampalataya” ay sadyang bahagyang pormal ngunit malinaw at angkop sa marangal na rehistro ng doxolohiya; pinananatili rin nito ang siksik na parirala ni Pablo.
  terminology: Ang “nahayag,” “mga kasulatang propetiko,” “utos,” “Diyos na walang hanggan,” at “lahat ng bansa” ay angkop. Ang “mga kasulatang propetiko” ay mas tuwirang katumbas ng γραφῶν προφητικῶν kaysa “mga kasulatan ng mga propeta,” na maaaring magmungkahi na ang mga propeta mismo ang may-akda.
