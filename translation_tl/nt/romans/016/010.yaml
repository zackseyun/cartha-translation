  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: tl
  text: Batiin ninyo si Apeles, na subok at napatunayang karapat-dapat sa Mesiyas.[a] Batiin ninyo ang mga kabilang sa sambahayan ni Aristobulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, ayon sa mas tradisyonal na salin, “kay Cristo.”
    reason: Ibinibigay ang pamilyar na alternatibong salin ng ἐν Χριστῷ nang hindi pinapalitan ang titular na “Mesiyas” sa pangunahing teksto.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang pandiwang pautos ay maramihan at tumutukoy sa pagpapaabot ng pagbati. Likas at malinaw sa modernong Tagalog ang “Batiin ninyo,” at napapanatili nito ang paulit-ulit na anyo ng talata.
- source_word: Ἀπελλῆν
  choice: Apeles
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Griyego.
- source_word: τὸν δόκιμον
  choice: na subok at napatunayang tapat
  rationale: Ang δόκιμος ay tumutukoy sa isang taong nasubok at napatunayang tunay o karapat-dapat. Iniiwasan ng pariralang ito ang di-likas na literal na “ang sinang-ayunan” habang pinananatili ang papuring diwa.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Pinananatili ng “sa” ang malawak na ugnayan o saklaw na ipinahihiwatig ng ἐν, sa halip na paliitin ito sa “bilang mananampalataya.” Isinasalin ang Χριστός bilang titulong “Mesiyas.”
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: ang mga kabilang sa sambahayan ni Aristobulo
  rationale: Ang idyoma ay malamang na tumutukoy sa mga taong kaugnay ng sambahayan o ari-arian ni Aristobulo, hindi kinakailangang kay Aristobulo mismo. Malinaw at natural ito sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa τὸν δόκιμον ἐν Χριστῷ
  choice: na subok at napatunayang tapat sa Mesiyas
  alternative: ang napatunayang karapat-dapat sa Mesiyas
  rationale: Ipinahahayag ang commendatory force ng δόκιμος nang hindi ginagawang tiyak kung anong pagsubok ang pinagdaanan ni Apeles. Pinananatili rin ang ugnayang ipinahihiwatig ng ἐν Χριστῷ sa halip na ipaliwanag ito bilang isang partikular na doktrina.
- issue: Pagsasalin ng Χριστῷ bilang titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay titulong nangangahulugang ang Pinahiran o Mesiyas. Ginamit ang “Mesiyas” sa pangunahing teksto, habang inilagay sa talababa ang tradisyonal at pamilyar na “Cristo.”
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal, ngunit madaling maunawaan. Ginamit ang maramihang “ninyo” ayon sa Griyego at ang karaniwang anyong Filipino ng mga pangalan.
