  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: tl
  text: sa tanging marunong na Diyos, sa pamamagitan ni Jesus na Mesiyas, sa kanya ang kaluwalhatian magpakailanman. Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatapos ng talatang ito ang pangwakas na pagpupuri sa Roma 16:25–27. Malaki ang pagkakaiba-iba sa mga sinaunang manuskrito tungkol sa kinalalagyan at pagkakasama ng pagpupuring ito, bagaman narito ito sa tradisyong Bizantino ng nakararaming manuskrito.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: sa tanging marunong na Diyos
  rationale: Ipinahahayag ng μόνος na ang Diyos lamang ang sukdulang marunong; pinananatili ng parirala ang ugnayang panggramatika ng ‘tangi’ at ‘marunong na Diyos.’
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na may genitive ay nagsasaad ng pamamagitan, at ang Χριστός ay titulong ‘Mesiyas,’ hindi apelyido.
- source_word: ᾧ ἡ δόξα
  choice: sa kanya ang kaluwalhatian
  rationale: Ang ‘sa kanya’ ay likas sa Tagalog at hindi tahasang nilulutas kung ang tinutukoy ng panghalip ay ang Diyos o si Jesus na Mesiyas.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Ito ang likas na katumbas sa Tagalog ng idyomang Griyego na literal na ‘sa mga kapanahunan,’ na nangangahulugang walang hanggan.
- source_word: Ἀμήν
  choice: Amen
  rationale: Pinananatili ang nakaugaliang salitang liturhikal na kilala at nauunawaan ng mga mambabasang Tagalog.
theological_decisions:
- issue: Ang maaaring tinutukoy ng ᾧ (‘sa kanya’)
  choice: Pinanatili ang malabong pagtukoy sa pamamagitan ng ‘sa kanya.’
  alternative: ‘sa Diyos ang kaluwalhatian’ o ‘kay Jesus ang kaluwalhatian’
  rationale: Dahil maaaring iugnay sa ‘Diyos’ o sa mas malapit na ‘Jesus na Mesiyas’ ang panghalip sa kayariang Griyego, hindi dapat tahasang piliin ng salin ang isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang anyong parirala na nagpapatuloy mula sa naunang mga talata, kaya nagsisimula sa maliit na titik. Isinalin ang Χριστός bilang titulong ‘Mesiyas’ at hindi bilang apelyidong ‘Cristo.’
