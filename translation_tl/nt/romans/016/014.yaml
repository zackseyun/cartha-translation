  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: plural ang utos na ἀσπάσασθε, tama ang limang pangalan, at naipahahayag ng “mga kapatid na kasama nila” ang τοὺς σὺν αὐτοῖς ἀδελφούς. Gayunman, ang “gayundin” ay nagdaragdag ng bahagyang retorikal na diin na wala sa payak na καί (“at”).'
  naturalness: Natural at marangal ang “Batiin ninyo” at ang paggamit ng “sina” sa talaan ng mga pangalan. Mas tuwiran at mas malapit sa daloy ng orihinal ang simpleng “at ang mga kapatid na kasama nila.”
  terminology: Ang “mga kapatid” ay angkop para sa ἀδελφούς at hindi dapat palawakin sa paraang lulutas sa kasarian ng pangkat. Ang mga baybay na Asincrito, Flegon, Hermes, Patrobas, at Hermas ay malinaw at napapanatili ang pagkakaiba ng Hermes at Hermas.
  issues:
