    issue: Ang “gayundin” ay hindi kinakailangang dagdag sa pagsasalin ng καί.
    rationale: Ang καί ay simpleng pang-ugnay na “at.” Bagaman hindi nababago ng “gayundin” ang pangunahing kahulugan, mas tapat at mas matipid ang tuwirang pang-ugnay.
  - severity: medium
    issue: Ang talababa ay nagpapakilala ng isang malamang na pagpapakahulugan sa halip na ilahad ang leksikal na alternatibo.
    rationale: Ang “malamang na tumutukoy” at “mga lalaking ito” ay interpretibong paglalarawan. Ang σημείο ay para sa lexical alternative; dapat nitong ipakita lamang na ang parirala ay maaari ring unawaing “ang mga kapatid na kasama nila,” nang hindi nagdaragdag ng paghuhusga tungkol sa saklaw o kasarian ng buong pangkat.
