base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: tl
  text: Batiin ninyo sina Asincrito, Flegon, Hermes, Patrobas, at Hermas, at ang mga kapatid na kasama nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga kapatid na kasama nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na pangmaramihan ay isang tuwirang utos sa mga mambabasa. Ang “Batiin ninyo” ang natural at maikling anyo sa konteksto ng mga pangwakas na pagbati ni Pablo.
- source_word: Ἀσύγκριτον
  choice: Asincrito
  rationale: Pangalang pantangi; isinalin sa baybay na madaling bigkasin sa Filipino habang pinananatili ang pagkakakilanlan ng pangalang Griyego.
- source_word: Φλέγοντα
  choice: Flegon
  rationale: Pangalang pantangi; tinumbasan sa anyong malapit sa nominative na Griyegong Φλέγων at natural sa ortograpiyang Filipino.
- source_word: Ἑρμῆν
  choice: Hermes
  rationale: Pangalang pantangi sa talaan ng mga binabati. Pinanatiling “Hermes” at malinaw na ibinukod sa kasunod na “Hermas.”
- source_word: Πατροβᾶν
  choice: Patrobas
  rationale: Pangalang pantangi; transliterasyong malinaw at madaling makilala sa Filipino.
- source_word: Ἑρμᾶν
  choice: Hermas
  rationale: Pangalang pantangi; pinanatili ang pagkakaiba nito sa naunang pangalang “Hermes.”
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: ang mga kapatid na kasama nila
  rationale: Tuwirang ipinahahayag ng “kasama nila” ang σὺν αὐτοῖς. Ang “mga kapatid” ay natural na katawagan sa Filipino para sa ἀδελφούς at pinananatili ang anyo at pangkomunidad na diwa ng Griyego nang hindi nagdaragdag ng kasariang hindi tahasang sinabi.
theological_decisions:
- issue: Kahulugan ng ἀδελφούς sa pagbati sa isang pangkat
  choice: mga kapatid
  alternative: mga kapwa mananampalataya
  rationale: Ang Griyego ay pangmaramihang panlalaki sa anyo, ngunit karaniwan itong katawagan ni Pablo sa mga kabilang sa pamayanang sumasampalataya. Ang “mga kapatid” ay kapuwa malapit sa anyo ng orihinal at likas sa wikang Filipino; hindi nito tahasang nilulutas kung puro lalaki o halo-halo ang tinutukoy na pangkat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa sunod-sunod na mga pangalan at “gayundin” upang natural na iugnay ang pangkat na kasama nila.
