  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: tl
  text: na itinaya ang sarili nilang mga leeg alang-alang sa buhay ko[a]. Hindi lamang ako ang nagpapasalamat sa kanila, kundi pati ang lahat ng mga iglesya ng mga Hentil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “inilagay nila sa ilalim ang sarili nilang leeg,” isang idyoma para sa pagharap sa panganib na ikamatay. Isahan ang “leeg” sa Griyego bilang kolektibong larawan.
    reason: Ipinaliliwanag ang kongkretong Griyegong idyoma at ang isahang anyo ng “leeg” sa pinagmulan.
  - marker: b
    text: O “ng mga bansa.”
    reason: Ibinibigay ang mas literal na kahulugan ng ἐθνῶν habang ang pangunahing teksto ay gumagamit ng karaniwang kahulugang Paulino na “mga Hentil.”
lexical_decisions:
- source_word: οἵτινες
  choice: na
  rationale: Nagpapakilala ito ng sugnay na naglalarawan kina Priscila at Aquila sa naunang talata; likas sa Tagalog ang pang-ugnay na “na” para mapanatili ang kaugnayang iyon.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: alang-alang sa buhay ko
  rationale: Sa konteksto, ang ψυχή ay tumutukoy sa pisikal na buhay ni Pablo, hindi partikular sa di-materyal na kaluluwa. Pinananatili ng “alang-alang sa” ang di-tiyak na saklaw ng ὑπέρ nang hindi tahasang idinaragdag ang layuning “iligtas.”
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: itinaya ang sarili nilang leeg
  rationale: Likas at malinaw sa modernong Tagalog ang “itinaya” bilang paglalarawan ng pagharap sa panganib, habang pinananatili ng “leeg” ang kongkretong larawan ng Griyegong idyoma sa halip na lubusang palitan ito ng “buhay.”
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: Hindi lamang ako ang nagpapasalamat sa kanila, kundi pati
  rationale: Pinananatili nito ang diin na hindi lamang si Pablo ang kumikilala at nagpapasalamat sa kanilang ginawa.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: ang lahat ng iglesya
  rationale: Tumutukoy ito sa malawak na pangkat ng mga lokal na kapulungan; karaniwan at malinaw sa Tagalog na salin-Biblia ang “mga iglesya,” ngunit dahil sa “lahat ng,” natural ding gamitin ang payak na kolektibong “iglesya.”
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa kontekstong Paulino, karaniwang tumutukoy ang ἔθνη sa mga di-Judio. Mas malinaw na naihahayag ng “mga Hentil” ang etniko at panrelihiyong kaibahan kaysa sa literal na “mga bansa.”
theological_decisions:
- issue: Kahulugan ng ψυχή
  choice: buhay
  alternative: kaluluwa
  rationale: Ang agarang konteksto ay pagharap sa nakamamatay na panganib para kay Pablo, kaya ang tinutukoy ay ang buhay niya, hindi isang tiyak na pahayag tungkol sa kalikasan ng kaluluwa.
- issue: Kahulugan ng ἐθνῶν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Pinakamalamang na tinutukoy ni Pablo ang mga iglesyang binubuo ng mga di-Judio; pinananatili nito ang mahalagang ugnayan ng mga Judio at Hentil sa Roma nang hindi nagdaragdag ng denominasyonal na pagbasa.
- issue: Larawan ng paglalagay ng leeg sa panganib
  choice: itinaya ang sarili nilang leeg
  alternative: isinapanganib ang sarili nilang buhay
  rationale: Pinananatili ng salin ang matinding kongkretong larawan ng orihinal habang ipinahihiwatig pa rin ang pagharap sa panganib na ikamatay; hindi nito tinutukoy ang eksaktong pangyayaring hindi naman inilalahad sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “itinaya ang sarili nilang leeg” upang mapanatili ang matingkad na larawan ng orihinal, at “alang-alang sa buhay ko” upang maiwasang magdagdag ng layuning hindi tahasang sinasabi. Ang simula sa “na” ay sadyang nagpapanatili sa gramatikal na ugnayan nito sa naunang talata.
