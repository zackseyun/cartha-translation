id: ROM.16.20
reference: Romans 16:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: tl
  text: At malapit nang durugin ng Diyos ng kapayapaan si Satanas sa ilalim ng inyong mga paa. Sumainyo nawa ang biyaya ng ating Panginoong Jesu-Cristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Jesus na Mesiyas.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: ang Diyos ng kapayapaan
  rationale: Pinananatili ang tuwirang anyong henitibo at ang kinikilalang katawagan ni Pablo sa Diyos, nang hindi ito pinalalawak bilang isang pagpapakahulugan.
- source_word: συντρίψει
  choice: durugin
  rationale: Malinaw na naghahayag ang pandiwang nasa hinaharap ng tiyak na pagkilos. Ang “durugin” ay natural sa larawang “sa ilalim ng inyong mga paa” at nagpapanatili sa diwa ng ganap na pagkatalo.
- source_word: τὸν Σατανᾶν
  choice: si Satanas
  rationale: Ginagamit sa Griyego bilang pantanging pangalan, kaya pinananatili ang nakaugaliang transliterasyon sa halip na isalin bilang “ang Kalaban.”
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: sa ilalim ng inyong mga paa
  rationale: Pinananatili ang karaniwang larawan ng tagumpay at pagpapasuko. Ang “inyong” ay maramihan at tumutukoy sa buong pamayanan ng mga mananampalataya sa Roma.
- source_word: ἐν τάχει
  choice: malapit nang
  rationale: Sa konteksto, mas natural itong nagpapahayag ng nalalapit na pangyayari kaysa sa bilis lamang ng pagsasagawa.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang natural at matatag na salin ng mahalagang terminong Paulino sa pormula ng pagpapala.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ng ating Panginoon
  rationale: Pinananatili ang henitibong kaugnayan sa “biyaya” at ang karaniwang katawagang “Panginoon.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa modernong Tagalog, ang “Jesu-Cristo” ay dignified at pamilyar na anyo ng parirala sa isang pangwakas na pagpapala, kung saan ang Χριστός ay maaari nang marinig bilang bahagi ng nakaugaliang pangalan; ang tahasang titulong “Jesus na Mesiyas” ay itinatala bilang alternatibo.
- source_word: μεθ’ ὑμῶν
  choice: sumainyo nawa
  rationale: Ipinahahayag ng natural na pormula ng pagpapala sa Tagalog ang ipinahihiwatig na pandiwa at ang diwa ng “makasama ninyo.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa pangwakas na pagpapala
  choice: Cristo sa anyong “Jesu-Cristo”
  alternative: Jesus na Mesiyas
  rationale: Maaaring gumana rito ang Χριστός bilang nakaugaliang elementong parang pangalan sa pormula ng pagpapala, kaya natural ang “Jesu-Cristo” sa Tagalog. Gayunman, tunay pa rin ang pinagmulan at puwersa nitong pamagat na “Mesiyas,” kaya pinananatili ang alternatibo sa talababa sa halip na tuluyang lutasin ang posibilidad.
- issue: Ugnayan ng Diyos ng kapayapaan at ng marahas na larawang “durugin”
  choice: panatilihin ang parehong pahayag nang walang pagpapalambot
  alternative: ang Diyos na nagbibigay ng kapayapaan ay magpapatalo kay Satanas
  rationale: Sinadyang magkatabi sa teksto ang katawagang “Diyos ng kapayapaan” at ang matinding larawan ng pagdurog kay Satanas. Hindi dapat alisin ang teolohikal na tensiyong ito sa pamamagitan ng paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na may dignified na himig. Ginamit ang “At malapit nang” upang natural na maisama ang δέ at ἐν τάχει, at ang “sumainyo nawa” bilang karaniwang pormula ng basbas. Pinanatili ang maramihang “inyong” at “sumainyo” upang makita ang sama-samang pagtukoy sa iglesya.
