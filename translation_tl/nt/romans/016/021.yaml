  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: tl
  text: Binabati kayo ni Timoteo, ang aking kamanggagawa, at gayundin sina Lucio, Jason, at Sosipatro, na mga kauri ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kamag-anak ko” o “mga kapwa ko Judio.” Ang salitang Griyego ay maaaring tumukoy sa mga kamag-anak sa pamilya o sa mas malawak na pagkakaugnay sa lahi o bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: Binabati
  rationale: Sa konteksto ng liham, ang ἀσπάζομαι ay karaniwang nangangahulugang bumati o magpaabot ng pagbati. Ang “Binabati” ay tuwiran at natural sa makabagong Filipino.
- source_word: ὑμᾶς
  choice: kayo
  rationale: Panghalip na ikalawang panauhang maramihan, na tumutukoy sa lahat ng tumatanggap ng liham.
- source_word: συνεργός
  choice: kamanggagawa
  rationale: Ipinahihiwatig nito ang taong kasamang gumagawa sa iisang gawain. Ang “kamanggagawa” ay malinaw at likas sa Filipino, at hindi nililimitahan ang gawain sa isang sekular o institusyonal na konteksto.
- source_word: Τιμόθεος
  choice: Timoteo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: Λούκιος
  choice: Lucio
  rationale: Ginamit ang natural at nakaugaliang transliterasyon sa Filipino.
- source_word: Ἰάσων
  choice: Jason
  rationale: Pinanatili ang karaniwang anyo ng pangalang ginagamit sa Filipino.
- source_word: Σωσίπατρος
  choice: Sosipatro
  rationale: Tuwirang isinasalin sa baybay-Filipino ang buong anyong Σωσίπατρος sa talatang ito, sa halip na ang pinaikling anyong Sopater na matatagpuan sa ibang konteksto.
- source_word: συγγενεῖς
  choice: mga kamag-anak
  rationale: Ang salita ay maaaring tumukoy sa mga kamag-anak sa pamilya o, sa mas malawak na diwa, sa mga kabilang sa iisang lahi o bayan. Ang “mga kamag-anak” ang pinakanatural na pangunahing salin sa Filipino, habang inilalahad sa talababa ang mas malawak na posibleng kahulugan.
theological_decisions:
- issue: Kahulugan ng συγγενεῖς μου sa gamit ni Pablo
  choice: mga kamag-anak ko
  alternative: mga kalahi ko; mga kapwa ko Judio
  rationale: Hindi tinitiyak ng talata kung malalapit na kamag-anak ang tinutukoy o mga taong kaugnay ni Pablo bilang kapwa Judio. Pinanatili sa pangunahing teksto ang karaniwang kahulugang pampamilya at hayagang binanggit sa talababa ang mas malawak na etnikong posibilidad, sa halip na pagpasyahan ang hindi tiyak sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang iisang pangungusap ng Griyego habang inayos ang pagkakasunod upang maging natural sa Tagalog. Ang mga pangalan ay nasa karaniwang anyong Filipino, at ang talababa ay nagpapanatili sa tunay na kalabuan ng συγγενεῖς.
