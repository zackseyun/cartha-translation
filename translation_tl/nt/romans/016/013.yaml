base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: tl
  text: Batiin ninyo si Rufo[a], ang hinirang sa Panginoon, at ang kanyang ina, na ina ko rin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang natatangi sa Panginoon.” Ang pang-uring Griyego ay maaari ring magpahiwatig ng “mahusay” o “namumukod-tangi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang maramihang pautos ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “Batiin ninyo.”
- source_word: Ῥοῦφον
  choice: Rufo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Rufus.
- source_word: ἐκλεκτὸν
  choice: hinirang
  rationale: Pinananatili nito ang pangunahing diwang “pinili” o “hinirang” nang hindi ito ginagawang teknikal na terminong pangdoktrina.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Ang “sa Panginoon” ay nagpapanatili sa ugnayan o saklaw na ipinahahayag ng ἐν, sa halip na tahasang tukuying ang Panginoon ang gumaganap ng pagpili.
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: ang kanyang ina na itinuring din akong anak
  rationale: Ipinahahayag nito sa natural na Tagalog ang eliptikong “kanyang ina at [ina] ko,” na sa konteksto ay tumutukoy sa mapagmahal na relasyong parang mag-ina, hindi sa literal na pagiging ina ni Pablo.
theological_decisions:
- issue: Kahulugan ng ἐκλεκτὸν ἐν κυρίῳ
  choice: “ang hinirang sa Panginoon,” na nagpapanatili sa diwa ng pagkahirang kaugnay ng Panginoon
  alternative: “ang natatangi sa Panginoon” o “ang mahusay na lingkod ng Panginoon”
  rationale: Maaaring tumukoy ang ἐκλεκτός sa isang hinirang o sa isang natatangi at kapuri-puri. Pinananatili ng pangunahing salin ang teolohikal na posibilidad ng pagkahirang, habang inilalahad sa talababa ang leksikal na alternatibo nang hindi nagpapasya para sa isang makitid na sistemang pangdoktrina.
- issue: Kahulugan ng τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: Ang ina ni Rufo ay naging parang ina kay Pablo sa pamamagitan ng pagturing sa kanya bilang anak
  alternative: Literal na ina rin siya ni Pablo
  rationale: Bagaman literal at eliptiko ang Griyegong “kanyang ina at [ina] ko,” mas malamang sa kontekstong panlipunan at pangliham na mapagmahal na ugnayang pampamilya ang tinutukoy. Nililinaw ito sa paraang natural sa Tagalog.
translation_notes:
  register: Makabagong Filipino na magalang at angkop sa pagbasa sa Kasulatan. Ginamit ang “pati” upang likas na maiugnay ang ikalawang pagbati, at nilinaw ang elipsis tungkol sa ina sa paraang madaling maunawaan ng karaniwang mambabasa.
