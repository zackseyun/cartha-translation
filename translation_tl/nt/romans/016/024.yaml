base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: tl
  text: Nawa’y sumainyo ang lahat ang biyaya ng ating Panginoong Jesus, ang Mesiyas.[a] Amen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ating Panginoong Jesu-Cristo.” Ang Griyegong Χριστός ay maaaring katawanin ng tradisyonal na transliterasyong “Cristo”; dito ay isinaling “Mesiyas” upang mapanatili ang kahulugan nito bilang titulo.'
    reason: alternative_reading
  - marker: b
    text: May mga manuskritong naglalaman ng pangungusap na ito, ngunit wala ito sa iba; minamarkahan ito ng maraming makabagong edisyon bilang tekstuwal na variant sa pangwakas na bahagi ng Roma.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwang salitang Paulino para sa mapagkaloob na kagandahang-loob ng Diyos; pinananatili ng “biyaya” ang teolohikal at nakaugaliang diwa nito.
- source_word: κυρίου
  choice: Panginoon
  rationale: Likas at kinikilalang salin ng κύριος bilang titulo ni Jesus at malinaw na nagpapahayag ng kanyang pagkapanginoon.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesus, ang Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa halip na ituring lamang na bahagi ng pangalan; ang kuwit at “ang” ay nagbibigay ng natural na anyong Tagalog.
- source_word: μετὰ πάντων ὑμῶν
  choice: sumainyong lahat
  rationale: Natural at marangal na pormula ng pagpapala sa Tagalog na pinananatili ang inklusibong saklaw ng πάντων ὑμῶν.
- source_word: Ἀμήν
  choice: Amen
  rationale: Pamilyar na transliterasyong liturhikal sa Tagalog at angkop na pangwakas na pagpapatibay.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa Ἰησοῦ Χριστοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay nananatili ang lakas ng Χριστός bilang titulo. Ipinauunawa ng “Mesiyas” ang kahulugan nito, samantalang inilalagay sa talababa ang tradisyonal na transliterasyong “Cristo” upang hindi itago ang lehitimong alternatibo.
- issue: Di-tahas na pandiwa sa pormula ng pagpapala
  choice: Nawa’y sumainyong lahat
  alternative: Sumainyong lahat
  rationale: Walang tahasang pandiwa sa Griyego. Ang “Nawa’y” ay likas na naghahayag sa Tagalog ng hinihiling na pagpapala nang gawing tiyak ang anumang hindi sinasabi ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pamilyar na pormulang “Nawa’y sumainyo” para sa basbas, habang iniwasan ang labis na arkaikong ayos. Ang “Jesus, ang Mesiyas” ay malinaw sa karaniwang mambabasa at pinananatili ang titular na diwa ng Χριστός.
