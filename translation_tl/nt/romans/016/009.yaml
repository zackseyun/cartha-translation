base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: tl
  text: Batiin ninyo si Urbano, ang ating kamanggagawa sa Mesiyas[a], at si Estaquis, ang minamahal ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “kay Cristo.”'
    reason: Alternatibong salin ng ἐν Χριστῷ at ng titulong Χριστός.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang maramihang pautos ay likas na ipinapahayag sa modernong Tagalog bilang “Batiin ninyo,” na angkop sa talaan ng mga pagbati.
- source_word: Οὐρβανὸν
  choice: Urbano
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang Latin na Urbanus na kinakatawan ng Griyegong Οὐρβανός.
- source_word: συνεργὸν ἡμῶν
  choice: ating kamanggagawa
  rationale: Tumpak na ipinapahayag ng “kamanggagawa” ang taong gumagawang kasama ng iba, at ng “ating” ang ugnayan niya kay Pablo at sa mga kasamahan nito.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Pinananatili ng “sa” ang malawak na diwa ng Griyegong ἐν—saklaw, kaugnayan, o pakikiisa—nang hindi ito nililimitahan sa iisang paliwanag. Isinalin ang Χριστός bilang titulong “Mesiyas” sa kontekstong ito.
- source_word: Στάχυν
  choice: Estaquis
  rationale: Isinulat ang personal na pangalan sa anyong madaling bigkasin ayon sa ponolohiya at ortograpiyang Filipino.
- source_word: ἀγαπητόν μου
  choice: na minamahal ko
  rationale: Natural at mainit itong pahayag sa Tagalog at pinananatili ang personal na pagmamahal na ipinahihiwatig ng ἀγαπητός.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: kay Cristo
  rationale: Ang “sa Mesiyas” ay nagpapanatili sa titulo ng Χριστός at sa sadyang malawak na ugnayang ipinahihiwatig ng ἐν. Inilagay sa talababa ang tradisyonal at natural ding “kay Cristo” nang hindi pinipili ang isang mas makitid na teolohikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” upang ipakita ang maramihang pautos, “kamanggagawa” para sa pakikipagtulungan, at “minamahal ko” upang mapanatili ang init ng personal na pagbati.
