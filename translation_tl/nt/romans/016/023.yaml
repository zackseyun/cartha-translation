reference: Romans 16:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: tl
  text: Binabati kayo ni Gayo, na tumatanggap sa akin at sa buong iglesya sa kanyang tahanan. Binabati rin kayo ni Erasto, ang ingat-yaman ng lungsod,[a] at ni Cuarto, ang kapatid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapangasiwa ng lungsod.” Mas malawak ang maaaring kahulugan ng salitang Griyego, bagaman malamang na isang opisyal sa pananalapi ng lungsod ang tinutukoy rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: Binabati
  rationale: Karaniwang gamit ito sa mga pangwakas na pagbati sa mga liham ni Pablo. Likas at tuwiran sa makabagong Tagalog ang “binabati kayo.”
- source_word: ξένος
  choice: nagpapatuloy
  rationale: Bagaman maaari itong mangahulugang “dayuhan” o “panauhin,” ipinakikita ng konteksto at ng pariralang “sa buong iglesya” na si Gayo ang tumatanggap at nagpapatuloy sa iba.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: buong iglesya
  rationale: Tumutukoy ang ἐκκλησία sa pamayanang Kristiyano, at pinananatili ng “buong” ang saklaw ng ὅλης.
- source_word: οἰκονόμος τῆς πόλεως
  choice: ingat-yaman ng lungsod
  rationale: Ang οἰκονόμος ay tagapangasiwa o katiwala; sa kontekstong pansibiko, malamang na tumutukoy ito sa isang opisyal na nangangasiwa sa pananalapi ng lungsod.
- source_word: ἀδελφός
  choice: ang kapatid
  rationale: Pinananatili nito ang panlalaking pang-isahang katawagan at ang tiyak na artikulo ng Griyego nang hindi nagdaragdag ng panghalip na wala sa teksto.
theological_decisions:
- issue: Kahulugan ng ἐκκλησία sa pagbating ito
  choice: iglesya
  alternative: kapulungan; kongregasyon
  rationale: Sa gamit ni Pablo, karaniwang tumutukoy ito sa pamayanang Kristiyano. Ang “iglesya” ay malinaw at likas nang hindi nagdaragdag ng partikular na kaayusang eklesiyastikal.
- issue: Paglalarawan kay Cuarto bilang ὁ ἀδελφός
  choice: ang kapatid
  alternative: kapatid natin; isang kapatid sa pananampalataya
  rationale: Walang tahasang “natin” o “sa pananampalataya” sa Griyego. Pinananatili ng salin ang maikli at tiyak na anyo ng teksto at hinahayaang ang konteksto ang magpahiwatig na kapwa mananampalataya siya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagpapatuloy” bilang likas na pandiwa para sa mapagpatuloy na pagtanggap sa tahanan. Inilagay ang panandang [a] pagkatapos ng “ingat-yaman ng lungsod,” ang pariralang tunay na tinutukoy ng talababa.
