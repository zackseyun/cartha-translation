review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pagtukoy kina Andronico at Junia, sa mga kalahi ni Pablo, sa kanilang pagkabihag na kasama niya, at sa kanilang pagkauna kay Pablo sa Mesiyas. Gayunman, ang “Kilala sila sa mga apostol” ay mas madaling unawain bilang kilala sila ng mga apostol, samantalang ang pangunahing daloy ng Griyego ay mas natural na tumutukoy sa kanilang pagiging tanyag o namumukod-tangi sa apostolikong pangkat. Dapat panatilihin sa talababa ang alternatibong pagkaunawang “kilala ng mga apostol.”
  naturalness: Natural ang pangkalahatang rehistro. Mas idiomatiko at mas malinaw ang “Tanyag sila sa mga apostol” kaysa “Kilala sila sa mga apostol,” habang ang talababa ang magpapaliwanag ng tunay na kalabuan ng parirala.
  terminology: Ang “Mesiyas” ay angkop para sa Χριστός bilang titulo. Ang “mga kalahi ko” ay maingat na pinananatili ang posibleng diwang mga kababayan/kapwa Judio nang hindi ito nililimitahan sa malalapit na kamag-anak. Ang “Junia” at ang talababa tungkol sa “Junias” ay angkop.
  issues:
