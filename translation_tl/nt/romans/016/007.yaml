  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: tl
  text: Batiin ninyo sina Andronico at Junia[a], na mga kalahi ko at mga kapwa ko bilanggo. Tanyag sila sa mga apostol[b], at nauna silang mapabilang sa Mesiyas kaysa sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Junia: maaari ring “Junias,” isang panlalaking pangalan; ngunit mas malamang ang pambabaeng Junia batay sa anyong Griyego at makasaysayang paggamit.'
    reason: alternative_reading
  - marker: b
    text: O, “namumukod-tangi sila sa hanay ng mga apostol”; maaari rin itong unawain bilang “kilala sila ng mga apostol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Likas at malinaw na pautos sa makabagong Tagalog, at pinananatili ang tuwirang diwa ng pagbati.
- source_word: Ἀνδρόνικον
  choice: Andronico
  rationale: Karaniwang anyong Tagalog ng pangalang Griyego.
- source_word: Ἰουνίαν
  choice: Junia
  rationale: Pinakamalamang na pambabaeng pangalan ayon sa anyong Griyego at makasaysayang gamit; inilalagay sa talababa ang hindi gaanong malamang na Junias.
- source_word: συγγενεῖς μου
  choice: mga kalahi ko
  rationale: Sa gamit ni Pablo, maaaring tumukoy sa mga kababayan o kapwa Judio, hindi lamang sa malapit na kamag-anak. Pinananatili ng “kalahi” ang ugnayang etniko nang hindi nagpapanggap na tiyak ang antas ng pagkakamag-anak.
- source_word: συναιχμαλώτους μου
  choice: mga kapwa ko bilanggo
  rationale: Malinaw at natural na katumbas ng mga taong nakaranas ng pagkabilanggo kasama ni Pablo.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: Kilala sila sa mga apostol
  rationale: Pinananatili ang papuri at sadyang hindi lubusang nilulutas kung kabilang sila sa mga apostol o lubos na kinikilala ng mga ito; inilalahad sa talababa ang mga pangunahing posibilidad.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: nauna silang mapabilang sa Mesiyas kaysa sa akin
  rationale: Ipinahahayag ang temporal na pagkauna at ang kalagayang “nasa Mesiyas” sa natural na Tagalog, nang hindi tahasang pinapaliit ito sa isang pormula lamang ng pagbabalik-loob.
theological_decisions:
- issue: Kasarian at pagkakakilanlan ng Ἰουνίαν
  choice: Junia, isang pambabaeng pangalan
  alternative: Junias, isang panlalaking pangalan
  rationale: Ang pambabaeng Junia ang higit na sinusuportahan ng anyong Griyego at makasaysayang paggamit. Binabanggit sa talababa ang alternatibo dahil naging mahalaga ito sa kasaysayan ng pagpapakahulugan.
- issue: Diwa ng ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: Kilala sila sa mga apostol
  alternative: Tanyag sila sa mga apostol; kilalang-kilala sila ng mga apostol
  rationale: Maaaring ipahiwatig ng parirala na tanyag sila bilang kabilang sa pangkat ng mga apostol, o na mataas ang pagkilala sa kanila ng mga apostol. Hindi tahasang nilulutas ng salin ang tunay na sintaktiko at teolohikal na tensiyon.
- issue: Paglilipat ng ἐν Χριστῷ
  choice: mapabilang sa Mesiyas
  alternative: nasa Mesiyas; naging mananampalataya sa Mesiyas
  rationale: Ang “mapabilang sa Mesiyas” ay natural sa Tagalog at pinananatili ang ugnayang ipinahahayag ng idyomang Paulino nang hindi ito ginagawang tahasang paliwanag lamang tungkol sa conversion.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sina” para sa natural na pagtukoy sa dalawang tao, “Mesiyas” para sa Χριστός bilang titulo, at mga talababa upang panatilihin ang tunay na kalabuan tungkol kay Junia at sa kaugnayan nila sa mga apostol.
