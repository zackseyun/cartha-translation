    issue: Ang “Kilala sila sa mga apostol” ay hindi sapat na naihahatid ang pangunahing puwersa ng ἐπίσημοι ἐν τοῖς ἀποστόλοις.
    rationale: Sa modernong Tagalog, karaniwang nangangahulugan ito na kilala sila ng mga apostol. Bagaman isang lehitimong alternatibong pagbasa iyon, ang pangunahing teksto ay dapat maghatid ng pagiging tanyag/notable; ang alternatibo ay dapat nasa talababa.
