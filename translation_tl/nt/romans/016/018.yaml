id: ROM.16.18
reference: Romans 16:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: tl
  text: Sapagkat ang gayong mga tao ay hindi naglilingkod sa ating Panginoong Mesiyas[a], kundi sa sarili nilang tiyan[b]; at sa pamamagitan ng matatamis na pananalita at pambobola ay nililinlang nila ang mga puso ng mga walang hinala[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ating Panginoong Cristo.”
    reason: alternative_reading
  - marker: b
    text: Literal na “sarili nilang tiyan,” isang matingkad na larawan ng makasariling pagnanasa o pagpapakasasa.
    reason: lexical_alternative
  - marker: c
    text: O, “mga inosente” o “mga walang daya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: gayong mga tao
  rationale: Likas na tumutukoy pabalik sa mga taong lumilikha ng pagkakabaha-bahagi sa naunang talata at pinananatili ang puwersang demonstratibo ng salita.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: ating Panginoong Mesiyas
  rationale: Isinalin ang κύριος bilang “Panginoon” at ang Χριστός bilang titulong “Mesiyas”; hindi idinagdag ang “Jesus” dahil wala ito sa tekstong Griyego.
- source_word: δουλεύουσιν
  choice: naglilingkod
  rationale: Malinaw at likas sa Filipino ang pandiwang ito, at napapanatili nito ang tuwirang paghahambing ng paglilingkod sa Panginoon at sa sariling tiyan.
- source_word: κοιλίᾳ
  choice: tiyan
  rationale: Pinananatili ang kongkreto at matalinghagang larawan ni Pablo sa halip na agad itong ipakahulugang “pagnanasa” o “sariling kapakanan.”
- source_word: χρηστολογίας
  choice: matatamis na pananalita
  rationale: Ipinahahayag nito ang kaaya-aya at mapanghikayat na pananalitang ginagamit upang makapanlinlang.
- source_word: εὐλογίας
  choice: pambobola
  rationale: Sa konteksto, hindi tunay na pagpapala ang tinutukoy kundi mapagmanipulang papuri; malinaw at pangkaraniwan sa modernong Filipino ang “pambobola.”
- source_word: ἐξαπατῶσι
  choice: nililinlang
  rationale: Tumpak na naghahatid ng sadyang pandaraya at mas angkop sa dignidad ng pangungusap kaysa sa mas kolokyal na mga pagpipilian.
- source_word: καρδίας
  choice: mga puso
  rationale: Pinananatili ang karaniwang biblikal na larawan para sa kalooban at panloob na pagkatao, sa halip na paliitin ito sa isip lamang.
- source_word: ἀκάκων
  choice: mga walang hinala
  rationale: Sa babalang kontekstong ito, ipinakikita nito ang pagiging madaling malinlang nang hindi ipinahihiwatig na mangmang o may kasalanan ang mga tinutukoy.
theological_decisions:
- issue: Paglilipat ng Χριστός bilang titulo kay Jesus
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang Χριστός ay isang titulong katumbas ng “Mesiyas,” kaya isinalin ang kahulugan nito sa pangunahing teksto habang inilalagay sa talababa ang nakaugaliang anyong “Cristo.”
- issue: Matalinghagang “tiyan” bilang pinaglilingkuran
  choice: Pinanatili ang literal na larawang “sarili nilang tiyan”
  alternative: sarili nilang mga pagnanasa o pansariling kapakanan
  rationale: Hindi tahasang nililimitahan ng Griyego ang larawan sa isang uri lamang ng pagnanasa; ang literal na anyo ay nagpapanatili sa talas at lawak ng paghahambing ni Pablo.
- issue: Saklaw ng ἀκάκων
  choice: mga walang hinala
  alternative: mga inosente o mga walang daya
  rationale: Pinakamalinaw sa konteksto ng panlilinlang ang kanilang kawalan ng paghihinala, ngunit pinananatili sa talababa ang tunay na leksikal na lawak ng salita.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang iisang masalimuot na pangungusap ng Griyego sa tulong ng tuldok-kuwit; ang “matatamis na pananalita at pambobola” ay likas sa kasalukuyang gamit at malinaw ang mapanlinlang na konteksto.
