id: ROM.16.2
reference: Romans 16:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: tl
  text: upang tanggapin ninyo siya sa Panginoon sa paraang karapat-dapat sa mga banal, at tulungan ninyo siya sa anumang bagay na kakailanganin niya sa inyo, sapagkat siya mismo ay naging tagatangkilik ng marami[a], maging ako man.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagtaguyod,” “tagatulong,” o “tagapangalaga.” Ipinahihiwatig ng salitang Griyego ang isang babaeng naglaan ng makabuluhang suporta o pagtangkilik sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: tanggapin ninyo
  rationale: Ipinapahayag nito ang magiliw at mabuting pagtanggap kay Febe sa pamayanan; natural ito sa modernong Tagalog nang hindi nagdaragdag ng diwa na wala sa Griyego.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: Pinananatili ang karaniwang pananalita ni Pablo tungkol sa pakikipag-ugnayan at pakikisama na nakasentro sa Panginoon.
- source_word: ἀξίως τῶν ἁγίων
  choice: sa paraang karapat-dapat sa mga banal
  rationale: Pinananatili ang kahulugan ng paraan o asal na angkop sa mga kabilang sa banal na bayan ng Diyos.
- source_word: παραστῆτε αὐτῇ
  choice: tulungan ninyo siya
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pag-alalay o pagbibigay ng kinakailangang tulong; mas natural sa Tagalog ang 'tulungan' kaysa literal na 'tumayo sa tabi niya.'
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: sa anumang bagay na kakailanganin niya sa inyo
  rationale: Sinasalamin ang malawak na kahulugan ng πρᾶγμα bilang bagay, usapin, o gawain at ang di-tiyak na kondisyon ng ἄν.
- source_word: προστάτις
  choice: tagapagtaguyod
  rationale: Ipinahihiwatig nito ang isang babaeng aktibong nagkakaloob ng suporta, proteksiyon, o pagtangkilik. Mas matimbang ito kaysa pangkalahatang 'katulong' at hindi nito nililimitahan ang tulong sa salapi lamang.
- source_word: ἐμοῦ αὐτοῦ
  choice: pati na rin ng sarili ko
  rationale: Pinananatili ang dagdag at mariing pagbanggit ni Pablo sa kanyang sarili.
theological_decisions:
- issue: Paglalarawan sa papel ni Febe sa προστάτις
  choice: tagapagtaguyod
  alternative: tagatangkilik; tagatulong; tagapangalaga
  rationale: Ang salita ay malamang na nagpapahiwatig ng mahalaga at maaaring kinikilalang papel sa pagsuporta sa iba. Hindi ito pinahihina bilang karaniwang pagtulong, ngunit hindi rin ito ginagawang tiyak na katungkulang pansimbahan na hindi tahasang sinasabi ng teksto.
- issue: Kahulugan ng οἱ ἅγιοι
  choice: mga banal
  alternative: banal na bayan ng Diyos; mga mananampalataya
  rationale: Pinananatili ang katawagang madalas gamitin ni Pablo para sa mga taong ibinukod ng Diyos, nang hindi ipinahihiwatig na tumutukoy lamang ito sa isang natatanging uri ng mga Kristiyano.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'mga banal' bilang establisadong katawagang Paulino at 'tagapagtaguyod' upang mapanatili ang bigat at lawak ng papel ni Febe.
