  terminology: Ang “Epeneto,” “iglesia,” “unang bunga,” at “Mesiyas” ay angkop. Pinananatili ng “unang bunga” ang metapora ng ἀπαρχή, at hindi pinipilit ng pangunahing teksto ang interpretasyong “unang sumampalataya.”
