  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: tl
  text: Batiin din ninyo ang iglesia sa kanilang bahay.[a] Batiin ninyo si Epeneto, ang minamahal ko, na siyang unang bunga ng Asia para sa Mesiyas.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang iglesiang nagtitipon sa kanilang bahay.”
    reason: lexical_alternative
  - marker: b
    text: Ang Asia rito ay ang lalawigang Romano ng Asia, hindi ang makabagong kontinente.
    reason: cultural_note
  - marker: c
    text: O, “na siyang unang sumampalataya sa Mesiyas sa Asia.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: ang iglesiang nagtitipon sa kanilang bahay
  rationale: Ipinahahayag nang natural sa modernong Tagalog na ang kapulungan ay nagtitipon sa bahay nila, habang pinananatili sa talababa ang mas literal na anyo.
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ito ang karaniwan at angkop na salin sa talaan ng mga pagbati sa isang liham.
- source_word: Ἐπαίνετον
  choice: Epeneto
  rationale: Isinulat ang personal na pangalan ayon sa anyong madaling bigkasin at nakasanayan sa Tagalog.
- source_word: ἀγαπητόν μου
  choice: ang minamahal ko
  rationale: Pinananatili nito ang mainit na personal na pagmamahal ni Pablo sa natural at marangal na Tagalog.
- source_word: ἀπαρχὴ
  choice: unang bunga
  rationale: Pinananatili ang talinghaga ni Pablo tungkol sa unang bunga sa halip na agad itong ipakahulugang unang sumampalataya.
- source_word: τῆς Ἀσίας
  choice: sa Asia
  rationale: Sa konteksto, tumutukoy ito sa lalawigang Romano ng Asia; mas natural sa Tagalog ang 'sa Asia' para sa taong unang bunga mula roon.
- source_word: εἰς Χριστόν
  choice: para sa Mesiyas
  rationale: Pinananatili ang ugnayan o layuning ipinahihiwatig ng εἰς at isinasalin ang Χριστός bilang titulong 'Mesiyas.'
theological_decisions:
- issue: Pagsasalin sa Χριστόν
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap dito ang Χριστός bilang titulo; malinaw sa modernong Tagalog ang 'Mesiyas' at hindi nito dinaragdagan ang teksto ng natatanging doktrinal na pakahulugan.
- issue: Kahulugan ng ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: unang bunga sa Asia para sa Mesiyas
  alternative: unang sumampalataya sa Mesiyas sa Asia
  rationale: Pinananatili sa pangunahing teksto ang tunay na talinghagang 'unang bunga,' samantalang inilalagay sa talababa ang malamang na kontekstuwal na kahulugan upang hindi tahimik na lutasin ang idyomatikong pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “iglesia” para sa ἐκκλησία, “unang bunga” upang mapanatili ang talinghaga, at “Mesiyas” bilang titulo. Ang lahat ng panandang talababa ay lumilitaw sa pangunahing teksto.
