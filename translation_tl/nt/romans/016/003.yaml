  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: tl
  text: Batiin ninyo sina Prisca at Aquila[a], na mga kamanggagawa ko sa Mesiyas na si Jesus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Prisca ang anyo ng pangalan dito sa Griyego; ang Priscilla ang mas pamilyar na anyong ginagamit sa ibang talata para sa taong ito rin.
    reason: alternative_reading
  - marker: b
    text: O “sa Cristo Jesus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na pangmaramihan ay karaniwang tagubilin sa liham na ipaabot ang pagbati; natural at tuwiran sa modernong Tagalog ang “Batiin ninyo.”
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Pinananatili ang anyo ng pangalang nasa tekstong Griyego, Πρίσκαν, sa halip na kusang palitan ito ng mas pamilyar na Priscilla.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalang Ἀκύλας.
- source_word: τοὺς συνεργούς μου
  choice: na mga kamanggagawa ko
  rationale: Ipinapahayag ng συνεργούς ang mga taong kasamang gumagawa ni Pablo sa iisang gawain. Ang “mga kamanggagawa ko” ay malinaw, likas, at hindi makaluma; ipinakikita ng “na” na paglalarawan ito kina Prisca at Aquila.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang pinananatili ng “sa” ang malawak na maaaring kahulugan ng ἐν—saklaw, kaugnayan, o pakikiisa—nang hindi ito nililimitahan sa iisang paliwanag.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστῷ sa pormulang ἐν Χριστῷ Ἰησοῦ
  choice: Mesiyas
  alternative: Cristo
  rationale: May bisa pa rito ang Χριστός bilang titulo ni Jesus. Kaya “Mesiyas” ang nasa pangunahing teksto, samantalang inilalagay sa talababa ang nakaugaliang anyong “Cristo” para sa pagiging malinaw at pamilyar.
- issue: Saklaw ng ἐν sa ἐν Χριστῷ Ἰησοῦ
  choice: sa
  alternative: kaisa ng
  rationale: Hindi tahasang nilulutas ng payak na “sa” kung ang diin ay nasa saklaw ng paglilingkod, kaugnayan, o pakikiisa kay Jesus; sa gayon, napapanatili ang lawak ng pariralang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang pangmaramihang “ninyo” ayon sa pandiwang Griyego, “sina” para sa dalawang pangalan, at “kamanggagawa” bilang natural na katawagan sa magkakasamang naglilingkod.
