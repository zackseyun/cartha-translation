id: ROM.16.12
reference: Romans 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: tl
  text: Batiin ninyo sina Trifena at Trifosa,[a] na nagpagal sa Panginoon. Batiin ninyo si Persis, ang minamahal,[b] na nagpagal nang husto sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na mga nagpapagal sa Panginoon” o “na mga nagsikap nang husto sa Panginoon.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang minamahal.” Walang tahasang “aking” sa Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Sa talaan ng mga pagbati sa isang liham, ito ang likas at tuwirang salin ng maramihang pautos.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trifena at Trifosa
  rationale: Isinalin sa baybay na madaling bigkasin at natural sa makabagong Filipino ang mga personal na pangalan.
- source_word: τὰς κοπιώσας
  choice: na mga nagpagal
  rationale: Ipinahihiwatig ng κοπιάω ang masikap at nakapapagod na paggawa. Pinananatili rin ng “nagpagal” ang ugnayang leksikal nito sa kaparehong pandiwa tungkol kay Persis.
- source_word: ἐν κυρίῳ
  choice: sa Panginoon
  rationale: 'Pinananatili nito ang siksik na pormulang Paulino: maaaring tumukoy sa paggawa sa loob ng kaugnayan at pakikiisa sa Panginoon, hindi lamang sa paggawa para sa kaniya.'
- source_word: Περσίδα
  choice: Persis
  rationale: Tuwirang transliterasyon ng personal na pangalan sa anyong angkop sa Filipino.
- source_word: τὴν ἀγαπητήν
  choice: ang minamahal
  rationale: Tumpak nitong pinananatili ang tiyak na paglalarawan nang hindi nagdaragdag ng panghalip na paari gaya ng “aking,” na wala sa Griyego.
- source_word: πολλὰ ἐκοπίασεν
  choice: nagpagal nang husto
  rationale: Ang “nang husto” ay natural na nagpapahayag sa Filipino ng lawak o tindi na idinudulot ng adberbiyal na πολλὰ, habang inuulit ng “nagpagal” ang parehong salitang-ugat na ginamit sa unang sugnay.
theological_decisions:
- issue: Saklaw ng ἐν κυρίῳ sa paglalarawan ng paglilingkod
  choice: sa Panginoon
  alternative: para sa Panginoon / sa paglilingkod sa Panginoon
  rationale: Hindi nililimitahan ng “sa Panginoon” ang parirala sa layunin lamang; naiiwan nitong bukas ang diwa ng paggawa sa loob ng kaugnayan at pakikiisa sa Panginoon.
- issue: Kung may paari sa paglalarawan kay Persis
  choice: ang minamahal
  alternative: aking minamahal
  rationale: Walang μου (“aking”) sa tekstong Griyego, kaya hindi nagdagdag ng tiyak na paari o antas ng personal na pagiging malapit.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nagpagal” upang maipahayag ang masidhi at nakapapagod na paggawa at upang mapanatili ang pag-uulit ng κοπιάω sa dalawang bahagi ng talata. Ang “sa Panginoon” ay likas sa Filipino at hindi nagpapaliit sa mayamang diwa ng pariralang Paulino.
