  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: dalawang babae ang inilalarawang nagpagal sa Panginoon, at si Persis ay tinatawag na “ang minamahal” at sinasabing nagpagal nang husto sa Panginoon. Gayunman, mas malinaw na mapananatili ang ayos at saklaw ng τὴν ἀγαπητήν sa pamamagitan ng appositional na “si Persis, ang minamahal,” kaysa “ang minamahal na si Persis.”'
