  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: tl
  text: Batiin ninyo sina Filologo at Julia[a], si Nereo at ang kanyang kapatid na babae, si Olimpas, at lahat ng mga banal na kasama nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng “Julias,” kung ituturing itong panlalaking pangalan; karaniwang nauunawaan ang anyong Griyego bilang pambabaeng pangalang “Julia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Batiin ninyo
  rationale: Ang aorist middle imperative na pangmaramihan ay isang tagubilin na ipaabot ang pagbati; natural at tuwiran sa makabagong Tagalog ang “Batiin ninyo.”
- source_word: Φιλόλογον
  choice: Filologo
  rationale: Pangalang pantangi; isina-Tagalog ang transliterasyon ayon sa karaniwang tunog at baybay.
- source_word: Ἰουλίαν
  choice: Julia
  rationale: Pinakanatural na unawain ang anyong Griyego bilang pambabaeng pangalang Julia; pinanatili sa talababa ang di-gaanong malamang na panlalaking pagbasa.
- source_word: Νηρέα
  choice: Nereo
  rationale: Pangalang pantangi; ginamit ang natural na anyong transliterado sa Tagalog.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: ang kanyang kapatid na babae
  rationale: Malinaw na tinutukoy ng ἀδελφή ang isang kapatid na babae, at ang αὐτοῦ ay tumutukoy kay Nereo.
- source_word: Ὀλυμπᾶν
  choice: Olimpas
  rationale: Pangalang pantangi; transliterasyong angkop sa baybay at bigkas ng Tagalog.
- source_word: τοὺς σὺν αὐτοῖς
  choice: na kasama nila
  rationale: Ang σύν na may datibo ay nagsasaad ng pakikisama o kaugnayan; maikli at natural ang “kasama nila.”
- source_word: πάντας ἁγίους
  choice: ang lahat ng banal
  rationale: Ang ἅγιοι ay karaniwang tawag ni Pablo sa mga mananampalataya bilang mga taong ibinukod sa Diyos. Pinananatili ng “mga banal” ang terminong teolohikal nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Paglilipat ng ἅγιοι sa listahan ng mga binabati ni Pablo
  choice: mga banal
  alternative: mga taong banal; banal na bayan ng Diyos
  rationale: Ang “mga banal” ay maikli, pamilyar sa wikang biblikal, at pinananatili ang karaniwang katawagan ni Pablo sa mga kapwa mananampalataya nang hindi ipinahihiwatig na tumutukoy lamang ito sa mga taong pormal na kinanonisa.
- issue: Kasarian ng pangalang Ἰουλίαν
  choice: Julia
  alternative: Julias
  rationale: Mas malamang na pambabaeng pangalang Julia ang anyong ito ayon sa karaniwang gamit ng pangalan. Gayunman, itinala sa talababa ang iminungkahing panlalaking pagbasa upang hindi maitago ang limitadong kalabuan sa kasaysayan ng pagsasalin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” sa unang pares ng pangalan at “si” sa mga kasunod upang maging natural ang listahan, habang pinanatili ang lahat ng ugnayan at diin ng tekstong Griyego.
