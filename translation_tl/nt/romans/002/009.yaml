  source_fidelity: 'Ang pangkalahatang kahulugan ay tapat sa Griyego: ang magkatambal na θλῖψις at στενοχωρία, ang saklaw na “bawat kaluluwa,” ang gumagawa ng masama, at ang pagkakasunod na Judio muna at Griego rin ay napanatili. Gayunman, ang “matinding dalamhati” ay mas karaniwang tumutukoy sa matinding pagdadalamhati o grief at ang “matinding” ay hindi tahasang nasa pinagmulan. Ang “kapighatian at kagipitan” ay mas malapit sa pares na affliction/distress at mas angkop sa konteksto ng paghatol.'
  naturalness: Natural at marangal ang balangkas ng pangungusap. Mas idiomatiko at semantikong angkop ang “kapighatian at kagipitan” kaysa “paghihirap at matinding dalamhati.” Inilipat din ang talababa para malinaw na ang alternatibong “bawat tao” ay tumutukoy sa “bawat kaluluwa ng taong,” hindi sa “masama.”
  terminology: Ang “Judio” at “Griego” ay wastong panatilihin sa paulit-ulit na paghahambing ni Pablo. Ang “kaluluwa” ay katanggap-tanggap na malapit na salin ng ψυχή, na may talababa para sa mas natural na alternatibong “tao.”
  issues:
  - severity: medium
    issue: Hindi tugma ang puwesto ng talababa a sa tinutukoy nitong leksikal na alternatibo.
    rationale: Ang talababa a ay nag-aalok ng “sa bawat tao” o “sa bawat taong nilalang,” mga alternatibo para sa ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου. Sa draft, nakakabit ito sa “masama,” kaya waring tumutukoy ito sa τὸ κακόν. Dapat itong ilagay kasunod ng “kaluluwa ng taong.”
  - severity: low
    issue: Ang “matinding dalamhati” ay hindi pinakatumpak na katumbas ng στενοχωρία sa pares nito.
    rationale: Ang dalamhati sa modernong Filipino ay madalas grief o pagdadalamhati; ang kagipitan ay mas angkop na nagsasaad ng distress/anguish at pinananatili ang kaibhan nito sa kapighatian. Ang dagdag na “matinding” ay hindi kinakailangan upang maipahayag ang puwersa ng Griyego.
  revised_text: Darating ang kapighatian at kagipitan sa bawat kaluluwa ng taong[a] gumagawa ng masama—una sa Judio at gayundin sa Griego.[b]
