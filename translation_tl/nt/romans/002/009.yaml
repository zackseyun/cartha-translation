  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: tl
  text: Darating ang kapighatian at kagipitan sa bawat kaluluwa ng taong[a] gumagawa ng masama—una sa Judio at gayundin sa Griego.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bawat tao” o “sa bawat taong nilalang.”
    reason: lexical_alternative
  - marker: b
    text: Sa paghahambing na “Judio at Griego,” ang “Griego” ay tumutukoy sa di-Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: paghihirap
  rationale: Malinaw at likas na salitang Filipino para sa matinding hirap o kapighatiang dulot ng paghatol; naiiba pa rin ito sa kasunod na στενοχωρία.
- source_word: στενοχωρία
  choice: matinding dalamhati
  rationale: Ipinahahayag ang matinding panloob na hapis o pagkabagabag at bumubuo ng natural na tambalan sa “paghihirap,” nang hindi pinagsasama ang dalawang salitang Griyego sa iisang diwa.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: sa bawat kaluluwa ng tao
  rationale: Pinananatili ang kongkretong larawan ng ψυχή at ang pangkalahatang saklaw ng ἀνθρώπου. Ipinaliliwanag sa talababa ang mas natural na alternatibong tumutukoy sa bawat tao.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: ng taong gumagawa ng masama
  rationale: Likas at tuwirang Filipino para sa substantival participle at sa pangkalahatang diwa ng τὸ κακόν, nang hindi ipinapalagay na minsanan lamang o sistematikong gawain ito.
- source_word: Ἰουδαίου
  choice: Judio
  rationale: Tumutukoy sa bayang Judio sa etniko-relihiyosong paghahambing ni Pablo, hindi lamang sa isang naninirahan sa Judea.
- source_word: Ἕλληνος
  choice: Griego
  rationale: Pinananatili ang mismong salita at paulit-ulit na tambalang Judio/Griego sa Roma; ang di-Judio ang diwa nito sa kontekstong ito.
- source_word: πρῶτον
  choice: una
  rationale: Tuwiran at likas na katumbas na nagpapanatili sa pagkakasunod o prayoridad nang hindi nililinaw nang lampas sa sinasabi ng teksto.
theological_decisions:
- issue: Kung lalagyan ng tahasang pandiwa ang maikli at walang pandiwang sugnay sa Griyego
  choice: Darating ang paghihirap at matinding dalamhati...
  alternative: Paghihirap at matinding dalamhati sa bawat kaluluwa...
  rationale: Kailangan ng natural na sugnay sa Filipino ang isang panaguri. Ang “Darating” ay nagpapalinaw sa magiging paghatol sa konteksto nang hindi nagdaragdag ng partikular na doktrina.
- issue: Kung isasalin ang Ἕλλην bilang “Griego” o ipapakahulugang “di-Judio”
  choice: Griego
  alternative: di-Judio
  rationale: Pinananatili ng “Griego” ang aktuwal na katawagan ni Pablo at ang mahalagang tambalang Judio/Griego, habang inilalagay sa talababa ang kontekstuwal na saklaw nito.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang solemneng larawan ng “kaluluwa” at ang katawagang “Griego,” ngunit nilinaw sa mga talababa ang kanilang natural at kontekstuwal na kahulugan.
