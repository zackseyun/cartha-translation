  text: At kumbinsido kang ikaw mismo ay gabay ng mga bulag at ilaw ng mga nasa kadiliman,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: kumbinsido ka
  rationale: Ipinapahayag ng aspektong perpekto ang matatag at nagpapatuloy na paniniwala sa sarili; natural sa modernong Filipino ang “kumbinsido ka.”
- source_word: τε
  choice: At
  rationale: Iniuugnay ng kataga ang sugnay na ito sa naunang pahayag nang hindi ito labis na binibigyang-diin.
- source_word: σεαυτόν
  choice: ikaw mismo
  rationale: Pinananatili ang diin ng panghalip na pabalik sa sarili at ang himig ng pagtitiwala sa sariling katayuan.
- source_word: ὁδηγόν
  choice: gabay
  rationale: Natural at tumpak itong katumbas para sa isang umaakay, lalo na sa metaporikal na gamit.
- source_word: τυφλῶν
  choice: ng mga bulag
  rationale: Pinananatili ang pangkalahatang pagtukoy sa mga taong bulag at ang ugnayan nito sa “gabay.”
- source_word: φῶς
  choice: ilaw
  rationale: Malinaw at karaniwang metapora ito para sa nagbibigay-liwanag o patnubay.
- source_word: τῶν ἐν σκότει
  choice: ng mga nasa kadiliman
  rationale: Pinananatili ang personal na pagtukoy at ang metapora ng espirituwal o moral na kadiliman nang hindi nililinaw nang higit sa Griyego.
