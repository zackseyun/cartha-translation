  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang tuwirang pakikipag-usap sa isahang “ka/ikaw,” ang retorikal na tiwala sa sarili, at ang magkatambal na metaporang “gabay” at “ilaw.”
