  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: tl
  text: Ngunit kaluwalhatian, karangalan, at kapayapaan ang tatanggapin ng bawat gumagawa ng mabuti[a]—una ang Judio, at gayundin ang Griego.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung ano ang mabuti.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Griego” rito ay malamang na tumutukoy nang mas malawak sa di-Judio, samakatuwid ay sa Hentil.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Karaniwang salin ito na nagpapanatili sa bigat ng pagkilala at gantimpalang tinutukoy sa konteksto.
- source_word: τιμή
  choice: karangalan
  rationale: Likas itong katumbas sa Filipino at malinaw na kaagapay ng “kaluwalhatian.”
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Pinananatili nito ang malawak na biblikal na diwa nang hindi nililimitahan sa panloob na kapanatagan o panlipunang pagkakasundo lamang.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: ng bawat gumagawa
  rationale: Malinaw at natural itong nagpapahayag ng taong kinikilala sa patuloy o nakaugaliang paggawa.
- source_word: τὸ ἀγαθόν
  choice: ng mabuti
  rationale: Natural sa modernong Filipino; maaari ring unawain nang mas tahasan bilang “kung ano ang mabuti.”
- source_word: Ἰουδαίῳ
  choice: ang Judio
  rationale: Direkta at karaniwang salin ng katawagang etniko-relihiyoso; ang isahan ay kumakatawan sa pangkat.
- source_word: πρῶτον
  choice: una
  rationale: Pinananatili ang maikli at hindi ipinaliliwanag na pagkakasunod na nasa Griyego.
- source_word: Ἕλληνι
  choice: ang Griego
  rationale: Pinananatili ang literal na katawagan at ang paulit-ulit na pares na “Judio at Griego” kay Pablo; nililinaw sa talababa ang mas malawak na gamit nito.
- source_word: δὲ
  choice: ngunit
  rationale: Ipinakikita ang malinaw na pagsalungat sa poot at kapighatiang binanggit sa naunang talata.
theological_decisions:
- issue: Kahulugan ng Ἕλληνι sa paghahambing ni Pablo sa Judio at Griego
  choice: “Griego” sa pangunahing teksto, na may talababa tungkol sa mas malawak na kahulugang di-Judio o Hentil
  alternative: Hentil
  rationale: Literal na “Griego” ang salita, ngunit sa pares na ito ay madalas nitong saklawin ang mga di-Judio. Pinananatili ng pangunahing teksto ang anyo ng orihinal habang iniiwasan ng talababa ang sobrang makitid na pagkaunawa.
- issue: Paraan ng pagpapahayag ng tatlong pangngalang δόξα, τιμή, at εἰρήνη
  choice: Idinagdag ang “ang tatanggapin” bilang likas na elipsis sa Filipino
  alternative: “ngunit kaluwalhatian, karangalan, at kapayapaan sa bawat…”
  rationale: Walang tahasang pandiwa sa Griyego, ngunit hinihingi ng natural at malinaw na Filipino ang pandiwang nauunawaan mula sa konteksto. Hindi nito tinutukoy kung paano o kailan ibibigay ang mga ito.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “Judio” at “Griego” bilang dignified at karaniwang biblikal na katawagan. Inayos ang mga marker upang ang [a] ay kasunod ng “mabuti” at ang [b] ay kasunod ng “Griego,” alinsunod sa kani-kanilang talababa.
