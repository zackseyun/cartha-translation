id: ROM.2.1
reference: Romans 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: tl
  text: Kaya wala kang maidadahilan, O tao[a]—ikaw, sinuman kang humahatol. Sapagkat sa paghatol mo sa iba, hinahatulan mong may sala ang sarili mo, dahil ikaw na humahatol ay gumagawa rin ng gayunding mga bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tao” rito ay panlalaking isahan sa Griyego ngunit kumakatawan sa sinumang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Likas na panandang Filipino para sa kongklusyon o paghihinuha mula sa naunang pangangatwiran.
- source_word: ἀναπολόγητος
  choice: wala kang maidadahilan
  rationale: Malinaw at natural na ipinahahayag na walang maihaharap na sapat na depensa o dahilan.
- source_word: ὦ ἄνθρωπε
  choice: O tao
  rationale: Pinananatili ang tuwirang retorikal na panawagan ng Griyego; ang ἄνθρωπος dito ay kumakatawan sa sinumang tao, hindi lamang sa lalaki.
- source_word: πᾶς ὁ κρίνων
  choice: ikaw, sinuman kang humahatol
  rationale: Ipinapakita ang pangkalahatang saklaw ng πᾶς habang nananatiling tuwiran at natural ang pakikipag-usap sa iisang mambabasa.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: sa paghatol mo sa iba
  rationale: 'Pinananatili ang siksik na temporal at instrumental na diwa: sa mismong kilos at batayan ng paghatol sa iba ay nahahatulan din ang sarili.'
- source_word: κατακρίνεις
  choice: hinahatulan mong may sala
  rationale: Mas mariin ito kaysa simpleng ‘humahatol’ at malinaw na naipapahayag ang mapanghatol o kondemnatoryong puwersa ng pandiwa.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: gumagawa rin ng gayunding mga bagay
  rationale: Ipinahihiwatig ng kasalukuyang panahunan ang aktuwal o nagpapatuloy na asal, at pinananatili ang pagkakatulad ng mga gawa.
- source_word: ὁ κρίνων
  choice: ikaw na humahatol
  rationale: Pinananatili ang participial na pagkakakilanlan ng mismong kausap bilang taong humahatol.
theological_decisions:
- issue: Ang saklaw ng panawagang ὦ ἄνθρωπε
  choice: Panatilihin ang literal at retorikal na ‘O tao’ sa pangunahing teksto, na may talababa tungkol sa kinakatawang saklaw nito.
  alternative: O sinumang tao; O taong humahatol
  rationale: Ang pangngalan ay nasa panlalaking isahan sa Griyego ngunit pangkalahatan ang tinutukoy. Iniiwasan ng salin na limitahan ang pagsaway sa mga lalaki lamang nang hindi pinapantay ang natatanging retorikal na anyo ng orihinal.
- issue: Ang lakas ng κατακρίνεις kumpara sa κρίνεις
  choice: Isalin bilang ‘hinahatulan mong may sala.’
  alternative: hinahatulan mo; isinusumpa mo
  rationale: Ipinakikita nito ang mas mabigat na hatol laban sa sarili nang hindi idinaragdag ang ideya ng walang hanggang kaparusahan na hindi tahasang sinasabi sa talata.
translation_notes:
  register: Makabago at dignified na Filipino. Pinanatili ang retorikal na ‘O tao,’ ngunit ginawang malinaw at natural ang kasunod na pangkalahatang pagtukoy sa ‘sinuman kang humahatol.’
