  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: tl
  text: Ngunit kung tinatawag mong Judio ang iyong sarili[a], at umaasa ka sa Kautusan[b], at ipinagmamalaki mo ang Diyos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taglay mo ang pangalang Judio” o “tinatawag kang Judio.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sumasandig ka sa Kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili ang kondisyonal na diwa ng εἰ at ang bahagyang pagsalungat o pagpapatuloy na ipinahihiwatig ng δέ.
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Sa Roma, pangunahing tumutukoy ito sa pagkakakilanlang etniko at panrelihiyon, hindi lamang sa heograpiya.
- source_word: ἐπονομάζῃ
  choice: tinatawag mong Judio ang iyong sarili
  rationale: Likas at malinaw na ipinapahayag sa Filipino ang reflexive na diwa ng middle voice at ang pag-angkin sa katawagang ito.
- source_word: ἐπαναπαύῃ
  choice: umaasa ka sa
  rationale: Ipinahahayag ang pagtitiwala o pagsandig, sa halip na literal na pagpapahinga, habang pinananatili ang mapanuring himig ni Pablo.
- source_word: νόμῳ
  choice: Kautusan
  rationale: Ang malaking titik at tiyak na anyo ay malinaw na tumutukoy sa kinikilalang Kautusang Mosaiko sa konteksto.
- source_word: καυχᾶσαι
  choice: ipinagmamalaki mo
  rationale: Natural sa kasalukuyang Filipino at pinananatili ang retorikal at maaaring mapanuring lakas ng pandiwa.
- source_word: ἐν θεῷ
  choice: ang Diyos
  rationale: Sa pandiwang 'ipinagmamalaki,' ang tuwirang layon ang pinakanatural na anyo sa Filipino at naghahatid ng diwang ipinagmamalaki o ipinagyayabang ang kaugnayan sa Diyos.
theological_decisions:
- issue: Diwa ng καυχᾶσαι ἐν θεῷ
  choice: ipinagmamalaki mo ang Diyos
  alternative: nagmamapuri ka sa Diyos
  rationale: Pinananatili ang posibilidad na tumukoy ito sa pagmamapuri dahil sa Diyos o sa ipinapalagay na natatanging kaugnayan sa kanya, nang hindi tahasang hinahatulan o pinupuri ang pagmamapuri bago pa man umusad ang argumento.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio” at “Kautusan” bilang pamilyar na katawagang biblikal; pinanatili ang pangungusap na bukas dahil nagpapatuloy ang kondisyong sinimulan ng talata.
