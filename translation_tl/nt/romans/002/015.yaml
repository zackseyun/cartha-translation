  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ipinakikita nila ang ‘gawa ng Kautusan’ na nakasulat sa mga puso, kasabay ng pagsaksi ng budhi at ng pag-akusa o pagtatanggol ng mga pag-iisip. Ang ‘sa kanila’ ay isang posibleng pagpapalinaw sa masiksik na sintaks ng huling parirala, at ang alternatibong diwang tugunan ay maayos na iniingatan sa talababa.'
  naturalness: Malinaw, makabago, at marangal ang Tagalog. Ang ‘budhi,’ ‘nakasulat sa kanilang mga puso,’ at ‘nagpaparatang o nagtatanggol pa nga’ ay likas sa rehistro ng saling Kasulatan. Bahagyang sadyang teknikal ang ‘gawa ng Kautusan,’ ngunit naaayon ito sa layuning huwag agad ipakahulugan ang masiksik na pariralang Griyego.
  terminology: Ang ‘Kautusan’ para sa νόμος at ‘budhi’ para sa συνείδησις ay pare-pareho at angkop. Pinananatili ng ‘gawa ng Kautusan’ ang isahang ἔργον at hindi ipinapalit sa pangunahing teksto ang interpretibong ‘hinihingi ng Kautusan.’ Maayos ang mga talababa at ang mga anchor [a] at [b].
