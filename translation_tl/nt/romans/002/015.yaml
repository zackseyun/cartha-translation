id: ROM.2.15
reference: Romans 2:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: tl
  text: Ipinakikita nila na ang gawa ng Kautusan[a] ay nakasulat sa kanilang mga puso. Nagpapatotoo rin ang kanilang budhi, at ang kanilang mga pag-iisip ay nagpaparatang o nagtatanggol pa nga sa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hinihingi ng Kautusan” o “kung ano ang hinihingi ng Kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang kanilang mga pag-iisip ay nagpaparatang o nagtatanggol pa nga sa isa’t isa”; mas literal na may diwang tugunan ang Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: Ipinakikita nila
  rationale: Likas at malinaw sa makabagong Tagalog, at pinananatili ang diwang nagbibigay sila ng patunay nang hindi ito pinalalakas tungo sa mahigpit na ‘pinatutunayan.’
- source_word: τὸ ἔργον τοῦ νόμου
  choice: ang gawa ng Kautusan
  rationale: Pinananatili ang isahan at siksik na pananalitang ‘gawa ng Kautusan’ sa Griyego sa halip na agad itong ipakahulugang mga hinihingi ng Kautusan.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: nakasulat sa kanilang mga puso
  rationale: Natural na idyomang Tagalog para sa talinghaga ng panloob na pagkakasulat, habang kinakatawan ang maramihang ‘mga puso.’
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: Nagpapatotoo rin ang kanilang budhi
  rationale: Maayos na inililipat ang genitive absolute at ang kasamang pagpapatotoo ng budhi nang hindi nagdaragdag ng tahasang layon na wala sa Griyego.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: ang kanilang mga pag-iisip … sa kanila
  rationale: Binibigyan ng malinaw na pangunahing pagbasa ang siksik at alanganing sintaks; inilalagay sa talababa ang mas literal na katumbas na may diwang tugunan ng ἀλλήλων.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: nagpaparatang o nagtatanggol pa nga
  rationale: Ang ‘nagtatanggol’ ay mas tuwirang katumbas ng ἀπολογουμένων kaysa ‘nagdadahilan,’ at ang ‘pa nga’ ay nagpapahayag ng diin ng καὶ pagkatapos ng ἢ.
theological_decisions:
- issue: Kung ang τὸ ἔργον τοῦ νόμου ay tumutukoy sa panloob na kamalayang moral sa pangkalahatan o tahasang sa hinihingi ng Kautusan
  choice: Panatilihin sa pangunahing teksto ang ‘ang gawa ng Kautusan.’
  alternative: ‘ang hinihingi ng Kautusan’ o ‘kung ano ang hinihingi ng Kautusan’
  rationale: Mas siksik at hindi gaanong nagpapakahulugan ang pananalita sa Griyego; pinananatili ng salin ang tunay na teolohikal na tensiyon at inilalahad sa talababa ang karaniwang paliwanag.
- issue: Kung ang magkakasalungat na pag-iisip ay nagpaparatang o nagtatanggol sa mga tao, o gumagawa nito sa isa’t isa
  choice: Sa pangunahing teksto, ang mga pag-iisip ay ‘nagpaparatang o nagtatanggol … sa kanila.’
  alternative: Ang mga pag-iisip ay ‘nagpaparatang o nagtatanggol sa isa’t isa.’
  rationale: Siksik at maaaring unawain sa higit sa isang paraan ang μεταξὺ ἀλλήλων. Ang pangunahing pagbasa ay malinaw sa Tagalog, habang pinananatili sa talababa ang mas literal na diwang tugunan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘budhi’ bilang karaniwang salin ng συνείδησις at ang ‘Kautusan’ bilang katawagan sa kautusang tinatalakay ni Pablo. Sadyang pinanatili ang bahagyang di-pangkaraniwang ‘gawa ng Kautusan’ upang hindi tahimik na lutasin ang leksikal at teolohikal na kalabuan.
