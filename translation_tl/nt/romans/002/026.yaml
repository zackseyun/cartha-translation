  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: tl
  text: Kaya, kung tinutupad ng taong hindi tuli[a] ang mga hinihingi ng Kautusan, hindi ba ituturing na pagtutuli ang kanyang di-pagkatuli?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “kung tinutupad ng di-pagkatuli ang mga hinihingi ng Kautusan, hindi ba ituturing na pagtutuli ang kanyang di-pagkatuli?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: taong hindi tuli / di-pagkatuli
  rationale: Dalawang ulit ginamit ang pangngalan. Sa unang gamit, malinaw na tao ang tinutukoy kaya natural ang “taong hindi tuli”; sa ikalawa, ang kalagayan niya ang binibilang kaya “kanyang di-pagkatuli” ang angkop. Pinananatili ng talababa ang literal na personipikasyon.
- source_word: δικαιώματα
  choice: mga hinihingi
  rationale: Ipinahahayag nito ang mga itinakdang kahilingan ng Kautusan sa malinaw at kasalukuyang Filipino, nang hindi nagdaragdag ng di-tahasang diin gaya ng “matuwid na mga hinihingi.”
- source_word: νόμου
  choice: ng Kautusan
  rationale: Ang “Kautusan” ay likas na katawagan sa kontekstong tumutukoy sa Kautusan ni Moises at pinananatili ang tiyak na reperensiya sa argumento ni Pablo.
- source_word: φυλάσσῃ
  choice: tinutupad
  rationale: Sa konteksto ng mga utos, ang pandiwa ay tumutukoy sa pagsunod o pagtupad, hindi sa literal na pagbabantay.
- source_word: λογισθήσεται
  choice: ituturing
  rationale: Malinaw nitong ipinapahayag ang pagkilala o pagbilang sa isang kalagayan bilang iba. Ang “ibibilang” ay mas literal ngunit hindi gaanong natural dito sa Filipino.
- source_word: εἰς περιτομήν
  choice: na pagtutuli
  rationale: 'Kasama ng “ituturing,” ipinapakita nito ang katayuang ipinapalagay: ang di-pagkatuli ay itinuturing na pagtutuli.'
- source_word: οὐχ
  choice: hindi ba ... ?
  rationale: Pinananatili nito ang retorikal na tanong na umaasa ng positibong sagot.
- source_word: οὖν
  choice: Kaya
  rationale: Ipinakikita ang lohikal na bunga ng naunang pahayag sa maikli at natural na paraan.
theological_decisions:
- issue: Kung ang talata ay tahasang nagpapahayag ng kaligtasan o pagiging kabilang sa tipan
  choice: Panatilihin lamang ang paghahambing ng di-pagkatuli at pagtutuli batay sa pagtupad sa mga hinihingi ng Kautusan.
  alternative: Ipaliwanag ang di-tuling tao bilang ligtas na Hentil o bilang ganap na kabilang sa tipan.
  rationale: Hindi tahasang tinutukoy ng mismong talata ang kaligtasan o eksaktong katayuan sa tipan; ang gayong paglilinaw ay magpapasya sa isang teolohikal na usaping iniwang nakapaloob sa mas malawak na argumento.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “taong hindi tuli” upang maging natural ang personal na reperensiya, habang pinanatili ang “di-pagkatuli” sa ikalawang gamit upang maipakita ang retorikal at konseptuwal na paghahambing ni Pablo.
