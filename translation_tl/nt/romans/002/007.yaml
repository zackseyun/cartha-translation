  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: tl
  text: Bibigyan niya ng buhay na walang hanggan ang mga taong, sa pamamagitan ng pagtitiyaga sa paggawa ng mabuti, ay naghahangad ng kaluwalhatian, karangalan, at di-pagkabulok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: matiyagang gumagawa ng mabuti
  rationale: Likas sa modernong Tagalog at malinaw na ipinahahayag ang patuloy na pagtitiyaga sa paggawa ng mabuti, nang hindi ginagawang teknikal ang parirala.
- source_word: δόξαν καὶ τιμὴν
  choice: kaluwalhatian, karangalan
  rationale: Karaniwang katumbas sa Tagalog na nagpapanatili sa dalawang magkaugnay ngunit magkahiwalay na layon.
- source_word: ἀφθαρσίαν
  choice: kawalang-kabulukan
  rationale: Pinananatili ang diwa ng pagiging hindi nasisira o dumaranas ng pagkabulok; hindi ito awtomatikong ipinapantay sa imortalidad.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Likas at kinikilalang salin sa Tagalog para sa buhay na walang katapusan.
theological_decisions:
- issue: Ugnayan ng matiyagang paggawa ng mabuti at buhay na walang hanggan
  choice: Isinalin nang tuwiran bilang paglalarawan sa mga bibigyan ng buhay na walang hanggan.
  alternative: Ipaliwanag sa teksto kung ang paggawa ng mabuti ay batayan, katibayan, o bunga ng kaligtasan.
  rationale: Hindi tahasang nilulutas ng talata lamang ang mas malawak na teolohikal na ugnayan; pinananatili ng salin ang tensiyon at iniiwasang magpasok ng paliwanag mula sa isang tradisyon.
- issue: Kahulugan ng ἀφθαρσία
  choice: kawalang-kabulukan
  alternative: imortalidad
  rationale: Ang ἀφθαρσία ay pangunahing tumutukoy sa hindi pagkabulok o pagiging di-nasisira, samantalang ang 'imortalidad' ay maaaring magpahiwatig ng mas tiyak na konseptong karaniwang kaugnay ng ἀθανασία.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Idinagdag ang 'Bibigyan niya' upang likas na maipahayag sa Tagalog ang pandiwang ipinahihiwatig mula sa naunang talata; walang idinagdag na footnote.
