id: ROM.2.22
reference: Romans 2:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: tl
  text: Ikaw na nagsasabing, “Huwag mangalunya,” nangangalunya ka ba? Ikaw na nasusuklam sa mga diyos-diyosan, ninanakawan mo ba ang mga templo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas malawak na diwa, “nilalapastangan mo ba ang mga bagay na banal?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ikaw na nagsasabing
  rationale: Ang artikulo at pangkasalukuyang participle ay substantibal at tuwirang tumutukoy sa kinakausap; natural sa Tagalog ang “Ikaw na nagsasabing” at napapanatili nito ang retorikal na pagharap ni Pablo.
- source_word: μὴ μοιχεύειν
  choice: Huwag mangalunya
  rationale: Ipinahahayag ng μή at infinitive ang nilalaman ng pagbabawal. Ang “mangalunya” ang tuwiran at karaniwang katumbas sa modernong Tagalog.
- source_word: μοιχεύεις
  choice: nangangalunya ka ba
  rationale: Ang pangkasalukuyang indikatibo ay nasa anyong retorikal na tanong. Ang aspektong imperpektibo ng “nangangalunya” ay angkop sa pangkalahatang paratang nang hindi ipinipilit na minsanan lamang o kasalukuyang nagaganap.
- source_word: ὁ βδελυσσόμενος
  choice: Ikaw na nasusuklam
  rationale: Ang βδελύσσομαι ay nagpapahayag ng matinding pagkamuhi o pagkasuklam. Malinaw, natural, at marangal sa kasalukuyang Tagalog ang “nasusuklam.”
- source_word: τὰ εἴδωλα
  choice: mga diyos-diyosan
  rationale: Sa konteksto, tumutukoy ito sa mga imahen o bagay na sinasamba bilang diyos. Ang “mga diyos-diyosan” ay malinaw at karaniwang salin ng εἴδωλα sa Tagalog.
- source_word: ἱεροσυλεῖς
  choice: ninanakawan mo ba ang mga templo
  rationale: Ang kongkretong kahulugan ng ἱεροσυλέω ay pagnanakaw sa templo o sa ari-arian nito. Pinananatili ng saling ito ang talas ng kabalintunaan kaugnay ng mga diyos-diyosan; inilalagay sa talababa ang mas malawak na kahulugan.
theological_decisions:
- issue: Saklaw ng ἱεροσυλεῖς
  choice: ninanakawan mo ba ang mga templo
  alternative: lumalapastangan ka ba sa mga bagay na banal
  rationale: Mas kongkreto at leksikal na pangunahing posibilidad ang pagnanakaw sa mga templo, ngunit tunay ding posible ang mas malawak na diwang sakrilehiyo; kaya hindi ito tahimik na nilulutas at ibinibigay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang magkatulad na hulma ng dalawang retorikal na tanong upang mapanatili ang diin at ritmo ng Griyego.
