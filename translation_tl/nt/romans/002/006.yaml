  text: who will repay each one according to his works[a][b].
translation:
  language: tl
  text: na magbibigay sa bawat isa ng nararapat ayon sa kanyang mga gawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ginawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: na
  rationale: Likas na pang-ugnay na panghalip sa Filipino na tumutukoy pabalik sa Diyos sa naunang konteksto, nang hindi inuulit ang tahasang simuno.
- source_word: ἀποδώσει
  choice: gaganti
  rationale: Ipinapahayag ang pagbibigay sa isang tao ng katumbas o nararapat sa konteksto ng paghatol; hindi nito nililimitahan ang diwa sa gantimpalang positibo lamang.
- source_word: ἑκάστῳ
  choice: sa bawat isa
  rationale: 'Pinananatili ang distributibong diin: ang bawat tao ay isa-isang hahatulan.'
- source_word: κατὰ
  choice: ayon sa
  rationale: Natural at tumpak na nagpapahayag ng pamantayan o batayan.
- source_word: τὰ ἔργα
  choice: mga gawa
  rationale: Direktang katumbas na nagpapanatili ng mahalagang bokabularyong Paulino; maaari ring unawain bilang mga ginawa.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Ang panghalip na Filipino ay angkop sa isahan at likas na walang kasariang tinutukoy, kaya naipapahayag nito ang kinatawang gamit ng panlalaking isahan sa Griyego nang hindi kailangan ng hiwalay na paliwanag.
theological_decisions:
- issue: Paghatol ayon sa mga gawa
  choice: Panatilihin ang pananalitang nagpapahayag ng pagganti ayon sa mga gawa.
  alternative: Palambutin bilang “pakikitunguhan” o limitahan bilang “gagantimpalaan.”
  rationale: Tahasang sinasabi ng talata na ang pagganti ay ayon sa mga gawa. Hindi dapat lutasin ng salin ang tensiyong teolohikal nito sa ibang pagtalakay ni Pablo tungkol sa pagpapawalang-sala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “gaganti” ay nauunawaan bilang pagbibigay ng nararapat, mabuti man o masama, at ang “kanyang” ay likas na gender-neutral sa Filipino.
