  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: tl
  text: Sapagkat walang pagkiling ang Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagtatangi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikitang ang talata ay nagbibigay ng batayan sa naunang pahayag; likas sa makabagong Tagalog ang “Sapagkat” para sa ganitong paliwanag.
- source_word: προσωπολημψία
  choice: pagtatangi
  rationale: Tumutukoy sa pagkiling o pagbibigay ng di-makatarungang pabor batay sa katayuan o panlabas na kalagayan. Ang “pagtatangi” ay malinaw, marangal, at angkop sa kontekstong moral at panghukuman.
- source_word: παρὰ τῷ θεῷ
  choice: ang Diyos
  rationale: Sa likas na Tagalog, pinakamalinaw na naihahayag ang kaugnayang ipinahihiwatig ng pariralang Griyego sa pamamagitan ng sugnay na “walang pagtatangi ang Diyos,” nang hindi binabago ang diwa.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: Sapagkat walang pagtatangi ang Diyos.
  rationale: Pinananatili ang negatibo at pangkalahatang pahayag tungkol sa Diyos, habang iniiwasan ang alanganing literal na “walang pagtatangi sa Diyos,” na maaaring magpahiwatig na ang Diyos ang layon ng pagtatangi.
theological_decisions:
- issue: Pagpapahayag ng kawalang-pagtatangi ng Diyos
  choice: “walang pagtatangi ang Diyos”
  alternative: “hindi nagtatangi ang Diyos”
  rationale: Kapuwa nagpapahayag ng banal na kawalang-pagtatangi. Ang pinili ay mas malapit sa eksistensiyal na anyo ng Griyego, ngunit natural pa rin sa Tagalog at hindi nagdaragdag ng tiyak na kilos na hindi tahasang nasa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagtatangi” bilang karaniwang salitang may sapat na bigat sa kontekstong moral at panghukuman; iniwasan ang mas literal ngunit malabong pariralang “sa Diyos.”
