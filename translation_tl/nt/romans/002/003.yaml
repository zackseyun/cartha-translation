  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: tl
  text: Ngunit iniisip mo ba ito, O tao[a]—ikaw na humahatol sa mga gumagawa ng gayong mga bagay at ikaw rin ay gumagawa ng mga iyon—na makatatakas ka sa hatol ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tao.” Ang salitang Griego ay isang anyong panawag na isahan at tumutukoy sa isang kinatawang tao.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: iniisip mo ba
  rationale: Ipinahahayag nito ang mental na palagay na sinusuri sa retorikal na tanong; natural ito sa makabagong Tagalog nang hindi dinaragdagan ang diwa.
- source_word: ἄνθρωπε
  choice: O tao
  rationale: Pinananatili ang tahasang bokatibong pagtawag sa isang kinatawang tao at ang matalas na estilong diatribo ni Pablo.
- source_word: κρίνων
  choice: humahatol
  rationale: Tuwirang inilalarawan ang moral na paghatol; hindi ito pinalalakas tungo sa mas tiyak na 'humahatol na nagkasala' o 'kumokondena.'
- source_word: πράσσοντας
  choice: gumagawa
  rationale: Likas sa Tagalog at maaaring magpahiwatig ng aktuwal o patuloy na gawi ayon sa konteksto.
- source_word: ποιῶν
  choice: ginagawa
  rationale: Pinananatili ang bahagyang baryasyon sa anyo habang malinaw na ipinaparatang na ginagawa rin ng kausap ang mga iyon.
- source_word: αὐτά
  choice: ang mga iyon
  rationale: Malinaw na ibinabalik ang tinutukoy sa 'gayong mga bagay'; ang 'rin' ang natural na naghahatid ng kontekstuwal na diin sa pagkakapareho ng gawa.
- source_word: ἐκφεύξῃ
  choice: makatatakas ka
  rationale: Tumpak na naghahatid ng pag-iwas o pagtakas sa darating na banal na paghatol at pinananatili ang diin ng hayag na σύ sa 'ka.'
- source_word: κρίμα
  choice: hatol
  rationale: Ang 'hatol' ay natural at may saklaw na hudisyal sa Tagalog; hindi nito nililimitahan ang κρίμα sa kaparusahan lamang.
theological_decisions:
- issue: Saklaw ng κρίμα τοῦ θεοῦ
  choice: hatol ng Diyos
  alternative: paghatol ng Diyos; parusa ng Diyos
  rationale: Pinananatili ng 'hatol' ang hudisyal na diwa at ang maaaring saklaw na pasiya ng Diyos, nang hindi agad ipinapakahulugang kaparusahan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na tanong at ang tuwirang bokatibong “O tao” upang madama ang komprontasyonal na estilo ng talata; ginamit ang “gayong” at “makatatakas” bilang pormal ngunit madaling maunawaang mga anyo.
