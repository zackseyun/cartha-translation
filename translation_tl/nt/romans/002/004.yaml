  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: tl
  text: O hinahamak mo ba ang kasaganaan ng kanyang kabutihan[a], pagpipigil, at pagtitiis, nang hindi mo nalalaman na ang kabutihan ng Diyos ay umaakay sa iyo tungo sa pagsisisi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabaitan” sa dalawang paglitaw ng “kabutihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: saganang
  rationale: Likas sa modernong Tagalog ang pariralang “saganang kabutihan” at malinaw nitong naipahahayag ang talinghaga ng kayamanan bilang kasaganaan, nang hindi nagiging alanganin ang literal na “kayamanan ng kabutihan.”
- source_word: χρηστότητος / τὸ χρηστόν
  choice: kabutihan
  rationale: Saklaw ng “kabutihan” ang mabait at mapagkalingang pakikitungo ng Diyos sa konteksto, at napapanatili ang iisang salin sa dalawang paglitaw ng kaugnay na salitang Griyego.
- source_word: ἀνοχῆς
  choice: pagpipigil
  rationale: Ipinahihiwatig nito ang pagpigil muna sa nararapat na paghatol, hindi ang makabagong diwa ng simpleng pagpaparaya.
- source_word: μακροθυμίας
  choice: pagtitiis
  rationale: Karaniwan, malinaw, at marangal na salitang Tagalog para sa matagal na pagtitimpi o pasensiya.
- source_word: καταφρονεῖς
  choice: hinahamak
  rationale: 'Pinananatili nito ang matalas na pagsaway ng pandiwa: ituring na walang halaga o kasuklaman.'
- source_word: ἀγνοῶν
  choice: hindi mo nalalamang
  rationale: Tapat ito sa participle nang hindi ipinapalagay na sadyang binabalewala ng kausap ang katotohanan.
- source_word: εἰς μετάνοιάν
  choice: tungo sa pagsisisi
  rationale: Ang “tungo sa” ay nagpapanatili sa direksiyonal na puwersa ng εἰς, habang ang “pagsisisi” ang natural at teolohikal na angkop na katumbas ng μετάνοια sa Filipino.
- source_word: ἄγει
  choice: umaakay
  rationale: Inilalarawan nito ang nagpapatuloy at personal na pagkilos ng Diyos nang hindi labis na tinutukoy kung mapipilitan o tiyak na makararating ang tao.
theological_decisions:
- issue: Kung ang χρηστότης / χρηστόν ay isasaling “kabutihan” o “kabaitan.”
  choice: Parehong isinalin na “kabutihan.”
  alternative: “Kabaitan” sa isa o dalawang paglitaw.
  rationale: Mas natural sa pariralang “kabutihan ng Diyos” ang napiling salita at naipakikita pa rin nito ang mapagpalang pakikitungo ng Diyos; inilalagay sa talababa ang mas relasyonal na alternatibo.
- issue: Lakas ng pahayag na ἄγει εἰς μετάνοιαν.
  choice: “umaakay sa iyo tungo sa pagsisisi”
  alternative: “inaakay ka upang magsisi” o “nagdadala sa iyo sa pagsisisi”
  rationale: Pinananatili ng salin ang direksiyon at nagpapatuloy na kilos ng orihinal nang hindi nilulutas kung ang pag-akay ay hindi maiiwasang magbubunga ng pagsisisi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “O” upang mapanatili ang retorikal na pagpapatuloy, at tahasang binanggit ang Diyos sa unang sugnay para luminaw ang tinutukoy ng mga katangian sa natural na Tagalog.
