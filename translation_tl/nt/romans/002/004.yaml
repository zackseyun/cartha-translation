  to: O hinahamak mo ba ang kasaganaan ng kanyang kabutihan[a], pagpipigil, at pagtitiis, nang hindi mo nalalaman na ang kabutihan ng Diyos ay umaakay sa iyo tungo sa pagsisisi?
