id: ROM.2.5
reference: Romans 2:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: tl
  text: Ngunit dahil sa katigasan at di-nagsisising puso mo, nag-iipon ka para sa iyong sarili ng poot sa araw ng poot at ng paghahayag ng matuwid na paghatol ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “makatarungang paghatol ng Diyos.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Ngunit dahil sa
  rationale: Ipinahahayag ng κατά na may accusative ang batayan o sanhi, samantalang pinananatili ng “Ngunit” ang banayad na pagsalungat ng δέ.
- source_word: σκληρότης
  choice: katigasan
  rationale: Pinananatili nito ang metapora ng moral na pagkamanhid at likas itong kaakibat ng “puso” sa Filipino.
- source_word: ἀμετανόητον καρδίαν
  choice: di-nagsisising puso
  rationale: Pinananatili ang larawan ng puso at malinaw sa karaniwang mambabasa; mas natural ito kaysa sa teknikal o makalumang “pusong hindi nagsisisi.”
- source_word: θησαυρίζεις
  choice: nag-iipon
  rationale: Ipinahahayag ang patuloy na pag-iimbak o pagdaragdag, nang hindi ipinahihiwatig ang positibong halaga na maaaring dalhin ng salitang “kayamanan.”
- source_word: σεαυτῷ
  choice: para sa iyong sarili
  rationale: Tuwirang ipinakikita ng reflexive dative na ang bunga ay babalik sa mismong kinakausap.
- source_word: ὀργή
  choice: poot
  rationale: Ang “poot” ay nagpapanatili sa bigat ng banal at makahukom na galit sa kontekstong ito.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: sa araw ng poot at ng paghahayag
  rationale: Ang “sa araw” ay likas na temporal na katumbas ng ἐν ἡμέρᾳ, at pinananatili ang magkatugmang mga pangngalan sa Griyego.
- source_word: δικαιοκρισία
  choice: matuwid na paghatol
  rationale: Ipinahahayag ng tambalang salita ang pagiging tama at makatarungan ng paghatol; ang “matuwid na paghatol” ay malapit sa anyo at diin ng Griyego.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang tahasang pagtukoy sa Diyos at ang ugnayang genitive sa “paghatol.”
theological_decisions:
- issue: Kung gagawing tahasang sugnay ang temporal na parirala, gaya ng “kapag inihayag ang matuwid na paghatol ng Diyos,” o pananatilihin ang nominal na kayarian.
  choice: 'Panatilihin ang nominal na kayarian: “sa araw ng poot at ng paghahayag ng matuwid na paghatol ng Diyos.”'
  alternative: “sa araw ng poot, kapag inihayag ang matuwid na paghatol ng Diyos”
  rationale: Makatuwiran sa konteksto ang alternatibo, ngunit walang tahasang finite verb sa Griyego. Ang napiling anyo ang higit na nagpapanatili sa kayarian at tunay na saklaw ng pahayag.
- issue: Kung ang δικαιοκρισία ay isasaling “matuwid na paghatol” o “makatarungang paghatol.”
  choice: matuwid na paghatol
  alternative: makatarungang paghatol
  rationale: Parehong posible, ngunit ang “matuwid” ay mas malapit sa anyo ng tambalang Griyego at nagpapanatili ng biblikal na diin; inilagay sa talababa ang malinaw na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng matigas na puso, ang bigat ng “poot,” at ang nominal na kayarian ng hulihang parirala nang hindi dinaragdagan ng paliwanag na wala sa Griyego.
