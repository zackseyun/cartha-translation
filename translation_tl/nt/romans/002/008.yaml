  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: tl
  text: 'Ngunit para sa mga inuudyukan ng makasariling ambisyon[a], na sumusuway sa katotohanan ngunit sumusunod sa kalikuan[b]: poot at matinding galit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pansariling pakikipagpaligsahan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kawalang-katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: kumikilos dahil sa makasariling ambisyon
  rationale: Ipinapakita ng ἐξ ang pinagmumulan o motibo ng pagkilos. Ang parirala ay likas sa modernong Tagalog at pinananatili ang diwa ng makasarili at mapagpaligsahang hangarin.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: sumusuway sa katotohanan
  rationale: Pinananatili nito ang moral at kusang-loob na pagsuway na ipinahihiwatig ng ἀπειθέω, hindi lamang kawalan ng paniniwala.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: ngunit sumusunod sa kalikuan
  rationale: Ang 'sumusunod' ay nagpapanatili sa tuwirang pagsalungat sa 'sumusuway,' gaya ng magkatapat na pandiwa sa Griyego.
- source_word: ἀδικίᾳ
  choice: kalikuan
  rationale: Saklaw ng 'kalikuan' ang moral na kasamaan at pagiging salungat sa matuwid sa harap ng Diyos; inilalagay sa talababa ang mas panlipunang diin ng 'kawalang-katarungan.'
- source_word: ὀργὴ
  choice: poot
  rationale: Ang 'poot' ay may maringal at mabigat na himig na angkop sa konteksto ng hatol, higit sa pangkaraniwang 'galit.'
- source_word: θυμός
  choice: matinding galit
  rationale: Ipinakikita nito ang tumitinding puwersa ng ikalawang salita habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: implicit verbal ellipsis
  choice: tutuldok bago ang 'poot at matinding galit'
  rationale: Walang tahasang pandiwa ang pangwakas na parirala sa Griyego. Pinananatili ng tutuldok ang maigsi at mariing kayarian nang hindi nagdaragdag ng pandiwang wala sa talata.
theological_decisions:
- issue: Paglalahad sa ἀδικία sa konteksto ng paghatol ng Diyos
  choice: kalikuan
  alternative: kawalang-katarungan
  rationale: Mas malawak na naipahahayag ng 'kalikuan' ang moral na pagsalungat sa katotohanan, samantalang maaaring unawain ang 'kawalang-katarungan' bilang mas nakatuon sa di-makatarungang pakikitungo. Pinananatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit maringal. Ginamit ang magkapares na 'sumusuway' at 'sumusunod' upang mapanatili ang retorikal na pagsalungat ng Griyego, at pinanatili ang walang-pandiwang pangwakas sa pamamagitan ng tutuldok.
