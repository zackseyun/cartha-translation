- from: Sapagkat ang lahat ng nagkasala nang hiwalay sa Kautusan[a] ay mapapahamak din nang hiwalay sa Kautusan; at ang lahat ng nagkasala sa ilalim ng Kautusan[b] ay hahatulan sa pamamagitan ng Kautusan.[c]
  to: Sapagkat lahat ng nagkasala nang walang Kautusan[a] ay mapapahamak din nang walang Kautusan; at lahat ng nagkasala sa ilalim ng Kautusan[b] ay hahatulan sa pamamagitan ng Kautusan.[c]
  rationale: Pinalitan ang “nang hiwalay sa Kautusan” ng mas likas na “nang walang Kautusan,” na nananatiling tapat sa relasyonal na diwa ng ἀνόμως sa argumento ni Pablo. Nilinaw rin ang mga alternatibo sa talababa nang hindi itinatakda ang pinagtatalunang saklaw ng “Kautusan” o ang anyo ng kapahamakan.
