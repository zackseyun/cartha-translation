  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: tl
  text: Sapagkat lahat ng nagkasala nang walang Kautusan[a] ay mapapahamak din nang walang Kautusan; at lahat ng nagkasala sa ilalim ng Kautusan[b] ay hahatulan sa pamamagitan ng Kautusan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang walang kautusan” o “nang walang pagtalima sa kautusan” sa dalawang paglitaw ng ἀνόμως.
    reason: lexical_alternative
  - marker: b
    text: O “sa Kautusan”; ipinakikita ng “sa ilalim ng Kautusan” ang pagiging nasa saklaw ng kapangyarihan nito.
    reason: lexical_alternative
  - marker: c
    text: O “ayon sa Kautusan” o “sa bisa ng Kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: nang hiwalay sa Kautusan
  rationale: Ipinapakita nito ang kalagayang wala sa saklaw ng Kautusang ibinigay kay Moises, ayon sa paghahambing ni Pablo, sa halip na ipakahulugang basta ‘gumagawa nang labag sa batas.’
- source_word: ἥμαρτον
  choice: nagkasala
  rationale: Likas at tuwirang salin ng aorist na pandiwa, nang hindi dinaragdagan ang pahiwatig tungkol sa paraan o tagal ng pagkakasala.
- source_word: ἀπολοῦνται
  choice: mapapahamak
  rationale: Pinananatili ang tiyak na hinaharap na kapahamakan nang hindi ipinapasya sa salin kung ito ay pagkalipol o isang partikular na anyo ng kaparusahan.
- source_word: ἐν νόμῳ
  choice: sa ilalim ng Kautusan
  rationale: Ipinahahayag ang pagiging nasa saklaw o kapangyarihan ng Kautusan, hindi lamang ang literal na lokasyong ‘sa Kautusan.’
- source_word: διὰ νόμου
  choice: sa pamamagitan ng Kautusan
  rationale: Pinananatili ang Kautusan bilang kasangkapan o batayan ng paghatol at iniiba ang diwa nito sa ἐν νόμῳ.
- source_word: κριθήσονται
  choice: hahatulan
  rationale: Neutral na pananalitang panghukuman ito; hindi nito awtomatikong pinapalitan ang paghatol ng tahasang ‘parurusahan’ o ‘kokondenahin.’
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: ang lahat ng ... at ang lahat ng
  rationale: Malinaw na naihahatid ang saklaw sa bawat pangkat at napapanatili ang magkatimbang na kayarian.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita na ang pangungusap ay nagbibigay ng batayan para sa naunang pahayag ni Pablo.
theological_decisions:
- issue: Tinutukoy ng νόμος
  choice: Ang Kautusang ibinigay kay Moises, na tinawag lamang na ‘Kautusan’ sa teksto
  alternative: Kautusan o batas sa pangkalahatang moral na diwa
  rationale: Ang paghahambing sa Roma 2 ay sa mga Hentil na wala sa saklaw ng Kautusang Mosaiko at sa mga Judio na nasa ilalim nito. Hindi nagdagdag ng ‘ni Moises’ sa pangunahing teksto upang hindi sumobra sa mismong pananalita.
- issue: Diwa ng ἀπολοῦνται at ang pangwakas na paghatol
  choice: ‘mapapahamak,’ nang hindi tinutukoy ang eksaktong anyo ng kahihinatnan
  alternative: ‘malilipol’ o ‘kokondenahin’
  rationale: Tiyak sa talata ang masamang kahihinatnan, ngunit hindi nito rito inilalarawan ang mekanismo o tagal nito; kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang malaking titik sa “Kautusan” upang malinaw na tukuyin ang Kautusang Mosaiko sa konteksto. Pinanatili ang magkatimbang na dalawang sugnay at ang pagkakaiba ng ‘hiwalay sa,’ ‘sa ilalim ng,’ at ‘sa pamamagitan ng.’
