  source_fidelity: Tumpak na naihahatid ng draft ang dalawang magkatambal na pangkat, ang hinaharap na kahihinatnan/paghatol, at ang pagkakaiba ng ἐν νόμῳ at διὰ νόμου. Gayunman, ang “nang hiwalay sa Kautusan” ay hindi ang pinakanatural na Filipino para sa ἀνόμως sa kontekstong ito; mas tuwiran at idiomatiko ang “nang walang Kautusan.”
  naturalness: Ang “nang walang Kautusan” ay mas likas na modernong Filipino kaysa “nang hiwalay sa Kautusan,” habang napapanatili ang paralelismo ng talata. Ang natitirang kayarian ay malinaw at angkop sa marangal na rehistro.
  terminology: Ang “Kautusan,” “nagkasala,” “mapapahamak,” at “hahatulan” ay angkop. Pinananatili ng “sa ilalim ng Kautusan” ang saklaw na ipinahihiwatig ng ἐν νόμῳ, at ng “sa pamamagitan ng Kautusan” ang natatanging gamit ng διὰ νόμου.
