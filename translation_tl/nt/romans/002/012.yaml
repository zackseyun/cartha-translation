    rationale: Bagaman nauunawaan ito, ang ἀνόμως sa paghahambing na ito ay mas natural na maisalin bilang “nang walang Kautusan,” na tumutukoy sa kawalan ng Kautusan bilang pamantayan o saklaw, hindi sa pisikal o sosyal na pagkakahiwalay.
