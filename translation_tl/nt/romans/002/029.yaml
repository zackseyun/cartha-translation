  naturalness: Natural at marangal ang kabuuang Filipino, ngunit hindi magkatugma ang konstruksiyong “sa pamamagitan ng Espiritu, hindi ng nakasulat na kautusan.” Ang pares na “sa espiritu, hindi sa titik” ay mas maayos, maigsi, at nauunawaan sa makabagong biblikal na Filipino.
  terminology: Ang “Judio,” “pagtutuli,” “puso,” at “Diyos” ay angkop. Pinananatili ang “tunay” upang idiomatikong maipahayag ang eliptikong paghahambing ng talata, ngunit inaalis ang ikalawang dagdag na “tunay” upang hindi makadagdag ng diin na wala sa teksto.
