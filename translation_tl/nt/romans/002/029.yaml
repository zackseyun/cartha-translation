id: ROM.2.29
reference: Romans 2:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: tl
  text: Sa halip, ang tunay na Judio ay Judio sa kalooban, at ang pagtutuli ay sa puso—sa espiritu[a], hindi sa titik. Ang papuri sa kanya ay hindi mula sa mga tao kundi mula sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “sa pamamagitan ng Espiritu,” ibig sabihin, sa pamamagitan ng Banal na Espiritu. Maaari rin itong tumukoy sa panloob na espirituwal na realidad, hindi sa panlabas na titik.'
    reason: 'Pinananatili ang ambigwidad ng πνεύματι: maaaring tumukoy ito sa Banal na Espiritu o sa espirituwal/panloob na dimensiyon.'
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: sa kalooban
  rationale: Likas na ipinapahayag nito sa Filipino ang kaibahan ng panloob o nakatagong katotohanan sa panlabas na pagkakakilanlan, nang hindi ito ipinakahulugang isang lihim lamang.
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Ang usapan ay tungkol sa tipan at relihiyosong pagkakakilanlan, hindi lamang sa heograpiya ng Judea.
- source_word: περιτομὴ καρδίας
  choice: pagtutuli ng puso
  rationale: Pinananatili nito ang tahasang metapora ng Griyego at malinaw na itinatapat ang panloob na pagbabago sa pisikal na pagtutuli.
- source_word: ἐν πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: Ang instrumental na diwa at ang kaibahan sa γράμμα ay malamang na tumutukoy sa pagkilos ng Banal na Espiritu; minarkahan ang parirala para mapanatili sa talababa ang tunay na alternatibong pagbasa.
- source_word: οὐ γράμματι
  choice: hindi ng nakasulat na kautusan
  rationale: Sa kontekstong ito, ang γράμμα ay tumutukoy sa panlabas na nakasulat na kodigo o kautusan. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa literal ngunit madaling mapagkamalang pariralang “hindi ng titik.”
- source_word: οὗ ὁ ἔπαινος
  choice: Ang papuri sa kanya
  rationale: Likas na iniuugnay ng panghalip ang papuri sa taong Judio sa kalooban, gaya ng ipinahihiwatig ng panlalaking isahang οὗ.
- source_word: ἐξ ἀνθρώπων
  choice: mula sa mga tao
  rationale: Saklaw ng pangmaramihang ἀνθρώπων ang sangkatauhan sa pangkalahatan at hindi lamang ang mga lalaki.
- source_word: ἐκ τοῦ θεοῦ
  choice: mula sa Diyos
  rationale: Tuwirang salin ito ng parirala nang walang di-kailangang pagpapalawak.
theological_decisions:
- issue: Kung ang πνεύματι ay tumutukoy sa Banal na Espiritu o sa espiritu ng tao/panloob na espirituwal na realidad
  choice: Banal na Espiritu
  alternative: espiritu ng tao o panloob na espirituwal na realidad
  rationale: Sa paggamit ni Pablo, ang pagtutol ng Espiritu sa nakasulat na kautusan ay malamang na tumutukoy sa gawain ng Banal na Espiritu. Gayunman, hindi ganap na nilulutas ng anyong Griyego ang tanong, kaya pinanatili sa talababa ang alternatibo.
- issue: Kung dapat bang idagdag ang salitang “tunay”
  choice: Gamitin ang “tunay” bilang malinaw na pantulong sa eliptikong paghahambing
  alternative: ang Judio ay yaong nasa kalooban
  rationale: Ipinagpapatuloy ng talata ang pagtutol sa naunang pangungusap tungkol sa kung sino ang Judio. Ginagawang natural sa Filipino ng “tunay” ang ipinahihiwatig na panaguri, nang hindi nagsisingit ng bagong uri ng pagka-Judio.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio,” “pagtutuli,” at “Diyos” bilang karaniwan at madaling maunawaang mga terminong biblikal. Ang pag-uulit na “pagtutuli ay pagtutuli ng puso” ay sadyang nagpapanatili sa balangkas at metapora ng Griyego.
