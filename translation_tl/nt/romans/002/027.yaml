id: ROM.2.27
reference: Romans 2:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: tl
  text: At ang taong likas na hindi tuli[a] na tumutupad sa kautusan ay hahatol sa iyo—ikaw na, sa kabila ng nakasulat na kautusan at pagtutuli,[b] ay lumalabag sa kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “ang likas na di-pagtutuli”; tumutukoy ito sa isang taong hindi tuli.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “sa pamamagitan ng titik at pagtutuli.” Ang “titik” ay maaaring tumukoy sa nakasulat na kautusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: ang taong ... hindi tuli
  rationale: Literal itong pangngalang ‘di-pagtutuli,’ ngunit metonimikong tumutukoy rito sa isang taong hindi tuli. Hindi ginamit ang ‘Hentil’ upang hindi magdagdag ng tahasang katawagang etniko na wala sa salita mismo.
- source_word: ἐκ φύσεως
  choice: likas na
  rationale: Pinananatili nito ang diwa ng kalagayang ayon sa kalikasan, nang hindi nililimitahan ang parirala sa mas tiyak na ‘mula sa kapanganakan.’
- source_word: τελοῦσα
  choice: ngunit tumutupad
  rationale: Ipinahahayag ng participle ang aktuwal na pagtupad sa kautusan. Ginamit ang ‘ngunit’ upang maging natural sa Filipino ang malinaw na paghahambing sa konteksto.
- source_word: νόμον
  choice: ang kautusan
  rationale: Tumutukoy sa tiyak at kilalang kautusan sa argumento ni Pablo; ang ‘kautusan’ ang malinaw at dignified na katumbas sa modernong Tagalog.
- source_word: διὰ γράμματος
  choice: bagaman taglay mo ang nasusulat na kautusan
  rationale: Ipinakikita ng γράμμα rito ang nakasulat na anyo ng kautusan. Ang concessive na pagkakabuo ay natural sa Tagalog at tumutugma sa kontekstuwal na punto, samantalang inilalagay sa talababa ang mas literal at sadyang malabong anyo.
- source_word: περιτομῆς
  choice: ang pagtutuli
  rationale: Direkta at pare-parehong tawag ito sa tandang tipan.
- source_word: παραβάτην νόμου
  choice: lumalabag sa kautusan
  rationale: Pinananatili nito ang tahasang kaugnayan ng ‘paglabag’ sa ‘kautusan’ sa natural na Filipino.
theological_decisions:
- issue: Kung gagawing tahasang etniko ang ἀκροβυστία bilang ‘Hentil’
  choice: Panatilihin ang mas makitid na ‘taong ... hindi tuli.’
  alternative: Hentil
  rationale: Bagaman kabilang sa argumento ang pagkakaiba ng Judio at Hentil, ang mismong talata ay gumagamit ng paghahambing ng pagtutuli at di-pagtutuli. Hindi nilulutas ng salin ang pahiwatig sa pamamagitan ng katawagang hindi tahasang nasa Griyego.
- issue: Lakas ng διὰ sa ‘διὰ γράμματος καὶ περιτομῆς’
  choice: Isalin sa pangunahing teksto bilang pribilehiyong taglay ngunit hindi nakapigil sa paglabag; ilagay ang mas literal na anyo sa talababa.
  alternative: sa pamamagitan ng titik at pagtutuli
  rationale: Maaaring instrumental ang anyo ng parirala, ngunit sa konteksto ay inilalarawan nito ang taong may nakasulat na kautusan at pagtutuli ngunit lumalabag pa rin. Pinananatili ng talababa ang leksikal at sintaktikong tensiyon.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang ‘kautusan,’ ‘pagtutuli,’ at ‘lumalabag’ bilang pamilyar ngunit hindi kolokyal na mga terminong biblikal. Inayos ang mahabang konstruksiyong Griyego sa natural na ayos ng Filipino habang pinananatili ang diin sa paghatol at ang paghahambing ng pagtupad at paglabag.
