  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: tl
  text: Kaya ikaw na nagtuturo sa iba, hindi mo ba tinuturuan ang iyong sarili? Ikaw na nangangaral, “Huwag magnakaw,” nagnanakaw ka ba?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Ipinapakita ang paghinuha mula sa naunang argumento sa natural at malinaw na modernong Tagalog.
- source_word: διδάσκων
  choice: na nagtuturo
  rationale: Isinasalin ang substantival participle bilang sugnay na panuring, na natural sa Tagalog at nagpapanatili sa katangiang tinutukoy.
- source_word: ἕτερον
  choice: sa iba
  rationale: Natural na Tagalog para sa pagtuturo sa ibang tao; bagaman isahan ang Griyego, maaaring gamitin ang “iba” nang hindi kinakailangang tumukoy sa maramihan.
- source_word: σεαυτὸν
  choice: ang iyong sarili
  rationale: Pinananatili ang matalim na paghahambing sa pagitan ng pagtuturo sa iba at sa sarili.
- source_word: οὐ διδάσκεις;
  choice: hindi mo ba tinuturuan
  rationale: Pinananatili ang anyong retorikal na tanong at ang mapanuyang pagsaway.
- source_word: κηρύσσων
  choice: na nangangaral
  rationale: Ipinahahayag ang pampublikong pagpapahayag ng utos; sa kontekstong ito, dignified at madaling maunawaan ang “nangangaral.”
- source_word: μὴ κλέπτειν
  choice: “Huwag magnakaw,”
  rationale: Natural na inihaharap bilang tuwirang pagbabawal, ayon sa diwa ng ipinahahayag na utos.
- source_word: κλέπτεις;
  choice: nagnanakaw ka ba?
  rationale: Tuwirang retorikal na tanong na nagpapanatili sa mapanumbat na lakas ng orihinal.
