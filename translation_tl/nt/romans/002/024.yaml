base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: tl
  text: Sapagkat dahil sa inyo, nilalapastangan ang pangalan ng Diyos sa gitna ng mga Hentil[a], gaya ng nasusulat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa gitna ng mga bansa.”'
    reason: lexical_alternative
  - marker: b
    text: Inuulit dito ni Pablo ang diwa ng Kasulatan, lalo na ng Isaias 52:5, at ng mga temang makikita rin sa Ezekiel 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng batayan sa naunang pagsaway at natural na nag-uugnay sa talata sa Filipino.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ang pangalan ng Diyos
  rationale: Tuwirang pinananatili ang larawan ng ‘pangalan,’ na maaari ring magpahiwatig ng reputasyon nang hindi ito tahasang ipinapaliwanag sa salin.
- source_word: δι’ ὑμᾶς
  choice: dahil sa inyo
  rationale: Ang διά na may accusative ay nagpapahayag dito ng sanhi; malinaw nitong ipinapakita na sila ang dahilan ng paglapastangan.
- source_word: βλασφημεῖται
  choice: nilalapastangan
  rationale: Pinananatili ang pasibong diwa at ang mabigat na kahulugan ng walang-galang at mapanirang pagsasalita laban sa Diyos.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: sa gitna ng mga Hentil
  rationale: Sa kontekstong Judio-Hentil ni Pablo, tumutukoy ito lalo na sa mga hindi Judio; inilalagay sa talababa ang leksikal na alternatibong ‘mga bansa.’
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Natural at pormal na pormulang Filipino para sa pagpapakilala ng sipi o alusyon sa Kasulatan.
