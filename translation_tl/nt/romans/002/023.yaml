  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: tl
  text: Ikaw na nagmamalaki sa Kautusan, iniihamak mo ba ang Diyos sa paglabag mo sa Kautusan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagsuway mo sa Kautusan.”
    reason: Leksikal na alternatibo para sa “sa paglabag mo sa Kautusan” (διὰ τῆς παραβάσεως τοῦ νόμου).
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: sa Kautusan
  rationale: Likas sa Filipino ang pariralang “nagmamalaki sa Kautusan” at pinananatili nito ang ugnayan ng pagmamapuri at ng Kautusan nang hindi ito ginagawang simpleng pag-uusap lamang tungkol dito.
- source_word: καυχᾶσαι
  choice: nagmamalaki
  rationale: Karaniwan at malinaw ang “nagmamalaki”; naipahahayag nito kapuwa ang pagtinging may ipinagmamalaki at ang mapanuring himig ng tanong ni Pablo.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: sa paglabag mo sa Kautusan
  rationale: Pinananatili ng “paglabag” ang anyong pangngalan ng παράβασις. Idinagdag ang “mo” sapagkat tahasang ikalawang panauhang isahan ang mga pandiwa sa Griyego.
- source_word: τὸν θεὸν
  choice: ang Diyos
  rationale: Ito ang natural na tiyak na pagtukoy sa Diyos sa Filipino.
- source_word: ἀτιμάζεις
  choice: nilalapastangan mo
  rationale: Ipinahahayag nito ang pagkait ng dangal sa Diyos at pinananatili ang matalim na kabalintunaan sa pagitan ng pagmamalaki sa Kautusan at paglabag dito.
theological_decisions:
- issue: Ang νόμος sa pangangatwiran ni Pablo
  choice: Kautusan
  alternative: kautusan
  rationale: Malinaw sa konteksto na tumutukoy ito sa Kautusang ibinigay sa Israel. Ginamit ang malaking titik bilang natural na paraan sa Filipino upang tukuyin ang kilalang Kautusan, hindi upang magdagdag ng kahulugang wala sa Griyego.
- issue: Ang ugnayan ng paglabag sa Kautusan at paglapastangan sa Diyos
  choice: Pinanatili bilang retorikal na tanong
  alternative: Isalin bilang tuwirang paratang
  rationale: May tandang pananong ang tekstong Griyego at ang anyo nito ay isang tuwirang hamon. Hindi ginawang tahasang pahayag upang mapanatili ang retorikal na puwersa at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “Kautusan” mula sa Griyego at ang matalim na anyo ng retorikal na tanong.
