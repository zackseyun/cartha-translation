  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: tl
  text: Sapagkat ang pagiging Judio[c] ay hindi lamang panlabas[a], ni ang pagtutuli ay hindi lamang panlabas sa laman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikita” o “hayag.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa laman”; tumutukoy rito sa pisikal na pagtutuli.
    reason: lexical_alternative
  - marker: c
    text: Sa ilang konteksto, ang “Judio” ay maaari ring isaling “Judeano,” ngunit dito ay mas malamang na tumutukoy ito sa pagkakakilanlan sa loob ng Israel at ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Likas na ipinahahayag nito ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran.
- source_word: Ἰουδαῖος
  choice: Judio
  rationale: Sa konteksto, ang tinutukoy ay pagkakakilanlan bilang kabilang sa bayang Israel at sa tipan, hindi lamang ang pinagmulang rehiyon.
- source_word: ἐν τῷ φανερῷ
  choice: panlabas
  rationale: Pinananatili nito ang diwa ng nakikita o panlabas na kalagayan at ang kaibahan nito sa panloob na katotohanang lilinawin sa kasunod na talata.
- source_word: περιτομή
  choice: pagtutuli
  rationale: Ito ang karaniwan at tiyak na katawagan sa Filipino para sa pisikal na tanda ng tipan na tinatalakay.
- source_word: ἐν σαρκί
  choice: sa laman
  rationale: Literal at pisikal ang gamit ng σάρξ dito. Pinananatili ng “sa laman” ang katawaning diin at ang kaibahan sa panloob na realidad sa talata 29.
- source_word: οὐ ... οὐδὲ
  choice: hindi ... at ... hindi
  rationale: Malinaw at natural nitong naihahanay sa Filipino ang dalawang magkaugnay na pagtanggi ng Griyego.
theological_decisions:
- issue: Ang kahulugan ng pagiging Judio at ng pagtutuli bilang mga tanda ng tipan
  choice: Ipinakikitang hindi sapat ang panlabas na pagkakakilanlan o pisikal na tanda lamang; iniwang bukas ang ganap na paglilinaw hanggang sa talata 29.
  alternative: Sabihing itinatakwil ni Pablo ang pagiging Judio mismo o pinapalitan niya ito ng isang lubos na di-pisikal na kategorya.
  rationale: Pinaghahambing ng teksto ang panlabas at panloob, ngunit hindi nito tahasang binubura ang pagkakakilanlang Judio. Ang “hindi lamang” ay nagpapahayag ng kakulangan ng panlabas na katangian nang hindi inaagawan ng halaga ang mismong kategorya.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Ginamit ang abstraktong pariralang “ang pagiging Judio” upang maiwasan ang alanganing pag-uulit na “hindi Judio ang Judio,” habang pinananatili ang diin ng Griyego sa panlabas na pagkakakilanlan. Ang “sa laman” ay sadyang pinanatiling literal at ipinaliwanag sa talababa.
