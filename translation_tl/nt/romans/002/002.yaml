  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: tl
  text: At alam natin na ayon sa katotohanan ang hatol ng Diyos laban sa mga gumagawa ng gayong mga bagay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaayon ng katotohanan”; ibig sabihin, ang hatol ng Diyos ay umaayon sa kung ano ang totoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Ang anyong perpekto na οἶδα ay may pangkasalukuyang diwa; tuwiran at natural itong isalin bilang “alam natin.”
- source_word: δέ
  choice: At
  rationale: Nagpapatuloy ito sa daloy ng pangangatwiran sa halip na magpahayag ng matinding pagsalungat.
- source_word: κρίμα
  choice: hatol
  rationale: Tumutukoy ito sa makatarungang pasiya ng Diyos bilang Hukom, nang hindi ito nililimitahan sa kaparusahan lamang.
- source_word: κατὰ ἀλήθειαν
  choice: ayon sa katotohanan
  rationale: Pinananatili nito ang tahasang ugnayan ng paghatol ng Diyos sa katotohanan o sa kung ano ang tunay, sa halip na paikliin ito sa mas mapagpaliwanag na “matuwid.”
- source_word: ἐπὶ
  choice: laban sa
  rationale: Sa konteksto ng masamang paghatol na nakatuon sa mga tao, malinaw at likas sa Filipino ang “laban sa.”
- source_word: τὰ τοιαῦτα
  choice: gayong mga bagay
  rationale: Likas itong tumutukoy pabalik sa mga uri ng gawain na binanggit sa naunang konteksto.
- source_word: πράσσοντας
  choice: mga gumagawa
  rationale: Ipinahihiwatig ng pangkasalukuyang participle ang patuloy o nakagawiang paggawa; sa pangungusap na ito, natural na naipahahayag iyon ng “mga gumagawa.”
theological_decisions:
- issue: Kung ang κατὰ ἀλήθειαν ay isasaling mas mapagpaliwanag bilang “nang matuwid” o mas tuwirang “ayon sa katotohanan.”
  choice: ayon sa katotohanan
  alternative: nang matuwid; kaayon ng katotohanan
  rationale: Pinananatili ng salin ang teolohikal na diin ni Pablo na ang paghatol ng Diyos ay umaayon sa katotohanan o realidad, nang hindi pinapantay lamang ito sa pangkalahatang pagiging matuwid.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang “hatol” at “mga gumagawa” upang maging madaling maunawaan habang nananatiling malapit sa hudisyal at aspektuwal na diwa ng Griyego.
