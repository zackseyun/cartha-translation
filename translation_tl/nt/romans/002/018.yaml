  text: at nalalaman mo ang kalooban ng Diyos[a] at sinasang-ayunan mo ang mga bagay na nakahihigit[b], yamang tinuturuan ka mula sa Kautusan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang kalooban”; hindi tahasang nakasaad ang “ng Diyos,” ngunit ang Diyos ang ipinahihiwatig na tinutukoy sa konteksto.
    reason: lexical_alternative
