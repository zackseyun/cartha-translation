lexical_decisions:
- source_word: γινώσκεις
  choice: nalalaman mo
  rationale: Tuwirang ipinapahayag ng kasalukuyang pandiwa ang aktibong kaalaman; natural sa Filipino ang “nalalaman mo” sa pagpapatuloy ng pangungusap.
- source_word: τὸ θέλημα
  choice: ang kalooban ng Diyos
  rationale: Literal na “ang kalooban” lamang ang Griyego, ngunit ang Diyos ang malinaw na tinutukoy sa konteksto. Nilinaw ito sa teksto at pinanatili sa talababa ang kawalan ng tahasang pantukoy sa orihinal.
- source_word: δοκιμάζεις
  choice: natitiyak mo
  rationale: Dito, ang pandiwa ay tumutukoy sa pagsusuri na humahantong sa pagkilala o pagtanggap sa nararapat; mas natural ang “natitiyak mo kung alin” kaysa literal na “sinusubok mo ang mga bagay.”
- source_word: τὰ διαφέροντα
  choice: kung alin ang higit na mahalaga
  rationale: Maaaring idiomatikong tumukoy ang parirala sa mga bagay na nakahihigit o higit na mahalaga. Inilalahad sa talababa ang mas literal at tunay na posibleng kahulugang “mga bagay na magkakaiba.”
- source_word: κατηχούμενος
  choice: yamang tinuturuan ka
  rationale: Pinananatili ang pasibong diwa ng pagtuturo at ipinahihiwatig ang likas na ugnayang sanhi ng participle sa naunang mga pandiwa.
- source_word: ἐκ τοῦ νόμου
  choice: mula sa Kautusan
  rationale: Pinananatili ng “mula sa” ang diwa ng ἐκ bilang pinagmumulan ng pagtuturo; ginamit ang “Kautusan” bilang tawag sa Torah sa kontekstong Judio.
theological_decisions:
- issue: Hindi tahasang nakasaad ang may-ari ng “kalooban” sa Griyego
  choice: ang kalooban ng Diyos
  alternative: ang kalooban
  rationale: Ang Diyos ang ipinahihiwatig na tinutukoy ng konteksto, ngunit hindi dapat ikubli na walang tahasang “ng Diyos” o “niya” sa pariralang Griyego.
- issue: Ambiguwidad ng τὰ διαφέροντα
  choice: kung alin ang higit na mahalaga
  alternative: ang mga bagay na magkakaiba
  rationale: Malamang na moral na pagkilala sa mas mahalaga ang diwa sa konteksto, ngunit posible rin ang mas literal na kahulugan; pinanatili ang tensiyong ito sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa publikong pagbasa. Ginamit ang “Kautusan” bilang pamilyar na katawagan sa Torah. Pinili ang natural na “natitiyak mo kung alin” upang maipahayag ang pagsusuri at pagkilala nang hindi labis na pinapaliit ang saklaw ng Griyego; inilagay sa talababa ang pangunahing alternatibo.
