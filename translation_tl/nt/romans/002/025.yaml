id: ROM.2.25
reference: Romans 2:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: tl
  text: May pakinabang nga ang pagtutuli[a] kung isinasagawa mo ang Kautusan[b]; ngunit kung ikaw ay tagalabag ng Kautusan[c], ang pagtutuli mo ay naging di-pagtutuli[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “may halaga ang pagtutuli.”
    reason: lexical_alternative
  - marker: b
    text: O, “kung sinusunod mo ang Kautusan.”
    reason: lexical_alternative
  - marker: c
    text: O, “isang lumalabag sa Kautusan.”
    reason: lexical_alternative
  - marker: d
    text: Sa literal, “ang pagtutuli mo ay naging di-pagtutuli”; ipinahihiwatig nito na nawawalan ng bisa ang pribilehiyong kaugnay ng pagtutuli kapag nilalabag ang Kautusan.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: pagtutuli
  rationale: Pinananatili ang tahasang katawagang tumutukoy sa tanda ng tipan at ang tuwirang paghahambing nito sa ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: nga
  rationale: Ipinahihiwatig ng “nga” ang pagsang-ayon o positibong panimulang pahayag bago ang kasunod na pagsalungat, nang hindi mabigat o artipisyal ang pangungusap sa Tagalog.
- source_word: ὠφελεῖ
  choice: may pakinabang
  rationale: Likas at malinaw itong nagpapahayag ng tunay ngunit may-kondisyong kapakinabangan o halaga.
- source_word: ἐὰν νόμον πράσσῃς
  choice: kung isinasagawa mo ang Kautusan
  rationale: Pinananatili ng “isinasagawa” ang diwa ng πράσσω na paggawa o pagsasagawa, sa halip na agad itong gawing mas interpretatibong “sinusunod.”
- source_word: παραβάτης νόμου
  choice: tagalabag ng Kautusan
  rationale: Pinananatili ang anyong pangngalan at ang tahasang kaugnayan ng paglabag sa Kautusan.
- source_word: ἡ περιτομή σου
  choice: ang pagtutuli mo
  rationale: Tuwirang pinananatili ang ikalawang panauhan at ang retorikal na diin ni Pablo.
- source_word: ἀκροβυστία
  choice: di-pagtutuli
  rationale: Sa konteksto, ito ang katapat na kalagayang tipan ng “pagtutuli,” hindi simpleng anatomikal na “balat ng masama.”
- source_word: γέγονεν
  choice: ay naging
  rationale: Ipinahahayag nito ang pagbabagong humantong sa isang kasalukuyang kalagayan, alinsunod sa puwersa ng aspektong perpekto.
theological_decisions:
- issue: Kung ang huling sugnay ay gagawing paliwanag tungkol sa pagkilala o ituturing na matinding retorikal na pagbabaligtad
  choice: ang pagtutuli mo ay naging di-pagtutuli
  alternative: ang pagtutuli mo ay ibinibilang na di-pagtutuli
  rationale: Pinananatili ng pangunahing teksto ang matindi at tuwirang γέγονεν ng Griyego. Ang “ibinibilang” ay posibleng paliwanag sa kahulugan ngunit nagdaragdag ng konseptong hindi tahasang sinabi sa talata.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinanatili ang “Kautusan” bilang katawagang pangkonteksto sa kautusan ng Diyos at ang sadyang matinding pagtapat ng “pagtutuli” at “di-pagtutuli.”
