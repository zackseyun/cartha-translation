  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: tl
  text: Sapagkat kapag ang mga Hentil[a], na walang kautusan, ay likas na gumagawa ng hinihingi ng kautusan[c], sila, kahit walang kautusan, ay isang kautusan sa kanilang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “gumagawa ng mga bagay ng kautusan.”
    reason: literal_rendering
lexical_decisions:
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ng argumento ni Pablo, tumutukoy ito sa mga taong hindi Judio at walang Kautusan ni Moises. Mas malinaw rito ang “mga Hentil” kaysa sa mas malawak na “mga bansa,” habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: νόμον / νόμου / νόμος
  choice: kautusan / ang kautusan / isang kautusan
  rationale: Pinananatili ang iisang salitang “kautusan” upang maipakita ang pag-uulit at paglalaro sa salita ng Griyego. Ang “isang kautusan sa kanilang sarili” ay nagpapanatili sa predikatibo at metaporikal na diwa ng huling νόμος nang hindi tahasang ginagawang sariling paggawa ng batas.
- source_word: φύσει
  choice: likas
  rationale: Maikli at natural itong katumbas ng “by nature” at hindi nito nililimitahan ang kahulugan sa kutob, likas na moral na kaalaman, kaugalian, o iba pang partikular na paliwanag.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: gumagawa ng hinihingi ng kautusan
  rationale: Mas natural ito sa modernong Tagalog kaysa sa literal na “gumagawa ng mga bagay ng kautusan,” ngunit nananatili ang ideya na ginagawa nila ang mga bagay na nauukol sa hinihingi ng kautusan.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: ay isang kautusan sa kanilang sarili
  rationale: Pinananatili nito ang matapang na metapora at ang ugnayan sa naunang mga pagbanggit sa kautusan, sa halip na ipaliwanag agad kung paano sila nagiging gayon.
theological_decisions:
- issue: Kung paano tahasang ipaliliwanag ang φύσει kaugnay ng kaalamang moral at budhi
  choice: Panatilihin sa pangunahing teksto ang malawak na salitang “likas” nang walang karagdagang paliwanag.
  alternative: Isalin bilang “ayon sa likas na kutob” o “sa likas nilang pagkaunawa.”
  rationale: Hindi sapilitang itinatakda ng φύσει lamang kung ang tinutukoy ay likas na kaalamang moral, kusang pagkilos, kaugalian, o kalagayang likas. Pinananatili ng “likas” ang tunay na interpretatibong bukás na kahulugan.
- issue: Kung ang huling νόμος ay dapat ipaliwanag bilang sariling pagsasabatas
  choice: Panatilihin ang metaporang “isang kautusan sa kanilang sarili.”
  alternative: Isalin nang paliwanag bilang “sila mismo ang nagtatakda ng batas para sa kanilang sarili.”
  rationale: Ang alternatibo ay maaaring magpahiwatig ng awtonomong sariling pagsasabatas na mas malakas kaysa sa sinasabi ng Griyego. Ang mas tuwirang anyo ay nagpapanatili sa retorikal at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan” sa lahat ng paglitaw ng νόμος upang mapanatili ang retorikal na pag-uulit. Iniwasan ang sobrang literal ngunit di-likas na “mga bagay ng kautusan” sa pangunahing teksto at inilagay iyon sa talababa.
