  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: tl
  text: tagapagsanay ng mga hangal, guro ng mga paslit, na taglay sa Kautusan ang anyo[a] ng kaalaman at katotohanan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: tagapagturo
  rationale: Saklaw ng παιδευτής ang pagtuturo, pagsasanay, at pagdidisiplina. Ang “tagapagturo” ay natural sa kontekstong pang-edukasyon at hindi labis na nagdidiin sa pagpaparusa.
- source_word: ἀφρόνων
  choice: mga hangal
  rationale: Pinananatili ng “mga hangal” ang tuwirang kahulugan at ang mapanghamak na talas ng paglalarawan.
- source_word: διδάσκαλον
  choice: guro
  rationale: Ito ang malinaw at karaniwang katumbas ng διδάσκαλος.
- source_word: νηπίων
  choice: mga paslit
  rationale: Ang νήπιος ay literal na sanggol o napakabatang bata at maaari ring tumukoy sa taong kulang sa gulang o pagkaunawa. Pinananatili ng “mga paslit” ang talinghaga nang natural sa Filipino.
- source_word: ἔχοντα
  choice: na taglay
  rationale: Ipinapakita ng “na taglay” ang patuloy na kaugnayan ng participle sa naunang mga paglalarawan at mas natural ito kaysa sa literal na “mayroon.”
- source_word: μόρφωσιν
  choice: anyo
  rationale: Maaaring tumukoy ang μόρφωσις sa anyo, pormulasyon, o kongkretong kapahayagan. Pinananatili ng “anyo” ang leksikal na kalabuan sa halip na ipasiya agad na “sagisag” o “ganap na kapahayagan.”
- source_word: γνώσεως
  choice: kaalaman
  rationale: Ang “kaalaman” ang natural na katumbas at pinananatili ang pagkakaugnay nito sa “katotohanan.”
- source_word: ἀληθείας
  choice: katotohanan
  rationale: Ito ang karaniwan at angkop na salin ng ἀλήθεια sa kontekstong ito.
- source_word: ἐν τῷ νόμῳ
  choice: sa Kautusan
  rationale: Tumutukoy rito ang νόμος sa Kautusang Judio bilang kinaroroonan ng inaangking anyo ng kaalaman at katotohanan. Nililinaw ng malaking titik ang tiyak na reperensiya nang hindi dinaragdagan ang diwa.
theological_decisions:
- issue: Kung ang μόρφωσις ay panlabas na anyo lamang o kongkretong kapahayagan
  choice: anyo
  alternative: kapahayagan / kongkretong pagpapahayag
  rationale: Hindi tiyak sa salita mismo kung mapanuyang “panlabas na anyo” o positibong “kongkretong kapahayagan” ang diin. Pinananatili ng pangunahing salin at talababa ang tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ang “paslit” ay nagpapanatili sa literal na larawan ng napakabatang bata, samantalang ang gitling sa dulo ay nagpapakitang nagpapatuloy ang pangungusap.
