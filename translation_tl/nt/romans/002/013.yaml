id: ROM.2.13
reference: Romans 2:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: tl
  text: Sapagkat hindi ang mga nakikinig sa Kautusan ang matuwid sa paningin ng Diyos, kundi ang mga tumutupad sa Kautusan ang aariing matuwid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipahahayag na matuwid”; maaari ring “bibigyang-katwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: mga nakikinig
  rationale: Likas ito sa modernong Tagalog at malinaw na kaibahan ng mga tumutupad; ipinahihiwatig nito ang pakikinig sa pagbasa o pagtuturo ng Kautusan.
- source_word: νόμου
  choice: sa Kautusan
  rationale: Bagaman walang artikulo ang pangngalan sa Griyego, tinutukoy sa konteksto ang Kautusang pinag-uusapan ni Pablo. Ang malaking titik ay tumutulong upang makilala ito bilang Kautusan nang hindi nagdaragdag ng paliwanag sa talata.
- source_word: δίκαιοι
  choice: matuwid
  rationale: Ito ang karaniwan at teolohikal na angkop na katumbas, at pinananatili nito ang ugnayang leksikal sa pandiwang δικαιωθήσονται.
- source_word: παρὰ τῷ θεῷ
  choice: sa paningin ng Diyos
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa pagtataya o paghatol ng Diyos.
- source_word: ποιηταὶ
  choice: mga tumutupad
  rationale: Mas natural kaysa literal na “mga gumagawa” at ipinahahayag ang pagsasagawa o pagsunod sa Kautusan, habang pinananatili ang tuwirang kaibahan sa pakikinig lamang.
- source_word: δικαιωθήσονται
  choice: aariing matuwid
  rationale: Pinananatili nito ang future passive at ang mahalagang terminolohiyang Paulino nang hindi nililimitahan ang kahulugan sa pagpapawalang-sala lamang.
theological_decisions:
- issue: Paglalarawan sa δικαιωθήσονται nang hindi paunang nilulutas ang eksaktong paraan o batayan ng pag-aaring matuwid
  choice: aariing matuwid
  alternative: ipahahayag na matuwid; bibigyang-katwiran
  rationale: Ang “aariing matuwid” ay nagpapanatili sa deklaratibo at teolohikal na bigat ng pandiwa, pati sa passive na anyo nito, habang ang talababa ay naglalantad ng iba pang posibleng pagpapahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga nakikinig” at “mga tumutupad” para sa natural at malinaw na retorikal na paghahambing; pinanatili ang mas teknikal na “aariing matuwid” dahil mahalaga ang terminong ito sa argumento ng Roma.
