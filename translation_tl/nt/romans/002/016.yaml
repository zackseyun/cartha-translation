reference: Romans 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: tl
  text: sa araw na hahatulan ng Diyos ang mga lihim ng mga tao sa pamamagitan ng Mesiyas na si Jesus[a], ayon sa ebanghelyo ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa pamamagitan ni Cristo Jesus.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: sa araw na
  rationale: Likas itong temporal na parirala sa Tagalog at pinananatili ang pagtukoy sa tiyak na araw ng paghuhukom.
- source_word: κρίνει
  choice: hahatulan
  rationale: Bagaman nasa present indicative ang Griyego, ang konteksto ay nakatuon sa darating na paghuhukom; malinaw at likas sa Tagalog ang aspektong panghinaharap.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: ang mga lihim ng mga tao
  rationale: Pinananatili nito ang diwa ng mga bagay na ikinukubli ng sangkatauhan nang hindi nililimitahan ang ἀνθρώπων sa mga lalaki.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: sa pamamagitan ng Mesiyas na si Jesus
  rationale: Ang διά na may genitive ay nagsasaad ng ahensiya o pamamagitan. Isinalin ang Χριστός bilang titulong “Mesiyas,” habang ginawang natural sa Tagalog ang pagkakaugnay nito sa pangalang Jesus.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: ayon sa ebanghelyo ko
  rationale: Pinananatili ang personal na panghalip ni Pablo at ang karaniwang kahulugan ng εὐαγγέλιον sa maikli at natural na anyo.
theological_decisions:
- issue: Kung ang Χριστοῦ ay isasalin bilang titulo o bilang nakasanayang anyong parang pangalan
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: May lakas pa rin bilang titulo ang Χριστός sa kontekstong ito. Pinanatili sa talababa ang tradisyonal na saling “Cristo Jesus” bilang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga tao” bilang inklusibong tawag sa sangkatauhan at ang “hahatulan” upang natural na ipahayag ang eskatolohikal na konteksto.
