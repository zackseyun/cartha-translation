  source_fidelity: 'Tumpak na naipapahayag ng draft ang pangunahing ugnayan ng teksto: pakikilbing kasama ng Mesiyas sa pamamagitan ng bautismo tungo sa kamatayan, ang pagkabuhay niyang muli mula sa mga patay sa pamamagitan ng kaluwalhatian ng Ama, at ang layuning mamuhay nang may bagong katangian. Gayunman, ang "sa panibagong buhay" ay mas madaling unawain bilang pagpasok sa isang bagong buhay kaysa sa mas abstraktong "newness of life" (ἐν καινότητι ζωῆς).'
