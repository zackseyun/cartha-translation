  terminology: Ang "bautismo," "kamatayan," "kaluwalhatian," "Ama," at "Mesiyas" ay angkop. Pinanatili ang "Mesiyas" para sa Χριστός, at ang "Cristo" ay nananatiling angkop na alternatibong anyo sa talababa.
