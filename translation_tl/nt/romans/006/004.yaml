  to: Kaya nga, inilibing tayong kasama niya sa pamamagitan ng bautismo tungo sa kamatayan, upang kung paanong ibinangon ang Mesiyas[a] mula sa mga patay sa pamamagitan ng kaluwalhatian ng Ama, gayundin naman ay mamuhay tayo sa panibagong paraan.
  rationale: Inayos ang ayos ng unang sugnay para sa higit na likas na Filipino. Pinalitan ang "lumakad din tayo sa panibagong buhay" ng "mamuhay tayo sa panibagong paraan" upang malinaw na maipahayag ang ἐν καινότητι ζωῆς bilang bagong katangian ng pamumuhay, hindi lamang isang bagong buhay. Ang layuning ipinahihiwatig ng ἵνα ay nananatili sa "upang." Inayos din ang bantas ng talababa.
