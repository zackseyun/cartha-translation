id: ROM.6.4
reference: Romans 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: tl
  text: Kaya nga, inilibing tayong kasama niya sa pamamagitan ng bautismo tungo sa kamatayan, upang kung paanong ibinangon ang Mesiyas[a] mula sa mga patay sa pamamagitan ng kaluwalhatian ng Ama, gayundin naman ay mamuhay tayo sa panibagong paraan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: Cristo.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετάφημεν
  choice: inilibing tayong kasama niya
  rationale: Pinananatili ang aorist passive at ang diwa ng συν- sa natural na Filipino sa pamamagitan ng pariralang “kasama niya.”
- source_word: οὖν
  choice: Kaya nga
  rationale: Malinaw na ipinapakita ang lohikal na bunga ng naunang pangangatwiran ni Pablo.
- source_word: διὰ τοῦ βαπτίσματος
  choice: sa pamamagitan ng bautismo
  rationale: Inilalahad ang instrumental na gamit ng διά nang hindi nagpapasya para sa isang partikular na doktrinang sakramental.
- source_word: εἰς τὸν θάνατον
  choice: tungo sa kamatayan
  rationale: Pinananatili ang direksiyonal na lakas ng εἰς at iniiwasang gawing simpleng pagtukoy lamang sa kamatayan.
- source_word: ἵνα
  choice: upang
  rationale: Natural at pormal na nagpapahayag ng layunin sa makabagong Filipino.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinasalin ang titulong Χριστός ayon sa aktibong mesiyanikong diwa nito; inilalagay ang “ang” para sa natural na balarilang Filipino.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Karaniwan at malinaw na salin para sa pagkabuhay mula sa kalagayan o hanay ng mga patay.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: sa pamamagitan ng kaluwalhatian ng Ama
  rationale: Pinananatili kapwa ang instrumental na διά at ang malawak na teolohikal na bigat ng δόξα bilang “kaluwalhatian,” sa halip na paliitin ito sa “kapangyarihan.”
- source_word: περιπατήσωμεν
  choice: lumakad tayo
  rationale: Pinananatili ang metapora ni Pablo tungkol sa paglakad bilang paraan ng pamumuhay, habang ang “upang” ay naghahatid ng puwersa ng subjunctive sa sugnay ng layunin.
- source_word: ἐν καινότητι ζωῆς
  choice: sa panibagong buhay
  rationale: Natural na Filipino na nagpapanatili sa ideya ng isang buhay na may bagong katangian, bagaman mas idiomatiko kaysa sa literal na “sa pagiging bago ng buhay.”
theological_decisions:
- issue: Kung ang διὰ τοῦ βαπτίσματος ay dapat isalin sa paraang tahasang nagtatakda ng isang partikular na doktrinang sakramental
  choice: sa pamamagitan ng bautismo
  alternative: dahil sa bautismo; sa bautismo
  rationale: Pinananatili ng salin ang instrumental na ugnayang nasa Griyego ngunit hindi ipinapasya kung paano eksaktong nauugnay ang bautismo sa pakikiisa sa kamatayan ng Mesiyas.
- issue: Kung ang Χριστός ay isasalin bilang titulo o gagamiting anyong tradisyonal na pangalan
  choice: ang Mesiyas
  alternative: Cristo
  rationale: Ang “Mesiyas” ay hayagang naghahatid ng titular na kahulugan ng Χριστός; ibinibigay sa talababa ang nakaugaliang alternatibo nang hindi binabago ang diwa ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang metaporang “lumakad,” ang pasibong “ibinangon,” at ang dalawang instrumental na pariralang “sa pamamagitan ng” upang hindi mawala ang estruktura at teolohikal na tensiyon ng Griyego.
