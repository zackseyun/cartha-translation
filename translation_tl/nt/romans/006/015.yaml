  to: Ano ngayon? Magkakasala ba tayo dahil hindi tayo nasa ilalim ng kautusan kundi nasa ilalim ng biyaya? Hinding-hindi![a][b]
  rationale: Pinalitan ang “wala tayo sa ilalim” ng “hindi tayo nasa ilalim” upang mas tumpak na maipakita ang pandiwang “kami ay” (ἐσμέν) na may pagtanggi at upang mapanatili ang magkatulad na estruktura ng “sa ilalim ng kautusan” at “sa ilalim ng biyaya.” Walang idinagdag na partikular na interpretasyon sa saklaw ng kautusan.
