base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: tl
  text: Ano ngayon? Magkakasala ba tayo dahil hindi tayo nasa ilalim ng kautusan kundi nasa ilalim ng biyaya? Hinding-hindi![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dapat ba tayong magkasala?”
    reason: lexical_alternative
  - marker: b
    text: O “Huwag nawang mangyari!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Ano ngayon?
  rationale: Maikli at natural na panandang naghihinuha at nagpapatuloy sa argumento ni Pablo, nang walang idinadagdag na wala sa Griyego.
- source_word: ἁμαρτήσωμεν
  choice: Magkakasala ba tayo
  rationale: Ipinahahayag ang deliberative na unang panauhang maramihan na aorist subjunctive bilang retorikal na mungkahi sa malinaw na modernong Tagalog.
- source_word: ὅτι
  choice: dahil
  rationale: Ipinakikita ang dahilang iminungkahi para sa posibleng pagkakasala.
- source_word: ὑπὸ νόμον
  choice: sa ilalim ng kautusan
  rationale: Pinananatili ang legal na larawang 'sa ilalim' at hindi nililimitahan sa pangunahing teksto ang νόμος sa isang tahasang tinukoy na saklaw.
- source_word: ὑπὸ χάριν
  choice: sa ilalim ng biyaya
  rationale: Ang 'biyaya' ang kinikilalang katumbas ng χάρις at pinananatili ang tuwirang paghahambing nito sa kautusan.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Natural, mariin, at marangal na pagtanggi sa modernong Tagalog na naghahatid ng lakas ng idyomang Griyego.
theological_decisions:
- issue: Saklaw ng νόμος sa paghahambing ni Pablo
  choice: Isinalin bilang 'kautusan' nang hindi dinaragdagan ng 'ni Moises.'
  alternative: kautusan ni Moises
  rationale: Hindi tahasang tinutukoy ng anyong Griyego ang mas makitid na saklaw; pinananatili ng salin ang teolohikal na tensiyon para matukoy ayon sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinanatili ang paulit-ulit na larawang 'sa ilalim' upang makita ang eksaktong paghahambing ng kautusan at biyaya; ginamit ang 'kautusan' bilang karaniwang biblikal ngunit nauunawaang termino.
