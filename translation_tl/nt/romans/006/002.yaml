  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: tl
  text: Hinding-hindi! Tayong namatay na sa kasalanan—paano pa tayo mamumuhay sa kasalanan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag nawang mangyari iyon!”; isang napakamariing pagpapahayag ng pagtanggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang mariing pagtanggi na natural at matindi sa modernong Tagalog, nang hindi gumagamit ng makalumang pananalita.
- source_word: οἵτινες
  choice: Tayong
  rationale: Pinananatili ang inklusibong unang panauhan at tuwirang inuugnay ang mga mananampalataya sa kasunod na pahayag.
- source_word: ἀπεθάνομεν
  choice: namatay na
  rationale: Ipinahahayag ang tiyak na pangyayaring naganap; ang “na” ay natural sa Tagalog at nagpapatingkad sa naunang pagbabago nang hindi ito labis na ipinapaliwanag.
- source_word: τῇ ἁμαρτίᾳ
  choice: sa kasalanan
  rationale: Pinananatili ang relasyonal na metaporang “namatay sa kasalanan,” sa halip na paliitin ito sa isang paliwanag tungkol sa asal.
- source_word: πῶς ἔτι
  choice: paano pa
  rationale: Natural na ipinahahayag ang retorikal na pagtataka at ang temporal na diwang “patuloy pa” o “higit pa.”
- source_word: ζήσομεν
  choice: mamumuhay
  rationale: Ang anyong panghinaharap ay angkop sa retorikal na tanong at tumutukoy sa patuloy na paraan ng pamumuhay, hindi lamang sa pisikal na pag-iral.
- source_word: ἐν αὐτῇ
  choice: rito
  rationale: Tumutukoy pabalik sa kasalanan bilang kalagayan o saklaw na kinaroroonan; maikli at natural ito sa Tagalog.
theological_decisions:
- issue: Kung ang “namatay sa kasalanan” ay simpleng pagbuti ng asal o isang tiyak na pagkaputol ng kaugnayan sa kapangyarihan ng kasalanan
  choice: Pinanatili ang tuwirang metaporang “namatay na sa kasalanan” nang walang dagdag na paliwanag.
  alternative: “tumalikod na sa kasalanan” o “naging manhid na sa kasalanan”
  rationale: Tuwirang metapora ang nasa Griyego. Pinananatili nito ang teolohikal na tensiyon at hindi ipinapasok ang isang makitid na paliwanag tungkol sa paraan ng pagpapabanal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ang “Hinding-hindi!” ay mariin ngunit hindi makaluma; ang gitling na pahaba ay nagpapanatili sa bigat ng retorikal na tanong ni Pablo.
