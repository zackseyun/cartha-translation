  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: tl
  text: Sapagkat kung tayo ay naging kaisa niya sa wangis ng kanyang kamatayan,[a] tiyak na magiging kaisa rin niya tayo sa wangis ng kanyang muling pagkabuhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumubong kasama niya.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ngunit magiging tayo rin ng muling pagkabuhay”; inuunawa mula sa unang sugnay ang “kaisa niya sa wangis.”
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: naging kaisa niya
  rationale: Ipinahahayag nito ang malapit at organikong pagkakaugnay o pakikibahagi. Likas sa makabagong Tagalog ang “kaisa niya,” samantalang pinananatili sa talababa ang mas literal na larawang may kinalaman sa magkasamang pagtubo.
- source_word: γεγόναμεν
  choice: tayo ay naging
  rationale: Ipinakikita ng anyong perpekto ang isang naganap na pagbabago na nananatili ang bunga; naipahihiwatig ito nang natural ng “naging” sa konteksto.
- source_word: τῷ ὁμοιώματι
  choice: sa wangis
  rationale: Pinananatili ng “wangis” ang ideya ng pagkakatulad nang hindi ipinapaliwanag nang labis kung paano nagaganap ang pakikibahagi.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: ng kanyang kamatayan
  rationale: Tuwirang salin ng pariralang henitibo at malinaw ang pagtukoy kay Cristo sa konteksto.
- source_word: ἀλλὰ καὶ
  choice: tiyak na ... rin
  rationale: Ipinahahayag nito ang mariing pag-uugnay ng ikalawang sugnay sa kundisyon ng una sa likas na Tagalog.
- source_word: τῆς ἀναστάσεως
  choice: sa wangis ng kanyang muling pagkabuhay
  rationale: Ipinagpapatuloy ang paralelismo ng unang sugnay. Bagaman hindi inuulit sa Griyego ang “wangis” at “kanyang,” malinaw na ipinagpapalagay ang mga ito mula sa naunang pahayag.
- source_word: ἐσόμεθα
  choice: magiging kaisa rin niya tayo
  rationale: Ang pandiwa ay literal na “magiging tayo,” ngunit kailangang ipagpatuloy sa Tagalog ang panaguring “kaisa niya” mula sa unang sugnay upang maging malinaw ang elipsis.
theological_decisions:
- issue: Kung ipaliliwanag ang pakikiisa kay Cristo bilang partikular na sakramental, mistikal, o metaporikal na ugnayan
  choice: Pinanatili ang “kaisa niya sa wangis ng kanyang kamatayan ... at muling pagkabuhay.”
  alternative: “kabahagi ng huwaran ng kanyang kamatayan” o “tumubong kasama niya sa kamatayan at muling pagkabuhay”
  rationale: Ipinahahayag ng talata ang tunay na pakikibahagi kay Cristo ngunit nililimitahan din ito ng salitang “wangis.” Hindi nilulutas ng salin ang paraang hindi tahasang nililinaw ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “wangis” upang mapanatili ang siksik na teolohikal na pananalita ni Pablo, habang nilinaw sa talababa ang organikong larawan at ang elipsis ng Griyego.
