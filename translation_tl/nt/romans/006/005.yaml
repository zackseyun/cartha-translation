  source_fidelity: 'Tumpak na naipapahayag ng pangunahing salin ang perpektong ''naging'' (γεγόναμεν), ang pakikiisang ipinahihiwatig ng σύμφυτοι, ang kwalipikasyong ''sa wangis,'' at ang hinaharap na katiyakan ng ikalawang sugnay. Gayunman, ang talababa b ay hindi wastong naglalarawan sa elipsis ng Griyego: hindi ''gayon din tayo sa muling pagkabuhay'' ang anyo nito, kundi ''magiging tayo rin ng muling pagkabuhay,'' kung saan ang panaguring σύμφυτοι at ang kaugnay na parirala ay inuunawa mula sa unang sugnay.'
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino Tagalog. Ang ayos na 'magiging kaisa rin niya tayo' ay malinaw at nagbibigay ng wastong diin sa hinaharap na bunga.
  terminology: Ang 'kaisa niya' ay isang angkop at hindi labis na mapagpaliwanag na salin ng σύμφυτοι sa konteksto. Ang 'wangis' ay maingat na pinananatili ang ὁμοίωμα. Ang 'muling pagkabuhay' ay karaniwan at angkop na katumbas ng ἀνάστασις.
