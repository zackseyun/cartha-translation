  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: tl
  text: Sapagkat noong alipin pa kayo ng kasalanan, malaya kayo[a] pagdating sa katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malaya kayo kaugnay ng katuwiran,” o “malaya kayo mula sa katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: mga alipin
  rationale: Pinananatili nito ang matinding larawan ng pagkaalipin sa Roma 6, kung saan magkatunggali ang paghahari ng kasalanan at ng katuwiran.
- source_word: ἁμαρτίας
  choice: ng kasalanan
  rationale: 'Likas na ipinapahayag ng pariralang Tagalog ang genitibong ugnayan: ang kasalanan ang panginoong pinaglilingkuran nila.'
- source_word: ἐλεύθεροι
  choice: malaya
  rationale: 'Pinananatili nito ang matalim at ironikong paghahambing ni Pablo: habang alipin sila ng kasalanan, hindi sila sakop ng katuwiran.'
- source_word: τῇ δικαιοσύνῃ
  choice: tungkol sa katuwiran
  rationale: Ipinahahayag nito ang datibo bilang paggalang o kaugnayan, nang hindi ipinapalagay na ang katuwiran mismo ay isang mapaniil na panginoon.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang angkop na salin sa gamit ni Pablo at maaari ring saklawin ng konteksto ang wastong pamumuhay; iniingatan sa talababa ang alternatibong “katarungan.”
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong pinananatili ang paliwanag na ugnayan ng talata sa naunang argumento.
theological_decisions:
- issue: Kung paano ipahahayag ang kaugnayan nila sa katuwiran habang alipin sila ng kasalanan
  choice: malaya kayo tungkol sa katuwiran
  alternative: malaya kayo mula sa katuwiran; wala kayong kaugnayan sa katuwiran
  rationale: Pinananatili ng salin ang tensiyon at bahagyang kalabuan ng datibong Griyego, sa halip na ipakahulugang masama o mapaniil ang katuwiran o lubusang ipaliwanag ang retorika ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “mga alipin” sa halip na “mga lingkod” upang mapanatili ang lakas ng δοῦλοι at ang sentrong paghahambing ng kabanata. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
