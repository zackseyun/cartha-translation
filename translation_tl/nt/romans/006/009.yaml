  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: tl
  text: Alam nating ang Mesiyas[a], na ibinangon mula sa mga patay, ay hindi na namamatay; hindi na naghahari sa kanya ang kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Alam nating
  rationale: Ipinahihiwatig ng participle ang kaalamang magkakasamang pinanghahawakan at nagsisilbing batayan ng pahayag. Likas sa Filipino ang “Alam nating” at hindi nito labis na tinutukoy kung ang ugnayan ay “sapagkat” o “yamang.”
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit dito ang Χριστός bilang makabuluhang titulo. Ang “Mesiyas” ay malinaw sa modernong Tagalog at pinananatili ang kahulugan ng titulo.
- source_word: ἐγερθεὶς
  choice: yamang ibinangon
  rationale: Pinananatili ng “ibinangon” ang tinig na balintiyak at ang pagkilos na nauna sa hindi na muling pagkamatay. Ginagawang likas ng “yamang” ang participial na ugnayan sa Filipino nang hindi tinutukoy ang gumagawa.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tuwirang inilalahad ang pagkabuhay mula sa hanay ng mga patay at karaniwang parirala ito sa saling biblikal na Filipino.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas at malinaw itong katumbas ng pagwawakas ng dating kalagayan sa dalawang sugnay.
- source_word: ἀποθνῄσκει
  choice: muling mamamatay
  rationale: Sa Filipino, ang “hindi na muling mamamatay” ay likas na naghahayag na hindi na mauulit ang kamatayan. Ang hinaharap na anyo ay idiomatikong paraan ng pagsasabi ng permanenteng realidad, hindi paghihigpit sa panahunan ng Griyego.
- source_word: θάνατος
  choice: kamatayan
  rationale: Tuwirang salin ito at pinananatili ang pagsasatao sa kamatayan bilang may kapangyarihang maghari.
- source_word: κυριεύει
  choice: paghaharian
  rationale: Ipinahahayag nito ang pamumuno o kapangyarihan ng kamatayan sa isang natural at marangal na anyong Filipino. Sa kayariang “hindi na siya paghaharian,” nananatiling kamatayan ang lohikal na gumaganap ng paghahari.
theological_decisions:
- issue: Pagsasalin ng Χριστός sa diskursong Paulino
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Sa talatang ito, mababasa ang salita bilang titulong may kahulugan, hindi lamang bilang bahaging tila pangalan. Ang talababa ay nagpapanatili sa tradisyonal na transliterasyong “Cristo” bilang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang retorikal na pagsasatao sa kamatayan at ang passive na “ibinangon,” habang iniwasang pangalanan kung sino ang nagbangon sapagkat hindi iyon tahasang nakasaad sa sugnay.
