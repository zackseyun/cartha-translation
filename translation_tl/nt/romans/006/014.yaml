base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: tl
  text: Sapagkat hindi maghahari[a] sa inyo ang kasalanan, sapagkat hindi kayo nasa ilalim ng Kautusan[b] kundi nasa ilalim ng biyaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “hindi kayo paghaharian ng kasalanan” o “hindi mangingibabaw sa inyo ang kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa ilalim ng kautusan,” isang idyomang nangangahulugang nasa ilalim ng awtoridad o kaayusan ng Kautusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Karaniwang katumbas sa Filipino at pinananatili ang pagsasatao sa kasalanan bilang kapangyarihang naghahari nang hindi nagdaragdag ng malaking titik o ibang paliwanag.
- source_word: κυριεύσει
  choice: maghahari sa
  rationale: Malinaw at likas na Filipino para sa paggamit ng kapangyarihan o paghahari; pinananatili nito ang larawan ng kasalanan bilang pinuno.
- source_word: ὑπὸ νόμον
  choice: sa ilalim ng Kautusan
  rationale: Ipinahahayag ang idyomang tumutukoy sa pagiging saklaw ng awtoridad o kaayusan ng Kautusan. Ginamit ang malaking titik upang tukuyin sa konteksto ang Kautusan ni Moises, hindi ang batas sa pangkalahatan.
- source_word: χάριν
  choice: biyaya
  rationale: Natatag at angkop na salin sa paggamit ni Pablo, lalo na sa pagtutunggali ng Kautusan at biyaya.
- source_word: γὰρ … γάρ
  choice: sapagkat … dahil
  rationale: Ang una ay nag-uugnay sa naunang pangangatwiran, at ang ikalawa ay likas na naghahayag ng dahilan sa Filipino.
theological_decisions:
- issue: Kung gagawing higit na hayag ang pagsasatao sa kasalanan
  choice: Panatilihin ang “kasalanan” at isalin ang pandiwa bilang “maghahari sa inyo.”
  alternative: “Hindi kayo paghaharian ng kasalanan” o “hindi kayo pangingibabawan ng kasalanan.”
  rationale: Malinaw sa Griyego ang larawan ng kasalanan bilang kapangyarihang naghahari, ngunit hindi nito hinihingi ang dagdag na tipograpiya o mas tiyak na doktrinal na pagpapakahulugan.
- issue: Kung ang νόμος ay batas sa pangkalahatan o ang Kautusan ni Moises
  choice: “Kautusan,” habang nililinaw sa talababa ang idyomang “sa ilalim ng Kautusan.”
  alternative: “batas” o “kautusan” na maliit ang titik
  rationale: Sa konteksto ng Roma, pinakamalamang na tumutukoy ito sa kaayusan at awtoridad ng Kautusan ni Moises, ngunit hindi pinalalawak ang salin upang lutasin ang lahat ng saklaw ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat … dahil” upang maipakita ang dalawang γὰρ nang hindi nagiging mabigat. Ang mga pananda ng talababa ay inilagay kaagad pagkatapos ng kaugnay na parirala.
