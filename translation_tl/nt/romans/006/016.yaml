  to: Hindi ba ninyo alam na kapag inihaharap ninyo ang inyong mga sarili bilang mga alipin upang sumunod, alipin kayo ng inyong sinusunod—ng kasalanang humahantong sa kamatayan, o ng pagsunod na humahantong sa pagiging matuwid?[a]
