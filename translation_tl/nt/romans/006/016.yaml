  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: tl
  text: Hindi ba ninyo alam na kapag inihaharap ninyo ang inyong mga sarili bilang mga alipin upang sumunod, alipin kayo ng inyong sinusunod—ng kasalanang humahantong sa kamatayan, o ng pagsunod na humahantong sa pagiging matuwid?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: inihaharap ninyo ang inyong sarili
  rationale: Pinananatili nito ang larawan ng kusang paglalagay ng sarili sa kapangyarihan at paglilingkod sa iba, nang hindi dinaragdagan ang diwa ng Griyego.
- source_word: δούλους / δοῦλοί
  choice: mga alipin / alipin
  rationale: Mahalaga sa paghahambing ni Pablo ang kalagayang nasa ilalim ng kapangyarihan ng isang panginoon; mas tumpak dito ang “alipin” kaysa “lingkod.”
- source_word: εἰς ὑπακοήν
  choice: upang sumunod
  rationale: Natural itong Filipino at malinaw na naghahatid ng layuning ipinapahayag ng εἰς, bagaman ginawang pandiwa ang abstraktong pangngalan.
- source_word: ᾧ ὑπακούετε
  choice: ng inyong sinusunod
  rationale: Pinananatili ang kaugnayan sa pinasusunuran nang hindi tahasang nagdaragdag ng salitang “panginoon,” na wala sa teksto.
- source_word: ἁμαρτίας
  choice: kasalanan
  rationale: Pinananatili ang tuwirang salita ng Griyego at hinahayaang ang larawan ng pagkaalipin ang magpahiwatig sa pagsasatao sa kasalanan.
- source_word: εἰς θάνατον
  choice: humahantong sa kamatayan
  rationale: Malinaw at likas na ipinapahayag ang direksiyon o kinalabasan ng εἰς.
- source_word: ὑπακοῆς
  choice: pagsunod
  rationale: Pinananatili ang abstraktong pangngalan at ang kaibahan nito sa “kasalanan.”
- source_word: εἰς δικαιοσύνην
  choice: humahantong sa pagiging matuwid
  rationale: Ipinapahayag nang natural sa Filipino ang resultative na εἰς at ang moral-teolohikal na saklaw ng δικαιοσύνη.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa paghahambing ni Pablo
  choice: pagiging matuwid
  alternative: katarungan
  rationale: Sa agarang konteksto, ang kaibahan sa kasalanan at kamatayan ay tumutukoy sa matuwid na kalagayan o pamumuhay. Gayunman, tunay na posibleng leksikal na diwa ang “katarungan,” kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding larawan ng pagkaalipin at ang balanseng paghahambing sa kasalanan at pagsunod; iniwasan ang mas malabong “lingkod.”
