  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: tl
  text: Kaya, ituring din ninyo ang inyong mga sarili na patay sa kasalanan ngunit buhay sa Diyos sa Cristo Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa Cristo Jesus” ay salin ng Griyegong pariralang maaaring tumukoy sa kalagayan o pakikipag-ugnay kay Cristo Jesus. Ang “Cristo” ay titulong nangangahulugang “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Kaya, ... din
  rationale: Likas na ipinahahayag sa modernong Tagalog ang paghinuha mula sa naunang argumento at pinananatili ang diwa ng καί na “din.”
- source_word: λογίζεσθε
  choice: ituring
  rationale: Ipinahahayag ang pagtingin o pagkilala sa isang bagay bilang totoo; mas natural dito kaysa sa literal na wikang pagtutuos.
- source_word: ἑαυτοὺς εἶναι
  choice: ang inyong sarili na
  rationale: Malinaw na pinananatili ang reflexive na diwa at ang nilalaman ng infinitive construction nang hindi nagiging alanganin sa Tagalog.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: patay sa kasalanan
  rationale: Natural at maikli itong katumbas ng ugnayang ipinahahayag ng datibo; ang kontrast ng μέν...δέ ay dinadala ng “ngunit.”
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: ngunit buhay para sa Diyos
  rationale: Pinananatili ang tuwirang pagsalungat ng “patay” at “buhay”; ang “para sa Diyos” ay natural na Tagalog para sa relational na datibo nang hindi labis na ipinapaliwanag iyon.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: kay Cristo Jesus
  rationale: Sa personal na pangalan o titulo, “kay” ang natural na anyo ng ἐν sa Tagalog at maaari pa ring magpahiwatig ng pakikipag-ugnay o kalagayang nakaugnay sa kanya; ang talababa ay nagpapanatili sa mas literal na anyo.
- source_word: Χριστῷ
  choice: Cristo
  rationale: Ang “Cristo” ay kinikilalang modernong katawagang Filipino na nananatiling titulo ngunit mas natural kaysa “Mesiyas Jesus” sa nakapirming pariralang “Cristo Jesus.”
theological_decisions:
- issue: Ang bisa ng ἐν Χριστῷ Ἰησοῦ
  choice: kay Cristo Jesus
  alternative: sa loob ni Cristo Jesus
  rationale: Iniiwasan ang hindi natural at posibleng pisikal na dating ng “sa loob ni.” Hindi rin ito ginawang “sa pamamagitan ni” o “dahil kay,” upang hindi takdaan ang ugnayan sa instrumentalidad o sanhi lamang. Itinatala sa talababa ang literal na “sa/in Cristo Jesus.”
- issue: Pagtutumbas sa Χριστός bilang titulo o anyong tila pangalan
  choice: Cristo
  alternative: Mesiyas
  rationale: Sa pariralang Χριστῷ Ἰησοῦ, ang “Cristo Jesus” ay natural at dignified sa Filipino habang nananatiling makasaysayang titulo; ang “Mesiyas Jesus” ay hindi likas sa karaniwang gamit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Pinanatili ang utos, ang matinding pagsalungat ng “patay” at “buhay,” at ang teolohikal na puwang ng ἐν nang hindi ito nilulutas bilang sanhi o paraan lamang.
