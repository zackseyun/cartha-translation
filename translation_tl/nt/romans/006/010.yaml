  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: tl
  text: Sapagkat sa pagkamatay na dinanas niya[a], namatay siya sa kasalanan nang minsanan at magpakailanman; ngunit sa buhay na ikinabubuhay niya, nabubuhay siya para sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain ang “sa kasalanan” bilang “para sa kasalanan” o “kaugnay ng kasalanan.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Sapagkat ang kamatayang dinanas niya
  rationale: Ang neuter relative na ὃ kasama ng inuulit na pandiwa ay tumutukoy sa pangyayari ng pagkamatay. Likas sa modernong Tagalog ang “kamatayang dinanas niya,” at pinananatili nito ang diin at paralelismo ng Griyego.
- source_word: τῇ ἁμαρτίᾳ ἀπέθανεν
  choice: ay kamatayan sa kasalanan
  rationale: Pinananatili ng “sa kasalanan” ang relational na diwa ng datibo at ang pagtutapat nito sa “para sa Diyos,” nang hindi ipinapakahulugang may sariling kasalanan si Cristo.
- source_word: ἐφάπαξ
  choice: minsanan at magpakailanman
  rationale: Ipinahahayag nito na ang pagkamatay ay iisang di-mauulit na pangyayaring may namamalaging bisa.
- source_word: ὃ δὲ ζῇ
  choice: ngunit ang buhay na ikinabubuhay niya
  rationale: Sinasalamin nito ang unang sugnay at pinananatili ang retorikal na paralelismo ng kamatayan at buhay.
- source_word: τῷ θεῷ
  choice: para sa Diyos
  rationale: Natural itong Tagalog para sa buhay na nakatuon sa Diyos; pinananatili rin nito ang ugnayang ipinahihiwatig ng datibo.
theological_decisions:
- issue: Kung ang τῇ ἁμαρτίᾳ ay nangangahulugang “sa kasalanan,” “para sa kasalanan,” o “kaugnay ng kasalanan.”
  choice: sa kasalanan
  alternative: para sa kasalanan; kaugnay ng kasalanan
  rationale: Pinananatili ng pangunahing salin ang maigting na pagtutulad sa Roma 6 at ang kaibahan sa “para sa Diyos,” habang inilalahad sa talababa ang tunay na saklaw ng datibong Griyego nang hindi ipinapasok sa teksto ang isang tiyak na pagpapaliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang bahagyang pormal na paralelismo upang mapanatili ang ayos at diin ng Griyego.
