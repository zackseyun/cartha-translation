id: ROM.6.23
reference: Romans 6:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: tl
  text: Sapagkat ang kabayaran[a] ng kasalanan ay kamatayan, ngunit ang kaloob[b] ng Diyos ay buhay na walang hanggan sa Mesiyas na si Jesus, na ating Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sahod.”
    reason: lexical_alternative
  - marker: b
    text: O, “kaloob ng biyaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: kabayaran
  rationale: Ipinahihiwatig ng salitang pangmaramihan ang bayad na natatanggap o kinikita. Likas sa modernong Tagalog ang “kabayaran” at malinaw nitong pinananatili ang pagsalungat sa kaloob.
- source_word: ἁμαρτίας
  choice: ng kasalanan
  rationale: 'Pinananatili nito ang maikli at sadyang malawak na ugnayang genitibo: ang kabayarang nauukol sa, o ibinabayad ng, kasalanan.'
- source_word: θάνατος
  choice: kamatayan
  rationale: Tuwiran itong katumbas ng pangngalang Griyego at hindi nito nililimitahan kung anong aspekto ng kamatayan ang tinutukoy.
- source_word: χάρισμα
  choice: kaloob
  rationale: Ipinakikita ng salita ang kaloob na nagmumula sa biyaya. Ang “kaloob” ay natural at marangal, at malinaw na kasalungat ng kinikitang kabayaran.
- source_word: ζωὴ αἰώνιος
  choice: buhay na walang hanggan
  rationale: Ito ang natural at kinikilalang salin na nagpapahayag ng walang-hanggang buhay nang hindi dinaragdagan ang kahulugan.
- source_word: ἐν
  choice: sa
  rationale: Pinananatili ng payak na “sa” ang maaaring diwa ng saklaw o pakikipag-ugnayan kay Jesus nang hindi ito nililimitahan sa instrumental na “sa pamamagitan ng.”
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang natural na ipinakikilala sa Tagalog ang pangalang Jesus.
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Pinananatili nito ang karaniwang kumpisal at teolohikal na bigat ng κύριος.
theological_decisions:
- issue: Diwa ng ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  alternative: sa pamamagitan ng Mesiyas na si Jesus; sa pakikipag-isa sa Mesiyas na si Jesus
  rationale: Maaaring magpahayag ang ἐν ng saklaw o pakikipag-ugnayan, hindi lamang ng paraan o kasangkapan. Ang “sa” ang pinakamaikling saling nagpapanatili sa lawak at tensiyong ito.
- issue: Saklaw ng θάνατος
  choice: kamatayan
  alternative: espirituwal na kamatayan; walang-hanggang kamatayan
  rationale: Hindi tinutukoy ng talata mismo ang isang mas makitid na uri ng kamatayan, kaya hindi iyon idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Sapagkat” upang ipakita ang paliwanag na ipinahihiwatig ng γάρ, at pinanatili ang maikli at matinding paghahambing ng kabayaran at kaloob.
