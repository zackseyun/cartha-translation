  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: tl
  text: Ano ngayon ang sasabihin natin? Magpapatuloy ba tayo sa kasalanan upang lalong dumami ang biyaya?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mananatili ba tayo sa kasalanan …?”
    reason: lexical_alternative
  - marker: b
    text: O “upang lalo pang sumagana ang biyaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Ano ngayon
  rationale: Pinananatili ang paghihinuha mula sa naunang argumento at ang retorikal na tono sa likas na modernong Tagalog.
- source_word: ἐροῦμεν
  choice: ang sasabihin natin
  rationale: Isinasalin ang future deliberative expression bilang bahagi ng karaniwang retorikal na tanong sa Tagalog.
- source_word: ἐπιμένωμεν
  choice: Patuloy ba tayo
  rationale: Ipinahahayag ang deliberative present subjunctive bilang tanong tungkol sa pagpapatuloy ng isang gawain.
- source_word: τῇ ἁμαρτίᾳ
  choice: sa kasalanan
  rationale: Likas na Tagalog para sa pananatili sa saklaw o gawain ng kasalanan, nang hindi ginagawang abstraktong 'pagkamakasalanan.'
- source_word: ἵνα
  choice: upang
  rationale: Pinananatiling hayag ang layunin o inaasahang bunga sa mungkahing inilalahad ng retorikal na tanong.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Karaniwan at tumpak na katawagan para sa χάρις, na tumutukoy rito sa mapagpalang kagandahang-loob ng Diyos.
- source_word: πλεονάσῃ
  choice: lalo pang sumagana
  rationale: Ipinahahayag ang pagdami o paglago nang malinaw at natural; ang 'lalo pang' ay angkop sa konteksto ng naunang pagdami ng kasalanan at biyaya.
theological_decisions:
- issue: Kung ang tanong ni Pablo ay pahintulot, obligasyon, o payak na prediksiyon
  choice: 'Isang deliberatibong tanong tungkol sa asal: “Patuloy ba tayo sa kasalanan”'
  alternative: “Magpapatuloy ba tayo sa kasalanan”
  rationale: Ang subjunctive sa Griyego ay nagtatanong tungkol sa iminumungkahing gawain. Ang “Patuloy ba tayo” ay nagpapanatili sa retorikal at moral na puwersa nang hindi paunang sinasagot ang tanong o nagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “biyaya” bilang pamilyar na terminong biblikal, at pinanatili ang maigsi at mariing anyo ng retorikal na tanong.
