  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: tl
  text: 'Nalalaman natin ito: ang dati nating pagkatao ay ipinakong kasama niya sa krus, upang mawalan ng kapangyarihan ang katawan ng kasalanan[a], at nang hindi na tayo maging alipin ng kasalanan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mawalan ng bisa ang katawan ng kasalanan” o “mapawalang-bisa ang katawan ng kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi na tayo maglingkod bilang mga alipin ng kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Nalalaman natin ito
  rationale: Pinananatili ang diwa ng participle bilang kaalamang kaugnay ng naunang konteksto, habang gumagamit ng likas na ayos sa modernong Tagalog.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: ang dati nating pagkatao
  rationale: Ang “pagkatao” ay natural at saklaw ang buong dating pagkakakilanlan o kalagayan ng tao, hindi lamang ang pisikal na katawan; iniiwasan din nito ang maling pagkaunawa na tumutukoy lamang sa isang matandang lalaki.
- source_word: συνεσταυρώθη
  choice: ay ipinakong kasama niya sa krus
  rationale: Hayagang ipinapakita ng “kasama niya” ang συν- na diwa ng pakikibahagi sa pagkakapako, at malinaw na tinutukoy ng “sa krus” ang paraan ng kamatayan.
- source_word: καταργηθῇ
  choice: upang mawalan ng kapangyarihan
  rationale: Ipinahihiwatig nito ang pagpapawalang-bisa o pag-alis ng bisa nang hindi ipinapalagay na lubusang nilipol ang tinutukoy.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: ang katawan ng kasalanan
  rationale: Pinananatili ang siksik at malabong genitive construction ng Griyego sa halip na ipasiya kung ito ay katawang makasalanan, pinaghaharian ng kasalanan, o may kaugnayan sa kasalanan.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: at nang hindi na tayo maging alipin ng kasalanan
  rationale: Ang “maging alipin” ay nagpapanatili sa larawan ng δουλεύω bilang paglilingkod sa ilalim ng isang panginoon, hindi lamang pangkaraniwang serbisyo.
theological_decisions:
- issue: Kahulugan ng ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: ang dati nating pagkatao
  alternative: ang dati nating tao / ang luma nating sarili
  rationale: Ang pinili ay likas sa modernong Tagalog at tumutukoy sa dating kalagayan ng buong tao. Hindi nito nililimitahan ang pahayag sa kalalakihan ni ipinapakahulugang pisikal na katawan lamang.
- issue: Lakas ng καταργηθῇ kaugnay ng katawan ng kasalanan
  choice: mawalan ng kapangyarihan
  alternative: mawalan ng bisa / mapawalang-bisa / maalis
  rationale: Inilalarawan nito ang pagkasira ng naghaharing bisa ng kasalanan nang hindi pinatitibay ang mas matinding pakahulugang lubusang pagkalipol.
- issue: Ugnayan ng dalawang sugnay na may layunin
  choice: upang … at nang …
  alternative: upang … upang …
  rationale: Pinananatili ang dalawang magkaugnay na layunin o kinalabasan ng ἵνα at τοῦ, ngunit iniiwasan ang mabigat na pag-uulit sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teolohikal na larawan ng pagpapako kasama ni Cristo, ang sadyang siksik na pariralang “katawan ng kasalanan,” at ang talinghaga ng pagkaalipin. Hindi idinagdag sa pangunahing teksto ang pangalang “Cristo” sapagkat panghalip lamang ang nasa agarang Griyegong teksto.
