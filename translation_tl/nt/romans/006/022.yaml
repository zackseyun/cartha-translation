  to: Ngunit ngayon, pinalaya na kayo mula sa kasalanan at ginawang mga alipin ng Diyos. Mayroon kayong bungang humahantong sa pagpapabanal[a], at ang wakas ay buhay na walang hanggan.[b]
  rationale: Inalis ang walang-katumbas na “nito” upang mapanatili ang tuwirang appositional na ugnayan ng “ang wakas” at “buhay na walang hanggan.” Pinalitan ang “pagpapakabanal” ng “pagpapabanal” upang maiwasan ang reflexive na pakahulugan at mas maipahayag ang ἁγιασμός. Hinati ang mahabang pangungusap para sa malinaw at natural na modernong Filipino, nang hindi binabago ang kahulugan o talinghaga ng pinagmulan.
