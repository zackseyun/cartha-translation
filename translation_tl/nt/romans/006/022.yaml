base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: tl
  text: Ngunit ngayon, pinalaya na kayo mula sa kasalanan at ginawang mga alipin ng Diyos. Mayroon kayong bungang humahantong sa pagpapabanal[a], at ang wakas ay buhay na walang hanggan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bunga na nagreresulta sa kabanalan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang kinalabasan ay buhay na walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Ngunit ngayon
  rationale: Pinananatili ang malinaw na pagsalungat sa dati nilang kalagayan at natural ito sa makabagong Tagalog.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: yamang pinalaya na kayo mula sa kasalanan
  rationale: Ipinahahayag ng anyong aorist passive participle ang natanggap at naganap nang pagpapalaya; ang pang-isahang “kasalanan” ay pinananatili bilang kapangyarihan o paghaharing pinagmulan ng pagkaalipin.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: at ginawang mga alipin ng Diyos
  rationale: Pinananatili ang matinding talinghaga ng δουλόω at ang paralelismo sa pagkaalipin sa kasalanan, sa halip na palambutin bilang paglilingkod lamang.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: mayroon kayong bunga
  rationale: Pinananatili ang talinghagang agrikultural ng καρπός at ang tuwirang diwa ng ἔχετε; hindi kailangang ulitin ang “inyong” sapagkat malinaw na sa “kayong.”
- source_word: εἰς ἁγιασμόν
  choice: humahantong sa pagpapakabanal
  rationale: Ipinakikita ng “humahantong sa” ang direksiyon tungo sa bunga o kinalabasan, habang ang “pagpapakabanal” ay nagsasaad ng proseso o kalagayan ng pagiging banal nang hindi lubhang teknikal.
- source_word: τὸ δὲ τέλος
  choice: at ang wakas nito
  rationale: Pinananatili ng “wakas” ang pangunahing diwa ng τέλος; idinagdag ang “nito” upang maging malinaw at natural sa Tagalog na ang buhay na walang hanggan ang pangwakas na kinalabasan.
- source_word: ζωὴν αἰώνιον
  choice: buhay na walang hanggan
  rationale: Ito ang natural at kinikilalang salin sa Tagalog na tumpak na naglalahad ng pangmatagalang buhay na tinutukoy.
theological_decisions:
- issue: Talinghaga ng pagkaalipin kaugnay ng Diyos
  choice: ginawang mga alipin ng Diyos
  alternative: itinalaga sa paglilingkod sa Diyos
  rationale: Sadyang magkatapat sa Roma 6 ang pagkaalipin sa kasalanan at pagkaalipin sa Diyos. Ang mas banayad na “paglilingkod” ay makababawas sa puwersa ng argumento ni Pablo.
- issue: Diwa ng ἁγιασμός
  choice: pagpapakabanal
  alternative: kabanalan
  rationale: Maaaring tumukoy ang salita sa proseso ng pagpapabanal o sa resultang kabanalan. Ang pangunahing salin ay nagpapanatili sa aspektong dinamiko, habang inilalagay sa talababa ang lehitimong alternatibo.
- issue: Ugnayan ng τέλος at ζωὴν αἰώνιον
  choice: ang wakas nito ay buhay na walang hanggan
  alternative: ang kinalabasan ay buhay na walang hanggan
  rationale: 'Ipinakikita ang appositional na ugnayan: ang pangwakas na hantungan o resulta ay buhay na walang hanggan, nang hindi ipinakahulugang simpleng pagtigil lamang.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding talinghaga ng pagkaalipin at ang larawan ng bunga, ngunit inayos ang pangungusap upang maging likas sa karaniwang mambabasang Tagalog.
