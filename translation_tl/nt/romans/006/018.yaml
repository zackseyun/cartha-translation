  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: tl
  text: At matapos kayong palayain mula sa kasalanan, inalipin kayo sa katuwiran.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: O “ginawa kayong mga alipin ng katuwiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: matapos kayong palayain
  rationale: Ipinapanatili nito ang pasibong diwa ng aorist participle at ipinakikitang nauna ang pagpapalaya sa pagkaalipin, nang hindi nagdaragdag kung sino ang gumawa nito.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa argumento ni Pablo; natural sa Filipino ang “At” sa ganitong konteksto.
- source_word: ἁμαρτίας
  choice: kasalanan
  rationale: Pinananatili ng pang-isahang “kasalanan” ang abstraktong kahulugan at ang posibleng personipikasyon nito bilang naghaharing kapangyarihan.
- source_word: ἐδουλώθητε
  choice: inalipin kayo
  rationale: Tahasang pinananatili ang pasibong anyo at matinding metapora ng pagkaalipin na sentral sa argumento ng Roma 6.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang “katuwiran” ang likas at malawak na salin sa kontekstong Paulino, at maaari nitong dalhin ang moral at panghukuman o pangtipang mga pahiwatig ng salita.
theological_decisions:
- issue: Paglalahad sa metapora ng δουλόω
  choice: inalipin kayo sa katuwiran
  alternative: ginawa kayong mga alipin ng katuwiran
  rationale: Hindi pinalalambot ang matinding larawan ng paglipat ng pagkaalipin mula sa kasalanan tungo sa katuwiran. Pinananatili rin ng salin ang pasibong anyo nang hindi tinutukoy ang gumagawa.
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Mas angkop ang “katuwiran” sa agarang argumento tungkol sa matuwid na pamumuhay, ngunit tunay na maaaring taglayin ng salitang Griyego ang diwa ng “katarungan,” kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Sadyang pinanatili ang matinding salitang “inalipin” upang huwag pahinain ang metapora ni Pablo; malinaw pa rin ito sa karaniwang mambabasa.
