id: ROM.6.19
reference: Romans 6:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: tl
  text: Nagsasalita ako sa paraang pantao dahil sa kahinaan ng inyong laman.[a] Sapagkat kung paanong iniharap ninyo ang mga bahagi ng inyong katawan bilang mga alipin ng karumihan at ng paglabag sa kautusan, na humahantong sa paglabag sa kautusan, gayundin naman ngayon, iharap ninyo ang mga bahagi ng inyong katawan bilang mga alipin ng katuwiran,[b] na humahantong sa pagpapakabanal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “laman” ay maaari ring unawain dito bilang “makasalanang kalikasan,” bagaman mas malawak ang saklaw ng salitang Griyego.
    reason: lexical_alternative
  - marker: b
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Nagsasalita ako sa paraang pantao
  rationale: Likas sa modernong Tagalog at pinananatili ang diwa ng pananalitang iniangkop sa karaniwang pagkaunawa ng tao nang hindi ito nililimitahan sa isang tahasang ‘paghahambing.’
- source_word: ἀσθένειαν
  choice: kahinaan
  rationale: Malawak at tuwirang katumbas na maaaring tumukoy sa pagkukulang o kahinaan ng tao nang hindi pinapakitid ang kahulugan.
- source_word: σαρκὸς
  choice: laman
  rationale: Pinananatili ang malawak at teolohikal na tensiyon ng σάρξ; hindi ito agad binibigyang-kahulugan bilang ‘makasalanang kalikasan.’
- source_word: παρεστήσατε / παραστήσατε
  choice: iniharap / iharap
  rationale: Pinananatili ang pag-uulit ng pandiwa at ang malinaw na paghahambing ng dating ginawa at ng utos para sa kasalukuyan.
- source_word: μέλη
  choice: mga bahagi ng inyong katawan
  rationale: Mas malinaw sa ordinaryong mambabasa kaysa sa literal ngunit di-likas na ‘mga sangkap,’ habang pinananatili ang pagtukoy sa mga bahagi o kakayahan ng katawan.
- source_word: δοῦλα
  choice: mga alipin
  rationale: Mahalaga sa Roma 6 ang larawan ng pagkaalipin, pamumuno, at katapatan; mas buo itong naipahahayag ng ‘alipin’ kaysa ‘lingkod.’
- source_word: ἀκαθαρσίᾳ
  choice: karumihan
  rationale: Natural at dignified na salitang Filipino para sa moral na impurity.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: paglabag sa kautusan / paglabag sa kautusan
  rationale: Pinananatili ang pag-uulit at ang kaugnayan sa batas o kautusan; mas natural ito sa Tagalog kaysa ‘kawalan ng batas.’
- source_word: εἰς τὴν ἀνομίαν
  choice: na nauuwi sa lalo pang paglabag sa kautusan
  rationale: Ipinahahayag ang direksiyon o bunga ng εἰς at ang retorikal na paglala mula sa paglabag tungo sa higit pang paglabag.
- source_word: δικαιοσύνῃ
  choice: katuwiran
  rationale: Ang ‘katuwiran’ ang karaniwang salin sa kontekstong etikal at Paulino; nananatiling posibleng alternatibo ang ‘katarungan.’
- source_word: ἁγιασμόν
  choice: pagpapakabanal
  rationale: Naipahahayag ang prosesong o resultang patungo sa kabanalan, na akma sa galaw ng pangungusap.
theological_decisions:
- issue: Kahulugan ng σάρξ sa pariralang ‘kahinaan ng inyong laman’
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Maaaring kasama sa konteksto ang kahinaan ng taong nasa makasalanang kalagayan, ngunit hindi hinihingi ng Griyego ang mas makitid na interpretasyon. Pinananatili ng ‘laman’ ang lawak at tensiyon ng pahayag.
- issue: Pagbibigay-kahulugan sa δικαιοσύνη sa kontekstong Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Sa paghahambing nito sa karumihan at paglabag sa kautusan, ang etikal na ‘katuwiran’ ang pinakanababagay sa pangunahing teksto, habang inilalagay sa talababa ang lehitimong alternatibong ‘katarungan.’
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘mga bahagi ng inyong katawan’ sa halip na isang teknikal o makalumang katumbas ng μέλη. Sadyang pinanatili ang larawan ng pagkaalipin at ang pag-uulit ng ‘paglabag sa kautusan.’ Itinama rin ang pagkakatapat ng mga marker sa nilalaman ng mga talababa: [a] para sa ‘laman’ at [b] para sa ‘katuwiran.’'
