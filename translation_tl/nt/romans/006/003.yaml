  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: tl
  text: O hindi ba ninyo alam na tayong lahat na binautismuhan kay Mesiyas Jesus ay binautismuhan sa kanyang kamatayan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Cristo Jesus.” Griyego: “Christos Iēsous.”'
