  rationale: Pinalitan ang “tungo kay / tungo sa” ng idiomatikong “kay / sa” sa karaniwang Filipino bautismal na pananalita. Hindi nito ipinapasya kung sakramental, simboliko, o iba pang uri ang pakikiisa; iniiwan nitong bukás ang saklaw ng εἰς habang ginagawang natural ang salin. Nagdagdag rin ng panandang panipi sa anyong Griyego para sa pare-parehong estilong pangtalababa.
