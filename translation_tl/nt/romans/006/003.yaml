  naturalness: Ang “binautismuhan tungo kay Mesiyas Jesus” at “binautismuhan tungo sa kanyang kamatayan” ay mabigat at di-idiomatiko sa modernong Filipino. Sa gamit na ito, ang mga panandang “kay” at “sa” ang likas na Filipino na katumbas sa bautismal na pormula, nang hindi nililinaw nang lampas sa Griyego ang paraan ng pakikiisa.
