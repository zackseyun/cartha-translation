lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Pinananatili ang pagpapatuloy ng pangangatwiran ni Pablo at ang banayad na pagsaway sa retorikal na tanong.
- source_word: ἀγνοεῖτε
  choice: hindi ba ninyo alam
  rationale: Natural na salin ng pangkasalukuyang pandiwa sa isang retorikal na tanong at malinaw na apela sa kaalamang dapat ay taglay na ng mga mambabasa.
- source_word: ὅσοι
  choice: tayong lahat na
  rationale: Ipinahahayag ang saklaw ng parirala at ang inklusibong unang panauhang maramihan ng pandiwa.
- source_word: ἐβαπτίσθημεν
  choice: binautismuhan
  rationale: Tuwirang inilalahad ang aorist passive bilang isang naganap na kilos nang hindi nagdaragdag ng paliwanag na nakatali sa isang denominasyon.
- source_word: εἰς
  choice: tungo kay / tungo sa
  rationale: Ang “tungo” ay nagpapanatili sa direksiyon at malakas na larawang inkorporatibo ng εἰς nang hindi tiyakang ipinapakahulugan ang paraan ng pakikiisa.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesiyas Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” at pinananatili ang ayos ng Griyegong parirala.
- source_word: θάνατον
  choice: kamatayan
  rationale: Tuwiran at sapat na katumbas ng θάνατος.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Natural na anyong paari na tumutukoy kay Mesiyas Jesus.
theological_decisions:
- issue: Kung ang εἰς sa pananalita tungkol sa bautismo ay dapat isaling pumapabor sa bisa ng sakramento, simbolikong pakikiugnay, o pakikiisa kay Cristo.
  choice: Isinalin ang dalawang εἰς bilang “tungo kay / tungo sa.”
  alternative: “kay / sa,” “kaugnay ni / ng,” o “upang makiisa kay / sa”
  rationale: Pinananatili ng “tungo” ang direksiyon at inkorporatibong lakas ng Griyego ngunit hindi nito ipinapasya ang eksaktong teolohikal na mekanismo ng bautismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salitang “binautismuhan,” samantalang ang “tungo” ay sadyang nagpapanatili ng di-karaniwang lakas at teolohikal na tensiyon ng dalawang gamit ng εἰς.
