  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: tl
  text: Kaya, ano ang bungang tinamo ninyo noon mula sa mga bagay na ikinahihiya ninyo ngayon? Sapagkat kamatayan ang wakas[a] ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahihinatnan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: ano
  rationale: Pinananatili ang tuwirang lakas ng retorikal na tanong nang hindi nililimitahan kung uri o dami ng bunga ang tinutukoy.
- source_word: καρπὸν
  choice: bunga
  rationale: Pinananatili ang metapora ni Pablo para sa ibinubunga o resulta ng dating pamumuhay, sa halip na gawing tahasang “pakinabang” o “resulta.”
- source_word: εἴχετε
  choice: tinamo ninyo
  rationale: Likas itong kaakibat ng “bunga” sa modernong Tagalog at ipinahahayag ang bunga o pakinabang na taglay nila noon, bagaman hindi nito literal na ginagaya ang pandiwang “mayroon.”
- source_word: τότε
  choice: noon
  rationale: Maikli at malinaw na itinatapat ang dati nilang kalagayan sa “ngayon.”
- source_word: ἐφ’ οἷς
  choice: mula sa mga bagay na
  rationale: Ipinahahayag ang malamang na diwa ng pinagmulan—ang bungang nagmula sa kanilang dating mga gawain—at nililinaw ang ipinahihiwatig na pangngalang “mga bagay.”
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang matalas na paghahambing sa “noon.”
- source_word: ἐπαισχύνεσθε
  choice: ikinahihiya na ninyo
  rationale: Nagpapahayag ng kasalukuyang moral na kahihiyan nang mas mabigat kaysa simpleng pagkapahiya.
- source_word: τέλος
  choice: wakas
  rationale: Pinananatili ang saklaw ng salitang Griyego bilang hantungan o katapusan, habang ang alternatibong diwang “kahihinatnan” ay inilalagay sa talababa.
- source_word: ἐκείνων
  choice: ng mga iyon
  rationale: Malinaw na tumutukoy pabalik sa mga bagay o gawaing ikinahihiya nila ngayon nang hindi inuulit nang mabigat ang buong parirala.
- source_word: θάνατος
  choice: kamatayan
  rationale: Tuwiran at karaniwang katumbas na nagpapanatili sa bigat ng babala ni Pablo.
theological_decisions:
- issue: Kung ang τέλος ay isasaling “wakas” o bibigyang-kahulugang “kahihinatnan”
  choice: wakas
  alternative: kahihinatnan
  rationale: Ang “wakas” ay nagpapanatili kapwa sa ideya ng hantungan at sa posibleng diwa ng bunga o resulta, nang hindi agad nilulutas ang saklaw ng salita sa isang interpretasyon lamang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang metaporang “bunga” at ang retorikal na tanong; ginamit ang “tinamo” upang maging likas ang parirala sa Tagalog.
