  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: tl
  text: Kung namatay tayong kasama ng Mesiyas[a], naniniwala tayong mabubuhay rin tayong kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Kristo.” Griyego: Χριστῷ (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Kung
  rationale: Ipinakikilala ng εἰ ang kondisyong sugnay. May banayad na pagpapatuloy o paghahambing ang δέ, ngunit hindi kailangang lagyan ng hiwalay na pang-ugnay sa Filipino dahil malinaw na ito sa daloy ng pangungusap.
- source_word: ἀπεθάνομεν
  choice: namatay tayo
  rationale: 'Ang aorist indicative ay likas na naipahahayag sa Filipino bilang natapos na kilos: “namatay tayo.”'
- source_word: σὺν Χριστῷ
  choice: kasama ng Mesiyas
  rationale: Tuwirang ipinahahayag ng “kasama” ang pakikiugnay na tinutukoy ng σύν. Isinalin ang Χριστός bilang titulong “Mesiyas,” habang ibinigay sa talababa ang karaniwang alternatibong “Cristo.”
- source_word: πιστεύομεν
  choice: naniniwala tayo
  rationale: Ang “naniniwala” ang natural at tuwirang katumbas ng πιστεύομεν sa pahayag na ito.
- source_word: ὅτι
  choice: —
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng paniniwala. Hindi kailangan ang tahasang katumbas na pang-ugnay sa natural na Filipino; malinaw ang ugnayan ng dalawang sugnay.
- source_word: καὶ
  choice: rin
  rationale: 'Ipinakikita ng “rin” ang katumbas na karagdagang realidad: kung namatay tayong kasama niya, mabubuhay rin tayong kasama niya.'
- source_word: συζήσομεν
  choice: mabubuhay tayo
  rationale: Pinananatili ng anyong panghinaharap na “mabubuhay” ang hinaharap na pananaw ng pandiwa. Ang diwa ng pamumuhay na magkasama ay binubuo kasama ng kasunod na “kasama niya.”
- source_word: αὐτῷ
  choice: kasama niya
  rationale: Sa pagsama sa συζήσομεν, natural na ipinahahayag ito sa Filipino bilang “kasama niya.”
theological_decisions:
- issue: Pagpapahayag sa Χριστῷ
  choice: Mesiyas
  alternative: Cristo
  rationale: Ginamit ang kahulugan ng titulo upang maging malinaw sa mambabasa, ngunit pinanatili sa talababa ang tradisyonal at malapit-sa-Griyegong alternatibong “Cristo.”
- issue: Saklaw ng hinaharap na buhay sa συζήσομεν αὐτῷ
  choice: mabubuhay rin tayong kasama niya
  alternative: muli tayong mabubuhay kasama niya; makikibahagi tayo sa buhay ng muling pagkabuhay niya
  rationale: Hindi nililimitahan ng salin ang pahayag sa isang tiyak na mekanismo o yugto. Pinananatili nito ang malawak na diwa ng hinaharap na pamumuhay na kasama ng Mesiyas.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang inklusibong “tayo” ayon sa unang panauhang maramihan ng Griyego, at pinanatili ang balanseng pag-uulit ng “kasama” upang luminaw ang ugnayan ng kamatayan at buhay kasama ng Mesiyas.
