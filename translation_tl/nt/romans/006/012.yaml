review_pass:
  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang lohikal na συνέπεια ng οὖν, ang utos na huwag pahintulutang maghari ang kasalanan, ang “katawang mortal,” at ang malabong tinutukoy ng αὐτοῦ. Gayunman, ang “nang sa gayon ay sundin ninyo” ay maaaring mabasa na parang layunin ng utos na sundin ang mga pagnanasa, sa halip na layunin ng pagbabawal na huwag umabot sa gayong pagsunod. Ang pagdaragdag ng “hindi” ay likas na paraan sa Tagalog upang maipahayag ang saklaw ng negasyon sa buong pahayag nang hindi binabago ang diwa.
  naturalness: Ang “Kaya, huwag ninyong hayaang maghari” at “katawang mortal” ay malinaw at marangal sa modernong Filipino Tagalog. Mas natural at hindi gaanong malabo ang “upang hindi ninyo sundin” kaysa sa “nang sa gayon ay sundin ninyo” pagkatapos ng negatibong utos.
  terminology: Ang “kasalanan,” “maghari,” “katawang mortal,” at “mga pagnanasa” ay angkop. Pinananatili ng “nito” ang pinakamalapit na gramatikal na ugnayan sa “katawan”; ang talababa ay angkop na nagtatala ng kontekstuwal na alternatibong pag-unawa na inuugnay ang mga pagnanasa sa kasalanan.
  issues:
  - severity: medium
    issue: Malabo ang saklaw ng negasyon sa sugnay na “nang sa gayon ay sundin ninyo.”
    rationale: Sa kasalukuyang ayos, maaari itong unawain na ang pagsunod sa mga pagnanasa ang layunin o resulta na tuwirang ipinahihintulot ng utos. Sa Tagalog, ang “upang hindi ninyo sundin” ang malinaw na katumbas ng ipinagbabawal na paghahari ng kasalanan na humahantong sa pagsunod sa mga pagnanasa.
  revised_text: Kaya, huwag ninyong hayaang maghari ang kasalanan sa inyong katawang mortal upang hindi ninyo sundin ang mga pagnanasa nito.[a]
