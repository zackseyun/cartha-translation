  rationale: Nilinaw ang saklaw ng negatibong utos sa paraang natural sa modernong Tagalog. Nanatili ang personipikasyon ng kasalanan bilang naghahari, ang mortalidad ng katawan, at ang maingat na talababa para sa pinagtatalunang pag-uugnay ng panghalip.
