source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: tl
  text: Kaya, huwag ninyong hayaang maghari ang kasalanan sa inyong katawang mortal upang hindi ninyo sundin ang mga pagnanasa nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring: “mga pagnanasa ng kasalanan.”'
    reason: Pinananatili ang posibleng alternatibong pag-unawa sa tinutukoy ng αὐτοῦ.
lexical_decisions:
- source_word: οὖν
  choice: Kaya
  rationale: Malinaw at natural na ipinahihiwatig ang kongklusyon o bunga ng naunang pangangatwiran.
- source_word: βασιλευέτω
  choice: huwag ninyong hayaang maghari
  rationale: Pinananatili ang lakas ng utos at ang larawang maharlika ng kasalanan bilang naghaharing kapangyarihan.
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Tuwirang katumbas na nagpapanatili sa pagsasatao rito ng kasalanan sa pamamagitan ng pandiwang “maghari.”
- source_word: θνητῷ
  choice: mortal
  rationale: Karaniwan at maikling salitang Filipino para sa katawang nakatakdang mamatay; pinananatili nito ang kaibahan sa bagong buhay na tinatalakay sa konteksto.
- source_word: σώματι
  choice: katawan
  rationale: Tuwiran at likas na katumbas; walang dahilan sa konteksto upang palawakin ito bilang “pisikal na katawan.”
- source_word: εἰς τὸ ὑπακούειν
  choice: nang sa gayon ay sundin ninyo
  rationale: Naipapahayag ang layunin o kinalabasan ng paghahari ng kasalanan habang nananatiling malinaw ang kaugnayan ng mga sugnay.
- source_word: ἐπιθυμίαις
  choice: mga pagnanasa
  rationale: Sapat ang lawak upang hindi ikulong ang kahulugan sa seksuwal na pagnanasa lamang, ngunit taglay pa rin ang negatibong bigat nito sa konteksto.
- source_word: αὐτοῦ
  choice: nito
  rationale: Maaaring tumukoy nang natural sa “katawang mortal,” na kaayon ng anyong neuter singular ng Griyego; pinananatili sa talababa ang posibleng pag-uugnay nito sa kasalanan.
theological_decisions:
- issue: Kung ang kasalanan ay inilalarawan lamang bilang mga gawa o bilang naghaharing kapangyarihan
  choice: Pinanatili ang pagsasatao sa kasalanan sa pariralang “maghari ang kasalanan.”
  alternative: Ipaliwanag ito bilang pagkontrol ng makasalanang asal.
  rationale: Maharlika at nagsasatao ang larawang dala ng pandiwang Griyego. Ang pagpapanatili rito ay hindi nagdaragdag ng isang partikular na sistemang doktrinal.
- issue: Ang tinutukoy ng αὐτοῦ (“nito”)
  choice: Sa pangunahing teksto, ang “nito” ay pinakamalapit na tumutukoy sa katawang mortal.
  alternative: Unawain ito bilang “mga pagnanasa ng kasalanan.”
  rationale: Ang panghalip na masculine/neuter singular ay umaayon sa neuter singular na “katawan,” hindi sa feminine na “kasalanan.” Gayunman, posible sa daloy ng diwa ang pag-uugnay nito sa kasalanan, kaya inilagay sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “katawang mortal” bilang maikli at pamilyar na katumbas, at pinanatili ang larawang “maghari” sa halip na gawing paliwanag lamang ang talata.
