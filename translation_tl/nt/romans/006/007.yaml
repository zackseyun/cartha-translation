translation:
  language: tl
  text: Sapagkat ang namatay ay napawalang-sala na sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “itinuring nang matuwid”; ayon sa konteksto, maaari ring “pinalaya na mula sa kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: ang namatay
  rationale: Ang artikulo at aorist participle ay gumaganap bilang pangngalan. Likas at hindi tumutukoy sa isang kasarian ang “ang namatay,” at pinananatili nito ang pangkalahatan o kumakatawang diwa.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng dahilan o paliwanag kaugnay ng naunang pahayag. Malinaw at angkop na pang-ugnay ang “Sapagkat.”
- source_word: δεδικαίωται
  choice: napawalang-sala na
  rationale: Pinananatili ng “napawalang-sala” ang legal o panghukumang diwa ng δικαιόω. Ipinahihiwatig ng “na” ang nananatiling bunga ng kilos na taglay ng perfect tense.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: mula sa kasalanan
  rationale: Pinananatili ng “mula sa” ang diwa ng paghihiwalay o paglaya na ipinapahayag ng ἀπό, nang hindi nililimitahan ang “kasalanan” sa pagkakasala lamang o sa kapangyarihan lamang nito.
theological_decisions:
- issue: Kung ang δικαιόω ay dapat unawain lamang sa panghukumang diwa o bilang paglaya mula sa kapangyarihan ng kasalanan.
  choice: napawalang-sala na mula sa kasalanan
  alternative: itinuring nang matuwid mula sa kasalanan; pinalaya na mula sa kasalanan
  rationale: Pinananatili ng pangunahing salin ang panghukumang lakas ng δικαιόω, samantalang pinananatili sa talababa ang mas literal na “itinuring na matuwid” at ang kontekstuwal na “pinalaya.” Sa gayon, hindi pinapawi ang tensiyon sa pagitan ng pagpapawalang-sala at paglaya sa Roma 6.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang bahagyang di-karaniwang “mula sa kasalanan” upang mapanatili ang larawan ng paghihiwalay sa orihinal at ang posibilidad na personipikado ang kasalanan sa konteksto.
