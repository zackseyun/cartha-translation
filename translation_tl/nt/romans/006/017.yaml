  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: tl
  text: Ngunit salamat sa Diyos dahil, bagaman mga alipin kayo noon ng kasalanan, buong puso ninyong sinunod ang huwaran ng turo na kung saan kayo ipinasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang anyo ng turo” o “ang pamantayan ng turo.” Ang pariralang “na kung saan kayo ipinasa” ay maaari ring “na kung saan kayo ibinigay”; pinananatili nito ang pasibong larawan na kayo ang ipinasa tungo sa huwaran ng turo.
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Ngunit salamat sa Diyos!
  rationale: Idyomang pagpapasalamat ito sa Diyos, hindi pagtukoy sa biyaya bilang isang abstraktong katangian. Ang padamdam ay likas sa Filipino at nagpapanatili sa masiglang tono ni Pablo.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: mga alipin ... ng kasalanan
  rationale: Pinananatili ng “alipin” ang larawan ng pag-aari at paghahari na mahalaga sa argumento ng Roma 6; hindi sapat na maipapakita iyon ng mas mahinang “lingkod.”
- source_word: ὑπηκούσατε
  choice: sinunod
  rationale: Ang pandiwa ay tumutukoy sa aktuwal na pagsunod, hindi lamang sa pakikinig. Natural ang “sinunod” kapag ang layon ay turo o pamantayan.
- source_word: ἐκ καρδίας
  choice: buong puso ninyong
  rationale: Natural na Filipino ito para sa taos at kusang pagsunod habang pinananatili ang metapora ng puso.
- source_word: τύπον διδαχῆς
  choice: huwaran ng turo
  rationale: Maaaring mangahulugan ang τύπος ng anyo, molde, huwaran, o pamantayan. Ang “huwaran ng turo” ay malinaw ngunit hindi isinasara ang larawang ipinahihiwatig ng salita.
- source_word: παρεδόθητε
  choice: pinagpasahan sa inyo
  rationale: Pinananatili nito ang pasibong larawan na ang mga mananampalataya mismo ang inilipat o ibinigay sa saklaw ng turo, sa halip na baguhin ang diwa na para bang ang turo lamang ang ipinasa sa kanila.
- source_word: εἰς ὃν
  choice: na pinagpasahan sa inyo
  rationale: Iniaangkop ang direksiyon ng εἰς sa natural na balarilang Filipino. Ang alternatibong “kung saan kayo ipinasok” ay mas literal sa galaw ngunit madaling magtunog na tumutukoy sa isang pisikal na lugar.
theological_decisions:
- issue: Kung palalambutin ang δοῦλοι bilang “mga lingkod” o pananatilihin bilang “mga alipin”
  choice: mga alipin ng kasalanan
  alternative: mga lingkod ng kasalanan
  rationale: Sentral sa Roma 6 ang metapora ng pagkaalipin, pagmamay-ari, at paghahari. Ang “mga alipin” ang higit na nagpapanatili sa bigat ng paghahambing ni Pablo.
- issue: Kung babaguhin ang pasibong parirala upang ang turo ang ipinasa sa mga mananampalataya
  choice: ang huwaran ng turo na pinagpasahan sa inyo
  alternative: ang huwaran ng turong ipinasa sa inyo
  rationale: Sa Griyego, ang mga mananampalataya ang paksa ng παρεδόθητε at sila ang “ipinasa” o “ibinigay” sa huwaran ng turo. Pinananatili ng napiling salin ang kapansin-pansing larawang ito.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang tono. Ginamit ang “turo” sa halip na mas teknikal na “doktrina,” at pinanatili ang matinding metapora ng pagkaalipin at ang di-pangkaraniwang pasibong larawan ng pagkakapasa sa isang huwaran ng turo.
