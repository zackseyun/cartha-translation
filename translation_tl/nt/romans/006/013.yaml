id: ROM.6.13
reference: Romans 6:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: tl
  text: At huwag ninyong iharap sa kasalanan ang mga bahagi ng inyong katawan bilang mga sandata[a] ng kalikuan. Sa halip, iharap ninyo ang inyong sarili sa Diyos bilang mga nabubuhay mula sa mga patay, at iharap sa Diyos ang mga bahagi ng inyong katawan bilang mga sandata ng katuwiran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kasangkapan.”
    reason: lexical_alternative
  - marker: b
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: iharap
  rationale: Pinananatili ng “iharap” ang pag-uulit ng pandiwa at ang diwang inilalagay ang sarili o katawan sa kapamahalaan o paggamit ng iba.
- source_word: μέλη
  choice: mga bahagi ng inyong katawan
  rationale: Mas malinaw at likas ito sa modernong Tagalog kaysa sa literal na “mga sangkap,” habang tinutukoy pa rin ang mga bahaging ginagamit sa pagkilos.
- source_word: ὅπλα
  choice: mga sandata
  rationale: Pinananatili nito ang matinding larawang pandigma ng salitang Griyego; ang mas malawak na “mga kasangkapan” ay inilagay sa talababa.
- source_word: ἀδικίας
  choice: kalikuan
  rationale: Ang “kalikuan” ay likas at marangal na katumbas sa kontekstong moral at malinaw na kasalungat ng “katuwiran.”
- source_word: ἁμαρτίᾳ
  choice: sa kasalanan
  rationale: Tuwirang salin ito na hindi inaalis ang posibleng personipikasyon sa kasalanan bilang naghaharing kapangyarihan sa konteksto.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: bilang mga nabubuhay mula sa mga patay
  rationale: Pinananatili nito ang paghahambing at ang tensiyon ng paglipat mula sa mga patay tungo sa pagiging buhay nang hindi tahasang dinaragdagan ng “binuhay.”
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ay angkop sa moral-teolohikal na gamit ni Pablo at tuwirang kasalungat ng “kalikuan”; ang “katarungan” ay posibleng alternatibo.
theological_decisions:
- issue: Ang kasalanan at ang Diyos bilang magkatunggaling pinaglilingkuran
  choice: Pinanatili ang tuwirang “sa kasalanan” at “sa Diyos.”
  alternative: “upang paglingkuran ang kasalanan ... upang paglingkuran ang Diyos”
  rationale: Ipinahihiwatig ng mga datibong Griyego ang pagpapasakop at direksiyon, ngunit hindi kailangang idagdag sa pangunahing teksto ang interpretatibong “paglingkuran.”
- issue: Ang larawang muling-pagkabuhay sa ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: “bilang mga nabubuhay mula sa mga patay”
  alternative: “bilang mga binuhay mula sa kamatayan”
  rationale: Hindi tahasang sinasabi ng Griyego ang “binuhay”; pinananatili ng salin ang kakaiba at siksik na pahayag at ang kaugnayan nito sa kamatayan at buhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga bahagi ng inyong katawan” para sa madaling pagkaunawa, ngunit pinanatili ang larawan ng mga sandata at ang magkatapat na “kalikuan” at “katuwiran.”
