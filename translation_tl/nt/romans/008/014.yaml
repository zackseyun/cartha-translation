  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: tl
  text: Sapagkat ang lahat ng pinapatnubayan ng Espiritu ng Diyos ay mga anak na lalaki ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga anak ng Diyos.” Ang “mga anak na lalaki” ang tahasang anyo sa Griyego at nagpapanatili sa diwa ng pag-aampon at pagmamana sa konteksto; kabilang dito ang mga lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: ang lahat ng
  rationale: Likas na Filipino para sa pangmaramihang ugnayang pahayag at pinananatili ang diwang tumutukoy sa buong pangkat.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran.
- source_word: πνεύματι θεοῦ
  choice: ng Espiritu ng Diyos
  rationale: Kasama ng pasibong pandiwang “pinapatnubayan,” ipinahihiwatig ng “ng” ang gumaganap o kasangkapan; pinananatili rin ang pariralang Paulino na “Espiritu ng Diyos.”
- source_word: ἄγονται
  choice: pinapatnubayan
  rationale: Natural at marangal na salin ng kasalukuyang pasibo, na naghahayag ng patuloy na paggabay nang hindi labis na idinidiin ang aspekto.
- source_word: οὗτοι
  choice: ay
  rationale: Sa Filipino, ang tuwirang sugnay na “ang lahat ng… ay…” ay likas na naghahatid ng pagkakakilanlang binibigyang-diin ng demonstratibong Griyego; ang tahasang “ang mga ito” ay magiging mabigat at di-likas.
- source_word: υἱοί
  choice: mga anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking pangmaramihang katawagan ng Griyego at ang kaugnay na diwa ng pag-aampon at pagmamana sa konteksto.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwiran at malinaw na salin ng genitibo sa dalawang paglitaw nito.
theological_decisions:
- issue: Kung ang υἱοί θεοῦ ay isasaling “mga anak na lalaki ng Diyos” o sa mas inklusibong anyo.
  choice: mga anak na lalaki ng Diyos
  alternative: mga anak ng Diyos
  rationale: Tahasang panlalaking pangmaramihan ang υἱοί. Sa Roma 8, kaugnay rin ang katawagang ito sa pag-aampon at pagmamana. Pinananatili ng pangunahing teksto ang anyo at teolohikal na himig ng Griyego, habang nililinaw sa talababa na kabilang ang lahat ng mananampalataya anuman ang kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinapatnubayan” bilang natural na pasibong pandiwa at iniwasan ang mabigat na literalismong “ang mga ito ay.”
