id: ROM.8.13
reference: Romans 8:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: tl
  text: Sapagkat kung namumuhay kayo ayon sa laman[a], malapit na kayong mamatay; ngunit kung sa pamamagitan ng Espiritu ay pinapatay ninyo ang mga gawa ng katawan, mabubuhay kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “laman” dito ay metaporikal na tumutukoy sa makasalanang pagkatao o paraan ng pamumuhay, hindi lamang sa pisikal na katawan.
    reason: Nililinaw ang matalinghagang gamit ng σάρξ habang pinananatili sa pangunahing teksto ang literal na salitang “laman” at ang kaibahan nito sa “katawan.”
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatuwiran.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang matalinghagang salita ni Pablo at ang kaibahan nito sa Espiritu, sa halip na agad ipakahulugan bilang “makasalanang kalikasan.”
- source_word: ζῆτε
  choice: namumuhay kayo
  rationale: Likas sa Filipino at ipinahihiwatig ang patuloy na paraan ng pamumuhay sa kondisyong ito.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: mamamatay kayo
  rationale: Malinaw na ipinapahayag ang tiyak na kahihinatnan nang hindi ipinipilit ang temporal na diwang “malapit nang,” na hindi kinakailangan sa konteksto.
- source_word: πνεύματι
  choice: sa pamamagitan ng Espiritu
  rationale: Ipinapakita ang instrumental na gamit ng datibo at, ayon sa konteksto ng Roma 8, ang Banal na Espiritu bilang kumikilos na kapangyarihan.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: ang mga gawa ng katawan
  rationale: Pinananatili ang kongkretong etikal na diwa ng πράξεις at ang tahasang genitibong “ng katawan.”
- source_word: θανατοῦτε
  choice: pinapatay ninyo
  rationale: Direkta, kasalukuyan, at nauunawaang paglalarawan ng pagwawakas sa masasamang gawa, nang walang makalumang pananalita.
- source_word: ζήσεσθε
  choice: mabubuhay kayo
  rationale: Likas at tuwirang katumbas ng panghinaharap na pandiwa.
theological_decisions:
- issue: Kung ang πνεύματι ay tumutukoy sa Banal na Espiritu o sa espiritu ng tao
  choice: ang Banal na Espiritu
  alternative: ang espiritu ng tao, o sadyang malabong “espiritu”
  rationale: Ang paulit-ulit na paggamit at malinaw na paghahambing sa Roma 8 ay higit na sumusuporta sa Banal na Espiritu bilang nagbibigay-lakas upang patayin ang mga gawa ng katawan.
- issue: Kung ang σάρξ ay isasalin nang interpretatibo bilang “makasalanang kalikasan”
  choice: panatilihin ang “laman” at linawin sa talababa
  alternative: makasalanang kalikasan
  rationale: Ang “laman” ay nagpapanatili sa bokabularyo, larawan, at teolohikal na tensiyon ni Pablo; ang talababa ay tumutulong upang hindi ito mapagkamalang pisikal na katawan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namumuhay” para sa kinagawiang direksiyon ng buhay, at pinanatili ang magkatapat na “laman” at “Espiritu” na mahalaga sa argumento ng Roma 8.
