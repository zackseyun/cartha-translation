id: ROM.8.35
reference: Romans 8:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: tl
  text: Sino ang makapaghihiwalay sa atin sa pag-ibig ng Mesiyas? Ang paghihirap ba, o matinding kagipitan, o pag-uusig, o taggutom, o kawalan ng damit, o panganib, o tabak?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa pag-ibig natin sa Mesiyas.” Maaaring ganito ang kahulugan ng anyong Griyego, bagaman mas pinapaboran ng konteksto ang “pag-ibig ng Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Sino
  rationale: Ang personal na panghalip na pananong ay likas na isinasaling “Sino” at pinananatili ang retorikal na tanong ni Pablo.
- source_word: χωρίσει
  choice: makapaghihiwalay
  rationale: Ipinahahayag nito ang inaakalang kakayahan ng sinuman o anuman na maghiwalay; natural ito sa Filipino sa konteksto ng sunod na mga tanong.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Karaniwan, malinaw, at marangal na katumbas ng ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginamit ang titulong “Mesiyas” para sa Χριστός. Ang pariralang “pag-ibig ng Mesiyas” ay nagpapanatili sa anyong henitibo at natural sa Filipino.
- source_word: θλῖψις
  choice: paghihirap
  rationale: Malawak at madaling maunawaang salita para sa pagdurusa o matinding suliranin.
- source_word: στενοχωρία
  choice: matinding kagipitan
  rationale: Ipinakikita ang diwa ng pagkakulong sa masikip at mabigat na kalagayan, at naihihiwalay sa pangkalahatang “paghihirap.”
- source_word: διωγμός
  choice: pag-uusig
  rationale: Pamantayan at tumpak na katumbas sa kontekstong ito.
- source_word: λιμός
  choice: taggutom
  rationale: Tumutukoy sa malubhang kakulangan ng pagkain, hindi lamang sa personal na pagkagutom.
- source_word: γυμνότης
  choice: kawalan ng damit
  rationale: Malinaw sa modernong Filipino at ipinahahayag ang literal na pagkukulang sa kasuotan, na maaari ring magpahiwatig ng matinding kasalatan.
- source_word: κίνδυνος
  choice: panganib
  rationale: Direkta at natural na modernong katumbas.
- source_word: μάχαιρα
  choice: tabak
  rationale: Pinananatili ang konkretong larawan ng sandata at ang banta ng marahas na kamatayan.
theological_decisions:
- issue: Lakas ng henitibo sa τοῦ Χριστοῦ
  choice: pag-ibig ng Mesiyas
  alternative: pag-ibig natin sa Mesiyas
  rationale: Maaaring unawain ang henitibo bilang pag-ibig ng Mesiyas sa mga mananampalataya o bilang pag-ibig nila sa Mesiyas. Mas pinapaboran ng Roma 8:31–39 ang una, ngunit pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang sunod-sunod na retorikal na mga tanong at ang konkretong “tabak,” habang iniwasan ang mga salitang labis na makaluma o teknikal.
