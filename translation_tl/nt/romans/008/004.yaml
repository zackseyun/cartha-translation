id: ROM.8.4
reference: Romans 8:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: tl
  text: upang ang matuwid na hinihingi ng Kautusan[a] ay matupad sa atin na hindi namumuhay ayon sa laman[b] kundi ayon sa Espiritu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang hinihingi ng Kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “laman” dito ay tumutukoy sa makasalanang pagkatao o sa pamumuhay na nakatuon palayo sa Diyos; isinasalin ito ng ilan na “makasalanang kalikasan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “espiritu”; sa konteksto ng Roma 8, malamang na tumutukoy ito sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag ang layunin o nilalayong bunga ng sugnay.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: ang matuwid na hinihingi ng Kautusan
  rationale: Pinananatili ng “matuwid na hinihingi” ang legal at moral na diin ng δικαίωμα; ginamit ang malaking titik sa “Kautusan” bilang pagtukoy sa Kautusan sa kontekstong Paulino.
- source_word: πληρωθῇ
  choice: matupad
  rationale: Ang anyong balintiyak ay napananatili at ang pandiwa ay natural na katumbas ng pagganap o katuparan.
- source_word: ἐν ἡμῖν
  choice: sa atin
  rationale: Direktang pinananatili ang ἐν nang hindi ito ginagawang “natin,” na maaaring magpasok ng mas tiyak na pahayag tungkol sa gumaganap.
- source_word: περιπατοῦσιν
  choice: namumuhay
  rationale: Ipinapahayag sa likas na modernong Tagalog ang metaporikal na kahulugan ng “lumalakad,” samakatuwid ay ang paraan ng pamumuhay.
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang malawak at sadyang masalimuot na katawagang Paulino sa halip na paliitin agad ito sa “makasalanang kalikasan.”
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Sa agarang konteksto ng Roma 8, malamang na tumutukoy ito sa Banal na Espiritu, bagaman kinikilala sa talababa ang posibleng pagbasa na “espiritu.”
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: ayon sa laman ... ayon sa Espiritu
  rationale: Malinaw at magkatimbang na isinasalin ang dalawang pariralang may κατά.
theological_decisions:
- issue: Kung ang πνεῦμα ay tumutukoy sa espiritu ng tao o sa Banal na Espiritu
  choice: Espiritu
  alternative: espiritu
  rationale: Malakas na itinatampok ng Roma 8 ang gawain at saklaw ng Banal na Espiritu, ngunit hindi lubusang inaalis ng anyong Griyego lamang ang mas pangkalahatang pagbasa.
- issue: Kung ang ἐν ἡμῖν ay nangangahulugang katuparan “sa atin” o “natin”
  choice: matupad sa atin
  alternative: matupad natin / matupad sa gitna natin
  rationale: Ang “sa atin” ang pinakamalapit sa ἐν ἡμῖν at hindi nagpapasiya nang higit sa teksto tungkol sa ahensiya ng katuparan.
- issue: Kung ang σάρξ ay dapat ipakahulugang tahasan bilang “makasalanang kalikasan”
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Ang “laman” ay nagpapanatili sa saklaw at teolohikal na tensiyon ng terminong Paulino; ipinaliliwanag ang gamit nito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namumuhay” upang maging likas ang metapora ng περιπατέω, habang pinanatili ang mga terminong “laman” at “Espiritu” dahil mahalaga ang mga ito sa argumento ni Pablo.
