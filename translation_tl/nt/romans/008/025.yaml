base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: tl
  text: Ngunit kung umaasa tayo sa hindi natin nakikita, hinihintay[b] natin ito nang may pagtitiyaga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng pagtitiyaga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang pandiwa na “sabik na hinihintay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Pinananatili nito ang kondisyonal na diwa ng εἰ at ang bahagyang pagsalungat o pagpapatuloy na ipinahihiwatig ng δέ.
- source_word: ὃ οὐ βλέπομεν
  choice: ang hindi natin nakikita
  rationale: Likas ito sa makabagong Tagalog at hindi nagdaragdag ng ideyang ‘hindi kayang makita,’ na wala sa payak na present-tense na βλέπομεν.
- source_word: ἐλπίζομεν
  choice: inaasahan natin
  rationale: Sa kontekstong ito, ipinahahayag ng ἐλπίζομεν ang may-pagtitiwalang pag-asa sa isang katuparan sa hinaharap; natural sa Tagalog ang ‘inaasahan’ kapag may tuwirang layon.
- source_word: δι’ ὑπομονῆς
  choice: buong pagtitiis
  rationale: Ipinahahayag ng ὑπομονή ang matatag at matiising pananatili sa gitna ng pagkaantala o hirap, hindi lamang pasibong paghihintay.
- source_word: ἀπεκδεχόμεθα
  choice: natin itong hinihintay
  rationale: Malinaw at natural itong nagsasaad ng patuloy na paghihintay sa bagay na inaasahan; inilalagay sa talababa ang posibleng diin sa pananabik.
theological_decisions:
- issue: Ang kaugnayan ng pag-asang Cristiano sa katuparang hindi pa nakikita
  choice: Hindi tinukoy ang bagay na inaasahan nang higit sa sinabi ng sugnay na ‘ang hindi natin nakikita.’
  alternative: Tukuyin ito bilang kaligtasan, pagtubos, o muling pagkabuhay batay sa konteksto.
  rationale: Bagaman nililinaw ng nakapaligid na konteksto ang maaaring tinutukoy, nananatiling di-tiyak sa mismong talata ang layon. Pinananatili ng salin ang pagpipigil at tunay na lawak ng Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang ‘buong pagtitiis’ upang maipakita ang matatag na pagtitiis ng ὑπομονή, at iniwasang pangalanan ang hindi nakikitang bagay upang mapanatili ang pagiging bukas ng orihinal.
