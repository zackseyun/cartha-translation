  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: tl
  text: Ngunit sa lahat ng mga bagay na ito, lubos tayong nagtatagumpay sa pamamagitan ng nagmahal sa atin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na tumutukoy kay Cristo ayon sa malapit na konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Nagpapahayag ito ng mariing pagsalungat sa maaaring ipinahihiwatig ng mga paghihirap sa naunang talata, at likas at marangal itong pakinggan sa makabagong Filipino.
- source_word: ἐν τούτοις πᾶσιν
  choice: sa lahat ng mga bagay na ito
  rationale: Malapit ito sa anyo ng Griyego at malinaw na tumutukoy sa mga paghihirap na kababanggit lamang, nang hindi nagpapasya kung ang ἐν ay dapat unawain bilang 'sa gitna ng' o 'sa pamamagitan ng.'
- source_word: ὑπερνικῶμεν
  choice: lubos tayong nagtatagumpay
  rationale: Pinananatili ng 'nagtatagumpay' ang pandiwang anyo, habang ipinahahayag ng 'lubos' ang pinaigting na diwa ng ὑπέρ- sa tambalang pandiwa.
- source_word: διὰ τοῦ ἀγαπήσαντος ἡμᾶς
  choice: sa pamamagitan ng nagmahal sa atin
  rationale: Ipinahahayag ng 'sa pamamagitan ng' ang paraan o personal na ahensiya ng διά na may genitive; pinananatili ng 'nagmahal sa atin' ang substantibong aorist participle nang hindi tahasang pinapangalanan ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan ng “nagmahal sa atin”
  choice: Hindi tahasang pinangalanan sa pangunahing teksto; isinalin bilang “ang nagmahal sa atin.”
  alternative: Tukuyin bilang si Cristo, o mas malawak bilang ang Diyos kay Cristo.
  rationale: Malakas na itinuturo ng malapit na konteksto si Cristo, lalo na sa Roma 8:35, ngunit walang tahasang pangalan sa mismong pariralang Griyego. Kaya pinananatili sa teksto ang orihinal na paraan ng pagtukoy at inilalagay sa talababa ang malamang na referent.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pandiwang “lubos tayong nagtatagumpay” upang mailapit sa anyo at pinaigting na diwa ng ὑπερνικῶμεν, sa halip na ang mas idyomatikong pangngalang pahayag na “higit pa tayo sa mga mananagumpay.”
