id: ROM.8.2
reference: Romans 8:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: tl
  text: Sapagkat pinalaya ka ng kautusan ng Espiritu ng buhay sa Mesiyas na si Jesus mula sa kautusan ng kasalanan at kamatayan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “prinsipyo”: “ang prinsipyo ng Espiritu ng buhay.”'
    reason: lexical_alternative
  - marker: b
    text: May ilang manuskrito na may “ako” sa halip na “ka.”
    reason: textual_variant
  - marker: c
    text: 'Tradisyonal na salin: “kay Cristo Jesus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: kautusan
  rationale: Pinanatili ang iisang salitang “kautusan” sa dalawang paglitaw upang maipakita ang pag-uulit at tensiyon sa talinghaga ni Pablo; maaaring mangahulugan itong “prinsipyo,” ngunit mas maagang nililimitahan niyon ang saklaw ng salita.
- source_word: πνεύματος τῆς ζωῆς
  choice: Espiritu na nagbibigay-buhay
  rationale: Ang “Espiritu” ay tumutukoy sa Banal na Espiritu ayon sa konteksto ng Roma 8. Isinalin ang ugnayang henitibo sa likas na Tagalog bilang “na nagbibigay-buhay,” nang hindi ginagawang impersonal na puwersa ang Espiritu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: sa Mesiyas na si Jesus
  rationale: Ginamit ang titulong “Mesiyas” para sa Χριστός at pinanatili ang ἐν bilang “sa,” upang hindi burahin ang wika ni Pablo tungkol sa pakikiisa sa Mesiyas.
- source_word: ἠλευθέρωσέν
  choice: pinalaya
  rationale: Natural at tuwirang pandiwang Tagalog para sa natapos na kilos ng pagpapalaya; malinaw sa konteksto ang nananatiling bunga nito.
- source_word: σε
  choice: ka
  rationale: Sinunod ang ikalawang panauhang isahan na σε sa nakalimbag na tekstong SBLGNT; inilagay sa talababa ang baryanteng “ako.”
- source_word: ἁμαρτίας καὶ τοῦ θανάτου
  choice: kasalanan at kamatayan
  rationale: Pinanatili ang isahan at ang masinsing magkatambal na parirala, na maaaring tumukoy sa kasalanan bilang realidad at kapangyarihang umaalipin.
theological_decisions:
- issue: Kung ang πνεύματος ay tumutukoy sa Banal na Espiritu o sa espiritu/prinsipyong espirituwal
  choice: Banal na Espiritu (“Espiritu”)
  alternative: espiritu ng tao o espirituwal na prinsipyo
  rationale: Sa Roma 8, ang paghahambing ng laman, kasalanan, at kamatayan sa Espiritung nagbibigay-buhay ay higit na sumusuporta sa pagtukoy sa Banal na Espiritu.
- issue: Saklaw ng pariralang ἐν Χριστῷ Ἰησοῦ
  choice: Pinanatili bilang “sa Mesiyas na si Jesus,” na maaaring iugnay sa nagpapalayang kautusan o sa kilos ng pagpapalaya
  alternative: Ilahad nang tahasan bilang “sa pamamagitan ng Mesiyas na si Jesus”
  rationale: Hindi ganap na tiyak ang pagkakaugnay ng parirala sa Griyego; iniwasang lutasin ito sa paraang mas makitid kaysa sa orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang ipakita ang lohikal na ugnayan sa naunang talata, at “Mesiyas” bilang malinaw na titulo. Ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang tunay na kalabuan ng ἐν Χριστῷ Ἰησοῦ.
