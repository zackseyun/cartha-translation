- from: Sapagkat pinalaya ka ng kautusan ng Espiritu na nagbibigay-buhay, sa Mesiyas na si Jesus, mula sa kautusan ng kasalanan at kamatayan.[a][b][c]
  to: Sapagkat pinalaya ka ng kautusan ng Espiritu ng buhay sa Mesiyas na si Jesus mula sa kautusan ng kasalanan at kamatayan.[a][b][c]
  rationale: Inayos ang talababa ng tekstuwal na baryante upang malinaw na ang “ka” ang pagbasa ng pangunahing teksto at ang “ako” ang alternatibong pagbasa. Pinalitan ang nagpapaliwanag na “na nagbibigay-buhay” ng mas tuwirang “ng buhay,” at inalis ang mga kuwit sa pariralang “sa Mesiyas na si Jesus” upang maging mas natural ang Filipino habang hindi pinipilit ang pinagtatalunang saklaw ng pariralang Griyego.
