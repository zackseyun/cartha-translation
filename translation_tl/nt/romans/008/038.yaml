  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: tl
  text: Sapagkat kumbinsido ako na ni ang kamatayan, ni ang buhay, ni ang mga anghel, ni ang mga pinuno[a], ni ang mga bagay sa kasalukuyan, ni ang mga bagay na darating, ni ang mga kapangyarihan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pamunuan”; maaaring tumukoy sa mga kosmiko o espirituwal na awtoridad.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: natitiyak ko
  rationale: Ipinahihiwatig ng perpektong anyo ang isang matatag at nagpapatuloy na katiyakan; natural at malinaw ito sa makabagong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o pagsuporta ng pangungusap sa naunang pahayag.
- source_word: οὔτε ... οὔτε
  choice: ni ... ni
  rationale: Likas na katumbas sa Tagalog na nagpapanatili sa paulit-ulit na ritmo at magkakaugnay na pagtanggi sa buong talaan.
- source_word: θάνατος
  choice: kamatayan
  rationale: Tuwiran at karaniwang salin.
- source_word: ζωή
  choice: buhay
  rationale: Tuwirang salin na katambal at kasalungat ng “kamatayan.”
- source_word: ἄγγελοι
  choice: mga anghel
  rationale: Bagaman maaari ring mangahulugang mga sugo, mas angkop dito ang mga anghel dahil kasama ito sa talaan ng mga kosmiko o higit-sa-taong realidad.
- source_word: ἀρχαὶ
  choice: mga pinuno
  rationale: Nananatiling malawak at madaling maunawaan ang kahulugan; hindi nito nililimitahan ang salita sa isang tiyak na sistema ng mga espirituwal na nilalang.
- source_word: ἐνεστῶτα
  choice: mga bagay sa kasalukuyan
  rationale: Ipinahahayag ang mga umiiral na realidad sa kasalukuyan habang pinananatili ang abstraktong lawak ng salita.
- source_word: μέλλοντα
  choice: mga bagay na darating
  rationale: Natural na tumutukoy sa mga realidad sa hinaharap at kapantay sa anyo ng naunang parirala.
- source_word: δυνάμεις
  choice: mga kapangyarihan
  rationale: Pinananatili ang posibilidad na tumukoy sa mga makapangyarihang espirituwal na nilalang o sa mas malawak na mga puwersa.
theological_decisions:
- issue: Kung ang ἀρχαὶ at δυνάμεις ay dapat isalin bilang mga teknikal na pangalan ng mga espirituwal na nilalang
  choice: Ginamit ang malalawak na katawagang “mga pinuno” at “mga kapangyarihan.”
  alternative: “mga pamunuan at mga kapangyarihan” o “mga espirituwal na pinuno at kapangyarihan”
  rationale: Malamang na kabilang sa tinutukoy ang mga kosmiko o espirituwal na kapangyarihan, ngunit hindi kailangang paliitin ng salin ang saklaw ng mga salitang Griyego o magpasok ng isang tiyak na teolohikal na balangkas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang paulit-ulit na “ni” upang mapanatili ang retorikal na indayog ng Griyego. Nagtatapos sa kuwit sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
