  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: tl
  text: Gayundin, tinutulungan tayo ng Espiritu sa ating kahinaan. Sapagkat hindi natin alam kung ano ang ipapanalangin natin gaya ng nararapat, ngunit ang Espiritu mismo ang namamagitan taglay ang mga daing na hindi mabigkas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga daing na hindi maipahayag sa salita” o “mga daing na walang salita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καί
  choice: Gayundin
  rationale: Iniuugnay nito ang ginagawa ng Espiritu sa naunang konteksto nang likas at maikli sa modernong Tagalog; hindi na kailangang isalin nang hiwalay ang bawat pang-ugnay.
- source_word: συναντιλαμβάνεται
  choice: tinutulungan tayo
  rationale: Ipinahihiwatig ng pandiwa ang pakikiisa sa pagdadala ng isang pasanin o pagharap sa kahirapan. Likas sa Tagalog ang “tinutulungan tayo,” habang ang kasunod na “sa ating kahinaan” ang nagsasaad ng larangan ng tulong.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: sa ating kahinaan
  rationale: Pinananatili ang pang-isahang kolektibong diwa at hindi nililimitahan ang kahinaan sa pisikal o espirituwal lamang.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν
  choice: Sapagkat hindi natin alam kung ano ang ipapanalangin natin gaya ng nararapat
  rationale: Pinananatili kapuwa ang tanong kung ano ang ipapanalangin at ang pamantayang “gaya ng nararapat,” nang hindi ginagawang mas tiyak ang hindi tinukoy ng Griyego.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: ang Espiritu mismo
  rationale: Ang “mismo” ang likas na katumbas ng mariing αὐτό at malinaw na itinatampok na ang Espiritu ang kumikilos.
- source_word: ὑπερεντυγχάνει
  choice: namamagitan
  rationale: Ipinahahayag nito ang pagkilos ng Espiritu bilang tagapamagitan nang hindi nagdaragdag ng tahasang layon na wala sa sugnay.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: sa pamamagitan ng mga daing na di-mabigkas
  rationale: Ang “di-mabigkas” ay maikli at dignified na nagpapakita na ang mga daing ay hindi maisatinig o maipahayag sa salita, habang pinananatili sa talababa ang leksikal na saklaw.
theological_decisions:
- issue: Kung dapat bang ipakita ang Espiritu bilang personal na kumikilos kahit neuter ang πνεῦμα sa gramatikang Griyego
  choice: ang Espiritu mismo ang namamagitan
  alternative: ang espiritu mismo ang namamagitan
  rationale: Hindi nagtatakda ng kasariang panggramatika ang Tagalog. Ang malaking titik, mariing “mismo,” at personal na mga kilos na pagtulong at pamamagitan ay sapat na sumusunod sa konteksto nang hindi umaasa sa isang panghalip na may kasarian.
- issue: Kung kaninong mga daing ang tinutukoy
  choice: mga daing na di-mabigkas
  alternative: mga daing ng Espiritu na di-mabigkas
  rationale: Hindi tahasang nilalagyan ng Griyego ng genitive na may-ari ang στεναγμοῖς. Hindi idinagdag ang “ng Espiritu” upang mapanatili ang anyo at posibleng tensiyon ng pahayag, bagaman ang Espiritu ang tahasang paksa ng pamamagitan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili ang pag-uulit ng “Espiritu” at ang ambiguwidad ng pariralang tungkol sa mga daing.
