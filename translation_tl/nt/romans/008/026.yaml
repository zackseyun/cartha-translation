  to: Gayundin, tinutulungan tayo ng Espiritu sa ating kahinaan. Sapagkat hindi natin alam kung ano ang ipapanalangin natin gaya ng nararapat, ngunit ang Espiritu mismo ang namamagitan taglay ang mga daing na hindi mabigkas[a].
  rationale: Pinalitan ang paulit-ulit na “sa pamamagitan ng” ng “taglay ang,” upang maging mas natural ang Tagalog habang pinananatili ang instrumental na diwa ng στεναγμοῖς (“may/sa pamamagitan ng mga daing”). Ginawang “hindi mabigkas” ang “di-mabigkas” para sa mas karaniwang modernong anyo. Walang binagong kahulugang teolohikal o nilinaw na ambiguwidad na wala sa pinagmulan.
