    issue: Hindi malinaw ang pandiwang “nagpailalim dito.”
    rationale: Sa karaniwang gamit ng Filipino, ang magpailalim sa/dito ay madaling mabasa bilang kusang pagpapailalim ng paksa sa isang bagay. Hindi nito malinaw na naihahayag ang personal na gumagawa na nagsailalim sa sangnilikha, na siyang tinutukoy ng τὸν ὑποτάξαντα.
