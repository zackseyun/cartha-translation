  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: tl
  text: Sapagkat ang sangnilikha ay ipinasailalim sa kawalang-kabuluhan[a], hindi sa sarili nitong kagustuhan, kundi dahil sa gumawa nito[b], na may pag-asa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kawalang-saysay,” “kabiguan,” o “kahungkagan.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang tinutukoy sa Griyego kung sino ang “gumawa nito.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “sa pag-asa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: kawalang-kabuluhan
  rationale: Ipinapahiwatig dito ang kalagayang hindi maabot ng sangnilikha ang nararapat nitong layunin, hindi ang moral na kasamaan. Likas sa modernong Filipino ang “kawalang-kabuluhan” at napapanatili nito ang lawak ng salita.
- source_word: κτίσις
  choice: sangnilikha
  rationale: Sa konteksto ng Roma 8:19–22, kolektibo itong tumutukoy sa nilikhang kaayusan, lalo na sa sangnilikha bukod sa sangkatauhan, hindi sa isang indibidwal na nilalang.
- source_word: ὑπετάγη
  choice: ipinasailalim
  rationale: Pinananatili ng anyong balintiyak ang diwang may ibang naglagay sa sangnilikha sa ganitong kalagayan.
- source_word: οὐχ ἑκοῦσα
  choice: hindi sa sarili nitong kagustuhan
  rationale: Malinaw nitong ipinakikitang hindi kusang pinili ng sangnilikha ang pagpapasailalim, habang natural ang pahayag sa Filipino.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: dahil sa nagpailalim dito
  rationale: Ginagamit ang διά na may akusatibo sa diwang sanhi. Hindi tahasang pinapangalanan ng salin kung sino ang gumawa nito.
- source_word: ἐφ’ ἑλπίδι
  choice: na may pag-asa
  rationale: Natural itong nag-uugnay sa pagpapasailalim at pinananatili ang maikli at pasulong na diwa ng parirala; kinikilala sa talababa ang maaari ring mas literal na “sa pag-asa.”
theological_decisions:
- issue: Pagkakakilanlan ng nagpailalim sa sangnilikha
  choice: 'Hindi pinangalanan sa pangunahing teksto: “ang nagpailalim dito.”'
  alternative: Maaaring unawain bilang Diyos na nagpailalim sa sangnilikha sa paghatol ngunit may layuning magligtas; iniuugnay rin ng ilan ang pagpapasailalim sa pagkakasala ni Adan.
  rationale: Hindi tahasang tinutukoy ng Griyego ang gumagawa. Pinananatili ng salin ang pagpipigil at tensiyong teolohikal ng teksto sa halip na pagpasyahan ito.
- issue: Pagkakaugnay ng ἐφ’ ἑλπίδι
  choice: Iniugnay sa pagpapasailalim sa pamamagitan ng “na may pag-asa.”
  alternative: Maaaring isalin nang mas literal na “sa pag-asa” at unawaing pambungad sa kasunod na pahayag.
  rationale: Walang bantas ang orihinal na manuskrito na tiyak na lulutas sa sintaktikong pagkakaugnay. Pinananatili ng maikling parirala at talababa ang posibleng pagkakaiba.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sangnilikha” upang ipahayag ang kolektibong created order, at iniwasang tukuyin sa pangunahing teksto ang hindi tahasang pinangalanang gumagawa.
