  to: Sapagkat ang sangnilikha ay ipinasailalim sa kawalang-kabuluhan[a], hindi sa sarili nitong kagustuhan, kundi dahil sa gumawa nito[b], na may pag-asa[c].
  rationale: Pinalitan ang malabong “nagpailalim dito” ng “gumawa nito.” Malinaw nitong tinutukoy ang hindi pinangalanang personal na sanhi ng pagpapasailalim, habang iniiwasang tukuyin kung sino siya o magdagdag ng isang teolohikal na pagbasa. Ang “nito” ay tumutukoy sa naunang pagpapasailalim sa kawalang-kabuluhan.
