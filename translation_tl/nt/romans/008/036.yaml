  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: tl
  text: 'Gaya ng nasusulat:


    “Dahil sa iyo, pinapatay kami buong araw;

    itinuring[a] kaming mga tupang kakatayin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Gaya ng
  rationale: Ipinananatili ang paghahambing at ang ugnayan ng sipi sa naunang pahayag sa likas na modernong Tagalog.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula sa pagpapakilala ng Kasulatan at nagpapahiwatig na nananatiling may bisa ang nakasulat.
- source_word: Ἕνεκεν σοῦ
  choice: Dahil sa iyo
  rationale: Malinaw na ipinapahayag ang sanhi o dahilan at pinananatili ang tuwirang pagtukoy sa Diyos nang hindi nagdaragdag ng paliwanag.
- source_word: θανατούμεθα
  choice: pinapatay kami
  rationale: Pinananatili ang tinig balintiyak at ang patuloy na pagkalantad sa kamatayan; ang kasunod na pariralang pangpanahon ang nagbibigay-diin sa pagpapatuloy.
- source_word: ὅλην τὴν ἡμέραν
  choice: sa buong maghapon
  rationale: Likas na salin ng panahong sumasaklaw sa buong araw at angkop sa maringal na himig ng sipi.
- source_word: ἐλογίσθημεν
  choice: itinuring
  rationale: Likas at malinaw na ipinapahayag na sila ay minalas o kinilalang kabilang sa isang kalagayan; inilalagay sa talababa ang mas literal na alternatibong “ibinilang.”
- source_word: ὡς
  choice: bilang
  rationale: Tuwirang ipinakikilala ang paghahambing sa kung paano sila itinuring.
- source_word: πρόβατα σφαγῆς
  choice: mga tupang kakatayin
  rationale: Malinaw at likas na pinananatili ang larawan ng mga tupang nakalaan sa pagkatay.
theological_decisions:
- issue: Ang pagsipi sa Awit 44:22 sa konteksto ng pagdurusa
  choice: Panatilihin ang sama-sama at nagpapatuloy na diwa ng mga taong itinuturing na nakalaan sa kamatayan.
  alternative: Ipaliwanag ang pahayag bilang tiyak na pagtukoy lamang sa pagkamartir.
  rationale: Payak na inilalahad ng Griyego ang panaghoy at hindi nililimitahan ang aplikasyon nito sa isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maringal, at angkop sa isang sipi mula sa Kasulatan. Pinanatili ang maikling anyong patula at ang matinding larawan ng walang tigil na pag-uusig.
