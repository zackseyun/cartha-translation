  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: tl
  text: Sino ang nagkakondena? Ang Mesiyas[a] ang namatay—higit pa rito, siya ang binuhay muli[b]—siya rin ang nasa kanan ng Diyos[c] at namamagitan para sa atin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kristo.”
    reason: lexical_alternative
  - marker: b
    text: 'O “muling nabuhay.” Balintiyak ang pandiwang Griyego: “binuhay muli.”'
    reason: alternative_reading
  - marker: c
    text: Ang “nasa kanan ng Diyos” ay isang biblikal na pahayag para sa pinakamataas na katayuan ng karangalan at kapangyarihan.
    reason: cultural_note
  - marker: d
    text: O “namamagitan alang-alang sa atin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: humahatol na tayo’y dapat parusahan
  rationale: Isinasalin ang substantival present participle bilang patuloy na gawain ng paghatol na humahantong sa kaparusahan. Ginawang hayag ang ipinahihiwatig na layon na “tayo” ayon sa konteksto, upang maging malinaw at natural sa Tagalog.
- source_word: Χριστός
  choice: Mesiyas
  rationale: Ginamit bilang titulong tumutukoy sa pinahirang hari, kaya “Mesiyas” ang pinili sa halip na gawing pangalang pantangi lamang.
- source_word: ἀποθανών
  choice: ang namatay
  rationale: Ang aorist participle ay natural na naipahahayag sa payak na naganap na anyo habang pinananatili ang makasaysayang kilos.
- source_word: μᾶλλον δὲ
  choice: higit pa rito
  rationale: Ipinakikita nito ang pag-igting ng pahayag mula sa kamatayan tungo sa muling pagkabuhay, hindi isang simpleng pagsalungat.
- source_word: ἐγερθείς
  choice: muling binuhay
  rationale: 'Pinananatili ang balintiyak na tinig ng Griyego: ang Mesiyas ay binuhay, sa halip na tahimik itong gawing aktibong “muling nabuhay.”'
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: nasa kanan ng Diyos
  rationale: Pinananatili ang pamilyar na biblikal na larawan ng marangal at makapangyarihang katayuan sa tabi ng Diyos.
- source_word: ἐντυγχάνει
  choice: namamagitan
  rationale: Ang “namamagitan” ay likas at dignified na salitang Tagalog para sa pagkilos alang-alang sa iba sa harap ng Diyos.
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Ito ang pinakanatural na pagpapahayag sa modernong Tagalog at naipahihiwatig pa rin ang pagkilos alang-alang sa atin.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός bilang titulo
  choice: Mesiyas
  alternative: Kristo
  rationale: Pinananatili ng “Mesiyas” ang kahulugan ng titulo sa argumento ni Pablo, habang inilalagay sa talababa ang tradisyonal na anyong “Kristo.”
- issue: Tinig ng ἐγερθείς
  choice: muling binuhay
  alternative: muling nabuhay
  rationale: Ang balintiyak na anyo ay tumutugma sa Griyego at hindi ipinapasiya para sa mambabasa ang ipinahihiwatig na tagaganap.
- issue: Larawan ng pagiging nasa kanan ng Diyos
  choice: nasa kanan ng Diyos
  alternative: nasa pinakamataas na katayuan ng karangalan at kapangyarihan
  rationale: Pinananatili sa pangunahing teksto ang orihinal na biblikal na larawan at ipinaliliwanag ang kahulugan nito sa talababa sa halip na palitan ng pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang retorikal na tanong, ang pag-igting ng “higit pa rito,” ang balintiyak na muling pagbuhay, at ang biblikal na larawan ng kanan ng Diyos. Hindi idinagdag ang “Jesus” sapagkat Χριστός lamang ang nasa ibinigay na tekstong SBLGNT.
