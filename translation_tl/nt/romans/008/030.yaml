  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: tl
  text: At ang mga itinalaga na niya noon pa[a] ay tinawag din niya; at ang mga tinawag niya ay itinuring din niyang matuwid; at ang mga itinuring niyang matuwid ay niluwalhati[b] rin niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinasya na niya noon pa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, anyong naganap ang “niluwalhati.” Nauunawaan ito ng ilan bilang pagtukoy sa kaluwalhatiang darating na napakatiyak kaya inilarawan na para bang naganap na.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: itinalaga nang una
  rationale: Ipinahahayag nito ang pagpapasiya o pagtatalaga bago pa man, nang hindi ipinapasok ang mas makitid na kahulugang mula sa isang partikular na sistemang teolohikal.
- source_word: ἐκάλεσεν
  choice: tinawag
  rationale: Likas at tuwirang katumbas ito sa Filipino at pinananatili ang ugnayan ng mga kilos sa sunod-sunod na pahayag ni Pablo.
- source_word: ἐδικαίωσεν
  choice: itinuring na matuwid
  rationale: Malinaw nitong ipinahahayag ang karaniwang forensic o deklaratibong diwa ng δικαιόω sa paggamit ni Pablo, at mas madaling maunawaan kaysa sa teknikal na salitang “inaring-ganap.”
- source_word: ἐδόξασεν
  choice: niluwalhati
  rationale: Pinananatili nito ang aorist o anyong naganap sa Griyego at ang maigsi at mariing pagkakasunod-sunod ng pangungusap.
- source_word: οὓς ... τούτους
  choice: ang mga ... ay ... niya
  rationale: Natural na estrukturang Filipino ito na pinananatiling iisang pangkat ang tinutukoy sa bawat sugnay.
- source_word: καὶ
  choice: din/rin
  rationale: Ipinakikita ng “din/rin” ang dagdag at magkakaugnay na pag-usad mula sa pagtatalaga patungo sa pagtawag, pag-aaring matuwid, at pagluwalhati.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito rito, hindi mariing pagsalungat; kaya ang “at” ang likas na katumbas.
theological_decisions:
- issue: Kung palalambutin ang προώρισεν upang maiwasan ang implikasyong denominasyonal
  choice: itinalaga nang una
  alternative: ipinasya nang una pa
  rationale: Pinananatili ng salin ang tahasang ideya ng naunang pagtatalaga, ngunit hindi nito ipinapaliwanag ang paraan o saklaw nito ayon sa anumang partikular na doktrina.
- issue: Kung isasalin ang ἐδόξασεν bilang naganap o panghinaharap
  choice: niluwalhati
  alternative: luluwalhatiin
  rationale: Aorist indicative ang anyo sa Griyego, kaya anyong naganap ang nasa pangunahing teksto. Inilalagay sa talababa ang karaniwang pagkaunawang maaaring tumukoy ito sa kaluwalhatiang darating ngunit tiyak na tiyak kaya inilarawang naganap na.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “itinuring na matuwid” sa halip na mas lumang teknikal na “inaring-ganap,” at pinanatili ang paulit-ulit na estruktura ng Griyego upang manatiling malinaw ang magkakaugnay na pangkat at mga kilos.
