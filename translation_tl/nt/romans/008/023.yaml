revisions:
- from: At hindi lamang iyon, kundi maging tayo mismo na may unang bunga ng Espiritu[a]—tayo mismo ay dumaraing sa ating kalooban habang sabik na hinihintay ang pag-ampon sa atin bilang mga anak na lalaki[b], samakatuwid, ang pagtubos sa ating mga katawan[c].
  to: At hindi lamang iyon, kundi tayo rin mismo—na may unang bunga ng Espiritu[a]—ay dumaraing sa loob natin, habang sabik nating hinihintay ang pag-ampon sa atin bilang mga anak na lalaki[b]—ang pagtubos sa ating mga katawan[c].
  rationale: Pinalitan ang inferensiyal na “samakatuwid” ng appositional na gitling upang tapat na maipakita na ang pagtubos sa mga katawan ang paglalarawan ng hinihintay na pag-ampon. Ginawang “sa loob natin” ang panloob na pagdaing at pinakinis ang ayos ng pangungusap, habang pinananatili ang diin, terminolohiyang teolohikal, at kalabuan ng “unang bunga ng Espiritu.”
