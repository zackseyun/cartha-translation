  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: tl
  text: At hindi lamang iyon, kundi tayo rin mismo—na may unang bunga ng Espiritu[a]—ay dumaraing sa loob natin, habang sabik nating hinihintay ang pag-ampon sa atin bilang mga anak na lalaki[b]—ang pagtubos sa ating mga katawan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring, “ang Espiritu bilang unang bunga.”
    reason: alternative_reading
  - marker: b
    text: O simpleng, “pag-ampon.” Mas literal na kasama sa salitang Griyego ang diwa ng pagiging anak na lalaki.
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “katawan natin”; ginamit ang isahan upang tumukoy sa katawan ng bawat isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: At hindi lamang iyon, kundi
  rationale: Likas na ipinagpapatuloy nito ang paghahambing mula sa naunang talata habang pinananatili ang mariing balangkas ng Griyego.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: maging tayo mismo … tayo mismo
  rationale: Pinananatili ang pag-uulit at diin na maging ang mga mananampalataya ay nakikibahagi sa pagdaing.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: unang bunga ng Espiritu
  rationale: Pinananatili ang larawan ng unang bahagi ng ani at ang posibleng pagkaunawa sa genitibo; nasa talababa ang posibilidad na ang Espiritu mismo ang unang bunga.
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: dumaraing sa ating kalooban
  rationale: Malinaw at natural na ipinahahayag ang panloob na pagdaing at pinananatili ang ugnayan sa pagdaing ng sangnilikha sa konteksto.
- source_word: ἀπεκδεχόμενοι
  choice: habang sabik na hinihintay
  rationale: Ipinahahayag ang masidhi at umaasang paghihintay na taglay ng pandiwa.
- source_word: υἱοθεσίαν
  choice: pag-ampon sa atin bilang mga anak na lalaki
  rationale: Pinananatili ang legal na larawan ng pag-ampon at ang tahasang diwa ng pagiging anak na lalaki sa tambalang salitang Griyego.
- source_word: τὴν ἀπολύτρωσιν
  choice: ang pagtubos
  rationale: Pinananatili ang mahalagang bokabularyong teolohikal ni Pablo at ang panghinaharap na ganap na pagpapalaya.
- source_word: τοῦ σώματος ἡμῶν
  choice: sa ating mga katawan
  rationale: Ginagamit ang likas na distributibong maramihan sa Filipino, bagaman isahan ang anyong Griyego.
theological_decisions:
- issue: Kung paano pananatilihin ang diwa ng pagiging anak na lalaki sa υἱοθεσίαν nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy
  choice: pag-ampon sa atin bilang mga anak na lalaki
  alternative: pag-ampon sa atin bilang mga anak
  rationale: Ang salitang Griyego ay may tahasang sangkap na tumutukoy sa katayuan ng anak na lalaki. Pinananatili ito sa pangunahing teksto, habang nililinaw sa talababa na saklaw ang lahat ng mananampalataya.
- issue: Kung ang τὴν ἀπαρχὴν τοῦ πνεύματος ay tumutukoy sa unang bungang mula sa Espiritu o sa Espiritu mismo bilang unang bunga
  choice: unang bunga ng Espiritu
  alternative: ang Espiritu bilang unang bunga
  rationale: Hindi ganap na nilulutas ng kayariang Griyego ang ugnayan. Pinananatili sa pangunahing teksto ang likas ngunit bukas na anyo, at inilalagay sa talababa ang appositional na posibilidad.
- issue: Ugnayan ng pag-ampon at pagtubos sa katawan
  choice: samakatwid, ang pagtubos sa ating mga katawan
  alternative: pag-ampon sa atin bilang mga anak na lalaki at ang pagtubos sa ating mga katawan
  rationale: Ang ikalawang parirala ay nasa apposition sa Griyego at inilalarawan kung paano mahahayag sa hinaharap ang hinihintay na pag-ampon, hindi isang hiwalay na bagay na hinihintay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kalooban” para sa panloob na pagdaing, “pag-ampon” para sa legal na larawan ng υἱοθεσία, at ang natural na distributibong maramihang “mga katawan.” Pinanatili ang mariing pag-uulit ng “tayo mismo” at ang tunay na kalabuan ng “unang bunga ng Espiritu.”
