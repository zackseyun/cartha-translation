id: ROM.8.10
reference: Romans 8:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: tl
  text: Ngunit kung nasa inyo ang Mesiyas, patay ang katawan dahil sa kasalanan[a], samantalang ang espiritu[b] ay buhay dahil sa katuwiran.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang katawan ay saklaw ng kamatayan” o “mortal ang katawan.”
    reason: lexical_alternative
  - marker: b
    text: O “ang Espiritu.” Maaaring tumukoy ang salitang Griyego sa espiritu ng tao na binigyang-buhay ng Diyos o sa Banal na Espiritu.
    reason: alternative_reading
  - marker: c
    text: O “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: Pinananatili ang titulong Mesiyaniko ng Χριστός sa halip na ituring lamang itong pangalang pantangi.
- source_word: σῶμα
  choice: katawan
  rationale: Tuwirang katumbas ito ng σῶμα at pinananatili ang kongkretong paghahambing nito sa πνεῦμα.
- source_word: νεκρὸν
  choice: patay
  rationale: Pinananatili ang matalas at tuwirang kahulugan ng pang-uri, habang inilalagay sa talababa ang posibleng diwang mortal o saklaw ng kamatayan.
- source_word: διὰ ἁμαρτίαν
  choice: dahil sa kasalanan
  rationale: Ipinahahayag nang natural sa Tagalog ang sanhi na tinutukoy ng διά na may akusatibo.
- source_word: πνεῦμα
  choice: espiritu
  rationale: Ang maliit na titik ay hindi agad nagpapasya kung ang tinutukoy ay espiritu ng tao na binigyang-buhay ng Diyos o ang Banal na Espiritu.
- source_word: ζωὴ
  choice: ay buhay
  rationale: Natural itong pahayag sa Tagalog at pinananatili ang siksik na predikasyong nominal ng Griyego, sa halip na dagdagan ng diwang 'nagbibigay-buhay.'
- source_word: διὰ δικαιοσύνην
  choice: dahil sa katuwiran
  rationale: Pinananatili ang sanhi at ang karaniwang diwang Paulino ng δικαιοσύνη; inilalahad sa talababa ang posibleng saling 'katarungan.'
theological_decisions:
- issue: Tinutukoy ng πνεῦμα
  choice: ang espiritu
  alternative: ang Espiritu
  rationale: Pinananatili nito ang paghahambing sa katawan nang hindi isinasara ang posibilidad na ang Banal na Espiritu ang tuwirang tinutukoy.
- issue: Diwa ng νεκρὸν kaugnay ng σῶμα
  choice: patay ang katawan
  alternative: ang katawan ay saklaw ng kamatayan / mortal ang katawan
  rationale: Ang pangunahing teksto ay nananatiling malapit sa tahasang salitang Griyego, habang kinikilala sa talababa ang posibleng pagtukoy sa mortalidad.
- issue: Diwa ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Ang 'katuwiran' ay natural sa kontekstong Paulino, ngunit hindi itinatanggi ang saklaw na may kaugnayan sa katarungan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “samantalang” upang natural na katawanin ang balanseng paghahambing na μὲν … δὲ nang hindi inuulit nang alanganin ang “ngunit.”
