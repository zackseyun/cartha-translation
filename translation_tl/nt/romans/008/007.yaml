id: ROM.8.7
reference: Romans 8:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: tl
  text: sapagkat ang pag-iisip ng laman ay pakikipag-alit sa Diyos[a]; sapagkat hindi ito nagpapasakop sa kautusan ng Diyos, at ni hindi nga ito kayang magpasakop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pag-iisip ng makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag at pinananatili ang malinaw na ugnayang sanhi.
- source_word: τὸ φρόνημα
  choice: ang pag-iisip
  rationale: Tumutukoy ito sa takbo o disposisyon ng isip, hindi lamang sa kakayahang intelektuwal; natural at malinaw sa modernong Tagalog ang “pag-iisip.”
- source_word: τῆς σαρκὸς
  choice: ng laman
  rationale: Pinananatili ang mahalagang metaporang Paulino at ang pagkakaugnay nito sa konteksto, sa halip na agad itong ipakahulugang “makasalanang kalikasan.”
- source_word: ἔχθρα εἰς θεόν
  choice: pakikipag-alit sa Diyos
  rationale: Pinananatili ang pangngalang ἔχθρα at ipinahahayag ang aktibong pagsalungat na nakatuon sa Diyos.
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: hindi ito nagpapasakop sa kautusan ng Diyos
  rationale: Natural na ipinahahayag ng “nagpapasakop” ang paglalagay ng sarili sa ilalim ng awtoridad, habang pinananatili ng “kautusan ng Diyos” ang pormal na bigat ng parirala.
- source_word: οὐδὲ γὰρ δύναται
  choice: at hindi nga nito kayang magpasakop
  rationale: Tahasan nitong pinananatili ang diin sa kawalan ng kakayahan. Inulit ang “magpasakop” bilang likas na ipinahihiwatig na pandiwa sa Griyego at upang maging buo ang pangungusap sa Tagalog.
theological_decisions:
- issue: Kung isasalin ang σάρξ bilang “laman” o bilang interpretibong “makasalanang kalikasan”
  choice: “laman” sa pangunahing teksto, na may interpretibong alternatibo sa talababa
  alternative: “makasalanang kalikasan”
  rationale: Metaporikal ang gamit sa konteksto, ngunit pinananatili ng “laman” ang terminong pinili ni Pablo at iniiwasang gawing lantad sa pangunahing teksto ang isang interpretasyon lamang.
- issue: Kung palalambutin ang huling sugnay bilang simpleng ayaw magpasakop
  choice: Tahasan itong isinalin bilang kawalan ng kakayahang magpasakop.
  alternative: “ayaw nitong magpasakop”
  rationale: Ang δύναται ay tuwirang tumutukoy sa kakayahan. Pinananatili ng salin ang teolohikal na tensiyon nang hindi nagdaragdag ng sistematikong paliwanag.
- issue: Kung gagawing pang-uri ang ἔχθρα o pananatilihing pangngalan
  choice: “pakikipag-alit sa Diyos”
  alternative: “kalaban ng Diyos” / “mapanlaban sa Diyos”
  rationale: Pangngalan ang ἔχθρα; ang “pakikipag-alit” ay nagpapanatili sa pormang iyon at sa diwa ng aktibong pagsalungat.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sapagkat” para sa dignified na tekstong biblikal, “kautusan” para sa νόμος, at “laman” upang mapanatili ang terminolohiyang Paulino. Ang tuldok-kuwit ay nagpapakita ng malapit ngunit malinaw na paghahati ng dahilan at paliwanag.
