  naturalness: Natural at marangal ang “pag-iisip ng laman,” “pakikipag-alit sa Diyos,” at “kautusan ng Diyos.” Mas natural at mas matibay ang daloy kapag ginamit ang “ni hindi nga” sa huling sugnay.
