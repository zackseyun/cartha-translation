  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: tl
  text: At ang sumisiyasat sa mga puso ay nalalaman kung ano ang kaisipan ng Espiritu, sapagkat ang Espiritu ay namamagitan para sa mga banal ayon sa Diyos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kalooban ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: sumisiyasat
  rationale: Ipinapahayag ng “sumisiyasat” ang masusi at aktibong paghahanap o pagsusuri, at natural itong gamitin kaugnay ng mga puso.
- source_word: καρδίας
  choice: mga puso
  rationale: Pinananatili nito ang metaporang biblikal ng καρδία bilang panloob na pagkatao, nang hindi ito pinalalawak sa “isip at puso.”
- source_word: τί τὸ φρόνημα
  choice: kung ano ang kaisipan
  rationale: Ang “kaisipan” ay nagpapahiwatig ng disposisyon o nilalaman ng isip sa konteksto ng Roma 8, at mas natural sa Tagalog kaysa sa tuwirang “mindset.”
- source_word: τοῦ πνεύματος
  choice: ng Espiritu
  rationale: Ang konteksto ay tumutukoy sa Banal na Espiritu, kaya ginamit ang malaking titik.
- source_word: ἐντυγχάνει
  choice: namamagitan
  rationale: Ito ang karaniwang malinaw na salita para sa pamamagitan sa panalangin o pagsusumamo para sa iba.
- source_word: ὑπὲρ ἁγίων
  choice: para sa mga banal
  rationale: Natural nitong isinasalin ang ὑπὲρ at pinananatili ang katawagan ni Pablo sa mga kabilang sa Diyos.
- source_word: κατὰ θεὸν
  choice: ayon sa Diyos
  rationale: Pinananatili nito ang siksik at literal na pahayag ng Griyego nang hindi tahasang idinaragdag ang salitang “kalooban.”
theological_decisions:
- issue: Kung gagawing tahasan ang κατὰ θεὸν bilang “ayon sa kalooban ng Diyos”
  choice: ayon sa Diyos
  alternative: ayon sa kalooban ng Diyos
  rationale: Malamang na kasama sa diwa ang pagsunod sa kalooban ng Diyos, ngunit walang katumbas na tahasang salita para sa “kalooban” sa Griyego. Pinanatili sa pangunahing teksto ang tunay na kaiklian at tensiyon ng pahayag, at inilagay sa talababa ang malinaw na interpretatibong alternatibo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang biblikal na “mga puso,” “Espiritu,” at “mga banal,” habang iniwasang gawing labis na paliwanag ang pangunahing teksto.
