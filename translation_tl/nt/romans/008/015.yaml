  naturalness: Mas natural sa makabagong Filipino ang malinaw na pandiwang ‘hindi kayo tumanggap ng’ kaysa sa pagbabaligtad na ‘hindi espiritu ... ang tinanggap ninyo.’ Ang ‘sa pamamagitan nito’ ay maayos na naghahatid ng instrumental na diwa nang hindi nililimitahan ang tinutukoy sa isang panlalaking persona.
  terminology: Ang ‘pagkaalipin,’ ‘pag-aampon bilang mga anak,’ at ‘Abba! Ama!’ ay angkop at marangal. Pinanatili ang maliit na titik sa ‘espiritu’ upang igalang ang paralelismo at ang gramatikal na kalabuan ng pinagmulan; ipinaliliwanag ng talababa ang malakas na kontekstuwal na pagbasa sa Banal na Espiritu.
