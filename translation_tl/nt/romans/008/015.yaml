id: ROM.8.15
reference: Romans 8:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: tl
  text: Sapagkat hindi kayo tumanggap ng espiritu ng pagkaalipin upang muli kayong matakot, kundi tumanggap kayo ng espiritu[a] ng pag-aampon bilang mga anak[b]. Sa pamamagitan nito[c] ay sumisigaw tayo, “Abba! Ama!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Espiritu.” Walang pantukoy sa Griyego; gayunman, malakas na ipinahihiwatig ng konteksto na ang Banal na Espiritu ang tinutukoy.
    reason: alternative_reading
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa legal na pagkakaloob ng katayuan bilang anak, kasama ang mga karapatan ng isang tagapagmana.
    reason: lexical_alternative
  - marker: c
    text: Mas literal, “sa nito” o “sa loob nito.” Ang panghalip sa Griyego ay nasa anyong neutral upang umayon sa gramatikal na kasarian ng salitang “espiritu”; maaari rin itong unawain bilang “sa kanya” kung ang Banal na Espiritu ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: espiritu ng pagkaalipin
  rationale: Pinananatili nito ang larawan ng pagkaalipin at ang tuwirang paghahambing sa kasunod na πνεῦμα υἱοθεσίας.
- source_word: πάλιν εἰς φόβον
  choice: upang muli kayong matakot
  rationale: Likas ito sa modernong Tagalog at malinaw na naipapahayag ang πάλιν at ang bunga o patutunguhan na ipinahihiwatig ng εἰς φόβον.
- source_word: πνεῦμα υἱοθεσίας
  choice: ang Espiritu ng pag-aampon bilang mga anak
  rationale: Ang malaking titik sa “Espiritu” ay umaayon sa malakas na pahiwatig ng konteksto na ang Banal na Espiritu ang tinutukoy, habang ang talababa ay nagpapanatili sa posibleng di-tiyak na pagbasa. Ang “pag-aampon bilang mga anak” ay nagpapanatili sa legal at pampamilyang diwa ng υἱοθεσία.
- source_word: υἱοθεσίας
  choice: pag-aampon bilang mga anak
  rationale: Ang “pag-aampon” ay malinaw na terminong legal at pampamilya sa Filipino; idinagdag ang “bilang mga anak” upang maipakita ang katayuang ipinagkakaloob, hindi lamang ang gawa ng pag-ampon.
- source_word: ἐν ᾧ
  choice: sa pamamagitan niya
  rationale: Ipinapahayag nito ang malamang na instrumental na gamit ng parirala at ang personal na pagtukoy sa Espiritu, habang itinatala sa talababa ang mas literal na anyo.
- source_word: κράζομεν
  choice: sumisigaw tayo
  rationale: Pinananatili nito ang mariin at taimtim na lakas ng pandiwa, higit kaysa sa payak na “tumatawag.”
- source_word: Αββα ὁ πατήρ
  choice: Abba! Ama!
  rationale: Pinananatili ang Aramaikong “Abba” sa transliterasyon at isinasalin ang Griyegong paliwanag na ὁ πατήρ bilang “Ama”; ang bantas ay nagpapakita ng mariing pagtawag.
theological_decisions:
- issue: Kung ang πνεῦμα υἱοθεσίας ay tahasang tumutukoy sa Banal na Espiritu o maaaring unawain bilang isang kalagayan o disposisyon
  choice: Espiritu ng pag-aampon bilang mga anak
  alternative: espiritu ng pag-aampon bilang mga anak
  rationale: Malakas na itinuturo ng konteksto ng Roma 8 at ng personal na ἐν ᾧ ang Banal na Espiritu, kaya ginamit ang malaking titik. Gayunman, dahil walang pantukoy sa Griyego at may paralelismo sa “espiritu ng pagkaalipin,” pinanatili sa talababa ang di-tiyak na pagbasa.
- issue: Kung dapat gawing tahasang panlalaki ang υἱοθεσία
  choice: pag-aampon bilang mga anak
  alternative: pag-aampon bilang mga anak na lalaki
  rationale: Sa Filipino, ang “anak” ay natural na sumasaklaw sa mga tagapagmanang lalaki at babae. Ipinaliliwanag ng talababa ang legal na diwa ng pagkakalagay sa katayuan ng anak na may karapatan sa mana, nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkaalipin,” “pag-aampon,” at “sumisigaw” bilang mga salitang karaniwang nauunawaan ngunit sapat ang bigat para sa konteksto. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at alanganing dugtong sa Filipino nang hindi binabago ang lohika ng talata.
