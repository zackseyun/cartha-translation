  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: tl
  text: Ang Espiritu mismo ay nagpapatotoo kasama ng ating espiritu[a] na tayo ay mga anak ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagpapatotoo sa ating espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Ang Espiritu mismo
  rationale: Pinananatili ng “mismo” ang diin ng αὐτό, habang ang “Espiritu” ay natural at marangal na pagtukoy sa Espiritu Santo sa Filipino.
- source_word: συμμαρτυρεῖ
  choice: nagpapatotoong kasama ng
  rationale: Ipinahahayag ng σύν- sa pandiwa ang kasabay o magkasamang pagpapatotoo; pinananatili ng pariralang ito ang ugnayang iyon sa halip na gawing pagpapatotoo lamang sa ating espiritu.
- source_word: τῷ πνεύματι ἡμῶν
  choice: kasama ng ating espiritu
  rationale: 'Itinuturing ang datibo bilang pakikisama o ugnayan sa συμμαρτυρεῖ: ang Espiritu ay nagpapatotoo kasabay ng ating espiritu.'
- source_word: ὅτι ἐσμὲν
  choice: na tayo ay
  rationale: Tuwirang ipinakikilala ang nilalaman ng pagpapatotoo nang walang idinagdag na diin.
- source_word: τέκνα θεοῦ
  choice: mga anak ng Diyos
  rationale: Ang τέκνα ay tumutukoy sa mga anak nang hindi nililimitahan sa kasarian; natural at malinaw sa modernong Filipino ang “mga anak ng Diyos.”
theological_decisions:
- issue: Personal na pagtukoy sa πνεῦμα
  choice: Ang Espiritu mismo
  alternative: Ang espiritu mismo
  rationale: Bagaman walang gramatikal na kasarian ang panghalip sa Filipino, ipinakikita ng malaking titik at ng “mismo” na ang tinutukoy ay ang Espiritu Santo at pinananatili ang personal na pagkilos at diin ng Griyego.
- issue: Ugnayan ng dalawang patotoo
  choice: nagpapatotoong kasama ng ating espiritu
  alternative: nagpapatotoo sa ating espiritu
  rationale: Mas tuwirang pinananatili ng napiling salin ang karaniwang diwa ng συμμαρτυρεῖ bilang pagpapatotoong kasama o kasabay, ngunit ang alternatibong pagbasa sa datibo ay kinikilala sa talababa.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “nagpapatotoo” upang mapanatili ang legal at patunay na diwa ng μαρτυρέω, at ang “kasama ng” upang malinaw na maipahayag ang σύν- nang hindi nagiging sobrang teknikal.
