id: ROM.8.5
reference: Romans 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: tl
  text: Sapagkat ang mga namumuhay ayon sa laman ay nakatuon sa mga bagay ng laman, ngunit ang mga namumuhay ayon sa Espiritu ay nakatuon sa mga bagay ng Espiritu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: mga namumuhay ayon sa laman
  rationale: Bagaman literal na “mga umiiral ayon sa laman,” ipinapahayag ng parirala ang kalagayan at takbo ng pamumuhay. Natural sa modernong Tagalog ang “namumuhay ayon sa laman,” at pinananatili nito ang paulit-ulit na salitang “laman.”
- source_word: φρονοῦσιν
  choice: nakatuon
  rationale: Saklaw ng pandiwa ang pag-iisip, pagpapahalaga, at disposisyon, hindi lamang isang pansamantalang iniisip. Ang “nakatuon” ay maikli at natural, at hindi ito nagpapaliit sa kahulugan tungo sa intelektuwal na pag-iisip lamang.
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Ginamit ang malaking titik dahil sa konteksto ng Roma 8, kung saan tinutukoy ang Espiritu ng Diyos; hindi dinagdagan ng “Banal” sapagkat wala iyon sa mismong talata.
theological_decisions:
- issue: Kahulugan ng σάρξ (laman)
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Pinananatili ang konkretong salitang ginamit ni Pablo at ang teolohikal na tensiyon nito. Ang “makasalanang kalikasan” ay posibleng interpretasyon ngunit mas makitid at nagpapasok ng paliwanag na wala sa salita mismo.
- issue: Pagkilala sa πνεῦμα
  choice: Espiritu
  alternative: espiritu
  rationale: Ipinahihiwatig ng malapit na konteksto na ang Espiritu ng Diyos ang tinutukoy. Gayunman, hindi idinagdag ang “ng Diyos” upang hindi palawakin ang teksto.
- issue: Ellipsis sa ikalawang sugnay
  choice: inuulit ang “ay nakatuon”
  alternative: iwan itong ipinahihiwatig lamang
  rationale: Walang ikalawang φρονοῦσιν sa Griyego ngunit malinaw itong ipinahihiwatig. Kailangang ulitin sa Tagalog upang maging natural at malinaw ang pangungusap nang hindi nagdaragdag ng bagong diwa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang balanseng estruktura at paghahambing ng “laman” at “Espiritu,” habang iniwasan ang masyadong literal at di-natural na “mga ayon sa laman.”
