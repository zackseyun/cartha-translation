base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: tl
  text: At alam natin na ang lahat ng bagay ay magkakasamang kumikilos para sa ikabubuti[a] ng mga umiibig sa Diyos, na tinawag ayon sa layunin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang manuskrito: “Ginagawa ng Diyos na ang lahat ng bagay ay magkakasamang kumilos para sa ikabubuti.”'
    reason: textual_variant
  - marker: b
    text: O “ayon sa kanyang layunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: alam natin
  rationale: Likas na salin ng pangkasalukuyang katiyakan o matatag na kaalaman, hindi lamang panandaliang pagkaunawa.
- source_word: δὲ
  choice: At
  rationale: Banayad na pang-ugnay ito na nagpapatuloy sa argumento; hindi nito pinalalakas ang diwang pasalungat.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: para sa mga umiibig sa Diyos
  rationale: Inihahayag nang natural sa Filipino ang datibo at pinananatili ang pagtukoy sa pangkat ng mga umiibig sa Diyos.
- source_word: πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng neuter plural nang hindi nililimitahan kung anong mga pangyayari o bagay ang tinutukoy.
- source_word: συνεργεῖ
  choice: magkakasamang kumikilos
  rationale: Inihahatid ang diwa ng sama-samang pagkilos habang hindi nagdaragdag ng tahasang simuno na ‘Diyos,’ na wala sa ibinigay na pangunahing tekstong Griyego.
- source_word: εἰς ἀγαθόν
  choice: tungo sa ikabubuti
  rationale: Ipinahihiwatig ang direksiyon o bunga ng pagkilos at natural itong pakinggan sa makabagong Filipino.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: para sa mga tinawag ayon sa layunin
  rationale: Pinananatili ang paglalarawan sa mga tinawag at hindi nagdaragdag ng panghalip na paari na wala sa Griyego.
- source_word: πρόθεσιν
  choice: layunin
  rationale: Malinaw at maikling salin para sa sinadyang hangarin o panukala sa kontekstong ito.
- source_word: κλητοῖς
  choice: tinawag
  rationale: Karaniwan at angkop na katawagang Paulino, nang hindi ipinapaliwanag nang lampas sa sinasabi ng teksto ang paraan o bisa ng pagtawag.
theological_decisions:
- issue: Ang hindi tahasang simuno ng συνεργεῖ
  choice: Sa pangunahing teksto, ‘ang lahat ng bagay ay magkakasamang kumikilos’ nang hindi ginagawang tahasang simuno ang Diyos.
  alternative: ‘Ginagawa ng Diyos na ang lahat ng bagay ay magkakasamang kumilos tungo sa ikabubuti.’
  rationale: Ang ibinigay na SBLGNT ay may πάντα συνεργεῖ at walang θεός bilang tahasang simuno. Pinananatili sa pangunahing teksto ang pagbasa nito, samantalang inilalagay sa talababa ang variant na tahasang bumabanggit sa Diyos.
- issue: Kung magdaragdag ng panghalip na paari sa κατὰ πρόθεσιν
  choice: ‘ayon sa layunin,’ nang walang ‘niya’
  alternative: ‘ayon sa kanyang layunin’
  rationale: Bagaman ipinahihiwatig ng konteksto na layunin ito ng Diyos, walang tahasang panghalip na paari sa pariralang Griyego; kaya hindi ito idinaragdag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘umiibig’ at ‘tinawag’ upang mapanatili ang biblikal at teolohikal na bigat nang hindi nagiging lipas o teknikal. Ang em dash ay nagpapakitang ang huling parirala ay muling tumutukoy sa parehong pangkat.
