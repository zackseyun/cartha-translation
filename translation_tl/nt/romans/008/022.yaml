  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: tl
  text: Sapagkat alam natin na ang buong sangnilikha ay sama-samang dumaraing at sama-samang nagdaranas ng mga sakit ng panganganak hanggang ngayon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lahat ng sangnilikha”; maaari rin namang “bawat nilalang,” bagaman mas malamang dito ang mas malawak na diwang tumutukoy sa buong sangnilikha.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sakit ng panganganak” ay larawan ng mga kirot sa panganganak; ipinahihiwatig nito hindi lamang ang pagdurusa kundi ang pagdurusang patungo sa pagsilang ng bagong buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: alam natin
  rationale: Karaniwang gamit ng οἶδα ang kasalukuyang kahulugan ng tiyak at pinagsasaluhang kaalaman; natural itong ipinahahayag sa modernong Tagalog bilang “alam natin.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang argumento.
- source_word: πᾶσα ἡ κτίσις
  choice: ang buong sangnilikha
  rationale: Ang parirala ay may kolektibong diwa, “ang buong sangnilikha,” at akma sa malawak na saklaw ng konteksto kaysa sa distributibong “bawat nilalang.”
- source_word: συστενάζει
  choice: sama-samang dumaraing
  rationale: Ipinahahayag ng “sama-sama” ang συν- na tumutukoy sa magkakasamang pagdaing ng sangnilikha.
- source_word: συνωδίνει
  choice: sama-samang nagdaranas ng mga sakit ng panganganak
  rationale: Pinananatili nito ang tiyak na larawan ng mga kirot ng panganganak, hindi lamang pangkalahatang pagdurusa, pati ang magkakasamang diwa ng συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: hanggang ngayon
  rationale: Natural at malinaw na katumbas na nagpapanatili sa kalagayang nagpapatuloy hanggang sa kasalukuyan.
theological_decisions:
- issue: Kung ang κτίσις ay “sangnilikha” o “nilalang/bagay na nilikha.”
  choice: sangnilikha
  alternative: bawat nilalang; lahat ng nilikha
  rationale: Sa Roma 8:19–23, inilalarawan ni Pablo sa malawak at personipikadong paraan ang nilikhang kaayusang naghihintay ng paglaya. Pinananatili ng “sangnilikha” ang kosmikong saklaw nang hindi ito nililimitahan sa mga indibidwal na nilalang.
- issue: Kung ang συνωδίνει ay pangkalahatang pagdurusa lamang o mga sakit ng panganganak.
  choice: mga sakit ng panganganak
  alternative: nagdurusa nang sama-sama
  rationale: Tiyak na tumutukoy ang pandiwa sa mga kirot ng panganganak. Pinananatili ng salin ang larawang maaaring magpahiwatig ng pagdurusang patungo sa pagsilang, nang hindi ginagawang tahasang aral ang pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sangnilikha” dahil malinaw at matatag ang kolektibong kahulugan nito sa konteksto; inulit ang “sama-samang” upang mapanatili ang dalawang συν- prefix ng Griyego at ang retorikal na diin.
