  source_fidelity: Kailangang isaad sa pangunahing teksto ang στοιχείο ng εἰκόνος (“larawan”). Ang “maging kawangis ng kanyang Anak” ay maayos sa diwa ngunit hindi hayagang isinasalin ang “sa larawan ng kanyang Anak.” Ang “sa gitna ng” ay mas tuwirang katumbas ng ἐν kaysa “sa.”
  naturalness: Natural at marangal ang pangungusap matapos ang bahagyang pag-aayos. Ang “mahubog ayon sa larawan” ay malinaw na modernong Tagalog at naipahihiwatig ang pagbabagong nasa συμμόρφους.
  terminology: Napananatili ang “Anak” at “panganay.” Ang “kilala na niya noon pa” ay hindi pumipili sa pagitan ng paunang kaalaman at relasyonal na pagkilala. Ang “magkakapatid” ay likas na Tagalog at ang talababa ay sapat na nagpapaliwanag ng panlalaking anyo ng Griyego.
  issues:
