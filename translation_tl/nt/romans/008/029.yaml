  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: tl
  text: Sapagkat ang mga kilala na niya noon pa ay itinalaga rin niya noon pa upang mahubog ayon sa larawan ng kanyang Anak, upang ang Anak ay maging panganay sa gitna ng maraming magkakapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking pangmaramihan ang anyo ng salitang Griyego, ngunit maaaring kabilang sa tinutukoy ang kapwa lalaki at babae sa pamilya ng Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: mga dati na niyang kilala
  rationale: Likas ito sa modernong Tagalog at pinananatili ang diwa ng naunang pagkilala nang hindi ipinapasiya kung ito ay kaalamang pangkaisipan lamang o pagkilalang may kaugnayan at malasakit.
- source_word: προώρισεν
  choice: itinalaga rin niya noon pa
  rationale: Ipinahahayag nito ang naunang pagtatakda at layunin ng Diyos sa malinaw at dignified na Tagalog, nang hindi umaasa sa isang teknikal na salitang maaaring hindi agad maunawaan.
- source_word: συμμόρφους τῆς εἰκόνος
  choice: maging kawangis
  rationale: Natural na inilalarawan ng “maging kawangis” ang pagkakatulad sa anyo o larawan; iniiwasan nito ang alanganing literal na pariralang “kawangis ng larawan” habang pinananatili ang pagbabagong tungo sa pagkakatulad.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ng kanyang Anak
  rationale: Tuwirang pinananatili ang mahalagang katawagang “Anak” at ang kaugnayan nito sa Diyos.
- source_word: εἰς τὸ εἶναι αὐτὸν
  choice: upang ang Anak ay maging
  rationale: Ipinakikita ng “upang” ang layunin o bunga. Inuulit ang “Anak” sa halip na gumamit ng malabong panghalip upang maging malinaw ang tinutukoy ng αὐτόν.
- source_word: πρωτότοκον
  choice: panganay
  rationale: Ito ang karaniwan at eksaktong katumbas na nagpapanatili sa metapora at sa pahiwatig ng unang katayuan o karangalan.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: sa maraming magkakapatid
  rationale: Ang “magkakapatid” ay natural sa Tagalog para sa mga kabilang sa iisang pamilya at maaaring tumukoy sa kapwa lalaki at babae, gaya ng malamang na saklaw ng konteksto.
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng paliwanag o batayan sa naunang pahayag.
theological_decisions:
- issue: Kung dapat bang ipaliwanag sa salin ang προέγνω bilang simpleng paunang kaalaman o bilang paunang relasyonal na pagkilala/pagpili.
  choice: mga dati na niyang kilala
  alternative: mga alam na niya nang una; mga kinilala na niya noon pa
  rationale: Pinananatili ng salin ang lawak at tensiyong teolohikal ng pandiwang Griyego sa halip na ipasok sa pangunahing teksto ang isang partikular na doktrina ng paghirang.
- issue: Kung ang προώρισεν ay dapat gamitan ng teknikal na terminong maaaring magtakda ng isang denominasyonal na pagbasa.
  choice: itinalaga rin niya noon pa
  alternative: pauna niyang itinakda; predestinasyon niya
  rationale: Malinaw na pinananatili ang naunang pagtatakda ng Diyos, ngunit sa karaniwan at nauunawaang Tagalog.
- issue: Kung dapat gawing eksklusibong panlalaki ang ἀδελφοῖς sa pangunahing teksto.
  choice: maraming magkakapatid
  alternative: maraming kapatid na lalaki
  rationale: Bagaman panlalaki ang anyong gramatikal sa Griyego, ang “magkakapatid” sa Tagalog ang natural na katawagan sa mga miyembro ng pamilya at hindi nagdaragdag ng eksklusibong kasariang hindi tiyak sa konteksto; nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “dati na niyang kilala” at “itinalaga rin niya noon pa” upang mapanatili ang dalawang ideya ng pagkauna nang hindi nagiging arkaiko o labis na teknikal. Ang pag-uulit sa “Anak” ay lumilinaw sa reperente ng panghalip na Griyego.
