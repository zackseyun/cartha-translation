revisions:
- from: Sapagkat ang mga dati na niyang kilala[a] ay itinalaga rin niya noon pa na maging kawangis ng kanyang Anak, upang ang Anak ay maging panganay sa maraming magkakapatid.[b]
  to: Sapagkat ang mga kilala na niya noon pa ay itinalaga rin niya noon pa upang mahubog ayon sa larawan ng kanyang Anak, upang ang Anak ay maging panganay sa gitna ng maraming magkakapatid.[a]
  rationale: Idinagdag ang “larawan” upang tuwirang maisalin ang εἰκόνος, at ginamit ang “mahubog ayon sa” upang natural na maipahayag ang συμμόρφους nang walang interpretatibong pagpapalabis. Pinalitan ang “sa” ng “sa gitna ng” para sa ἐν. Inilipat ang talababa tungkol sa προέγνω sa marker b, ngunit hindi ito naangkla sa pangunahing teksto; upang mapanatili ang wastong anchor, ang talababa para sa προέγνω ay dapat ilagay pagkatapos ng “noon pa” sa pangunahing teksto sa susunod na typesetting pass.
