revisions:
- from: Sapagkat sabik na sabik na hinihintay ng sangnilikha na mahayag ang mga anak na lalaki ng Diyos[a].
  to: Sapagkat buong pananabik na hinihintay ng sangnilikha ang paghahayag ng mga anak ng Diyos[a].
  rationale: Pinalitan ang pangunahing “mga anak na lalaki ng Diyos” ng likas na Tagalog na “mga anak ng Diyos” upang hindi magpahiwatig ng eksklusibong pagkalalaki na wala sa saklaw ng Pauline na gamit. Iningatan sa talababa ang literal na panlalaking anyo at ang posibleng konotasyon nito. Pinakinis din ang pagpapahayag ng matinding paghihintay at ginamit ang “paghahayag” upang mapanatili ang estruktura at diwa ng Griyego.
