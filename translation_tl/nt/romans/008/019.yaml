  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: tl
  text: Sapagkat buong pananabik na hinihintay ng sangnilikha ang paghahayag ng mga anak ng Diyos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak na lalaki ng Diyos.” Panlalaking anyo ang gamit sa Griyego (“mga anak na lalaki”), na maaari ring magbigay-diin sa katayuan bilang anak at tagapagmana.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ἀποκαραδοκία
  choice: sabik na sabik
  rationale: Likas na ipinahahayag sa Tagalog ang matindi at masugid na pananabik na nakapaloob sa pangngalang Griyego.
- source_word: κτίσεως
  choice: sangnilikha
  rationale: Tumutukoy ito sa nilikhang kaayusan bilang isang kabuuan, hindi sa isang indibidwal na nilalang.
- source_word: ἀποκάλυψιν
  choice: na mahayag
  rationale: Malinaw at likas itong nagsasaad ng magiging paglalantad sa mga anak ng Diyos na hindi pa hayag sa kasalukuyan.
- source_word: υἱῶν
  choice: mga anak na lalaki
  rationale: Pinananatili ang panlalaking anyo ng Griyego at ang posibleng diin nito sa katayuan bilang anak at tagapagmana.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang ipinahahayag ang ugnayang nasa pariralang 'mga anak na lalaki ng Diyos.'
- source_word: ἀπεκδέχεται
  choice: hinihintay
  rationale: Ipinahahayag ang patuloy at nakatuon-sa-hinaharap na paghihintay; ang tindi nito ay naipakikita na ng 'sabik na sabik.'
theological_decisions:
- issue: Kung isasalin ang υἱῶν θεοῦ bilang panlahatang “mga anak ng Diyos” o pananatilihin ang panlalaking “mga anak na lalaki ng Diyos.”
  choice: mga anak na lalaki ng Diyos
  alternative: mga anak ng Diyos
  rationale: Panlalaking maramihan ang υἱῶν sa Griyego, at maaari rin itong magpahiwatig ng katayuan at karapatan bilang mga tagapagmana. Inilalagay sa talababa ang mas likas at panlahatang alternatibo upang hindi ikubli ang saklaw ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sangnilikha” para sa kolektibo at kosmikong diwa ng κτίσις, at ang pandiwang sugnay na “na mahayag” upang maging natural ang parirala nang hindi nilulutas ang anumang higit pang tanong tungkol sa paraan ng paghahayag.
