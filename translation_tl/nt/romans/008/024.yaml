  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: tl
  text: Sapagkat sa pag-asa tayo ay naligtas.[a] Ngunit ang pag-asang nakikita ay hindi pag-asa,[b] sapagkat sino ang umaasa sa nakikita niya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa pamamagitan ng pag-asa tayo ay naligtas.”
    reason: alternative_reading
  - marker: b
    text: Ibig sabihin, ang pag-asa ay nakatuon sa hindi pa nakikita.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: Sapagkat sa pag-asa
  rationale: Ang “sa pag-asa” ay nagpapanatili sa datibo bilang saklaw o kalagayan ng kaligtasan, sa halip na gawing malinaw na kasangkapan o sanhi ang pag-asa. Inilalapit ng “sapagkat” ang γάρ sa naunang pangangatwiran.
- source_word: ἐσώθημεν
  choice: tayo ay naligtas
  rationale: Pinananatili ang aorist passive bilang isang naganap na pagliligtas, nang hindi nawawala ang balintunang hindi pa nakikita ang ganap na katuparan nito.
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: Ngunit ang pag-asang nakikita na
  rationale: Ginawang likas na sugnay sa Tagalog ang participle. Ang “na” ay nagpapahayag na kapag naroon na sa paningin ang inaasahan, nagbago na ang kalagayan nito, nang hindi tinutukoy nang labis kung paano ito nakita.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: ay hindi na pag-asa
  rationale: 'Likas sa Tagalog ang “hindi na” sa lohikang ipinahihiwatig: kapag nakikita na, hindi na ito maituturing na pag-asa.'
- source_word: ὃ γὰρ βλέπει
  choice: sa nakikita na niya
  rationale: Ang neuter relative pronoun ay isinalin ayon sa di-tiyak na bagay na nakikita. Ang “niya” ay pangkalahatan at hindi tumutukoy sa isang partikular na kasarian.
- source_word: τίς ἐλπίζει
  choice: sino pa ang umaasa
  rationale: Pinananatili ang retorikal na tanong. Ang “pa” ay natural na nagpapahayag ng punto na hindi na umaasa ang isang tao sa bagay na nakikita na.
theological_decisions:
- issue: Kaugnayan ng kaligtasan at pag-asa sa τῇ ἐλπίδι ἐσώθημεν
  choice: “sa pag-asa tayo ay naligtas”
  alternative: “sa pamamagitan ng pag-asa tayo ay naligtas”
  rationale: Pinananatili ng pangunahing salin ang tensiyong ang kaligtasan ay tunay nang tinanggap ngunit hinihintay pa ang hayag at nakikitang kaganapan nito. Iniiwasan din nitong gawing tiyak na mabisang sanhi ng kaligtasan ang pag-asa, na hindi sapilitang hinihingi ng datibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang “pag-asa,” “naligtas,” at “nakikita” upang maging madaling maunawaan, habang pinananatili ang retorikal na pag-uulit at ang tensiyon sa pagitan ng kasalukuyang kaligtasan at ng katuparang hindi pa nakikita.
