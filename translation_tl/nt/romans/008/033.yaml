  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: tl
  text: Sino ang magsasakdal laban sa mga pinili ng Diyos?[a][b] Ang Diyos ang nagpapawalang-sala.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “mga hinirang ng Diyos.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “Sino ang mag-aakusa sa mga pinili ng Diyos?”'
    reason: lexical_alternative
  - marker: c
    text: 'Ang “nagpapawalang-sala” ay may diwang panghukuman: ang Diyos ang nagpapahayag na matuwid.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Sino
  rationale: Tuwirang panandang pananong na angkop sa retorikal na tanong at natural sa makabagong Tagalog.
- source_word: ἐγκαλέσει
  choice: magsasakdal
  rationale: Pinananatili nito ang legal o panghukuman na diwa ng paghaharap ng paratang, nang maikli at natural.
- source_word: κατὰ
  choice: laban sa
  rationale: Ito ang likas na katumbas sa Tagalog sa konteksto ng pagsasakdal laban sa isang tao.
- source_word: ἐκλεκτῶν θεοῦ
  choice: mga pinili ng Diyos
  rationale: Ipinapahayag ang substantibong pang-uri at genitibong ugnayan nang malinaw, nang hindi umaasa sa teknikal na katawagang teolohikal.
- source_word: θεὸς ὁ δικαιῶν
  choice: Ang Diyos ang nagpapawalang-sala
  rationale: Ang ayos na may dobleng “ang” ay natural na nagbibigay-diin sa Diyos bilang siyang gumagawa nito; ang pandiwa ay naghahatid ng panghukuman na diwa ng paghatol na matuwid o walang sala.
theological_decisions:
- issue: Paglalarawan sa ἐκλεκτῶν nang hindi ipinapasok ang mga sistemang doktrinal na nabuo kalaunan
  choice: mga pinili ng Diyos
  alternative: mga hinirang ng Diyos
  rationale: Malinaw at madaling maunawaan ang “mga pinili,” habang pinananatili ang bigat ng banal na pagpili at hindi nilulutas ang mga tanong na hindi sinasagot ng talata.
- issue: Panghukuman na diwa ng δικαιῶν
  choice: nagpapawalang-sala
  alternative: nagpapahayag na matuwid
  rationale: Sa konteksto ng pagsasakdal, natural na ipinahihiwatig ng “nagpapawalang-sala” ang hatol ng hukom. Nililinaw ng talababa na maaari rin itong ilarawan bilang pagpapahayag na matuwid.
- issue: Posibleng bantas sa maikli at elliptikal na θεὸς ὁ δικαιῶν
  choice: 'Pahayag: “Ang Diyos ang nagpapawalang-sala.”'
  alternative: 'Retorikal na tanong: “Ang Diyos ba, na siyang nagpapawalang-sala?”'
  rationale: Ang pahayag ang pinakanaaangkop sa daloy at diin ng konteksto, ngunit walang bantas ang pinakamaagang tekstong Griyego; kaya kinikilala sa talababa ang tunay na alternatibong pagbantas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang bokabularyong panghukuman na “magsasakdal” at “nagpapawalang-sala” upang mapanatili ang legal na talinghaga ng talata nang hindi nagiging labis na teknikal.
