  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: tl
  text: At kung mga anak tayo, mga tagapagmana rin tayo—mga tagapagmana ng Diyos at mga kapwa tagapagmana ng Mesiyas—kung tunay ngang nagdurusa tayong kasama niya, upang luwalhatiin din tayong kasama niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: mga anak
  rationale: Tumutukoy sa katayuang pampamilya nang hindi nililimitahan sa kasarian; likas at malinaw ito sa modernong Tagalog.
- source_word: κληρονόμοι
  choice: mga tagapagmana
  rationale: Karaniwang salitang legal at pampamilya para sa mga tatanggap ng mana.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang tuwirang genitive at ang siksik na pahayag na 'mga tagapagmana ng Diyos' nang hindi nilulutas ang lahat ng posibleng ugnayang ipinahihiwatig nito.
- source_word: συγκληρονόμοι
  choice: mga kapwa tagapagmana
  rationale: Ipinahahayag ng 'kapwa' ang magkakasamang pakikibahagi sa mana na nasa unlaping συν-.
- source_word: Χριστοῦ
  choice: ni Cristo
  rationale: Likas at pamilyar na anyong Tagalog ng titulong Χριστός sa pariralang ito.
- source_word: εἴπερ
  choice: kung tunay ngang
  rationale: Pinananatili ang tunay na kondisyong may diin at ang umaasang himig ng pahayag.
- source_word: συμπάσχομεν
  choice: nagdurusa tayong kasama niya
  rationale: Hayagang pinananatili ang kasamang pakikibahagi sa pagdurusa na ipinahihiwatig ng συν-, at ang tinutukoy na kasama ay si Cristo ayon sa konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Likas at marangal na panandang Tagalog para sa layunin o ibinungang hantungan.
- source_word: συνδοξασθῶμεν
  choice: maluwalhati rin tayong kasama niya
  rationale: Pinananatili ang pasibong pagtanggap ng kaluwalhatian at ang pakikibahaging kasama ni Cristo.
theological_decisions:
- issue: Kung ang εἴπερ συμπάσχομεν ay kondisyon na ginagawang karapat-dapat ang pagdurusa o inaasahang huwaran ng pakikiisa kay Cristo
  choice: 'Isinalin bilang tunay na kondisyon: ''kung tunay ngang nagdurusa tayong kasama niya,'' nang hindi sinasabing ang pagdurusa ang kumikita sa kaluwalhatian.'
  alternative: Maaaring pahinain bilang 'yamang nagdurusa tayong kasama niya' o ipakahulugang ang pagdurusa ang meritoryong batayan ng kaluwalhatian.
  rationale: May tunay na kondisyong lakas ang εἴπερ, ngunit inilalarawan ng konteksto ang pakikibahagi kay Cristo; kaya pinananatili ang tensiyon nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'ni Cristo' bilang natural na anyo sa Tagalog at pinanatili ang magkatugmang 'kasama niya' sa pagdurusa at pagluluwalhati.
