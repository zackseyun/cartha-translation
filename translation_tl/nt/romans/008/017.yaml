  to: At kung mga anak tayo, mga tagapagmana rin tayo—mga tagapagmana ng Diyos at mga kapwa tagapagmana ng Mesiyas—kung tunay ngang nagdurusa tayong kasama niya, upang luwalhatiin din tayong kasama niya.
  rationale: Pinalitan ang pang-uring "maluwalhati" ng pasibong "luwalhatiin" upang malinaw na maipahayag ang pasibong pandiwa ng Griyego at ang layuning ipinakikilala ng ἵνα. Pinalitan din ang "Cristo" ng "Mesiyas" upang maipakita ang kahulugang titular ng Χριστός. Pinanatili ang kondisyunal na diin, ang pakikibahagi sa pagdurusa, at ang pakikibahagi sa kaluwalhatian nang hindi dinaragdagan ng interpretasyong doktrinal.
