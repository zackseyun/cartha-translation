review_pass:
  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing lohika ng talata: ang pagiging mga anak ay kaugnay ng pagiging mga tagapagmana, ang mana ay may kaugnayan sa Diyos at sa Mesiyas, at ang pakikibahagi sa pagdurusa ay iniuugnay sa kasamang pagluluwalhati. Gayunman, ang "maluwalhati" ay karaniwang pang-uri at hindi sapat na malinaw na isinasalin ang pasibong συνδοξασθῶμεν ("upang tayo rin ay luwalhatiin").'
  naturalness: Likas ang karamihan ng salin. Ang "kung tunay ngang" ay angkop sa εἴπερ, at ang pag-uulit ng "kasama niya" ay malinaw. Mas natural at mas tiyak ang pasibong pandiwang "luwalhatiin" sa huling sugnay.
  terminology: Ang "mga anak," "mga tagapagmana," at "mga kapwa tagapagmana" ay angkop. Para sa Χριστοῦ, ginagamit ang "Mesiyas" upang panatilihin ang aktibong titular na kahulugan ng Χριστός, alinsunod sa English POB audit trail. Walang kailangang talababa sa saling Tagalog na ito.
  issues:
  - severity: medium
    issue: Ang "maluwalhati rin tayong kasama niya" ay hindi malinaw na pasibo.
    rationale: 'Ang συνδοξασθῶμεν ay aorist passive subjunctive: ang mga mananampalataya ay tatanggap ng pagluluwalhati. Ang "maluwalhati" ay maaaring mangahulugang "glorious" at hindi tuwirang "be glorified."'
  - severity: low
    issue: Ang "Cristo" ay pinalitan ng "Mesiyas."
    rationale: Ang Χριστός ay may aktibong kahulugang titulo rito. Ang "Mesiyas" ay pinananatili ang kahulugang ito at tumutugma sa lexical policy ng English POB audit trail.
  revised_text: At kung mga anak tayo, mga tagapagmana rin tayo—mga tagapagmana ng Diyos at mga kapwa tagapagmana ng Mesiyas—kung tunay ngang nagdurusa tayong kasama niya, upang luwalhatiin din tayong kasama niya.
