id: ROM.8.21
reference: Romans 8:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: tl
  text: Sapagkat ang sangnilikha mismo ay palalayain din mula sa pagkaalipin sa pagkabulok tungo sa maluwalhating kalayaan ng mga anak ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “tungo sa kalayaan ng kaluwalhatian ng mga anak ng Diyos.”
    reason: Pinananatili ang mas pormal na ayos ng magkakasunod na genitive sa Griyego at ang kalabuan ng ugnayan ng “kalayaan,” “kaluwalhatian,” at “mga anak ng Diyos.”
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: 'Ginamit nang panhiwatig na sanhi: ipinaliliwanag nito ang batayan ng pag-asang binanggit sa naunang talata.'
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: ang sangnilikha mismo ... din
  rationale: 'Ang “mismo” ay nagpapanatili sa diin ng αὐτή, at ang “din” ay naghahatid sa pandagdag na diwa ng καί: makikibahagi rin ang buong sangnilikha sa paglaya.'
- source_word: ἐλευθερωθήσεται
  choice: ay palalayain
  rationale: Pinananatili ng anyong panghinaharap na balintiyak ang diwang may magpapalaya sa sangnilikha sa hinaharap, nang hindi tahasang idinaragdag kung sino ang kikilos.
- source_word: ἀπὸ τῆς δουλείας
  choice: mula sa pagkaalipin
  rationale: Ang “pagkaalipin” ay nagpapanatili sa matinding talinghaga ng δουλεία bilang kalagayan ng pagiging alipin.
- source_word: τῆς φθορᾶς
  choice: sa pagkabulok
  rationale: Sa konteksto ng sangnilikha, tumutukoy ang φθορά sa pagkasira, pagkabulok, at pagiging nasisira, hindi pangunahin sa moral na katiwalian.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: tungo sa ... kalayaan
  rationale: Ipinakikita ng “tungo sa” ang paglipat mula sa isang kalagayan patungo sa panibagong kalagayan, alinsunod sa εἰς.
- source_word: τῆς δόξης
  choice: maluwalhating
  rationale: Likas sa modernong Tagalog ang pang-uring anyo at ipinahihiwatig nitong ang kalayaan ay kaugnay at puspos ng kaluwalhatian. Inilalagay sa talababa ang mas pormal na ayos ng mga genitive upang mapanatili ang tunay na kalabuan.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: ng mga anak ng Diyos
  rationale: Ang τέκνα ay inklusibong “mga anak,” at ang pariralang “mga anak ng Diyos” ay malinaw at pamilyar nang hindi nililimitahan sa mga lalaki.
theological_decisions:
- issue: Kahulugan at ayos ng genitive chain na τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: sa maluwalhating kalayaan ng mga anak ng Diyos
  alternative: sa kalayaan ng kaluwalhatian ng mga anak ng Diyos
  rationale: Mas malinaw at natural sa Tagalog ang pangunahing salin, ngunit hindi nito dapat tuluyang ipasiya kung ang “kaluwalhatian” ay naglalarawan sa kalayaan o tumutukoy sa kaluwalhatiang taglay ng mga anak ng Diyos. Kaya pinanatili sa talababa ang mas literal at sadyang mas bukas na pagkakaugnay ng mga salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “sangnilikha” bilang maikli at pamilyar na katawagan sa buong nilalang na kaayusan; pinanatili ang matinding larawang “pagkaalipin” at ang balintiyak na “palalayain.”
