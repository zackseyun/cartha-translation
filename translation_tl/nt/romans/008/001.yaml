translation:
  language: tl
  text: Kaya nga, ngayon ay wala nang hatol na parusa para sa mga na kay Mesiyas[b] Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idinaragdag sa ilang mas huling manuskrito: “na hindi namumuhay ayon sa laman.” Sinusuportahan ng pinakamaagang mga saksing Griyego ang mas maikling teksto rito.'
    reason: textual_variant
  - marker: b
    text: 'O: “Cristo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: wala nang
  rationale: Likas na ipinapahayag sa Filipino ang ganap na pagtanggi kapag kasama ng pariralang “hatol na kaparusahan”; kaugnay ng νῦν, ipinahihiwatig din nito na wala na ang gayong hatol sa kasalukuyang kalagayan.
- source_word: ἄρα
  choice: Kaya nga
  rationale: Malinaw nitong ipinakikita na ang pahayag ay kongklusyon mula sa naunang pangangatwiran ni Pablo.
- source_word: νῦν
  choice: ngayon
  rationale: Tahasang pinananatili ang diin ng Griyego sa kasalukuyang katotohanan.
- source_word: κατάκριμα
  choice: hatol na kaparusahan
  rationale: Ipinahahayag nito ang masamang pasyang panghukuman at hindi lamang ang pansariling damdamin ng pagkakasala.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: para sa mga na kay Mesiyas Jesus
  rationale: Ginagawang likas sa Filipino ang datibo sa pamamagitan ng “para sa,” habang pinananatili ng “na kay” ang mayamang wika ni Pablo tungkol sa kaugnayan at pakikibahagi sa Mesiyas nang hindi ito nililimitahan sa isang paliwanag.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Isinasalin ang titulong Χριστός ayon sa kahulugan nito sa halip na ituring itong karaniwang apelyido.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Karaniwang anyo sa Filipino ng pangalang Ἰησοῦς.
theological_decisions:
- issue: Kahulugan ng pariralang “ἐν Χριστῷ Ἰησοῦ”
  choice: “na kay Mesiyas Jesus,” na tumutukoy sa mga kabilang at may pakikibahagi sa kanya
  alternative: “dahil kay Mesiyas Jesus” o “nakipag-isa kay Mesiyas Jesus”
  rationale: Pinananatili ng “na kay” ang lawak at tensiyong teolohikal ng ἐν sa gamit ni Pablo, sa halip na gawing sanhi lamang ito o tahasang ipakahulugan bilang isang partikular na uri ng pakikiisa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hatol na kaparusahan” upang maging malinaw ang larawang panghukuman, at pinanatili ang “na kay” upang hindi paliitin ang kahulugan ng pakikibahagi kay Mesiyas Jesus.
