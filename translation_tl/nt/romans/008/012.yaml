  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: tl
  text: Kaya nga, mga kapatid[a], may obligasyon tayo—hindi sa laman[b], upang mamuhay ayon sa laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong salita ay literal na “mga kapatid na lalaki,” ngunit ginagamit dito bilang tawag sa buong pamayanang sumasampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “laman” ay hindi lamang tumutukoy sa pisikal na katawan kundi sa pagkataong tao sa kalagayang salungat sa Espiritu. Maaari rin itong isaling “makasalanang kalikasan,” bagaman interpretibong salin iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Kaya nga
  rationale: Likas na ipinapahayag sa modernong Tagalog ang kongklusyon at paglipat mula sa naunang pangangatwiran.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural at marangal na katawagan sa buong pamayanang sumasampalataya; hindi nito kailangang tukuyin lamang ang mga lalaki.
- source_word: ὀφειλέται ἐσμέν
  choice: may pananagutan tayo
  rationale: Bagaman literal na tumutukoy sa pagiging may utang, dito ay moral na obligasyon ang diwa; malinaw itong naihahatid ng “may pananagutan” nang hindi ipinapalagay na pinansiyal ang utang.
- source_word: τῇ σαρκί / κατὰ σάρκα
  choice: sa laman / ayon sa laman
  rationale: Pinananatili ang paulit-ulit at teolohikal na mahalagang katawagang “laman,” pati ang pagkakaiba ng pinagkakautangan at pamantayan ng pamumuhay.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: para mamuhay ayon sa laman
  rationale: 'Natural sa Tagalog at pinananatili ang ugnayan ng infinitibo sa obligasyong itinatanggi: hindi tayo may pananagutan sa laman upang mamuhay ayon dito.'
theological_decisions:
- issue: Kung bibigyang-kahulugang tuwiran ang σάρξ sa pagtutunggali ng laman at Espiritu
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Pinananatili ng “laman” ang sariling bokabularyo ni Pablo at ang lawak at tensiyon ng metapora, sa halip na ikulong agad ito sa isang interpretasyon.
- issue: Kung ang ἀδελφοί ay tumutukoy lamang sa mga lalaking mananampalataya
  choice: mga kapatid, na tumutukoy sa pamayanang sumasampalataya
  alternative: mga kapatid na lalaki
  rationale: Masculine plural ang anyong Griyego, ngunit karaniwan itong katawagan sa kabuuang komunidad; likas na naipapahayag ng Tagalog na “mga kapatid” ang inklusibong gamit nang hindi binabago ang anyo tungo sa tahasang dobleng katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinili ang “may pananagutan” bilang natural na pahayag ng moral na obligasyon, habang pinanatili ang “laman” upang hindi alisin ang ambiguwidad at teolohikal na bigat ng σάρξ.
