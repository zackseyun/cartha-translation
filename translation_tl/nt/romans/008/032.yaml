  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: tl
  text: Siya ngang hindi nagkait ng sarili niyang Anak, kundi ipinaubaya niya siya[a] para sa ating lahat[b]—paanong hindi rin niya, kasama ng Anak, malugod na ipagkakaloob sa atin ang lahat ng bagay?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinigay siya upang mapasakamay ng iba.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “alang-alang sa ating lahat.”
    reason: alternative_reading
  - marker: c
    text: O “malayang ipagkakaloob sa atin ang lahat ng bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Siya ngang
  rationale: Tumutukoy ito sa Diyos sa naunang konteksto, at pinananatili ng “nga” ang diin ng γε sa natural na Tagalog.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: sarili niyang Anak
  rationale: Ipinahahayag ng ἴδιος ang mariing personal na kaugnayan at pag-aari; malinaw at natural ang parirala sa Tagalog.
- source_word: οὐκ ἐφείσατο
  choice: hindi nagkait
  rationale: Ang “nagkait” ay natural na katumbas ng hindi pag-iwas na ibigay ang Anak at pinananatili ang bigat ng pahayag.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: para sa ating lahat
  rationale: Natural itong benefaktibong pahayag sa Tagalog at hindi nito labis na nililinaw ang eksaktong paraan ng pagkilos na ipinahihiwatig ng ὑπέρ.
- source_word: παρέδωκεν αὐτόν
  choice: ibinigay siya
  rationale: Malinaw sa karaniwang mambabasa, ngunit inilalagay sa talababa ang mas tahasang “ipinaubaya siya” upang maipakita ang diwa ng paghaharap sa pagdurusa o kamatayan.
- source_word: πῶς οὐχὶ καὶ
  choice: paanong hindi rin niya
  rationale: Pinananatili ang retorikal na tanong at ang pangangatwirang mula sa mas dakilang kaloob tungo sa iba pang mga kaloob.
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Tuwirang pinananatili ang σύν nang hindi ipinapaliwanag kung sa anong eksaktong paraan kasama ng Anak ang mga kaloob.
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Pinananatili ang malawak na saklaw ng Griyego sa halip na paliitin ito ayon sa isang tiyak na interpretasyon.
- source_word: χαρίσεται
  choice: ipagkakaloob nang may kagandahang-loob
  rationale: Ipinakikita nito ang malaya at mapagbiyayang pagbibigay na taglay ng χαρίζομαι, habang nananatiling dignified at mauunawaan.
theological_decisions:
- issue: Kung ang ὑπὲρ ἡμῶν πάντων ay dapat gawing tahasang pamalit na pormula tungkol sa pagbabayad-sala
  choice: para sa ating lahat
  alternative: alang-alang sa ating lahat
  rationale: Malinaw ang pagkilos para sa kapakinabangan ng lahat ng tinutukoy, ngunit hindi ginagawang mas teknikal ang parirala kaysa sa Griyego.
- issue: Kung ang τὰ πάντα ay dapat limitahan sa mga espirituwal na pagpapala
  choice: ang lahat ng bagay
  alternative: lahat ng kailangan natin
  rationale: Malawak ang mismong pahayag ni Pablo; dapat manggaling sa konteksto ang anumang limitasyon at hindi ipasok sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Siya ngang” upang panatilihin ang diin, at iniwasan ang makalumang balangkas. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
