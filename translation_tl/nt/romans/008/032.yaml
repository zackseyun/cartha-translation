  to: Siya ngang hindi nagkait ng sarili niyang Anak, kundi ipinaubaya niya siya[a] para sa ating lahat[b]—paanong hindi rin niya, kasama ng Anak, malugod na ipagkakaloob sa atin ang lahat ng bagay?[c]
