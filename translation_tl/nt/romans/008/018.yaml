id: ROM.8.18
reference: Romans 8:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: tl
  text: Sapagkat itinuturing kong ang mga pagdurusa sa kasalukuyang panahon ay hindi maitutumbas sa darating na kaluwalhatiang ihahayag sa atin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob natin.”
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: itinuturing kong
  rationale: Ipinapahayag nito ang isang pinag-isipang pagtataya o pasya, hindi lamang damdamin.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayang kaugnayan nito sa naunang pahayag.
- source_word: οὐκ ἄξια ... πρὸς
  choice: hindi maihahambing sa
  rationale: Natural na Filipino para sa napakalaking kawalan ng pagkakapantay sa paghahambing; hindi nito ipinahihiwatig na bawal silang paghambingin.
- source_word: τὰ παθήματα
  choice: ang mga pagdurusa
  rationale: Tumutukoy sa mga pagdurusang nararanasan at angkop sa kontekstong Paulino.
- source_word: τοῦ νῦν καιροῦ
  choice: sa kasalukuyang panahon
  rationale: Tapat sa kahulugan ng kasalukuyang oras o yugto nang hindi kinakailangang idagdag ang konsepto ng isang 'kapanahunan' o age.
- source_word: τὴν μέλλουσαν δόξαν
  choice: darating na kaluwalhatian
  rationale: Pinananatili ang hiwalay at malinaw na pahiwatig ng μέλλουσαν na ang kaluwalhatian ay nasa hinaharap.
- source_word: ἀποκαλυφθῆναι
  choice: ihahayag
  rationale: Natural na salin ng pasibong diwa ng pagbubunyag; sa Filipino, ang anyong pokus sa layon ay nagpapakitang ang kaluwalhatian ang ihahayag.
- source_word: εἰς ἡμᾶς
  choice: sa atin
  rationale: Pinakamalapit na likas na salin para sa paghahayag na nakatuon sa mga mananampalataya, habang inilalagay sa talababa ang posibleng diwang 'sa loob natin.'
theological_decisions:
- issue: Kahulugan ng εἰς ἡμᾶς kaugnay ng paghahayag ng kaluwalhatian
  choice: sa atin
  alternative: sa loob natin
  rationale: Maaaring tumukoy ang parirala sa kaluwalhatiang ihahayag sa atin o mahahayag sa loob natin. Pinili sa teksto ang mas natural na 'sa atin,' ngunit pinanatili sa talababa ang mahalagang alternatibong may diwang pakikibahagi.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “hindi maihahambing” bilang likas na paraan ng pagpapahayag ng matinding di-pagkakapantay, at pinanatili ang ambiguwidad ng εἰς ἡμᾶς sa talababa.
