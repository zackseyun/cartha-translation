id: ROM.8.31
reference: Romans 8:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: tl
  text: Kaya ano ang masasabi natin tungkol sa mga bagay na ito?[a] Kung ang Diyos ay panig sa atin,[b] sino ang laban sa atin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ano ang masasabi natin sa harap ng mga bagay na ito?”
    reason: lexical_alternative
  - marker: b
    text: O “Yamang ang Diyos ay panig sa atin, sino ang laban sa atin?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Kaya ano ang masasabi natin
  rationale: Ipinahahayag ng “kaya” ang paghinuha o paglipat mula sa naunang pangangatwiran, at natural na naihahatid ng “ano ang masasabi natin” ang deliberatibo at retorikal na gamit ng panghinaharap na ἐροῦμεν.
- source_word: πρὸς ταῦτα
  choice: tungkol sa mga bagay na ito
  rationale: Sa konteksto, tumutukoy ito sa pagsasalita hinggil sa mga katotohanang kalilipas lamang talakayin. Mas natural ito sa modernong Tagalog kaysa sa literal na “sa mga bagay na ito,” habang ang literal na anyo ay inilagay bilang alternatibo sa talababa.
- source_word: εἰ
  choice: Kung
  rationale: Pinananatili nito ang tahasang kondisyunal na anyo ng Griyego at ang retorikal na bisa ng tanong, nang hindi ipinahihiwatig na nag-aalinlangan si Pablo.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Tuwirang katumbas ng simuno sa Griyego at likas na anyo sa Tagalog.
- source_word: ὑπὲρ ἡμῶν
  choice: panig sa atin
  rationale: Ipinahahayag ng ὑπέρ dito ang paborableng pagkiling o pagtindig para sa isang panig. Ang “panig sa atin” ay maikli, malinaw, at natural sa Tagalog.
- source_word: τίς καθ’ ἡμῶν
  choice: sino ang laban sa atin
  rationale: Pinananatili ang maigsi at matagumpay na retorikal na hamon ng Griyego; ang κατά na may genitive ay nagsasaad ng pagsalungat.
theological_decisions:
- issue: Kondisyunal na bisa ng εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Kung ang Diyos ay panig sa atin
  alternative: Yamang ang Diyos ay panig sa atin
  rationale: Ginagamit ng Griyego ang εἰ (“kung”), kaya pinananatili ito sa pangunahing teksto. Gayunman, dahil ipinapalagay ng konteksto na totoo ang kondisyon, ibinibigay sa talababa ang “yamang” bilang lehitimong paglilinaw sa retorikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit karaniwang pananalita. Pinanatili ang maikli at matinding retorikal na daloy ng talata, at iniwasan ang mga salitang labis na teknikal o makaluma.
