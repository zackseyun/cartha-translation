id: ROM.8.11
reference: Romans 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: tl
  text: At kung nananahan sa inyo ang Espiritu ng bumuhay kay Jesus mula sa mga patay, ang bumuhay kay Cristo Jesus mula sa mga patay ay magbibigay-buhay rin sa inyong mga katawang may kamatayan dahil sa kanyang Espiritung nananahan sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sa pamamagitan ng kanyang Espiritung nananahan sa inyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Malinaw sa daloy ng pangangatwiran ni Pablo na ang tinutukoy ay ang Espiritu ng Diyos; ang malaking titik ay umiiwas sa pagkaunawang espiritu lamang ng tao o isang impersonal na puwersa.
- source_word: ἐγείραντος / ἐγείρας
  choice: bumuhay
  rationale: Sa konteksto ng muling pagkabuhay, likas sa makabagong Tagalog ang “bumuhay ... mula sa mga patay” at malinaw nitong ipinahahayag ang aktuwal na pagbabalik sa buhay.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Direkta at karaniwang katumbas ito na nagpapanatili sa larawan ng pagbangon mula sa kalagayan o kalipunan ng mga patay.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: nananahan
  rationale: Pinananatili nito ang leksikal na ugnayan ng dalawang anyo at ang diwa ng patuloy na paninirahan ng Espiritu sa mga mananampalataya.
- source_word: Χριστὸν Ἰησοῦν
  choice: Cristo Jesus
  rationale: Ang “Cristo” ay nakaugat na katawagang Tagalog para sa Χριστός at nananatiling titulo rito, hindi apelyido lamang.
- source_word: ζῳοποιήσει
  choice: magbibigay-buhay
  rationale: Pinananatili ang hinaharap na kilos at ang tahasang diwa ng pagkakaloob ng buhay.
- source_word: θνητὰ σώματα
  choice: mga katawang may kamatayan
  rationale: Malinaw nitong ipinahahayag na ang mga katawan ay saklaw ng kamatayan habang iniiwasan ang mas teknikal o di-gaanong pangkaraniwang “mortal.”
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: dahil sa kanyang Espiritung nananahan sa inyo
  rationale: Ang διά na may accusative sa nakalimbag na SBLGNT ay pinakanatural na sanhi ang kahulugan; kaya “dahil sa” ang nasa pangunahing teksto, habang itinatala ang instrumental na posibilidad.
theological_decisions:
- issue: Ang puwersa ng διὰ na may accusative sa huling sugnay
  choice: dahil sa kanyang Espiritung nananahan sa inyo
  alternative: sa pamamagitan ng kanyang Espiritung nananahan sa inyo
  rationale: Sinusunod ng pangunahing teksto ang pinakadirektang sanhi na kahulugan ng anyong Griyego sa SBLGNT, ngunit hindi ikinukubli ang tradisyonal na instrumental na pagbasa.
- issue: Ang kahulugan ng pagbibigay-buhay sa “mga katawang may kamatayan”
  choice: Panatilihin ang kongkreto at panghinaharap na pahayag nang walang dagdag na paliwanag
  alternative: Tukuying tahasan sa salin kung ito ay muling pagkabuhay sa hinaharap o kasalukuyang espirituwal na pagpapasigla
  rationale: Ang talata mismo ay nagsasaad ng pagbibigay-buhay sa katawan ngunit hindi nararapat dagdagan ng paliwanag na lulutas sa lahat ng interpretatibong tanong.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nananahan” upang mapanatili ang teolohikal na bigat at pag-uugnay ng dalawang pandiwang Griyego; ginamit ang “mga katawang may kamatayan” bilang madaling maunawaang katumbas ng θνητὰ σώματα.
