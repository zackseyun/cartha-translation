id: ROM.8.39
reference: Romans 8:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: tl
  text: Ni kataasan, ni kalaliman, ni anumang iba pang nilalang[a] ang makapaghihiwalay sa atin sa pag-ibig ng Diyos na nasa Mesiyas na si Jesus, na ating Panginoon.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang iba pa sa sangnilikha” o “anumang iba pang bagay na nilikha.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Mesiyas na si Jesus” ay nakaugaliang isalin na “Cristo Jesus.”
    reason: lexical_alternative
  - marker: c
    text: Ang “pag-ibig ng Diyos” dito ay malamang na nangangahulugang pag-ibig ng Diyos sa atin.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: kataasan
  rationale: Sa pagtambal nito sa βάθος, likas ang kahulugang tumutukoy sa magkasalungat na sukdulang dimensiyon; pinananatili ng “kataasan” ang retorikal na pares.
- source_word: βάθος
  choice: kalaliman
  rationale: Tuwirang katapat ito ng ὕψωμα at natural na nagpapahayag ng sukdulang lalim.
- source_word: κτίσις ἑτέρα
  choice: anumang iba pang nilalang
  rationale: Maaaring mangahulugan ang κτίσις ng nilikha o sangnilikha. Dito, ang “nilalang” ay natural sa Filipino at malinaw na tumutukoy sa anumang bahagi ng kaayusang nilikha; tinutumbasan ng “iba pang” ang ἑτέρα at ng “anumang” ang τις.
- source_word: δυνήσεται
  choice: ay makapaghihiwalay
  rationale: Ipinahihiwatig ng anyong “makapag-” ang kakayahan, samantalang ang pangungusap sa konteksto ay may hinaharap na katiyakan.
- source_word: χωρίσαι
  choice: maghihiwalay
  rationale: Ang “maghiwalay” ang malinaw at karaniwang katumbas sa konteksto ng pagputol ng kaugnayan.
- source_word: ἀγάπης
  choice: pag-ibig
  rationale: Ito ang natural, dignificado, at karaniwang katumbas ng ἀγάπη sa modernong Filipino.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Pinananatili ang anyong henitibo ng Griyego at ang tunay na pormal na posibilidad nito, bagaman malakas na itinuturo ng konteksto ang pag-ibig ng Diyos sa atin.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: na nasa Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” at ipinahahayag ang ἐν sa natural na Filipino bilang “nasa.”
- source_word: κυρίῳ
  choice: Panginoon
  rationale: Ito ang nakaugaliang, malinaw, at angkop na katumbas ng κύριος sa gamit na Kristolohikal ni Pablo.
theological_decisions:
- issue: Kahulugan ng henitibo sa “pag-ibig ng Diyos”
  choice: Pinanatili sa pangunahing teksto ang “pag-ibig ng Diyos”; ipinaliliwanag sa talababa na malamang na tumutukoy ito sa pag-ibig ng Diyos sa atin.
  alternative: Ang pag-ibig natin sa Diyos, o isang sadyang malawak na pariralang maaaring sumaklaw sa dalawang diwa.
  rationale: Nakatuon ang Roma 8:31–39 sa pagkilos at katapatan ng Diyos para sa kanyang bayan, kaya mas malamang ang pag-ibig ng Diyos sa mga mananampalataya. Gayunman, hindi tahasang nilulutas ng anyong henitibo lamang ang tanong, kaya hindi ito pinalitan ng mas interpretatibong parirala sa pangunahing teksto.
- issue: Pagpapakahulugan sa ἐν Χριστῷ Ἰησοῦ
  choice: “na nasa Mesiyas na si Jesus” bilang paglalarawan sa pag-ibig ng Diyos
  alternative: “sa pamamagitan ng Mesiyas na si Jesus” o “na nahahayag sa Mesiyas na si Jesus”
  rationale: Pinananatili ng “nasa” ang malawak na puwersa ng ἐν at iniiwasang paliitin ito sa paraan o paghahayag lamang.
translation_notes:
  register: Modernong Filipino na may dignificado at pampublikong-basa na himig. Ginamit ang “ni… ni…” upang mapanatili ang sunod-sunod na pagtanggi ng οὔτε, at “Mesiyas” bilang salin ng titulong Χριστός. Lahat ng marker ng talababa ay nasa pangunahing teksto.
