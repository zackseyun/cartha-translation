id: ROM.8.6
reference: Romans 8:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: tl
  text: Sapagkat ang pag-iisip na ayon sa laman[a] ay kamatayan, ngunit ang pag-iisip na ayon sa Espiritu[b] ay buhay at kapayapaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makasalanang kalikasan.”
    reason: lexical_alternative
  - marker: b
    text: O “espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan sa naunang pangungusap at likas itong pakinggan sa marangal na makabagong Tagalog.
- source_word: φρόνημα
  choice: pag-iisip na nakatuon sa
  rationale: Ipinahahayag nito hindi lamang ang gawa ng isip kundi ang namamayaning oryentasyon o disposisyon; mas malinaw ito sa karaniwang mambabasa kaysa sa payak na “isip.”
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang mahalagang termino at tunay na teolohikal na tensiyon sa sulat ni Pablo sa halip na agad itong ipakahulugang “makasalanang like.”
- source_word: θάνατος
  choice: kamatayan
  rationale: Tuwiran at karaniwang katumbas na nagpapanatili sa maigting na pagsalungat sa “buhay.”
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Sa konteksto ng Roma 8, malamang na tumutukoy ito sa Espiritu ng Diyos; ang malaking titik ay nagpapakita ng pasyang ito habang inilalagay sa talababa ang ibang posibilidad.
- source_word: ζωή
  choice: buhay
  rationale: Tuwirang salin na nagpapanatili sa maikli at matinding paghahambing sa kamatayan.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Likas at malawak na katumbas na kaagapay ng “buhay.”
theological_decisions:
- issue: Kung ang πνεῦμα ay tumutukoy sa Banal na Espiritu o sa espiritu ng tao
  choice: Espiritu, bilang pagtukoy sa Espiritu ng Diyos
  alternative: espiritu ng tao, o espiritu sa mas pangkalahatang diwa
  rationale: Paulit-ulit na inilalarawan sa agarang konteksto ng Roma 8 ang Espiritu bilang banal na tagapagbigay ng buhay, ngunit pinananatili sa talababa ang leksikal na posibilidad ng “espiritu.”
- issue: Kung ang σάρξ ay dapat isalin nang literal o ipakahulugan bilang makasalanang kalikasan
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Ang “laman” ang mas malapit sa anyo ng Griyego at nagpapanatili sa saklaw at tensiyon ng terminolohiya ni Pablo; ang mas interpretatibong alternatibo ay inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatulad na pariralang “pag-iisip na nakatuon sa” upang maipakita ang balanseng estruktura ng dalawang sugnay. Inilagay agad ang bawat marker pagkatapos ng salitang tinutukoy nito.
