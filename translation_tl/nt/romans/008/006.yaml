  source_fidelity: Ang “pag-iisip na nakatuon sa” ay nauunawaan, ngunit mas malayang ipinapakahulugan nito ang genitive na τῆς σαρκὸς / τοῦ πνεύματος bilang layon ng pagtuon. Ang “pag-iisip na ayon sa” ay mas malapit sa diwa ng φρόνημα bilang oryentasyon o disposisyong hinuhubog ng laman o ng Espiritu, habang pinananatili ang balanseng estruktura ng Griyego.
  naturalness: Likas, malinaw, at marangal sa makabagong Filipino ang “pag-iisip na ayon sa laman/Espiritu.” Mas maigsi rin ito at mas mahusay na pinananatili ang matalinghagang puwersa ng magkabilang sugnay.
