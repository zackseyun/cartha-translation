translation:
  language: tl
  text: Ngunit ang mga nasa laman ay hindi makapagbigay-lugod sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Ang mga nasa ilalim ng kapangyarihan ng makasalanang kalikasan.” Sa Griyego, “nasa laman,” isang mahalagang terminong ginagamit ni Pablo sa kontekstong ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ang mga namumuhay
  rationale: Ang artikulo at participle ay tumutukoy sa isang pangkat na nasa isang nagpapatuloy na kalagayan. Ang “mga namumuhay” ay natural sa Filipino at angkop sa konteksto, bagaman mas literal ang “mga nasa.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang pag-uugnay at pagsalungat sa naunang pahayag; malinaw at natural itong naipapakita ng “Ngunit.”
- source_word: ἐν σαρκὶ
  choice: ayon sa laman
  rationale: Pinananatili ang mahalagang terminong Paulino na “laman” at ang kaugnayan nito sa buong talata. Ginamit ang idyomatikong “ayon sa laman” upang ipahayag ang kalagayan o saklaw ng pamumuhay nang hindi tahasang nilulutas ang kahulugan bilang “makasalanang kalikasan.”
- source_word: ἀρέσαι
  choice: makapagbibigay-lugod
  rationale: Kasama ng δύνανται, ipinapahayag ng infinitive ang kakayahang magbigay-lugod. Ang pariralang ito ay malinaw, natural, at marangal sa modernong Filipino.
- source_word: θεῷ
  choice: sa Diyos
  rationale: Ang datibong θεῷ ay natural na ipinahahayag sa Filipino sa pamamagitan ng “sa Diyos” kasunod ng “magbigay-lugod.”
- source_word: οὐ δύνανται
  choice: hindi makapagbibigay-lugod
  rationale: Ang unlaping “makapag-” kasama ng “hindi” ay tuwirang nagpapahayag ng kawalan ng kakayahan, hindi lamang ng hindi aktuwal na paggawa.
theological_decisions:
- issue: Pagpapakahulugan sa σάρξ sa teolohikal na konteksto ni Pablo
  choice: ayon sa laman
  alternative: nasa ilalim ng makasalanang kalikasan
  rationale: Pinananatili sa pangunahing teksto ang “laman,” isang susing termino ni Pablo, upang hindi agad ipakahulugan ito bilang pisikal na katawan lamang o bilang isang ganap nang ipinaliwanag na “makasalanang kalikasan.” Inilalagay sa talababa ang mas interpretatibong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “magbigay-lugod sa Diyos” kaysa sa mas kolokyal na “pasayahin ang Diyos,” at pinanatili ang “laman” upang maingatan ang leksikal at teolohikal na ugnayan sa Roma 8.
