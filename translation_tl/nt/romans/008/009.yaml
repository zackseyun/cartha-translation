  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: tl
  text: Ngunit kayo ay wala sa laman[a] kundi nasa Espiritu, kung talagang nananahan sa inyo ang Espiritu ng Diyos. Ngunit kung ang sinuman ay walang Espiritu ng Mesiyas,[b] hindi siya kabilang sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “laman” ay hindi lamang tumutukoy sa pisikal na katawan; maaari itong tumukoy sa kalagayan ng taong hiwalay sa pamamahala ng Espiritu.
    reason: lexical_alternative
  - marker: b
    text: Ang “Mesiyas” ay salin ng salitang Griego na maaari ring tumbasan ng “Cristo.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa literal: “hindi siya kanya.” Ang “kanya” ay malamang na tumutukoy sa Mesiyas, ngunit maaari rin itong maiugnay sa Diyos sa mas malawak na konteksto.'
    reason: ambiguity
lexical_decisions:
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang pangunahing terminong teolohikal ni Pablo at ang kaibahan ng kalagayan o saklaw ng pamumuhay, sa halip na paliitin ito sa interpretasyong “makasalanang likas.”
- source_word: πνεῦμα
  choice: Espiritu
  rationale: Malaking titik ang ginamit sapagkat tuwirang tinutukoy sa konteksto ang Espiritu ng Diyos at Espiritu ng Mesiyas.
- source_word: οἰκεῖ
  choice: nananahan
  rationale: Ipinahihiwatig nito ang patuloy at matatag na presensya sa loob, at likas pa rin sa marangal na modernong Tagalog.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Isinalin bilang titulo upang ihayag ang kahulugan ng Χριστός at mapanatili ang gamit nitong “Espiritu ng Mesiyas.”
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: hindi siya kabilang sa Mesiyas
  rationale: Natural na Tagalog para sa idyomang literal na “hindi siya kanya”; tinukoy sa teksto ang pinakamalapit na antecedent ngunit nilagyan ng talababa ang literal na anyo at posibleng sanggunian ng panghalip.
- source_word: εἴπερ
  choice: kung talagang
  rationale: Pinananatili ang kondisyunal na anyo at ang himig na ipinapalagay na totoo ang kalagayan ng mga kausap.
- source_word: Ὑμεῖς
  choice: kayo
  rationale: Pinananatili ang tahasan at mariing pangmaramihang panghalip, na ikinokontra ng δέ sa naunang tinutukoy.
- source_word: οὗτος
  choice: siya
  rationale: Natural na panghalip sa Tagalog na hindi kailangang magtakda ng kasarian, samantalang napapanatili ang isahang pantukoy sa sinumang tao.
theological_decisions:
- issue: Ang kaibahan ng “nasa laman” at “nasa Espiritu”
  choice: Pinanatili ang “laman” at “Espiritu” bilang mga kategorya ni Pablo tungkol sa kalagayan o saklaw ng pag-iral.
  alternative: “Nasa makasalanang likas” o “namumuhay ayon sa makasalanang pagkatao.”
  rationale: Hindi nilulutas sa paraphrase ang lawak at tensiyong teolohikal ng σάρξ; ipinapaliwanag lamang sa talababa ang posibleng kahulugan nito rito.
- issue: Ang tinutukoy ng αὐτοῦ sa hulíng sugnay
  choice: Isinaad sa pangunahing teksto ang Mesiyas, ang pinakamalapit na antecedent, para sa malinaw at natural na Tagalog.
  alternative: Panatilihing “hindi siya kanya,” na maaaring tumukoy sa Mesiyas o, ayon sa mas malawak na konteksto, sa Diyos.
  rationale: Pinipili ng pangunahing salin ang pinakamalapit na sangguniang gramatikal ngunit inilalantad sa talababa ang literal na panghalip at ang natitirang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nasa Espiritu” upang mapanatili ang paralelismo at metapora ng saklaw o kalagayan; ginamit ang “nananahan” bilang pamilyar na salitang biblikal na hindi lipas.
