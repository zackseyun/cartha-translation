id: ROM.8.3
reference: Romans 8:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: tl
  text: 'Sapagkat ang hindi magawa ng kautusan[a]—yamang mahina ito dahil sa laman—ay ginawa ng Diyos: isinugo niya ang sarili niyang Anak sa wangis ng makasalanang laman[d] at para sa kasalanan[c]; sa laman ay hinatulan niya ang kasalanan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang kawalan ng kakayahan ng kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “laman” dito ay malamang na tumutukoy sa laman ng tao sa mahina at makasalanang kalagayan nito; sa ilang konteksto ay mas interpretibong isinasalin ito na “makasalanang kalikasan.”
    reason: lexical_alternative
  - marker: c
    text: O “bilang handog para sa kasalanan.” Maaaring may sakripisyal na diwa ang pariralang Griyego.
    reason: alternative_reading
  - marker: d
    text: Ang “sa wangis ng makasalanang laman” ay nagpapahayag ng tunay na pagiging tao ng Anak habang maingat siyang itinatangi mula sa kasalanan mismo.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ang hindi magawa ng kautusan
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang kawalan ng kakayahan ng kautusan, sa halip na gawing abstrakto ang parirala.
- source_word: νόμος
  choice: kautusan
  rationale: Ang “kautusan” ang dignified at karaniwang salin sa kontekstong biblikal; hindi kailangang dagdagan ng tahasang “ni Moises” sapagkat wala iyon sa parirala.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: dahil pinahina ito ng laman
  rationale: Ipinapakita ang paliwanag kung bakit hindi ito nakagawa, habang pinananatili ang σάρξ bilang “laman” at ang ideya na ang kahinaan ay kaugnay ng laman, hindi likas na depekto ng kautusan.
- source_word: πέμψας
  choice: isinugo niya
  rationale: Natural na Tagalog para sa instrumental na paraan ng pagkilos ng Diyos; ang tutuldok ay nagpapakita na ang sumunod ang ginawa ng Diyos.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: ang sarili niyang Anak
  rationale: Pinananatili ang diin ng ἑαυτοῦ sa natatanging kaugnayan ng Anak sa Diyos.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: sa wangis ng makasalanang laman
  rationale: 'Pinananatili ang masinsing tensiyon ng teksto: tunay na pakikibahagi sa laman ngunit hindi tahasang iniuugnay ang kasalanan sa Anak.'
- source_word: περὶ ἁμαρτίας
  choice: para sa kasalanan
  rationale: Pinananatili sa pangunahing teksto ang mas malawak na kahulugan ng parirala; inilalagay sa talababa ang posibleng sakripisyal na diwa na “bilang handog para sa kasalanan.”
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: hinatulan niya ang kasalanan
  rationale: Direkta at natural na ipinapahayag ang hudisyal na puwersa ng pandiwa.
- source_word: ἐν τῇ σαρκί
  choice: sa laman
  rationale: Hindi dinaragdagan ng panghalip na “kanyang,” kaya napapanatili ang siksik at bahagyang bukas na pagtukoy ng Griyego.
theological_decisions:
- issue: Kahulugan ng σάρξ sa dalawang paglitaw
  choice: “laman” sa pangunahing teksto
  alternative: “makasalanang kalikasan” o “mahinang pagkatao”
  rationale: Ang “laman” ay nagpapanatili sa magkakaugnay ngunit masalimuot na gamit ni Pablo at umiiwas sa pagpapasok ng isang interpretasyong teolohikal bilang mismong salin.
- issue: Kahulugan ng περὶ ἁμαρτίας
  choice: “para sa kasalanan” sa pangunahing teksto
  alternative: “bilang handog para sa kasalanan”
  rationale: May matibay na batayang sakripisyal ang alternatibo sa gamit ng Septuagint, ngunit mas malawak ang literal na parirala; kaya pinananatili ang tunay na kalabuan sa pamamagitan ng talababa.
- issue: Diwa ng “sa wangis ng makasalanang laman”
  choice: Panatilihin ang “wangis” at “makasalanang laman” nang walang dagdag na paliwanag sa talata
  alternative: Isalin sa paraang tahasang nagsasabing tunay na tao ngunit walang kasalanan ang Anak
  rationale: Ang mismong pananalita ng Griyego ang maingat na nagpapanatili sa tunay na pagkakatawang-tao at sa pagkakaiba ng Anak mula sa kasalanan; hindi dapat lutasin ng salin ang tensiyong iyon sa pamamagitan ng pagpapalawak.
- issue: Tinutukoy ng ἐν τῇ σαρκί
  choice: “sa laman” nang walang tahasang “kanyang”
  alternative: “sa kanyang laman”
  rationale: Malamang na tumutukoy ito sa laman ng Anak bilang lugar ng paghatol sa kasalanan, ngunit walang tahasang panghalip ang Griyego; pinananatili ng salin ang pagiging siksik nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kautusan,” “laman,” “wangis,” at “hinatulan” upang mapanatili ang biblikal at teolohikal na bigat nang hindi nagiging lipas o labis na teknikal. Inayos ang bantas upang maging malinaw ang ipinahiwatig na “ginawa ng Diyos” sa sintaks ng Griyego.
