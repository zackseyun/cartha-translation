  naturalness: Natural at angkop ang “nag-aalinlangan,” “pananampalataya,” at ang pangwakas na mariing “ay kasalanan.” Ang “kung kumain siya” ay mas tuwiran at idiomatiko para sa kondisyong ipinapahayag ng talata.
  terminology: Ang “pananampalataya” ay wastong pangunahing katumbas ng πίστις at ang “kasalanan” ay wastong katumbas ng ἁμαρτία. Pinananatili ng talababa ang kontekstuwal na nuwansang paninindigan nang hindi pinapalitan ang pangunahing terminong teolohikal.
