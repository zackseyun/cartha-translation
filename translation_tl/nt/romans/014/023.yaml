base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: tl
  text: Ngunit ang nag-aalinlangan, kung kumain siya[a], ay nahatulan na, sapagkat hindi ito mula sa pananampalataya; at ang lahat ng hindi mula sa pananampalataya ay kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sapagkat hindi ito nagmumula sa matatag na paninindigan.” Sa Griyego, “mula sa pananampalataya,” na maaaring tumukoy sa pagkilos ayon sa matatag na paninindigan sa harap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: ang nag-aalinlangan
  rationale: Sa konteksto ng pag-aalinlangan tungkol sa pagkain, tumutukoy ito sa taong nag-aatubili o nahahati ang loob, hindi sa taong nakikipagtalo.
- source_word: ἐὰν φάγῃ
  choice: kapag kumain siya
  rationale: Ipinahahayag ng ἐάν at aorist subjunctive ang kondisyon; natural sa Tagalog ang “kapag kumain siya” sa pangkalahatang kondisyong ito.
- source_word: κατακέκριται
  choice: ay hinahatulan
  rationale: Pinananatili nito ang passive at ang kalagayang bunga ng ginawa, nang hindi tinutukoy kung sino ang humahatol.
- source_word: ὅτι
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang dahilan ng paghatol sa isang marangal ngunit karaniwang gamit na salita.
- source_word: ἐκ πίστεως
  choice: mula sa pananampalataya
  rationale: Pinananatili ang literal na metapora at mas malawak na bokabularyong teolohikal ni Pablo, habang inilalagay sa talababa ang kontekstuwal na diwang “matatag na paninindigan.”
- source_word: πᾶν ... ὃ
  choice: ang lahat ng hindi
  rationale: Natural at komprehensibong katumbas ng neuter singular construction sa pangwakas na pahayag.
- source_word: ἁμαρτία ἐστίν
  choice: ay kasalanan
  rationale: Pinananatili ang tuwiran at mariing predicate noun ng Griyego sa halip na gawing “makasalanan.”
theological_decisions:
- issue: Kahulugan ng πίστις sa kontekstong moral
  choice: pananampalataya
  alternative: matatag na paninindigan; pagtitiwala; katapatan
  rationale: Ang “pananampalataya” ay nagpapanatili sa mas malawak na gamit ni Pablo at hindi nagpapakitid sa salita tungo lamang sa pansariling opinyon. Ipinapaliwanag sa talababa ang diwa ng pagkilos ayon sa matatag na paninindigan sa harap ng Diyos.
- issue: Saklaw at tagaganap ng paghatol sa κατακέκριται
  choice: ay hinahatulan
  alternative: hinahatulan ang sarili; hinahatulan ng Diyos
  rationale: Hindi tahasang tinutukoy ng passive sa Griyego ang tagaganap. Kaya hindi nilulutas ng salin kung Diyos, budhi, o kapuwa ang binibigyang-diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nag-aalinlangan” para sa panloob na pag-aatubili at pinanatili ang “pananampalataya” upang huwag paliitin ang sadyang malawak na πίστις.
