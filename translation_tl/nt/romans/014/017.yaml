  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: tl
  text: Sapagkat ang kaharian ng Diyos ay hindi pagkain at pag-inom, kundi katuwiran[a], kapayapaan, at kagalakan sa Banal na Espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.” Maaaring tumukoy ang salitang Griyego na δικαιοσύνη sa katuwiran o katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: kaharian
  rationale: Ang “kaharian” ang likas at kinikilalang salin sa kontekstong ito at napapanatili ang lawak ng paghahari ng Diyos nang hindi nililimitahan sa isang lugar lamang.
- source_word: βρῶσις καὶ πόσις
  choice: pagkain at pag-inom
  rationale: Magkatumbas na pangngalang kilos ang ginamit upang mapanatili ang paralelismo ng Griyego at ang konteksto ng mga gawaing pinagtatalunan.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang salin sa gamit ni Pablo at sumasaklaw sa pagiging matuwid at wastong pagkilos; inilagay sa talababa ang posibleng “katarungan.”
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Likas na ipinahahayag nito ang personal at panlahatang pagkakasundo na mahalaga sa konteksto.
- source_word: χαρά
  choice: kagalakan
  rationale: Dangal at likas na katumbas ito ng χαρά sa makabagong Filipino.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Pinananatili ng “sa” ang sadyang malawak na diwa ng ἐν, na maaaring tumukoy sa saklaw o kaparaanan, at ang parirala ay likas na tumutukoy sa Banal na Espiritu.
- source_word: γάρ
  choice: Sapagkat
  rationale: Malinaw nitong pinananatili ang paliwanag na ugnayan ng talata sa naunang pangangatwiran.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη sa gamit ni Pablo
  choice: katuwiran
  alternative: katarungan
  rationale: Pinili ang karaniwang saling “katuwiran” nang hindi ikinakaila ang etikal at panlipunang diwang maaaring ipahiwatig ng “katarungan”; pinanatili ang alternatibo sa talababa.
- issue: Ugnayan ng ἐν sa Banal na Espiritu
  choice: sa Banal na Espiritu
  alternative: sa pamamagitan ng Banal na Espiritu
  rationale: Hindi nilutas nang labis kung ang ἐν ay pangunahing tumutukoy sa saklaw o kaparaanan; ang payak na “sa” ay nagpapanatili ng tunay na kaluwagan ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi tungkol sa” upang likas na maipahayag na ang kaharian ng Diyos ay hindi binubuo o pangunahing nakasalalay sa pagkain at pag-inom, habang nananatili ang diin ng orihinal.
