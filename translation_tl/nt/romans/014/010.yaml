  source_fidelity: 'Tumpak na naisasalin ang mga pangunahing elemento ng Griyego: ang mariing pagtukoy sa kausap, ang dalawang retorikal na tanong, ang pagkakaiba ng κρίνεις at ἐξουθενεῖς, ang saklaw na “tayong lahat,” at ang hinaharap na pagharap sa βῆμα ng Diyos. Ang “hukuman” ay isang natural na Tagalog na katumbas ng larawang tribunal/judgment seat nang hindi nagdaragdag ng interpretasyon.'
