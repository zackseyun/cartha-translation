id: ROM.14.10
reference: Romans 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: tl
  text: Ngunit ikaw, bakit mo hinahatulan ang kapatid mo[a]? O ikaw naman, bakit mo hinahamak ang kapatid mo? Sapagkat tayong lahat ay haharap sa hukuman ng Diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “kapatid na lalaki”; sa kontekstong ito, maaaring tumukoy sa kapatid na lalaki o babae.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang manuskrito, “hukuman ni Cristo.”
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ngunit ikaw
  rationale: Pinananatili ang pagsalungat ng δέ at ang diin sa tahasang σύ sa natural na Tagalog.
- source_word: τί κρίνεις
  choice: bakit mo hinahatulan
  rationale: Sa retorikal na tanong, ang τί ay natural na isinasaling “bakit.” Ang “hinahatulan” ay nagpapanatili sa diwang hudisyal ng κρίνω nang hindi ito nililimitahan sa pinal na pagkondena.
- source_word: τὸν ἀδελφόν σου
  choice: ang kapatid mo
  rationale: Ang “kapatid” ang natural at dignified na katumbas sa Tagalog. Bagaman panlalaking isahan ang anyong Griyego, maaaring saklaw ng gamit nito sa konteksto ang kapwa lalaki at babae; nililinaw ito sa talababa.
- source_word: ἢ καὶ σὺ
  choice: O ikaw naman
  rationale: Ipinapakita ng “naman” ang dagdag at pagtapat na diin ng καί sa ikalawang kausap.
- source_word: τί ἐξουθενεῖς
  choice: bakit mo hinahamak
  rationale: Ang “hinahamak” ay malinaw na nagpapahayag ng pagtrato sa isang tao bilang mababa o walang halaga, na siyang lakas ng ἐξουθενέω.
- source_word: πάντες γὰρ
  choice: Sapagkat tayong lahat
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ, at malinaw na isinasama ng “tayong lahat” si Pablo at ang mga kausap niya.
- source_word: παραστησόμεθα
  choice: ay haharap
  rationale: Sa kontekstong panghukuman, natural na ipinahahayag ng “haharap” ang pagtayo o pagharap sa harap ng isang tribunal.
- source_word: τῷ βήματι
  choice: sa hukuman
  rationale: Ang βῆμα ay tumutukoy sa luklukan o tribunal ng paghatol. Ang “hukuman” ay malinaw at natural sa modernong Tagalog habang pinananatili ang larawang legal.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang isinasalin ang genitibong parirala ayon sa pangunahing teksto ng SBLGNT.
theological_decisions:
- issue: Kung kaninong hukuman ang haharapin ng lahat
  choice: ng Diyos
  alternative: ni Cristo
  rationale: Ang ibinigay na tekstong Griyego ay τοῦ θεοῦ, kaya “ng Diyos” ang nasa pangunahing teksto. Dahil “ni Cristo” ang mababasa sa ilang manuskrito, pinananatili ang variant sa talababa sa halip na pag-isahin ang mga pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “kapatid” bilang likas na salitang Tagalog, at “hukuman” upang malinaw na mapanatili ang larawang panghukuman.
