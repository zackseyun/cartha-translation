  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: tl
  text: Kaya huwag ninyong hayaang pagsalitaan nang masama ang mabuti ninyong taglay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hamakin” o “siraan.” Ang pandiwang Griyego ay maaaring tumukoy sa mapang-abuso o mapanirang pananalita. Maaari rin itong literal na isaling “lapastanganin,” ngunit maaaring magmukhang masyadong relihiyoso ang dating nito sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: huwag ninyong hayaang
  rationale: Kasama ng kasalukuyang balintiyak na pautos na βλασφημείσθω, nagpapahayag ito ng pagbabawal. Likas sa modernong Tagalog ang “huwag ninyong hayaang” at malinaw nitong naipapakita ang balintiyak na diwa.
- source_word: βλασφημείσθω
  choice: pagsalitaan ng masama
  rationale: Maaaring tumukoy ang pandiwa sa mapang-abuso, mapanirang-puri, o mapanghamak na pananalita. Hindi Diyos kundi “ang mabuti” ang layon dito, kaya mas angkop ang “pagsalitaan ng masama” kaysa sa salitang may mas tiyak na relihiyosong dating na “lapastanganin.”
- source_word: οὖν
  choice: Kaya
  rationale: Ipinahihiwatig ng οὖν ang kongklusyon o bunga ng naunang pangangatwiran. Malinaw at natural sa kasalukuyang Tagalog ang “Kaya.”
- source_word: ὑμῶν
  choice: ninyo
  rationale: Ang panghalip na nasa anyong genitive ay nagpapakita ng pag-aari o kaugnayan sa τὸ ἀγαθόν. Isinama ang diwang ito sa pariralang “tinatamasa ninyo.”
- source_word: τὸ ἀγαθόν
  choice: ang mabuting tinatamasa ninyo
  rationale: Ang pang-uring neuter na may pantukoy ay ginagamit bilang pangngalan, “ang mabuti.” Pinananatili ng salin ang malawak na saklaw nito habang ginagawang likas sa Tagalog; hindi nito tuwirang nililimitahan ang tinutukoy sa kalayaan, karapatan, o pribilehiyo.
theological_decisions:
- issue: Ang tinutukoy ng τὸ ἀγαθόν na kaugnay ng ὑμῶν
  choice: ang mabuting tinatamasa ninyo
  alternative: ang inyong kalayaan; ang inyong karapatan; ang inyong pribilehiyo; ang inyong kabutihan
  rationale: Maikli at malawak ang pananalita ni Pablo. Maaaring saklawin nito ang mabuting bagay, pakinabang, o kalayaang kaugnay ng paninindigan ng mga mananampalataya sa mga bagay na pinagtatalunan. Hindi ito nilimitahan sa isang partikular na pagpapakahulugan upang mapanatili ang tunay na kalabuan at pastoral na tensiyon ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pagsalitaan ng masama” upang idiin ang pasalitang paninira, at iniwasan ang sobrang relihiyosong dating ng “lapastanganin.”
