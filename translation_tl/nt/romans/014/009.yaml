  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: tl
  text: 'Sapagkat ito ang layunin kung bakit namatay at muling nabuhay[a] ang Mesiyas: upang mamuno siya kapwa sa mga patay at sa mga buháy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabuhay.” Ang Griyego ay literal na nagsasabing “namatay at nabuhay,” at ipinahihiwatig ng konteksto ang buhay matapos ang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: dahil dito
  rationale: Ipinahahayag ng parirala ang layunin o tunguhin ng kamatayan at muling pagkabuhay ng Mesiyas. Natural ito sa modernong Tagalog at naiuugnay nang malinaw sa sugnay na may upang.
- source_word: γὰρ
  choice: sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan para sa naunang pahayag sa konteksto.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Ginamit bilang titulo para kay Jesus; isinasalin ang kahulugan ng Χριστός sa halip na tumbasan lamang ito ng transliterasyong Cristo.
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwirang katumbas ng aorist na pandiwa, nang walang hindi kailangang pagpapalawak.
- source_word: ἔζησεν
  choice: muling nabuhay
  rationale: Sa pagkakasunod na 'namatay at nabuhay,' tumutukoy ito sa buhay matapos ang kamatayan. Ipinahahayag ng 'muling nabuhay' ang pahiwatig ng konteksto, habang itinatala sa talababa ang mas literal na anyo.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at natural na naghuhudyat ng layunin sa Tagalog.
- source_word: νεκρῶν
  choice: mga patay
  rationale: Substantibong pangmaramihan at likas na kapares ng 'mga buháy.'
- source_word: ζώντων
  choice: mga buháy
  rationale: Substantibong participle na tumutukoy sa mga taong nabubuhay; nilagyan ng tuldik upang maiba sa 'bahay.'
- source_word: κυριεύσῃ
  choice: mamuno ... sa
  rationale: Direktang ipinapahayag ang pandiwang kahulugan na magkaroon ng kapangyarihan o paghahari sa iba, nang hindi ito ginagawang pangngalang titulo.
theological_decisions:
- issue: Ang kahulugan ng ἔζησεν matapos ang ἀπέθανεν
  choice: muling nabuhay
  alternative: nabuhay; bumangon tungo sa buhay
  rationale: Malakas na ipinahihiwatig ng pagkakapares sa 'namatay' ang buhay pagkatapos ng kamatayan, ngunit pinananatili sa talababa na payak na 'nabuhay' ang mismong anyo ng Griyego.
- issue: Ang kristolohikal na bigat ng κυριεύσῃ
  choice: mamuno siya ... sa
  alternative: maging Panginoon siya ng
  rationale: Pandiwa ang κυριεύσῃ at tuwirang nangangahulugang mamuno o maghari. Iniiwasan ng salin na palitan ito ng tahasang titulo, habang pinananatili ang pahayag ng kapangyarihan ng Mesiyas sa mga patay at mga buháy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'Mesiyas' bilang makabuluhang salin ng titulo at 'mamuno' bilang natural na pandiwang katumbas ng κυριεύσῃ. Ang 'buháy' ay nilagyan ng tuldik para sa kalinawan.
