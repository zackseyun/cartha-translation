base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: tl
  text: Mabuting huwag kumain ng karne o uminom ng alak o gumawa ng anumang bagay na nagiging dahilan upang matisod, matulak sa pagkakasala, o manghina[b] ang iyong kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto, ang “kapatid” ay tumutukoy sa kapwa mananampalataya, lalaki man o babae.
    reason: lexical_alternative
  - marker: b
    text: May ilang manuskrito na walang “matulak sa pagkakasala, o manghina.”
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: Mabuti
  rationale: Ipinapahayag ng καλόν na ang ganitong pagkilos ay tama at kapuri-puri; likas at sapat ang “mabuti” sa modernong Tagalog.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: huwag kumain ng karne
  rationale: Pinananatili nito ang diwa ng pag-iwas na ipinahahayag ng articular infinitive, habang gumagamit ng natural na anyong Tagalog.
- source_word: μηδὲ πιεῖν οἶνον
  choice: o uminom ng alak
  rationale: Ang μηδέ ay nagdaragdag ng ikalawang bagay na kusang iniiwasan; “alak” ang karaniwang katumbas ng οἶνος sa kontekstong ito.
- source_word: μηδὲ ἐν ᾧ
  choice: o gumawa ng anumang bagay na nagiging dahilan upang
  rationale: Elliptical ang Griyego, kaya ipinapahayag sa Tagalog ang ipinahihiwatig na pagkilos nang hindi nililimitahan kung anong uri ng gawain iyon.
- source_word: ὁ ἀδελφός σου
  choice: ang iyong kapatid
  rationale: Sa Tagalog, ang “kapatid” ay likas na hindi nagtatakda ng kasarian ngunit tumpak na tumutukoy sa kapatid sa pananampalataya ayon sa konteksto.
- source_word: προσκόπτει
  choice: matisod
  rationale: Pinananatili ang metapora ng pagkatisod bilang espirituwal o moral na kapahamakan.
- source_word: σκανδαλίζεται
  choice: mahulog sa kasalanan
  rationale: Ipinahahayag ang passive na diwa ng pagiging sanhi ng espirituwal na pagbagsak, at naihihiwalay ito sa metapora ng προσκόπτει nang hindi ito ginagawang simpleng pagdaramdam.
- source_word: ἀσθενεῖ
  choice: manghina
  rationale: Pinananatili ang figurative na diwa ng paghina sa pananampalataya o budhi nang hindi labis na nililinaw ang eksaktong uri ng kahinaan.
theological_decisions:
- issue: Saklaw ng ὁ ἀδελφός σου
  choice: ang iyong kapatid
  alternative: ang kapatid mong lalaki; ang kapatid mo sa pananampalataya
  rationale: Bagaman masculine singular ang Griyego, hindi minamarkahan ng salitang Tagalog na “kapatid” ang kasarian. Pinananatili nito ang tuwirang ugnayang pampamilya at ang malamang na representative force sa konteksto; nililinaw sa talababa na kapwa mananampalataya ang tinutukoy.
- issue: Ugnayan ng προσκόπτει at σκανδαλίζεται
  choice: matisod, mahulog sa kasalanan
  alternative: matisod, masilo; matisod, magdamdam
  rationale: Magkaugnay ngunit hindi ganap na magkapareho ang dalawang pandiwa. Pinananatili ng salin ang pag-igting sa pagitan ng pagkatisod at pagkahulog sa kasalanan, sa halip na pag-isahin ang mga ito o gawing emosyonal lamang ang σκανδαλίζεται.
- issue: Textual variation sa huling dalawang sugnay
  choice: Isinama sa pangunahing teksto ang “mahulog sa kasalanan, o manghina” at minarkahan ng talababa
  alternative: Alisin ang dalawang sugnay sa pangunahing teksto
  rationale: Kasama ang mga salita sa ibinigay na SBLGNT text ngunit minarkahan bilang tekstuwal na variation. Hindi tahimik na nilulutas ang pagkakaiba; inilalahad ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Iniwasan ang masyadong teknikal na pananalita at ang “magdamdam” para sa σκανδαλίζεται, sapagkat maaari nitong paliitin ang diwa tungo sa emosyonal na pagkasaktan lamang. Ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang tatlong magkakaugnay na bunga ng mapaminsalang pagkilos.
