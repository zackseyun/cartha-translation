  naturalness: Malinaw, marangal, at natural ang pangungusap sa modernong Filipino Tagalog. Ang “matulak sa pagkakasala” ay mas malinaw na Tagalog kaysa sa literal ngunit malabong pagtatangkang ulitin ang “matisod,” at iniingatan nito ang sanhi/pasibong himig ng ikalawang pandiwa.
  terminology: Ang “karne,” “alak,” “kapatid,” “matisod,” at “manghina” ay angkop. Ang “kapatid” ay likas na walang markang pangkasarian sa Tagalog; ang paliwanag na tumutukoy ito sa kapwa mananampalataya ay angkop sa talababa.
