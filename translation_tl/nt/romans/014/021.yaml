revisions:
- from: Mabuting huwag kumain ng karne o uminom ng alak o gumawa ng anumang bagay na nagiging dahilan upang matisod, mahulog sa kasalanan, o manghina[b] ang iyong kapatid.[a]
  to: Mabuting huwag kumain ng karne o uminom ng alak o gumawa ng anumang bagay na nagiging dahilan upang matisod, matulak sa pagkakasala, o manghina[b] ang iyong kapatid.[a]
  rationale: 'Pinanatili ang estruktura at saklaw ng Griyego: mabuti ang pag-iwas sa karne, alak, at anumang gawaing nakapipinsala sa kapatid. Pinalitan ang interpretatibong “mahulog sa kasalanan” ng “matulak sa pagkakasala” upang maipakita ang pasibong/causative na diwa ng σκανδαλίζεται nang hindi ipinagpapalagay ang isang ganap na naganap na pagbagsak. Inayos ang talababa upang tumpak na tumukoy sa brinaketang tekstuwal na variant.'
