  to: Sapagkat kung tayo’y nabubuhay, nabubuhay tayo para sa Panginoon[a]; at kung tayo’y namamatay, namamatay tayo para sa Panginoon. Kaya nga, nabubuhay man tayo o namamatay, tayo ay pag-aari ng Panginoon[b].
  rationale: Inayos ang ayos ng unang kondisyunal na sugnay sa ‘kung tayo’y nabubuhay’ para sa mas likas na daloy, at pinalitan ang di-idiomatikong ‘tayo ay sa Panginoon’ ng ‘tayo ay pag-aari ng Panginoon.’ Pinanatili ang pag-uulit, ang saklaw na ‘para sa Panginoon,’ at ang talababa upang hindi ikulong ang puwersa ng datibo sa iisang pakahulugan.
