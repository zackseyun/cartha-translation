  naturalness: Hindi lubos na natural o kumpleto sa modernong Filipino ang ‘tayo ay sa Panginoon’ bilang pangwakas na panaguri. Ang ‘tayo ay pag-aari ng Panginoon’ ay malinaw, marangal, at likas, habang pinananatili ang diin ng genitibong Griyego.
  terminology: Ang ‘Panginoon’ ay wastong katumbas ng κύριος at hindi labis na tinutukoy ang reperente. Ang ‘pag-aari ng Panginoon’ ay wastong naghahatid ng τοῦ κυρίου ἐσμέν; ang alternatibong ‘nabibilang tayo sa Panginoon’ ay angkop sa talababa.
