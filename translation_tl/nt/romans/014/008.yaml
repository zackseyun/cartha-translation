  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: tl
  text: Sapagkat kung tayo’y nabubuhay, nabubuhay tayo para sa Panginoon[a]; at kung tayo’y namamatay, namamatay tayo para sa Panginoon. Kaya nga, nabubuhay man tayo o namamatay, tayo ay pag-aari ng Panginoon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ukol sa Panginoon” sa paulit-ulit na mga pariralang “nabubuhay tayo para sa Panginoon” at “namamatay tayo para sa Panginoon.” Maaaring magpahayag ang datibong Griyego ng kaugnayan, pagkakatuon, o kapakinabangan.
    reason: lexical_alternative
  - marker: b
    text: O, “nabibilang tayo sa Panginoon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata, samantalang likas sa Tagalog ang “kung” sa magkatuwang na kondisyon.
- source_word: ζῶμεν / ζῶμεν
  choice: nabubuhay tayo / nabubuhay tayo
  rationale: Parehong isinalin ang ζάω bilang “nabubuhay” upang mapanatili ang pag-uulit at ang pangkalahatang pagtukoy sa buhay.
- source_word: τῷ κυρίῳ
  choice: para sa Panginoon
  rationale: Likas at malinaw ito sa modernong Tagalog para sa pagkakaugnay at pagkakatuon ng buhay at kamatayan sa Panginoon. Nililinaw sa talababa na mas malawak ang maaaring saklaw ng datibong Griyego kaysa pakinabang o paglilingkod lamang.
- source_word: κύριος
  choice: Panginoon
  rationale: Pinananatili ang titulong may teolohikal na bigat nang hindi tahasang tinutukoy ang reperente nang higit sa sinasabi ng talata.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: namamatay tayo / namamatay tayo
  rationale: Direkta at pare-parehong salin ito ng pandiwa; pangkalahatan ang diwa rito, hindi kinakailangang tumukoy sa kasalukuyang proseso ng paghihingalo.
- source_word: οὖν
  choice: Kaya nga
  rationale: Likas na ipinahahayag nito ang kongklusyong hinango mula sa dalawang naunang sugnay.
- source_word: τοῦ κυρίου ἐσμέν
  choice: tayo ay sa Panginoon
  rationale: Pinananatili ng maikli at likas na pahayag ang diwa ng pag-aari o pag-anib nang hindi ito ginagawang mas tahasang pangungusap kaysa sa genitibong Griyego.
theological_decisions:
- issue: Ang reperente at puwersa ng κύριος
  choice: Pinanatili ang “Panginoon” bilang titulo nang hindi nagdaragdag ng tiyak na pangalan.
  alternative: “Panginoong Jesus” o “Diyos”
  rationale: Itinuturo ng kasunod na konteksto kay Cristo, ngunit κύριος lamang ang tahasang nasa talata. Pinananatili ng salin ang kontekstuwal na pahiwatig at ang mas malawak na teolohikal na taginting.
- issue: Ang ugnayang ipinahahayag ng τῷ κυρίῳ sa pamumuhay at pagkamatay
  choice: “para sa Panginoon,” na may talababa tungkol sa mas malawak na puwersa ng datibo
  alternative: “may kaugnayan sa Panginoon,” “ukol sa Panginoon,” o “sa ilalim ng kapangyarihan ng Panginoon”
  rationale: Ipinahahayag ng konteksto ang pagkakaugnay, pagkakatuon, at pag-aari sa Panginoon. Ang pangunahing salin ay natural sa Tagalog, habang iniiwasan ng talababa na ikulong ang kahulugan sa paglilingkod lamang.
- issue: Ang puwersa ng τοῦ κυρίου ἐσμέν
  choice: “tayo ay sa Panginoon”
  alternative: “tayo ay pag-aari ng Panginoon” o “nabibilang tayo sa Panginoon”
  rationale: Ang genitibo ay may malakas na diwa ng pag-aari o pagiging kabilang. Ang piniling anyo ay maikli at nagpapanatili ng lawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang balanseng pag-uulit ng Griyego at ang lohikal na paglipat sa “Kaya nga.”
