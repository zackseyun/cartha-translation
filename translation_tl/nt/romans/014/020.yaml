  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: tl
  text: Huwag mong gibain ang gawa ng Diyos dahil sa pagkain. Tunay ngang malinis ang lahat ng bagay,[a] ngunit masama para sa taong kumakain na nagiging katitisuran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, tumutukoy ang “lahat ng bagay” sa pagkain; maaari ring isalin, “Malinis ang lahat ng pagkain.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ngunit masama para sa taong kumakain na nagiging sanhi ng pagkatisod.” Hindi tahasang tinutukoy ng Griyego kung sino ang natitisod.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: dahil lamang sa pagkain
  rationale: Ipinahahayag ng ἕνεκεν na pagkain ang dahilan o motibo; ipinakikita ng “lamang” ang kaibahan sa bigat ng pinsalang maaaring idulot nang hindi binabago ang diwa.
- source_word: κατάλυε
  choice: gibain
  rationale: Pinananatili nito ang metapora ng pagbuwag sa isang bagay na itinatayo o ginagawa ng Diyos; ang μή kasama ng pautos ay isinaling bilang pagbabawal.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ang gawa ng Diyos
  rationale: Tuwirang salin ito na nagpapanatili sa lawak ng parirala, na maaaring tumukoy sa ginagawa ng Diyos sa kapwa mananampalataya at sa pamayanan.
- source_word: πάντα μὲν καθαρά
  choice: Tunay ngang malinis ang lahat ng bagay
  rationale: Pinananatili ang malawak na πάντα at ang wikang pangkalinisan ng καθαρά; ipinahihiwatig ng konteksto na pagkain ang pinag-uusapan, ngunit hindi iyon idinagdag sa pangunahing teksto.
- source_word: κακὸν
  choice: masama
  rationale: Natural at may sapat na moral na bigat ang “masama” para sa κακόν.
- source_word: τῷ ἀνθρώπῳ
  choice: para sa taong
  rationale: Ang ἄνθρωπος ay pangkalahatang tumutukoy sa isang tao rito; natural at tumpak sa modernong Tagalog ang “taong,” nang walang di-kinakailangang pagtukoy sa kasarian.
- source_word: διὰ προσκόμματος
  choice: sa paraang nagiging katitisuran
  rationale: Pinananatili ang larawan ng πρόσκομμα bilang sanhi ng pagkatisod at ang posibilidad na inilalarawan nito ang paraan o bunga ng pagkain.
- source_word: ἐσθίοντι
  choice: kumakain
  rationale: Ang substantival na kasalukuyang participle ay natural na naipapahayag sa Tagalog bilang “taong kumakain.”
theological_decisions:
- issue: Saklaw ng “malinis” kaugnay ng pagkain at kalayaan
  choice: Panatilihin ang “malinis ang lahat ng bagay” sa pangunahing teksto, habang nililinaw sa talababa na pagkain ang konteksto.
  alternative: “Malinis ang lahat ng pagkain” o “ipinahihintulot ang lahat.”
  rationale: Malawak ang πάντα at hindi tahasang sinasabing “mga pagkain,” samantalang pinananatili ng “malinis” ang wika tungkol sa rituwal o moral na kalinisan sa halip na ipakahulugang “ipinahihintulot.”
- issue: Kahulugan ng διὰ προσκόμματος
  choice: “sa paraang nagiging katitisuran,” na pinananatili ang likas na kalabuan kung ang diin ay nasa paraan o bunga ng pagkain.
  alternative: “na dahil dito ay natitisod” o “upang makatisod ng iba.”
  rationale: Hindi tahasang binabanggit ng Griyego kung sino ang natitisod, at maaaring tumukoy ang parirala sa pagkain sa harap ng katitisuran o sa pagkain na nagdudulot ng pagkatisod; hindi dapat tahimik na lutasin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “gibain” upang buhayin ang metapora ng pagtatayo at pagbuwag, at “katitisuran” upang mapanatili ang biblikal na larawan nang hindi nagiging labis na teknikal.
