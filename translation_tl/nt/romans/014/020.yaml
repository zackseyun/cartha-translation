    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ngunit masama para sa taong kumakain na nagiging sanhi ng pagkatisod.” Hindi tahasang tinutukoy ng Griyego kung sino ang natitisod.
    reason: ambiguity
  revision_rationale: 'Inalis ang “lamang” upang hindi magdagdag ng diin na wala sa Griyego. Pinalitan ang hindi likas na “sa paraang nagiging katitisuran” ng “na nagiging katitisuran,” na mas malinaw sa Tagalog at nag-iingat sa kalabuan ng διὰ προσκόμματος: hindi nito pinapangalanan ang taong natitisod o ipinipilit ang isang partikular na mekanismo ng pagkatisod. Inayos din ang talababa upang hindi magmungkahi na ang kumakain mismo ang natitisod.'
