  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: tl
  text: 'Kaya nga, huwag na tayong humatol sa isa''t isa. Sa halip, ito ang ipasiya ninyo: huwag maglagay ng katitisuran o sanhi ng pagkahulog[b] sa daan ng isang kapatid[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid” ay tumutukoy rito sa isang kapwa mananampalataya, lalaki man o babae; panlalaking isahan ang salitang Griyego.
    reason: alternative_reading
  - marker: b
    text: O “bitag.” Ang “sanhi ng pagkahulog” dito ay isang bagay na nag-uudyok o nagbubulid sa kapwa sa kasalanan, hindi lamang isang bagay na nakasasakit ng damdamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Kaya huwag na
  rationale: Ipinapakita ng “Kaya” ang paghinuha mula sa naunang pangangatuwiran, at ng “huwag na” ang pagtigil sa isang ginagawa.
- source_word: ἀλλήλους κρίνωμεν
  choice: tayong humatol sa isa't isa
  rationale: Pinananatili ang hortatoryong “tayo” at ang karaniwang kahulugan ng κρίνω bilang paghatol.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Sa halip, ipasiya ninyo ito
  rationale: Ang “ipasiya” ay natural na nagpapahayag ng ikalawang gamit ng κρίνω, na ngayo'y tumutukoy sa pagpapasiya tungkol sa sariling kilos; tinutumbasan ng “Sa halip” ang μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: huwag maglagay
  rationale: Natural na Filipino para sa nilalaman ng pasiyang hinihingi ng articular infinitive.
- source_word: πρόσκομμα
  choice: katitisuran
  rationale: Pinananatili ang larawang metaporikal ng isang bagay na nagiging sanhi ng pagkatisod sa moral o espirituwal na buhay.
- source_word: τῷ ἀδελφῷ
  choice: sa harap ng isang kapatid
  rationale: Sinusundan ang panlalaking isahan ng Griyego habang ginagamit ang natural at dignified na “kapatid,” na sa Filipino ay maaaring tumukoy sa lalaki o babae.
- source_word: σκάνδαλον
  choice: bitag
  rationale: Ipinahihiwatig ang isang bagay na nagiging sanhi ng pagkahulog sa kasalanan, hindi lamang ng pagsama ng loob, at naihihiwalay ito nang sapat sa “katitisuran.”
theological_decisions:
- issue: Saklaw ng ἀδελφῷ
  choice: isang kapatid
  alternative: isang kapatid na lalaki; isang kapwa mananampalataya
  rationale: Bagaman panlalaking isahan ang anyong Griyego, ang “kapatid” sa modernong Filipino ay natural na salitang hindi tahasang nagtatakda ng kasarian at sa konteksto ay tumutukoy sa kapwa mananampalataya; nililinaw ito sa talababa nang hindi dinaragdagan ang pangunahing teksto.
- issue: Etikal na puwersa ng σκάνδαλον
  choice: bitag
  alternative: sanhi ng pagkahulog; bagay na nagbubulid sa kasalanan
  rationale: Iniiwasan ng “bitag” ang modernong pagkaunawa sa “offense” bilang nasaktang damdamin at pinananatili ang ideya ng pag-akay o pagkahulog sa kasalanan.
- issue: Pag-uulit ng κρίνω
  choice: humatol … ipasiya
  alternative: humatol … hatulan
  rationale: 'Pinananatili ang tensiyon ng dalawang magkaibang gamit ng iisang pandiwang Griyego sa pamamagitan ng dalawang natural na katumbas sa Filipino: paghatol sa kapwa laban sa pagpapasiya tungkol sa sariling asal.'
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang “humatol” at “ipasiya” upang maging natural habang naipakikita ang magkaibang puwersa ng dalawang gamit ng κρίνω. Inilagay ang magkasunod na mga marker pagkatapos ng “kapatid” sapagkat kapwa nila nililinaw ang pariralang pangwakas.
