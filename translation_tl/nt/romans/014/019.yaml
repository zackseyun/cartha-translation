  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: tl
  text: Kaya nga[a], pagsikapan natin ang mga bagay na nagdudulot ng kapayapaan at ng pagpapatibay sa isa’t isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas pormal: “Kaya nga, pagsikapan natin ang mga bagay para sa kapayapaan at para sa pagpapatibay sa isa’t isa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Ipinahahayag ng magkasamang mga katagang ito ang kongklusyon mula sa naunang pangangatwiran. Likas sa makabagong Tagalog ang “Kaya nga” at napapanatili nito ang diin ng paghinuha.
- source_word: τὰ τῆς εἰρήνης
  choice: ang mga bagay na nagdudulot ng kapayapaan
  rationale: Ang parirala ay tumutukoy sa mga bagay o gawaing nauukol sa kapayapaan at humahantong dito. Mas malinaw at natural ito kaysa sa literal ngunit alanganing “mga bagay ng kapayapaan.”
- source_word: διώκωμεν
  choice: pagsikapan natin
  rationale: Ang kasalukuyang pasakaling pandiwa ay ginagamit bilang sama-samang panghihikayat at nagpapahiwatig ng patuloy at masigasig na pagkilos. Naipahahayag ng “pagsikapan natin” ang lakas ng διώκωμεν nang natural sa Tagalog.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: ang mga bagay na … nagpapatibay
  rationale: Bagaman literal na may larawan ng pagtatayo ang οἰκοδομή, dito ay metaporikal itong tumutukoy sa pagpapatatag o pagpapalago sa kapuwa. Pinananatili ng “nagpapatibay” ang larawan sa paraang malinaw sa karaniwang mambabasa.
- source_word: τῆς εἰς ἀλλήλους
  choice: sa isa’t isa
  rationale: Ipinahahayag ng parirala ang katumbasang pagkilos sa loob ng pamayanan. Ang “sa isa’t isa” ay natural na nagsasaad ng mutuwal na pagpapatibay.
theological_decisions:
- issue: Saklaw ng sama-samang pagpapatibay
  choice: Hinihikayat ang mga mananampalataya bilang isang pamayanan na magsikap para sa kapayapaan at sa pagpapatibay sa isa’t isa.
  alternative: Unawain ito bilang pagtukoy lamang sa pansariling pag-unlad sa moralidad.
  rationale: Itinuturo ng panghikayat na nasa unang panauhang maramihan at ng katumbasang ἀλλήλους ang sama-samang buhay ng pamayanan. Pinananatili ng salin ang diin na ito nang hindi nagdaragdag ng natatanging aral ng anumang denominasyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pagsikapan” upang ipakita ang masigasig at patuloy na pagkilos, at ang “nagpapatibay” upang mapanatili ang metapora ng pagtatayo nang hindi gumagamit ng teknikal na salitang pansimbahan.
