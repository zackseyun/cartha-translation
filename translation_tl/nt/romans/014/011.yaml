  terminology: Ang “Panginoon,” “Diyos,” “bawat tuhod,” at “bawat dila” ay angkop at pare-pareho. Ang talababa ay dapat magbigay ng mga leksikal na posibilidad nang hindi nagdaragdag ng “pagpapasalamat,” na hindi kailangan sa audit trail para sa talatang ito.
