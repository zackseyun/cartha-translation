  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: tl
  text: 'Sapagkat nasusulat: “Buhay ako,” sabi ng Panginoon, “sa akin luluhod ang bawat tuhod, at ang bawat dila ay magpapahayag ng pagkilala sa Diyos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magpapahayag sa Diyos” o “magpupuri sa Diyos.” Ang pandiwang Griyego ay maaaring magpahiwatig ng pagpapahayag ng pagkilala, pagpapahayag, o pagpuri, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormulang Filipino sa pagpapakilala ng sipi sa Kasulatan; ipinahihiwatig nito na nananatiling may bisa ang nakasulat.
- source_word: Ζῶ ἐγώ
  choice: Buhay ako
  rationale: Pinananatili ang maigsi at taimtim na pormulang panunumpa ng Griyego nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: κύριος
  choice: Panginoon
  rationale: Tuwirang salin ng κύριος at ang karaniwang marangal na tawag sa Diyos sa ganitong konteksto.
- source_word: ἐμοὶ
  choice: sa akin
  rationale: Pinananatili ang datibong pagtukoy sa tumatanggap ng pagluhod at ang unang panauhang pananalita ng sipi.
- source_word: κάμψει πᾶν γόνυ
  choice: luluhod ang bawat tuhod
  rationale: Natural sa Filipino at pinananatili ang kongkretong larawang nagpapahiwatig ng pagpapasakop at pagsamba.
- source_word: πᾶσα γλῶσσα
  choice: ang bawat dila
  rationale: Pinananatili ang metonimikong larawan at ang alingawngaw ng Kasulatan sa halip na gawing tahasang 'bawat tao.'
- source_word: ἐξομολογήσεται
  choice: hayagang kikilala
  rationale: Ipinahahayag ang pampubliko at taimtim na pagkilala na maaaring taglayin ng pandiwa, habang iniiwasan ang 'aamin,' na sa kasalukuyang Filipino ay madaling mapako sa pag-amin ng kasalanan o pagkakamali.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Tuwirang pinananatili ang datibo at ang mismong paglipat ng pananalita mula sa 'sa akin' tungo sa 'sa Diyos.'
theological_decisions:
- issue: Ugnayan ng “Panginoon,” “sa akin,” at “sa Diyos” sa loob ng sipi
  choice: Pinanatili ang “sabi ng Panginoon … sa akin … sa Diyos” nang hindi pinag-iisa o ipinapaliwanag ang mga tinutukoy.
  alternative: Gawing “sa akin” ang huling parirala para sa ganap na paralelismo, o tahasang tukuyin sa salin ang isang kristolohikal na interpretasyon.
  rationale: Ang anyo ng tekstong Griyego ay may tunay na paglipat mula sa unang panauhang salita ng Panginoon tungo sa “sa Diyos.” Dapat panatilihin ng salin ang tekstuwal at teolohikal na tensiyong ito sa halip na lutasin ito sa mismong talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pamilyar na pormulang “nasusulat” at pinanatili ang matalinghagang “bawat tuhod” at “bawat dila.” Inilipat ang talababa sa pandiwang kaugnay nito, sa halip na ilagay matapos ang “Buhay ako.”
