  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: tl
  text: Alam ko at matibay akong naniniwala sa Panginoong Jesus na walang anumang bagay na marumi sa sarili nito. Maliban na lamang na para sa taong nagtuturing na marumi ang isang bagay, iyon ay marumi para sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: Alam ko
  rationale: Tuwiran at natural na katumbas ng pandiwang nagsasaad ng kaalaman.
- source_word: πέπεισμαι
  choice: lubos akong naniniwala
  rationale: Ipinahahayag ng perpektong anyo ang matatag at nananatiling paniniwala; natural ito sa makabagong Filipino.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  rationale: Pinananatili ang sadyang malawak na ugnayang ipinahahayag ng ἐν, nang hindi ito nililimitahan sa ‘mula kay’ o ‘sa pakikipag-isa kay.’
- source_word: κοινόν
  choice: marumi
  rationale: Sa konteksto ng pagkain at kalinisan, tumutukoy ito sa itinuturing na ritwal na marumi o nadungisan, hindi lamang sa karaniwan o pinagsasaluhan.
- source_word: δι’ ἑαυτοῦ
  choice: sa sarili nito
  rationale: Likas na pariralang Filipino para sa kawalan ng likas o intrinsic na karumihan.
- source_word: τῷ λογιζομένῳ
  choice: para sa taong nagtuturing
  rationale: Ipinapakita ng ‘nagtuturing’ ang pagtatasa o pagtingin ng budhi sa isang bagay.
- source_word: τι
  choice: ang isang bagay
  rationale: Natural na pangkalahatang pagtukoy sa anumang bagay sa saklaw ng prinsipyo.
- source_word: ἐκείνῳ κοινόν
  choice: marumi iyon para sa kanya
  rationale: Pinananatili ang personal na bisa ng dative nang malinaw at natural sa Filipino.
theological_decisions:
- issue: Kahulugan ng κοινός kaugnay ng pagkain at ritwal na kalinisan
  choice: marumi
  alternative: karaniwan; nadungisan
  rationale: Nililinaw ng konteksto na hindi likas na marumi ang bagay, ngunit itinuturing itong marumi ng isang tao. Ang ‘marumi’ ang pinakamalinaw na salin sa modernong Filipino, habang inilalagay sa talababa ang mas literal na alternatibo.
- issue: Ugnayang ipinahahayag ng ἐν κυρίῳ Ἰησοῦ
  choice: sa Panginoong Jesus
  alternative: mula sa Panginoong Jesus; sa pakikipag-isa sa Panginoong Jesus
  rationale: Hindi nilulutas nang higit sa teksto kung ang pananalig ay dahil sa awtoridad ng Panginoon, sa pakikipag-isa sa kanya, o kapwa; pinananatili ng ‘sa’ ang tunay na lawak ng parirala.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang ‘lubos akong naniniwala’ upang ihayag ang matatag na katiyakan ng πέπεισμαι, at ‘nagtuturing’ upang mapanatili ang diin sa paghatol ng budhi.
