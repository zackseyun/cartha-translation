  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: tl
  text: Ang kumakain ay huwag hamakin[a] ang hindi kumakain, at ang hindi kumakain ay huwag humatol[b] sa kumakain, sapagkat malugod siyang tinanggap ng Diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ituring na walang halaga” o “maliitin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “humusga” o “magpasiya laban sa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tinanggap” o “tinanggap upang makibahagi sa samahan.” Ipinahihiwatig ng pandiwa ang malugod na pagtanggap sa pakikisama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: ang kumakain
  rationale: Ang substantibong gamit ng kasalukuyang pandiwaring Griyego ay tumutukoy sa taong nakikilalang kumakain; natural at tuwiran ito sa Tagalog.
- source_word: τὸν μὴ ἐσθίοντα
  choice: ang hindi kumakain
  rationale: Pinananatili nito ang payak na paghahambing ng teksto at hindi ipinapasok sa talata ang mas tiyak na dahilan o uri ng pag-iwas sa pagkain.
- source_word: ἐξουθενείτω
  choice: huwag hamakin
  rationale: Ipinahahayag ng “hamakin” ang pagtingin sa isang tao bilang mababa o walang halaga at pinananatili ang lakas ng pagbabawal.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: at ang hindi kumakain
  rationale: Bagaman naghuhudyat ng paghahambing ang δέ, sapat na malinaw sa magkatapat na sugnay ang kontrast; natural sa Tagalog ang “at” sa ganitong magkatimbang na bilin.
- source_word: κρινέτω
  choice: huwag humatol
  rationale: Ang “humatol” ay malawak na katumbas ng κρίνω rito at hindi nito nililimitahan ang kahulugan sa tahasang paghatol na kaparusahan.
- source_word: γὰρ
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita na ang pagtanggap ng Diyos ang dahilan ng dalawang naunang pagbabawal.
- source_word: αὐτὸν
  choice: siya
  rationale: Pinananatili ng panghalip na isahan ang anyo at posibleng saklaw ng Griyego nang hindi tahasang nilulutas kung alin sa dalawang panig ang pangunahing tinutukoy.
- source_word: προσελάβετο
  choice: malugod na tinanggap
  rationale: Ipinahahayag nito hindi lamang ang pagtanggap bilang pasiya kundi ang mainit na pagtanggap sa pakikisama, na angkop sa gamit ng pandiwa sa Roma 14:1 at 15:7.
theological_decisions:
- issue: Saklaw ng paghahambing sa kumakain at hindi kumakain
  choice: Panatilihing pangkalahatan ang “kumakain” at “hindi kumakain.”
  alternative: Tukuying kumakain ng lahat ng uri ng pagkain at umiiwas sa ilang pagkain.
  rationale: Bagaman tungkol sa mga pagtatalo sa pagkain ang konteksto, hindi tinutukoy ng mismong talata kung anong pagkain o anong dahilan ng pag-iwas; hindi dapat idagdag iyon sa pangunahing teksto.
- issue: Tinutukoy ng αὐτὸν (“siya”)
  choice: Panatilihin ang panghalip na isahan nang hindi nilulutas ang tinutukoy.
  alternative: Tukuying tahasan na ang kumakain, o gawing “ang taong iyon” upang palawakin ang aplikasyon.
  rationale: Ang pinakamalapit na pinagmumulan ng panghalip ay ang kumakain, ngunit ang katwirang retorikal ay may bisa sa kapwa panig. Pinananatili ng “siya” ang tunay na tensiyon at saklaw ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatimbang na anyong “ang kumakain… ang hindi kumakain” upang mapanatili ang retorikal na paghaharap ng Griyego. Ang “malugod na tinanggap” ay natural sa karaniwang mambabasa at inilalantad ang relasyonal na diwa ng προσελάβετο nang hindi nagdaragdag ng denominasyonal na paliwanag.
