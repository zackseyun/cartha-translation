  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: tl
  text: Tanggapin ninyo ang mahina sa pananampalataya[a], ngunit hindi upang makipagtalo tungkol sa mga kuro-kuro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “malugod ninyong tanggapin.” Ang pandiwang Griyego ay maaaring mangahulugang tanggapin ang isang tao sa sariling samahan o pakikisama.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “hindi upang hatulan ang mga pangangatwiran” o “hindi upang makipagtalo tungkol sa mga pag-iisip.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: ang mahina
  rationale: Ang artikulong may kasamang kasalukuyang participle ay tumutukoy sa isang taong mahina; hindi idinagdag ang “budhi” sapagkat wala ito sa talata.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: Ipinahahayag ng datibo ang larangan o aspeto ng kahinaan. Ang “pananampalataya” ay likas at hindi ito labis na tinutukoy bilang isang kalipunan ng doktrina.
- source_word: προσλαμβάνεσθε
  choice: Tanggapin ninyo
  rationale: Inihahatid nito ang utos na tanggapin ang tao sa sariling samahan o pakikisama; ang pangmaramihang “ninyo” ay tumutugma sa pandiwa.
- source_word: μὴ εἰς
  choice: ngunit huwag upang
  rationale: Malinaw nitong ipinahahayag ang layuning dapat iwasan. Ginamit ang “ngunit” upang natural na maihatid ang kontrastibong ugnayan ng pagbabawal.
- source_word: διακρίσεις
  choice: pagtalunan
  rationale: Sa konteksto, tumutukoy ito sa mapagtalo o mapanghusgang pagsusuri, hindi lamang sa neutral na pagkilala ng mga pagkakaiba.
- source_word: διαλογισμῶν
  choice: mga kuro-kuro
  rationale: Pinananatili nito ang diwa ng mga pag-iisip, pangangatwiran, o opinyong pinagtatalunan nang hindi ito nililimitahan sa “mga pag-aalinlangan ng budhi.”
- source_word: δὲ
  choice: ngunit
  rationale: Ang δέ ay mahinang pang-ugnay at maaaring magpahiwatig ng transisyon o bahagyang kontrast. Sa natural na Tagalog, naipapakita ang ugnayan sa kasunod na pagbabawal sa pamamagitan ng “ngunit,” nang hindi nagdaragdag ng temporal na “ngayon.”
theological_decisions:
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang konteksto ay tungkol sa kahinaan ng isang mananampalataya kaugnay ng kaniyang mga paninindigan sa mga gawaing pinagtatalunan. Hindi sapat ang dahilan upang gawing “katapatan” o tahasang “budhi” ang salita.
- issue: Saklaw ng διακρίσεις διαλογισμῶν
  choice: huwag upang pagtalunan ang kaniyang mga kuro-kuro
  alternative: huwag upang hatulan ang mga pinagtatalunang pangangatwiran
  rationale: Malabo ang eksaktong ugnayan ng dalawang pangngalan sa Griyego. Pinili ang natural na pagbasa tungkol sa pagtatalo sa mga opinyon, habang inilalahad sa talababa ang mas literal at mapanghusgang posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “kuro-kuro” ay nauunawaan ng karaniwang mambabasa at pinananatili ang lawak ng διαλογισμῶν. Nakalagay ang mga pananda ng talababa sa mismong teksto.
