base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: tl
  text: Ang pananampalatayang taglay mo[a] ay panatilihin mo para sa iyong sarili sa harap ng Diyos. Pinagpala ang taong hindi humahatol sa sarili sa bagay na kanyang sinasang-ayunan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang paninindigang taglay mo.” Karaniwang isinasalin ang Griyegong πίστις bilang “pananampalataya,” ngunit dito maaari itong tumukoy sa personal na paninindigan tungkol sa mga bagay na pinagtatalunan.
    reason: lexical_alternative
  - marker: b
    text: O “hindi hinahatulan ang sarili sa bagay na kanyang sinasang-ayunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: pananampalataya
  rationale: Pinananatili ang karaniwang salin ng πίστις, habang ipinahihiwatig ng konteksto na tumutukoy ito sa personal na paninindigan tungkol sa mga pinagtatalunang gawain.
- source_word: κατὰ σεαυτὸν
  choice: sa iyong sarili
  rationale: 'Pinananatili ang hiwalay na diwa ng parirala: huwag ipilit sa iba ang sariling pananampalataya o paninindigan.'
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: sa harap ng Diyos
  rationale: Likas at pormal na salin na nagpapahayag ng personal na pananagutan sa presensya ng Diyos.
- source_word: μακάριος
  choice: Pinagpala
  rationale: Taglay nito ang moral at teolohikal na bigat ng salita, hindi lamang ang pansariling damdaming masaya.
- source_word: κρίνων ἑαυτὸν
  choice: humahatol sa sarili
  rationale: Malapit sa saklaw ng κρίνω at hindi agad nilulutas ang posibleng mas matinding diwang 'humahatol na nagkasala' o 'humahatol upang parusahan.'
- source_word: ἐν ᾧ δοκιμάζει
  choice: dahil sa kanyang sinasang-ayunan
  rationale: 'Ipinapahayag ang ugnayang instrumental o sanhi: ang mismong gawaing sinuri at sinang-ayunan niya ang nagiging batayan ng paghatol niya sa sarili.'
theological_decisions:
- issue: Kahulugan ng πίστις sa konteksto ng mga bagay na pinagtatalunan
  choice: pananampalataya na nauunawaan sa konteksto bilang personal na paninindigan sa harap ng Diyos
  alternative: paninindigan; pangkalahatang pagtitiwala sa Diyos; katapatan
  rationale: Ang agarang konteksto ay tungkol sa mga gawaing pinagtatalunan at sa budhi. Pinananatili ng pangunahing teksto ang mahalagang terminong 'pananampalataya,' ngunit inilalahad sa talababa ang kontekstuwal na kahulugang 'paninindigan.'
- issue: Lakas ng kahulugan ng κρίνων ἑαυτόν
  choice: humahatol sa sarili
  alternative: humahatol sa sariling nagkasala
  rationale: Ang mas malawak na 'humahatol' ay mas malapit sa anyong Griyego at pinananatili ang tunay na kalabuan kung paghatol lamang o paghatol na may diwang pagkondena ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'taglay' at 'sa harap ng Diyos' para sa dignidad at linaw; iniwasan ang labis na kolokyal o denominasyonal na pananalita.
