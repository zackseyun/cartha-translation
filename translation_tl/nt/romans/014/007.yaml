base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: tl
  text: Sapagkat walang sinuman sa atin ang nabubuhay para sa sarili[a], at walang sinuman ang namamatay para sa sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sarili.” Maaaring isalin nang mas literal sa ganitong paraan ang reflexive dative sa Griyego, ngunit malamang na tumutukoy rito sa pamumuhay o pagkamatay na ang sarili ang pangunahing layon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: walang sinuman
  rationale: Likas at marangal na paglalahad ng pangkalahatang pagtanggi sa dalawang magkatulad na sugnay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ἡμῶν
  choice: sa atin
  rationale: Tumpak na inilalahad ang partitive genitive sa pariralang “walang sinuman sa atin.”
- source_word: ἑαυτῷ
  choice: para sa sarili
  rationale: Ipinahihiwatig na ang sarili ang pinaglilingkuran o ginagawang pangunahing layon, ayon sa paghahambing sa Panginoon sa kasunod na talata, habang hindi dinaragdagan ang diwa ng Griyego.
- source_word: ζῇ
  choice: nabubuhay
  rationale: Karaniwang aspektong imperpektibo sa Filipino angkop sa pangkalahatang katotohanang ipinahahayag.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang tuwirang pag-uugnay at paralelismo ng dalawang sugnay.
- source_word: ἀποθνῄσκει
  choice: namamatay
  rationale: Likas na anyo sa Filipino para sa pangkalahatang pahayag at kapantay ng “nabubuhay.”
theological_decisions:
- issue: Diwa ng reflexive dative na ἑαυτῷ sa dalawang sugnay
  choice: para sa sarili
  alternative: sa sarili
  rationale: Sa konteksto, itinatapat ang pamumuhay at pagkamatay na nakatuon sa sarili sa pamumuhay at pagkamatay para sa Panginoon (tal. 8). Pinananatili ng “para sa sarili” ang diwang ito nang hindi nagdaragdag ng tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatimbang na ayos ng dalawang sugnay at iniwasan ang may-kasariang panghalip dahil likas na hindi ito kailangan sa Filipino.
