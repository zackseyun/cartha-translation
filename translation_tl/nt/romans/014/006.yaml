  to: Ang nangingilin ng araw[a] ay ginagawa ito para sa Panginoon. At ang kumakain ay kumakain para sa Panginoon, sapagkat nagpapasalamat siya sa Diyos; at ang hindi kumakain ay hindi kumakain para sa Panginoon, at nagpapasalamat siya sa Diyos.
