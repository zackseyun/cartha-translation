id: ROM.14.6
reference: Romans 14:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: tl
  text: Ang nangingilin ng araw[a] ay ginagawa ito para sa Panginoon. At ang kumakain ay kumakain para sa Panginoon, sapagkat nagpapasalamat siya sa Diyos; at ang hindi kumakain ay hindi kumakain para sa Panginoon, at nagpapasalamat siya sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbibigay-pansin sa araw” o “isinasaalang-alang ang araw.” Ang pandiwang Griyego ay maaaring mangahulugang itinutuon ang isip o nagbibigay ng natatanging pagpapahalaga sa isang bagay; sa kontekstong ito, malamang na tumutukoy ito sa pangingilin ng isang araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ (φρονέω)
  choice: nagpapahalaga / nagpapahalaga rito
  rationale: Ipinahahayag nito ang pagbibigay ng natatanging pansin o pagpapahalaga sa isang araw, hindi lamang ang pag-iisip tungkol dito. Pinananatili rin ng pag-uulit ang anyo at diin ng Griyego.
- source_word: τὴν ἡμέραν
  choice: sa araw
  rationale: Pinananatiling pangkalahatan ang tinutukoy na araw, gaya ng Griyego, nang hindi ito tiyak na kinikilalang Sabbath, kapistahan, o araw ng pag-aayuno.
- source_word: κυρίῳ
  choice: para sa Panginoon
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa kilos na nakatuon sa Panginoon o ginagawa alang-alang sa kanya.
- source_word: ὁ ἐσθίων / ἐσθίει
  choice: ang kumakain / kumakain
  rationale: Ang payak na pangkasalukuyang anyo ay angkop sa nakagawiang gawain at pinananatili ang tuwirang pag-uulit ng Griyego.
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: nagpapasalamat siya sa Diyos
  rationale: Malinaw at likas nitong ipinahahayag ang aktibong pasasalamat na iniuukol sa Diyos.
- source_word: ὁ μὴ ἐσθίων / οὐκ ἐσθίει
  choice: ang hindi kumakain / hindi kumakain
  rationale: Pinananatili nito ang eksaktong pagkakatulad sa 'ang kumakain' at hindi nagdaragdag ng di-tahasang dahilan o uri ng pag-iwas sa pagkain.
theological_decisions:
- issue: Kahulugan ng pagbibigay-halaga sa “araw”
  choice: Pangkalahatang pagtukoy sa natatanging pagpapahalaga o pangingilin sa araw na pinag-uusapan sa Roma 14
  alternative: Partikular na pagtukoy sa Sabbath, mga kapistahang Judio, o mga araw ng pag-aayuno
  rationale: Hindi tinukoy ni Pablo kung anong uri ng araw ito. Pinananatili ng salin ang lawak at tensiyon ng pananalita sa halip na magpasok ng makitid na interpretasyong pangkasaysayan o pangdenominasyon.
- issue: Tinutukoy ng κυρίῳ
  choice: Panginoon
  alternative: Diyos
  rationale: Pinananatili ang katawagang 'Panginoon,' na sa kontekstong Paulino ay likas na tumutukoy sa Panginoong Jesus, habang tahasang sinasabing ang pasasalamat ay iniuukol sa Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nagpapahalaga” upang mapanatili ang lawak ng φρονέω at maiwasang gawing mas tiyak kaysa sa orihinal ang uri ng pangingilin. Pinanatili ang paralelismo at pag-uulit ng Griyego.
