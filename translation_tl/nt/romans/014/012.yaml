  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: tl
  text: Kaya nga, bawat isa sa atin ay magbibigay-sulit tungkol sa kanyang sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hinggil sa kanyang sarili,” o, bilang idyoma, “para sa kanyang sarili.” Sa literal, ang Griyego ay “tungkol sa kanyang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Kaya nga
  rationale: Ipinahahayag nito ang kongklusyong hinango mula sa naunang pangangatuwiran at likas ang tunog sa makabagong Filipino.
- source_word: ἕκαστος ἡμῶν
  choice: bawat isa sa atin
  rationale: Malinaw na pinananatili ang paisa-isang saklaw ng ἕκαστος at ang partitive na diwa ng ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: tungkol sa kanyang sarili
  rationale: Tuwirang pinananatili ang karaniwang diwa ng περί na may genitive—‘tungkol sa’ o ‘hinggil sa’—at ang isahang reflexive na pagtukoy sa bawat tao.
- source_word: λόγον
  choice: sulit
  rationale: Sa idyomang λόγον δώσει, tumutukoy ito sa pagsasaad o pagbibigay ng pananagutan, hindi lamang sa isang ‘salita’ o paliwanag.
- source_word: δώσει
  choice: magbibigay
  rationale: Pinananatili ang future active na anyo ng δίδωμι at bumubuo, kasama ng ‘sulit,’ ng natural na idyomang Filipino na ‘magbibigay-sulit.’
theological_decisions:
- issue: Ang tinutukoy na pagbibigyan ng sulit ay wala sa napiling tekstong Griyego
  choice: Hindi idinagdag ang ‘sa Diyos’
  alternative: magbibigay-sulit sa Diyos
  rationale: Bagaman malinaw sa mas malawak na konteksto ang paghuhukom ng Diyos at may mga tekstuwal na anyong may tahasang τῷ θεῷ, wala ang pariralang iyon sa ibinigay na SBLGNT na teksto; hindi ito dapat tahimik na idagdag.
- issue: Isahang reflexive sa pahayag na para sa lahat
  choice: kanyang sarili
  alternative: kanilang sarili
  rationale: Paisa-isa at isahan ang ἕκαστος at ἑαυτοῦ. Ang ‘kanyang sarili’ ay nagpapanatili sa gramatikal na bilang nang hindi nililimitahan ang pahayag sa isang kasarian.
- issue: Saklaw ng περὶ ἑαυτοῦ
  choice: tungkol sa kanyang sarili
  alternative: para sa kanyang sarili
  rationale: Mas malapit ang ‘tungkol sa’ sa karaniwang kahulugan ng περί na may genitive. Inilalagay sa talababa ang posibleng idyomatikong ‘para sa kanyang sarili’ upang hindi alisin ang tunay na saklaw ng pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘magbibigay-sulit’ upang maipahayag ang idyomang may diwa ng pananagutan, habang iniwasang idagdag ang ‘sa Diyos,’ na wala sa ibinigay na pangunahing tekstong Griyego.
