id: ROM.14.18
reference: Romans 14:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: tl
  text: Sapagkat ang naglilingkod kay Cristo sa ganitong paraan ay kalugod-lugod sa Diyos at kinikilala ng mga tao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Sapagkat ang
  rationale: Ipinapahayag ang paliwanag na ugnayan ng γάρ sa naunang talata at pinananatili ang pangkalahatang pagtukoy sa taong gumagawa nito.
- source_word: ἐν τούτῳ
  choice: sa ganitong paraan
  rationale: Sa konteksto, malamang na tumutukoy ito sa paglilingkod ayon sa katuwiran, kapayapaan, at kagalakan na binanggit sa talata 17; natural itong ipinapahayag bilang paraan ng paglilingkod nang hindi nililimitahan sa iisang bagay.
- source_word: δουλεύων τῷ Χριστῷ
  choice: naglilingkod kay Cristo
  rationale: Ang δουλεύω ay nagsasaad ng paglilingkod bilang lingkod; ang karaniwang 'naglilingkod' ay malinaw at marangal sa modernong Tagalog.
- source_word: εὐάρεστος τῷ θεῷ
  choice: kalugod-lugod sa Diyos
  rationale: Tuwirang ipinapahayag ang pagiging katanggap-tanggap at nakalulugod sa Diyos.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: kinikilala ng mga tao
  rationale: Ang δόκιμος ay tumutukoy sa isang taong napatunayang karapat-dapat at may pagsang-ayon. Ang 'kinikilala' ay natural at hindi nagpapahiwatig na lahat ng tao ay kinakailangang sumang-ayon.
theological_decisions:
- issue: Saklaw ng ἐν τούτῳ
  choice: sa ganitong paraan
  alternative: sa bagay na ito
  rationale: Pinananatili ng pinili ang anaporikong pagtukoy at ang posibleng diwa ng paraan ng paglilingkod, nang hindi tahasang nilulutas kung alin lamang sa mga ideya sa talata 17 ang tinutukoy.
- issue: Diwa ng δόκιμος sa harap ng mga tao
  choice: kinikilala ng mga tao
  alternative: sinang-ayunan ng mga tao
  rationale: Iniiwasan ang labis na pahayag na ang lingkod ni Cristo ay laging sinasang-ayunan ng lahat; ang salita ay maaaring mangahulugang napatunayang karapat-dapat o iginagalang.
translation_notes:
  register: Modernong Filipino Tagalog na natural, maikli, at marangal. Ginamit ang 'Cristo' bilang pamilyar na transliterasyon ng Χριστός, at 'mga tao' bilang inklusibo at tumpak na katumbas ng ἀνθρώποις.
