  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: tl
  text: Sino ka para humatol sa alipin sa sambahayan ng iba?[a] Sa harap ng sarili niyang panginoon[b], siya ay nakatayo o bumabagsak. Ngunit patatayuin siya, sapagkat kaya siyang patayuin ng Panginoon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na οἰκέτης ay tumutukoy sa isang kasapi ng mga tauhan sa sambahayan at maaaring isaling “lingkod sa sambahayan” o “alipin sa sambahayan.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “sarili niyang amo.” Iisang salitang Griego, κύριος, ang ginamit dito at sa “Panginoon” sa huling sugnay.'
    reason: lexical_alternative
  - marker: c
    text: Maaaring unawain ang “Panginoon” bilang panginoon ng alipin sa loob ng paghahambing; mas malamang na tumutukoy ito sa Panginoon sa teolohikal na diwa, na may kapangyarihang panatilihing nakatayo ang mananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Sino ka para humatol
  rationale: Pinananatili nito ang tuwirang retorikal na pagsaway at natural itong pakinggan sa makabagong Tagalog.
- source_word: ἀλλότριον οἰκέτην
  choice: sa alipin sa sambahayan ng iba
  rationale: Tiyak na tumutukoy ang οἰκέτης sa isang alipin o lingkod na kabilang sa isang sambahayan. Pinananatili ng “alipin sa sambahayan” ang nakagapos na katayuang panlipunan nang hindi nagiging lipas o di-natural ang pananalita.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: Sa harap ng sarili niyang panginoon
  rationale: Ipinahahayag ng “sa harap” ang pananagutan ng alipin sa sarili niyang panginoon, habang pinananatili ng “panginoon” ang ugnayang leksikal sa huling κύριος.
- source_word: στήκει ἢ πίπτει
  choice: siya ay nakatayo o bumabagsak
  rationale: Pinananatili ang magkatapat na larawan ng pagtayo at pagbagsak, sa halip na ipaliwanag ito bilang pagsang-ayon o paghatol.
- source_word: σταθήσεται
  choice: patatayuin siya
  rationale: Sinasalamin ng anyong ito ang pasibong diwa at ang ipinahiwatig na kapangyarihang kumikilos upang manatili siyang nakatayo.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: sapagkat kaya siyang patayuin ng Panginoon
  rationale: Natural na ipinapahayag ang dahilan at kapangyarihan ng Panginoon, at inuulit ang salitang-ugat na “tayo” upang mapanatili ang ugnayan sa naunang mga pandiwa.
theological_decisions:
- issue: Ang tinutukoy ng ὁ κύριος sa huling sugnay
  choice: “ang Panginoon,” sa teolohikal na diwa
  alternative: ang panginoon ng alipin sa loob lamang ng paghahambing
  rationale: Mas malamang na lumilipat si Pablo mula sa larawan ng sambahayan tungo sa Panginoon na may kapangyarihang panatilihing nakatayo ang mananampalataya. Gayunman, hindi inaalis ng salin at talababa ang posibleng pagpapatuloy ng paghahambing.
- issue: Diwa ng pagtayo at pagbagsak
  choice: panatilihin ang metaporang “nakatayo o bumabagsak”
  alternative: ipaliwanag bilang tinatanggap o hinahatulan
  rationale: Hindi tahasang nililinaw ng talata kung ang larawan ay tumutukoy sa pag-apruba, katatagan, o paghatol; kaya hindi ito tahimik na nilulutas sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “humatol” sa halip na karaniwang “husgahan” upang maging dignified ngunit madaling maunawaan. Pinanatili ang pag-uulit ng larawang “nakatayo/patatayuin/patayuin” at ang leksikal na ugnayan ng “panginoon/Panginoon.”
