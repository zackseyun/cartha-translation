  terminology: Ang “tumuturing” ay angkop para sa κρίνει sa kontekstong ito. Ang “higit kaysa” ay nagpapanatili ng comparative force ng παρ’ ἡμέραν nang hindi nagdadagdag ng Sabbath, kapistahan, o iba pang partikular na araw. Ang “lubos na nakatitiyak” ay malinaw na katumbas ng ganap na kapanatagan/paniniwala at hindi nagpapahiwatig na ang nilalaman ng paniniwala ay awtomatikong obhetibong tama.
