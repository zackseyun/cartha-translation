base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: tl
  text: May taong tumuturing sa isang araw na higit kaysa sa ibang araw[a], samantalang may ibang taong tumuturing na magkakapantay ang lahat ng araw[b]. Maging lubos na nakatitiyak ang bawat isa sa sarili niyang isip[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumuturing na nakahihigit ang isang araw kaysa sa ibang araw.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat araw”; ipinahihiwatig ng paghahambing na itinuturing niyang magkakapantay ang lahat ng araw.
    reason: lexical_alternative
  - marker: c
    text: O “lubos na makumbinsi” o “lubos na mapanatag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: itinuturing
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagsusuri o pagpapahalaga na nagtatangi sa mga araw, hindi sa paghatol na may pagkondena. Natural sa modernong Tagalog ang “itinuturing” at pinananatili nito ang evaluative na diwa.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: mas mahalaga ang isang araw kaysa sa ibang araw
  rationale: Ipinahahayag ng παρά ang paghahambing o pagtatangi sa pagitan ng mga araw. Nililinaw ng “mas mahalaga” ang ipinahihiwatig na pagtatangi nang hindi tinutukoy kung Sabbath, kapistahan, o araw ng pag-aayuno ang nasa isip.
- source_word: πᾶσαν ἡμέραν
  choice: magkakapantay ang lahat ng araw
  rationale: Literal itong “bawat araw,” ngunit ipinahihiwatig ng pagsalungat sa unang sugnay na walang itinatanging araw ang ikalawang tao. Ang “magkakapantay” ay natural na paglalahad ng implikasyong iyon.
- source_word: ἕκαστος
  choice: ang bawat isa
  rationale: Pinananatili nito ang isahan at distributibong diin ng Griyego at likas itong tumutukoy sa bawat taong kabilang sa usapan.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: sa sarili niyang isip
  rationale: Tuwirang inilalarawan nito ang sariling pag-iisip o pag-unawa ng bawat isa. Ang “niyang” ay natural na singular na anyo sa Tagalog at hindi nagtatakda ng kasarian.
- source_word: πληροφορείσθω
  choice: lubos na makumbinsi
  rationale: Ipinahahayag nito ang matatag at ganap na katiyakan na hinihingi ng present passive imperative. Posible rin ang “lubos na matiyak” o “lubos na mapanatag,” kaya inilalahad ang mga iyon sa talababa.
theological_decisions:
- issue: Kung anong uri ng mga araw ang tinutukoy
  choice: Panatilihing pangkalahatan ang “araw.”
  alternative: Tukuyin ang mga ito bilang Sabbath, mga kapistahang Judio, mga araw ng pag-aayuno, o natatanging araw ng debosyon.
  rationale: Hindi tahasang sinasabi ni Pablo kung anong mga araw ang tinutukoy. Hindi dapat lutasin ng salin ang interpretasyong sadyang nananatiling bukas sa talata.
- issue: Kung literal o ipinahiwatig na kahulugan ang gagamitin sa πᾶσαν ἡμέραν
  choice: “magkakapantay ang lahat ng araw” sa teksto, na may literal na anyo sa talababa
  alternative: “bawat araw” lamang
  rationale: Hinihingi ng contrastive structure ang diwang walang araw na itinatangi, ngunit mahalagang ipaalam na walang hiwalay na salitang Griyego para sa “magkakapantay.”
- issue: Lakas ng πληροφορείσθω
  choice: “lubos na makumbinsi”
  alternative: “lubos na matiyak” o “lubos na mapanatag”
  rationale: Pinananatili ng napiling anyo ang ideya ng ganap at matatag na personal na paniniwala nang hindi ipinahihiwatig na ang bawat pasiya ay obhetibong tama.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “itinuturing” sa halip na “hinahatulan” upang maiwasan ang di-inaasahang diwa ng pagkondena. Hindi tinukoy ang uri ng mga araw. Ang “sa sarili niyang isip” ay natural at inklusibo sa Tagalog habang pinananatili ang isahang diin.
