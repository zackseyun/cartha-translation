id: ROM.14.15
reference: Romans 14:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: tl
  text: Sapagkat kung nalulungkot ang kapatid mo dahil sa pagkain[a], hindi ka na namumuhay ayon sa pag-ibig. Huwag mong ipahamak dahil sa pagkain mo ang taong iyon—ang taong para sa kaniya ay namatay ang Mesiyas.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego para sa “kapatid” ay panlalaking isahan, ngunit maaari itong gamitin para sa isang kapwa mananampalataya, lalaki man o babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “ipahamak” ay maaari ding isaling “sirain” o “maging sanhi ng kapahamakan.” Malakas ang pandiwang Griyego, ngunit hindi tinutukoy ng talata ang eksaktong uri o pangwakas na bunga ng kapahamakan.
    reason: alternative_reading
  - marker: c
    text: 'Griyego: “namatay ang Mesiyas para sa kaniya.”'
    reason: literal_rendering
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: pagkain / sa pamamagitan ng pagkain mo
  rationale: Tumutukoy ito sa pagkain sa pangkalahatan, hindi lamang sa karne. Ipinahahayag ng pariralang instrumental ang pagkain bilang paraan o sanhi ng kapahamakan.
- source_word: ἀδελφός
  choice: kapatid
  rationale: Ang “kapatid” ay natural sa Filipino at maaari ring tumukoy sa kapwa mananampalataya nang hindi kinakailangang tukuyin ang kasarian, bagaman panlalaking isahan ang anyong Griyego.
- source_word: λυπεῖται
  choice: nalulungkot
  rationale: Pinananatili nito ang diwa ng pagdanas ng lungkot o pighati nang hindi dinaragdagan ang tiyak na uri ng pinsala.
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: namumuhay ayon sa pag-ibig
  rationale: Ang literal na metaporang “lumalakad” ay hindi kasing-natural sa Filipino sa ganitong etikal na gamit; malinaw na naihahatid ng “namumuhay” ang asal o paraan ng pamumuhay, habang pinananatili ng “ayon sa” ang κατὰ.
- source_word: ἀπόλλυε
  choice: huwag mong ipahamak
  rationale: Malakas ang “ipahamak” at maaaring tumukoy sa matinding pagkasira o pagkapahamak, ngunit hindi nito sapilitang nilulutas kung pansamantala o pangwakas na espirituwal na kapahamakan ang tinutukoy.
- source_word: ἐκεῖνον
  choice: ang taong iyon
  rationale: Pinananatili nito ang mariing pagtukoy ng demonstratibo sa partikular na taong apektado.
- source_word: ὑπὲρ οὗ
  choice: siya na pinag-alayan ng buhay
  rationale: Likas sa Filipino ang pariralang ito at ipinahahayag ang kapakinabangan at mapag-alay na diwa ng ὑπέρ sa konteksto ng kamatayan ng Mesiyas.
- source_word: Χριστός
  choice: Mesiyas
  rationale: Gumaganap bilang titulo ang Χριστός; ang “Mesiyas” ang malinaw na katumbas sa modernong Filipino.
- source_word: ἀπέθανεν
  choice: pinag-alayan ng buhay
  rationale: Idyomatikong ipinahahayag nito na namatay ang Mesiyas para sa taong iyon, habang iniiwasan ang alanganing “namatay para sa kaniya.”
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ang ugnayang nagpapaliwanag ng γάρ at ang kondisyunal na anyo ng εἰ.
theological_decisions:
- issue: Lakas at saklaw ng ἀπόλλυε
  choice: ipahamak
  alternative: sirain; dulutan ng pagkapahamak
  rationale: Pinananatili ang bigat ng babala nang hindi tinutukoy kung ang resulta ay pansamantalang espirituwal na pagkasira o pangwakas na kapahamakan.
- issue: Saklaw ng ἀδελφός
  choice: kapatid
  alternative: kapatid na lalaki; kapwa mananampalataya
  rationale: Natural at karaniwan sa Filipino ang “kapatid” para sa isang miyembro ng sambayanan ng pananampalataya; ipinapaliwanag sa talababa ang panlalaking anyong Griyego at posibleng kinatawang gamit.
- issue: Pagsasalin ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Titulo ang gamit dito, kaya isinasalin ang kahulugan sa halip na gumamit lamang ng tradisyonal na transliterasyon.
- issue: Diwa ng ὑπὲρ οὗ Χριστὸς ἀπέθανεν
  choice: siya na pinag-alayan ng buhay ng Mesiyas
  alternative: siya na dahilan kung bakit namatay ang Mesiyas; siya na para sa kaniya ay namatay ang Mesiyas
  rationale: Ipinahahayag ang mapag-alay na kamatayan para sa kapakinabangan ng taong iyon nang hindi nagdaragdag ng isang partikular na teorya ng pagtubos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “namumuhay” para sa etikal na metapora ng paglakad, “ipahamak” upang mapanatili ang bigat at ambiguwidad ng ἀπόλλυμι, at “Mesiyas” bilang salin ng titulong Χριστός. Lahat ng marker na [a], [b], at [c] ay nasa pangunahing teksto.
