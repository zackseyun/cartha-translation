  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: tl
  text: Ang isa ay naniniwalang maaari siyang kumain ng anumang pagkain,[a] ngunit ang mahina ay kumakain ng gulay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kumbinsido siyang maaari niyang kainin ang lahat ng bagay.”
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “mahina” ay tumutukoy sa taong mahina ang pananampalataya o budhi tungkol sa mga kaugalian sa pagkain. Tingnan ang Roma 14:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: May isang
  rationale: Likas na ipinakikilala nito sa Tagalog ang unang panig ng paghahambing nang hindi ipinapalagay na lalaki ang tinutukoy.
- source_word: πιστεύει
  choice: naniniwalang
  rationale: Ipinapahayag dito ng πιστεύει ang personal na paniniwala o katiyakan tungkol sa pagkain, hindi tahasang ang pananampalatayang nagliligtas.
- source_word: φαγεῖν πάντα
  choice: maaari siyang kumain ng anumang pagkain
  rationale: Malinaw at likas itong nagpapahayag ng paniniwalang walang ipinagbabawal na uri ng pagkain. Ang “maaari” ay naghahayag ng pahintulot na ipinahihiwatig ng konteksto.
- source_word: ὁ δὲ
  choice: ngunit
  rationale: Malinaw na minamarkahan nito ang ikalawang panig ng paghahambing sa natural na Tagalog.
- source_word: ἀσθενῶν
  choice: ang mahina
  rationale: Pinananatili nito ang payak at substantibong paglalarawan ng Griyego nang hindi idinaragdag sa pangunahing teksto kung sa anong diwa mahina ang tao.
- source_word: λάχανα
  choice: gulay
  rationale: Ito ang malinaw at karaniwang makabagong katumbas ng mga halamang kinakain o produktong mula sa hardin.
- source_word: ἐσθίει
  choice: ang kinakain
  rationale: Inililipat sa natural na ayos ng Tagalog ang simpleng pahayag tungkol sa kinakain ng mahina. Hindi idinagdag ang “lamang” sapagkat hindi ito tahasang nasa Griyego.
theological_decisions:
- issue: Ang uri ng kahinaang tinutukoy ng ἀσθενῶν
  choice: “ang mahina,” nang walang dagdag na “sa pananampalataya” sa pangunahing teksto
  alternative: “ang mahina sa pananampalataya”
  rationale: Nililinaw ng Roma 14:1 ang konteksto ng kahinaan, ngunit sa talatang ito ay “ang mahina” lamang ang tahasang sinabi. Pinananatili ng salin ang anyo at tensiyon ng teksto habang inilalagay sa talababa ang paliwanag mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anumang pagkain” upang maging natural ang πάντα sa konteksto, at pinanatiling maikli ang “ang mahina” upang hindi labis na ipaliwanag ang pangunahing teksto.
