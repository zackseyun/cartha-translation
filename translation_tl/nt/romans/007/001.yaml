  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing daloy at mga sangkap ng Griyego: ang argumentatibong “O,” retorikal na tanong, pagtawag na “mga kapatid,” parentetikong paliwanag para sa nakaaalam ng kautusan, generic na “isang tao,” at hangganang temporal na nakatali sa buhay ng tao. Gayunman, ang “naghahari sa” ay masyadong personipikado at hindi gaanong likas kapag ang paksa ay “kautusan.” Ang “may kapangyarihan sa” ay tuwirang naghahatid ng κυριεύει bilang pag-iral ng awtoridad o paghahari sa isang tao.'
  naturalness: Marangal at malinaw ang rehistro. Mas natural sa modernong Filipino ang “may kapangyarihan sa isang tao” kaysa “naghahari sa isang tao” para sa isang kautusan. Ang “hangga’t siya’y nabubuhay” ay mas idiomatiko rin kaysa “habang siya ay nabubuhay,” nang hindi binabago ang saklaw na “for as long as.”
  terminology: Ang “kautusan” ay angkop para sa νόμος at pinananatili ang sinadyang hindi pa ganap na pagtukoy kung Kautusan ni Moises lamang o mas malawak na prinsipyo ng batas ang tinutukoy. Ang “mga kapatid” ay likas na inklusibo sa Tagalog; ang talababa ay angkop na paglilinaw sa anyong panlalaking maramihan ng Griyego.
  issues:
