id: ROM.7.1
reference: Romans 7:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: tl
  text: O hindi ba ninyo alam, mga kapatid[a]—sapagkat nagsasalita ako sa mga nakaaalam ng kautusan—na ang kautusan ay may kapangyarihan sa isang tao hangga’t siya’y nabubuhay?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong adelphoi ay anyong panlalaking maramihan; sa kontekstong ito, malamang na kabilang dito ang mga babae sa mga kausap ni Pablo.
    reason: cultural_note
  - marker: b
    text: O “naghahari sa isang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: O
  rationale: Pinananatili ang argumentatibong paglipat mula sa naunang talakayan.
- source_word: ἀγνοεῖτε
  choice: hindi ba ninyo alam
  rationale: Natural na retorikal na tanong sa Tagalog na umaapela sa kaalamang mayroon na ang mga kausap.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay natural, marangal, at maaaring tumukoy sa kapwa lalaki at babae sa kongregasyon, habang nananatiling malapit sa pampamilyang tawag ng Griyego.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: sapagkat nagsasalita ako sa mga nakaaalam ng kautusan
  rationale: Pinananatili ang paliwanag na ipinapasok ng γάρ at ang pagtukoy sa mga taong may kaalaman sa kautusan.
- source_word: νόμον / ὁ νόμος
  choice: kautusan / ang kautusan
  rationale: Hindi nililimitahan ang νόμος sa isang tahasang pakahulugan; pinananatili ang lawak ng Griyego habang ang konteksto ay maaaring tumukoy lalo na sa Kautusan ni Moises.
- source_word: κυριεύει
  choice: naghahari sa
  rationale: Ipinahahayag ang pamumuno o kapangyarihan ng pandiwa nang malinaw at hindi nilalabnaw ang larawan ng paghahari.
- source_word: τοῦ ἀνθρώπου
  choice: isang tao
  rationale: Generic ang ἄνθρωπος dito, kaya hindi ito nililimitahan sa isang lalaking tao.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: habang siya ay nabubuhay
  rationale: 'Natural na Tagalog na nagpapanatili sa temporal na diwa: sa buong panahong buhay ang tao.'
theological_decisions:
- issue: Saklaw ng νόμος sa pahayag ni Pablo
  choice: Isinaling “kautusan” nang hindi tahasang nililimitahan sa Kautusan ni Moises.
  alternative: “Kautusan ni Moises” o “batas” bilang pangkalahatang legal na simulain
  rationale: Hindi ganap na tinutukoy ng mismong pangungusap ang saklaw. Mahalaga ang Kautusan ni Moises sa kasunod na argumento, ngunit sapat ang lawak ng Griyego upang hindi ito paliitin sa salin.
- issue: Lakas ng κυριεύει
  choice: “naghahari sa”
  alternative: “may kapangyarihan sa”
  rationale: Ang κυριεύει ay maaaring magpahiwatig ng pamumuno o paghahari, hindi lamang abstraktong awtoridad. Inilalagay sa talababa ang mas neutral na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nakaaalam” at “kautusan” para sa pormal ngunit hindi lipas na rehistro; pinanatili ang gitling na panaklong upang malinaw ang paliwanag ni Pablo.
