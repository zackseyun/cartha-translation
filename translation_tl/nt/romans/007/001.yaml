revisions:
- from: O hindi ba ninyo alam, mga kapatid[a]—sapagkat nagsasalita ako sa mga nakaaalam ng kautusan—na ang kautusan ay naghahari sa isang tao habang siya ay nabubuhay?[b]
  to: O hindi ba ninyo alam, mga kapatid[a]—sapagkat nagsasalita ako sa mga nakaaalam ng kautusan—na ang kautusan ay may kapangyarihan sa isang tao hangga’t siya’y nabubuhay?[b]
  rationale: Pinalitan ang pangunahing salin ng κυριεύει ng mas natural na modernong Filipino na “may kapangyarihan sa,” at inilipat ang mas literal na larawang “naghahari sa” sa talababa. Pinakinis din ang pangwakas na panahong parirala bilang “hangga’t siya’y nabubuhay.” Walang paglilinaw na idinagdag hinggil sa eksaktong saklaw ng “kautusan.”
