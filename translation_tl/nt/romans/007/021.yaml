  source_fidelity: 'Tapat ang salin sa pangunahing daloy ng Griyego: ang inferensiyal na ἄρα ay “Kaya,” ang νόμον ay nananatiling “kautusan,” ang pagnanais na gawin ang mabuti ay malinaw na naipahayag, at ang παράκειται ay wastong inilalarawan bilang ang masama na nasa malapit sa nagsasalita. Hindi nito pinipilit na ang νόμος ay ang Kautusan ni Moises lamang o isang prinsipyo lamang.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang “naririyan malapit sa akin” ay bahagyang mas tahasan kaysa sa karaniwang idyoma ngunit angkop sa marangal na rehistro at mahusay na pinananatili ang imaheng spatial ng παράκειται.
