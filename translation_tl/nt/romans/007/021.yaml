  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: tl
  text: 'Kaya natutuklasan ko ang kautusang ito[a]: kapag nais kong gawin ang mabuti, naririyan malapit sa akin ang masama.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “prinsipyo” o “tuntunin.”
    reason: Ipinapakita ang posibleng kontekstuwal na kahulugan ng νόμος nang hindi inaalis ang “kautusan” sa pangunahing teksto.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: natutuklasan ko
  rationale: Ipinahahayag ng pangkasalukuyang anyo ang patuloy na pagkilala o pagkatanto; likas ito sa modernong Tagalog.
- source_word: ἄρα
  choice: Kaya
  rationale: Ipinakikita nito ang paghinuha mula sa naunang pangangatwiran.
- source_word: τὸν νόμον
  choice: ang kautusang ito
  rationale: Pinananatili ng “kautusan” ang tuwirang diwa at teolohikal na alingawngaw ng νόμος, sa halip na agad itong ipakahulugang isang prinsipyo lamang.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: kapag nais kong gawin ang mabuti
  rationale: Malinaw at likas na Tagalog ito para sa mahirap na konstruksiyong datibo, habang pinananatili ang diwa ng pagnanais at paggawa.
- source_word: τὸ καλὸν
  choice: ang mabuti
  rationale: Natural na substantibong gamit sa Tagalog at malapit sa “the good” ng Griyego.
- source_word: τὸ κακὸν
  choice: ang masama
  rationale: Pinananatili ang substantibong kaibahan sa “ang mabuti.”
- source_word: παράκειται
  choice: naririyan malapit sa akin
  rationale: Ipinahahayag ang diwa ng isang bagay na nasa tabi o laging handang matagpuan, nang hindi dinaragdagan ng personipikasyong wala sa pandiwa.
theological_decisions:
- issue: Kung ang νόμον ay tumutukoy sa Kautusan ni Moises o sa isang namamahalang prinsipyo o padron
  choice: “kautusan” sa pangunahing teksto
  alternative: “prinsipyo” o “tuntunin”
  rationale: Pinananatili ng “kautusan” ang mismong salita at sadyang tensiyon ng pahayag ni Pablo. Inilalagay sa talababa ang mga posibleng kontekstuwal na kahulugan upang hindi agad lutasin ang usaping interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “naririyan malapit sa akin” upang mapanatili ang larawang nasa malapit ang masama, nang hindi ito gawing sobrang idyomatiko o mas mapersona kaysa sa Griyego.
