  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: tl
  text: Sapagkat alam kong walang mabuting nananahan sa akin—ibig kong sabihin, sa aking laman.[a] Naririto sa akin ang pagnanais, ngunit wala sa akin ang paggawa ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa aking makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: alam ko
  rationale: Ang anyong perpekto ay may pangkasalukuyang diwa; ang “alam ko” ang natural at tuwirang katumbas sa Filipino.
- source_word: οἰκεῖ
  choice: nananahan
  rationale: Pinananatili nito ang larawan ng paninirahan sa loob, sa halip na gawing mas payak na “nabubuhay” o mas teknikal na “nakatira.”
- source_word: ἀγαθόν
  choice: walang mabuti
  rationale: Ang οὐκ at ang substantibong ἀγαθόν ay likas na ipinahahayag sa Filipino bilang “walang mabuti.”
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ng literal na “laman” ang salita at teolohikal na tensiyon ni Pablo nang hindi agad ipinapakahulugang “makasalanang kalikasan.”
- source_word: θέλειν
  choice: ang pagnanais
  rationale: Ipinahahayag nito bilang pangngalan ang articular infinitive at malinaw itong nauunawaan sa modernong Filipino.
- source_word: παράκειταί μοι
  choice: naririto sa akin
  rationale: Ipinahahayag nito ang pagiging malapit o handang naroon ng pagnanais, habang pinananatili ang personal na μοι.
- source_word: κατεργάζεσθαι
  choice: ang paggawa
  rationale: Pinananatili nito ang substantibong anyo at ang retorikal na pagtutumbas ng pagnanais at paggawa.
- source_word: τὸ καλόν
  choice: ng mabuti
  rationale: Natural na Filipino ito para sa substantibong “the good” at pinananatili ang moral na kategorya.
- source_word: οὔ
  choice: hindi
  rationale: Ang pangwakas na negatibo ay eliptikal; ang “hindi” ay maikli at likas, at ang nawawalang ideya ng pagiging naririto ay nauunawaan mula sa unang sugnay.
theological_decisions:
- issue: Pagpapakahulugan sa σάρξ sa kontekstong moral ni Pablo
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Ang “laman” ay hindi tahasang nagpapasya kung katawan lamang o makasalanang kalagayan ang tinutukoy; hinahayaan nitong manatili ang sariling paglilinaw at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ibig kong sabihin” upang natural na maipahayag ang τοῦτ’ ἔστιν, at pinanatili ang “laman” bilang pangunahing salin na may alternatibo sa talababa.
