  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: tl
  text: Ngunit kung ginagawa ko ang ayaw kong gawin, hindi na ako ang gumagawa nito, kundi ang kasalanang nananahan sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit kung
  rationale: Ipinagpapatuloy nito ang kondisyunal na pangangatwiran ni Pablo habang pinananatili ang banayad na pagsalungat ng δέ.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: ginagawa ko ang ayaw kong gawin
  rationale: 'Likas sa makabagong Tagalog at tapat sa diwa ng kayariang relative-correlative: ang mismong kilos na hindi niya nais ang ginagawa niya.'
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: hindi na ako ang gumagawa nito
  rationale: Pinananatili ng “hindi na” ang puwersa ng οὐκέτι at ng “ako ang” ang diin sa tahasang ἐγώ. Ang “gumagawa” ay malinaw at natural para sa κατεργάζομαι sa kontekstong ito.
- source_word: ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: kundi ang kasalanang nananahan sa akin
  rationale: Tuwirang isinasalin ang ἁμαρτία bilang “kasalanan,” hindi “makasalanang kalikasan,” at pinananatili ng “nananahan” ang personipikasyon at participial na diwa ng οἰκοῦσα.
theological_decisions:
- issue: Kung ang pahayag ay dapat ipaliwanag upang bawasan ang personal na pananagutan o gawing abstraksiyon lamang ang kasalanan
  choice: Pinanatili ang tuwirang retorikal na pagkakaiba sa pagitan ng “ako” at ng “kasalanang nananahan sa akin.”
  alternative: Ipaliwanag sa paraphrase ang teolohiya ng nananahang kasalanan, o isalin ang ἁμαρτία bilang “makasalanang kalikasan.”
  rationale: Kasalanan mismo ang tahasang pinangalanan ng Griyego. Dapat panatilihin ng salin ang teolohikal na tensiyon at huwag pasiyahan ang pinagtatalunang implikasyon tungkol sa pagkakakilanlan at pananagutan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “nananahan” upang mapanatili ang matatag at bahagyang pormal na larawan ng kasalanang nasa loob, nang hindi nagiging lipas o teknikal.
