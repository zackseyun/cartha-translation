  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: tl
  text: Sapagkat noong tayo ay nasa laman[a], ang makasalanang mga pagnanasa[b] na sa pamamagitan ng Kautusan ay nagiging aktibo sa mga bahagi ng ating katawan[c] ay nagbubunga para sa kamatayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “namumuhay ayon sa laman.” Ang “laman” ay tumutukoy sa dati at makasalanang kalagayan ng tao.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “mga pagnanasa ng mga kasalanan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga bahagi ng ating katawan” ay tumutukoy sa mga bahagi o kakayahan ng katawan bilang mga kasangkapan ng pagkilos.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: namumuhay ... ayon sa laman
  rationale: Ipinahahayag ang idyomatikong diwa ng kalagayan o pamumuhay sa saklaw ng σάρξ, habang pinananatili ang salitang “laman” at ang tensiyong teolohikal nito.
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: ang makasalanang mga pagnanasa
  rationale: Sa konteksto, ang παθήματα ay mga pagnanasang nag-uudyok, hindi mga pagdurusa; ginawang panuring ang genitibong τῶν ἁμαρτιῶν upang maging natural sa Tagalog nang hindi ipinapalagay na hiwa-hiwalay na kasalanan ang tinutukoy.
- source_word: τὰ διὰ τοῦ νόμου
  choice: na dumating sa pamamagitan ng Kautusan
  rationale: Pinananatili ang ugnayang ipinahahayag ng διά nang hindi tahasang idinaragdag ang mas interpretibong “pinukaw”; ang “dumating” ay nagpapalinaw sa likas na eliptikong Griyego.
- source_word: ἐνηργεῖτο
  choice: ay kumikilos
  rationale: Ipinakikita ng aspektong imperpekto ang nagpapatuloy na pagkilos noon; sa Tagalog, sapat ang konteksto ng “noong ... pa” upang ilugar ito sa nakaraan.
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: sa mga bahagi ng ating katawan
  rationale: Mas malinaw sa karaniwang mambabasa kaysa literal na “mga sangkap natin,” at pinananatili ang diwa ng mga bahagi o kakayahan ng katawan bilang mga kasangkapan ng pagkilos.
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: upang magbunga para sa kamatayan
  rationale: Pinananatili ang metapora ng pamumunga at ang matinding direksiyon o resultang nakaugnay sa kamatayan.
theological_decisions:
- issue: Kung bibigyang-kahulugan ang ἐν τῇ σαρκί bilang “nasa makasalanang kalikasan” o pananatilihin ang “laman”
  choice: namumuhay ... ayon sa laman
  alternative: nasa ilalim tayo ng makasalanang kalikasan
  rationale: Pinananatili ng pangunahing teksto ang “laman,” ngunit nililinaw na isang kalagayan o paraan ng pamumuhay ang tinutukoy. Hindi nito ikinukulong ang antropolohiya ni Pablo sa iisang doktrinal na pormula.
- issue: Kung ang διὰ τοῦ νόμου ay nangangahulugang tahasang “pinukaw ng Kautusan”
  choice: dumating sa pamamagitan ng Kautusan
  alternative: pinukaw ng Kautusan
  rationale: Ang “pinukaw” ay maaaring suportahan ng mas malawak na konteksto, ngunit mas interpretibo kaysa sa mismong parirala; pinananatili ng napiling salin ang tunay na lawak ng ugnayang maaaring instrumental o causal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” para sa νόμος sa kontekstong tumutukoy sa Kautusan ni Moises. Iniwasan ang literal ngunit malabong “mga sangkap” at pinanatili ang mga metaporang “laman” at “magbunga.”
