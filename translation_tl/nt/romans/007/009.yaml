  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: tl
  text: Noong una, buhay ako nang hiwalay sa Kautusan; ngunit nang dumating ang utos, muling nabuhay[a] ang kasalanan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabuhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔζων
  choice: nabubuhay ako
  rationale: Pinananatili ang diwang 'buhay' upang maipakita ang kaibahan ng buhay at kamatayan sa konteksto, sa halip na ang payak na 'namumuhay.'
- source_word: χωρὶς νόμου
  choice: nang hiwalay sa Kautusan
  rationale: Ipinapahayag ang separative force ng χωρίς; ginamit ang 'Kautusan' bilang likas na pantukoy sa batas ni Moises sa kontekstong Paulino.
- source_word: ποτέ
  choice: Noong una
  rationale: Natural at malinaw na panandang temporal para sa dating kalagayang tinutukoy ni Pablo.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: nang dumating ang utos
  rationale: Likas na isinasalin sa sugnay na temporal ang genitive absolute habang pinananatili ang pagdating bilang pangyayari.
- source_word: ἐντολῆς
  choice: ang utos
  rationale: Malinaw at natural sa modernong Filipino, at nananatiling naiiba ngunit kaugnay ng 'Kautusan.'
- source_word: ἁμαρτία
  choice: ang kasalanan
  rationale: Pinananatili ang isahan at personipikadong gamit ni Pablo.
- source_word: ἀνέζησεν
  choice: muling nabuhay
  rationale: Tuwirang pinananatili ang ἀνά- na maaaring magpahiwatig ng muling pagkabuhay o panunumbalik sa buhay, at ang personipikasyon ng kasalanan.
theological_decisions:
- issue: Kung ang unang panauhan ay tahasang autobiograpiko, kumakatawan sa Israel o sangkatauhan, o salvation-historical
  choice: Pinanatili ang payak na unang panauhan nang walang interpretibong dagdag.
  alternative: Tahasang tukuyin ito bilang personal na karanasan ni Pablo o bilang representatibong pananalita para sa Israel o sangkatauhan.
  rationale: Hindi nilulutas ng Griyego sa talatang ito lamang ang mas malawak na tanong, kaya pinananatili ng salin ang tunay na interpretibong tensiyon.
- issue: Kung ang ἀνέζησεν ay nangangahulugang 'muling nabuhay' o mas pangkalahatang 'nabuhay'
  choice: muling nabuhay
  alternative: nabuhay / naging buhay
  rationale: May likas na puwang ang anyong Griyego para sa diwang 'revived,' ngunit maaaring unawain din bilang pagdating sa buhay; inilalagay sa talababa ang alternatibo upang huwag ikubli ang leksikal na saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang malaking titik sa “Kautusan” upang malinaw na ipahiwatig ang Kautusan ni Moises sa konteksto, habang ang “utos” ay pinanatiling karaniwang pangngalan. Ang bantas sa hulihan ay kuwit upang tumugma sa nagpapatuloy na pangungusap sa kasunod na talata.
