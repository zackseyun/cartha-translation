  text: συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: tl
  text: Sapagkat nalulugod ako sa kautusan ng Diyos ayon sa aking panloob na pagkatao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ayon sa panloob na tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: nalulugod ako sa
  rationale: Ipinahahayag ng pandiwa ang masayang pagsang-ayon at kagalakan, hindi lamang intelektuwal na pagsang-ayon.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: sa kautusan ng Diyos
  rationale: Pinananatili ng “kautusan” ang karaniwang diwang Paulino ng νόμος at ang tuwirang ugnayang genitibo ng τοῦ θεοῦ.
- source_word: κατὰ
  choice: ayon sa
  rationale: Mas malapit itong kumakatawan sa pananaw o batayan na ipinahihiwatig ng κατά kaysa sa simpleng lokatibong “sa loob.”
- source_word: τὸν ἔσω ἄνθρωπον
  choice: aking panloob na pagkatao
  rationale: Natural ito sa makabagong Tagalog at tumutukoy sa panloob na sarili nang hindi ipinapalagay ang isang teknikal na doktrina tungkol sa pagkakabuo ng tao. Ang “aking” ay ipinahihiwatig ng unang panauhang pandiwa at kailangan para sa likas na daloy sa Tagalog.
theological_decisions:
- issue: Antropolohikal na diwa ng τὸν ἔσω ἄνθρωπον
  choice: aking panloob na pagkatao
  alternative: panloob na tao
  rationale: Ang pangunahing salin ay malinaw at marangal sa kasalukuyang Tagalog, ngunit hindi nito nilulutas ang mas malawak na tanong tungkol sa antropolohiya ni Pablo. Inilalagay sa talababa ang mas literal na metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na “kautusan ng Diyos,” habang ginawang natural ang idyomang tumutukoy sa panloob na sarili.
