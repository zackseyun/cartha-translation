  to: Ngunit ang kasalanan ay sinamantala ang pagkakataon[b] sa pamamagitan ng utos at nagdulot sa akin ng bawat uri ng pag-iimbot.[a] Sapagkat, hiwalay sa Kautusan, patay ang kasalanan.
