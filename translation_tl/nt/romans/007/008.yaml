  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: tl
  text: Ngunit ang kasalanan ay sinamantala ang pagkakataon[b] sa pamamagitan ng utos at nagdulot sa akin ng bawat uri ng pag-iimbot.[a] Sapagkat, hiwalay sa Kautusan, patay ang kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat pagnanasa”; sa kontekstong ito, ang tinutukoy ay partikular na pag-iimbot.
    reason: lexical_alternative
  - marker: b
    text: O, “kinuha ang isang pagkakataon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: pagkakataon
  rationale: Ipinahihiwatig ng salita ang isang pagkakataon o panimulang puntong pinagsasamantalahan; natural sa modernong Tagalog ang “pagkakataon” at pinananatili nito ang larawan ng kasalanan bilang kumikilos na kapangyarihan.
- source_word: λαβοῦσα
  choice: sinamantala
  rationale: Kasama ng ἀφορμήν, ipinapahayag nito na aktibong ginamit ng kasalanan ang pagkakataon. Mas natural ang “sinamantala” kaysa sa literal na “kinuha,” habang hindi dinaragdagan ang diwa.
- source_word: ἡ ἁμαρτία
  choice: ang kasalanan
  rationale: 'Pinananatili ang personipikasyon ni Pablo: ang kasalanan ang simuno na nagsasamantala at nagdudulot.'
- source_word: διὰ τῆς ἐντολῆς
  choice: sa pamamagitan ng utos
  rationale: Tumutukoy ang isahang “utos” sa partikular na utos na binanggit sa konteksto at inilalarawan itong paraang ginamit ng kasalanan.
- source_word: κατειργάσατο
  choice: nagdulot
  rationale: Ipinahihiwatig ng pandiwa ang pagsasakatuparan o paglikha ng isang resulta. Malinaw at likas sa Tagalog ang “nagdulot,” at ang “sa loob ko” ay pinananatili ang ἐν ἐμοί.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: bawat uri ng pag-iimbot
  rationale: Dahil ang agarang konteksto ay ang utos laban sa pag-iimbot, ang “pag-iimbot” ang angkop na kontekstuwal na kahulugan; ipinahahayag ng “bawat uri” ang saklaw ng πᾶσαν.
- source_word: χωρὶς γὰρ νόμου
  choice: Sapagkat kung hiwalay sa Kautusan
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ. Ang “hiwalay sa Kautusan” ay natural na katumbas ng χωρὶς νόμου at naiiba sa naunang partikular na “utos.”
- source_word: νεκρά
  choice: patay
  rationale: Pinananatili ang matindi at sadyang metaporikal na pananalita ni Pablo sa halip na ipaliwanag ito bilang “di-aktibo.”
theological_decisions:
- issue: Kung palalambutin ang personipikasyon ng kasalanan at ipaliliwanag ang “patay” bilang kawalan lamang ng pagkilos
  choice: Panatilihin ang kasalanan bilang kumikilos na simuno at isalin ang νεκρά bilang “patay.”
  alternative: Gawing abstraktong sanhi ang kasalanan at isalin ang νεκρά bilang “di-aktibo.”
  rationale: Tahasang inilalarawan ng Griyego ang kasalanan bilang kapangyarihang nagsasamantala at nagdudulot, at gumagamit ito ng salitang “patay.” Pinananatili ng salin ang teolohikal na larawan at tensiyon nang hindi ito ipinapaliwanag nang lampas sa teksto.
- issue: Kung ang νόμος ay dapat unawain bilang pangkalahatang batas o bilang Kautusan sa konteksto ni Pablo
  choice: Gamitin ang “Kautusan” sa pangunahing teksto.
  alternative: “batas” o “kautusan” sa pangkalahatang diwa
  rationale: Sa agarang konteksto, tinatalakay ni Pablo ang utos na “Huwag kang mag-imbot,” kaya malamang na nasa isip ang Kautusan; gayunman, hindi dinagdagan ng salin ang teksto ng paliwanag kung aling bahagi nito ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “utos” para sa ἐντολή at “Kautusan” para sa νόμος upang mapanatili ang pagkakaiba ng partikular na utos at ng mas malawak na Kautusan. Inilagay ang mga talababa sa mismong mga salitang tinutukoy ng mga ito.
