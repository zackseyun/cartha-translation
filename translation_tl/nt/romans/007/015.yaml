id: ROM.7.15
reference: Romans 7:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: tl
  text: Sapagkat hindi ko nauunawaan ang ginagawa ko, dahil hindi ko ginagawa ang nais ko; sa halip, ginagawa ko ang mismong kinapopootan ko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ginagawa ko
  rationale: Natural and direct in Filipino; in this context it conveys what Paul carries out or produces without overloading the wording.
- source_word: οὐ γινώσκω
  choice: hindi ko nauunawaan
  rationale: Here γινώσκω has the contextual sense of not comprehending or making sense of one's conduct, rather than merely lacking factual knowledge.
- source_word: πράσσω
  choice: ginagawa
  rationale: Although πράσσω can suggest habitual practice, ordinary Filipino 'ginagawa' states the contrast naturally without imposing an explicit aspect not required by the verse.
- source_word: μισῶ
  choice: kinapopootan ko
  rationale: Preserves the strong force of μισέω ('hate') in dignified contemporary Tagalog.
- source_word: ποιῶ
  choice: ginagawa
  rationale: The natural Filipino equivalent; the emphatic object is retained through 'ang ... ang siya kong ginagawa.'
theological_decisions:
- issue: Identity or spiritual state of the first-person speaker
  choice: Retain the first-person conflict without identifying whether the speaker is pre-conversion, post-conversion, representative, or rhetorical.
  alternative: Clarify the speaker as an unbeliever, a believer, Israel under the law, or humanity in general.
  rationale: The Greek verse itself does not settle that debated interpretive question, so the translation should preserve the tension.
- issue: Force of the first γάρ
  choice: Render it as 'Sapagkat,' linking the statement to the preceding argument.
  alternative: Omit it or paraphrase it as a more specific causal explanation.
  rationale: γάρ explicitly signals an explanatory connection, while the precise relation is best left open.
- issue: Force of the second γάρ
  choice: Express the explanation through sentence sequence rather than a second explicit 'sapagkat.'
  alternative: Translate explicitly as 'sapagkat' or 'dahil.'
  rationale: The logical explanation remains clear in Filipino, and avoiding repeated 'sapagkat' produces more natural prose without changing the argument.
translation_notes:
  register: Modern, dignified Filipino Tagalog. The wording is accessible to ordinary readers while preserving Paul's emphatic contrast between what he wills and what he actually does.
