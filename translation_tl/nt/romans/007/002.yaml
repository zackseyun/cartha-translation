  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: tl
  text: Sapagkat ang babaeng may asawa ay nakatali sa kanyang asawa sa pamamagitan ng batas habang nabubuhay ang asawa; ngunit kapag namatay ang asawa, napalaya na siya mula sa batas ng asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “napalaya mula sa batas na may kinalaman sa kanyang asawa.” Malamang na tumutukoy ang Griyego sa legal na bigkis na nagtatali sa babae sa kanyang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: ang babaeng may asawa
  rationale: Likas at malinaw na Filipino para sa isang babaeng nasa bisa ng pag-aasawa; pinananatili nito ang legal at relasyonal na diwa.
- source_word: τῷ ζῶντι ἀνδρί
  choice: sa kanyang asawa ... habang nabubuhay ito
  rationale: Ipinahahayag ang mahalagang kondisyon na umiiral ang pagkakatali habang buhay ang asawa, sa mas natural na ayos sa Filipino.
- source_word: δέδεται
  choice: ay nakatali
  rationale: Inihahatid ang perpektong pasibong anyo bilang isang nagpapatuloy na kalagayang bunga ng pagkakatali.
- source_word: νόμῳ
  choice: ayon sa batas
  rationale: Pinananatili ang pangkalahatang legal na diwa ng walang-artikulong νόμῳ, sa halip na tukuyin agad ito bilang Kautusan ni Moises.
- source_word: κατήργηται
  choice: napalaya na siya
  rationale: Ipinahahayag ang kalagayang hindi na saklaw ng dating legal na bisa o obligasyon, hindi ang literal na pag-aalis o pagpuksa sa babae.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: mula sa batas na nagtatali sa kanya sa asawa
  rationale: Nililinaw ang siksik at maaaring malabong genitibong parirala bilang batas o legal na bigkis na umuugnay sa babae sa kanyang asawa, nang hindi ipinahihiwatig na ang asawa ang tagapagbatas.
theological_decisions:
- issue: Kung ang νόμῳ / τοῦ νόμου ay tiyak na tumutukoy sa Kautusan ni Moises o sa pangkalahatang legal na bigkis ng pag-aasawa
  choice: pangkalahatang batas o legal na bigkis ng pag-aasawa
  alternative: ang Kautusan ni Moises na inilalapat sa pag-aasawa
  rationale: Ang agarang konteksto ay ang legal na bisa ng pag-aasawa at ang pagwawakas nito sa kamatayan; ang walang-artikulong νόμῳ sa unang sugnay ay umaayon sa pangkalahatang legal na prinsipyo. Hindi nito itinatanggi ang mas malawak na talakayan ni Pablo tungkol sa Kautusan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “babaeng may asawa” sa halip na mas pormal na “babaeng may kabiyak,” at ang “batas na nagtatali sa kanya sa asawa” upang likas na maipahayag ang siksik na pariralang Griyego habang iniingatan sa talababa ang mas literal na anyo.
