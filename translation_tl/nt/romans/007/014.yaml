  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: tl
  text: Sapagkat alam natin na ang Kautusan ay espirituwal, ngunit ako ay makalaman[a], ipinagbili sa ilalim ng kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawa sa laman.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinagbili bilang alipin ng kasalanan,” ibig sabihin, nasa ilalim ng kapangyarihan ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: alam natin
  rationale: Likas at tuwirang ipinapahayag nito ang matatag na kaalamang kapwa kinikilala ni Pablo at ng mga mambabasa.
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Sa konteksto ng Roma, tumutukoy ito sa Kautusan; pinananatili ang tiyak na anyo ng Griyego nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: πνευματικός
  choice: espirituwal
  rationale: Pinananatili nito ang tuwirang paglalarawan sa Kautusan at ang tahasang pagsalungat nito sa makalaman.
- source_word: σάρκινός
  choice: makalaman
  rationale: Inililipat nito ang pang-uring kaugnay ng σάρξ at pinananatili ang kaibahan sa “espirituwal,” nang hindi ito pinapalitan ng mas interpretatibong “likas na makasalanan.”
- source_word: πεπραμένος
  choice: ipinagbili
  rationale: Ipinakikita ng perpektong pasibong pandiwari ang naganap na pagbebenta at ang nagpapatuloy na kalagayan; pinananatili rin nito ang metapora.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: sa ilalim ng kasalanan
  rationale: Malapit ito sa Griyego at pinananatili ang maikli ngunit matinding larawan ng pagpapasakop sa kasalanan.
theological_decisions:
- issue: Gaano kalakas bibigyang-kahulugan ang wikang may kaugnayan sa laman
  choice: “makalaman” sa pangunahing teksto
  alternative: “likas na makasalanan” o “hindi espirituwal”
  rationale: Pinananatili ng “makalaman” ang tunay na leksikal at teolohikal na tensiyon sa pagitan ng πνευματικός at σάρκινος, nang hindi ipinapasok ang isang mas huling pormulang antropolohikal.
- issue: Ang diwa ng pagkaalipin sa πεπραμένος ὑπὸ τὴν ἁμαρτίαν
  choice: Panatilihin ang metaporang “ipinagbili sa ilalim ng kasalanan” sa teksto at ipaliwanag ang pagkaalipin sa talababa.
  alternative: “ipinagbili bilang alipin sa kapangyarihan ng kasalanan” sa pangunahing teksto
  rationale: Tapat ito sa siksik na pananalita ng Griyego habang ginagawang malinaw sa talababa ang pahiwatig na pagkaalipin at pagpapasakop.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “makalaman” upang mapanatili ang ugnayang salita sa “laman” at ang pagsalungat sa “espirituwal.” Ginawang malaking titik ang “Kautusan” bilang natural na palatandaan ng tiyak na Kautusang tinutukoy sa konteksto.
