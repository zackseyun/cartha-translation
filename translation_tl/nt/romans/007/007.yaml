base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: tl
  text: Ano ngayon ang sasabihin natin? Ang Kautusan ba ay kasalanan? Hinding-hindi! Ngunit hindi ko sana nakilala ang kasalanan kung hindi sa pamamagitan ng Kautusan. Sapagkat hindi ko sana nalaman ang pag-iimbot kung hindi sinabi ng Kautusan, “Huwag kang mag-imbot.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ano ngayon ang sasabihin natin?
  rationale: Pinananatili ang retorikal na pormula ni Pablo sa natural at dignified na modernong Tagalog.
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Tumutukoy sa tiyak na Kautusang Mosaiko sa konteksto; ang malaking titik ay tumutulong na ipahiwatig ang partikular na reperensiya nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Direkta at karaniwang katumbas ng teolohikal na terminong Griyego.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Natural na masidhing pagtanggi sa Tagalog na nagpapanatili sa lakas ng idyomang Griyego.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw na naghuhudyat ng pagtutuwid at pagsalungat matapos ang mariing pagtanggi.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: hindi ko sana nakilala ang kasalanan kung hindi sa pamamagitan ng Kautusan
  rationale: Ang “sana” at “kung hindi” ay natural na naghahatid ng kontrapaktuwal na diwa; pinananatili ng “nakilala” ang malapit na leksikal na ugnayan sa γινώσκω.
- source_word: ἐπιθυμίαν
  choice: pag-iimbot
  rationale: Bagaman maaari itong mangahulugang mas malawak na “pagnanasa,” pinapaboran ng kasunod na sipi mula sa utos ang tiyak na diwa ng pag-iimbot.
- source_word: οὐκ ᾔδειν
  choice: hindi ko sana nalaman kung ano ang
  rationale: Ang ekspresyong ito ay natural sa Tagalog at nililinaw na ang Kautusan ang nagpakilala sa pag-iimbot bilang kasalanan, habang hindi ipinagpapalagay na hindi niya alam ang mismong pag-iral ng pagnanasa.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Huwag kang mag-imbot
  rationale: Karaniwan, tuwiran, at may buong lakas ng legal na pagbabawal sa modernong Tagalog.
theological_decisions:
- issue: Ugnayan ng Kautusan at kasalanan
  choice: Ang Kautusan ba ay kasalanan? Hinding-hindi!
  alternative: Makasalanan ba ang Kautusan?
  rationale: 'Predicate noun ang ἁμαρτία: itinatanong kung maitutumbas ang Kautusan sa kasalanan, hindi lamang kung mayroon itong makasalanang katangian. Pinananatili ng salin ang matalim na teolohikal na pormulasyon ni Pablo.'
- issue: Diwa ng pagkilala sa pag-iimbot
  choice: hindi ko sana nalaman kung ano ang pag-iimbot
  alternative: hindi ko sana nakilala ang pag-iimbot
  rationale: Ang idyomatikong Tagalog ay nagpapahayag na sa pamamagitan ng utos nalaman o nakilala ni Pablo ang pag-iimbot sa karakter nitong ipinagbabawal ng Kautusan, nang hindi labis na nilulutas ang mas malawak na tensiyon tungkol sa kaalaman sa kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Kautusan” para sa partikular na Mosaic law sa konteksto, “Hinding-hindi!” para sa mariing pagtanggi, at ang karaniwang anyong pang-utos na “Huwag kang mag-imbot.”
