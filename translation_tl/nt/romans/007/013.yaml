  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: tl
  text: Kaya nga, ang mabuti ba ay naging kamatayan para sa akin? Hinding-hindi! Sa halip, ang kasalanan—upang mahayag na kasalanan[a]—ang nagdulot sa akin ng kamatayan sa pamamagitan ng mabuti, upang sa pamamagitan ng utos ay maging sukdulang makasalanan ang kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang mahayag ang kasalanan bilang kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: O “maging makasalanan nang higit sa sukat ang kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: ang mabuti
  rationale: Pinananatili ang substantival at abstraktong diwa ng neuter adjective at natural ito sa modernong Tagalog.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: ay naging kamatayan para sa akin
  rationale: Pinananatili ang predikatibong diwa ng γίνομαι at ang personal na kaugnayan ng datibo, nang hindi ginagawang sanhi mismo ang mabuti.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Malakas at likas na pagtanggi sa modernong Tagalog, na katumbas ng mariing pormulang Paulino.
- source_word: ἡ ἁμαρτία
  choice: ang kasalanan
  rationale: Pinananatili ang abstraktong pangngalan at ang implicit na personipikasyon nito bilang gumagawa.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: upang mahayag ito bilang kasalanan
  rationale: 'Ipinahahayag ang predikatibong pag-uulit: nahahayag ang kasalanan sa tunay nitong katangian bilang kasalanan.'
- source_word: διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον
  choice: ang gumawa ng kamatayan sa akin sa pamamagitan ng mabuti
  rationale: Malinaw na ang kasalanan, hindi ang mabuti, ang gumagawa ng kamatayan; pinananatili rin ang instrumental na διά.
- source_word: ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία
  choice: upang ... maging sukdulang makasalanan ang kasalanan
  rationale: Ang “sukdulang” ay malinaw at dignified na pagpapahayag ng καθ’ ὑπερβολὴν, habang pinananatili ang matinding retorikal na pag-uulit.
- source_word: διὰ τῆς ἐντολῆς
  choice: sa pamamagitan ng utos
  rationale: Tumpak at likas na salin ng instrumental na parirala; sa konteksto, tumutukoy ito sa utos na kaugnay ng Kautusan.
theological_decisions:
- issue: Ang pagtatanggol ni Pablo sa kabutihan ng utos
  choice: Itinatanggi na ang mabuti mismo ang naging kamatayan at itinatakda sa kasalanan ang paggawa ng kamatayan sa pamamagitan ng mabuti.
  alternative: Maaaring isaling para magmukhang ang mabuting utos mismo ang may pananagutang moral sa kamatayan.
  rationale: Ang mariing pagtanggi at ang kasunod na ἀλλὰ ἡ ἁμαρτία ay naglilipat ng pananagutan sa kasalanan, habang pinananatili ang tensiyong ginagamit nito ang mabuting utos.
- issue: Ugnayan ng dalawang ἵνα clause
  choice: 'Kapuwa pinanatili bilang mga sugnay ng layunin: upang mahayag ang kasalanan at upang maging sukdulang makasalanan ito sa pamamagitan ng utos.'
  alternative: Maaaring unawain ang mga ito bilang resulta lamang.
  rationale: Ang “upang” ay pinakamalapit sa pormal na puwersa ng ἵνα at hindi tahimik na nilulutas ang posibleng layunin/resultang nuance.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang retorikal na tanong, ang matinding pagtanggi, ang personipikasyon ng kasalanan, at ang paulit-ulit na salitang “kasalanan” sa halip na pakinisin ang sinadyang diin ni Pablo.
