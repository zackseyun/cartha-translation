  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: tl
  text: Kahabag-habag na tao ako! Sino ang sasagip sa akin mula sa katawan ng kamatayang ito?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mula sa katawang ito ng kamatayan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Sino ang magliligtas sa akin?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: kahabag-habag
  rationale: Ipinahahayag nito ang matinding paghihirap at kaawa-awang kalagayan ng nagsasalita, habang pinananatili ang bigat ng kanyang daing sa natural at marangal na Tagalog.
- source_word: ἄνθρωπος
  choice: tao
  rationale: Ang “tao” ang tuwiran at likas na katumbas at malinaw na tumutukoy rito sa mismong nagsasalita.
- source_word: τίς
  choice: sino
  rationale: Personal ang patanong at naghahanap ito ng isang tagapagligtas o tagasagip.
- source_word: ῥύσεται
  choice: sasagip
  rationale: Ipinahihiwatig ng pandiwa ang pagliligtas mula sa panganib o pagkakabihag. Ang “sasagip” ay malinaw, masigla, at hindi agad nililimitahan ang kahulugan sa isang teknikal na terminong teolohikal.
- source_word: ἐκ
  choice: mula sa
  rationale: Natural nitong ipinapahayag ang paghiwalay o paglaya mula sa isang kalagayan.
- source_word: σώματος
  choice: katawan
  rationale: Pinananatili nito ang kongkretong larawan ng orihinal sa halip na palitan iyon ng paliwanag.
- source_word: τοῦ θανάτου τούτου
  choice: ng kamatayang ito
  rationale: Sinusunod nito ang ugnayang gramatikal ng Griyego, kung saan ang demonstratibo ay kaugnay ng “kamatayan,” at pinananatili ang sadyang mabigat at matalinghagang parirala.
theological_decisions:
- issue: Ugnayan ng “katawan” at “kamatayang ito” sa huling parirala
  choice: katawan ng kamatayang ito
  alternative: katawang ito ng kamatayan
  rationale: Ang napiling anyo ay mas malapit sa ayos at ugnayang gramatikal ng Griyegong τοῦ σώματος τοῦ θανάτου τούτου. Hindi nito ipinapasiya kung ang “katawan” ay sanhi, saklaw, o kasangkapan ng kamatayan; pinananatili nito ang tensiyon at larawan ng teksto. Inilalagay sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ang “Kahabag-habag akong tao!” ay nagpapanatili sa bigat ng personal na daing, at ang “sasagip” ay buhay at natural na pandiwa para sa pagliligtas mula sa panganib.
