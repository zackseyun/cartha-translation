  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: tl
  text: Salamat sa Diyos sa pamamagitan ni Jesus na Mesiyas, ang ating Panginoon! Kaya nga, ako mismo ay naglilingkod sa kautusan ng Diyos sa aking isip, ngunit sa aking laman ay naglilingkod ako sa kautusan ng kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Salamat sa Diyos
  rationale: Sa padamdam na konstruksyong ito, ang χάρις kasama ng datibong τῷ θεῷ ay isang idyomatikong pagpapahayag ng pasasalamat, hindi tuwirang pagtukoy sa biyaya bilang kaloob o katangian.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na may henitibo ay nagpapahayag ng pamamagitan. Isinalin ang Χριστός bilang titulong “Mesiyas” at hindi lamang bilang ikalawang pangalang pantangi.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ang ating Panginoon
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong iniuugnay kay Jesus na Mesiyas ang titulong κύριος.
- source_word: Ἄρα οὖν
  choice: Kaya nga
  rationale: Pinananatili nito ang sabay na panghinuha at pagbubuod na ipinahihiwatig ng dalawang kataga.
- source_word: αὐτὸς ἐγώ
  choice: ako mismo
  rationale: Inilalahad nito ang diin ng pinagsamang emphatic pronoun at personal pronoun nang hindi dinaragdagan ang kahulugan.
- source_word: τῷ μὲν νοῒ
  choice: sa aking isip
  rationale: Ang νοῦς ay tumutukoy rito sa panloob na kakayahang umunawa at umayon sa kautusan ng Diyos; “isip” ang malinaw at karaniwang katumbas.
- source_word: δουλεύω
  choice: naglilingkod
  rationale: May diwa ng pagkaalipin ang pandiwa, ngunit ang “naglilingkod” ay natural sa Tagalog at pinananatili ang pagpapasakop sa dalawang magkatapat na kautusan.
- source_word: νόμῳ θεοῦ
  choice: sa kautusan ng Diyos
  rationale: Pinananatili ang νόμος bilang “kautusan” upang maiugnay sa argumento ng Roma 7 at mapanatili ang pagkakapantay nito sa “kautusan ng kasalanan.”
- source_word: τῇ δὲ σαρκί
  choice: ngunit … sa aking laman
  rationale: Ang “laman” ay tuwirang katumbas na hindi agad nagpapakahulugan sa σάρξ bilang isang ganap na doktrinal na konsepto.
- source_word: νόμῳ ἁμαρτίας
  choice: sa kautusan ng kasalanan
  rationale: Pinananatili ang pag-uulit ng νόμος at ang sinadyang paghahambing nito sa kautusan ng Diyos; ang “prinsipyo” ay mas interpretatibo.
theological_decisions:
- issue: Kahulugan ng σάρξ sa kontekstong may moral na diin
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Ginamit ng Griyego ang σάρξ, hindi isang tahasang parirala para sa makasalanang disposisyon. Pinananatili ng “laman” ang tensiyong antropolohikal at teolohikal sa teksto.
- issue: Kahulugan ng νόμος sa pariralang νόμῳ ἁμαρτίας
  choice: kautusan ng kasalanan
  alternative: prinsipyo ng kasalanan
  rationale: Ang “kautusan” ay nagpapanatili sa leksikal na pag-uulit at paralelismo sa νόμῳ θεοῦ, samantalang ang “prinsipyo” ay nagpapasya na agad kung paano inuunawa ang metapora.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang padamdam sa unang pangungusap, ang diin ng “ako mismo,” at ang balanseng paghaharap ng isip at laman. Ginamit ang “kautusan” sa parehong sugnay upang marinig ang sinadyang pag-uulit sa Griyego.
