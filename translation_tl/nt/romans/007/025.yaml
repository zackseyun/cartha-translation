    issue: Malabo ang sintaks ng ikalawang sugnay.
    rationale: Ang “ngunit sa kautusan ng kasalanan sa aking laman” ay hindi kasinglinaw ng Griyegong paghahambing na τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ .... Ang paglalagay ng “sa aking laman” sa unahan at pag-uulit ng pandiwa ay malinaw na nag-uugnay rito sa paglilingkod.
  revised_text: Salamat sa Diyos sa pamamagitan ni Jesus na Mesiyas, ang ating Panginoon! Kaya nga, ako mismo ay naglilingkod sa kautusan ng Diyos sa aking isip, ngunit sa aking laman ay naglilingkod ako sa kautusan ng kasalanan.
