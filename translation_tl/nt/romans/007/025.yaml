- from: Salamat sa Diyos sa pamamagitan ni Jesus na Mesiyas[c], ang ating Panginoon! Kaya nga, ako mismo ay naglilingkod sa kautusan ng Diyos sa aking isip, ngunit sa kautusan ng kasalanan[b] sa aking laman[a].
  to: Salamat sa Diyos sa pamamagitan ni Jesus na Mesiyas, ang ating Panginoon! Kaya nga, ako mismo ay naglilingkod sa kautusan ng Diyos sa aking isip, ngunit sa aking laman ay naglilingkod ako sa kautusan ng kasalanan.
  rationale: Inayos ang ayos ng mga parirala sa ikalawang sugnay at inulit ang pandiwang “naglilingkod” upang maging malinaw sa Filipino na ang “sa aking laman” ay katapat ng “sa aking isip.” Hindi binago ang kahulugan, ang diin, o ang sinadyang pag-uulit ng νόμος sa Griyego.
