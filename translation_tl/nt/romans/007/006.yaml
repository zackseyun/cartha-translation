  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: tl
  text: Ngunit ngayon ay pinalaya na tayo mula sa kautusan, yamang namatay na tayo sa dating gumagapos sa atin,[a] upang maglingkod tayo sa bagong paraan ng Espiritu[b] at hindi sa lumang paraan ng titik.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “yamang namatay na tayo sa bagay na humahawak sa atin.”
    reason: lexical_alternative
  - marker: b
    text: O “sa bagong paraan ng espiritu.”
    reason: alternative_reading
  - marker: c
    text: O “sa lumang paraan ng nasusulat na tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν
  choice: pinalaya na tayo
  rationale: Sa kasamang ἀπὸ τοῦ νόμου, ipinahihiwatig ng pandiwang balintiyak na napalaya ang mga mananampalataya mula sa kapangyarihang gumagapos ng kautusan, hindi na pinawalang-bisa o pinawi ang kautusan mismo.
- source_word: νόμου
  choice: kautusan
  rationale: Tumutukoy ito sa kautusan ni Moises ayon sa konteksto; likas at malinaw sa modernong Filipino ang “kautusan.”
- source_word: ἀποθανόντες
  choice: yamang namatay na tayo
  rationale: Pinananatili nitong ang “tayo” ang namatay at inilalahad ang pangyayari bilang batayan ng pagkalaya, ayon sa gamit ng aorist participle.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: sa dating gumagapos sa atin
  rationale: Natural nitong ipinahahayag sa Filipino ang dating kalagayan ng pagkakahawak o pagkakagapos, habang iniiwasang gawing tahasang paksa ang kautusan kung saan nananatiling di-tiyak ang Griyego.
- source_word: δουλεύειν
  choice: maglingkod
  rationale: Bagaman may larawan ng pagkaalipin ang salita, “maglingkod” ang likas na salin dito dahil ang diin ay nasa bagong paraan ng paglilingkod.
- source_word: καινότητι
  choice: sa bagong paraan
  rationale: Mas natural ito sa karaniwang Filipino kaysa literal na “sa pagiging bago,” habang pinananatili ang kaibahan sa lumang paraan.
- source_word: πνεύματος
  choice: ng Espiritu
  rationale: Malamang na tumutukoy ito sa Banal na Espiritu sa konteksto ng paghahambing ni Pablo sa Espiritu at titik; itinatala sa talababa ang posibleng pagbasa na espiritu.
- source_word: παλαιότητι
  choice: sa lumang paraan
  rationale: Tumutugma ito sa natural na salin ng καινότητι at pinananatili ang retorikal na paghahambing ng bago at luma.
- source_word: γράμματος
  choice: ng titik
  rationale: Pinananatili ng “titik” ang tuwirang idyoma ni Pablo; ang mas mapagpaliwanag na “nasusulat na tuntunin” ay inilagay sa talababa.
theological_decisions:
- issue: Kung ang kautusan ba ang namatay o ang mga mananampalataya ang namatay kaugnay nito
  choice: 'Ang mga mananampalataya ang namatay: “yamang namatay na tayo sa dating gumagapos sa atin.”'
  alternative: Ang kautusan ang namatay kaugnay ng mga mananampalataya.
  rationale: Nasa nominative plural ang ἀποθανόντες at tumutukoy sa ipinahihiwatig na simuno na “tayo.” Kaya pinananatili ng salin na ang mga mananampalataya, hindi ang kautusan, ang namatay.
- issue: Kung ang πνεύματος ay tumutukoy sa Banal na Espiritu o sa espiritu ng tao
  choice: Espiritu
  alternative: espiritu
  rationale: Sa paghahambing ni Pablo sa Espiritu at titik at sa konteksto ng bagong tipan, mas malamang na Banal na Espiritu ang tinutukoy. Gayunman, tunay na posible ang mas pangkalahatang pagbasa kaya pinanatili ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bagong paraan” at “lumang paraan” upang maipahayag nang natural ang magkatapat na abstraktong pangngalang Griyego, habang pinanatili ang mas tuwirang “titik” sa pangunahing teksto. Lahat ng talababa ay may katugmang pananda sa teksto.
