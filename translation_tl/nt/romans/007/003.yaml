review_pass:
  verdict: revise
  source_fidelity: Ang “Kaya nga,” “habang nabubuhay,” “tatawagin,” at “malaya ... sa batas” ay tapat sa Griyego. Gayunman, ang “maging sa ibang lalaki” ay hindi likas o malinaw na Filipino at hindi wastong naihahatid ang pagpasok sa relasyong ipinahihiwatig ng γένηται/γενομένην ἀνδρὶ ἑτέρῳ. Ang huling “hindi siya mangangalunya” ay naglilipat sa kilos na paggawa ng pangangalunya, samantalang ang μοιχαλίς ay katayuang “tinatawag/itinuturing na mangangalunya.”
  naturalness: Hindi natural ang “kung siya ay maging sa ibang lalaki.” Mas malinaw at modernong Filipino ang “kung maging asawa siya ng ibang lalaki.” Ang “hindi siya ituturing na mangangalunya” ay mas eksaktong katapat ng “hindi ... μοιχαλίδα” kaysa “hindi siya mangangalunya.”
  terminology: Ang “mangangalunya” ay angkop na katawagan para sa μοιχαλίς sa kontekstong ito, bagaman hindi minamarkahan ng Filipino ang kasarian. Ang “batas” ay dapat panatilihin sa teksto; ang talababa ay wastong nagpapaliwanag ng agarang kontekstong legal-pag-aasawa nang hindi ipinipilit ang mas malawak na pakahulugan.
  issues:
  - severity: high
    issue: Hindi natural at hindi malinaw ang “kung siya ay maging sa ibang lalaki.”
    rationale: Hindi ito karaniwang konstruksiyon sa modernong Filipino at maaari itong hindi maunawaan bilang pagpasok ng babae sa relasyon o pag-aasawa sa ibang lalaki, na siyang diwa ng Griyegong idyoma sa kontekstong ito.
  - severity: medium
    issue: Ang “hindi siya mangangalunya” ay ginagawang kilos ang huling sugnay sa halip na katayuan.
    rationale: Ang μοιχαλίδα ay pangngalang nangangahulugang “mangangalunya,” at ang infinitive ay nagsasaad na hindi siya nasa katayuang iyon kahit naging asawa siya ng ibang lalaki. Ang “hindi siya ituturing na mangangalunya” ay mas tumpak.
  - severity: low
    issue: Ang talababa a ay hindi na kailangan para ipagtanggol ang hindi likas na pangunahing salin.
    rationale: Kapag ginawang malinaw ang pangunahing salin, maaaring ilahad ng talababa ang mas literal ngunit hindi gaanong natural na posibilidad nang hindi pinapalabo ang teksto.
