reference: Romans 7:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: tl
  text: Kaya nga, habang nabubuhay ang kanyang asawa, tatawagin siyang mangangalunya kung maging asawa siya ng ibang lalaki.[a] Ngunit kung mamatay ang kanyang asawa, malaya na siya sa batas,[b] kaya hindi siya ituturing na mangangalunya kapag naging asawa siya ng ibang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “kung siya ay mapasaibang lalaki” o “kung siya ay makisama sa ibang lalaki.”
    reason: lexical_alternative
  - marker: b
    text: Ang “batas” dito ay agarang tumutukoy sa legal na bigkis na namamahala sa relasyon ng mag-asawa.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Likas na Filipino itong naghahayag ng kongklusyong hinango mula sa naunang paliwanag at pinananatili ang pinagsamang inferensiyal na diin ng dalawang kataga.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: habang nabubuhay ang kanyang asawa
  rationale: Malinaw nitong ipinahahayag ang kasabay na kalagayang temporal ng genitive absolute; ipinahihiwatig ng konteksto na ang lalaki ay asawa ng babaeng tinutukoy.
- source_word: μοιχαλὶς
  choice: mangangalunya
  rationale: Tuwirang tumutukoy ito sa babaeng nagkakasala ng pangangalunya. Bagaman hindi minamarkahan ng anyong Filipino ang kasarian, malinaw ito mula sa panghalip at konteksto.
- source_word: χρηματίσει
  choice: tatawagin
  rationale: Pinananatili nito ang diwang tatawagin o kikilalanin sa isang katawagan, pati ang aspektong panghinaharap.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ
  choice: kung siya ay maging sa ibang lalaki
  rationale: Pinananatili ng sadyang bahagyang bukas na pananalita ang idiomatikong relasyon ng γίνομαι at datibo nang hindi tahasang nagdaragdag ng salitang 'asawa'; nililinaw sa talababa ang mga natural na posibilidad.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: malaya na siya sa batas
  rationale: Tuwiran at natural itong nagsasaad ng paglaya mula sa umiiral na nagbibigkis na batas. Ang 'na' ay angkop na nagpapahiwatig ng pagbabagong dulot ng kamatayan ng asawa.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: kaya hindi siya mangangalunya
  rationale: Ipinahahayag ng 'kaya' ang resultang lohikal ng articular infinitive sa maayos na modernong Filipino.
- source_word: γενομένην ἀνδρὶ ἑτέρῳ
  choice: kung siya ay maging sa ibang lalaki
  rationale: Inuulit ang parehong pananalita upang mapanatili ang paralelismo at pagkakapare-pareho ng legal na paghahambing.
theological_decisions:
- issue: Saklaw ng νόμος sa paghahambing
  choice: batas
  alternative: batas ng pag-aasawa; Kautusan sa mas malawak na diwang Paulino
  rationale: Ang pinakamalapit na tinutukoy ay ang batas o legal na bigkis na namamahala sa relasyon ng mag-asawa. Pinananatili sa pangunahing teksto ang payak na 'batas' upang hindi palawakin o paliitin nang labis ang salita ni Pablo.
- issue: Kalikasan ng relasyon sa ἀνδρὶ ἑτέρῳ
  choice: maging sa ibang lalaki
  alternative: maging asawa ng ibang lalaki; makisama sa ibang lalaki
  rationale: Ang Griyego ay nagpapahiwatig ng pagpasok sa isang relasyon sa ibang lalaki sa kontekstong marital, ngunit hindi nito tahasang ginagamit ang salitang 'asawa.' Pinananatili ng salin ang tensiyong ito at inilalagay sa talababa ang mas malinaw na mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'mangangalunya' bilang tiyak ngunit pamilyar na katawagan. Ang bahagyang di-karaniwang 'maging sa ibang lalaki' ay pinili upang mapanatili ang tunay na lawak ng Griyegong idyoma; tinutulungan ito ng talababa. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
