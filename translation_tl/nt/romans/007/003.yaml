revisions:
- from: Kaya nga, habang nabubuhay ang kanyang asawa, tatawagin siyang mangangalunya kung siya ay maging sa ibang lalaki.[a] Ngunit kung mamatay ang kanyang asawa, malaya na siya sa batas,[b] kaya hindi siya mangangalunya kung siya ay maging sa ibang lalaki.
  to: Kaya nga, habang nabubuhay ang kanyang asawa, tatawagin siyang mangangalunya kung maging asawa siya ng ibang lalaki.[a] Ngunit kung mamatay ang kanyang asawa, malaya na siya sa batas,[b] kaya hindi siya ituturing na mangangalunya kapag naging asawa siya ng ibang lalaki.
  rationale: Pinalitan ang hindi likas na “maging sa ibang lalaki” ng “maging asawa siya ng ibang lalaki,” na malinaw na naghahatid ng relasyong marital na ipinahihiwatig ng Griyego sa legal na paghahambing. Pinalitan din ang huling pandiwang “mangangalunya” ng “ituturing na mangangalunya” upang mapanatili ang pangngalang μοιχαλίς bilang katayuang legal o panlipunan, hindi lamang isang kilos. Nananatili ang “batas” sa pangunahing teksto at ang paliwanag nito sa talababa.
  reviewer_model: gpt-5.6-terra
