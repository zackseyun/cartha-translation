  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: tl
  text: Sapagkat hindi ko ginagawa[a] ang mabuting bagay na nais ko, kundi ang masamang bagay na ayaw ko—ito ang isinasagawa[b] ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinasagawa.”
    reason: lexical_alternative
  - marker: b
    text: O “ginagawa.” Magkaibang pandiwang Griyego ang ginamit dito at sa unang bahagi ng talata, ngunit malaki ang pagkakatulad ng kahulugan ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Sapagkat hindi
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang pahayag, at likas sa Filipino ang ayos na “hindi ko ginagawa.”
- source_word: θέλω
  choice: nais
  rationale: Ang “nais” ay kasalukuyan, marangal, at malinaw na nagpapahayag ng kalooban nang hindi nagiging teknikal o makaluma.
- source_word: ποιῶ
  choice: ginagawa
  rationale: Ang payak na “ginagawa” ang natural na katumbas ng ποιῶ; may talababa upang maipakitang ibang pandiwa ang ginamit sa hulihan.
- source_word: ἀγαθόν
  choice: ang mabuti
  rationale: Pinananatili nito ang tuwirang moral na kaibahan sa “ang masama” at hindi pinahihina bilang praktikal lamang na tama.
- source_word: κακὸν
  choice: ang masama
  rationale: Likas itong katapat ng “ang mabuti” sa Filipino at taglay ang malinaw na moral na bigat ng κακόν.
- source_word: τοῦτο
  choice: ito
  rationale: Hayagang pinananatili ang mariing demonstratibo at ang pagtutok nito sa masamang ayaw ng nagsasalita.
- source_word: πράσσω
  choice: lagi kong ginagawa
  rationale: Ang “lagi” ay nagpapahiwatig ng nakaugaliang pagsasagawa na maaaring taglayin ng πράσσω sa konteksto, habang ang talababa ay nagsasaad na maaari rin itong isaling payak na “ginagawa.”
theological_decisions:
- issue: Kung pahihinain ang moral na kaibahan ng ἀγαθόν at κακόν
  choice: Panatilihin ang “ang mabuti” at “ang masama” bilang tuwirang mga kategoryang moral.
  alternative: “ang tama” at “ang mali”
  rationale: Mabigat sa etika ang paghaharap ni Pablo; hindi ito dapat gawing tungkol lamang sa praktikal na tama at mali.
- issue: Kung kikilalanin ang nagsasalita o yugto ng karanasang inilalarawan
  choice: Panatilihin lamang ang unang panauhan ng teksto nang hindi tinutukoy kung ito ay bago o matapos manampalataya, o kung kumakatawan ito sa ibang persona.
  alternative: Linawin sa salin na ito ay karanasan ni Pablo bilang mananampalataya o bilang taong nasa ilalim ng kautusan.
  rationale: Hindi nilulutas ng mismong talata ang pinagtatalunang pagkakakilanlan at kalagayan ng “ako,” kaya hindi ito dapat ipasok sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nais” at “ayaw” para sa natural na pagpapahayag ng kalooban. Pinanatili ang simetriya ng “ang mabuti” at “ang masama,” pati ang mariing “ito.”
