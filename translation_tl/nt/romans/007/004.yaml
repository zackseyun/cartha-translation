id: ROM.7.4
reference: Romans 7:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: tl
  text: Kaya nga, mga kapatid ko[a], kayo rin ay pinatay na may kaugnayan sa kautusan sa pamamagitan ng katawan ng Mesiyas[b], upang mapabilang kayo sa iba—sa kanya na muling binuhay mula sa mga patay—nang sa gayon ay mamunga tayo para sa Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego na isinaling “mga kapatid” ay nasa anyong panlalaking maramihan ngunit maaari itong tumukoy sa pangkat na binubuo ng mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Griego Christou; maaari ring isaling “Cristo.” Ginamit dito ang “Mesiyas” upang ipakita ang kahulugan nito bilang titulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kaya nga
  rationale: Likas na panandang Filipino para sa kongklusyon o resultang hinango mula sa naunang paghahalintulad.
- source_word: ἀδελφοί μου
  choice: mga kapatid ko
  rationale: Ang “kapatid” ay likas at marangal na tawag sa Filipino at maaaring tumukoy sa halo-halong pangkat nang hindi kinakailangang tukuyin ang kasarian.
- source_word: ἐθανατώθητε
  choice: kayo rin ay pinatay
  rationale: Pinananatili ang tahasang anyong balintiyak ng aorist passive at ang larawan na may ginawang pagkilos sa mga mananampalataya.
- source_word: τῷ νόμῳ
  choice: sa kautusan
  rationale: 'Malapit na kinakatawan ang datibong ugnayan: pinatay sila kung tungkol sa kautusan, kaya natapos ang dating bigkis nito sa kanila; hindi ito pinalawak bilang “pinalaya mula sa kautusan.”'
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: sa pamamagitan ng katawan ng Mesiyas
  rationale: Ipinapakita ang instrumental na gamit ng διά na may genitive at pinananatili ang katawan bilang paraan ng kanilang pagkamatay sa kautusan.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Dito ay malinaw ang bisa ng Χριστός bilang titulo; ang “Mesiyas” ay nagpapanatili sa kahulugang “Pinahiran.”
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: upang mapabilang kayo sa iba
  rationale: Malinaw sa makabagong Filipino at pinananatili ang paglilipat ng kaugnayan sa pagpapatuloy ng paghahalintulad sa pag-aasawa.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: sa kanya na muling binuhay mula sa mga patay
  rationale: Pinananatili ang balintiyak na pahayag ng muling pagkabuhay at ang pagtukoy sa Mesiyas bilang taong binuhay.
- source_word: ἵνα καρποφορήσωμεν
  choice: nang sa gayon ay mamunga tayo
  rationale: Pinananatili ang layunin, ang talinghaga ng pamumunga, at ang tunay na paglipat ng panauhan mula “kayo” tungong “tayo.”
- source_word: τῷ θεῷ
  choice: para sa Diyos
  rationale: Likas na Filipino para sa datibong nagsasaad kung para kanino ang ibinubungang bunga.
theological_decisions:
- issue: Pagbibigay-kahulugan sa Χριστοῦ sa diskursong Paulino
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang gamit dito ay may malinaw na puwersa bilang titulo. Pinananatili ng “Mesiyas” ang kahulugan nito nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Pagpapanatili sa ugnayang pangmag-asawa sa εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: upang mapabilang kayo sa iba
  alternative: upang mapangasawa kayo ng iba
  rationale: Ang “mapabilang” ay nagpapanatili sa relational na paglilipat at sa pahiwatig ng naunang paghahalintulad sa pag-aasawa, ngunit hindi nito ginagawang tahasan ang pandiwang “mag-asawa,” na wala mismo sa parirala.
- issue: Ahensiya sa muling pagkabuhay
  choice: muling binuhay
  alternative: muling nabuhay
  rationale: Balintiyak ang ἐγερθέντι. Ang “muling binuhay” ay nagpapanatili sa gramatikal na pahiwatig na may bumuhay sa kanya, nang hindi tahasang pinapangalanan ang ahente.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan” para sa νόμος at “Mesiyas” para sa titulong Χριστός. Hindi pinakinis ang paglipat mula “kayo” tungong “tayo,” at pinanatili ang balintiyak sa pagkamatay sa kautusan at sa muling pagkabuhay.
