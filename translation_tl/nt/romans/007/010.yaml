base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: tl
  text: Ngunit namatay ako, at ang utos na para sa buhay ay napatunayang nauwi sa kamatayan para sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang utos ding iyon na para sa buhay ay napatunayang humantong sa kamatayan para sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: namatay ako
  rationale: Tuwirang inilalarawan ng aorist active indicative ang nangyari bilang isang pangyayaring naganap, hindi bilang isang proseso.
- source_word: εὑρέθη μοι
  choice: napatunayang ... sa akin
  rationale: Natural nitong ipinahahayag sa Tagalog ang diwa ng pagkatuklas o kinalabasan sa karanasan ng nagsasalita, habang pinananatili ang datibong μοι.
- source_word: ἐντολή
  choice: ang utos
  rationale: Karaniwan, malinaw, at sapat na katumbas ito ng pang-isahang ἐντολή nang hindi idinaragdag ang salitang “Kautusan,” na wala rito.
- source_word: ἡ εἰς ζωὴν
  choice: na para sa buhay
  rationale: Pinananatili nito ang direksiyon o kinalabasan na ipinahihiwatig ng εἰς at ang maikli ngunit mahalagang pagtutunggali ng buhay at kamatayan.
- source_word: αὕτη
  choice: ang utos na para sa buhay
  rationale: Ang reperensiya ng demonstratibo ay likas nang naipapahayag sa Tagalog sa pamamagitan ng mismong pariralang tumutukoy sa utos; ang mas tahasang “ang utos ding iyon” ay inilagay bilang alternatibo sa talababa.
- source_word: εἰς θάνατον
  choice: para sa kamatayan
  rationale: Sinasalamin nito ang naunang “para sa buhay” at pinananatili ang retorikal na pagtutunggali ng dalawang magkaparis na pariralang εἰς.
theological_decisions:
- issue: Kung tahasang sasabihing ang utos ang nagdala o sanhi ng kamatayan
  choice: napatunayang para sa kamatayan sa akin
  alternative: nagdulot sa akin ng kamatayan
  rationale: Pinananatili ng napiling salin ang tensiyon at ang natuklasang kinalabasan sa karanasan ni Pablo nang hindi labis na ipinapaliwanag ang ugnayang sanhi na hindi tahasang isinasaad ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatapat na “para sa buhay” at “para sa kamatayan,” kahit bahagyang di-karaniwan ang ikalawang parirala, upang maingatan ang anyo at teolohikal na tensiyon ng Griyego.
