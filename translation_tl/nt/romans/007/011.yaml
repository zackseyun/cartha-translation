  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: tl
  text: Sapagkat ang kasalanan, nang samantalahin ang pagkakataon sa pamamagitan ng utos[a], ay nilinlang ako at sa pamamagitan nito[b] ay pinatay ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang magkaroon ng pagkakataon sa pamamagitan ng utos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “nito” ay tumutukoy sa utos.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang pahayag at angkop sa marangal ngunit makabagong Filipino.
- source_word: ἡ ἁμαρτία
  choice: ang kasalanan
  rationale: Karaniwang katumbas ito at pinananatili ang paglalarawan ni Pablo sa kasalanan bilang aktibong gumagawa.
- source_word: ἀφορμὴν λαβοῦσα
  choice: nang samantalahin ang pagkakataon
  rationale: Ipinahahayag ng parirala ang paggamit o pagsasamantala sa isang pagkakataon; natural ito sa Filipino at pinananatili ang agresibong pagkilos ng kasalanan.
- source_word: διὰ τῆς ἐντολῆς
  choice: sa pamamagitan ng utos
  rationale: Malinaw na ipinapahayag ang instrumental na gamit ng διά at pinananatili ang isahang ‘utos.’
- source_word: ἐξηπάτησέν με
  choice: dinaya ako
  rationale: Direkta at natural na salin ng pandiwa at ng tahasang layong ‘ako,’ nang hindi labis na pinatitindi ang kahulugan.
- source_word: δι’ αὐτῆς
  choice: sa pamamagitan nito
  rationale: Pinananatili ang panghalip ng Griyego at ang instrumental na diwa; tinutukoy nito ang ‘utos.’
- source_word: ἀπέκτεινεν
  choice: pinatay ako
  rationale: Natural at tuwirang katumbas sa modernong Filipino, at pinananatili ang matinding bunga ng pagkilos ng kasalanan.
theological_decisions:
- issue: Antas ng personipikasyon ng kasalanan
  choice: Iniharap ang kasalanan bilang aktibong tagaganap na nagsamantala, nandaya, at pumatay.
  alternative: Palabnawin ang personipikasyon sa pamamagitan ng paglalarawan sa kasalanan bilang di-aktibong konsepto o impluwensiya.
  rationale: Ang kasalanan ang gramatikal na simuno ng magkakasunod na kilos sa Griyego. Pinananatili ng salin ang retorikal at teolohikal na tensiyong ito nang walang idinagdag na paliwanag.
- issue: Tinutukoy ng αὐτῆς sa δι’ αὐτῆς
  choice: Pinanatili ang ‘nito,’ na tumutukoy sa utos, at nilinaw sa talababa.
  alternative: Ulitin sa teksto ang ‘sa pamamagitan ng utos.’
  rationale: Ang pambabaeng isahang panghalip ay tumutugma sa ἐντολή (‘utos’). Ang panghalip sa pangunahing teksto ay mas malapit sa anyo ng Griyego, habang iniiwasan ng talababa ang kalituhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang masiglang personipikasyon ng kasalanan at ang pagkakasunod ng mga kilos, habang ginawang natural ang participial construction sa pamamagitan ng ‘nang.’
