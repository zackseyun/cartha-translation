  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: tl
  text: Ngunit nakikita ko ang isa pang kautusan[a] sa mga bahagi ng aking katawan, na nakikipagdigma laban sa kautusan ng aking isip at bumibihag sa akin sa ilalim ng kautusan ng kasalanan[b] na nasa mga bahagi ng aking katawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kautusan” sa mga inuulit na gamit dito ay maaari ding unawaing “prinsipyo” o “kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bumibihag sa akin sa kautusan ng kasalanan.” Ipinahahayag ng “sa ilalim ng” ang diwa ng pagkabihag sa kapangyarihan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: nakikita ko
  rationale: Pinananatili nito ang pangkasalukuyang, tuwirang pagkilala ni Pablo at natural ito sa modernong Tagalog.
- source_word: ἕτερον
  choice: isa pang
  rationale: Malinaw nitong ipinapakita ang paghahambing sa naunang binanggit na kautusan nang hindi dinaragdagan ang diwa.
- source_word: νόμον / νόμῳ
  choice: kautusan
  rationale: Pinananatili sa lahat ng paglitaw ang iisang salitang inuulit ni Pablo, pati ang sadyang tensiyon sa pagitan ng kautusan ng isip at kautusan ng kasalanan.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: sa mga bahagi ng aking katawan
  rationale: Ipinahahayag nito ang konkretong anatomikal na larawan ng μέλη sa paraang mas malinaw sa ordinaryong mambabasang Tagalog kaysa sa literal ngunit di-likas na “mga sangkap ko.”
- source_word: ἀντιστρατευόμενον
  choice: nakikipagdigma laban sa
  rationale: Pinananatili ang matinding larawang militar at ang patuloy na pagsalungat.
- source_word: τοῦ νοός μου
  choice: ng aking isip
  rationale: Direkta at natural na katumbas ito ng νοῦς bilang panloob na kakayahang umunawa at magpasya.
- source_word: αἰχμαλωτίζοντά με
  choice: bumibihag sa akin
  rationale: Pinananatili nito ang larawan ng digmaan at pagkabihag.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: sa ilalim ng kautusan ng kasalanan
  rationale: Bagaman ἐν ang pang-ukol sa Griyego, malinaw na ipinahahayag ng “sa ilalim ng” ang pagkadala sa pagkabihag at pagpapasakop sa kapangyarihan ng kautusan ng kasalanan.
- source_word: ἁμαρτίας
  choice: kasalanan
  rationale: Ito ang tuwiran, pamantayan, at malinaw na salin.
theological_decisions:
- issue: Kung isasalin ang νόμος bilang “kautusan” o bibigyang-kahulugang “prinsipyo” o “kapangyarihan.”
  choice: Ginamit ang “kautusan” sa lahat ng paglitaw sa pangunahing teksto.
  alternative: Maaaring “prinsipyo” o “kapangyarihan” ang isa o higit pang paglitaw.
  rationale: Ang pag-uulit ng νόμος ay mahalaga sa retorika at pinananatili ang tensiyon sa pagitan ng kautusan ng isip at ng gumaganang puwersa ng kasalanan, sa halip na lutasin iyon sa mismong salin.
- issue: Kung ilalarawan ang αἰχμαλωτίζοντά με ἐν bilang pagkabihag “sa,” “sa ilalim ng,” o “para sa” kautusan ng kasalanan.
  choice: “bumibihag sa akin sa ilalim ng kautusan ng kasalanan”
  alternative: Mas literal na “bumibihag sa akin sa kautusan ng kasalanan.”
  rationale: Ang pangunahing teksto ay naghahatid ng ideya ng pagpapasakop sa kapangyarihan ng kasalanan, habang itinatala sa talababa ang anyong mas literal upang hindi maitago ang pagkakaiba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga bahagi ng aking katawan” para sa malinaw at natural na pagpapahayag ng μέλη, at pinanatili ang larawang militar sa “nakikipagdigma” at “bumibihag.”
