id: ROM.7.12
reference: Romans 7:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: tl
  text: Kaya ang kautusan ay banal, at ang utos ay banal, matuwid, at mabuti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahihiwatig nito ang kongklusyong nagmumula sa naunang pangangatwiran, sa natural at malinaw na Tagalog.
- source_word: νόμος
  choice: kautusan
  rationale: Pinananatili nito ang karaniwang pagtukoy sa batas, malamang sa Kautusan ni Moises sa konteksto, nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: ἅγιος
  choice: banal
  rationale: Ito ang likas at teolohikal na angkop na katumbas na nagpapahayag ng kabanalan at pagiging nakatalaga sa Diyos.
- source_word: ἐντολή
  choice: utos
  rationale: Natural itong Tagalog para sa isang tiyak na ipinag-uutos sa loob ng kautusan.
- source_word: δικαία
  choice: matuwid
  rationale: Ipinapahayag nito ang wastong moral na katangian ng utos at umaangkop sa bokabularyong Paulino.
- source_word: ἀγαθή
  choice: mabuti
  rationale: Tuwiran nitong pinananatili ang moral at kapaki-pakinabang na diwa ng salitang Griyego nang walang pagpapalawak.
- source_word: μὲν
  choice: hindi tahasang isinalin
  rationale: Nagbibigay ito ng bahagyang diin sa diskurso, ngunit likas sa Tagalog na manatili itong implicit dahil walang kasunod na katapat na δέ sa pangungusap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang pagkakaiba ng pangkalahatang “kautusan” at tiyak na “utos,” gayundin ang tatlong magkakaugnay na katangiang banal, matuwid, at mabuti.
