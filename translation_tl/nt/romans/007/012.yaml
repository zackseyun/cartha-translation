  source_fidelity: 'Tumpak ang salin sa ὥστε bilang “Kaya,” at malinaw na naipapahayag ang konklusibong ugnayan. Napapanatili ang pagkakaiba ng νόμος (“kautusan”) at ἐντολή (“utos”), gayundin ang tatlong panuring sa utos: “banal, matuwid, at mabuti.” Walang idinagdag o inalis na kahulugan.'
