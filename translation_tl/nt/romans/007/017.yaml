  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: tl
  text: Ngunit ngayon, hindi na ako ang gumagawa nito,[a] kundi ang kasalanang nananahan sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi na ako ang nagsasagawa nito, kundi ang kasalanang nananahan sa akin.”
    reason: Leksikal na alternatibo para sa κατεργάζομαι; pinananatili ang parehong diin at kahulugan.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Likas na ipinahahayag ang lohikal at pansamantalang paglipat at pinananatili ang pagsalungat sa naunang argumento.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Tuwirang ipinahahayag ang diwa ng ‘hindi na’ o pagtigil na nakapaloob sa Griyego.
- source_word: ἐγὼ
  choice: ako ang
  rationale: Pinananatili ng ayos na ito ang diin ng tahasang panghalip na ἐγώ sa natural na Tagalog.
- source_word: κατεργάζομαι
  choice: gumagawa
  rationale: Sa konteksto, tumutukoy ito sa pagsasagawa ng kilos na nabanggit; malinaw at natural ang ‘gumagawa’ nang hindi dinaragdagan ang kahulugan.
- source_word: αὐτὸ
  choice: nito
  rationale: Itinuturo nito ang kilos na nabanggit na sa konteksto; natural sa Tagalog ang ‘nito.’
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: ang kasalanang nananahan sa akin
  rationale: Pinananatili ang tahasang artikulo, ang participial na paglalarawan, at ang masidhing personipikasyon ng kasalanan.
- source_word: οἰκοῦσα
  choice: nananahan
  rationale: Pinananatili ang talinghaga ng paninirahan at ang marangal na himig ng Griyego nang mas angkop kaysa sa payak na ‘nabubuhay.’
theological_decisions:
- issue: Maaaring ipakahulugan ang pagkakaiba ng ‘ako’ at ng ‘kasalanang nananahan sa akin’ bilang pag-iwas sa pananagutan.
  choice: Pinanatili ang matalim na pagkakaibang inihahayag mismo ng talata nang walang paliwanag na nagpapalabnaw rito.
  alternative: Isalin nang malaya upang idiin lamang ang panloob na tunggalian o dagdagan ng paliwanag tungkol sa pananagutan.
  rationale: Sadyang matindi ang pagkakalahad ni Pablo. Dapat panatilihin ng salin ang tunay na teolohikal na tensiyon sa halip na tahimik itong lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang ‘nananahan’ upang mapanatili ang talinghaga at bigat ng pananalita; iniwasan ang pagpapaliwanag na wala sa teksto.
