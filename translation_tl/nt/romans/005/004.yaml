id: ROM.5.4
reference: Romans 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: tl
  text: at ang pagtitiis ay nagbubunga ng subok na pagkatao[a], at ang subok na pagkatao ay nagbubunga ng pag-asa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkataong napatunayang tunay,” o “pagiging karapat-dapat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: pagtitiis
  rationale: Likas at malinaw sa modernong Filipino; ipinahihiwatig nito ang patuloy na pagtitiyaga at pananatiling matatag sa gitna ng paghihirap.
- source_word: δοκιμή
  choice: subok na pagkatao
  rationale: Pinananatili nito ang diwang ang pagkatao ay dumaan sa pagsubok at napatunayang tunay, sa halip na tumukoy lamang sa pangkalahatang ugali.
- source_word: ἐλπίς
  choice: pag-asa
  rationale: Ito ang karaniwan at angkop na katumbas sa Filipino, at sapat na naihahayag ang pag-asang nakaugat sa Diyos ayon sa konteksto.
- source_word: δὲ
  choice: at
  rationale: Nag-uugnay ito ng magkakasunod na bunga sa argumento at hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ellipsis of κατεργάζεται
  choice: ay nagbubunga ng
  rationale: Inuulit sa diwa ang pandiwa mula sa naunang sugnay/talata at natural na ipinakikita ang sunod-sunod na bunga.
theological_decisions:
- issue: Kahulugan ng δοκιμή sa pagkakasunod-sunod ng paghubog
  choice: Katangiang nahubog sa pagsubok at napatunayang tunay (“subok na pagkatao”)
  alternative: Ang proseso ng pagsubok, o ang kalagayang sinang-ayunan/inaprubahan
  rationale: Sa hanay na ito, ang δοκιμή ang bunga ng pagtitiis, kaya mas malamang na tumutukoy sa napatunayang katangian kaysa sa mismong proseso ng pagsubok. Hindi nito dinaragdagan ang teksto ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “subok na pagkatao” upang mapanatili ang resultative at moral na diin ng δοκιμή; inilagay sa talababa ang mahahalagang alternatibo.
