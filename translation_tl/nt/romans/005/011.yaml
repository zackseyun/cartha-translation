id: ROM.5.11
reference: Romans 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: tl
  text: At hindi lamang iyon, kundi ipinagmamalaki rin natin ang Diyos[a] sa pamamagitan ng ating Panginoong Jesus na Mesiyas[b], na sa pamamagitan niya ay tinanggap na natin ngayon ang pagkakasundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbubunyi tayo sa Diyos” o “nagagalak tayo sa Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Griego Christos; tradisyunal na “Cristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: καυχώμενοι
  choice: ipinagmamalaki rin natin
  rationale: Pinananatili nito ang diwa ng pagmamapuri o mapagdiwang pagmamalaki, ngunit malinaw na ang Diyos—hindi ang sarili—ang ipinagmamalaki. Ang talababa ay nagbibigay ng mas celebratory na alternatibo.
- source_word: ἐν τῷ θεῷ
  choice: ang Diyos
  rationale: Sa kasamang pandiwang καυχάομαι, ang ἐν ay tumutukoy sa pinagbabatayan o pinagtutuunan ng pagmamapuri; natural itong ipinahahayag sa Filipino bilang tuwirang layon ng “ipinagmamalaki.”
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang marangal at malinaw na salin ng κύριος sa Kristolohikal na gamit nito rito.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Tungkulin o titulo ang Χριστός dito; mas malinaw na naihahayag ng “Mesiyas” ang kahulugan kaysa sa anyong pangalang “Cristo.”
- source_word: καταλλαγὴν
  choice: ang pagkakasundo
  rationale: Tumutukoy ito sa naibalik na ugnayan sa Diyos na inilarawan sa naunang talata. Pinananatili ng “ang” ang pagiging tiyak ng καταλλαγή na may pantukoy.
- source_word: ἐλάβομεν
  choice: tinanggap na natin ngayon
  rationale: Ipinahahayag ng “tinanggap” ang pagtanggap sa pagkakasundo bilang kaloob, samantalang ang “na … ngayon” ay nag-uugnay sa natapos na pangyayari at sa kasalukuyang bunga nito.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ bilang Kristolohikal na titulo
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatiling malinaw ang kahulugan ng Χριστός bilang ang Pinahiran o Mesiyas, sa halip na tratuhin lamang ito bilang bahagi ng pangalan.
- issue: Ang Diyos bilang pinagtutuunan ng καυχάομαι
  choice: ipinagmamalaki natin ang Diyos
  alternative: nagagalak tayo sa Diyos
  rationale: Mas malapit ang napiling salin sa lakas ng καυχάομαι at hindi nito ginagawang pagmamapuri sa sarili ang pahayag; ang mas malambot na diwang “nagagalak” ay inilagay bilang leksikal na alternatibo.
translation_notes:
  register: Gumamit ng moderno ngunit marangal na Filipino. Ang “Panginoong Jesus na Mesiyas” ay natural na nagpapakilala sa “Mesiyas” bilang titulo. Pinili ang “pagkakasundo” kaysa “pakikipagkasundo” upang hindi ipahiwatig na magkapantay na panig ang magkatuwang na nagsimula ng pagkakasundo; sa konteksto, tinanggap ito sa pamamagitan ni Jesus.
