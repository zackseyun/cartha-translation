id: ROM.5.17
reference: Romans 5:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: tl
  text: Sapagkat kung dahil sa paglabag ng isa ay naghari ang kamatayan sa pamamagitan ng taong iyon, lalo pang maghahari sa buhay, sa pamamagitan ng iisang tao—si Jesu-Cristo—ang mga tumatanggap ng kasaganaan ng biyaya at ng kaloob na katuwiran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaloob na katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: paglabag
  rationale: Ipinahihiwatig nito ang isang pagsuway o paglabag at angkop sa paghahambing ni Pablo kina Adan at Cristo nang hindi nagiging labis na teknikal.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: naghari / maghahari
  rationale: Pinananatili ng magkatugmang mga salita ang maharlikang metapora at ang sadyang paghahambing sa paghahari ng kamatayan at ng mga tumatanggap ng biyaya.
- source_word: περισσείαν
  choice: kasaganaan
  rationale: Likas na ipinahahayag nito ang labis at buong sukat ng biyaya.
- source_word: χάριτος
  choice: biyaya
  rationale: Ito ang malinaw at kinikilalang salin sa kontekstong Paulino, na saklaw ang di-karapat-dapat na pabor at mapagbigay na pagkilos ng Diyos.
- source_word: δωρεᾶς
  choice: kaloob
  rationale: Sapat nitong ipinahahayag ang bagay na ibinigay; ipinahihiwatig na rin ng katabing 'biyaya' na hindi ito pinaghirapan.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang 'katuwiran' ang pinakanatural na salin sa konteksto ng pagbibigay-matuwid, habang pinananatili sa talababa ang posibleng diwa ng katarungan.
- source_word: λαμβάνοντες
  choice: mga tumatanggap
  rationale: Ipinakikilala ng pangkasalukuyang participle ang mga taong nailalarawan sa pagtanggap, at likas ito sa modernong Tagalog.
- source_word: ἐν ζωῇ
  choice: sa buhay
  rationale: Pinananatili nito ang maikli at bahagyang bukas na pahayag ng Griyego at ang tahasang pagsalungat sa kamatayan.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa karaniwang modernong Tagalog, ang tambalang ito ay likas at pangalan-tulad; inilalagay sa talababa ang tahasang saling pamagat na 'Jesus na Mesiyas.'
theological_decisions:
- issue: Kahulugan ng δικαιοσύνης sa pariralang Paulino
  choice: kaloob na katuwiran
  alternative: kaloob na katarungan
  rationale: Ang 'katuwiran' ay pinakaangkop sa malapit na konteksto ng pagbibigay-matuwid at sa paghahambing kina Adan at Cristo, ngunit hindi isinasara ang mas malawak na diwa ng katarungan o wastong kaayusan.
- issue: Pagpapahayag sa Χριστοῦ sa Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  alternative: Jesus na Mesiyas
  rationale: Name-like ang buong parirala sa natural na gamit ng Tagalog; ang tahasang titular na kahulugan ng Χριστός ay pinananatili bilang alternatibo sa talababa.
- issue: Sino ang maghahari
  choice: ang mga tumatanggap ng kasaganaan ng biyaya at ng kaloob na katuwiran
  alternative: wala
  rationale: 'Pinananatili ang malinaw na paksa ng panghinaharap na pandiwa: ang mga tumatanggap mismo ang maghahari sa buhay sa pamamagitan ni Jesu-Cristo.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paulit-ulit na metapora ng paghahari at ang maigsi at posibleng malawak na pariralang “sa buhay.” Ginamit ang “isa” at “isang iyon” upang katawanin ang paulit-ulit na τοῦ ἑνός nang hindi labis na nagpapaliwanag sa mismong talata.
