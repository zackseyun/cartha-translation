revisions:
- from: Sapagkat kung dahil sa paglabag ng isa ay naghari ang kamatayan sa pamamagitan ng isang iyon, lalo pang maghahari sa buhay ang mga tumatanggap ng kasaganaan ng biyaya at ng kaloob na katuwiran[a], sa pamamagitan ng isang iyon—si Jesu-Cristo[b].
  to: Sapagkat kung dahil sa paglabag ng isa ay naghari ang kamatayan sa pamamagitan ng taong iyon, lalo pang maghahari sa buhay, sa pamamagitan ng iisang tao—si Jesu-Cristo—ang mga tumatanggap ng kasaganaan ng biyaya at ng kaloob na katuwiran[a].
  rationale: 'Inayos ang dalawang anaporikong parirala upang maging natural at malinaw sa modernong Tagalog: ang unang “isa” ay tinutukoy bilang “taong iyon,” at ang katapat na si Jesu-Cristo ay ipinahayag bilang “iisang tao.” Pinanatili ang royal na metapora, ang kontrast ng kamatayan at buhay, ang panghinaharap na “maghahari,” at ang mga umiiral na lexical na talababa.'
