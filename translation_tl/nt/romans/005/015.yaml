id: ROM.5.15
reference: Romans 5:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: tl
  text: Ngunit ang kaloob ay hindi katulad ng paglabag. Sapagkat kung dahil sa paglabag ng isang tao ay namatay ang marami, lalong higit na umapaw sa marami ang biyaya ng Diyos at ang kaloob na dulot ng biyaya ng iisang tao, si Jesus na Mesiyas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang kaloob sa biyaya” o “ang kaloob na nasa biyaya.”'
    reason: lexical_alternative
  - marker: b
    text: O “si Jesu-Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: paglabag
  rationale: Ipinahihiwatig nito ang isang maling gawa o pagsuway na may moral na bigat, habang nananatiling malinaw at karaniwan sa makabagong Filipino.
- source_word: χάρισμα
  choice: kaloob
  rationale: Likas na ipinapahayag ng “kaloob” ang bagay na ibinigay nang hindi inuulit sa mismong salita ang diwa ng biyaya na tahasang binabanggit sa kasunod na parirala.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: ang marami / sa marami
  rationale: Pinananatili nito ang tiyak na pagtutunggali ni Pablo sa pagitan ng isang tao at ng marami, nang hindi ito ipinapakahulugang “lahat.”
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ang biyaya ng Diyos
  rationale: Karaniwan at marangal na salin ito na malinaw na pinananatili ang Diyos bilang pinagmumulan ng biyaya.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: ang kaloob sa pamamagitan ng biyaya
  rationale: Ginagamit ang “sa pamamagitan ng” upang maipahayag ang maaaring instrumental na diwa ng ἐν, habang kinikilala sa talababa ang maaari ring ugnayang diwa nito.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ng isang tao
  rationale: Pinananatili nito ang paulit-ulit na paghahambing ng isa at ng marami; ang kasunod na pagkakakilanlan kay Jesus ang nagbibigay-linaw kung sino ang tinutukoy.
- source_word: Ἰησοῦ Χριστοῦ
  choice: si Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” na nananatiling makabuluhan sa paghahambing kay Adan, at ginagamit ang natural na anyong Filipino para sa pangalan at titulo.
- source_word: ἐπερίσσευσεν
  choice: umapaw
  rationale: Matingkad ngunit natural na naipapahayag ng “umapaw” ang labis at sumasaganang puwersa ng pandiwa, kaayon ng “lalo pa.”
theological_decisions:
- issue: Saklaw ng “ang marami” sa paghahambing kay Adan at kay Jesus
  choice: Panatilihin ang “ang marami” at “sa marami.”
  alternative: Isalin bilang “lahat” upang gawing tahasan ang kinatawang saklaw.
  rationale: Sadyang gumagamit ang talata ng retorikang isa/marami. Ang pagpapanatili nito ay hindi nagpasya nang higit sa sinasabi ng talata tungkol sa saklaw ng kaloob.
- issue: Ugnayan ng kaloob at biyaya sa ἡ δωρεὰ ἐν χάριτι
  choice: “ang kaloob sa pamamagitan ng biyaya”
  alternative: “ang kaloob na nasa biyaya” o “ang kaloob na dulot ng biyaya”
  rationale: Maaaring maging instrumental o associative ang ἐν. Pinili ang malinaw na instrumental na pagbasa sa pangunahing teksto ngunit inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang masinsing paghahambing ng “isang tao” at “ang marami,” gayundin ang paulit-ulit na bokabularyo ng kaloob at biyaya. Ginamit ang gitling bago ang pagkakakilanlan kay Jesus upang maging malinaw ang mahabang pangungusap.
