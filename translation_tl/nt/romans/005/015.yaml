revisions:
- from: Ngunit ang kaloob ay hindi katulad ng paglabag.[a] Sapagkat kung dahil sa paglabag ng isang tao ay namatay ang marami, lalo pang umapaw sa marami ang biyaya ng Diyos at ang kaloob sa pamamagitan ng biyaya ng isang tao—si Jesus na Mesiyas.[b]
  to: Ngunit ang kaloob ay hindi katulad ng paglabag. Sapagkat kung dahil sa paglabag ng isang tao ay namatay ang marami, lalong higit na umapaw sa marami ang biyaya ng Diyos at ang kaloob na dulot ng biyaya ng iisang tao, si Jesus na Mesiyas.[a][b]
  rationale: Pinahusay ang antas ng «much more», nilinaw ang minarkahang isa/marami na paghahambing, at inayos ang footnote anchor upang tumukoy ito sa ἡ δωρεὰ ἐν χάριτι. Pinanatili ang hindi pa nilulutas na saklaw ng «ang marami» at ang pagsasalin ng Χριστός bilang «Mesiyas».
