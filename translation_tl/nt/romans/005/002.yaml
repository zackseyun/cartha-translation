  to: Sa pamamagitan niya, nagkaroon din tayo ng daan patungo sa biyayang ito sa pamamagitan ng pananampalataya, na kinatatayuan natin; at ipinagmamalaki natin[a] ang pag-asa sa kaluwalhatian ng Diyos.
