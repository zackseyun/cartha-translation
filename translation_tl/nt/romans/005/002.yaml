id: ROM.5.2
reference: Romans 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: tl
  text: Sa pamamagitan niya, nagkaroon din tayo ng daan patungo sa biyayang ito sa pamamagitan ng pananampalataya, na kinatatayuan natin; at ipinagmamalaki natin[a] ang pag-asa sa kaluwalhatian ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagagalak tayo” o “nagbubunyi tayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Sa pamamagitan niya
  rationale: Likas at malinaw na tumutukoy sa pamamagitan ni Jesu-Cristo na binanggit sa naunang talata, nang hindi inuulit ang pangalang wala sa mismong sugnay.
- source_word: προσαγωγή
  choice: daan tungo
  rationale: Ipinahahayag nito ang pagkakaroon ng access o paglapit sa isang kalagayan, habang nananatiling natural sa modernong Tagalog.
- source_word: τῇ πίστει
  choice: sa pananampalataya
  rationale: 'Pinananatili ang instrumental na diwa ng datibo: ang pananampalataya ang paraan ng pagkakaroon ng daan.'
- source_word: χάριν
  choice: biyaya
  rationale: Ito ang malinaw at nakaugaliang salin sa kontekstong Paulino para sa mapagbiyayang pabor ng Diyos.
- source_word: ἑστήκαμεν
  choice: kinatatayuan natin ngayon
  rationale: Ipinakikita ng anyong ganap sa Griyego ang kasalukuyang kalagayang bunga ng naunang pangyayari; nililinaw ng “ngayon” ang nagpapatuloy na kalagayan nang hindi dinaragdagan ang teolohikal na kahulugan.
- source_word: καυχώμεθα
  choice: ipinagmamalaki natin
  rationale: Pinananatili nito ang sadyang matapang at bahagyang nakakagulat na puwersa ng pandiwa, sa halip na agad itong palambutin bilang simpleng kagalakan.
- source_word: ἐπ’ ἐλπίδι
  choice: ang pag-asa sa
  rationale: Natural na inuugnay ang pagmamalaki sa pag-asa, habang hindi mahigpit na nagpapasya kung ang pag-asa ang larangan o batayan nito.
- source_word: δόξης τοῦ θεοῦ
  choice: kaluwalhatian ng Diyos
  rationale: Tuwirang pinananatili ang kayariang henitibo at ang maringal na himig ng Griyego nang hindi ipinapasok kung ito ay pagkakita, pagtanggap, o pakikibahagi sa kaluwalhatian.
theological_decisions:
- issue: Ang positibong gamit ni Pablo sa καυχώμεθα
  choice: ipinagmamalaki natin
  alternative: nagagalak tayo / nagbubunyi tayo
  rationale: Maaaring tumukoy ang pandiwa sa matinding kagalakan o pagbubunyi, ngunit pinananatili ng “ipinagmamalaki” ang retorikal at teolohikal na tensiyon ng positibong pagmamalaki na nakatuon sa pag-asa sa Diyos.
- issue: Ang kahulugan ng “pag-asa sa kaluwalhatian ng Diyos”
  choice: panatilihin ang payak na henitibong parirala
  alternative: pag-asang makabahagi sa kaluwalhatian ng Diyos
  rationale: Hindi tahasang sinasabi ng parirala kung ang kaluwalhatian ay makikita, matatamo, o pagbabahaginan; kaya hindi idinagdag sa pangunahing teksto ang isang tiyak na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “daan tungo” sa halip na teknikal na “akses,” at pinanatili ang masidhing “ipinagmamalaki” upang huwag pakinisin ang tensiyon ng orihinal.
