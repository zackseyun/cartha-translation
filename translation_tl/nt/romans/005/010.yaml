  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: tl
  text: Sapagkat kung, habang kaaway pa tayo, ipinagkasundo tayo sa Diyos sa pamamagitan ng kamatayan ng kanyang Anak, lalo pa nga tayong maliligtas sa pamamagitan ng kanyang buhay ngayong ipinagkasundo na tayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maliligtas tayo sa kanyang buhay.”
    reason: Pinananatili ang posibleng locative o associative na diwa ng ἐν, bukod sa instrumental na pagbasa sa pangunahing teksto.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili ang ugnayang nangangatwiran ng γάρ at ang kondisyunal na anyo ng εἰ.
- source_word: ἐχθροὶ ὄντες
  choice: noong mga kaaway pa tayo
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa dating kalagayan ng pakikipag-alit bago ang pagkakasundo.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: ipinagkasundo tayo sa Diyos
  rationale: Ang pasibong anyo ay nagpapanatiling Diyos ang kaugnay na hantungan ng pagkakasundo, nang hindi tahasang nagdaragdag kung sino ang kumilos.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: sa pamamagitan ng kamatayan ng kanyang Anak
  rationale: Tumpak na ipinapahayag ang instrumental na gamit ng διά at pinananatili ang katawagang Anak.
- source_word: πολλῷ μᾶλλον
  choice: lalo pa nga
  rationale: Natural na Tagalog na nagpapanatili sa mariing a-fortiori na pangangatwiran ni Pablo.
- source_word: καταλλαγέντες
  choice: ngayong ipinagkasundo na tayo
  rationale: Ipinakikita ang naunang natapos na pagkakasundo bilang saligan ng susunod na kaligtasan.
- source_word: σωθησόμεθα
  choice: maliligtas tayo
  rationale: Pinananatili ang tahasang panghinaharap na anyo at ang karaniwang kahulugang teolohikal ng σῴζω.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: sa pamamagitan ng kanyang buhay
  rationale: Binabasa ang ἐν bilang instrumental, kaagapay ng pagkakasalungat ng kamatayan at buhay, habang inilalahad sa talababa ang tunay na locative/associative na posibilidad.
theological_decisions:
- issue: Lakas ng ἐν τῇ ζωῇ αὐτοῦ
  choice: 'instrumental: “sa pamamagitan ng kanyang buhay”'
  alternative: 'locative/associative: “sa kanyang buhay”'
  rationale: Sinusuportahan ng kaagapay na pariralang “sa pamamagitan ng kamatayan ng kanyang Anak” ang instrumental na pagbasa, ngunit hindi ganap na inaalis ng Griyego ang diwang “sa kanyang buhay”; kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinagkasundo” upang mapanatili ang pasibong tinig at ang relasyonal na diwa, at “lalo pa nga” upang maipahayag nang natural ang mariing pangangatwiran.
