id: ROM.5.19
reference: Romans 5:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: tl
  text: Sapagkat kung paanong sa pamamagitan ng pagsuway ng isang tao ay ginawang mga makasalanan ang marami[a], gayundin naman sa pamamagitan ng pagsunod ng isang tao[b] ay gagawing matuwid ang marami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inilagay sa kalagayan ng mga makasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “sa pamamagitan ng pagsunod ng isa”; idinagdag ang “tao” upang luminaw ang pagkakatulad sa unang bahagi ng pangungusap.
    reason: lexical_alternative
  - marker: c
    text: O “ilalagay sa kalagayan ng mga matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: pagsuway
  rationale: Tuwirang ipinapahayag nito ang hindi pagsunod at malinaw na ipinaparis sa ὑπακοή, “pagsunod.”
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ng isang tao
  rationale: Likas ito sa modernong Tagalog at pinananatili ang pagtukoy sa nag-iisang taong inilalarawan sa konteksto, nang hindi idinaragdag ang pangalang Adan sa talata.
- source_word: ἁμαρτωλοὶ
  choice: mga makasalanan
  rationale: Ang pang-uri ay ginagamit bilang katawagan sa mga tao; “mga makasalanan” ang malinaw at karaniwang katumbas.
- source_word: κατεστάθησαν
  choice: ginawa
  rationale: Ipinahahayag ng καθίστημι rito ang paglalagay o pagkakatatag sa isang kalagayan. Ang “ginawa” ay natural at hindi nagpapasok ng mas makitid na doktrinal na paliwanag.
- source_word: οἱ πολλοί
  choice: ang marami
  rationale: Pinananatili ng “ang marami” ang tiyak na anyo ng Griyegong parirala at hindi ito ipinapakahulugang “lahat.”
- source_word: ὑπακοῆς
  choice: pagsunod
  rationale: Ito ang natural na katapat ng “pagsuway” at pinananatili ang paghahambing ng dalawang sugnay.
- source_word: τοῦ ἑνὸς
  choice: ng isang tao
  rationale: Bagaman “ng isa” lamang ang literal na nasa ikalawang sugnay, malinaw na ipinagpapatuloy nito ang “isang tao” sa unang sugnay. Inulit ang “tao” para sa malinaw at natural na paralelismo sa Tagalog, at itinuro ito sa talababa.
- source_word: δίκαιοι
  choice: matuwid
  rationale: Ang “matuwid” ang malinaw at karaniwang katumbas ng δίκαιος sa kontekstong Paulino.
- source_word: κατασταθήσονται
  choice: gagawin
  rationale: Pinananatili nito ang hinaharap na panahunan at ang pormal na pagkakatulad sa “ginawa” sa unang sugnay, nang hindi ito pinapalitan ng mas interpretatibong “ipahahayag na matuwid.”
theological_decisions:
- issue: Kung ang οἱ πολλοί ay isasaling “ang marami” o bibigyang-kahulugang “lahat.”
  choice: ang marami
  alternative: lahat
  rationale: Ang aktuwal na parirala ni Pablo ay οἱ πολλοί. Pinananatili ng salin ang saklaw na ipinahayag ng teksto sa halip na lutasin ang teolohikal na tanong sa pamamagitan ng salin.
- issue: Kung ang κατασταθήσονται δίκαιοι ay isasaling pananalitang kalagayan o bilang mas interpretatibong “ipahahayag na matuwid.”
  choice: gagawing matuwid
  alternative: ipahahayag na matuwid
  rationale: Καθίστημι ang ginamit, hindi δικαιόω. Ang “gagawing matuwid” ay mas malapit sa anyo ng Griyego at hindi nagpapasiya kung paano dapat ipaliwanag sa doktrina ang pagiging matuwid.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang balanseng paralelismo ng “pagsuway/pagsunod,” “ginawa/gagawin,” at “mga makasalanan/matuwid.” Pinanatili ang “ang marami” upang huwag palitan ng interpretasyon ang saklaw ng Griyegong οἱ πολλοί.
