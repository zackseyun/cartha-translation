  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: tl
  text: Sapagkat habang mahihina pa tayo, sa tamang panahon ay namatay ang Mesiyas para sa mga di-makadiyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alang-alang sa mga di-makadiyos.”
    reason: Pinananatili ang posibleng diwa ng ὑπὲρ bilang pagkilos para sa kapakanan o bilang kinatawan ng iba.
lexical_decisions:
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Isinalin ang titulong Χριστός bilang “Mesiyas,” alinsunod sa gamit nito rito bilang titulo; natural sa Filipino ang pantukoy na “ang.”
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: noong mahihina pa tayo
  rationale: Ginawang sugnay na panahunan ang genitive absolute. Pinananatili ng “mahihina” ang malawak na diwa ng kawalan ng lakas o kakayahan nang hindi ito nililimitahan sa pisikal na kahinaan.
- source_word: ἔτι
  choice: pa
  rationale: Ang “pa” ay natural na nagpapahayag ng nagpapatuloy na kalagayan. Hindi na inulit ang adverb dahil magiging mabigat at di-likas iyon sa Filipino.
- source_word: κατὰ καιρὸν
  choice: sa tamang panahon
  rationale: Ipinahahayag nito ang angkop na panahon nang hindi tahasang nagpapasok ng interpretasyong “itinalaga,” bagaman maaari ring taglayin ng parirala ang gayong pahiwatig.
- source_word: ὑπὲρ
  choice: para sa
  rationale: Natural itong Filipino at pinananatiling bukas ang saklaw sa kapakinabangan, pagkatawan, o paghahalili nang hindi nilulutas ang eksaktong ugnayan.
- source_word: ἀσεβῶν
  choice: mga di-maka-Diyos
  rationale: Pinananatili nito ang tuwirang moral at panrelihiyong diwa ng kawalan ng paggalang o debosyon sa Diyos, sa halip na gawing pangkalahatang “masasama.”
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at sapat na katumbas ng aorist na pandiwa; walang kailangang pagpapalawak.
theological_decisions:
- issue: Diwa ng kamatayan ng Mesiyas na ipinahahayag ng ὑπὲρ ἀσεβῶν
  choice: para sa mga di-maka-Diyos
  alternative: alang-alang sa mga di-maka-Diyos
  rationale: Malinaw na ang kamatayan ng Mesiyas ay ukol sa kapakanan ng mga di-maka-Diyos, ngunit hindi dapat gawing mas tiyak ng salin ang eksaktong uri ng pagkatawan o paghahalili kaysa sa ipinahihintulot ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “Mesiyas” para sa Χριστός, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
