  source_fidelity: 'Tapat ang salin sa Griyego: pinananatili nito ang mariing pagsalungat ng “Ngunit,” ang personipikadong paghahari ng kamatayan, ang saklaw na mula Adan hanggang Moises, at ang nakakagulat na “maging” sa mga hindi nagkasala gaya ng pagsuway ni Adan. Ang hiwalay na pangungusap tungkol kay Adan ay wastong nagpapahayag ng relatibong sugnay na ὅς ἐστιν τύπος τοῦ μέλλοντος.'
  naturalness: Natural at marangal ang modernong Filipino Tagalog. Ang “sa paraang katulad ng pagsuway ni Adan” ay malinaw at hindi labis na nagpapakahulugan sa ἐπὶ τῷ ὁμοιώματι.
