id: ROM.5.14
reference: Romans 5:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: tl
  text: Ngunit naghari ang kamatayan mula kay Adan hanggang kay Moises, maging sa mga hindi nagkasala sa paraang katulad ng pagsuway ni Adan. Si Adan ay larawan[a] ng darating[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwaran” o “paunang larawan.”
    reason: lexical_alternative
  - marker: b
    text: Sa konteksto, ang “darating” ay tumutukoy kay Cristo.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat sa naunang pahayag at angkop sa marangal na makabagong Tagalog.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: naghari ang kamatayan
  rationale: Pinananatili ang larawan ng maharlikang paghahari at ang personipikasyon sa kamatayan.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: mula kay Adan hanggang kay Moises
  rationale: Natural na Tagalog para sa takdang saklaw ng panahon.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: maging sa mga hindi nagkasala
  rationale: Ipinakikita ng “maging” ang nakakagulat na lawak ng paghahari ng kamatayan.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: sa paraang katulad ng pagsuway ni Adan
  rationale: Natural ngunit malapit sa diwa ng paghahambing; hindi nito ipinapasiya kung anong tiyak na aspeto ng kasalanan ni Adan ang tinutukoy.
- source_word: παράβασις
  choice: pagsuway
  rationale: Karaniwang nauunawaan at ipinahihiwatig ang paglabag sa isang utos o hangganan.
- source_word: τύπος
  choice: larawan
  rationale: Naipahahayag ang ugnayang tipolohikal bilang huwaran o paunang paglalarawan nang hindi gumagamit ng teknikal at di-likas na “tipo.”
- source_word: τοῦ μέλλοντος
  choice: ng darating
  rationale: Pinananatili ang di-tahasang pagtukoy ng Griyego sa isang taong darating, nang hindi direktang ipinapasok ang pangalang Cristo sa pangunahing teksto.
theological_decisions:
- issue: Ang kaugnayan ng οἱ μὴ ἁμαρτήσαντες sa pagsuway ni Adan
  choice: mga hindi nagkasala sa paraang katulad ng pagsuway ni Adan
  alternative: mga hindi nagkasala ng pagsuway na katulad ng kay Adan
  rationale: Pinananatili ang paghahambing at hindi nilulutas kung ang pagkakatulad ay pangunahing tumutukoy sa paraan, uri, o kalagayan ng pagkakasala.
- issue: Ang tinutukoy ng τοῦ μέλλοντος
  choice: ang darating, na ipinapaliwanag sa talababa bilang si Cristo sa konteksto
  alternative: tahasang “Cristo” sa pangunahing teksto
  rationale: Sa Roma 5:12–21, si Cristo ang malinaw na katapat ni Adan, ngunit hindi Siya tahasang pinangalanan sa pariralang Griyego rito; kaya pinananatili ang anyo ng teksto.
- issue: Ang kahulugan ng τύπος
  choice: larawan
  alternative: huwaran; paunang larawan
  rationale: Ipinapakita ang tipolohikal na pagtutugma ni Adan sa darating nang hindi ipinapalagay na magkapareho sila sa lahat ng bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang personipikasyon ng kamatayan at ang di-tahasang anyo ng “darating,” habang ipinaliwanag sa talababa ang kontekstuwal na tinutukoy.
