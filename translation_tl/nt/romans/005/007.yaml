base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: tl
  text: Sapagkat bihirang may taong mamamatay para sa isang taong matuwid[b][a]; ngunit marahil ay may taong mangangahas pa ngang mamatay para sa isang taong mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking matuwid.” Panlalaki ang anyong gramatikal sa Griyego, ngunit malamang na pangkalahatan ang tinutukoy rito.
    reason: lexical_alternative
  - marker: b
    text: Maaaring sinadya ang pagkakaiba ng “matuwid” at “mabuti,” at hindi lamang ito pagkakaiba sa estilo.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: bihirang
  rationale: Ipinahahayag ang napakadalang na posibilidad ng gayong pagkamatay at natural ito sa makabagong Tagalog.
- source_word: ὑπὲρ
  choice: para sa
  rationale: Likas na Tagalog na nagsasaad ng pagkilos alang-alang sa kapakanan ng iba, nang hindi labis na nililinaw ang posibleng diwang pamalit o kinatawan.
- source_word: δικαίου
  choice: isang taong matuwid
  rationale: Ang pang-uri ay ginagamit bilang pangngalan para sa taong may katangian ng pagiging matuwid; pinananatili ng “matuwid” ang moral na kategorya at ang “tao” ang pangkalahatang saklaw.
- source_word: ἀποθανεῖται
  choice: mamamatay
  rationale: Tuwirang pinananatili ang anyong panghinaharap ng Griyego sa isang pangkalahatang pahayag.
- source_word: τοῦ ἀγαθοῦ
  choice: isang taong mabuti
  rationale: Natural sa Tagalog at pinananatili ang posibleng pagkakaiba ng “matuwid” at “mabuti” sa argumento ni Pablo.
- source_word: τάχα
  choice: marahil
  rationale: Nagsasaad ng posibilidad nang hindi ito ginagawang tiyak at angkop sa marangal na rehistro.
- source_word: καὶ
  choice: pa ngang
  rationale: 'Ginagamit nang pasidhi: itinatampok na baka umabot pa ang isang tao sa pangangahas na mamatay.'
- source_word: τολμᾷ
  choice: may mangangahas
  rationale: Natural na inilalahad sa Tagalog ang pangkalahatan ngunit hindi tiyak na posibilidad na ipinahihiwatig kasama ng τάχα.
- source_word: ἀποθανεῖν
  choice: mamatay
  rationale: Tuwirang salin na pinananatili ang pag-uulit ng tema ng kamatayan sa dalawang sugnay.
theological_decisions:
- issue: Kung pananatilihin ang pagkakaiba ng δικαίου at ἀγαθοῦ
  choice: Isinalin nang magkaiba bilang “taong matuwid” at “taong mabuti.”
  alternative: Ituring ang mga ito bilang halos magkasingkahulugan at gumamit ng iisang paglalarawan.
  rationale: Maaaring sinadya ang pag-usad mula sa matuwid tungo sa mabuti; ang pagpapanatili ng magkaibang termino ay hindi nagpapawalang-bisa sa tunay na tensiyon ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkaugnay ngunit posibleng magkaibang paglalarawang “matuwid” at “mabuti,” gayundin ang maingat na himig ng posibilidad sa ikalawang sugnay.
