  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: tl
  text: Sapagkat bago pa ibigay ang Kautusan, nasa sanlibutan na ang kasalanan; ngunit hindi ibinibilang[a] ang kasalanan kapag walang Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isinisingil sa pananagutan ng isang tao” o “itinatala sa kanyang pananagutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Sapagkat bago pa dumating ang Kautusan
  rationale: Ipinahahayag nito ang panahong humahantong sa pagdating ng Kautusan. Mas natural ito sa modernong Tagalog kaysa sa literal na “hanggang sa Kautusan,” habang hindi tahasang dinaragdagan ang teksto ng pagtukoy kay Moises.
- source_word: νόμου
  choice: ang Kautusan
  rationale: Sa konteksto ng Roma 5:14, malamang na Kautusan ni Moises ang tinutukoy. Ang malaking titik at tiyak na anyo ay nagpapahiwatig nito nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: ἁμαρτία
  choice: ang kasalanan
  rationale: Pinananatili ng pang-isahang abstraktong anyo ang karaniwang gamit ni Pablo at ang maaaring bahagyang personipikadong puwersa nito.
- source_word: ἐν κόσμῳ
  choice: nasa sanlibutan
  rationale: Natural at marangal na katumbas para sa presensya ng kasalanan sa daigdig ng sangkatauhan.
- source_word: ἐλλογεῖται
  choice: ibinibilang
  rationale: Pinananatili nito ang diwang pangkuwenta o pagsingil sa pananagutan nang hindi gumagamit ng mabigat at teknikal na terminong teolohikal.
- source_word: μὴ ὄντος νόμου
  choice: kapag walang kautusan
  rationale: Malinaw na ipinapahayag ang kawalan ng kautusan bilang kondisyong kaugnay ng hindi pagbibilang sa kasalanan.
theological_decisions:
- issue: Tinutukoy ng νόμος sa pangangatwiran ni Pablo
  choice: Isinaling “ang Kautusan,” na kontekstuwal na nagpapahiwatig sa Kautusan ni Moises.
  alternative: Isaling pangkalahatan bilang “kautusan” nang walang tiyak na pahiwatig.
  rationale: Inihahambing ng konteksto ang panahon mula kay Adan hanggang kay Moises, kaya malamang na ang Kautusan ni Moises ang tinutukoy; gayunman, hindi idinagdag ang pangalan ni Moises sa talata.
- issue: Lakas ng kahulugan ng ἐλλογεῖται
  choice: Ginamit ang di-teknikal na “ibinibilang” sa pangunahing teksto.
  alternative: “Isinisingil sa pananagutan” o “ipinapataw sa account.”
  rationale: May diwang pangkuwenta at pananagutan ang pandiwa, ngunit hindi dapat lutasin ng salin ang mga pagtatalong teolohikal tungkol sa imputasyon. Inilagay sa talababa ang mas tahasang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sanlibutan” bilang pamilyar na terminong biblikal ngunit nananatiling nauunawaan ng karaniwang mambabasa. Inilipat ang talababa sa “ibinibilang,” sapagkat doon tumutugma ang ibinigay na leksikal na alternatibo.
