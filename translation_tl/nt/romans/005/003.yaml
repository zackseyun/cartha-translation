  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: tl
  text: At hindi lamang iyon, kundi nagagalak[a] din tayo sa mga paghihirap[b], sapagkat alam nating ang paghihirap ay nagbubunga ng pagtitiyaga[c].
  philosophy: optimal-equivalence
