lexical_decisions:
- source_word: καυχώμεθα
  choice: nagagalak
  rationale: Ipinahahayag nito ang positibo at may pagtitiwalang pagbubunyi sa konteksto, nang hindi kusang ipinahihiwatig ang mapagmataas na pagyayabang. Nasa talababa ang mas literal na mga alternatibo.
- source_word: ἐν ταῖς θλίψεσιν
  choice: sa gitna ng mga paghihirap
  rationale: Natural nitong ipinahahayag ang pagdanas ng matinding hirap o kagipitan habang pinananatili ang maramihang anyo ng unang pagbanggit.
- source_word: ἡ θλῖψις
  choice: ang paghihirap
  rationale: Pinananatili ang paglipat ng Griyego mula sa maramihang mga karanasan tungo sa isahang pangkalahatang simulain.
- source_word: ὑπομονήν
  choice: pagtitiyaga
  rationale: Malinaw at pangkasalukuyang salita ito para sa matatag at patuloy na paninindigan sa ilalim ng hirap; hindi lamang ito pasibong pagtitiis.
- source_word: κατεργάζεται
  choice: nagbubunga
  rationale: Natural sa Filipino at malinaw na ipinahahayag na ang paghihirap ay humahantong sa o lumilikha ng pagtitiyaga.
- source_word: εἰδότες
  choice: sapagkat alam nating
  rationale: Natural na isinasalin ang participle bilang sugnay na nagbibigay ng batayan sa paggalak, ayon sa lohikal na ugnayan ng pangungusap.
theological_decisions:
- issue: Diwa ng καυχώμεθα sa positibong espirituwal na konteksto
  choice: nagagalak
  alternative: ipinagmamalaki; nagbubunyi
  rationale: Tinutukoy ni Pablo ang may pagtitiwalang kagalakan sa gitna ng paghihirap, hindi ang mapagmataas na pagpuri sa sarili. Gayunman, inilalahad sa talababa ang mas literal na saklaw ng salita upang hindi maikubli ang leksikal na tensiyon.
- issue: Ugnayan ng paghihirap at pagtitiyaga
  choice: ang paghihirap ay nagbubunga ng pagtitiyaga
  alternative: ang paghihirap ay gumagawa ng pagtitiyaga
  rationale: Pinananatili ang tuwirang pahayag ni Pablo tungkol sa bunga ng paghihirap nang hindi nagdaragdag ng paliwanag kung paano o sa ilalim ng anong mga kondisyon ito nangyayari.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “sa gitna ng” upang maging malinaw at idiomatiko ang ἐν nang hindi nagdaragdag ng panghalip na wala sa Griyego. Pinanatili ang paglipat mula sa maramihang “mga paghihirap” tungo sa isahang “ang paghihirap.”
