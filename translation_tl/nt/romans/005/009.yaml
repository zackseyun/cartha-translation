  terminology: Ang “pinawalang-sala” ay isang angkop na hudisyal na katumbas ng δικαιωθέντες sa pangunahing teksto, at ang talababa na “ipinahayag na matuwid” ay nagbibigay ng kapaki-pakinabang na malapit na alternatibo. Ang “poot” ay wastong pinananatiling walang tahasang idinagdag na taglay sa pangunahing teksto; nililinaw lamang ito ng talababa ayon sa konteksto.
