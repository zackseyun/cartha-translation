  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: tl
  text: Kaya nga, ngayong pinawalang-sala na tayo[a] sa pamamagitan ng kanyang dugo[b], lalo pa tayong ililigtas sa pamamagitan niya mula sa poot.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ipinahayag na matuwid.”
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na anyo, “sa kanyang dugo.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang poot ng Diyos na ipinahihiwatig ng konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Kaya nga ... lalo pa
  rationale: Pinananatili ng “kaya nga” ang lohikal na ugnayan sa naunang talata, at ng “lalo pa” ang pinatinding paghahambing ni Pablo, sa natural na ayos ng modernong Tagalog.
- source_word: δικαιωθέντες
  choice: pinawalang-sala na tayo
  rationale: Ipinahahayag nito ang natapos nang kilos bago ang panghinaharap na pagliligtas at pinananatili ang hudisyal na diwa ng δικαιόω sa konteksto ni Pablo.
- source_word: νῦν
  choice: ngayong ... na
  rationale: Natural na ipinahahayag sa Tagalog ang kasalukuyang kalagayang bunga ng naganap nang pagpapawalang-sala.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: sa pamamagitan ng kanyang dugo
  rationale: Ang ἐν ay nagpapahayag dito ng paraan o batayan; malinaw at likas sa Tagalog ang “sa pamamagitan ng” habang pinananatili ang tahasang pagtukoy sa dugo.
- source_word: σωθησόμεθα
  choice: ililigtas ... tayo
  rationale: Pinananatili ng anyong panghinaharap at balintiyak ang pagliligtas na mangyayari pa at ang Diyos bilang di-tahasang gumagawa.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Tumpak na ipinahahayag ang ahensiya o pamamagitan na taglay ng διά na may genitive.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: mula sa poot
  rationale: Pinananatili ang tahasang salita ng Griyego nang hindi idinaragdag sa pangunahing teksto kung kanino ang poot, bagaman malinaw iyon sa konteksto.
theological_decisions:
- issue: Kahulugan ng δικαιωθέντες
  choice: pinawalang-sala
  alternative: ipinahayag na matuwid
  rationale: Ang “pinawalang-sala” ay likas at dignified na modernong Tagalog para sa hudisyal na wika ni Pablo. Inilalagay sa talababa ang malapit na alternatibo upang hindi ikubli ang lawak ng salita.
- issue: Tinutukoy ng τῆς ὀργῆς
  choice: poot
  alternative: poot ng Diyos
  rationale: Malakas na ipinahihiwatig ng konteksto na ito ang poot ng Diyos, ngunit walang tahasang θεοῦ sa talata; kaya hindi ito idinagdag sa pangunahing teksto.
- issue: Ugnayan ng dugo ni Cristo sa pagpapawalang-sala
  choice: sa pamamagitan ng kanyang dugo
  alternative: sa kanyang dugo
  rationale: Ipinahahayag ng pangunahing salin ang paraang instrumental o batayan nang hindi pinalalawak sa isang partikular na teorya ng pagtubos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “pinawalang-sala” sa halip na mas lumang “inaring-ganap,” at pinanatili ang hinaharap na balintiyak sa “ililigtas ... tayo.”
