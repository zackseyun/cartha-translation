  source_fidelity: Tumpak na naipapahayag ng salin ang inferensiyang οὖν (“Kaya nga”), ang pagpapatingkad na πολλῷ ... μᾶλλον (“lalo pa”), ang naganap nang passive na δικαιωθέντες kasama ng νῦν (“ngayong pinawalang-sala na tayo”), at ang hinaharap na passive na σωθησόμεθα (“ililigtas”). Ang “sa pamamagitan ng kanyang dugo” ay katanggap-tanggap na instrumental na pagsasalin ng ἐν τῷ αἵματι αὐτοῦ, samantalang ang “sa pamamagitan niya” ay tumpak para sa δι’ αὐτοῦ. Hindi idinadagdag ng pangunahing teksto ang “ng Diyos” sa τῆς ὀργῆς.
