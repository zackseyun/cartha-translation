id: ROM.5.18
reference: Romans 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: tl
  text: Kaya nga, kung paanong sa pamamagitan ng isang paglabag ay dumating sa lahat ng tao ang hatol ng kaparusahan, gayundin naman sa pamamagitan ng isang matuwid na gawa ay dumating sa lahat ng tao ang pagpapawalang-sala na nagdudulot ng buhay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “pagpapawalang-sala ng buhay.”'
    reason: Ipinakikita nito ang mas tuwirang anyo ng δικαίωσιν ζωῆς at pinananatiling bukas ang eksaktong ugnayan ng “pagpapawalang-sala” at “buhay.”
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Kaya nga
  rationale: Likas at malinaw nitong ipinahahayag sa modernong Tagalog ang dobleng pang-ugnay na naghuhudyat ng kongklusyon.
- source_word: παραπτώματος
  choice: paglabag
  rationale: Tumutukoy ito sa isang maling gawa o pagsuway at pinananatili ang pagkakaiba nito sa mas malawak na konsepto ng kasalanan.
- source_word: κατάκριμα
  choice: hatol na kaparusahan
  rationale: Pinananatili nito ang hudisyal na diwa ng salita at malinaw na ipinakikita na hindi lamang ito paghatol kundi hatol laban sa nasasakdal.
- source_word: δικαιώματος
  choice: matuwid na gawa
  rationale: Ang pang-isahang anyo ay tumutukoy sa isang tiyak at mapagpasyang gawang matuwid; natural ito sa Tagalog nang hindi higit na tinutukoy kung aling gawa iyon.
- source_word: δικαίωσιν ζωῆς
  choice: pagpapawalang-sala na nagdudulot ng buhay
  rationale: Inihahatid nito sa malinaw na Tagalog kapwa ang hudisyal na diwa ng δικαίωσις at ang ugnayan nito sa buhay, habang inilalagay sa talababa ang mas literal ngunit malabong anyo.
- source_word: πάντας ἀνθρώπους
  choice: lahat ng tao
  rationale: Kasama sa saklaw nito ang sangkatauhan sa pangkalahatan at inuulit ang eksaktong saklaw sa dalawang panig ng paghahambing.
theological_decisions:
- issue: Kung dapat bang paliitin ang saklaw ng ikalawang “lahat ng tao” upang maiwasan ang wari ng pangkalahatang pagpapawalang-sala
  choice: Panatilihin ang “lahat ng tao” sa dalawang bahagi.
  alternative: “lahat ng sumasampalataya” o “lahat ng pinawalang-sala” sa ikalawang bahagi
  rationale: Parehong πάντας ἀνθρώπους ang ginamit sa dalawang panig ng paghahambing. Ang pagdaragdag ng limitasyon sa salin ay magpapasya sa isang teolohikal na tensiyong hindi tahasang nilulutas ng mismong talata.
- issue: Kung dapat tukuyin sa teksto na ang “isang matuwid na gawa” ay ang pagsunod o kamatayan ni Cristo
  choice: Panatilihin ang payak na “isang matuwid na gawa.”
  alternative: “isang gawa ng pagsunod ni Cristo”
  rationale: Hindi tahasang pinangalanan sa talatang ito ang gumagawa o ang tiyak na gawa. Nauunawaan iyon mula sa konteksto, ngunit hindi dapat idagdag bilang bahagi ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang magkatimbang na kayarian na “kung paanong … gayundin naman” upang mapanatili ang paghahambing sa Griyego. Idinagdag ang “dumating” sa dalawang eliptikong sugnay para sa likas at malinaw na Tagalog, nang hindi binabago ang lohika ng pangungusap.
