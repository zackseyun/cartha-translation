  terminology: Ang “paglabag,” “matuwid na gawa,” at “pagpapawalang-sala” ay angkop at pare-pareho sa hudisyal at etikal na bokabularyo ng talata. Ang “hatol ng kaparusahan” ay bahagyang mas malinaw na Tagalog kaysa “hatol na kaparusahan,” at pinananatili ang puwersang hudisyal ng κατάκριμα.
