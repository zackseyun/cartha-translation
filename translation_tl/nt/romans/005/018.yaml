  to: Kaya nga, kung paanong sa pamamagitan ng isang paglabag ay dumating sa lahat ng tao ang hatol ng kaparusahan, gayundin naman sa pamamagitan ng isang matuwid na gawa ay dumating sa lahat ng tao ang pagpapawalang-sala na nagdudulot ng buhay[a].
