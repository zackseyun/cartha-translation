id: ROM.5.12
reference: Romans 5:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: tl
  text: Kaya, kung paanong sa pamamagitan ng isang tao ay pumasok ang kasalanan sa sanlibutan, at sa pamamagitan ng kasalanan ay pumasok ang kamatayan, gayundin ay lumaganap ang kamatayan sa lahat ng tao, dahil nagkasala ang lahat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na pagbasa, “sa kanya ay nagkasala ang lahat.”
    reason: Pinananatili ang matagal nang representatibo o inkorporatibong pagkaunawa sa ἐφ’ ᾧ bilang alternatibo sa sanhiing pagbasa ng pangunahing teksto.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kaya
  rationale: Ipinahihiwatig nito ang lohikal na paglipat mula sa naunang pangangatwiran, at likas at maikli ito sa modernong Tagalog.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: sa pamamagitan ng isang tao
  rationale: Pinananatili ang instrumental na diwa ng διά at ang pagtukoy kay Adan bilang iisang taong kinakatawan sa kasunod na paghahambing.
- source_word: ἡ ἁμαρτία
  choice: ang kasalanan
  rationale: Ito ang tuwiran at karaniwang katumbas ng terminong Paulino, nang walang idinaragdag na paliwanag sa teksto.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: pumasok sa sanlibutan
  rationale: Pinananatili ang direksiyon ng εἰς at gumagamit ng malinaw at marangal na katawagang Tagalog para sa mundong tinutukoy.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: sa pamamagitan ng kasalanan ay pumasok ang kamatayan
  rationale: 'Ginagawang hayag sa Tagalog ang pandiwang ipinahihiwatig sa Griyego at pinananatili ang paralelismo: pumasok ang kasalanan sa pamamagitan ng isang tao, at ang kamatayan sa pamamagitan ng kasalanan.'
- source_word: οὕτως
  choice: gayundin
  rationale: Malinaw nitong ipinakikita ang katumbas na kinalabasan sa paghahambing ni Pablo.
- source_word: εἰς πάντας ἀνθρώπους
  choice: sa lahat ng tao
  rationale: Saklaw nito ang buong sangkatauhan at hindi lamang ang mga lalaki; natural din itong pakinggan sa Tagalog.
- source_word: ὁ θάνατος διῆλθεν
  choice: lumaganap ang kamatayan
  rationale: Ipinahahayag ng “lumaganap” ang pag-abot ng kamatayan sa buong sangkatauhan, ayon sa kilos at lawak ng διέρχομαι sa konteksto.
- source_word: ἐφ’ ᾧ
  choice: dahil
  rationale: 'Ang sanhiing pagbasa ang pinakanatural sa konteksto: lumaganap ang kamatayan dahil nagkasala ang lahat. Inilalagay sa talababa ang tradisyonal na alternatibo upang mapanatili ang tunay na interpretatibong tensiyon.'
- source_word: πάντες ἥμαρτον
  choice: nagkasala ang lahat
  rationale: Pinananatili ang payak na aspektong nakaraan ng aorist nang hindi ito ginagawang tahasang perpektibo.
theological_decisions:
- issue: Ang kahulugan ng ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Sanhiing pagbasa: “dahil nagkasala ang lahat”'
  alternative: 'Representatibo o inkorporatibong pagbasa: “sa kanya ay nagkasala ang lahat”'
  rationale: Pinakamadaling unawain ang ἐφ’ ᾧ bilang sanhi sa kontekstong ito, nang hindi ipinapasok sa pangunahing teksto ang isang mas tiyak na doktrinal na pormulasyon. Dahil mahalaga sa teolohiya ng ugnayan ni Adan at ng sangkatauhan ang alternatibong pagbasa, pinananatili ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang mahabang paghahambing at ang pangwakas na gitling sapagkat hindi pa kinukumpleto sa talatang ito ang estrukturang sinimulan ng “kung paanong.”
