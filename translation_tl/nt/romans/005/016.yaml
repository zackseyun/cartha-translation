  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: tl
  text: At ang kaloob ay hindi katulad ng ibinunga ng isang taong nagkasala.[a] Sapagkat ang hatol mula sa isang pagsuway[b] ay humantong sa pagkondena, ngunit ang kaloob ng biyaya mula sa maraming pagsuway ay humantong sa pagpapawalang-sala.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng dumating sa pamamagitan ng isang taong nagkasala.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa isa”; maaaring tumukoy sa isang pagsuway.
    reason: source_ambiguity
  - marker: c
    text: O “pag-aaring matuwid” o “hatol na matuwid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: kaloob
  rationale: Tumutukoy ito sa isang bagay na ibinigay bilang regalo; natural at marangal ang “kaloob” at hindi na kailangang dagdagan ng “walang bayad.”
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: ibinunga ng isang taong nagkasala
  rationale: Elliptical ang Griyego at ipinaghahambing ang kaloob sa resultang dumating sa pamamagitan ng nag-iisang nagkasala. Pinananatili ng salin ang personal na reperensiya at ipinahihiwatig na bunga o resulta ang tinutukoy.
- source_word: κρίμα
  choice: hatol
  rationale: Sa kontekstong panghukuman, tumutukoy ito sa pasiya o hatol; malinaw itong naihihiwalay sa kasunod na kaparusahan.
- source_word: ἐξ ἑνὸς
  choice: mula sa isang pagsuway
  rationale: Malamang na tumutukoy ang neuter na ἑνός sa isang pagsuway, lalo na dahil inihahambing ito sa “maraming pagsuway”; inilalantad sa teksto ang ipinahihiwatig na pangngalan habang minamarkahan sa talababa ang mas literal na anyo.
- source_word: κατάκριμα
  choice: kaparusahan
  rationale: Tumutukoy ito sa masamang hatol o sentensiyang bunga ng pagkondena. Ang “kaparusahan” ay madaling maunawaan sa modernong Tagalog, bagaman ang “paghatol na may sala” ay mas tahasang alternatibong panghukuman.
- source_word: χάρισμα
  choice: kaloob ng biyaya
  rationale: Ipinakikita nito na ang kaloob ay nagmumula sa biyaya at naihihiwalay ito sa δώρημα sa unang sugnay.
- source_word: παραπτωμάτων
  choice: mga pagsuway
  rationale: Ipinahihiwatig ng παράπτωμα ang paglabag o maling hakbang; malinaw at karaniwan sa modernong Tagalog ang “pagsuway.”
- source_word: δικαίωμα
  choice: pagpapawalang-sala
  rationale: Sa tuwirang kaibahan sa κατάκριμα, panghukuman ang diwa rito. Ang “pagpapawalang-sala” ay kongkreto at madaling maunawaang positibong hatol, habang pinananatili sa talababa ang posibleng “pag-aaring matuwid.”
theological_decisions:
- issue: Ang panghukuman na diwa ng δικαίωμα bilang kabaligtaran ng κατάκριμα
  choice: pagpapawalang-sala
  alternative: pag-aaring matuwid; hatol na matuwid
  rationale: Nakaayos ang talata bilang paghahambing ng hatol at kaparusahan laban sa kaloob ng biyaya at δικαίωμα. Pinananatili ng “pagpapawalang-sala” ang panghukuman na kaibahan nang hindi ipinapasok ang isang denominasyonal na paliwanag sa mekanismo nito.
- issue: Ang reperensiya ng ἐξ ἑνὸς
  choice: isang pagsuway
  alternative: isa; isang tao
  rationale: Ang kaibahan sa ἐκ πολλῶν παραπτωμάτων ay malakas na nagpapahiwatig na isang pagsuway ang tinutukoy, ngunit may tunay na pagkaelliptical ang Griyego kaya itinatala ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang mga terminong panghukuman na “hatol,” “kaparusahan,” at “pagpapawalang-sala” upang mapanatili ang antitesis ng Griyego; ang tunay na pagkaelliptical at saklaw ng δικαίωμα ay inilagay sa mga talababa.
