  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: tl
  text: Ang Kautusan ay dumating bilang dagdag[a] upang dumami ang paglabag[b]. Ngunit kung saan dumami ang kasalanan, lalong sumagana ang biyaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumasok din” o “pumasok kasabay”; ipinahihiwatig ng Griyego ang pagpasok sa tabi o bilang karagdagan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pagkakasala” o “pagsuway.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “lalong umapaw ang biyaya” o “higit pang sumagana ang biyaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ang Kautusan
  rationale: Tinutukoy ng may-artikulong pangngalan sa kontekstong ito ang Kautusan ni Moises. Ginamit ang malaking titik upang maging malinaw ang tiyak na tinutukoy nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: παρεισῆλθεν
  choice: pumasok bilang karagdagan
  rationale: Pinananatili nito ang diwa ng pagpasok kasabay o bilang dagdag, na dala ng unlaping παρα-, at mas natural ito sa makabagong Tagalog kaysa sa literal na “pumasok sa tabi.”
- source_word: ἵνα πλεονάσῃ
  choice: upang dumami
  rationale: Ang “upang” ay nagpapanatili sa layuning ipinahihiwatig ng ἵνα na may pasakaling pandiwa, nang hindi pinapahina ito tungo sa bunga lamang.
- source_word: τὸ παράπτωμα
  choice: ang pagsuway
  rationale: Ipinahahayag ng “pagsuway” ang isang tiyak na paglabag o pagkakasala at angkop sa konteksto ng paglabag ni Adan.
- source_word: οὗ
  choice: kung saan
  rationale: Natural na katumbas ito ng pang-abay na panlunan sa paghahambing ng pagdami ng kasalanan at pag-apaw ng biyaya.
- source_word: ἁμαρτία
  choice: kasalanan
  rationale: Ito ang malinaw at karaniwang katumbas ng terminong ginagamit ni Pablo.
- source_word: ὑπερεπερίσσευσεν
  choice: lalo pang nag-umapaw
  rationale: Ang “nag-umapaw” ay naghahatid ng labis na kasaganaan, at ang “lalo pang” ay nagpapanatili sa matinding diin ng tambalang pandiwang Griyego.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Ang “biyaya” ang natural at kinikilalang katumbas sa teolohikal na gamit ng χάρις.
theological_decisions:
- issue: Kung ang ἵνα sa pagpasok ng Kautusan ay dapat isalin bilang layunin o palambutin bilang bunga lamang upang maiwasan ang pahiwatig na sinang-ayunan ng Diyos ang kasalanan.
  choice: upang dumami ang pagsuway
  alternative: kaya dumami ang pagsuway / na ang naging bunga ay pagdami ng pagsuway
  rationale: Malinaw na layuning pangungusap ang ἵνα na may pasakaling pandiwa. Pinananatili ng salin ang tensiyong teolohikal ng pangangatwiran ni Pablo at hindi ito tahimik na nilulutas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang malinaw na paghahambing sa “dumami” at ang mas matinding larawan ng “nag-umapaw.”
