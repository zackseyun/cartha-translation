  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: tl
  text: upang kung paanong naghari ang kasalanan sa kamatayan, gayundin ay maghari ang biyaya sa pamamagitan ng katuwiran[a], tungo sa buhay na walang hanggan sa pamamagitan ni Jesu-Cristo na ating Panginoon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “Ἰησοῦ Χριστοῦ”; ang “Cristo” ay isang titulo na nangangahulugang “Mesiyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: upang
  rationale: Likas na ipinahahayag sa Tagalog ang layunin o kinalabasan na kaugnay ng kasunod na pandiwang nasa subjunctive.
- source_word: ἐβασίλευσεν
  choice: naghari
  rationale: Pinananatili ang maharlikang talinghaga ni Pablo at ang aspektong tumutukoy sa pagkilos bilang isang kabuuan.
- source_word: ἐν τῷ θανάτῳ
  choice: sa kamatayan
  rationale: Pinananatili ang maikli at sadyang maluwag na pahayag ng Griyego, na maaaring tumukoy sa saklaw o kalagayan ng kamatayan nang hindi ito labis na ipinapaliwanag.
- source_word: ἡ χάρις
  choice: ang biyaya
  rationale: Karaniwan at malinaw na katumbas sa makabagong Tagalog; pinananatili rin nito ang pagsasatao sa biyaya bilang naghahari.
- source_word: βασιλεύσῃ
  choice: maghari
  rationale: Ang anyong pandiwa matapos ang “upang” ay natural na naghahatid ng layunin o kinalabasan ng Griyegong subjunctive.
- source_word: διὰ δικαιοσύνης
  choice: sa pamamagitan ng katuwiran
  rationale: Ipinahahayag ng “sa pamamagitan ng” ang paraan o kasangkapan; ang “katuwiran” ang pamilyar na katumbas ng δικαιοσύνη habang ang dimensiyon nitong katarungan ay pinananatili sa talababa.
- source_word: εἰς ζωὴν αἰώνιον
  choice: tungo sa buhay na walang hanggan
  rationale: Ang “tungo sa” ay nagpapanatili sa direksiyon o hantungan ng εἰς at natural sa marangal na Tagalog.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jesu-Cristo
  rationale: Sa karaniwang gamit ng makabagong Tagalog, malinaw at natural ang tradisyonal na anyong “Jesu-Cristo”; nililinaw sa talababa na ang Cristo ay titulong Mesiyas.
- source_word: τοῦ κυρίου ἡμῶν
  choice: na ating Panginoon
  rationale: Natural na inuugnay sa Tagalog ang pariralang ito kay Jesu-Cristo at tapat nitong dinadala ang pag-aari sa “ating.”
theological_decisions:
- issue: Saklaw ng ἐν τῷ θανάτῳ
  choice: sa kamatayan
  alternative: sa pamamagitan ng kamatayan; sa nasasakupan ng kamatayan
  rationale: Hindi pinipili nang tahasan kung instrumento o saklaw ang kamatayan; pinananatili ng maikling salin ang tunay na luwag ng Griyego.
- issue: Kahulugan ng δικαιοσύνη sa kontekstong Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ang mas natural at kinikilalang pangunahing salin sa teolohikal na kontekstong ito, ngunit hindi dapat mawala ang posibleng diin sa katarungan kaya inilagay ang kahalili sa talababa.
- issue: Paglilipat sa Χριστός bilang titulo
  choice: Cristo, na ang ibig sabihin ay Mesiyas
  alternative: Mesiyas
  rationale: Pinananatili sa pangunahing teksto ang likas at malawak na nakikilalang Tagalog na “Jesu-Cristo,” habang ipinakikita sa talababa ang titulong kahulugan ng Χριστός nang hindi ito ginagawang simpleng apelyido.
- issue: Ugnayan ng biyaya, katuwiran, at buhay na walang hanggan
  choice: maghari ang biyaya sa pamamagitan ng katuwiran, tungo sa buhay na walang hanggan
  alternative: mamuno ang biyaya sa pamamagitan ng katarungan hanggang sa buhay na walang hanggan
  rationale: Pinananatili ang personipikasyon, paraan, at direksiyon ng Griyego nang hindi nilulutas kung ang katuwiran ay pangunahing kaloob, katayuan, o makatarungang pagkilos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang magkatugmang “naghari/maghari” upang mapanatili ang sentrong talinghaga. Iniwasan ang mas paliwanag na “sa nasasakupan ng kamatayan” sa pangunahing teksto upang huwag paliitin ang ambiguwidad ng ἐν. Ang lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
