  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: tl
  text: Kaya, yamang itinuring tayong matuwid batay sa pananampalataya[b], may kapayapaan[a] tayo sa Diyos sa pamamagitan ng ating Panginoong Jesus, ang Mesiyas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa ilang manuskrito: “magkaroon tayo ng kapayapaan sa Diyos.”'
    reason: textual_variant
  - marker: b
    text: Maaari ring isalin na “sa pamamagitan ng pananampalataya.”
    reason: lexical_alternative
  - marker: c
    text: Griyego Christos, “Mesiyas”; tradisyonal na isinasaling “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: yamang itinuring na tayong matuwid
  rationale: Ang aorist passive participle ng δικαιόω ay inilalahad bilang naganap na pagkilos sa atin. Pinananatili ng “itinuring na matuwid” ang hudisyal na diwa nang hindi ito pinaliliit sa “pinawalang-sala” o pinalalawak sa isang tiyak na doktrina kung paano nagiging matuwid ang tao.
- source_word: οὖν
  choice: Kaya
  rationale: Likas at malinaw na panandang Filipino para sa kongklusyong ibinubunga ng naunang pangangatwiran.
- source_word: ἐκ πίστεως
  choice: batay sa pananampalataya
  rationale: Ipinahahayag nito ang batayan na tinutukoy ng ἐκ habang iniiwasang gawing mas tiyak kaysa sa Griyego ang eksaktong ugnayan ng pananampalataya sa pag-aaring matuwid.
- source_word: εἰρήνην
  choice: kapayapaan
  rationale: Tuwirang katumbas ng εἰρήνη at pinananatili ang malawak na diwa ng maayos na kaugnayan sa Diyos, hindi lamang panloob na kapanatagan.
- source_word: ἔχομεν
  choice: may ... tayo
  rationale: 'Sinusunod ang indikativong anyo sa SBLGNT: ang kapayapaan ay kasalukuyang taglay. Ang subjunctive na baryante ay nasa talababa.'
- source_word: πρὸς τὸν θεὸν
  choice: sa Diyos
  rationale: Sa pariralang “kapayapaan sa Diyos,” natural sa Filipino ang “sa Diyos” para sa kapayapaang umiiral sa ugnayan natin sa kanya.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwan, marangal, at angkop na salin ng κύριος sa titulong tumutukoy kay Jesus.
- source_word: Χριστοῦ
  choice: ang Mesiyas
  rationale: Isinasalin ang kahulugan ng titulong Χριστός sa halip na ituring lamang itong pangalang pantangi; ang appositional na “Jesus, ang Mesiyas” ay natural sa Filipino.
theological_decisions:
- issue: Kahulugan ng δικαιωθέντες sa teolohiya ni Pablo
  choice: itinuring na tayong matuwid
  alternative: pinawalang-sala tayo / ginawa tayong matuwid
  rationale: Ipinahahayag ang mapagpasyang pagkilos na tinanggap ng mga mananampalataya ngunit hindi ipinapasok sa talata ang isang denominasyonal na paliwanag kung ito ba ay deklarasyon lamang o pagbabagong likas.
- issue: Diwa ng “kapayapaan sa Diyos”
  choice: may kapayapaan tayo sa Diyos
  alternative: nakipagkasundo tayo sa Diyos / may panloob tayong kapanatagan mula sa Diyos
  rationale: Pinananatili ang mismong salitang “kapayapaan” at ang ugnayan nito sa Diyos. Hindi ito ipinapaliwanag nang mas makitid bilang pansariling damdamin o pinapalitan ng mas interpretatibong “pakikipagkasundo.”
- issue: Tekstuwal na pagkakaiba ng ἔχομεν at ἔχωμεν
  choice: 'Sinunod sa pangunahing teksto ang indikativong ἔχομεν: “may kapayapaan tayo.”'
  alternative: “magkaroon tayo ng kapayapaan,” ayon sa subjunctive na ἔχωμεν
  rationale: Ang ibinigay na SBLGNT ay may indikativo, ngunit mahalaga at sinauna ang hortatoryong baryante kaya malinaw itong itinala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “itinuring na matuwid” sa halip na mas teknikal o mas denominasyonal na mga parirala. Inilagay ang bawat pananda ng talababa sa mismong pariralang tinutukoy nito.
