  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: tl
  text: 'Ngunit ipinakikita ng Diyos ang sarili niyang pag-ibig sa atin[a]: noong makasalanan pa tayo, namatay ang Mesiyas[b] para sa atin.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tungo sa atin.”
    reason: lexical_alternative
  - marker: b
    text: Griyego Christos; tradisyonal na “Cristo.” Dito ay isinaling “Mesiyas” bilang isang titulo.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “alang-alang sa atin” o “sa ating kapakanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: ipinakikita
  rationale: Likas at malinaw sa makabagong Tagalog; ipinahahayag nito ang aktuwal na pagpapamalas ng pag-ibig ng Diyos nang hindi ipinipilit ang mas makitid na diwa ng “pinatutunayan.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita ang banayad na pagsalungat sa naunang kaisipan sa pangangatwiran ni Pablo.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: ang sarili niyang pag-ibig
  rationale: Pinananatili ng “sarili niyang” ang diin ng reflexive na ἑαυτοῦ, habang natural pa rin ang ayos sa Tagalog.
- source_word: εἰς ἡμᾶς
  choice: sa atin
  rationale: Natural na ipinahahayag ang pag-ibig na nakatuon sa atin; ang mas lantad na “tungo sa atin” ay inilalagay bilang alternatibo sa talababa.
- source_word: ὅτι
  choice: ':'
  rationale: Ginagamit ang tutuldok upang natural na ipakilala sa Tagalog ang pangyayaring nagpapakita kung paano nahayag ang pag-ibig ng Diyos.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: noong makasalanan pa tayo
  rationale: Natural na temporal na sugnay na pinananatili ang diin ng ἔτι sa pamamagitan ng “pa.”
- source_word: Χριστὸς
  choice: Mesiyas
  rationale: Dito ay gumaganap bilang mesiyanikong titulo, kaya isinalin sa halip na baybayin lamang bilang “Cristo.”
- source_word: ὑπὲρ ἡμῶν
  choice: para sa atin
  rationale: Malinaw at malawak na salin na nagpapahayag na ang kamatayan ng Mesiyas ay ukol sa ating kapakanan nang hindi nilulutas sa pangunahing teksto ang pinagtatalunang eksaktong nuance nito.
- source_word: ἀπέθανεν
  choice: namatay
  rationale: Tuwiran at sapat na katumbas ng payak na aorist na pandiwa.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός sa diskursong Paulino
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng “Mesiyas” ang tungkulin nito bilang titulo sa kontekstong ito at ginagawang malinaw ang kahulugan nito sa karaniwang mambabasa.
- issue: Saklaw ng kahulugan ng ὑπὲρ ἡμῶν
  choice: para sa atin
  alternative: alang-alang sa atin; sa ating kapakanan; bilang kahalili natin
  rationale: Tiyak sa talata na ang kamatayan ng Mesiyas ay para sa ating kapakanan, ngunit hindi dapat ipilit ng salin sa pangunahing teksto ang mas tiyak at pinagtatalunang diwang “bilang kahalili natin.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinakikita” sa halip na mas teknikal na “ipinapamalas,” at ang tutuldok upang maipahayag nang natural ang paliwanag na ipinakikilala ng ὅτι. Ang “noong makasalanan pa tayo” ay pangkaraniwang pananalita ngunit nananatiling angkop sa banal na kasulatan.
