id: ROM.5.5
reference: Romans 5:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: tl
  text: At hindi tayo ipinapahiya ng pag-asa[a], sapagkat ibinuhos na sa ating mga puso ang pag-ibig ng Diyos[b] sa pamamagitan ng Espiritu Santo na ibinigay sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi tayo binibigo.”
    reason: lexical_alternative
  - marker: b
    text: O, bagaman hindi gaanong malamang, “pag-ibig natin sa Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: At
  rationale: Isang magaan na pang-ugnay ito sa konteksto; iniiwasan ng “At” ang labis na pagbibigay-diin sa pagsalungat.
- source_word: ἐλπίς
  choice: pag-asa
  rationale: Karaniwan at likas na katumbas sa modernong Tagalog; generic ang gamit ng artikulo sa Griyego.
- source_word: καταισχύνει
  choice: hindi tayo ipinapahiya
  rationale: Pinananatili ang pangunahing diwa ng hiya at dangal sa pandiwang Griyego, at malinaw na ipinahihiwatig sa Tagalog ang mga taong hindi mapapahiya.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: pag-ibig ng Diyos
  rationale: Pinananatili ang pormal na anyo at likas na kalabuan ng genitive, bagaman higit na ipinahihiwatig ng konteksto ang pag-ibig ng Diyos sa atin.
- source_word: ἐκκέχυται
  choice: ibinuhos na
  rationale: Ang aspektong perfect ay inilalarawan bilang naganap nang pagbuhos na may nananatiling bunga hanggang sa kasalukuyan.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: sa ating mga puso
  rationale: Direkta, natural, at pinananatili ang maramihang “mga puso” ng Griyego.
- source_word: διὰ πνεύματος ἁγίου
  choice: sa pamamagitan ng Espiritu Santo
  rationale: Ipinapahayag ang instrumental o tagapamagitang gamit ng διά na may genitive.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: na ibinigay sa atin
  rationale: Natural na sugnay na malinaw na tumutukoy sa Espiritu Santo at tapat sa aorist passive participle.
theological_decisions:
- issue: Kahulugan ng genitive sa ἡ ἀγάπη τοῦ θεοῦ
  choice: pag-ibig ng Diyos, na sa konteksto ay malamang na pag-ibig ng Diyos sa atin
  alternative: pag-ibig natin sa Diyos
  rationale: Ang paliwanag na ibinuhos ito sa ating mga puso sa pamamagitan ng Espiritu Santo ay higit na umaayon sa pag-ibig na nagmumula sa Diyos, ngunit tunay ang pormal na kalabuan kaya pinananatili sa talababa ang alternatibo.
- issue: Saklaw ng καταισχύνει
  choice: hindi tayo ipinapahiya
  alternative: hindi tayo binibigo
  rationale: Mas tuwirang pinananatili ng pangunahing salin ang semantikong larangan ng hiya at dangal; ang diwang “hindi binibigo” ay isang posibleng kontekstuwal na pagpapahayag at inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “tayo/atin” bilang inklusibong unang panauhang maramihan, gaya ng karaniwang pagbasa sa konteksto. Ang mga marker ay inilagay kaagad pagkatapos ng mga pariralang nililinaw ng kani-kanilang talababa.
