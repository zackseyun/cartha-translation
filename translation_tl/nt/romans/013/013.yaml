  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: tl
  text: Mamuhay tayo nang marangal, gaya ng mga namumuhay sa araw—hindi sa magulong pagsasaya at paglalasing, hindi sa imoralidad na seksuwal at kahalayan, at hindi sa pag-aaway at pagseselos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pag-iinggit” sa halip na “pagseselos”; maaaring mangahulugan ng alinman ang salitang Griyego, ngunit negatibo ang diwa nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: gaya ng sa liwanag ng araw
  rationale: Pinananatili nito ang larawan ng araw na kabaligtaran ng dilim sa konteksto, habang natural sa modernong Tagalog.
- source_word: εὐσχημόνως
  choice: nang marangal
  rationale: Ipinahahayag nito ang asal na kagalang-galang at nararapat sa paningin ng iba; mas dignipikado at natural kaysa sa literal na anyong maaaring maging malabo.
- source_word: περιπατήσωμεν
  choice: Mamuhay tayo
  rationale: Ang literal na 'lumakad tayo' ay talinghaga para sa paraan ng pamumuhay. Isinalin ang kahulugan upang maging malinaw, habang pinananatili ang sama-samang panghihikayat ng hortatory subjunctive.
- source_word: κώμοις
  choice: magulong pagsasaya
  rationale: Tumutukoy sa maingay at walang pagpipigil na pagdiriwang, karaniwang kaugnay ng pag-inom; hindi ito pinakitid tungo sa seksuwal na kahulugan.
- source_word: μέθαις
  choice: paglalasing
  rationale: Natural at tuwirang salin para sa kalasingan o mga pagkakataon ng labis na pag-inom.
- source_word: κοίταις
  choice: imoralidad na seksuwal
  rationale: Bagaman literal na 'mga higaan,' ginagamit ito rito bilang idyoma para sa bawal o imoral na gawaing seksuwal; ang literal na salin ay magiging malabo.
- source_word: ἀσελγείαις
  choice: kahalayan
  rationale: Ipinahahayag nito ang walang-hiya at walang-pigil na asal, na madalas may seksuwal na diwa, nang hindi labis na nililimitahan ang saklaw.
- source_word: ἔριδι
  choice: pag-aaway
  rationale: Karaniwan at malinaw na salita para sa alitan o mapagtunggaling pagtatalo.
- source_word: ζήλῳ
  choice: pagseselos
  rationale: Sa talaan ng mga bisyo, negatibo ang diwa ng salita. Maaaring tumukoy rin ito sa inggit, kaya pinananatili ang alternatibo sa talababa.
theological_decisions:
- issue: Talinghagang paghahambing ng araw at dilim sa etikal na panghihikayat
  choice: Pinanatili bilang 'gaya ng sa liwanag ng araw.'
  alternative: gaya ng sa araw; na para bang araw
  rationale: Pinananatili ang larawan sa teksto at konteksto nang hindi ito pinalalawak tungo sa isang doktrinal na paliwanag na hindi tahasang nasa talata.
- issue: Idyomatikong seksuwal na diwa ng κοίταις
  choice: Isinalin ayon sa kahulugan bilang 'imoralidad na seksuwal.'
  alternative: mga higaan
  rationale: Malinaw na seksuwal ang gamit dito, samantalang magiging malabo o mapanlinlang sa modernong Tagalog ang literal na 'mga higaan.'
- issue: Saklaw ng ζῆλος sa negatibong talaan ng mga bisyo
  choice: pagseselos
  alternative: inggit
  rationale: Parehong posibleng negatibong diwa ang pagseselos at inggit. Pinili ang pagseselos bilang akma sa pagkakaugnay nito sa pag-aaway, ngunit hindi inalis ang tunay na leksikal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'Mamuhay tayo' sa halip na literal na 'Lumakad tayo' upang natural na maipahayag ang talinghaga para sa paraan ng pamumuhay. Pinanatili ang maikli at magkakaparis na ayos ng tatlong pagbabawal.
