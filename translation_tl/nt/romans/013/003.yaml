  naturalness: Malinaw at makabago ang karamihan ng salin. Mas natural ang maramihang “mga gumagawa ng mabuti/masama” kaysa sa isahang generic na “ng gumagawa.”
  terminology: Ang “mga namumuno,” “awtoridad,” “mabuti,” at “papupurihan” ay angkop sa rehistro at sa mga terminong Griyego. Ang “nito” ay may wastong antecedent na “awtoridad.”
