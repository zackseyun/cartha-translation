  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: tl
  text: Sapagkat ang mga namumuno ay hindi kinatatakutan ng mga gumagawa ng mabuti, kundi ng mga gumagawa ng masama.[a] Nais mo bang huwag matakot sa awtoridad?[b] Gawin mo ang mabuti, at papupurihan ka nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mabuting gawa, kundi sa masama.” Pangkalahatang etikal ang pagsalungat sa Griyego sa mabuti at masama.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Kung ayaw mong matakot sa awtoridad.”
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy ng “nito” ay ang namamahalang awtoridad.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: mga namumuno
  rationale: Tumutukoy ito sa mga taong namamahala o may katungkulan sa pamahalaan; likas at hindi labis na espesipiko ang “mga namumuno.”
- source_word: φόβος
  choice: dapat katakutan
  rationale: Sa panaguring gamit nito, ang diwa ay pagiging sanhi o bagay ng pagkatakot. Natural itong naipahahayag sa Filipino bilang “dapat katakutan.”
- source_word: τῷ ἀγαθῷ ἔργῳ ... τῷ κακῷ
  choice: ng gumagawa ng mabuti ... ng gumagawa ng masama
  rationale: Ginagawang malinaw sa natural na Filipino ang pangkalahatang etikal na pagsalungat ng mabuting gawa at masama, nang hindi ito nililimitahan sa iisang kilos.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Nais mo bang huwag matakot
  rationale: Pinananatili ang anyong retorikal na tanong at ang estruktura ng θέλεις kasama ang pawatas na may μή.
- source_word: τὴν ἐξουσίαν
  choice: sa awtoridad
  rationale: Pinananatili ang isahan at ang pagtukoy sa kapangyarihang namamahala bilang institusyon.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Gawin mo ang mabuti
  rationale: Natural at tuwirang katumbas ng substantibong “ang mabuti,” at hindi nililimitahan sa hiwa-hiwalay na mabubuting gawa.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: papupurihan ka nito
  rationale: Natural na Filipino para sa pagtanggap ng papuri mula sa awtoridad; malinaw na ang awtoridad ang pinagmumulan ng papuri.
theological_decisions:
- issue: Saklaw ng pahayag tungkol sa mga namumuno at papuri
  choice: Isalin bilang paglalarawan sa karaniwan o nilalayong tungkulin ng namamahalang awtoridad, nang hindi dinaragdagan ang teksto ng tahasang kwalipikasyon.
  alternative: Ituring itong ganap at walang-eksepsiyong pahayag na lahat ng pinuno ay laging pumupuri sa mabuti, o kaya’y ipakahulugan bilang ironiko.
  rationale: Walang tahasang pananda ng ironiya o kwalipikasyon sa Griyego. Pinananatili ng salin ang tensiyon ng mismong pahayag nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na tanong ng Griyego at iniwasan ang labis na legalistiko o denominasyonal na pananalita.
