- from: Sapagkat ang mga namumuno ay hindi dapat katakutan ng gumagawa ng mabuti, kundi ng gumagawa ng masama.[a] Nais mo bang huwag matakot sa awtoridad?[b] Gawin mo ang mabuti, at papupurihan ka nito.[c]
  to: Sapagkat ang mga namumuno ay hindi kinatatakutan ng mga gumagawa ng mabuti, kundi ng mga gumagawa ng masama.[a] Nais mo bang huwag matakot sa awtoridad?[b] Gawin mo ang mabuti, at papupurihan ka nito.[c]
  rationale: Pinalitan ang “hindi dapat katakutan” ng “hindi kinatatakutan” upang alisin ang diwang “nararapat” na hindi ipinahahayag ng Griyego. Ginawang maramihan ang “mga gumagawa” para sa mas likas na pangkalahatang pagpapahayag sa Filipino. Pinanatili ang retorikal na tanong, ang isahang “awtoridad,” at ang diwa ng pagtanggap ng papuri mula rito.
