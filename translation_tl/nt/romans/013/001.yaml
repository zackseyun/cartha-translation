  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: tl
  text: Ang bawat tao ay magpasakop sa mga awtoridad na namamahala[a], sapagkat walang awtoridad kundi mula sa Diyos, at ang mga awtoridad na umiiral ay itinalaga[b] ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nakatataas na awtoridad” o “mga awtoridad na nasa itaas.”
    reason: lexical_alternative
  - marker: b
    text: O “itinakda ng Diyos” o “inilagay ng Diyos sa kaayusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: ang bawat tao
  rationale: Literal itong “bawat kaluluwa,” ngunit karaniwang idyoma ito para sa bawat indibidwal na tao. Pinananatili ng “bawat tao” ang distributibong diin nang hindi nagpapahiwatig ng teknikal na antropolohiya.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: sa mga awtoridad na namamahala
  rationale: Ang ἐξουσίαις ay tumutukoy sa mga may awtoridad, at ang ὑπερεχούσαις ay literal na mga “nasa itaas” o nakahihigit. Sa kontekstong sibiko, malinaw at likas sa modernong Filipino ang “mga awtoridad na namamahala,” habang inilalagay sa talababa ang mas literal na mga alternatibo.
- source_word: ὑποτασσέσθω
  choice: magpasakop
  rationale: Ipinahahayag nito ang patuloy na pagpapailalim sa isang kaayusan. Ang “magpasakop” ay natural at dignidad na utos sa Filipino, at hindi nito dinaragdagan ang talata ng ideya ng walang-pasubaling pagsang-ayon sa bawat kilos ng pinuno.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: sapagkat walang awtoridad kundi mula sa Diyos
  rationale: Natural na naipahahayag ng “kundi mula sa Diyos” ang pagbubukod at pinagmulan na nasa Griyego, nang hindi labis na tinutukoy kung paano isinasagawa ang banal na pagkilos.
- source_word: αἱ δὲ οὖσαι
  choice: ang mga awtoridad na umiiral
  rationale: Ang pambabaeng pangmaramihang participle ay bumabalik sa ἐξουσίαις. Inuulit ang “mga awtoridad” sa Filipino upang maging malinaw ang tinutukoy.
- source_word: τεταγμέναι
  choice: itinalaga
  rationale: Ang perfect passive ng τάσσω ay nagsasaad ng kalagayang bunga ng pagtatakda o paglalagay sa kaayusan. Ang “itinalaga” ang pinakanatural sa konteksto ng mga namamahala, habang kinikilala sa talababa ang iba pang posibleng diin.
theological_decisions:
- issue: Saklaw ng pahayag na ang mga umiiral na awtoridad ay mula sa Diyos at itinalaga niya
  choice: Ipinahahayag ng salin na ang awtoridad ng mga namamahala ay nagmumula sa Diyos at na ang mga umiiral na awtoridad ay nasa kalagayang itinalaga niya.
  alternative: Maaaring palawakin ito bilang pagsang-ayon ng Diyos sa bawat rehimen at sa bawat kilos nito, o paliitin bilang pagtukoy lamang sa abstraktong prinsipyo ng awtoridad.
  rationale: Konkretong tinutukoy ng Griyego ang mga umiiral na awtoridad at ang pagkakatalaga sa kanila ng Diyos. Hindi naman sinasabi ng talata na moral na sinasang-ayunan ng Diyos ang bawat kilos nila, kaya hindi iyon idinaragdag sa salin.
translation_notes:
  register: Modernong Filipino na malinaw, dignidad, at angkop sa pampublikong pagbasa. Ginamit ang “awtoridad” dahil karaniwan at tiyak ito sa kontekstong sibiko; iniwasan ang mas arkaikong “kapangyarihan” na maaaring tumukoy sa lakas sa halip na lehitimong pamamahala. Lahat ng marker ng talababa ay nasa pangunahing teksto.
