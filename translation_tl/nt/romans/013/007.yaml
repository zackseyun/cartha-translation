  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: tl
  text: 'Ibigay ninyo sa lahat ang nararapat sa kanila: sa pinagkakautangan ng buwis, buwis; sa pinagkakautangan ng bayarin, bayarin; sa dapat katakutan, takot; sa dapat parangalan, karangalan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Ibigay ninyo
  rationale: Ipinahihiwatig ng pandiwa ang pagbibigay o pagbabayad ng nararapat; pinananatili ng 'ibigay' ang lawak nito para sa salapi, pagkatakot, at karangalan.
- source_word: ὀφειλάς
  choice: ang nararapat sa kanila
  rationale: Natural na Filipino para sa mga bagay na dapat ibigay o bayaran, nang hindi nililimitahan sa utang na salapi.
- source_word: φόρον
  choice: buwis
  rationale: Tumutukoy sa tuwirang buwis o tributo na ipinapataw ng pamahalaan.
- source_word: τέλος
  choice: bayarin
  rationale: Ibinubukod ito sa φόρος at saklaw ang singil, toll, o di-tuwirang buwis; ang 'bayarin' ay sadyang malawak.
- source_word: φόβον
  choice: pagkatakot
  rationale: Pinananatili ang tuwirang diwa ng φόβος at ang teolohikal na tensiyon nito, sa halip na tahimik na gawing 'paggalang.'
- source_word: τιμήν
  choice: karangalan
  rationale: Tuwirang ipinahahayag ang pagkilala at pagpaparangal na nararapat sa isang tao.
theological_decisions:
- issue: Kahulugan ng φόβος kaugnay ng mga awtoridad
  choice: pagkatakot
  alternative: paggalang
  rationale: Ang salitang Griyego ay literal na 'takot/pagkatakot.' Hindi ito pinalambot tungo sa 'paggalang,' upang mapanatili ang tunay na lakas at posibleng saklaw ng pananalita ni Pablo.
- issue: Saklaw ng utos na ἀπόδοτε πᾶσι
  choice: Ibigay ninyo sa lahat ang nararapat sa kanila
  alternative: Bayaran ninyo ang lahat ng inyong utang
  rationale: Saklaw ng kasunod na talaan ang salapi at di-materyal na tugon; kaya hindi nilimitahan ang utos sa pinansiyal na utang.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang balanseng, paulit-ulit na estruktura ng Griyego habang ginawang natural ang mga pariralang tumutukoy sa taong kinauukulan.
