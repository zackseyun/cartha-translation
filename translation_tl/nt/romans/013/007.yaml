  naturalness: Kailangan ng rebisyon. Ang umiiral na mga pariralang "dapat pagbayaran ng buwis" at "dapat pagbayaran ng bayarin" ay mabigat at hindi idiomatiko. Ang "pinagkakautangan" ay natural at angkop sa ὀφειλάς at sa elliptical na pag-uulit sa talata.
