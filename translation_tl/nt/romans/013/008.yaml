source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: tl
  text: Huwag kayong magkaroon ng anumang pagkakautang kaninuman, maliban sa pagmamahal sa isa't isa; sapagkat ang umiibig sa iba[a] ay nakatupad na sa Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang iba” o “ibang tao.” Sa Griyego: “ang iba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Huwag kayong magkautang ng anuman kaninuman
  rationale: Pinananatili nito ang malawak na diwa ng dobleng pagtanggi—walang anumang dapat iutang sa sinuman—sa natural na modernong Tagalog, nang hindi nagpapasiya kung saklaw nito ang lahat ng uri ng pangungutang.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw nitong ipinakikilala ang tanging patuloy na obligasyong binabanggit sa talata.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: pag-ibig sa isa't isa
  rationale: Natural itong substantibong parirala sa Tagalog at pinananatili ang katumbasang-mutual ng ἀλλήλους.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: pag-ibig / umiibig
  rationale: Pinananatili ang leksikal na ugnayan at teolohikal na bigat ng magkaugat na mga salita.
- source_word: τὸν ἕτερον
  choice: kapwa
  rationale: Ang 'kapwa' ay likas at maikli sa Tagalog para sa ibang tao, ngunit maaari rin itong maunawaan bilang 'ang iba'; kaya nilagyan ng talababa upang mapanatili ang literal na anyo at lawak ng Griyego.
- source_word: νόμον
  choice: Kautusan
  rationale: Sa kontekstong Paulino at sa kasunod na mga utos, tumutukoy ito sa kilalang Kautusan; ang malaking titik ay tumutulong na ipakitang hindi lamang pangkalahatang batas ang tinutukoy.
- source_word: πεπλήρωκεν
  choice: nakatupad na
  rationale: Ipinahahayag nito ang perpektong aspekto—isang natupad na kilos na may nananatiling bunga—sa natural na Tagalog.
theological_decisions:
- issue: Saklaw ng pagbabawal tungkol sa pagkakautang
  choice: Isinalin nang tuwiran bilang pagbabawal na magkautang, ngunit hindi pinalawak bilang tahasang pagbabawal sa lahat ng pangungutang.
  alternative: Unawain bilang ganap na pagbabawal sa bawat uri ng pautang, o bilang purong talinghaga lamang para sa moral na obligasyon.
  rationale: Ang Griyego ay gumagamit ng wika ng pagkakautang at pagkatapos ay nagtatangi sa obligasyong magmahal. Dapat panatilihin ng salin ang tensiyong ito nang hindi nilulutas ang mas malawak na usaping etikal.
- issue: Kahulugan ng τὸν ἕτερον
  choice: kapwa, na may talababa para sa mas literal na 'ang iba' o 'ibang tao'
  alternative: ang iba / ibang tao
  rationale: Hindi tahasang ginagamit rito ang Griyegong salita para sa 'kapitbahay.' Ang 'kapwa' ay natural sa Tagalog ngunit hindi dapat itago ang literal na anyong 'the other.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'magkautang' upang mapanatili ang konkretong larawan ng obligasyon, at 'Kautusan' para sa kilalang Kautusang tinutukoy sa konteksto.
