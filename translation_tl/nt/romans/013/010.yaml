base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: tl
  text: Ang pag-ibig ay hindi gumagawa ng masama sa kapwa[a]; kaya ang pag-ibig ang katuparan ng Kautusan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi gumagawa ng masama laban sa kapwa.”
    reason: lexical_alternative
  - marker: b
    text: O “ang pag-ibig ang kaganapan ng Kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: ang pag-ibig
  rationale: Likas at malinaw na katumbas sa makabagong Tagalog; pinananatili rin ang pag-uulit ng salita sa dalawang sugnay.
- source_word: τῷ πλησίον
  choice: sa kapwa
  rationale: Ang datibo ay tumutukoy sa taong apektado. Ang “kapwa” ay natural na pangkalahatang katawagan sa Tagalog at hindi nililimitahan ang diwa sa taong pisikal na nakatira sa tabi.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: hindi gumagawa ng masama
  rationale: 'Malapit sa anyo at lawak ng Griyego: ang ἐργάζεται ay “gumagawa,” at ang κακόν ay “masama.” Hindi nito ipinapaliit ang diwa sa pisikal na pinsala lamang.'
- source_word: πλήρωμα
  choice: katuparan
  rationale: Ipinahahayag ang bagay na tumutupad o nagdadala sa Kautusan sa ganap na layunin nito, habang pinananatili ang nominal na pahayag ng Griyego.
- source_word: οὖν
  choice: kaya
  rationale: Natural na panandang panghinuha sa modernong Tagalog at malinaw na nag-uugnay sa konklusyon sa naunang pahayag.
- source_word: νόμου
  choice: ng Kautusan
  rationale: Sa konteksto, tumutukoy ito sa kinikilalang Kautusan. Ginamit ang malaking titik upang ipahiwatig ang partikular na Kautusang tinatalakay ni Pablo nang hindi nagdaragdag ng paliwanag sa teksto.
theological_decisions:
- issue: Kaugnayan ng pag-ibig sa Kautusan
  choice: ang pag-ibig ang katuparan ng Kautusan
  alternative: tinutupad ng pag-ibig ang Kautusan; ang pag-ibig ang kabuuan ng Kautusan
  rationale: Nominal ang sugnay na Griyego, kaya pinananatili ng saling ito ang pagkakakilanlan ng pag-ibig bilang πλήρωμα, sa halip na tahimik itong gawing pandiwang pahayag. Ang “katuparan” ay mas malinaw kaysa “kabuuan” ngunit kinikilala sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “kapwa” kaysa “kapitbahay” upang mapanatili ang pangkalahatang etikal na saklaw ng πλησίον. Pinanatili ang dalawang pagbanggit sa “pag-ibig” at ang nominal na anyo ng ikalawang sugnay.
