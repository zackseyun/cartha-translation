reference: Romans 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: tl
  text: 'At gawin ninyo ito, yamang alam ninyo ang panahon: ngayon na ang oras upang kayo''y[a] gumising mula sa pagkakatulog, sapagkat mas malapit na ngayon ang ating kaligtasan kaysa noong tayo ay naniwala.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito, “tayo” ang mababasa sa halip na “kayo.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “noong una tayong naniwala.” Sa Griyego, “noong tayo ay naniwala” lamang ang nakasaad.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: At gawin ninyo ito
  rationale: Tumutukoy ang τοῦτο sa mga naunang tagubilin at may ipinahihiwatig na utos. Nililinaw ng “gawin ninyo ito” ang ugnayan nang hindi nagdaragdag ng bagong diwa.
- source_word: εἰδότες τὸν καιρόν
  choice: yamang alam ninyo ang panahon
  rationale: Ipinapanatili ng “alam ninyo” ang diwa ng participle, samantalang ipinahihiwatig ng “yamang” ang likas na sanhi sa konteksto. Ang “panahon” ay tumutukoy sa mapagpasiyang kapanahunan, hindi lamang sa oras ayon sa relo.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: oras na para kayong
  rationale: Ang “oras na” ay natural na Filipino para sa kasalukuyan at apurahang sandali na ipinahahayag ng ὥρα at ἤδη. Ang “kayo” ay sumusunod sa ikalawang panauhang maramihan ng SBLGNT.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: gumising mula sa pagkakatulog
  rationale: Pinananatili nito ang metapora ng pagbangon mula sa tulog sa malinaw at makabagong pananalita.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: sapagkat mas malapit na ngayon ang ating kaligtasan
  rationale: Ang “sapagkat” ay naghahayag ng dahilan, at ang “mas malapit na ngayon” ay nagpapanatili sa paghahambing at sa pag-usad patungo sa kaligtasang nalalapit.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: kaysa noong tayo ay naniwala
  rationale: Tuwirang isinasalin ang ἐπιστεύσαμεν bilang “naniwala” at hindi idinaragdag ang “unang,” na hindi hayagang nasa Griyego.
theological_decisions:
- issue: Ang kaligtasan ay sinasabing mas malapit na ngayon kaysa noong naniwala ang mga mananampalataya
  choice: ating kaligtasan
  alternative: ang ganap nating kaligtasan / ang pagliligtas sa atin sa pagbabalik ng Panginoon
  rationale: 'Hindi nililimitahan ng salin ang σωτηρία sa isang tiyak na yugto. Sa gayon, nananatili ang tensiyon sa teksto: pag-aari na nila ang kaligtasan bilang “atin,” ngunit inilalarawan din itong nalalapit pa.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “yamang” at “sapagkat” upang mapanatili ang seryosong himig, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang panghalip na “ninyo/kayo” ay maramihan.
