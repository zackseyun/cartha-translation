revisions:
- from: Sapagkat ito ay lingkod ng Diyos para sa iyong ikabubuti. Ngunit kung gumagawa ka ng masama, matakot ka, sapagkat hindi nito taglay ang tabak nang walang kabuluhan.[a] Sapagkat ito ay lingkod ng Diyos, isang tagapaghiganti upang magpataw ng poot sa gumagawa ng masama.[b]
  to: Sapagkat ito ay lingkod ng Diyos para sa iyong ikabubuti. Ngunit kung gumagawa ka ng masama, matakot ka, sapagkat hindi nito dala ang tabak nang walang kabuluhan.[a] Sapagkat ito ay lingkod ng Diyos, isang tagapaghiganting nagpapairal ng poot laban sa gumagawa ng masama.[b]
  rationale: Pinalitan ang “taglay” ng “dala” para sa mas natural na modernong Tagalog. Inayos ang huling sugnay upang maging mas malinaw at idiomatiko ang tungkulin ng awtoridad bilang ἔκδικος, habang pinananatili ang “poot” na walang idinagdag na pantukoy na “ng Diyos.” Iningatan din ang konkretong larawan ng “tabak” at ang mga angkla ng talababa.
