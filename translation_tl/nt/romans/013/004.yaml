id: ROM.13.4
reference: Romans 13:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: tl
  text: Sapagkat ito ay lingkod ng Diyos para sa iyong ikabubuti. Ngunit kung gumagawa ka ng masama, matakot ka, sapagkat hindi nito dala ang tabak nang walang kabuluhan.[a] Sapagkat ito ay lingkod ng Diyos, isang tagapaghiganting nagpapairal ng poot laban sa gumagawa ng masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang walang saysay.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “isang tagapaghiganti upang magpataw ng poot laban sa gumagawa ng masama.”'
    reason: translation_alternative
lexical_decisions:
- source_word: διάκονός
  choice: lingkod
  rationale: Tumutukoy ito sa isang ahenteng naglilingkod o tumutupad ng atas. Ang “lingkod” ay malinaw sa makabagong Tagalog at hindi nililimitahan ang salita sa isang katungkulang pansimbahan.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: para sa iyong ikabubuti
  rationale: Ipinahahayag ng parirala ang kapakinabangan para sa kinakausap, hindi lamang direksiyon patungo sa kaniya.
- source_word: τὸ κακὸν ποιῇς
  choice: gumagawa ka ng masama
  rationale: Natural itong Tagalog at pinananatili ang moral na diwa ng κακόν.
- source_word: φοβοῦ
  choice: matakot ka
  rationale: Tuwirang ipinahahayag ng pautos ang nararapat na takot sa kapangyarihang magparusa ng awtoridad.
- source_word: εἰκῇ
  choice: nang walang kabuluhan
  rationale: Ipinahahayag nito na ang pagdadala ng tabak ay hindi walang layunin o saysay.
- source_word: μάχαιραν
  choice: tabak
  rationale: Pinananatili ang kongkretong larawan at sagisag ng kapangyarihang magparusa sa halip na palabuin ito bilang “sandata.”
- source_word: φορεῖ
  choice: taglay
  rationale: Ang φορέω ay maaaring tumukoy sa palagian o opisyal na pagdadala. Ang “taglay” ay angkop sa sagisag ng awtoridad sa kontekstong ito.
- source_word: ἔκδικος
  choice: tagapaghiganti
  rationale: Pinananatili nito ang retributibong diwa ng isang ahenteng nagsasagawa ng ganti o katarungan.
- source_word: εἰς ὀργὴν
  choice: upang magpataw ng poot
  rationale: Natural itong pagpapahayag ng layunin o bunga, habang hindi tahasang dinaragdagan ng “ng Diyos,” na wala sa mismong pariralang Griyego.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: sa gumagawa ng masama
  rationale: Inilalarawan ng substantibong participle ang taong nagsasagawa ng masama; malinaw at natural ang salin nang hindi nagdaragdag ng ibang etiketa.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili nito ang paliwanag na ugnayan ng mga sugnay sa pangangatwiran ni Pablo.
theological_decisions:
- issue: Ang kapangyarihang magparusa ng awtoridad kaugnay ng poot
  choice: “upang magpataw ng poot” nang hindi tinutukoy sa pangunahing teksto kung kaninong poot ito
  alternative: “upang magpataw ng poot ng Diyos” o “upang magparusa”
  rationale: Malakas na ipinahihiwatig ng konteksto na kumikilos ang awtoridad bilang lingkod ng Diyos, ngunit hindi tahasang inuulit ng εἰς ὀργὴν ang “ng Diyos.” Pinananatili ng salin ang teolohikal na kaugnayan at ang likas na kaiklian ng Griyego nang hindi nilulutas ang hindi tahasang sinabi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/nito” para sa awtoridad na tinutukoy sa konteksto, at pinanatili ang “tabak,” “tagapaghiganti,” at “poot” upang hindi pahupain ang matinding wika ng orihinal.
