    issue: Hindi natural ang “hindi nito taglay ang tabak.”
    rationale: Bagaman nauunawaan ang “taglay,” mas karaniwan at mas angkop sa φορεῖ ang “dala,” lalo na para sa isang awtoridad na may dalang tabak bilang sagisag ng kapangyarihang magparusa.
  - severity: low
    issue: Medyo mabigat ang “isang tagapaghiganti upang magpataw ng poot sa.”
    rationale: Ang “isang tagapaghiganting nagpapairal ng poot laban sa” ay mas maayos na Tagalog at naipapakita ang tungkuling inilalarawan ng ἔκδικος εἰς ὀργήν nang hindi tinutukoy kung kaninong poot ito.
  revised_text: Sapagkat ito ay lingkod ng Diyos para sa iyong ikabubuti. Ngunit kung gumagawa ka ng masama, matakot ka, sapagkat hindi nito dala ang tabak nang walang kabuluhan.[a] Sapagkat ito ay lingkod ng Diyos, isang tagapaghiganting nagpapairal ng poot laban sa gumagawa ng masama.[b]
