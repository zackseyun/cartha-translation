base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: tl
  text: Malalim na ang gabi[a], at nalalapit na ang araw. Kaya iwaksi natin ang mga gawa ng kadiliman at isuot natin ang baluti ng liwanag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sumulong na ang gabi.” Inilalarawan ng pandiwang Griyego ang gabi bilang nakasulong na, samakatuwid ay malaking bahagi na nito ang lumipas.
    reason: lexical_alternative
  - marker: b
    text: O, “mga sandata ng liwanag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: ang gabi
  rationale: Pinanatili ang literal na larawang pangpanahon at ang tuwirang pagtutol nito sa “araw,” nang hindi agad ipinapakahulugang “masamang kapanahunan.”
- source_word: προέκοψεν
  choice: malalim na
  rationale: Likas na sawikain sa Filipino ang “malalim na ang gabi” para sa gabing malayo na ang isinulong. Naipahihiwatig nito na malaking bahagi ng gabi ang lumipas, habang pinananatili sa talababa ang mas literal na diwa ng pagsulong.
- source_word: ἡ ἡμέρα
  choice: ang araw
  rationale: Pinanatili ang temporal na larawan at ang pagtutol sa “gabi.” Sa konteksto, malinaw na tumutukoy ito sa panahon ng araw, hindi lamang sa araw bilang bagay sa langit.
- source_word: ἤγγικεν
  choice: nalalapit na
  rationale: Ipinapahayag ang paglapit na nagbunga ng kasalukuyang kalapitan, alinsunod sa aspektong perpekto ng pandiwang Griyego.
- source_word: ἀποβαλώμεθα
  choice: iwaksi natin
  rationale: Ang hortatory subjunctive ay likas na isinalin bilang sama-samang panawagan. Ang “iwaksi” ay malinaw at masigla, at naipapahiwatig ang pag-aalis nang hindi lumilikha ng di-likas na pariralang “hubarin ang mga gawa.”
- source_word: τὰ ἔργα
  choice: mga gawa
  rationale: Karaniwang salitang Paulino ang “mga gawa” at tuwirang naghahatid ng moral na diwa rito.
- source_word: τοῦ σκότους
  choice: ng kadiliman
  rationale: Literal na pinananatili ang etikal na talinghaga, nang hindi ito tuwirang pinapalitan ng “kasamaan.”
- source_word: ἐνδυσώμεθα
  choice: isuot
  rationale: Pinananatili ang larawan ng pagsusuot at ang sama-samang panawagan ng hortatory subjunctive.
- source_word: τὰ ὅπλα
  choice: ang baluti
  rationale: Maaaring tumukoy ang ὅπλα sa mga sandata o kagamitang pandigma. Dahil ginagamit ang pandiwang “isuot,” ang “baluti” ang pinakanatural na pangunahing salin, habang itinatala ang “mga sandata” bilang tunay na alternatibo.
- source_word: τοῦ φωτός
  choice: ng liwanag
  rationale: Literal na pinananatili ang pagtutol sa kadiliman at ang sabay na etikal at eskatolohikal na bisa ng larawan.
theological_decisions:
- issue: Eskatolohikal na talinghaga ng gabi at araw
  choice: Pinanatili ang “gabi” at “araw” bilang mga larawang pangpanahon, na may pahiwatig na ang gabi ay malayo na ang isinulong at nalalapit na ang araw.
  alternative: “Malapit nang matapos ang madilim na kapanahunang ito; malapit na ang bagong panahon.”
  rationale: Ang teksto ay may sabay na temporal, etikal, at eskatolohikal na bisa. Ang tahasang pagpapaliwanag sa mga larawan bilang mga kapanahunan ay magsasara sa sadyang lawak ng talinghaga.
- issue: Kahulugan ng ὅπλα τοῦ φωτός
  choice: baluti ng liwanag
  alternative: mga sandata ng liwanag
  rationale: Pinapaboran ng “isuot” ang kagamitang pandigmang isinusuot, ngunit malawak ang saklaw ng ὅπλα at maaari rin itong mangahulugang “mga sandata”; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nalalapit” at “iwaksi” bilang mga salitang pormal ngunit karaniwang nauunawaan; iniwasan ang labis na lumang anyo at ang mapagpaliwanag na paraphrase.
