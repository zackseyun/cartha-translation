  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: tl
  text: Dahil dito, nagbabayad din kayo ng mga buwis, sapagkat sila ay mga lingkod ng Diyos na patuloy na nakatuon sa mismong tungkuling ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: nagbabayad ng mga buwis
  rationale: Likas at malinaw na katumbas sa modernong Filipino; ang φόρος ay buwis o tributo, at ang τελεῖτε dito ay tumutukoy sa pagbabayad nito.
- source_word: λειτουργοὶ θεοῦ
  choice: mga lingkod ng Diyos
  rationale: Pinananatili ang diwa ng mga taong gumaganap ng pampublikong paglilingkod sa ilalim ng Diyos, nang hindi ipinapalagay na sila ay mga paring tagapaglingkod.
- source_word: προσκαρτεροῦντες
  choice: patuloy na nag-uukol ng sarili
  rationale: Ipinahahayag ang matiyaga at tuloy-tuloy na pagtatalaga sa gawain, hindi lamang ang panandaliang pagsasagawa nito.
- source_word: εἰς αὐτὸ τοῦτο
  choice: sa mismong tungkuling ito
  rationale: Ibinibigay ang diin ng αὐτὸ τοῦτο at nililinaw sa natural na Filipino na ang tinutukoy ay ang gawaing pampamahalaan na nasa konteksto.
theological_decisions:
- issue: Ang kaugnayan ng mga namamahala sa Diyos
  choice: sila ay mga lingkod ng Diyos
  alternative: sila ay naglilingkod sa Diyos
  rationale: Mas tapat ang nominal na pahayag sa λειτουργοὶ θεοῦ at hindi nito higit na nilulutas kung sinasadya o kinikilala ng mga pinuno ang kanilang paglilingkod sa Diyos.
- issue: Saklaw ng “mismong tungkuling ito”
  choice: pinanatiling pangkalahatan ayon sa agarang konteksto
  alternative: tahasang tukuyin bilang pangongolekta ng buwis
  rationale: Maaaring tumukoy ang parirala sa tungkulin ng pamamahala na kinabibilangan ng pangongolekta ng buwis; hindi dapat paliitin nang walang katiyakan ang saklaw nito.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “mga buwis” at “mga lingkod ng Diyos” bilang pamilyar ngunit tumpak na mga pahayag; iniwasan ang mas lumang “nagbabayad kayo ng tributo” at ang eklesyastikal na “mga ministro.”
