revisions:
- from: Sa halip, isuot ninyo ang Panginoong Jesus na Mesiyas, at huwag ninyong paglaanan ang laman[a] para sa mga pagnanasa nito.
  to: Ngunit isuot ninyo ang Panginoong Jesus na siyang Mesiyas, at huwag kayong maglaan para sa laman[a] upang pagbigyan ang mga pagnanasa nito.
  rationale: Binago ang pangwakas na sugnay upang malinaw na ang ipinagbabawal ay ang paglalaan para sa laman na may layuning pagbigyan ang mga pagnanasa nito. Pinanatili ang “laman” sa pangunahing teksto upang huwag lutasin nang maaga ang saklaw ng σάρξ, habang ang talababa ay nagbibigay ng lehitimong alternatibong pagpapakahulugan. Nilinaw rin ang “Mesiyas” bilang titulo at ginawang mas tuwiran ang pangatnig.
