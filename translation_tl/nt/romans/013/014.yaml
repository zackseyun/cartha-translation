  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: tl
  text: Ngunit isuot ninyo ang Panginoong Jesus na siyang Mesiyas, at huwag kayong maglaan para sa laman[a] upang pagbigyan ang mga pagnanasa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makasalanang kalikasan.” Ang salitang Griyego ay “laman,” na madalas gamitin ni Pablo para sa mga makasalanang udyok ng tao, na kasalungat ng pamumuhay na pinapatnubayan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: isuot ninyo
  rationale: Pinananatili nito ang metapora ng pananamit at ang lakas ng pautos na anyong pangmaramihan.
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  choice: ang Panginoong Jesus na Mesiyas
  rationale: Pinananatili ang κύριος bilang titulong “Panginoon” at ipinahahayag ang Χριστός bilang titulong “Mesiyas,” hindi bilang apelyido; natural sa Filipino ang pang-ugnay na “na.”
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: huwag ninyong paglaanan
  rationale: Ipinahahayag ang ideya ng hindi patiunang paghahanda o paglalaan para sa isang bagay, nang hindi labis na pinahahaba ang pangungusap.
- source_word: σάρξ
  choice: laman
  rationale: Pinananatili ang pangunahing katawagan at metapora ni Pablo sa halip na agad itong ipakahulugang “makasalanang kalikasan.”
- source_word: εἰς ἐπιθυμίας
  choice: para sa mga pagnanasa nito
  rationale: Malapit ito sa anyo at sadyang lawak ng pariralang Griyego, at hindi ipinapasok sa pangunahing teksto ang mas tiyak na interpretasyong “upang pagbigyan.”
theological_decisions:
- issue: Kahulugan ng σάρξ sa kontekstong moral
  choice: laman
  alternative: makasalanang kalikasan
  rationale: Bagaman tumutukoy ang konteksto sa masasamang pagnanasa ng taong hiwalay sa pamumuhay na pinapatnubayan ng Diyos, masyadong nililimitahan ng “makasalanang kalikasan” ang masaklaw at masalimuot na gamit ni Pablo sa σάρξ. Pinananatili ng “laman” ang tensiyong teolohikal.
- issue: Paglalahad sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito ay taglay pa rin ng Χριστός ang diwa ng titulo. Ang “Mesiyas” ay naghahayag ng kahulugan nito, samantalang ang “Cristo” ay madaling maunawaan bilang bahagi lamang ng pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metapora ng pagsusuot at ang katawagang “laman,” habang iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
