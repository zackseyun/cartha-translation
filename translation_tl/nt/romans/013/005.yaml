  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: tl
  text: Kaya kailangang magpasakop[a], hindi lamang dahil sa poot[b] kundi dahil din sa budhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapailalim.”
    reason: lexical_alternative
  - marker: b
    text: O “kaparusahan.” Ang Griyego ay literal na “poot,” na maaaring tumukoy sa pagpaparusa ng namamahala o, sa mas malawak na diwa, sa poot ng Diyos na kumikilos sa pamamagitan ng awtoridad ng pamahalaan.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kaya
  rationale: Ipinahahayag nito ang kongklusyon mula sa naunang paliwanag tungkol sa mga namamahala; natural at malinaw ang “Kaya” sa makabagong Tagalog.
- source_word: ἀνάγκη
  choice: kailangang
  rationale: Pinananatili nito ang di-personal na diwa ng pangangailangan o obligasyon nang hindi dinaragdagan ang sinasabi ng teksto.
- source_word: ὑποτάσσεσθαι
  choice: magpasakop
  rationale: Malinaw nitong ipinahahayag ang hinihinging postura sa mga namamahala. Hindi nito awtomatikong ipinapakahulugan ang ganap o walang-pasubaling pagsunod.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: hindi lamang … kundi dahil din
  rationale: Natural na katumbas ito ng magkaugnay na konstruksiyong Griyego at malinaw na pinananatili ang dalawang dahilan.
- source_word: διὰ τὴν ὀργὴν
  choice: dahil sa poot
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan. Pinananatili ng “poot” ang leksikal na halaga ng ὀργή at ang kalabuan kung ito ay poot ng Diyos o kaparusahang isinasagawa ng pinuno.
- source_word: διὰ τὴν συνείδησιν
  choice: dahil din sa budhi
  rationale: Ipinahahayag ng “budhi” ang panloob na kamalayang moral, at pinananatili ng “dahil” ang pagkakapantay ng dalawang pariralang nagsasaad ng dahilan.
theological_decisions:
- issue: Tinutukoy ng ὀργή
  choice: poot
  alternative: kaparusahan; poot ng Diyos; kaparusahang ipinatutupad ng namamahala
  rationale: Hindi tahasang tinutukoy ng Griyego kung kaninong poot ito. Dahil binabanggit sa konteksto kapuwa ang pagkatalaga ng Diyos sa mga awtoridad at ang pinunong may dalang tabak, pinananatili ng salin ang tunay na kalabuan.
- issue: Saklaw ng ὑποτάσσεσθαι
  choice: magpasakop
  alternative: mapailalim; pasakop
  rationale: Ipinahahayag nito ang nararapat na pagtugon sa mga namamahala ngunit hindi nagdaragdag ng doktrina ng walang-pasubaling pagsunod na hindi tahasang sinasabi sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “budhi” bilang maikli at karaniwang salitang Filipino para sa συνείδησις. Inilagay ang bawat talababa sa mismong salitang tinutukoy nito.
