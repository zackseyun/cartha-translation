id: ROM.13.2
reference: Romans 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: tl
  text: Kaya nga, ang lumalaban sa awtoridad ay sumasalungat sa kaayusang itinakda ng Diyos[a]; at ang mga nakalaban na ay tatanggap ng hatol laban sa kanilang sarili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kaayusan ng Diyos” o “sa itinakda ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hatol” ay maaari ding isaling “paghatol” o “kaparusahan,” ngunit hindi hinihingi ng Griyego rito ang mas matinding diwa ng pangwakas na pagkondena.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kaya
  rationale: Ipinahihiwatig nito ang konklusyong nagmumula sa naunang talata; natural at malinaw ang “Kaya” sa modernong Tagalog.
- source_word: ὁ ἀντιτασσόμενος
  choice: ang lumalaban
  rationale: Ang participle na may pantukoy ay tumutukoy sa sinumang taong patuloy na naninindigan laban sa awtoridad.
- source_word: τῇ ἐξουσίᾳ
  choice: sa awtoridad
  rationale: Pinananatili ang anyong isahan at ang pangkalahatang salita, habang nililinaw ng konteksto ng Roma 13:1 na namamahalang awtoridad ang tinutukoy.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: sa kaayusang itinakda ng Diyos
  rationale: Ipinahahayag ng διαταγή ang isang kaayusan o pagtatakda. Naipakikita ng parirala na ang kaayusan tungkol sa awtoridad ay nagmula sa Diyos nang hindi ito ginagawang isang tiyak na nakasulat na utos.
- source_word: ἀνθέστηκεν
  choice: ay sumasalungat
  rationale: Ipinahahayag ang paninindigang laban sa itinakda ng Diyos. Natural sa Tagalog ang kasalukuyang anyo rito, bagaman ang Griyegong perfect ay nagpapahiwatig ng nagawang pagsalungat na nananatiling may bisa.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: at ang mga sumasalungat
  rationale: Pinananatili ang pagkakaugnay sa naunang pandiwa at ang pangkalahatang pagtukoy sa mga taong nanindigan laban dito.
- source_word: ἑαυτοῖς
  choice: sa kanilang sarili
  rationale: Ipinakikita ng reflexive dative na sa mga sumasalungat mismo babagsak ang kahihinatnan.
- source_word: κρίμα
  choice: hatol
  rationale: Malawak ang saklaw ng κρίμα at maaaring tumukoy sa paghatol, hatol, o kaparusahan. Ang “hatol” ay malinaw ngunit hindi kinakailangang mangahulugan ng walang-hanggang kapahamakan.
- source_word: λήμψονται
  choice: tatanggap
  rationale: Tuwirang pinananatili ang diwa ng hinaharap na pagtanggap o pagtatamo ng kahihinatnan.
theological_decisions:
- issue: Saklaw ng κρίμα
  choice: hatol
  alternative: paghatol; kaparusahan
  rationale: Nagbibigay ang talata ng seryosong babala ngunit hindi nito tahasang tinutukoy ang walang-hanggang paghatol. Pinananatili ng “hatol” ang lawak at tensiyon ng salitang Griyego.
- issue: Tinutukoy ng ἐξουσία
  choice: awtoridad, na ayon sa konteksto ay namamahalang awtoridad
  alternative: awtoridad sa mas malawak at abstraktong diwa
  rationale: Ang agarang konteksto ng Roma 13:1 ay tungkol sa mga namamahalang awtoridad. Gayunman, hindi idinagdag sa mismong talata ang salitang “pamahalaan,” upang hindi maging mas tiyak kaysa sa tekstong Griyego.
- issue: Ugnayan ng awtoridad at kaayusan ng Diyos
  choice: Ang paglaban sa awtoridad ay pagsalungat sa kaayusang itinakda ng Diyos
  alternative: Ang bawat kilos ng isang pinuno ay tuwirang utos ng Diyos
  rationale: Ang talata ay nagsasalita tungkol sa kaayusang itinatag ng Diyos hinggil sa awtoridad; hindi nito tahasang sinasabing bawat partikular na kilos ng bawat pinuno ay utos ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “awtoridad,” na karaniwan at madaling maunawaan, at iniwasan ang labis na legalistiko o denominasyonal na pananalita.
