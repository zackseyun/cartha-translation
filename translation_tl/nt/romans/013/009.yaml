id: ROM.13.9
reference: Romans 13:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: tl
  text: 'Sapagkat ang mga utos na “Huwag kang mangalunya, huwag kang pumaslang[a], huwag kang magnakaw, huwag kang mag-imbot,” at anumang iba pang utos ay nabubuod sa pahayag[b] na ito: “Ibigin mo ang iyong kapwa gaya ng iyong sarili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Griyego ay tumutukoy sa pagpaslang o pagpatay sa tao, hindi sa lahat ng uri ng pagkitil ng buhay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “salita” o “kasabihan.” Dito ay tumutukoy ito sa isang bumubuod na pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Sapagkat ang mga utos na
  rationale: Ipinakikilala ng parirala ang nilalaman ng mga utos na kasunod. Idinagdag ang “mga utos” upang maging likas at malinaw sa Tagalog ang substantivized na anyo ng Griyego.
- source_word: μοιχεύσεις
  choice: huwag kang mangangalunya
  rationale: Ang future indicative sa sipi ng Sampung Utos ay may puwersa ng utos; pinananatili ng anyong “huwag kang” ang pormal na pagbabawal sa natural na Tagalog.
- source_word: φονεύσεις
  choice: huwag kang papaslang
  rationale: Ang φονεύω ay tumutukoy sa pagpatay sa tao, lalo na sa labag sa batas o may-salang pagpatay, hindi sa bawat posibleng uri ng pagkitil ng buhay. Mas tiyak dito ang “papaslang” kaysa sa malawak na “papatay.”
- source_word: κλέψεις
  choice: huwag kang magnanakaw
  rationale: Likas na anyo ito ng pagbabawal sa Tagalog at pinananatili ang hulma ng mga utos na sinipi.
- source_word: ἐπιθυμήσεις
  choice: huwag kang mag-iimbot
  rationale: Sa konteksto ng Sampung Utos, ang ἐπιθυμέω ay mas tiyak na tumutukoy sa pag-iimbot kaysa sa pangkalahatang pagnanais.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: at anumang iba pang utos
  rationale: Ipinahihiwatig nito na saklaw din ang alinmang utos na hindi tahasang inilista, nang hindi nililimitahan ang tinutukoy.
- source_word: ἀνακεφαλαιοῦται
  choice: ay nabubuod
  rationale: Ipinapahayag ng pandiwa ang pagsasama-sama o paglalagom sa ilalim ng isang pangunahing pahayag. Malinaw at kasalukuyang Tagalog ang “nabubuod.”
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: sa salitang ito
  rationale: Ang λόγος dito ay isang binigkas o nakasulat na pahayag, hindi lamang isang hiwalay na bokabularyong salita. Pinananatili sa pangunahing teksto ang maikling “salita,” habang nililinaw sa talababa ang posibleng diwa.
- source_word: Ἀγαπήσεις
  choice: Ibigin mo
  rationale: Ginagawang tahasang utos sa Tagalog ang future indicative na ginamit sa sipi mula sa Kasulatan, habang pinananatili ang pormal at marangal na himig.
- source_word: πλησίον
  choice: kapwa
  rationale: Ang “kapwa” ay natural at malawak na katumbas sa modernong Tagalog para sa taong itinuturing na kapwa o neighbor, at angkop sa sipi mula sa Levitico.
- source_word: ὡς σεαυτόν
  choice: gaya ng iyong sarili
  rationale: Tuwirang pinananatili nito ang maikling paghahambing ng Griyego nang hindi idinaragdag ang paliwanag na “kung paano mo iniibig.”
theological_decisions:
- issue: Anyo ng mga pagbabawal mula sa Sampung Utos
  choice: Ginamit ang magkakatulad na anyong “Huwag kang …”
  alternative: Gamitin ang anyong hinaharap na “Hindi ka …”
  rationale: Bagaman future indicative ang anyong Griyego dahil sa estilo ng sipi sa Kasulatan, ang “Huwag kang …” ang malinaw, pormal, at likas na anyo ng utos sa Tagalog at hindi binabago ang lakas nito.
- issue: Saklaw ng φονεύσεις
  choice: papaslang
  alternative: papatay
  rationale: Iniiwasan ng “papaslang” ang pagpapalawak sa utos na para bang ipinagbabawal nito ang bawat uri ng pagkitil ng buhay; pinananatili nito ang mas tiyak na diwa ng salitang Griyego nang hindi naglalagay ng denominasyonal na paliwanag.
- issue: Diwa ng λόγος sa pariralang ἐν τῷ λόγῳ τούτῳ
  choice: salita, na nauunawaan bilang bumubuod na pahayag
  alternative: pahayag o kasabihan
  rationale: Hindi lamang isang hiwalay na salita ang tinutukoy kundi ang kasunod na pormulasyon mula sa Kasulatan. Pinananatili ng “salita” ang siksik na anyo ng Griyego, at kinikilala sa talababa ang leksikal na lawak nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pormal na bokabularyong biblikal na “mangangalunya,” “mag-iimbot,” at “Ibigin,” ngunit iniwasan ang lipas o labis na teknikal na kayarian. Itinama ang pagkakalagay ng mga marker upang ang talababa tungkol sa pagpaslang ay kasunod ng “papaslang,” at ang talababa tungkol sa λόγος ay kasunod ng “salitang.”
