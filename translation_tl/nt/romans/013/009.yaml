  to: 'Sapagkat ang mga utos na “Huwag kang mangalunya, huwag kang pumaslang[a], huwag kang magnakaw, huwag kang mag-imbot,” at anumang iba pang utos ay nabubuod sa pahayag[b] na ito: “Ibigin mo ang iyong kapwa gaya ng iyong sarili.”'
