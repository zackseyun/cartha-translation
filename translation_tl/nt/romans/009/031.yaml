  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: tl
  text: Ngunit ang Israel, na naghahangad ng isang kautusan ng katuwiran[a], ay hindi nakaabot sa kautusang iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “katarungan”: “isang kautusan ng katarungan.”'
    reason: lexical_alternative
  - marker: b
    text: O “hindi nito iyon narating” o “hindi nakaabot sa kautusan.” Siksik at mahirap unawain ang pariralang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Karaniwang anyo ng pangalang pantangi sa Filipino; sa daloy ng pangangatwiran ni Pablo, tumutukoy ito sa Israel bilang isang bayan.
- source_word: δέ
  choice: Ngunit
  rationale: Ipinahahayag nito ang pagsalungat sa naunang sinabi tungkol sa mga Hentil.
- source_word: διώκων
  choice: na naghahangad
  rationale: Ipinakikita ng pandiwaring Griyego ang masigasig na pagh追 o pagsisikap na maabot ang isang bagay. Likas sa Filipino ang “naghahangad” at hindi nito tahasang idinaragdag ang di-lantad na diwang konsesibo ng “bagaman.”
- source_word: νόμον δικαιοσύνης
  choice: isang kautusan ng katuwiran
  rationale: Pinananatili ang kawalan ng pantukoy sa νόμον at ang siksik na ugnayan ng genitibong δικαιοσύνης, nang hindi ito pinalalawak bilang “kautusang nagdudulot ng katuwiran.”
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang angkop na pangunahing katumbas sa kontekstong Paulino; inilalagay sa talababa ang posibleng “katarungan.”
- source_word: εἰς νόμον
  choice: sa kautusang iyon
  rationale: Itinuturing ang ikalawang νόμον bilang pagbabalik-tukoy sa kautusang hinahangad ng Israel, habang kinikilala sa talababa na siksik at mahirap ang pariralang Griyego.
- source_word: οὐκ ἔφθασεν
  choice: hindi nakaabot
  rationale: Tuwirang ipinahahayag ang kabiguang marating o makamit ang hinahangad na hantungan.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη sa kontekstong Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Mas angkop ang “katuwiran” sa usapin ni Pablo tungkol sa pagiging matuwid, ngunit tunay ding saklaw ng salita ang “katarungan,” kaya pinananatili iyon bilang alternatibo sa talababa.
- issue: Kaugnayan ng ikalawang νόμον sa una
  choice: sa kautusang iyon
  alternative: sa kautusan / dito
  rationale: Ipinahihiwatig ng pag-uulit na hindi naabot ng Israel ang kautusang hinahangad nito. Gayunman, siksik ang Griyego at hindi dapat palawakin sa interpretasyong “layunin ng kautusan” sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na “kautusan” at ang kahirapan ng pariralang Griyego sa halip na lutasin ito sa pamamagitan ng isang mas tiyak na teolohikal na pagpapakahulugan.
