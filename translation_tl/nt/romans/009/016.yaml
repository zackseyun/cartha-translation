  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: tl
  text: Kaya nga[a], hindi ito nakasalalay sa taong nagnanais o sa taong tumatakbo[b], kundi sa Diyos na nagpapakita ng awa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Kaya nga, hindi sa taong nagnanais ni sa taong tumatakbo, kundi sa Diyos na nagpapakita ng awa.” Eliptiko ang Griyego; ipinahihiwatig lamang ng konteksto ang bagay na hindi nakasalalay sa pagnanais o pagtakbo ng tao.'
    reason: lexical_alternative
  - marker: b
    text: Malamang na larawan ng pagsisikap o pagpupunyagi ng tao ang “tumatakbo,” ngunit literal na “tumatakbo” ang pandiwang Griyego.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Pinananatili ng parirala ang pinatinding pangwakas na paghinuha ni Pablo mula sa naunang pangangatwiran, sa natural na makabagong Tagalog.
- source_word: οὐ τοῦ θέλοντος
  choice: hindi ito nakasalalay sa taong nagnanais
  rationale: Ang Griyego ay eliptiko at walang hayag na panaguri. Nililinaw ng “nakasalalay” ang diwa nang hindi tahasang tinutukoy kung kaligtasan, pagpili, o ibang bunga ng layunin ng Diyos ang tinutukoy. Pinananatili ng “nagnanais” ang bolisyunal na diwa ng θέλω.
- source_word: οὐδὲ τοῦ τρέχοντος
  choice: o sa taong tumatakbo
  rationale: Sa isang sugnay na may “hindi,” likas sa Tagalog ang “o.” Literal na “tumatakbo” ang τρέχοντος; pinananatili nito ang larawan, samantalang ipinapaliwanag sa talababa ang posibleng metaporikal na diwa.
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ang “kundi” ang natural na panandang Tagalog para sa mariing pagsalungat pagkatapos ng isang negatibong pahayag.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: sa Diyos na nagpapakita ng awa
  rationale: 'Pinananatili nito ang aktibong pandiwang diwa ng participle: ang Diyos ang gumagawa ng maawaing pagkilos, hindi lamang inilalarawan bilang maawain.'
theological_decisions:
- issue: Eliptikong paksa at saklaw ng pahayag
  choice: Gamitin ang panghalip na “ito” at ang pariralang “hindi ... nakasalalay” nang hindi tahasang pinapangalanan ang kaligtasan, pagpili, o layunin ng Diyos.
  alternative: “Kaya ang kaligtasan/pagpili ng Diyos ay hindi nakasalalay sa pagnanais o pagsisikap ng tao.”
  rationale: Walang hayag na paksa o panaguri sa Griyego. Bagaman ang konteksto ay tungkol sa layunin at awa ng Diyos, ang pagpapanatiling pangkalahatan sa pangunahing teksto ay umiiwas sa pagpapasok ng mas makitid na interpretasyong teolohikal.
- issue: Metapora ng pagtakbo
  choice: Panatilihin ang literal na “tumatakbo” sa pangunahing teksto.
  alternative: “nagsisikap” o “nagpupunyagi”
  rationale: Maaaring tumukoy ang larawan sa pagsisikap ng tao, ngunit literal na pagtakbo ang salitang Griyego. Ang talababa ang naglalahad ng pahiwatig nang hindi pinapalitan ang larawan ni Pablo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong larawan ng pagtakbo at ang elipsis ng orihinal hangga't maaari, habang nagdagdag lamang ng kaunting kinakailangang paglilinaw para maging natural sa Tagalog.
