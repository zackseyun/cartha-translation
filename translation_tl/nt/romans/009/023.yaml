  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: tl
  text: at upang ipakilala niya ang kasaganaan ng kanyang kaluwalhatian sa mga sisidlan ng awa, na inihanda na niya noon pa para sa kaluwalhatian,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: ipakilala niya
  rationale: Ipinahahayag ang layuning maihayag o maipaalam nang malinaw, habang pinananatili ang Diyos bilang ipinahihiwatig na simuno.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: ang kasaganaan ng kanyang kaluwalhatian
  rationale: Mas natural sa modernong Tagalog ang “kasaganaan” kaysa literal na “kayamanan” para sa napakalaking sukat ng kaluwalhatian, nang hindi binabago ang metapora nang higit sa kailangan.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: sa mga sisidlan ng awa
  rationale: Pinananatili ang metaporang “sisidlan” at ang ugnayan nito sa awa; ang “sa” ay natural na katumbas dito ng ἐπί na tumutukoy sa mga pinatutungkulan o pinakikitaan ng kaluwalhatian.
- source_word: προητοίμασεν
  choice: inihanda niya nang una pa
  rationale: Tuwirang pinananatili ang temporal na diwa ng πρό- at ang aktibong kilos ng paghahanda.
- source_word: εἰς δόξαν
  choice: para sa kaluwalhatian
  rationale: Ipinahahayag ang layunin o hantungan ng paghahanda nang hindi nililinaw nang lampas sa saklaw ng Griyego kung paano matatamo ang kaluwalhatian.
theological_decisions:
- issue: Ang tinutukoy ng “mga sisidlan ng awa”
  choice: Pinanatili bilang metapora nang walang dagdag na paliwanag.
  alternative: Isalin bilang “mga taong kinahabagan.”
  rationale: Ang literal na larawan ng mga sisidlan ay mahalaga sa paghahambing sa konteksto at hindi dapat tahimik na gawing tahasang antropolohikal na pahayag.
- issue: Ahensiya sa paunang paghahanda
  choice: “inihanda niya nang una pa,” na ang ipinahihiwatig na simuno ay Diyos ayon sa pangungusap at konteksto.
  alternative: Gumamit ng balintiyak na “inihanda nang una pa.”
  rationale: Aktibo ang προητοίμασεν at may isahang simunong ipinahihiwatig; pinananatili ng salin ang gramatikal na ahensiya nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Tagalog. Pinanatili ang bahagyang pormal na metaporang “mga sisidlan ng awa” dahil mahalaga ito sa argumento ng talata. Ang pambungad na “at upang” at pangwakas na kuwit ay nagpapanatili sa anyo nitong nakaugnay sa naunang sugnay.
