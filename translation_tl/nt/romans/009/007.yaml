  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: tl
  text: Hindi rin nangangahulugang dahil lahi sila ni Abraham[a] ay lahat sila'y mga anak. Sa halip, “Sa pamamagitan ni Isaac tatawagin ang iyong lahi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “binhi” o “mga inapo.” Pang-isahan ngunit kolektibo ang salitang Griyego.
    reason: lexical_alternative
  - marker: b
    text: Lit. “Kay Isaac” o “Sa loob ni Isaac.” Sa siping ito mula sa Genesis 21:12, ipinahihiwatig ng parirala ang linya o pamamagitan ni Isaac. Ang “tatawagin” ay maaari ring unawain bilang “papangalanan” o “itatalaga”; tingnan ang Genesis 21:12.
    reason: lexical_alternative_cross_reference
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Hindi rin dahil
  rationale: Ipinagpapatuloy ng οὐδέ ang naunang pagtanggi, at ipinakikilala ng ὅτι ang batayan; natural at malinaw sa Tagalog ang pinaikling lohikal na anyo.
- source_word: σπέρμα Ἀβραάμ
  choice: lahi ni Abraham
  rationale: Ang σπέρμα ay pang-isahang pangngalang kolektibo para sa supling o mga inapo. Ang “lahi” ay natural sa modernong Tagalog at napapanatili ang kolektibong diwa.
- source_word: πάντες τέκνα
  choice: mga anak na silang lahat
  rationale: Ang τέκνα ay inklusibo sa kasarian. Pinananatili ng “mga anak” ang tuwirang kaibahan sa pagiging pisikal na lahi ni Abraham nang hindi pa ipinapaliwanag ang buong teolohikal na implikasyon.
- source_word: ἀλλ’
  choice: Sa halip
  rationale: Ipinahihiwatig nito ang matalim na pagtutuwid at salungat na punto ni Pablo.
- source_word: Ἐν Ἰσαὰκ
  choice: Kay Isaac
  rationale: Ang ἐν sa siping ito ay tumutukoy kay Isaac bilang linyang pinagmumulan o pinagtitibayan ng lahi. Ang “Kay Isaac” ay maikli, likas, at hindi labis na nagpapakahulugan.
- source_word: κληθήσεταί σοι σπέρμα
  choice: tatawaging iyo ang lahi
  rationale: Pinananatili ng “tatawagin” ang leksikal na diwa ng καλέω at ng sipi sa Genesis. Inilalarawan ng “iyo” ang kaugnayan kay Abraham nang hindi pinapalitan ito ng mas interpretibong “ibibilang.”
theological_decisions:
- issue: Kaugnayan ng pisikal na pagkamula kay Abraham at pagiging mga anak
  choice: Ipinakikita ng talata na hindi lahat ng pisikal na lahi ni Abraham ay dahil lamang dito maituturing na mga anak.
  alternative: Tahasang sabihing “mga anak ng pangako” o “mga anak ng tipan.”
  rationale: Hindi tahasang taglay ng talatang ito ang mga idinagdag na pariralang iyon. Pinananatili ng salin ang kaibahan ngunit hindi inuunahan ang paliwanag ng kasunod na konteksto.
- issue: Diwa ng sipi mula sa Genesis 21:12
  choice: “Kay Isaac tatawaging iyo ang lahi.”
  alternative: “Sa pamamagitan ni Isaac ibibilang ang iyong lahi.”
  rationale: Ang “ibibilang” ay maaaring ipahiwatig ng konteksto ngunit mas interpretibo kaysa κληθήσεται. Pinananatili ng “tatawagin” ang tunay na kalabuan sa pagitan ng pagtawag, pagpapangalan, at pagtatalaga.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lahi” upang maging natural at mapanatili ang kolektibong diwa ng σπέρμα; iniwasan ang mas doktrinal o mas interpretibong mga dagdag.
