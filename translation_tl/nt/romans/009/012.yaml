  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: tl
  text: hindi batay sa mga gawa kundi sa Tumatawag; sinabi sa kanya, “Ang nakatatanda ay maglilingkod sa nakababata.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sipi mula sa Genesis 25:23.
    reason: cross_reference
  - marker: c
    text: O, “Ang mas dakila ay maglilingkod sa mas mababa.” Ang “nakatatanda/nakababata” ay ayon sa konteksto nina Jacob at Esau.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: hindi dahil sa mga gawa
  rationale: Ang ἐκ na may genitive ay maaaring magpahayag ng pinagmulan o batayan. Likas sa modernong Tagalog ang “dahil sa” at pinananatili nito ang maikli at tuwirang pagsalungat ni Pablo.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: kundi dahil sa Tumatawag sa kanya
  rationale: Ang articular present participle ay substantival at tumutukoy sa Diyos. Pinananatili ng “Tumatawag” ang kasalukuyang aspekto; idinagdag ang “sa kanya” bilang likas na layon na nauunawaan sa konteksto, nang hindi tinutukoy kung sino ang tinawag.
- source_word: ἐρρέθη αὐτῇ
  choice: sinabi sa kanya
  rationale: Isinasalin nito ang aorist passive citation formula sa natural na Tagalog habang hindi nagdaragdag ng tahasang tagapagsalita.
- source_word: ὅτι
  choice: panimulang panipi
  rationale: Nagpapakilala rito ang ὅτι ng tuwirang sinabi, na likas ipahayag sa Tagalog sa pamamagitan ng panipi.
- source_word: Ὁ μείζων
  choice: Ang nakatatanda
  rationale: Bagaman maaaring mangahulugang “mas dakila,” ipinakikita ng konteksto nina Esau at Jacob na edad ang tuwirang pagtutunggali rito.
- source_word: δουλεύσει
  choice: ay maglilingkod
  rationale: Saklaw ng δουλεύω ang paglilingkod bilang alipin o pagpapasakop. Ang “maglilingkod” ay nagpapanatili ng lawak ng kahulugan nang hindi labis na ipinapasok ang pormal na pagkaalipin.
- source_word: τῷ ἐλάσσονι
  choice: sa nakababata
  rationale: Sa konteksto ng magkapatid, ang ἐλάσσων ay likas na tumutukoy sa mas bata, bagaman literal din itong maaaring mangahulugang “mas mababa.”
theological_decisions:
- issue: Kung palalawakin ang pagsalungat sa mga gawa at sa Tumatawag upang tahasang ipahayag ang isang doktrina ng walang-kondisyong pagpili
  choice: 'Pinanatili ang maikling pagsalungat: “hindi dahil sa mga gawa kundi dahil sa Tumatawag sa kanya.”'
  alternative: “hindi dahil sa mga gawa kundi dahil sa Diyos na tumatawag”
  rationale: Malinaw ang pagsalungat ng talata sa mga gawa at sa pagtawag ng Diyos, ngunit hindi dapat ipasok sa mismong salin ang mas malawak na konklusyong teolohikal na nagmumula sa konteksto.
- issue: Kung ang μείζων at ἐλάσσων ay isasalin ayon sa edad o pangkalahatang katayuan
  choice: “nakatatanda” at “nakababata,” na may alternatibo sa talababa
  alternative: “mas dakila” at “mas mababa”
  rationale: Sinusuportahan ng sipi mula sa Genesis 25:23 at ng konteksto nina Esau at Jacob ang kahulugang edad, ngunit tunay na taglay ng mga salitang Griyego ang mas pangkalahatang paghahambing kaya itinabi iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “mga gawa” bilang nakaugaliang malinaw na katumbas ng ἔργα, at ang “Tumatawag” upang mapanatili ang substantival present participle at ang magalang na pagtukoy sa Diyos. Inilagay ang lahat ng marker [a], [b], at [c] sa pangunahing teksto.
