base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: tl
  text: Ngunit sino ka, O tao, para sumagot nang pabalang sa Diyos? Sasabihin ba naman ng hinubog sa humubog nito, “Bakit mo ako ginawang ganito?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na: “Bakit mo ako ginawa nang ganito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Ngunit
  rationale: Ipinahihiwatig ng kataga ang mariing pagsalungat o pagtutuwid sa naunang kaisipan. Likas sa modernong Tagalog ang “Ngunit” at hindi nito labis na pinabibigat ang pangungusap.
- source_word: ὦ ἄνθρωπε
  choice: O tao
  rationale: Tuwirang panawag ito sa isang taong kumakatawan sa sangkatauhan. Pinananatili ng “O tao” ang matalim at marangal na retorika nang hindi nililimitahan sa kasariang lalaki.
- source_word: σὺ τίς εἶ
  choice: sino ka
  rationale: Isa itong retorikal na hamon, hindi karaniwang pagtatanong tungkol sa pagkakakilanlan.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: para sumagot nang pabalang sa Diyos
  rationale: Ang ἀνταποκρίνομαι ay may diwang sumagot nang pasalungat o mapanghamon, hindi basta tumugon lamang. Karaniwan at malinaw sa Tagalog ang “sumagot nang pabalang.”
- source_word: μὴ ἐρεῖ
  choice: Sasabihin ba
  rationale: Ang μή sa retorikal na tanong ay umaasang “hindi” ang sagot. Sa Tagalog, naipahihiwatig ito nang likas sa anyong “Sasabihin ba…?” nang hindi ipinapasok ang tahasang pagtanggi sa teksto.
- source_word: τὸ πλάσμα
  choice: ang hinubog
  rationale: Tumutukoy ito sa isang bagay na binuo o hinubog at pinananatili ang larawan ng lumikha at nilikha.
- source_word: τῷ πλάσαντι
  choice: sa humubog dito
  rationale: Pinananatili ang ugnayang pandiwa sa “hinubog” at nililinaw na ang tinutukoy ay ang bagay na hinubog.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Bakit mo ako ginawang ganito?
  rationale: Natural na katumbas ito ng literal na “Bakit mo ako ginawa nang ganito?” at malinaw na pinananatili ang reklamo ng nilikha.
theological_decisions:
- issue: Kumakatawang gamit ng ἄνθρωπε
  choice: Isinalin bilang “O tao”
  alternative: “O lalaki” o “tao ka”
  rationale: Ang isahang panawag ay tumutukoy sa sinumang tao bilang kinatawan ng sangkatauhan sa harap ng Diyos; hindi kinakailangang tukuyin ang kasariang lalaki.
- issue: Tindi ng pagsaway ni Pablo
  choice: “sumagot nang pabalang sa Diyos”
  alternative: “sumagot sa Diyos”
  rationale: Pinananatili nito ang diwa ng pagsalungat at ang tensiyon sa pagitan ng nilalang at ng Diyos, sa halip na gawing neutral ang tugon.
- issue: Retorikal na tanong na may inaasahang negatibong sagot
  choice: “Sasabihin ba…?”
  alternative: “Hindi nga ba sasabihin…?” o “Tiyak na hindi sasabihin…”
  rationale: Ang Griyegong μή ay umaasang hindi ang sagot. Pinananatili ng payak na tanong sa Tagalog ang retorikal na puwersa nang hindi nagdaragdag ng tahasang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Pinanatili ang matalim na retorika ng talata, ang larawan ng paghubog, at ang inaasahang negatibong sagot sa ikalawang tanong.
