  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: tl
  text: Sa kanila ang mga ninuno, at mula rin sa kanila nagmula ang Mesiyas ayon sa laman[a]—siya na higit sa lahat, Diyos na pinupuri magpakailanman[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung tungkol sa kanyang pinagmulang pantao.” Sa literal, “ayon sa laman.”
    reason: lexical_alternative
  - marker: b
    text: 'O, kung ituturing na hiwalay na pagpupuri ang huling sugnay: “Ang Diyos na higit sa lahat ay purihin magpakailanman. Amen,” sa halip na bilang paglalarawan sa Mesiyas.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: mga ninuno
  rationale: Tumutukoy ito sa iginagalang na mga ama ng Israel. Mas natural sa makabagong Tagalog ang “mga ninuno” kaysa sa literal na “mga ama,” at hindi nito nililimitahan ang tinutukoy sa mga patriyarka lamang.
- source_word: ἐξ ὧν
  choice: mula sa kanila nagmula
  rationale: Ipinahahayag ang pinagmulan ng Mesiyas mula sa mga Israelita; natural at malinaw ang pag-uulit ng “nagmula” sa Tagalog.
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Gumaganap dito ang Χριστός bilang titulo at nakaugnay sa mga pribilehiyo at kasaysayan ng Israel.
- source_word: τὸ κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang matalinghagang pananalita ni Pablo at ang tunay na saklaw ng parirala, habang nililinaw sa talababa na tumutukoy ito sa pinagmulang pantao.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: siya na naghahari sa lahat
  rationale: Sa konteksto, ang ἐπὶ πάντων ay nagpapahayag ng kataas-taasang katayuan o pamamahala. Ang “naghahari sa lahat” ay natural na Tagalog at nagpapatuloy sa paglalarawan sa Mesiyas.
- source_word: θεὸς εὐλογητὸς
  choice: Diyos na pinapuri
  rationale: Ipinapahayag ng εὐλογητός sa doxological na gamit ang pagiging karapat-dapat purihin, hindi na ang Diyos ay tumatanggap lamang ng isang pagpapala. Pinananatili ng ayos ang pagbasa na ang “Diyos” ay paglalarawan sa Mesiyas.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Karaniwan, marangal, at idiomatikong katumbas ng panghabang-panahong parirala.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang nakagawiang liturhikal na transliterasyon sa Tagalog.
theological_decisions:
- issue: Kung ang huling sugnay na ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας ay patuloy na naglalarawan sa Mesiyas o isang hiwalay na pagpupuri sa Diyos
  choice: 'Binasa itong pagpapatuloy ng paglalarawan sa Mesiyas: “siya na naghahari sa lahat, Diyos na pinapuri magpakailanman.”'
  alternative: 'Maaaring basahin bilang hiwalay na pagpupuri: “Ang Diyos na naghahari sa lahat ay purihin magpakailanman. Amen.”'
  rationale: Pinakamadaling iugnay sa sintaks ang articular participle na ὁ ὢν sa naunang ὁ χριστός. Gayunman, walang orihinal na bantas ang pinakamaagang mga manuskrito at matagal nang pinagtatalunan ang paghahati ng pangungusap, kaya tahasang pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “mga ninuno” para sa likas na pagkaunawa ng ordinaryong mambabasa, ngunit pinanatili ang Paulinong “ayon sa laman.” Ang gitling bago ang huling sugnay ay nagpapakita ng pangunahing sintaktikong pagbasa nang hindi ikinukubli ang alternatibong bantas na nasa talababa.
