  to: Sa kanila ang mga ninuno, at mula rin sa kanila nagmula ang Mesiyas ayon sa laman[a]—siya na higit sa lahat, Diyos na pinupuri magpakailanman[b]. Amen.
  rationale: Pinalitan ang interpretibong “naghahari sa lahat” ng mas tuwirang “higit sa lahat,” na tumutugma sa ἐπὶ πάντων nang hindi dinaragdagan ang semantikong nilalaman. Inayos din ang pang-ugnay sa unang bahagi at ang pananalita ng talababa b. Nananatili ang pangunahing pagbasa ng Griyego na ang articular participle ay kaugnay ng Mesiyas, habang ang pinagtatalunang hiwalay na doxology ay malinaw na inilalaan sa talababa.
