  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: tl
  text: O wala bang karapatan ang magpapalayok sa luwad[a] upang mula sa iisang masa ng luwad[b] ay gumawa ng isang sisidlan para sa karangalan at ng isa naman para sa kawalang-dangal?[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may kapamahalaan sa luwad.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa iisang limpak” o “mula sa iisang halo ng luwad.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “isang sisidlan para sa marangal na gamit at isa naman para sa karaniwang gamit.”
    reason: alternative_reading
  - marker: d
    text: Kaugnay ang larawang ito sa mga talata sa Lumang Tipan tungkol sa magpapalayok at luwad, gaya ng Isaias 29:16; 45:9; at Jeremias 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Likas na panimula ito sa kasunod na retorikal na tanong at pinananatili ang daloy ng pangangatwiran ni Pablo.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: wala bang karapatan
  rationale: Ipinahihiwatig ng ἐξουσία ang lehitimong kapamahalaan o karapatang magpasya, hindi lamang kakayahan; mas natural dito sa Tagalog ang “karapatan.”
- source_word: ὁ κεραμεὺς
  choice: ang magpapalayok
  rationale: Tiyak at karaniwang katawagan sa taong humuhubog ng mga sisidlang luwad, at pinananatili nito ang larawang mula sa mga propeta.
- source_word: τοῦ πηλοῦ
  choice: sa luwad
  rationale: Sa pariralang “may karapatan sa,” natural na naipapahayag sa Tagalog ang saklaw ng kapamahalaan ng magpapalayok.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: mula sa iisang limpak
  rationale: Ang φύραμα ay isang nahalong masa o limpak. Ang “limpak” ay angkop sa luwad at hindi ipinapalagay na magkahiwalay ang pinagmulan.
- source_word: ποιῆσαι
  choice: na gumawa
  rationale: Payak at tuwirang katumbas ng infinitibong nangangahulugang gumawa o lumikha ng isang bagay.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: ng isang ... at ng isa naman
  rationale: Malinaw na inilalahad ang magkatunggaling dalawang kinalabasan nang hindi labis na ginagaya ang estrukturang Griyego.
- source_word: εἰς τιμὴν
  choice: para sa karangalan
  rationale: Pinananatili ang mismong kategorya ng τιμή at hindi agad nililimitahan ito sa isang tiyak na gamit.
- source_word: σκεῦος
  choice: sisidlan
  rationale: Natural na salitang Tagalog sa konteksto ng magpapalayok at sapat na malawak para sa bagay na hinubog.
- source_word: εἰς ἀτιμίαν
  choice: para sa kawalang-dangal
  rationale: Tuwirang pinananatili ang pagsalungat sa karangalan at hindi ito binabago tungo sa mas interpretatibong “karaniwang gamit.”
theological_decisions:
- issue: Kung ang ἐξουσία ay isasaling “karapatan,” “kapamahalaan,” o “kapangyarihan” sa usapin ng banal na paghahari at pananagutan ng tao
  choice: karapatan
  alternative: kapamahalaan; kapangyarihan
  rationale: Ipinapahayag ng “karapatan” ang lehitimong prerogatibo ng magpapalayok nang hindi ito ginagawang pahayag tungkol lamang sa lakas o kakayahan. Hindi nito nilulutas ang teolohikal na tensiyon na higit sa sinasabi ng talata.
- issue: Kung ang εἰς τιμὴν / εἰς ἀτιμίαν ay bibigyang-kahulugang mga gamit ng sisidlan
  choice: para sa karangalan ... para sa kawalang-dangal
  alternative: para sa marangal na gamit ... para sa karaniwang gamit
  rationale: Honor-shame language ang tahasang ginagamit ng Griyego. Pinananatili ito upang huwag paliitin ang talinghaga sa gamit-pambahay lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “magpapalayok,” “luwad,” at “sisidlan” upang malinaw na mapanatili ang talinghaga. Ang “kawalang-dangal” ay bahagyang pormal ngunit kailangan upang mapanatili ang tuwirang pagtutunggali ng τιμή at ἀτιμία.
