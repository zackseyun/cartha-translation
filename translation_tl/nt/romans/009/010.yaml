base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: tl
  text: At hindi lamang iyon, kundi si Rebeca rin ay naglihi mula sa iisang lalaki—si Isaac na ating ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na may higaan/pagsisiping mula sa isa, si Isaac na ating ama”—isang idyomang tumutukoy sa paglilihi mula sa iisang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: At hindi lamang iyon, kundi ... rin
  rationale: Likas na Filipino na nagpapanatili sa pandugtong at pandagdag na takbo ng argumento ni Pablo.
- source_word: Ῥεβέκκα
  choice: Rebeca
  rationale: Karaniwang anyo ng pangalan sa tradisyong Filipino at malinaw sa mga mambabasa.
- source_word: ἐξ ἑνός
  choice: mula sa iisang lalaki
  rationale: Ginagawang hayag ang ipinahihiwatig na lalaking pinagmulan habang pinananatili ang diin sa iisang ama.
- source_word: κοίτην ἔχουσα
  choice: nang maglihi
  rationale: Natural at marangal na pagpapahayag sa Filipino ng idyomang tumutukoy sa paglilihi bunga ng pagsisiping.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: si Isaac na ating ama
  rationale: Pinananatili ang tuwirang pagkakakilanlan kay Isaac bilang ninunong ama ng nagsasalita at ng kausap.
theological_decisions:
- issue: Gaano kahayag ang idyoma ng paglilihi o pagsisiping sa argumento tungkol sa pagpili
  choice: Ipakahulugan bilang paglilihi ni Rebeca mula sa iisang lalaki
  alternative: Mas literal na 'nagkaroon ng higaan mula sa isa' o mas maigsi na 'nagdalang-tao mula sa isa'
  rationale: Ang pokus ng Griyego ay ang iisang pinagmulan sa ama. Nililinaw ito nang hindi nagdaragdag ng 'mga anak,' na hindi tahasang nasa talata, at hindi rin pinapawi ang kaugnayan ng idyoma sa paglilihi.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang 'ating ama' sa diwang ninuno, at iniwasan ang sobrang literal na 'higaan' sa pangunahing teksto dahil hindi iyon natural sa Filipino; inilagay ang anyong iyon sa talababa.
