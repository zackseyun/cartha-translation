  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: tl
  text: Ngunit hindi naman sa nabigo ang salita ng Diyos. Sapagkat hindi lahat ng nagmula kay Israel[a] ay Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga inapo ni Israel.” Ang pariralang Griego ay tumutukoy sa pinagmulan o angkan.
    reason: lexical_alternative
  - marker: b
    text: Ginamit ang ikalawang “Israel” sa mas makitid na diwa kaysa sa una; ipinagkaiba ni Pablo ang mga nagmula sa Israel at ang tinutukoy niyang “Israel” sa ikalawang gamit.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Ngunit hindi ibig sabihin nito na
  rationale: Natural na Filipino para sa idyomatikong pagtanggi sa isang maaaring hinuha; pinananatili ang pagwawasto ni Pablo nang hindi nagiging mab字.
- source_word: ἐκπέπτωκεν
  choice: nabigo
  rationale: Ipinahahayag ang idyomatikong diwa na ang salita ng Diyos ay hindi nawalan ng bisa o hindi natupad; ang ganap na aspekto ay mauunawaan sa konteksto bilang kalagayang bunga ng naganap.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ang salita ng Diyos
  rationale: Pormal ngunit natural na salin na hindi agad nililimitahan ang λόγος sa 'pangako,' bagaman may pangakong konteksto ito.
- source_word: οὐ γὰρ πάντες
  choice: Sapagkat hindi lahat
  rationale: Malinaw na pinananatili ang paliwanag na ugnayan ng γάρ sa naunang pahayag.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: ang nagmula kay Israel
  rationale: Ipinapakita ng 'nagmula kay' ang pinagmulan o angkan na tinutukoy ng ἐξ, habang nananatiling maikli at natural.
- source_word: οὗτοι Ἰσραήλ
  choice: ay Israel
  rationale: Pinananatili ang matindi at sadyang maikling pagtutumbas ni Pablo, nang hindi ipinapasok sa mismong talata ang isang tiyak na interpretasyong teolohikal.
theological_decisions:
- issue: Kahulugan ng ikalawang pagbanggit sa “Israel”
  choice: Iniwan sa pangunahing teksto ang payak na “ay Israel,” na nagpapakitang mas makitid ang ikalawang gamit kaysa sa unang pangkat na nagmula kay Israel.
  alternative: Tahasang isalin bilang “tunay na Israel,” “hinirang sa Israel,” o “bayang espirituwal ng Diyos.”
  rationale: Ipinakikita ng konteksto na hindi sapat ang pisikal na angkan upang saklawin ang ikalawang gamit ng “Israel,” ngunit hindi tiyakang pinangalanan ng pangungusap ang buong saklaw nito. Kaya pinananatili ang teolohikal na tensiyon at inilalagay ang paglilinaw sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “hindi ibig sabihin nito na” bilang natural na panimulang pagtanggi, at pinanatili ang parehong pangalang “Israel” upang manatili ang retorikal at teolohikal na puwersa ng orihinal.
