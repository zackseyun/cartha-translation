base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: tl
  text: 'Sapagkat sinasabi ng Kasulatan sa Faraon, “Ibinangon kita[a] para sa mismong layuning ito: upang maipamalas ko sa pamamagitan mo ang aking kapangyarihan, at upang maipahayag ang aking pangalan[b] sa buong daigdig.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinanatili kitang buhay” o “pinanatili kitang nakatayo”; malawak ang diwa ng pandiwa sa konteksto ng sipi mula sa Exodo.
    reason: lexical_alternative
  - marker: b
    text: Ang “pangalan” ng Diyos ay tumutukoy sa nahayag niyang pagkakakilanlan at kabantugan, hindi lamang sa isang katawagang binibigkas.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Pinananatili ang tiyak na isahan at ang pagsasatao ni Pablo sa nakasulat na Kasulatan bilang nagsasalita.
- source_word: λέγει ... τῷ Φαραώ
  choice: sinasabi ... sa Faraon
  rationale: Pinananatili ang pangkasalukuyang anyo ng pandiwa bilang pangkasulatang kasalukuyan at natural itong pakinggan sa Filipino.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag na kaugnayan ng talata sa naunang pangangatwiran.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: para sa mismong layuning ito
  rationale: Ipinahahayag ang mariing layunin ng parirala sa natural at malinaw na Filipino.
- source_word: ἐξήγειρά σε
  choice: Ibinangon kita
  rationale: Pinananatili ang malawak na kahulugan ng pagbangon o paglalagay kay Faraon sa gayong kalagayan nang hindi nililimitahan ito sa paglikha, muling pagkabuhay, o pagpapanatiling buhay lamang.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: upang maipamalas ko sa iyo ang aking kapangyarihan
  rationale: Ang “maipamalas” ay naghahatid ng hayag na pagpapakita; pinananatili ng “sa iyo” ang di-tiyak na puwersa ng ἐν σοὶ sa halip na tahasang gawing “sa pamamagitan mo” o “laban sa iyo.”
- source_word: καὶ ὅπως διαγγελῇ
  choice: at upang maipahayag
  rationale: Ang anyong balintiyak at ang diwa ng malawakang paghahayag ay malinaw na naihahatid.
- source_word: τὸ ὄνομά μου
  choice: ang aking pangalan
  rationale: Pinananatili ang literal at teolohikal na mayamang pananalita tungkol sa nahayag na pagkakakilanlan at kabantugan ng Diyos.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: sa buong daigdig
  rationale: Naghahatid ng pandaigdigang saklaw at mas natural sa modernong Filipino kaysa sa literal na “sa buong lupa.”
theological_decisions:
- issue: Kahulugan ng ἐξήγειρά σε kaugnay ni Faraon at ng kapangyarihan ng Diyos
  choice: Ibinangon kita
  alternative: Pinanatili kitang buhay; itinalaga kitang tumayo; inilagay kita sa kalagayang ito
  rationale: Sinasaklaw ng salin ang paglalagay o pagpapanatili ng Diyos kay Faraon para sa layuning ito, ngunit hindi nito nilulutas nang lampas sa teksto ang tensiyon sa pagitan ng kapangyarihan ng Diyos at pananagutan ng tao.
- issue: Diwa ng ἐν σοὶ
  choice: sa iyo
  alternative: sa pamamagitan mo; laban sa iyo; sa nangyari sa iyo
  rationale: Ang mas malawak na “sa iyo” ay umiiwas sa pagpili ng isang interpretasyong mekanismo na hindi tahasang nililinaw ng Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon,” “Kasulatan,” at “daigdig” bilang mga karaniwang anyong madaling maunawaan, habang pinananatili ang pagsasatao sa Kasulatan at ang teolohikal na tensiyon ng teksto.
