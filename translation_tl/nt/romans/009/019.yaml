id: ROM.9.19
reference: Romans 9:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: tl
  text: Kaya sasabihin mo sa akin, “Kung gayon, bakit pa siya naninisi? Sapagkat sino ang nakatutol sa kanyang layunin[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kalooban.” Ang salitang Griyego na βούλημα ay maaaring mangahulugang kalooban, intensiyon, o layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: sasabihin mo
  rationale: Pinananatili ang anyong hinaharap na ginagamit bilang retorikal na pagpapakilala sa inaasahang pagtutol ng kausap.
- source_word: μοι
  choice: sa akin
  rationale: Tuwirang ipinapahayag ang di-tuwirang layon ng pandiwa.
- source_word: οὖν … οὖν
  choice: Kaya … Kung gayon
  rationale: Kapuwa isinalin ang dalawang inferensiyal na pang-ugnay upang mapanatili ang pag-usad at diin ng argumento nang hindi nagiging paulit-ulit sa Filipino.
- source_word: Τί οὖν ἔτι
  choice: Kung gayon, bakit pa
  rationale: Sa kontekstong ito, ang τί ay idiomatikong nagtatanong ng dahilan, kaya ‘bakit’; ang ἔτι ay ipinahahayag ng ‘pa.’
- source_word: μέμφεται
  choice: naninisi
  rationale: Natural na kasalukuyang pandiwang Filipino para sa paghahanap ng pagkakamali o pagbibintang ng sala; hindi dinaragdagan ng tahasang layon na wala sa Griyego.
- source_word: τῷ βουλήματι αὐτοῦ
  choice: sa kanyang layunin
  rationale: Ipinapahayag ang pinagpasiyahang intensiyon o layon nang hindi agad ipinapasok ang mas sistematikong teolohikal na pakahulugan ng ‘kalooban.’
- source_word: τίς ἀνθέστηκεν
  choice: sino ang nakatutol
  rationale: Ang ‘nakatutol’ ay natural na retorikal na paglalarawan ng matagumpay na pagtindig laban sa isang layunin at angkop sa patuloy na kabuluhan ng Griyegong perfect.
theological_decisions:
- issue: Ang kahulugan ng βούλημα sa konteksto ng kapangyarihan ng Diyos at pananagutan ng tao
  choice: kanyang layunin
  alternative: kanyang kalooban
  rationale: Ang ‘layunin’ ay nagpapahiwatig ng sinadyang hangarin ngunit hindi nilulutas ang tensiyon ng talata sa pamamagitan ng isang katawagang maaaring may nakapirming doktrinal na gamit. Inilalagay sa talababa ang tunay na alternatibong ‘kalooban.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Kaya … Kung gayon’ upang maipakita ang dalawang οὖν nang natural, at pinanatili ang anyong tuwirang pagtutol sa argumento.
