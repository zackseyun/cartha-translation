  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: tl
  text: 'Gaya ng nasusulat: “Tingnan ninyo, naglalagay ako sa Zion ng isang batong katitisuran at isang malaking batong sanhi ng pagkahulog;[a] ngunit ang sumasampalataya sa kanya[b] ay hindi mapapahiya.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pinagsama rito ni Pablo ang Isaias 8:14 at Isaias 28:16.
    reason: cross_reference
  - marker: b
    text: 'Maaari ring isalin na “sa bato” o “rito,” na tumutukoy sa bato; sa konteksto, inilalapat ni Pablo ang larawan sa Mesiyas. Literal sa Griyego: “sa ibabaw niya/nito.”'
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin na “hindi mabibigo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Gaya ng nasusulat
  rationale: Likas at kinikilalang pormula sa modernong Tagalog para sa pagpapakilala ng sipi mula sa Kasulatan.
- source_word: Ἰδοὺ
  choice: Tingnan ninyo
  rationale: Pinananatili ang pantawag-pansing puwersa ng salitang Griyego nang hindi gumagamit ng makalumang pananalita.
- source_word: τίθημι
  choice: naglalagay ako
  rationale: Pinananatili ang aspektong pangkasalukuyan at ang larawan ng paglalagay ng bato.
- source_word: ἐν Σιὼν
  choice: sa Zion
  rationale: Ang “sa” ang natural na panandang panlunan sa Tagalog at hindi labis na nililinaw kung nasa loob o ibabaw ng Zion.
- source_word: λίθον προσκόμματος
  choice: isang batong katitisuran
  rationale: Maikli, natural, at pinananatili ang metapora ng batong nagiging sanhi ng pagkatisod.
- source_word: πέτραν σκανδάλου
  choice: isang malaking batong sanhi ng pagkahulog
  rationale: Ipinakikita ang kaibhan ng πέτρα sa λίθος at inilalahad ang σκανδάλου bilang sanhi ng pagbagsak, habang iniiwasang paliitin ito sa damdaming pagkasakit lamang.
- source_word: ὁ πιστεύων
  choice: ang sumasampalataya
  rationale: Natural na substantibong parirala sa Tagalog na nagpapanatili sa pangkalahatan at pang-isahang diwa.
- source_word: ἐπ’ αὐτῷ
  choice: sa kanya
  rationale: Karaniwang gamit sa Tagalog kasama ng “sumasampalataya” at binibigyang-daan ang personal na referent sa konteksto ni Pablo.
- source_word: οὐ καταισχυνθήσεται
  choice: ay hindi mapapahiya
  rationale: Pinananatili ang hinaharap na diwa, ang balintiyak na kahulugan, at ang dimensiyong dangal-kahihiyan.
theological_decisions:
- issue: Ang tinutukoy ng αὐτῷ sa pinagsamang sipi mula sa Isaias
  choice: “sa kanya,” na personal ang pagtukoy
  alternative: “dito” o “rito,” na tumutukoy sa bato bilang larawan
  rationale: Bagaman bato ang pinakamalapit na larawang tinutukoy, panlalaki ang panghalip sa Griyego at inilalapat ni Pablo ang larawan sa Mesiyas sa konteksto. Nananatili sa talababa ang tunay na posibilidad ng di-personal na salin.
- issue: Saklaw ng σκανδάλου
  choice: “sanhi ng pagkahulog”
  alternative: “sanhi ng pagkatisod” o “nakasasakit ng damdamin”
  rationale: Ang konteksto ay larawan ng pisikal na pagkatisod at pagbagsak na may teolohikal na bisa; hindi ito dapat paliitin sa modernong kahulugan ng pagiging nakasasakit lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Zion” bilang nakaugaliang transliterasyon ng pangalang pantangi. Iniwasan ang makalumang “Narito” bilang salin ng Ἰδοὺ at ang salitang “katitisuran” ay pinanatili dahil malinaw at pamilyar sa biblikal na rehistro.
