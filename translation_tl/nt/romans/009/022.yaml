id: ROM.9.22
reference: Romans 9:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: tl
  text: Ngunit paano kung ang Diyos[a], sa pagnanais niyang ipakita ang kanyang poot at ipakilala ang kanyang kapangyarihan[b], ay buong tiyagang pinagtiisan ang mga sisidlan ng poot na inihanda para sa pagkapuksa[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ngunit kung.” Nagsisimula rito sa Griyego ang isang retorikal na kondisyong nagpapatuloy sa susunod na talata.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kalakasan.” Sa literal, tumutukoy ang parirala sa kung ano ang makapangyarihan o posible para sa kanya; dito, ang diwa ay kapangyarihan ng Diyos.
    reason: lexical_alternative
  - marker: c
    text: Hindi sinasabi ng balintiyak na “inihanda para sa pagkapuksa” kung sino ang naghanda sa mga sisidlan. Iba-iba ang pagkaunawa kung ipinahihiwatig dito ang pagkilos ng Diyos, ang pagpapatigas ng tao sa sarili, o ang kalagayan lamang ng pagiging handa para sa paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ngunit paano kung
  rationale: Ipinananatili nito ang retorikal na kondisyon at ang di-pa-tapos na pangungusap na nagpapatuloy sa susunod na talata.
- source_word: θέλων
  choice: sa pagnanais niyang
  rationale: Likas sa modernong Tagalog at pinananatili ang layunin o hangaring kaugnay ng pangunahing pandiwa nang hindi pinipiling tiyak kung ito ay sanhi o pagsalungat.
- source_word: ἐνδείξασθαι τὴν ὀργήν
  choice: ipakita ang kanyang poot
  rationale: Malinaw na ipinapahayag ang sinasadyang paghahayag ng banal na poot; ang “poot” ay angkop sa hudisyal na diwa ng konteksto.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: ipakilala ang kanyang kapangyarihan
  rationale: Natural na katumbas ng pagpapabatid o paghahayag ng kapangyarihan ng Diyos sa kontekstong ito.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: buong tiyagang pinagtiisan
  rationale: Ipinahahayag sa natural at tuwirang Tagalog ang matagal at malaking pagtitiis sa mga tinutukoy na sisidlan.
- source_word: σκεύη ὀργῆς
  choice: mga sisidlan ng poot
  rationale: Pinananatili ang talinghaga ng magpapalayok at mga sisidlan mula sa kalapit na konteksto, pati ang siksik at hindi lubos na nilinaw na ugnayan ng genitive.
- source_word: κατηρτισμένα
  choice: inihanda
  rationale: Ipinananatili ang balintiyak na anyo at ang kalagayan ng pagiging handa nang hindi tinutukoy kung sino ang naghanda.
- source_word: εἰς ἀπώλειαν
  choice: para sa pagkapuksa
  rationale: Tuwirang ipinahahayag ang hantungan o kahihinatnan nang hindi gumagamit ng makaluma o labis na denominasyonal na termino.
theological_decisions:
- issue: Kung sino ang gumawa ng paghahandang ipinahihiwatig ng κατηρτισμένα
  choice: Balintiyak na “inihanda,” na walang tinukoy na gumawa
  alternative: “inihanda ng Diyos,” “naging karapat-dapat sa pagkapuksa,” o “inihanda ang kanilang sarili”
  rationale: Hindi pinangalanan ng Griyego ang gumagawa. Ang hindi pagtukoy rito ay nagpapanatili sa tunay na teolohikal na tensiyon sa halip na lutasin ito sa salin.
- issue: Ang puwersa ng di-pa-tapos na kondisyong nagsisimula sa εἰ
  choice: “Ngunit paano kung” at pagpapatuloy ng pangungusap sa susunod na talata
  alternative: “Ngunit kung,” o pagsasalin bilang isang ganap at tuwirang pahayag sa talatang ito
  rationale: Ang estrukturang Griyego ay isang retorikal na kondisyong nagpapatuloy sa talata 23. Hindi ito dapat gawing mas tahasang pahayag kaysa sa orihinal.
- issue: Ugnayan ng θέλων sa pangunahing pandiwa
  choice: “sa pagnanais niyang,” nang hindi ginagawang tahasang sanhi o pagsalungat
  alternative: “dahil nais niyang” o “bagaman nais niyang”
  rationale: Maaaring unawain sa higit sa isang paraan ang pang-abay na puwersa ng participle. Iniiwasan ng salin ang tahasang pagpili sa sanhi o concessive na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang talinghagang “mga sisidlan,” ang retorikal na kondisyong nagpapatuloy sa susunod na talata, at ang di-tiyak na gumawa sa balintiyak na participle. Ginamit ang kuwit sa hulihan upang ipakitang hindi pa tapos ang pangungusap.
