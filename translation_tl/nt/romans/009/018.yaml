  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: tl
  text: Kaya nga[a], kinahahabagan niya ang sinumang nais niyang kahabagan, at pinatitigas[b] niya ang sinumang nais niyang patigasin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Samakatuwid.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pinatitigas” ay maaari ring ipahayag na “ginagawang matigas ang kalooban” o “ginagawang mapagmatigas.” Aktibo ang pandiwa sa Griyego at hindi lamang nangangahulugang pinahihintulutan niyang tumigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kaya nga
  rationale: Likas sa makabagong Tagalog ang pariralang ito at malinaw na naghahayag ng kongklusyon mula sa naunang pangangatwiran ni Pablo.
- source_word: ὃν θέλει
  choice: ang sinumang nais niyang kahabagan
  rationale: Ipinahihiwatig sa Griyego ang pandiwang kaugnay ng nais; ang pag-uulit nito sa Tagalog ay ginagawang buo at natural ang pangungusap habang pinananatili ang tuwirang pagpapasiya ng paksa.
- source_word: ἐλεεῖ
  choice: kinahahabagan niya
  rationale: Tumpak at likas itong katumbas ng aktibong pagkakaloob ng awa o habag.
- source_word: ὃν δὲ θέλει
  choice: at ... ang sinumang nais niyang patigasin
  rationale: Pinananatili ng “at” ang magkatimbang na ayos ng dalawang sugnay, habang malinaw na lumilitaw ang kanilang pagkakasalungat sa mga pandiwang “kinahahabagan” at “pinatitigas.”
- source_word: σκληρύνει
  choice: pinatitigas
  rationale: Pinananatili nito ang aktibong anyo ng Griyego at ang alusyon sa pagpapatigas kay Faraon, nang hindi ito pinahihina bilang pagpapahintulot lamang.
theological_decisions:
- issue: Pagpapasiya ng Diyos sa θέλει
  choice: Panatilihin ang tuwirang pahayag na kinahahabagan o pinatitigas niya ang sinumang nais niya.
  alternative: Ipaliwanag ito bilang paunang kaalaman lamang o bilang tugon lamang sa pasiya ng tao.
  rationale: Tuwirang ipinahahayag ng Griyego ang kalooban ng Diyos sa dalawang sugnay; hindi dapat lutasin ng salin ang tensiyon tungkol sa pagpapasiya ng Diyos at pananagutan ng tao.
- issue: Aktibong pagkilos sa σκληρύνει
  choice: “pinatitigas niya”
  alternative: “hinahayaan niyang tumigas”
  rationale: Aktibo ang pandiwa sa Griyego at tuwirang iniuugnay ang kilos sa paksa. Ang pagsasaling pahintulot lamang ay lalampas sa sinasabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang magkatimbang na kayarian ng dalawang sugnay at ang matinding teolohikal na tensiyon ng aktibong pagkahabag at pagpapatigas.
