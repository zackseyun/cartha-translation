  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: tl
  text: Sapagkat isasakatuparan ng Panginoon ang kanyang salita[a] sa daigdig[c], anupat tatapusin niya ito at paiikliin niya ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang bagay/pasya” o “ang hatol.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “paiikliin” ay maaari ring unawaing “puputulin” o, ayon sa ipinahihiwatig sa konteksto, “mabilis na isasagawa.”
    reason: lexical_alternative
  - marker: c
    text: Isinasalin ng ilan ang ἐπὶ τῆς γῆς bilang “sa lupain,” ayon sa konteksto ng Isaias; sa Griyegong teksto ng Roma 9:28, maaari itong basahing mas malawak bilang “sa daigdig.”
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: ang kanyang salita
  rationale: 'Pinananatili ng “salita” ang diwang pasalita o ipinahayag ng λόγος: isasagawa ng Panginoon ang kanyang sinabi. Likas na idinagdag ang “kanyang” ayon sa paksa ng pangungusap, nang hindi ginagawang mas tiyak na “hatol” o “pasya” ang maaaring malawak na kahulugan.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng paliwanag o batayan sa naunang pahayag ni Pablo.
- source_word: συντελῶν
  choice: tatapusin niya ito
  rationale: Ipinahahayag nito ang pagdadala sa salita hanggang sa ganap na katuparan. Ang anyong “anupat” ay natural na nag-uugnay sa mga pandiwaring Griyego sa pangunahing pandiwa.
- source_word: καὶ συντέμνων
  choice: at paiikliin
  rationale: Pinananatili ang kapansin-pansing larawan ng pagpapaikli nang hindi agad ipinapakahulugang “mabilis na isasagawa,” na isa lamang posibleng implikasyon.
- source_word: ποιήσει
  choice: isasakatuparan
  rationale: Sa pagsama sa λόγον, malinaw nitong ipinahahayag na gagawin ng Panginoon ang kanyang sinabi; mas natural ito kaysa sa literal na “gagawin ang salita.”
- source_word: κύριος
  choice: ang Panginoon
  rationale: Karaniwang marangal na salin para sa κύριος sa siping tumutukoy sa Diyos.
- source_word: ἐπὶ τῆς γῆς
  choice: sa daigdig
  rationale: Ipinahahayag ang mas malawak na karaniwang kahulugan ng γῆ sa tekstong Griyego ng Roma at iniiwasang paliitin ito nang walang katiyakan sa “lupain.”
theological_decisions:
- issue: Kalikasan ng pagkilos ng Diyos sa sipi mula kay Isaias
  choice: Inilalarawan ang Panginoon na tiyak na nagsasakatuparan ng kanyang ipinahayag, na dinadala iyon sa wakas at pinaiikli.
  alternative: Mabilis at ganap na ipatutupad ng Panginoon ang isang hatol o pasya sa lupa.
  rationale: Maaaring may himig ng paghatol ang konteksto, ngunit hindi tahasang nililimitahan ng λόγον ang tinutukoy sa isang “hatol.” Pinananatili ng salin ang lakas at tensiyon ng mga pandiwa nang hindi nagdaragdag ng isang tiyak na sistemang teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “anupat” upang maging malinaw at natural ang kaugnayan ng mga pandiwaring Griyego sa pangunahing pahayag. Sadyang pinanatili ang bahagyang di-pangkaraniwang larawan ng pagpapaikli sa salita upang huwag burahin ang tunay na kalabuan ng teksto.
