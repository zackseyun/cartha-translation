  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: tl
  text: tayo[a], na tinawag din niya, hindi lamang mula sa mga Judio kundi mula rin sa mga Hentil—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “yaong mga tinawag din niya—tayo.” Tinutukoy ni Pablo ang “tayo” bilang mga sisidlan ng awa na binanggit sa naunang talata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: tayo rin
  rationale: Ang οὓς ay tumutukoy pabalik sa mga sisidlan ng awa sa naunang talata, at nililinaw ng ἡμᾶς na ang tinutukoy ay “tayo.” Inilagay sa unahan ang “tayo rin” upang maging natural sa Tagalog at mapanatili ang diin, habang ipinaliliwanag sa talababa ang mas literal na ayos.
- source_word: καὶ ἐκάλεσεν
  choice: na tinawag niya
  rationale: Ang καλέω sa kontekstong Paulino ay angkop na isaling “tinawag,” na nagpapanatili sa mahalagang katawagang teolohikal. Ang additive na καί ay naipahihiwatig ng “rin” sa “tayo rin” at ng kaugnayan sa naunang talata.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: hindi lamang ... kundi ... rin
  rationale: Ito ang natural at balanseng katumbas sa modernong Tagalog ng correlative construction ng Griyego.
- source_word: ἐξ Ἰουδαίων
  choice: mula sa mga Judio
  rationale: Ang ἐξ ay nagpapahayag ng pinagmulan o pagkabilang sa isang pangkat. Malinaw at karaniwan sa Tagalog ang “mula sa mga Judio.”
- source_word: ἐξ ἐθνῶν
  choice: mula sa mga Hentil
  rationale: Sa tuwirang paghahambing sa mga Judio, ang ἐθνῶν ay tumutukoy sa mga taong hindi Judio; malinaw itong naipahahayag ng “mga Hentil.”
theological_decisions:
- issue: Pagpapanatili ng ugnayan sa “mga sisidlan ng awa” sa naunang talata
  choice: tayo rin na tinawag niya
  alternative: yaong mga tinawag niya, samakatuwid ay tayo
  rationale: Pinananatili ng salin ang pagkakaugnay sa naunang pangungusap at ang pagkilala ni Pablo sa “atin” bilang mga tinawag, nang hindi nagdaragdag ng paliwanag tungkol sa saklaw o kaayusan ng pagtawag.
- issue: Kahulugan ng ἐθνῶν sa paghahambing ng Judio at hindi Judio
  choice: mga Hentil
  alternative: mga bansa
  rationale: Dahil tuwirang inihahambing ang ἐθνῶν sa Ἰουδαίων, ang tinutukoy ay mga hindi Judio, hindi lamang mga bansang pampolitika. Pinananatili nito ang historikal at teolohikal na kaibahan nang hindi nag-aangkat ng partikular na sistemang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “Judio” at “Hentil” bilang malinaw at karaniwang katawagan sa konteksto ng Bagong Tipan. Pinanatili ang em dash dahil nagpapatuloy ang pangungusap sa susunod na talata.
