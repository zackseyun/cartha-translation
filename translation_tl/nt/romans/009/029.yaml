  to: 'At gaya ng sinabi na noon ni Isaias: “Kung hindi nag-iwan ang Panginoon ng mga Hukbo[a] para sa atin ng mga supling[b], naging tulad sana tayo ng Sodoma at itinulad sana tayo sa Gomorra.”'
