id: ROM.9.29
reference: Romans 9:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: tl
  text: 'At gaya ng sinabi na noon ni Isaias: “Kung hindi nag-iwan ang Panginoon ng mga Hukbo[a] para sa atin ng mga supling[b], naging tulad sana tayo ng Sodoma at itinulad sana tayo sa Gomorra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “Panginoong Sabaot.” Ang Griyegong Σαβαώθ ay transliterasyon ng isang titulong Hebreo na karaniwang isinasaling “ng mga Hukbo” o “ng mga Hukbo ng Langit.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “binhi.” Dito, tumutukoy ito sa mga supling o inapong natirang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: gaya ng
  rationale: Likas na naghahayag ng pagtutugma sa naunang pahayag habang pinananatili ang pahambing na diwa.
- source_word: προείρηκεν
  choice: naunang sinabi
  rationale: Ipinahahayag ang naunang pagsasalita ni Isaias na nananatiling mahalaga, nang hindi ito labis na binibigyang-kahulugang prediksiyon.
- source_word: κύριος Σαβαὼθ
  choice: Panginoon ng mga Hukbo
  rationale: Isinasalin ang kahulugan ng banal na titulong Hebreo na tinumbasan ng transliterasyong Griyego, sa pamilyar at marangal na anyong Tagalog.
- source_word: ἐγκατέλιπεν
  choice: iniwanan
  rationale: Pinananatili ang payak na diwa ng pag-iiwan o pagpapanatiling may natira, habang natural sa pariralang Tagalog na 'iniwanan tayo ng.'
- source_word: σπέρμα
  choice: mga supling
  rationale: Ang literal na 'binhi' ay tumutukoy rito sa mga nabubuhay na inapo; malinaw ang 'mga supling' nang hindi ipinapalit ang mas interpretatibong 'nalabi.'
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: naging tulad sana tayo ng Sodoma
  rationale: Ang 'sana' ay likas na naghahayag ng salungat-sa-katotohanang bunga, at pinananatili ng 'naging' ang diwa ng γίνομαι.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: itinulad sa Gomorra
  rationale: Pinananatili ang pasibong diwa ng ὁμοιόω at ang pagkakaiba nito sa naunang pandiwang 'naging.'
theological_decisions:
- issue: Pagsasalin sa banal na titulong κύριος Σαβαώθ
  choice: Panginoon ng mga Hukbo
  alternative: Panginoong Sabaot; PANGINOON ng mga Hukbo
  rationale: Isinasalin nito ang kahulugan ng titulo ngunit sumusunod sa Griyegong κύριος sa halip na tahasang ibalik sa teksto ang tipograpikong representasyon ng Tetragrammaton.
- issue: Kung isasalin ang σπέρμα bilang teolohikal na 'nalabi'
  choice: mga supling
  alternative: binhi; mga inapo; nalabi
  rationale: Ang konteksto ay tungkol sa isang nalabi, ngunit ang salitang ginamit ay 'binhi/supling.' Iniiwasan ng saling ito ang tahimik na paglutas sa leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tradisyonal at nakikilalang mga pangalang Isaias, Sodoma, at Gomorra. Inilagay ang parehong talababa kaagad pagkatapos ng 'mga supling' upang malinaw na makita sa pangunahing teksto ang lahat ng marker.
