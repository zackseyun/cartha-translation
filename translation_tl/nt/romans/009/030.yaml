base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: tl
  text: Ano ngayon ang sasabihin natin? Na ang mga Hentil[b], na hindi nagsisikap makamit ang katuwiran[a], ay nagtamo ng katuwiran—ang katuwirang mula sa pananampalataya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan” para sa “katuwiran” (δικαιοσύνη) rito at sa mga pag-uulit ng salita. Maaaring saklawin ng gamit ni Pablo kapuwa ang moral o legal na pagkamatuwid at ang katarungang kaugnay ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bansa” para sa “mga Hentil.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang katuwirang dumarating sa pamamagitan ng pananampalataya”; o, bagaman hindi gaanong malamang dito, “ang katuwirang mula sa katapatan.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ano ngayon ang sasabihin natin?
  rationale: Pinananatili nito ang karaniwang pormulang panlipat ni Pablo at ang deliberatibong diwa ng panghinaharap, sa natural na modernong Tagalog.
- source_word: ἔθνη
  choice: mga Hentil
  rationale: Sa konteksto ng paghahambing sa Israel, malinaw na tumutukoy ito sa mga taong hindi Judio; inilalagay sa talababa ang mas literal na “mga bansa.”
- source_word: τὰ μὴ διώκοντα
  choice: na hindi nagsisikap makamit
  rationale: Ipinahahayag ng pariralang ito ang patuloy o kinagawiang paghahangad sa isang layunin. Mas natural sa Tagalog ang “nagsisikap makamit” kaysa sa literal na larawang “humahabol.”
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Ang “katuwiran” ay malawak at nakaugaliang salin sa gamit ni Pablo, nang hindi ito nililimitahan sa iisang paliwanag na teolohikal. Binabanggit sa talababa ang “katarungan” bilang posibleng leksikal na alternatibo.
- source_word: κατέλαβεν
  choice: nagtamo
  rationale: Sa konteksto, nangangahulugan itong nakamit o napasakamay ang hindi dating pinagsisikapang abutin. Ang “nagtamo” ay maikli, natural, at hindi labis na pisikal.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: ang katuwirang mula sa pananampalataya
  rationale: Ang inuulit na “katuwiran” ay tumutukoy at naglilinaw kung anong uri ng katuwiran ang natamo. Ang gitling ay nagpapanatili sa paglilinaw nang hindi ginagawang tahasang pagsalungat ang δέ.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang malinaw at nakaugaliang salin ng πίστις dito. Ang “mula sa” ay malapit sa ἐκ at umiiwas sa pagdaragdag ng doktrinal na pormulang wala sa teksto.
theological_decisions:
- issue: Saklaw ng δικαιοσύνη sa pangangatwiran ni Pablo
  choice: katuwiran
  alternative: katarungan; pagiging matuwid sa harap ng Diyos; katayuan sa loob ng tipan
  rationale: Hindi ipinaliliwanag ng talata ang lahat ng mekanismo o saklaw ng konsepto. Pinananatili ng “katuwiran” ang lawak at tensiyong teolohikal ng salita sa halip na ikulong ito sa isang partikular na doktrina.
- issue: Kaugnayan ng ikalawang δικαιοσύνην sa una at gamit ng δέ
  choice: 'Gamitin ang gitling at apposisyon: “—ang katuwirang mula sa pananampalataya”'
  alternative: “ngunit ang katuwirang mula sa pananampalataya”; “samakatuwid nga, ang katuwirang mula sa pananampalataya”
  rationale: Sa balangkas ng Griyego, ang ikalawang parirala ay pangunahing tumutukoy o naglilinaw sa uri ng katuwirang natamo. Ang apposisyon ay nagpapanatili sa puwersang iyon nang hindi labis na pinatitingkad ang pagsalungat.
- issue: Kahulugan ng ἐκ πίστεως
  choice: mula sa pananampalataya
  alternative: sa pamamagitan ng pananampalataya; mula sa katapatan
  rationale: Pinananatili ng “mula sa” ang ἐκ nang may kaunting interpretibong pagpapalawak. Hindi idinaragdag ang “lamang” o ibang pormulang wala sa Griyego, at kinikilala sa talababa ang mas di-malamang na pagbasa na “katapatan.”
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga Hentil” dahil mas malinaw ito sa kontekstong Pauline kaysa “mga bansa.” Iniwasan ang masyadong literal na “humahabol sa katuwiran” at piniling “nagsisikap makamit” upang natural na maipahayag ang μεταφορικό na diwa ng διώκω.
