  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: tl
  text: 'Gaya rin ng sinasabi niya sa aklat ni Oseas: “Tatawagin kong ‘bayan ko’ ang hindi ko bayan, at ‘minamahal’ ang hindi minahal.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Oseas 2:23; maaaring magkaiba ang pagbilang sa LXX at sa tekstong Hebreo o sa ilang tradisyon. Sa Griyego, ang “hindi ko bayan” ay isahang anyo ngunit kolektibo ang diwa, at ang “hindi minahal” ay pambabaeng isahan, alinsunod sa pinagmulan ng pahayag sa Oseas. Maaari ring isalin ang huling katawagan na “iniibig.”
    reason: Nililinaw ang pagkakaiba ng pagbilang ng sanggunian at tumpak na itinatakda na ang isahan at pambabaeng anyo ay mga katangian ng Griyego, hindi ng Tagalog.
lexical_decisions:
- source_word: ὡς καὶ
  choice: Gaya rin ng
  rationale: Ipinapakita nito na ang sipi ay karagdagang patunay na kaayon ng naunang sinabi, habang natural ang daloy sa modernong Tagalog.
- source_word: ἐν τῷ Ὡσηὲ
  choice: sa aklat ni Oseas
  rationale: Ang parirala ay pormula ng pagsipi na tumutukoy sa aklat ni Oseas; ang pagdaragdag ng “aklat” ay nililinaw ang sanggunian sa natural na Tagalog.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang personal na isahang paksa ng Griyego, na malamang ay ang Diyos na nagsasalita sa Kasulatan, sa halip na gawing impersonal na “sinasabi rito.”
- source_word: Καλέσω
  choice: Tatawagin kong
  rationale: Tuwirang ipinapahayag ang hinaharap na pagtatalaga o pagkilala, at pinananatili ang mahalagang pandiwang “tawagin.”
- source_word: τὸν οὐ λαόν μου
  choice: ang hindi ko bayan
  rationale: Pinananatili ang isahang kolektibong anyo at ang tipanang idyomang “bayan ko” nang hindi ipinapasok ang pangnagdaang “dating,” na hindi tahasang nasa Griyego.
- source_word: λαόν μου
  choice: bayan ko
  rationale: Ang “bayan” ay natural na kolektibong katawagan para sa λαός at malinaw na nagpapahayag ng ugnayang tipan.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: ang hindi minahal
  rationale: Pinananatili ang pasibong diwa ng perpektong participle. Hindi tahasang minarkahan ang kasariang pambabae dahil hindi ito likas na naipapakita ng panghalip o participle sa Tagalog; ipinaliliwanag ito sa talababa.
- source_word: ἠγαπημένην
  choice: minamahal
  rationale: Natural itong katawagan sa Tagalog para sa isang iniibig at pinananatili ang ugnayang leksikal sa pandiwang “mahal,” bagaman nag-iiba ang aspektong Filipino upang maging maayos bilang ipinagkaloob na katawagan.
theological_decisions:
- issue: Kolektibo o indibidwal na bisa ng sipi mula kay Oseas
  choice: Gamitin ang kolektibong “bayan” sa unang sugnay at ang neutral sa kasariang “ang hindi minahal” sa ikalawa.
  alternative: Mahigpit na ilantad ang isahang pambabae bilang “ang babaeng hindi minahal,” o gawing maramihan ang unang sugnay bilang “ang mga hindi ko bayan.”
  rationale: Ang λαός ay likas na kolektibo, samantalang ang ikalawang parirala ay pambabaeng isahan dahil sa konteksto ni Oseas. Ang “babaeng” ay magiging mas tahas kaysa sa mismong pangngalang di-binanggit sa Griyego, kaya pinananatili sa teksto ang likas na Tagalog at itinatala ang anyong Griyego sa talababa.
- issue: Pagkakakilanlan ng nagsasalita sa λέγει
  choice: Panatilihin ang “niya,” na nagpapahiwatig sa Diyos na nagsasalita sa Kasulatan nang hindi tahasang idinaragdag ang pangalang “Diyos.”
  alternative: Isalin bilang impersonal na “sinasabi sa aklat ni Oseas” o tahasang “sinasabi ng Diyos.”
  rationale: Isahan at personal ang pandiwa sa Griyego, ngunit hindi tahasang inuulit ang paksa sa talata; pinananatili ng “niya” ang ganitong katangian at ang teolohikal na pagtingin sa Diyos bilang nagsasalita sa sipi.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Ginamit ang “aklat ni Oseas” upang maging likas ang pormula ng pagsipi, at ang maiikling katawagang nasa panipi upang mapanatili ang retorikal na pagtutumbas ng dalawang sugnay.
