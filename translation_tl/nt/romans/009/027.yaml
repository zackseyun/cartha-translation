  naturalness: Natural ang “sumisigaw si Isaias” at “tungkol sa Israel.” Pinalitan ang “sindami” ng mas karaniwang modernong “kasindami,” at inayos ang pangwakas na sugnay upang maging malinaw at hindi labis ang pokus.
  terminology: Napanatili ang “mga anak ni Israel” bilang tradisyonal na katawagang pangtipan, “nalabi” para sa ὑπόλειμμα, at “maliligtas” para sa σωθήσεται. Ang talababa tungkol sa kaligtasan ay inayos upang magbigay ng tunay na semantikong alternatibo sa halip na halos kaparehong anyo lamang.
