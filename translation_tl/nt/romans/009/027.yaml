base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: tl
  text: 'Ngunit sumisigaw si Isaias tungkol sa Israel: “Kahit maging kasindami ng buhangin sa dagat ang bilang ng mga anak ni Israel[a][b], ang nalabi ay maliligtas.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Sa Griyego, “mga anak na lalaki ni Israel,” isang tradisyonal na katawagang pangtipan para sa bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Kung maging kasindami ng buhangin sa dagat ang bilang ng mga anak ni Israel.” Kondisyunal ang anyo ng Griyego, bagaman konsesibo ang bisa nito sa konteksto.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “maliligtas mula sa kapahamakan.” Umaalingawngaw rito ang propesiya ni Isaias tungkol sa nalabing maliligtas.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat at paglipat sa susunod na patunay sa pangangatwiran ni Pablo.
- source_word: κράζει
  choice: sumisigaw
  rationale: Pinananatili ang masigla at mariing diwa ng pandiwa at ang pangkasalukuyang anyo nito.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: tungkol sa Israel
  rationale: Sa konteksto ng pagsipi sa propeta, ang tinutukoy ay ang paksa ng pahayag, hindi ang pagkilos para sa kapakanan ng Israel.
- source_word: Ἐὰν ᾖ
  choice: Kahit maging
  rationale: Likas na ipinapahayag sa Filipino ang konsesibong bisa ng sugnay habang pinananatili sa talababa ang mas literal na kondisyunal na pagbasa.
- source_word: ὁ ἀριθμὸς
  choice: ang bilang
  rationale: Karaniwan at tuwirang katumbas sa modernong Filipino.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ng mga anak ni Israel
  rationale: Pinananatili ang tradisyonal at pangtipang katawagan nang hindi ito nililimitahan sa literal na mga anak na lalaki.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: sindami ng buhangin sa dagat
  rationale: Natural na Filipino para sa paghahambing ng dami at pinananatili ang pamilyar na larawang mula sa Kasulatan.
- source_word: τὸ ὑπόλειμμα
  choice: ang nalabi
  rationale: Tumpak at madaling maunawaang katawagan para sa bahaging natira; iniiwasan ang sobrang teknikal na ekspresyon.
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Pinananatili ang bigat ng salitang ginagamit ni Pablo, habang kinikilala sa talababa ang posibleng diwa ng pagliligtas mula sa kapahamakan sa pinagmulan nitong propesiya.
theological_decisions:
- issue: Diwa ng kondisyunal na Ἐὰν ᾖ sa sipi mula sa propeta
  choice: Konsesibong “Kahit maging”
  alternative: Mas literal na kondisyunal na “Kung maging”
  rationale: Binibigyang-linaw nito ang pagsalungat sa pagitan ng napakaraming Israelita at ng nalabing maliligtas, ngunit hindi itinatago ang tunay na anyong kondisyunal ng Griyego sapagkat inilalahad iyon sa talababa.
- issue: Kahulugan ng σωθήσεται
  choice: “maliligtas”
  alternative: “maililigtas” o “makaliligtas” sa diwa ng pagkakaligtas mula sa kapahamakan
  rationale: Ang “maliligtas” ay natural sa konteksto ng Roma at pinananatili ang teolohikal na bigat ng salita nang hindi nilulutas kung anong mga aspekto ng kaligtasan ang saklaw nito.
- issue: Pagpapahayag ng pagiging limitado sa nalabi
  choice: “ang nalabi ang maliligtas” nang walang idinagdag na “lamang”
  alternative: “ang nalabi lamang ang maliligtas”
  rationale: Ang hulma ng Filipino ay malinaw na nagtutuon sa nalabi, ngunit hindi nagdaragdag ng tahasang katumbas ng “lamang,” na wala sa tekstong Griyego.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nalabi” bilang malinaw na katawagang biblikal at iniwasan ang mas teknikal o lipas na pananalita. Pinanatili ang masiglang “sumisigaw” para sa retorikal na lakas ng Griyego.
