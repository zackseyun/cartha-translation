  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: tl
  text: Ano ngayon ang sasabihin natin? May kawalang-katarungan ba sa Diyos?[a] Hinding-hindi![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “May kalikuan ba sa Diyos?”
    reason: lexical_alternative
  - marker: b
    text: 'Sa Griyego: “Huwag nawang mangyari!” Isa itong napakadiing pagtanggi; maaari ring isalin na “Hindi kailanman!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Ano ngayon ang sasabihin natin?
  rationale: Likas na makabagong Tagalog para sa karaniwang pormulang transisyonal ni Pablo; pinananatili nito ang deliberatibong lakas ng panghinaharap na ἐροῦμεν.
- source_word: μὴ ἀδικία
  choice: May kawalang-katarungan ba
  rationale: Ginagawang malinaw na retorikal na tanong ang sugnay na inaasahang sagutin nang pasalungat. Ang “kawalang-katarungan” ay nagpapanatili sa moral at hudisyal na diwa ng ἀδικία.
- source_word: παρὰ τῷ θεῷ
  choice: sa Diyos
  rationale: Natural na Tagalog para sa ideyang “nasa Diyos” o “sa panig ng Diyos,” nang hindi ginagawang tahasang paratang na “Hindi ba makatarungan ang Diyos?”
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Malakas at likas na mariing pagtanggi sa makabagong Tagalog, na tumutugma sa idiomatikong puwersa ng Griyego.
theological_decisions:
- issue: Kung paano ilalahad ang pagtanggi ni Pablo nang hindi nagpapasok ng partikular na sistemang teolohikal sa Roma 9.
  choice: Pinanatili bilang retorikal na tanong tungkol sa kawalang-katarungan sa Diyos, kasunod ng mariing pagtanggi.
  alternative: Maaaring isalin nang mas interpretatibo bilang “Hindi ba makatarungan ang Diyos?” o mas pormal bilang “Huwag nawang mangyari!”
  rationale: Maikli at matindi ang pagtutol at pagtanggi sa Griyego. Hindi nagdaragdag ang salin ng paliwanag tungkol sa pagpili, pagtatakwil, o pagkamakatarungan ng Diyos na wala sa mismong talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Hinding-hindi!” upang maging natural at mariin, habang inilagay sa talababa ang mas pormal na anyo ng idyomang Griyego.
