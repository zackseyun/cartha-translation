  source_fidelity: 'Tumpak na naipapahayag ang lahat ng bahagi ng Griyego: ang transisyonal na tanong (Τί οὖν ἐροῦμεν), ang retorikal na tanong na umaasa ng negatibong sagot (μή), ang ἀδικία bilang “kawalang-katarungan,” ang παρὰ τῷ θεῷ sa natural na “sa Diyos,” at ang mariing pagtanggi na μὴ γένοιτο sa “Hinding-hindi!” Walang idinagdag na interpretasyong teolohikal.'
