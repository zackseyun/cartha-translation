  naturalness: Mas malinaw at likas sa modernong Filipino ang magkatambal na “bago pa sila isinilang at bago pa sila gumawa,” dahil malinaw nitong naipahahayag ang dalawang negated na pangyayaring nasa Griyego. Ang mga gitling ay angkop upang ipakitang nagpapatuloy ang pangungusap sa susunod na talata.
