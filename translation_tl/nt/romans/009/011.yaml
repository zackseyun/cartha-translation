  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: tl
  text: Sapagkat bago pa sila isinilang at bago pa sila gumawa ng anumang mabuti o masama[a]—upang manatili[b] ang layunin ng Diyos ayon sa pagpili[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang mabuti o masama sa moral.” Ang Griyegong φαῦλον ay maaaring tumukoy sa masama, hamak, o walang halaga; “masama” ang likas na katambal ng “mabuti” sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: O “manindigan” o “magpatuloy.”
    reason: lexical_alternative
  - marker: c
    text: O “ayon sa pagkakahirang”; maaari ring isalin na “ang layunin ng Diyos sa pagpili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: Sapagkat bago pa sila ipinanganak
  rationale: Ipinahahayag ng “Sapagkat” ang paliwanag na ugnayan ng γάρ sa naunang talata, at likas na isinasalin ng “bago pa” ang temporal na μήπω kasama ng participle.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: o nakagawa ng anumang mabuti o masama
  rationale: Pinananatili ang magkatambal na pagsalungat ng ἀγαθόν at φαῦλον; ang “masama” ay natural at hindi labis na nagtatakda ng antas ng moral na bigat ng φαῦλον.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang karaniwang puwersang nagsasaad ng layunin, nang hindi ipinapasya ang mas malawak na debateng teolohikal.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: ang layunin ng Diyos ayon sa pagpili
  rationale: Pinananatiling lantad ang kayariang κατ’ ἐκλογήν at iniiwasang gawing mas interpretatibo ang parirala kaysa sa Griyego.
- source_word: μένῃ
  choice: manatili
  rationale: Tuwirang ipinahahayag ang pangunahing diwa ng μένω na manatili o magpatuloy.
theological_decisions:
- issue: Puwersa ng ἵνα sa konteksto ng pagpili ng Diyos
  choice: upang manatili ang layunin ng Diyos
  alternative: na ang bunga ay manatili ang layunin ng Diyos
  rationale: Mas natural na layuning sugnay ang ἵνα, ngunit hindi dinaragdagan ng salin ang sinasabi nito upang lutasin ang mga debateng doktrinal.
- issue: Kahulugan ng ἐκλογή
  choice: pagpili
  alternative: pagkakahirang
  rationale: Ang “pagpili” ay malinaw sa karaniwang mambabasa at sapat na malapit sa leksikal na diwa; pinananatili ng talababa ang mas teknikal na alternatibo.
- issue: Pagpapatuloy ng pangungusap
  choice: gumamit ng mga gitling at hindi tinapos bilang ganap na pangungusap
  alternative: tapusin sa tuldok
  rationale: Ang talata ay nakapaloob sa pangungusap na nagpapatuloy sa Roma 9:12; ipinakikita ng bantas na hindi pa rito nagtatapos ang sintaktikong daloy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang panatilihin ang paliwanag na ugnayan sa konteksto at ang mga gitling upang ipakitang nagpapatuloy ang pangungusap sa kasunod na talata.
