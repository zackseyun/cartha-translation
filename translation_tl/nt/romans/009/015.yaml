id: ROM.9.15
reference: Romans 9:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: tl
  text: Sapagkat sinasabi niya kay Moises, “Magpapakita ako ng awa sa sinumang pagpapakitaan ko ng awa, at magpapakita ako ng habag sa sinumang pagpapakitaan ko ng habag.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Exodo 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: kay Moises
  rationale: Ang datibo ang di-tuwirang layon ng λέγει; natural itong ipahayag sa Tagalog bilang “kay Moises.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinapakita nito na ang talata ay nagbibigay ng batayan o paliwanag sa naunang pahayag ni Pablo.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang pangkasalukuyang anyo ng pormula sa pagsipi. Ang di-binanggit na simuno ay nauunawaang Diyos batay sa tuwirang pananalita sa Exodo 33:19.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Magpapakita ako ng awa … pagpapakitaan ko ng awa
  rationale: Pinananatili ang pag-uulit ng iisang pandiwa at ang diwa ng pagkakaloob ng awa, nang hindi nagdaragdag ng ideyang “pipiliin ko” na wala sa Griyego.
- source_word: ὃν ἂν
  choice: sa sinumang
  rationale: Natural na katumbas sa Tagalog ng di-tiyak na layon ng kamag-anak na parirala.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: magpapakita ako ng habag … pagpapakitaan ko ng habag
  rationale: Ang “habag” ay malinaw na nagpapahayag ng compassion at pinananatili ang pagkakaiba nito sa “awa,” pati ang paralelismo at pag-uulit ng Griyego.
theological_decisions:
- issue: Pagkilala sa nagsasalita sa pormula ng pagsipi
  choice: “sinasabi niya,” na tumutukoy sa Diyos
  alternative: “sinasabi ng Kasulatan kay Moises”
  rationale: Walang tahasang simuno ang pandiwang Griyego, ngunit ang sipi sa Exodo 33:19 ay tuwirang pananalita ng Diyos kay Moises. Pinananatili ng personal na anyo ang konteksto nang hindi nagpapasok ng dagdag na doktrina.
- issue: Kalayaan ng Diyos sa pagpapakita ng awa at habag
  choice: Panatilihin ang mahigpit at paulit-ulit na pahayag
  alternative: “Magpapakita ako ng awa sa sinumang pipiliin kong kaawaan”
  rationale: Hindi idinagdag ang “pipiliin” o “nais ko,” sapagkat wala ang mga salitang iyon sa Griyego. Sa gayon, nananatili ang tunay na diin at teolohikal na tensiyon ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatambal na “awa” at “habag” upang mapanatili ang leksikal na pagkakaiba at paralelismo ng ἐλεέω at οἰκτίρω. Ang bahagyang pormal na pag-uulit ay sinadyang panatilihin dahil mahalaga ito sa retorika at kahulugan ng sipi.
