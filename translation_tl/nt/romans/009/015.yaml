  source_fidelity: Tumpak ang salin sa Griyego. Ang “Sapagkat” ay maayos na katumbas ng γάρ; ang “sinasabi niya kay Moises” ay pinananatili ang pangkasalukuyang pormula sa pagsipi at ang datibong τῷ Μωϋσεῖ. Ang dalawang sugnay ay maingat na nagpapanatili ng hinaharap na pahayag, ng di-tiyak na “sinumang” para sa ὃν ἄν, at ng paulit-ulit na estruktura ng sipi.
