id: ROM.9.9
reference: Romans 9:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: tl
  text: 'Sapagkat ito ang salita ng pangako: “Sa panahong ito ay darating ako[a], at magkakaroon ng anak na lalaki si Sara.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “babalik ako.” “Darating ako” ang mababasa sa Griyego rito, bagaman “babalik ako” ang salin ng ilan batay sa pananalita sa Genesis na pinagmulan ng sipi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: pangako
  rationale: Ang henitibong ἐπαγγελίας ay naglalarawan sa λόγος; ang “salitang pangako” ay likas sa Filipino at pinananatili ang diin ni Pablo sa pangako ng Diyos.
- source_word: λόγος
  choice: salita
  rationale: Tumutukoy ito sa mismong pahayag na sinipi; ang “salita” ay maikli at hindi labis na nagpapakahulugan.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay paliwanag sa naunang pahayag ni Pablo.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Sa panahong ito
  rationale: Natural itong salin ng pormulang tumutukoy sa itinakdang panahon ng katuparan, nang hindi idinaragdag ang salitang “itinakda,” na hindi tahasang nasa parirala.
- source_word: ἐλεύσομαι
  choice: darating ako
  rationale: Ang pandiwa ay tuwirang nangangahulugang “darating ako”; inuuna nito ang aktuwal na Griyegong teksto ng Roma kaysa sa saling “babalik ako” na maaaring impluwensiya ng konteksto sa Genesis.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: magkakaroon ng anak na lalaki si Sara
  rationale: Ang literal na konstruksiyong “magkakaroon kay Sara ng isang anak na lalaki” ay idyomatikong nagpapahayag ng pag-aari; ang napiling salin ay natural at pinananatili ang tiyak na kahulugang “anak na lalaki.”
- source_word: Σάρρᾳ
  choice: Sara
  rationale: Ginamit ang karaniwang anyo ng pangalan sa makabagong Bibliyang Filipino.
- source_word: υἱός
  choice: anak na lalaki
  rationale: Tiyak na “son” ang kahulugan, hindi lamang pangkalahatang “anak,” at mahalaga ito sa pangako kina Abraham at Sara.
theological_decisions:
- issue: Ang pagsipi sa pangako kay Abraham at ang pagkilos ng Diyos
  choice: Iniharap ang pangako bilang tuwirang pananalita ng Diyos nang walang dagdag na pagpapaliwanag.
  alternative: Isalin ang ἐλεύσομαι bilang “babalik ako” upang umayon sa ilang tradisyon ng pagsasalin sa Genesis.
  rationale: Nakasalalay ang argumento ni Pablo sa pangako ng Diyos bilang batayan ng kapanganakan ni Isaac. Pinananatili ng salin ang puwersang ito habang inuuna ang mismong Griyegong anyo sa Roma at itinatala sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang lohikal na “Sapagkat,” ang pormulang “salitang pangako,” at ang tuwirang pananalita, habang iniwasan ang malamya o labis na literal na ayos ng Griyego.
