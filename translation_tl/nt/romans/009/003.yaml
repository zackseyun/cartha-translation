id: ROM.9.3
reference: Romans 9:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: tl
  text: Sapagkat maaari kong hilingin na ako mismo ay mapasailalim sa sumpa at mawalay sa Mesiyas[a] alang-alang sa mga kapatid ko[b], ang mga kalahi ko ayon sa laman[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sumpain mula sa Mesiyas” o “nasa ilalim ng sumpa, hiwalay sa Mesiyas.” Pinagsasama ng pananalitang Griyego ang diwa ng pagiging nasa ilalim ng sumpa at ng pagkakahiwalay sa Mesiyas.'
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga kapatid ko.” Sa konteksto, tinutukoy ni Pablo ang mga kapuwa niya Israelita, ang mga kalahi niya.
    reason: cultural_note
  - marker: c
    text: Ang “ayon sa laman” dito ay nangangahulugang ayon sa pisikal na angkan o lahi, hindi “makasalanang kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: maihihiling ko sana
  rationale: Ipinahahayag ng imperpektong anyo sa kontekstong ito ang isang matindi ngunit hipotetikal o halos di-maipahayag na hangarin, hindi lamang isang simpleng kilos sa nakaraan.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili nito ang paliwanag na kaugnayan ng talata sa naunang pahayag ni Pablo.
- source_word: ἀνάθεμα
  choice: mapasailalim sa sumpa
  rationale: Malinaw at likas itong Filipino para sa kalagayang nasa ilalim ng sumpa o nakatalaga sa kapahamakan, nang hindi gumagamit ng di-pamilyar na salitang teknikal.
- source_word: αὐτὸς ἐγώ
  choice: ako mismo
  rationale: Pinananatili ang mariing pagtukoy ni Pablo sa sarili.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: mawalay sa Mesiyas
  rationale: Ipinahahayag ng ἀπό ang pagkakahiwalay; pinananatili naman ng “Mesiyas” ang puwersa ng Χριστός bilang titulo.
- source_word: ὑπὲρ
  choice: alang-alang sa
  rationale: Natural nitong ipinapahayag ang kapakinabangan o pagsasakripisyo para sa iba.
- source_word: τῶν ἀδελφῶν μου
  choice: mga kapatid ko
  rationale: Pinananatili ang talinghaga ng pagkakapatid, habang nililinaw sa talababa na ang tinutukoy ay ang mga kapuwa Israelita ni Pablo.
- source_word: τῶν συγγενῶν μου
  choice: mga kadugo ko
  rationale: Malinaw nitong ipinahahayag ang ugnayan sa lahi at angkan, hindi lamang ang malapit na ugnayang pampamilya.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang natatanging pananalita ni Pablo at ang tunay na diwa ng σάρξ dito, na tumutukoy sa pisikal na angkan o lahi.
theological_decisions:
- issue: Kung aktuwal na panalangin o hipotetikal na hangarin ang pahayag ni Pablo
  choice: “Maihihiling ko sana” bilang hipotetikal o potensiyal na hangarin
  alternative: “Hinihiling ko noon” o “ipinanalangin ko”
  rationale: Hindi nito iginigiit na aktuwal na nanalangin si Pablo na mawalay sa Mesiyas, ngunit pinananatili ang tindi ng damdamin niya para sa Israel.
- issue: Kung isasalin ang Χριστός bilang titulo o gagamiting parang pangalan
  choice: Mesiyas
  alternative: Cristo
  rationale: Ang konteksto ay angkop sa malinaw na pagpapakita ng titulo at ng mesiyanikong kahulugan nito.
- issue: Kahulugan ng σάρξ sa κατὰ σάρκα
  choice: 'Pisikal at etnikong angkan: “ayon sa laman”'
  alternative: Makasalanang kalikasan
  rationale: Tinutukoy rito ni Pablo ang pagkakaugnay sa lahi, hindi ang kalagayang moral ng tao.
- issue: Ugnayan ng ἀνάθεμα at ἀπὸ τοῦ Χριστοῦ
  choice: Ipinahayag bilang magkaugnay na pagiging nasa ilalim ng sumpa at pagkakahiwalay sa Mesiyas
  alternative: “Sumpain mula sa Mesiyas” bilang isang mas pormal ngunit malabong parirala
  rationale: Natural sa Filipino ang pangunahing salin, samantalang itinatala sa talababa ang mas literal na kayarian at pinananatili ang saklaw ng posibleng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga katagang “Mesiyas” at “ayon sa laman” dahil mahalaga ang kanilang teolohikal at intertekstuwal na puwersa, ngunit nilinaw ang mga ito sa konteksto at sa mga talababa.
