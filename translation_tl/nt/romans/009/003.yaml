  naturalness: Makabago at marangal ang kabuuang Filipino. Mas malinaw at mas likas ang appositional na pag-uugnay gamit ang "ang mga kalahi ko," kaysa sa ikalawang pariralang may "sa mga."
  terminology: Ang "Mesiyas," "mapasailalim sa sumpa," at "ayon sa laman" ay angkop at tapat sa terminolohiyang Griyego. Ang "mga kalahi" ay mas tuwirang nagpapahayag ng kolektibong etnikong saklaw ng συγγενῶν kaysa "mga kadugo," na maaaring unang maunawaan bilang malalapit na kamag-anak.
