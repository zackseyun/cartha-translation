translation:
  language: tl
  text: na matindi ang aking kalungkutan[a] at walang tigil ang kirot[b] sa aking puso.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalamhati.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “matinding paghihirap.”
    reason: lexical_alternative
  - marker: c
    text: Literal sa Griyego, “sa puso ko”; tumutukoy ito sa aking panloob na damdamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng taimtim na pahayag ni Pablo sa naunang talata. Ang “na” ang likas na pang-ugnay sa Filipino.
- source_word: λύπη
  choice: kalungkutan
  rationale: Tumutukoy ito sa matinding lungkot o dalamhati. Karaniwan at malinaw ang “kalungkutan” sa makabagong Filipino.
- source_word: μοί ἐστιν
  choice: aking
  rationale: Ang datibong μοί kasama ng εἰμί ay nagsasaad ng personal na pagdanas o pag-aangkin. Likas itong naipapahayag sa pariralang “ang aking kalungkutan” sa Filipino.
- source_word: μεγάλη
  choice: matindi
  rationale: Ang “matindi” ay natural na panuring sa kalungkutan at pinananatili ang lakas ng Griyegong μεγάλη nang hindi gumagamit ng literal ngunit hindi gaanong likas na “malaki.”
- source_word: καὶ
  choice: at
  rationale: Payak na pinag-uugnay nito ang dalawang paglalarawan sa dalamhati.
- source_word: ἀδιάλειπτος
  choice: walang tigil
  rationale: Malinaw at natural nitong ipinahahayag ang tuloy-tuloy o hindi humihintong katangian ng kirot.
- source_word: ὀδύνη
  choice: kirot
  rationale: Tumutukoy sa masidhing panloob na sakit o paghihirap. Ang “kirot” ay tuwiran at angkop sa pariralang tumutukoy sa puso, habang ang “matinding dalamhati” ay maaari ring kahulugan.
- source_word: τῇ καρδίᾳ μου
  choice: sa aking puso
  rationale: Pinananatili nito ang kongkretong biblikal na idyoma ng puso bilang sentro ng panloob at emosyonal na buhay. Bagaman literal na datibo ang anyo, natural sa Filipino ang “sa aking puso.”
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “matindi” sa halip na literal na “malaki” upang maging likas ang paglalarawan sa kalungkutan, at pinanatili ang biblikal na larawang “puso.”
