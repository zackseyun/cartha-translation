base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: tl
  text: At sa mismong lugar kung saan sinabi sa kanila, “Hindi kayo ang bayan ko,” doon sila tatawaging mga anak na lalaki ng Diyos na buhay.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ng Diyos na buhay.” Ang Griyego ay literal na “mga anak na lalaki,” na pinanatili sa pangunahing teksto dahil maaari itong magpahiwatig ng katayuan at pamana ng isang anak; kabilang sa tinutukoy ang lahat ng ibinilang sa bayan ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Sipi o alusyon sa Oseas 1:10 (2:1 sa Septuagint), gamit ang pananalita tungkol sa pagpapanumbalik ng tipanang bayan.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: At mangyayari
  rationale: Pinananatili ang pang-ugnay at hinaharap na diwa, habang natural na ipinakikilala sa Filipino ang magaganap.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: sa mismong lugar kung saan
  rationale: Ang “mismong” ay naghahayag ng mariing pagtutugma ng lugar ng dating pagtanggi at ng pagbabalik-loob, nang hindi dinaragdagan ang saligan ng teksto.
- source_word: ἐρρέθη αὐτοῖς
  choice: sinabi sa kanila
  rationale: Natural na Filipino na nagpapanatili sa di-tiyak na tagapagsalita ng pasibong Griyego.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Hindi ko kayo bayan
  rationale: Pinananatili ang tipanang katawagang “bayan” at ang tuwirang pahayag, sa isang maikli at likas na ayos sa Filipino.
- source_word: ἐκεῖ κληθήσονται
  choice: doon sila tatawaging
  rationale: Pinananatili ang mariing “doon,” ang hinaharap, at ang pasibo nang hindi tahasang tinutukoy kung sino ang tatawag.
- source_word: υἱοὶ
  choice: mga anak na lalaki
  rationale: Tumpak na inilalarawan ang panlalaking pangmaramihang υἱοί at pinananatili ang posibleng diwa ng pagiging anak na tagapagmana; ipinaliliwanag sa talababa ang mas malawak na saklaw ng tinutukoy.
- source_word: θεοῦ ζῶντος
  choice: ng Diyos na buhay
  rationale: Likas at kinikilalang salin na nagpapanatili sa biblikal na paglalarawan sa Diyos bilang buhay.
theological_decisions:
- issue: Pagpapakahulugan sa υἱοὶ bilang pangmaramihang kumakatawan sa lahat
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Ang Griyego ay tahasang “mga anak na lalaki,” kaya pinanatili ito sa pangunahing teksto upang hindi mawala ang posibleng diwa ng pagiging anak at pagmamana. Gayunman, maaaring tumukoy ang pangmaramihang ito sa lahat ng kabilang sa bayan ng Diyos, anuman ang kasarian.
- issue: Tipanang identidad sa λαός μου
  choice: bayan ko / Hindi ko kayo bayan
  alternative: sarili kong bayan
  rationale: Ang “bayan” ay nagpapanatili sa tipanang pormula mula sa Oseas at iniiwasang dagdagan ng diin ang “sarili” na wala sa Griyego.
- issue: Hindi tinukoy na tagaganap ng κληθήσονται
  choice: tatawaging
  alternative: tatawag ang Diyos sa kanila na
  rationale: Pinananatili ang pasibong anyo at hindi tahasang idinaragdag ang Diyos bilang tagaganap, bagaman maaaring ipinahihiwatig siya ng konteksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pag-uulit ng lugar (“sa mismong lugar… doon”) upang maipakita ang mariing pagbabaligtad sa sipi. Inilagay ang mga talababa ayon sa pagkakasunod ng marker sa teksto.
