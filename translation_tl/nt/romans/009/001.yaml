  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: tl
  text: Sinasabi ko ang katotohanan sa Mesiyas[a]—hindi ako nagsisinungaling—at pinatototohanan din ito ng aking budhi[b] sa Banal na Espiritu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kay Cristo.” Ang salitang Griyego na Χριστός ay maaaring gamitin bilang titulong “Mesiyas” o bilang pangalang “Cristo.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “habang kasama kong nagpapatotoo ang aking budhi” o “at ang aking budhi ay nagpapatotoo kasama ko.”'
    reason: lexical_alternative
  - marker: c
    text: O, bagaman hindi gaanong malamang, “sa isang banal na espiritu.” Sa mga sulat ni Pablo, pinakanatural itong unawain bilang pagtukoy sa Banal na Espiritu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Nagsasabi ako ng katotohanan
  rationale: Likas at tuwirang salin ng idyomang nangangahulugang nagsasalita nang totoo; pinananatili nito ang taimtim na paggigiit ni Pablo.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas.” Ang “sa” ang pinakanatural na katumbas ng ἐν sa pahayag na ito nang hindi nililinaw nang higit sa ipinahihintulot ng Griyego ang tiyak na ugnayan kay Mesiyas.
- source_word: οὐ ψεύδομαι
  choice: hindi ako nagsisinungaling
  rationale: Tuwiran, kasalukuyan, at natural na pagtanggi sa modernong Tagalog.
- source_word: συμμαρτυρούσης μοι
  choice: kasama kong nagpapatotoo
  rationale: Pinananatili ang diwa ng unlaping συμ- na pakikiisa o pagpapatotoong kasama ni Pablo, habang ginagawang maayos sa Tagalog ang genitive absolute.
- source_word: τῆς συνειδήσεώς μου
  choice: ang aking budhi
  rationale: Ang “budhi” ang karaniwan at malinaw na katumbas ng συνείδησις sa kontekstong moral at pansarili.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: sa Banal na Espiritu
  rationale: Pinananatili ang ἐν sa pamamagitan ng “sa” at kinikilala ang pinakanatural na Paulinong reperensiya sa Banal na Espiritu, nang hindi ito ginagawang tahasang instrumental na “sa pamamagitan ng.”
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι ἁγίῳ
  choice: ang Banal na Espiritu
  alternative: isang banal na espiritu, o ang espiritu ni Pablo na itinuturing na banal
  rationale: Sa gamit ni Pablo, pinakanatural na tumukoy ito sa Banal na Espiritu. Gayunman, dahil walang artikulo ang pariralang Griyego, inilalahad sa talababa ang mas malayong posibleng pagbasa.
- issue: Titular o pangalang gamit ng Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Pinananatili ng “Mesiyas” ang lakas nito bilang titulo ng Pinahiran, samantalang kinikilala sa talababa na maaari rin itong gawing “Cristo” sa nakaugaliang pangalang gamit.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga gitling na em upang maipakita ang mariing pagsingit na “hindi ako nagsisinungaling,” at iniwasan ang labis na pormal o makalumang ayos. Ang “kasama kong nagpapatotoo” ay bahagyang mas pormal ngunit sadyang pinili upang mapanatili ang diwa ng Griyegong συμμαρτυρούσης.
