id: ROM.9.32
reference: Romans 9:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: tl
  text: Bakit? Dahil hindi iyon batay sa pananampalataya[a], kundi para bang batay sa mga gawa.[b] Natisod sila sa batong katitisuran[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi mula sa pananampalataya” o “hindi sa pamamagitan ng pananampalataya.” Sa Griyego, literal na “hindi mula sa pananampalataya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kundi para bang mula sa mga gawa.” Pinananatili ng “para bang” ang diwa ng salitang Griyego na ὡς.
    reason: lexical_alternative
  - marker: c
    text: Pahiwatig ito sa Isaias 8:14; ihambing din ang Isaias 28:16 sa kasunod na talata.
    reason: cross_reference
  - marker: d
    text: Maaari ring “sa batong nagiging dahilan ng pagkatisod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί; ὅτι
  choice: Bakit? Dahil
  rationale: Pinananatili ang maikli at madiing tanong at ang kasunod nitong tuwirang paliwanag.
- source_word: οὐκ ἐκ πίστεως
  choice: hindi iyon batay sa pananampalataya
  rationale: Ang “batay sa” ay likas sa makabagong Filipino para sa ἐκ kapag tumutukoy sa pinagmulan o saligan; pinananatili ng “pananampalataya” ang karaniwang kahulugang Paulino ng πίστις.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: kundi para bang batay sa mga gawa
  rationale: Mahalaga ang “para bang” upang mapanatili ang paglilimita o paghahambing na ipinahihiwatig ng ὡς, sa halip na gawing payak na “sa pamamagitan ng mga gawa.”
- source_word: προσέκοψαν
  choice: Natisod sila
  rationale: Malinaw at kongkretong inilalarawan nito ang metapora ng pagtama ng paa sa isang sagabal.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: sa batong katitisuran
  rationale: Pinananatili ang larawan ng bato at ang ugnayang leksikal sa pandiwang “natisod,” habang maikli at marangal ang anyo sa Filipino.
theological_decisions:
- issue: Kahulugan ng πίστις sa paghahambing ng pananampalataya at mga gawa
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Sa konteksto, ang pinag-uusapan ay ang saligan ng paghahangad sa katuwiran. Ang “pananampalataya” ang pinakanaaangkop na pangkalahatang salin at hindi nito ipinapasok ang mas tiyak na pakahulugang hindi hinihingi ng talata.
- issue: Lakas ng ὡς sa pariralang ὡς ἐξ ἔργων
  choice: para bang batay sa mga gawa
  alternative: batay sa mga gawa
  rationale: Hindi dapat alisin ang ὡς, sapagkat pinananatili nito ang tunay na pagkakaiba sa pagitan ng “mula sa mga gawa” at “para bang mula sa mga gawa.”
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal na himig. Ginamit ang “batong katitisuran” upang mapanatili ang siksik na metapora at ang pag-uulit ng ideya ng pagkatisod; ipinaliwanag sa talababa ang mas lantad na alternatibo.
