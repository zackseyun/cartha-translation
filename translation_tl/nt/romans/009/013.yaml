translation:
  language: tl
  text: 'Gaya ng nasusulat: “Inibig ko si Jacob, ngunit kinamuhian ko si Esau.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sipi mula sa Malakias 1:2–3.
    reason: cross_reference
  - marker: b
    text: O “itinakwil ko,” o “hindi ko inibig nang gaya ng pag-ibig ko kay Jacob.” Nauunawaan ng ilan ang “kinamuhian” dito bilang pagtatakwil kaugnay ng tipan o bilang paghahambing ng pag-ibig, hindi bilang damdamin ng poot.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Gaya ng
  rationale: Likas at malinaw na panimula sa sipi mula sa Kasulatan; pinananatili ang paghahambing na diwa ng salitang Griyego.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormula sa Filipino para sa pagbanggit ng Kasulatan at angkop sa resultative force ng Griyegong perfect passive.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: ἠγάπησα
  choice: Inibig ko
  rationale: Tuwirang isinasalin ang aorist na ἠγάπησα; dignified at natural ang “inibig” sa isang pormal na sipi sa Kasulatan.
- source_word: δὲ
  choice: ngunit
  rationale: Malinaw na ipinapakita ang matinding pagsalungat sa dalawang sugnay.
- source_word: Ἠσαῦ
  choice: Esau
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: ἐμίσησα
  choice: kinamuhian ko
  rationale: Pinananatili ang tuwiran at matinding leksikal na kahulugan ng μισέω sa halip na palambutin ito sa pangunahing teksto.
theological_decisions:
- issue: Kung palalambutin ang “kinamuhian ko” dahil sa mga pagbasa tungkol sa tipan, pagpili, o paghahambing ng pag-ibig
  choice: Panatilihin ang “kinamuhian ko” sa pangunahing teksto
  alternative: “itinakwil ko” o “hindi ko inibig nang gaya ng pag-ibig ko kay Jacob”
  rationale: μισέω ang ginamit sa Griyegong sipi mula sa Malakias. Ang tuwirang salin ay nagpapanatili sa tunay na tindi at teolohikal na tensiyon ng teksto; inilalagay sa talababa ang posibleng kontekstuwal na mga pagkaunawa sa halip na ipasok ang isa sa mga iyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na may marangal na himig na angkop sa sipi mula sa Kasulatan. Pinili ang “Gaya ng nasusulat” bilang pamilyar ngunit malinaw na pormula, at “kinamuhian” upang mapanatili ang lakas ng orihinal nang hindi nilulutas sa teksto ang interpretatibong usapin.
