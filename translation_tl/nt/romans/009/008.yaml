  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: tl
  text: Ibig sabihin, hindi ang mga anak ayon sa laman[a] ang mga anak ng Diyos, kundi ang mga anak ayon sa pangako ang ibinibilang na mga inapo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak sa likas na angkan.” Sa Griyego, “mga anak ng laman.”
    reason: lexical_alternative
  - marker: b
    text: O “ibinibilang na binhi.” Ang “mga inapo” ay salin dito ng Griyegong sperma sa diwang mga kaapu-apuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Ibig sabihin
  rationale: Likas at malinaw na panandang nagpapakilala sa paliwanag ni Pablo tungkol sa naunang pahayag.
- source_word: τέκνα
  choice: mga anak
  rationale: Kasama ang lahat ng kasarian at napapanatili ang pag-uulit at paghahambing sa tatlong gamit ng salita.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: mga anak ayon sa laman
  rationale: Pinananatili ang salitang ‘laman’ at ipinahihiwatig ng ‘ayon sa’ na ang tinutukoy rito ay likas o pisikal na angkan, hindi isang etikal na diwa.
- source_word: τέκνα τοῦ θεοῦ
  choice: mga anak ng Diyos
  rationale: Tuwirang katumbas at karaniwang pahayag sa makabagong Tagalog.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: mga anak ayon sa pangako
  rationale: Ipinakikita na ang pagkakakilanlan ng mga anak ay nakabatay sa pangako ng Diyos, habang pinananatili ang pagtutulad sa ‘ayon sa laman.’
- source_word: λογίζεται
  choice: ibinibilang
  rationale: Inihahayag ang diwang itinuturing o kinikilalang kabilang sa isang uri, nang hindi tahasang nagdaragdag kung sino ang gumagawa nito.
- source_word: εἰς σπέρμα
  choice: na lahi
  rationale: Sa konteksto ng mga inapo ni Abraham, ang kolektibong ‘lahi’ ay malinaw at likas na salin ng σπέρμα kaysa sa literal ngunit maaaring malabong ‘binhi.’
theological_decisions:
- issue: Ang paghahambing sa pisikal na angkan at sa mga anak na itinakda ng pangako
  choice: Pinanatili ang paghahambing ng ‘ayon sa laman’ at ‘ayon sa pangako’ nang hindi nililinaw sa salin ang mas malawak na doktrinal na tanong.
  alternative: Gawing tahasan na tumutukoy lamang ito sa pangkat sa kasaysayan o sa indibiduwal na predestinasyon.
  rationale: Ipinahahayag ng Griyego ang paghahambing ngunit hindi nito tahasang nilulutas sa talatang ito ang mas malawak na pagtatalong teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang ‘ayon sa laman’ upang mapanatili ang mahalagang katawagan ni Pablo ngunit malinaw pa rin ang genealogical na diwa; ipinaliliwanag sa talababa ang mas literal at mas dinamikong mga alternatibo.
