  text: na mga Israelita, na sa kanila ang pag-aampon bilang mga anak[c], ang kaluwalhatian[b], ang mga tipan, ang pagkakaloob ng Kautusan, ang pagsamba[d], at ang mga pangako,
  philosophy: optimal-equivalence
  footnotes:
