    text: Ang “kaluwalhatian” ay malamang na tumutukoy sa nahayag na presensiya ng Diyos sa gitna ng Israel.
    reason: cross_reference
  - marker: c
    text: 'Maaari ring isalin: “pagiging mga anak” o “katayuan bilang mga anak.”'
    reason: lexical_alternative
  - marker: d
    text: Ibig sabihin, ang pagsamba at paglilingkod ng Israel sa Diyos ayon sa tipan.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: na mga Israelita
  rationale: Ipinagpapatuloy ng pariralang ito ang paglalarawan sa mga kababayan ni Pablo mula sa naunang talata. Ang “na mga Israelita” ay likas at tuwirang nagpapanatili sa kanilang etniko at tipanang pagkakakilanlan.
- source_word: ὧν
  choice: sa kanila ang
  rationale: Ang panghalip na nasa genitive ay nagpapahayag ng pag-aari. Malinaw at natural sa Tagalog ang “sa kanila ang” para sa sunod-sunod na mga pribilehiyong binanggit.
- source_word: υἱοθεσία
  choice: pagkupkop bilang mga anak
  rationale: Pinananatili nito ang larawan ng pagtanggap o paglalagay bilang anak, at nililinaw na dito ay tumutukoy sa tipanang katayuan ng Israel bilang bayan, nang hindi ipinapasok ang mas makitid na indibidwal na pakahulugan.
- source_word: δόξα
  choice: kaluwalhatian
  rationale: Tapat ito sa payak ngunit mayamang teolohikal na katawagan ng Griyego. Hindi tahasang nililimitahan ng pangunahing teksto ang tinutukoy, bagaman malamang na ito ang nahayag na presensiya ng Diyos sa Israel.
- source_word: διαθῆκαι
  choice: mga tipan
  rationale: Pinananatili ang anyong maramihan ng Griyego at ginagamit ang karaniwang terminong biblikal sa modernong Tagalog.
- source_word: νομοθεσία
  choice: pagkakaloob ng Kautusan
  rationale: Ang salita ay tumutukoy hindi lamang sa Kautusan kundi sa pagkakaloob o pagtatatag nito. Ang malaking titik ay nagpapakilalang ito ang Kautusang ibinigay sa Israel.
- source_word: λατρεία
  choice: pagsamba
  rationale: Saklaw nito ang itinakdang paglilingkod at pagsamba ng Israel sa Diyos nang hindi ito nililimitahan sa templo o sa mga pari lamang.
- source_word: ἐπαγγελίαι
  choice: mga pangako
  rationale: Natural na salin ito at pinananatili ang anyong maramihan, na tumutukoy sa mga pangako ng Diyos sa Israel.
theological_decisions:
- issue: Kahulugan ng υἱοθεσία kaugnay ng Israel
  choice: pagkupkop bilang mga anak
  alternative: pag-aampon; pagiging mga anak
  rationale: Naglilista ang talata ng mga makasaysayan at tipanang pribilehiyo ng Israel bilang bayan. Pinananatili ng salin ang talinghaga ng pagpasok sa katayuan ng anak nang hindi ito awtomatikong itinutumbas sa bawat indibidwal na gamit ni Pablo sa ibang konteksto.
- issue: Tinutukoy ng ἡ δόξα
  choice: kaluwalhatian
  alternative: kaluwalhatian ng Diyos; nahayag na presensiya ng Diyos
  rationale: Malamang na tinutukoy nito ang hayag na presensiya ng Diyos sa gitna ng Israel, ngunit “ang kaluwalhatian” lamang ang sinasabi ng Griyego. Kaya pinananatili sa teksto ang lawak at teolohikal na bigat nito, at inilalagay ang paglilinaw sa talababa.
- issue: Saklaw ng λατρεία
  choice: pagsamba
  alternative: paglilingkod sa Diyos; paglilingkod sa templo
  rationale: Sa konteksto, tumutukoy ito sa tipanang sistema ng pagsamba at paglilingkod ng Israel. Ang “pagsamba” ay malinaw ngunit hindi mas makitid kaysa sa salitang Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyo ng sugnay na nagpapatuloy mula sa naunang talata at ang kuwit sa dulo dahil hindi pa tapos ang pangungusap. Ginamit ang “Kautusan” bilang kinikilalang katawagan sa Kautusang ibinigay sa Israel.
