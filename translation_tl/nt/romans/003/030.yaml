  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: tl
  text: Yamang iisa ang Diyos,[a] siya ang magpapawalang-sala sa mga tinuli batay sa pananampalataya at sa mga di-tinuli sa pamamagitan ng pananampalataya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung tunay ngang iisa ang Diyos.”
    reason: alternative_reading
  - marker: b
    text: Sa Griyego, “pagtutuli” at “di-pagtutuli,” na tumutukoy sa mga tinuli at mga di-tinuli.
    reason: cultural_note
  - marker: c
    text: 'Dalawang magkaibang pananalita ang ginamit ni Pablo: “batay sa pananampalataya” at “sa pamamagitan ng pananampalataya.” Maaaring estilistikong pagkakaiba lamang ito at hindi isang matalim na pagkokontrast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: yamang
  rationale: Sa daloy ng pangangatwiran, ipinakikita nito ang batayang kinikilalang totoo, hindi ang tunay na pag-aalinlangan. Gayunman, itinatala sa talababa ang posibleng kondisyunal na anyo.
- source_word: εἷς ὁ θεός
  choice: iisa ang Diyos
  rationale: Natural at mariing pinananatili nito ang pahayag na monoteistiko bilang batayan ng sumusunod na pangangatwiran.
- source_word: δικαιώσει
  choice: magpapawalang-sala
  rationale: Pinananatili nito ang hinaharap na panahunan at malinaw na ipinahahayag sa makabagong Tagalog ang hudisyal na diwa ng δικαιόω nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: περιτομήν
  choice: mga tuli
  rationale: Ang abstraktong pangngalan ay metonimiya para sa mga taong tuli; hindi ito pinalawak agad bilang isang tiyak na pangkat-etniko.
- source_word: ἐκ πίστεως
  choice: batay sa pananampalataya
  rationale: Naipahahayag nito nang natural ang pananampalataya bilang batayan, habang naipakikita ang kaibahan nito sa διά sa ikalawang parirala.
- source_word: ἀκροβυστίαν
  choice: mga di-tuli
  rationale: Ang pangngalan ay metonimiya para sa mga taong hindi tuli; iniiwasan ng salin ang higit na interpretatibong 'mga Hentil.'
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Pinananatili nito ang naiibang pang-ukol na διά at ang posibleng diwa ng paraan o kasangkapan, nang hindi gumagawa ng matigas na teolohikal na pagkakaiba.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang malinaw, karaniwan, at angkop na salin ng πίστις sa kontekstong ito.
theological_decisions:
- issue: Kung may sinasadyang teolohikal na pagkakaiba sa pagitan ng ἐκ πίστεως at διὰ τῆς πίστεως
  choice: Panatilihin ang pagkakaiba bilang 'batay sa pananampalataya' at 'sa pamamagitan ng pananampalataya,' ngunit huwag igiit na may matalim na doktrinal na kontrast.
  alternative: Isalin ang dalawang parirala sa iisang paraan, o ituring ang una bilang batayan at ang ikalawa bilang paraan na may mahigpit na teolohikal na pagkakaiba.
  rationale: Magkaiba ang mga pang-ukol sa Griyego, kaya nararapat itong makita sa salin; ngunit hindi sapat ang konteksto upang ipasiya na tiyak at matalim ang pagkakaiba.
- issue: Kung ang εἴπερ ay sanhi o tunay na kondisyon
  choice: Isalin bilang 'yamang' sa pangunahing teksto.
  alternative: Kung tunay ngang iisa ang Diyos.
  rationale: Ang pangangatwiran ay nakasalig sa pinagsasaluhang paniniwalang iisa ang Diyos, ngunit pinananatili sa talababa ang pormal na posibleng kondisyunal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga tuli' at 'mga di-tuli' bilang natural na metonimikong tawag sa mga tao. Ang 'magpapawalang-sala' ay madaling maunawaan at pinananatili ang hudisyal na diwa ng pandiwa.
