  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: tl
  text: Ngunit ngayon, hiwalay sa Kautusan, nahayag ang katuwiran[a] ng Diyos[b], na pinatotohanan ng Kautusan at ng mga Propeta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari rin, “katuwirang mula sa Diyos.”
    reason: alternative_reading
  - marker: c
    text: Ibig sabihin, ang mga Kasulatan; ang “Kautusan at mga Propeta” ay katawagan para sa mga Kasulatang ito, na karaniwang iniuugnay sa saksi ng Lumang Tipan.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ngunit ngayon
  rationale: Pinananatili ang kapuwa pansamantalang diwa ng νυνί at ang malinaw na pagsalungat na ipinahihiwatig ng δέ sa daloy ng pangangatwiran ni Pablo.
- source_word: χωρὶς νόμου
  choice: hiwalay sa Kautusan
  rationale: Ipinahahayag ng χωρίς ang pagkakahiwalay o pagiging bukod, hindi lamang simpleng kawalan. Ang malaking titik sa “Kautusan” ay angkop sa malamang na pagtukoy sa Kautusan ni Moises sa konteksto.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ay likas at matatag na katumbas sa makabagong Tagalog para sa δικαιοσύνη, habang ang posibleng diwang “katarungan” ay pinananatili sa talababa.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: 'Pinananatili ng pariralang genitibo ang sadyang kaluwagan ng Griyego: maaari itong tumukoy sa katuwirang nauukol sa Diyos, ipinakikita ng Diyos, o nagmumula sa Diyos, nang hindi agad nagpapasya sa isang pakahulugan.'
- source_word: πεφανέρωται
  choice: nahayag
  rationale: Ang “nahayag” ay maikli at natural, at nagpapahiwatig ng isang paghahayag na naganap at nananatiling hayag, gaya ng aspektong perpekto ng pandiwa.
- source_word: μαρτυρουμένη
  choice: na pinatotohanan
  rationale: Malinaw na inilalahad ang patuloy na pasibong ugnayan ng participle sa “katuwiran ng Diyos” at pinananatili ang diwa ng pagpapatotoo o pagsaksi.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: ng Kautusan at ng mga Propeta
  rationale: Ang mga malaking titik ay nagpapahiwatig na ang “Kautusan at mga Propeta” ay kinikilalang tawag sa saksi ng mga Kasulatan, hindi lamang sa mga utos at sa ilang propetang tao.
theological_decisions:
- issue: Kahulugan ng genitibo sa δικαιοσύνη θεοῦ
  choice: ang katuwiran ng Diyos
  alternative: ang katuwirang mula sa Diyos
  rationale: Hindi ipinapasya ng pangunahing teksto kung ang diin ay nasa sariling katuwiran at matuwid na pagkilos ng Diyos o sa katuwirang nagmumula sa kanya para sa tao. Pinananatili ng “ng Diyos” ang mahalagang teolohikal na tensiyong ito.
- issue: Saklaw ng δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Maaaring saklawin ng salita ang katuwiran at katarungan. Ginagamit sa pangunahing teksto ang mas malawak at tradisyonal ngunit nauunawaang “katuwiran,” at inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” at “mga Propeta” bilang pamilyar na katawagang biblikal, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
