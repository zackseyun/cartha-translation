id: ROM.3.27
reference: Romans 3:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: tl
  text: Kaya, nasaan ang pagmamalaki? Inalis na ito. Sa pamamagitan ng anong uri ng kautusan? Ng mga gawa? Hindi, kundi sa pamamagitan ng kautusan ng pananampalataya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: pagmamalaki
  rationale: Likas at malinaw na salin para sa pagyayabang o pagmamapuri sa sariling katayuan o nagawa; ang “pagmamalaki” ay angkop sa retorikal na tanong.
- source_word: ἐξεκλείσθη
  choice: inalis na ito
  rationale: Ipinahahayag ang ganap na pagkakait o pagsasara ng puwang para sa pagmamalaki, habang nananatiling natural sa modernong Tagalog.
- source_word: διὰ ποίου νόμου
  choice: sa pamamagitan ng anong uri ng kautusan
  rationale: Pinananatili ang instrumental na diwa ng διά at ang tanong ng ποίου tungkol sa uri o katangian ng νόμος.
- source_word: τῶν ἔργων
  choice: ng mga gawa
  rationale: Direktang inililipat ang eliptikong parirala at pinananatili ang ugnayan nito sa naunang “kautusan.”
- source_word: νόμου πίστεως
  choice: kautusan ng pananampalataya
  rationale: Pinananatili ang sadyang tensiyon sa paggamit ni Pablo ng “kautusan” kaugnay ng “pananampalataya,” nang hindi ito ipinapakahulugang simulain o sistema.
theological_decisions:
- issue: Kahulugan ng νόμος sa “kautusan ng pananampalataya”
  choice: kautusan ng pananampalataya
  alternative: simulain ng pananampalataya
  rationale: Pinananatili ang leksikal na pag-uulit at teolohikal na tensiyon ng νόμος sa talata, sa halip na tahimik na lutasin kung ito ay tumutukoy sa Kautusan, isang prinsipyo, o isang kaayusan.
- issue: Paraan ng pag-aalis sa pagmamalaki
  choice: sa pamamagitan ng
  alternative: dahil sa / ayon sa
  rationale: Ang instrumental na salin ay pinakamalapit sa διά na may genitive at hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang maiikling retorikal na tanong at ang paulit-ulit na “kautusan” upang maingatan ang estruktura at tensiyon ng Griyego.
