id: ROM.3.7
reference: Romans 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: tl
  text: Ngunit kung sa pamamagitan ng aking kasinungalingan ay lalong nahayag ang katapatan ng Diyos para sa kanyang kaluwalhatian, bakit hinahatulan pa rin ako bilang makasalanan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: katapatan ng Diyos
  rationale: Sa konteksto ng Roma 3:4–7, inihahambing ang pagiging totoo at mapagkakatiwalaan ng Diyos sa kasinungalingan ng tao. Ang “katapatan ng Diyos” ay likas sa modernong Tagalog at naipapahayag ang moral at relasyonal na diwa ng parirala.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: sa pamamagitan ng aking kasinungalingan
  rationale: 'Ginagamit ang ἐν sa instrumental na diwa: ang kasinungalingan ng nagsasalita ang paraang sinasabing nagpalitaw nang higit sa katapatan ng Diyos.'
- source_word: ἐπερίσσευσεν
  choice: lalong nahayag
  rationale: Ipinahihiwatig ng pandiwa ang pagsagana o pag-ibayo. Sa Tagalog, ang “lalong nahayag” ay malinaw na naghahatid na ang katapatan ng Diyos ay naging higit na kapansin-pansin dahil sa ipinapalagay na paghahambing, nang hindi ipinahihiwatig na nadagdagan ang katangian ng Diyos mismo.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: para sa kanyang kaluwalhatian
  rationale: Likas itong Tagalog para sa kinalabasan o layuning ipinahihiwatig ng εἰς, habang pinananatili ang kaugnayan sa kaluwalhatian ng Diyos.
- source_word: τί ἔτι κἀγὼ
  choice: bakit hinahatulan pa rin ako
  rationale: Ang “pa rin” ay nagpapanatili sa lakas ng ἔτι. Hindi hiwalay na isinalin ang dagdag na himig ng κἀγώ sapagkat likas na naipahihiwatig iyon ng retorikal na tanong sa Tagalog.
- source_word: κρίνομαι
  choice: hinahatulan
  rationale: Ang kasalukuyang pasibong anyo ay ipinapahayag nang natural sa “hinahatulan,” nang hindi ito tahasang nililimitahan sa pangwakas na paghatol.
- source_word: ὡς ἁμαρτωλὸς
  choice: bilang makasalanan
  rationale: Tuwiran at natural itong katumbas ng predikatibong parirala at hindi pinapalabo ang pananagutan ng nagsasalita.
theological_decisions:
- issue: Kung ang ἀλήθεια τοῦ θεοῦ ay tumutukoy sa abstraktong “katotohanan” o sa moral at relasyonal na “katapatan” ng Diyos.
  choice: katapatan ng Diyos
  alternative: katotohanan ng Diyos
  rationale: Ang agarang konteksto ay naghahambing sa Diyos na totoo at sa tao na sinungaling. Pinananatili ng “katapatan” ang paghahambing na ito nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kung ang ἐπερίσσευσεν ay dapat ilarawan bilang pagdami ng katapatan ng Diyos o bilang higit na pagpapakita nito.
  choice: lalong nahayag
  alternative: lalong sumagana
  rationale: Pinananatili ng napiling salin ang retorikal na ideya na ang katapatan ng Diyos ay higit na napatitingkad ng kasinungalingan ng tao, habang iniiwasan ang di-sinasadyang pahiwatig na ang mismong katapatan ng Diyos ay dating kulang at nadagdagan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang anyo ng retorikal na tanong at ang tensiyon ng argumento, nang hindi ito nilulutas o nilalagyan ng paliwanag sa mismong talata.
