  source_fidelity: 'Tumpak na naipapahayag ang kondisyonal at retorikal na argumento. Ang “katapatan ng Diyos” ay angkop sa ἀλήθεια τοῦ θεοῦ sa agarang paghahambing sa kasinungalingan ng tao; ang “sa pamamagitan ng aking kasinungalingan,” “para sa kanyang kaluwalhatian,” at “pa rin” ay mahusay na tumutugon sa instrumental na ἐν, εἰς τὴν δόξαν αὐτοῦ, at ἔτι. Ang “lalong nahayag” ay isang kontekstuwal na pagpapahayag ng ἐπερίσσευσεν: bahagyang hindi kasing-literal ng “sumagana/umapaw,” ngunit ligtas at malinaw nitong inihahatid ang retorikal na puntong higit na naitatanghal ang katapatan ng Diyos sa itinakdang paghahambing.'
