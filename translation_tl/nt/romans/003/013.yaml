id: ROM.3.13
reference: Romans 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: tl
  text: Ang lalamunan nila ay bukás na libingan; patuloy silang nandaraya sa pamamagitan ng kanilang mga dila[a]; ang kamandag ng mga ulupong[b] ay nasa ilalim ng kanilang mga labi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginagamit nila ang kanilang mga dila sa pandaraya.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay tumutukoy sa isang uri ng makamandag na ahas; maaari ring isaling “mga ahas na makamandag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: libingan
  rationale: Natural at malinaw na katumbas sa modernong Tagalog; pinananatili nito ang larawan ng kamatayan nang hindi nililimitahan sa isang uri ng puntod.
- source_word: ἀνεῳγμένος
  choice: bukás
  rationale: Ipinahahayag ng pang-uring anyo ang nananatiling kalagayan bunga ng pagkakabukas; natural sa Tagalog ang “bukás na libingan.”
- source_word: λάρυγξ
  choice: lalamunan
  rationale: Karaniwan at tuwirang katumbas na nagpapanatili sa larawang tumutukoy sa sangkap ng pagsasalita.
- source_word: ἐδολιοῦσαν
  choice: patuloy silang nandaraya
  rationale: Ipinakikita ng “patuloy” ang di-ganap at nagpapatuloy na aspekto ng Griyegong imperfect, samantalang ang “nandaraya” ay natural na paglalarawan ng mapanlinlang nilang pananalita.
- source_word: ταῖς γλώσσαις αὐτῶν
  choice: sa pamamagitan ng kanilang mga dila
  rationale: Pinananatili ang instrumental na gamit ng dative at ang kongkretong larawan ng mga dila bilang kasangkapan ng pandaraya.
- source_word: ἰὸς
  choice: kamandag
  rationale: Sa konteksto ng makamandag na ahas, mas tiyak at natural ang “kamandag” kaysa pangkalahatang “lason.”
- source_word: ἀσπίδων
  choice: mga ulupong
  rationale: Ang “ulupong” ay isang natural at dignified na katawagan sa makamandag na ahas sa Tagalog; hindi tiyak ang eksaktong uri ng ahas na tinutukoy ng sinaunang salita.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: nasa ilalim ng kanilang mga labi
  rationale: Tuwirang pinananatili ang matingkad na larawang pangkatawan ng Griyego.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Kasulatan. Ginamit ang “bukás” na may tuldik upang luminaw na nangangahulugang open, hindi tomorrow. Pinanatili ang parallel na mga larawang lalamunan, dila, at labi.
