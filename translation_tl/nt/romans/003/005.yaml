  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: tl
  text: Ngunit kung ang ating kasamaan ay nagpapakita ng katuwiran ng Diyos[a], ano ang sasabihin natin? Hindi ba di-makatarungan ang Diyos sa pagpapataw ng poot? (Nagsasalita ako sa paraang pantao.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ating kawalang-katarungan ay nagpapakita ng katarungan ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: kasamaan
  rationale: Ipinapahayag ang moral na kabaligtaran ng katuwiran ng Diyos sa natural na modernong Tagalog; ang posibleng diwang pangkatarungan na “kawalang-katarungan” ay pinananatili sa talababa.
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Pinananatili ang malawak na diwang moral at relasyonal ng salita sa argumento ni Pablo; maaari rin itong tumukoy sa “katarungan” sa kontekstong ito.
- source_word: συνίστησιν
  choice: nagpapakita
  rationale: Likas at malinaw na ipinahihiwatig na ang kasamaan ng tao ay naglalantad o nagpapatingkad sa katuwiran ng Diyos.
- source_word: μὴ ἄδικος
  choice: Hindi naman di-makatarungan ang Diyos ... hindi ba?
  rationale: Ipinakikita ng μή na umaasa ang tanong ng negatibong sagot, habang nananatiling tunay na tanong ang pagtutol na inilalahad ni Pablo.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: sa pagpaparusa niya nang may poot
  rationale: Ipinahahayag sa natural na Tagalog ang paglalapat ng poot bilang hatol, nang hindi ginagawang hiwalay na persona ang poot.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Nagsasalita ako ayon sa pangangatwiran ng tao
  rationale: Nililinaw ang idyoma bilang paraan ng pangangatwirang pantao, hindi bilang sariling paghatol ni Pablo tungkol sa Diyos.
theological_decisions:
- issue: Ang retorikal na tanong tungkol sa katarungan ng Diyos sa paghatol
  choice: Hindi naman di-makatarungan ang Diyos sa pagpaparusa niya nang may poot, hindi ba?
  alternative: Di-makatarungan ba ang Diyos kapag ipinapataw niya ang poot?
  rationale: Ang μή ay karaniwang naghuhudyat ng inaasahang negatibong sagot. Pinananatili ng salin ang lakas ng pagtutol at ang retorikal na direksiyon nito nang hindi nilulutas o pinahihina ang tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “katuwiran” sa pangunahing teksto bilang malawak na katumbas ng δικαιοσύνη, habang inilagay sa talababa ang pares na “kawalang-katarungan/katarungan.”
