  source_fidelity: Tumpak ang pangunahing daloy ng argumento at ang pagsasalin ng ἀδικία bilang “kasamaan” at δικαιοσύνη bilang “katuwiran.” Gayunman, ang “sa pagpaparusa niya nang may poot” ay bahagyang inililihis ang ἐπιφέρων τὴν ὀργήν tungo sa paraan o damdamin ng pagpaparusa. Mas tuwirang ipinahihiwatig ng Griyego na ipinapataw ng Diyos ang poot.
  naturalness: Malinaw at marangal ang draft. Mas natural at mas maikli sa modernong Tagalog ang “Hindi ba di-makatarungan ang Diyos sa pagpapataw ng poot?” at “Nagsasalita ako sa paraang pantao.”
  terminology: Ang “katuwiran” at “katarungan” sa talababa ay angkop na pares para sa δικαιοσύνη sa kontekstong ito. Ang “kasamaan” ay katanggap-tanggap para sa ἀδικία; napapanatili ng talababa ang alternatibong diwang pangkatarungan.
