id: ROM.3.6
reference: Romans 3:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: tl
  text: Hinding-hindi![a] Kung hindi, paano hahatulan ng Diyos ang sanlibutan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi maaari!”; mas pormal, “Huwag nawang mangyari!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang mariing idyomatikong pagtanggi ang parirala. Likas at malinaw sa makabagong Tagalog ang “Hinding-hindi!” at pinananatili nito ang puwersa ng Griyego nang hindi ginagawang literal ang anyong optatibo.
- source_word: ἐπεὶ
  choice: Kung hindi
  rationale: Sa pangangatwirang ito, ipinakikita ng ἐπεὶ ang kahihinatnan kung tatanggapin ang katatanggihan pa lamang na palagay. Natural na naihahayag ito ng “Kung hindi” sa Tagalog.
- source_word: κρινεῖ
  choice: paano hahatulan ng Diyos
  rationale: Ang κρινεῖ ay future indicative. Pinananatili ng “hahatulan” ang aspektong panghinaharap, samantalang ang ayos ng pangungusap ay likas sa Tagalog.
- source_word: τὸν κόσμον
  choice: ang sanlibutan
  rationale: Tumutukoy rito ang κόσμος sa sanlibutan bilang malawak na saklaw ng paghatol ng Diyos. Karaniwan, malinaw, at marangal na katumbas ang “sanlibutan” sa kontekstong biblikal.
theological_decisions:
- issue: Lakas ng pormulang pagtanggi na μὴ γένοιτο
  choice: 'Mariing pagtanggi sa naunang palagay: “Hinding-hindi!”'
  alternative: 'Mas pormal at mas malapit sa anyo: “Huwag nawang mangyari!”'
  rationale: Karaniwang pormula ito ni Pablo para lubusang itakwil ang isang konklusyon. Ang idyomatikong salin ay nagpapanatili sa diin nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Ugnayan ng ἐπεὶ sa retorikal na tanong
  choice: “Kung hindi” bilang pagpapakita ng kahihinatnan ng salungat na palagay
  alternative: “Sapagkat kung magkagayon” o “yamang”
  rationale: 'Pinananatili ng salin ang lohika ng pangangatwiran: kung hindi totoo ang mariing pagtanggi, magiging palaisipan kung paano hahatulan ng Diyos ang sanlibutan. Hindi nito binabago ang tanong tungo sa tahasang doktrinal na pahayag.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maikli at mariing “Hinding-hindi!” upang mapanatili ang puwersa ng pagtanggi, at “sanlibutan” bilang pamilyar na salitang biblikal na nauunawaan pa rin ng karaniwang mambabasa.
