base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: tl
  text: Sapagkat ipinapalagay namin na ang isang tao ay ipinapahayag na matuwid[a] sa pamamagitan ng pananampalataya, hiwalay sa mga gawa ng Kautusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinawawalang-sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: itinuturing namin
  rationale: Ipinapahayag ng pandiwa ang pinag-isipang paghatol o pasiya ni Pablo. Likas sa modernong Filipino ang “itinuturing namin” at hindi nito ginagawang mas tiyak kaysa sa Griyego kung ang diwa ay pagsusuri o konklusyon.
- source_word: γάρ
  choice: Sapagkat
  rationale: Ipinakikita ng pangatnig na nagbibigay ang talata ng batayan o paliwanag para sa naunang argumento.
- source_word: δικαιοῦσθαι
  choice: ay pinawawalang-sala
  rationale: 'Ang pasibong anyo ay may malinaw na hudisyal na diwa: ang tao ay itinuturing o ipinahahayag na matuwid, hindi sinasabing ginawa niyang matuwid ang sarili. Karaniwan at nauunawaan sa Filipino ang “pinawawalang-sala,” habang pinananatili sa talababa ang malapit na alternatibo.'
- source_word: πίστει
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinahihiwatig ng datibo ang paraan o kasangkapan. Pinananatili ng “pananampalataya” ang kinikilalang bokabularyong teolohikal nang hindi dinaragdagan ang kahulugan.
- source_word: ἄνθρωπον
  choice: ang isang tao
  rationale: Bagaman panlalaki ang anyong gramatikal, pangkalahatan ang tinutukoy rito; likas na naipapahayag ito sa Filipino ng “isang tao” nang walang pahiwatig na lalaki lamang.
- source_word: χωρὶς
  choice: hiwalay sa
  rationale: Tuwirang ipinahahayag nito ang pagbubukod o kawalan ng pagdepende sa mga gawa ng Kautusan.
- source_word: ἔργων νόμου
  choice: mga gawa ng Kautusan
  rationale: Pinananatili nito ang kilalang pariralang Paulino at ang tuwirang kaugnayan sa νόμος, nang hindi ito ipinapakahulugan lamang bilang mabubuting gawa o pagsisikap na maging moral.
theological_decisions:
- issue: Diwa ng δικαιοῦσθαι sa gamit ni Pablo
  choice: pinawawalang-sala
  alternative: ipinapahayag na matuwid
  rationale: Pinananatili ng pangunahing salin ang hudisyal na puwersa ng pandiwa sa natural na Filipino. Inilalagay sa talababa ang alternatibong mas tuwirang nagpapakita ng deklarasyong pagiging matuwid, upang hindi ikubli ang saklaw ng termino.
- issue: Pangkalahatang gamit ng ἄνθρωπον
  choice: isang tao
  alternative: isang lalaki
  rationale: Pangkalahatan ang reperensiya sa konteksto, kaya ang “isang tao” ang tumpak na salin at hindi ito nililimitahan sa kasariang lalaki.
- issue: Saklaw ng ἔργων νόμου
  choice: mga gawa ng Kautusan
  alternative: mga gawang hinihingi ng Kautusan
  rationale: Hindi tahasang nilulutas ng salin kung tumutukoy ang parirala sa lahat ng pagsunod sa Kautusan o sa ilang natatanging gawa nito; pinananatili ang tunay na lawak at tensiyon ng pariralang Griyego.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang malaking titik sa “Kautusan” bilang katawagan sa Kautusang Mosaic. Hindi na kailangan ang talababa tungkol sa kasarian sapagkat likas nang pangkalahatan sa Filipino ang “isang tao.”
