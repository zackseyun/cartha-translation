translation:
  language: tl
  text: Ang kanilang bibig ay punô ng sumpa at kapaitan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: kanilang
  rationale: Ang panghalip na paari ay likas na paraan sa modernong Tagalog upang ipahayag ang genitibong panghalip na nag-uugnay sa mga taong tinutukoy sa naunang konteksto.
- source_word: τὸ στόμα
  choice: bibig
  rationale: Tuwirang katumbas ito ng salitang Griyego, at pinananatili ang isahang anyo na ginagamit nang kolektibo.
- source_word: ἀρᾶς
  choice: sumpa
  rationale: Tumpak nitong ipinahahayag ang mapaminsalang pananalitang tinutukoy ng pangngalan nang hindi nililimitahan ang kahulugan sa isang pormal na panunumpa.
- source_word: πικρίας
  choice: kapaitan
  rationale: Pinananatili nito ang karaniwang leksikal at moral na puwersa ng salitang Griyego, kabilang ang diwa ng mapait o malupit na pananalita.
- source_word: γέμει
  choice: ay punô ng
  rationale: Likas at malinaw na katumbas ito ng pangkasalukuyang pandiwang nangangahulugang ‘punô’ o ‘hitik.’
