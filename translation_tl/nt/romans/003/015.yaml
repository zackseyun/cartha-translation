  yaml_path: translation/nt/romans/003/015.yaml
  text: Their feet are swift to shed blood,[a]
translation:
  language: tl
  text: Mabilis ang kanilang mga paa sa pagbububo ng dugo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Matalas ang kanilang mga paa upang magbuhos ng dugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: Mabilis
  rationale: Bagaman literal na “matalas,” ang salita ay naglalarawan dito ng mga paang handang kumilos agad sa karahasan; natural na ipinahahayag ito ng “mabilis” sa modernong Tagalog.
- source_word: οἱ πόδες
  choice: ang kanilang mga paa
  rationale: Pinananatili ang tuwirang larawang pangkatawan ng Griyego; isinama rito ang pagmamay-ari na ipinahahayag ng αὐτῶν.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na ipinahahayag sa Tagalog ang genitibong panghalip bilang pagmamay-ari kaugnay ng “mga paa.”
- source_word: ἐκχέαι
  choice: sa pagbububo
  rationale: Ang “pagbububo ng dugo” ay likas at malinaw na idyomang Tagalog para sa marahas na pagkitil ng buhay, habang nananatiling malapit sa literal na diwang “pagbuhos.”
- source_word: αἷμα
  choice: dugo
  rationale: Ito ang tuwiran at karaniwang katumbas sa Tagalog.
