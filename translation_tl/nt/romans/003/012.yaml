base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: tl
  text: Ang lahat ay lumihis; sama-sama silang naging walang pakinabang.[a] Walang gumagawa ng kabutihan,[b] wala kahit isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging walang kabuluhan” o “naging tiwali.”
    reason: lexical_alternative
  - marker: b
    text: O “gumagawa ng kagandahang-loob”; maaari ring dalhin ng salitang Griyego ang diwang “kabaitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Ang lahat
  rationale: Pinananatili ang pangkalahatang saklaw ng maramihan nang hindi nagdaragdag ng pangngalang wala sa Griyego.
- source_word: ἐξέκλιναν
  choice: ay lumihis
  rationale: Natural sa modernong Tagalog at malinaw na nagpapahiwatig ng pagtalikod sa tamang landas, kasama ang naganap na aspekto ng pandiwa.
- source_word: ἅμα
  choice: sama-sama
  rationale: 'Ipinahahayag ang kolektibong diwa: magkakasalo ang lahat sa kalagayang inilalarawan.'
- source_word: ἠχρεώθησαν
  choice: naging walang kabuluhan
  rationale: Pinananatili ang pasibo at resultang diwa at ang matinding negatibong pagtataya; inilalagay sa talababa ang mga alternatibong 'walang pakinabang' at 'tiwali.'
- source_word: ποιῶν
  choice: gumagawa
  rationale: Likas na anyong Tagalog na nagpapanatili sa patuloy o kinaugaliang diwa ng participle.
- source_word: χρηστότητα
  choice: kabutihan
  rationale: Tuwirang katumbas sa kontekstong moral, habang kinikilala sa talababa na maaari rin itong tumukoy sa kagandahang-loob.
- source_word: οὐκ ἔστιν
  choice: Walang
  rationale: Maikli, idiomatiko, at mariing nagpapahayag na walang sinumang umiiral na gumagawa nito.
- source_word: ἕως ἑνός
  choice: wala kahit isa
  rationale: Natural na Tagalog para sa idyomatikong pangwakas na pagdiriin na ni isang tao ay walang maibubukod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang maiikling sugnay upang mapanatili ang mariing ritmo at pangkalahatang saklaw ng orihinal. Itinama ang pagkakalapat ng mga marker upang ang talababa sa ἠχρεώθησαν ay nasa 'walang kabuluhan' at ang talababa sa χρηστότητα ay nasa 'kabutihan.'
