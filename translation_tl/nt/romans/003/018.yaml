  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: tl
  text: Walang takot sa Diyos sa harap ng kanilang mga mata.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Walang pagpipitagan sa Diyos sa harap ng kanilang mga mata.”
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Awit 36:1 (35:2 sa LXX).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Walang
  rationale: Likas at tuwirang anyong eksistensiyal sa Tagalog na nagpapanatili sa ganap na pagkakaila ng parirala.
- source_word: φόβος
  choice: pagkatakot
  rationale: Pinananatili ang pangunahing diwa ng salitang Griyego at ang matinding pananalita ng sipi; ang posibleng kahulugang paggalang ay inilagay sa talababa.
- source_word: θεοῦ
  choice: sa Diyos
  rationale: Sa natural na Tagalog, ang Diyos ang tuwirang layon ng pagkatakot; mas malinaw ito kaysa sa literal ngunit di-likas na anyong “ng Diyos.”
- source_word: ἀπέναντι
  choice: sa harap ng
  rationale: Pinananatili ang spatial na talinghaga ng isang bagay na nasa harap ng paningin.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: kanilang mga mata
  rationale: Pinananatili ang kongkretong larawang “mga mata” sa halip na gawing abstraktong “paningin.”
theological_decisions:
- issue: Saklaw ng φόβος θεοῦ
  choice: pagkatakot sa Diyos
  alternative: paggalang sa Diyos
  rationale: Hindi nilulutas sa pangunahing teksto ang saklaw ng φόβος bilang takot, pagpipitagan, o magalang na pagkilala; pinili ang mas tuwirang katumbas at itinabi ang interpretatibong alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang biblikal na larawang “sa harap ng kanilang mga mata” upang hindi mawala ang talinghaga ng moral na pananaw at oryentasyon.
