  to: At bakit hindi natin sabihin—gaya ng maling paratang laban sa amin at gaya ng sinasabi ng ilan na sinasabi raw namin—“Gumawa tayo ng masama upang dumating ang mabuti”? Makatarungan ang hatol sa kanila.[a]
  rationale: Pinalitan ang hindi idiomatikong “paninirang ibinibintang sa amin” ng “maling paratang laban sa amin.” Pinananatili nito ang kontekstuwal na diwa ng pandiwang Griyego—mapanirang maling paglalarawan ng sinasabi ni Pablo—habang nililinaw ang sintaksis. Walang binago sa kahulugan ng talata o sa talababa.
