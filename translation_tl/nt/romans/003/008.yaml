id: ROM.3.8
reference: Romans 3:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: tl
  text: At bakit hindi natin sabihin—gaya ng maling paratang laban sa amin at gaya ng sinasabi ng ilan na sinasabi raw namin—“Gumawa tayo ng masama upang dumating ang mabuti”? Makatarungan ang hatol sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kanila” ay tumutukoy sa mga gumagawa o sumasang-ayon sa paratang at pangangatwirang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: paninirang ibinibintang sa amin
  rationale: Ipinahahayag nito ang mapanirang maling paglalarawan sa sinasabi ni Pablo, hindi ang tuwirang pamumusong laban sa Diyos.
- source_word: φασίν τινες
  choice: sinasabi ng ilan
  rationale: Natural na salin ng iniulat na paratang; ipinakikita ng konteksto ang mapanlabang himig nang hindi ito labis na ipinapasok sa mismong pandiwa.
- source_word: λέγειν
  choice: sinasabi raw namin
  rationale: Pinananatili ang payak na kahulugang “sabihin”; ang “raw” ay malinaw na naghuhudyat na iniulat at hindi kinikilalang tunay ang paratang.
- source_word: Ποιήσωμεν
  choice: Gumawa tayo
  rationale: Tumpak at natural na hortatoryong anyo para sa unang panauhang pangmaramihang aorist subjunctive.
- source_word: τὰ κακὰ
  choice: masama
  rationale: Natural na pangkalahatang katumbas ng substantibong pang-uri, nang hindi nililimitahan sa ilang partikular na masasamang gawa.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: upang dumating ang mabuti
  rationale: Pinananatili ang layunin o bunga ng ἵνα at ang pagtutumbas ng “masama” at “mabuti.”
- source_word: κρίμα
  choice: hatol
  rationale: Karaniwang salitang Filipino na angkop sa hudisyal na pasya; ipinakikita ng kasunod na pang-uri na salungat at maparusang hatol ito.
- source_word: ἔνδικόν
  choice: makatarungan
  rationale: Pinananatili ang moral at hudisyal na diwa ng pagiging matuwid o nararapat.
- source_word: καὶ μὴ
  choice: At bakit hindi natin sabihin
  rationale: Ang Griyego ay eliptiko at nagpapatuloy sa tanong ng naunang talata; ang pagdaragdag ng “bakit” ay likas na nagpapalinaw sa ipinahiwatig na tanong.
theological_decisions:
- issue: Tinutukoy ng ὧν sa “ὧν τὸ κρίμα”
  choice: sa kanila, na tumutukoy sa mga nagbibintang o sumasang-ayon sa mapanirang pangangatwirang ito
  alternative: sa mga gumagawa ng masama upang magkaroon ng mabuti
  rationale: Ang pinakamalapit na malinaw na pangmaramihang tinutukoy ay ang “ilan” na nagsasabing ganito raw ang itinuturo ni Pablo. Gayunman, maaaring marinig din ang hatol bilang sumasaklaw sa mga yumayakap sa gayong pangangatwiran, kaya nililinaw ito sa talababa.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na daloy. Pinanatili ang eliptikong ugnayan sa naunang talata sa pamamagitan ng natural na “At bakit hindi natin sabihin,” at iniwasan ang denominasyonal o labis na interpretatibong pananalita.
