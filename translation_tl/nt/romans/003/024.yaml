base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: tl
  text: at sila ay pinawawalang-sala[a] bilang kaloob sa pamamagitan ng kanyang biyaya, sa pamamagitan ng pagtubos na nasa Mesiyas na si Jesus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaaring matuwid.”
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “Cristo Jesus.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: at sila ay pinawawalang-sala
  rationale: Ang pangkasalukuyang balintiyak na pandiwaring Griyego ay nakaugnay sa naunang pangungusap. Ang “pinawawalang-sala” ay likas at malinaw na salin sa modernong Filipino at pinananatili ang legal na diwa nang hindi ipinapaliwanag nang labis ang mekanismo.
- source_word: δωρεὰν
  choice: bilang kaloob
  rationale: Ipinakikita ng parirala na ang pagpapawalang-sala ay kusang ibinibigay at hindi pinaghihirapan o binabayaran; mas malinaw ito sa Filipino kaysa sa posibleng malabong “nang libre.”
- source_word: τῇ αὐτοῦ χάριτι
  choice: sa pamamagitan ng kanyang biyaya
  rationale: Pinananatili ng “biyaya” ang matatag na terminong Paulino para sa di-karapat-dapat na pabor at pagkilos ng Diyos, samantalang malinaw na ipinahahayag ng “sa pamamagitan ng” ang gamit ng datibo.
- source_word: ἀπολυτρώσεως
  choice: pagtubos
  rationale: Ang “pagtubos” ay maikli, pamilyar, at nagpapanatili sa diwa ng paglaya na may halagang ibinayad.
- source_word: Χριστῷ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” sa kontekstong ito, sa halip na basta itransliterang “Cristo.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: na nasa Mesiyas na si Jesus
  rationale: Pinananatili nito ang kaugnayan ng pariralang ἐν Χριστῷ Ἰησοῦ sa “pagtubos” at ang sadyang maluwag na lokatibo o relasyonal na diwa ng ἐν nang hindi ito ginagawang mas tiyak kaysa sa Griyego.
theological_decisions:
- issue: Wika ng pagpapawalang-sala kay Pablo
  choice: pinawawalang-sala
  alternative: inaaring matuwid
  rationale: Ang pangunahing salin ay nagpapanatili sa legal na puwersa ng δικαιόω sa karaniwang modernong Filipino. Inilalagay sa talababa ang lehitimong alternatibo upang hindi ipilit na ang salita ay tumutukoy lamang sa isang pormulang teolohikal.
- issue: Kahulugan ng ἐν Χριστῷ Ἰησοῦ
  choice: pagtubos na nasa Mesiyas na si Jesus
  alternative: pagtubos na matatagpuan sa Mesiyas na si Jesus
  rationale: Hindi tahasang nilulutas ng Griyego kung ang ἐν ay dapat unawain bilang lokasyon, pakikipag-ugnayan, o larangan. Pinananatili ng maikling salin ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Pinananatili ang ugnayang sintaktiko sa naunang talata sa pamamagitan ng “at sila ay,” at iniiwasan ang sobrang teknikal o denominasyonal na pananalita.
