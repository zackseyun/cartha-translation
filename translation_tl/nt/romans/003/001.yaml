id: ROM.3.1
reference: Romans 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: tl
  text: Kung gayon, ano ang kalamangan ng Judio? O ano ang pakinabang ng pagtutuli?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ano ang halaga ng pagtutuli?”
    reason: lexical_alternative
  - marker: b
    text: Ang “Judio” ay kinatawang isahan; tumutukoy ito sa taong Judio bilang isang pangkat o uri.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Kung gayon, ano
  rationale: Pinananatili ang inferensiyal na paglipat at ang anyo ng retorikal na tanong sa natural na Tagalog.
- source_word: τὸ περισσὸν
  choice: ang kalamangan
  rationale: Sa kontekstong ito, tumutukoy ito sa natatanging bentaha o kalamangan, nang hindi nagpapahiwatig ng likas na kahigitan ng isang lahi.
- source_word: τοῦ Ἰουδαίου
  choice: ng Judio
  rationale: Pinananatili ang pangkalahatang kinatawang isahan ng Griyego; sa Tagalog, likas na mababasa ang “Judio” bilang taong kabilang sa mga Judio.
- source_word: ἢ τίς
  choice: O ano
  rationale: Pinananatili ang paralelismo ng ikalawang retorikal na tanong.
- source_word: ἡ ὠφέλεια
  choice: ang pakinabang
  rationale: Malinaw at kasalukuyang salita ito para sa kapakinabangan o halaga, at bahagyang naiiba sa “kalamangan.”
- source_word: τῆς περιτομῆς
  choice: ng pagtutuli
  rationale: Tuwirang isinasalin ang ritwal na tinutukoy ng teksto bilang tanda ng tipan at pagkakakilanlang Judio.
theological_decisions:
- issue: Kung pananatilihin ang kinatawang isahan sa Ἰουδαίου o gagawing maramihan
  choice: ng Judio
  alternative: ng mga Judio / ng isang taong Judio
  rationale: Ang Griyego ay gumagamit ng isahang anyo bilang kinatawan ng isang uri ng tao. Pinananatili ito upang huwag palawakin o baguhin ang retorikal na anyo ni Pablo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “Kung gayon” para sa lohikal na paglipat, at pinanatili ang dalawang magkatulad na retorikal na tanong.
