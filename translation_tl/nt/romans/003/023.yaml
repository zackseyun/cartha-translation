  text: Sapagkat ang lahat ay nagkasala at nagkukulang sa kaluwalhatian ng Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi nakaabot sa kaluwalhatian ng Diyos” o “kapos sa kaluwalhatian ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang “kaluwalhatian ng Diyos” ay maaaring tumukoy sa sariling kaluwalhatian ng Diyos, sa kaluwalhatiang nilayong ipakita ng mga tao, o sa kaluwalhatiang ipinagkakaloob ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: ang lahat
  rationale: Pinananatili nito ang saklaw na sumasaklaw sa lahat ng tao ayon sa konteksto, nang hindi nagdaragdag ng salitang wala sa Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Likas nitong ipinahahayag ang paliwanag na ugnayan ng talata sa naunang argumento ni Pablo.
- source_word: ἥμαρτον
  choice: nagkasala
  rationale: Ang aspektong aorist ay nagbubuod sa katotohanan ng pagkakasala ng lahat; natural at tuwiran sa modernong Tagalog ang “nagkasala.”
- source_word: ὑστεροῦνται
  choice: hindi nakaabot
  rationale: Ipinahahayag nito ang patuloy na kakulangan o pagkabigo na maabot ang tinutukoy, habang nananatiling natural sa Tagalog.
- source_word: δόξης
  choice: kaluwalhatian
  rationale: Ito ang malinaw at kinikilalang katumbas ng δόξα na nagpapanatili sa teolohikal na lalim ng parirala.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili ang anyong henitibo ng Griyego nang hindi agad nagpapasya kung ito ay sariling kaluwalhatian ng Diyos, kaluwalhatiang nagmumula sa kanya, o kaluwalhatiang nilalayong ibahagi o ipakita ng tao.
theological_decisions:
- issue: Kahulugan ng “kaluwalhatian ng Diyos”
  choice: Pinanatili ang payak at bukas na pariralang “kaluwalhatian ng Diyos.”
  alternative: “kaluwalhatiang mula sa Diyos,” “maluwalhating pamantayan ng Diyos,” o “pakikibahagi sa kaluwalhatian ng Diyos”
  rationale: Maikli at may tunay na saklaw ng kahulugan ang pariralang Griyego. Hindi dapat ipasok sa pangunahing teksto ang iisang pagpapakahulugang mag-aalis sa teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “hindi nakaabot” bilang likas na pagpapahayag ng patuloy na kakulangan, at pinanatili sa mga talababa ang mahahalagang alternatibong leksikal at teolohikal.
