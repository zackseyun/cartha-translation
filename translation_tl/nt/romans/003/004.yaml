  to: 'Hinding-hindi! Sa halip, hayaang mapatunayang totoo ang Diyos at sinungaling ang bawat tao, gaya ng nasusulat:


    “Upang mapatunayang nasa tama ka sa iyong mga salita[a]


    at manaig ka kapag hinatulan ka.”[b]'
  rationale: Kinailangan ang maliit ngunit mahalagang pagbabago sa “tapat” tungo sa “totoo,” sapagkat ang ἀληθής ay sadyang inihahanay laban sa ψεύστης. Pinanatili ang “hayaang mapatunayang” upang ihatid ang pautos na puwersa at ang diwang ang Diyos ay nahahayag na totoo, hindi nagsisimulang maging totoo. Ang sipi at mga talababa ay pinanatili ang pasibong pagbasa ng Roma at ang alternatibong aktibong pagbasa na kaugnay ng Hebreo ng Awit.
