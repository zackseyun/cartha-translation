  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: tl
  text: 'Hinding-hindi! Sa halip, hayaang mapatunayang totoo ang Diyos at sinungaling ang bawat tao, gaya ng nasusulat:


    “Upang mapatunayang nasa tama ka sa iyong mga salita[a]


    at manaig ka kapag hinatulan ka.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mapatunayang matuwid ka sa iyong mga salita” o “mapawalang-sala ka sa iyong mga salita.”
    reason: lexical_alternative
  - marker: b
    text: O, “kapag humatol ka.” Mas tuwirang sinasalamin nito ang Hebreong pananalita sa Awit 51:4, samantalang ang Griyegong pananalita sa Roma ay likas na mababasa bilang “kapag hinatulan ka.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Likas at mariing pagtanggi sa modernong Tagalog na naghahatid ng lakas ng idyomatikong Griyego.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: hayaang mapatunayang tapat ang Diyos
  rationale: Pinananatili ang pautos na diwa ng γινέσθω at nililinaw na ang katapatan ng Diyos ay napatutunayan, hindi nagsisimulang umiral.
- source_word: πᾶς ... ἄνθρωπος
  choice: ang bawat tao
  rationale: Inihahatid ang pangkalahatan at distributibong saklaw nang walang pagtukoy sa kasarian.
- source_word: ψεύστης
  choice: sinungaling
  rationale: Direkta at karaniwang katumbas ng pangngalang tumutukoy sa taong nagsisinungaling o hindi mapananaligan.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Dignified at pamilyar na pormula ng pagsipi sa Kasulatan, na angkop sa perpektong aspekto ng Griyego.
- source_word: δικαιωθῇς
  choice: mapatunayang matuwid ka
  rationale: 'Inihahayag ang forensic na diwa: hindi nagiging matuwid ang Diyos kundi nahahayag o napatutunayang nasa tama.'
- source_word: ἐν τοῖς λόγοις σου
  choice: sa iyong mga salita
  rationale: Tuwirang salin na angkop sa konteksto ng sipi mula sa Awit.
- source_word: νικήσεις
  choice: manaig ka
  rationale: Naghahatid ng tagumpay sa kontekstong hudisyal nang hindi nagkakaroon ng labis na militar na himig.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: kapag hinatulan ka
  rationale: Sinusunod ang pinakanatural na pasibong pagbasa sa Griyego ng Roma habang inilalagay sa talababa ang alternatibong aktibong pagbasa mula sa Hebreo ng Awit 51:4.
theological_decisions:
- issue: Forensic na diwa ng δικαιωθῇς kapag tumutukoy sa Diyos
  choice: mapatunayang matuwid ka
  alternative: ariing matuwid ka; mapatunayang nasa tama ka
  rationale: Hindi ipinahihiwatig na nagiging matuwid ang Diyos; sa halip, nahahayag at pinagtitibay ang kaniyang pagiging nasa tama sa kaniyang mga salita.
- issue: Tinig ng κρίνεσθαί sa sipi ng Awit
  choice: kapag hinatulan ka
  alternative: kapag humatol ka
  rationale: Ang anyong Griyego sa Roma ay likas na binabasang pasibo, ngunit ang Hebreo ng Awit 51:4 ay mas tuwirang sumusuporta sa aktibong pagbasa; pinananatili ang pagkakaibang ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na mariin ngunit marangal. Ginamit ang “Hinding-hindi!” bilang natural na pagtanggi at ang “mapatunayang matuwid” upang maipahayag ang hudisyal na diwa nang hindi ipinahihiwatig na nagbabago ang likas na katuwiran ng Diyos. Lahat ng marker ng talababa ay nasa pangunahing teksto.
