base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: tl
  text: 'Gaya ng nasusulat: “Walang matuwid, kahit isa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Gaya ng
  rationale: Likas na panimula sa Tagalog para sa paghahambing at sa pormulang nagpapakilala ng sipi sa Kasulatan.
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwang pormulang biblikal sa Tagalog na nagpapahayag na ang isinulat ay nananatiling may bisa, alinsunod sa Griyegong perfect passive.
- source_word: ὅτι
  choice: ':'
  rationale: Mas natural sa makabagong Tagalog na ipakilala ang tuwirang sipi sa pamamagitan ng tutuldok kaysa isalin nang tahasan bilang “na.”
- source_word: Οὐκ ἔστιν
  choice: Walang
  rationale: Maikli at likas na paraan sa Tagalog upang ipahayag ang pag-iral na may ganap na pagtanggi.
- source_word: δίκαιος
  choice: matuwid
  rationale: Pinananatili ang moral at teolohikal na saklaw ng δίκαιος sa konteksto ni Pablo nang hindi nililimitahan sa isang partikular na paliwanag.
- source_word: οὐδὲ εἷς
  choice: kahit isa
  rationale: Malinaw na naihahatid ang mariing diin ng Griyego na walang kahit isang eksepsiyon.
theological_decisions:
- issue: Kung ilalahad ang pahayag bilang tuwirang paglalarawan sa bawat tao o bilang pangkalahatang pahayag na walang matuwid.
  choice: Walang matuwid, kahit isa
  alternative: Walang sinumang matuwid
  rationale: Ang pinili ay malapit sa maikli, ganap, at mariing anyo ng Griyego. Hindi nito dinaragdagan ang “tao” o ibang pantukoy, at pinananatili nito ang pangkalahatang saklaw at retorikal na diin ng sipi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pamilyar na pormulang “Gaya ng nasusulat” at ang payak ngunit matibay na “Walang matuwid, kahit isa.”
