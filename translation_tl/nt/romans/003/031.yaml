id: ROM.3.31
reference: Romans 3:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: tl
  text: Kung gayon, pinawawalang-bisa ba natin ang Kautusan sa pamamagitan ng pananampalataya? Hinding-hindi! Sa halip, pinagtitibay natin ang Kautusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinatatag natin ang Kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: ang Kautusan
  rationale: Bagaman walang artikulo sa Griyego, tiyak sa daloy ng argumento ni Pablo ang tinutukoy na Kautusan o Torah; ang malaking titik ay tumutulong na ipakita ang tiyak na reperensiya nang hindi nagpapaliwanag nang labis.
- source_word: οὖν
  choice: kung gayon
  rationale: Natural itong nagpapahayag ng retorikal na kongklusyon mula sa naunang argumento.
- source_word: καταργοῦμεν
  choice: pinawawalang-bisa
  rationale: Ipinahahayag nito ang paggawa sa Kautusan na walang bisa o bisaing lakas, at malinaw na kasalungat ng pinagtitibay.
- source_word: διὰ τῆς πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Pinananatili nito ang instrumental na diwa ng διά na may genitive at ang karaniwang salin sa πίστις bilang pananampalataya.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Malakas at likas na pagtanggi ito sa modernong Filipino, katumbas ng mariing Griyegong idyoma.
- source_word: ἀλλὰ
  choice: Sa halip
  rationale: Malinaw nitong ipinakikita ang matinding pagwawasto at pagsalungat sa naunang tanong.
- source_word: ἱστάνομεν
  choice: pinagtitibay natin
  rationale: Saklaw nito ang diwang itinatatag, pinananatiling matatag, o kinikilalang may bisa ang Kautusan, at natural itong kaagapay ng pinawawalang-bisa.
theological_decisions:
- issue: Ugnayan ng pananampalataya at ng Kautusan
  choice: pinagtitibay natin ang Kautusan
  alternative: itinatatag natin ang Kautusan
  rationale: Maaaring mangahulugan ang ἱστάνομεν na 'itinatatag,' ngunit maaaring ipahiwatig niyon sa Filipino na noon lamang nililikha o sinisimulan ang Kautusan. Ang 'pinagtitibay' ay nagpapanatili sa punto ni Pablo na hindi nito pinawawalang-bisa ang Kautusan, nang hindi nag-aangkat ng isang partikular na sistemang teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa karaniwang mambabasa. Ginamit ang 'Kautusan' bilang tiyak na katawagan sa Torah sa argumento ni Pablo; pinanatili ang maikli at mariing anyo ng retorikal na tanong at sagot.
