  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: tl
  text: At ang katuwiran[a] ng Diyos sa pamamagitan ng pananampalataya kay Jesus na Mesiyas[b] ay para sa lahat ng sumasampalataya, sapagkat walang pagkakaiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng katapatan ni Jesus na Mesiyas.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Ang “katuwiran” ang likas at malawak na katumbas sa kontekstong Paulino; maaari nitong saklawin ang matuwid na katayuan at ang matuwid na pagkilos ng Diyos. Inilagay sa talababa ang “katarungan” bilang tunay na alternatibo.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang pinananatili nito ang genitibong Griyego at hindi nililimitahan ang parirala sa interpretasyong “mula sa Diyos.”
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Pinananatili nito ang karaniwang diwa ng πίστις at ang instrumental na lakas ng διά.
- source_word: Ἰησοῦ Χριστοῦ
  choice: kay Jesus na Mesiyas
  rationale: Ipinapahayag ng “Mesiyas” ang titulong Χριστός sa natural na modernong Tagalog; hinihingi ng pang-ukol na “kay” ang pagbasa sa genitibo bilang pananampalatayang nakatuon kay Jesus.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: ay para sa lahat ng sumasampalataya
  rationale: Natural sa Tagalog at malinaw na pinananatili ang saklaw sa lahat ng nananampalataya.
- source_word: διαστολή
  choice: pagkakaiba
  rationale: Karaniwan at malinaw itong salita para sa kawalan ng pagkakaiba o pagtatangi sa kontekstong ito.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: pananampalataya kay Jesus na Mesiyas
  alternative: katapatan ni Jesus na Mesiyas
  rationale: Tunay na pinagtatalunan kung obhetibo o subhetibo ang genitibo. Ginamit sa pangunahing teksto ang mas karaniwang pagbasa na pananampalataya kay Jesus, ngunit pinanatili sa talababa ang pagbasa tungkol sa katapatan ni Jesus.
- issue: δικαιοσύνη θεοῦ
  choice: katuwiran ng Diyos
  alternative: katarungan ng Diyos
  rationale: Hindi nilulutas nang labis ng “katuwiran ng Diyos” kung ito ay tumutukoy sa katangian o pagkilos ng Diyos, o sa matuwid na katayuang kaloob niya. Pinanatili ang “katarungan” bilang alternatibong leksikal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Jesus na Mesiyas” upang malinaw na maipakita ang Χριστός bilang titulo, at “walang pagkakaiba” bilang natural na katumbas ng οὐ γάρ ἐστιν διαστολή.
