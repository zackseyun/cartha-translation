  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: tl
  text: Napakalaki ng pakinabang sa lahat ng paraan. Sapagkat una sa lahat, ipinagkatiwala sa kanila ang mga pahayag[a] ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga salita ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: Napakalaki
  rationale: Ginagamit itong pang-abay bilang sagot sa ipinahiwatig na tanong tungkol sa pakinabang; natural na ipinahahayag ng “Napakalaki” ang malaking antas nito.
- source_word: κατὰ πάντα τρόπον
  choice: sa lahat ng paraan
  rationale: Pinananatili ng parirala ang malawak at sumasaklaw na diwa ng idyomang Griyego.
- source_word: πρῶτον μὲν γὰρ
  choice: Sapagkat una sa lahat
  rationale: Isinasalin ng “Sapagkat” ang γὰρ at ipinakikita ng “una sa lahat” na ito ang unang binanggit na pakinabang, kahit walang kasunod na tahasang ikalawang bilang sa talata.
- source_word: ἐπιστεύθησαν
  choice: ipinagkatiwala sa kanila
  rationale: Ang pasibong anyo rito ay tumutukoy sa pagkakatiwala ng isang bagay sa mga tao, hindi sa kanilang paniniwala.
- source_word: τὰ λόγια
  choice: ang mga pahayag
  rationale: Ang λόγια ay mga pahayag na nagmula sa Diyos. Ang “mga pahayag” ay malinaw at marangal sa makabagong Tagalog nang hindi nililimitahan ang kahulugan sa karaniwang mga salita lamang.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Direktang pinananatili ang genitibong maaaring magpahiwatig ng pagmamay-ari o pinagmulan.
theological_decisions:
- issue: Sino ang tinutukoy ng pasibong ἐπιστεύθησαν
  choice: ipinagkatiwala sa kanila
  alternative: sila ang pinagkatiwalaan
  rationale: Pinananatili ang sanggunian sa mga Judio mula sa naunang konteksto at ang diwa ng pananagutang kaakibat ng ipinagkatiwalang kapahayagan, nang hindi nagdaragdag ng tiyak na doktrina tungkol sa paraan ng pangangalaga nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang maigsi at mariing sagot ni Pablo at ang ugnayang ipinahihiwatig ng “Sapagkat.”
