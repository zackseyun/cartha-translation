  source_fidelity: Ang draft ay wastong kumakatawan sa πολὺ κατὰ πάντα τρόπον bilang malaking lawak ng pakinabang at sa ἐπιστεύθησαν bilang pasibong pagkakatiwala. Ang “mga pahayag ng Diyos” ay isang angkop na salin ng τὰ λόγια τοῦ θεοῦ. Gayunman, mas malinaw na ilahad sa Tagalog ang ipinahiwatig na ‘pakinabang’ mula sa tanong sa naunang talata.
  naturalness: Ang “Napakalaki sa lahat ng paraan” ay nauunawaan ngunit bahagyang bitin at maaari ring magpahiwatig ng pisikal na laki. Mas natural sa modernong Tagalog ang “Napakalaki ng pakinabang sa lahat ng paraan.” Ang natitirang pangungusap ay malinaw at angkop sa marangal na pampublikong pagbasa.
  terminology: Ang “ipinagkatiwala sa kanila” ay tumpak para sa ἐπιστεύθησαν at hindi nagmumungkahing ‘sumampalataya sila.’ Ang “mga pahayag ng Diyos” ay pinananatili para sa λόγια. Ang alternatibong “mga salita ng Diyos” ay katanggap-tanggap, ngunit dapat nakatali ang panandang-paanan sa “mga pahayag,” hindi sa “Diyos.”
