  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: tl
  text: Sapagkat walang sinuman ang aariing matuwid sa harap niya sa pamamagitan ng mga gawa ng Kautusan, sapagkat sa pamamagitan ng Kautusan ay nagkakaroon ng pagkakilala sa kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: sa pamamagitan ng mga gawa ng Kautusan
  rationale: Ipinahahayag ang instrumental na diwa ng ἐξ sa konteksto at pinananatili ang ugnayan ng mga gawa sa Kautusan.
- source_word: οὐ δικαιωθήσεται
  choice: walang ... ituturing na matuwid
  rationale: Natural sa modernong Tagalog at pinananatili ang pasibong, hudisyal na diwa ng pandiwa nang hindi ipinapalagay na ang tao ay ginagawang likas na matuwid.
- source_word: πᾶσα σὰρξ
  choice: walang taong
  rationale: Ang idyomang Griyego ay tumutukoy sa buong sangkatauhan; mas malinaw at natural ito kaysa literal na “walang laman,” na madaling mapagkamalan sa Tagalog.
- source_word: ἐνώπιον αὐτοῦ
  choice: sa harap niya
  rationale: Pinananatili ang larawan ng paghatol o pagtayo sa presensiya ng Diyos; ang tinutukoy ng panghalip ay malinaw mula sa konteksto.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: pagkakilala sa kasalanan
  rationale: Pinananatili ang diwa ng malinaw o ganap na pagkabatid sa kasalanan, hindi lamang pangkalahatang impormasyon tungkol dito.
theological_decisions:
- issue: Saklaw ng πᾶσα σὰρξ
  choice: walang taong
  alternative: walang sinumang laman
  rationale: Ipinakikita ang pangkalahatang saklaw sa lahat ng tao nang hindi nagdadala ng maling literal na kahulugan sa Tagalog.
- issue: Kahulugan ng δικαιόω
  choice: ituturing na matuwid
  alternative: aariing matuwid / gagawing matuwid
  rationale: Ang parirala ay angkop sa kontekstong hudisyal ng “sa harap niya” at umiiwas sa tahimik na paglutas sa mas malawak na debateng teolohikal.
- issue: Tungkulin ng Kautusan
  choice: sa pamamagitan ng Kautusan ay dumarating ang pagkakilala sa kasalanan
  alternative: ipinakikilala ng Kautusan ang kasalanan
  rationale: Malapit ito sa kayarian ng Griyego at hindi lumalampas sa pahayag na ang Kautusan ang paraan ng pagkakilala sa kasalanan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang malaking titik sa “Kautusan” bilang tiyak na pagtukoy sa kautusan ng Diyos sa konteksto, hindi bilang denominasyonal na termino.
