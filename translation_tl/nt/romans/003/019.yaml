id: ROM.3.19
reference: Romans 3:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: tl
  text: Alam natin na anumang sinasabi ng Kautusan ay sinasabi nito sa mga sakop ng Kautusan[a], upang matikom ang bawat bibig[b] at maging mananagot sa Diyos ang buong sanlibutan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa mga nasa Kautusan.”
    reason: lexical_alternative
  - marker: b
    text: O “mapatahimik ang bawat bibig.”
    reason: lexical_alternative
  - marker: c
    text: O “mapasailalim sa pananagutan,” “managot sa paghatol,” o “mahatulang nagkasala” sa harap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Alam natin
  rationale: Inihahayag nito ang kaalamang pinagsasaluhan ng manunulat at ng mga mambabasa. Hindi ginawang tahasang panandang-panahon ang δέ; likas na naipahihiwatig ng daloy ng pangungusap ang bahagyang paglipat ng kaisipan.
- source_word: ὁ νόμος
  choice: ang Kautusan
  rationale: Pinananatili ang pagtukoy sa kinikilalang kapahayagan at awtoridad ng Kautusan sa konteksto ni Pablo, nang hindi ito nililimitahan nang higit sa sinasabi ng Griyego.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: sa mga sakop ng Kautusan
  rationale: Ang literal na anyo ay “sa mga nasa Kautusan,” ngunit ang “sakop ng Kautusan” ay mas likas sa Filipino at malinaw na nagpapahiwatig ng mga nasa ilalim ng nasasakupan o kapangyarihan nito.
- source_word: λέγει … λαλεῖ
  choice: sinasabi … sinasabi nito
  rationale: Bagaman magkaiba ang dalawang pandiwa sa Griyego, kapwa likas na isinasalin bilang “sinasabi” sa Filipino; nilinaw ng “nito” na ang Kautusan ang nagsasalita.
- source_word: ἵνα
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin o ibinubungang pakay ng pagsasalita ng Kautusan.
- source_word: πᾶν στόμα φραγῇ
  choice: matikom ang bawat bibig
  rationale: Pinananatili ang kongkretong larawang legal ng pagsasara ng bibig, samakatuwid ay ang pagkawala ng maihaharap na pagtatanggol.
- source_word: ὑπόδικος γένηται
  choice: maging mananagot
  rationale: Pinananatili ng “maging” ang diwa ng γένηται, at ng “mananagot” ang legal na lakas ng ὑπόδικος nang hindi agad pinatitindi tungo sa tahasang “mahatulang nagkasala.”
- source_word: πᾶς ὁ κόσμος
  choice: ang buong sanlibutan
  rationale: Ipinapahayag ang malawak at pangkalahatang saklaw ng sangkatauhan sa ilalim ng pananagutan sa Diyos.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Likas na katambal ng “mananagot” sa Filipino at tapat sa datibong nagpapakita kung kanino nakatuon ang pananagutan.
theological_decisions:
- issue: Ang legal na diwa ng ὑπόδικος kaugnay ng paghatol ng Diyos
  choice: maging mananagot sa Diyos
  alternative: mahatulang nagkasala sa harap ng Diyos; mapasailalim sa hatol ng Diyos
  rationale: Inilalarawan ng salita ang kalagayan ng buong sanlibutan sa ilalim ng hukuman ng Diyos. Pinananatili ng “mananagot” ang legal at teolohikal na bigat nang hindi ipinapalagay na ang mismong pang-uri ay tahasang nagpapahayag na naipataw na ang hatol na pagkakasala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kautusan” bilang pamilyar na katawagang biblikal, “matikom ang bawat bibig” upang mapanatili ang matinding metapora, at “mananagot” upang maihatid ang legal na diwa nang hindi nilulutas ang saklaw ng ὑπόδικος nang higit sa orihinal.
