  source_fidelity: 'Tapat ang salin sa daloy at saklaw ng Griyego: ang sinasabi ng Kautusan ay nakatuon sa mga nasa saklaw nito, upang mapatahimik ang bawat bibig at ang buong sanlibutan ay maging mananagot sa Diyos. Naingatan ang layuning ipinahihiwatig ng ἵνα at ang pagiging ingressive ng γένηται sa “maging.”'
