  source_fidelity: 'Tumpak na naipapahayag ng salin ang tatlong magkakasunod na retorikal na yunit sa Griyego: ang pagiging Diyos ng mga Judio lamang, ang tanong na umaasa ng oo hinggil sa mga Hentil, at ang mariing pagsang-ayon. Napananatili ang pag-uulit at inklusibong diin ng καί sa “din.”'
