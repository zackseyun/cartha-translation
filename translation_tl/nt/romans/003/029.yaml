id: ROM.3.29
reference: Romans 3:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: tl
  text: O ang Diyos ba ay Diyos lamang ng mga Judio? Hindi ba’t Diyos din siya ng mga Hentil[a]? Oo, ng mga Hentil din.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa,” bilang mas literal na salin ng ἐθνῶν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Ipinakikilala nito ang kasunod na retorikal na alternatibo sa pangangatwiran ni Pablo; natural at tuwiran ang “O” sa Filipino.
- source_word: Ἰουδαίων
  choice: ng mga Judio
  rationale: Ang anyong henitibo ay nagpapahayag ng kaugnayan sa Diyos; malinaw at natural sa Filipino ang “Diyos … ng mga Judio.”
- source_word: ὁ θεὸς / θεὸς
  choice: ang Diyos / Diyos
  rationale: Karaniwang salin ito ng θεός. Inulit ang “Diyos” sa ikalawang tanong upang maging malinaw at natural ang ipinahihiwatig na panaguri sa Griyego.
- source_word: μόνον
  choice: lamang
  rationale: Tuwirang pinananatili nito ang pagbubukod na ipinahahayag ng salita at ang diin ng retorikal na tanong.
- source_word: οὐχὶ
  choice: Hindi ba’t
  rationale: Ang οὐχί ay nagpapakilala ng tanong na umaasang sang-ayon ang sagot; likas sa Filipino ang “Hindi ba’t” para sa gayong puwersa.
- source_word: ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa tahasang paghahambing sa mga Judio, tumutukoy ito sa mga taong hindi Judio. Mas tiyak dito ang “mga Hentil” kaysa “mga bansa,” habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: ναὶ
  choice: Oo
  rationale: Maikli at tuwirang sagot ito sa retorikal na tanong at katumbas ng malinaw na pagsang-ayon sa Griyego.
- source_word: καὶ
  choice: din
  rationale: Idinaragdag nito ang mga Hentil sa mga Judio; natural na ipinahahayag ng “din” ang inklusibong diing iyon sa Filipino.
theological_decisions:
- issue: Kung ang ἐθνῶν ay isasaling “mga Hentil” o “mga bansa”
  choice: mga Hentil
  alternative: mga bansa
  rationale: Dahil tahasang inihahambing sa talata ang mga Judio at ang ἔθνη, ang tinutukoy ay mga taong hindi Judio, hindi pangunahin ang mga bansang pampolitika. Pinananatili ng “mga Hentil” ang argumento ni Pablo na ang iisang Diyos ay Diyos ng kapwa Judio at hindi Judio, habang hindi ikinukubli ang literal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang magkatugmang mga retorikal na tanong at ang maikling sagot na “Oo” upang mapanatili ang tikas at diin ng Griyego.
