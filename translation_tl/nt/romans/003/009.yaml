  naturalness: Natural ang kabuuang daloy at ang maringal ngunit modernong rehistro. Ang “Nakahihigit ba tayo?” ay katanggap-tanggap at pinananatili ang sadyang pinagtatalunang saklaw ng προεχόμεθα. Ang maliit na pagbabago sa pandiwa ay nagpapalinaw sa pangungusap.
