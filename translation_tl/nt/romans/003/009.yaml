id: ROM.3.9
reference: Romans 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: tl
  text: Ano ngayon? Nakahihigit ba tayo? Hinding-hindi[a], sapagkat ipinaratang na namin na ang lahat—mga Judio at mga Griego—ay nasa ilalim ng kasalanan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “May kalamangan ba tayo?”
    reason: alternative_reading
  - marker: b
    text: O, “nasa ilalim ng kapangyarihan ng kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Ano ngayon?
  rationale: Maikli at likas na tanong sa Filipino na pinananatili ang pangangatwirang ugnayan ng οὖν nang walang idinaragdag na wala sa Griyego.
- source_word: προεχόμεθα
  choice: Nakahihigit ba tayo?
  rationale: Ipinahahayag ang pinagtatalunang diwa ng pagiging nasa mas nakahihigit na kalagayan. Dahil maaari rin itong tumukoy sa pagkakaroon ng kalamangan, inilagay ang alternatibo sa talababa.
- source_word: οὐ πάντως
  choice: Hinding-hindi
  rationale: Malinaw at mariing pagtanggi na natural sa modernong Filipino.
- source_word: προῃτιασάμεθα
  choice: naiparatang na namin
  rationale: Pinananatili ang hudisyal na himig ng pandiwa at ang aspektong nauna nang ginawa ang paratang.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: mga Judio at mga Griego
  rationale: Tuwirang pinananatili ang dalawang pangkat sa teksto at ang karaniwang katawagang “mga Griego,” nang hindi ito tahasang pinapalitan ng “mga Hentil.”
- source_word: πάντας
  choice: ang lahat
  rationale: Ipinakikita ang kabuuang saklaw sa dalawang pangkat; ang mga gitling ay tumutulong na malinaw na maiugnay ang “lahat” sa mga Judio at mga Griego.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: ay nasa ilalim ng kasalanan
  rationale: Pinananatili ang siksik na metapora ng pagpapasakop sa kasalanan sa halip na agad itong ipaliwanag bilang kapangyarihan o paghahari.
theological_decisions:
- issue: Saklaw ng unang panauhang maramihan sa προεχόμεθα
  choice: “Nakahihigit ba tayo?” bilang tanong tungkol sa nakahihigit na katayuan, lalo na ng mga Judio sa konteksto.
  alternative: “May kalamangan ba tayo?”
  rationale: Ang Roma 3:1–9 ay tumatalakay sa pribilehiyo at pananagutan ng mga Judio. Hindi tinutukoy nang higit sa kinakailangan kung sino ang eksaktong saklaw ng “tayo,” at pinananatili sa talababa ang leksikal na alternatibo.
- issue: Kahulugan ng pagiging ὑφ’ ἁμαρτίαν
  choice: “nasa ilalim ng kasalanan”
  alternative: “nasa ilalim ng kapangyarihan ng kasalanan”
  rationale: Pinananatili ng pangunahing salin ang matinding ngunit siksik na pananalita ni Pablo; inilalahad sa talababa ang posibleng diwa ng pagpapasakop sa kapangyarihan ng kasalanan nang hindi ito ipinipilit sa mismong teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Judio” at “Griego” bilang pormal ngunit karaniwang katawagang biblikal. Pinanatili ang kuwit sa hulihan upang tumugma sa pagpapatuloy ng pangungusap sa kasunod na talata.
