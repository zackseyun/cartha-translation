id: ROM.3.3
reference: Romans 3:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: tl
  text: Ano ngayon? Kung ang ilan ay hindi naging tapat[a], mapapawalang-bisa ba ng kanilang kawalang-katapatan ang katapatan ng Diyos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi sumampalataya.” Kaugnay nito, ang “kawalang-katapatan” sa kasunod na parirala ay maaari ring isaling “kawalan ng pananampalataya,” at ang “katapatan ng Diyos” ay literal na “pananampalataya ng Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Ano ngayon?
  rationale: Likas na panandang diskurso sa modernong Tagalog para sa maikling pagliko ng argumento at pagpapakilala ng pagtutol.
- source_word: ἠπίστησάν
  choice: hindi naging tapat
  rationale: Maaaring tumukoy ang pandiwa sa hindi paniniwala, ngunit sa pagkakatambal nito sa ἀπιστία at pagsalungat sa πίστις ng Diyos, nangingibabaw dito ang diwa ng kawalang-katapatan.
- source_word: τινες
  choice: ang ilan
  rationale: Tuwirang ipinahahayag ang di-tiyak na pangkat nang hindi ipinahihiwatig na teknikal o tiyak ang pagkakakilanlan nila.
- source_word: ἀπιστία
  choice: kawalang-katapatan
  rationale: Pinananatili ang leksikal at retorikal na ugnayan sa ἠπίστησάν at ang malinaw na pagsalungat sa katapatan ng Diyos; posible rin ang 'kawalan ng pananampalataya.'
- source_word: πίστιν τοῦ θεοῦ
  choice: katapatan ng Diyos
  rationale: Bagaman literal na 'pananampalataya ng Diyos,' sa konteksto ang genitibong parirala ay pinakamalamang na tumutukoy sa pagiging tapat o maaasahan ng Diyos, kasalungat ng kawalang-katapatan ng tao.
- source_word: καταργήσει
  choice: mapapawalang-bisa
  rationale: Malinaw at natural na ipinahahayag ang diwang gawing walang bisa o bisaan ang isang bagay, habang pinananatili ang anyong retorikal na tanong.
theological_decisions:
- issue: Ang kahulugan ng πίστιν τοῦ θεοῦ sa pinagtatalunang pariralang Paulino
  choice: katapatan ng Diyos
  alternative: pananampalataya ng Diyos
  rationale: Malakas na ipinahihiwatig ng pagsalungat ng kawalang-katapatan ng tao at πίστις ng Diyos ang katapatan o pagiging maaasahan ng Diyos. Inilalagay sa talababa ang literal at posibleng alternatibo upang hindi ikubli ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang magkatugmang 'hindi naging tapat,' 'kawalang-katapatan,' at 'katapatan' upang mapanatili ang retorikal na pagsalungat sa Griyego; idinokumento sa talababa ang alternatibong pagbasa tungkol sa pananampalataya.
