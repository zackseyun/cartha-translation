id: ROM.3.26
reference: Romans 3:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: tl
  text: Sa kanyang pagpapahinuhod, upang ipakita ang kanyang katuwiran[a] sa kasalukuyang panahon, nang sa gayon ay maging matuwid siya at siyang nagpapahayag na matuwid[b] sa taong sumasampalataya kay Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: lexical_alternative
  - marker: b
    text: O “tagapagpawalang-sala.”
    reason: lexical_alternative
  - marker: c
    text: O “sa taong kabilang sa katapatan ni Jesus.” Maaaring tumukoy ang pariralang Griego sa pananampalataya kay Jesus o sa katapatan ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: pagpipigil
  rationale: Ipinahihiwatig nito ang sinasadyang pagpigil ng Diyos sa agarang paghatol; mas tiyak ito rito kaysa sa pangkalahatang “pagtitiis.”
- source_word: ἔνδειξιν
  choice: ipakita
  rationale: Natural sa makabagong Tagalog at pinananatili ang diwa ng hayag at mapatutunayang pagpapamalas.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Karaniwang katumbas ng Pauline δικαιοσύνη at akma sa ugnayan nito sa δίκαιον at δικαιοῦντα; inilalagay sa talababa ang posibleng diwang “katarungan.”
- source_word: νῦν καιρῷ
  choice: sa kasalukuyang panahon
  rationale: Malinaw at likas na Tagalog na nagpapanatili sa temporal na diin ng νῦν καιρός.
- source_word: δίκαιον
  choice: matuwid
  rationale: Pinananatili ang pagkakaugnay nito sa “katuwiran,” habang nananatiling angkop sa kontekstong panghukuman.
- source_word: δικαιοῦντα
  choice: tagapagpawalang-sala
  rationale: Ipinakikita ang aktibong papel ng Diyos sa kontekstong panghukuman at, bilang katawagang pantangi, naipapares nang maikli sa “matuwid.”
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: taong sumasampalataya kay Jesus
  rationale: Likas at malinaw na Tagalog para sa karaniwang objective-genitive na pagbasa; pinananatili sa talababa ang tunay na posibilidad na tumukoy ito sa katapatan ni Jesus.
theological_decisions:
- issue: Kahulugan ng ἐκ πίστεως Ἰησοῦ
  choice: ang taong sumasampalataya kay Jesus
  alternative: ang taong nakabatay sa katapatan ni Jesus
  rationale: Pinili sa pangunahing teksto ang karaniwang pagbasa na si Jesus ang layon ng pananampalataya, ngunit hindi nilulutas nang palihim ang pinagtatalunang genitive; itinatala ang subjective-genitive na pagbasa sa talababa.
- issue: Ugnayan ng δίκαιον at δικαιοῦντα
  choice: matuwid ... tagapagpawalang-sala
  alternative: makatarungan ... nagpapahayag na matuwid
  rationale: Pinananatili ang tensiyon na ang Diyos ay kapwa matuwid at siyang nagpapawalang-sala, nang hindi ipinapaliwanag kung paano ito pinagkakasundo sa loob mismo ng salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “tagapagpawalang-sala” upang mapanatili ang maikling pagkaparis ng δίκαιον at δικαιοῦντα, bagaman mas pormal ito kaysa karaniwang pananalita. Ang talata ay nagsisimula bilang pagpapatuloy ng sintaks ng naunang talata, gaya ng tekstong Griego.
