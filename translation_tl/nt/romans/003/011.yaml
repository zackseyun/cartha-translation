  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: tl
  text: Walang nakauunawa; walang naghahanap sa Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “walang masikap na naghahanap sa Diyos” o “walang naghahanap nang buong sikap sa Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: nakauunawa
  rationale: Likas at malinaw itong salin ng participle na tumutukoy sa taong may pagkaunawa o kabatiran.
- source_word: ἐκζητῶν
  choice: masikap na naghahanap
  rationale: Ipinahihiwatig ng tambalang pandiwa ang masidhi o masikap na paghahanap; pinananatili ito nang hindi nagiging mabigat ang Tagalog.
- source_word: οὐκ ἔστιν
  choice: Walang
  rationale: Ang paulit-ulit na “Walang” ay natural sa Tagalog at pinananatili ang ganap at mariing pagkakaila ng Griyego.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: nakauunawa / masikap na naghahanap
  rationale: Natural na naihahayag sa Tagalog ang mga substantival participle sa pamamagitan ng mga pandiwang naglalarawan sa di-binanggit na “sinuman.”
- source_word: τὸν θεόν
  choice: sa Diyos
  rationale: Ang “sa Diyos” ang likas na layon ng pandiwang “naghahanap” sa modernong Tagalog at malinaw na pinananatili ang tinutukoy.
theological_decisions:
- issue: Saklaw ng pagkakaila sa siping kalipunan ni Pablo
  choice: Panatilihin ang ganap na pahayag na “Walang...” sa parehong sugnay.
  alternative: Walang tunay na nakauunawa; walang talagang naghahanap sa Diyos.
  rationale: Ganap at kategorikal ang pagkakaila sa Griyego; ang pagdaragdag ng “tunay” o “talagang” ay maaaring magpahiwatig ng interpretatibong paglilimita na wala sa teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nakauunawa” sa halip na mas teknikal na pananalita, at “masikap na naghahanap” upang maipakita ang posibleng masidhing diwa ng ἐκζητέω.
