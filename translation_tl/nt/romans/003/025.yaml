id: ROM.3.25
reference: Romans 3:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: tl
  text: Siya ang iniharap ng Diyos bilang handog na pantubos sa kasalanan[a], sa pamamagitan ng pananampalataya sa kanyang dugo[b], upang ipakita ang kanyang katuwiran[c], dahil sa pagpapalampas sa mga kasalanang nagawa noon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pampalubag-loob”; o “takip ng Kaban ng Tipan,” na tinatawag ding “luklukan ng awa”—ang gintong takip ng Kaban na winisikan ng dugong pantubos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pamamagitan ng pananampalataya, sa bisa ng kanyang dugo.” Maaaring unawain ang parirala bilang pananampalataya sa kanyang dugo, o bilang pananampalataya na may kaugnayan sa kanyang dugo bilang paraan ng pagtubos.
    reason: alternative_reading
  - marker: c
    text: Maaari ring “katarungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: iniharap
  rationale: Ipinahahayag nito ang paglalantad o paghaharap ng Diyos kay Cristo, at natural ito sa makabagong Tagalog nang hindi ipinapasok ang mas makitid na diwang “itinalaga.”
- source_word: ἱλαστήριον
  choice: handog na pantubos sa kasalanan
  rationale: Madaling maunawaan ang parirala at pinananatili ang sakripisyal at pampawalang-salang bisa ng salita nang hindi nililimitahan ito sa iisang paliwanag. Inilalagay sa talababa ang mahahalagang alternatibong “handog na pampalubag-loob” at “takip ng Kaban na luklukan ng awa.”
- source_word: διὰ πίστεως
  choice: sa pamamagitan ng pananampalataya
  rationale: Ito ang malinaw at likas na katumbas ng instrumental na parirala at pinananatili ang karaniwang kahulugan ng πίστις bilang pananampalataya.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: sa kanyang dugo
  rationale: Malapit ito sa anyo ng Griyego at pinananatiling bukas ang ugnayan ng parirala sa “pananampalataya” at sa paghahandog; nasa talababa ang posibleng instrumental na pagbasa.
- source_word: εἰς ἔνδειξιν
  choice: upang ipakita
  rationale: Natural nitong ipinahahayag sa Tagalog ang layunin o resultang ipinahihiwatig ng pariralang Griyego.
- source_word: δικαιοσύνης
  choice: katuwiran
  rationale: Ang “katuwiran” ang karaniwang salin sa kontekstong Paulino at naipagpapatuloy nito ang mahalagang bokabularyong teolohikal; pinananatili sa talababa ang posibleng diwang “katarungan.”
- source_word: πάρεσιν
  choice: pagpapalampas
  rationale: Ipinakikita nito ang pansamantalang hindi pagpaparusa o hindi paghatol sa mga sala, nang hindi ito basta ipinapantay sa ganap na kapatawaran.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: mga kasalanang nagawa noong una
  rationale: Malinaw at natural nitong ipinahahayag na ang tinutukoy ay mga kasalanang nagawa bago ang ipinapakitang pagkilos ng Diyos.
theological_decisions:
- issue: Ang saklaw ng kahulugan ng ἱλαστήριον
  choice: handog na pantubos sa kasalanan
  alternative: handog na pampalubag-loob; o takip ng Kaban na luklukan ng awa
  rationale: Pinananatili ng pangunahing salin ang pangkalahatang diwa ng paghahandog para sa kasalanan nang hindi ipinipilit kung ang diin ay nasa pag-aalis ng sala, pagpapawi ng galit, o sa larawan ng takip ng Kaban. Tahasang inilalahad sa talababa ang ibang mahahalagang pagbasa.
- issue: Ang sintaktikong ugnayan ng διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: sa pamamagitan ng pananampalataya sa kanyang dugo
  alternative: sa pamamagitan ng pananampalataya, sa bisa ng kanyang dugo
  rationale: Ang pangunahing teksto ay sumusunod sa natural na pagbasa na ang pananampalataya ay nakatuon sa kanyang dugo, samantalang pinananatili sa talababa ang pagbasa na ang dugo ang batayan o paraan ng paghahandog.
- issue: Ang kahulugan ng δικαιοσύνη sa kontekstong Paulino
  choice: katuwiran
  alternative: katarungan
  rationale: Pinananatili ng “katuwiran” ang malawak na bokabularyong Paulino, ngunit maaaring idiin ng konteksto ang makatarungang pagkilos ng Diyos; kaya kasama ang “katarungan” sa talababa.
- issue: Ang diwa ng πάρεσις
  choice: pagpapalampas
  alternative: pansamantalang hindi pagparusa
  rationale: Hindi ito basta tinumbasan ng “pagpapatawad,” upang mapanatili ang pagkakaiba ng pagpapalampas sa mga dating kasalanan at ng ganap na kapatawaran.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Ginamit ang pamilyar na bokabularyong biblikal na “pananampalataya” at “katuwiran,” ngunit iniwasan sa pangunahing teksto ang teknikal at di-karaniwang terminong maaaring magtakda agad ng isang denominasyonal na pagbasa. Nasa mismong teksto ang lahat ng marker na [a], [b], at [c].
