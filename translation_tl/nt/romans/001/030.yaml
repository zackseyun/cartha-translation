  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: tl
  text: mga naninirang-puri, mga napopoot sa Diyos[a], mga mapang-abuso, mga palalo, mga hambog, mga kumakatha ng kasamaan, mga suwail sa mga magulang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga kinapopootan ng Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: mga naninira sa kapwa
  rationale: Tumutukoy ito sa mga nagsasalita laban sa iba upang sirain ang kanilang pangalan. Natural at malinaw sa modernong Filipino ang parirala at napananatili nito ang bigat ng masamang asal.
- source_word: θεοστυγεῖς
  choice: mga napopoot sa Diyos
  rationale: Pinananatili nito ang malamang na aktibong diwa—mga taong napopoot sa Diyos—at ang alternatibong pasibong diwa ay inilalagay sa talababa.
- source_word: ὑβριστάς
  choice: mga mapang-abuso
  rationale: Saklaw nito ang walang-pakundangang paghamak at masamang pagtrato sa iba nang hindi nililimitahan ang salita sa pisikal na karahasan.
- source_word: ὑπερηφάνους
  choice: mga palalo
  rationale: Ang “palalo” ay maikli, dignified, at malinaw na nagpapahayag ng mapagmataas na pagtingin sa sarili.
- source_word: ἀλαζόνας
  choice: mga hambog
  rationale: Ipinahihiwatig nito ang pagyayabang at mapagkunwaring pagpapakitang-gilas, at naihihiwalay ang diwa nito sa katabing “mga palalo.”
- source_word: ἐφευρετὰς κακῶν
  choice: mga kumakatha ng kasamaan
  rationale: Malapit ito sa larawan ng mga taong nag-iisip o lumilikha ng mga bagong paraan ng paggawa ng masama, at natural itong pakinggan sa Filipino.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: mga suwail sa mga magulang
  rationale: Direkta at natural nitong ipinapahayag ang patuloy na pagsuway sa mga magulang at pinananatili ang ugnayang tinutukoy ng Griyego.
theological_decisions:
- issue: Diwa ng θεοστυγεῖς
  choice: 'aktibo: “mga napopoot sa Diyos”'
  alternative: 'pasibo: “mga kinapopootan ng Diyos”'
  rationale: Mas angkop sa talaan ng mga bisyo ang aktibong diwa, sapagkat ang ibang mga salita ay tumutukoy sa saloobin o asal ng tao. Gayunman, tunay na pinagtatalunan ang anyo, kaya pinananatili sa talababa ang pasibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inulit ang “mga” upang natural na mabasa ang sunod-sunod na katawagan at luminaw na bawat parirala ay tumutukoy sa mga tao. Inilagay ang talababa pagkatapos ng “Diyos,” ang salitang tunay na may alternatibong pagbasa.
