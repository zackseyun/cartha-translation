  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: tl
  text: 'Sapagkat dito ay inihahayag ang katuwiran ng Diyos[a] mula sa pananampalataya tungo sa pananampalataya,[b] gaya ng nasusulat: “Ang matuwid ay mabubuhay sa pamamagitan ng pananampalataya.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang katarungan ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang Griyego na ἐκ πίστεως εἰς πίστιν ay bantog sa hirap ng pagpapakahulugan. Pinananatili ng “mula sa pananampalataya tungo sa pananampalataya” ang dalawang preposisyon at ang pag-uulit. Kabilang sa mas interpretatibong mga salin ang “mula sa pananampalataya para sa pananampalataya,” “sa pananampalataya mula simula hanggang wakas,” at “sa pamamagitan ng pananampalataya, para sa pananampalataya.”
    reason: alternative_reading
  - marker: c
    text: Maaari ring “Ang matuwid sa pananampalataya ay mabubuhay.”
    reason: alternative_reading
  - marker: d
    text: Maaari ring “Ngunit ang matuwid ay mabubuhay sa pamamagitan ng pananampalataya.”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: 'Ang “katuwiran” ang pinakanaaangkop na salin sa programatikong gamit ni Pablo: pinananatili nito ang ugnayan sa “matuwid” sa kasunod na sipi at hindi nililimitahan ang salita sa legal na “katarungan” lamang.'
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Pinananatiling bukas ng karaniwang pariralang paari ang debatableng diwa ng genitive—maaaring tumukoy sa sariling katuwiran ng Diyos o sa katuwirang kaugnay sa kaniya at nagmumula sa kaniya.
- source_word: ἐν αὐτῷ
  choice: dito
  rationale: Ang panghalip na neuter ay pinakamalamang na tumutukoy sa ebanghelyo sa Roma 1:16. Natural sa Tagalog ang “dito” bilang pagtukoy sa naunang paksang iyon.
- source_word: ἀποκαλύπτεται
  choice: inihahayag
  rationale: Tumpak at likas itong salin ng present passive; ipinakikita nitong nahahayag ang katuwiran nang hindi ipinapasok ang isang tiyak na paliwanag sa aspekto.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: mula sa pananampalataya tungo sa pananampalataya
  rationale: Pinananatili nito ang dalawang preposisyon at ang retorikal na pag-uulit ng πίστις. Hindi nito nilulutas ang sadyang mahirap at pinagtatalunang kahulugan ng parirala.
- source_word: δίκαιος
  choice: ang matuwid
  rationale: Ang substantibong pang-uri ay natural na maisasalin sa Tagalog bilang “ang matuwid”; hindi na kailangang magdagdag ng salitang may kasariang panlalaki.
- source_word: ἐκ πίστεως
  choice: sa pananampalataya
  rationale: Likas itong pahayag sa Tagalog at maaari pa ring marinig bilang paraan o batayan ng pamumuhay, habang ang posibleng pagkakabit nito sa “matuwid” ay inilalahad sa talababa.
- source_word: ζήσεται
  choice: mabubuhay
  rationale: Malinaw nitong pinananatili ang hinaharap na anyo at ang marangal na himig ng sipi.
theological_decisions:
- issue: Kahulugan ng δικαιοσύνη θεοῦ
  choice: ang katuwiran ng Diyos
  alternative: ang katarungan ng Diyos; katuwirang mula sa Diyos
  rationale: Pinananatili ng pangunahing teksto ang anyong genitive at ang teolohikal na tensiyon sa pagitan ng sariling katuwiran ng Diyos at ng katuwirang nagmumula sa kaniya.
- issue: Diwa ng ἐκ πίστεως εἰς πίστιν
  choice: mula sa pananampalataya tungo sa pananampalataya
  alternative: mula sa pananampalataya para sa pananampalataya; sa pananampalataya mula simula hanggang wakas; sa pamamagitan ng pananampalataya, para sa pananampalataya
  rationale: Tunay na malabo at matagal nang pinagtatalunan ang parirala. Pinananatili ng salin ang direksiyon at pag-uulit sa Griyego sa halip na ipaloob sa teksto ang isang denominasyonal o tiyak na interpretasyon.
- issue: Pagkakabit ng ἐκ πίστεως sa sipi mula sa Habakuk
  choice: Ang matuwid ay mabubuhay sa pananampalataya
  alternative: Ang taong matuwid dahil sa pananampalataya ay mabubuhay
  rationale: Maaaring iugnay sa Griyego ang parirala sa “matuwid” o sa “mabubuhay.” Pinili sa teksto ang likas at tradisyonal na ayos, at pinanatili sa talababa ang ibang posibleng pagkakabit.
- issue: Paglilipat ng δὲ sa sipi
  choice: Hindi isinalin nang tahasan
  alternative: Ngunit ang matuwid ay mabubuhay sa pananampalataya
  rationale: Sa kontekstong ito, ipinakikilala ng sipi ang katibayan para sa naunang pahayag at hindi isang malinaw na pagsalungat. Ang paglalagay ng “ngunit” ay maaaring magpahiwatig ng kontrast na hindi nangingibabaw dito; gayunman, itinala ang mas pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sapagkat,” “gaya ng nasusulat,” at “katuwiran” upang mapanatili ang pormal na himig ng argumentong teolohikal at ng sipi sa Kasulatan, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang “dito” ay natural na tumutukoy sa ebanghelyong binanggit sa naunang talata.
