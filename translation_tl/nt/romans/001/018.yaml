  terminology: Ang “poot ng Diyos,” “kawalang-galang sa Diyos,” at “katotohanan” ay angkop at pinananatili ang bigat ng teksto. Ang “kasamaan” ay isang katanggap-tanggap na malawak na katumbas ng ἀδικία sa talatang ito; ang sinadyang pag-uulit nito ay nagpapanatili sa retorikal na ugnayan ng dalawang paglitaw ng ἀδικία.
