id: ROM.1.18
reference: Romans 1:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: tl
  text: Sapagkat nahahayag mula sa langit ang poot ng Diyos laban sa lahat ng kawalang-galang sa Diyos at kasamaan ng mga taong pumipigil sa katotohanan sa pamamagitan ng kasamaan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kasamaan.”
    reason: Pinananatili ang posibilidad na ang ἐν ἀδικίᾳ ay tumukoy sa kalagayan o saklaw, hindi lamang sa paraan.
  - marker: b
    text: Ang “pumipigil” ay maaari ring isaling “sumusupil” o “sumasansala.”
    reason: Ipinakikita ang leksikal na saklaw ng κατέχω sa kontekstong ito.
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: nahahayag
  rationale: Ang pangkasalukuyang balintiyak ay likas na naipahahayag sa Tagalog sa anyong “nahahayag”; maaari itong tumukoy sa kasalukuyan o patuloy na paghahayag nang hindi pinipilit ang aspekto.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag sa argumento ni Pablo.
- source_word: ὀργὴ θεοῦ
  choice: ang poot ng Diyos
  rationale: Pinananatili ang personal at panghatol na bigat ng ὀργή, sa halip na gawing di-personal na bunga lamang.
- source_word: ἀπ’ οὐρανοῦ
  choice: mula sa langit
  rationale: Tuwirang ipinahahayag ang pinagmulan ng paghahayag.
- source_word: πᾶσαν ἀσέβειαν
  choice: lahat ng kawalang-galang sa Diyos
  rationale: Malinaw na ipinakikita ang tuon ng ἀσέβεια sa kawalan ng paggalang at wastong pakikitungo sa Diyos.
- source_word: ἀδικίαν
  choice: kasamaan
  rationale: Natural at malawak sa modernong Tagalog, at sumasaklaw sa moral na di-pagkamatuwid; ang “kawalang-katarungan” ay magiging napakakitid dito.
- source_word: ἀνθρώπων
  choice: mga tao
  rationale: Pangkalahatang tumutukoy sa mga tao, hindi lamang sa mga lalaki.
- source_word: τῶν ... κατεχόντων
  choice: mga taong sumisikil
  rationale: Sa konteksto, ang κατέχω ay may diwang pagpigil o pagsupil sa katotohanan, hindi simpleng paghawak o pag-aangkin nito.
- source_word: τὴν ἀλήθειαν
  choice: sa katotohanan
  rationale: Tuwiran at hindi pinakikitid ang saklaw ng salita.
- source_word: ἐν ἀδικίᾳ
  choice: sa pamamagitan ng kanilang kasamaan
  rationale: Binabasa ang ἐν bilang paraan o kasangkapan ng pagsikil; idinagdag ang “kanilang” bilang natural na paglilinaw ng kaugnayan sa mga gumagawa nito, habang itinatala sa talababa ang tunay na alternatibong pagbasa bilang kalagayan o saklaw.
theological_decisions:
- issue: Kung ang ὀργὴ θεοῦ ay personal na poot ng Diyos o di-personal na bunga lamang ng kasamaan
  choice: “ang poot ng Diyos,” bilang sariling banal at makatarungang pagtugon ng Diyos
  alternative: isang di-personal na prosesong bunga ng masamang asal
  rationale: Ang genitibong parirala at daloy ng argumento ni Pablo ay sumusuporta sa personal na banal na pagtugon; hindi ito pinalalambot o dinaragdagan ng paliwanag sa mismong talata.
- issue: Kung ang ἐν ἀδικίᾳ ay paraan, kalagayan, o saklaw
  choice: 'paraan: “sa pamamagitan ng kanilang kasamaan”'
  alternative: 'kalagayan o saklaw: “sa kanilang kasamaan”'
  rationale: Ang instrumental na diwa ay malinaw at natural sa Tagalog, ngunit nananatiling tunay na posible ang locative/spheric na pagbasa kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kawalang-galang sa Diyos” upang maging malinaw ang ἀσέβεια sa karaniwang mambabasa, at “kasamaan” para sa malawak na moral na diwa ng ἀδικία. Pinanatili ang pag-uulit ng konsepto ng ἀδικία sa pangunahing sugnay at sa pariralang ἐν ἀδικίᾳ.
