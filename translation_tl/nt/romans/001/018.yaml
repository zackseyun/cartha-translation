revisions:
- from: Sapagkat nahahayag mula sa langit ang poot ng Diyos laban sa lahat ng kawalang-galang sa Diyos at kasamaan ng mga taong sumisikil sa katotohanan sa pamamagitan ng kanilang kasamaan.[a][b]
  to: Sapagkat nahahayag mula sa langit ang poot ng Diyos laban sa lahat ng kawalang-galang sa Diyos at kasamaan ng mga taong pumipigil sa katotohanan sa pamamagitan ng kasamaan.[a][b]
  rationale: Inalis ang idinagdag na panghalip na “kanilang” upang hindi higit na tukuyin ang ἐν ἀδικίᾳ kaysa sa Griyego. Pinalitan ang “sumisikil” ng mas likas na “pumipigil,” habang pinananatili ang diwang pagsugpo o pagpigil sa katotohanan. Walang binagong teolohikal na pagpapakahulugan o pinalambot na termino.
