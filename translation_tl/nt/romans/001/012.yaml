  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: tl
  text: Ibig kong sabihin, upang magkasama tayong mapalakas ng loob kasama ninyo sa pamamagitan ng pananampalataya ng bawat isa—ng sa inyo at ng sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “upang ako’y mapalakas din ng loob kasama ninyo.” Maaari ring mangahulugan ang pandiwa ng “maaliw.”
    reason: Pinananatili ang kaluwagan ng pawatas sa Griyego at ang saklaw ng pandiwang maaaring tumukoy sa pagpapalakas ng loob o pag-aliw.
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: Ibig kong sabihin
  rationale: Nagpapakilala ito ng paglilinaw sa naunang pahayag. Likas sa makabagong Tagalog ang pariralang ito at pinananatili ang paliwanag na diin ng Griyego.
- source_word: συμπαρακληθῆναι
  choice: sama-sama tayong mapalakas ang loob
  rationale: Ipinahihiwatig ng unlaping συμ- ang magkasamang pagtanggap ng pampalakas-loob. Bagaman walang tahasang paksa ang pawatas sa Griyego, ipinakikita ng konteksto at ng “sa inyo at sa akin” na kapwa si Pablo at ang mga taga-Roma ang mapapalakas.
- source_word: ἐν ὑμῖν
  choice: habang kasama ninyo ako
  rationale: Ipinapahayag nito ang pampalakas-loob na magaganap sa gitna o piling ng mga mananampalataya sa Roma, hindi ang literal na pagiging “nasa loob” nila.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: sa pamamagitan ng pananampalataya ng bawat isa sa atin
  rationale: Pinananatili nito ang pananampalataya bilang paraan ng kapwa pagpapalakas at ang katumbasang ipinahihiwatig ng ἐν ἀλλήλοις, nang hindi lumilikha ng maling diwang pananampalataya mismo sa isa’t isa.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Sa kontekstong ito, tumutukoy ang πίστις sa pananampalatayang taglay ni Pablo at ng mga taga-Roma, hindi pangunahin sa katapatan.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: ng sa inyo at ng sa akin
  rationale: Pinananatili ang timbang at tahasang pagtutumbas sa pananampalataya ng mga taga-Roma at ni Pablo.
theological_decisions:
- issue: Kung isang panig lamang ang pagpapalakas ni Pablo o kapwa sila mapapalakas
  choice: Kapwa mapapalakas ang loob ni Pablo at ng mga mananampalataya sa Roma
  alternative: Si Pablo lamang ang mapapalakas sa piling nila, o si Pablo lamang ang magpapalakas sa kanila
  rationale: Ang tambalang pandiwang συμπαρακληθῆναι at ang pangwakas na “sa inyo at sa akin” ay kapwa nagpapakita ng katumbasan. Hindi dapat gawing isang panig lamang ang paglilingkod na inilalarawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sama-sama tayong” upang likas na maipahayag ang katumbasang nasa Griyego; iniwasan ang sobrang literal na ayos na maaaring magpahiwatig na ang bagay ng pananampalataya ay ang isa’t isa.
