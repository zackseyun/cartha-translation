  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: tl
  text: Sapagkat sabik akong makita kayo upang maibahagi ko sa inyo ang isang espirituwal na kaloob[a], nang sa gayon ay mapatatag kayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang kaloob mula sa Espiritu.”
    reason: Pinananatili ang posibleng tuwirang kaugnayan ng πνευματικὸν sa Espiritu, nang hindi iyon ipinipilit sa pangunahing teksto.
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: sabik ako
  rationale: Ipinahahayag nito ang matinding personal na pagnanais sa natural at makabagong Tagalog.
- source_word: γὰρ
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na kaugnayan ng talata sa naunang pahayag.
- source_word: ἰδεῖν
  choice: makita
  rationale: Tuwirang katumbas ito ng pandiwa; hindi nito tahasang dinaragdagan ang diwang ‘dalawin,’ bagaman ipinahihiwatig iyon ng konteksto.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na naghahayag ng layunin.
- source_word: τι
  choice: isang
  rationale: Ipinakikita ang di-tiyak na kaloob nang hindi ipinahihiwatig na marami ang tinutukoy.
- source_word: μεταδῶ
  choice: maibahagi ko
  rationale: Ipinahahayag ang pagbabahagi o pagpapaabot ng isang bagay, at mas natural sa Tagalog kaysa sa mas pormal na ‘maipagkaloob.’
- source_word: χάρισμα
  choice: kaloob
  rationale: Karaniwang salin ito na angkop sa isang bagay na ipinagkaloob dahil sa biyaya, nang hindi labis na pinalalawak ang salita.
- source_word: πνευματικὸν
  choice: espirituwal
  rationale: Pinananatili nito ang lawak at posibleng kalabuan ng Griyego nang hindi agad nililimitahan sa isang tiyak na uri ng mahimalang kaloob.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: nang sa gayon ay mapatatag kayo
  rationale: Pinananatili ang pasibong anyo at ang layunin o inaasahang bunga ng pagbabahagi.
theological_decisions:
- issue: Kung ang ‘kaloob na espirituwal’ ay isang tiyak na mahimalang karisma o mas malawak na espirituwal na kapakinabangan
  choice: isang kaloob na espirituwal
  alternative: isang kaloob mula sa Espiritu
  rationale: Hindi hinihingi ng pariralang Griyego ang makitid o teknikal na pakahulugan. Pinananatili ng pangunahing salin ang kalabuan at iniiwasang magpasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sabik’ para sa matinding personal na pagnanais, ‘maibahagi’ para sa natural na diwa ng μεταδίδω, at ang pasibong ‘mapatatag kayo’ upang manatiling malapit sa anyo ng Griyego.
