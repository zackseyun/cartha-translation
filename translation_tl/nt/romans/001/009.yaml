id: ROM.1.9
reference: Romans 1:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: tl
  text: Sapagkat saksi ko ang Diyos—na pinaglilingkuran ko sa aking espiritu sa mabuting balita ng kanyang Anak—na palagi ko kayong binabanggit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: saksi
  rationale: Sa panawagang halos panunumpa, ang Diyos ang tinatawag ni Pablo na saksi sa katotohanan ng kanyang sinasabi.
- source_word: λατρεύω
  choice: pinaglilingkuran
  rationale: Ipinahihiwatig ng salita ang paglilingkod na panrelihiyon sa Diyos; natural sa Tagalog ang “pinaglilingkuran” at hindi nito nililimitahan ang diwa sa isang gawa lamang ng pagsamba.
- source_word: ἐν τῷ πνεύματί μου
  choice: sa aking espiritu
  rationale: Pinananatili nito ang anyong may ἐν at ang posibleng diwa ng panloob na larangan o paraan ng paglilingkod, nang hindi tahasang nilulutas ang ambiguwidad.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: sa mabuting balita tungkol sa kanyang Anak
  rationale: Ang “mabuting balita” ay malinaw at makabagong katumbas ng εὐαγγέλιον. Sa konteksto, natural na nauunawaan ang genitibong τοῦ υἱοῦ bilang tumutukoy sa nilalaman ng balita, habang nananatiling posible ang mas pormal na “ng kanyang Anak.”
- source_word: ἀδιαλείπτως
  choice: lagi
  rationale: Ipinapahayag nito ang tuloy-tuloy o palagiang gawi sa natural at karaniwang Tagalog, hindi kinakailangang bawat sandali nang literal.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: binabanggit ko kayo
  rationale: Ito ang natural na Tagalog para sa idyomang literal na “gumagawa ako ng pagbanggit sa inyo,” at hindi ito lumalampas tungo sa mas interpretatibong “inaalala ko kayo.”
theological_decisions:
- issue: Kung ang τοῦ υἱοῦ αὐτοῦ ay isasaling “ng kanyang Anak” o “tungkol sa kanyang Anak”
  choice: tungkol sa kanyang Anak
  alternative: ng kanyang Anak
  rationale: Maaaring ipahayag ng genitibo ang paksa o nilalaman ng mabuting balita. Ang “tungkol sa” ay natural at malinaw sa Tagalog, ngunit hindi nito ipinapalagay na ang Anak ang pinagmulan o may-ari lamang ng balita.
- issue: Kung ang ἐν τῷ πνεύματί μου ay paraan o larangan ng paglilingkod
  choice: sa aking espiritu
  alternative: sa pamamagitan ng aking espiritu / buong puso kong
  rationale: Ang “sa aking espiritu” ay nagpapanatili sa tunay na ambiguwidad ng Griyego at umiiwas sa pagpapakahulugang masyadong tiyak o malaya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga gitling upang malinaw na ihiwalay ang sugnay tungkol sa paglilingkod ni Pablo nang hindi inilalayo ang pangunahing pahayag na ang Diyos ang kanyang saksi.
