  verdict: approve
  source_fidelity: 'Tapat ang apat na magkakatulad na parirala sa Griyego: ang kakulangan sa pang-unawa (ἀσυνέτους), hindi pagtupad sa mga kasunduan (ἀσυνθέτους), kawalan ng likas na pagmamahal sa pamilya (ἀστόργους), at kawalan ng awa (ἀνελεήμονας). Hindi nito ipinipilit na ang ikalawang salita ay tumutukoy sa isang tiyak na teolohikal na tipan.'
  naturalness: Natural, malinaw, at angkop sa modernong Filipino Tagalog ang magkakatulad na anyong “mga walang …” at “mga hindi ….” Ang pangatnig na “at” bago ang huling aytem ay maayos na daloy sa Tagalog habang pinananatili ang bagsak ng talaan.
  terminology: Ang “pang-unawa,” “kasunduan,” “likas na pagmamahal sa pamilya,” at “awa” ay malinaw at sapat ang antas ng kahulugan. Lalo na, naipapahayag ng ikatlong parirala ang pampamilyang nuwansang likas sa ἀστόργους nang hindi gumagamit ng di-natural na hiram o teknikal na termino.
