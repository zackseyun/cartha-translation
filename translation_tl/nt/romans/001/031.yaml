  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: tl
  text: mga walang pang-unawa, mga hindi tumutupad sa kasunduan, mga walang likas na pagmamahal sa pamilya[a], at mga walang awa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito lalo na sa kawalan ng likas na pagmamahal sa sariling pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: mga walang pang-unawa
  rationale: Ipinapahayag nito ang kakulangan ng pag-unawa o wastong pagk discern, hindi lamang mababang talino. Likas at malinaw ang pariralang ito sa modernong Filipino.
- source_word: ἀσυνθέτους
  choice: mga hindi tumutupad sa kasunduan
  rationale: Tumutukoy ang salita sa mga hindi nananatiling tapat sa napagkasunduan. Mas tiyak ito kaysa sa pangkalahatang “mga hindi mapagkakatiwalaan” at hindi nito ipinapalagay na pormal na tipan ang laging tinutukoy.
- source_word: ἀστόργους
  choice: mga walang likas na pagmamahal sa pamilya
  rationale: Tahasang inilalahad nito ang kawalan ng στοργή, lalo na ang likas na pagmamahalan ng magkakapamilya, sa halip na gawing malabo lamang na “walang puso.”
- source_word: ἀνελεήμονας
  choice: mga walang awa
  rationale: Ito ang pinakanatural at tuwirang modernong Filipino para sa kawalan ng habag o awa.
theological_decisions:
- issue: Saklaw ng ἀσυνθέτους
  choice: mga hindi tumutupad sa kasunduan
  alternative: mga sumisira sa tipan
  rationale: Maaaring may diwang may kaugnayan sa tipan ang salita, ngunit hindi hinihingi ng anyong Griyego na isang tiyak na teolohikal na tipan ang tukuyin. Pinananatili ng “kasunduan” ang mas malawak na saklaw nito.
translation_notes:
  register: Gumamit ng maikli at magkakatulad na mga parirala upang mapanatili ang bagsak ng talaan ng mga bisyo. Moderno at dignified ang wika, at tahasang ipinahayag ang pampamilyang diwa ng ἀστόργους.
