id: ROM.1.4
reference: Romans 1:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: tl
  text: at itinalagang Anak ng Diyos na may kapangyarihan[a], ayon sa Espiritu ng kabanalan[b], sa pamamagitan ng pagkabuhay na muli mula sa mga patay—si Jesus na Mesiyas, ang ating Panginoon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinahayag na” o “itinakdang” Anak ng Diyos na may kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa Banal na Espiritu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: itinalaga
  rationale: Sinasaklaw ng “itinalaga” ang diwa ng pagtukoy o paglalagay sa isang katayuan nang hindi ipinapalagay na ang pandiwa ay nangangahulugan lamang ng pasalitang pagpapahayag. Inilalagay sa talababa ang mahahalagang alternatibo dahil sensitibo sa teolohiya ang salita.
- source_word: υἱοῦ θεοῦ
  choice: Anak ng Diyos
  rationale: Tuwiran at kinikilalang salin ng titulong kristolohikal.
- source_word: ἐν δυνάμει
  choice: na may kapangyarihan
  rationale: Natural ito sa modernong Tagalog at pinananatili ang kaugnayan ng kapangyarihan sa pagiging Anak ng Diyos, nang hindi ito ginagawang simpleng pang-abay na “makapangyarihang itinalaga.”
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: ayon sa Espiritu ng kabanalan
  rationale: Pinananatili ang pambihira at sadyang di-tiyak na anyo ng Griyego sa halip na agad itong ipakahulugang tahasang “Banal na Espiritu.”
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: sa pamamagitan ng pagkabuhay na muli mula sa mga patay
  rationale: Ipinahahayag ang pagkabuhay na muli bilang batayan o pangyayari kaugnay ng pagkakatalaga, habang pinananatili ang “mula sa mga patay.”
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” hindi lamang bilang anyong parang apelyido.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang salin na nagpapanatili sa kristolohikal at biblikal na bigat ng κύριος.
theological_decisions:
- issue: Kung ipinahihiwatig ng ὁρισθέντος na noon lamang naging Anak ng Diyos si Jesus
  choice: Pinanatili ang “itinalagang Anak ng Diyos na may kapangyarihan,” nang hindi dinaragdagan kung kailan nagsimula ang kanyang pagiging Anak.
  alternative: “ipinahayag na Anak ng Diyos na may kapangyarihan” o “tiyak na kinilalang Anak ng Diyos na may kapangyarihan”
  rationale: Hindi tahasang sinasabi ng Griyego na sa pagkabuhay na muli lamang nagsimula ang pagiging Anak ni Jesus. Pinananatili ng salin ang tensiyon sa teksto at hindi nito nilulutas ang tanong sa pamamagitan ng dagdag na paliwanag.
- issue: Kung ang πνεῦμα ἁγιωσύνης ay tuwirang tumutukoy sa Banal na Espiritu
  choice: Espiritu ng kabanalan
  alternative: Banal na Espiritu; kanyang banal na espiritu
  rationale: Pambihira ang parirala at maaaring sadyang katapat ng “ayon sa laman” sa naunang talata. Kaya pinananatili sa pangunahing teksto ang pormal at medyo bukas na pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pambihirang “Espiritu ng kabanalan” upang huwag burahin ang tunay na kalabuan ng Griyego. Ang pangungusap ay nananatiling dugtong sa Roma 1:3, kaya nagsisimula sa “at” at nagtatapos sa kuwit.
