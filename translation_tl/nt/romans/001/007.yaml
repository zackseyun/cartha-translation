    issue: Ang “tinawag na maging banal” ay isahan at mas teleolohikal kaysa sa κλητοῖς ἁγίοις.
    rationale: Parehong pangmaramihan ang κλητοῖς at ἁγίοις, at ang parirala ay hindi naglalaman ng infinitive na “maging.” Ang “mga tinawag na banal” ay mas malapit sa anyo at diwa ng pinagmulan habang likas pa rin sa modernong Tagalog.
  - severity: low
    issue: Ang “kapayapaang mula” ay hindi ang pinakamadulas na ayos ng pangungusap.
    rationale: Bagaman nauunawaan, mas natural ang “Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos,” na malinaw ding nagpapanatili sa pinagmulan ng kapwa biyaya at kapayapaan.
