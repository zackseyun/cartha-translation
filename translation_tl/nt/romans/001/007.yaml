revisions:
- from: 'Sa inyong lahat na nasa Roma, na minamahal ng Diyos at tinawag na maging banal[a]: Sumainyo ang biyaya at kapayapaang mula sa Diyos na ating Ama at sa Panginoong Jesus, ang Mesiyas[b].'
  to: 'Sa inyong lahat na nasa Roma, na minamahal ng Diyos at mga tinawag na banal[a]: Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos na ating Ama at sa Panginoong Jesus, ang Mesiyas[b].'
  rationale: Pinalitan ang “tinawag na maging banal” ng “mga tinawag na banal” upang maipakita ang pangmaramihang anyo at deskriptibong katangian ng κλητοῖς ἁγίοις nang hindi nagdaragdag ng tahasang “maging” sa pangunahing teksto. Inayos ang pormula ng pagbati para sa mas likas na Tagalog, nang walang pagbabago sa kahulugan o sa dalawang pinagmumulan na magkakaugnay sa ἀπό.
