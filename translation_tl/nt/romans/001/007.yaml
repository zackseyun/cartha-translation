reference: Romans 1:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: tl
  text: 'Sa inyong lahat na nasa Roma, na minamahal ng Diyos at mga tinawag na banal[a]: Sumainyo nawa ang biyaya at kapayapaan mula sa Diyos na ating Ama at sa Panginoong Jesus, ang Mesiyas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinawag upang maging mga banal.”
    reason: lexical_alternative
  - marker: b
    text: O “Cristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Sa inyong lahat na nasa Roma
  rationale: Likas na ipinapahayag sa Tagalog ang datibong patutunguhan ng liham, habang pinananatili ang saklaw na “lahat” at ang lokasyong Roma.
- source_word: ἀγαπητοῖς θεοῦ
  choice: na minamahal ng Diyos
  rationale: Pinananatili ang relasyonal at pasibong diwa ng ἀγαπητοῖς sa malinaw at kasalukuyang Tagalog.
- source_word: κλητοῖς ἁγίοις
  choice: tinawag na maging banal
  rationale: Ito ang pinakanatural na Tagalog para sa paglalarawan sa mga tumanggap bilang mga taong tinawag tungo sa kabanalan; inilalahad sa talababa ang mas pormal na anyong walang tahasang “maging.”
- source_word: χάρις
  choice: biyaya
  rationale: Karaniwan at angkop na salin sa kontekstong Paulino, na nagpapanatili sa diwang teolohikal at pagbati.
- source_word: εἰρήνη
  choice: kapayapaan
  rationale: Tuwirang katumbas na nagpapanatili kapwa sa tungkulin nito bilang pagbati at sa mas malalim na kahulugang teolohikal.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Diyos na ating Ama
  rationale: Natural na Tagalog para sa ugnayang ipinahahayag ng parirala at malinaw na tinutukoy ang Diyos bilang ating Ama.
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang salin na nagpapanatili sa awtoridad at Kristolohikal na bigat ng κύριος.
- source_word: Χριστοῦ
  choice: Mesiyas
  rationale: Isinasalin ang titulo sa halip na basta hiramin ang tradisyonal na transliterasyong “Cristo,” upang maipahayag ang kahulugan ng Χριστός bilang ang Pinahiran.
theological_decisions:
- issue: Kung ang κλητοῖς ἁγίοις ay isasaling “tinawag na maging banal” o “mga tinawag na banal”
  choice: tinawag na maging banal
  alternative: mga tinawag na banal
  rationale: Walang tahasang infinitive na “maging” sa Griyego, ngunit kailangan ito para sa natural at malinaw na karaniwang Tagalog. Pinananatili sa talababa ang mas malapit na anyong panggramatika upang hindi maitago ang tunay na saklaw ng parirala.
- issue: Kung ang Χριστοῦ ay isasaling “Mesiyas” o “Cristo”
  choice: Mesiyas
  alternative: Cristo
  rationale: Gumaganap pa rito ang Χριστός bilang titulo. Ang “Mesiyas” ay malinaw na naghahatid ng kahulugang “ang Pinahiran,” samantalang ang “Cristo” ay tradisyonal na katawagang maaari ring gamitin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sa inyong lahat” upang maging malinaw na direktang kinakausap ang mga taga-Roma. Ang “Panginoong Jesus, ang Mesiyas” ay nagpapanatili sa titulo sa likas na ayos ng Tagalog; ang kuwit ay appositional at hindi nagpapahiwatig ng hiwalay na pinagmumulan ng biyaya at kapayapaan.
