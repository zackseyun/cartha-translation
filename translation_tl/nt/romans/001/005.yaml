  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: tl
  text: Sa pamamagitan niya ay tinanggap namin ang biyaya at pagkaapostol para sa pagsunod na kaugnay ng pananampalataya[a] sa gitna ng lahat ng bansa[b], alang-alang sa kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagsunod na bunga ng pananampalataya,” o “pagsunod na siyang pananampalataya.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa gitna ng lahat ng mga Hentil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Sa pamamagitan niya
  rationale: Ang διά na may genitive ay nagsasaad ng tagapamagitan o kasangkapan. Likas ito sa Filipino at malinaw na tumutukoy kay Jesu-Cristo sa naunang talata.
- source_word: ἐλάβομεν
  choice: tinanggap namin
  rationale: Pinananatili nito ang unang panauhang maramihan ng Griyego at hindi ipinapalagay kung retorikal o kolektibo ang gamit ni Pablo.
- source_word: χάριν καὶ ἀποστολὴν
  choice: ang biyaya at pagka-apostol
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pangngalan sa Griyego. Ang “pagka-apostol” ay tumutukoy sa tungkulin at pagkakasugong apostoliko nang hindi ito ginagawang isang denominasyonal na titulo.
- source_word: εἰς
  choice: upang magkaroon ng
  rationale: Ipinahahayag nito ang layunin o nilalayong bunga ng tinanggap na biyaya at pagka-apostol sa natural na Filipino.
- source_word: ὑπακοὴν πίστεως
  choice: pagsunod na kaugnay ng pananampalataya
  rationale: Hindi ganap na natural sa Filipino ang literal na “pagsunod ng pananampalataya.” Ang “kaugnay ng” ay sadyang hindi nagpapasiya kung ang pananampalataya ang pinagmumulan ng pagsunod o kung ang pagsunod mismo ay binubuo ng pananampalataya; inilalahad sa talababa ang mga pangunahing posibilidad.
- source_word: πίστεως
  choice: pananampalataya
  rationale: Ito ang karaniwan at teolohikong bukas na salin ng πίστις sa kontekstong ito.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: sa lahat ng bansa
  rationale: Pinananatili ang malawak na saklaw ng ἔθνη, samantalang inilalagay sa talababa ang posibleng kahulugang “mga Hentil.”
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: alang-alang sa kanyang pangalan
  rationale: Likas na ipinahahayag ng parirala ang layuning itaguyod ang karangalan at pagkakilala sa kanyang pangalan.
theological_decisions:
- issue: Kahulugan ng ὑπακοὴν πίστεως
  choice: pagsunod na kaugnay ng pananampalataya
  alternative: pagsunod na bunga ng pananampalataya; pagsunod na siyang pananampalataya
  rationale: Siksik at tunay na malabo ang ugnayan ng dalawang pangngalan sa Griyego. Pinananatiling bukas ng pangunahing teksto ang ugnayan at inilalahad sa talababa ang dalawang pangunahing interpretasyon sa halip na pumili ng isa.
- issue: Saklaw ng ἔθνεσιν
  choice: lahat ng bansa
  alternative: lahat ng Hentil
  rationale: Maaaring tumukoy ang salita sa mga bansa sa pangkalahatan o sa mga di-Judio. Ang pangunahing teksto ay gumagamit ng mas malawak na kahulugan, habang pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “pagka-apostol” upang mapanatili ang pangngalang ἀποστολή, at ang “kaugnay ng” upang hindi artipisyal na lutasin ang sadyang masiksik na pariralang ὑπακοὴν πίστεως. Ang mga panandang [a] at [b] ay parehong nasa pangunahing teksto at tumutugma sa mga talababa.
