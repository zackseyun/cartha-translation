revisions:
- from: Sa pamamagitan niya ay tinanggap namin ang biyaya at pagka-apostol upang magkaroon ng pagsunod na kaugnay ng pananampalataya[a] sa lahat ng bansa[b], alang-alang sa kanyang pangalan.
  to: Sa pamamagitan niya ay tinanggap namin ang biyaya at pagkaapostol para sa pagsunod na kaugnay ng pananampalataya[a] sa gitna ng lahat ng bansa[b], alang-alang sa kanyang pangalan.
  rationale: Pinalitan ang ‘upang magkaroon ng’ ng ‘para sa’ upang mas tuwirang maipahayag ang εἰς bilang layunin nang walang idinagdag na impersonal na konsepto. Pinalitan ang ‘sa lahat ng bansa’ ng ‘sa gitna ng lahat ng bansa’ upang maihatid ang ἐν (‘among’) nang mas malinaw. Hindi binago ang maingat na hindi pagpapasiya sa ὑπακοὴν πίστεως; ang mga talababa ay patuloy na nagbibigay ng pangunahing alternatibong pagbasa.
