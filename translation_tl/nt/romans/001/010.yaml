  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: tl
  text: Lagi akong humihiling sa aking mga panalangin na baka sakaling, sa wakas, sa kalooban ng Diyos, magtagumpay akong makarating sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “pagtagumpayin ako sa pagpunta sa inyo” o “magkaroon ako ng matagumpay na paglalakbay upang makarating sa inyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: Lagi
  rationale: Natural at tuwirang ipinahahayag nito ang palagiang gawain ni Pablo nang hindi ipinahihiwatig na walang patid ang pananalangin.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: sa aking mga panalangin
  rationale: Likas na pariralang Tagalog para sa konteksto kung kailan ginagawa ang paghiling.
- source_word: δεόμενος
  choice: humihiling
  rationale: Ipinapakita ang taimtim na pakiusap sa panalangin, ngunit hindi labis na pinatitingkad bilang pagmamakaawa.
- source_word: εἴ πως
  choice: na baka sakaling
  rationale: Pinananatili ang pagsasama ng pagnanais at kawalang-katiyakan sa hinihiling ni Pablo.
- source_word: ἤδη ποτὲ
  choice: sa wakas
  rationale: Ipinahahayag ang matagal nang inaasam na pagkakataon sa natural na modernong Tagalog.
- source_word: εὐοδωθήσομαι
  choice: magtagumpay akong makarating
  rationale: Inililipat ang kontekstuwal na diwa ng matagumpay na pag-usad o paglalakbay nang hindi nagmumungkahi ng pinansiyal na kasaganaan.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: sa kalooban ng Diyos
  rationale: Pinananatili ang anyong malapit sa Griyego at ang teolohikal na diwa na ang pagdating ay nakapaloob o nakasalalay sa kalooban ng Diyos.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: makarating sa inyo
  rationale: Natural sa Tagalog at hindi nagdaragdag ng espesipikong diwa ng pagdalaw na wala sa pandiwang Griyego.
theological_decisions:
- issue: Ugnayan ng tagumpay sa kalooban ng Diyos
  choice: sa kalooban ng Diyos, magtagumpay akong makarating
  alternative: sa pamamagitan ng kalooban ng Diyos ay mapagtagumpayan kong makarating
  rationale: Pinananatili ng salin ang kalooban ng Diyos bilang namamahalang kondisyon o saklaw ng inaasam na pagdating, nang hindi tiyak na nilulutas kung instrumental o sirkumstansiyal ang ἐν.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “baka sakaling” upang mapanatili ang pagnanais at kawalang-katiyakan, at iniwasan ang “umasenso” o “umunlad” dahil maaari itong magkaroon ng di-angkop na pinansiyal na kahulugan.
