  terminology: Ang “Diyos” at “tungkol sa Diyos” ay angkop. Pinalitan ang “malinaw/nilinaw” ng cognate na “hayag/inihayag” upang mas maipakita ang leksikal at semantikong ugnayan ng φανερόν at ἐφανέρωσεν nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
