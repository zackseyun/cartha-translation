  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: tl
  text: sapagkat ang maaaring malaman tungkol sa Diyos ay hayag sa gitna nila[a], sapagkat inihayag ito ng Diyos sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kanila” o “sa loob nila.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan para sa naunang pahayag at natural na nagpapakita ng ugnayang sanhi sa Filipino.
- source_word: τὸ γνωστὸν
  choice: ang maaaring malaman
  rationale: Ang pang-uring neuter na may artikulo ay ginagamit bilang pangngalan; pinananatili ng salin ang diwang tumutukoy sa kung ano ang maaaring malaman o maabot ng kaalaman.
- source_word: τοῦ θεοῦ
  choice: tungkol sa Diyos
  rationale: Ipinahahayag nito sa natural na Filipino na ang Diyos ang paksa o layon ng kaalamang tinutukoy.
- source_word: φανερόν
  choice: malinaw
  rationale: Karaniwan, dignipikado, at nauunawaang salita ito para sa isang bagay na hayag o madaling makilala.
- source_word: ἐν αὐτοῖς
  choice: sa gitna nila
  rationale: Pinipili nito ang posibleng panlipunan o pampublikong diwa ng parirala nang hindi isinasara ang posibleng panloob na kahulugan, na inilalagay sa talababa.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: dahil nilinaw ito sa kanila ng Diyos
  rationale: Pinananatili ang semantikong ugnayan ng φανερόν at ἐφανέρωσεν sa pamamagitan ng “malinaw/nilinaw,” habang natural ang ayos sa Filipino.
theological_decisions:
- issue: Kahulugan ng ἐν αὐτοῖς
  choice: sa gitna nila
  alternative: sa kanila; sa loob nila
  rationale: Tunay na maaaring tumukoy ang parirala sa pampubliko o panlipunang kalagayan, o sa isang bagay na nasa loob nila. Ginamit sa pangunahing teksto ang pampublikong diwa, ngunit pinanatili sa talababa ang panloob na posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw at dignipikado. Ang “sapagkat” ay angkop sa lohikal na daloy ng argumento; ang pag-uulit na “malinaw/nilinaw” ay sadyang nagpapanatili sa ugnayang leksikal ng tekstong Griyego.
