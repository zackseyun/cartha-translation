  source_fidelity: Tumpak ang pangunahing pagbibigay ng διότι, τὸ γνωστόν τοῦ θεοῦ, at ang alternatibong pagbasa ng ἐν αὐτοῖς. Gayunman, ang “nilinaw” ay mas karaniwang nangangahulugang pagpapaliwanag o paglilinaw ng dati nang malabo, samantalang ang ἐφανέρωσεν ay tumutukoy sa pagpapahayag o pagpapakita. Ang “inihayag” ay mas tuwirang tumutugon sa pandiwa at maaaring panatilihin ang ugnayan nito sa φανερόν sa pamamagitan ng “hayag.”
