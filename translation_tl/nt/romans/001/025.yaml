id: ROM.1.25
reference: Romans 1:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: tl
  text: Ipinagpalit nila ang katotohanan ng Diyos sa kasinungalingan, at sumamba at naglingkod sila sa sangnilikha sa halip na sa Maylikha, na siyang pinagpala magpakailanman. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: nagpalit
  rationale: Likas at tuwirang ipinahahayag ang sadyang pagpapalit ng isang bagay para sa iba.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: ang katotohanan tungkol sa Diyos
  rationale: Pinananatili ang posibleng diwa ng genitibo bilang katotohanang nauukol sa Diyos, nang hindi ito ginagawang mas abstrakto o doktrinal kaysa sa Griyego.
- source_word: ἐν τῷ ψεύδει
  choice: para sa kasinungalingan
  rationale: Sa kontekstong kasama ng μετήλλαξαν, ang pariralang ito ay natural na nagsasaad ng ipinagpalit na kapalit; ang tiyak na artikulo ay hindi kailangang tumbasan ng 'ang' sa Tagalog.
- source_word: ἐσεβάσθησαν
  choice: nagbigay-galang
  rationale: Ipinakikita ang debosyon o paggalang na panrelihiyon nang hindi ito ipinapareho nang lubos sa kasunod na 'naglingkod.'
- source_word: ἐλάτρευσαν
  choice: naglingkod
  rationale: Tumutukoy sa paglilingkod na panrelihiyon; pinananatili ang pagkakaiba nito sa naunang pandiwa.
- source_word: τῇ κτίσει
  choice: sa nilikha
  rationale: Saklaw nito ang sangnilikha o anumang nilalang bilang kabaligtaran ng Maylikha.
- source_word: παρὰ τὸν κτίσαντα
  choice: sa halip na sa Maylikha
  rationale: Malinaw na tinutumbasan ang paghahambing at pagpili na ipinahahayag ng παρά sa konteksto.
- source_word: εὐλογητὸς
  choice: pinupuri
  rationale: Sa doxolohikal na gamit tungkol sa Diyos, natural sa Tagalog ang 'pinupuri' at hindi nagpapahiwatig na tumatanggap siya ng pagpapalang kailangan niya.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Karaniwang dignified na katumbas ng idyomang tumutukoy sa walang hanggang pagpupuri.
theological_decisions:
- issue: Ugnayan ng 'katotohanan' at Diyos
  choice: katotohanan tungkol sa Diyos
  alternative: katotohanan ng Diyos
  rationale: Ang genitibong τοῦ θεοῦ ay maaaring unawain sa higit sa isang paraan. Ang napiling anyo ay natural sa modernong Tagalog at akma sa konteksto, habang ang alternatibo ay mas pormal ngunit maaaring maging malabo.
- issue: Diwa ng dalawang pandiwang panrelihiyon
  choice: nagbigay-galang at naglingkod
  alternative: sumamba at naglingkod
  rationale: Pinananatiling magkahiwalay ang σεβάζομαι at λατρεύω at iniiwasang gawing magkaparehong 'sumamba' ang dalawa; gayunman, ang paggalang dito ay malinaw na nasa kontekstong panrelihiyon.
- issue: Kahulugan ng παρά
  choice: sa halip na sa Maylikha
  alternative: higit kaysa sa Maylikha
  rationale: Maaaring magpahiwatig ang παρά ng paghahambing, ngunit sa konteksto ng pagpapalit sa katotohanan at kasinungalingan, malinaw na ipinapakita ng 'sa halip na' ang maling pag-ukol ng debosyon sa nilikha.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'Maylikha' bilang karaniwan at dignified na titulo, at pinanatili ang maikling doxolohiya at 'Amen.'
