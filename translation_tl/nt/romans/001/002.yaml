  source_fidelity: 'Tumpak na naipapahayag ng salin ang sugnay na tumutukoy sa ebanghelyo: ang Diyos ay nangako na nito noon pa sa pamamagitan ng sarili niyang mga propeta, at ang pangakong ito ay nasa mga banal na Kasulatan. Napananatili ang naunang-aspekto ng προεπηγγείλατο sa “dati pa niyang ipinangako,” ang instrumental na διὰ sa “sa pamamagitan ng,” at ang locative na ἐν sa “sa mga.”'
