id: ROM.1.2
reference: Romans 1:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: tl
  text: na dati pa niyang ipinangako sa pamamagitan ng kanyang mga propeta sa mga banal na Kasulatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga banal na sulatin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: na
  rationale: Iniuugnay ng panghalip na ito ang sugnay sa “ebanghelyo” sa Roma 1:1; natural sa Tagalog ang pang-ugnay na “na” sa loob ng nagpapatuloy na pangungusap.
- source_word: προεπηγγείλατο
  choice: dati pa niyang ipinangako
  rationale: Pinananatili ng “ipinangako” ang puwersa ng pangako, at ng “dati pa” ang diwa ng πρό- na tumutukoy sa naunang panahon.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: sa pamamagitan ng kanyang mga propeta
  rationale: Malinaw at likas na ipinahahayag nito ang mga propeta ng Diyos bilang mga kasangkapan o tagapamagitan ng naunang pangako.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: sa mga banal na Kasulatan
  rationale: Ang “Kasulatan” ay ang karaniwang dignified na tawag sa kinikilalang sagradong mga sulatin, habang pinananatili ng maramihang “mga” ang anyo ng γραφαῖς.
theological_decisions:
- issue: Kung ang γραφαῖς ἁγίαις ay isasaling “mga banal na Kasulatan” o “mga banal na sulatin”
  choice: mga banal na Kasulatan
  alternative: mga banal na sulatin
  rationale: Sa kontekstong Paulino, karaniwang tumutukoy ang γραφαί sa kinikilalang mga kasulatang sagrado. Gayunman, hindi ganap na nawawala ang mas literal na posibilidad na “mga banal na sulatin,” kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “dati pa niyang ipinangako” ay natural ngunit tumpak, at ang “mga banal na Kasulatan” ay pamilyar sa ordinaryong mambabasa nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
