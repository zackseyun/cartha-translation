id: ROM.1.8
reference: Romans 1:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: tl
  text: Una sa lahat, nagpapasalamat ako sa aking Diyos sa pamamagitan ni Jesus na Mesiyas[a] para sa inyong lahat, sapagkat ang inyong pananampalataya[b] ay ipinahahayag sa buong mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Jesucristo.
    reason: alternative_reading
  - marker: b
    text: O, katapatan; maaari ring pagtitiwala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Una sa lahat
  rationale: Ipinakikilala nito ang panimulang punto ni Pablo. Likas na isinasama sa pariralang Tagalog ang puwersa ng μὲν sa halip na isalin ito nang hiwalay.
- source_word: εὐχαριστῶ
  choice: nagpapasalamat ako
  rationale: Tuwiran nitong ipinahahayag ang pasasalamat at pinananatili ang personal na tono ng pandiwa.
- source_word: τῷ θεῷ μου
  choice: sa aking Diyos
  rationale: Pinananatili ang payak na anyong paari at ang personal na debosyonal na tono ni Pablo.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: sa pamamagitan ni Jesus na Mesiyas
  rationale: Ang διά na sinusundan ng genitive ay nagpapahiwatig ng paraan o pamamagitan. Isinalin ang Χριστός bilang titulong “Mesiyas,” habang ang “na” ay likas na nag-uugnay sa pangalan at titulo sa Tagalog.
- source_word: περὶ πάντων ὑμῶν
  choice: para sa inyong lahat
  rationale: Sa konteksto ng pasasalamat, natural na ipinahahayag ng “para sa” ang diwa ng περί nang hindi nagiging matigas ang pangungusap.
- source_word: ἡ πίστις ὑμῶν
  choice: ang inyong pananampalataya
  rationale: Ang “pananampalataya” ang pinakamalinaw na pangunahing katumbas ng πίστις dito; pinananatili sa talababa ang posibleng mga diwang katapatan at pagtitiwala.
- source_word: καταγγέλλεται
  choice: ay ipinahahayag
  rationale: Pinananatili nito ang tinig na balintiyak at ang diwa ng hayagang pagpapakilala o pagpapahayag; ang kasalukuyang aspekto ay maaaring magpahiwatig ng nagpapatuloy na pagkilos.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: sa buong mundo
  rationale: Natural at malawak ang saklaw ng pariralang Tagalog, katulad ng retorikal na saklaw ng κόσμος sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa Χριστοῦ sa διὰ Ἰησοῦ Χριστοῦ
  choice: Jesus na Mesiyas
  alternative: Jesucristo
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas” upang maipahayag ang kahulugan nito, sa halip na umasa lamang sa nakaugaliang anyong “Cristo.” Inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Pagpapakahulugan sa πίστις sa ἡ πίστις ὑμῶν
  choice: pananampalataya
  alternative: katapatan; pagtitiwala
  rationale: Pinakamalamang na tinutukoy rito ang kilalang paniniwala ng mga taga-Roma, ngunit maaari ring taglayin ng πίστις ang mga diwa ng katapatan o pagtitiwala; hindi ipinipinid ang mga iyon at inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Una sa lahat” bilang likas na panimulang pahayag, at pinanatili ang balintiyak na anyo sa “ay ipinahahayag.” Ang mga pananda ng talababa ay inilagay kaagad pagkatapos ng mga salitang tinutukoy ng mga ito.
