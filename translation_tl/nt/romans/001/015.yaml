  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: tl
  text: Kaya, sa ganang akin, sabik akong ipahayag ang magandang balita[a] sa inyo ring nasa Roma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipangaral ang ebanghelyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kaya
  rationale: Ginagamit dito bilang pang-ugnay na naghahayag ng bunga o kongklusyon mula sa naunang paliwanag ni Pablo.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: sa ganang akin, sabik ako
  rationale: Ang pariralang Griyego ay eliptikal at tumutukoy sa kusang-loob at masigasig na kahandaan ni Pablo; ipinahahayag ng “sabik” ang higit pa sa pagiging basta handa lamang.
- source_word: καὶ ὑμῖν
  choice: sa inyo rin
  rationale: Pinananatili ng “rin” na kasama ang mga nasa Roma sa iba pang mga taong nais pagbalitaan ni Pablo.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: nasa Roma
  rationale: Likas at tuwirang pagtukoy ito sa mga kausap ni Pablo na naninirahan o naroroon sa Roma.
- source_word: εὐαγγελίσασθαι
  choice: ipahayag ang magandang balita
  rationale: Saklaw nito ang pagpapahayag ng mabuting balita nang hindi nililimitahan ang kilos sa pormal na pangangaral lamang.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ganang akin” upang mapanatili ang idiomatikong diin ng κατ’ ἐμέ, at inilapit ang “rin” sa mga tumatanggap upang masalamin ang καὶ ὑμῖν.
