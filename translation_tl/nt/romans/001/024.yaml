  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: tl
  text: Kaya ipinaubaya sila ng Diyos, sa mga pagnanasa ng kanilang mga puso, sa karumihan, para sa paglapastangan sa kanilang mga katawan sa isa’t isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gitna nila”; maaari ring “sa kanilang sarili.”
    reason: Pinananatili ang kalabuan ng ἐν αὐτοῖς, na maaaring tumukoy sa panlipunan/resiprokal na ugnayan, sa kanila bilang pangkat, o sa kanilang sarili.
lexical_decisions:
- source_word: Διὸ
  choice: Kaya
  rationale: Malinaw at likas na ipinahihiwatig ang kongklusyon o bunga ng naunang pangangatwiran.
- source_word: παρέδωκεν
  choice: ibinigay sila
  rationale: Pinananatili ang diwa ng paghahandog o pagbibigay sa kapangyarihan ng isang kalagayan, nang hindi ito pinalalakas tungo sa interpretatibong ‘tuluyang pinabayaan.’
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: sa gitna ng mga pagnanasa ng kanilang mga puso
  rationale: Ipinakikita ang mga pagnanasa bilang saklaw o konteksto ng pagbibigay sa kanila, habang pinananatili ang biblikal na larawang ‘mga puso.’
- source_word: ἐπιθυμίαις
  choice: mga pagnanasa
  rationale: Sapat na malawak upang hindi agad limitahan ang salita sa seksuwal na pagnanasa lamang.
- source_word: ἀκαθαρσίαν
  choice: karumihan
  rationale: Natural at dignified na salitang Filipino para sa moral na kawalang-kalinisan.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: upang malapastangan
  rationale: Likas sa Filipino at pinananatili ang pasibong diwa; ang ‘upang’ ay maaari pa ring magpahiwatig ng layunin o kinalabasan ayon sa konteksto.
- source_word: τὰ σώματα αὐτῶν
  choice: ang kanilang mga katawan
  rationale: Tuwirang pinananatili ang kongkretong diin ng teksto sa katawan.
- source_word: ἐν αὐτοῖς
  choice: sa kanilang magkakasama
  rationale: Ipinahahayag ang malamang na panlipunan o resiprokal na diwa, habang inilalagay sa talababa ang ibang posibleng pagbasa.
theological_decisions:
- issue: Kung palalakasin ang παρέδωκεν bilang tahasang hatol o ganap na pag-abandona ng Diyos
  choice: ibinigay sila ng Diyos
  alternative: pinabayaan sila ng Diyos bilang hatol
  rationale: Mabigat ang kilos ng Diyos sa teksto, ngunit hindi dinaragdagan ng salin ang pandiwa ng isang mas ganap na sistematikong paliwanag.
- issue: Kung ang τοῦ ἀτιμάζεσθαι ay tiyak na layunin o kinalabasan
  choice: upang malapastangan
  alternative: na nauwi sa paglapastangan
  rationale: Hindi tahasang nilulutas ang posibleng tensiyon sa pagitan ng layunin at kinalabasan; pinananatili rin ang pasibong anyo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga biblikal na katawagang “mga puso,” “karumihan,” at “mga katawan,” at iniwasan ang denominasyonal o sobrang interpretatibong pagpapaliwanag.
