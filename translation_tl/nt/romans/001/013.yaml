revisions:
- from: Ayaw kong hindi ninyo malaman, mga kapatid[a], na maraming beses ko nang binalak na pumunta sa inyo, ngunit nahadlangan ako hanggang ngayon, upang magkaroon din ako ng ilang bunga sa gitna ninyo[b], gaya sa iba pang mga Hentil[c].
  to: Nais kong malaman ninyo, mga kapatid[a], na maraming beses ko nang binalak na pumunta sa inyo, ngunit nahadlangan ako hanggang ngayon, upang magkaroon din ako ng ilang bunga sa gitna ninyo, gaya rin ng mayroon ako sa iba pang mga Hentil[c][b].
  rationale: Pinalitan ang hindi likas na dobleng negasyon ng natural na Tagalog na katumbas ng kahulugan ng pormula ni Pablo. Nilinaw rin ang paghahambing sa hulihan upang ang “bunga” ang malinaw na nauugnay kapwa sa mga taga-Roma at sa iba pang mga Hentil. Hindi tinukoy ang sanhi ng paghadlang o ang eksaktong anyo ng “bunga.”
