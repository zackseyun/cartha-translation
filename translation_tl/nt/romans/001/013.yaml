id: ROM.1.13
reference: Romans 1:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: tl
  text: Nais kong malaman ninyo, mga kapatid[a], na maraming beses ko nang binalak na pumunta sa inyo, ngunit nahadlangan ako hanggang ngayon, upang magkaroon din ako ng ilang bunga sa gitna ninyo, gaya rin ng mayroon ako sa iba pang mga Hentil[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid” ay tumutukoy rito sa mga kapatid sa pananampalataya, kapwa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “bunga” ay tumutukoy sa mga resulta ng paglilingkod ni Pablo sa gitna nila.
    reason: cultural_note
  - marker: c
    text: O “ibang mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Ayaw kong hindi ninyo malaman
  rationale: Pinananatili ang negatibong anyo ng pormula ni Pablo, habang malinaw at natural pa rin sa modernong Tagalog.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na katawagan sa Tagalog para sa magkakapatid sa pananampalataya at maaari ring tumukoy sa kapwa lalaki at babae; nililinaw ito sa talababa.
- source_word: πολλάκις προεθέμην
  choice: maraming beses ko nang binalak
  rationale: Ipinahahayag ang paulit-ulit na naunang balak na umaabot sa kasalukuyang punto ng salaysay.
- source_word: ἐκωλύθην
  choice: nahadlangan ako
  rationale: Pinananatili ang balintiyak na diwa at hindi tinutukoy kung sino o ano ang humadlang, gaya ng Griyego.
- source_word: ἄχρι τοῦ δεῦρο
  choice: hanggang ngayon
  rationale: Natural at tumpak na salin ng idyomatikong panandang temporal.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: upang magkaroon din ako ng ilang bunga
  rationale: Pinananatili ang metaporang agrikultural at ang di-tiyak na τινά, nang hindi tahasang nilulutas kung anong uri ng bunga ang tinutukoy.
- source_word: ἐν ὑμῖν
  choice: sa gitna ninyo
  rationale: Likas na ipinahahayag ang bunga ng gawain ni Pablo sa loob ng pamayanang Romano, sa halip na literal na “sa inyo.”
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: iba pang mga Hentil
  rationale: Sa konteksto ng misyon ni Pablo, malamang na tumutukoy ang ἔθνη sa mga taong hindi Judio; ang “iba pang” ay nagpapahiwatig na kabilang ang mga taga-Roma sa mas malawak na larangang ito.
theological_decisions:
- issue: Kahulugan ng καρπός (bunga)
  choice: Pinanatili sa pangunahing teksto ang “bunga.”
  alternative: “ani” o “mga resulta ng aking paglilingkod”
  rationale: Hindi espesipikong tinutukoy ng talata kung ang bunga ay mga nahikayat, paglago sa pananampalataya, o iba pang kinalabasan ng ministeryo; pinananatili ng metapora ang saklaw ng kahulugan.
- issue: Saklaw ng ἔθνη
  choice: mga Hentil
  alternative: mga bansa
  rationale: Mas malamang sa kontekstong Paulino na etnorelihiyosong mga hindi Judio ang tinutukoy, ngunit itinatala sa talababa ang lehitimong alternatibong “mga bansa.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang negatibong pormula, ang balintiyak na “nahadlangan,” at ang metaporang “bunga” upang hindi lampasan ang sinasabi ng pinagmulang Griyego.
