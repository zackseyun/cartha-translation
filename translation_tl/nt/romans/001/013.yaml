  source_fidelity: Tumpak na naipapahayag ng draft ang paulit-ulit na layunin ni Pablo, ang hindi tinukoy na humadlang sa kanya, ang saklaw na “hanggang ngayon,” at ang metaporang “bunga.” Gayunman, ang paghahambing sa hulihan ay kailangang gawing mas malinaw sa Tagalog upang maipakita ang “gaya rin ng [bunga] sa iba pang mga Hentil.”
  naturalness: Ang “Ayaw kong hindi ninyo malaman” ay nauunawaan ngunit hindi likas sa marangal na modernong Tagalog dahil sa sunod na negasyon. Mas natural ang “Nais kong malaman ninyo,” na buong tapat na naghahatid ng kontekstuwal na kahulugan ng Griyegong pormula. Ang “gaya sa” ay hindi rin ganap na natural sa pangungusap na ito.
  terminology: Ang “mga kapatid,” “nahadlangan,” “bunga,” at “mga Hentil” ay angkop. Pinananatili ng “mga Hentil” ang malamang na etnorelihiyosong gamit ng ἔθνη sa kontekstong ito, samantalang ang talababa ay nagbibigay ng alternatibo.
  issues:
