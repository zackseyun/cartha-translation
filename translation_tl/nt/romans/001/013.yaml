    rationale: Bagaman sinusubukan nitong panatilihin ang negatibong pormula, ang dobleng negasyon ay mabigat at hindi karaniwan sa modernong Tagalog. Maaaring isalin ang diwa nang natural bilang “Nais kong malaman ninyo” nang hindi nadaragdagan ang kahulugan.
  - severity: medium
    issue: Kulang sa linaw ang “gaya sa iba pang mga Hentil.”
    rationale: Ang καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν ay paghahambing sa pagkakaroon ni Pablo ng bunga sa iba pang mga Hentil. Ang “gaya rin ng mayroon ako sa iba pang mga Hentil” ay mas malinaw at natural, habang ang “mayroon ako” ay tumutukoy pabalik sa “ilang bunga.”},{
