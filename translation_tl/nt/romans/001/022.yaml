lexical_decisions:
- source_word: φάσκοντες
  choice: Habang iginigiit nilang
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang patuloy na paggigiit o pag-aangkin nila tungkol sa sarili; natural sa makabagong Tagalog ang pariralang ito at nananatili ang mapanuyang diin.
- source_word: εἶναι
  choice: sila
  rationale: Ang diwang 'maging' ay likas na naipapahayag sa sugnay na Tagalog sa pamamagitan ng panghalip at panaguring 'marurunong,' nang hindi na kailangan ang hiwalay na katumbas ng infinitive.
- source_word: σοφοὶ
  choice: marurunong
  rationale: Pinananatili nito ang pangmaramihang pagtukoy at ang pagsusuri sa sarili na taglay ng salitang Griyego, sa natural at dignified na Tagalog.
- source_word: ἐμωράνθησαν
  choice: naging mga hangal sila
  rationale: Ipinapakita ng 'naging' ang pagpasok sa isang kalagayan, samantalang pinananatili ng 'mga hangal' ang matalim na personal na pagtutunggali sa 'marurunong.' Hindi nito ipinapasya kung ang anyo ay dapat unawain bilang tahasang pasibo.
theological_decisions:
- issue: Kung ang ἐμωράνθησαν ay tumutukoy sa katangiang moral ('naging mangmang') o sa mas matinding pagtawag sa kanila bilang mga hangal
  choice: naging mga hangal sila
  alternative: naging mangmang sila; itinuring silang mga hangal
  rationale: 'Matalim at antitetikal ang retorika ni Pablo: habang inaangkin nila ang karunungan, naging mga hangal sila. Pinananatili ng salin ang puwersang ito nang hindi nagdaragdag ng paliwanag na doktrinal o tahasang tagaganap ng kilos.'
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang 'iginigiit' para sa mapuwersang pag-aangkin ng φάσκοντες at ang magkatapat na 'marurunong' at 'mga hangal' upang mapanatili ang maikli at matalim na ironya ng orihinal.
