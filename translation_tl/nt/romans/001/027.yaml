  - severity: low
    issue: Maaaring mabasa ang “gumawa ng kahalayan sa kapwa lalaki” bilang kilos na nakatuon laban sa kapwa lalaki kaysa bilang magkatuwang na kilos.
    rationale: Ang ἐν ἄρσεσιν ay nagpapahayag ng ugnayang “with/among males.” Ang “kasama ng kapwa lalaki” ay nililinaw ito nang hindi tinutukoy ang gawa nang higit sa ἀσχημοσύνη.
