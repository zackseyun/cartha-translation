  terminology: Ang “mga lalaki,” “babae,” “pakikipagtalik,” “kahalayan,” “ganting nararapat,” at “pagkaligaw” ay angkop sa rehistro at sapat na nagpapahayag ng mga terminong Griyego nang hindi nag-o-overinterpret. Ang “pakikipagtalik sa babae” ay isang natural na kontekstuwal na salin ng φυσικὴ χρῆσις τῆς θηλείας; pinananatili ng talababa ang mas literal na alternatibo.
