id: ROM.1.27
reference: Romans 1:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: tl
  text: Gayundin, iniwan ng mga lalaki ang likas na pakikipagtalik sa babae[a] at nag-alab sila sa pagnanasa sa isa’t isa—mga lalaking gumagawa ng kahalayan kasama ng kapwa lalaki at tumatanggap sa mismong sarili nila ng ganting nararapat sa kanilang pagkaligaw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “ang likas na paggamit sa babae.” Dito, ang salitang “paggamit” ay tumutukoy sa seksuwal na pakikipag-ugnayan.'
    reason: lexical_alternative
  - marker: b
    text: Ang “pagkaligaw” ay maaari ding isaling “pagkakamali” o “paglihis”; ang “ganti” ay maaari ding “kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: mga lalaki / babae
  rationale: Pinananatili nito ang tahasang pagtukoy ng Griyego sa kasariang lalaki at babae. Sa Filipino, ang “lalaki” at “babae” ang pinakanatural na katumbas, bagaman hindi ganap na naihihiwalay ng mga salitang ito ang biyolohikal na diwa sa kahulugang “man/woman.”
- source_word: ἀφέντες
  choice: iniwan
  rationale: Malinaw at natural itong nagsasaad ng pagtalikod o pag-iwan sa naunang gawain, habang naipakikita ng ayos ng pangungusap na nauna ito sa pag-aalab ng pagnanasa.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: ang likas na pakikipagtalik sa babae
  rationale: Sa konteksto, seksuwal ang diwa ng χρῆσις. Ang “pakikipagtalik” ay malinaw at likas sa modernong Filipino; ang mas literal na “paggamit sa babae” ay maaaring magpahiwatig ng instrumental na pakahulugang hindi kailangang idagdag ng salin.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: nag-alab ang pagnanasa nila
  rationale: Pinananatili ng “nag-alab” ang matinding larawang-diwa ng pandiwa, samantalang ang “pagnanasa” ay tumutugma sa ὄρεξις nang hindi ito labis na pinatitingkad.
- source_word: εἰς ἀλλήλους
  choice: sa isa’t isa
  rationale: Ito ang natural na Filipino para sa katumbasang ipinahahayag ng reciprocal pronoun.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: ang mga lalaki ... sa kapwa lalaki
  rationale: Pinananatili ang pag-uulit ng salitang tumutukoy sa lalaki at ang retorikal na diin nito, nang hindi nagdaragdag ng makabagong katawagang wala sa teksto.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: gumawa ng kahalayan
  rationale: Naipahahayag ng “kahalayan” ang moral na bigat ng ἀσχημοσύνη, ngunit hindi nito tinutukoy nang higit sa sinasabi ng teksto ang eksaktong gawain.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: ang ganting nararapat
  rationale: Inilalahad nito ang ideya ng katumbas at angkop na balik o bunga. Hindi nito tahasang nilulutas kung ang tinutukoy ay isang partikular na parusa o mas malawak na kahihinatnan.
- source_word: τῆς πλάνης αὐτῶν
  choice: sa kanilang pagkaligaw
  rationale: Ang “pagkaligaw” ay nagpapanatili sa saklaw ng πλάνη bilang paglihis o pagkakamali, sa halip na paliitin ito sa intelektuwal na pagkakamali lamang.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: tinanggap sa mismong sarili nila
  rationale: Pinananatili nito ang reflexive na diin ng ἑαυτοῖς nang hindi ipinapasiya kung paano o sa anong tiyak na paraan natanggap ang ganti.
theological_decisions:
- issue: Kung gagamit ng relasyonal o makabagong katawagan sa halip na mga salitang tahasang tumutukoy sa kasarian
  choice: mga lalaki ... babae ... kapwa lalaki
  alternative: mga homoseksuwal na lalaki; mga lalaki ... mga babae
  rationale: Ang Griyego ay gumagamit ng mga terminong markado ayon sa kasarian at hindi ng katawagang tumutukoy sa identidad o oryentasyon. Pinananatili ng salin ang saklaw ng pinagmulan at iniiwasang magdagdag ng kategoryang wala rito.
- issue: Kung gagawing tiyak na “parusa” ang ἀντιμισθία
  choice: ganting nararapat
  alternative: nararapat na parusa; kaukulang kabayaran
  rationale: Maaaring may maparusang diwa ang konteksto, ngunit ang salita ay pangunahing tumutukoy sa katumbas na ganti o kabayaran. Pinananatili ng “ganting nararapat” ang moral na bigat at ang kaunting kaluwagan ng salita.
- issue: Kung tutukuyin ang eksaktong anyo ng kahalayan o ganti
  choice: gumawa ng kahalayan ... tinanggap sa mismong sarili nila
  alternative: gumawa ng homoseksuwal na gawain ... dumanas ng pisikal na kaparusahan
  rationale: Hindi tahasang tinutukoy ng talata ang isang makabagong etiketa ni ang tiyak na anyo ng ganti. Ang salin ay hindi nagdaragdag ng paliwanag na doktrinal o medikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang labis na teknikal o makabagong katawagang pang-identidad. Hinati sa dalawang pangungusap upang maging madaling basahin, habang pinananatili ang lohikal na ugnayan, pag-uulit, at moral na tensiyon ng Griyego.
