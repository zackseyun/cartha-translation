id: ROM.1.3
reference: Romans 1:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: tl
  text: hinggil sa kanyang Anak, na nagmula sa lahi[a] ni David ayon sa laman[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “binhi ni David”; tumutukoy ito sa kanyang angkan o salinlahi.
    reason: lexical_alternative
  - marker: b
    text: Ang “ayon sa laman” dito ay tumutukoy sa makataong angkan o makalupang pinagmulan, hindi sa makasalanang kalikasan.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: hinggil sa
  rationale: Ipinakikilala nito ang nilalaman ng ebanghelyong binanggit sa naunang talata; pormal ngunit natural ang “hinggil sa” sa makabagong Filipino.
- source_word: υἱοῦ αὐτοῦ
  choice: kanyang Anak
  rationale: Malinaw sa konteksto na Anak ng Diyos ang tinutukoy. Ginamit ang malaking titik bilang paglilinaw sa tinutukoy, hindi bilang pagdaragdag sa kahulugan ng salitang Griyego.
- source_word: τοῦ γενομένου
  choice: na nagmula
  rationale: Naipahahayag nito ang pinagmulan o angkan nang hindi nililimitahan ang pandiwa sa mismong pagsilang lamang.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: sa lahi ni David
  rationale: Ang σπέρμα ay literal na “binhi” ngunit tumutukoy rito sa angkan o salinlahi. Mas natural at malinaw sa karaniwang Filipino ang “lahi,” habang inilalagay sa talababa ang literal na larawan.
- source_word: κατὰ σάρκα
  choice: ayon sa laman
  rationale: Pinananatili ang siksik at teolohikal na mahalagang pananalita ni Pablo sa halip na agad itong ipakahulugang “bilang tao” o “ayon sa kanyang kalikasang pantao.”
theological_decisions:
- issue: Ang ugnayan ng pagiging Anak ng Diyos at ng pagkamula sa angkan ni David
  choice: 'Tuwirang panatilihin ang parehong pahayag: “kanyang Anak” at “nagmula sa lahi ni David ayon sa laman.”'
  alternative: Ipaliwanag sa pangunahing teksto bilang “tungkol sa kanyang kalikasang pantao” o pay simpleng “inapo ni David.”
  rationale: Magkasamang ipinapahayag ng talata ang pagiging Anak at ang tunay na makataong angkang Davidiko nang hindi ipinapaliwanag ang metapisikal na ugnayan ng mga ito. Hindi dapat lutasin ng salin ang tensiyong sadyang nananatili sa teksto.
- issue: Kahulugan ng “laman” sa pariralang κατὰ σάρκα
  choice: Panatilihin ang “ayon sa laman” at linawin sa talababa ang kahulugan nito sa konteksto.
  alternative: Isalin nang tuwiran bilang “ayon sa kanyang lahing pantao.”
  rationale: Pinananatili nito ang mahalagang bokabularyo ni Pablo at ang bahagyang kasiksikan ng orihinal, habang iniiwasan ng talababa ang maling pagkaunawa na tumutukoy ito sa makasalanang kalikasan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong parirala at pangwakas na kuwit dahil bahagi ito ng mas mahabang pangungusap sa Roma 1:1–7. Ang “hinggil sa” ay angkop sa pormal na liham, samantalang ang “nagmula sa lahi” ay natural na genealogical na pananalita.
