  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: tl
  text: Dahil dito, ipinaubaya sila ng Diyos sa mga kahiya-hiyang pagnanasa, sapagkat maging ang kanilang mga babae[a] ay ipinagpalit ang likas na ugnayang seksuwal[b] sa hindi ayon sa kalikasan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “mga babaeng nilalang.”
    reason: lexical_alternative
  - marker: b
    text: O, mas literal, “ang likas na paggamit.”
    reason: lexical_alternative
  - marker: c
    text: O, “sa salungat sa kalikasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Dahil dito
  rationale: Likas na panandang sanhi sa modernong Tagalog at malinaw na nag-uugnay sa talata sa naunang pangangatwiran.
- source_word: παρέδωκεν
  choice: ipinaubaya
  rationale: Pinananatili ang diwa ng pagbibigay o pagpapasailalim sa isang kalagayan, nang hindi ipinahihiwatig na simpleng iniwan lamang sila ng Diyos.
- source_word: πάθη ἀτιμίας
  choice: mga kahiya-hiyang pagnanasa
  rationale: Pinananatili ang tahasang negatibong pagtataya ng ἀτιμία at malinaw na ipinahahayag ang matinding pagnanasa ng πάθη.
- source_word: θήλειαι
  choice: mga babae
  rationale: Natural na tawag sa mga taong may kasariang babae sa modernong Tagalog; inilalagay sa talababa ang mas literal na anyo upang mapanatili ang ugnayan nito sa pares na babae at lalaki sa kasunod na talata.
- source_word: μετήλλαξαν
  choice: ipinagpalit
  rationale: Tuwirang ipinahahayag ang sinasadyang pagpapalit na taglay ng pandiwa.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: ang likas na pakikipag-ugnayan
  rationale: Nananatiling mahinahon at nauunawaan sa kontekstong seksuwal, habang iniiwasan ang alanganin at maaaring mapanlinlang na literal na 'likas na paggamit.'
- source_word: τὴν παρὰ φύσιν
  choice: sa hindi ayon sa kalikasan
  rationale: Pinananatili ang eliptikal na pagkakasabi ng Griyego at ang paghahambing nito sa 'likas,' nang hindi nagdaragdag ng makabagong kategoryang hindi tahasang binanggit.
theological_decisions:
- issue: Kung pahihinain o paiigtingin ang moral na pagtataya ni Pablo
  choice: Panatilihin ang 'kahiya-hiyang' at 'hindi ayon sa kalikasan' nang walang dagdag na paliwanag.
  alternative: Gumamit ng mas banayad na pananalita o magdagdag ng mas tiyak na makabagong katawagan.
  rationale: May sarili nang moral na pagtataya ang talata. Dapat itong panatilihin ng salin, ngunit hindi dapat dagdagan ng mga kategorya o doktrinang lampas sa mismong sinabi ng teksto.
- issue: Lawak ng kahulugan ng χρῆσις sa konteksto
  choice: Isalin bilang 'pakikipag-ugnayan' at panatilihin sa talababa ang literal na 'paggamit.'
  alternative: Isalin sa pangunahing teksto bilang 'paggamit' o tahasang 'pakikipagtalik.'
  rationale: Ang konteksto ay seksuwal, ngunit ang salitang Griyego ay isang mahinahong pahayag. Ang 'pakikipag-ugnayan' ay nababasa nang natural at hindi ginagawang higit na tahasan ang teksto kaysa sa pinagmulan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mahinahong paraan ng pagtukoy ng Griyego sa seksuwal na ugnayan, pati ang malinaw na moral na bigat ng mga pariralang πάθη ἀτιμίας at παρὰ φύσιν.
