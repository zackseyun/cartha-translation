  to: Dahil dito, ipinaubaya sila ng Diyos sa mga kahiya-hiyang pagnanasa, sapagkat maging ang kanilang mga babae[a] ay ipinagpalit ang likas na ugnayang seksuwal[b] sa hindi ayon sa kalikasan[c].
  rationale: Pinalitan ang pangkalahatang “pakikipag-ugnayan” ng “ugnayang seksuwal” upang malinaw na maihatid ang seksuwal na sanggunian ng χρῆσις sa konteksto, nang hindi nagdaragdag ng partikular na gawa o makabagong kategoryang wala sa teksto. Pinagdugtong din ang mga sugnay upang maipakita ang paliwanag na puwersa ng γάρ. Nananatili ang lahat ng ambigwidad at ang mga talababa ng leksikal na alternatibo.
