id: ROM.1.20
reference: Romans 1:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: tl
  text: Sapagkat ang kanyang mga di-nakikitang katangian[a]—ang kanyang walang-hanggang kapangyarihan at pagka-Diyos[b]—ay malinaw na nakikita mula pa nang likhain ang mundo, sa pamamagitan ng pag-unawa sa mga nilikha, kaya wala silang maidadahilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagay tungkol sa kanya na hindi nakikita.”
    reason: lexical_alternative
  - marker: b
    text: O “kalikasang banal.” Ang salitang Griyego rito ay θειότης, hindi ang mas mariing katawagang θεότης.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ang kanyang mga katangiang hindi nakikita
  rationale: Ang neuter plural ay tumutukoy nang malawakan sa mga di-nakikitang bagay o katangian tungkol sa Diyos. Nililinaw ng “mga katangian” ang diwa nang hindi ito ginagawang mga di-nakikitang bagay na hiwalay sa kanya.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: mula pa nang likhain ang mundo
  rationale: Ipinahihiwatig ng ἀπό ang panahong nagsimula sa paglikha at nagpapatuloy hanggang sa kasalukuyan. Natural sa modernong Tagalog ang “mula pa nang.”
- source_word: τοῖς ποιήμασιν
  choice: sa pamamagitan ng mga bagay na nilikha
  rationale: 'Ginagamit dito ang dative bilang instrumento: ang mga nilikha ang paraang pinagmumulan ng pagkaunawa sa hindi nakikita.'
- source_word: νοούμενα
  choice: nauunawaan
  rationale: 'Pinananatili nito ang kognitibong diwa ng participle: ang hindi nakikita ay nahihinuha o nauunawaan sa isip mula sa nilikha.'
- source_word: καθορᾶται
  choice: malinaw nang nakikita
  rationale: Ipinapahayag ng pandiwa ang malinaw na pagkapansin, at ang “nang” ay nagpapakitang totoo ito mula pa sa paglikha hanggang ngayon.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: ang kanyang walang-hanggang kapangyarihan
  rationale: Ang parirala ay paglilinaw sa mga katangiang hindi nakikita. Ang “walang-hanggan” ay natural at tapat sa ἀΐδιος.
- source_word: θειότης
  choice: pagka-Diyos
  rationale: Tumutukoy ito sa banal o maka-Diyos na kalidad at hindi gumagamit ng mas mariing ontolohikal na katawagan. Ang “pagka-Diyos” ay maikli, natural, at napapanatili ang kaibhan nito sa θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Kaya wala silang maidadahilan
  rationale: Ipinapahayag ng konstruksyon ang bunga. Malinaw at natural sa Tagalog ang “kaya,” habang pinananatili ng “wala silang maidadahilan” ang pananagutang ipinahihiwatig ng ἀναπολογήτους.
theological_decisions:
- issue: Pagsasalin sa θειότης nang hindi pinatitindi ang sinabi ni Pablo
  choice: pagka-Diyos
  alternative: kalikasang banal; pagka-Diyos na likas
  rationale: Tunay na ipinahahayag ng talata na nahahayag sa sangnilikha ang tungkol sa pagiging Diyos ng Diyos, ngunit ang θειότης ay tumutukoy sa banal na kalidad at naiiba sa mas mariing θεότης. Hindi dapat palabuin ang leksikal na kaibhang iyon.
- issue: Ugnayan ng malinaw na pagkakita at pagkaunawa
  choice: malinaw nang nakikita at nauunawaan
  alternative: malinaw na nakikita dahil nauunawaan
  rationale: Pinananatili ng salin ang tensyon ng di-nakikitang mga katangiang “nakikita” sa pamamagitan ng pag-unawa, nang hindi labis na tinutukoy kung sanhi, paraan, o kasabay na kilos ang participle.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mundo” sa halip na mas mataas na “sanlibutan,” at hinati sa dalawang pangungusap upang maging malinaw ang resultang sugnay. Ang mga gitling na pahaba ay nagpapakita na ang “walang-hanggang kapangyarihan at pagka-Diyos” ay pagpapaliwanag sa “mga katangiang hindi nakikita.”
