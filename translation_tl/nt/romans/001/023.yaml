base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: tl
  text: at ipinagpalit nila ang kaluwalhatian ng Diyos na hindi nasisira[a] sa wangis ng larawan[b] ng taong nasisira[c], ng mga ibon, ng mga hayop na may apat na paa, at ng mga gumagapang na nilalang[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Diyos na walang pagkabulok.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “sa mga larawang kawangis ng.” Sa Griyego, parehong ginagamit dito ang mga salitang tumutukoy sa wangis at larawan.
    reason: lexical_alternative
  - marker: c
    text: O “taong mortal.”
    reason: lexical_alternative
  - marker: d
    text: O “mga bagay na gumagapang”; maaaring mas malawak ang saklaw nito kaysa sa “mga reptilya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: ipinagpalit nila
  rationale: Ipinahahayag nito ang sinasadyang pagpapalit ng kaluwalhatian ng Diyos para sa isang nilikhang wangis.
- source_word: δόξαν
  choice: kaluwalhatian
  rationale: Ito ang likas at kinikilalang salin sa kontekstong tumutukoy sa kadakilaan at karangalan ng Diyos.
- source_word: ἀφθάρτου
  choice: hindi nasisira
  rationale: Pinananatili nito ang tuwirang pagsalungat sa φθαρτοῦ habang malinaw sa karaniwang mambabasa.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: sa wangis ng larawan
  rationale: Pinananatili ang magkaugnay ngunit magkahiwalay na ideya ng ὁμοίωμα at εἰκών, pati ang isahang anyo ng parirala.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: taong nasisira
  rationale: Tuwirang itinatapat ang φθαρτοῦ sa ἀφθάρτου at pinananatili ang isahang ἀνθρώπου nang hindi nililimitahan sa kasariang lalaki.
- source_word: πετεινῶν
  choice: mga ibon
  rationale: Ito ang malinaw at natural na katumbas sa modernong Tagalog.
- source_word: τετραπόδων
  choice: mga hayop na may apat na paa
  rationale: Tumpak at madaling maunawaan, nang hindi gumagamit ng teknikal na salitang zoolohikal.
- source_word: ἑρπετῶν
  choice: mga gumagapang na nilalang
  rationale: Sinasaklaw nito ang mas malawak na diwa ng salitang Griyego kaysa sa makabagong kategoryang “reptilya.”
theological_decisions:
- issue: Pagkakaiba ng ἀφθάρτου at φθαρτοῦ
  choice: hindi nasisira / nasisira
  alternative: walang kamatayan / mortal
  rationale: Pinananatili ng napiling magkatapat na salita ang diin sa pagkabulok o pagkasira, nang hindi nililiitan ang kahulugan tungo lamang sa kamatayan.
- issue: Ugnayan ng larawan sa mga nilalang na nakalista
  choice: Pinanatili ang isahang “larawan” na sinusundan ng tao, mga ibon, mga hayop na may apat na paa, at mga gumagapang na nilalang.
  alternative: mga larawang kawangis ng
  rationale: Mas malapit ito sa isahang εἰκόνος at hindi ipinapasya kung iisang kolektibong paglalarawan o sari-saring imahen ang nasa isip.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang paulit-ulit na bokabularyo ng wangis at larawan at ang matinding paghahambing ng Diyos na hindi nasisira sa mga nilalang na nasisira.
