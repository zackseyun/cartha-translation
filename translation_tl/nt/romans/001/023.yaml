  source_fidelity: Tapat ang salin sa Griyego. Ang “ipinagpalit nila” ay wastong nagpapahayag ng ἤλλαξαν, at malinaw na naipananatili ang pagsalungat ng Diyos na ἀφθάρτου at ng nilikhang φθαρτοῦ. Ang “sa wangis ng larawan” ay malapit sa magkakaugnay na ἐν ὁμοιώματι εἰκόνος at pinananatili ang isahang anyo ng “larawan.”
  naturalness: Natural at marangal ang modernong Tagalog. Ang sunod-sunod na “ng taong nasisira, ng mga ibon, ng mga hayop …” ay malinaw na tumutukoy sa larawan at maayos ang daloy ng talaan. Nauunawaan ang “hindi nasisira / nasisira” bilang magkatapat na paglalarawan ng walang pagkabulok at pagkasira, bagaman hindi ito teknikal na pananalita.
  terminology: Ang “kaluwalhatian,” “Diyos,” “wangis,” at “larawan” ay angkop sa rehistro at sa semantikong bigat ng talata. Ang “mga gumagapang na nilalang” ay mas malawak at mas tumpak kaysa sa mahigpit na makabagong kategoryang “mga reptilya.” Ang mga talababa ay wastong nakaangkla at nagbibigay ng lehitimong mga alternatibo nang hindi binabago ang kahulugan.
