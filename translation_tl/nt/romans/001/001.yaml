  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: tl
  text: Si Pablo, isang alipin[a] ng Mesiyas na si Jesus[b], tinawag na apostol[c], at ibinukod para sa ebanghelyo ng Diyos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lingkod”; sa ilang tradisyonal na salin, “aliping nakatali sa panginoon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Cristo Jesus.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawaing “tinawag upang maging apostol.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pablo
  rationale: Ito ang nakasanayang anyo ng pangalang Paulos sa modernong Filipino.
- source_word: δοῦλος
  choice: alipin
  rationale: Mas tuwirang ipinahahayag nito ang kalagayang nakatali sa pagmamay-ari at paglilingkod kaysa sa mas malawak na salitang “lingkod.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: ng Mesiyas na si Jesus
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” habang ang hulma na “Mesiyas na si Jesus” ay natural sa Filipino at pinananatili ang pagkakasunod ng mga salita sa Griyego.
- source_word: κλητὸς ἀπόστολος
  choice: tinawag bilang apostol
  rationale: Ipinahahayag nito ang banal na pagtawag kaugnay ng pagiging apostol nang hindi tahasang idinaragdag ang mas interpretibong “upang maging.”
- source_word: ἀφωρισμένος
  choice: ibinukod
  rationale: Pinananatili nito ang pasibong diwa at ang kahulugang itinalaga o inihiwalay para sa isang natatanging layunin.
- source_word: εἰς
  choice: para sa
  rationale: Natural at maikli itong pagpapahayag ng layunin o pagtatalaga sa kontekstong ito.
- source_word: εὐαγγέλιον
  choice: ebanghelyo
  rationale: Karaniwan at nauunawaang terminong Filipino ito para sa mabuting balitang ipinahahayag, at angkop sa marangal na rehistro ng liham.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: Tuwirang isinasalin ang genitibong parirala at pinananatiling bukas kung ito ay balitang mula sa Diyos, tungkol sa Diyos, o pag-aari niya.
theological_decisions:
- issue: Diwa ng δοῦλος sa pagpapakilala ni Pablo
  choice: alipin
  alternative: lingkod
  rationale: Pinananatili ng “alipin” ang mas matinding diwa ng pag-aari at lubos na pagpapasakop na taglay ng salita sa kontekstong ito; inilalagay sa talababa ang mas banayad na alternatibo.
- issue: Paggamit ng Χριστός bilang titulo
  choice: Mesiyas na si Jesus
  alternative: Cristo Jesus
  rationale: Maliwanag na ipinakikita ng “Mesiyas” ang kabuluhan ng titulo sa halip na tratuhin lamang ito bilang bahagi ng pangalan, nang walang idinadagdag na paliwanag na doktrinal.
- issue: Ugnayan ng κλητός at ἀπόστολος
  choice: tinawag bilang apostol
  alternative: tinawag upang maging apostol
  rationale: Iniiwasan nitong gawing tahasan ang layuning ipinahihiwatig ngunit hindi ganap na binibigkas ng maikling pariralang Griyego.
- issue: Genitibong θεοῦ sa “ebanghelyo ng Diyos”
  choice: ng Diyos
  alternative: ebanghelyong mula sa Diyos
  rationale: Pinananatili ng payak na genitibo ang tunay na lawak ng posibleng ugnayan sa halip na limitahan ito sa pinagmulan lamang.
translation_notes:
  register: Gumamit ng modernong, marangal, at madaling maunawaang Filipino. Pinili ang “alipin” upang mapanatili ang bigat ng δοῦλος, “Mesiyas” upang maipakita ang titulong Χριστός, at “ebanghelyo” bilang nakasanayan ngunit buhay na terminong Filipino. Ang kuwit sa hulihan ay nagpapakitang nagpapatuloy ang pambungad na pangungusap sa kasunod na mga talata.
