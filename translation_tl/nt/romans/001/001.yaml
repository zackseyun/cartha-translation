  naturalness: Marangal at likas sa modernong Filipino ang kabuuang daloy. Ang «tinawag na apostol» ay mas payak, mas malapit sa anyong Griyego, at mas idiomatiko kaysa «tinawag bilang apostol.» Ang kasalukuyang «aliping lingkod» sa talababa ay hindi likas at tila inuulit lamang ang kahulugan.
  terminology: Ang «Pablo,» «alipin,» «Mesiyas,» «apostol,» «ebanghelyo,» at «Diyos» ay magkakatugma sa modernong Filipino at sa mga terminong teolohikal ng pinagmulan. Pinananatili ng «Mesiyas na si Jesus» ang titular na saysay ng Χριστός nang hindi nagdaragdag ng paliwanag.
  issues:
