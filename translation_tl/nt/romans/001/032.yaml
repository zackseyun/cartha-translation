id: ROM.1.32
reference: Romans 1:32
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: tl
  text: Kahit alam nila ang matuwid na hatol ng Diyos[a]—na ang mga gumagawa ng gayong mga bagay ay karapat-dapat sa kamatayan—hindi lamang nila ginagawa ang mga iyon, kundi sinasang-ayunan pa nila ang mga gumagawa ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matuwid na tuntunin,” “kautusan,” o “pasiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Kahit … nila
  rationale: Iniuugnay nito ang talata sa mga taong tinutukoy sa naunang konteksto. Isinama ang concessive na diwa sa pambungad na sugnay sa halip na gumamit ng pilit na tahasang panghalip na panaguri.
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: ang matuwid na hatol ng Diyos
  rationale: Ipinahahayag ng δικαίωμα rito ang makatarungan at may legal-moral na bigat na pasiya ng Diyos, na nililinaw ng kasunod na pahayag tungkol sa pagiging karapat-dapat sa kamatayan.
- source_word: ἐπιγνόντες
  choice: Kahit alam nila
  rationale: 'Likas na ipinakikita sa Tagalog ang concessive na relasyon: kumikilos sila nang gayon sa kabila ng kanilang kaalaman. Hindi pinalabis ang ἐπι- bilang ''lubos na alam.'''
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ang mga gumagawa ng gayong mga bagay
  rationale: Ang 'gumagawa' ay natural sa modernong Tagalog at maaaring tumukoy sa nakagawiang pagkilos ayon sa konteksto, nang hindi nagpapahiwatig na iisang kilos lamang ito.
- source_word: ἄξιοι θανάτου
  choice: karapat-dapat sa kamatayan
  rationale: Tuwiran nitong pinananatili ang mapanghatol na bigat ng parirala at hindi nililimitahan kung anong saklaw ng kamatayan ang tinutukoy.
- source_word: οὐ μόνον αὐτὰ ποιοῦσιν
  choice: hindi lamang nila ginagawa ang mga iyon
  rationale: Pinananatili ang kaibhan ng ποιοῦσιν mula sa naunang πράσσοντες habang malinaw na ibinabalik ang 'mga gayong bagay.'
- source_word: συνευδοκοῦσιν
  choice: sinasang-ayunan pa nila
  rationale: Ipinahahayag nito ang pagsang-ayon o pag-endorso, hindi lamang pakikisama. Ang 'pa' ay natural na nagdadala ng tumitinding diin ng ἀλλὰ καί.
- source_word: τοῖς πράσσουσιν
  choice: ang mga gumagawa ng mga iyon
  rationale: Pinananatili ang pag-uulit at kaugnayan sa unang pagtukoy sa mga gumagawa ng gayong mga bagay.
theological_decisions:
- issue: Kahulugan ng ἄξιοι θανάτου (‘karapat-dapat sa kamatayan’)
  choice: Iniharap bilang hatol ng Diyos nang hindi tinutukoy ang higit sa sinasabi mismo ng talata.
  alternative: Limitahan ito sa parusang kamatayan ng pamahalaan, o tahasang tukuyin bilang eskatolohikal na kamatayan.
  rationale: Hindi nililinaw ng talata ang buong saklaw ng ‘kamatayan.’ Pinananatili ng salin ang bigat at tunay na lawak ng pahayag nang hindi nagpapasok ng isang tiyak na interpretasyong wala sa mismong pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang juridical at moral na bigat ng talata, pati ang pag-igting mula sa paggawa tungo sa pagsang-ayon sa mga gumagawa.
