  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: tl
  text: Sapagkat hindi ko ikinahihiya ang magandang balita[a], sapagkat ito ang kapangyarihan ng Diyos para sa kaligtasan ng bawat sumasampalataya—una sa Judio at gayundin sa Griyego[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ebanghelyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Griyego” rito ay maaari ring tumukoy nang mas malawak sa isang Hentil, ibig sabihin, sa isang hindi Judio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: hindi ko ikinahihiya
  rationale: Likas at malinaw itong katumbas sa Filipino ng hindi pagkaramdam ng hiya o pag-urong dahil sa kahihiyan, at pinananatili ang hayagang paninindigan ni Pablo.
- source_word: εὐαγγέλιον
  choice: magandang balita
  rationale: Tuwirang ipinahahayag nito ang leksikal na diwa ng salita sa makabagong Filipino; inilalagay sa talababa ang tradisyonal na terminong “ebanghelyo.”
- source_word: δύναμις
  choice: kapangyarihan
  rationale: Ito ang karaniwan at angkop na salin para sa mabisang kapangyarihan ng Diyos na nauukol sa pagliligtas.
- source_word: εἰς σωτηρίαν
  choice: para sa kaligtasan
  rationale: Pinananatili nito ang direksiyon o layuning ipinahihiwatig ng εἰς sa natural na makabagong Filipino nang hindi dinaragdagan ang teksto.
- source_word: παντὶ τῷ πιστεύοντι
  choice: ng bawat sumasampalataya
  rationale: Pinananatili nito ang distributibong “bawat” at ang patuloy na pandiwang diwa ng participle sa isang natural na kayariang Filipino.
- source_word: Ἰουδαίῳ
  choice: Judio
  rationale: Sa paghahambing kay Ἕλλην, ang etniko at panrelihiyong kahulugang “Judio” ang higit na angkop kaysa isang katawagang pangheograpiya.
- source_word: πρῶτον
  choice: una
  rationale: Tapat nitong pinananatili ang maikli ngunit makahulugang pagkakasunod na nasa Griyego nang walang paliwanag na idinaragdag sa pangunahing teksto.
- source_word: Ἕλληνι
  choice: Griyego
  rationale: Pinananatili nito ang mismong leksikal na anyo ng Griyego; ipinapaliwanag sa talababa na maaari itong gamitin nang mas malawak para sa hindi Judio.
- source_word: τε ... καί
  choice: at gayundin
  rationale: Natural nitong ipinahahayag ang pagdaragdag sa ikalawang pangkat matapos banggitin ang pagiging una ng Judio.
theological_decisions:
- issue: Ang saklaw ng Ἕλληνι sa pariralang “una sa Judio at gayundin sa Griyego”
  choice: “Griyego” sa pangunahing teksto, na may talababa tungkol sa mas malawak na diwang hindi Judio
  alternative: “Hentil” sa pangunahing teksto
  rationale: Pinananatili ng “Griyego” ang aktuwal na leksikal na anyo at historikal-kultural na kulay ng teksto, samantalang kinikilala ng talababa ang mas malawak na gamit nito sa sulat ni Pablo nang hindi tahimik na nilulutas ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “magandang balita” para sa madaling pagkaunawa, habang pinanatili sa talababa ang pamilyar na terminong “ebanghelyo.” Ang em dash ay nagpapalinaw sa huling pagkakasunod nang hindi binabago ang ugnayang panggramatika.
