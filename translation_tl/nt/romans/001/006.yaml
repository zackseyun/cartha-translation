translation:
  language: tl
  text: Kabilang din kayo sa kanila, kayo na mga tinawag ni Jesus na Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mga tinawag upang mapabilang kay Jesus na Mesiyas.” Sa Griyego, maaaring ipahiwatig ng parirala ang pagtawag ni Jesus na Mesiyas o ang mga tinawag bilang mga nauukol sa kanya.'
    reason: Pinananatili ang kalabuan ng genitibong Ἰησοῦ Χριστοῦ nang walang di-likas na pag-aangking mas literal ang isang pormang Tagalog.
lexical_decisions:
- source_word: ἐν οἷς
  choice: Kabilang ... sa kanila
  rationale: Tumutukoy ang panghalip sa mga bansang binanggit sa naunang talata; natural na ipinahahayag ng pariralang ito na kabilang sa pangkat na iyon ang mga mambabasa.
- source_word: ἐστε καὶ ὑμεῖς
  choice: din kayo
  rationale: Pinananatili nito ang mariing pagsasama sa mga mananampalataya sa Roma, sa natural na ayos ng modernong Tagalog.
- source_word: κλητοὶ
  choice: mga tinawag
  rationale: Tuwirang pinananatili ang diwa ng κλητός bilang mga taong tinawag, nang hindi ito nililimitahan sa simpleng paanyaya lamang.
- source_word: Ἰησοῦ Χριστοῦ
  choice: ni Jesus na Mesiyas
  rationale: Isinasalin ang Χριστός bilang titulong “Mesiyas,” samantalang pinananatili ang personal na pangalang Jesus.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: mga tinawag ni Jesus na Mesiyas
  rationale: Maikli at natural ito sa Tagalog at malapit sa siksik na pariralang Griyego. Dahil maaaring unawain ang genitibo bilang tagaganap o kaugnayan/pag-aari, inilalahad sa talababa ang ibang posibleng diwa.
theological_decisions:
- issue: Ang ugnayan ng genitibo sa κλητοὶ Ἰησοῦ Χριστοῦ
  choice: mga tinawag ni Jesus na Mesiyas
  alternative: mga tinawag upang mapabilang kay Jesus na Mesiyas; o, sa mas literal na anyo, mga tinawag na kay Jesus na Mesiyas
  rationale: Hindi tahasang nililinaw ng Griyego kung si Jesus ang tumatawag o kung inilalarawan ang mga tinawag bilang kanya. Gumagamit ang pangunahing teksto ng maikli at likas na Tagalog, habang pinananatili ng talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang em dash upang maipakita na ang ikalawang parirala ay paglalarawan sa “kayo,” at isinalin ang Χριστός bilang titulong “Mesiyas.”
