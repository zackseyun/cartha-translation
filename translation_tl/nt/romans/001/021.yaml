  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: tl
  text: Sapagkat bagaman nakilala nila ang Diyos, hindi nila siya niluwalhati bilang Diyos ni pinasalamatan man. Ngunit naging walang saysay ang kanilang mga pangangatuwiran[a], at nagdilim ang kanilang pusong walang pang-unawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pag-iisip,” “mga kaisipan,” o “mga haka-haka.”
    reason: lexical_alternative
  - marker: b
    text: Isahan sa Griyego ang “puso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pahayag at pinananatili ang lohikal na kaugnayan.
- source_word: γνόντες τὸν θεὸν
  choice: bagaman nakilala nila ang Diyos
  rationale: 'Ginagawang malinaw ang konsesibong diwa ng participle sa konteksto: sa kabila ng pagkakilala nila sa Diyos, hindi sila tumugon nang nararapat.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: hindi nila siya niluwalhati bilang Diyos
  rationale: Pinananatili ng “niluwalhati” ang bigat ng δοξάζω, at ng “bilang Diyos” ang katayuang nararapat kilalanin sa kaniya.
- source_word: ἢ ηὐχαρίστησαν
  choice: ni pinasalamatan man
  rationale: Likas na Filipino ang hulma at malinaw na ipinahahayag ang pagkukulang nilang magpasalamat sa Diyos nang hindi dinaragdagan ang diwa.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: naging walang saysay ang kanilang mga pangangatuwiran
  rationale: Likas na inililipat sa Filipino ang bunga ng pasibong pandiwa habang pinananatili ang ideya ng pagkahungkag o kawalang-kabuluhan sa kanilang panloob na pangangatwiran.
- source_word: ἐσκοτίσθη
  choice: nagdilim
  rationale: Pinananatili ang metapora ng pagdidilim nang hindi nagdaragdag ng tahasang gumagawa o sanhi na hindi binanggit sa Griyego.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: ang kanilang pusong walang pang-unawa
  rationale: Ang “walang pang-unawa” ay tumutukoy sa kakulangan ng wastong pagkaunawa, hindi lamang sa mababang talino. Pinananatili rin ang isahang “puso” na ginagamit nang kolektibo.
theological_decisions:
- issue: Konsesibong diwa ng γνόντες
  choice: bagaman nakilala nila ang Diyos
  alternative: nang makilala nila ang Diyos / yamang nakilala nila ang Diyos
  rationale: Sa konteksto, idiniriin ang pananagutan nila sa kabila ng pagkakilala sa Diyos. Hatol itong gramatikal at kontekstuwal, hindi paglalapat ng natatanging doktrina.
- issue: Di-tahasang sanhi ng pagdidilim
  choice: nagdilim
  alternative: pinadilim
  rationale: Hindi tinutukoy ng pasibong ἐσκοτίσθη ang gumagawa. Iniiwasan ng salin na tahasang pangalanan o ipahiwatig ang isang sanhi at sa gayon ay pinananatili ang tensiyon ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “niluwalhati” bilang pamilyar na salitang biblikal, samantalang ang “walang saysay” at “walang pang-unawa” ay likas sa kasalukuyang gamit. Inilagay ang mga panandang talababa sa mga salitang aktuwal na tinutukoy ng mga ito.
