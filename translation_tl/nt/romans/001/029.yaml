  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: tl
  text: puspos ng lahat ng uri ng kalikuan[a], kasamaan, kasakiman, at masamang hangarin; punô ng inggit, pagpaslang, alitan, pandaraya, at masamang kalooban; mga palihim na naninirang-puri[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puspos ng buong kalikuan”; ipinahahayag ng pariralang Griyego ang lubos na saklaw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga tsismoso” o “mga mapagbulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: puspos
  rationale: Ipinahahayag ng ganap na balintiyak na pandiwaring Griyego ang isang umiiral na kalagayang bunga ng naunang pagkilos. Likas at marangal sa Filipino ang “puspos” at napananatili nito ang diwang balintiyak at resultativo.
- source_word: πάσῃ
  choice: lahat ng uri ng
  rationale: Kasama ng isahang pangngalang abstrakto, ipinahahayag nito ang masaklaw o komprehensibong saklaw; malinaw at natural ang “lahat ng uri ng” sa Filipino.
- source_word: ἀδικίᾳ
  choice: kalikuan
  rationale: Sinasaklaw ng “kalikuan” ang malawak na moral na kamalian, hindi lamang kawalang-katarungan sa lipunan, at angkop sa marangal na talaan ng mga bisyo.
- source_word: πονηρίᾳ
  choice: kasamaan
  rationale: Direkta at pangkalahatang tawag ito sa moral na kasamaan at malinaw sa mga modernong mambabasa.
- source_word: πλεονεξίᾳ
  choice: kasakiman
  rationale: Malinaw nitong ipinahahayag ang mapangkamkam na pagnanais na magkaroon pa nang higit.
- source_word: κακίᾳ
  choice: masamang hangarin
  rationale: Ipinakikita nito ang mas tiyak na masamang disposisyon laban sa kapuwa at naihihiwalay sa mas malawak na πονηρία, “kasamaan.”
- source_word: μεστοὺς
  choice: punô ng
  rationale: Natural na katumbas ito na nagpapanatili sa pagkakaiba ng salitang Griyego mula sa πεπληρωμένους, na isinaling “puspos.”
- source_word: φθόνου
  choice: inggit
  rationale: Ito ang karaniwan at tiyak na katawagan sa bisyong inilalarawan.
- source_word: φόνου
  choice: pagpaslang
  rationale: Napananatili nito ang mabigat na moral na diwa ng sadyang pagkitil ng buhay, hindi ang mas neutral na “pagpatay.”
- source_word: ἔριδος
  choice: alitan
  rationale: Maikli, natural, at malinaw nitong inilalarawan ang mapagtunggali at palaaway na hidwaan.
- source_word: δόλου
  choice: pandaraya
  rationale: Malinaw nitong ipinahahayag ang sinasadyang panlilinlang.
- source_word: κακοηθείας
  choice: masamang pag-uugali
  rationale: Tumutukoy ito sa masamang disposisyon o asal. Pinananatili ng salin ang pagkakaiba nito sa κακία nang hindi gumagamit ng di-natural na parirala.
- source_word: ψιθυριστάς
  choice: mga mapagbulong
  rationale: Literal nitong pinananatili ang larawan ng lihim o pabulong na pagsasalita laban sa iba; nililinaw sa talababa ang posibleng diwang tsismoso o lihim na maninirang-puri.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang paralelismong “puspos …; punô …” upang katawanin ang dalawang magkaibang ekspresyong Griyego. Pinanatili ang bantas sa hulihan dahil nagpapatuloy ang talaan sa kasunod na talata.
