  to: At yamang hindi nila minarapat na panatilihin ang Diyos sa kanilang pagkakilala[a], ipinaubaya sila ng Diyos sa isang isip na hindi karapat-dapat, upang gawin ang mga bagay na hindi nararapat[b].
