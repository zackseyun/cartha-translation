  terminology: Pinanatili ang Diyos, isip, at ang moral na “hindi nararapat.” Hindi ginamit ang mas mabigat at mas interpretatibong “tiwaling” bilang pangunahing salin. Inayos ang unang talababa upang tunay na magbigay ng leksikal na alternatibo sa halip na isang mas pinaikling pagpapakahulugan lamang.
