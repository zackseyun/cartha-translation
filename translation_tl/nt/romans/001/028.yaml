  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: tl
  text: At yamang hindi nila minarapat na panatilihin ang Diyos sa kanilang pagkakilala[a], ipinaubaya sila ng Diyos sa isang isip na hindi karapat-dapat, upang gawin ang mga bagay na hindi nararapat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “taglayin ang Diyos sa kanilang kaalaman.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hindi karapat-dapat” ay kaugnay ng “hindi nila minarapat” sa unang bahagi ng talata; sa ganitong paraan, napapanatili ang paglalaro ng salita ni Pablo. Maaari ring “isang tiwaling isip.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: yamang
  rationale: Sa konteksto, inuugnay nito ang pagtanggi ng mga tao sa kasunod na paghatol ng Diyos; natural na ipinahahayag ng “yamang” ang ugnayang ito nang hindi inaalis ang paghahambing o pagtutumbas na ipinahihiwatig ng Griyego.
- source_word: οὐκ ἐδοκίμασαν
  choice: hindi nila minarapat
  rationale: Ipinahahayag nito ang pasyang hindi kilalaning karapat-dapat matapos timbangin, at inihahanda ang pag-uugnay sa ἀδόκιμον.
- source_word: τὸν θεὸν ἔχειν ἐν ἐπιγνώσει
  choice: panatilihin ang Diyos sa kanilang pagkakilala
  rationale: Pinananatili nito ang literal na larawang “taglayin sa pagkakilala” habang gumagamit ng natural na pariralang Tagalog. Hindi nito nililimitahan ang diwa sa intelektuwal na kaalaman lamang.
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: hinayaan sila ng Diyos
  rationale: Sa Tagalog, malinaw nitong naihahatid ang hudisyal na pagbibigay ng Diyos sa kanila sa bunga ng kanilang pinili. Ang mas literal na “ibinigay sila” ay maaaring maging malabo o di-natural.
- source_word: ἀδόκιμον νοῦν
  choice: isang isip na hindi karapat-dapat
  rationale: Iniiwasan nito ang mas mabigat na teolohikal na salitang “tiwali” o “masama” at pinananatili ang leksikal na ugnayan sa ἐδοκίμασαν sa pamamagitan ng “minarapat/karapat-dapat.”
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: upang gawin ang mga bagay na hindi nararapat
  rationale: Tuwirang inilalahad nito ang layunin o bunga ng pagbibigay at ang moral na di-pagkaangkop ng mga ginagawa.
theological_decisions:
- issue: Kung paiigtingin ang ἀδόκιμον νοῦν bilang “tiwaling isip” o “masamang pag-iisip.”
  choice: isang isip na hindi karapat-dapat
  alternative: isang tiwaling isip
  rationale: Ang piniling salin ay nagpapanatili sa kahulugang hindi pumasa o hindi karapat-dapat at sa paglalaro ng salita kasama ng ἐδοκίμασαν, nang hindi nagpapasok ng mas sistematikong terminong teolohikal.
- issue: Kung ang παρέδωκεν ay isasaling literal bilang aktibong paghahatid o bilang pagpapabaya.
  choice: hinayaan sila ng Diyos
  alternative: ibinigay sila ng Diyos
  rationale: Ipinakikita ng konteksto ang aktibong paghatol ng Diyos sa pamamagitan ng pagpapabaya sa kanila sa bunga ng kanilang pagtanggi. Ang “hinayaan” ay natural sa Tagalog, ngunit hindi nilalayong alisin ang hudisyal na puwersa ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagkakilala” sa halip na teknikal na “ganap na kaalaman,” at pinanatili ang leksikal na ugnayan ng “minarapat/karapat-dapat.”
