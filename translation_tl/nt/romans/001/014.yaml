  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: tl
  text: May obligasyon ako kapwa sa mga Griyego at sa mga barbaro[a], kapwa sa marurunong at sa mga mangmang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga dayuhan” o “mga hindi Griyego.” Dito, ang “mga barbaro” ay sumasalamin sa karaniwang paghahating pangkultura ng mga Griyego sa pagitan ng mga Griyego at mga hindi Griyego; hindi ito kinakailangang nangangahulugang mababangis sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: mga Griyego
  rationale: Tumutukoy ito sa mga Griyego bilang pangkat na etniko at pangkultura at pinananatili ang unang magkatambal na kategorya ni Pablo.
- source_word: βαρβάροις
  choice: mga barbaro
  rationale: Ito ang karaniwang katawagang Griyego para sa mga hindi Griyego, lalo na sa mga hindi nagsasalita ng Griyego. Pinananatili ng salin ang makasaysayang katawagan, habang nililinaw sa talababa na hindi nito kinakailangang ipahiwatig ang pagiging mabangis.
- source_word: σοφοῖς
  choice: marurunong
  rationale: Direkta at natural nitong ipinapahayag ang kahulugan at pinananatili ang paghahambing sa ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: mga mangmang
  rationale: Pinananatili nito ang matalas ngunit malawak na kasalungat ng “marurunong”; maaari itong tumukoy sa mga walang karunungan o pinag-aralan nang hindi nililimitahan sa isa lamang sa mga diwang iyon.
- source_word: ὀφειλέτης εἰμί
  choice: May pananagutan ako
  rationale: Ang literal na larawan ay pagiging may utang, ngunit dito ay ipinahahayag ni Pablo ang mabigat na obligasyong nakaatang sa kaniya, hindi utang na salapi. Natural sa modernong Filipino ang “may pananagutan” at nananatili rito ang bigat ng tungkulin.
- source_word: τε ... καὶ / τε ... καὶ
  choice: kapwa ... at ... / kapwa ... at ...
  rationale: Pinananatili nito ang balanseng dalawang pares sa retorika ng Griyego.
theological_decisions: []
