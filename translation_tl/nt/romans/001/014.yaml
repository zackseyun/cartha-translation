  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng ayos ng dalawang magkatambal na pangkat at ang makasaysayang katawagang “barbaro,” na may talababa upang maiwasan ang modernong maling pakahulugan.
