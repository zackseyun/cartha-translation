  to: 'Huwag ninyong ipaghiganti ang inyong sarili, mga minamahal, kundi bigyang-daan ninyo ang poot[a], sapagkat nasusulat: “Akin ang paghihiganti; ako ang gaganti[b], sabi ng Panginoon.”'
