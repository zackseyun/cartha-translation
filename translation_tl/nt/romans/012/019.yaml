  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: tl
  text: 'Huwag ninyong ipaghiganti ang inyong sarili, mga minamahal, kundi bigyang-daan ninyo ang poot[a], sapagkat nasusulat: “Akin ang paghihiganti; ako ang gaganti[b], sabi ng Panginoon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay kayo ng puwang sa poot,” na malamang ay tumutukoy sa poot ng Diyos batay sa kasunod na sipi.
    reason: lexical_alternative
  - marker: b
    text: O “ako ang magbabayad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Huwag kayong maghiganti para sa inyong sarili
  rationale: 'Ipinahahayag ang pagbabawal at pinananatili ang reflexive na diwa: hindi sila ang dapat magsagawa ng paghihiganti para sa sarili.'
- source_word: ἀγαπητοί
  choice: mga minamahal
  rationale: Pinananatili ang magiliw at marangal na pantawag, pati ang init ng ugnayan, nang hindi nagiging labis na kolokyal.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: kundi bigyang-daan ninyo ang poot
  rationale: Pinananatili ang metapora ng pagbibigay ng lugar o daan at ang di-tiyak na pagtukoy ng tekstong Griyego sa poot.
- source_word: γέγραπται γάρ
  choice: sapagkat nasusulat
  rationale: Likas at kinikilalang pormula sa Filipino para sa pagpapakilala ng sipi mula sa Kasulatan.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Akin ang paghihiganti
  rationale: Direktang ipinahahayag ang pag-aari o tanging karapatan, habang nananatiling matipid at marangal ang pananalita.
- source_word: ἐγὼ ἀνταποδώσω
  choice: ako ang gaganti
  rationale: Ang 'gaganti' ay natural sa modernong Filipino at malinaw na tumutukoy sa makatarungang pagganti o paghatol sa konteksto.
- source_word: λέγει κύριος
  choice: sabi ng Panginoon
  rationale: Natural na pormula ng pagsipi sa Filipino at karaniwang salin ng κύριος bilang 'Panginoon.'
theological_decisions:
- issue: Ang tinutukoy ng τῇ ὀργῇ ('ang poot')
  choice: Panatilihin sa pangunahing teksto ang maikling 'ang poot,' na sa konteksto ay malamang na poot ng Diyos.
  alternative: Gawing tahasan sa pangunahing teksto ang 'poot ng Diyos,' o unawain bilang poot ng tao sa pangkalahatan.
  rationale: Ipinakikita ng kasunod na sipi tungkol sa karapatan ng Panginoon na gumanti na malamang na banal na poot ang tinutukoy. Gayunman, hindi tahasang sinasabi ng Griyego ang 'ng Diyos,' kaya hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'mga minamahal' upang mapanatili ang magiliw na vocative, at ang 'bigyang-daan' upang mapanatili ang metapora at tunay na kalabuan ng orihinal.
