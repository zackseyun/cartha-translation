  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: ipinagbabawal ang pansariling paghihiganti, iniuutos ang pagbibigay-daan sa ‘poot’ nang hindi tahasang idinadagdag ang Diyos, at pinananatili ang sipi tungkol sa prerogatibo ng Panginoon na gumanti. Gayunman, ang ‘maghiganti para sa inyong sarili’ ay hindi ang pinakanatural na paraan upang ihayag ang reflexive na ἑαυτούς sa Filipino.'
  naturalness: Mas natural at malinaw ang ‘Huwag ninyong ipaghiganti ang inyong sarili’ para sa pagbabawal laban sa paghihiganti para sa sariling dinanas. Ang ‘bigyang-daan ninyo ang poot’ ay katanggap-tanggap at pinananatili ang sadyang di-tahas na object ng poot.
  terminology: Ang ‘poot,’ ‘paghihiganti,’ at ‘Panginoon’ ay angkop sa marangal ngunit modernong rehistro. Ang ‘ako ang gaganti’ ay wastong salin ng ἀνταποδώσω sa kontekstong ito. Inalis ang paliwanag sa talababa na nagtatakda ng ‘makatarungang ... paghatol,’ sapagkat hindi iyon tahasang sinasabi ng parirala mismo.
