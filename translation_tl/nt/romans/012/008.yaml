  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: tl
  text: kung nagpapayo, magpayo; ang nagbabahagi[a], magbahagi nang bukás-palad[b]; ang namumuno[c], mamuno nang buong sikap[d]; at ang nagpapakita ng awa, magpakita ng awa nang may galak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nagbibigay” o “ang nag-aambag.”
    reason: lexical_alternative
  - marker: b
    text: O “nang may katapatan” o “nang payak.” Ang salitang Griyego ay maaaring tumukoy sa pagiging payak o tapat, o sa pagiging bukás-palad, ayon sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: O “ang namamahala” o “ang nangangasiwa.”
    reason: lexical_alternative
  - marker: d
    text: O “nang masigasig” o “nang taimtim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: kung ang kaloob ay
  rationale: Ipinagpapatuloy nito ang may-kondisyong talaan mula sa naunang talata. Idinagdag ang “ang kaloob ay” upang maging malinaw sa natural na Tagalog ang eliptikong Griyego.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: pagpapayo … sa pagpapayo
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pandiwa at pangngalan. Saklaw ng salita ang masidhing pagpapayo at pagpapalakas ng loob; inilalahad sa talababa ang tunay na alternatibo.
- source_word: ὁ μεταδιδοὺς
  choice: ang nagbabahagi
  rationale: Ipinahihiwatig ng μεταδίδωμι ang pagbibigay o pagbabahagi mula sa sariling tinatangkilik; natural at malawak ang “nagbabahagi.”
- source_word: ἐν ἁπλότητι
  choice: nang bukás-palad
  rationale: Sa konteksto ng pagbabahagi ng yaman, malamang na tumutukoy ito sa pagiging mapagbigay, bagaman maaari rin itong mangahulugang katapatan o kawalang-pagkukunwari.
- source_word: ὁ προϊστάμενος
  choice: ang namumuno
  rationale: Malinaw itong tumutukoy sa pangunguna o pangangasiwa nang hindi ginagawang teknikal na titulo ng isang katungkulan sa iglesya.
- source_word: ἐν σπουδῇ
  choice: nang buong sikap
  rationale: Natural na ipinahahayag nito ang masigasig, taimtim, at masikap na pagganap sa pamumuno.
- source_word: ὁ ἐλεῶν
  choice: ang nagpapakita ng awa
  rationale: 'Pinananatili ang aktibong diwa ng pandiwaring Griyego: hindi lamang pagkakaroon ng awa kundi pagsasagawa nito.'
- source_word: ἐν ἱλαρότητι
  choice: nang may galak
  rationale: Ipinahahayag nito ang masaya at kusang-loob na saloobin sa paggawa ng awa.
theological_decisions:
- issue: Saklaw ng προϊστάμενος
  choice: “ang namumuno,” bilang pangkalahatang paglalarawan sa pangunguna
  alternative: “ang namamahala” o isang tiyak na opisyal ng iglesya
  rationale: Walang tahasang terminong pangkatungkulan sa talata. Pinananatili ng pangkalahatang salin ang lawak ng teksto at umiiwas sa pagpasok ng partikular na kaayusan ng denominasyon.
- issue: Kahulugan ng ἁπλότης sa pagbabahagi
  choice: pagiging bukás-palad
  alternative: katapatan, kadalisayan ng layunin, o pagiging simple
  rationale: Ang diwa ng pagiging mapagbigay ang pinakamalamang dahil kaugnay ito ng pagbabahagi, ngunit hindi inaalis ang iba pang leksikal na posibilidad kaya inilagay ang mga iyon sa talababa.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Bahagyang nilinaw ang eliptikong ayos ng Griyego sa pamamagitan ng “ang kaloob ay” at mga inuulit na pandiwa, habang pinananatili ang maikli at sunod-sunod na anyo ng talaan. Ginamit ang “bukás-palad” sa karaniwang makabagong kahulugan nito.
