  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: tl
  text: Nagagalak sa pag-asa, nagtitiis sa kapighatian[a], at patuloy na nananalangin nang buong tiyaga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matinding paghihirap.” Ang salita ay maaaring tumukoy sa matinding panggigipit, dalamhati, o kapighatian.
    reason: lexical_alternative
  - marker: b
    text: O, “manatiling nakatalaga sa pananalangin.” Binibigyang-diin ng salitang Griyego ang matatag at patuloy na pagtatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: sa pag-asa
  rationale: Likas na katumbas sa Tagalog ng datibong parirala at pinananatili ang pag-asa bilang batayan o kalagayan ng kagalakan.
- source_word: χαίροντες
  choice: nagagalak
  rationale: Pinananatili ang anyong patuloy at ang marangal na diwa ng χαίρω sa serye ng mga pariralang mapanghikayat.
- source_word: θλίψει
  choice: sa kapighatian
  rationale: Ipinahihiwatig ng “kapighatian” ang mabigat na hirap, pagkabalisa, o panggigipit na saklaw ng θλῖψις, nang hindi nililimitahan ito sa isang uri lamang ng pagdurusa.
- source_word: ὑπομένοντες
  choice: nagtitiis
  rationale: Maikli at likas na salin para sa matatag na pananatili sa ilalim ng hirap; kaayon din ng paralel na ayos ng talata.
- source_word: προσευχῇ
  choice: sa pananalangin
  rationale: Ang “pananalangin” ay natural at pangkalahatang katumbas ng προσευχή sa ganitong parirala.
- source_word: προσκαρτεροῦντες
  choice: patuloy na nananalangin nang buong tiyaga
  rationale: Ipinapahayag ang tuloy-tuloy at matatag na pagtatalaga na taglay ng προσκαρτερέω. Ginawang natural sa Tagalog ang kaugnayan nito sa pananalangin nang hindi ipinapalagay na simpleng pag-uulit lamang ang tinutukoy.
theological_decisions:
- issue: Lakas ng θλῖψις
  choice: kapighatian
  alternative: matinding paghihirap; kaguluhan
  rationale: Pinananatili ng “kapighatian” ang bigat ng pagdurusa at panggigipit nang hindi inaangkat ang isang tiyak na eskatolohikal o denominasyonal na pakahulugan ng “tribulation.”
- issue: Diwa ng προσκαρτερέω
  choice: patuloy na nananalangin nang buong tiyaga
  alternative: nakatalaga sa pananalangin
  rationale: Parehong posible ang matatag na pagpapatuloy at debotong pagtatalaga. Pinili sa pangunahing teksto ang ekspresyong natural sa Tagalog, habang inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at tatluhang ayos ng mga pariralang Griyego, pati ang patuloy na aspekto ng mga pandiwari. Itinama ang pagkakalagay ng mga panandang talababa upang ang tala tungkol sa θλίψει ay sumunod sa “kapighatian” at ang tala tungkol sa προσκαρτεροῦντες ay sumunod sa parirala tungkol sa pananalangin.
