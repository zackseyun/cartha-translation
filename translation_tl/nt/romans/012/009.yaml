id: ROM.12.9
reference: Romans 12:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: tl
  text: Maging walang pagkukunwari ang pag-ibig.[a] Kasuklaman ninyo ang masama; kumapit kayo sa mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Maging taos-puso ang pag-ibig.” Sa Griyego, literal na “Ang pag-ibig—walang pagkukunwari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: pag-ibig
  rationale: Ang “pag-ibig” ang natural at malawak na katumbas sa modernong Tagalog at pinananatili ang anyong pangngalan ng Griyego.
- source_word: ἀνυπόκριτος
  choice: walang pagkukunwari
  rationale: Tuwirang ipinapahayag nito na ang pag-ibig ay hindi pakitang-tao o ginagampanan lamang; mas malinaw nitong pinananatili ang kongkretong diwa kaysa sa mas interpretibong “taos-puso.”
- source_word: ἀποστυγοῦντες
  choice: kasuklaman ninyo
  rationale: Ipinahahayag ng pandiwa ang matinding pag-ayaw. Ang “kasuklaman” ay malakas ngunit natural, at ang anyong pautos ay angkop sa sunod-sunod na mga tagubilin sa konteksto.
- source_word: τὸ πονηρόν
  choice: ang masama
  rationale: Ang artikulong pang-uri na nasa anyong neutral ay ginagamit bilang pangngalan at tumutukoy nang malawak sa anumang masama, hindi lamang sa isang partikular na gawa.
- source_word: κολλώμενοι
  choice: kumapit kayo
  rationale: Inilalarawan nito ang mahigpit na pagdikit o matatag na pagpanig. Ang “kumapit” ay buhay, malinaw, at karaniwan sa modernong Tagalog.
- source_word: τῷ ἀγαθῷ
  choice: sa mabuti
  rationale: Pinananatili nito ang malawak na moral na kategorya at ang malinaw na pagtutulad sa “ang masama.”
theological_decisions:
- issue: Lakas ng sugnay na walang tahasang pandiwa at ng mga pandiwaring nasa konteksto ng mga tagubilin
  choice: 'Isinalin bilang sunod-sunod na mga tagubilin: “Maging … Kasuklaman … kumapit …”'
  alternative: 'Mas pormal at putol-putol na anyo: “Ang pag-ibig—walang pagkukunwari; nasusuklam sa masama, kumakapit sa mabuti.”'
  rationale: Bagaman walang tahasang pandiwa ang unang sugnay at mga pandiwari ang kasunod, ang konteksto ng Roma 12 ay serye ng mga tagubiling etikal. Naipahahayag ng pautos na anyo ang gamit ng mga salita nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang lakas ng “kasuklaman” at ang kongkretong larawan ng “kumapit,” habang iniwasan ang makaluma o sektaryong pananalita.
