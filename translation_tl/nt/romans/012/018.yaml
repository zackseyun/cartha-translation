base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: tl
  text: Kung maaari[a], hangga’t nakasalalay sa inyo, mamuhay kayo nang payapa kasama ng lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung posible, sa ganang inyo, mamuhay kayo nang payapa kasama ng lahat ng tao.”
    reason: Ipinapakita ang alternatibong paghahanay ng dalawang magkaugnay na pariralang naglilimita sa panawagan.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Kung maaari
  rationale: Likas at tuwirang ipinapahayag nito ang kondisyong naglilimita sa utos nang hindi ipinahihiwatig na laging makakamit ang kapayapaan.
- source_word: τὸ ἐξ ὑμῶν
  choice: hangga’t nakasalalay sa inyo
  rationale: Ipinahahayag ng parirala kung ano lamang ang nasa kapangyarihan at pananagutan ng mga mambabasa, habang nananatiling natural sa modernong Tagalog.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: sa lahat ng tao
  rationale: Pangkalahatan ang kahulugan ng ἀνθρώπων at hindi lamang tumutukoy sa mga lalaki; malinaw at likas ang “lahat ng tao” sa Tagalog.
- source_word: εἰρηνεύοντες
  choice: mamuhay kayong payapa
  rationale: Ang kasalukuyang participle ay may puwersang pautos sa konteksto at tumutukoy sa patuloy na paraan ng pamumuhay, hindi lamang sa panandaliang kalagayan.
theological_decisions:
- issue: Saklaw at hangganan ng panawagang mamuhay nang payapa
  choice: Inuutusan ang mga mananampalataya na mamuhay nang payapa sa lahat, ngunit ang kanilang pananagutan ay hayagang nililimitahan sa kung ano ang tunay na nakasalalay sa kanila.
  alternative: Unawain ang utos bilang ganap at walang pasubali, na para bang laging makakamit ang kapayapaan kapag tama ang kilos ng mananampalataya.
  rationale: Magkasamang pinananatili ng εἰ δυνατόν at τὸ ἐξ ὑμῶν ang pangkalahatang saklaw ng panawagan at ang makatotohanang hangganan ng pananagutan ng mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “hangga’t nakasalalay sa inyo” upang maging natural nang hindi inaalis ang limitasyong nasa Griyego.
