  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: tl
  text: Makibahagi kayo sa pagtugon sa mga pangangailangan ng mga banal[a]; sikapin ninyong maging mapagpatuloy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mag-ambag kayo para sa mga pangangailangan ng mga banal.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “habulin” o “masugid na hangarin” ang pagiging mapagpatuloy. Ang salitang Griyego ay may diwa rin ng pagtanggap at pag-aasikaso sa mga estranghero.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: mga pangangailangan
  rationale: Tumutukoy ito sa mga praktikal na pangangailangan o kinakailangan; natural at malinaw ang “mga pangangailangan” sa makabagong Filipino.
- source_word: ἁγίων
  choice: mga banal
  rationale: Karaniwang tawag ito ni Pablo sa mga mananampalataya bilang banal na bayan ng Diyos. Pinananatili ng “mga banal” ang katawagang teolohikal nang hindi nililimitahan sa mga kinanonisang santo.
- source_word: κοινωνοῦντες
  choice: makibahagi ... sa pagtugon
  rationale: Saklaw ng pandiwa ang pakikibahagi o pag-aambag. Ipinahihiwatig ng parirala ang aktibong pagtulong upang matugunan ang pangangailangan, hindi lamang pakikiramay.
- source_word: φιλοξενίαν
  choice: magpatuloy ng mga estranghero
  rationale: Ang φιλοξενία ay pagtanggap at pag-aasikaso sa mga panauhin, lalo na sa mga estranghero. Mas tahasang inilalabas ng salin ang dimensiyong ito kaysa sa malawak na salitang “pagiging mapagpatuloy.”
- source_word: διώκοντες
  choice: masigasig ninyong hanapin ang mga pagkakataon
  rationale: Ang διώκω ay may diwang aktibong paghahabol o masugid na paghahangad; ipinapakita ng salin na kusang hinahanap ang pagkakataong magpatuloy, hindi lamang ginagawa kapag lumitaw ito.
theological_decisions:
- issue: Tinutukoy ng “mga banal”
  choice: mga mananampalataya / banal na bayan ng Diyos
  alternative: mga kinanonisang santo sa mas huling gamit-eklesiastiko
  rationale: Sa karaniwang gamit ni Pablo, ang οἱ ἅγιοι ay tumutukoy sa mga Cristiano bilang isang buong sambayanan, hindi sa isang natatanging pangkat na kinanonisa kalaunan.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang pangmaramihang pautos upang natural na katawanin ang mga participle na gumaganap bilang mga tagubilin sa konteksto. Tahasang pinanatili ang “mga banal” bilang katawagang Paulino, habang nilinaw sa talababa ang alternatibong diwa ng κοινωνέω at φιλοξενία.
