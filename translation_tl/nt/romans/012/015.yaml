  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: tl
  text: Makigalak kayo sa mga nagagalak; makiiyak kayo sa mga umiiyak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Makigalak kayo
  rationale: Ang pawatas ay may puwersang pautos sa serye ng mga tagubilin. Likas sa Filipino ang pandiwang may unlaping maki- upang maipahayag kapuwa ang galak at pakikiisa sa iba.
- source_word: μετὰ
  choice: maki- / sa
  rationale: Ipinahihiwatig ng μετά na may kasamang mga taong tinutukoy. Sa natural na Filipino, naisasama ang diwang “kasama” sa mga pandiwang “makigalak” at “makiiyak,” kasunod ng “sa.”
- source_word: χαιρόντων
  choice: mga nagagalak
  rationale: Ang kasalukuyang aktibong participle na ginagamit bilang pangngalan ay likas na naipapahayag bilang “mga nagagalak,” na nagpapanatili sa pangkalahatang maramihang diwa.
- source_word: κλαίειν
  choice: makiiyak kayo
  rationale: Ang pawatas ay may puwersang pautos. Ang “makiiyak” ay naghahatid ng aktuwal na pag-iyak at pakikibahagi sa dalamhati, nang hindi ito pinalalawak tungo sa mas pangkalahatang “magluksa.”
- source_word: κλαιόντων
  choice: mga umiiyak
  rationale: Ang kasalukuyang aktibong participle na ginagamit bilang pangngalan ay malinaw at natural na isinalin bilang “mga umiiyak,” kaagapay ng “mga nagagalak.”
theological_decisions:
- issue: Puwersang pautos ng mga pawatas sa serye ng mga tagubilin
  choice: 'Isinalin ang dalawang pawatas bilang tuwirang mga utos: “Makigalak kayo …; makiiyak kayo …”'
  alternative: “Ang makigalak sa mga nagagalak; ang makiiyak sa mga umiiyak.”
  rationale: Bagaman mga pawatas ang χαίρειν at κλαίειν, gumaganap ang mga ito bilang mga tagubilin sa konteksto ng Roma 12:9–21. Ang pautos na anyo ang pinakanatural na naghahatid ng tungkulin ng pahayag sa Filipino nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Ginamit ang magkatugmang “makigalak” at “makiiyak” upang mapanatili ang mahigpit na paralelismo at ang diwa ng pakikiisa na ipinahahayag ng μετά.
