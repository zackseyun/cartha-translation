  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: tl
  text: 'Gayon din tayo: bagaman marami, iisa tayong katawan sa Mesiyas[a], at ang bawat isa naman ay bahagi ng isa’t isa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “kay Cristo.” Ang titulong Griego na Χριστός ay maaaring isalin sa alinmang paraan; ginamit dito ang “Mesiyas” upang mapanatili ang diwa nito bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Gayon din
  rationale: Likas na inuugnay nito ang pahayag sa paghahambing tungkol sa isang katawan at maraming bahagi sa naunang talata.
- source_word: οἱ πολλοὶ
  choice: 'tayo: bagaman marami'
  rationale: Ipinahihiwatig ng konteksto ang inklusibong unang panauhan; pinananatili ng “bagaman marami” ang pagtutunggali ng dami at pagkakaisa.
- source_word: ἓν σῶμά
  choice: iisa tayong katawan
  rationale: Pinananatili nito ang malinaw na talinghaga ng katawan at ang diin sa pagkakaisa.
- source_word: ἐν Χριστῷ
  choice: sa Mesiyas
  rationale: Isinasalin ang titulong Χριστός bilang “Mesiyas” habang pinananatili ang wikang Paulino tungkol sa pagiging nakaugnay sa kanya.
- source_word: τὸ δὲ καθ’ εἷς
  choice: at ang bawat isa naman
  rationale: Natural na Filipino para sa pamamahaging diwa na “bawat isa” o “isa-isa”; ang “naman” ay nagpapakita ng paglipat mula sa kabuuan tungo sa bawat indibidwal.
- source_word: μέλη
  choice: bahagi
  rationale: Malinaw at karaniwang salita sa Filipino na nagpapatuloy sa talinghaga ng katawan nang hindi nagmumungkahi ng pormal na kasapian lamang.
- source_word: ἀλλήλων
  choice: ng isa’t isa
  rationale: Tuwirang pinananatili ang katumbasang ugnayan at mutuwal na pag-aari o pagkakaugnay ng mga mananampalataya.
theological_decisions:
- issue: Pagpapakahulugan sa ἐν Χριστῷ
  choice: sa Mesiyas
  alternative: kay Cristo
  rationale: Ang Χριστός ay isang titulo na nangangahulugang “Mesiyas.” Pinananatili ng salin ang mesiyanikong diwa at hindi nilulutas o pinapalawak ang teolohikal na kahulugan ng pariralang “ἐν Χριστῷ.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahagi” sa halip na “miyembro” upang manatiling buhay ang talinghaga ng katawan; pinanatili rin ang bahagyang matinding pahayag na ang bawat isa ay bahagi “ng isa’t isa.”
