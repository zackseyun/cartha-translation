  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: tl
  text: Magkaroon kayo ng iisang saloobin sa isa’t isa. Huwag ninyong ituon ang inyong isip sa matataas na bagay, kundi makisama kayo sa mga mababa ang kalagayan.[a] Huwag ninyong ituring ang inyong sarili na marurunong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga mapagpakumbaba” o “sa mabababang bagay.” Ang salitang Griyego ay maaaring tumukoy sa mga taong mababa ang kalagayan o mapagpakumbaba, o sa mabababang bagay.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Magkaisa kayo ng pag-iisip sa pakikitungo sa isa't isa
  rationale: Ipinahahayag nito ang magkakatugmang saloobin at pakikitungo sa loob ng pamayanan, hindi ang ganap na pagkakapareho ng bawat opinyon.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Huwag ninyong ituon ang isip sa matataas na bagay
  rationale: 'Pinananatili ang larawan ng Griyegong parirala at ang lawak nito: maaaring tumukoy sa kapalaluan, mataas na katayuan, o matataas na ambisyon.'
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: makisama kayo sa mga aba
  rationale: Natural sa modernong Tagalog ang 'makisama' para sa pakikipag-ugnayan o kusang pakikiisa. Ang 'mga aba' ay pangunahing nababasa bilang mga taong mababa ang kalagayan, habang inilalahad sa talababa ang posibleng pagtukoy sa mabababang bagay o gawain.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: Huwag ninyong ituring na marunong ang inyong sarili
  rationale: Inihahatid ang babala laban sa sariling pagtataya at pagmamataas sa karunungan; ang pautos na anyo ay natural at malinaw sa Tagalog.
theological_decisions:
- issue: Ang saklaw ng τὰ ὑψηλά at kasarian/kahulugan ng τοῖς ταπεινοῖς
  choice: matataas na bagay ... mga aba
  alternative: Huwag kayong magmataas, kundi italaga ang sarili sa mabababang gawain
  rationale: Hindi nililimitahan ang unang parirala sa panloob na kapalaluan lamang. Sa pangunahing teksto, ang kontekstong panlipunan ay ipinapahayag sa 'mga aba,' ngunit pinananatili sa talababa ang tunay na posibilidad na mabababang bagay o gawain ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang masyadong lumang 'mangagkaisa' at ang teknikal o di-likas na literal na 'magpadala kasama ng.'
