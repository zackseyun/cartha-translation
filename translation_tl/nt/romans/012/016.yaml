  to: Magkaroon kayo ng iisang saloobin sa isa’t isa. Huwag ninyong ituon ang inyong isip sa matataas na bagay, kundi makisama kayo sa mga mababa ang kalagayan.[a] Huwag ninyong ituring ang inyong sarili na marurunong.
  rationale: Inayos ang unang sugnay upang maging mas likas na Tagalog at mas tapat sa relasyonal na saklaw ng εἰς ἀλλήλους. Pinalitan ang “mga aba” ng mas neutral na “mga mababa ang kalagayan,” at inayos ang pangwakas na utos upang malinaw na maihatid ang sariling pagpapakamarunong. Pinananatili ng talababa ang hindi mapagpasyang kahulugan ng τοῖς ταπεινοῖς bilang mga tao o mga bagay.
