  terminology: Ang “matataas na bagay” ay angkop na malawak na katumbas ng τὰ ὑψηλά. Ang “makisama” ay isang likas na kontekstuwal na salin ng συναπαγόμενοι. Ang “Huwag ninyong ituring ang inyong sarili na marurunong” ay mas tuwirang naghahatid ng φρόνιμοι παρ’ ἑαυτοῖς kaysa sa isahang “marunong ang inyong sarili.”
