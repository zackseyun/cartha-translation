translation:
  language: tl
  text: Huwag kang padaig sa masama[a]; sa halip, daigin mo ang masama sa pamamagitan ng mabuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag mong hayaang madaig ka ng masama; sa halip, daigin mo ang masama sa pamamagitan ng mabuti.” Ang mga salitang Griyego ay mga pang-uring neuter na may pantukoy. Maaari silang isaling pangkalahatan bilang “masama” at “mabuti,” o bilang “kung ano ang masama” at “kung ano ang mabuti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Huwag kang padaig
  rationale: Ang kasalukuyang pautos na balintiyak na may μή ay isang pagbabawal. Likas sa modernong Tagalog ang “huwag kang padaig,” at pinananatili nito ang diwang matalo o madaig.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: sa masama
  rationale: Ang ὑπό na may genitive ay nagpapahayag ng gumaganap sa balintiyak na pandiwa. Ang articular neuter na τοῦ κακοῦ ay maaaring tumukoy sa “masama” bilang pangkalahatang kategorya o sa “anumang masama”; hindi nito kinakailangang tukuyin ang isang personal na masamang nilalang.
- source_word: ἀλλὰ νίκα
  choice: sa halip, daigin mo
  rationale: Malinaw na ipinakikita ng “sa halip” ang mariing pagsalungat ng ἀλλά. Ang “daigin mo” ay aktibong pautos at pinananatili ang pag-uugnay ng νικάω sa naunang “padaig.”
- source_word: ἐν τῷ ἀγαθῷ
  choice: sa pamamagitan ng mabuti
  rationale: 'Instrumental ang gamit ng ἐν dito: ang mabuti ang paraan upang daigin ang masama. Malinaw at natural sa Tagalog ang “sa pamamagitan ng mabuti.”'
- source_word: τὸ κακόν
  choice: ang masama
  rationale: Ang articular neuter singular ay ginagamit sa pangkalahatang diwa. Pinananatili ng “ang masama” ang maikli at matinding pagtatambis nito sa “mabuti.”
theological_decisions:
- issue: Kung ang κακός/ἀγαθός ay dapat gawing personal (“ang Masama”) o panatilihing mga kategoryang moral
  choice: 'Panatilihin bilang mga kategoryang moral: “masama” at “mabuti.”'
  alternative: Gawing personal ang masama, gaya ng “ang Masamang Isa.”
  rationale: Walang hinihingi sa sintaks na personal na nilalang, gaya ni Satanas, ang tinutukoy. Likas na sumusuporta ang mga anyong neuter sa abstrakto o kwalitatibong diwa, at ang konteksto ay tungkol sa wastong pagtugon sa ginagawang masama.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang singular na “kang/mo” upang tumbasan ang ikalawang panauhang singular sa Griyego; pinanatili rin ang matalim na retorikal na pagtatambis ng masama at mabuti.
