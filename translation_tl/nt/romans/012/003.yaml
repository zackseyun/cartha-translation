  to: 'Sapagkat sa pamamagitan ng biyayang ibinigay sa akin, sinasabi ko sa bawat isa sa inyo: huwag mag-isip tungkol sa sarili nang higit kaysa nararapat, kundi mag-isip nang may matinong paghatol,[a] ayon sa sukat ng pananampalataya na ibinahagi ng Diyos sa bawat isa.[b]'
