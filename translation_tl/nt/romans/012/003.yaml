id: ROM.12.3
reference: Romans 12:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: tl
  text: 'Sapagkat sa pamamagitan ng biyayang ibinigay sa akin, sinasabi ko sa bawat isa sa inyo: huwag mag-isip tungkol sa sarili nang higit kaysa nararapat, kundi mag-isip nang may matinong paghatol,[a] ayon sa sukat ng pananampalataya na ibinahagi ng Diyos sa bawat isa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kundi mag-isip upang maging matino.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang sukat ng pananampalataya,” “ang sukat ng pananampalataya,” o posibleng “isang sukat ng katapatan/pagtitiwala.” Tumutukoy ang pariralang Griyego sa isang sukat na may kaugnayan sa pananampalataya na ibinahagi ng Diyos, ngunit hindi nito tahasang nililinaw ang eksaktong diwa.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: sa pamamagitan ng biyayang ibinigay sa akin
  rationale: Ipinapahayag ang biyaya bilang paraan o batayan ng pagsasalita ni Pablo, nang hindi pinalalawak ang parirala tungo sa isang tiyak na paliwanag tungkol sa kanyang tungkulin.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: sa bawat isa sa inyo
  rationale: Likas sa modernong Tagalog at pinananatili ang pansarili at distributibong diin ng παντί.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: huwag magkaroon ng mas mataas na pagtingin sa sarili kaysa nararapat
  rationale: Malinaw na naihahatid ang pagbabawal sa labis na pagpapahalaga sa sarili at ang hangganang ipinahihiwatig ng παρ’ ὃ δεῖ, habang nananatiling natural sa Tagalog.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: kundi tingnan ang sarili nang may matinong paghatol
  rationale: Inihahatid ang diwa ng matino, mapagpigil, at wastong pagtatasa; bahagyang pinananatili rin ang pag-uulit ng ideya ng pag-iisip o pagtingin sa sarili.
- source_word: ἐμέρισεν
  choice: ipinamahagi
  rationale: Ipinapakita ang sinadya at distributibong pagkilos ng Diyos sa pagbibigay sa bawat isa.
- source_word: μέτρον πίστεως
  choice: sukat ng pananampalataya
  rationale: Pinananatili ang malawak at hindi ganap na tinukoy na ugnayan ng ‘sukat’ at ‘pananampalataya,’ sa halip na ipakahulugan agad bilang kaligtasan, kakayahan sa paglilingkod, o pamantayan.
theological_decisions:
- issue: Kahulugan ng μέτρον πίστεως
  choice: Panatilihin ang malawak na pariralang “sukat ng pananampalataya.”
  alternative: “isang sukat ng pagtitiwala,” “ang pamantayan ng pananampalataya,” o isang kakayahang ibinigay ng Diyos para sa paglilingkod
  rationale: Bagaman ang kasunod na konteksto ay tumatalakay sa magkakaibang kaloob, hindi tiyak na nililimitahan ng Griyego ang parirala sa isang partikular na doktrinal na kahulugan. Pinananatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matinong paghatol” upang maging malinaw sa karaniwang mambabasa, at iniwasan ang teknikal o denominasyonal na pagpapakahulugan. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
