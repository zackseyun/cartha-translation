  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: tl
  text: Sa pagmamahalang magkakapatid, maging magiliw at mapagmahal kayo sa isa't isa. Sa pagbibigay-galang, unahan ninyo ang isa't isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: pag-ibig bilang magkakapatid
  rationale: Ipinahahayag ang pag-ibig na nararapat sa magkakapatid sa pananampalataya, nang hindi nililimitahan sa literal na magkakadugo.
- source_word: φιλόστοργοι
  choice: maging magiliw
  rationale: Ipinapakita ang mainit at mapagmahal na malasakit na karaniwang kaugnay ng pagmamahalan sa pamilya.
- source_word: προηγούμενοι
  choice: pangunahan ninyo
  rationale: Pinananatili ang diwa ng pag-una o pangunguna sa pagpapakita ng karangalan; hindi ito tahasang nilulutas bilang simpleng pagbibigay-preperensiya lamang o pakikipagpaligsahan.
- source_word: τιμῇ
  choice: sa pagbibigay-galang
  rationale: Natural na Filipino para sa paggalang o pagpaparangal na aktibong ibinibigay sa kapwa.
theological_decisions:
- issue: Saklaw ng φιλαδελφία
  choice: pag-ibig bilang magkakapatid
  alternative: pag-ibig sa mga kapatid
  rationale: Pinananatili ang larawang pampamilya ng pamayanang mananampalataya nang hindi nagdaragdag ng tahasang salitang 'pananampalataya' na wala sa talata.
- issue: Ambiguwidad ng προηγούμενοι
  choice: pangunahan ninyo ang isa't isa
  alternative: higitan ninyo ang isa't isa / unahin ninyo ang isa't isa
  rationale: Maaaring tumukoy ang pandiwa sa pangunguna sa pagpaparangal o sa pag-una sa pagkilala sa kapwa. Ang saling ito ay nagpapanatili sa tensiyong iyon at umiiwas sa sobrang kompetitibong pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'kayo' at 'ninyo' upang luminaw na maramihan ang mga pautos. Walang footnote dahil sapat na naipahahayag sa pangunahing teksto ang leksikal na tensiyon.
