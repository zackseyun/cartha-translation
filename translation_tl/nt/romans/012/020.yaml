reference: Romans 12:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: tl
  text: Ngunit kung nagugutom ang kaaway mo, pakainin mo siya; kung nauuhaw siya, painumin mo siya. Sapagkat sa paggawa nito, magbubunton ka ng nagbabagang mga baga sa ulo niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “mga baga ng apoy.” Maaaring ipinahihiwatig ng larawan ang kahihiyang humahantong sa pagsisisi, masakit na paghatol ng budhi, o nalalapit na paghatol; pinanatili sa pangunahing teksto ang talinghagang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Ngunit kung
  rationale: Pinananatili ng “ngunit” ang pagsalungat sa naunang pagbabawal na maghiganti, at malinaw na ipinahahayag ng “kung” ang kondisyon.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: nagugutom ang kaaway mo
  rationale: Likas na modernong Tagalog ito para sa kasalukuyang kalagayan, habang pinananatili ang isahang “kaaway mo.”
- source_word: ψώμιζε αὐτόν
  choice: pakainin mo siya
  rationale: Tuwirang ipinahahayag ang utos na bigyan ng pagkain ang kaaway.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: kung nauuhaw siya, painumin mo siya
  rationale: Ang “painumin” ay natural at hindi nagdaragdag ng espesipikong inumin na wala sa Griyego.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Sapagkat sa paggawa nito
  rationale: 'Ipinakikita ang paliwanag at ang ugnayang instrumental ng participle: ang bunga ay kaugnay ng paggawa ng mga iniutos.'
- source_word: ἄνθρακας πυρὸς
  choice: nagbabagang mga baga
  rationale: Natural na katumbas ito ng konkretong larawan ng mga baga ng apoy at hindi pinapahina ang talinghaga.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: magbubunton ka ... sa ulo niya
  rationale: Pinananatili ang anyong panghinaharap at ang matingkad na larawan ng pagbubunton sa ulo.
theological_decisions:
- issue: Kahulugan ng talinghagang “magbubunton ... ng nagbabagang mga baga sa ulo niya”
  choice: Panatilihin ang talinghaga sa pangunahing teksto nang hindi ito binibigyang-kahulugan doon.
  alternative: Maaaring tumukoy ito sa kahihiyang humahantong sa pagsisisi, masakit na paghatol ng budhi, o nalalapit na paghatol.
  rationale: Hindi tiyak ang layon ng talinghaga. Ang pagpapanatili sa orihinal na larawan ay hindi tahimik na pumipili sa isa sa mga pinagtatalunang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang “siya/niya” alinsunod sa isahang anyo ng Griyego; hindi tinukoy ang kasarian nang higit sa hinihingi ng karaniwang gramatika ng Tagalog.
