  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: tl
  text: 'Mayroon naman tayong magkakaibang kaloob ayon sa biyayang ibinigay sa atin: kung propesiya[a], ayon sa proporsiyon ng pananampalataya;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa proporsiyon ng sariling pananampalataya”; maaari rin namang “kaayon ng pananampalataya.” Maaaring tumukoy ang pariralang Griyego sa sukat ng pananampalatayang ipinagkaloob sa nagsasalita o sa pagkakatugma sa nilalaman ng pananampalatayang Kristiyano.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: At yamang mayroon tayong
  rationale: Ipinagpapatuloy ng participle ang daloy mula sa naunang talata. Natural sa Tagalog ang “yamang mayroon,” habang ang “At” ay nagpapakita ng banayad na pagpapatuloy ng kaisipan.
- source_word: χαρίσματα ... διάφορα
  choice: iba’t ibang kaloob
  rationale: Ang “kaloob” ay malinaw at karaniwang salin ng χάρισμα, at ang “iba’t ibang” ay likas na nagpapahayag ng pagkakaiba-iba ng mga ito.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: ayon sa biyayang ibinigay sa atin
  rationale: Pinananatili ng “ayon sa” ang diwa ng pagtutugma o pagkakaayon sa κατά, at ng “biyaya” ang mapagpalang pagkakaloob ng Diyos sa χάρις.
- source_word: εἴτε προφητείαν
  choice: kung propesiya
  rationale: Pinananatili ang maikli at eliptikong anyo ng unang item sa talaan ng mga kaloob. Ang “propesiya” ay tuwiran at hindi dinaragdagan ng paliwanag na wala sa Griyego.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: ayon sa sukat ng pananampalataya
  rationale: Ipinahahayag ng “sukat” ang proporsiyon o wastong kaugnayan ng ἀναλογία. Pinananatiling malawak ng “pananampalataya” ang πίστις upang hindi tahasang pagpasyahan kung sariling pananampalataya ng nagsasalita o ang nilalaman ng pananampalatayang Cristiano ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: ayon sa sukat ng pananampalataya
  alternative: ayon sa sukat ng sariling pananampalataya; o kaayon ng pananampalataya
  rationale: Maaaring tumukoy ang maikling pariralang Griyego sa antas ng pananampalatayang ipinagkaloob sa nagsasalita o sa pagkakatugma ng propesiya sa nilalaman ng pananampalatayang Cristiano. Hindi nilulutas ng pangunahing teksto ang tunay na kalabuan; inilalahad sa talababa ang dalawang pangunahing pagbasa.
- issue: Ipinahiwatig na pandiwa sa eliptikong parirala εἴτε προφητείαν
  choice: gamitin ito
  alternative: kung propesiya lamang, ayon sa sukat ng pananampalataya
  rationale: Walang tahasang pandiwa sa Griyego, ngunit hinihingi ng likas na Tagalog ang isang pandiwa upang maging malinaw ang pangaral. Ang “gamitin ito” ay minimal na paglalantad ng ipinahihiwatig na diwa at hindi tinutukoy kung pagsasalita o ibang paraan ng pagsasagawa.
translation_notes:
  register: Modernong Filipino na may dignidad at madaling maunawaan. Ginamit ang “kaloob,” “biyaya,” “propesiya,” at “pananampalataya” bilang pamilyar ngunit hindi sektaryong bokabularyong biblikal. Ang “gamitin ito” ay idinagdag para sa natural na Tagalog bilang minimal na paglilinaw sa elipsis ng Griyego.
