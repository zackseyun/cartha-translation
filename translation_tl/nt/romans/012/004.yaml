  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: tl
  text: Sapagkat kung paanong mayroon tayong maraming bahagi[a] sa iisang katawan, ngunit hindi pare-pareho ang gawain[b] ng lahat ng bahaging iyon,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sangkap.”
    reason: lexical_alternative
  - marker: b
    text: O “pagganap.” Ang salitang Griyego ay maaaring tumukoy sa gawain o paggana ng isang bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan sa naunang talata, at ng “kung paanong” ang paghahambing na bubuuin sa susunod na talata.
- source_word: ἐν ἑνὶ σώματι
  choice: sa iisang katawan
  rationale: Likas na Tagalog ito para sa lokatibong parirala at malinaw na pinananatili ang pagkakaisa ng katawan sa talinghaga.
- source_word: πολλὰ μέλη
  choice: marami tayong bahagi
  rationale: Sa modernong Tagalog, mas malinaw at natural ang “mga bahagi” kaysa “mga sangkap” o literal na “mga miyembro,” habang napapanatili ang larawan ng katawan.
- source_word: ἔχομεν
  choice: mayroon tayong / marami tayong
  rationale: Isinama ang diwa ng “mayroon tayo” sa natural na ayos na “marami tayong bahagi.”
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: ngunit hindi ... ng lahat ng bahagi
  rationale: Ipinahihiwatig nang tama na hindi magkakapareho ang lahat, sa halip na sabihing walang sinumang bahagi ang may gayong gawain.
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: iisa ang gawain
  rationale: Ang “gawain” ay natural at malawak na katumbas ng πρᾶξις sa konteksto; hindi nito labis na ginagawang teknikal ang magkakaibang paggana ng mga bahagi.
theological_decisions:
- issue: Eclesiolohikal na diwa ng talinghaga ng katawan
  choice: Panatilihin lamang ang “iisang katawan” at “mga bahagi” nang hindi tahasang idinaragdag ang iglesya.
  alternative: “iisang katawan, ang iglesya”
  rationale: Talinghaga muna ang inilalahad sa talatang ito; saka pa lamang tuwirang inilalapat sa kasunod na talata. Pinananatili nito ang takbo ng pangungusap at hindi nagdaragdag ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bahagi” upang maging natural ang talinghaga ng katawan; iniwasan ang “miyembro,” na sa kasalukuyang gamit ay mas madaling unawain bilang kasapi ng samahan kaysa bahagi ng katawan.
