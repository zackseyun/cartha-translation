  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: tl
  text: Pagpalain ninyo ang mga umuusig sa inyo[a]; pagpalain ninyo sila at huwag sumpain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga humahabol sa inyo.” Maaaring mangahulugang “humahabol” ang pandiwang Griego, ngunit dito ay malamang na tumutukoy ito sa pag-uusig.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Pagpalain ninyo
  rationale: Ang maramihang pautos ay likas na naipapahayag sa modernong Tagalog sa “Pagpalain ninyo.” Pinananatili rin ang pag-uulit upang maipakita ang diin ni Pablo.
- source_word: τοὺς διώκοντας
  choice: ang mga umuusig sa inyo
  rationale: Ang may-artikulong participle ay tumutukoy sa mga taong gumagawa ng kilos. Bagaman maaaring mangahulugang “humahabol” ang διώκω, ipinahihiwatig ng konteksto ang mapanlabang pag-uusig. Idinagdag ang “sa inyo” bilang likas na paglilinaw ng ipinahihiwatig na layon.
- source_word: καὶ
  choice: at
  rationale: Payak na pang-ugnay ito sa pagitan ng inuulit na positibong utos at ng negatibong utos.
- source_word: μὴ καταρᾶσθε
  choice: huwag sumpain
  rationale: Malinaw at tuwirang ipinapahayag nito ang pagbabawal at pinananatili ang matinding pagsalungat sa “pagpalain.”
theological_decisions:
- issue: Saklaw ng kahulugan ng διώκω sa konteksto
  choice: Isinalin bilang mapanlabang pag-uusig
  alternative: mga humahabol sa inyo
  rationale: Maaaring tumukoy ang pandiwa sa simpleng paghabol, ngunit sa kontekstong etikal ng talata at sa pagsalungat ng pagpapala at pagsumpa, mas malamang na tumutukoy ito sa pag-uusig. Inilalahad sa talababa ang mas malawak na literal na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa karaniwang mambabasa. Ang “ninyo” ay nagpapanatili sa maramihang utos; ang “sila” sa ikalawang sugnay ay nagbibigay ng natural na daloy nang hindi binabago ang tinutukoy.
