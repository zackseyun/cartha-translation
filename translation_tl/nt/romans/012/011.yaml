id: ROM.12.11
reference: Romans 12:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: tl
  text: Huwag kayong maging tamad sa pagsisikap; maging maningas sa espiritu[a]; maglingkod kayo sa Panginoon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa Espiritu,” kung ang tinutukoy ay ang Banal na Espiritu sa halip na espiritu ng mananampalataya.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: sa pagsisikap
  rationale: Ipinahahayag ng σπουδή ang masigasig at taimtim na pagsisikap. Ang “sa pagsisikap” ay likas sa makabagong Tagalog at malinaw na kasalungat ng “maging tamad,” habang taglay pa rin ang diwa ng sigasig.
- source_word: ὀκνηροί
  choice: maging tamad
  rationale: Ang ὀκνηρός ay tumutukoy sa pagiging mabagal, nag-aatubili, o tamad sa pagkilos. Ang “maging tamad” ay tuwiran, pangkaraniwan, at angkop sa pautos na pangungusap.
- source_word: πνεύματι
  choice: sa espiritu
  rationale: Hindi tiyak sa Griyego kung ang tinutukoy ay espiritu ng tao o ang Banal na Espiritu. Pinananatili ng “sa espiritu” ang leksikal na anyo at ang tunay na kalabuan; inilalahad sa talababa ang dalawang posibleng pakahulugan.
- source_word: ζέοντες
  choice: maging maningas
  rationale: Literal na nagpapahiwatig ang ζέω ng pagkulo at metaporikal na matinding sigla. Ang “maningas” ay natural at marangal, at pinananatili ang larawan ng nag-aalab na sigasig.
- source_word: κυρίῳ
  choice: sa Panginoon
  rationale: Ang κύριος sa kontekstong Paulino ay angkop na isalin bilang “Panginoon,” malamang na tumutukoy kay Jesus, nang hindi dinaragdagan ang mismong titulo.
- source_word: δουλεύοντες
  choice: maglingkod kayo
  rationale: Bagaman kaugnay ng pagkaalipin ang δουλεύω, sa ganitong panawagan ang “maglingkod” ang natural na salin para sa tapat na paglilingkod at pagsunod sa Panginoon.
theological_decisions:
- issue: Ang tinutukoy ng πνεύματι sa τῷ πνεύματι ζέοντες
  choice: 'Pinananatiling hindi tahasang tinutukoy sa pangunahing teksto: “sa espiritu”'
  alternative: “sa Espiritu,” kung ang tinutukoy ay ang Banal na Espiritu
  rationale: Walang pantukoy o ibang tahasang palatandaan sa parirala na ganap na lumulutas kung espiritu ng mananampalataya o ang Banal na Espiritu ang tinutukoy. Ang pangunahing salin at talababa ay nagpapanatili sa teolohikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakatulad na pautos—“Huwag kayong…; maging…; maglingkod kayo…”—upang maipakita ang sunod-sunod na paghimok ng Griyego nang hindi nagiging matigas o lipas ang pananalita.
