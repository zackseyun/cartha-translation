    rationale: Sa modernong Tagalog, ang “mapagtibay” ay karaniwang ‘makumpirma’ o ‘mapatunayan.’ Mas malapit sa saklaw ng δοκιμάζω ang “masuri” at “makilala ang karapat-dapat sang-ayunan.”
