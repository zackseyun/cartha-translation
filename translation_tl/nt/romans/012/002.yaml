  naturalness: Natural at marangal ang kabuuang Tagalog. Mas natural din ang “masuri ninyo kung ano ang kalooban ng Diyos” sa kontekstong ito kaysa sa paglalagay ng mas mabigat na dalawang pandiwa sa pangunahing teksto.
  terminology: Ang “kapanahunang ito,” “magpahubog,” “pagpapanibago ng inyong pag-iisip,” “kalooban ng Diyos,” “kalugod-lugod,” at “ganap” ay angkop. Pinananatili ng “kapanahunan” ang αἰών bilang kasalukuyang panahon/kaayusan, hindi bilang nilikhang daigdig.
