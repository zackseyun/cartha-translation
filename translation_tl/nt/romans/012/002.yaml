id: ROM.12.2
reference: Romans 12:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: tl
  text: Huwag kayong magpahubog ayon sa kapanahunang ito[a], kundi magpabago kayo sa pamamagitan ng pagpapanibago ng inyong pag-iisip, upang masuri ninyo[b] kung ano ang kalooban ng Diyos—ang mabuti, kalugod-lugod[c], at ganap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sanlibutang ito.” Mas tiyak na tumutukoy ang Griyegong αἰών sa isang kapanahunan—dito, sa kasalukuyang panahon o kaayusan.
    reason: lexical_alternative
  - marker: b
    text: O “upang makilala ninyo kung ano ang kalooban ng Diyos.” Maaaring saklawin ng pandiwang Griyego ang pagsusuri at ang pagkilala sa kung ano ang karapat-dapat sang-ayunan.
    reason: lexical_alternative
  - marker: c
    text: Maaaring mangahulugan ang “kalugod-lugod” ng kalugod-lugod sa Diyos; maaari rin itong isaling “katanggap-tanggap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: magpahubog ayon sa
  rationale: Ipinahahayag nito ang pagkuha sa panlabas na hulma o huwaran ng isang bagay, at pinananatili ang diwang pasibo/medyal ng utos.
- source_word: αἰῶνι τούτῳ
  choice: kapanahunang ito
  rationale: Ang αἰών ay tumutukoy rito sa kasalukuyang panahon o kaayusan, hindi pangunahin sa nilikhang daigdig.
- source_word: μεταμορφοῦσθε
  choice: magpabago kayo
  rationale: Natural itong utos sa makabagong Tagalog para sa malalim na pagbabago at nagpapanatili ng kaibahan sa panlabas na pagpapahubog.
- source_word: τῇ ἀνακαινώσει
  choice: sa pamamagitan ng pagpapanibago
  rationale: 'Ginagawang lantad ang instrumental na gamit ng datibo: nagaganap ang pagbabago sa pamamagitan ng renewal.'
- source_word: τοῦ νοός
  choice: ng inyong pag-iisip
  rationale: Ang νοῦς dito ay kakayahang umunawa at humatol sa usaping moral at espirituwal; natural sa Tagalog ang tahasang panghalip para sa maramihang kausap.
- source_word: εἰς τὸ δοκιμάζειν
  choice: upang makilala ninyo
  rationale: Ipinahahayag ang layunin at ang pagkilala sa kalooban ng Diyos, habang iniiwan sa talababa ang mas lantad na diwa ng pagsubok at pagsang-ayon.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: kung ano ang kalooban ng Diyos
  rationale: Pinananatili ang di-tuwirang tanong at ang tahasang kaugnayan ng kalooban sa Diyos.
- source_word: ἀγαθὸν
  choice: mabuti
  rationale: Tuwirang inilalarawan ang katangian ng kalooban ng Diyos.
- source_word: εὐάρεστον
  choice: kalugod-lugod
  rationale: Pinananatili ang diwa ng pagiging pleasing nang hindi sapilitang tinutukoy sa pangunahing teksto kung kanino ito kalugod-lugod.
- source_word: τέλειον
  choice: ganap
  rationale: Ang “ganap” ay natural at marangal na salin na maaaring magpahiwatig ng pagiging buo o walang kakulangan.
theological_decisions:
- issue: Etikal at temporal na diwa ng αἰών
  choice: kapanahunang ito
  alternative: sanlibutang ito
  rationale: Iniiwasan nitong ipakahulugan na masama ang nilikhang daigdig mismo at pinananatili ang pagtukoy ni Pablo sa kasalukuyang panahon o kaayusan.
- issue: Saklaw ng δοκιμάζειν kaugnay ng kalooban ng Diyos
  choice: makilala
  alternative: suriin at pagtibayin
  rationale: Malinaw at natural ang “makilala,” ngunit kinikilala sa talababa na maaari ring saklawin ng pandiwa ang pagsusuri at pagkilala sa kung ano ang karapat-dapat sang-ayunan.
- issue: Tinutukoy ng εὐάρεστον
  choice: kalugod-lugod, nang walang tahasang layon
  alternative: kalugod-lugod sa Diyos
  rationale: Hindi tahasang sinasabi ng pariralang Griyego kung kanino ito kalugod-lugod, kaya hindi iyon nilulutas sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang maramihang “kayo/ninyo” ayon sa mga pandiwang Griyego. Pinanatili ang tatlong pang-uri bilang apposisyon sa “kalooban ng Diyos,” gaya ng ayos ng Griyego, at inilagay ang lahat ng marker na [a], [b], at [c] sa pangunahing teksto.
