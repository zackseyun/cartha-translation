  text: εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: tl
  text: kung paglilingkod[a], sa paglilingkod; kung ang nagtuturo, sa pagtuturo[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ministeryo.” Maaaring mangahulugan ang salitang Griyego ng paglilingkod o ministeryo, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “kung ang guro, sa pagtuturo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: kung
  rationale: Sa maikli at eliptikong talaan ng mga kaloob o gawain, likas na ipinakikilala ng “kung” ang bawat kasunod na kalagayan at napapanatili nito ang paralel na ayos.
- source_word: διακονίαν
  choice: paglilingkod
  rationale: Malawak at natural ang “paglilingkod” at maaari itong tumukoy sa praktikal na pagtulong o ministeryo nang hindi agad ipinapalagay na isang pormal na katungkulan sa iglesya.
- source_word: ἐν τῇ διακονίᾳ
  choice: sa paglilingkod
  rationale: Pinananatili nito ang pag-uulit ng pangngalan at ang maikli, eliptikong anyo ng Griyego, na tumutukoy sa pagtuon sa larangan ng paglilingkod.
- source_word: ὁ διδάσκων
  choice: ang nagtuturo
  rationale: Tuwirang inilalarawan ng pariralang ito ang taong gumagawa ng pagtuturo, sa halip na gawing titulo ng isang pormal na katungkulan ang salita.
- source_word: διδασκαλίᾳ
  choice: pagtuturo
  rationale: Ang “pagtuturo” ang pinakadirekta at malinaw na katumbas dito; hindi nito nililimitahan ang kahulugan sa teknikal na “doktrina.”
theological_decisions:
- issue: Kung gagamit ng terminolohiyang tahasang pang-iglesya para sa διακονία
  choice: paglilingkod
  alternative: ministeryo
  rationale: Ang konteksto ay talaan ng mga kaloob o gawain. Pinananatili ng “paglilingkod” ang lawak ng termino at iniiwasang limitahan ito sa pormal na ministeryo o katungkulan.
- issue: Kung ituturing na titulo ng katungkulan ang ὁ διδάσκων
  choice: ang nagtuturo
  alternative: ang guro
  rationale: Ang Griyego ay isang substantibong pandiwaring nagbibigay-diin sa taong gumagawa ng pagtuturo, hindi tahasang sa isang opisyal na titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang maikli at eliptikong paralelismo ng Griyego, pati ang pag-uulit ng “paglilingkod” at “pagtuturo.”
