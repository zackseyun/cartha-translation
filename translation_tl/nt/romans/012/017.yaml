  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: tl
  text: Huwag ninyong gantihan ng masama ang sinuman sa kanyang kasamaan. Isaalang-alang ninyo ang mabuti[a] sa paningin ng lahat ng tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang marangal” o “ang kagalang-galang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: ang sinuman
  rationale: Kasama ng negatibong μηδέ, ipinahahayag nito ang ganap na saklaw na ‘walang sinuman’; natural sa Tagalog ang ayos na ‘Huwag ... ang sinuman.’
- source_word: κακὸν ἀντὶ κακοῦ
  choice: gantihan ng masama ... dahil sa masamang ginawa niya
  rationale: Ipinapakita ng ‘gantihan’ ang pagbabalik bilang tugon na nasa ἀποδιδόντες at ang palitang o pagganting diwa ng ἀντί. Nililinaw ng parirala ang likas na relasyon ng dalawang pagbanggit sa ‘masama’ nang hindi nililimitahan iyon sa pisikal na pananakit.
- source_word: ἀποδιδόντες
  choice: Huwag ninyong gantihan
  rationale: Ang participle ay may lakas ng isang utos sa konteksto. Ang ‘gantihan’ ay likas at malinaw na salitang Tagalog para sa pagbabalik ng masama bilang tugon.
- source_word: προνοούμενοι
  choice: Isaalang-alang ninyo
  rationale: Ipinahahayag nito ang maingat at sinasadyang pag-iisip tungkol sa gagawin. Hindi nito labis na nililimitahan ang salita sa materyal na paglalaan, bagaman bahagyang hindi lantad ang aspektong paunang pag-iisip.
- source_word: καλὰ
  choice: ang mabuti
  rationale: Malawak nitong pinananatili ang moral na diwa ng καλός. Ang posibleng diin sa marangal o kapuri-puri ay inilalagay sa talababa upang hindi makitid ang pangunahing salin.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: sa paningin ng lahat ng tao
  rationale: Malapit itong tumutugma sa literal at pampublikong diwa ng ἐνώπιον, at ang ‘lahat ng tao’ ay pangkalahatan at hindi nakatali sa kasarian.
theological_decisions:
- issue: Etikal at pampublikong diwa ng καλά
  choice: ang mabuti
  alternative: ang marangal o kapuri-puri
  rationale: Maaaring saklaw ng parirala kapwa ang tunay na kabutihang moral at ang asal na kinikilalang marangal sa harap ng iba. Pinananatiling malawak ng pangunahing teksto ang kahulugan at itinatala sa talababa ang ibang tunay na nuances.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang maramihang ‘ninyo’ ayon sa ipinahihiwatig na mga kausap, at iniwasan ang sobrang pormal o makalumang pananalita.
