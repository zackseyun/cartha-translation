id: ROM.12.1
reference: Romans 12:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: tl
  text: 'Kaya nga, mga kapatid[a], nakikiusap ako sa inyo alang-alang sa mga habag ng Diyos: ialay ninyo ang inyong mga katawan bilang isang handog na buháy, banal, at kalugod-lugod sa Diyos—ito ang inyong makatuwirang pagsamba.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griego ay nasa anyong “mga kapatid na lalaki,” ngunit madalas itong gamitin sa pagtawag sa magkakahalong pangkat ng mga lalaki at babae.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “ito ang inyong espirituwal na pagsamba” o “ito ang inyong makatuwirang paglilingkod.” Ang salitang Griego ay maaaring magpahiwatig ng makatuwiran, angkop, o espirituwal na pagsamba o paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: nakikiusap ako
  rationale: Nagpapahayag ito ng taimtim at mariing pakiusap o panawagan. Likas sa modernong Tagalog ang “nakikiusap ako” at hindi kasingtindi ng pag-uutos.
- source_word: οὖν
  choice: Kaya nga
  rationale: Pinananatili nito ang lohikal na paghinuha mula sa paglalahad sa Roma 1–11.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ay likas na salin sa Tagalog, maaaring tumukoy sa mga lalaki at babae, at angkop sa pagtawag sa buong pamayanang Cristiano.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: alang-alang sa mga habag ng Diyos
  rationale: Ipinahihiwatig ng διά na ang mga habag ng Diyos ang batayan ng pakiusap. Pinananatili ng “mga habag” ang anyong maramihan ng οἰκτιρμῶν.
- source_word: παραστῆσαι
  choice: ialay
  rationale: Sa kontekstong pansakripisyo, malinaw at natural na ipinapahayag ng “ialay” ang paghaharap o paghahandog sa Diyos.
- source_word: τὰ σώματα ὑμῶν
  choice: ang inyong mga katawan
  rationale: Pinananatili ang kongkretong salitang σώματα sa halip na gawing pangkalahatang “ang inyong sarili.”
- source_word: θυσίαν ζῶσαν
  choice: bilang isang handog na buháy
  rationale: Pinananatili ang kabalintunaang larawan ng isang handog na patuloy na nabubuhay. Ginamit ang tuldik upang luminaw na “alive,” hindi “life.”
- source_word: ἁγίαν
  choice: banal
  rationale: Karaniwan at teolohikal na mabigat na katumbas ito ng ἁγίαν, na tumutukoy sa nakatalaga sa Diyos.
- source_word: εὐάρεστον τῷ θεῷ
  choice: kalugod-lugod sa Diyos
  rationale: Tumpak nitong ipinahahayag ang bagay na nakalulugod at katanggap-tanggap sa Diyos, nang hindi nagpapahiwatig ng basta pinakamababang pagtanggap.
- source_word: λογικὴν
  choice: makatuwiran
  rationale: Pinananatili nito ang kaugnayan sa isip, katuwiran, at pagiging angkop nang hindi tiyakang nilulutas ang posibilidad ng kahulugang “espirituwal.”
- source_word: λατρείαν
  choice: pagsamba
  rationale: Malinaw nitong ipinahahayag ang paglilingkod na iniuukol sa Diyos; pinatitibay ng larawan ng paghahandog ang kontekstong pansamba.
theological_decisions:
- issue: Ang saklaw ng ἀδελφοί sa pagtawag sa kapulungan
  choice: mga kapatid
  alternative: mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking maramihan ang anyong Griego, karaniwan itong kumakatawan sa magkakahalong pangkat. Ang “mga kapatid” sa Tagalog ay natural na hindi natatali sa kasarian; nililinaw ng talababa ang anyong pinagmulan.
- issue: Ang kahulugan ng λογικὴν λατρείαν
  choice: inyong makatuwirang pagsamba
  alternative: inyong espirituwal na pagsamba; inyong makatuwirang paglilingkod
  rationale: Maaaring tumukoy ang λογικός sa makatuwiran, angkop, o espirituwal, at maaaring mangahulugan ang λατρεία ng pagsamba o paglilingkod. Pinananatili ng pangunahing salin ang lapit sa anyo at ang tunay na kalabuan, habang inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakikiusap,” “ialay,” at “kalugod-lugod” upang panatilihin ang taimtim at pansakripisyong himig. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
