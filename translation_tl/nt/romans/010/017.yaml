base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: tl
  text: Kaya ang pananampalataya ay nagmumula sa pakikinig, at ang pakikinig ay sa pamamagitan ng salita ng Mesiyas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari rin itong isalin na “salita tungkol sa Mesiyas” o “mensahe tungkol sa Mesiyas.” Maaaring higit sa isa ang pagkaunawa sa genitive sa Griyego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Kaya
  rationale: Naghahayag ito ng kongklusyon mula sa naunang pangangatwiran at likas pakinggan sa makabagong Tagalog.
- source_word: πίστις
  choice: pananampalataya
  rationale: Sa konteksto ng Roma 10:14–16, tumutukoy ito sa tugon ng tao sa ipinahayag na mabuting balita, hindi pangunahin sa katapatan.
- source_word: ἐξ ἀκοῆς
  choice: nagmumula sa pakikinig
  rationale: Ipinahihiwatig ng ἐξ ang pinagmulan; ang idinagdag na “nagmumula” ay malinaw at natural na nagpapahayag sa sugnay na walang tahasang pandiwa sa Griyego.
- source_word: ἀκοή
  choice: pakikinig
  rationale: Maaaring tumukoy ang salita sa kilos ng pakikinig o sa narinig na mensahe. Pinananatili rito ang diwa ng pakikinig at ang pag-uulit ng parehong salita sa dalawang sugnay.
- source_word: δὲ
  choice: at
  rationale: Mahinang pagpapatuloy ang tungkulin nito rito, hindi matinding pagsalungat.
- source_word: διὰ
  choice: sa pamamagitan ng
  rationale: Malinaw nitong ipinahahayag ang paraan o kasangkapang ipinakikita ng διά na may genitive.
- source_word: ῥήματος
  choice: salita
  rationale: Ang ῥῆμα ay karaniwang tumutukoy sa binigkas na salita o pahayag; pinananatili ng “salita” ang leksikal at tradisyonal na anyo nang nauunawaan pa rin sa konteksto.
- source_word: Χριστοῦ
  choice: ng Mesiyas
  rationale: Ginagamit ang “Mesiyas” sapagkat pamagat ang Χριστός. Pinananatili ng “ng Mesiyas” ang kalabuan ng ugnayang genitive sa halip na tahasang ipakahulugang “tungkol sa Mesiyas.”
theological_decisions:
- issue: Kahulugan ng πίστις sa talatang ito
  choice: pananampalataya
  alternative: pagtitiwala; katapatan
  rationale: Ang agarang konteksto ay tungkol sa pagtugon ng tao sa ipinangangaral na mensahe; hindi nararapat ipasok dito ang mas tiyak na diwa ng “katapatan.”
- issue: Ugnayan ng Χριστοῦ sa ῥήματος
  choice: salita ng Mesiyas
  alternative: salita tungkol sa Mesiyas; mensaheng tungkol sa Mesiyas
  rationale: Maaaring unawain ang genitive bilang salita na nagmumula o nauukol sa Mesiyas, o bilang salita tungkol sa Mesiyas. Pinananatili sa pangunahing teksto ang mas pormal at bukás na anyo, at inilalagay sa talababa ang interpretatibong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang magkatulad na salitang “pakikinig” sa dalawang sugnay upang maipakita ang pag-uulit sa Griyego, at ginamit ang “Mesiyas” bilang pamagat.
