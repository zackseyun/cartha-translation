id: ROM.10.5
reference: Romans 10:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: tl
  text: 'Sapagkat isinulat ni Moises tungkol sa katuwirang nagmumula sa Kautusan: “Ang taong gumagawa nito ay mabubuhay sa pamamagitan nito.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan” para sa “katuwiran.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mabubuhay dito” o “mabubuhay ayon dito.” Isahan ang panghalip sa Griyego; umaalingawngaw rito ang Levitico 18:5.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagpapakita ito ng paliwanag na kaugnay ng naunang argumento; natural at malinaw ang “Sapagkat” sa Filipino.
- source_word: γράφει
  choice: isinulat
  rationale: Bagaman pangkasalukuyan ang anyo sa Griyego, karaniwang ipinahahayag sa Filipino ang nakasulat na patotoo ni Moises sa ganitong paraang pangnagdaan.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Pinananatili nito ang mahalagang ugnayan sa talakayan ni Pablo tungkol sa pagiging matuwid at sa katayuang matuwid; inilalagay sa talababa ang “katarungan” bilang leksikal na alternatibo.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: na nagmumula sa Kautusan
  rationale: Malinaw na ipinahahayag ang pinagmulan na tinutukoy ng ἐκ at napapanatili ang paghahambing ni Pablo sa iba’t ibang uri o batayan ng katuwiran.
- source_word: νόμου
  choice: Kautusan
  rationale: Sa konteksto, tumutukoy ito sa kinikilalang Kautusan ni Moises; ang malaking titik ay tumutulong ipakita ang tiyak na reperensiya nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Ang taong gumagawa nito
  rationale: Ang “tao” ay likas na panlahatan sa Filipino at tapat sa ἄνθρωπος. Ipinahahayag ng pangkasalukuyang “gumagawa” ang pangkalahatang prinsipyong nakapaloob sa sipi.
- source_word: ζήσεται
  choice: mabubuhay
  rationale: Tuwirang katumbas ito ng panghinaharap na pandiwa at pinananatili ang puwersa ng sipi mula sa Levitico.
- source_word: ἐν αὐτῇ
  choice: sa pamamagitan nito
  rationale: Pinananatili ng “nito” ang isahang panghalip ng tekstong Griyego, samantalang ipinahahayag ng “sa pamamagitan” ang posibleng instrumental na diwa. Inilalahad sa talababa ang ibang posibleng pag-unawa.
theological_decisions:
- issue: Pagpapahayag ng δικαιοσύνη sa paghahambing ni Pablo
  choice: katuwiran
  alternative: katarungan
  rationale: Mas malinaw na inuugnay ng “katuwiran” ang talatang ito sa paghahambing ng katuwirang mula sa Kautusan at katuwirang mula sa pananampalataya, ngunit tunay na leksikal na posibilidad ang “katarungan.”
- issue: Kaugnayan at diwa ng ἐν αὐτῇ
  choice: sa pamamagitan nito
  alternative: dito; ayon dito
  rationale: Isahan at pambabae ang panghalip sa Griyego at maaaring tumukoy sa katuwirang mula sa Kautusan, samantalang umaalingawngaw ang pangungusap sa Levitico 18:5, kung saan ang pamumuhay ay kaugnay ng pagtupad sa mga tuntunin. Hindi tahasang nilulutas ng salin ang tensiyong ito.
- issue: Panlahatang gamit ng ἄνθρωπος
  choice: tao
  alternative: sinumang tao
  rationale: Ang “tao” sa Filipino ay likas na sumasaklaw sa sinumang tao at hindi nangangailangang gawing tiyak na lalaki ang panlahatang gamit ng salitang Griyego.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Kautusan” bilang karaniwang katawagan sa Kautusan ni Moises at iniwasan ang di-kinakailangang teknikal o denominasyonal na pananalita.
