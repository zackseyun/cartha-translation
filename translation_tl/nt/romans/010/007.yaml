  terminology: Ang “Mesiyas” ay angkop para sa Χριστός bilang titulo at nakaayon sa audit trail. Ang “kalaliman” ay pinananatiling bukás ang saklaw ng ἄβυσσος. Ang tala sa “Cristo” ay kapaki-pakinabang na paglilinaw sa Griyego at ang mga panandang talababa ay wastong nakakabit.
