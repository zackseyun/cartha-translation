id: ROM.10.7
reference: Romans 10:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: tl
  text: o, “Sino ang bababa sa kalaliman[a]?” (ibig sabihin, upang iahon ang Mesiyas[b] mula sa mga patay).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalim na dako.” Iniaangkop ni Pablo ang pananalita ng Deuteronomio 30:13, ngunit “kalaliman” ang salitang ginamit niya rito habang inuugnay ito sa pag-ahon sa Mesiyas mula sa mga patay.
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Cristo.” Isinalin dito bilang “Mesiyas” sapagkat ginagamit ang Χριστός bilang titulo.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: o
  rationale: Payak at likas na panandang nagpapakilala sa ikalawang retorikal na tanong.
- source_word: Τίς καταβήσεται
  choice: Sino ang bababa
  rationale: Tuwirang pinananatili ang panghinaharap at ang anyo ng retorikal na tanong.
- source_word: εἰς τὴν ἄβυσσον
  choice: sa kalaliman
  rationale: Pinananatili ang larawan ng isang napakalalim na dako nang hindi ito nililimitahan sa libingan, Hades, o kaharian ng mga patay.
- source_word: τοῦτ’ ἔστιν
  choice: ibig sabihin
  rationale: Likas na makabagong Tagalog para sa pormulang nagpapaliwanag, habang pinananatili ang ugnayan sa naunang sipi.
- source_word: Χριστόν
  choice: ang Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo ng pinahirang tagapagligtas; isinasalin ang kahulugan ng titulo sa halip na basta itranslitera.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Karaniwan at tumpak na salin ng idyomang tumutukoy sa paglabas mula sa kalagayan o kapulungan ng mga patay.
- source_word: ἀναγαγεῖν
  choice: upang iahon
  rationale: Pinananatili ang pataas na larawang panlunan na katapat ng “bababa”; iniiwasang palitan ito ng mas tahasang terminong “buhayin.”
theological_decisions:
- issue: Pagpapakahulugan sa Χριστός
  choice: ang Mesiyas
  alternative: ang Cristo
  rationale: Malakas ang gamit nito bilang titulo sa paliwanag ni Pablo, kaya ipinahahayag ang kahulugan ng Χριστός nang hindi ito itinuturing na pangalang pantangi lamang.
- issue: Kahulugan ng ἄβυσσος sa paliwanag ni Pablo
  choice: kalaliman
  alternative: malalim na dako; kaharian ng mga patay; Hades
  rationale: Pinananatili ang alusyon at talinghaga ni Pablo, pati ang kaugnayan nito sa pag-ahon sa Mesiyas mula sa mga patay, nang hindi ipinipilit ang isang mas makitid na pagkakakilanlan ng kalaliman.
- issue: Larawan ng ἀναγαγεῖν
  choice: iahon
  alternative: buhayin; muling ibangon
  rationale: Ang “iahon” ay nagpapanatili sa direksiyong pataas ng pandiwa. Malinaw sa konteksto ang pagkabuhay na muli, ngunit hindi iyon tahasang isinasaisantabi sa mismong pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang retorikal na tanong, ang panaklong na paliwanag, at ang magkatapat na larawang “bababa” at “iahon.”
