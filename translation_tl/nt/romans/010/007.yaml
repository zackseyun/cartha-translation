  source_fidelity: Tumpak ang salin sa SBLGNT. Ang “o” ay wastong panandang alternatibo; napapanatili ng “Sino ang bababa sa kalaliman?” ang retorikal na tanong at ang hinaharap na diwa ng καταβήσεται. Ang “kalaliman” ay maingat na katumbas ng ἄβυσσος at hindi ipinipilit na libingan o Hades. Wasto ring naipapahayag ng “upang iahon ang Mesiyas mula sa mga patay” ang paliwanag na τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν, kasama ang larawang pataas ng ἀναγαγεῖν.
