  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: tl
  text: Sapagkat ang Mesiyas ang wakas ng Kautusan, upang ang bawat sumasampalataya ay magkaroon ng katuwiran[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “layunin” o “kaganapan.” Ang salitang Griego na isinaling “wakas” ay maaaring mangahulugang pagtatapos, layunin, hantungan, o kaganapan.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “katarungan” sa halip na “katuwiran” sa gamit ni Pablo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: wakas
  rationale: Ang “wakas” ay maikli at likas sa Filipino at naiiwang bukas ang maaaring diwang pagtatapos, layunin, o kaganapan ng Kautusan.
- source_word: νόμου
  choice: ng Kautusan
  rationale: Sa konteksto ni Pablo, tumutukoy ito sa Kautusan ni Moises bilang kilalang kategoryang tipan; ang malaking titik ay tumutulong na ipakita ang tiyak na reperensiya.
- source_word: Χριστὸς
  choice: ang Mesiyas
  rationale: Aktibo rito ang kahulugan bilang titulo kaugnay ng Israel, ng Kautusan, at ng mga pag-asa ng tipan, kaya isinalin ang titulo sa halip na basta baybayin bilang “Cristo.”
- source_word: εἰς δικαιοσύνην
  choice: tungo sa katuwiran
  rationale: Pinananatili ng “tungo sa” ang direksiyonal at maaaring layunin/resultang puwersa ng εἰς nang hindi tiyakang nagpapasya sa pagitan ng layunin at bunga.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Ang “katuwiran” ang pinakamalawak at nakaugaliang salin sa ganitong gamit ni Pablo; inilalahad sa talababa ang lehitimong alternatibong “katarungan.”
- source_word: παντὶ τῷ πιστεύοντι
  choice: para sa bawat sumasampalataya
  rationale: Malinaw nitong tinutukoy ang lahat ng taong patuloy na inilalarawan ng pandiwaring πιστεύοντι, nang hindi nagdaragdag ng denominasyonal na pormulasyon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nitong ang talata ay nagbibigay ng paliwanag o batayan para sa naunang pahayag.
theological_decisions:
- issue: Kahulugan ng τέλος νόμου kaugnay ng Kautusan ni Moises
  choice: “wakas ng Kautusan” sa pangunahing teksto
  alternative: “layunin ng Kautusan” o “kaganapan ng Kautusan”
  rationale: Maaaring tumukoy ang τέλος sa pagtatapos, hantungan, layunin, o kaganapan. Pinananatili ng “wakas” at ng talababa ang tunay na pag-igting sa halip na pumili agad ng isang interpretasyon.
- issue: Pagpapahayag sa Χριστός
  choice: Mesiyas
  alternative: Cristo
  rationale: Nasa unahan ang titulong mesiyaniko dahil tinatalakay rito ang kaugnayan ni Jesus sa Israel at sa Kautusan.
- issue: Pagpapahayag sa δικαιοσύνη
  choice: katuwiran
  alternative: katarungan
  rationale: Ang “katuwiran” ay angkop sa malawak na teolohikal at relasyonal na gamit ni Pablo, habang ang “katarungan” ay tunay na leksikal na posibilidad na dapat panatilihin sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Kautusan” bilang tiyak na katawagan sa Kautusan ni Moises. Ang bahagyang siksik na pariralang “tungo sa katuwiran para sa” ay sadyang nagpapanatili sa pagkakasiksik at interpretatibong pagiging bukas ng Griego.
