  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: tl
  text: Ngunit tungkol naman sa Israel, sinasabi niya[a], “Buong araw kong iniunat ang aking mga kamay sa isang bayang ayaw sumunod[b] at sumasalungat[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ngunit sa Israel ay sinasabi niya.” Maaaring unawain ang pariralang Griyego bilang pagsasalita sa Israel o bilang pagsasalita tungkol sa Israel.
    reason: alternative_reading
  - marker: b
    text: Ang “ayaw sumunod” ay maaari ring magpahiwatig ng “ayaw maniwala” o “ayaw magpaniwala.”
    reason: lexical_alternative
  - marker: c
    text: O “kumokontra,” “sumasalungat sa sinasabi,” o “nagsasalita laban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Ngunit tungkol naman sa Israel
  rationale: Maaaring ipakilala ng πρός kasama ng λέγει ang paksa ng sinasabi. Likas sa modernong Tagalog ang “tungkol naman sa Israel,” habang pinananatili sa talababa ang posibleng tuwirang patutunguhan ng pagsasalita.
- source_word: λέγει
  choice: sinasabi niya
  rationale: Pinananatili ang pangkasalukuyang anyo ng pormula ng pagsipi. Hindi tahasang pinapangalanan ang simuno sapagkat ipinahiwatig lamang ito ng konteksto sa Griyego.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Buong araw
  rationale: Natural at malinaw na katumbas ng pariralang nagsasaad ng haba ng panahon.
- source_word: ἐξεπέτασα
  choice: iniunat
  rationale: Tuwirang inilalarawan ang pag-uunat ng mga kamay. Ang aspektong naganap ay umaayon sa aorist ng sipi nang hindi inaalis ang diwa ng matiyagang panawagan na ipinahihiwatig ng “buong araw.”
- source_word: τὰς χεῖράς μου
  choice: ang aking mga kamay
  rationale: Pinananatili ang kongkretong larawang antropomorpiko ng mga kamay na nakaunat bilang panawagan o pagtanggap.
- source_word: πρὸς λαὸν
  choice: sa isang bayan
  rationale: Ipinapakita ng “sa” ang direksiyon ng kilos patungo sa kolektibong λαός; ang “bayan” ay natural na kolektibong tawag sa isang sambayanan sa kontekstong ito.
- source_word: ἀπειθοῦντα
  choice: ayaw sumunod
  rationale: Ipinahahayag nito ang kusang pagtanggi o pagsuway, habang hindi ikinukulong ang salita sa intelektuwal na kawalan ng paniniwala. Inilalagay sa talababa ang saklaw na “ayaw maniwala” o “ayaw magpaniwala.”
- source_word: ἀντιλέγοντα
  choice: sumasalungat
  rationale: Saklaw nito ang aktibong pagtutol at pagsasalita laban sa sinabi; mas natural ito sa Tagalog kaysa sa isang mahigpit na literal na ekspresyon.
theological_decisions:
- issue: Paglalarawan sa tugon ng Israel sa pagkilos ng Diyos
  choice: “bayang ayaw sumunod at sumasalungat”
  alternative: “bayang ayaw maniwala at kumokontra”
  rationale: Pinananatili ng salin kapuwa ang matiyagang pagkilos ng nagsasalita at ang kusang pagtanggi at aktibong pagsalungat ng bayan. Hindi nito pinalalawak ang pahayag upang lutasin ang mas malawak na usapin tungkol sa katayuan ng Israel.
- issue: Pagkakakilanlan ng simuno ng λέγει
  choice: “sinasabi niya”
  alternative: “sinasabi ng Diyos”
  rationale: Bagaman ang konteksto ng sipi mula kay Isaias ay tumutukoy sa Diyos bilang nagsasalita, hindi tahasang nakapangalan ang simuno sa mismong Griyegong pangungusap; kaya pinanatili ang pahiwatig sa halip na idagdag ito sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bayan” bilang kolektibong katawagan at iniwasan ang arkaiko o labis na teknikal na pananalita. Ang mga talababa ay nagpapanatili sa tunay na sintaktiko at leksikal na kalabuan ng Griyego.
