  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: tl
  text: Sapagkat nagpapatotoo ako tungkol sa kanila na may sigasig sila para sa Diyos[a], ngunit hindi ayon sa kaalaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may sigasig sila sa Diyos.” Maaari ring isalin nang mas literal ang pariralang Griego na “sigasig ng Diyos,” ngunit malamang na tumutukoy ito sa sigasig na nakatuon sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “hindi batay sa kaalaman,” “hindi kalakip ang ganap na kaalaman,” o “hindi nakasalig sa kaalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: mapatutunayan ko
  rationale: Ipinahahayag ang tuwirang patotoo ni Pablo sa natural na modernong Tagalog; hindi ito nangangahulugang posibilidad lamang kundi katiyakang maibibigay niya ang patotoo.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: αὐτοῖς
  choice: tungkol sa kanila
  rationale: Sa kontekstong ito, ang datibo ay tumutukoy sa mga taong pinatutungkulan ng patotoo, hindi sa mga tumatanggap nito.
- source_word: ζῆλον
  choice: masigasig / sigasig
  rationale: Ang “sigasig” ay natural at malinaw na katumbas ng matinding relihiyosong pagnanais o debosyon.
- source_word: θεοῦ
  choice: para sa Diyos
  rationale: 'Malamang na obhetibong henitibo: ang Diyos ang pinatutungkulan ng kanilang sigasig. Iniiwasan nito ang maling pahiwatig na ang tinutukoy ay mismong sigasig ng Diyos.'
- source_word: ἔχουσιν
  choice: masigasig sila
  rationale: Natural na paglilipat sa Tagalog ng idyomang literal na “mayroon silang sigasig,” nang hindi binabago ang kahulugan.
- source_word: ἀλλ’
  choice: ngunit
  rationale: Malinaw na ipinakikita ang matinding pagsalungat sa pagitan ng kanilang sigasig at kakulangan sa kaalaman.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: hindi batay sa kaalaman
  rationale: Pinananatili ang diwa ng κατά bilang pamantayan o batayan, habang hindi ipinapasok sa pangunahing teksto ang mas tiyak ngunit interpretibong “ganap” o “tamang” kaalaman.
theological_decisions:
- issue: Ang kalikasan ng sigasig ng Israel
  choice: Ang kanilang sigasig ay nakatuon sa Diyos ngunit hindi batay sa kaalaman.
  alternative: Maaaring unawain ang ζῆλον θεοῦ bilang “sigasig ng Diyos” o bilang relihiyosong sigasig na hindi tahasang tinutukoy ang layon.
  rationale: Sa konteksto, kinikilala ni Pablo ang taimtim nilang debosyon ngunit pinupuna ang saligan nito. Pinananatili ng salin ang tensiyon sa pagitan ng sinseridad at wastong pagkaunawa nang hindi nilulutas nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mapatutunayan ko” para sa evidensiyal na lakas ng μαρτυρῶ at ang “hindi batay sa kaalaman” upang maging natural habang pinananatili ang ambigüidad ng ἐπίγνωσις.
