base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: tl
  text: 'Ngunit ganito ang sinasabi ng katuwirang[a] nagmumula sa pananampalataya: “Huwag mong sabihin sa iyong puso, ‘Sino ang aakyat sa langit?’” (ibig sabihin[c], ibaba ang Mesiyas[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Sa kontekstong ito, ang δικαιοσύνη ni Pablo ay maaaring magpahiwatig kapuwa ng katuwiran at katarungan.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “Kristo”; isinaling “Mesiyas” dito sapagkat ang Χριστός ay ginagamit bilang titulo.
    reason: lexical_alternative
  - marker: c
    text: Inuulit ni Pablo ang diwa ng Deuteronomio 30:12 at iniuugnay ito sa Mesiyas.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: katuwiran
  rationale: Pinananatili nito ang karaniwang diwang Paulino ng pagiging matuwid at ang legal at tipanang pahiwatig ng salita; inilagay sa talababa ang “katarungan” bilang tunay na posibleng kahulugan.
- source_word: ἐκ πίστεως
  choice: nagmumula sa pananampalataya
  rationale: Tuwirang ipinahahayag ang pinagmulan na tinutukoy ng ἐκ at malinaw na naihahambing sa katuwirang nakabatay sa kautusan sa kalapit na konteksto.
- source_word: οὕτως λέγει
  choice: ganito ang sinasabi
  rationale: Natural sa makabagong Tagalog habang pinananatili ang pagsasatao sa katuwiran bilang siyang nagsasalita.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Huwag mong sabihin sa iyong puso
  rationale: Malapit sa anyo ng sipi at pinananatili ang puso bilang sentro ng panloob na pag-iisip at layunin.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Sino ang aakyat sa langit?
  rationale: Ang “aakyat” ay malinaw at likas na katumbas ng ἀναβήσεται at ang “sa langit” ay natural na Filipino para sa εἰς τὸν οὐρανόν.
- source_word: Χριστόν
  choice: ang Mesiyas
  rationale: Dito ay gumaganap ang Χριστός bilang titulo sa pagpapaliwanag ni Pablo sa Kasulatan, kaya “Mesiyas” ang nagpapalinaw sa kahulugan nito.
- source_word: καταγαγεῖν
  choice: upang ibaba
  rationale: Pinananatili ang paliwanag na ang pag-akyat sa langit ay tila mangangahulugang ibaba mula roon ang Mesiyas.
theological_decisions:
- issue: Pagsasatao sa katuwirang nagmumula sa pananampalataya
  choice: Pinanatili ang katuwiran bilang simuno ng “sinasabi.”
  alternative: 'Gawing mas abstrakto: “Ito ang sinasabi tungkol sa katuwiran sa pamamagitan ng pananampalataya.”'
  rationale: Ang δικαιοσύνη ang tahasang simuno ng λέγει sa Griyego; pinananatili nito ang retorika at paghahambing ni Pablo sa naunang talata.
- issue: Pagkakasalin ng Χριστός
  choice: Mesiyas
  alternative: Kristo
  rationale: Sa argumentong nakaugat sa Kasulatan sa talatang ito, ang salita ay malinaw na gumaganap bilang titulo; ipinakikita ng “Mesiyas” ang kahulugan sa halip na tratuhin ito bilang pangalang pantangi lamang.
- issue: Ugnayan ng retorikal na tanong at ng infinitive na καταγαγεῖν
  choice: “ibig sabihin, upang ibaba ang Mesiyas”
  alternative: “ibig sabihin, ibaba ang Mesiyas”
  rationale: Pinananatili ang maikli at nagpapaliwanag na pariralang nasa Griyego nang hindi dinaragdagan kung paano eksaktong mangyayari ang pagbaba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong sipi, ang panloob na idyomang “sa iyong puso,” at ang pagsasatao sa “katuwiran,” habang iniwasan ang labis na pagpapaliwanag sa mismong teksto.
