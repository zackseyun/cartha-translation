id: ROM.10.12
reference: Romans 10:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: tl
  text: Sapagkat walang pagkakaiba sa pagitan ng Judio at Griego[a], sapagkat iisa ang Panginoon ng lahat[b], at sagana siyang nagbibigay sa lahat ng tumatawag sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Griego.” Dito, ang tambalang “Judio at Griego” ay tumutukoy sa Judio at di-Judio. Isinasalin ito ng ilan bilang “Hentil.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Iisa ang Panginoon na namamahala sa lahat.”
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: pagkakaiba
  rationale: Likas at malinaw itong katumbas ng pagkakategorya o pagtatangi sa dalawang pangkat, nang hindi ipinapalagay na tumutukoy ito sa halaga ng bawat isa.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: Judio ... Griego
  rationale: Pinananatili ang tahasang mga katawagan sa Griyego. Sa konteksto, kumakatawan ang tambalang ito sa Judio at di-Judio, na nililinaw sa talababa.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: Iisa ang Panginoon ng lahat
  rationale: Natural sa Filipino ang 'iisa' upang ipahayag na pareho ang Panginoon ng dalawang pangkat. Pinananatili ng 'Panginoon' ang bigat ng titulong κύριος at ng 'ng lahat' ang posibleng ugnayang ipinahihiwatig ng πάντων.
- source_word: πλουτῶν εἰς πάντας
  choice: sagana siyang nagbibigay sa lahat
  rationale: Ipinahahayag nito sa natural na Filipino ang talinghaga ng kasaganaan at ang pagkilos nito tungo sa mga tinutukoy, nang hindi nagdaragdag ng isang tiyak na kaloob na hindi pinangalanan sa teksto.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: lahat ng tumatawag sa kanya
  rationale: Karaniwang Filipino ang 'tumatawag sa kanya' para sa pagtawag o pagdaing sa Panginoon nang may pananampalataya, at kaayon ito ng kasunod na talata.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon”
  choice: Hindi tahasang dinagdagan ng pangalang Jesus ang salin; nananatiling 'Panginoon' ang titulo upang ang konteksto ng Roma 10:9–13 ang magpahiwatig ng tinutukoy.
  alternative: Tahasan itong isaling 'Panginoong Jesus' o unawain bilang pangkalahatang pagtukoy lamang sa Diyos.
  rationale: Nakasentro ang kalapit na konteksto sa pagkilala kay Jesus bilang Panginoon at inuugnay ito sa sipi tungkol sa pagtawag sa Panginoon. Ang hindi pagdaragdag ng pangalan ay nagpapanatili sa mismong pananalita at sa teolohikal na alingawngaw nito.
- issue: Saklaw ng “lahat”
  choice: Ang 'lahat' ay nililimitahan ng pariralang 'ng tumatawag sa kanya.'
  alternative: Unawain ito bilang walang-pasubaling pahayag tungkol sa bawat tao.
  rationale: Tahasan sa sintaks na ang tinutukoy ay ang lahat ng tumatawag sa kanya, habang pinananatili rin ang bukás na saklaw nito kapwa sa Judio at Griego.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang paghahati sa dalawang pangungusap ay nagpapalinaw sa pangangatwiran. Ang 'sagana siyang nagbibigay' ay mas natural kaysa literal na 'mayaman tungo sa lahat' ngunit pinananatili ang diwa ng masaganang pagkakaloob.
