  source_fidelity: 'Ang pangunahing pangungusap ay tapat sa Griyego: ang mga panghinaharap na subjunctive na «magpapahayag» at balintiyak na «isinugo» ay wasto, gayundin ang pormulang pambanggit na «Gaya ng nasusulat.» Gayunman, ang «mabuting balita tungkol sa mabubuting bagay» ay nagdaragdag ng ugnayang ‘tungkol sa’ na wala sa τὰ ἀγαθά. Ang layon ng participle ay tuwirang ‘mabubuting bagay.’'
  naturalness: Marangal at malinaw ang kabuuang Tagalog. Mas tuwiran at likas sa siping patula ang «mga nagbabalita ng mabubuting bagay» kaysa sa paulit-ulit at bahagyang paliwanag na «mga naghahatid ng mabuting balita tungkol sa mabubuting bagay.»
  terminology: Ang «magpapahayag» ay angkop para sa κηρύξωσιν at hindi nagpapataw ng pormal na katungkulang pansimbahan. Ang «isinugo,» «mga paa,» at «mabubuting bagay» ay wasto. Inayos din ang talababa para ang alternatibong kahulugan ng ὡραῖοι ay idiomatikong maipahayag sa Tagalog.
