  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: tl
  text: At paano naman sila magpapahayag kung hindi sila isinugo? Gaya ng nasusulat, “Kay ganda[a] ng mga paa ng mga nagbabalita ng mabubuting bagay!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kay kaaya-aya” o “Kay napapanahon.” Ang salitang Griyego ay maaaring tumukoy hindi lamang sa kagandahan kundi pati sa pagiging malugod na tinatanggap o sa angkop na pagdating ng mensahero.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga nagbabalita ng mabubuting bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: magpapahayag
  rationale: Ipinahihiwatig ng κηρύσσω ang hayagan at pampublikong pagpapahayag. Ang “magpapahayag” ay natural sa modernong Tagalog at hindi nililimitahan ang gawain sa pormal na pangangaral.
- source_word: ἀποσταλῶσιν
  choice: isinugo
  rationale: Pinananatili ng anyong balintiyak ang diwang may ibang nagsugo sa mga tagapagpahayag. Mas angkop sa marangal at biblikal na rehistro ang “isinugo” kaysa sa mas karaniwang “ipinadala.”
- source_word: καθὼς γέγραπται
  choice: Gaya ng nasusulat
  rationale: Likas at marangal itong pormula sa Tagalog para sa pagpapakilala ng sipi mula sa Kasulatan.
- source_word: ὡραῖοι
  choice: ganda
  rationale: Pinananatili ng “Kay ganda” ang pangunahing larawan ng kagandahan o kaaya-ayang pagdating, habang inilalagay sa talababa ang posibleng diwa ng pagiging malugod at napapanahon.
- source_word: πόδες
  choice: mga paa
  rationale: Tuwirang pinananatili ang matalinghagang larawan ng pagdating ng mga mensahero sa sipi.
- source_word: εὐαγγελιζομένων
  choice: mga naghahatid ng mabuting balita
  rationale: Ipinapakita nito ang kilos ng pagbabalita at umaangkop sa larawan ng mga mensaherong dumarating, nang hindi ito nililimitahan sa isang pormal na tungkuling pansimbahan.
- source_word: τὰ ἀγαθά
  choice: tungkol sa mabubuting bagay
  rationale: Pinananatili nito ang tahasang layon na “mabubuting bagay” sa halip na tunawin iyon sa pariralang “mabuting balita” lamang.
theological_decisions:
- issue: Kaugnayan ng sipi tungkol sa mga mensahero sa pagpapahayag ng ebanghelyo
  choice: Pinanatili ang larawan ng mga isinugong mensahero na naghahatid ng mabuting balita, nang hindi ito nililimitahan sa ordinadong pangangaral.
  alternative: Isalin ang κηρύξωσιν bilang “mangaral” at ang εὐαγγελιζομένων bilang “mga nangangaral ng ebanghelyo,” na maaaring magpahiwatig ng isang mas pormal na katungkulan sa iglesia.
  rationale: Ang pangangatwiran ni Pablo ay may kinalaman sa pagsusugo at pagpapahayag, ngunit ipinagdiriwang mismo ng sipi ang pagdating ng mga tagapagbalita. Pinananatili ng salin ang dalawang aspetong ito nang hindi nagdaragdag ng partikular na doktrina tungkol sa katungkulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isinugo” at “nasusulat” upang mapanatili ang biblikal na tono, samantalang iniwasan ang mga salitang maaaring magtakda ng isang tiyak na katungkulang pansimbahan.
