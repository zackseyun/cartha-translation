  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: tl
  text: Ngunit buong tapang na sinasabi ni Isaias, “Natagpuan ako ng mga hindi naghahanap sa akin[a]; nahayag ako sa mga hindi nagtatanong tungkol sa akin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Natagpuan ako sa gitna ng mga hindi naghahanap sa akin.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinakilala ko ang aking sarili sa mga hindi nagtatanong tungkol sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: buong tapang na sinasabi
  rationale: Ipinahahayag nito ang lakas ng loob o pangahas na katapangan ng pandiwa, habang pinananatili ang masiglang aspektong pangkasalukuyan ng pambungad.
- source_word: Εὑρέθην
  choice: Natagpuan ako
  rationale: Tuwirang pinananatili ang aorist passive at ang Diyos bilang nagsasalita sa sipi.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: ng mga hindi naghahanap sa akin
  rationale: Bagaman literal na maaaring mangahulugang “sa gitna ng,” idiomatiko itong tumutukoy sa mga taong nakatagpo sa Diyos. Inilagay sa talababa ang mas pormal na alternatibo.
- source_word: ζητοῦσιν
  choice: naghahanap
  rationale: Natural sa modernong Tagalog at pinananatili ang diwa ng masikap na paghahanap.
- source_word: ἐμφανὴς ἐγενόμην
  choice: nahayag ako
  rationale: Maikli at likas na salin na nagpapanatili sa diwa ng pagiging hayag o lantad, nang hindi tahasang ginagawang pasarili ang pagkilos.
- source_word: ἐπερωτῶσιν
  choice: nagtatanong tungkol sa akin
  rationale: Pinananatili ang kahulugan ng pagtatanong o pagsisiyasat at iniiwasang ipasok ang mas tiyak na diwang teolohikal na “tumatawag sa akin.”
- source_word: δὲ
  choice: Ngunit
  rationale: Malinaw na naghuhudyat ng pagsalungat o pagkakaiba kaugnay ng naunang pangangatwiran.
- source_word: Ἠσαΐας
  choice: Isaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa modernong Bibliyang Filipino.
theological_decisions:
- issue: Paglalarawan sa pagpapahayag ng Diyos sa sipi mula kay Isaias
  choice: nahayag ako sa mga hindi nagtatanong tungkol sa akin
  alternative: ipinakilala ko ang aking sarili sa mga hindi nagtatanong tungkol sa akin
  rationale: Pinananatili ng pangunahing salin ang anyo at tensiyon ng Griyegong pahayag na naging hayag ang Diyos, sa halip na tahasang tukuyin itong isang pasariling pagkilos. Inilagay sa talababa ang mas interpretatibo ngunit likas na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinili ang “nahayag” bilang pormal ngunit pamilyar na salitang angkop sa siping makahula; iniwasan ang labis na kolokyal o denominasyonal na pananalita.
