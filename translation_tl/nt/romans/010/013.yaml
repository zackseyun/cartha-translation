  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: tl
  text: Sapagkat ang bawat tumatawag sa pangalan ng Panginoon ay maliligtas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sinisipi ni Pablo ang Joel 2:32. Sa Joel, si YHWH (ang PANGINOON) ang tinutukoy; dito, ayon sa konteksto, inilalapat ni Pablo ang sipi kay Jesus.
    reason: cross_reference
  - marker: b
    text: O “dumudulog sa.” Ang pananalitang Griyego ay nangangahulugang nananawagan o humihingi ng tulong sa Panginoon sa pamamagitan ng pagtawag sa kanyang pangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: ang bawat
  rationale: Ang pariralang ito ay pangkalahatan at walang tinutukoy na kasarian. Likas sa modernong Tagalog ang “ang bawat” kasunod ng sugnay na “tumatawag,” at malinaw nitong ipinahahayag na sinuman ay saklaw.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o patunay mula sa Kasulatan para sa naunang pahayag. Pinananatili ng “Sapagkat” ang ugnayang ito.
- source_word: ἐπικαλέσηται
  choice: tumatawag
  rationale: Sa pariralang “tumatawag sa pangalan,” ang pandiwa ay nangangahulugang nananawagan, dumudulog, o humihingi ng tulong sa Panginoon. Ang “tumatawag” ay natural at pinananatili ang pamilyar na biblikal na pananalita.
- source_word: τὸ ὄνομα
  choice: sa pangalan
  rationale: Pinananatili ang literal at biblikal na idyomang tumutukoy sa ipinahayag na pagkakakilanlan at awtoridad ng tinatawag.
- source_word: κυρίου
  choice: ng Panginoon
  rationale: Tuwirang katumbas ito ng κυρίου at hindi nito dinaragdagan ang teksto ng tahasang pangalang “Jesus,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: σωθήσεται
  choice: ay maliligtas
  rationale: Ang panghinaharap na balintiyak ay tumutukoy sa pagliligtas sa kontekstong Paulino. Malinaw at natural itong naihahayag ng “ay maliligtas.”
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa sipi mula sa Joel
  choice: Panatilihin ang “Panginoon” sa pangunahing teksto; ipaliwanag sa talababa na inilalapat ito ni Pablo kay Jesus sa konteksto.
  alternative: “PANGINOON” bilang tuwirang pagtukoy kay YHWH, o “Panginoong Jesus” bilang tahasang pagpapalawak
  rationale: κυρίου lamang ang nasa tekstong Griyego. Sa Joel, YHWH ang tinutukoy, samantalang sa Roma 10, si Jesus ang tinutukoy ng nakapaligid na talakayan. Pinananatili ng salin ang mismong pananalita at ang teolohikal na tensiyon, habang inilalahad sa talababa ang ugnayan ng dalawang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang biblikal na idyomang “tumatawag sa pangalan ng Panginoon” at ang pang-ugnay na “Sapagkat” upang makita ang kaugnayan sa naunang talata.
