  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: tl
  text: Sapagkat sinasabi ng Kasulatan, “Ang sinumang sumasampalataya sa kanya ay hindi mapapahiya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Ang sinumang sumasampalataya sa kanya ay hindi mahihiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinasabi
  rationale: 'Likas na ipinapahayag ng pangkasalukuyang anyo ang karaniwang pormula sa pagsipi: “sinasabi ng Kasulatan.”'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita ng γάρ na ang sipi ay nagbibigay-batayan sa naunang pahayag at pinananatili nito ang daloy ng pangangatwiran ni Pablo.
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Sa pormula ng pagsipi ni Pablo, tumutukoy ang γραφή sa banal na Kasulatan, hindi lamang sa isang karaniwang sulatin.
- source_word: Πᾶς ὁ πιστεύων
  choice: Ang bawat sumasampalataya
  rationale: Ang parirala ay pangkalahatan at sumasaklaw sa lahat, hindi lamang sa mga lalaki; natural na naihahayag ito sa modernong Tagalog sa pamamagitan ng “ang bawat sumasampalataya.”
- source_word: πιστεύων
  choice: sumasampalataya
  rationale: Ang “sumasampalataya” ay dignificado at karaniwang salin sa kontekstong biblikal, at ipinahahayag ang patuloy na pagtitiwala o pananalig.
- source_word: ἐπ’ αὐτῷ
  choice: sa kanya
  rationale: Kasama ng πιστεύω, ipinahahayag ng ἐπί na ang pananampalataya o pagtitiwala ay nakatuon sa isang persona; idiomatiko sa Tagalog ang “sumasampalataya sa kanya.”
- source_word: οὐ καταισχυνθήσεται
  choice: ay hindi mapapahiya
  rationale: Pinananatili ng “mapapahiya” ang hinaharap at pasibong diwa, pati ang ideya ng hindi pagdanas ng kahihiyan o pagkabigo sa huling pagpapatunay.
theological_decisions:
- issue: Pangkalahatang panlalaking anyo sa Πᾶς ὁ πιστεύων
  choice: Ang bawat sumasampalataya
  alternative: Ang bawat lalaking sumasampalataya; Sinumang sumasampalataya
  rationale: Ang panlalaking anyo sa Griyego ay gramatikal at pangkalahatan, hindi eksklusibong tumutukoy sa mga lalaki.
- issue: Tinutukoy ng αὐτῷ
  choice: sa kanya
  alternative: sa Panginoon; kay Cristo
  rationale: Pinanatili ang panghalip upang huwag palawakin ang sipi o tahasang lutasin sa mismong talata ang referent na ipinauunawa ng konteksto.
- issue: Diwa ng καταισχυνθήσεται
  choice: hindi mapapahiya
  alternative: hindi mahihiya; hindi mabibigo
  rationale: Ang “mapapahiya” ay pinakamalapit sa pasibong anyo at pinananatili ang teolohikal na tensiyon sa pagitan ng kahihiyan, pagkabigo, at pampublikong pagpapatunay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Ginamit ang “Kasulatan” at “sumasampalataya” bilang pamilyar na bokabularyong biblikal nang hindi nagiging lipas o labis na teknikal.
