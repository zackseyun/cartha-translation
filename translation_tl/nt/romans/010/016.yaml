source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: tl
  text: Ngunit hindi lahat ay sumunod sa mabuting balita[a]. Sapagkat sinasabi ni Isaias, “Panginoon, sino ang naniwala sa aming mensahe[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ebanghelyo.”
    reason: lexical_alternative
  - marker: b
    text: O “aming ulat”; literal, “aming pagkarinig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang pangangatwiran.
- source_word: οὐ πάντες
  choice: hindi lahat
  rationale: 'Pinananatili ang bahagyang pagtanggi ng Griyego: may mga hindi sumunod, ngunit hindi sinasabing walang sinumang sumunod.'
- source_word: ὑπήκουσαν
  choice: sumunod
  rationale: Ang ὑπακούω ay tumutukoy sa pagsunod, hindi lamang sa pakikinig; pinananatili nito ang lakas ng hinihinging tugon sa mabuting balita.
- source_word: τῷ εὐαγγελίῳ
  choice: sa mabuting balita
  rationale: Tuwirang ipinapahayag ang pangunahing kahulugan ng εὐαγγέλιον sa malinaw na makabagong Tagalog; inilalagay sa talababa ang tradisyonal na terminong “ebanghelyo.”
- source_word: Ἠσαΐας
  choice: Isaias
  rationale: Karaniwang anyo ng pangalan ng propeta sa tradisyong Tagalog.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita na ang sipi mula kay Isaias ang sumusuporta sa naunang pahayag.
- source_word: λέγει
  choice: sinasabi
  rationale: Pinananatili ang kasalukuyang panahunan ng Griyego, na naghaharap sa Kasulatan bilang patuloy na nagsasalita.
- source_word: Κύριε
  choice: Panginoon
  rationale: Likas at magalang na katumbas ng pantawag na Κύριε.
- source_word: τίς ἐπίστευσεν
  choice: sino ang naniwala
  rationale: Natural na tanong sa Tagalog na pinananatili ang retorikal na puwersa ng sipi.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: sa aming mensahe
  rationale: Sa konteksto, ang ἀκοή ay ang ulat o mensaheng narinig; malinaw sa Tagalog ang “aming mensahe” habang kinikilala sa talababa ang ibang posibleng pakahulugan.
theological_decisions:
- issue: Uri ng tugong hinihingi ng mabuting balita sa ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: sumunod sa mabuting balita
  alternative: nakinig sa mabuting balita; tumalima sa ebanghelyo
  rationale: Ang pandiwa ay tahasang may diwa ng pagsunod. Hindi ito pinalalambot tungo sa pakikinig lamang, at hindi rin dinaragdagan ng isang partikular na sistemang doktrinal tungkol sa kaligtasan.
- issue: Kahulugan ng ἀκοή sa sipi mula kay Isaias
  choice: aming mensahe
  alternative: aming ulat; aming narinig; aming ipinahayag
  rationale: Maaaring tumukoy ang salita sa pagkarinig o sa bagay na narinig at ibinalita. Ang “mensahe” ang pinakanatural dito, habang pinananatili sa talababa ang tunay na saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mabuting balita” para madaling maunawaan, ngunit pinanatili sa talababa ang nakaugaliang “ebanghelyo.” Inilagay ang marker [b] sa “mensahe,” kung saan aktuwal na nauukol ang leksikal na paliwanag.
