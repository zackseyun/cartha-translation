  terminology: Pinanatili ang “Israel,” “Moises,” “Deuteronomio,” at “mga Hentil.” Ang “walang pang-unawa” ay angkop para sa ἀσυνέτῳ at hindi labis na interpretatibo. Ang “pagseselosin” at “gagalitin” ay angkop na sanhiing mga salin.
