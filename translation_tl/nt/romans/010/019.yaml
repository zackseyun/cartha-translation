  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: tl
  text: 'Ngunit nagtatanong ako: Hindi ba nakaunawa ang Israel?[a] Si Moises ang unang nagsabi: “Pagseselosin ko kayo sa pamamagitan ng isang bayang hindi kinikilalang bansa; gagalitin ko kayo sa pamamagitan ng isang bansang walang pang-unawa.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Hindi ba nalaman ng Israel?” Ang pandiwang Griyego ay maaaring mangahulugang “malaman” o “maunawaan”; sa kontekstong ito, malamang na tumutukoy ito sa pagkaunawa sa kahulugan ng kanilang narinig.
    reason: lexical_alternative
  - marker: b
    text: Sipi mula sa Deuteronomio 32:21. Ang “isang bayang hindi kinikilalang bansa” ay maaaring tumukoy sa isang bayang itinuturing na hindi tunay na bansa, samakatuwid ay sa mga Hentil.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Hindi ba nakaunawa ang Israel?
  rationale: Sa konteksto ng pakikinig at pagtugon sa mensahe, ang ἔγνω ay likas na tumutukoy sa pagkaunawa o pag-unawa sa kahulugan, bagaman maaari rin itong isaling “nalaman.” Pinananatili rin ang anyong retorikal ng tanong.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Si Moises ang unang nagsabi
  rationale: Natural sa modernong Tagalog at pinananatili ang diin ng πρῶτος na si Moises ang unang binanggit na saksi mula sa Kasulatan.
- source_word: παραζηλώσω
  choice: Pagseselosin ko
  rationale: 'Tuwirang ipinahahayag ang sanhiing diwa ng pandiwa: gagawin silang mapanibughuin o magseselos.'
- source_word: ἐπ’ οὐκ ἔθνει
  choice: sa pamamagitan ng hindi isang bansa
  rationale: Pinananatili ang matalim at sadyang di-pangkaraniwang pananalita ng sipi—isang grupong itinuturing na “hindi isang bansa”—nang hindi tahasang tinutukoy sa pangunahing teksto kung sino sila.
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: sa pamamagitan ng isang bansang walang pang-unawa
  rationale: Malapit sa diwa ng ἀσυνέτῳ at iniiwasang gawing simpleng insultong “hangal” ang paglalarawan; likas pa rin itong nauunawaan sa Tagalog.
- source_word: παροργιῶ ὑμᾶς
  choice: gagalitin ko kayo
  rationale: Maikli at natural na salin ng sanhiing diwa na “udyukan kayo sa galit.” Ang “kayo” ay maaaring maramihan sa Tagalog gaya ng ὑμᾶς sa Griyego.
theological_decisions:
- issue: Ang tinutukoy ng “hindi isang bansa” at “bansang walang pang-unawa”
  choice: Panatilihin ang mismong paglalarawan ng sipi nang hindi tahasang pinapangalanan ang tinutukoy sa pangunahing teksto.
  alternative: Tukuyin sila bilang mga Hentil o bilang bayang itinuturing ng Israel na hindi tunay na bansa.
  rationale: Ginagamit ni Pablo ang Deuteronomio 32:21 bilang patunay na ipinahiwatig na ng Kasulatan ang paggamit ng Diyos sa mga nasa labas upang pagselosin at galitin ang Israel. Ang hindi tahasang pagtukoy sa kanila sa teksto ay nagpapanatili sa saklaw at tensiyon ng sipi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakaunawa” para sa kontekstuwal na diwa ng ἔγνω, at pinanatili ang sadyang kakaibang pariralang “hindi isang bansa” upang hindi mapawi ang retorikal at teolohikal na puwersa ng sipi. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
