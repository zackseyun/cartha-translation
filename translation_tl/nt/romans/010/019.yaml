  to: 'Ngunit nagtatanong ako: Hindi ba nakaunawa ang Israel?[a] Si Moises ang unang nagsabi: “Pagseselosin ko kayo sa pamamagitan ng isang bayang hindi kinikilalang bansa; gagalitin ko kayo sa pamamagitan ng isang bansang walang pang-unawa.”[b]'
