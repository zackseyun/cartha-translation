id: ROM.10.10
reference: Romans 10:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: tl
  text: Sapagkat sa puso sumasampalataya ang tao tungo sa katuwiran[a], at sa bibig naman ay nagpapahayag siya tungo sa kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katarungan.”
    reason: 'Leksikal na alternatibo: maaari ring tumukoy ang δικαιοσύνη sa katarungan, bagaman “katuwiran” ang karaniwang salin sa paggamit ni Pablo.'
lexical_decisions:
- source_word: καρδίᾳ
  choice: sa puso
  rationale: Pinananatili ang diin sa panloob na pagkatao at natural itong katapat ng “sa bibig” sa ikalawang sugnay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinahihiwatig na ipinaliliwanag ng talata ang naunang pahayag.
- source_word: πιστεύεται
  choice: sumasampalataya ang tao
  rationale: Ang anyong pasibo/gitna ay may pangkalahatang diwa rito; ang tahasang “ang tao” ay natural sa Tagalog at hindi naglilimita sa isang tiyak na tao.
- source_word: εἰς δικαιοσύνην
  choice: tungo sa katuwiran
  rationale: Pinananatili ng “tungo sa” ang maikli at sadyang hindi lubos na tinutukoy na ugnayang layon o kinalabasan na ipinahahayag ng εἰς.
- source_word: δικαιοσύνην
  choice: katuwiran
  rationale: Ang “katuwiran” ang pinakamalawak na karaniwang salin sa kontekstong Paulino at hindi nito nililimitahan ang salita sa panlipunang katarungan lamang.
- source_word: στόματι
  choice: sa bibig
  rationale: Pinananatili ang pagkakapantay ng panloob na pananampalataya at panlabas na pagpapahayag.
- source_word: δὲ
  choice: at ... naman
  rationale: Ipinakikita ang magkaugnay ngunit magkaibang ikalawang bahagi nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: ὁμολογεῖται
  choice: nagpapahayag siya
  rationale: Ang “nagpapahayag” ay angkop sa hayagang pagkilala sa naunang konteksto tungkol kay Jesus bilang Panginoon; ang panghalip ay tumutukoy sa pangkalahatang “tao” sa unang sugnay.
- source_word: εἰς σωτηρίαν
  choice: tungo sa kaligtasan
  rationale: Pinananatili ang eksaktong paralelismo sa “tungo sa katuwiran” at hindi labis na ipinapaliwanag kung layon o kinalabasan ang tinutukoy.
- source_word: σωτηρίαν
  choice: kaligtasan
  rationale: Ito ang natural at saklaw na salin sa kontekstong soteriolohikal ni Pablo.
theological_decisions:
- issue: Ugnayan ng pananampalataya at pagpapahayag sa katuwiran at kaligtasan
  choice: 'Panatilihin ang magkapantay na mga pahayag: ang pagsampalataya ay tungo sa katuwiran, at ang pagpapahayag ay tungo sa kaligtasan.'
  alternative: Ituring ang pagpapahayag bilang patunay lamang ng kaligtasan, o bilang karagdagang gawa na nagkakamit ng kaligtasan.
  rationale: Hindi nililinaw ng Griyego ang isang mekanikal na pagkakasunod-sunod o buong ordo salutis. Kaya hindi dapat lutasin ng salin ang teolohikal na tensiyong sadyang nananatili sa dalawang magkatulad na sugnay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at balanseng ayos ng dalawang sugnay, pati ang pag-uulit ng “tungo sa,” upang huwag paliitin ang posibleng diwa ng εἰς bilang layon o kinalabasan.
