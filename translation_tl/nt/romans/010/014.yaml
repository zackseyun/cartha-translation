  to: Paano nga sila tatawag sa kanya kung hindi sila sumampalataya sa kanya? At paano sila sasampalataya sa kanya kung hindi nila narinig ang tungkol sa kanya?[a] At paano sila makaririnig kung walang nangangaral?
  rationale: Pinalitan ang “Kaya paano” ng “Paano nga” upang idiomatikong ipakita ang inferential na οὖν sa magkakaugnay na retorikal na tanong. Pinalitan ang “hindi nila siya narinig” ng “hindi nila narinig ang tungkol sa kanya” upang maiwasan ang maling implikasyon na personal nilang narinig ang tinutukoy at upang maipakita ang karaniwang diwa ng ἀκούω na may genitive. Iningatan sa talababa ang mas literal na alternatibo upang hindi burahin ang saklaw ng Griyego.
