  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: tl
  text: Paano nga sila tatawag sa kanya kung hindi sila sumampalataya sa kanya? At paano sila sasampalataya sa kanya kung hindi nila narinig ang tungkol sa kanya?[a] At paano sila makaririnig kung walang nangangaral?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung hindi nila siya narinig?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Kaya paano
  rationale: Pinananatili ang lohikal na ugnay ng οὖν sa naunang argumento at ang sunod-sunod na retorikal na tanong sa natural na Tagalog.
- source_word: ἐπικαλέσωνται
  choice: sila tatawag sa kanya
  rationale: Ang “tumawag sa” ay likas na katumbas ng pagdalangin o paghingi ng tulong sa Panginoon at umaalingawngaw sa sipi sa naunang talata.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: kung hindi sila sumampalataya sa kanya
  rationale: Natural sa Tagalog ang “sumampalataya sa” at malinaw na pinananatili ang taong pinagtutuunan ng pananampalataya.
- source_word: πιστεύσωσιν
  choice: sila sasampalataya
  rationale: Ang anyong panghinaharap sa Tagalog ay maayos na naghahayag ng potensiyal na kilos sa retorikal na tanong.
- source_word: οὗ οὐκ ἤκουσαν
  choice: kung hindi nila siya narinig
  rationale: Pinananatili sa pangunahing teksto ang mas tuwirang posibilidad na ang genitibong panghalip ay tumutukoy sa taong narinig, habang inilalagay sa talababa ang tunay na alternatibong “narinig ang tungkol sa kanya.”
- source_word: ἀκούσωσιν
  choice: sila makaririnig
  rationale: Ang “makaririnig” ay natural na nagpapahayag ng posibilidad sa tanong at pinananatili ang leksikal na ugnayan sa naunang “narinig.”
- source_word: χωρὶς κηρύσσοντος
  choice: kung walang nangangaral
  rationale: Itinatampok nito ang gawain ng pagpapahayag sa halip na magpahiwatig ng isang pormal na katungkulan; natural din ito sa modernong Tagalog.
theological_decisions:
- issue: πιστεύω / wika ng pananampalataya
  choice: sumampalataya / sasampalataya
  alternative: maniwala / mananalig
  rationale: Ang “sumampalataya” ay malinaw at dignified na pandiwang kaugnay ng pananampalataya, at hindi nito dinaragdagan ang teksto ng isang partikular na pagpapakahulugang denominasyonal.
- issue: Layon ng pagdinig sa οὗ οὐκ ἤκουσαν
  choice: kung hindi nila siya narinig
  alternative: kung hindi nila narinig ang tungkol sa kanya
  rationale: Maaaring ipakahulugan ang genitibong οὗ bilang taong narinig o bilang taong tungkol kanino ang mensahe. Pinananatili ng pangunahing teksto ang mas tuwirang anyo, at inilalahad ng talababa ang mahalagang alternatibo nang hindi nilulutas nang tahimik ang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang tatlong magkakaugnay na retorikal na tanong at iniwasan ang salitang maaaring magpahiwatig ng pormal na katungkulan para sa κηρύσσοντος.
