  source_fidelity: Ang sunod-sunod na retorikal na tanong at ang lohikal na ugnay ng οὖν ay naipapakita nang maayos. Gayunman, ang “hindi nila siya narinig” ay karaniwang nangangahulugang personal nilang narinig ang taong tinutukoy. Hindi ito ang pinakaangkop na pagbasa ng ἀκούω + genitive (οὗ), na tumutukoy sa pagkarinig ng balita o mensahe tungkol sa kanya. Dapat ilagay sa pangunahing teksto ang idiomatikong “narinig ang tungkol sa kanya,” habang pinananatili sa talababa ang mas literal na anyo.
  naturalness: Natural at marangal ang “sumampalataya,” “makaririnig,” at “walang nangangaral.” Ang “Paano nga” ay mas likas na panandang pangangatwiran sa retorikal na tanong kaysa “Kaya paano,” bagaman kapwa posible.
  terminology: Ang “sumampalataya” ay angkop para sa πιστεύω at pare-pareho sa dalawang paglitaw. Ang “nangangaral” ay angkop para sa κηρύσσοντος at tumutukoy sa gawaing pagpapahayag nang hindi kinakailangang magpahiwatig ng pormal na katungkulan.
