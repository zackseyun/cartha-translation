id: ROM.10.8
reference: Romans 10:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: tl
  text: Ngunit ano ang sinasabi nito? “Ang salita ay malapit sa iyo, nasa iyong bibig at nasa iyong puso”[a]—iyon ay ang salita ng pananampalataya[b] na ipinapahayag namin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inuulit dito ni Pablo ang pananalita ng Deuteronomio 30:14 at inilalapat ito sa mensaheng ipinapahayag niya.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin ang “salita ng pananampalataya” bilang “salita tungkol sa pananampalataya” o “mensaheng humihingi ng pananampalataya.” Sa ilang konteksto, ang πίστις ay maaari ring mangahulugang “pagtitiwala” o “katapatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang talakayan.
- source_word: τί λέγει
  choice: ano ang sinasabi nito?
  rationale: Pinananatili ang di-tiyak ngunit kontekstuwal na tinutukoy ng pandiwang isahan; hindi tahasang idinaragdag ang “Kasulatan.”
- source_word: Ἐγγύς σου τὸ ῥῆμά ἐστιν
  choice: Ang salita ay malapit sa iyo
  rationale: Tuwirang pinananatili ang maikli at matalinghagang pananalita ng sipi.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: nasa iyong bibig at nasa iyong puso
  rationale: Likas sa Filipino at pinananatili ang kongkretong larawang biblikal ng bibig at puso.
- source_word: τοῦτ’ ἔστιν
  choice: ito ay
  rationale: Ipinakikilala ang paliwanag ni Pablo nang hindi dinaragdagan ang kahulugan.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: ang salita tungkol sa pananampalataya
  rationale: Pinananatili ang ugnayang leksikal ng dalawang paglitaw ng ῥῆμα bilang “salita,” habang ang “tungkol sa” ay natural na nagpapahayag ng malamang na nilalaman ng mensahe nang hindi lubusang isinasara ang saklaw ng genitibo.
- source_word: ὃ κηρύσσομεν
  choice: na ipinapahayag namin
  rationale: Inihahatid ang diwa ng pampublikong paghahayag ng κηρύσσω sa malinaw at kasalukuyang Filipino.
theological_decisions:
- issue: Kahulugan ng genitibong τῆς πίστεως
  choice: tungkol sa pananampalataya
  alternative: salita ng pananampalataya; mensahe ng pagtitiwala; mensahe ng katapatan
  rationale: Ang pananampalataya ang karaniwang kahulugan ng πίστις dito. Ang “tungkol sa” ay nagpapahiwatig ng nilalaman ng ipinahahayag na salita, ngunit itinatala sa talababa na maaari ring idiin ng parirala ang salitang humihingi o nagbubunga ng pananampalataya.
- issue: Ugnayan sa Deuteronomio 30:14
  choice: Panatilihin ang sipi sa pangunahing teksto at ipaliwanag ang alusyon sa talababa
  alternative: Tahasan sa pangunahing teksto na “sinasabi ng Kasulatan”
  rationale: Hindi tahasang binabanggit ng Griyego ang “Kasulatan”; ang talababa ang angkop na lugar upang tukuyin ang pinagmulan at aplikasyon ni Pablo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang “salita,” “bibig,” at “puso” upang maingatan ang pag-uulit at larawan ng Griyego at ng sipi sa Deuteronomio. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
