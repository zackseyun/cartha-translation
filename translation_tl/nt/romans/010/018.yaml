source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: tl
  text: 'Ngunit itinatanong ko: Hindi ba nila narinig? Tiyak na narinig nila:


    “Umabot sa buong daigdig ang kanilang tinig[a],


    at umabot ang kanilang mga salita sa mga dulo ng daigdig na tinitirhan ng tao.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang tunog.”
    reason: lexical_alternative
  - marker: b
    text: O “mundo” lamang; sa Griyego, “daigdig na tinitirhan.”
    reason: lexical_alternative
  - marker: c
    text: Sinisipi ni Pablo ang Awit 19:4 at ginagamit ang pananalita nito tungkol sa paglaganap ng mensahe.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Hindi ba nila narinig?
  rationale: Likas na tanong sa Filipino na nagpapanatili sa retorikal na tanong na umaasang sang-ayon ang sagot; ang aorist ay angkop na isinalin sa payak na nakaraan.
- source_word: μενοῦνγε
  choice: Tiyak na narinig nila
  rationale: Ipinahahayag ang mariing pagsang-ayon at ginagawang lantad ang ipinahihiwatig na pandiwa para sa natural na Filipino.
- source_word: φθόγγος
  choice: tinig
  rationale: Pinananatili ang larawang pandinig at ang patulang pagtutugma nito sa “mga salita”; maaaring “tunog” ayon sa mas literal na diwa.
- source_word: γῆ
  choice: daigdig
  rationale: Sa pangkalahatan at patulang saklaw ng sipi, tumutukoy ito sa buong mundo, hindi lamang sa isang lupain.
- source_word: ἐξῆλθεν
  choice: umabot
  rationale: Natural na Filipino para sa tinig na lumaganap hanggang sa buong daigdig; inihahatid ang kinalabasan ng paglabas nito nang hindi pilit ang literal na “lumabas.”
- source_word: πέρατα
  choice: mga dulo
  rationale: Karaniwang katumbas sa patulang idyomang tumutukoy sa pinakamalalayong bahagi.
- source_word: οἰκουμένης
  choice: daigdig na tinitirhan ng tao
  rationale: Pinananatili ang tiyak na diwa ng οἰκουμένη bilang mundong pinaninirahan, sa halip na payak na “mundo” lamang.
- source_word: ῥήματα
  choice: mga salita
  rationale: Tuwirang katumbas na nagpapanatili sa paralelismo at umiiwas sa mas mapagpakahulugang “mensahe.”
theological_decisions:
- issue: Ang tinutukoy ng “kanilang” sa sipi mula sa Awit 19
  choice: Panatilihin ang panghalip na “kanilang” nang walang paliwanag sa pangunahing teksto.
  alternative: Tukuyin ito nang tahasan bilang mga langit sa Awit 19, o bilang mga tagapangaral ng mabuting balita sa pagkakagamit ni Pablo.
  rationale: Hindi tahasang nililinaw ni Pablo ang tinutukoy ng panghalip sa mismong sipi. Ang pagpapanatili nito ay hindi nagpapasya sa umiiral na intertekstuwal at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang patulang anyo ng sipi at ang hindi tiyak na tinutukoy ng “kanilang,” habang ginawang natural sa Filipino ang mariing sagot at ang kilos ng tinig na lumaganap.
