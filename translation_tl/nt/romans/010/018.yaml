  to: 'Ngunit itinatanong ko: Hindi ba nila narinig? Tiyak na narinig nila:


    “Umabot sa buong daigdig ang kanilang tinig[a],


    at umabot ang kanilang mga salita sa mga dulo ng daigdig na tinitirhan ng tao.”[b][c]'
  rationale: Idinagdag ang “umabot” sa ikalawang magkahanay na taludtod upang malinaw na maipahayag sa natural na Filipino ang pandiwang saklaw ng dalawang bahagi ng siping Griyego. Inilipat ang mga footnote anchor upang ang lexical note ay tumukoy nang malapit sa οἰκουμένη at ang cross-reference ay tumukoy sa buong sipi. Walang paglilinaw na idinagdag sa panghalip na “kanilang.”
