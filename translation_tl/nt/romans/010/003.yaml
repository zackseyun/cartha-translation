id: ROM.10.3
reference: Romans 10:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: tl
  text: Sapagkat hindi nila alam ang katuwiran[a] ng Diyos[b], at sinisikap nilang itatag ang sarili nilang katuwiran, hindi sila nagpasakop sa katuwiran ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “katarungan.” Sa dalawang paglitaw nito sa talata, ang salitang Griyego ay maaaring tumukoy sa katuwiran, katarungan, o sa matuwid na paraan ng Diyos upang maituwid ang mga tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “katuwiran ng Diyos,” dito at sa hulihan ng talata, ay maaari ring maunawaan bilang “katuwirang mula sa Diyos” o “katuwirang taglay ng Diyos.” Pinahihintulutan ng pariralang Griyego ang higit sa isang pagkakaugnay ng mga diwang ito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: hindi nila alam
  rationale: Ipinahahayag ng kasalukuyang pandiwaring Griyego ang kalagayang dahilan ng kanilang pagkabigo. Natural sa modernong Tagalog ang “hindi nila alam” at hindi nito labis na ipinapalagay na sinadya nilang tanggihan ang kaalamang iyon.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili nito ang paliwanag na ugnayan ng talata sa naunang pahayag.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: katuwiran
  rationale: Sa kontekstong Paulino, ang “katuwiran” ay malawak na makapaghahayag ng pagiging matuwid, wastong katayuan, at matuwid na pagkilos ng Diyos; inilalahad sa talababa ang “katarungan” bilang lehitimong alternatibo.
- source_word: τοῦ θεοῦ
  choice: ng Diyos
  rationale: Ang pariralang Tagalog ay likas at nananatiling bukas sa mga diwang katuwirang taglay ng Diyos at katuwirang nagmumula sa Diyos.
- source_word: ἰδίαν
  choice: sarili nilang katuwiran
  rationale: Nakatago ngunit nauunawaan sa Griyego ang pangngalang “katuwiran.” Kailangang ulitin ito sa Tagalog upang maging malinaw at natural ang pangungusap.
- source_word: ζητοῦντες στῆσαι
  choice: sinisikap nilang itatag
  rationale: Ang “sinisikap” ay nagpapahayag ng patuloy na paghahangad, samantalang ang “itatag” ay tumutugma sa idyomatikong diwa ng στῆσαι na magtatag o magpatibay.
- source_word: οὐχ ὑπετάγησαν
  choice: hindi sila nagpasakop
  rationale: Natural nitong ipinahahayag ang diwang kusang hindi pagpapailalim na taglay ng anyong pasibo na may diwang panggitna sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng “katuwiran ng Diyos” sa paggamit ni Pablo
  choice: Pinanatili ang “katuwiran ng Diyos” nang hindi nililimitahan kung ito ay pangunahing katuwirang taglay ng Diyos, katuwirang nagmumula sa Diyos, o matuwid na pagliligtas na ginagawa ng Diyos.
  alternative: Maaaring isalin nang mas tiyak bilang “katuwirang mula sa Diyos” o ipaliwanag bilang matuwid na pagkilos ng Diyos.
  rationale: Maaaring magsanib ang mga diwang ito sa genitibong pariralang Griyego. Pinananatili ng salin at talababa ang tunay na teolohikal na tensiyon sa halip na pumili ng isang makitid na pagbasa.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “Sapagkat” ay angkop sa paliwanag na daloy ng argumento; ang “sinisikap nilang itatag” at “nagpasakop” ay karaniwang nauunawaan nang hindi nagiging labis na kolokyal o teknikal.
