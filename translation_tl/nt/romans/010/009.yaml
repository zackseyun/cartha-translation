  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: tl
  text: sapagkat kung ipahahayag mo sa pamamagitan ng iyong bibig na si Jesus ay Panginoon[a], at sasampalataya ka sa iyong puso na muling binuhay siya ng Diyos mula sa mga patay, maliligtas ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “ipahahayag mo si Jesus bilang Panginoon.” Maaaring isalin nang mas siksik ang pariralang Griego, ngunit nililinaw ng pangunahing teksto ang nilalaman ng pagpapahayag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayan ng naunang pahayag; likas at marangal ang “sapagkat” sa kontekstong ito.
- source_word: ἐὰν
  choice: kung
  rationale: Karaniwang panandang kondisyon kasama ng mga pandiwang nasa subjunctive; tuwiran at natural ang “kung.”
- source_word: ὁμολογήσῃς
  choice: ipahahayag
  rationale: Ipinahihiwatig ang hayagan at pasalitang pagkilala o pagpapahayag; mas natural sa modernong Filipino kaysa sa mas teknikal na “ikumpisal.”
- source_word: ἐν τῷ στόματί σου
  choice: sa pamamagitan ng iyong bibig
  rationale: Ipinananatili ang tahasang pagtukoy sa bibig bilang paraan ng pasalitang pagpapahayag nang hindi nagiging malabo ang “sa iyong bibig.”
- source_word: κύριον Ἰησοῦν
  choice: na si Jesus ay Panginoon
  rationale: Ginagawang malinaw ang nilalaman ng pagpapahayag at pinananatili ang predikatibong bisa ng κύριον.
- source_word: πιστεύσῃς
  choice: sasampalataya ka
  rationale: Ang “sumampalataya” ay natural na pandiwang Filipino para sa paniniwalang may pananampalataya sa kontekstong ito, habang nananatiling kasunod ang tiyak na nilalaman ng pinaniniwalaan.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: sa iyong puso
  rationale: Pinananatili ang biblikal na larawan ng panloob at tunay na pananalig nang hindi ito pinapakahulugan nang higit sa teksto.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: binuhay siya ng Diyos
  rationale: Likas na Filipino para sa pagkilos ng Diyos na muling bumuhay kay Jesus; ang payak na naganap na aspekto ay angkop sa aorist.
- source_word: ἐκ νεκρῶν
  choice: mula sa mga patay
  rationale: Tumpak na ipinahahayag ang pagkabuhay mula sa kalagayan o hanay ng mga patay at pinananatili ang pangmaramihang diwa ng νεκρῶν.
- source_word: σωθήσῃ
  choice: maliligtas ka
  rationale: Tuwirang ipinapahayag ang hinaharap na pasibong diwa at ang soteriolohikal na konteksto nang walang idinagdag na paliwanag.
theological_decisions:
- issue: Pagsasalin sa κύριος sa pormula ng pagpapahayag
  choice: Panginoon
  alternative: Ginoo; Amo
  rationale: Ang “Panginoon” ang kinikilalang pamagat na nagdadala ng awtoridad at ng malakas na alingawngaw ng Kasulatan sa konteksto, nang hindi ito nililimitahan sa diwang “Amo.”
- issue: Anyo ng pariralang κύριον Ἰησοῦν
  choice: na si Jesus ay Panginoon
  alternative: si Jesus bilang Panginoon
  rationale: Malinaw nitong inilalahad ang nilalaman ng ipinahahayag, ngunit kinikilala sa talababa ang mas siksik na pagbasa ng pariralang Griego.
- issue: Lakas na soteriolohikal ng σωθήσῃ
  choice: maliligtas ka
  alternative: ililigtas ka
  rationale: Pinananatili ng “maliligtas ka” ang pasibong pahayag at bokabularyo ng kaligtasan, nang hindi tinutukoy sa salin ang mga detalyeng hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ipahahayag” sa halip na “ikumpisal” upang idiin ang hayagan at pasalitang pagkilala, at pinanatili ang “puso,” “Panginoon,” at “maliligtas” bilang mahalagang bokabularyong biblikal.
