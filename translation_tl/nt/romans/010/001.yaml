source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: tl
  text: Mga kapatid[a], ang hangarin ng aking puso at ang panalangin ko sa Diyos para sa kanila ay para sa kanilang kaligtasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong panlalaking maramihan, ngunit maaari itong gamitin sa pagtawag sa pangkat na kinabibilangan ng mga lalaki at babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Mga kapatid
  rationale: Likas at marangal na tawag sa Filipino para sa maramihang ἀδελφοί. Hindi minamarkahan ng salitang “kapatid” ang kasarian, ngunit maaari itong tumukoy sa magkakapatid na lalaki o sa magkakahalong pangkat; nililinaw sa talababa ang anyong panlalaki ng Griyego.
- source_word: εὐδοκία
  choice: hangarin
  rationale: Sa konteksto, tumutukoy ito sa taimtim na ninanais ni Pablo. Ang “hangarin” ay natural at mas angkop kaysa “mabuting kalooban” o “kasiyahan.”
- source_word: τῆς ἐμῆς καρδίας
  choice: ng aking puso
  rationale: Pinananatili ang genitibong ugnayan at ang karaniwang biblikal na larawan ng puso bilang sentro ng pagnanais.
- source_word: δέησις
  choice: panalangin
  rationale: Tumutukoy sa taimtim na pakiusap sa Diyos. Ang “panalangin” ang pinakanatural dito, at malinaw sa kabuuang parirala ang diwa ng pagsusumamo.
- source_word: πρὸς τὸν θεόν
  choice: sa Diyos
  rationale: Ipinapahayag ng πρός ang direksiyon o patutunguhan ng panalangin; “sa Diyos” ang likas na anyo sa Filipino.
- source_word: ὑπὲρ αὐτῶν
  choice: para sa kanila
  rationale: Ipinahahayag ng ὑπέρ na ang panalangin ay alang-alang sa kanila. Pinananatili ang panghalip sa halip na tahasang ipalit ang “Israel.”
- source_word: εἰς σωτηρίαν
  choice: ay ang kanilang kaligtasan
  rationale: Ipinakikita ang layon ng hangarin at panalangin. Ang “kanilang” ay likas na nililinaw sa Filipino na ang kaligtasan ay para sa tinutukoy na “kanila,” nang hindi binabago ang diwa.
- source_word: μὲν
  choice: hindi tahasang isinalin
  rationale: Mahina ang diskursibong tungkulin nito rito at walang katapat na tahasang δέ sa talata; magiging pilit ang hiwalay na katumbas sa Filipino.
theological_decisions:
- issue: Kasariang saklaw ng Ἀδελφοί
  choice: Mga kapatid
  alternative: Mga kapatid na lalaki; mga kapatid na lalaki at babae
  rationale: Ang Griyego ay nasa anyong panlalaking maramihan, ngunit karaniwan itong ginagamit sa pagtawag sa buong kongregasyon, kabilang ang mga babae. Ang “mga kapatid” ay natural sa Filipino at hindi sapilitang nagpapaliit o nagpapalawak sa saklaw; inilalahad sa talababa ang tunay na pormang Griyego at posibleng inklusibong gamit.
- issue: Referente ng αὐτῶν
  choice: kanila
  alternative: Israel; mga kapwa Israelita ni Pablo
  rationale: Bagaman ipinakikita ng naunang konteksto na mga Israelita ang tinutukoy, panghalip lamang ang nasa Griyego. Pinananatili ito upang hindi magdagdag ng pangngalan sa pangunahing teksto.
- issue: Ugnayan ng εἰς σωτηρίαν sa hangarin at panalangin
  choice: ang kanilang kaligtasan bilang layon
  alternative: na humantong sa kaligtasan
  rationale: Maaaring magpahiwatig ang εἰς ng layon o bunga. Dito, ang pinakanatural na pagbasa ay ang kaligtasan nila ang nilalayon ng hangarin at panalangin, nang hindi ipinahihiwatig na awtomatikong magiging bunga nito ang kaligtasan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang payak ngunit taimtim na tono ni Pablo, pati ang pag-uulit ng “aking” at “ko” na likas sa Filipino at malinaw na naghihiwalay sa hangarin ng puso at panalangin.
