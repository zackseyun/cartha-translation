  naturalness: Natural at marangal ang “Mga kapatid” at ang kabuuang daloy. Mas idiomatiko at mas malinaw rin sa Filipino ang “ay para sa kanilang kaligtasan” kaysa “ay ang kanilang kaligtasan,” sapagkat malinaw nitong ipinapakita kung ano ang layon ng hangarin at panalangin.
