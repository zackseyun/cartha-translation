id: ROM.11.36
reference: Romans 11:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: tl
  text: Sapagkat mula sa kanya, sa pamamagitan niya, at tungo sa kanya ang lahat ng bagay. Sa kanya ang kaluwalhatian magpakailanman.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “tungo sa mga kapanahunan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang dahilan o batayan ng naunang pagpupuri; natural sa Filipino at pinananatili ang puwersang sanhi.
- source_word: ἐξ αὐτοῦ
  choice: mula sa kanya
  rationale: Malinaw na ipinahahayag ang pinagmulan nang hindi dinaragdagan ang kahulugan.
- source_word: δι’ αὐτοῦ
  choice: sa pamamagitan niya
  rationale: Pinananatili ang diwa ng paraan o tagapamagitan na ipinahahayag ng διά na may genitive.
- source_word: εἰς αὐτόν
  choice: tungo sa kanya
  rationale: Pinananatili ang direksiyon at layuning nakapaloob sa εἰς, nang hindi ito nililimitahan sa kahulugang 'para sa kanya.'
- source_word: τὰ πάντα
  choice: ang lahat ng bagay
  rationale: Inihahatid ang malawak at pansansinukob na saklaw ng parirala sa marangal ngunit madaling maunawaang Filipino.
- source_word: αὐτῷ ἡ δόξα
  choice: Sa kanya ang kaluwalhatian
  rationale: Natural na pormulang doksolohikal sa Filipino para sa sugnay na walang tahasang pandiwa, at hindi nagpapasok ng dagdag na pandiwang teolohikal.
- source_word: εἰς τοὺς αἰῶνας
  choice: magpakailanman
  rationale: Karaniwang Filipino para sa idyomang literal na 'tungo sa mga kapanahunan,' na nagsasaad ng walang hanggang panahon.
- source_word: ἀμήν
  choice: Amen
  rationale: Pinananatili ang kinikilalang transliterasyon bilang liturhikal na pagpapatibay.
theological_decisions:
- issue: Tinutukoy ng paulit-ulit na panghalip na αὐτοῦ/αὐτόν/αὐτῷ
  choice: Pinanatili ang 'kanya' sa kabuuan; ang Diyos ang tinutukoy ayon sa konteksto ng Roma 11:33–35.
  alternative: Palitan ang mga panghalip ng tahasang 'Diyos.'
  rationale: Hindi tahasang inuulit ng Griyego ang pangalang Diyos. Ang pagpapanatili sa panghalip ay gumagalang sa retorika at hindi nagpapaliit sa anumang tunay na pag-igting ng teksto.
- issue: Pagpapahayag ng doksolohiyang αὐτῷ ἡ δόξα
  choice: Sa kanya ang kaluwalhatian
  alternative: Sumakanya nawa ang kaluwalhatian
  rationale: Ang Griyego ay walang tahasang pandiwa. Ang piniling anyo ay natural na pagpupuri sa Filipino at hindi sapilitang nagpapasiya kung ito ay hangad o pahayag ng pag-aari.
translation_notes:
  register: Makabagong Filipino na marangal at angkop sa doksolohiya. Ginamit ang magkakatugmang 'mula sa kanya, sa pamamagitan niya, at tungo sa kanya' upang mapanatili ang retorikal na ayos ng Griyego. Ang tandang [a] ay inilagay agad pagkatapos ng 'magpakailanman.'
