base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: tl
  text: Sapagkat kung ang pagtatakwil sa kanila ay pakikipagkasundo ng sanlibutan, ano pa kaya ang magiging pagtanggap sa kanila[a] kundi buhay mula sa mga patay?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling pagtanggap sa kanila.” Ang salitang Griyego ay kasalungat ng “pagtatakwil” at maaaring tumukoy sa pagtanggap sa kanila pabalik.
    reason: lexical_alternative
  - marker: b
    text: Ang “buhay mula sa mga patay” ay maaaring tumukoy sa pambihirang espirituwal na pagpapanibago o, nang mas tiyak, sa pagkabuhay na muli. Pinananatiling maikli at masidhi ni Pablo ang pahayag.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: pagtatakwil
  rationale: Ipinahahayag nito ang relasyonal na diwa ng pagtataboy o pagsasantabi at malinaw na kasalungat ng “pagtanggap.”
- source_word: καταλλαγὴ
  choice: pakikipagkasundo ... sa Diyos
  rationale: Likas sa modernong Tagalog ang pariralang ito para sa muling pagsasaayos ng nasirang ugnayan; nililinaw ng “sa Diyos” ang ipinahihiwatig na kabilang panig nang hindi binabago ang diwa.
- source_word: κόσμου
  choice: sanlibutan
  rationale: Pinananatili ang malawak na saklaw ng κόσμος at hindi ito tahasang nililimitahan sa mga Hentil.
- source_word: πρόσλημψις
  choice: pagtanggap sa kanila
  rationale: Malinaw itong kasalungat ng “pagtatakwil sa kanila” at maaaring tumukoy sa muling pagtanggap.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: buhay mula sa mga patay
  rationale: Malapit sa Griyego at pinananatili ang masidhi ngunit sadyang bukas na pahayag, nang hindi ito agad ipinapakahulugang pagkabuhay na muli o espirituwal na pagpapanibago lamang.
- source_word: εἰ μὴ
  choice: kundi
  rationale: Sa retorikal na tanong, natural at madiin sa Tagalog ang “kundi” bilang panimula sa inaasahang sagot.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang lohikal na kaugnayan ng pangungusap sa naunang argumento.
theological_decisions:
- issue: Kahulugan ng “buhay mula sa mga patay”
  choice: Panatilihin itong bukas at masidhing pahayag na maaaring magkaroon ng espirituwal o eskatolohikal na pahiwatig.
  alternative: Tahasang tukuyin ito bilang malawakang espirituwal na pagpapanibago o bilang pangwakas na pagkabuhay na muli.
  rationale: Maikli at hindi ganap na nililinaw ni Pablo ang parirala; hindi dapat lutasin ng salin ang tensiyong iniwan ng Griyego.
- issue: Ang pinatutungkulan ng pakikipagkasundo
  choice: Gamitin ang “pakikipagkasundo ng sanlibutan sa Diyos.”
  alternative: Panatilihin ang mas literal ngunit maaaring malabong “pakikipagkasundo ng sanlibutan.”
  rationale: Ang Diyos ang ipinahihiwatig na kabilang panig sa konsepto ni Pablo ng καταλλαγή. Ginagawang natural at malinaw ito sa Tagalog nang hindi pinaliliit ang “sanlibutan” tungo lamang sa mga Hentil.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ano pa kaya” upang natural na maipahayag ang diin ng retorikal na paghahambing, habang pinananatili ang siksik at bukas na anyo ng hulíng parirala.
