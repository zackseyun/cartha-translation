revisions:
- from: Sapagkat kung ang pagtatakwil sa kanila ay naging pakikipagkasundo ng sanlibutan sa Diyos, ano pa kaya ang magiging pagtanggap sa kanila[a] kundi buhay mula sa mga patay?[b]
  to: Sapagkat kung ang pagtatakwil sa kanila ay pakikipagkasundo ng sanlibutan, ano pa kaya ang magiging pagtanggap sa kanila[a] kundi buhay mula sa mga patay?[b]
  rationale: Inalis ang “sa Diyos” upang huwag magdagdag sa hayag na pananalita ng Griyego, kahit na kontekstuwal na nauunawaan ang Diyos bilang kaugnay ng pakikipagkasundo. Pinalitan din ang “ay naging” ng “ay” upang mapanatili ang siksik na nominal na retorika ng orihinal. Walang pagbabago sa sinadyang bukas na kahulugan ng “buhay mula sa mga patay.”
