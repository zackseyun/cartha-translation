  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: tl
  text: Ngunit kung ang ilan sa mga sanga ay nabali, at ikaw, bagaman isang ligaw na puno ng olibo, ay inihugpong sa gitna ng mga iyon[a] at naging kapwa kabahagi sa ugat at sa kasaganaan ng punong olibo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inihugpong sa gitna ng mga sangang iyon.”
    reason: 'Nililinaw ng alternatibo ang ipinahihiwatig na tinutukoy ng panghalip: ang mga sangang nananatili.'
  - marker: b
    text: O, “naging kabahagi sa mayamang ugat ng punong olibo”; ayon sa tradisyon, “sa ugat at katabaan ng punong olibo.”
    reason: Maaaring unawain sa iba’t ibang paraan ang ugnayan ng sunod-sunod na genitive; literal na nangangahulugan din ang πιότης ng “katabaan” o masaganang sustansiya.
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ngunit kung
  rationale: Likas na ipinahahayag ang kondisyong may bahagyang pagsalungat o pagpapatuloy.
- source_word: τινες τῶν κλάδων
  choice: ang ilan sa mga sanga
  rationale: Pinananatili ang di-tiyak na τινες at ang partitive na diwa ng genitive.
- source_word: ἐξεκλάσθησαν
  choice: ay nabali
  rationale: Ang ἐκκλάω ay tumutukoy sa pagkaputol o pagkabali ng mga sanga; ang “nabali” ay malinaw at angkop sa larawan ng puno.
- source_word: ἀγριέλαιος ὢν
  choice: bagaman isang ligaw na olibo
  rationale: Pinananatili ang literal na larawan ng ligaw na olibo at ang concessive na diwa ng participle, nang hindi ito ipinapakahulugang tahasan bilang Hentil.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: ay inihugpong sa gitna ng mga iyon
  rationale: Ang “inihugpong” ay karaniwang terminong hortikultural; ang “sa gitna ng mga iyon” ay tumutukoy nang natural sa mga sangang nananatili.
- source_word: συγκοινωνὸς
  choice: kapwa kabahagi
  rationale: Ipinahahayag ang pakikibahagi kasama ng iba, hindi lamang ang indibiduwal na pagtanggap ng isang pakinabang.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: sa ugat, sa kasaganaan ng punong olibo
  rationale: Pinananatili ang siksik at maaaring higit sa isang paraan ang ugnayan ng sunod-sunod na genitive; ang “kasaganaan” ay natural na salin ng πιότης bilang mayamang sustansiya o kalubusan.
- source_word: ἐγένου
  choice: naging
  rationale: Tuwirang ipinahahayag ang pagpasok sa isang bagong kalagayan.
theological_decisions:
- issue: Pagkakakilanlan ng ligaw na olibo
  choice: Pinanatili ang metaporang “ligaw na olibo.”
  alternative: Ipaliwanag ang tinutukoy bilang isang Hentil.
  rationale: Nakasalalay ang pangangatwiran ni Pablo sa larawan ng paghuhugpong; hindi dapat palitan ng salin ang larawan ng isang doktrinal na paliwanag.
- issue: Ugnayan ng ugat at kasaganaan
  choice: “sa ugat, sa kasaganaan ng punong olibo”
  alternative: “sa mayamang ugat ng punong olibo” o “sa ugat at sa kasaganaan ng punong olibo”
  rationale: Siksik ang pagkakasunod ng mga genitive sa Griyego. Pinananatili ng pangunahing salin ang tensiyon at tunay na kalabuan sa halip na gawing tiyak kung ang “kasaganaan” ay naglalarawan sa ugat o isa pang bagay na pinakikibahaginan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang iisang kausap na “ikaw,” ang larawang hortikultural, at ang nakabiting sintaks ng talata dahil nagpapatuloy ang pangungusap sa susunod na talata.
