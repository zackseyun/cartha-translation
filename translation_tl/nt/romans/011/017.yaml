  to: Ngunit kung ang ilan sa mga sanga ay nabali, at ikaw, bagaman isang ligaw na puno ng olibo, ay inihugpong sa gitna ng mga iyon[a] at naging kapwa kabahagi sa ugat at sa kasaganaan ng punong olibo[b],
  rationale: Inayos ang huling parirala upang malinaw na kapwa pinakikibahaginan ang ugat at kasaganaan, habang pinananatili ng talababa ang alternatibong pagbasa na inilalarawan ng “mayamang ugat.” Pinalinaw rin ang ἀγριέλαιος bilang “ligaw na puno ng olibo,” nang hindi binibigyan ng interpretatibong pagkakakilanlan ang metapora. Ang kuwit sa hulihan ay pinananatili sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
