id: ROM.11.25
reference: Romans 11:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: tl
  text: 'Sapagkat hindi ko nais, mga kapatid,[a] na wala kayong kaalaman tungkol sa hiwagang ito, upang hindi kayo maging marunong sa sarili ninyong palagay: Bahagyang katigasan ang dumating sa Israel hanggang sa makapasok ang kapuspusan ng mga Hentil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Griyego ay nasa anyong “mga kapatid na lalaki,” ngunit maaari itong tumukoy sa magkakahalong pangkat ng mga lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: O “hanggang sa makapasok ang buong bilang ng mga Hentil.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: hindi ninyo malaman
  rationale: Sa pormulang Paulino na οὐ θέλω ὑμᾶς ἀγνοεῖν, ipinahihiwatig ang ayaw niyang manatili silang walang kaalaman. Pinananatili ng salin ang negatibong anyo ng Griyego nang hindi gumagamit ng salitang maaaring tunog-mapanghamak.
- source_word: ἀδελφοί
  choice: mga kapatid
  rationale: Ang “mga kapatid” ang likas na tawag sa Filipino at maaari itong tumukoy sa magkakahalong pangkat, bagaman panlalaking pangmaramihan ang anyong Griyego.
- source_word: μυστήριον
  choice: hiwaga
  rationale: Tumutukoy ito sa layunin ng Diyos na dating nakakubli at ngayo'y inihahayag; pinananatili ng “hiwaga” ang teolohikal na bigat nang hindi ipinahihiwatig na isa lamang itong pribadong lihim.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: upang hindi ninyo isipin na marunong kayo
  rationale: Natural nitong ipinapahayag sa Filipino ang babala laban sa sariling pagpapalagay na marunong, habang pinananatili ang layunin ng sugnay.
- source_word: πώρωσις
  choice: katigasan
  rationale: Ipinahihiwatig nito ang espirituwal na pagkamanhid o pagtigas. Hindi idinagdag ang “puso,” sapagkat wala iyon sa mismong teksto.
- source_word: ἀπὸ μέρους
  choice: bahagyang
  rationale: Pinananatili nitong bukas kung ang tinutukoy ay lawak o bahagi ng Israel, sa halip na tahasang tukuyin ang eksaktong saklaw.
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: ang sumapit sa Israel
  rationale: Ipinapahayag ng “sumapit” ang kalagayang dumating at nananatiling umiiral, na angkop sa perpektong aspekto ng γέγονεν.
- source_word: πλήρωμα
  choice: kapuspusan
  rationale: Pinananatili nito ang malawak at pinagtatalunang diwa ng πλήρωμα—kapuspusan, kabuuan, o ganap na bilang—nang hindi agad pumipili ng isang interpretasyon.
- source_word: τῶν ἐθνῶν
  choice: ng mga Hentil
  rationale: Sa kontekstong kasalungat ng Israel, malinaw na tumutukoy ito sa mga hindi Judio, kaya mas tiyak ang “mga Hentil” kaysa “mga bansa.”
- source_word: εἰσέλθῃ
  choice: makapasok
  rationale: Ang anyong ito ay natural kasunod ng “hanggang sa” at pinananatili ang larawan ng pagpasok bilang hangganang pangyayari.
theological_decisions:
- issue: Kahulugan ng “kapuspusan ng mga Hentil”
  choice: kapuspusan ng mga Hentil
  alternative: buong bilang ng mga Hentil
  rationale: Pinagtatalunan kung tumutukoy ito sa buong bilang, ganap na paglahok, o eskatolohikal na kaganapan. Pinananatili ng pangunahing teksto ang tunay na kalabuan, at inilalagay sa talababa ang karaniwang alternatibo.
- issue: Saklaw ng ἀδελφοί
  choice: mga kapatid
  alternative: mga kapatid na lalaki at babae
  rationale: Bagaman panlalaking pangmaramihan ang anyong Griyego, karaniwang ginagamit sa Filipino ang “mga kapatid” para sa magkakahalong pangkat. Nililinaw ng talababa ang anyo at posibleng saklaw nito.
- issue: Saklaw ng bahagyang katigasan sa Israel
  choice: Bahagyang katigasan ang sumapit sa Israel
  alternative: Tumigas ang isang bahagi ng Israel
  rationale: Maaaring unawain ang ἀπὸ μέρους bilang limitadong lawak o bilang bahagi lamang ng Israel. Hindi tahasang nilulutas ng salin ang tanong na iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang teolohikal na terminong “hiwaga” at ang sadyang maluwag na “kapuspusan,” habang iniwasan ang pagdaragdag ng “puso” o ang pagpapasya kung eksaktong bilang o ganap na paglahok ang tinutukoy.
