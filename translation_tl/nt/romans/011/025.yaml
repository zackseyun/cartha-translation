review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s principal elements: Paul’s disclosure formula, the mystery, the warning against self-wise confidence, Israel’s partial hardening, and the terminus involving the fullness of the Gentiles. However, the rendering of ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι omits the essential reflexive nuance (“in your own estimation”), and the opening double-negative is unnecessarily awkward in modern Filipino.'
  naturalness: “Hindi ko nais na hindi ninyo malaman” is grammatical but stiff and unnatural for modern Filipino. “Upang hindi ninyo isipin na marunong kayo” is natural enough but weakens the specific warning against being wise in one’s own estimation. The revised wording is fluent while retaining the formal, dignified register.
  terminology: “Hiwaga,” “mga kapatid,” “Israel,” “mga Hentil,” and “kapuspusan” are appropriate. “Katigasan” retains the metaphor of πώρωσις without adding “puso.” The wording “bahagyang katigasan” is retained cautiously as a compact way of preserving the disputed scope rather than deciding explicitly that only one segment of Israel is in view.
  issues:
  - severity: medium
    issue: The phrase “upang hindi ninyo isipin na marunong kayo” does not express ἑαυτοῖς.
    rationale: The Greek warns the readers not to be wise in their own estimation, not merely not to think that they are wise. “Maging marunong sa sarili ninyong palagay” preserves this reflexive/self-conceit nuance.
  - severity: low
    issue: The opening “hindi ko nais na hindi ninyo malaman” is awkward in modern Filipino.
    rationale: Although it reflects the Greek negative formulation, “hindi ko nais na wala kayong kaalaman” is more idiomatic and still accurately conveys Paul’s conventional formula of not wanting the audience to be uninformed.
  revised_text: 'Sapagkat hindi ko nais, mga kapatid,[a] na wala kayong kaalaman tungkol sa hiwagang ito, upang hindi kayo maging marunong sa sarili ninyong palagay: Bahagyang katigasan ang dumating sa Israel hanggang sa makapasok ang kapuspusan ng mga Hentil.[b]'
