id: ROM.11.10
reference: Romans 11:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: tl
  text: Padilimin nawa ang kanilang mga mata upang hindi sila makakita, at palaging payukuin ang kanilang likod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lagi” o “patuloy.” Ang parirala ay tumutukoy sa palagian o tuloy-tuloy na kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Padilimin nawa
  rationale: Ipinahahayag ang ikatlong-panauhang pasibong pautos/paghiling at pinananatili ang larawan ng pagdidilim sa halip na agad itong ipakahulugang pagkabulag.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ang kanilang mga mata
  rationale: Tuwirang salin na nagpapanatili sa mahalagang larawang pangkatawan.
- source_word: τοῦ μὴ βλέπειν
  choice: upang hindi sila makakita
  rationale: Natural sa Tagalog at pinananatiling bukas kung layunin o bunga ang diin ng articular infinitive na may μή.
- source_word: τὸν νῶτον αὐτῶν
  choice: ang kanilang likod
  rationale: Pinananatili ang isahang anyo ng Griyego, na natural ding gamitin nang pamahagi sa Tagalog.
- source_word: διὰ παντός
  choice: palagi
  rationale: Naghahatid ng tuloy-tuloy o palagiang tagal nang hindi ipinapasok ang mas tiyak na diwang 'magpakailanman.'
- source_word: σύγκαμψον
  choice: payukuin
  rationale: Ang causative na anyo ay natural na tumutugma sa pautos na may tuwirang layong 'kanilang likod' at nagpapanatili sa larawan ng pagkakayuko.
theological_decisions:
- issue: Sumpang sipi at pagkilos ng Diyos
  choice: Pinanatili ang lakas ng paghiling/pautos sa “Padilimin nawa ... at ... payukuin.”
  alternative: Isalin bilang hula lamang, gaya ng “didilim ang kanilang mga mata,” o bilang di-tahasang bunga na walang kinakausap.
  rationale: Ang anyo ng sipi ay isang matinding paghiling o pahayag ng hatol; hindi ito dapat pahinain bilang hula lamang, ngunit hindi rin dapat dagdagan ng paliwanag na wala sa teksto.
translation_notes:
  register: Makabago at marangal na Tagalog. Ginamit ang “nawa” upang malinaw na maipahayag ang mapanaghiling na puwersa ng Griyego; ang “payukuin” ay natural ngunit nananatiling malapit sa pisikal na larawan ng teksto.
