  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: tl
  text: At ito ang magiging tipan ko sa kanila[a] kapag inalis ko ang kanilang mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang tipang mula sa akin tungo sa kanila.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: tipan
  rationale: Sa konteksto ng pagsipi ni Pablo sa pangako ng Kasulatan, ang “tipan” ang likas at teolohikal na angkop na katumbas; tumutukoy ito sa nagbubuklod na pangako ng Diyos, hindi sa isang huling habilin.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: ang magiging tipan ko
  rationale: Literal na ipinahihiwatig ng parirala ang tipang nagmumula sa Diyos. Likas sa Tagalog ang “tipan ko,” habang ang idinagdag na “magiging” ay kumukumpleto sa eliptikong pangungusap at nagpapanatili sa hinaharap na diwa ng propetikong pangako.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Ang datibo ay tuwirang maisasalin na “sa kanila.” Pinananatili nito ang direksiyon ng tipang nagmumula sa Diyos nang hindi ipinipilit ang mas interpretatibong “sa kanila ang tipan” o “tipan kasama nila.”
- source_word: ὅταν
  choice: kapag
  rationale: Ipinakikilala rito ang panahong matutupad ang tiyak na propetikong pangako, hindi ang paulit-ulit na pangyayari. Natural sa Tagalog ang “kapag” sa ganitong sugnay na tumutukoy sa hinaharap.
- source_word: ἀφέλωμαι
  choice: inalis ko na
  rationale: Ang pandiwa ay tumutukoy sa pag-aalis ng mga kasalanan. Ang “inalis ko na” pagkatapos ng “kapag” ay natural na aspektong Tagalog para sa kilos na matatapos sa panahong tinutukoy, nang hindi nagtatakda ng eksaktong petsa.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ang kanilang mga kasalanan
  rationale: Tuwiran at malinaw na pinananatili ng “mga kasalanan” ang plural at ang moral-teolohikal na kahulugan ng Griyego.
- source_word: καὶ αὕτη
  choice: At ito
  rationale: Pinananatili ng “At” ang ugnayan sa naunang sipi, at malinaw na itinuturo ng “ito” ang pangakong inilalarawan sa sumusunod na sugnay.
theological_decisions:
- issue: Kahulugan ng διαθήκη sa propetikong sipi ni Pablo
  choice: tipan
  alternative: habilin o kasunduan
  rationale: Pinananatili ng “tipan” ang konteksto ng pangako ng Diyos sa Kasulatan at hindi nag-aangkat ng diwa ng huling habilin o ng karaniwang kasunduang pantay ang mga partido.
- issue: Pamanahong diwa ng ὅταν ἀφέλωμαι
  choice: kapag inalis ko na ang kanilang mga kasalanan
  alternative: tuwing inaalis ko ang kanilang mga kasalanan
  rationale: Ang konteksto ay isang tiyak na pangakong pangkaligtasan sa kasaysayan, hindi isang paulit-ulit na pangkalahatang kondisyon. Hindi rin tinutukoy ng salin ang eksaktong panahon ng katuparan.
- issue: Ugnayan ng Diyos at ng mga tinutukoy sa tipan
  choice: tipan ko sa kanila
  alternative: tipan ko sa kanila kasama nila
  rationale: Ang “sa kanila” ay malapit sa datibong αὐτοῖς at nagpapanatili sa diin na ang tipan ay nagmumula sa Diyos, nang hindi labis na nilulutas kung ang relasyon ay dapat ipahayag bilang “with,” “to,” o “for.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan” bilang karaniwang terminong biblikal. Ang anyong “kapag inalis ko na” ay likas sa Tagalog at nagpapahayag ng inaasahang natapos na kilos sa hinaharap. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang tinutukoy nito.
