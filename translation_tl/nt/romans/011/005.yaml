  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: tl
  text: Kaya nga, sa kasalukuyang panahon din, nagkaroon ng isang nalabi ayon sa pagpili ng biyaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa mapagbiyayang pagpili” o “ayon sa pagpiling batay sa biyaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Kaya gayundin
  rationale: Ipinahahayag ng οὕτως οὖν ang kongklusyon mula sa halimbawa ni Elias, samantalang pinananatili ng “gayundin” ang paghahambing ng καί sa kasalukuyang panahon.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: sa kasalukuyang panahon
  rationale: Natural itong Filipino para sa isang tiyak na panahon o yugto at pinananatili ang paghahambing sa panahon ni Elias.
- source_word: λεῖμμα
  choice: nalabing bahagi
  rationale: Tumutukoy ito sa minoryang natira; malinaw ito sa karaniwang mambabasa nang hindi ipinapalagay sa mismong salita kung paano sila nanatili.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: ayon sa pagpili ng biyaya
  rationale: Pinananatili nito ang ugnayang henitibo ng ἐκλογή at χάρις nang hindi nililimitahan kung ang biyaya ang pinagmulan, batayan, o katangian ng pagpili.
- source_word: γέγονεν
  choice: umiral
  rationale: Ipinahihiwatig ng perpektong anyo ang kasalukuyang kalagayang bunga ng naganap na pagkakaroon; ang “umiral” ay natural ngunit nananatiling pandiwa, hindi lamang payak na “mayroon.”
theological_decisions:
- issue: Pagsasalin ng ἐκλογή sa kontekstong teolohikal na pinagtatalunan
  choice: pagpili
  alternative: pagkahirang
  rationale: Ang “pagpili” ang tuwirang kahulugan at hindi awtomatikong nag-aangkat ng isang sistemang doktrinal; nananatili pa rin ang bigat ng pahayag ni Pablo.
- issue: Ugnayan ng biyaya at pagpili sa κατ’ ἐκλογὴν χάριτος
  choice: ayon sa pagpili ng biyaya
  alternative: ayon sa mapagbiyayang pagpili; ayon sa pagpiling batay sa biyaya
  rationale: Pinananatili ng parirala ang tunay na kalabuan ng henitibo sa halip na tiyaking kalidad o batayan lamang ang ibig sabihin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nalabing bahagi” sa halip na mas teknikal na “nalabi,” at inilagay ang talababa upang mapanatili ang posibleng mga ugnayan ng “biyaya” at “pagpili.”
