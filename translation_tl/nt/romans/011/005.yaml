  source_fidelity: Ang “nalabing bahagi” ay masyadong pangkalahatan at hindi gaanong tumutugma sa biblikal na gamit ng λεῖμμα bilang isang nalabi o natitirang minorya. Ang “may nalabing bahagi na umiral” ay hindi rin natural at malabo ang pagpapahayag ng γέγονεν. Ang “nagkaroon ng isang nalabi” ay mas tuwirang nagsasaad ng naganap na pag-iral/pagkakaroon na may kasalukuyang resulta.
  naturalness: Hindi natural sa makabagong Filipino ang “may nalabing bahagi na umiral.” Mas malinaw at marangal ang “nagkaroon ng isang nalabi.” Ang “Kaya nga” at “din” ay likas na naghahatid ng pangangatwiran at paghahambing ng unang parirala.
  terminology: Ginamit ang “nalabi,” isang matatag at angkop na terminong biblikal para sa λεῖμμα. Pinanatili ang “pagpili ng biyaya” upang huwag ipagpasya nang higit sa pinahihintulutan ng henitibong ugnayan sa κατ’ ἐκλογὴν χάριτος; ang mga posibleng pagpapalinaw ay nasa talababa.
