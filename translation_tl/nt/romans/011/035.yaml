    rationale: Bagaman maaari itong mangahulugang pagganti o pagbibigay-kapalit, mas karaniwan sa makabagong Filipino ang kahulugang retaliatory. Ang ἀνταποδοθήσεται rito ay tumutukoy sa pagsukli sa naunang ibinigay.
  - severity: low
