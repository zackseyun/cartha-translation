- from: O sino ang naunang nagbigay sa kanya[a][b], at siya ay gagantihan?
  to: O sino ang naunang nagbigay sa kanya[a][b], at siya'y susuklian?
  rationale: Ang rebisyon ay nagpapanatili sa anyong patanong, sa panghalip na “kanya” para sa Diyos sa unang sugnay, at sa bahagyang di-pagtukoy sa gumagawa ng pagsukli sa balintiyak na ikalawang sugnay. Ang “susuklian” ang mas malinaw na modernong Filipino para sa pagbabayad o pagbibigay-kapalit at iniiwasan ang hindi kinakailangang diwa ng paghihiganti.
