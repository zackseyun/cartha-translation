  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: tl
  text: O sino ang naunang nagbigay sa kanya[a][b], at siya'y susuklian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbigay muna sa kanya.”
    reason: lexical_alternative
  - marker: b
