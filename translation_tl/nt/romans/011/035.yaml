lexical_decisions:
- source_word: ἢ
  choice: O
  rationale: Likas at maikling pang-ugnay sa Filipino para ipakilala ang kasunod na retorikal na tanong.
- source_word: τίς
  choice: sino
  rationale: Karaniwang katumbas ng panghalip na patanong na tumutukoy sa isang tao.
- source_word: προέδωκεν
  choice: naunang nagbigay
  rationale: Pinananatili ang diwa ng pagbibigay nang una o bago pa, na mahalaga sa tanong kung may sinumang makapaglalagay sa Diyos sa pagkakautang.
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Griyego; malinaw mula sa konteksto na Diyos ang tinutukoy.
- source_word: καὶ
  choice: at
  rationale: Pinananatili ang payak na pag-uugnay ng dalawang sugnay at ang anyo ng retorikal na tanong.
- source_word: ἀνταποδοθήσεται
  choice: gagantihan
  rationale: Ang pandiwa ay nasa panghinaharap na balintiyak at nangangahulugang susuklian o babayaran bilang kapalit. Ang “siya ay gagantihan” ay natural sa Filipino at hindi tahasang nagdaragdag kung sino ang gaganti.
- source_word: αὐτῷ
  choice: siya
  rationale: Ginawang paksa ng natural na balintiyak sa Filipino ang taong tatanggap ng ganti, habang pinananatili ang pagtukoy sa naunang nagbigay.
theological_decisions:
- issue: Tinutukoy ng αὐτῷ
  choice: Isinalin bilang “kanya/siya,” na tumutukoy sa Diyos sa unang sugnay at sa sinumang umano'y naunang nagbigay sa ikalawa ayon sa relasyon ng mga sugnay.
  alternative: 'Tahasang gamitin ang “Diyos” at gawing aktibo ang ikalawang sugnay: “upang gantihan siya ng Diyos.”'
  rationale: Hindi tahasang binabanggit ng Griyego ang pangngalang “Diyos” o ang gumagawa ng pagganti. Iniiwasan ng salin ang pagdaragdag ng mga iyon habang nananatiling malinaw sa konteksto.
- issue: Diwa ng προέδωκεν at pagkakautang ng Diyos
  choice: Pinanatili ang “naunang” upang ipahiwatig ang pag-aangking may nagbigay muna at kaya nararapat gantihan.
  alternative: “Nagbigay sa kanya” nang walang pahiwatig ng pagkauna.
  rationale: Mahalaga sa tambalang pandiwa ang pagkauna o pagbibigay bago pa man; ito ang batayan ng retorikal na pagtanggi na may sinumang makapagpapautang sa Diyos.
- issue: Balintiyak na ἀνταποδοθήσεται
  choice: “siya ay gagantihan,” na hindi pinapangalanan ang gaganti.
  alternative: “gagantihan siya ng Diyos” o “iyon ay ibabalik sa kanya.”
  rationale: Pinananatili nito ang balintiyak ng Griyego at ang bahagyang kalabuan nito, habang mas natural kaysa sa isang impersonal na balintiyak sa Filipino.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “naunang nagbigay” upang mapanatili ang diin ng orihinal sa pagkauna, at ang balintiyak na “siya ay gagantihan” upang hindi tahasang idagdag ang gumagawa ng pagganti.
