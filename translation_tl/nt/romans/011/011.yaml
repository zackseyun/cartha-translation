  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: tl
  text: 'Kaya itinatanong ko: Hindi naman sila natisod upang bumagsak, hindi ba?[a] Hinding-hindi! Sa halip, dahil sa kanilang paglabag[b], dumating ang kaligtasan sa mga hindi Judio[c], upang pukawin silang magselos.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Magkaiba ang “matisod” at “bumagsak” sa Griyego. Ang tanong ay umaasa sa sagot na hindi; hindi nito tahasang sinasabing “tuluyang bumagsak.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa pamamagitan ng kanilang pagsuway.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “sa mga bansa”; sa kontekstong ito, tumutukoy ito sa mga taong hindi Judio, na tinatawag ding mga Hentil.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “upang udyukan silang magselos.” Maaaring kabilang sa diwa nito ang pagpukaw sa kanilang hangarin ang gayunding kaligtasan.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Kaya itinatanong ko
  rationale: Ipinahihiwatig ng λέγω sa bahaging ito ng pangangatwiran ang pagpapakilala ni Pablo ng isang retorikal na tanong. Likas sa makabagong Tagalog ang “Kaya itinatanong ko,” at pinananatili ng “kaya” ang lohikal na puwersa ng οὖν.
- source_word: μὴ ἔπταισαν
  choice: Natisod ba sila
  rationale: Ang μή sa tanong ay umaasang hindi ang sagot. Hindi na kailangang gawing negatibo ang anyo sa Tagalog dahil malinaw itong sinasagot ng mariing “Hinding-hindi!”
- source_word: ἵνα πέσωσιν
  choice: upang bumagsak
  rationale: Pinananatili ang pagkakaiba ng πταίω, “matisod,” at πίπτω, “bumagsak,” nang hindi idinaragdag sa pangunahing teksto ang ideyang ganap o hindi na maibabalik ang pagbagsak.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang mariin at likas na pagtanggi sa makabagong Tagalog. Inihahatid nito ang lakas ng nakaugaliang pahayag ni Pablo nang hindi nagiging matigas o lipas ang pananalita.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: dahil sa kanilang paglabag
  rationale: Ang παράπτωμα ay isang maling hakbang o pagsuway. Malinaw at may sapat na bigat moral ang “paglabag”; ang “dahil sa” ay natural na nagpapahayag ng ugnayang sanhi o paraan sa konteksto.
- source_word: ἡ σωτηρία
  choice: ang kaligtasan
  rationale: Ang “kaligtasan” ang karaniwan at angkop na salin ng σωτηρία sa teolohikal na pangangatwiran ng Roma.
- source_word: τοῖς ἔθνεσιν
  choice: sa mga hindi Judio
  rationale: Bagaman literal na “sa mga bansa,” tumutukoy ang ἔθνη sa kontekstong ito sa mga taong hindi Judio. Mas tuwiran itong mauunawaan ng karaniwang mambabasa kaysa sa teknikal na “mga Hentil.”
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: upang pukawin silang magselos
  rationale: Ipinapahayag ng εἰς τό at pawatas ang layunin o bunga. Pinananatili ng “magselos” ang karaniwang kahulugan ng παραζηλόω, samantalang ipinapaliwanag sa talababa ang posibleng diwang mahikayat silang hangarin ang gayunding pagpapala.
theological_decisions:
- issue: Kung ang pagkatisod ng Israel ay inilalarawan bilang pangwakas at hindi na maibabalik na pagbagsak
  choice: Itinatanggi ng talata na natisod sila upang bumagsak, habang pinananatiling magkaiba ang dalawang pandiwa.
  alternative: Maaaring ipaliwanag ang “bumagsak” bilang ganap, pangwakas, o hindi na maibabalik na kapahamakan.
  rationale: Hindi tahasang taglay ng πέσωσιν ang lahat ng gayong paliwanag. Kaya hindi idinagdag ang “tuluyan,” “lubusan,” o “hindi na makabangon,” at hinayaang manatili ang tensiyong teolohikal sa daloy ng Roma 11.
- issue: Ang diwa ng pagseselos sa kasaysayan ng kaligtasan
  choice: Ang pagtanggap ng mga hindi Judio sa kaligtasan ay may layuning pukawin ang Israel na magselos.
  alternative: Maaari itong unawain bilang negatibong inggit lamang o bilang selos na hahantong sa paghahangad ng gayunding kaligtasan.
  rationale: Maaaring saklawin ng παραζηλόω ang selos na nauuwi sa pagtulad o paghahangad. Hindi pinili nang tahasan ang alinman sa pangunahing teksto; inilagay sa talababa ang mas positibong posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang sobrang teknikal na “Hentil” sa pangunahing teksto ngunit pinanatili ito sa paliwanag. Ang “natisod” at “bumagsak” ay sadyang pinag-iba upang mapanatili ang retorika at teolohikal na tensiyon ng orihinal.
