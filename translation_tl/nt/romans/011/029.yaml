  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: tl
  text: Sapagkat hindi binabawi ng Diyos ang kanyang mga kaloob at pagtawag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi pinagsisisihan ng Diyos.” Ang salitang Griyego ay maaari ring tumukoy sa isang bagay na hindi binabawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: hindi binabawi ng Diyos
  rationale: Ang pang-uri ay maaaring mangahulugang hindi pinagsisisihan o hindi binabawi. Sa kontekstong ito, likas sa modernong Tagalog ang aktibong pahayag at malinaw nitong ipinahihiwatig na hindi binabawi ng Diyos ang kanyang ibinigay at itinawag, nang hindi pinalalawak tungo sa ganap na 'hindi mababago.'
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikilala ng γάρ ang paliwanag o batayan ng naunang pahayag; pinananatili ito ng 'Sapagkat' nang natural at malinaw.
- source_word: τὰ χαρίσματα
  choice: mga kaloob
  rationale: Ang χάρισμα ay kaloob na nagmumula sa biyaya. Ang 'mga kaloob' ay natural, marangal, at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: ἡ κλῆσις
  choice: pagtawag
  rationale: Pinananatili ng 'pagtawag' ang teolohikal na bigat ng Pauline na κλῆσις at mas angkop dito kaysa sa 'tawag' o 'paanyaya.'
- source_word: τοῦ θεοῦ
  choice: ng Diyos / kanyang
  rationale: Maaaring tukuyin ng genitive ang Diyos bilang pinagmulan o may-ari ng kapuwa mga kaloob at pagtawag. Sa natural na aktibong ayos sa Tagalog, ang Diyos ang tahasang gumagawa at ang 'kanyang' ang nag-uugnay sa dalawang pangngalan sa kanya.
theological_decisions:
- issue: Saklaw ng “mga kaloob at pagtawag ng Diyos”
  choice: Hindi tinukoy sa salin kung ito ay tumutukoy lamang sa mga pribilehiyo at pagtawag sa Israel o sa mas pangkalahatang simulain tungkol sa mga kaloob at pagtawag ng Diyos.
  alternative: Tahasan itong iugnay sa Israel ayon sa agarang konteksto ng Roma 9–11, o gawing pangkalahatang pahayag tungkol sa lahat ng mananampalataya.
  rationale: Malinaw na tungkol sa Israel ang agarang konteksto, ngunit hindi inuulit ng mismong pangungusap ang layon ng mga kaloob at pagtawag. Pinananatili ng salin ang lawak at tensiyon ng orihinal.
- issue: Diwa ng ἀμεταμέλητα
  choice: “hindi binabawi” sa pangunahing teksto, na may talababa para sa “hindi pinagsisisihan.”
  alternative: “hindi pinagsisisihan,” “hindi mababago,” o tradisyonal na “walang pagsisisi.”
  rationale: Ang 'hindi binabawi' ay mahusay na naghahatid ng diwa sa kaugnayan ng mga kaloob at pagtawag, samantalang pinananatili sa talababa ang tunay na leksikal na alternatibo. Ang 'hindi mababago' ay maaaring lumabis, at ang 'walang pagsisisi' ay malabo sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang aktibong ayos upang maging likas ang pangungusap, habang pinananatili ang paliwanag na ugnayan sa naunang talata at ang sadyang hindi tiyak na saklaw ng mga kaloob at pagtawag.
