id: ROM.11.12
reference: Romans 11:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: tl
  text: Ngunit kung ang kanilang paglabag ay nagdulot ng kayamanan sa sanlibutan, at ang kanilang pagkalugi[a] ay nagdulot ng kayamanan sa mga Hentil, gaano pa kaya ang maidudulot ng kanilang kapuspusan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkatalo,” “kabiguan,” o “pagkaunti.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ganap na bilang,” “ganap na pagkakabilang,” o “ganap na pagpapanumbalik.”
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: paglabag
  rationale: Ipinapanatili ng “paglabag” ang moral na diwa ng isang maling hakbang o pagkakasala nang hindi labis na tinutukoy ang uri nito.
- source_word: πλοῦτος
  choice: kayamanan
  rationale: Pinananatili nito ang talinghaga ng saganang pagpapalang napunta sa sanlibutan at sa mga Hentil.
- source_word: κόσμου
  choice: sanlibutan
  rationale: Malawak ang saklaw nito at tumutukoy sa daigdig sa labas ng Israel na nakinabang sa pangyayaring tinatalakay.
- source_word: ἥττημα
  choice: pagkalugi
  rationale: Naipahihiwatig nito ang pagkawala o pagkabawas at nababagay sa talinghaga ng “kayamanan,” habang hindi lubusang nilulutas kung pagkatalo, kabiguan, o pag-unti ang diin.
- source_word: ἐθνῶν
  choice: mga Hentil
  rationale: Malinaw nitong pinananatili ang paghahambing ni Pablo sa Israel at sa mga bansang hindi Judio.
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kaya
  rationale: Ito ang natural na ekspresyong Filipino para sa paghahambing na mula sa mas maliit tungo sa lalong higit.
- source_word: πλήρωμα
  choice: kapuspusan
  rationale: Pinananatili nito ang lawak ng salitang Griyego, na maaaring tumukoy sa ganap na bilang, ganap na pagkakabilang, o ganap na kalagayan, nang hindi pumipili agad ng isang interpretasyon.
theological_decisions:
- issue: Ang kahulugan ng τὸ πλήρωμα αὐτῶν (“kanilang kapuspusan”)
  choice: kanilang kapuspusan
  alternative: kanilang ganap na bilang; kanilang ganap na pagkakabilang; kanilang ganap na pagpapanumbalik
  rationale: Masinsin at bukas sa ilang kaugnay na kahulugan ang pananalita ni Pablo. Pinananatili ng salin ang tensiyong ito sa halip na magtakda ng isang tiyak na pananaw tungkol sa magiging kalagayan ng Israel.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “nagdulot ng” upang likas na maipahayag sa Filipino ang mga sugnay na walang tahasang pandiwa sa Griyego. Inilipat ang mga panandang talababa sa mismong mga salitang nililinaw nila.
