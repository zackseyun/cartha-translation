base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: tl
  text: At sila rin, kung hindi sila mananatili sa kawalan ng pananampalataya[a], ay ihuhugpong[b]; sapagkat kayang ihugpong silang muli ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kawalan ng katapatan.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring isalin ang unang sugnay na “ay muling ihuhugpong.” Tahasang nasa ikalawang sugnay ang salitang Griyego para sa “muli.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: At sila rin
  rationale: Pinananatili ang pandagdag na diwa ng καί at ang pagtukoy ng ἐκεῖνοι sa mga sanga o Israelitang hindi sumampalataya; likas sa modernong Tagalog ang “sila rin.”
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: kung hindi sila mananatili
  rationale: Ipinahahayag ang kondisyon at ang patuloy na pananatili sa isang kalagayan na taglay ng present subjunctive.
- source_word: τῇ ἀπιστίᾳ
  choice: sa kawalan ng pananampalataya
  rationale: Sa konteksto ng Roma 11, tumutukoy ang ἀπιστία sa hindi pagsampalataya. Ang pariralang ito ay malinaw at dignified, habang ang talababa ay nagpapanatili sa posibleng diwang “kawalan ng katapatan.”
- source_word: ἐγκεντρισθήσονται
  choice: ay ihuhugpong
  rationale: Future passive ito sa talinghaga ng paghuhugpong sa punong olibo. Hindi idinagdag dito ang “muli” sapagkat lumilitaw lamang ang πάλιν sa kasunod na sugnay.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: sapagkat kayang ... ng Diyos
  rationale: Natural na Tagalog para sa kakayahan ng Diyos at pinananatili ang αιτιολογική na gamit ng γάρ.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: ihugpong silang muli
  rationale: Tahasan nitong inilalagay ang panunumbalik sa ikalawang sugnay, kung saan nasa Griyego ang πάλιν.
theological_decisions:
- issue: Kahulugan ng ἀπιστία
  choice: kawalan ng pananampalataya
  alternative: kawalan ng katapatan
  rationale: Ang agarang konteksto ng Roma 11 ay naghahambing ng pananampalataya at hindi pagsampalataya kaugnay ng pagkakabilang sa bayan ng Diyos. Gayunman, itinatala sa talababa ang leksikal na alternatibo.
- issue: Kung tahasang ilalagay ang panunumbalik sa unang pandiwa ng paghuhugpong
  choice: “ihuhugpong” sa unang sugnay; “ihugpong silang muli” sa ikalawa
  alternative: “ihuhugpong silang muli” sa unang sugnay
  rationale: Ang πάλιν (“muli”) ay tahasang nasa ikalawang sugnay lamang. Pinananatili ng salin ang pagkakaayos at diin ng Griyego nang hindi nawawala ang diwa ng panunumbalik.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ihugpong” upang mapanatili ang talinghaga ng paghuhugpong ng sanga sa punong olibo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
