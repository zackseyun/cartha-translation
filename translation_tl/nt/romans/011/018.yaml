base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: tl
  text: Huwag kang magmalaki laban sa mga sanga.[a] Ngunit kung nagmamalaki ka, hindi ikaw ang sumusuporta sa ugat, kundi ang ugat ang sumusuporta sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kang magyabang laban sa mga sanga.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi ikaw ang pumapasan sa ugat, kundi ang ugat ang pumapasan sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: magyabang laban sa / nagmamalaki
  rationale: Ipinahahayag ng pandiwa ang pagyayabang laban sa iba o ang pagmamataas sa kanila. Natural sa modernong Filipino ang “magyabang laban sa mga sanga,” samantalang ang “kung nagmamalaki ka” ay maayos na naghahatid sa kondisyunal na ikalawang paggamit nang hindi mabigat ang pag-uulit.
- source_word: κλάδων
  choice: mga sanga
  rationale: Pinananatili ang tiyak na mga sanga sa talinghaga ng punong olibo na binuo sa nakapaligid na konteksto.
- source_word: ῥίζαν / ῥίζα
  choice: ugat
  rationale: Parehong salin sa dalawang paglitaw upang mapanatili ang larawan ng ugat bilang pinagmumulan at sumusuporta.
- source_word: βαστάζεις
  choice: sumusuporta
  rationale: Sa talinghaga, ang diwa ay pagpasan na nagbibigay-buhay at suporta, hindi lamang literal na pagdadala. Malinaw at natural ang “sumusuporta” sa kasalukuyang Filipino.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: hindi ikaw ang sumusuporta sa ugat, kundi ang ugat ang sumusuporta sa iyo
  rationale: Pinananatili ng ayos na ito ang mariing paghahambing sa “ikaw” at “ugat,” pati ang pagbabaligtad ng inaakalang pag-asa o pagsandig.
- source_word: μὴ
  choice: Huwag kang
  rationale: Natural na tuwirang pagbabawal sa Filipino, nang hindi labis na binibigyang-kahulugan ang aspekto ng pangkasalukuyang pautos.
theological_decisions:
- issue: Metaporikal na puwersa ng ugat at mga sanga sa larawan ni Pablo ng punong olibo
  choice: Panatilihing lantad ang talinghaga nang hindi tinutukoy sa pangunahing teksto kung sino o ano mismo ang ugat at mga sanga.
  alternative: Tukuyin sa salin ang ugat bilang mga patriyarka, si Abraham, o ang mga pangako ng tipan.
  rationale: Inilalahad ng Griyegong teksto ang talinghaga nang walang gayong pagpapaliwanag. Ang tahasang pagtukoy sa ugat ay magpapasok ng interpretasyon at mag-aalis sa teolohikal na pagiging bukas ng pahayag sa konteksto.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang isahang “ka/ikaw/iyo” ayon sa Griyegong ikalawang panauhang isahan. Pinanatili ang talinghaga at mariing kaibahan ng sugnay.
