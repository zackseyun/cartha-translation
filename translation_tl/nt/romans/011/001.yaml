  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: tl
  text: 'Kaya itinatanong ko: Itinakwil ba ng Diyos ang kanyang bayan?[a] Hinding-hindi![b] Sapagkat ako mismo ay isang Israelita, mula sa lahi ni Abraham[c], sa lipi ni Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “itinaboy” o “tinalikuran ang kanyang bayan.”
    reason: lexical_alternative
  - marker: b
    text: 'Griyego: “Huwag nawang mangyari iyon!” Isang napakadiing pananalita ng pagtanggi; maaari ring isalin na “Hindi kailanman!”'
    reason: lexical_alternative
  - marker: c
    text: 'Literal: “mula sa binhi ni Abraham,” ibig sabihin, mula sa kanyang mga inapo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Kaya itinatanong ko
  rationale: Ipinakikilala ng λέγω ang isang retorikal na tanong, habang ipinahihiwatig ng οὖν ang kaugnayan nito sa naunang argumento. Natural sa makabagong Tagalog ang “Kaya itinatanong ko.”
- source_word: μὴ ἀπώσατο
  choice: Itinakwil ba
  rationale: Ang ἀπωθέομαι ay tumutukoy sa pagtatakwil o pagtataboy. Ang tanong na may μή ay umaasang negatibo ang sagot, ngunit hindi iyon idinagdag nang tahasan sa salin.
- source_word: ὁ θεὸς
  choice: Diyos
  rationale: Karaniwan at malinaw na katumbas ng θεός.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ang kanyang bayan
  rationale: Pinananatili ng “bayan” ang sama-sama at tipanang diwa ng λαός, at malinaw na isinasalin ng “kanyang” ang αὐτοῦ.
- source_word: μὴ γένοιτο
  choice: Hinding-hindi!
  rationale: Isang napakalakas na pagtanggi ang pariralang ito. Ang “Hinding-hindi!” ay natural, mariin, at madaling maunawaan sa kasalukuyang Tagalog.
- source_word: καὶ γὰρ ἐγὼ
  choice: Sapagkat ako mismo
  rationale: Ipinapakita ng γάρ ang dahilan at ng tahasang ἐγώ ang pagbibigay-diin kay Pablo bilang patunay sa kanyang sinasabi.
- source_word: Ἰσραηλίτης
  choice: isang Israelita
  rationale: Tuwirang katawagang etniko at tipanan na natural sa Tagalog.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: mula sa lahi ni Abraham
  rationale: Literal na “binhi” ang σπέρμα, ngunit sa kontekstong angkan o pinagmulan, mas natural at malinaw sa Tagalog ang “lahi” habang pinananatili ang diwa ng pagiging inapo.
- source_word: φυλῆς Βενιαμίν
  choice: sa lipi ni Benjamin
  rationale: Ang φυλή ay “lipi” o “tribo.” Ang “lipi ni Benjamin” ay likas at pamilyar na pahayag para sa pangkat na nagmula sa isang ninuno.
theological_decisions:
- issue: Kung ipinahihiwatig ba ng tanong ang ganap o panghabang-panahong pagtatakwil sa Israel
  choice: Itinakwil ba ng Diyos ang kanyang bayan?
  alternative: Itinakwil na ba ng Diyos nang lubusan/magpakailanman ang kanyang bayan?
  rationale: Walang katumbas sa Griyego ang “nang lubusan” o “magpakailanman.” Pinananatili ng salin ang saklaw ng tanong na bukas upang ang kasunod na konteksto ang magpaliwanag nito.
- issue: Lakas at anyo ng pagtangging μὴ γένοιτο
  choice: Hinding-hindi!
  alternative: Huwag nawang mangyari iyon!
  rationale: Pinananatili ang matinding pagtutol ni Pablo nang hindi ginagawang simpleng “Hindi.” Nasa talababa ang mas malapit-sa-anyo na alternatibo upang hindi mawala ang natatanging Griyegong pananalita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “bayan,” “lahi,” at “lipi” ay pamilyar sa ordinaryong mambabasa at angkop sa kontekstong biblikal. Iniwasan ang pagdaragdag ng mga salitang “lubusan” o “magpakailanman,” na wala sa Griyego.
