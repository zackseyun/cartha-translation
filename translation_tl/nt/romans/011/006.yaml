  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: tl
  text: Ngunit kung ito'y sa pamamagitan ng biyaya, hindi na ito bunga ng mga gawa; kung hindi, hindi na nagiging biyaya ang biyaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: sa pamamagitan ng biyaya
  rationale: 'Ipinahahayag ang instrumental na diwa ng datibo: ang pagpili ay sa bisa ng biyaya.'
- source_word: ἐξ ἔργων
  choice: batay sa mga gawa
  rationale: Natural na Filipino para sa pinagmulan o batayan; pinananatili ang pagsalungat ng biyaya at mga gawa.
- source_word: γίνεται
  choice: nagiging
  rationale: Pinananatili ang tahasang pandiwang 'becomes' sa tekstong Griyego at ang lohikal na diin na mawawala ang katangian ng biyaya bilang biyaya.
theological_decisions:
- issue: Ugnayan ng biyaya at mga gawa bilang batayan ng pagpili
  choice: Pinanatiling magkasalungat ang biyaya at mga gawa nang hindi dinaragdagan ang saklaw ng pahayag.
  alternative: Ipaliwanag ito bilang pangkalahatang pahayag tungkol sa lahat ng aspekto ng kaligtasan.
  rationale: Ang agarang konteksto ay ang natitirang pinili ayon sa biyaya; hindi dapat magpasok ang salin ng higit sa sinasabi ng talata.
- issue: Puwersa ng γίνεται
  choice: hindi na nagiging biyaya
  alternative: hindi na biyaya
  rationale: Ang mas buong anyo ay tapat sa pandiwa ng SBLGNT at sa ibinigay na audited English consultation layer.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'batay sa mga gawa' sa halip na mas literal ngunit di-likas na 'mula sa mga gawa.'
