id: ROM.11.9
reference: Romans 11:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: tl
  text: At sinasabi ni David, “Maging bitag at silo[a], katitisuran, at ganti[b] sa kanila ang kanilang hapag,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bitag” at “silo” ay magkalapit na mga salitang tumutukoy sa mga gamit sa panghuhuli.
    reason: lexical_alternative
  - marker: b
    text: O “kabayaran” o “ganting kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: David
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Filipino.
- source_word: λέγει
  choice: sinasabi
  rationale: Pinananatili ang pangkasalukuyang panahong pampanitikan na nagpapakilala sa sipi.
- source_word: Γενηθήτω
  choice: Maging
  rationale: Likas at tuwirang ipinahahayag sa Filipino ang pautos o paghiling na puwersa ng aorist imperative nang hindi ito ginagawang simpleng hula.
- source_word: τράπεζα
  choice: hapag
  rationale: Pinananatili ang kongkretong larawan ng mesa o hapag, na maaari ring magpahiwatig ng pagkain at kasaganaan sa konteksto ng Awit.
- source_word: παγίδα
  choice: bitag
  rationale: Karaniwang salitang Filipino para sa patibong at malinaw na naihihiwalay sa kasunod na θήραν.
- source_word: θήραν
  choice: silo
  rationale: Ipinakikita ang larawang panghuhuli at pinananatili ang magkalapit ngunit magkahiwalay na mga termino.
- source_word: σκάνδαλον
  choice: katitisuran
  rationale: Pinananatili ang metapora ng isang bagay na nagiging sanhi ng pagkadapa o pagbagsak, hindi lamang ng pagkayamot.
- source_word: ἀνταπόδομα
  choice: ganti
  rationale: Likas sa modernong Filipino at angkop sa diwang maparusang pagganti, habang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Likas na katumbas ng datibo at malinaw na ipinakikita kung kanino dumarating ang ganti.
theological_decisions:
- issue: Ang sipi bilang sumpang panalangin mula sa Awit 69:22
  choice: 'Pinanatili ang tuwirang puwersa ng paghiling: “Maging...”'
  alternative: “Magiging...” o “Nawa’y maging...”
  rationale: Ang Γενηθήτω ay pautos na may puwersa ng paghiling. Ang “Maging” ay hindi nagpapalambot dito bilang hula lamang at pinananatili ang tindi ng sipi.
- issue: Kahulugan ng ἀνταπόδομα
  choice: ganti
  alternative: kabayaran o ganting kabayaran
  rationale: Ipinahihiwatig ng konteksto ang maparusang pagganti, ngunit hindi dinaragdagan ng salin ang isang mas tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “hapag” upang mapanatili ang konkretong larawan at ang “katitisuran” bilang malinaw na metaporang biblikal. Inayos ang ayos ng pangungusap upang maging natural sa Filipino habang nananatiling magkakahanay ang apat na resultang inilalarawan.
