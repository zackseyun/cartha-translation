  source_fidelity: 'Tumpak na naipapahayag ang Griyegong teksto: ang pampanitikang pangkasalukuyan ng «λέγει» (“sinasabi”), ang puwersang pautos/paghiling ng «Γενηθήτω» (“Maging”), at ang apat na magkakahanay na resulta para sa “kanilang hapag.” Napananatili rin ang tuwirang katangian ng sumpang sipi nang hindi ito ginagawang hula lamang.'
  naturalness: Natural at marangal ang ayos sa modernong Filipino Tagalog. Ang paghuhuli ng paksa sa “ang kanilang hapag” ay maayos at nagbibigay-diin sa mga resultang hinihiling. Ang “hapag,” “katitisuran,” at “ganti” ay malinaw at angkop sa rehistrong biblikal nang hindi labis na lipas.
  terminology: Ang “David” ay nakasanayan; ang “bitag” at “silo” ay angkop na magkalapit ngunit magkahiwalay na larawan para sa παγίδα at θήραν; ang “katitisuran” ay tapat sa metapora ng σκάνδαλον; at ang “ganti sa kanila” ay sapat na malawak para sa ἀνταπόδομα αὐτοῖς habang ang kontekstong maparusang puwersa ay nananatiling maliwanag. Wasto ang pagkakaangkla ng talababa [a] sa pares na “bitag at silo” at [b] sa “ganti.”
