  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: tl
  text: O, kay lalim ng kayamanan, karunungan, at kaalaman ng Diyos![a] Gaano di-masaliksik ang kanyang mga hatol, at gaano di-matunton ang kanyang mga daan![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “O, kay lalim ng kayamanan ng karunungan at kaalaman ng Diyos!” Pinahihintulutan ng ayos ng Griyego ang mas mahigpit na kaugnayan ng “kayamanan” sa “karunungan at kaalaman”; sa pangunahing teksto, ang tatlong pangngalan ay kapuwa iniuugnay sa Diyos.'
    reason: alternative_reading
  - marker: b
    text: Ang “di-matunton” ay nagsasalin ng salitang nangangahulugang hindi kayang sundan o bakasin, kaya naiiba ang larawan nito sa “di-masaliksik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: O
  rationale: Isang pantandang padamdam na nagpapahayag ng paghanga. Ang “O” ay maikli, marangal, at angkop sa biglang pagsambulat ng papuri.
- source_word: βάθος
  choice: lalim
  rationale: Pinananatili ang metapora ng di-masukat na kalaliman ng mga katangian ng Diyos.
- source_word: πλούτου
  choice: kayamanan
  rationale: Ipinahahayag ang sagana at napakalawak na yaman ng Diyos, habang pinananatili ang metapora ng orihinal.
- source_word: σοφίας
  choice: karunungan
  rationale: Karaniwang katumbas ng σοφία at tumutukoy sa ganap na karunungan ng Diyos sa kanyang layunin at pagkilos.
- source_word: γνώσεως
  choice: kaalaman
  rationale: Pinananatiling bukod sa “karunungan” upang hindi pag-isahin ang dalawang magkaibang pangngalan sa Griyego.
- source_word: θεοῦ
  choice: ng Diyos
  rationale: 'Likas na anyong Tagalog na maaaring iugnay sa tatlong magkakasunod na pangngalan: kayamanan, karunungan, at kaalaman.'
- source_word: ὡς
  choice: Hindi ...!
  rationale: Ang puwersang padamdam ng ὡς ay naihahayag sa buong hulma at bantas ng pangungusap; mas natural ito sa Tagalog kaysa sa literal na “Gaano...” sa ganitong ayos.
- source_word: ἀνεξεραύνητα
  choice: hindi masaliksik
  rationale: Ipinahahayag na ang mga hatol ng Diyos ay hindi lubos na kayang siyasatin o maunawaan.
- source_word: κρίματα
  choice: mga hatol
  rationale: Pinananatili ang malawak na diwa ng mga paghatol, pagpapasya, at pagtatalaga ng Diyos nang hindi ito nililimitahan sa pormal na mga utos.
- source_word: ἀνεξιχνίαστοι
  choice: hindi matunton
  rationale: Pinananatili ang larawan ng isang bakas o landas na hindi kayang sundan, at iniiba ito sa “hindi masaliksik.”
- source_word: ὁδοὶ
  choice: mga daan
  rationale: Pinananatili ang biblikal na metapora para sa paraan at takbo ng pagkilos ng Diyos.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Malinaw na tumutukoy pabalik sa Diyos at pinananatili ang pag-uulit ng pag-aari sa ikalawang bahagi.
theological_decisions:
- issue: Kaugnayan ng “ng Diyos” sa kayamanan, karunungan, at kaalaman
  choice: Iniuugnay ang “ng Diyos” sa lahat ng tatlong pangngalan.
  alternative: “Ang lalim ng kayamanan ng karunungan at kaalaman ng Diyos,” na mas mahigpit na nag-uugnay sa “kayamanan” sa sumunod na pares.
  rationale: Maaaring tanggapin ng sintaks ng Griyego ang dalawang pagbasa. Pinili sa pangunahing teksto ang likas na pagbasa bilang tatlong magkakatabing katangian o pag-aari ng Diyos, habang itinatala ang alternatibo sa talababa.
- issue: Pagkilala sa pagkakaiba ng ἀνεξεραύνητα at ἀνεξιχνίαστοι
  choice: “hindi masaliksik” at “hindi matunton”
  alternative: Gumamit ng halos magkaparehong salita, gaya ng “di-maarok” para sa dalawa.
  rationale: Magkaugnay ngunit magkaiba ang dalawang salitang Griyego. Pinananatili ng salin ang pagkakaiba nang hindi ginagawang teknikal na doktrinal na pagtatangi.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinananatili ang maikling padamdam, ang tatluhang retorikal na ayos, at ang magkaibang larawan ng pagsasaliksik at pagtunton.
