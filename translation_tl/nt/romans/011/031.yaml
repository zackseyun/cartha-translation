base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: tl
  text: Gayundin naman, ang mga ito ngayon ay sumuway, upang sa pamamagitan ng habag na ipinakita sa inyo[a] ay pagpakitaan din sila ngayon ng habag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa pamamagitan ng inyong habag.” Maaaring unawain nang mas literal sa ganitong paraan ang pariralang Griyego, ngunit sa konteksto ay malamang na tumutukoy ito sa habag na ipinakita ng Diyos sa inyo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Gayon din naman
  rationale: Likas na Filipino na naghahayag ng paghahambing at pagpapatuloy mula sa naunang pahayag.
- source_word: οὗτοι
  choice: ang mga ito
  rationale: Pinananatili ang demonstratibong pagtukoy sa Israel sa konteksto, sa halip na gawing karaniwang panghalip lamang.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang panahong diin sa kasalukuyang yugto ng pangangatwiran ni Pablo.
- source_word: ἠπείθησαν
  choice: ay naging masuwayin
  rationale: Sinasaklaw ng “masuwayin” ang diwa ng hindi pagsunod at hindi paniniwala nang hindi nililimitahan sa intelektuwal na kawalan ng pananampalataya lamang.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: sa pamamagitan ng habag na ipinakita sa inyo
  rationale: Ipinahihiwatig ng konteksto na ito ang habag ng Diyos na tinanggap ng mga kausap, habang kinikilala sa talababa ang mas literal na posibilidad na “sa pamamagitan ng inyong habag.”
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at likas na naghahayag ng layunin o kinalabasan.
- source_word: καὶ αὐτοὶ
  choice: ay tumanggap din sila
  rationale: Pinananatili ang mariing pagsasama sa kanila bilang mga tatanggap din ng habag.
- source_word: νῦν
  choice: ngayon
  rationale: Pinananatili ang ikalawang νῦν at ang pagdiin nito sa kasalukuyang panahon.
- source_word: ἐλεηθῶσιν
  choice: tumanggap ... ng habag
  rationale: Likas sa modernong Filipino at malinaw na ang habag ay ipinagkakaloob, habang hindi nagiging matigas ang pasibong anyo.
theological_decisions:
- issue: Kung ang “inyong habag” ay habag na ipinakita ng mga mananampalatayang Hentil o habag ng Diyos na ipinakita sa kanila
  choice: habag na ipinakita sa inyo
  alternative: sa pamamagitan ng inyong habag
  rationale: Sa Roma 11:30–32, ang magkabilang pangkat ay inilalarawang masuwayin at pagkatapos ay tumatanggap ng habag ng Diyos. Gayunman, dahil maaaring unawain nang mas literal ang datibong parirala bilang “inyong habag,” pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “habag” para sa ἔλεος at “masuwayin” para mapanatili ang malawak na diwa ng ἀπειθέω. Ang talababa ay minarkahan sa mismong teksto bilang [a].
