  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: tl
  text: Sapagkat sino ang nakaalam sa kaisipan ng Panginoon? O sino ang naging tagapayo niya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ipinapaalingawngaw ni Pablo ang Isaias 40:13, kung saan itinatanong din sa tekstong Griyego kung sino ang nakaalam sa kaisipan ng Panginoon o naging tagapayo niya.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: sino
  rationale: Likas at tuwirang panghalip na pananong sa Filipino; pinananatili ang puwersa ng retorikal na tanong.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinapakita ang paliwanag o batayan ng talata para sa naunang pahayag sa argumento ni Pablo.
- source_word: ἔγνω
  choice: nakaalam
  rationale: Tuwirang ipinapahayag ang pagkakilala o pagkaalam nang hindi dinaragdagan ng mas makitid na diwang 'nakaunawa.'
- source_word: νοῦν
  choice: kaisipan
  rationale: Saklaw nito ang isip, balak, at pag-unawa; natural itong katumbas sa pariralang 'kaisipan ng Panginoon.'
- source_word: κυρίου
  choice: Panginoon
  rationale: Karaniwang salin ng κύριος at pinananatili ang anyo ng sipi ni Pablo mula sa tekstong Griyego ng Isaias.
- source_word: ἢ
  choice: O
  rationale: Pinananatili ang paghihiwalay at paralelismo ng ikalawang retorikal na tanong.
- source_word: σύμβουλος
  choice: tagapayo
  rationale: Natural at dignidadong modernong Filipino para sa isang nagbibigay ng payo.
- source_word: αὐτοῦ
  choice: niya
  rationale: Natural na panghalip na paari sa Filipino, na tumutukoy sa Panginoon.
- source_word: ἐγένετο
  choice: naging
  rationale: Tuwirang katumbas ng 'naging' o 'dumating sa kalagayan bilang,' at ang aspektong perpektibo ay angkop sa retorikal na tanong.
theological_decisions:
- issue: Ang tinutukoy ng “Panginoon” sa siping hinango sa Isaias
  choice: Isinaling “Panginoon” nang hindi higit na nililimitahan ang tinutukoy kaysa sa tekstong Griyego.
  alternative: Gamitin ang anyong tahasang kumakatawan sa banal na pangalan sa pinagmulan nitong Isaias.
  rationale: κυρίου ang nasa tekstong Griyego. Pinananatili ng salin ang anyo ng Bagong Tipan at ang diin sa di-maarok na karunungan ng Diyos, nang hindi ipinapasok sa pangunahing teksto ang isang mas tiyak na anyong wala rito.
translation_notes:
  register: Modernong Filipino na malinaw, dignidad, at bahagyang mataas ang himig upang mapanatili ang anyo ng siping kasulatan. Ginamit ang “kaisipan” at “tagapayo” bilang natural ngunit tapat na mga katumbas.
