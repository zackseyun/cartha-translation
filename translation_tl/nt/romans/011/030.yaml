id: ROM.11.30
reference: Romans 11:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: tl
  text: Sapagkat kung paanong kayo noon ay sumuway sa Diyos[a], ngunit ngayon ay kinaawaan kayo dahil sa pagsuway nila,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sumuway” at “pagsuway” ay maaari ring isaling “hindi naniwala” at “kawalan ng pananampalataya”; maaaring taglayin ng mga salitang Griyego ang dalawang diwang ito sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Sapagkat kung paanong
  rationale: Pinananatili ng “sapagkat” ang paliwanag na ugnayan ng γάρ at ng “kung paanong” ang paghahambing na ipinakikilala ng ὥσπερ, na nagpapatuloy sa kasunod na talata.
- source_word: ὑμεῖς
  choice: kayo
  rationale: Tahasang ikalawang panauhang maramihan ito. Hindi idinagdag ang “mga Hentil” upang hindi ipasok sa mismong talata ang pagkakakilanlang nalalaman lamang mula sa konteksto.
- source_word: ποτε
  choice: noon
  rationale: Likas na ipinapakita ng “noon” ang dating kalagayan at malinaw itong itinatambal sa νῦν, “ngayon.”
- source_word: ἠπειθήσατε
  choice: sumuway
  rationale: Maaaring tumukoy ang ἀπειθέω sa pagsuway o hindi paniniwala. Pinananatili ng “sumuway” ang moral at relasyonal na diwa ng pagtanggi sa Diyos at ang ugnayang leksikal nito sa ἀπείθεια sa huling bahagi.
- source_word: τῷ θεῷ
  choice: sa Diyos
  rationale: Likas na Tagalog na katumbas ng datibong layon ng ἀπειθέω.
- source_word: νῦν δὲ
  choice: ngunit ngayon
  rationale: Malinaw nitong pinananatili ang matinding pagsalungat ng dating pagsuway at ng kasalukuyang pagtanggap ng awa.
- source_word: ἠλεήθητε
  choice: kinaawaan kayo
  rationale: Pinananatili nito ang balintiyak na anyo ng pandiwa at ang Diyos bilang di-binanggit ngunit nauunawaang tagapagkaloob ng awa.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: dahil sa pagsuway nila
  rationale: Ang datibo ay maaaring maunawaang sanhi o paraan. Ang “dahil sa” ay malinaw at likas sa Tagalog nang hindi lubhang ipinipilit ang mekanismo; ang “nila” ay tumutukoy sa mga Israelitang kasalukuyang sumusuway ayon sa konteksto.
theological_decisions:
- issue: Diwa ng ἀπειθέω / ἀπείθεια sa konteksto ng pagliligtas sa Roma 11
  choice: sumuway / pagsuway
  alternative: hindi naniwala / kawalan ng pananampalataya
  rationale: Magkasanib ang mga diwa ng hindi paniniwala at pagsuway sa mga salitang Griyego. Ang “sumuway / pagsuway” ay nagpapanatili sa pagkakatugma ng pandiwa at pangngalan at hindi nililimitahan ang pahayag sa intelektuwal na hindi paniniwala lamang; inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang hindi pa tapos na paghahambing sa hulihan sapagkat nagpapatuloy ang pangungusap sa Roma 11:31. Ginamit ang “kinaawaan kayo” upang mapanatili ang balintiyak na tinig nang natural sa Tagalog.
