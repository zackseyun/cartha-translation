    issue: Ang “gaano pa kaya kadaling” ay maling pagsasalin ng πόσῳ μᾶλλον.
    rationale: Ang Griyegong parirala ay nagpapahayag ng “how much more/lalo pa,” hindi na ang paghuhugpong ay mas madali. Maaaring magpahiwatig ang “kadaling” ng diwang wala sa teksto.
  - severity: low
    issue: Ang “inaalagaan” ay mas maluwag kaysa καλλιέλαιον.
    rationale: Ang kaibhan ay sa ligaw at nilinang/cultivated na olibo. Ang “punong olibong nilinang” ay mas eksakto at nananatiling natural sa Filipino.
