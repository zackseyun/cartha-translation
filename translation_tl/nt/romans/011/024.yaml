id: ROM.11.24
reference: Romans 11:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: tl
  text: Sapagkat kung ikaw ay pinutol mula sa punong olibong likas na ligaw at, salungat sa kalikasan, ay inihugpong sa isang punong olibong nilinang, lalo pa ngang maihuhugpong ang mga ito—ang likas na mga sanga[a]—sa sarili nilang punong olibo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “ang mga ito na ayon sa kalikasan”; ang “mga sanga” ay ipinahiwatig ng talinghaga tungkol sa punong olibo sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maihugpong muli sa sarili nilang punong olibo.” Ipinahihiwatig ng konteksto ang pagbabalik, bagaman walang tahasang salitang “muli” sa pandiwang Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: pinutol
  rationale: Tuwirang ipinapahayag ang pagputol mula sa puno at pinananatili ang larawang hortikultural; hindi ginamit ang 'binali' sapagkat pagputol ang pangunahing diwa ng pandiwa rito.
- source_word: ἀγριελαίου
  choice: punong olibong ligaw
  rationale: Malinaw na tumutukoy sa ligaw na uri ng punong olibo at natural ang kaayusan sa modernong Filipino.
- source_word: παρὰ φύσιν
  choice: salungat sa kalikasan
  rationale: Pinananatili ang tahasang pagsalungat sa κατὰ φύσιν at ang retorikal na diin ni Pablo.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: inihugpong / maihugpong
  rationale: Ang 'ihugpong' ang angkop na terminong Filipino para sa hortikultural na grafting; pinananatili rin ang tinig na balintiyak ng Griyego.
- source_word: καλλιέλαιον
  choice: punong olibong inaalagaan
  rationale: Ipinahihiwatig ang cultivated o domesticated na olibo nang hindi gumagamit ng evaluative na 'mabuting olibo.'
- source_word: πόσῳ μᾶλλον
  choice: gaano pa kaya kadaling
  rationale: Natural na Filipino para sa a fortiori na paghahambing at ipinakikita na lalo itong maaasahang mangyari sa mga sangang likas na nauukol sa puno.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: ang mga ito—ang likas na mga sanga
  rationale: Ipinapasok ang 'mga sanga' mula sa malinaw na talinghaga sa konteksto, habang hindi tuwirang pinapangalanan bilang mga Judio o Israelita ang tinutukoy.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: sa sarili nilang punong olibo
  rationale: Pinananatili ang diin ng ἰδίᾳ sa likas at sariling kaugnayan nila sa puno.
theological_decisions:
- issue: Kung tahasang tatawaging Israel o mga Judio ang 'mga ito'
  choice: Panatilihin ang di-tahasang pagtukoy bilang 'ang mga ito—ang likas na mga sanga.'
  alternative: ang mga Israelitang ito / ang mga Judiong ito
  rationale: Bagaman malinaw sa mas malawak na konteksto na Israel ang tinutukoy, hindi gumagamit ang talata ng tahasang katawagang etniko; pinananatili ng salin ang mismong talinghaga.
- issue: Kung idaragdag ang diwang 'muli' sa huling paghuhugpong
  choice: Hindi idagdag ang 'muli' sa pangunahing teksto.
  alternative: maihugpong muli sa sarili nilang punong olibo
  rationale: Ipinahihiwatig ng konteksto ang pagbabalik, ngunit hindi tahasang nasa pandiwang ἐγκεντρισθήσονται ang kahulugang 'muli.'
- issue: Kung ilalagay ang 'mga sanga' na hindi tahasang inuulit sa Griyego
  choice: Idagdag ang 'mga sanga' para maging malinaw ang talinghaga.
  alternative: ang mga ito na likas
  rationale: Malinaw na ipinagpapatuloy ng parirala ang talinghaga ng mga sanga at punong olibo sa konteksto; kailangan din ito para sa natural at malinaw na Filipino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang terminong hortikultural na 'ihugpong,' pinanatili ang pagtutulad ng ligaw at inaalagaang punong olibo, at iniwasang gawing tahasan ang etnikong referent na hindi tahasang pinangalanan sa talata.
