source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: tl
  text: 'Kaya pag-isipan mo ang kabutihan at kahigpitan ng Diyos: kahigpitan sa mga nabuwal, ngunit kabutihan ng Diyos sa iyo, kung magpapatuloy ka sa kanyang kabutihan; kung hindi, puputulin ka rin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapuputol ka rin.” Ang pandiwang Griyego ay literal na nangangahulugang “puputulin”; sa larawan ng punong olibo sa nakapaligid na talata, tumutukoy ito sa pagputol ng isang sanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: pag-isipan mo
  rationale: Isang pautos na humihiling ng masusing pansin at pagninilay; natural ito sa makabagong Tagalog at higit na naipapahayag ang diwa kaysa sa literal na “tingnan mo.”
- source_word: χρηστότητα / χρηστότης
  choice: kabutihan
  rationale: Maaaring tumukoy sa kabutihan, kagandahang-loob, o kabaitan ng Diyos. Pinili ang “kabutihan” dahil natural itong nauulit sa talata at malinaw na naihahambing sa “kahigpitan,” habang hindi nililimitahan ang saklaw sa damdaming mabait lamang.
- source_word: ἀποτομίαν / ἀποτομία
  choice: kahigpitan
  rationale: Ipinahihiwatig ng salita ang matalim at tiyak na paghatol. Ang “kahigpitan” ay dignified at malinaw na Tagalog nang hindi nagpapasobra sa kahulugan.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: sa mga nabuwal
  rationale: Pinananatili ang pagtukoy sa mga bumagsak mula sa kanilang kalagayan sa talinghaga ng punong olibo; ang “nabuwal” ay maikli at angkop sa metaporikal na konteksto.
- source_word: ἐπὶ δὲ σὲ
  choice: sa iyo
  rationale: Natural na ipinapahayag ang magkatapat na direksiyon o pagtukoy ng kahigpitan at kabutihan.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: kung magpapatuloy ka sa kanyang kabutihan
  rationale: Pinananatili ang tuwirang kondisyon at ang ideya ng patuloy na pananatili sa saklaw ng kabutihan ng Diyos. Ang “kanyang” ay nilinaw mula sa agarang konteksto.
- source_word: ἐπεὶ
  choice: kung hindi
  rationale: Sa kontekstong ito, ipinakikilala nito ang kabaligtarang kahihinatnan kapag hindi natupad ang kondisyon; “kung hindi” ang pinakanatural na Tagalog.
- source_word: ἐκκοπήσῃ
  choice: puputulin ka rin
  rationale: Tuwirang sinasalamin ang future passive na “ikaw rin ay puputulin,” at pinananatili ang larawan ng pagputol ng sanga sa talinghaga ng punong olibo.
theological_decisions:
- issue: Kondisyonal na babala kaugnay ng kabutihan at paghatol ng Diyos
  choice: 'Pinanatili ang tuwirang kondisyon: tatanggapin ng kausap ang kabutihan ng Diyos kung magpapatuloy siya rito; kung hindi, puputulin din siya.'
  alternative: Palambutin ang babala bilang retorikal lamang, o ipakahulugan ito ayon sa isang tiyak na doktrina tungkol sa pagtitiyaga, pagtalikod, o kung indibidwal ba o pangkatan ang tinutukoy.
  rationale: Ang Griyego ay naghaharap ng tunay na kondisyon at babala ngunit hindi nito nilulutas ang mga kasunod na teolohikal na pagtatalo. Kaya pinananatili ang tensiyon nang walang idinadagdag na denominasyonal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahan na “mo/iyo/ka” sapagkat isahan ang mga panghalip at pandiwa sa Griyego. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
