id: ROM.11.2
reference: Romans 11:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: tl
  text: Hindi itinakwil ng Diyos ang kanyang bayan, na una pa niyang nakilala.[a] O hindi ba ninyo alam ang sinasabi ng Kasulatan sa bahagi tungkol kay Elias—kung paano siya dumudulog sa Diyos laban sa Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “una pa niyang nakilala” ay maaari ring isaling “nakilala na niya noong una.” Itinuturing ito ng ilan na nagpapahiwatig ng naunang pagpili o natatanging pag-ibig, ngunit hindi iyon tahasang idinagdag sa salin.
    reason: alternative_reading
  - marker: b
    text: O “kung paano siya nagsusumamo sa Diyos laban sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: itinakwil
  rationale: Malinaw at likas na salin ng pagtanggi o pagtataboy; ang aspektong aorist ay angkop ipahayag dito bilang tiyak na pagkilos na itinatanggi.
- source_word: λαὸν αὐτοῦ
  choice: ang kanyang bayan
  rationale: Pinananatili ang tipanang diwa ng λαός nang hindi idinaragdag ang 'Israel' sa unang sugnay.
- source_word: προέγνω
  choice: una pa niyang nakilala
  rationale: Isinasalin ang pangunahing leksikal na diwa ng πρό + γινώσκω bilang pagkilala nang una, habang hindi ipinapasok sa teksto ang mas tiyak na interpretasyong 'pinili nang una.'
- source_word: ἢ οὐκ οἴδατε
  choice: O hindi ba ninyo alam
  rationale: Likas na makabagong Tagalog para sa retorikal na tanong ni Pablo.
- source_word: ἐν Ἠλίᾳ
  choice: sa bahagi tungkol kay Elias
  rationale: Ipinahahayag ang idyomatikong pagtukoy sa seksiyon ng Kasulatan tungkol kay Elias, sa halip na literal ngunit malabong 'kay Elias.'
- source_word: ἡ γραφή
  choice: ang Kasulatan
  rationale: Karaniwan at marangal na katawagan sa banal na Kasulatan sa kontekstong Paulino.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: kung paano siya dumudulog sa Diyos
  rationale: Ang 'dumudulog' ay sumasaklaw sa paglapit na may pakiusap o kahilingan at hindi nagpapahiwatig ng positibong pamamagitan, yamang laban sa Israel ang kanyang hinaing.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: laban sa Israel
  rationale: Tuwirang pinananatili ang adversatibong kahulugan ng κατά na may genitive.
theological_decisions:
- issue: Kahulugan ng προέγνω kaugnay ng banal na pagpili
  choice: una pa niyang nakilala
  alternative: pinili na niya nang una / minahal na niya nang una
  rationale: Pinananatili ng salin ang leksikal at teolohikal na tensiyon ng pandiwa at hindi nagpapasya para sa isang partikular na doktrina ng eleksiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'Elias,' ang nakaugaliang anyong Tagalog ng Elijah. Ang 'dumudulog' ay pormal ngunit madaling maunawaan, at akma sa pakiusap na laban sa Israel.
