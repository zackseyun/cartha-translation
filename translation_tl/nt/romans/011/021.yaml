    text: O “ang mga sangang ayon sa likas na kalagayan.”
    reason: Ipinakikita ang mas literal na anyo ng κατὰ φύσιν (“ayon sa kalikasan/likas na kalagayan”) habang pinananatili sa pangunahing teksto ang natural na Filipino na “mga likas na sanga.”
  revision_rationale: Pinalitan ang «pinangalagaan» ng «pinagbigyan» upang maipahayag ang pandiwang φείδομαι bilang hindi pag-iwas na mahatulan o mapinsala, hindi bilang pag-aalaga. Pinanatili ang argumentatibong «Sapagkat kung,» ang talinghaga, ang isahang kausap, ang hinaharap na babala, at ang magkaparis na pandiwa. Walang idinagdag na interpretasyon tungkol sa Israel o sa saklaw na teolohikal ng babala.
