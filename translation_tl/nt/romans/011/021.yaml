  verdict: revise
  source_fidelity: Ang pangunahing suliranin ay ang «pinangalagaan.» Ang φείδομαι ay ‘magpatawad/magpaligtas sa kapinsalaan’ o ‘magbigay-laya,’ hindi karaniwang ‘alagaan’ o ‘pangalagaan.’ Sa talinghaga, ang huling pandiwa ay maaaring magmungkahi na inalagaan ng Diyos ang mga sanga sa halip na hindi niya sila pinagbigyan. Ang «pinagbigyan» ay mas malapit sa puwersa ng ‘spare’ at napapanatili ang magkatulad na pandiwa sa dalawang sugnay. Ang «Sapagkat kung,» ang metaporang «mga likas na sanga,» at ang isahang «ka» ay tapat sa Griyego.
  naturalness: 'Natural at marangal sa makabagong Filipino ang: «Sapagkat kung hindi pinagbigyan ng Diyos ang mga likas na sanga, hindi ka rin niya pagbibigyan.» Mas idiomatiko ang «pinagbigyan» kaysa «pinangalagaan» para sa isang babalang hindi ‘pagpapalampasin’ o hindi pag-iingat sa kapinsalaan.'
  terminology: Ang «Diyos,» «mga likas na sanga,» at «ka» ay angkop. Hindi kailangang tukuyin sa teksto ang Israel, sapagkat metaporikal ang τῶν κατὰ φύσιν κλάδων. Iniwasan din ang «pinatawad,» na sa modernong Filipino ay madaling unawain bilang kapatawaran sa kasalanan at samakatuwid ay masyadong tiyak.
  issues:
  - severity: medium
    issue: Ang «pinangalagaan» ay hindi tumpak na katumbas ng φείδομαι sa talatang ito.
    rationale: Karaniwang tumutukoy ang «pangalagaan» sa pag-aalaga o pagprotekta. Ang φείδομαι rito ay ‘hindi magbigay-laya’ o ‘hindi magligtas sa kapinsalaan,’ gaya ng parallel na ‘neither will he spare you.’
  - severity: low
    issue: Maaaring pasimplehin ang ayos ng pangunahing parirala.
    rationale: Mas likas sa Filipino ang «ang mga likas na sanga» kaysa «ang likas na mga sanga,» bagaman kapwa nauunawaan at hindi nagbabago ang kahulugan.
  revised_text: Sapagkat kung hindi pinagbigyan ng Diyos ang mga likas na sanga[a], hindi ka rin niya pagbibigyan.
