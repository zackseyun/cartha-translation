  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: tl
  text: Sapagkat kung hindi pinagbigyan ng Diyos ang mga likas na sanga[a], hindi ka rin niya pagbibigyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga sangang ayon sa likas na kalagayan.”
    reason: Ipinakikita ang mas literal na anyo ng κατὰ φύσιν (“ayon sa kalikasan/likas na kalagayan”) habang pinananatili sa pangunahing teksto ang natural na Filipino na “mga likas na sanga.”
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Sapagkat kung
  rationale: Pinananatili nito ang kondisyong ipinahihiwatig ng εἰ at ang paliwanag na kaugnayan ng γάρ sa naunang talata.
- source_word: ὁ θεὸς
  choice: ang Diyos
  rationale: Karaniwan at tuwirang salin ng θεός bilang simuno.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: ang likas na mga sanga
  rationale: Likas at malinaw na salin ng pariralang nangangahulugang ‘mga sangang ayon sa kalikasan,’ habang pinananatili ang talinghaga ng punong olibo.
- source_word: οὐκ ἐφείσατο
  choice: hindi pinangalagaan
  rationale: Sa konteksto ng mga sangang maaaring putulin, ipinahahayag nito na hindi sila iniligtas o iningatan mula sa kapahamakan nang hindi idinaragdag sa pangunahing teksto ang tahasang ‘pagputol.’
- source_word: οὐδὲ σοῦ φείσεται
  choice: hindi ka rin niya pangangalagaan
  rationale: Pinananatili ang negatibong pagpapatuloy ng οὐδέ, ang panghinaharap na diwa, at ang isahang kausap na σοῦ sa pamamagitan ng ‘ka.’
theological_decisions:
- issue: Ang tinutukoy ng ‘likas na mga sanga’ sa talinghaga
  choice: Pinanatili ang talinghaga nang hindi tahasang tinukoy ang Israel sa pangunahing teksto.
  alternative: Isalin bilang ‘ang Israel, na siyang likas na mga sanga.’
  rationale: Malinaw sa konteksto na tumutukoy ito sa Israel, ngunit sa talatang ito ay talinghaga ang mismong ginamit ni Pablo; hindi dapat ipalit sa salin ang interpretasyon.
- issue: Lakas at saklaw ng babala sa isahang ‘ikaw’
  choice: Isinalin bilang tuwirang babala sa isahang kausap nang walang idinagdag na paliwanag tungkol sa kaligtasan, pagtalikod, o pagpili.
  alternative: Ipaliwanag sa salin bilang babala lamang sa isang pangkat o bilang pahayag tungkol sa pagkawala ng personal na kaligtasan.
  rationale: Tunay at tuwiran ang babala sa Griyego, ngunit hindi nito sa talatang ito lamang nilulutas ang mas malawak na mga pagtatalong teolohikal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghaga, ang ugnayang ‘sapagkat kung,’ ang magkatulad na pandiwa sa dalawang sugnay, at ang isahang ‘ka.’
