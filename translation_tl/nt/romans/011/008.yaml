id: ROM.11.8
reference: Romans 11:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: tl
  text: 'gaya ng nasusulat: “Binigyan sila ng Diyos ng espiritu ng pagkamanhid[a], mga matang hindi makakita at mga taingang hindi makarinig, hanggang sa mismong araw na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “espiritu ng mahimbing na pagkakatulog.” Umaalingawngaw ang parirala sa Isaias 29:10, ngunit ang salitang Griyego rito ay tumutukoy sa pamamanhid, pagkapurol, o pagkatuliro.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwang pormula sa pagpapakilala ng sipi mula sa Kasulatan; naipapahayag ng “gaya” ang καθώς at nananatiling natural at marangal sa Filipino.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Binigyan sila ng Diyos
  rationale: Tuwirang pinananatili ang Diyos bilang simuno at ang aorist na ἔδωκεν bilang payak na naganap na kilos.
- source_word: πνεῦμα κατανύξεως
  choice: espiritu ng pagkamanhid
  rationale: Ang κατάνυξις ay tumutukoy sa kalagayan ng pamamanhid, pagkapurol, o kawalan ng pagtugon. Ang “pagkamanhid” ay malinaw sa modernong Filipino at naiiwasang gawing tahasang literal na pagtulog ang salita, habang pinananatili ang “espiritu” para sa πνεῦμα.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: mga matang hindi makakita
  rationale: Pinananatili ang maikli at solemne na paralelismo ng sipi. Ang “hindi makakita” ay likas na Filipino at sapat na kumakatawan sa τοῦ μὴ + pawatas nang hindi labis na nilulutas kung layunin o bunga ang diin.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: mga taingang hindi makarinig
  rationale: Tumutugma sa naunang parirala at pinananatili ang pangunahing diwa ng ἀκούω bilang pagdinig, hindi lamang kusang pakikinig.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: hanggang sa mismong araw na ito
  rationale: Ipinakikita ng “mismong” ang diin ng idyomang Griyego at iniuugnay ang sipi sa kasalukuyang tinutukoy ni Pablo.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapatigas o mapanghatol na kawalan ng pagtugon
  choice: Binigyan sila ng Diyos ng espiritu ng pagkamanhid
  alternative: Hinayaan sila ng Diyos na magkaroon ng espiritu ng pagkamanhid
  rationale: Hayagang Diyos ang simuno ng ἔδωκεν. Hindi ito pinalalambot bilang pahintulot lamang, ngunit hindi rin dinaragdagan ng isang sistematikong paliwanag na wala sa talata; pinananatili ang teolohikal na tensiyon ng pahayag.
- issue: Ang puwersa ng τοῦ μὴ + pawatas sa magkaparis na parirala
  choice: mga matang hindi makakita at mga taingang hindi makarinig
  alternative: mga mata upang hindi makakita at mga tainga upang hindi makarinig
  rationale: Maaaring magpahiwatig ng layunin o bunga ang kayariang Griyego. Ang mas siksik na salin ay nagpapanatili ng tunay na kalabuan at ng anyong panipi sa Kasulatan sa halip na ipako ito sa layunin lamang.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang siksik at magkatugmang hulma ng “mga matang hindi makakita” at “mga taingang hindi makarinig,” gayundin ang tuwirang pagkilos ng Diyos sa pangungusap.
