  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: tl
  text: Kung banal ang unang handog, banal din ang buong masa ng minasang harina[a]; at kung banal ang ugat, banal din ang mga sanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong minasa.” Ang salitang Griyego na φύραμα ay tumutukoy sa isang masa o halo ng minasang harina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: unang bahaging handog
  rationale: Pinananatili nito kapwa ang ideya ng unang bahagi at ang kultikong diwa ng bahaging inihahandog sa Diyos. Mas malinaw din ang kaugnayan nito sa buong minasa kaysa sa pangkalahatang “unang handog.”
- source_word: ἁγία
  choice: banal
  rationale: Ang “banal” ang tuwiran at likas na katumbas na nagpapanatili sa biblikal na kategorya at sa paralelismo ng dalawang larawan.
- source_word: φύραμα
  choice: buong minasa
  rationale: Tumutukoy ito sa masa o kumpol ng minasang harina. Ang “buong minasa” ay malinaw sa karaniwang mambabasa at ipinakikita ang ugnayan ng unang bahaging handog sa kabuuan.
- source_word: ῥίζα
  choice: ugat
  rationale: Tuwiran at natural na salin ng botanikal na larawan.
- source_word: κλάδοι
  choice: mga sanga
  rationale: Karaniwang salin na angkop sa larawan ng punong olibo sa kasunod na konteksto.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Kung ... din ...; at kung ... din ...
  rationale: Pinananatili ang maikli at magkatulad na ayos ng Griyego. Inuulit ang “banal” sa Filipino upang maging malinaw at natural ang ipinahihiwatig na panaguri nang hindi nagdaragdag ng interpretasyon.
theological_decisions:
- issue: Uri ng kabanalan ng unang bahaging handog/ugat at ng buong minasa/mga sanga
  choice: Isinalin lamang bilang “banal” nang hindi tinutukoy kung ito ay tipanang, kinatawang, o nagliligtas na kabanalan.
  alternative: “itinalaga sa Diyos” o pagpapakahulugang tumutukoy sa kaligtasan
  rationale: Ipinakikita ng talata ang ugnayan ng kabanalan ng pinagmulan o unang bahagi sa kabuuan, ngunit hindi nito tahasang nililinaw ang eksaktong uri ng kabanalang tinutukoy. Pinananatili ng salin ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “unang bahaging handog” upang maipahayag ang kultikong diwa ng ἀπαρχή at ang bahagi-kabuuang paghahambing; iniwasan ang mas teknikal o denominasyonal na pagpapaliwanag.
