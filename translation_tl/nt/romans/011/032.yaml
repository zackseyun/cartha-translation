base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: tl
  text: Sapagkat ikinulong[a] ng Diyos ang lahat[c] sa pagsuway[b], upang kahabagan niya ang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ipinailalim” o “ikinulong nang magkakasama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pagsuway” ay maaari ring isaling “kawalan ng pananampalataya” sa ilang konteksto, ngunit malamang na mas malawak na pagtangging sumunod ang diwa rito.
    reason: lexical_alternative
  - marker: c
    text: Pinananatili ng pag-uulit ng “lahat” ang pananalita ni Pablo at hindi dapat agad paliitin ang saklaw nito; sa konteksto, magkasamang tinatalakay ang mga Judio at mga Hentil.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: ikinulong
  rationale: Pinananatili nito ang malinaw na talinghaga ng συγκλείω—ang pagsasara o pagkukulong—nang hindi ito nilalabnaw sa mas abstraktong “isinailalim.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Naghuhudyat ang γάρ ng paliwanag sa naunang pangangatuwiran ni Pablo; likas at marangal na pang-ugnay sa Filipino ang “Sapagkat.”
- source_word: τοὺς πάντας
  choice: ang lahat
  rationale: Inuulit ang parehong malawak na parirala sa dalawang sugnay. Pinananatili ng “ang lahat” ang simetriya at saklaw ng Griyego nang hindi agad nililimitahan o pinalalawak ang tinutukoy.
- source_word: εἰς ἀπείθειαν
  choice: sa pagsuway
  rationale: Saklaw ng ἀπείθεια ang pagtangging sumunod at maaari ring tumukoy sa di-paniniwala. Mas napapanatili ng “pagsuway” ang mas malawak na diwa rito.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin o kinalabasan na ipinakikilala ng ἵνα.
- source_word: ἐλεήσῃ
  choice: kahabagan niya
  rationale: Likas na pandiwang Filipino ito para sa aktibong pagpapakita ng awa, at pinananatili nitong Diyos ang gumaganap ng kilos.
theological_decisions:
- issue: Saklaw ng “lahat” sa dalawang sugnay
  choice: Isinalin ang τοὺς πάντας bilang “ang lahat” sa parehong paglitaw.
  alternative: “lahat ng tao,” “bawat isa,” o tahasang “mga Judio at mga Hentil”
  rationale: Inuulit ni Pablo ang parehong malawak na pananalita. Bagaman mga Judio at mga Hentil ang magkasamang tinatalakay sa konteksto, hindi dapat lutasin ng salin ang tensiyon tungkol sa eksaktong saklaw o gawing tahasang pahayag tungkol sa kaligtasan ng bawat indibidwal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “ikinulong” upang mapanatili ang konkretong talinghaga ng Griyego, at “kahabagan niya” upang maging likas ang pagpapahayag nang hindi binabago ang aktibong papel ng Diyos.
