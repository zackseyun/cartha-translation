id: ROM.11.7
reference: Romans 11:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: tl
  text: Kaya, ano ang masasabi natin? Hindi nakamit ng Israel ang hinahanap nito, ngunit nakamit iyon ng mga pinili[a], at ang iba ay pinatigas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang pagpili.” Dito, malamang na tumutukoy ito sa mga taong pinili.
    reason: lexical_alternative
  - marker: b
    text: O “ginawang manhid.” Maaaring tumukoy ang pandiwa sa pagpapatigas o sa pagkawala ng espirituwal na pakiramdam.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Kaya, ano ang masasabi natin?
  rationale: Likas na pormulang retorikal sa modernong Tagalog na nagpapakilala ng bunga ng naunang pangangatwiran.
- source_word: ὃ ἐπιζητεῖ
  choice: ang hinahanap nito
  rationale: Ipinapahayag ang patuloy na paghahangad ng Israel nang natural at malinaw.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Pinanatili ang pangalang pantangi; sa konteksto, tumutukoy ito sa Israel bilang isang sambayanan.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: Hindi nakamit
  rationale: Ang 'nakamit' ay angkop sa bagay na hinahangad at maaari ring ulitin sa kasunod na sugnay upang mapanatili ang pagtutulad at pagsalungat.
- source_word: ἡ δὲ ἐκλογὴ
  choice: ng mga pinili
  rationale: Bagaman literal na 'pagpili,' ginagamit dito ang pangngalan bilang pagtukoy sa mga taong pinili, na itinatapat sa 'ang iba.'
- source_word: ἐπέτυχεν
  choice: nakamit iyon
  rationale: Inulit ang katumbas ng naunang pandiwa upang mapanatili ang retorikal na paralelismo; ang 'iyon' ay tumutukoy sa bagay na hinahanap.
- source_word: οἱ δὲ λοιποὶ
  choice: ang iba
  rationale: Natural na Tagalog para sa mga natitira bukod sa mga pinili.
- source_word: ἐπωρώθησαν
  choice: pinatigas
  rationale: Pinananatili ang metapora at ang balintiyak na tinig nang hindi tinutukoy kung sino ang gumawa.
theological_decisions:
- issue: Kahulugan ng ἡ ἐκλογὴ
  choice: mga pinili
  alternative: ang pagpili
  rationale: Ang pagsalungat sa 'ang iba' ay nagpapahiwatig na mga tao ang tinutukoy, ngunit inilalahad sa talababa ang literal na abstraktong anyo upang mapanatili ang leksikal na posibilidad.
- issue: Tagaganap sa ἐπωρώθησαν
  choice: pinatigas
  alternative: naging manhid
  rationale: Hindi tinutukoy ng balintiyak na pandiwang Griyego ang tagaganap. Hindi ipinapasya ng salin kung Diyos, sila mismo, o kapuwa pananagutan at hatol ang binibigyang-diin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang retorikal na tanong, ang pag-uulit ng 'nakamit,' at ang hindi tinukoy na tagaganap ng balintiyak na pandiwa.
