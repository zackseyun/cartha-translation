  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: tl
  text: Ngunit ano ang sinasabi sa kanya ng tugon ng Diyos?[a] “Nag-iwan ako para sa aking sarili ng pitong libong lalaki,[b] na hindi lumuhod kay Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sagot mula sa Diyos” o “pahayag ng Diyos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Iningatan ko para sa aking sarili ang pitong libong lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: tugon ng Diyos
  rationale: Sa konteksto, tumutukoy ito sa makapangyarihang sagot ng Diyos kay Elias. Likas sa modernong Tagalog ang “tugon ng Diyos” at malinaw nitong ipinapakita ang pinagmulan ng sagot nang hindi gumagamit ng di-pamilyar na “orakulo.”
- source_word: Κατέλιπον
  choice: Nagtira ako
  rationale: Ipinahihiwatig ng pandiwa na may sadyang iniwang nananatili para sa Diyos. Ang “nagtira” ay tuwiran at natural, habang ang alternatibong “inireserba” ay mas teknikal ang dating.
- source_word: ἐμαυτῷ
  choice: para sa aking sarili
  rationale: 'Pinananatili nito ang reflexive na diin: ang pitong libo ay itinira ng Diyos para sa kanya mismo.'
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: pitong libong lalaki
  rationale: Tiyak na panlalaki ang ἄνδρας, kaya pinananatili ang “lalaki” sa halip na gawing pangkalahatang “tao.”
- source_word: οἵτινες
  choice: na
  rationale: Natural na iniuugnay ng “na” ang pitong libong lalaki sa paglalarawang sumusunod, nang hindi labis na binibigyang-diin ang kwalitatibong himig ng panghalip.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: hindi lumuhod
  rationale: Ang literal na larawan ay pagyukod ng tuhod bilang pagsamba o pagpapasakop. Ang “lumuhod” ay natural at malinaw sa Tagalog habang pinananatili ang kilos na nasa Griyego.
- source_word: τῇ Βάαλ
  choice: kay Baal
  rationale: Karaniwang ginagamit ang “kay” sa Tagalog bago ang pangalan ng isang personal na nilalang; hindi kailangan ang artikulo ng Griyego sa salin.
theological_decisions:
- issue: Kung tahasang tutukuyin na mula sa Diyos ang tugon
  choice: “tugon ng Diyos”
  alternative: “tugon” o “pahayag” lamang
  rationale: Malinaw sa konteksto at sa sipi mula sa 1 Hari 19 na Diyos ang sumasagot kay Elias. Ipinahahayag ito ng salin nang hindi nagdaragdag ng doktrinang wala sa teksto.
- issue: Paglalarawan sa pagkilos ng Diyos sa nalabing pangkat
  choice: “Nagtira ako para sa aking sarili”
  alternative: “Iniwan ko para sa aking sarili” o “Inireserba ko para sa aking sarili”
  rationale: Pinananatili ng “nagtira” ang pagkilos at layunin ng Diyos, ngunit hindi nito ipinapaliwanag nang higit sa teksto ang teolohikal na kahulugan ng nalabi.
- issue: Kasarian ng ἄνδρας
  choice: “lalaki”
  alternative: “tao”
  rationale: Partikular na panlalaki ang salitang Griyego, kaya hindi ito ginawang gender-neutral.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ngunit” at “tugon” para sa pormal ngunit natural na himig; iniwasan ang teknikal na “orakulo.” Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
