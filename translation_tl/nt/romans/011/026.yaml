  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: tl
  text: 'At sa ganitong paraan, maliligtas ang buong Israel[a], gaya ng nasusulat: “Darating mula sa Zion[b] ang Tagapagligtas; itataboy niya mula kay Jacob ang kawalang-diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “At sa gayon, maliligtas ang buong Israel.” Ang Griyegong οὕτως ay maaaring mangahulugang “sa gayon,” ngunit dito ay malamang na tumutukoy sa paraang inilarawan pa lamang. Pinagtatalunan din kung sino ang tinutukoy ng “buong Israel”; pinananatili ng salin ang pagiging bukas ng parirala.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: Maaari ring isalin, “lalabas mula sa Zion.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Pinananatili ang diwa ng paraan o proseso at malamang na tumutukoy sa paraang kalalarawan pa lamang sa konteksto, sa halip na gawing simpleng resulta.
- source_word: πᾶς Ἰσραήλ
  choice: ang buong Israel
  rationale: Likas itong Filipino para sa kabuuang parirala at hindi nito nilulutas kung sino mismo ang saklaw ng “Israel.”
- source_word: σωθήσεται
  choice: maliligtas
  rationale: Ang future passive ng σῴζω ay may malinaw na bigat ng kaligtasan sa kontekstong Paulino.
- source_word: καθὼς γέγραπται
  choice: gaya ng nasusulat
  rationale: Karaniwan, marangal, at tumpak na pormula sa pagsipi ng Kasulatan.
- source_word: Ἥξει ἐκ Σιὼν
  choice: Magmumula sa Zion
  rationale: Natural na ipinapahayag sa Filipino ang pagdating na may pinagmulan; pinananatili rin ang ἐκ bilang “mula sa.”
- source_word: ὁ ῥυόμενος
  choice: ang Tagapagligtas
  rationale: Ang substantival participle ay ginawang titulong natural at marangal sa Filipino, na tumutukoy sa isang nagliligtas o sumasagip.
- source_word: ἀποστρέψει
  choice: ilalayo niya
  rationale: Pinananatili ang larawan ng pagpapatalikod o pag-aalis mula sa Jacob nang hindi pinipilit na tukuyin ang eksaktong paraan.
- source_word: ἀσεβείας
  choice: mga kasamaan laban sa Diyos
  rationale: Ipinahahayag ang moral at panrelihiyong puwersa ng ἀσέβεια sa malinaw na modernong Filipino; ang pangmaramihang anyo ay umaayon sa Greek plural.
- source_word: ἀπὸ Ἰακώβ
  choice: sa Jacob
  rationale: Sa konstruksyong “ilalayo ... sa,” naipapahayag ang pinagmulan o paghihiwalay na taglay ng ἀπό habang pinananatili ang pangalang Jacob.
theological_decisions:
- issue: Tinutukoy ng “buong Israel”
  choice: Pinanatili ang “ang buong Israel” nang walang paliwanag sa mismong talata.
  alternative: Ang kabuuan ng etnikong Israel; ang sumasampalatayang nalabi sa Israel; o ang buong bayan ng Diyos na kabilang ang mga Hentil.
  rationale: Pinagtatalunan ang saklaw ng parirala, at hindi ito nililinaw ng mismong ekspresyong Griyego; dapat manatili ang teolohikal na tensiyon.
- issue: Pagkakakilanlan ng ὁ ῥυόμενος
  choice: “Tagapagligtas” bilang anyong pamagat.
  alternative: “ang magliligtas” o “ang tagapagligtas.”
  rationale: Ang anyong pamagat ay akma sa propetikong sipi at sa gamit nito sa konteksto, nang hindi nagdaragdag ng tahasang pangalan na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sa ganitong paraan” upang idiin ang manner sense ng οὕτως; pinanatili ang “buong Israel,” “Zion,” at “Jacob” upang hindi ipaliwanag o pagtugmain nang labis ang mga katawagan sa teksto.
