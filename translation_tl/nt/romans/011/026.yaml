  verdict: revise
  source_fidelity: Kailangang baguhin ang dalawang pandiwa sa sipi. Ang “Magmumula” ay higit na tumutukoy sa pinagmulan kaysa sa darating na kilos ng ἥξει; mas tumpak ang “Darating ... mula sa Zion.” Ang “itataboy ... mula kay Jacob” ay mas malinaw na naghahayag ng ἀποστρέψει ... ἀπό kaysa sa “ilalayo niya sa Jacob.” Ang “kawalang-diyos” ay tuwirang katumbas ng ἀσεβείας at nananatiling pangkalahatang abstraktong katawagan gaya ng Griyego.
  naturalness: Natural at marangal sa modernong Filipino ang “Darating mula sa Zion ang Tagapagligtas” at “itataboy niya mula kay Jacob ang kawalang-diyos.” Ginamit ang pantukoy na “kay” sa personal na pangalang Jacob.
  terminology: Pinanatili ang “buong Israel” nang hindi nililinaw ang pinagtatalunang saklaw nito, ang “Zion” at “Jacob” bilang mga pangalang nasa sipi, at ang “Tagapagligtas” bilang pamagat na katumbas ng substantival participle na ὁ ῥυόμενος. Ang “kawalang-diyos” ay mas tuwirang termino para sa ἀσέβεια kaysa “mga kasamaan laban sa Diyos.”
  issues:
  - severity: medium
    issue: “Magmumula sa Zion” para sa Ἥξει ἐκ Σιὼν
    rationale: Hindi nito malinaw na naihahayag ang pandiwang “darating”; maaari itong basahin bilang simpleng pagtukoy sa pinagmulan.
  - severity: medium
    issue: “Ilalayo niya sa Jacob ang mga kasamaan laban sa Diyos” para sa ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ
    rationale: Hindi likas ang gamit ng “sa Jacob” para sa tao, at ang “mga kasamaan laban sa Diyos” ay mas maluwag kaysa sa pangkalahatang konseptong ἀσεβείας. Mas malinaw ang pagpapaalis mula kay Jacob.
  - severity: low
