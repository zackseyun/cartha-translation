  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: tl
  text: “Panginoon, pinatay nila ang iyong mga propeta, giniba nila ang iyong mga altar, at ako na lamang ang natira; at hinahanap nila ang buhay ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “hinahanap nila ang aking kaluluwa.” Dito, ang idyomang Griyego ay nangangahulugang “hinahanap nila ang buhay ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Panginoon
  rationale: Tuwirang pagtawag sa Diyos; ang “Panginoon” ang likas at marangal na katumbas sa modernong Tagalog.
- source_word: ἀπέκτειναν
  choice: pinatay
  rationale: Tuwirang ipinapahayag ang pagkitil ng buhay nang hindi idinaragdag ang mas tiyak na moral na diwa ng “pinaslang.”
- source_word: τὰ θυσιαστήριά σου
  choice: ang iyong mga altar
  rationale: Ang θυσιαστήριον ay altar na ginagamit sa paghahandog; sapat at pamilyar sa Tagalog ang “altar.”
- source_word: κατέσκαψαν
  choice: giniba
  rationale: Ipinahihiwatig ng pandiwa ang pagwasak o pagpapabagsak; natural gamitin ang “giniba” para sa mga altar.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: at ako na lamang ang natira
  rationale: Pinananatili ang diwa na sa pananaw ni Elias ay siya lamang ang nalabi, pati ang diin ng μόνος.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: at pinaghahanap nila ako upang patayin
  rationale: Sa konteksto, ang idyomang Griyego ay nangangahulugang hinahanap siya upang kitilin ang kanyang buhay; malinaw at natural ito sa Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa idyoma ng pagbabanta
  choice: pinaghahanap nila ako upang patayin
  alternative: hinahanap nila ang aking buhay
  rationale: Ang ψυχή rito ay tumutukoy sa buhay ni Elias, hindi sa kaluluwang hiwalay sa katawan. Iniiwasan ng salin ang di-likas na Tagalog at ang pagpasok ng usaping antropolohikal na wala sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang sunod-sunod na mga sugnay at ang diin ng “ako na lamang,” habang ginawang likas sa Tagalog ang huling idyoma.
