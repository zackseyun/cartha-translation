source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: tl
  text: Sa inyo namang mga Hentil[a] ako nagsasalita. Yamang ako nga ay apostol sa mga Hentil, binibigyang-dangal ko ang aking paglilingkod[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bansa.” Ganoon din sa ikalawang paglitaw ng “mga Hentil” sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: O “niluluwalhati ko ang aking paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Sa inyo namang mga Hentil ako nagsasalita
  rationale: Pinagsama ang panghalip at ang tinutukoy nitong kausap sa likas na ayos ng Filipino. Ipinahihiwatig ng “naman” ang banayad na paglipat o paghahambing na dala ng δὲ, nang hindi ito ginagawang matinding pagsalungat.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Yamang ... nga
  rationale: Ipinapakita ng “yamang” ang batayan ng pahayag, habang ang “nga” ay banayad na nagpapanatili sa pagbibigay-diin at pagpapatuloy na dala ng μὲν οὖν.
- source_word: ἐθνῶν ἀπόστολος
  choice: apostol sa mga Hentil
  rationale: Ang genitibo ay tumutukoy sa mga taong pinatutunguhan ng pagkaapostol ni Pablo. Ang “apostol” ay angkop sa natatanging tungkuling tinutukoy, hindi lamang sa pangkalahatang kahulugang mensahero.
- source_word: τὴν διακονίαν μου
  choice: ang aking paglilingkod
  rationale: Nananatili ang pangunahing diwa ng διακονία bilang paglilingkod, habang malinaw sa konteksto na ito ang apostolikong gawaing ipinagkatiwala kay Pablo.
- source_word: δοξάζω
  choice: binibigyang-dangal ko
  rationale: Ipinahahayag nito ang pagbibigay ng karangalan o mataas na pagpapahalaga sa paglilingkod. Iniiwasan nito ang pahiwatig na niluluwalhati ni Pablo ang sarili, ngunit pinananatili ang lakas ng pandiwang Griyego.
theological_decisions:
- issue: Ang kahulugan ng pagbibigay-dangal ni Pablo sa kanyang paglilingkod
  choice: Ang paglilingkod ang binibigyang-dangal, hindi ang sarili ni Pablo.
  alternative: Ipinagkakapuri ni Pablo ang kanyang paglilingkod o niluluwalhati niya ito.
  rationale: Ang tahasang layon ng δοξάζω ay “aking paglilingkod.” Hindi dapat idagdag ng salin ang personal na pagmamapuri, bagaman pinananatili nito ang diwa ng hayagang pagpapahalaga at pagbibigay-karangalan.
- issue: Ang tinutukoy ng ἔθνη / ἐθνῶν
  choice: mga Hentil
  alternative: mga bansa
  rationale: Sa konteksto ng Roma 9–11, inihahambing ni Pablo ang Israel sa mga taong hindi Judio. Pinakamalinaw na naipapahayag ng “mga Hentil” ang pagkakaibang ito, habang inilalagay sa talababa ang literal na alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “naman” bilang likas na panandang diskurso, “paglilingkod” sa halip na mas teknikal na “ministeryo,” at “binibigyang-dangal” upang mapanatili ang saklaw ng δοξάζω nang hindi magtunog na sariling pagluwalhati.
