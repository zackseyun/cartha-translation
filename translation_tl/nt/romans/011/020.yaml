  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: tl
  text: Tama nga:[a] nabali at inalis sila dahil sa kawalan ng pananampalataya, ngunit nakatayo ka sa pamamagitan ng pananampalataya.[b] Huwag kang magmataas; sa halip, matakot ka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tama” o “Totoo iyan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa pananampalataya” o “sa pamamagitan ng pagtitiwala.”
    reason: alternative_reading
  - marker: c
    text: Sa konteksto, ito ay takot na may pagpapakumbaba, pagpipitagan, at pag-iingat sa harap ng Diyos; hindi lamang ito simpleng sindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Tama iyan
  rationale: Sa konteksto, pinagtitibay nito ang sinabi sa naunang talata. Likas sa makabagong Tagalog ang “Tama iyan” bilang tugon ng pagsang-ayon.
- source_word: ἀπιστίᾳ
  choice: dahil sa kawalan ng pananampalataya
  rationale: Ipinahahayag ng datibo rito ang sanhi o batayan ng pagkabali, at pinananatili nito ang tuwirang pagsalungat sa πίστις.
- source_word: ἐξεκλάσθησαν
  choice: binali sila
  rationale: Pinananatili ang konkretong larawan ng mga sangang binali mula sa punong olibo sa nakapaligid na konteksto.
- source_word: πίστει
  choice: sa pamamagitan ng pananampalataya
  rationale: Ipinahahayag ang paraan o batayan ng pananatiling nakatayo at pinananatili ang karaniwang salin na “pananampalataya,” na kasalungat ng “kawalan ng pananampalataya.”
- source_word: ἕστηκας
  choice: nananatili kang nakatayo
  rationale: Ipinahahayag ang kasalukuyang kalagayang bunga ng naunang pangyayari na taglay ng perpektong anyo ng ἵστημι.
- source_word: ὑψηλὰ φρόνει
  choice: magmataas
  rationale: Natural at malinaw na idyomang Tagalog ito para sa mapagmataas na pag-iisip tungkol sa sarili.
- source_word: φοβοῦ
  choice: matakot ka
  rationale: Pinananatili ang matalas at tuwirang utos ng Griyego nang hindi ito pinapahina bilang paggalang lamang.
theological_decisions:
- issue: Kahulugan ng πίστις bilang kasalungat ng ἀπιστία
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Malakas na ipinahihiwatig ng pagsalungat sa “kawalan ng pananampalataya” ang tugon ng taong sumasampalataya. Gayunman, maaaring ipaliwanag ang πίστις bilang pagtitiwala nang hindi ipinapasok ang ibang posibleng kahulugang hindi hinihingi ng konteksto.
- issue: Lakas ng utos na φοβοῦ
  choice: matakot ka
  alternative: magkaroon ka ng mapitagang takot
  rationale: Pinananatili ng payak na “matakot ka” ang tensiyong teolohikal ng babala laban sa kapalaluan at walang-ingat na pagtitiwala sa sarili. Ang talababa ang nagbibigay ng kontekstuwal na paglilinaw nang hindi pinapahina ang pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Tagalog na gumagamit ng payak na bokabularyo. Pinanatili ang metapora ng pagbali sa mga sanga, ang isahang kausap sa “kang/ka,” at ang matalas na paghaharap ng kawalan ng pananampalataya, pananampalataya, kapalaluan, at takot.
