translation:
  language: tl
  text: Kung sakaling mapukaw ko sa inggit ang mga kalahi ko at mailigtas ang ilan sa kanila[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kalahi ko” ay tumutukoy sa mga kapuwa niya Judio; literal, “aking laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: kung sakaling
  rationale: Ipinahahayag nito ang umaasang layunin ni Pablo nang hindi ginagawang tiyak ang magiging resulta; natural ito sa makabagong Filipino.
- source_word: παραζηλώσω
  choice: mapukaw ko sa inggit
  rationale: Pinananatili nito ang aktibong diwa ng pagpukaw sa paninibugho o inggit at ang kaugnayan nito sa temang nasa nakapaligid na konteksto.
- source_word: μου τὴν σάρκα
  choice: sarili kong mga kalahi
  rationale: Ang literal na 'aking laman' ay idyoma rito para sa mga kadugo o kaangkan ni Pablo, partikular sa kapuwa niya mga Judio. Ang 'mga kalahi' ay malinaw at natural habang nililinaw ng talababa ang literal na larawan.
- source_word: σώσω
  choice: mailigtas
  rationale: Pinananatili ang karaniwang soteriolohikal na bigat ng pandiwa sa sulat ni Pablo.
- source_word: τινὰς ἐξ αὐτῶν
  choice: ang ilan sa kanila
  rationale: Malinaw na ipinakikitang isang bahagi lamang ng nabanggit na pangkat ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng σάρξ sa pagtukoy ni Pablo sa sarili niyang pangkat
  choice: mga kalahi, na may talababa sa literal na 'aking laman'
  alternative: sarili kong laman; kapuwa ko mga Judio
  rationale: Sa konteksto, ang σάρξ ay tumutukoy sa likas na pagkakamag-anak at etnikong kaugnayan, hindi sa 'makasalanang kalikasan.' Iniiwasan ng salin ang nakalilitong literalismo ngunit pinananatili sa talababa ang tayutay at espesipikong reperente.
- issue: Papel ni Pablo sa pagliligtas
  choice: mailigtas
  alternative: maging kasangkapan sa pagliligtas
  rationale: Direktang sinasabi ng Griyego na 'mailigtas ko'; pinananatili ang matapang na pananalita ni Pablo sa halip na dagdagan ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kung sakaling' upang mapanatili ang pag-asa na walang katiyakan, at 'mapukaw sa inggit' upang maipakita ang puwersa ng παραζηλόω nang hindi tunog lipas.
