  source_fidelity: Tumpak ang pangunahing larawang metaporikal at ang pasibong diwa ng ἐγκεντρισθῶ sa “maihugpong.” Gayunman, ang “binali” na walang malinaw na panghalip o estrukturang pasibo ay maaaring mabasa bilang aktibong pandiwa sa karaniwang Tagalog. Ang “pinutol” ay mas malinaw na pasibo ngunit hindi gaanong pinananatili ang larawang “broken off.”
