  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: tl
  text: Kaya sasabihin mo, “May mga sanga na nabali upang ako’y maihugpong.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: sasabihin mo
  rationale: Hinaharap na aktibong anyo, ikalawang panauhang isahan; pinananatili ang tuwirang pakikipag-usap ni Pablo sa ipinapalagay na kausap.
- source_word: οὖν
  choice: kaya
  rationale: Nag-uugnay ito sa lohikal na paghinuha mula sa naunang talakayan; natural sa modernong Tagalog ang “kaya” sa ganitong argumento.
- source_word: Ἐξεκλάσθησαν
  choice: binali
  rationale: Aorist passive ng ἐκκλάω. Ang “binali” ay nagpapanatili sa larawan ng mga sangang inalis sa puno; dahil sa pokus sa layon ng pandiwa sa Tagalog, naipahihiwatig ang pasibong diwa nang hindi tinutukoy ang gumawa.
- source_word: κλάδοι
  choice: mga sanga
  rationale: Tuwirang salin na malinaw na nagpapanatili sa metapora ng punong olibo.
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ang maaaring diwa ng layunin o kinalabasan nang hindi ito nilulutas nang higit sa sinasabi ng Griyego.
- source_word: ἐγὼ
  choice: ako
  rationale: Pinananatili ang tahasang unang-panauhang panghalip at ang pagiging prominente nito sa pahayag.
- source_word: ἐγκεντρισθῶ
  choice: maihugpong
  rationale: Ang “maihugpong” ay natural na terminong hortikultural sa Tagalog at nagpapanatili sa pasibong diwa ng pagkakabit ng isang sanga sa puno.
theological_decisions:
- issue: Kung lilinawin na kathang-isip o ipinapalagay lamang ang kausap sa argumento ni Pablo
  choice: Panatilihin ang tuwirang “sasabihin mo” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: “Maaaring sabihin mo” o “May magsasabi.”
  rationale: Tahasang ikalawang panauhang isahan at anyong hinaharap ang nasa Griyego. Ang pagdaragdag ng “maaaring” o pagpapalit sa “may magsasabi” ay higit na interpretatibo.
- issue: Kung gagawing tahasang pahayag tungkol sa layunin ng Diyos ang sugnay na may ἵνα
  choice: Isalin lamang bilang “upang ako ay maihugpong.”
  alternative: “para maihugpong ako ayon sa layunin ng Diyos.”
  rationale: Pahayag ito ng kausap sa argumento, at hindi dapat dagdagan ng pagsang-ayon, pagtutol, o tahasang pagtukoy sa banal na layunin na wala sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignidad ngunit madaling maunawaan. Ginamit ang “maihugpong” upang mapanatili ang larawang hortikultural; iniwasan ang mas teknikal o lipas na “maingkerto.”
