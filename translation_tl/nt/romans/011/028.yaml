id: ROM.11.28
reference: Romans 11:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: tl
  text: Kung tungkol sa ebanghelyo[a], mga kaaway sila alang-alang sa inyo; ngunit kung tungkol sa pagkahirang, minamahal sila dahil sa mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinggil sa ebanghelyo, mga kaaway sila dahil sa inyo … ngunit hinggil sa pagkahirang, minamahal sila alang-alang sa mga ninuno.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga ninuno” ay tumutukoy sa mga patriyarka ng Israel, lalo na kina Abraham, Isaac, at Jacob.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Kung tungkol sa ebanghelyo
  rationale: Ipinahahayag ng κατά na may akusatibo ang larangan o batayan ng pagtingin. Likas sa makabagong Tagalog ang “kung tungkol sa,” at malinaw nitong ipinakikita ang balangkas ng paghahambing na μὲν…δέ.
- source_word: ἐχθροὶ
  choice: mga kaaway
  rationale: Ginamit ang tuwirang pangngalang panaguri upang mapanatili ang matinding relasyonal na diwa ng Griyego, sa halip na pahinain ito bilang simpleng pagiging salungat.
- source_word: δι’ ὑμᾶς
  choice: alang-alang sa inyo
  rationale: Maaaring magpahiwatig ang διά na may akusatibo ng dahilan o kapakinabangan. Pinananatili ng “alang-alang sa inyo” ang diwa na ang kalagayang ito ay nakaugnay sa kapakinabangan ng mga kausap, nang hindi isinasara ang bahagyang kalabuan.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: ngunit kung tungkol sa pagkahirang
  rationale: Inuulit nito ang magkatapat na balangkas ng unang sugnay at inilalahad ang ἐκλογή bilang larangan ng pagtingin, hindi bilang kilos na pinalawak nang higit sa teksto.
- source_word: ἐκλογὴν
  choice: pagkahirang
  rationale: Ang “pagkahirang” ay malinaw at kinikilalang katumbas ng pagpili ng Diyos sa konteksto ng Roma 9–11, samantalang ang payak na “pagpili” ay maaaring maging labis na pangkalahatan.
- source_word: ἀγαπητοὶ
  choice: minamahal
  rationale: Likas na panaguri sa Tagalog ang “minamahal” at pinananatili nito ang bigat ng pagiging mga taong iniibig, bilang tahasang katapat ng “mga kaaway.”
- source_word: διὰ τοὺς πατέρας
  choice: dahil sa mga ninuno
  rationale: Tuwirang inilalahad ng “dahil sa” ang batayan o dahilan. Ang “mga ninuno” ang natural na Tagalog para sa covenantal shorthand na “the fathers,” habang nililinaw sa talababa ang partikular na tinutukoy.
theological_decisions:
- issue: Tinutukoy ng ipinahihiwatig na “sila”
  choice: Pinananatiling pangkalahatan ang pagtukoy sa Israel o sa bayang Judio sa daloy ng Roma 9–11.
  alternative: Limitahan ito sa mga Judiong hindi sumasampalataya noong panahon lamang ni Pablo.
  rationale: Hindi dinaragdagan ng talata ang paksa ng mas makitid na panuring. Ang saling “sila” ay nagpapanatili sa kolektibong saklaw at hindi nilulutas ang tanong nang higit sa konteksto.
- issue: Diwa ng “mga kaaway”
  choice: Inilalarawan nito ang kanilang kalagayan kaugnay ng ebanghelyo, kasabay ng patuloy nilang pagiging minamahal kaugnay ng pagkahirang.
  alternative: Unawain ito bilang lubos at walang-takdang pagkamuhi ng Diyos sa kanila, o bilang karaniwang panlipunang pagsalungat lamang.
  rationale: Sadyang pinagtatabi ng talata ang “mga kaaway” at “minamahal.” Pinananatili ng salin ang dalawang pahayag at ang tensiyong teolohikal sa pagitan ng mga ito.
- issue: Kahulugan ng “mga ninuno”
  choice: Tumutukoy ito sa mga patriyarka ng Israel, lalo na kina Abraham, Isaac, at Jacob.
  alternative: Mga ninuno sa pangkalahatang etnikong kahulugan lamang.
  rationale: Sa Roma 9–11, inuugnay ng parirala ang Israel sa mga pangako ng Diyos sa mga patriyarka. Hindi pinalalawak ang pangunahing teksto, ngunit nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang balanseng estruktura ng μὲν…δέ sa pamamagitan ng “kung tungkol sa … ngunit kung tungkol sa,” at iniwasang ipaliwanag sa pangunahing teksto ang teolohikal na tensiyon sa pagitan ng “mga kaaway” at “minamahal.”
