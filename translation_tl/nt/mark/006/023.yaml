  source_fidelity: 'Tumpak ang salin sa Griyego: ang ὤμοσεν ay naipahayag bilang “sumumpa,” ang bukás na saklaw ng ὅ τι ἐάν bilang “Anuman,” at ang pangakong may hangganang ἕως ἡμίσους τῆς βασιλείας μου bilang “hanggang sa kalahati ng aking kaharian.” Hindi nito inaalis ang sinadyang malawak at maringal na saklaw ng panunumpa.'
  naturalness: Natural, malinaw, at angkop ang rehistro sa makabagong Filipino Tagalog. Ang “Anuman ang hingin mo sa akin, ibibigay ko sa iyo” ay idiomatiko at malinaw. Katanggap-tanggap din ang “hanggang sa kalahati,” bagaman posible rin ang estilistikong “hanggang kalahati.”
  terminology: Ang “sumumpa” ay angkop para sa taimtim na panunumpa, at ang “kaharian” ay wastong salin ng βασιλεία sa kontekstong ito. Hindi ipinapasok ng salin ang anumang di-nakasaad na teolohikal o interpretatibong pagpapakahulugan. Ang talababa ay angkop na nagpapaliwanag ng nakaugaliang eksaheradong anyo ng alok.
