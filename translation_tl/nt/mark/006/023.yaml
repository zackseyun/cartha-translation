  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: tl
  text: At sumumpa siya sa kanya, “Anuman ang hingin mo sa akin, ibibigay ko sa iyo—hanggang sa kalahati ng aking kaharian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “hanggang sa kalahati ng aking kaharian” ay isang nakaugaliang maringal at eksaheradong alok ng isang hari o pinuno.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: sumumpa
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagbibigay ng isang taimtim na panunumpa; natural at matimbang ang “sumumpa” sa makabagong Filipino.
- source_word: αὐτῇ
  choice: sa kanya
  rationale: Ang panghalip na pambabae ay tumutukoy sa dalagang kausap ni Herodes. Hindi karaniwang minamarkahan ng Filipino ang kasarian sa panghalip.
- source_word: Ὅ τι ἐάν
  choice: Anuman
  rationale: Ipinahahayag nito ang bukás at di-tiyak na saklaw ng kahilingan. Maikli, natural, at sapat na malawak ang “anuman.”
- source_word: με αἰτήσῃς
  choice: ang hingin mo sa akin
  rationale: Sa kontekstong may ipinapangakong ibibigay, mas natural sa Filipino ang “hingin mo sa akin” kaysa sa literal na “itanong mo sa akin.”
- source_word: δώσω σοι
  choice: ibibigay ko sa iyo
  rationale: Pinananatili nito ang malinaw na pangako sa anyong panghinaharap at ang tumatanggap ng ibibigay.
- source_word: ἕως ἡμίσους
  choice: hanggang sa kalahati
  rationale: Dito ang ἕως ay nagsasaad ng hangganan ng dami, hindi ng panahon. Tumpak at natural ang “hanggang sa kalahati.”
- source_word: τῆς βασιλείας μου
  choice: ng aking kaharian
  rationale: Bagaman maaaring tumukoy ang βασιλεία sa paghahari o kapangyarihang maghari, sa maringal na alok na ito ay pinakamalinaw ang kongkretong diwang “kaharian.”
theological_decisions:
- issue: Kahulugan ng βασιλεία sa pananalita ni Herodes
  choice: kaharian
  alternative: paghahari / kapangyarihang maghari
  rationale: Pinananatili ng “kaharian” ang karaniwang pormula ng napakalaking alok ng isang pinuno nang hindi ginagawang teknikal na teolohikal na termino ang salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa kanya” ayon sa likas na gamit ng Filipino, at ang gitling-pahaba ay nagbibigay-diin sa sukdulang lawak ng ipinangako nang hindi binabago ang kahulugan.
