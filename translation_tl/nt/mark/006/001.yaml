  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: tl
  text: Umalis siya roon at pumunta sa sarili niyang bayan[a], at sumunod sa kanya ang kanyang mga alagad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pumupunta sa sarili niyang bayan, at sumusunod sa kanya ang kanyang mga alagad.” Gumagamit ang Griyego ng pangkasalukuyang panahunan sa pagsasalaysay upang maging mas buhay ang tagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: umalis
  rationale: Ang aorist ng ἐξέρχομαι ay nagsasaad ng pag-alis sa dating kinaroroonan. Likas at malinaw sa Filipino ang “umalis” nang hindi kailangang gawing mas literal na “lumabas.”
- source_word: ἐκεῖθεν
  choice: roon
  rationale: Tumutukoy ito sa lugar na pinanggalingan. Sa pariralang “umalis siya roon,” malinaw at natural ang diwang “mula roon.”
- source_word: ἔρχεται
  choice: pumunta
  rationale: Bagaman nasa historical present ang Griyego, ginawang pangnagdaan upang maging likas sa salaysay na Filipino. Ang “pumunta” ay malinaw na nagpapahayag ng pagdating sa patutunguhan mula sa pananaw ng tagapagsalaysay.
- source_word: πατρίδα
  choice: sarili niyang bayan
  rationale: Sa konteksto, tumutukoy ang πατρίς sa sariling lugar o bayang kinalakhan ni Jesus, hindi sa isang bansa sa malawak na diwa. Iniiwasan ng “sarili niyang bayan” ang di-tiyak na pahiwatig ng “bayang sinilangan.”
- source_word: ἀκολουθοῦσιν
  choice: sumunod
  rationale: Pinananatili ng “sumunod” ang karaniwang wika ng pagiging alagad at higit na tiyak ito kaysa “sumama.” Ginawang pangnagdaan ang historical present para sa likas na salaysay sa Filipino.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Ang “mga alagad” ang nakaugaliang salin sa konteksto ng mga Ebanghelyo at saklaw nito ang ugnayan ng mga tagasunod na tinuturuan ng kanilang guro.
theological_decisions:
- issue: Paglalarawan sa πατρίς ni Jesus
  choice: sarili niyang bayan
  alternative: bayang sinilangan; sariling lupain
  rationale: Hindi tahasang pinapangalanan ng talata ang Nazaret at hindi rin tiyak na ang diin ay sa lugar ng kapanganakan. Pinananatili ng salin ang saklaw ng Griyego nang hindi nagdaragdag ng detalyeng wala sa teksto.
- issue: Pagsasalin ng historical presents na ἔρχεται at ἀκολουθοῦσιν
  choice: pangnagdaang “pumunta” at “sumunod”
  alternative: pangkasalukuyang “pumupunta” at “sumusunod”
  rationale: Usaping pang-estilo ito, hindi doktrinal. Mas likas sa makabagong salaysay na Filipino ang pangnagdaan, habang inilalahad sa talababa ang mas literal na anyo at ang bisa nitong nagbibigay-sigla sa pagsasalaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siya” sapagkat hindi binabanggit ang pangalang Jesus sa mismong Griyegong talata. Pinili ang karaniwang “kanya” sa halip na mas pormal na “kaniya,” at iniwasan ang mga salitang maaaring magdagdag ng impormasyong wala sa teksto.
