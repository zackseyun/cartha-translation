  naturalness: Ang “Nilibot nila nang patakbo” ay nauunawaan ngunit hindi likas sa modernong Filipino. Ang “Tinakbo nila ang buong lupaing iyon” ay maigsi, natural, at pinananatili ang mabilis na paglibot. Ang “sa bawat lugar na nababalitaan nilang naroon siya” ay mas malinaw na panandang patutunguhan kaysa “saanman nila mabalitaang.”
