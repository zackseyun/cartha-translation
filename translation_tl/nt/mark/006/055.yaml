translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “maysakit” kaysa mas pormal na “may karamdaman,” at ang “nilibot ... nang patakbo” upang mapanatili ang pagmamadali at lawak ng pagkilos.
