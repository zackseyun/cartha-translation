base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: tl
  text: Tinakbo nila ang buong lupaing iyon at sinimulang dalhin sa mga banig ang mga maysakit sa bawat lugar na nababalitaan nilang naroon siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga papag” o “sa mga higaan”; ang salitang Griyego ay tumutukoy sa payak at madaling dalhing higaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: nilibot ... nang patakbo
  rationale: Ipinahahayag nito kapuwa ang mabilis na pagkilos at ang paglibot sa buong nasasakupan, sa natural na modernong Tagalog.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: ang buong lupaing iyon
  rationale: Ang χώρα ay tumutukoy rito sa nakapalibot na lupain o distrito, hindi sa isang makabagong bansang pampolitika.
- source_word: ἤρξαντο ... περιφέρειν
  choice: sinimulang dalhin
  rationale: Pinananatili nito ang diwang ingressive ng ἤρξαντο at ang pisikal na pagdadala sa mga maysakit.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: sa mga banig
  rationale: Ang κράβαττος ay payak at nabibitbit na higaan; ang “banig” ay malinaw at karaniwang salitang Filipino, habang inilalahad sa talababa ang mas malawak na saklaw.
- source_word: τοὺς κακῶς ἔχοντας
  choice: ang mga maysakit
  rationale: Ito ang natural na salin ng idyomang Griyego para sa mga taong masama ang kalagayan ng katawan o may karamdaman.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: saanman nila mabalitaang naroon siya
  rationale: Ipinapakita ng “saanman” ang di-tiyak at maaaring paulit-ulit na destinasyon; ang “mabalitaan” ay natural na paglalahad ng impormasyong narinig nila.
