  rationale: Inayos ang dalawang parirala para sa mas likas na modernong Filipino nang hindi binabago ang saklaw, pagmamadali, aspektong “sinimulan,” o di-tiyak na mga lugar na ipinahihiwatig ng tekstong Griyego. Iningatan ang talababa sa “mga banig” upang ilahad ang saklaw ng κράβαττοι.
