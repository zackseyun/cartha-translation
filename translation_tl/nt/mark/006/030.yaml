source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: tl
  text: Nagtipon-tipon ang mga apostol kay Jesus, at iniulat nila sa kanya ang lahat ng kanilang ginawa at itinuro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: Nagtipon-tipon
  rationale: Ang kasalukuyang panahunan ay historical present sa salaysay; natural sa Tagalog ang naganap na anyo. Ipinapakita ng pag-uulit sa “nagtipon-tipon” ang sama-samang paglapit ng pangkat.
- source_word: οἱ ἀπόστολοι
  choice: ang mga apostol
  rationale: Kinikilalang tawag ito sa Labindalawa ayon sa tungkuling ipinagkatiwala sa kanila, hindi lamang pangkalahatang “mga sugo.”
- source_word: πρὸς τὸν Ἰησοῦν
  choice: kay Jesus
  rationale: Ipinahihiwatig ng πρός na kay Jesus sila lumapit at nagtipon; maikli at likas itong ipahayag sa Tagalog kasunod ng “nagtipon-tipon.”
- source_word: ἀπήγγειλαν
  choice: iniulat
  rationale: Ang pandiwa ay tumutukoy sa pagbibigay ng ulat tungkol sa natapos nilang gawain; mas tiyak ito kaysa sa simpleng “sinabi.”
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: ang lahat ng kanilang ginawa at itinuro
  rationale: Pinananatili ng “lahat” ang ganap na saklaw ng πάντα, habang likas na pinagsasama sa Tagalog ang dalawang magkatulad na sugnay tungkol sa kanilang ginawa at itinuro.
theological_decisions:
- issue: Pagtukoy sa mga alagad bilang ἀπόστολοι
  choice: mga apostol
  alternative: mga sugo
  rationale: Sa kontekstong ito, tinutukoy ng salita ang kinikilalang pangkat na isinugo ni Jesus. Pinananatili ng “mga apostol” ang kanilang itinalagang papel nang hindi ito ginagawang pangkalahatang katawagan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Nagtipon-tipon” at “iniulat” upang maging natural sa salaysay habang nananatiling malapit sa kilos at diwa ng Griyego.
