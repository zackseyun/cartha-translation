  to: At kinuha niya ang limang tinapay at ang dalawang isda. Tumingala siya sa langit at bumigkas ng pagpapala[a]. Pinagpira-piraso niya ang mga tinapay at patuloy niyang ibinibigay ang mga ito sa kanyang mga alagad upang ihain nila sa mga tao. Hinati niya ang dalawang isda sa lahat.
