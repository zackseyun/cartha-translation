id: MRK.6.41
reference: Mark 6:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: tl
  text: At kinuha niya ang limang tinapay at ang dalawang isda. Tumingala siya sa langit at bumigkas ng pagpapala[a]. Pinagpira-piraso niya ang mga tinapay at patuloy niyang ibinibigay ang mga ito sa kanyang mga alagad upang ihain nila sa mga tao. Hinati niya ang dalawang isda sa lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “nagpasalamat.” Literal na “bumasbas” ang pandiwang Griyego, ngunit sa konteksto ng pagkain ay maaari itong magpahiwatig ng pasasalamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: kinuha niya
  rationale: Ang aorist participle ay panimulang kilos sa sunod-sunod na salaysay; likas sa modernong Tagalog ang tahasang sugnay.
- source_word: ἄρτους
  choice: mga tinapay
  rationale: Tumutukoy ito sa limang nabibilang na tinapay; hindi kailangang tukuyin ang anyo o laki na hindi sinasabi ng Griyego.
- source_word: ἰχθύας
  choice: mga isda
  rationale: Tuwirang katumbas ng pangmaramihang ἰχθύας.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: tumingala siya sa langit
  rationale: Natural na Tagalog na nagpapanatili sa pataas na tingin at sa teolohikal na pahiwatig ng οὐρανός.
- source_word: εὐλόγησεν
  choice: binasbasan ang mga iyon
  rationale: Pinananatili ang pangunahing kahulugan ng εὐλογέω at ginagawang malinaw ang ipinahihiwatig na layon nang hindi ito pinapalitan ng εὐχαριστέω.
- source_word: κατέκλασεν
  choice: pinagputol-putol niya
  rationale: Ang pandiwa ay tumutukoy sa pagputol-putol ng mga tinapay; malinaw ang layon sa kasunod na parirala.
- source_word: ἐδίδου
  choice: patuloy na ibinigay
  rationale: Ipinahahayag ang nagpapatuloy o paulit-ulit na kilos ng imperfect habang ipinamamahagi ang pagkain.
- source_word: μαθηταῖς αὐτοῦ
  choice: kanyang mga alagad
  rationale: Pinananatili ang tahasang panghalip na αὐτοῦ.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: upang ihain nila sa mga tao
  rationale: Pinananatili ang layunin ng ἵνα at ang diwa ng παρατίθημι sa konteksto ng pagkain; nililinaw na ang αὐτοῖς ay tumutukoy sa mga taong pakakainin.
- source_word: ἐμέρισεν πᾶσιν
  choice: hinati-hati niya ... para sa lahat
  rationale: Ipinapakita ang paghahati at pamamahagi sa lahat nang natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng εὐλόγησεν sa konteksto ng pagkain
  choice: binasbasan ang mga iyon
  alternative: nagpasalamat
  rationale: εὐλογέω ang pandiwa, hindi εὐχαριστέω. Maaaring magkalapit ang diwa ng pagbabasbas at pasasalamat sa ganitong konteksto, ngunit mas tuwirang pinananatili ng “binasbasan” ang leksikal na anyo at hindi nilulutas ang tensiyon pabor sa isang tradisyonal na parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap upang maging natural ang mahabang serye ng mga Griyegong participle at pandiwa, habang pinananatili ang pagkakasunod-sunod at nagpapatuloy na kilos.
