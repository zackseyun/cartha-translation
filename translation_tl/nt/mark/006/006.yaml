  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: tl
  text: At namangha siya dahil sa kawalang-paniniwala nila.[a] At naglibot siya sa mga nayon sa paligid habang nagtuturo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagtaka dahil sa kawalang-paniniwala nila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naglibot siya nang paikot sa mga nayon” o “naglibot siya sa mga nakapaligid na nayon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: namangha siya
  rationale: Likas at malinaw sa makabagong Tagalog ang “namangha,” at pinananatili nito ang tuwirang pahayag na nagtaka o namangha si Jesus. Hindi ito dinagdagan ng paliwanag na magpapahina sa tensiyon ng salaysay.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: dahil sa hindi nila paniniwala
  rationale: Ang διά na may accusative ay nagsasaad ng sanhi. Ang “hindi nila paniniwala” ay malinaw na nagpapahayag ng unbelief sa kontekstong ito at hindi lamang mahinang pagtitiwala.
- source_word: περιῆγεν
  choice: naglibot siya
  rationale: Ipinahihiwatig ng imperfect ang patuloy o paulit-ulit na pagpunta sa iba’t ibang lugar; natural na naipahahayag ito ng aspektong di-ganap sa “naglibot.”
- source_word: τὰς κώμας
  choice: mga nayon
  rationale: Ang κώμη ay nayon o pamayanang rural; “mga nayon” ang pinakamaikli at karaniwang katumbas sa Tagalog.
- source_word: κύκλῳ
  choice: sa paligid
  rationale: Ipinapahiwatig ng pang-abay ang mga nayong nakapaligid o ang pagkilos nang paikot. Pinananatili ng “sa paligid” ang heograpikong diwa nang hindi ipinipilit kung tiyak na paikot na ruta ang tinahak.
- source_word: διδάσκων
  choice: habang nagtuturo
  rationale: Ginagawang malinaw ng “habang” na kasabay ng paglibot ang pagtuturo, alinsunod sa contemporaneous present participle.
theological_decisions:
- issue: Ang pagkamangha ni Jesus sa kanilang hindi paniniwala nang hindi nilulutas ang implikasyong teolohikal
  choice: At namangha siya dahil sa hindi nila paniniwala.
  alternative: At nagtaka siya dahil sa hindi nila paniniwala.
  rationale: Tuwirang sinasabi ng teksto na namangha si Jesus. Pinananatili ng salin ang pahayag at tensiyon nito nang hindi nagdaragdag ng paliwanag tungkol sa kaalaman o pagkatao niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hindi nila paniniwala” sa halip na mas teknikal na “kawalan ng pananampalataya,” at ang “naglibot … habang nagtuturo” upang natural na maipahayag ang nagpapatuloy at magkasabay na mga kilos.
