  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: tl
  text: At naupo sila nang pangkat-pangkat—tig-iisang daan at tiglilimampu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga pitak ng taniman, mga pitak ng taniman”—isang larawang nagpapahiwatig ng maayos na mga hanay o seksiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: naupo
  rationale: Sa konteksto ng pagkain, tumutukoy ito sa pag-upo o pagpuwesto upang kumain. Mas natural sa makabagong Tagalog ang “naupo” kaysa sa literal na “humilig,” yamang hindi karaniwang inilalarawan sa Tagalog ang sinaunang paraan ng paghilig sa hapag.
- source_word: πρασιαὶ πρασιαὶ
  choice: nang pangkat-pangkat
  rationale: Literal na tumutukoy ang πρασιά sa taniman o pitak ng halaman, ngunit dito ay larawan ito ng maayos na pagkakahati ng mga tao. Naipapahayag ng inuulit na “pangkat-pangkat” ang distributibong pag-uulit sa Griyego, habang inilalagay sa talababa ang kongkretong larawan.
- source_word: κατὰ ἑκατὸν
  choice: tig-iisang daan
  rationale: Ang κατά kasama ng bilang ay distributibo. Malinaw at likas sa Tagalog ang “tig-iisang daan” para sa mga pangkat na may sandaang katao.
- source_word: κατὰ πεντήκοντα
  choice: tiglilimampu
  rationale: Pinananatili nito ang distributibong diwa at ang pagkakapantay ng dalawang bilang sa maikli at natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “naupo” bilang natural na katumbas sa konteksto ng pagkain; pinanatili ang pag-uulit at distributibong ayos sa “pangkat-pangkat—tig-iisang daan at tiglilimampu.”
