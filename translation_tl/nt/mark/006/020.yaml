    text: May mga manuskritong kababasahan ng “marami siyang ginagawa” sa halip na “lubha siyang nalilito.”
    reason: textual_variant
  revision_rationale: Pinanatili ang SBLGNT na ἠπόρει (“lubha siyang nalilito”) at ang makabuluhang variant sa talababa. Inayos ang mga pang-ugnay, panghalip, at aspekto upang maging mas natural ang Filipino habang pinananatili ang pagkatakot ni Herodes, ang pagkilala niya sa katuwiran at kabanalan ni Juan, ang pagprotekta niya rito, at ang tensiyon ng pagkalito at malugod na pakikinig.
