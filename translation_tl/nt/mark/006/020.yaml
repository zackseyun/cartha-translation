revisions:
- from: Sapagkat natatakot si Herodes kay Juan, dahil alam niyang matuwid at banal itong tao, kaya iniingatan niya ito. Kapag naririnig niya si Juan, labis siyang nalilito[a], ngunit malugod pa rin siyang nakikinig dito.
  to: Sapagkat natatakot si Herodes kay Juan, dahil alam niyang si Juan ay isang matuwid at banal na tao, at pinoprotektahan niya siya. Sa tuwing pinakikinggan niya si Juan, lubha siyang nalilito[a], ngunit malugod niya pa rin siyang pinakikinggan.
  rationale: Pinanatili ang SBLGNT na ἠπόρει (“lubha siyang nalilito”) at ang makabuluhang variant sa talababa. Inayos ang mga pang-ugnay, panghalip, at aspekto upang maging mas natural ang Filipino habang pinananatili ang pagkatakot ni Herodes, ang pagkilala niya sa katuwiran at kabanalan ni Juan, ang pagprotekta niya rito, at ang tensiyon ng pagkalito at malugod na pakikinig.
