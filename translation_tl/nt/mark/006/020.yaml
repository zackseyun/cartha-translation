id: MRK.6.20
reference: Mark 6:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: tl
  text: Sapagkat natatakot si Herodes kay Juan, dahil alam niyang si Juan ay isang matuwid at banal na tao, at pinoprotektahan niya siya. Sa tuwing pinakikinggan niya si Juan, lubha siyang nalilito[a], ngunit malugod niya pa rin siyang pinakikinggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May mga manuskritong kababasahan ng “marami siyang ginagawa” sa halip na “lubha siyang nalilito.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: natatakot
  rationale: Pinananatili nito ang tuwirang diwa ng patuloy na pagkatakot ni Herodes kay Juan, habang hinahayaang ipakita ng konteksto na may kasama rin itong pagkilala sa pagkatao ni Juan.
- source_word: εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον
  choice: dahil alam niyang matuwid at banal itong tao
  rationale: Likas na ipinahahayag sa Tagalog ang sanhi na ipinahihiwatig ng participle; ang “matuwid” at “banal” ay kapuwa nagpapanatili sa moral at panrelihiyong paglalarawan kay Juan.
- source_word: συνετήρει αὐτόν
  choice: iniingatan niya ito
  rationale: Ipinahihiwatig ng pandiwa ang pag-iingat o pagprotekta kay Juan. Ang “iniingatan” ay natural at hindi labis na nagpapaliwanag kung paano ito ginawa.
- source_word: ἀκούσας αὐτοῦ
  choice: Kapag naririnig niya si Juan
  rationale: Ang temporal na participle kasama ng mga imperfect na pandiwa ay natural na tumutukoy sa paulit-ulit na pangyayari; inuulit ang pangalang Juan upang maiwasan ang kalituhan sa mga panghalip.
- source_word: πολλὰ ἠπόρει
  choice: labis siyang nalilito
  rationale: Ang ἠπόρει ay nagpapahayag ng matinding pagkalito o kawalan ng kasagutan, at ang πολλὰ ay nagpapalakas sa antas nito.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ngunit malugod pa rin siyang nakikinig dito
  rationale: Ang “malugod” ay nagpapahayag ng kasiyahan o kusang-loob na pakikinig. Ang “ngunit…pa rin” ay malinaw na naghahatid ng tunay na tensiyon sa pagitan ng pagkalito at masayang pakikinig.
theological_decisions:
- issue: Tekstuwal na pagkakaiba sa sugnay matapos banggitin ang pakikinig ni Herodes kay Juan
  choice: 'Sinunod ang SBLGNT na ἠπόρει: “labis siyang nalilito.”'
  alternative: 'May mga manuskritong may ἐποίει: “marami siyang ginagawa.”'
  rationale: Ang pangunahing tekstong ibinigay ay may ἠπόρει, na nagpapanatili sa tensiyon ng pagkalito ni Herodes at ng malugod niyang pakikinig. Dahil malaki ang epekto ng ibang pagbasa sa kahulugan, inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/dito” para kay Juan alinsunod sa natural na gamit sa Filipino at upang maiwasan ang sunod-sunod na malabong “niya.”
