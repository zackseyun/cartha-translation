translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang nakaraang panahunan sa salaysay ayon sa natural na kumbensiyon sa Tagalog, bagaman historical present ang ilang pandiwa sa Griyego. Walang kailangang footnote.
