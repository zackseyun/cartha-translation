  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: tl
  text: Ngunit sinabi niya sa kanila, “Ilang tinapay ang mayroon kayo? Pumunta kayo at tingnan ninyo.” Nang malaman nila, sinabi nila, “Lima, at dalawang isda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: tinapay
  rationale: Ang karaniwang salitang “tinapay” ay natural sa modernong Tagalog at sapat na kumakatawan sa mga bilog o piraso ng tinapay na tinutukoy sa konteksto.
- source_word: ὑπάγετε ἴδετε
  choice: Humayo kayo at tingnan ninyo
  rationale: Pinananatili ang dalawang pautos at ang pangmaramihang kausap; ang “humayo” ay dignified ngunit malinaw sa karaniwang mambabasa.
- source_word: γνόντες
  choice: Nang malaman nila
  rationale: Ipinapahayag ang resultang kaalaman matapos nilang tingnan, nang hindi nagdaragdag kung paano nila ito natiyak.
- source_word: ἰχθύας
  choice: isda
  rationale: Direkta at natural na katumbas; ang bilang ay malinaw na ipinahahayag ng “dalawang.”
