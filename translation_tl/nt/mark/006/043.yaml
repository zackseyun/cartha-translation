translation_notes:
  register: Gumamit ng natural at dignidad na modernong Filipino. Pinili ang “basket” sa halip na mas tiyak na “kaing” upang hindi magdagdag ng anyo o laki na hindi tahasang itinakda ng teksto. Napanatili ang bahagyang siksik at maaaring pag-iba-ibahin na ugnayan ng κλάσματα, κοφίνων, at πληρώματα sa pamamagitan ng talababa.
