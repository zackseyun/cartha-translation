  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: tl
  text: At tinipon nila ang labindalawang basket na punô ng mga piraso[a], pati ang mga natira sa mga isda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “labindalawang basket na puno ng mga piraso.” Sa Griyego, masiksik na pinagsasama ang “mga piraso,” “labindalawang basket,” at salitang maaaring tumukoy sa mga nilalaman o sa daming pumupuno sa mga basket.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: tinipon nila
  rationale: Sa konteksto, ang αἴρω ay tumutukoy sa pagkuha at pagtitipon ng mga natira pagkatapos kumain; natural at malinaw sa Filipino ang “tinipon nila.”
- source_word: κλάσματα
  choice: mga piraso
  rationale: Ang κλάσματα ay mga bahaging naputol o pinagputul-putol. Sapat na malinaw at natural ang “mga piraso,” habang hindi na idinaragdag sa talata ang salitang “tinapay,” na nauunawaan mula sa konteksto.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: labindalawang basket na punô
  rationale: Ipinahahayag nito sa natural na Filipino kapuwa ang bilang ng mga basket at ang diwa ng πλήρωμα bilang buong laman o daming pumupuno sa mga iyon.
- source_word: κόφινος
  choice: basket
  rationale: Karaniwang nauunawaan sa modernong Filipino ang “basket” at hindi nito labis na tinutukoy ang tiyak na laki o anyo ng sisidlan.
- source_word: πληρώματα
  choice: na punô
  rationale: Ipinakikita ng parirala na ang dami ng natipon ay pumuno sa mga basket, nang hindi gumagamit ng alanganing literal na anyo gaya ng “mga kapunuan.”
- source_word: ἀπὸ τῶν ἰχθύων
  choice: mga piraso mula sa mga isda
  rationale: Pinananatili ng “mula sa mga isda” ang diwa ng ἀπό bilang pinagmulan o bahagi. Inulit ang “mga piraso” upang maging buo at natural ang pangungusap sa Filipino, nang hindi tahasang tinutukoy kung gaano karami ang isda.
