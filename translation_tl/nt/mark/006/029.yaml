  source_fidelity: 'Ang salin ay tapat sa pangunahing diwa ng Griyego: matapos nilang mabalitaan ang pangyayari, kumilos ang mga alagad ni Juan, kinuha ang kanyang bangkay, at inilagak ito sa libingan. Gayunman, ang «pumunta sila» ay mas karaniwang katumbas ng ‘went,’ samantalang ἦλθον ay ‘came/came (to the place).’ Ang «dumating sila» ay mas malapit sa pandiwa ng pinagmulan nang hindi nagdaragdag ng destinasyon.'
  naturalness: Likas at malinaw ang «Nang mabalitaan ito» sa modernong Filipino Tagalog, sapagkat ang tinutukoy ay ang balita ng kamatayan ni Juan sa agarang konteksto. Ang «bangkay» ay direkta ngunit marangal at angkop sa salaysay. Mas natural at mas tumpak sa naratibong dating ang «dumating sila» kaysa «pumunta sila.»
  terminology: Ang «mga alagad» ay wastong katumbas ng μαθηταί at pinananatili ang hindi tahasang pagpapangalan sa kanila, gaya ng Griyego; ang antecedent nito sa konteksto ay si Juan na Tagapagbautismo. Ang «bangkay» ay mahusay na salin ng πτῶμα. Katanggap-tanggap ang «libingan» para sa μνημεῖον, bagaman maaari itong sumaklaw sa mas malawak na uri ng pook-libingan; walang kailangang talababa rito.
