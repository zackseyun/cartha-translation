  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: tl
  text: Nang mabalitaan ito ng kanyang mga alagad, dumating sila, kinuha ang kanyang bangkay, at inilagay ito sa isang libingan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Nang mabalitaan ito
  rationale: Ang aorist participle ay may temporal na diwa. Likas sa Tagalog ang “Nang mabalitaan ito,” at ipinahihiwatig ng “ito” ang balita tungkol sa pagpatay kay Juan mula sa agarang konteksto.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: kanyang mga alagad
  rationale: Ang “mga alagad” ang karaniwang salin ng μαθηταί at pinananatili ang ugnayan nila sa kanilang guro. Sa konteksto, si Juan na Tagapagbautismo ang tinutukoy ng panghalip.
- source_word: ἦλθον
  choice: pumunta sila
  rationale: Bagaman maaaring isaling “dumating,” mas natural ang “pumunta sila” sa salaysay na Tagalog para sa pagkilos patungo sa kinaroroonan ng bangkay.
- source_word: ἦραν
  choice: kinuha
  rationale: Saklaw ng αἴρω ang pagbuhat o pagkuha at pagdadala. Ang “kinuha” ay malinaw at natural sa konteksto ng pagkuha sa bangkay para ilibing.
- source_word: τὸ πτῶμα αὐτοῦ
  choice: ang kanyang bangkay
  rationale: Ang πτῶμα ay tahasang tumutukoy sa patay na katawan. Ang “bangkay” ay eksakto, dignified sa konteksto, at hindi nangangailangan ng paliwanag sa talababa.
- source_word: ἔθηκαν
  choice: inilagay
  rationale: Ang “inilagay” ay natural na katumbas ng τίθημι at angkop sa pagkakalagak ng bangkay sa libingan.
- source_word: ἐν μνημείῳ
  choice: sa isang libingan
  rationale: Ang μνημεῖον dito ay isang pook na pinaglalagakan ng patay. Ang “libingan” ay malinaw at karaniwang gamit sa modernong Tagalog.
theological_decisions:
- issue: Tinutukoy ng “kanyang mga alagad”
  choice: Mga alagad ni Juan na Tagapagbautismo
  alternative: Mga alagad ni Jesus
  rationale: Si Juan ang agarang tinutukoy sa salaysay ng pagpatay at pagkuha sa kanyang bangkay. Hindi kailangang idagdag ang pangalan niya sa talata, kaya napapanatili ang anyo at daloy ng Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Pinili ang “bangkay” dahil tahasan din ang Griyegong πτῶμα; iniwasan ang mas malabong “katawan.”
