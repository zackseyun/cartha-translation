  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: tl
  text: At iniutos niya sa kanila na huwag magdala ng anuman para sa paglalakbay, maliban sa isang tungkod lamang—walang tinapay, walang supot[a], at walang salaping tanso[b] sa sinturon nila—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “supot ng manlalakbay,” na ginagamit para sa baon o mga panustos.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tanso”; ibig sabihin, salaping tanso o mga baryang inilalagay sa sinturon.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: iniutos
  rationale: Nagpapahayag ang pandiwa ng isang may-awtoridad na tagubilin. Ang “iniutos” ay malinaw at natural sa Filipino at pinananatili ang lakas ng direktiba.
- source_word: μηδὲν αἴρωσιν
  choice: huwag magdala ng anuman
  rationale: Sa konteksto ng paghahanda sa paglalakbay, ang αἴρω ay tumutukoy sa pagdadala; natural na ipinahahayag ng pariralang ito ang ganap na pagbabawal.
- source_word: εἰς ὁδὸν
  choice: para sa paglalakbay
  rationale: Ipinahihiwatig ng parirala ang mga bagay na dadalhin bilang paghahanda sa paglalakbay, hindi lamang ang literal na daan.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: maliban sa isang tungkod lamang
  rationale: Ang “tungkod” ay angkop sa tungkod ng manlalakbay, at pinananatili ng “lamang” ang diin ng μόνον.
- source_word: ἄρτον
  choice: tinapay
  rationale: Pinananatili ang kongkretong kahulugan ng salitang Griyego sa halip na palawakin ito bilang pagkain sa pangkalahatan.
- source_word: πήραν
  choice: supot
  rationale: Tumutukoy ito sa supot na dinadala ng manlalakbay, lalo na para sa baon o mga panustos; inilalahad sa talababa ang mas tiyak na gamit.
- source_word: ζώνην
  choice: sinturon
  rationale: Ang ζώνη ay sinturon o bigkis sa baywang na maaaring paglagyan ng salapi.
- source_word: χαλκόν
  choice: salaping tanso
  rationale: Literal itong “tanso” ngunit ginagamit dito para sa tansong salapi o mga barya. Pinananatili ng salin ang materyal at nililinaw ang gamit nito bilang salapi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iniutos” upang mapanatili ang awtoridad ng pahayag, habang ang sunod-sunod na “walang” ay nagpapanatili sa mariing ritmo ng mga pagbabawal sa Griyego.
