  yaml_path: translation/nt/mark/006/042.yaml
  text: And they all ate and were satisfied.
translation:
  language: tl
  text: Kumain silang lahat at nabusog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: kumain
  rationale: Ang aorist active ng ἐσθίω ay karaniwang pandiwa para sa pagkain. Likas at sapat ang “kumain”; hindi na kailangang magdagdag ng layon, at ang ideya ng pagkain nang sapat ay ipinahahayag na ng kasunod na pandiwa.
- source_word: πάντες
  choice: silang lahat
  rationale: Ang pangmaramihang pang-uri ay ginamit bilang pangngalan at tumutukoy sa buong karamihan. Ang “silang lahat” ay natural sa Tagalog at malinaw na pinananatili ang saklaw na walang naiwan.
- source_word: ἐχορτάσθησαν
  choice: nabusog
  rationale: Ang passive ng χορτάζω ay nangangahulugang napakain nang sapat o lubos na nasiyahan sa pagkain. Ang “nabusog” ang pinakanatural at tiyak na katumbas sa modernong Tagalog.
- source_word: καὶ ... καὶ
  choice: at ... at ...
  rationale: Payak na pinag-uugnay ng inuulit na καί ang dalawang pangyayari. Sa Tagalog, sapat ang isang “at” sa pagitan ng mga panaguri; hindi kailangang piliting ulitin sa simula dahil magiging di-likas iyon, habang nananatili ang tuwirang daloy ng salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak, dignified, at madaling maunawaan. Pinanatiling maikli ang talata at iniwasan ang hindi kailangan o paulit-ulit na pagdaragdag.
