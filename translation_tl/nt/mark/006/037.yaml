  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: tl
  text: Ngunit sumagot siya sa kanila, “Kayo mismo ang magbigay sa kanila ng makakain.” Sinabi nila sa kanya, “Pupunta ba kami at bibili ng tinapay[a] sa halagang dalawang daang denario[b], at ibibigay iyon sa kanila para kainin nila?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tinapay.” Ang Griyegong ἄρτους ay maaaring mangahulugang “tinapay” o “mga tinapay” (mga loaf).
    reason: lexical_alternative
  - marker: b
    text: Ang isang denario ay karaniwang sahod para sa isang araw ng isang manggagawa o kawal.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: sumagot siya
  rationale: Likas sa makabagong Tagalog ang “sumagot siya” at sapat nitong naihahatid ang karaniwang Griyegong tambalang pahayag; ang literal na “sumagot at nagsabi” ay hindi natural.
- source_word: Δότε ... ὑμεῖς
  choice: Kayo mismo ang magbigay
  rationale: Pinananatili ng “kayo mismo” ang diin ng hayag na panghalip na ὑμεῖς, habang tuwiran pa rin ang pautos na Δότε.
- source_word: φαγεῖν
  choice: ng makakain / upang kainin
  rationale: Ang “makakain” ay natural sa utos na magbigay, samantalang pinananatili ng “upang kainin” sa ikalawang sugnay ang pandiwang pagkakatulad ng orihinal.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Pupunta ba kami at bibili
  rationale: Ipinahahayag nito bilang isang tanong ang deliberative subjunctive at ang kilos na pagpunta bago bumili, nang hindi gumagamit ng matigas na literal na anyo ng participle.
- source_word: δηναρίων διακοσίων
  choice: sa halagang dalawang daang denario
  rationale: Malinaw na ipinakikita ng “sa halagang” na ang genitive phrase ay tumutukoy sa presyo o guguguling halaga.
- source_word: ἄρτους
  choice: tinapay
  rationale: Natural na panumbas ang “tinapay,” ngunit maaaring tumukoy ang Griyego sa mga piraso o buong tinapay; pinananatili ang alternatibong ito sa talababa.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: ibibigay iyon sa kanila upang kainin
  rationale: Pinananatili ang pandiwang “ibigay,” na umaalingawngaw sa utos ni Jesus, sa halip na gawing mas malayang “pakainin sila.”
theological_decisions:
- issue: Himig ng tanong ng mga alagad
  choice: Pupunta ba kami at bibili... ?
  alternative: Dapat ba kaming pumunta at bumili... ?
  rationale: Pinananatili ang deliberative at posibleng nagugulat na himig ng tanong nang hindi tahasang ipinapalagay na pagtutol o kawalan ng pananampalataya.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo mismo” upang mapanatili ang diin, at iniwasan ang sobrang literal na “sumagot at nagsabi.” Inilagay ang mga pananda ng talababa sa mismong mga salitang tinatalakay: “tinapay[a]” at “denario[b].”'
