  to: Ngunit sumagot siya sa kanila, “Kayo mismo ang magbigay sa kanila ng makakain.” Sinabi nila sa kanya, “Pupunta ba kami at bibili ng tinapay[a] sa halagang dalawang daang denario[b], at ibibigay iyon sa kanila para kainin nila?”
