  naturalness: Makabago at marangal ang kabuuang rehistro. Mas natural at mas malinaw ang “para kainin nila” sa huling sugnay kaysa “upang kainin,” nang hindi binabago ang kahulugan.
  terminology: Ang “denario” ay angkop, at sapat ang talababa upang ipaliwanag ang katumbas na pangkabuhayan nito. Ang “tinapay” ay angkop para sa ἄρτους; pinananatili sa talababa ang alternatibong “mga tinapay/loaves.”
