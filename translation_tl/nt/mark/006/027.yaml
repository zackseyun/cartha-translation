  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: tl
  text: At kaagad na nagsugo ang hari ng isang berdugo[a] at inutusan itong dalhin ang ulo ni Juan. Umalis ito at pinugutan ng ulo si Juan sa bilangguan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kawal ng bantay” o “bodyguard.” Gumamit ang Griyego ng salitang hiram sa Latin (spekoulatōr) para sa isang kasapi ng bantay ng pinuno, na sa kontekstong ito ay gumaganap bilang berdugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: kaagad
  rationale: Natural at malinaw na ipinapahayag ang agarang pagkilos na katangian ng salaysay ni Marcos.
- source_word: βασιλεὺς
  choice: ang hari
  rationale: Pinananatili ang mismong tawag ng salaysay kay Herodes, kahit tetrarka ang mas tiyak niyang titulong pampamahalaan.
- source_word: σπεκουλάτορα
  choice: tagapugot
  rationale: Ang hiram na salitang Latin ay tumutukoy sa kawal ng bantay ng pinuno; sa kontekstong ito, gumaganap siya bilang tagapugot. Nililinaw ng salin ang tungkulin niya habang inilalahad sa talababa ang mas literal na mga alternatibo.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: inutusan itong dalhin
  rationale: Likas na salin sa modernong Filipino na pinananatili ang lakas ng utos at ang tagapagpatupad nito.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: ang ulo ni Juan
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa Filipino; malinaw sa konteksto na si Juan ang tinutukoy.
- source_word: ἀπεκεφάλισεν
  choice: pinugutan ng ulo
  rationale: Karaniwan, malinaw, at marangal na katumbas sa Filipino ng pagputol sa ulo bilang pagbitay.
- source_word: ἐν τῇ φυλακῇ
  choice: sa bilangguan
  rationale: Pinananatili ang tiyak na lugar ng pagbitay sa paraang natural sa Filipino.
