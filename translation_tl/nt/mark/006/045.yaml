base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: tl
  text: At kaagad, pinilit niya ang kanyang mga alagad na sumakay sa bangka at mauna sa kabilang panig, patungo sa Betsaida,[a] hanggang sa siya mismo ay magpauwi sa mga tao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papunta sa Betsaida.” Ang Griyegong pang-ukol ay maaaring magpahiwatig ng pangkalahatang direksiyon (“patungo”) o ng mas tiyak na hantungan (“papunta sa”).
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “hanggang sa siya mismo ay magpauwi sa mga tao,” na gumagamit ng pandiwang nasa panahunang pangkasalukuyan sa isang sugnay na temporal. Sa ganitong ugnayan, natural sa Tagalog ang “hanggang sa … magpauwi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: kaagad
  rationale: Pinananatili nito ang mabilis at apurahang takbo ng salaysay na katangian ng Marcos, sa natural na modernong Tagalog.
- source_word: ἠνάγκασεν
  choice: pinilit
  rationale: Ipinahihiwatig ng pandiwa ang matinding pag-uudyok o paglalagay sa ilalim ng pangangailangan; mas malakas ito kaysa simpleng “sinabihan” ngunit hindi nito awtomatikong ipinapalagay ang pisikal na pamimilit.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Ang “mga alagad” ang malinaw at nakaugaliang salin para sa μαθηταί at pinananatili ang ugnayan nila sa kanilang guro.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: na sumakay sa bangka
  rationale: Natural itong paraan sa Tagalog upang ilarawan ang pagpasok at pagsakay sa isang bangka.
- source_word: προάγειν
  choice: mauna
  rationale: Ipinakikita nito na mauunang umalis o magpatuloy ang mga alagad kaysa kay Jesus.
- source_word: εἰς τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Tumutukoy ang parirala sa kabilang panig ng lawa; dignified at malinaw ang “kabilang ibayo” sa kontekstong ito.
- source_word: πρὸς Βηθσαϊδάν
  choice: patungo sa Betsaida
  rationale: Pinananatili ng “patungo” ang diwang direksiyonal ng πρός nang hindi tiyak na ipinapahayag na ang Betsaida ang narating na hantungan.
- source_word: ἕως
  choice: habang
  rationale: Sa konteksto, magkasabay ang pag-una ng mga alagad at ang pagpapauwi ni Jesus sa mga tao. Mas natural sa Tagalog ang “habang,” bagaman maaari ring unawain ang ἕως bilang pagtatakda ng hangganang temporal.
- source_word: αὐτὸς
  choice: siya mismo
  rationale: 'Pinananatili nito ang diin ng tahasang panghalip: si Jesus ang personal na nanatili upang paalisin ang mga tao.'
- source_word: ἀπολύει
  choice: ang nagpapauwi
  rationale: Ang aspektong di-ganap ng “nagpapauwi” ay angkop sa present-tense na anyong Griyego sa temporal na sugnay at natural sa pagsasalaysay sa Tagalog.
- source_word: τὸν ὄχλον
  choice: sa mga tao
  rationale: Sa kontekstong ito, natural na tumutukoy ang kolektibong “crowd” sa nagkakatipong mga tao; ang plural na anyo ay mas karaniwan sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinilit” upang mapanatili ang lakas ng ἠνάγκασεν, at “habang … nagpapauwi” upang maging natural ang temporal na ugnayan at aspektong pandiwa nang hindi inaalis ang alternatibong pagbasa na “hanggang.”
