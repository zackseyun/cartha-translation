review_pass:
  verdict: revise
  source_fidelity: Ang “habang” ay hindi sapat na katumbas ng ἕως, na nagtatakda ng hangganang temporal (“hanggang sa”), hindi lamang sabayang kilos. Napananatili ng rebisyon ang diin ng αὐτός sa “siya mismo” at ang direksiyonal na nuance ng πρός sa “patungo sa Betsaida.”
  naturalness: Natural at malinaw sa modernong Filipino ang “kabilang panig” kaysa “kabilang ibayo.” Ang “hanggang sa siya mismo ay magpauwi” ay mas idiomatiko at mas tumpak kaysa sa progresibong “habang … nagpapauwi” sa pangungusap na ito.
  terminology: Ang “mga alagad,” “bangka,” “Betsaida,” at “mga tao” ay angkop sa rehistro at sa karaniwang terminolohiya. Ang “pinilit” ay wastong nagpapanatili ng lakas ng ἠνάγκασεν nang hindi kinakailangang magpahiwatig ng pisikal na dahas.
  issues:
  - severity: medium
    issue: Ang pangunahing salin na “habang siya mismo ang nagpapauwi” para sa ἕως ay nagbabago sa temporal na ugnayan.
    rationale: Ang ἕως ay karaniwang “hanggang sa/until” at itinatakda ang hangganan kaugnay ng pagpapauwi sa karamihan. Maaaring magmungkahi ang “habang” ng simpleng pagkakasabay na hindi malinaw na nasa Griyego.
  - severity: low
    issue: Ang “kabilang ibayo” ay hindi ang pinakanatural na modernong Filipino.
    rationale: Mas karaniwan at malinaw ang “kabilang panig,” habang pinananatili ang kahulugang εἰς τὸ πέραν.
  - severity: medium
    issue: Hindi tumpak ang kasalukuyang talababa b dahil inilalarawan nito ang salin na “habang” na hindi dapat maging pangunahing pagbasa ng ἕως.
    rationale: Dapat ipaliwanag ng talababa ang present-tense na ἀπολύει at ang natural na Tagalog na pagsasalin nito sa sugnay na may “hanggang sa,” nang hindi itinatanghal ang “habang” bilang katumbas.
