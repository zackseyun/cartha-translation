revisions:
- from: At kaagad, pinilit niya ang kanyang mga alagad na sumakay sa bangka at mauna sa kabilang ibayo, patungo sa Betsaida,[a] habang siya mismo ang nagpapauwi sa mga tao.[b]
  to: At kaagad, pinilit niya ang kanyang mga alagad na sumakay sa bangka at mauna sa kabilang panig, patungo sa Betsaida,[a] hanggang sa siya mismo ay magpauwi sa mga tao.[b]
  rationale: Pinalitan ang “habang” ng “hanggang sa” upang tumpak na maipakita ang ἕως. Pinalitan din ang “kabilang ibayo” ng mas natural na “kabilang panig” at inihanay ang talababa b sa binagong, mas tapat na temporal na pagsasalin.
