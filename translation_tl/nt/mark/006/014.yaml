  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: tl
  text: At nabalitaan ito ni Haring Herodes, sapagkat naging tanyag na ang pangalan niya. Sinasabi ng mga tao, “Si Juan na Tagapagbautismo[a] ay ibinangon mula sa mga patay[b], at dahil dito, kumikilos sa kanya ang mga kapangyarihang ito[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na katawagan, “Juan Bautista.”
    reason: lexical_alternative
  - marker: b
    text: 'O “bumangon mula sa mga patay.” Balintiyak ang pandiwang Griyego: “ibinangon.”'
    reason: alternative_reading
  - marker: c
    text: O “mga kapangyarihang gumagawa ng himala” o “mga makapangyarihang gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Haring Herodes
  rationale: Likas sa Filipino ang ayos na “Haring Herodes,” at tuwirang naipapahayag nito ang βασιλεύς.
- source_word: ἤκουσεν
  choice: nabalitaan ito
  rationale: Walang tahasang layon ang pandiwa sa Griyego; ang “ito” ay natural na tumutukoy sa naunang salaysay tungkol sa gawain at pagkakilala kay Jesus nang hindi nagdaragdag ng bagong impormasyon.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: sapagkat naging tanyag na ang pangalan niya
  rationale: Pinananatili ang idyomang “pangalan niya,” samantalang ipinahahayag ng “naging tanyag” ang diwa ng pagiging hayag at malawak na pagkakilala.
- source_word: ἔλεγον
  choice: sinasabi ng mga tao
  rationale: Ang pandiwang maramihan ay may di-tiyak na simuno; natural itong ipinahahayag sa Filipino bilang “ng mga tao.”
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Juan na Tagapagbautismo
  rationale: Pinananatili ng “Tagapagbautismo” ang pandiwang diwa ng participle—ang taong nagbabautismo—sa halip na gawing isang di-malinaw na minanang titulo lamang.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: ay ibinangon mula sa mga patay
  rationale: Pinananatili ng “ibinangon” ang tahasang balintiyak na anyo ng perfect passive ἐγήγερται; ang “mula sa mga patay” ay malapit sa ἐκ νεκρῶν.
- source_word: διὰ τοῦτο
  choice: kaya
  rationale: Maikli at natural na ipinahahayag ng “kaya” ang bunga o dahilang ipinapalagay sa pahayag.
- source_word: ἐνεργοῦσιν
  choice: kumikilos
  rationale: Ipinapakita ng pangkasalukuyang “kumikilos” ang nagpapatuloy na bisa o gawain.
- source_word: αἱ δυνάμεις
  choice: ang mga kapangyarihang ito
  rationale: Tuwirang pinananatili ang pangmaramihang “mga kapangyarihan” at iniiwasang ipasiya kung abstraktong kapangyarihan o mga himalang gawa ang eksaktong tinutukoy.
- source_word: ἐν αὐτῷ
  choice: sa kanya
  rationale: Malapit ito sa ἐν αὐτῷ at pinananatili ang ideyang ang mga kapangyarihan ay kumikilos sa kanya; hindi ito pinadulas bilang “sa pamamagitan niya.”
theological_decisions:
- issue: Paglalahad sa ἐγήγερται sa konteksto ng muling pagkabuhay
  choice: ibinangon mula sa mga patay
  alternative: bumangon mula sa mga patay
  rationale: Tahasan ang balintiyak na anyo sa Griyego. Pinananatili ito upang hindi palitan ng mas aktibong pahayag ang sinabi ng teksto.
- issue: Paglalahad sa Ἰωάννης ὁ βαπτίζων
  choice: Juan na Tagapagbautismo
  alternative: Juan Bautista
  rationale: Mas malinaw na naihahayag ng pangunahing salin ang pandiwang diwa ng participle, habang ibinibigay sa talababa ang tradisyonal at pamilyar na titulo.
- issue: Saklaw ng αἱ δυνάμεις
  choice: mga kapangyarihang ito
  alternative: mga kapangyarihang gumagawa ng himala / mga makapangyarihang gawa
  rationale: Maaaring tumukoy ang δύναμεις sa mga kapangyarihan o sa mga himalang gawa. Pinananatili ng salin ang lawak at bahagyang kalabuan ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na may marangal at madaling maunawaang himig. Ginamit ang “nabalitaan” at “naging tanyag” para sa natural na daloy, ngunit pinanatili ang “pangalan niya,” ang balintiyak na “ibinangon,” at ang sadyang malawak na “mga kapangyarihan” upang manatiling malapit sa Griyego.
