  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Saanmang bahay kayo pumasok, manatili kayo roon hanggang sa umalis kayo sa lugar na iyon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “hanggang sa umalis kayo mula roon.” Mas literal sa Griyego ang “hanggang sa lumabas kayo mula roon,” ngunit malamang na tumutukoy ito rito sa pag-alis sa lugar na iyon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: paulit-ulit niyang sinasabi
  rationale: Ang imperpektong anyo ay maaaring magpahiwatig ng nagpapatuloy o inuulit na pagsasalita. Likas sa salaysay na Filipino ang pariralang ito at malinaw nitong naipapakita ang aspektong iyon.
- source_word: Ὅπου ἐὰν
  choice: saanmang
  rationale: Nagpapahayag ang kombinasyong ito ng di-tiyak na lugar, kaya ang “saanmang” ay maikli, natural, at tumpak.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: bahay kayo pumasok
  rationale: Likas sa Filipino ang ayos na “Saanmang bahay kayo pumasok,” at naipapahayag nito ang pagpasok sa isang bahay nang hindi ginagaya nang pilit ang Griyegong pang-ukol.
- source_word: οἰκίαν
  choice: bahay
  rationale: Pangunahing tinutukoy rito ang pisikal na bahay na tutuluyan; mas tuwiran ito kaysa “tahanan,” na maaaring magdiin sa sambahayan o damdamin ng pagiging tahanan.
- source_word: ἐκεῖ μένετε
  choice: manatili kayo roon
  rationale: Ang “manatili” ay dignificado at malinaw na utos na huwag lumipat ng tinutuluyang bahay.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: hanggang sa umalis kayo sa lugar na iyon
  rationale: Ipinahihiwatig ng konteksto na mananatili sila sa bahay hanggang sa lisanin nila ang lokalidad. Inilalahad ito nang natural habang itinatala sa talababa ang mas literal at hindi gaanong tiyak na pagbasa.
theological_decisions:
- issue: Saklaw ng ἐκεῖθεν sa sugnay ng pag-alis
  choice: Manatili sa iisang bahay hanggang sa umalis sa lugar na iyon
  alternative: Manatili roon hanggang sa lumabas o umalis mula roon
  rationale: Sa konteksto ng tagubilin tungkol sa tutuluyan sa pagmimisyon, malamang na tumutukoy ito sa pag-alis sa lokalidad, hindi lamang sa paglabas ng bahay. Gayunman, hindi lubos na tinutukoy ng Griyego ang saklaw, kaya pinananatili sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “paulit-ulit niyang sinasabi” upang malinaw na katawanin ang imperpektong aspekto, at “manatili” upang mapanatili ang mariin ngunit natural na tono ng tagubilin.
