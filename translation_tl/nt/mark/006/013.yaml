  source_fidelity: 'Tumpak na naihahatid ng salin ang tatlong magkakaugnay na kilos sa Griyego: ang paulit-ulit o nagpapatuloy na pagpapalayas ng maraming demonyo, pagpapahid ng langis sa maraming maysakit, at pagpapagaling sa kanila. Hindi nito idinadagdag o binabawasan ang ugnayan ng pagpapahid ng langis at pagpapagaling.'
