id: MRK.6.13
reference: Mark 6:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: tl
  text: Nagpapalayas sila ng maraming demonyo, nagpapahid ng langis[a] sa maraming maysakit, at nagpapagaling sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “langis ng olibo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια
  choice: mga demonyo
  rationale: Tuwirang katumbas ito ng pangngalang tumutukoy sa masasamang espiritu; hindi ipinalit ang “maruruming espiritu,” sapagkat ibang katawagan iyon sa Griyego.
- source_word: πολλὰ
  choice: maraming
  rationale: Pinananatili nito ang payak na dami na ipinahahayag ng Griyego.
- source_word: ἐξέβαλλον
  choice: nagpapalayas
  rationale: Ang aspektong imperpektibo ng pandiwang Filipino ay angkop sa nagpapatuloy o paulit-ulit na pagkilos na ipinahihiwatig ng imperfect sa Griyego.
- source_word: ἤλειφον
  choice: nagpapahid
  rationale: Likas sa modernong Filipino ang “nagpapahid ng langis” at naihahatid nito kapwa ang paglalagay ng langis at ang imperpektibong aspekto.
- source_word: ἐλαίῳ
  choice: langis
  rationale: Ang pangkalahatang “langis” ay sapat sa pangunahing teksto; malamang na langis ng olibo ito sa sinaunang konteksto, kaya inilagay ang mas tiyak na anyo sa talababa.
- source_word: ἀρρώστους
  choice: mga maysakit
  rationale: Natural at malinaw itong tawag sa mga taong may karamdaman sa kasalukuyang Filipino.
- source_word: ἐθεράπευον
  choice: nagpapagaling sa kanila
  rationale: Ipinahahayag nito ang pagpapagaling sa mga maysakit at pinananatili ang nagpapatuloy o paulit-ulit na aspekto ng pandiwang Griyego.
- source_word: καὶ
  choice: at / kuwit
  rationale: Pinananatili ang magkakasunod at magkakaugnay na mga kilos, habang gumagamit ng likas na bantas sa Filipino upang maiwasan ang mabigat na pag-uulit ng “at.”
theological_decisions:
- issue: Gampanin ng pagpapahid ng langis kaugnay ng pagpapagaling
  choice: Inilarawan lamang ang mga kilos ayon sa salaysay, nang hindi ipinapahiwatig na ang langis mismo ang sanhi ng paggaling o na isa itong sakramental na mekanismo.
  alternative: Maaaring unawain na ang langis mismo ang nagdulot ng paggaling, o na lubos lamang itong sagisag at walang anumang gampanin sa kilos ng pagpapagaling.
  rationale: Magkasamang iniulat ng talata ang pagpapahid ng langis at pagpapagaling, ngunit hindi nito ipinaliliwanag ang eksaktong kaugnayan ng dalawa. Kaya pinananatili ng salin ang tensiyong ito nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong, dignificado, at madaling maunawaang Filipino. Ginamit ang imperpektibong mga pandiwa upang katawanin ang nagpapatuloy o paulit-ulit na mga kilos sa buod ng salaysay. Inilagay ang talababa pagkatapos ng “langis,” ang salitang aktuwal na may leksikal na alternatibo.
