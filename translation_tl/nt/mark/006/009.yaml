  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: tl
  text: Subalit magsuot sila ng mga sandalyas at huwag silang magsuot[a] ng dalawang tunika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “huwag silang magbihis ng dalawang tunika.” Maaaring tumukoy ang Griyegong pandiwa sa kilos ng pagsusuot o sa kalagayan ng pagkakasuot.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: kundi
  rationale: Ipinakikita ang pagsalungat o eksepsiyon kaugnay ng naunang mga tagubilin sa paglalakbay; natural at maikli ang “kundi” sa kontekstong ito.
- source_word: ὑποδεδεμένους
  choice: magsuot sila
  rationale: Ang perpektong participle ng ὑποδέομαι ay gumaganap dito bilang utos at tumutukoy sa pagkakaroon ng sandalyas sa paa; malinaw sa modernong Tagalog ang “magsuot sila.”
- source_word: σανδάλια
  choice: mga sandalyas
  rationale: Tuwiran at karaniwang katumbas ng pangmaramihang pangngalan.
- source_word: μὴ ἐνδύσησθε
  choice: huwag magsuot
  rationale: Ang aorist middle subjunctive na may μή ay isang pagbabawal. Maaaring tumukoy ang pandiwa sa pagsusuot bilang kilos o sa pagkakasuot bilang kalagayan; likas sa Tagalog ang “huwag magsuot” at napananatili nito ang dalawang posibilidad.
- source_word: δύο
  choice: dalawang
  rationale: Tuwirang pinananatili ang bilang.
- source_word: χιτῶνας
  choice: tunika
  rationale: Ang χιτών ay pangunahing kasuotang isinusuot malapit sa katawan; mas tiyak at hindi anakronistiko ang “tunika” kaysa “damit” o “kamiseta.”
