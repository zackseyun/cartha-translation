  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: tl
  text: At limang libong lalaki ang kumain ng mga tinapay[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay.” Ang salitang Griyego ay maaaring mangahulugan ng tinapay bilang pagkain o ng mga partikular na tinapay; dito, tumutukoy ito sa mga tinapay sa salaysay ng pagpapakain.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “mga lalaki”—partikular na mga lalaking nasa hustong gulang, hindi pangkalahatang katawagan para sa mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: ay
  rationale: Ginamit ang karaniwang panandang panaguri sa Filipino upang tuwirang ipahayag ang kabuuang bilang, nang hindi idinaragdag ang diwa ng “binilang.”
- source_word: οἱ φαγόντες
  choice: ang mga kumain
  rationale: Likas at malinaw itong katumbas ng articular aorist participle at tinutukoy ang pangkat ayon sa natapos nilang pagkain.
- source_word: τοὺς ἄρτους
  choice: mga tinapay
  rationale: Ang pangmaramihang anyo ay tumutukoy sa mga partikular na tinapay na ipinamahagi sa salaysay, habang pinananatili sa talababa ang posibleng kolektibong saling “tinapay.”
- source_word: πεντακισχίλιοι
  choice: limang libo
  rationale: Tuwirang katumbas ng bilang sa Griyego at natural sa Filipino.
- source_word: ἄνδρες
  choice: lalaki
  rationale: Pinananatili nito ang tiyak na pagtukoy ng Griyego sa mga lalaki, sa halip na gawing pangkalahatang “mga tao.”
theological_decisions:
- issue: Tiyak-sa-kasariang katawagan sa pagbibilang
  choice: Isinalin ang ἄνδρες bilang “lalaki” sa pangunahing teksto.
  alternative: mga tao
  rationale: Ang Griyego ay gumagamit ng katawagang tiyak na tumutukoy sa mga lalaki, hindi ng pangkalahatang salita para sa mga tao. Hindi dapat palawakin ng salin ang saklaw ng mismong bilang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang ayos na nakatuon muna sa mga kumain at saka sa kanilang bilang, gaya ng Griyego, nang hindi nagiging di-likas sa Tagalog.
