id: MRK.6.25
reference: Mark 6:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: tl
  text: Agad siyang pumasok at nagmadaling lumapit sa hari at humiling, “Gusto kong ibigay mo sa akin ngayon din, sa isang pinggan, ang ulo ni Juan na Tagapagbautismo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na tawag, “Juan Bautista.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: pumasok
  rationale: Tuwirang inilalarawan ng aorist participle ang pagpasok niya sa kinaroroonan ng hari; natural at malinaw sa makabagong Tagalog ang “pumasok.”
- source_word: εὐθὺς
  choice: Agad
  rationale: Pinananatili nito ang madalas na diin ni Marcos sa agarang pagkilos at malinaw itong naiiba sa ἐξαυτῆς na nasa mismong kahilingan.
- source_word: μετὰ σπουδῆς
  choice: nagmadaling lumapit
  rationale: Ipinahahayag nito ang mabilis at apurahang paglapit sa hari nang hindi ipinapalagay na masaya o masigasig ang motibo niya.
- source_word: βασιλέα
  choice: hari
  rationale: Bagaman tetrarka si Herodes Antipas ayon sa kasaysayan, “hari” ang tawag sa kaniya ng tekstong Griyego at iyon ang pinanatili.
- source_word: ᾐτήσατο
  choice: humiling
  rationale: Ang pandiwa ay tumutukoy sa paghiling o paghingi; ang “humiling” ay angkop sa pakikipag-usap sa hari at hindi nito labis na ginagawang tahasang pag-uutos ang salita.
- source_word: Θέλω
  choice: Gusto kong
  rationale: Natural at tuwiran itong nagpapahayag ng matigas na kagustuhan ng nagsasalita, gaya ng payak na puwersa ng θέλω.
- source_word: ἵνα ... δῷς μοι
  choice: ibigay mo sa akin
  rationale: Natural na Tagalog ito para sa nilalaman ng kagustuhang ipinahahayag ng ἵνα-clause.
- source_word: ἐξαυτῆς
  choice: ngayon din
  rationale: Pinananatili nito ang hiwalay at mariing utos na agarang gawin ang hinihingi, samantalang ang εὐθύς ay tumutukoy sa pagpasok niya.
- source_word: ἐπὶ πίνακι
  choice: sa isang pinggan
  rationale: Ang πίναξ ay isang malaking pinggan o sisidlang panghain sa piging; malinaw at karaniwan sa Tagalog ang “pinggan” sa kontekstong ito.
- source_word: κεφαλὴν
  choice: ang ulo
  rationale: Tuwirang pinananatili ang malagim at tiyak na hinihingi ng salaysay.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Juan na Tagapagbautismo
  rationale: Isinasalin nito ang malinaw na tungkuling inilalarawan ng βαπτιστής sa halip na basta gamitin ang nakaugaliang anyong “Bautista.”
theological_decisions:
- issue: Paglalarawan kay Juan sa Ἰωάννου τοῦ βαπτιστοῦ
  choice: Juan na Tagapagbautismo
  alternative: Juan Bautista
  rationale: Ang βαπτιστής ay isang mapaglarawang titulo na nangangahulugang taong nagbabautismo. Pinananatili ng “Tagapagbautismo” ang kahulugang iyon, habang inilalagay sa talababa ang pamilyar na tradisyonal na anyo.
translation_notes:
  register: 'Makabago, natural, at marangal na Tagalog. Pinanatili ang dalawang magkaibang pahiwatig ng pagmamadali: “Agad” para sa εὐθύς at “ngayon din” para sa ἐξαυτῆς. Inilagay ang talababa pagkatapos mismo ng titulong “Tagapagbautismo” upang malinaw ang tinutukoy nitong alternatibo.'
