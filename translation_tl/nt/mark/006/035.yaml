base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: tl
  text: Nang lumalim na ang hapon[a], lumapit sa kanya ang kanyang mga alagad at nagsabi, “Liblib ang lugar na ito[b], at lumalim na ang hapon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Nang lumipas na ang maraming oras.”
    reason: lexical_alternative
  - marker: b
    text: O, “Ilang ang lugar na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: na
  rationale: Kasama ng “gabing-gabi,” ipinahihiwatig ng enclitic na “na” na lubhang lumipas na ang oras; natural ito sa modernong Tagalog sa dalawang paglitaw.
- source_word: ὥρας πολλῆς γενομένης
  choice: Nang gabing-gabi na
  rationale: Ang genitive absolute ay nagsasaad na sumapit na ang huling bahagi ng araw. Ang “gabing-gabi na” ay natural at malinaw, samantalang pinananatili ng talababa ang mas literal na anyo.
- source_word: προσελθόντες αὐτῷ
  choice: lumapit sa kanya
  rationale: Tuwirang inilalarawan ng “lumapit” ang paglapit ng mga alagad kay Jesus at angkop sa daloy ng salaysay.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ang kanyang mga alagad
  rationale: Karaniwan, malinaw, at marangal na katumbas ng pariralang nagpapahayag ng pag-aari.
- source_word: ἔλεγον
  choice: nagsabi
  rationale: Natural sa salaysay na Tagalog ang “nagsabi.” Bagaman imperfect ang Griyego, hindi nito kinakailangang ipahiwatig na paulit-ulit silang nagsalita, kaya iniwasang magdagdag ng ganoong kahulugan.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Liblib ang lugar na ito
  rationale: Sa konteksto, ang ἔρημος ay isang ilang o hindi mataong pook. Ang “liblib” ay natural at hindi nagmumungkahing ganap na abandonado ang lugar.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: at gabing-gabi na
  rationale: Natural na Tagalog ito para sa pahayag na malalim na ang oras, at pinananatili ang pag-uulit ng ideya ng pagkaalangan ng oras sa orihinal.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “liblib” bilang pangunahing salin ng ἔρημος upang ipahayag ang pagiging malayo at hindi matao nang hindi magdagdag ng diwang emosyonal; inilagay sa talababa ang mas tradisyonal na “ilang.”
