  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: tl
  text: Paalisin mo sila[a] upang pumunta sila sa mga bukid at nayong nasa paligid at makabili sila ng pagkain para sa kanilang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasalin, “Paalisin mo sila upang, matapos silang umalis patungo sa mga bukid at nayong nasa paligid, makabili sila para sa kanilang sarili ng makakain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Paalisin mo sila
  rationale: Ang aorist imperative ay nag-uutos na paalisin ang mga tao. Likas at malinaw sa modernong Tagalog ang “Paalisin mo sila,” at pinananatili nito ang puwersa ng utos.
- source_word: ἵνα
  choice: upang
  rationale: Ipinakikilala nito ang layunin ng pagpapaalis; malinaw at marangal na katumbas sa Tagalog ang “upang.”
- source_word: ἀπελθόντες
  choice: makapunta sila
  rationale: Bagaman participle na may diwang “pagkaalis,” natural itong isama sa sugnay ng layunin bilang “makapunta sila,” habang nananatili ang pagkakasunod ng kilos.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: mga bukid at nayon sa paligid
  rationale: Sinasaklaw ng ἀγροί ang mga bukid o pook sa kanayunan, at ang κῶμαι ay mga nayon. Ang “sa paligid” ay tapat na nagpapahayag ng κύκλῳ nang hindi ipinapalagay na ang tinutukoy ay eksklusibong mga sakahan.
- source_word: ἀγοράσωσιν
  choice: makabili
  rationale: Karaniwang kahulugan nito ang bumili; ang anyong “makabili” ay natural sa sugnay na nagpapahayag ng layunin.
- source_word: ἑαυτοῖς
  choice: nila
  rationale: Ipinahihiwatig ng parirala na bibili sila para sa sarili nilang pangangailangan. Sa “makabili ng makakain nila,” natural na naipapahayag sa Tagalog ang reflexive-benefactive na diwa.
- source_word: τί φάγωσιν
  choice: ng makakain nila
  rationale: Natural na Tagalog ito para sa di-tiyak na “anumang/maaari nilang kainin,” at malinaw na tumutukoy sa pagkaing bibilhin.
