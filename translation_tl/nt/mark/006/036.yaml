    rationale: Ang ἀπόλυσον ay “paalisin/palayain/dismiss,” hindi partikular na “pauwiin.” Hindi dapat ipahiwatig na tahanan ang kanilang patutunguhan, sapagkat tinutukoy ng kasunod na sugnay ang nakapaligid na mga bukid at nayon.
