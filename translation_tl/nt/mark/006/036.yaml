  source_fidelity: 'Ang pangunahing teksto ay karaniwang tapat sa diwa ng Griyego: utos na paalisin ang mga tao upang makapunta sila sa kalapit na rural na mga lugar at bumili ng pagkain. Gayunman, ang “makakain nila” ay hindi malinaw na naipahahayag ang benefactive reflexive na ἑαυτοῖς (“para sa kanilang sarili”). Sa talababa, ang “pauwiin” ay masyadong tiyak, sapagkat hindi sinasabi ng ἀπόλυσον na pauwiin sila sa kani-kanilang tahanan.'
