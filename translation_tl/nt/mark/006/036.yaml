translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Ginamit ang “paalisin” sa pangunahing teksto upang mapanatili ang tuwirang utos, samantalang inilalahad sa talababa ang mas pormal na estruktura at ang alternatibong “pauwiin.”
