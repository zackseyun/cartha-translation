  terminology: Walang isyung teolohikal o pangngalan. Pinanatili ang “paalisin” para sa ἀπόλυσον, ang layuning “upang,” at ang rural na saklaw ng ἀγροί at κῶμαι. Inalis ang “pauwiin” sa talababa dahil hindi ito ligtas na leksikal na alternatibo sa talata.
