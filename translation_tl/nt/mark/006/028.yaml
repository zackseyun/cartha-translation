base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: tl
  text: Dinala niya ang ulo ni Juan sa isang bandeha[a] at ibinigay ito sa batang babae, at ibinigay ito ng batang babae sa kanyang ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinggang panghain” o “pinggan.” Ang salitang Griyego na πίναξ ay tumutukoy sa isang bandeha, pinggan, o platong ginagamit sa paghahain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: Dinala
  rationale: Tumutukoy ang aorist ng φέρω sa pisikal na pagdadala ng pugot na ulo; natural at tuwiran ang “dinala” sa modernong Tagalog.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: ang ulo nito
  rationale: Malinaw sa naunang konteksto na kay Juan ang ulo. Iniiwasan ng “nito” ang posibleng maling pag-unawa na ang ulo ay sa tagapagdala.
- source_word: ἐπὶ πίνακι
  choice: na nakapatong sa isang malaking pinggan
  rationale: Ang πίναξ ay sisidlang ginagamit sa paghahain, gaya ng platter, bandeha, o pinggan. Ipinahahayag ng “nakapatong sa isang malaking pinggan” ang posisyon at gamit nito sa piging sa natural na Tagalog.
- source_word: ἔδωκεν
  choice: ibinigay
  rationale: Pinananatili ang pag-uulit ng δίδωμι sa dalawang sugnay, gaya ng nasa Griyego.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: sa dalagita / ng dalagita
  rationale: Ang κοράσιον ay tumutukoy sa isang batang babae o dalagita. Ang “dalagita” ay natural at mas tiyak kaysa “babae,” nang hindi gumagamit ng makalumang pananalita.
- source_word: τῇ μητρὶ αὐτῆς
  choice: sa kanyang ina
  rationale: Natural na Tagalog para sa datibo at panghalip na tumutukoy sa ina ng dalagita.
