reference: Mark 6:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: tl
  text: “Hindi ba ito ang karpintero, ang anak ni Maria at kapatid na lalaki nina Santiago, Joses, Judas, at Simon? At hindi ba narito, kasama natin, ang mga kapatid niyang babae?”[a] At nagdamdam sila sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga salitang Griyego ay karaniwang nangangahulugang “kapatid na lalaki” at “mga kapatid na babae.” Gayunman, nauunawaan ng ilang tradisyong Kristiyano ang mga ito bilang mas malalayong kamag-anak o mga kapatid sa ibang magulang.
    reason: alternative_reading
  - marker: b
    text: Sa mas literal na salin, “Natisod sila dahil sa kanya”; maaari ring, “Hindi nila siya matanggap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: karpintero
  rationale: Karaniwang tumutukoy sa isang manwal na manggagawa at maaaring mas malawak kaysa sa paggawa sa kahoy, ngunit “karpintero” ang malinaw, natural, at tradisyonal na kahulugan sa tagpong ito.
- source_word: υἱὸς τῆς Μαρίας
  choice: ang anak ni Maria
  rationale: Tuwirang pinananatili ang kapansin-pansing pagkakakilanlan kay Jesus sa pamamagitan ng kanyang ina, nang hindi ipinapaliwanag kung neutral o mapanlibak ang himig nito.
- source_word: ἀδελφὸς
  choice: kapatid na lalaki
  rationale: Ito ang karaniwang leksikal na kahulugan. Nililinaw ng “na lalaki” ang kasariang tahasang taglay ng Griyego, habang inilalagay sa talababa ang posibleng mas malawak na ugnayang pampamilya.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: Pinananatili ang natatanging anyo ng pangalang Griyego sa talata sa halip na gawing Jose o Joseph.
- source_word: ἀδελφαὶ
  choice: mga kapatid niyang babae
  rationale: Ito ang karaniwang kahulugan ng salitang Griyego at tahasang pinananatili ang pambabaeng anyo nito.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: narito, kasama natin
  rationale: Natural na Filipino na nagpapahayag kapuwa ng lokal na presensiya at ng pagiging kabilang sa pamayanang nagsasalita.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: hindi nila siya matanggap
  rationale: Sa konteksto, inilalarawan nito ang pagtanggi o pagkatisod ng mga kababayan dahil kay Jesus. Ang salin ay malinaw sa modernong Filipino, habang pinananatili sa talababa ang metaporang “natisod.”
theological_decisions:
- issue: Ang eksaktong kaugnayan ng “kapatid na lalaki” at “mga kapatid na babae” kay Jesus
  choice: Panatilihin sa pangunahing teksto ang karaniwang mga katawagang pampamilya nang hindi tinutukoy kung magkakapatid sila sa ina, mga kapatid sa ibang magulang, o mas malalayong kamag-anak.
  alternative: Isalin bilang “mga kamag-anak” o tahasang tukuyin bilang mga kapatid sa ibang magulang.
  rationale: Karaniwang nangangahulugang kapatid na lalaki at kapatid na babae ang ἀδελφός at ἀδελφή, ngunit hindi nilulutas ng talata ang makasaysayang pagtatalo tungkol sa eksaktong ugnayan nila kay Jesus.
- issue: Ang panlipunang himig ng “anak ni Maria”
  choice: Isalin ito nang tuwiran bilang pagkakakilanlang ginamit ng mga kababayan.
  alternative: Dagdagan ng salitang magpapahiwatig na ito ay mapanlibak o, sa kabilang dako, ganap na neutral.
  rationale: Maaaring may mapanlibak na himig ang parirala sa konteksto, ngunit hindi iyon tahasang ipinaliliwanag ng Griyego; kaya hindi ito dapat ipasok sa pangunahing teksto.
- issue: Ang metapora ng pagkatisod sa reaksiyon kay Jesus
  choice: Gawing malinaw sa pangunahing teksto ang pagtangging ipinahihiwatig—“hindi nila siya matanggap”—at ilagay sa talababa ang mas literal na metapora.
  alternative: “Natisod sila dahil sa kanya” o “nagdamdam sila sa kanya.”
  rationale: Pinananatili nito ang puwersa ng reaksiyon sa natural na Filipino nang hindi ikinukulong ang kahulugan sa simpleng pagkasaktan ng damdamin; ipinakikita ng talababa ang anyo at ibang posibleng pagpapahayag ng Griyego.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “karpintero” at mga karaniwang katawagang pampamilya para madaling maunawaan, habang ang mga talababa ay nagpapanatili ng leksikal na lawak at ng tunay na teolohikal na tensiyon.
