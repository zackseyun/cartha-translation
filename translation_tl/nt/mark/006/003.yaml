  naturalness: Natural at marangal ang kabuuang Filipino. Ang “narito, kasama natin” at ang mga katawagang pampamilya ay malinaw. Mas idiomatiko at tiyak sa kontekstong ito ang “nagdamdam sila sa kanya” kaysa “hindi nila siya matanggap.”
