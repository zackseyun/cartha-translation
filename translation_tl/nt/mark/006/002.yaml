  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: tl
  text: Nang sumapit ang Sabbath, nagsimula siyang magturo sa sinagoga. Marami sa mga nakarinig sa kaniya ang namangha at nagsabi, “Saan nakuha ng taong ito ang mga bagay na ito? Ano ang karunungang ito na ibinigay sa kaniya? At paano nagaganap sa pamamagitan ng kaniyang mga kamay ang ganitong makapangyarihang mga gawa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga himala” o “mga gawa ng kapangyarihan.” Ang pangmaramihang salitang Griyego na δυνάμεις ay maaaring tumukoy sa mga mahimalang gawa o mga pagpapamalas ng kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Nang sumapit ang Sabbath
  rationale: Ipinahahayag ng genitive absolute ang kalagayang temporal. Likas sa makabagong Tagalog ang “nang sumapit” at pinananatili nito ang diwang pagdating ng Sabbath.
- source_word: ἤρξατο διδάσκειν
  choice: nagsimula siyang magturo
  rationale: Tuwirang ipinapakita ang ingressive na diwa ng ἄρχομαι kasama ng pawatas.
- source_word: συναγωγῇ
  choice: sinagoga
  rationale: Sa kontekstong Judio, malinaw na tumutukoy ito sa kinikilalang lugar at institusyon ng pagtitipon.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: ang maraming nakarinig sa kaniya
  rationale: Natural na inililipat sa Tagalog ang participial construction at ginagawang hayag ang bagay na narinig batay sa konteksto.
- source_word: ἐξεπλήσσοντο
  choice: namangha
  rationale: Ipinahahayag ang matinding pagkagulat o paghanga ng mga nakikinig nang hindi nagpapasok ng dahilan na wala sa teksto.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Saan nakuha ng taong ito ang mga bagay na ito?
  rationale: Ang Πόθεν ay nagtatanong tungkol sa pinagmulan. Ipinahihiwatig ng “taong ito” ang bahagyang mapaglayong tono ng τούτῳ.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Ano ang karunungang ito na ibinigay sa kaniya?
  rationale: Pinananatili ang anyong patanong at ang pasibong “ibinigay,” kaya hindi tinutukoy ng salin kung sino ang nagbigay.
- source_word: αἱ δυνάμεις τοιαῦται
  choice: ganitong makapangyarihang mga gawa
  rationale: Sa konteksto, ang πληθυντικός na δυνάμεις ay tumutukoy sa pambihirang mga gawa. Pinananatili ng “makapangyarihang mga gawa” ang ugnayan sa kapangyarihan nang hindi agad nililimitahan sa salitang “mga himala.”
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: nagaganap sa pamamagitan ng kaniyang mga kamay
  rationale: Pinananatili ang instrumental na larawan ng διά kasama ng “mga kamay” at ang diwang nagaganap ng participle.
theological_decisions:
- issue: Saklaw ng kahulugan ng δυνάμεις
  choice: makapangyarihang mga gawa
  alternative: mga himala; mga gawa ng kapangyarihan
  rationale: Karaniwang tumutukoy ang salita sa pambihira o mahimalang mga gawa sa Marcos, ngunit mas napapanatili ng piniling salin ang mismong konsepto ng kapangyarihan at ang bahagyang lawak ng salitang Griyego.
- issue: Tono ng τούτῳ
  choice: taong ito
  alternative: kaniya; isang ito
  rationale: Naipadarama ng “taong ito” ang mapaglayo at posibleng bahagyang mapanghamak na tono ng demonstrative sa konteksto, nang hindi ito labis na pinatitindi.
- issue: Hindi tinukoy na nagbibigay ng karunungan
  choice: ibinigay sa kaniya
  alternative: ibinigay ng Diyos sa kaniya
  rationale: Pasibo ang Griyego at hindi tahasang pinapangalanan ang nagbibigay; pinananatili ng salin ang ambiguwidad na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Sabbath” at “sinagoga” bilang mga nakikilalang terminong pangkasaysayan. Inilagay ang talababa sa pariralang tinutukoy nito, ang “makapangyarihang mga gawa.”
