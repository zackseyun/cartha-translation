  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Halikayo, kayong-kayo lamang, sa isang liblib na lugar[a] at magpahinga muna kayo.” Sapagkat maraming dumarating at umaalis, at wala man lamang silang pagkakataong kumain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang lugar na walang tao” o “isang tahimik at hiwalay na lugar.” Ang salitang Griyego ay tumutukoy sa isang liblib o halos walang naninirahang lugar, hindi kinakailangang disyerto sa makabagong kahulugan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “wala man lamang silang oras para kumain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Sinabi niya
  rationale: Isinalin ang makasaysayang pangkasalukuyan ng Griyego bilang pangnagdaan, na mas natural sa makabagong salaysay sa Filipino.
- source_word: Δεῦτε
  choice: Halikayo
  rationale: Isang paanyayang pautos na angkop sa pag-anyaya ni Jesus sa mga alagad na sumama at lumayo sa karamihan.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: lumayo muna kayo sa iba
  rationale: Ipinahahayag nito ang diin sa mga alagad mismo at ang pagpunta nilang bukod sa ibang tao, nang hindi inuulit sa Filipino ang magkalapit na ideya sa paraang tunog pilit.
- source_word: ἔρημον τόπον
  choice: isang liblib na lugar
  rationale: Ang ἔρημος dito ay tumutukoy sa isang lugar na hiwalay o walang gaanong naninirahan, hindi kinakailangang isang tuyong disyerto. Likas at malinaw sa Filipino ang “liblib na lugar.”
- source_word: ἀναπαύσασθε ὀλίγον
  choice: makapagpahinga sandali
  rationale: Inihahatid ng “makapagpahinga” ang pagtigil sa gawain upang manumbalik ang lakas, at ng “sandali” ang maikling panahong ipinahihiwatig ng ὀλίγον.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: maraming dumarating at umaalis
  rationale: Pinananatili nito ang patuloy na pagdaloy ng maraming tao sa isang natural na pariralang Filipino.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: wala man lamang silang pagkakataong kumain
  rationale: Ang εὐκαιρέω ay tumutukoy sa pagkakaroon ng angkop na pagkakataon o luwag; ipinakikita ng “man lamang” ang diin ng οὐδέ.
