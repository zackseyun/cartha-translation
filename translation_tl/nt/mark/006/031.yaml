translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” bilang likas na paanyaya at ang “liblib na lugar” upang maiwasan ang maling pahiwatig na tuyong disyerto ang tinutukoy.
