base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: tl
  text: Sapagkat nakita siya ng lahat at nabagabag sila. Ngunit agad siyang nagsalita sa kanila at sinabi sa kanila, “Lakasan ninyo ang loob ninyo! Ako nga.[a] Huwag kayong matakot.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal, “Ako ay” (Griyego: egō eimi), isang anyong walang tahasang panaguri. Maaari rin itong unawain bilang “Ako ito.”'
    reason: Ipinapakita ang literal na anyo at ang karaniwang kontekstuwal na pagkaunawa nang hindi nililimitahan o ipinipilit ang posibleng pahiwatig ng Griyego.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: nabagabag sila
  rationale: Ipinapahayag ang matinding pagkagulo at takot nang hindi pinaliliit ang saklaw ng pandiwang Griyego sa simpleng ‘natakot.’
- source_word: Θαρσεῖτε
  choice: Lakasan ninyo ang inyong loob!
  rationale: Likas at malinaw na pangmaramihang utos sa modernong Tagalog na naghahatid ng diwang magpakatatag o magkaroon ng lakas ng loob.
- source_word: ἐγώ εἰμι
  choice: Ako nga
  rationale: Likas na pahayag ng pagkakakilanlan sa Tagalog na hindi tahasang nagdaragdag ng panghalip na ‘ito’; pinananatili rin sa talababa ang mas literal na anyo at posibleng mas malawak na pahiwatig ng Griyego.
theological_decisions:
- issue: Ang posibleng teolohikal na pahiwatig ng ἐγώ εἰμι
  choice: Isinalin sa teksto bilang ‘Ako nga’ at nilagyan ng talababa tungkol sa literal na ‘Ako ay.’
  alternative: ‘Ako ito’ o ang di-likas na nakabitin na ‘Ako ay’
  rationale: Sa konteksto, maaaring karaniwang pagpapakilala ito, ngunit ang anyong Griyego ay maaari ring magtaglay ng mas malalim na alusyon. Hindi dapat sapilitang alisin o tiyakin ang alusyong iyon sa pangunahing salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang pangmaramihang ‘ninyo/kayong’ dahil marami ang kinakausap ni Jesus; pinanatili ang biglang paglipat ng Griyego mula sa ‘nagsalita’ tungo sa ‘sinabi’ sa natural na paraang Tagalog.
