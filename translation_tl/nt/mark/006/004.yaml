id: MRK.6.4
reference: Mark 6:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: tl
  text: At sinasabi ni Jesus sa kanila, “Walang propetang hindi pinararangalan maliban sa sarili niyang bayan[a], sa gitna ng kaniyang mga kamag-anak[b], at sa sarili niyang sambahayan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sariling lugar” o “lupang tinubuan.” Tumutukoy ang Griyego sa sariling lugar na pinagmulan; sa konteksto, ito ay Nazaret.
    reason: lexical_alternative
  - marker: b
    text: O “mga kaangkan.” Tumutukoy ang Griyego sa mga kamag-anak o kabilang sa sariling angkan.
    reason: lexical_alternative
  - marker: c
    text: O “bahay.” Maaaring tumukoy ang Griyego sa gusali o sa pamilya at iba pang kabilang sa sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman imperpekto ang anyo at maaaring magpahiwatig ng nagpapatuloy na pagsasalita, ang payak na “sinabi” ang likas na anyong pasalaysay sa Tagalog at hindi nito kinakailangang alisin ang aspektong ipinahihiwatig ng konteksto.
- source_word: προφήτης
  choice: propeta
  rationale: Ito ang karaniwan at malinaw na katumbas sa modernong Tagalog.
- source_word: ἄτιμος
  choice: nawawalan ng karangalan
  rationale: Pinananatili nito ang negatibong kayarian at ang usapin ng dangal sa kasabihan, habang mas natural sa Tagalog kaysa sa literal na “walang karangalan.”
- source_word: εἰ μὴ
  choice: maliban
  rationale: Sa negatibong pahayag na ito, nagpapakilala ito ng eksepsiyon, hindi ng kondisyon.
- source_word: πατρίδι
  choice: sarili niyang bayan
  rationale: Ang πατρίς ay tumutukoy sa sariling lugar na pinagmulan; ang “bayan” ay natural sa Tagalog at maaaring tumukoy sa sariling lokalidad gaya ng Nazaret nang hindi ito nililimitahan sa modernong konsepto ng lungsod.
- source_word: συγγενεῦσιν
  choice: mga kamag-anak
  rationale: Tuwirang tumutukoy sa mga kabilang sa sariling angkan at malinaw na naiiba sa sambahayan.
- source_word: οἰκίᾳ
  choice: sambahayan
  rationale: Maaaring tumukoy ang salita sa bahay o sa mga taong bumubuo rito. Ang “sambahayan” ay angkop sa sunod-sunod na pagliit ng saklaw mula bayan, tungo sa kamag-anak, at sa sariling tahanang pangkat.
- source_word: καὶ ... καὶ ... καὶ
  choice: at ... sa gitna ng ... at
  rationale: Napananatili ang pinagsama-samang tatlong saklaw ng kawalan ng karangalan, habang natural ang daloy sa Tagalog.
theological_decisions:
- issue: Saklaw ng kasabihan ni Jesus tungkol sa karangalan ng propeta
  choice: Isinalin bilang pangkalahatang kasabihan na inilalapat ni Jesus sa sitwasyon niya, nang walang idinagdag na paliwanag tungkol sa kaniyang pagiging Mesiyas.
  alternative: Tahasan itong ipakahulugan bilang pahayag na siya ang itinakwil na Mesiyas o bilang pangkalahatang aral tungkol sa kawalan ng pananampalataya.
  rationale: Propeta at karangalan ang tahasang nilalaman ng Griyego. Dapat panatilihin ng salin ang pahiwatig at tensiyong teolohikal nang hindi nagdaragdag ng interpretasyong wala mismo sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sarili niyang bayan” sa halip na mas kolokyal na “sariling bayan niya,” at “sambahayan” upang mapanatili ang pagkakaiba sa mga kamag-anak. Inilagay ang bawat talababa sa kaukulang salita sa pangunahing teksto.
