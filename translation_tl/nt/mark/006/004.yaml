  source_fidelity: 'Ang “hindi nawawalan ng karangalan” ay nagpapahiwatig na ang propeta ay dating may karangalan at saka ito nawala, samantalang ang ἄτιμος ay tumutukoy sa pagiging walang dangal o hindi pinararangalan. Mas tumpak na panatilihin ang kawikaang negatibong kayarian: “Walang propetang hindi pinararangalan, maliban ...” Ang “sinasabi” ay mas malinaw ding nagpapakita ng imperpektong ἔλεγεν nang hindi nagiging di-likas sa salaysay.'
  naturalness: Ang rebisyong kawikaang “Walang propetang hindi pinararangalan, maliban ...” ay natural, malinaw, at marangal sa modernong Filipino Tagalog. Ang pagkakasunod na bayan, kamag-anak, at sambahayan ay nananatiling maayos at nagpapakita ng pagpapakitid ng mga ugnayan.
  terminology: Ang “propeta,” “bayan,” “mga kamag-anak,” at “sambahayan” ay angkop. Pinananatili ng “sambahayan” ang maaaring kahulugang sambahayan/pamilya ng οἰκία, nang hindi inaalis ang alternatibong “bahay” sa talababa.
