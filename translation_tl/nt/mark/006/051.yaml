  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: tl
  text: At sumakay siya sa bangka kasama nila, at tumigil ang hangin. Lubhang-lubha[a] silang namangha[b] sa kanilang kalooban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubos na lubos” o “higit sa sukat.” Sunod-sunod ang mga salitang pampatindi sa Griyego, na literal na may diwang “napakalabis, higit sa sukat.”
    reason: lexical_alternative
