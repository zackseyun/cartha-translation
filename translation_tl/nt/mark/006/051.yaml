    text: Maaari ring “halos wala sa kanilang sarili,” isang idyomatikong pagpapahayag ng lubhang matinding pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: sumakay
  rationale: Sa konteksto ng pagpasok sa isang bangka, ang “sumakay” ang likas at malinaw na katumbas sa modernong Tagalog ng literal na “umakyat/pumasok.”
- source_word: πρὸς αὐτοὺς
  choice: kasama nila
  rationale: Ipinapahayag nito ang kinalabasan ng paglapit ni Jesus sa kanila habang sumasakay siya sa bangka; natural ito sa Tagalog nang hindi binabago ang diwa.
- source_word: πλοῖον
  choice: bangka
  rationale: Ang “bangka” ang angkop na karaniwang tawag sa sasakyang-tubig sa tagpong ito sa Lawa ng Galilea.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: tumigil ang hangin
  rationale: Malinaw nitong ipinahahayag na humupa o tumigil ang pag-ihip ng hangin, nang hindi nagdaragdag ng paliwanag.
- source_word: λίαν ἐκ περισσοῦ
  choice: labis-labis
  rationale: Ang pinagsamang mga salitang Griyego ay matinding nagpapalakas sa antas ng kanilang pagkamangha. Pinananatili ng “labis-labis” ang di-karaniwang diin sa natural na Tagalog.
- source_word: ἐν ἑαυτοῖς
  choice: sa kanilang kalooban
  rationale: Ipinakikita nito na ang matinding reaksiyon ay naganap sa loob nila. Mas natural at marangal ito kaysa sa literal ngunit alanganing “sa kanilang sarili.”
- source_word: ἐξίσταντο
  choice: namangha
  rationale: Sa anyong ito, ang pandiwa ay tumutukoy sa matinding pagkagulat o pagkamangha. Ang “namangha” ay malinaw at hindi nagmumungkahi agad ng pagkawala ng katinuan.
theological_decisions:
- issue: Tindi ng reaksiyon ng mga alagad sa ginawa ni Jesus
  choice: Sa kanilang kalooban ay labis-labis silang namangha
  alternative: Halos mawala sila sa kanilang sarili sa labis na pagkamangha
  rationale: Pinananatili ng salin ang napakatinding diin ng Griyego at ang panloob na reaksiyon ng mga alagad, ngunit hindi ito dinaragdagan ng tiyak na paliwanag tungkol sa kanilang kalagayang pangkaisipan o ng anumang doktrinal na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pasalaysay na teksto. Ginamit ang “labis-labis” upang mapanatili ang natatanging tindi ng Griyego, at “sa kanilang kalooban” upang natural na maipahayag ang panloob na reaksiyon.
