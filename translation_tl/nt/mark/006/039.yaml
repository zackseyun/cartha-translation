  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: tl
  text: At inutusan niya sila na paupuin[b] ang lahat nang pangkat-pangkat[a] sa luntiang damo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, inuulit ang salitang nangangahulugang “mga pangkat,” kaya binibigyang-diin na inayos sila nang pangkat-pangkat para sa pagkain.
    reason: lexical_alternative
  - marker: b
    text: Ang “paupuin” ay salin ng pandiwang Griyego na maaari ring tumukoy sa paghilig habang kumakain, ayon sa karaniwang ayos ng pagkain noong panahong iyon.
    reason: cultural_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: inutusan
  rationale: Ipinahahayag ng pandiwa ang isang may-awtoridad na utos; natural at sapat ang lakas ng “inutusan” sa makabagong Tagalog.
- source_word: αὐτοῖς … πάντας
  choice: niya sila na paupuin ang lahat
  rationale: Pinananatiling magkaiba ang “sila” na tumanggap ng utos at ang “lahat” na pauupuin, alinsunod sa malinaw na sintaks ng Griyego.
- source_word: ἀνακλῖναι
  choice: paupuin
  rationale: 'Transitivo ang gamit dito: ang mga inutusan ang magpapuwesto sa lahat. Mas natural sa Tagalog ang “paupuin” kaysa sa literal ngunit di-karaniwang “pahigain nang nakasandal,” habang maipaliliwanag sa talababa ang kaugalian ng paghilig sa pagkain.'
- source_word: συμπόσια συμπόσια
  choice: nang pangkat-pangkat
  rationale: Ang pag-uulit sa Griyego ay may diwang distributibo. Likas na ipinahahayag ito sa Tagalog ng inuulit na “pangkat-pangkat.”
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: sa luntiang damo
  rationale: Tuwirang inilalarawan ng χλωρός ang sariwa o berdeng χόρτος; malinaw at marangal sa Tagalog ang “luntiang damo.”
