translation:
  language: tl
  text: At humayo sila at ipinangaral nila na dapat magsisi ang mga tao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “na dapat silang magsisi”; ang “sila” ay tumutukoy sa mga nakarinig ng kanilang pangangaral.
    reason: Ipinakikita ang mas literal na pagsasalin ng di-tahasang pangmaramihang simuno at nililinaw ang tinutukoy nito.
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay ng talata sa naunang pagsusugo sa mga alagad nang hindi nagdaragdag ng tiyak na temporal na diwa.
- source_word: ἐξελθόντες
  choice: humayo sila
  rationale: Ang aorist participle ay tumutukoy sa pag-alis ng mga alagad upang isagawa ang kanilang atas. Ang “humayo sila” ay natural at marangal sa salaysay at nagpapahiwatig ng pag-alis na may layunin.
- source_word: ἐκήρυξαν
  choice: ipinangaral
  rationale: Ang κηρύσσω ay pampublikong paghahayag. Ang “ipinangaral” ay likas sa makabagong Filipino sa kontekstong ito at pinananatili ang hayagang pagpapahayag, hindi lamang pribadong pagtuturo.
- source_word: ἵνα
  choice: na dapat
  rationale: Dito ay ipinakikilala ng ἵνα ang nilalaman at hinihinging tugon ng pangangaral. Ang “na dapat” ay malinaw at natural nang hindi ipinipilit kung layunin o nilalaman lamang ang nangingibabaw na gamit.
- source_word: μετανοῶσιν
  choice: magsisi
  rationale: Ang μετανοέω ay tumutukoy sa pagsisising may pagbabago ng isip at direksiyon ng buhay. Ang “magsisi” ang maikli, natural, at may sapat na bigat na salin sa Filipino; hindi ito nililimitahan sa intelektuwal na pagbabago lamang.
theological_decisions:
- issue: Kung gagawing tahasan ang ipinahihiwatig na simuno ng μετανοῶσιν
  choice: na dapat magsisi ang mga tao
  alternative: na dapat silang magsisi
  rationale: Nasa pangmaramihang anyo ang pandiwa ngunit hindi tahasang binabanggit ang simuno; sa konteksto, iyon ay ang mga nakarinig ng pangangaral, hindi ang mga alagad. Nililinaw ng “ang mga tao” ang tinutukoy nang hindi nagdaragdag ng doktrinal na nilalaman, habang inilalagay sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “humayo” para sa maayos na daloy ng salaysay at ang karaniwang terminong “magsisi” upang mapanatili ang buong bigat ng μετανοέω.
