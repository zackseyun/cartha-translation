translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ang ayos ng pangungusap ay nagpapanatili sa paghahambing sa bangkang nasa tubig at kay Jesus na nag-iisa sa lupa.
