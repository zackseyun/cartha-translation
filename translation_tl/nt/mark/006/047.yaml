base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: tl
  text: Nang gumabi na, nasa gitna ng dagat ang bangka, at siya ay nag-iisa sa lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pampang.” Ang sabi sa Griyego ay “sa lupa,” bilang kaibahan sa kinaroroonan ng bangka sa dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Nang gumabi na
  rationale: Likas na modernong Tagalog para sa genitive absolute na nagsasaad ng panahong sumapit na ang gabi.
- source_word: πλοῖον
  choice: ang bangka
  rationale: Ang “bangka” ang angkop at natural sa konteksto ng Galilea; ang “barko” ay maaaring magpahiwatig ng mas malaking sasakyang-dagat.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: nasa gitna ng lawa
  rationale: Malinaw nitong ipinahihiwatig na ang bangka ay malayo na sa pampang. Ginamit ang “lawa” bilang natural na tawag sa anyong-tubig ng Galilea, habang itinatala sa talababa ang mas literal na “dagat.”
- source_word: θάλασσα
  choice: lawa
  rationale: Bagaman literal na “dagat” ang salitang Griyego, ang tinutukoy ay ang Lawa ng Galilea; “lawa” ang mas malinaw sa karaniwang modernong Tagalog, at pinananatili sa talababa ang leksikal na alternatibo.
- source_word: αὐτὸς μόνος
  choice: siya naman ay nag-iisa
  rationale: Pinananatili ng “naman” ang tahasang paghahambing ng kinaroroonan niya sa kinaroroonan ng bangka, at natural na naipapahayag ng “nag-iisa” ang μόνος.
- source_word: ἐπὶ τῆς γῆς
  choice: sa lupa
  rationale: Malapit ito sa literal na Griyego at pinananatili ang kaibahan ng lupa at tubig; ang kontekstuwal na “sa pampang” ay ibinigay bilang alternatibo sa talababa.
