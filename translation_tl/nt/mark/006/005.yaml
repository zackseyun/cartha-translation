  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: tl
  text: At hindi siya makagawa roon ng kahit isang makapangyarihang gawa[a], maliban sa ipinatong niya ang kanyang mga kamay sa ilang maysakit at pinagaling sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang himala” o “anumang gawa ng kapangyarihan.” Sa Griyego, literal na “anumang kapangyarihan”; ginagamit ito ni Marcos para sa mga himalang gawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: hindi siya nakagawa
  rationale: Sa konstruksyong may infinitive, likas itong nagpapahayag sa Filipino ng hindi niya nagawang gawin ang kilos, nang hindi binabago iyon tungo sa simpleng ayaw niyang gawin. Pinananatili nito ang tunay na tensiyon ng pahayag sa konteksto.
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: nakagawa ... ng anumang makapangyarihang gawa
  rationale: Ang ποιέω ay 'gumawa,' at ang δύναμις sa gamit na ito ni Marcos ay tumutukoy sa isang himalang nagpapakita ng kapangyarihan. Pinananatili ng 'makapangyarihang gawa' ang ugnay sa kapangyarihan at hindi agad pinapaliit ang kahulugan sa terminong 'himala' lamang.
- source_word: εἰ μὴ
  choice: maliban sa
  rationale: Malinaw at natural na ipinakikilala nito ang eksepsiyon sa naunang negatibong pahayag.
- source_word: ὀλίγοις ἀρρώστοις
  choice: ilang maysakit
  rationale: Maikli, natural, at tumpak na tumutukoy sa maliit na bilang ng mga taong may karamdaman.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: pagpapatong niya ng mga kamay sa
  rationale: Karaniwang Filipino para sa aktuwal na kilos ng paglalagay ng mga kamay sa mga maysakit.
- source_word: ἐθεράπευσεν
  choice: pagpapagaling sa kanila
  rationale: Tumpak na inilalarawan ang paggaling na ginawa niya at malinaw na tinutukoy ng 'sa kanila' ang ilang maysakit.
theological_decisions:
- issue: Kung palalambutin ang οὐκ ἐδύνατο upang maiwasang magpahiwatig ng limitasyon kay Jesus
  choice: 'Panatilihin ang tuwirang diwa: ''hindi siya nakagawa roon'''
  alternative: '''hindi niya piniling gumawa roon'' o ''ayaw niyang gumawa roon'''
  rationale: Tahasang gumagamit ang Griyego ng δύναμαι na may pagtanggi. Hindi dapat lutasin ng salin ang teolohikal na tensiyon sa pamamagitan ng pagpapalit sa kawalan ng kakayahan bilang simpleng kawalan ng kagustuhan. Ang eksepsiyon sa mismong talata at ang kasunod na konteksto ang nagbibigay ng naratibong paglilinaw.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'makapangyarihang gawa' upang mapanatili ang leksikal na kaugnayan ng δύναμις sa kapangyarihan; inilagay sa talababa ang mas karaniwang alternatibong 'himala.'
