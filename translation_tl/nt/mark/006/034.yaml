  terminology: Ang “nahabag,” “pastol,” at “Kasulatan” ay angkop sa marangal ngunit madaling unawaing rehistro. Pinananatili ng “mga tupang walang pastol” ang matalinghaga at biblikal na pananalita nang walang dagdag na pagpapakahulugan sa teksto.
