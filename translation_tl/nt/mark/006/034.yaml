base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: tl
  text: Pagbaba niya mula sa bangka, nakita niya ang napakaraming tao. Nahabag siya sa kanila sapagkat para silang mga tupang walang pastol.[a] At nagsimula siyang magturo sa kanila ng maraming bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang larawang “mga tupang walang pastol” ay umaalingawngaw sa mga pahayag ng Kasulatan tungkol sa mga taong walang tapat na pamumuno. Ihambing ang Bilang 27:17; 1 Hari 22:17; Ezekiel 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Pagdating niya sa pampang
  rationale: Literal itong tumutukoy sa paglabas, ngunit sa konteksto ng pagtawid nila sakay ng bangka (Marcos 6:32–33), likas na ipinahihiwatig ang pagdating ni Jesus sa pampang. Inihahatid ng salin ang diwa ng tagpo nang hindi tahasang nagdaragdag ng salitang “bangka.”
- source_word: πολὺν ὄχλον
  choice: napakaraming tao
  rationale: Likas at malinaw itong modernong Tagalog para sa isang malaking pulutong, at pinananatili nito ang diin sa dami.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: Nahabag siya sa kanila
  rationale: Ang pandiwa ay nagpapahayag ng taimtim at malalim na habag. Ang “nahabag” ay maikli, dignificado, at natural sa Tagalog.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: para silang mga tupang walang pastol
  rationale: Pinananatili nang tuwiran ang matalinghagang larawan at hindi ipinapaliwanag sa pangunahing teksto kung anong uri ng pamumuno ang kulang.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: nagsimula siyang magturo sa kanila ng maraming bagay
  rationale: Pinananatili ang pasimulang aspekto ng ἤρξατο at ang malawak na nilalaman ng πολλά, sa halip na gawing “nang matagal,” na maaaring tumukoy lamang sa haba ng oras.
theological_decisions:
- issue: Larawan ng mga tupang walang pastol
  choice: Panatilihin ang metaporang “mga tupang walang pastol” nang walang paliwanag sa pangunahing teksto.
  alternative: Palawakin bilang “mga taong walang tapat na espirituwal na pinuno.”
  rationale: Malamang na umaalingawngaw ang pananalita ng Lumang Tipan tungkol sa bayan ng Diyos at sa kanilang mga pinuno, ngunit hindi dapat tahasang takdaan ng salin ang buong saklaw ng larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw sa karaniwang mambabasa ngunit may dignidad. Ginamit ang “nahabag” at “pastol” bilang pamilyar at matibay na mga salitang biblikal. Hinati sa maiikling pangungusap upang maging natural at madaling basahin, habang pinananatili ang mga ugnayang lohikal ng Griyego.
