  source_fidelity: 'Ang “Pagdating niya sa pampang” ay nauunawaan sa konteksto, ngunit higit nitong isinasalaysay ang resulta ng ἐξελθών kaysa ang pagkilos ng paglabas/pagbababa. Sa agarang konteksto ng bangka (Marcos 6:32–33), ligtas at mas tumpak ang “Pagbaba niya mula sa bangka.” Ang iba pang mga sugnay ay tapat sa Griyego: nakita niya ang malaking pulutong, nahabag siya sa kanila dahil sila’y gaya ng mga tupang walang pastol, at nagsimula siyang magturo sa kanila ng maraming bagay.'
