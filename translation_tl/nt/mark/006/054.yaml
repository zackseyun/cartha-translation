translation:
  language: tl
  text: Pagkababa nila mula sa bangka,[a] agad siyang nakilala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas malapit sa Griyego: “At nang bumaba sila mula sa bangka, agad siyang nakilala.” Hindi tahasang pinangalanan sa Griyego kung sino ang nakakilala sa kanya; ipinahihiwatig ng konteksto na mga tao roon ang nakakilala kay Jesus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: Pagkababa nila
  rationale: Ang genitive absolute ay likas na naihahayag sa Tagalog bilang sugnay na panahunan. Ang “pagkababa” ay angkop sa paglabas mula sa isang bangka.
- source_word: πλοίου
  choice: bangka
  rationale: Sa konteksto ng Lawa ng Galilea, tumutukoy ang πλοῖον sa isang maliit na sasakyang pantubig; “bangka” ang natural na modernong katumbas.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ng “agad” ang diin at mabilis na takbo ng salaysay na karaniwan sa Marcos.
- source_word: ἐπιγνόντες
  choice: nakilala
  rationale: Dito, ang ἐπιγινώσκω ay nangangahulugang nakilala si Jesus nang makita siya, hindi basta nalaman lamang kung sino siya.
- source_word: αὐτὸν
  choice: siya
  rationale: Ang panghalip ay tumutukoy kay Jesus ayon sa konteksto.
- source_word: implicit subject of ἐπιγνόντες
  choice: agad siyang nakilala
  rationale: Hindi tahasang pinangalanan sa Griyego ang gumagawa ng pagkilala. Ang ayos na walang binanggit na tagaganap ay natural sa Tagalog at pinananatili ang pagiging implicit nito, habang ipinahihiwatig ng kasunod na konteksto na mga tagaroon ang nakakilala kay Jesus.
theological_decisions:
- issue: Pagkilala sa simuno ng “nakilala”
  choice: Hindi tahasang pinangalanan ang mga nakakilala; “agad siyang nakilala”
  alternative: Agad siyang nakilala ng mga tao roon
  rationale: Usaping sintaktiko at pangkonteksto ito, hindi doktrinal. Nasa anyong nominative plural ang ἐπιγνόντες at hindi ito likas na tumutukoy sa genitive na αὐτῶν. Ipinakikita ng kasunod na talata na mga tagaroon ang nakakilala kay Jesus, ngunit pinananatili ng salin ang hindi tahasang pagbanggit sa kanila sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “pagkababa,” “bangka,” at “agad” upang mapanatili ang mabilis na takbo ng salaysay. Ang ayos na “agad siyang nakilala” ay likas sa Filipino at hindi labis na nilulutas ang implicit na simuno ng Griyego.
