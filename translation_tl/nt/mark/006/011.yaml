  verdict: revise
  source_fidelity: Ang pangunahing problema ay ang “laban sa kanila” sa salin. Ang εἰς μαρτύριον αὐτοῖς ay literal na ‘bilang patotoo sa/para sa kanila’; maaaring magpahiwatig ang konteksto ng salungat na patotoo, ngunit hindi ito tahasang isinasaad ng datibong αὐτοῖς. Upang mapanatili ang ambigwidad ng Griyego, mas ligtas na gamitin ang ‘sa kanila’ sa pangunahing teksto at ilagay ang ‘laban sa kanila’ sa talababa. Napananatili rin ang maramihang ‘kayo/ninyo/inyo’ at ang utos na ipagpag ang alikabok.
  naturalness: Natural at marangal ang binagong Tagalog. Ang “sa pag-alis ninyo roon” ay bahagyang mas maayos na pang-ugnay kaysa “pag-alis ninyo roon,” at ang “alikabok sa ilalim ng inyong mga paa” ay idiomatiko nang hindi lumilihis sa pariralang Griyego.
  terminology: Ang “patotoo” ay angkop para sa μαρτύριον. Hindi ginamit ang “saksi” bilang kapalit sa pangunahing salin sapagkat karaniwan itong tumutukoy sa isang tao, samantalang ang μαρτύριον dito ay patotoo. Ang talababa tungkol sa kilos ng pagpag ay pinanatili ngunit inilapit ang pananda sa mismong kilos na ipinaliliwanag.
