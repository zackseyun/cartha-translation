  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: tl
  text: At kung sa alinmang lugar ay hindi kayo tanggapin o pakinggan, sa pag-alis ninyo roon, ipagpag ninyo[b] ang alikabok sa ilalim ng inyong mga paa bilang patotoo sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang patotoo laban sa kanila.” Mas literal na “bilang patotoo sa kanila” ang Griyego. Maaaring ipahiwatig ng konteksto na ito ay patotoong laban sa mga tumatanggi sa mensahe, ngunit hindi ito tahasang sinasabi ng parirala.
    reason: alternative_reading
  - marker: b
    text: Ang pagpag ng alikabok mula sa mga paa ay isang simbolikong kilos ng paghihiwalay at pagbababala bilang tugon sa pagtanggi.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: sa alinmang lugar
  rationale: Ipinahahayag ng ὃς ἂν ang isang di-tiyak at pangkalahatang kalagayan. Pinananatili ng “sa alinmang lugar” ang tahasang pangngalang τόπος at natural ito sa modernong Tagalog.
- source_word: μὴ δέξηται ὑμᾶς
  choice: hindi kayo tanggapin
  rationale: Ang δέχομαι ay tumutukoy rito sa pagtanggap sa mga sugo, kasama ang diwa ng pagpapatuloy o mabuting pagtanggap, nang hindi labis na nililinaw ang implikasyong iyon.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: o pakinggan
  rationale: Sa konteksto, ang ἀκούω na may genitive ay higit sa basta pagkarinig at tumutukoy sa pakikinig sa mensahe. Ang “pakinggan” ay maikli, natural, at hindi kasing-interpretatibo ng “sundin.”
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: pag-alis ninyo roon
  rationale: Ang participle ay temporal o pangyayari kasabay ng pangunahing utos. Malinaw at natural na ipinakikita ng parirala ang pagkakasunod ng mga kilos.
- source_word: ἐκτινάξατε
  choice: ipagpag ninyo
  rationale: Ang ἐκτινάσσω ay nangangahulugang pagpagin o alisin sa pamamagitan ng pagpag. “Ipagpag” ang karaniwang pandiwang Filipino para sa pag-aalis ng alikabok sa ganitong paraan.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: ang alikabok na nasa ilalim ng inyong mga paa
  rationale: Malapit nitong sinusundan ang estruktura at lokasyong ipinahahayag ng Griyego habang nananatiling malinaw sa Filipino.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: bilang patotoo laban sa kanila
  rationale: Ang μαρτύριον ay “patotoo” o “saksi.” Bagaman ang αὐτοῖς ay literal na “sa/para sa kanila,” ipinahihiwatig ng konteksto ng pagtanggi na ang kilos ay nagsisilbing masamang patotoo laban sa kanila. Pinananatili sa talababa ang mas literal at hindi gaanong tiyak na pagbasa.
theological_decisions:
- issue: Ang puwersa ng pagpapatotoo sa εἰς μαρτύριον αὐτοῖς
  choice: Isang patotoo laban sa mga tumatanggi sa mga sugo at sa mensahe
  alternative: “Bilang patotoo sa kanila” o “bilang saksi sa kanila,” na hindi tahasang nagsasaad kung pabor o laban ang patotoo
  rationale: Sa konteksto ng hindi pagtanggap at hindi pakikinig, ang simbolikong pagpag ng alikabok ay may diwa ng babala at masamang patotoo. Gayunman, hindi likas na nangangahulugang “laban” ang datibong αὐτοῖς, kaya inilalahad sa talababa ang tunay na ambigwidad.
- issue: Kahulugan ng pagpag ng alikabok
  choice: Simbolikong paghihiwalay at babala matapos tanggihan ang mga sugo
  alternative: Isang kilos na nagpapakita lamang ng paghihiwalay, na walang ipinahihiwatig na paghatol
  rationale: Ipinakikita ng agarang konteksto na tugon ito sa pagtanggi. Hindi dinaragdagan ng salin ang talata ng mas tiyak na pormula ng paghatol; ipinaliliwanag lamang sa talababa ang pangkulturang saysay ng kilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kayo/inyong/ninyo” upang panatilihin ang maramihang ikalawang panauhan. Iniwasan ang labis na pormal na “anuman ang dakong” at ang kolokyal na pananalita. Ang mga talababa ay minarkahan sa pangunahing teksto bilang [a] at [b].
