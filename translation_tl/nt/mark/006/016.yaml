base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: tl
  text: Ngunit nang marinig ito ni Herodes, sinabi niya[a], “Si Juan na pinugutan ko ng ulo ay muling binuhay[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “paulit-ulit niyang sinasabi.” Maaaring ipahiwatig ng anyo ng pandiwang Griyego ang nagpapatuloy o paulit-ulit na pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: 'O, “ibinangon”; maaari ring isalin sa mas natural na Tagalog na “muling nabuhay.” Balintiyak ang pandiwang Griyego: “binuhay” o “ibinangon.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: nang marinig
  rationale: Ginawang temporal ang aorist participle upang maging natural sa Tagalog habang pinananatili ang kaugnayan nito sa pangunahing pandiwa.
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na paglipat o pagsalungat sa salaysay; ang “Ngunit” ay angkop sa pagbabalik sa reaksiyon ni Herodes.
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Natural ito sa pagsasalaysay sa Tagalog. Maaaring ipahiwatig ng imperfect ang nagpapatuloy o paulit-ulit na pagsasalita, kaya inilagay ang posibilidad na iyon sa talababa.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Si Juan, na pinugutan ko ng ulo
  rationale: Inayos ayon sa likas na ayos ng Tagalog ngunit pinanatili ang tuwirang kahulugan ng pagputol sa ulo at ang diin kay Juan.
- source_word: ἀπεκεφάλισα
  choice: pinugutan ko ng ulo
  rationale: Ito ang malinaw at karaniwang salin sa Tagalog ng tiyak na pandiwang nangangahulugang pugutan ng ulo.
- source_word: οὗτος
  choice: Si Juan … ay
  rationale: Ang demonstratibong diin ay naipahahayag sa pag-uulit at pagtutuon sa “Si Juan” sa pangungusap, nang hindi gumagamit ng di-likas na “ang isang ito.”
- source_word: ἠγέρθη
  choice: muling binuhay
  rationale: Pinananatili nito ang balintiyak na anyo at malinaw na tumutukoy sa pagbabalik mula sa kamatayan, nang hindi tinutukoy kung sino ang gumawa nito.
theological_decisions:
- issue: Paglalarawan sa ἠγέρθη bilang pananalitang may kaugnayan sa muling pagkabuhay
  choice: muling binuhay
  alternative: muling nabuhay; ibinangon
  rationale: Balintiyak ang pandiwang Griyego. Pinananatili ng “muling binuhay” ang balintiyak at hindi nito ginagawang aktibo ang pahayag ni Herodes, samantalang kinikilala sa talababa ang mga natural na alternatibo sa Tagalog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pinugutan ng ulo” at “muling binuhay,” habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
