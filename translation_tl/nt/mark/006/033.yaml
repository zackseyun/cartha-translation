base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: tl
  text: Maraming tao ang nakakita sa kanila habang papaalis sila, at nakilala kung sino sila. Mula sa lahat ng bayan[a], sama-sama silang tumakbo sa katihan[b] papunta roon at nauna silang dumating kaysa sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lahat ng lungsod”; maaaring tumukoy ang salitang Griego sa bayan o lungsod ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “nang naglalakad,” na nagtatampok sa kaibahan nito sa paglalakbay sakay ng bangka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nakita
  rationale: Tuwirang ipinapahayag ang pisikal na pagkakita sa daloy ng salaysay nang walang idinadagdag na ibang diwa.
- source_word: ὑπάγοντας
  choice: habang papaalis sila
  rationale: Ipinakikita ng pariralang ito na nakita sila habang umaalis; ang bangka bilang paraan ng paglalakbay ay malinaw na sa naunang konteksto.
- source_word: ἐπέγνωσαν
  choice: nakilala
  rationale: Sa konteksto, tumutukoy ito sa pagkilala sa kanila, hindi sa pagkakaroon ng bagong kaalaman sa mas malawak na diwa.
- source_word: πολλοί
  choice: maraming tao
  rationale: Ginawang tahasan ang ipinahihiwatig na pangngalan upang maging natural at malinaw sa modernong Filipino.
- source_word: πεζῇ
  choice: sa katihan
  rationale: Likas itong nagpapakita ng kaibahan sa paglalakbay nila sakay ng bangka; inilalahad sa talababa ang mas literal na alternatibong 'nang naglalakad.'
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: mula sa lahat ng bayan
  rationale: Maaaring tumukoy ang πόλις sa bayan o lungsod; ang 'bayan' ay angkop sa konteksto ng Galilea at pinananatili ng 'lahat' ang πασῶν.
- source_word: συνέδραμον
  choice: sama-sama silang tumakbo
  rationale: Pinananatili nito kapwa ang mabilis na pagkilos at ang sama-samang pagtungo na ipinahihiwatig ng tambalang pandiwa.
- source_word: ἐκεῖ
  choice: papunta roon
  rationale: Natural na panandang patutunguhan sa Filipino para sa payak na deiktikong pang-abay.
- source_word: προῆλθον αὐτούς
  choice: nauna silang dumating kaysa sa kanila
  rationale: Malinaw nitong ipinapahayag na naunahan ng mga tao sa pagdating ang pangkat na naglalakbay sa bangka.
