  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: tl
  text: At lubhang nalungkot ang hari, ngunit dahil sa mga panunumpa niya at sa mga kasalo niya sa hapag[a], hindi niya nais na tanggihan siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga nakahilig sa hapag,” na tumutukoy sa mga panauhing kumakain sa karaniwang ayos noong panahong iyon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring, “tanggihan siya,” “ipagkait sa kanya,” o “baliwalain ang ipinangako sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: labis na nalungkot
  rationale: Ipinahahayag ang matinding kalungkutan at ang pagpasok sa gayong kalagayan sa natural na modernong Tagalog.
- source_word: ὁ βασιλεὺς
  choice: ang hari
  rationale: Tuwirang katumbas ng salitang Griyego at tumutugma sa tawag kay Herodes sa salaysay ni Marcos.
- source_word: διὰ τοὺς ὅρκους
  choice: dahil sa kanyang mga sinumpaan
  rationale: Ipinakikita ng διά na dahilan ang tinutukoy; ang maramihang anyo ay pinananatili, at ang 'kanyang' ay malinaw mula sa konteksto.
- source_word: τοὺς ἀνακειμένους
  choice: mga kasalo niya sa hapag
  rationale: Natural na inilalarawan ang mga panauhing nakahilig sa hapag habang kumakain, nang hindi kinakailangang gawing banyaga ang pangunahing teksto.
- source_word: οὐκ ἠθέλησεν
  choice: ayaw niyang
  rationale: Pinananatili ang diwa ng pagkukusa o kagustuhan, hindi ng kawalan ng kakayahan.
- source_word: ἀθετῆσαι αὐτήν
  choice: tanggihan ang dalaga
  rationale: Sa konteksto, tumutukoy ito sa hindi pagtanggi sa hinihingi niya o hindi pagsaisantabi sa ipinangako sa kanya; nililinaw ng 'dalaga' ang reperente ng panghalip nang natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'ngunit' upang ihayag ang likas na pagsalungat sa pagitan ng matinding kalungkutan ng hari at ng pasiya niyang huwag tumanggi; hindi nito binabago ang sanhi na ipinahahayag ng διά.
