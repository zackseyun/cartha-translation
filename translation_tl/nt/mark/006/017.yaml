id: MRK.6.17
reference: Mark 6:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: tl
  text: Sapagkat si Herodes mismo ay nagsugo upang dakpin si Juan[a], at iginapos niya ito sa bilangguan dahil kay Herodias, na asawa ni Felipe, na kapatid ni Herodes, sapagkat pinakasalan niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “nagsugo at dinakip si Juan.” Ipinahihiwatig ng ayos ng Griyego na si Herodes ang nagpasimula ng pagdakip sa pamamagitan ng mga isinugo niya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Sapagkat si Herodes mismo
  rationale: Pinananatili ng “mismo” ang diin ng αὐτός, at ipinahihiwatig ng “sapagkat” ang paliwanag na kaugnayan ng γάρ sa naunang salaysay.
- source_word: ἀποστείλας ἐκράτησεν
  choice: ang nag-utos na dakpin
  rationale: Sa konteksto, si Herodes ang nagpasimula at may pananagutan sa pagdakip sa pamamagitan ng mga tauhang isinugo niya. Likas sa Filipino ang ganitong pahayag at iniiwasang ipahiwatig na siya mismo ang pisikal na dumakip.
- source_word: τὸν Ἰωάννην
  choice: si Juan
  rationale: Karaniwang anyo ng pangalan sa modernong saling Filipino.
- source_word: ἔδησεν αὐτὸν
  choice: iginapos siya
  rationale: Tuwirang pinananatili ang kongkretong diwa ng δέω nang hindi nagdaragdag na tanikala ang ginamit.
- source_word: ἐν φυλακῇ
  choice: sa bilangguan
  rationale: Natural at malinaw na katumbas ng lugar ng pagkakakulong sa kontekstong ito.
- source_word: διὰ Ἡρῳδιάδα
  choice: dahil kay Herodias
  rationale: Ipinapahayag ang sanhi o dahilan na dala ng διά na may accusative.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: na asawa ng kapatid niyang si Felipe
  rationale: Malinaw at natural sa Filipino; ipinakikilalang si Felipe ang kapatid ni Herodes at si Herodias ang asawa ni Felipe.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: sapagkat pinakasalan niya ito
  rationale: Pinananatili ang ikalawang sugnay na sanhi at ang simpleng diwa ng γαμέω. Ang “ito” ay malinaw na tumutukoy kay Herodias.
theological_decisions:
- issue: Makasaysayan at moral na paglalarawan sa ginawa ni Herodes
  choice: Inilahad lamang na ipinadakip at ipinabilanggo ni Herodes si Juan dahil kay Herodias, na pinakasalan niya.
  alternative: Tahasan sa talata ang pagiging labag sa kautusan o pagiging di-wasto ng pag-aasawa.
  rationale: Hindi tahasang binibigkas sa pangungusap na ito ang moral na hatol; ipinapaliwanag iyon ng kasunod na konteksto. Kaya hindi ito idinagdag sa salin.
- issue: Ahensiya sa pagdakip kay Juan
  choice: Si Herodes ang nag-utos na dakpin si Juan.
  alternative: Si Herodes mismo ang pisikal na dumakip kay Juan matapos magsugo.
  rationale: Ang ἀποστείλας bago ang ἐκράτησεν ay likas na nagpapahiwatig na isinagawa ni Herodes ang pagdakip sa pamamagitan ng mga isinugo niya, habang nananatili sa kaniya ang pananagutan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nag-utos na dakpin” bilang natural na optimal-equivalence para sa ahensiyang ipinahihiwatig ng Griyego; iniwasan ang masalimuot at hindi likas na “pagkasugo ay dinakip.”
