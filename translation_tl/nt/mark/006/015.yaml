  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: tl
  text: Ngunit may iba namang nagsasabi, “Siya si Elias,” at may iba namang nagsasabi, “Isa siyang propeta[a], tulad ng isa sa mga propeta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang, “ang Propeta,” kung tumutukoy ito sa isang tiyak na propetang inaasahang darating sa huling panahon. Mas natural dito sa Griyego ang “isang propeta” dahil kasunod nito ang “tulad ng isa sa mga propeta.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Pero sinasabi naman ng iba / Sinasabi naman ng iba
  rationale: Ang ἄλλοι ay tumutukoy sa ibang pangkat, at ang δέ ay nagpapahiwatig ng banayad na pagsalungat o pagpapatuloy. Likas sa modernong Tagalog ang “pero ... naman” sa unang paglipat at ang “naman” sa kasunod.
- source_word: ἔλεγον
  choice: sinasabi
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy o paulit-ulit na pagsasalita; naipapahayag ito ng “sinasabi” nang hindi dinaragdagan ang diin.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Siya si Elias.”
  rationale: Ginawang tuwirang sipi para sa likas na daloy sa Tagalog. Ginamit ang nakaugaliang anyong Tagalog na “Elias” para sa pangalang Ἠλίας.
- source_word: προφήτης
  choice: isang propeta
  rationale: Walang pantukoy ang pangngalang Griyego at sinusundan ito ng paghahambing na “tulad ng isa sa mga propeta,” kaya ang likas na di-tiyak na kahulugan ay “isang propeta,” hindi tahasang “ang Propeta.”
- source_word: ὡς εἷς τῶν προφητῶν
  choice: tulad ng isa sa mga propeta
  rationale: Ang ὡς ay naghahayag dito ng paghahambing. Pinananatili ng salin ang tahasang paghahambing kay Jesus sa isa sa mga propeta.
theological_decisions:
- issue: Kung ang προφήτης ay pangkalahatang “isang propeta” o ang eskatolohikal na titulong “ang Propeta”
  choice: isang propeta
  alternative: ang Propeta
  rationale: Walang pantukoy sa Griyego, at agad itong nililinaw ng ὡς εἷς τῶν προφητῶν (“tulad ng isa sa mga propeta”). Mas natural nitong ipinapahiwatig ang pangkalahatang pagkakakilanlan bilang propeta, habang itinatala sa talababa ang hindi gaanong malamang na pagbasa bilang isang tiyak na eskatolohikal na persona.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “sinasabi naman ng iba” upang katawanin ang magkatulad na mga sugnay at ang nagpapatuloy na kilos sa Griyego.
