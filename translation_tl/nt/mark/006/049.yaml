  verdict: revise
  source_fidelity: Kailangang palitan ang “lawa” ng “dagat,” sapagkat θάλασσα ang mismong salita sa Griego at “sea” rin ang nasa audit trail. Bagaman ang Dagat ng Galilea ay heograpikong isang lawa, hindi dapat palitan ng salin ang terminong pinili ng pinagmulang teksto. Mas tapat din ang “at” kaysa “kaya” para sa simpleng καί; hindi tahasang minamarkahan ng Griego ang ugnayan bilang bunga.
  naturalness: Ang binagong pangungusap ay likas, malinaw, at marangal sa makabagong Filipino. Ang “napasigaw sila” ay angkop na pagsasalin ng malakas at biglaang pag-iyak/sigaw na ipinahihiwatig ng ἀνέκραξαν.
  terminology: Ang “multo” ay malinaw at karaniwang katumbas ng φάντασμα sa kontekstong ito. Inayos ang talababa upang magbigay ng leksikal na mga alternatibo nang hindi nagdaragdag ng paliwanag na tila tumutukoy sa isang tiyak na uri ng espiritu.
