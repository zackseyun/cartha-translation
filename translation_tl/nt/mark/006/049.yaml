  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: tl
  text: Ngunit nang makita nila siyang naglalakad sa ibabaw ng dagat, inakala nilang isa siyang multo[a], at napasigaw sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang aparisyon” o “isang multong anyo.” Ang salitang Griego na φάντασμα ay tumutukoy sa isang anyong parang multo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit ... nila
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat at paglipat ng salaysay tungo sa reaksiyon ng mga alagad; likas sa Filipino na ilagay ang panghalip sa kasunod na sugnay.
- source_word: ἰδόντες αὐτὸν
  choice: nang makita nila siya
  rationale: Ang aorist participle ay may temporal na diwa rito; malinaw at natural itong ipinapahayag ng “nang makita nila siya.”
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: naglalakad sa ibabaw ng lawa
  rationale: Ipinahihiwatig ng ἐπί na nasa ibabaw ng tubig ang paglakad. Ang θάλασσα ay tumutukoy rito sa Lawa ng Galilea; ang “lawa” ay mas natural at heograpikong malinaw sa makabagong Filipino, habang pinananatili ng “sa ibabaw” ang himalang inilalarawan.
- source_word: ἔδοξαν
  choice: inakala nila
  rationale: Ang δοκέω ay nangangahulugang mag-isip o magpalagay; ang “inakala” ay angkop lalo na dahil maling pagkilala ang kasunod.
- source_word: ὅτι φάντασμά ἐστιν
  choice: isa siyang multo
  rationale: Ang φάντασμα ay isang nakatatakot o tila-espiritung anyo. “Multo” ang pinakamalinaw at karaniwang katumbas sa Filipino; ang pangkasalukuyang ἐστιν sa di-tuwirang pahayag ay likas na isinasalin ayon sa nakaraang pananaw ng mga alagad.
- source_word: καὶ ἀνέκραξαν
  choice: kaya napasigaw sila
  rationale: Ang ἀνακράζω ay malakas na pagsigaw. Sa konteksto, natural na ipinakikita ng “napasigaw” ang biglaan at takot na reaksiyon; ang καί ay ipinahayag na “kaya” bilang malinaw na bunga ng kanilang pag-aakala.
theological_decisions:
- issue: Ang kinaroroonan ni Jesus habang naglalakad
  choice: sa ibabaw ng lawa
  alternative: sa tabi ng lawa
  rationale: Sa konteksto ng salaysay, ang ἐπὶ τῆς θαλάσσης ay tumutukoy sa paglakad sa ibabaw ng tubig, hindi sa tabing-lawa. Pinananatili nito ang payak na diwa ng salaysay nang walang dagdag na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lawa” para sa anyong-tubig na Lawa ng Galilea at “sa ibabaw” upang hindi mawala ang diwa ng Griegong parirala. Ang hulma ng pangungusap ay likas sa karaniwang pagbasa nang hindi pinapahina ang tindi ng reaksiyon.
