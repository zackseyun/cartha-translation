    rationale: Ang “kaya” ay nagdaragdag ng hayag na relasyong sanhi-bunga, samantalang simpleng pagdurugtong lamang ang καί. Ang “at” ay mas malapit at natural pa rin.
  - severity: low
    issue: 'Hindi gaanong malinaw ang kasalukuyang paliwanag sa talababa: “tila-espiritung anyo.”'
    rationale: Mas tuwiran at leksikal na malinaw ang paglalarawang “anyong parang multo,” habang pinananatili ang mga alternatibong “aparisyon” at “multong anyo.”
