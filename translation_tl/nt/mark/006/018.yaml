  - severity: low
    issue: Walang talababa para sa leksikal na alternatibo ng ἔξεστιν.
    rationale: May kaugnay na English POB audit footnote para sa alternatibong “permitted.” Ang katumbas na Filipino na talababa ay makapag-iingat ng alternatibo at dapat nakakabit sa pariralang “pinahihintulutan.”
