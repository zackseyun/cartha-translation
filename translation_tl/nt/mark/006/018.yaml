  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: tl
  text: Sapagkat paulit-ulit na sinasabi ni Juan kay Herodes, “Hindi ka pinahihintulutang[a] magkaroon ng asawa ng iyong kapatid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi naaayon sa kautusan para sa iyo na magkaroon ng asawa ng iyong kapatid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: paulit-ulit na sinasabi
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng nagpapatuloy o inuulit na pagsasalita sa nakaraan. Malinaw itong naipahahayag sa natural na Tagalog sa loob ng salaysay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan nito sa naunang konteksto.
- source_word: Ἡρῴδῃ
  choice: Herodes
  rationale: Ito ang nakaugaliang anyo ng pangalang Herod sa Tagalog na Bibliya at malinaw sa modernong mambabasa.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Hindi ipinahihintulot sa iyo
  rationale: Ipinahahayag nito ang moral at legal na di-pagpapahintulot nang hindi nagdaragdag ng tahasang pagtukoy sa Kautusan na wala sa talata.
- source_word: ἔχειν
  choice: angkinin
  rationale: Sa konteksto ng bawal na relasyong pangmag-asawa, mas natural at mas tiyak ang “angkinin” kaysa literal ngunit maaaring malabong “magkaroon,” habang pinananatili ang diwa ng pagkakaroon bilang asawa.
- source_word: γυναῖκα
  choice: asawa
  rationale: Bagaman maaaring mangahulugang “babae” o “asawa” ang γυνή, malinaw na ang kahulugang pangmag-asawa ang hinihingi ng pariralang “ng iyong kapatid.”
- source_word: τοῦ ἀδελφοῦ σου
  choice: ng iyong kapatid
  rationale: Natural na Tagalog na pagpapahayag ng ugnayang pag-aari at pagkakamag-anak na sentro sa pagsaway ni Juan.
theological_decisions:
- issue: Likas ng pagsaway ni Juan
  choice: Hindi ipinahihintulot sa iyo
  alternative: Hindi tama para sa iyo / Bawal sa iyo
  rationale: Pinananatili ng salin ang moral-legal na puwersa ng ἔξεστιν at ang malamang na kaugnayan nito sa pagbabawal ng Kautusan, ngunit hindi nito isinasama sa teksto ang isang tahasang pagtukoy sa Kautusan ni Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “paulit-ulit na sinasabi” upang ilantad ang aspektong imperpekto, at “ipinahihintulot” upang mapanatili ang legal-moral na bigat nang hindi tunog sobrang teknikal.
