  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang paliwanag na γάρ, ang paulit-ulit/nagpapatuloy na puwersa ng imperpektong ἔλεγεν, at ang pagtukoy sa asawa ng kapatid. Gayunman, ang “angkinin” ay may diwang pag-aari o pag-aangkin at hindi natural na paglalarawan ng pagkakaroon ng isang babae bilang asawa; maaari rin nitong pahinain ang tuwirang kahulugan ng ἔχειν sa kontekstong ito.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “Hindi ka pinahihintulutang magkaroon ng asawa ng iyong kapatid.” Pinananatili nito ang marangal na rehistro at ang legal-moral na puwersa nang hindi gumagamit ng hindi angkop na “angkinin.”
  terminology: Ang “Herodes,” “Juan,” at “asawa” ay angkop at nakaugaliang mga anyo. Ang “pinahihintulutan” ay wastong katumbas ng ἔξεστιν; ang talababa ay inilagay sa mismong pariralang tinutukoy nito, hindi sa pangalan ni Herodes.
  issues:
