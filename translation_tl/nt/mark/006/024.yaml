  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: tl
  text: Pagkalabas niya, sinabi niya sa kanyang ina, “Ano ang hihingin ko?” Sumagot ang kanyang ina, “Ang ulo ni Juan na Tagapagbautismo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyonal na katawagan, “Juan Bautista.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Pagkalabas niya
  rationale: Ipinahihiwatig ng aorist participle na nauna ang paglabas bago ang pagsasalita; natural at malinaw sa Tagalog ang “Pagkalabas niya.”
- source_word: Τί αἰτήσωμαι
  choice: Ano ang hihingin ko?
  rationale: Ipinapahayag ng deliberative subjunctive ang pag-uusisa kung ano ang nararapat niyang hingin; likas at tuwiran ito sa modernong Tagalog.
- source_word: μητρὶ αὐτῆς
  choice: sa kanyang ina
  rationale: Tuwirang salin ng possessive construction at malinaw ang tinutukoy.
- source_word: κεφαλήν
  choice: ulo
  rationale: Pinananatili ang tahasan at marahas na bagay na hinihingi, nang walang pagpapalambot.
- source_word: τοῦ βαπτίζοντος
  choice: na Tagapagbautismo
  rationale: Isinasalin ang substantival participle ayon sa gawain na naging pagkakakilanlan ni Juan, sa halip na gumamit lamang ng nakaugaliang katawagang maaaring hindi na malinaw ang literal na diwa.
theological_decisions:
- issue: Pagkakasalin sa bansag kay Juan na βαπτίζων
  choice: Juan na Tagapagbautismo
  alternative: Juan Bautista
  rationale: Mas lantad na ipinapakita ng “Tagapagbautismo” ang kahulugan ng Griyegong participle—si Juan bilang taong nagbabautismo—samantalang inilalagay sa talababa ang tradisyonal at mas pamilyar na katawagan. Walang idinadagdag na denominasyonal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Pagkalabas niya” upang panatilihin ang pagkakasunod ng mga kilos, at “Sumagot ang kanyang ina” upang maging malinaw sa Tagalog ang nagbigay ng sagot nang hindi binabago ang diwa.
