  naturalness: Natural at marangal ang “matigas ang kanilang mga puso” sa modernong Filipino Tagalog. Ang “ngunit” ay malinaw na pangatnig na panalungat at mas tuwirang katumbas ng ἀλλά sa talatang ito kaysa sa “kundi,” bagaman hindi naman mali ang huli.
