  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: tl
  text: Sapagkat hindi nila naunawaan ang tungkol sa mga tinapay[b], ngunit matigas ang kanilang mga puso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanilang mga puso ay naging manhid.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi nila naunawaan ang kahulugan ng mga tinapay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: naunawaan
  rationale: Likas at malinaw na katumbas sa modernong Tagalog para sa pag-unawa o pag-arok; pinananatili nito ang kabiguang maunawaan ng mga alagad.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: ang tungkol sa mga tinapay
  rationale: Ipinahahayag ang idiomatikong diwa na hindi nila naunawaan ang kahulugan ng pangyayaring may kinalaman sa mga tinapay, nang hindi tahasang nilulutas kung ano ang kahulugang iyon.
- source_word: ἄρτοις
  choice: mga tinapay
  rationale: Ang maramihan ay tumutukoy sa partikular na mga tinapay sa naunang pagpapakain, hindi lamang sa tinapay bilang pangkalahatang pagkain.
- source_word: καρδία
  choice: mga puso
  rationale: Sa kontekstong biblikal, ang puso ay tumutukoy sa panloob na pagkatao, kasama ang pag-unawa at disposisyon. Ginawang maramihan sa Tagalog upang maging natural sa pagtukoy sa maraming alagad.
- source_word: πεπωρωμένη
  choice: naging manhid
  rationale: Inilalarawan nito ang kawalan ng espirituwal na pakiramdam o pagtugon at natural sa kasalukuyang Tagalog; ang alternatibong metaporang 'tumigas' ay inilagay sa talababa.
- source_word: ἀλλ’ ἦν
  choice: kundi naging
  rationale: Pinananatili ang mariing pagsalungat ng ἀλλά at ang kalagayang inilalarawan ng imperfect ἦν sa paraang natural sa Tagalog.
theological_decisions:
- issue: Kalikasan at sanhi ng kalagayan ng mga alagad sa πεπωρωμένη
  choice: naging manhid ang kanilang mga puso
  alternative: tumigas ang kanilang mga puso
  rationale: Inilalarawan ng talata ang espirituwal na kawalan ng pakiramdam ngunit hindi tahasang tinutukoy kung sino o ano ang sanhi nito. Hindi nagdaragdag ang salin ng doktrina tungkol sa banal na pagpapatigas.
- issue: Kahulugan ng mga tinapay
  choice: hindi nila naunawaan ang tungkol sa mga tinapay
  alternative: hindi nila naunawaan ang kahulugan ng mga tinapay
  rationale: Pinananatili ng pangunahing teksto ang bahagyang kalabuan ng ἐπὶ τοῖς ἄρτοις; ipinapaliwanag lamang sa talababa ang posibleng diwang tumutukoy sa kabuluhan ng tanda.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ang “Sapagkat” ay nag-uugnay sa dahilan mula sa naunang talata; ang “kundi” ay nagpapanatili ng matinding pagsalungat. Ginamit ang “mga puso” bilang natural na kolektibong pagtukoy sa mga alagad.
