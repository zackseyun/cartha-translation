  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: tl
  text: At nang makapagpaalam siya sa kanila[a], lumisan siya patungo sa bundok upang manalangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkatapos niyang magpaalam sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Likas na pang-ugnay ito sa pagpapatuloy ng salaysay at malapit sa payak na gamit ng Griyegong καὶ.
- source_word: ἀποταξάμενος
  choice: matapos siyang magpaalam
  rationale: Ang middle participle ay karaniwang nangangahulugang magpaalam o lumisan matapos magbigay-paalam. Natural sa modernong Tagalog ang “magpaalam” at angkop sa kasunod na αὐτοῖς.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Panghalip na datibo at maramihan na tumutukoy sa mga taong naunang binanggit; natural itong isama sa pariralang “magpaalam sa kanila.”
- source_word: ἀπῆλθεν
  choice: umakyat siya
  rationale: Ang pandiwa ay literal na tumutukoy sa pag-alis o pagpunta. Dahil εἰς τὸ ὄρος ang patutunguhan, natural sa Tagalog ang “umakyat ... sa bundok,” bagaman bahagya nitong ginagawang hayag ang kilos na ipinahihiwatig ng patutunguhan.
- source_word: εἰς τὸ ὄρος
  choice: sa bundok
  rationale: Pinananatili ang tiyak na artikulo ng Griyego sa pamamagitan ng “sa bundok,” nang hindi dinaragdagan ng simboliko o teolohikal na kahulugan.
- source_word: προσεύξασθαι
  choice: upang manalangin
  rationale: Infinitive of purpose ito; malinaw at marangal na ipinapahayag ng “upang manalangin” ang layunin ng pagpunta niya.
theological_decisions:
- issue: Pagtukoy sa “bundok”
  choice: Isinalin bilang “sa bundok” nang walang idinagdag na simboliko o teolohikal na kahulugan.
  alternative: “sa isang bundok” o pagpapakahulugan dito bilang isang natatanging pook ng paghahayag
  rationale: May tiyak na artikulo ang Griyego, ngunit walang ibinigay na paliwanag tungkol sa anumang simbolikong kabuluhan. Dapat panatilihin ang konkretong detalye ng salaysay nang walang ipinapasok na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “magpaalam” sa halip na mas pormal na “humingi ng pamamaalam,” at “manalangin” para sa dignidad ng biblikal na rehistro.
