base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: tl
  text: At nang makatawid sila patungong lupa,[a] dumating sila sa Genesaret at dumaong[b] roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pampang”; literal na “sa lupa,” na tumutukoy sa pagdating sa lupa mula sa bangka.
    reason: lexical_alternative
  - marker: b
    text: O “ipinadaong” o “inangkla”; ang pandiwang Griyego ay may tiyak na pandagat na diwa ng paglapit at paghimpil ng bangka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang tuloy-tuloy na daloy ng salaysay.
- source_word: διαπεράσαντες
  choice: nang makatawid sila
  rationale: Ipinahihiwatig ng aorist participle na natapos muna ang pagtawid bago ang pagdating; likas sa modernong Tagalog ang temporal na pariralang ito.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: nakarating sila sa lupain ng Genesaret
  rationale: Ipinahahayag ang pagdating sa lupa mula sa bangka at ang tiyak na patutunguhang Genesaret. Ang “lupain” ay nagpapanatili sa γῆ nang hindi labis na nililimitahan ito sa dalampasigan.
- source_word: Γεννησαρὲτ
  choice: Genesaret
  rationale: Isinalin sa baybay na madaling basahin at bigkasin sa Filipino ang pangalang pook.
- source_word: προσωρμίσθησαν
  choice: idinaong nila roon ang bangka
  rationale: 'May tiyak na pandagat na diwa ang pandiwa: pagdadala at pagpapahinto ng sasakyang-dagat sa pampang o daungan. Ginawang tahasan ang bangka, na malinaw mula sa konteksto, upang maging natural sa Tagalog.'
