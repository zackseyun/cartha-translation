translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “makatawid,” “nakarating,” at “idinaong” bilang likas na mga salitang pasalaysay; pinanatili sa talababa ang literal na “lupa” at ang saklaw ng pandagat na pandiwa.
