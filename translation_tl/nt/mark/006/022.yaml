  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: tl
  text: Nang pumasok ang anak na babae ni Herodias[a] at sumayaw, natuwa sa kanya si Herodes at ang mga kasalo ni Herodes na nakahilig sa hapag.[b] Sinabi ng hari sa batang babae, “Humingi ka sa akin ng anumang gusto mo, at ibibigay ko iyon sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito at tradisyon na bumabasa rito bilang “ang anak niyang si Herodias” sa halip na “ang anak na babae ni Herodias.” Ang sinusundang tekstong Griyego rito ay may pagbabasang “ang anak na babae ni Herodias.”
    reason: textual_variant
  - marker: b
    text: O “ang mga kasalo niya sa pagkain.” Tinutukoy ng Griyego ang mga kasalo sa handaan na nakahilig sa hapag, ayon sa kaugalian noon.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: Nang pumasok
  rationale: Ginawang temporal na sugnay ang aorist participle sa genitive absolute; natural ito sa modernong Tagalog at malinaw na ipinapakita ang pagpasok niya sa lugar ng handaan.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ang anak na babae ni Herodias
  rationale: 'Ito ang pinakanatural na pagbasa sa sinusundang tekstong Griyego: ang batang babae ay anak ni Herodias. Nililinaw ng “anak na babae” ang kasarian nang hindi nagdaragdag ng edad.'
- source_word: ὀρχησαμένης
  choice: sumayaw
  rationale: Direkta at natural na katumbas ng kilos sa participial sequence.
- source_word: ἀρεσάσης
  choice: nasiyahan sa kanya
  rationale: Ipinahahayag ang diwang ‘nalugod/nasiyahan’ nang hindi pinatitindi ang damdamin. Ang “sa kanya” ay natural na tumutukoy sa anak at sa ginawa niyang pagsayaw.
- source_word: τοῖς συνανακειμένοις
  choice: ang mga kasalo niyang nakahilig sa hapag
  rationale: Pinananatili ang kongkretong larawan ng mga panauhing kasabay niyang kumakain habang nakahilig, ayon sa kaugalian sa handaan noon.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: Sinabi ng hari
  rationale: Tapat sa βασιλεύς na ‘hari’; hindi ito pinapalitan ng mas teknikal na makasaysayang titulong ‘tetrarka.’
- source_word: τῷ κορασίῳ
  choice: sa batang babae
  rationale: Karaniwan at malinaw na modernong salin ng κοράσιον; iniiwasan ang makalumang “dalaga” at hindi ipinapalagay ang tiyak na edad.
- source_word: Αἴτησόν με
  choice: Humingi ka sa akin ng
  rationale: Natural na anyong pautos sa Tagalog para sa paghiling ng isang bagay mula sa isang tao.
- source_word: ὃ ἐὰν θέλῃς
  choice: anumang gusto mo
  rationale: Pinananatili ang bukás at walang itinakdang saklaw ng kahilingan sa natural na kontemporaryong pananalita.
- source_word: δώσω σοι
  choice: ibibigay ko iyon sa iyo
  rationale: Ang “iyon” ay tumutukoy sa anumang hihingin at ginagawang buo at natural ang pangungusap sa Tagalog.
theological_decisions:
- issue: Ang titulong βασιλεύς para kay Herodes Antipas
  choice: hari
  alternative: tetrarka; pinuno
  rationale: Sinusunod ang mismong katawagan sa salaysay ni Marcos sa halip na iwasto ito ayon sa mas teknikal na titulong pangkasaysayan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang larawang pangkultura ng pagkakahilig sa hapag, habang ginawang natural na sugnay ang mga participle ng Griyego. Inilagay ang mga panandang talababa sa mismong pariralang tinatalakay ng bawat tala.
