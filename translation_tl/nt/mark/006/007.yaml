  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: tl
  text: Tinawag[c] ni Jesus ang Labindalawa at nagsimula siyang magsugo sa kanila nang dala-dalawa,[a] at binibigyan niya sila ng awtoridad[b] sa mga maruruming espiritu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang pares-pares.”
    reason: lexical_alternative
  - marker: b
    text: O “kapangyarihan.”
    reason: lexical_alternative
  - marker: c
    text: Sa Griyego, “Tinatawag”; ginamit dito ang pangkasalukuyang anyo bilang masiglang pagsasalaysay ng pangyayaring naganap na.
    reason: source_aspect
lexical_decisions:
- source_word: προσκαλεῖται
  choice: Tinawag
  rationale: Ang pangkasalukuyang anyo ay isang historical present na karaniwan sa masiglang pagsasalaysay ni Marcos. Ginawang pangnagdaan sa pangunahing teksto upang maging natural ang daloy kasama ng “sinimulan,” habang itinala sa talababa ang anyong Griyego.
- source_word: τοὺς δώδεκα
  choice: ang Labindalawa
  rationale: Tiyak na katawagan ito sa kinikilalang pangkat ng labindalawang alagad ni Jesus; pinanatili ang titulong anyo nang hindi idinaragdag ang salitang “alagad.”
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: sinimulan niya silang isugo
  rationale: Malinaw na ipinahahayag ang simula ng pagpapadala sa isang misyong iniatas, nang hindi ipinapasok ang katawagang “apostol” na wala rito bilang pangngalan.
- source_word: δύο δύο
  choice: nang dala-dalawa
  rationale: Likas na idyomang Filipino ito para sa distributibong pag-uulit na nangangahulugang bawat pares.
- source_word: ἐδίδου
  choice: binigyan niya
  rationale: Natural ito sa salaysay na Filipino at tumutukoy sa pagkakaloob na kasabay ng pagsusugo. Bagaman imperfect ang Griyego, hindi kailangang gawing tahasang paulit-ulit ang kilos sa maikling kontekstong ito.
- source_word: ἐξουσίαν
  choice: awtoridad
  rationale: Ipinakikita nito ang ipinagkaloob na karapatang mamahala o kumilos, hindi lamang likas o hilaw na lakas. Karaniwan at malinaw ang salita sa modernong Filipino.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: sa mga maruruming espiritu
  rationale: Pinananatili ang terminolohiya ni Marcos at hindi ito agad pinapalitan ng mas makitid na paliwanag na “mga demonyo.”
theological_decisions:
- issue: Ang likas ng ipinagkaloob ni Jesus sa Labindalawa sa pariralang ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: awtoridad sa mga maruruming espiritu
  alternative: kapangyarihan laban sa mga maruruming espiritu
  rationale: Mas malinaw na ipinahihiwatig ng “awtoridad” na ipinagkaloob ni Jesus ang karapatang kumilos at mamahala. Hindi nito itinatanggi ang kapangyarihang kailangan, ngunit hindi rin nito nililimitahan ang ἐξουσία sa lakas lamang.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “dala-dalawa” bilang likas na idyoma, “Labindalawa” bilang titulo ng pangkat, at “awtoridad” upang mapanatili ang diwa ng ipinagkaloob na pamamahala. Inayos sa pangnagdaan ang historical present para sa maayos na salaysay, ngunit pinanatili ang impormasyon nito sa talababa.
