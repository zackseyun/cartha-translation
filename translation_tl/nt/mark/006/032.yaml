  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: tl
  text: At umalis sila sakay ng bangka patungo sa isang liblib na lugar[a] nang sila-sila lamang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lugar na walang tao” o “isang ilang na lugar.”
    reason: lexical_alternative
  - marker: b
    text: O “nang hiwalay sa iba” o “nang pribado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pagpapatuloy ng salaysay na karaniwan sa Marcos, nang hindi nagdaragdag ng mas tiyak na ugnayang gaya ng “kaya” o “pagkatapos.”
- source_word: ἀπῆλθον
  choice: umalis sila
  rationale: Likas at malinaw na ipinapahayag ang pag-alis nila mula sa dating kinaroroonan.
- source_word: ἐν τῷ πλοίῳ
  choice: sakay ng bangka
  rationale: Ang “sakay ng bangka” ay likas sa makabagong Tagalog at tumpak na naghahatid ng paglalakbay na nasa loob o lulan ng bangka.
- source_word: εἰς ἔρημον τόπον
  choice: patungo sa isang liblib na lugar
  rationale: Ang “liblib” ay naghahatid ng diwa ng isang lugar na hiwalay, tahimik, o kakaunti ang tao, nang hindi ito nililimitahan sa heograpikong disyerto.
- source_word: κατ’ ἰδίαν
  choice: nang sila-sila lamang
  rationale: Malinaw na ipinapakita ang maramihang simuno at ang kanilang paghiwalay sa ibang mga tao; pinananatili rin nito ang posibleng diwa ng pagiging pribado.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “liblib na lugar” bilang madaling maunawaang katumbas ng ἔρημον τόπον, habang inilagay sa talababa ang iba pang tunay na posibilidad. Ang “sila-sila lamang” ay natural na nagpapahayag na magkakasama sila ngunit hiwalay sa ibang tao.
