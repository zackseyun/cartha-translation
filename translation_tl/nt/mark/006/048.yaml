  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: tl
  text: Nakita niyang hirap na hirap sila sa pagsagwan, sapagkat laban sa kanila ang hangin. Bandang ikaapat na pagbabantay ng gabi[a], lumapit siya sa kanila na naglalakad sa ibabaw ng dagat[b], at balak niyang lagpasan sila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ikaapat na pagbabantay ng gabi” ay humigit-kumulang alas-tres hanggang alas-sais ng madaling-araw ayon sa paghahating Romano sa gabi.
    reason: cultural_note
  - marker: b
    text: Maaari ring “naglalakad sa ibabaw ng tubig.” Ang literal na salita sa Griyego ay “dagat.”
    reason: lexical_alternative
  - marker: c
    text: Ang “balak niyang lagpasan sila” ay maaaring mangahulugang balak lamang niyang dumaan nang lampas sa kanila. Ngunit maaari rin itong umalingawngaw sa mga tagpo sa Lumang Tipan kung saan “dumaraan” ang Diyos sa paghahayag ng sarili (halimbawa, Exodo 33:19, 22; 34:6; 1 Hari 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Nakita niyang
  rationale: Likas na ipinahahayag sa Tagalog ang aorist participle bilang sugnay na kaugnay ng sumunod na pagkilos, nang hindi labis na tinutukoy ang eksaktong pagkakasunod-sunod.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: hirap na hirap sila sa pagsagwan
  rationale: Ipinananatili ng pag-uulit na “hirap na hirap” ang matinding puwersa ng βασανιζομένους, habang ang “sa pagsagwan” ay natural na paglalahad ng kasabay na gawain sa ἐν τῷ ἐλαύνειν.
- source_word: ἐναντίος αὐτοῖς
  choice: salungat sa kanila
  rationale: Ang “salungat” ay dignificado at malinaw na nagpapahiwatig na humahadlang sa kanila ang hangin.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: Nang malapit na ang ikaapat na pagbabantay sa gabi
  rationale: Pinananatili ang sinaunang paghahati ng gabi at ang pagtatayang ipinahihiwatig ng περὶ; ipinaliliwanag sa talababa ang tinatayang oras.
- source_word: ἔρχεται πρὸς αὐτούς
  choice: lumapit siya sa kanila
  rationale: Ginawang nakaraan ang makasaysayang pangkasalukuyan upang maging natural ang salaysay sa modernong Tagalog; ang “lumapit” ay malinaw na naghahatid ng pagdating niya sa kanilang kinaroroonan.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: naglalakad sa ibabaw ng dagat
  rationale: Pinananatili ang θάλασσα bilang “dagat” at malinaw na ipinahahayag ng “sa ibabaw” ang pambihirang pagkilos.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: balak niyang lampasan sila
  rationale: Ipinahahayag ng “balak” ang intensiyon ng imperfect ἤθελεν, at iniiwang bukas ng “lampasan” kung payak na pagdaan o may alusyon sa pagpapakilala ng Diyos ang diwa.
theological_decisions:
- issue: Kahulugan ng balak niyang lampasan sila
  choice: Panatilihin sa pangunahing teksto ang literal at bukas na diwang “balak niyang lampasan sila.”
  alternative: Maaaring unawain na ibig lamang niyang dumaan sa unahan nila, o na umaalingawngaw ito sa mga tagpo sa Lumang Tipan kung saan “dumaraan” ang Diyos upang ihayag ang sarili.
  rationale: Hindi tahasang nililinaw ng Griyego ang layunin. Pinananatili ng salin ang tunay na interpretatibong tensiyon at inilalagay sa talababa ang posibleng alusyon sa pagpapakita ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “hirap na hirap” upang maihatid ang tindi ng pakikibaka nang hindi gumagamit ng di-likas na literalismong “pinahihirapan sa pagsagwan.” Pinanatili ang sinaunang katawagang “ikaapat na pagbabantay” at ipinaliwanag ito sa talababa.
