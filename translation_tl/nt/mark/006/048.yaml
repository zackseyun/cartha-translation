  terminology: Ang “dagat,” “ikaapat na pagbabantay,” at “Lumang Tipan” ay angkop. Pinanatili ang “lagpasan sila” upang huwag isara ang payak na kahulugan o ang posibleng alusyong pampaghahayag.
