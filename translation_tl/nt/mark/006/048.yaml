  - severity: low
    issue: Bahagyang di-idiomatiko ang “salungat sa kanila ang hangin.”
    rationale: Mas likas sa modernong Tagalog ang “laban sa kanila ang hangin,” na pinananatili ang adversatibong puwersa ng ἐναντίος.
