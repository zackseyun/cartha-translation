revisions:
- from: Nakita niyang hirap na hirap sila sa pagsagwan, sapagkat salungat sa kanila ang hangin. Nang malapit na ang ikaapat na pagbabantay sa gabi[a], lumapit siya sa kanila na naglalakad sa ibabaw ng dagat[b], at balak niyang lampasan sila[c].
  to: Nakita niyang hirap na hirap sila sa pagsagwan, sapagkat laban sa kanila ang hangin. Bandang ikaapat na pagbabantay ng gabi[a], lumapit siya sa kanila na naglalakad sa ibabaw ng dagat[b], at balak niyang lagpasan sila[c].
  rationale: Pinalitan ang panandang oras upang tuwirang maipahayag ang tantiya ng περὶ, at pinakinis ang dalawang parirala para sa natural na modernong Tagalog. Hindi binigyang-kahulugan sa pangunahing teksto ang “lagpasan sila”; nananatiling bukas ang payak at posibleng alusyong pagbasa, na maingat na itinatala sa talababa.
