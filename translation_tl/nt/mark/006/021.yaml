  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: tl
  text: At dumating ang isang angkop na araw[a] nang magdaos si Herodes ng isang piging[b] para sa pagdiriwang ng kanyang kaarawan, para sa kanyang matataas na opisyal, mga kumander ng hukbo, at mga nangungunang lalaki ng Galilea[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumating ang tamang pagkakataon.” Ipinahihiwatig ng Griyego ang isang araw na angkop o paborable sa takbo ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: O “nagdaos siya ng isang handaan.” Literal na sinasabi sa Griyego, “gumawa siya ng hapunan.”
    reason: lexical_alternative
  - marker: c
    text: O “mga pinakakilalang lalaki ng Galilea.” Tumutukoy ang parirala sa mga prominenteng lalaking pinuno ng rehiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γενομένης ἡμέρας εὐκαίρου
  choice: At dumating ang tamang pagkakataon
  rationale: Ipinahahayag ng genitive absolute ang pagdating ng araw na angkop o estratehikong pagkakataon sa takbo ng salaysay. Natural sa Filipino ang “dumating ang tamang pagkakataon,” bagaman ang ἡμέρας ay hindi na literal na inuulit bilang “araw.”
- source_word: ὅτε
  choice: ':'
  rationale: Ang kasunod na sugnay ang nagpapaliwanag kung anong pangyayari ang bumuo sa tamang pagkakataon. Ginamit ang tutuldok upang maiwasan ang alanganing pag-uulit ng “nang” habang pinananatili ang ugnayang temporal at nagpapaliwanag.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: sa kaarawan ni Herodes
  rationale: Ang γενέσια ay tumutukoy sa pagdiriwang o okasyon ng kaarawan. Ang “sa kaarawan” ang natural at malinaw na katumbas sa modernong Filipino.
- source_word: δεῖπνον ἐποίησεν
  choice: naghanda siya ng isang salu-salo
  rationale: Idyoma itong literal na “gumawa ng hapunan.” Ang “naghanda ng isang salu-salo” ay natural at angkop sa pormal na handaan para sa mga panauhing mataas ang katungkulan.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: para sa kanyang matataas na opisyal
  rationale: Ang μεγιστᾶνες ay mga taong mataas ang ranggo na kaugnay ng pamamahala ni Herodes. Mas malinaw sa karaniwang mambabasa ang “matataas na opisyal” kaysa “mga maharlika,” na maaaring magpahiwatig ng mas tiyak na uring panlipunan.
- source_word: τοῖς χιλιάρχοις
  choice: mga kumander ng hukbo
  rationale: Tumutukoy ang χιλίαρχοι sa matataas na pinunong militar. Inihahayag ng salin ang tungkulin nang hindi ipinipilit ang literal na “mga kumander ng isang libo” o isang tiyak na ranggong Romano.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: mga pangunahing lalaki ng Galilea
  rationale: Ang πρῶτοι ay mga prominenteng taong nangunguna sa rehiyon. Pinanatili ang panlalaking pagtukoy ng konteksto sa “mga pangunahing lalaki.”
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Ginamit ang nakaugaliang anyong Filipino ng personal na pangalang Herod.
- source_word: Καὶ
  choice: At
  rationale: Pinanatili ang pang-ugnay upang masalamin ang sunod-sunod na estilong pasalaysay ni Marcos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “At” bilang katangiang pangsalaysay ni Marcos. Ang “salu-salo,” “matataas na opisyal,” at “mga kumander ng hukbo” ay malinaw sa pangkalahatang mambabasa at hindi labis na teknikal.
