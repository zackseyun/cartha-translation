    issue: Nawala sa pangunahing teksto ang “araw” (ἡμέρας).
    rationale: Ang “tamang pagkakataon” ay naghahatid ng εὔκαιρος ngunit hindi ng pangngalang ἡμέρα. Maaaring panatilihin ang parehong diwa sa “isang angkop na araw.”
  - severity: medium
    issue: Ang tutuldok ang pumalit sa temporal na ὅτε.
    rationale: Ang ὅτε ay tahasang nagpapakilala ng pangyayaring naganap sa angkop na araw. Ang “nang” ay parehong natural at mas malapit sa ugnayang temporal ng Griyego.
  - severity: low
    issue: Ang “mga pangunahing lalaki” ay hindi gaanong idiomatiko sa Filipino.
    rationale: Ang “mga nangungunang lalaki” ay mas natural na pagpapahayag ng mga kilala o prominenteng lalaki ng Galilea.
