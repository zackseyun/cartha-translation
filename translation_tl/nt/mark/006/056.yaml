revisions:
- from: At saanman siya pumunta—sa mga nayon, mga lungsod, o mga kanayunan—inilalagay ng mga tao ang mga maysakit sa mga pamilihan. Nakikiusap sila sa kanya na mahawakan man lamang ng mga ito ang laylayan[a] ng kanyang damit. At lahat ng humawak dito ay gumagaling.[b]
  to: At saanman siya magpunta—sa mga nayon, mga lungsod, o kanayunan—inilalagay ng mga tao ang mga maysakit sa mga pamilihan at nakikiusap sila sa kanya na kahit man lamang mahawakan nila ang laylayan[a] ng kanyang damit. At lahat ng humawak sa kanya ay gumagaling.[b]
  rationale: Inayos ang huling sugnay upang katawanin ang αὐτοῦ bilang ‘sa kanya,’ habang ang naunang sugnay ay patuloy na malinaw na tumutukoy sa paghawak sa laylayan ng kanyang damit. Pinakinis din ang aspekto at ayos ng pangungusap sa modernong Filipino nang hindi binabago ang paulit-ulit na diwa ng mga imperfect na pandiwa.
