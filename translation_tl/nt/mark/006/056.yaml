language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: tl
  text: At saanman siya magpunta—sa mga nayon, mga lungsod, o kanayunan—inilalagay ng mga tao ang mga maysakit sa mga pamilihan at nakikiusap sila sa kanya na kahit man lamang mahawakan nila ang laylayan[a] ng kanyang damit. At lahat ng humawak sa kanya ay gumagaling.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gilid” o “palawit” ng kanyang damit. Maaaring tumukoy ang salitang Griego sa gilid o laylayan ng kasuutan at, sa kontekstong Judio, maaari ring magpahiwatig ng palawit nito.
    reason: lexical_alternative
  - marker: b
    text: Sa Griego, “naliligtas.” Sa kontekstong ito, tumutukoy ang pandiwa sa paggaling o panunumbalik ng kalusugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: saanman siya pumunta
  rationale: Ipinahahayag ng ὅπου ἂν ang di-tiyak at pangkalahatang diwa na ‘saanmang lugar,’ samantalang ang imperfect na εἰσεπορεύετο ay tumutukoy sa paulit-ulit na kilos; natural itong naipahihiwatig sa Filipino ng ‘saanman siya pumunta.’
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: mga nayon, mga lungsod, o mga kanayunan
  rationale: Ang κώμας ay maliliit na pamayanan o nayon, ang πόλεις ay mga lungsod/bayan, at ang ἀγρούς dito ay mga pook sa labas ng bayan o kanayunan, hindi lamang indibidwal na bukid.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sa mga pamilihan
  rationale: Ang ἀγορά ay pampublikong pamilihan o liwasang pinagdarausan ng kalakalan; malinaw at likas sa modernong Filipino ang ‘mga pamilihan.’
- source_word: ἐτίθεσαν
  choice: inilalagay ng mga tao
  rationale: Ang imperfect ay nagpapakita ng paulit-ulit o nakaugaliang pagkilos. Pinananatili ng ‘inilalagay’ ang aspektong ito; ang ‘mga tao’ ay likas na pagpapahayag sa Filipino ng di-binanggit na maramihang tagaganap.
- source_word: τοὺς ἀσθενοῦντας
  choice: mga maysakit
  rationale: Tumutukoy ang substantival participle sa mga taong mahina o may karamdaman; ang ‘mga maysakit’ ang malinaw at karaniwang katumbas.
- source_word: παρεκάλουν αὐτόν
  choice: nakikiusap sila sa kanya
  rationale: Sa kontekstong ito, ang παρακαλέω ay taimtim na pakiusap. Ang ‘nakikiusap’ ay natural at marangal nang hindi nagpapalabis.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: na mahawakan man lamang ... ng mga ito
  rationale: Ipinahahayag ng κἄν ang pinakamaliit na hinihiling—‘kahit/man lamang.’ Ang anyong ‘mahawakan ... ng mga ito’ ay nagpapanatiling ang mga maysakit ang hahawak.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: ang laylayan ng kanyang damit
  rationale: Ang κράσπεδον ay maaaring tumukoy sa gilid, laylayan, o palawit ng kasuutan. Ang ‘laylayan’ ay natural at hindi labis na nagtatakda kung simpleng gilid o ritwal na palawit ang tinutukoy.
- source_word: ἥψαντο αὐτοῦ
  choice: humawak dito
  rationale: Bagaman literal na may panghalip na maaaring tumukoy sa kanya, ang pinakamalapit na tahasang bagay sa konteksto ay ang laylayan ng kanyang damit. Ang ‘dito’ ay likas na tumutukoy rito habang iniiwasan ang di-kinakailangang pag-uulit.
- source_word: ἐσῴζοντο
  choice: gumagaling
  rationale: Maaaring mangahulugan ang σῴζω ng iligtas, pagalingin, o gawing buo. Dahil mga maysakit at pisikal na paggaling ang agarang konteksto, ‘gumagaling’ ang malinaw na kontekstuwal na salin; itinatala sa talababa ang mas malawak na literal na diwa.
theological_decisions:
- issue: Saklaw ng kahulugan ng ἐσῴζοντο (σῴζω)
  choice: gumagaling
  alternative: naliligtas / nagiging magaling
  rationale: Pisikal na karamdaman at paggaling ang tuwirang paksa ng talata, kaya hindi dapat ipilit sa pangunahing teksto ang eksklusibong soteriolohikal na pagbasa. Gayunman, pinananatili sa talababa ang literal at mas malawak na saklaw ng pandiwa.
- issue: Tinutukoy ng αὐτοῦ sa ἥψαντο αὐτοῦ
  choice: humawak dito, na tumutukoy sa laylayan ng damit
  alternative: humawak sa kanya
  rationale: Sa gramatika, maaaring isalin ang αὐτοῦ na ‘sa kanya,’ ngunit hinihingi ng naunang sugnay na mahawakan ang laylayan ng damit. Pinananatili ng salin ang agarang kontekstuwal na ugnayan nang hindi itinatanggi ang literal na anyo, na maaari ring ipaliwanag bilang paghawak sa kanya sa pamamagitan ng kanyang kasuutan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang karaniwang ‘mga maysakit,’ ‘mga pamilihan,’ at ‘nakikiusap,’ at iniwasan ang masyadong arkaiko o denominasyonal na pananalita. Ang mga gitling na em dash ay tumutulong upang malinaw na mabasa ang tatlong uri ng lugar.
