  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: tl
  text: Ngunit patuloy na nagkimkim ng galit si Herodias laban sa kanya at nais niyang patayin siya, ngunit hindi niya ito magawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang pagsalungat o pag-usad mula sa naunang pahayag; natural sa konteksto ang “Ngunit.”
- source_word: Ἡρῳδιὰς
  choice: Herodias
  rationale: Ginamit ang karaniwang anyo ng personal na pangalan sa Filipino.
- source_word: ἐνεῖχεν αὐτῷ
  choice: nagtanim ng galit ... laban sa kanya
  rationale: Ipinahahayag ng idyoma ang patuloy na pagkimkim ng matinding sama ng loob o pagkapoot; likas sa Filipino ang “nagtanim ng galit,” at ipinahihiwatig ng konteksto ang nagpapatuloy na pagkapoot.
- source_word: ἤθελεν
  choice: gusto
  rationale: Direkta at natural na salin ng patuloy na hangarin na ipinahahayag ng imperfect.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: siyang ipapatay
  rationale: Sa konteksto, nais ni Herodias na mapatay si Juan, hindi kinakailangang siya mismo ang gagawa nito. Iniiwasan din nito ang pagdaragdag ng legal o moral na kahulugang taglay ng “paslangin.”
- source_word: καὶ οὐκ ἠδύνατο
  choice: pero hindi niya magawa
  rationale: 'Bagaman literal na “at,” adversative ang bisa rito: nais niya itong gawin, ngunit wala siyang kakayahan o pagkakataong maisakatuparan iyon.'
