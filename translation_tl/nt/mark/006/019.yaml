- from: Ngunit nagtanim ng galit si Herodias laban sa kanya at gusto siyang ipapatay,[a] pero hindi niya magawa.
  to: Ngunit patuloy na nagkimkim ng galit si Herodias laban sa kanya at nais niyang patayin siya, ngunit hindi niya ito magawa.
  rationale: Pinalitan ang causative na “ipapatay” ng tuwirang “patayin siya” upang maiwasan ang pagdaragdag ng paraan o ahensiya ng pagpatay. Inalis ang kaugnay na talababa sapagkat ang rebisyong teksto ay sapat na tuwiran at hindi nangangailangan ng lexical na alternatibo. Ginamit ang “patuloy na nagkimkim ng galit” upang maipakita ang nagpapatuloy na pagkapoot sa imperfect na ἐνεῖχεν.
