  verdict: revise
  source_fidelity: Ang “ipapatay” ay causative at maaaring magpahiwatig na si Herodias ay mag-uutos sa iba upang patayin si Juan. Hindi ito tahasang isinasaad ng αὐτὸν ἀποκτεῖναι, na tuwirang “patayin siya.” Mas tapat ang “nais niyang patayin siya.” Ang “patuloy na nagkimkim ng galit” ay naipapahayag nang maayos ang duratibong pagkapoot ng ἐνεῖχεν.
  naturalness: Natural at malinaw sa modernong Filipino ang binagong pangungusap. Ang pag-uulit ng “ngunit” ay angkop upang ilahad ang pagsalungat sa hangarin ni Herodias at sa kawalan niya ng kakayahang maisagawa ito.
  terminology: Napanatili ang karaniwang anyong “Herodias.” Ang “nagkimkim ng galit” ay angkop na katumbas ng idiomang Griego para sa patuloy na pagkapoot o sama ng loob, nang hindi nagpapahina rito.
