  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: tl
  text: Sumama siya sa kanya. Sinusundan siya ng napakaraming tao, at nagsisiksikan ang mga ito sa paligid niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakikipagsiksikan sa kanya” o “dumidiin sa kanya.” Ipinahihiwatig ng pandiwang Griyego na dahil sa siksikan ay pisikal na naiipit si Jesus sa gitna ng maraming tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: Sumama
  rationale: Sa konteksto, ang pag-alis ni Jesus ay kasama ang lalaking humiling sa kanya. Ang “sumama” ay natural sa Filipino at naipapahayag ang kilos na inilalarawan ng ἀπέρχομαι kasama ng μετ’ αὐτοῦ, nang hindi gumagamit ng mas pormal na “lumisan.”
- source_word: μετ’ αὐτοῦ
  choice: sa kanya
  rationale: Ang μετά na may genitive ay nagsasaad ng pagsama. Kasama ng “Sumama,” ang “sa kanya” ang natural na katumbas sa modernong Filipino.
- source_word: ἠκολούθει
  choice: Sinusundan
  rationale: Ang aspektong nagpapatuloy ng imperfect ay ipinahahayag ng anyong “sinusundan,” na nagpapakitang patuloy na sumusunod ang maraming tao habang naglalakad si Jesus.
- source_word: ὄχλος πολύς
  choice: napakaraming tao
  rationale: Natural na ipinahahayag nito ang isang malaking pulutong. Mas karaniwan at madaling maunawaan ito kaysa sa mas pormal na “malaking karamihan.”
- source_word: συνέθλιβον
  choice: nagsisiksikan ... sa paligid
  rationale: Ipinahihiwatig ng συνθλίβω ang pisikal na pagdagsa at pagdiin ng pulutong. Ang “nagsisiksikan sa paligid” ay natural sa Filipino at hindi labis na nagpapahiwatig na dinudurog o sinasaktan si Jesus.
- source_word: αὐτόν
  choice: niya
  rationale: Tumutukoy ang panghalip kay Jesus, na nasa gitna ng nagsisiksikang mga tao.
