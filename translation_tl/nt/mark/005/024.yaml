  register: Gumamit ng natural at dignified na modernong Filipino. Pinanatili ang mga panghalip ng Griyego sa halip na idagdag ang pangalang “Jesus,” yamang malinaw ang tinutukoy mula sa konteksto. Inilipat ang talababa sa pariralang tinatalakay nito.
