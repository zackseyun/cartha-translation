  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: tl
  text: Agad na tumayo[a] ang batang babae at nagsimulang maglakad, sapagkat labindalawang taong gulang siya. At agad silang labis na namangha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumangon.” Maaari ring tumukoy ang pandiwang Griyego sa pagtayo o pagbangon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “namangha sila nang may matinding pagkamangha.” Gumagamit ang Griyego ng magkaugnay na pandiwa at pangngalan upang idiin ang tindi ng kanilang pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili ng “agad” ang mabilis at masiglang takbo ng salaysay na katangian ng Marcos, at natural ito sa makabagong Filipino.
- source_word: ἀνέστη
  choice: tumayo
  rationale: Sa konteksto, inilalarawan nito ang pisikal na pagbangon ng batang babae matapos siyang utusan ni Jesus. Ang “tumayo” ay malinaw at hindi labis na nagpapatingkad ng terminolohiyang tungkol sa muling pagkabuhay, bagaman ang pangyayari ay pagpapanumbalik sa buhay.
- source_word: τὸ κοράσιον
  choice: ang batang babae
  rationale: Natural na katumbas ito ng salitang tumutukoy sa isang batang babae; nililinaw rin ng kasunod na sugnay na siya ay labindalawang taong gulang.
- source_word: περιεπάτει
  choice: nagsimulang maglakad
  rationale: Ipinahihiwatig ng aspektong imperpektibo ang nagpapatuloy na pagkilos matapos siyang tumayo. Naipapahayag ng parirala ang pagsisimula at nakikitang pagpapatuloy ng paglakad.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: sapagkat labindalawang taong gulang na siya
  rationale: Ang “sapagkat” ay nagpapanatili sa paliwanag na tungkulin ng γάρ, at ang buong parirala ay karaniwang paraan ng pagsasabi ng edad sa Filipino.
- source_word: ἐξέστησαν ... ἐκστάσει μεγάλῃ
  choice: labis na namangha
  rationale: Natural nitong ipinahahayag ang napakatinding pagkagulat at pagkamangha, bagaman hindi nito inuulit ang magkaugnay na salita gaya ng ginagawa ng Griyego.
theological_decisions:
- issue: Posibleng pahiwatig ng muling pagkabuhay sa ἀνέστη
  choice: Isinalin bilang pisikal na pagtayo (“tumayo”) sa loob ng salaysay ng himala.
  alternative: “bumangon”
  rationale: Malinaw sa konteksto na ibinalik sa buhay ang batang babae, ngunit maaari ring karaniwang tumukoy ang pandiwa sa pagtayo o pagbangon. Hindi ginagawang higit na tahasan ng salin ang teolohikal na pahiwatig kaysa sa mismong salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “agad” upang mapanatili ang mabilis na ritmo ng Marcos, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
