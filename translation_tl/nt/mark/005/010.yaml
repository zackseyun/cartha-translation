  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: tl
  text: At paulit-ulit siyang nakiusap kay Jesus na huwag silang ipadala sa labas ng lupaing iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na huwag silang paalisin mula sa lupaing iyon.”
    reason: Alternatibong leksikal para sa ἀποστείλῃ ἔξω τῆς χώρας; pinapanatili nito ang diwa ng pagpapadala o pagpapaalis palabas ng lokal na lupain.
lexical_decisions:
- source_word: παρεκάλει
  choice: nakiusap
  rationale: Sa konteksto ng pagpapalayas ng masasamang espiritu, ipinahihiwatig nito ang marubdob na pakiusap. Likas at malinaw sa makabagong Tagalog ang “nakiusap.”
- source_word: πολλὰ
  choice: paulit-ulit
  rationale: Ginamit itong pang-abay upang ipakita na maraming ulit ginawa ang pakiusap; mas natural ito kaysa literal na “nang marami.”
- source_word: ἵνα μὴ
  choice: na huwag
  rationale: Natural nitong ipinapahayag sa Tagalog ang nilalaman ng negatibong pakiusap.
- source_word: αὐτὰ
  choice: sila
  rationale: Bagaman neuter plural sa Griyego, tumutukoy ito sa mga espiritung marumi bilang mga personal na kumikilos; “sila” ang likas na panghalip sa Tagalog at pinananatili ang maramihang bilang.
- source_word: ἀποστείλῃ
  choice: paalisin
  rationale: Sa pariralang may ἔξω, ang diwa ay ipadala o paalisin mula sa lugar. “Paalisin” ang malinaw at natural, nang hindi idinaragdag ang puwersang ipinahihiwatig ng “itaboy.”
- source_word: ἔξω τῆς χώρας
  choice: sa lupaing iyon
  rationale: Ang χώρα ay lokal na lupain, distrito, o nasasakupan, hindi makabagong bansang-estado. Sa konstruksiyong “paalisin sa,” natural na naipahihiwatig ang paglabas mula roon.
- source_word: αὐτόν
  choice: kay Jesus
  rationale: Pinalinaw ang reperente ng panghalip para sa natural na Tagalog; si Jesus ang kausap ayon sa agarang konteksto.
theological_decisions:
- issue: Pagpapalit mula sa isahang tagapagsalita tungo sa maramihang mga espiritu
  choice: “siya” para sa nakiusap at “sila” para sa mga paaalisin
  alternative: Gawing pawang maramihan ang pahayag upang pag-isahin ang bilang
  rationale: 'Pinananatili nito ang tensiyon sa Griyego: isang tagapagsalita ang nakikiusap para sa maraming demonyo, sa halip na pakinisin ang pagbabago ng bilang.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “paulit-ulit na nakiusap” upang ihatid ang tindi at pag-uulit, at “lupaing iyon” upang maiwasan ang makabagong pampolitikang kahulugan ng “bansa.”
