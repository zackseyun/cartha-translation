  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: tl
  text: Ngunit narinig ni Jesus ang sinasabi[a] at sinabi niya sa pinuno ng sinagoga, “Huwag kang matakot; manampalataya ka lamang.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling, “Ngunit hindi pinansin ni Jesus ang sinabi,” kung ang παρακούσας ay inuunawang tumutukoy sa hindi pagbigay-pansin sa balita sa halip na sa pagkarinig dito.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “magtiwala ka lamang” o “patuloy ka lamang na manampalataya.” Ang pandiwang Griyego ay πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: narinig
  rationale: Maaaring tumukoy ang participle sa pagkarinig sa sinabi o sa hindi pagpansin dito. Ang “narinig” ang higit na natural sa daloy ng salaysay sapagkat agad tumugon si Jesus sa balitang binigkas, habang pinananatili sa talababa ang ibang posibleng diwa.
- source_word: τὸν λόγον λαλούμενον
  choice: ang sinasabi nila
  rationale: Natural itong salin sa modernong Tagalog ng bagay na kasalukuyang binibigkas. Ang pangmaramihang “nila” ay tumutukoy sa mga taong naghatid ng balita sa naunang konteksto, nang hindi inuulit nang mabigat ang literal na “salitang sinasabi.”
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, karaniwang mas natural at malinaw sa salaysay na Tagalog ang aspektong naganap na “sinabi.”
- source_word: ἀρχισυναγώγῳ
  choice: pinuno ng sinagoga
  rationale: Tuwirang inilalarawan nito ang namumuno o nangangasiwang opisyal ng sinagoga sa malinaw at kasalukuyang Tagalog.
- source_word: Μὴ φοβοῦ
  choice: Huwag kang matakot
  rationale: Natural at tuwirang utos ito sa Tagalog at pinananatili ang pang-isahang kausap.
- source_word: μόνον
  choice: lamang
  rationale: Nililimitahan nito ang tugong hinihingi ni Jesus at angkop ang “lamang” sa marangal at natural na rehistro.
- source_word: πίστευε
  choice: manampalataya ka
  rationale: Karaniwang pandiwang Tagalog ito para sa πιστεύω sa kontekstong panrelihiyon. Hindi nito sapilitang nilulutas kung ang diin ay paniniwala, pananampalataya, o pagtitiwala; inilalahad sa talababa ang mga lehitimong alternatibo.
theological_decisions:
- issue: Semantikong diwa ng παρακούσας
  choice: Narinig ni Jesus ang ibinabalita.
  alternative: Hindi pinansin o binale-wala ni Jesus ang sinabi.
  rationale: Kapuwa posible sa leksikon, ngunit ang agarang pagtugon ni Jesus sa binigkas na balita ay natural na sumusuporta sa “narinig.” Pinananatili sa talababa ang alternatibo upang hindi maitago ang tunay na ambigwidad.
- issue: Pagpapakahulugan sa πιστεύω sa utos ni Jesus
  choice: manampalataya
  alternative: magtiwala o patuloy na manampalataya
  rationale: Ang “manampalataya” ang tuwirang karaniwang katumbas sa kontekstong ito. Gayunman, maaaring idiin ng present imperative ang nagpapatuloy na pananampalataya, at maaari ring ipahayag ang relasyonal na diwa bilang pagtitiwala; kaya inilalagay ang mga ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sinagoga” bilang kinikilalang katawagan at ang “pinuno” bilang natural na paglalarawan sa tungkulin. Ang mga talababa ay inilagay pagkatapos mismo ng mga bahaging may tunay na leksikal na ambigwidad.
