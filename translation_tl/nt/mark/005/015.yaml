revisions:
- from: At lumapit sila kay Jesus at nakita nila ang lalaking sinasapian ng mga demonyo. Nakaupo na ito, may damit, at matino na ang pag-iisip—siya na dating sinasapian ng legion[a]. At natakot sila.
  to: At pumunta sila kay Jesus at nakita nila ang lalaking sinasapian ng mga demonyo, na nakaupo, nakasuot ng damit, at matino ang pag-iisip—ang dating sinasapian ng lehiyon[a]. At natakot sila.
  rationale: Inayos ang sintaksis upang mas malapit na mapanatili ang magkakaugnay na paglalarawan sa lalaki sa Griyego. Pinalitan ang “may damit” ng mas tiyak na “nakasuot ng damit,” at ang “nakaupo na ito” ng mas natural at magalang na sugnay. Hindi binago ang kahulugan, ang pagkakasunod ng salaysay, o ang sinadyang di-pagpapasya kung ang lehiyon ay pangkaraniwang katawagan o pangalan.
