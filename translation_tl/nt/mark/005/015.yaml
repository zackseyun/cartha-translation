id: MRK.5.15
reference: Mark 5:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: tl
  text: At pumunta sila kay Jesus at nakita nila ang lalaking sinasapian ng mga demonyo, na nakaupo, nakasuot ng damit, at matino ang pag-iisip—ang dating sinasapian ng lehiyon[a]. At natakot sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Legion.” Maaaring ituring itong pangalang ginamit ng mga demonyo para sa kanilang sarili.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: lumapit sila
  rationale: Ang pangkasaysayang pangkasalukuyan ay likas na isinasalaysay sa nakaraang panahunan sa Filipino. Ang πρὸς τὸν Ἰησοῦν ay nagpapahiwatig ng paglapit kay Jesus.
- source_word: θεωροῦσιν
  choice: nakita nila
  rationale: Isa rin itong pangkasaysayang pangkasalukuyan; malinaw at natural ang nakaraang panahunan sa salaysay.
- source_word: δαιμονιζόμενον
  choice: ang lalaking sinasapian ng mga demonyo
  rationale: Ginagamit ang participle bilang pangngalan para sa kilalang lalaki. Pinananatili ng salin ang tahasang demonyong pagpapahirap; ang maramihan ay angkop sa konteksto ng legion.
- source_word: καθήμενον
  choice: nakaupo na ito
  rationale: Inilalarawan ang hayag na nagbagong kalagayan ng lalaki. Ang “na” ay natural na nagpapakita ng kaibahan sa dati niyang kalagayan nang hindi nagdaragdag ng bagong pangyayari.
- source_word: ἱματισμένον
  choice: may damit
  rationale: Natural na modernong Filipino ito at malinaw na kabaligtaran ng dati niyang kahubaran.
- source_word: σωφρονοῦντα
  choice: matino na ang pag-iisip
  rationale: Ipinahahayag nito ang maayos na pag-iisip at pagpipigil sa sarili nang hindi gumagamit ng klinikal o mapanlait na katawagan.
- source_word: ἐσχηκότα
  choice: dating sinasapian
  rationale: Ang perfect participle ay tumutukoy sa naunang kalagayang mahalaga pa sa pagkakakilanlan ng lalaki. Malinaw ng “dating” na hindi na nagpapatuloy ang pagsapi.
- source_word: λεγιῶνα
  choice: legion
  rationale: Pinananatili ang katawagang ginamit ng mga demonyo sa naunang konteksto at hindi sapilitang pinipili kung karaniwang paglalarawan o pangalang pantangi ito.
- source_word: ἐφοβήθησαν
  choice: natakot sila
  rationale: Tuwiran at natural na salin ng reaksiyong inihahayag ng aorist.
theological_decisions:
- issue: Paglalarawan sa demonyong pagsapi
  choice: ang lalaking sinasapian ng mga demonyo
  alternative: ang lalaking may demonyo
  rationale: Hindi pinapalabo ang supernatural na pahayag ng teksto bilang karamdaman lamang. Ang maramihan ay ginagawang malinaw ng agarang konteksto ng legion, bagaman morpolohikal na hindi tinutukoy ng δαιμονιζόμενον ang bilang.
- issue: Ang λεγιών bilang katawagan o pangalang pantangi
  choice: legion
  alternative: Legion
  rationale: Maaaring unawain ang salita bilang katawagang naglalarawan sa napakaraming demonyo o bilang kanilang ginamit na pangalan. Maliit na titik ang nasa pangunahing teksto, at pinananatili sa talababa ang alternatibong malaking titik.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Hinati sa maiikling pangungusap ang mahabang estrukturang Griyego para madaling maunawaan, habang pinananatili ang pagkakasunod ng tagpo at ang kaibahan ng dati at kasalukuyang kalagayan ng lalaki.
