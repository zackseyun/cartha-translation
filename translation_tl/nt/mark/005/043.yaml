  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: tl
  text: Mahigpit niya silang pinagbilinan na huwag itong malaman ng sinuman,[a] at sinabi niyang bigyan siya ng makakain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Paulit-ulit niya silang mahigpit na pinagbilinan” o “Mariin niya silang pinagbilinan.” Ang salitang Griego na literal na nangangahulugang “marami” o “lubha” ay nagpapatingkad dito sa tindi ng bilin.
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “na bigyan siya upang kumain,” o mas malapit sa anyong Griego, “na maibigay sa kaniya ang makakain.” Sa likas na Tagalog, “bigyan siya ng makakain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: Mahigpit niya silang pinagbilinan
  rationale: Ang διεστείλατο ay isang mariing bilin o utos, at ang πολλὰ ay nagpapalakas sa tindi nito. Likas sa modernong Tagalog ang “mahigpit na pinagbilinan” at hindi ito lipas o labis na teknikal.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: na huwag itong malaman ng sinuman
  rationale: Pinananatili nito ang layunin ng bilin at ang di-tiyak na reperente ng τοῦτο (“ito”), nang hindi dinaragdagan ng paliwanag tungkol sa pangyayari.
- source_word: εἶπεν δοθῆναι αὐτῇ φαγεῖν
  choice: sinabi niyang bigyan siya ng makakain
  rationale: Ipinapakita ng “sinabi” ang payak na εἶπεν, samantalang natural na naihahayag sa Tagalog ng “bigyan siya ng makakain” ang pasibong infinitive na δοθῆναι at ang idyomatikong diwa ng φαγεῖν.
theological_decisions:
- issue: Saklaw at dahilan ng utos na huwag ipaalam ang pangyayari
  choice: Isinalin lamang bilang mariing bilin na huwag itong malaman ng sinuman.
  alternative: Ipaliwanag sa teksto na ang utos ay para lamang sa pamilya o tahasang iugnay ito sa mas malawak na tema ng paglilihim tungkol sa Mesiyas.
  rationale: Hindi ipinaliliwanag ng talata ang dahilan o eksaktong saklaw ng utos. Pinananatili ng salin ang tensiyon at hindi nagdaragdag ng doktrinal o naratibong paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pinagbilinan” upang maipahayag ang mariing utos nang hindi tunog-legal o lipas. Pinanatili ang “ito” at “siya” upang huwag palitan ng mas tiyak na reperente ang mga panghalip sa Griego.
