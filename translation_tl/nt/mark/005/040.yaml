source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: tl
  text: Pinagtatawanan nila siya.[a] Ngunit matapos palabasin ni Jesus ang lahat, isinama niya ang ama at ina ng bata, pati ang mga kasama niya,[b] at pumasok siya sa kinaroroonan ng bata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kinutya nila siya.” Ang pandiwang Griyego ay maaaring tumukoy sa mapanlibak na pagtawa.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga alagad na kasama niya.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: pinagtawanan
  rationale: Ipinahihiwatig ng di-ganap na panahunan ang nagpapatuloy na mapanlibak na pagtawa. Likas sa Filipino ang “pinagtawanan” at hindi nito pinalalabis ang diwa bilang tahasang pangungutya.
- source_word: αὐτοῦ
  choice: siya
  rationale: Ang genitibo kasunod ng καταγελάω ay idyomatikong tumutukoy sa taong pinagtatawanan.
- source_word: ἐκβαλὼν πάντας
  choice: matapos silang palabasin ni Jesus
  rationale: Nauuna ang kilos ng participle sa mga pangunahing pandiwa. Ang “palabasin” ay natural at malinaw, at iniiwasan ang posibleng maling ugnay ng mas literal na “itinaboy” sa pagpapalayas ng demonyo. Binanggit si Jesus upang luminaw ang simuno sa Filipino.
- source_word: παραλαμβάνει
  choice: isinama niya
  rationale: Ipinahihiwatig ng pandiwa na dinala niya ang mga piling kasama. Ginamit ang pangnagdaang anyo sapagkat mas natural ito sa salaysay na Filipino kaysa piliting panatilihin ang Griyegong historical present.
- source_word: παιδίου / παιδίον
  choice: bata
  rationale: Neutral sa kasarian ang παιδίον. Bagaman kilala sa konteksto na babae ang bata, pinananatili rito ang antas ng katiyakan ng mismong talata.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: ang mga kasama niya
  rationale: Tapat at natural na katumbas ito ng ekspresyon, nang hindi tahasang pinapangalanan sa pangunahing teksto kung sino sila.
- source_word: εἰσπορεύεται
  choice: pumasok siya
  rationale: Natural na anyong pasalaysay sa Filipino; ang direksiyon ng pagpasok ay malinaw sa kasunod na parirala.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: sa kinaroroonan ng bata
  rationale: Pinananatili nito ang payak na pahayag tungkol sa lokasyon at hindi idinaragdag na nakahiga ang bata, na hindi tahasang sinabi sa sugnay.
theological_decisions:
- issue: Panahunan at kasiglahan ng salaysay
  choice: Gamitin ang natural na pangnagdaang panahunan sa Filipino (“isinama,” “pumasok”)
  alternative: Panatilihin nang literal ang historical present (“isinasama,” “pumapasok”)
  rationale: Karaniwan sa salaysay na Griyego ni Marcos ang historical present, ngunit magiging alanganin at maaaring magpahiwatig ng kasalukuyang kilos sa modernong Filipino. Naipapahayag ng pangnagdaan ang wastong pagkakasunod-sunod nang walang pagbabagong teolohikal.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling basahin. Ginamit ang “pinagtawanan,” “palabasin,” at “kinaroroonan” upang pagsamahin ang likas na daloy at katapatan sa Griyego. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
