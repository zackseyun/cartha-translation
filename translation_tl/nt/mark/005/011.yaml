base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: tl
  text: May isang malaking kawan ng mga baboy na nanginginain doon, malapit sa bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tabi ng bundok.” Ang pariralang Griyego na πρὸς τῷ ὄρει ay tumutukoy sa kinalalagyan na malapit o katabi ng bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: May
  rationale: Natural na eksistensiyal na pahayag sa Tagalog. Hindi kailangang gawing tahasang “at” o “ngayon” ang banayad na pang-ugnay na δέ.
- source_word: ἐκεῖ
  choice: doon
  rationale: Tuwirang katumbas ng panandang pook na tumutukoy sa lugar na nabanggit sa salaysay.
- source_word: πρὸς τῷ ὄρει
  choice: malapit sa bundok
  rationale: Sa datibo, ipinahihiwatig ng πρός ang kinalalagyan sa tabi o malapit sa bundok, nang hindi labis na tinitiyak ang eksaktong puwesto.
- source_word: ἀγέλη
  choice: kawan
  rationale: Karaniwan at natural na tawag sa isang pangkat ng mga hayop.
- source_word: χοίρων
  choice: ng mga baboy
  rationale: Ang “baboy” ang malinaw at pangkasalukuyang katumbas ng χοῖρος sa modernong Tagalog.
- source_word: μεγάλη
  choice: malaking
  rationale: Inilalarawan nito ang laki o dami ng kawan; natural sa Tagalog ang “malaking kawan.”
- source_word: βοσκομένη
  choice: nanginginain
  rationale: Ipinahahayag ng kasalukuyang participle na kumakain ang kawan sa pastulan. Ang “nanginginain” ay maikli, natural, at angkop sa tagpo.
