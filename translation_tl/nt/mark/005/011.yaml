translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “baboy” sa halip na isang mas luma o teknikal na katawagan; hindi na kailangan ng hiwalay na talababa para rito dahil wala itong makabuluhang alternatibo sa karaniwang Tagalog.
