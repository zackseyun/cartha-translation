reference: Mark 5:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: tl
  text: Ngunit ang babae, na natatakot at nanginginig at alam ang nangyari sa kanya, ay lumapit, nagpatirapa sa harap niya[a], at sinabi sa kanya ang buong katotohanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bumagsak sa harap niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pag-usad ng salaysay mula sa tanong ni Jesus at sa tugon ng karamihan tungo sa tugon ng babae.
- source_word: ἡ γυνὴ
  choice: ang babae
  rationale: Tumutukoy ito sa babaeng naipakilala na sa naunang salaysay, kaya ang tiyak na anyong “ang babae” ang angkop.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: na natatakot at nanginginig
  rationale: Pinananatili ang dalawang magkaugnay na paglalarawan sa matinding kalagayan ng babae sa natural na modernong Tagalog.
- source_word: εἰδυῖα
  choice: alam
  rationale: Pinananatiling bukas ang ugnayang pangyayari ng participle at hindi tahasang ginagawang sanhi sa pamamagitan ng “dahil alam niya,” bagaman maaaring ipinahihiwatig ng konteksto ang sanhi.
- source_word: ὃ γέγονεν αὐτῇ
  choice: ang nangyari sa kanya
  rationale: Natural na Tagalog ito para sa karanasang naganap sa babae, na sa konteksto ay ang kanyang paggaling.
- source_word: ἦλθεν
  choice: lumapit
  rationale: Sa kontekstong kinakaharap niya si Jesus, ang “lumapit” ay natural na pagpapahayag ng pagpunta niya sa kinaroroonan nito nang hindi nagdaragdag ng ibang kilos.
- source_word: προσέπεσεν αὐτῷ
  choice: nagpatirapa sa harap niya
  rationale: Ipinapahayag ang pagbagsak o pagpapatirapa sa harap ni Jesus bilang kilos ng paggalang, takot, o pagsusumamo, nang hindi tahasang ipinapakahulugang pagsamba.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: sinabi sa kanya ang buong katotohanan
  rationale: Natural at tapat na ipinahahayag na isinalaysay ng babae ang lahat nang walang ikinukubli.
theological_decisions:
- issue: Ang kahulugan ng postura sa προσέπεσεν αὐτῷ
  choice: nagpatirapa sa harap niya
  alternative: bumagsak sa harap niya
  rationale: Maaaring tumukoy ang pandiwa sa pagbagsak sa harap ng isang tao dahil sa paggalang, takot, desperasyon, o pagsusumamo. Pinananatili ng salin ang pisikal at mapagpitagang kilos ngunit hindi ipinapasya na tahasang pagsamba ang ibig sabihin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa salaysay. Ginamit ang “nagpatirapa” upang maipakita ang kilos sa προσέπεσεν nang hindi idinaragdag ang “sa kanyang paanan,” na hindi tahasang nasa Griyego. Ang pagkakasunod ng “natatakot at nanginginig at alam” ay nagpapanatili sa maluwag na ugnayan ng mga participle sa halip na gawing tahasang sanhi ang kaalaman ng babae.
