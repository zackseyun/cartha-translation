  source_fidelity: 'Tapat ang salin sa mga pangunahing elemento ng Griyego: ang banayad na pag-usad sa δέ, ang takot at panginginig ng babae, ang kaniyang kaalaman sa nangyari sa kaniya, ang paglapit niya, ang pagpatirapa sa harap ni Jesus, at ang pagsasabi ng buong katotohanan. Hindi nito ginagawang tahasang sanhi ang εἰδυῖα at hindi rin ipinapataw na pagsamba ang προσέπεσεν.'
