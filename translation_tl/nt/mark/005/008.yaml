  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: tl
  text: Sapagkat patuloy niyang sinasabi sa kanya[a], “Lumabas ka mula sa lalaki, maruming espiritu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “sa kanya” sa lalaki o sa espiritu. Sa Griyego, ang “maruming espiritu” ay nasa anyong karaniwang isinasaling may pantukoy, ngunit dito ay ginagamit bilang tuwirang pagtawag.
    reason: Pagpapanatili ng kalabuan ng tinutukoy ng panghalip at paglilinaw sa balarila ng tuwirang pagtawag.
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ang imperpektong aspekto ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita sa nakaraang tagpo. Ipinahahayag ito ng “patuloy” nang hindi ginagawang payak na minsanang sinabi lamang.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag sa naunang pahayag; malinaw at marangal na pang-ugnay ang “Sapagkat.”
- source_word: αὐτῷ
  choice: sa kanya
  rationale: Hindi tinutukoy ng panghalip sa Filipino ang kasarian, kaya napapanatili nito ang posibilidad na ang tinutukoy ay ang lalaki o ang espiritu, samantalang malinaw sa utos na ang maruming espiritu ang direktang kinakausap.
- source_word: Ἔξελθε
  choice: Lumabas ka
  rationale: Tuwirang pautos ito na nagsasaad ng paglabas mula sa loob ng lalaki; likas sa modernong Filipino ang “Lumabas ka.”
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: maruming espiritu
  rationale: Bagaman nasa anyong may pantukoy sa Griyego, gumaganap ang parirala bilang tuwirang pagtawag. Pinananatili ng “maruming espiritu” ang literal na diwa ng ἀκάθαρτον at hindi ito pinapalitan ng mas interpretatibong “masamang espiritu.”
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: sa taong ito
  rationale: Kasunod ng “lumabas,” likas na ipinapahayag ng “sa” ang paggalaw mula sa loob. Nililinaw ng “taong ito” na ang tinutukoy ay ang partikular na lalaki sa salaysay.
theological_decisions:
- issue: Kahulugan ng πνεῦμα ἀκάθαρτον sa konteksto ng pagpapalayas ng espiritu
  choice: maruming espiritu
  alternative: masamang espiritu
  rationale: Tahasang “marumi” ang salitang Griyego at maaari itong magtaglay ng mga pahiwatig ng karumihang panrelihiyon at moral. Ang “masama” ay isang interpretasyon na hindi kasing-tiyak ng pinagmulan.
- issue: Tinutukoy ng αὐτῷ
  choice: Panatilihing hindi tiyak sa pangunahing teksto sa pamamagitan ng “sa kanya”
  alternative: sa lalaki / sa espiritu
  rationale: Maaaring tumukoy ang anyong Griyego sa lalaki o sa espiritu ayon sa balarila at daloy ng tagpo. Hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan, bagaman malinaw na ang espiritu ang pinatutungkulan ng utos.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Ginamit ang “patuloy” upang maipakita ang imperpektong aspekto, at pinanatili ang “maruming espiritu” bilang eksaktong katawagan sa pinagmulan.
