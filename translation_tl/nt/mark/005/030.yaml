  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: tl
  text: At agad na nabatid ni Jesus sa kanyang sarili na lumabas mula sa kanya ang kapangyarihan. Lumingon siya sa gitna ng maraming tao at sinabi, “Sino ang humipo sa mga damit ko?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang mabilis na takbo at agarang pagkakasunod ng pangyayari na karaniwan sa salaysay ni Marcos.
- source_word: ἐπιγνοὺς
  choice: nabatid
  rationale: Ipinahihiwatig ng pandiwa ang malinaw na pagkaalam; ang “nabatid” ay likas at marangal nang hindi ito ginagawang basta pisikal na pakiramdam.
- source_word: ἐν ἑαυτῷ
  choice: sa kanyang sarili
  rationale: Malapit nitong pinananatili ang pahayag na ang pagkaalam ay nasa loob mismo ni Jesus, hindi mula sa panlabas na pagmamasid.
- source_word: δύναμιν
  choice: kapangyarihan
  rationale: Direkta at malawak itong katumbas ng δύναμις, at hindi nito labis na tinutukoy ang kapangyarihan bilang “kapangyarihang magpagaling” kahit iyon ang ipinahihiwatig ng konteksto.
- source_word: ἐξελθοῦσαν
  choice: lumabas mula sa kanya
  rationale: Pinananatili nito ang tuwirang paglalarawan ng teksto na ang kapangyarihan ay lumabas mula kay Jesus bago niya iyon nabatid.
- source_word: ἐπιστραφεὶς
  choice: lumingon
  rationale: Natural itong Filipino para sa pisikal na pagharap o paglingon ni Jesus sa loob ng siksik na pangkat ng mga tao.
- source_word: ἐν τῷ ὄχλῳ
  choice: sa gitna ng maraming tao
  rationale: Malinaw nitong inilalarawan na si Jesus ay nasa loob ng karamihan nang lumingon siya.
- source_word: ἔλεγεν
  choice: sinabi
  rationale: Bagaman nasa aspektong imperfect ang Griyego, ang karaniwang panimula sa tuwirang pananalita sa Filipino ay “sinabi”; walang sapat na dahilan sa konteksto upang ipahiwatig na paulit-ulit niya itong sinabi.
- source_word: ἥψατο
  choice: humipo
  rationale: Ito ang tuwiran at natural na kahulugan ng pandiwa sa konteksto ng paghipo sa damit ni Jesus.
- source_word: τῶν ἱματίων
  choice: mga damit ko
  rationale: Ang “mga damit” ay malinaw, moderno, at pinananatili ang pangmaramihang anyo ng ἱμάτια nang hindi ito nililimitahan sa isang balabal lamang.
theological_decisions:
- issue: Ang paglabas ng kapangyarihan mula kay Jesus
  choice: Tuwirang pinanatili na nabatid ni Jesus na lumabas mula sa kanya ang kapangyarihan.
  alternative: Ipaliwanag ito bilang “kapangyarihang magpagaling” o bilang pansariling pakiramdam lamang ni Jesus.
  rationale: Inilalahad ng Griyegong teksto ang paglabas ng kapangyarihan bilang tunay na pangyayari ngunit hindi ipinapaliwanag ang mekanismo nito. Pinananatili ng salin ang pahayag at ang teolohikal na tensiyon nang walang dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “nabatid” upang ipahayag ang malinaw na panloob na pagkaalam nang hindi maging masyadong kolokyal; ginamit naman ang karaniwang “mga damit” sa halip na mas pormal ngunit hindi gaanong pang-araw-araw na “mga kasuotan.”
