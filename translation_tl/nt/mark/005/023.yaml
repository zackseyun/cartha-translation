base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: tl
  text: At taimtim siyang nakiusap sa kanya, “Nasa bingit na ng kamatayan ang munting anak kong babae. Pumunta ka at ipatong mo sa kanya ang iyong mga kamay upang maligtas[a] siya at mabuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumaling” o “mapagaling.” Ang pandiwang Griyego ay maaaring mangahulugang iligtas, sagipin, o pagalingin; sa kontekstong ito, pisikal na paggaling ang agarang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ ... πολλὰ
  choice: taimtim siyang nakiusap
  rationale: Sa kontekstong ito, ang παρακαλεῖ ay isang apurahan at desperadong pakiusap, at ang πολλὰ ay nagpapalakas dito. Likas sa modernong Tagalog ang “taimtim na nakiusap” nang hindi pinipilit ang di-tiyak na kahulugang “paulit-ulit.”
- source_word: θυγάτριόν
  choice: munting anak kong babae
  rationale: Pinananatili ng “munting” ang himig ng pagmamahal at kabataan na maaaring ipinahihiwatig ng anyong diminutibo.
- source_word: ἐσχάτως ἔχει
  choice: nasa bingit na ng kamatayan
  rationale: Natural at malinaw nitong ipinahahayag ang idyomang tumutukoy sa sukdulan o huling kalagayan, na sa konteksto ay napakalapit na sa kamatayan.
- source_word: ἐλθὼν
  choice: Halika
  rationale: Bagaman participle ang anyong Griyego, gumaganap ito sa pakiusap bilang utos na kaugnay ng kasunod na kilos; “Halika” ang natural na katumbas sa Tagalog.
- source_word: ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: ipatong mo sa kanya ang iyong mga kamay
  rationale: Pinananatili nito ang hayag na maramihang “mga kamay” at ang pisikal na kilos na hinihiling.
- source_word: σωθῇ
  choice: maligtas
  rationale: Maaaring mangahulugan ang σῴζω ng iligtas, sagipin, o pagalingin. Pinananatili ng “maligtas” ang mas malawak na saklaw ng salita, habang nililinaw sa talababa ang agarang diwang pisikal na paggaling.
- source_word: ζήσῃ
  choice: mabuhay
  rationale: Tuwirang katumbas ito ng pandiwa at ipinahahayag ang inaasahang bunga ng pagliligtas o pagpapagaling.
theological_decisions:
- issue: Kahulugan ng σωθῇ sa konteksto ng pagpapagaling
  choice: maligtas
  alternative: gumaling; maging magaling
  rationale: Malinaw na pisikal na karamdaman ang agarang konteksto, ngunit mas malawak ang saklaw ng pandiwang Griyego kaysa sa pagpapagaling lamang. Pinananatili sa pangunahing teksto ang “maligtas” upang hindi alisin ang leksikal at teolohikal na lawak, at ibinibigay sa talababa ang kontekstuwal na alternatibo.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang tuwirang pananalita at karaniwang bokabularyo; iniwasan ang labis na arkaiko o denominasyonal na pananalita.
