  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: tl
  text: Ngunit sinabi niya sa babae, “Anak, iniligtas ka ng iyong pananampalataya.[a] Humayo kang payapa, at maging malusog ka, malaya sa iyong karamdaman.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagaling ka” o “pinabuti ang iyong kalagayan.” Ang pandiwang Griyego ay maaaring tumukoy sa pagliligtas, pagsagip, o pagpapagaling.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “at gumaling ka mula sa iyong karamdaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Anak
  rationale: Ito ang natural at magiliw na pantawag ng isang nakatatanda sa modernong Filipino. Hindi idinagdag ang panghalip na “ko,” na wala sa Griyego.
- source_word: πίστις
  choice: pananampalataya
  rationale: Tumutukoy ito sa pagtitiwala ng babae kay Jesus at pinananatili rin ang mahalagang terminong teolohikal na karaniwang katumbas ng πίστις.
- source_word: σέσωκέν σε
  choice: iniligtas ka
  rationale: Pinananatili ang malawak na diwa ng σῴζω—pagliligtas na maaaring sumaklaw sa kagalingan—sa halip na paliitin agad sa pisikal na pagpapagaling. Ang resulta ng Griyegong perfect ay likas na naipahihiwatig sa Filipino.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Humayo kang payapa
  rationale: Likas at marangal na pahayag sa Filipino para sa pag-alis na nasa kalagayan ng kapayapaan.
- source_word: ἴσθι ὑγιὴς
  choice: maging malusog ka na
  rationale: Ipinapahayag ang statibong utos na manatili o mamuhay sa kalagayang maayos at malusog, nang hindi inuulit ang “iniligtas.” Ang “na” ay angkop sa kontekstong gumaling na ang babae.
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: malaya sa iyong karamdaman
  rationale: Ang μάστιξ ay metaporikal na matinding paghihirap o salot; sa konteksto, malinaw itong tumutukoy sa kanyang karamdaman. Ang “malaya sa” ay natural na naghahatid ng ἀπό at ng lubos na pagkalayo rito.
theological_decisions:
- issue: Saklaw ng σῴζω sa konteksto ng pagpapagaling
  choice: iniligtas ka
  alternative: pinagaling ka
  rationale: Hindi nilulutas nang tahimik ang tensiyon sa pagitan ng pagliligtas at pisikal na kagalingan. Hiwalay na binabanggit sa kasunod na sugnay ang pagiging malusog at malaya sa karamdaman.
- issue: Kahulugan ng πίστις
  choice: pananampalataya
  alternative: pagtitiwala
  rationale: Ang “pananampalataya” ay natural sa konteksto at nagpapanatili sa pangunahing terminong teolohikal, habang ang tinutukoy rito ay ang mapagtiwalang paglapit ng babae kay Jesus.
- issue: Lakas ng ἴσθι ὑγιὴς
  choice: maging malusog ka na
  alternative: gumaling ka
  rationale: Mas tuwirang pinananatili ng napili ang statibong diwa ng “maging nasa mabuting kalagayan,” samantalang ang “gumaling ka” ay maaaring magtunog na nagsisimula pa lamang ang paggaling.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Anak” sa halip na mas kolokyal na “Iha,” at ang “Humayo kang payapa” upang mapanatili ang banayad at solemne ngunit natural na himig.
