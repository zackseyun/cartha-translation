  to: Ngunit hindi siya pinayagan ni Jesus. Sa halip, sinabi niya sa kanya, “Umuwi ka sa iyong tahanan, sa mga taong malapit sa iyo,[a] at sabihin mo sa kanila ang lahat ng ginawa ng Panginoon[b] para sa iyo at naawa siya sa iyo.”
