  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: tl
  text: Ngunit hindi siya pinayagan ni Jesus. Sa halip, sinabi niya sa kanya, “Umuwi ka sa iyong tahanan, sa mga taong malapit sa iyo,[a] at sabihin mo sa kanila ang lahat ng ginawa ng Panginoon[b] para sa iyo at naawa siya sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Griyego, “sa iyong mga sarili.” Maaaring tumukoy ito nang malawakan sa kanyang sariling mga tao, kabilang ang pamilya at malalapit na kasama.
    reason: lexical_alternative
  - marker: b
    text: Maaaring unawain dito ang “Panginoon” bilang Diyos. Maaari ring sadyang pinananatili ni Marcos ang ugnayan ng awa ng Diyos sa sariling awtoridad at ginawa ni Jesus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: hindi siya pinayagan ni Jesus
  rationale: Sa kontekstong ito, ang ἀφίημι ay nangangahulugang ‘payagan.’ Tahasang binanggit ang ‘Jesus’ upang maging malinaw ang tinutukoy ng panghalip sa natural na salaysay sa Filipino.
- source_word: λέγει αὐτῷ
  choice: sinabi niya sa kanya
  rationale: Bagaman historical present ang λέγει, likas sa salaysay na Filipino ang pangnagdaang ‘sinabi.’
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Umuwi ka sa inyo
  rationale: Ipinahihiwatig ng utos ang pagbabalik sa sariling tahanan o sambahayan. Ang ‘umuwi ka sa inyo’ ay natural at malinaw sa modernong Filipino.
- source_word: πρὸς τοὺς σούς
  choice: sa sarili mong mga tao
  rationale: Literal itong tumutukoy sa ‘mga sarili mo.’ Pinananatili ng salin ang lawak ng parirala sa halip na limitahan ito sa pamilya o kamag-anak lamang.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: sabihin mo sa kanila
  rationale: Ang ἀπαγγέλλω ay magbalita o magsalaysay ng nangyari. Ang ‘sabihin’ ay natural, tuwiran, at angkop sa karaniwang Filipino.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: ang lahat ng ginawa ng Panginoon para sa iyo
  rationale: Ang ὅσα ay tumutukoy sa kabuuan o lawak ng ginawa. Ang datibong σοι ay natural na isinaling ‘para sa iyo.’
- source_word: ἠλέησέν σε
  choice: kung paano ka niya kinaawaan
  rationale: Pinananatili nito ang pandiwang diwa ng ἐλεάω at ang mahalagang konsepto ng habag o awa.
theological_decisions:
- issue: Ang kahulugan ng κύριος sa pahayag ni Jesus tungkol sa gumawa at naawa
  choice: Panginoon
  alternative: Diyos
  rationale: Hindi tahasang nilulutas ng Griyego kung ang κύριος dito ay dapat tukuyin lamang bilang Diyos o kung sadyang iniuugnay ni Marcos ang awa ng Diyos sa awtoridad at ginawa ni Jesus. Pinananatili ng ‘Panginoon’ ang teolohikal na tensiyong ito.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang karaniwang ‘sa inyo’ para sa pagbabalik sa sariling tahanan, kasunod ang mas malawak na ‘sarili mong mga tao’ upang mapanatili ang dalawang pariralang Griyego. Iniwasang paliitin ang tinutukoy sa pamilya lamang.
