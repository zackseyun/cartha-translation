  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: hindi pinayagan ni Jesus ang lalaki, inutusan siyang umuwi at magbalita, at pinanatili ang «Panginoon» para sa κύριος. Gayunman, ang «kung paano ka niya kinaawaan» ay maaaring magpahiwatig ng paraan ng pagkahabag, samantalang ang Griyego ay tuwirang nag-uugnay ng ginawa ng Panginoon at ng pagkahabag niya. Ang binagong salin ay ginagawang tuwiran ang ikalawang pandiwa.'
  naturalness: Natural ang pangkalahatang rehistro, ngunit ang magkasunod na «sa inyo, sa sarili mong mga tao» ay medyo paulit-ulit at ang «sarili mong mga tao» ay hindi lubos na likas sa modernong Filipino. Ang «sa iyong tahanan, sa mga taong malapit sa iyo» ay mas natural habang hindi nililimitahan ang saklaw sa pamilya lamang.
  terminology: Ang «Panginoon» ay angkop at dapat panatilihin upang huwag lutasin sa pangunahing teksto ang ugnayan ng Diyos at ni Jesus. Ang «kinaawaan» ay wastong salin ng ἠλέησεν at pinananatili ang mahalagang wika ng awa.
