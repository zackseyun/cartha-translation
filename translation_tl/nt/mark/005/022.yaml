  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: tl
  text: Dumating ang isa sa mga pinuno ng sinagoga, na ang pangalan ay Jairo. Nang makita niya si Jesus, bumagsak siya sa paanan ni Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: Dumating
  rationale: Ang pangkasalukuyang anyo sa Griyego ay historical present na nagbibigay-sigla sa salaysay. Ginamit ang pangnagdaan upang maging natural at tuloy-tuloy ang pagsasalaysay sa modernong Tagalog.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: ang isa sa mga pinuno ng sinagoga
  rationale: Pinananatili ng “isa sa mga” ang partitive construction, at malinaw na ipinahahayag ng “mga pinuno ng sinagoga” ang tungkuling administratibo ng ἀρχισυνάγωγος.
- source_word: ὀνόματι Ἰάϊρος
  choice: na ang pangalan ay Jairo
  rationale: Natural at malinaw na katumbas ito ng idyomatikong pahayag sa Griyego na nagpapakilala sa pangalan ng tao.
- source_word: Ἰάϊρος
  choice: Jairo
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa tradisyong biblikal na Tagalog, habang malinaw pa ring kinakatawan ang pangalang Griyego.
- source_word: ἰδὼν αὐτὸν
  choice: Nang makita niya si Jesus
  rationale: Isinalin ang aorist participle bilang sugnay na temporal. Tinukoy si Jesus sa halip na gumamit ng malabong “siya,” sapagkat natural ito sa Tagalog at malinaw ang tinutukoy ng αὐτόν mula sa konteksto.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: nagpatirapa siya sa paanan nito
  rationale: Ipinahahayag ng “nagpatirapa” ang aktuwal na pagbagsak o pagyukod nang buong pagpapakumbaba, at ng “sa paanan nito” ang lokasyong inilalarawan ng Griyego, nang hindi tahasang binibigyang-kahulugan ang kilos bilang pagsamba.
theological_decisions:
- issue: Kahulugan ng pagpatirapa sa harap ni Jesus
  choice: nagpatirapa siya sa paanan nito
  alternative: sumamba siya sa kanya
  rationale: Inilalarawan ng Griyego ang pisikal na kilos ng pagbagsak sa paanan ni Jesus, na maaaring magpahiwatig ng paggalang, matinding pagsusumamo, o pagsamba. Hindi ginamit sa talata ang tahasang pandiwa para sa pagsamba, kaya pinanatili ang kilos nang hindi nilulutas ang teolohikal na pahiwatig nito.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang mabigat na pagkakasunod-sunod ng mga sugnay. Gumamit ng “sinagoga” bilang kinikilalang terminong biblikal at “Jairo” bilang pamilyar na anyo ng pangalan sa Tagalog.
