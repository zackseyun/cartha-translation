  source_fidelity: Tapat ang salin sa Griyego. Naipapahayag ng “Gabi’t araw, walang tigil” ang patuloy na saklaw ng διὰ παντὸς νυκτὸς καὶ ἡμέρας; wasto ang mga lugar na “mga libingan” at “mga bundok”; at ang magkaugnay na “sumisigaw” at “sinusugatan ang sarili gamit ang mga bato” ay naghahatid ng duratibong kilos at instrumental na λίθοις.
