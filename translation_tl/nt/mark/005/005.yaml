  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: tl
  text: Gabi’t araw, walang tigil siyang sumisigaw sa mga libingan at sa mga bundok at sinusugatan[a] ang sarili gamit ang mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, nilalaslas.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Gabi’t araw, walang tigil
  rationale: Ipinahahayag ng parirala ang patuloy na kilos sa buong magdamag at maghapon. Likas at malinaw sa modernong Tagalog ang “gabi’t araw, walang tigil.”
- source_word: μνήμασιν
  choice: mga libingan
  rationale: Tumutukoy ang μνῆμα sa lugar na pinaglilibingan o puntod; ang “mga libingan” ay natural at sapat na malawak upang saklawin ang mga libingang inuka sa bato.
- source_word: ὄρεσιν
  choice: mga bundok
  rationale: Direktang katumbas ng ὄρος ang “bundok,” at hindi kailangang paliitin ang kahulugan tungo sa “burol.”
- source_word: ἦν κράζων
  choice: siyang sumisigaw
  rationale: Ang periphrastic imperfect ay nagpapakita ng nagpapatuloy na kilos sa nakaraan. Naipahihiwatig ito sa Tagalog ng “walang tigil siyang sumisigaw.”
- source_word: κατακόπτων ἑαυτὸν
  choice: sinusugatan ang sarili
  rationale: Ang pandiwa ay nagsasaad ng matindi o paulit-ulit na paghiwa o pananakit. Malinaw ngunit hindi labis na mapaglarawan ang “sinusugatan ang sarili”; inilalagay sa talababa ang mas matinding posibleng salin.
- source_word: λίθοις
  choice: gamit ang mga bato
  rationale: Instrumental ang datibo; natural na ipinakikita ng “gamit ang mga bato” na ang mga bato ang kasangkapang ginamit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Pinanatili ang pag-uulit ng mga pang-ukol sa “sa mga libingan at sa mga bundok” upang malinaw ang dalawang lugar, at ginamit ang karaniwang pariralang “gabi’t araw, walang tigil” upang ihatid ang duratibong diin ng Griyego.
