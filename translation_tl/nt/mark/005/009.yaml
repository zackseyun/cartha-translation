  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: tl
  text: At patuloy niya itong tinatanong, “Ano ang pangalan mo?” At sabi nito sa kanya, “Legion[a] ang pangalan ko, sapagkat marami kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Legion” ay terminong Latin na inangkop sa Griyego at tumutukoy sa isang malaking yunit ng hukbong Romano. Dito, ginagamit ito bilang ipinahayag na pangalan ng demonyo at nagpapahiwatig na napakarami nila.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: patuloy niya itong tinatanong
  rationale: Ipinahahayag ng aspektong imperpektibo ang nagpapatuloy o inuulit na pagtatanong; natural itong naipapakita sa Tagalog sa pamamagitan ng “patuloy ... tinatanong.”
- source_word: Τί ὄνομά σοι
  choice: Ano ang pangalan mo?
  rationale: Ito ang tuwiran at likas na katumbas sa modernong Tagalog ng idyomatikong pariralang Griyego.
- source_word: λέγει αὐτῷ
  choice: Sinabi nito sa kanya
  rationale: Ang λέγει ay historikal na pangkasalukuyan. Bagaman maaaring gawing “sinasabi,” mas natural at malinaw sa salaysay na Tagalog ang “sinabi,” nang hindi binabago ang pangyayari.
- source_word: Λεγιὼν
  choice: Legion
  rationale: Ginagamit ito bilang ipinahayag na pangalan o katawagan, kaya pinanatili ang anyong hiram at nilagyan ng malaking titik sa halip na isalin bilang karaniwang pangngalan.
- source_word: ὄνομά μοι
  choice: ang pangalan ko
  rationale: Natural na katumbas sa Tagalog ng pormulang Griyego para sa pagpapakilala sa sarili.
- source_word: ὅτι πολλοί ἐσμεν
  choice: sapagkat marami kami
  rationale: Nagbibigay ang ὅτι ng dahilan sa pangalang “Legion.” Pinananatili ng “kami” ang mahalagang paglipat mula sa isahang “ko” tungo sa maramihang pagtukoy sa nagsasalita.
theological_decisions:
- issue: Paglipat mula sa isahan tungo sa maramihan sa pagtukoy ng nagsasalita sa sarili
  choice: Panatilihin ang “pangalan ko” at “marami kami.”
  alternative: Gawing “pangalan namin” upang mawala ang paglipat sa bilang.
  rationale: Sadyang pinananatili ng Griyego ang tensiyon sa pagitan ng isahang pagpapakilala at maramihang paliwanag. Hindi ito dapat pakinisin o ipaliwanag sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nito” para sa nagsasalitang espiritu at upang hindi malito sa lalaking sinasapian; pinanatili ang “Legion” bilang pangalan at ang isahan-maraming paglipat ng orihinal.
