  terminology: Ang “nakiusap” ay angkop para sa παρεκάλεσαν sa kontekstong ito. Ang “mga baboy” ay karaniwan at modernong katumbas ng χοίρους. Ang “upang” ay angkop na panandang layunin para sa ἵνα.
