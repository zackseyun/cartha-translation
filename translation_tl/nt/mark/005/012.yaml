  source_fidelity: 'Tumpak ang pangunahing diwa: marubdob silang nakiusap kay Jesus na makapasok sa mga baboy. Gayunman, ang “Papuntahin mo” ay mas malapit sa “cause us to go” kaysa sa tahasang diwa ng Πέμψον, “send.” Ang “Ipadala mo” ay mas tuwirang katumbas at natural pa rin sa Tagalog.'
