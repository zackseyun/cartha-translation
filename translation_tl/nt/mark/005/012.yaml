base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: tl
  text: At nakiusap sila sa kanya, “Ipadala mo kami sa mga baboy upang makapasok kami sa kanila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: nakiusap
  rationale: Sa kontekstong ito, ipinahihiwatig ng παρακαλέω ang marubdob na pakiusap. Natural sa modernong Tagalog ang “nakiusap” at hindi nito dinaragdagan ang sinabi ng teksto.
- source_word: αὐτὸν
  choice: sa kanya
  rationale: Tumutukoy kay Jesus bilang pinatutungkulan ng pakiusap.
- source_word: λέγοντες
  choice: “...”
  rationale: Likas sa Tagalog na ipakilala nang tuwiran ang nilalaman ng pakiusap matapos ang “nakiusap sila sa kanya,” sa halip na idagdag ang paulit-ulit na “na sinasabi.”
- source_word: Πέμψον
  choice: Papuntahin mo
  rationale: Ang πέμπω ay “magpadala.” Sa Tagalog, ang “papuntahin” ay natural na utos sa kontekstong nagpapahintulot at nagpapadala sa kanila patungo sa mga baboy, nang hindi ginagawang tahasang “pahintulutan” lamang ang pandiwa.
- source_word: ἡμᾶς
  choice: kami
  rationale: Ang eksklusibong “kami” ang angkop dahil hindi kabilang si Jesus sa pangkat ng mga nagsasalita.
- source_word: εἰς τοὺς χοίρους
  choice: sa mga baboy
  rationale: Ang χοῖρος ay karaniwang “baboy.” Sa Tagalog, ang “papuntahin ... sa mga baboy” ay natural; ang ideya ng pagpasok sa loob nila ay tahasang nasa kasunod na sugnay.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw at marangal na ipinapahayag ng “upang” ang layunin ng kahilingan.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: makapasok kami sa mga iyon
  rationale: Pinananatili ng “makapasok” ang literal na diwa ng εἰσέρχομαι at ng pagpasok ng mga espiritu sa mga hayop. Ginamit ang “mga iyon” upang malinaw na tumukoy sa mga baboy.
theological_decisions:
- issue: Ang katangian ng kahilingan ng mga nagsasalita kay Jesus
  choice: Inilalarawan silang marubdob na nakikiusap kay Jesus na papuntahin sila sa mga baboy upang makapasok sila sa mga iyon.
  alternative: Isalin bilang karaniwang paghiling lamang o tahasang gawing “pahintulutan mo kami.”
  rationale: Ipinakikita ng “nakiusap” at ng pautos na “Papuntahin mo kami” ang kanilang pagkilala sa kapangyarihan ni Jesus, habang pinananatili ang mismong pandiwang “magpadala” at hindi nagdaragdag ng doktrinang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang lipas na “mga baboy-damo” o teknikal na pananalita. Walang talababa dahil walang mahalagang leksikal o tekstuwal na alternatibong kailangang itala sa Tagalog.
