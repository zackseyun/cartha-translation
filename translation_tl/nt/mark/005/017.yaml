  text: And they began to beg him to leave their region[a].
translation:
  language: tl
  text: At nagsimula silang makiusap sa kanya na umalis sa kanilang nasasakupan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na lumisan mula sa kanilang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay ng salaysay nang hindi nagdaragdag ng tahasang diwang temporal.
- source_word: ἤρξαντο παρακαλεῖν
  choice: nagsimula silang makiusap
  rationale: Ipinapahayag ng “nagsimula” ang ingressive na diwa ng ἤρξαντο, at likas na ipinahihiwatig ng “makiusap” ang taimtim at paulit-ulit na pakiusap sa kontekstong ito.
- source_word: αὐτὸν
  choice: sa kanya
  rationale: Tumutukoy ang panghalip kay Jesus; kailangan ng “sa” sa likas na kayarian ng pandiwang “makiusap” sa Filipino.
- source_word: ἀπελθεῖν
  choice: na umalis
  rationale: Malinaw at natural na inilalahad ang nilalaman ng kanilang pakiusap; hindi kailangan ang mas pormal na “lumisan.”
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: sa kanilang lupain
  rationale: Bagaman literal na tumutukoy ang ὅρια sa mga hangganan, ang parirala ay nangangahulugang teritoryo o lupaing sakop nila. Ang “kanilang lupain” ay natural at nauunawaan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makiusap” sa halip na mas matinding “magmakaawa” upang mapanatili ang lawak ng kahulugan ng παρακαλεῖν, habang ang konteksto ang nagpapahiwatig ng tindi ng kanilang pakiusap.
