  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: tl
  text: At hindi niya pinahintulutang sumama sa kanya ang sinuman maliban kina Pedro, Santiago, at Juan na kapatid ni Santiago.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: pinahintulutan
  rationale: Sa pagkakaugnay nito sa pawatas na συνακολουθῆσαι, nangangahulugan itong magpahintulot. Likas at malinaw sa modernong Tagalog ang “pinahintulutan.”
- source_word: οὐδένα
  choice: ang sinuman
  rationale: Kasama ng pagtanggi na “hindi,” malinaw nitong ipinapahayag na walang ibang pinayagang sumama.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: sumama sa kanya
  rationale: Likas na ipinahahayag sa Tagalog ang diwa ng pagsunod o paglakad na kasama niya nang hindi nagiging mabigat o paulit-ulit.
- source_word: εἰ μὴ
  choice: maliban kina
  rationale: Nagpapakilala ito rito ng eksepsiyon, at ang “kina” ay angkop sa talaan ng mga pangalang pantangi.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pedro, Santiago, at Juan
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog; natural ang kuwit at huling “at” sa modernong Filipino.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: na kapatid ni Santiago
  rationale: Pinananatili nitong malinaw na si Juan ang tinutukoy na kapatid ni Santiago.
