  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: tl
  text: At dumating sila sa kabilang panig ng dagat, sa lupain ng mga Geraseno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito ay “mga Gadareno”; sa iba naman ay “mga Gergeseno.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak at sunod-sunod na daloy ng salaysay ni Marcos.
- source_word: ἦλθον
  choice: dumating sila
  rationale: Natural na salin ng aorist plural; tumutukoy kay Jesus at sa mga kasama niya ayon sa naunang konteksto.
- source_word: εἰς τὸ πέραν
  choice: sa kabilang ibayo
  rationale: Malinaw at likas na Filipino para sa pagpunta sa kabilang panig ng anyong-tubig.
- source_word: τῆς θαλάσσης
  choice: ng lawa
  rationale: Bagaman literal na 'dagat' ang θάλασσα, ang tinutukoy ay ang Lawa ng Galilea; ang 'lawa' ay mas malinaw sa karaniwang modernong Filipino nang hindi binabago ang heograpikong reperente.
- source_word: εἰς τὴν χώραν
  choice: sa lupain
  rationale: Ipinapahayag ang isang nasasakupang pook o rehiyon, hindi isang modernong bansang-estado.
- source_word: Γερασηνῶν
  choice: ng mga Geraseno
  rationale: Isinasalin ang pangmaramihang gentiliko bilang tawag sa mga mamamayan o taong kaugnay ng Gerasa, ayon sa pagbasa ng SBLGNT.
theological_decisions:
- issue: Pagkakaiba-iba ng pangalan ng lugar sa mga manuskrito
  choice: mga Geraseno
  alternative: mga Gadareno; mga Gergeseno
  rationale: Sinusunod ng pangunahing teksto ang Γερασηνῶν sa SBLGNT, habang inilalahad sa talababa ang mahahalagang alternatibong pagbasa upang hindi maitago ang usaping tekstuwal at heograpiko.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang 'kabilang ibayo' upang maging natural ang direksiyon ng pagtawid, at 'lawa' para malinaw ang aktuwal na anyong-tubig. Ang panandang [a] ay inilagay pagkatapos ng pinagtatalunang pangalan sapagkat doon mismo nauukol ang tekstuwal na variant.
