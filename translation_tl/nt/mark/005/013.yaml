  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: tl
  text: At pinahintulutan niya sila. Lumabas ang maruruming espiritu at pumasok sa mga baboy. Ang kawan—humigit-kumulang dalawang libong baboy—ay tumulusok pababa sa matarik na dalisdis[a] at papasok sa dagat[b], at nalunod sa dagat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pababa sa bangin” o “pababa sa matarik na gilid”; maaaring tumukoy ang salitang Griyego sa matarik na dalisdis o bangin.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “dagat.” Ang tinutukoy ay ang Dagat ng Galilea.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: pinahintulutan niya sila
  rationale: Tuwirang ipinapahayag ang pagbibigay ng pahintulot at pinananatili ang panghalip na tumutukoy sa maruruming espiritu ayon sa konteksto.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: maruruming espiritu
  rationale: Karaniwan at malinaw na salin sa Filipino na pinananatili ang personal at espirituwal na paglalarawan ng Griyego.
- source_word: ἐξελθόντα ... εἰσῆλθον
  choice: Lumabas ... at pumasok
  rationale: Likas na pagsasalaysay sa Filipino ng magkasunod na pagkilos ng mga espiritu.
- source_word: τοὺς χοίρους
  choice: mga baboy
  rationale: Pinakamalinaw at pangkaraniwang modernong katumbas ng χοῖροι.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: Ang kawan ... ay rumagasa
  rationale: Ipinahihiwatig ng 'rumagasa' ang biglaan at marahas na sama-samang pagtakbo nang hindi dinaragdagan ang detalye.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: pababa sa matarik na dalisdis
  rationale: Sinasaklaw nito ang kahulugan ng κρημνός bilang matarik na dalisdis o bangin nang hindi ipinapalagay na patayong talampas iyon.
- source_word: εἰς τὴν θάλασσαν
  choice: patungo sa dagat
  rationale: Pinananatili ang literal na katawagang θάλασσα, 'dagat,' sa halip na palitan ito ng 'lawa.'
- source_word: ὡς δισχίλιοι
  choice: humigit-kumulang dalawang libong baboy
  rationale: Pinananatili ang pagtatantiya ng ὡς at nililinaw sa natural na Filipino na bilang ito ng mga baboy.
- source_word: ἐπνίγοντο ἐν τῇ θαλάσσῃ
  choice: at nalunod doon
  rationale: Natural na Filipino para sa pagkamatay nila sa tubig; ang 'doon' ay umiiwas sa mabigat na pag-uulit ng 'sa dagat' habang malinaw ang tinutukoy.
theological_decisions:
- issue: Tinutukoy ng “sila” sa “pinahintulutan niya sila”
  choice: Ang maruruming espiritu ang tinutukoy
  alternative: Hayagang idagdag sa unang sugnay ang “mga espiritu”
  rationale: Malinaw ito sa agarang konteksto, ngunit pinananatili ng panghalip ang anyo at daloy ng Griyego nang walang paliwanag na idinaragdag sa teksto.
- issue: Paglalarawan sa τὰ πνεύματα τὰ ἀκάθαρτα
  choice: Panatilihin bilang “maruruming espiritu”
  alternative: Masamang mga puwersa
  rationale: Inilalarawan sila ng teksto bilang mga espiritung kumikilos at hindi lamang bilang impersonal na mga puwersa; hindi na dinaragdagan ang demonolohiya ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pasalaysay na teksto. Ginamit ang “kawan” bilang likas na kolektibong katawagan at nilinaw na mga baboy ang tinatayang dalawang libo. Inilagay ang mga talababa sa mismong mga pariralang kanilang ipinaliliwanag.
