  to: At pinahintulutan niya sila. Lumabas ang maruruming espiritu at pumasok sa mga baboy. Ang kawan—humigit-kumulang dalawang libong baboy—ay tumulusok pababa sa matarik na dalisdis[a] at papasok sa dagat[b], at nalunod sa dagat.
