  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: tl
  text: Sapagkat madalas na siyang iginagapos ng mga tanikala sa paa at mga kadena, ngunit pinagpipigtal niya ang mga kadena at dinudurog ang mga tanikala sa paa, at walang sinumang may sapat na lakas upang supilin[a] siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “paamuhin.” Ang pandiwang Griyego ay maaaring mangahulugang “paamuhin” o, sa mas malawak na diwa, “supilin” o “kontrolin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: Sapagkat ... siyang
  rationale: Ang διά na sinusundan ng articular infinitive ay nagpapahayag ng dahilan. Pinananatili ng “Sapagkat” ang kaugnayang sanhi sa naunang pahayag.
- source_word: πολλάκις
  choice: madalas
  rationale: Likas at maikling katumbas para sa paulit-ulit na pangyayari.
- source_word: πέδαις / τὰς πέδας
  choice: mga tanikala sa paa
  rationale: Tumutukoy ang πέδη sa panggapos na partikular na inilalagay sa paa. Mas malinaw ito sa karaniwang mambabasa kaysa sa mas lumang salitang “pangaw,” at naihihiwalay sa pangkalahatang mga kadena.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: mga kadena
  rationale: Tuwirang katumbas ng ἅλυσις at pinananatili ang pagkakaiba nito sa mga tanikala sa paa.
- source_word: δεδέσθαι
  choice: iginagapos
  rationale: Ipinahihiwatig ng konteksto at ng πολλάκις ang paulit-ulit na paggapos. Natural sa Filipino ang aspektong di-ganap upang ilarawan ang nakagawiang paulit-ulit na kilos.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: nilalagot niya
  rationale: Ipinahahayag ang marahas na pagpunit o pagkalas ng mga kadena at ginagawang natural na aktibong pangungusap ang tahasang ahensiya ng ὑπ’ αὐτοῦ.
- source_word: συντετρῖφθαι
  choice: winawasak
  rationale: Naghahatid ng matinding pagkabasag o pagkadurog nang hindi lumilikha ng di-natural na larawan para sa metal na panggapos.
- source_word: οὐδεὶς ἴσχυεν
  choice: walang sinumang may sapat na lakas
  rationale: Pinananatili ang diin ng ἰσχύω sa lakas, hindi lamang sa pangkalahatang kakayahan.
- source_word: δαμάσαι
  choice: supilin
  rationale: Saklaw nito ang pagpapasailalim o pagkontrol sa isang marahas na tao, habang iniiwasan ang karaniwang kaugnayan ng “paamuhin” sa mga hayop.
theological_decisions:
- issue: Pinagmulan ng pambihirang lakas ng lalaki
  choice: Inilarawan lamang ang paulit-ulit na pagkabigo ng mga tao na siya ay maigapos at masupil.
  alternative: Tahasan itong ilarawan bilang kapangyarihang mula sa mga demonyo.
  rationale: Hindi tinutukoy ng talatang ito mismo ang pinagmulan ng lakas, bagaman ibinibigay iyon ng mas malawak na salaysay. Hindi nagdaragdag ang salin ng paliwanag na teolohikal sa mismong pangungusap.
- issue: Saklaw ng δαμάσαι
  choice: supilin
  alternative: paamuhin
  rationale: Pinananatili ng pangunahing salin ang diwa ng pagpapasailalim o pagkontrol sa tao. Inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang lawak at bahagyang tensiyong leksikal ng pandiwang Griyego.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “mga tanikala sa paa” sa halip na “mga pangaw” para sa agarang linaw, at pinanatili ang dalawang magkaibang uri ng panggapos sa Griyego. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging natural at malinaw sa Filipino, habang pinananatili ng “Sapagkat” ang ugnayang sanhi sa naunang talata.
