  terminology: Ang “mga tanikala sa paa” para sa πέδαι at “mga kadena” para sa ἁλύσεις ay angkop at pinananatili ang mahalagang pagkakaiba. Ang “supilin” ay mabuting pangunahing katumbas ng δαμάσαι; ang “paamuhin” ay wastong alternatibong leksikal sa talababa.
