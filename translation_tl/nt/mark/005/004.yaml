  to: Sapagkat madalas na siyang iginagapos ng mga tanikala sa paa at mga kadena, ngunit pinagpipigtal niya ang mga kadena at dinudurog ang mga tanikala sa paa, at walang sinumang may sapat na lakas upang supilin[a] siya.
  rationale: Pinalitan ang “Ngunit” ng mas malapit na pagkakaugnay na “at” upang hindi magdagdag ng tahasang pagsalungat na wala sa pinagmulan. Ginawang “pinagpipigtal” ang kilos sa mga kadena upang higit na maipakita ang marahas na pagkapunit o pagkapigtal (διεσπάσθαι), habang pinananatili ang “dinudurog” para sa matinding pagkabasag ng mga tanikala sa paa (συντετρῖφθαι).
