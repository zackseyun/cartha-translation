  text: And he kept looking around to see the one who had done this[a].
translation:
  language: tl
  text: At patuloy siyang tumingin-tingin sa paligid upang makita ang babaeng gumawa nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Karaniwang pang-ugnay ito na nagpapatuloy sa salaysay nang hindi nagdaragdag ng diwa ng bunga o paghinuha.
- source_word: περιεβλέπετο
  choice: patuloy siyang tumingin sa paligid
  rationale: Ipinahihiwatig ng imperfect ang nagpapatuloy na pagkilos; natural na ipinapahayag ng pariralang ito ang patuloy na pagmamasid sa mga nasa paligid.
- source_word: ἰδεῖν
  choice: upang makita
  rationale: Ang aorist infinitive ay nagpapahayag dito ng layunin ng pagtingin; tuwiran at likas sa Tagalog ang “upang makita.”
- source_word: τὴν ... ποιήσασαν
  choice: ang babaeng gumawa
  rationale: Ang artikulo at participle ay pambabae at tumutukoy sa isang babaeng tao. Dahil walang kasariang gramatikal ang katumbas na anyo sa Tagalog, tahasang “babae” ang ginamit upang mapanatili ang impormasyong nasa Griyego.
- source_word: τοῦτο
  choice: nito
  rationale: Tumutukoy ang demonstrative sa ginawa niyang binanggit sa naunang konteksto; maikli at natural ang “nito.”
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang nagpapatuloy na aspekto ng pandiwa at ginawang tahasan ang babaeng tinutukoy, yamang malinaw ito sa pambabaeng anyo ng Griyego.
