  to: At nang muling tumawid si Jesus sakay ng bangka patungo sa kabilang panig, nagtipon sa palibot niya ang napakaraming tao, at naroon siya sa tabi ng dagat.[a]
  rationale: Pinalitan ang “lawa” sa pangunahing teksto ng “dagat” upang sundin ang terminong Griyego at ang lexical policy ng audit trail. Inayos ang “kabilang ibayo” bilang “kabilang panig” para sa mas likas na modernong Filipino, nang hindi binabago ang kahulugan. Nananatili sa talababa ang kinakailangang heograpikal na paglilinaw.
