  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: tl
  text: At nang muling tumawid si Jesus sakay ng bangka patungo sa kabilang panig, nagtipon sa palibot niya ang napakaraming tao, at naroon siya sa tabi ng dagat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iyon ay, ang Dagat ng Galilea, isang lawa na karaniwang tinatawag na “dagat” sa mga Ebanghelyo.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: nang ... tumawid
  rationale: Ang aorist participle sa genitive absolute ay nagsasaad ng pangyayaring nauuna sa pagtipon ng mga tao. Likas sa Tagalog ang “nang ... tumawid,” at malinaw pa rin ang pagkakasunod ng mga pangyayari.
- source_word: ἐν τῷ πλοίῳ
  choice: sakay ng bangka
  rationale: Likas at malinaw na katumbas ito ng paglalakbay sa loob o sa pamamagitan ng bangka; ang “bangka” ay angkop sa tagpo sa lawa.
- source_word: πάλιν
  choice: muling
  rationale: Pinananatili nito ang diwa ng pag-uulit sa maikli at natural na paraan.
- source_word: εἰς τὸ πέραν
  choice: patungo sa kabilang ibayo
  rationale: Tumutukoy ito sa kabilang pampang. Ang “kabilang ibayo” ay dignified ngunit mauunawaan, at iniiwasan ang paulit-ulit na “tumawid ... sa kabilang panig.”
- source_word: συνήχθη
  choice: nagtipon
  rationale: Bagaman pasibo ang anyong Griyego, natural sa Tagalog ang pandiwang di-transitibong “nagtipon” para sa kusang pagtitipon ng mga tao.
- source_word: ὄχλος πολὺς
  choice: napakaraming tao
  rationale: Natural itong Tagalog para sa isang malaking pulutong at malinaw na ipinapahayag ang dami.
- source_word: ἐπ’ αὐτόν
  choice: sa palibot niya
  rationale: Sa konteksto ng συνάγω, ipinahihiwatig nito ang paglapit at pagkakatipon ng mga tao sa paligid ni Jesus.
- source_word: παρὰ τὴν θάλασσαν
  choice: sa tabi ng lawa
  rationale: Ipinapahayag ng παρά ang lokasyon sa tabi ng pampang; natural at malinaw sa Tagalog ang “sa tabi ng lawa.”
- source_word: θάλασσαν
  choice: lawa
  rationale: Bagaman literal na “dagat” ang θάλασσα, ang tinutukoy na anyong-tubig ay ang Lawa ng Galilea. Sa modernong Tagalog, “lawa” ang heograpikong malinaw at natural na tawag; ipinapaliwanag sa talababa na karaniwan itong tawaging “dagat” sa mga Ebanghelyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “napakaraming tao” sa halip na mas makalumang “malaking pulutong,” at “naroon siya” upang malinaw na ipahayag ang ἦν nang hindi nagiging mabigat ang pangungusap.
