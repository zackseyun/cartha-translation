id: MRK.5.35
reference: Mark 5:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: tl
  text: Habang nagsasalita pa siya, may mga dumating mula sa bahay ng pinuno ng sinagoga[a] at nagsabi, “Namatay na ang anak mong babae. Bakit mo pa aabalahin[b] ang Guro?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “mula sa pinuno ng sinagoga”; sa konteksto, mula sa kanyang bahay o sambahayan.'
    reason: contextual_clarification
  - marker: b
    text: Maaari ring “iistorbohin” o “gambalain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Habang nagsasalita pa siya
  rationale: Ang genitive absolute ay nagpapahiwatig ng kasabay na kilos, at malinaw na naipapakita ng “habang ... pa” ang puwersa ng ἔτι nang hindi pinapalitan ang panghalip ng pangalang Jesus.
- source_word: ἔρχονται
  choice: may mga dumating
  rationale: Historical present ito sa salaysay. Natural sa modernong Tagalog ang nagdaang panahong “dumating”; ipinahihiwatig ng participial na λέγοντες na higit sa isa ang dumating.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: mula sa bahay ng pinuno ng sinagoga
  rationale: Sa konteksto, kasama ni Jesus ang pinuno ng sinagoga, kaya ang parirala ay tumutukoy sa mga taong mula sa kanyang sambahayan. Nililinaw ng “bahay” ang likas na diwa sa Tagalog, habang itinatala sa talababa ang mas literal na anyo.
- source_word: λέγοντες ὅτι
  choice: at nagsabi
  rationale: Natural na panimula ito sa tuwirang pahayag sa salaysay at ipinapahayag ang kilos ng mga dumating.
- source_word: Ἡ θυγάτηρ σου
  choice: ang anak mong babae
  rationale: Karaniwan at malinaw na katumbas ng “your daughter” sa modernong Tagalog.
- source_word: ἀπέθανεν
  choice: Namatay na
  rationale: Ipinapahayag nito ang natapos na pangyayari at ang agarang kasalukuyang kabuluhan nito; ang “na” ay natural sa Tagalog sa ganitong balita.
- source_word: τί ἔτι σκύλλεις
  choice: Bakit mo pa aabalahin
  rationale: Ang “bakit ... pa” ay natural na katumbas ng τί ἔτι, at ang “aabalahin” ay naghahatid ng diwang pag-iistorbo o paglalagay ng pasanin sa isang tao nang hindi labis ang tindi.
- source_word: τὸν διδάσκαλον
  choice: ang Guro
  rationale: Tuwirang isinasalin ang titulo at pinananatili ang pananaw ng mga nagsasalita nang hindi ito pinapalitan ng pangalan ni Jesus o ng titulong may ibang pahiwatig.
theological_decisions:
- issue: Pagtukoy sa “ang Guro”
  choice: ang Guro
  alternative: si Jesus; ang Panginoon
  rationale: Ginagamit ng Griyego ang titulong διδάσκαλος, hindi ang pangalan ni Jesus o ang titulong “Panginoon.” Pinananatili nito ang paraan ng pagkilala sa kanya ng mga nagsasalita at hindi nagdaragdag ng mas ganap na pahayag tungkol sa kanyang pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang karaniwang “sinagoga” at ang titulong “Guro.” Ang ayos ng pangungusap ay salaysay na madaling maunawaan, habang ang mga talababa ay nagpapanatili ng literal na anyo at saklaw ng mahahalagang salitang Griyego.
