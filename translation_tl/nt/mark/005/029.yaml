  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: tl
  text: At agad na natuyo ang pinagmumulan ng kanyang pagdurugo,[a] at nalaman niya sa kanyang katawan na gumaling na siya mula sa kanyang karamdaman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bukal ng kanyang dugo.” Gumagamit ang Griyego ng matingkad na larawan ng isang bukal o pinagmumulan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang salita bilang “hagupit” o “salot.” Dito, tumutukoy ito sa kanyang masakit na kalagayan, hindi sa literal na paghagupit.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: agad
  rationale: Karaniwan at natural na katumbas ito ng pang-abay na nagbibigay-diin sa kagyat na pangyayari sa salaysay ni Marcos.
- source_word: ἐξηράνθη
  choice: natuyo
  rationale: Pinananatili nito ang matingkad na larawan ng Griyegong pandiwa sa halip na gawing payak lamang na “tumigil.”
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: ang pinagmumulan ng kanyang pagdurugo
  rationale: Ang πηγή ay bukal o pinagmumulan. Ang “pinagmumulan ng kanyang pagdurugo” ay nagpapanatili sa larawan habang malinaw at likas sa makabagong Filipino.
- source_word: ἔγνω τῷ σώματι
  choice: nabatid niya sa sarili niyang katawan
  rationale: Pinananatili ng “nabatid” ang diwa ng pagkilala o pagkaalam, samantalang ipinahihiwatig ng pariralang “sa sarili niyang katawan” na pisikal at personal niyang naranasan iyon.
- source_word: ἴαται
  choice: gumaling na siya
  rationale: Ipinahahayag ng “na” ang natapos nang pagpapagaling na may nagpapatuloy na bunga, gaya ng Griyegong perfect.
- source_word: ἀπὸ τῆς μάστιγος
  choice: sa kanyang matinding karamdaman
  rationale: Ang μάστιξ ay literal na hagupit ngunit ginagamit dito para sa isang masakit at nagpapahirap na kondisyon. Ang “matinding karamdaman” ay malinaw sa konteksto at hindi nagpapahiwatig ng literal na paghagupit.
theological_decisions:
- issue: Kalikasan ng pagpapagaling
  choice: Ilarawan ang kagyat at tunay na paggaling ng katawan, kasama ang sariling pagkabatid ng babae rito.
  alternative: Ituring lamang itong pansariling pakiramdam ng babae nang hindi tuwirang sinasabing tunay siyang gumaling.
  rationale: Kapuwa inilalahad ng Griyego ang obhetibong pagtigil ng pagdurugo at ang pagkabatid ng babae na gumaling na siya; walang idinagdag na paliwanag tungkol sa paraan o pinagmulan ng paggaling.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matingkad na larawan ng pagkatuyo at ng pinagmumulan ng dugo, habang iniwasan ang hindi likas na literalismong “bukal ng kanyang dugo” sa pangunahing teksto.
