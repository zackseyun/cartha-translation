base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: tl
  text: At umalis siya at nagsimulang ipahayag sa Decapolis kung gaano karami ang ginawa ni Jesus para sa kanya[a], at namangha ang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng ginawa ni Jesus para sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: umalis siya
  rationale: Tuwirang ipinapahayag ang pag-alis niya sa lugar; natural at makabagong Tagalog ito.
- source_word: ἤρξατο κηρύσσειν
  choice: nagsimulang ipahayag
  rationale: Pinananatili ang aspektong pasimula ng ἤρξατο at ang pampublikong pagpapahayag ng κηρύσσειν nang hindi ipinahihiwatig na pormal na sermon iyon.
- source_word: ἐν τῇ Δεκαπόλει
  choice: sa Decapolis
  rationale: Tuwirang katumbas ng ἐν at pinananatili ang kinikilalang pangalan ng rehiyon.
- source_word: ὅσα
  choice: kung gaano kalaki
  rationale: Ipinahahayag ang lawak ng ginawa ni Jesus. Posible rin ang mas pangkabuuang diwang “lahat ng,” kaya inilagay iyon sa talababa.
- source_word: ἐποίησεν αὐτῷ
  choice: ang ginawa ni Jesus para sa kanya
  rationale: Ang datibong αὐτῷ sa konteksto ay nagpapahiwatig ng ginawa alang-alang sa kanya; natural sa Tagalog ang “para sa kanya.”
- source_word: πάντες
  choice: ang lahat
  rationale: Natural na kolektibong pagtukoy sa lahat ng mga nakarinig nang hindi nagdaragdag ng tahasang pangngalan.
- source_word: ἐθαύμαζον
  choice: namangha
  rationale: Karaniwang makabagong salita para sa matinding paghanga o pagkamangha; sapat itong naghahatid ng reaksiyong inilalarawan ng pandiwa.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Ginamit ang pamantayang anyo ng personal na pangalan sa modernong Filipino.
theological_decisions:
- issue: Saklaw ng ipinahayag ng lalaki kaugnay ng pagkakakilanlan ni Jesus
  choice: Inilahad lamang na ipinahayag niya ang ginawa ni Jesus para sa kanya.
  alternative: Magdagdag ng paliwanag na tahasang nag-uugnay nito sa banal na kapangyarihan o pagkakakilanlan ni Jesus.
  rationale: Ipinahihiwatig ng salaysay ang pambihirang kapangyarihan ni Jesus, ngunit hindi tahasang nagbibigay ang talata ng doktrinal na konklusyon; kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang “Decapolis” bilang pangalang pantangi ng rehiyon; maaaring mangailangan ito ng hiwalay na glosaryo sa publikasyon, ngunit walang paliwanag na idinagdag sa mismong talata.
