  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: tl
  text: Sumigaw siya nang malakas at sinabi, “Ano ang kinalaman ko sa iyo,[a] Jesus, Anak ng Kataas-taasang Diyos? Pinanunumpa kita sa Diyos:[b] huwag mo akong pahirapan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong pananalita ay isang idyoma na nagpapahayag ng paglayo, pagtutol, o pagtangging makialam. Maaari ring isalin, “Ano ang pakialam mo sa akin?”
    reason: lexical_alternative
  - marker: b
    text: O “Nakikiusap ako sa iyo alang-alang sa Diyos,” o “Inuutusan kitang manumpa sa Diyos.” Ang pandiwang Griyego ay tumutukoy sa isang taimtim na panunumpa o solemne at mahigpit na pag-uutos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: Sumigaw siya nang malakas
  rationale: Likas at malinaw sa modernong Tagalog; pinananatili ang lakas at kagyat na himig ng sigaw.
- source_word: λέγει
  choice: at sinabi
  rationale: Ginamit ang karaniwang nagdaang panahunan sa salaysay sa Tagalog. Mas natural ito kaysa pilit na panatilihin ang historical present ng Griyego, habang nananatili ang buhay na daloy ng tagpo.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Ano ang kinalaman ko sa iyo
  rationale: Ipinahahayag nito ang paglayo, pagtutol, o pagtangging makialam ang kausap, nang hindi labis na nililimitahan ang saklaw ng idyomang Griyego.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Anak ng Kataas-taasang Diyos
  rationale: Tuwirang pinananatili ang titulong υἱός at ang katawagang ὕψιστος sa natural at marangal na ayos sa Tagalog.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Pinanunumpa kita sa Diyos
  rationale: Pinananatili nito ang pormal at panunumpang lakas ng ὁρκίζω, pati ang kapansin-pansing tensiyon ng isang masamang espiritung dumudulog kay Jesus sa pamamagitan ng Diyos.
- source_word: μή με βασανίσῃς
  choice: huwag mo akong pahirapan
  rationale: Ang 'pahirapan' ay natural sa Tagalog at sapat na matindi upang katawanin ang βασανίζω nang hindi ipinapalagay ang isang tiyak na paraan ng pagpapahirap.
theological_decisions:
- issue: Pagkilala ng masamang espiritu sa pagkakakilanlan ni Jesus
  choice: Jesus, Anak ng Kataas-taasang Diyos
  alternative: Jesus, Anak ng Diyos na Kataas-taasan
  rationale: Pinananatiling lantad ang pagkilala kay Jesus bilang Anak at ang banal na titulong 'Kataas-taasan,' nang walang idinadagdag na paliwanag na doktrinal.
- issue: Lakas ng ὁρκίζω sa pakiusap ng masamang espiritu
  choice: Pinanunumpa kita sa Diyos
  alternative: Nakikiusap ako sa iyo alang-alang sa Diyos
  rationale: Hindi pinapahina bilang karaniwang pakiusap ang solemne at tila panunumpang pananalita. Pinananatili rin ang teolohikal at dramatikong tensiyon ng pagbanggit ng masamang espiritu sa Diyos habang nakikipag-usap kay Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Iniwasan ang sobrang teknikal o makalumang pananalita, ngunit pinanatili ang solemne at matinding himig ng pahayag.
