  source_fidelity: Tumpak ang temporal na 'Habang sumasakay,' ang 'bangka,' at ang duratibong 'patuloy na.' Gayunman, ang 'na payagan siyang sumama' ay nagdaragdag ng tahasang konseptong pahintulot na wala sa ἵνα μετ’ αὐτοῦ ᾖ. Ang Griyego ay humihiling na siya ay 'makasama' ni Jesus.
  naturalness: Likas at malinaw ang pangungusap sa makabagong Filipino. Mas direkta at mas malapit sa source ang 'nakiusap ... na makasama siya' kaysa 'nagmakaawa ... na payagan siyang sumama.'
  terminology: Ang 'lalaking dating sinapian ng demonyo' ay katanggap-tanggap at natural na pantukoy sa dating kalagayan ng lalaki sa konteksto. Pinananatili nito ang personal na demonyakong pagkapinagdurusahan nang hindi nagdadagdag ng klinikal na paliwanag.
