  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: tl
  text: Habang sumasakay si Jesus sa bangka, patuloy na nakiusap sa kanya ang lalaking dating sinapian ng demonyo na makasama siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Habang sumasakay si Jesus
  rationale: Ipinahahayag ng pangkasalukuyang pandiwaring nasa genitive absolute ang kilos na kasabay at nagpapatuloy habang nagaganap ang pangunahing kilos. Ginawang tahas ang pangalang “Jesus” para maging malinaw at natural sa Filipino ang reperente ng panghalip.
- source_word: πλοῖον
  choice: bangka
  rationale: Sa tagpo sa Lawa ng Galilea, “bangka” ang natural na makabagong katumbas at hindi nagpapahiwatig ng napakalaking sasakyang-dagat.
- source_word: παρεκάλει
  choice: patuloy na nagmakaawa
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o paulit-ulit na pakiusap; ipinahahayag din ng “nagmakaawa” ang tindi ng pakiusap sa kontekstong ito.
- source_word: ὁ δαιμονισθείς
  choice: ang lalaking dating sinapian ng demonyo
  rationale: Ang substantival aorist participle ay tumutukoy sa lalaking pinalaya na sa kapangyarihan ng mga demonyo. Nililinaw ng “dating” na tapos na ang kalagayang iyon, at ang “sinapian ng demonyo” ay karaniwan at malinaw na ekspresyon sa Filipino nang hindi ito ginagawang klinikal o metaporikal lamang.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: na payagan siyang sumama sa kanya
  rationale: Ipinahahayag nito ang nilalaman ng pakiusap at pinananatili ang diwa ng personal na pagsama kay Jesus. Idinagdag ang “payagan” bilang likas na Filipino na pagpapahayag ng hinihiling, hindi bilang bagong teolohikal na detalye.
theological_decisions:
- issue: Paglalarawan sa dating kalagayan ng lalaking tinutukoy ng δαιμονισθείς
  choice: dating sinapian ng demonyo
  alternative: dating nasa kapangyarihan ng mga demonyo
  rationale: Malinaw na inilalarawan ng salaysay ang tunay na kapangyarihan ng demonyo sa tao at ang kasunod niyang paglaya. Ang piniling parirala ay maikli, likas sa Filipino, at hindi nagpapasok ng makabagong klinikal o metaporikal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na nagmakaawa” upang maipakita ang aspektong nagpapatuloy ng imperfect, at ginawang tahas ang “Jesus” upang maiwasan ang malabong sunod-sunod na panghalip.
