  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: tl
  text: At isinalaysay sa kanila ng mga nakakita kung paano ito nangyari sa lalaking sinasapian ng demonyo[a] at ang tungkol sa mga baboy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking inaalihan ng demonyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: isinalaysay
  rationale: Ipinahihiwatig ng pandiwa ang detalyadong pagkukuwento o pag-uulat. Natural at marangal sa makabagong Filipino ang “isinalaysay,” at ang kasunod na sugnay ang nagsasaad ng nilalaman ng salaysay.
- source_word: οἱ ἰδόντες
  choice: ang mga nakakita
  rationale: Pinananatili nito ang anyong participyal at malinaw na tumutukoy sa mga taong mismong nakasaksi, nang hindi nagdaragdag ng mas teknikal na katawagang “mga saksi.”
- source_word: πῶς ἐγένετο
  choice: kung paano ito nangyari
  rationale: Pinananatili ng “kung paano” ang diwa ng πῶς, na tumutukoy sa paraan o takbo ng pangyayari. Ang “ito” ay likas na tumutukoy sa nasaksihang pangyayari sa naunang konteksto.
- source_word: τῷ δαιμονιζομένῳ
  choice: sa lalaking sinasapian ng demonyo
  rationale: Malinaw at karaniwang nauunawaan ang parirala sa Filipino, at inilalarawan nito ang tao bilang nasa ilalim ng kapangyarihan ng demonyo ayon sa salaysay. Iniiwasan nito ang malabo o teknikal na saling “dinemonyo.”
- source_word: περὶ τῶν χοίρων
  choice: ang tungkol sa mga baboy
  rationale: Ang περί na may genitive ay nangangahulugang “tungkol sa.” “Mga baboy” ang tuwiran at natural na katumbas ng χοίρων sa makabagong Filipino.
theological_decisions:
- issue: Paglalarawan sa τῷ δαιμονιζομένῳ sa salaysay tungkol sa kapangyarihan ng mga demonyo
  choice: lalaking sinasapian ng demonyo
  alternative: lalaking inaalihan ng demonyo
  rationale: Ipinakikita ng teksto ang tunay na paghihirap na dulot ng demonyo. Malinaw ang “sinasapian” sa ordinaryong mambabasa at hindi nito binabago ang pangyayari tungo sa isang sikolohikal lamang na paliwanag. Hindi rin nito ipinapaliwanag nang higit sa kayang tukuyin ng mismong participle ang eksaktong paraan ng impluwensiya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “isinalaysay” upang ihayag ang maingat na pag-uulat, samantalang ang “gayundin” ay natural na nag-uugnay sa ulat tungkol sa lalaki at sa mga baboy.
