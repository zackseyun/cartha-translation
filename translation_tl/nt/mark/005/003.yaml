  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: tl
  text: Nakatira siya sa mga libingan[a], at wala nang sinumang makagapos sa kanya, kahit sa pamamagitan ng isang tanikala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa loob ng mga libingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: Nakatira siya
  rationale: Likas na salin sa makabagong Tagalog ng idyomang literal na 'may tirahan siya.' Ipinahihiwatig ng imperpekto ang nagpapatuloy na kalagayan noong panahong iyon.
- source_word: ἐν τοῖς μνήμασιν
  choice: sa mga libingan
  rationale: Ang μνῆμα ay libingan o puntod. Pinananatili ng 'sa mga libingan' ang tunay na lawak ng ἐν, na maaaring tumukoy sa loob o sa pook ng mga libingan, nang hindi labis na tinutukoy ang pisikal na posisyon.
- source_word: οὐκέτι οὐδεὶς
  choice: wala nang sinuman
  rationale: Malinaw na ipinahahayag ang οὐκέτι na may dating kakayahan o pagtatangkang hindi na umiiral, at ang οὐδείς bilang ganap na 'walang sinuman.'
- source_word: ἐδύνατο αὐτὸν δῆσαι
  choice: makagapos sa kanya
  rationale: Ang 'makagapos' ay likas at tumpak para sa kakayahang ipinahahayag ng ἐδύνατο at sa pisikal na paggapos ng δῆσαι.
- source_word: οὐδὲ ἁλύσει
  choice: kahit tanikala pa
  rationale: Pinananatili ang nagbibigay-diin na οὐδέ at ang isahang ἁλύσει. Ang 'tanikala' ay angkop sa kasunod na konteksto ng matibay na panggapos.
