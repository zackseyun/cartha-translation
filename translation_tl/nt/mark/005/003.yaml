translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang 'nakatira' sa halip na mas pormal ngunit mabigat na 'may tirahan,' at pinanatili ang 'tanikala' bilang tiyak na panggapos.
