  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: tl
  text: At dumating sila sa bahay ng pinuno ng sinagoga. Nakita niya roon ang kaguluhan[a] at ang mga taong umiiyak at humahagulgol nang malakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maingay na pagkakagulo”; ang salitang Griyego ay maaaring tumukoy sa ingay, kaguluhan, o pagkakagulo ng maraming tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: dumating sila
  rationale: Ipinahahayag nito ang pagdating nila sa bahay sa natural na salaysay sa Filipino. Bagaman nasa pangkasalukuyang anyo ang Griyego bilang historical present, mas likas sa makabagong Tagalog ang pangnagdaan sa ganitong konteksto.
- source_word: οἶκον
  choice: bahay
  rationale: Tuwirang katumbas ito ng οἶκος at hindi nagdaragdag ng damdaming maaaring ipahiwatig ng “tahanan.”
- source_word: ἀρχισυναγώγου
  choice: pinuno ng sinagoga
  rationale: Malinaw at makabagong tawag ito sa namumuno o nangangasiwang opisyal ng sinagoga.
- source_word: θεωρεῖ
  choice: nakita niya roon
  rationale: Ang ikatlong panauhang isahan ay tumutukoy kay Jesus ayon sa konteksto. Pinanatili ang panghalip upang hindi maging mas tiyak kaysa sa anyo ng Griyego; idinagdag ang “roon” para sa natural na daloy.
- source_word: θόρυβον
  choice: kaguluhan
  rationale: Saklaw nito ang maingay at magulong kalagayan ng pagluluksa, hindi lamang ang tunog.
- source_word: κλαίοντας
  choice: mga taong umiiyak
  rationale: Ginagawang malinaw sa natural na Filipino ang substantibong gamit ng participle nang hindi dinaragdagan ang kahulugan.
- source_word: ἀλαλάζοντας
  choice: humahagulgol
  rationale: Ipinahahayag nito ang malakas at hayag na pag-iyak na kaugnay ng pagluluksa.
- source_word: πολλά
  choice: nang malakas
  rationale: Ginagamit dito ang salita bilang pampalakas sa paghagulgol; ang “nang malakas” ang natural na adverbial na katumbas sa Filipino.
