  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: tl
  text: Pagkapasok niya, sinabi niya sa kanila, “Bakit kayo nagkakagulo at umiiyak? Hindi namatay ang bata, kundi natutulog.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi namatay ang bata, kundi natutulog siya.” Maaaring ginamit dito ni Jesus ang pagtulog bilang larawan ng kamatayan, kaugnay ng nalalapit niyang pagbuhay sa bata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Pagkapasok niya
  rationale: Likas na ipinahahayag sa Tagalog ang kilos na nauna sa pangunahing pandiwa, habang pinananatili ang ugnayan ng aorist participle sa λέγει.
- source_word: λέγει
  choice: sinabi niya
  rationale: Bagaman historical present ang Griyego, karaniwang gumagamit ang makabagong salaysay sa Tagalog ng aspektong naganap; ang “sinabi niya” ay malinaw at natural nang hindi binabago ang pangyayari.
- source_word: Τί
  choice: Bakit
  rationale: Sa ganitong tanong na may bahid ng pagsaway, “Bakit” ang likas na katumbas ng idyomatikong gamit ng Τί.
- source_word: θορυβεῖσθε
  choice: nagkakagulo
  rationale: Ipinahihiwatig nito ang maingay na kaguluhan ng mga nagluluksa, hindi lamang simpleng pag-iingay.
- source_word: κλαίετε
  choice: umiiyak
  rationale: Karaniwan, malinaw, at marangal na salita ito; hindi nito labis na tinutukoy kung ritwal na panaghoy ang pag-iyak.
- source_word: παιδίον
  choice: ang bata
  rationale: Pinananatili ang pangkalahatang kahulugan na “bata.” Bagaman babae ang bata ayon sa konteksto, hindi iyon tahasang nakasaad sa pangngalang ginamit sa talata.
- source_word: οὐκ ἀπέθανεν
  choice: Hindi namatay
  rationale: Pinananatili nito ang pandiwang pahayag ng aorist ἀπέθανεν sa halip na gawin itong statibong “hindi patay.”
- source_word: καθεύδει
  choice: natutulog
  rationale: Natural na kasalukuyang anyo sa Tagalog na nagpapanatili sa larawan ng pagtulog at hindi agad nagpapaliwanag sa kahulugan nito.
theological_decisions:
- issue: Kung ang sinabi ni Jesus ay literal na pagtanggi sa kamatayan o metaporikong pagtukoy sa kamatayan bilang pagtulog
  choice: Panatilihin sa pangunahing teksto ang “Hindi namatay ang bata, kundi natutulog” nang walang paliwanag na idinagdag.
  alternative: “Hindi mananatiling patay ang bata; para lamang siyang natutulog.”
  rationale: Tahas at may tensiyon ang pahayag sa Griyego. Hindi dapat pasiyahan ng salin kung ito ay metaporiko, nagpapahiwatig ng nalalapit na muling pagbuhay, o literal na pahayag sa ibang diwa.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “nagkakagulo” upang maipakita ang maingay na eksena ng pagluluksa, at pinanatili ang payak ngunit matinding pagsalungat sa pagitan ng “namatay” at “natutulog.”
