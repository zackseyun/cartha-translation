  source_fidelity: Tumpak ang salin sa Griyego. Ang “Pagkapasok niya” ay sapat na natural na paglalapat ng εἰσελθών, at ang “sinabi niya” ay katanggap-tanggap na pagsasalaysay sa Tagalog para sa historical present na λέγει. Naipapahayag ng “Bakit kayo nagkakagulo at umiiyak?” ang saklaw at tonong pasaway ng Τί θορυβεῖσθε καὶ κλαίετε. Pinananatili rin ng “Hindi namatay ang bata, kundi natutulog” ang tahasang pag-iiba ng ἀπέθανεν at καθεύδει nang hindi nilulutas ang sinasadyang tensiyon ng pahayag.
  naturalness: Makabago, malinaw, at marangal ang Filipino. Ang “nagkakagulo” at “umiiyak” ay natural na magkasamang paglalarawan ng maingay na tagpo ng pagluluksa. Maayos ang daloy at bantas ng tuwirang pananalita.
  terminology: Ang “bata” ay wastong pangkalahatang katumbas ng παιδίον at hindi nagdaragdag ng kasarian. Ang “namatay” at “natutulog” ay pinananatili ang mahalagang metaporikal na pananalita. Ang talababa ay maingat na gumagamit ng “Maaaring” at hindi ipinipilit ang isang doktrinal na pagbasa.
