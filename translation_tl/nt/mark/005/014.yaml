translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lungsod” at “mga karatig na bukirin” upang mapanatili ang paghahambing ng urban at rural na lugar. Hinati sa dalawang pangungusap para sa likas na daloy sa Tagalog, at ginamit ang “Kaya” upang ipakita ang pagpapatuloy at tugon sa naunang pagbabalita.
