  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: tl
  text: Tumakas ang mga nag-aalaga sa kanila at ibinalita ang nangyari sa lungsod at sa kanayunan[a]. At dumating ang mga tao upang tingnan kung ano ang nangyari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga bukirin.” Maaari itong isalin nang mas literal sa ganitong paraan, ngunit dito ay malamang na tumutukoy ito sa mga pook sa kanayunan na nakapaligid sa lungsod.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: mga nag-aalaga
  rationale: Tumutukoy ito sa mga nag-aasikaso sa kawan ng mga baboy; likas sa Tagalog at sapat ang lawak ng “nag-aalaga” upang saklawin ang pagpapakain at pagpapastol.
- source_word: αὐτούς
  choice: sa mga iyon
  rationale: Pinananatili ang panghalip ng Griyego, na malinaw na tumutukoy sa mga baboy sa naunang talata.
- source_word: ἔφυγον
  choice: Tumakas
  rationale: Ipinahahayag ang biglaan at takot na paglayo na ipinahihiwatig ng aorist na pandiwa.
- source_word: ἀπήγγειλαν
  choice: ibinalita ang nangyari
  rationale: Natural na paglalahad sa Tagalog ng pag-uulat o pagpapakalat ng balita; nililinaw ng “ang nangyari” ang di-tahasang layon ayon sa konteksto.
- source_word: εἰς τὴν πόλιν
  choice: sa lungsod
  rationale: Sa pandiwa ng pagbabalita, ang εἰς ay natural na tumutukoy sa lugar na pinaghayagan ng balita.
- source_word: εἰς τοὺς ἀγρούς
  choice: sa mga karatig na bukirin
  rationale: Ang ἀγροί ay literal na mga bukid o bukirin, ngunit sa pagtutumbas nito sa lungsod ay malamang na tumutukoy sa nakapaligid na mga pook sa kanayunan; pinananatili ng salin ang kongkretong larawan at ang kontekstuwal na diwa.
- source_word: ἦλθον
  choice: pumunta ang mga tao
  rationale: Hindi tahasang binanggit sa Griyego ang maramihang simuno. Ang “mga tao” ay natural sa Tagalog at ipinakikilalang ang mga nakarinig ng balita ang pumunta, nang hindi sila higit na tinutukoy.
- source_word: ἰδεῖν
  choice: upang tingnan
  rationale: Ipinahahayag ang layunin ng kanilang pagpunta; ang “tingnan” ay angkop sa aktuwal na pagsisiyasat sa pangyayari.
- source_word: τί ἐστιν τὸ γεγονός
  choice: kung ano ang nangyari
  rationale: Natural na katumbas sa Tagalog ng tanong tungkol sa naganap na pangyayari, habang naipakikita ang resultang diwa ng perfect participle γεγονός.
