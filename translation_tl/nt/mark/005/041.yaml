  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: tl
  text: At hinawakan niya ang kamay ng bata at sinabi niya sa kanya, “Talita kum,”[a] na ang ibig sabihin ay, “Batang babae, sinasabi ko sa iyo, bumangon ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Talita kum” ay transliterasyong Filipino ng Aramaikong pariralang isinulat sa tekstong Griyego bilang Ταλιθα κουμ. Isinusulat din ito bilang “Talitha koum” o, sa tradisyonal na baybay, “Talitha cum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: hinawakan niya ang kamay ng bata
  rationale: Ipinapahayag ng parirala ang paghawak ni Jesus sa kamay ng bata. Ang “hinawakan” ay likas sa makabagong Tagalog at hindi nagdaragdag ng marahas na himig na maaaring ipahiwatig ng “sinunggaban.”
- source_word: λέγει αὐτῇ
  choice: sinabi rito
  rationale: Malinaw at natural sa salaysay ang “sinabi.” Ginamit ang “rito” upang tumukoy sa kalapit na batang babae at maiwasan ang sunod-sunod na “niya ... niya,” bagaman hindi nito ginagawang impersonal ang pakikipag-usap ni Jesus.
- source_word: Ταλιθα κουμ
  choice: Talita kum
  rationale: Pinananatili ang Aramaikong pananalita na sadyang iningatan ng tekstong Griyego, ngunit isinusulat ayon sa malinaw na bigkas sa Filipino. Kasunod nito ang mismong paliwanag ni Marcos.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: na ang ibig sabihin ay
  rationale: Likas itong paraan sa Filipino upang ipakilala ang salin o pagpapakahulugan sa Aramaikong parirala, nang hindi binabago ang nilalaman nito.
- source_word: Τὸ κοράσιον
  choice: Batang babae
  rationale: Tiyak na tumutukoy ang κοράσιον sa isang batang babae. Ang saling ito ay malinaw at dignified; hindi nito ipinapalit ang mas malayang katawagang “iha.”
- source_word: σοὶ λέγω
  choice: sinasabi ko sa iyo
  rationale: Pinananatili ang tahasang σοὶ at λέγω sa Griyego sa halip na alisin bilang paulit-ulit, kaya nananatili ang diin ng direktang utos.
- source_word: ἔγειρε
  choice: bumangon ka
  rationale: Sa konteksto, inuutusan ang bata na tumindig o bumangon. Karaniwan at tuwiran ang “bumangon ka” sa modernong Filipino.
theological_decisions:
- issue: Pagpapanatili sa Aramaikong sinabi ni Jesus
  choice: Pinanatili ang “Talita kum” at agad na isinunod ang paliwanag ni Marcos.
  alternative: Isalin lamang bilang “Batang babae, sinasabi ko sa iyo, bumangon ka.”
  rationale: Kapuwa nasa pinagmulang teksto ang Aramaikong pananalita at ang paliwanag nito. Ang pagpapanatili sa dalawa ay gumagalang sa anyong pampanitikan at matingkad na detalye ng salaysay nang hindi inililihim ang kahulugan.
- issue: Lakas ng utos na ἔγειρε
  choice: bumangon ka
  alternative: mabuhay kang muli
  rationale: Maaaring gamitin ang ἐγείρω sa mga kontekstong may kaugnayan sa muling pagkabuhay, ngunit dito ang tuwirang utos ay maaaring mangahulugang bumangon o tumindig. Hindi dapat ipasok sa mismong salita ang mas tiyak na teolohikal na paliwanag na hindi tahasang nakasaad.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinanatili ang Aramaikong pahayag at ang tahasang “sinasabi ko sa iyo.” Ginawang pangnagdaan ang makasaysayang pangkasalukuyang λέγει upang maging natural ang daloy ng salaysay sa Tagalog, habang nananatili ang agarang kilos at direktang pananalita.
