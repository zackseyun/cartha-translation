  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: tl
  text: At may isang babae na labindalawang taon nang dinudugo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may pagdurugo” o “may pag-agos ng dugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: May ... roon
  rationale: Sa kontekstong pasalaysay, likas na ipinakikilala sa Tagalog ang bagong tauhan sa pamamagitan ng “May ... roon”; naipahihiwatig nito ang pang-ugnay na καὶ nang hindi gumagamit ng pilit na “At.”
- source_word: γυνὴ
  choice: isang babae
  rationale: Ipinakikilala ng pangngalang walang pantukoy ang isang bagong tauhan; natural sa Tagalog ang “isang babae.”
- source_word: οὖσα ἐν ῥύσει αἵματος
  choice: dinudugo
  rationale: Ang konstruksiyon ay tumutukoy sa nagpapatuloy na kalagayan ng pag-agos o paglabas ng dugo. Ang “dinudugo” ay maikli, natural, at malinaw sa modernong Tagalog, habang hindi nagpapasok ng mas tiyak na medikal na diagnosis kaysa sa Griyego.
- source_word: δώδεκα ἔτη
  choice: labindalawang taon na
  rationale: Ang akusatibo ay nagsasaad ng tagal. Kasama ng “nang,” natural na ipinahahayag sa Tagalog na nagpapatuloy na sa loob ng labindalawang taon ang kalagayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinili ang karaniwang “dinudugo” sa pangunahing teksto, at inilagay sa talababa ang mas literal na mga anyo upang mapanatili ang konkretong larawan ng ῥύσις αἵματος.
