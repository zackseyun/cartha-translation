  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: tl
  text: Nang marinig niya ang tungkol kay Jesus, lumapit siya sa likuran ni Jesus, sa gitna ng karamihan, at hinipo ang damit niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “balabal” o “kasuotan.” Malawak ang saklaw ng salitang Griyego na ἱμάτιον at madalas itong tumutukoy sa panlabas na kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Nang mabalitaan niya
  rationale: Ang aorist participle na pambabae at isahan ay nagsasaad ng kilos na nauna sa pangunahing kilos. Likas sa modernong Tagalog ang temporal na sugnay na “Nang mabalitaan niya,” at ipinahihiwatig din ng “mabalitaan” na nakarinig siya ng mga ulat tungkol kay Jesus.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: ang tungkol kay Jesus
  rationale: Ang περί na may genitive ay karaniwang nangangahulugang “tungkol sa.” Pinananatili ng salin ang impormasyonal na diwa at ang karaniwang anyo ng pangalang Jesus sa Tagalog.
- source_word: ἐλθοῦσα
  choice: lumapit siya
  rationale: Bagaman literal na “dumating/pumaroon,” sa konteksto ay inilalarawan nito ang paglapit ng babae kay Jesus. Ang “lumapit” ay likas at malinaw nang hindi dinaragdagan ang lakas o tagal ng kilos.
- source_word: ἐν τῷ ὄχλῳ
  choice: sa gitna ng maraming tao
  rationale: Ipinapahayag ng ἐν na may dative ang kinalalagyan o nakapaligid na kalagayan. Ang “sa gitna ng maraming tao” ay natural na Tagalog para sa isang taong nasa loob ng siksik na karamihan.
- source_word: ὄπισθεν
  choice: mula sa likuran
  rationale: Tinutukoy ng ὄπισθεν ang posisyon o paglapit mula sa likod. Nauunawaan sa konteksto na sa likuran ni Jesus siya lumapit, nang hindi kailangang ulitin ang panghalip.
- source_word: ἥψατο
  choice: hinipo
  rationale: Ang middle aorist ng ἅπτω sa kontekstong ito ay nangangahulugang humipo o humawak. Ang “hinipo” ang pinakasimple at hindi nagpapalabis sa lakas o tagal ng paghawak.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ang damit nito
  rationale: Ang ἱμάτιον ay tumutukoy sa isang kasuotan, madalas ay panlabas na kasuotan. Ang “damit” ay malawak, natural, at hindi labis na tumutukoy sa isang tiyak na modernong uri ng kasuotan; ang “nito” ay malinaw na tumutukoy kay Jesus at umiiwas sa sunod-sunod na “niya.”
