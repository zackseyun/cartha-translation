  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: tl
  text: At patuloy na sinasabi sa kanya ng kanyang mga alagad, “Nakikita mong sinisiksik ka ng pulutong, at itinatanong mo, ‘Sino ang humipo sa akin?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: patuloy na sinasabi
  rationale: Ipinahihiwatig ng imperpektong panahunan ang nagpapatuloy o inuulit na pagsasalita; malinaw itong naipapahayag sa natural na Tagalog.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Karaniwan at angkop na salin para sa mga μαθηταί ni Jesus, na pinananatili ang diwa ng mga tagasunod na tinuturuan.
- source_word: Βλέπεις
  choice: Nakikita mong
  rationale: Tuwirang pahayag ito tungkol sa hayag na kalagayan sa sandaling iyon at natural na nag-uugnay sa kasunod na sugnay.
- source_word: ὄχλον
  choice: mga tao
  rationale: Sa pariralang 'nagsisiksikan ... ang mga tao,' likas at malinaw nitong ipinahahayag ang kolektibong πλήθος/ὄχλος nang hindi nagiging matigas ang tunog.
- source_word: συνθλίβοντά
  choice: nagsisiksikan sa iyo
  rationale: Ipinapakita nito ang pisikal na pagdiin at pagsikip ng pulutong sa paligid ni Jesus nang hindi pinalalabis na para bang dinudurog siya.
- source_word: λέγεις
  choice: itinatanong mo pa
  rationale: Dahil tanong ang mismong sinasabi, mas natural sa Tagalog ang 'itinatanong'; ang 'pa' ay naghahatid ng pagtataka ng mga alagad nang hindi dinaragdagan ang proposisyon.
- source_word: Τίς μου ἥψατο
  choice: Sino ang humipo sa akin?
  rationale: Ang ἅπτομαι ay tumutukoy sa tiyak na paghipo na kagagawang naganap; 'humipo sa akin' ang malinaw at likas na katumbas sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalita ang daloy. Pinanatili ang nagpapatuloy na aspekto ng ἔλεγον at ang pisikal na pagsisiksikan ng pulutong. Walang talababa dahil sapat na naipapahayag ng pangunahing teksto ang leksikal na diwa.
