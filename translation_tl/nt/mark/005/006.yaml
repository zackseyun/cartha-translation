id: MRK.5.6
reference: Mark 5:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: tl
  text: At nang makita niya si Jesus mula sa malayo, tumakbo siya at nagpatirapa sa harap niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumamba sa kanya” o “nagbigay-galang sa kanya.” Ang pandiwang Griyego ay maaaring tumukoy sa pagsamba o sa pagpapatirapa bilang pagpugay, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: nang makita niya
  rationale: Ang aorist participle ng ὁράω ay likas na naipapahayag sa Tagalog bilang sugnay na panahunan; pinananatili nito ang pagkakasunod ng pagkakita at pagtakbo nang hindi labis na binibigyang-kahulugan ang ugnayan.
- source_word: ἀπὸ μακρόθεν
  choice: mula sa malayo
  rationale: Malinaw at natural na modernong Tagalog para sa pahiwatig ng layo sa espasyo.
- source_word: ἔδραμεν
  choice: tumakbo siya
  rationale: Tuwirang katumbas ng pandiwang τρέχω at hindi nagdaragdag ng tinding wala sa mismong salita.
- source_word: προσεκύνησεν αὐτόν
  choice: nagpatirapa sa harap niya
  rationale: Ipinapakita ang nakikitang kilos ng pagpapatirapa nang hindi tiyak na nagpapasya kung ito ay pagsamba o pagpugay; kapuwa maaaring saklawin ng προσκυνέω ayon sa konteksto.
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay at sunod-sunod na estilong salaysay ni Marcos.
- source_word: τὸν Ἰησοῦν
  choice: si Jesus
  rationale: Karaniwang anyong Tagalog para sa personal na pangalang gumaganap bilang layon ng pandiwa.
theological_decisions:
- issue: Kung ang προσεκύνησεν ay dapat isaling tahasan bilang pagsamba kay Jesus
  choice: nagpatirapa sa harap niya
  alternative: sumamba sa kanya; nagbigay-galang sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagsamba o sa pagpapatirapa bilang pagpugay. Pinananatili ng pangunahing salin ang nakikitang kilos at ang tunay na teolohikal na tensiyon, habang inilalahad sa talababa ang ibang posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “nagpatirapa” upang ilarawan ang pisikal na kilos at hindi agad ipasya ang eksaktong teolohikal na diwa ng προσκυνέω.
