id: MRK.5.2
reference: Mark 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: tl
  text: Pagkababa niya sa bangka, agad lumabas mula sa mga libingan ang isang lalaking may maruming espiritu[a] at sumalubong sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sinasapian ng maruming espiritu.” Mas literal sa Griyego ang “may maruming espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: Pagkababa niya sa bangka
  rationale: Ang genitive absolute na may aorist participle ay likas na isinalin bilang sugnay na panahunan. Ang “pagkababa” ang karaniwang Filipino para sa paglabas mula sa isang bangka.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang mabilis at masiglang daloy ng salaysay ni Marcos sa natural at maikling Filipino.
- source_word: ὑπήντησεν αὐτῷ
  choice: sumalubong sa kanya
  rationale: Tumpak na ipinapahayag ng “sumalubong” ang kilos ng paglapit upang makatagpo siya, at mas buhay ito kaysa sa payak na “nakipagkita.”
- source_word: ἐκ τῶν μνημείων
  choice: lumabas mula sa mga libingan
  rationale: Ang μνημεῖον ay libingan o puntod. Ang “lumabas mula” ay malinaw na nag-uugnay sa pinanggalingan ng lalaki at sa paglapit niya kay Jesus.
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Bagaman maaaring mangahulugang tao ang ἄνθρωπος, lalaki ang tinutukoy sa konteksto at malinaw itong ipinahihiwatig ng kasunod na salaysay.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: may maruming espiritu
  rationale: Malapit ito sa anyong Griyego at pinananatili ang konsepto ng karumihan nang hindi agad ipinapasok sa pangunahing teksto ang mas interpretatibong “sinasapian.”
theological_decisions:
- issue: Paglalarawan sa kalagayan ng lalaking kaugnay ng espiritu
  choice: may maruming espiritu
  alternative: sinasapian ng maruming espiritu
  rationale: Ang Griyego ay κυριολεκτικά “nasa/may maruming espiritu.” Pinananatili ng pangunahing salin ang paraan ng pagkakasabi ng teksto at iniiwasang lutasin nang higit sa sinabi ng talata ang uri ng pagkontrol ng espiritu sa lalaki.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at pasalaysay. Ginamit ang “bangka,” “mga libingan,” at “sumalubong” bilang karaniwang salitang madaling maunawaan, habang pinanatili ang “maruming espiritu” upang huwag mawala ang diwa ng ἀκάθαρτος.
