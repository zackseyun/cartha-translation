  source_fidelity: Tumpak na naipapahayag ng salin ang genitive absolute na temporal (“Pagkababa niya sa bangka”), ang biglaang kilos ng εὐθύς (“agad”), at ang paglabas ng lalaki mula sa mga libingan upang salubungin si Jesus. Ang “may maruming espiritu” ay malapit sa ἐν πνεύματι ἀκαθάρτῳ at hindi nagpapasok ng mas tiyak na interpretasyong wala sa pangunahing pahayag ng talata.
  naturalness: Likas at malinaw ang daloy sa makabagong Filipino. Ang “Pagkababa niya sa bangka” at “sumalubong sa kanya” ay angkop sa pasalaysay na rehistro. Ang “maruming espiritu” ay bahagyang mas literal kaysa karaniwang kolokyal na gamit, ngunit angkop ito sa biblikal at teolohikal na terminolohiya.
  terminology: Wasto at magkakatugma ang “bangka,” “mga libingan,” “lalaki,” at “maruming espiritu.” Maayos na inihihiwalay ng talababa ang alternatibong “sinasapian,” nang hindi ito ipinipilit bilang pangunahing salin.
