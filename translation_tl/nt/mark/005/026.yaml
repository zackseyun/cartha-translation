  terminology: Ang “manggagamot” ay angkop na marangal at modernong katumbas ng ἰατρός. Ang “wala siyang napakinabangan” ay tapat na katumbas ng ὠφεληθεῖσα at hindi nagdaragdag ng isang tiyak na resulta ng paggamot.
