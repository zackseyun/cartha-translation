  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: tl
  text: Marami siyang tiniis sa ilalim ng pangangalaga ng maraming manggagamot[a], at nagugol niya ang lahat ng mayroon siya[b], ngunit wala siyang napakinabangan; sa halip, lalo pa siyang lumubha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mula sa maraming manggagamot” o “sa kamay ng maraming manggagamot.” Maaaring idiin ng Griyego ang mga manggagamot bilang sanhi o ang pagdaan niya sa kanilang mga paggamot.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lahat ng mga bagay na mula sa kanya,” ibig sabihin, lahat ng mayroon siya o nasa kanyang magagamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: Marami na siyang tiniis
  rationale: Ipinahahayag ng aorist participle ang matinding pagdurusang naranasan na niya bago ang kasalukuyang tagpo; natural at hindi pinalalabis ng saling ito ang πάσχω.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: sa pagpapagamot sa maraming manggagamot
  rationale: Maaaring tukuyin ng ὑπό na may genitive ang mga manggagamot bilang pinagmulan o tagapamagitan ng pagdurusa. Iniuugnay ito ng salin sa mga paggamot nang hindi tahasang ipinapalagay na sinadya nilang pahirapan siya.
- source_word: δαπανήσασα
  choice: naubos na niya
  rationale: Bagaman ang pandiwa ay pangunahing nangangahulugang gumugol, nililinaw ng kasunod na τὰ παρ’ αὐτῆς πάντα na ginugol niya ang lahat ng nasa kanya; ang 'naubos na niya' ay natural sa konteksto.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: ang lahat ng kanyang ari-arian
  rationale: Ipinakikita ng parirala ang kabuuan ng mga pag-aari o yamang magagamit niya. Malinaw sa modernong Filipino ang 'lahat ng kanyang ari-arian.'
- source_word: μηδὲν ὠφεληθεῖσα
  choice: ngunit hindi siya gumaling
  rationale: Ang passive participle ay nagsasabing wala siyang natamong pakinabang. Sa konteksto ng sakit at paggamot, natural na ipinahahayag ito bilang hindi paggaling.
- source_word: ἀλλὰ μᾶλλον
  choice: sa halip, lalo pang
  rationale: 'Pinananatili nito ang masidhing pagsalungat: hindi lamang walang pakinabang, kundi kabaligtaran ang nangyari.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: lumubha ang kanyang kalagayan
  rationale: Natural na katumbas ito ng idyomang Griyego na literal na tumutukoy sa pagdating sa mas masamang kalagayan.
