  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: tl
  text: Sapagkat sinasabi niya, “Kung mahipo ko kahit ang damit niya, gagaling ako.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, maaari ring isalin na “maliligtas ako.” Ang pandiwa ay maaaring mangahulugang “maligtas,” “gumaling,” o “mapagaling”; sa kontekstong ito, pisikal na paggaling ang pangunahing tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sinasabi niya noon
  rationale: Pinananatili ng aspektong imperpektibo ang patuloy o paulit-ulit na pagsasabi sa nakaraan nang hindi ipinapalagay kung binigkas niya ito nang malakas o sinabi sa sarili.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nitong paliwanag ang pangungusap sa naunang kilos sa salaysay.
- source_word: ὅτι
  choice: tuwirang sipi
  rationale: Ipinakikilala nito ang nilalaman ng sinasabi niya; likas sa Tagalog ang tuwirang sipi rito.
- source_word: Ἐὰν ἅψωμαι
  choice: Mahipo ko
  rationale: Ang kondisyonal na anyo ay likas na naipahahayag sa Tagalog sa pariralang ito; ang ἅπτω ay nangangahulugang humipo sa kontekstong ito.
- source_word: κἂν
  choice: lamang kahit
  rationale: 'Pinananatili ang diwang minimisasyon: sapat na sa kaniya na mahipo kahit ang damit lamang ni Jesus.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: ang damit niya
  rationale: Bagaman maramihan sa Griyego, ang “damit” ay natural na kolektibong katawagan sa modernong Tagalog at hindi labis na tumutukoy sa isang partikular na kasuotan.
- source_word: σωθήσομαι
  choice: gagaling ako
  rationale: Ang agarang konteksto ay paggaling mula sa pagdurugo. Gayunman, saklaw rin ng pandiwang Griyego ang “maliligtas,” kaya pinanatili ang mas malawak na kahulugan sa talababa.
theological_decisions:
- issue: Kahulugan ng σωθήσομαι sa salaysay ng pagpapagaling
  choice: gagaling ako
  alternative: maliligtas ako / mapapabuti ako
  rationale: Malinaw na pisikal na paggaling ang inaasahan ng babae, kaya “gagaling” ang pinakanatural sa pangunahing teksto. Hindi naman inaalis ang posibleng ugnayan ng paggaling at pagliligtas, sapagkat inilalahad sa talababa ang lawak ng kahulugan ng salitang Griyego.
translation_notes:
  register: Modernong Filipino na may dignidad at likas na daloy. Ginamit ang “damit” bilang pangkaraniwang kolektibong katawagan at “sinasabi niya noon” upang maipahiwatig ang aspektong imperpektibo nang hindi labis na nagpapakahulugan.
