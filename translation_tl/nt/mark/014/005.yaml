revisions:
- from: Sapagkat maipagbibili sana ang pabangong langis na ito nang mahigit sa tatlong daang denario at maibibigay ang salapi sa mga dukha.” At pinagalitan nila nang matindi ang babae.[a][b]
  to: Sapagkat puwede sanang maipagbili ang pabangong langis na ito nang mahigit sa tatlong daang denario at maibigay sa mga mahihirap.” At pinagalitan nila nang matindi ang babae.[a][b]
  rationale: Inalis ang hindi tahasang “ang salapi” upang huwag magdagdag ng bagay na wala sa Griego, at inayos ang pananda ng hindi natupad na posibilidad sa mas natural na modernong Filipino. Pinalitan ang “mga dukha” ng “mga mahihirap” para sa mas karaniwang modernong gamit. Napanatili ang lakas ng pagsaway, ang makasaysayang “denario,” at ang dalawang wastong footnote anchor.
