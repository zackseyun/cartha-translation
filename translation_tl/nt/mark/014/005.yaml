base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: tl
  text: Sapagkat puwede sanang maipagbili ang pabangong langis na ito nang mahigit sa tatlong daang denario at maibigay sa mga mahihirap.” At pinagalitan nila nang matindi ang babae.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabangong pamahid” para sa “pabangong langis.”
    reason: lexical_alternative
  - marker: b
    text: O “mariin nilang sinaway ang babae.” Ipinahihiwatig ng pandiwang Griego ang matinding pagkainis o mahigpit na pagsaway.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: pabangong langis
  rationale: Tumutukoy ito sa mabangong langis o pamahid. Likas at malinaw sa modernong Filipino ang “pabangong langis” at angkop sa mamahaling aromatikong sangkap sa konteksto.
- source_word: πραθῆναι
  choice: maipagbibili sana
  rationale: Ang aorist passive infinitive kasunod ng ἠδύνατο ay nagpapahayag ng posibilidad na hindi naisakatuparan; natural itong ipinapahayag sa Filipino sa pamamagitan ng “maipagbibili sana.”
- source_word: ἐπάνω
  choice: nang mahigit sa
  rationale: Kasama ng genitive na halaga, ipinahihiwatig nito ang halagang lampas sa binanggit na bilang.
- source_word: δηναρίων τριακοσίων
  choice: tatlong daang denario
  rationale: Pinananatili ang makasaysayang yunit ng salapi sa halip na tumbasan ito ng modernong pera.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: maibibigay ang salapi sa mga dukha
  rationale: Bagaman literal na “maibibigay sa mga dukha,” malinaw sa sintaks at konteksto na ang maibibigay ay ang napagbentahan. Ang pagbanggit sa “salapi” ay natural sa Filipino at iniiwasan ang maling impresyong ang langis mismo ang ibibigay.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: pinagalitan nila nang matindi ang babae
  rationale: Ang pandiwa ay naghahayag ng matinding pagkainis at mariing pagsaway na tuwirang ibinunton sa babae; pinananatili ng salin ang lakas ng pananalita.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinakikita nito na ang pangungusap ay dahilan ng naunang reklamo.
- source_word: ἠδύνατο
  choice: maipagbibili sana
  rationale: Ipinapahayag ng imperfect ng δύναμαι ang isang posibilidad na hindi natupad; ang “sana” ay likas na panandang Filipino para rito.
