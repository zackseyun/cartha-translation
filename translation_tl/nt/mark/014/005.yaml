  terminology: Ang “pabangong langis” ay angkop para sa μύρον; ang “denario” ay wastong pagpapanatili ng sinaunang yunit ng salapi. Ang “mahigpit na pagsaway” at “pinagalitan nila nang matindi” ay sapat na naglalahad ng mariing puwersa ng ἐνεβριμῶντο.
