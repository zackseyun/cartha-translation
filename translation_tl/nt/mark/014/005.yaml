translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “mga dukha” bilang maikli at dignidad-preserving na pagtukoy sa mga taong salat, at “denario” upang mapanatili ang makasaysayang tagpuan.
