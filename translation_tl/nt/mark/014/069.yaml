  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: tl
  text: At nang makita siya ng babaeng lingkod, muli siyang nagsimulang magsabi sa mga nakatayo roon[a], “Ang taong ito ay isa sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga naroon” o “sa mga nakatayo sa paligid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: alilang babae
  rationale: Tumutukoy ito sa isang batang babae o babaeng alipin/lingkod. Pinananatili ng “alilang babae” ang kalagayan niya bilang lingkod nang hindi gumagamit ng makalumang pananalita.
- source_word: ἰδοῦσα αὐτόν
  choice: nang makita siya
  rationale: Likas sa salaysay na Tagalog ang sugnay na may “nang,” at malinaw na si Pedro ang nakita ng babae.
- source_word: ἤρξατο πάλιν λέγειν
  choice: muli itong nagsimulang magsabi
  rationale: Pinananatili kapwa ang panimulang aspekto ng ἤρξατο at ang pag-uulit na ipinahihiwatig ng πάλιν.
- source_word: τοῖς παρεστῶσιν
  choice: sa mga nakatayo roon
  rationale: Ipinapahayag nito ang mga taong naroon at nakatayo sa paligid; pinananatili rin ang konkretong larawang nasa Griyego.
- source_word: Οὗτος
  choice: Ang taong ito
  rationale: Tahasang itinuturo ng demonstratibo si Pedro. Natural sa Tagalog ang pagdaragdag ng “tao” at hindi ito nagdaragdag ng mapanlait na himig.
- source_word: ἐξ αὐτῶν ἐστιν
  choice: ay isa sa kanila
  rationale: Ito ang natural na Tagalog para sa pagiging kabilang sa grupong tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ito” upang malinaw na bumalik ang paksa sa alilang babae, at pinanatili ang tuwirang paratang tungkol kay Pedro.
