id: MRK.14.41
reference: Mark 14:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: tl
  text: Dumating siya sa ikatlong pagkakataon at sinabi sa kanila, “Natutulog pa rin ba kayo at nagpapahinga?[a] Tama na![b] Dumating na ang oras. Tingnan ninyo, ibinibigay na ang Anak ng Tao sa mga kamay ng mga makasalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Matulog pa kayo at magpahinga.” Maaaring unawain ang pananalitang Griyego bilang isang mapait o mapagparayang utos, o bilang retorikal na tanong. Ang τὸ λοιπὸν ay maaari ring literal na tumukoy sa “natitirang panahon.”'
    reason: alternative_reading
  - marker: b
    text: Mahirap tiyakin ang kahulugan ng pananalitang isinaling “Tama na!” Maaari rin itong isalin na “Sapat na.” Iminumungkahi rin ng ilan ang komersiyal na diwang “bayad na nang buo,” ngunit hindi iyon gaanong malamang sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Dumating siya sa ikatlong pagkakataon
  rationale: Ginamit ang likas na salaysay na nagdaan sa Tagalog; malinaw na ipinahihiwatig ng τὸ τρίτον na ito ang ikatlong pagdating niya sa mga alagad.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Natutulog pa rin ba kayo at nagpapahinga?
  rationale: Likas itong mabasa bilang isang pasaway na retorikal na tanong sa konteksto. Dahil maaari ring unawain ang mga anyo bilang mapait o mapagparayang utos, pinanatili sa talababa ang tunay na kalabuan.
- source_word: ἀπέχει
  choice: Tama na!
  rationale: Maikli at natural na katumbas ng mahirap na idyomang Griyego sa biglang paglipat ng tagpo. Hindi nito ipinapasok ang mas haka-hakang komersiyal na kahulugan.
- source_word: ἦλθεν ἡ ὥρα
  choice: Dumating na ang oras
  rationale: Pinananatili ng “oras” ang larawan ng itinakdang sandali at ang teolohikal na alingawngaw ng parirala.
- source_word: ἰδοὺ
  choice: Tingnan ninyo
  rationale: Makabago at malinaw na panawag-pansin sa maramihang kausap, nang hindi gumagamit ng makalumang pananalita.
- source_word: παραδίδοται
  choice: ibinibigay na
  rationale: Pinananatili ang malawak na diwa ng pagpapasa o pagbibigay sa kapangyarihan ng iba, sa halip na paliitin agad ito sa pagtataksil ni Judas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Karaniwang salin ng katawagang ito na nagpapanatili sa anyong titulo at sa ugnayan nito sa mas malawak na biblikal na gamit.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: sa mga kamay ng mga makasalanan
  rationale: Pinananatili ang kongkretong idyoma ng paglalagay sa kapangyarihan ng mga makasalanan.
theological_decisions:
- issue: Lakas ng Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: 'Retorikal na pagsaway: “Natutulog pa rin ba kayo at nagpapahinga?”'
  alternative: 'Mapait o mapagparayang pahayag/utos: “Matulog pa kayo at magpahinga.”'
  rationale: Hindi tiyak sa pinakamaagang tekstong Griyego ang bantas, at maaaring unawain ang mga pandiwa bilang tanong o bilang ironikong pahintulot. Pinili sa teksto ang mas likas na pagbasa sa agarang konteksto ngunit iniingatan sa talababa ang alternatibo.
- issue: Kahulugan ng ἀπέχει
  choice: “Tama na!”
  alternative: “Sapat na,” o, mas di-malamang rito, isang komersiyal na diwa gaya ng “bayad na nang buo.”
  rationale: Ang maikling pahayag ng paghinto ay akma sa pagdating ng takdang oras nang hindi ipinapasok ang isang teknikal at mapagtatalunang pakahulugan.
- issue: Saklaw ng παραδίδοται
  choice: “ibinibigay na”
  alternative: “ipinagkakanulo na” o “ipinauubaya na”
  rationale: Hindi nililimitahan ng salin ang ahensiya kay Judas lamang at pinananatili ang mas malawak na diwa ng pag-abot sa kapangyarihan ng iba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kayo/ninyo” para sa maramihang kausap at iniwasan ang makalumang “narito” o ang mas makitid na “ipinagkakanulo” kung saan mas malawak ang pandiwang Griyego.
