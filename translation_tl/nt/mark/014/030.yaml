id: MRK.14.30
reference: Mark 14:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: tl
  text: 'At sinabi sa kanya ni Jesus, “Tinitiyak ko sa iyo: ngayong araw—sa mismong gabing ito—bago tumilaok nang dalawang beses ang isang tandang, tatlong beses mo akong ikakaila.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa salaysay na Tagalog ang pangnagdaang “sinabi”; hindi kailangang gayahin ang aspekto ng Griyego kung magiging pilit ang Filipino.
- source_word: Ἀμὴν λέγω σοι
  choice: Tinitiyak ko sa iyo
  rationale: Ipinahahayag nito ang taimtim at makapangyarihang panimulang pormula ni Jesus sa natural na modernong Tagalog, nang hindi ginagamit ang “Amen” bilang di-karaniwang pambungad sa pangungusap.
- source_word: σήμερον · ταύτῃ τῇ νυκτί
  choice: ngayong araw—sa mismong gabing ito—
  rationale: Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na pahayag ng panahon at ang kanilang diin.
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: bago tumilaok nang dalawang beses ang isang tandang
  rationale: Natural na Filipino ang “tumilaok” para sa tinig ng tandang; pinananatili ang mahalagang bilang na dalawang beses at ang di-tiyak na pagtukoy sa tandang.
- source_word: τρίς με ἀπαρνήσῃ
  choice: tatlong beses mo akong ikakaila
  rationale: Ang “ikakaila” ay malinaw at nakaugat na katumbas ng pagtanggi o pagtatwa sa pagkakilala at kaugnayan kay Jesus; pinananatili rin ang diin sa bilang.
theological_decisions:
- issue: Pagsasama ng σήμερον at ταύτῃ τῇ νυκτί
  choice: 'Panatilihin ang dalawa: “ngayong araw—sa mismong gabing ito—”'
  alternative: Pagsamahin lamang bilang “ngayong gabi”
  rationale: Kapuwa tahasang nasa Griyego ang mga parirala at nagpapatingkad sa agarang katuparan ng sinabi; hindi dapat alisin ang isa.
- issue: Historical present na λέγει
  choice: Isalin bilang “sinabi”
  alternative: “sinasabi”
  rationale: Ang historical present ay estilong pasalaysay sa Griyego. Sa modernong Tagalog, mas natural at marangal ang pangnagdaang anyo rito, habang nananatili ang mismong kahulugan ng kilos.
- issue: Saklaw ng ἀπαρνέομαι
  choice: “ikakaila”
  alternative: “itatatwa” o “ipagkakaila”
  rationale: Hindi nililinaw nang higit sa teksto kung ang pagkakaila ay pagtanggi sa pagkakilala, ugnayan, o katapatan; ang “ikakaila” ay sapat na malawak upang mapanatili ang saklaw.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang gitling na em upang malinaw na maipakita na ang “sa mismong gabing ito” ay nagbibigay-diin sa “ngayong araw.” Walang kinakailangang talababa sa talatang ito.
