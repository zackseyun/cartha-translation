  source_fidelity: 'Tapat ang salin sa pangunahing diwa at mga detalye ng Griyego: ang taimtim na pahayag, ang dalawang pahayag ng panahon (σήμερον at ταύτῃ τῇ νυκτί), ang dalawang tilaok, at ang tatlong pagkakaila. Ang nakaraang-panahong “sinabi” ay isang katanggap-tanggap at likas na pagsasaayos ng historical present na λέγει sa modernong Tagalog.'
  naturalness: Natural, malinaw, at marangal ang daloy sa modernong Filipino Tagalog. Ang “tumilaok nang dalawang beses ang isang tandang” at “tatlong beses mo akong ikakaila” ay idiomatiko at madaling unawain. Ang mga gitling ay epektibong nagbibigay-diin sa agarang panahon nang hindi nagdaragdag ng kahulugan.
