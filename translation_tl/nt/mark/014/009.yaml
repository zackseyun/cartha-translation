id: MRK.14.9
reference: Mark 14:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: tl
  text: Tunay na sinasabi ko sa inyo, saanman ipahayag ang mabuting balita[a] sa buong mundo, isasalaysay din ang ginawa ng babaeng ito bilang pag-alaala sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ebanghelyo.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “bilang isang alaala sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Tunay
  rationale: Naghuhudyat ito ng isang taimtim at makapangyarihang pahayag. Likas sa makabagong Tagalog ang “Tunay” at naihahatid nito ang diin nang hindi iniiwan ang salitang Semitiko na hindi isinalin.
- source_word: δὲ
  choice: '[ipinahihiwatig sa daloy ng pangungusap]'
  rationale: Banayad na pang-ugnay ang δέ; hindi kailangan ng tahasang katumbas sa Tagalog sa bahaging ito.
- source_word: λέγω ὑμῖν
  choice: sinasabi ko sa inyo
  rationale: Tuwiran at likas na pahayag sa Tagalog na pinananatili ang tahasang pakikipag-usap at taimtim na tono.
- source_word: ὅπου ἐὰν
  choice: saanman
  rationale: 'Maikli at tumpak nitong ipinahahayag ang di-tiyak ngunit pangkalahatang saklaw: sa alinmang lugar na mangyari ang pagpapahayag.'
- source_word: κηρυχθῇ
  choice: ipahayag
  rationale: Ipinakikita nito ang hayagan at pampublikong pagpapahayag nang hindi nililimitahan ang gawain sa isang pormal na sermon.
- source_word: τὸ εὐαγγέλιον
  choice: ang mabuting balita
  rationale: Tuwirang ipinahahayag ang diwa ng εὐαγγέλιον sa malinaw at kasalukuyang Tagalog. Inilalagay sa talababa ang tradisyonal na terminong “ebanghelyo.”
- source_word: εἰς ὅλον τὸν κόσμον
  choice: sa buong mundo
  rationale: Natural na Tagalog ito para sa malawak at pangkalahatang saklaw ng parirala.
- source_word: καὶ
  choice: din
  rationale: Ipinakikita ang karagdagang mangyayari kasabay ng pagpapahayag ng mabuting balita.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ang ginawa ng babaeng ito
  rationale: Babaeng tinutukoy sa agarang konteksto ang pambabaeng demonstratibong αὕτη. Nililinaw ng “babaeng ito” ang reperente nang walang idinadagdag na bagong interpretasyon.
- source_word: λαληθήσεται
  choice: isasalaysay
  rationale: Naihatid nito na ang kanyang ginawa ay bibigkasin at ipapasa bilang bahagi ng salaysay tungkol sa mabuting balita. Ang balintiyak at panghinaharap na diwa ay napapanatili.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: bilang pag-alaala sa kanya
  rationale: Malinaw at natural na ipinahahayag nito ang layunin o memorial na bisa ng pagsasalaysay, habang pinananatili sa talababa ang mas kongkretong alternatibong “bilang isang alaala sa kanya.”
theological_decisions:
- issue: Paglalarawan sa εὐαγγέλιον sa pahayag tungkol sa pandaigdigang pagpapahayag
  choice: ang mabuting balita
  alternative: ang ebanghelyo
  rationale: Pinili ang malinaw na kahulugan ng salitang Griyego para madaling maunawaan ng karaniwang mambabasa, ngunit pinanatili sa talababa ang nakaugaliang terminong Kristiyano. Walang denominasyonal na pakahulugan ang ipinapasok.
- issue: Tahasang pagkilala sa αὕτη bilang babae
  choice: ang ginawa ng babaeng ito
  alternative: ang ginawa niya / ang ginawa ng isang ito
  rationale: Pambabaeng isahan ang anyong Griyego at malinaw na tumutukoy sa babae sa agarang salaysay. Ang tahasang pangngalan ay nagbibigay-linaw nang hindi lumalampas sa konteksto.
- issue: Ugnayan ng pagsasalaysay sa μνημόσυνον αὐτῆς
  choice: bilang pag-alaala sa kanya
  alternative: bilang isang alaala sa kanya
  rationale: Pinananatili ng pangunahing salin ang ideya ng paggunita, samantalang ang talababa ay nagpapakita ng mas literal na pangngalang anyo. Hindi tinutukoy nang higit sa Griyego ang eksaktong ritwal o paraan ng pag-alaala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Tunay na sinasabi ko sa inyo” upang mapanatili ang taimtim na pormula, at “isasalaysay” upang maging likas ngunit sapat na pormal. Inilagay ang bawat pananda ng talababa kaagad sa salitang o pariralang tinutukoy nito.
