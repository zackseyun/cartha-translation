  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: tl
  text: 'Ngunit may ilang nagalit at nag-usap-usap[a]: “Bakit nagkaroon ng ganitong pag-aaksaya ng pabangong langis[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isa’t isa” o “sa kanilang kalooban.” Maaaring tumukoy ang pariralang Griyego sa pagrereklamo nila sa loob ng pangkat o sa reaksiyon ng bawat isa sa kanyang sarili.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mabangong pamahid.” Ang Griyegong μύρον ay tumutukoy sa mabangong langis o pamahid.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ngunit may ... na
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat ng reaksiyon ng ilan sa ginawa ng babae; natural itong naipapahayag ng “Ngunit” sa Filipino.
- source_word: τινες
  choice: ilan
  rationale: Pinananatili nito ang di-tiyak na bilang at pagkakakilanlan ng mga tumutol.
- source_word: ἀγανακτοῦντες
  choice: nagalit
  rationale: Ipinahahayag nito ang matinding pagkayamot o galit na may kasamang paghatol, sa paraang malinaw sa karaniwang mambabasa.
- source_word: πρὸς ἑαυτούς
  choice: nag-usap-usap
  rationale: Sa konteksto ng kasunod na tuwirang pahayag, natural nitong ipinakikita na ang reaksiyon ay ipinahayag sa loob ng pangkat. Inilalagay sa talababa ang tunay na posibilidad na tumukoy rin ito sa panloob na reaksiyon.
- source_word: Εἰς τί
  choice: Bakit
  rationale: Ito ang natural na katumbas sa Filipino ng idyomatikong tanong tungkol sa layunin o dahilan.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ganitong pag-aaksaya
  rationale: Sa konteksto, ang ἀπώλεια ay tumutukoy sa itinuring nilang pag-aaksaya ng mamahaling sangkap; pinananatili ng “ganitong” ang demonstratibong αὕτη.
- source_word: τοῦ μύρου
  choice: sa pabangong langis
  rationale: Ang μύρον ay mabangong langis o pamahid. Ang “pabangong langis” ay malinaw at tumpak nang hindi ipinapalagay na katulad ito ng modernong likidong pabango.
- source_word: γέγονεν
  choice: nagkaroon
  rationale: Natural nitong naipapahayag ang pangyayaring naganap na at ngayo'y pinupuna ng mga nagsasalita.
