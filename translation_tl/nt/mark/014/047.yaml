  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: tl
  text: Ngunit binunot ng isa sa mga nakatayo roon ang kanyang espada, hinampas ang alipin[a] ng punong pari, at tinagpas ang tainga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lingkod.” Ang salitang Griyego ay δοῦλος.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Ngunit ... ng isa
  rationale: Ipinahahayag ang banayad na pagsalungat o pagpapatuloy ng δέ at pinananatiling hindi tiyak ang pagkakakilanlan ng isang tao sa pangkat.
- source_word: τῶν παρεστηκότων
  choice: sa mga nakatayo roon
  rationale: Pinananatili ang larawan ng mga taong nakatayo at naroroon sa mismong tagpo; likas ito sa modernong Filipino.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: binunot ... ang kanyang espada
  rationale: Sa konteksto, ang σπάομαι ay paglabas o pagbunot ng sandata. Ang possessive na “kanyang” ay natural sa Filipino kahit artikulo ang nasa Griyego.
- source_word: ἔπαισεν
  choice: tinaga
  rationale: Sa kasunod na pagkatagpas ng tainga gamit ang espada, mas tiyak at natural ang “tinaga” kaysa sa pangkalahatang “hinampas,” nang hindi nagdaragdag ng detalye mula sa ibang salaysay.
- source_word: τὸν δοῦλον
  choice: ang alipin
  rationale: Pinananatili ng “alipin” ang katayuang panlipunan at ugnayang pagpapasakop na ipinahihiwatig ng δοῦλος; inilalagay sa talababa ang mas malambot na alternatibong “lingkod.”
- source_word: τοῦ ἀρχιερέως
  choice: ng pinakapunong pari
  rationale: Ang “pinakapunong pari” ay malinaw at dignidad na katumbas ng ἀρχιερεύς sa kontekstong Judio.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: natagpas ang tainga nito
  rationale: Ipinahahayag ng “natagpas” ang marahas na resulta ng ἀφαιρέω sa konteksto. Hindi pinananatili ang diminutibong anyo ng ὠτάριον, at hindi idinaragdag ang “kanan,” na wala sa Marcos.
theological_decisions:
- issue: Pagpapakahulugan sa δοῦλος bilang katayuang panlipunan
  choice: alipin
  alternative: lingkod
  rationale: Sa ugnayan sa sambahayan o institusyon ng pinakapunong pari, mas tuwirang pinananatili ng “alipin” ang posibilidad ng pag-aari at sapilitang pagpapasakop kaysa sa “lingkod,” nang hindi nagpapasok ng denominasyonal na pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignidad, at madaling maunawaan. Ginamit ang “espada,” “tinaga,” at “natagpas” upang malinaw na maipakita ang sunod-sunod na kilos, habang pinananatiling hindi pinangalanan ang gumawa at hindi nagdaragdag ng detalyeng mula sa mga kapantay na salaysay.
