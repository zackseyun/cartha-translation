  source_fidelity: Tumpak ang pangunahing daloy ng kilos at ang di-pagpapangalan sa taong bumunot ng espada. Gayunman, ang pandiwang balintiyak na “natagpas” ay hindi malinaw na itinatali sa kilos ng paksa, samantalang aktibo ang ἀφεῖλεν (“inalis/itinagpas niya”). Ang “hinampas” ay mas malapit sa pangkalahatang ἔπαισεν kaysa “tinaga,” na nagsasaad na agad ng paghiwa.
  naturalness: 'Likas sa modernong Tagalog ang binagong pagkakasunod: “hinampas ... at tinagpas ang tainga nito.” Mas malinaw nitong ipinakikita na iisang tao ang gumawa ng dalawang kilos.'
  terminology: Ang “alipin” ay angkop para sa δοῦλος at ang “punong pari” ay malinaw na katumbas ng ἀρχιερεύς. Hindi kailangan ang “pinaka-,” na maaaring magmukhang hindi kinakailangang superlatibo sa modernong Tagalog.
