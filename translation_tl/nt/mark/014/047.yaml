  - severity: low
    issue: Mas natural ang “punong pari” kaysa “pinakapunong pari.”
    rationale: Sapat na ang karaniwang terminong “punong pari” para sa natatanging ἀρχιερεύς; hindi hinihingi ng Griyego ang anyong superlatibo.
