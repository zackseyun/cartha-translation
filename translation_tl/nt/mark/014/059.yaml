  text: καὶ οὐδὲ οὕτως ἴση ἦν ἡ μαρτυρία αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: tl
  text: At kahit sa ganitong paraan, hindi nagkakatugma ang kanilang patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nagkakasundo”; mas literal, “hindi pantay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang karaniwang pang-ugnay at ang tuloy-tuloy na daloy mula sa naunang salaysay.
- source_word: οὐδὲ
  choice: kahit ... hindi
  rationale: Likas na ipinahahayag sa Filipino ang mariing pagtanggi na may diwang “not even,” nang hindi dinaragdagan ang kahulugan.
- source_word: οὕτως
  choice: sa ganitong paraan
  rationale: Tumutukoy pabalik sa paraang ginamit sa kalalapit na patotoo o paratang.
- source_word: ἴση
  choice: nagkakatugma
  rationale: Bagaman literal na “pantay,” sa kontekstong legal tumutukoy ito sa hindi pagkakatugma ng patotoo ng mga saksi.
- source_word: ἦν
  choice: nagkakatugma
  rationale: Ang imperfect ng εἰμί kasama ng panaguring ἴση ay likas na naipapahayag sa Filipino bilang pandiwang nasa aspektong di-ganap.
- source_word: ἡ μαρτυρία
  choice: ang ... patotoo
  rationale: Ang isahang anyo ay pinananatili bilang kolektibong patotoo sa kontekstong legal.
- source_word: αὐτῶν
  choice: kanilang
  rationale: Likas na salin ng genitive plural na nagsasaad ng pagmamay-ari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kolektibong isahan na “patotoo,” habang ginamit ang “nagkakatugma” upang ihayag ang diwa ng ἴση sa konteksto ng magkakaibang saksi.
