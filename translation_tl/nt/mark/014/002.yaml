base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: tl
  text: Sapagkat sinasabi nila, “Huwag sa panahon ng kapistahan, baka magkagulo ang mga tao[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baka magkaroon ng kaguluhan sa gitna ng mga tao.” Maaaring ipahiwatig ng anyong Griyego na ang kaguluhan ay magmumula sa mga tao o mangyayari sa gitna nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sinasabi nila
  rationale: Ipinahihiwatig ng aspektong imperpekto ang nagpapatuloy o inuulit na pagsasalita; natural itong naipahahayag sa Filipino sa pamamagitan ng “sinasabi nila” nang hindi ipinipilit na tiyak na paulit-ulit iyon.
- source_word: γάρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag kaugnay ng naunang pahayag. Pinananatili ng “Sapagkat” ang lohikal na ugnayan sa marangal at karaniwang gamit.
- source_word: Μὴ
  choice: Huwag
  rationale: Pinaikli sa Griyego ang ipinagbabawal na kilos, na nauunawaan mula sa naunang konteksto. Natural sa Filipino ang “Huwag” bilang maikli ring pagsalungat sa panukala.
- source_word: ἐν τῇ ἑορτῇ
  choice: sa panahon ng kapistahan
  rationale: Temporal ang gamit ng ἐν dito. Ang “sa panahon ng kapistahan” ay malinaw na tumutukoy sa loob ng panahong ipinagdiriwang ang kapistahan, hindi lamang sa isang lugar o pagtitipon.
- source_word: μήποτε
  choice: baka
  rationale: Ipinakikilala nito ang kinatatakutang maaaring mangyari. Ang “baka” ang natural at maikli nitong katumbas sa modernong Filipino.
- source_word: ἔσται θόρυβος
  choice: magkagulo
  rationale: Ang θόρυβος ay maingay na kaguluhan o pampublikong ligalig. Ang “magkagulo” ay natural sa Filipino at hindi nagpapalabis na tiyak na magkakaroon ng ganap na pag-aalsa.
- source_word: τοῦ λαοῦ
  choice: ang mga tao
  rationale: Kolektibo ang λαός at tumutukoy rito sa karamihan. Sa pariralang “magkagulo ang mga tao,” maaaring maunawaan na ang kaguluhan ay magmumula sa kanila o mangyayari sa gitna nila; itinatala sa talababa ang tunay na saklaw ng Griyegong genitive.
