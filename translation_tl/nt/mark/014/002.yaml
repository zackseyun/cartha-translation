translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang maikling anyo ng kanilang sinabi at ang nagpapatuloy na aspekto ng ἔλεγον. Ginamit ang “kapistahan” sa halip na mas tiyak na pangalan sapagkat malinaw na iyon sa konteksto, at hindi dinagdagan ang talata ng impormasyong wala rito.
