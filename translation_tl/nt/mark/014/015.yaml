  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: tl
  text: At siya mismo ang magpapakita sa inyo ng isang malaking silid sa itaas na nakaayos at handa na.[a] Maghanda kayo roon para sa atin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaking silid sa itaas na may mga nakalatag at handa na.” Ang ἐστρωμένον ay maaaring tumukoy sa silid na nalatag o nakaayos para gamitin, hindi lamang sa pagkakaroon nito ng mga kagamitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: siya mismo
  rationale: Pinananatili nito ang diin ng tahasang panghalip sa Griyego, habang natural pa rin sa makabagong Filipino.
- source_word: δείξει
  choice: magpapakita
  rationale: Likas na katumbas ito ng panghinaharap na anyo ng δείκνυμι; malinaw na ipinahihiwatig ng parirala ang pagpapakita ng silid sa mga alagad.
- source_word: ἀνάγαιον μέγα
  choice: isang malaking silid sa itaas
  rationale: Tumutukoy ang ἀνάγαιον sa silid sa itaas na bahagi ng bahay, at tuwirang inilalarawan ito ng μέγα bilang malaki.
- source_word: ἐστρωμένον
  choice: may mga kagamitan
  rationale: Ipinahihiwatig ng participle ang isang silid na nalalatagan o nakaayos para gamitin, malamang na may mga kagamitan para sa pagkain. Nililinaw ng talababa ang mas malawak na posibilidad na ‘nakaayos.’
- source_word: ἕτοιμον
  choice: nakahanda na
  rationale: Pinananatili nito ang kahulugang handa na ang silid at iniiwasang pag-isahin ang paglalarawan sa silid at ang kasunod na utos na maghanda.
- source_word: ἐκεῖ
  choice: doon
  rationale: Ito ang payak at likas na katumbas ng pang-abay na tumutukoy sa lugar.
- source_word: ἑτοιμάσατε
  choice: kayo maghanda
  rationale: Ipinakikita ng ‘kayo’ na maramihan ang inuutusan, gaya ng aorist imperative plural sa Griyego.
- source_word: ἡμῖν
  choice: para sa atin
  rationale: Tuwirang pinananatili ang panghalip na maramihan nang hindi dinaragdagan ang hindi tahasang tinukoy na layon ng paghahanda.
