  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: tl
  text: Araw-araw ay kasama ninyo ako sa templo[a] at nagtuturo, ngunit hindi ninyo ako dinakip[b]. Ngunit nangyari ito upang matupad ang mga Kasulatan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “templo” rito ay tumutukoy sa buong nasasakupan o mga bakuran ng templo, hindi lamang sa panloob na santuwaryo.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “hindi ninyo ako sinunggaban.”
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “Ngunit upang matupad ang mga Kasulatan.” Elliptical ang Griyego at ipinahihiwatig lamang ang pangunahing pandiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Araw-araw
  rationale: Likas at malinaw na distributibong pahayag sa modernong Tagalog para sa paulit-ulit na pagkilos sa bawat araw.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: kasama ninyo ako
  rationale: Ipinapahayag ang hayagang presensya ni Jesus sa piling nila nang hindi nagpapahiwatig ng higit sa Griyego.
- source_word: ἐν τῷ ἱερῷ
  choice: sa templo
  rationale: Karaniwang salin ng ἱερόν; sa kontekstong ito ay tumutukoy sa buong nasasakupan ng templo, hindi lamang sa panloob na santuwaryo.
- source_word: διδάσκων
  choice: at nagtuturo
  rationale: Natural na Tagalog para sa kasabay at patuloy na gawaing ipinahahayag ng present participle.
- source_word: οὐκ ἐκρατήσατέ με
  choice: hindi ninyo ako dinakip
  rationale: Sa tagpo ng pag-aresto, malinaw na naihahatid ng “dinakip” ang kontekstuwal na diwa ng κρατέω; ang mas pisikal na “sinunggaban” ay nananatiling posibleng alternatibo.
- source_word: ἀλλ’ ἵνα πληρωθῶσιν
  choice: Ngunit nangyari ito upang matupad
  rationale: Elliptical ang Griyego at walang tahasang pangunahing pandiwa pagkatapos ng ἀλλά. Ang “nangyari ito” ay maingat na nagsusuplay ng ipinahihiwatig ng konteksto, samantalang pinananatili ng “upang matupad” ang purpose/result force ng ἵνα at ang passive subjunctive.
- source_word: αἱ γραφαί
  choice: ang mga Kasulatan
  rationale: Tumutukoy sa kinikilalang mga banal na kasulatan ng Israel; ang malaking titik ay nagpapakita ng tiyak na reperensiyang ito.
theological_decisions:
- issue: Elliptical na sugnay ng layunin at katuparan ng Kasulatan
  choice: Ngunit nangyari ito upang matupad ang mga Kasulatan.
  alternative: Ngunit upang matupad ang mga Kasulatan.
  rationale: Walang nakasaad na pangunahing pandiwa sa ἀλλ’ ἵνα, kaya kailangang magbigay ang natural na Tagalog ng kaunting ipinahihiwatig na diwa. Hindi nito pinalalakas ang pahayag tungo sa isang mas deterministikong pagbasa kaysa sa sinasabi ng Griyego; inilalahad lamang nito ang kaugnayan ng mga pangyayari sa katuparan ng Kasulatan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “dinakip” dahil natural ito sa konteksto ng pag-aresto, at inilagay sa talababa ang mas pisikal na alternatibo. Inayos ang mga marker upang bawat isa ay tumugma sa tamang salita o sugnay.
