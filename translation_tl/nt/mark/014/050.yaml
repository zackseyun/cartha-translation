  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: tl
  text: At iniwan siya ng lahat at tumakas sila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ang payak na pag-uugnay nito sa naunang tagpo ng pagdakip, nang hindi nagdaragdag ng tiyak na temporal o lohikal na diwa.
- source_word: ἀφέντες
  choice: iniwan
  rationale: Sa kontekstong ito, ang aorist participle ng ἀφίημι ay tumutukoy sa pag-iwan kay Jesus. Likas sa modernong Tagalog ang pandiwang may pang-ugnay na “at,” at hindi nito dinaragdagan ang diin gaya ng maaaring gawin ng “pinabayaan.”
- source_word: αὐτὸν
  choice: siya
  rationale: Tuwirang panghalip na tumutukoy kay Jesus; malinaw ang tinutukoy mula sa konteksto.
- source_word: πάντες
  choice: ng lahat
  rationale: Ipinahahayag ang kabuuan ng mga kasamang tumakas at inilalapit ang diin sa pag-iwan nila kay Jesus.
- source_word: ἔφυγον
  choice: tumakas sila
  rationale: Ang φεύγω ay nagsasaad ng pagtakas mula sa panganib. Ang “tumakas” ay maikli, natural, at angkop sa bigat ng tagpo; idinagdag ang “sila” para sa malinaw at natural na sugnay sa Tagalog.
theological_decisions:
- issue: Lawak ng pag-iwan ng mga alagad kay Jesus
  choice: iniwan siya ng lahat at tumakas sila
  alternative: pinabayaan siya nilang lahat at nagsitakas
  rationale: 'Pinananatili ng salin ang tahasang kabuuan ng πάντες: lahat ng mga kasama niyang tinutukoy sa tagpo ay tumakas. Hindi nito nilalambot ang pag-iwan sa kaniya ni pinalalawak ang pahayag lampas sa saklaw ng konteksto.'
translation_notes:
  register: Modernong Filipino Tagalog na maikli, natural, at marangal. Ginamit ang “iniwan” sa halip na mas matinding “pinabayaan,” at ang karaniwang “tumakas sila” sa halip na mas makalumang “nagsitakas.”
