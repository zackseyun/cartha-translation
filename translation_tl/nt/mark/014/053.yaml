- from: At dinala nila si Jesus sa pinakapunong pari. Nagtipon doon ang lahat ng mga punong pari, mga pinuno ng bayan, at mga tagapagturo ng Kautusan.[a]
  to: At dinala nila si Jesus sa pinakapunong pari. Nagtipon ang lahat ng mga punong pari, mga nakatatanda, at mga eskriba.[a]
