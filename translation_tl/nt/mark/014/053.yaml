  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: tl
  text: At dinala nila si Jesus sa pinakapunong pari. Nagtipon ang lahat ng mga punong pari, mga nakatatanda, at mga eskriba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “nagtitipon” ang anyong ginamit—pangkasalukuyang anyo na nagbibigay-buhay sa isang salaysay tungkol sa nakaraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: dinala nila
  rationale: Likas sa Filipino at ipinapakita ang sapilitang pagdadala kay Jesus nang hindi dinaragdagan ang paraan ng pagkilos.
- source_word: ἀρχιερέα
  choice: pinakapunong pari
  rationale: Malinaw na tumutukoy sa nag-iisang namumunong punong pari at naihihiwalay siya sa pangkat ng mga punong pari na binanggit kasunod.
- source_word: συνέρχονται
  choice: nagtipon doon
  rationale: Ginawang pangnagdaan ang historical present upang maging natural ang salaysay sa Filipino; ipinahihiwatig ng “doon” ang pagtitipon sa kinaroroonan ng pinakapunong pari.
- source_word: πάντες
  choice: lahat
  rationale: Pinananatili ang tahasang diin ng Griyego sa kabuuan ng mga kinatawang pangkat na nagtipon.
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy sa pangkat ng mataas na pamunuang saserdote, kaiba sa nag-iisang pinakapunong pari.
- source_word: πρεσβύτεροι
  choice: mga pinuno ng bayan
  rationale: Sa kontekstong institusyonal, tumutukoy ito sa kinikilalang matatandang pinuno, hindi lamang sa mga lalaking may edad; mas malinaw ito sa ordinaryong modernong Filipino kaysa “matatanda.”
- source_word: γραμματεῖς
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinapahayag ang kinikilalang tungkulin ng mga γραμματεῖς sa kontekstong Judio at mas madaling maunawaan kaysa literal na “mga eskriba.”
theological_decisions:
- issue: Historical present na συνέρχονται sa salaysay na pangnagdaan
  choice: 'Isinaling pangnagdaan: “nagtipon”'
  alternative: 'Panatilihin ang pangkasalukuyan: “nagtipon-tipon” o “nagtitipon”'
  rationale: Ang pangnagdaan ang natural na anyo sa salaysay na Filipino. Ang pagbabago ng panahunan ay estilistikong kasiglahan sa Griyego at hindi kailangang ipilit sa pangunahing teksto.
- issue: Saklaw ng πάντες sa mga pangkat ng pamunuan
  choice: Pinanatili ang “lahat” nang hindi nililinaw kung bawat indibidwal o ang buong kapulungang kinakatawan ng mga pangkat
  alternative: “Lahat ng kinatawan” o “buong konseho”
  rationale: Pinananatili nito ang lawak at posibleng retorikal na diin ng orihinal nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pinakapunong pari” para sa singular at “mga punong pari” para sa plural upang malinaw ang pagkakaiba. Iniwasan ang mas teknikal na “eskriba” at ang malabong “matatanda.”
