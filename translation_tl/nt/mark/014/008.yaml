  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: tl
  text: Ginawa niya ang makakaya niya[a]; patiuna niyang pinahiran ng pabango ang katawan ko bilang paghahanda sa paglilibing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Ang mayroon siya, iyon ang ginawa niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Ginawa niya ang makakaya niya
  rationale: Ipinahahayag nito sa natural na modernong Tagalog ang idyomatikong diwang ‘ginawa niya ang kaya niya,’ habang inilalagay sa talababa ang mas literal na anyo.
- source_word: προέλαβεν
  choice: na ... bilang paghahanda
  rationale: Ipinakikita ng ‘na’ na isinagawa niya nang patiuna ang pagpapahid; iniiwasang ipakahulugan ang pandiwa bilang pagdating o pagkilos patungo sa isang lugar.
- source_word: μυρίσαι
  choice: pinahiran ... ng mabangong langis
  rationale: Tumutukoy ang μυρίζω sa pagpapahid ng pabango o mabangong pamahid. Mas malinaw ito sa karaniwang mambabasang Tagalog kaysa sa ‘pinahiran’ lamang.
- source_word: τὸ σῶμά μου
  choice: ang katawan ko
  rationale: Tuwiran at natural na katumbas ng pariralang Griyego.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: bilang paghahanda sa paglilibing
  rationale: Ipinahahayag ang layunin ng kilos sa natural na Tagalog at pinananatili ang kaugnayan nito sa paghahanda ng bangkay para sa libing.
theological_decisions:
- issue: Kung tahasang ilalagay ang babaeng simuno na ipinahihiwatig ng konteksto
  choice: Ginawa niya ... pinahiran na niya
  alternative: Ang mayroon siya ay ginawa niya ...
  rationale: Walang hayag na pangngalan bilang simuno sa sugnay na Griyego, ngunit malinaw sa agarang konteksto na babae ang tinutukoy. Kailangan ang ‘niya’ sa natural na Tagalog at wala itong idinaragdag na bagong teolohikal na diwa.
- issue: Kung iuugnay ang προέλαβεν sa naunang paghahanda o sa pagdating
  choice: pinahiran na niya ... bilang paghahanda
  alternative: nauna siyang pumarito upang pahiran
  rationale: Ang pandiwa ay nagsasaad ng paggawa nang patiuna, hindi ng pagpunta o pagdating. Pinananatili ng salin ang pagkilos bago ang libing nang hindi nagdaragdag ng ideya ng paglalakbay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘mabangong langis’ upang maging kongkreto ang uri ng pagpapahid, at ‘paglilibing’ bilang karaniwang salita sa halip na mas teknikal na katawagan.
