  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: tl
  text: At isinugo niya ang dalawa sa kanyang mga alagad at sinabi sa kanila, “Pumunta kayo sa lungsod. Sasalubungin kayo ng isang lalaking may dalang banga ng tubig.[a] Sundan ninyo siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: bangang luwad na may tubig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλει
  choice: isinugo
  rationale: Ginamit ang likas na anyong pasalaysay sa Filipino. Bagaman pangkasalukuyan ang anyong Griyego bilang makulay na historical present, ang tahasang pangkasalukuyang “isinusugo” ay magiging di-likas sa karaniwang salaysay sa Tagalog.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: ang dalawa sa kanyang mga alagad
  rationale: Tumpak na pinananatili ng “dalawa sa” ang partitive na diwa, at ang “mga alagad” ang pamantayan at malinaw na salin ng μαθηταί.
- source_word: λέγει
  choice: sinabi
  rationale: Isinalin sa likas na aspektong pasalaysay sa Filipino, kasabay ng “isinugo,” nang hindi binabago ang pagkakasunod ng mga kilos.
- source_word: Ὑπάγετε
  choice: Pumunta kayo
  rationale: Direkta at natural na pautos para sa higit sa isang kausap; hindi kailangan ang mas pormal na “humayo.”
- source_word: εἰς τὴν πόλιν
  choice: sa lungsod
  rationale: Sa Filipino, ang “pumunta sa lungsod” ay likas nang nagpapahayag ng patungong kilos; hindi kailangang piliting tukuyin ang pagpasok sa loob.
- source_word: ἀπαντήσει ὑμῖν
  choice: Sasalubungin kayo
  rationale: Ipinahahayag nito ang hinaharap na pagtatagpo at ang diwang ang lalaki ang makakaharap nila. Likas ito sa konteksto kaysa sa literal ngunit malamya na “makikipagtagpo sa inyo.”
- source_word: ἄνθρωπος
  choice: isang lalaki
  rationale: Tumutukoy rito sa isang partikular na lalaking tao, kaya mas tumpak ang “lalaki” kaysa sa panlahatang “tao.”
- source_word: κεράμιον ὕδατος
  choice: banga ng tubig
  rationale: Ang “banga” ay natural at madaling maunawaang sisidlan sa Filipino. Maaaring tukuyin ng κεράμιον ang sisidlang luwad, ngunit hindi kailangang ilagay ang materyal sa pangunahing teksto.
- source_word: βαστάζων
  choice: may dalang
  rationale: Natural na Filipino para sa kasalukuyang kilos ng pagbubuhat o pagdadala habang nakakatagpo nila ang lalaki.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Sundan ninyo siya
  rationale: Direkta, malinaw, at maramihang pautos na tumutugma sa dalawang alagad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang karaniwang aspektong pasalaysay sa Tagalog sa halip na gayahin nang mekanikal ang historical present ng Griyego. Ginamit ang “lungsod,” “mga alagad,” at “banga” bilang pamilyar ngunit dignified na bokabularyo.
