  text: Then they laid hands on him and seized him[a][b].
translation:
  language: tl
  text: At sinunggaban[a] nila siya at dinakip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “ipinatong nila ang kanilang mga kamay sa kanya.” Idyoma ito para sa sapilitang paghawak sa isang tao, kadalasan upang dakpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Kaya ... nila
  rationale: Ang οἱ ay tumutukoy sa mga taong kababanggit lamang, at ang δέ ay nag-uugnay sa kasunod na pangyayari nang may bahagyang pagsulong sa salaysay. Natural sa Filipino ang “Kaya” sa kontekstong ito.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: sinunggaban nila siya
  rationale: Ang parirala ay isang idyoma para sa sapilitang paghawak sa isang tao, karaniwan upang dakpin siya. Inihahatid ng “sinunggaban” ang marahas at biglaang kilos nang hindi kinakailangang literal na tumbasan ang “mga kamay.”
- source_word: ἐκράτησαν αὐτόν
  choice: dinakip
  rationale: Sa tagpong ito, ang κρατέω ay nangangahulugang hulihin at pigilan ang isang tao. Ang “dinakip” ay natural na Filipino at malinaw na nagpapahayag ng pag-aresto, habang ang naunang “sinunggaban” ang nagpapanatili sa pisikal na puwersa ng kilos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Iniwasan ang literal ngunit hindi natural na “ipinatong ang mga kamay sa kanya,” na maaari ring magpahiwatig ng ritwal na pagpapatong ng kamay sa halip na marahas na pagdakip.
