  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang mga pautos na maramihan, ang layuning ipinahihiwatig ng ἵνα μή, at ang paghahambing ng espiritu at laman. Gayunman, ang “mapasailalim sa tukso” ay nagdaragdag ng ideya ng pagpapasakop o pagiging nasa ilalim ng kapangyarihan ng tukso. Ang εἰς πειρασμόν ay higit na tuwirang “pumasok/malagay sa tukso [o pagsubok].”
  naturalness: Natural at marangal ang karamihan ng salin. Ang “malagay sa tukso” ay mas idiomatiko sa modernong Filipino kaysa “mapasailalim sa tukso” at mas malapit sa metapora ng Griyego.
  terminology: Ang “espiritu” (maliit ang titik) at “laman” ay wastong nagpapanatili ng hindi ipinapasiyang antropolohikal na tensiyon. Ang “handa” ay katanggap-tanggap para sa πρόθυμον. Nananatiling angkop ang “tukso,” na may talababa para sa mas malawak na kahulugang “pagsubok.”
