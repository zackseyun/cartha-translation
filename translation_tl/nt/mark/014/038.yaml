  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: tl
  text: Manatili kayong gising at manalangin[a] upang hindi kayo malagay sa tukso. Tunay na handa ang espiritu, ngunit mahina ang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagsubok” para sa “tukso” (πειρασμόν).
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Manatili kayong gising
  rationale: Maramihang pautos ito na literal na tumutukoy sa pananatiling gising at, sa konteksto ng Getsemani, nagpapahiwatig din ng mapagbantay na pagbabantay.
- source_word: προσεύχεσθε
  choice: manalangin
  rationale: Likas at marangal na pautos sa modernong Filipino; ang aspektong pangkasalukuyan ay umaayon sa patuloy na pananalangin nang hindi kailangang gawing mabigat ang anyo.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: upang hindi kayo mapasailalim sa tukso
  rationale: Pinananatili ng “upang hindi” ang layunin o pag-iwas na ipinahihiwatig ng ἵνα μή. Ang “mapasailalim sa” ay likas sa Filipino at naghahatid ng larawan ng pagpasok sa kalagayan o kapangyarihan ng tukso.
- source_word: πειρασμόν
  choice: tukso
  rationale: Sa babalang ito, “tukso” ang pinakanatural na pangunahing kahulugan, ngunit maaari ring tumukoy ang salita sa pagsubok, kaya inilalahad ang alternatibo sa talababa.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Tunay na handa ang espiritu
  rationale: Ang “espiritu” ay hindi ginawang malaking titik upang hindi ipagpalagay na Espiritu Santo ang tinutukoy. Ang “handa” ay sumasaklaw sa kahandaang-loob at pagkukusang ipinahihiwatig ng πρόθυμον.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: ngunit mahina ang laman
  rationale: Pinananatili ng “laman” ang kongkretong antropolohikal na paghahambing sa espiritu at iniiwasang ipakahulugan agad bilang “makasalanang kalikasan.” Ang “mahina” ay tuwirang naghahayag ng pagkabatid sa kahinaan ng tao.
theological_decisions:
- issue: Ang tinutukoy ng πνεῦμα
  choice: espiritu ng tao / kaloobang handa
  alternative: ang Espiritu Santo
  rationale: Ang tuwirang paghahambing sa “laman” at ang konteksto ng mga alagad na inaantok ay higit na pumapabor sa espiritu ng tao bilang sentro ng kanilang kahandaang-loob. Hindi ginawang malaking titik ang salita upang mapanatili ang pagbasa nang hindi nagdaragdag ng tiyak na doktrinal na pakahulugan.
- issue: Kahulugan ng σάρξ
  choice: laman
  alternative: katawan; makasalanang kalikasan
  rationale: Dito, ang diin ay kahinaan ng tao sa kabila ng handang kalooban, hindi isang tahasang doktrina tungkol sa makasalanang kalikasan. Pinananatili ng “laman” ang tensiyon at larawan ng orihinal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “kayo” ayon sa mga pandiwang Griyego. Pinanatili ang “espiritu” at “laman” upang hindi burahin ang antropolohikal at teolohikal na tensiyon ng orihinal.
