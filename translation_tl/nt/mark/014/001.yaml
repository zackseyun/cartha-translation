base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: tl
  text: Dalawang araw na lamang bago ang Paskuwa at ang Pista ng Tinapay na Walang Pampaalsa.[a] Patuloy na naghahanap ang mga punong pari at ang mga eskriba ng paraan upang madakip si Jesus sa pamamagitan ng pandaraya[c] at patayin siya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “pagkalipas ng dalawang araw.” Ipinahihiwatig ng parirala na nalalapit na ang Paskuwa at ang Pista ng Tinapay na Walang Pampaalsa.
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, “ang mga walang pampaalsa,” isang nakaugaliang pagtukoy sa Pista ng Tinapay na Walang Pampaalsa.
    reason: cultural_note
  - marker: c
    text: Maaari ring “sunggaban siya sa pamamagitan ng katusuhan” o “dakpin siya nang may panlilinlang.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Dalawang araw na lamang bago
  rationale: Likas na inilalahad sa modernong Tagalog ang nalalapit na panahon; hindi dinaragdagan ng tahasang “ngayon” ang banayad na pang-ugnay na δέ.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Karaniwang katawagan sa kapistahang Judio na tinutukoy sa konteksto.
- source_word: τὰ ἄζυμα
  choice: ang Pista ng Tinapay na Walang Pampaalsa
  rationale: Literal itong “mga walang pampaalsa,” ngunit sa konteksto ay nakaugaliang pagtukoy sa kapistahan; nililinaw ito nang hindi ipinag-iisa sa Paskuwa.
- source_word: μετὰ δύο ἡμέρας
  choice: Dalawang araw na lamang bago
  rationale: Inihahatid nang natural ang diwang nalalapit na ang mga kapistahan, habang itinatala sa talababa ang mas literal na anyo.
- source_word: ἐζήτουν
  choice: Patuloy na naghahanap
  rationale: Ipinapakita ang nagpapatuloy o paulit-ulit na pagsisikap na taglay ng imperfect.
- source_word: οἱ ἀρχιερεῖς
  choice: ang mga punong pari
  rationale: Karaniwang salin para sa mga pangunahing pinunong saserdote.
- source_word: οἱ γραμματεῖς
  choice: ang mga eskriba
  rationale: Tuwirang katumbas na nananatiling malinaw sa kontekstong biblikal.
- source_word: πῶς
  choice: ng paraan upang
  rationale: Natural na Tagalog para sa paghahanap nila kung paano isasagawa ang balak.
- source_word: ἐν δόλῳ
  choice: sa pamamagitan ng pandaraya
  rationale: Pinananatili ang diwa ng panlilinlang o katusuhan, hindi lamang ang pagiging lihim.
- source_word: κρατήσαντες
  choice: madakip
  rationale: Sa konteksto ng mga awtoridad, ang pagdakip ang likas na pagpapahayag ng marahas o opisyal na pagsunggab sa kaniya.
- source_word: ἀποκτείνωσιν
  choice: maipapatay siya
  rationale: Tuwirang ipinahahayag ang layunin nilang maging sanhi ng kaniyang kamatayan; ang anyong causative ay natural kasunod ng “paraan upang.”
theological_decisions:
- issue: Ugnayan ng Paskuwa at Pista ng Tinapay na Walang Pampaalsa
  choice: Panatilihing magkahiwalay ang dalawang katawagan
  alternative: Ituring ang dalawa bilang iisang pinagsamang pangalan ng kapistahan
  rationale: Magkahiwalay na binabanggit ni Marcos ang πάσχα at ἄζυμα, bagaman magkaugnay ang mga pagdiriwang.
- issue: Moral na katangian ng balak ng mga pinuno
  choice: sa pamamagitan ng pandaraya
  alternative: nang palihim
  rationale: Ang δόλος ay tumutukoy sa panlilinlang o katusuhan, kaya hindi sapat ang paglalarawan lamang sa pagiging lihim.
- issue: Layon ng pagdakip
  choice: maipapatay siya
  alternative: patayin siya
  rationale: Parehong posible sa konteksto; pinili ang natural na daloy sa Tagalog nang hindi tinutukoy ang tiyak na mekanismo o tagaganap ng pagpatay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Paskuwa,” “punong pari,” at “eskriba” bilang pamilyar na bokabularyong biblikal. Inilagay ang lahat ng panandang talababa sa mismong teksto at iniugnay ang [b] sa katawagang pangkapistahan at ang [c] sa paraan ng pagdakip.
