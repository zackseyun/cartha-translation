  to: Habang kumakain sila, kumuha siya ng tinapay, binasbasan ito, pinagputul-putol niya ito, at ibinigay sa kanila. Sinabi niya, “Kunin ninyo; ito ang aking katawan.”[a]
  rationale: Ginawang tahasan ang layon ng pandiwang tumutukoy sa pagbasag ng tinapay at inayos ang ikalawang alternatibong pagbasa sa talababa. Hindi binago ang kahulugan, ang pagkakasunod-sunod ng mga kilos, o ang sadyang hindi nilulutas na teolohikal na tensiyon ng “ito ang aking katawan.”
