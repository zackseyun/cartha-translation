  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: tl
  text: Habang kumakain sila, kumuha siya ng tinapay, binasbasan ito, pinagputul-putol niya ito, at ibinigay sa kanila. Sinabi niya, “Kunin ninyo; ito ang aking katawan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain na “ito ay kumakatawan sa aking katawan” o “ito ay nangangahulugang ‘aking katawan.’” Sa literal na Griyego: “ito ang aking katawan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Habang kumakain sila
  rationale: Ang genitive absolute na may present participle ay nagsasaad ng kilos na kasabay at nagpapatuloy; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “habang.”
- source_word: λαβὼν ἄρτον
  choice: kumuha siya ng tinapay
  rationale: Ginawang finite verb ang aorist participle upang maging natural ang daloy ng salaysay sa Tagalog. Hindi tinukoy na isang buong tinapay o isang piraso dahil walang artikulo ang ἄρτον at sapat ang “tinapay” sa konteksto.
- source_word: εὐλογήσας
  choice: binasbasan ito
  rationale: Sa konteksto ng pagkain, tumutukoy ang pandiwa sa pagbigkas ng basbas kaugnay ng tinapay. Nilinaw ng “ito” ang ipinahihiwatig na layon nang hindi ginagawang tahasang pasasalamat ang salitang Griyego.
- source_word: ἔκλασεν
  choice: pinagputol-putol
  rationale: Ipinahahayag nito ang pagputol o paghahati ng tinapay bago ibigay. Natural ang anyong ito sa Tagalog para sa tinapay na inihahanda upang maipamahagi.
- source_word: ἔδωκεν αὐτοῖς
  choice: ibinigay sa kanila
  rationale: Ang tinapay ang ipinahihiwatig na layon. Hindi ginamit ang mas mapagpaliwanag na “ipinamahagi” upang manatiling malapit sa payak na kahulugan ng pandiwa.
- source_word: Λάβετε
  choice: Kunin ninyo
  rationale: Tuwirang pautos ito sa maramihang kausap. Ang “kunin ninyo” ay natural at malinaw sa modernong Tagalog.
- source_word: τοῦτό ἐστιν
  choice: ito ang
  rationale: Ang karaniwang pangungusap na panaguri sa Tagalog na “ito ang” ay tuwirang katumbas ng copular construction at hindi nito ipinapasok sa pangunahing teksto ang interpretasyong “sumasagisag” o “nangangahulugan.”
- source_word: τὸ σῶμά μου
  choice: aking katawan
  rationale: Ang σῶμα ay tuwirang nangangahulugang “katawan.” Walang idinagdag na paliwanag na lulutas sa posibleng teolohikal na pagbasa.
theological_decisions:
- issue: Pananalita ni Jesus tungkol sa tinapay sa Hapunan
  choice: “ito ang aking katawan”
  alternative: “ito ay sumasagisag sa aking katawan” / “ang ibig sabihin nito ay ang aking katawan”
  rationale: Karaniwang copula ang ἐστιν, kaya pinanatili ang tuwirang pahayag at ang kaakibat nitong teolohikal na tensiyon sa halip na magpasya sa pagsasalin kung literal, sakramental, o sagisag ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “binasbasan” bilang pamilyar na salita sa konteksto ng pagkain at pananampalataya, at iniwasan ang mga katawagang nakatali sa isang partikular na denominasyon.
