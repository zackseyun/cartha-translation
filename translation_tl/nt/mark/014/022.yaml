  naturalness: Natural ang kabuuang daloy at marangal ang rehistro. Mas matatas at malinaw ang “pinagputul-putol niya ito” sa salaysay kaysa sa layon-singaw na anyo pagkatapos ng “binasbasan ito.”
  terminology: Ang “tinapay,” “binasbasan,” at “katawan” ay angkop at hindi nagpapasya sa usaping teolohikal. Pinananatili ng pangunahing teksto ang direktang katumbas ng ἐστιν, “ito ang.”
