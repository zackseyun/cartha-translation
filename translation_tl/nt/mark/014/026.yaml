  text: Καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: tl
  text: At matapos silang umawit ng isang himno[a], lumabas sila patungo sa Bundok ng mga Olibo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na anyo, “pagkaawit nila.” Ipinakikita ng participle sa Griyego na nauna ang pag-awit bago sila lumabas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at ang pagkakasunod-sunod ng salaysay nang hindi nagdaragdag ng interpretasyon.
- source_word: ὑμνήσαντες
  choice: pagkatapos nilang umawit ng isang himno
  rationale: Likas na isinasalin sa Tagalog ang aorist participle bilang kilos na nauna sa pangunahing pandiwa; ipinahihiwatig ng ὑμνέω ang pag-awit ng himno o awit ng papuri.
- source_word: ἐξῆλθον
  choice: pumunta sila
  rationale: Sa kontekstong may tahasang patutunguhan, natural itong naghahayag ng pag-alis at pagtungo roon. Hindi ginamit ang literal na 'lumabas sila' dahil maaari itong tumunog na bitin sa modernong Tagalog.
- source_word: εἰς
  choice: sa
  rationale: Karaniwang pananda sa Tagalog para sa patutunguhan, at natural kasama ng pangalan ng isang lugar.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Bundok ng mga Olibo
  rationale: Malinaw at nakaugat sa anyo ng Griyegong pangalan ng lugar; ang maramihang τῶν Ἐλαιῶν ay pinanatili sa 'mga Olibo.'
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “himno” dahil karaniwan itong nauunawaan bilang awit ng papuri at pinananatili nito ang maaaring liturhikal na diwa ng ὑμνέω.
