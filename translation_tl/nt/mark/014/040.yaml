  source_fidelity: 'Tumpak ang pangunahing daloy ng salin: ang muling pagdating, pagkakatagpo sa kanila na natutulog, ang dahilan ng kanilang antok, at ang kawalan nila ng maisasagot. Gayunman, ang “bumibigat” ay mas tumutukoy sa prosesong nagsisimula o nagpapatuloy na bumigat, samantalang ang Griyegong periphrastic imperfect ay mas maayos na naihahayag dito bilang kalagayang “mabigat.” Ang “dapat nilang isagot” ay nagdaragdag ng bahagyang diwa ng obligasyon na wala sa τί ἀποκριθῶσιν; mas neutral ang “isasagot nila.”'
  naturalness: Natural at marangal ang pangungusap sa modernong Filipino Tagalog. Ang “mabigat ang kanilang mga mata” ay idiomatiko at malinaw sa konteksto ng antok. Ang “kung ano ang isasagot nila sa kanya” ay mas likas at hindi nagpapahiwatig na may partikular na obligasyong sagutin.
  terminology: Walang suliranin sa mga pangalan o teolohikal na termino. Ang “mga mata” ay wastong katumbas ng οἱ ὀφθαλμοί. Inayos ang talababa upang ilarawan ang metapora ng Griyego nang hindi nagdaragdag ng “pinahihirapan,” na mas malakas at hindi kinakailangan sa source.
