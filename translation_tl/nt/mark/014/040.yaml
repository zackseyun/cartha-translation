    issue: Ang “bumibigat ang kanilang mga mata” ay hindi ang pinakamalapit na aspekto para sa καταβαρυνόμενοι sa salaysay na nakaraan.
    rationale: Ang parirala ay naglalarawan ng kanilang kalagayan habang natutulog—ang kanilang mga mata ay mabigat o nabibigatan—hindi kinakailangang ng prosesong unti-unting bumibigat sa sandaling iyon.
  - severity: medium
    issue: Ang “dapat nilang isagot” ay maaaring magpahiwatig ng obligasyon.
    rationale: Ang τί ἀποκριθῶσιν ay isang di-tuwirang tanong tungkol sa kung ano ang maitutugon nila; hindi nito tahasang ipinapahayag ang normatibong “dapat.”
  - severity: low
    issue: Ang talababa ay gumagamit ng “pinahihirapan.”
    rationale: Hindi ito kailangan upang isalin ang imaheng καταβαρυνόμενοι at maaari itong magbigay ng mas matinding kahulugang hindi tahasang nasa Griyego.
