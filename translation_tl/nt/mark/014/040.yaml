  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: tl
  text: Nang muli siyang dumating, natagpuan niya silang natutulog, sapagkat mabigat ang kanilang mga mata[a], at hindi nila alam kung ano ang isasagot nila sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sapagkat mabibigat ang kanilang mga mata.” Ang larawan sa Griyego ay na para bang nabibigatan ng antok ang kanilang mga mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Nang muli siyang dumating
  rationale: Ipinahahayag nito ang naunang kilos ng aorist participle at ang pag-uulit na tinutukoy ng πάλιν sa natural na ayos ng modernong Tagalog.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: natagpuan niya silang natutulog
  rationale: Pinananatili ng “natutulog” ang nagpapatuloy na kilos ng participle, sa halip na gawin lamang itong kalagayang “tulog.”
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: sapagkat bumibigat ang kanilang mga mata[a]
  rationale: Natural sa Tagalog ang “bumibigat ang mga mata” para sa antok, at pinananatili nito ang larawan ng mga matang nadaragdagan ang bigat. Ipinahihiwatig rin ng aspektong nagaganap ang periphrastic imperfect ng Griyego.
- source_word: οὐκ ᾔδεισαν
  choice: hindi nila alam
  rationale: Tuwirang ipinapahayag ang kakulangan nila ng kaalaman kung paano tutugon.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: kung ano ang dapat nilang isagot sa kanya
  rationale: Ang “dapat nilang isagot” ay natural na Tagalog para sa deliberative na di-tuwirang tanong na may aorist subjunctive, at pinananatili ang tugong nakatuon kay Jesus.
