  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: tl
  text: Pagsapit ng gabi, dumating siya kasama ang labindalawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Labindalawa,” kung ituturing ang parirala bilang kinikilalang katawagan sa pangkat ng mga apostol ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Pagsapit
  rationale: Hindi na isinalin nang hiwalay ang pang-ugnay na Καὶ; isinama ito sa likas na daloy ng salaysay sa Filipino, habang malinaw pa ring ipinagpapatuloy ang susunod na pangyayari.
- source_word: ὀψίας γενομένης
  choice: Pagsapit ng gabi
  rationale: Ang genitive absolute ay nagsasaad ng panahong kinalalagyan. Ang “Pagsapit ng gabi” ay natural, maikli, at tumpak sa modernong Filipino.
- source_word: ἔρχεται
  choice: dumating siya
  rationale: Bagaman historical present ang Griyego, karaniwang gumagamit ang natural na salaysay sa Filipino ng aspektong perpektibo para sa nakalipas na pangyayari. Pinananatili ng “dumating” ang galaw at malinaw na tinutukoy si Jesus ayon sa konteksto.
- source_word: μετὰ τῶν δώδεκα
  choice: kasama ang labindalawa
  rationale: Ang μετά na may genitive ay nagsasaad ng pagsama. Ang “ang labindalawa” ay tuwirang tumutukoy sa kinikilalang pangkat ng labindalawang alagad ni Jesus nang hindi nagdaragdag ng “alagad” o “apostol” sa pangunahing teksto.
theological_decisions:
- issue: Tinutukoy ng “ang labindalawa”
  choice: Ang pangkat ng labindalawang alagad ni Jesus, kasama pa si Judas sa puntong ito ng salaysay
  alternative: ang Labindalawa, na itinuturing na pormal na katawagan sa pangkat
  rationale: Ito ang payak na tinutukoy sa salaysay. Hindi pinalawak ang pangunahing teksto upang hindi magdagdag ng interpretatibong katawagang “mga apostol” o “mga alagad.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang aspektong pasalaysay sa Filipino sa halip na gayahin nang mekanikal ang historical present ng Griyego.
