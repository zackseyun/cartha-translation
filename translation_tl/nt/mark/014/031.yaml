id: MRK.14.31
reference: Mark 14:31
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: tl
  text: Ngunit lalo pa niyang iginiit[a], “Kung kailangan kong mamatay na kasama mo, hinding-hindi kita ikakaila[b].” At ganoon din ang sinasabi nilang lahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit nagsalita siya nang buong diin.”
    reason: lexical_alternative
  - marker: b
    text: Napakamariin ng anyo ng pagtanggi sa Griyego; maaari ring isalin na “tiyak na hindi kita ikakaila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: lalo pa niyang iginiit
  rationale: Pinagsasama nito ang matinding diin ng ἐκπερισσῶς at ang nagpapatuloy o nauulit na kilos ng imperfect na ἐλάλει. Likas ito sa modernong Filipino at malinaw na ipinahihiwatig ang tumitinding pagpupumilit ni Pedro.
- source_word: Ἐὰν δέῃ με
  choice: Kung kailangan kong
  rationale: Pinananatili ng “kung” ang kondisyong ipinahahayag ng ἐάν, samantalang malinaw na naihahatid ng “kailangan” ang diwa ng pangangailangan sa δέῃ.
- source_word: συναποθανεῖν σοι
  choice: mamatay na kasama mo
  rationale: Tuwirang pinananatili ng “kasama mo” ang diwa ng σύν sa tambalang pandiwa—ang pagkamatay na kasama ni Jesus—nang hindi nagiging asiwa sa Filipino.
- source_word: οὐ μή
  choice: hinding-hindi
  rationale: Ang dobleng anyo sa Filipino ay natural at mariing katumbas ng napakalakas na pagtanggi sa Griyego.
- source_word: ἀπαρνήσομαι
  choice: ikakaila
  rationale: Ang “ikakaila” ang malinaw at karaniwang salita sa kontekstong itatanggi ni Pedro ang kanyang pagkakilala o kaugnayan kay Jesus.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: At ganoon din ang sinasabi nilang lahat
  rationale: Ang “ganoon din” ay tumutukoy sa kaparehong pahayag, ang “lahat” ay nagpapanatili sa saklaw ng πάντες, at ang “sinasabi” ay sumasalamin sa nagpapatuloy na aspekto ng imperfect na ἔλεγον.
theological_decisions:
- issue: Lakas ng panata ni Pedro na hindi niya ikakaila si Jesus
  choice: hinding-hindi kita ikakaila
  alternative: tiyak na hindi kita ikakaila
  rationale: Pinananatili nito ang mariing pagtitiwala ni Pedro sa sarili at ang tensiyong nalilikha ng kanyang pagkabigo sa kalaunan, nang hindi ipinapaliwanag o nilulutas ang kabalintunaan ng salaysay.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “iginiit” upang maipahayag nang maikli ang nagpapatuloy at matinding pagsasalita, at ang “hinding-hindi” upang mapanatili ang pambihirang diin ng Griyegong pagtanggi.
