  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: tl
  text: Nang marinig nila ito, natuwa sila at nangakong bibigyan siya ng pera[a]. At naghahanap siya ng paraan kung paano niya maipagkakanulo si Jesus[b] sa tamang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, pilak. Ang salitang Griyego ay maaaring tumukoy sa literal na pilak o, sa mas pangkalahatan, sa pera.
    reason: lexical_alternative
  - marker: b
    text: O, maibigay siya. Ang pandiwang Griyego ay maaaring mangahulugang “ibigay” o “ipasa”; dito, ipinahahayag ng “ipagkanulo” ang taksil na konteksto ng ginawa ni Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Nang marinig nila iyon
  rationale: Ipinahahayag nang natural sa Tagalog ang temporal na diwa ng participle; ang “iyon” ay idinagdag mula sa konteksto bilang layon ng “marinig.”
- source_word: ἐχάρησαν
  choice: natuwa sila
  rationale: Malinaw at likas sa modernong Tagalog, habang pinananatili ang positibong reaksiyong inilalarawan ng pandiwa.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: nangakong bibigyan siya ng pera
  rationale: Ang ἐπαγγέλλομαι ay pangako, at ang ἀργύριον ay karaniwang tumutukoy sa pera sa ganitong konteksto; walang halagang tinukoy.
- source_word: ἐζήτει
  choice: nagsimula siyang maghanap
  rationale: Ipinakikita ang inceptive at nagpapatuloy na kilos na maaaring ipahiwatig ng imperfect sa daloy ng salaysay.
- source_word: πῶς
  choice: ng paraan upang
  rationale: Likas na Tagalog para sa paghahanap kung paano maisasagawa ang balak, nang hindi nagdaragdag ng tiyak na paraang wala sa teksto.
- source_word: εὐκαίρως
  choice: sa angkop na pagkakataon
  rationale: Pinananatili ang diwa ng isang kanais-nais o angkop na oras para isagawa ang balak.
- source_word: παραδοῖ
  choice: maipagkanulo
  rationale: Bagaman literal na maaaring mangahulugang “ibigay” o “ipaubaya,” ipinahahayag ng “ipagkanulo” ang taksil na diwa ng kilos ni Judas sa agarang konteksto.
- source_word: αὐτόν
  choice: si Jesus
  rationale: Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang nakalilitong sunod-sunod na “siya” sa Tagalog; malinaw mula sa konteksto na si Jesus ang tinutukoy.
theological_decisions:
- issue: Pagpapakahulugan sa παραδίδωμι sa kilos ni Judas
  choice: maipagkanulo
  alternative: maibigay o maipaubaya
  rationale: Sa konteksto, hindi neutral na paglilipat ang balak ni Judas kundi taksil na pakikipagsabwatan laban kay Jesus. Gayunman, inilalagay sa talababa ang mas literal na alternatibo upang mapanatili ang lawak ng pandiwang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang karaniwang “pera” sa halip na mas pormal na “salapi,” at ginawang tahasan ang pangalang Jesus upang maiwasan ang malabong reperensiya ng mga panghalip.
