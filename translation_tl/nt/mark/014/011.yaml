    issue: Hindi nakadikit ang talababa b sa salitang “maipagkanulo.”
    rationale: Ang marker b ay kasalukuyang nasa hulihan ng “sa angkop na pagkakataon,” kahit ang talababa ay tungkol sa παραδοῖ / “ipagkanulo.” Dapat ilagay ang marker kasunod mismo ng katumbas na pandiwa.
  - severity: low
    issue: Ang “nagsimula siyang maghanap” ay isang posibleng inceptive na pagbasa ng imperfect, ngunit hindi kinakailangan.
    rationale: Ang ἐζήτει ay pangunahing nagpapakita ng nagpapatuloy na paghahanap. Ang “naghahanap siya” ay mas tuwirang nagpapanatili ng aspektong ito nang hindi pinipilit ang simulang diwa.
  - severity: low
    issue: Ang alternatibong “maibigay siya sa kanila” ay nagdaragdag ng tahasang tatanggap.
    rationale: Maaaring mahinuha ang mga punong saserdote mula sa konteksto, ngunit hindi sila ipinahahayag sa mismong sugnay. Mas maingat ang “maibigay siya” o “maipasa siya.”
