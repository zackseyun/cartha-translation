  source_fidelity: 'Tumpak ang pangunahing diwa: natuwa ang mga punong saserdote, nangakong magbigay ng pera kay Judas, at naghanap si Judas ng pagkakataong maipagkanulo si Jesus. Gayunman, mas mahusay na ipakita ang imperfect na ἐζήτει bilang nagpapatuloy na kilos (“naghahanap siya”) at ilagay ang talababa para sa παραδοῖ sa mismong salitang isinasalin nito.'
  naturalness: Natural ang karamihan ng draft, ngunit mas idiomatiko ang “kung paano niya maipagkakanulo si Jesus” kaysa “ng paraan upang maipagkanulo si Jesus.” Ang “sa tamang pagkakataon” ay malinaw at natural para sa εὐκαίρως.
  terminology: Ang “pera” ay angkop para sa ἀργύριον; pinananatili sa talababa ang “pilak.” Ang “ipagkanulo” ay angkop sa taksil na kilos ni Judas sa konteksto, habang ang “ibigay” ay inilalahad bilang literal na alternatibo. Hindi dapat idagdag sa talababa ang “sa kanila,” sapagkat wala itong tahasang katumbas sa parirala mismo.
  issues:
