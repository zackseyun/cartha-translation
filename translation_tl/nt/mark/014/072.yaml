  source_fidelity: 'Tumpak ang pangunahing daloy at lahat ng pangunahing detalye: agarang ikalawang tilaok, pag-alala ni Pedro sa sinabi ni Jesus, ang dalawang tilaok, at ang tatlong pagkakaila. Gayunman, ang “hindi na niya napigil ang sarili” ay mas tiyak kaysa sa mahirap at pinagtatalunang ἐπιβαλών, at ang kasunod na “at umiyak siya” ay nagiging bahagyang paulit-ulit. Ang “bumigay siya at umiyak” ay mas maikli at mas malapit sa audit trail na “breaking down,” habang pinananatili ng talababa ang mga alternatibong pagbasa.'
  naturalness: Natural ang “tandang,” “tumilaok,” “naalala,” at “ikakaila.” Mas maayos ang ayos na “tumilaok sa ikalawang pagkakataon ang isang tandang” kaysa sa paghihiwalay ng “isang tandang” sa hulihan ng pangungusap. Natural at marangal din ang “bumigay siya at umiyak.”
  terminology: Wasto at makabagong Filipino ang “Jesus,” “Pedro,” “tandang,” at “ikakaila.” Walang terminolohiyang teolohikal na nangangailangan ng pagbabago.
  issues:
  - severity: medium
    issue: Ang “hindi na niya napigil ang sarili” ay nagpapakahulugan nang mas tiyak sa ἐπιβαλών.
