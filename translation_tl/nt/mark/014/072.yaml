source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: tl
  text: 'At kaagad na tumilaok sa ikalawang pagkakataon ang isang tandang. Naalala ni Pedro ang sinabi sa kanya ni Jesus: “Bago tumilaok nang dalawang beses ang isang tandang, tatlong beses mo akong ikakaila.” At bumigay siya[a] at umiyak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang kahulugan ng salitang Griyego rito. Maaari rin itong maunawaan bilang “nang mapag-isipan niya ito, umiyak siya,” o bilang pagtukoy sa isang panlabas na kilos bago siya umiyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: kaagad
  rationale: Pinananatili ang agarang kilos at ang katangiang mabilis na daloy ng salaysay ni Marcos.
- source_word: ἐκ δευτέρου
  choice: sa ikalawang pagkakataon
  rationale: Malinaw na pinananatili ang tahasang pagbilang sa Griyego, hindi lamang ang di-tiyak na 'muli.'
- source_word: ἀλέκτωρ
  choice: isang tandang
  rationale: Ang 'tandang' ang natural at kasalukuyang katawagan sa lalaking manok; ipinahihiwatig ng 'isang' ang kawalan ng pantukoy sa Griyego nang hindi tumutukoy sa isang dati nang natukoy na ibon.
- source_word: ἐφώνησεν / φωνῆσαι
  choice: tumilaok
  rationale: Sa konteksto ng tandang, ito ang tiyak at likas na pandiwang Filipino para sa tunog nito.
- source_word: ἀνεμνήσθη
  choice: naalala
  rationale: Tuwiran at natural na katumbas ng paggunita sa isang naunang sinabi.
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ang sinabi sa kanya ni Jesus
  rationale: Natural na Filipino para sa 'salita/pahayag' na agad namang ibinibigay ang nilalaman; iniiwasan ang matigas na 'ang salita kung paanong sinabi.'
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Bago tumilaok nang dalawang beses ang isang tandang
  rationale: Pinananatili ang temporal na ugnayan, ang dalawang pagtilaok, at ang di-tiyak na pagtukoy sa tandang.
- source_word: τρίς με ἀπαρνήσῃ
  choice: tatlong beses mo akong ikakaila
  rationale: Ang 'ikakaila' ay karaniwan at tumpak para sa pagtanggi o pagtatwa sa pagkakaugnay kay Jesus.
- source_word: ἐπιβαλών
  choice: hindi na niya napigil ang sarili
  rationale: Ipinahahayag ang malamang na pagsidhi o pagsiklab ng pag-iyak sa natural na Filipino, ngunit nilalagyan ng talababa dahil lubhang pinagtatalunan ang eksaktong diwa ng participle.
- source_word: ἔκλαιεν
  choice: umiyak siya
  rationale: Natural at marangal na anyong pasalaysay; ang imperfect ay maaaring magpahiwatig ng nagpapatuloy na pag-iyak, ngunit hindi kailangang gawing mabigat ang pangunahing teksto.
theological_decisions:
- issue: Ang mahirap na participle na ἐπιβαλών at ang paglalarawan sa tugon ni Pedro
  choice: hindi na niya napigil ang sarili
  alternative: nang mapag-isipan niya iyon; nagtakip siya ng mukha; ibinuhos niya ang sarili sa pag-iyak
  rationale: Hindi tiyak kung tumutukoy ito sa panloob na paggunita, pisikal na kilos, o pagsidhi ng damdamin. Pinili ang isang likas na pahayag na naghahatid ng emosyonal na pagbagsak nang hindi nagtatakda ng tiyak na kilos ng katawan; inilalahad sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang 'tumilaok,' 'tandang,' at 'ikakaila.' Iniwasan ang sobrang literal na ayos na magiging asiwa sa Tagalog, habang pinanatili sa talababa ang kalabuan ng ἐπιβαλών.
