  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: tl
  text: Nang makita niya si Pedro na nagpapainit, tinitigan niya ito at sinabi, “Kasama ka rin ni Jesus na taga-Nazaret.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: nagpapainit
  rationale: Likas at malinaw na salin ng participle na tumutukoy sa pagpapainit ni Pedro sa tabi ng apoy.
- source_word: ἐμβλέψασα αὐτῷ
  choice: tinitigan niya ito
  rationale: Ipinahahayag ang masinsinang pagtingin, hindi lamang karaniwang pagkakita.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historical present ang Griyego, mas natural sa makabagong salaysay sa Tagalog ang pangnagdaang anyo.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: ni Jesus na taga-Nazaret
  rationale: Pinananatili ang pagkakakilanlan kay Jesus bilang ang Nazareno sa natural na Tagalog.
- source_word: Καὶ σὺ
  choice: Kasama ka rin
  rationale: Inililipat ang diin ng καὶ bilang ‘rin’ sa paratang na kabilang din si Pedro sa mga kasama ni Jesus.
theological_decisions: []
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino; tuwirang salaysay na may natural na ayos ng pangungusap.
