  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: tl
  text: Ngunit nanatili siyang tahimik at hindi sumagot ng anuman. Muli, tinanong siya ng punong pari at sinabi nito sa kaniya, “Ikaw ba ang Mesiyas[a], ang Anak ng Pinagpala[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang titulong Griyego na Χριστός (Christos) ay isinaling “Mesiyas” dito dahil ginagamit ito bilang titulo sa kontekstong mesiyaniko ng mga Judio.
    reason: alternative_reading
  - marker: b
    text: Ang “Pinagpala” ay isang magalang na paraang Judio ng pagtukoy sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: nanatili siyang tahimik
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang nagpapatuloy na pananahimik; natural itong naipapahayag sa modernong Tagalog.
- source_word: ἀπεκρίνατο οὐδέν
  choice: hindi sumagot kahit ano
  rationale: Pinananatili nito ang mariing ganap na kawalan ng sagot sa malinaw at likas na Tagalog.
- source_word: πάλιν
  choice: Muli
  rationale: Malinaw na nagpapakita ng pag-uulit sa pagtatanong ng punong pari.
- source_word: ἀρχιερεὺς
  choice: punong pari
  rationale: Karaniwan at tiyak na katawagan sa pinakamataas na katungkulang makapari ng mga Judio sa kontekstong ito.
- source_word: ἐπηρώτα
  choice: tinanong
  rationale: Ang imperpekto ay maaaring magpahiwatig ng nagpapatuloy o inuulit na pagtatanong; sa konteksto, ang likas na Tagalog na “tinanong” kasama ng “Muli” ay sapat nang naghahatid nito nang hindi nagpapasidhi sa diwa tungo sa “inimbestigahan.”
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman historikal na pangkasalukuyan ang Griyego, mas likas sa salaysay na Tagalog ang nakaraang panahunan; hindi nito binabago ang nilalaman o sigla ng tuwirang tanong.
- source_word: χριστός
  choice: Mesiyas
  rationale: Dito ay isang titulong Judio na tumutukoy sa inaasahang pinahiran, kaya mas malinaw sa konteksto ang “Mesiyas” kaysa sa pangalang wari'y “Cristo.”
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: ang Anak ng Pinagpala
  rationale: Pinananatili ang magalang na paraang Judio ng pagtukoy sa Diyos sa halip na tahasang palitan ito ng “Diyos.”
theological_decisions:
- issue: Paglalahad sa Χριστός bilang tuwirang titulong mesiyaniko
  choice: Mesiyas
  alternative: Cristo
  rationale: Sa tanong ng punong pari, gumaganap ang salita bilang titulo sa kontekstong Judio. Ang “Mesiyas” ang mas tuwirang naghahatid ng tungkulin nito habang kinikilala sa talababa ang tradisyonal na katumbas.
- issue: Paglalahad sa τοῦ εὐλογητοῦ
  choice: ang Pinagpala
  alternative: ang Diyos
  rationale: Pinananatili nito ang magalang at di-tahasang pagtukoy sa Diyos na nasa Griyego at ang kulturang Judio ng tagpo, sa halip na linawin nang higit sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “punong pari,” “Mesiyas,” at “Pinagpala” upang mapanatili ang historikal at teolohikal na kulay ng paglilitis. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
