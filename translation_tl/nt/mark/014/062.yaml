id: MRK.14.62
reference: Mark 14:62
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: tl
  text: At sinabi ni Jesus, “Ako nga.[a] At makikita ninyo ang Anak ng Tao na nakaupo sa kanan ng Kapangyarihan[b] at dumarating na kasama ng mga ulap ng langit.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, “Ako ay,” na walang kasunod na panaguri; maaari rin itong unawaing “Ako iyon.”
    reason: alternative_reading
  - marker: b
    text: Ang “Kapangyarihan” ay isang mapitagang paraan ng pagtukoy sa Diyos.
    reason: cultural_note
  - marker: c
    text: Umaalingawngaw rito ang Awit 110:1 at Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ako nga
  rationale: Sa konteksto, tuwirang pinagtitibay ni Jesus ang sagot sa tanong ng pinakapunong pari. Likas sa makabagong Tagalog ang “Ako nga” bilang mariing pagsang-ayon, nang hindi tahasang dinaragdagan ng isang titulo ang pangungusap. Ipinaliliwanag sa talababa ang mas literal at sadyang walang panaguring anyo ng Griyego.
- source_word: ὄψεσθε
  choice: makikita ninyo
  rationale: Tuwiran at natural na katumbas ng panghinaharap na pandiwa; pinananatili rin nito ang tuwirang pahayag sa maramihang kausap.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang kinagawiang sariling katawagan ni Jesus at ang kaugnayan nito sa Daniel 7.
- source_word: ἐκ δεξιῶν
  choice: sa kanan ng
  rationale: Likas na biblikal na idyoma sa Tagalog para sa marangal na lugar ng awtoridad, nang hindi ito pinalalawak sa isang paliwanag sa mismong teksto.
- source_word: τῆς δυνάμεως
  choice: Kapangyarihan
  rationale: Pinananatili ang mapitagang di-tuwirang pagtukoy sa Diyos sa halip na palitan ito ng “Diyos.” Ginawang malaking titik upang ipahiwatig na natatangi ang tinutukoy.
- source_word: καθήμενον
  choice: nakaupo
  rationale: Tuwirang inilalarawan ang kalagayan ng Anak ng Tao. Hindi isinalin bilang “nakaluklok” upang hindi gawing tahasan ang ipinahihiwatig na paghahari na nasa konteksto ngunit wala sa mismong pandiwa.
- source_word: ἐρχόμενον
  choice: dumarating
  rationale: Pinananatili ang kilos at ang apokaliptikong alingawngaw ng Daniel 7 nang walang dagdag na paliwanag.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: kasama ng mga ulap ng langit
  rationale: Malapit sa estruktura at larawan ng Griyego at pinananatili ang mataas na rehistrong angkop sa Daniel 7.
- source_word: καὶ ... καὶ
  choice: At ... at
  rationale: Pinananatili ang sunod-sunod at pinagsama-samang diin ng pagsagot, pag-upo sa kanan, at pagdating.
theological_decisions:
- issue: Kung ang Ἐγώ εἰμι ay dapat gawing simpleng pagsang-ayon o tahasang pagkakakilanlan
  choice: “Ako nga” sa pangunahing teksto, na may literal na anyo sa talababa
  alternative: “Ako iyon” o “Ako ay”
  rationale: Ang “Ako nga” ay natural na mariing sagot sa Tagalog at hindi nagdaragdag ng tiyak na titulo. Itinatala ng talababa na walang hayag na panaguri ang Griyego, kaya hindi ikinukulong ang pahayag sa isang teolohikal na pagpapakahulugan.
- issue: Kung tahasang papalitan ng “Diyos” ang τῆς δυνάμεως
  choice: Kapangyarihan
  alternative: Diyos; ang Makapangyarihan
  rationale: Ang Griyego ay gumagamit ng mapitagang di-tuwirang katawagan. Ang pagpapanatili nito ay gumagalang sa paraan ng pagpapahayag ng pinagmulan at sa tensiyong teolohikal ng tagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinakapunong pari” sa paliwanag lamang at hindi sa teksto ng talata. Pinanatili ang mga titulong “Anak ng Tao” at “Kapangyarihan,” gayundin ang apokaliptikong larawang “mga ulap ng langit,” upang huwag patagin ang mga alusyon sa Kasulatan.
