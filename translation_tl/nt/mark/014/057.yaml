lexical_decisions:
- source_word: καί
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay ni Marcos.
- source_word: τινες
  choice: may ilan
  rationale: Natural sa modernong Filipino at pinananatiling di-tiyak ang pagkakakilanlan at bilang ng mga tao.
- source_word: ἀναστάντες
  choice: tumayo
  rationale: Tuwirang inilalarawan ang pagkilos ng mga saksi sa kontekstong paglilitis.
- source_word: ἐψευδομαρτύρουν
  choice: nagbigay ng huwad na patotoo
  rationale: Malinaw na ipinahahayag ang legal na diwa ng pandiwa. Bagaman imperfect ang anyong Griyego, sa Filipino ay maaaring katawanin ng aspektong naganap ang nagpapatuloy o paulit-ulit na kilos ayon sa konteksto.
- source_word: κατ’ αὐτοῦ
  choice: laban sa kanya
  rationale: Ipinapakita ang adversatibong puwersa ng κατά na may genitive sa kontekstong legal.
- source_word: λέγοντες
  choice: na sinasabi,
  rationale: Ipinakikilala ang nilalaman ng patotoong susunod habang malinaw na iniuugnay ito sa mga taong tumayo.
