  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: tl
  text: Tumayo kayo; humayo tayo. Narito, lumapit na ang nagkakanulo[a] sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang naghahatid sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bumangon kayo
  rationale: Pautos na pangmaramihan. Sa konteksto, hinihimok ni Jesus ang mga alagad na tumayo at kumilos, hindi lamang na magising.
- source_word: ἄγωμεν
  choice: umalis na tayo
  rationale: Hortatoryong subjunctive na likas isalin sa makabagong Tagalog bilang sama-samang paanyayang umalis o humayo.
- source_word: ἰδού
  choice: Tingnan ninyo
  rationale: Panawag-pansin ito sa nalalapit na pangyayari; malinaw at natural ang “Tingnan ninyo” sa kasalukuyang Tagalog.
- source_word: ὁ παραδιδούς
  choice: ang nagkakanulo
  rationale: Artikular na present participle na tumutukoy sa taong kasalukuyang nagkakanulo kay Jesus. Ipinahihiwatig ng konteksto ang pagtataksil, habang inilalagay sa talababa ang mas literal na diwang paghahatid o pagsasalin sa kamay ng iba.
- source_word: με
  choice: sa akin
  rationale: Likas na anyong Tagalog para sa tuwirang layon ng pandiwang “nagkakanulo.”
- source_word: ἤγγικεν
  choice: malapit na
  rationale: Ang perfect indicative ay nagsasaad ng paglapit na umabot na sa kasalukuyang kalagayan; pinananatili ng “malapit na” ang diwa ng agarang pagdating nang hindi ito pinatitinding lubos bilang “dumating na.”
theological_decisions:
- issue: Kahulugan ng παραδίδωμι sa salaysay ng pagpapakasakit
  choice: nagkakanulo
  alternative: naghahatid sa akin sa kamay ng iba
  rationale: Dahil si Judas ang tinutukoy, tunay na nasa konteksto ang moral at relasyonal na diwa ng pagkakanulo. Gayunman, hindi ikinukubli ang mas literal na diwa ng paghahatid o pagbibigay sa kamay ng iba, kaya inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “kayo” at “ninyo” ayon sa mga anyong Griyego, at iniwasan ang makaluma o labis na pansimbahang pananalita.
