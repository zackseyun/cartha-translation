  source_fidelity: Ang draft ay wastong nagpapahayag ng pangmaramihang utos na tumayo at ng paanyayang sama-samang lumisan. Gayunman, ang “malapit na” ay higit na katumbas ng kasalukuyang kalagayang “is near”; ang perfect na ἤγγικεν ay mas tuwirang naipapahayag ng “lumapit na.” Ang idinagdag na “sa kamay ng iba” sa talababa ay wala sa mismong pananalita ng Griyego.
  naturalness: 'Natural at malinaw ang rebisyon: “Tumayo kayo; humayo tayo. Narito, lumapit na ang nagkakanulo sa akin.” Ang “Narito” ay marangal ngunit ginagamit pa rin sa makabagong Filipino bilang panawag-pansin, at mas idiomatiko rito kaysa sa “Tingnan ninyo” na walang tuwirang bagay na tinitingnan.'
  terminology: Ang “nagkakanulo” ay angkop sa konteksto ni Judas at pinananatili ang anyong participial ng ὁ παραδιδούς. Iniaayos ang talababa upang magbigay lamang ng leksikal na alternatibo (“naghahatid sa akin”) nang hindi nagdaragdag ng elementong “sa kamay ng iba.”
  issues:
