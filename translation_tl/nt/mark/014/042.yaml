  - severity: medium
    issue: Nagdagdag ang talababa ng “sa kamay ng iba.”
    rationale: Walang katumbas na pariralang “sa kamay ng iba” sa Griyego. Maaaring ipaliwanag ng παραδίδωμι ang paghahatid o pagbigay, ngunit hindi dapat idagdag ang tatanggap na ito sa literal na alternatibo.
  - severity: low
    issue: Ang “Tingnan ninyo” ay bahagyang alanganin bilang panawag-pansin sa pangungusap na ito.
    rationale: Ang ἰδού ay deiktikong interjection; ang “Narito” ay mas maikli at tuwirang panandang nagbibigay-pansin sa kasunod na pahayag.
  revised_text: Tumayo kayo; humayo tayo. Narito, lumapit na ang nagkakanulo[a] sa akin.
