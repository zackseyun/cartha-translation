  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: tl
  text: Sapagkat lagi ninyong kasama ang mga dukha, at sa tuwing gusto ninyo, kaya ninyong gumawa ng mabuti para sa kanila[a]; ngunit hindi ninyo ako laging kasama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang idyomang Griyego ay tumutukoy sa pagkilos para sa kanilang ikabubuti, hindi lamang sa pagkakaroon ng mabuting kalooban sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: lagi / laging
  rationale: Likas at malinaw sa modernong Tagalog, at pinananatili ang pag-uulit at paghahambing sa dalawang sugnay.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Ipinapakita nitong ang pangungusap ay paliwanag sa naunang sinabi, nang hindi dinaragdagan ang lohika ng teksto.
- source_word: τοὺς πτωχούς
  choice: ang mga dukha
  rationale: Tumutukoy sa mga taong kapos sa materyal na pangangailangan. Ang “mga dukha” ay maikli, marangal, at pamilyar sa rehistrong biblikal nang hindi nagiging lipas.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: ninyong kasama
  rationale: Natural na Tagalog para sa patuloy na presensiya at pagiging abot-kamay ng mga tinutukoy.
- source_word: ὅταν θέλητε
  choice: kailan ninyo gustuhin
  rationale: Pinananatili ang di-tiyak at bukas na panahong ipinahihiwatig ng ὅταν kasama ng subjunctive.
- source_word: δύνασθε
  choice: magagawa ninyo
  rationale: Malinaw na nagsasaad ng kakayahan at umaayon sa natural na ayos ng pangungusap sa Tagalog.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: silang gawan ng mabuti
  rationale: Pinananatili ang idyomang nangangahulugang kumilos para sa kanilang kapakinabangan, hindi lamang makadama ng mabuting kalooban.
- source_word: ἐμὲ δὲ
  choice: ngunit ... ako
  rationale: Malinaw na ipinakikita ng “ngunit” ang paghahambing kay Jesus at sa mga dukha.
- source_word: οὐ πάντοτε ἔχετε
  choice: hindi ninyo ... laging kasama
  rationale: Pinananatili ang pangkasalukuyang anyo at ang tuwirang paghahambing tungkol sa presensiya, sa halip na gawing tahasang panghinaharap.
theological_decisions:
- issue: Maaaring ipakahulugang minamaliit ni Jesus ang pagkalinga sa mga dukha
  choice: Pinanatili ang paghahambing sa palagiang presensiya ng mga dukha at sa hindi palagiang presensiya ni Jesus, habang hayagang iniiwan sa teksto ang patuloy na pagkakataong gumawa ng mabuti sa kanila.
  alternative: Ipakahulugang isinasaisantabi ni Jesus ang malasakit sa mga dukha alang-alang sa debosyon sa kaniya.
  rationale: Mismong sugnay na “kailan ninyo gustuhin, magagawa ninyo silang gawan ng mabuti” ang nagpapatibay sa patuloy na pagkakataon para sa pagkakawanggawa. Hindi nilulutas nang lampas sa teksto ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mga dukha” para sa maikli at pamilyar na katawagan, at “gawan ng mabuti” upang mapanatili ang lawak ng idyomang Griyego nang hindi ito nililimitahan sa pagbibigay ng limos.
