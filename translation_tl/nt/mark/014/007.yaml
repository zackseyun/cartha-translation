  source_fidelity: Tumpak na naihahatid ng draft ang paliwanag na γάρ, ang patuloy na presensiya ng mga dukha, ang di-tiyak na panahon sa ὅταν θέλητε, ang kakayahan sa δύνασθε, at ang paghahambing sa limitadong presensiya ni Jesus. Gayunman, ang "kailan ninyo gustuhin" ay hindi likas na paraan upang ipahayag ang paulit-ulit at di-tiyak na "whenever you want" sa modernong Tagalog.
  naturalness: Kailangan ng maliit ngunit makabuluhang pag-aayos. Mas natural ang "sa tuwing gusto ninyo," at mas malinaw ang idyoma sa "kaya ninyong gumawa ng mabuti para sa kanila" kaysa "magagawa ninyo silang gawan ng mabuti."
  terminology: Ang "mga dukha" ay angkop, marangal, at nauunawaan sa modernong Filipino Tagalog. Ang "gumawa ng mabuti para sa kanila" ay hindi nililimitahan ang εὖ ποιῆσαι sa limos o isang partikular na uri ng pagtulong.
  issues:
