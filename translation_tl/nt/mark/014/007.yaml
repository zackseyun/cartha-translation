    issue: Medyo mabigat at hindi idiomatiko ang "magagawa ninyo silang gawan ng mabuti."
    rationale: Ang magkakasunod na "magagawa" at "gawan" ay hindi makinis sa modernong Tagalog. Ang "kaya ninyong gumawa ng mabuti para sa kanila" ay malinaw na naghahayag ng kakayahan at ng pagkilos para sa kanilang ikabubuti.
