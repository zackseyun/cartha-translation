  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: tl
  text: Habang nakahilig sila sa hapag[a] at kumakain, sinabi ni Jesus, “Sinasabi ko sa inyo ang totoo,[b] isa sa inyo ang magkakanulo sa akin[c]—isang kasabay kong kumakain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang nakahilig na pustura ang kinaugaliang posisyon sa isang pormal na pagkain noong panahong iyon.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “Amen, sinasabi ko sa inyo.”'
    reason: lexical_alternative
  - marker: c
    text: O “ibibigay ako” o “isusuko ako.” Maaaring mangahulugan ang pandiwang Griyego na ibigay, isuko, o ipasa ang isang tao; dito, tumutukoy ito sa pagtataksil ng isa sa mga kasamahan ni Jesus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: nakahilig sila sa hapag
  rationale: Tumutukoy ito sa kinaugaliang posisyon sa pormal na pagkain noong sinaunang panahon. Pinananatili ng “nakahilig sa hapag” ang makasaysayang tagpo nang hindi ipinapalagay na nakaupo sila gaya sa makabagong hapag.
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: kumakain / isa na kumakaing kasama ko
  rationale: Payak na nangangahulugang “kumain” ang pandiwa. Isinalin ang huling articular participle bilang pariralang naglalarawan sa “isa,” ayon sa estruktura ng Griyego.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Likas at marangal itong pormulasyon sa makabagong Tagalog para sa taimtim at may-awtoridad na pambungad ni Jesus. Nasa talababa ang mas literal na anyo.
- source_word: εἷς ἐξ ὑμῶν
  choice: isa sa inyo
  rationale: Ito ang natural na Tagalog para sa partitive expression at malinaw na nagsasabing kabilang sa pangkat ang tinutukoy.
- source_word: παραδώσει
  choice: magkakanulo sa akin
  rationale: Bagaman ang pandiwa ay maaaring literal na mangahulugang “ipasa” o “ibigay sa kapangyarihan ng iba,” ipinahihiwatig ng konteksto ang mapanlinlang na pagsuko ni Jesus ng isang malapit na kasalo. Pinananatili sa talababa ang mas literal na alternatibo.
- source_word: μετ’ ἐμοῦ
  choice: kasama ko
  rationale: Direkta at natural na katumbas ng simpleng pagpapahayag ng pagsama.
theological_decisions:
- issue: Kahulugan ng παραδώσει sa pahayag tungkol sa paghihirap ni Jesus
  choice: magkakanulo sa akin
  alternative: ibibigay ako sa kamay ng iba
  rationale: Malinaw na ipinakikita ng konteksto ang pagtataksil ng isang kasalong malapit kay Jesus, ngunit hindi nililimitahan ng salin ang saklaw ng pandiwa nang walang paliwanag; ibinibigay sa talababa ang mas literal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang sinaunang posisyon sa pagkain sa halip na gawing “nakaupo,” at nilinaw ito sa talababa. Ginamit ang “Tinitiyak ko sa inyo” bilang natural na taimtim na pormula, habang pinanatili ang “Amen” sa talababa. Ang hulíng parirala ay nananatiling appositional at hindi tinutukoy kung sino ang magkakanulo.
