  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: tl
  text: Narinig ninyo ang paglapastangan sa Diyos. Ano ang palagay ninyo?[a] At hinatulan nilang lahat na karapat-dapat siyang mamatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ano ang pasya ninyo?”
    reason: lexical_alternative
  - marker: b
    text: O, “na nararapat siyang hatulan ng kamatayan,” o “na dapat siyang mamatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Narinig ninyo
  rationale: Ang aorist indicative ay natural na naihahayag sa payak na nagdaang aspekto sa Tagalog at tumutukoy sa kapapakinggan pa lamang nila.
- source_word: τῆς βλασφημίας
  choice: ang paglapastangan sa Diyos
  rationale: Pinananatili nito ang bigat ng paratang na panrelihiyon at panghukuman. Nililinaw ng “sa Diyos” ang karaniwang diwa ng βλασφημία sa kontekstong ito nang hindi sinasang-ayunan ng tagapagsalaysay ang paratang.
- source_word: τί ὑμῖν φαίνεται
  choice: Ano ang palagay ninyo?
  rationale: Ito ang natural at kasalukuyang Tagalog para sa idyomang humihingi ng kanilang opinyon o hatol, habang hindi labis na tinutukoy kung payo lamang o pormal na pasya ang hinihingi.
- source_word: οἱ δὲ πάντες
  choice: At ... nilang lahat
  rationale: Hayagang pinananatili ang diin ng πάντες sa pagkakaisa ng lahat ng naroon sa paghatol.
- source_word: κατέκριναν
  choice: hinatulan
  rationale: Ang κατακρίνω ay terminong panghukuman para sa pagpapahayag na ang isang tao ay may sala o nararapat parusahan.
- source_word: ἔνοχον εἶναι θανάτου
  choice: na karapat-dapat siyang mamatay
  rationale: Malinaw nitong ipinahahayag sa modernong Tagalog na itinuring siyang nararapat sa parusang kamatayan, habang iniiwasan ang di-likas na literalismong “may sala ng kamatayan.”
theological_decisions:
- issue: Ang paratang na βλασφημία sa paglilitis
  choice: paglapastangan sa Diyos
  alternative: kalapastanganan
  rationale: Ipinakikita ng talata ang paratang ng kapulungan, hindi ang pagsang-ayon ng tagapagsalaysay na makatarungan iyon. Pinananatili ng salin ang bigat ng paratang nang hindi nilulutas ang teolohikal na tensiyon.
- issue: Ang diwa ng ἔνοχον εἶναι θανάτου
  choice: karapat-dapat siyang mamatay
  alternative: nararapat siyang hatulan ng kamatayan
  rationale: Pinananatili ang pahayag na nagkakaisa silang itinuring siyang saklaw ng parusang kamatayan, ngunit hindi nagdaragdag ng detalye tungkol sa eksaktong legal na kapangyarihan nila.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “paglapastangan sa Diyos” upang maunawaan agad ng karaniwang mambabasa ang bigat ng βλασφημία, at “Ano ang palagay ninyo?” bilang natural na tanong na maaari ring magkaroon ng diwang panghukuman sa konteksto.
