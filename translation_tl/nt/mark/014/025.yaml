base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: tl
  text: 'Katotohanang sinasabi ko sa inyo: hinding-hindi[a] na ako iinom mula sa bunga ng ubas[b] hanggang sa araw na iyon, kapag iinumin ko itong bago[c] sa kaharian ng Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mariin ang pagtanggi sa Griyego; maaari ring isaling, “tiyak na hindi na ako muling iinom.”
    reason: lexical_alternative
  - marker: b
    text: “Bunga ng ubas” ang pahayag sa Griyego; tumutukoy ito sa inuming mula sa ubas na ginagamit sa hapag.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring unawain na “muli” o “sa panibagong paraan.” Maaaring ipinahihiwatig ng “bago” ang bagong kalagayan sa kaharian ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Tinitiyak ko sa inyo
  rationale: Likas at marangal na pormula sa modernong Tagalog para sa taimtim na pahayag; malinaw nitong naihahatid ang bigat ng ἀμήν at ang tuwirang pakikipag-usap ng λέγω ὑμῖν.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: hinding-hindi na ako iinom
  rationale: Ang “hinding-hindi” ay naghahatid ng mariing pagtanggi ng οὐ μή, habang ang “na” ay nagpapahayag ng temporal na diwa ng οὐκέτι.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: mula sa bunga ng puno ng ubas
  rationale: Pinananatili ang konkretong idyoma ng Griyego at hindi ito nililimitahan sa salitang “alak,” na hindi tahasang ginamit sa talata.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: hanggang sa araw na iyon
  rationale: Tuwirang pinananatili ang temporal na hangganan at ang diin ng demonstratibong ἐκείνης.
- source_word: ὅταν αὐτὸ πίνω
  choice: kapag ininom ko ito
  rationale: Ang “kapag” ay angkop sa tiyak ngunit panghinaharap na pangyayari; ang aspektong anyong “ininom” ay mas natural sa Tagalog sa sugnay na ito kaysa “iinumin” pagkatapos ng “kapag.”
- source_word: καινὸν
  choice: bago
  rationale: Tuwirang pinananatili ang kwalitatibong posibilidad ng καινός nang hindi nagpapasya kung ang ibig sabihin ay “muli” o bago sa uri/kalagayang eskatolohikal.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: sa kaharian ng Diyos
  rationale: Karaniwan, malinaw, at teolohikal na tapat na salin ng parirala.
theological_decisions:
- issue: Kahulugan at ugnayan ng καινὸν
  choice: “itong bago,” na tumutukoy sa bunga/inumin bilang bago
  alternative: “muli” o “sa panibagong paraan”
  rationale: Ang Griyegong καινόν ay akusatibong pang-uri na tumutugma sa αὐτό at maaaring magpahiwatig ng bagong kalidad o kalagayan. Hindi tahasang nililinaw ng teksto kung simpleng muling pag-inom o eskatolohikal na pagbabago ang diin, kaya pinanatili ang “bago” at ipinaliwanag ang alternatibo sa talababa.
- issue: Tinutukoy ng “bunga ng puno ng ubas”
  choice: Pinanatili ang idyoma sa halip na isaling “alak”
  alternative: alak
  rationale: Bagaman tumutukoy ito sa inumin sa hapag, hindi tahasang ginagamit ng Griyego ang salita para sa alak. Iniiwasan ng salin ang labis na pagtukoy.
- issue: Lakas ng panghinaharap na pagtanggi
  choice: “hinding-hindi na ako iinom”
  alternative: “hindi na ako iinom”
  rationale: Ang dobleng kayariang οὐκέτι οὐ μή ay mariin; kailangang marinig sa Tagalog ang katiyakan at ganap na pagtanggi nang hindi binabago ang temporal na hangganang ipinahahayag ng “hanggang.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Tinitiyak ko sa inyo” bilang natural na taimtim na pormula, at “hinding-hindi” upang marinig ang mariing Griyegong pagtanggi. Pinanatili ang idyomang “bunga ng puno ng ubas” at ang sadyang bukas na diwa ng “bago.”
