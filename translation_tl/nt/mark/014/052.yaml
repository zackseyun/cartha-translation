  text: ὁ δὲ καταλιπὼν τὴν σινδόνα γυμνὸς ⸀ἔφυγεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: tl
  text: Ngunit iniwan niya ang telang lino at tumakas na hubad.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapin na lino” o “damit na lino” para sa “telang lino” (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: Ang “hubad” (γυμνός) ay maaari ring mangahulugang kulang sa damit sa ilang konteksto, ngunit dito ay ipinahihiwatig na nakatakas siya nang wala ang telang suot niya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang pagtatangkang dakpin siya; natural sa salaysay ang “Ngunit.”
- source_word: καταλιπὼν
  choice: iniwan
  rationale: Ang aorist participle ng καταλείπω ay tumutukoy sa pag-iwan sa tela upang makatakas; malinaw at likas sa Tagalog ang “iniwan.”
- source_word: σινδόνα
  choice: telang lino
  rationale: Ang σινδών ay telang lino na maaaring sapin o kasuutan. Hindi tinutukoy ng “telang lino” nang labis ang eksaktong anyo nito.
- source_word: γυμνὸς
  choice: hubad
  rationale: Pinakanatural dito ang literal na kahulugang “hubad,” yamang iniwan niya ang telang suot niya; pinananatili sa talababa ang posibilidad na sa ibang konteksto ay kulang lamang sa damit.
- source_word: ἔφυγεν
  choice: tumakas
  rationale: Ang φεύγω ay pagtakbo palayo o pagtakas. Naipapahayag ng “tumakas” ang agarang pag-iwas niya sa pagkakadakip.
