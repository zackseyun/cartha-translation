  naturalness: Kailangan ang “Sa unang araw,” hindi “At nang unang araw.” Mas natural at malinaw ang “pumunta kami upang ihanda ang Paskuwa” kaysa “pumunta kami at maghanda,” sapagkat malinaw nitong inilalahad ang bagay na inihahanda nang hindi binabago ang diwa.
  terminology: Ang “Tinapay na Walang Pampaalsa,” “Paskuwa,” at “kordero ng Paskuwa” ay angkop sa marangal na makabagong Tagalog. Ang “naghahain sila” ay isang ligtas na pagsasalin ng di-ganap na ἔθυον sa kontekstong paghahandog.
