  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: tl
  text: Sa unang araw ng Tinapay na Walang Pampaalsa, nang naghahain sila ng kordero ng Paskuwa,[a] sinabi sa kanya ng kanyang mga alagad, “Saan mo gustong pumunta kami upang ihanda ang Paskuwa para makain mo ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nang naghahain sila ng Paskuwa.” Sa Griyego ay “ang Paskuwa,” na sa kontekstong ito ay malamang na tumutukoy sa kordero ng Paskuwa na inihahain.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: nang unang araw ng Tinapay na Walang Pampaalsa
  rationale: Likas na salin ng konstruksiyong genitibo at pinananatili ang katawagan sa pagdiriwang nang hindi idinaragdag ang salitang ‘Pista,’ na wala sa Griyego.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: nang inihahain nila ang kordero ng Paskuwa
  rationale: Ipinahihiwatig ng imperfect na ἔθυον ang nagaganap na gawain. Sa piling ng pandiwang ‘maghain,’ ang πάσχα ay tumutukoy sa hayop na inihahain, kaya ginawang malinaw na ‘kordero ng Paskuwa.’
- source_word: λέγουσιν
  choice: sinabi
  rationale: Ang kasalukuyang panahunan sa Griyego ay historikal na kasalukuyan; mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Ποῦ θέλεις
  choice: Saan mo gustong
  rationale: Ang θέλω ay nagpapahayag dito ng kagustuhan o layunin; natural at makabago ang ‘gusto.’
- source_word: ἀπελθόντες
  choice: pumunta kami
  rationale: Isinama ang participle sa tanong bilang likas na Tagalog, habang pinananatili ang pagkakasunod ng pagpunta at paghahanda.
- source_word: ἑτοιμάσωμεν
  choice: maghanda
  rationale: Maikli at natural na katumbas na angkop sa paghahanda para sa Paskuwa.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: upang makakain ka ng Paskuwa
  rationale: Ang ‘upang’ ay malinaw na naghahayag ng layunin. Dito, ang πάσχα ay tumutukoy sa pagkaing Paskuwa o pagdiriwang na kinakain, hindi sa paghahain.
theological_decisions:
- issue: Tinutukoy ng dalawang paglitaw ng πάσχα sa talata
  choice: Ang una ay ‘kordero ng Paskuwa’ sa konteksto ng paghahain; ang ikalawa ay ‘Paskuwa’ sa konteksto ng pagkain.
  alternative: Isalin ang dalawang paglitaw bilang ‘Paskuwa’ lamang, o kapwa bilang ‘kordero ng Paskuwa.’
  rationale: 'Ang kasamang pandiwa ang nagtatakda ng diwa: sa θύω, ang tinutukoy ay ang handog na hayop; sa φάγῃς, ang tinutukoy ay ang pagkaing Paskuwa. Leksikal at kontekstuwal ang pasyang ito at hindi doktrinal na pagpapakahulugan.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘Tinapay na Walang Pampaalsa’ bilang katawagan sa pagdiriwang at ang karaniwang anyong ‘Paskuwa.’
