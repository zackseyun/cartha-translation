  to: Sa unang araw ng Tinapay na Walang Pampaalsa, nang naghahain sila ng kordero ng Paskuwa,[a] sinabi sa kanya ng kanyang mga alagad, “Saan mo gustong pumunta kami upang ihanda ang Paskuwa para makain mo ito?”
  rationale: Inayos ang pambungad upang maging gramatikal at likas sa Tagalog. Ginawang “naghahain sila” ang di-ganap na pandiwa upang mapanatili ang aspektong nagaganap o nakagawiang gawain. Nilinaw ang layon ng “ihanda” batay sa konteksto, habang pinanatili ang pagkakaiba ng “kordero ng Paskuwa” sa paghahain at “Paskuwa” bilang pagkaing kakainin. Nananatili ang footnote anchor at ang leksikal na alternatibo.
