  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: tl
  text: Ngunit muli niya itong itinanggi. Makalipas ang kaunting sandali, muling sinabi ng mga nakatayo roon kay Pedro, “Tiyak na isa ka sa kanila, sapagkat taga-Galilea ka rin, at ang paraan mo ng pagsasalita ay katulad ng sa kanila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May ilang manuskrito na walang mga salitang “at ang paraan mo ng pagsasalita ay katulad ng sa kanila.”
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: muli niya itong itinanggi
  rationale: Ipinahihiwatig ng imperpektibo ang nagpapatuloy o inuulit na pagkakaila; likas sa Tagalog ang ganitong ayos, at ang “ito” ay tumutukoy sa paratang na nasa konteksto.
- source_word: μετὰ μικρὸν
  choice: makalipas ang kaunting sandali
  rationale: Likas at malinaw na paglilipat ng idyomang tumutukoy sa maikling lumipas na panahon.
- source_word: οἱ παρεστῶτες
  choice: mga nakatayo roon
  rationale: Pinananatili ang konkretong diwa ng mga taong nakatayo o naroroon sa tabi, nang hindi labis na nagpapakahulugan.
- source_word: ἔλεγον
  choice: muling sinabi
  rationale: Bagaman imperpektibo ang Griyego at maaaring magpahiwatig ng nagpapatuloy o paulit-ulit na pagsasalita, ang simpleng “sinabi” ay mas likas sa salaysay na Tagalog; naipakikita na ng “muli” ang pag-uulit.
- source_word: Ἀληθῶς
  choice: Tiyak na
  rationale: Nagpapahayag ng matibay at may katiyakang paggigiit sa natural na direktang pananalita.
- source_word: ἐξ αὐτῶν εἶ
  choice: isa ka sa kanila
  rationale: Malinaw at idyomatikong ipinahahayag ang pagiging kabilang ni Pedro sa pangkat na kaugnay ni Jesus.
- source_word: καὶ γὰρ
  choice: sapagkat ... rin
  rationale: Inilalahad ng “sapagkat” ang dahilan, habang pinananatili ng “rin” ang dagdag na diwa ng καί.
- source_word: Γαλιλαῖος
  choice: taga-Galilea
  rationale: Karaniwang modernong Tagalog para sa isang taong nagmula sa Galilea.
- source_word: ἡ λαλιά σου
  choice: ang paraan ng pagsasalita mo
  rationale: Sapat ang lawak nito upang masaklaw ang paraan ng pagsasalita, diyalekto, o punto nang hindi ito nililimitahan sa “accent” lamang.
- source_word: ὁμοιάζει
  choice: katulad din
  rationale: Pinananatili ang payak na diwa ng pagkakatulad; ipinahihiwatig ng konteksto na katulad ito ng pananalita ng mga taga-Galilea o ng pangkat.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “paraan ng pagsasalita” upang mapanatili ang saklaw ng λαλιά, at iniwasang tukuyin lamang ito bilang punto o accent. Inilagay ang panandang [a] pagkatapos ng sugnay na pinagtatalunan sa mga manuskrito.
