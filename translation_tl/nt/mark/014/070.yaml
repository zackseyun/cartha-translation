revisions:
- from: Ngunit muli niya itong itinanggi. Makalipas ang kaunting sandali, muling sinabi kay Pedro ng mga nakatayo roon, “Tiyak na isa ka sa kanila, sapagkat taga-Galilea ka rin, at katulad din ang paraan ng pagsasalita mo.”[a]
  to: Ngunit muli niya itong itinanggi. Makalipas ang kaunting sandali, muling sinabi ng mga nakatayo roon kay Pedro, “Tiyak na isa ka sa kanila, sapagkat taga-Galilea ka rin, at ang paraan mo ng pagsasalita ay katulad ng sa kanila.”[a]
  rationale: Inayos ang huling sugnay upang maging ganap at likas sa Tagalog habang nililinaw lamang ang paghahambing na ipinahihiwatig ng konteksto. Inalis ang hindi kinakailangang “din” sa huling sugnay at inayos ang pagkakasunod ng simuno at layon para sa mas maayos na daloy. Napanatili ang pananda ng talababa sa eksaktong sugnay na may tekstuwal na baryante.
