  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: tl
  text: Nagsimula silang malungkot at magsabi sa kanya, isa-isa, “Hindi naman ako, di ba?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Hindi ba ako?” Ang salitang Griyego na μήτι ay nagpapahiwatig na inaasahan ng nagtatanong ang sagot na “hindi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Nagsimula sila
  rationale: Ipinahahayag ng aorist na may kasunod na mga infinitive ang pagsisimula ng kanilang pagkalungkot at pagsasalita.
- source_word: λυπεῖσθαι
  choice: malungkot
  rationale: Likas at kasalukuyang Tagalog ito para sa pagdanas ng dalamhati sa kontekstong ito, nang hindi dinaragdagan ang tindi ng salitang Griyego.
- source_word: καὶ λέγειν αὐτῷ
  choice: at ... nagsabi sa kanya
  rationale: Pinananatili ang payak na pandiwang ‘magsabi’ at ang panghalip na tumutukoy kay Jesus, sa halip na gawing tahasang ‘nagtanong kay Jesus.’
- source_word: εἷς κατὰ εἷς
  choice: isa-isang
  rationale: Natural at maikling katumbas ng pahayag na namamahagi at nagpapahiwatig na bawat isa ay nagsalita nang sunod-sunod.
- source_word: Μήτι ἐγώ;
  choice: Hindi naman ako, di ba?
  rationale: Ipinahihiwatig ng μήτι na inaasahan ng nagsasalita ang sagot na hindi; ang hulaping ‘di ba?’ ay natural na naghahatid ng ganitong inaasahang pagtanggi sa modernong Tagalog.
theological_decisions:
- issue: Lakas ng tanong ng mga alagad
  choice: 'Iniharap bilang tanong na umaasang ‘hindi’ ang sagot: “Hindi naman ako, di ba?”'
  alternative: “Ako ba?”
  rationale: Ang μήτι ay nagpapahiwatig ng inaasahang negatibong sagot. Kung “Ako ba?” lamang, mawawala ang himig ng pagkabahala at umaasang pagtanggi, ngunit hindi rin dapat dagdagan kung sino o ano ang tinutukoy nang higit sa eliptikong Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “di ba?” sa mismong pananalita upang maipahayag nang malinaw at karaniwan ang inaasahang negatibong sagot; ang paliwanag sa talab ng μήτι ay inilagay sa talababa.
