base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: tl
  text: Ngunit sinabi ni Pedro sa kanya, “Kahit tumalikod[a] silang lahat, hindi ako tatalikod.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matisod.” Ang pandiwang Griyego ay maaari ring mangahulugang matisod, mapatisod, o tumalikod.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahahayag ang malinaw na pagsalungat ni Pedro sa naunang sinabi ni Jesus.
- source_word: ἔφη αὐτῷ
  choice: sinabi ni Pedro sa kanya
  rationale: Pinananatili ang karaniwang pandiwa ng pagsasalita at ang panghalip na tumutukoy kay Jesus.
- source_word: Εἰ καὶ
  choice: Kahit
  rationale: Likas na Filipino para sa kondisyunal na pagpapalagay na may diwang pagpapal concessive na ‘even if.’
- source_word: πάντες
  choice: silang lahat
  rationale: Tumutukoy sa buong pangkat ng mga alagad sa konteksto; nililinaw ng ‘sila’ ang kaibahan ni Pedro sa iba.
- source_word: σκανδαλισθήσονται
  choice: tumalikod
  rationale: Sa konteksto ng pag-iwan kay Jesus, ipinahahayag nito ang malubhang pagkabigo at paglayo, nang hindi ipinipilit na ito ay pangwakas na apostasiya.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: ako ay hindi
  rationale: Pinananatili ang mariing pag-iiba ni Pedro sa kanyang sarili; likas na ipinauunawa mula sa unang sugnay ang pandiwang hindi na inulit sa Griyego.
theological_decisions:
- issue: Saklaw ng σκανδαλισθήσονται sa konteksto ng pagkabigo ng mga alagad
  choice: tumalikod
  alternative: matitisod; maudyok na magkasala; mawawalan ng pananampalataya
  rationale: Ang ‘tumalikod’ ay angkop sa nalalapit na pag-iwan ng mga alagad kay Jesus at pinananatili ang bigat ng salita, ngunit hindi nagpapasya na ang pagtalikod ay permanente o pangwakas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Ngunit’ para sa salungatan at ‘ako ay hindi’ upang mapanatili ang diin sa ἐγώ nang hindi nagiging artipisyal.
