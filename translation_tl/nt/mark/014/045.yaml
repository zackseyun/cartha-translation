base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: tl
  text: Pagdating niya, agad siyang lumapit kay Jesus at nagsabi, “Rabbi!” at mariin niya siyang hinalikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “paulit-ulit niya siyang hinalikan” o “buong init niya siyang hinalikan.” Mas mariin ang pandiwang Griyego kaysa sa payak na “hinalikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Pagdating niya
  rationale: Ang aorist participle ay temporal; natural na ipinahahayag nito ang pagdating ni Judas bago ang paglapit niya.
- source_word: εὐθὺς
  choice: agad
  rationale: Pinananatili nito ang mabilis na daloy ng salaysay na katangian ng Marcos.
- source_word: προσελθὼν αὐτῷ
  choice: lumapit kay Jesus
  rationale: Tumutukoy ito sa pisikal na paglapit. Ginawang tahasan ang tinutukoy ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: λέγει
  choice: nagsabi
  rationale: Isinalin sa nakaraang panahunan ang historical present upang maging natural sa salaysay sa Tagalog.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Pinananatili ang transliteradong titulong Semitiko sa Griyego at ang historikal na kulay ng tagpo.
- source_word: κατεφίλησεν
  choice: mariin niya itong hinalikan
  rationale: Ang tambalang pandiwa ay mas mariin kaysa sa payak na ‘humalik,’ ngunit hindi tiyak kung ang diin ay pag-uulit o init ng paghalik; ang ‘mariin’ ay nagpapakita ng intensidad nang hindi sapilitang nagpapasya na paulit-ulit iyon.
theological_decisions:
- issue: Pagtawag ni Judas kay Jesus bilang Ῥαββί
  choice: Rabbi
  alternative: Guro
  rationale: Pinananatili ang mismong Semitikong titulong iningatan ng tekstong Griyego, kasama ang historikal na konteksto at kabalintunaan ng pagbati, nang walang idinadagdag na doktrinal na paliwanag.
- issue: Lakas ng κατεφίλησεν
  choice: mariin niya itong hinalikan
  alternative: paulit-ulit niya itong hinalikan / buong init niya itong hinalikan
  rationale: Maaaring nagpapahiwatig ang anyo ng isang mariin, masigla, o paulit-ulit na paghalik. Hindi nilulutas ng pangunahing teksto ang eksaktong uri ng diin; inilalahad sa talababa ang mga tunay na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kay Jesus” sa halip na isang malabong panghalip, at ang “ito” pagkatapos ay natural na tumutukoy sa kaniya. Ang tandang padamdam matapos ang “Rabbi” ay umaayon sa biglang pagbati sa tagpo.
