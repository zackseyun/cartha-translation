base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Ito ang dugo ko ng tipan[a], na ibinubuhos para sa marami[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'May ilang manuskrito na mababasa: “dugo ko ng bagong tipan.” May mga kaugnay na salaysay ding may ganitong pananalita. Ngunit ang tekstong Griyego ng Marcos dito ay pinakamainam na basahin: “dugo ko ng tipan.”'
    reason: textual_variant
  - marker: b
    text: 'Maaari ring isalin: “na kasalukuyang ibinubuhos alang-alang sa marami”; ayon sa tradisyon: “na ibinuhos para sa marami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Ito ang
  rationale: Likas na tuwirang panumbas sa Filipino ng pangungusap na may copula; hindi nito ipinapasok ang interpretasyong “sumasagisag ito sa.”
- source_word: τὸ αἷμά μου
  choice: dugo ko
  rationale: Pinananatili ang tahasang wika tungkol sa dugo at ang larawang sakripisyal at tipanan sa konteksto.
- source_word: τῆς διαθήκης
  choice: ng tipan
  rationale: Ang “tipan” ang malinaw na diwa sa konteksto, na umaalingawngaw sa Exodo 24:8; walang salitang “bago” sa ibinigay na tekstong Griyego.
- source_word: ἐκχυννόμενον
  choice: na ibinubuhos
  rationale: Natural na Filipino para sa kasalukuyang pasibong participle at pinananatili ang larawan ng dugong ibinubuhos; maaari ring ipahiwatig ng anyong Griyego ang “na kasalukuyang ibinubuhos.”
- source_word: ὑπὲρ πολλῶν
  choice: para sa marami
  rationale: Natural at sapat na tiyak na salin na pinananatili ang “marami” at hindi nilulutas sa salin ang mas malawak na usaping teolohikal.
theological_decisions:
- issue: Kung tipan o testamento ang diwa ng διαθήκη
  choice: tipan
  alternative: testamento
  rationale: Sa konteksto ng Huling Hapunan at ng dugong kaugnay ng pagtatatag ng tipan, “tipan” ang malinaw na kontekstuwal na kahulugan.
- issue: Kung idaragdag ang “bago” bago ang “tipan”
  choice: ng tipan
  alternative: ng bagong tipan
  rationale: Wala ang καινῆς (“bago”) sa SBLGNT na teksto rito, kaya hindi dapat itugma ang Marcos sa mga kapantay na salaysay sa pamamagitan ng pagdaragdag nito. Itinatala ang variant sa talababa.
- issue: Saklaw na ipinahihiwatig ng ὑπὲρ πολλῶν
  choice: para sa marami
  alternative: para sa lahat; alang-alang sa marami
  rationale: Pinananatili ang mismong “marami” ng teksto at hindi ipinapasok ang “lahat” o nilulutas ang debateng teolohikal sa loob ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “dugo ko” at “ng tipan” bilang natural na ayos sa Filipino, habang pinananatili ang teolohikal na bigat at tunay na kalabuan ng Griyego.
