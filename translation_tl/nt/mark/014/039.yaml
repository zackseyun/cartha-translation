  source_fidelity: 'Tumpak ang salin sa pangunahing daloy ng Griyego: ang πάλιν ay “Muli,” ang ἀπελθών ay “siyang lumayo,” at ang προσηύξατο ay “nanalangin.” Ang “iyon ding mga salita” ay isang malinaw at katanggap-tanggap na idyomatikong pagsasalin ng τὸν αὐτὸν λόγον sa kontekstong tumutukoy sa nilalaman ng panalanging inulit. Ang “at sinabi niya” ay maayos na naglalahad ng attendant participle na εἰπών, kahit mas malaya ito nang kaunti kaysa sa participial na anyo.'
