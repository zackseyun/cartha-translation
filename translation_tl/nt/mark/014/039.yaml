  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: tl
  text: Muli siyang lumayo at nanalangin, at sinabi niya ang iyon ding mga salita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Griyego, literal na “iyon ding salita”; maaari ring “iyon ding bagay” o “iyon ding pananalita.” Ang “salita” (λόγος) ay tumutukoy rito sa nilalaman ng inulit niyang panalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Muli
  rationale: Likas at maikli itong katumbas na nagpapahayag ng pag-uulit sa daloy ng salaysay.
- source_word: ἀπελθὼν
  choice: siyang lumayo
  rationale: Ipinapakita ng aorist participle ang paglayo ni Jesus bago siya nanalangin; ang ganitong ayos ay natural sa Tagalog.
- source_word: προσηύξατο
  choice: nanalangin
  rationale: Karaniwan at malinaw na katumbas ito ng προσεύχομαι; hindi kailangang ipahayag nang bukod ang middle voice.
- source_word: τὸν αὐτὸν λόγον
  choice: iyon ding mga salita
  rationale: Tumutukoy ang λόγος dito sa nilalaman ng inulit na panalangin. Mas malinaw sa Tagalog ang maramihang “mga salita” kaysa literal na “salita,” na maaaring magpahiwatig na iisang salita lamang ang binigkas.
- source_word: εἰπών
  choice: at sinabi niya
  rationale: Inilalahad nito ang nilalaman o paraan ng kanyang pananalangin. Ang koordinasyong “at sinabi niya” ay malinaw at natural sa makabagong Tagalog.
