revisions:
- from: Bago pa nito, ang nagkakanulo sa kanya ay nagbigay na sa kanila ng isang hudyat[a]. Sinabi niya, “Ang hahalikan ko ang siyang taong iyon.[b] Dakpin ninyo siya at dalhin nang mahigpit ang pagbabantay sa kanya.”[c]
  to: Ang nagtataksil sa kanya ay nauna nang nagbigay sa kanila ng isang hudyat[a], na nagsasabi, “Ang hahalikan ko[b], siya iyon. Dakpin ninyo siya at dalhin ninyo siyang mahigpit na binabantayan.”[c]
  rationale: Inalis ang hindi tahasang “Bago pa nito” at ginamit ang “nauna nang nagbigay” upang tumpak na maipakita ang pluperpektong δεδώκει. Pinakinis ang pagkakakilanlan sa loob ng sipi at itinuwid ang huling utos upang maging natural na Filipino at maipahayag ang diwa ng ἀσφαλῶς na seguradong pagkontrol, hindi pag-iingat para sa kapakanan niya.
