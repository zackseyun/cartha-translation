id: MRK.14.44
reference: Mark 14:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: tl
  text: Ang nagtataksil sa kanya ay nauna nang nagbigay sa kanila ng isang hudyat[a], na nagsasabi, “Ang hahalikan ko[b], siya iyon. Dakpin ninyo siya at dalhin ninyo siyang mahigpit na binabantayan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palatandaan”; tumutukoy ang salitang Griyego sa isang napagkasunduang hudyat upang makilala ang isang tao.
    reason: lexical_alternative
  - marker: b
    text: Karaniwang paraan ng pagbati ang halik, ngunit ginamit ito rito ni Judas bilang hudyat upang makilala si Jesus.
    reason: cultural_note
  - marker: c
    text: O “dalhin ninyo siyang ligtas.” Malamang na ang ibig sabihin dito ay tiyaking mahigpit siyang nababantayan at hindi makatatakas.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: Bago pa nito ... ay nagbigay na
  rationale: 'Ipinahahayag ang pluperpektong diwa: naisaayos na ang hudyat bago naganap ang pagdakip. Ang “Bago pa nito” ay paglilinaw ng aspektong ipinahihiwatig, hindi pagsasalin ng isang hiwalay na salitang pamanahon.'
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ang nagkakanulo sa kanya
  rationale: Natural sa modernong Tagalog at angkop sa konteksto ng pagtataksil; pinananatili rin ang anyong tumutukoy sa gumagawa ng kilos sa halip na pangalanan agad si Judas.
- source_word: σύσσημον
  choice: isang hudyat
  rationale: Ang “hudyat” ay malinaw na tumutukoy sa napagkasunduang palatandaan para makilala ang taong huhulihin.
- source_word: λέγων
  choice: Sinabi niya
  rationale: Hinati sa bagong pangungusap upang maging natural at madaling basahin sa Tagalog habang pinananatili ang ugnayan sa ibinigay na hudyat.
- source_word: Ὃν ἂν φιλήσω
  choice: Ang hahalikan ko
  rationale: Natural na salin ng di-tiyak na sugnay na pantukoy at hindi nagdaragdag ng salitang “lalaki,” na wala sa Griyego.
- source_word: αὐτός ἐστιν
  choice: ang siyang taong iyon
  rationale: Pinananatili ang mariing pagkilala sa taong tinutukoy. Idinagdag ang “taong” bilang likas na Tagalog na panuring, hindi bilang pagtukoy sa kasarian.
- source_word: κρατήσατε
  choice: Dakpin ninyo
  rationale: Naghahatid ng marahas at agarang paghawak sa konteksto ng pag-aresto nang hindi kinakailangang idiin ang pormal na prosesong legal.
- source_word: ἀπάγετε
  choice: dalhin
  rationale: Likas na Tagalog para sa pagdadala sa kanya palayo; nauunawaan na sa konteksto ang direksiyong palayo.
- source_word: ἀσφαλῶς
  choice: nang mahigpit ang pagbabantay sa kanya
  rationale: Sa konteksto, ang punto ay tiyaking kontrolado at hindi makatatakas si Jesus, hindi pangalagaan ang kanyang kaligtasan.
theological_decisions:
- issue: Diwa ng ἀσφαλῶς
  choice: nang mahigpit ang pagbabantay sa kanya
  alternative: nang ligtas
  rationale: Iniiwasan ang impresyong ang pangunahing layunin ay ingatan si Jesus laban sa kapahamakan; mas malamang na tumutukoy ito sa seguradong pagkakapiit o mahigpit na pagkontrol sa kanya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hudyat,” “nagkakanulo,” at “dakpin” bilang mga salitang madaling maunawaan ngunit sapat ang bigat para sa salaysay. Inilagay ang lahat ng panandang talababa sa mismong teksto.
