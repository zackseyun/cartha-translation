  source_fidelity: Kailangang alisin ang “Bago pa nito,” sapagkat walang tuwirang panandang pamanahon na katumbas nito sa Griyego. Ang pluperpekto ng δεδώκει ay sapat na naipahahayag ng “nauna nang nagbigay.” Ang utos na ἀπάγετε ἀσφαλῶς ay mas tumpak at malinaw na maisasalin bilang pagdadala sa kanya habang mahigpit na binabantayan.
  naturalness: Hindi likas sa modernong Filipino ang “dalhin nang mahigpit ang pagbabantay sa kanya.” Mas natural ang “dalhin ninyo siyang mahigpit na binabantayan.” Ang “Ang hahalikan ko, siya iyon” ay malinaw at idiomatiko para sa mariing pagkakakilanlan.
  terminology: Ang “hudyat,” “nagtataksil,” at “dakpin” ay angkop sa rehistro at sa konteksto. Hindi kailangang idagdag ang “taong,” na wala sa pinagmulan at nagpapabigat sa pangungusap.
