  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: tl
  text: Sapagkat marami ang nagbibigay ng maling patotoo laban sa kanya, at hindi nagkakatugma ang kanilang mga patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Sapagkat marami ang sumasaksi nang may kabulaanan laban sa kanya, at hindi magkakatulad ang kanilang mga patotoo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: marami
  rationale: Ginamit nang substantibo ang pang-uri at tumutukoy sa maraming tao. Hindi idinagdag ang “mga saksi” sapagkat ipinahihiwatig lamang iyon ng pandiwa at hindi tahasang nasa Griyego.
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ang γάρ ng paliwanag o suporta sa naunang salaysay; malinaw at natural itong naipapahayag ng “Sapagkat.”
- source_word: ἐψευδομαρτύρουν
  choice: nagpapatotoo nang kasinungalingan
  rationale: Pinananatili nito ang legal na diwa ng ψευδομαρτυρέω. Ang aspektong imperpektibo ay nauunawaan sa nagpapatuloy na tagpo, nang hindi kinakailangang gawing mabigat ang Filipino.
- source_word: κατ’ αὐτοῦ
  choice: laban sa kanya
  rationale: Sa kontekstong paglilitis, ipinapahayag ng κατά na may genitive ang salungat at mapanirang direksiyon ng patotoo.
- source_word: ἴσαι
  choice: nagkakatugma
  rationale: Bagaman literal na “magkakapantay,” tumutukoy ito rito sa mga patotoong tumutugma o nagkakasundo sa isa’t isa.
- source_word: αἱ μαρτυρίαι
  choice: ang kanilang mga patotoo
  rationale: Ang artikulo ay tumutukoy sa mga patotoong kababanggit lamang. Likas sa Filipino ang paglalagay ng “kanilang” upang luminaw ang tinutukoy.
- source_word: οὐκ ἦσαν
  choice: hindi nagkakatugma
  rationale: Isinalin kasama ng ἴσαι bilang isang natural na panaguri sa Filipino habang pinananatili ang payak na pagtanggi.
theological_decisions: []
translation_notes:
  register: Makabagong, dignified, at madaling maunawaang Filipino. Pinanatili ang legal na himig ng patotoo at ang paliwanag na ugnayan ng γάρ. Ginamit ang “ngunit” para natural na maipahayag ang kontrast na likas sa dalawang sugnay, kahit καί ang pang-ugnay sa Griyego.
