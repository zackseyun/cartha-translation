id: MRK.14.36
reference: Mark 14:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: tl
  text: At sinabi niya[a], “Abba, Ama[b], magagawa mo ang lahat. Ilayo mo sa akin ang kopang ito[c]. Ngunit hindi ang nais ko, kundi ang nais mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patuloy niyang sinasabi” o “paulit-ulit niyang sinabi.” Maaaring ipahiwatig ng anyo ng pandiwang Griyego ang nagpapatuloy o inuulit na pagsasalita.
    reason: lexical_alternative
  - marker: b
    text: Ang “Abba” ay Aramaikong tawag sa ama; pinanatili ito rito kasunod ng katumbas na Griyegong “Ama.”
    reason: cultural_note
  - marker: c
    text: Ang “kopa” ay biblikal na talinghaga para sa pagdurusang nakatalaga sa kanya; ihambing ang Marcos 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy niyang sinasabi
  rationale: Ipinahihiwatig ng imperpektong pandiwa ang nagpapatuloy o inuulit na pagsasalita; malinaw at natural itong naipapahayag sa modernong Tagalog.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Ama
  rationale: Pinananatili ang Aramaikong tawag na “Abba” at isinasalin ang kasunod na Griyegong paliwanag bilang tuwirang pagtawag na “Ama,” nang hindi idinaragdag ang hindi tahasang nakasaad na “ko.”
- source_word: πάντα δυνατά σοι
  choice: magagawa mo ang lahat
  rationale: Natural na salin ito ng malawak na saklaw ng pahayag at malinaw na ipinahahayag ang kakayahan ng Ama.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Ilayo mo sa akin ang kopang ito
  rationale: Ang “ilayo” ay malinaw na naghahatid ng kahilingang alisin o dalhin palayo, habang pinananatili ng “kopa” ang talinghagang nasa orihinal.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Ngunit huwag ang nais ko, kundi ang nais mo
  rationale: Pinupunan sa natural na Tagalog ang eliptikong pahayag nang hindi binabago ang pagtutunggali ng nais ni Jesus at ng nais ng Ama.
theological_decisions:
- issue: Ang magkasunod na Aramaiko at Griyegong pagtawag sa Diyos
  choice: Abba, Ama
  alternative: Abba, Ama ko
  rationale: Kapuwa pinananatili ang Aramaikong anyo at ang Griyegong paliwanag, ngunit hindi idinaragdag ang panghalip na “ko,” na hindi tahasang nasa teksto.
- issue: Ang talinghaga ng kopa
  choice: ang kopang ito
  alternative: ang pagdurusang ito
  rationale: Pinananatili ang mismong talinghaga at ang kaugnayan nito sa mas malawak na biblikal na larawan, sa halip na ipaliwanag agad ang kahulugan nito sa pangunahing teksto.
- issue: Ang ugnayan ng nais ni Jesus at ng nais ng Ama
  choice: Ngunit huwag ang nais ko, kundi ang nais mo
  alternative: Ngunit hindi ang gusto ko, kundi ang gusto mo
  rationale: Ang “nais” ay dignificado ngunit kasalukuyang Tagalog at pinananatili ang bigat ng θέλω nang hindi nilulutas ang teolohikal na tensiyon ng panalangin.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “patuloy niyang sinasabi” upang mapanatili ang aspekto ng imperpekto, “kopa” upang mapanatili ang biblikal na talinghaga, at “nais” upang maipahayag ang θέλω nang may angkop na bigat ngunit hindi makaluma.
