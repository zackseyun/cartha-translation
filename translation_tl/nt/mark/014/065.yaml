source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: tl
  text: At may ilang nagsimulang dumura sa kanya, takpan ang kanyang mukha[a], suntukin siya, at sabihin sa kanya, “Magpropesiya ka!” At pinaghampas siya ng mga bantay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “piringan siya.” Literal na sinasabi ng Griyego, “takpan ang kanyang mukha.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaaring isalin nang mas literal: “Tinanggap siya ng mga bantay sa pamamagitan ng mga hampas.” Ang pariralang Griyego ay isang di-karaniwang idyoma para sa marahas na pagtrato sa kanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: ang ilan ay nagsimulang
  rationale: Likas sa Filipino ang ayos na ito at pinananatili nito kapwa ang di-tiyak na pangkat na tinutukoy ng τινες at ang pasimulang aspekto ng ἤρξαντο.
- source_word: ἐμπτύειν αὐτῷ
  choice: duraan siya
  rationale: Tuwirang ipinapahayag nito ang pagdura sa kaniya bilang pang-iinsulto at pang-aabuso.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: takpan ang mukha niya
  rationale: Malapit ito sa mismong pagkakasabi ng Griyego at hindi ginagawang tahasan sa pangunahing teksto ang malamang na layuning pagpiring.
- source_word: κολαφίζειν αὐτόν
  choice: suntukin siya
  rationale: Karaniwang tumutukoy ang pandiwa sa paghampas gamit ang kamao; malinaw at natural sa modernong Filipino ang “suntukin.”
- source_word: Προφήτευσον
  choice: Magpropesiya ka!
  rationale: Pinananatili ang maikli at mapanuyang utos nang hindi dinaragdagan ng paliwanag na wala sa teksto.
- source_word: οἱ ὑπηρέται
  choice: mga bantay
  rationale: Sa tagpong panghukuman, tumutukoy ito sa mga tauhang gumaganap bilang mga bantay o tagapagpatupad, hindi sa mga katulong sa bahay.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: pinaghahampas din siya
  rationale: Natural na Filipino ito para sa idyomatikong pahayag na Griyego at pinananatili ang di-tiyak na uri ng mga hampas nang hindi ipinapalagay kung kamay o pamalo ang ginamit.
theological_decisions:
- issue: Ang mapanuyang utos na Προφήτευσον kaugnay ng pagkakakilanlan ni Jesus
  choice: Magpropesiya ka!
  alternative: Patunayan mong propeta ka!
  rationale: Hindi tahasang pinalalawak ng teksto ang panunuya. Pinananatili ng salin ang payak na pautos at ang kabalintunaan ng tagpo nang hindi nagdaragdag ng interpretasyong doktrinal.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang “Magpropesiya” upang mapanatili ang espesipikong diwa ng προφητεύω, at ang “pinaghahampas” upang maipahayag nang natural ang huling idyomang Griyego. Ang mga panghalip ay nasa karaniwang anyong Filipino at iniwasan ang sobrang pormal o denominasyonal na pananalita.
