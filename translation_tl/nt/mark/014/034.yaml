base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: tl
  text: At sinabi niya sa kanila, “Lubhang nalulungkot ang aking kaluluwa, hanggang sa kamatayan.[a] Manatili kayo rito at magbantay.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lubhang malungkot” o “lubos na nababagabag.” Ang “hanggang sa kamatayan” ay maaari ring mangahulugang “hanggang sa puntong mamatay.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “manatili kayong gising”; maaaring tumukoy ang utos kapwa sa literal na hindi pagtulog at sa mapagmatyag na pagbabantay.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi niya
  rationale: Ginamit ang karaniwang anyong pasalaysay sa Filipino. Bagaman nasa pangkasalukuyang anyo ang Griyego bilang makulay na historical present, mas natural sa modernong Tagalog ang “sinabi niya” sa ganitong salaysay.
- source_word: Περίλυπός
  choice: labis na nalulungkot
  rationale: Ipinahahayag nito ang napakatinding dalamhati sa malinaw at natural na Filipino, nang hindi nililimitahan kung ang diwa ay matinding lungkot o pagiging lubos na nababalot ng lungkot.
- source_word: ψυχή
  choice: kaluluwa
  rationale: Pinananatili nito ang tradisyonal na lalim ng salita at ang pagtukoy sa panloob na buhay o buong pagkatao ni Jesus, sa halip na paliitin ito sa emosyon lamang.
- source_word: ἕως θανάτου
  choice: hanggang sa kamatayan
  rationale: Malapit ito sa anyo at bigat ng idyomang Griyego at pinananatili ang posibilidad na ang dalamhati ay sukdulan o umaabot sa puntong ikamamatay.
- source_word: μείνατε
  choice: manatili kayo
  rationale: Tumpak nitong ipinahahayag ang utos na huwag umalis sa lugar at angkop sa taimtim na himig ng tagpo.
- source_word: ὧδε
  choice: rito
  rationale: Ito ang natural na pantukoy sa lugar na malapit sa nagsasalita.
- source_word: γρηγορεῖτε
  choice: magbantay
  rationale: Saklaw ng “magbantay” ang mapagmatyag na paghihintay, habang nililinaw sa talababa na maaari rin itong tumukoy sa pananatiling gising.
theological_decisions:
- issue: Pagpapakahulugan sa ψυχή sa pahayag ni Jesus
  choice: kaluluwa
  alternative: sarili / buhay
  rationale: Pinananatili ng “kaluluwa” ang antropolohikal at emosyonal na lalim ng Griyego at inilalarawan ang tunay na pantaong dalamhati ni Jesus nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Saklaw ng utos na γρηγορεῖτε
  choice: magbantay
  alternative: manatiling gising
  rationale: Maaaring kabilang sa utos ang literal na hindi pagtulog at ang higit na malawak na mapagmatyag na pagbabantay. Pinananatili ng salin at talababa ang dalawang posibilidad sa halip na pumili lamang ng isa.
translation_notes:
  register: Modernong Filipino na malinaw, taimtim, at marangal. Pinanatili ang “kaluluwa” at “hanggang sa kamatayan” upang huwag patagin ang matinding pahayag, habang ginamit ang natural na “magbantay” para sa utos.
