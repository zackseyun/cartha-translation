  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: tl
  text: Ngunit itinanggi niya iyon at sinabi, “Hindi ko alam at hindi ko nauunawaan ang sinasabi mo.” At lumabas siya patungo sa pasukan ng patyo, at tumilaok ang isang tandang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi kasama sa ilang manuskrito ang: “at tumilaok ang isang tandang.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: itinanggi niya iyon
  rationale: Ang pandiwa ay nangangahulugang magkaila o tumanggi sa isang pahayag. Nilinaw ng “iyon” na ang itinatanggi ni Pedro ay ang paratang na kasasabi pa lamang, nang hindi tahasang dinaragdagan ang teksto ng “itinanggi niya si Jesus.”
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Hindi ko alam ni nauunawaan
  rationale: Pinananatili nito ang magkatambal na pandiwa at ang madiing pagkakaila ni Pedro. Natural sa modernong Filipino ang “hindi ... ni ...” sa ganitong pahayag.
- source_word: σὺ τί λέγεις
  choice: ang sinasabi mo
  rationale: Direkta at natural itong katumbas ng “what you are saying,” at pinananatili ang kaugnayan sa pandiwang λέγεις.
- source_word: ἐξῆλθεν ἔξω
  choice: lumabas siya
  rationale: Sapat na ipinahahayag ng “lumabas” ang kilos ng pagpunta sa labas; ang kasunod na parirala ang tumutukoy sa patutunguhan.
- source_word: προαύλιον
  choice: may pasukan ng patyo
  rationale: Tumutukoy ito sa bahaging nasa unahan o pasukan ng panloob na patyo, hindi lamang sa patyo mismo. Ang “may pasukan ng patyo” ay malinaw at karaniwan sa modernong Filipino.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: tumilaok ang isang tandang
  rationale: Ito ang likas na ekspresyon sa Filipino. Ang “isang tandang” ay angkop sa pangngalang walang pantukoy sa Griyego.
theological_decisions:
- issue: Pagsasama ng sugnay na καὶ ἀλέκτωρ ἐφώνησεν
  choice: Isinama sa pangunahing teksto bilang “at tumilaok ang isang tandang.”
  alternative: Alisin ang sugnay ayon sa ilang manuskrito.
  rationale: Kasama ang sugnay sa ibinigay na tekstong SBLGNT ngunit minarkahan bilang may tekstuwal na pagkakaiba. Kaya isinalin ito sa pangunahing teksto at iniulat ang kawalan nito sa ilang manuskrito sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang madiing pag-uulit sa pagkakaila ni Pedro at iniwasang gawing mas tiyak kaysa sa Griyego ang layon ng kanyang pagtanggi.
