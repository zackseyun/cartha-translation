  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: tl
  text: Sumagot si Jesus at sinabi sa kanila, “Lumabas ba kayong may dalang mga espada at pamalo upang dakpin ako na para bang isang tulisan[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bandido” o “rebelde.” Ang salitang Griyego ay maaaring tumukoy sa isang marahas na mandarambong o rebelde, hindi lamang sa karaniwang magnanakaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Sumagot … at sinabi
  rationale: Pinananatili ang dalawang pandiwang bumubuo sa karaniwang pormulang pasalaysay sa Griyego, habang nananatiling malinaw at likas sa Filipino.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: Para ba akong tulisan
  rationale: 'Ipinahahayag nito ang mapanuyang tanong ni Jesus: kumilos sila na para bang isa siyang mapanganib na kriminal. Ang “tulisan” ay mas angkop kaysa “magnanakaw” sapagkat maaari itong tumukoy sa marahas na mandarambong.'
- source_word: ἐξήλθατε
  choice: pumarito kayo
  rationale: Sa tagpong ito, tumutukoy ang pandiwa sa paglabas at pagpunta ng pangkat sa kinaroroonan ni Jesus. Ang “pumarito” ay likas sa direktang pananalita sa Filipino at malinaw na naghahatid ng direksiyon ng kilos.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: may dalang mga espada at pamalo
  rationale: Ang μάχαιρα ay espada o malaking patalim, at ang ξύλον dito ay kahoy na ginagamit bilang sandata. Nililinaw ng “may dalang” ang gamit ng mga ito sa pagdakip nang hindi binabago ang diwa.
- source_word: συλλαβεῖν
  choice: upang dakpin
  rationale: Ang “dakpin” ay malinaw at angkop sa konteksto ng sapilitang pag-aresto, at pinananatili nito ang layuning ipinahahayag ng infinitive.
theological_decisions:
- issue: Saklaw ng kahulugan ng λῃστής sa mapanuyang tanong ni Jesus
  choice: “tulisan” sa pangunahing teksto, na may talababa tungkol sa posibleng diwang bandido o rebelde
  alternative: “magnanakaw,” “bandido,” o “rebelde”
  rationale: Ang λῃστής ay maaaring mangahulugan ng marahas na mandarambong o rebelde, hindi lamang ng karaniwang magnanakaw. Hindi tiyak na tinutukoy rito ang isang rebelde, kaya pinananatili ng “tulisan” at ng talababa ang lawak ng kahulugan nang hindi nagpapasya nang higit sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa salaysay. Pinanatili ang pormulang “Sumagot … at sinabi,” ngunit ginawang likas ang retorikal na tanong sa Filipino.
