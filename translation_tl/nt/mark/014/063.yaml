  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: tl
  text: Ngunit pinunit ng mataas na pari ang kanyang mga kasuotan[a] at sinabi[b], “Kailangan pa ba natin ng mga saksi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga damit” o, nang mas tiyak, “mga tunika.”
    reason: lexical_alternative
  - marker: b
    text: 'Pangkasalukuyang anyo ang ginamit sa Griyego: “sinasabi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀρχιερεὺς
  choice: ang mataas na pari
  rationale: Ito ang karaniwan at tiyak na tawag sa nag-iisang punong opisyal na namumuno sa pagdinig.
- source_word: διαρρήξας
  choice: pinunit
  rationale: Malinaw nitong ipinahahayag ang aktuwal na pagpunit nang hindi gumagamit ng makaluma o mapagpaliwanag na pananalita.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: ang kanyang mga kasuotan
  rationale: Pinananatili ang maramihang anyo at hindi nililimitahan ang kahulugan sa seremonyal na damit; maaaring mas tiyak na tumukoy ang χιτών sa tunika.
- source_word: λέγει
  choice: sinabi
  rationale: Bagaman nasa pangkasalukuyang anyo ang Griyego bilang historical present, mas natural sa salaysay na Tagalog ang pangnagdaan.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Bakit kailangan pa natin ng mga saksi?
  rationale: Natural na tanong sa modernong Tagalog na pinananatili ang retorikal na diwa at ang kahulugan ng ἔτι na ‘pa.’
- source_word: μαρτύρων
  choice: ng mga saksi
  rationale: Likas na katumbas sa Tagalog pagkatapos ng ‘kailangan’ at hindi ipinahihiwatig na tiyak na mga saksi lamang ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng pagpunit ng kasuotan ng mataas na pari
  choice: Inilahad bilang literal na pagpunit ng kanyang mga kasuotan nang walang paliwanag sa motibo.
  alternative: Tahasang ilarawan ito bilang poot o pagkagimbal dahil sa itinuturing na pamumusong.
  rationale: Isinasalaysay lamang ng talata ang kilos at pananalita; hindi nito tahasang ipinapaliwanag ang kahulugan ng kilos, kaya pinananatiling bukas ang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kasuotan” upang mapanatili ang maramihang anyo at maiwasang ipakahulugang tiyak na seremonyal na balabal; ginawang likas na retorikal na tanong sa Tagalog ang huling pangungusap.
