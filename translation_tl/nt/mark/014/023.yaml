  source_fidelity: 'Tumpak na naisasalin ng draft ang pagkakasunod ng mga kilos: pagkuha ng kopa, pagpapasalamat, pagbibigay nito sa mga alagad, at pag-inom ng lahat. Ang “isang kopa” ay katanggap-tanggap na tuwirang salin ng anarthrous na ποτήριον, at ang talababa ay wastong nagmamarka ng posibleng “ang kopa.” Gayunman, ang “mula roon” ay mas karaniwang tumutukoy sa isang lugar at maaaring lumabo ang tuwirang reperensiya sa sisidlan na ipinahihiwatig ng ἐξ αὐτοῦ.'
