  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: tl
  text: At kumuha siya ng isang kopa. Pagkatapos magpasalamat, ibinigay niya ito sa kanila, at uminom silang lahat mula sa kopa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: kumuha siya
  rationale: Ang aorist participle ay ginawang likas na pandiwang Filipino; pinananatili ng pagkakasunod ng mga pangungusap ang naunang kilos bago ang pagbibigay.
- source_word: ποτήριον
  choice: isang kopa
  rationale: Walang artikulo ang pangngalan sa Griyego, kaya tuwirang ipinapahayag ng “isang kopa” ang anyong anarthrous, habang kinikilala sa talababa na maaaring isang tiyak na kopa ang tinutukoy sa konteksto.
- source_word: εὐχαριστήσας
  choice: Pagkatapos magpasalamat
  rationale: Malinaw na ipinahihiwatig ang pagkakaunang temporal ng aorist participle at iniiwasang magpasok ng mas huling terminong liturhikal.
- source_word: ἔδωκεν αὐτοῖς
  choice: ibinigay niya iyon sa kanila
  rationale: Likas sa Filipino ang paglalagay ng “iyon,” na tumutukoy sa kapapasok na kopa, bagaman implicit ang layon sa Griyego.
- source_word: ἔπιον
  choice: uminom
  rationale: Karaniwan at tuwirang katumbas ng aorist na pandiwa.
- source_word: ἐξ αὐτοῦ
  choice: mula roon
  rationale: Tumutukoy ito pabalik sa kopa; ang “mula roon” ay natural sa Filipino at hindi nagbibigay ng maling personal na reperensiya.
- source_word: πάντες
  choice: silang lahat
  rationale: Pinananatili ang diin na bawat isa sa kanila ay uminom.
theological_decisions:
- issue: Posibleng mga pahiwatig na eukaristiko ng εὐχαριστήσας
  choice: Pagkatapos magpasalamat
  alternative: pagkatapos basbasan iyon; pagkatapos bigkasin ang pasasalamat
  rationale: Ang εὐχαριστέω ay tahasang nangangahulugang magpasalamat. Hindi ipinapasok sa salin ang mas huling terminolohiyang sakramental o liturhikal, habang hindi rin itinatanggi ang kahalagahan ng talata sa tradisyong Kristiyano.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang sunod-sunod na mga kilos sa Tagalog nang hindi binabago ang kanilang ayos o ugnayan.
