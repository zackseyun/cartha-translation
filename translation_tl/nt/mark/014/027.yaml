  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: tl
  text: 'At sinabi ni Jesus sa kanila, “Tatalikod kayong lahat[a], sapagkat nasusulat: ‘Hahampasin ko ang pastol, at mangangalat ang mga tupa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “matitisod kayong lahat”; maaari ring, “mapatitísod kayong lahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sinabi
  rationale: Ginamit ang likas na panahunang nagdaan sa salaysay na Filipino; ang Griyegong pangkasalukuyan ay isang historical present na nagbibigay-sigla sa salaysay, ngunit magiging pilit dito ang literal na “sinasabi.”
- source_word: σκανδαλισθήσεσθε
  choice: tatalikod kayong lahat
  rationale: Sa konteksto, tumutukoy ito sa pagkabigo at pag-iwan ng mga alagad kay Jesus sa oras ng panganib. Ang “tatalikod” ay malinaw at likas sa modernong Filipino, habang pinananatili sa talababa ang mas literal na larawang “matitisod.”
- source_word: γέγραπται
  choice: nasusulat
  rationale: Karaniwan at marangal na pormula sa Filipino para sa pagpapakilala ng sipi mula sa Kasulatan; ipinahihiwatig din nitong nananatiling may bisa ang nakasulat.
- source_word: Πατάξω
  choice: hahampasin ko
  rationale: Direkta at makabagong katumbas na nagpapanatili sa lakas ng kilos at sa unang panauhang anyo.
- source_word: ποιμένα
  choice: ang pastol
  rationale: Tuwirang katumbas na nagpapanatili sa isahang larawan ng pastol sa siping propetiko.
- source_word: τὰ πρόβατα
  choice: ang mga tupa
  rationale: Likas na katumbas sa Filipino at pinananatili ang larawan ng kawan.
- source_word: διασκορπισθήσονται
  choice: mangangalat
  rationale: Likas na Filipino para sa paghiwa-hiwalay ng kawan. Bagaman pasibo ang anyong Griyego, hindi likas ang mahigpit na pasibong salin dito; hindi naman tinutukoy ng pandiwang Filipino kung sino ang nagpapangalat.
theological_decisions:
- issue: Saklaw ng σκανδαλισθήσεσθε sa magiging tugon ng mga alagad kay Jesus
  choice: tatalikod
  alternative: matitisod; magiging dahilan ito ng inyong pagkatisod
  rationale: Ipinahihiwatig ng konteksto ang pagtalikod at pagkalat ng mga alagad nang dakpin si Jesus. Hindi dinagdagan ang teksto ng “sa akin,” upang hindi gawing tahasan ang bagay na nananatiling ipinahihiwatig lamang sa Griyego. Inilagay sa talababa ang literal na metapora at ang posibleng pasibong diin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sapagkat nasusulat” bilang pamilyar ngunit hindi lipas na pananalita sa kontekstong biblikal. Nasa pangunahing teksto ang panandang [a], alinsunod sa talababa.
