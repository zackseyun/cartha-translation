  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: tl
  text: Ngunit pagkatapos akong buhaying muli[a], mauuna ako sa inyo patungong Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “pagkatapos na ako ay buhaying muli.” Balintiyak ang pandiwang Griyego at karaniwang ginagamit sa pagtukoy sa muling pagkabuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ngunit
  rationale: Likas at marangal na panandang pasalungat sa naunang pahayag tungkol sa pagkakawatak-watak ng mga alagad.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: pagkatapos akong muling buhayin
  rationale: Ang μετά kasama ng articular infinitive ay nagsasaad ng panahong kasunod, at pinananatili ng anyong “akong ... buhayin” ang balintiyak na tinig ng Griyego.
- source_word: ἐγερθῆναί
  choice: muling buhayin
  rationale: Sa kontekstong ito, ang balintiyak na aorist infinitive ng ἐγείρω ay tumutukoy sa pagbuhay mula sa kamatayan. Mas malinaw at natural ito sa modernong Tagalog kaysa sa literal na “ibangon,” habang pinananatili ang balintiyak.
- source_word: προάξω
  choice: mauuna ako sa
  rationale: Ipinahihiwatig ng future active na ang nagsasalita ay pupunta roon nang mas maaga kaysa sa mga alagad; natural itong ipinapahayag sa Tagalog bilang “mauuna ako sa inyo.”
- source_word: ὑμᾶς
  choice: inyo
  rationale: Malinaw na ikalawang panauhang maramihan ang tinutukoy; likas na ipinapakita ito ng panghalip na “inyo.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: sa Galilea
  rationale: Sa Tagalog, ang “sa Galilea” ang natural na pagpapahayag ng pagpunta patungo o papasok sa rehiyong iyon; hindi kailangang tahasang gawing “papasok sa.”
theological_decisions:
- issue: Balintiyak na pananalita tungkol sa muling pagkabuhay sa ἐγερθῆναί με
  choice: pagkatapos akong muling buhayin
  alternative: pagkatapos kong muling mabuhay
  rationale: Pinananatili ng napiling salin ang balintiyak na anyo ng Griyego at hindi ito ginagawang tahasang kusang kilos ni Jesus. Hindi rin nito pinapangalanan ang gumagawa ng pagkilos, gaya ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “muling buhayin” upang maging malinaw ang diwang muling pagkabuhay, at “mauuna ako sa inyo” bilang likas na katumbas ng προάξω ὑμᾶς.
