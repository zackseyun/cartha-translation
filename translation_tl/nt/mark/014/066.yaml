base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: tl
  text: Habang nasa ibaba si Pedro sa patyo[a], dumating ang isa sa mga babaeng lingkod ng punong pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa sa mga aliping babae ng punong pari.” Ang salitang Griyego na παιδίσκη ay maaaring tumukoy sa isang babaeng lingkod o alipin at maaari ring magpahiwatig na siya ay bata pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Habang ... si Pedro
  rationale: Isinalin ang genitive absolute bilang likas na sugnay na pamanahon upang mapanatili ang nagpapatuloy na tagpo.
- source_word: κάτω
  choice: nasa ibaba
  rationale: Tumutukoy ito sa mas mababang kinalalagyan ni Pedro sa loob ng tirahan; malinaw at likas ito sa modernong Tagalog.
- source_word: ἐν τῇ αὐλῇ
  choice: sa patyo
  rationale: Ang αὐλή rito ay ang bukás na looban ng tirahan ng punong pari; ang “patyo” ang maikli at karaniwang katumbas.
- source_word: ἔρχεται
  choice: dumating
  rationale: Bagaman historical present ang Griyego, mas likas sa salaysay na Tagalog ang aspektong perpektibo upang ihayag ang pagdating sa tagpo.
- source_word: μία τῶν παιδισκῶν
  choice: isa sa mga batang babaeng lingkod
  rationale: Pinananatili nito ang posibleng pahiwatig ng kabataan at ang tungkulin sa sambahayan, nang hindi tiyak na nagpapasya kung alipin ang legal na katayuan niya.
- source_word: τοῦ ἀρχιερέως
  choice: ng punong pari
  rationale: Likas na ipinahahayag ng pariralang ito ang kaugnayan niya sa sambahayan ng punong pari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “patyo” para sa αὐλή at “batang babaeng lingkod” para mapanatili ang kasarian, posibleng kabataan, at papel sa sambahayan nang hindi nilulutas ang kalabuan tungkol sa pagiging lingkod o alipin.
