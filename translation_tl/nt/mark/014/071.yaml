base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: tl
  text: Ngunit nagsimula siyang manawagan ng sumpa at manumpa[a], “Hindi ko kilala ang taong ito na binabanggit ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magsumpa”; posible ring “manawagan ng sumpa laban sa sarili.” Hindi tahasang sinasabi sa Griyego kung kanino nakatuon ang sumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngunit ... siyang
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat at ang paglala ng salaysay; natural itong ipinapahayag ng “Ngunit.”
- source_word: ἤρξατο
  choice: nagsimula
  rationale: Tuwirang ipinapahayag ang ingressive na diwa ng pandiwa kasama ng mga kasunod na pawatas.
- source_word: ἀναθεματίζειν
  choice: manawagan ng mga sumpa
  rationale: Ipinapakita nitong siya ay humihiling o nagpapataw ng sumpa, hindi lamang nagmumura. Hindi nito tinutukoy kung kanino nakatuon ang sumpa, gaya rin ng Griyego.
- source_word: ὀμνύναι
  choice: manumpa
  rationale: Natural at malinaw na katumbas ito ng panunumpa o pagbibitiw ng sinumpaang pahayag, hindi ng paggamit ng masasamang salita.
- source_word: ὅτι
  choice: panimulang panipi
  rationale: Ipinakikilala ng ὅτι ang nilalaman ng kanyang panunumpa; natural sa Tagalog ang tuwirang sipi.
- source_word: Οὐκ οἶδα
  choice: Hindi ko kilala
  rationale: Sa pagtukoy sa isang tao, ang “kilala” ang natural na Tagalog para sa οἶδα at pinananatili nito ang tahasang pagkakaila ni Pedro.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: ang taong ito
  rationale: Pinananatili ng “ito” ang deiktikong puwersa ng τοῦτον nang hindi nagdaragdag ng mapanghamak na himig.
- source_word: ὃν λέγετε
  choice: na sinasabi ninyo
  rationale: Natural na modernong Tagalog ito para sa taong tinutukoy o binabanggit ng mga kausap; hindi nito dinaragdagan ang kahulugan.
theological_decisions:
- issue: Kung kanino nakatuon ang sumpang ipinahihiwatig ng ἀναθεματίζειν
  choice: Isinalin bilang paghingi o pagtawag ng mga sumpa nang hindi tinutukoy ang pinatutungkulan.
  alternative: “magsumpa” o “manawagan ng sumpa laban sa sarili”
  rationale: Maaaring magpahiwatig ang konteksto ng sumpang ipinapataw ni Pedro sa sarili bilang pagpapatibay sa kanyang panunumpa, ngunit hindi tahasang binabanggit ng Griyego ang layon ng sumpa. Pinananatili ng salin at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “manawagan ng mga sumpa” upang maiba ito sa karaniwang kahulugan ng “magmura,” at pinanatili ang kalabuan ng orihinal tungkol sa pinatutungkulan ng sumpa.
