  source_fidelity: 'Tumpak na naipapahayag ang Griyegong teksto: si Judas Iscariote, bilang isa sa Labindalawa, ay pumunta sa mga punong pari na may layuning ibigay si Jesus sa kanila. Ang “ibigay” ay sapat na malawak para sa παραδοῖ at hindi nito napaaga sa pangunahing teksto ang mas tiyak na diwa ng pagtataksil.'
