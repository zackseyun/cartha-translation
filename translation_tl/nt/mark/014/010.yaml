id: MRK.14.10
reference: Mark 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: tl
  text: At si Judas Iscariote, na isa sa Labindalawa, ay pumunta sa mga punong pari upang ibigay siya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “upang ipagkanulo siya sa kanila.” Ang pandiwang Griyego ay maaaring mangahulugang “ibigay” o “ipaubaya sa kapangyarihan ng iba”; sa ginawa ni Judas, ang pagbibigay na ito ay isang pagkakanulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak na pang-ugnay at tuloy-tuloy na daloy ng salaysay.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Judas Iscariote
  rationale: Ginamit ang karaniwang makabagong anyong Filipino ng pangalan at bansag.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: na isa sa Labindalawa
  rationale: Ang “Labindalawa” ay tumutukoy sa kinikilalang pangkat ng mga alagad, hindi lamang sa bilang na labindalawa.
- source_word: ἀπῆλθεν
  choice: pumunta
  rationale: Natural na salin ng payak na kilos ng pagpunta sa kontekstong pasalaysay.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: sa mga punong pari
  rationale: Tumutukoy ang pangmaramihang termino sa mga namumunong pari sa Jerusalem.
- source_word: ἵνα
  choice: upang
  rationale: Malinaw na ipinahahayag ang layunin ng pagpunta ni Judas.
- source_word: παραδοῖ
  choice: ibigay
  rationale: Pinananatili ang malawak na diwa ng paghahatid o pagbibigay ng isang tao sa kapangyarihan ng iba, nang hindi agad nililimitahan ang salita sa “ipagkanulo.”
- source_word: αὐτὸν ... αὐτοῖς
  choice: siya ... sa kanila
  rationale: 'Pinananatili ang mga panghalip ng Griyego: si Jesus ang tinutukoy ng “siya,” at ang mga punong pari ng “kanila.”'
theological_decisions:
- issue: Kahulugan ng παραδοῖ sa konteksto ng pagkakanulo ni Judas
  choice: ibigay siya sa kanila
  alternative: ipagkanulo siya sa kanila
  rationale: Bagaman pagtataksil ang ginawa ni Judas, mas malawak ang kahulugan ng pandiwang Griyego at mahalaga ito sa paulit-ulit na tema ng pagbibigay o pagpapasa kay Jesus sa kapangyarihan ng iba sa salaysay ng paghihirap. Pinananatili ng pangunahing teksto ang tensiyong ito, habang inilalahad sa talababa ang tiyak na diwa ng pagkakanulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Labindalawa” bilang pantukoy sa kinikilalang pangkat at iniwasang gawing tahasang “ipagkanulo” ang pangunahing teksto upang mapanatili ang lawak ng salitang Griyego.
