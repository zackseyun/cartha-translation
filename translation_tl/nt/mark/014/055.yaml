  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: tl
  text: Patuloy na naghahanap ang mga punong pari at ang buong konseho[a] ng patotoong laban kay Jesus upang maipapatay si Jesus, ngunit wala silang makita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak, “ang buong Sanhedrin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: ang mga
  rationale: Hindi ginawang tahasang temporal ang δέ; sapat sa natural na salaysay sa Filipino ang pagpapatuloy ng pangungusap, at hindi kailangang lagyan ng “ngayon.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa pamunuang makapari sa Jerusalem; malinaw na maramihan at hindi tumutukoy lamang sa isang mataas na pari.
- source_word: ὅλον τὸ συνέδριον
  choice: ang buong kapulungan
  rationale: Isinasalin ang kahulugan ng συνέδριον bilang namumunong konseho, habang pinananatili ng “buong” ang ὅλον; inilagay sa talababa ang mas tiyak na katawagang Sanhedrin.
- source_word: ἐζήτουν
  choice: patuloy na naghahanap
  rationale: Ipinahihiwatig ang nagpapatuloy na kilos ng imperfect tense sa natural na Filipino.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: patotoong laban kay Jesus
  rationale: Pinananatili ang legal na diwa ng μαρτυρία at ang salungat na puwersa ng κατά na may genitive.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: upang maipapatay siya
  rationale: Ipinapahayag ang layunin ng articular infinitive at ang pormal o hudisyal na diwa ng θανατόω.
- source_word: καὶ οὐχ ηὕρισκον
  choice: ngunit wala silang makita
  rationale: Natural na ipinahahayag sa Filipino ang pagkakaiba sa pagitan ng kanilang patuloy na paghahanap at kabiguang makakita; pinananatili rin ang duratibong diwa ng imperfect nang hindi nagdaragdag ng kawalang-kakayahan.
theological_decisions:
- issue: Pagkakakilanlan ng συνέδριον
  choice: ang buong kapulungan
  alternative: ang buong Sanhedrin
  rationale: Pangunahing leksikal at pangkulturang pasya ito, hindi doktrinal. Isinasalin sa pangunahing teksto ang tungkulin ng lupon, habang pinananatili sa talababa ang pamilyar at mas tiyak na makasaysayang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “patuloy na naghahanap” upang maipakita ang imperfect aspect, at “maipapatay” upang panatilihin ang hudisyal na layunin ng paglilitis nang hindi pinapahina sa payak na “patayin.”
