  naturalness: Natural at malinaw ang kabuuang daloy sa modernong Filipino Tagalog. Ang “nadatnan silang natutulog” at “manatiling gising nang isang oras” ay idiomatiko. Ang pagpapalit ng “kayang” sa “kinayang” ay nananatiling natural at ginagawang mas angkop ang pagsaway sa naganap nang pagkabigo.
  terminology: Wasto ang “Pedro” at ang natatanging paggamit ng “Simon” sa direktang pagtawag. Ang “manatiling gising” ay angkop na salin ng γρηγορῆσαι sa agarang konteksto at hindi nagpapataw ng dagdag na teolohikal na pakahulugan.
