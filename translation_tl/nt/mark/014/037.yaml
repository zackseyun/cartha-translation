base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: tl
  text: At dumating siya at nadatnan silang natutulog. Sinabi niya kay Pedro, “Simon, natutulog ka ba? Hindi mo ba kinayang manatiling gising nang isang oras?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: dumating siya
  rationale: Isinalin sa likas na panahunang nagdaan sa Tagalog; ang literal na kasalukuyang panahunan na “dumarating siya” ay magiging pilit sa salaysay.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: nadatnan silang natutulog
  rationale: Ang “nadatnan” ay natural na katumbas ng pagdating at pagkakitang nasa nagpapatuloy na kalagayan silang natutulog.
- source_word: λέγει τῷ Πέτρῳ
  choice: sinabi niya kay Pedro
  rationale: Pinananatili ang pagtukoy kay Pedro bago siya tawaging Simon, ngunit gumagamit ng natural na panahunan ng salaysay sa Tagalog.
- source_word: Σίμων
  choice: Simon
  rationale: Pinananatili ang personal na pangalang ginamit ni Jesus, na naiiba sa naunang katawagang Pedro.
- source_word: καθεύδεις
  choice: natutulog ka ba
  rationale: Direkta at natural na tanong na nagpapanatili sa agarang pagsaway.
- source_word: οὐκ ἴσχυσας
  choice: Hindi mo ba kayang
  rationale: Ipinahahayag ang kakayahan o kapasidad sa paraang natural sa modernong Tagalog, nang hindi ito nililimitahan sa pisikal na lakas.
- source_word: μίαν ὥραν
  choice: nang isang oras
  rationale: Ang “nang” ay natural na pananda ng haba ng panahon sa Tagalog.
- source_word: γρηγορῆσαι
  choice: manatiling gising
  rationale: Sa agarang paghahambing sa pagtulog, ito ang pinakamalinaw na kongkretong diwa, habang nananatiling posible sa konteksto ang mas malawak na diwang pagiging mapagbantay.
theological_decisions:
- issue: Makasaysayang kasalukuyang panahunan ni Marcos
  choice: 'Ginamit ang panahunang nagdaan: “dumating,” “nadatnan,” at “sinabi.”'
  alternative: 'Panatilihin ang literal na kasalukuyang panahunan: “dumarating,” “natatagpuan,” at “sinasabi.”'
  rationale: Bagaman matingkad ang historical present sa Griyego, karaniwang ipinapahayag ng natural na salaysay sa Tagalog ang mga pangyayaring ito sa panahunang nagdaan. Pinananatili ang daloy at bigat ng teksto nang hindi lumilikha ng di-likas na Tagalog.
- issue: Diwa ng γρηγορέω sa konteksto
  choice: “manatiling gising”
  alternative: “magbantay” o “manatiling mapagbantay”
  rationale: Ang tuwirang kaibahan dito ay ang kanilang pagtulog, kaya inuuna ang literal na pagpapanatiling gising. Hindi nito itinatanggi ang kasamang diwa ng espirituwal na pagbabantay sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Hiniwalay sa dalawang pangungusap ang magkakaugnay na sugnay upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga kilos.
