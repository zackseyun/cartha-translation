  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: tl
  text: At lumakad siya nang kaunti pa, bumagsak sa lupa, at patuloy na nanalangin na, kung maaari, lumampas sa kanya ang oras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: lumakad siya nang kaunti sa unahan
  rationale: Ipinahihiwatig ng participle na προελθών kasama ng μικρόν ang paglayo niya nang maikling distansiya mula sa mga kasama. Likas sa modernong Tagalog ang “nang kaunti sa unahan” at pinananatili nito ang diwa ng pagsulong.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: nagpatirapa sa lupa
  rationale: Maaaring ilarawan ng imperfect na ἔπιπτεν ang paglagpak o pagbagsak sa lupa. Sa konteksto ng pananalangin, malinaw at natural ang “nagpatirapa,” nang hindi ipinahihiwatig na aksidente lamang ang pagkabagsak.
- source_word: προσηύχετο
  choice: patuloy na nanalangin
  rationale: Pinananatili ng “patuloy na nanalangin” ang durative o nagpapatuloy na aspekto ng imperfect na pandiwa.
- source_word: ἵνα
  choice: na
  rationale: Ipinakikilala rito ng ἵνα ang nilalaman o hinihiling sa panalangin. Ang “na” ang pinakanatural na katumbas sa Tagalog at hindi nito labis na iginigiit ang layunin.
- source_word: εἰ δυνατόν ἐστιν
  choice: kung maaari
  rationale: Natural at taimtim sa Tagalog ang “kung maaari,” at pinananatili nito ang kondisyon nang hindi dinaragdagan ang kahulugan.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: lumampas sa kanya ang oras
  rationale: Pinananatili nito ang metapora ng παρέρχομαι, ang pagdaan o paglampas, at ang literal na “oras,” sa halip na ipaliwanag agad ito bilang pagdurusa o kamatayan.
theological_decisions:
- issue: Kahulugan ng “ang oras”
  choice: Panatilihin ang literal na pananalitang “ang oras.”
  alternative: ang panahon; ang oras ng pagdurusa
  rationale: May mabigat na teolohikal at pasalaysay na kahulugan ang “oras” bilang takdang panahon ng pagdurusa at kamatayan ni Jesus. Hindi ito dapat tahasang ipaliwanag sa pangunahing teksto upang mapanatili ang pahiwatig at tensiyon ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagpatirapa” bilang likas na paglalarawan ng paglagpak sa lupa sa konteksto ng panalangin, at pinanatili ang “ang oras” bilang sadyang makahulugang pahayag.
