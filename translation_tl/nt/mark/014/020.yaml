  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Isa sa labindalawa, ang nagsasawsaw na kasama ko sa mangkok[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinggan.” Ang salitang Griyego na τρύβλιον ay maaaring tumukoy sa mangkok o pinggan na ginagamit sa pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Sinabi
  rationale: Hindi na isinalin nang hiwalay ang banayad na pang-ugnay na δέ; natural sa modernong Tagalog ang tuwirang pagpapatuloy ng salaysay nang hindi nagdaragdag ng di-kailangang “at” o “ngunit.”
- source_word: εἶπεν αὐτοῖς
  choice: Sinabi niya sa kanila
  rationale: Tuwirang pinananatili ang karaniwang diwa ng λέγω at ang tagatanggap ng pahayag.
- source_word: Εἷς τῶν δώδεκα
  choice: Isa sa labindalawa
  rationale: Malinaw na ipinakikilalang kabilang sa pinakamalapit na pangkat ni Jesus ang tinutukoy, nang hindi ginagawang pormal na titulo ang bilang.
- source_word: ὁ ἐμβαπτόμενος
  choice: ang … nagsasawsaw
  rationale: Ang kasalukuyang participle ay isinalin bilang nagpapatuloy o kasalukuyang kilos; ang “nagsasawsaw” ang natural na salitang Filipino sa paglubog ng pagkain sa sisidlan.
- source_word: μετ’ ἐμοῦ
  choice: kasabay ko
  rationale: Ipinahahayag nito ang pakikisabay kay Jesus sa mismong kilos, isang natural na paglalapat ng accompaniment na ipinahihiwatig ng μετά na may genitive.
- source_word: εἰς τὸ τρύβλιον
  choice: sa mangkok
  rationale: Ang “mangkok” ay karaniwan at madaling maunawaang tawag sa sisidlang kainan. Sa pandiwang “nagsasawsaw,” likas nang ipinahihiwatig ng “sa” ang pagpasok sa sisidlan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang gitling na em upang malinaw na ipakitang ang kasunod na parirala ay tumutukoy sa “isa sa labindalawa.” Inilagay ang talababa sa “mangkok,” ang salitang talagang may leksikal na alternatibo.
