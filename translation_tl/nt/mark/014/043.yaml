    rationale: Ang γραμματέων ay “mga eskriba,” at ang πρεσβυτέρων ay “mga matatanda.” Ipinahihiwatig na ng konteksto ang kanilang institusyonal na katayuan; hindi kailangang idagdag ang tungkulin o pagiging pinuno sa salin.
  - severity: low
