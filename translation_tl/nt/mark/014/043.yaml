id: MRK.14.43
reference: Mark 14:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: tl
  text: At kaagad, habang nagsasalita pa siya, dumating[a] si Judas, isa sa Labindalawa, at kasama niya ang isang pulutong[b] na may mga espada at mga pamalo[c], mula sa mga punong pari, mga eskriba, at mga matatanda.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumarating.” Nasa kasalukuyang panahunan sa Griyego ang pandiwang ito (“dumarating”) upang gawing mas buhay ang salaysay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maraming tao.” Bagaman mapanlaban ang grupo sa kontekstong ito, ang salitang Griyego ay karaniwang nangangahulugang “pulutong.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “mga kahoy”; tumutukoy rito sa mga pamalong ginagamit bilang sandata.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring unawaing “isinugo ng.” Mas literal na sinasabi ng Griyego na ang pulutong ay nagmula sa mga pinunong ito, na maaaring magpahiwatig ng kanilang awtorisasyon.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: kaagad
  rationale: Pinananatili ang biglaan at apurahang takbo na katangian ng salaysay ni Marcos.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: habang nagsasalita pa siya
  rationale: Likas na Filipino para sa kasabay na kilos ng genitive absolute; ang “pa” ang nagpapahayag sa ἔτι.
- source_word: παραγίνεται
  choice: dumating
  rationale: Isinasalin sa nagdaang panahunan ang historical present upang maging likas sa salaysay sa Filipino, habang pinananatili ang pagdating sa tagpo.
- source_word: Ἰούδας
  choice: Judas
  rationale: Karaniwang anyo ng pangalang ito sa Filipino.
- source_word: εἷς τῶν δώδεκα
  choice: isa sa Labindalawa
  rationale: Pinananatili ang maikli at kinikilalang katawagan sa pangkat nang hindi idinaragdag ang “alagad,” na wala sa teksto.
- source_word: ὄχλος
  choice: isang pulutong
  rationale: Tuwirang tumutukoy sa maraming tao nang hindi ipinapasok sa mismong pangngalan ang poot na ipinakikita na ng konteksto.
- source_word: μετὰ μαχαιρῶν
  choice: na may mga espada
  rationale: Ang “espada” ay malinaw at karaniwang katumbas ng μάχαιρα sa konteksto ng pagdakip.
- source_word: ξύλων
  choice: pamalo
  rationale: Bagaman literal na “kahoy,” tumutukoy ito rito sa mga kahoy na sandatang pamalo.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: mula sa mga punong pari, mga tagapagturo ng Kautusan, at mga matatandang pinuno
  rationale: Pinananatili ng “mula sa” ang di-tiyak na ugnayan ng pinagmulan o awtorisasyon nang hindi tahasang idinaragdag na “isinugo.”
- source_word: ἀρχιερέων
  choice: mga punong pari
  rationale: Tumutukoy sa uring namumuno sa mga pari, hindi sa maraming sabay-sabay na nanunungkulang pinakapunong pari.
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Mas malinaw sa ordinaryong modernong mambabasa kaysa “mga eskriba,” habang ipinahahayag ang kinikilalang tungkulin nila sa Kautusan.
- source_word: πρεσβυτέρων
  choice: mga matatandang pinuno
  rationale: Iniiwasan ang impresyong edad lamang ang tinutukoy at ipinakikita ang institusyonal na papel ng mga kinikilalang pinuno.
theological_decisions:
- issue: Historical present ng παραγίνεται
  choice: Isinalin bilang “dumating”
  alternative: “dumarating”
  rationale: Karaniwang gumagamit ang modernong salaysay sa Filipino ng nagdaang panahunan; estilistikong pagpapasya ito at hindi pagbabago sa pangyayari.
- issue: Lakas ng παρὰ kaugnay ng mga pinunong Judio
  choice: “mula sa”
  alternative: “isinugo ng”
  rationale: Ipinakikita ng teksto ang pinagmulan o awtorisasyon ng pulutong ngunit hindi tahasang inilalarawan ang paraan ng pagsusugo; pinananatili ang ambigwidad.
- issue: Pagkakakilanlan ng εἷς τῶν δώδεκα
  choice: “isa sa Labindalawa”
  alternative: “isa sa labindalawang alagad”
  rationale: Pinananatili ang halos-titulong katawagan sa orihinal at ang diin sa pagiging kabilang ni Judas sa malapit na pangkat ni Jesus.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tagapagturo ng Kautusan” at “matatandang pinuno” upang maging madaling maunawaan ang mga institusyonal na katawagan, habang iniingatan sa talababa ang tunay na ambigwidad ng historical present at ng παρὰ.
