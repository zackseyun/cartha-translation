  terminology: Pinananatili ang “Judas,” “Labindalawa,” “mga punong pari,” “mga eskriba,” at “mga matatanda” bilang matapat at magkakatugmang katawagan. Inayos ang talababa ng historical present upang nakakabit ito sa “dumating,” hindi sa “kaagad.”
