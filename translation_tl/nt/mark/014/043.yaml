  source_fidelity: 'Ang pangunahing diwa ay tapat sa Griyego: biglaang pagdating ni Judas habang nagsasalita pa si Jesus, ang pagkakakilanlan niyang isa sa Labindalawa, ang pulutong na may sandata, at ang ugnayan nito sa mga punong pari, eskriba, at matatanda. Gayunman, ang paghahati sa dalawang pangungusap ay bahagyang nagpapaluwag sa mahigpit na pagkakaugnay ng “kasama niya,” at ang “mga tagapagturo ng Kautusan” at “mga matatandang pinuno” ay mas paliwanag kaysa tuwirang salin ng γραμματέων at πρεσβυτέρων.'
