    issue: Aspekto ng “Naupo siyang kasama”
    rationale: Ang Griyegong ἦν συγκαθήμενος ay periprastikong di-ganap na paglalarawan ng isang patuloy na kalagayan (“was sitting/seated with”). Ang “Naupo” ay perpektibong kilos ng pag-upo at maaaring magmungkahi ng bagong pangyayaring wala sa teksto. Ang “Nakaupo” ay mas tumpak at natural.
  - severity: low
    issue: Aspekto ng “nagpainit”
    rationale: Kasabay ng nagpapatuloy na tagpo ang θερμαινόμενος. Ang “nagpapainit” ay mas malinaw na nagpapanatili ng aspektong nagaganap kaysa “nagpainit.”
