  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: tl
  text: At sinundan siya ni Pedro mula sa malayo hanggang sa loob ng patyo ng pinakapunong pari. Nakaupo siyang kasama ng mga bantay at nagpapainit sa tabi ng apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa tabi ng liwanag” o “tungo sa liwanag,” na malamang ay tumutukoy sa liwanag ng apoy sa patyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: mula sa malayo
  rationale: Likas at malinaw na katumbas sa Filipino na pinananatili ang diwang pansalaysay ng maingat at malayong pagsunod ni Pedro.
- source_word: ἠκολούθησεν αὐτῷ
  choice: sinundan siya
  rationale: Ang payak na nagdaang panahunan ay angkop sa aorist na gamit sa salaysay.
- source_word: ἕως ἔσω εἰς
  choice: hanggang sa loob ng
  rationale: Pinananatili ang diin na nakapasok si Pedro sa panloob na lugar, nang hindi ipinapalagay na pumasok siya sa mismong bahay.
- source_word: αὐλήν
  choice: patyo
  rationale: Karaniwang modernong salitang Filipino para sa nakapaloob na courtyard ng tirahan ng pinakapunong pari.
- source_word: ἀρχιερέως
  choice: pinakapunong pari
  rationale: Malinaw na katumbas ng ἀρχιερεύς at naiiba sa pangkalahatang katawagang mga punong pari.
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: Naupo siyang kasama ng mga bantay
  rationale: Ipinahahayag ang kalagayang pansalaysay at ang pagsamang ipinahihiwatig ng συγκαθήμενος. Sa konteksto ng pagdakip at paglilitis, ang ὑπηρέται ay mga tauhang may tungkuling panseguridad, kaya mas angkop ang “mga bantay” kaysa “mga alipin.”
- source_word: θερμαινόμενος
  choice: nagpainit
  rationale: Natural na Filipino para sa kilos ni Pedro na nagpapainit ng sarili.
- source_word: πρὸς τὸ φῶς
  choice: sa tabi ng apoy
  rationale: Bagaman literal na “sa/tungo sa liwanag,” malinaw sa kilos ng pagpapainit na liwanag ng apoy ang tinutukoy; inilalahad sa talababa ang tunay na leksikal na anyo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pinakapunong pari” para sa tiyak na tungkulin at “mga bantay” para sa mga opisyal na tauhan sa kontekstong ito. Inilagay ang marker pagkatapos ng “apoy,” sapagkat ang talababa ay tumutukoy sa πρὸς τὸ φῶς, hindi sa “mula sa malayo.”
