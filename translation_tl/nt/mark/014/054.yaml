  source_fidelity: 'Tumpak ang pangunahing pagsasalin: naipapahayag ang pagsunod ni Pedro mula sa malayo hanggang sa loob ng patyo ng pinakapunong pari, ang pakikisama niya sa mga bantay, at ang kaugnayan ng liwanag/apoy. Ang talababa ay wastong nakaangkla sa “apoy” at maingat na pinananatili ang literal na saklaw ng πρὸς τὸ φῶς.'
  naturalness: Malinaw at likas sa modernong Filipino ang karamihan ng teksto. Gayunman, ang “Naupo siyang” ay karaniwang tumutukoy sa sandali ng pag-upo, samantalang ang ἦν συγκαθήμενος ay naglalarawan ng nagpapatuloy na kalagayan sa tagpo. Mas angkop ang “Nakaupo siyang.” Ang “nagpapainit” ay mas mabuting katapat ng kasabay na participial na paglalarawan.
  terminology: Ang “patyo,” “pinakapunong pari,” at “mga bantay” ay katanggap-tanggap sa kontekstong ito. Ang “mga bantay” ay isang makatwirang pangkontekstong salin ng ὑπηρέται bilang mga tauhang may tungkuling panseguridad. Hindi kailangang baguhin ang talababa.
  issues:
