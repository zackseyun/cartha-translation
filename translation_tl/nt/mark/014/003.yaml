  source_fidelity: Tumpak na naipapahayag ng draft ang tagpuan sa Betania, ang pagkain nang nakahilig, ang pagkakakilanlan kay Simon bilang “ketongin,” ang di-pinangalanang babae, ang sisidlang alabastro, at ang pagbuhos sa ulo ni Jesus. Gayunman, ang ayos na “pabango—purong nardo” ay hindi gaanong malinaw na pagkakaugnay ng μύρον at νάρδος at maaaring magmukhang pahabol na paglilinaw kaysa paglalarawan ng pabango.
  naturalness: Likas sa pangkalahatan ang register, ngunit mas idiomatiko at malinaw ang “pabangong purong nardo” kaysa “pabango—purong nardo.” Ang ganitong ayos ay pinagbubuklod din ang uri ng pabango at ang pinagtatalunang pang-uring πιστικῆς.
  terminology: Ang “Betania,” “Simon na ketongin,” “sisidlang alabastro,” “nardo,” at “napakamahal” ay angkop. Pinananatili ang “ketongin” nang walang idinagdag na “dating,” alinsunod sa Griyego. Nananatili ang talababa para sa pinagtatalunang πιστικῆς.
  issues:
