reference: Mark 14:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: tl
  text: Habang nasa Betania si Jesus at nakahilig sa hapag sa bahay ni Simon na ketongin, dumating ang isang babae na may dalang sisidlang alabastro na may lamang napakamahal na pabangong purong nardo.[a] Binasag niya ang sisidlan at ibinuhos ang laman nito sa ulo ni Jesus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tunay na nardo”; pinagtatalunan ang eksaktong kahulugan ng salitang Griyego na isinaling “puro” (πιστικῆς).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Habang nasa Betania si Jesus at nakahilig sa hapag
  rationale: Inilalahad ng genitive absolute ang kasabay at nagpapatuloy na tagpo. Likas sa Filipino ang “habang,” at nililinaw ng “sa hapag” na ang pagkakahilig ay posisyon sa pagkain, hindi basta paghiga.
- source_word: Βηθανίᾳ
  choice: Betania
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: sa bahay ni Simon na ketongin
  rationale: Pinananatili ang mismong katawagan ng Griyego at hindi idinaragdag ang “dating,” na hindi tahasang sinabi sa teksto.
- source_word: γυνὴ
  choice: isang babae
  rationale: Hindi pinangalanan o higit na kinilala ang babae sa talatang ito.
- source_word: ἀλάβαστρον
  choice: sisidlang alabastro
  rationale: Tumutukoy ang salita sa isang lalagyang karaniwang yari sa alabastro. Mas malawak at malinaw sa modernong Filipino ang “sisidlan” kaysa sa mas tiyak ngunit posibleng mapanlinlang na “banga.”
- source_word: μύρου
  choice: pabango
  rationale: Tumutukoy sa mabangong langis o pamahid; malinaw at natural ang “pabango” sa konteksto.
- source_word: νάρδου
  choice: nardo
  rationale: Pinananatili ang tiyak na uri ng mahalagang halamang mabango sa halip na gawing pangkalahatang langis lamang.
- source_word: πιστικῆς
  choice: puro
  rationale: Malawak na nauunawaan itong tumutukoy sa kadalisayan o pagiging tunay ng nardo, ngunit hindi tiyak ang kahulugan; kaya inilalagay sa talababa ang mahalagang alternatibo.
- source_word: πολυτελοῦς
  choice: napakamahal
  rationale: Malinaw na ipinahahayag ang napakataas na halaga, na mahalaga sa kasunod na reaksiyon sa salaysay.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Binasag niya ang sisidlan
  rationale: Nauna ang kilos ng participle sa pagbubuhos. Hindi pinalalabis ng “binasag” ang paraan o tindi ng pagkawasak.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: ibinuhos ang laman nito sa ulo ni Jesus
  rationale: Natural sa Filipino na tukuyin ang ipinagbuhos bilang laman ng sisidlan. Ginamit ang pangalang “Jesus” upang maging malinaw ang tinutukoy ng panghalip sa salin.
theological_decisions:
- issue: Kung papalitan ang katawagang “Simon na ketongin” ng “Simon na dating ketongin”
  choice: Panatilihin ang “Simon na ketongin”
  alternative: Simon na dating ketongin
  rationale: Walang salitang “dating” sa Griyego. Bagaman posibleng gumaling na siya, hindi ito tahasang sinasabi ng talata, kaya hindi dapat gawing bahagi ng pangunahing teksto ang palagay na iyon.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang “nakahilig sa hapag” upang maipakita ang sinaunang paraan ng pagkain nang hindi maging teknikal. Inilagay ang pananda ng talababa pagkatapos ng “purong nardo,” ang pariralang aktuwal nitong ipinapaliwanag.
