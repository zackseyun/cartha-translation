  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: tl
  text: At dumating sila sa isang lugar na tinatawag na Getsemani, at sinabi niya sa kanyang mga alagad, “Maupo kayo rito hanggang sa manalangin ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: dumating sila
  rationale: Ang pangkasalukuyang anyo ay historical present sa salaysay. Mas natural sa makabagong Tagalog ang pangnagdaan na “dumating sila,” habang napapanatili ang takbo ng salaysay.
- source_word: χωρίον
  choice: isang lugar
  rationale: Maaaring tumukoy ang salita sa isang lugar, lupain, o ari-arian. Ang “isang lugar” ay natural at hindi nagdaragdag ng espesipikong impormasyong wala sa teksto.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: na tinatawag na Getsemani
  rationale: Natural na Tagalog ito para sa pariralang nagsasaad ng pangalan. Isinalin sa nakaugaliang anyong Filipino ang pangalang Γεθσημανί bilang “Getsemani.”
- source_word: λέγει
  choice: sinabi niya
  rationale: Isa rin itong historical present. Ginawang pangnagdaan upang maging pare-pareho at likas ang salaysay sa Tagalog, nang hindi binabago ang kahulugan.
- source_word: μαθηταῖς
  choice: mga alagad
  rationale: Ang “mga alagad” ang tumpak at nakaugaliang katumbas sa konteksto ng ugnayan ng guro at mga tinuturuan.
- source_word: Καθίσατε
  choice: Maupo kayo
  rationale: Tuwirang utos ito. Ang “Maupo kayo” ay natural, malinaw, at may angkop na dignidad sa modernong Tagalog.
- source_word: ὧδε
  choice: rito
  rationale: Direkta at natural na katumbas ito ng deiktikong pang-abay na nangangahulugang “dito.”
- source_word: ἕως προσεύξωμαι
  choice: habang nananalangin ako
  rationale: Bagaman karaniwang naghahayag ang ἕως at aorist subjunctive ng hangganang temporal, sa natural na Tagalog ang “habang nananalangin ako” ang malinaw na utos na manatili sila roon sa panahon ng kanyang pananalangin. Hindi nito ipinapalagay ang karagdagang detalye tungkol sa tagal o kinalabasan.
