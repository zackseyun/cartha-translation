  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: tl
  text: At umalis ang mga alagad at pumasok sa lungsod, at natagpuan nila iyon gaya ng sinabi niya sa kanila, at inihanda nila ang Paskuwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hapunan ng Paskuwa.” Ang Griyegong τὸ πάσχα ay maaaring tumukoy sa Paskuwa sa pangkalahatan o, sa kontekstong ito, sa hapunang inihahanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: umalis
  rationale: Likas at tuwirang ipinapahayag ang pag-alis nila sa dati nilang kinaroroonan.
- source_word: μαθηταὶ
  choice: mga alagad
  rationale: Karaniwang katawagan sa Filipino para sa mga tagasunod at tinuturuan ni Jesus.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: pumasok sa lungsod
  rationale: Ipinapahayag ang pagdating na may pagpasok sa lungsod at pinananatili ang pagkakaiba nito sa naunang pag-alis.
- source_word: πόλιν
  choice: lungsod
  rationale: Tuwirang katumbas ng πόλις at angkop sa Jerusalem sa konteksto.
- source_word: εὗρον
  choice: natagpuan nila ang lahat
  rationale: Walang tahasang layon sa Griyego; ang “ang lahat” ay likas na tumutukoy sa mga kalagayang natagpuan nila nang hindi nililimitahan iyon sa iisang bagay.
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: gaya ng sinabi niya sa kanila
  rationale: Pinananatili ang pagtutugma ng kanilang natagpuan sa naunang sinabi ni Jesus.
- source_word: ἡτοίμασαν
  choice: inihanda nila
  rationale: Malinaw at karaniwang salin ng paggawa o pagsasaayos upang maging handa.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Pinananatili ang mas malawak na katawagan sa Griyego at ang posibilidad na sa konteksto ay tumutukoy ito sa hapunan ng Paskuwa.
