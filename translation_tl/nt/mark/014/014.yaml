id: MRK.14.14
reference: Mark 14:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: tl
  text: At saanman siya pumasok, sabihin ninyo sa namamahala sa bahay, ‘Sinasabi ng Guro, “Nasaan ang silid-panauhin ko[a] kung saan ko makakain ang Paskuwa kasama ng mga alagad ko?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matutuluyan” o “silid.” Ang salitang Griyego ay tumutukoy sa isang lugar na matutuluyan; dito, malamang na silid ito para sa mga panauhin sa isang pribadong bahay, hindi isang komersiyal na bahay-tuluyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: saanman siya pumasok
  rationale: Ipinahahayag ng ὅπου kasama ng ἐάν at pasakaling pandiwa ang isang di-tiyak na lugar; likas itong naihahatid ng “saanman.”
- source_word: εἴπατε
  choice: sabihin ninyo
  rationale: Pautos na maramihan ito, na nakatuon sa dalawang alagad at nagpapakilala sa tuwirang pananalita.
- source_word: οἰκοδεσπότῃ
  choice: sa namamahala sa bahay
  rationale: Tinutukoy nito ang taong may pananagutan at kapangyarihan sa sambahayan nang hindi ipinapalagay na siya ang legal na may-ari ng bahay.
- source_word: Ὁ διδάσκαλος
  choice: ang Guro
  rationale: Pinananatili ang karaniwang kahulugan at ang paggamit dito bilang kinikilalang tawag kay Jesus, nang hindi pinatitindi tungo sa ibang titulo.
- source_word: κατάλυμά
  choice: silid-panauhin
  rationale: Sa kontekstong ito, tumutukoy ito sa matutuluyan o silid para sa mga panauhin sa isang bahay, hindi sa isang komersiyal na πανδοχεῖον o bahay-tuluyan.
- source_word: μου
  choice: ko
  rationale: Malinaw na nasa tekstong Griyego ang panghalip na paari at pinananatili rito ang posibleng diwa ng silid na inilaan o nakahanda para kay Jesus at sa kaniyang pangkat.
- source_word: τὸ πάσχα
  choice: ang Paskuwa
  rationale: Maaaring tumukoy ang πάσχα sa kapistahan o sa hapunan; dahil kasama rito ang pandiwang “kumain,” sapat at hindi labis na tiyak ang “Paskuwa.”
- source_word: μετὰ τῶν μαθητῶν μου
  choice: kasama ng mga alagad ko
  rationale: Ang “mga alagad” ang likas at nakaugaliang salin sa Ebanghelyo, at pinananatili nito ang ugnayan nila kay Jesus bilang mga tagasunod na tinuturuan.
- source_word: φάγω
  choice: ko makakain
  rationale: Inihahatid nito ang pasakaling kilos sa sugnay na naglalarawan sa hinahanap na lugar, sa halip na gawing payak na pahayag tungkol sa hinaharap.
theological_decisions:
- issue: Pagkakasalin sa pagtukoy ni Jesus sa sarili bilang διδάσκαλος
  choice: ang Guro
  alternative: ang Panginoon / ang Maestro
  rationale: Ang “Guro” ang tuwirang karaniwang kahulugan ng διδάσκαλος at pinananatili ang pagkakakilanlan sa salaysay nang hindi nagdaragdag ng higit na mariing pahayag tungkol sa awtoridad kaysa sa mismong salitang Griyego.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “namamahala sa bahay” sa halip na “may-ari” upang hindi magdagdag ng ideya ng legal na pagmamay-ari. Inilagay ang talababa pagkatapos ng “silid-panauhin,” ang salitang aktuwal na ipinapaliwanag nito.
