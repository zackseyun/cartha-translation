id: MRK.14.21
reference: Mark 14:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: tl
  text: Sapagkat pupunta ang Anak ng Tao ayon sa nasusulat tungkol sa kanya; ngunit kasawi-sawi ang taong iyon na sa pamamagitan niya ay ipinagkakanulo ang Anak ng Tao.[a] Mabuti pa sana para sa taong iyon kung hindi siya ipinanganak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “na sa pamamagitan niya ay ibinibigay ang Anak ng Tao sa kamay ng iba.”
    reason: Ipinatataas ang literal na kahulugang “ibigay/ihandog” ng παραδίδοται habang pinananatili ng pangunahing teksto ang diwa ng pagtataksil sa konteksto.
lexical_decisions:
- source_word: ὅτι
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o dahilan na kaugnay ng naunang pahayag ni Jesus.
- source_word: ὁ μὲν ... δὲ
  choice: '...; ngunit ...'
  rationale: Likas sa Tagalog na ipahiwatig ang μέν at ilantad ang pagsalungat sa pamamagitan ng “ngunit.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ang Anak ng Tao
  rationale: Pinananatili ang nakaugaliang titulo ni Jesus at ang posibleng alusyon nito sa Daniel.
- source_word: ὑπάγει
  choice: papanaw
  rationale: Sa kontekstong ito, tumutukoy ang pag-alis ni Jesus sa nalalapit niyang kamatayan; ang “papanaw” ay marangal at likas sa Tagalog nang hindi tahasang dinaragdagan ang paraan ng kanyang pagpanaw.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: ayon sa nasusulat tungkol sa kanya
  rationale: Pinananatili ang pagkakatugma ng mangyayari sa nakasulat sa Kasulatan at ang nananatiling bisa ng γέγραπται.
- source_word: οὐαὶ
  choice: kasawi-sawi
  rationale: Naghahatid ng matinding propetikong babala at kapahamakan sa natural na modernong Tagalog.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ang taong iyon
  rationale: Pinananatili ang tiyak at mariing pagtukoy ng demonstratibo nang hindi kailangang gumamit ng salitang may diin sa kasarian.
- source_word: δι’ οὗ ... παραδίδοται
  choice: na magkakanulo sa Anak ng Tao
  rationale: Ang aktibong ayos ay mas natural sa Tagalog at malinaw na ipinahahayag ang mapandayang pagkakanulo sa agarang konteksto; inilalagay sa talababa ang mas literal na “ipinagkakanulo/ibinibigay.”
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Mabuti pa sana para sa taong iyon kung hindi na siya ipinanganak
  rationale: Ang “sana” ay malinaw na naghahatid ng salungat-sa-katotohanang kondisyon; ang “hindi na” ay natural na katumbas dito ng hindi nangyaring kapanganakan.
theological_decisions:
- issue: Kahulugan ng παραδίδοται sa salaysay ng pagpapakasakit
  choice: magkakanulo
  alternative: ipinagkakanulo; ibinibigay sa kamay ng iba
  rationale: Itinatampok ng agarang konteksto ang pagtataksil ni Judas, ngunit pinananatili sa talababa ang mas literal at mas malawak na diwa ng paghahatid o pagbibigay sa kamay ng iba.
- issue: Ugnayan ng katuparan ng nasusulat at pananagutan ng nagkanulo
  choice: 'Pinanatili ang parehong pahayag: papanaw ang Anak ng Tao ayon sa nasusulat, ngunit kasawi-sawi ang nagkanulo sa kanya.'
  alternative: Pagpapaliwanag na ang nasusulat ay nag-aalis o lubusang nagtatakda ng pananagutan ng tao
  rationale: Hindi nilulutas ng salin ang tensiyon sa pagitan ng katuparan ng Kasulatan at ng pananagutan ng nagkanulo; kapwa malinaw na pinananatili ang mga ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “papanaw” para sa solemne at kontekstuwal na diwa ng ὑπάγει, at “kasawi-sawi” para sa matinding οὐαί. Nasa pangunahing teksto ang marker na [a], ayon sa talababa.
