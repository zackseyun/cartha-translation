review_pass:
  verdict: revise
  source_fidelity: Ang “papanaw” ay maaaring unawain bilang eupemismo para sa kamatayan, samantalang ang ὑπάγει ay mas malawak na “pumupunta/umaalis” at hindi nito tahasang binabanggit ang kamatayan. Ang pangunahing sugnay tungkol sa pagkakanulo ay mas tapat kung pananatilihin ang balintiyak na “sa pamamagitan niya ay ipinagkakanulo,” sa halip na gawing tahasang aktibo at panghinaharap na “magkakanulo.”
  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Ang “pupunta” ay mas neutral at modernong Filipino kaysa “papanaw” sa talatang ito. Ang ayos na “na sa pamamagitan niya ay ipinagkakanulo...” ay bahagyang pormal ngunit natural at angkop sa solemne, biblikal na rehistro.
  terminology: Ang “Anak ng Tao,” “nasusulat,” at “kasawi-sawi” ay angkop. Inayos ang talababa upang tunay itong magbigay ng alternatibong leksikal na salin ng παραδίδοται nang hindi maling tawaging “mas literal” ang halos kaparehong anyo ng pangunahing teksto.
  issues:
  - severity: medium
    issue: Ang “papanaw” ay mas tiyak kaysa sa ὑπάγει.
    rationale: Karaniwang tumutukoy ang “papanaw” sa pagkamatay; ang Griyego ay nagsasabing ang Anak ng Tao ay “pumupunta/umaalis,” kahit ang konteksto ay patungo sa pagpapakasakit.
  - severity: medium
    issue: Ang “na magkakanulo” ay nagbabago sa balintiyak at pangkasalukuyang παραδίδοται.
    rationale: Inililipat nito ang diin mula sa “sa pamamagitan niya ay ipinagkakanulo” tungo sa isang tahasang aktibo at panghinaharap na pahayag. Maaaring natural ang aktibong salin, ngunit hindi kinakailangang isakripisyo ang anyo at diin ng pinagmulan.
  - severity: low
    issue: Hindi ganap na tumutugma ang kasalukuyang talababa sa pangunahing teksto.
    rationale: Ang “ipinagkakanulo” ay inilalahad bilang “mas literal,” ngunit ito na ang mas malapit na salin na dapat nasa pangunahing teksto; mas kapaki-pakinabang na itala ang “ibinibigay” o “inihahandog sa kamay ng iba” bilang alternatibo.
  revised_text: Sapagkat pupunta ang Anak ng Tao ayon sa nasusulat tungkol sa kanya; ngunit kasawi-sawi ang taong iyon na sa pamamagitan niya ay ipinagkakanulo ang Anak ng Tao.[a] Mabuti pa sana para sa taong iyon kung hindi siya ipinanganak.
  revised_footnotes:
