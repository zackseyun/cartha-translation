- from: Sapagkat papanaw ang Anak ng Tao, ayon sa nasusulat tungkol sa kanya; ngunit kasawi-sawi ang taong iyon na magkakanulo sa Anak ng Tao.[a] Mabuti pa sana para sa taong iyon kung hindi na siya ipinanganak.
  to: Sapagkat pupunta ang Anak ng Tao ayon sa nasusulat tungkol sa kanya; ngunit kasawi-sawi ang taong iyon na sa pamamagitan niya ay ipinagkakanulo ang Anak ng Tao.[a] Mabuti pa sana para sa taong iyon kung hindi siya ipinanganak.
  rationale: Pinalitan ang “papanaw” ng neutral na “pupunta” upang hindi tahasang ipasok ang kamatayan sa pandiwa. Ibinalik ang balintiyak na konstruksiyon para mapanatili ang “sa pamamagitan niya” at ang anyo ng παραδίδοται. Inayos ang talababa bilang tunay na leksikal na alternatibo.
