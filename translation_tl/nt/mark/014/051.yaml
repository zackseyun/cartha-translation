  naturalness: Natural sa makabagong Tagalog ang "May isang binatang sumusunod sa kanya." Mas malinaw at mas magaan ang "na may telang lino lamang na nakabalot sa hubad niyang katawan" kaysa "na nakabalot lamang ng telang lino sa hubad niyang katawan," habang hindi itinatakda kung ang σινδών ay kasuotan, sapin, o ibang uri ng telang lino.
