  register: Makabago at dignidad na salaysay. Ginamit ang “may isang binata” para sa natural na pagpapakilala sa di-pinangalanang tauhan. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
