  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: tl
  text: May isang binatang sumusunod sa kanya, na may telang lino lamang na nakabalot sa hubad niyang katawan[a], at sinasunggaban nila siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapin na lino.” Ang salitang Griyego ay maaaring tumukoy sa telang lino o sa telang maaaring gamitin bilang sapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: isang binata
  rationale: Ang νεανίσκος ay isang binata o kabataang lalaki, at ang τις ay nagpapakilala sa kanya bilang isang di-pinangalanang indibidwal. Likas na naipahahayag ito sa Tagalog sa pariralang “may isang binata.”
- source_word: συνηκολούθει
  choice: sumusunod
  rationale: Ipinahihiwatig ng imperpektong anyo ang nagpapatuloy na kilos. Sa konstruksyong “may isang binatang sumusunod,” natural na napapanatili ang diwa ng patuloy na pagsunod noon.
- source_word: περιβεβλημένος
  choice: nakabalot
  rationale: Maaaring tumukoy ang participle sa pagsusuot o pagbalot. Pinananatili ng “nakabalot” na hindi tiyak kung ang lino ay isang kasuotan o isang piraso lamang ng tela.
- source_word: σινδόνα
  choice: telang lino
  rationale: Ang σινδών ay telang lino na maaaring tela, sapin, o tila kumot; ang “telang lino” ang pinakamalawak at hindi labis na tiyak na salin.
- source_word: ἐπὶ γυμνοῦ
  choice: sa hubad niyang katawan
  rationale: Nililinaw ng parirala na tuwirang nakabalot sa katawan ang lino at walang ibang suot sa ilalim nito.
- source_word: κρατοῦσιν
  choice: sinunggaban
  rationale: Sa kontekstong ito, ang κρατέω ay marahas na paghawak o pagsamsam sa tao. Ang “sinunggaban” ay mas tiyak kaysa “hinawakan” at hindi nagdaragdag ng pormal na kahulugan ng pag-aresto.
