  - severity: medium
    issue: Hindi natural na “Narinig naming sinabi niya”
    rationale: Hindi nito maayos na naipahahayag sa Tagalog ang konstruksyong “we heard him saying.” Ang “Narinig namin siyang nagsasabi” ay kapwa natural at mas malapit sa pinagmulan.
