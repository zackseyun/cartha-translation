  naturalness: Ang binagong pangungusap ay mas natural at malinaw sa modernong Filipino, lalo na ang “Narinig namin siyang nagsasabi.” Ang “ibang templong” ay malinaw na tumutukoy sa ikalawang templo nang hindi nagdaragdag ng kahulugang wala sa Griyego.
  terminology: Ang “templo,” “wawasakin,” “magtatayo,” at ang magkatugmang “ginawa ng mga kamay” / “hindi ginawa ng mga kamay” ay angkop at pinananatili ang mahalagang leksikal at retorikal na pagsalungat ng χειροποίητον at ἀχειροποίητον.
