base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: tl
  text: 'na: “Narinig namin siyang nagsasabi, ‘Wawasakin ko ang templong ito na ginawa ng mga kamay[b], at sa loob ng tatlong araw ay magtatayo ako ng ibang templong hindi ginawa ng mga kamay.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “ginawa ng mga kamay” at “hindi ginawa ng mga kamay” ay nagpapanatili sa tuwirang pagsalungat ng mga salitang Griyego na χειροποίητον at ἀχειροποίητον.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: na nagsasabi
  rationale: Ipinagdurugtong nito ang talata sa naunang pahayag at ipinakikilala ang nilalaman ng patotoo; hindi ito sanhi na ‘sapagkat.’
- source_word: Ἡμεῖς
  choice: naming
  rationale: Ang tahasang panghalip ay pinananatili sa anyong likas sa Tagalog upang maipahiwatig ang pagdidiin ng mga saksi sa sarili nilang patotoo.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: Narinig naming sinabi niya
  rationale: Likas na Tagalog ito para sa konstruksiyong nangangahulugang narinig nila siyang nagsasalita, nang hindi dinaragdagan ang nilalaman.
- source_word: καταλύσω
  choice: Wawasakin ko
  rationale: Sa konteksto ng isang gusali, tumutukoy ito sa paggiba o pagwasak; malinaw na naihahatid ng ‘wawasakin’ ang bigat ng paratang.
- source_word: ναὸν τοῦτον
  choice: ang templong ito
  rationale: Pinananatili ang demonstratibong ‘ito’ at ginagamit ang karaniwang salitang ‘templo’ para sa ναός sa kontekstong ito.
- source_word: χειροποίητον
  choice: ginawa ng mga kamay
  rationale: Malapit sa anyo ng Griyego at pinananatili ang tuwirang pagtutulad at pagsalungat sa ἀχειροποίητον.
- source_word: διὰ τριῶν ἡμερῶν
  choice: sa loob ng tatlong araw
  rationale: Ipinahahayag ang yugto o saklaw ng panahong tatlong araw, habang nananatiling natural sa makabagong Tagalog.
- source_word: ἄλλον
  choice: ibang
  rationale: Pinananatili ang pahayag na isa pang templo, o ibang templo, ang itatayo kapalit ng una.
- source_word: ἀχειροποίητον
  choice: hindi ginawa ng mga kamay
  rationale: Sadyang itinutugma sa ‘ginawa ng mga kamay’ upang mapanatili ang retorikal at posibleng teolohikal na pagsalungat nang hindi ito binibigyang-kahulugang lampas sa teksto.
- source_word: οἰκοδομήσω
  choice: magtatayo ako
  rationale: Tumpak at natural na salin ng ‘magtatayo’; hindi ginawang ‘muling magtatayo’ sapagkat walang tahasang sangkap na ‘muli’ sa Griyego.
theological_decisions:
- issue: Kung lilinawin na ang pahayag ay bahagi ng salungat na patotoo at hindi tuwirang pagpapatibay ng tagapagsalaysay
  choice: Panatilihin ito bilang iniulat na sinabi ng mga saksi, nang walang dagdag na paliwanag
  alternative: Dagdagan ng pananalitang nagpapahiwatig na binaluktot umano nila ang sinabi ni Jesus
  rationale: Iniuulat lamang ng talata ang inaangkin ng mga saksi na narinig nila. Hindi dapat ipasok sa salin ang pagpapaliwanag o pagkakatugma mula sa ibang talata.
- issue: Kung paano pananatilihin ang posibleng teolohikal na saysay ng paghahambing sa dalawang templo
  choice: ‘ginawa ng mga kamay’ / ‘hindi ginawa ng mga kamay’
  alternative: ‘gawa ng tao’ / ‘gawa ng Diyos’
  rationale: Pinananatili ng napiling salita ang mismong pagsalungat sa Griyego at hindi ipinapasya kung ano ang eksaktong tinutukoy ng ‘hindi ginawa ng mga kamay.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na himig ng patotoo sa paglilitis, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Ang ‘sa loob ng tatlong araw’ ay likas na nagsasaad ng panahong saklaw ng pagkilos.
