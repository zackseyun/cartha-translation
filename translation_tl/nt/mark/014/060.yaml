  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: tl
  text: At tumayo sa gitna[a] ang pinakapunong pari at tinanong si Jesus, “Wala ka bang isasagot? Ano ang ipinapatotoo ng mga taong ito laban sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “patungo sa gitna.” Ipinahihiwatig ng parirala na pumuwesto ang pinakapunong pari sa gitna ng kapulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: tumayo
  rationale: Ipinahahayag ng aorist participle ang pisikal na pagtayo ng pinakapunong pari; natural at tuwiran ang “tumayo” sa makabagong Tagalog.
- source_word: ὁ ἀρχιερεὺς
  choice: ang pinakapunong pari
  rationale: Tumutukoy ito sa nag-iisang mataas na paring namumuno sa paglilitis, hindi sa mga punong pari bilang isang pangkat.
- source_word: εἰς μέσον
  choice: sa gitna
  rationale: Pinananatili nito ang ideya ng pagpuwesto sa sentrong bahagi ng kapulungan nang hindi gumagamit ng lipas o mabigat na pananalita.
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Ang pandiwa ay nangangahulugang magtanong o magsiyasat. Sapat ang “tinanong” sa Tagalog; naipakikita na ng tagpo ang pormal at hudisyal na katangian nito.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Wala ka bang isasagot?
  rationale: Natural nitong naihahatid ang matalim na retorikal na tanong at ang kawalan ng tugon, nang hindi ginagawang pahayag ang tanong.
- source_word: οὗτοί
  choice: mga taong ito
  rationale: Malinaw nitong itinuturo ang mga saksi na naroon. Walang gramatikal na kasarian ang katumbas na demonstratibo sa Tagalog, kaya hindi kailangang idagdag ang “mga lalaking” kung hindi iyon mahalaga sa diwa.
- source_word: καταμαρτυροῦσιν
  choice: ipinapatotoo ... laban sa iyo
  rationale: Pinananatili nito ang kasalukuyang kilos at ang legal na diwa ng pagbibigay ng patotoong laban sa isang tao, sa halip na paikliin lamang bilang “isinasakdal.”
theological_decisions:
- issue: Kasarian ng tinutukoy ng οὗτοί
  choice: mga taong ito
  alternative: mga lalaking ito
  rationale: Bagaman panlalaking maramihan ang anyong Griyego at tumutukoy sa mga saksing naroon, hindi karaniwang minamarkahan ng Tagalog ang kasarian sa ganitong demonstratibo. Iniiwasan ng salin ang pagdidiin sa kasarian na hindi sentro sa pahayag habang malinaw pa rin ang tiyak na pangkat na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal ang rehistro. Ginamit ang karaniwang “pinakapunong pari” para sa natatanging katungkulan at pinanatili ang matalim na anyo ng dalawang tanong. Hindi na isinalin nang hiwalay ang λέγων sapagkat likas nang ipinahahayag sa Tagalog ng “tinanong ...” na sinusundan ng tuwirang sipi.
