  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: tl
  text: At isinama niya sina Pedro, Santiago, at Juan, at nagsimula siyang makadama ng matinding pagkabagabag[a] at paghihirap ng kalooban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matinding pagkasindak.” Maaaring tumukoy ang unang pandiwa sa matinding pagkabigla, pangamba, o pagkabagabag sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: isinama niya
  rationale: Ipinahahayag nito na pinili ni Jesus ang tatlo upang sumama sa kaniya. Ginamit ang karaniwang anyong pangnagdaan sa Filipino para sa likas at malinaw na pagsasalaysay, bagaman nasa makasaysayang pangkasalukuyan ang Griyego.
- source_word: μετ’ αὐτοῦ
  choice: isinama niya
  rationale: Nakapaloob na sa pandiwang “isinama” ang diwang “kasama niya,” kaya hindi na ito inulit sa paraang magiging mabigat sa Filipino.
- source_word: ἤρξατο
  choice: nagsimula siyang makadama
  rationale: Pinananatili ng “nagsimula” ang ingressive na diwa ng Griyego at ang malinaw na pag-unlad ng tagpo.
- source_word: ἐκθαμβεῖσθαι
  choice: matinding pagkabagabag
  rationale: Ipinahahayag nito ang napakatinding pagkabigla, pangamba, o emosyonal na pagkaligalig sa konteksto ng Getsemani, hindi lamang karaniwang pagkamangha.
- source_word: ἀδημονεῖν
  choice: paghihirap ng kalooban
  rationale: Inilalarawan nito ang matinding panloob na dalamhati o hirap, at pinananatiling bukod sa unang paglalarawan ang ikalawang pandiwa.
- source_word: καὶ ... καὶ
  choice: at ... at
  rationale: Pinananatili ang paulit-ulit na pang-ugnay na katangian ng estilo ni Marcos at ang naiipong bigat ng tagpo.
theological_decisions:
- issue: Paglalarawan sa damdamin ni Jesus sa Getsemani
  choice: Tuwirang ilarawan ang tunay at matindi niyang emosyonal na pagkabagabag at paghihirap ng kalooban.
  alternative: Gumamit ng mas mahinang “namangha at nabalisa” o mas mapagpasyang “nasindak at nagdalamhati.”
  rationale: Hindi pinahihina ng salin ang ganap na tunay na paghihirap ni Jesus bilang tao, ngunit hindi rin nito dinaragdagan ang teksto ng paliwanag na teolohikal o ng higit na tiyak na sanhi ng damdamin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sina” sa tatlong pangalan ayon sa likas na balarilang Filipino, at iniwasan ang labis na teknikal o makalumang pananalita.
