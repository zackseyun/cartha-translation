  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: tl
  text: Ngunit sinabi ni Jesus, “Pabayaan ninyo siya. Bakit ninyo siya ginugulo? Maganda ang ginawa niya para sa akin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Griyegong parirala ay literal na “sa loob ko”; sa kontekstong ito, idiomatikong isinasalin itong “para sa akin” at maaari ring tumukoy sa gawang ginawa kay Jesus mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinakikita nito ang bahagyang pagsalungat ng tugon ni Jesus sa pagpuna sa babae.
- source_word: Ἄφετε αὐτήν
  choice: Pabayaan ninyo siya
  rationale: Likas na utos ito sa modernong Tagalog na nagpapahinto sa kanilang pakikialam sa babae.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Bakit ninyo siya ginagambala?
  rationale: Ang idyomang Griyego ay tumutukoy sa pagdudulot sa kaniya ng hirap o panggugulo; malinaw at sapat ang bigat ng “ginagambala.”
- source_word: καλὸν ἔργον
  choice: isang magandang gawa
  rationale: Pinananatili ng “maganda” ang saklaw ng καλός bilang maganda, mabuti, marangal, o angkop, habang ang “gawa” ay tuwirang kumakatawan sa ἔργον.
- source_word: ἠργάσατο
  choice: ang ginawa niya
  rationale: Natural sa Tagalog ang pandiwang “ginawa” kasabay ng pangngalang “gawa,” bagaman may bahagyang pag-uulit na katanggap-tanggap sa marangal na salaysay.
- source_word: ἐν ἐμοί
  choice: para sa akin
  rationale: Ipinahahayag nito nang natural na ang ginawa ay nakatuon kay Jesus, nang hindi nililimitahan ang kahulugan sa pisikal na paglalagay lamang.
theological_decisions:
- issue: Saklaw ng καλὸν ἔργον sa pagpuri sa ginawa ng babae
  choice: isang magandang gawa
  alternative: isang mabuting gawa
  rationale: Pinananatili ng salin ang papuri at ang pagiging angkop ng ginawa nang hindi nagdaragdag ng aral tungkol sa merito o sakramento.
- issue: Ugnayang ipinahahayag ng ἐν ἐμοί
  choice: para sa akin
  alternative: sa akin / sa ibabaw ko
  rationale: Natural na ipinakikita ng “para sa akin” na kay Jesus nakatuon ang gawa, ngunit itinatala sa talababa ang mas literal na anyo upang hindi maitago ang posibleng saklaw ng parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” sapagkat ang pandiwang Griyego ay nasa ikalawang panauhang maramihan. Iniwasan ang sobrang kolokyal na “tinitigilan” o “iniinis” at ang labis na pormal na pananalita.
