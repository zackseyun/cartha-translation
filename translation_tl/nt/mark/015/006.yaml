  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: tl
  text: Tuwing kapistahan naman, nagpapalaya siya para sa kanila ng isang bilanggo na hinihiling nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Tuwing kapistahan naman
  rationale: Ang κατά na may accusative ay temporal, at sa pangungusap na ito ay tumutukoy sa nakaugaliang pangyayari tuwing kapistahan. Banayad lamang ang pag-uugnay ng δέ, kaya isinatinig ito sa natural na “naman.”
- source_word: ἀπέλυεν
  choice: nagpapalaya siya
  rationale: Ang imperfect ay nagpapahayag dito ng paulit-ulit o nakaugaliang kilos sa nakaraan. Sa Filipino, likas na naihahayag ng aspektong di-ganap na “nagpapalaya” ang ganitong gawi.
- source_word: αὐτοῖς
  choice: para sa kanila
  rationale: Ipinakikita ng dative ang mga taong nakikinabang sa pagpapalaya; malinaw at natural ang “para sa kanila.”
- source_word: ἕνα δέσμιον
  choice: isang bilanggo
  rationale: Pinananatili ng “isang” ang bilang na tahasang ipinahahayag ng ἕνα, at “bilanggo” ang karaniwang salitang angkop sa kontekstong hudisyal.
- source_word: ὃν παρῃτοῦντο
  choice: na hinihiling nila
  rationale: Sa kontekstong ito, ang παραιτέομαι ay nangangahulugang humiling o humingi. Ang “hinihiling nila” ay natural at pinananatili ang di-ganap o nakaugaliang diwa ng pandiwa.
