  source_fidelity: 'Tapat ang salin sa Griyego: ang “si Jesus ay sumigaw nang malakas” ay maayos na nagsasalin sa ἀφεὶς φωνὴν μεγάλην, at ang “nalagutan ng hininga” ay likas na Tagalog na idyomatikong katumbas ng ἐξέπνευσεν, na pinananatili ang imahen ng hininga at ang kahulugang namatay.'
