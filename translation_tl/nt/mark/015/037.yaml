id: MRK.15.37
reference: Mark 15:37
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: tl
  text: Ngunit si Jesus ay sumigaw nang malakas[a] at nalagutan ng hininga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpakawala ng isang malakas na sigaw” o “naglabas ng malakas na tinig.”
    reason: lexical_alternative
  - marker: b
    text: O “namatay”; literal, “huminga palabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Isang banayad na pang-ugnay ang δέ. Ang “Ngunit” ay angkop sa maringal na pagbaling ng salaysay sa kasukdulang sandaling ito, bagaman maaari rin itong isaling “At.”
- source_word: ἀφεὶς
  choice: sumigaw
  rationale: Sa pariralang ἀφεὶς φωνὴν μεγάλην, ang participle ng ἀφίημι ay tumutukoy sa pagpapakawala ng tinig o sigaw. Likas at tuwiran sa modernong Tagalog ang “sumigaw” para sa buong konstruksiyon.
- source_word: φωνὴν μεγάλην
  choice: nang malakas
  rationale: Maaaring mangahulugan ang φωνή ng tinig, tunog, o sigaw, at inilalarawan ng μεγάλην ang lakas nito. Kasama ng “sumigaw,” malinaw at natural na naipahahayag ng “nang malakas” ang malakas na pagbulalas.
- source_word: ἐξέπνευσεν
  choice: nalagutan ng hininga
  rationale: Ang ἐκπνέω ay literal na may larawang paghinga palabas at idyomatikong nangangahulugang mamatay. Pinananatili ng “nalagutan ng hininga” ang larawan ng hininga at ang maringal na himig nang hindi nagdaragdag ng ideya ng kusang pagbibigay ng espiritu.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ngunit si Jesus
  rationale: Hindi kailangang katawanin nang hiwalay ang artikulo bago ang pangalang pantangi; natural itong isinasalin bilang “si Jesus,” kalakip ang pang-ugnay na “Ngunit.”
theological_decisions:
- issue: Paglalarawan sa kamatayan ni Jesus nang walang idinadagdag na teolohikal na pahiwatig
  choice: nalagutan ng hininga
  alternative: namatay; ibinigay ang kanyang espiritu
  rationale: Maikli at pasalaysay na inilalahad ng talata ang kamatayan ni Jesus. Ang “nalagutan ng hininga” ay tumutugma sa larawan ng pandiwang Griego; ang “ibinigay ang kanyang espiritu” ay maaaring magpasok ng pananalita mula sa ibang Ebanghelyo at magpahiwatig ng higit sa mismong pandiwa rito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang payak na “sumigaw nang malakas” sa halip na mas mabigat na nominal na parirala, at pinanatili sa “nalagutan ng hininga” ang pisikal na larawan at solemnidad ng Griego.
