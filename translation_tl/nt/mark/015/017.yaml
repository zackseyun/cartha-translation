  source_fidelity: 'Ang "Pagkatapos" sa kasalukuyang dalawang pangungusap ay maaaring magpahiwatig na ang paghahabi ng korona ay nangyari lamang matapos isuot ang kulay-ube. Sa Griyego, ang πλέξαντες ay tumutukoy nang tuwiran sa pagkilos na paglalagay ng korona: matapos/na makapaghabi ng koronang tinik, inilagay nila ito sa kanya. Iniaayos ng rebisyon ang saklaw at pagkakasunod na ito nang hindi nagdaragdag ng uri ng kasuotan.'
