  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: tl
  text: At sinuotan nila siya ng kulay-ube[a], at matapos maghabi ng koronang tinik, ipinutong nila ito sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinuotan nila siya ng kulay-ubeng kasuotan.” Hindi tahasang binabanggit sa Griyego ang uri ng kasuotan sa talatang ito, bagaman ipinahihiwatig ng konteksto na ito ay isang kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: sinuotan nila siya
  rationale: Likas sa makabagong Tagalog at pinananatili ang diwang may ibang naglalagay ng kasuotan sa kanya.
- source_word: πορφύραν
  choice: damit na kulay-ube
  rationale: Maaaring tumukoy ang pangngalan sa telang purpura o kasuotang purpura. Kailangan ng Tagalog ng malinaw na tinutukoy upang maging natural, ngunit hindi tinukoy na balabal ang uri ng damit.
- source_word: περιτιθέασιν
  choice: ipinutong iyon sa kanya
  rationale: Sa konteksto ng korona, ang 'ipinutong' ang likas na katumbas ng paglalagay nito sa ulo; ang 'iyon' ay nilinaw ang ipinahihiwatig na layon.
- source_word: πλέξαντες
  choice: Pagkatapos, naghabi sila
  rationale: Ipinakikita ng anyong aorist participle na nauna ang paggawa ng korona bago ito ipinutong.
- source_word: ἀκάνθινον
  choice: tinik
  rationale: Ang pariralang 'koronang tinik' ay natural at malinaw na nagsasaad na yari sa mga tinik ang korona.
- source_word: στέφανον
  choice: korona
  rationale: Pinakamalinaw nitong naihahatid ang mapanuyang paggaya sa pagkahari sa konteksto, bagaman maaari ring mangahulugang putong ang salitang Griyego.
theological_decisions:
- issue: Mapanuyang larawan ng pagkahari sa pagpapahiya kay Jesus
  choice: korona
  alternative: putong o στεφανος bilang koronang-parangal
  rationale: Pinananatili ng 'korona' ang eksena ng panunuya sa pagkahari nang hindi nagdaragdag ng paliwanag na teolohikal sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'kulay-ube' bilang karaniwang-unawaing katawagan sa purpura, at iniwasang tukuyin bilang 'balabal' ang kasuotan dahil hindi iyon tahasang nakasaad sa Griyego.
