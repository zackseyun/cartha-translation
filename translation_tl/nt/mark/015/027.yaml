  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: tl
  text: Kasama niya, ipinako nila sa krus ang dalawang tulisan[a], isa sa kanyang kanan at isa sa kanyang kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bandido”; maaari ring “mga rebelde” kung may pampolitikang pahiwatig ang salita.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: kasama niya
  rationale: Ipinahahayag ng σύν na may datibo ang pagsama; natural at tuwiran sa modernong Tagalog ang “kasama niya.”
- source_word: σταυροῦσιν
  choice: ipinako sa krus
  rationale: Bagaman nasa pangkasalukuyang anyo ang Griyego bilang historical present, mas natural sa salaysay na Tagalog ang aspektong pangnagdaan na “ipinako,” habang malinaw na pinananatili ng “sa krus” ang paraan ng pagpatay.
- source_word: δύο λῃστάς
  choice: dalawang tulisan
  rationale: Ang λῃστής ay maaaring tumukoy sa magnanakaw, tulisan, o bandido, at kung minsan ay may pahiwatig ng paghihimagsik. Ang “tulisan” ay malawak, likas, at hindi agad nagtatakda ng tiyak na pampolitikang kahulugan.
- source_word: ἕνα ἐκ δεξιῶν
  choice: isa sa kanan niya
  rationale: Ang parirala ay tumutukoy sa puwesto sa kanang panig ni Jesus; maikli at natural ang “sa kanan niya.”
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: isa sa kaliwa
  rationale: Ang εὐωνύμων ay eupemistikong tawag sa kaliwang panig. Sa magkatambal na ayos ng pangungusap, malinaw na ang “kaliwa” ay kaliwa ni Jesus kahit hindi ulitin ang panghalip.
theological_decisions:
- issue: Kahulugan ng λῃσταί sa salaysay ng pagpapako sa krus
  choice: tulisan
  alternative: mga bandido; mga rebelde
  rationale: Maaaring tumukoy ang salita sa mararahas na magnanakaw o bandido at, sa ilang konteksto, sa mga rebelde. Hindi sapat ang talatang ito upang tiyakin ang pampolitikang kahulugan, kaya pinanatili sa pangunahing teksto ang mas malawak na “tulisan” at inilagay sa talababa ang mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang salaysay na pangnagdaan sa halip na piliting tularan ang Griyegong historical present; pinanatili ang pambungad na “At” upang katawanin ang καί at ang pagkakaugnay sa naunang talata.
