  verdict: revise
  source_fidelity: Ang "dalawang tulisan" ay wastong salin ng δύο λῃστάς, at ang talababa ay angkop na nagpapanatili ng mga posibleng kahulugang "bandido" at, kung may pampolitikang pahiwatig, "rebelde." Ang pagkakalagay na isa sa kanan at isa sa kaliwa niya ay tapat sa Griyego. Gayunman, ang "kasama niyang ipinako" ay may depektibong saklaw at maaaring basahing parang ang "kasama" ang paksa o tagaganap; hindi nito malinaw na naihahayag na sila ay ipinako kasama ni Jesus.
  naturalness: Mas natural at malinaw sa modernong Filipino ang paglalagay ng "Kasama niya" bilang pambungad na parirala at ng "ipinako nila" bilang panaguri. Ang pag-uulit ng "kanyang" sa kanan at kaliwa ay nag-aalis ng anumang kalabuan tungkol sa pinagtutukuyan ng mga posisyon.
  terminology: Ang "ipinako sa krus," "tulisan," at "kanan/kaliwa" ay angkop sa marangal ngunit makabagong rehistro. Pinanatili ang lexical na pag-iingat sa λῃσταί sa talababa nang hindi ipinipilit ang kahulugang pampolitika.
