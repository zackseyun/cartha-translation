lexical_decisions:
- source_word: Ἦν
  choice: noon
  rationale: Ang imperpektong anyo ng εἰμί ay ginagamit dito upang ilahad ang oras ng pangyayari; natural sa Filipino ang hulihang “noon” sa ganitong pagsasalaysay.
- source_word: δὲ
  choice: at
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay, hindi nagpapahayag ng matinding pagsalungat. Ang “at” ay likas at sapat sa konteksto.
- source_word: ὥρα τρίτη
  choice: ikatlong oras
  rationale: Pinananatili ang sinaunang pagtukoy sa oras sa halip na isingit sa teksto ang makabagong katumbas nito.
- source_word: ἐσταύρωσαν
  choice: ipinako nila ... sa krus
  rationale: Karaniwan at malinaw na Filipino para sa pagpatay sa pamamagitan ng pagpapako sa krus; naipahahayag ang aktibong pandiwa at ang di-tiyak na simuno.
- source_word: αὐτόν
  choice: siya
  rationale: Tuwirang layon na tumutukoy kay Jesus; sapat at natural ang panghalip na “siya.”
theological_decisions:
- issue: Paglalahad ng oras kaugnay ng kronolohiya
  choice: Panatilihin sa pangunahing teksto ang literal na “ikatlong oras.”
  alternative: Isalin bilang “mga alas nuwebe ng umaga.”
  rationale: Sinaunang pagtukoy sa oras ang mismong nasa talata. Ang pagpapanatili nito ay hindi nagpapasok ng isang tiyak na paraan ng pagsasaayos ng kronolohiya; ang malamang na makabagong katumbas ay inilalagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang likas na pariralang “ipinako ... sa krus” at pinanatili ang sinaunang katawagang “ikatlong oras,” na ipinaliliwanag sa talababa.
