  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: tl
  text: Ikatlong oras noon nang ipinako nila siya sa krus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, mga alas nuwebe ng umaga, ayon sa karaniwang pagbibilang ng oras ng mga Judio.
