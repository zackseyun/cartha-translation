  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: tl
  text: 'At nagsimula silang magpugay[a] sa kanya: “Mabuhay, Hari ng mga Judio!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bumati sa kanya.” Ang salitang Griego ay maaaring mangahulugang karaniwang pagbati, ngunit dito ay may anyo ng pormal at mapanlibak na pagpupugay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Hari ng mga taga-Judea.” Ang katawagang Griego ay maaaring tumukoy sa mga Judio o sa mga taga-Judea; “mga Judio” ang ginamit dito dahil ito ang karaniwang diwa ng pamagat sa salaysay ng pagpapakasakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: At
  rationale: Pinananatili ng payak na pang-ugnay ang sunod-sunod at parataktikong estilo ni Marcos nang hindi dinaragdagan ng tahasang panahong diwa gaya ng “Pagkatapos.”
- source_word: ἤρξαντο
  choice: sinimulan nila
  rationale: 'Likas na ipinahahayag sa Filipino ang ingressive na diwa ng ἄρχομαι kasunod ng pawatas: nagsimula silang gawin ang kilos.'
- source_word: ἀσπάζεσθαι
  choice: batiin
  rationale: Ang karaniwang kahulugan ay bumati; sa konteksto, ang pagbati ay pormal at mapanlibak. Pinananatili sa pangunahing teksto ang natural na Filipino, habang nililinaw sa talababa ang anyo ng panunuya.
- source_word: Χαῖρε
  choice: Mabuhay ka
  rationale: Dito ang pautos ay idyomatikong pagbati o pagpupugay, hindi literal na utos na magsaya. Ang “Mabuhay ka” ay nauunawaang pormal na pagpupugay sa Filipino at nababagay sa kunwaring parangal sa isang hari.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Hari ng mga Judio
  rationale: Tuwirang isinasalin ang bokatibong βασιλεῦ bilang “Hari.” Ang “mga Judio” ang karaniwan at angkop na katawagan sa pamagat sa salaysay ng pagpapakasakit, habang kinikilala sa talababa ang posibleng heograpikong diwa.
theological_decisions:
- issue: Paglalarawan sa mapanlibak na pagpupugay kay Jesus nang hindi pinahihina ang ironiya at makaharing diwa nito
  choice: “Mabuhay ka, Hari ng mga Judio!” bilang kunwaring makaharing pagpupugay
  alternative: “Binabati ka namin, Hari ng mga Judio!”
  rationale: Ipinapakita ng konteksto na ginagaya ng mga kawal ang isang pormal na pagpupugay sa hari. Pinananatili ng “Mabuhay ka” ang makahari at ironikong tono nang hindi nagdaragdag ng doktrinal na paliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ang “sinimulan nila siyang batiin” ay malapit sa anyo ng Griego, at ang “Mabuhay ka” ay isang madaling maunawaang pormal na pagpupugay na nagdadala ng mapanlibak na tono ng tagpo. Ang mga pananda ng talababa ay parehong nasa pangunahing teksto at nakaayos ayon sa puntong tinutukoy.
