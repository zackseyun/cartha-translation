  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: tl
  text: Ngunit muling nagtanong sa kanya si Pilato, “Wala ka bang isasagot? Tingnan mo kung gaano karami ang ibinibintang nila laban sa iyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Tingnan mo kung gaano karaming bagay ang ibinibintang nila laban sa iyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat o pag-usad ng salaysay kaugnay ng patuloy na pananahimik ni Jesus.
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinakikita na inulit ni Pilato ang pagtatanong.
- source_word: ἐπηρώτα
  choice: tinanong
  rationale: Natural sa modernong Tagalog at angkop sa hudisyal na tagpo; sa konteksto, naipahihiwatig ng pandiwang di-ganap ang nagpapatuloy o muling pagtatanong nang hindi kailangang gawing mabigat na “interogahin.”
- source_word: λέγων
  choice: “
  rationale: Sa natural na Tagalog, sapat nang tuwirang ipakilala ang sinabing tanong sa pamamagitan ng panipi; hindi kailangang isalin nang hiwalay bilang “na sinasabi.”
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Wala ka bang isasagot?
  rationale: Idyomatiko at pinananatili ang diin ng dobleng negatibong Griyego sa kawalan ng tugon ni Jesus.
- source_word: ἴδε
  choice: Tingnan mo
  rationale: Karaniwang pautos na tumatawag ng pansin at hindi makaluma ang himig.
- source_word: πόσα
  choice: kung gaano karami ang mga paratang
  rationale: Ang literal na “kung gaano karaming bagay” ay nilinaw bilang “mga paratang” dahil iyon ang ipinahihiwatig ng κατηγοροῦσιν at ng hudisyal na konteksto.
- source_word: σου
  choice: laban sa iyo
  rationale: Likas na Tagalog para sa taong pinatutungkulan ng pag-aakusa.
- source_word: κατηγοροῦσιν
  choice: ang mga paratang nila laban sa iyo
  rationale: Inihahayag ang kasalukuyang pag-aakusa sa natural na nominal na anyo sa Tagalog nang hindi nagdaragdag ng uri o bigat ng sakdal.
