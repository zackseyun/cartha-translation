translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kay Pilato” upang gawing hayag ang ipinahihiwatig na taong hinihilingan sa konteksto; hindi ito tahasang inuulit sa Griyegong talata. Pinanatili ang pisikal na diwa ng ἀναβὰς sa “umahon.”
