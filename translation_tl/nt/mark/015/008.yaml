translation:
  language: tl
  text: At umakyat ang karamihan at nagsimulang humiling kay Pilato na gawin niya para sa kanila ang nakagawian niyang gawin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “At nang makaakyat ang karamihan, nagsimula silang humiling kay Pilato ayon sa nakagawian niyang gawin para sa kanila.”'
    reason: Pinananatili ng alternatibo ang participial na diwa ng ἀναβὰς at ang mas tuwirang ayos ng καθώς, ngunit mas mabigat ito sa natural na Filipino.
lexical_decisions:
- source_word: ἀναβὰς
  choice: umahon
  rationale: Ang aorist participle ng ἀναβαίνω ay nagpapahiwatig ng pag-ahon o paglapit paitaas. Pinananatili ng “umahon” ang tahasang kilos sa Griyego nang hindi dinaragdagan ang tagpo.
- source_word: ὁ ὄχλος
  choice: ang mga tao
  rationale: Ang ὄχλος ay tumutukoy sa nagkakatipong karamihan. Mas natural sa makabagong salaysay ang “ang mga tao” kaysa “ang karamihan,” habang malinaw pa ring kolektibo ang tinutukoy.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: nagsimulang humiling
  rationale: Tuwirang ipinapahayag ng ἄρχομαι kasama ng infinitive ang pagsisimula ng kilos. Ang gitnang anyo ng αἰτέω rito ay isang pakiusap o kahilingan, kaya ang “humiling” ay mas angkop kaysa karaniwang “magtanong.”
- source_word: καθὼς
  choice: ang nakaugalian niyang gawin
  rationale: Karaniwang nangangahulugang “kung paano/gaya ng,” ngunit sa ugnayan nito sa imperfect na ἐποίει ay tumutukoy ito sa nakagawiang ginagawa ni Pilato. Natural itong ipinahayag sa Filipino bilang “ang nakaugalian niyang gawin.”
- source_word: ἐποίει
  choice: nakaugalian niyang gawin
  rationale: Ang imperfect ay may diwang nakagawian o paulit-ulit na kilos sa nakaraan; malinaw itong naipahahayag ng “nakaugalian.”
- source_word: αὐτοῖς
  choice: para sa kanila
  rationale: 'Ang datibo ay benefactive sa kontekstong ito: ang nakagawiang pabor ay ginagawa para sa kapakanan ng mga tao.'
