id: MRK.15.1
reference: Mark 15:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: tl
  text: At agad-agad, maagang-maaga, nagpulong ang mga punong pari kasama ang mga matatanda, ang mga tagapagturo ng Kautusan, at ang buong kapulungan[a]. Matapos nilang gapusin si Jesus, dinala nila siya at ipinasa kay Pilato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang buong Sanhedrin.” Ang salitang Griego na συνέδριον ay tumutukoy sa namumunong kapulungan ng mga Hudyo.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: kaagad
  rationale: Pinananatili nito ang katangiang pagmamadali at mabilis na pag-usad ng salaysay ni Marcos sa natural na modernong Tagalog.
- source_word: πρωῒ
  choice: kinaumagahan
  rationale: Ipinahihiwatig nito ang maagang oras sa umaga at maayos na iniuugnay ang pangyayari sa naunang salaysay.
- source_word: συμβούλιον ποιήσαντες
  choice: nagpulong
  rationale: Likas at malinaw itong paglalarawan sa pormal na pagsasanggunian ng mga pinuno, nang hindi pinipilit ang literal ngunit alanganing pariralang 'gumawa ng sanggunian.'
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Tumutukoy ito sa mga pangunahing awtoridad ng mga pari, hindi sa maraming kasalukuyang mataas na pari.
- source_word: πρεσβυτέρων
  choice: mga nakatatanda
  rationale: Karaniwang tawag ito sa kinikilalang mga pinuno sa kontekstong Judio at hindi lamang paglalarawan sa kanilang edad.
- source_word: γραμματέων
  choice: mga tagapagturo ng Kautusan
  rationale: Ipinapahayag nito sa ordinaryong mambabasa ang tungkulin ng mga γραμματεῖς bilang mga dalubhasa at guro ng Kautusan; mas malinaw ito kaysa sa hiram na salitang 'mga eskriba.'
- source_word: ὅλον τὸ συνέδριον
  choice: ang buong kapulungan
  rationale: Isinasalin nito ang institusyon bilang namumunong kapulungan habang pinananatili sa talababa ang mas tiyak na makasaysayang katawagang 'Sanhedrin.'
- source_word: δήσαντες
  choice: iginapos nila
  rationale: Tuwirang ipinakikita na tinalian si Jesus bago siya dalhin.
- source_word: ἀπήνεγκαν
  choice: dinala siya
  rationale: Natural ito sa konteksto ng pagdadala sa isang taong nasa kustodiya at hindi nagpapahiwatig na binuhat siya.
- source_word: παρέδωκαν
  choice: ibinigay kay Pilato
  rationale: Ipinakikita nito ang paglilipat kay Jesus sa kapangyarihan o kustodiya ni Pilato nang hindi nagdaragdag ng doktrinal na paliwanag.
- source_word: Πιλάτῳ
  choice: Pilato
  rationale: Ito ang nakagawiang anyo ng pangalang Πιλᾶτος sa Tagalog.
theological_decisions:
- issue: Tinutukoy ng συνέδριον
  choice: Isinalin bilang 'ang buong kapulungan.'
  alternative: ang buong Sanhedrin
  rationale: Mas madaling maunawaan ng karaniwang mambabasa ang saling 'kapulungan,' samantalang inilalagay sa talababa ang tiyak na makasaysayang katawagan upang hindi mawala ang institusyonal na kahulugan.
- issue: Diwa ng παρέδωκαν sa salaysay ng paghihirap
  choice: Isinalin bilang 'ibinigay kay Pilato,' na nagpapahiwatig ng paglilipat sa kaniyang kapangyarihan o kustodiya.
  alternative: ipinaubaya kay Pilato; ipinasa kay Pilato
  rationale: Pinananatili ng salin ang pormal na paglilipat kay Jesus sa awtoridad ng Roma ngunit hindi ipinapasok sa talata ang mas malawak na teolohikal na kahulugan na maaaring taglayin ng pandiwa sa kabuuan ng salaysay.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang 'mga tagapagturo ng Kautusan' para sa agarang pagkaunawa at 'kapulungan' para sa institusyon, na may makasaysayang katawagang 'Sanhedrin' sa talababa. Inilagay ang panandang [a] pagkatapos ng mismong pariralang tinatalakay ng talababa.
