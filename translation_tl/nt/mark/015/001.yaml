revisions:
- from: At kaagad, kinaumagahan, nagpulong ang mga punong pari kasama ang mga nakatatanda, ang mga tagapagturo ng Kautusan, at ang buong kapulungan[a]. Pagkatapos, iginapos nila si Jesus, dinala siya, at ibinigay kay Pilato.
  to: At agad-agad, maagang-maaga, nagpulong ang mga punong pari kasama ang mga matatanda, ang mga tagapagturo ng Kautusan, at ang buong kapulungan[a]. Matapos nilang gapusin si Jesus, dinala nila siya at ipinasa kay Pilato.
  rationale: Pinalitan ang “kinaumagahan” ng “maagang-maaga” upang tuwirang maisalin ang πρωῒ nang hindi nagdaragdag ng pagtukoy sa susunod na araw. Inayos ang huling sugnay upang malinaw na maipakita ang pagkakasunod ng paggapos, pagdadala, at pormal na pagpapasa kay Pilato. Ginawang “mga Hudyo” ang makabagong anyo sa talababa.
