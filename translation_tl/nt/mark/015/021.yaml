  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: tl
  text: Pinilit nila[a] ang isang taong nagdaraan, si Simon na taga-Cirene—na nanggagaling noon sa bukid[b] at ama nina Alejandro at Rufo—na pasanin ang krus ni Jesus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “pinilit” ay tumutukoy sa sapilitang paglilingkod o pagkuha sa isang tao para sa ipinag-uutos na gawain.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mula sa kanayunan” o “mula sa sakahan”; malawak ang saklaw ng salitang Griyego.
    reason: lexical_alternative
  - marker: c
    text: Ipinapalagay ng ilan na ang pinasan ay ang pahalang na biga ng krus, ngunit “krus” lamang ang sinasabi ng tekstong Griyego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: Pinilit nila
  rationale: Ipinahahayag ng pandiwa ang sapilitang paglilingkod o pagkuha sa isang tao para sa ipinag-uutos na gawain, hindi isang magalang na pakiusap.
- source_word: παράγοντά τινα
  choice: ang isang taong nagdaraan
  rationale: Natural itong Tagalog para sa isang di-tiyak na taong nagkataong dumaraan; pinananatili nito ang di-tiyak na τινα at ang kilos ng παράγοντα.
- source_word: Σίμωνα Κυρηναῖον
  choice: si Simon na taga-Cirene
  rationale: Isinasalin ang heograpikong katawagan sa karaniwang paraang Tagalog na “taga-Cirene,” habang pinananatili ang pangalan.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: na nanggagaling noon sa bukid
  rationale: Maaaring tumukoy ang ἀγρός sa bukid, sakahan, o kanayunan. Ang “bukid” ay maikli at malapit sa saklaw ng salitang Griyego, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: at ama nina Alejandro at Rufo
  rationale: Tuwirang pinananatili ang dagdag na pagkakakilanlan kay Simon nang hindi ipinapalagay kung bakit kilala ng mga mambabasa ang kanyang mga anak.
- source_word: ἵνα ἄρῃ
  choice: na pasanin
  rationale: Pagkatapos ng “pinilit,” natural sa Tagalog ang “na pasanin” upang ipahayag ang layunin ng ἵνα at ang pagbuhat o pagdadala sa krus.
- source_word: σταυρὸν
  choice: krus
  rationale: Ito ang karaniwan at sapat na katumbas ng σταυρός. Hindi nito nililimitahan ang tinutukoy sa “pahalang na biga,” na mas tiyak kaysa sa mismong salitang Griyego.
- source_word: αὐτοῦ
  choice: kanyang
  rationale: Pinananatili ang panghalip ng tekstong Griyego sa halip na palitan ito ng tahasang pangalang “Jesus”; malinaw sa mas malawak na konteksto ang tinutukoy nito.
theological_decisions:
- issue: Ang uri ng pag-uutos kay Simon
  choice: Sapilitang kinuha si Simon upang pasanin ang krus.
  alternative: Nakiusap lamang sa kanya o kusang-loob siyang tumulong.
  rationale: May diwang pamimilit at sapilitang paglilingkod ang ἀγγαρεύω; hindi dapat palambutin ng salin ang puwersa ng salaysay.
- issue: Ang tiyak na bagay na pinasan ni Simon
  choice: “Krus” ang nasa pangunahing teksto.
  alternative: “Pahalang na biga ng krus.”
  rationale: σταυρός ang ginamit ng tekstong Griyego. Bagaman posibleng pahalang na biga ang aktuwal na pinasan ayon sa ilang rekonstruksiyong pangkasaysayan, hindi iyon espesipikong sinabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong nagdaraan” sa halip na mas teknikal o matandang pananalita, at pinanatili ang maikling ayos ng salaysay. Ang mga gitling ay naghihiwalay sa impormasyong nagpapakilala kay Simon upang madaling masundan ang pangunahing kilos.
