  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: tl
  text: Iligtas mo ang iyong sarili[a]—bumaba ka mula sa krus!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Iligtas mo ang iyong sarili, pagkababa mo mula sa krus.” Maaari ring unawain: “Iligtas mo ang iyong sarili sa pamamagitan ng pagbaba mo mula sa krus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: Iligtas
  rationale: Aorist imperative, ikalawang panauhang isahan, na ginagamit bilang mapanuyang utos. Ang “iligtas” ay tuwiran at pinananatili ang ugnay sa bokabularyo ng kaligtasan.
- source_word: σεαυτόν
  choice: ang iyong sarili
  rationale: Reflexive pronoun na tuwirang layon ng σῶσον; malinaw nitong pinananatili ang mapanuyang diin na iligtas niya ang sarili niya.
- source_word: καταβάς
  choice: bumaba ka
  rationale: Aorist active participle ng καταβαίνω. Sa siksik na mapanuyang pahayag na ito, natural sa modernong Tagalog ang koordinadong pautos, habang inilalagay sa talababa ang mas pormal na participial na ugnayan.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: mula sa krus
  rationale: Karaniwang pariralang nagsasaad ng paggalaw palayo sa krus; “krus” ang angkop na katumbas ng σταυρός sa salaysay ng pagpapakasakit.
theological_decisions:
- issue: Ugnayan ng participle na καταβάς sa imperative na σῶσον
  choice: 'Ipinahayag bilang dalawang magkaugnay na pautos: “Iligtas mo ang iyong sarili—bumaba ka mula sa krus!”'
  alternative: “Iligtas mo ang iyong sarili sa pamamagitan ng pagbaba mula sa krus!” o, mas pormal, “Iligtas mo ang iyong sarili, pagkababa mula sa krus!”
  rationale: Maaaring unawain ang participle bilang kasabay na kilos, paraan, o siksik na karugtong ng pautos. Iniiwasan ng pangunahing salin ang tahasang pagtakda na instrumental ang ugnayan, samantalang pinananatili ng talababa ang pormal na anyo at ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang em dash upang ihayag ang siksik at mapanuyang ugnayan ng utos at participle nang hindi labis na nilulutas ang sintaktikong kalabuan.
