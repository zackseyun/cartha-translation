  source_fidelity: Tapat ang salin sa Griyego. Naipapahayag ng “nang gumabi na” ang ἤδη ὀψίας γενομένης, ng “dahil” ang paliwanag o sanhi ng ἐπεὶ, at ng “ibig sabihin, araw bago ang Sabbath” ang paliwanag na ὅ ἐστιν προσάββατον. Hindi nito ipinipilit ang mas tiyak na “Biyernes” sa pangunahing teksto.
