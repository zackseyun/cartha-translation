id: MRK.15.42
reference: Mark 15:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: Καὶ ἤδη ὀψίας γενομένης, ἐπεὶ ἦν παρασκευή, ὅ ἐστιν ⸀προσάββατον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: tl
  text: At nang gumabi na[a], dahil Araw ng Paghahanda noon—ibig sabihin, araw bago ang Sabbath[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang sumapit na ang gabi.”
    reason: lexical_alternative
  - marker: b
    text: Sa Griyego, ang “Araw ng Paghahanda” ay ang araw bago ang Sabbath; tradisyonal na ito ang Biyernes. Maaari ring isalin ang huling parirala na “bisperas ng Sabbath.”
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ
  choice: At
  rationale: Pinananatili ang payak at magkakaugnay na estilo ng pagsasalaysay ni Marcos.
- source_word: ἤδη ὀψίας γενομένης
  choice: nang gumabi na
  rationale: Likas na modernong Tagalog ito para sa temporal na genitive absolute at malinaw na naipahahayag ang ἤδη, ‘na.’
- source_word: ἐπεὶ
  choice: dahil
  rationale: Ipinahahayag nito ang sanhi o paliwanag na ipinakikilala ng ἐπεὶ at natural ang daloy sa Tagalog.
- source_word: παρασκευή
  choice: Araw ng Paghahanda
  rationale: Sa kontekstong ito, tumutukoy ito sa kinikilalang araw ng paghahanda bago ang Sabbath, hindi lamang sa pangkalahatang paghahanda.
- source_word: ὅ ἐστιν
  choice: ibig sabihin
  rationale: Natural at malinaw na pormulang nagpapaliwanag sa modernong Tagalog.
- source_word: προσάββατον
  choice: araw bago ang Sabbath
  rationale: Direktang ibinibigay ang kahulugan ng salitang Griyego nang hindi ito pinakikitid sa ‘Biyernes,’ na mas interpretatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang pambungad na “At” at ang di-tapos na daloy ng pangungusap dahil nagpapatuloy ang kaisipan sa kasunod na talata. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal.
