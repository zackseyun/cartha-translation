  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: tl
  text: 'At nakasulat sa karatulang nagsasaad ng paratang laban sa kanya: “Ang Hari ng mga Judio.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang Hari ng mga taga-Judea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: karatula
  rationale: Tumutukoy ito sa nakasulat na pabatid na inilagay sa krus. Ang “karatula” ay natural sa modernong Filipino at malinaw na nagpapahiwatig ng isang nakapaskil na sulat.
- source_word: αἰτία
  choice: paratang laban sa kanya
  rationale: Sa kontekstong panghukuman, tumutukoy ang salita sa paratang o saligang ipinahayag laban kay Jesus. Pinananatili ng salin ang legal na diwa nang hindi nagpapaliwanag nang labis.
- source_word: ἐπιγεγραμμένη
  choice: nakasulat
  rationale: Ang periphrastic na anyo kasama ng ἦν ay nagsasaad na ang teksto ay nakasulat at nananatiling mababasa. Likas at malinaw sa Filipino ang “nakasulat.”
- source_word: βασιλεὺς
  choice: Hari
  rationale: Bahagi ito ng pormal na katawagan sa mismong paratang; ang malaking titik ay angkop sa siniping pamagat.
- source_word: Ἰουδαίων
  choice: mga Judio
  rationale: Ito ang kinikilalang katawagan sa bayan o pangkat na tinutukoy sa pormulang “Hari ng mga Judio” sa salaysay ng pagpapakasakit. Ang heograpikong alternatibong “mga taga-Judea” ay inilagay sa talababa.
theological_decisions:
- issue: Pagkasalin sa Ἰουδαίων sa titulong nasa krus
  choice: mga Judio
  alternative: mga taga-Judea
  rationale: Iniuulat ng talata ang katawagang nakapaloob sa paratang ng mga Romano. Pinananatili ng “mga Judio” ang karaniwang pambansa at panrelihiyong katawagan nang hindi ito nililimitahan sa heograpiya lamang; gayunman, kinikilala sa talababa ang posibleng heograpikong diwa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “karatula” sa halip na mas teknikal na “inskripsiyon,” at pinanatili ang maikli at pormal na anyo ng paratang.
