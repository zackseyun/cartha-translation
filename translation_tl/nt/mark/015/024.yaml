  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: tl
  text: Ipinapako nila siya sa krus at pinaghahati-hatian ang kanyang mga damit. Nagpapalabunutan sila para malaman kung sino ang kukuha ng alin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nagpapalabunutan sila tungkol sa mga iyon—kung sino ang kukuha ng alin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: Ipinapako nila siya sa krus
  rationale: Pinananatili ng aspektong imperpektibo ng “ipinapako” ang masiglang historikal na kasalukuyan ng salaysay ni Marcos, samantalang malinaw na ipinahihiwatig ng “sa krus” ang paraan ng pagpatay.
- source_word: διαμερίζονται
  choice: pinaghahati-hatian
  rationale: Likas sa Filipino ang anyong ito para sa paghahati ng mga bagay sa ilang tao at angkop sa distributibong diwa ng pandiwa.
- source_word: ἱμάτια
  choice: mga damit
  rationale: Karaniwan, malinaw, at sapat na marangal ang “mga damit,” at pinananatili nito ang kongkretong maramihang diwa ng salitang Griyego.
- source_word: βάλλοντες κλῆρον
  choice: nagpapalabunutan
  rationale: Ito ang likas na modernong ekspresyon sa Filipino para sa pagpapasiya sa pamamagitan ng sapalarang pagpili o palabunutan.
- source_word: ἐπ’ αὐτὰ
  choice: para malaman
  rationale: Sa konteksto, ang palabunutan ay tungkol sa pamamahagi ng mga damit; ipinapahayag ng pariralang ito nang natural ang layunin ng kilos, habang nililinaw sa kasunod na sugnay ang resulta.
- source_word: τίς τί ἄρῃ
  choice: kung sino ang kukuha ng alin
  rationale: Pinananatili nito ang dalawang distributibong pananong—kung sinong tao at kung aling damit—nang hindi tinutukoy nang higit sa sinasabi ng Griyego.
theological_decisions:
- issue: Historikal na kasalukuyan sa salaysay ng pagpapakasakit
  choice: Ipinapako nila siya sa krus
  alternative: Ipinako nila siya sa krus
  rationale: Sinasalamin ng kasalukuyang aspektong “ipinapako” ang vivid na historikal na kasalukuyan ng Griyego. Isa itong pasiyang pangsalaysay, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “damit” sa halip na mas mataas o lumang “kasuotan,” at “nagpapalabunutan” bilang likas na katumbas ng idyomang Griyego. Hinati sa dalawang pangungusap upang maging madaling basahin nang hindi binabago ang ugnayan ng mga kilos.
