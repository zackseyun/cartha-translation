id: MRK.15.36
reference: Mark 15:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: tl
  text: May isang taong tumakbo, pinuno ng maasim na alak[a] ang isang espongha, ikinabit iyon sa isang tambo, at ipinaiinom niya ito sa kanya. Sinabi niya, “Hayaan ninyo siya.[b] Tingnan natin kung darating si Elias upang ibaba siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “maasim na alak” ay murang inuming alak na maasim, hindi kinakailangang suka sa karaniwang makabagong kahulugan.
    reason: cultural_note
  - marker: b
    text: O, “Maghintay kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: tumakbo
  rationale: Ang aorist participle ay likas na isinalin bilang unang kilos sa sunod-sunod na salaysay.
- source_word: τις καὶ
  choice: may isang
  rationale: Tinutukoy ng τις ang isang taong hindi pinangalanan; hindi kailangang hiwalay na isalin ang καί sa natural na Tagalog.
- source_word: γεμίσας σπόγγον ὄξους
  choice: pinuno ng maasim na alak ang isang espongha
  rationale: Ang ὄξος ay maasim at murang inuming alak, hindi kinakailangang modernong suka; pinananatili rin ng ‘pinuno’ ang larawan ng γεμίσας.
- source_word: περιθεὶς καλάμῳ
  choice: ikinabit iyon sa isang tambo
  rationale: Ipinahihiwatig ng participle ang paglalagay o pagkakabit ng espongha sa κάλαμος; pinananatili ng ‘tambo’ ang tiyak na kahulugan kaysa sa pangkalahatang ‘patpat.’
- source_word: ἐπότιζεν αὐτόν
  choice: ipinainom iyon sa kanya
  rationale: Natural itong paglalarawan sa Tagalog ng pagpapainom kay Jesus; hindi sapilitang minamarkahan ang aspektong imperfect dahil malinaw ang nagpapatuloy o isinasagawang kilos sa konteksto.
- source_word: Ἄφετε
  choice: Hayaan ninyo siya
  rationale: Ang pautos na maramihan ay nauunawaan bilang paghiling sa iba na huwag munang pakialaman si Jesus; inilalahad sa talababa ang posibleng idyomatikong kahulugang ‘Maghintay kayo.’
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Tingnan natin kung darating si Elias
  rationale: Natural na Tagalog ito para sa deliberative subjunctive at sa nilalamang ipinakikilala ng εἰ, habang nananatili ang inaabangang posibleng pagdating ni Elias.
- source_word: καθελεῖν αὐτόν
  choice: upang ibaba siya
  rationale: Sa konteksto ng pagpapako sa krus, ang καθαιρέω ay tumutukoy sa pagbaba sa isang taong nasa mataas na kinalalagyan.
theological_decisions:
- issue: Layunin ng nagsasalita sa Ἄφετε
  choice: Isinalin bilang utos na hayaan muna si Jesus upang makita kung mamamagitan si Elias.
  alternative: Maaari itong unawain bilang idyomatikong utos na ‘Maghintay kayo.’
  rationale: 'Hindi tahasang nilulutas ang interpretatibong kalabuan: nasa pangunahing teksto ang mas tuwirang diwa, at nasa talababa ang natural na alternatibo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘espongha,’ ‘tambo,’ at ‘Elias’ bilang madaling maunawaang mga katawagan. Inayos ang mga pananda ng talababa ayon sa mismong pariralang ipinapaliwanag ng bawat tala.
