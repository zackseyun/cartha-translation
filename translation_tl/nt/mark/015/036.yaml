  to: May isang taong tumakbo, pinuno ng maasim na alak[a] ang isang espongha, ikinabit iyon sa isang tambo, at ipinaiinom niya ito sa kanya. Sinabi niya, “Hayaan ninyo siya.[b] Tingnan natin kung darating si Elias upang ibaba siya.”
