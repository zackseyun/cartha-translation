  naturalness: Natural at modernong Tagalog ang “sa harap ng pasukan ng libingan,” at mas tuwiran ang “binalot niya si Jesus” kaysa sa dating ellipted na “binalot sa telang iyon.”
  terminology: Nananatiling angkop ang “telang lino,” “libingan,” at “inihimlay.” Ang “inuka sa bato” ay tumpak para sa libingang hinubog mula sa batuhan.
