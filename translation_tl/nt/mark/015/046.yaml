source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: tl
  text: At matapos bumili ng telang lino[a], ibinaba niya si Jesus, binalot niya ito sa telang lino, at inihimlay niya ito sa isang libingang inuka sa bato[b]. Pagkatapos, iginulong niya ang isang bato sa harap ng pasukan ng libingan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “telang lino na pambalot sa bangkay” para sa σινδών.
    reason: lexical_alternative
  - marker: b
    text: O “libingang tinibag mula sa batuhan.”
    reason: lexical_alternative
  - marker: c
    text: O “sa harap ng pintuan ng libingan”; ang salitang Griyego na θύρα ay maaaring mangahulugang “pinto” o “pasukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: telang lino / telang iyon
  rationale: Ang σινδών ay telang yari sa lino na maaaring gamiting pambalot sa paglilibing. Likas at malinaw sa modernong Tagalog ang “telang lino”; ang “telang iyon” sa ikalawang banggit ay malinaw na tumutukoy sa telang kabibili lamang.
- source_word: καθελών
  choice: ibinaba niya si Jesus
  rationale: Sa konteksto, ang καθαιρέω ay tumutukoy sa pagbaba sa katawan ni Jesus mula sa krus. Inilantad ang pangalang “Jesus” upang maging malinaw ang reperente ng panghalip sa Tagalog nang hindi nagdaragdag ng bagong impormasyon.
- source_word: ἐνείλησεν
  choice: binalot
  rationale: Tumpak at natural na ipinahahayag ng “binalot” ang pagbalot o paglukob na tinutukoy ng pandiwa, nang hindi nagdaragdag ng di-binanggit na detalye sa paghahanda sa paglilibing.
- source_word: ἔθηκεν
  choice: inihimlay
  rationale: Ang “inihimlay” ay marangal at angkop sa konteksto ng paglilibing, at natural na katumbas ng paglalagay sa katawan sa libingan.
- source_word: μνημείῳ / μνημείου
  choice: libingan / libingan
  rationale: Dito ang μνημεῖον ay isang lugar na pinaglibingan, partikular na isang silid-libingang inuka sa bato. Malinaw at karaniwan ang “libingan” sa Tagalog.
- source_word: λελατομημένον ἐκ πέτρας
  choice: inuka sa bato
  rationale: Ipinahihiwatig ng perpektong pasibong pandiwari ang natapos nang kalagayan ng libingan. Ang “inuka sa bato” ay maikli, natural, at malinaw na nagsasaad na ginawa ang libingan sa batuhan.
- source_word: προσεκύλισεν
  choice: iginulong
  rationale: Ipinapahayag ng “iginulong” ang paraan ng paggalaw sa bato; ang direksiyon at layunin ay nililinaw ng kasunod na parirala.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: upang isara ang pasukan ng libingan
  rationale: Maaaring tumukoy ang θύρα sa pinto o pasukan. Sa konteksto ng batong iginulong sa bungad ng libingan, likas sa Tagalog ang “pasukan”; ang “upang isara” ay nagpapahayag ng malinaw na resulta o gamit ng pagkakagulong sa bato.
- source_word: ἀγοράσας
  choice: matapos bumili
  rationale: Ang aorist participle ay nagsasaad ng kilos na nauna sa mga sumunod. Natural na ipinakikita ng “matapos bumili” ang pagkakasunod-sunod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinili ang “inihimlay” bilang dignified ngunit madaling maunawaang salita sa konteksto ng paglilibing; iniwasan ang labis na teknikal o makalumang pananalita.
