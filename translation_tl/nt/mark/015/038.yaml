  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: tl
  text: At napunit sa dalawa ang kurtina ng templo[a][b], mula sa itaas hanggang sa ibaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabing ng templo.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay maaaring tumukoy nang mas tiyak sa santuwaryo, ang banal na bahagi sa loob ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: kurtina
  rationale: Tumutukoy ito sa nakasabit na tabing sa loob ng templo. Ang “kurtina” ay malinaw at natural sa makabagong Filipino, habang ang “tabing” ay inilalagay bilang leksikal na alternatibo sa talababa.
- source_word: ναοῦ
  choice: ng templo
  rationale: Ang ναός ay maaaring tumukoy nang mas tiyak sa santuwaryo o banal na bahagi ng templo, ngunit natural at pamilyar sa pangunahing teksto ang “templo”; pinananatili sa talababa ang mas tiyak na diwa.
- source_word: ἐσχίσθη
  choice: napunit
  rationale: Ang aorist passive ay nagsasaad na ang kurtina ang dumanas ng pagpunit. Ang “napunit” ay tuwiran at natural, at hindi tahasang nagdaragdag kung sino ang gumawa nito.
- source_word: εἰς δύο
  choice: sa dalawa
  rationale: Natural na ipinahahayag nito na nahati ang kurtina sa dalawang bahagi nang hindi idinaragdag ang salitang “piraso,” na wala sa Griyego.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: mula sa itaas hanggang sa ibaba
  rationale: Pinananatili nito ang direksiyon at buong lawak ng pagkakapunit sa natural na Filipino.
- source_word: καὶ
  choice: At
  rationale: Payak na pang-ugnay ito sa naunang pangyayari at hindi nagdaragdag ng temporal na diin.
theological_decisions:
- issue: Posibleng kahulugang teolohikal ng pagkapunit ng kurtina ng templo
  choice: Ilarawan lamang ang pangyayari nang hindi ipinapaliwanag ang simbolismo nito sa pangunahing teksto.
  alternative: Ipaliwanag na nangangahulugan ito ng pagbukas ng daan patungo sa Diyos o ng paghatol sa sistema ng templo.
  rationale: Iniulat ng talata ang pangyayari ngunit hindi nito tahasang ipinapaliwanag ang kahulugan. Pinananatili ng salin ang teolohikal na tensiyon at iniiwasang magpasok ng isang partikular na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “kurtina ng templo” sa pangunahing teksto, habang inilagay sa mga talababa ang tradisyonal na “tabing” at ang mas tiyak na saklaw ng ναός.
