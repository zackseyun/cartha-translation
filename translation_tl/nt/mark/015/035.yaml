base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: tl
  text: May ilan sa mga nakatayo roon ang nagsabi nang marinig nila iyon, “Tingnan ninyo! Tinatawag niya si Elias[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tumatawag siya kay Elias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: May
  rationale: Sa Filipino, likas na maisinasama ang pang-ugnay sa pagpapakilala sa ilang taong naroon; ang tahasang “At” ay hindi kailangan upang mapanatili ang daloy ng salaysay.
- source_word: τινες τῶν παρεστηκότων
  choice: ilan sa mga nakatayo roon
  rationale: Pinananatili nito ang di-tiyak na pangkat at ang konkretong diwa ng mga taong nakatayo at naroroon sa tagpo.
- source_word: ἀκούσαντες
  choice: nang marinig iyon
  rationale: Likas na ipinapahayag sa Filipino ang naunang kilos ng aorist participle sa sugnay na temporal. Ang “iyon” ay tumutukoy sa sigaw ni Jesus sa naunang konteksto.
- source_word: ἔλεγον
  choice: ay nagsabi
  rationale: Ito ang pinakanatural na salaysay sa Filipino para sa iniulat na sinabi ng pangkat; hindi ipinipilit ang di-tiyak na ideya ng paulit-ulit na pagsasalita.
- source_word: Ἴδε
  choice: Tingnan ninyo!
  rationale: Makabagong panawag-pansin ito sa Filipino. Ang maramihang “ninyo” ay angkop sapagkat nagsasalita sila sa mga kasamang naroon.
- source_word: Ἠλίαν
  choice: Elias
  rationale: Ito ang nakaugaliang anyo ng pangalan ng propetang Elijah sa Filipino.
- source_word: φωνεῖ
  choice: Tinatawag niya
  rationale: Pinananatili nito ang kasalukuyang kilos at ang payak na pahayag na ang tinutukoy ay si Elias, nang hindi tahasang ipinapaliwanag ang maling pagkaunawa ng mga nakarinig.
theological_decisions:
- issue: Kung tahasang ipaliliwanag na maling pagkaunawa ng mga nakatayo roon ang pag-aakalang tumatawag si Jesus kay Elias
  choice: 'Iniulat lamang ang sinabi nila: “Tinatawag niya si Elias.”'
  alternative: “Akala nila ay humihingi siya ng tulong kay Elias.”
  rationale: Iniulat ng Griyego ang kanilang sinabi at hindi nagdaragdag ng paliwanag ng tagapagsalaysay. Hinahayaan ng salin na maging malinaw ang maling pagkaunawa mula sa konteksto.
- issue: Kung ang φωνεῖ Ἠλίαν ay nangangahulugang tinatawag si Elias o tumatawag kay Elias
  choice: “Tinatawag niya si Elias” sa pangunahing teksto
  alternative: “Tumatawag siya kay Elias”
  rationale: Ang pangunahing salin ay malapit sa tahasang kayarian ng Griyego, samantalang inilalagay sa talababa ang natural na alternatibong maaaring magpahiwatig ng pagtawag para sa paglapit o tulong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo!” bilang likas na panawag-pansin at “Elias” bilang nakaugaliang pangalang Filipino.
