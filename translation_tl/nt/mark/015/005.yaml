lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ang banayad na pagsalungat sa naunang mga paratang at pagtatanong.
- source_word: οὐκέτι
  choice: hindi na
  rationale: Likas na Filipino na pinananatili ang diwang tumigil na ang dating pagsagot.
- source_word: οὐδὲν
  choice: kahit ano
  rationale: Kasama ng negatibong pandiwa, natural nitong ipinahahayag ang lubos na hindi pagsagot.
- source_word: ἀπεκρίθη
  choice: sumagot
  rationale: Karaniwang salin sa konteksto ng pagtatanong at paglilitis.
- source_word: ὥστε
  choice: kaya
  rationale: Malinaw at natural na nagpapahayag ng bunga ng pananahimik ni Jesus.
- source_word: θαυμάζειν
  choice: namangha
  rationale: Dignified at kasalukuyang salitang Filipino para sa matinding pagtataka ni Pilato, nang hindi nagdaragdag ng diwang wala sa teksto.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Bibliyang Filipino.
