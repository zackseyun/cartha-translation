revisions:
- from: Gayon din, kinutya siya ng mga punong pari at mga tagapagturo ng Kautusan habang nag-uusap-usap sila. Sinabi nila, “Iniligtas niya ang iba, pero hindi niya kayang iligtas ang sarili niya!”
  to: Gayon din, kinukutya siya ng mga punong pari[a], kasama ang mga tagapagturo ng Kautusan, habang nag-uusap-usap sila. Sinasabi nila, “Iniligtas niya ang iba; hindi niya kayang iligtas ang sarili niya.”
  rationale: Nilinaw ang μετὰ τῶν γραμματέων sa “kasama ang mga tagapagturo ng Kautusan,” upang manatiling pangunahing simuno ang mga punong pari. Pinanatili ang “habang nag-uusap-usap sila” para sa πρὸς ἀλλήλους, ang aspektong nagpapatuloy sa “Sinasabi nila,” at ang pag-uulit na “iniligtas … iligtas” para sa ἔσωσεν … σῶσαι. Inalis ang padamdam sapagkat hindi ito kailangan upang maipahayag ang panunuya.
