  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: tl
  text: Gayon din, kinukutya siya ng mga punong pari[a], kasama ang mga tagapagturo ng Kautusan, habang nag-uusap-usap sila. Sinasabi nila, “Iniligtas niya ang iba; hindi niya kayang iligtas ang sarili niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pangunahing pari.” Ang Griyegong maramihan ay tumutukoy sa mga nangungunang awtoridad na pari, hindi sa maraming taong sabay-sabay na humahawak sa iisang katungkulan ng pinakapunong pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Gayon din
  rationale: Likas na panandang Filipino na nag-uugnay sa panunuya rito sa naunang panunuya at pinananatili ang paghahambing.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang salin para sa nangungunang mga awtoridad na pari; hindi nito ipinahihiwatig na sabay-sabay na may maraming taong humahawak sa iisang katungkulan ng pinakapunong pari.
- source_word: ἐμπαίζοντες
  choice: kinutya siya
  rationale: Ipinahahayag ang mapanlibak na panunuya. Idinagdag ang tahasang layong “siya” dahil malinaw sa konteksto na si Jesus ang kinukutya, at mas natural ito sa Filipino.
- source_word: πρὸς ἀλλήλους
  choice: habang nag-uusap-usap sila
  rationale: Pinananatili ang gantihang pagsasalita sa isa't isa at iniiwasang ipakahulugang sila mismo ang nagtutuyaan.
- source_word: μετὰ τῶν γραμματέων
  choice: ng mga punong pari at mga tagapagturo ng Kautusan
  rationale: Isinama ang dalawang pangkat bilang magkakasamang nanunuya. Ang “mga tagapagturo ng Kautusan” ay malinaw na makabagong katumbas ng mga eskriba sa kontekstong Judio.
- source_word: ἔλεγον
  choice: Sinabi nila
  rationale: Natural sa Filipino bilang panimula sa tuwirang sipi. Bagaman imperfect ang Griyego, hindi kailangang gawing lantad ang pagpapatuloy upang maipahayag ang eksena.
- source_word: Ἄλλους ἔσωσεν
  choice: Iniligtas niya ang iba
  rationale: Direkta at natural; pinananatili ng “iniligtas” ang malawak na saklaw at kabalintunaan ng σῴζω.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: hindi niya kayang iligtas ang sarili niya
  rationale: Pinananatili ang pahayag tungkol sa kakayahan at inuulit ang parehong salitang-ugat na “ligtas” gaya ng unang sugnay.
theological_decisions:
- issue: Magkatugmang salin ng σῴζω sa dalawang sugnay
  choice: iniligtas … iligtas
  alternative: sinagip … sagipin
  rationale: Pinananatili nito ang pag-uulit sa Griyego at ang teolohikal na kabalintunaan ng panunuya nang hindi nililimitahan ang kahulugan sa pisikal na pagsagip lamang.
- issue: Layon ng ἐμπαίζοντες
  choice: kinutya siya … habang nag-uusap-usap sila
  alternative: nangungutya sa isa't isa
  rationale: Ipinakikita ng konteksto na si Jesus ang kinukutya, samantalang ang πρὸς ἀλλήλους ay tumutukoy sa kanilang gantihang pagsasalita. Iniiwasan nitong ipahiwatig na ang mga pinuno ang nangungutya sa isa't isa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga punong pari” at “mga tagapagturo ng Kautusan” para sa madaling pagkaunawa ng karaniwang mambabasa. Ang padamdam ay nagpapakita ng mapanlibak na tono ng sinabi nang hindi nagdaragdag ng doktrinal na paliwanag.
