    issue: 'Hindi natural at posibleng nakalilitong paghahati sa tanong: “Bakit? Anong masama ang ginawa niya?”'
    rationale: Ang Τί γὰρ ἐποίησεν κακόν ay isang tanong. Ang γάρ ay maaaring idiomatikong ipahayag sa Tagalog sa pamamagitan ng “ba,” gaya ng “Ano bang masama ang ginawa niya?”; hindi kailangang gawing hiwalay na “Bakit?”.
  - severity: low
    issue: Hindi ganap na angkop ang “patuloy na sinasabi” sa nakaraang salaysay.
    rationale: Bagaman sinisikap nitong ipakita ang imperfect na ἔλεγεν, mas natural ang nakaraang salaysay na “sinabi naman.” Hindi obligado ang Tagalog na markahan ang lahat ng durative na nuwansang Griyego kung magiging hindi likas ang resulta.
