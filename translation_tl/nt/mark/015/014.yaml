  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: tl
  text: Ngunit sinabi naman ni Pilato sa kanila, “Ano bang masama ang ginawa niya?” Ngunit lalo pa silang sumigaw, “Ipako siya sa krus!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: patuloy na sinasabi
  rationale: Ipinahahayag ang di-ganap na aspekto ng imperfect, na maaaring tumukoy sa nagpapatuloy o paulit-ulit na pagsasalita, nang hindi tiyak na binibilang ang pag-uulit.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Bakit? Anong masama ang ginawa niya?
  rationale: Sa konteksto, humihingi ang tanong ng batayan sa paratang. Ang “Bakit?” ay natural na nagpapahiwatig sa puwersa ng γάρ, at ang “anong masama” ay nagpapanatili sa moral na bigat ng κακόν.
- source_word: κακόν
  choice: masama
  rationale: Karaniwang makabagong salitang Tagalog ito para sa bagay na masama o masamang gawa; hindi nito pinahihina ang moral na puwersa gaya ng maaaring mangyari sa “pagkakamali.”
- source_word: περισσῶς
  choice: lalo pa
  rationale: Malinaw at likas na ipinakikita ang pag-igting ng sigaw ng mga tao.
- source_word: ἔκραξαν
  choice: sumigaw
  rationale: Tuwirang inilalarawan ang malakas at hayagang pagsigaw ng mga tao sa natural na modernong Tagalog.
- source_word: Σταύρωσον αὐτόν
  choice: Ipako siya sa krus!
  rationale: Pinananatili ang tuwiran at mariing pautos kay Pilato; ito rin ang malinaw at nakaugaliang pagpapahayag ng crucifixion sa Tagalog.
- source_word: δὲ
  choice: Ngunit
  rationale: 'Ipinakikita ang pagsalungat sa parehong paglipat: mula sa hinihingi ng mga tao tungo sa pagtatanong ni Pilato, at mula sa tanong niya tungo sa lalo nilang pagsigaw.'
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Ginamit ang pamantayan at malawak na kinikilalang anyo ng pangalan sa Tagalog.
theological_decisions:
- issue: Bigat na moral ng κακόν sa tanong ni Pilato
  choice: “masama”
  alternative: “mali” o “pagkakamali”
  rationale: Ang “masama” ay angkop sa legal at moral na paratang sa konteksto at hindi pinalalambot ang hamon ni Pilato, ngunit hindi rin nagdaragdag ng doktrinal na pahayag.
- issue: Aspekto ng ἔλεγεν
  choice: “patuloy na sinasabi”
  alternative: “sinabi”
  rationale: Pinananatili nito ang durative o posibleng iterative na puwersa ng imperfect nang hindi nagpapasiya kung ilang ulit nagsalita si Pilato.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa pampublikong pagbasa. Pinili ang “Bakit? Anong masama ang ginawa niya?” bilang natural na tanong na nagpapanatili sa paliwanag na puwersa ng γάρ at sa moral na bigat ng κακόν. Walang talababa dahil naipahayag sa pangunahing teksto ang tunay na puwersa ng parirala nang hindi kinakailangang magbigay ng makabuluhang alternatibo.
