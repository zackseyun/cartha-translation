  verdict: revise
  source_fidelity: Ang “Ipako siya sa krus!” ay tumpak na katumbas ng Σταύρωσον αὐτόν, at ang “lalo pa silang sumigaw” ay mahusay na naghahayag ng περισσῶς ἔκραξαν. Gayunman, ang magkahiwalay na “Bakit? Anong masama ang ginawa niya?” ay hindi ang pinakamalinaw na paghahayag ng nag-iisang Griyegong tanong; maaaring magmukhang ang unang tanong ay hiwalay na pagtatanong kung bakit sila sumisigaw. Ang “Ano bang masama ang ginawa niya?” ay likas na pinagsasama ang idiomatikong puwersa ng γάρ at ang nilalaman ng tanong.
  naturalness: Ang “patuloy na sinasabi ni Pilato” ay mauunawaan ngunit gumagamit ng kasalukuyang aspekto sa isang salaysay na nasa nakaraan at bahagyang matigas sa pampublikong pagbasa. Ang simpleng “sinabi naman ni Pilato” ay mas likas na Tagalog at hindi maling isinasara ang saklaw ng imperfect, na maaaring maging pangkaraniwang pangsalaysay na nakaraan sa Tagalog.
  terminology: Ang “Pilato,” “masama,” “sumigaw,” at “Ipako siya sa krus” ay angkop, malinaw, at nasa dignipikadong modernong rehistro. Walang kailangang talababa; walang mahalagang tekstuwal o leksikal na ambigwidad na dapat iangkla rito.
