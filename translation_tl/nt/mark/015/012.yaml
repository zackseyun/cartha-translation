id: MRK.15.12
reference: Mark 15:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: tl
  text: Muling sumagot si Pilato sa kanila, “Kung gayon, ano ang gusto ninyong gawin ko sa taong tinatawag ninyong hari ng mga Judio?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa kanya na sinasabi ninyong hari ng mga Judio.”
    reason: Posible ring katawanin ang λέγετε bilang “sinasabi ninyo,” bagaman mas natural sa kontekstong ito ang “tinatawag ninyo.”
lexical_decisions:
- source_word: πάλιν
  choice: muling
  rationale: Ipinahihiwatig nito na nagsalita muli si Pilato sa nagpapatuloy na palitan ng usapan.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: sumagot
  rationale: Likas sa modernong Tagalog ang payak na “sumagot”; naipapahayag nito ang karaniwang pormulang pasalaysay nang hindi pilit na ginagaya ang participle at imperfect ng Griyego.
- source_word: Τί οὖν
  choice: Kung gayon, ano
  rationale: Pinananatili ng “kung gayon” ang paghihinuha ni Pilato mula sa naunang kahilingan ng mga tao.
- source_word: θέλετε ποιήσω
  choice: ang gusto ninyong gawin ko
  rationale: Malinaw at natural itong katumbas ng pagnanais na ipinapahayag ng θέλετε at ng kilos na hinihinging gawin ni Pilato.
- source_word: ὃν λέγετε
  choice: sa taong tinatawag ninyo
  rationale: Iniuugnay nito ang katawagang kasunod sa sinasabi ng mga kausap ni Pilato, nang hindi ipinapalagay na personal niyang pinagtitibay o itinatanggi ang titulo.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: hari ng mga Judio
  rationale: Ito ang malinaw at karaniwang salin ng pampolitikang titulong ginagamit sa salaysay ng paghihirap ni Jesus.
theological_decisions:
- issue: Kung ang pananalita ni Pilato ay nagpapatibay sa pagiging hari ni Jesus o inuulit lamang ang katawagang ginagamit ng mga tao
  choice: “sa taong tinatawag ninyong hari ng mga Judio”
  alternative: “sa kanya na sinasabi ninyong hari ng mga Judio”
  rationale: Inilalagay ng ὃν λέγετε ang titulo sa bibig ng mga kausap ni Pilato. Pinananatili ng salin ang retorikal na paglayo at hindi nito ginagawang personal na pagpapahayag ni Pilato ang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “kayo/ninyo” para sa pangmaramihang kausap at iniwasan ang sobrang literal na pormulang “sumagot at nagsabi.”
