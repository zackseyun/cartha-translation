  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: tl
  text: Ngunit muli silang sumigaw, “Ipako siya sa krus!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: sila
  rationale: Ang pangmaramihang artikulo ay ginamit bilang pangngalan at tumutukoy sa pangkat na nabanggit na sa konteksto. Likas sa Tagalog ang panghalip na “sila.”
- source_word: δὲ
  choice: Ngunit
  rationale: Ipinahihiwatig ng δέ ang banayad na pagsalungat sa naunang sinabi ni Pilato; malinaw at likas itong naipapahayag ng “Ngunit.”
- source_word: πάλιν
  choice: muli
  rationale: Tuwirang ipinapahayag ng πάλιν ang pag-uulit. Ang “muli” ay maikli, natural, at marangal sa modernong Tagalog.
- source_word: ἔκραξαν
  choice: sumigaw
  rationale: Ang κράζω ay tumutukoy sa malakas na pagsigaw. Ang “sumigaw” ay natural at pinananatili ang tindi ng kilos.
- source_word: Σταύρωσον
  choice: Ipako ... sa krus
  rationale: Ang anyo ay tuwirang pautos na isahan na nakatuon kay Pilato. Ang karaniwang ekspresyong Tagalog na “ipako sa krus” ay malinaw na naghahatid ng kahulugang crucify nang hindi ginagawang di-tuwiran ang utos.
- source_word: αὐτόν
  choice: siya
  rationale: Tuwirang layon ang panghalip at tumutukoy kay Jesus; ang “siya” ang natural na anyo sa konstruksiyong “ipako siya sa krus.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikling, mariing sigaw ng karamihan at ang direktang anyong pautos.
