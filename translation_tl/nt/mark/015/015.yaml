  to: Kaya si Pilato, dahil nais niyang pagbigyan ang karamihan,[a] ay pinalaya niya si Barabas para sa kanila. At matapos niyang ipahagupit si Jesus, ibinigay niya si Jesus upang ipako sa krus.
