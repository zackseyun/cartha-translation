  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: tl
  text: Kaya si Pilato, dahil nais niyang pagbigyan ang karamihan,[a] ay pinalaya niya si Barabas para sa kanila. At matapos niyang ipahagupit si Jesus, ibinigay niya si Jesus upang ipako sa krus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bigyang-kasiyahan ang karamihan” o “palugdan ang karamihan.” Sa literal, “gawin ang sapat para sa karamihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: dahil nais niyang
  rationale: Ipinahahayag ng participle ang kagustuhan o layunin ni Pilato; natural sa modernong Filipino ang pariralang ito at hindi nito pinalalabis ang antas ng pagpapasya.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: pagbigyan ang karamihan
  rationale: Idyoma itong literal na tumutukoy sa paggawa ng sapat para sa karamihan. Sa konteksto, nangangahulugan itong pagpapaubaya sa kanilang hinihingi; ang “pagbigyan” ay malinaw at likas sa Filipino habang pinananatili ang tensiyong moral.
- source_word: ἀπέλυσεν
  choice: pinalaya
  rationale: Sa kontekstong hudisyal, tumutukoy ito sa pagpapalaya sa isang bilanggo.
- source_word: αὐτοῖς
  choice: sa kanila
  rationale: Tumutukoy ang datibo sa karamihan na pinaboran ng pasiya ni Pilato.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: φραγελλώσας
  choice: matapos niyang ipahagupit
  rationale: Nauna ang kilos ng aorist participle sa pangunahing pandiwa. Ipinakikita ng “ipahagupit” na si Pilato ang nag-utos, hindi kinakailangang siya mismo ang humagupit.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa modernong Filipino.
- source_word: παρέδωκεν
  choice: ibinigay niya ito
  rationale: Ipinahahayag nito ang pagbibigay kay Jesus sa kapangyarihan ng iba. Malinaw ang “ibinigay,” at ang “ito” ay natural na panghalip na tumutukoy kay Jesus sa Filipino.
- source_word: ἵνα σταυρωθῇ
  choice: upang ipako sa krus
  rationale: Pinananatili ng “upang” ang layunin o nilalayong kinalabasan ng passive subjunctive; ang “ipako sa krus” ang malinaw at karaniwang salin ng pagkakapako sa krus.
theological_decisions:
- issue: Layunin ni Pilato sa τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Kumilos si Pilato upang pagbigyan ang hinihingi ng karamihan.
  alternative: Kumilos si Pilato upang bigyang-kasiyahan o palugdan ang karamihan.
  rationale: Ipinahihiwatig ng konteksto ang pampolitikang pagpapaubaya, hindi ang mabuting paglilingkod. Pinananatili ng “pagbigyan” ang moral na tensiyon nang hindi nagdaragdag ng paliwanag na wala sa Griyego.
- issue: Ahensiya sa φραγελλώσας
  choice: Iniutos ni Pilato na hagupitin si Jesus.
  alternative: Si Pilato mismo ang humagupit kay Jesus.
  rationale: 'Sa kontekstong panghukuman, natural na causative ang diwa: ipinagawa ni Pilato ang paghagupit. Iniiwasan ng “ipahagupit” ang maling impresyong siya mismo ang nagsagawa nito.'
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “karamihan” para sa ὄχλος, “ipahagupit” upang linawin ang iniutos na kilos, at “ipako sa krus” bilang pamilyar ngunit tumpak na parirala. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang tinutukoy nito.
