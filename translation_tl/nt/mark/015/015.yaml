  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng draft ang motibo ni Pilato, ang pagpapalaya kay Barabas, ang naunang pagpapahagupit, at ang layuning ipako si Jesus sa krus. Gayunman, ang panghalip na “ito” para kay Jesus ay hindi angkop sa modernong Filipino para sa isang taong tinutukoy nang may paggalang; mas tapat at malinaw na ulitin ang pangalan.
  naturalness: Karaniwan at malinaw ang “pagbigyan ang karamihan” at “ipahagupit.” Mas natural ang ayos na “pinalaya niya si Barabas para sa kanila” kaysa “pinalaya sa kanila si Barabas.”
  terminology: Ang “Pilato,” “Barabas,” “Jesus,” “karamihan,” “hagupit,” at “ipako sa krus” ay angkop sa modernong Filipino at sa rehistrong biblikal. Ang “ibinigay niya ito” ay papalitan upang maiwasan ang di-angkop na panghalip para kay Jesus.
  issues:
  - severity: medium
    issue: Ginamit ang “ito” bilang panghalip para kay Jesus.
    rationale: Sa modernong Filipino, karaniwang ginagamit ang “ito” para sa bagay o hayop at maaari itong maging di-magalang kapag tumutukoy sa tao. Ang pag-uulit ng “si Jesus” ay malinaw at mas angkop sa rehistro.
  - severity: low
    issue: Medyo di-likas ang ayos na “pinalaya sa kanila si Barabas.”
    rationale: Bagaman nauunawaan, mas tuwiran at natural ang “pinalaya niya si Barabas para sa kanila,” na nananatiling malapit sa datibong αὐτοῖς.
