  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: tl
  text: At tinanong siya ni Pilato, “Ikaw ba ang Hari ng mga Judio?”[a] At sumagot siya sa kanya, “Ikaw ang nagsasabi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga taga-Judea.” Dito, ang katawagang “Hari ng mga Judio” ay nagpapahayag ng karaniwang politikal na paratang na iniharap kay Pilato.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Iyan ang sabi mo.” Maikli ang sagot ni Jesus at may bahagyang kalabuan; hindi tahasang nakasaad sa Griyego ang “oo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: tinanong
  rationale: Karaniwang nangangahulugang magtanong o usisain. Ang “tinanong” ay natural sa makabagong Filipino at hindi nagpapalabis na para bang pormal na interogasyon ang tahasang ipinahihiwatig.
- source_word: Σὺ εἶ
  choice: Ikaw ba ang
  rationale: Ginagawang natural na tuwirang tanong sa Filipino, habang naipapakita ng “ikaw” ang diin ng tahasang panghalip sa Griyego.
- source_word: βασιλεὺς
  choice: Hari
  rationale: Pinananatili ang tiyak na maharlika at politikal na kahulugan ng salita; magiging labis na malawak ang “pinuno.”
- source_word: Ἰουδαίων
  choice: mga Judio
  rationale: Sa pagharap kay Pilato, ang “Hari ng mga Judio” ang nakikilalang anyo ng politikal na paratang. Posible rin sa ibang konteksto ang “mga taga-Judea,” ngunit hindi iyon ang pinakamalinaw dito.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Sumagot siya sa kanya
  rationale: Likas at malinaw na Filipino para sa participle at historical present ng Griyego. Hindi naipapasa nang natural sa Filipino ang eksaktong kayarian na “sumasagot... sinasabi niya” nang hindi nagiging alanganin.
- source_word: Σὺ λέγεις
  choice: Ikaw ang nagsasabi
  rationale: 'Malapit sa maikli at eliptikong Griyego at pinananatili ang bahagyang kalabuan: hindi ito ginagawang tahasang “Oo,” ngunit hindi rin pagtanggi.'
theological_decisions:
- issue: Lakas at diwa ng sagot ni Jesus na Σὺ λέγεις
  choice: “Ikaw ang nagsasabi.” bilang maikli at may sinasadyang puwang sa kahulugan
  alternative: “Oo, tama ang sinabi mo,” o “Iyan ang sabi mo.”
  rationale: Walang tahasang “oo” sa Griyego. Dapat panatilihin ang tensiyon kung ito ba ay isang maingat na pagkilala sa titulo o pagbabalik kay Pilato ng mismong pananalita, sa halip na gawing lubos at walang pasubaling pagsang-ayon o pagtanggi.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “Judio” bilang pangngalang karaniwan sa saling biblikal at ang “Hari” ay nilagyan ng malaking titik bilang bahagi ng titulong nasa tuwirang paratang. Inilagay ang mga pananda ng talababa sa mismong tekstong tinutukoy.
