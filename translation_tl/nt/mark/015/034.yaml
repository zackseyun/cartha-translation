id: MRK.15.34
reference: Mark 15:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: tl
  text: At nang ikasiyam na oras, sumigaw si Jesus nang malakas, “Eloi, Eloi, lema sabachthani?”[a] na ang salin ay, “Diyos ko, Diyos ko,[b] bakit mo ako pinabayaan?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa ilang manuskrito at sa maraming tradisyon ng pagsasalin, “lama sabachthani” ang anyo sa halip na “lema sabachthani.”
    reason: textual_variant
  - marker: b
    text: Umaalingawngaw ang mga salita ni Jesus sa Awit 22:1.
    reason: cross_reference
  - marker: c
    text: 'Maaari ring isalin: “Sa anong dahilan mo ako pinabayaan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: nang ikasiyam na oras
  rationale: Pinananatili ang paraan ng pagtukoy sa oras sa teksto sa halip na tuwirang gawing ‘alas tres ng hapon.’
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: sumigaw ... nang malakas
  rationale: Natural at malinaw itong nagsasaad ng malakas na pagsigaw ni Jesus nang hindi inuulit nang alanganin ang ‘tinig.’
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloi, Eloi, lema sabachthani?
  rationale: Pinananatili ang Semitikong pananalita na iniingatan mismo ni Marcos bago niya ibigay ang salin nito. Ang ‘lema’ ay sumusunod sa anyo ng SBLGNT.
- source_word: μεθερμηνευόμενον
  choice: na kung isasalin ay
  rationale: Tuwirang ipinapakita na ang kasunod na mga salita ang salin ng naunang Semitikong pahayag.
- source_word: εἰς τί
  choice: bakit
  rationale: Ang ‘bakit’ ang pinakanatural na modernong Tagalog para sa idyomang nagtatanong ng dahilan, habang hindi isinasara ang anumang mas malalim na pahiwatig ng tanong.
- source_word: ἐγκατέλιπές με
  choice: mo ako pinabayaan
  rationale: Ang ‘pinabayaan’ ay natural, marangal, at malinaw na naghahatid ng diwa ng pag-iwan o pagpapabaya, at tumutugma sa pamilyar na pananalita ng Awit 22:1.
theological_decisions:
- issue: Ugnayan ng sigaw ni Jesus sa Awit 22:1
  choice: Panatilihin itong tuwirang sigaw ng matinding pagkapabayaan habang ipinahihiwatig sa talababa ang kaugnayan sa Awit 22:1.
  alternative: Palambutin ang pahayag o ipaliwanag sa pangunahing teksto kung paano ito dapat unawain sa teolohiya.
  rationale: Inilalahad ng talata ang sigaw nang walang paliwanag sa doktrina. Dapat manatili ang bigat at tensiyon nito nang hindi dinaragdagan ng sektaryanong paliwanag.
- issue: Paglalahad ng Semitikong pananalita ni Jesus
  choice: Panatilihin ang transliterasyon at saka ibigay ang salin, gaya ng ayos ni Marcos.
  alternative: Ibigay lamang ang kahulugan sa Tagalog o gawing ‘Eli, Eli’ ayon sa mas pamilyar na anyo sa Mateo.
  rationale: Iniiwasan nitong pagtugmain si Marcos sa Mateo at iginagalang ang sinadyang dobleng paglalahad ng ebanghelista.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang ‘ikasiyam na oras’ upang masundan ang sinaunang pahayag ng oras, at ginamit ang natural na ‘bakit’ sa mismong sigaw.
