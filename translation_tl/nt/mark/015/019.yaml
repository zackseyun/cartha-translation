  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: tl
  text: At patuloy nilang hinahampas ng tambo ang kanyang ulo at dinuduraan siya, at lumuluhod sila at yumuyukod sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbibigay-pugay sa kanya” o “sumasamba sa kanya.” Ang pandiwang Griyego ay maaaring mangahulugang yumukod sa harap ng isang tao, magbigay-pugay, o sumamba; dito, mapanuyang ginagaya ng mga kawal ang pagpaparangal sa isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: patuloy nilang hinahampas
  rationale: Ang imperpektong anyo ay nagpapahiwatig ng paulit-ulit o nagpapatuloy na pananakit; likas sa Tagalog ang pariralang ito at hindi nito pinalalabis ang tindi.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: ang kanyang ulo
  rationale: Likas na pagpapahayag sa Tagalog ng pagmamay-aring isinasaad ng Griyegong panghalip.
- source_word: καλάμῳ
  choice: ng tambo
  rationale: Ang κάλαμος ay karaniwang tambo o bagay na yari o kahawig ng tambo; pinananatili rin nito ang ugnayan sa bagay na ginamit sa naunang tagpo ng pangungutya.
- source_word: ἐνέπτυον αὐτῷ
  choice: dinuduraan siya
  rationale: Ipinahihiwatig ng imperpekto ang paulit-ulit na kilos; natural at malinaw ito sa modernong Tagalog.
- source_word: τιθέντες τὰ γόνατα
  choice: lumuluhod sila
  rationale: Ang literal na 'inilalagay ang mga tuhod' ay isang idyoma para sa pagluhod; ibinigay ang payak na kahulugan.
- source_word: προσεκύνουν αὐτῷ
  choice: yumuyukod sa kanya
  rationale: Maaaring tumukoy ang προσκυνέω sa pagyukod, pagbibigay-pugay, o pagsamba. Sa konteksto ng mapanuyang paggaya sa parangal sa hari, ang 'yumuyukod' ay natural at hindi ipinapalagay na taimtim ang kanilang kilos.
theological_decisions:
- issue: Kahulugan ng προσκυνέω sa konteksto ng pangungutya
  choice: yumuyukod sa kanya
  alternative: sumasamba sa kanya / nagbibigay-pugay sa kanya
  rationale: Inilalarawan dito ang mapanuyang pagkilos ng mga kawal. Pinananatili ng 'yumuyukod' ang nakikitang kilos nang hindi ipinapalagay na tunay ang kanilang pagsamba, habang kinikilala sa talababa ang mas malawak na saklaw ng salitang Griyego.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maging natural ang daloy, habang pinanatili ang paulit-ulit na aspekto ng mga pandiwang Griyego at ang leksikal na lawak ng προσκυνέω sa talababa.
