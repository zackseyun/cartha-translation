  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: tl
  text: 'At[a] natupad ang Kasulatang nagsasabi: “At ibinilang siya sa mga lumalabag sa kautusan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wala ang talatang ito sa mga pinakamaagang manuskritong Griyego, kabilang ang ika-4 na siglong Codex Sinaiticus at Codex Vaticanus, at sa mga sinaunang saling Coptic. Gayunman, matatagpuan ito sa karamihan ng mga manuskrito sa tradisyong Byzantine at sa tradisyong Latin. Malamang na idinagdag ito ng mga tagakopya noong bandang huli upang iangkop sa Lucas 22:37, na sumisipi sa Isaias 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη (πληρόω)
  choice: natupad
  rationale: Sa konteksto ng pahayag ng Kasulatan, malinaw at likas na ipinahahayag ng pasibong anyo na nagkaroon ng katuparan ang nasusulat.
- source_word: ἀνόμων (ἄνομος)
  choice: mga lumalabag sa kautusan
  rationale: Pinananatili nito ang literal na diwa ng ‘mga walang kautusan/lumalabag sa kautusan’ at ang bigat ng sipi mula sa Isaias, sa halip na paliitin ang kahulugan sa ‘mga kriminal.’
- source_word: ἐλογίσθη (λογίζομαι)
  choice: ibinilang
  rationale: Tumpak nitong ipinahahayag ang pasibong diwa ng pagkakabilang o pagkakahanay niya sa isang pangkat.
- source_word: γραφή
  choice: Kasulatan
  rationale: Karaniwan, marangal, at angkop na salin para sa banal na kasulatang binabanggit ng teksto.
theological_decisions:
- issue: Pagkakakilanlan ng tinutukoy ng ‘siya’ sa sipi
  choice: Pinanatili ang panghalip na ‘siya’ nang walang dagdag na paliwanag sa talata.
  alternative: Tahasan itong gawing ‘si Jesus.’
  rationale: Ang Griyego ay gumagamit ng implicit na ikatlong panauhan sa pandiwa; sapat ang konteksto upang makilala ang tinutukoy, at ang hindi pagdaragdag ng pangalan ay nagpapanatili sa anyo ng sipi.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘Kasulatan’ bilang pamilyar na terminong biblikal at ang ‘mga lumalabag sa kautusan’ upang manatiling malinaw sa karaniwang mambabasa habang malapit sa Griyegong ἄνομοι.
