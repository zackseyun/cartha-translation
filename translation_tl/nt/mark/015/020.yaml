source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: tl
  text: At nang libakin nila siya, hinubad nila sa kanya ang damit na kulay-ube[a] at isinuot sa kanya ang sarili niyang mga damit. Pagkatapos, inilabas nila siya upang ipako sa krus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasuotang kulay-ube” o “balabal na kulay-ube.” Sa Griyego, “ang purpura” lamang ang tahasang sinabi; ipinahihiwatig ng konteksto na isa itong kasuotan.
    reason: lexical_alternative
  - marker: b
    text: O “para ipako nila siya sa krus.” Gumagamit ang Griyego ng sugnay na nagsasaad ng layunin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: libakin
  rationale: Tumutukoy ang pandiwa sa mapanlait na pangungutya. Ang “libakin” ay maikli, malinaw, at angkop sa marangal na tono ng salaysay.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: hinubad nila sa kanya ang damit na kulay-ube
  rationale: Ipinapahayag nito ang pag-aalis ng kasuotang inilagay sa kanya bilang kunwaring kasuotang maharlika. Ginawang tahasan ang ipinahihiwatig na kasuotan ng salitang πορφύραν.
- source_word: πορφύραν
  choice: damit na kulay-ube
  rationale: Literal na tumutukoy sa “purpura” o kulay-ube, na dito ay nangangahulugang kasuotan. Hindi ipinapalagay kung ito ay balabal o ibang tiyak na uri ng damit.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: isinuot sa kanya ang sarili niyang mga damit
  rationale: Pinananatili ng “sarili niyang” ang diin ng τὰ ἴδια at natural na ipinapakita ang pagpapanumbalik ng personal niyang kasuotan.
- source_word: ἐξάγουσιν
  choice: inilabas nila
  rationale: Historical present ito sa Griyego. Ang pangnagdaang anyo ay higit na natural sa tuloy-tuloy na salaysay sa Tagalog, habang nananatili ang custodial na pagkilos.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: upang ipako sa krus
  rationale: Malinaw na pinananatili ng “upang” ang layuning ipinahahayag ng ἵνα clause; ang “ipako sa krus” ang natural at tiyak na katumbas ng crucifixion sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa pagpapahiya kay Jesus bago ang pagpapako sa krus
  choice: Isinalaysay nang tuwiran ang panlalait, paghuhubad ng kunwaring maharlikang kasuotan, muling pagsusuot ng sarili niyang mga damit, at paglalabas sa kanya para ipako sa krus.
  alternative: Dagdagan ng paliwanag tungkol sa simbolismo ng pagkahari o sa teolohikal na kahulugan ng pagpapahiya.
  rationale: Walang tahasang teolohikal na pagpapaliwanag ang talata. Iniiwasan ng salin ang pagdaragdag ng interpretasyon habang pinananatili ang bigat ng pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “libakin” sa halip na mas kolokyal na “pagtawanan,” at “damit na kulay-ube” upang mapanatili ang di-tiyak na uri ng kasuotang ipinahihiwatig ng Griyego.
