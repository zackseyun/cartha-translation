source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: tl
  text: At dinala nila siya sa lugar na Golgota, na kung isasalin ay “Lugar ng Bungo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: dinala
  rationale: Ang aorist-like na salaysay sa natural na Tagalog ay gumagamit ng aspektong naganap. Hindi nito ipinapalagay na kinarga siya, di-gaya ng “buhat,” at malinaw nitong ipinapahayag ang pagdadala sa isang destinasyon.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: sa lugar na Golgota
  rationale: Pinananatili nito kapwa ang τόπον (“lugar”) at ang pangalang Golgota, habang ang “na” ay natural na panandang nag-uugnay sa lugar at sa pangalan nito nang hindi nagdaragdag ng salitang “tinatawag.”
- source_word: Γολγοθᾶν
  choice: Golgota
  rationale: Isinalin sa baybay na karaniwan at madaling bigkasin sa Filipino ang pangalang pantangi.
- source_word: μεθερμηνευόμενον
  choice: na kung isasalin ay
  rationale: Malinaw nitong ipinakikita na ang kasunod na parirala ay salin ng pangalang Golgota, at mas natural ito sa modernong Filipino kaysa sa literal na “na isinasalin.”
- source_word: Κρανίου Τόπος
  choice: Lugar ng Bungo
  rationale: Pinananatili ang hulma ng pariralang Griyego. Ang “ng” sa Filipino ay hindi sapilitang nagpapasya kung ang tinutukoy ay “isang bungo” o “ang bungo,” kaya napapanatili ang kawalan ng tiyak na artikulo sa Griyego nang hindi nangangailangan ng paliwanag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Golgota” at iniwasan ang sobrang literal o lipas na pananalita.
