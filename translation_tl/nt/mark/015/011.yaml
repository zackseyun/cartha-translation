  verdict: revise
  source_fidelity: Ang “sinulsulan” ay tumpak para sa ἀνέσεισαν, at ang “mga punong pari” ay wastong katumbas ng ἀρχιερεῖς. Gayunman, ang “na lamang” ay karaniwang nagdadagdag ng diwang ‘only’ at hindi kasinglinaw na naihahayag ang paghahambing/pagpili ng μᾶλλον. Ang “sa halip” ay mas direktang katumbas at pinananatiling di-tahasang binabanggit ang alternatibong nasa konteksto.
  naturalness: Mas natural at tiyak sa modernong Filipino ang “pulutong” para sa isang nagkakatipong ὄχλος; ang “karamihan” ay maaari ring mangahulugang mayorya. Maayos ang ayos na “upang sa halip ay palayain niya si Barabas.”
  terminology: Ang “mga punong pari,” “sinulsulan,” at “Barabas” ay angkop sa marangal ngunit makabagong rehistro. Walang doktrinal na terminong kailangang baguhin.
  issues:
  - severity: medium
    issue: Hindi sapat na naihahayag ng “na lamang” ang μᾶλλον.
    rationale: Mas madalas na nangangahulugan ang “na lamang” ng paglilimita (‘only’) kaysa ng pagpili sa isang tao kaysa sa ipinahihiwatig na alternatibo. Ang “sa halip” ay mas tumpak sa paghahambing na nasa Griyego.
  - severity: low
    issue: Maaaring malabo ang “karamihan” bilang katumbas ng τὸν ὄχλον.
    rationale: Sa modernong Filipino, maaari itong unawain bilang ‘mayorya.’ Ang “pulutong” ay mas malinaw na tumutukoy sa isang crowd.
  revised_text: Ngunit sinulsulan ng mga punong pari ang pulutong upang sa halip ay palayain niya si Barabas para sa kanila.[a][b]
