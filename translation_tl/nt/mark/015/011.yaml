base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: tl
  text: Ngunit sinulsulan ng mga punong pari ang pulutong upang sa halip ay palayain niya si Barabas para sa kanila.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inudyukan ang pulutong.” Ang pandiwang Griyego ay maaaring mangahulugang pukawin o sulsulan ang isang pangkat tungo sa ninanais na pagkilos.
    reason: lexical_alternative
  - marker: b
    text: O “mas nanaising palayain si Barabas.” Ipinahihiwatig ng salita ang pagpili kay Barabas kaysa sa alternatibong nasa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ngunit
  rationale: Ipinahahayag ng δέ ang banayad na pagsalungat sa naunang takbo ng salaysay; likas at malinaw dito ang “Ngunit.”
- source_word: ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan sa pamunuang makasaserdote sa Jerusalem at tumpak sa konteksto ng mga Ebanghelyo.
- source_word: ἀνέσεισαν
  choice: sinulsulan
  rationale: Ang ἀνασείω ay tumutukoy sa pag-udyok o pagpukaw sa isang pangkat upang kumilos; malinaw at natural sa makabagong Filipino ang “sinulsulan.”
- source_word: τὸν ὄχλον
  choice: ang karamihan
  rationale: Ang ὄχλος ay isang nagkakatipong pulutong; ang “karamihan” ay dignified at likas sa salaysay, bagaman maaari ring sabihing “mga tao.”
- source_word: ἵνα
  choice: upang
  rationale: Pinananatili ng “upang” ang ugnayang layunin na ipinahahayag ng ἵνα.
- source_word: μᾶλλον
  choice: na lamang
  rationale: Ipinakikita nito ang pagpili kay Barabas kaysa sa alternatibong ipinahihiwatig ng konteksto, nang hindi tahasang idinaragdag ang pangalang wala sa talata.
- source_word: τὸν Βαραββᾶν
  choice: si Barabas
  rationale: Itinatagalog ang baybay ng pangalang Βαραββᾶς ayon sa karaniwang anyo nito sa Filipino.
- source_word: ἀπολύσῃ
  choice: palayain niya
  rationale: Ang aorist subjunctive kasunod ng ἵνα ay nagpapahayag ng nilalayong mangyari; pinananatili ng panghalip na “niya” ang di-pinangalanang paksa, na si Pilato ayon sa konteksto.
- source_word: αὐτοῖς
  choice: para sa kanila
  rationale: Ipinahahayag ng datibo ang mga makikinabang sa pagpapalaya; mas natural sa Filipino ang “para sa kanila” kaysa “sa kanila” lamang.
