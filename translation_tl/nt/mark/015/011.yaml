translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “sinulsulan” para sa puwersa ng pandiwa at “na lamang” para sa likas na pagpapahayag ng paghahambing, nang hindi idinaragdag sa pangunahing teksto ang alternatibong hindi tahasang binanggit sa Griyego.
