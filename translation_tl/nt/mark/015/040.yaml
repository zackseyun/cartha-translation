  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: tl
  text: May mga babae ring nagmamasid mula sa malayo[a]. Kabilang sa kanila sina Maria Magdalena, Maria na ina ni Santiago na tinatawag na Maliit[b] at ni Joses[c], at Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatanaw mula sa malayo.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Griyego ay maaari ring mangahulugang “nakababata” o “di-gaanong kilala”; hindi tiyak kung edad, tangkad, o katayuan ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: Joses ang anyo ng pangalan sa Griyego rito; naiiba ito sa karaniwang anyo ng pangalang Jose.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: May mga babae rin
  rationale: Natural na salaysay sa Filipino na pinananatili ang pandagdag na diwa ng καί; hindi kailangang isalin nang hiwalay ang mahinang pang-ugnay na δέ.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: nakatanaw mula sa malayo
  rationale: Ipinahihiwatig ng θεωροῦσαι ang patuloy at mapanuring pagtingin, samantalang malinaw na pinananatili ng “mula sa malayo” ang relasyong pansaklaw ng ἀπό.
- source_word: ἐν αἷς
  choice: Kabilang sa kanila
  rationale: Likas na Filipino para sa pagtukoy sa ilang babae mula sa mas malaking pangkat.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Karaniwang anyo ng pangalan sa Filipino at malinaw na pantukoy sa taong mula sa Magdala.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria na ina ni Santiago na tinatawag na Nakababata at ni Joses
  rationale: Ginagawang malinaw na si Maria ang ina kapwa nina Santiago at Joses, habang ang dagdag na “tinatawag na” ay nagpapakitang ang τοῦ μικροῦ ay pantukoy kay Santiago at hindi tiyak na pahayag tungkol sa edad.
- source_word: Ἰακώβου
  choice: Santiago
  rationale: Ito ang nakaugaliang anyo sa Bibliyang Filipino para sa pangalang Ἰάκωβος sa Bagong Tipan.
- source_word: τοῦ μικροῦ
  choice: Nakababata
  rationale: Madaling maunawaang pantukoy sa modernong Filipino, ngunit nilalagyan ng talababa upang mapanatili ang tunay na kalabuan kung edad, laki, o katayuan ang tinutukoy.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: Pinananatili ang anyong Griyego na naiiba sa karaniwang anyo ng pangalang Jose, sa halip na itugma ito nang walang batayan.
- source_word: Σαλώμη
  choice: Salome
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Griyego.
theological_decisions:
- issue: Kahulugan ng pantukoy na τοῦ μικροῦ kay Santiago
  choice: “Nakababata” sa teksto, na may talababa tungkol sa ibang posibleng diwa
  alternative: “Maliit” o “Mas Mababa”
  rationale: Maaaring tumukoy ang μικρός sa edad, pangangatawan, o katayuan. Ang “Nakababata” ay likas na pantukoy sa Filipino, ngunit hindi dapat ipalagay na tiyak ang edad; kaya tahasang pinananatili sa talababa ang kalabuan.
- issue: Pagkakakilanlan ng Ἰωσῆτος
  choice: Panatilihin bilang “Joses”
  alternative: “Jose”
  rationale: Iniiwasang ipantay o iugnay ang taong ito sa ibang Joseph/Jose nang higit sa sinasabi ng anyong pangalan sa tekstong Griyego.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “nakatanaw” sa halip na mas teknikal na “nagmamasid,” at pinanatili ang mga pangalang tradisyonal nang kilala sa Filipino habang iginagalang ang pagkakaiba ng Joses sa Jose.
