  source_fidelity: Kailangang baguhin ang “Nakababata,” sapagkat ang τοῦ μικροῦ ay hindi tiyak na tumutukoy sa edad; maaari itong magpahiwatig ng kaliitan, mas mababang katayuan, o pagiging nakababata. Ang “nagmamasid” ay mas malinaw ding naghahatid ng patuloy na diwa ng θεωροῦσαι kaysa “nakatanaw.” Napananatili ng iba pang bahagi ang mga pangalan, ang pagiging ina ni Maria sa kapwa Santiago at Joses, at ang pangkat na pinagmulan ng “kabilang sa kanila.”
  naturalness: Ang binagong pangungusap ay natural na modernong Filipino at may marangal na register. Ang “Santiago na tinatawag na Maliit” ay bahagyang mas maingat kaysa isang karaniwang palayaw, ngunit ang ganitong pag-iingat ay kinakailangan upang hindi magpasya nang walang batayan sa kahulugan ng Griyego.
  terminology: Panatilihin ang “Maria Magdalena,” “Santiago,” “Joses,” at “Salome.” Ang “Joses” ay wastong pinananatiling naiiba sa “Jose,” alinsunod sa anyo ng Griyegong Ἰωσῆτος. Ang “Maliit” ay hindi pagtatakda ng eksaktong kahulugan kundi maingat na salin ng pantukoy, na nililinaw ng talababa.
