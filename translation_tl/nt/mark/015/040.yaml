revisions:
- from: May mga babae ring nakatanaw mula sa malayo[a]. Kabilang sa kanila sina Maria Magdalena, Maria na ina ni Santiago na tinatawag na Nakababata[b] at ni Joses[c], at Salome.
  to: May mga babae ring nagmamasid mula sa malayo[a]. Kabilang sa kanila sina Maria Magdalena, Maria na ina ni Santiago na tinatawag na Maliit[b] at ni Joses[c], at Salome.
  rationale: Pinalitan ang saling nagtatakda ng edad sa isang maingat na pantukoy na sinasamahan ng talababa upang mapanatili ang hindi tiyak na saklaw ng τοῦ μικροῦ. Pinalitan din ang pandiwa upang maipahayag ang patuloy na pagmamasid na nasa θεωροῦσαι. Walang binagong pagkakakilanlan, ugnayang pampamilya, o kahulugan ng talata.
