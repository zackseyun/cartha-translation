translation:
  language: tl
  text: Sapagkat alam ni Pilato na dahil sa inggit ay ipinasa na kay Pilato ng mga punong pari si Jesus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa paninibugho” o “udyok ng inggit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: alam niya
  rationale: Ang imperfect ay nagpapahiwatig ng nagpapatuloy o matatag na pagkaalam ni Pilato; natural itong ipinahahayag sa Tagalog bilang “alam niya.”
- source_word: γὰρ
  choice: Sapagkat
  rationale: Nagbibigay ito ng paliwanag o batayan sa naunang pahayag at malinaw na pinananatili ang ugnayang pangangatwiran.
- source_word: ὅτι
  choice: -ng
  rationale: Ang pang-angkop sa “alam niyang” ay likas na paraan sa Tagalog upang ipakilala ang nilalaman ng nalalaman niya.
- source_word: διὰ φθόνον
  choice: dahil sa inggit
  rationale: Ang διά na may accusative ay nagsasaad ng dahilan, at ang φθόνος ay pinakanatural na isaling “inggit” sa kontekstong ito.
- source_word: παραδεδώκεισαν
  choice: ibinigay ... sa kanyang kapangyarihan
  rationale: Ipinahahayag nito ang pagpapasa kay Jesus sa awtoridad ni Pilato sa isang kontekstong legal, nang hindi dinaragdagan ng tiyak na diwa ng pagtataksil.
- source_word: αὐτὸν
  choice: siya
  rationale: Tumutukoy ang panghalip kay Jesus bilang layon ng kilos.
- source_word: οἱ ἀρχιερεῖς
  choice: mga punong pari
  rationale: Karaniwang katawagan ito sa mga nangungunang awtoridad ng mga pari, hindi sa maraming indibidwal na mataas na pari.
theological_decisions:
- issue: Dahilan ng mga punong pari sa pagbibigay kay Jesus kay Pilato
  choice: Inggit ang kinikilalang dahilan sa pagtataya ni Pilato.
  alternative: Selos o paninibugho ang kanilang dahilan.
  rationale: Tahasang pinananatili ang pahayag ng teksto tungkol sa motibo nila, ngunit hindi ito pinalalawak o binibigyan ng dagdag na paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga punong pari” bilang pamilyar na terminong biblikal, at nilinaw ng “sa kanyang kapangyarihan” ang hudisyal na diwa ng pagpapasa kay Jesus kay Pilato.
