revisions:
- from: Sapagkat alam niyang dahil sa inggit ay ibinigay siya ng mga punong pari sa kanyang kapangyarihan.[a]
  to: Sapagkat alam ni Pilato na dahil sa inggit ay ipinasa na kay Pilato ng mga punong pari si Jesus.[a]
  rationale: Pinalitan ang hindi likas at dagdag na “sa kanyang kapangyarihan” ng “kay Pilato,” na nililinaw ang ipinahihiwatig ng konteksto nang hindi nagpapasok ng ideya ng kapangyarihan. Ginamit ang “ipinasa na” upang ilarawan ang legal na pagpapasa at ang naunang pagkaganap na ipinahihiwatig ng pluperfect. Pinanatili ang pangalan ni Pilato at ni Jesus para sa malinaw na modernong Tagalog.
  reviewer_model: gpt-5.6-terra
