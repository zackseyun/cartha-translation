base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: tl
  text: At pinagmamasdan nina Maria Magdalena at Maria na ina ni Joses kung saan siya inilagay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Maria ni Joses.” Kinikilala sa Griyego ang Mariang ito sa pamamagitan ng kaugnayan niya kay Joses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: At
  rationale: Mahinang pang-ugnay ito na nagpapatuloy sa salaysay ng paglilibing, hindi matinding pagsalungat.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalena
  rationale: Karaniwan at malinaw na anyo sa modernong Tagalog para sa pangalan at pantukoy sa Mariang mula sa Magdala.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Maria na ina ni Joses
  rationale: Relasyonal ang genitibong Ἰωσῆτος at malamang na kinikilala si Maria sa pamamagitan ng anak niyang si Joses, gaya ng paggamit sa Marcos; ginawang tahasan ang relasyon para sa likas na Tagalog.
- source_word: ἐθεώρουν
  choice: minamasdan
  rationale: Ipinahihiwatig ng imperpektong aspekto ang patuloy na pagmamasid sa nakaraang panahon; pinananatili ng “minamasdan” ang duratibong diwa.
- source_word: ποῦ
  choice: kung saan
  rationale: Likas na Tagalog para sa di-tuwirang sugnay na nagsasaad ng lugar.
- source_word: τέθειται
  choice: siya inilagay
  rationale: Ang perpektong pasibo ng τίθημι ay tumutukoy sa pagkakalagay na natapos na at may nananatiling resulta. Tahasang ginamit ang “siya” sapagkat si Jesus ang malinaw na ipinahihiwatig na paksa.
theological_decisions:
- issue: Hindi binanggit na paksa ng pandiwang pasibo
  choice: Tahasang “siya,” na tumutukoy kay Jesus
  alternative: “ang kanyang katawan” o pagpapanatiling di-tahasan ang tinutukoy
  rationale: Hindi tahasang binabanggit sa Griyego ang paksa dahil malinaw ito sa konteksto. Kailangan sa likas na Tagalog ang panghalip, at mas angkop ang “siya” kaysa gawing bagay lamang ang katawan ni Jesus.
- issue: Relasyon ni Maria kay Joses
  choice: “ina ni Joses” sa teksto, na may talababa sa mas literal na anyo
  alternative: “Maria ni Joses”
  rationale: Elliptical ang Griyego at hindi nito tahasang sinasabi ang “ina,” ngunit sinusuportahan ng konteksto at paggamit sa Marcos ang maternal na relasyon. Inilalantad ng talababa ang tunay na anyong mas literal at ang natitirang gramatikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas sa salaysay. Ginamit ang “minamasdan” upang mapanatili ang patuloy na kilos, at iniwasan ang labis na teknikal o makalumang pananalita.
