  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: tl
  text: Ang mga babaing ito, noong nasa Galilea siya, ay sumusunod sa kanya at naglilingkod sa kanya[a]. At marami pang ibang babaeng umahon kasama niya patungong Jerusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nag-aasikaso sa kanya” o “sumusuporta sa kanya.” Ang pandiwang Griyego ay maaaring tumukoy sa praktikal na paglilingkod o pagtustos ng pangangailangan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “umahon kasama niya patungong Jerusalem.” Karaniwang idyoma sa Biblia ang “umahon” kapag pumupunta sa Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Ang mga babaing ito
  rationale: Tumutukoy ang panghalip na pambalana sa mga babaeng pinangalanan sa naunang talata. Nililinaw ng pariralang ito ang ugnayan habang nananatiling natural sa Filipino.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: noong nasa Galilea siya
  rationale: Likas at tuwirang salin ito ng sugnay na panahunan at ng pariralang tumutukoy sa lugar.
- source_word: ἠκολούθουν
  choice: palaging sumusunod sa kanya
  rationale: Ipinahihiwatig ng imperfect ang nakagawiang kilos sa nakaraan, hindi lamang ang minsanang pagsunod. Inihahayag ito ng “palaging,” ayon sa konteksto.
- source_word: διηκόνουν αὐτῷ
  choice: naglilingkod sa kanya
  rationale: Saklaw ng διακονέω ang praktikal na paglilingkod, pag-aasikaso, o pagsuporta. Malawak at marangal ang “naglilingkod” nang hindi ipinapalagay na tumutukoy ito sa isang pormal na katungkulan.
- source_word: ἄλλαι πολλαὶ
  choice: Marami pang ibang babae
  rationale: Hayag sa anyong pambabae at sa konteksto na mga babae ang tinutukoy; natural itong sabihin nang tahasan sa Filipino.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: babaeng umahon kasama niya
  rationale: Pinananatili ng “umahon” ang tradisyonal at heograpikong idyoma ng pagpunta sa Jerusalem, at ipinakikita ng “kasama niya” ang magkasamang paglalakbay.
- source_word: εἰς Ἱεροσόλυμα
  choice: patungong Jerusalem
  rationale: Natural na Filipino ito para sa εἰς bilang pagtukoy sa patutunguhan.
theological_decisions:
- issue: Uri ng paglilingkod ng mga babae na ipinahihiwatig ng διηκόνουν
  choice: naglilingkod sa kanya
  alternative: nag-aasikaso sa kanya / sumusuporta sa kanya
  rationale: Pinananatili ng “naglilingkod” ang lawak ng salitang Griyego—maaaring praktikal na pag-aasikaso o suporta—nang hindi ito nililimitahan sa gawaing pantahanan o ginagawang pormal na katungkulan sa iglesya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palaging” upang ihayag ang nakagawiang kilos ng imperfect, at pinanatili ang “umahon” bilang idyomang biblikal na nauunawaan pa rin sa kasalukuyang wika.
