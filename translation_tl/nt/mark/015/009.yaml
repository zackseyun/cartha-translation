id: MRK.15.9
reference: Mark 15:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: tl
  text: Ngunit sumagot sa kanila si Pilato, “Gusto ba ninyong palayain ko para sa inyo ang Hari ng mga Judio[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang hari ng mga taga-Judea.” Ang salitang Griyego na Ἰουδαίων ay maaaring mangahulugang “mga Judio” o “mga taga-Judea,” ngunit sa nakapirming titulong ito sa salaysay ng pagpapakasakit, ang tradisyonal at angkop-sa-kontekstong salin ay “mga Judio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ngunit
  rationale: Nagpapahiwatig ng banayad na pagsalungat o pagliko sa salaysay habang tumutugon si Pilato sa naunang pangyayari.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: sumagot sa kanila si Pilato
  rationale: Likas sa makabagong Tagalog at malinaw na naipapahayag ang tugon; hindi na kailangang isalin nang hiwalay ang λέγων bilang “na sinasabi,” na magiging mabigat at di-likas.
- source_word: Θέλετε
  choice: Gusto ba ninyo
  rationale: Karaniwan at malinaw na pagpapahayag ng pagnanais sa modernong Tagalog, habang nananatiling angkop sa marangal na salaysay.
- source_word: ἀπολύσω ὑμῖν
  choice: palayain ko para sa inyo
  rationale: Sa kontekstong panghukuman, ang ἀπολύω ay pagpapalaya sa isang bilanggo; ipinapakita ng “para sa inyo” ang pakinabang o kahilingang tinutugunan ni Pilato.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  rationale: Pinananatili ang kinikilalang politikal at ironikong titulo sa salaysay ng pagpapakasakit. Ang “mga Judio” ang natural at tradisyonal na katumbas sa pariralang ito.
theological_decisions:
- issue: Pagpapakahulugan sa titulong τὸν βασιλέα τῶν Ἰουδαίων
  choice: ang Hari ng mga Judio
  alternative: ang hari ng mga taga-Judea
  rationale: Maaaring tumukoy ang Ἰουδαῖοι sa mga Judio o mga taga-Judea, ngunit dito ay bahagi ito ng nakapirming titulong politikal sa salaysay. Pinananatili ng “Hari ng mga Judio” ang pamilyar at angkop-sa-kontekstong anyo nang hindi ginagawang tahasang doktrinal na pahayag ang pananalita ni Pilato.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “Gusto ba ninyo” bilang malinaw na pang-araw-araw na pananalita, samantalang pinanatili ang pormal na bigat ng titulong “Hari ng mga Judio.”
