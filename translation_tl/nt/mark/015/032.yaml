  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: tl
  text: “Bumaba ngayon mula sa krus ang Mesiyas[a], ang Hari ng Israel, upang makita namin at maniwala kami.” Patuloy rin siyang inalipusta ng mga kasabay niyang ipinako sa krus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Cristo.” Ang salitang Griyego na Χριστός ay isang titulong nangangahulugang ang Pinahiran.
    reason: alternative_reading
  - marker: b
    text: Ang “inalipusta” ay maaari ding isaling “nilait” o “dinusta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: ang Mesiyas
  rationale: Ginamit bilang titulong maharlika at kaugnay ng pinahiran ng Diyos sa mapanuyang hamon; mas malinaw itong naihahatid ng “Mesiyas” kaysa sa transliterasyong “Cristo.”
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: ang Hari ng Israel
  rationale: Tuwirang pinananatili ang titulo at ang ugnayan nito sa pangungutyang nakatuon sa paghahari ni Jesus.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: Bumaba ngayon mula sa krus
  rationale: Likas na utos sa Filipino na pinananatili ang mapanuyang hamon, ang agarang diin ng νῦν, at ang pinagmumulan ng pagbaba.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: upang makita namin at maniwala kami
  rationale: Pinananatili ang layunin ng ἵνα at ang dalawang pandiwang walang idinaragdag na tahasang layon sa “maniwala,” gaya ng Griyego.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: mga ipinakong kasama niya sa krus
  rationale: Malinaw na ipinahahayag na ang tinutukoy ay ang mga kasabay niyang ipinako sa krus, nang hindi dinaragdagan ang teksto ng hindi kailangang pagtukoy.
- source_word: ὠνείδιζον αὐτόν
  choice: Nilalait din siya
  rationale: Ang “nilalait” ay likas at madaling maunawaang katumbas ng patuloy na pang-iinsulto o pag-alipusta; ipinahihiwatig ng ayong pangungusap ang nagpapatuloy na kilos, at isinasalin ng “din” ang καί.
theological_decisions:
- issue: Pagsasalin sa Χριστός sa konteksto ng pangungutya
  choice: Mesiyas
  alternative: Cristo
  rationale: Dito, ang Χριστός ay malinaw na titulong maharlika at mesiyaniko, na ipinaliliwanag pa ng “Hari ng Israel.” Pinananatili ng “Mesiyas” ang kahulugan ng titulo nang hindi ginagawang pangalang pantangi lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyo ng mapanuyang hamon at hindi nilagyan ng tahasang layon ang “maniwala” upang huwag paliitin ang saklaw ng Griyego.
