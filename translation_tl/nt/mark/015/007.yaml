  variant: modern Filipino Tagalog
source:
  edition: SBLGNT
  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: tl
  text: Ang lalaking tinatawag na Barabas ay nakagapos kasama ng mga rebelde na nakapatay sa paghihimagsik[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng mga naghihimagsik” / “sa pag-aalsa.” Magkaugnay na mga salita sa Griyego ang ginamit para sa mga kasangkot sa isang pag-aalsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ay
  rationale: Ang ἦν ay likas na ipinahahayag ng panandang panaguri na “ay”; hindi na nilagyan ng hiwalay na katumbas ang banayad na pang-ugnay na δέ upang maiwasan ang di-likas na pagsisimula.
- source_word: ὁ λεγόμενος
  choice: ang lalaking tinatawag na
  rationale: Malinaw at likas itong pagkakakilanlan sa tao nang walang mapanghamak na pahiwatig.
- source_word: Βαραββᾶς
  choice: Barabas
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Filipino.
- source_word: μετὰ τῶν στασιαστῶν
  choice: kasama ng mga rebelde
  rationale: Ang στασιασταί ay mga kalahok sa isang pag-aalsa; ang “mga rebelde” ay malinaw at pangkaraniwang tawag sa modernong Filipino.
- source_word: δεδεμένος
  choice: nakagapos
  rationale: Pinananatili nito ang konkretong diwa ng perpektong pasibong participle—nakatali o nakagapos—sa halip na gawing mas pangkalahatang “nakabilanggo.”
- source_word: οἵτινες
  choice: na
  rationale: Likas na inuugnay ng “na” ang sugnay na naglalarawan sa mga rebelde.
- source_word: ἐν τῇ στάσει
  choice: sa paghihimagsik
  rationale: Ipinahahayag nito ang pampolitika at marahas na pag-aalsa, hindi lamang karaniwang kaguluhan.
- source_word: φόνον πεποιήκεισαν
  choice: nakagawa ng pagpatay
  rationale: Ipinakikita ang naunang natapos na pagkilos at pinananatili ang di-tiyak na anyo ng φόνον, na maaaring tumukoy sa pagpatay o murder nang hindi nagdaragdag kung sino o ilan ang pinatay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pag-uulit ng magkaugnay na diwa sa “mga rebelde” at “paghihimagsik,” gaya ng στασιαστῶν at στάσει sa Griyego; inilagay ang talababa upang ipakita ang alternatibong bokabularyo.
